chapter: 12
draft: true

verses:
  1: "ダビデがまだ、サウルの子[こ]キシュの手[て]を逃[のが]れてツィクラグに身[み]を潜[ひそ]めていたとき、彼のもとへ来[き]た者[もの]たちは次[つぎ]のとおりである。彼らは勇士[ゆうし]たちのうちにあって、戦[いくさ]で助[たす]ける者[もの]たちであった。"
  2: "彼らは弓[ゆみ]を右手[みぎて]にも左手[ひだりて]にも使[つか]い、石[いし]を投[な]げ、矢[や]を射[い]る者[もの]たちであった。彼らはサウルの兄弟[きょうだい]たちのうちの、ベニヤミン[びと]から出[で]た者[もの]である。"
  3: "長[かしら]はアヒエゼル、次[つぎ]はギベア人[じん]アスマの子[こ]ヨアス、アスモトの子[こ]らヨエルとヨファレト、ベルキヤ、アナトト人[びと]イエウル。"
  4: "サマヤはガバオン人[じん]で、三十人[さんじゅうにん]のうちの勇士[ゆうし]、三十人の上[うえ]に立[た]つ者[もの]であった。エレミヤ、イエジエル、ヨアナン、ガダラ人[じん]ヨザバド。"
  5: "エリアザイ、ヤリムト、バアルヤ、サマリヤ、ハリフ人[じん]サファテヤ。"
  6: "エルカナ、イエシュニ、オズリエル、ヨアザル、イエスボアム、すなわちコル人[びと]。"
  7: "またエリアとゼバデヤ、イラアムの子[こ]ら、ゲドルの子[こ]ら。"
  8: "ガド人[じん]のうちから、ダビデのもとへ離[はな]れて荒野[こうや]へ来[き]た者[もの]たちがいた。彼らは強[つよ]く、戦[いくさ]の備[そな]えをした勇[いさ]ましい者[もの]たちで、大盾[おおだて]と槍[やり]を持[も]ち、その顔[かお]は獅子[しし]の顔のようで、山[やま]の上[うえ]を駆[か]ける羚羊[かもしか]のように速[はや]かった。"
  9: "長[かしら]はエゼル、第二[だいに]はアブデヤ、第三[だいさん]はエリアブ、"
  10: "第四[だいし]はマセマンナ、第五[だいご]はエレミヤ、"
  11: "第六[だいろく]はエテイ、第七[だいしち]はエリアブ、"
  12: "第八[だいはち]はヨアナン、第九[だいきゅう]はエリアゼル、"
  13: "第十[だいじゅう]はエレミヤ、第十一[だいじゅういち]はマハバンナイ。"
  14: "これらの者[もの]はガドの子[こ]らから出[で]た軍勢[ぐんぜい]の長[かしら]たちで、小[ちい]さい者[もの]は百人[ひゃくにん]の上[うえ]に、大[おお]きい者は千人[せんにん]の上[うえ]に立[た]った。"
  15: "彼らは第一[だいいち]の月[つき]にヨルダン川[がわ]を渡[わた]った者[もの]たちである。そのとき川はすべての岸[きし]にあふれていた。彼らは東[ひがし]から西[にし]まで、谷[たに]に住[す]む者[もの]をすべて追[お]い払[はら]った。"
  16: "ベニヤミン[びと]の子[こ]らとユダ人[じん]のうちからも、ダビデを助[たす]けるために来[き]た者[もの]たちがいた。"
  17: "ダビデは彼らを迎[むか]えに出[で]て言[い]った。「もしあなたがたが平和[へいわ]のうちに、わたしを助[たす]けようとして来[き]たのなら、わたしの心[こころ]はあなたがたと一[ひと]つになる。しかし、もしわたしを敵[てき]に渡[わた]そうとして、偽[いつわ]りをもって来たのなら、わたしたちの父祖[ふそ]の神[かみ]がご覧[らん]になり、裁[さば]いてくださるように。」"
  18: "すると三十人[さんじゅうにん]の長[かしら]アマサイの上[うえ]に霊[れい]が降[ふ]り、彼は言[い]った。「ダビデ、エッサイの子[こ]よ、行[い]け、あなたも、あなたの民[たみ]も。あなたに平和[へいわ]あれ。あなたの助[たす]け手[て]たちに平和あれ。あなたの神[かみ]があなたを助[たす]けられたからである。」ダビデは彼らを受[う]け入[い]れ、軍[ぐん]の長[かしら]たちとした。"
  19: "マナセ[びと]のうちからも、ペリシテ人[じん]がサウルとの戦[いくさ]のために来[き]たとき、ダビデのもとへ移[うつ]った者[もの]たちがいた。しかしダビデは彼らを助[たす]けなかった。ペリシテ人の将軍[しょうぐん]たちが相談[そうだん]して、「あの者[もの]たちの頭[あたま]に懸[か]けて、彼は自分[じぶん]の主[しゅ]サウルのもとへ帰[かえ]るだろう」と言[い]ったからである。"
  20: "彼がツィクラグへ行[い]ったとき、マナセのうちからエドナ、ヨザバト、ヨディエル、ミカエル、ヨシャベト、エリムト、セラテイが彼のもとへ来[き]た。彼らはマナセの千人隊[せんにんたい]の長[かしら]たちである。"
  21: "彼らはダビデとともに襲撃隊[しゅうげきたい]に向[む]かって戦[たたか]った。彼らはみな力[ちから]ある勇士[ゆうし]で、軍[ぐん]のうちで力[ちから]ある者[もの]として率[ひき]いたからである。"
  22: "彼らは日[ひ]ごとにダビデのもとへ来[き]て、大[おお]きな軍勢[ぐんぜい]となり、神[かみ]の軍勢のようになった。"
  23: "さて、これが軍勢[ぐんぜい]の長[かしら]たちの名[な]である。彼らは主[しゅ]の言葉[ことば]に従[したが]って、サウルの王国[おうこく]を彼[かれ]に移[うつ]すために、ヘブロンでダビデのもとへ来[き]た者[もの]たちである。"
  24: "ユダの子[こ]らは、大盾[おおだて]と槍[やり]を持[も]つ者[もの]が六千八百人[ろくせんはっぴゃくにん]で、戦[いくさ]の備[そな]えをした者[もの]たちであった。"
  25: "シメオン[びと]の子[こ]らのうち、戦[いくさ]の備[そな]えをした力[ちから]ある者[もの]は七千一百人[ななせんひゃくにん]であった。"
  26: "レビ人[びと]の子[こ]らのうちからは四千六百人[よんせんろっぴゃくにん]。"
  27: "またヨヤダはアロンの部族[ぶぞく]の長[かしら]で、彼とともに三千七百人[さんぜんななひゃくにん]がいた。"
  28: "またサドクは若[わか]くて力[ちから]ある者[もの]で、その父[ちち]の家[いえ]の長[かしら]たちは二十二人[にじゅうににん]であった。"
  29: "ベニヤミン[びと]の子[こ]ら、サウルの兄弟[きょうだい]たちのうちからは三千人[さんぜんにん]。しかし彼らの大部分[だいぶぶん]は、なおサウルの家[いえ]の番[ばん]をしていた。"
  30: "エフライム[びと]の子[こ]らのうちからは二万八百人[にまんはっぴゃくにん]。彼らは力[ちから]ある者[もの]で、その氏族[しぞく]の家[いえ]ごとに名[な]を知[し]られた者[もの]たちであった。"
  31: "マナセ[びと]の半[はん]部族[ぶぞく]のうちからは一万八千人[いちまんはっせんにん]。彼らは名[な]を呼[よ]ばれて、ダビデを王[おう]とするために来[き]た者[もの]たちである。"
  32: "イッサカル[びと]の子[こ]らのうちからは、時[とき]をわきまえ、イスラエルが何[なに]をなすべきかを知[し]っている者[もの]が二百人[にひゃくにん]、その長[かしら]たちであった。その兄弟[きょうだい]たちはみな、彼らの言葉[ことば]に従[したが]った。"
  33: "ゼブルン[びと]のうちからは、あらゆる武具[ぶぐ]を備[そな]えて戦[いくさ]の備えに出[で]る者[もの]が五万人[ごまんにん]。彼らはダビデを助[たす]けるために、二[ふた]つ心[ごころ]なく来[き]た。"
  34: "ナフタリ[びと]のうちからは、長[かしら]たちが千人[せんにん]、大盾[おおだて]と槍[やり]を持[も]つ者[もの]が彼らとともに三万七千人[さんまんななせんにん]。"
  35: "ダン[びと]のうちからは、戦[いくさ]の備[そな]えを整[ととの]える者[もの]が二万八千六百人[にまんはっせんろっぴゃくにん]。"
  36: "アシェル[びと]のうちからは、戦[いくさ]に出[で]て助[たす]ける者[もの]が四万人[よんまんにん]。"
  37: "ヨルダン川[がわ]の向[む]こう側[がわ]、ルベン[びと]、ガド[びと]、マナセの半[はん]部族[ぶぞく]のうちからは、あらゆる武具[ぶぐ]を備[そな]えた者[もの]が十二万人[じゅうにまんにん]。"
  38: "これらはみな戦士[せんし]で、平和[へいわ]な心[こころ]で備[そな]えを整[ととの]えてヘブロンへ来[き]、ダビデを全[すべ]てのイスラエルの上[うえ]の王[おう]とした者[もの]たちである。イスラエルの残[のこ]りの者[もの]もまた、心[こころ]を一[ひと]つにしてダビデを王としようとしていた。"
  39: "彼らはそこに三日[みっか]の間[あいだ]とどまり、食[た]べ、飲[の]んだ。彼らの兄弟[きょうだい]たちが彼らのために用意[ようい]しておいたからである。"
  40: "また、彼らに近[ちか]い者[もの]たち、イッサカル、ゼブルン、ナフタリに至[いた]るまでの人[ひと]々[びと]は、らくだ、ろば、騾馬[らば]、牛[うし]に食[た]べ物[もの]を積[つ]み、小麦粉[こむぎこ]、干[ほ]しいちじくの菓子[かし]、干[ほ]しぶどう、ぶどう酒[しゅ]、油[あぶら]、牛[うし]や羊[ひつじ]を多[おお]く運[はこ]んできた。イスラエルに喜[よろこ]びがあったからである。"

notes:
  1: "οἱ ἐλθόντες — пришедшие (ὁ ἐλθών). συνεχομένου ἀπὸ προσώπου Σαουλ — «когда он был тесним от лица Саула», т.е. ещё скрывался от него (συνέχω — сжимать, теснить). ἐν τοῖς δυνατοῖς βοηθοῦντες — «среди сильных помогающие» (слав. «от сильных помогающе»). δυνατός — сильный, храбрый (勇士)."
  2: "τόξῳ ἐκ δεξιῶν καὶ ἐξ ἀριστερῶν — «луком справа и слева», т.е. владевшие луком обеими руками (слав. «напрязающе лук десными и шуими руками»). σφενδονῆται ἐν λίθοις καὶ τόξοις — пращники камнями и луками: перечислены два рода оружия. ἐκ τῶν ἀδελφῶν Σαουλ ἐκ Βενιαμιν — из братьев Саула, из Вениамина."
  3: "ὁ ἄρχων — глава, начальник. Γεβωθίτης — «гевофянин» (слав. «гавафита»), т.е. из Гивы (ギベア人). Ασμα — Асма, Ασμωθ — Асмоф (имена отца; слав. «самаа», «замофовы»). Βερχια — Берхия. Ιηουλ — Иеул. Αναθωθι — анатофянин (アナトト人, как в корпусе)."
  4: "Σαμαιας ὁ Γαβαωνίτης — Самаия Гибеонитянин (ガバオン人; слав. «гаваонитин»). δυνατὸς ἐν τοῖς τριάκοντα καὶ ἐπὶ τῶν τριάκοντα — «сильный в тридцати и над тридцатью», т.е. один из тридцати и их начальник (слав. «посреде тридесятих и над тридесятию»). Ιερμιας — Иеремия (здесь не пророк). Ιεζιηλ — Иезиил. Ιωαναν — Иоанан. Ιωζαβαδ ὁ Γαδαραθι — Иозавад Гедерафин (ガダラ人; слав. «гадарафитин»). В csl и ru gr 12:4 и 12:5 слиты в один стих (слав. 12:4), поэтому здесь наша нумерация совпадает с csl."
  5: "Ελιαζαι — Елиазай. Ιαριμουθ — Иаримуф. Βααλια — Ваалия. Σαμαρια — Самария. Σαφατια ὁ Χαραιφι — Сафатия Харифиянин (слав. «аруфин»; Χαραιφι — от местности)."
  6: "Ηλκανα — Елкана. Ιησουνι — Иешуни. Οζριηλ — Озриил. Ιωαζαρ — Иоазар. Ιεσβοαμ — Иесбоам. οἱ Κορῖται — кореяне (コル人; слав. «коритяне»), потомки Корея."
  7: "Ελια καὶ Ζαβαδια — Елия и Завадия. υἱοὶ Ιρααμ υἱοὶ τοῦ γεδωρ — «сыны Ираама, сыны Гедор» (слав. «сынове иероамли, иже от гедора»); вероятно, генеалогическая формула, а не два разных отца."
  8: "ἀπὸ τοῦ Γαδδι ἐχωρίσθησαν — «от Гадди отделились» (слав. «от гадди прибегоша»). ἄνδρες παρατάξεως πολέμου — мужи боевого строя. αἴροντες θυρεοὺς καὶ δόρατα — носящие большие щиты и копья. πρόσωπον λέοντος — лицо льва. κοῦφοι ὡς δορκάδες — быстрые, как серны (δορκάς — косуля, серна); τῷ τάχει — по быстроте. Слав. в скобках «егда таяшеся» — редакционное пояснение, не внесено."
  9: "Αζερ ὁ ἄρχων — Езер, глава (слав. «азер в первых»). Αβδια — Авдия. Ελιαβ — Елиав. Далее имена идут по порядку."
  10: "Μασεμαννη — Масеманна (слав. «масман»; в МТ Мишманна). Ιερμια — Иеремия (второй в списке)."
  11: "Εθθι — Еффи (слав. «иеффиа»; в Синод. Афай). Имя тёмное, передано транслитерацией с греческого."
  12: "Ιωαναν — Иоанан. Ελιαζερ — Елиазер (слав. «ельзавель» — искажённая форма; в Синод. Елзавад)."
  13: "Ιερμια — Иеремия (второй в списке). Μαχαβανναι — Махаваннай (слав. «махавенай»)."
  14: "ἄρχοντες τῆς στρατιᾶς — начальники войска. εἷς τοῖς ἑκατὸν μικρὸς καὶ μέγας τοῖς χιλίοις — «один над сотней, малый и великий над тысячами», т.е. меньшие были сотниками, большие — тысячниками."
  15: "οἱ διαβάντες τὸν Ιορδάνην — перешедшие Иордан. ἐν τῷ μηνὶ τῷ πρώτῳ — в первом месяце (нисан, время разлива). πεπληρωκὼς ἐπὶ πᾶσαν κρηπῖδα — «наполнившийся до всякого основания», т.е. вышедший из берегов (κρηπίς — основание, берег). αὐλῶνας — долины, ущелья."
  16: "ἦλθον … εἰς βοήθειαν — пришли на помощь (слав. «на помощь давиду»). = gr-lxx-byz 12:17."
  17: "εἰς ἀπάντησιν — навстречу. εἴη μοι καρδία καθ᾽ ἑαυτὴν ἐφ᾽ ὑμᾶς — «да будет сердце моё само по себе на вас», т.е. единодушно с вами (слав. «да будет сердце мое такожде к вам»). οὐκ ἐν ἀληθείᾳ χειρός — «не в истине руки»: тёмное место, понято как «без правды, коварно»; ἐλέγξαιτο — да обличит (слав. «да судит»)."
  18: "πνεῦμα ἐνέδυσε — «дух облёк» (слав. «облече дух»), т.е. Дух сошёл на Амасая. Πορεύου καὶ ὁ λαός σου — «иди и народ твой». εἰρήνη εἰρήνη σοι — двойное приветствие миром. κατέστησεν ἄρχοντας τῶν δυνάμεων — поставил их начальниками войск (слав. «князей сил»)."
  19: "προσεχώρησαν — перешли, примкнули (προσχωρέω). ἀλλόφυλοι — иноплеменники, т.е. филистимляне (ペリシテ人). οὐκ ἐβοήθησεν — Давид не помог им. ἐν βουλῇ ἐγένετο — «было в совете», т.е. по решению. Ἐν ταῖς κεφαλαῖς τῶν ἀνδρῶν ἐκείνων — «на головах мужей тех», т.е. ценой наших голов; ἐπιστρέψει — вернётся (к Саулу)."
  20: "ἐν τῷ πορευθῆναι αὐτὸν εἰς Σωκλαγ — при возвращении его в Секелаг. Εδνα — Една. Ιωζαβαθ — Иозавад. Ιωδιηλ — Иодиил. Μιχαηλ — Михаил. Ιωσαβεθ — Иосавеф. Ελιμουθ — Елимуф. Σελαθι — Селафий. ἀρχηγοὶ χιλιάδων — тысяченачальники."
  21: "συνεμάχησαν — вместе воевали (συμμαχέω). ἐπὶ τὸν γεδδουρ — «против отряда, полчища» (γεδδούρ — набег, отряд; слав. «на полчище геддуров»). δυνατοὶ ἰσχύος — сильные крепостью. ἡγούμενοι ἐν τῇ δυνάμει — вожди в войске."
  22: "ἡμέραν ἐξ ἡμέρας — «день ото дня» (слав. «на всяк день»). εἰς δύναμιν μεγάλην — «в силу великую», т.е. в большое войско. ὡς δύναμις θεοῦ — как войско Божие (слав. «аки сила Божия»)."
  23: "τῶν ἀρχόντων τῆς στρατιᾶς — начальников войска. τοῦ ἀποστρέψαι — чтобы обратить, передать (слав. «возвратят»). κατὰ τὸν λόγον κυρίου — по слову Господню."
  24: "θυρεοφόροι καὶ δορατοφόροι — щитоносцы и копьеносцы. ἓξ χιλιάδες καὶ ὀκτακόσιοι — 6800. δυνατοὶ παρατάξεως — способные к строю (слав. «крепцы ко ополчению»)."
  25: "τῶν υἱῶν Συμεων — из сынов Симеона (シメオン). ἑπτὰ χιλιάδες καὶ ἑκατόν — 7100. εἰς παράταξιν — для ополчения."
  26: "τῶν υἱῶν Λευι — из сынов Левия (レビ人). τετρακισχίλιοι ἑξακόσιοι — 4600. Здесь начинается счёт левитов, ниже — род Аарона."
  27: "Ιωαδαε ὁ ἡγούμενος τῷ Ααρων — Иодай (ヨヤダ, как в 3 Цар), предводитель у Аарона, т.е. глава рода Ааронова (слав. «князь от колена аароня»). τρεῖς χιλιάδες ἑπτακόσιοι — 3700."
  28: "Σαδωκ νέος δυνατὸς ἰσχύι — Садок, юный, крепкий силой (слав. «отрок крепкий силою»). πατρικὴ οἰκία — отчий дом. ἄρχοντες εἴκοσι δύο — 22 начальника."
  29: "τῶν ἀδελφῶν Σαουλ — братьев Саула. τὸ πλεῖστον αὐτῶν — большая часть их. ἀπεσκόπει τὴν φυλακήν — «наблюдал стражу» (слав. «наблюдаше стражбу»), т.е. нёс стражу при доме Саула и держался его."
  30: "ἀπὸ υἱῶν Εφραιμ — из сынов Ефрема (エフライム). εἴκοσι χιλιάδες καὶ ὀκτακόσιοι — 20 800. ἄνδρες ὀνομαστοὶ κατ᾽ οἴκους πατριῶν — мужи именитые по домам отцов (слав. «по домом отечеств их»)."
  31: "τοῦ ἡμίσους φυλῆς Μανασση — половины колена Манассии (半部族). δέκα ὀκτὼ χιλιάδες — 18 000. οἳ ὠνομάσθησαν ἐν ὀνόματι — «названные по имени» (слав. «иже нарекошася именем»), т.е. поименно. τοῦ βασιλεῦσαι τὸν Δαυιδ — чтобы воцарить Давида."
  32: "γινώσκοντες σύνεσιν εἰς τοὺς καιρούς — знающие разумение времён (слав. «мужие учени, иже познаваху времена»). γινώσκοντες τί ποιήσαι Ισραηλ — знающие, что делать Израилю. εἰς τὰς ἀρχὰς αὐτῶν — «в начальствах их», т.е. главы (слав. «в начала их»). διακόσιοι — 200."
  33: "ἐκπορευόμενοι εἰς παράταξιν πολέμου — выступающие на брань. ἐν πᾶσιν σκεύεσιν πολεμικοῖς — со всяким воинским оружием. πεντήκοντα χιλιάδες — 50 000. οὐχ ἑτεροκλινῶς — «не уклоняясь на другую сторону», т.е. единодушно (слав. «не с праздными руками» — иное понимание)."
  34: "ἄρχοντες χίλιοι — начальников тысяча. ἐν θυρεοῖς καὶ δόρασιν — со щитами и копьями. τριάκοντα ἑπτὰ χιλιάδες — 37 000."
  35: "τῶν Δανιτῶν — из данитян (ダン人). παρατασσόμενοι εἰς πόλεμον — строящиеся на войну. εἴκοσι ὀκτὼ χιλιάδες καὶ ὀκτακόσιοι — 28 600."
  36: "ἐκπορευόμενοι βοηθῆσαι — выступающие на помощь. τεσσαράκοντα χιλιάδες — 40 000."
  37: "ἐκ πέραν τοῦ Ιορδάνου — из-за Иордана. Ρουβην καὶ Γαδδι — Рувим и Гад. ἑκατὸν εἴκοσι χιλιάδες — 120 000."
  38: "ἄνδρες πολεμισταὶ παρατασσόμενοι παράταξιν — воины, строящиеся в строй. ἐν ψυχῇ εἰρηνικῇ — с мирной душой (слав. «сердцем мирным»). ὁ κατάλοιπος Ισραηλ — остаток Израиля. ψυχὴ μία — «душа одна», единодушно."
  39: "ἡμέρας τρεῖς — три дня. ἐσθίοντες καὶ πίνοντες — едя и пия. ἡτοίμασαν αὐτοῖς οἱ ἀδελφοὶ αὐτῶν — братья их приготовили им (слав. «уготоваша бо им братия их»)."
  40: "οἱ ὁμοροῦντες αὐτοῖς — соседние с ними (ὁμορέω). ἕως Ισσαχαρ — до Иссахара. ἐπὶ τῶν καμήλων … ἡμιόνων — на верблюдах, ослах, мулах (ἡμίονος — мул). παλάθας — связки сушёных смокв (слав. «перевясла смоквей»), σταφίδας — изюм. μόσχους — телят, здесь крупный скот. εὐφροσύνη — веселие (слав. «радость»)."
