# jp-box, 1-я Паралипоменон, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: пришедшие к Давиду в Секелаг (1–7); гадитяне за Иорданом (8–15);
# вениамитяне и иудеи, речь Давида и ответ Амасая (16–18); манассияне (19–22);
# перечень ополчений, пришедших в Хеврон (23–37); три дня пира (38–40).
# Речь — 「…」: 12:17 (Давид), 12:18 (Амасай).
# Красного нет.
# Нумерация — славяно-синодальная: 40 стихов, как в csl и ru. В gr-lxx-byz 41:
# gr 12:4 и 12:5 у слав. слиты в один стих (слав. 12:4), поэтому наш ст. 4
# объединяет оба (текст не менялся), а с 12:5 наша нумерация на один меньше
# греческой (gr 12:N = наш 12:N−1).
# 〔…〕 нет: иночтения csl/gr отмечены в notes.
# Сносок ⟨…⟩ нет: 勇士, レビ人, 千人隊 уже в корпусе (1–2 Цар).
# jp-ni не использовался.

tr_code: jp-box
