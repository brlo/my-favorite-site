verses:
  1: "主[しゅ]である神[かみ]はヨブに答[こた]えて言[い]われた。"
  2: "「力[ちから]ある方[かた]との裁[さば]きを避[さ]けるのか。神[かみ]を責[せ]める者[もの]は、これに答[こた]えよ。」"
  3: "ヨブは主[しゅ]に答[こた]えて言[い]った。"
  4: "「なぜ、わたしはなお裁[さば]かれるのか。何[なに]でもない者[もの]が、主[しゅ]に戒[いまし]められ、責[せ]められながら、このようなことを聞[き]くのか。わたしはこれに、どんな答[こた]えを返[かえ]すのか。わたしは口[くち]に手[て]を置[お]く。」"
  5: "「わたしは一度[いちど]語[かた]った。二度[にど]目[め]には、もう加[くわ]えない。」"
  6: "主[しゅ]は雲[くも]の中[なか]から、さらにヨブに答[こた]えて言[い]われた。"
  7: "「いや、男[おとこ]のように腰[こし]に帯[おび]をせよ。わたしはあなたに問[と]う。あなたはわたしに答[こた]えよ。"
  8: "わたしの裁[さば]きを退[しりぞ]けるな。あなたが正[ただ]しい者[もの]として現[あらわ]れるために、わたしがあなたに別[べつ]の扱[あつか]いをしたとでも思[おも]うのか。"
  9: "あなたには主[しゅ]に立[た]ち向[む]かう腕[うで]があるのか。主のように雷[かみなり]の声[こえ]を響[ひび]かせることができるのか。"
  10: "さあ、高[たか]さと力[ちから]を取[と]り、栄光[えいこう]と誉[ほま]れとを身[み]にまとえ。"
  11: "怒[いか]りの使[つか]いたちを遣[つか]わし、すべて高[たか]ぶる者[もの]を低[ひく]くせよ。"
  12: "高[たか]ぶる者[もの]を消[け]し、不敬[ふけい]な者[もの]たちを直[ただ]ちに朽[く]ちさせよ。"
  13: "彼[かれ]らを一[ひと]つ残[のこ]らず、地[ち]の外[そと]の土[つち]に隠[かく]し、その顔[かお]を辱[はずかし]めで満[み]たせ。"
  14: "そうすれば、わたしも、あなたの右[みぎ]の手[て]が救[すく]えることを認[みと]めよう。"
  15: "しかし、見[み]よ、あなたのそばにベヒモトがいる。それは牛[うし]のように草[くさ]を食[た]べる。"
  16: "見[み]よ、その力[ちから]は腰[こし]にあり、その強[つよ]さは腹[はら]のへそにある。"
  17: "その尾[お]は糸杉[いとすぎ]のように立[た]ち、その筋[すじ]は編[あ]み合[あ]わされている。"
  18: "その肋骨[ろっこつ]は青銅[せいどう]の肋骨、その背骨[せぼね]は鋳[い]た鉄[てつ]である。"
  19: "これは主[しゅ]の造[つく]り物[もの]の初[はじ]めである。主の使[つか]いたちに侮[あざけ]られるために造[つく]られた。"
  20: "それが険[けわ]しい山[やま]に上[のぼ]ると、タルタロスで四足[よつあし]の獣[けもの]たちに喜[よろこ]びを生[う]んだ。"
  21: "あらゆる木[き]の下[した]で眠[ねむ]り、パピルスや葦[あし]、いぐさのそばにいる。"
  22: "大[おお]きな木[き]々[ぎ]が若枝[わかえだ]とともにその陰[かげ]に覆[おお]われ、野[の]の木[き]の枝[えだ]も覆[おお]われる。"
  23: "洪水[こうずい]が起[お]こっても、それを感[かん]じない。ヨルダンがその口[くち]に注[そそ]ぎ込[こ]んでも、平気[へいき]でいる。"
  24: "彼[かれ]をその目[め]の前[まえ]で捕[と]らえ、罠[わな]をかけてその鼻[はな]を貫[つらぬ]く者[もの]が、だれかいるか。"
  25: "あなたはレビヤタンを釣[つ]り針[ばり]で引[ひ]き出[だ]せるか。くつわをその鼻[はな]に掛[か]けることができるか。"
  26: "その鼻[はな]の穴[あな]に輪[わ]を掛[か]け、その唇[くちびる]を錐[きり]で貫[つらぬ]くことができるか。"
  27: "それはあなたに懇願[こんがん]して語[かた]り、柔[やわ]らかな願[ねが]いで請[こ]うだろうか。"
  28: "それはあなたと契約[けいやく]を結[むす]び、あなたはそれを永遠[とこしえ]の奴隷[どれい]として取[と]るだろうか。"
  29: "あなたはそれを鳥[とり]のようにもてあそび、子[こ]どもたちのために雀[すずめ]のように縛[しば]るだろうか。"
  30: "国[くに]々[ぐに]の民[たみ]がそれを食[た]べ物[もの]とし、フェニキア人[じん]の氏族[しぞく]がそれを分[わ]けるだろうか。"
  31: "水[みず]に浮[う]かぶものすべてが集[あつ]まっても、その尾[お]の皮[かわ]一枚[いちまい]を持[も]ち上[あ]げられない。漁師[りょうし]の舟[ふね]でも、その頭[あたま]を持ち上げることはできない。"
  32: "彼[かれ]の上[うえ]に手[て]を置[お]き、その体[からだ]に起[おこ]る戦[たたか]いを思[おも]い起[おこ]せ。もはや、それが起[おこ]ることはない。」"

notes:
  1: "Повествование. Καὶ ἀπεκρίθη κύριος ὁ θεὸς τῷ Ιωβ καὶ εἶπεν — «И отвечал Господь Бог Иову и сказал» (в csl это 39:31: «И отвеща Господь Бог ко иову и рече»). Вводная формула, повествование, вне кавычек. В LXX здесь нет «из бури»; буря была в 38:1, а «из облака» появится в 40:6."
  2: "Господь. Μὴ κρίσιν μετὰ ἱκανοῦ ἐκκλινεῖ — «разве уклонится от суда с Сильным» (ἱκανός — «достаточный, сильный», csl «всесильный»). ἐλέγχων θεὸν ἀποκριθήσεται αὐτήν — «обличающий Бога ответит на него» (ἐλέγχω — «обличать, изобличать»; будущее в значении повеления, поэтому 答えよ). Речь Господа, одна цитата в пределах стиха."
  3: "Повествование. Ὑπολαβὼν δὲ Ιωβ λέγει τῷ κυρίῳ — «И отвечал Иов Господу и говорит» (csl 39:33: «Отвещав же иов, рече Господеви»). Вводная формула, повествование, вне кавычек."
  4: "Иов. Τί ἔτι ἐγὼ κρίνομαι νουθετούμενος — «зачем ещё я сужусь, вразумляемый» (κρίνομαι — «быть судимым»; νουθετέω — «вразумлять»). ἐλέγχων κύριον ἀκούων τοιαῦτα οὐθὲν ὤν — «обличая Господа, слыша такое, будучи ничем» (действительный залог); csl «обличаемь от Господа» — страдательный, «обличаемый Господом»; по паритету взято csl; LXX: действительный залог, «обличая Господа». ἐγὼ δὲ τίνα ἀπόκρισιν δῶ — «какой ответ я дам»; χεῖρα θήσω ἐπὶ στόματί μου — «положу руку на уста мои» (жест молчания, ср. 21:5)."
  5: "Иов. ἅπαξ λελάληκα, ἐπὶ δὲ τῷ δευτέρῳ οὐ προσθήσω — «однажды я говорил, а во второй раз не приложу» (csl «единою глаголах, вторицею же не приложу»). Ответ Иова кончается; 40:6 — новая формула Господа."
  6: "Повествование. Ἔτι δὲ ὑπολαβὼν ὁ κύριος εἶπεν τῷ Ιωβ ἐκ τοῦ νέφους — «и ещё, отвечав, Господь сказал Иову из облака» (csl 40:1: «Паки же отвещав Господь, рече ко иову из облака»; Син. «из бури»). Вводная формула, повествование. С этого стиха начинается сдвиг: наш 40:6 = csl 40:1."
  7: "Господь. Μή, ἀλλὰ ζῶσαι ὥσπερ ἀνὴρ τὴν ὀσφύν σου — «нет, но препояшь, как муж, чресла твои» (μή — возражение молчанию Иова; ζώννυμι — «опоясывать»; ὀσφύς — «чресла»). ἐρωτήσω δέ σε, σὺ δέ μοι ἀποκρίθητι — «Я спрошу тебя, а ты Мне ответь». Речь Господа; цитата открыта здесь и продолжается до 41:26 (в конце 40:32 закрыта ради баланса главы)."
  8: "Господь. μὴ ἀποποιοῦ μου τὸ κρίμα — «не отвергай суда Моего» (ἀποποιέομαι — «отвергать»). οἴει δέ με ἄλλως σοι κεχρηματικέναι ἢ ἵνα ἀναφανῇς δίκαιος — «думаешь ли, что Я иначе поступил с тобой, разве чтобы ты явился праведным» (χρηματίζω — «действовать, говорить»; ἀναφαίνω — «являть»); слав. «мниши ли мя инако тебе сотворша, разве да явишися правдив». Место трудное: Бог обличает желание Иова оправдаться."
  9: "Господь. ἦ βραχίων σοί ἐστιν κατὰ τοῦ κυρίου — «разве у тебя мышца против Господа» (βραχίων — «мышца, рука»; κατά с род. — «против», поэтому 主に立ち向かう). ἢ φωνῇ κατ᾿ αὐτὸν βροντᾷς — «или голосом, как Он, гремишь» (βροντάω — «греметь»); csl «или гласом на него гремиши»."
  10: "Господь. ἀνάλαβε δὴ ὕψος καὶ δύναμιν — «прими же высоту и силу» (ἀναλαμβάνω — «брать, принимать»). δόξαν δὲ καὶ τιμὴν ἀμφίεσαι — «в славу и честь облекись» (ἀμφιέννυμι — «облекать»); csl «в славу же и в честь облецыся»."
  11: "Господь. ἀπόστειλον δὲ ἀγγέλους ὀργῇ — «пошли ангелов с гневом» (ὀργή — «гнев», датив образа действия). πᾶν δὲ ὑβριστὴν ταπείνωσον — «всякого надменного смири» (ὕβριστής — «наглый, надменный»; ταπεινόω — «смирять»)."
  12: "Господь. ὑπερήφανον δὲ σβέσον — «надменного угаси» (ὑπερήφανος — «гордый»; σβέννυμι — «гасить»). σῆψον δὲ ἀσεβεῖς παραχρῆμα — «и нечестивых тотчас сгнои» (σήπω — «гноить, разлагать»; παραχρῆμα — «сразу»)."
  13: "Господь. κρύψον δὲ εἰς γῆν ἔξω ὁμοθυμαδόν — «скрой в землю вне, вместе» (ὁμοθυμαδόν — «единодушно, вместе»; ἔξω — «вне»; передано «地の外の土に»). τὰ δὲ πρόσωπα αὐτῶν ἀτιμίας ἔμπλησον — «и лица их бесчестием исполни» (ἀτιμία — «бесчестие»; ἐμπίμπλημι — «наполнять»)."
  14: "Господь. ὁμολογήσω ἄρα ὅτι δύναται ἡ δεξιά σου σῶσαι — «тогда исповедаю, что может десница твоя спасти» (ὁμολογέω — «признавать, исповедовать»; δεξιά — «правая рука»). Стих заканчивается в LXX точкой с тире; речь Господа продолжается."
  15: "Господь. ἀλλὰ δὴ ἰδοὺ θηρία παρὰ σοί — «но вот, звери у тебя» (θηρία — мн. ч. от θηρίον, «зверь»; в евр. здесь имя бегемот, отсюда ベヒモト; csl «зверие у тебе»). χόρτον ἴσα βουσὶν ἐσθίει — «траву, как волы, ест» (ἴσα — «как, подобно»; βοῦς — «вол»). Начало описания бегемота (40:15–24); в Син. это 40:10."
  16: "Господь. ἰδοὺ δὴ ἰσχὺς αὐτοῦ ἐπ᾿ ὀσφύι — «вот, сила его на чреслах» (ἰσχύς — «сила, крепость»). ἡ δὲ δύναμις ἐπ᾿ ὀμφαλοῦ γαστρός — «а мощь его на пупе чрева» (ὀμφαλός — «пуп»; γαστήρ — «живот»); csl «сила же его на пупе чрева»."
  17: "Господь. ἔστησεν οὐρὰν ὡς κυπάρισσον — «поставил хвост, как кипарис» (κυπάριστος — «кипарис»; csl «яко кипарис»). τὰ δὲ νεῦρα αὐτοῦ συμπέπλεκται — «и жилы его сплетены» (νεῦρον — «жила, сухожилие»; συμπλέκω — «сплетать»)."
  18: "Господь. αἱ πλευραὶ αὐτοῦ πλευραὶ χάλκειαι — «рёбра его — рёбра медные» (πλευρά — «ребро, бок»; χάλκειος — «медный»). ἡ δὲ ῥάχις αὐτοῦ σίδηρος χυτός — «а хребет его — железо литое» (ῥάχις — «хребет, спина»; χυτός — «литой»)."
  19: "Господь. τοῦτ᾿ ἔστιν ἀρχὴ πλάσματος κυρίου — «это начало создания Господня» (πλάσμα — «создание, творение»). πεποιημένον ἐγκαταπαίζεσθαι ὑπὸ τῶν ἀγγέλων αὐτοῦ — «соделанный на посмеяние ангелам Его» (ἐγκαταπαίζω — «осмеивать»; perfect с инфинитивом цели); csl «сотворен поруган быти ангелы его»."
  20: "Господь. ἐπελθὼν δὲ ἐπ᾿ ὄρος ἀκρότομον — «взойдя на гору крутую» (ἀκρότομος — «крутой, обрывистый»). ἐποίησεν χαρμονὴν τετράποσιν ἐν τῷ ταρτάρῳ — «сотворил радость четвероногим в тартаре» (χαρμονή — «радость»; τάρταρος — «тартар», место глубин; csl «в тартаре»). Место тёмное; сохранено буквально."
  21: "Господь. ὑπὸ παντοδαπὰ δένδρα κοιμᾶται — «под всевозможными деревьями спит» (παντοδαπός — «всякого рода»; κοιμάομαι — «спать»). παρὰ πάπυρον καὶ κάλαμον καὶ βούτομον — «при папирусе, тростнике и ситнике» (βούτομον — «ситник, болотная трава»); csl «при рогозе и тростии и ситовии»."
  22: "Господь. σκιάζονται δὲ ἐν αὐτῷ δένδρα μεγάλα — «покрываются тенью в нём деревья великие» (σκιάζω — «осенять, покрывать тенью»; средний залог). σὺν ῥαδάμνοις — «с молодыми ветвями» (ῥάδαμνος — «ветвь, побег»); κλῶνες ἄγνου — «ветви агна» (ἄγνος — прутняк, агнец-дерево; csl «ветви напольныя», т. е. полевые)."
  23: "Господь. ἐὰν γένηται πλήμμυρα, οὐ μὴ αἰσθηθῇ — «если будет наводнение, не почувствует» (πλήμμυρα — «наводнение»; αἰσθάνομαι — «чувствовать»). πέποιθεν ὅτι προσκρούσει ὁ Ιορδάνης εἰς τὸ στόμα αὐτοῦ — «уверен, что Иордан устремится в уста его» (προσκρούω — «ударяться, устремляться»); csl «уповает, яко внидет иордан во уста его»."
  24: "Господь. ἐν τῷ ὀφθαλμῷ αὐτοῦ δέξεται αὐτόν — «в глазах его примет его», т. е. возьмёт на виду у него (ὀφθαλμός — «глаз»; δέχομαι — «принимать»). ἐνσκολιευόμενος τρήσει ῥῖνα — «устраивая засаду, продолбит нос» (ἐνσκολιεύομαι — тёмное, вероятно «изловчаться, ставить ловушку»; τρήσω — «просверлить»; ῥίς — «нос»); csl «ожесточився продиравит ноздри», Син. «проколет ли ему нос багром»."
  25: "Господь. ἄξεις δὲ δράκοντα ἐν ἀγκίστρῳ — «вытащишь ли дракона крючком» (δράκων — «дракон», здесь левиафан; ἄγκιστρον — «крючок, удочка»); отсюда レビヤタン, в notes греч. δράκων. περιθήσεις δὲ φορβεὰν περὶ ῥῖνα αὐτοῦ — «возложишь ли узду на нос его» (φορβεά — «узда, недоуздок», вероятно семитизм). В LXX это начало описания левиафана; в МТ и Син. — 41:1."
  26: "Господь. εἰ δήσεις κρίκον ἐν τῷ μυκτῆρι αὐτοῦ — «если вложишь кольцо в ноздрю его» (κρίκος — «кольцо»; μυκτήρ — «ноздря»). ψελίῳ δὲ τρυπήσεις τὸ χεῖλος αὐτοῦ — «а запястьем (браслетом) продолбишь губу его» (ψέλιον — «браслет, запястье»); csl «шилом же провертиши ли устне его» — редкое слово понято как орудие; по паритету взято csl."
  27: "Господь. λαλήσει δέ σοι δεήσει — «будет ли он говорить с тобой с прошением» (δέησις — «прошение, мольба»). ἱκετηρίᾳ μαλακῶς — «с молением кротко» (ἱκετηρία — «моление»; μαλακῶς — «мягко, кротко»); csl «с прошением кротко»."
  28: "Господь. θήσεται δὲ διαθήκην μετὰ σοῦ — «заключит ли он с тобой завет» (διαθήκη — «завет, договор»). λήμψῃ δὲ αὐτὸν δοῦλον αἰώνιον — «возьмёшь ли его в вечного раба» (δοῦλος — «раб»; αἰώνιος — «вечный»)."
  29: "Господь. παίξῃ δὲ ἐν αὐτῷ ὥσπερ ὀρνέῳ — «будешь ли играть с ним, как с птицей» (παίζω — «играть»; ὄρνεον — «птица»). ἢ δήσεις αὐτὸν ὥσπερ στρουθίον παιδίῳ — «или привяжешь его, как воробья, ребёнку» (στρουθίον — «воробей, птичка»; παιδίον — «ребёнок»); csl «яко врабия детищу»."
  30: "Господь. ἐνσιτοῦνται δὲ ἐν αὐτῷ ἔθνη — «питаются ли им народы» (ἐνσιτέομαι — «кормиться чем»; ἔθνος — «народ»). μεριτεύονται δὲ αὐτὸν Φοινίκων γένη — «делят ли его финикийские роды» (μεριτεύω — «делить»; Φοίνικες — «финикийцы»); csl «финикийстии народи»."
  31: "Господь. πᾶν δὲ πλωτὸν συνελθὸν οὐ μὴ ἐνέγκωσιν βύρσαν μίαν οὐρᾶς αὐτοῦ — «всё плавающее, собравшись, не поднимут одной кожи хвоста его» (πλωτός — «плавающий»; βύρσα — «кожа, шкура»; οὐρά — «хвост»). ἐν πλοίοις ἁλιέων κεφαλὴν αὐτοῦ — «на кораблях рыбарей — голову его» (ἁλιεύς — «рыбак»; эллипсис: не поднимут); csl «и корабли рыбарей главы его»."
  32: "Господь. ἐπιθήσεις δὲ αὐτῷ χεῖρα — «возложишь ли на него руку» (ἐπιτίθημι — «возлагать»). μνησθεὶς πόλεμον τὸν γινόμενον ἐν σώματι αὐτοῦ — «вспомнив войну, бывающую в теле его» (μνησθείς — прич. аор. от μιμνήσκομαι; πόλεμος — «война»). καὶ μηκέτι γινέσθω — «и да не будет больше» (букв.; csl «и ктому да не будет», Син. «вперед не будешь»); подлежащее не выражено: «это» — война или действие поднявшего руку; передано буквально. Здесь цитата закрывается ради баланса главы; речь продолжается в 41:1."
