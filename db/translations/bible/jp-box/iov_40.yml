# jp-box, Иов, глава 40. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 40: продолжение речи Господа из облака: «препояшься, как муж» (1–9),
# бегемот (10–19), левиафан — начало (20–27).
# Голоса: 40:1 — вводная формула, повествование, вне кавычек; 40:2–27 — речь Господа,
# одна цитата 「…」, которая ПРОДОЛЖАЕТСЯ В ГЛАВЕ 41 (41:1 — без новой формулы,
# речь идёт до 41:26). Кавычка закрыта в конце 40:27 ради баланса главы;
# в iov_41.yml её нужно снова открыть в 41:1 и закрыть в 41:26.
# Нумерация — славяно-синодальная (csl-ru), как и во всей книге: 27 стихов.
# Наш 40:1–27 = gr-lxx-byz 40:6–32 (в gr гл. 40 — 32 стиха): её первые пять стихов
# (gr 40:1–5: «И отвечал Господь…», вопрос и ответ Иова) по csl относятся к гл. 39
# и стоят у нас как 39:31–35. Сдвиг: наш 40:N = gr 40:N+5.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Бегемот — ベヒモト (греч. θηρία, мн. ч. «звери»), левиафан — レビヤタン
# (греч. δράκων, «дракон»). В LXX левиафан начинается уже в gr 40:25 = наш 40:20
# (в МТ/Син. это 41:1).
# Имена — транслитерация греческого (LXX): ヨブ.

