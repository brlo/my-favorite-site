# jp-box, Иов, глава 40. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 40: Господь отвечает Иову (1–2), ответ Иова (3–5), продолжение речи Господа:
# «препояшься, как муж» (6–14), бегемот (15–24), левиафан — начало (25–32).
# Голоса: 40:1, 40:3, 40:6 — вводные формулы, повествование, вне кавычек; 40:2 — речь
# Господа 「…」; 40:4–5 — ответ Иова 「…」; 40:7–32 — речь Господа, одна цитата 「…」,
# которая ПРОДОЛЖАЕТСЯ В ГЛАВЕ 41 (41:1 — без новой формулы, речь идёт до 41:26).
# Кавычка закрыта в конце 40:32 ради баланса главы; в iov_41.yml её нужно снова
# открыть в 41:1 и закрыть в 41:26.
# Нумерация по gr: 32 стиха. Слав. сдвиг: csl 39:31–35 = наш 40:1–5 (в csl гл. 39
# на пять стихов больше); наш 40:6–32 = csl 40:1–27 (в csl гл. 40 — 27 стихов).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Бегемот — ベヒモト (греч. θηρία, мн. ч. «звери»), левиафан — レビヤタン
# (греч. δράκων, «дракон»). В LXX левиафан начинается уже в 40:25 (в МТ/Син. это 41:1).
# Имена — транслитерация греческого (LXX): ヨブ.

