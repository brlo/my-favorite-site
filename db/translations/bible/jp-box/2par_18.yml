# jp-box, 2-я Паралипоменон, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 18: союз Иосафата с Ахавом (1–3), вопрос о пророке Господнем (4–8),
# четыреста пророков и рога Седекии (9–11), посланник и первый ответ
# Михея (12–17), видение небесного совета (18–22), удар и темница (23–27),
# поход, битва при Рамофе Галаадском и смерть Ахава (28–34).
# Параллель — 3 Цар 22:1–35; расхождения с ней отмечены в notes.
# Нумерация по gr: 34 стиха, совпадает с csl и ru.
# Речь — 「…」 первого уровня, вложенная — 『…』; третий уровень (слова духа
# внутри слов Господа) снова 「…」, четвёртый (ответ Господа духу) — 『…』.
# Красного нет.
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 預言者, 王座, 戦車, 宦官, 牢, 偽り уже в корпусе.
# jp-ni не использовался.

