verses:
  1: "ヨシャファトには多[おお]くの富[とみ]と栄光[えいこう]があった。彼[かれ]はアハブの家[いえ]と姻戚[いんせき]関係[かんけい]を結[むす]んだ。"
  2: "幾年[いくとせ]かの後[のち]、彼[かれ]はアハブのもとへ、サマリアへ下[くだ]った。アハブは彼[かれ]と、彼[かれ]とともにいる民[たみ]のために羊[ひつじ]や牛[うし]を多[おお]く屠[ほふ]り、彼[かれ]を誘[さそ]って、ともにギレアデのラモトへ上[のぼ]らせようとした。"
  3: "イスラエルの王[おう]アハブはユダの王[おう]ヨシャファトに言[い]った。「わたしと一緒[いっしょ]にギレアデのラモトへ行[い]くか。」彼[かれ]は言[い]った。「わたしはあなたと同[おな]じだ。あなたの民[たみ]はわたしの民[たみ]と同[おな]じであり、あなたとともに戦[たたか]いに出[で]る。」"
  4: "ヨシャファトはイスラエルの王[おう]に言[い]った。「今日[きょう]、主[しゅ]に尋[たず]ねてほしい。」"
  5: "イスラエルの王[おう]は預言者[よげんしゃ]たち四百人[よんひゃくにん]を集[あつ]めて言[い]った。「わたしはギレアデのラモトへ戦[たたか]いに出[で]るべきか、それとも控[ひか]えるべきか。」彼[かれ]らは言[い]った。「上[のぼ]って行[い]け。神[かみ]はそれを王[おう]の手[て]に渡[わた]される。」"
  6: "ヨシャファトは言[い]った。「ここには、まだ主[しゅ]の預言者[よげんしゃ]がいて、彼[かれ]によって尋[たず]ねることのできる者[もの]はいないのか。」"
  7: "イスラエルの王[おう]はヨシャファトに言[い]った。「まだ一人[ひとり]いる。彼[かれ]によって主[しゅ]に尋[たず]ねることができる。しかし、わたしは彼[かれ]を憎[にく]んでいる。彼[かれ]はわたしについて良[よ]いことではなく、悪[わる]いことばかり預言[よげん]するからだ。ミカヤ、イムラの子[こ]だ。」ヨシャファトは言[い]った。「王[おう]よ、そのようには言[い]わないでほしい。」"
  8: "イスラエルの王[おう]は一人[ひとり]の宦官[かんがん]を呼[よ]んで言[い]った。「すぐにミカヤ、イムラの子[こ]を連[つ]れて来[こ]い。」"
  9: "イスラエルの王[おう]とユダの王[おう]ヨシャファトは、それぞれ自分[じぶん]の王座[おうざ]に座[すわ]り、衣[ころも]をまとって、サマリアの門[もん]の入口[いりぐち]の広[ひろ]い場所[ばしょ]にいた。預言者[よげんしゃ]たちはみな、彼[かれ]らの前[まえ]で預言[よげん]していた。"
  10: "ケナアナの子[こ]ゼデキヤは自分[じぶん]のために鉄[てつ]の角[つの]を作[つく]り、言[い]った。「主[しゅ]はこう言[い]われる。『あなたはこれらの角[つの]でシリアを突[つ]き倒[たお]し、滅[ほろ]ぼし尽[つ]くすまでにする。』」"
  11: "預言者[よげんしゃ]たちはみな、同[おな]じように預言[よげん]して言[い]った。「ギレアデのラモトへ上[のぼ]って行[い]け。そうすれば成功[せいこう]し、主[しゅ]はそれを王[おう]の手[て]に渡[わた]される。」"
  12: "ミカヤを呼[よ]びに来[き]た使者[ししゃ]は彼[かれ]に言[い]った。「見[み]よ、預言者[よげんしゃ]たちは一[ひと]つの口[くち]で王[おう]について良[よ]いことを語[かた]っている。どうか、あなたの言葉[ことば]も彼[かれ]らの一人[ひとり]と同[おな]じにして、良[よ]いことを語[かた]ってほしい。」"
  13: "ミカヤは言[い]った。「主[しゅ]は生[い]きておられる。神[かみ]がわたしに語[かた]られることを、わたしは語[かた]る。」"
  14: "彼[かれ]は王[おう]のもとへ来[き]た。王[おう]は彼[かれ]に言[い]った。「ミカヤ、わたしはギレアデのラモトへ戦[たたか]いに出[で]るべきか、それとも控[ひか]えるべきか。」彼[かれ]は言[い]った。「上[のぼ]って行[い]け。そうすれば成功[せいこう]し、彼[かれ]らはあなたがたの手[て]に渡[わた]される。」"
  15: "王[おう]は彼[かれ]に言[い]った。「主[しゅ]の名[な]によって、わたしに真実[しんじつ]のほかは語[かた]らないようにと、何度[なんど]あなたに誓[ちか]わせればよいのか。」"
  16: "ミカヤは言[い]った。「わたしはイスラエルがみな、羊飼[ひつじか]いのいない羊[ひつじ]のように山[やま]々[やま]に散[ち]らされているのを見[み]た。主[しゅ]は言[い]われた。『この者[もの]たちには導[みちび]く者[もの]がない。それぞれ、自分[じぶん]の家[いえ]へ無事[ぶじ]に帰[かえ]れ。』」"
  17: "イスラエルの王[おう]はヨシャファトに言[い]った。「わたしが言[い]ったではないか。この者[もの]はわたしについて良[よ]いことを預言[よげん]せず、悪[わる]いことばかり預言[よげん]すると。」"
  18: "彼[かれ]は言[い]った。「そうではない。主[しゅ]の言葉[ことば]を聞[き]け。わたしは主[しゅ]がその王座[おうざ]に座[すわ]り、天[てん]の軍勢[ぐんせい]がみな、その右[みぎ]と左[ひだり]に立[た]っているのを見[み]た。"
  19: "主[しゅ]は言[い]われた。『だれがイスラエルの王[おう]アハブを誘[さそ]い込[こ]んで、彼[かれ]が上[のぼ]って行[い]き、ギレアデのラモトで倒[たお]れるようにするのか。』すると、ある者[もの]はこう言[い]い、ある者[もの]はこう言[い]った。"
  20: "一[ひと]つの霊[れい]が進[すす]み出[で]て主[しゅ]の前[まえ]に立[た]ち、言[い]った。「わたしが彼[かれ]を誘[さそ]い込[こ]もう。」主[しゅ]は言[い]われた。『何[なに]によってか。』"
  21: "彼[かれ]は言[い]った。「わたしは出[で]て行[い]き、彼[かれ]の預言者[よげんしゃ]たちすべての口[くち]のうちに偽[いつわ]りの霊[れい]となる。」主[しゅ]は言[い]われた。『あなたは彼[かれ]を誘[さそ]い込[こ]み、それを成[な]し遂[と]げる。出[で]て行[い]け、そうしなさい。』"
  22: "そして今[いま]、見[み]よ、主[しゅ]はあなたのこれらすべての預言者[よげんしゃ]の口[くち]に偽[いつわ]りの霊[れい]を与[あた]えられた。主[しゅ]はあなたについて災[わざわ]いを告[つ]げられたのだ。」"
  23: "ケナアナの子[こ]ゼデキヤは近[ちか]づいてミカヤの頬[ほお]を打[う]ち、言[い]った。「主[しゅ]の霊[れい]が、どのようにしてわたしを離[はな]れて、あなたに語[かた]ったというのか。」"
  24: "ミカヤは言[い]った。「見[み]よ、あなたはその日[ひ]、身[み]を隠[かく]そうと部屋[へや]から部屋[へや]へ入[はい]るとき、それを目[め]の当[あ]たりにするだろう。」"
  25: "イスラエルの王[おう]は言[い]った。「ミカヤを捕[つか]まえ、彼[かれ]を町[まち]の長[おさ]アモンと、王[おう]の子[こ]ヨアシュのもとへ連[つ]れて行[い]け。"
  26: "そして言[い]え。『王[おう]はこう言[い]われる。この者[もの]を牢[ろう]に入[い]れ、わたしが無事[ぶじ]に帰[かえ]って来[く]るまで、苦[くる]しみのパンと苦[くる]しみの水[みず]だけを与[あた]えておけ。』」"
  27: "ミカヤは言[い]った。「もしあなたが無事[ぶじ]に帰[かえ]って来[く]るなら、主[しゅ]はわたしによって語[かた]られなかったのだ。」そして言[い]った。「すべての民[たみ]よ、聞[き]け。」"
  28: "イスラエルの王[おう]とユダの王[おう]ヨシャファトは、ギレアデのラモトへ上[のぼ]って行[い]った。"
  29: "イスラエルの王[おう]はヨシャファトに言[い]った。「わたしは姿[すがた]を変[か]えて戦[たたか]いに入[はい]る。あなたはわたしの衣[ころも]を着[き]ていなさい。」イスラエルの王[おう]は姿[すがた]を変[か]えて戦[たたか]いに入[はい]った。"
  30: "シリアの王[おう]は自分[じぶん]の戦車[せんしゃ]の長[かしら]たちに命[めい]じて言[い]った。「小[ちい]さな者[もの]とも大[おお]きな者[もの]とも戦[たたか]ってはならない。ただイスラエルの王[おう]、それ一人[ひとり]とだけ戦[たたか]え。」"
  31: "戦車[せんしゃ]の長[かしら]たちはヨシャファトを見[み]ると、言[い]った。「これはイスラエルの王[おう]だ。」そして彼[かれ]を囲[かこ]んで戦[たたか]おうとした。ヨシャファトは叫[さけ]んだ。主[しゅ]は彼[かれ]の声[こえ]を聞[き]かれた。神[かみ]は彼[かれ]らを彼[かれ]から遠[とお]ざけられた。"
  32: "戦車[せんしゃ]の長[かしら]たちは、この者[もの]がイスラエルの王[おう]ではないと見[み]て取[と]ると、彼[かれ]から離[はな]れて引[ひ]き返[かえ]した。"
  33: "一人[ひとり]の者[もの]が弓[ゆみ]を引[ひ]いて巧[たく]みに狙[ねら]い、イスラエルの王[おう]を肺[はい]と胸当[むねあ]ての間[あいだ]に射当[いあ]てた。王[おう]は自分[じぶん]の御者[ぎょしゃ]に言[い]った。「手[て]を返[かえ]して、わたしを戦[たたか]いの場[ば]から連[つ]れ出[だ]せ。わたしは傷[きず]を負[お]った。」"
  34: "その日[ひ]、戦[たたか]いは終[お]わった。イスラエルの王[おう]は夕方[ゆうがた]まで、シリアの向[む]かい側[がわ]で戦車[せんしゃ]の上[うえ]に立[た]っていた。そして、日[ひ]が沈[しず]むころに死[し]んだ。"

notes:
  1: "ἐγενήθη ... ἔτι πλοῦτος — «было ещё богатство», т.е. прибавилось. ἐπεγαμβρεύσατο — породнился через брак (ἐπιγαμβρεύω); слав. «поят жену в дому Ахаавли» — взял жену из дома Ахава (брак Иорама с Гофолией, 4 Цар 8:18)."
  2: "κατέβη — сошёл: из Иудеи в Самарию путь идёт вниз. διὰ τέλους ἐτῶν — «через конец лет», т.е. по прошествии нескольких лет (слав. «при концы лет»). ἔθυσεν — заколол, устроил пир (θύω). μόσχοι — тельцы (牛). ἠπάτα — обольщал, склонял (ἀπατάω). Ραμωθ τῆς Γαλααδίτιδος — Рамоф Галаадский (ギレアデのラモト; слав. «Рамоф Галаадский»)."
  3: "Πορεύσῃ μετ᾿ ἐμοῦ — «пойдёшь ли со мною» (вопрос без частицы). Ὡς ἐγώ, οὕτως καὶ σύ — «как я, так и ты»: формула союза. ὡς ὁ λαός σου καὶ ὁ λαός μου — как народ твой, так и народ мой. εἰς πόλεμον — на войну. В 3 Цар 22:4 добавлены «кони» — здесь нет."
  4: "Ζήτησον δή — «вопроси же, поищи» (ζητέω); слав. «вопроси убо днесь Господа». σήμερον — сегодня. Обращение Иосафата к царю — вежливый 常体."
  5: "συνήγαγεν — собрал (συνάγω). τετρακοσίους — четыреста; в 3 Цар 22:6 «как четыреста». ἐπίσχω — удержусь, воздержусь (ἐπέχω). δώσει ὁ θεός — «даст Бог»; в 3 Цар 22:6 — «Господь». εἰς τὰς χεῖρας τοῦ βασιλέως — в руки царя."
  6: "Οὐκ ἔστιν ὧδε — «нет ли здесь» (вопрос). ἔτι — ещё. ἐπιζητήσομεν — вопросим, поищем (ἐπιζητέω); слав. «да от него вопросим»."
  7: "ἀνὴρ εἷς τοῦ ζητῆσαι — «человек один, чтобы вопросить». ἐμίσησα — возненавидел (перфект μισέω). οὐκ ἔστιν προφητεύων περὶ ἐμοῦ εἰς ἀγαθά — не пророчествует о мне в доброе. πᾶσαι αἱ ἡμέραι αὐτοῦ εἰς κακά — все дни его — в худое. Μιχαιας υἱὸς Ιεμλα — Михей, сын Иемлы (ミカヤ、イムラの子). Μὴ λαλείτω — «пусть не говорит»: вежливое 3-е лицо в обращении."
  8: "εὐνοῦχος εἷς — один евнух, придворный (宦官). Τάχος — наречие «быстро» (слав. «скоро»); в слав. в скобках добавлено «(призови)» — вставка, не переводится."
  9: "καθήμενοι ... ἐνδεδυμένοι στολάς — «сидящие и облечённые в одежды» (στολή — облачение, 衣); в 3 Цар 22:10 «вооружённые» (ἔνοπλοι). εὐρύχωρον — простор, площадь (εὐρύχωρος); слав. «на пространстве». θύρας πύλης Σαμαρείας — «у двери ворот Самарии». ἐπροφήτευον — пророчествовали (имперфект)."
  10: "κέρατα σιδηρᾶ — железные рога, символ силы (角[つの]). κερατιεῖς — «избодаешь» (κερατίζω); слав. «избодеши». ἕως ἂν συντελεσθῇ — «доколе не завершится, не истребится». Речь Седекии — 「…」, слова Господа внутри — 『…』."
  11: "εὐοδωθήσῃ — «будешь иметь успех» (εὐοδόω); слав. «предуспееши». εἰς χεῖρας τοῦ βασιλέως — в руки царя, не «твои». В 3 Цар 22:12 добавлено «и царя Сирии» — здесь нет."
  12: "ὁ ἄγγελος — здесь «посланник» (使者), не ангел. ἐν στόματι ἑνί — «одними устами». ἔστωσαν δὴ οἱ λόγοι σου ὡς ἑνός — «пусть будут слова твои как одного из них». λαλήσεις ἀγαθά — скажешь доброе."
  13: "Ζῇ κύριος — клятвенная формула «жив Господь». ὃ ἐὰν εἴπῃ ὁ θεός — что ни скажет Бог; в 3 Цар 22:14 — «Господь». αὐτὸ λαλήσω — то и скажу."
  14: "εἰ πορευθῶ — «идти ли мне» (1-е л. ед. ч.). Ἀνάβαινε καὶ εὐοδώσεις — «взойди и будешь успешен». δοθήσονται εἰς χεῖρας ὑμῶν — «будут преданы в руки ваши» (мн. ч.; в 3 Цар 22:15 — «в руку царя»). В слав. в скобках «(врази)» — вставка, не переведена."
  15: "Ποσάκις — «сколько раз» (слав. «колико крат»). ὁρκίζω σε — заклинаю тебя (ὁρκίζω). πλὴν ἀλήθειαν — «кроме истины», т.е. только истину. ἐν ὀνόματι κυρίου — именем Господа."
  16: "ἑώρακα — перфект «я увидел». διεσπαρμένους — рассеянных (διασπείρω). ὡς πρόβατα οἷς οὐκ ἔστιν ποιμήν — как овцы, у которых нет пастыря. ἡγούμενον — вождя, начальника (導[みちび]く者[もの]). ἀναστρεφέτωσαν — пусть возвращаются (ἀναστρέφω). ἐν εἰρήνῃ — с миром (無事[ぶじ])."
  17: "Οὐκ εἶπά σοι — «не сказал ли я тебе». ἀλλ᾿ ἢ κακά — «но только худое» (ἀλλ᾿ ἤ — «кроме, лишь»)."
  18: "Οὐχ οὕτως — «не так» (в 3 Цар 22:19 — «итак»). εἶδον — увидел. πᾶσα δύναμις τοῦ οὐρανοῦ — всё воинство небесное (天[てん]の軍勢[ぐんせい]). εἱστήκει — плюсквамперфект «стояло» (ἵστημι)."
  19: "ἀπατήσει — обманет, увлечёт (ἀπατάω); слав. «прельстит». ἀναβήσεται καὶ πεσεῖται — «взойдёт и падёт». οὗτος οὕτως — «этот так». Речь Господа внутри речи Михея — 『…』."
  20: "τὸ πνεῦμα — «дух» (с артиклем). ἔστη ἐνώπιον κυρίου — стал пред Господом. Ἐν τίνι; — «чем?» (творительный средства); в слав. в скобках «(прельстиши)» — не переводится. Слова духа — снова 「…」 (третий уровень)."
  21: "Ἐξελεύσομαι — «выйду». πνεῦμα ψευδές — дух лживый (偽[いつわ]りの霊[れい]). Ἀπατήσεις καὶ δυνήσῃ — «обманешь и сможешь» (слав. «прельстиши и превозможеши»). ἔξελθε καὶ ποίησον οὕτως — «выйди и сделай так»."
  22: "ἔδωκεν — дал (аорист). ἐλάλησεν ἐπὶ σὲ κακά — «изрёк о тебе злое», т.е. против тебя (слав. «глагола на тя злая»). Здесь закрывается речь Михея."
  23: "σιαγών — щека (頬). Ποίᾳ τῇ ὁδῷ — «какой дорогой» (слав. «коим путем»). παρ᾿ ἐμοῦ — «от меня», т.е. «неужели дух оставил меня». παρῆλθεν — прошёл, перешёл (παρέρχομαι)."
  24: "ταμίειον ἐκ ταμιείου — «комнату из комнаты», т.е. из одной внутренней комнаты в другую; слав. «ложницу из ложницы». τοῦ κατακρυβῆναι — чтобы скрыться (κατακρύπτω)."
  25: "Λάβετε — императив мн. ч. «возьмите». ἄρχων τῆς πόλεως — начальник города (町[まち]の長[おさ]). Εμηρ — Емер; в слав. «Еммир», в ru «Амон»; принята форма корпуса アモン (ср. 3 Цар 22:26). Ιωας — Иоас (ヨアシュ). Синтаксис продолжается в ст. 26."
  26: "ἐρεῖς — «скажешь» (ед. ч.), т.е. передай. Ἀπόθεσθε — «ввергните» (ἀποτίθημι). οἶκος φυλακῆς — дом стражи, темница (牢[ろう]). ἄρτος θλίψεως — хлеб скорби, т.е. скудная пища. ἕως τοῦ ἐπιστρέψαι με — доколе я не возвращусь."
  27: "Ἐὰν ἐπιστρέφων ἐπιστρέψῃς — усиление «если возвращаясь возвратишься». οὐκ ἐλάλησεν κύριος ἐν ἐμοί — «не говорил Господь во мне», т.е. не через меня. ἀκούσατε λαοὶ πάντες — «слушайте, все народы». Слав. добавляет «И рече» («и сказал») — в гр его нет; по паритету внесено (そして言った)."
  28: "ἀνέβη — взошёл (ἀναβαίνω). Оба царя вместе, как обещал Иосафат (ст. 3)."
  29: "Κατακαλύψομαι — «прикроюсь, переоденусь» (κατακαλύπτομαι); слав. «прикрыюся». ἔνδυσαι τὸν ἱματισμόν μου — «надень одежду мою»; в ru «свои», в гр и слав. «мою». συνεκαλύψατο — переоделся."
  30: "ἐνετείλατο — повелел (ἐντέλλομαι). ἄρχοντες τῶν ἁρμάτων — начальники колесниц (戦車[せんしゃ]の長[かしら]). μικρὸν καὶ μέγαν — малого и великого, т.е. по чину. μόνον — только одного."
  31: "ἐκύκλωσαν — окружили (κυκλόω). ἐβόησεν — воззвал (βοάω). κύριος ἔσωσεν αὐτόν — «Господь спас его» (ἔσωσεν); слав. «Господь послуша его» — услышал; по паритету в тексте 聞[き]かれた, вариант LXX — здесь. ἀπέστρεψεν αὐτοὺς ὁ θεός — «Бог отвратил их от него». В 3 Цар 22:32 этих слов нет."
  32: "οὐκ ἦν βασιλεὺς Ισραηλ — «не был [это] царь Израилев». ἀπέστρεψαν ἀπ᾿ αὐτοῦ — отступили от него."
  33: "ἐνέτεινεν τόξον — натянул лук (ἐντείνω). εὐστόχως — метко (слав. «приметно»; в ru «случайно» — по МТ). ἀνὰ μέσον τοῦ πνεύμονος καὶ τοῦ θώρακος — между лёгким и бронёй (θώραξ; слав. «между легким и персями»). ἡνίοχος — возница (御者[ぎょしゃ]). ἐπόνεσα — «я изнемог, мне больно» (πονέω; слав. «изнемогох»)."
  34: "ἐτροπώθη ὁ πόλεμος — «брань обратилась» (τροπόω), т.е. была обращена вспять; слав. «скончана бысть брань» — по паритету в тексте 終[お]わった, вариант LXX — здесь (в ru «усилилось»). ἐξ ἐναντίας Συρίας — напротив Сирии. δύνοντος τοῦ ἡλίου — при заходящем солнце."
