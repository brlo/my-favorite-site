verses:
  1: "神[かみ]はヤコブに言[い]われた。「立[た]って、ベテルへ上[のぼ]り、そこに住[す]め。そして、あなたが兄[あに]エサウの顔[かお]を避[さ]けて逃[に]げたとき、あなたに現[あらわ]れた神[かみ]に、そこに祭壇[さいだん]を築[きず]け。」"
  2: "ヤコブは自分[じぶん]の家[いえ]の者[もの]と、自分[じぶん]とともにいるすべての者[もの]に言[い]った。「あなたがたとともにある異教[いきょう]の神々[かみがみ]を、あなたがたの間[あいだ]から取[と]り除[のぞ]き、身[み]を清[きよ]めて、着物[きもの]を着[き]替[か]えなさい。"
  3: "そして、立[た]ってベテルへ上[のぼ]ろう。苦難[くなん]の日[ひ]にわたしの声[こえ]を聞[き]き届[とど]けてくださった神[かみ]に、そこに祭壇[さいだん]を築[きず]こう。その方[かた]はわたしとともにいて、わたしが歩[あゆ]んだ道[みち]でわたしを救[すく]ってくださった。」"
  4: "彼[かれ]らは自分[じぶん]たちの手[て]にある異教[いきょう]の神々[かみがみ]と、耳[みみ]にある耳飾[みみかざ]りをヤコブに渡[わた]した。ヤコブはそれらをシケムにあるテレビンの木[き]の下[した]に隠[かく]し、今日[きょう]に至[いた]るまでそれらを滅[ほろ]ぼした。"
  5: "イスラエルはシケムから立[た]ち上[あ]がった。すると、神[かみ]への恐[おそ]れが周囲[しゅうい]の町々[まちまち]に及[およ]び、彼[かれ]らはイスラエルの子[こ]らを追[お]いかけて来[こ]なかった。"
  6: "ヤコブは、カナンの地[ち]にあるルズ、すなわちベテルへ来[き]た。彼[かれ]も、彼[かれ]とともにいたすべての民[たみ]も。"
  7: "そこに祭壇[さいだん]を築[きず]き、その場所[ばしょ]の名[な]をベテルと呼[よ]んだ。兄[あに]エサウの顔[かお]を避[さ]けて逃[に]げているとき、そこに神[かみ]が彼[かれ]に現[あらわ]れたからである。"
  8: "リベカの乳母[うば]デボラは、ベテルから少[すこ]し下[くだ]ったところ、カシの木[き]の下[した]で死[し]んだ。ヤコブはそれを嘆[なげ]きのカシの木[き]と呼[よ]んだ。"
  9: "神[かみ]は、ヤコブがシリアのメソポタミアから来[き]たとき、ルズで再[ふたた]びヤコブに現[あらわ]れ、彼[かれ]を祝福[しゅくふく]された。"
  10: "神[かみ]は彼[かれ]に言[い]われた。「あなたの名[な]はヤコブである。もはやヤコブと呼[よ]ばれることはなく、イスラエルがあなたの名[な]となる。」"
  11: "神[かみ]は彼[かれ]に言[い]われた。「わたしはあなたの神[かみ]である。増[ふ]えよ、多[おお]くなれ。諸国民[しょこくみん]と諸国民[しょこくみん]の集[あつ]まりがあなたから生[う]まれ、王[おう]たちがあなたの腰[こし]から出[で]て来[く]る。"
  12: "わたしがアブラハムとイサクに与[あた]えた地[ち]を、あなたにも与[あた]えた。それはあなたのものとなり、あなたの後[あと]の子孫[しそん]にも、わたしはこの地[ち]を与[あた]える。」"
  13: "神[かみ]は、彼[かれ]と語[かた]られたその場所[ばしょ]から、彼[かれ]のもとを離[はな]れて上[のぼ]って行[い]かれた。"
  14: "ヤコブは、神[かみ]が自分[じぶん]と語[かた]られたその場所[ばしょ]に柱[はしら]を、すなわち石[いし]の柱[はしら]を立[た]て、その上[うえ]に注[そそ]ぎの供[そな]えを注[そそ]ぎ、その上[うえ]に油[あぶら]を注[そそ]いだ。"
  15: "ヤコブは、神[かみ]がそこで自分[じぶん]と語[かた]られたその場所[ばしょ]の名[な]をベテルと呼[よ]んだ。"
  16: "ヤコブはベテルを発[た]ち、ガデルの塔[とう]の向[む]こうに天幕[てんまく]を張[は]った。エフラタの地[ち]へ入[はい]る手前[てまえ]のハブラタ⟨原語[げんご]で「道[みち]のり」の意[い]。エフラタまでの距離[きょり]のこと。⟩に近[ちか]づいたとき、ラケルは産[う]み、難産[なんざん]であった。"
  17: "彼女[かのじょ]がひどく苦[くる]しみながら産[う]んでいるとき、産婆[さんば]が彼女[かのじょ]に言[い]った。「恐[おそ]れないで。これもまた、あなたの息子[むすこ]だ。」"
  18: "彼女[かのじょ]が息[いき]を引[ひ]き取[と]ろうとしたとき——死[し]のうとしていたからである——その子[こ]の名[な]を「わたしの苦[くる]しみの子[こ]」と呼[よ]んだ。父[ちち]はその子[こ]をベニヤミンと呼[よ]んだ。"
  19: "ラケルは死[し]に、エフラタへ行[ゆ]く道[みち]の途[と]中[ちゅう]に葬[ほうむ]られた。そこはベツレヘムである。"
  20: "ヤコブは彼女[かのじょ]の墓[はか]の上[うえ]に石[いし]の柱[はしら]を立[た]てた。これがラケルの墓[はか]の柱[はしら]であり、今日[きょう]に至[いた]るまで残[のこ]っている。"
  21: "イスラエルがその地[ち]に住[す]んだとき、ルベンは行[い]って、父[ちち]の側女[そばめ]であるビルハと寝[ね]た。イスラエルはそれを聞[き]き、そのことは彼[かれ]の前[まえ]に悪[わる]と映[うつ]った。"
  22: "ヤコブの息子[むすこ]は十二人[じゅうににん]であった。"
  23: "レアの息子[むすこ]たちは、ヤコブの長子[ちょうし]ルベン、シメオン、レビ、ユダ、イッサカル、ゼブルン。"
  24: "ラケルの息子[むすこ]たちは、ヨセフとベニヤミン。"
  25: "ラケルの女[おんな]奴隷[どれい]ビルハの息子[むすこ]たちは、ダンとナフタリ。"
  26: "レアの女[おんな]奴隷[どれい]ジルパの息子[むすこ]たちは、ガドとアシェル。これらは、シリアのメソポタミアで彼[かれ]に生[う]まれたヤコブの息子[むすこ]たちである。"
  27: "ヤコブは、カナンの地[ち]にあるマムレ、すなわち野[の]の町[まち]ヘブロンへ、父[ちち]イサクのもとへ来[き]た。そこはアブラハムとイサクが寄留[きりゅう]した所[ところ]である。"
  28: "イサクが生[い]きた日々[ひび]は、百八十年[ひゃくはちじゅうねん]であった。"
  29: "イサクは力[ちから]尽[つ]きて死[し]に、自分[じぶん]の民[たみ]に加[くわ]えられた。老[お]いて、日々[ひび]に満[み]ちていた。息子[むすこ]であるエサウとヤコブが彼[かれ]を葬[ほうむ]った。"

notes:
  1: "Ἀναστὰς ἀνάβηθι — 立って…上れ (ἀναβαίνω — «восходить»; Вефиль в горах). οἴκει ἐκεῖ — そこに住め. ποίησον θυσιαστήριον — 祭壇を築け (ποιέω здесь «сооружать»). τῷ θεῷ τῷ ὀφθέντι σοι — あなたに現れた神に (ὁράω в страд. «являться»). ἐν τῷ ἀποδιδράσκειν σε ἀπὸ προσώπου Ησαυ — 兄エサウの顔を避けて逃げたとき (ἀποδιδράσκω — «убегать»; ἀπὸ προσώπου — «от лица»)."
  2: "τοὺς θεοὺς τοὺς ἀλλοτρίους — 異教の神々 (ἀλλότριος — «чужой»; речь о терафимах, ср. 31:19,30). ἐκ μέσου ὑμῶν — あなたがたの間から. καθαρίσασθε — 身を清めて. ἀλλάξατε τὰς στολὰς ὑμῶν — 着物を着替えなさい (στολή — «одеяние»)."
  3: "ἀναστάντες ἀναβῶμεν — 立って…上ろう (совещательное 1 л. мн. ч.). τῷ ἐπακούσαντί μοι ἐν ἡμέρᾳ θλίψεως — 苦難の日にわたしの声を聞き届けてくださった (ἐπακούω — «выслушивать, внимать»). ὃς ἦν μετ᾽ ἐμοῦ καὶ διέσωσέν με ἐν τῇ ὁδῷ — その方はわたしとともにいて…道でわたしを救ってくださった (διασῴζω — «спасать»)."
  4: "τὰ ἐνώτια τὰ ἐν τοῖς ὠσὶν αὐτῶν — 耳にある耳飾り (ἐνώτιον — «серьга»; вероятно, амулеты). τερέμινθον — テレビンの木 (τερμίνθινος — «теревинф»). ἐν Σικιμοις — シケムにある (Σίκιμα — город). κατέκρυψεν — 隠した. ἀπώλεσεν αὐτὰ ἕως τῆς σήμερον ἡμέρας — 今日に至るまでそれらを滅ぼした (т. е. они не найдены до сего дня)."
  5: "ἐξῆρεν Ισραηλ — イスラエルは立ち上がった (ἐξαίρω — «подниматься»; здесь Иаков назван Израилем). φόβος θεοῦ — 神への恐れ (страх Божий, напавший на окрестные города). οὐ κατεδίωξαν ὀπίσω — 追いかけて来なかった (καταδιώκω — «преследовать»)."
  6: "Λουζα — ルズ (прежнее имя Вефиля, 28:19; LXX Λουζα). ἥ ἐστιν Βαιθηλ — すなわちベテル."
  7: "ᾠκοδόμησεν — 築き (οἰκοδομέω). ἐπεφάνη — 現れた (ἐπιφαίνω — «являться»). В ru «Эл-Вефиль» — масоретское чтение; в LXX просто Βαιθηλ, поэтому ベテル."
  8: "Δεββωρα ἡ τροφὸς Ρεβεκκας — リベカの乳母デボラ (τροφός — «кормилица»). κατώτερον Βαιθηλ — ベテルから少し下ったところ. ὑπὸ τὴν βάλανον — カシの木の下に (βάλανος — «дуб, жёлудь»; カシ — катаканой, чтобы не брать не常用漢字 樫). Βάλανος πένθους — 嘆きのカシの木 (букв. «дуб плача»). Слав. «и погребоша ю» (погребли её) в LXX нет — это масоретское чтение, в скобки не берём."
  9: "Ὤφθη — 現れ (ὁράω в страд.). ἔτι — 再び (букв. «ещё»). ἐν Λουζα — ルズで. παρεγένετο ἐκ Μεσοποταμίας τῆς Συρίας — シリアのメソポタミアから来た (παραγίνομαι — «прибывать»). ηὐλόγησεν — 祝福された."
  10: "Τὸ ὄνομά σου Ιακωβ — あなたの名はヤコブである. οὐ κληθήσεται ἔτι Ιακωβ — もはやヤコブと呼ばれることはなく. ἀλλ᾽ Ισραηλ ἔσται τὸ ὄνομά σου — イスラエルがあなたの名となる. Слав. и ru добавляют «и нарёк ему имя Израиль» — этого нет в LXX (масоретское чтение), поэтому не переводим и в 〔…〕 не берём. Проверено: ισραηλ в 35:10 в gr-lxx-byz есть."
  11: "Ἐγὼ ὁ θεός σου — わたしはあなたの神である (в LXX без «Всемогущий»; в ru «Бог Всемогущий» — масоретское El Shaddai, отличие в notes). αὐξάνου καὶ πληθύνου — 増えよ、多くなれ. ἔθνη καὶ συναγωγαὶ ἐθνῶν — 諸国民と諸国民の集まり (συναγωγή — «собрание»). βασιλεῖς ἐκ τῆς ὀσφύος σου — 王たちがあなたの腰から (ὀσφύς — «чресла, поясница»)."
  12: "τὴν γῆν, ἣν δέδωκα Αβρααμ καὶ Ισαακ — アブラハムとイサクに与えた地. σοὶ δέδωκα αὐτήν — あなたにも与えた (perfect с силой дарения). τῷ σπέρματί σου μετὰ σέ — あなたの後の子孫に (σπέρμα — «семя, потомство»)."
  13: "ἀνέβη… ἀπ᾽ αὐτοῦ ἐκ τοῦ τόπου — 彼のもとを離れて…上って行かれた (ἀναβαίνω — «восходить», т. е. явление окончилось)."
  14: "στήλην… στήλην λιθίνην — 柱を、すなわち石の柱を (повтор сохранён, как в LXX). ἔσπεισεν ἐπ᾽ αὐτὴν σπονδήν — その上に注ぎの供えを注ぎ (σπένδω — «совершать возлияние»; σπονδή — «возлияние»). ἐπέχεεν ἐπ᾽ αὐτὴν ἔλαιον — その上に油を注いだ."
  15: "τὸ ὄνομα τοῦ τόπου… Βαιθηλ — その場所の名をベテルと (объяснение имени — «дом Божий», ср. 28:19)."
  16: "Ἀπάρας — 発ち (ἀπαίρω — «сниматься со стоянки»). ἔπηξεν τὴν σκηνὴν αὐτοῦ — 天幕を張った (πήγνυμι — «водружать»). ἐπέκεινα τοῦ πύργου Γαδερ — ガデルの塔の向こうに (πύργος — «башня»; Мигдал-Едер). χαβραθα — ハブラタ: LXX оставляет евр. слово без перевода (כִּבְרַת — «мера пути, расстояние»), поэтому и мы не переводим, а даём сноску. ἤγγισεν — 近づいた. ἐδυστόκησεν ἐν τῷ τοκετῷ — 難産であった (δυστοκέω — «тяжело рожать»; τοκετός — «роды»). Слав. в 35:21 повторяет «поставил шатёр за башней Гадер» — это сдвиг нумерации, см. 35:21."
  17: "ἐν τῷ σκληρῶς αὐτὴν τίκτειν — ひどく苦しみながら産んでいるとき (σκληρῶς — «жестоко, тяжко»). ἡ μαῖα — 産婆 (μαῖα — «повивальная бабка»). Θάρσει — 恐れないで (θαρσέω — «дерзать»). καὶ γὰρ οὗτός σοί ἐστιν υἱός — これもまた、あなたの息子だ."
  18: "ἐν τῷ ἀφιέναι αὐτὴν τὴν ψυχήν — 息を引き取ろうとしたとき (букв. «когда она оставляла душу»). ἀπέθνῃσκεν γάρ — 死のうとしていたからである (вставка в скобках-тире, как в греч.). Υἱὸς ὀδύνης μου — 「わたしの苦しみの子」 (ὀδύνη — «боль, мука»; LXX: υἱὸς τῆς ὀδύνης μου в иных списках). Βενιαμιν — ベニヤミン (объяснение имени — «сын правой руки», ср. евр.)."
  19: "ἐτάφη ἐν τῇ ὁδῷ Εφραθα — エフラタへ行く道の途中に葬られた (θάπτω — «погребать»). αὕτη ἐστὶν Βηθλεεμ — そこはベツレヘムである (в gr-lxx-byz эти слова стоят в квадратных скобках; скобки не ставятся, т. к. слово в базе есть)."
  20: "στήλην ἐπὶ τοῦ μνημείου αὐτῆς — 彼女の墓の上に石の柱を (μνημεῖον — «гробница, памятник»). ἕως τῆς σήμερον ἡμέρας — 今日に至るまで."
  21: "κατῴκησεν Ισραηλ — イスラエルが住んだ (κατοικέω). ἐκοιμήθη μετὰ Βαλλας τῆς παλλακῆς — 側女ビルハと寝た (παλλακή — «наложница»; Βαλλα — ビルハ, по современной японской форме). πονηρὸν ἐφάνη ἐναντίον αὐτοῦ — そのことは彼の前に悪と映った (φάνη — от φαίνω «казаться»). Нумерация: в LXX рассказ о Рувиме — стих 21, а «двенадцать сыновей» — 22; в csl/ru (масорет) Рувим попадает в 22-й. Держимся LXX."
  22: "Ἦσαν δὲ οἱ υἱοὶ Ιακωβ δώδεκα — ヤコブの息子は十二人であった (в LXX это отдельный стих; см. notes к 21)."
  23: "πρωτότοκος Ιακωβ Ρουβην — ヤコブの長子ルベン (πρωτότοκος — «первородный»). Имена даны в современной японской форме: ルベン, シメオン, レビ, ユダ, イッサカル, ゼブルン (LXX Ρουβην, Συμεων, Λευι, Ιουδας, Ισσαχαρ, Ζαβουλων)."
  24: "υἱοὶ δὲ Ραχηλ — ラケルの息子たち (у Рахили двое: Иосиф и Вениамин)."
  25: "Βαλλας παιδίσκης Ραχηλ — ラケルの女奴隷ビルハ (παιδίσκη — «служанка-рабыня»). Δαν καὶ Νεφθαλι — ダンとナフタリ."
  26: "Ζελφας παιδίσκης Λειας — レアの女奴隷ジルパ. οἳ ἐγένοντο αὐτῷ ἐν Μεσοποταμίᾳ τῆς Συρίας — シリアのメソポタミアで彼に生まれた (γίνομαι — «рождаться»)."
  27: "εἰς Μαμβρη εἰς πόλιν τοῦ πεδίου — マムレ、すなわち野の町へ (Μαμβρη — дубрава близ Хеврона; πόλις τοῦ πεδίου — «город поля», т. е. Кириаф-Арба). αὕτη ἐστὶν Χεβρων — ヘブロン (в gr-lxx-byz в квадратных скобках; скобки не ставятся). οὗ παρῴκησεν Αβρααμ καὶ Ισαακ — そこはアブラハムとイサクが寄留した所 (παροικέω — «жить пришельцем»). Слав. «ещё живому ему» в LXX нет — редакционная вставка, не переводим."
  28: "ἔτη ἑκατὸν ὀγδοήκοντα — 百八十年."
  29: "ἐκλιπών — 力尽きて (ἐκλείπω — «оставлять, скончаться»). προσετέθη πρὸς τὸ γένος αὐτοῦ — 自分の民に加えられた (формула смерти патриархов). πρεσβύτερος καὶ πλήρης ἡμερῶν — 老いて、日々に満ちていた (πλήρης — «полный»). ἔθαψαν αὐτὸν Ησαυ καὶ Ιακωβ — エサウとヤコブが彼を葬った."
