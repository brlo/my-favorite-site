# jp-box, Бытие, глава 35. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru и ru. jp-joc для Быт 35 отсутствует.
# Язык — современный 常体, порядок членов — по греческому.
# Глава 35: повеление идти в Вефиль (1), очищение дома Иакова (2–4), путь под страхом Божиим (5),
# Вефиль и жертвенник (6–7), смерть Деворы (8), явление Бога и переименование в Израиля (9–13),
# столп и возлияние (14–15), рождение Вениамина и смерть Рахили (16–20), Рувим и Валла (21),
# двенадцать сыновей (22–26), приход к Исааку и его смерть (27–29).
# Красного и синего нет; речь Бога и людей — в 「…」, вложенной речи нет.
# 〔…〕 нет: в gr-lxx-byz есть все слова; славянские добавления (35:8 «и погребли её»,
# 35:10 «и нарёк ему имя Израиль», 35:27 «ещё живому ему») — масоретские или редакционные,
# в скобки не берутся, отмечены в notes.
# Сноска ⟨…⟩ одна — 35:16 ハブラタ (непереведённое греческое χαβραθα), первое место в корпусе.
# jp-ni не использовался.

