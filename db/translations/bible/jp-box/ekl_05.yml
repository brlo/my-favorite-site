# jp-box, Екклесиаст, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация LXX: глава 5 начинается там, где в Синодальном 4:17 (5:1–6 = Син. 4:17–5:5),
# поэтому с масоретскими номерами не совпадает. 5:1–6 — о молитве и обетах, 5:7–8 — о неправде
# и властях, 5:9–19 — о богатстве.
# Красного и синего нет: речь Екклесиаста — от первого лица, без кавычек; чужая речь — в 「…」,
# его слова о себе — в 「…」.
# 〔…〕 нет: все слова есть в gr-lxx-byz; славянские усиления («горе… долу» в 5:1, «начало»
# в 5:10) в греческом отсутствуют, но это стилистика славянского, а не отдельное чтение Церкви,
# поэтому в текст не внесены — оговорено в notes.
# Сносок ⟨…⟩ нет: 誓願 пояснён в Деян 18:18; 銀, 富, 魂, 王 уже в корпусе или понятны.
# jp-ni не использовался.

tr_code: jp-box
book: ekl
chapter: 5
draft: true

verses:
  1: "口[くち]を急[いそ]いではならない。心[こころ]も、神[かみ]の前[まえ]で言葉[ことば]を出[だ]すことに急[いそ]いではならない。神[かみ]は天[てん]におられ、あなたは地[ち]の上[うえ]にいるからである。だから、あなたの言葉[ことば]は少[すく]なくせよ。"
  2: "多[おお]くの心配[しんぱい]の中[なか]から夢[ゆめ]がやって来[く]るように、多[おお]くの言葉[ことば]の中[なか]から愚[おろ]かな者[もの]の声[こえ]がやって来[く]る。"
  3: "神[かみ]に誓願[せいがん]を立[た]てたなら、それを果[は]たすのを遅[おく]らせてはならない。愚[おろ]かな者[もの]の中[なか]に神[かみ]の御心[みこころ]はないからである。誓[ちか]ったことは何[なん]でも果[は]たせ。"
  4: "誓願[せいがん]を立[た]てないほうが、立[た]てて果[は]たさないより良[よ]い。"
  5: "あなたの口[くち]が、あなたの肉体[にくたい]を罪[つみ]に陥[おとしい]れることのないようにせよ。神[かみ]の前[まえ]で「それは知[し]らずにしたことです」と言[い]ってはならない。神[かみ]があなたの声[こえ]に怒[いか]られ、あなたの手[て]の業[わざ]を滅[ほろ]ぼされないためである。"
  6: "夢[ゆめ]が多[おお]いところには空[むな]しさも多[おお]く、言葉[ことば]も多[おお]くなる。だから、神[かみ]を畏[おそ]れよ。"
  7: "国[くに]のうちで、貧[まず]しい者[もの]への虐[しいた]げや、裁[さば]きと正[ただ]しさが奪[うば]われるのを見[み]ても、そのことに驚[おどろ]いてはならない。高[たか]い者[もの]の上[うえ]には、さらに高[たか]い者[もの]が目[め]を配[くば]っているからである。その上[うえ]にもまた、高[たか]い者[もの]たちがいる。"
  8: "すべての面[めん]で地[ち]の豊[ゆた]かさがある。耕[たがや]された畑[はたけ]には王[おう]がいる。"
  9: "銀[ぎん]を愛[あい]する者[もの]は、銀[ぎん]に満[み]たされることがない。富[とみ]の多[おお]さを愛[あい]する者[もの]に、何[なん]の実[み]があるだろうか。これもまた空[むな]しい。"
  10: "財[ざい]が多[おお]くなれば、それを食[く]らう者[もの]も多[おお]くなる。持[も]ち主[ぬし]には何[なん]の力[ちから]があるというのか。ただ自分[じぶん]の目[め]で見[み]るだけのことである。"
  11: "奴隷[どれい]の眠[ねむ]りは甘[あま]い。少[すこ]し食[た]べても多[おお]く食[た]べても変[か]わらない。しかし、富[とみ]に満[み]ちた者[もの]には、眠[ねむ]らせてくれる者[もの]がない。"
  12: "日[ひ]の下[もと]でわたしが見[み]た病[やまい]がある。富[とみ]がその持[も]ち主[ぬし]によって守[まも]られ、かえってその者[もの]の災[わざわ]いになるという病[やまい]である。"
  13: "その富[とみ]は苦[くる]しい務[つと]めのうちに失[うしな]われ、子[こ]をもうけても、その手[て]には何[なに]も残[のこ]らない。"
  14: "母[はは]の胎[たい]から裸[はだか]で出[で]て来[き]たように、また裸[はだか]で帰[かえ]って行[い]く。労苦[ろうく]によって得[え]たものを、手[て]に携[たずさ]えて行[い]くことはできない。"
  15: "これもまた悪[わる]い病[やまい]である。来[き]たときと同じように去[さ]って行[い]くのだから、風[かぜ]に向[む]かって労苦[ろうく]する者[もの]に、何[なん]の益[えき]があるだろうか。"
  16: "その日[ひ]々[び]はすべて、暗[くら]がりと悲[かな]しみと多[おお]くの怒[いか]りと病[やまい]と苦[にが]い思[おも]いの中[なか]にある。"
  17: "見[み]よ、わたしが見[み]た良[よ]いこと、すなわち美[うつく]しいこととは、食[た]べ、飲[の]み、日[ひ]の下[もと]で労苦[ろうく]するすべての労苦[ろうく]の中[なか]で善[よ]いものを見[み]ることである。それは、神[かみ]がその人[ひと]に与[あた]えられた命[いのち]の日[ひ]数[かず]の間[あいだ]のことである。これがその人[ひと]の分[ぶん]だからである。"
  18: "また、神[かみ]が富[とみ]と財産[ざいさん]を与[あた]え、それを食[た]べ、自分[じぶん]の分[ぶん]を受[う]け取[と]り、労苦[ろうく]の中[なか]で喜[よろこ]ぶことを許[ゆる]されたすべての人[ひと]にとって、これは神[かみ]の賜物[たまもの]である。"
  19: "その人[ひと]は自分[じぶん]の命[いのち]の日[ひ]々[び]を長[なが]くは思[おも]い出[だ]さない。神[かみ]がその人[ひと]を、心[こころ]の喜[よろこ]びのうちに過[す]ごさせておられるからである。"

notes:
  1: "μὴ σπεῦδε ἐπὶ στόματί σου — «не спеши устами» (σπεύδω — спешить). ἐξενεγκεῖν λόγον — «произнести слово». ὁ θεὸς ἐν τῷ οὐρανῷ, σὺ ἐπὶ τῆς γῆς — 神は天におられ、あなたは地の上にいる. ὀλίγοι — «немногие». Слав. прибавляет «горе… долу» (вверху… внизу); в греч. этого нет — это славянское усиление, а не отдельное чтение, поэтому 〔…〕 не ставится."
  2: "ἐνύπνιον — «сон, сновидение»; περισπασμός — «занятие, забота» (здесь «множество дел»). Слав. «соние во множестве попечения»: сон приходит от множества забот, а голос глупого — от множества слов."
  3: "εὔξῃ εὐχήν — «дашь обет» (εὐχή — 誓願). οὐκ ἔστιν θέλημα ἐν ἄφροσιν — «нет благоволения в глупых»: Бог не благоволит к неисполнившему обет. σὺν ὅσα ἐὰν εὔξῃ ἀπόδος — «всё, что обещал, отдай»."
  4: "ἀγαθὸν τὸ μὴ εὔξασθαι ἢ τὸ εὔξασθαι καὶ μὴ ἀποδοῦναι — «лучше не обещать, чем обещать и не отдать». Сравнение без «чем»: ἀγαθόν… ἤ."
  5: "μὴ δῷς τὸ στόμα σου τοῦ ἐξαμαρτῆσαι τὴν σάρκα σου — букв. «не дай устам твоим ввести в грех плоть твою»; σάρξ здесь — сам человек. Ἄγνοια — «незнание, ошибка» (слав. «неведение»). В Синодальном (с масоретского) «пред Ангелом Божиим», в LXX θεοῦ — поэтому 神の前で. διαφθείρῃ — «погубит, растлит»."
  6: "ἐν πλήθει ἐνυπνίων — «во множестве сновидений». σὺν τὸν θεόν — «вместе с этим Бога бойся» (слав. «темже Бога бойся»). 神を畏れる — устойчивая передача φοβεῖσθαι τὸν θεόν."
  7: "συκοφαντία πένητος — «притеснение бедного»; ἁρπαγὴ κρίματος — «расхищение суда»; в модуле стоит повреждённое «δι᾽ καιοσύνης» вместо δικαιοσύνης — «и правды» (так в слав.). ὑψηλὸς ἐπάνω ὑψηλοῦ — «высокий над высоким»: над каждой властью есть высшая."
  8: "καὶ περισσεία γῆς ἐν παντί ἐστι, βασιλεὺς τοῦ ἀγροῦ εἰργασμένου — тёмное место, букв. «и изобилие земли во всём есть: царь поля возделанного». Слав. «изобилие земли над всем есть царь села возделанна»; Синодальный сглаживает: «превосходство страны… царь, заботящийся о стране». Держусь греческого, не сглаживаю."
  9: "ἀργύριον — 銀, серебро (здесь деньги). οὐ πλησθήσεται ἀργυρίου — «не насытится серебром». τίς ἠγάπησεν ἐν πλήθει αὐτῶν γένημα — тёмное: «кто возлюбил во множестве их прибыль?»; слав. «кто насладится во множестве его плода?»; передано «何の実があるだろうか». γένημα — «плод, урожай»."
  10: "ἀγαθωσύνη здесь — «благо, имущество»; ἐπληθύνθησαν ἔσθοντες αὐτήν — «умножились едящие её». ἀνδρεία — «мужество, сила» (слав. «кое мужество имущему е?»). ἀλλ᾽ ἢ τοῦ ὁρᾶν — «разве только видеть»; слав. вставило «начало» (в греч. нет), поэтому не перенесено."
  11: "γλυκὺς ὕπνος τοῦ δούλου — «сладок сон раба». εἰ ὀλίγον καὶ εἰ πολὺ φάγεται — «мало ли, много ли съест». οὐκ ἔστιν ἀφίων αὐτὸν τοῦ ὑπνῶσαι — букв. «нет отпускающего его спать»; слав. подставило «богатство»: «богатство не оставляет уснути». Держусь греческого."
  12: "ἀρρωστία — «недуг» (в книге передаётся 病). πλοῦτον φυλασσόμενον τῷ παρ᾽ αὐτοῦ — «богатство, сберегаемое у него», т.е. у владельца. εἰς κακίαν αὐτοῦ — «во зло ему». Ср. 6:1–2."
  13: "ἐν περισπασμῷ πονηρῷ — «в тяжкой заботе» (слав. «в попечении лукавне»); Синодальный «от несчастных случаев» — иное, масоретское понимание. ἐγέννησεν υἱόν — «родил сына»: наследник есть, а в руке ничего."
  14: "καθὼς ἐξῆλθεν… γυμνός — «как вышел нагим из утробы матери». οὐδὲν οὐ λήμψεται — двойное отрицание: «ничего не возьмёт». ἵνα πορευθῇ ἐν χειρὶ αὐτοῦ — «чтобы понести в руке своей». Ср. Иов 1:21."
  15: "πονηρὰ ἀρρωστία — «злой недуг». ὥσπερ παρεγένετο, οὕτως ἀπελεύσεται — «как пришёл, так и уйдёт». εἰς ἄνεμον — «на ветер» (слав. «на ветр»); περισσεία — «прибыток»."
  16: "ἐν σκότει καὶ πένθει καὶ θυμῷ πολλῷ καὶ ἀρρωστίᾳ καὶ χόλῳ — пять бедствий подряд: тьма, плач, великий гнев, недуг, желчь. χολή — «желчь, горечь»; слав. «во гневе»."
  17: "ὃ εἶδον ἐγὼ ἀγαθόν, ὅ ἐστιν καλόν — «что я увидел доброго, что прекрасно». ἀγαθωσύνη — «благо». ἀριθμὸν ἡμερῶν ζωῆς — «число дней жизни». μερίς — «доля, удел» (слав. «часть»)."
  18: "ὑπάρχοντα — «имущество»; ἐξουσίασεν — «дал власть»; δόμα θεοῦ — «дар Божий». εὐφρανθῆναι — 喜ぶ, веселиться. Та же мысль, что в 5:17, но с добавлением «власти»."
  19: "οὐ πολλὰ μνησθήσεται τὰς ἡμέρας — «немного будет вспоминать дни»: в радости дни проходят незаметно. περισπᾷ — «занимает, отвлекает» (слав. «облагает его попеченьми в веселии сердца его»); Синодальный «вознаграждает» — иное."
