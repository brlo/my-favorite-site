# jp-box, 4-я Царств, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в молитве и речах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 20: болезнь Езекии и молитва (1–3), ответ Господа через Исаию (4–6),
# смоквы и знамение тени (7–11), посольство Меродах-Баладана (12–15),
# пророчество о вавилонском плене (16–18), ответ Езекии (19), итог
# царствования и смерть (20–21).
# Нумерация по gr: 21 стих, совпадает с csl.
# Речи: Исаия — 「…」 (1, 7, 9, 14, 15, 16), слово Господа внутри — 『…』
# (1, 5–6, 17–18); молитва Езекии — 「…」 (3); Езекия — 「…」 (8, 10, 14, 15, 19).
# 〔…〕 нет: все стихи есть в gr-lxx-byz; расхождений с csl по составу текста
# нет, отличия чтений оговорены в notes.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 預言者, 宦官, 泉, 水路 уже в корпусе. Красного нет.
# jp-ni не использовался.

