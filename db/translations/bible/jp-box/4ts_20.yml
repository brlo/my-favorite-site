verses:
  1: "そのころ、ヒゼキヤは死[し]に至[いた]る病[やまい]にかかった。預言者[よげんしゃ]イザヤ、アモスの子[こ]が彼[かれ]のもとへ来[き]て言[い]った。「主[しゅ]はこう言[い]われる。『あなたの家[いえ]のことを片[かた]づけなさい。あなたは死[し]ぬ。生[い]き延[の]びることはない。』」"
  2: "ヒゼキヤは顔[かお]を壁[かべ]に向[む]けて主[しゅ]に祈[いの]って言[い]った。"
  3: "「ああ、主[しゅ]よ。どうか思[おも]い起[おこ]してください。わたしがあなたの前[まえ]を真実[しんじつ]と全[まった]き心[こころ]で歩[あゆ]み、あなたの目[め]に良[よ]いことを行[おこな]ってきた。」そしてヒゼキヤは激[はげ]しく泣[な]いた。"
  4: "イザヤはまだ中庭[なかにわ]にいた。そのとき、主[しゅ]の言葉[ことば]が彼[かれ]に臨[のぞ]んで言[い]った。"
  5: "「引[ひ]き返[かえ]して、わたしの民[たみ]の導[みちび]き手[て]であるヒゼキヤに言[い]いなさい。『あなたの父[ちち]ダビデの神[かみ]である主[しゅ]はこう言[い]われる。わたしはあなたの祈[いの]りを聞[き]き、あなたの涙[なみだ]を見[み]た。見[み]よ、わたしはあなたを癒[いや]す。三[み]日目[みっかめ]にあなたは主[しゅ]の神殿[しんでん]に上[のぼ]る。"
  6: "わたしはあなたの日[ひ]々[び]に十五[じゅうご]年[ねん]を加[くわ]え、あなたとこの町[まち]をアッシリアの王[おう]の手[て]から救[すく]う。わたしはこの町[まち]を、わたし自身[じしん]のため、またわたしのしもべダビデのために守[まも]る。』」"
  7: "そして言[い]った。「干[ほ]しいちじくの塊[かたまり]を持[も]って来[き]て、できものに当[あ]てなさい。そうすれば癒[いや]される。」"
  8: "ヒゼキヤはイザヤに言[い]った。「主[しゅ]がわたしを癒[いや]し、三[み]日目[みっかめ]にわたしが主[しゅ]の神殿[しんでん]に上[のぼ]るという、そのしるしは何[なん]か。」"
  9: "イザヤは言[い]った。「これは主[しゅ]からのしるしである。主[しゅ]が語[かた]られた言葉[ことば]を成[な]し遂[と]げられるというしるしである。影[かげ]が十[じゅう]段[だん]進[すす]むか、それとも十段[じゅうだん]戻[もど]るか。」"
  10: "ヒゼキヤは言[い]った。「影[かげ]が十[じゅう]段[だん]進[すす]むのはたやすいことだ。いいえ、影[かげ]が十段[じゅうだん]後[うし]ろに戻[もど]るようにしてほしい。」"
  11: "預言者[よげんしゃ]イザヤは主[しゅ]に呼[よ]ばわった。すると影[かげ]は、段[だん]の上[うえ]で十段[じゅうだん]後[うし]ろへ戻[もど]った。"
  12: "そのころ、バビロンの王[おう]メロダク・バラダン、バラダンの子[こ]が、ヒゼキヤが病[やまい]にかかったと聞[き]いて、書[しょ]き物[もの]と贈[おく]り物[もの]をヒゼキヤに送[おく]った。"
  13: "ヒゼキヤは彼[かれ]らを喜[よろこ]んで迎[むか]え、自分[じぶん]の宝庫[ほうこ]のすべて、すなわち銀[ぎん]と金[きん]、香料[こうりょう]、良[よ]い油[あぶら]、器[うつわ]の蔵[くら]、およびその宝[たから]のうちに見[み]つかるすべてのものを彼[かれ]らに見[み]せた。ヒゼキヤが自分[じぶん]の家[いえ]と自分[じぶん]の全[すべ]ての領地[りょうち]で彼[かれ]らに見[み]せなかったものは、一[ひと]つもなかった。"
  14: "預言者[よげんしゃ]イザヤはヒゼキヤ王[おう]のもとへ来[き]て言[い]った。「あの人[ひと]たちは何[なに]を言[い]ったのか。どこからあなたのもとへ来[き]たのか。」ヒゼキヤは言[い]った。「遠[とお]い地[ち]から、バビロンからわたしのもとへ来[き]た。」"
  15: "イザヤは言[い]った。「あなたの家[いえ]で彼[かれ]らは何[なに]を見[み]たのか。」ヒゼキヤは言[い]った。「わたしの家[いえ]にあるものはすべて見[み]た。わたしの宝[たから]の中[なか]のものも見せた。わたしが彼[かれ]らに見[み]せなかったものは、わたしの家[いえ]には一[ひと]つもない。」"
  16: "イザヤはヒゼキヤに言[い]った。「主[しゅ]の言葉[ことば]を聞[き]きなさい。『"
  17: "見[み]よ、日[ひ]が来[く]る。そのとき、あなたの家[いえ]にあるすべてのもの、あなたの父祖[ふそ]たちが今日[きょう]までに蓄[たくわ]えたすべてのものはバビロンへ運[はこ]び去[さ]られる。何[なに]も残[のこ]らない、と主[しゅ]は言[い]われる。"
  18: "また、あなたから生[う]まれてあなたのもとを出[で]るあなたの子[こ]らは連[つ]れて行[い]かれ、バビロンの王[おう]の宮殿[きゅうでん]で宦官[かんがん]となる。』」"
  19: "ヒゼキヤはイザヤに言[い]った。「主[しゅ]が語[かた]られた言葉[ことば]は良[よ]い。わたしの日[ひ]々[び]に平和[へいわ]があるように。」"
  20: "ヒゼキヤの残[のこ]りの言葉[ことば]、その力[ちから]のすべて、彼[かれ]が行[おこな]ったすべてのこと、すなわち泉[いずみ]と水路[すいろ]を造[つく]って水[みず]を町[まち]に引[ひ]き入[い]れたことは、見[み]よ、ユダの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  21: "ヒゼキヤは先祖[せんぞ]たちとともに眠[ねむ]り、ダビデの町[まち]に葬[ほうむ]られた。その子[こ]マナセが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "ἠρρώστησεν εἰς θάνατον — заболел смертельно (εἰς θάνατον — «к смерти»); Ἔντειλαι τῷ οἴκῳ σου — «дай повеление дому твоему», т. е. сделай завещание (ἐντέλλομαι); ἀποθνῄσκεις σὺ καὶ οὐ ζήσῃ — «ты умираешь и не будешь жить». Слав. добавляет «царь» («разболеся езекиа царь») — в гр этого нет."
  2: "ἀπέστρεψεν τὸ πρόσωπον πρὸς τὸν τοῖχον — обратил лицо к стене; ηὔξατο — помолился (εὔχομαι). Стих кончается «говоря», речь — в 3."
  3: "Ὦ δή — восклицание, «о, молю»; μνήσθητι δή — вспомни же; ἐν ἀληθείᾳ καὶ ἐν καρδίᾳ πλήρει — в истине и сердцем полным (πλήρης); τὸ ἀγαθὸν ἐν ὀφθαλμοῖς σου ἐποίησα — делал угодное в очах Твоих; ἔκλαυσεν κλαυθμῷ μεγάλῳ — «плакал плачем великим», усилительный оборот."
  4: "ἐν τῇ αὐλῇ τῇ μέσῃ — на среднем дворе (中庭); ῥῆμα κυρίου ἐγένετο πρὸς αὐτόν — было слово Господне к нему. В гр «ещё» нет (только ἦν — «был»); слав. «бяше исаиа еще посреде двора», отсюда まだ."
  5: "ὁ ἡγούμενος τοῦ λαοῦ μου — вождь народа Моего (導き手); Ἤκουσα τῆς προσευχῆς σου — услышал молитву твою (генитив); εἶδον τὰ δάκρυά σου — увидел слёзы твои; ἰάσομαί σε — исцелю тебя; τῇ ἡμέρᾳ τῇ τρίτῃ — в третий день. Здесь открывается слово Господа (5–6)."
  6: "προσθήσω ἐπὶ τὰς ἡμέρας σου πέντε καὶ δέκα ἔτη — прибавлю к дням твоим пятнадцать лет; ἐκ χειρὸς βασιλέως Ἀσσυρίων σώσω σε — из руки царя Ассирийского спасу тебя; ὑπερασπιῶ — буду защищать (ὑπερασπίζω); δι᾿ ἐμέ … διὰ Δαυιδ τὸν δοῦλόν μου — ради Меня и ради Давида, раба Моего."
  7: "Λαβέτωσαν — императив 3-го л. мн. ч. «пусть возьмут» (безличное повеление); παλάθη σύκων — пласт, лепёшка смокв (干しいちじくの塊); ἕλκος — нарыв, язва (できもの); ὑγιάσει — выздоровеет. Слав. добавляет «И рече исаиа» — в гр только εἶπεν."
  8: "Τί τὸ σημεῖον ὅτι ἰάσεταί με κύριος — «какое знамение, что исцелит меня Господь»; ἀναβήσομαι εἰς οἶκον κυρίου — взойду в дом Господень."
  9: "Τοῦτο τὸ σημεῖον παρὰ κυρίου — «это знамение от Господа»; ποιήσει κύριος τὸν λόγον, ὃν ἐλάλησεν — исполнит Господь слово, которое изрёк. πορεύσεται ἡ σκιά δέκα βαθμούς, ἐὰν ἐπιστρέφῃ δέκα βαθμούς — «пойдёт ли тень на десять ступеней, или возвратится на десять ступеней»: в гр нет вопросительной частицы, вопрос выражен интонацией; слав. добавляет «хощеши ли да» — не внесено. σκιά — тень, βαθμός — ступень (段)."
  10: "Κοῦφον τὴν σκιὰν κλῖναι — «легко тени наклониться», т. е. подвинуться; οὐχί — «нет»; ἐπιστραφήτω … εἰς τὰ ὀπίσω — «да возвратится назад» (императив 3-го л.)."
  11: "ἐβόησεν — возопил (βοάω); ἐν τοῖς ἀναβαθμοῖς — «на ступенях» (ἀναβαθμός; в ru «по ступеням Ахазовым» — по МТ, в гр имени Ахаза нет); εἰς τὰ ὀπίσω δέκα βαθμούς — назад на десять ступеней."
  12: "Μαρωδαχβαλαδαν υἱὸς Βαλαδαν — Меродах-Баладан, сын Баладана (メロダク・バラダン; в слав. «мародах валадан, сын валаданов», в ru «Беродах Баладан»); βιβλία καὶ μαναα — письма и дар (μαναα — евр. минха, дар); ὅτι ἤκουσεν ὅτι ἠρρώστησεν — ибо услышал, что он заболел."
  13: "ἐχάρη ἐπ᾿ αὐτοῖς — обрадовался о них, т. е. радушно принял; οἶκος τοῦ νεχωθα — «дом сокровищницы» (евр. נכת; слав. «дом свой сокровищный»), передано 宝庫; ἀρώματα — ароматы,香料; ἔλαιον τὸ ἀγαθόν — елей добрый; οἶκος τῶν σκευῶν — «дом сосудов» (утвари; возможно, оружейный склад), передано 器の蔵; ἐξουσία — владение, область."
  14: "πόρρωθεν — издалека; ἥκασιν — пришли (ἥκω); ἐκ Βαβυλῶνος — из Вавилона."
  15: "Τί εἶδον — что увидели; οὐκ ἦν … ὃ οὐκ ἔδειξα — «не было, чего я не показал»; ἀλλὰ καὶ τὰ ἐν τοῖς θησαυροῖς μου — «но и то, что в сокровищницах моих». Слав. добавляет в конце «(видеша)» — по смыслу, не внесено."
  16: "Ἄκουσον λόγον κυρίου — выслушай слово Господне (императив ед. ч.). Здесь Исаия вводит слово Господа (17–18)."
  17: "λημφθήσεται — будет взято (λαμβάνω); ἐθησαύρισαν οἱ πατέρες σου — собрали отцы твои; ἕως τῆς ἡμέρας ταύτης — до сего дня; εἰς Βαβυλῶνα — в Вавилон. καὶ οὐχ ὑπολειφθήσεται ῥῆμα, ὃ εἶπεν κύριος — букв. «и не останется слово, которое сказал Господь» (слав. так же); евр. דָּבָר значит и «слово», и «вещь», поэтому передано по смыслу: 何も残らない, как в ru."
  18: "οἱ υἱοί σου, οἳ ἐξελεύσονται ἐκ σοῦ — сыновья твои, которые выйдут из тебя; οὓς γεννήσεις — которых ты родишь; λήμψεται — «возьмёт» (безличное, ед. ч.); εὐνοῦχοι — евнухи (宦官); ἐν τῷ οἴκῳ τοῦ βασιλέως — в доме царя, т. е. при дворце."
  19: "Ἀγαθὸς ὁ λόγος κυρίου — благ слово Господне; ἔστω εἰρήνη ἐν ταῖς ἡμέραις μου — да будет мир во дни мои. Слав. «да будут мир во дни моя»; в ru добавлено «и благосостояние» — в гр этого нет."
  20: "τὰ λοιπὰ τῶν λόγων — прочее слов (残りの言葉); δυναστεία — сила, могущество (力); κρήνη — источник (泉); ὑδραγωγός — водопровод (水路, слав. «водотечь»); εἰσήνεγκεν τὸ ὕδωρ εἰς τὴν πόλιν — провёл воду в город; βιβλίον λόγων τῶν ἡμερῶν — «книга слов дней», летопись (日誌の書); οὐχί — «не… ли»."
  21: "ἐκοιμήθη — почил (κοιμάω, формула смерти); ἐτάφη ἐν πόλει Δαυιδ — погребён в городе Давида; ἐβασίλευσεν Μανασσης υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Манассия, сын его, вместо него."
