verses:
  1: "ダビデの最後[さいご]の言葉[ことば]は次[つぎ]のとおりである。「エッサイの子[こ]、忠実[ちゅうじつ]なダビデの言葉[ことば]。ヤコブの神[かみ]の油[あぶら]を注[そそ]がれた者[もの]として主[しゅ]が立[た]てられた、忠実な人[ひと]の言葉。イスラエルの麗[うるわ]しい歌[うた]。"
  2: "主[しゅ]の霊[れい]がわたしのうちに語[かた]り、その言葉[ことば]がわたしの舌[した]の上[うえ]にある。"
  3: "イスラエルの神[かみ]は言[い]われる。イスラエルの守[まも]り手[て]はわたしに語[かた]られた。『たとえを語[かた]って言[い]った。人[ひと]のうちで、どうしてお前[まえ]たちは神[かみ]への恐[おそ]れを強[つよ]く保[たも]つのか。"
  4: "神[かみ]の光[ひかり]、朝[あさ]の光[ひかり]のうちに太陽[たいよう]が昇[のぼ]る。朝[あさ]はその輝[かがや]きから過[す]ぎ去[さ]らない。地[ち]から雨[あめ]による若草[わかくさ]が生[は]えるように。』"
  5: "わたしの家[いえ]は、強[つよ]き方[かた]とともに、そのようではないか。その方はわたしと永遠[えいえん]の契約[けいやく]を結[むす]ばれた。それはすべての時[とき]に備[そな]えられ、守[まも]られている。わたしの救[すく]いのすべてと望[のぞ]みのすべては主[しゅ]にある。不法[ふほう]な者[もの]は芽[め]を出[だ]すことがないからである。"
  6: "彼[かれ]らはみな、投[な]げ出[だ]された茨[いばら]のようである。手[て]で取[と]られることはないからである。"
  7: "だれも彼[かれ]らを手[て]に取[と]って労[ろう]しない。鉄[てつ]と槍[やり]の柄[え]でいっぱいである。彼らはその恥[はじ]のうちに火[ひ]で焼[や]き尽[つ]くされる。」"
  8: "ダビデの勇士[ゆうし]たちの名[な]は次[つぎ]のとおりである。イシュボシェト・ハナアン人は第三[だいさん]の長[かしら]である。アドニン・アソン人。彼[かれ]は自分[じぶん]の剣[けん]を抜[ぬ]いて八百[はっぴゃく]の者[もの]に向[む]かい、一度[いちど]に打[う]ち勝[か]った。"
  9: "彼[かれ]の後[あと]には、エレアザル、彼の叔父[おじ]の子[こ]、スシ人の子[こ]がいた。三人[にん]の勇士[ゆうし]のうちである。彼はダビデとともにセランにいた。ペリシテ人[じん]をののしったとき、ペリシテ人は戦[いくさ]のためにそこに集[あつ]まり、イスラエルの人々[ひとびと]は上[のぼ]って行[い]った。"
  10: "彼[かれ]は立[た]ち上がってペリシテ人[じん]を打[う]ち殺[ころ]し、その手[て]が疲[つか]れて剣[けん]に張[は]り付[つ]くまで続[つづ]けた。主[しゅ]はその日[ひ]、大[おお]きな救[すく]いを成[な]し遂[と]げられた。民[たみ]は彼の後[あと]に従[したが]い、ただ倒[たお]れた者[もの]からはぎ取[と]るだけであった。"
  11: "彼[かれ]の後[あと]には、アサの子[こ]、アルフ人[びと]サマイアがいた。ペリシテ人[じん]がテリアに集[あつ]まったとき、そこにレンズ豆[まめ]の満[み]ちた畑[はたけ]の一区画[ひときく]があった。民[たみ]はペリシテ人の前[まえ]から逃[に]げた。"
  12: "彼[かれ]はその区画[くかく]の真[ま]ん中[なか]に立[た]ちはだかり、それを奪[うば]い返[かえ]してペリシテ人[じん]を打[う]ち殺[ころ]した。主[しゅ]は大[おお]きな救[すく]いを成[な]し遂[と]げられた。"
  13: "三十人[にん]のうちの三人[にん]が下[くだ]って、カソンで、オドラムの洞窟[どうくつ]にいるダビデのもとへ来[き]た。そのとき、ペリシテ人[じん]の部隊[ぶたい]がラファイムの谷[たに]に陣[じん]を取[と]っていた。"
  14: "ダビデはそのとき要害[ようがい]にいて、ペリシテ人[じん]の陣営[じんえい]はベツレヘムにあった。"
  15: "ダビデは望[のぞ]んで言[い]った。「だれか、ベツレヘムの門[もん]のそばの水[みず]溜[だ]めの水[みず]を飲[の]ませてくれないか。」ペリシテ人[じん]の部隊[ぶたい]はそのときベツレヘムにあった。"
  16: "三人[にん]の勇士[ゆうし]はペリシテ人[じん]の陣営[じんえい]を切[き]り抜[ぬ]け、ベツレヘムの門[もん]のそばの水[みず]溜[だ]めから水[みず]を汲[く]んで、ダビデのもとへ持[も]って来[き]た。しかし、ダビデはそれを飲[の]もうとせず、主[しゅ]に注[そそ]ぎ出[だ]した。"
  17: "そして言[い]った。「主[しゅ]よ、わたしがそのようなことをするなど、決[けっ]してありえない。自分[じぶん]の命[いのち]をかけて行[い]った者[もの]たちの血[ち]を、どうして飲[の]めようか。」ダビデはそれを飲[の]もうとしなかった。これが、あの三人[にん]の勇士[ゆうし]がしたことである。"
  18: "ヨアブの兄弟[きょうだい]、サルヤの子[こ]アベシャは、三人[にん]のうちの長[かしら]であった。彼[かれ]は槍[やり]を三百[さんびゃく]の者[もの]に向[む]けて振[ふ]るい、三人のうちで名[な]を得[え]た。"
  19: "彼[かれ]はあの三人のうちで最も[もっとも]輝[かがや]いていたので、彼らの長[かしら]となった。しかし、あの三人には及[およ]ばなかった。"
  20: "ヨダエの子[こ]ベナヤは、カブツェエルから来[き]た、業[わざ]の多[おお]い人[ひと]であった。彼[かれ]はモアブ人[じん]アリエルの二人[ふたり]の子[こ]を打[う]ち殺[ころ]した。彼はまた、雪[ゆき]の日[ひ]に、水[みず]溜[だ]めの中[なか]の獅子[しし]を殺[ころ]した。"
  21: "彼[かれ]はまた、見栄[みば]えのするエジプト人[じん]を打[う]ち殺[ころ]した。エジプト人の手[て]には、梯子[はしご]の木[き]のような槍[やり]があった。彼は杖[つえ]を持[も]ってその男[おとこ]のところへ下[お]り、エジプト人の手から槍[やり]を奪[うば]い取[と]って、その槍[やり]で彼を殺[ころ]した。"
  22: "これがヨダエの子[こ]ベナヤのしたことであり、彼は三人[にん]の勇士[ゆうし]のうちで名[な]を得[え]た。"
  23: "彼[かれ]は三人[にん]のうちで最も[もっとも]輝[かがや]いていたが、あの三人には及[およ]ばなかった。ダビデは彼を自分[じぶん]の側近[そっきん]に置[お]いた。"
  24: "ダビデ王[おう]の勇士[ゆうし]たちの名[な]は次[つぎ]のとおりである。ヨアブの兄弟[きょうだい]アサエル、すなわち三十人[にん]のうちの一人[ひとり]。ベツレヘムのエルハナン、彼の叔父[おじ]ドダイの子[こ]、"
  25: "アルダイ人[じん]シャマイ、アロダイ人エリカ、"
  26: "ペロティ人[びと]エレス、テコア人イラ、エッカの子[こ]、"
  27: "アナトト人アビエゼル、アソフィトの子[こ]らから出[で]たサブハイ、"
  28: "アオ人セルモン、ネトファ人モオレ、"
  29: "ネトファ人エラ、バアナの子[こ]、ギブオンから来[き]たエタイ、リバの子[こ]、ベニヤミンの子[こ]ら、"
  30: "ピラトン人ベナヤ、ナハリ・ガアシュから来[き]たウリ、"
  31: "アラボト人[びと]の子[こ]アビエル、バルサム人ザオル、"
  32: "シャアルボン人エリアス、ヤシャンの子[こ]ら、ヨナタン、"
  33: "アロド人シャンマ、サラルの子[こ]アヒアン、アラル人[びと]、"
  34: "アハスバイの子[こ]、マアハ人[びと]の子[こ]エリフェレト、ギロ人[びと]アヒトフェルの子[こ]エリアブ、"
  35: "カルメル人[びと]アサライ、エルヒ人[びと]ファライ、"
  36: "ナタンの子[こ]イガル、ガディの子[こ]バアン、"
  37: "アンモン人[じん]エリエ、ベロト人[びと]ゲロライ、ヨアブの子[こ]サルヤの武器[ぶき]を持[も]つ者[もの]、"
  38: "イテル人[びと]イラ、イテル人ガレブ、"
  39: "ヘト人[びと]ウリヤ。すべて三十七人[にん]である。"

notes:
  1: "οἱ λόγοι Δαυιδ οἱ ἔσχατοι — ダビデの最後の言葉. πιστὸς Δαυιδ υἱὸς Ιεσσαι — エッサイの子、忠実なダビデ (πιστός — верный; слав. «верен»; в евр. здесь «изречение»). ὃν ἀνέστησεν κύριος ἐπὶ χριστὸν θεοῦ Ιακωβ — которого Господь поставил помазанником Бога Иаковлева (ἐπί с винительным — «в»). εὐπρεπεῖς ψαλμοὶ Ισραηλ — イスラエルの麗しい歌 (ψαλμός — псалом, песнь; в греч. множественное число, в японском собирательно)."
  2: "πνεῦμα κυρίου ἐλάλησεν ἐν ἐμοί — 主の霊がわたしのうちに語り. ἐπὶ γλώσσης μου — わたしの舌の上に."
  3: "λέγει ὁ θεὸς Ισραηλ — イスラエルの神は言われる. ἐμοὶ ἐλάλησεν φύλαξ Ισραηλ — イスラエルの守り手はわたしに語られた (φύλαξ — хранитель; слав. «хранитель израилев»). παραβολὴν εἰπών — たとえを語って (παραβολή — притча); в csl добавлено «рех» — «я сказал» (нет в LXX), по паритету передано глаголом 言った. Ἐν ἀνθρώπῳ πῶς κραταιώσητε φόβον θεοῦ; — 人のうちで、どうして神への恐れを強く保つのか (κραταιόω — укреплять). Место тёмное; в Синодальном иначе («владычествующий над людьми будет праведен»)."
  4: "καὶ ἐν θεῷ φωτὶ πρωίας — 神の光、朝の光のうちに (слав. «во свете Божии утреннем»). ἀνατείλαι ἥλιος — 太陽が昇る (инфинитив при «как»). τὸ πρωῒ οὐ παρῆλθεν ἐκ φέγγους — 朝は輝きから過ぎ去らない. ὡς ἐξ ὑετοῦ χλόης ἀπὸ γῆς — 地から雨による若草のように. Греч. текст тёмен (порча); передано по LXX и csl без сглаживания."
  5: "οὐ γὰρ οὕτως ὁ οἶκός μου μετὰ ἰσχυροῦ — わたしの家は強き方とともに、そのようではないか (ἰσχυρός — Сильный, т.е. Бог). διαθήκην αἰώνιον ἔθετό μοι — 永遠の契約を結ばれた. ἑτοίμην ἐν παντὶ καιρῷ, πεφυλαγμένην — すべての時に備えられ、守られている. πᾶσα σωτηρία μου καὶ πᾶν θέλημα — 救いのすべてと望みのすべて; в csl добавлено «во Господе» (нет в LXX) — по паритету в тексте. οὐ μὴ βλαστήσῃ ὁ παράνομος — 不法な者は芽を出すことがない."
  6: "ὥσπερ ἄκανθα ἐξωσμένη — 投げ出された茨のように (ἐξωθέω — выталкивать). πάντες αὐτοί — 彼らはみな. οὐ χειρὶ λημφθήσονται — 手で取られることはない."
  7: "ἀνὴρ οὐ κοπιάσει ἐν αὐτοῖς — だれも彼らに労しない (κοπιάω — трудиться). πλῆρες σιδήρου καὶ ξύλον δόρατος — 鉄と槍の柄でいっぱい (букв. «полно железа и древо копья»; слав. «множество железа, и древо копийное»). ἐν πυρὶ καύσει καυθήσονται — 火で焼き尽くされる. αἰσχύνῃ αὐτῶν — その恥のうちに. Место трудное, передано буквально."
  8: "τῶν δυνατῶν Δαυιδ — ダビデの勇士たち (δυνατός — сильный, храбрый). Ιεβοσθε ὁ Χαναναῖος — イシュボシェト・ハナアン人 (то же имя, что у сына Саула; здесь — один из храбрых). ἄρχων τοῦ τρίτου — 第三の長. Αδινων ὁ Ασωναῖος — アドニン・アソン人 (в LXX два имени подряд, в csl «адинон асоней»). ἐσπάσατο τὴν ῥομφαίαν — 剣を抜いた (σπάω). ἐπὶ ὀκτακοσίους τραυματίας εἰς ἅπαξ — 八百の者に向かって一度に. В csl в скобках добавлено «(и победи)» — вставка, нет в LXX, не переведена."
  9: "Ελεαζαρ υἱὸς πατραδέλφου αὐτοῦ — エレアザル、彼の叔父の子 (πατράδελφος — брат отца). υἱὸς Σουσίτου — スシ人の子 (в Синодальном «сын Додо»). ἐν τοῖς τρισὶν δυνατοῖς — 三人の勇士のうち. ἐν Σερραν — セラン (место). ἐν τῷ ὀνειδίσαι αὐτὸν ἐν τοῖς ἀλλοφύλοις — ペリシテ人をののしったとき (ὀνειδίζω — поносить). συνήχθησαν εἰς πόλεμον — 戦のために集まった. ἀνέβησαν ἀνὴρ Ισραηλ — イスラエルの人々が上った (в csl эта фраза перенесена в начало ст. 10)."
  10: "ἀνέστη καὶ ἐπάταξεν — 立ち上がって打ち殺した. ἕως οὗ ἐκοπίασεν ἡ χεὶρ αὐτοῦ — 手が疲れるまで. προσεκολλήθη πρὸς τὴν μάχαιραν — 手が剣に張り付いた (κολλάω — прилепляться). σωτηρίαν μεγάλην — 大きな救い. ὁ λαὸς ἐκάθητο ὀπίσω αὐτοῦ πλὴν ἐκδιδύσκειν — 民は彼の後ろで、ただはぎ取るためにとどまった (ἐκδιδύσκω — обирать убитых; слав. «токмо совлачати»)."
  11: "Σαμαια υἱὸς Ασα ὁ Αρουχαῖος — サマイア、アサの子、アルフ人. συνήχθησαν εἰς Θηρία — テリアに集まった. μερὶς τοῦ ἀγροῦ πλήρης φακοῦ — レンズ豆の満ちた畑の一区画 (φακός — чечевица). ὁ λαὸς ἔφυγεν ἐκ προσώπου — 顔を避けて逃げた."
  12: "ἐστηλώθη ἐν μέσῳ τῆς μερίδος — その区画の真ん中に立ちはだかった (στηλόω — ставить столп; слав. «ста аки столп»). ἐξείλατο αὐτὴν — それを奪い返した. ἐπάταξεν — 打ち殺した."
  13: "τρεῖς ἀπὸ τῶν τριάκοντα — 三十人のうちの三人. Κασων — カソン (место; в Синодальном «во время жатвы»). σπήλαιον Οδολλαμ — オドラムの洞窟. τάγμα τῶν ἀλλοφύλων — ペリシテ人の部隊 (τάγμα — отряд). ἐν τῇ κοιλάδι Ραφαιμ — ラファイムの谷."
  14: "ἐν τῇ περιοχῇ — 要害で (περιοχή — укрепление; слав. «во обдержании»). τὸ ὑπόστημα — 陣営 (слав. «стан»). ἐν Βαιθλεεμ — ベツレヘム."
  15: "ἐπεθύμησεν — 望んだ (ἐπιθυμέω). Τίς ποτιεῖ με ὕδωρ — だれが水を飲ませてくれるのか (ποτίζω — поить). λάκκος — 水溜め (яма-цистерна, не колодец). ἐν τῇ πύλῃ — 門のそばの."
  16: "διέρρηξαν — 切り抜けた (διαρρήγνυμι — разорвать). ὑδρεύσαντο — 水を汲んだ. ἔσπεισεν αὐτὸ τῷ κυρίῳ — 主に注ぎ出した (σπένδω — возливать)."
  17: "Ἵλεώς μοι, κύριε, τοῦ ποιῆσαι τοῦτο — 主よ、そんなことをするなど、決してありえない (ἵλεως — «милостив», формула отказа; слав. «милостив мне, Господи, еже сотворити сие»). εἰ αἷμα τῶν ἀνδρῶν πίομαι — 血を飲むのか. πορευθέντων ἐν ταῖς ψυχαῖς αὐτῶν — 自分の命をかけて行った者たちの (букв. «ходивших в душах своих»)."
  18: "Αβεσσα ἀδελφὸς Ιωαβ υἱὸς Σαρουιας — ヨアブの兄弟、サルヤの子アベシャ. αὐτὸς ἄρχων ἐν τοῖς τρισίν — 三人のうちの長. ἐξήγειρεν τὸ δόρυ — 槍を振るい上げた (ἐξεγείρω). ἐπὶ τριακοσίους τραυματίας — 三百の者に向かって. ὄνομα ἐν τοῖς τρισίν — 三人のうちで名を得た."
  19: "ἐκ τῶν τριῶν ἐκείνων ἔνδοξος — あの三人のうちで最も輝いていた (ἔνδοξος — славный). ἐγένετο αὐτοῖς εἰς ἄρχοντα — 彼らの長となった. ἕως τῶν τριῶν οὐκ ἦλθεν — あの三人には及ばなかった (букв. «до трёх не дошёл»)."
  20: "Βαναιας υἱὸς Ιωδαε — ベナヤ、ヨダエの子. ἀνὴρ πολλοστὸς ἔργοις — 業の多い人 (πολλοστός — «многий»; слав. «премног в делех»). ἀπὸ Καβεσεηλ — カブツェエルから. τοὺς δύο υἱοὺς αριηλ τοῦ Μωαβ — モアブ人アリエルの二人の子. τὸν λέοντα ἐν μέσῳ τοῦ λάκκου — 水溜めの中の獅子. ἐν τῇ ἡμέρᾳ τῆς χιόνος — 雪の日に."
  21: "ἄνδρα ὁρατόν — 見栄えのする人 (ὁρατός — видный). δόρυ ὡς ξύλον διαβάθρας — 槍、梯子の木のように (διαβάθρα — лестница; слав. добавляет «корабленыя»). ἐν ῥάβδῳ — 杖を持って. ἥρπασεν — 奪い取った (ἁρπάζω)."
  22: "ταῦτα ἐποίησεν Βαναιας — これがベナヤのしたこと. ὄνομα ἐν τοῖς τρισὶν τοῖς δυνατοῖς — 三人の勇士のうちで名を得た."
  23: "ἐκ τῶν τριῶν ἔνδοξος — 三人のうちで最も輝いていた (в LXX «трёх»; в Синодальном «тридцати» — иное чтение, не вносим). πρὸς τοὺς τρεῖς οὐκ ἦλθεν — あの三人には及ばなかった. ἔταξεν αὐτὸν εἰς τὰς ἀκοὰς αὐτοῦ — 自分の側近に置いた (букв. «в слухи свои»; слав. «над таинники своими»)."
  24: "τῶν δυνατῶν Δαυιδ βασιλέως — ダビデ王の勇士たち. Ασαηλ ἀδελφὸς Ιωαβ — ヨアブの兄弟アサエル. [οὗτος ἐν τοῖς τριάκοντα] — в LXX в квадратных скобках, в базе сайта есть, поэтому без 〔…〕. Ελεαναν υἱὸς Δουδι πατραδέλφου αὐτοῦ — エルハナン、彼の叔父ドダイの子 (в csl «сын отца брата его», без имени Додо). ἐν Βαιθλεεμ — ベツレヘムの."
  25: "Σαμαι ὁ Αρουδαῖος, Ελικα ὁ Αρωδαῖος — アルダイ人シャマイ、アロダイ人エリカ; в csl одно имя: «семоф ародиин» (Семоф Ародитянин), поэтому оба имени LXX оставлены (см. шапку)."
  26: "Ελλης ὁ Φελωθι — ペロティ人エレス (в csl «хеллис келофийский»). Ιρας υἱὸς Εκκας ὁ Θεκωίτης — テコア人イラ、エッカの子."
  27: "Αβιεζερ ὁ Αναθωθίτης — アナトト人アビエゼル. ἐκ τῶν υἱῶν τοῦ Ασωθίτου — アソフィトの子らから出た; в csl добавлено имя «савухей» (Савухай), которого нет в LXX, — по паритету внесено в текст."
  28: "Σελμων ὁ Αωίτης — アオ人セルモン. Μοορε ὁ Νετωφαθίτης — ネトファ人モオレ (в csl «моей нетофафитянин»)."
  29: "Ελα υἱὸς Βαανα ὁ Νετωφαθίτης — ネトファ人エラ、バアナの子. Εθθι υἱὸς Ριβα ἐκ Γαβαεθ — ギブオンから来たエタイ、リバの子; LXX ἐκ Γαβαεθ (Гива), в csl «от гаваона» — по паритету взято csl. υἱὸς Βενιαμιν — ベニヤミンの子ら."
  30: "Βαναιας ὁ Φαραθωνίτης — ピラトン人ベナヤ. Ουρι ἐκ Ναχαλιγαιας — ナハリ・ガアシュから来たウリ (в csl «урий от наалгеа»)."
  31: "Αβιηλ υἱὸς τοῦ Αραβωθίτου — アラボト人の子アビエル. Αζμωθ ὁ Βαρσαμίτης — LXX «Азмоф Барсамитянин»; в csl «заор варсамитский» (иное имя) — по паритету взято csl: ザオル."
  32: "Ελιασου ὁ Σαλαβωνίτης — シャアルボン人エリアス. υἱοὶ Ιασαν, Ιωναθαν — ヤシャンの子ら、ヨナタン; в csl на этом месте «васей гонитский» (Васий Гонитский) — расхождение отмечено, список дан по LXX (см. шапку)."
  33: "Σαμμα ὁ Αρωδίτης — アロド人シャンマ. Αχιαν υἱὸς Σαραδ ὁ Αραουρίτης — サラルの子アヒアン、アラル人; в csl «ионафан сын самана ароритскаго» — сдвиг имён, список по LXX."
  34: "Αλιφαλεθ υἱὸς τοῦ Ασβίτου υἱὸς τοῦ Μααχατι — アハスバイの子、マアハ人の子エリフェレト. Ελιαβ υἱὸς Αχιτοφελ τοῦ Γελωνίτου — ギロ人アヒトフェルの子エリアブ."
  35: "Ασαραι ὁ Καρμήλιος — カルメル人アサライ. Φαραι ὁ Ερχι — エルヒ人ファライ; в csl «урем сын асви» — иное имя, список по LXX."
  36: "Ιγααλ υἱὸς Ναθαν ἀπὸ δυνάμεως — ナタンの子イガル、「力から» (ἀπὸ δυνάμεως — тёмное место; в Синодальном «из Цобы»). υἱὸς Γαδδι — ガディの子バアン (в csl «ваан сын агарин»)."
  37: "Ελιε ὁ Αμμανίτης — アンモン人エリエ. Γελωραι ὁ Βηρωθαῖος — ベロト人ゲロライ. αἴρων τὰ σκεύη Ιωαβ — ヨアブの武器を持つ者 (σκεῦος — оружие, доспех; слав. «носяй оружие»)."
  38: "Ιρας ὁ Ιεθιραῖος, Γαρηβ ὁ Ιεθιραῖος — イテル人イラ、イテル人ガレブ; в csl в конце ст. 38 стоит «и уриа гефейский» (Урия), а в ст. 39 — только итог."
  39: "Ουριας ὁ Χετταῖος — ヘト人ウリヤ. πάντες τριάκοντα καὶ ἑπτά — すべて三十七人; в csl ст. 39 — только «Всех тридесять и седмь», имя Урии перенесено в конец ст. 38."
