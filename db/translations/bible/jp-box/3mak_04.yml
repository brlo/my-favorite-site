verses:
  1: "この命令[めいれい]が届[とど]く所[ところ]どこでも、異邦人[いほうじん]たちの間[あいだ]に、叫[さけ]びと喜[よろこ]びの声[こえ]とともに、公[おおやけ]の宴[うたげ]が催[もよお]された。昔[むかし]から心[こころ]の底[そこ]に根[ね]づいていた憎[にく]しみが、今[いま]、公然[こうぜん]と現[あらわ]れたかのようであった。"
  2: "ユダヤ人[じん]たちには、終[お]わりのない悲[かな]しみと、涙[なみだ]を伴[ともな]う嘆[なげ]きの声[こえ]があった。彼[かれ]らの心[こころ]は四方[しほう]から嘆[なげ]きによって焼[や]かれ、思[おも]いがけず突然[とつぜん]下[くだ]された滅[ほろ]びを嘆[なげ]き悲[かな]しんだ。"
  3: "どの地方[ちほう]、どの都[みやこ]、どの住[す]める場所[ばしょ]、どの街路[がいろ]が、彼[かれ]らのための嘆[なげ]きと泣[な]き声[ごえ]で満[み]たされなかっただろうか。"
  4: "彼[かれ]らは、癒[いや]し難[がた]い苦[にが]さを抱[いだ]いた魂[たましい]で、町[まち]々[まち]の将軍[しょうぐん]たちによって一斉[いっせい]に追[お]い出[だ]された。その異常[いじょう]な処罰[しょばつ]を見[み]て、敵[てき]のうちのある者[もの]たちさえ、人[ひと]としての共通[きょうつう]の憐[あわ]れみを思[おも]い、命[いのち]の終[お]わりが分[わ]からないことを考[かんが]え、彼[かれ]らの惨[みじ]めな追放[ついほう]を涙[なみだ]しながら見送[みおく]った。"
  5: "白髪[しらが]をいただいた多[おお]くの老人[ろうじん]たちが引[ひ]き立[た]てられた。彼[かれ]らは老[おい]いによる足[あし]の鈍[にぶ]さに身[み]をかがめながら、乱暴[らんぼう]な追[お]い立[た]ての勢[いきお]いに、恥[はじ]も顧[かえり]みず速[はや]い歩[あゆ]みを強[し]いられた。"
  6: "まだ新[あたら]しい生活[せいかつ]をともにするため婚礼[こんれい]の部屋[へや]に入[はい]ったばかりの若[わか]い女[おんな]たちは、喜[よろこ]びの代[か]わりに泣[な]き声[ごえ]を上[あ]げ、香油[こうゆ]に濡[ぬ]れた髪[かみ]に塵[ちり]をまぶし、頭[あたま]も覆[おお]わずに引[ひ]き立[た]てられ、婚礼[こんれい]の歌[うた]の代[か]わりに一斉[いっせい]に嘆[なげ]きの歌[うた]を歌[うた]い始[はじ]めた。異[い]なる民[たみ]の乱暴[らんぼう]によって引[ひ]き裂[さ]かれたかのようであった。彼[かれ]らは公[おおやけ]に鎖[くさり]につながれ、船[ふね]に乗[の]せられるまで力[ちから]ずくで引[ひ]きずられた。"
  7: "また、彼女[かのじょ]たちの夫[おっと]たちは、花冠[はなかんむり]の代[か]わりに縄[なわ]を首[くび]に巻[ま]かれ、若[わか]さの盛[さか]りにもかかわらず、宴[うたげ]と若[わか]さの気楽[きらく]さの代[か]わりに、婚礼[こんれい]の残[のこ]りの日[ひ]々[び]を嘆[なげ]きの中で過[す]ごした。すでに足[あし]もとには、黄泉[よみ]が口[くち]を開[あ]けて横[よこ]たわっているのを見[み]ていたからである。"
  8: "彼[かれ]らは獣[けもの]のように引[ひ]き立[た]てられ、鉄[てつ]の枷[かせ]で縛[しば]られた。ある者[もの]は船[ふね]の櫂[かい]の台[だい]に首[くび]を釘[くぎ]付[づ]けにされ、ある者[もの]は切[き]れない足枷[あしかせ]で両足[りょうあし]を固[かた]く縛[しば]られた。さらに上[うえ]には厚[あつ]い板[いた]が張[は]られ、彼[かれ]らは四方[しほう]から目[め]を閉[と]ざされて、航海[こうかい]の間中[あいだじゅう]、陰謀[いんぼう]を企[くわだ]てる者[もの]たちの扱[あつか]いを受[う]けた。"
  9: "彼[かれ]らがスケディアと呼[よ]ばれる場所[ばしょ]へ連[つ]れて行[い]かれ、王[おう]の定[さだ]めたとおりに航海[こうかい]が終[お]わると、王[おう]は彼[かれ]らを都[みやこ]の前[まえ]にある競馬場[けいばじょう]に陣[じん]を張[は]らせた。そこは広[ひろ]い周囲[しゅうい]を持[も]ち、都[みやこ]へ下[くだ]る者[もの]にも、都[みやこ]から国[くに]へ向[む]かう者[もの]にも、見[み]せしめとして格好[かっこう]の場所[ばしょ]であった。彼[かれ]らは王[おう]の軍[ぐん]と交[まじ]わることも、家[いえ]の囲[かこ]いに入[はい]ることも許[ゆる]されなかった。"
  10: "そうしたことが行[おこな]われると、都[みやこ]の同族[どうぞく]たちがひそかにより頻繁[ひんぱん]に外出[がいしゅつ]し、兄弟[きょうだい]たちの不名誉[ふめいよ]な惨状[さんじょう]を嘆[なげ]いていると聞[き]いて、王[おう]は激[はげ]しく怒[いか]り、彼[かれ]らにも同[おな]じように、いや彼[かれ]らに劣[おと]らぬよう、細心[さいしん]の注意[ちゅうい]を払[はら]って同[おな]じ罰[ばつ]を加[くわ]えるよう命[めい]じた。"
  11: "そして、この民[たみ]の全[すべ]てを名[な]によって登録[とうろく]させた。以前[いぜん]に少[すこ]し示[しめ]された労苦[ろうく]の多い奴隷[どれい]の務[つと]めのためではなく、命[めい]じられた拷問[ごうもん]で彼[かれ]らを苦[くる]しめ、同[おな]じ日[ひ]のうちに一度[いちど]に滅[ほろ]ぼし尽[つ]くすためであった。"
  12: "こうして彼[かれ]らの登録[とうろく]は、激[はげ]しい熱意[ねつい]と競[きそ]い合[あ]うような勤[つと]めによって、日[ひ]の出[で]から日[ひ]の入[い]りまで行[おこな]われたが、四十日[よそか]の間[あいだ]に終[お]わらせることはできなかった。"
  13: "王[おう]は大[おお]いに、そして絶[た]えず喜[よろこ]びに満[み]ち、すべての偶像[ぐうぞう]の前[まえ]で酒宴[しゅえん]を催[もよお]した。真理[しんり]から遠[とお]く迷[まよ]った心[こころ]と汚[けが]れた口[くち]で、彼[かれ]は口[くち]が利[き]けず、彼[かれ]らに語[かた]ることも助[たす]けることもできない者[もの]たちを賛美[さんび]し、大[おお]いなる神[かみ]にはふさわしくないことを語[かた]った。"
  14: "先[さき]に述[の]べた期間[きかん]が過[す]ぎると、書記[しょき]たちは王[おう]に、もはやユダヤ人[じん]の登録[とうろく]を行[おこな]うことはできないと申[もう]し出[で]た。彼[かれ]らの数[かず]が測[はか]り知[し]れないほど多[おお]く、多[おお]くの者[もの]がまだ国[くに]にいて、ある者[もの]は家[いえ]に、ある者[もの]は各地[かくち]にまだとどまっていたからである。エジプトのすべての将軍[しょうぐん]たちにも、それは不可能[ふかのう]であった。"
  15: "王[おう]が、彼[かれ]らが逃[に]げるための手段[しゅだん]として賄賂[わいろ]を受[う]け取[と]ったのだと、さらに厳[きび]しく脅[おど]すと、彼[かれ]らは証拠[しょうこ]を挙[あ]げて、すでに使[つか]っていた紙[かみ]も書[か]き筆[ふで]も尽[つ]きてしまったと述[の]べ、このことについて王[おう]を確[たし]かに納得[なっとく]させた。"
  16: "これは、天[てん]からユダヤ人[じん]を助[たす]ける、打[う]ち勝[か]ち難[がた]い摂理[せつり]の働[はたら]きであった。"

notes:
  1: "δημοτελὴς εὐωχία — «всенародный пир»; ἀλαλαγμός — клик, ликование; προκατεσκιρωμένη ἀπέχθεια — «застарелая вражда»; μετὰ παρρησίας — «с дерзновением, открыто»."
  2: "ἄληκτον πένθος — «неутишная скорбь»; πανόδυρτος βοή — «всеплачевный вопль»; στεναγμοῖς πεπυρωμένης τῆς καρδίας — «сердце, раскалённое стонами»; ὀλεθρία — погибель."
  3: "νομός — область; οἰκητὸς τόπος — обитаемое место; ἀγυιαί — улицы; κοπετός — плач."
  4: "μετὰ πικρίας ἀνοίκτου ψυχῆς — «с горечью неисцельной души»; ἐξάλλοις τιμωρίαις — «необычайными карами»; κοινὸς ἔλεος — «общее (человеческое) сострадание»; ἄδηλος τοῦ βίου καταστροφή — «неведомый конец жизни»."
  5: "πολιᾷ πεπυκασμένοι — «увенчанные сединой»; νωθρότης ποδῶν — «медлительность ног»; ἐπίκυφος — сгорбленный; ἀνατροπή — «ниспровержение, изгнание»."
  6: "СТИХ СОЕДИНЁН: gr 4:6+7. Новобрачные (6) и их публичное влечение на корабль (7). παστός — брачный чертог; μυροβρεχής — умащённый благовониями; ὑμέναιος — свадебная песнь; σκυλμοὶ ἀλλοεθνεῖς — «истязания иноплеменников»."
  7: "gr 4:8. βρόχοι ἀντὶ στεφάνων — «петли вместо венков»; ἀκμαία νεανικὴ ἡλικία — «цветущий юный возраст»; ᾅδης παρὰ πόδας — «ад у самых ног»."
  8: "СТИХ СОЕДИНЁН: gr 4:9+10. Принуждение и приковывание (9), настил сверху и тьма (10). ζυγὰ πλοίων — «скамьи/ярма кораблей»; ἀρρήκτοις πέδαις — «неразрывными оковами»; σανίδωμα — дощатый настил; ἀγωγὴ ἐπιβούλων — «обращение как с заговорщиками»."
  9: "gr 4:11. Σχεδία — Схелия (Σχεδία); ἱππόδρομος — ипподром (競馬場); ἀπλάτος περίμετρος — «обширная окружность»; παραδειγματισμός — «выставление на позор»; περίβολοι — «ограды, жилища»."
  10: "СТИХ СОЕДИНЁН: gr 4:12+13. Родственники тайно выходят оплакивать (12), царь велит поступить с ними так же (13). ὁμοεθνεῖς — соплеменники; ἀποδύρεσθαι — оплакивать; μὴ λειπομένοις — «не уступая (им)»."
  11: "gr 4:14. ἀπογραφῆναι ἐξ ὀνόματος — «быть переписанными по имени»; κατάπονος λατρεία — «изнурительное рабство»; στρεβλωθέντας — «подвергнутых мучениям»; ἀφανίσαι — «истребить»."
  12: "gr 4:15. μετὰ πικρᾶς σπουδῆς — «с горьким усердием»; φιλότιμος προσεδρεία — «ревностное сидение (за делом)»; ἀνήνυτον τέλος — «недостигнутый конец»; τεσσαράκοντα ἡμέρας — сорок дней."
  13: "gr 4:16. ἐπὶ πάντων τῶν εἰδώλων — «перед всеми идолами»; πεπλανημένη φρήν — «заблудший ум»; βέβηλον στόμα — «нечестивые уста»; κωφά — «глухие (идолы)»."
  14: "СТИХ СОЕДИНЁН: gr 4:17+18. Писцы доносят о невозможности переписи (17) из-за множества и рассеяния народа (18). γραμματεῖς — писцы (書記); ἀμέτρητος πληθύς — «неизмеримое множество»; ἀδύνατον — невозможное."
  15: "СТИХ СОЕДИНЁН: gr 4:19+20. Царь подозревает подкуп (19), писцы доказывают, что кончилась бумага и тростниковые перья (20). δεδωροκοπημένοι — «подкупленные»; χαρτηρία — бумага (папирус); γραφικοὶ κάλαμοι — писчие трости."
  16: "gr 4:21. ἐνέργεια — действие (働き); ἀνίκητος πρόνοια — «непобедимый Промысел» (摂理); ἐξ οὐρανοῦ — «с неба»."
