# jp-box, 3-я Маккавейская, глава 4. Черновик для приёмки.
#
# Нумерация — по Синодальному (ru, 16 стихов); текст — с греческого (gr-lxx-byz,
# 21 стих); карта книги — в шапке гл. 1. В этой главе соединены:
# 4:6 (gr 6+7), 4:8 (gr 9+10), 4:10 (gr 12+13), 4:14 (gr 17+18),
# 4:15 (gr 19+20). Остальные — один к одному.
