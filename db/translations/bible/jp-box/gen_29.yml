verses:
  1: "ヤコブは足[あし]を上[あ]げて、東[ひがし]の地[ち]へ、ラバンのもとへ行[い]った。ラバンはシリア人[じん]ベトエルの子[こ]で、ヤコブとエサウの母[はは]リベカの兄[あに]である。"
  2: "彼[かれ]が見[み]ると、野[の]に井戸[いど]があり、そこに三[みっ]つの羊[ひつじ]の群[む]れが、そのそばで休[やす]んでいた。人々[ひとびと]はその井戸[いど]から群[む]れに水[みず]を飲[の]ませていた。井戸[いど]の口[くち]には大[おお]きな石[いし]があった。"
  3: "そこへすべての群[む]れが集[あつ]まると、井戸[いど]の口[くち]から石[いし]を転[ころ]がし、羊[ひつじ]に水[みず]を飲[の]ませ、また石[いし]を井戸[いど]の口[くち]の元[もと]の所[ところ]へ戻[もど]した。"
  4: "ヤコブは彼[かれ]らに言[い]った。「兄弟[きょうだい]たちよ、どこから来[き]たのか。」彼[かれ]らは言[い]った。「ハランからだ。」"
  5: "彼[かれ]は言[い]った。「ナホルの子[こ]ラバンを知[し]っているか。」彼[かれ]らは言[い]った。「知[し]っている。」"
  6: "彼[かれ]は言[い]った。「元気[げんき]か。」彼[かれ]らは言[い]った。「元気[げんき]だ。」見[み]よ、彼[かれ]の娘[むすめ]ラケルが、羊[ひつじ]の群[む]れとともに来[き]ていた。"
  7: "ヤコブは言[い]った。「まだ日[ひ]は多[おお]く残[のこ]っている。家畜[かちく]を集[あつ]める時[とき]はまだ来[き]ていない。羊[ひつじ]に水[みず]を飲[の]ませて、行[い]って牧[まき]をさせなさい。」"
  8: "彼[かれ]らは言[い]った。「羊飼[ひつじかい]たちが皆[みな]集[あつ]まり、井戸[いど]の口[くち]から石[いし]を転[ころ]がすまでは、できません。そうしてから羊[ひつじ]に水[みず]を飲[の]ませるのです。」"
  9: "彼[かれ]がまだ彼[かれ]らと話[はな]しているうちに、ラバンの娘[むすめ]ラケルが、父[ちち]の羊[ひつじ]の群[む]れとともに来[き]た。彼女[かのじょ]が父[ちち]の羊[ひつじ]を牧[まき]していたからである。"
  10: "ヤコブは、母[はは]の兄[あに]ラバンの娘[むすめ]ラケルと、母[はは]の兄[あに]ラバンの羊[ひつじ]の群[む]れを見[み]ると、近[ちか]づいて井戸[いど]の口[くち]から石[いし]を転[ころ]がし、母[はは]の兄[あに]ラバンの羊[ひつじ]に水[みず]を飲[の]ませた。"
  11: "ヤコブはラケルに口[くち]づけした。そして、声[こえ]を張[は]り上[あ]げて泣[な]いた。"
  12: "ヤコブは、自分[じぶん]が彼女[かのじょ]の父[ちち]の兄[あに]であり、リベカの子[こ]であることをラケルに告[つ]げた。ラケルは走[はし]って行[い]き、このとおりのことを父[ちち]に告[つ]げた。"
  13: "ラバンは、妹[いもうと]の子[こ]ヤコブの名[な]を聞[き]くと、迎[むか]えに走[はし]って行[い]き、彼[かれ]を抱[だ]き寄[よ]せて口[くち]づけし、自分の家[いえ]へ連[つ]れて入[はい]った。ヤコブはこれらのことをすべてラバンに語[かた]った。"
  14: "ラバンは彼[かれ]に言[い]った。「あなたはわたしの骨[ほね]であり、わたしの肉[にく]である。」ヤコブは彼[かれ]と一月[ひとつき]の間[あいだ]ともに過[す]ごした。"
  15: "ラバンはヤコブに言[い]った。「わたしの兄弟[きょうだい]だからといって、ただでわたしに仕[つか]えることはない。わたしに告[つ]げなさい。あなたの報酬[ほうしゅう]は何[なに]か。」"
  16: "ラバンには二[ふた]人[り]の娘[むすめ]があった。姉[あね]の名[な]はレア、妹[いもうと]の名[な]はラケルである。"
  17: "レアの目[め]は弱[よわ]かったが、ラケルは姿[すがた]が美[うつく]しく、顔[かお]だちも美[うつく]しかった。"
  18: "ヤコブはラケルを愛[あい]し、言[い]った。「あなたの末[すえ]の娘[むすめ]ラケルのために、七年[ななねん]あなたに仕[つか]えます。」"
  19: "ラバンは言[い]った。「この娘[むすめ]をほかのだれかに与[あた]えるより、あなたに与[あた]えるほうがよい。わたしとともに住[す]みなさい。」"
  20: "ヤコブはラケルのために七年[ななねん]仕[つか]えた。彼[かれ]が彼女[かのじょ]を愛[あい]していたので、それは彼[かれ]の目[め]にはわずかな日々[ひび]のように思[おも]えた。"
  21: "ヤコブはラバンに言[い]った。「わたしの妻[つま]をわたしに与[あた]えなさい。わたしの日[ひ]は満[み]ちた。彼女[かのじょ]のところへ入[はい]るためである。」"
  22: "ラバンはその場所[ばしょ]の男[おとこ]たちをすべて集[あつ]め、婚礼[こんれい]を催[もよお]した。"
  23: "夕[ゆう]べになると、ラバンは娘[むすめ]レアを連[つ]れて来[き]てヤコブのところへ入[い]れ、ヤコブは彼女[かのじょ]のところへ入[はい]った。"
  24: "ラバンは娘[むすめ]レアに、自分[じぶん]の女奴隷[おんなどれい]ジルパを女奴隷[おんなどれい]として与[あた]えた。"
  25: "朝[あさ]になると、見[み]よ、それはレアであった。ヤコブはラバンに言[い]った。「あなたはわたしに何[なに]をしたのか。わたしはラケルのためにあなたのもとで仕[つか]えたのではないか。なぜわたしをだましたのか。」"
  26: "ラバンは言[い]った。「わたしたちの場所[ばしょ]ではそうはしない。年[とし]下[した]の娘[むすめ]を年[とし]上[うえ]の娘[むすめ]より先[さき]に嫁[とつ]がせることはしない。"
  27: "この娘[むすめ]の七日[なのか]を終[お]えなさい。そうすれば、あなたがわたしのもとでさらに七年[ななねん]働[はたら]く報酬[ほうしゅう]として、この娘[むすめ]もあなたに与[あた]えよう。」"
  28: "ヤコブはそうして、この娘[むすめ]の七日[なのか]を満[み]たした。ラバンは娘[むすめ]ラケルを彼[かれ]の妻[つま]として与[あた]えた。"
  29: "ラバンは娘[むすめ]ラケルに、自分[じぶん]の女奴隷[おんなどれい]ビルハを女奴隷[おんなどれい]として与[あた]えた。"
  30: "ヤコブはラケルのところへも入[はい]った。彼[かれ]はレアよりもラケルを愛[あい]した。そして彼[かれ]にさらに七年[ななねん]仕[つか]えた。"
  31: "主[しゅ]は、レアが憎[にく]まれているのを見[み]て、彼女[かのじょ]の胎[たい]を開[ひら]かれた。ラケルは不妊[ふにん]であった。"
  32: "レアは身[み]ごもってヤコブに男[おとこ]の子[こ]を産[う]み、その名[な]をルベンと名[な]づけて言[い]った。「主[しゅ]がわたしの苦[くる]しみをご覧[らん]になったからである。今[いま]こそ、わたしの夫[おっと]はわたしを愛[あい]するだろう。」"
  33: "レアはまた身[み]ごもって、ヤコブに二[ふた]人[り]目[め]の男[おとこ]の子[こ]を産[う]み、言[い]った。「主[しゅ]は、わたしが憎[にく]まれているのを聞[き]いて、この子[こ]もわたしに添[そ]えられた。」そしてその名[な]をシメオンと名[な]づけた。"
  34: "彼女[かのじょ]はさらに身[み]ごもって男[おとこ]の子[こ]を産[う]み、言[い]った。「今[いま]という時[とき]、わたしの夫[おっと]はわたしのものとなる。わたしが彼[かれ]に三人[さんにん]の男[おとこ]の子[こ]を産[う]んだからである。」それゆえ、その名[な]をレビと名[な]づけた。"
  35: "彼女[かのじょ]はまた身[み]ごもって男[おとこ]の子[こ]を産[う]み、言[い]った。「今[いま]こそ、わたしは主[しゅ]に告白[こくはく]する。」それゆえ、その名[な]をユダと名[な]づけた。そして、産[う]むことをやめた。"

notes:
  1: "ἐξάρας τοὺς πόδας — 足を上げて (букв.; идиома «поднялся и пошёл»; слав. «востав на нозе» — тоже буквально). γῆν ἀνατολῶν — 東の地 (ἀνατολή — «восток»; в Синодальном с масоретского «земля сынов востока»)."
  2: "ὁρᾷ — 見ると (praesens historicum, «видит»). τρία ποίμνια προβάτων — 三つの羊の群れ (ποίμνιον — «стадо»). ἀναπαυόμενα ἐπ᾿ αὐτῷ — そのそばで休んでいた (ἐπί с дательным — «при, у»). ἐκ…ἐπότιζον — 水を飲ませていた (несовершенный вид — обычай). λίθος μέγας ἐπὶ τῷ στόματι — 井戸の口に大きな石."
  3: "συνήγοντο… ἀπεκύλιον… ἐπότιζον… ἀπεκαθίστων — четыре несовершенных вида: так делали всегда (ἀποκυλίω — «отваливать»). εἰς τὸν τόπον αὐτοῦ — 元の所へ (на своё место)."
  4: "πόθεν ἐστὲ ὑμεῖς — どこから来たのか. Ἐκ Χαρραν ἐσμέν — ハランからだ (ἐσμέν — «мы есмы», сохранено как ответ)."
  5: "Ναχωρ — ナホル (здесь Лаван назван его сыном; по родословию 22:20–23 Нахор — дед Лавана, ср. 24:15; так же и в масоретском тексте 29:5). Γινώσκομεν — 知っている (без подлежащего, как в греч.)."
  6: "Ὑγιαίνει — 元気か (ὑγιαίνω — «быть здоровым»; слав. «здравствует ли»). ἤρχετο μετὰ τῶν προβάτων — 羊の群れとともに来ていた (несовершенный вид)."
  7: "ἡμέρα πολλή — 日は多く残っている (букв. «день велик»). οὔπω ὥρα συναχθῆναι τὰ κτήνη — 家畜を集める時はまだ来ていない (κτῆνος — «скот, домашний скот»). ποτίσαντες…ἀπελθόντες βόσκετε — 水を飲ませて、行って牧をさせなさい (два причастия и императив)."
  8: "Οὐ δυνησόμεθα ἕως τοῦ συναχθῆναι πάντας τοὺς ποιμένας — 羊飼いたちが皆集まるまではできない (в LXX «пастухи»; в масоретском «стада» — расхождение в notes, не в тексте). ἀποκυλίσωσιν — 転がす (аорист сослагательного)."
  9: "ἔτι αὐτοῦ λαλοῦντος αὐτοῖς — 彼がまだ話しているうちに (родительный абсолютный). αὐτὴ γὰρ ἔβοσκεν — 彼女が牧していたからである (γάρ — причина; ср. 29:6)."
  10: "ὡς εἶδεν…καὶ προσελθών — 見ると…近づいて (порядок греческий). ἀπεκύλισεν — 転がした (ἀποκυλίω). Трижды повторено «брат матери» — повтор сохранён."
  11: "ἐφίλησεν — 口づけし (φιλέω). βοήσας τῇ φωνῇ αὐτοῦ ἔκλαυσεν — 声を上げて泣いた (букв. «возопив голосом своим»; слав. «возопив гласом»)."
  12: "ἀδελφὸς τοῦ πατρὸς αὐτῆς — 彼女の父の兄 (то есть дядя; в LXX «брат отца», ср. 28:2). κατὰ τὰ ῥήματα ταῦτα — このとおりのことを (κατά — «сообразно»)."
  13: "περιλαβὼν αὐτὸν ἐφίλησεν — 抱き寄せて口づけし (περιλαμβάνω — «обнять»). διηγήσατο — 語った (διηγέομαι — «рассказывать подробно»). πάντας τοὺς λόγους τούτους — これらのことをすべて."
  14: "Ἐκ τῶν ὀστῶν μου καὶ ἐκ τῆς σαρκός μου εἶ σύ — あなたはわたしの骨であり、わたしの肉である (формула родства, ср. 2:23). μῆνα ἡμερῶν — 一か月 (букв. «месяц дней»; слав. «месяц дний»)."
  15: "Ὅτι γὰρ ἀδελφός μου εἶ — わたしの兄弟だからといって (ὅτι γάρ — «так как ведь»). οὐ δουλεύσεις μοι δωρεάν — ただで仕えることはない (δωρεάν — «даром, бесплатно»). τίς ὁ μισθός σού ἐστιν — あなたの報酬は何か."
  16: "τῷ δὲ Λαβαν δύο θυγατέρες — у Лавана две дочери (порядок греческий: сначала Лаван, потом дочери). μείζων / νεωτέρα — 姉 / 妹 (букв. «большая / младшая»)."
  17: "οἱ ὀφθαλμοὶ Λειας ἀσθενεῖς — レアの目は弱かった (ἀσθενής — «немощный, слабый»; не «больные»; в масоретском «кроткие/нежные», отсюда разница переводов). καλὴ τῷ εἴδει καὶ ὡραία τῇ ὄψει — 姿が美しく、顔だちも美しかった (εἶδος — «вид, стан»; ὄψις — «лицо»)."
  18: "ἠγάπησεν — 愛した (ἀγαπάω). ἑπτὰ ἔτη — 七年 (в LXX без «неделя»; ср. 29:27). τῆς θυγατρός σου τῆς νεωτέρας — あなたの末の娘 (двойной артикль — «младшая дочь твоя»)."
  19: "Βέλτιον δοῦναί με αὐτὴν σοὶ ἢ…ἀνδρὶ ἑτέρῳ — ほかのだれかに与えるより、あなたに与えるほうがよい. οἴκησον μετ᾿ ἐμοῦ — わたしとともに住みなさい (οἰκέω — «жить, обитать»)."
  20: "ἦσαν ἐναντίον αὐτοῦ ὡς ἡμέραι ὀλίγαι παρὰ τὸ ἀγαπᾶν αὐτὸν αὐτήν — 彼の目にはわずかな日々のように思えた (παρά + acc. — «по причине»; букв. «при любви его к ней»)."
  21: "πεπλήρωνται γὰρ αἱ ἡμέραι μου — わたしの日は満ちた (perfect). ὅπως εἰσέλθω πρὸς αὐτήν — 彼女のところへ入るため (эвфемизм брака, как в 29:23,30)."
  22: "γάμον — 婚礼 (γάμος — «брачный пир»; слав. «брак»). πάντας τοὺς ἄνδρας τοῦ τόπου — その場所の男たちをすべて."
  23: "ἐγένετο ἑσπέρα — 夕べになると (букв. «стал вечер»). εἰσήγαγεν αὐτὴν πρὸς Ιακωβ — ヤコブのところへ入れた (εἰσάγω)."
  24: "Ζελφαν τὴν παιδίσκην — 女奴隷ジルパ (παιδίσκη — «служанка, рабыня»). αὐτῇ παιδίσκην — 女奴隷として (повтор слова в греч. сохранён: «в рабыню ей рабыню»)."
  25: "ἰδοὺ ἦν Λεια — 見よ、それはレアであった (неожиданность, как в 29:25 у LXX). ἵνα τί παρελογίσω με — なぜわたしをだましたのか (παραλογίζομαι — «обсчитать, обмануть»). οὐ περὶ Ραχηλ ἐδούλευσα παρὰ σοί — ラケルのためにあなたのもとで仕えたのではないか."
  26: "Οὐκ ἔστιν οὕτως ἐν τῷ τόπῳ ἡμῶν — わたしたちの場所ではそうはしない. δοῦναι τὴν νεωτέραν πρὶν ἢ τὴν πρεσβυτέραν — 年下の娘を年上の娘より先に嫁がせること (πρίν ἤ — «прежде нежели»)."
  27: "συντέλεσον τὰ ἕβδομα ταύτης — この娘の七日を終えなさい (ἕβδομα — «седмица», свадебная неделя; не «семь лет», ср. ст. 20). ἀντὶ τῆς ἐργασίας ἧς ἐργᾷ παρ᾿ ἐμοὶ ἔτι ἑπτὰ ἔτη ἕτερα — さらに七年働く報酬として (ἐργασία — «работа»)."
  28: "ἀνεπλήρωσεν τὰ ἕβδομα — 七日を満たした (ἀναπληρόω). ἔδωκεν αὐτῷ…Ραχηλ…γυναῖκα — ラケルを妻として与えた."
  29: "Βαλλαν — ビルハ (в LXX Βαλλα; слав. «Валла»). Та же формула, что в ст. 24."
  30: "ἠγάπησεν δὲ Ραχηλ μᾶλλον ἢ Λειαν — レアよりもラケルを愛した. ἑπτὰ ἔτη ἕτερα — さらに七年 (второй срок, ср. ст. 27)."
  31: "μισεῖται — 憎まれている (μισέω; в значении «нелюбима», ср. ст. 33 и Втор 21:15). ἤνοιξεν τὴν μήτραν αὐτῆς — 彼女の胎を開かれた (μήτρα — «утроба, матка»). στεῖρα — 不妊 (στείρα — «бесплодная»)."
  32: "συνέλαβεν — 身ごもった (συλλαμβάνω). Διότι εἶδέν μου κύριος τὴν ταπείνωσιν — 主がわたしの苦しみをご覧になったからである (ταπείνωσις — «унижение, бедствие»; слав. «смирение»). νῦν με ἀγαπήσει ὁ ἀνήρ μου — 今こそ夫はわたしを愛するだろう. Ρουβην — ルベン (евр. «вот сын», игра слов с «увидел»)."
  33: "Ὅτι ἤκουσεν κύριος ὅτι μισοῦμαι — 主はわたしが憎まれているのを聞いて (ἀκούω + ὅτι). προσέδωκέν μοι καὶ τοῦτον — この子も添えられた (προστίθημι — «прибавить»). Συμεων — シメオン."
  34: "Ἐν τῷ νῦν καιρῷ πρὸς ἐμοῦ ἔσται ὁ ἀνήρ μου — 今という時、夫はわたしのものとなる (πρὸς ἐμοῦ — «ко мне, при мне»; евр. игра слов с לֵוִי — «прилепится»). ἔτεκον γὰρ αὐτῷ τρεῖς υἱούς — 三人の男の子を産んだからである. Λευι — レビ."
  35: "Νῦν ἔτι τοῦτο ἐξομολογήσομαι κυρίῳ — 今こそ主に告白する (ἐξομολογέομαι — «исповедовать, прославлять»; слав. «исповем»; Синодальный «восхвалю»). Ιουδα — ユダ. ἔστη τοῦ τίκτειν — 産むことをやめた (ἵστημι — «остановиться»; ср. 30:9)."
