# jp-box, Бытие, глава 29. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 29: Иаков у колодца в Харране (1–8), встреча с Рахилью (9–12), Лаван принимает
# его в дом (13–14), договор о семи годах (15–20), обман с Лией (21–27), свадьба с Рахилью
# и вторые семь лет (28–30), рождение сыновей Лии (31–35).
# Красного и синего нет: речи людей — в 「…」, без красного.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе); повторы и тавтологии LXX
# сохранены (29:2-3 четыре несовершенных вида, 29:10 трижды «брат матери», 29:24 удвоение
# παιδίσκη, 29:34 πρὸς ἐμοῦ).
# Имена: ハラン, ナホル, ラバン, ラケル, レア, リベカ, ヤコブ, エサウ, ビルハ, ジルパ,
# ルベン, シメオン, レビ, ユダ; термин 女奴隷 (παιδίσκη).
# Сносок ⟨…⟩ нет: 井戸, 羊飼い, 女奴隷, 婚礼 — понятные слова. jp-ni не использовался.

