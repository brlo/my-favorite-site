# jp-box, Даниил, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 1; стихов 21,
# наш 1:1–21 = gr 1:1–21, стих в стих («точек» в главе нет).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Повествование — だ・である; речь к царю и начальнику — です・ます (как в Быт 41).
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX), формы — по корпусу.
#
# Содержание: 1 осада Иерусалима в третий год Иоакима; 2 сосуды храма в Вавилоне;
# 3–4 отбор юношей; 5 царский стол и три года; 6–7 четыре пленника и новые имена;
# 8 «не оскверняться царской пищей»; 9 милость начальника; 10 его страх;
# 11–14 «дай нам овощи», десять дней; 15 лица и тело лучше; 16 вместо царской
# пищи — овощи; 17 дар разумения, сны и видения; 18–19 пред царем, «не нашлось
# подобных»; 20 «в десять раз выше»; 21 «до первого года Кира».
# Голоса: 1–9 повествование; 10 речь начальника евнухов в 「…」 (закрывается в стихе);
# 11 повествование; 12–13 речь Даниила в 「…」 (закрывается в 13); 14–21 повествование.
# Термины: 宦官[かんがん]の長[ちょう] — ἀρχιεύνουχος; 王[おう]の食卓[しょくたく] —
# τράπεζα; 食[しょく]事[じ] — δεῖπνον; 野[や]菜[さい] — ὄσπρια (слав. «семена земные»);
# 呪術師[じゅじゅつし] — ἐπαοιδοί/обаятели, 魔術師[まじゅつし] — μάγοι/волхвы
# (в 2:2 список разведён третьим словом: 呪詛師[じゅそし] — φάρμακοι).
# Имена: ダニエル, ハナニヤ, ミシャエル, アザルヤ, バルタザル, シャデラク, メシャク,
# アベド・ネゴ, ヨアキム, ネブカドネツァル, クロス, ペルシア人[じん], カルデア人[じん];
# новые — アビエスドリ (Αβιεσδρι; слав. в 3 ст. «асфанез», в 11 и 16 «амелсар» — по МТ)
# и シナル (по слав. «земля Сеннаар»).
# jp-ni не использовался.
#
tr_code: jp-box
book: dan
chapter: 1
draft: true

verses:
  1: "ユダの王[おう]ヨアキムの治世[ちせい]の第三年[だいさんねん]、バビロンの王[おう]ネブカドネツァルが来[き]て、エルサレムを包囲[ほうい]した。"
  2: "主[しゅ]はこの都[みやこ]を彼[かれ]の手[て]に渡[わた]された。すなわち、ユダの王[おう]ヨアキムと、主[しゅ]の聖[せい]なる器[うつわ]の一部[いちぶ]とを。彼[かれ]はそれらをシナルの地[ち]へ運[はこ]び、自分[じぶん]の神[かみ]の家[いえ]に持[も]って行[い]って、その器[うつわ]を自分[じぶん]の神[かみ]の宝庫[ほうこ]に納[おさ]めた。"
  3: "王[おう]は自分の宦官[かんがん]の長[ちょう]のアビエスドリに、イスラエルの子[こ]らの中[なか]から、また王[おう]の血筋[ちすじ]と貴族[きぞく]の中[なか]から、ある者[もの]たちを連[つ]れて来[く]るよう命[めい]じた。"
  4: "それは、からだに傷[きず]のない、姿[すがた]の美[うつく]しい少年[しょうねん]たちであった。彼[かれ]らはあらゆる知恵[ちえ]に通[つう]じ、学問[がくもん]に秀[すぐ]れ、思慮[しりょ]深[ぶか]く、賢[かしこ]く、力[ちから]があって、王[おう]の家[いえ]に仕[つか]えることのできる者[もの]たちである。王[おう]は彼[かれ]らにカルデア人[じん]の文字[もじ]と言葉[ことば]を教[おし]えるようにした。"
  5: "王[おう]は彼[かれ]らに、日[ひ]ごとに王[おう]の家[いえ]から、また王[おう]の食卓[しょくたく]から、そして王[おう]が飲[の]むぶどう酒[しゅ]から、定[さだ]められた分[ぶん]を与[あた]え、三年[さんねん]の間[あいだ]養[やしな]って、その後[のち]、王[おう]の前[まえ]に立[た]たせることにした。"
  6: "彼[かれ]らの中[なか]には、ユダの子[こ]ら、すなわちユダ族[ぞく]の者[もの]たちがいた。ダニエル、ハナニヤ、ミシャエル、アザルヤである。"
  7: "宦官[かんがん]の長[ちょう]は彼[かれ]らに名[な]をつけた。ダニエルにはバルタザル、ハナニヤにはシャデラク、ミシャエルにはメシャク、アザルヤにはアベド・ネゴという名[な]である。"
  8: "ダニエルは、王[おう]の食[しょく]事[じ]と王[おう]が飲[の]むぶどう酒[しゅ]によって自分[じぶん]が汚[けが]れることのないようにと心[こころ]に決[き]め、宦官[かんがん]の長[ちょう]に、汚[けが]れないようにしてほしいと願[ねが]った。"
  9: "神[かみ]はダニエルを、宦官[かんがん]の長[ちょう]の前[まえ]で、憐[あわ]れみと慈[いつく]しみを受[う]ける者[もの]とされた。"
  10: "宦官[かんがん]の長[ちょう]はダニエルに言[い]った。「わたしはわが主[しゅ]である王[おう]を恐[おそ]れています。王[おう]はあなたがたの食[た]べ物[もの]と飲[の]み物[もの]を定[さだ]めた方[かた]です。もし王[おう]が、あなたがたの顔[かお]が、あなたがたと同[おな]じように育[そだ]てられた他国[たこく]の少年[しょうねん]たちよりもやつれて弱[よわ]々[よわ]しいのをごらんになったら、あなたがたのせいで、わたしは王[おう]の前[まえ]で頭[あたま]に罪[つみ]を負[お]うことになります。」"
  11: "ダニエルは、宦官[かんがん]の長[ちょう]が自分[じぶん]とハナニヤ、ミシャエル、アザルヤの上[うえ]に置[お]いたアビエスドリに言[い]った。"
  12: "「どうか、しもべたちを十日[とおか]の間[あいだ]お試[ため]しください。わたしたちには地[ち]の野[や]菜[さい]を食[た]べさせ、水[みず]を飲[の]ませてください。"
  13: "そして、わたしたちの顔[かお]と、王[おう]の食[しょく]事[じ]を食[た]べているほかの少年[しょうねん]たちの顔[かお]をごらんください。ごらんになったとおりに、しもべたちをお扱[あつか]いください。」"
  14: "彼[かれ]は彼[かれ]らの言[い]うことを聞[き]き入[い]れ、このように彼[かれ]らを扱[あつか]って、十日[とおか]の間[あいだ]試[ため]した。"
  15: "十日[とおか]が過[す]ぎると、彼[かれ]らの顔[かお]は良[よ]く、からだつきも、王[おう]の食[しょく]事[じ]を食[た]べているほかの少年[しょうねん]たちよりも丈夫[じょうぶ]であることが分[わ]かった。"
  16: "そこでアビエスドリは、彼[かれ]らの食[しょく]事[じ]とぶどう酒[しゅ]を取[と]り上[あ]げ、代[か]わりに野[や]菜[さい]を彼[かれ]らに与[あた]えた。"
  17: "神[かみ]はこの四人[よにん]の少年[しょうねん]たちに、あらゆる書[しょ]物[もつ]の知恵[ちえ]と、知識[ちしき]と、悟[さと]りをお与[あた]えになった。ダニエルには、あらゆる言葉[ことば]と幻[まぼろし]と夢[ゆめ]を悟[さと]る力[ちから]をもお与[あた]えになった。"
  18: "これらの日[ひ]が過[す]ぎると、王[おう]は彼[かれ]らを連[つ]れて来[く]るよう命[めい]じ、宦官[かんがん]の長[ちょう]は彼[かれ]らをネブカドネツァルの前[まえ]に連[つ]れて来[き]た。"
  19: "王[おう]は彼[かれ]らと語[かた]り合[あ]った。しかし、あの賢[かしこ]い者[もの]たちの中[なか]には、ダニエル、ハナニヤ、ミシャエル、アザルヤに並[なら]ぶ者[もの]は見[み]つからなかった。彼[かれ]らは王[おう]のそばに立[た]つことになった。"
  20: "王[おう]が彼[かれ]らに問[と]うたすべての言葉[ことば]、分別[ふんべつ]、学問[がくもん]において、王[おう]は彼[かれ]らが、自分の国[くに]のすべての呪術師[じゅじゅつし]や魔術師[まじゅつし]たちよりも十[じゅう]倍[ばい]すぐれているのを見出[みいだ]した。また王[おう]は彼[かれ]らを重[おも]んじ、彼[かれ]らを長[おさ]とした。そして、自分の地[ち]と王国[おうこく]のすべての事[こと]がらにおいて、彼[かれ]らが自分のすべての者[もの]よりも賢[かしこ]いことを示[しめ]された。"
  21: "ダニエルは、ペルシア人[じん]の王[おう]クロスの治世[ちせい]の第一年[だいいちねん]まで、そこにいた。"

notes:
  1: "Ἐπὶ βασιλέως Ιωακίμ ... ἔτους τρίτου — «при царе Иоакиме, в третий год»; LXX не говорит «царства», слав. «в лето третие царства иоакима царя иудина» — передано по слав. (治世の第三年); παραγενόμενος ... ἐπολιόρκει αὐτήν — «придя, осаждал его» (πολιορκέω — осаждать)."
  2: "παρέδωκεν αὐτὴν κύριος εἰς χεῖρας αὐτοῦ — «предал его Господь в руки его»; καὶ μέρος τι τῶν ἱερῶν σκευῶν τοῦ κυρίου — «и часть некую священных сосудов Господа»; ἀπήνεγκεν αὐτὰ εἰς Βαβυλῶνα καὶ ἀπηρείσατο αὐτὰ ἐν τῷ εἰδωλίῳ αὐτοῦ — «отнёс их в Вавилон и поставил их в капище идола своего» (εἰδώλιον — идольское капище); слав. по МТ: «в землю Сеннаар... в дом сокровищный бога своего» — внесено (シナル, 宝庫), расхождение с LXX отмечено здесь."
  3: "Αβιεσδρι τῷ ἑαυτοῦ ἀρχιευνούχῳ — «Авиесдри, своему начальнику евнухов» (アビエスドリ — новое имя из LXX; слав. здесь «асфанез» по МТ); ἀγαγεῖν ... ἐκ τῶν υἱῶν τῶν μεγιστάνων τοῦ Ισραηλ — «привести из сынов вельмож Израиля» (μεγιστάν — вельможа); ἐκ τοῦ βασιλικοῦ γένους καὶ ἐκ τῶν ἐπιλέκτων — «из царского рода и из избранных»; слав. «от сынов плена израилева... и от князей» — внесено (捕囚, 貴族)."
  4: "νεανίσκους ἀμώμους καὶ εὐειδεῖς — «юношей непорочных и видных» (ἄμωμος — без изъяна); ἐπιστήμονας ἐν πάσῃ σοφίᾳ — «сведущих во всякой премудрости»; γραμματικούς, συνετούς, σοφούς — «книжных, понятливых, мудрых»; ἰσχύοντας ὥστε εἶναι ἐν τῷ οἴκῳ τοῦ βασιλέως — «крепких, чтобы быть в доме царя»; διδάξαι αὐτοὺς γράμματα καὶ διάλεκτον Χαλδαικήν — «научить их письменам и халдейскому наречию». Стих продолжает перечень 3-го стиха, как в LXX и слав."
  5: "δίδοσθαι αὐτοῖς ἔκθεσιν ἐκ τοῦ οἴκου τοῦ βασιλέως καθ' ἑκάστην ἡμέραν — «давать им содержание из дома царя каждый день» (ἔκθεσις — выдача, содержание); ἀπὸ τῆς βασιλικῆς τραπέζης καὶ ἀπὸ τοῦ οἴνου, οὗ πίνει ὁ βασιλεύς — «от царской трапезы и от вина, которое пьёт царь» (τράπεζα — 食卓); ἐκπαιδεῦσαι αὐτοὺς ἔτη τρία — «воспитывать их три года»; ἐκ τούτων στῆσαι ἔμπροσθεν τοῦ βασιλέως — «и из них поставить пред царём». Слав. «повеле им (даяти)... и кормити их»."
  6: "ἐκ τοῦ γένους τῶν υἱῶν Ισραηλ τῶν ἀπὸ τῆς Ιουδαίας — «из рода сынов Израиля, что из Иудеи»; слав. «от сынов иудиных» — внесено (ユダ族); имена Δανιηλ, Ανανιας, Μισαηλ, Αζαριας — ダニエル、ハナニヤ、ミシャエル、アザルヤ (формы по брифу и корпусу)."
  7: "ἐπέθηκεν αὐτοῖς ὁ ἀρχιευνοῦχος ὀνόματα — «возложил на них имена начальник евнухов»; Βαλτασαρ — バルタザル: это вавилонское имя Даниила; по-гречески оно же стоит у царя 5-й главы, поэтому одно имя на два лица; Σεδραχ, Μισαχ, Αβδεναγω — シャデラク、メシャク、アベド・ネゴ."
  8: "ἐνεθυμήθη Δανιηλ ἐν τῇ καρδίᾳ — «положил Даниил в сердце своём» (ἐνθυμέομαι — замышлять, класть на сердце); ὅπως μὴ ἀλισγηθῇ ἐν τῷ δείπνῳ τοῦ βασιλέως — «чтобы не оскверниться от трапезы царя» (ἀλισγέω — осквернять); ἐν ᾧ πίνει οἴνῳ — «и вином, которое он пьёт»; ἠξίωσε ... ἵνα μὴ συμμολυνθῇ — «просил... чтобы не оскверниться» (συμμολύνω)."
  9: "ἔδωκε κύριος τῷ Δανιηλ τιμὴν καὶ χάριν ἐναντίον τοῦ ἀρχιευνούχου — «дал Господь Даниилу честь и благодать пред начальником евнухов»; слав. «вдаде Бог даниила в милость и в щедроты» (по МТ) — в тексте 憐れみと慈しみ, у LXX «честь и благодать»."
  10: "Ἀγωνιῶ τὸν κύριόν μου τὸν βασιλέα — «тревожусь о господине моём, царе» (ἀγωνιάω — быть в страхе); τὸν ἐκτάξαντα τὴν βρῶσιν ὑμῶν καὶ τὴν πόσιν ὑμῶν — «назначившего пищу вашу и питьё ваше»; ἵνα μὴ ἴδῃ τὰ πρόσωπα ὑμῶν διατετραμμένα καὶ ἀσθενῆ — «чтобы не увидел лица ваши измождёнными и слабыми» (διατρέπω — искажать, изнурять); παρὰ τοὺς συντρεφομένους ὑμῖν νεανίας τῶν ἀλλογενῶν — «в сравнении с воспитанными вместе с вами юношами иноплеменников»; καὶ κινδυνεύσω τῷ ἰδίῳ τραχήλῳ — «и я подвергну опасности свою шею». Слав. «и осудите главу мою царю» (по МТ) — внесено (頭に罪を負う), у LXX «шея»."
  11: "Αβιεσδρι τῷ ἀναδειχθέντι ἀρχιευνούχῳ ἐπὶ τὸν Δανιηλ, Ανανιαν, Μισαηλ, Αζαριαν — «Авиесдри, поставленному начальником евнухов над Даниилом, Ананией, Мисаилом, Азарией» (ἀναδείκνυμι — назначать); в слав. здесь другое имя, «амелсар» (по МТ), — держим LXX (アビエスドリ), расхождение отмечено."
  12: "Πείρασον δὴ τοὺς παῖδάς σου ἐφ' ἡμέρας δέκα — «испытай же рабов твоих десять дней» (πειράζω — испытывать); δοθήτω ἡμῖν ἀπὸ τῶν ὀσπρίων τῆς γῆς — «пусть дадут нам от земных овощей» (ὄσπριον — бобовое, овощ; слав. «семена земные» — 野菜); ὥστε κάπτειν καὶ ὑδροποτεῖν — «чтобы есть и пить воду» (κάπτω — жевать, есть; ὑδροποτέω — пить воду)."
  13: "καὶ ἐὰν φανῇ ἡ ὄψις ἡμῶν διατετραμμένη — «если явится лицо наше измождённым»; παρὰ τοὺς ἄλλους νεανίσκους τοὺς ἐσθίοντας ἀπὸ τοῦ βασιλικοῦ δείπνου — «в сравнении с другими юношами, которые едят от царской трапезы»; καθὼς ἐὰν θέλῃς οὕτω χρῆσαι τοῖς παισί σου — «как пожелаешь, так и поступи с рабами твоими» (χράομαι — обращаться, поступать)."
  14: "ἐχρήσατο αὐτοῖς τὸν τρόπον τοῦτον — «поступил с ними так» (χράομαι); ἐπείρασεν αὐτοὺς ἡμέρας δέκα — «испытывал их десять дней»; слав. добавляет «и послуша их» (по МТ) — внесено (言うことを聞き入れ)."
  15: "μετὰ δὲ τὰς δέκα ἡμέρας — «после же десяти дней»; ἐφάνη ἡ ὄψις αὐτῶν καλὴ καὶ ἡ ἕξις τοῦ σώματος κρείσσων — «явилось лицо их красивым и состояние тела лучше» (ἕξις — состояние, упитанность); τῶν ἐσθιόντων τὸ βασιλικὸν δεῖπνον — «тех, кто ест царскую трапезу». Слав. «крепка плотию»."
  16: "ἦν ... ἀναιρούμενος τὸ δεῖπνον αὐτῶν καὶ τὸν οἶνον αὐτῶν — «был отнимающий трапезу их и вино их» (ἀναιρέω — отнимать); ἀντεδίδου αὐτοῖς ἀπὸ τῶν ὀσπρίων — «взамен давал им овощи» (ἀντιδίδωμι — давать взамен); в слав. здесь имя «амелсар» (по МТ), а в LXX — тот же Авиесдри, что в 3, 11 и здесь."
  17: "ἐπιστήμην καὶ σύνεσιν καὶ φρόνησιν ἐν πάσῃ γραμματικῇ τέχνῃ — «знание, разумение и мудрость во всяком книжном искусстве» (γραμματικὴ τέχνη); слав. добавляет «четырём» (по МТ) — внесено (四人); τῷ Δανιηλ ἔδωκε σύνεσιν ἐν παντὶ ῥήματι καὶ ὁράματι καὶ ἐνυπνίοις — «Даниилу дал разумение во всяком слове, видении и снах»; καὶ ἐν πάσῃ σοφίᾳ — «и во всякой премудрости» (есть в LXX, у слав. нет — оставлено)."
  18: "μετὰ δὲ τὰς ἡμέρας ταύτας ἐπέταξεν ὁ βασιλεὺς εἰσαγαγεῖν αὐτούς — «после дней сих повелел царь ввести их»; εἰσήχθησαν ἀπὸ τοῦ ἀρχιευνούχου πρὸς τὸν βασιλέα Ναβουχοδονοσορ — «введены были начальником евнухов к царю Навуходоносору»."
  19: "ὡμίλησεν αὐτοῖς ὁ βασιλεύς — «беседовал с ними царь» (ὁμιλέω); οὐχ εὑρέθη ἐν τοῖς σοφοῖς ὅμοιος τῷ Δανιηλ... — «не нашлось среди мудрецов подобного Даниилу...»; ἦσαν παρὰ τῷ βασιλεῖ — «были при царе». Слав. «и сташа пред царем» — внесено (そばに立つ)."
  20: "ἐν παντὶ λόγῳ καὶ συνέσει καὶ παιδείᾳ — «во всяком слове, разумении и учении» (παιδεία — обучение); κατέλαβεν αὐτοὺς σοφωτέρους δεκαπλασίως — «нашёл их в десять раз мудрее» (καταλαμβάνω — находить; δεκαπλασίως — десятикратно); ὑπὲρ τοὺς σοφιστὰς καὶ τοὺς φιλοσόφους — «чем софистов и философов»; слав. «паче всех обаятелей и волхвов» (по МТ) — внесено (呪術師と魔術師); καὶ ἐδόξασεν αὐτοὺς ὁ βασιλεὺς καὶ κατέστησεν αὐτοὺς ἄρχοντας — «и прославил их царь, и поставил их начальниками» (есть в LXX, у слав. опущено — оставлено)."
  21: "ἦν Δανιηλ ἕως τοῦ πρώτου ἔτους τῆς βασιλείας Κύρου βασιλέως Περσῶν — «был Даниил до первого года царства Кира, царя Персов»; слав. «даже до перваго лета кира царя» — без «Персов»; чтение LXX удержано (ペルシア人の王クロス)."
