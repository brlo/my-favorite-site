chapter: 6
draft: true

verses:
  1: "だから、キリストについての初歩[しょほ]の教[おし]えを捨[す]てて、成熟[せいじゅく]へと進[すす]もう。死[し]んだ行[おこな]いからの悔[く]い改[かい]と神[かみ]への信仰[しんこう]、"
  2: "諸[しょ]洗礼[せんれい]、按手[あんしゅ]、死者[ししゃ]の復活[ふっかつ]、永遠[えいえん]の裁[さば]きについての教[おし]えの土台[どだい]を、もう一度[いちど]据[す]え直[なお]すことなく。"
  3: "神[かみ]がお許[ゆる]しになるなら、そうしよう。"
  4: "一度[いちど]照[てら]され、天[てん]の賜物[たまもの]を味[あじ]わい、{聖霊[せいれい]|聖神[せいしん]}に与[あずか]る者[もの]となり、"
  5: "神[かみ]の良[よ]い言葉[ことば]と、来[きた]るべき世[よ]の力[ちから]を味[あじ]わって、"
  6: "しかも堕落[だらく]した者[もの]を、再[ふたた]び悔[く]い改[かい]へと新[あら]たにすることはできない。彼[かれ]らは神[かみ]の御子[みこ]を自分[じぶん]たちのために再び十字架[じゅうじか]につけ、さらし者[もの]にしているからである。"
  7: "というのは、しばしば降[ふ]る雨[あめ]を吸[す]い込[こ]み、耕[たがや]す者[もの]たちのために役[やく]に立[た]つ草[くさ]を生[は]えさせる土地[とち]は、神[かみ]から祝福[しゅくふく]を受[う]ける。"
  8: "しかし、茨[いばら]とあざみを生[は]えさせる土地[とち]は、役[やく]に立[た]たず、呪[のろ]いに近[ちか]く、最後[さいご]には焼[や]かれてしまう。"
  9: "しかし、愛[あい]する者[もの]たちよ。わたしたちは、このように言[い]ってはいるが、あなたがたについては、もっと良[よ]いこと、すなわち救[すく]いにつながることを確信[かくしん]している。"
  10: "神[かみ]は不義[ふぎ]な方[かた]ではない。あなたがたが聖[せい]なる者[もの]たちに仕[つか]え、また仕[つか]え続[つづ]けていることによって、神[かみ]の名[な]のために示[しめ]したあなたがたの働[はたら]きと愛[あい]とを、忘[わす]れられることはない。"
  11: "わたしたちは、あなたがた一人[ひとり]ひとりが、終[おわ]りまで同[おな]じ熱心[ねっしん]を示[しめ]して、希望[きぼう]の確信[かくしん]に至[いた]ることを願[ねが]っている。"
  12: "それは、あなたがたが怠[おこた]り者[もの]とならず、信仰[しんこう]と忍耐[にんたい]によって約束[やくそく]を受け継[つ]ぐ者[もの]たちに倣[なら]う者[もの]となるためである。"
  13: "神[かみ]はアブラハムに約束[やくそく]されたとき、ご自身[じしん]より大[おお]きい者[もの]によって誓[ちか]うことができなかったので、ご自身[じしん]によって誓[ちか]って、"
  14: "「わたしは必ずあなたを祝福[しゅくふく]して祝福し、あなたを増[ふ]やして増やす」と言[い]われた。"
  15: "こうして、アブラハムは忍耐[にんたい]して、約束[やくそく]を受[う]け継[つ]いだのである。"
  16: "人[ひと]は自分[じぶん]より大[おお]きい者[もの]によって誓[ちか]う。そして、誓[ちか]いは、すべての論争[ろんそう]を終[お]わらせて確証[かくしょう]とする。"
  17: "そこで、神[かみ]は、約束[やくそく]を受け継[つ]ぐ者[もの]たちに、ご自身[じしん]の御心[みこころ]が変[か]わらないことを、さらに明[あき]らかに示[しめ]そうとして、誓[ちか]いを加[くわ]えられたのである。"
  18: "それは、神[かみ]が偽[いつわ]ることはできない、変[か]わることのない二[ふた]つのことによって、わたしたちが、示[しめ]された希望[きぼう]を捕[つか]まえるために、力強[ちからづよ]い慰[なぐさ]めを得[え]るためである。"
  19: "この希望[きぼう]は、わたしたちの霊[れい]にとって、安全[あんぜん]で確[たし]かな錨[いかり]であり、垂[た]れ幕[まく]の内側[うちがわ]に入[はい]って行[い]くのである。"
  20: "そこへ、イエスがわたしたちの先駆[せんく]者[しゃ]として入[はい]り、永遠[えいえん]に、メルキセデクの位[くらい]に従[したが]う大祭司[だいさいし]となられたのである。"

notes:
  1: "Διό — だから. ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον — キリストについての初歩の教えを捨てて (λόγος здесь «учение»; ἀρχή — «начало»). ἐπὶ τὴν τελειότητα φερώμεθα — 成熟へと進もう (φέρομαι — «двигаться, устремляться»; τελειότης — 成熟). μὴ πάλιν θεμέλιον καταβαλλόμενοι — 土台を再び据え直すことなく (причастие управляет следующими родительными). μετανοίας ἀπὸ νεκρῶν ἔργων — 死んだ行いからの悔い改め. πίστεως ἐπὶ θεόν — 神への信仰."
  2: "βαπτισμῶν διδαχῆς — 諸洗礼についての教え (множественное число: «различные омовения», ср. 9:10). ἐπιθέσεως χειρῶν — 按手. ἀναστάσεως νεκρῶν — 死者の復活. κρίματος αἰωνίου — 永遠の裁き. Родительные падежи продолжают θεμέλιον (ст. 1)."
  3: "καὶ τοῦτο ποιήσομεν — そうしよう. ἐάνπερ ἐπιτρέπῃ ὁ θεός — 神がお許しになるなら (условие сохранено, без превращения в поговорку)."
  4: "Ἀδύνατον γάρ — というのは…できないからである (ἀδύνατον — «невозможно», без смягчения). τοὺς ἅπαξ φωτισθέντας — 一度照らされた者たち (φωτίζω — «просвещать»). γευσαμένους τῆς δωρεᾶς τῆς ἐπουρανίου — 天の賜物を味わった者たち: δωρεά — «дар», это не «духовный дар» и не «霊の賜物». μετόχους γενηθέντας πνεύματος ἁγίου — 聖霊に与る者となった者たち; пара {聖霊|聖神}."
  5: "καλὸν γευσαμένους θεοῦ ῥῆμα — 神の良い言葉を味わい (ῥῆμα — «слово, изречение»). δυνάμεις τε μέλλοντος αἰῶνος — 来るべき世の力 (множественное число — «силы»)."
  6: "καὶ παραπεσόντας — しかも堕落した者たち (παραπίπτω — «отпадать, падать»). πάλιν ἀνακαινίζειν εἰς μετάνοιαν — 再び悔い改めへと新たにすること. ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ — 自分たちのために神の御子を再び十字架につけ (ἀνασταυρόω — «снова распинать»). παραδειγματίζοντας — さらし者にする (παραδειγματίζω — «выставлять на позор»)."
  7: "γῆ γὰρ ἡ πιοῦσα — というのは、…土地は (образ земли; γῆ — 土地). τὸν ἐπ᾽ αὐτῆς ἐρχόμενον πολλάκις ὑετόν — しばしば降る雨. τίκτουσα βοτάνην εὔθετον — 役に立つ草を生えさせる. δι᾽ οὓς καὶ γεωργεῖται — 耕す者たちのために (γεωργέω — «возделывать»). μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ — 神から祝福を受ける."
  8: "ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους — 茨とあざみを生えさせる. ἀδόκιμος — 役に立たない (букв. «не прошедший испытания»). κατάρας ἐγγύς — 呪いに近い. ἧς τὸ τέλος εἰς καῦσιν — 最後には焼かれてしまう (εἰς καῦσιν — «на сожжение»)."
  9: "Πεπείσμεθα — 確信している (perfect). τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας — もっと良いこと、すなわち救いにつながること (ἐχόμενα — «близкое, относящееся»). εἰ καὶ οὕτως λαλοῦμεν — このように言ってはいるが."
  10: "οὐ γὰρ ἄδικος ὁ θεός — 神は不義な方ではない (литота сохранена). ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν καὶ τῆς ἀγάπης — 働きと愛とを忘れること. ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ — 神の名のために示した. διακονήσαντες…καὶ διακονοῦντες — 仕え、また仕え続けている (аорист и настоящее время сохранены оба)."
  11: "ἐπιθυμοῦμεν — 願っている. τὴν αὐτὴν ἐνδείκνυσθαι σπουδήν — 同じ熱心を示す. πρὸς τὴν πληροφορίαν τῆς ἐλπίδος — 希望の確信に至ること (πληροφορία — «полная уверенность»). ἄχρι τέλους — 終わりまで."
  12: "ἵνα μὴ νωθροὶ γένησθε — 怠り者とならないため (νωθρός — ср. 5:11). μιμηταὶ δὲ τῶν…κληρονομούντων τὰς ἐπαγγελίας — 約束を受け継ぐ者たちに倣う者. διὰ πίστεως καὶ μακροθυμίας — 信仰と忍耐によって (μακροθυμία — «долготерпение»)."
  13: "Быт 22:16. Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός — 神はアブラハムに約束されたとき. ἐπεὶ κατ᾽ οὐδενὸς εἶχεν μείζονος ὀμόσαι — ご自身より大きい者によって誓うことができなかったので. ὤμοσεν καθ᾽ ἑαυτοῦ — ご自身によって誓って."
  14: "Быт 22:17. Εἰ μὴν εὐλογῶν εὐλογήσω σε καὶ πληθύνων πληθυνῶ σε — 「わたしは必ずあなたを祝福して祝福し、あなたを増やして増やす」. Усиленная конструкция (причастие + финитный глагол) передана буквально, без сглаживания в «щедро благословлю»."
  15: "καὶ οὕτως μακροθυμήσας — こうして、アブラハムは忍耐して (μακροθυμέω — ср. 6:12). ἐπέτυχεν τῆς ἐπαγγελίας — 約束を得た (ἐπιτυγχάνω — «достигать»)."
  16: "κατὰ τοῦ μείζονος ὀμνύουσιν — 自分より大きい者によって誓う. πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος — 誓いは、すべての論争を終わらせて確証とする (πέρας — «предел, конец»; βεβαίωσις — «подтверждение, гарантия»)."
  17: "ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι — そこで、神は…さらに明らかに示そうとして. τοῖς κληρονόμοις τῆς ἐπαγγελίας — 約束を受け継ぐ者たちに. τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ — 御心が変わらないこと (ἀμετάθετος — «непреложный»). ἐμεσίτευσεν ὅρκῳ — 誓いを加えられた (μεσιτεύω — «гарантировать, выступать посредником»)."
  18: "διὰ δύο πραγμάτων ἀμεταθέτων — 変わることのない二つのこと (обетование и клятва). ἐν οἷς ἀδύνατον ψεύσασθαι [τὸν] θεόν — 神が偽ることはできない; [τὸν] стоит в базе в квадратных скобках, слово есть, 〔〕 не ставятся. ἰσχυρὰν παράκλησιν — 力強い慰め (παράκλησις — «утешение, ободрение»). οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος — 示された希望を捕まえるために逃れ来た者たち."
  19: "ὡς ἄγκυραν…ἀσφαλῆ τε καὶ βεβαίαν — 安全で確かな錨 (образ якоря сохранён). εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος — 垂れ幕の内側に入って行く (καταπέτασμα — «завеса»; ἐσώτερον — «внутреннее»)."
  20: "πρόδρομος — 先駆者 (первый вошедший, предтеча). ὑπὲρ ἡμῶν εἰσῆλθεν — わたしたちのために…入り. κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα — 永遠に、メルキセデクの位に従う大祭司となって. Стих возвращает к 5:6 и готовит гл. 7."
