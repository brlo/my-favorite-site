# jp-box, Послание к Евреям, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 6: оставив начатки учения, идти к совершенству (1–3), невозможность
# обновить отпавших, распинающих Сына заново (4–8), добрая надежда и труд
# любви (9–12), клятва Аврааму и якорь надежды (13–20).
# Красного и синего нет: слова Христа и Богородицы не цитируются; <j>/<mo> не ставятся.
# 6:13–15 — Быт 22:16–17, в 「…」, без красного: это слова Бога, а не Христа.
# 〔…〕 в главе нет: [καὶ] (6:12) и [τὸν] (6:18) стоят в базе в квадратных скобках,
# слова есть, поэтому не оборачиваются (проверено запросом к gr-lxx-byz).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
