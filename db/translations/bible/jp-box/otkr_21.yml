# jp-box, Откровение, глава 21. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 21: новый Иерусалим (1–8), невеста Агнца и измерение города (9–21),
# Бог и Агнец — храм, свет и слава города (22–27).
# Красного <j> нет: 21:3–4 — голос от престола, 21:5–8 — Сидящий на престоле, то есть
# Бог, а не Христос явно (оговорено в notes); прямая речь Христа в главе не опознаётся.
# <mo> нет.
# 〔…〕: 21:24 — церковное τῶν σωζομένων («спасённых», Елизаветинская, jp-joc 救はれたる):
# проверено, в gr-lxx-byz его нет. Прочее ([αὐτῶν θεός] 21:3, [ὅτι] 21:4, [εἰμί] 21:6)
# в базе есть — без скобок.
# Сносок ⟨…⟩ нет: 幕屋, 命の木, 新エルサレム либо уже в корпусе, либо понятны из стиха.

