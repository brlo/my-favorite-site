verses:
  1: "また、わたしは新[あたら]しい天[てん]と新[あたら]しい地[ち]を見[み]た。先[さき]の天[てん]と先[さき]の地[ち]は過[す]ぎ去[さ]り、海[うみ]ももはやなくなっていたからである。"
  2: "また、わたしは、聖[せい]なる都[みやこ]、新[あたら]しいエルサレムが、神[かみ]のもとから、天[てん]から降[くだ]って来[く]るのを見[み]た。それは、夫[おっと]のために飾[かざ]り立[た]てられた花嫁[はなよめ]のように整[ととの]えられていた。"
  3: "また、わたしは御座[みくら]から出[で]る大[おお]きな声[こえ]を聞[き]いた。「見[み]よ、神[かみ]の幕屋[まくや]が人[ひと]々[びと]とともにある。神[かみ]は彼[かれ]らとともに住[す]み、彼[かれ]らは神[かみ]の民[たみ]となる。神[かみ]ご自身[じしん]が彼[かれ]らとともにあり、彼[かれ]らの神[かみ]となる。"
  4: "神[かみ]は彼[かれ]らの目[め]からすべての涙[なみだ]を拭[ぬぐ]い取[と]られる。もはや死[し]はなく、悲[かな]しみも叫[さけ]びも苦[くる]しみも、もはやない。先[さき]のものたちは過[す]ぎ去[さ]ったからである。」"
  5: "すると、御座[みくら]に着[つ]いておられる方[かた]が言[い]われた。「見[み]よ、わたしはすべてを新[あたら]しくする。」また、言[い]われた。「書[か]きなさい。これらの言葉[ことば]は確[たし]かであり、真実[しんじつ]である。」"
  6: "そして、わたしに言[い]われた。「すべては成[な]し遂[と]げられた。わたしはアルファであり、オメガである。初[はじ]めであり、終[お]わりである。渇[かわ]いている者[もの]には、命[いのち]の水[みず]を、泉[いずみ]からただで与[あた]えよう。"
  7: "勝[か]つ者[もの]は、これらのすべてを受[う]け継[つ]ぐ。わたしはその者[もの]の神[かみ]となり、その者[もの]はわたしの子[こ]となる。」"
  8: "しかし、臆病[おくびょう]な者[もの]、信[しん]じない者[もの]、忌[い]まわしい者[もの]、人殺[ひとごろ]し、淫[いん]らな者[もの]、魔術[まじゅつ]を行[おこな]う者[もの]、偶像[ぐうぞう]を礼拝[れいはい]する者[もの]、そしてすべて偽[いつわ]りを言[い]う者[もの]たちの分[ぶん]は、硫黄[いおう]の火[ひ]で燃[も]える池[いけ]にある。これが第二[だいに]の死[し]である。"
  9: "また、七[なな]つの最後[さいご]の災[わざわ]いを満[み]たした七[なな]つの鉢[はち]を持[も]つ七[なな]人の天使[てんし]の一人[ひとり]が、わたしのところへ来[き]て言[い]った。「来[き]なさい。小羊[こひつじ]の妻[つま]、すなわち花嫁[はなよめ]を、あなたに示[しめ]そう。」"
  10: "そして、彼[かれ]は霊[れい]のうちに、わたしを大[おお]きく高[たか]い山[やま]へ連[つ]れて行[い]き、聖[せい]なる都[みやこ]、エルサレムが、神[かみ]のもとから、天[てん]から降[くだ]って来[く]るのを、わたしに示[しめ]した。"
  11: "都[みやこ]には神[かみ]の栄光[えいこう]があった。その輝[かがや]きは、水晶[すいしょう]のように澄[す]んだ、最[もっと]も貴[とうと]い石[いし]である碧玉[へきぎょく]のようであった。"
  12: "都[みやこ]には大[おお]きく高[たか]い城壁[じょうへき]があり、十[じゅう]二[に]の門[もん]があって、門[もん]のそばには十[じゅう]二[に]人の天使[てんし]がいた。また、イスラエルの子[こ]ら十[じゅう]二[に]の部族[ぶぞく]の名[な]が記[しる]されていた。"
  13: "東[ひがし]に三[みっ]つの門[もん]、北[きた]に三[みっ]つの門[もん]、南[みなみ]に三[みっ]つの門[もん]、西[にし]に三[みっ]つの門[もん]がある。"
  14: "都[みやこ]の城壁[じょうへき]には十[じゅう]二[に]の土台[どだい]があり、その上[うえ]には、小羊[こひつじ]の十[じゅう]二[に]人の使徒[しと]たちの名[な]が記[しる]されていた。"
  15: "わたしと語[かた]っていた人[ひと]は、都[みやこ]とその門[もん]、その城壁[じょうへき]を測[はか]るために、金[きん]の測[はか]り棒[ぼう]を持[も]っていた。"
  16: "都[みやこ]は四角[しかく]に造[つく]られ、その長[なが]さは幅[はば]と同[おな]じであった。彼[かれ]はその測[はか]り棒[ぼう]で都[みやこ]を測[はか]り、一万二千[いちまんにせん]スタディオンを得[え]た。その長[なが]さも幅[はば]も高[たか]さも等[ひと]しい。"
  17: "また、その城壁[じょうへき]を測[はか]ると、百四十四[ひゃくよんじゅうよん]ペキスであった。これは人[ひと]の尺度[しゃくど]であり、天使[てんし]の尺度[しゃくど]でもある。"
  18: "城壁[じょうへき]は碧玉[へきぎょく]で造[つく]られ、都[みやこ]は清[きよ]いガラスのような純金[じゅんきん]であった。"
  19: "都[みやこ]の城壁[じょうへき]の土台[どだい]は、あらゆる貴[とうと]い石[いし]で飾[かざ]られていた。第一[だいいち]の土台[どだい]は碧玉[へきぎょく]、第二[だいに]はサファイア、第三[だいさん]はカルケドン、第四[だいし]はエメラルド、"
  20: "第五[だいご]はサードニクス、第六[だいろく]はカーネリアン、第七[だいしち]はクリソライト、第八[だいはち]はベリル、第九[だいきゅう]はトパーズ、第十[だいじゅう]はクリソプレーズ、第十一[だいじゅういち]はヒヤシンス、第十二[だいじゅうに]はアメジストである。"
  21: "十[じゅう]二[に]の門[もん]は十[じゅう]二[に]の真珠[しんじゅ]であり、一[ひと]つの門[もん]はそれぞれ一[ひと]つの真珠[しんじゅ]からできていた。都[みやこ]の大通[おおどお]りは、透[す]き通[とお]ったガラスのような純金[じゅんきん]であった。"
  22: "わたしは都[みやこ]の中[なか]に神殿[しんでん]を見[み]なかった。全能者[ぜんのうしゃ]である主[しゅ]なる神[かみ]と小羊[こひつじ]が、都[みやこ]の神殿[しんでん]であるからである。"
  23: "都[みやこ]は、太陽[たいよう]も月[つき]も、自分[じぶん]を照[て]らすために必要[ひつよう]としない。神[かみ]の栄光[えいこう]が都[みやこ]を照[て]らし、小羊[こひつじ]がその灯[ともしび]であるからである。"
  24: "〔救[すく]われた〕諸国[しょこく]は、都[みやこ]の光[ひかり]によって歩[あゆ]む。地[ち]の王[おう]たちは、自分[じぶん]の栄光[えいこう]を都[みやこ]に携[たずさ]えて来[く]る。"
  25: "都[みやこ]の門[もん]は、昼[ひる]の間[あいだ]決[けっ]して閉[と]じられない。そこには夜[よる]がないからである。"
  26: "人[ひと]々[びと]は、諸国[しょこく]の栄光[えいこう]と誉[ほま]れを都[みやこ]に携[たずさ]えて来[く]る。"
  27: "しかも、汚[けが]れたもの、忌[い]まわしいことや偽[いつわ]りを行[おこな]う者[もの]は、決[けっ]して都[みやこ]に入[はい]れない。小羊[こひつじ]の命[いのち]の書[しょ]に記[しる]されている者[もの]たちだけが入[はい]る。"

notes:
  1: "οὐρανὸν καινὸν καὶ γῆν καινήν — 新しい天と新しい地 (καινός — «новый по качеству»). ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν — 先の天と先の地は過ぎ去り. ἡ θάλασσα οὐκ ἔστιν ἔτι — 海ももはやなくなっていた."
  2: "τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινήν — 聖なる都、新しいエルサレム. καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ — 神のもとから、天から降って来る. ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς — 夫のために飾り立てられた花嫁のように整えられていた (νύμφη — 花嫁, ὁ ἀνήρ — 夫)."
  3: "φωνῆς μεγάλης ἐκ τοῦ θρόνου — 御座から出る大きな声 (в базе ἐκ τοῦ θρόνου; у jp-joc «с неба» — иду за базой). ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων — 神の幕屋が人々とともにある. σκηνώσει μετ' αὐτῶν — 彼らとともに住み (σκηνόω — «обитать в шатре»). αὐτοὶ λαοὶ αὐτοῦ ἔσονται — 彼らは神の民となる. [αὐτῶν θεός] в базе есть, без 〔〕."
  4: "ἐξαλείψει πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν — 目からすべての涙を拭い取られる (ἐξαλείφω — «стирать»). ὁ θάνατος οὐκ ἔσται ἔτι — もはや死はない. πένθος, κραυγή, πόνος — 悲しみ、叫び、苦しみ. [ὅτι] в базе есть — からである."
  5: "ὁ καθήμενος ἐπὶ τῷ θρόνῳ — 御座に着いておられる方; это Бог, а не Христос явно, поэтому не красное. ἰδοὺ καινὰ ποιῶ πάντα — 見よ、わたしはすべてを新しくする (настоящее время сохранено). Γράψον — 書きなさい. πιστοὶ καὶ ἀληθινοί — 確かであり、真実である."
  6: "γέγοναν — 成し遂げられた (perfect мн. ч.: «совершилось»). ἐγὼ [εἰμὶ] τὸ Ἄλφα καὶ τὸ Ὦ — わたしはアルファであり、オメガである; [εἰμί] в базе есть. ἡ ἀρχὴ καὶ τὸ τέλος — 始めであり、終わりである. ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν — 命の水の泉から、ただで."
  7: "ὁ νικῶν κληρονομήσει ταῦτα — 勝ちを得る者は、これらのものを受け継ぐ (νικάω — 勝つ, κληρονομέω — 受け継ぐ). ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός — わたしはその者の神となり、その者はわたしの子となる (2 Цар 7:14)."
  8: "δειλοί — 臆病な者. ἄπιστοι — 信じない者. ἐβδελυγμένοι — 忌まわしい者. φάρμακοι — 魔術を行う者. εἰδωλολάτραι — 偶像を礼拝する者. πᾶσιν τοῖς ψευδέσιν — すべて偽りを言う者たち. λίμνη καιομένη πυρὶ καὶ θείῳ — 硫黄の火で燃える池. ὁ θάνατος ὁ δεύτερος — 第二の死."
  9: "ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας — 七つの鉢を持つ七人の天使 (φιάλη — 鉢). τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων — 七つの最後の災いを満たした. τὴν νύμφην τὴν γυναῖκα τοῦ ἀρνίου — 小羊の妻、すなわち花嫁 (оба слова сохранены)."
  10: "ἀπήνεγκέν με ἐν πνεύματι — 霊のうちに…連れて行き (πνεῦμα без ἅγιον — 霊[れい], не 聖霊). ἐπὶ ὄρος μέγα καὶ ὑψηλόν — 大きく高い山へ. τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ — 聖なる都、エルサレム."
  11: "ἔχουσαν τὴν δόξαν τοῦ θεοῦ — 神の栄光があった. ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ — その輝きは最も貴い石のよう. ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι — 水晶のように澄んだ碧玉."
  12: "τεῖχος μέγα καὶ ὑψηλόν — 大きく高い城壁. πυλῶνας δώδεκα — 十二の門. ὀνόματα…τῶν δώδεκα φυλῶν υἱῶν Ἰσραήλ — イスラエルの子ら十二の部族の名."
  13: "ἀπὸ ἀνατολῆς…βορρᾶ…νότου…δυσμῶν — 東・北・南・西. πυλῶνες τρεῖς — 三つの門 (по три с каждой стороны)."
  14: "θεμελίους δώδεκα — 十二の土台. ἐπ' αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου — その上に、小羊の十二人の使徒の名."
  15: "μέτρον κάλαμον χρυσοῦν — 金の測り棒 (κάλαμος — «трость»). μετρήσῃ τὴν πόλιν — 都を測る."
  16: "τετράγωνος κεῖται — 四角に造られ. τὸ μῆκος…ὅσον τὸ πλάτος — 長さは幅と同じ. σταδίων δώδεκα χιλιάδων — 一万二千スタディオン. ἴσα ἐστίν — 等しい."
  17: "ἑκατὸν τεσσαράκοντα τεσσάρων πηχῶν — 百四十四ペキス (πῆχυς — локоть). μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου — 人の尺度であり、天使の尺度でもある."
  18: "ἡ ἐνδώμησις τοῦ τείχους — 城壁の造り (ἐνδώμησις — «кладка»). ἴασπις — 碧玉. χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ — 清いガラスのような純金."
  19: "παντὶ λίθῳ τιμίῳ κεκοσμημένοι — あらゆる貴い石で飾られていた. ἴασπις, σάπφιρος, χαλκηδών, σμάραγδος — 碧玉、サファイア、カルケドン、エメラルド."
  20: "σαρδόνυξ, σάρδιον, χρυσόλιθος, βήρυλλος, τοπάζιον, χρυσόπρασος, ὑάκινθος, ἀμέθυστος — サードニクス、カーネリアン、クリソライト、ベリル、トパーズ、クリソプレーズ、ヒヤシンス、アメジスト. Названия переданы транслитерацией, без толкований."
  21: "οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται — 十二の門は十二の真珠. ἀνὰ εἷς ἕκαστος…ἐξ ἑνὸς μαργαρίτου — 一つの門はそれぞれ一つの真珠から. ἡ πλατεῖα τῆς πόλεως — 都の大通り. ὡς ὕαλος διαυγής — 透き通ったガラスのような."
  22: "ναὸν οὐκ εἶδον ἐν αὐτῇ — 都の中に神殿を見なかった. κύριος ὁ θεὸς ὁ παντοκράτωρ ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον — 全能者である主なる神と小羊が、都の神殿である."
  23: "οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης — 太陽も月も必要としない. ἡ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν — 神の栄光が都を照らし. ὁ λύχνος αὐτῆς τὸ ἀρνίον — 小羊がその灯."
  24: "В базе περιπατήσουσιν τὰ ἔθνη, без τῶν σωζομένων (проверено: НЕТ); церковный текст (Елизаветинская «языцы спасеннии», jp-joc 救はれたる諸民) прибавляет — 〔救われた〕. φέρουσιν τὴν δόξαν αὐτῶν εἰς αὐτήν — 自分の栄光を都に携えて来る (настоящее время)."
  25: "οὐ μὴ κλεισθῶσιν ἡμέρας — 昼の間決して閉じられない. νὺξ γὰρ οὐκ ἔσται ἐκεῖ — そこには夜がないからである."
  26: "οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν — 諸国の栄光と誉れを携えて来る (τιμή — 誉れ[ほまれ], как в 1 Тим 1:17)."
  27: "πᾶν κοινόν — 汚れたもの (κοινός — «нечистый, обыденный»). ποιῶν βδέλυγμα καὶ ψεῦδος — 忌まわしいことや偽りを行う者. οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου — 小羊の命の書に記されている者たち."
