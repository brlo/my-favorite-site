verses:
  1: "マナセは王[おう]となったとき十二歳[じゅうにさい]で、エルサレムで五十五[ごじゅうご]年[ねん]治[おさ]めた。母[はは]の名[な]はオプシバであった。"
  2: "彼[かれ]は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、主[しゅ]がイスラエルの子[こ]らの前[まえ]から追[お]い出[だ]した国[くに]々[ぐに]の忌[い]まわしい行[おこな]いにならった。"
  3: "彼[かれ]はまた、父[ちち]ヒゼキヤが壊[こわ]した高[たか]い所[ところ]を建[た]て直[なお]し、バアルのために祭壇[さいだん]を立[た]て、イスラエルの王[おう]アハブがしたようにアシェラの木立[こだち]を造[つく]り、天[てん]の軍勢[ぐんせい]すべてを拝[おが]み、それらに仕[つか]えた。"
  4: "また、主[しゅ]が「わたしの名[な]をエルサレムに置[お]く」と言[い]われたその神殿[しんでん]のうちに、祭壇[さいだん]を築[きず]いた。"
  5: "主[しゅ]の神殿[しんでん]の二[ふた]つの庭[にわ]に、天[てん]の軍勢[ぐんせい]すべてのために祭壇[さいだん]を築[きず]いた。"
  6: "彼[かれ]は自分[じぶん]の子[こ]らを火[ひ]の中[なか]に通[とお]らせ、占[うらな]いをし、兆[きざ]しを読[よ]み、霊媒[れいばい]と呪術師[じゅじゅつし]を置[お]いた。彼[かれ]は主[しゅ]の目[め]に悪[わる]いことを多[おお]く行[おこな]い、主[しゅ]を怒[いか]らせた。"
  7: "彼[かれ]はアシェラの彫[ほ]り像[ぞう]を、主[しゅ]がダビデと、その子[こ]ソロモンに語[かた]られたその神殿[しんでん]に置[お]いた。主[しゅ]は言[い]われた。「この神殿[しんでん]と、わたしがイスラエルのすべての部族[ぶぞく]のうちから選[えら]んだエルサレムに、わたしの名[な]をとこしえに置[お]く。"
  8: "わたしは、わたしが彼[かれ]らの父祖[ふそ]に与[あた]えた地[ち]からイスラエルの足[あし]を再[ふたた]び動[うご]かさない。ただし、彼[かれ]らが、わたしのしもべモーセが彼[かれ]らに命[めい]じたすべての戒[いまし]めに従[したが]って、わたしが命[めい]じたすべてを守[まも]るならば。」"
  9: "しかし彼[かれ]らは聞[き]き従[したが]わなかった。マナセは彼[かれ]らを惑[まど]わし、主[しゅ]がイスラエルの子[こ]らの前[まえ]から滅[ほろ]ぼした国[くに]々[ぐに]よりもひどく、主[しゅ]の目[め]に悪[わる]いことを行[おこな]わせた。"
  10: "主[しゅ]はそのしもべである預言者[よげんしゃ]たちの手[て]によって語[かた]って言[い]われた。"
  11: "「ユダの王[おう]マナセがこれらの悪[わる]い忌[い]まわしい行[おこな]いを、彼[かれ]より前[まえ]にいたアモリ人[じん]が行[おこな]ったすべてにもまして行[おこな]い、またユダをもその偶像[ぐうぞう]によって罪[つみ]に陥[おとしい]れたゆえに、"
  12: "それゆえ、イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。見[み]よ、わたしはエルサレムとユダに災[わざわ]いをもたらす。それを聞[き]く者[もの]はだれでも、両[りょう]の耳[みみ]が鳴[な]るほどである。"
  13: "わたしはエルサレムにサマリアの測[はか]り縄[なわ]とアハブの家[いえ]の重[おも]りを当[あ]てる。わたしはエルサレムをぬぐい去[さ]る。ちょうど、器[うつわ]をぬぐって、それを裏返[うらがえ]すように。"
  14: "わたしはわたしの嗣業[しぎょう]の残[のこ]りを捨[す]て、彼[かれ]らを敵[てき]の手[て]に渡[わた]す。彼[かれ]らはすべての敵[てき]の掠[かす]め物[もの]、分捕[ぶんど]り物[もの]となる。"
  15: "彼[かれ]らがわたしの目[め]に悪[わる]いことを行[おこな]い、わたしが彼[かれ]らの父祖[ふそ]たちをエジプトから導[みちび]き出[だ]した日[ひ]から今日[きょう]まで、わたしを怒[いか]らせ続[つづ]けてきたからである。」"
  16: "マナセはまた、非常[ひじょう]に多[おお]くの無実[むじつ]の血[ち]を流[なが]し、ついにエルサレムを端[はし]から端[はし]まで血[ち]で満[み]たした。これは、彼[かれ]がユダを罪[つみ]に陥[おとしい]れて主[しゅ]の目[め]に悪[わる]いことを行[おこな]わせた、その罪[つみ]に加[くわ]えてのことである。"
  17: "マナセの残[のこ]りの言葉[ことば]、彼[かれ]が行[おこな]ったすべてのこと、および彼[かれ]が犯[おか]した罪[つみ]は、見[み]よ、ユダの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  18: "マナセは先祖[せんぞ]たちとともに眠[ねむ]り、自分[じぶん]の家[いえ]の庭[にわ]、ウザの庭[にわ]に葬[ほうむ]られた。その子[こ]アモンが彼[かれ]に代[か]わって王[おう]となった。"
  19: "アモンは王[おう]となったとき二十二歳[にじゅうにさい]で、エルサレムで二[に]年[ねん]治[おさ]めた。母[はは]の名[な]はメソラム、ハルスの娘[むすめ]で、イテバの出[で]であった。"
  20: "彼[かれ]は父[ちち]マナセがしたように、主[しゅ]の目[め]に悪[わる]いことを行[おこな]った。"
  21: "彼[かれ]は父[ちち]が歩[あゆ]んだすべての道[みち]を歩[あゆ]み、父[ちち]が仕[つか]えた偶像[ぐうぞう]に仕[つか]え、それらを拝[おが]んだ。"
  22: "彼[かれ]は自分[じぶん]の父祖[ふそ]の神[かみ]である主[しゅ]を捨[す]て、主[しゅ]の道[みち]を歩[あゆ]まなかった。"
  23: "アモンの家来[けらい]たちは彼[かれ]に謀反[むほん]を起[お]こし、王[おう]をその家[いえ]で殺[ころ]した。"
  24: "しかし、その地[ち]の民[たみ]はすべて、アモン王[おう]に謀反[むほん]を起[お]こした者[もの]たちをみな打[う]ち殺[ころ]した。そしてその地[ち]の民[たみ]は、彼[かれ]の子[こ]ヨシヤを彼[かれ]に代[か]わって王[おう]とした。"
  25: "アモンの残[のこ]りの言葉[ことば]、彼[かれ]が行[おこな]ったすべてのことは、見[み]よ、ユダの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  26: "彼[かれ]はウザの庭[にわ]にある自分[じぶん]の墓[はか]に葬[ほうむ]られた。その子[こ]ヨシヤが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "Υἱὸς δώδεκα ἐτῶν — «сын двенадцати лет», т. е. двенадцати лет; ἐν τῷ βασιλεύειν αὐτόν — «когда он воцарился»; πεντήκοντα καὶ πέντε ἔτη — пятьдесят пять лет (в ru «пятьдесят лет» — иное чтение, по МТ); ὄνομα τῇ μητρὶ αὐτοῦ — имя матери его; Οψιβα — Хефциба (слав. «Офовиа», ru «Хефциба»), в тексте オプシバ по гр."
  2: "τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου — злое в очах Господних; κατὰ τὰ βδελύγματα τῶν ἐθνῶν — по мерзостям народов (βδέλυγμα — мерзость, 忌まわしい行い); ἐξῆρεν — изгнал (ἐξαίρω); ἀπὸ προσώπου τῶν υἱῶν Ισραηλ — от лица сынов Израилевых. Слав. добавляет «хождаше вслед» («и хождаше вслед мерзостей языков») — в гр только κατά, передано にならった."
  3: "ἐπέστρεψεν — обратился, снова (ἐπιστρέφω); κατέσπασεν — низверг, разрушил (κατασπάω); ἀνέστησεν θυσιαστήριον τῇ Βααλ — воздвиг жертвенник Ваалу; ἐποίησεν ἄλση — сделал дубравы, т. е. ашеры (アシェラの木立; мн. ч.); πάσῃ τῇ δυνάμει τοῦ οὐρανοῦ — всему воинству небесному (天の軍勢すべて); ἐδούλευσεν αὐτοῖς — служил им (мн. ч., хотя «воинство» — ед. ч.)."
  4: "ᾠκοδόμησεν θυσιαστήριον — построил жертвенник (ед. ч.; в ru мн. ч. «жертвенники»); ὡς εἶπεν — «как сказал» (слав. добавляет «Господь»: «якоже рече Господь»); Ἐν Ιερουσαλημ θήσω τὸ ὄνομά μου — «в Иерусалиме положу имя Моё» (цитата в повествовании, 「」)."
  5: "ἐν ταῖς δυσὶν αὐλαῖς οἴκου κυρίου — на обоих дворах дома Господня; θυσιαστήριον — ед. ч. (в ru мн. ч.). Творительный датив πάσῃ τῇ δυνάμει — «для всего воинства»."
  6: "διῆγεν τοὺς υἱοὺς αὐτοῦ ἐν πυρί — проводил сыновей своих через огонь (διάγω); ἐκληδονίζετο — гадал (κληδονίζομαι); οἰωνίζετο — ворожил по птицам (οἰωνίζομαι); ἐποίησεν θελητὴν καὶ γνώστας — поставил вызывателя мёртвых и знахарей (θελητής, γνώστης), передано 霊媒と呪術師; ἐπλήθυνεν τοῦ ποιεῖν — умножал делание. Слав. «сотвори капища, и волшебницы умножи» понимает эти два слова иначе (капища, волшебницы); принят смысл греческих терминов, известный по Втор 18:10–11."
  7: "γλυπτόν — изваяние, истукан (彫り像); ἄλσος — дубрава (Ашера, 木立); ᾧ εἶπεν κύριος — «о котором сказал Господь»; ᾗ ἐξελεξάμην ἐκ πασῶν φυλῶν Ισραηλ — «который Я избрал из всех колен Израилевых» (ᾗ — об Иерусалиме); εἰς τὸν αἰῶνα — на век (とこしえに). Здесь открывается слово Господа (7–8)."
  8: "οὐ προσθήσω τοῦ σαλεῦσαι — «не приложу поколебать», т. е. впредь не дам поколебаться (σαλεύω); οἵτινες φυλάξουσιν — относительное «которые будут соблюдать», по смыслу условие (слав. «аще тии соблюдут»); κατὰ πᾶσαν τὴν ἐντολήν — по всей заповеди; ἣν ἐνετείλατο … ὁ δοῦλός μου Μωϋσῆς — которую заповедал раб Мой Моисей."
  9: "ἐπλάνησεν — прельстил, совратил (πλανάω); ἠφάνισεν — истребил (ἀφανίζω); ὑπὲρ τὰ ἔθνη — хуже народов; ἐκ προσώπου υἱῶν Ισραηλ — от лица сынов Израилевых."
  10: "ἐλάλησεν κύριος ἐν χειρὶ δούλων αὐτοῦ τῶν προφητῶν — говорил Господь рукою рабов Своих пророков; λέγων — «говоря», вводит речь 11–15. Отдельного «посему» в стихе нет."
  11: "Ἀνθ᾿ ὧν — «за то что»: главное предложение в стихе 12, поэтому стих кончается запятой; τὰ βδελύγματα ταῦτα τὰ πονηρά — эти злые мерзости; ὁ Αμορραῖος ὁ ἔμπροσθεν — Аморреянин, бывший прежде (アモリ人); ἐξήμαρτεν — ввёл в грех (каузатив от ἐξαμαρτάνω); εἴδωλα — идолы (偶像)."
  12: "οὐχ οὕτως — «не так» (слав. «не тако»; по смыслу — «посему», отсюда それゆえ); τάδε λέγει κύριος ὁ θεὸς Ισραηλ; Ἰδοὺ ἐγὼ φέρω κακά — вот, Я навожу злое; ὥστε παντὸς ἀκούοντος ἠχήσει ἀμφότερα τὰ ὦτα αὐτοῦ — так что у всякого слышащего зазвенят оба уха его (ἠχέω)."
  13: "ἐκτενῶ — протяну (ἐκτείνω); τὸ μέτρον Σαμαρείας — меру, вервь Самарии (μέτρον — мера, 測り縄); τὸ στάθμιον οἴκου Αχααβ — отвес дома Ахава (στάθμιον, 重り); ἀπαλείψω — отру, изглажу (ἀπαλείφω); ὁ ἀλάβαστρος — алебастровый сосуд (слав. «алавастр»), передано 器; καταστρέφεται ἐπὶ πρόσωπον αὐτοῦ — «опрокидывается на лицо своё», передано 裏返す."
  14: "ἀπώσομαι — отвергну, отрину (ἀπωθέω); τὸ ὑπόλειμμα τῆς κληρονομίας μου — остаток наследия Моего (嗣業の残り); παραδώσω εἰς χεῖρας ἐχθρῶν — предам в руки врагов; διαρπαγή — расхищение; προνομή — добыча, грабёж (分捕り物)."
  15: "ἀνθ᾿ ὧν — за то что; ἦσαν παροργίζοντές με — «были прогневляющими Меня» (описательный имперфект); ἀπὸ τῆς ἡμέρας, ἧς ἐξήγαγον τοὺς πατέρας αὐτῶν ἐξ Αἰγύπτου — с того дня, как Я вывел отцов их из Египта; ἕως τῆς ἡμέρας ταύτης — до сего дня. Здесь закрывается слово Господа (11–15)."
  16: "αἷμα ἀθῷον — кровь невинная (無実の血); ἐξέχεεν — пролил (ἐκχέω); ἕως οὗ ἔπλησεν — доколе не наполнил; στόμα εἰς στόμα — «уста к устам», т. е. от края до края (端から端まで); πλὴν τῶν ἁμαρτιῶν αὐτοῦ — сверх грехов его; ὧν ἐξήμαρτεν τὸν Ιουδαν — которыми он ввёл Иуду в грех."
  17: "τὰ λοιπὰ τῶν λόγων Μανασση — прочее слов Манассии; ἡ ἁμαρτία αὐτοῦ, ἣν ἥμαρτεν — грех его, которым он согрешил; βιβλίον λόγων τῶν ἡμερῶν — «книга слов дней», летопись (日誌の書); οὐχὶ ταῦτα γεγραμμένα — «не это ли записано»."
  18: "ἐκοιμήθη μετὰ τῶν πατέρων — почил с отцами; ἐτάφη ἐν τῷ κήπῳ τοῦ οἴκου αὐτοῦ — погребён в саду при доме своём (κῆπος — сад, 庭); ἐν κήπῳ Οζα — в саду Уззы (ウザ; в слав. «вертоград озы»); Αμων — Амон (アモン)."
  19: "Υἱὸς εἴκοσι καὶ δύο ἐτῶν — двадцати двух лет; Μεσολλαμ — Мешуллемеф (слав. «месоллам», ru «Мешуллемеф»), в тексте メソラム по гр; θυγάτηρ Αρους — дочь Харуца (ハルス; слав. «арусова»); ἐξ Ιετεβα — из Ятбы (イテバ; слав. «из иетевы»)."
  20: "καθὼς ἐποίησεν Μανασσης ὁ πατὴρ αὐτοῦ — как сделал Манассия, отец его. Стих обрывается запятой, продолжение — в 21."
  21: "ἐπορεύθη ἐν πάσῃ ὁδῷ, ᾗ ἐπορεύθη — ходил всем путём, которым ходил; ἐλάτρευσεν τοῖς εἰδώλοις — служил идолам (λατρεύω); προσεκύνησεν αὐτοῖς — поклонился им (προσκυνέω)."
  22: "ἐγκατέλιπεν — оставил (ἐγκαταλείπω); τὸν κύριον θεὸν τῶν πατέρων αὐτοῦ — Господа, Бога отцов своих; οὐκ ἐπορεύθη ἐν ὁδῷ κυρίου — не ходил путём Господним."
  23: "συνεστράφησαν — составили заговор (συστρέφω; слав. «восташа» — иное понимание); οἱ παῖδες Αμων — слуги Аммона (家来たち); ἐθανάτωσαν — умертвили (θανατόω); ἐν τῷ οἴκῳ αὐτοῦ — в доме его (царя)."
  24: "ἐπάταξεν πᾶς ὁ λαὸς τῆς γῆς — поразил весь народ земли (πατάσσω); τοὺς συστραφέντας ἐπὶ τὸν βασιλέα — составивших заговор против царя; ἐβασίλευσεν ὁ λαὸς … τὸν Ιωσιαν — «воцарил народ… Иосию» (ヨシヤ); ἀντ αὐτοῦ — вместо него."
  25: "τὰ λοιπὰ τῶν λόγων Αμων — прочее слов Аммона; ὅσα ἐποίησεν — всё, что он сделал; οὐκ ἰδοὺ ταῦτα — «не вот ли это»."
  26: "ἔθαψαν αὐτὸν ἐν τῷ τάφῳ αὐτοῦ — погребли его в гробнице его; ἐν τῷ κήπῳ Οζα — в саду Уззы; Ιωσιας υἱὸς αὐτοῦ — Иосия, сын его; ἀντ αὐτοῦ — вместо него."
