verses:
  0: "指揮者[しきしゃ]に。コラの子[こ]らのための教[おし]えの詩[うた]。"
  1: "神[かみ]よ、わたしたちは自分[じぶん]たちの耳[みみ]で聞[き]いた。わたしたちの父[ちち]たちが、あなたが彼[かれ]らの日[ひ]に、昔[むかし]の日[ひ]に行[おこな]われたみわざを、わたしたちに告[つ]げてくれたのだ。"
  2: "あなたの手[て]は諸国[しょこく]の民[たみ]を滅[ほろ]ぼし、彼[かれ]らを植[う]えられた。あなたはもろもろの民[たみ]を苦[くる]しめ、彼[かれ]らを追[お]い出[だ]された。"
  3: "彼[かれ]らが地[ち]を得[え]たのは、自分[じぶん]たちの剣[つるぎ]によるのではない。彼[かれ]らを救[すく]ったのは、自分[じぶん]たちの腕[うで]ではない。あなたの右[みぎ]の手[て]、あなたの腕[うで]、あなたの顔[かお]の光[ひかり]によるのだ。あなたが彼[かれ]らを喜[よろこ]ばれたからである。"
  4: "あなたこそ、わたしの王[おう]、わたしの神[かみ]。あなたはヤコブに救[すく]いを命[めい]じられる。"
  5: "あなたによって、わたしたちは敵[てき]を角[つの]で突[つ]き倒[たお]し、あなたの名[な]によって、わたしたちに立[た]ち向[む]かう者[もの]を踏[ふ]みにじる。"
  6: "わたしは自分[じぶん]の弓[ゆみ]に寄[よ]り頼[たの]まない。わたしの剣[つるぎ]も、わたしを救[すく]いはしない。"
  7: "あなたこそ、わたしたちを苦[くる]しめる者[もの]から救[すく]い、わたしたちを憎[にく]む者[もの]を辱[はずかし]められた。"
  8: "わたしたちは一日中[いちにちじゅう]神[かみ]を誇[ほこ]りとし、とこしえにあなたの名[な]をほめたたえる。"
  9: "ところが、今[いま]あなたはわたしたちを退[しりぞ]け、辱[はずかし]められた。あなたはわたしたちの軍勢[ぐんぜい]とともに行[ゆ]かれない。"
  10: "あなたはわたしたちを敵[てき]の前[まえ]から後[うし]ろへ退[しりぞ]かせられた。わたしたちを憎[にく]む者[もの]は思[おも]うままに奪[うば]い去[さ]った。"
  11: "あなたはわたしたちを、食[た]べられる羊[ひつじ]のように渡[わた]し、諸国[しょこく]の民[たみ]の間[あいだ]に散[ち]らされた。"
  12: "あなたはご自分[じぶん]の民[たみ]を値[ね]もなく売[う]り、その代価[だいか]を高[たか]くされなかった。"
  13: "あなたはわたしたちを隣[となり]の人[ひと]々[びと]のそしりとし、わたしたちの周[まわ]りにいる者[もの]の嘲[あざけ]りと笑[わら]い草[ぐさ]とされた。"
  14: "あなたはわたしたちを諸国[しょこく]の民[たみ]の間[あいだ]の諺[ことわざ]とし、もろもろの民[たみ]の首[くび]振[ふ]りとされた。"
  15: "わたしの恥[はじ]は一日中[いちにちじゅう]わたしの前[まえ]にあり、わたしの顔[かお]の恥[は]ずかしさがわたしを覆[おお]っている。"
  16: "そしる者[もの]とののしる者[もの]の声[こえ]のゆえに、敵[てき]と迫[せま]る者[もの]の顔[かお]のゆえに。"
  17: "これらすべてがわたしたちに降[ふ]りかかったのに、わたしたちはあなたを忘[わす]れず、あなたの契約[けいやく]に背[そむ]かなかった。"
  18: "わたしたちの心[こころ]は後[うし]ろへ退[しりぞ]かず、わたしたちの足[あし]はあなたの道[みち]からそれなかった。"
  19: "あなたはわたしたちを苦[くる]しみの場[ば]で低[ひく]くされ、死[し]の影[かげ]がわたしたちを覆[おお]った。"
  20: "もし、わたしたちが自分[じぶん]たちの神[かみ]の名[な]を忘[わす]れ、手[て]を伸[の]べて他[ほか]の神[かみ]に向[む]けたのなら、"
  21: "神[かみ]がこれを問[と]いたださないはずがない。神[かみ]は心[こころ]の隠[かく]れた事[こと]を知[し]っておられるからである。"
  22: "あなたのゆえに、わたしたちは一日中[いちにちじゅう]殺[ころ]され、屠[ほふ]られる羊[ひつじ]のように見[み]なされた。"
  23: "目[め]を覚[さ]ましてください。主[しゅ]よ、なぜ眠[ねむ]っておられるのか。立[た]ち上[あ]がってください。とこしえに退[しりぞ]けられないでください。"
  24: "なぜ、あなたは顔[かお]をそむけ、わたしたちの貧[まず]しさと苦[くる]しみを忘[わす]れられるのか。"
  25: "わたしたちの魂[たましい]は塵[ちり]にまで低[ひく]くされ、わたしたちの腹[はら]は地[ち]に貼[は]りついている。"
  26: "立[た]ち上[あ]がってください、主[しゅ]よ。わたしたちを助[たす]け、あなたの名[な]のゆえにわたしたちを贖[あがな]ってください。"

notes:
  0: "Εἰς τὸ τέλος· τοῖς υἱοῖς Κορε εἰς σύνεσιν ψαλμός — 指揮者に。コラの子らのための教えの詩 (εἰς τὸ τέλος — «в конец», в церковнослав. «В конец», т. е. для исполнения в собрании; 指揮者 — как в Пс 4–6. τοῖς υἱοῖς Κορε — «сынам Кореевым», コラの子ら. εἰς σύνεσιν — «в разум», для вразумления; передано 教え, как рус. «Учение» в базе. Надписание — стих 0, скобками не маркируется.)"
  1: "Ὁ θεός, ἐν τοῖς ὠσὶν ἡμῶν ἠκούσαμεν — 神よ、わたしたちは自分たちの耳で聞いた (ἐν τοῖς ὠσίν — «ушами», усиление; обращение Ὁ θεός передано звательным 神よ). οἱ πατέρες ἡμῶν ἀνήγγειλαν ἡμῖν — わたしたちの父たちが…告げてくれた (ἀναγγέλλω — «возвещать»). ἔργον, ὃ εἰργάσω ἐν ταῖς ἡμέραις αὐτῶν, ἐν ἡμέραις ἀρχαίαις — あなたが彼らの日に、昔の日に…行われたみわざ (ἀρχαῖος — «древний»; порядок членов сохранён)."
  2: "ἡ χείρ σου ἔθνη ἐξωλέθρευσεν — あなたの手は諸国の民を滅ぼし (ἐξολοθρεύω — «истреблять»). καὶ κατεφύτευσας αὐτούς — 彼らを植えられた (φυτεύω — «насаждать»; αὐτούς — отцы, ср. Исх 15:17). ἐκάκωσας λαοὺς καὶ ἐξέβαλες αὐτούς — もろもろの民を苦しめ、彼らを追い出された (κακόω — «озлоблять, угнетать»)."
  3: "οὐ γὰρ ἐν τῇ ῥομφαίᾳ αὐτῶν ἐκληρονόμησαν γῆν — 彼らが地を得たのは、自分たちの剣によるのではない (ῥομφαία — 剣; κληρονομέω — «получать в наследие»). ὁ βραχίων αὐτῶν οὐκ ἔσωσεν αὐτούς — 彼らを救ったのは自分たちの腕ではない (βραχίων — 腕). ἡ δεξιά σου καὶ ὁ βραχίων σου καὶ ὁ φωτισμὸς τοῦ προσώπου σου — あなたの右の手、あなたの腕、あなたの顔の光 (φωτισμός — «озарение»). ὅτι εὐδόκησας ἐν αὐτοῖς — あなたが彼らを喜ばれたからである (εὐδοκέω — «благоволить»)."
  4: "σὺ εἶ αὐτὸς ὁ βασιλεύς μου καὶ ὁ θεός μου — あなたこそ、わたしの王、わたしの神 (звательного в греч. нет, поэтому 神よ не добавлено). ὁ ἐντελλόμενος τὰς σωτηρίας Ιακωβ — ヤコブに救いを命じられる方 (ἐντέλλομαι — «заповедывать»; σωτηρίαι мн. — «спасения»)."
  5: "ἐν σοὶ τοὺς ἐχθροὺς ἡμῶν κερατιοῦμεν — あなたによって、わたしたちは敵を角で突き倒し (κερατίζω — «бодать», образ рога, ср. Втор 33:17). ἐν τῷ ὀνόματί σου ἐξουθενώσομεν — あなたの名によって…踏みにじる (ἐξουθενέω — «уничижать, попирать»)."
  6: "οὐ γὰρ ἐπὶ τῷ τόξῳ μου ἐλπιῶ — わたしは自分の弓に寄り頼まない (τόξον — 弓; ἐλπίζω ἐπί — «надеяться на»). ἡ ῥομφαία μου οὐ σώσει με — わたしの剣も、わたしを救いはしない."
  7: "ἔσωσας γὰρ ἡμᾶς ἐκ τῶν θλιβόντων ἡμᾶς — あなたこそ、わたしたちを苦しめる者から救い (θλίβω — «теснить»; аорист, поэтому прошедшее). τοὺς μισοῦντας ἡμᾶς κατῄσχυνας — わたしたちを憎む者を辱められた (καταισχύνω — «посрамлять»)."
  8: "ἐν τῷ θεῷ ἐπαινεσθησόμεθα ὅλην τὴν ἡμέραν — わたしたちは一日中神を誇りとし (ἐπαινέομαι здесь в знач. «хвалиться», ср. jp-joc «己の譽となし»). ἐν τῷ ὀνόματί σου ἐξομολογησόμεθα εἰς τὸν αἰῶνα — とこしえにあなたの名をほめたたえる (ἐξομολογέομαι — «славить, исповедовать»). διάψαλμα в конце стиха не передаётся."
  9: "νυνὶ δὲ ἀπώσω καὶ κατῄσχυνας ἡμᾶς — ところが、今あなたはわたしたちを退け、辱められた (ἀπωθέω — «отталкивать, отвергать»). οὐκ ἐξελεύσῃ ἐν ταῖς δυνάμεσιν ἡμῶν — あなたはわたしたちの軍勢とともに行かれない (δυνάμεις — «силы, войска»)."
  10: "ἀπέστρεψας ἡμᾶς εἰς τὰ ὀπίσω παρὰ τοὺς ἐχθροὺς ἡμῶν — あなたはわたしたちを敵の前から後ろへ退かせられた (ἀποστρέφω — «поворачивать назад»). οἱ μισοῦντες ἡμᾶς διήρπαζον ἑαυτοῖς — 憎む者は思うままに奪い去った (διαρπάζω — «расхищать»; ἑαυτοῖς — «себе»)."
  11: "ἔδωκας ἡμᾶς ὡς πρόβατα βρώσεως — あなたはわたしたちを、食べられる羊のように渡し (βρῶσις — «снедь»). ἐν τοῖς ἔθνεσιν διέσπειρας ἡμᾶς — 諸国の民の間に散らされた (διασπείρω — «рассеивать»)."
  12: "ἀπέδου τὸν λαόν σου ἄνευ τιμῆς — あなたはご自分の民を値もなく売り (ἀποδίδωμι — «продавать»; ἄνευ τιμῆς — «без цены»). οὐκ ἦν πλῆθος ἐν τοῖς ἀλλάγμασιν αὐτῶν — その代価を高くされなかった (ἄλλαγμα — «мена, выкуп»; евр. «не набавил цены»)."
  13: "ἔθου ἡμᾶς ὄνειδος τοῖς γείτοσιν ἡμῶν — 隣の人々のそしりとし (ὄνειδος — «поношение»). μυκτηρισμὸν καὶ καταγέλωτα τοῖς κύκλῳ ἡμῶν — 周りにいる者の嘲りと物笑いとされた (μυκτηρισμός — «издевка»; κατάγελως — «посмешище»)."
  14: "ἔθου ἡμᾶς εἰς παραβολὴν ἐν τοῖς ἔθνεσιν — 諸国の民の間の諺とし (παραβολή здесь — «притча, поговорка», ср. Синодальный «притчею»). κίνησιν κεφαλῆς ἐν τοῖς λαοῖς — もろもろの民の首振りとされた (образ глумления)."
  15: "ὅλην τὴν ἡμέραν ἡ ἐντροπή μου κατεναντίον μού ἐστιν — わたしの恥は一日中わたしの前にある (ἐντροπή — «стыд, срам»). ἡ αἰσχύνη τοῦ προσώπου μου ἐκάλυψέν με — わたしの顔の恥ずかしさがわたしを覆っている (αἰσχύνη — «стыд»; два разных слова переданы 恥 и 辱, параллелизм сохранён)."
  16: "ἀπὸ φωνῆς ὀνειδίζοντος καὶ παραλαλοῦντος — そしる者とののしる者の声のゆえに (ὀνειδίζω — «поносить»; παραλαλέω — «злословить, пустословить»). ἀπὸ προσώπου ἐχθροῦ καὶ ἐκδιώκοντος — 敵と迫る者の顔のゆえに (ἐκδιώκω — «гнать»)."
  17: "ταῦτα πάντα ἦλθεν ἐφ᾿ ἡμᾶς — これらすべてがわたしたちに降りかかったのに (ἦλθεν — аорист, «пришло»). οὐκ ἐπελαθόμεθά σου — あなたを忘れず (ἐπιλανθάνομαι — «забывать»). οὐκ ἠδικήσαμεν ἐν διαθήκῃ σου — あなたの契約に背かなかった (ἀδικέω ἐν — «поступать неверно в отношении»)."
  18: "οὐκ ἀπέστη εἰς τὰ ὀπίσω ἡ καρδία ἡμῶν — わたしたちの心は後ろへ退かず (ἀφίστημι — «отступать»). ἐξέκλινας τὰς τρίβους ἡμῶν ἀπὸ τῆς ὁδοῦ σου — わたしたちの足はあなたの道からそれなかった (в греч. 2 л. ед. «ты уклонил», но по параллелизму с ст. 17 и по jp-joc — «наши стопы не уклонились»; смысл не изменён, разночтение отмечено здесь же)."
  19: "ἐταπείνωσας ἡμᾶς ἐν τόπῳ κακώσεως — あなたはわたしたちを苦しみの場で低くされ (τόπος κακώσεως — «место озлобления»; κακώω, как в ст. 2). ἐπεκάλυψεν ἡμᾶς σκιὰ θανάτου — 死の影がわたしたちを覆った (σκιὰ θανάτου — ср. Пс 22:4)."
  20: "εἰ ἐπελαθόμεθα τοῦ ὀνόματος τοῦ θεοῦ ἡμῶν — もし、わたしたちが自分たちの神の名を忘れ (εἰ + аорист — «если бы забыли»). διεπετάσαμεν χεῖρας ἡμῶν πρὸς θεὸν ἀλλότριον — 手を伸べて他の神に向けたのなら (διαπετάννυμι — «простирать»; θεὸς ἀλλότριος — «чужой бог»)."
  21: "οὐχὶ ὁ θεὸς ἐκζητήσει ταῦτα — 神がこれを問いたださないはずがない (ἐκζητέω — «взыскивать, требовать отчёта»; вопрос с οὐχί, ожидающий утверждения). αὐτὸς γὰρ γινώσκει τὰ κρύφια τῆς καρδίας — 神は心の隠れた事を知っておられる (κρύφιος — «сокровенный»)."
  22: "ἕνεκα σοῦ θανατούμεθα ὅλην τὴν ἡμέραν — あなたのゆえに、わたしたちは一日中殺され. ἐλογίσθημεν ὡς πρόβατα σφαγῆς — 屠られる羊のように見なされた (λογίζομαι — «быть сочтённым»; σφαγή — «заклание»). Стих цитируется в Рим 8:36 — формулировка согласована с rim_08."
  23: "ἐξεγέρθητι· ἵνα τί ὑπνοῖς, κύριε — 目を覚ましてください。主よ、なぜ眠っておられるのか (ἐξεγείρω — «пробуждать»; ὑπνόω — «спать»). ἀνάστηθι — 立ち上がってください. μὴ ἀπώσῃ εἰς τέλος — とこしえに退けられないでください (ἀπωθέω, как в ст. 9; εἰς τέλος — «до конца»)."
  24: "ἵνα τί τὸ πρόσωπόν σου ἀποστρέφεις — なぜ、あなたは顔をそむけ (ἀποστρέφω). ἐπιλανθάνῃ τῆς πτωχείας ἡμῶν καὶ τῆς θλίψεως ἡμῶν — わたしたちの貧しさと苦しみを忘れられるのか (πτωχεία — «бедность»; θλῖψις — 苦しみ)."
  25: "ἐταπεινώθη εἰς χοῦν ἡ ψυχὴ ἡμῶν — わたしたちの魂は塵にまで低くされ (χοῦς — 塵; ταπεινόω — «смирять»). ἐκολλήθη εἰς γῆν ἡ γαστὴρ ἡμῶν — わたしたちの腹は地に貼りついている (κολλάω — «прилепляться»; γαστήρ — «живот, чрево»)."
  26: "ἀνάστα, κύριε, βοήθησον ἡμῖν — 立ち上がってください、主よ、わたしたちを助け (βοηθέω — «помогать»). λύτρωσαι ἡμᾶς ἕνεκεν τοῦ ὀνόματός σου — あなたの名のゆえに、わたしたちを贖ってください (λυτρόω — 贖う; у jp-joc «по милости Твоей» — иное чтение, в базе ὀνόματός σου)."
