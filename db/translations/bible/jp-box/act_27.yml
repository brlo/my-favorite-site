# jp-box, Деяния святых апостолов, глава 27. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 27: плавание в Италию (1–8), пост и предупреждение Павла (9–12),
# буря и крушение (13–26), 14-й день и спасение на землю (27–44).
# Красного нет ни в одном стихе: речи Павла (10, 21–26, 31, 33–34), слова
# ангела (23–24), моряков, Юлия и воинов — вне тегов.
# Сноска ⟨…⟩: 尋 (27:28) — морская мера, современному читателю неочевидна.

