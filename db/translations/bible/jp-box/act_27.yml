verses:
  1: "わたしたちがイタリアへ船出[ふなで]することに決[き]まると、パウロとほかにも数人[すうにん]の囚人[しゅうじん]が、皇帝直属[ちょくぞく]の部隊[ぶたい]の百人隊長[ひゃくにんたいちょう]ユリオという者[もの]に引[ひ]き渡[わた]された。"
  2: "わたしたちは、アジアの沿岸[えんがん]の地方[ちほう]へ向[む]かうアドラミティオンの船[ふね]に乗[の]り込[こ]んで出航[しゅっこう]した。マケドニア人[じん]でテサロニケのアリスタルコも、わたしたちと一緒[いっしょ]にいた。"
  3: "翌日[よくじつ]、わたしたちはシドンに着[つ]いた。ユリオはパウロを親切[しんせつ]に扱[あつか]い、友人[ゆうじん]たちのところへ行[い]って世話[せわ]を受[う]けることを許[ゆる]した。"
  4: "そこから船出[ふなで]したが、風[かぜ]が逆[さか]らっていたので、キプロスの風下[かざしも]を航海[こうかい]した。"
  5: "キリキアとパムフィリアの沖[おき]の海[うみ]を渡[わた]って、リキアのミラに着[つ]いた。"
  6: "そこで百人隊長[ひゃくにんたいちょう]は、イタリアへ向[む]かうアレクサンドリアの船[ふね]を見[み]つけて、わたしたちをそれに乗[の]り込[こ]ませた。"
  7: "多[た]くの日[ひ]をかけてゆっくり航海[こうかい]し、やっとのことでクニドの沖[おき]まで来[き]たが、風[かぜ]がわたしたちを許[ゆる]さなかったので、クレタの風下[かざしも]をサルモネに沿[そ]って進[すす]んだ。"
  8: "そして、ようやくその岸[きし]に沿[そ]って進[すす]み、良[よ]い港[みなと]と呼[よ]ばれる所[ところ]に着[つ]いた。そこにはラセアという町[まち]が近[ちか]かった。"
  9: "かなりの時[とき]が過[す]ぎ、断食[だんじき]の日[ひ]もすでに過[す]ぎていたので、航海[こうかい]はすでに危[あぶ]なくなっていた。そこでパウロは彼[かれ]らに勧[すす]めて言[い]った。"
  10: "「皆[みな]さん、わたしが見[み]るところでは、この航海[こうかい]は、積[つ]み荷[に]と船[ふね]だけでなく、わたしたちの命[いのち]にも、災難[さいなん]と大[おお]きな損害[そんがい]をもたらすことになる。」"
  11: "しかし、百人隊長[ひゃくにんたいちょう]は、パウロが言[い]ったことよりも、操舵手[そうだしゅ]と船主[ふなおさ]の言葉[ことば]を信[しん]じた。"
  12: "その港[みなと]は冬[ふゆ]を越[こ]すのに適[てき]していなかったので、大[だい]多数[たすう]の者[もの]たちは、何[なん]とかしてフェニクスへ行[い]き、そこで冬[ふゆ]を越[こ]そうと決[き]めた。フェニクスはクレタの港[みなと]で、南西[なんせい]と北西[ほくせい]の方角[ほうがく]を向[む]いていた。"
  13: "南風[みなみかぜ]がそっと吹[ふ]き始[はじ]めると、彼[かれ]らはもくろみがかなったと思[おも]って、錨[いかり]を上[あ]げ、クレタの岸[きし]に沿[そ]って航海[こうかい]した。"
  14: "しかし、間[ま]もなく、エウロクロンと呼[よ]ばれる暴風[ぼうふう]が吹[ふ]き下[お]ろしてきた。"
  15: "船[ふね]は吹[ふ]き流[なが]され、風[かぜ]に逆[さか]らうことができなくなったので、わたしたちはなすがままに任[まか]せた。"
  16: "カウダと呼[よ]ばれる小島[こじま]の風下[かざしも]に逃[に]げ込[こ]んで、わたしたちはやっとのことで小舟[こぶね]を引[ひ]き上[あ]げ、押[おさ]えることができた。"
  17: "それを引[ひ]き上[あ]げると、船[ふね]を綱[つな]で締[し]め固[かた]めるなど、あらゆる手[て]を尽[つ]くした。そして、浅灘[あさせ]に乗[の]り上[あ]げることを恐[おそ]れて、帆[ほ]を下[お]ろしたまま流[なが]れに任[まか]せた。"
  18: "嵐[あらし]が激[はげ]しく吹[ふ]き荒[あ]れたので、翌日[よくじつ]には積[つ]み荷[に]を海[うみ]へ投[な]げ捨[す]てた。"
  19: "三[みっ]日[か]目[め]には、わたしたち自身[じしん]の手[て]で船具[ふなぐ]を投[な]げ捨[す]てた。"
  20: "長[なが]い間[あいだ]、太陽[たいよう]も星[ほし]も現[あらわ]れず、嵐[あらし]は激[はげ]しく続[つづ]いたので、わたしたちが助[たす]かる望[のぞ]みは、ついになくなってしまった。"
  21: "人々[ひとびと]は長[なが]い間[あいだ]何[なに]も食[た]べていなかった。そこで、パウロは彼[かれ]らの真[ま]ん中[なか]に立[た]って言[い]った。「皆[みな]さん、あなたがたはわたしの言[い]うことを聞[き]入[い]れて、クレタから船出[ふなで]するべきではなかったのだ。そうすれば、この災難[さいなん]と損害[そんがい]は免[まぬか]れたはずである。"
  22: "しかし今[いま]、わたしはあなたがたに、元気[げんき]を出[だ]すように勧[すす]める。あなたがたのうち、だれも命[いのち]を失[うしな]う者[もの]はいない。ただ、船[ふね]だけが失[うしな]われる。"
  23: "昨夜[ゆうべ]、わたしが属[ぞく]し、また仕[つか]えている神[かみ]の天使[てんし]が、わたしのそばに立[た]って言[い]った。"
  24: "『パウロ、恐[おそ]れるな。あなたはカエサルの前[まえ]に立[た]たなければならない。見[み]よ、神[かみ]は、あなたと一緒[いっしょ]に航海[こうかい]している者[もの]たちを、すべてあなたに与[あた]えてくださった。』"
  25: "だから、皆[みな]さん、元気[げんき]を出[だ]すがよい。わたしは神[かみ]を信[しん]じている。わたしに語[かた]られたとおりになるからである。"
  26: "しかし、わたしたちはどこかの島[しま]に打[う]ち上[あ]げられなければならない。」"
  27: "十四日[じゅうよっか]目[め]の夜[よる]、わたしたちがアドリア海[かい]を漂[ただよ]っていると、真夜中[まよなか]ごろ、船人[ふなびと]たちはどこかの陸地[りくち]に近[ちか]づいているのではないかと思[おも]った。"
  28: "そこで深[ふか]さを測[はか]ると二十尋[にじゅうひろ]⟨一尋[ひろ]は約[やく]一[いっ]・八[はち]メートル。⟩、しばらく進[すす]んでまた測[はか]ると十五尋[じゅうごひろ]であった。"
  29: "岩[いわ]だらけの所[ところ]に乗[の]り上[あ]げることを恐[おそ]れて、船尾[せんび]から四[よっ]つの錨[いかり]を投[な]げ下[お]ろし、夜[よる]が明[あ]けるのを待[ま]った。"
  30: "しかし、船人[ふなびと]たちは船[ふね]から逃[に]げようとして、船首[せんしゅ]から錨[いかり]を下[お]ろすふりをしながら、小舟[こぶね]を海[うみ]へ下[お]ろそうとした。"
  31: "そのとき、パウロは百人隊長[ひゃくにんたいちょう]と兵士[へいし]たちに言[い]った。「この者[もの]たちが船[ふね]に残[のこ]らなければ、あなたがたは助[たす]かることはできない。」"
  32: "そこで兵士[へいし]たちは、小舟[こぶね]の綱[つな]を切[き]り、小舟[こぶね]を流[なが]れ去[さ]らせた。"
  33: "夜[よる]が明[あ]けようとするころ、パウロはすべての人[ひと]に食[た]べ物[もの]を取[と]るように勧[すす]めて言[い]った。「今日[きょう]で十四日[じゅうよっか]、あなたがたは何[なに]も食[た]べずに待[ま]ち続[つづ]けている。"
  34: "だから、わたしはあなたがたに、食[た]べ物[もの]を取[と]るように勧[すす]める。それはあなたがたの救[すく]いのためになる。あなたがたのだれも、頭[あたま]から髪[かみ]の毛[け]一[いっ]本[ぽん]も失[うしな]うことはないからである。」"
  35: "こう言[い]ってから、パウロはパンを取[と]り、すべての人[ひと]の前[まえ]で神[かみ]に感謝[かんしゃ]し、それを裂[さ]いて食[た]べ始[はじ]めた。"
  36: "すると、皆[みな]も元気[げんき]を取[と]り戻[もど]し、自分[じぶん]たちも食[た]べ物[もの]を取[と]った。"
  37: "船[ふね]に乗[の]り合[あ]わせていたわたしたちは、全部[ぜんぶ]で二百七十六人[にひゃくななじゅうろくにん]であった。"
  38: "食[た]べ物[もの]を十分[じゅうぶん]に取[と]って腹[はら]が満[み]ちると、彼[かれ]らは麦[むぎ]を海[うみ]へ投[な]げ捨[す]てて、船[ふね]を軽[かる]くした。"
  39: "夜[よる]が明[あ]けると、彼[かれ]らはその陸地[りくち]がどこか分[わ]からなかったが、砂浜[すなはま]のある入[い]り江[え]が見[み]えたので、できればそこへ船[ふね]を着[つ]けようと相談[そうだん]した。"
  40: "そこで彼[かれ]らは錨[いかり]を切[き]り離[はな]して海[うみ]に捨[す]て、同時[どうじ]に舵[かじ]の綱[つな]をゆるめ、船首[せんしゅ]の帆[ほ]を風[かぜ]に上[あ]げて、砂浜[すなはま]を目指[めざ]して進[すす]んだ。"
  41: "しかし、二[ふた]つの海[うみ]が出会[であ]う所[ところ]に突[つ]き当[あ]たり、船[ふね]を浅瀬[あさせ]に乗[の]り上[あ]げてしまった。船首[せんしゅ]は食[く]い込[こ]んだまま動[うご]かなくなったが、船尾[せんび]は波[なみ]の力[ちから]で壊[こわ]れ始[はじ]めた。"
  42: "兵士[へいし]たちは、囚人[しゅうじん]たちが泳[およ]いで逃[に]げないように、彼[かれ]らを殺[ころ]そうと相談[そうだん]した。"
  43: "しかし、百人隊長[ひゃくにんたいちょう]はパウロを助[たす]けたいと思[おも]い、彼[かれ]らの計画[けいかく]を阻[はば]んだ。そして、泳[およ]げる者[もの]たちに、まず海[うみ]に飛[と]び込[こ]んで陸[りく]へ上[あ]がるように命[めい]じ、"
  44: "残[のこ]りの者[もの]たちには、板[いた]や船[ふね]の一部[いちぶ]に乗[の]って行[い]くように命[めい]じた。こうして、すべての者[もの]が無事[ぶじ]に陸[りく]へ上[あ]がった。"

notes:
  1: "σπεῖρα Σεβαστή — «Августова когорта», т.е. отряд, подчинённый императору; 皇帝直属の部隊. ἑκατοντάρχης — 百人隊長."
  3: "φιλανθρώπως … ἐπιμελείας τυχεῖν — «человеколюбиво … получить попечение»; 親切に扱い…世話を受ける."
  9: "νηστεία — пост (иудейский День очищения); 断食の日. С этого времени плавание в Средиземном море считалось опасным."
  11: "κυβερνήτης — кормчий; 操舵手. ναύκληρος — судовладелец; 船主."
  12: "Φοίνιξ — フェニクス; λίβα и χῶρον — юго-запад и северо-запад; 南西と北西."
  14: "Εὐρακύλων — греч. передача лат. Euroaquilo, северо-восточный ветер; エウロクロン (у jp-joc エウロクリドン)."
  16: "Καῦδα — カウダ (у jp-joc クラウダ); σκάφη — лодка; 小舟."
  17: "ὑποζωννύντες — «подвязывая», обвязывая корпус канатами; 綱で締め固める. Σύρτις — シュルテス, отмель у берегов Африки; 浅灘. σκεῦος — снасть, парус; 帆."
  19: "σκευή — корабельное снаряжение; 船具. αὐτόχειρες — «своими руками»; 自分たち自身の手で."
  21: "ὕβρις — «насилие, бедствие»; 損害 (у jp-joc 困難)."
  28: "ὀργυιά — морская сажень, около 1,8 м; 尋. Сноска при первом упоминании."
  33: "Τεσσαρεσκαιδεκάτην … ἡμέραν — «четырнадцатый день»; 十四日目."
  37: "διακόσιαι ἑβδομήκοντα ἕξ — 276 душ; 二百七十六人."
  41: "διθάλασσον — «двуморное» место, где встречаются два течения; 二つの海が出会う所."
