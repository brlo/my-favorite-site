verses:
  1: "「すべてのものの主[ぬし]である神[かみ]よ、わたしたちをあわれみ、目[め]を留[と]めて、あなたへの恐[おそ]れをすべての国々[くにぐに]の上[うえ]に置[お]いてください。"
  2: "あなたの手[て]をほかの民[たみ]の上[うえ]に上[あ]げ、彼らがあなたの権力[けんりょく]を見[み]るようにしてください。"
  3: "彼らの前[まえ]であなたがわたしたちのうちで聖[せい]とされたように、わたしたちの前[まえ]で、彼らのうちにあって大[おお]きくされますように。"
  4: "彼らがあなたを知[し]りますように。ちょうど、わたしたちが、主[しゅ]よ、あなたのほかに神[かみ]はいないと知[し]ったように。"
  5: "しるしを新[あら]たにし、驚[おどろ]くべきわざを変[か]えてください。右[みぎ]の手[て]と腕[うで]を輝[かがや]かせてください。"
  6: "怒[いか]りを起[おこ]し、憤[いきどお]りを注[そそ]ぎ、敵対[てきたい]する者[もの]を取[と]り除[のぞ]き、敵[てき]を滅[ほろ]ぼしてください。"
  7: "時[とき]を急[いそ]ぎ、誓[ちか]いを思[おも]い起[おこ]してください。そうして、あなたの大[おお]いなるわざが語[かた]り伝[つた]えられますように。"
  8: "救[すく]われようとする者[もの]も、火[ひ]の怒[いか]りによって食[く]い尽[つ]くされるように。あなたの民[たみ]を害[がい]する者[もの]たちが滅[ほろ]びを見[み]いだしますように。"
  9: "敵[てき]の支配者[しはいしゃ]たちの頭[あたま]を砕[くだ]いてください。彼らは『わたしたちのほかに、だれもいない』と言[い]っているからです。"
  10: "ヤコブのすべての部族[ぶぞく]を集[あつ]め、初[はじ]めからのように彼らを嗣業[しぎょう]として与[あた]えてください。"
  11: "主[しゅ]よ、あなたの名[な]によって呼[よ]ばれている民[たみ]をあわれみ、あなたが初子[ういご]のように似[に]せられたイスラエルをあわれんでください。"
  12: "あなたの聖所[せいしょ]である都[みやこ]、エルサレム、あなたの憩[いこ]いの場[ば]をあわれんでください。"
  13: "シオンをあなたの力[ちから]あるわざの語[かた]りで満[み]たし、あなたの栄光[えいこう]であなたの民[たみ]を満たしてください。"
  14: "初[はじ]めに造[つく]られたものたちに証[あかし]を与[あた]え、あなたの名[な]による預言[よげん]を起[おこ]してください。"
  15: "あなたを待[ま]ち望[のぞ]む者[もの]に報[むく]いを与[あた]え、あなたの預言者[よげんしゃ]たちが真実[しんじつ]な者[もの]と認[みと]められますように。"
  16: "主[しゅ]よ、あなたに嘆願[たんがん]する者[もの]たちの願いを、あなたの民[たみ]のためのアロンの祝福[しゅくふく]にしたがって聞[き]いてください。"
  17: "そうして、地[ち]の上[うえ]のすべての者[もの]が、主[しゅ]こそ世々[よよ]の神[かみ]であることを知[し]りますように。」"
  18: "どんな食物[しょくもつ]でも腹[はら]は食[た]べる。しかし、食物には食物より良[よ]いものがある。"
  19: "喉[のど]は狩[か]りの獲物[えもの]を味[あじ]わう。同[おな]じように、悟[さと]りのある心[こころ]は偽[いつわ]りの言葉[ことば]を味わう。"
  20: "曲[ま]がった心[こころ]は悲[かな]しみを与[あた]え、経験[けいけん]を積[つ]んだ人[ひと]はその者[もの]に報[むく]いを返[かえ]す。"
  21: "女[おんな]はどの男[おとこ]でも受[う]け入[い]れる。しかし、ある娘[むすめ]は別[べつ]の娘よりも良[よ]い。"
  22: "女[おんな]の美[うつく]しさは顔[かお]を明[あか]るくし、人[ひと]のどんな望[のぞ]みよりも勝[まさ]っている。"
  23: "その舌[した]に慈[いつく]しみと柔和[にゅうわ]があれば、その夫[おっと]は人[ひと]の子[こ]らの中[なか]でも並[なら]ぶ者がない。"
  24: "妻[つま]を得[え]る者[もの]は財産[ざいさん]を得ることの始[はじ]めをする。それは彼にふさわしい助[たす]け手[て]であり、憩[いこ]いの柱[はしら]である。"
  25: "囲[かこ]いのない所[ところ]では財産[ざいさん]が奪[うば]われる。妻[つま]のない所では、さまよう者[もの]が嘆[なげ]く。"
  26: "武装[ぶそう]した盗賊[とうぞく]が、町[まち]から町へと渡[わた]り歩[ある]くのを、だれが信[しん]じるだろうか。"
  27: "同[おな]じように、巣[す]を持[た]ず、夕[ゆう]べを迎[むか]える所[ところ]に宿[やど]る人[ひと]も、そうである。"

notes:
  1: "Ἐλέησον ἡμᾶς, δέσποτα ὁ θεὸς πάντων — «помилуй нас, Владыко, Боже всех» (δέσποτα — звательный от δεσπότης, владыка; слав. «Владыко, Боже всех»). ἐπίβλεψον — «воззри, призри» (ἐπιβλέπω). ἐπίβαλε τὸν φόβον σου ἐπὶ πάντα τὰ ἔθνη — «наложи страх Твой на все народы» (ἐπιβάλλω — налагать; φόβος — страх). Слав. делит этот стих на два (1–2); держимся gr. Молитва 1–17 — прямая речь, 「…»."
  2: "ἔπαρον τὴν χεῖρά σου ἐπὶ ἔθνη ἀλλότρια — «подними руку Твою на народы чужие» (ἐπαίρω — поднимать; ἀλλότριος — чужой); слав. «воздвигни руку твою на языки чужды». ἰδέτωσαν τὴν δυναστείαν σου — «да увидят державу Твою» (δυναστεία — власть, могущество); слав. «да узрят силу твою»."
  3: "ὥσπερ ἐνώπιον αὐτῶν ἡγιάσθης ἐν ἡμῖν — «как пред ними Ты освятился в нас» (ἁγιάζω — освящать; ἐνώπιον — перед лицом); слав. «якоже пред ними освятился еси в нас». οὕτως ἐνώπιον ἡμῶν μεγαλυνθείης ἐν αὐτοῖς — «так и пред нами да будешь прославлен в них» (μεγαλύνω — возвеличивать)."
  4: "καὶ ἐπιγνώτωσάν σε ... ὅτι οὐκ ἔστιν θεὸς πλὴν σοῦ, κύριε — «и да познают Тебя, что нет Бога кроме Тебя, Господи» (ἐπιγινώσκω — познавать; πλήν — кроме); слав. «яко несть Бога разве тебе, Господи». καθάπερ καὶ ἡμεῖς ἐπέγνωμεν — «как и мы познали»."
  5: "ἐγκαίνισον σημεῖα — «обнови знамения» (ἐγκαινίζω — обновлять, освящать заново); слав. «обнови знамения». ἀλλοίωσον θαυμάσια — «измени чудеса» (ἀλλοιόω — изменять; θαυμάσιον — дивное). δόξασον χεῖρα καὶ βραχίονα δεξιόν — «прославь руку и мышцу правую» (βραχίων — мышца, рука); слав. «прослави руку и мышцу десную». Слав. относит эту часть к ст. 7."
  6: "ἔγειρον θυμὸν καὶ ἔκχεον ὀργήν — «возбуди ярость и излей гнев» (θυμός — ярость; ἐκχέω — изливать; ὀργή — гнев). ἔξαρον ἀντίδικον — «изыми противника (судебного)» (ἐξαίρω — убирать; ἀντίδικος — противник, ответчик); слав. «изми сопостата». ἔκτριψον ἐχθρόν — «сотри врага» (ἐκτρίβω — стирать, истреблять); слав. «сотри врага». Слав. дробит gr 5б–6 на ст. 7–8."
  7: "σπεῦσον καιρὸν — «ускорь время» (σπεύδω — спешить; καιρός — время, срок); слав. «поспеши время». μνήσθητι ὁρκισμοῦ — «вспомни клятву» (ὁρκισμός — клятва, заклятие); слав. «помяни клятву». ἐκδιηγησάσθωσαν τὰ μεγαλεῖά σου — «да возвестят великие дела Твои» (ἐκδιηγέομαι — подробно рассказывать; μεγαλεῖον — великое)."
  8: "ἐν ὀργῇ πυρὸς καταβρωθήτω ὁ σῳζόμενος — «в ярости огня да будет пожран спасающийся» (καταβιβρώσκω — съедать; ὁ σῳζόμενος — спасающийся, убегающий, а не «спасаемый»); слав. «гневом огня пояден да будет спасаяйся». οἱ κακοῦντες τὸν λαόν σου εὕροισαν ἀπώλειαν — «творящие зло народу Твоему да обретут погибель» (κακόω — вредить; ἀπώλεια — погибель)."
  9: "σύντριψον κεφαλὰς ἀρχόντων ἐχθρῶν — «сокруши головы начальников врагов» (συντρίβω — сокрушать; ἄρχων — начальник); слав. «сокруши главы князей вражиих». λεγόντων Οὐκ ἔστιν πλὴν ἡμῶν — «говорящих: нет кроме нас»; вложенная речь — 『…』 (слав. «глаголющих: несть разве нас»)."
  10: "συνάγαγε πάσας φυλὰς Ιακωβ — «собери все племена Иакова» (συνάγω — собирать; φυλή — племя, колено); слав. «собери вся колена иаковля». κατακληρονόμησον αὐτοὺς καθὼς ἀπ᾿ ἀρχῆς — «дай им наследие, как от начала» (κατακληρονομέω — давать в наследие; ἀπ᾿ ἀρχῆς — от начала)."
  11: "ἐλέησον λαόν, κύριε, κεκλημένον ἐπ᾿ ὀνόματί σου — «помилуй народ, Господи, наречённый именем Твоим» (καλέω — называть); слав. «помилуй люди, Господи, нареченныя именем твоим». ὃν πρωτογόνῳ ὡμοίωσας — «который Ты уподобил первородному» (πρωτόγονος — перворождённый; ὁμοιόω — уподоблять); слав. «егоже первенцем нарекл еси»."
  12: "οἰκτίρησον πόλιν ἁγιάσματός σου — «ущедри город святыни Твоей» (οἰκτίρω — миловать, щадить; ἁγίασμα — святыня); слав. «ущедри град святыни твоея». Ιερουσαλημ τόπον καταπαύματός σου — «Иерусалим, место покоя Твоего» (κατάπαυμα — покой, место отдохновения); слав. «место покоища твоего»."
  13: "πλῆσον Σιων ἀρεταλογίας σου — «наполни Сион повествованием о доблестях Твоих» (ἀρεταλογία — рассказ о славных делах, славословие; πίμπλημι — наполнять); слав. «исполни сиона взяти словеса твоя» передаёт иначе. ἀπὸ τῆς δόξης σου τὸν λαόν σου — «от славы Твоей — народ Твой» (δόξα — слава)."
  14: "δὸς μαρτύριον τοῖς ἐν ἀρχῇ κτίσμασίν σου — «дай свидетельство первым творениям Твоим» (μαρτύριον — свидетельство; κτίσμα — творение); слав. «даждь свидетелство сущым от начала тварем твоим». ἔγειρον προφητείας τὰς ἐπ᾿ ὀνόματί σου — «воздвигни пророчества, [бывшие] об имени Твоём» (προφητεία; ἐγείρω — воздвигать)."
  15: "δὸς μισθὸν τοῖς ὑπομένουσίν σε — «дай награду терпящим (ожидающим) Тебя» (μισθός — награда; ὑπομένω — терпеть, ожидать); слав. «даждь мзду терпящым тебе». οἱ προφῆταί σου ἐμπιστευθήτωσαν — «пророки Твои да будут признаны верными» (ἐμπιστεύω — вверять, доверять; здесь страд. «да будут оправданы»); слав. «пророцы твои да уверятся»."
  16: "εἰσάκουσον, κύριε, δεήσεως τῶν ἱκετῶν σου — «услышь, Господи, моление просителей Твоих» (εἰσακούω — выслушивать; ἱκέτης — проситель, молящий); слав. «услыши, Господи, мольбы молитвенник твоих». κατὰ τὴν εὐλογίαν Ααρων περὶ τοῦ λαοῦ σου — «по благословению Аарона о народе Твоём» (εὐλογία — благословение; ср. Числ 6:24–26)."
  17: "καὶ γνώσονται πάντες οἱ ἐπὶ τῆς γῆς — «и познают все [живущие] на земле» (γινώσκω — знать). ὅτι κύριος εἶ ὁ θεὸς τῶν αἰώνων — «что Ты — Господь Бог веков» (αἰών — век); слав. «яко ты Господь еси, Бог веков». Здесь закрывается молитва (「…», начатая в ст. 1)."
  18: "Πᾶν βρῶμα φάγεται κοιλία — «всякую пищу ест чрево» (βρῶμα — пища, яство; κοιλία — чрево, желудок); слав. «всяко брашно яст чрево». ἔστιν δὲ βρῶμα βρώματος κάλλιον — «есть же пища лучше пищи» (κάλλιον — сравн. от καλός); слав. «есть же брашно брашна добрее». С этого стиха начинается раздел о пище и жене."
  19: "φάρυγξ γεύεται βρώματα θήρας — «гортань вкушает пищу охоты» (φάρυγξ — гортань, горло; γεύομαι — вкушать; θήρα — охота, ловля); слав. «гортань вкушает брашна от лова». οὕτως καρδία συνετὴ λόγους ψευδεῖς — «так и сердце разумное — слова ложные» (συνετός — разумный; ψευδής — ложный); слав. «тако сердце разумиво словеса ложна»."
  20: "καρδία στρεβλὴ δώσει λύπην — «кривое сердце даст печаль» (στρεβλός — кривой, извращённый; λύπη — печаль); слав. «сердце строптиво даст печаль». ἄνθρωπος πολύπειρος ἀνταποδώσει αὐτῷ — «человек многоопытный воздаст ему» (πολύπειρος — многоопытный; ἀνταποδίδωμι — воздавать); слав. «человек многоискусный воздаст ему»."
  21: "πάντα ἄρρενα ἐπιδέξεται γυνή — «всякого мужчину примет жена» (ἄρρην — мужчина; ἐπιδέχομαι — принимать); слав. «всякаго мужеска полу приимет жена». ἔστιν δὲ θυγάτηρ θυγατρὸς κρείσσων — «есть же дочь лучше дочери» (κρείσσων — лучше); слав. «есть же дщерь дщере лучше». Место тёмное: вероятно, одна дочь бывает лучше другой."
  22: "κάλλος γυναικὸς ἱλαρύνει πρόσωπον — «красота жены веселит лицо» (ἱλαρύνω — делать весёлым, светлым); слав. «доброта женска веселит лице». ὑπὲρ πᾶσαν ἐπιθυμίαν ἀνθρώπου ὑπεράγει — «превыше всякого желания человеческого превосходит» (ὑπεράγω — превосходить); слав. «над все желание человеческо предуспевает»."
  23: "εἰ ἔστιν ἐπὶ γλώσσης αὐτῆς ἔλεος καὶ πραΰτης — «если на языке её милость и кротость» (ἔλεος — милость; πραΰτης — кротость); слав. «аще есть на языце ея милость и кротость». οὐκ ἔστιν ὁ ἀνὴρ αὐτῆς καθ᾿ υἱοὺς ἀνθρώπων — «нет мужа её среди сынов человеческих»; слав. «несть муж ея точен сыном человеческим»."
  24: "ὁ κτώμενος γυναῖκα ἐνάρχεται κτήσεως — «приобретающий жену начинает приобретение» (κτάομαι — приобретать; ἐνάρχομαι — начинать); слав. «стяжавый жену начинает имети стяжание». βοηθὸν κατ᾿ αὐτὸν καὶ στῦλον ἀναπαύσεως — «помощницу по нему и столп покоя» (βοηθός — помощник; στῦλος — столп); слав. «помощника по себе и столпа покою»."
  25: "οὗ οὐκ ἔστιν φραγμός, διαρπαγήσεται κτῆμα — «где нет ограды, будет расхищено имение» (φραγμός — ограда; διαρπάζω — расхищать); слав. «идеже несть ограды, расхищено будет имение». οὗ οὐκ ἔστιν γυνή, στενάξει πλανώμενος — «где нет жены, вздохнёт блуждающий» (στενάζω — вздыхать, стенать; πλανάομαι — блуждать); слав. «идеже несть жены, воздохнет скитаяся»."
  26: "τίς γὰρ πιστεύσει εὐζώνῳ λῃστῇ — «кто ибо поверит хорошо подпоясанному (проворному) разбойнику» (εὔζωνος — хорошо подпоясанный, проворный; λῃστής — разбойник); слав. «кто бо поверит вооружену разбойнику» — это чтение взято в основной текст, вариант LXX (εὔζωνος) — здесь. ἀφαλλομένῳ ἐκ πόλεως εἰς πόλιν — «перескакивающему из города в город» (ἀφάλλομαι — соскакивать, перепрыгивать); слав. «преходящу от града во град»."
  27: "οὕτως ἀνθρώπῳ μὴ ἔχοντι νοσσιὰν — «так человеку, не имеющему гнезда» (νοσσιά — гнездо); слав. «такожде и человеку не имущу гнезда». καταλύοντι οὗ ἐὰν ὀψίσῃ — «останавливающемуся, где застанет вечер» (καταλύω — останавливаться, ночевать; ὀψίζω — наступать вечеру); слав. «обитающу, идеже обвечеряет»."
