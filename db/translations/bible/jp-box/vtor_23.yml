verses:
  1: "「人[ひと]は父[ちち]の妻[つま]を取[と]ってはならない。父の覆[おお]いを開[ひら]いてはならない。"
  2: "睾丸[こうがん]をつぶされた者[もの]と、陰茎[いんけい]を切[き]り取[と]られた者は、主[しゅ]の会衆[かいしゅう]に入[はい]ってはならない。"
  3: "娼婦[しょうふ]から生[う]まれた者[もの]は、主[しゅ]の会衆[かいしゅう]に入[はい]ってはならない。"
  4: "アンモン人[じん]とモアブ人[じん]は主[しゅ]の会衆[かいしゅう]に入[はい]ってはならない。十[じゅう]代目[だいめ]に至[いた]るまで、また永遠[えいえん]に至るまで、主の会衆に入ってはならない。"
  5: "彼[かれ]らが、あなたがたがエジプトから出[で]て来[く]るとき、道[みち]でパンと水[みず]を持[も]ってあなたがたを迎[むか]えなかったからであり、またメソポタミアからベオルの子[こ]バラムを雇[やと]って、あなたを呪[のろ]わせようとしたからである。"
  6: "しかし、あなたの神[かみ]である主[しゅ]はバラムの言[い]うことを聞[き]こうとされず、その呪[のろ]いを祝福[しゅくふく]に変[か]えられた。あなたの神である主があなたを愛[あい]しておられるからである。"
  7: "あなたのすべての日[ひ]の間[あいだ]、永遠[えいえん]に至るまで、彼[かれ]らに平和[へいわ]と幸[しあわ]せを願[ねが]ってはならない。"
  8: "エドム人[じん]を忌[い]み嫌[きら]ってはならない。彼[かれ]はあなたの兄弟[きょうだい]だからである。エジプト人を忌み嫌ってはならない。あなたはその地[ち]で寄留者[きりゅうしゃ]であったからである。"
  9: "彼[かれ]らに子[こ]が生[う]まれたなら、その三[さん]代目[だいめ]は主[しゅ]の会衆[かいしゅう]に入[はい]ることができる。"
  10: "あなたが敵[てき]に向[む]かって陣[じん]を張[は]るために出[で]て行[い]くときは、すべての悪[わる]いことから身[み]を守[まも]りなさい。"
  11: "あなたのうちに、夜[よる]、精[せい]を漏[も]らして清[きよ]くない者[もの]がいるなら、その者は宿営[しゅくえい]の外[そと]へ出[で]て行[い]き、宿営に入[はい]ってはならない。"
  12: "夕方[ゆうがた]には、その者[もの]は水[みず]で体[からだ]を洗[あら]いなさい。日[ひ]が沈[しず]んだなら、宿営[しゅくえい]に入[はい]ることができる。"
  13: "あなたのために、宿営[しゅくえい]の外[そと]に場所[ばしょ]を設[もう]けなさい。そこへ出[で]て行[い]くためである。"
  14: "あなたの帯[おび]には、くいを一[ひと]本[ぽん]下[さ]げておきなさい。外[そと]で用[よう]を足[た]すとき、それで穴[あな]を掘[ほ]り、終[お]わったらその穴に自分の汚物[おぶつ]を埋[うず]めて隠[かく]しなさい。"
  15: "あなたの神[かみ]である主[しゅ]は、あなたを救[すく]い出[だ]し、あなたの敵[てき]をあなたの前[まえ]に渡[わた]すために、あなたの宿営[しゅくえい]のうちを歩[あゆ]んでおられる。あなたの宿営は聖[せい]でなければならない。あなたのうちに恥[は]ずべきものが現[あらわ]れず、主があなたから離[はな]れ去[さ]られないためである。"
  16: "しもべがその主人[しゅじん]のもとからあなたのもとへ逃[に]げて来[き]たなら、あなたはそのしもべを主人に引[ひ]き渡[わた]してはならない。"
  17: "そのしもべはあなたとともに住[す]み、あなたがたのうちで、自分[じぶん]の好[この]む場所[ばしょ]に住むであろう。あなたは彼[かれ]を虐[しいた]げてはならない。"
  18: "イスラエルの娘[むすめ]たちのうちに娼婦[しょうふ]がいてはならない。イスラエルの息子[むすこ]たちのうちに男娼[だんしょう]がいてはならない。イスラエルの娘たちのうちに神殿[しんでん]娼婦[しょうふ]がいてはならない。イスラエルの息子たちのうちに神殿男娼[だんしょう]がいてはならない。"
  19: "娼婦[しょうふ]の稼[かせ]ぎ賃[ちん]や犬[いぬ]の代価[だいか]を、どんな誓[ちか]いのためであっても、あなたの神[かみ]である主[しゅ]の家[いえ]に持[も]って来[き]てはならない。その二[ふた]つとも、あなたの神である主に忌[い]み嫌[きら]われるものだからである。"
  20: "あなたの兄弟[きょうだい]から、銀[ぎん]の利息[りそく]も、食物[しょくもつ]の利息も、あなたが貸[か]し付[つ]けるすべての物[もの]の利息も取[と]ってはならない。"
  21: "外国人[がいこくじん]には利息[りそく]を取[と]って貸[か]してよいが、あなたの兄弟[きょうだい]には利息を取ってはならない。あなたの神[かみ]である主[しゅ]が、あなたが嗣業[しぎょう]として受[う]け継[つ]ぐために入[はい]って行[い]く地[ち]で、あなたのすべての業[わざ]を祝福[しゅくふく]してくださるためである。"
  22: "あなたの神[かみ]である主[しゅ]に誓[ちか]いを立てるなら、それを果[は]たすのを遅[おく]らせてはならない。あなたの神である主は必[かなら]ずそれをあなたから求[もと]められ、あなたに罪[つみ]が帰[き]すからである。"
  23: "しかし、誓[ちか]いを立てたくないなら、あなたに罪[つみ]はない。"
  24: "あなたの唇[くちびる]から出[で]ることを守[まも]り、あなたの神[かみ]である主[しゅ]に誓[ちか]って、口[くち]で言[い]い表[あらわ]した献[ささ]げ物[もの]を、そのとおりに行[おこな]いなさい。」"

notes:
  1: "Οὐ λήμψεται — «не возьмёт»; γυναῖκα τοῦ πατρός — жену отца. ἀποκαλύψει συγκάλυμμα — «откроет покрывало» (συγκάλυμμα), идиома «открыть наготу отца», т.е. вступить в связь с женой отца; в тексте 覆いを開く."
  2: "θλαδίας — «с раздавленными ятрами» (θλάω — давить); ἀποκεκομμένος — «отрезанный» (ἀποκόπτω), о члене. ἐκκλησία κυρίου — «собрание Господне» (会衆)."
  3: "ἐκ πόρνης — «от блудницы», т.е. рождённый от блудницы; в тексте 娼婦から生まれた者."
  4: "Αμμανίτης, Μωαβίτης — аммонитянин, моавитянин. ἕως δεκάτης γενεᾶς — до десятого поколения. καὶ ἕως εἰς τὸν αἰῶνα — «и до века»."
  5: "παρὰ τὸ μὴ συναντῆσαι — «за то, что не встретили»; μετὰ ἄρτων καὶ ὕδατος — с хлебом и водой. ἐμισθώσαντο — «наняли» (μισθόω); Βαλααμ υἱὸν Βεωρ — Валаам, сын Веора; ἐκ τῆς Μεσοποταμίας — из Месопотамии."
  6: "οὐκ ἠθέλησεν … εἰσακοῦσαι — «не захотел послушать». μετέστρεψεν τὰς κατάρας εἰς εὐλογίαν — «обратил проклятия в благословения»."
  7: "προσαγορεύσεις εἰρηνικά — «будешь приветствовать мирным» (προσαγορεύω); συμφέροντα — «полезное». εἰς τὸν αἰῶνα — вовеки."
  8: "βδελύξῃ — «будешь гнушаться» (βδελύσσομαι). Ἰδουμαῖος — идумеянин (в тексте エドム人). πάροικος — пришелец, поселенец (寄留者)."
  9: "υἱοὶ ἐὰν γενηθῶσιν — «если родятся сыны». γενεὰ τρίτη — третье поколение."
  10: "παρεμβαλεῖν — «расположиться станом, ополчиться» (παρεμβάλλω). φυλάξῃ ἀπὸ παντὸς ῥήματος πονηροῦ — «берегись всякого злого дела, слова»."
  11: "ῥύσις — «истечение»; ἐκ ῥύσεως αὐτοῦ νυκτός — от ночного истечения семени. ἐξελεύσεται ἔξω τῆς παρεμβολῆς — выйдет вон из стана."
  12: "λούσεται τὸ σῶμα ὕδατι — «омоет тело водой». δεδυκότος ἡλίου — «когда солнце зашло»."
  13: "τόπος ἔξω τῆς παρεμβολῆς — место вне стана. ἐξελεύσῃ ἐκεῖ ἔξω — «выйдешь туда вон»."
  14: "πάσσαλος — колышек; ἐπὶ τῆς ζώνης — на поясе. διακαθιζάνῃς — «сядешь для нужды»; ὀρύξεις — «выкопаешь»; ἀσχημοσύνη — «срам», здесь испражнение; в тексте 汚物."
  15: "ἐμπεριπατεῖ — «ходит среди» (ἐμπεριπατέω). ἐξελέσθαι — «избавить»; παραδοῦναι τὸν ἐχθρόν — «предать врага». ἁγία — свята. ἀσχημοσύνη πράγματος — «срам вещи»."
  16: "παῖς — раб, слуга; προστέθειται — «прибег, присоединился» (προστίθημι). οὐ παραδώσεις — «не выдашь»."
  17: "κατοικήσει — «будет жить» (κατοικέω). οὗ ἐὰν ἀρέσῃ αὐτῷ — «где ему угодно». θλίψεις — «будешь притеснять» (θλίβω)."
  18: "πόρνη — блудница; πορνεύων — блудник. τελεσφόρος и τελισκόμενος — «посвящённая» и «посвящаемый», культовые блудницы и блудники (ср. евр. קְדֵשָׁה / קָדֵשׁ); в csl-ru этих двух членов нет, у них только первые два. В тексте 神殿娼婦 / 神殿男娼, со сноской."
  19: "μίσθωμα πόρνης — «плата блудницы»; ἄλλαγμα κυνός — «цена пса» (в евр. — плата мужчины-блудника). πρὸς πᾶσαν εὐχήν — «по всякому обету». βδέλυγμα — мерзость."
  20: "ἐκτοκιεῖς — «будешь давать в рост» (ἐκτοκίζω); τόκος — процент. βρώματα — снедь, пища."
  21: "τῷ ἀλλοτρίῳ — иноземцу (в тексте 外国人); ἀδελφῷ — брату. ἵνα εὐλογήσῃ σε — «чтобы благословил тебя». κληρονομῆσαι — наследовать (嗣業として受け継ぐ)."
  22: "εὔξῃ εὐχήν — «дашь обет»; οὐ χρονιεῖς — «не замедлишь» (χρονίζω). ἐκζητῶν ἐκζητήσει — «взыскивая взыщет»."
  23: "ἐὰν δὲ μὴ θέλῃς εὔξασθαι — «если не захочешь дать обет». οὐκ ἔστιν ἐν σοὶ ἁμαρτία — «нет в тебе греха»."
  24: "τὰ ἐκπορευόμενα διὰ τῶν χειλέων — «выходящее через уста». φυλάξῃ — «сохранишь». δόμα — дар, приношение; ἐλάλησας τῷ στόματί σου — «сказал устами твоими»."
