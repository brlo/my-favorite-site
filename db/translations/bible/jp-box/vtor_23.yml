# jp-joc в этой главе отсутствует. Язык — современный 常体; порядок членов и
# деление на клаузы — по греческому.
# Глава 23: кто не входит в собрание Господне (1–9), нечистота в стане (10–15),
# беглый раб (16–17), блуд и плата блудницы (18–19), рост и обеты (20–24).
# Вся глава — речь Моисея: 「…」 (1–24). Вложенной речи нет. Красного нет.
# Нумерация: 24 стиха, как в gr-lxx-byz; у csl-ru и ru 25 стихов. Их 22:30
# («не бери жены отца своего») здесь стоит как 23:1, поэтому gr 23:2–24 = csl 23:1–23;
# csl 23:24–25 («жатва» и «виноградник») в gr-lxx-byz отнесены к 24:1–2. Держимся gr.
# LXX-особенность: 23:18 в gr-lxx-byz содержит четыре члена (πόρνη, πορνεύων,
# τελεσφόρος, τελισκόμενος); в csl-ru и ru только первые два.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке и базе).
# Сносок ⟨…⟩ одна — 23:18 神殿娼婦 (τελεσφόρος), термин в корпусе новый.
# jp-ni не использовался.

