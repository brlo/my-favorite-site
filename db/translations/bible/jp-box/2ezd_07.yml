# jp-box, 2-я Ездры, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: окончание святого дома и его освящение (1–9), Пасха и опресноки (10–15).
# Артаксеркс здесь только назван среди персидских царей (5); Езры в этой главе нет —
# его чтение закона начинается в гл. 8.
# Прямой речи нет: кавычек нет, красного и синего нет.
# Нумерация по gr: 15 стихов. Слав. 7:4 вбирает начало гр. 7:5 («и с повелением кира
# и дариа и артаксеркса царей персских»), поэтому csl 7:5 — вторая половина гр. 7:5;
# число стихов то же, деление держим по gr.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. чтение 7:10 «егда освятишася» (вместо
# «потому что очистились») внесено в текст; в 7:11 сохранено отрицание, как в csl
# («не вкупе очистишася») и LXX; 7:15 «совет царя» — по csl, LXX τὴν βουλήν.
# Сносок ⟨…⟩ нет: 過越, 種なしパン, 祭司, レビ人, 神殿, 祭壇, 聖所 уже в корпусе.
# Имена — транслитерация греческого (LXX): シシンネス, サトラブザネス, ダリウス, クロス,
# アルタシャスタ, ハガイ, ザカリヤ.

tr_code: jp-box
book: 2ezd
chapter: 7
draft: true

verses:
  1: "そこで、コイレ・シリアとフェニキアの知事[ちじ]シシンネス、サトラブザネス、およびその同僚[どうりょう]たちは、ダリウス王[おう]が命[めい]じたことに従[したが]って、"
  2: "聖[せい]なる工事[こうじ]を監督[かんとく]し、ユダヤ人[じん]の長老[ちょうろう]たちと神殿[しんでん]の監督[かんとく]たちに、いっそう熱心[ねっしん]に協力[きょうりょく]した。"
  3: "預言者[よげんしゃ]ハガイとザカリヤが預言[よげん]していたので、聖[せい]なる工事[こうじ]は順調[じゅんちょう]に進[すす]んだ。"
  4: "そして彼[かれ]らは、イスラエルの神[かみ]である主[しゅ]の命令[めいれい]によってこれを完成[かんせい]させ、"
  5: "クロス、ダリウス、アルタシャスタというペルシアの王[おう]たちの意向[いこう]によって、聖[せい]なる家[いえ]は、ダリウス王[おう]の第六年[だいろくねん]、アダルの月[つき]の二十三日[にじゅうさんにち]に完成[かんせい]した。"
  6: "また、イスラエルの子[こ]ら、祭司[さいし]たち、レビ人[びと]たち、および捕囚[ほしゅう]から来[き]た残[のこ]りの者[もの]たちで、これに加[くわ]わった者[もの]たちは、モーセの書[しょ]に書[か]かれているとおりに行[おこな]い、"
  7: "主[しゅ]の聖所[せいしょ]の奉献[ほうけん]のために、雄牛[おうし]百頭[ひゃくとう]、雄羊[おひつじ]二百頭[にひゃくとう]、子羊[こひつじ]四百頭[よんひゃくとう]をささげた。"
  8: "また、イスラエル全体[ぜんたい]のために、罪[つみ]のための雄山羊[おやぎ]十二頭[じゅうにとう]、すなわちイスラエルの部族[ぶぞく]の長[かしら]たちの数[かず]に従[したが]って十二頭[じゅうにとう]。"
  9: "そして、祭司[さいし]たちとレビ人[びと]たちは、モーセの書[しょ]に従[したが]って、イスラエルの神[かみ]である主[しゅ]の工事[こうじ]のために、部族[ぶぞく]ごとに装[よそお]いをして立[た]ち、門番[もんばん]たちはそれぞれの門[もん]に立[た]った。"
  10: "また、イスラエルの子[こ]ら、すなわち捕囚[ほしゅう]の者[もの]たちは、第一[だいいち]の月[つき]の十四日[じゅうよっか]に過越[すぎこし]を行[おこな]った。祭司[さいし]たちとレビ人[びと]たちが一緒[いっしょ]に清[きよ]められたときのことである。"
  11: "しかし、捕囚[ほしゅう]の子[こ]らは皆[みな]、一緒[いっしょ]には清[きよ]められなかった。レビ人[びと]たちは皆、一緒[いっしょ]に清[きよ]められたからである。"
  12: "そして彼[かれ]らは、捕囚[ほしゅう]の子[こ]らすべてのために、また彼[かれ]らの兄弟[きょうだい]である祭司[さいし]たちのため、そして自分[じぶん]たちのために、過越[すぎこし]の子羊[こひつじ]を屠[ほふ]った。"
  13: "そして、捕囚[ほしゅう]から来[き]たイスラエルの子[こ]ら、すなわち地[ち]の諸国民[しょこくみん]の忌[い]むべきものから離[はな]れ、主[しゅ]を求[もと]めている者[もの]たちは皆[みな]、これを食[た]べた。"
  14: "そして、彼[かれ]らは七日間[なのかかん]、主[しゅ]の前[まえ]で喜[よろこ]びながら、種[たね]なしパンの祭[まつ]りを行[おこな]った。"
  15: "主[しゅ]がアッシリアの王[おう]の心[こころ]を彼[かれ]らに向[む]けて、イスラエルの神[かみ]である主[しゅ]の工事[こうじ]のために彼[かれ]らの手[て]を強[つよ]くされたからである。"

notes:
  1: "Τότε Σισίννης ὁ ἔπαρχος Κοίλης Συρίας καὶ Φοινίκης — тогда Сисинни, начальник Келе-Сирии и Финикии. κατακολουθήσαντες τοῖς ὑπὸ τοῦ βασιλέως Δαρείου προσταγεῖσιν — последовав повелениям, данным царём Дарием (κατακολουθέω — следовать за; προστάσσω — повелевать). Предложение продолжается в ст. 2."
  2: "ἐπεστάτουν τῶν ἱερῶν ἔργων — надзирали над священными работами (ἐφίστημι — стоять во главе). ἐπιμελέστερον — усерднее, тщательнее (сравнительная степень от ἐπιμελής). συνεργοῦντες τοῖς πρεσβυτέροις … καὶ ἱεροστάταις — содействуя старейшинам и священноначальникам; ἱεροστάται — «храмовые надзиратели», редкое слово (神殿の監督, как в 1:8), слав. «священноначалником»."
  3: "εὔοδα ἐγίνετο τὰ ἱερὰ ἔργα — священные работы шли успешно (εὔοδος — успешный). προφητευόντων Αγγαιου καὶ Ζαχαριου τῶν προφητῶν — при пророчествовании пророков Аггея и Захарии (родительный абсолютный)."
  4: "συνετέλεσαν ταῦτα διὰ προστάγματος τοῦ κυρίου θεοῦ Ισραηλ — совершили это по повелению Господа Бога Израилева (συντελέω, πρόσταγμα). Слав. 7:4 вбирает и начало 7:5 («и с повелением кира и дариа и артаксеркса»), поэтому наш ст. 4 кончается запятой: деление держим по gr."
  5: "μετὰ τῆς γνώμης Κύρου καὶ Δαρείου καὶ Ἀρταξέρξου βασιλέως Περσῶν — по воле Кира, Дария и Артаксеркса, царя Персов (γνώμη; Ἀρταξέρξης — アルタシャスタ). ἕως τρίτης καὶ εἰκάδος μηνὸς Αδαρ — «до двадцать третьего дня месяца Адара» (τρίτη καὶ εἰκάς — 23-е число; слав. «третияго и двадесятаго»). τοῦ ἕκτου ἔτους βασιλέως Δαρείου — шестого года царя Дария."
  6: "οἱ υἱοὶ Ισραηλ καὶ οἱ ἱερεῖς καὶ οἱ Λευῖται — сыны Израиля, священники и левиты. οἱ λοιποὶ οἱ ἐκ τῆς αἰχμαλωσίας οἱ προστεθέντες — остальные из плена, присоединившиеся (προστίθημι; слав. «приставленнии»). ἀκολούθως τοῖς ἐν τῇ Μωυσέως βίβλῳ — согласно [написанному] в книге Моисея; предложение продолжается в ст. 7."
  7: "προσήνεγκαν εἰς τὸν ἐγκαινισμὸν τοῦ ἱεροῦ τοῦ κυρίου — принесли на обновление (освящение) святилища Господня (ἐγκαινισμός, ἱερόν). ταῦροι ἑκατόν, κριοὶ διακόσιοι, ἄρνες τετρακόσιοι — тельцов сто, овнов двести, агнцев четыреста."
  8: "χίμαροι ὑπὲρ ἁμαρτίας — козлы за грех, жертва за грех (χίμαρος, ἁμαρτία). παντὸς τοῦ Ισραηλ — всего Израиля. πρὸς ἀριθμὸν ἐκ τῶν φυλάρχων τοῦ Ισραηλ δώδεκα — по числу двенадцати племенных начальников Израиля (φύλαρχος)."
  9: "ἔστησαν … ἐστολισμένοι — стали облачённые (στέλλω в пассиве — одеваться, 装い). κατὰ φυλάς — по племенам (φυλή). ἐπὶ τῶν ἔργων — при работах. ἀκολούθως τῇ Μωυσέως βίβλῳ — согласно книге Моисея. οἱ θυρωροὶ ἐφ᾿ ἑκάστου πυλῶνος — привратники у каждых ворот (θυρωρός, πυλών)."
  10: "ἠγάγοσαν τὸ πασχα — совершили Пасху (ἄγω — «праздновать»; 過越). ἐν τῇ τεσσαρεσκαιδεκάτῃ τοῦ πρώτου μηνός — в четырнадцатый день первого месяца. ὅτι ἡγνίσθησαν οἱ ἱερεῖς καὶ οἱ Λευῖται ἅμα — слав. передаёт ὅτι как «егда»: «когда освятились священники и левиты» (ἁγνίζω, ἅμα — вместе)."
  11: "οὐχ ἡγνίσθησαν — не очистились: отрицание стоит и в LXX, и в слав. («не вкупе очистишася» — «не вместе очистились»); ru отрицание опускает. ὅτι οἱ Λευῖται ἅμα πάντες ἡγνίσθησαν — потому что левиты все вместе очистились."
  12: "ἔθυσαν τὸ πασχα — закололи пасхальное (θύω; ср. Езд 6:20). πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας — всем сынам плена. τοῖς ἀδελφοῖς αὐτῶν τοῖς ἱερεῦσιν — братьям их, священникам. ἑαυτοῖς — и себе самим."
  13: "ἐφάγοσαν — ели (ἐσθίω, аор.). οἱ χωρισθέντες ἀπὸ τῶν βδελυγμάτων τῶν ἐθνῶν τῆς γῆς — отделившиеся от мерзостей народов земли (χωρίζω, βδέλυγμα). ζητοῦντες τὸν κύριον — ищущие Господа (ζητέω)."
  14: "ἠγάγοσαν τὴν ἑορτὴν τῶν ἀζύμων — совершили праздник опресноков (ἑορτή, ἄζυμα; 種なしパン). ἑπτὰ ἡμέρας — семь дней. εὐφραινόμενοι ἔναντι τοῦ κυρίου — веселясь пред Господом (εὐφραίνω)."
  15: "μετέστρεψεν τὴν βουλὴν τοῦ βασιλέως Ἀσσυρίων ἐπ᾿ αὐτούς — обратил совет (намерение) царя Ассирийского к ним (μεταστρέφω, βουλή). κατισχῦσαι τὰς χεῖρας αὐτῶν — укрепить руки их (κατισχύω), т. е. поддержать в работе. ἐπὶ τὰ ἔργα κυρίου θεοῦ Ισραηλ — на дела Господа Бога Израилева. Ассирийским назван Дарий, как в Езд 6:22."
