# jp-box, Захария, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 12 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 просите дождя, терафимы и вещуны, «нет пастыря»; 3–5 гнев на пастырей,
# Господь посещает стадо, дом Иудин — конь на брани, краеугольный камень, гвоздь, лук;
# 6–7 укрепление Иуды и спасение Иосифа, Ефрем как герой; 8–10 сбор из Египта и Ассирии,
# Галаад и Ливан; 11–12 море и реки, гордость Ассура, скипетр Египта, «укреплю их».
# Голоса: 1–2 пророческое увещание и объяснение (без кавычек); 3–12 слово Господа
# в 「…» (в 4 тёмное место о «надзирающем» и «устрояющем»).
# Термины: 万軍[ばんぐん]の主[しゅ] — κύριος παντοκράτωρ; 羊飼[ひつじか]い — ποιμήν;
# 嗣業[しぎょう] — κληρονομία; 笏[しゃく] — σκῆπτρον.
#
tr_code: jp-box
book: zah
chapter: 10
draft: true

verses:
  1: "主[しゅ]に雨[あめ]を求[もと]めよ。早[はや]い雨[あめ]と遅[おそ]い雨[あめ]の時[とき]に。主[しゅ]は幻[まぼろし]を造[つく]り、冬[ふゆ]の雨[あめ]を彼らに与[あた]え、それぞれの畑[はたけ]に草[くさ]を与[あた]えられる。"
  2: "テラフィムは空[むな]しいことを語[かた]り、占[うらな]い師[し]たちは偽[いつわ]りの幻[まぼろし]を見[み]、偽[いつわ]りの夢[ゆめ]を語[かた]る。彼らは空[むな]しいもので慰[なぐさ]める。それゆえ、彼らは羊[ひつじ]のように連[つ]れ去[さ]られ、羊飼[ひつじか]いがないので苦[くる]しむ。"
  3: "「わたしの怒[いか]りは羊飼[ひつじか]いたちに向[む]かって燃[も]え、わたしは小羊[こひつじ]たちを罰[ばっ]する。万軍[ばんぐん]の主[しゅ]はその群[む]れであるユダの家[いえ]を顧[かえり]み、これを戦[たたか]いの場[ば]の麗[うるわ]しい馬[うま]のようにされる。"
  4: "彼から見張[みは]る者[もの]が、彼から整[ととの]える者[もの]が、彼から怒[いか]りの弓[ゆみ]が起[お]こり、彼からすべての指[さ]揮[き]する者[もの]がともに行[い]く。"
  5: "彼らは戦[たたか]いのとき、道[みち]の泥[どろ]を踏[ふ]みつける勇士[ゆうし]のようになり、ともに戦[たたか]う。主[しゅ]が彼らとともにいるからである。彼らは馬[うま]に乗[の]る者[もの]たちを辱[はずかし]める。"
  6: "わたしはユダの家[いえ]を強[つよ]くし、ヨセフの家[いえ]を救[すく]い、彼らを住[す]まわせる。わたしは彼らを愛[あい]したからである。彼らは、わたしが捨[す]てなかった者[もの]のようになる。わたしは彼らの神[かみ]、主[しゅ]であり、彼らに答[こた]えるからである。"
  7: "エフライムは勇士[ゆうし]のようになり、その心[こころ]はぶどう酒[しゅ]によるように喜[よろこ]ぶ。その子[こ]らはこれを見[み]て喜[よろこ]び、その心[こころ]は主[しゅ]によって躍[おど]る。"
  8: "わたしは彼らにしるしを与[あた]えて集[あつ]める。わたしは彼らを贖[あがな]ったからである。彼らは以前[いぜん]のように多[おお]くなる。"
  9: "わたしは彼らを民[たみ]の間[あいだ]に蒔[ま]く。遠[とお]い国[くに]々[くに]で彼らはわたしを思[おも]い起[おこ]し、子[こ]どもたちとともに生[い]き、帰[かえ]って来[く]る。"
  10: "わたしは彼らをエジプトの地[ち]から連[つ]れ帰[かえ]り、アッシリアから集[あつ]める。わたしは彼らをギレアデの地[ち]とレバノンに連[つ]れて行[い]く。彼らのために場所[ばしょ]が足[た]りなくなる。"
  11: "彼らは狭[せま]い海[うみ]を通[とお]り、海[うみ]の波[なみ]を打[う]ち、川[かわ]のすべての深[ふか]みは干[ひ]上[あ]がる。アッシリアのすべての誇[ほこ]りは取[と]り除[のぞ]かれ、エジプトの笏[しゃく]も取[と]り去[さ]られる。"
  12: "わたしは彼らを主[しゅ]によって強[つよ]くし、彼らはその名[な]によって誇[ほこ]る、と主[しゅ]は言[い]われる。」"

notes:
  1: "Αἰτεῖσθε ὑετὸν παρὰ κυρίου — «просите дождя у Господа»; καθ' ὥραν πρόιμον καὶ ὄψιμον — «в час ранний и поздний» (слав. «во время ранняго и поздняго»); φαντασίας — «видения, призраки» (слав. «привидения»); ὑετὸν χειμερινόν — «дождь зимний»."
  2: "οἱ ἀποφθεγγόμενοι — «прорицающие»; κόπους — «труды, пустое»; μάντεις — «вещуны»; ἐξήρθησαν ὡς πρόβατα — «подняты (унесены) как овцы»; слав. «изсхоша» — «иссохли»; в ru «бродят» — иное; οὐκ ἦν ἴασις — «не было исцеления»."
  3: "παρωξύνθη ὁ θυμός μου — «воспылал гнев Мой»; ἐπὶ τοὺς ἀμνούς — «на агнцев» (слав.; в ru «козлов» — иное чтение); ἐπισκέψεται… τὸ ποίμνιον — «посетит… стадо»; ὡς ἵππον εὐπρεπῆ — «как коня благообразного»."
  4: "ἐξ αὐτοῦ ἐπέβλεψεν — тёмное: «от него призрел»; ἐξ αὐτοῦ ἔταξεν — «от него поставил»; τόξον ἐν θυμῷ — «лук в ярости»; ὁ ἐξελαύνων — «изгоняющий, вождь»; в ru «краеугольный камень, гвоздь» (МТ) — не внесено."
  5: "ὡς μαχηταὶ πατοῦντες πηλόν — «как воины, попирающие грязь»; παρατάξονται — «ополчатся»; καταισχυνθήσονται ἀναβάται ἵππων — «посрамятся всадники коней»."
  6: "κατισχύσω… σώσω… κατοικιῶ — «укреплю… спасу… поселю»; ὃν τρόπον οὐκ ἀπεστρεψάμην — «как [если] Я не отвратился»; ἐπακούσομαι — «услышу»."
  7: "ὡς μαχηταὶ τοῦ Εφραιμ — «как воины Ефрема»; ὡς ἐν οἴνῳ — «как от вина»; χαρεῖται ἡ καρδία — «возрадуется сердце»."
  8: "σημανῶ — «дам знак»; εἰσδέξομαι — «прииму»; λυτρώσομαι — «искуплю»."
  9: "σπερῶ αὐτοὺς ἐν λαοῖς — «посею их в народах»; οἱ μακρὰν μνησθήσονταί μου — «дальние вспомнят Меня»; ἐκθρέψουσιν — «вскормят»."
  10: "ἐπιστρέψω… εἰσδέξομαι… εἰσάξω — «возвращу… прииму… введу»; Γαλααδῖτις — Галаад; οὐ μὴ ὑπολειφθῇ… οὐδὲ εἷς — «не останется ни один»."
  11: "θαλάσσῃ στενῇ — «морем тесным»; πατάξουσιν ἐν θαλάσσῃ κύματα — «поразит в море волны»; βάθη ποταμῶν — «глубины рек»; σκῆπτρον Αἰγύπτου — «скипетр Египта»."
  12: "κατισχύσω αὐτοὺς ἐν κυρίῳ — «укреплю их в Господе»; ἐν τῷ ὀνόματι αὐτοῦ κατακαυχήσονται — «именем Его будут хвалиться» (слав.; в ru «ходить во имя Его» — МТ, не внесено)."
