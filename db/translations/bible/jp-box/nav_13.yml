# jp-box, Иисус Навин, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главах 13–15 нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: речь Господа о земле, ещё не взятой в удел (1–7); удел Рувима (8–23),
# удел Гада (24–28), удел половины Манассии (29–32).
# Нумерация: в gr-lxx-byz 32 стиха, в csl 33 — csl 33-й («Племени же левиину не даде
# моисей наследия...») повторяет начало gr 13:14; перевод по греческому счёту, 32 стиха.
# Речь Господа — 「…」 (1–7), красного нет.
# 〔…〕 нет, сносок ⟨…⟩ нет: все слова есть в gr-lxx-byz, новых терминов нет.
# Топонимы транслитерированы с греческого; где форма корпуса уже есть (アロエル, エセボン,
# ダイボン, ギレアデ, バシャン, アスタロト, エドライン, マハナイム, マキル, ヤイル,
# カリアタイム, セバマ), взята она; сомнительные места оговорены в notes.

