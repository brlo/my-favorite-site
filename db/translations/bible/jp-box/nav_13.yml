verses:
  1: "ヨシュアは年[とし]を重[かさ]ねて老[お]いていた。主[しゅ]はヨシュアに言[い]われた。「あなたは年を重ねて老いたが、嗣業[しぎょう]として残[のこ]る地[ち]はまだ多[おお]い。"
  2: "これが残った地である。すなわち、フィリスティ人[じん]の境界[きょうかい]、ゲシル人、およびカナン人の地である。"
  3: "エジプトの手前[てまえ]にある、住[す]む者[もの]のいない荒[あ]れ地[ち]から、カナン人の左[ひだり]、すなわち北[きた]にあるエクロンの境界[きょうかい]までが、フィリスティ人の五[いつ]つの地方[ちほう]に数[かぞ]えられる。ガザ、アシュドド、アシュケロン、ガト、エクロンである。また、エビ人の地、"
  4: "テマンから、ガザの向[む]かいのカナンの全[すべ]ての地[ち]、またシドン人[じん]の地はアフェクまで、アモリ人の境界[きょうかい]まで、"
  5: "また、フィリスティ人[じん]のガブリの全[すべ]ての地、およびレバノンのすべて、日の昇[のぼ]る方[ほう]から、ヘルモンの山[やま]の下[した]のガルガルから、エマトの入口[いりぐち]まで、"
  6: "レバノンからマセレフォト・マイムまでの山地[さんち]に住[す]むすべての者[もの]、すべてのシドン人[じん]を、わたしはイスラエルの前[まえ]から滅[ほろ]ぼし尽[つ]くす。ただ、あなたはこの地[ち]をイスラエルにくじで分[わ]け与[あた]えなさい。わたしがあなたに命[めい]じたとおりに。"
  7: "そして今[いま]、あなたはこの地[ち]を、九[ここの]つの部族[ぶぞく]とマナセの部族の半分[はんぶん]とに嗣業[しぎょう]として分[わ]けなさい。ヨルダン川[がわ]から西[にし]、大[おお]きな海[うみ]までを彼[かれ]らに与[あた]えなさい。大きな海がその境界[きょうかい]となる。」"
  8: "ルベンとガドの二[ふた]つの部族[ぶぞく]、およびマナセの部族の半分[はんぶん]には、モーセがヨルダン川[がわ]の向[む]こう側[がわ]、日[ひ]の昇[のぼ]る方[ほう]で与[あた]えた。主[しゅ]のしもべモーセがこれを与えたのである。"
  9: "アルノンの谷川[たにがわ]の岸[きし]にあるアロエルから、谷[たに]の中[なか]にある町[まち]、およびメダバからダイボンまでのミソルの全[すべ]ての地[ち]、"
  10: "アモリ人[じん]の王[おう]シホンがエセボンで治[おさ]めたすべての町[まち]、アンモンの子[こ]らとの境界[きょうかい]まで、"
  11: "ギレアデの地[ち]、ゲシルとマハトの境界[きょうかい]、ヘルモンの山[やま]の全[すべ]て、およびサルハまでのバシャンのすべての地、"
  12: "バシャンにあるオグの王国[おうこく]の全[すべ]て、すなわちアスタロトとエドラインで治[おさ]めた王国である。彼[かれ]は巨人[きょじん]たちのうちに残[のこ]った者[もの]であったが、モーセは彼を打[う]ち、滅[ほろ]ぼし尽[つ]くした。"
  13: "しかし、イスラエルの子[こ]らはゲシル人[じん]、マハト人、カナン人を滅[ほろ]ぼし尽[つ]くさなかった。ゲシルの王[おう]とマハトは、今日[きょう]に至[いた]るまでイスラエルの子らの間[あいだ]に住[す]んでいる。"
  14: "ただ、レビの部族[ぶぞく]には嗣業[しぎょう]が与[あた]えられなかった。イスラエルの神[かみ]である主[しゅ]が彼[かれ]らの嗣業である。主が彼らに言[い]われたとおりである。これが、モーセがヨルダン川[がわ]の向[む]こう側[がわ]、エリコの向かいにあるモアブのアラボトで、イスラエルの子[こ]らに分[わ]け与えた割[わ]り当[あ]てである。"
  15: "モーセはルベンの部族[ぶぞく]に、その氏族[しぞく]ごとに与[あた]えた。"
  16: "彼[かれ]らの境界[きょうかい]は、アルノンの谷[たに]の向[む]かいにあるアロエルから、アルノンの谷にある町[まち]、およびミソルの全[すべ]ての地[ち]、"
  17: "エセボンに至[いた]るまで、およびミソルにあるすべての町[まち]、すなわちダイボン、バモト・バアル、ベエルメオンの家[いえ]、"
  18: "イアッサ、ケデモト、メファアト、"
  19: "カリアタイム、セバマ、セラダ、エメクの山[やま]にあるシオル、"
  20: "ベト・フォゴル、アシドト・ファスガ、ベト・アシモト、"
  21: "ミソルの全[すべ]ての町[まち]、およびアモリ人[じん]の王[おう]シホンの王国[おうこく]のすべて、すなわちモーセが打[う]ったシホン、およびマディアンの長[おさ]たちエビ、レコム、スル、ウル、ロベ、シホンのもとにある君[きみ]たち、またその地[ち]に住[す]む者[もの]たちである。"
  22: "また、占[うらな]い師[し]バラム、ベオルの子[こ]を、彼[かれ]らは戦[いくさ]のうちに殺[ころ]した。"
  23: "ルベンの境界[きょうかい]はヨルダン川[がわ]であった。これがルベンの子[こ]らの嗣業[しぎょう]であり、その氏族[しぞく]ごとの、彼[かれ]らの町々[まちまち]と集落[しゅうらく]である。"
  24: "モーセはまた、ガドの子[こ]らに、その氏族[しぞく]ごとに与[あた]えた。"
  25: "彼[かれ]らの境界[きょうかい]は、イアゼル、ギレアデのすべての町々[まちまち]、およびアンモンの子[こ]らの地[ち]の半分[はんぶん]、すなわちラバの向[む]かいにあるアロエルまでであった。"
  26: "また、エセボンから、マスシファに沿[そ]ったラモトまで、またボタニン、マハナイムからダビルの境界[きょうかい]まで、"
  27: "また、エメクにあるベト・アラム、ベト・ナブラ、ソコタ、サファン、およびエセボンの王[おう]シホンの残[のこ]りの王国[おうこく]。ヨルダン川[がわ]が境界[きょうかい]となって、ヨルダン川の向[む]こう側[がわ]、東[ひがし]のキネレトの海[うみ]の一部[いちぶ]に至[いた]る。"
  28: "これがガドの子[こ]らの嗣業[しぎょう]であり、その氏族[しぞく]ごとの、彼[かれ]らの町々[まちまち]と集落[しゅうらく]である。"
  29: "モーセはマナセの部族[ぶぞく]の半分[はんぶん]に、その氏族[しぞく]ごとに与[あた]えた。"
  30: "彼[かれ]らの境界[きょうかい]は、マハナイムから、バシャンの全[すべ]ての王国[おうこく]、バシャンの王[おう]オグの王国のすべて、およびバシャンにあるヤイルの村々[むらむら]、すなわち六十[ろくじゅう]の町[まち]であった。"
  31: "また、ギレアデの半分[はんぶん]、およびバシャンにあるオグの王国の町々[まちまち]であるアスタロトとエドライン。これらはマナセの子[こ]マキルの子ら、すなわちマナセの子マキルの子らの半分に、その氏族[しぞく]ごとに与[あた]えられた。"
  32: "これが、モーセがヨルダン川[がわ]の向[む]こう側[がわ]、モアブのアラボト、すなわちエリコの向かい、東[ひがし]の方[ほう]で嗣業[しぎょう]として与[あた]えたものである。"

notes:
  1: "Ἰησοῦς πρεσβύτερος προβεβηκὼς τῶν ἡμερῶν — «Иисус, старший, преуспевший в днях»: в LXX первая фраза без глагола (гебраизм, слав. «Иисус же состареся прошед дни»). προβαίνω — «продвигаться», о возрасте; 年を重ねて. ὑπολέλειπται — осталось (ὑπολείπω). εἰς κληρονομίαν — в наследие, т. е. для раздела."
  2: "ὅρια Φυλιστιιμ — пределы Филистимские (Φυλιστιιμ, フィリスティ人 — форма корпуса, ср. Быт 10:14). ὁ Γεσιρι καὶ ὁ Χαναναῖος — «Гесири и Хананей», единственное число: земли гессурская и ханаанская; в японском с 人. καταλελειμμένη — оставленная."
  3: "τῆς ἀοικήτου — «необитаемой» (пустыни), слав. «необитаемыя»; Синодальный здесь даёт «от Сихора» по масоретскому тексту. ἐξ εὐωνύμων τῶν Χαναναίων — «с левой стороны Хананеев», т. е. к северу от них (слав. «ошуюю»); 左, すなわち北. σατραπείαις — сатрапии, области (五つの地方). Пять владений названы по городам в дательном падеже: Γαζαῖος, Ἀζώτιος, Ἀσκαλωνίτης, Γεθθαῖος, Ακκαρωνίτης; Гат — Геф. τῷ Ευαίῳ — и Аввею (エビ人)."
  4: "ἐκ Θαιμαν — от Фемана (Θαιμαν, テマン, форма корпуса, ср. Быт 36:11; слав. «от феман»). ἐναντίον Γάζης — против Газы. οἱ Σιδώνιοι ἕως Αφεκ — Сидоняне до Афека (Αφεκ). ἕως τῶν ὁρίων τῶν Αμορραίων — до пределов Аморрейских. Стих продолжает перечень и не имеет сказуемого."
  5: "Γαβλι Φυλιστιιμ — «Гавл Филистимский»: слав. «гавли филистимлю», Синодальный «Гевла» (город Гевал/Библ); форма неясна, оставлена транслитерация ガブリ. ἀπὸ Γαλγαλ — «от Галгала»: в масоретском тексте здесь «от Ваал-Гада», LXX передаёт Γαλγαλ; в тексте ガルガル, с оговоркой в примечании. εἰσόδου Εμαθ — вход в Емаф, северный рубеж."
  6: "πᾶς ὁ κατοικῶν τὴν ὀρεινήν — всякий, живущий в нагорной стране (山地). Μασερεφωθμαιμ — Масрефоф-Майим (слав. «масрефофмаима»), местность у Ливана. ἐξολεθρεύσω — истреблю (ἐξολεθρεύω). διάδος — раздай (διαδίδωμι, повелительное). ὃν τρόπον σοι ἐνετειλάμην — как Я заповедал тебе."
  7: "μέρισον — раздели (μερίζω). ταῖς ἐννέα φυλαῖς καὶ τῷ ἡμίσει φυλῆς Μανασση — девяти племенам и половине племени Манассии. ἀπὸ τοῦ Ιορδάνου ἕως τῆς θαλάσσης τῆς μεγάλης — от Иордана до великого моря, т. е. Средиземного (大きな海). ἡ θάλασσα ἡ μεγάλη ὁριεῖ — великое море будет пределом (ὁρίζω)."
  8: "ταῖς δὲ δύο φυλαῖς... ἔδωκεν Μωϋσῆς — двум племенам дал Моисей; названы Ρουβην и Γαδ (ルベン, ガド). ἐν τῷ πέραν τοῦ Ιορδάνου — за Иорданом. κατ᾽ ἀνατολὰς ἡλίου — к востоку солнца. δέδωκεν αὐτὴν Μωϋσῆς ὁ παῖς κυρίου — повтор («дал её Моисей, раб Господень»); по-японски второй раз местоимением."
  9: "χεῖλος χειμάρρου — берег (букв. «губа») потока. Μισωρ — «равнина» (слав. «мисор»), оставлено как имя ミソル. Μαιδαβα — Медава (メダバ). Δαιβαν — Дивон; в тексте ダイボン, форма корпуса (ср. Числ 32:34), хотя здесь греч. Δαιβαν."
  10: "Σηων — Сигон (シホン, форма корпуса; слав. «сиона»). ὃς ἐβασίλευσεν ἐν Εσεβων — который царствовал в Есевоне (エセボン). ἕως τῶν ὁρίων υἱῶν Αμμων — до пределов сынов Аммона."
  11: "Γαλααδῖτιν — Галаадитида (ギレアデ, форма корпуса). ὅρια Γεσιρι καὶ τοῦ Μαχατι — пределы Гесира и Махата (слав. «гесури и махафи», Синодальный «Гессурскую и Маахскую»). Σελχα — Салха (サルハ). Βασανῖτιν — Васанитида (バシャン)."
  12: "ἐν Ασταρωθ καὶ ἐν Εδραιν — в Астарофе и Едраине (アスタロト, エドライン — формы корпуса, ср. Втор 1:4). οὗτος κατελείφθη ἀπὸ τῶν γιγάντων — «он остался из гигантов», т. е. из рефаимов (слав. «от исполинов»). ἐπάταξεν — поразил (πατάσσω)."
  13: "τὸν Γεσιρι καὶ τὸν Μαχατι καὶ τὸν Χαναναῖον — Гесира, Махата и Хананея (народы, а не города). οὐκ ἐξωλέθρευσαν — не истребили. κατῴκει βασιλεὺς Γεσιρι καὶ ὁ Μαχατι — «жил царь Гесира и Махат»: при одном глаголе два подлежащих. ἕως τῆς σήμερον ἡμέρας — до сего дня."
  14: "πλὴν τῆς φυλῆς Λευι — кроме племени Левия. κύριος ὁ θεὸς Ισραηλ, οὗτος αὐτῶν κληρονομία — Господь Бог Израилев, Он — наследие их. καταμερισμός — разделение, распределение (καταμερίζω). В греч. этот стих соединяет то, что в слав. разнесено на 14-й и 33-й стихи (33-й повторяет начало 14-го)."
  15: "ἔδωκεν Μωϋσῆς τῇ φυλῇ Ρουβην κατὰ δήμους αὐτῶν — дал Моисей племени Рувима по родам их (δῆμος — 氏族, форма корпуса)."
  16: "κατὰ πρόσωπον φάραγγος Αρνων — против ущелья Арнон. ἡ πόλις ἡ ἐν τῇ φάραγγι Αρνων — город, который в ущелье Арнон (слав. «в дебри арнонстей»). Μισωρ — равнина (ミソル)."
  17: "Εσεβων — Есевон (エセボン). Δαιβων — Дивон (ダイボン). Βαμωθβααλ — Вамоф-Ваал (バモト・バアル; слав. «вамоф-ваал»). οἴκου Βεελμων — «дом Веелмона», т. е. Беф-Ваал-Меон; передано ベエルメオンの家 (ベエルメオン — форма Числ 32)."
  18: "Ιασσα — Иасса (イアッサ; Синодальный «Иааца»). Κεδημωθ — Кедемоф (ケデモト). Μεφααθ — Мефааф (メファアト)."
  19: "Καριαθαιμ — Кариафаим (カリアタイム, форма корпуса, ср. Числ 32:37). Σεβαμα — Севама (セバマ, там же). Σεραδα — Серада. Σιωρ ἐν τῷ ὄρει Εμακ — Сиор на горе Емак (エメク)."
  20: "Βαιθφογωρ — Беф-Фогор (ベト・フォゴル; Синодальный «Беф-Фегор»). Ασηδωθ Φασγα — Асидоф-Фасга (слав. «асидоф-фасга»), т. е. Ашдот-Писга у подошвы Фасги. Βαιθασιμωθ — Беф-Асимоф (ベト・アシモト)."
  21: "τοὺς ἡγουμένους Μαδιαμ — вождей Мадиама (ἡγούμενος). Далее пять имён: Ευι, Ροκομ, Σουρ, Ουρ, Ροβε (エビ, レコム, スル, ウル, ロベ). ἄρχοντας παρὰ Σηων — князей при Сигоне (παρὰ с дательным). κατοικοῦντας τὴν γῆν — живущих в земле той."
  22: "τὸν μάντιν — прорицателя (μάντις). ἐν τῇ ῥοπῇ — «в поражении»: ῥοπή букв. «наклон, тяжесть»; слав. «в сражении», Синодальный «в числе убитых»; передано 戦のうちに. Слав. добавляет «сынове израилевы» и «мечем», чего в греч. нет."
  23: "Ιορδάνης ὅριον — Иордан — предел (пределом Рувима был Иордан). αἱ ἐπαύλεις αὐτῶν — дворы, усадьбы (слав. «села»); передано 集落, чтобы отличать от κῶμαι (村々)."
  24: "Ἔδωκεν δὲ Μωϋσῆς τοῖς υἱοῖς Γαδ κατὰ δήμους αὐτῶν — Моисей дал сынам Гада по родам их."
  25: "Ιαζηρ — Иазер (イアゼル, форма корпуса, ср. Числ 32:1). τὸ ἥμισυ γῆς υἱῶν Αμμων — половина земли сынов Аммона. ἕως Αροηρ, ἥ ἐστιν κατὰ πρόσωπον Ραββα — до Ароера, что против Раввы (ラバ); это другой Ароер, не арнонский."
  26: "Ραμωθ κατὰ τὴν Μασσηφα — Рамоф по Массефе, т. е. Рамаф-Мицфа. Βοτανιν — Вотанин (ボタニン). Μααναιν — Маанин; здесь и в ст. 30 это Маханаим, поэтому マハナイム (форма корпуса, ср. Быт 32:2), а не транслитерация. Δαβιρ — Давир (ダビル)."
  27: "ἐν Εμεκ — «в Емеке», т. е. в долине (слав. «во емеке»). Βαιθαραμ — Беф-Гарам (ベト・アラム). Βαιθαναβρα — Беф-Нимра (ベト・ナブラ). Σοκχωθα — Сокхоф (ソコタ). Σαφαν — Цафон (サファン). θάλασσα Χενερεθ — море Хиннереф (キネレトの海, Галилейское). ἕως μέρους — до части, до края."
  28: "αὕτη ἡ κληρονομία υἱῶν Γαδ — вот удел сынов Гада. αἱ πόλεις αὐτῶν καὶ αἱ ἐπαύλεις αὐτῶν — города их и дворы их (町々, 集落)."
  29: "τῷ ἡμίσει φυλῆς Μανασση — половине племени Манассии; вторая половина получает удел к западу от Иордана по жребию (гл. 17)."
  30: "ἀπὸ Μααναιμ — от Маханаима (Μααναιμ; マハナイム, см. ст. 26). κώμας Ιαιρ — селения Иаира (ヤイル, ср. Числ 32:41). ἑξήκοντα πόλεις — шестьдесят городов (六十)."
  31: "τὸ ἥμισυ τῆς Γαλααδ — половина Галаада. ἐν Ασταρωθ καὶ ἐν Εδραιν, πόλεις βασιλείας Ωγ — Астароф и Едрея, города царства Ога. τοῖς υἱοῖς Μαχιρ... καὶ τοῖς ἡμίσεσιν υἱοῖς Μαχιρ — сынам Махира и половине сынов Махира (повтор, как в греч.)."
  32: "οὓς κατεκληρονόμησεν Μωϋσῆς — которым дал в удел Моисей (κατακληρονομέω). πέραν τοῦ Ιορδάνου... κατὰ Ιεριχω ἀπὸ ἀνατολῶν — за Иорданом, против Иерихона, от востока. В слав. после этого стиха стоит 33-й (о левитах) — повтор начала 14-го; в греч. его нет."
