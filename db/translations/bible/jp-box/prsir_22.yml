# jp-box, Сирах, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: 1–2 ленивый; 3–6 сын и дочь, музыка в печали; 7–8 дефект-точки (склейка
# черепков, рассказ спящему); 9–13 плач о мёртвом и глупый; 14–18 свинец, песок,
# крепкая связь и сердце; 19–23 глаз, камень в птиц, друг, вера в бедности;
# 24–27 огонь, покров друга, молитва о страже уст.
# Прямая речь: 8 (слова дремлющего) и 27 (молитвенное восклицание, продолжающееся
# в 23:1–6) — в 「…」; кавычки внутри главы сбалансированы.
# Нумерация по gr: 27 стихов. Дефекты gr: 22:7 и 22:8 стоят как «.»; тот же текст
# (склейка черепков, рассказ спящему) в LXX стоит под 9–10, а csl читает его в 7–8.
# Переведено по csl 7–8, гр 9–10 отдельно не переводились (иначе был бы дубль);
# дальше наше деление: 9–10 = гр 11 (плач, две половины по csl 9–10), 11 = гр 12,
# 12–13 = гр 13 (csl 12–14), с 14 снова гр 14–27. Слав. — 31 стих: csl 9–10, 12–14,
# 19–20, 24–25, 26–27 делят соответственно гр 11, 13, 18, 22, 23.
# 〔…〕 нет; сносок ⟨…⟩ нет: 死, よみ, 友情, 舌 и пр. уже в корпусе.
# Имена — транслитерация греческого (LXX).

