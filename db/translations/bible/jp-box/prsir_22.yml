verses:
  1: "汚[よご]れた石[いし]に似[に]ているのは怠[なま]け者[もの]である。すべての人[ひと]がその不名誉[ふめいよ]をあざ笑[わら]う。"
  2: "牛[うし]の糞[ふん]に似[に]ているのは怠[なま]け者[もの]である。それを持[も]ち上[あ]げる者[もの]はみな手[て]を払[はら]う。"
  3: "無[む]教養[きょうよう]な子[こ]が生[う]まれることは父[ちち]の恥[はじ]であり、娘[むすめ]は辱[はずかし]めのために生まれる。"
  4: "分別[ふんべつ]ある娘[むすめ]は自分[じぶん]の夫[おっと]を嗣業[しぎょう]として得[え]る。しかし、恥[はじ]を知[し]らない娘は生[う]んだ者[もの]に悲[かな]しみをもたらす。"
  5: "厚[あつ]かましい女[おんな]は父[ちち]と夫[おっと]を辱[はずかし]め、その両方[りょうほう]から軽[かろ]んじられる。"
  6: "悲[かな]しみのときの音楽[おんがく]は、時[とき]をわきまえぬ話[はなし]のようなものである。しかし、鞭[むち]と戒[いまし]めはどんなときにも知恵[ちえ]に属[ぞく]する。"
  7: "陶片[とうへん]をはり合[あ]わせる者[もの]のように、愚[おろ]かな者[もの]に教[おし]える者[もの]はそうである。深[ふか]い眠[ねむ]りから眠[ねむ]っている者[もの]を起[おこ]す者もそうである。"
  8: "眠[ねむ]けむる者[もの]に物語[ものがたり]をする者[もの]のように、愚[おろ]かな者[もの]に物語をする者[もの]はそうである。そして終[お]わりに、彼[かれ]は言[い]う、「何[なに]のことか」と。"
  9: "死者[ししゃ]のために泣[な]け。光[ひかり]が消[き]え去[さ]ったからである。愚[おろ]かな者[もの]の上[うえ]でも泣け。悟[さと]りが消え去ったからである。"
  10: "死者[ししゃ]のためには、むしろ静[しず]かに泣け。彼[かれ]は休[やす]みを得[え]たからである。しかし愚[おろ]かな者[もの]の生[い]き方[かた]は、死[し]よりも悪[わる]い。"
  11: "死者[ししゃ]への悲[かな]しみは七日[なのか]である。しかし、愚[おろ]かな者[もの]と不敬[ふけい]な者[もの]とについては、その生[い]きる日[ひ]のすべてもそうである。"
  12: "愚[おろ]かな者[もの]とともに多[おお]くの言葉[ことば]を重[かさ]ねてはならない。無[む]分別[ふんべつ]な者[もの]のところへ行[い]ってはならない。"
  13: "彼[かれ]から身[み]を守[まも]れ。あなたが労苦[ろうく]を負[お]わず、彼[かれ]が身[み]を振[ふ]るうときに汚[けが]されないためである。彼から遠[とお]ざかれ。そうすれば安[やす]らぎを見[み]いだし、彼の無[む]分別[ふんべつ]に気[き]を病[や]まない。"
  14: "鉛[なまり]よりも重[おも]いものがあるだろうか。その名[な]は愚[おろ]かな者[もの]というほかないではないか。"
  15: "砂[すな]と塩[しお]と鉄[てつ]の塊[かたまり]を運[はこ]ぶほうが、無[む]分別[ふんべつ]な人[ひと]を運ぶよりもまだ楽[らく]である。"
  16: "木[き]の帯[おび]を建物[たてもの]に結[むす]びつければ、揺[ゆ]れても崩[くず]れない。そのように、思[おも]いめぐらされた計画[けいかく]の上[うえ]に据[す]えられた心[こころ]は、時[とき]が来[き]ても恐[おそ]れない。"
  17: "悟[さと]りの思[おも]いの上[うえ]に据[す]えられた心[こころ]は、削[けず]られた壁[かべ]の砂[すな]の飾[かざ]りのようである。"
  18: "高[たか]い所[ところ]に置[お]かれた杭[くい]は風[かぜ]に耐[た]えられない。そのように、愚[おろ]かな者[もの]の思[おも]いの上[うえ]にある臆病[おくびょう]な心[こころ]は、あらゆる恐[おそ]れに耐えられない。"
  19: "目[め]を刺[さ]す者[もの]は涙[なみだ]を流[なが]させる。心[こころ]を刺す者[もの]は感覚[かんかく]をあらわにする。"
  20: "鳥[とり]に向[む]かって石[いし]を投[な]げる者[もの]は鳥を追[お]い払[はら]う。友[とも]をののしる者[もの]は友情[ゆうじょう]を壊[こわ]す。"
  21: "友[とも]に向[む]かって剣[つるぎ]を抜[ぬ]いたなら、絶望[ぜつぼう]してはならない。帰[かえ]る道[みち]があるからである。"
  22: "友[とも]に向[む]かって口[くち]を開[ひら]いたなら、恐[おそ]れてはならない。和解[わかい]があるからである。しかし、ののしりと高慢[こうまん]と秘密[ひみつ]の暴露[ばくろ]と偽[いつわ]りの傷[きず]のゆえに、どんな友[とも]も逃[に]げ去[さ]る。"
  23: "貧[まず]しさのうちで隣人[りんじん]との信頼[しんらい]を得[え]よ。彼[かれ]の幸[さいわ]いのときに、あなたもともに満[み]たされるためである。苦難[くなん]のときには彼[かれ]とともにとどまれ。彼の嗣業[しぎょう]にあずかるためである。"
  24: "火[ひ]の前[まえ]に炉[ろ]の蒸気[じょうき]と煙[けむり]がある。そのように、血[ち]を流[なが]す前[まえ]にののしりがある。"
  25: "友[とも]をかばうことをわたしは恥[は]じない。彼[かれ]の顔[かお]から身[み]を隠[かく]すことはない。"
  26: "たとえ彼[かれ]のゆえにわたしに災[わざわ]いが降[ふ]りかかっても、聞[き]く者[もの]はみな彼から身[み]を守[まも]る。"
  27: "「だれがわたしの口[くち]に守[まも]りを置[お]き、わたしの唇[くちびる]にこうかんな封印[ふういん]をしてくれるだろうか。わたしがそれによって倒[たお]れ、わたしの舌[した]がわたしを滅[ほろ]ぼさないためである。」"

notes:
  1: "λίθῳ ἠρδαλωμένῳ — «камню выпачканному (нечистому)» (ῥδαλόω, слав. «камени нечистому»). συνεβλήθη — «уподоблен» (συμβάλλω). ἐκσυριεῖ — «освищет, осмеёт» (ἐκσυρίζω); ἀτιμία — бесчестие, 不名誉."
  2: "βολβίτῳ κοπρίων — «воловий помёт» (βόλβιτον; слав. «кал воловей»). ὁ ἀναιρούμενος — «поднимающий» (ἀναιρέω здесь «брать»). ἐκτινάξει χεῖρα — «отряхнёт руку»: с отвращением, как и в 22:1."
  3: "αἰσχύνη πατρὸς ἐν γεννήσει ἀπαιδεύτου — «стыд отцу в рождении невоспитанного (сына)». θυγάτηρ ἐπ᾽ ἐλαττώσει γίνεται — «дочь рождается на умаление (унижение)» (ἐλάττωσις; слав. «на умаление»)."
  4: "θυγάτηρ φρονίμη κληρονομήσει ἄνδρα αὐτῆς — «разумная дочь наследит мужа своего» (κληρονομέω), т. е. приобретёт. ἡ καταισχύνουσα — «срамная, бесстыдная» (καταισχύνω). εἰς λύπην γεννήσαντος — «в печаль родившему»."
  5: "πατέρα καὶ ἄνδρα καταισχύνει ἡ θρασεῖα — «отца и мужа посрамляет дерзкая» (θρασύς; слав. «продерзая»). ὑπὸ ἀμφοτέρων ἀτιμασθήσεται — «от обоих обесчещена будет»."
  6: "μουσικὰ ἐν πένθει — «музыка в плаче»; ἄκαιρος διήγησις — «не вовремя рассказ» (ἄκαιρος). μάστιγες καὶ παιδεία — «бичи и наказание». ἐν παντὶ καιρῷ σοφίας — «во всякое время — премудрости», т. е. всегда уместны."
  7: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля). Переведено по csl 22:7: «Яко слепляяй чрепие, тако учай буяго...». Тот же греч. текст (συγκολλῶν ὄστρακον ὁ διδάσκων μωρόν, ἐξεγείρων καθεύδοντα ἐκ βαθέος ὕπνου) в LXX стоит под 22:9; отдельно 9 не переводился, чтобы не было дубля."
  8: "В gr-lxx-byz «.» (дефект). Переведено по csl 22:8: «поведает дремлющему поведаяй буему, и на концы речет: что есть?». Греч. текст (διηγούμενος νυστάζοντι... ἐπὶ συντελείᾳ ἐρεῖ· Τί ἐστιν;) в LXX стоит под 22:10. Слова дремлющего — в 「…」."
  9: "ἐπὶ νεκρῷ κλαῦσον — «над мёртвым плачь»; ἐξέλιπεν γὰρ φῶς — «ибо свет оставил (его)». ἐπὶ μωρῷ κλαῦσον, ἐξέλιπεν γὰρ σύνεσιν — «над глупым плачь, ибо разумение оставило». Греч. 22:11 в csl делится на 9–10."
  10: "ἥδιον κλαῦσον ἐπὶ νεκρῷ — «скорее (лучше) плачь о мёртвом» (ἥδιον, сравн. от ἡδύς); ὅτι ἀνεπαύσατο — «ибо упокоился». τοῦ δὲ μωροῦ ὑπὲρ θάνατον ἡ ζωὴ πονηρά — «жизнь глупого хуже смерти»."
  11: "πένθος νεκροῦ ἑπτὰ ἡμέραι — «плач о мёртвом — семь дней» (слав. «седмь дний»). μωροῦ καὶ ἀσεβοῦς πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ — «глупого и нечестивого — все дни жизни его»."
  12: "μετὰ ἄφρονος μὴ πληθύνῃς λόγον — «с глупым не умножай слова» (πληθύνω). πρὸς ἀσύνετον μὴ πορεύου — «к неразумному не ходи». Греч. 22:13a; csl 22:12."
  13: "φύλαξαι ἀπ᾽ αὐτοῦ — «берегись его»; ἵνα μὴ κόπον ἔχῃς — «чтобы не иметь труда (неприятности)»; μολυνθῇς ἐν τῷ ἐντιναγμῷ αὐτοῦ — «не оскверниться от его отрясения» (ἐντιναγμός, слав. «отрясение»). ἔκκλινον — «уклонись»; ἀκηδιάσῃς ἐν τῇ ἀπονοίᾳ αὐτοῦ — «не изнеможешь (не впадёшь в уныние) от его безумия» (ἀπονοία). Греч. 22:13b–c, csl 13–14."
  14: "ὑπὲρ μόλιβον — «более свинца» (μόλιβδος; слав. «паче олова»). τί βαρυνθήσεται — «что отяжелеет». τί αὐτῷ ὄνομα ἀλλ᾽ ἢ μωρός — «какое ему имя, кроме глупого»."
  15: "ἄμμον καὶ ἅλα καὶ βῶλον σιδήρου — «песок, соль и глыбу железа» (βῶλος — ком, глыба); εὔκοπον ὑπενεγκεῖν — «легче понести» (ὑποφέρω). ἢ ἄνθρωπον ἀσύνετον — «нежели человека неразумного»."
  16: "Ἱμάνωσις ξυλίνη — «деревянная связь, скрепа» (ἱμάνωσις; слав. «сключение древяно»). ἐν συσσεισμῷ οὐ διαλυθήσεται — «при сотрясении не распадётся». καρδία ἐστηριγμένη ἐπὶ διανοήματος βουλῆς — «сердце, утверждённое на размышлении совета»."
  17: "καρδία ἡδρασμένη ἐπὶ διανοίας συνέσεως — «сердце, утверждённое на размышлении разума» (ἑδράζω). ὡς κόσμος ψαμμωτός — «как украшение песчаное» (ψαμμωτός; слав. «украшение песочное»); τοίχου ξυστοῦ — «стены вытесанной» (ξυστός)."
  18: "χάρακες ἐπὶ μετεώρου κείμενοι — «колья (подпорки), лежащие на высоте» (χάραξ; слав. «острози»). κατέναντι ἀνέμου οὐ μὴ ὑπομείνωσιν — «против ветра не устоят». καρδία δειλή — «сердце робкое»; κατέναντι παντὸς φόβου — «против всякого страха»."
  19: "Ὁ νύσσων ὀφθαλμόν — «колющий (пронзающий) глаз» (νύσσω); κατάξει δάκρυα — «исторгнет слёзы». νύσσων καρδίαν ἐκφαίνει αἴσθησιν — «колющий сердце выявляет чувство (боль)» (αἴσθησις)."
  20: "βάλλων λίθον ἐπὶ πετεινά — «бросающий камень в птиц»; ἀποσοβεῖ αὐτά — «отгоняет их» (ἀποσοβέω). ὁ ὀνειδίζων φίλον διαλύσει φιλίαν — «порицающий друга разрушит дружбу» (φιλία — 友情)."
  21: "ἐπὶ φίλον ἐὰν σπάσῃς ῥομφαίαν — «если на друга извлечёшь меч» (σπάω — обнажать). μὴ ἀφελπίσῃς — «не отчаивайся» (ἀφελπίζω); ἔστιν γὰρ ἐπάνοδος — «ибо есть возврат»."
  22: "ἐπὶ φίλον ἐὰν ἀνοίξῃς στόμα — «если на друга откроешь уста»; μὴ εὐλαβηθῇς — «не убойся»; διαλλαγή — «примирение». πλὴν ὀνειδισμοῦ... μυστηρίου ἀποκαλύψεως καὶ πληγῆς δολίας — «кроме поношения, открытия тайны и коварного удара»; ἐν τούτοις ἀποφεύξεται πᾶς φίλος — «из-за этого убежит всякий друг». Греч. 22:22 целиком (csl делит на 23–24)."
  23: "πίστιν κτῆσαι ἐν πτωχείᾳ μετὰ τοῦ πλησίον — «приобрети верность (доверие) в бедности с ближним» (πίστις здесь верность). ἵνα ἐν τοῖς ἀγαθοῖς αὐτοῦ ὁμοῦ πλησθῇς — «чтобы в благах его вместе насытиться». ἐν καιρῷ θλίψεως διάμενε αὐτῷ — «во время скорби пребудь с ним»; συγκληρονομήσῃς — «сонаследуешь»."
  24: "πρὸ πυρὸς ἀτμὶς καμίνου καὶ καπνός — «перед огнём — пар печи и дым» (ἀτμίς, κάμινος). πρὸ αἱμάτων λοιδορίαι — «перед кровью (кровопролитием) — ссоры (поношения)» (λοιδορία)."
  25: "φίλον σκεπάσαι οὐκ αἰσχυνθήσομαι — «друга покрыть (защитить) не постыжусь» (σκεπάζω). ἀπὸ προσώπου αὐτοῦ οὐ μὴ κρυβῶ — «от лица его не скроюсь»."
  26: "καὶ εἰ κακά μοι συμβήσεται δι᾽ αὐτόν — «и если злое случится мне из-за него». πᾶς ὁ ἀκούων φυλάξεται ἀπ᾽ αὐτοῦ — «всякий слышащий остережётся его»."
  27: "Τίς δώσει ἐπὶ στόμα μου φυλακήν — «кто даст устам моим стражу»; σφραγῖδα πανοῦργον — «печать искусную (крепкую)»; ἵνα μὴ πέσω ἀπ᾽ αὐτῆς — «чтобы мне не пасть от неё» (от уст); ἡ γλῶσσά μου ἀπολέσῃ με — «язык мой не погубил меня». Молитвенное восклицание, продолжающееся в 23:1–6; кавычки закрыты в конце стиха (глава сбалансирована)."
