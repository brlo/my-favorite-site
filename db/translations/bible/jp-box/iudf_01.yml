verses:
  1: "大[おお]いなる都[みやこ]ニネベでアッシリア人[じん]を治[おさ]めていた王[おう]、ネブカドネツァルの治世[ちせい]の第十二年[だいじゅうにねん]、メディア人[じん]をエクバタナで治めていたアルファクサドの日々[ひび]に、"
  2: "アルファクサドはエクバタナの周[まわ]りに、切[き]り石[いし]の城壁[じょうへき]を築[きず]いた。その石は幅[はば]三[さん]キュビト、長[なが]さ六[ろく]キュビトであり、城壁の高[たか]さを七十[ななじゅう]キュビト、その幅を五十[ごじゅう]キュビトとした。"
  3: "また、その城門[じょうもん]の上[うえ]に百[ひゃく]キュビトの塔[とう]を立[た]て、その幅[はば]を六十[ろくじゅう]キュビトに基礎[きそ]づけた。"
  4: "また、その城門を、高[たか]さ七十[ななじゅう]キュビトに上[のぼ]る門とし、その幅[はば]を四十[よんじゅう]キュビトとした。それは、彼の強[つよ]い者[もの]たちの軍勢[ぐんぜい]が出陣[しゅつじん]し、その歩兵[ほへい]の隊列[たいれつ]が整[ととの]うためであった。"
  5: "そのころ、王[おう]ネブカドネツァルはアルファクサド王と戦[たたか]いを起[おこ]した。大[おお]きな平原[へいげん]、すなわちラガウの境[さかい]にある平原でのことであった。"
  6: "山[やま]の地方[ちほう]に住[す]むすべての者[もの]、ユーフラテス、ティグリス、ヒュダスペスの川辺[かわべ]に住むすべての者、エリマイ人[じん]の王[おう]アリオクの平野[へいげん]に住む者も彼[かれ]のもとに来[き]て、多[おお]くの国民[こくみん]がヘレウドの子[こ]らの陣[じん]に加[くわ]わるために集まった。"
  7: "アッシリアの王[おう]ネブカドネツァルは、ペルシアに住むすべての者、西[にし]の方[ほう]に住むすべての者、すなわちキリキア、ダマスコ、レバノン、アンティレバノンに住む者、海辺[うみべ]の地[ち]の面[おもて]に住むすべての者に使者[ししゃ]を遣[つか]わし、"
  8: "カルメルとギレアデの諸国民[しょこくみん]の間[あいだ]にいる者、上[かみ]ガリラヤ、そしてエスドレロンの大[おお]きな平原[へいげん]にも、"
  9: "サマリアとそのすべての都[みやこ]にいるすべての者、ヨルダンの向[む]こう岸[ぎし]からエルサレムに至[いた]るまで、バタネ、ヘルス、カデス、エジプトの川[かわ]、タフナス、ラメセス、そしてゲセムの全[すべ]ての地[ち]にも、"
  10: "エジプトに住むすべての者、タニスとメンフィスの上[うえ]に達[たっ]するまで、エチオピアの境[さかい]に達するまでの者にも、使者[ししゃ]を遣[つか]わした。"
  11: "しかし、その地[ち]のすべてに住む者たちは、アッシリアの王[おう]ネブカドネツァルの言葉[ことば]を侮[あなど]り、彼とともに戦[たたか]いに加[くわ]わらなかった。彼らは彼を恐[おそ]れなかったからである。彼は彼らの前[まえ]では一人[ひとり]の男[おとこ]のようであった。彼らは彼の使者[ししゃ]たちを、自分[じぶん]たちの前で辱[はずかし]めて、空[から]の手[て]で送[おく]り返[かえ]した。"
  12: "ネブカドネツァルはこの全[すべ]ての地[ち]に対して激[はげ]しく怒[いか]り、自分の王座[おうざ]と王国[おうこく]にかけて、必[かなら]ずキリキア、ダマスコ、シリアのすべての境[さかい]に報[むく]い、自分の剣[つるぎ]ですべてを滅[ほろ]ぼし、モアブの地に住むすべての者、アンモンの子[こ]ら、ユダヤのすべて、そして二[ふた]つの海[うみ]の境に達[たっ]するまでエジプトにいるすべての者をも滅ぼすと誓[ちか]った。"
  13: "十七年[じゅうななねん]に、彼は自分の軍勢[ぐんぜい]を率[ひき]いてアルファクサド王[おう]と戦[たたか]いの陣[じん]を敷[し]き、その戦[いくさ]で強[つよ]くなって、アルファクサドの全軍[ぜんぐん]、その騎兵[きへい]のすべて、その戦車[せんしゃ]のすべてを押[お]し返[かえ]した。"
  14: "そしてアルファクサドのすべての都[みやこ]を支配[しはい]し、エクバタナにまで至[いた]って、その塔[とう]どもを取[と]り、その広場[ひろば]を略奪[りゃくだつ]し、その美[うつく]しさをその辱[はずかし]めと変[か]えた。"
  15: "彼はラガウの山々[やまやま]でアルファクサドを捕[と]らえ、自分の投槍[なげやり]で彼を刺[さ]し貫[つらぬ]き、かの日[ひ]まで彼を滅[ほろ]ぼし尽[つ]くした。"
  16: "彼も、自分の混[ま]じり合[あ]った軍[ぐん]のすべても、彼らとともにニネベへ帰[かえ]った。それは非常[ひじょう]に多[おお]い戦士[せんし]の群[む]れであった。彼はそこに、自分もその軍勢[ぐんぜい]も百二十日[ひゃくにじゅうにち]の間[あいだ]、くつろぎ、酒宴[しゅえん]を開[ひら]いて過[す]ごした。"

notes:
  1: "Ἔτους δωδεκάτου τῆς βασιλείας Ναβουχοδονοσορ — «двенадцатого года царства Навуходоносора»: родительный времени, сказуемого нет, фраза продолжается в ст. 2. ὃς ἐβασίλευσεν Ἀσσυρίων ἐν Νινευη τῇ πόλει τῇ μεγάλῃ — «который царствовал над ассирийцами в Ниневе, городе великом»: относительное придаточное о Навуходоносоре передано препозитивным оборотом. ἐν ταῖς ἡμέραις Αρφαξαδ … ἐν Ἐκβατάνοις — «во дни Арфаксада… в Екбатанах»; слав. «вторагонадесять» — двенадцатый, «во екватанех» — в Екбатанах."
  2: "ᾠκοδόμησεν ἐπ᾽ Ἐκβατάνων κύκλῳ τείχη — «построил вокруг Екбатан стены» (κύκλῳ — «кругом»; ἐπί с род. — «при, у»). ἐκ λίθων λελαξευμένων — «из камней тёсаных» (λαξεύω — «обтёсывать»). εἰς πλάτος πηχῶν τριῶν καὶ εἰς μῆκος πηχῶν ἕξ — «в ширину три локтя, в длину шесть»: это размеры камней, а не стены. τὸ ὕψος τοῦ τείχους πηχῶν ἑβδομήκοντα καὶ τὸ πλάτος αὐτοῦ πηχῶν πεντήκοντα — высота стены 70, ширина 50 локтей; необычная толщина сохранена без сглаживания."
  3: "τοὺς πύργους αὐτοῦ ἔστησεν ἐπὶ ταῖς πύλαις αὐτῆς — «башни его поставил над воротами её»: в греч. смена рода (αὐτοῦ / αὐτῆς), колебание между стеной и городом; слав. «столпы ея постави на вратех его». πηχῶν ἑκατόν — «в сто локтей». τὸ πλάτος αὐτῆς ἐθεμελίωσεν εἰς πήχεις ἑξήκοντα — «ширину её основал в шестьдесят локтей» (θεμελιόω — «класть основание»), т. е. основание шириной в 60 локтей."
  4: "πύλας διεγειρομένας εἰς ὕψος πηχῶν ἑβδομήκοντα — «врата, воздвигнутые в высоту семидесяти локтей» (διεγείρω — «поднимать»; слав. «воздвижена»). εἰς ἐξόδους δυνάμεως δυνατῶν αὐτοῦ — «для выхода силы сильных его», т. е. для выступления войска. διατάξεις τῶν πεζῶν αὐτοῦ — «устроения пеших его», боевые порядки пехоты (διάταξις — «распорядок, строй»)."
  5: "ἐποίησεν πόλεμον … πρὸς βασιλέα Αρφαξαδ — «сделал войну против царя Арфаксада»: ποιέω πόλεμον — семитический оборот, «начал войну». ἐν τῷ πεδίῳ τῷ μεγάλῳ — «на великой равнине». τοῦτό ἐστιν πεδίον ἐν τοῖς ὁρίοις Ραγαυ — «это равнина в пределах Рагава»: пояснение, а не второй топоним; слав. «в пределех рагавлих»."
  6: "συνήντησαν πρὸς αὐτόν — «сошлись к нему» (συναντάω — «сходиться, встречать»). τὴν ὀρεινήν — «нагорная страна», слав. «горняя». τοὺς κατοικοῦντας τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην — «живущих при Евфрате, Тигре и Гидаспе» (винитив места при κατοικέω). πεδία Αριωχ βασιλέως Ἐλυμαίων — «равнины Ариоха, царя елимеев» (эламитов; слав. «елимеонска»). εἰς παράταξιν υἱῶν Χελεουδ — «в ополчение сынов Хелеуда»: тёмное имя, оставлено транслитерацией (ヘレウド); слав. добавляет «зело», чего в LXX нет."
  7: "ἀπέστειλεν … ἐπὶ πάντας τοὺς κατοικοῦντας — «послал ко всем живущим»: ἐπί с винитивом при ἀποστέλλω означает адресата. τὴν Περσίδα — Персида (Персия), слав. «в персиде». πρὸς δυσμαῖς — «к западу» (δυσμή — «заход»). κατὰ πρόσωπον τῆς παραλίας — «напротив приморья», т. е. вдоль морского берега; слав. «на лицы примория». Список продолжается в ст. 8–10 при одном сказуемом ἀπέστειλεν."
  8: "τοὺς ἐν τοῖς ἔθνεσι τοῦ Καρμήλου καὶ Γαλααδ — «тех, что среди народов Кармила и Галаада» (ἔθνη — «народы, язычники»). τὴν ἄνω Γαλιλαίαν — «верхнюю Галилею» (ἄνω — «выше»). τὸ μέγα πεδίον Εσδρηλων — «великая равнина Ездрилона»; слав. «есдрилона», Син. «Ездрилон». Продолжение перечня адресатов посольства."
  9: "πάντας τοὺς ἐν Σαμαρείᾳ καὶ ταῖς πόλεσιν αὐτῆς — «всех в Самарии и городах её». πέραν τοῦ Ιορδάνου ἕως Ιερουσαλημ — «за Иорданом до Иерусалима». Βατανη, Χελους, Καδης — Батане, Хелус, Кадес; слав. читает «ветани», «хелла», «кадиса» — иные огласовки тех же мест, в тексте даны формы LXX. ποταμός Αἰγύπτου — «река Египетская» (пограничный поток); Ταφνας καὶ Ραμεσση — Тафны и Рамессы (Раамсес), πᾶσαν γῆν Γεσεμ — «вся земля Гесем»."
  10: "ἕως τοῦ ἐλθεῖν ἐπάνω Τάνεως καὶ Μέμφεως — «до прихода выше Таниса и Мемфиса»: ἐπάνω с род. — «выше, за»; слав. «дондеже приити выше таниса и мемфиса». ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῆς Αἰθιοπίας — «до прихода к пределам Эфиопии». Оба ἕως относятся к живущим в Египте: перечень доходит до эфиопской границы. Здесь список завершается, поэтому сказуемое, начатое в ст. 7, повторено."
  11: "ἐφαύλισαν — «уничижили, презрели» (φαυλίζω). τὸ ῥῆμα — «слово, приказ». οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον — «не собрались к нему на войну». ὅτι οὐκ ἐφοβήθησαν αὐτόν — «потому что не убоялись его»; ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ εἷς — «был пред ними как один муж», т. е. ничем не страшнее любого (слав. «аки муж един»). ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενούς — «возвратили посланников его пустыми» (ἀναστρέφω — «поворачивать назад»); ἐν ἀτιμίᾳ προσώπου αὐτῶν — «в бесчестии лица их»."
  12: "ἐθυμώθη … σφόδρα — «воспылал гневом весьма» (θυμόω). ὤμοσε κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ — «поклялся престолом и царством своим» (κατά с род. в клятве). εἰ μὴν ἐκδικήσειν — «что непременно отомстит»: εἰ μήν — усилительная клятвенная частица, передана 必ず; слав. «всячески отмстити». ἀνελεῖν τῇ ῥομφαίᾳ — «истребить мечом»; ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῶν δύο θαλασσῶν — «до пределов двух морей»."
  13: "παρετάξατο ἐν τῇ δυνάμει αὐτοῦ πρὸς Αρφαξαδ — «ополчился с войском своим против Арфаксада» (παρατάσσομαι — «строиться в боевой порядок»). ἐν τῷ ἔτει τῷ ἑπτακαιδεκάτῳ — «в семнадцатый год». ἐκραταιώθη ἐν τῷ πολέμῳ αὐτοῦ — «укрепился на войне своей» (κραταιόω), т. е. одолел. ἀνέστρεψεν πᾶσαν τὴν δύναμιν — «обратил вспять всё войско»; слав. «победи», Син. «обратил в бегство», в тексте 押し返した по ἀναστρέφω."
  14: "ἐκυρίευσε τῶν πόλεων αὐτοῦ — «овладел городами его» (κυριεύω с род.); αὐτοῦ относится к Арфаксаду, поэтому в тексте названо имя. ἀφίκετο ἕως Ἐκβατάνων — «дошёл до Екбатан». ἐκράτησε τῶν πύργων — «захватил башни». ἐπρονόμευσε τὰς πλατείας αὐτῆς — «разграбил улицы её» (προνομεύω — «опустошать, брать добычу»; πλατεῖα — «широкая улица»). τὸν κόσμον αὐτῆς ἔθηκεν εἰς ὄνειδος αὐτῆς — «красоту её обратил в поношение её» (κόσμος здесь — «украшение»); смена αὐτοῦ / αὐτῆς сохранена местоимением その."
  15: "ἔλαβεν τὸν Αρφαξαδ ἐν τοῖς ὄρεσι Ραγαυ — «взял Арфаксада на горах Рагава» (λαμβάνω — «захватить»). κατηκόντισεν αὐτὸν ἐν ταῖς σιβύναις αὐτοῦ — «пронзил его своими копьями» (κατακοντίζω — «поражать копьём»; σιβύνη — «метательное копьё, дротик»); слав. «избоде его сулицами». ἐξωλέθρευσεν αὐτὸν ἕως τῆς ἡμέρας ἐκείνης — «истребил его до того дня»: тёмный оборот, слав. «даже в день оный», Син. «в тот же день»; буквально かの日まで."
  16: "ἀνέστρεψεν μετ᾽ αὐτῶν — «возвратился с ними»; слав. добавляет «в ниневию» — этого нет в LXX, но по паритету внесено в основной текст без скобок (ニネベへ). ὁ σύμμικτος αὐτοῦ — «смешанный люд его» (σύμμικτος — «смешанный»), сброд, шедший с войском; πλῆθος ἀνδρῶν πολεμιστῶν πολὺ σφόδρα — «весьма многое множество мужей воинских». ῥᾳθυμῶν — «предаваясь покою» (ῥᾳθυμέω — «жить в неге, беззаботно»); εὐωχούμενος — «пируя» (εὐωχέομαι); ἐφ᾽ ἡμέρας ἑκατὸν εἴκοσι — «сто двадцать дней»."
