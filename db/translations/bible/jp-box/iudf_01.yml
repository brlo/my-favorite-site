# jp-box, Иудифь, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Иудифи нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: 12-й год Навуходоносора и дни Арфаксада (1), стены и башни Екбатан (2–4),
# война на великой равнине у Рагава (5), сбор народов (6), посольство на запад,
# к Киликии, Дамаску, Ливану и до Египта (7–10), отказ и поругание послов (11),
# клятва отомстить (12), победа над Арфаксадом в 17-й год (13–15),
# возвращение в Ниневию и 120 дней пира (16).
# Прямой речи нет; красного и синего нет.
# Нумерация по gr: 16 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавление «в ниневию» (16) внесено
# в основной текст без скобок, как и положено по паритету.
# Сносок ⟨…⟩ нет: 城壁, キュビト, 塔, 王座, 騎兵, 戦車, 使者, 陣営 уже в корпусе.
# Имена и топонимы — транслитерация греческого (LXX); слав. формы имён в 1:9 иные.

