verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]。記念[きねん]のために。"
  1: "主[しゅ]よ、わたしを救[すく]ってください。神[かみ]よ、わたしを助[たす]けるために心[こころ]を向[む]けてください。"
  2: "わたしの魂[たましい]を求[もと]める者[もの]たちが恥[は]じ、辱[はずかし]めを受けますように。わたしに災[わざわ]いを望[のぞ]む者[もの]たちが後[うし]ろに退[しりぞ]き、辱[はずかし]められますように。"
  3: "「ああ、よかった、よかった」とわたしに言[い]う者[もの]たちが、ただちに退[しりぞ]いて恥[は]じますように。"
  4: "あなたを求[もと]める者[もの]たちがみな、あなたにあって喜[よろこ]び、楽[たの]しみますように。あなたの救[すく]いを愛[あい]する者[もの]たちが、「神[かみ]は大[おお]きくほめたたえられるように」といつも言[い]いますように。"
  5: "わたしは貧[まず]しく、乏[とぼ]しい。神[かみ]よ、わたしを助[たす]けてください。あなたはわたしの助[たす]け、わたしを贖[あがな]う方[かた]である。主[しゅ]よ、遅[おく]れないでください。"

notes:
  0: "Εἰς τὸ τέλος· τῷ Δαυιδ εἰς ἀνάμνησιν — «в конец, Давиду, в воспоминание»; 指揮者に。ダビデの詩。記念のために。 ἀνάμνησις — 記念 (слав. «в воспоминание»). Надписание — стих 0; скобками не маркируется."
  1: "εἰς τὸ σῶσαί με κύριον — «во еже спасти мя Господу»; в слав. это конец надписания, в греч. базе — начало ст. 1, поэтому передано как моление: 主よ、わたしを救ってください. Ὁ θεός, εἰς τὴν βοήθειάν μου πρόσχες — 神よ、わたしを助けるために心を向けてください (προσέχω — «внимать»; βοήθεια — «помощь»; слав. «в помощь мою вонми»)."
  2: "αἰσχυνθείησαν καὶ ἐντραπείησαν οἱ ζητοῦντές μου τὴν ψυχήν — わたしの魂を求める者たちが恥じ、辱めを受けますように (αἰσχύνομαι, ἐντρέπω — два глагола посрамления, оба переданы). ἀποστραφείησαν εἰς τὰ ὀπίσω — 後ろに退き (ἀποστρέφω — «обращать назад»). οἱ βουλόμενοί μοι κακά — わたしに災いを望む者たち (βούλομαι — «желать»)."
  3: "ἀποστραφείησαν παραυτίκα αἰσχυνόμενοι — ただちに退いて恥じますように (παραυτίκα — «тотчас»). οἱ λέγοντές μοι Εὖγε εὖγε — 「ああ、よかった、よかった」と言う者たち (εὖγε — восклицание одобрения и насмешки; слав. «благо же, благо же»; ru-база «хорошо! хорошо!»). Насмешка врагов — 「」 (первый уровень)."
  4: "ἀγαλλιάσθωσαν καὶ εὐφρανθήτωσαν ἐπὶ σοί — あなたにあって喜び、楽しみますように (ἀγαλλιάομαι — «ликовать»). λεγέτωσαν διὰ παντός — いつも言いますように (διά παντός — «непрестанно»). Μεγαλυνθήτω ὁ θεός — 「神は大きくほめたたえられるように」 (слав. «да возвеличится Господь»; в базе θεός — 神). οἱ ἀγαπῶντες τὸ σωτήριόν σου — あなたの救いを愛する者たち."
  5: "ἐγὼ δὲ πτωχὸς καὶ πένης — わたしは貧しく、乏しい (πτωχός, πένης — два слова бедности, оба переданы). βοηθός μου καὶ ῥύστης μου εἶ σύ — あなたはわたしの助け、わたしを贖う方 (ῥύστης — «избавитель»; слав. «Помощник мой и Избавитель мой»). κύριε, μὴ χρονίσῃς — 主よ、遅れないでください (χρονίζω — «медлить»; слав. «не закосни»)."
