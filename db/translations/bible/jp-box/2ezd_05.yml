verses:
  1: "その後[あと]、氏族[しぞく]の家[いえ]の長[かしら]たちが、自分[じぶん]の部族[ぶぞく]ごとに上[のぼ]るために選[えら]ばれた。彼[かれ]らの妻[つま]たち、息子[むすこ]たち、娘[むすめ]たち、男[おとこ]の奴隷[どれい]たち、女[おんな]の奴隷[どれい]たち、そして彼らの家畜[かちく]も、ともに選ばれた。"
  2: "ダリウス王[おう]は彼[かれ]らとともに千[せん]の騎兵[きへい]を遣[つか]わし、音楽[おんがく]、太鼓[たいこ]、笛[ふえ]とともに、平和[へいわ]のうちに彼らをエルサレムへ連[つ]れ帰[かえ]らせた。"
  3: "彼[かれ]らの兄弟[きょうだい]たちはみな喜[よろこ]び遊[あそ]んでいた。王[おう]は彼らを、かの者[もの]たちとともに上[のぼ]らせた。"
  4: "これは、氏族[しぞく]ごとに、自分[じぶん]の部族[ぶぞく]のうちで自分の氏族の組[くみ]に従[したが]って上[のぼ]って来[き]た男[おとこ]たちの名[な]である。"
  5: "祭司[さいし]たち、すなわちピネハスの子[こ]ら、アロンの子である者[もの]たち。イエシュアはヨセデクの子、ヨセデクはサライアの子、ヨヤキムはゾロバベルの子、ゾロバベルはサラティエルの子であり、ダビデの家[いえ]から、ファレスの血統[けっとう]から、ユダの部族[ぶぞく]の者である。"
  6: "この者[もの]は、ペルシアの王[おう]ダリウスのもとで、その治世[ちせい]の第二年[だいにねん]、第一[だいいち]の月[つき]、すなわちニサンの月に、知恵[ちえ]ある言葉[ことば]を語[かた]った。"
  7: "これらはユダヤから上[のぼ]って来[き]た者[もの]たちで、寄留[きりゅう]の捕囚[ほしゅう]から出[で]て来た者たちである。バビロンの王[おう]ネブカドネツァルがバビロンへ移[うつ]した者たちである。"
  8: "また、彼[かれ]らはエルサレムとユダヤのほかの地[ち]へ戻[もど]り、それぞれ自分[じぶん]の町[まち]へ帰[かえ]った。彼らはゾロバベル、イエシュア、ネヘミヤ、サライア、レサイオ、エニニオ、モルデカイ、ベエルサロ、アスファラソ、ボロリオ、ロイモ、バアナとともに来[き]た者[もの]たちであり、これらの者たちが彼らの先[さき]に立[た]つ者たちであった。"
  9: "民[たみ]のうちから来た者[もの]の数[かず]と、彼[かれ]らの先[さき]に立[た]つ者たちは次[つぎ]のとおりである。フォロスの子[こ]らは二千百七十二人[にん]。"
  10: "サファトの子[こ]らは四百七十二人[にん]。アレエの子らは七百五十六人[にん]。"
  11: "ファアトモアブの子[こ]ら、すなわちイエシュアとヨアブの子らのうちの者[もの]たちは二千八百十二人[にん]。"
  12: "オラモの子[こ]らは千二百五十四人[にん]。ザトゥの子らは九百四十五人[にん]。ホルベの子らは七百五人[にん]。バニの子らは六百四十八人[にん]。"
  13: "ベバイの子[こ]らは六百二十三人[にん]。アスガドの子らは三千二百二十二人[にん]。"
  14: "アドニカムの子[こ]らは六百六十七人[にん]。バゴイの子らは二千六十六人[にん]。アディヌの子らは四百五十四人[にん]。"
  15: "アテルの子[こ]ら、すなわちエゼキヤに属[ぞく]する者[もの]たちは九十二人[にん]。キランとアゼタスの子らは六十七人[にん]。アズルの子らは四百三十二人[にん]。"
  16: "アンニアスの子[こ]らは百一人[にん]。アロムの子らは三十二人[にん]。バッサイの子らは三百二十三人[にん]。アリフの子らは百二人[にん]。"
  17: "バイテルスの子[こ]らは三千五人[にん]。ベトロモンから来[き]た者[もの]たちは百二十三人[にん]。"
  18: "ネトファから来[き]た者[もの]たちは五十五人[にん]。アナトトから来た者たちは百五十八人[にん]。ベト・アズマベトから来た者たちは四十二人[にん]。"
  19: "キリアテアリムから来[き]た者[もの]たちは二十五人[にん]。カフィラとベロトから来た者たちは七百四十三人[にん]。ピラから来た者たちは七百人[にん]。"
  20: "ハディアサイとアミディオイの者[もの]たちは四百二十二人[にん]。キラマスとガッベスから来[き]た者たちは六百二十一人[にん]。"
  21: "マカロンから来[き]た者[もの]たちは百二十二人[にん]。バイトリオから来た者たちは五十二人[にん]。ニフィスの子[こ]らは百五十六人[にん]。"
  22: "別[べつ]のカラモの子[こ]ら、およびオヌスの子らは七百二十五人[にん]。エリコの子らは三百四十五人[にん]。"
  23: "サナアの子[こ]らは三千三百三十人[にん]。"
  24: "祭司[さいし]たちは次[つぎ]のとおりである。イエシュアの子[こ]であるイエドゥの子ら、すなわちアナシブの子らとともに数[かぞ]えられて九百七十二人[にん]。エンメルの子らは千五十二人[にん]。"
  25: "ファスルの子[こ]らは千四十七人[にん]。ハルメの子らは千十七人[にん]。"
  26: "レビ人[びと]は次[つぎ]のとおりである。イエシュア、カドミエル、バンヌ、スディオの子[こ]らは七十四人[にん]。"
  27: "神殿[しんでん]の歌[うた]い手[て]たちは、アサフの子[こ]ら百四十八人[にん]。"
  28: "門番[もんばん]たちは、サルムの子[こ]ら、アタルの子ら、トルマンの子ら、アクブの子ら、アティタの子ら、ソバイの子らで、全部[ぜんぶ]で百三十九人[にん]。"
  29: "神殿[しんでん]のしもべたちは、エサウの子[こ]ら、アシファの子ら、タバオトの子ら、ケラスの子ら、スアの子ら、ファダイオの子ら、ラバナの子ら、アッガバの子ら、"
  30: "アクドの子[こ]ら、ウタの子ら、ケタブの子ら、アガバの子ら、シバイの子ら、アナンの子ら、カトゥアの子ら、ゲドゥルの子ら、"
  31: "ヤイロの子[こ]ら、ダイサンの子ら、ノエバの子ら、カセバの子ら、ガゼラの子ら、オジオの子ら、フィノエの子ら、アサラの子ら、バスタイの子ら、アサナの子ら、マアニの子ら、ナフィシの子ら、アクフの子ら、アキバの子ら、アスルの子ら、ファラキムの子ら、バサロトの子ら、"
  32: "メエダの子[こ]ら、クタの子ら、ハレアの子ら、バルクスの子ら、セラルの子ら、トモイの子ら、ナシの子ら、アティファの子ら。"
  33: "ソロモンのしもべたちの子[こ]らは、アッサフィオトの子ら、ファリダの子ら、イエエリの子ら、ロゾンの子ら、イスダエルの子ら、サフィティの子ら、"
  34: "アギアの子[こ]ら、ファカレトの子ら、サビエの子ら、サロティエの子ら、マシアスの子ら、ガスの子ら、アドゥスの子ら、スバスの子ら、アフェラの子ら、バロディスの子ら、サファトの子ら、アモンの子ら。"
  35: "神殿[しんでん]のしもべたちと、ソロモンのしもべたちの子[こ]らは、全部[ぜんぶ]で三百七十二人[にん]であった。"
  36: "これらはテルメレトとテレルサから上[のぼ]って来[き]た者[もの]たちで、彼[かれ]らの先[さき]に立[た]つ者はカラアト、アダン、アマルであった。"
  37: "彼[かれ]らは、自分[じぶん]がイスラエルに属[ぞく]する者[もの]であることを示[しめ]す、自分の氏族[しぞく]と血統[けっとう]を告[つ]げることができなかった。トゥバンの子[こ]であるダランの子らと、ネコダンの子らは六百五十二人[にん]。"
  38: "また、祭司[さいし]のうちで祭司の職[しょく]を求[もと]めた者[もの]たちがいたが、見[み]つからなかった。オッビアの子[こ]ら、アッコスの子ら、イオッドゥスの子らである。このイオッドゥスは、ファルゼライの娘[むすめ]たちのうちからアウギアを妻[つま]に迎[むか]え、ファルゼライの名[な]で呼[よ]ばれるようになった者である。"
  39: "これらの者[もの]の血統[けっとう]の記録[きろく]が名簿[めいぼ]のなかで求[もと]められたが、見[み]つからなかったので、彼[かれ]らは祭司[さいし]として仕[つか]えることから除[のぞ]かれた。"
  40: "ネヘミヤとアッタリアは彼[かれ]らに、明示[めいじ]と真理[しんり]を身[み]にまとった大祭司[だいさいし]が立[た]つまで、聖[せい]なるものに与[あずか]ってはならないと言[い]った。"
  41: "すべての者[もの]は、イスラエル人[じん]で十二歳[じゅうにさい]以上[いじょう]の者、男[おとこ]の奴隷[どれい]と女[おんな]の奴隷を除[のぞ]いて、四万二千三百六十人[にん]であった。彼[かれ]らの男の奴隷と女の奴隷は七千三百三十七人[にん]、歌[うた]い手[て]の男[おとこ]と女[おんな]は二百四十五人[にん]であった。"
  42: "ラクダは四百三十五頭[とう]、馬[うま]は七千三十六頭[とう]、騾馬[らば]は二百四十五頭[とう]、駄獣[だじゅう]は五千五百二十五頭[とう]。"
  43: "また、氏族[しぞく]ごとの長[かしら]たちのうちのある者[もの]たちは、エルサレムにある神[かみ]の神殿[しんでん]に来[き]たとき、自分[じぶん]の力[ちから]に応[おう]じてその場所[ばしょ]に家[いえ]を建[た]てることを誓[ちか]い、"
  44: "神殿[しんでん]の宝物庫[たからものぐら]に、工事[こうじ]のために金[きん]千ミナ、銀[ぎん]五千ミナ、祭司[さいし]の衣[ころも]百着[ひゃくちゃく]を納[おさ]めることを誓[ちか]った。"
  45: "祭司[さいし]たち、レビ人[びと]たち、民[たみ]のうちの者[もの]たちは、エルサレムとその地方[ちほう]に住[す]みつき、神殿[しんでん]の歌[うた]い手[て]たち、門番[もんばん]たち、そして全[すべ]てのイスラエルは自分[じぶん]の村[むら]々[むら]に住んだ。"
  46: "第七[だいしち]の月[つき]が来[き]て、イスラエルの子[こ]らがそれぞれ自分[じぶん]のところにいたとき、彼[かれ]らは東[ひがし]に面[めん]した第一[だいいち]の門[もん]の広[ひろ]い場所[ばしょ]に、心[こころ]を合[あ]わせて集[あつ]まった。"
  47: "イエシュアはヨセデクの子[こ]、その兄弟[きょうだい]である祭司[さいし]たち、およびサラティエルの子[こ]ゾロバベルとその兄弟たちとともに立[た]ち上がり、イスラエルの神[かみ]の祭壇[さいだん]を用意[ようい]した。"
  48: "その上[うえ]に燔祭[はんさい]を捧[ささ]げるためであり、それは神[かみ]の人[ひと]モーセの書[しょ]に定[さだ]められているとおりであった。"
  49: "また、その地[ち]のほかの諸国民[しょこくみん]のうちから、彼[かれ]らのもとに集[あつ]まって来[き]た者[もの]たちがいた。帰[かえ]って来[き]た者たちは、その祭壇[さいだん]をその場所[ばしょ]に据[す]えた。というのは、諸国民[しょこくみん]は彼らに敵意[てきい]を抱[いだ]いており、その地のすべての諸国民が彼らに打[う]ち勝[か]ったからである。そして彼らは時[とき]に応[おう]じて、主[しゅ]に朝[あさ]と夕[ゆう]べの犠牲[ぎせい]と燔祭[はんさい]を捧[ささ]げた。"
  50: "そして、律法[りっぽう]に命[めい]じられているとおりに仮庵[かりいお]の祭[まつ]りを行[おこな]い、ふさわしいとおりに日[ひ]ごとの犠牲[ぎせい]を捧[ささ]げた。"
  51: "また、その後[あと]、絶[た]え間[ま]ない捧[ささ]げ物[もの]、安息日[あんそくび]の犠牲[ぎせい]、新月[しんげつ]の犠牲、そしてすべての聖別[せいべつ]された祭[まつ]りの犠牲を捧げた。"
  52: "また、神[かみ]に誓[ちか]いを立てた者[もの]たちはみな、第七[だいしち]の月[つき]の新月[しんげつ]の日[ひ]から、神に犠牲[ぎせい]を捧[ささ]げ始[はじ]めた。主[しゅ]の神殿[しんでん]は、まだ建[た]てられていなかった。"
  53: "また、彼[かれ]らは石切[いしき]りたちと大工[だいく]たちに銀[ぎん]を与[あた]え、シドン人[じん]とティルス人[じん]には食[た]べ物[もの]と飲[の]み物[もの]を喜[よろこ]びとともに与えた。それは、彼らがレバノンから杉[すぎ]の木[き]を運[はこ]び、筏[いかだ]にしてヤッファの港[みなと]へ持[も]って来[こ]るためであった。これはペルシアの王[おう]クロスが彼らに書[か]き記[しる]した命令[めいれい]に従[したが]ってのことであった。"
  54: "第二年[だいにねん]の第二[だいに]の月[つき]、サラティエルの子[こ]ゾロバベル、ヨセデクの子イエシュア、彼[かれ]らの兄弟[きょうだい]たち、祭司[さいし]たち、レビ人[びと]たち、そして捕囚[ほしゅう]からエルサレムに来[き]たすべての者[もの]たちは、エルサレムにある神[かみ]の神殿[しんでん]に来て、工事[こうじ]を始[はじ]めた。"
  55: "彼[かれ]らは、ユダヤとエルサレムへ来[き]たとき、第二年[だいにねん]の第二[だいに]の月[つき]の新月[しんげつ]に、神[かみ]の神殿[しんでん]の基[もとい]を据[す]えた。"
  56: "また、彼[かれ]らはレビ人[びと]たちを二十歳[はたち]から主[しゅ]の工事[こうじ]に当[あ]たらせた。イエシュアとその子[こ]ら、その兄弟[きょうだい]たち、その兄弟であるカドミエルとその子ら、エマダブンの子ら、イリアドゥンの子であるヨダの子らが、その子らや兄弟たちとともに立[た]った。彼らはみなレビ人で、神[かみ]の家[いえ]での工事に、心[こころ]を合[あ]わせて人[ひと]をせき立[た]てる者[もの]たちであった。"
  57: "建[た]てる者[もの]たちは主[しゅ]の神殿[しんでん]を建てた。祭司[さいし]たちは装[よそお]いをして、音楽[おんがく]とラッパとともに立[た]ち、レビ人[びと]であるアサフの子[こ]らはシンバルを持[も]って、主をほめ歌[うた]い、イスラエルの王[おう]ダビデに従[したが]って祝福[しゅくふく]した。"
  58: "そして彼[かれ]らは賛歌[さんか]のうちに声[こえ]を上[あ]げ、主[しゅ]の慈[いつく]しみと栄光[えいこう]が全[すべ]てのイスラエルの上に世々[よよ]に及[およ]ぶことを、主に告白[こくはく]した。"
  59: "また、民[たみ]はすべてラッパを吹[ふ]き、主[しゅ]の家[いえ]が起[お]こされたことのゆえに、大[おお]きな声[こえ]で叫[さけ]び、主をほめ歌[うた]った。"
  60: "祭司[さいし]たち、レビ人[びと]たち、氏族[しぞく]ごとの長[かしら]たちのうちから、以前[いぜん]の家[いえ]を見[み]たことのある長老[ちょうろう]たちが来[き]て、この建[た]て物[もの]の建[けん]設[せつ]のゆえに、叫[さけ]びと大[おお]きな泣[な]き声[ごえ]を上[あ]げた。"
  61: "また多[おお]くの者[もの]はラッパを吹[ふ]き、喜[よろこ]びのうちに大[おお]きな声[こえ]を上[あ]げた。"
  62: "そのため、民[たみ]は民の泣[な]き声[ごえ]のゆえにラッパの音[ね]を聞[き]くことができなかった。群衆[ぐんしゅう]が非常[ひじょう]にラッパを吹[ふ]いていたので、その音は遠[とお]くからも聞[き]こえたからである。"
  63: "ユダとベニヤミンの部族[ぶぞく]の敵[てき]たちは、これを聞[き]いて、このラッパの音[ね]は何[なに]かを見[み]極[きわ]めようと来[き]た。"
  64: "そして、捕囚[ほしゅう]から帰[かえ]った者[もの]たちが、主[しゅ]であるイスラエルの神[かみ]に神殿[しんでん]を建[た]てていることを知[し]った。"
  65: "彼[かれ]らはゾロバベル、イエシュア、および氏族[しぞく]の長[かしら]たちに近[ちか]づいて言[い]った。「わたしたちもあなたがたとともに建[た]てよう。"
  66: "わたしたちもあなたがたと同じように、あなたがたの主[しゅ]に聞[き]き従[したが]い、アッシリアの王[おう]アスバサレトがわたしたちをここへ移[うつ]して以来[いらい]、この方[かた]に犠牲[ぎせい]を捧[ささ]げてきた。」"
  67: "ゾロバベル、イエシュア、イスラエルの氏族[しぞく]の長[かしら]たちは彼[かれ]らに言[い]った。「わたしたちの主[しゅ]である神[かみ]に家[いえ]を建[た]てるのは、あなたがたでもわたしたちでもない。"
  68: "わたしたちだけが、ペルシアの王[おう]クロスがわたしたちに命[めい]じたとおりに、イスラエルの主[しゅ]である神[かみ]のために建てるのだ。」"
  69: "しかし、その地[ち]の諸国民[しょこくみん]は、ユダヤにいる者[もの]たちを押[お]し迫[せま]り、包囲[ほうい]して、建[た]てることを妨[さまた]げた。"
  70: "彼[かれ]らは陰謀[いんぼう]と民[たみ]の扇動[せんどう]、暴動[ぼうどう]を企[くわだ]てて、クロス王[おう]の生[い]きている間[あいだ]、ずっと、その建[けん]設[せつ]を完成[かんせい]させることを妨[さまた]げた。ダリウスが王[おう]となるまで、建[けん]設[せつ]は二年[にねん]の間[あいだ]止[と]められた。"

notes:
  1: "Μετὰ δὲ ταῦτα — после сего; ἐξελέγησαν ἀναβῆναι — были избраны взойти (ἐκλέγω). ἀρχηγοὶ οἴκου πατριῶν κατὰ φυλὰς αὐτῶν — начальники дома отцов по племенам их. Перечень жён, детей, рабов и скота относится к избранным (в слав. «избрани суть изыти… и жены их, и сынове их…»)."
  2: "συναπέστειλεν — послал вместе (συναποστέλλω); ἱππεῖς χιλίους — тысячу всадников. ἕως τοῦ ἀποκαταστῆσαι — чтобы водворить, вернуть на место (ἀποκαθίστημι). μουσικῶν, τυμπάνων καὶ αὐλῶν — музыка, тимпаны и свирели (αὐλός — 笛); слав. переводит αὐλῶν как «трубами». Слав. добавляет «дарий царь» — в LXX только Δαρεῖος, внесено в текст по паритету."
  3: "παίζοντες — играя, веселясь (παίζω); ἐποίησεν αὐτοὺς συναναβῆναι — он сделал так, что они взошли вместе (συναναβαίνω). Подлежащее ἐποίησεν — Дарий, поэтому в тексте 王. слав. «бяху играюще» — имперфект."
  4: "μεριδαρχία — раздел рода, «меридархия» (слав. «части началств»), отсюда 氏族の組. κατὰ πατριὰς αὐτῶν εἰς τὰς φυλάς — по отцовствам их в племена; ἐπὶ τὴν μεριδαρχίαν αὐτῶν — по их родовому разделу."
  5: "οἱ ἱερεῖς υἱοὶ Φινεες υἱοῦ Ααρων — священники, сыны Финееса, сына Аарона. Две родословные цепи: Иисус — Иоседек — Сараия и Иоаким — Зоровавель — Салафиил; ἐκ τοῦ οἴκου τοῦ Δαυιδ, ἐκ τῆς γενεᾶς Φαρες, φυλῆς δὲ Ιουδα — из дома Давида, из рода Фареса, из племени Иуды. Зоровавель в этой книге — ゾロバベル (греч. форма; в Ездре и Неемии ゼルバベル), Иоаким — ヨヤキム."
  6: "ὃς ἐλάλησεν ἐπὶ Δαρείου — который говорил при Дарии (ἐπί с род.); λόγους σοφούς — мудрые слова. ἐν τῷ δευτέρῳ ἔτει τῆς βασιλείας αὐτοῦ — во второй год его царствования; μηνὶ Νισαν τοῦ πρώτου μηνός — в месяц Нисан, [месяц] первого месяца. Слав. «глаголаше» — имперфект."
  7: "εἰσὶν δὲ οὗτοι ἐκ τῆς Ιουδαίας — сии же суть от Иудеи; οἱ ἀναβάντες ἐκ τῆς αἰχμαλωσίας τῆς παροικίας — взошедшие из плена переселения (παροικία — пребывание на чужбине, 寄留). οὓς μετῴκισεν Ναβουχοδονοσορ — которых переселил Навуходоносор (μετοικίζω). В LXX здесь παροικία, а не ἀποικία, как в Езд 2:1."
  8: "ἐπέστρεψαν εἰς Ιερουσαλημ καὶ τὴν λοιπὴν Ιουδαίαν — возвратились в Иерусалим и остальную Иудею; ἕκαστος εἰς τὴν ἰδίαν πόλιν — каждый в свой город. Двенадцать имён (с Зоровавелем и Иисусом): Ρησαιου — Ресай (слав. «рисеем»), Ενηνιος — Ениний (слав. «енинием»), Βεελσαρου — Беелсар (слав. «веелсаром»), Βορολιου — Воролий (слав. «реелием»), Ροιμου — Роим. τῶν προηγουμένων αὐτῶν — предводителей их (слав. «началники их»)."
  9: "ἀριθμὸς τῶν ἀπὸ τοῦ ἔθνους — число тех, кто из народа (ἔθνος; слав. «от языка»); καὶ οἱ προηγούμενοι αὐτῶν — и предводители их. Φορος — 2172. Слав. в этом же стихе даёт и следующий счёт (472), т. е. csl 5:9 = гр 5:9 + 10a; граница стихов сдвинута, но счёт стихов не меняется."
  10: "Σαφατ — 472; Αρεε — 756 (слав. «аресовы»). В слав. число 472 стоит в конце ст. 9, поэтому csl 5:10 = только гр 5:10b."
  11: "Φααθμωαβ — Фааф-Моав (слав. «фааф-моавли»); εἰς τοὺς υἱοὺς Ἰησοῦ καὶ Ιωαβ — «в сынов Иисуса и Иоава», т. е. род делится на две ветви; 2812."
  12: "Ωλαμου — Олам (в Езд 2 это Αιλαμ, アイラム; слав. «иламовы»); Ζατου — Зату (слав. «зафуины»); Χορβε — Хорбе; Βανι — Бани. Числа: 1254, 945, 705, 648."
  13: "Βηβαι — Бебай (слав. «виваины»); 623. Ασγαδ — Асгад; в LXX 1322, в слав. «три тысящы двести двадесять два» — 3222 (как в LXX Езд 2:12). По паритету в тексте церковное число 3222, вариант LXX — в notes."
  14: "Αδωνικαμ — Адоникам (слав. «адоникамовы»); Βαγοι — Багой (слав. «вагоины»); Αδινου — Адин (слав. «адинуевы»). Числа: 667, 2066, 454."
  15: "Ατηρ Εζεκιου — Атер [из дома] Езекии (слав. «атирезекиевы»); Κιλαν καὶ Αζητας — Килан и Азетас (слав. «килановы и азитасовы»); Αζουρου — Азур. Числа: 92, 67, 432."
  16: "Αννιας — Анниас (слав. «ананиевы»); Αρομ — Аром; Βασσαι — Вассай; Αριφου — Ариф. Числа: 101, 32, 323. Ариф: в слав. и ru 102, в LXX 112 — по паритету в тексте церковное 102."
  17: "Βαιτηρους — Бетирус (слав. «метировы», ru «Ветирус»); ἐκ Βαιθλωμων — из Бетломона (слав. «вефломонов»). Числа: 3005, 123."
  18: "Νετεβας — Нетеба (слав. «нетофаи», т. е. Нетофа); Ενατου — Енат (слав. «анафофа»); Βαιτασμων — Бетасмон (слав. «вефсамоса»). В тексте даны формы параллельного списка ネトファ, アナトト, ベト・アズマベト (Езд 2:22–24), греч. формы иные. Числа: 55, 158, 42."
  19: "Καριαθιαριος — Кариафиарим (в Езд 2 — Καριαθιαριμ, キリアテアリム); Καπιρας καὶ Βηροτ — Кафира и Верот (カフィラ, ベロト). Числа: 25 и 743. Слав. добавляет здесь «иже из пиры седмь сот» (из Пиры 700) — в LXX нет; по паритету внесено в текст без скобок."
  20: "Χαδιασαι καὶ Αμμιδιοι — Хадиасеи и Аммидеи (слав. «хадиасовы и амидиевы»); Κιραμας καὶ Γαββης — Кирам и Габвис (слав. «кирама и гаввиса»). Числа: 422 и 621."
  21: "Μακαλων — Макалон (слав. «макалона»); Βαιτολιω — Бетолион (слав. «витолиа»); Νιφις — Нифис. Числа: 122, 52, 156."
  22: "Καλαμω ἄλλου — «Калам другой» (ἄλλος); Ωνους — Онус (слав. «каламолалуевы и онусовы»); Ιερεχου — Иерех (слав. «иереховы»): по числу 345 совпадает с Иерихоном (Езд 2:34), поэтому в тексте エリコ. Числа: 725 и 345 (у ru 245 — расхождение)."
  23: "Σαναας — Санаа (род. п.; в Езд 2 — Σαναα, サナア). Число: 3330 (у ru 3301)."
  24: "οἱ ἱερεῖς — заголовок раздела, 祭司たち. Ιεδδου τοῦ υἱοῦ Ἰησοῦ — Иедду, сын Иисуса (слав. «иеддуа, сына иисуева»); εἰς τοὺς υἱοὺς Ανασιβ — «к сынам Анасива», т. е. вместе с ними (слав. «с сыны санасивовыми»). Εμμηρου — Еммер. Числа: 972 и 1052."
  25: "Φασσουρου — Фассур (слав. «фасарони»); Χαρμη — Харме (слав. «хармиевы»). Числа: 1047 и 1017."
  26: "οἱ Λευῖται — заголовок, レビ人. Ιησου, Καδμιηλου, Βαννου, Σουδιου — Иисус, Кадмиил, Ванн, Судий (слав. «иесуевы и кадмииловы, и ваннуевы и судиевы»). Число: 74."
  27: "οἱ ἱεροψάλται — священнопевцы (слав.), 神殿の歌い手; υἱοὶ Ασαφ — сыны Асафа. В LXX 128; слав. «сто четыредесять осмь» — 148, ru 140. По паритету в тексте церковное 148."
  28: "οἱ θυρωροί — привратники, 門番; Σαλουμ, Αταρ, Τολμαν, Ακουβ, Ατητα, Σωβαι — Саллум, Атар, Толман, Аккув, Атита, Совай (слав. «салумовы, аттаровы, толмановы, дакувиевы, титаевы, самиевы»). Всех 139."
  29: "οἱ ἱερόδουλοι — храмовые служители, 神殿のしもべ; Ησαυ, Ασιφα, Ταβαωθ, Κηρας, Σουα, Φαδαιου, Λαβανα, Αγγαβα — Исав, Асифа, Таваоф, Керас, Суа, Фадай, Лаван, Аггава (слав. «исавовы, асифаевы, таваофовы, кирасовы, судовы, фалеевы, лаванаевы, аграваевы»)."
  30: "Ακουδ, Ουτα, Κηταβ, Αγαβα, Συβαι, Αναν, Καθουα, Γεδδουρ — Акуд, Ута, Китав, Агава, Сивай, Анан, Катуа, Геддур (слав. «акуаевы, утаевы, китавовы, агаваевы, сиваиевы, анани, кафуаевы, геддуровы»)."
  31: "Семнадцать имён: Ιαιρου, Δαισαν, Νοεβα, Χασεβα, Γαζηρα, Οζιου, Φινοε, Ασαρα, Βασθαι, Ασανα, Μαανι, Ναφισι, Ακουφ, Αχιβα, Ασουρ, Φαρακιμ, Βασαλωθ. Слав. формы иные: «иаировы, десановы, ноиваевы, хасеваевы, газираевы, озиевы, финоевы, асараевы, васфаиевы, асанаевы, меаниевы, нафисиевы, акувовы, акифаевы, асуровы, фаракимовы, васалофовы»."
  32: "Μεεδδα, Κουθα, Χαρεα, Βαρχους, Σεραρ, Θομοι, Νασι, Ατιφα — Мееда, Кута, Хареа, Бархус (в Езд 2 — Βαρκους, バルクス), Серар, Томой, Наси, Атифа (слав. «меедаевы, куфаевы, хареевы, харкусовы, асирари, фомиевы, насифовы, атифаевы»)."
  33: "υἱοὶ παίδων Σαλωμων — сыны рабов Соломоновых, ソロモンのしもべたち. Ασσαφιωθ, Φαριδα, Ιεηλι, Λοζων, Ισδαηλ, Σαφυθι — Ассафиоф, Фарида, Иеили, Лозон, Исдаил, Сафифи (слав. «асапфионовы, фарираевы, иеилевы, лозони, издаилевы, сафифовы»)."
  34: "Двенадцать имён: Αγια, Φακαρεθ, σαβιη, Σαρωθιε, Μασιας, Γας, Αδδους, Σουβας, Αφερρα, Βαρωδις, Σαφατ, Αμων (слав. «агиаевы, фахарефовы, савиины, сарофиевы, масиасовы, гаровы, аддусовы, сувасовы, афераевы, варадисовы, сафатовы, алломовы»). В издании между Φακαρεθ и σαβιη стоит тире; принято как два отдельных имени."
  35: "πάντες οἱ ἱερόδουλοι καὶ οἱ υἱοὶ τῶν παίδων Σαλωμων — все иеродулы и сыны рабов Соломоновых; 372."
  36: "Θερμελεθ καὶ Θελερσας — Фермелеф и Фелерса (слав. «фермелефа и фелерсаса»); ἡγούμενος αὐτῶν — предводитель их. Χαρααθ, Αδαν καὶ Αμαρ — три имени; слав. и ru сводят их к двум («хараафаларь и ааларь», «Хараафалан и Аалар»)."
  37: "οὐκ ἠδύναντο ἀπαγγεῖλαι — не могли объявить; τὰς πατριὰς αὐτῶν καὶ γενεάς — отцовства и роды их; ὡς ἐκ τοῦ Ισραηλ εἰσίν — что они от Израиля. Δαλαν τοῦ υἱοῦ Τουβαν — Далан, сын Тувана (слав. «ладана сына ванова»); Νεκωδαν — Некодан. Число: 652."
  38: "οἱ ἐμποιούμενοι ἱερωσύνης — домогавшиеся священства (ἐμποιέομαι); Οββια, Ακκως, Ιοδδους — Оввия, Аккос, Иодд (слав. «авдиины, аккосовы, аддуса»). Αυγιαν — Авгия; Φαρζελλαιου — Фарзеллай (слав. «верзеллей», в Езд 2 — Βερζελλαι, ベルゼライ); ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτοῦ — был назван его именем."
  39: "ζητηθείσης τῆς γενικῆς γραφῆς — когда была взыскана родословная запись (γενικὴ γραφή); ἐν τῷ καταλοχισμῷ — в списке, переписи (καταλοχισμός); ἐχωρίσθησαν τοῦ ἱερατεύειν — были отделены от священства (χωρίζω)."
  40: "Νεεμιας καὶ Ατθαριας — Неемия и Аттария (слав. «атфариа»); μὴ μετέχειν τῶν ἁγίων — не участвовать в святынях (μετέχω). ἀρχιερεὺς ἐνδεδυμένος τὴν δήλωσιν καὶ τὴν ἀλήθειαν — первосвященник, облечённый в «явление и истину»: так LXX передаёт урим и туммим (слав. «во изявление и истину»)."
  41: "ἀπὸ δωδεκαετοῦς — от двенадцатилетнего [возраста]; χωρὶς παίδων καὶ παιδισκῶν — кроме рабов и рабынь; μυριάδες τέσσαρες δισχίλιοι τριακόσιοι ἑξήκοντα — 42 360. παῖδες … καὶ παιδίσκαι ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά — 7337; ψάλται καὶ ψαλτῳδοὶ — певцы и певицы, 245."
  42: "κάμηλοι 435; ἵπποι ἑπτακισχίλιοι τριάκοντα ἕξ — 7036; ἡμίονοι 245; ὑποζύγια πεντακισχίλια πεντακόσια εἴκοσι πέντε — 5525 (ὑποζύγιον — вьючное животное, 駄獣)."
  43: "ἐκ τῶν ἡγουμένων κατὰ τὰς πατριάς — из начальствующих по отцовствам (partitiv: некоторые из них); εἰς τὸ ἱερὸν τοῦ θεοῦ — в святилище Бога; εὔξαντο ἐγεῖραι — дали обет воздвигнуть (εὔχομαι); κατὰ τὴν αὐτῶν δύναμιν — по силе их. Предложение продолжается в ст. 44."
  44: "δοῦναι εἰς τὸ ἱερὸν γαζοφυλάκιον τῶν ἔργων — дать в священную сокровищницу на работы (γαζοφυλάκιον, 宝物庫); χρυσίου μνᾶς χιλίας — 1000 мин золота; ἀργυρίου μνᾶς πεντακισχιλίας — 5000 мин серебра; στολὰς ἱερατικὰς ἑκατόν — 100 священнических одежд."
  45: "κατῳκίσθησαν — поселились (κατοικίζω); οἱ ἐκ τοῦ λαοῦ — [некоторые] из народа (слав. «иже (изыдоша) от народа»); οἵ τε ἱεροψάλται καὶ οἱ θυρωροὶ — священнопевцы и привратники; ἐν ταῖς κώμαις αὐτῶν — в селениях своих."
  46: "Ἐνστάντος δὲ τοῦ ἑβδόμου μηνός — когда наступил седьмой месяц (ἐνίστημι); ὄντων τῶν υἱῶν Ισραηλ ἑκάστου ἐν τοῖς ἰδίοις — когда сыны Израиля были каждый у себя; εὐρύχωρον — широкое [открытое] место; τοῦ πρώτου πυλῶνος τοῦ πρὸς τῇ ἀνατολῇ — первых ворот, что к востоку."
  47: "καταστὰς — встав, выступив (καθίστημι); ἡτοίμασαν τὸ θυσιαστήριον — приготовили жертвенник (ἑτοιμάζω). Перечислены Иисус с братьями-священниками и Зоровавель с братьями; продолжение в ст. 48."
  48: "προσενέγκαι ἐπ᾿ αὐτοῦ ὁλοκαυτώσεις — принести на нём всесожжения (προσφέρω); ἀκολούθως τοῖς … διηγορευμένοις — согласно предписанному (διηγορεύω); ἐν τῇ Μωυσέως βίβλῳ τοῦ ἀνθρώπου τοῦ θεοῦ — в книге Моисея, человека Божия."
  49: "ἐπισυνήχθησαν αὐτοῖς ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς — собрались к ним из других народов земли; κατώρθωσαν — поставили, устроили (κατορθόω); ὅτι ἐν ἔχθρᾳ ἦσαν αὐτοῖς — ибо были во вражде с ними; κατίσχυσαν αὐτούς — одолели их (κατισχύω); ἀνέφερον θυσίας κατὰ τὸν καιρόν — приносили жертвы в своё время. Подлежащее κατώρθωσαν — возвратившиеся (так же в слав. и ru), поэтому в тексте названы 帰って来た者たち; логика греческого сохранена без сглаживания."
  50: "ἠγάγοσαν τὴν τῆς σκηνοπηγίας ἑορτήν — совершили праздник кущей (σκηνοπηγία, 仮庵の祭り); ὡς ἐπιτέτακται ἐν τῷ νόμῳ — как повелено в законе; θυσίας καθ᾽ ἡμέραν — жертвы на каждый день."
  51: "μετὰ ταῦτα — после сего; προσφορὰς ἐνδελεχισμοῦ — постоянные приношения (ἐνδελεχισμός); θυσίας σαββάτων καὶ νουμηνιῶν — жертвы суббот и новомесячий; ἑορτῶν πασῶν ἡγιασμένων — всех праздников освящённых."
  52: "ὅσοι εὔξαντο εὐχὴν τῷ θεῷ — все, давшие обет Богу (εὔχομαι, εὐχή); ἀπὸ τῆς νουμηνίας τοῦ ἑβδόμου μηνός — с новомесячия седьмого месяца; ὁ ναὸς τοῦ θεοῦ οὔπω ᾠκοδόμητο — храм Божий ещё не был построен. Слав. «храм же Господень» — в тексте церковное 主の神殿, вариант LXX (τοῦ θεοῦ) отмечен здесь."
  53: "λατόμοι — каменотёсы (λατόμος); τέκτονες — плотники; βρωτὰ καὶ ποτὰ καὶ χαρα — пища, питьё и χαρα (χάρα): слав. читает «с радостию», т. е. давали с радостью, — так и передано; ru «повозки» (карры) — иное чтение. Σιδώνιοι καὶ Τύριοι — сидоняне и тиряне; διαφέρειν σχεδίας — доставлять плотами (σχεδία); λιμὴν Ιοππης — Иоппийская пристань (ヤッファ, как в Езд 3:7); κατὰ τὸ πρόσταγμα τὸ γραφέν — по написанному повелению (πρόσταγμα)."
  54: "τῷ δευτέρῳ ἔτει … μηνὸς δευτέρου — во второй год, во второй месяц; παραγενόμενος — придя (παραγίνομαι, прич. ед. ч.); ἤρξατο — начал (ед. ч.; подлежащее — Зоровавель с перечисленными). Продолжение в ст. 55."
  55: "ἐθεμελίωσαν τὸν ναὸν τοῦ θεοῦ — положили основание храма Божия (θεμελιόω); τῇ νουμηνίᾳ τοῦ δευτέρου μηνὸς τοῦ δευτέρου ἔτους — в новомесячие второго месяца второго года; ἐν τῷ ἐλθεῖν εἰς τὴν Ιουδαίαν καὶ Ιερουσαλημ — при приходе в Иудею и Иерусалим."
  56: "ἔστησαν τοὺς Λευίτας ἀπὸ εἰκοσαετοῦς — поставили левитов от двадцати лет (εἰκοσαετής); ἐπὶ τῶν ἔργων τοῦ κυρίου — на дела Господни. Καδμιηλ ὁ ἀδελφὸς — Кадмиил, брат; Ημαδαβουν — тёмное имя (слав. «мадиавуни», ru «Имадавун»), передано транслитерацией; в LXX перед ним стоит Ἰησοῦ (οἱ υἱοὶ Ἰησοῦ Ημαδαβουν) — вероятно, дублет, по слав./ru в тексте только エマダブン; ἐργοδιῶκται ποιοῦντες — понуждающие [работать] (ἐργοδιώκτης). Слав. в конце стиха уже даёт начало ст. 57 («и создаша делателие дом Господень»)."
  57: "οἱ οἰκοδόμοι — строители (οἰκοδόμος); ἐστολισμένοι — облачённые (στολίζω); μετὰ μουσικῶν καὶ σαλπίγγων — с музыкой и трубами; κύμβαλα — кимвалы (シンバル); κατὰ Δαυιδ βασιλέα τοῦ Ισραηλ — по [уставу] Давида, царя Израиля."
  58: "ἐφώνησαν δι᾽ ὕμνων — возгласили гимнами (ὕμνος); ὁμολογοῦντες — исповедуя, славя (ὁμολογέω); ἡ χρηστότης αὐτοῦ — благость Его (χρηστότης); εἰς τοὺς αἰῶνας — в веки; παντὶ Ισραηλ — всему Израилю."
  59: "ἐσάλπισαν — вострубили (σαλπίζω); ἐβόησαν φωνῇ μεγάλῃ — воззвали громким голосом; ἐπὶ τῇ ἐγέρσει τοῦ οἴκου τοῦ κυρίου — по случаю воздвижения дома Господня (ἔγερσις)."
  60: "οἱ προκαθήμενοι — предстоящие, начальствующие (προκάθημαι); οἱ ἑωρακότες τὸν πρὸ τούτου οἶκον — видевшие прежний дом (πρό с род.); πρὸς τὴν τούτου οἰκοδομήν — при этом строении; μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου — с воплем и великим плачем."
  61: "καὶ πολλοὶ διὰ σαλπίγγων καὶ χαρᾶς μεγάλῃ τῇ φωνῇ — и многие с трубами и радостью, громким голосом: анаколуф, сказуемого нет, продолжение ст. 60; поэтому в тексте добавлен глагол 上[あ]げた."
  62: "ὥστε τὸν λαὸν μὴ ἀκούειν τῶν σαλπίγγων — так что народ не слышал труб; διὰ τὸν κλαυθμὸν τοῦ λαοῦ — из-за плача народа; ὁ ὄχλος ἦν ὁ σαλπίζων μεγαλωστί — толпа трубила весьма (μεγαλωστί); μακρόθεν ἀκούεσθαι — слышно было издалека."
  63: "οἱ ἐχθροὶ τῆς φυλῆς Ιουδα καὶ Βενιαμιν — враги племени Иуды и Вениамина; ἤλθοσαν ἐπιγνῶναι — пришли узнать (ἐπιγινώσκω); τίς ἡ φωνὴ τῶν σαλπίγγων — что за звук труб."
  64: "ἐπέγνωσαν — узнали; οἱ ἐκ τῆς αἰχμαλωσίας — вышедшие из плена; οἰκοδομοῦσιν τὸν ναὸν τῷ κυρίῳ θεῷ Ισραηλ — строят храм Господу Богу Израиля."
  65: "προσελθόντες — подойдя (προσέρχομαι); Συνοικοδομήσομεν ὑμῖν — построим вместе с вами (συνοικοδομέω). Прямая речь — 「」."
  66: "ὁμοίως ὑμῖν — подобно вам; ἀκούομεν τοῦ κυρίου ὑμῶν — слушаем вашего господа; αὐτῷ ἐπιθύομεν — ему приносим жертвы (ἐπιθύω); ἀπὸ ἡμερῶν Ασβασαρεθ βασιλέως Ἀσσυρίων — от дней Асбасарефа, царя Ассирийского (слав. «асвасарефа», ru «Асвакафас»); μετήγαγεν ἡμᾶς ἐνταῦθα — переселил нас сюда (μετάγω)."
  67: "Οὐχ ὑμῖν καὶ ἡμῖν τοῦ οἰκοδομῆσαι — не вам и нам строить; οἱ ἡγούμενοι τῶν πατριῶν τοῦ Ισραηλ — начальствующие отцовств Израиля. Речь продолжается в ст. 68, кавычки одни на два стиха."
  68: "ἡμεῖς μόνοι — мы одни; ἀκολούθως οἷς προσέταξεν ἡμῖν — согласно тому, что повелел нам (προστάσσω); τῷ κυρίῳ τοῦ Ισραηλ — Господу Израиля. Слав. добавляет «Богу» («Господу Богу израилеву») — внесено в текст; LXX-вариант отмечен здесь."
  69: "τὰ ἔθνη τῆς γῆς — народы земли; ἐπικείμενα τοῖς ἐν τῇ Ιουδαίᾳ — налегающие на тех, кто в Иудее (ἐπίκειμαι); πολιορκοῦντες — осаждая (πολιορκέω); εἶργον τοῦ οἰκοδομεῖν — препятствовали строить (εἴργω)."
  70: "ἐπιβουλάς — козни (ἐπιβουλή); δημαγωγίας — возмущение народа, демагогию (δημαγωγία); ἐπισυστάσεις — сборища, мятежи (ἐπισύστασις); ἀπεκώλυσαν — воспрепятствовали (ἀποκωλύω); πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου — всё время жизни царя Кира. Слав. в этом стихе даёт и ст. 71 («и препятие сотвориша созиданию лета два, даже до дариева царства»); εἴρχθησαν τῆς οἰκοδομῆς — строительство было остановлено (εἴργω); ἔτη δύο ἕως τῆς Δαρείου βασιλείας — на два года до царства Дария. По csl обе фразы стоят в одном стихе 5:70 — так и здесь."
