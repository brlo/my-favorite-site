chapter: 50
draft: true

verses:
  1: "主[しゅ]はこう言[い]われる。「あなたがたの母[はは]には、わたしが彼女[かのじょ]を去[さ]らせた離縁状[りえんじょう]がどこにあるのか。わたしがあなたがたを売[う]った債権者[さいけんしゃ]は、だれか。見[み]よ、あなたがたは自分[じぶん]の罪[つみ]のゆえに売られ、あなたがたの母は、あなたがたの不法[ふほう]のゆえに去[さ]らされたのである。"
  2: "なぜ、わたしが来[き]てもだれもいなかったのか。わたしが呼[よ]んでも答[こた]える者[もの]がなかったのはなぜか。わたしの手[て]は短[みじか]くなって、贖[あがな]い出[だ]すことができないのか。わたしに引[ひ]き出[だ]す力[ちから]がないのか。見[み]よ、わたしが叱[しか]れば、海[うみ]は乾[かわ]き上[あ]がり、川[かわ]は荒野[こうや]となる。水[みず]がなくて魚[さかな]は干[ひ]あがり、渇[かわ]きで死[し]ぬ。"
  3: "わたしは天[てん]に暗[やみ]を着[き]せ、その覆[おお]いを粗布[あらぬの]のようにする。」"
  4: "「主[しゅ]はわたしに、教[おし]えを受[う]けた者[もの]の言葉[ことば]を授[さず]け、ふさわしい時[とき]に語[かた]るべき言葉[ことば]を知[し]らせてくださる。主は朝[あさ]ごとに、朝ごとに、わたしの耳[みみ]を呼[よ]び覚[さ]まし、学[まな]ぶ者[もの]のように聞[き]かせてくださる。"
  5: "主[しゅ]の教[おし]えがわたしの耳[みみ]を開[ひら]く。わたしは逆[さか]らわず、退[しりぞ]きもしない。"
  6: "わたしは背[せ]を鞭[むち]に、頬[ほお]を平手[ひらて]に与[あた]え、顔[かお]を恥[はじ]と唾[つばき]から背[そむ]けなかった。"
  7: "主[しゅ]がわたしの助[たす]けとなられた。だからわたしは恥[は]じなかった。わたしは顔[かお]を固[かた]い岩[いわ]のように据[す]え、恥じることはないと知[し]っている。"
  8: "わたしを正[ただ]しいとする方[かた]が近[ちか]くにおられる。だれがわたしと争[あらそ]うのか。ともに立[た]つがよい。わたしと裁[さば]き合[あ]おうとする者はだれか。わたしのところへ近づくがよい。"
  9: "見[み]よ、主[しゅ]がわたしを助[たす]ける。だれがわたしに害[がい]を加[くわ]えられるか。見よ、彼[かれ]らはみな衣[ころも]のように古[ふる]び、虫[むし]が彼らを食[く]い尽[つ]くす。」"
  10: "あなたがたのうち、主[しゅ]を恐[おそ]れる者[もの]はだれか。そのしもべの声[こえ]を聞[き]くがよい。暗[やみ]の中[なか]を歩[あゆ]み、光[ひかり]のない者[もの]たちよ。主[しゅ]の名[な]に寄[よ]り頼[たの]み、自分[じぶん]の神[かみ]にすがるがよい。"
  11: "見[み]よ、あなたがたはみな火[ひ]を点[とも]し、炎[ほのお]を強[つよ]める者[もの]たちである。あなたがたの火の光[ひかり]の中[なか]を、自分[じぶん]で燃[も]やした炎の中を歩[あゆ]め。「わたしのゆえに、これらのことがあなたがたに起こった。あなたがたは悲[かな]しみのうちに眠[ねむ]る。」"

notes:
  1: "Οὕτως λέγει κύριος· Ποῖον τὸ βιβλίον τοῦ ἀποστασίου τῆς μητρὸς ὑμῶν — «каково разводное письмо матери вашей» (βιβλίον ἀποστασίου — разводная грамота, 離縁状; ἀποστασία — оставление); ᾧ ἐξαπέστειλα αὐτήν — «которым Я отослал её» (ἐξαποστέλλω). ἢ τίνι ὑπόχρεῳ πέπρακα ὑμᾶς — «или какому заимодавцу продал вас» (ὑπόχρεος — должник; 債権者; πιπράσκω); ἰδοὺ ταῖς ἁμαρτίαις ὑμῶν ἐπράθητε — «вот, грехами вашими вы проданы»; ταῖς ἀνομίαις ὑμῶν ἐξαπέστειλα τὴν μητέρα ὑμῶν — «беззакониями вашими отослал мать вашу»."
  2: "τί ὅτι ἦλθον καὶ οὐκ ἦν ἄνθρωπος — «почему, когда Я пришёл, не было человека»; ἐκάλεσα καὶ οὐκ ἦν ὁ ὑπακούων — «звал, и не было слушающего» (ὑπακούω). μὴ οὐκ ἰσχύει ἡ χείρ μου τοῦ ῥύσασθαι — «разве не сильна рука Моя, чтобы избавить» (ῥύομαι); ἢ οὐκ ἰσχύω τοῦ ἐξελέσθαι — «или не могу изъять» (ἐξαιρέω). τῇ ἀπειλῇ μου ἐξερημώσω τὴν θάλασσαν — «угрозою Моею опустошу море» (ἀπειλή — угроза, прещение); θήσω ποταμοὺς ἐρήμους — «положу реки пустыми»; ξηρανθήσονται οἱ ἰχθύες αὐτῶν — «высохнут рыбы их» (ξηραίνω; в ru «гниют» — по МТ); ἀποθανοῦνται ἐν δίψει — «умрут в жажде»."
  3: "καὶ ἐνδύσω τὸν οὐρανὸν σκότος — «и одену небо тьмою» (ἐνδύω); θήσω ὡς σάκκον τὸ περιβόλαιον αὐτοῦ — «положу как вретище покров его» (σάκκος — вретище, 粗布; περιβόλαιον — покров, одежда; слав. «аки вретище одежду его»)."
  4: "Κύριος δίδωσίν μοι γλῶσσαν παιδείας — «Господь даёт Мне язык научения» (παιδεία — наставление, учение; 教えを受けた者の言葉); в ru/МТ «язык мудрых», у jp-joc 智者の舌 — держим LXX и слав. τοῦ γνῶναι ἐν καιρῷ ἡνίκα δεῖ εἰπεῖν λόγον — «чтобы знать в нужное время, когда должно сказать слово»; ἔθηκέν μοι πρωί, προσέθηκέν μοι ὠτίον ἀκούειν — «положил Мне [утро за утром], приложил Мне ухо, чтобы слушать» (ὠτίον — ушко; повтор «утро» передан как 朝ごとに、朝ごとに). С 50:4 по 50:9 — третья песнь Раба в 「…」."
  5: "καὶ ἡ παιδεία κυρίου ἀνοίγει μου τὰ ὦτα — «и наставление Господне открывает Мне уши» (παιδεία снова; в ru/МТ «Господь Бог открыл Мне ухо» — иное чтение); ἐγὼ δὲ οὐκ ἀπειθῶ οὐδὲ ἀντιλέγω — «Я же не противлюсь и не прекословлю» (ἀπειθέω, ἀντιλέγω; слав. «аз же не противлюся, ни противоглаголю»)."
  6: "τὸν νῶτόν μου δέδωκα εἰς μάστιγας — «спину Мою Я отдал на бичи» (νῶτος — спина; μάστιξ — бич; слав. «плещы мои вдах на раны»); τὰς σιαγόνας μου εἰς ῥαπίσματα — «ланиты Мои на пощёчины» (σιαγών — ланита, щека; ῥάπισμα — удар, заушение); τὸ πρόσωπόν μου οὐκ ἀπέστρεψα ἀπὸ αἰσχύνης ἐμπτυσμάτων — «лица Моего не отвратил от стыда оплеваний» (ἔμπτυσμα — плевок; слав. «от студа заплеваний»)."
  7: "καὶ κύριος βοηθός μου ἐγενήθη — «и Господь стал Мне помощником»; διὰ τοῦτο οὐκ ἐνετράπην — «потому Я не посрамился» (ἐντρέπω); ἔθηκα τὸ πρόσωπόν μου ὡς στερεὰν πέτραν — «положил лицо Моё как твёрдый камень» (στερεός; слав. «аки твердый камень»); ἔγνων ὅτι οὐ μὴ αἰσχυνθῶ — «узнал, что не постыжусь». Слав. удваивает «Господь Господь»; в LXX один κύριος."
  8: "ὅτι ἐγγίζει ὁ δικαιώσας με — «ибо близок оправдывающий Меня» (δικαιόω); τίς ὁ κρινόμενός μοι — «кто судящийся со Мной» (κρίνω, страд. прич.); ἀντιστήτω μοι ἅμα — «пусть восстанет против Меня вместе» (ἀνθίστημι); ἐγγισάτω μοι — «пусть приблизится ко Мне». Вопрос повторён дважды, как в LXX и слав. («Кто пряйся со мною? … И кто судяйся со мною?»)."
  9: "ἰδοὺ κύριος βοηθεῖ μοι — «вот, Господь помогает Мне»; τίς κακώσει με — «кто озлобит Меня» (κακόω); πάντες ὑμεῖς ὡς ἱμάτιον παλαιωθήσεσθε — «все вы, как одежда, обветшаете» (παλαιόω); ὡς σὴς καταφάγεται ὑμᾶς — «как моль, поест вас» (σής — моль; 虫). Слав. удваивает «Господь Господь». Здесь закрывается песнь 「…」."
  10: "Τίς ἐν ὑμῖν ὁ φοβούμενος τὸν κύριον — «кто из вас боящийся Господа»; ἀκουσάτω τῆς φωνῆς τοῦ παιδὸς αὐτοῦ — «да послушает гласа Отрока [Раба] Его» (παῖς — しもべ, Раб Господень). οἱ πορευόμενοι ἐν σκότει οὐκ ἔστιν αὐτοῖς φῶς — «ходящие во тьме, нет им света»; πεποίθατε ἐπὶ τῷ ὀνόματι κυρίου — «уповайте на имя Господне» (πείθω, perfect); ἀντιστηρίσασθε ἐπὶ τῷ θεῷ — «утвердитесь на Боге» (ἀντιστηρίζω). Обращение пророка, без кавычек; в ru/МТ добавлено «в Боге своём»."
  11: "ἰδοὺ πάντες ὑμεῖς πῦρ καίετε — «вот, все вы огонь зажигаете» (καίω); κατισχύετε φλόγα — «укрепляете пламя» (κατισχύω; 炎を強める). πορεύεσθε τῷ φωτὶ τοῦ πυρὸς ὑμῶν — «ходите светом огня вашего»; τῇ φλογί, ᾗ ἐξεκαύσατε — «и пламенем, которое разожгли» (ἐκκαίω). δι᾽ ἐμὲ ἐγένετο ταῦτα ὑμῖν — «ради Меня было это вам» (слав. «мене ради быша сия вам»): первое лицо Господа, поэтому последние две фразы — в 「…」; ἐν λύπῃ κοιμηθήσεσθε — «в печали уснёте» (λύπη; κοιμάομαι). В ru/МТ «это будет вам от руки Моей; в мучении умрёте» — по МТ, не внесено."
