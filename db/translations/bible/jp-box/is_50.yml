# jp-box, Исаия, глава 50. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для гл. 50 есть фрагментами (50:4–11) и использован только для
# сверки (50:4); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 50: 1–3 разводное письмо матери, «разве рука Моя коротка», тьма на небе;
# 4–9 третья песнь Раба: язык научения, открытое ухо, подставленная спина,
# «кто осудит Меня?»; 10–11 кто боится Господа; возжигающие огонь.
# Речи: 50:1–3 — слово Господа в 「…」 (формула «так говорит Господь» вне кавычек);
# 50:4–9 — третья песнь Раба в 「…」; 50:10 — обращение пророка без кавычек;
# 50:11 — пророческий приговор без кавычек, последние две фразы от первого лица
# Господа — в 「…」.
# Нумерация по gr: 11 стихов; у csl и ru тоже 11, деление внутри главы совпадает.
# Паритет: 50:2 — LXX «высохнут рыбы их», в ru «рыбы гниют» (по МТ); 50:4 — LXX
# «γλῶσσαν παιδείας» («язык научения»), в ru/МТ «язык мудрых» (так же jp-joc);
# 50:5 — LXX «наставление Господне открывает уши», в ru «Господь Бог открыл»;
# 50:11 — LXX «ради Меня было это вам; в печали уснёте», в ru/МТ «это будет вам
# от руки Моей; в мучении умрете». Держим LXX и слав.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 離縁状, 債権者, 罪, 荒野, 粗布, 頬, 鞭, 虫, 裁き, 光
# уже в корпусе.
# Имена — в этой главе имён нет (Господь, Раб).

