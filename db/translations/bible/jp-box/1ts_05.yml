# jp-box, 1-я Царств, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: ковчег принесён в Азот (1–2), падение Дагона (3–5), наказание Азота (6–7),
# ковчег в Гефе (8–9), в Аскалоне (10–12).
# Речь — 「…」: 5:7 (азотяне), 5:8 (вопрос князей и ответ гефян), 5:10 (аскалонитяне),
# 5:11 (князья). Вложенной речи нет.
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕 нет: в главе нет церковных добавлений, которые надо было бы внести в текст.
# Слав. «(злата)» в 5:9 — помета издания в скобках (в гр. только ἕδρας, проверено:
# χρυσ — НЕТ), поэтому без 〔〕; слав. «в Азоте и в пределах его» (5:6) передаёт то же,
# что гр. μέσον τῆς χώρας αὐτῆς, — тоже без 〔〕. Всё отмечено в notes.
# Сносок ⟨…⟩ нет: 契約の箱, ペリシテ人, 神殿, 祭司, ダゴン уже пояснены в корпусе.
# 5:3 — слав. текст обрывается на «поставиша его на месте своем»; вторая половина
# (наказание Азота) есть только в греч. и переведена по базе.
# 5:4 — слав. «плесне ног» (подошвы ног) вместо греч. ἴχνη χειρῶν (следы/кисти рук);
# слово αμαφεθ в гр. тёмное (порча текста), передано «戸口の手前».
# jp-ni не использовался.

tr_code: jp-box
book: 1ts
chapter: 5
draft: true

verses:
  1: "ペリシテ人[じん]は神[かみ]の箱[はこ]を取[と]り、アベン・エゼルからアシュドドへ運[はこ]び入[い]れた。"
  2: "ペリシテ人は主[しゅ]の箱[はこ]を取[と]り上[あ]げ、ダゴンの神殿[しんでん]へ運[はこ]び込[こ]んで、ダゴンのわきに据[す]えた。"
  3: "アシュドドの人[ひと]たちは朝[あさ]早[はや]く起[お]きてダゴンの神殿に入[はい]り、見[み]ると、ダゴンが主[しゅ]の箱[はこ]の前[まえ]にうつ伏[ぶ]せに倒[たお]れていた。彼[かれ]らはダゴンを持[も]ち上[あ]げて、もとの場所[ばしょ]に据[す]え直[なお]した。主の手[て]はアシュドドの人たちの上[うえ]に重[おも]くなり、彼らを苦[くる]しめた。主はアシュドドとその周辺[しゅうへん]の人たちを腫[は]れ物[もの]で打[う]たれた。"
  4: "翌朝[よくあさ]も早[はや]く起[お]きると、見[み]よ、ダゴンは主[しゅ]の契約[けいやく]の箱[はこ]の前[まえ]にうつ伏[ぶ]せに倒[たお]れていた。ダゴンの頭[あたま]と両手[りょうて]は切[き]り離[はな]されて、戸口[とぐち]の手前[てまえ]にそれぞれ別々[べつべつ]に落[お]ち、両手首[りょうてくび]は戸口に転[ころ]がっていた。ただダゴンの胴[どう]だけが残[のこ]っていた。"
  5: "それゆえ、ダゴンの祭司[さいし]たちも、アシュドドのダゴンの神殿に入[はい]る者[もの]はみな、今日[きょう]に至[いた]るまでダゴンの神殿の敷居[しきい]を踏[ふ]まない。彼[かれ]らはそれを跨[また]いで通[とお]るからである。"
  6: "主[しゅ]の手[て]はアシュドドの上[うえ]に重[おも]くなり、彼[かれ]らに災[わざわ]いを下[くだ]し、彼らを腫[は]れ物[もの]で苦[くる]しめた。その地[ち]の真[ま]ん中[なか]に鼠[ねずみ]が湧[わ]き出[で]て、町[まち]には大[おお]きな死[し]の混乱[こんらん]が生[しょう]じた。"
  7: "アシュドドの人[ひと]たちは、事[こと]がそのとおりであるのを見[み]て言[い]った。「イスラエルの神[かみ]の箱[はこ]は、わたしたちのところに留[とど]まっていてはならない。その手[て]がわたしたちにも、わたしたちの神ダゴンにも厳[きび]しく下[くだ]っているからだ。」"
  8: "そこで彼[かれ]らは人[ひと]を遣[つか]わして、ペリシテ人の領主[りょうしゅ]たちをみな自分[じぶん]たちのところに集[あつ]め、「イスラエルの神[かみ]の箱[はこ]をどうしたらよいか」と言[い]った。するとガテの人たちが言った。「イスラエルの神の箱は、わたしたちのところへ移[うつ]そう。」こうして彼らはイスラエルの神の箱をガテへ移した。"
  9: "それが移[うつ]された後[あと]、主[しゅ]の手[て]がその町[まち]に下[くだ]り、非常[ひじょう]に大[おお]きな混乱[こんらん]が起[お]こった。主は町の人[ひと]を小[ちい]さい者[もの]から大きい者まで打[う]ち、彼[かれ]らを腫[は]れ物[もの]で打たれた。そこでガテの人たちは自分[じぶん]たちのために腫れ物の像[ぞう]を作[つく]った。"
  10: "彼[かれ]らは神[かみ]の箱[はこ]をアシュケロンへ送[おく]った。神の箱がアシュケロンに入[はい]ると、アシュケロンの人[ひと]たちは叫[さけ]んで言[い]った。「なぜ、イスラエルの神の箱をわたしたちのところへ送り返[かえ]して、わたしたちとわたしたちの民[たみ]を殺[ころ]そうとするのか。」"
  11: "そこで彼[かれ]らは人[ひと]を遣[つか]わして、ペリシテ人の領主[りょうしゅ]たちをみな集[あつ]め、言[い]った。「イスラエルの神[かみ]の箱[はこ]を送[おく]り返[かえ]し、もとの場所[ばしょ]に戻[もど]しなさい。わたしたちとわたしたちの民[たみ]を殺[ころ]さないために。」それは、イスラエルの神の箱がそこに入[はい]ったとき、死[し]の混乱[こんらん]が町[まち]全体[ぜんたい]に、きわめて重[おも]く起[お]こったからである。"
  12: "死[し]なずに生[い]き残[のこ]った者[もの]たちも腫[は]れ物[もの]で打[う]たれ、町[まち]の叫[さけ]びは天[てん]に上[のぼ]った。"

notes:
  1: "Καὶ ἀλλόφυλοι — «и иноплеменники»; в LXX 1 Царств ἀλλόφυλοι = филистимляне, как и во всём корпусе (ペリシテ人). ἔλαβον — взяли (λαμβάνω); εἰσήνεγκαν — внесли (εἰσφέρω). ἐξ Αβεννεζερ εἰς Ἄζωτον — из Авен-Езера в Азот (アベン・エゼル, アシュドド; ср. 1ts 4:1, где стан при Авен-Езере)."
  2: "οἶκος Δαγων — «дом Дагона», т.е. храм (神殿); παρέστησαν αὐτὴν παρὰ Δαγων — поставили её подле Дагона (παρίστημι; слав. «близ дагона»). Дагон — ダゴン, уже в корпусе (Суд 16:23)."
  3: "ὤρθρισαν — встали рано (ὀρθρίζω); τὸ πρωί — утром. πεπτωκὼς ἐπὶ πρόσωπον αὐτοῦ — павший лицом своим. ἤγειραν — подняли (ἐγείρω); κατέστησαν εἰς τὸν τόπον αὐτοῦ — поставили на место его (καθίστημι). Вторая половина стиха (ἐβαρύνθη χεὶρ κυρίου … τὴν Ἄζωτον καὶ τὰ ὅρια αὐτῆς) в слав. отсутствует — переведена по гр. ἕδρα — «седалище»; здесь о геморроидальных узлах/наростах (Синод. «наросты»), передано 腫れ物."
  4: "ἀφῃρημένα — отняты, отсечены (ἀφαιρέω). ἴχνη χειρῶν — «следы рук» (ἴχνος — след), т.е. кисти рук; слав. читает «плесне ног» (подошвы ног) — расхождение, перевод по гр. ἐπὶ τὰ ἐμπρόσθια αμαφεθ ἕκαστον — «на переднюю часть [порога] амафеф, каждое»: αμαφεθ — тёмное слово, вероятно порча текста; передано «戸口の手前», слав. «на празе». καρποί — запястья (καρπός), 手首. πρόθυρον — порог, 戸口. ῥάχις — хребет, здесь туловище, 胴."
  5: "ἐπιβαίνουσιν ἐπὶ βαθμόν — «ступают на ступень» (βαθμός); слав. «на праг», в тексте 敷居. πᾶς ὁ εἰσπορευόμενος — всякий входящий. ἕως τῆς ἡμέρας ταύτης — до сего дня. ὅτι ὑπερβαίνοντες ὑπερβαίνουσιν — «переступая переступают» (тавтология, вероятно порча вместо «перепрыгивают»): смысл — перешагивают через порог, отсюда 跨いで通る."
  6: "ἐβαρύνθη χεὶρ κυρίου — отяготела рука Господня (βαρύνω). ἐπήγαγεν αὐτοῖς — «навёл на них» (ἐπάγω); что именно — в гр. не сказано, слав. так же без дополнения. ἐξέζεσεν αὐτοῖς εἰς τὰς ναῦς — «вскипело им в …»: ναῦς «корабли» — порча, вероятно вместо ἕδρας (седалища); слав. «воскипе им на седалищах их». μέσον τῆς χώρας αὐτῆς — посреди страны его; ἀνεφύησαν μύες — расплодились мыши (ἀναφύω), 鼠. σύγχυσις θανάτου — «смешение смерти», смертоносное смятение/мор, 死の混乱. Слав. добавляет «в Азоте и в пределах его» — это передача того же μέσον τῆς χώρας αὐτῆς, поэтому в … не берётся."
  7: "εἶδον ὅτι οὕτως — увидели, что так. οὐ καθήσεται — «не сядет», т.е. не останется (καθέζομαι; слав. «не пребудет»). σκληρὰ χεὶρ αὐτοῦ — жёсткая, тяжкая рука Его (σκληρός). ἐφ᾽ ἡμᾶς καὶ ἐπὶ Δαγων θεὸν ἡμῶν — на нас и на Дагона, бога нашего."
  8: "σατράπαι τῶν ἀλλοφύλων — «сатрапы» филистимские, т.е. владетели/князья (領主); слав. «воеводы». Τί ποιήσωμεν — «что сделаем» (сослагательное deliberationis). οἱ Γεθθαῖοι — гефяне (Γεθ, ガテ); ответ приписан им, а не безымянным советникам (слав. и Синод. субъект не назван). μετελθέτω … μετῆλθεν — «пусть перейдёт … перешёл» (μετέρχομαι)."
  9: "ἐγενήθη μετὰ τὸ μετελθεῖν αὐτὴν — было после того, как её перенесли. γίνεται χεὶρ κυρίου ἐν τῇ πόλει — рука Господня на городе. τάραχος μέγας σφόδρα — смятение весьма великое (τάραχος). ἀπὸ μικροῦ ἕως μεγάλου — от малого до великого. ἐπάταξεν … εἰς τὰς ἕδρας αὐτῶν — поразил их в седалища (см. 5:3). ἐποίησαν ἑαυτοῖς … ἕδρας — «сделали себе седалища»: вероятно, изготовили изображения наростов (ср. 6:4–5). Слав. добавляет «(злата)» — помета издания в скобках, в гр. слова нет (проверено: χρυσ — НЕТ), поэтому в тексте без «золотых» и без ."
  10: "ἐξαποστέλλουσιν — отсылают (ἐξαποστέλλω). Ἀσκαλῶν — Аскалон, アシュケロン. ἐβόησαν — возопили (βοάω). Τί ἀπεστρέψατε — «зачем возвратили» (ἀποστρέφω). θανατῶσαι ἡμᾶς — умертвить нас (θανατόω)."
  11: "ἐξαποστείλατε — отошлите. καθισάτω εἰς τὸν τόπον αὐτῆς — «да сядет», да встанет на место своё. οὐ μὴ θανατώσῃ — «не умертвит» (μὴ οὐ — решительное отрицание). σύγχυσις θανάτου … βαρεῖα σφόδρα — тяжкое смертное смятение. ὡς εἰσῆλθεν … ἐκεῖ — «когда вошёл … туда»."
  12: "οἱ ζῶντες καὶ οὐκ ἀποθανόντες — живые и не умершие. ἐπλήγησαν εἰς τὰς ἕδρας — поражены в седалища (πλήσσω). κραυγὴ τῆς πόλεως — вопль города (κραυγή). ἀνέβη … εἰς τὸν οὐρανόν — взошёл до неба."
