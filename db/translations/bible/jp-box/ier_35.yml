verses:
  1: "ユダの王[おう]ヨヤキム、すなわちヨシヤの子[こ]の時代[じだい]に、主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]は、次[つぎ]のとおりである。"
  2: "「レカブ人[びと]の家[いえ]へ行[い]き、彼らを呼[よ]び集[あつ]めて主[しゅ]の家[いえ]へ連[つ]れて行[い]き、庭[にわ]の一[ひと]つに入[い]れて、ぶどう酒[ぶどうしゅ]を飲[の]ませよ。」"
  3: "そこでわたしは、エレミヤの子[こ]、ハバシンの子[こ]であるイエゾニヤと、その兄弟[きょうだい]たち、その子[こ]らたち、レカブ人[びと]の家[いえ]のすべての者[もの]を連[つ]れ出[だ]し、"
  4: "主[しゅ]の家[いえ]にある一室[ひとま]、すなわち、神[かみ]の人[ひと]ゲダルヤの子[こ]ハナニヤの子[こ]らが使[つか]っていた部屋[へや]に彼らを入[い]れた。それは君[きみ]たちの家[いえ]のそば、庭[にわ]を守[まも]るシャルムの子[こ]マアセヤの家[いえ]の上[うえ]にあった。"
  5: "そしてわたしは彼らの前[まえ]にぶどう酒[ぶどうしゅ]の入[はい]った壺[つぼ]と杯[さかずき]を置[お]いて言[い]った。「ぶどう酒を飲[の]みなさい。」"
  6: "しかし、彼らは言[い]った。「わたしたちはぶどう酒[ぶどうしゅ]を飲[の]まない。わたしたちの父[ちち]ヨナダブ、レカブの子[こ]が、『あなたがたもあなたがたの子[こ]らも、永遠[えいえん]にぶどう酒を飲[の]んではならない。"
  7: "家[いえ]を建[た]ててはならない。種[たね]を蒔[ま]いてはならない。ぶどう畑[ばたけ]を持[も]ってはならない。あなたがたはすべての日々[ひび]を天幕[てんまく]に住[す]まねばならない。そうすれば、あなたがたが滞在[たいざい]している地[ち]で、長[なが]く生[い]きることができる』と命[めい]じた。"
  8: "わたしたちは、すべての日々[ひび]、すなわちわたしたちも、妻[つま]たちも、息子[むすこ]たちも、娘[むすめ]たちもぶどう酒を飲[の]まないことについて、父[ちち]ヨナダブの声[こえ]に聞[き]き従[したが]ってきた。"
  9: "また、そこに住[す]むために家[いえ]を建[た]てることもなく、ぶどう畑[ばたけ]も畑[はたけ]も種[たね]もなかった。"
  10: "わたしたちは天幕[てんまく]に住[す]み、父[ちち]ヨナダブが命[めい]じたすべてのことを聞[き]いて行[おこな]ってきた。"
  11: "しかし、ネブカドネツァルがこの地[ち]に上[のぼ]って来[き]たとき、わたしたちは言[い]った。『さあ、カルデア人[じん]の軍[ぐん]勢[ぜい]とアッシリア人[じん]の軍勢を避[さ]けて、エルサレムへ入[はい]ろう』と。そして、そこに住[す]みついたのである。」"
  12: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  13: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。「行[い]って、ユダの人[ひと]とエルサレムに住[す]む者[もの]に告[つ]げよ。あなたがたは懲[こ]らしめを受[う]けて、わたしの言葉[ことば]に聞[き]き従[したが]うことを学[まな]ぼうとしないのか。"
  14: "ヨナダブの子[こ]レカブの子[こ]らは、父[ちち]が彼らに命[めい]じた『ぶどう酒を飲[の]まない』という言葉[ことば]を固[かた]く守[まも]り、今日[きょう]まで飲[の]まない。わたしはあなたがたに朝[あさ]早[はや]くから語[かた]り、語り続[つづ]けたが、あなたがたは聞[き]かなかった。"
  15: "わたしはあなたがたに、わたしのしもべである預言者[よげんしゃ]たちを遣[つか]わして言[い]った。『それぞれ悪[わる]い道[みち]から離[はな]れ返[かえ]り、あなたがたの行[おこな]いを改[あらた]めよ。ほかの神[かみ]々[がみ]に従[したが]ってそれらに仕[つか]えてはならない。そうすれば、わたしがあなたがたとあなたがたの父[ちち]たちに与[あた]えた地[ち]に住[す]み続[つづ]けることができる』と。しかし、あなたがたは耳[みみ]を傾[かたむ]けず、聞[き]かなかった。"
  16: "ヨナダブの子[こ]レカブの子[こ]らは父[ちち]の戒[いまし]めを守[まも]っているのに、この民[たみ]はわたしに聞[き]き従[したが]わない。"
  17: "それゆえ、万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。見[み]よ、わたしはユダとエルサレムに住[す]む者[もの]の上[うえ]に、彼らに対して告[つ]げたすべての災[わざわ]いを下[くだ]す。わたしが彼らに語[かた]ったのに彼らが聞かず、わたしが彼らを呼[よ]んだのに彼らが答[こた]えなかったからである。」"
  18: "レカブ人[びと]の家[いえ]には、エレミヤはこう言[い]った。「万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。あなたがたは父[ちち]ヨナダブの戒[いまし]めに聞[き]き従[したが]い、彼があなたがたに命[めい]じたすべてのことを行[おこな]い、"
  19: "それゆえ、万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。ヨナダブの子[こ]レカブの子[こ]らのうちには、わたしの前[まえ]に立[た]つ男[おとこ]が、地[ち]のすべての日々[ひび]の間[あいだ]、絶[た]えることはない、と主[しゅ]は言[い]われる。」"

notes:
  1: "ἐν ἡμέραις Ιωακιμ βασιλέως Ιουδα — «во дни Иоакима, царя Иудейского»; слав. добавляет «сына иосиина» — нет в LXX, внесено (ヨシヤの子). Надписание к речи о Рехавитах."
  2: "Βάδισον εἰς οἶκον Αρχαβιν — «пойди в дом Рехавитов» (Αρχαβιν — Рехав; в тексте レカブ人); ἄξεις αὐτοὺς — «приведёшь их»; слав. добавляет «призови я» (позови их) — нет в LXX, внесено (呼び集めて); εἰς μίαν τῶν αὐλῶν — «в один из дворов» (庭); ποτιεῖς αὐτοὺς οἶνον — «напоишь их вином»."
  3: "ἐξήγαγον — «я вывел» (1 л. ед. ч.); Ιεζονιαν υἱὸν Ιερεμιν υἱοῦ Χαβασιν — «Иезанию, сына Иеремии, сына Хавацина» (イエゾニヤ, ハバシン — новые имена); πᾶσαν τὴν οἰκίαν Αρχαβιν — «весь дом Рехавитов». Пророк говорит о себе в 1-м лице, но это повествование, а не прямая речь, поэтому кавычек нет."
  4: "παστοφόριον — «пастофорий», храмовая комната-хранилище (слав. «хранилище имения»; ru «комната»); υἱῶν Ανανιου υἱοῦ Γοδολιου ἀνθρώπου τοῦ θεοῦ — «сынов Анании, сына Годолии, человека Божия» (ゲダルヤ); ἐγγὺς τοῦ οἴκου τῶν ἀρχόντων — «близ дома князей»; ἐπάνω τοῦ οἴκου Μαασαιου υἱοῦ Σελωμ τοῦ φυλάσσοντος τὴν αὐλήν — «выше дома Маасеи, сына Селлума, стража двора»."
  5: "κεράμιον οἴνου — «глиняный сосуд вина» (κεράμιον — корчага, 壺); ποτήρια — «чаши» (杯); Πίετε οἶνον — «пейте вино»."
  6: "Οὐ μὴ πίωμεν — «не выпьем» (усиленное отрицание); Ιωναδαβ υἱὸς Ρηχαβ ὁ πατὴρ ἡμῶν — «Ионадав, сын Рехава, отец наш»; ἐνετείλατο — «заповедал»; ἕως αἰῶνος — «до века». С этих слов идёт ответ Рехавитов (6–11); заповедь отца — 『…』. О имени Рехава: в корпусе 4 Цар 10:15 тот же человек — リハブ; здесь レカブ по брифу (имя клана, ср. 1 Пар 2:55)."
  7: "οἰκίαν οὐ μὴ οἰκοδομήσητε — «домов не стройте»; σπέρμα οὐ μὴ σπείρητε — «семени не сейте»; ἀμπελὼν οὐκ ἔσται ὑμῖν — «виноградника не будет у вас»; ἐν σκηναῖς οἰκήσετε — «в шатрах живите» (天幕); ὅπως ἂν ζήσητε ἡμέρας πολλὰς ἐπὶ τῆς γῆς, ἐφ' ἧς διατρίβετε — «чтобы прожить много дней на земле, на которой вы странствуете» (διατρίβω — проводить время, жить)."
  8: "ἠκούσαμεν τῆς φωνῆς — «послушали голоса» (родительный при глаголе слушания); ἡμεῖς καὶ αἱ γυναῖκες ἡμῶν καὶ οἱ υἱοὶ καὶ αἱ θυγατέρες — «мы и жёны наши, и сыновья, и дочери»."
  9: "πρὸς τὸ μὴ οἰκοδομεῖν οἰκίας τοῦ κατοικεῖν ἐκεῖ — «чтобы не строить домов для жительства там»; ἀμπελὼν καὶ ἀγρὸς καὶ σπέρμα οὐκ ἐγένετο ἡμῖν — «виноградника, и поля, и семени не было у нас»."
  10: "ᾠκήσαμεν ἐν σκηναῖς — «жили в шатрах»; κατὰ πάντα, ἃ ἐνετείλατο ἡμῖν Ιωναδαβ — «по всему, что заповедал нам Ионадав»."
  11: "ἀνέβη Ναβουχοδονοσορ ἐπὶ τὴν γῆν — «пришёл (поднялся) Навуходоносор на землю»; ἀπὸ προσώπου τῆς δυνάμεως τῶν Χαλδαίων καὶ... τῶν Ἀσσυρίων — «от лица силы Халдейской и... Ассирийской»: LXX читает «ассирийцев», ru (МТ) — «арамейцев»; в тексте по LXX/csl アッシリア人; εἰσέλθατε καὶ εἰσέλθωμεν — «войдите и войдём» (повелительное + когортатив, слав. «вшедше да внидем»), передано одним оборотом; ᾠκοῦμεν ἐκεῖ — «поселились там»."
  12: "ἐγένετο λόγος κυρίου πρός με λέγων — вводная формула вне кавычек."
  13: "Οὐ μὴ λάβητε παιδείαν τοῦ ἀκούειν τοὺς λόγους μου; — «не примете ли наказания (наставления), чтобы слушать слова Мои?» (παιδεία — наказание, научение); слав. добавляет «Господь сил, Бог израилев» при «так говорит Господь» — нет в LXX, внесено (万軍の主、イスラエルの神); оборот οὐ μή в вопросе передан как «…しないのか» (слав. «еда»)."
  14: "ἔστησαν ῥῆμα — «утвердили слово» (ἵστημι — ставить, утверждать); ὃ ἐνετείλατο τοῖς τέκνοις αὐτοῦ — «которое заповедал детям своим»; ὄρθρου — «с раннего утра» (ср. 7:13,25); ἐλάλησα... καὶ οὐκ ἠκούσατε. Слав. добавляет «даже до дне сего» — нет в LXX, внесено (今日まで)."
  15: "Ἀποστράφητε ἕκαστος ἀπὸ τῆς ὁδοῦ αὐτοῦ τῆς πονηρᾶς — «отвратитесь каждый от злого пути своего»; βελτίω ποιήσατε τὰ ἐπιτηδεύματα ὑμῶν — «исправьте занятия (дела) ваши» (ἐπιτήδευμα); οὐ πορεύσεσθε ὀπίσω θεῶν ἑτέρων — «не ходите вслед иных богов»; οἰκήσετε ἐπὶ τῆς γῆς, ἧς ἔδωκα ὑμῖν καὶ τοῖς πατράσιν ὑμῶν; οὐκ ἐκλίνατε τὰ ὦτα ὑμῶν — «не приклонили ушей ваших»."
  16: "ἔστησαν... τὴν ἐντολὴν τοῦ πατρὸς αὐτῶν — «уставили (соблюли) заповедь отца своего» (ἐντολή — заповедь); ὁ δὲ λαὸς οὗτος οὐκ ἤκουσάν μου — «а народ сей не послушал Меня» (подлежащее ед., глагол мн. — конструкция по смыслу, слав. «людие мои не послушаша мене»)."
  17: "φέρω ἐπὶ Ιουδαν... πάντα τὰ κακά — «навожу на Иуду... всё зло»; слав. добавляет «понеже глаголах к ним, и не послушаша, призывах я, и не отвещаша ми» — нет в LXX, внесено без скобок; слав. также «Господь сил, Бог израилев» — внесено."
  18: "Ἐπειδὴ ἤκουσαν υἱοὶ Ιωναδαβ... τὴν ἐντολὴν τοῦ πατρὸς αὐτῶν — «за то, что послушали сыны Ионадава... заповедь отца своего»; ποιεῖν καθότι ἐνετείλατο αὐτοῖς ὁ πατὴρ αὐτῶν — «делать так, как заповедал им отец их»; слав. начинает стих «Дому же рихавлю рече иеремиа» — нет в LXX, внесено как вводная формула (レカブ人の家には、エレミヤはこう言った)."
  19: "οὐ μὴ ἐκλίπῃ ἀνὴρ τῶν υἱῶν Ιωναδαβ — «не оскудеет муж из сынов Ионадава» (ἐκλείπω — оскудевать); παρεστηκὼς κατὰ πρόσωπόν μου — «предстоящий пред лицом Моим» (παρίστημι — предстоять, служить); πάσας τὰς ἡμέρας τῆς γῆς — «во все дни земли»."
