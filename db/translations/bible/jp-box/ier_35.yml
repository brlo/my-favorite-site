chapter: 35
draft: true

verses:
  1: "セデキヤ、ユダの王[おう]の治[ち]世[せい]の第四[だいよん]年[ねん]、第五[だいご]の月[つき]、ギベオン出身[しゅっしん]の偽[ぎ]預言者[よげんしゃ]アナニヤ、アゾルの子[こ]が、主[しゅ]の家[いえ]で、祭司[さいし]たちと民[たみ]すべての目[め]の前[まえ]で、わたしに言[い]った。"
  2: "「万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。『わたしはバビロンの王[おう]の軛[くびき]を砕[くだ]いた。"
  3: "あと二年[にねん]のうちに、わたしは主[しゅ]の家[いえ]の器[うつわ]をすべて、この場所[ばしょ]に返[かえ]す。すなわち、バビロンの王[おう]ネブカドネツァルがこの場所から取[と]ってバビロンへ運[はこ]んだものすべてを。"
  4: "また、エホヤキン、ユダの王[おう]と、バビロンへ行[い]ったユダの捕[と]らわれの民[たみ]すべてを、わたしはこの場所[ばしょ]に返[かえ]す、と主[しゅ]は言[い]われる。わたしはバビロンの王[おう]の軛[くびき]を砕[くだ]くからである。』」"
  5: "エレミヤは、主[しゅ]の家[いえ]に立[た]っている祭司[さいし]たちと民[たみ]すべての目[め]の前[まえ]で、預言者[よげんしゃ]アナニヤに言[い]った。"
  6: "「まことに、そのとおりに主[しゅ]がなさるように。主があなたの預言[よげん]した言葉[ことば]を成[な]し遂[と]げ、主の家[いえ]の器[うつわ]と捕[と]らわれの民[たみ]すべてを、バビロンからこの場所[ばしょ]に返[かえ]されるように。"
  7: "ただ、わたしがあなたの耳[みみ]に、また民[たみ]すべての耳に語[かた]る主[しゅ]の言葉[ことば]を聞[き]け。"
  8: "わたしより前[まえ]に、またあなたがたより前に、昔[むかし]からあった預言者[よげんしゃ]たちは、多[おお]くの地[ち]と大[おお]きな国[くに]々[ぐに]について、戦[いくさ]と災[わざわ]いと飢[うえ]を預言[よげん]した。"
  9: "平[へい]和[わ]を預言した預言者[よげんしゃ]は、その言葉[ことば]が実現[じつげん]したとき、主[しゅ]が真実[しんじつ]に遣[つか]わした預言者と認[みと]められる。」"
  10: "そこで、預言者[よげんしゃ]アナニヤは民[たみ]すべての目[め]の前[まえ]で、エレミヤの首[くび]から軛[くびき]を取[と]って砕[くだ]いた。"
  11: "アナニヤは民[たみ]すべての目[め]の前[まえ]で言[い]った。「主[しゅ]はこう言[い]われる。『わたしはこのように、二年[にねん]のうちに、バビロンの王[おう]ネブカドネツァルの軛[くびき]を、すべての民[たみ]の首[くび]から砕[くだ]く。』」そして、エレミヤは自分[じぶん]の道[みち]を行[い]った。"
  12: "アナニヤがエレミヤの首[くび]から軛[くびき]を砕[くだ]いた後[あと]、主[しゅ]の言葉[ことば]がエレミヤにあった。"
  13: "「行[い]って、アナニヤに言[い]え。主[しゅ]はこう言[い]われる。あなたは木[き]の軛[くびき]を砕[くだ]いた。それに代[か]えて、わたしは鉄[てつ]の軛を作[つく]る。"
  14: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。わたしはすべての民[たみ]の首[くび]に鉄[てつ]の軛[くびき]を置[お]き、バビロンの王[おう]に仕[つか]えさせる。彼らは彼に仕える。野[の]の獣[けもの]たちさえ、わたしは彼に与[あた]えた。」"
  15: "エレミヤはアナニヤに言[い]った。「アナニヤよ、聞[き]け。主[しゅ]はあなたを遣[つか]わしていない。あなたはこの民[たみ]に偽[いつわ]りを信[しん]じさせた。"
  16: "それゆえ、主[しゅ]はこう言[い]われる。『見[み]よ、わたしはあなたを地[ち]の面[おもて]から追[お]い払[はら]う。あなたはこの年[とし]に死[し]ぬ。主[しゅ]に逆[さから]って語[かた]ったからである。』」"
  17: "そして、アナニヤはその年[とし]の第七[だいしち]の月[つき]に死[し]んだ。"

notes:
  1: "ἐν τῷ τετάρτῳ ἔτει Σεδεκια βασιλέως Ιουδα ἐν μηνὶ τῷ πέμπτῳ — «в четвёртый год Седекии, царя Иудейского, в пятый месяц»; слав. «в четвертое лето, царствующу седекии царю иудину, в пятый месяц». ru добавляет «в начале царствования Седекии» — по МТ, не внесено (в LXX этого нет). Ανανιας υἱὸς Αζωρ ὁ ψευδοπροφήτης ὁ ἀπὸ Γαβαων — «Анания, сын Азора, лжепророк из Гаваона»: имя отца по греч. Азор (アゾル), в ru «Азур» (МТ). ἐν οἴκῳ κυρίου κατ' ὀφθαλμοὺς τῶν ἱερέων καὶ παντὸς τοῦ λαοῦ — «в доме Господнем пред глазами священников и всего народа» (κατ' ὀφθαλμούς — «на глазах»)."
  2: "Συνέτριψα τὸν ζυγὸν τοῦ βασιλέως Βαβυλῶνος — «Я сокрушил ярмо царя Вавилонского»: прошедшее время как пророческое совершённое. Слав. добавляет «вседержитель Бог израилев» при «Господь» — нет в LXX, внесено в текст без скобок (万軍の主、イスラエルの神). Слова Анании даны как его речь 「…」, а слово, которое он возвещает от имени Господа, — вложенной речью 『…』: лжепророк говорит в доме Господнем, и его слово отделено от слова Господа."
  3: "ἔτι δύο ἔτη ἡμερῶν — «ещё два года дней», т. е. через два года (слав. «еще два лета дний»). ἀποστρέψω εἰς τὸν τόπον τοῦτον τὰ σκεύη οἴκου κυρίου — «возвращу на место сие сосуды дома Господня» (σκεῦος — сосуд, утварь храма, взятая Навуходоносором, 4 Цар 24:13). Слав. добавляет «яже взя навуходоносор царь вавилонский от места сего и пренесе я до вавилона» — нет в LXX этого стиха, внесено в текст без скобок (ネブカドネツァルが…運んだものすべてを)."
  4: "καὶ Ιεχονιαν καὶ τὴν ἀποικίαν Ιουδα — «и Иехонию и переселение Иуды» (ἀποικία — переселение, плен); ὅτι συντρίψω τὸν ζυγὸν βασιλέως Βαβυλῶνος — «ибо сокрушу ярмо царя Вавилонского»: в греч. стих обрывается на этом. Слав. добавляет «вшедшее в вавилон возвращу в место сие, глаголет Господь» — внесено в текст без скобок. Здесь закрывается речь Анании."
  5: "κατ' ὀφθαλμοὺς παντὸς τοῦ λαοῦ καὶ κατ' ὀφθαλμοὺς τῶν ἱερέων τῶν ἑστηκότων ἐν οἴκῳ κυρίου — «пред глазами всего народа и пред глазами священников, стоящих в доме Господнем». Слав. «пред очима жерцев и пред очима всех людий стоящих в дому Господни» — причастие отнесено к народу, в тексте к священникам и народу вместе (по греч.)."
  6: "Ἀληθῶς — «истинно, аминь»: Иеремия принимает пожелание, а не пророчество. οὕτω ποιήσαι κύριος — «так да сотворит Господь» (оптатив, пожелание); στήσαι τὸν λόγον σου — «да утвердит слово твоё» (ἵστημι — ставить, утверждать); τοῦ ἐπιστρέψαι τὰ σκεύη — «чтобы возвратить сосуды». Форма пожелания сохранена без です・ます (…なさるように／…されるように)."
  7: "πλὴν ἀκούσατε τὸν λόγον κυρίου — «только выслушайте слово Господне» (πλήν — «впрочем, только»); ὃν ἐγὼ λέγω εἰς τὰ ὦτα ὑμῶν καὶ εἰς τὰ ὦτα παντὸς τοῦ λαοῦ — «которое я говорю в уши ваши и в уши всего народа». Слав. «обаче слышите слово сие»."
  8: "οἱ προφῆται οἱ γεγονότες πρότεροί μου καὶ πρότεροι ὑμῶν ἀπὸ τοῦ αἰῶνος — «пророки, бывшие прежде меня и прежде вас от века» (ἀπὸ τοῦ αἰῶνος — издревле); ἐπροφήτευσαν ἐπὶ γῆς πολλῆς καὶ ἐπὶ βασιλείας μεγάλας — «пророчествовали о многих землях и великих царствах»; εἰς πόλεμον — «на войну». Слав. добавляет «и о погублении и о гладе» — по МТ, внесено в текст без скобок (災いと飢え)."
  9: "ὁ προφήτης ὁ προφητεύσας εἰς εἰρήνην — «пророк, пророчествовавший о мире»; ἐλθόντος τοῦ λόγου γνώσονται τὸν προφήτην — «когда придёт слово, узнают пророка» (γιγνώσκω — узнавать, признавать); ὃν ἀπέστειλεν αὐτοῖς κύριος ἐν πίστει — «которого послал им Господь верно» (ἐν πίστει — в верности, истинно). Слав. «в вере». Здесь закрывается ответ Иеремии (6–9)."
  10: "ἔλαβεν Ανανιας ἐν ὀφθαλμοῖς παντὸς τοῦ λαοῦ τοὺς κλοιοὺς ἀπὸ τοῦ τραχήλου Ιερεμιου — «взял Анания на глазах всего народа ярма (обручи) с шеи Иеремии» (κλοιός — шейное ярмо, обруч); συνέτριψεν αὐτούς — «сокрушил их». Слав. «клады». Пророк носил знак, о котором говорит гл. 34."
  11: "Οὕτως συντρίψω τὸν ζυγὸν βασιλέως Βαβυλῶνος ἀπὸ τραχήλων πάντων τῶν ἐθνῶν — «так сокрушу ярмо царя Вавилонского с шей всех народов»: в греч. нет ни «Навуходоносора», ни «через два года». Слав. добавляет «навуходоносора царя вавилонска» и «еще два лета дний» — по МТ, внесено в текст без скобок. καὶ ᾤχετο Ιερεμιας εἰς τὴν ὁδὸν αὐτοῦ — «и пошёл Иеремия своею дорогою» — авторский текст вне кавычек."
  12: "μετὰ τὸ συντρῖψαι Ανανιαν τοὺς κλοιοὺς ἀπὸ τοῦ τραχήλου αὐτοῦ — «после того как Анания сокрушил ярма с шеи его». Слав. «по сокрушении ананиине клад со выи его». С этого стиха начинается новое слово Господне."
  13: "Κλοιοὺς ξυλίνους συνέτριψας, καὶ ποιήσω ἀντ' αὐτῶν κλοιοὺς σιδηροῦς — «ярма деревянные ты сокрушил, и Я сделаю вместо них ярма железные»: в греч. 1-е л. («Я сделаю»), в слав. 2-е л. («сотвориши вместо тех клады железны») — по МТ; в тексте по греч., разница отмечена. ξύλινος — деревянный; σιδηροῦς — железный. Смысл: слово Господне не отменяется, но тяжелеет."
  14: "Ζυγὸν σιδηροῦν ἔθηκα ἐπὶ τὸν τράχηλον πάντων τῶν ἐθνῶν — «ярмо железное Я положил на шею всех народов»; ἐργάζεσθαι τῷ βασιλεῖ Βαβυλῶνος — «чтобы работали царю Вавилонскому». Слав. добавляет «Бог израилев» при «Господь» и «ктому и звери земныя дах ему» — нет в LXX, внесено в текст без скобок. Здесь закрывается слово Господне (13–14)."
  15: "Οὐκ ἀπέσταλκέν σε κύριος — «не послал тебя Господь» (перфект — «ты не послан»); πεποιθέναι ἐποίησας τὸν λαὸν τοῦτον ἐπ' ἀδίκῳ — «ты сделал, что народ сей надеялся на неправду» (πεποίθησις — надежда, упование; ἐπ' ἀδίκῳ — на неправду). Слав. «сотворил еси людий сих уповати на неправду»."
  16: "ἐξαποστέλλω σε ἀπὸ προσώπου τῆς γῆς — «Я отсылаю (изгоняю) тебя с лица земли»; τούτῳ τῷ ἐνιαυτῷ ἀποθανῇ — «в этот год умрёшь». Слав. добавляет «яко на Господа (Бога) глаголал еси» — «ибо ты говорил против Господа»: в LXX нет, скобки слав. — по МТ; в тексте без скобок (主に逆らって語ったからである), оговорено."
  17: "καὶ ἀπέθανεν ἐν τῷ μηνὶ τῷ ἑβδόμῳ — «и умер в месяце седьмом»: в греч. только это. Слав. «и умре ананиа лжепророк в сем лете месяца седмаго» — добавления «Анания лжепророк» и «в этом году» внесены в текст без скобок (アナニヤ…その年の第七の月に死んだ)."
