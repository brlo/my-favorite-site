# Глава 35 — Анания и деревянное ярмо (в слав./ru это глава 28).
# План: 1 четвёртый год Седекии, пятый месяц: Анания, сын Азора, лжепророк из
# Гаваона, говорит в доме Господнем; 2–4 его слово: «сокрушил ярмо царя Вавилонского,
# через два года возвращу сосуды и Иехонию»; 5–6 Иеремия отвечает «аминь» и
# напоминает о прежних пророках; 7–9 критерий: пророк мира узнаётся, когда слово
# сбылось; 10–11 Анания сокрушает ярмо и повторяет своё слово; 12–14 слово Господне:
# «ты сокрушил ярмо деревянное — будет железное»; 15–16 «Господь тебя не посылал»,
# «в этом году умрёшь»; 17 смерть Анании в седьмом месяце.
# Голоса: 1 — авторский текст; 2–4 — 「…」 (речь Анании), внутри неё слово Господне
# дано вложенной речью 『…』; 5 — авторский текст; 6–9 — 「…」 (ответ Иеремии);
# 10 — авторский текст; 11 — 「…」 (снова Анания, слово Господне — 『…』), в конце
# стиха авторский текст «и пошёл Иеремия своею дорогою»; 12 — авторский текст;
# 13–14 — 「…」 (слово Господне пророку); 15 — 「…」 (речь Иеремии), 16 — слово
# Господне внутри неё, вложенной речью 『…』; 17 — авторский текст.
# Нумерация: gr 17 стихов = слав. 28:1–17, номер в номер; «точек» в главе нет.
# 〔…〕 нет; сносок ⟨…⟩ нет: 軛, 器, 首, 長老 уже в корпусе, пояснения — в notes.
