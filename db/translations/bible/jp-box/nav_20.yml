# jp-box, Иисус Навин, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 20: шесть городов убежища.
# ВНИМАНИЕ: глава в gr-lxx-byz дефектна — 6 стихов вместо 9. Соответствие csl-ru:
# gr 1 = csl 1; gr 2 = csl 2; gr 3 = csl 3; gr 4 = csl 7; gr 5 = csl 8;
# gr 6 = csl 9 (с повторением заключительной формулы csl 3/6). Иначе говоря,
# ст. 4–6 вобрали список городов и заключение (csl 7–9), а содержание csl 4–6
# (беглец у городских ворот, старейшины, жизнь в городе до смерти первосвященника)
# в модуле отсутствует. Переведено по гр-тексту, 6 стихов, нумерация не исправлена;
# см. notes 4–6.
# В гр 4–5 глаголы стоят в 3-м л. ед. ч. (διέστειλεν, ἔδωκεν) без названного
# подлежащего — в японском подлежащее опущено.
# Речь Бога — 「…」 (2–3). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (сверено bracket_check.rb).
# Сносок ⟨…⟩ нет: 避難の町, 人殺し, 血の復讐者, 会衆, 寄留者 уже в корпусе (Числ 35).
# Термины: φυγαδευτήριον — 避難の町 / 避難所; ἀγχιστεύων τὸ αἷμα — 血の復讐者;
# πρόσηλυτος ὁ προσκείμενος — 寄留する者; καταφυγεῖν — 逃げ込む.
# LXX: 20:4 Αρβοκ [αὕτη ἐστὶν Χεβρων] — квадратные скобки критического издания
# переданы как （…）; 20:5 Αρημωθ = Рамоф, Γαυλων = Голан (в Синодальном «Рамоф»,
# «Голан»); приняты формы корпуса ラモト, ガウロン, ボソル (ср. Втор 4:43).
# jp-ni не использовался.

tr_code: jp-box
book: nav
chapter: 20
draft: true

verses:
  1: "主[しゅ]はヨシュアに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。あなたがたは、わたしがモーセによってあなたがたに告[つ]げた避難[ひなん]の町々[まちまち]を与[あた]えなさい。"
  3: "すなわち、思[おも]わず人の命[いのち]を打[う]った人殺[ひとごろ]しのための避難所[ひなんじょ]である。これらの町[まち]はあなたがたの避難所となり、その人殺しは、会衆[かいしゅう]の前[まえ]に立[た]って裁[さば]きを受[う]けるまで、血[ち]の復讐者[ふくしゅうしゃ]によって死[し]ぬことはない。」"
  4: "そして、ガリラヤのナフタリの山地[さんち]にあるカデシュを、エフライムの山地にあるシェケムを、ユダの山地にあるアルボクの町[まち]（これはヘブロンである）を分[わ]け定[さだ]めた。"
  5: "また、ヨルダン川[がわ]の向[む]こう側[がわ]では、ルベンの部族[ぶぞく]から荒野[こうや]の平野[へいや]にあるボソルを、ガドの部族からギレアデのラモトを、マナセの部族からバシャンにあるガウロンを与[あた]えた。"
  6: "これらの町[まち]は、イスラエルの子[こ]らと、彼らの間[あいだ]に寄留[きりゅう]する者[もの]とのために名[な]を呼[よ]ばれた町々であり、思[おも]わず人の命[いのち]を打[う]った者がだれでも、血[ち]の復讐者[ふくしゅうしゃ]の手[て]によって死[し]ぬことなく、会衆[かいしゅう]の前[まえ]に立[た]って裁[さば]きを受[う]けるまで、そこへ逃[に]げ込[こ]むためである。"

notes:
  1: "Формула ἐλάλησεν κύριος τῷ Ἰησοῖ λέγων; речь — со 2-го стиха."
  2: "Λάλησον … λέγων — «скажи, говоря». Δότε τὰς πόλεις τῶν φυγαδευτηρίων — «дайте города убежищ» (род. мн. φυγαδευτήριον). ἃς εἶπα πρὸς ὑμᾶς διὰ Μωυσῆ — «которые Я сказал вам через Моисея» (εἶπον в значении «повелел, обещал»; слав. «яже рекох к вам моисеом»)."
  3: "φυγαδευτήριον τῷ φονευτῇ — «убежище убийце» (φονευτής; ср. Числ 35:6). τῷ πατάξαντι ψυχὴν ἀκουσίως — «поразившему душу невольно» (πατάσσω, ἀκουσίως). ἀγχιστεύων τὸ αἷμα — мстящий за кровь (血の復讐者, ср. Числ 35:12). ἕως ἂν καταστῇ ἐναντίον τῆς συναγωγῆς εἰς κρίσιν — «доколе не предстанет пред обществом на суд»; формула повторена в ст. 6. Здесь кончается речь Бога."
  4: "Соответствует csl 7, а не csl 4: διέστειλεν — «отделил, назначил» (3-е л. ед. ч.; в слав. «отделиша» — мн. ч., подлежащее не названо). Καδης ἐν τῇ Γαλιλαίᾳ ἐν τῷ ὄρει τῷ Νεφθαλι — Кадес в Галилее, на горе Неффалимовой (カデシュ; ср. 21:32). Συχεμ ἐν τῷ ὄρει τῷ Εφραιμ — Сихем на горе Ефремовой. Αρβοκ [αὕτη ἐστὶν Χεβρων] — Арбок, то есть Хеврон (в слав. «арво»); квадратные скобки критического издания переданы как （…）. Содержание csl 4–6 (беглец у ворот, старейшины, жизнь до смерти первосвященника) в gr-lxx-byz отсутствует."
  5: "Соответствует csl 8: ἔδωκεν — «дал» (3-е л. ед. ч.). Βοσορ ἐν τῇ ἐρήμῳ ἐν τῷ πεδίῳ — Босор в пустыне, на равнине (ボソル; в Синодальном «Бецер»). Αρημωθ ἐν τῇ Γαλααδ — Аремоф в Галааде, то есть Рамоф (ラモト; в слав. «рамоф»; в 21:38 — Ραμωθ). Γαυλων ἐν τῇ Βασανίτιδι — Гавлон в Васанитиде (ガウロン; в Синодальном «Голан»). Формы согласованы с Втор 4:43."
  6: "Соответствует csl 9; в конце повторена формула csl 3/6 (ἕως ἂν καταστῇ ἔναντι τῆς συναγωγῆς εἰς κρίσιν). αἱ ἐπίκλητοι — «названные, призванные» (ἐπίκλητος; слав. «избраны»); в тексте 名を呼ばれた. τῷ προσηλύτῳ τῷ προσκειμένῳ ἐν αὐτοῖς — «пришельцу, прилежащему у них» (πρόσηλυτος, πρόσκειμαι). παίοντι ψυχὴν ἀκουσίως — ср. ст. 3. В csl 4–6 этот же смысл раскрыт пространнее (бегство к воротам, суд старейшин, жизнь до смерти первосвященника); в модуле этих стихов нет."
