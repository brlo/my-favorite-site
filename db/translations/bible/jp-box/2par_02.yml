verses:
  1: "ソロモンは、主[しゅ]の名[な]のために家[いえ]を、また自分[じぶん]の王国[おうこく]のために家を建[た]てようと言[い]った。"
  2: "ソロモンは七万[しちまん]人[にん]の男[おとこ]たちと、山[やま]で石[いし]を切[き]る八万[はちまん]人[にん]を集[あつ]め、その上[うえ]に三千六百人[さんぜんろっぴゃくにん]の監督[かんとく]を置[お]いた。"
  3: "ソロモンはツロの王[おう]ヒラムに人[ひと]を遣[つか]わして言[い]った。「あなたは、わたしの父[ちち]ダビデにしたとおり、彼に杉[すぎ]の木[き]を送[おく]って、住[す]む家[いえ]を建[た]てさせた。"
  4: "そして今[いま]、わたしはその子[こ]として、わたしの神[かみ]である主[しゅ]の名[な]のために家[いえ]を建[た]て、それを主に聖別[せいべつ]し、主の前[まえ]で香[こう]をたき、供[そな]えのパンを絶[た]えず供[そな]え、朝[あさ]と夕[ゆう]べ、安息日[あんそくび]と新月[しんげつ]の祭[まつ]りと、わたしたちの神である主の祭りに、燔祭[はんさい]を絶えずささげるためである。これはイスラエルのために永遠[えいえん]に定[さだ]められている。"
  5: "わたしが建[た]てる家[いえ]は大[おお]きい。わたしたちの神[かみ]はすべての神[かみ]々[がみ]よりも大[おお]きいからである。"
  6: "しかし、だれが主[しゅ]のために家[いえ]を建[た]てる力[ちから]があるだろうか。天[てん]も、天[てん]の天[てん]も、主の栄光[えいこう]を収[おさ]めることはできない。わたしは何者[なにもの]で、主のために家を建てるのだろうか。ただ主の前[まえ]で香[こう]をたくためだけである。"
  7: "今[いま]、金[きん]と銀[ぎん]、青銅[せいどう]と鉄[てつ]、紫[むらさき]と緋[ひ]と青[あお]で仕事[しごと]をし、わたしとともにユダとエルサレムにいる賢[かしこ]い者[もの]たちとともに彫[ほ]り物[もの]を彫[ほ]ることを知[し]っている賢い者を、わたしに送[おく]ってほしい。その者たちは、わたしの父[ちち]ダビデが用意[ようい]した者たちである。"
  8: "また、レバノンから杉[すぎ]とビャクシンと糸杉[いとすぎ]の木[き]をわたしに送[おく]ってほしい。あなたのしもべたちがレバノンで木を切ることを知[し]っているのを、わたしは知っている。見[み]よ、わたしのしもべたちはあなたのしもべたちとともにいて、"
  9: "彼[かれ]らは行[い]って、わたしのために多[おお]くの木[き]を用意[ようい]する。わたしが建[た]てる家[いえ]は大[おお]きく、栄光[えいこう]に満[み]ちているからである。"
  10: "見[み]よ、木[き]を切[き]る仕事[しごと]をする者[もの]たち、あなたのしもべたちに、わたしは食物[しょくもつ]として小麦[こむぎ]二万[にまん]コル、大麦[おおむぎ]二万コル、ぶどう酒[しゅ]二万[にまん]バト、油[あぶら]二万バトを与[あた]えた。」"
  11: "ツロの王[おう]ヒラムは書面[しょめん]で答[こた]えて、ソロモンに送[おく]った。「主[しゅ]がご自分[じぶん]の民[たみ]を愛[あい]されたので、あなたをその上[うえ]の王[おう]としたのである。」"
  12: "またヒラムは言[い]った。「イスラエルの神[かみ]である主[しゅ]はほめたたえられる。主は天[てん]と地[ち]を造[つく]り、王[おう]ダビデに、知恵[ちえ]と分別[ふんべつ]と知識[ちしき]に通[つう]じた賢[かしこ]い子[こ]を与[あた]えられた。この子が主のために家[いえ]を、また自分[じぶん]の王国[おうこく]のために家を建[た]てる。"
  13: "今[いま]、わたしはあなたに、知恵[ちえ]と分別[ふんべつ]に通[つう]じた賢[かしこ]い者[もの]、わたしの父[ちち]と呼[よ]ぶヒラムを送[おく]った。"
  14: "その母[はは]はダンの娘[むすめ]たちのうちの者[もの]で、父[ちち]はツロの人[ひと]であった。この者は金[きん]と銀[ぎん]、青銅[せいどう]と鉄[てつ]、石[いし]と木[き]で仕事[しごと]をし、紫[むらさき]と青[あお]と亜麻[あま]と緋[ひ]の布[ぬの]を織[お]り、彫[ほ]り物[もの]を彫[ほ]り、与[あた]えられるすべての考[かんが]えを考[かんが]えることを知[し]っている。この者は、あなたの賢[かしこ]い者[もの]たち、またあなたの父[ちち]、わたしの主[しゅ]ダビデの賢い者たちとともに働[はたら]く。"
  15: "今[いま]、小麦[こむぎ]と大麦[おおむぎ]と油[あぶら]とぶどう酒[しゅ]、わたしの主[しゅ]が言[い]ったものは、そのしもべたちに送[おく]ってほしい。"
  16: "わたしたちは、あなたの必要[ひつよう]に応[おう]じてレバノンから木[き]を切[き]り、それをいかだにしてヨッパの海[うみ]へ運[はこ]び、あなたがそれをエルサレムへ運[はこ]び上[あ]げる。」"
  17: "ソロモンは、イスラエルの地[ち]にいるすべての寄留者[きりゅうしゃ]の男[おとこ]たちを、父[ちち]ダビデが数[かぞ]えた数[かず]に従[したが]って集[あつ]め、数[かぞ]えた。すると、十五万[じゅうごまん]三千六百人[さんぜんろっぴゃくにん]が見[み]つかった。"
  18: "彼[かれ]はそのうちから、七万[しちまん]人[にん]の荷[に]を運[はこ]ぶ者[もの]、八万[はちまん]人[にん]の山[やま]で石[いし]を切[き]る者、三千六百人[さんぜんろっぴゃくにん]の民[たみ]の上[うえ]で働[はたら]かせる監督[かんとく]を任[にん]じた。"

notes:
  1: "εἶπεν ... τοῦ οἰκοδομῆσαι — сказал построить (слав. «повеле созидати»); οἶκον τῷ ὀνόματι κυρίου — дом имени Господню; οἶκον τῇ βασιλείᾳ αὐτοῦ — дом царству своему, т. е. дворец. В gr-lxx-byz это 1:18; у слав. и в ru — 2:1, поэтому стих перенесён в начало 2-й главы."
  2: "συνήγαγεν ... ἑβδομήκοντα χιλιάδας ἀνδρῶν καὶ ὀγδοήκοντα χιλιάδας λατόμων ἐν τῷ ὄρει — собрал 70 000 мужей и 80 000 каменосеков в горе (λατόμος — камнесек, 山で石を切る者); ἐπιστάται ἐπ᾽ αὐτῶν τρισχίλιοι ἑξακόσιοι — надзирателей над ними 3600. = gr-lxx-byz 2:1."
  3: "ἀπέστειλεν ... πρὸς Χιραμ βασιλέα Τύρου λέγων — послал к Хираму, царю Тирскому, говоря (ツロ). Ὡς ἐποίησας μετὰ τοῦ πατρός μου Δαυιδ — как ты сделал с Давидом, отцом моим; ἀπέστειλας αὐτῷ κέδρους — послал ему кедры (杉); οἶκον κατοικῆσαι ἐν αὐτῷ — дом, чтобы жить в нём. Здесь начинается речь Соломона (до 2:10). = gr-lxx-byz 2:2."
  4: "ὁ υἱὸς αὐτοῦ — сын его; ἁγιάσαι αὐτὸν αὐτῷ — освятить его Ему; θυμίαμα — фимиам, 香; πρόθεσις — хлебы предложения (供えのパン); νουμηνίαι — новомесячия (新月の祭り); ἑορταί — праздники. εἰς τὸν αἰῶνα τοῦτο ἐπὶ τὸν Ισραηλ — «это навек для Израиля». = gr-lxx-byz 2:3."
  5: "μέγας ὁ θεὸς ἡμῶν παρὰ πάντας τοὺς θεούς — велик Бог наш паче всех богов. = gr-lxx-byz 2:4."
  6: "τίς ἰσχύσει — кто будет в силах (ἰσχύω); ὁ οὐρανὸς τοῦ οὐρανοῦ — небо небес; οὐ φέρουσιν αὐτοῦ τὴν δόξαν — не вмещают славы Его (φέρω — нести, вмещать); τίς ἐγὼ οἰκοδομῶν — кто я, строящий; ἀλλ᾽ ἢ τοῦ θυμιᾶν — кроме как кадить. = gr-lxx-byz 2:5."
  7: "ἄνδρα σοφὸν καὶ εἰδότα τοῦ ποιῆσαι ἐν τῷ χρυσίῳ... — мужа мудрого, умеющего работать по золоту, серебру, меди, железу, пурпуру, червлени и гиацинту (ὑάκινθος — 青); ἐπιστάμενον γλύψαι γλυφήν — умеющего резать резьбу; ὧν ἡτοίμασεν Δαυιδ — которых приготовил Давид. = gr-lxx-byz 2:6."
  8: "ξύλα κέδρινα καὶ ἀρκεύθινα καὶ πεύκινα — кедровые, можжевеловые (ビャクシン) и певговые (糸杉) дерева; οἶδα ὡς οἱ δοῦλοί σου οἴδασιν κόπτειν ξύλα — знаю, что рабы твои умеют рубить дерева. = gr-lxx-byz 2:7."
  9: "πορεύσονται ἑτοιμάσαι μοι ξύλα εἰς πλῆθος — пойдут приготовить мне дерева во множестве; μέγας καὶ ἔνδοξος — велик и славен (ἔνδοξος). = gr-lxx-byz 2:8."
  10: "τοῖς ἐργαζομένοις τοῖς κόπτουσιν ξύλα εἰς βρώματα δέδωκα — работающим, рубящим дерева, в пищу дал; σῖτον ... κόρων εἴκοσι χιλιάδας — пшеницы 20 000 коров (コル); κριθῶν ... οἴνου ... ἐλαίου μέτρων — ячменя, вина и масла по 20 000 мер (βάτος, バト). = gr-lxx-byz 2:9."
  11: "ἐν γραφῇ — письменно, в письме; Ἐν τῷ ἀγαπῆσαι κύριον τὸν λαὸν αὐτοῦ — по любви Господа к народу Своему; ἔδωκέν σε ... εἰς βασιλέα — дал тебя в царя над ними. = gr-lxx-byz 2:10."
  12: "Εὐλογητὸς κύριος ὁ θεὸς Ισραηλ — благословен Господь Бог Израилев; ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν — сотворивший небо и землю; υἱὸν σοφὸν καὶ ἐπιστάμενον σύνεσιν καὶ ἐπιστήμην — сына мудрого, знающего разумение и знание; οἶκον τῇ βασιλείᾳ αὐτοῦ — дом царству его. = gr-lxx-byz 2:11."
  13: "ἀπέσταλκά σοι — я послал тебе (перфект); ἄνδρα σοφὸν ... τὸν Χιραμ τὸν πατέρα μου — Хирама, отца моего; «отец» здесь почётный титул мастера. В csl «хирама раба моего» — иное чтение, отмечено; в тексте держимся gr. = gr-lxx-byz 2:12."
  14: "В gr стих начинается с квадратных скобок: [ἡ μήτηρ αὐτοῦ ἀπὸ θυγατέρων Δαν, καὶ ὁ πατὴρ αὐτοῦ ἀνὴρ Τύριος] — мать его из дочерей Дана, отец его муж тирянин; в csl эта клауза открывает 2:14. εἰδότα ποιῆσαι ἐν χρυσίῳ ... — умеющего работать по золоту...; ὑφαίνειν — ткать (織る); διανοεῖσθαι πᾶσαν διανόησιν — обдумывать всякое устроение; μετὰ τῶν σοφῶν σου καὶ σοφῶν Δαυιδ — с мудрецами твоими и мудрецами Давида. = gr-lxx-byz 2:13."
  15: "τὸν σῖτον καὶ τὴν κριθὴν καὶ τὸ ἔλαιον καὶ τὸν οἶνον — пшеницу, ячмень, масло и вино; ἃ εἶπεν ὁ κύριός μου — что сказал господин мой; ἀποστειλάτω — пусть пошлёт. = gr-lxx-byz 2:14."
  16: "κόψομεν ξύλα — нарубим дерева; κατὰ πᾶσαν τὴν χρείαν σου — по всей нужде твоей; σχεδίαις — плотами (いかだ); ἐπὶ θάλασσαν Ιόππης — к морю Иоппии (ヨッパ); σὺ ἄξεις αὐτὰ εἰς Ιερουσαλημ — ты отвезёшь их в Иерусалим. Здесь речь Хирама кончается. = gr-lxx-byz 2:15."
  17: "τοὺς ἄνδρας τοὺς προσηλύτους — мужей-пришельцев (寄留者); μετὰ τὸν ἀριθμόν, ὃν ἠρίθμησεν αὐτοὺς Δαυιδ — по исчислению, которым исчислил их Давид; εὑρέθησαν — нашлись; ἑκατὸν πεντήκοντα χιλιάδες καὶ τρισχίλιοι ἑξακόσιοι — 153 600. = gr-lxx-byz 2:16."
  18: "ἐποίησεν ἐξ αὐτῶν — сделал из них (поставил); νωτοφόρων — носящих ношу (荷を運ぶ者); λατόμων — каменосеков; ἐργοδιώκτας ἐπὶ τὸν λαόν — приставников над народом (監督). = gr-lxx-byz 2:17; отдельного gr 2:18 нет."
