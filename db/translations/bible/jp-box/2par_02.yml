# jp-box, 2-я Паралипоменон, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes. ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (речь тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 2: решение строить храм (1), набор работников (2), посольство к Хираму
# (3–10), ответ Хирама и присылка мастера (11–16), перепись пришельцев
# и распределение работ (17–18).
# Нумерация — славяно-синодальная: 18 стихов, как в csl и ru. В gr-lxx-byz 17:
# наш ст. 1 — это gr 1:18 (у слав. и в ru — 2:1), поэтому gr 2:N = наш 2:N−1.
# Отдельного gr 2:18 нет.
# Речь Соломона (3–10) и Хирама (11–16) — 「…」; красного нет.
# 〔…〕 нет. Слав. чтения и добавления внесены в текст, LXX-вариант — в notes.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 祭壇, 祭司 уже пояснены в корпусе.

