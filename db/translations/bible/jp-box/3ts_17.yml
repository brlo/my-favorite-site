# jp-box, 3-я Царств, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 17: пророчество о засухе (1); повеление скрыться у потока Хораф (2–4);
# вороны (5–6); поток высыхает (7); повеление идти в Сарепту (8–10); вдова,
# мука и масло (11–16); болезнь и смерть её сына (17–18); молитва и воскрешение
# (19–23).
# Речи — 「…」: Господь (3–4, 9), вдова (12, 18, 23), Илия (1, 10, 11, 13, 19–21, 22).
# Вложенная речь — 『…』: слово Господа в устах Илии (14). Красного нет.
# Нумерация — славяно-синодальная (по csl-ru): 23 стиха. Гр 17:22–23 слав.
# соединяет в одном 17:22 («И возопи отрочищь, и сведе его…»), поэтому наш 22
# (гр 22 + гр 23) = csl 17:22, а наш 23 (гр 24) = csl 17:23.
# Слав. чтения (17:14 «Бог израилев», 17:15 «по глаголу Илии» и «и даде ему»,
# 17:16 «от того дне») внесены в основной текст без 〔…〕; LXX-варианты — в notes.
# 〔…〕 нет.
# Сносок ⟨…⟩ нет: 預言者, 祭壇, やもめ, 魂[たましい] уже в корпусе.
tr_code: jp-box
book: 3ts
chapter: 17
draft: true

verses:
  1: "ギレアデのテシベ出身[しゅっしん]の預言者[よげんしゃ]エリヤは、アハブに言[い]った。「わたしがその前[まえ]に立[た]つ、イスラエルの神[かみ]、万軍[ばんぐん]の神である主[しゅ]は生[い]きておられる。これから数年[すうねん]、露[つゆ]も雨[あめ]も降[ふ]らない。ただわたしの口[くち]の言葉[ことば]によってでなければ。」"
  2: "主[しゅ]の言葉[ことば]が彼[かれ]に臨[のぞ]んだ。"
  3: "「ここを離[はな]れて東[ひがし]へ行[い]き、ヨルダン川[がわ]の前[まえ]にあるホラトの谷川[たにがわ]に隠[かく]れなさい。"
  4: "その谷川[たにがわ]の水[みず]を飲[の]みなさい。わたしはカラスに命[めい]じて、そこでおまえを養[やしな]わせる。」"
  5: "エリヤは主[しゅ]の言葉[ことば]に従[したが]って行[い]き、ヨルダン川[がわ]の前[まえ]にあるホラトの谷川[たにがわ]のそばに住[す]んだ。"
  6: "カラスは朝[あさ]にはパンと肉[にく]を、夕[ゆう]べにはパンと肉を彼[かれ]のところへ運[はこ]んで来[き]た。彼は谷川[たにがわ]の水[みず]を飲[の]んだ。"
  7: "しばらくして、その谷川[たにがわ]は干[ひ]上がった。地[ち]に雨[あめ]が降[ふ]らなかったからである。"
  8: "主[しゅ]の言葉[ことば]が彼[かれ]に臨[のぞ]んだ。"
  9: "「立[た]って、シドンのサレプタへ行[い]き、そこに住[す]みなさい。見[み]よ、わたしはそこであるやもめに命[めい]じて、おまえを養[やしな]わせる。」"
  10: "彼は立[た]ってサレプタへ行[い]き、町[まち]の門[もん]のところへ来[き]た。すると、そこに一人[ひとり]のやもめが薪[たきぎ]を集[あつ]めていた。エリヤは彼女[かのじょ]の後[あと]から呼[よ]びかけて言[い]った。「どうか、器[うつわ]に少[すこ]しの水[みず]を入[い]れて、わたしに飲[の]ませてくれ。」"
  11: "彼女[かのじょ]が取[と]りに行[い]くと、エリヤは彼女の後[あと]から呼[よ]びかけて言[い]った。「手[て]にパンひときれを取[と]って、わたしに持[も]って来[き]てくれ。」"
  12: "彼女[かのじょ]は言[い]った。「あなたの神[かみ]である主[しゅ]は生[い]きておられる。わたしには焼[や]いたパンはなく、ただ壺[つぼ]に一握[ひとにぎ]りの小麦粉[こむぎこ]と、小さな瓶[びん]に少[すこ]しの油[あぶら]があるだけだ。見[み]てのとおり、わたしは薪[たきぎ]を二本[にほん]集[あつ]めて家[いえ]に入[はい]り、それを自分[じぶん]と子[こ]どもたちのために作[つく]り、食[た]べて死[し]のうとしているのだ。」"
  13: "エリヤは彼女[かのじょ]に言[い]った。「恐[おそ]れるな。行[い]って、あなたの言[い]ったとおりにしなさい。ただ、まずその中[なか]からわたしのために小[ちい]さなパンを一[ひと]つ焼[や]いて持[も]って来[き]なさい。あなたとあなたの子[こ]どもたちの分[ぶん]は、その後[あと]で作[つく]りなさい。"
  14: "イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。『壺[つぼ]の小麦粉[こむぎこ]は尽[つ]きず、瓶[びん]の油[あぶら]は減[へ]らない。主が地[ち]に雨[あめ]を降[ふ]らせる日[ひ]まで。』」"
  15: "彼女[かのじょ]は行[い]って、エリヤの言[い]ったとおりにし、彼に与[あた]えた。彼女[かのじょ]も、エリヤも、その子[こ]どもたちも食[た]べた。"
  16: "その日[ひ]から、壺[つぼ]の小麦粉[こむぎこ]は尽[つ]きず、瓶[びん]の油[あぶら]は減[へ]らなかった。主[しゅ]がエリヤによって語られた言葉[ことば]のとおりであった。"
  17: "この後[あと]、その家[いえ]の女主人[おんなしゅじん]の子[こ]が病気[びょうき]になった。その病[やまい]はひどく重[おも]く、ついに息[いき]も残[のこ]らなくなった。"
  18: "彼女[かのじょ]はエリヤに言[い]った。「神[かみ]の人[ひと]よ、わたしとあなたと何[なん]の関[かか]わりがあるのか。あなたはわたしの不義[ふぎ]を思[おも]い出[だ]させ、わたしの子[こ]を殺[ころ]すために来[き]たのか。」"
  19: "エリヤは彼女[かのじょ]に言[い]った。「あなたの子[こ]をわたしに渡[わた]しなさい。」彼はその子を彼女の腕[うで]から受[う]け取[と]り、自分[じぶん]が住[す]んでいた屋上[おくじょう]の部屋[へや]へ連[つ]れて上[のぼ]り、自分の寝台[しんだい]に寝[ね]かせた。"
  20: "彼は主[しゅ]に呼[よ]ばわって言[い]った。「ああ、主[しゅ]よ、わたしがそのもとに住[す]んでいるこのやもめの証人[しょうにん]である方[かた]よ。あなたはその子[こ]を殺[ころ]して、このやもめに災[わざわ]いを下[くだ]されたのか。」"
  21: "彼は少年[しょうねん]の上[うえ]に三度[さんど]息[いき]を吹[ふ]きかけ、主[しゅ]を呼[よ]んで言[い]った。「主[しゅ]よ、わたしの神[かみ]よ、どうか、この少年の魂[たましい]を彼[かれ]の中[なか]に返[かえ]してほしい。」"
  22: "そのとおりになった。少年[しょうねん]は叫[さけ]んだ。エリヤはその子[こ]を屋上[おくじょう]の部屋[へや]から家[いえ]へ下[お]ろし、母親[ははおや]に渡[わた]して言[い]った。「見[み]なさい、あなたの子[こ]は生[い]きている。」"
  23: "女[おんな]はエリヤに言[い]った。「今[いま]、あなたが神[かみ]の人[ひと]であること、そしてあなたの口[くち]にある主[しゅ]の言葉[ことば]が真実[しんじつ]であることを知[し]った。」"

notes:
  1: "Θεσβίτης ἐκ Θεσβων τῆς Γαλααδ — «фесвитянин из Фесвы Галаадской»; Θεσβων — Фесва (テシベ), передано テシベ出身. Ζῇ κύριος — «жив Господь» (клятвенная формула). ὁ θεὸς τῶν δυνάμεων — «Бог сил»; передано 万軍の神 (слав. «Бог сил»). ᾧ παρέστην ἐνώπιον αὐτοῦ — «Которому предстою». εἰ ἔσται… ὅτι εἰ μή — формула клятвы: «не будет… если не…»; передано отрицательно. διὰ στόματος λόγου μου — «через уста слова моего»."
  2: "καὶ ἐγένετο ῥῆμα κυρίου πρὸς Ηλιου — «и было слово Господне к Илии»; слав. добавляет «глаголя» (ср. ст. 8)."
  3: "Πορεύου ἐντεῦθεν κατὰ ἀνατολάς — «иди отсюда на восток». κρύβηθι — «скройся» (κρύπτω). χειμάρρῳ Χορραθ — поток Хораф (ホラト), сезонный ручей (谷川). ἐπὶ προσώπου τοῦ Ιορδάνου — «против Иордана» (слав. «прямо лицу иорданову»)."
  4: "ἔσται ἐκ τοῦ χειμάρρου πίεσαι ὕδωρ — «будешь пить воду из потока» (πίεσαι — буд. вр. от πίνω). κόραξ — ворон (カラス). ἐντελοῦμαι — «повелю» (ἐντέλλομαι). διατρέφειν — «кормить, содержать»."
  5: "ἐποίησεν κατὰ τὸ ῥῆμα κυρίου — «сделал по слову Господню». ἐκάθισεν — «сел, остался» (καθίζω)."
  6: "ἄρτους τὸ πρωΐ — «хлебы утром»; κρέα τὸ δείλης — «мясо вечером». слав. удваивает «хлебы и мяса»; удвоение внесено. ἔπινεν — «пил» (imperfect)."
  7: "μετὰ ἡμέρας — «через несколько дней». ἐξηράνθη — «высох» (ξηραίνω). ὑετός — «дождь, ливень»."
  8: "καὶ ἐγένετο ῥῆμα κυρίου πρὸς Ηλιου — «и было слово Господне к Илии»; слав. добавляет «глаголя» (нет в LXX; в переводе не внесено, ср. ст. 2)."
  9: "Ἀνάστηθι — «встань». Σαρεπτα τῆς Σιδωνίας — Сарепта Сидонская (サレプタ; ср. Лк 4:26). ἐντέταλμαι — «повелел» (перфект ἐντέλλομαι). χήρᾳ — «вдове» (やもめ)."
  10: "πυλών — «ворота, преддверие». συνέλεγεν — «собирала» (συλλέγω). ἐβόησεν ὀπίσω αὐτῆς — «воззвал вслед ей». Λαβὲ δή — «возьми же». ἄγγος — «сосуд» (器)."
  11: "Λήμψῃ — «возьмёшь» (буд. вр. в знач. повеления). ψωμός — «кусок». ἐν τῇ χειρί σου — «в руке твоей»."
  12: "Ζῇ κύριος ὁ θεός σου — клятва. ἐγκρυφίας — хлеб, испечённый в золе (слав. «опреснок»); передано 焼いたパン. δράξ — «горсть». ἄλευρον — «мука» (小麦粉). ὑδρία — «водонос» (水がめ). καψάκης — «сосуд для масла» (小さな瓶). ξυλάρια — «поленца» (薪). τέκνα — «дети»."
  13: "Θάρσει — «дерзай, не бойся». κατὰ τὸ ῥῆμά σου — «по слову твоему». ἐγκρυφίαν μικρόν — «небольшой печёный хлебец». ἐν πρώτοις — «сначала». ἐπ' ἐσχάτου — «в конце, после»."
  14: "τάδε λέγει κύριος — «так говорит Господь». ἐκλείψει — «истощится» (ἐκλείπω). ἐλαττονήσει — «умалится» (ἐλαττονέω). ἕως ἡμέρας — «до дня». слав. «Господь Бог израилев» — «神である» внесено. Слова Господа в устах Илии — 『…』."
  15: "ἤσθιεν — «ела» (imperfect). слав. добавляет «по глаголу Илии» и «и даде ему» (нет в LXX; внесено)."
  16: "ἐξέλιπεν — «истощился»; ἐλαττονώθη — «умалился». ἐν χειρὶ Ηλιου — «через Илию» (букв. «рукою Илии»). слав. добавляет «от того дне» — внесено."
  17: "κυρία τοῦ οἴκου — «хозяйка дома» (女主人). ἠρρώστησεν — «заболел» (ἀρρωστέω). κραταιὰ σφόδρα — «очень сильная». οὐχ ὑπελείφθη ἐν αὐτῷ πνεῦμα — «не осталось в нём дыхания» (слав. «дух его»)."
  18: "Τί ἐμοὶ καὶ σοί — «что мне и тебе» (семитский оборот). ἄνθρωπε τοῦ θεοῦ — «человек Божий» (神の人). ἀναμνῆσαι — «напомнить». ἀδικίαι — «неправды, грехи» (不義). θανατῶσαι — «умертвить»."
  19: "ἐκ τοῦ κόλπου αὐτῆς — «от груди, из объятий» (слав. «от недра»). ἀνήνεγκεν — «понёс наверх». ὑπερῷον — «горница наверху» (屋上の部屋). ἐκοίμισεν — «положил» (κοιμίζω). κλίνη — «постель» (寝台)."
  20: "Οἴμμοι — «увы мне» (горе; передано ああ). ὁ μάρτυς τῆς χήρας — «свидетель вдовы» (証人). κεκάκωκας — «Ты сделал зло» (κακόω, перфект), передано 災いを下された. слав. «свидетелю вдовы» — дат. пад."
  21: "ἐνεφύσησεν — «дунул» (ἐμφυσάω). τρίς — «трижды». ἐπιστραφήτω δή — «да возвратится же» (повелит. 3 л.). ψυχή — «душа, дыхание». слав. оканчивает стих «и бысть тако» (в LXX это начало ст. 22; в переводе оставлено при ст. 22)."
  22: "ἐγένετο οὕτως — «стало так». ἀνεβόησεν — «закричал, вскрикнул». слав. соединяет ст. 22–23 в одном стихе («И возопи отрочищь, и сведе его…»), поэтому наш 22 = csl 17:22, наш 23 = csl 17:23. κατήγαγεν — «свёл вниз» (κατάγω). τῇ μητρί — «матери». Βλέπε — «смотри». ζῇ — «жив»."
  23: "ἔγνωκα — «узнала» (перфект γινώσκω). ἄνθρωπος θεοῦ — «человек Божий». ῥῆμα κυρίου ἐν στόματί σου ἀληθινόν — «слово Господне в устах твоих истинно». В слав. этот стих — 23-й."
