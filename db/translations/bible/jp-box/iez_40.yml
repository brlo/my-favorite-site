verses:
  1: "わたしたちの捕囚[ほしゅう]の二十五年[にじゅうごねん]、第一[だいいち]の月[つき]の十日[とおか]、町[まち]が攻[せ]め取[と]られてから十四年[じゅうよねん]目[め]の年[とし]、その日[ひ]、主[しゅ]の手[て]がわたしの上[うえ]にあり、主はわたしを連[つ]れて行[い]った。"
  2: "神[かみ]の幻[まぼろし]のうちに、イスラエルの地[ち]へ。主はわたしを非常[ひじょう]に高[たか]い山[やま]の上[うえ]に置[お]いた。その上[うえ]には、こちらに面[めん]して町[まち]の建物[たてもの]のようなものがあった。"
  3: "主はわたしをそこへ連[つ]れて行[い]った。見[み]よ、一人[ひとり]の男[おとこ]がいた。その姿[すがた]は輝[かがや]く青銅[せいどう]のようであった。その手[て]には建築[けんちく]者[しゃ]の縄[なわ]と測[はか]り竿[ざお]があり、彼は門[もん]のそばに立[た]っていた。"
  4: "その男[おとこ]はわたしに言[い]った。「人[ひと]の子[こ]よ、見[み]たか。あなたの目[め]で見[み]、あなたの耳[みみ]で聞[き]き、わたしがあなたに示[しめ]すすべてのことを心[こころ]に留[とど]めよ。あなたがここに入[はい]ったのは、あなたに示すためである。あなたは見[み]るすべてのことをイスラエルの家[いえ]に示[しめ]さなければならない。」"
  5: "見[み]よ、神殿[しんでん]の外[そと]に周[まわ]りを取り囲[かこ]む囲[かこ]いがあった。その男[おとこ]の手[て]には、六[ろく]キュビトの測[はか]り竿[ざお]があった。一[いっ]キュビトは、手[て]のひらを加[くわ]えた一[いっ]キュビトである。彼はその囲[かこ]いを測[はか]った。幅[はば]は竿[ざお]と等[ひと]しく、高[たか]さも竿[ざお]と等[ひと]しかった。"
  6: "彼は東[ひがし]に面[めん]した門[もん]に入[はい]り、七[なな]つの段[だん]を上[のぼ]った。彼は門[もん]の小室[しょうしつ]を測[はか]った。こちら側[がわ]に六[むっ]つ、あちら側[がわ]に六つである。また門[もん]の前廊[ぜんろう]を竿[ざお]と等[ひと]しく測った。"
  7: "小室[しょうしつ]は長[なが]さが竿[ざお]と等[ひと]しく、幅[はば]も竿[ざお]と等[ひと]しかった。小室[しょうしつ]と小室[しょうしつ]の間[あいだ]の前廊[ぜんろう]は六[ろく]キュビト。第二[だいに]の小室[しょうしつ]は幅[はば]も竿[ざお]と等[ひと]しく、長[なが]さも竿[ざお]と等[ひと]しかった。前廊[ぜんろう]は五[ご]キュビト。"
  8: "第三[だいさん]の小室[しょうしつ]は、幅[はば]も長[なが]さも竿[ざお]と等[ひと]しかった。"
  9: "門[もん]の構[こう]えの前廊[ぜんろう]は、門[もん]の前廊[ぜんろう]に近[ちか]く、八[やっ]キュビト、その柱[はしら]は二[に]キュビトであった。門[もん]の前廊[ぜんろう]は内側[うちがわ]にあった。"
  10: "門[もん]の小室[しょうしつ]は、互[たが]いに向[む]かい合[あ]って、こちら側[がわ]に三[みっ]つ、あちら側[がわ]に三つあった。三[みっ]つとも同[おな]じ大[おお]きさで、前廊[ぜんろう]も両側[りょうがわ]とも同[おな]じ大[おお]きさであった。"
  11: "彼は門[もん]の入口[いりぐち]の幅[はば]を十[じゅう]キュビト、門[もん]の幅[はば]を十三[じゅうさん]キュビトと測[はか]った。"
  12: "小室[しょうしつ]の前[まえ]には、こちら側[がわ]にもあちら側[がわ]にも一[いっ]キュビトの仕切[しき]りがあった。小室[しょうしつ]はこちら側[がわ]に六[ろく]キュビト、あちら側[がわ]に六[ろく]キュビトであった。"
  13: "彼は門[もん]を、小室[しょうしつ]の壁[かべ]から小室[しょうしつ]の壁[かべ]まで測[はか]った。幅[はば]は二十五[にじゅうご]キュビト。門[もん]は門[もん]に向[む]かい合[あ]っている。"
  14: "門[もん]の前廊[ぜんろう]の覆[おお]いのない所[ところ]は六十[ろくじゅう]キュビト、門[もん]の小室[しょうしつ]は周[まわ]りに二十[にじゅう]あった。"
  15: "外側[そとがわ]の門[もん]の覆[おお]いのない所[ところ]から、内側[うちがわ]の門[もん]の前廊[ぜんろう]の覆[おお]いのない所[ところ]まで、五十[ごじゅう]キュビト。"
  16: "門[もん]の内側[うちがわ]、庭[にわ]に面[めん]した所[ところ]の小室[しょうしつ]と前廊[ぜんろう]には、隠[かく]れた窓[まど]が周[まわ]りにあった。前廊[ぜんろう]にも内側[うちがわ]に窓[まど]が周[まわ]りにあり、前廊[ぜんろう]の両側[りょうがわ]にはなつめやしの飾[かざ]りがあった。"
  17: "彼はわたしを内[うち]の庭[にわ]に連[つ]れて行[い]った。見[み]よ、庭[にわ]の周[まわ]りに室[しつ]と柱廊[ちゅうろう]があった。柱廊[ちゅうろう]の中[なか]には三十[さんじゅう]の室[しつ]があった。"
  18: "門[もん]の後[うし]ろに回廊[かいろう]があり、門[もん]の長[なが]さに沿[そ]って、下[した]の柱廊[ちゅうろう]があった。"
  19: "彼は庭[にわ]の幅[はば]を、外[そと]の門[もん]の覆[おお]いのない所[ところ]から、外[そと]を向[む]いた門[もん]の覆[おお]いのない所[ところ]まで、内側[うちがわ]に向[む]かって測[はか]った。東[ひがし]に面[めん]した所[ところ]で百[ひゃく]キュビト。彼はわたしを北[きた]へ連[つ]れて行[い]った。"
  20: "見[み]よ、外[そと]の庭[にわ]に面[めん]して北[きた]を向[む]いた門[もん]があった。彼はそれを、その長[なが]さと幅[はば]を測[はか]った。"
  21: "その小室[しょうしつ]はこちら側[がわ]に三[みっ]つ、あちら側[がわ]に三つ、その柱[はしら]も前廊[ぜんろう]も、そのなつめやしもあった。東[ひがし]に面[めん]した門[もん]の寸法[すんぽう]と同[おな]じで、長[なが]さは五十[ごじゅう]キュビト、幅[はば]は二十五[にじゅうご]キュビトであった。"
  22: "その窓[まど]も前廊[ぜんろう]もなつめやしも、東[ひがし]に面[めん]した門[もん]と同[おな]じであった。七[なな]つの段[だん]を上[のぼ]ってそこへ行[い]き、前廊[ぜんろう]は内側[うちがわ]にあった。"
  23: "内[うち]の庭[にわ]には、北[きた]の門[もん]に向[む]かい合[あ]う門[もん]があり、東[ひがし]に面[めん]した門[もん]のようであった。彼は庭[にわ]を門[もん]から門[もん]まで百[ひゃく]キュビトと測[はか]った。"
  24: "彼はわたしを南[みなみ]へ連[つ]れて行[い]った。見[み]よ、南[みなみ]を向[む]いた門[もん]があった。彼はそれを、その小室[しょうしつ]も柱[はしら]も前廊[ぜんろう]も、同[おな]じ寸法[すんぽう]で測[はか]った。"
  25: "その窓[まど]も前廊[ぜんろう]も周[まわ]りにあり、前廊[ぜんろう]の窓[まど]と同[おな]じであった。長[なが]さは五十[ごじゅう]キュビト、幅[はば]は二十五[にじゅうご]キュビトであった。"
  26: "それには七[なな]つの段[だん]があり、前廊[ぜんろう]は内側[うちがわ]にあった。その柱[はしら]には、こちら側[がわ]に一[ひと]つ、あちら側[がわ]に一[ひと]つのなつめやしがあった。"
  27: "内[うち]の庭[にわ]の門[もん]に南[みなみ]で向[む]かい合[あ]う門[もん]があった。彼は庭[にわ]を門[もん]から門[もん]まで、南[みなみ]へ百[ひゃく]キュビトの幅[はば]と測[はか]った。"
  28: "彼はわたしを、南[みなみ]に面[めん]した門[もん]を通[とお]って内[うち]の庭[にわ]に連[つ]れて行[い]き、その門[もん]を同[おな]じ寸法[すんぽう]で測[はか]った。"
  29: "その小室[しょうしつ]も柱[はしら]も前廊[ぜんろう]も、同[おな]じ寸法[すんぽう]であった。その窓[まど]は、前廊[ぜんろう]の窓[まど]も、周[まわ]りにあった。長[なが]さは五十[ごじゅう]キュビト、幅[はば]は二十五[にじゅうご]キュビトである。"
  30: "その窓[まど]と前廊[ぜんろう]は周[まわ]りにあり、長[なが]さは五十[ごじゅう]キュビト、幅[はば]は二十五[にじゅうご]キュビトであった。"
  31: "その前廊[ぜんろう]は外[そと]の庭[にわ]に面[めん]していた。柱[はしら]にはなつめやしがあり、八[やっ]つの段[だん]があった。"
  32: "彼はわたしを東[ひがし]に面[めん]した門[もん]に連[つ]れて行[い]き、それを同[おな]じ寸法[すんぽう]で測[はか]った。小室[しょうしつ]も柱[はしら]も前廊[ぜんろう]も、同[おな]じ寸法[すんぽう]であった。"
  33: "その窓[まど]は、前廊[ぜんろう]の窓[まど]も、周[まわ]りにあった。長[なが]さは五十[ごじゅう]キュビト、幅[はば]は二十五[にじゅうご]キュビトである。"
  34: "その前廊[ぜんろう]は内[うち]の庭[にわ]に面[めん]していた。柱[はしら]には両側[りょうがわ]になつめやしがあり、八[やっ]つの段[だん]があった。"
  35: "彼はわたしを北[きた]に面[めん]した門[もん]に連[つ]れて行[い]き、同[おな]じ寸法[すんぽう]で測[はか]った。"
  36: "その小室[しょうしつ]も柱[はしら]も前廊[ぜんろう]も、またその窓[まど]も前廊[ぜんろう]の窓[まど]も、周[まわ]りにあった。長[なが]さは五十[ごじゅう]キュビト、幅[はば]は二十五[にじゅうご]キュビトである。"
  37: "その前廊[ぜんろう]は外[そと]の庭[にわ]に面[めん]していた。柱[はしら]には両側[りょうがわ]になつめやしがあり、八[やっ]つの段[だん]があった。"
  38: "その室[しつ]とその戸口[とぐち]とその前廊[ぜんろう]は門[もん]のそばにあった。そこは全焼[ぜんしょう]の供[そな]え物[もの]を洗[あら]う所[ところ]である。"
  39: "これは第二[だいに]の流[なが]れ口[ぐち]である。そこでは罪[つみ]のため、また無知[むち]のためのいけにえを屠[ほふ]る。門[もん]の前廊[ぜんろう]には、こちら側[がわ]に二[ふた]つの食卓[しょくたく]、あちら側[がわ]に二つの食卓があった。その上[うえ]で全焼[ぜんしょう]の供[そな]え物[もの]、罪[つみ]のため、無知[むち]のためのいけにえを屠[ほふ]るためである。"
  40: "全焼[ぜんしょう]の供[そな]え物[もの]の流[なが]れの後[うし]ろ、北[きた]を向[む]いた所[ところ]に、東[ひがし]に二[ふた]つの食卓[しょくたく]があった。第二[だいに]のものの後[うし]ろ、すなわち門[もん]の前廊[ぜんろう]の後[うし]ろにも、東[ひがし]に二つの食卓があった。"
  41: "門[もん]の後[うし]ろに、こちら側[がわ]に四[よっ]つ、あちら側[がわ]に四つあった。それらは八[やっ]つの食卓[しょくたく]で、その上[うえ]でいけにえを屠[ほふ]る。"
  42: "また、全焼[ぜんしょう]の供[そな]え物[もの]のための四[よっ]つの食卓[しょくたく]は、切[き]り石[いし]で造[つく]られていた。幅[はば]は一[いっ]キュビト半[はん]、長[なが]さは二[に]キュビト半[はん]、高[たか]さは一[いっ]キュビトである。その上[うえ]に、そこで全焼[ぜんしょう]の供[そな]え物[もの]といけにえを屠[ほふ]るための器具[きぐ]を置[お]く。"
  43: "食卓[しょくたく]には、周[まわ]りに内側[うちがわ]へ手[て]のひらほどの、切[き]り石[いし]の縁[ふち]が付[つ]いていた。食卓[しょくたく]の上[うえ]には覆[おお]いがあり、雨[あめ]と暑[あつ]さを避[さ]けるようになっていた。"
  44: "彼はわたしを内[うち]の庭[にわ]に連[つ]れて行[い]った。見[み]よ、内[うち]の庭[にわ]に二[ふた]つの室[しつ]があった。一[ひと]つは北[きた]を向[む]いた門[もん]の後[うし]ろにあり、南[みなみ]へ向[む]かっていた。もう一[ひと]つは南[みなみ]に面[めん]した門[もん]の後[うし]ろにあり、北[きた]へ向[む]かっていた。"
  45: "彼はわたしに言[い]った。「南[みなみ]に面[めん]したこの室[しつ]は、神殿[しんでん]の見張[みは]りを守[まも]る祭司[さいし]たちのものである。"
  46: "北[きた]に面[めん]した室[しつ]は、祭壇[さいだん]の見張[みは]りを守[まも]る祭司[さいし]たちのものである。彼らはレビから出[で]て主[しゅ]に近[ちか]づき、主に仕[つか]えるサドクの子[こ]らである。」"
  47: "彼は庭[にわ]を測[はか]った。長[なが]さ百[ひゃく]キュビト、幅[はば]百[ひゃく]キュビトで、四方[しほう]にわたっていた。祭壇[さいだん]は神殿[しんでん]の前[まえ]にあった。"
  48: "彼はわたしを神殿[しんでん]の前廊[ぜんろう]に連[つ]れて行[い]った。彼は前廊[ぜんろう]の柱[はしら]を、こちら側[がわ]に五[ご]キュビト、あちら側[がわ]に五[ご]キュビトと測[はか]った。戸口[とぐち]の幅[はば]は十四[じゅうよん]キュビト、前廊[ぜんろう]の戸[と]の側面[そくめん]はこちら側[がわ]に三[さん]キュビト、あちら側[がわ]に三[さん]キュビトであった。"
  49: "前廊[ぜんろう]の長[なが]さは二十[にじゅう]キュビト、幅[はば]は十二[じゅうに]キュビトであった。人[ひと]々[びと]は十[じゅう]の段[だん]を上[のぼ]ってそこへ行[い]った。前廊[ぜんろう]には柱[はしら]があり、こちら側[がわ]に一[ひと]つ、あちら側[がわ]に一[ひと]つあった。"

notes:
  1: "ἐν τῷ πέμπτῳ καὶ εἰκοστῷ ἔτει τῆς αἰχμαλωσίας — «в двадцать пятом году плена нашего» (αἰχμαλωσία — 捕囚); ἐν τῷ πρώτῳ μηνὶ δεκάτῃ τοῦ μηνός — «в первом месяце, в десятый день»; ἐν τῷ τεσσαρεσκαιδεκάτῳ ἔτει μετὰ τὸ ἁλῶναι τὴν πόλιν — «в четырнадцатый год после взятия города»; ἐγένετο ἐπ᾽ ἐμὲ χεὶρ κυρίου — «была на мне рука Господня». Дата совпадает с 1:1–2 и 33:21."
  2: "ἐν ὁράσει θεοῦ — «в видении Божием»; ἐπ᾽ ὄρους ὑψηλοῦ σφόδρα — «на горе весьма высокой»; ὡσεὶ οἰκοδομὴ πόλεως ἀπέναντι — «как бы строение города напротив». Слав. в скобках «(полудне)» — «на полдень», т. е. к югу; редакционная скобка, не перенесена."
  3: "ἀνὴρ οὗ ἡ ὅρασις ἦν ὡσεὶ ὅρασις χαλκοῦ στίλβοντος — «муж, вид которого как вид меди блестящей» (χαλκός — 青銅; στίλβω — блестеть); σπαρτίον οἰκοδόμων — «вервь зиждущих» (σπαρτίον — вервь, 縄); κάλαμος μέτρου — «трость измерения» (測り竿); εἱστήκει ἐπὶ τῆς πύλης — «стоял у ворот»."
  4: "Ἑώρακας, υἱὲ ἀνθρώπου; — «видел ли ты, сын человеческий?»; ἐν τοῖς ὀφθαλμοῖς σου ἰδὲ — «глазами твоими смотри»; τάξον εἰς τὴν καρδίαν σου — «положи в сердце твоё» (τάσσω); ἕνεκα τοῦ δεῖξαί σοι — «для того, чтобы показать тебе»; δεῖξεις τῷ οἴκῳ τοῦ Ισραηλ — «покажешь дому Израилеву». Речь мужа — 「…」 в пределах стиха."
  5: "περίβολος ἔξωθεν τοῦ οἴκου κύκλῳ — «ограда вне дома кругом» (περίβολος — 囲い); κάλαμος τὸ μέτρον πηχῶν ἓξ ἐν πήχει καὶ παλαιστῆς — «трость, мера шести локтей в локоть и ладонь» (παλαιστή — 手のひら): «царский» локоть с ладонью; διεμέτρησεν τὸ προτείχισμα — «намерил предстение» (προτείχισμα — передняя стена)."
  6: "εἰσῆλθεν εἰς τὴν πύλην τὴν βλέπουσαν κατὰ ἀνατολάς — «вошёл в ворота, обращённые к востоку»; ἐν ἑπτὰ ἀναβαθμοῖς — «по семи ступеням» (ἀναβαθμός — 段); διεμέτρησεν τὸ αιλαμ τῆς πύλης ἴσον τῷ καλάμῳ — «намерил притвор ворот, равный трости». Слав. добавляет «и измери фее, шесть о сию страну, шесть же об ону» — нет в LXX, внесено без 〔…〕."
  7: "τὸ θεε — «фее»: боковая комната в воротах (小室), евр. תא; ἴσον τῷ καλάμῳ τὸ μῆκος καὶ τὸ πλάτος — «равно трости в длину и ширину»; τὸ αιλαμ ἀνὰ μέσον τοῦ θαιηλαθα πηχῶν ἓξ — «притвор между фееилаф шесть локтей»; τὸ θεε τὸ δεύτερον — «фее второе»; τὸ αιλαμ πήχεων πέντε — «притвор пяти локтей»."
  8: "τὸ θεε τὸ τρίτον — «фее третье», т. е. третья боковая комната; ἴσον τῷ καλάμῳ τὸ πλάτος καὶ τὸ μῆκος — «равно трости в ширину и длину». В слав. стих слит с 7-м; в LXX это отдельный короткий стих."
  9: "τὸ αιλαμ τοῦ πυλῶνος πλησίον τοῦ αιλαμ τῆς πύλης — «притвор ворот (πυλών), близ притвора ворот (πύλη)»; πηχῶν ὀκτὼ — «восьми локтей»; τὰ αιλευ πηχῶν δύο — «аилев двух локтей» (αιλευ — 柱, выступ-пилястр); τὸ αιλαμ τῆς πύλης ἔσωθεν — «притвор ворот внутри»."
  10: "θεε κατέναντι τρεῖς ἔνθεν καὶ τρεῖς ἔνθεν — «фее напротив, три с той и три с другой стороны»; μέτρον ἓν τοῖς τρισίν — «мера одна трём»; μέτρον ἓν τοῖς αιλαμ — «мера одна притворам». Формула трёх комнат повторяется в 40:21, 22, 24, 26, 29, 33, 36."
  11: "τὸ πλάτος τῆς θύρας τοῦ πυλῶνος πηχῶν δέκα — «ширина двери ворот десять локтей»; τὸ εὖρος τοῦ πυλῶνος πηχῶν δέκα τριῶν — «ширина ворот тринадцать локтей». Слав. «тринадесяти» — то же чтение."
  12: "πῆχυς ἐπισυναγόμενος ἐπὶ πρόσωπον τῶν θειμ — «локоть сходящийся к лицу фее», т. е. выступ в один локоть перед комнатами (ἐπισυνάγω — сдвигать); τὸ θεε πηχῶν ἓξ ἔνθεν καὶ ἓξ ἔνθεν — «фее шести локтей с той и с другой стороны». Слав. добавляет «предел сюду и сюду» — уточнение, внесено как 仕切り."
  13: "ἀπὸ τοῦ τοίχου τοῦ θεε ἐπὶ τὸν τοῖχον τοῦ θεε — «от стены фее до стены фее»; πλάτος πήχεις εἴκοσι πέντε — «ширина двадцать пять локтей»; αὕτη πύλη ἐπὶ πύλην — «это ворота против ворот» (門は門に向かい合う)."
  14: "τὸ αἴθριον τοῦ αιλαμ τῆς πύλης ἑξήκοντα πήχεις — «непокрытое притвора ворот шестьдесят локтей» (αἴθριον — 覆いのない所); εἴκοσι θειμ τῆς πύλης κύκλῳ — «двадцать фее ворот вокруг». Место тёмное; слав. в скобках «(двадесяти пяти)» — двойное чтение, не внесено."
  15: "τὸ αἴθριον τῆς πύλης ἔξωθεν εἰς τὸ αἴθριον αιλαμ τῆς πύλης ἔσωθεν — «непокрытое ворот отвне в непокрытое притвора ворот внутрь»; πηχῶν πεντήκοντα — «пятидесяти локтей». Та же формула в 40:14, 19."
  16: "θυρίδες κρυπταί — «окна скрытые (решётчатые)» (θυρίς — 窓; κρυπτός — скрытый); ἐπὶ τὰ θειμ καὶ ἐπὶ τὰ αιλαμ — «при фее и при притворах»; ἐπὶ τὸ αιλαμ φοίνικες — «на притворе пальмы» (φοῖνιξ — なつめやし): резные изображения, ср. 3 Цар 6:29."
  17: "εἰσήγαγέν με εἰς τὴν αὐλὴν τὴν ἐσωτέραν — «ввёл меня во внутренний двор» (LXX; в Синодальном «внешний» — иное чтение, МТ); παστοφόρια — «пастофории» (комнаты при дворе, 室); περίστυλα — «перистили» (柱廊); τριάκοντα παστοφόρια — «тридцать комнат»."
  18: "αἱ στοαὶ κατὰ νώτου τῶν πυλῶν — «галереи позади ворот» (στοά — 回廊); κατὰ τὸ μῆκος τῶν πυλῶν — «по длине ворот»; τὸ περίστυλον τὸ ὑποκάτω — «перистиль нижний» (ὑποκάτω — внизу)."
  19: "ἀπὸ τοῦ αἰθρίου τῆς πύλης τῆς ἐξωτέρας ἔσωθεν — «от непокрытого внешних ворот внутрь»; ἐπὶ τὸ αἴθριον τῆς πύλης τῆς βλεπούσης ἔξω — «до непокрытого ворот, смотрящих наружу»; πήχεις ἑκατόν — «сто локтей»; τῆς βλεπούσης κατ᾽ ἀνατολάς — «смотрящих на восток»."
  20: "πύλη βλέπουσα πρὸς βορρᾶν τῇ αὐλῇ τῇ ἐξωτέρᾳ — «ворота, обращённые к северу, внешнему двору»; διεμέτρησεν αὐτήν, τό τε μῆκος αὐτῆς καὶ τὸ πλάτος — «намерил их, длину их и ширину»."
  21: "θεε τρεῖς ἔνθεν καὶ τρεῖς ἔνθεν — «фее три с той и три с другой»; τὰ αιλευ καὶ τὰ αιλαμμω — «аилев и притворы» (αιλαμμω — мн. форма от αιλαμ); τοὺς φοίνικας αὐτῆς — «пальмы её»; κατὰ τὰ μέτρα τῆς πύλης τῆς βλεπούσης κατὰ ἀνατολάς — «по мере ворот, обращённых к востоку»; πηχῶν πεντήκοντα τὸ μῆκος καὶ εἴκοσι πέντε τὸ εὖρος — «пятьдесят локтей длина и двадцать пять ширина»."
  22: "αἱ θυρίδες αὐτῆς καὶ τὰ αιλαμμω καὶ οἱ φοίνικες — «окна её, притворы и пальмы»; ἐν ἑπτὰ κλιμακτῆρσιν ἀνέβαινον ἐπ᾽ αὐτήν — «семью ступенями восходили к ним» (κλιμακτήρ — 段); τὰ αιλαμμω ἔσωθεν — «притворы внутрь»."
  23: "πύλη τῇ αὐλῇ τῇ ἐσωτέρᾳ βλέπουσα ἐπὶ πύλην τοῦ βορρᾶ — «ворота внутреннему двору, обращённые к воротам северным»; ὃν τρόπον τῆς πύλης τῆς βλεπούσης κατὰ ἀνατολάς — «как ворота, обращённые к востоку»; ἀπὸ πύλης ἐπὶ πύλην πήχεις ἑκατόν — «от ворот до ворот сто локтей»."
  24: "ἤγαγέν με κατὰ νότον — «повёл меня к югу»; πύλη βλέπουσα πρὸς νότον — «ворота, обращённые к югу»; τὰ θεε καὶ τὰ αιλευ καὶ τὰ αιλαμμω κατὰ τὰ μέτρα ταῦτα — «фее, аилев и притворы по этим мерам»."
  25: "αἱ θυρίδες αὐτῆς καὶ τὰ αιλαμμω κυκλόθεν — «окна её и притворы вокруг»; καθὼς αἱ θυρίδες τοῦ αιλαμ — «как окна притвора»; πηχῶν πεντήκοντα τὸ μῆκος καὶ εἴκοσι πέντε τὸ εὖρος — «пятьдесят длина и двадцать пять ширина»."
  26: "ἑπτὰ κλιμακτῆρες αὐτῇ — «семь ступеней ей»; αιλαμμω ἔσωθεν — «притворы внутрь»; φοίνικες αὐτῇ εἷς ἔνθεν καὶ εἷς ἔνθεν ἐπὶ τὰ αιλευ — «пальмы ей, одна с той и одна с другой стороны, на аилев»."
  27: "πύλη κατέναντι πύλης τῆς αὐλῆς τῆς ἐσωτέρας πρὸς νότον — «ворота напротив ворот внутреннего двора к югу»; διεμέτρησεν τὴν αὐλὴν ἀπὸ πύλης ἐπὶ πύλην — «намерил двор от ворот до ворот»; ἑκατὸν τὸ εὖρος — «сто в ширину»."
  28: "εἰσήγαγέν με εἰς τὴν αὐλὴν τὴν ἐσωτέραν τῆς πύλης τῆς πρὸς νότον — «ввёл меня во внутренний двор через ворота, которые к югу»; κατὰ τὰ μέτρα ταῦτα — «по этим мерам»."
  29: "τὰ θεε καὶ τὰ αιλευ καὶ τὰ αιλαμμω κατὰ τὰ μέτρα ταῦτα — «фее, аилев и притворы по этим мерам»; θυρίδες αὐτῇ καὶ τῷ αιλαμμω κύκλῳ — «окна ей и притворам вокруг»; πεντήκοντα… εἴκοσι πέντε — «пятьдесят… двадцать пять»."
  30: "В gr-lxx-byz на месте стиха стоит «.» — лакуна (дефект модуля). Перевод по csl-ru: «И оконца их и еламы окрест, пятидесяти лактей долгота их, а широта двудесяти и пяти лактей»; эта клауза в LXX входит в конец 29-го стиха, поэтому в 29–30 есть повтор. В Синодальном иначе: «притворы кругом длиною в двадцать пять локтей, а шириною в пять». 〔…〕 не ставились."
  31: "αιλαμμω εἰς τὴν αὐλὴν τὴν ἐξωτέραν — «притворы во двор внешний»; φοίνικες τῷ αιλευ — «пальмы на аилев»; ὀκτὼ κλιμακτῆρες — «восемь ступеней». Та же формула в 40:34, 37."
  32: "εἰσήγαγέν με εἰς τὴν πύλην τὴν βλέπουσαν κατὰ ἀνατολάς — «ввёл меня в ворота, обращённые к востоку»; κατὰ τὰ μέτρα ταῦτα — «по этим мерам». Слав. добавляет «и фее и аилев и еламы по темжде мерам» — в LXX эта клауза в 33-м, повтор не внесён."
  33: "τὰ θεε καὶ τὰ αιλευ καὶ τὰ αιλαμμω κατὰ τὰ μέτρα ταῦτα — «фее, аилев и притворы по этим мерам»; θυρίδες αὐτῇ καὶ τῷ αιλαμμω κύκλῳ — «окна ей и притворам вокруг»; πεντήκοντα μῆκος… εἴκοσι πέντε εὖρος — «пятьдесят длина… двадцать пять ширина»."
  34: "αιλαμμω εἰς τὴν αὐλὴν τὴν ἐσωτέραν — «притворы во двор внутренний» (LXX; в Синодальном «на внешний» — иное чтение); φοίνικες ἐπὶ τοῦ αιλευ ἔνθεν καὶ ἔνθεν — «пальмы на аилев с той и с другой стороны»; ὀκτὼ κλιμακτῆρες — «восемь ступеней»."
  35: "εἰσήγαγέν με εἰς τὴν πύλην τὴν πρὸς βορρᾶν — «ввёл меня в ворота, которые к северу»; κατὰ τὰ μέτρα ταῦτα — «по этим мерам»."
  36: "τὰ θεε καὶ τὰ αιλευ καὶ τὰ αιλαμμω — «фее, аилев и притворы»; θυρίδες αὐτῇ κύκλῳ καὶ τῷ αιλαμμω — «окна ей вокруг и притворам»; πεντήκοντα μῆκος… εἴκοσι πέντε εὖρος — «пятьдесят длина… двадцать пять ширина»."
  37: "τὰ αιλαμμω εἰς τὴν αὐλὴν τὴν ἐξωτέραν — «притворы во двор внешний»; φοίνικες τῷ αιλευ ἔνθεν καὶ ἔνθεν — «пальмы на аилев с той и с другой стороны»; ὀκτὼ κλιμακτῆρες — «восемь ступеней»."
  38: "τὰ παστοφόρια αὐτῆς καὶ τὰ θυρώματα αὐτῆς καὶ τὰ αιλαμμω αὐτῆς ἐπὶ τῆς πύλης — «комнаты её, двери её и притворы её при воротах» (θύρωμα — 戸口). Слав. добавляет «вторыми сток, тамо измывают всесожжения» — нет в LXX, внесено без 〔…〕."
  39: "τῆς δευτέρας ἔκρυσις — «второго излияние (проход)» (ἔκρυσις — истечение, тёмное место; слав. «сток»); ὅπως σφάζωσιν ἐν αὐτῇ τὰ ὑπὲρ ἁμαρτίας καὶ ὑπὲρ ἀγνοίας — «чтобы заколать в нём за грех и за неведение» (σφάζω — 屠る; ἄγνοια — 無知). Слав. добавляет здесь «две трапезы о сию страну, две же об ону» — нет в LXX, внесено без 〔…〕."
  40: "κατὰ νώτου τοῦ ῥόακος τῶν ὁλοκαυτωμάτων — «позади стока всесожжений» (ῥόαξ — поток, сток; ὁλοκαύτωμα — 全焼の供え物); τῆς βλεπούσης πρὸς βορρᾶν — «смотрящего на север»; δύο τράπεζαι πρὸς ἀνατολάς — «две трапезы к востоку»; κατὰ νώτου τῆς δευτέρας καὶ τοῦ αιλαμ τῆς πύλης — «позади второй и притвора ворот»."
  41: "τέσσαρες ἔνθεν καὶ τέσσαρες ἔνθεν κατὰ νώτου τῆς πύλης — «четыре с той и четыре с другой, позади ворот»; ἐπ᾽ αὐτὰς σφάξουσι τὰ θύματα — «на них закалают жертвы» (θῦμα — いけにえ); κατέναντι τῶν ὀκτὼ τραπεζῶν — «напротив восьми столов»."
  42: "τέσσαρες τράπεζαι τῶν ὁλοκαυτωμάτων λίθιναι λελαξευμέναι — «четыре стола всесожжений, каменные тёсаные» (λαξεύω — тесать); πήχεος καὶ ἡμίσους τὸ πλάτος — «полтора локтя ширина»; πήχεων δύο καὶ ἡμίσους τὸ μῆκος — «два с половиной локтя длина»; ἐπὶ πῆχυν τὸ ὕψος — «в локоть высота». В Синодальном размеры иные (МТ)."
  43: "παλαιστὴν ἕξουσιν γεῖσος λελαξευμένον ἔσωθεν κύκλῳ — «ладонь имеют выступ тёсаный внутри кругом» (γεῖσος — карниз, выступ); ἐπὶ τὰς τραπέζας ἐπάνωθεν στέγας — «на столах сверху кровля» (στέγη); τοῦ καλύπτεσθαι ἀπὸ τοῦ ὑετοῦ καὶ ἀπὸ τῆς ξηρασίας — «чтобы покрываться от дождя и от зноя» (ξηρασία — засуха, зной)."
  44: "δύο ἐξέδραι ἐν τῇ αὐλῇ τῇ ἐσωτέρᾳ — «две экседры во внутреннем дворе» (ἐξέδρα — покой, комната; 室); μία κατὰ νώτου τῆς πύλης τῆς βλεπούσης πρὸς βορρᾶν φέρουσα πρὸς νότον — «одна позади ворот, обращённых к северу, ведущая к югу»; μία κατὰ νώτου τῆς πύλης τῆς πρὸς νότον βλεπούσης δὲ πρὸς βορρᾶν — «одна позади ворот, которые к югу, обращённых к северу»."
  45: "Ἡ ἐξέδρα αὕτη ἡ βλέπουσα πρὸς νότον — «эта экседра, обращённая к югу»; τοῖς ἱερεῦσι τοῖς φυλάσσουσι τὴν φυλακὴν τοῦ οἴκου — «священникам, охраняющим стражу дома» (φυλακή — 見張り). Речь мужа открывается здесь и закрывается в 46-м."
  46: "ἡ ἐξέδρα ἡ βλέπουσα πρὸς βορρᾶν — «экседра, обращённая к северу»; τοῖς φυλάσσουσι τὴν φυλακὴν τοῦ θυσιαστηρίου — «охраняющим стражу жертвенника» (θυσιαστήριον — 祭壇); υἱοὶ Σαδδουκ — «сыны Садока» (サドク); οἱ ἐγγίζοντες ἐκ τοῦ Λευι πρὸς κύριον λειτουργεῖν αὐτῷ — «приближающиеся из Левия к Господу, чтобы служить Ему» (λειτουργέω). Здесь речь закрывается."
  47: "διεμέτρησεν τὴν αὐλὴν μῆκος πήχεων ἑκατὸν καὶ εὖρος πήχεων ἑκατόν — «намерил двор длиною сто локтей и шириною сто локтей»; ἐπὶ τὰ τέσσαρα μέρη αὐτῆς — «на четыре стороны его»; τὸ θυσιαστήριον ἀπέναντι τοῦ οἴκου — «жертвенник напротив дома»."
  48: "εἰσήγαγέν με εἰς τὸ αιλαμ τοῦ οἴκου — «ввёл меня в притвор дома»; τὸ αιλ τοῦ αιλαμ πηχῶν πέντε τὸ πλάτος ἔνθεν καὶ πέντε ἔνθεν — «в столбах притвора пять локтей с одной и пять с другой»; τὸ εὖρος τοῦ θυρώματος πηχῶν δέκα τεσσάρων — «ширина дверей четырнадцать локтей»; ἐπωμίδες τῆς θύρας πηχῶν τριῶν — «боковины двери три локтя» (ἐπωμίς — плечо, боковина)."
  49: "τὸ μῆκος τοῦ αιλαμ πηχῶν εἴκοσι καὶ τὸ εὖρος πηχῶν δώδεκα — «длина притвора двадцать локтей и ширина двенадцать»; ἐπὶ δέκα ἀναβαθμῶν ἀνέβαινον ἐπ᾽ αὐτό — «по десяти ступеням восходили к нему»; στῦλοι ἦσαν ἐπὶ τὸ αιλαμ — «столбы были у притвора». В Синодальном «одиннадцать локтей» — иное чтение (МТ); в LXX и слав. двенадцать."
