# jp-box, Иезекииль, глава 40. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 40 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: видение нового храма и его измерений. 1–4 — дата (двадцать пятый год
# плена, четырнадцатый год по взятии города), рука Господня, гора, муж с мерной
# вервью и тростью; повеление смотреть, слушать и возвещать дому Израилеву.
# 5–16 — внешняя стена и восточные ворота: трость в шесть локтей «в локоть и ладонь»,
# семь ступеней, фее, еламы, аилев, окна, финики. 17–27 — внешний двор: тридцать
# пастофорий, помост, сто локтей до внутренних ворот, северные и южные ворота.
# 28–37 — внутренний двор: южные, восточные, северные ворота, повтор формул.
# 38–43 — пастофории у ворот, столы для заклания, четыре каменных стола, ладонный
# выступ и кровля. 44–46 — две экседры для священников, сыны Садока. 47–49 — двор
# сто на сто, жертвенник, притвор храма: столбы, ширина дверей, десять ступеней.
# Голоса: 1–3 повествование без кавычек; 4 речь мужа — 「…」; 5–44 повествование;
# 45–46 одна речь мужа 「…」 (открывается в 45, закрывается в 46); 47–49 повествование.
# «Точка»: 40:30 — в gr-lxx-byz на месте стиха «.» (лакуна модуля); перевод по слав.,
# без 〔…〕, см. notes 30.
# Термины храма (держать одинаково в 40–42): πύλη — 門[もん]; πυλών — 門[もん]の構[こう]え;
# θύρα/θύρωμα — 戸口[とぐち]/戸[と]; αἴθριον — 覆[おお]いのない所[ところ];
# αιλαμ и αιλαμμω — 前廊[ぜんろう] (LXX различает ед. и мн. формы одного слова,
# по-японски не различаем); αιλευ — 柱[はしら] (выступ, пилястр); θεε — 小室[しょうしつ]
# (боковая комната в воротах); παστοφόρια — 室[しつ]; ἐξέδρα — 室[しつ] (покой);
# φοίνικες — なつめやし (резные пальмы); κλιμακτήρ/ἀναβαθμός — 段[だん];
# πῆχυς — キュビト («локоть и ладонь» — 手[て]のひらを加[くわ]えた一[いっ]キュビト);
# θυσιαστήριον — 祭壇[さいだん]; οἶκος — 神殿[しんでん].
#

