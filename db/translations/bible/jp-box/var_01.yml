# jp-box, Варух, глава 1. Черновик для приёмки.
#
# Книга: Варух (var), 5 глав, 141 стих (1:22, 2:35, 3:38, 4:37, 5:9).
# Структура и нумерация — по славянской/Синодальной Библии (решение автора проекта);
# в этой книге они совпадают с греческим модулем gr-lxx-byz, поэтому деление стихов
# взято из него, точек-лакун в нём нет.
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги есть только в 3:36–4:4 (7 стихов), использован как
# свидетель церковного чтения; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: 1–2 надписание: книга, автор, родословие, время и место; 3–4 чтение книги
# в Вавилоне — царю, вельможам, царским детям, старейшинам и всему народу от малого
# до великого; 5–7 плач, пост, молитва, сбор серебра и посольство в Иерусалим;
# 8–9 сосуды храма, возвращаемые в Иудею, и переселение Иехонии; 10–14 слово письма:
# серебро на жертвы, молитва о жизни царя и его сына, просьба молиться о самих
# переселенцах, повеление читать книгу в праздник; 15–22 начало исповедания:
# «Господу Богу нашему правда, а нам стыд лиц» (15–16), грех и непокорность от исхода
# из Египта (17–22).
# Голоса и кавычки: 1:10–14 — 「…」(слова письма, вводятся «и сказали они», καὶ εἶπαν);
# 1:15–22 — отдельное 「…» (исповедание, вводится «и скажите», καὶ ἐρεῖτε); вложенной
# речи в главе нет. Молитва продолжается в главе 2, поэтому в конце 1:22 стоит 」
# только для парности главы, а в 2:1 цитата открывается снова (как iov 4/5).
# 〔…〕 нет: все 22 стиха и все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: カルデア人, 燔祭, 乳香, 供え物, 長老, 祭司, 祭壇 уже в корпусе.
# Имена: バルク (по названию книги バルク書), ネリヤ, マアセヤ, ゼデキヤ, アサデヤ,
# ヒルキヤ, エホヤキン, ヨヤキム (царь 1:3), ヨアキム (первосвященник 1:7), サロム,
# ネブカドネツァル, バルタサル, カルデア人, シワン (месяц), スド (река).

