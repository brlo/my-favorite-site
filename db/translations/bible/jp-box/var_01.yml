verses:
  1: "これらは、バルクがバビロンで書[か]いた書物[しょもつ]の言葉[ことば]である。バルクは、ネリヤの子[こ]、マアセヤの子[こ]、ゼデキヤの子[こ]、アサデヤの子[こ]、ヒルキヤの子[こ]である。"
  2: "その時[とき]は、第五年[だいごねん]、その月[つき]の七[なの]日[か]、カルデア人[じん]がエルサレムを取[と]り、火[ひ]で焼[や]いた時であった。"
  3: "バルクはこの書物[しょもつ]の言葉[ことば]を、ユダの王[おう]ヨヤキムの子[こ]エホヤキンの耳[みみ]に、またこの書物のもとへ来[き]たすべての民[たみ]の耳[みみ]に読[よ]み聞[き]かせた。"
  4: "また、力[ちから]ある者[もの]たち、王[おう]の子[こ]ら、長老[ちょうろう]たちの耳[みみ]に、そしてバビロンでスドの川[かわ]のほとりに住[す]むすべての民[たみ]の耳[みみ]に、小[ちい]さな者[もの]から大[おお]きな者[もの]まで読[よ]み聞[き]かせた。"
  5: "彼らは主[しゅ]の前[まえ]で泣[な]き、断食[だんじつ]し、祈[いの]った。"
  6: "そして、それぞれの手[て]にできただけの銀[ぎん]を集[あつ]めた。"
  7: "それをエルサレムへ、ヒルキヤの子[こ]、サロムの子[こ]である大祭司[だいさいし]ヨアキムのもとへ、また祭司[さいし]たちと、彼とともにエルサレムにいたすべての民[たみ]のもとへ送[おく]った。"
  8: "彼が、神殿[しんでん]から運[はこ]び出[だ]された主[しゅ]の家[いえ]の器[うつわ]を、ユダの地[ち]に返[かえ]すために受[う]け取[と]ったときのことである。シワン月[つき]の十[とお]日[か]、ヨシヤの子[こ]であるユダの王[おう]ゼデキヤが造[つく]った銀[ぎん]の器[うつわ]である。"
  9: "それは、バビロンの王[おう]ネブカドネツァルがエホヤキンと君[きみ]たち、捕[と]らわれた者[もの]たち、力[ちから]ある者[もの]たち、この地[ち]の民[たみ]をエルサレムから移[うつ]し、彼らをバビロンへ連[つ]れて行[い]った後[あと]のことであった。"
  10: "彼らは言[い]った。「見[み]よ、私たちはあなたがたに銀[ぎん]を送[おく]った。その銀で燔祭[はんさい]と罪[つみ]のための献[ささ]げ物[もの]と乳香[にゅうこう]を買[か]い、供[そな]え物[もの]を調[ととの]えて、私たちの神[かみ]である主[しゅ]の祭壇[さいだん]にささげなさい。"
  11: "また、バビロンの王[おう]ネブカドネツァルの命[いのち]と、その子[こ]バルタサルの命[いのち]のために祈[いの]りなさい。彼らの日[ひ]々[び]が、地[ち]の上[うえ]で天[てん]の日々のように長[なが]く続[つづ]くように。"
  12: "主[しゅ]は私たちに力[ちから]を与[あた]え、私たちの目[め]を照[て]らしてくださる。私たちはバビロンの王[おう]ネブカドネツァルの陰[かげ]と、その子[こ]バルタサルの陰[かげ]の下[した]で生[い]き、長[なが]い日[ひ]々[び]彼らに仕[つか]えて、彼らの前[まえ]で恵[めぐ]みを得[え]るであろう。"
  13: "また、私たちの神[かみ]である主[しゅ]に向[む]かって、私たちのためにも祈[いの]りなさい。私たちは私たちの神である主に罪[つみ]を犯[おか]した。主[しゅ]の怒[いか]りと憤[いきどお]りは、今日[きょう]に至[いた]るまで、私たちから離[はな]れなかった。"
  14: "あなたがたは、私たちが送[おく]ったこの書物[しょもつ]を、祭[まつ]りの日[ひ]と定[さだ]められた日[ひ]々[び]に、主[しゅ]の家[いえ]で告白[こくはく]するために読[よ]みなさい。」"
  15: "あなたがたは言[い]いなさい。「私たちの神[かみ]である主[しゅ]にこそ義[ぎ]があり、私たちには顔[かお]の恥[はじ]がある。今日[きょう]という日[ひ]のように。その恥[はじ]は、ユダの人[ひと]にも、エルサレムに住[す]む者[もの]にも、"
  16: "私たちの王[おう]たち、君[きみ]たち、祭司[さいし]たち、預言者[よげんしゃ]たち、父[ちち]たちにもある。"
  17: "私たちが主[しゅ]の前[まえ]に罪[つみ]を犯[おか]したからであり、"
  18: "主[しゅ]に従[したが]わず、私たちの神[かみ]である主の声[こえ]に聞[き]き従[したが]って、主が私たちの前[まえ]に与[あた]えられた戒[いまし]めのうちを歩[あゆ]むことをしなかった。"
  19: "主[しゅ]が私たちの父[ちち]たちをエジプトの地[ち]から導[みちび]き出[だ]された日[ひ]から今日[きょう]に至[いた]るまで、私たちは私たちの神[かみ]である主に逆[さか]らい続[つづ]け、その声[こえ]を聞[き]くことを拒[こば]んだ。"
  20: "それゆえ、災[わざわ]いと呪[のろ]いが私たちに付[つ]きまとった。主[しゅ]がその僕[しもべ]モーセに、私たちの父[ちち]たちをエジプトの地[ち]から導[みちび]き出[だ]して乳[ちち]と蜜[みつ]の流[なが]れる地[ち]を与[あた]えようとされた日[ひ]に定[さだ]められたものである。今日[きょう]という日[ひ]のように。"
  21: "私たちは、私たちの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]わず、主が私たちに遣[つか]わされた預言者[よげんしゃ]たちのすべての言葉[ことば]にも従[したが]わなかった。"
  22: "私たちはそれぞれ、自分[じぶん]の悪[わる]い心[こころ]の思[おも]いのままに歩[あゆ]み、ほかの神[かみ]々[がみ]に仕[つか]えて、私たちの神[かみ]である主[しゅ]の目[め]の前[まえ]に悪[わる]を行[おこな]った。」"

notes:
  1: "Καὶ οὗτοι οἱ λόγοι τοῦ βιβλίου — «И вот слова книги» (οὗτοι — указательное «эти»); οὓς ἔγραψεν Βαρουχ υἱὸς Νηριου — «которые написал Варух, сын Нирии»; родословие: Νηριου, Μαασαιου, Σεδεκιου, Ασαδιου, Χελκιου — ネリヤ, マアセヤ, ゼデキヤ, アサデヤ, ヒルキヤ (マアセヤ — 1 Пар 6:25, アサデヤ — 1 Пар 3:20, ヒルキヤ — 2 Пар 35:8; здешний Седекия — предок Варуха, не царь 1:8); ἐν Βαβυλῶνι — «в Вавилоне». Слав. «Сия словеса книги, юже написа варух…» — то же. Имя バルク — по названию книги (バルク書)."
  2: "ἐν τῷ ἔτει τῷ πέμπτῳ — «в пятый год» (порядковое числительное); ἐν ἑβδόμῃ τοῦ μηνός — «в седьмой [день] месяца»; ἐν τῷ καιρῷ, ᾧ ἔλαβον οἱ Χαλδαῖοι τὴν Ιερουσαλημ — «во время, когда Халдеи взяли Иерусалим» (λαμβάνω — брать); ἐνέπρησαν αὐτὴν ἐν πυρί — «сожгли её огнём» (ἐμπίπρημι). Слав. и ru — то же; по Иер 52 и 4 Цар 25 это пятый год после переселения Иехонии."
  3: "ἀνέγνω Βαρουχ τοὺς λόγους τοῦ βιβλίου τούτου — «прочитал Варух слова книги сей» (ἀναγινώσκω — читать вслух); ἐν ὠσὶν Ιεχονιου υἱοῦ Ιωακιμ βασιλέως Ιουδα — «в уши Иехонии, сына Иоакима, царя Иудина» (ἐν ὠσίν — «во уши», т. е. вслух; ヨヤキム — царь, не ヨアキム 1:7); ἐν ὠσὶ παντὸς τοῦ λαοῦ τῶν ἐρχομένων πρὸς τὴν βίβλον — «в уши всего народа, приходящего к книге» (πρὸς τὴν βίβλον буквально «к книге»; слав. «ко книзе»)."
  4: "τῶν δυνατῶν — «сильных» (δυνατός — вельможа, 力ある者); υἱῶν τῶν βασιλέων — «сыновей царских»; τῶν πρεσβυτέρων — «старейшин» (πρεσβύτερος, 長老); ἀπὸ μικροῦ ἕως μεγάλου — «от малого до великого»; πάντων τῶν κατοικούντων ἐν Βαβυλῶνι ἐπὶ ποταμοῦ Σουδ — «всех живущих в Вавилоне при реке Суд» (Σουδ — スド川; река не отождествлена, слав. «суд»)."
  5: "καὶ ἔκλαιον καὶ ἐνήστευον καὶ ηὔχοντο ἐναντίον κυρίου — «и плакали, и постились, и молились пред Господом» (имперфекты — длительное действие; ἐναντίον — перед лицом). Слав. «плакахуся, и постяхуся, и моляхуся молитвами пред Господем»."
  6: "συνήγαγον ἀργύριον — «собрали серебро»; καθὰ ἑκάστου ἠδύνατο ἡ χείρ — «как могла рука каждого», т. е. по достатку (слав. «якоже когождо можаше рука»)."
  7: "ἀπέστειλαν εἰς Ιερουσαλημ πρὸς Ιωακιμ υἱὸν Χελκιου υἱοῦ Σαλωμ τὸν ἱερέα — «послали в Иерусалим к Иоакиму, сыну Хелкии, сына Саломова, священнику» (ヨアキム — первосвященник, не царь ヨヤキム 1:3; Σαλωμ — サロム); слав. добавляет «жерцу великому» — в LXX только τὸν ἱερέα, внесено в текст (大祭司), отмечено; πρὸς τοὺς ἱερεῖς καὶ πρὸς πάντα τὸν λαὸν τοὺς εὑρεθέντας μετ᾽ αὐτοῦ ἐν Ιερουσαλημ — «к священникам и ко всему народу, находившемуся с ним в Иерусалиме»."
  8: "ἐν τῷ λαβεῖν αὐτὸν τὰ σκεύη οἴκου κυρίου — «когда он принял сосуды дома Господня» (αὐτόν — Варух; σκεῦος — 器); τὰ ἐξενεχθέντα ἐκ τοῦ ναοῦ — «вынесенные из храма» (ἐκφέρω — выносить); ἀποστρέψαι εἰς γῆν Ιουδα — «чтобы возвратить в землю Иудейскую»; τῇ δεκάτῃ τοῦ Σιουαν — «в десятый [день] Сиуана» (Σιουαν — месяц сиван, シワン; слав. «сиван», ru «Сиуал» — транслитерация LXX); σκεύη ἀργυρᾶ, ἃ ἐποίησεν Σεδεκιας υἱὸς Ιωσια βασιλεὺς Ιουδα — «сосуды серебряные, которые сделал Седекия, сын Иосии, царь Иудейский»."
  9: "μετὰ τὸ ἀποικίσαι Ναβουχοδονοσορ — «после того как переселил Навуходоносор» (ἀποικίζω — выселять); τὸν Ιεχονιαν καὶ τοὺς ἄρχοντας καὶ τοὺς δεσμώτας καὶ τοὺς δυνατοὺς καὶ τὸν λαὸν τῆς γῆς — «Иехонию, и князей, и узников, и сильных, и народ земли» (δεσμώτης — узник); καὶ ἤγαγεν αὐτὸν εἰς Βαβυλῶνα — «и привёл его в Вавилон»: в LXX единственное число (αὐτόν), в слав. «введе я» — множественное; в тексте по csl 「彼ら」, единственное число LXX отмечено. Редакционное «(связаны)» в слав. не переводилось."
  10: "καὶ εἶπαν — «и сказали они»: с этих слов начинается слово письма (до 1:14), 1:10–14 в 「…」; Ἰδοὺ ἀπεστείλαμεν πρὸς ὑμᾶς ἀργύριον — «вот, мы послали вам серебро»; ἀγοράσατε τοῦ ἀργυρίου ὁλοκαυτώματα καὶ περὶ ἁμαρτίας καὶ λίβανον — «купите на серебро всесожжения, и [жертву] за грех, и ладан» (ὁλοκαύτωμα — 燔祭; περὶ ἁμαρτίας — жертва за грех, 罪のための献げ物; λίβανος — 乳香); ποιήσατε μαννα — «сделайте манну» (μαννα — передача евр. minḥā, хлебный дар; слав. «сотворите жертву», ru «приготовьте дар»; передано 供え物); ἀνοίσατε ἐπὶ τὸ θυσιαστήριον κυρίου θεοῦ ἡμῶν — «вознесите на жертвенник Господа Бога нашего» (ἀναφέρω)."
  11: "προσεύξασθε περὶ τῆς ζωῆς Ναβουχοδονοσορ — «молитесь о жизни Навуходоносора» (ζωή — 命); εἰς ζωὴν Βαλτασαρ υἱοῦ αὐτοῦ — «о жизни Валтасара, сына его» (バルタサル — новое имя в корпусе, слав. «валтасара»); ἵνα ὦσιν αἱ ἡμέραι αὐτῶν ὡς αἱ ἡμέραι τοῦ οὐρανοῦ ἐπὶ τῆς γῆς — «чтобы дни их были, как дни неба, на земле»."
  12: "δώσει κύριος ἰσχὺν ἡμῖν — «даст Господь силу нам»; φωτίσει τοὺς ὀφθαλμοὺς ἡμῶν — «просветит очи наши» (φωτίζω); ζησόμεθα ὑπὸ τὴν σκιὰν — «будем жить под сенью» (σκιά — тень, 陰); δουλεύσομεν αὐτοῖς ἡμέρας πολλάς — «будем служить им много дней»; εὑρήσομεν χάριν ἐναντίον αὐτῶν — «найдём милость пред ними»."
  13: "προσεύξασθε περὶ ἡμῶν πρὸς κύριον — «молитесь о нас Господу»; ὅτι ἡμάρτομεν τῷ κυρίῳ θεῷ ἡμῶν — «ибо мы согрешили Господу Богу нашему»; οὐκ ἀπέστρεψεν ὁ θυμὸς κυρίου καὶ ἡ ὀργὴ αὐτοῦ ἀφ᾽ ἡμῶν ἕως τῆς ἡμέρας ταύτης — «не отвратился гнев Господа и ярость Его от нас до сего дня» (ἀποστρέφω)."
  14: "ἀναγνώσεσθε τὸ βιβλίον τοῦτο — «прочитайте книгу сию» (будущее время в значении повеления); ὃ ἀπεστείλαμεν πρὸς ὑμᾶς — «которую мы послали вам»; ἐξαγορεῦσαι ἐν οἴκῳ κυρίου — «чтобы исповедать в доме Господнем» (ἐξαγορεύω — открыто объявлять, исповедовать; слав. «исповедати», ru «обнародовать»; передано 告白する); ἐν ἡμέρᾳ ἑορτῆς καὶ ἐν ἡμέραις καιροῦ — «в день праздника и в дни [нарочитые]» (καιρός — назначенное время)."
  15: "Стих открывает исповедание 1:15–3:8; вводное καὶ ἐρεῖτε — «и скажите» (вне кавычек) начинает новое 「…»; Τῷ κυρίῳ θεῷ ἡμῶν ἡ δικαιοσύνη — «Господу Богу нашему правда» (δικαιοσύνη — 義; дательный принадлежности); ἡμῖν δὲ αἰσχύνη τῶν προσώπων — «нам же стыд лиц» (αἰσχύνη — 恥; τῶν προσώπων — «лиц», т. е. на лице); ὡς ἡ ἡμέρα αὕτη — «как день сей»; ἀνθρώπῳ Ιουδα καὶ τοῖς κατοικοῦσιν Ιερουσαλημ — «человеку Иудину и живущим в Иерусалиме» (начало перечня, продолжается в 16). По-японски перечень начат словами 「その恥は」, иначе стих без сказуемого повисает."
  16: "τοῖς βασιλεῦσιν ἡμῶν καὶ τοῖς ἄρχουσιν ἡμῶν καὶ τοῖς ἱερεῦσιν ἡμῶν καὶ τοῖς προφήταις ἡμῶν καὶ τοῖς πατράσιν ἡμῶν — «царям нашим, и князьям нашим, и священникам нашим, и пророкам нашим, и отцам нашим»: продолжение дательного перечня из 1:15; по-японски добавлено сказуемое 「ある」, иначе стих повисает без глагола."
  17: "ὧν ἡμάρτομεν ἔναντι κυρίου — «которым мы согрешили пред Господом» (ὧν — относительное к ἁμαρτάνω; слав. «понеже согрешихом пред Господем»)."
  18: "ἠπειθήσαμεν αὐτῷ — «мы не покорились Ему» (ἀπειθέω); οὐκ ἠκούσαμεν τῆς φωνῆς κυρίου θεοῦ ἡμῶν — «не послушали гласа Господа Бога нашего»; πορεύεσθαι τοῖς προστάγμασιν κυρίου — «ходить в повелениях Господних» (πρόσταγμα — 戒め); οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν — «которые Он дал пред лицом нашим»."
  19: "ἀπὸ τῆς ἡμέρας, ἧς ἐξήγαγεν κύριος τοὺς πατέρας ἡμῶν ἐκ γῆς Αἰγύπτου — «от дня, в который вывел Господь отцов наших из земли Египетской»; ἤμεθα ἀπειθοῦντες — «мы были непокорны» (имперфект, длительное состояние); ἐσχεδιάζομεν πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ — «и умышленно уклонялись, чтобы не слушать гласа Его» (σχεδιάζω — делать намеренно небрежно; слав. «отметахомся»; передано 拒んだ)."
  20: "ἐκολλήθη εἰς ἡμᾶς τὰ κακὰ καὶ ἡ ἀρά — «прилепились к нам бедствия и клятва» (κολλάω — прилепляться; ἀρά — 呪い); ἣν συνέταξεν κύριος τῷ Μωυσῇ παιδὶ αὐτοῦ — «которую предписал Господь рабу Своему Моисею» (συντάσσω); ἐν ἡμέρᾳ, ᾗ ἐξήγαγεν … δοῦναι ἡμῖν γῆν ῥέουσαν γάλα καὶ μέλι — «в день, когда вывел … дать нам землю, текущую молоком и мёдом» (ῥέω — течь); ὡς ἡ ἡμέρα αὕτη — «как день сей»."
  21: "οὐκ ἠκούσαμεν τῆς φωνῆς κυρίου τοῦ θεοῦ ἡμῶν — «не послушали гласа Господа Бога нашего»; κατὰ πάντας τοὺς λόγους τῶν προφητῶν, ὧν ἀπέστειλεν πρὸς ἡμᾶς — «по всем словам пророков, которых Он послал к нам»."
  22: "ᾠχόμεθα ἕκαστος ἐν διανοίᾳ καρδίας αὐτοῦ τῆς πονηρᾶς — «ходили каждый по помышлению злого сердца своего» (διανοία — 思い; οἴχομαι — уходить); ἐργάζεσθαι θεοῖς ἑτέροις — «служить иным богам» (ἐργάζομαι — работать, служить); ποιῆσαι τὰ κακὰ κατ᾽ ὀφθαλμοὺς κυρίου θεοῦ ἡμῶν — «делать злое пред очами Господа Бога нашего». В конце стиха стоит 」 только для парности главы: исповедание продолжается в 2:1, где 「 открывается снова."
