verses:
  1: "賢[かしこ]い裁[さば]き手[て]は自分の民[たみ]を教[おし]え導[みちび]く。悟[さと]りのある者[もの]の支配[しはい]は整[ととの]えられる。"
  2: "民[たみ]の裁[さば]き手[て]に応[おう]じて、その奉仕者[ほうししゃ]たちもそうなる。町[まち]の指導者[しどうしゃ]に応じて、そこに住[す]むすべての者[もの]もそうなる。"
  3: "教[おし]えのない王[おう]は自分の民[たみ]を滅[ほろ]ぼす。町[まち]は力[ちから]ある者[もの]たちの悟[さと]りによって築[きず]かれる。"
  4: "地[ち]の支配[しはい]は主[しゅ]の手[て]のうちにある。主はその時[とき]にふさわしい者[もの]を、その地の上[うえ]に立[た]てる。"
  5: "人[ひと]の道[みち]の幸[さいわ]いも主[しゅ]の手[て]のうちにある。主は学者[がくしゃ]の顔[かお]に自分の栄光[えいこう]を置[お]く。"
  6: "どんな不正[ふせい]に対[たい]しても、隣人[りんじん]に怒[いか]りを抱[だ]くな。横暴[おうぼう]な行[おこな]いを少[すこ]しもするな。"
  7: "高[たか]ぶりは主[しゅ]の前[まえ]でも人[ひと]の前でも憎[にく]まれる。不正[ふせい]はそのどちらに対[たい]しても罪[つみ]である。"
  8: "王国[おうこく]は民[たみ]から民へと移[うつ]る。不正[ふせい]と横暴[おうぼう]と欺[あざむ]きの富[とみ]のゆえである。"
  9: "なぜ土[つち]と灰[はい]は高[たか]ぶるのか。生[い]きている間[あいだ]に、その内臓[ないぞう]が投[な]げ出[だ]されるというのに。"
  10: "長[なが]い病[やまい]も医者[いしゃ]は断[た]ち切[き]る。今日[きょう]は王[おう]でも、明日[あす]には死[し]ぬ。"
  11: "人[ひと]が死[し]ぬと、這[は]うもの、獣[けもの]、虫[むし]がその嗣業[しぎょう]を受[う]け継[つ]ぐ。"
  12: "人[ひと]の高[たか]ぶりの始[はじ]まりは、主[しゅ]から離[はな]れることである。その心[こころ]は、自分[じぶん]を造[つく]った方[かた]から離れた。"
  13: "高[たか]ぶりの始[はじ]まりは罪[つみ]であるからだ。それを抱[だ]く者[もの]は忌[い]むべきものをも吐[は]き出[だ]す。それゆえ、主[しゅ]は災[わざわ]いのうちに彼[かれ]らを辱[はずかし]め、終[つい]には滅[ほろ]ぼされた。"
  14: "主[しゅ]は支配者[しはいしゃ]たちの王座[おうざ]を倒[たお]し、その代[か]わりに柔和[にゅうわ]な者[もの]たちを座[すわ]らせた。"
  15: "主[しゅ]は高[たか]ぶる諸国民[しょこくみん]の根[ね]を引[ひ]き抜[ぬ]き、その代[か]わりに謙遜[けんそん]な者[もの]たちを植[う]えられた。"
  16: "主[しゅ]は諸国民[しょこくみん]の地[ち]を覆[くつがえ]し、地の基[もとい]に至[いた]るまで滅[ほろ]ぼされた。"
  17: "主[しゅ]は彼[かれ]らを取[と]り除[のぞ]き、滅[ほろ]ぼし、地[ち]からその記憶[きおく]を絶[た]たれた。"
  18: "高[たか]ぶりは人[ひと]のために造[つく]られていない。激[はげ]しい怒[いか]りも、女[おんな]から生[う]まれる者[もの]のために造られていない。"
  19: "尊[とうと]い種[たね]とは何[なに]か。人[ひと]の種である。尊い種とは何か。主[しゅ]を恐[おそ]れる者[もの]たちである。卑[いや]しい種とは何か。人の種である。卑しい種とは何か。戒[いまし]めを破[やぶ]る者たちである。"
  20: "兄弟[きょうだい]たちの間[あいだ]で、その指導者[しどうしゃ]は尊[とうと]い。主[しゅ]を恐[おそ]れる者[もの]たちは、主の目[め]に尊い。"
  21: "高[たか]ぶりは人[ひと]のために造[つく]られたものではなく、怒[いか]りの激[はげ]しさも、女[おんな]の産[う]みによって造られたものではない。"
  22: "富[とみ]ある者[もの]も、名[な]の高[たか]い者も、貧[まず]しい者も、その誇[ほこ]りは主[しゅ]を恐[おそ]れることである。"
  23: "悟[さと]りのある貧[まず]しい者[もの]を辱[はずかし]めるのは正[ただ]しくない。罪[つみ]深[ぶか]い人[ひと]をほめるのもふさわしくない。"
  24: "高官[こうかん]も、裁[さば]き手[て]も、支配者[しはいしゃ]もほめられる。しかし、主[しゅ]を恐[おそ]れる者[もの]にまさる者は、彼[かれ]らのうちに一人[ひとり]もいない。"
  25: "賢[かしこ]い僕[しもべ]には、自由[じゆう]な者[もの]たちが仕[つか]える。思慮[しりょ]ある人[ひと]は、教[おし]えられても不満[ふまん]を言[い]わない。"
  26: "自分[じぶん]の仕事[しごと]をするのに賢[かしこ]ぶるな。苦[くる]しい時[とき]に自分をほめるな。"
  27: "すべての点[てん]で満[み]ち足[た]りて働[はたら]く者[もの]は、ほめられて歩[ある]きながらパンに困[こま]る者よりも良[よ]い。"
  28: "子[こ]よ、柔和[にゅうわ]さをもってあなたの魂[たましい]を尊[とうと]び、その価値[かち]に応[おう]じてそれに名誉[めいよ]を与[あた]えよ。"
  29: "自分[じぶん]の魂[たましい]に対して罪[つみ]を犯[おか]す者[もの]を、誰[だれ]が正[ただ]しいとすることができるのか。自分のいのちを辱[はずかし]める者を、誰がほめるのか。"
  30: "貧[まず]しい者[もの]はその知識[ちしき]によってほめられ、富[とみ]ある者はその富によってほめられる。"
  31: "貧[まず]しさのうちでほめられる者[もの]は、富[とみ]のうちではどれほどであろうか。富のうちで辱[はずかし]められる者は、貧しさのうちではどれほどであろうか。"

notes:
  1: "κριτὴς σοφός — «судья мудрый»; παιδεύσει τὸν λαὸν αὐτοῦ — «научит народ свой» (παιδεύω); ἡγεμονία συνετοῦ τεταγμένη — «владычество разумного упорядоченное» (ἡγεμονία, τάσσω). Слав. «премудр судия наказует люди своя»."
  2: "κατὰ τὸν κριτήν — «по судье», т. е. каков судья; λειτουργοί — «служители»; κατὰ τὸν ἡγούμενον τῆς πόλεως — «по правителю города»; οἱ κατοικοῦντες — жители (κατοικέω)."
  3: "βασιλεὺς ἀπαίδευτος — «царь необученный, невежественный»; ἀπολεῖ — «погубит»; οἰκισθήσεται — «будет населён, устроен» (οἰκίζω); ἐν συνέσει δυναστῶν — «в разуме сильных, владык» (σύνεσις, δυνάστης)."
  4: "ἐν χειρὶ κυρίου ἡ ἐξουσία τῆς γῆς — «в руке Господа власть земли»; τὸν χρήσιμον — «полезного, пригодного» (χρήσιμος, слав. «потребнаго»); ἐγερεῖ εἰς καιρόν — «воздвигнет в своё время» (ἐγείρω)."
  5: "εὐοδία ἀνδρός — «благой путь, успех человека» (εὐοδία); προσώπῳ γραμματέως — «на лицо книжника, писца» (γραμματεύς); ἐπιθήσει δόξαν — «возложит славу» (ἐπιτίθημι)."
  6: "ἐπὶ παντὶ ἀδικήματι — «при всякой неправде, обиде» (ἀδίκημα); μὴ μηνιάσῃς — «не держи гнева» (μηνιάω); ἐν ἔργοις ὕβρεως — «в делах дерзости, насилия» (ὕβρις)."
  7: "μισητή — «ненавистна» (μισητός); ἔναντι κυρίου καὶ ἀνθρώπων — «пред Господом и людьми»; ὑπερηφανία — гордость (ὑπερηφανία); ἐξ ἀμφοτέρων πλημμελής — «от обоих преступна, неправа» (πλημμελής)."
  8: "βασιλεία ἀπὸ ἔθνους εἰς ἔθνος μετάγεται — «царство от народа к народу переносится» (μετάγω); διὰ ἀδικίας καὶ ὕβρεις — «через неправду и насилия»; χρήματα — «имущества, деньги». Csl добавляет «льстивых» — «имений льстивых», т. е. обманного богатства; это csl-чтение внесено в текст, в LXX только χρήματα."
  9: "τί ὑπερηφανεύεται γῆ καὶ σποδός — «что превозносится земля и пепел» (ὑπερηφανεύομαι, σποδός); ἐν ζωῇ ἔρριψα τὰ ἐνδόσθια αὐτοῦ — «при жизни я выбросил внутренности его» (ῥίπτω, ἐνδόσθια); лицо глагола меняется, поэтому в японском страдательный оборот. Слав. 10:9–10 делят стих; здесь обе половины."
  10: "μακρὸν ἀρρώστημα — «долгая болезнь» (ἀρρώστημα); σκώπτει ἰατρός — букв. «врач осмеивает, обманывает» (σκώπτω); csl «отсецает врачь» — «отсекает», по паритету взято csl, передано 断ち切る; смысл: врач обрывает болезнь, но смерть всё равно приходит. βασιλεὺς σήμερον, καὶ αὔριον τελευτήσει — «сегодня царь, а завтра умрёт» (τελευτάω). Слав. 10:11–12 делят стих; здесь обе половины."
  11: "ἐν γὰρ τῷ ἀποθανεῖν ἄνθρωπον — «ибо когда умрёт человек»; κληρονομήσει — «наследует» (κληρονομέω); ἑρπετά — пресмыкающиеся (ἑρπετόν); θηρία — звери; σκώληκας — черви (σκώληξ)."
  12: "ἀρχὴ ὑπερηφανίας — «начало гордости»; ἀφίστασθαι ἀπὸ κυρίου — «отступать от Господа» (ἀφίστημι); ἀπὸ τοῦ ποιήσαντος αὐτόν — «от Сотворившего его»; ἀπέστη ἡ καρδία — «отступило сердце»."
  13: "ἀρχὴ ὑπερηφανίας ἁμαρτία — «начало гордости — грех»; ὁ κρατῶν αὐτῆς — «одержимый ею, держащий её» (κρατέω); ἐξομβρήσει βδέλυγμα — «изрыгнет мерзость» (ἐξομβρέω, βδέλυγμα); παρεδόξασεν — «сделал странным, поразительным» (παραδοξάζω); слав. «обезслави… в наведениих зол» — «обесчестил в наведениях зол», по паритету взято csl, поэтому 辱め; ἐπαγωγάς — «наведения, кары» (ἐπαγωγή); κατέστρεψεν εἰς τέλος — «ниспроверг до конца» (καταστρέφω). Слав. 10:15–16 делят стих; здесь обе половины."
  14: "θρόνους ἀρχόντων καθεῖλεν — «престолы начальствующих низверг» (καθαιρέω); ἐκάθισεν πραεῖς ἀντ᾽ αὐτῶν — «посадил кротких вместо них» (πραΰς)."
  15: "ῥίζας ἐθνῶν ἐξέτιλεν — «корни народов исторг» (ἐκτίλλω); ἐφύτευσεν ταπεινούς — «насадил смиренных» (φυτεύω). Слав. добавляет «гордых» — «корения языков гордых»; в LXX этого слова нет, но по паритету оно внесено в текст."
  16: "χώρας ἐθνῶν κατέστρεψεν — «страны народов ниспроверг» (χώρα); ἕως θεμελίων γῆς — «до оснований земли» (θεμέλιος)."
  17: "ἐξῆρεν ἐξ αὐτῶν — «убрал из среды их» (ἐξαίρω); κατέπαυσεν ἀπὸ γῆς τὸ μνημόσυνον αὐτῶν — «прекратил на земле память их» (καταπαύω, μνημόσυνον)."
  18: "οὐκ ἔκτισται ἀνθρώποις ὑπερηφανία — «не создана людям гордость» (κτίζω); ὀργὴ θυμοῦ — «ярость гнева»; γεννήμασιν γυναικῶν — «рождающимся от жён» (γέννημα)."
  19: "σπέρμα ἔντιμον — «семя почтенное, честное» (ἔντιμος); σπέρμα ἀνθρώπου — «семя человеческое»; οἱ φοβούμενοι τὸν κύριον — «боящиеся Господа»; σπέρμα ἄτιμον — «семя бесчестное» (ἄτιμος); οἱ παραβαίνοντες ἐντολάς — «преступающие заповеди» (παραβαίνω). Четыре риторических вопроса с анафорой; в gr это один стих, csl 10:22–23 делит его на два. В csl эта пара стихов — 10:22–23; из-за делений ранее csl 10:19 = гр. 10:16, так что к этому месту csl идёт на три номера впереди."
  20: "ἐν μέσῳ ἀδελφῶν — «среди братьев»; ὁ ἡγούμενος αὐτῶν — «ведущий их»; ἔντιμος — «почтенный»; ἐν ὀφθαλμοῖς αὐτοῦ — «в очах его», т. е. Бога. Соответствует csl 10:24."
  21: "В gr-lxx-byz стих стоит как `.`: модуль оставил пустой номер после того, как гр. 10:19 вобрал в себя обе пары «семя честное» и «семя бесчестное», а гр. 10:20 стало «среди братьев». По указанию брифа стих переведён по csl 10:21: «Не создана бысть человеком гордыня, ни гнев ярости рождением жен». По содержанию это тот же текст, что гр. 10:18 (csl нумерует главу иначе: csl 10:21 = гр. 10:18), поэтому стих неизбежно повторяет 10:18; повтор вызван дефектом нумерации модуля, а не переводом. 〔…〕 не ставится."
  22: "πλούσιος καὶ ἔνδοξος καὶ πτωχός — «богатый, и славный, и бедный»; τὸ καύχημα αὐτῶν — «похвала их» (καύχημα); φόβος κυρίου — «страх Господень». Соответствует csl 10:25."
  23: "οὐ δίκαιον ἀτιμάσαι πτωχὸν συνετόν — «неправедно бесчестить бедного разумного» (ἀτιμάζω); οὐ καθῆκει — «не подобает» (καθήκει); δοξάσαι ἄνδρα ἁμαρτωλόν — «прославить мужа грешного»."
  24: "μεγιστάν — «вельможа, великий»; κριτής — судья; δυνάστης — властелин; δοξασθήσεται — «будет прославлен»; οὐκ ἔστιν αὐτῶν τις μείζων — «нет из них никого больше»; τοῦ φοβουμένου τὸν κύριον — «боящегося Господа»."
  25: "οἰκέτῃ σοφῷ — «слуге мудрому»; ἐλεύθεροι λειτουργήσουσιν — «свободные будут служить» (λειτουργέω); ἀνὴρ ἐπιστήμων — «муж сведущий, разумный» (ἐπιστήμων); οὐ γογγύσει — «не возропщет» (γογγύζω); слав. добавляет «наказуемь» — «будучи наставляем»; в LXX этого слова нет, но по паритету оно внесено в текст, поэтому 教えられても."
  26: "μὴ σοφίζου ποιῆσαι τὸ ἔργον σου — «не мудрствуй, делая дело твоё» (σοφίζομαι); μὴ δοξάζου — «не прославляй себя»; ἐν καιρῷ στενοχωρίας σου — «во время тесноты, нужды твоей» (στενοχωρία)."
  27: "κρείσσων — «лучше» (κρείσσων); ἐργαζόμενος καὶ περισσεύων ἐν πᾶσιν — «работающий и изобилующий во всём» (περισσεύω); περιπατῶν δοξαζόμενος — «ходящий прославляемый»; ἀπορῶν ἄρτων — «нуждающийся в хлебах» (ἀπορέω)."
  28: "τέκνον — «чадо»; ἐν πραΰτητι — «в кротости» (πραΰτης); δόξασον τὴν ψυχήν σου — «прославь душу твою»; κατὰ τὴν ἀξίαν αὐτῆς — «по достоинству её» (ἀξία)."
  29: "τὸν ἁμαρτάνοντα εἰς τὴν ψυχὴν αὐτοῦ — «согрешающего против души своей»; τίς δικαιώσει — «кто оправдает» (δικαιόω); ἀτιμάζοντα τὴν ζωὴν αὐτοῦ — «бесчестящего жизнь свою» (ἀτιμάζω)."
  30: "πτωχὸς δοξάζεται δι᾽ ἐπιστήμην αὐτοῦ — «бедный прославляется за знание своё» (ἐπιστήμη); πλούσιος διὰ τὸν πλοῦτον — «богатый за богатство». Антитеза сохранена."
  31: "ὁ δεδοξασμένος ἐν πτωχείᾳ — «прославленный в бедности» (πτωχεία); ποσαχῶς — «сколь кратно, насколько более»; ὁ ἄδοξος ἐν πλούτῳ — «бесславный в богатстве» (ἄδοξος); ἐν πτωχείᾳ — «в бедности». Двойной риторический вопрос без ответа."
