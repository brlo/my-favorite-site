# jp-box, Сирах, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: о правителях и их народе (1–5), о гневе и гордости (6–8),
# о тленности человека (9–11), начало гордости — отступление от Господа (12–13),
# Господь низлагает гордых и насаждает смиренных (14–18), о знатном семени
# и страхе Господнем (19–25), о труде, кротости и достоинстве (26–31).
# Прямой речи нет; всё — авторское поучение, кавычек нет.
# Нумерация по gr: 31 стих. В gr 10:21 стоит `.` (дефект модуля). Слав. 34:
# csl 10:9–10 делят гр. 10:9; csl 10:11–12 делят гр. 10:10; csl 10:15–16 делят
# гр. 10:13; csl 10:22–23 делят гр. 10:19 (в гр. 10:19 слиты обе пары
# «семя честное» и «семя бесчестное»). Из-за этого csl 10:24 = гр. 10:20,
# csl 10:25 = гр. 10:22; csl 10:21 по номеру соответствует гр. 10:18.
# Дефект gr 10:21: модуль оставил пустой стих после слияния гр. 10:19–20;
# по указанию брифа стих переведён по csl 10:21, поэтому по содержанию он
# повторяет гр. 10:18 (см. notes). 〔…〕 не ставится.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имён в главе нет.

