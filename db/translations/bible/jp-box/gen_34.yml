# База: Септуагинта (gr-lxx-byz); контроль — csl-ru и ru. jp-joc для Быт 34 отсутствует.
# Язык — современный 常体, порядок членов — по греческому.
# Глава 34: Дина и Сихем (1–4), молчание Иакова и приход Еммора (5–6), негодование сыновей
# и сватовство (7–12), обман с обрезанием (13–24), избиение Сихема (25–29), упрёк Иакова и ответ
# сыновей (30–31).
# Насилие над Диной и месть Симеона и Левия не смягчаются: передано так же прямо, как в LXX.
