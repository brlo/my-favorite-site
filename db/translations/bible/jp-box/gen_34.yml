verses:
  1: "レアがヤコブに産[う]んだ娘[むすめ]ディナは、その地[ち]の女[おんな]たちを見[み]に行[い]こうとして出[で]かけた。"
  2: "この地[ち]の君[きみ]であるハモルの子[こ]シケムは彼女[かのじょ]を見[み]、彼女[かのじょ]を取[と]って共[とも]に寝[ね]、彼女[かのじょ]を恥[はじ]ずかしめた。"
  3: "彼[かれ]の心[こころ]はヤコブの娘[むすめ]ディナに引[ひ]き寄[よ]せられ、その娘[むすめ]を愛[あい]し、娘[むすめ]の心[こころ]に沿[そ]って彼女[かのじょ]に語[かた]りかけた。"
  4: "シケムは父[ちち]ハモルに言[い]った。「この娘[むすめ]をわたしの妻[つま]に娶[めと]ってください。」"
  5: "ヤコブは、ハモルの子[こ]が自分[じぶん]の娘[むすめ]ディナを汚[けが]したことを聞[き]いた。息子[むすこ]たちは家畜[かちく]とともに野[の]にいたので、ヤコブは彼[かれ]らが帰[かえ]って来[く]るまで黙[だま]っていた。"
  6: "シケムの父[ちち]ハモルは、ヤコブと話[はな]すために彼[かれ]のもとへ出[で]て来[き]た。"
  7: "ヤコブの息子[むすこ]たちは野[の]から帰[かえ]って来[き]た。彼[かれ]らはそれを聞[き]くと、男[おとこ]たちは胸[むね]を刺[さ]され、非常[ひじょう]に悲[かな]しんだ。イスラエルのうちで恥[はじ]ずべきことが行[おこな]われたからである。ヤコブの娘[むすめ]と寝[ね]たのだ。そのようなことはあってはならない。"
  8: "ハモルは彼[かれ]らに語[かた]って言[い]った。「わたしの息子[むすこ]シケムは、あなたがたの娘[むすめ]を心[こころ]に選[えら]んだ。どうか、彼女[かのじょ]を彼[かれ]の妻[つま]として与[あた]えてください。"
  9: "わたしたちと縁組[えんぐみ]をしてください。あなたがたの娘[むすめ]をわたしたちに与[あた]え、わたしたちの娘[むすめ]をあなたがたの息子[むすこ]たちに娶[めと]らせてください。"
  10: "わたしたちの間[あいだ]に住[す]んでください。見[み]よ、この地[ち]はあなたがたの前[まえ]に広[ひろ]びろとしている。住[す]んで、この地[ち]で商[あきな]いをし、ここに所領[しょりょう]を得[え]てください。」"
  11: "シケムは彼女[かのじょ]の父[ちち]と兄[あに]たちに言[い]った。「どうか、わたしがあなたがたの前[まえ]に{恵[めぐ]み|恩寵[おんちょう]}を見[み]いだせるように。あなたがたが言[い]うことは何[なん]でも与[あた]えましょう。"
  12: "花嫁[はなよめ]の代[しろ]金[がね]をいくらでも高[たか]くしてください。あなたがたが言[い]うとおりに与[あた]える。ただ、この娘[むすめ]をわたしの妻[つま]として与[あた]えてください。」"
  13: "ヤコブの息子[むすこ]たちは、シケムとその父[ちち]ハモルに、欺[あざむ]きをもって答[こた]えた。彼[かれ]らが自分[じぶん]たちの妹[いもうと]ディナを汚[けが]したからである。"
  14: "ディナの兄[あに]たち、レアの息子[むすこ]であるシメオンとレビが彼[かれ]らに言[い]った。「わたしたちはこのことはできない。無割礼[むかつれい]の者[もの]に妹[いもうと]を嫁[とつ]がせることは。それはわたしたちにとって恥[はじ]だからだ。"
  15: "ただ、あなたがたがわたしたちのようになり、あなたがたの男[おとこ]がみな割礼[かつれい]を受[う]けるなら、わたしたちはあなたがたに同[おな]じようになり、あなたがたの間[あいだ]に住[す]もう。"
  16: "わたしたちの娘[むすめ]をあなたがたに与[あた]え、あなたがたの娘[むすめ]をわたしたちの妻[つま]に娶[めと]り、あなたがたの間[あいだ]に住[す]んで、一[ひと]つの民[たみ]のようになろう。"
  17: "もしあなたがたが割礼[かつれい]を受[う]けることに聞[き]き従[したが]わなければ、わたしたちは娘[むすめ]を連[つ]れて去[さ]る。」"
  18: "この言葉[ことば]はハモルと、その子[こ]シケムの前[まえ]で気[き]に入[い]った。"
  19: "若者[わかもの]はこのことを行[おこな]うのにためらわなかった。ヤコブの娘[むすめ]に心[こころ]を奪[うば]われていたからである。彼[かれ]は父[ちち]の家[いえ]のすべての者[もの]のうちで最も尊[とうと]ばれていた。"
  20: "ハモルとその子[こ]シケムは自分[じぶん]たちの町[まち]の門[もん]へ行[い]き、町[まち]の人々[ひとびと]に語[かた]って言[い]った。"
  21: "「この人々[ひとびと]はわたしたちと平和[へいわ]に暮[く]らしている。この地[ち]に住[す]ませ、この地[ち]で商[あきな]いをさせよう。見[み]よ、この地[ち]は彼[かれ]らの前[まえ]に広[ひろ]びろとしている。彼[かれ]らの娘[むすめ]をわたしたちの妻[つま]に娶[めと]り、わたしたちの娘[むすめ]を彼[かれ]らに与[あた]えよう。"
  22: "ただ、彼[かれ]らがわたしたちとともに住[す]み、一[ひと]つの民[たみ]となるためには、わたしたちの男[おとこ]がみな、彼[かれ]らが割礼[かつれい]を受[う]けているように、割礼[かつれい]を受[う]けなければならない。"
  23: "彼[かれ]らの家畜[かちく]も、財産[ざいさん]も、四足[しそく]のものも、わたしたちのものになるのではないか。ただ、このことで彼[かれ]らに同[おな]じようになれば、彼[かれ]らはわたしたちとともに住[す]むだろう。」"
  24: "町[まち]の門[もん]を出入[でい]りする者[もの]はみな、ハモルとその子[こ]シケムに聞[き]き従[したが]い、男[おとこ]はみな、その包皮[ほうひ]の肉[にく]に割礼[かつれい]を施[ほどこ]した。"
  25: "三日目[みっかめ]、彼[かれ]らが痛[いた]みのうちにあったとき、ヤコブの二人[ふたり]の息子[むすこ]、ディナの兄[あに]であるシメオンとレビは、それぞれ自分[じぶん]の剣[けん]を取[と]り、恐[おそ]れることなく町[まち]に入[はい]って、男[おとこ]をみな殺[ころ]した。"
  26: "ハモルとその子[こ]シケムを剣[けん]の刃[は]にかけて殺[ころ]し、シケムの家[いえ]からディナを連[つ]れ出[だ]して、去[さ]った。"
  27: "ヤコブの息子[むすこ]たちは、殺[ころ]された者[もの]たちのところに入[はい]り、自分[じぶん]たちの妹[いもうと]ディナを汚[けが]した町[まち]を略奪[りゃくだつ]した。"
  28: "彼[かれ]らの羊[ひつじ]、牛[うし]、ろば、町[まち]にあったものも野[の]にあったものも、みな取[と]った。"
  29: "彼[かれ]らの人[ひと]をみな、その財[ざい]も、妻[つま]たちも捕[と]らえ、町[まち]にあったもの、家[いえ]にあったものをみな略奪[りゃくだつ]した。"
  30: "ヤコブはシメオンとレビに言[い]った。「あなたがたはわたしを憎[にく]まれる者[もの]とし、この地[ち]に住[す]むすべての者[もの]、カナン人[じん]にもペリジ人[じん]にも、わたしを悪[わる]し者[もの]とした。わたしは数[かず]が少[すく]ない。彼[かれ]らが集[あつ]まってわたしを襲[おそ]えば、わたしも、わたしの家[いえ]も、滅[ほろ]ぼされてしまう。」"
  31: "彼[かれ]らは言[い]った。「わたしたちの妹[いもうと]を遊女[ゆうじょ]のように扱[あつか]うというのか。」"

notes:
  1: "Ἐξῆλθεν — 出かけた (ἐξέρχομαι). θυγάτηρ Λείας, ἣν ἔτεκεν τῷ Ιακωβ — レアがヤコブに産んだ娘 (τίκτω — «рожать»; дат. τῷ Ιακωβ — «Иакову»). καταμαθεῖν — 見に行こうとして (καταμανθάνω — «рассматривать, разузнавать»). τῶν ἐγχωρίων — その地の (ἐγχώριος — «местный, житель той земли»)."
  2: "Συχεμ ὁ υἱὸς Εμμωρ — ハモルの子シケム (LXX Ἐμμώρ; принятая форма имени — ハモル). ὁ Χορραῖος — この地の君 (χορραῖος — «хорреянин»; в масоретском тексте «евеянин», поэтому в ru «Евеянин»; держимся греческого). λαβὼν αὐτὴν ἐκοιμήθη μετ᾽ αὐτῆς — 彼女を取って共に寝 (κοιμάομαι μετά — библейский оборот «спать с»). ἐταπείνωσεν αὐτήν — 彼女を辱めた (ταπεινόω — «унижать, смирять»; эвфемизм насилия, ср. ст. 7 «бесчестие»; не смягчаем)."
  3: "προσέσχεν τῇ ψυχῇ — 心は…に引き寄せられ (προσέχω — «прилепляться, внимать»). ἠγάπησεν τὴν παρθένον — その娘を愛し (παρθένος — «девица»). ἐλάλησεν κατὰ τὴν διάνοιαν τῆς παρθένου — 娘の心に沿って語りかけた (διάνοια — «мысль, расположение»; т. е. говорил то, что ей по сердцу)."
  4: "Λαβέ μοι τὴν παιδίσκην ταύτην εἰς γυναῖκα — この娘をわたしの妻に娶ってください (παιδίσκη здесь «девица, девушка»)."
  5: "ἐμίανεν — 汚した (μιαίνω — «осквернять»). ἦσαν μετὰ τῶν κτηνῶν — 家畜とともにいた. παρεσιώπησεν — 黙っていた (παρασιωπάω — «промолчать»). ἕως τοῦ ἐλθεῖν αὐτούς — 彼らが帰って来るまで."
  6: "ἐξῆλθεν… πρὸς Ιακωβ λαλῆσαι αὐτῷ — ヤコブと話すために彼のもとへ出て来た."
  7: "κατενύχθησαν — 胸を刺され (κατανύσσομαι — «быть пронзённым, уязвлённым»). λυπηρὸν ἦν αὐτοῖς σφόδρα — 非常に悲しんだ (λυπηρός — «прискорбный»). ἄσχημον ἐποίησεν ἐν Ισραηλ — イスラエルのうちで恥ずべきことを行った (ἄσχημων — «постыдный, непристойный»; «в Израиле» — формула о преступлении против народа Божия). καὶ οὐχ οὕτως ἔσται — そのようなことはあってはならない (букв. «и так не будет»)."
  8: "προείλατο τῇ ψυχῇ — 心に選んだ (προαιρέομαι — «предпочитать, избирать»). δότε οὖν αὐτὴν αὐτῷ γυναῖκα — 彼女を彼の妻として与えてください."
  9: "ἐπιγαμβρεύσασθε ἡμῖν — 姻戚関係を結んでください (ἐπιγαμβρεύω — «вступать в родство через брак»). τὰς θυγατέρας ὑμῶν δότε ἡμῖν — あなたがたの娘をわたしたちに与え."
  10: "ἐν ἡμῖν κατοικεῖτε — わたしたちの間に住んでください. ἡ γῆ ἰδοὺ πλατεῖα ἐναντίον ὑμῶν — 見よ、この地はあなたがたの前に広びろとしている (πλατύς — «широкий»). ἐμπορεύεσθε — 商いをし (ἐμπορεύομαι — «торговать»). ἐγκτήσασθε ἐν αὐτῇ — ここに所領を得てください (ἐγκτάομαι — «приобретать владение»)."
  11: "Εὕροιμι χάριν ἐναντίον ὑμῶν — わたしがあなたがたの前に恵みを見いだせますように (оптатив). ὃ ἐὰν εἴπητε, δώσομεν — あなたがたが言うことは何でも与えましょう (1 л. мн. ч., как в LXX; в ru «я дам»)."
  12: "πληθύνατε τὴν φερνὴν σφόδρα — 花嫁の代金をいくらでも高くしてください (φερνή — «вено, брачный выкуп»; πληθύνω — «умножать»). δώσετέ μοι τὴν παῖδα ταύτην εἰς γυναῖκα — この娘をわたしの妻として与えてください."
  13: "μετὰ δόλου — 欺きをもって (δόλος — «коварство, обман»). ὅτι ἐμίαναν Διναν τὴν ἀδελφὴν αὐτῶν — 彼らが自分たちの妹ディナを汚したからである (причина стоит после, как в греческом)."
  14: "Συμεων καὶ Λευι οἱ ἀδελφοὶ Δινας υἱοὶ δὲ Λείας — ディナの兄たち、レアの息子であるシメオンとレビ (ἀδελφοί здесь «братья», т. е. старшие). ἀκροβυστία — 無割礼 (букв. «крайняя плоть»; ὃς ἔχει ἀκροβυστίαν — «необрезанный»). ὄνειδος — 恥辱."
  15: "ἐν τούτῳ ὁμοιωθησόμεθα ὑμῖν — あなたがたに同じようになり (ὁμοιόω — «уподоблять»). ἐν τῷ περιτμηθῆναι ὑμῶν πᾶν ἀρσενικόν — あなたがたの男がみな割礼を受けるなら (περιτέμνω — «обрезать»; ἀρσενικός — «мужской пол»)."
  16: "γένος ἕν — 一つの民 (γένος — «род, племя»)."
  17: "εἰσακούσητε — 聞き従わなければ (εἰσακούω — «слушать, повиноваться»). λαβόντες τὰς θυγατέρας ἡμῶν ἀπελευσόμεθα — 娘を連れて去る (в csl ед. ч. «дщерь нашу»; в греч. мн. ч.)."
  18: "ἤρεσαν οἱ λόγοι ἐναντίον Εμμωρ — この言葉は…の前で気に入った (ἀρέσκω — «нравиться»)."
  19: "οὐκ ἐχρόνισεν ὁ νεανίσκος — 若者は…ためらわなかった (χρονίζω — «медлить»). ἐνέκειτο γὰρ τῇ θυγατρὶ Ιακωβ — ヤコブの娘に心を奪われていた (ἔγκειμαι — «лежать на, быть привязанным»). ἐνδοξότατος — 最も尊ばれていた (ἔνδοξος — «славный, почётный»)."
  20: "πρὸς τὴν πύλην τῆς πόλεως — 町の門へ (πύλη — «ворота»; у ворот решались дела города)."
  21: "εἰρηνικοί — 平和に暮らしている (εἰρηνικός — «мирный»). οἰκείτωσαν… ἐμπορευέσθωσαν — 住ませ、商いをさせよう (императивы 3 л.)."
  22: "ὥστε εἶναι λαὸν ἕνα — 一つの民となるために. καθὰ καὶ αὐτοὶ περιτέτμηνται — 彼らが割礼を受けているように (καθά — «как, подобно»)."
  23: "τὰ κτήνη… τὰ ὑπάρχοντα… τὰ τετράποδα — 家畜、財産、四足のもの (ὑπάρχοντα — «имущество»; τετράπους — «четвероногое»). οὐχ ἡμῶν ἔσται; — わたしたちのものになるのではないか (риторический вопрос)."
  24: "πάντες οἱ ἐκπορευόμενοι τὴν πύλην — 門を出入りする者はみな (ἐκπορεύομαι — «выходить»). περιετέμοντο τὴν σάρκα τῆς ἀκροβυστίας αὐτῶν — その包皮の肉に割礼を施した (букв. «обрезали плоть крайней плоти своей»). πᾶς ἄρσην — 男はみな."
  25: "ἐν τῇ ἡμέρᾳ τῇ τρίτῃ — 三日目 (третий день — самый болезненный после обрезания). ὅτε ἦσαν ἐν τῷ πόνῳ — 彼らが痛みのうちにあったとき (πόνος — «боль, страдание»). ἕκαστος τὴν μάχαιραν αὐτοῦ — それぞれ自分の剣を. εἰσῆλθον εἰς τὴν πόλιν ἀσφαλῶς — 恐れることなく町に入り (ἀσφαλῶς — «безопасно, безнаказанно»). ἀπέκτειναν πᾶν ἀρσενικόν — 男をみな殺した."
  26: "ἐν στόματι μαχαίρας — 剣の刃にかけて (букв. «устами меча»). ἔλαβον τὴν Διναν ἐκ τοῦ οἴκου τοῦ Συχεμ — シケムの家からディナを連れ出した."
  27: "ἐπὶ τοὺς τραυματίας — 殺された者たちのところに (τραυματίας — «раненый, убитый»). διήρπασαν τὴν πόλιν — 町を略奪した (διαρπάζω — «разграблять»). ἐν ᾗ ἐμίαναν — 汚した町 (ᾗ — «в которой»)."
  28: "ὅσα τε ἦν ἐν τῇ πόλει καὶ ὅσα ἦν ἐν τῷ πεδίῳ — 町にあったものも野にあったものも."
  29: "πάντα τὰ σώματα αὐτῶν — 彼らの人をみな (σῶμα здесь «человек, челядь»; слав. «чада» — по евр. «дети»; переводим греч.). ἀποσκευή — 財 (σκεῦος, «утварь, имущество»). ᾐχμαλώτευσαν — 捕り虜にし (αἰχμαλωτεύω — «брать в плен»)."
  30: "Μισητόν με πεποιήκατε — わたしを憎まれる者とした (μισητός — «ненавистный»). ὥστε πονηρόν με εἶναι — わたしを悪し者とした (πονηρός — «дурной, злой» в глазах людей). Χαναναίοις καὶ Φερεζαίοις — カナン人にもペリジ人にも. ὀλιγοστός εἰμι ἐν ἀριθμῷ — わたしは数が少ない (ὀλιγοστός — «малочисленный»). συγκόψουσίν με — わたしを襲えば (συγκόπτω — «изрубить, перебить»). ἐκτριβήσομαι — 滅ぼされてしまう (ἐκτρίβω — «истреблять»)."
  31: "Ἀλλ᾽ ὡσεὶ πόρνῃ χρήσωνται τῇ ἀδελφῇ ἡμῶν; — わたしたちの妹を遊女のように扱うというのか (χράομαι — «обходиться, поступать с»; πόρνη — «блудница»; вопрос-негодование)."
