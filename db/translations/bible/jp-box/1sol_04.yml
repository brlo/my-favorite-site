# jp-box, 1-е Послание к Солунянам, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: ходить достойно и ещё более (1–2), воля Божия — святость (3–8),
# братолюбие, тихая жизнь и труд (9–12), умершие и воскресение (13–14),
# слово Господне: встреча Господа на воздухе (15–17), утешение (18).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: [καὶ] (4:8) и [τοὺς] (4:10) стоят в базе в квадратных скобках,
# слова в базе есть, поэтому не оборачиваются (проверено запросом к gr-lxx-byz).
# Цитат Писания нет. Слово Господне (4:15б–17) — вложенная речь, поэтому 『…』.
# Сносок ⟨…⟩ нет: 携え上げ explained самим стихом, 復活 и 来臨 уже в корпусе. jp-ni не использовался.
# 4:13–18 не сглажены: 眠りについた者 (об умерших), 号令, 大天使の声, 神のラッパ, 空中.

tr_code: jp-box
book: 1sol
chapter: 4
draft: true

verses:
  1: "そこで、兄弟[きょうだい]たちよ、終[お]わりに、わたしたちは主[しゅ]イエスにあって、あなたがたに求[もと]め、また勧[すす]める。あなたがたは、わたしたちから、どのように歩[あゆ]み、神[かみ]に喜[よろこ]ばれるべきかをすでに受[う]け取[と]り、実際[じっさい]にそう歩[あゆ]んでいるのだから、ますます豊[ゆた]かになるように。"
  2: "というのは、あなたがたは、わたしたちが主[しゅ]イエスによってあなたがたに与[あた]えたどんな戒[いまし]めを知[し]っているからである。"
  3: "というのは、神[かみ]の御心[みこころ]とは、あなたがたが聖[せい]なること、すなわち、淫行[いんこう]を避[さ]けることだからである。"
  4: "すなわち、あなたがた一人[ひとり]一人[ひとり]が、聖[せい]さと尊[とうと]さのうちに、自分[じぶん]の器[うつわ]をどのように持[も]つべきかを知[し]るためであり、"
  5: "情欲[じょうよく]の欲[よく]にかられてではなく、神[かみ]を知[し]らない異邦人[いほうじん]たちのようではなく、"
  6: "この事[こと]において、兄弟[きょうだい]を踏[ふ]み越[こ]えて利[り]を貪[むさぼ]ることのないためである。主[しゅ]は、これらのすべてのことについて報[むく]いをされる方[かた]だからである。わたしたちが前[まえ]にあなたがたに言[い]い、また証[あかし]したとおりである。"
  7: "というのは、神[かみ]がわたしたちを召[め]されたのは、汚[けが]れのためではなく、聖[せい]さのためだからである。"
  8: "それゆえ、これを拒[こば]む者[もの]は、人[ひと]を拒むのではなく、あなたがたにご自分[じぶん]の{聖霊[せいれい]|聖神[せいしん]}を与[あた]えておられる神[かみ]を拒むのである。"
  9: "兄弟[きょうだい]の愛[あい]については、あなたがたに書[か]き送[おく]る必要[ひつよう]はない。あなたがた自身[じしん]が、互[たが]いに愛[あい]し合[あ]うことを神[かみ]に教[おし]えられた者[もの]だからである。"
  10: "というのは、あなたがたは、マケドニア全[ぜん]体[たい]にいるすべての兄弟[きょうだい]たちに、そのことを行[おこな]っているからである。兄弟[きょうだい]たちよ、わたしたちはあなたがたに、ますます豊[ゆた]かになるよう勧[すす]める。"
  11: "また、静[しず]かに暮[く]らし、自分[じぶん]のことを行[おこな]い、わたしたちがあなたがたに命[めい]じたとおり、自分[じぶん]の手[て]で働[はたら]くことに志[こころざ]すべきである。"
  12: "それは、あなたがたが外[そと]の人[ひと]たちに対[たい]して立派[りっぱ]に歩[あゆ]み、だれの助[たす]けも必要[ひつよう]としないためである。"
  13: "兄弟[きょうだい]たちよ、わたしたちは、眠[ねむ]りについた者[もの]たちについて、あなたがたに知[し]らないでいてほしくはない。あなたがたが、希望[きぼう]を持[も]たないほかの者[もの]たちのように悲[かな]しまないためである。"
  14: "というのは、もしわたしたちが、イエスが死[し]んで復活[ふっかつ]されたと信[しん]じているなら、同じように、神[かみ]は、イエスによって眠[ねむ]りについた者[もの]たちをも、イエスとともに連[つ]れて来[こ]られるからである。"
  15: "というのは、わたしたちは主[しゅ]の御言葉[みことば]によってあなたがたにこう言[い]うからである。『主[しゅ]の来臨[らいりん]まで生[い]き残[のこ]るわたしたちは、眠[ねむ]りについた者[もの]たちに決[けっ]して先[さき]だつことはない。"
  16: "というのは、主[しゅ]ご自身[じしん]が、号令[ごうれい]と、大天使[だいてんし]の声[こえ]と、神[かみ]のラッパとともに、天[てん]から降[くだ]って来[こ]られ、キリストにある死者[ししゃ]がまず復活[ふっかつ]するからである。"
  17: "その後[そののち]、生[い]き残[のこ]っているわたしたちは、彼[かれ]らとともに雲[くも]のうちに携[けい]え上[あ]げられて、空中[くうちゅう]で主[しゅ]を迎[むか]える。そして、こうして、わたしたちはいつも主とともにいることになる。』"
  18: "だから、これらの言葉[ことば]をもって互[たが]いに慰[なぐさ]め合[あ]いなさい。"

notes:
  1: "Λοιπὸν οὖν — そこで、終わりに. ἐρωτῶμεν…καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ — 主イエスにあって求め、また勧める. καθὼς παρελάβετε…τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ — どのように歩み、神に喜ばれるべきか. ἵνα περισσεύητε μᾶλλον — ますます豊かになるように (просьба передана ように)."
  2: "παραγγελίαι — 戒め. διὰ τοῦ κυρίου Ἰησοῦ — 主イエスによって. γάρ передан というのは…からである."
  3: "θέλημα τοῦ θεοῦ — 神の御心. ἁγιασμός — 聖なること. πορνεία — 淫行. ἀπέχεσθαι — 避ける."
  4: "σκεῦος — 器 (тело; ср. 2 Кор 4:7); κτᾶσθαι — 持つ. εἰδέναι с инфинитивом — どのように…べきかを知る. ἐν ἁγιασμῷ καὶ τιμῇ — 聖さと尊さのうちに."
  5: "ἐν πάθει ἐπιθυμίας — 情欲の欲にかられて. τὰ ἔθνη τὰ μὴ εἰδότα τὸν θεόν — 神を知らない異邦人たち. Стих продолжает инфинитив 4-го."
  6: "ὑπερβαίνειν καὶ πλεονεκτεῖν — 踏み越えて利を貪る. ἐν τῷ πράγματι — この事において. ἔκδικος κύριος — 報いをされる方. προείπαμεν…καὶ διεμαρτυράμεθα — 前に言い、また証した."
  7: "ἐπὶ ἀκαθαρσίᾳ — 汚れのため. ἐν ἁγιασμῷ — 聖さのため."
  8: "ὁ ἀθετῶν — 拒む者. τὸν [καὶ] διδόντα — 与えておられる; [καὶ] в базе есть, 〔…〕 не ставятся. τὸ πνεῦμα αὐτοῦ τὸ ἅγιον — ご自分の聖霊."
  9: "φιλαδελφία — 兄弟の愛. θεοδίδακτοι — 神に教えられた者. εἰς τὸ ἀγαπᾶν ἀλλήλους — 互いに愛し合うこと."
  10: "καὶ γὰρ ποιεῖτε — そのことを行っている. [τοὺς] ἐν ὅλῃ τῇ Μακεδονίᾳ — マケドニア全体にいる; [τοὺς] в базе есть. περισσεύειν μᾶλλον — ますます豊かに."
  11: "φιλοτιμεῖσθαι — 志すべきである (букв. «считать честью»). ἡσυχάζειν — 静かに暮らす. πράσσειν τὰ ἴδια — 自分のことを行う. ἐργάζεσθαι ταῖς χερσίν — 自分の手で働く."
  12: "εὐσχημόνως πρὸς τοὺς ἔξω — 外の人たちに対して立派に. μηδενὸς χρείαν ἔχητε — だれの助けも必要としない."
  13: "κοιμώμενοι — 眠りについた者たち (об умерших; метафора Павла сохранена). ἵνα μὴ λυπῆσθε — 悲しまないため. οἱ μὴ ἔχοντες ἐλπίδα — 希望を持たない者たち."
  14: "εἰ γὰρ πιστεύομεν — もし…信じているなら. ἀπέθανεν καὶ ἀνέστη — 死んで復活された. ἄξει σὺν αὐτῷ — イエスとともに連れて来られる; κοιμηθέντας διὰ τοῦ Ἰησοῦ — イエスによって眠りについた者たち."
  15: "ἐν λόγῳ κυρίου — 主の御言葉によって; слово Господне (15б–17) — 『…』. οἱ περιλειπόμενοι εἰς τὴν παρουσίαν — 来臨まで生き残る者. οὐ μὴ φθάσωμεν — 決して先だつことはない (усиленное отрицание сохранено)."
  16: "ἐν κελεύσματι — 号令. ἐν φωνῇ ἀρχαγγέλου — 大天使の声. ἐν σάλπιγγι θεοῦ — 神のラッパ. οἱ νεκροὶ ἐν Χριστῷ — キリストにある死者. πρῶτον — まず."
  17: "ἁρπαγησόμεθα — 携え上げられる (ἁρπάζω; ср. Деян 8:39). ἐν νεφέλαις — 雲のうちに. εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα — 空中で主を迎える. πάντοτε σὺν κυρίῳ ἐσόμεθα — いつも主とともにいることになる."
  18: "ὥστε — だから. παρακαλεῖτε ἀλλήλους — 互いに慰め合いなさい."
