# Псалом 52: безумец и развращение людей (1–3), гибель делающих беззаконие (4–5),
# молитва о спасении из Сиона (6). Ср. Пс 13 — почти тот же текст.
# Красного и синего нет. Кавычки: слова безумца в 1 — 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено tmp/bracket_check.rb).
# セラ в псалме нет.
# Сносок ⟨…⟩ нет: 陰府, シオン, ヤコブ, イスラエル уже в корпусе.
