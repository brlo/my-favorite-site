verses:
  0: "指揮者[しきしゃ]に。マエレトについて。ダビデの教[おし]え。"
  1: "愚[おろ]かな者[もの]は心[こころ]のうちに「神[かみ]などいない」と言[い]った。彼[かれ]らは堕落[だらく]し、不法[ふほう]のうちに忌[い]まわしい者[もの]となった。善[ぜん]を行[おこな]う者[もの]は一人[ひとり]もいない。"
  2: "神[かみ]は天[てん]から人[ひと]の子[こ]らをのぞき見[み]、悟[さと]る者[もの]、神[かみ]を求[もと]める者[もの]がいるかどうかを見[み]られた。"
  3: "すべての者[もの]が道[みち]を外[はず]れ、そろって無価値[むかち]な者[もの]となった。善[ぜん]を行[おこな]う者[もの]はなく、ただの一人[ひとり]もいない。"
  4: "不法[ふほう]を働[はたら]く者[もの]たちは、みな悟[さと]らないのか。パンを食[た]べるようにわたしの民[たみ]を食[た]べる者[もの]たちは、神[かみ]を呼[よ]び求[もと]めなかった。"
  5: "彼[かれ]らは、恐[おそ]れる理由[りゆう]もない所[ところ]で、激[はげ]しく恐[おそ]れる。神[かみ]は人[ひと]にこびる者[もの]の骨[ほね]を散[ち]らされたからである。彼[かれ]らは辱[はずかし]められた。神[かみ]が彼[かれ]らを退[しりぞ]けられたからである。"
  6: "だれがシオンからイスラエルの救[すく]いをもたらすのか。主[しゅ]がご自分[じぶん]の民[たみ]の捕囚[ほしゅう]を返[かえ]されるとき、ヤコブは喜[よろこ]び、イスラエルは楽[たの]しむ。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ μαελεθ· συνέσεως τῷ Δαυιδ — 指揮者に。マエレトについて。ダビデの教え (ὑπὲρ μαελεθ — «о Маелефе», в церковнослав. «о Маелефе»; по евр. «на Махалаф» — название напева, точное значение спорно, поэтому оставлено транслитерацией マエレト, без домысла; в Синодальном «на духовом орудии» — по евр. пониманию). Надписание — стих 0, скобками не маркируется."
  1: "Εἶπεν ἄφρων ἐν καρδίᾳ αὐτοῦ — 愚かな者は心のうちに…言った (ἄφρων — «безумный», как в Пс 13:1). Οὐκ ἔστιν θεός — 「神などいない」 (отрицание бытия Бога; など передаёт презрительный оттенок, ср. Пс 13:1). διεφθάρησαν καὶ ἐβδελύχθησαν ἐν ἀνομίαις — 彼らは堕落し、不法のうちに忌まわしい者となった (φθείρω — «растлевать»; βδελύσσομαι — «гнушаться»). οὐκ ἔστιν ποιῶν ἀγαθόν — 善を行う者は一人もいない (формула сохранена, ср. Рим 3:12)."
  2: "ὁ θεὸς ἐκ τοῦ οὐρανοῦ διέκυψεν — 神は天から…のぞき見 (διακύπτω — «выглядывать, приникать»). ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων — 人の子らを (υἱοὶ ἀνθρώπων — «сыны человеческие»). τοῦ ἰδεῖν εἰ ἔστιν συνίων ἢ ἐκζητῶν τὸν θεόν — 悟る者、神を求める者がいるかどうかを見られた (συνίημι — «разуметь»; ἐκζητέω — «искать»)."
  3: "πάντες ἐξέκλιναν — すべての者が道を外れ (ἐκκλίνω — «уклоняться»). ἅμα ἠχρεώθησαν — そろって無価値な者となった (ἀχρεόω — «делаться негодным»; ср. Рим 3:12 — формулировка выровнена с rim_03). οὐκ ἔστιν ἕως ἑνός — ただの一人もいない (ἕως ἑνός — «до одного»)."
  4: "οὐχὶ γνώσονται πάντες οἱ ἐργαζόμενοι τὴν ἀνομίαν — 不法を働く者たちは、みな悟らないのか (вопрос с οὐχί, ожидающий утверждения). οἱ ἔσθοντες τὸν λαόν μου βρώσει ἄρτου — パンを食べるようにわたしの民を食べる者たち (βρῶσις ἄρτου — «снедь хлеба», т. е. как хлеб едят народ). τὸν θεὸν οὐκ ἐπεκαλέσαντο — 神を呼び求めなかった (ἐπικαλέομαι — «призывать»)."
  5: "ἐκεῖ φοβηθήσονται φόβον, οὗ οὐκ ἦν φόβος — 彼らは、恐れる理由もない所で、激しく恐れる (гебраизм «убоялись страхом», где страха не было). ὁ θεὸς διεσκόρπισεν ὀστᾶ ἀνθρωπαρέσκων — 神は人にこびる者の骨を散らされた (διασκορπίζω — «рассеивать»; ἀνθρωπάρεσκος — «угождающий людям», слав. «человекоугодник»). κατῃσχύνθησαν — 彼らは辱められた. ὁ θεὸς ἐξουδένωσεν αὐτούς — 神が彼らを退けられた (ἐξουδενόω — «уничижать»)."
  6: "τίς δώσει ἐκ Σιων τὸ σωτήριον τοῦ Ισραηλ — だれがシオンからイスラエルの救いをもたらすのか (τίς δώσει — «кто даст», формула желания). ἐν τῷ ἐπιστρέψαι κύριον τὴν αἰχμαλωσίαν τοῦ λαοῦ αὐτοῦ — 主がご自分の民の捕囚を返されるとき (ἐπιστρέφω — «возвращать»; αἰχμαλωσία — «плен», здесь 捕囚). ἀγαλλιάσεται Ιακωβ καὶ εὐφρανθήσεται Ισραηλ — ヤコブは喜び、イスラエルは楽しむ (два имени и два глагола радости сохранены)."
