# jp-box, Захария, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 14 стихов).
# Граница внутри главы: слав. 12:13 включает «племя дома Нафанова», которое в gr стоит
# в конце 12:12; стих не дублируется, порядок слав. — в 13-м стихе Нафан, Левий, Симеон.
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 пророческое слово Господа об Израиле, Творец неба и земли; 2–3 Иерусалим —
# колеблемые преддверия и камень попираемый, все народы соберутся; 4–5 кони в ужасе,
# дом Иудин, князья; 6–9 жаровня и светильник, спасение шатров Иуды, слабый как Давид,
# истребление народов; 10 дух благодати и умиления, «воззрят на Того, Которого пронзили»,
# плач как о первенце; 11–14 плач Гададриммона, племена и жёны особо.
# Голоса: 1 формула; 2–14 слово Господа в 「…» (в 5 слова князей в 『…』).
# Термины: 万軍[ばんぐん]の主[しゅ] — κύριος παντοκράτωρ; 霊[れい] — πνεῦμα;
# 初[はつ]子[ご] — πρωτότοκος; 恵[めぐ]み — χάρις; 憐[あわ]れみ — οἰκτιρμός.
#
tr_code: jp-box
book: zah
chapter: 12
draft: true

verses:
  1: "イスラエルについての主[しゅ]の言葉[ことば]の重[おも]み。天[てん]を張[は]り、地[ち]の基[もとい]を据[す]え、人[ひと]の内[うち]に霊[れい]を造[つく]られた主[しゅ]は言[い]われる。"
  2: "「見[み]よ、わたしはエルサレムを、周[まわ]りのすべての民[たみ]にとって揺[ゆ]れ動[うご]く入口[いりぐち]とする。ユダにおいても、エルサレムに対する包囲[ほうい]が起[お]こる。"
  3: "その日[ひ]、わたしはエルサレムを、すべての民[たみ]に踏[ふ]みつけられる石[いし]とする。これに踏[ふ]みつかる者[もの]はみな、辱[はずかし]められて嘲[あざけ]られる。地[ち]のすべての民[たみ]が、これに逆[さか]らって集[あつ]まるからである。"
  4: "その日[ひ]、主[しゅ]は言[い]われる。わたしはすべての馬[うま]を恐[おそ]れで、その乗[の]り手[て]を狂[くる]いで打[う]つ。わたしはユダの家[いえ]に目[め]を開[ひら]き、民[たみ]のすべての馬[うま]を盲目[もうもく]で打[う]つ。"
  5: "ユダの千人[せんにん]の長[ちょう]たちは、心[こころ]のうちで言[い]う。『エルサレムの住[す]む者[もの]たちによって、わたしたちは、彼らの神[かみ]である万軍[ばんぐん]の主[しゅ]のうちに力[ちから]を見[み]いだす』と。"
  6: "その日[ひ]、わたしはユダの千人[せんにん]の長[ちょう]たちを、薪[まき]の間[あいだ]の火[ひ]の鉢[はち]のように、麦束[むぎたば]の間[あいだ]の燃[も]える灯[ともしび]のようにする。彼らは周[まわ]りのすべての民[たみ]を、右[みぎ]も左[ひだり]も食[く]らい尽[つ]くす。エルサレムは再[ふたた]び、その場所[ばしょ]で、エルサレムで住[す]まれる。"
  7: "主[しゅ]はまず、昔[むかし]のようにユダの天幕[てんまく]を救[すく]われる。ダビデの家[いえ]の誇[ほこ]りと、エルサレムに住[す]む者[もの]たちの高[たか]ぶりが、ユダに勝[まさ]らないためである。"
  8: "その日[ひ]、主[しゅ]はエルサレムに住[す]む者[もの]たちを守[まも]られる。その日[ひ]、彼らのうちの弱[よわ]い者[もの]もダビデのようになり、ダビデの家[いえ]は神[かみ]のように、彼らの前[まえ]を行[い]く主[しゅ]の天使[てんし]のようになる。"
  9: "その日[ひ]、わたしはエルサレムに攻[せ]め上[のぼ]るすべての民[たみ]を滅[ほろ]ぼそうと求[もと]める。"
  10: "わたしはダビデの家[いえ]とエルサレムの住[す]む者[もの]たちの上[うえ]に、恵[めぐ]みと憐[あわ]れみの霊[れい]を注[そそ]ぐ。彼らは、自分[じぶん]たちが刺[さ]し通[とお]したその方[かた]を仰[あお]ぎ見[み]、その方[かた]のために、愛[あい]する者[もの]を失[うしな]ったときのように泣[な]き、初[はつ]子[ご]を失[うしな]ったときのように悲[かな]しむ。"
  11: "その日[ひ]、エルサレムには大[おお]きな泣[な]き声[ごえ]が上[あ]がる。メギドの野[の]でのアダドリモンの泣[な]き声[ごえ]のように。"
  12: "地[ち]は、氏族[しぞく]ごとに、それぞれ別[べつ]に泣[な]く。ダビデの家[いえ]の氏族[しぞく]は別[べつ]に、その女[おんな]たちも別[べつ]に。"
  13: "ナタンの家[いえ]の氏族[しぞく]は別[べつ]に、その女[おんな]たちも別[べつ]に。レビの家[いえ]の氏族[しぞく]は別[べつ]に、その女[おんな]たちも別[べつ]に。シメオンの氏族[しぞく]は別[べつ]に、その女[おんな]たちも別[べつ]に。"
  14: "残[のこ]りのすべての氏族[しぞく]は、氏族[しぞく]ごとに別[べつ]に、その女[おんな]たちも別[べつ]に泣[な]く。」"

notes:
  1: "Λῆμμα λόγου κυρίου ἐπὶ τὸν Ισραηλ — «пророческое слово Господа об Израиле»; ἐκτείνων οὐρανὸν καὶ θεμελιῶν γῆν — «распростирающий небо и основывающий землю»; πλάσσων πνεῦμα ἀνθρώπου — «образующий дух человека»."
  2: "ὡς πρόθυρα σαλευόμενα — «как преддверия колеблемые» (слав.; в ru «чаша исступления» — МТ, не внесено); περιοχή — «осада, стеснение»."
  3: "λίθον καταπατούμενον — «камень попираемый» (слав.; в ru «тяжёлый камень» — МТ); ἐμπαίζων ἐμπαίξεται — «поруганием поругается»; ἐπισυναχθήσονται — «соберутся»."
  4: "πατάξω πάντα ἵππον ἐν ἐκστάσει — «поражу всякого коня ужасом»; ἀναβάτην ἐν παραφρονήσει — «всадника безумием»; διανοίξω τοὺς ὀφθαλμούς — «отверзу очи»; ἀποτυφλώσει — «ослеплением»."
  5: "οἱ χιλίαρχοι Ιουδα — «тысяченачальники Иуды»; Εὑρήσομεν ἑαυτοῖς — «найдём себе»; ἐν κυρίῳ παντοκράτορι — «в Господе Вседержителе»."
  6: "δαλὸν πυρὸς ἐν ξύλοις — «головню огня в дровах»; λαμπάδα ἐν καλάμῃ — «светильник в тростнике»; καθ' ἑαυτήν — «на своём месте»."
  7: "σώσει… τὰ σκηνώματα Ιουδα — «спасёт… шатры Иуды»; καθὼς ἀπ' ἀρχῆς — «как изначала»; καύχημα οἴκου Δαυιδ — «похвала дома Давидова»."
  8: "ὑπερασπιεῖ — «защитит»; ὁ ἀσθενῶν — «немощный»; ὡς οἶκος θεοῦ — «как дом Божий»; ὡς ἄγγελος κυρίου — «как Ангел Господень»."
  9: "ζητήσω τοῦ ἐξᾶραι — «взыщу изъять (истребить)»; τὰ ἐπερχόμενα ἐπὶ Ιερουσαλημ — «наступающие на Иерусалим»."
  10: "πνεῦμα χάριτος καὶ οἰκτιρμοῦ — «дух благодати и щедрот»; ἐπιβλέψονται πρός με — «воззрят на Меня» (гр. модуля); слав. «воззрят нань, егоже прободоша» — «на Него, Которого пронзили», держим слав. (Ин 19:37); κατωρχήσαντο — «надругались, пронзили»; κοπετὸς ὡς ἐπ' ἀγαπητόν — «плач как о возлюбленном»; πρωτότοκος — «первенец»."
  11: "κοπετὸς ῥοῶνος ἐν πεδίῳ ἐκκοπτομένου — тёмное: «плач Роона на поле срезаемого»; слав. «Ададримон на поле Магедоне» (アダドリモン, メギドの野); в ru «Гададриммон в долине Мегиддонской» — следуем слав."
  12: "κόψεται ἡ γῆ κατὰ φυλάς — «восплачется земля по племенам»; φυλὴ καθ' ἑαυτήν — «племя особо»; γυναῖκες καθ' ἑαυτάς — «жёны их особо»."
  13: "φυλὴ οἴκου Ναθαν — «племя дома Нафанова» (в гр. модуля это конец 12:12; по слав. отнесено к 13-му стиху, не дублируется); Λευι — Левий; Συμεων — Симеон."
  14: "πᾶσαι αἱ φυλαὶ αἱ ὑπολελειμμέναι — «все племена оставшиеся»; φυλὴ καθ' ἑαυτήν — «племя особо»."
