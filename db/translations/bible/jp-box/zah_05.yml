# jp-box, Захария, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 11 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–4 летящий серп (в LXX и слав.; евр./ru — свиток): проклятие на вора
# и ложно клянущегося, входит в дом и истребляет его; 5–8 выходящая ефа, женщина
# «беззаконие», свинцовый камень; 9–11 две женщины с крыльями удода уносят ефу
# в землю Вавилонскую.
# Голоса: 1–2 рассказ и ответ пророка в 「…»; 3–4 слово Господа в 「…»; 5–8 рассказ
# и диалог; 9–11 рассказ, вопрос и ответ в 「…».
# Термины: 鎌[かま] — δρέπανον (LXX); エファ — μέτρον; 不法[ふほう] — ἀνομία;
# ヤツガシラ — ἔποψ (удод); 鉛[なまり]の石[いし] — λίθος τοῦ μολίβου.
#
tr_code: jp-box
book: zah
chapter: 5
draft: true

verses:
  1: "わたしは再[ふたた]び目[め]を上[あ]げて見[み]た。見[み]よ、飛[と]んでいる鎌[かま]があった。"
  2: "彼はわたしに言[い]った。「何[なに]が見[み]えるか。」わたしは言[い]った。「飛[と]んでいる鎌[かま]が見[み]えます。その長[なが]さは二十[にじゅう]キュビト、その幅[はば]は十[じゅう]キュビトです。」"
  3: "彼はわたしに言[い]った。「これは、全[ぜん]地[ち]の面[おもて]に出[で]て行[い]く呪[のろ]いである。盗[ぬす]む者[もの]はすべて、これによって死[し]に至[いた]るまで罰[ばっ]せられ、偽[いつわ]りを誓[ちか]う者[もの]もすべて、これによって死[し]に至[いた]るまで罰[ばっ]せられる。"
  4: "わたしはこれを運[はこ]び出[だ]す、と万軍[ばんぐん]の主[しゅ]は言[い]われる。それは盗[ぬす]む者[もの]の家[いえ]に、またわたしの名[な]によって偽[いつわ]りを誓[ちか]う者[もの]の家[いえ]に侵入[しんにゅう]し、その家[いえ]のうちに宿[やど]って、これを、その木[き]も石[いし]もともに滅[ほろ]ぼし尽[つ]くす。」"
  5: "わたしと語[かた]っていた天使[てんし]が出[で]て来[き]て、わたしに言[い]った。「目[め]を上[あ]げて、出[で]て行[い]くこれが何[なん]であるかを見[み]よ。」"
  6: "わたしは言[い]った。「これは何[なん]ですか。」彼は言[い]った。「これが出[で]て行[い]くエファである。」そして言[い]った。「これは全[ぜん]地[ち]にわたる彼らの不法[ふほう]である。」"
  7: "見[み]よ、鉛[なまり]の重[おも]りが持[も]ち上[あ]げられた。見[み]よ、一人[ひとり]の女[おんな]がエファの真[ま]ん中[なか]に座[すわ]っていた。"
  8: "彼は言[い]った。「これが不法[ふほう]である。」そして彼女[かのじょ]をエファの真[ま]ん中[なか]に投[な]げ入[い]れ、鉛[なまり]の石[いし]をその口[くち]に投[な]げ入[い]れた。"
  9: "わたしは目[め]を上[あ]げて見[み]た。見[み]よ、二[ふた]人[り]の女[おんな]が出[で]て来[き]た。その翼[つばさ]には風[かぜ]があり、その翼[つばさ]はヤツガシラの翼[つばさ]のようであった。彼女[かのじょ]たちはエファを持[も]ち上[あ]げ、地[ち]と天[てん]の間[あいだ]に運[はこ]んだ。"
  10: "わたしは、わたしと語[かた]る天使[てんし]に言[い]った。「彼女[かのじょ]たちはこのエファをどこへ運[はこ]ぶのですか。」"
  11: "彼はわたしに言[い]った。「バビロンの地[ち]に彼女[かのじょ]のための家[いえ]を建[た]て、これを備[そな]えるためである。そして彼らはそれを、定[さだ]められた場所[ばしょ]に据[す]えるであろう。」"

notes:
  1: "δρέπανον πετόμενον — «серп летящий» (LXX и слав.); евр./ru «свиток» (מְגִלָּה) — не внесено, держим LXX. Это главное расхождение главы."
  2: "μῆκος πήχεων εἴκοσι — «длина двадцать локтей»; πλάτος δέκα — «ширина десять»."
  3: "ἡ ἀρὰ ἡ ἐκπορευομένη — «проклятие исходящее»; ἕως θανάτου ἐκδικηθήσεται — «до смерти отмщено будет»; слав. «от сего даже до смерти»."
  4: "ἐξοίσω αὐτό — «вынесу его» (слав. «изнесу»; в ru «навел его» — иное чтение); καταλύσει… συντελέσει — «разрушит… истребит»."
  5: "Ἀνάβλεψον τοῖς ὀφθαλμοῖς — «подними глаза»; τὸ ἐκπορευόμενον — «выходящее»."
  6: "μέτρον — «мера» (ефа); ἀδικία αὐτῶν — «неправда их» (слав.; в ru «образ их» — МТ); エファ — мера сыпучих тел."
  7: "τάλαντον μολίβου — «талант свинца» (鉛の重り); μία γυνή — «одна женщина»."
  8: "ἀνομία — «беззаконие»; ἔρριψεν τὸν λίθον τοῦ μολίβου — «бросил камень свинца» (свинцовую крышку)."
  9: "πνεῦμα ἐν ταῖς πτέρυξιν — «дух (ветер) в крыльях»; ἔποπος — «удод» (ヤツガシラ; слав. «вдодовы»; в ru «аист» — иное чтение, не внесено); ἀνὰ μέσον γῆς καὶ οὐρανοῦ — «между землёй и небом»."
  10: "ποῦ αὗται ἀποφέρουσιν — «куда они уносят»."
  11: "Οἰκοδομῆσαι αὐτῷ οἰκίαν — «устроить ей дом»; ἐν γῇ Βαβυλῶνος — «в земле Вавилонской» (слав.; в ru «Сеннаар» — МТ, не внесено); ἐπὶ τὴν ἑτοιμασίαν αὐτοῦ — «на уготованное ей место»."
