verses:
  0: "安息日[あんそくび]のための詩[うた]の歌[うた]。"
  1: "いと高[たか]き者[もの]よ、主[しゅ]をほめたたえ、あなたの名[な]をほめ歌[うた]うことは、よいことである。"
  2: "朝[あさ]にはあなたのあわれみを、夜[よる]にはあなたの真実[しんじつ]を告[つ]げ知[し]らせ、"
  3: "十[じゅう]弦[げん]の琴[こと]と竪琴[たてごと]に、歌[うた]を合わせて。"
  4: "主[しゅ]よ、あなたはそのわざによってわたしを喜[よろこ]ばせてくださった。わたしはあなたの手[て]のわざを喜[よろこ]び躍[おど]る。"
  5: "主[しゅ]よ、あなたのわざはなんと大[おお]きいことか。あなたの思[おも]いはいかにも深[ふか]い。"
  6: "愚[おろ]かな人[ひと]はこれを知[し]らず、分別[ふんべつ]のない者[もの]はこれを悟[さと]らない。"
  7: "罪[つみ]人[びと]が草[くさ]のように生[は]え出[で]、不法[ふほう]を行[おこな]う者[もの]がみな顔[かお]を出[だ]しても、それは彼[かれ]らがとこしえに滅[ほろ]ぼされるためである。"
  8: "しかし、主[しゅ]よ、あなたはとこしえにいと高[たか]い方[かた]である。"
  9: "見[み]よ、主[しゅ]よ、あなたの敵[てき]は滅[ほろ]び、不法[ふほう]を行[おこな]う者[もの]はみな散[ち]らされる。"
  10: "しかし、あなたはわたしの角[つの]を野牛[やぎゅう]の角[つの]のように高[たか]く上[あ]げ、わたしの老[お]いを豊[ゆた]かな油[あぶら]で潤[うるお]してくださる。"
  11: "わたしの目[め]はわたしの敵[てき]をじっと見[み]、わたしに逆[さか]らって悪[わる]を企[たくら]む者[もの]たちのことを、わたしの耳[みみ]が聞[き]く。"
  12: "正[ただ]しい者[もの]は棕櫚[しゅろ]のように花[はな]咲[さ]き、レバノン杉[すぎ]のように育[そだ]つ。"
  13: "主[しゅ]の家[いえ]に植[う]えられた者[もの]は、わたしたちの神[かみ]の庭[にわ]で花[はな]咲[さ]く。"
  14: "彼[かれ]らは老[お]いてなお増[ふ]え、ゆたかにして安[やす]らかであり、"
  15: "主[しゅ]が正[ただ]しく、わたしの神[かみ]に不義[ふぎ]のないことを告[つ]げるために。"

notes:
  0: "Ψαλμὸς ᾠδῆς, εἰς τὴν ἡμέραν τοῦ σαββάτου — «Псалом песни, в день субботний»; 安息日のための詩の歌 (ψαλμός — 詩, ᾠδή — 歌; 詩の歌, как в Пс 66:1). Надписание — стих 0."
  1: "Ἀγαθὸν τὸ ἐξομολογεῖσθαι τῷ κυρίῳ — いと高き者よ、主をほめたたえ…ことは、よいことである (ἀγαθόν — «благо, хорошо»; ἐξομολογέομαι — «славить, исповедовать»). ψάλλειν τῷ ὀνόματί σου, ὕψιστε — あなたの名をほめ歌う (ψάλλω — «петь под струны»; ὕψιστος — いと高き者)."
  2: "τοῦ ἀναγγέλλειν τὸ πρωῒ τὸ ἔλεός σου — 朝にはあなたのあわれみを告げ知らせ (ἀναγγέλλω — «возвещать»). τὴν ἀλήθειάν σου κατὰ νύκτα — 夜にはあなたの真実を (κατὰ νύκτα — «ночью»)."
  3: "ἐν δεκαχόρδῳ ψαλτηρίῳ — 十弦の琴に (ψαλτήριον — 琴, как по корпусу; δεκάχορδος — «десятиструнный»). μετ᾿ ᾠδῆς ἐν κιθάρᾳ — 竪琴に、歌を合わせて (κιθάρα — 竪琴, чтобы отличить от ψαλτήριον)."
  4: "εὔφρανάς με, κύριε, ἐν τῷ ποιήματί σου — 主よ、あなたはそのわざによってわたしを喜ばせてくださった (ποίημα — «творение, дело»). ἐν τοῖς ἔργοις τῶν χειρῶν σου ἀγαλλιάσομαι — わたしはあなたの手のわざを喜び躍る (ἀγαλλιάομαι — «ликовать»)."
  5: "ὡς ἐμεγαλύνθη τὰ ἔργα σου, κύριε — 主よ、あなたのわざはなんと大きいことか (μεγαλύνω — «возвеличивать»). σφόδρα ἐβαθύνθησαν οἱ διαλογισμοί σου — あなたの思いはいかにも深い (βαθύνω — «углублять»; διαλογισμός — «помышление»)."
  6: "ἀνὴρ ἄφρων οὐ γνώσεται — 愚かな人はこれを知らず (ἄφρων — «безумный»). ἀσύνετος οὐ συνήσει ταῦτα — 分別のない者はこれを悟らない (ἀσύνετος — «неразумный»; συνίημι — «уразумевать»)."
  7: "ἐν τῷ ἀνατεῖλαι τοὺς ἁμαρτωλοὺς ὡς χόρτον — 罪人が草のように生え出で (ἀνατέλλω — «прорастать»; χόρτος — «трава»). διέκυψαν πάντες οἱ ἐργαζόμενοι τὴν ἀνομίαν — 不法を行う者がみな顔を出しても (διακύπτω — «выглядывать, показываться»). ὅπως ἂν ἐξολεθρευθῶσιν εἰς τὸν αἰῶνα τοῦ αἰῶνος — それは彼らがとこしえに滅ぼされるためである (ἐξολεθρεύω — «истреблять»)."
  8: "σὺ δὲ ὕψιστος εἰς τὸν αἰῶνα, κύριε — しかし、主よ、あなたはとこしえにいと高い方である."
  9: "ἰδοὺ οἱ ἐχθροί σου ἀπολοῦνται — 見よ、主よ、あなたの敵は滅び (ἀπόλλυμι — «погибать»). διασκορπισθήσονται πάντες οἱ ἐργαζόμενοι τὴν ἀνομίαν — 不法を行う者はみな散らされる (διασκορπίζω — «рассеивать»)."
  10: "ὑψωθήσεται ὡς μονοκέρωτος τὸ κέρας μου — あなたはわたしの角を野牛の角のように高く上げ (μονόκερως — «единорог, дикий бык»; 野牛, как в Пс 21:22). τὸ γῆρός μου ἐν ἐλαίῳ πίονι — わたしの老いを豊かな油で潤してくださる (γῆρας — «старость»; ἔλαιον πῖον — «тучный елей»)."
  11: "ἐπεῖδεν ὁ ὀφθαλμός μου ἐν τοῖς ἐχθροῖς μου — わたしの目はわたしの敵をじっと見 (ἐφοράω — «смотреть на»). ἐν τοῖς ἐπανιστανομένοις ἐπ᾿ ἐμὲ πονηρευομένοις ἀκούσεται τὸ οὖς μου — わたしに逆らって悪を企む者たちのことを、わたしの耳が聞く (ἐπανίστημι — «восставать»; πονηρεύομαι — «делать зло»)."
  12: "δίκαιος ὡς φοῖνιξ ἀνθήσει — 正しい者は棕櫚のように花咲き (φοῖνιξ — «финиковая пальма»; ἀνθέω — «цвести»). ὡσεὶ κέδρος ἡ ἐν τῷ Λιβάνῳ πληθυνθήσεται — レバノン杉のように育つ (κέδρος — «кедр»; πληθύνω — «умножаться, расти»)."
  13: "πεφυτευμένοι ἐν τῷ οἴκῳ κυρίου — 主の家に植えられた者は (φυτεύω — «сажать»). ἐν ταῖς αὐλαῖς τοῦ θεοῦ ἡμῶν ἐξανθήσουσιν — わたしたちの神の庭で花咲く (αὐλή — «двор»; ἐξανθέω — «расцветать»)."
  14: "ἔτι πληθυνθήσονται ἐν γήρει πίονι — 彼らは老いてなお増え (γῆρας πῖον — «тучная старость»). εὐπαθοῦντες ἔσονται — ゆたかにして安らかであり (εὐπαθέω — «благоденствовать»)."
  15: "τοῦ ἀναγγεῖλαι ὅτι εὐθὴς κύριος ὁ θεός μου — 主が正しく、わたしの神が…であることを告げるために (εὐθής — «правый, прямой»). οὐκ ἔστιν ἀδικία ἐν αὐτῷ — わたしの神に不義のないこと (ἀδικία — 不義)."
