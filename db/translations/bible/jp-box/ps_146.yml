verses:
  1: "アレルヤ。ハガイとゼカリヤの詩[うた]。主[しゅ]をほめたたえよ。歌[うた]うことは善[よ]いこと、わたしたちの神[かみ]に賛美[さんび]をささげることは快[こころよ]いことである。"
  2: "主[しゅ]はエルサレムを建[た]て、イスラエルの散[ち]らされた者[もの]たちを集[あつ]められる。"
  3: "主[しゅ]は心[こころ]の砕[くだ]けた者[もの]をいやし、その傷[きず]を包[つつ]まれる。"
  4: "主[しゅ]は星[ほし]の数[かず]を数[かぞ]え、そのすべてを名[な]で呼[よ]ばれる。"
  5: "わたしたちの主[しゅ]は大[おお]きく、その力[ちから]も大[おお]きい。その知[ち]恵[え]は数[かぞ]えきれない。"
  6: "主[しゅ]は低[ひく]くされた者[もの]を引[ひ]き上[あ]げ、罪[つみ]人[びと]を地[ち]まで低[ひく]くされる。"
  7: "主[しゅ]に感謝[かんしゃ]をもって歌[うた]い始[はじ]め、わたしたちの神[かみ]に琴[こと]でほめ歌[うた]を歌[うた]え。"
  8: "主[しゅ]は雲[くも]で天[てん]を覆[おお]い、地[ち]のために雨[あめ]を備[そな]え、山[やま]に草[くさ]を生[は]えさせ、人[ひと]の働[はたら]きのために野[の]の草[くさ]を生[は]えさせられる。"
  9: "主[しゅ]は家畜[かちく]に食物[しょくもつ]を与[あた]え、ご自分[じぶん]を呼[よ]ぶカラスのひなに与[あた]えられる。"
  10: "主[しゅ]は馬[うま]の力[ちから]を喜[よろこ]ばず、人[ひと]の足[あし]の速[はや]さも喜[よろこ]ばれない。"
  11: "主[しゅ]はご自分[じぶん]を恐[おそ]れる者[もの]たちと、そのあわれみに望[のぞ]みを置[お]く者[もの]たちを喜[よろこ]ばれる。"

notes:
  1: "Αλληλουια· Αγγαιου καὶ Ζαχαριου — アレルヤ。ハガイとゼカリヤの詩. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Αἰνεῖτε τὸν κύριον, ὅτι ἀγαθὸν ψαλμός — 主をほめたたえよ、歌うことは善いこと (ψαλμός — «псалом, игра на струнах»). τῷ θεῷ ἡμῶν ἡδυνθείη αἴνεσις — わたしたちの神に賛美をささげることは快い (ἡδύνω — «делать сладким, приятным»)."
  2: "οἰκοδομῶν Ιερουσαλημ ὁ κύριος — 主はエルサレムを建て (οἰκοδομέω — «строить»). τὰς διασπορὰς τοῦ Ισραηλ ἐπισυνάξει — イスラエルの散らされた者たちを集める (διασπορά — «рассеяние»; ἐπισυνάγω — «собирать»)."
  3: "ὁ ἰώμενος τοὺς συντετριμμένους τὴν καρδίαν — 心の砕けた者をいやし (ἰάομαι — «врачевать»; συντρίβω — «сокрушать»). δεσμεύων τὰ συντρίμματα αὐτῶν — その傷を包まれる (δεσμεύω — «перевязывать»; σύντριμμα — «сокрушение, рана»)."
  4: "ὁ ἀριθμῶν πλήθη ἄστρων — 星の数を数え (ἀριθμέω — «считать»). πᾶσιν αὐτοῖς ὀνόματα καλῶν — そのすべてを名で呼ばれる (καλέω — «звать, называть»)."
  5: "μέγας ὁ κύριος ἡμῶν, καὶ μεγάλη ἡ ἰσχὺς αὐτοῦ — わたしたちの主は大きく、その力も大きい (ἰσχύς — «сила»). τῆς συνέσεως αὐτοῦ οὐκ ἔστιν ἀριθμός — その知恵は数えきれない (σύνεσις — «разумение»)."
  6: "ἀναλαμβάνων πραεῖς ὁ κύριος — 主は低くされた者を引き上げ (ἀναλαμβάνω — «поднимать»; πραΰς — «кроткий»). ταπεινῶν δὲ ἁμαρτωλοὺς ἕως τῆς γῆς — 罪人を地まで低くされる (ταπεινόω — «смирять»)."
  7: "ἐξάρξατε τῷ κυρίῳ ἐν ἐξομολογήσει — 主に感謝をもって歌い始め (ἐξάρχω — «начинать»; ἐξομολόγησις — «славословие, благодарение»). ψάλατε τῷ θεῷ ἡμῶν ἐν κιθάρᾳ — わたしたちの神に琴でほめ歌を歌え (κιθάρα — 琴)."
  8: "τῷ περιβάλλοντι τὸν οὐρανὸν ἐν νεφέλαις — 雲で天を覆い (περιβάλλω — «облекать»). ἑτοιμάζοντι τῇ γῇ ὑετόν — 地のために雨を備え (ὑετός — «дождь»). ἐξανατέλλοντι ἐν ὄρεσι χόρτον — 山に草を生えさせ (χόρτος — «трава»). καὶ χλόην τῇ δουλείᾳ τῶν ἀνθρώπων — 人の働きのために野の草を (χλόη — «зелень»; δουλεία — «служение, труд»; в гр. в квадратных скобках, но в базе есть — 〔…〕 не ставится)."
  9: "διδόντι τοῖς κτήνεσι τροφὴν αὐτῶν — 家畜に食物を与え (κτῆνος — «скот»). τοῖς νεοσσοῖς τῶν κοράκων τοῖς ἐπικαλουμένοις αὐτόν — ご自分を呼ぶカラスのひなに (νεοσσός — «птенец»; κόραξ — «ворон»)."
  10: "οὐκ ἐν τῇ δυναστείᾳ τοῦ ἵππου θελήσει — 主は馬の力を喜ばず (δυναστεία — «сила, мощь»). οὐδὲ ἐν ταῖς κνήμαις τοῦ ἀνδρὸς εὐδοκεῖ — 人の足の速さも喜ばれない (κνήμη — «голень»; εὐδοκέω — «благоволить»)."
  11: "εὐδοκεῖ κύριος ἐν τοῖς φοβουμένοις αὐτὸν — 主はご自分を恐れる者たちを喜び (φοβέομαι — «бояться», здесь «благоговеть»). ἐν τοῖς ἐλπίζουσιν ἐπὶ τὸ ἔλεος αὐτοῦ — そのあわれみに望みを置く者たちを喜ばれる."
