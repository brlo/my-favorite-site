verses:
  1: "サラの生涯[しょうがい]は百二十七年[ひゃくにじゅうななねん]であった。"
  2: "サラはカナンの地[ち]にあるアルボクの町[まち]、すなわち谷間[たにま]の町[まち]で死[し]んだ。それはヘブロンである。アブラハムはサラのために泣[な]き、悲[かな]しむために来[き]た。"
  3: "アブラハムは亡[な]き女[おんな]のそばから立[た]ち上[あ]がり、ヘトの子[こ]らに言[い]った。"
  4: "「わたしはあなたがたの間[あいだ]の寄留者[きりゅうしゃ]、旅人[たびびと]である。どうか、あなたがたの間[あいだ]で、墓[はか]のための所有地[しょゆうち]をわたしに与[あた]えてほしい。わたしの亡[な]き者[もの]を、わたしのところから葬[ほうむ]るために。」"
  5: "ヘトの子[こ]らはアブラハムに答[こた]えて言[い]った。"
  6: "「いいえ、ご主人[しゅじん]。わたしたちの言[い]うことを聞[き]いてください。あなたはわたしたちの間[あいだ]で、神[かみ]から立[た]てられた王[おう]です。わたしたちの最[もっと]も選[え]りすぐった墓[はか]に、あなたの亡[な]き者[もの]を葬[ほうむ]ってください。わたしたちのうち、あなたが亡[な]き者[もの]をそこに葬[ほうむ]るのを拒[こば]む者[もの]は一人[ひとり]もいません。」"
  7: "アブラハムは立[た]って、その地[ち]の民[たみ]、ヘトの子[こ]らに礼[れい]をした。"
  8: "アブラハムは彼[かれ]らに語[かた]って言[い]った。「もしあなたがたが、わたしの亡[な]き者[もの]をわたしの前[まえ]から葬[ほうむ]ることを心[こころ]に許[ゆる]されるなら、わたしの言[い]うことを聞[き]き、わたしのために、ツォハルの子[こ]エフロンに話[はな]してほしい。"
  9: "すなわち、彼[かれ]の持[も]っている二重[にじゅう]の洞窟[どうくつ]、彼[かれ]の畑[はたけ]の一部[いちぶ]にある洞窟[どうくつ]を、わたしに与[あた]えさせてください。あなたがたの間[あいだ]で、墓[はか]のための所有地[しょゆうち]として、それにふさわしい銀[ぎん]で売[う]ってください。」"
  10: "エフロンはヘトの子[こ]らの間[あいだ]に座[すわ]っていた。ヘト人[じん]エフロンは、ヘトの子[こ]らと、町[まち]に入[はい]って来[く]るすべての者[もの]が聞[き]いている前[まえ]で、アブラハムに答[こた]えて言[い]った。"
  11: "「ご主人[しゅじん]、わたしの話[はなし]を聞[き]いてください。わたしの言[い]うことを聞[き]いてください。あの畑[はたけ]と、その中[なか]の洞窟[どうくつ]を、あなたに差[さ]し上[あ]げます。わたしの同胞[どうほう]すべての前[まえ]で、あなたに差し上げました。あなたの亡[な]き者[もの]を葬[ほうむ]ってください。」"
  12: "アブラハムはその地[ち]の民[たみ]の前[まえ]で礼[れい]をした。"
  13: "そして、その地[ち]の民[たみ]が聞[き]いているところで、エフロンに言[い]った。「どうか、わたしの言[い]うことを聞[き]いてください。畑[はたけ]の銀[ぎん]をわたしから受[う]け取[と]ってください。そうすれば、わたしの亡[な]き者[もの]をそこに葬[ほうむ]ります。」"
  14: "エフロンはアブラハムに答[こた]えて言[い]った。"
  15: "「いいえ、ご主人[しゅじん]。わたしは聞[き]きました。あの地[ち]は銀[ぎん]四百[よんひゃく]枚[まい]の値[あたい]です。わたしとあなたの間[あいだ]で、それが何[なん]でありましょうか。あなたの亡[な]き者[もの]を葬[ほうむ]ってください。」"
  16: "アブラハムはエフロンの言[い]うことを聞[き]き入[い]れ、ヘトの子[こ]らが聞[き]いているところでエフロンが言[い]ったとおり、商人[しょうにん]たちが使[つか]う銀[ぎん]四百[よんひゃく]枚[まい]を量[はか]って、エフロンに渡[わた]した。"
  17: "エフロンの畑[はたけ]、すなわちマンブレの前[まえ]にある二重[にじゅう]の洞窟[どうくつ]の畑[はたけ]、その中[なか]の洞窟[どうくつ]、また畑[はたけ]にあり、その周[まわ]りの境[さかい]の内[うち]にあるすべての木[き]は、"
  18: "ヘトの子[こ]らと、町[まち]に入[はい]って来[く]るすべての者[もの]の前[まえ]で、アブラハムの所有[しょゆう]となった。"
  19: "その後[あと]、アブラハムは妻[つま]サラを、マンブレの向[む]かい側[がわ]にある畑[はたけ]の二重[にじゅう]の洞窟[どうくつ]、すなわちカナンの地[ち]のヘブロンに葬[ほうむ]った。"
  20: "こうして、その畑[はたけ]と、その中[なか]の洞窟[どうくつ]は、ヘトの子[こ]らから、墓[はか]のための所有地[しょゆうち]として、アブラハムに確定[かくてい]された。"

notes:
  1: "ἡ ζωὴ Σαρρας — サラの生涯 (букв. «жизнь Сарры»). ἔτη ἑκατὸν εἴκοσι ἑπτά — 百二十七年 (букв. «лет сто двадцать семь»)."
  2: "ἐν πόλει Αρβοκ — アルボクの町 (Аρβόκ; евр. קִרְיַת־אַרְבַּע, Кириаф-Арба). ἥ ἐστιν ἐν τῷ κοιλώματι — 谷間にある (κοίλωμα — «долина, впадина»). αὕτη ἐστὶν Χεβρων — それはヘブロンである (в греч. тексте в квадратных скобках, но в базе есть — 〔〕 не ставим). κόψασθαι ... καὶ πενθῆσαι — 泣き、悲しむために (κόπτομαι — «оплакивать»; πενθέω — «скорбеть»)."
  3: "ἀνέστη ἀπὸ τοῦ νεκροῦ αὐτοῦ — 亡き女のそばから立ち上がり (νεκρός — «мёртвый»). τοῖς υἱοῖς Χετ — ヘトの子らに (Хет — сын Ханаана)."
  4: "Πάροικος καὶ παρεπίδημος — 寄留者、旅人 (πάροικος — «пришелец»; παρεπίδημος — «странник»). κτῆσιν τάφου — 墓のための所有地 (κτῆσις — «владение»; τάφος — «гробница»). θάψω τὸν νεκρόν μου ἀπ᾿ ἐμοῦ — わたしのところから葬る (букв. «похороню умершую мою от меня»)."
  5: "ἀπεκρίθησαν ... λέγοντες — 答えて言った."
  6: "Μή, κύριε — いいえ、ご主人 (μή — «нет» в ответе). βασιλεὺς παρὰ θεοῦ — 神から立てられた王 (букв. «царь от Бога»). ἐν τοῖς ἐκλεκτοῖς μνημείοις — 最も選りすぐった墓に (ἐκλεκτός — «избранный»; μνημεῖον — «гробница»). κωλύσει — 拒む (κωλύω — «препятствовать»)."
  7: "προσεκύνησεν τῷ λαῷ τῆς γῆς — その地の民に礼をした (προσκυνέω — «поклоняться»)."
  8: "Εἰ ἔχετε τῇ ψυχῇ ὑμῶν — 心に許されるなら (букв. «если имеете в душе вашей»). ἀκούσατέ μου — わたしの言うことを聞き. λαλήσατε περὶ ἐμοῦ Εφρων — わたしのためにエフロンに話して (Εφρων — Ефрон; τῷ τοῦ Σααρ — сын Цохара, ツォハル)."
  9: "τὸ σπήλαιον τὸ διπλοῦν — 二重の洞窟 (διπλοῦς — «двойной»; евр. מַכְפֵּלָה, Махпела). ἐν μέρει τοῦ ἀγροῦ — 畑の一部に. ἀργυρίου τοῦ ἀξίου — ふさわしい銀で (ἄξιος — «достойный»). εἰς κτῆσιν μνημείου — 墓の所有地として."
  10: "Εφρων δὲ ἐκάθητο ἐν μέσῳ — エフロンは間に座っていた. ἀκουόντων τῶν υἱῶν Χετ — ヘトの子らが聞いている前で (родительный самостоятельный). τῶν εἰσπορευομένων εἰς τὴν πόλιν — 町に入って来る者たち."
  11: "Παρ᾿ ἐμοὶ γενοῦ — わたしの話を聞いてください (букв. «будь при мне», т. е. выслушай). τὸν ἀγρὸν καὶ τὸ σπήλαιον ... σοι δίδωμι — 畑と洞窟をあなたに差し上げます. ἐναντίον πάντων τῶν πολιτῶν μου — 同胞すべての前で (πολίτης — «гражданин»)."
  12: "προσεκύνησεν ἐναντίον τοῦ λαοῦ — 民の前で礼をした."
  13: "Ἐπειδὴ πρὸς ἐμοῦ εἶ — あなたがわたしの側についてくださるのなら (букв. «так как ты за меня»). τὸ ἀργύριον τοῦ ἀγροῦ λαβὲ παρ᾿ ἐμοῦ — 畑の銀をわたしから受け取ってください. θάψω ... ἐκεῖ — そこに葬ります."
  14: "ἀπεκρίθη ... λέγων — 答えて言った."
  15: "Οὐχί, κύριε· ἀκήκοα — いいえ、ご主人。わたしは聞きました (ἀκήκοα, perfect от ἀκούω). γῆ τετρακοσίων διδράχμων ἀργυρίου — 銀四百枚の値の地 (γῆ — «земля»). ἀνὰ μέσον ἐμοῦ καὶ σοῦ τί ἂν εἴη τοῦτο; — わたしとあなたの間で、それが何でありましょうか (вежливый отказ от платы)."
  16: "ἤκουσεν Αβρααμ τοῦ Εφρων — エフロンの言うことを聞き入れた (ἀκούω + род. — «послушал»). ἀπεκατέστησεν τὸ ἀργύριον — 銀を量って渡した (ἀποκαθίστημι — «отвешивать»). δίδραχμα ... δοκίμου ἐμπόροις — 商人たちが使う、吟味された銀 (δόκιμος — «испытанный»; ἔμπορος — «торговец»)."
  17: "ἔστη ὁ ἀγρός — 畑は確定した (ἵστημι — «устанавливать»). ἐν τῷ διπλῷ σπηλαίῳ — 二重の洞窟にある. κατὰ πρόσωπον Μαμβρη — マンブレの前に. ἐν τοῖς ὁρίοις αὐτοῦ κύκλῳ — その周りの境の内に (ὅριον — «предел»)."
  18: "τῷ Αβρααμ εἰς κτῆσιν — アブラハムの所有となった. ἐναντίον τῶν υἱῶν Χετ — ヘトの子らの前で."
  19: "μετὰ ταῦτα — その後. ἐν τῷ σπηλαίῳ τοῦ ἀγροῦ τῷ διπλῷ — 畑の二重の洞窟に. ἀπέναντι Μαμβρη — マンブレの向かいに. αὕτη ἐστὶν Χεβρων — それはヘブロン (в квадратных скобках в греч., в базе есть)."
  20: "ἐκυρώθη — 確定された (κυρόω — «утверждать»). εἰς κτῆσιν τάφου — 墓の所有地として. παρὰ τῶν υἱῶν Χετ — ヘトの子らから."
