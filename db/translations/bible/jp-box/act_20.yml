# jp-box, Деяния апостолов, глава 20. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 20: путь через Македонию и Грецию (1–6), Евтих в Троаде (7–12),
# путь в Милит (13–16), прощальная речь к ефесским пресвитерам (17–35),
# молитва и расставание (36–38).
# Красного в главе нет: Христос здесь не говорит прямо; 20:35 — цитата изречения
# Господа внутри речи Павла, оставлена чёрной (по правилу партии).
# 〔…〕: 20:15 — «и, пробыв в Трогиллии» (церковное чтение, в базе отсутствует);
# 20:28 — 〔主である〕 при 神の教会 (в базе τοῦ θεοῦ, церковный текст — κυρίου καὶ θεοῦ).
# Сноски: 20:6 (種なしパン祭り).
# jp-ni не использовался.

