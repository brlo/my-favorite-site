chapter: 20
draft: true

verses:
  1: "騒[さわ]ぎが収[おさ]まると、パウロは弟子[でし]たちを呼[よ]び寄[よ]せ、励[はげ]まして別[わか]れの挨拶[あいさつ]をし、マケドニアへ出発[しゅっぱつ]した。"
  2: "その地方[ちほう]を巡[めぐ]り、多[おお]くの言葉[ことば]で彼[かれ]らを励[はげ]ましてから、ギリシャに来[き]た。"
  3: "そこに三[さん]か月[げつ]滞在[たいざい]した。しかし、シリアへ船出[ふなで]しようとしたとき、ユダヤ人[じん]たちの陰謀[いんぼう]があったので、マケドニアを通[とお]って帰[かえ]ることにした。"
  4: "彼[かれ]に同行[どうこう]したのは、ピロの子[こ]でベレア人[じん]のソパトロ、テサロニケ人[じん]のアリスタルコとセクンド、デルベ人[じん]のガイオ、ティモテ、それにアジア州[しゅう]のティキコとトロフィモであった。"
  5: "この人[ひと]たちは先[さき]に進[すす]んで、わたしたちをトロアスで待[ま]っていた。"
  6: "わたしたちは種[たね]なしパン祭[まつ]り⟨過越[すぎこし]の祭[まつ]りに続[つづ]き、パン種[ぱんだね]を入[い]れないパンを食[た]べる一週間[いっしゅうかん]の祭[まつ]り。⟩の日[ひ]々[び]が過[す]ぎてから、フィリピから船出[ふなで]し、五[いつ]日[か]でトロアスの彼[かれ]らのもとに着[つ]いた。そこには七[なのか]日[か]滞在[たいざい]した。"
  7: "週[しゅう]の初[はじ]めの日[ひ]、パン[ぱん]を裂[さ]くために集[あつ]まったとき、パウロは彼[かれ]らに語[かた]った。翌日[よくじつ]に出発[しゅっぱつ]するつもりでいたので、話[はなし]は真夜中[まよなか]まで続[つづ]いた。"
  8: "わたしたちが集[あつ]まっていた楼上[ろうじょう]には、多[おお]くの灯[あか]りがともっていた。"
  9: "エウティコという若者[わかもの]が窓[まど]のところに座[すわ]っていたが、パウロの話[はなし]が長[なが]く続[つづ]いたので、深[ふか]い眠[ねむ]りに落[お]ちた。そして、眠[ねむ]りに襲[おそ]われて三階[さんがい]から落[お]ち、死[し]んだ者[もの]として抱[かか]え起[お]こされた。"
  10: "パウロは下[お]りて行[い]って彼[かれ]の上[うえ]に伏[ふ]し、抱[だ]きかかえて言[い]った。「騒[さわ]ぐな。彼[かれ]の命[いのち]はまだその中[なか]にある。」"
  11: "パウロは上[のぼ]って行[い]ってパン[ぱん]を裂[さ]き、食[た]べた。そして、夜明[よあ]けまで長[なが]く語[かた]り合[あ]ってから、出発[しゅっぱつ]した。"
  12: "人々[ひとびと]は少年[しょうねん]を生[い]きたまま連[つ]れて帰[かえ]り、大[おお]いに慰[なぐさ]められた。"
  13: "わたしたちは先[さき]に舟[ふね]に乗[の]り、アッソスへ向[む]けて出航[しゅっこう]した。そこでパウロを乗[の]せてやるためであった。彼[かれ]は自分[じぶん]で歩[ある]いて行[ゆ]くつもりで、そう決[き]めていたからである。"
  14: "彼[かれ]がアッソスでわたしたちと落[お]ち合[あ]ったので、わたしたちは彼[かれ]を乗[の]せてミティレネへ行[い]った。"
  15: "そこから舟[ふね]を出[いだ]し、翌日[よくじつ]にはキオスに向[む]かい合[あ]う所[ところ]に着[つ]いた。その次[つぎ]の日[ひ]にはサモスに寄[よ]り、さらにその次[つぎ]の日[ひ]〔トロギリオンに寄[よ]って〕、ミレトに着[つ]いた。"
  16: "パウロはアジア州[しゅう]で時間[じかん]を費[つい]やさないように、エフェソを沖[おき]過[す]ぎにしようと決[き]めていた。できるなら五旬節[ごじゅんせつ]の日[ひ]にはエルサレムにいたいと、急[いそ]いでいたのである。"
  17: "パウロはミレトからエフェソに人[ひと]を遣[つか]わして、教会[きょうかい]の長老[ちょうろう]たちを呼[よ]び寄[よ]せた。"
  18: "彼[かれ]らが来[き]たとき、パウロは言[い]った。「あなたがたは、わたしがアジア州[しゅう]に足[あし]を踏[ふ]み入[い]れた最初[さいしょ]の日[ひ]から、あなたがたとともに過[す]ごしたすべての日[ひ]々[び]がどのようなものであったかを知[し]っている。"
  19: "すなわち、あらゆる謙遜[けんそん]と涙[なみだ]と、ユダヤ人[じん]たちの陰謀[いんぼう]によってわたしに降[ふ]りかかった試練[しれん]とをもって、主[しゅ]に仕[つか]えてきた。"
  20: "また、あなたがたに益[えき]となることを何[なに]一つ隠[かく]さずに告[つ]げ、公[おおやけ]の場[ば]でも、家[いえ]ごとにも教[おし]えてきた。"
  21: "ユダヤ人[じん]にもギリシャ人[じん]にも、神[かみ]への悔[くい]改[ため]めと、わたしたちの主[しゅ]イエスへの信仰[しんこう]とを証[あかし]してきた。"
  22: "そして今[いま]、わたしは霊[れい]に縛[しば]られてエルサレムへ行[ゆ]く。そこでわたしに何[なに]が起[こ]るかは知[し]らない。"
  23: "ただ、{聖霊[せいれい]|聖神[せいしん]}が町[まち]ごとに、鎖[くさり]と苦難[くなん]がわたしを待[ま]っていると証[あかし]している。"
  24: "しかし、わたしは自分[じぶん]の命[いのち]を少[すこ]しも惜[お]しまない。わたしが走[はし]るべき道[みち]を走[はし]り終[お]え、主[しゅ]イエスから受[う]けた務[つと]め、すなわち神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}の福音[ふくいん]を証[あかし]する務[つと]めを果[は]たすことさえできれば、それでよい。"
  25: "そして今[いま]、わたしは知[し]っている。わたしが巡[めぐ]って神[かみ]の国[くに]を宣[の]べ伝[つた]えたあなたがたは皆[みな]、もはやわたしの顔[かお]を見[み]ることはない。"
  26: "だから、今日[きょう]、あなたがたに証[あかし]する。わたしはすべての人[ひと]の血[ち]について潔白[けっぱく]である。"
  27: "神[かみ]のご計画[けいかく]をすべて、あなたがたに告[つ]げずに隠[かく]したことはないからである。"
  28: "あなたがたは自分[じぶん]自身[じしん]にも、また{聖霊[せいれい]|聖神[せいしん]}があなたがたを監督[かんとく]に据[す]えて牧[ぼく]させている群[む]れ全体[ぜんたい]にも、心[こころ]を配[くば]りなさい。それは、〔主[しゅ]である〕神[かみ]の教会[きょうかい]を牧[ぼく]するためである。神[かみ]はこの教会[きょうかい]を、御自身[ごじしん]の血[ち]によって贖[あがな]い取[と]られた。"
  29: "わたしが去[さ]った後[あと]、獰猛[どうもう]な狼[おおかみ]たちがあなたがたの間[あいだ]に入[はい]って来[き]て、群[む]れを容赦[ようしゃ]しないことを、わたしは知[し]っている。"
  30: "また、あなたがた自身[じしん]の中[なか]からも、曲[ま]がったことを語[かた]って弟子[でし]たちを引[ひ]き離[はな]し、自分[じぶん]たちの後[うし]ろに従[したが]わせようとする者[もの]たちが起[お]こる。"
  31: "だから、目[め]を覚[さ]ましていなさい。わたしが三[さん]年[ねん]の間[あいだ]、夜[よ]も昼[ひる]も絶[た]えず、涙[なみだ]を流[なが]して一人[ひとり]一人[ひとり]を戒[いまし]めてきたことを思[おも]い起[おこ]しなさい。"
  32: "そして今[いま]、あなたがたを神[かみ]と、その{恵[めぐ]み|恩寵[おんちょう]}の言葉[ことば]に委[ゆだ]ねる。この言葉[ことば]は、あなたがたを建[た]て上[あ]げ、聖[せい]とされたすべての者[もの]の中[なか]で嗣業[しぎょう]を与[あた]える力[ちから]がある。"
  33: "わたしは誰[だれ]の銀[ぎん]も金[きん]も衣服[いふく]も欲[ほ]しがったことはない。"
  34: "あなたがた自身[じしん]が知[し]っているとおり、この両手[りょうて]は、わたし自身[じしん]の必要[ひつよう]と、わたしとともにいた者[もの]たちの必要[ひつよう]を満[み]たしてきた。"
  35: "あなたがたにすべてのことを手本[てほん]として示[しめ]した。このように労[ろう]して弱[よわ]い者[もの]を支[ささ]え、主[しゅ]イエスご自身[じしん]が言[い]われた言葉[ことば]、『受[う]けるよりも与[あた]えるほうが、むしろ幸[さいわ]いである』を覚[おぼ]えておくべきである。」"
  36: "こう言[い]ってから、パウロは皆[みな]とともにひざまずいて祈[いの]った。"
  37: "人々[ひとびと]は皆[みな]、大[おお]いに泣[な]いた。彼[かれ]らはパウロの首[くび]に抱[だ]きついて、口[くち]づけし、"
  38: "とりわけ、もはや自分[じぶん]の顔[かお]を見[み]ることはない、とパウロが言[い]ったその言葉[ことば]のゆえに、深[ふか]く悲[かな]しんだ。そして、彼[かれ]を舟[ふね]まで見送[みおく]った。"

notes:
  3: "ἐπιβουλή — заговор; 陰謀. Павел уже собирался отплыть в Сирию, но переменил путь."
  4: "Спутники: Сосипатр (Сопатр) Пирров, верийский; Аристарх и Секунд фессалоникийские; Гай дервийский; Тимофей; асийцы Тихик и Трофим. ピロの子 — Πύρρου, «сын Пирра»."
  6: "τὰ ἄζυμα — опресноки, праздник сразу после Пасхи; 種なしパン祭り, сноска. Пять дней пути и семь дней стоянки — 五日の航海, 七日の滞在."
  7: "μιᾷ τῶν σαββάτων — «первый день недели», то есть воскресенье; 週の初めの日. κλάσαι ἄρτον — «преломить хлеб»; パンを裂く."
  9: "τρίστεγον — третий этаж; 三階. ὕπνῳ βαθεῖ — «глубоким сном»; 深い眠り."
  10: "ἡ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν — «душа (жизнь) его в нём»; 命はまだその中にある. Слова Павла — не красные."
  13: "πεζεύειν — «идти пешком»; 歩いて行く. ἀναλαμβάνειν — «принять на борт»; 乗せてやる."
  15: "В критической базе нет «и, пробыв в Трогиллии»; церковный текст (Елизаветинская, Синодальный, jp-joc「トロギリヤに泊まりて」) читает его — поэтому 〔トロギリオンに寄って〕. ἄντικρυς Χίου — «напротив Хиоса»; キオスに向かい合う所."
  16: "πεντηκοστή — Пятидесятница; 五旬節. παραπλεῦσαι — «проплыть мимо»; 沖過ぎ."
  19: "ταπεινοφροσύνη — смиренномудрие; 謙遜. πειρασμοί — 試練."
  21: "В базе πίστιν εἰς τὸν κύριον ἡμῶν Ἰησοῦν без Χριστός; в Byzantine и jp-joc「イイススハリストス」 — с Христом. Оставлено без добавления, чтобы не дробить формулу 〔…〕."
  23: "τὸ πνεῦμα τὸ ἅγιον — Святой Дух; 聖霊 (пара с 聖神). δεσμά — узы, цепи; 鎖."
  24: "δρόμος — «поприще, течение»; 走るべき道. εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ — 神の恵みの福音."
  28: "В критической базе τὴν ἐκκλησίαν τοῦ θεοῦ — «церковь Божию»; церковный текст (Елизаветинская, Синодальный «церковь Господа и Бога», jp-joc「主神が己の血を以て獲たる教会」) читает κυρίου καὶ θεοῦ, поэтому 〔主である〕 при 神の教会. ἐπίσκοποι — «блюстители»; 監督. «Своею кровию» — 御自身の血, без смягчения."
  29: "λύκοι βαρεῖς — «тяжкие, лютые волки»; 獰猛な狼."
  30: "διεστραμμένα — «извращённое»; 曲がったこと. ἀποσπᾶν — «отвлекать, увлекать за собой»; 引き離す."
  32: "κληρονομία ἐν τοῖς ἡγιασμένοις — «наследие среди всех освящённых»; 嗣業. οἰκοδομῆσαι — «созидать»; 建て上げる."
  35: "ἀντιλαμβάνεσθαι τῶν ἀσθενούντων — «поддерживать немощных»; 弱い者を支える. Изречение «блаженнее давать, чем принимать» — слова Господа, не записанные в Евангелиях (ἄγραφον); в речи Павла, по правилу партии оставлено чёрным."
  37: "κατεφίλουν — осыпали поцелуями; 口づけし. ἐπιπεσόντες ἐπὶ τὸν τράχηλον — «пали на шею»; 首に抱きついて."
  38: "ὀδυνώμενοι — «скорбя, терзаясь»; 深く悲しんだ. προέπεμπον — «провожали»; 舟まで見送った."
