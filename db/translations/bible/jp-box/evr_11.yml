verses:
  1: "信仰[しんこう]とは、望[のぞ]んでいるものの確信[かくしん]、まだ見[み]ていないものの証[あかし]である。"
  2: "昔[むかし]の人[ひと]たちは、この信仰[しんこう]によって証[あかし]を受[う]けた。"
  3: "信仰[しんこう]によって、わたしたちは、世界[せかい]が神[かみ]の言葉[ことば]によって形作[かたちづく]られたこと、また、見[み]えるものが、現[あらわ]れているものから生[う]まれたのではないことを理解[りかい]する。"
  4: "信仰[しんこう]によって、アベルはカインよりも良[よ]いいけにえを神[かみ]にささげた。それによって、彼[かれ]は正[ただ]しい者[もの]であるという証[あかし]を受[う]けた。神[かみ]が彼[かれ]のささげ物[もの]について証[あかし]してくださったのである。彼[かれ]は死[し]んでなお、それによって語[かた]っている。"
  5: "信仰[しんこう]によって、エノクは死[し]を見[み]ることなく移[うつ]された。神[かみ]が彼[かれ]を移[うつ]されたので、彼[かれ]は見[み]いだされなかった。移[うつ]される前[まえ]に、彼[かれ]が神[かみ]に喜[よろこ]ばれた者[もの]であるという証[あかし]を受けていたからである。"
  6: "信仰[しんこう]がなければ、神[かみ]に喜[よろこ]ばれることはできない。神[かみ]に近[ちか]づく者[もの]は、神[かみ]がおられること、また、神[かみ]を求[もと]める者[もの]に報[むく]いを与[あた]えてくださることを信[しん]じなければならない。"
  7: "信仰[しんこう]によって、ノアは、まだ見[み]ないことについて告[つ]げられると、敬[つつし]みをもって、家族[かぞく]を救[すく]うために箱舟[はこぶね]を造[つく]った。それによって彼[かれ]は世[よ]を罪[つみ]に定[さだ]め、信仰[しんこう]による義[ぎ]の相続人[そうぞくにん]となった。"
  8: "信仰[しんこう]によって、アブラハムは、相続[そうぞく]の地[ち]として受[う]けることになる地[ち]へ出[で]て行[ゆ]くよう召[め]されたとき、それに従[したが]い、どこへ行[ゆ]くのかも知[し]らずに出[で]て行[ゆ]った。"
  9: "信仰[しんこう]によって、彼[かれ]は約束[やくそく]の地[ち]に、他国[たこく]にいる者[もの]のように寄留[きりゅう]し、同[おな]じ約束[やくそく]を相続[そうぞく]するイサク、ヤコブとともに天幕[てんまく]に住[す]んだ。"
  10: "彼[かれ]は、基[きそ]のある都[みやこ]、すなわち、設計[せっけい]し建設[けんせつ]する方[かた]が神[かみ]である都[みやこ]を待[ま]ち望[のぞ]んでいたからである。"
  11: "信仰[しんこう]によって、サラ自身[じしん]も、不妊[ふにん]の身[み]でありながら、年齢[ねんれい]の盛[さか]りを過[す]ぎて妊娠[にんしん]する力[ちから]を受[う]けた。約束[やくそく]してくださった方[かた]を真実[しんじつ]な方[かた]だと考えたからである。"
  12: "それゆえ、一人[ひとり]の者[もの]から、しかも、もはや死[し]んだも同然[どうぜん]の者[もの]から、天[てん]の星[ほし]のように多[おお]く、海辺[うみべ]の数[かぞ]えきれない砂[すな]のように多[おお]い者[もの]が生[う]まれたのである。"
  13: "これらすべての人[ひと]たちは、信仰[しんこう]を抱[いだ]いたまま死[し]んだ。約束[やくそく]のものを受[う]けることなく、ただ遠[とお]くからそれを見[み]て迎[むか]え、自分[じぶん]たちは地上[ちじょう]の旅人[たびびと]であり寄留者[きりゅうしゃ]であると告白[こくはく]したのである。"
  14: "このように言[い]う者[もの]たちは、自分[じぶん]たちが故郷[こきょう]を求[もと]めていることを示[しめ]している。"
  15: "もし彼[かれ]らが、自分[じぶん]たちが出[で]てきたその土地[とち]を思[おも]っていたなら、戻[もど]る機会[きかい]はあったはずである。"
  16: "しかし、彼[かれ]らは、さらに優[すぐ]れた故郷[こきょう]、すなわち、天[てん]にあるものを慕[した]っている。それゆえ、神[かみ]は、彼[かれ]らの神[かみ]と呼[よ]ばれることを恥[は]じとされない。神[かみ]は彼[かれ]らのために都[みやこ]を用意[ようい]しておられたのである。"
  17: "信仰[しんこう]によって、アブラハムは試[こころ]みを受[う]けたとき、イサクをささげた。約束[やくそく]を受[う]けていた者[もの]が、そのひとり子[ご]をささげたのである。"
  18: "その人[ひと]には、「イサクによって、あなたの子孫[しそん]が名[な]づけられる」と告[つ]げられていたのである。"
  19: "彼[かれ]は、神[かみ]が死者[ししゃ]の中[なか]からも起[お]こすことができると考[かんが]えていた。それゆえ、彼[かれ]はイサクを、たとえとして受[う]け取[と]り戻[もど]したのである。"
  20: "信仰[しんこう]によって、イサクは、来[きた]るべきものについて、ヤコブとエサウを祝福[しゅくふく]した。"
  21: "信仰[しんこう]によって、ヤコブは、死[し]につつあるとき、ヨセフの子[こ]らをひとりひとり祝福[しゅくふく]し、杖[つえ]の先[さき]によりかかって礼拝[れいはい]した。"
  22: "信仰[しんこう]によって、ヨセフは、生涯[しょうがい]の終[お]わりに、イスラエルの子[こ]らがエジプトから出[で]て行[ゆ]くことを語[かた]り、自分[じぶん]の骨[ほね]について命[めい]じた。"
  23: "信仰[しんこう]によって、モーセは生[う]まれたとき、三[さん]か月[げつ]、両親[りょうしん]によって隠[かく]された。彼[かれ]らは、その子[こ]が美[うつく]しいのを見[み]て、王[おう]の命令[めいれい]を恐[おそ]れなかったからである。"
  24: "信仰[しんこう]によって、モーセは、成人[せいじん]したとき、ファラオの娘[むすめ]の子[こ]と自称[じしょう]することを拒[こば]み、"
  25: "むしろ、神[かみ]の民[たみ]とともに苦[くる]しむことを選[えら]び、一時[いちじ]の罪[つみ]の楽[たの]しみを選[えら]ばなかった。"
  26: "彼[かれ]は、キリストのため受[う]ける辱[はずかし]めを、エジプトの宝[たから]よりも大[おお]きな富[とみ]と考[かんが]えた。報[むく]いを仰[あお]ぎ見[み]ていたからである。"
  27: "信仰[しんこう]によって、彼[かれ]は王[おう]の怒[いか]りを恐[おそ]れずにエジプトを去[さ]り、見[み]えない方[かた]を見[み]ているかのように耐[た]え忍[しの]んだ。"
  28: "信仰[しんこう]によって、彼[かれ]は過越[すぎこし]の祭[まつり]と血[ち]を塗[ぬ]ることを行[おこな]い、滅[ほろ]ぼす者[もの]が長子[ちょうし]たちに触[ふ]れないようにした。"
  29: "信仰[しんこう]によって、彼[かれ]らは紅海[こうかい]を乾[かわ]いた陸地[りくち]のように渡[わた]った。エジプト人[じん]たちはそれを試[こころ]みて、溺[おぼ]れた。"
  30: "信仰[しんこう]によって、エリコの城壁[じょうへき]は、七[なな]日間[にちかん]巡[めぐ]り歩[ある]いた後[のち]に崩[くず]れた。"
  31: "信仰[しんこう]によって、遊女[ゆうじょ]ラハブは、斥候[せっこう]たちを安[やす]らかに迎[むか]え入[い]れたので、不従順[ふじゅうじゅん]な者[もの]たちとともに滅[ほろ]びなかった。"
  32: "これ以上[いじょう]、何[なに]を言[い]おうか。ギデオン、バラク、サムソン、エフタ、ダビデ、サムエル、また預言者[よげんしゃ]たちのことを語[かた]ろうとすれば、わたしには時[とき]が足[た]りない。"
  33: "彼[かれ]らは信仰[しんこう]によって、国々[くにぐに]を打[う]ち負[ま]かし、正[ただ]しいことを行[おこな]い、約束[やくそく]のものを得[え]、獅子[しし]の口[くち]をふさぎ、"
  34: "火[ひ]の勢[いきお]いを消[け]し、剣[つるぎ]の刃[やいば]を逃[のが]れ、弱[よわ]さから強[つよ]さへと変[か]えられ、戦[たたか]いで勇[いさ]ましく、他国[たこく]の軍勢[ぐんぜい]を退[しりぞ]けた。"
  35: "女[おんな]たちは、復活[ふっかつ]によって自分[じぶん]の死者[ししゃ]たちを受[う]け取[と]り戻[もど]した。しかし、ほかの者[もの]たちは、さらに優[すぐ]れた復活[ふっかつ]を得[え]るために、解[と]放[ほう]を受[う]け入[い]れず、拷問[ごうもん]にかけられ、"
  36: "また、ほかの者[もの]たちは、嘲[あざけ]りや鞭[むち]打[う]ち、さらに鎖[くさり]や牢獄[ろうごく]の試[こころ]みを受[う]け、"
  37: "石[いし]で打[う]たれ、のこぎりで引[ひ]かれ、〔試[こころ]みられ、〕剣[つるぎ]にかかって死[し]に、羊[ひつじ]や山羊[やぎ]の皮[かわ]をまとって、乏[とぼ]しく、苦[くる]しめられ、虐[しいた]げられて、"
  38: "この世[よ]が彼[かれ]らにふさわしくなかったのである。彼[かれ]らは荒野[こうや]、山々[やまやま]、洞窟[どうくつ]、地[ち]の穴[あな]をさまよっていた。"
  39: "これらすべての人[ひと]たちは、その信仰[しんこう]によって証[あかし]を受[う]けたものの、約束[やくそく]のものは受[う]けなかった。"
  40: "神[かみ]は、わたしたちのために、さらに良[よ]いことを備[そな]えておられたからである。それは、彼[かれ]らが、わたしたちなしに完全[かんぜん]な者[もの]とされないためである。"

notes:
  1: "Ἔστιν δὲ πίστις ἐλπιζομένων ὑπόστασις — 信仰とは、望んでいるものの確信; ὑπόστασις — «основание, подлинное стояние» (в 1:3 — «ипостась»), передано 確信[かくしん]. πραγμάτων ἔλεγχος οὐ βλεπομένων — まだ見ていないものの証; ἔλεγχος — «доказательство, изобличение», передано 証[あかし] (термин книги, ср. 11:2,4,5,39)."
  2: "ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι — 昔の人たちは、この信仰によって証を受けた; πρεσβύτεροι здесь — люди древности, не пресвитеры, поэтому 昔[むかし]の人[ひと]たち. ἐμαρτυρήθησαν — «получили свидетельство» (ср. 11:4,5)."
  3: "Πίστει νοοῦμεν — 信仰によって…理解する; νοέω — «постигать умом». κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ — 世界が神の言葉によって形作られた; αἰῶνες здесь — «веки» в смысле мир, 世界[せかい]. εἰς τὸ μὴ ἐκ φαινομένων τὸ βλεπόμενον γεγονέναι — 見えるものが、現れているものから生まれたのではない; φαινόμενα и βλεπόμενον различаются, различие сохранено."
  4: "Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν — アベルはカインよりも良い犠牲をささげた (Быт 4:3–5). δι᾽ ἧς ἐμαρτυρήθη εἶναι δίκαιος — それによって正しい者であるという証を受けた. μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ — 神が彼のささげ物について証ししてくださった. ἀποθανὼν ἔτι λαλεῖ — 死んでなお語っている."
  5: "Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον — エノクは死を見ることなく移された (Быт 5:24). οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός — 神が彼を移されたので、見いだされなかった. πρὸ γὰρ τῆς μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ — 移される前に、神に喜ばれた者であるという証を受けていた; ἐμαρτυρήθη + inf. — «засвидетельствовано, что он угодил Богу». Отсылка к Быт 5:24 без вводной формулы, поэтому 「…」 нет."
  6: "χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι — 信仰がなければ、神に喜ばれることはできない. πιστεῦσαι γὰρ δεῖ — 信じなければならない. ὅτι ἔστιν — 神がおられること (бытие Бога, не «что Он есть»). μισθαποδότης γίνεται — 報いを与えてくださる (μισθαποδότης — «воздаятель», ср. 10:35; 11:26)."
  7: "χρηματισθεὶς περὶ τῶν μηδέπω βλεπομένων — まだ見ないことについて告げられると; χρηματίζω — «получать откровение, божественное указание». εὐλαβηθεὶς — 敬みをもって (εὐλάβεια — благоговение, ср. 5:7; 12:28). κατέκρινεν τὸν κόσμον — 世を罪に定め. τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος — 信仰による義の相続人となった."
  8: "Πίστει καλούμενος Ἀβραάμ — アブラハム…召されたとき (Быт 12:1–4). ὑπήκουσεν ἐξελθεῖν — 出て行くことに従い. εἰς τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν — 相続の地として受けることになる地へ. ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται — どこへ行くのかも知らずに出て行った; настоящее ἔρχεται сохранено."
  9: "παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν — 約束の地に、他国にいる者のように寄留し; παροικέω — «жить пришельцем» (ср. 11:13; Еф 2:19). ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακώβ — イサク、ヤコブとともに天幕に住んだ; σκηναί здесь — шатры патриархов, поэтому 天幕[てんまく], а не 幕屋[まくや] (скиния в книге — 幕屋). τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς — 同じ約束を相続する者たち."
  10: "ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν — 基のある都を待ち望んでいた; ἐκδέχομαι — ср. 10:13. ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός — 設計し建設する方が神である; τεχνίτης — «художник, зодчий», δημιουργός — «создатель»."
  11: "Πίστει καὶ αὐτὴ Σάρρα στεῖρα — 信仰によって、サラ自身も、不妊の身でありながら; στεῖρα в базе есть, 〔…〕 не ставятся. δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν — 妊娠する力を受けた. παρὰ καιρὸν ἡλικίας — 年齢の盛りを過ぎて (букв. «вне времени возраста»). πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον — 約束してくださった方を真実な方だと考えた."
  12: "διὸ καὶ ἀφ᾽ ἑνὸς ἐγεννήθησαν — それゆえ、一人の者から…生まれた. καὶ ταῦτα νενεκρωμένου — しかも、もはや死んだも同じような者から; νενεκρωμένου — perfect pass., «умерщвлённого». καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει — 天の星のように多く. ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος — 海辺の数えきれない砂."
  13: "Κατὰ πίστιν ἀπέθανον οὗτοι πάντες — これらすべての人たちは、信仰を抱いたまま死んだ. μὴ κομισάμενοι τὰς ἐπαγγελίας — 約束のものを受けることなく; κομίζω — ср. 10:36. πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι — 遠くからそれを見て迎え; ἀσπάζομαι — «приветствовать», здесь «приветствовать издали». ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς — 地上の旅人であり寄留者; παρεπίδημος — «временный житель»."
  14: "οἱ γὰρ τοιαῦτα λέγοντες — このように言う者たち. ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν — 自分たちが故郷を求めていることを示している; ἐμφανίζω — «являть, показывать», πατρίς — 故郷[こきょう]."
  15: "καὶ εἰ μὲν ἐκείνης μνημονεύουσιν ἀφ᾽ ἧς ἐξέβησαν — もし彼らが、出てきたその土地を思っていたなら. εἶχον ἂν καιρὸν ἀνακάμψαι — 戻る機会はあったはずである; ἀνακάμπτω — «возвращаться»."
  16: "νῦν δὲ κρείττονος ὀρέγονται, τοῦτ᾽ ἔστιν ἐπουρανίου — しかし、さらに優れた故郷、すなわち天にあるものを慕っている; ὀρέγομαι — «стремиться». οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν — 神は、彼らの神と呼ばれることを恥じとされない (ср. Исх 3:6). ἡτοίμασεν γὰρ αὐτοῖς πόλιν — 彼らのために都を用意しておられた."
  17: "Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαάκ πειραζόμενος — アブラハムは試みを受けたとき、イサクをささげた (Быт 22). τὸν μονογενῆ προσέφερεν — そのひとり子をささげた; μονογενής — ひとり子[ご] (о Исааке, хотя у Авраама был и Измаил; слово сохранено). ὁ τὰς ἐπαγγελίας ἀναδεξάμενος — 約束を受けていた者."
  18: "πρὸς ὃν ἐλαλήθη — その人には…告げられていた. Быт 21:12: Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα — イサクによって、あなたの子孫が名づけられる; цитата с ὅτι, поэтому 「…」."
  19: "λογισάμενος ὅτι καὶ ἐκ νεκρῶν ἐγείρειν δυνατὸς ὁ θεός — 神は死者の中からも起こすことができると考えていた. ὅθεν αὐτὸν καὶ ἐν παραβολῇ ἐκομίσατο — それゆえ、イサクを、たとえとして受け取り戻した; ἐν παραβολῇ — «образно, в предызображение» (не «в притче»), не сглажено."
  20: "Πίστει καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ — イサクは、来るべきものについて、ヤコブとエサウを祝福した (Быт 27:27–29,39–40)."
  21: "Πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν — ヤコブは、死につつあるとき、ヨセフの子らをひとりひとり祝福し (Быт 48). προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ — 杖の先によりかかって礼拝した (Быт 47:31 LXX ἐπὶ τὸ ἄκρον τῆς ῥάβδου; евр. текст — «на голову постели», расхождение не сглажено)."
  22: "Πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν — ヨセフは、生涯の終わりに、イスラエルの子らがエジプトから出て行くことを語り (Быт 50:24–25). περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο — 自分の骨について命じた."
  23: "Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ — モーセは生まれたとき、三か月、両親によって隠された (Исх 2:2). ἀστεῖον τὸ παιδίον — その子が美しい. οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως — 王の命令を恐れなかった."
  24: "Πίστει Μωϋσῆς μέγας γενόμενος — モーセは、成人したとき; μέγας γενόμενος — «став взрослым», не «великим». ἠρνήσατο λέγεσθαι υἱὸς θυγατρὸς Φαραώ — ファラオの娘の子と自称することを拒み."
  25: "μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ — むしろ、神の民とともに苦しむことを選び; συγκακουχέω — «терпеть зло вместе». ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν — 一時の罪の楽しみを持つよりも; ἀπόλαυσις — «наслаждение»."
  26: "μείζονα πλοῦτον ἡγησάμενος τῶν Αἰγύπτου θησαυρῶν τὸν ὀνειδισμὸν τοῦ Χριστοῦ — キリストのため受ける辱めを、エジプトの宝よりも大きな富と考えた; ὀνειδισμὸς τοῦ Χριστοῦ — «поношение Христово» (ср. 13:13). ἀπέβλεπεν γὰρ εἰς τὴν μισθαποδοσίαν — 報いを仰ぎ見ていた."
  27: "Πίστει κατέλιπεν Αἴγυπτον — 信仰によってエジプトを去り. μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως — 王の怒りを恐れずに. τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν — 見えない方を見ているかのように耐え忍んだ; ἐγκαρτερέω — «быть стойким»."
  28: "Πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος — 過越の祭りと血を塗ることを行い (Исх 12). πρόσχυσις — «кропление, помазание кровью». ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν — 滅ぼす者が長子たちに触れないように; ὁ ὀλοθρεύων — «губитель»."
  29: "Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς γῆς — 紅海を乾いた陸地のように渡った (Исх 14). ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπώθησαν — エジプト人たちはそれを試みて、溺れた; πεῖραν λαμβάνω — «испытать на опыте»."
  30: "Πίστει τὰ τείχη Ἰεριχὼ ἔπεσαν κυκλωθέντα ἐπὶ ἑπτὰ ἡμέρας — エリコの城壁は、七日間巡り歩いた後に崩れた (Нав 6); κυκλωθέντα — «обойдённые вокруг»."
  31: "Πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν — 遊女ラハブは、不従順な者たちとともに滅びなかった (Нав 2; 6:25). δεξαμένη τοὺς κατασκόπους μετ᾽ εἰρήνης — 斥候たちを安らかに迎え入れた; μετ᾽ εἰρήνης — «с миром», не добавлено."
  32: "Καὶ τί ἔτι λέγω — これ以上、何を言おうか. ἐπιλείψει με γὰρ διηγούμενον ὁ χρόνος — 語ろうとすれば、わたしには時が足りない; ἐπιλείπω — «оставлять, недоставать». Имена: Γεδεών, Βαρράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουήλ — ギデオン、バラク、サムソン、エフタ、ダビデ、サムエル."
  33: "οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας — 国々を打ち負かし; καταγωνίζομαι — «побеждать в борьбе». εἰργάσαντο δικαιοσύνην — 正しいことを行い. ἐπέτυχον ἐπαγγελιῶν — 約束のものを得. ἔφραξαν στόματα λεόντων — 獅子の口をふさいだ (Самсон, Даниил)."
  34: "ἔσβεσαν δύναμιν πυρός — 火の勢いを消し. ἔφυγον στόματα μαχαίρης — 剣の刃を逃れ. ἐδυναμώθησαν ἀπὸ ἀσθενείας — 弱さから強さへと変えられ; ἀπό — «от, из», передано «от немощи к силе». παρεμβολὰς ἔκλιναν ἀλλοτρίων — 他国の軍勢を退けた; κλίνω — «обращать в бегство», παρεμβολή — «стан, войско»."
  35: "ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν — 女たちは、死者たちを復活させて受け取り戻した (3 Цар 17:23; 4 Цар 4:36). ἐτυμπανίσθησαν — 拷問にかけられ; τυμπανίζω — «бить, пытать» (букв. «бить в тимпан»). οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν — 解放を受け入れず; ἀπολύτρωσις здесь — «освобождение, выкуп», не «искупление» (ср. 9:12,15), поэтому 解[と]放[ほう]. ἵνα κρείττονος ἀναστάσεως τύχωσιν — さらに優れた復活を得るために."
  36: "ἕτεροι δὲ ἐμπαιγμῶν καὶ μαστίγων πεῖραν ἔλαβον — また、ほかの者たちは、嘲りや鞭打ちの試みを受け; πεῖραν λαμβάνω — ср. 11:29. ἔτι δὲ δεσμῶν καὶ φυλακῆς — さらに鎖や牢獄の."
  37: "ἐλιθάσθησαν, ἐπρίσθησαν — 石で打たれ、のこぎりで引かれ; πρίζω — «перепиливать». В базе нет ἐπειράσθησαν, церковный текст (Елизаветинская «искушени быша», jp-joc「拷問に遇はせられ」) читает с ним — 〔試みられ〕. ἐν φόνῳ μαχαίρης ἀπέθανον — 剣にかかって死に. ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν — 羊や山羊の皮をまとって; μηλωτή — «овечья шкура». ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι — 乏しく、苦しめられ、虐げられて."
  38: "ὧν οὐκ ἦν ἄξιος ὁ κόσμος — この世が彼らにふさわしくなかった; порядок греч. сохранён: сначала оценка, затем скитания. ἐπὶ ἐρημίαις πλανώμενοι — 荒野をさまよっていた; ἐπὶ + dat. — «по». ὀπαῖς τῆς γῆς — 地の穴."
  39: "Καὶ οὗτοι πάντες μαρτυρηθέντες διὰ τῆς πίστεως — これらすべての人たちは、その信仰によって証を受けたものの. οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν — 約束のものは受けなかった (ср. 11:13; 10:36)."
  40: "τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου — 神は、わたしたちのために、さらに良いことを備えておられた; προβλέπω — «предусматривать». ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν — 彼らが、わたしたちなしに完全な者とされないため; τελειόω — термин книги (ср. 10:14)."
