# jp-box, Сирах, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: 1–2 грех и покаяние; 3–10 образы греха (меч, дом, пакля, яма); 5 бедняк
# и суд; 6–8 страх Господень, язык, чужое имение; 11–28 притчи о мудром и глупом
# (уста, знание, наказание, смех, стыд, сатана, наушник).
# Прямой речи нет (поучение и притчи); красного и синего нет.
# Нумерация по gr: 28 стихов. Слав. — 31: csl 2–3 делят gr 2 (змея / зубы льва),
# csl 12–13 — gr 11, csl 14–15 — gr 12; с gr 13 csl идёт на +3. Лишние слав. стихи
# влиты в соответствующие греческие, стихи не добавлялись.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 罪, 知恵, 主, よみ и пр.
# уже в корпусе. Имена — транслитерация греческого (LXX).

tr_code: jp-box
book: prsir
chapter: 21
draft: true

verses:
  1: "子[こ]よ、罪[つみ]を犯[おか]したか。もはや重[かさ]ねてはならない。以前[いぜん]の罪[つみ]については祈[いの]りなさい。"
  2: "蛇[へび]の顔[かお]から逃[に]げるように、罪[つみ]から逃げよ。もし近[ちか]づけば、あなたに噛[か]みつく。獅子[しし]の歯[は]がその歯であり、人[ひと]の魂[たましい]を滅[ほろ]ぼす。"
  3: "もろ刃[は]の剣[つるぎ]のように、すべての不法[ふほう]はそうである。その傷[きず]に癒[いや]しはない。"
  4: "脅[おど]かしと侮辱[ぶじょく]は富[とみ]を荒[あ]らす。そのように、高慢[こうまん]な者[もの]の家[いえ]も荒れる。"
  5: "貧[まず]しい者[もの]の祈[いの]りは、その口[くち]から自分[じぶん]の耳[みみ]にまで届[とど]くだけであり、彼[かれ]に対する裁[さば]きは速[すみ]やかに来[く]る。"
  6: "戒[いまし]めを憎[にく]む者[もの]は罪人[つみびと]の足跡[あしあと]をたどる。しかし主[しゅ]を恐[おそ]れる者[もの]は心[こころ]を向[む]け直[なお]す。"
  7: "舌[した]の強[つよ]い者[もの]は遠[とお]くから知[し]られる。しかし悟[さと]りのある者[もの]は、彼[かれ]がつまずくときのことを知っている。"
  8: "自分[じぶん]の家[いえ]を他人[たにん]の財[ざい]で建[た]てる者[もの]は、自分の墓[はか]のために石[いし]を集[あつ]める者[もの]のようだ。"
  9: "不法[ふほう]な者[もの]たちの集[つど]いは、集[あつ]められた麻[あさ]くずのようであり、その終[お]わりは炎[ほのお]である。"
  10: "罪人[つみびと]の道[みち]は石[いし]でならされている。しかしその終[お]わりには、よみの穴[あな]がある。"
  11: "律法[りっぽう]を守[まも]る者[もの]は自分[じぶん]の思[おも]いを制[し]する。そして主[しゅ]を恐[おそ]れることの完成[かんせい]は知恵[ちえ]である。"
  12: "こうかつでない者[もの]は戒[いまし]めを受[う]けない。しかし、苦[にが]さを増[ふ]やすこうかつさもある。"
  13: "知恵[ちえ]ある者[もの]の知識[ちしき]は洪水[こうずい]のように増[ふ]え、その助言[じょげん]は命[いのち]の泉[いずみ]のようになる。"
  14: "愚[おろ]かな者[もの]の腹[はら]は壊[こわ]れた器[うつわ]のようであり、どんな知識[ちしき]も保[たも]つことができない。"
  15: "分別[ふんべつ]ある者[もの]が知恵[ちえ]ある言葉[ことば]を聞[き]けば、それをほめ、さらにその上[うえ]に付[つ]け加[くわ]える。遊[あそ]び暮[く]らす者[もの]はそれを聞いて気[き]に入[い]らず、自分[じぶん]の背中[せなか]の後[うし]ろへ投[な]げやった。"
  16: "愚[おろ]かな者[もの]の話[はなし]は道[みち]での荷[に]のようである。しかし悟[さと]りのある者[もの]の唇[くちびる]には{恵[めぐ]み|恩寵[おんちょう]}が見[み]いだされる。"
  17: "分別[ふんべつ]ある者[もの]の口[くち]は集会[しゅうかい]で求[もと]められ、その言葉[ことば]は心[こころ]のうちで思[おも]いめぐらされる。"
  18: "荒[あ]れ果[は]てた家[いえ]のように、愚[おろ]かな者[もの]にとって知恵[ちえ]はそうである。無[む]分別[ふんべつ]な者[もの]の知識[ちしき]は、筋[すじ]の通[とお]らない言葉[ことば]である。"
  19: "愚[おろ]かな者[もの]の足[あし]には戒[いまし]めが枷[かせ]となり、右手[みぎて]には手枷[てかせ]のようになる。"
  20: "愚[おろ]かな者[もの]は笑[わら]いのうちに声[こえ]を上[あ]げる。しかし、こうかんな男[おとこ]はやっと静[しず]かにほほえむ。"
  21: "分別[ふんべつ]ある者[もの]には戒[いまし]めが金[きん]の飾[かざ]りのようであり、右[みぎ]の腕[うで]には腕輪[うでわ]のようである。"
  22: "愚[おろ]かな者[もの]の足[あし]は家[いえ]へと速[はや]く向[む]かう。しかし、多[おお]くの経験[けいけん]を積[つ]んだ人[ひと]は、人[ひと]の顔[かお]の前[まえ]で恥[は]じる。"
  23: "愚[おろ]かな者[もの]は戸口[とぐち]から家[いえ]の内[うち]をのぞき込[こ]む。しかし、よく教[おし]えられた男[おとこ]は外[そと]に立[た]っている。"
  24: "人[ひと]が戸[と]のそばでじっと耳[みみ]を澄[す]ますのは無[む]教養[きょうよう]である。しかし、分別[ふんべつ]ある者[もの]はその不名誉[ふめいよ]を重[おも]く受[う]けとめる。"
  25: "他人[たにん]の唇[くちびる]はこれらのことを語[かた]り、分別[ふんべつ]ある者[もの]の言葉[ことば]は秤[はかり]にかけられる。"
  26: "愚[おろ]かな者[もの]の心[こころ]はその口[くち]にあり、知恵[ちえ]ある者[もの]の口[くち]はその心[こころ]にある。"
  27: "不敬[ふけい]な者[もの]がサタンを呪[のろ]うとき、彼[かれ]は自分[じぶん]の魂[たましい]を呪っているのである。"
  28: "ささやく者[もの]は自分[じぶん]の魂[たましい]を汚[けが]し、寄留[きりゅう]の地[ち]で憎[にく]まれる。"

notes:
  1: "Τέκνον — «дитя» (слав. «чадо»). ἥμαρτες — аор. от ἁμαρτάνω, «согрешил ли?». μὴ προσθῇς μηκέτι — «не приложи ктому», т. е. не прибавляй больше. περὶ τῶν προτέρων σου δεήθητι — «о прежних твоих помолись»: πρότερα — прежние грехи; δεήθητι — импер. от δέομαι."
  2: "ὡς ἀπὸ προσώπου ὄφεως — «как от лица змея» (слав. «от лица змиина»). δήξεταί σε — «укусит тебя» (δάκνω). ὀδόντες λέοντος οἱ ὀδόντες αὐτῆς — «зубы льва — зубы её»: смена рода (ὄφεως → αὐτῆς) сохранена. Слав. делит стих на csl 21:2–3; держимся деления gr."
  3: "ῥομφαία δίστομος — «меч обоюдоострый» (слав. «мечь обоюду остр»). τῇ πληγῇ αὐτῆς οὐκ ἔστιν ἴασις — «ране её нет исцеления» (πληγή — удар, рана; ἴασις — исцеление)."
  4: "καταπληγμός — «поражение, устрашение» (слав. «прещение»). ὕβρις — «наглость, обида» (слав. «досаждение»). ἐρημώσουσιν πλοῦτον — «опустошат богатство»; οὕτως οἶκος ὑπερηφάνου — «так и дом гордого»."
  5: "δέησις πτωχοῦ ἐκ στόματος ἕως ὠτίων αὐτοῦ — «моление нищего от уст до ушей его»: его слышит только он сам (слав. «из уст до ушию его»). τὸ κρίμα αὐτοῦ κατὰ σπουδήν — «суд его поспешно» (слав. «со тщанием грядет»); αὐτοῦ понято как «над ним», в notes отмечено."
  6: "μισῶν ἐλεγμόν — «ненавидящий обличение» (ἐλεγμός; слав. «обличения»). ἐν ἴχνει ἁμαρτωλοῦ — «по следу грешника» (ἴχνος — след). ὁ φοβούμενος κύριον ἐπιστρέψει ἐν καρδίᾳ — «боящийся Господа обратится сердцем»."
  7: "γνωστὸς μακρόθεν — «узнаваем издалека». ὁ δυνατὸς ἐν γλώσσῃ — «сильный языком». νοήμων — «разумный, понимающий» (слав. «разумивый»). ἐν τῷ ὀλισθάνειν αὐτόν — «когда он поскользнётся» (ὀλισθάνω)."
  8: "χρήματα ἀλλότρια — «чужие деньги» (слав. «имение чужде»). εἰς χειμῶνα — «на зиму» (LXX); слав. читает «на гроб себе» (в могилу) — по паритету принято слав. чтение, вариант LXX отмечен здесь."
  9: "στιππύον — «пакля, очес» (слав. «изгребия»); συνηγμένον — «собранное». συναγωγὴ ἀνόμων — «собрание беззаконных». ἡ συντέλεια αὐτῶν φλὸξ πυρός — «конец их — пламя огня»."
  10: "ὡμαλισμένη ἐκ λίθων — «выровненная камнями» (ὁμαλίζω). ἐπ᾽ ἐσχάτων αὐτῆς βόθρος ᾅδου — «на последних её — яма ада»; ᾅδης по корпусу — よみ."
  11: "ὁ φυλάσσων νόμον — «хранящий закон». κατακρατεῖ τοῦ ἐννοήματος αὐτοῦ — «владеет помыслом своим» (ἐννόημα). συντέλεια τοῦ φόβου κυρίου σοφία — «совершение страха Господня — премудрость». Слав. делит на csl 21:12–13, обе половины в нашем ст. 11."
  12: "πανοῦργος — «искусный, хитрый» (слав. «коварен»). οὐ παιδευθήσεται — «не будет наказан (научен)». πανουργία πληθύνουσα πικρίαν — «хитрость, умножающая горечь» (πικρία)."
  13: "γνῶσις σοφοῦ — «знание мудрого». κατακλυσμός — «потоп, наводнение» (слав. «потоп»). ἡ βουλὴ αὐτοῦ ὡς πηγὴ ζωῆς — «совет его как источник жизни»."
  14: "ἔγκατα μωροῦ — «внутренности глупого» (слав. «утроба буяго»). ἀγγεῖον συντετριμμένον — «сосуд разбитый». πᾶσαν γνῶσιν οὐ κρατήσει — «всякого знания не удержит»."
  15: "λόγον σοφόν — «слово мудрое». ἐπιστήμων — «знающий, разумный». ὁ σπαταλῶν — «предающийся роскоши, гуляка» (слав. «буй»); ἀπήρεσεν αὐτῷ — «не понравилось ему»; ἀπέστρεψεν ὀπίσω τοῦ νώτου — «бросил за спину»."
  16: "ἐξήγησις μωροῦ — «рассказ глупого» (слав. «повесть буяго»). ὡς ἐν ὁδῷ φορτίον — «как в пути груз». ἐπὶ χείλους συνετοῦ εὑρεθήσεται χάρις — «на устах разумного найдётся благодать»: χάρις — пара {恵み|恩寵}."
  17: "στόμα φρονίμου ζητηθήσεται ἐν ἐκκλησίᾳ — «уста разумного будут искать в собрании» (ἐκκλησία — собрание, не храм). διανοηθήσονται ἐν καρδίᾳ — «будут обдумывать в сердце»."
  18: "Ὡς οἶκος ἠφανισμένος — «как дом уничтоженный» (ἀφανίζω). γνῶσις ἀσυνέτου ἀδιεξέταστοι λόγοι — «знание неразумного — неисследимые (бессмысленные) слова» (ἀδιεξέταστος)."
  19: "πέδαι ἐν ποσὶν ἀνοήτου παιδεία — «оковы на ногах неразумного — наказание». χειροπέδαι — «ручные оковы, кандалы» (слав. «ручнии оковы»). ἐπὶ χειρὸς δεξιᾶς — «на правой руке»."
  20: "μωρὸς ἐν γέλωτι ἀνυψοῖ φωνὴν αὐτοῦ — «глупый в смехе возвышает голос». ἀνὴρ πανοῦργος — «муж искусный». μόλις ἡσυχῇ μειδιάσει — «едва тихо улыбнётся»."
  21: "κόσμος χρυσοῦς — «золотое украшение» (κόσμος здесь украшение). χλιδών — «браслет, запястье» (слав. «обручь»). ἐπὶ βραχίονι δεξιῷ — «на правой руке (мышце)»."
  22: "ποὺς μωροῦ ταχὺς εἰς οἰκίαν — «нога глупого скора в дом»: лезет в чужой дом. πολύπειρος — «многоопытный» (слав. «многоискусный»). αἰσχυνθήσεται ἀπὸ προσώπου — «постыдится лица (людей)»."
  23: "ἄφρων ἀπὸ θύρας παρακύπτει εἰς οἰκίαν — «глупый из двери выглядывает в дом» (παρακύπτω). ὁ δὲ πεπαιδευμένος ἔξω στήσεται — «воспитанный же вне станет»."
  24: "ἀπαιδευσία ἀνθρώπου ἀκροᾶσθαι παρὰ θύραν — «невежество человека — слушать у двери» (ἀκροάομαι). ὁ φρόνιμος βαρυνθήσεται ἀτιμίᾳ — «разумный отяготится бесчестием» (ἀτιμία)."
  25: "χείλη ἀλλοτρίων ἐν τούτοις διηγήσονται — «уста чужих о том расскажут» (διηγέομαι). λόγοι φρονίμων ἐν ζυγῷ σταθήσονται — «слова разумных на весах станут» (ζυγός)."
  26: "ἐν στόματι μωρῶν ἡ καρδία αὐτῶν — «в устах глупых сердце их»; καρδία σοφῶν στόμα αὐτῶν — «сердце мудрых — уста их»: сохранён хиазм греческого."
  27: "καταρᾶσθαι ἀσεβῆ τὸν σατανᾶν — «когда нечестивый проклинает сатану» (καταράομαι, σατανᾶς — サタン). αὐτὸς καταρᾶται τὴν ἑαυτοῦ ψυχήν — «сам проклинает свою душу»."
  28: "ψιθυρίζων — «шептун, наушник» (слав. «шепотливый»). μολύνει τὴν ἑαυτοῦ ψυχήν — «оскверняет свою душу». ἐν παροικήσει μισηθήσεται — «в странничестве (пришельстве) возненавиден будет» (παροίκησις)."
