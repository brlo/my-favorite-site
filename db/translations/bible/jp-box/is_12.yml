# jp-box, Исаия, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 12 нет (фрагменты книги — 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: 1–2 благодарственная песнь спасённого; 3 вода из источников спасения;
# 4–6 призыв к народам и ликование Сиона. Вся песнь — прямая речь 「…」 с 1 по 6
# (вводная формула «и скажешь в тот день» — вне кавычек); в 12:4–6 — вложенная
# речь 『…』: это слова, которые народ скажет в тот день. Красного и синего нет.
# Нумерация по gr: 6 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет. Слав. в 12:2 короче LXX (нет «и спасусь в Нём»); по LXX внесено.
# Слав. «(от мене)» в 12:1 — редакционная помета в скобках, не внесена.
# Сносок ⟨…⟩ нет: 泉, 賛美, 栄光, 信頼 уже в корпусе.
# Имена — транслитерация греческого (LXX): シオン, イスラエル.

