verses:
  1: "その日[ひ]、あなたは言[い]う。「わたしはあなたをほめたたえる、主[しゅ]よ。あなたはわたしに怒[いか]られたが、その怒[いか]りを退[しりぞ]け、わたしをあわれまれたからである。"
  2: "見[み]よ、わたしの神[かみ]はわたしの救[すく]い、主[しゅ]である。わたしは彼[かれ]に信頼[しんらい]し、彼によって救[すく]われる。恐[おそ]れない。主[しゅ]はわたしの栄光[えいこう]、わたしの賛美[さんび]であり、わたしの救[すく]いとなられたからである。"
  3: "あなたがたは喜[よろこ]びをもって、救[すく]いの泉[いずみ]から水[みず]を汲[く]む。"
  4: "その日[ひ]、あなたは言[い]う。『主[しゅ]をほめたたえ、その名[な]を呼[よ]べ。その栄光[えいこう]を諸国[しょこく]の民[たみ]の間[あいだ]に告[つ]げ知[し]らせ、その名[な]の高[たか]く上[あ]げられたことを覚[おぼ]えていよ。"
  5: "主[しゅ]の名[な]をほめたたえよ。主[しゅ]は高[たか]いことをなされたからである。これを全[ぜん]地[ち]に告[つ]げ知[し]らせよ。"
  6: "シオンに住[す]む者[もの]たちよ、喜[よろこ]び躍[おど]り、楽[たの]しめ。イスラエルの聖[せい]なる方[かた]があなたがたのただ中[なか]で高[たか]く上[あ]げられたからである。』」"

notes:
  1: "ἐρεῖς ἐν τῇ ἡμέρᾳ ἐκείνῃ — «скажешь в тот день» (ед. ч.); вводная формула вне кавычек. εὐλογήσω σε — «благословлю Тебя» (ほめたたえる; слав. «благословлю и тя»). ὠργίσθης μοι — «Ты прогневался на меня»; ἀπέστρεψας τὸν θυμόν σου — «отвратил ярость Твою» (退ける); ἠλέησάς με — «помиловал меня» (あわれむ). Слав. «(от мене)» в скобках — редакционная помета, не внесена."
  2: "ἰδοὺ ὁ θεός μου σωτήρ μου κύριος — «вот Бог мой, спасение моё, Господь»: три имени без связки, отсюда わたしの神はわたしの救い、主である. πεποιθὼς ἔσομαι ἐπ᾽ αὐτῷ — «буду уповать на Него»; σωθήσομαι ἐν αὐτῷ — «спасусь в Нём»: этого нет в слав. («уповая буду на него и не убоюся»), но есть в LXX, внесено. ἡ δόξα μου καὶ ἡ αἴνεσίς μου κύριος — «слава моя и хвала моя — Господь»; ἐγένετό μοι εἰς σωτηρίαν — «стал мне во спасение»."
  3: "ἀντλήσετε ὕδωρ — «почерпнёте воду» (ἀντλέω — «черпать»); μετ᾽ εὐφροσύνης — «с веселием, с радостью»; ἐκ τῶν πηγῶν τοῦ σωτηρίου — «из источников спасения»: σωτήριον — «спасение» (слав. «спасения»), πηγή — 泉."
  4: "Ὑμνεῖτε κύριον — «воспевайте Господа» (ὑμνέω — «петь гимн»). βοᾶτε τὸ ὄνομα αὐτοῦ — «взывайте к имени Его» (呼べ). ἀναγγείλατε ἐν τοῖς ἔθνεσιν τὰ ἔνδοξα αὐτοῦ — «возвестите в народах славное Его» (その栄光を告げ知らせ). μιμνῄσκεσθε ὅτι ὑψώθη τὸ ὄνομα αὐτοῦ — «поминайте, что возвысилось имя Его». С 4-го стиха начинается вложенная речь 『…』, продолжающаяся до конца главы."
  5: "ὑμνήσατε τὸ ὄνομα κυρίου — «воспойте имя Господне»; ὅτι ὑψηλὰ ἐποίησεν — «ибо высокое сотворил», т. е. великое (高いこと). ἀναγγείλατε ταῦτα ἐν πάσῃ τῇ γῇ — «возвестите это по всей земле»."
  6: "ἀγαλλιᾶσθε καὶ εὐφραίνεσθε — «ликуйте и радуйтесь»: два глагола сохранены (喜び躍り、楽しめ). οἱ κατοικοῦντες Σιων — «живущие в Сионе»; ὁ ἅγιος τοῦ Ισραηλ — イスラエルの聖なる方; ἐν μέσῳ αὐτῆς — «посреди неё» (Сиона; слав. «посреде тебе»). Стих закрывает и вложенную 『…』, и всю песнь 「…」."
