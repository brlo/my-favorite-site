verses:
  1: "その日[ひ]、イエスは家[いえ]から出[で]て、湖[みずうみ]の岸[きし]に腰[こし]を下[お]ろしておられた。"
  2: "イエスのもとにはおびただしい群衆[ぐんしゅう]が集[あつ]まった。そこでイエスは舟[ふね]に乗[の]って腰[こし]を下[お]ろし、群衆[ぐんしゅう]はみな浜辺[はまべ]に立[た]っていた。"
  3: "イエスはたとえによって多[おお]くのことを彼[かれ]らに語[かた]られた。「<j>見[み]よ、蒔[ま]く者[もの]が種[たね]を蒔[ま]きに出[で]て来[き]た。</j>"
  4: "<j>蒔[ま]いているうちに、あるものは道[みち]のそばに落[お]ち、空[そら]の鳥[とり]に啄[ついば]まれてしまった。</j>"
  5: "<j>別[べつ]の種[たね]は石[いし]の多[おお]い所[ところ]に落[お]ちた。土[つち]が深[ふか]くなかったので、すぐ芽[め]を吹[ふ]いた。</j>"
  6: "<j>だが、日[ひ]が上[のぼ]ると焼[や]かれ、根[ね]が張[は]っていないので干[ひ]からびてしまった。</j>"
  7: "<j>ほかの種[たね]は茨[いばら]の中[なか]に落[お]ちた。すると、茨[いばら]が伸[の]びて覆[おお]いふさいだので、実[み]を結[むす]ばなかった。</j>"
  8: "<j>残[のこ]りの種[たね]は良[よ]い地[ち]に落[お]ち、実[み]を結[むす]んだ。百倍[ひゃくばい]になるものもあれば、六十倍[ろくじゅうばい]、三十倍[さんじゅうばい]になるものもあった。</j>"
  9: "<j>聞[き]く耳[みみ]を持[も]つ者[もの]は、聞[き]きなさい。</j>」"
  10: "弟子[でし]たちが近[ちか]づいて来[き]て言[い]った。「なぜ、あの人[ひと]たちにはたとえを用[もち]いてお話[はな]しになるのですか。」"
  11: "イエスはお答[こた]えになった。「<j>あなたがたには天[てん]の国[くに]の秘密[ひみつ]を知[し]ることが与[あた]えられているが、彼[かれ]らには与[あた]えられていない。</j>"
  12: "<j>持[も]つ者[もの]には、さらに与[あた]えられて満[み]ちあふれる。持[も]たない者[もの]は、持[も]っているものまで奪[うば]い取[と]られる。</j>"
  13: "<j>彼[かれ]らにたとえで語[かた]るのは、そのためである。彼[かれ]らは目[め]があっても見[み]えず、耳[みみ]があっても聞[き]こえず、悟[さと]ることもできない。</j>"
  14: "<j>そして、彼[かれ]らにおいて、こう言[い]うイザヤの預言[よげん]が実現[じつげん]する。『あなたがたは聞[き]くには聞[き]くが、決[けっ]して理解[りかい]せず、見[み]るには見[み]るが、決[けっ]して見[み]ない。</j>"
  15: "<j>この民[たみ]の心[こころ]は鈍[にぶ]くなり、耳[みみ]は遠[とお]くなり、目[め]は閉[と]ざされてしまった。こうして、彼[かれ]らが目[め]で見[み]、耳[みみ]で聞[き]き、心[こころ]で理解[りかい]し、立[た]ち帰[かえ]って、わたしが彼[かれ]らを癒[いや]すことのないように。』</j>"
  16: "<j>だが、あなたがたの目[め]は見[み]えているので幸[さいわ]いであり、あなたがたの耳[みみ]は聞[き]こえているので幸[さいわ]いである。</j>"
  17: "<j>はっきり言[い]っておく。多[おお]くの預言者[よげんしゃ]や正[ただ]しい人[ひと]たちが、あなたがたの見[み]ているものを目[め]にしようと切[せつ]に望[のぞ]みながら、かなわず、あなたがたの聞[き]いているものを耳[みみ]にしようと望[のぞ]みながら、聞[き]けなかったのである。</j>」"
  18: "「<j>そこで、蒔[ま]く者[もの]のたとえを聞[き]きなさい。</j>"
  19: "<j>だれでも、天[てん]の国[くに]の言葉[ことば]を聞[き]いても理解[りかい]しないなら、悪[わる]い者[もの]が来[き]て、その人[ひと]の心[こころ]に蒔[ま]かれたものを奪[うば]い去[さ]る。これが道端[みちばた]に蒔[ま]かれた者[もの]である。</j>"
  20: "<j>石[いし]の多[おお]い所[ところ]とは、御言葉[みことば]を聞[き]くやいなや、喜[よろこ]びをもってこれを受[う]け取[と]る者[もの]のことである。</j>"
  21: "<j>だが、その人[ひと]には根[ね]がないので長[なが]くは続[つづ]かず、御言葉[みことば]のゆえに苦難[くなん]や迫害[はくがい]が生[しょう]じると、すぐつまずいてしまう。</j>"
  22: "<j>茨[いばら]の中[なか]に蒔[ま]かれた者[もの]とは、御言葉[みことば]に耳[みみ]を貸[か]すものの、この世[よ]の心配[しんぱい]ごとや富[とみ]のまやかしが御言葉[みことば]をふさぎ、実[み]を結[むす]ばぬままになる者[もの]である。</j>"
  23: "<j>良[よ]い土地[とち]に蒔[ま]かれた者[もの]とは、御言葉[みことば]を聞[き]いて理解[りかい]する人[ひと]であり、その人[ひと]は実[み]を結[むす]んで、あるものは百倍[ひゃくばい]、あるものは六十倍[ろくじゅうばい]、あるものは三十倍[さんじゅうばい]にもなる。</j>」"
  24: "イエスはまた、別[べつ]のたとえを彼[かれ]らに示[しめ]して言[い]われた。「<j>天[てん]の国[くに]は、ある人[ひと]が自分[じぶん]の畑[はたけ]に良[よ]い種[たね]を蒔[ま]いたのに似[に]ている。</j>"
  25: "<j>ところが、人々[ひとびと]が眠[ねむ]っている間[あいだ]に、敵[てき]が来[き]て、麦[むぎ]の中[なか]に毒麦[どくむぎ]を蒔[ま]き、そして去[さ]って行[い]った。</j>"
  26: "<j>芽[め]が出[で]て実[み]を結[むす]ぶと、そのとき、毒麦[どくむぎ]も現[あらわ]れた。</j>"
  27: "<j>主人[しゅじん]の僕[しもべ]たちが近[ちか]寄[よ]って来[き]て尋[たず]ねた。『だんなさま、畑[はたけ]に良[よ]い種[たね]をお蒔[ま]きになったのではなかったのですか。毒麦[どくむぎ]は、いったいどこから来[き]たのでしょう。』</j>"
  28: "<j>主人[しゅじん]は言[い]った。『敵[てき]の仕業[しわざ]だ。』そこで、僕[しもべ]たちが言[い]った。『では、行[い]って抜[ぬ]き集[あつ]めましょうか。』</j>"
  29: "<j>しかし、主人[しゅじん]は言[い]った。『いや、毒麦[どくむぎ]を集[あつ]めるとき、麦[むぎ]まで一緒[いっしょ]に抜[ぬ]き取[と]ってしまってはいけない。</j>"
  30: "<j>刈[か]り入[い]れまで、両方[りょうほう]とも育[そだ]つままにしておきなさい。刈[か]り入[い]れの時[とき]になったら、わたしは刈[か]り取[と]る者[もの]たちにこう言[い]おう。「まず毒麦[どくむぎ]を集[あつ]めて、焼[や]くために束[たば]にし、麦[むぎ]のほうはわたしの倉[くら]に集[あつ]めよ」と。』</j>」"
  31: "イエスはまた、別[べつ]のたとえを彼[かれ]らに示[しめ]して言[い]われた。「<j>天[てん]の国[くに]はからし種[だね]に似[に]ている。人[ひと]がこれを取[と]って自分[じぶん]の畑[はたけ]に蒔[ま]くと、</j>"
  32: "<j>どんな種[たね]よりも小[ちい]さいが、育[そだ]つとどの野菜[やさい]よりも大[おお]きくなり、やがて木[き]になって、空[そら]の鳥[とり]が来[き]てその枝[えだ]に巣[す]を作[つく]るほどになる。</j>」"
  33: "また、別[べつ]のたとえを彼[かれ]らに語[かた]られた。「<j>天[てん]の国[くに]はパン種[だね]に似[に]ている。女[おんな]がこれを取[と]って、三[さん]サトン⟨小麦粉[こむぎこ]を量[はか]る単位[たんい]。約[やく]二十二[にじゅうに]リットル。⟩の粉[こな]に混[ま]ぜ込[こ]むと、すべてが膨[ふく]れ上[あ]がるまでになった。</j>」"
  34: "イエスはこれらのことをすべて、たとえを用[もち]いて群衆[ぐんしゅう]に語[かた]られた。たとえを用[もち]いずに語[かた]ることはなかった。"
  35: "こうして、預言者[よげんしゃ]によって語[かた]られた言葉[ことば]が成就[じょうじゅ]した。「わたしは口[くち]を開[ひら]き、たとえをもって語[かた]ろう。世[よ]の基[もと]が置[お]かれた時[とき]から秘[ひ]められてきたことを、告[つ]げよう。」"
  36: "群衆[ぐんしゅう]をあとに、イエスは家[いえ]へ入[はい]られた。弟子[でし]たちがそばへ寄[よ]って来[き]て、「畑[はたけ]の毒麦[どくむぎ]のたとえを、わたしたちに解[と]いてください」と願[ねが]った。"
  37: "そこでイエスは答[こた]えられた。「<j>良[よ]い種[たね]を蒔[ま]く者[もの]こそ、人[ひと]の子[こ]である。</j>"
  38: "<j>畑[はたけ]はこの世[よ]であり、良[よ]い種[たね]とは天[てん]の国[くに]の子[こ]らであり、毒麦[どくむぎ]とは悪[わる]い者[もの]の子[こ]らである。</j>"
  39: "<j>毒麦[どくむぎ]を蒔[ま]いた敵[てき]は悪魔[あくま]であり、刈[か]り入[い]れとは世[よ]の終[お]わりであり、刈[か]り取[と]る者[もの]たちは天使[てんし]たちである。</j>"
  40: "<j>毒麦[どくむぎ]は集[あつ]められ、火[ひ]に投[な]げ込[こ]まれる。世[よ]の終[お]わりにも、同[おな]じことが起[お]こる。</j>"
  41: "<j>人[ひと]の子[こ]は自分[じぶん]の天使[てんし]たちを遣[つか]わし、彼[かれ]らは人[ひと]の子[こ]の国[くに]から、つまずきとなるものすべてと不法[ふほう]を行[おこな]う者[もの]たちを集[あつ]めさせ、</j>"
  42: "<j>そして、彼[かれ]らを火[ひ]の炉[ろ]に投[な]げ込[こ]ませる。そこでは泣[な]きわめきと歯[は]ぎしりがある。</j>"
  43: "<j>そのとき、正[ただ]しい者[もの]たちは、父[ちち]の国[くに]にあって太陽[たいよう]のように光[ひかり]を放[はな]つ。聞[き]く耳[みみ]を持[も]つ者[もの]は、聞[き]きなさい。</j>」"
  44: "「<j>天[てん]の国[くに]は、畑[はたけ]に隠[かく]されている宝[たから]に似[に]ている。人[ひと]がそれを見[み]つけると、それを隠[かく]しておき、喜[よろこ]びながら行[い]って持[も]ち物[もの]をすっかり売[う]り払[はら]い、その畑[はたけ]を買[か]う。</j>」"
  45: "「<j>また、天[てん]の国[くに]は、良[よ]い真珠[しんじゅ]を探[さが]している商人[しょうにん]に似[に]ている。</j>"
  46: "<j>きわめて貴重[きちょう]な真珠[しんじゅ]を一[ひと]つ見[み]つけたその人[ひと]は、出[で]かけて行[い]って全[すべ]ての持[も]ち物[もの]を売[う]り払[はら]い、その真珠[しんじゅ]を手[て]に入[い]れた。</j>」"
  47: "「<j>また、天[てん]の国[くに]は、湖[みずうみ]に投[な]げ降[お]ろされて、あらゆる種類[しゅるい]の魚[さかな]を集[あつ]める網[あみ]に似[に]ている。</j>"
  48: "<j>網[あみ]が満[み]ちると、人々[ひとびと]は浜[はま]へ引[ひ]き上[あ]げて腰[こし]を下[お]ろし、良[よ]いものは器[うつわ]に収[おさ]め、悪[わる]いものは外[そと]へ投[な]げ捨[す]てた。</j>"
  49: "<j>世[よ]の終[お]わりにも、そのようになる。天使[てんし]たちが出[で]て来[き]て、正[ただ]しい人々[ひとびと]の中[なか]から悪[わる]い者[もの]たちをより分[わ]け、</j>"
  50: "<j>そして、彼[かれ]らを火[ひ]の炉[ろ]に投[な]げ込[こ]む。そこでは泣[な]きわめきと歯[は]ぎしりがある。</j>」"
  51: "イエスは言[い]われた。「<j>あなたがたは、これらのことがみな分[わ]かったか。</j>」弟子[でし]たちは「はい、〔主[しゅ]よ〕」と答[こた]えた。"
  52: "イエスは言[い]われた。「<j>だから、天[てん]の国[くに]について学[まな]んだ律法学者[りっぽうがくしゃ]はだれでも、自分[じぶん]の倉[くら]から新[あたら]しいものと古[ふる]いものとを取[と]り出[だ]す家[か]の主人[しゅじん]に似[に]ている。</j>」"
  53: "これらすべてのたとえを語[かた]り終[お]えると、イエスはそこを発[た]った。"
  54: "そして、故郷[こきょう]に帰[かえ]って、会堂[かいどう]で彼[かれ]らを教[おし]えられた。人々[ひとびと]は驚[おどろ]いて言[い]った。「この人[ひと]は、このような知恵[ちえ]と奇跡[きせき]をどこから得[え]たのだろう。"
  55: "この人[ひと]はあの大工[だいく]⟨家[いえ]を建[た]てる仕事[しごと]をする人[ひと]。⟩の子[こ]ではないか。母[はは]の名[な]はマリアといい、兄弟[きょうだい]はヤコブ、ヨセフ、シモン、ユダではないか。"
  56: "姉妹[しまい]たちもみな、わたしたちのところにいるではないか。この人[ひと]はこんなに多[おお]くのことを、いったいどこで身[み]につけたのか。」"
  57: "こうして、人々[ひとびと]はイエスにつまずいた。しかし、イエスは言[い]われた。「<j>預言者[よげんしゃ]が敬[うやま]われないのは、自分[じぶん]の故郷[こきょう]と自分[じぶん]の家[いえ]だけである。</j>」"
  58: "そして、彼[かれ]らの不信仰[ふしんこう]のゆえに、そこでは多[おお]くの奇跡[きせき]を行[おこな]われなかった。"

notes:
  3: "У jp-ni первая фраза притчи без «見よ»; ἰδού сохранил. Формулировки притчи (4–8) независимые от Мк 4:3–8 по построению."
  8: "Порядок плодов у Матфея обратный Марку: сто, шестьдесят, тридцать (в Мк 4:8 — тридцать, шестьдесят, сто), оставлен порядок Матфея."
  9: "Формула ὁ ἔχων ὦτα ἀκουέτω; передана 聞く耳を持つ者は、聞きなさい (в Мк 4:9/4:23 — 耳のある者は…), ради независимости от jp-ni."
  12: "περισσευθήσεται — «будет в изобилии»; передал 満ちあふれる. У jp-ni «豊かになる»."
  14: "Цитата Ис 6:9–10. У jp-ni она без «実現する»-рамки, у меня сохранено ἀναπληροῦται."
  15: "μήποτε… ἰάσομαι — «как бы не… и Я не исцелю»; не сглаживал в «они не покаются», оставил придаточным цели, как в Мк 4:12."
  19: "τὸν λόγον τῆς βασιλείας — «слово Царства»; передал 天の国の言葉, в 20–23 λόγος без βασιλείας — 御言葉 (как в Мк 4)."
  20: "μετὰ χαρᾶς λαμβάνων αὐτόν — «с радостью принимая его»; 喜びをもってこれを受け取る."
  22: "μέριμνα — 心配ごと, ἀπάτη — まやかし (у jp-ni «思い煩い», «誘惑»); συμπνίγω — ふさぐ."
  25: "ζιζάνια — плевелы; 毒麦, как у jp-ni. Сноску не ставил: слово понятно по контексту."
  30: "Тройная вложенность кавычек: речь Христа 「」 → речь хозяина 『』 → приказ жнецам 「」; парность проверена."
  31: "Сноску на からし種 не ставил: для японца это обычное слово, а лишние сноски убирали ещё в Мк 1–2; сноска Мк 4:31 сюда не переносится."
  33: "σάτα τρία — три саты, около 22 л муки; сноска о мере, как на ミリオン/キュビト. パン種 без сноски — в Мк 8:15 она уже была."
  35: "В критической базе κόσμος в квадратных скобках (ἀπὸ καταβολῆς [κόσμου]); Церковь читает «от сложения мира» — оставил без 〔〕, так как это разночтение цитаты, а не добавка по смыслу."
  37: "ἐστὶν ὁ υἱὸς τοῦ ἀνθρώπου — простая связка; こそ — фокусирующая частица без добавления смысла."
  43: "ἐκλάμψουσιν — «просиять»; 光を放つ. Формула «聞く耳を持つ者は、聞きなさい» — как в 13:9."
  51: "В критической базе ответ учеников без обращения: Ναί; церковное чтение (TR, jp-joc 「主よ、然り」) добавляет κύριε — 〔主よ〕."
  52: "γραμματεὺς μαθητευθεὶς τῇ βασιλείᾳ τῶν οὐρανῶν — «книжник, наученный Царству»; у jp-ni «天の国のことを学んだ学者», поставил 律法学者 по глоссарию."
  55: "τέκτων — плотник; сноска та же, что в Мк 6:3 (здесь первое упоминание в Мф)."
  57: "У jp-ni «その故郷、家族の間»; в византийском «ἐν τῇ πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ» — 故郷と自分の家, без сглаживания."
