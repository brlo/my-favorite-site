# jp-box, Бытие, глава 46. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и, где есть, jp-joc (1901, public domain). ru — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 46: Бог является Иакову в Вирсавии (1–7), список пришедших в Египет (8–27),
# встреча с Иосифом (28–30), наставление братьям перед фараоном (31–34).
# Красного и синего нет: слова Бога в видении — не прямая речь Христа во плоти.
# Кавычки: речь первого уровня — 「…」; вложенные слова Иосифа к фараону и ответ братьев — 『…』.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено).
# jp-joc в этой главе есть только до ст. 7; дальше контроль по csl-ru.
# Имена даны по формам, принятым в корпусе (ср. гл. 35, 38, 41: ジルパ, シェラ, ペレツ, ゼラ,
# ポティフェラ, アセンナテ); греческие формы LXX указаны в notes.
# Сносок ⟨…⟩ нет: 家畜, 嗣業, 祭司, 羊飼い понятны. jp-ni не использовался.

