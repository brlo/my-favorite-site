verses:
  1: "イスラエルは、自分[じぶん]のすべての者[もの]とともに旅立[たびだ]って、誓[ちか]いの井戸[いど]へ来[き]て、父[ちち]イサクの神[かみ]に犠牲[ぎせい]をささげた。"
  2: "神[かみ]は夜[よる]の幻[まぼろし]の中[なか]でイスラエルに言[い]われた。「ヤコブよ、ヤコブよ。」彼[かれ]は言[い]った。「はい、ここにおります。」"
  3: "神[かみ]は言[い]われた。「わたしはあなたの父[ちち]の神[かみ]である。エジプトへ下[くだ]ることを恐[おそ]れてはならない。わたしはそこで、あなたを大[おお]いなる民[たみ]とする。"
  4: "わたしはあなたとともにエジプトへ下[くだ]り、わたしはまた、終[お]わりにはあなたを連[つ]れ上[のぼ]る。ヨセフが自分[じぶん]の手[て]をあなたの目[め]の上[うえ]に置[お]くであろう。」"
  5: "ヤコブは誓[ちか]いの井戸[いど]から立[た]ち上[あ]がった。イスラエルの子[こ]らは、父[ちち]と家財[かざい]と妻[つま]たちを、ヨセフが彼[かれ]を運[はこ]ぶために送[おく]った荷車[にぐるま]に載[の]せ、"
  6: "自分[じぶん]たちの財産[ざいさん]と、カナンの地[ち]で得[え]たすべての所有[しょゆう]を携[たずさ]えて、エジプトへ入[はい]った。ヤコブと、彼[かれ]とともにいるそのすべての子孫[しそん]である。"
  7: "その子[こ]らと孫[まご]たち、その娘[むすめ]たちと孫娘[まごむすめ]たち、すなわちそのすべての子孫[しそん]を、彼[かれ]はエジプトへ連[つ]れて行[い]った。"
  8: "エジプトへ入[はい]ったイスラエルの子[こ]らの名[な]は次[つぎ]のとおりである。ヤコブとその子[こ]ら。ヤコブの長子[ちょうし]ルベン。"
  9: "ルベンの子[こ]らはエノク、ファルス、アスロン、ハルミ。"
  10: "シメオンの子[こ]らはイェムエル、ヤミン、アオド、ヤキン、サアル、およびカナン人[じん]の女[おんな]が産[う]んだサウル。"
  11: "レビの子[こ]らはゲルション、カアト、メラリ。"
  12: "ユダの子[こ]らはエル、オナン、シェラ、ペレツ、ゼラ。エルとオナンはカナンの地[ち]で死[し]んだ。ペレツの子[こ]らはアスロンとイェムエルであった。"
  13: "イッサカルの子[こ]らはトラ、プア、ヤシュブ、ザムブラム。"
  14: "ゼブルンの子[こ]らはセレド、アロン、アロエル。"
  15: "これらはリアの子[こ]らで、彼女[かのじょ]がシリアのメソポタミアでヤコブに産[う]んだ者[もの]たち、およびその娘[むすめ]ディナである。息子[むすこ]と娘[むすめ]を合[あ]わせて、すべて三十三人[にん]。"
  16: "ガドの子[こ]らはサフォン、アンギス、サウニス、タソバン、アエディス、アロエディス、アロエリス。"
  17: "アシェルの子[こ]らはイェムナ、イェスア、イェウル、バリア、およびその妹[いもうと]サラ。バリアの子[こ]らはホボルとメルキエル。"
  18: "これらは、ラバンがその娘[むすめ]リアに与[あた]えたジルパの子[こ]らで、彼女[かのじょ]がヤコブに産[う]んだ者[もの]たちである。十六人[にん]。"
  19: "ヤコブの妻[つま]ラケルの子[こ]らはヨセフとベニヤミン。"
  20: "エジプトの地[ち]でヨセフに生[う]まれた者[もの]は、ヘリオポリスの祭司[さいし]ポティフェラの娘[むすめ]アセンナテが彼[かれ]に産[う]んだマナセとエフライムである。マナセの子[こ]らは、彼[かれ]のそばめであるシリアの女[おんな]が彼[かれ]に産[う]んだマキルである。マキルはギレアデを生[う]んだ。マナセの兄弟[きょうだい]エフライムの子[こ]らはスタラアムとタアム。スタラアムの子[こ]らはエデム。"
  21: "ベニヤミンの子[こ]らはバラ、ホボル、アスベル。バラの子[こ]らはゲラ、ノエマン、アンキス、ロス、マンフィン、オフィミン。ゲラはアラドを生[う]んだ。"
  22: "これらはラケルの子[こ]らで、彼女[かのじょ]がヤコブに産[う]んだ者[もの]たちである。すべて十八人[にん]。"
  23: "ダンの子[こ]らはアソム。"
  24: "ナフタリの子[こ]らはアシエル、ゴウニ、イッサアル、シレム。"
  25: "これらは、ラバンがその娘[むすめ]ラケルに与[あた]えたバラの子[こ]らで、彼女[かのじょ]がヤコブに産[う]んだ者[もの]たちである。すべて七人[にん]。"
  26: "ヤコブとともにエジプトへ入[はい]ったすべての者[もの]は、彼[かれ]の腰[こし]から出[で]た者[もの]で、ヤコブの子[こ]らの妻[つま]たちを除[のぞ]き、すべて六十六人[にん]。"
  27: "エジプトの地[ち]で彼[かれ]に生[う]まれたヨセフの子[こ]らは九人[にん]。ヤコブの家[いえ]の者[もの]で、エジプトへ入[はい]ったすべての者[もの]は七十五人[にん]。"
  28: "彼[かれ]はユダを自分[じぶん]の先[さき]に、ヨセフのもとへ遣[つか]わした。英雄[えいゆう]たちの町[まち]で彼[かれ]を迎[むか]えさせ、ラメセの地[ち]へ向[む]かうためであった。"
  29: "ヨセフは自分[じぶん]の車[くるま]を整[ととの]えて、父[ちち]イスラエルを迎[むか]えに上[のぼ]り、英雄[えいゆう]たちの町[まち]で彼[かれ]に会[あ]った。そして彼[かれ]の前[まえ]に現[あらわ]れ、その首[くび]に身[み]を寄[よ]せて、長[なが]く泣[な]いた。"
  30: "イスラエルはヨセフに言[い]った。「今[いま]こそ、わたしは死[し]のう。あなたの顔[かお]を見[み]たのだから。あなたはまだ生[い]きている。」"
  31: "ヨセフは兄弟[きょうだい]たちと父[ちち]の家[いえ]の者[もの]たちに言[い]った。「わたしは上[のぼ]って行[い]って、ファラオに告[つ]げ、こう言[い]おう。『わたしの兄弟[きょうだい]たちと父[ちち]の家[いえ]の者[もの]たちは、カナンの地[ち]にいた者[もの]たちですが、わたしのもとへ来[き]ました。"
  32: "この人[ひと]たちは羊飼[ひつじかい]です。彼[かれ]らは家畜[かちく]を飼[か]う者[もの]でしたから。羊[ひつじ]も牛[うし]も、彼[かれ]らのすべてのものも連[つ]れて来[き]ました。』"
  33: "ですから、ファラオがあなたがたを呼[よ]んで『あなたがたの仕事[しごと]は何[なに]か』と言[い]うなら、"
  34: "『あなたのしもべたちは、幼[おさな]いときから今[いま]に至[いた]るまで家畜[かちく]を飼[か]う者[もの]です。わたしたちも父[ちち]たちもそうです』と言[い]いなさい。それはあなたがたがアラビアのゴシェンの地[ち]に住[す]むためです。羊飼[ひつじかい]はすべて、エジプト人[じん]にとって忌[い]むべき者[もの]だからです。」"

notes:
  1: "φρέαρ τοῦ ὅρκου — 誓いの井戸 (букв. «колодец клятвы»; это Вирсавия/Беэр-Шева, ср. 21:31; переведено с LXX, а не названием). ἔθυσεν θυσίαν — 犠牲をささげた (θύω «заклать в жертву»). τῷ θεῷ τοῦ πατρὸς αὐτοῦ Ισαακ — 父イサクの神に."
  2: "ἐν ὁράματι τῆς νυκτός — 夜の幻の中で (ὅραμα — 幻[まぼろし]). Ιακωβ, Ιακωβ — ヤコブよ、ヤコブよ (двойное обращение). Τί ἐστιν; — はい、ここにおります (букв. «что есть?», евр. «вот я»; слав. «что есть?»)."
  3: "Ἐγώ εἰμι ὁ θεὸς τῶν πατρῶν σου — わたしはあなたの父の神である (слав. «Бог отец твоих»). εἰς ἔθνος μέγα — 大いなる民 (ἔθνος «народ»)."
  4: "ἐγὼ καταβήσομαι μετὰ σοῦ — わたしはあなたとともに…下り. ἀναβιβάσω σε εἰς τέλος — 終わりにはあなたを連れ上る (εἰς τέλος «до конца»; слав. «возведу тя до конца»; смысл — выведу в конце). ἐπιβαλεῖ τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμούς σου — 手をあなたの目の上に置く (закрыть глаза умершему)."
  5: "ἀνέστη… ἀπὸ τοῦ φρέατος — 誓いの井戸から立ち上がった. τὴν ἀποσκευήν — 家財 (ἀποσκευή «пожитки»). ἐπὶ τὰς ἁμάξας — 荷車に載せ."
  6: "τὰ ὑπάρχοντα αὐτῶν — 自分たちの財産 (ὑπάρχω «иметь»). πᾶσαν τὴν κτῆσιν, ἣν ἐκτήσαντο — 得たすべての所有 (κτῆσις «приобретение»; у jp-joc здесь добавлено 家畜, но в гр. этого слова нет — потому не внесено). πᾶν τὸ σπέρμα αὐτοῦ — すべての子孫 (σπέρμα «семя»)."
  7: "θυγατέρες καὶ θυγατέρες τῶν υἱῶν αὐτοῦ — 娘たちと、その息子たちの娘たち (т. е. дочери и внучки). ἤγαγεν — 連れて行った."
  8: "Ταῦτα τὰ ὀνόματα — 名は次のとおり. πρωτότοκος Ρουβην — 長子ルベン."
  9: "Ενωχ, Φαλλους, Ασρων, Χαρμι — エノク、ファルス、アスロン、ハルミ (в csl «енох, фаллос, асрон, харми»; в ru иные формы — евр. чтение, не источник)."
  10: "Ιεμουηλ, Ιαμιν, Αωδ, Ιαχιν, Σααρ, Σαουλ — イェムエル、ヤミン、アオド、ヤキン、サアル、サウル. υἱὸς τῆς Χανανίτιδος — カナン人の女が産んだ (букв. «сын Хананеянки»)."
  11: "Γηρσων, Κααθ, Μεραρι — ゲルション、カアト、メラリ."
  12: "Ηρ καὶ Αυναν… ἀπέθανεν — エルとオナンは…死んだ (LXX ставит глагол в ед. ч.; по-японски множественное). Σηλωμ — シェラ, Φαρες — ペレツ, Ζαρα — ゼラ (формы по корпусу, ср. гл. 38; в LXX Σηλωμ, Φαρες, Ζαρα). ἐγένοντο υἱοὶ Φαρες Ασρων καὶ Ιεμουηλ — ペレツの子らはアスロンとイェムエル."
  13: "Θωλα, Φουα, Ιασουβ, Ζαμβραμ — トラ、プア、ヤシュブ、ザムブラム (у csl «асум» вместо Ιασουβ — иная форма имени, не добавление)."
  14: "Σερεδ, Αλλων, Αλοηλ — セレド、アロン、アロエル."
  15: "υἱοὶ Λείας… ἐν Μεσοποταμίᾳ τῆς Συρίας — リアの子ら…メソポタミア（シリア）で. Διναν τὴν θυγατέρα — 娘ディナ. τριάκοντα τρεῖς — 三十三人 (по LXX)."
  16: "Σαφων, Αγγις, Σαυνις, Θασοβαν, Αηδις, Αροηδις, Αροηλις — サフォン、アンギス、サウニス、タソバン、アエディス、アロエディス、アロエリス."
  17: "Ιεμνα, Ιεσουα, Ιεουλ, Βαρια — イェムナ、イェスア、イェウル、バリア. Σαρα ἀδελφὴ αὐτῶν — 妹サラ (в евр. Серах). Χοβορ καὶ Μελχιηλ — ホボルとメルキエル."
  18: "υἱοὶ Ζελφας… δέκα ἓξ ψυχάς — ジルパの子ら…十六人 (ψυχή «душа», здесь «человек»; форма имени по корпусу, ср. 30:9)."
  19: "υἱοὶ Ραχηλ… Ιωσηφ καὶ Βενιαμιν — ラケルの子らはヨセフとベニヤミン."
  20: "Μανασση καὶ Εφραιμ — マナセとエフライム. Ασεννεθ θυγάτηρ Πετεφρη ἱερέως Ἡλίου πόλεως — ヘリオポリスの祭司ポティフェラの娘アセンナテ (Ἡλίου πόλις — Гелиополь; формы по корпусу, ср. 41:45). ἡ παλλακὴ ἡ Σύρα — そばめであるシリアの女 (в ru этого нет — иное чтение). Μαχιρ… Γαλααδ — マキル…ギレアデ. Σουταλααμ καὶ Τααμ… Εδεμ — スタラアムとタアム…エデム."
  21: "Βαλα, Χοβωρ, Ασβηλ — バラ、ホボル、アスベル. Γηρα, Νοεμαν, Αγχις, Ρως, Μαμφιν, Οφιμιν — ゲラ、ノエマン、アンキス、ロス、マンフィン、オフィミン. Γηρα… Αραδ — ゲラはアラドを生んだ."
  22: "πᾶσαι ψυχαὶ δέκα ὀκτώ — すべて十八人 (по LXX; в ru «четырнадцать» — евр. счёт, не источник)."
  23: "υἱοὶ Δαν Ασομ — ダンの子らはアソム (в евр. ед. ч.; LXX «сыны»)."
  24: "Ασιηλ, Γωυνι, Ισσααρ, Συλλημ — アシエル、ゴウニ、イッサアル、シレム."
  25: "υἱοὶ Βαλλας… πᾶσαι ψυχαὶ ἑπτά — バラの子ら…すべて七人."
  26: "χωρὶς τῶν γυναικῶν υἱῶν Ιακωβ — ヤコブの子らの妻たちを除き. ἑξήκοντα ἕξ — 六十六人."
  27: "ψυχαὶ ἐννέα — 九人 (LXX считает и внуков Иосифа; в ru «две души»). ἑβδομήκοντα πέντε — 七十五人 (LXX и слав.; в евр. и ru «семьдесят»)."
  28: "πρὸς Ιωσηφ συναντῆσαι αὐτῷ — ヨセフのもとへ…彼を迎えさせ. καθ᾽ Ἡρώων πόλιν — 英雄たちの町で (Ἡρώων πόλις; в ru «чтобы указать путь в Гесем» — иное чтение). εἰς γῆν Ραμεσση — ラメセの地へ."
  29: "ζεύξας… τὰ ἅρματα — 車を整えて (ζεύγνυμι «запрягать»). ἔκλαυσεν κλαυθμῷ πλείονι — 長く泣いた (букв. «плачем большим»)."
  30: "Ἀποθανοῦμαι ἀπὸ τοῦ νῦν — 今こそ、わたしは死のう (букв. «умру отныне»). ἐπεὶ ἑώρακα τὸ πρόσωπόν σου — あなたの顔を見たのだから."
  31: "Ἀναβὰς ἀπαγγελῶ τῷ Φαραω — 上って行って、ファラオに告げ. οἳ ἦσαν ἐν γῇ Χανααν — カナンの地にいた者たち."
  32: "ἄνδρες κτηνοτρόφοι — 家畜を飼う者 (κτηνοτρόφος «скотовод»). ἀγειόχασιν — 連れて来た (ἄγω + ἔχω, редкая форма)."
  33: "Τί τὸ ἔργον ὑμῶν ἐστιν; — あなたがたの仕事は何か."
  34: "Ἄνδρες κτηνοτρόφοι ἐσμὲν οἱ παῖδές σου — あなたのしもべたちは…家畜を飼う者です. ἐκ παιδὸς ἕως τοῦ νῦν — 幼いときから今に至るまで. βδέλυγμα… πᾶς ποιμὴν προβάτων — 羊飼いはすべて…忌むべき者 (βδέλυγμα «мерзость»)."
