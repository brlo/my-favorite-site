verses:
  1: "知恵[ちえ]は自分[じぶん]のために家[いえ]を建[た]て、七[なな]つの柱[はしら]を据[す]えた。"
  2: "自分のいけにえを屠[ほふ]り、自分のぶどう酒[ぶどうしゅ]を混[ま]ぜ合わせ、自分の食卓[しょくたく]を整[ととの]えた。"
  3: "自分の奴隷[どれい]たちを遣[つか]わし、高[たか]らかな宣[の]べ伝[つた]えとともに、ぶどう酒の器[うつわ]へと招[まね]き寄[よ]せて言[い]わせた。"
  4: "「愚[おろ]かな者[もの]はだれか。こちらへ来[き]なさい」と、分別[ふんべつ]の足[た]りない者[もの]たちに言[い]った。"
  5: "「さあ、来[き]て、わたしのパンを食[た]べ、わたしが混[ま]ぜたぶどう酒[ぶどうしゅ]を飲[の]め。"
  6: "愚[おろ]かさを捨[す]てよ。そうすれば生[い]き、とこしえに王[おう]として治[おさ]める。分別[ふんべつ]を求[もと]めよ。そうすれば生き、知識[ちしき]のうちに悟[さと]りを正[ただ]しく整[ととの]えよ。」"
  7: "悪[わる]い者[もの]を戒[いまし]める者[もの]は自分[じぶん]に辱[はずかし]めを受[う]け、不[ふ]敬[けい]な者[もの]を責[せ]める者[もの]は自分を汚[けが]す。"
  8: "悪[わる]い者[もの]を責[せ]めてはならない。憎[にく]まれないためである。知恵[ちえ]ある者[もの]を責めよ。そうすればあなたを愛[あい]する。"
  9: "知恵[ちえ]ある者[もの]に機会[きかい]を与[あた]えよ。そうすればさらに知恵ある者になる。正[ただ]しい者[もの]に告[つ]げ知[し]らせよ。そうすればさらに受[う]け入[い]れるようになる。"
  10: "知恵[ちえ]の始[はじ]めは主[しゅ]を恐[おそ]れること、聖[せい]なる者[もの]の計画[けいかく]は悟[さと]りである。律法[りっぽう]を知[し]ることは善[よ]い心[こころ]の働[はたら]きであるから。"
  11: "このような道[みち]によって、あなたは長[なが]く生[い]き、あなたのいのちの年[とし]が加[くわ]えられる。"
  12: "子[こ]よ、もしあなたが知恵[ちえ]ある者[もの]となるなら、あなた自身[じしん]のために知恵ある者となり、隣人[りんじん]のためにもなる。もし悪[わる]い者となるなら、あなたひとりが災[わざわ]いを負[お]う。戒[いまし]められた子[こ]は知恵ある者となり、愚[おろ]かな者[もの]は奴隷[どれい]として使[つか]われる。偽[いつわ]りに寄[よ]りかかる者[もの]は風[かぜ]を牧[まき]し、飛[と]ぶ鳥[とり]を追[お]いかける。彼[かれ]は自分のぶどう畑[ばたけ]の道[みち]を捨[す]て、自分の畑[はたけ]の畦道[あぜみち]に迷[まよ]い込[こ]んだからである。水[みず]のない荒[あ]れ野[の]、渇[かわ]きに定[さだ]められた地[ち]をさまよい、手[て]で実[み]のないものを集[あつ]める。"
  13: "愚[おろ]かな女[おんな]は厚[あつ]かましく、パンに乏[とぼ]しくなる。彼女は恥[はじ]を知[し]らない。"
  14: "彼女は自分の家[いえ]の戸口[とぐち]に、町[まち]の広場[ひろば]の目立[めだ]つ場所[ばしょ]の椅子[いす]に座[すわ]り、"
  15: "通[とお]りかかる者[もの]、自分の道[みち]をまっすぐに歩[あゆ]む者を呼[よ]び止[と]めて、"
  16: "「あなたがたのうちで最も愚[おろ]かな者[もの]はだれか。こちらへ来[き]なさい」と、思慮[しりょ]の足[た]りない者[もの]たちに命[めい]じて言[い]った。"
  17: "「隠[かく]したパンに甘[あま]く手[て]を伸[の]ばし、盗[ぬす]んだ水[みず]の甘さを味[あじ]わえ。」"
  18: "しかし彼[かれ]は、そこにいる者[もの]たちが地[ち]に生[う]まれた者であり、彼女のもとで滅[ほろ]びることを知[し]らない。よみの桟[さん]に踏[ふ]み入[い]ることも知らない。だから、すみやかに離[はな]れよ。彼女の場所[ばしょ]にとどまってはならない。彼女に目[め]を注[そそ]いではならない。そうすれば、あなたは他人[たにん]の水[みず]を渡[わた]り、他人の川[かわ]を越[こ]えるであろう。他人の水から遠[とお]ざかり、他人の泉[いずみ]から飲[の]んではならない。そうすれば、あなたは長[なが]く生[い]き、あなたのいのちの年[とし]が加[くわ]えられる。"

notes:
  1: "Ἡ σοφία ᾠκοδόμησεν ἑαυτῇ οἶκον — Премудрость построила себе дом (οἰκοδομέω — строить). ὑπήρεισεν στύλους ἑπτά — утвердила семь столпов (ὑπηρετέω — поддерживать, укреплять; στῦλος — столп). Семь — полнота; дом — образ устроения."
  2: "ἔσφαξεν τὰ ἑαυτῆς θύματα — заколола свои жертвы (σφάζω — закалывать; θῦμα — жертвенное). ἐκέρασεν εἰς κρατῆρα τὸν ἑαυτῆς οἶνον — растворила в чаше своё вино (κεράννυμι — смешивать; κρατήρ — чаша для смешения). ἡτοιμάσατο τὴν ἑαυτῆς τράπεζαν — приготовила свою трапезу."
  3: "ἀπέστειλεν τοὺς ἑαυτῆς δούλους — послала своих рабов. συγκαλοῦσα μετὰ ὑψηλοῦ κηρύγματος — созывая с высоким провозглашением (συγκαλέω — созывать; κήρυγμα — провозглашение). ἐπὶ κρατῆρα — к чаше. Син. «с возвышенностей городских» (по МТ) — в LXX этого нет."
  4: "Ὅς ἐστιν ἄφρων, ἐκκλινάτω πρός με — кто глуп, да уклонится ко мне (ἐκκλίνω — склоняться). καὶ τοῖς ἐνδεέσι φρενῶν εἶπεν — и скудным умом сказала. Первая фраза — речь Премудрости (「…」), εἶπεν вводит вторую речь в ст. 5–6."
  5: "Ἔλθατε φάγετε τῶν ἐμῶν ἄρτων — придите, ешьте моих хлебов (ἄρτος — хлеб). πίετε οἶνον, ὃν ἐκέρασα ὑμῖν — пейте вино, которое я растворила вам. Продолжение речи, начатой в ст. 4."
  6: "ἀπολείπετε ἀφροσύνην, καὶ ζήσεσθε — оставьте безумие, и будете жить (ἀπολείπω — оставлять). ζητήσατε φρόνησιν, ἵνα βιώσητε — взыщите разумение, чтобы жить. κατορθώσατε ἐν γνώσει σύνεσιν — исправьте в знании понимание (κατορθόω — выправлять, направлять). Слав. добавляет «да во веки воцаритеся» — в LXX этого нет; внесено без скобок."
  7: "Ὁ παιδεύων κακοὺς λήμψεται ἑαυτῷ ἀτιμίαν — наказующий злых приимет себе бесчестие (παιδεύω — наставлять, наказывать; ἀτιμία — бесчестие). ἐλέγχων δὲ τὸν ἀσεβῆ μωμήσεται ἑαυτόν — обличающий нечестивого опорочит себя (ἐλέγχω — обличать; μωμάομαι — порицать). Слав. в скобках добавляет «(обличения бо нечестивому раны ему)» — глосса, не переводится."
  8: "μὴ ἔλεγχε κακούς, ἵνα μὴ μισῶσίν σε — не обличай злых, чтобы не возненавидели тебя. ἔλεγχε σοφόν, καὶ ἀγαπήσει σε — обличай мудрого, и возлюбит тебя. Контраст сохранён."
  9: "δίδου σοφῷ ἀφορμήν — дай мудрому повод (ἀφορμή — повод, основание). σοφώτερος ἔσται — и будет мудрее. γνώριζε δικαίῳ, καὶ προσθήσει τοῦ δέχεσθαι — сообщай праведному, и приложит принимать (γνωρίζω — давать знать; προστίθημι — прибавлять)."
  10: "ἀρχὴ σοφίας φόβος κυρίου — начало премудрости страх Господень. βουλὴ ἁγίων σύνεσις — совет святых — разумение. 10a τὸ γὰρ γνῶναι νόμον διανοίας ἐστὶν ἀγαθῆς — ибо познать закон есть дело доброго помысла (διάνοια — мысль, разумение)."
  11: "τούτῳ γὰρ τῷ τρόπῳ πολὺν ζήσεις χρόνον — ибо таким образом много проживёшь времени. προστεθήσεταί σοι ἔτη ζωῆς σου — приложатся тебе лета жизни твоей. Слав. совпадает."
  12: "υἱέ, ἐὰν σοφὸς γένῃ σεαυτῷ — сын, если будешь мудр для себя. σοφὸς ἔσῃ καὶ τοῖς πλησίον — будешь мудр и для ближних. ἐὰν δὲ κακὸς ἀποβῇς, μόνος ἀναντλήσεις κακά — если же станешь зол, один почерпнёшь злое (ἀναντλέω — вычерпывать). 12a–12d — продолжение: «утверждающийся на лжи пасёт ветры…»; слав. добавляет «Сын наказан премудр будет, безумный же слугою употребится» — в LXX нет, внесено без скобок."
  13: "Γυνὴ ἄφρων καὶ θρασεῖα — жена глупая и дерзкая (θρασύς — дерзкий, наглый). ἐνδεὴς ψωμοῦ γίνεται — становится скудной хлебом (ψωμός — кусок хлеба). ἣ οὐκ ἐπίσταται αἰσχύνην — которая не знает стыда. Тёмное место, передано буквально."
  14: "ἐκάθισεν ἐπὶ θύραις τοῦ ἑαυτῆς οἴκου — села при дверях дома своего. ἐπὶ δίφρου ἐμφανῶς ἐν πλατείαις — на седалище открыто на улицах (δίφρος — седалище; ἐμφανῶς — явно)."
  15: "προσκαλουμένη τοὺς παριόντας — призывая проходящих (προσκαλέομαι — призывать). κατευθύνοντας ἐν ταῖς ὁδοῖς αὐτῶν — направляющих путь в дорогах своих (κατευθύνω — выпрямлять, направлять)."
  16: "Ὅς ἐστιν ὑμῶν ἀφρονέστατος, ἐκκλινάτω πρός με — кто из вас самый глупый, да уклонится ко мне. ἐνδεέσι δὲ φρονήσεως παρακελεύομαι λέγουσα — скудным разумения повелеваю, говоря (παρακελεύομαι — приказывать, увещевать). 「…」 — речь глупой жены, как у Премудрости в ст. 4."
  17: "Ἄρτων κρυφίων ἡδέως ἅψασθε — скрытых хлебов сладко коснитесь (ἡδέως — сладко, приятно; ἅπτομαι — касаться). ὕδατος κλοπῆς γλυκεροῦ — и воды воровства сладкой (κλοπή — кража; γλυκύς — сладкий). Син. передаёт как изречение («воды краденые сладки»); в LXX и слав. — повелительное наклонение."
  18: "ὁ δὲ οὐκ οἶδεν ὅτι γηγενεῖς παρ᾽ αὐτῇ ὄλλυνται — он не знает, что земнородные у неё погибают (γηγενής — земнородный; ὄλλυμι — губить). ἐπὶ πέτευρον ᾅδου συναντᾷ — и на жердь ада выходит (πέτευρον — жердь, насест ловушки; тёмное место, слав. «во дне ада обретаются»). 18a–18d — увещание «но отскочи, не медли…»; в LXX и слав. входят в этот стих."
