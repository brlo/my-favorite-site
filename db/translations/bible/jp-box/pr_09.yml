# jp-box, Притчи, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc есть для всей главы — контроль церковного
# чтения; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: дом и трапеза Премудрости (1–6), речь Премудрости — 「…」 4–6; изречения
# о наставлении (7–12); глупая жена и её зов (13–18), её речь — 「…」 16–17.
# Нумерация по gr: 18 стихов. Дефектов «.» в главе нет. Слав. добавления без опоры
# в LXX (9:6 «да во веки воцаритеся», 9:12 «Сын наказан премудр будет…») внесены
# в основной текст без скобок; слав. глосса в 9:7 не переводится.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

