verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、ツロについて泣[な]き歌[うた]を唱[とな]えよ。"
  3: "海[うみ]の出入口[でいりぐち]に住[す]み、多[おお]くの島[しま]々から民[たみ]々の市場[いちば]へと通[かよ]うツロに言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。ツロよ、あなたは言[い]った。『わたしは美[うつく]しさの極[きわ]みを自分[じぶん]に着[き]せた』と。"
  4: "ベエリムよ、あなたは海[うみ]の真[ま]ん中[なか]にいる。あなたの子[こ]らはあなたに美[うつく]しさを着[き]せた。"
  5: "サニルの杉[すぎ]であなたは建[た]てられ、レバノンから糸杉[いとすぎ]の板[いた]が取[と]られて、あなたの樅[もみ]の帆柱[ほばしら]とされた。"
  6: "バシャンからあなたの櫂[かい]を造[つく]り、象牙[ぞうげ]であなたの聖所[せいしょ]を造[つく]り、キティムの島[しま]々からは木[き]の家[いえ]々を造[つく]った。"
  7: "エジプトの刺繍[ししゅう]した亜麻布[あまぬの]があなたの敷[し]き物[もの]となり、あなたに栄[は]えを添[そ]えた。エリサの島[しま]々からの青[あお]と紫[むらさき]の布[ぬの]があなたの覆[おお]いとなった。"
  8: "シドンとアルワドに住[す]む者[もの]たちがあなたの漕[こ]ぎ手[て]となった。ツロよ、あなたのうちにいた知[ち]恵[え]ある者[もの]たちが、あなたの舵取[かじと]りとなった。"
  9: "ゲバルの長老[ちょうろう]たちとその知[ち]恵[え]ある者[もの]たちがあなたのうちにいて、あなたの計画[けいかく]を固[かた]めた。海[うみ]のすべての船[ふね]とその漕[こ]ぎ手[たち]は、西[にし]の果[は]てへ行[ゆ]くためにあなたのものとなった。"
  10: "ペルシア人[じん]、リュディア人[じん]、リビア人[じん]があなたの軍[ぐん]にいた。彼らはあなたのうちに盾[たて]と兜[かぶと]を掛[か]け、あなたに威光[いこう]を添[そ]えた。"
  11: "アルワドの者[もの]たちとあなたの軍[ぐん]があなたの城壁[じょうへき]の上[うえ]にいた。メディア人[じん]もあなたの塔[とう]のうちで見張[みは]りをしていた。彼らはあなたの周[まわ]りの城壁[じょうへき]に矢筒[やづつ]を掛[か]けた。彼らがあなたの美[うつく]しさを完成[かんせい]させた。"
  12: "カルタゴ人[じん]はあなたの商[あきな]い手[て]であった。あなたのあらゆる力[ちから]の多[おお]さのゆえに、彼らは銀[ぎん]と金[きん]と銅[どう]と鉄[てつ]と錫[すず]と鉛[なまり]をあなたの商品[しょうひん]として与[あた]えた。"
  13: "ギリシアと、そのすべてと、それに連[つら]なる者[もの]たちが、あなたと取[と]り引[ひ]きした。彼らは人[ひと]の魂[たましい]と青銅[せいどう]の器[うつわ]をあなたの交易[こうえき]として与[あた]えた。"
  14: "テルガマの家[いえ]から、馬[うま]と騎手[きしゅ]と騾馬[らば]をあなたの商品[しょうひん]として与[あた]えた。"
  15: "ロドスの者[もの]たちはあなたの商[あきな]い手[て]であった。島[しま]々はあなたの交易[こうえき]を増[ふ]やした。彼らは象牙[ぞうげ]の歯[きば]を持[も]ち込[こ]み、あなたはその代[だい]として報[むく]いを返[かえ]した。"
  16: "タルシスの人[ひと]々は、あなたの混[ま]じり合[あ]った者[もの]たちの多[おお]さのゆえに、あなたと人[ひと]を取[と]り引[ひ]きした。彼らは没薬[もつやく]と色[いろ]とりどりの織[お]り物[もの]、ラモトとホルホルをあなたの商品[しょうひん]として与[あた]えた。"
  17: "ユダとイスラエルの子[こ]らはあなたの商[あきな]い手[て]であった。彼らは小麦[こむぎ]と香油[こうゆ]とカシアと、最[もっと]も良[よ]い蜜[みつ]と油[あぶら]と樹脂[じゅし]を、あなたの混[ま]じり合[あ]った者[もの]たちへの品[しな]として与[あた]えた。"
  18: "ダマスコは、あなたのあらゆる力[ちから]の多[おお]さのゆえに、あなたの商[あきな]い手[て]であった。ヘルボンのぶどう酒[しゅ]と、ミレトスの白[しろ]い羊毛[ようもう]がある。"
  19: "彼らはぶどう酒[しゅ]をあなたの市場[いちば]に納[おさ]めた。アシルからは鍛[きた]えられた鉄[てつ]と車輪[しゃりん]が、あなたの混[ま]じり合[あ]った者[もの]たちの間[あいだ]にある。"
  20: "デダンはあなたと、戦車[せんしゃ]のための選[え]り抜[ぬ]きの家畜[かちく]を取[と]り引[ひ]きした。"
  21: "アラビアとケダルのすべての君[きみ]たちは、あなたの手[て]によってあなたと取[と]り引[ひ]きした。彼らはらくだと雄羊[おひつじ]と子羊[こひつじ]をあなたのうちで売[う]り買[か]いした。"
  22: "サバとラグマの商人[しょうにん]たちはあなたの商[あきな]い手[て]であった。彼らは最[もっと]も良[よ]い香[こう]りと、すばらしい石[いし]と金[きん]をあなたの商品[しょうひん]として与[あた]えた。"
  23: "ハラン、カンナ、デダン、サバ、アッスル、ハルマンは、あなたの商[あきな]い手[て]であった。"
  24: "彼らは青[あお]の布[ぬの]と緋[ひ]の布[ぬの]、色[いろ]とりどりの織[お]り物[もの]、縄[なわ]で結[むす]んだ選[え]り抜[ぬ]きの宝[たから]、糸杉[いとすぎ]の織[お]り物[もの]を携[たずさ]えて、あなたと取[と]り引[ひ]きした。"
  25: "カルタゴの船[ふね]があなたの隊商[たいしょう]であった。あなたは満[み]ち、海[うみ]の真[ま]ん中[なか]でひどく重[おも]くなった。"
  26: "あなたの漕[こ]ぎ手[たち]があなたを多[おお]くの水[みず]の上[うえ]に漕[こ]ぎ出[だ]した。南風[みなみかぜ]があなたを海[うみ]の真[ま]ん中[なか]で砕[くだ]いた。"
  27: "あなたの力[ちから]とあなたの報[むく]い、あなたの混[ま]じり合[あ]った者[もの]たち、あなたの漕[こ]ぎ手[たち]、あなたの舵取[かじと]り、あなたの助言[じょげん]者[しゃ]たち、あなたの混[ま]じり合[あ]った者[もの]たちから出[で]た混[ま]じり合[あ]いの者[もの]たち、あなたのうちにいるすべての戦[いくさ]人[びと]、あなたのすべての集[あつ]まりは、あなたの倒[たお]れる日[ひ]に、あなたの真[ま]ん中[なか]で、海[うみ]の真[ま]ん中[なか]に落[お]ちる。"
  28: "あなたの叫[さけ]びの声[こえ]によって、あなたの舵取[かじと]りたちは恐[おそ]れで震[ふる]える。"
  29: "船[ふね]から下[お]りる者[もの]はみな、あなたの漕[こ]ぎ手[たち]も、船[ふね]に乗[の]る者[もの]たちも、海[うみ]の舵取[かじと]りたちも、地[ち]に立[た]つ。"
  30: "彼らはあなたについて声[こえ]を上[あ]げて叫[さけ]び、苦[にが]く叫[さけ]ぶ。彼らは頭[あたま]に土[つち]を載[の]せ、灰[はい]の中[なか]に伏[ふ]す。"
  31: "彼らはあなたのために頭[あたま]を禿[は]げ、粗布[あらぬの]をまとう。彼らはあなたのために、魂[たましい]の苦[にが]しみのうちに泣[な]き、苦[にが]い泣[な]きに愕然[がくぜん]とする。"
  32: "彼らはあなたについて泣[な]き歌[うた]をとり、あなたのために弔[とむら]いの歌[うた]を歌[うた]う。『だれがツロのようであろうか。海[うみ]の真[ま]ん中[なか]で黙[だま]りこんだ者[もの]のようであろうか。"
  33: "あなたは海[うみ]からどれほどの報[むく]いを得[え]たのか。あなたは自分[じぶん]の多[おお]くのものによって諸国民[しょこくみん]を満[み]たし、混[ま]じり合[あ]った者[もの]たちの多[おお]さによって地[ち]のすべての王[おう]たちを富[と]ませた。"
  34: "今[いま]、あなたは海[うみ]のうちで、水[みず]の深[ふか]みで砕[くだ]かれた。あなたの混[ま]じり合[あ]った者[もの]たちとあなたのすべての集[あつ]まりは、あなたの真[ま]ん中[なか]で倒[たお]れた。あなたの漕[こ]ぎ手[たち]もみな。"
  35: "島[しま]々に住[す]む者[もの]たちはみな、あなたについて嘆[なげ]いた。その王[おう]たちは恐[おそ]れに震[ふる]え、顔[かお]に涙[なみだ]を流[なが]した。"
  36: "国民[こくみん]の商人[しょうにん]たちは、あなたについて口笛[くちぶえ]を吹[ふ]いた。あなたは滅[ほろ]びとなった。あなたは永遠[えいえん]にいなくなる、と主[しゅ]なる神[かみ]は言[い]われる』」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: формула вне кавычек; даты при ней нет (в отличие от 26:1; 29:1)."
  2: "Υἱὲ ἀνθρώπου — «сын человеческий» (人[ひと]の子[こ]). λαβὲ ἐπὶ Σορ θρῆνον — «возьми на Тир плач» (θρῆνος — плач, 泣[な]き歌[うた]); слав. «возми на сор плачь». Здесь открывается слово Господа, которое идёт до конца главы; плач — его содержание."
  3: "τῇ κατοικούσῃ ἐπὶ τῆς εἰσόδου τῆς θαλάσσης — «живущей при входе моря» (εἴσοδος — вход, 出入口[でいりぐち]); τῷ ἐμπορίῳ τῶν λαῶν ἀπὸ νήσων πολλῶν — «торжищу народов от многих островов» (ἐμπόριον — торговое место, 市場[いちば]); Σὺ εἶπας Ἐγὼ περιέθηκα ἐμαυτῇ κάλλος μου — «ты сказал: я возложила на себя красоту мою»: слова Тира в 『…』. τάδε λέγει κύριος — «так говорит Господь» (слав. «адонаи Господь») внутри речи."
  4: "ἐν καρδίᾳ θαλάσσης τῷ Βεελιμ — «в сердце моря, Веелим»: τῷ Βεελιμ — тёмное слово, вероятно искажённое евр. «пределы твои» (в Синодальном «пределы твои в сердце морей»); в LXX и слав. («веелиму») стоит транслитерация, она сохранена как ベエリム. υἱοί σου περιέθηκάν σοι κάλλος — «сыны твои возложили на тебя красоту» (слав. «сынове твои возложиша на тя доброту»)."
  5: "κέδρος ἐκ Σανιρ — «кедр из Санира» (Σανιρ — Сенир, サニル); ταινίαι σανίδων κυπαρίσσου ἐκ τοῦ Λιβάνου — «полосы (доски) кипарисовые с Ливана»; ἱστοὺς ἐλατίνους — «мачты еловые» (ἐλάτινος — еловый, 樅[もみ]). В слав. те же три породы, порядок сохранён."
  6: "ἐκ τῆς Βασανίτιδος — «из Васантиды» (Башан, バシャン); κῶπαι — «вёсла» (櫂[かい]); τὰ ἱερά σου ἐποίησαν ἐξ ἐλέφαντος — «святыни (украшения) твои сделали из слоновой кости» (слав. «святилища твоя»); οἴκους ἀλσώδεις ἀπὸ νήσων τῶν Χεττιιν — «домы рощистые (украшенные) с островов Киттимских»: тёмное место, передано буквально; в Синодальном «скамьи… из букового дерева» (МТ)."
  7: "βύσσος μετὰ ποικιλίας ἐξ Αἰγύπτου — «виссон с испещрением из Египта» (βύσσος — тонкий лён, 亜麻布[あまぬの]); στρωμνή — «постилка, подстилка» (敷[し]き物[もの]); τοῦ περιθεῖναί σοι δόξαν — «чтобы придать тебе славу»; ὑάκινθος καὶ πορφύρα — «гиацинт (голубое) и порфира» (青[あお]と紫[むらさき]); ἐκ τῶν νήσων Ελισαι — «с островов Елисы» (エリサ); περιβόλαια — «покрывала»."
  8: "οἱ κατοικοῦντες Σιδῶνα — «живущие в Сидоне» (シドン); Αράδιοι — «арадийцы» (Арвад, アルワド); κωπηλάται — «гребцы» (漕[こ]ぎ手[て]); οἱ σοφοί σου — «мудрецы твои» (知[ち]恵[え]ある者[もの]たち); κυβερνῆται — «кормчие» (舵取[かじと]り)."
  9: "οἱ πρεσβύτεροι Βυβλίων — «старцы Вивлийские» (Библ/Гевал, ゲバル); ἐνίσχυον τὴν βουλήν σου — «укрепляли совет (решение) твой» (βουλή), слав. «укрепляху совет твой»; в Синодальном «заделывать пробоины» (МТ), в текст не внесено. ἐπὶ δυσμὰς δυσμῶν — «на запады западóв», т. е. к крайним западным пределам: тёмный оборот, передан как 西[にし]の果[は]て. πλοῖα καὶ κωπηλάται — «корабли и гребцы»."
  10: "Πέρσαι καὶ Λυδοὶ καὶ Λίβυες — «персы, лидяне и ливийцы» (ペルシア人[じん]、リュディア人[じん]、リビア人[じん]); ἐν τῇ δυνάμει σου — «в силе (войске) твоей»; ἄνδρες πολεμισταί — «мужи воители»; πέλται — «щиты (пельты)»; περικεφαλαῖαι — «шлемы» (兜[かぶと]); ἔδωκαν τὴν δόξαν σου — «дали славу твою» (威光[いこう])."
  11: "υἱοὶ Αραδίων καὶ ἡ δύναμίς σου — «сыны арадийцев и сила твоя»; ἐπὶ τῶν τειχέων σου φύλακες — «на стенах твоих стражи»; φαρέτραι — «колчаны» (矢筒[やづつ]); ὅρμοι — «выступы, зубцы» стен; ἐτελείωσάν σου τὸ κάλλος — «довершили красоту твою». Слав. добавляет «но и мидяне во пиргах твоих быша стражие»: в LXX этого нет (ἡ δύναμίς σου), внесено без 〔…〕 (メディア人[じん]); в Синодальном на этом месте «Гамадимы» (МТ)."
  12: "Καρχηδόνιοι — «кархидоняне», т. е. карфагеняне (カルタゴ人[じん]; в Синодальном «Фарсис» — МТ). ἀπὸ πλήθους πάσης ἰσχύος σου — «от множества всей силы твоей»; ἀργύριον καὶ χρυσίον καὶ σίδηρον καὶ κασσίτερον καὶ μόλυβδον — «серебро и золото, и железо, и олово, и свинец». Слав. добавляет «медь» и «чистое [олово]» — нет в LXX, внесено без 〔…〕."
  13: "ἡ Ἑλλὰς καὶ ἡ σύμπασα καὶ τὰ παρατείνοντα — «Еллада и вся [вселенная] и прилегающие [земли]»: три члена в гр.; слав. свёл к «Еллада вся и ближнии твои» — в тексте по слав. (ギリシア…そのすべ…隣の者たち). ἐνεπορεύοντό σοι ἐν ψυχαῖς ἀνθρώπων — «торговали с тобой душами человеческими» (рабами); σκεύη χαλκᾶ — «сосуды медные» (青銅[せいどう]の器[うつわ])."
  14: "ἐξ οἴκου Θεργαμα — «из дома Фергамы» (Бет-Тогарма, テルガマ); ἵπποι καὶ ἱππεῖς — «кони и всадники»; ἡμίονοι — «мулы» (騾馬[らば]); слав. «мщата» (мски)."
  15: "υἱοὶ Ῥοδίων — «сыны Родийские», т. е. родосцы (ロドス); ἀπὸ νήσων — «с островов»; ἐπλήθυναν τὴν ἐμπορίαν σου — «умножили торговлю твою»; ὀδόντας ἐλεφαντίνους — «зубы слоновые» (слоновая кость); τοῖς εἰσαγομένοις ἀντεδίδους τοὺς μισθούς σου — «ввозимым воздавал ты плату свою». В Синодальном «сыны Дедана» (МТ) — не внесено."
  16: "ἀνθρώπους ἐμπορίαν σου — «людьми (рабами) — торговля твоя»; ἀπὸ πλήθους τοῦ συμμίκτου σου — «от множества смешения твоего» (σύμμικτος — смешанная толпа, 混[ま]じり合[あ]った者[もの]たち); στακτή — «стакти, капля мирры» (没薬[もつやく]); ποικίλματα ἐκ Θαρσις — «испещрённые [ткани] из Тарсиса» (タルシス); Ραμωθ καὶ Χορχορ — тёмные слова (слав. «рамоф и хорхор»), вероятно благовония или ткани; в Синодальном иное (Арам, карбункулы, кораллы — МТ)."
  17: "Ιουδας καὶ οἱ υἱοὶ τοῦ Ισραηλ — «Иуда и сыны Израиля»; ἐν σίτου πράσει — «в продаже пшеницы»; μύρα καὶ κασία — «мирра и касия» (カシア); πρῶτον μέλι — «первый (лучший) мёд»; ἔλαιον καὶ ῥητίνη — «елей и смола» (樹脂[じゅし]); εἰς τὸν σύμμικτόν σου — «в смешение твоё», т. е. в твой обмен."
  18: "Δαμασκὸς ἔμπορός σου — «Дамаск — торговец твой»; οἶνος ἐκ Χελβων — «вино из Хелвона» (ヘルボン); ἔρια ἐκ Μιλήτου — «шерсть из Милета» (ミレトス). Слав. в конце 18-го добавляет «вино деданово и ионаново и меозелево в куплю твою даша» — этих имён в LXX нет (в LXX просто «и вино в торг твой дали», начало 19-го); отмечено, в текст не внесено, деление стихов — по LXX."
  19: "καὶ οἶνον εἰς τὴν ἀγορὰν σου ἔδωκαν — «и вино в торг твой дали» (в слав. эта клауза отнесена к 18-му); ἐξ Ασηλ σίδηρος εἰργασμένος — «из Асила железо обработанное» (アシル); τροχός — «колесо» (車輪[しゃりん]); ἐν τῷ συμμίκτῳ σού ἐστιν — «в смешении твоём есть» (в Синодальном «кассия и благовонная трость» — МТ)."
  20: "Δαιδαν — «Дедан» (デダン); μετὰ κτηνῶν ἐκλεκτῶν εἰς ἅρματα — «со скотом избранным для колесниц» (戦車[せんしゃ]のための家畜[かちく]); в Синодальном «драгоценными попонами» (МТ)."
  21: "ἡ Ἀραβία καὶ πάντες οἱ ἄρχοντες Κηδαρ — «Аравия и все князья Кидарские» (ケダル); διὰ χειρός σου — «чрез руку твою», т. е. через твоё посредничество; καμήλους καὶ κριοὺς καὶ ἀμνούς — «верблюдов, и баранов, и агнцев»; ἐν οἷς ἐμπορεύονταί σε — «которыми торгуют с тобой» (слав. «в тебе продадят»)."
  22: "ἔμποροι Σαβα καὶ Ραγμα — «купцы Савы и Рагмы» (サバ、ラグマ); μετὰ πρώτων ἡδυσμάτων — «с первыми (лучшими) благовониями» (ἥδυσμα — благовоние, 香[こう]り); λίθων χρηστῶν — «камней хороших» (すばらしい石[いし])."
  23: "Χαρραν καὶ Χαννα — «Харран и Ханна» (ハラン、カンナ); Ασσουρ καὶ Χαρμαν — «Ассур и Харман» (アッスル、ハルマン). Слав. добавляет «дедан» и «сава» — нет в LXX, внесено без 〔…〕."
  24: "φέροντες ἐμπορίαν ὑάκινθον — «приносящие торговлю: гиацинт (голубое)»; θησαυροὶ ἐκλεκτοὶ δεδεμένοι σχοινίοις — «сокровища избранные, связанные верёвками»; κυπαρίσσινα — «кипарисовые [товары]» (糸杉[いとすぎ]の織[お]り物[もの]). Слав. добавляет «червленицу и испещренная» (緋[ひ]の布[ぬの]、色[いろ]とりどりの織[お]り物[もの]) — нет в LXX, внесено без 〔…〕."
  25: "πλοῖα, ἐν αὐτοῖς Καρχηδόνιοι ἔμποροί σου — «корабли, в них кархидоняне — торговцы твои» (слав. «корабли, в тех купля твоя»); ἐν τῷ πλήθει ἐν τῷ συμμίκτῳ σου — «во множестве, в смешении твоём»; ἐνεπλήσθης καὶ ἐβαρύνθης σφόδρα ἐν καρδίᾳ θαλάσσης — «наполнился и отяжелел весьма в сердце моря» (слав. «насытился еси, и отягчал зело»)."
  26: "ἐν ὕδατι πολλῷ ἦγόν σε οἱ κωπηλάται σου — «по водам многим вели тебя гребцы твои»; τὸ πνεῦμα τοῦ νότου — «ветер южный» (νότος — юг, 南風[みなみかぜ]); συνέτριψέν σε ἐν καρδίᾳ θαλάσσης. В Синодальном «восточный ветер» (МТ), здесь по LXX и слав. — южный."
  27: "Длинный перечень: δυνάμεις σου — «силы твои», ὁ μισθός — «плата твоя», οἱ σύμμικτοι — «смешанные твои», κωπηλάται — «гребцы», κυβερνῆται — «кормчие», σύμβουλοι — «советники» (助言[じょげん]者[しゃ]), οἱ ἄνδρες οἱ πολεμισταί — «мужи воители», πᾶσα ἡ συναγωγή σου — «всё собрание твоё» (集[あつ]まり); πεσοῦνται ἐν καρδίᾳ θαλάσσης ἐν τῇ ἡμέρᾳ τῆς πτώσεώς σου — «падут в сердце моря в день падения твоего». Повтор σύμμικτος («смешение твоё из смешанных твоих») сохранён."
  28: "πρὸς τὴν φωνὴν τῆς κραυγῆς σου — «от голоса вопля твоего»; οἱ κυβερνῆταί σου φόβῳ φοβηθήσονται — «кормчие твои страхом убоятся» (cognatus instrumentalis, 恐[おそ]れで震[ふる]える)."
  29: "πάντες οἱ κωπηλάται σου καὶ οἱ ἐπιβάται — «все гребцы твои и плывущие [на кораблях]» (ἐπιβάτης — пассажир, 乗[の]る者[もの]); οἱ πρωρεῖς τῆς θαλάσσης — «носовые (кормчие) моря» (πρωρεύς): тёмное место, передано 海[うみ]の舵取[かじと]りたち; слав. «всадницы и ловцы морстии» — иное понимание. ἐπὶ τὴν γῆν στήσονται — «на землю станут»."
  30: "ἀλαλάξουσιν — «завопят» (ἀλαλάζω); κεκράξονται πικρόν — «возопиют горько»; ἐπιθήσουσιν ἐπὶ τὴν κεφαλὴν αὐτῶν γῆν — «возложат на головы свои землю»; σποδὸν ὑποστρώσονται — «пеплом подстелют [себе]» (灰[はい]の中[なか]に伏[ふ]す)."
  31: "В gr-lxx-byz на месте стиха стоит «.» — в модуле лакуна; стих переведён по церковнославянскому (csl-ru) без 〔…〕 (решение брифа): «и оплешивеют над тобою плешьми, и облекутся во вретище, и восплачутся о тебе в горести души, и плачем горьким ужаснутся». ἀποξύρω — «выбрить (плешь)», σάκκος — «вретище» (粗布[あらぬの]), πένθος — «плач». Синодальный: «остригут по тебе волосы догола… горьким плачем»."
  32: "λήμψονται οἱ υἱοὶ αὐτῶν ἐπὶ σὲ θρῆνον καὶ θρήνημά σοι — «возьмут сыны их о тебе плач и плачевную песнь тебе» (θρήνημα — плачевная песнь). Слав. добавляет «кто якоже тир умолкнувый среде моря?» (だれがツロのようであろうか…黙[だま]りこんだ者[もの]) — в LXX этого нет (масоретское чтение), внесено без 〔…〕. Здесь начинается плач купцов — 『…』, который идёт до конца главы."
  33: "Πόσον τινὰ εὗρες μισθὸν ἀπὸ τῆς θαλάσσης — «какую [величиной] плату обрёл ты от моря?» (в слав. этот вопрос стоит в конце 32-го, а 33-й начинается с «наполнил еси страны»; деление — по LXX). ἐνέπλησας ἔθνη ἀπὸ τοῦ πλήθους σου — «наполнил народы от множества твоего»; ἀπὸ τοῦ συμμίκτου σου ἐπλούτισας πάντας βασιλεῖς τῆς γῆς — «смешением твоим обогатил всех царей земли»."
  34: "νῦν συνετρίβης ἐν θαλάσσῃ, ἐν βάθει ὕδατος — «ныне сокрушён ты в море, в глубине воды»; ὁ σύμμικτός σου καὶ πᾶσα ἡ συναγωγή σου ἐν μέσῳ σου ἔπεσον — «смешение твоё и всё собрание твоё среди тебя пали»; πάντες οἱ κωπηλάται σου — «все гребцы твои». Слав. «вси весленицы твои»."
  35: "πάντες οἱ κατοικοῦντες τὰς νήσους ἐστύγνασαν ἐπὶ σέ — «все живущие на островах поникли (омрачились) о тебе» (στυγνάζω); οἱ βασιλεῖς αὐτῶν ἐκστάσει ἐξέστησαν — «цари их ужасом ужаснулись»; ἐδάκρυσεν τὸ πρόσωπον αὐτῶν — «прослезилось лицо их» (слав. «прослезися лице их»)."
  36: "ἔμποροι ἀπὸ ἐθνῶν ἐσύρισάν σε — «купцы из народов присвистнули тебе» (συρίζω — свистеть в знак ужаса, 口笛[くちぶえ]を吹[ふ]く); ἀπώλεια ἐγένου — «погибелью ты стал»; οὐκέτι ἔσῃ εἰς τὸν αἰῶνα — «не будешь более в век». Слав. добавляет в конце «глаголет Господь Бог» — в LXX его нет; оставлено внутри плача, как в слав. Плач купцов и слово Господа закрываются."
