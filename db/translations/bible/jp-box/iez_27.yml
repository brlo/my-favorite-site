# jp-box, Иезекииль, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 27 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: плач о Тире-корабле. 1–2 слово Господа и повеление поднять плач;
# 3–9 постройка и оснастка корабля: кедр Санира, кипарис Ливана, вёсла из Башана,
# слоновая кость Киттима, виссон Египта, гиацинт и порфира Елисы, гребцы Сидона
# и Арвада, кормчие и советники Гевала; 10–11 персы, лидийцы, ливийцы, арадийцы
# и «мидяне» на стенах; 12–25 торговые партнёры и товары (Карфаген, Греция, Фергама,
# Родос, Тарсис, Иуда и Израиль, Дамаск, Дедан, Аравия и Кидар, Сава и Рагма, Харран,
# Ассур); 26–28 гибель в сердце моря, южный ветер, вопль кормчих; 29–32 всеобщий
# плач гребцов и царей островов, посыпание главы прахом; 33–36 плач купцов,
# «не будешь во веки».
# Голоса: 1 — формула вне кавычек. 2–36 — одно непрерывное слово Господа в 「…」
# (повеление пророку и самый плач — внутри одной цитаты; формула «так говорит
# Господь» в 3 внутри речи). 3 — слова Тира в 『…』. 32–36 — плач купцов в 『…』,
# вложенный в слово Господа (в 36 слав. «глаголет Господь Бог» стоит в конце плача;
# в LXX его нет — отмечено).
# «Точка»: 27:31 — в gr-lxx-byz на месте стиха «.», переведено по слав. (csl-ru),
# без 〔…〕; в notes отмечено «в модуле лакуна».
# Имена и термины: ツロ, シドン, アルワド, ゲバル, エリサ, キティム, サニル, タルシス,
# カルタゴ人, ペルシア人, リュディア人, リビア人, メディア人, テルガマ, ロドス,
# ヘルボン, ミレトス, デダン, ケダル, サバ, ラグマ, ハラン, アッスル, ハルマン, ベエリム.
# 漕[こ]ぎ手 — κωπηλάται, 舵取[かじと]り — κυβερνῆται (единообразно в 27:8, 9, 27, 28, 29).
#
