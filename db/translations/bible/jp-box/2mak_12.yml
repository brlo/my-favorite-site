# jp-box, 2 Маккавейская, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 46 стихов (у gr — 45). Слав. делит gr 12:45
# на два стиха: наш 12:45 = «он взирал на уготованную награду… святая и благочестивая
# мысль», наш 12:46 = «потому он и совершил за умерших моление, чтобы очистились
# от греха» (= хвост gr 12:45; в gr отдельного ст. 46 нет). Это оговорённый
# добавочный стих по слав. Остальные стихи 1–44 совпадают с gr.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 мир с Лисием и беспокойство от местных военачальников;
# 3–9 иоппийское злодейство и месть Иуды, Иамния; 10–12 арабы; 13–16 Каспин;
# 17–25 Харак, Тимофей и его обещание; 26–31 Карнион, Ефрон, Скифополь,
# праздник седмиц; 32–37 Горгий и Мариса; 38–46 молитва за павших и жертва
# за умерших (наш 12:45–46).
# Голоса: прямой речи нет; 12:46 — завершение авторского рассуждения.
# Имена: ティモテオス, アポロニオス, イエロニモス, デモフォン, ニカノル, ゴルギアス,
# ドシフェイ, ソシパトロス, ハイレオス, アポロファネス, バキノル, エズドリン,
# カスピン, ハラク, カルニオン, エフロン, マリサ, オドラム, ヤムニア, スキトポリス
# — новое; ユダ, マッカバイオス, アンティオキア, エルサレム, イドメア.
# Деньги: две тысячи драхм; стадии: девять, двести сорок, семьсот пятьдесят,
# шестьсот; числа: двести, пять тысяч, три тысячи, четыреста, двадцать пять тысяч,
# двенадцать мириад, две тысячи пятьсот, десять тысяч, тридцать тысяч.

