verses:
  1: "こうした協定[きょうてい]が結[むす]ばれると、リュシアスは王[おう]のもとへ去[さ]り、ユダヤ人[じん]たちは農耕[のうこう]に戻[もど]った。"
  2: "しかし、その土地[とち]の将軍[しょうぐん]たちであるティモテオス、ゲンナイオスの子[こ]アポロニオス、さらにイエロニモスとデモフォン、そのうえキプロスの長[ちょう]ニカノルは、彼らを安[やす]らかに暮[く]らさせず、平穏[へいおん]に過[す]ごさせなかった。"
  3: "さて、イオッピア人[じん]たちは次[つぎ]のような不敬[ふけい]を行[おこな]った。すなわち、彼らは自分[じぶん]たちとともに住[す]むユダヤ人[じん]たちに、妻[つま]や子[こ]どもとともに彼らが用意[ようい]した舟[ふね]に乗[の]るように勧[すす]め、あたかも彼らに対して何[なん]の悪意[あくい]もないかのように装[よそお]ったのである。"
  4: "そして、町[まち]の公[おおやけ]の決議[けつぎ]に従[したが]って、平和[へいわ]を望[のぞ]み、何[なに]ひとつ疑[うたが]いを持[も]たない者[もの]としてそれに応[おう]じた彼らを、船[ふね]を漕[こ]ぎ出[だ]して沈[しず]めた。二百人[にひゃくにん]を下[くだ]らない者[もの]が犠牲[ぎせい]となった。"
  5: "ユダは、同胞[どうほう]に対して行[おこな]われたこの残酷[ざんこく]な仕打[しう]ちを知[し]ると、自分[じぶん]とともにいる者[もの]たちに告[つ]げ、"
  6: "正[ただ]しい裁[さば]き手[て]である神[かみ]を呼[よ]び求[もと]めてから、兄弟[きょうだい]たちの血[ち]を流[なが]した者[もの]たちに攻[せ]めかかった。そして夜[よる]、その港[みなと]を焼[や]き、舟[ふね]を焼[や]き払[はら]い、そこへ逃[に]げ込[こ]んだ者[もの]たちを刺[さ]し殺[ころ]した。"
  7: "その場所[ばしょ]が閉[と]ざされていたので、彼[かれ]は引き揚[あ]げた。そして、また来[き]て、ヤムニア人[じん]の町[まち]々[まち]をすっかり根絶[こんぜつ]しようとしていた。"
  8: "また、ヤムニアにいる者[もの]たちも、そこに住[す]むユダヤ人[じん]に対して同[おな]じことをしようとしているのを知[し]ると、"
  9: "夜[よる]、ヤムニア人[じん]にも襲[おそ]いかかり、その港[みなと]を船団[せんだん]ごと焼[や]いた。そのため、炎[ほのお]の光[ひかり]は二百四十[にひゃくよんじゅう]スタディオン離[はな]れたエルサレムにまで見[み]えた。"
  10: "そこから九[きゅう]スタディオン進[すす]み、ティモテオスへ向[む]かって行[い]く途中[とちゅう]、五千人[ごせんにん]を下[くだ]らないアラビア人[じん]と五百[ごひゃく]の騎兵[きへい]が彼らに襲[おそ]いかかった。"
  11: "激[はげ]しい戦[たたか]いになり、ユダに味方[みかた]する者[もの]たちは神[かみ]の助[たす]けによって勝[か]ちを得[え]たので、敗[やぶ]れた遊牧民[ゆうぼくみん]たちは、ユダと手[て]を結[むす]ぼうと願[ねが]い出[で]た。そして、家畜[かちく]を提供[ていきょう]し、そのほかの点[てん]でも役[やく]に立[た]つと約束[やくそく]した。"
  12: "ユダは、彼らがほんとうに多[おお]くの面[めん]で役に立つと考[かんが]え、彼らと平和[へいわ]を結[むす]ぶことに同意[どうい]した。そして手[て]を結[むす]ぶと、彼らは自分[じぶん]たちの天幕[てんまく]へ去[さ]った。"
  13: "彼[かれ]はまた、橋[はし]々[ばし]で守[まも]られ、城壁[じょうへき]で囲[かこ]まれ、さまざまな民[たみ]が混[ま]じり合[あ]って住[す]むカスピンという町[まち]にも攻[せ]めかかった。"
  14: "ところが、中[なか]にいる者[もの]たちは城壁[じょうへき]の堅固[けんご]さと食料[しょくりょう]の蓄[たくわ]えに頼[たよ]って、横柄[おうへい]な態度[たいど]をとり、ユダとその仲間[なかま]を悪[わる]く言[い]い、さらに冒瀆[ぼうとく]の言葉[ことば]を吐[は]き、許[ゆる]されないことを語[かた]った。"
  15: "そこでユダとその仲間[なかま]たちは、世界[せかい]の大[だい]いなる支配者[しはいしゃ]を呼[よ]び求[もと]めた。神[かみ]は、イエスの時代[じだい]に、雄羊[おひつじ]や仕掛[しか]けもなしにエリコを倒[たお]された方[かた]である。そして、獣[けもの]のように城壁[じょうへき]へと襲[おそ]いかかった。"
  16: "そして、神[かみ]の御心[みこころ]によってその町[まち]を取[と]り、言[い]い尽[つ]くせないほどの殺戮[さつりく]を行[おこな]った。そのため、そばにある幅[はば]二[に]スタディオンの湖[みずうみ]が、流[なが]れ込[こ]む血[ち]で満[み]ちているように見[み]えた。"
  17: "そこから七百五十[ななひゃくごじゅう]スタディオン進[すす]んで、彼らはハラクに着[つ]き、トビア人[じん]と呼[よ]ばれるユダヤ人[じん]たちのところへ行[い]った。"
  18: "そしてティモテオスはその地方[ちほう]に見[み]つからなかった。彼[かれ]は当時[とうじ]、何[なに]も成果[せいか]を挙[あ]げないまま、その地方[ちほう]から去[さ]っており、どこか一[ひと]つの場所[ばしょ]に、たいそう堅固[けんご]な守備隊[しゅびたい]を残[のこ]していたのである。"
  19: "マッカバイオスのもとの指導者[しどうしゃ]であったドシフェイとソシパトロスは出[で]て行[い]き、ティモテオスがその要塞[ようさい]に残[のこ]した者[もの]たちのうち、一万人[いちまんにん]を超[こ]える者[もの]を滅[ほろ]ぼした。"
  20: "マッカバイオスは、自分[じぶん]の軍[ぐん]を隊[たい]ごとに分[わ]け、その隊[たい]の上[うえ]に彼らを配置[はいち]してから、ティモテオスに向[む]かって進[すす]んだ。ティモテオスは十二万[じゅうにまん]の歩兵[ほへい]と二千五百[にせんごひゃく]の騎兵[きへい]を率[ひき]いていた。"
  21: "ティモテオスはユダの到来[とうらい]を知[し]ると、女[おんな]たちと子[こ]ども、そのほかの荷物[にもつ]を、カルニオンと呼[よ]ばれる所[ところ]へ先[さき]に送[おく]った。そこは、まわりのすべての場所[ばしょ]が狭[せま]いために、包囲[ほうい]しにくく、近[ちか]づきにくい所[ところ]であった。"
  22: "ユダの最初[さいしょ]の部隊[ぶたい]が現[あら]われ、すべてを見[み]る方[かた]の現[あら]われによって敵[てき]に恐怖[きょうふ]と恐[おそ]れが生[しょう]じると、彼らは逃[に]げ出[だ]し、それぞれがめいめいの方[ほう]へ走[はし]った。そのため、しばしば味方[みかた]どうしで傷[きず]つけ合[あ]い、自分[じぶん]の剣[けん]の刃[は]で刺[さ]し貫[つらぬ]かれた。"
  23: "ユダはますます激[はげ]しく追撃[ついげき]し、不敬[ふけい]な者[もの]たちを刺[さ]し殺[ころ]して、三万[さんまん]人[にん]に及[およ]ぶ者[もの]を滅[ほろ]ぼした。"
  24: "ティモテオス自身[じしん]は、ドシフェイとソシパトロスの者[もの]たちの手[て]に落[お]ち、多[おお]くの策略[さくりゃく]をもって命[いのち]だけは助[たす]けてほしいと願[ねが]い出[で]た。というのは、彼[かれ]のもとには多[おお]くの者[もの]の親[おや]が、またある者[もの]の兄弟[きょうだい]がいて、もし彼[かれ]が死[し]ねば、その者[もの]たちが顧[かえり]みられなくなるからである。"
  25: "彼[かれ]が多[おお]くの言葉[ことば]で、その者[もの]たちを無事[ぶじ]に返[かえ]すと確[かく]約[やく]すると、彼らは兄弟[きょうだい]たちの救[すく]いのために彼[かれ]を放[はな]した。"
  26: "そしてユダはカルニオンとアテルガテイオンへ行[い]き、二万五千[にまんごせん]人[にん]を殺[ころ]した。"
  27: "彼らを敗走[はいそう]させ、滅[ほろ]ぼしたのち、彼[かれ]は堅固[けんご]な町[まち]エフロンにも軍を進[すす]めた。そこにはリュシアスと、さまざまな民[たみ]の大群[たいぐん]が住[す]んでいた。また、力強[ちからづよ]い若者[わかもの]たちが城壁[じょうへき]の前[まえ]に立[た]って力強[ちからづよ]く戦[たたか]い、うちには武具[ぶぐ]や矢[や]の蓄[たくわ]えが多[おお]くあった。"
  28: "しかし彼らは、力[ちから]をもって敵[てき]の力[ちから]を砕[くだ]かれる支配者[しはいしゃ]を呼[よ]び求[もと]め、その町[まち]を手[て]に収[おさ]め、中[なか]にいた者[もの]を二万五千[にまんごせん]人[にん]に及[およ]ぶまで倒[たお]した。"
  29: "そこから進[すす]み出[だ]して、彼らはエルサレムから六百[ろっぴゃく]スタディオン離[はな]れたスキタイ人[じん]の町[まち]へ向[む]かった。"
  30: "しかし、そこに住[す]むユダヤ人[じん]たちが、スキトポリスの住民[じゅうみん]が彼らに対して示[しめ]した好意[こうい]と、不幸[ふこう]な時[とき]にも穏[おだ]やかに接[せっ]してくれたことを証言[しょうげん]したので、"
  31: "彼らは礼[れい]を述[の]べ、これからもこの民[たみ]に対して好意[こうい]を持[も]ち続[つづ]けるようにと頼[たの]んで、エルサレムへ向[む]かった。七週[ななまわ]りの祭[まつ]りが近[ちか]づいていたからである。"
  32: "いわゆる五旬節[ごじゅんせつ]の後[のち]、彼らはイドメアの将軍[しょうぐん]ゴルギアスに向[む]かった。"
  33: "ゴルギアスは三千[さんぜん]の歩兵[ほへい]と四百[よんひゃく]の騎兵[きへい]を率[ひき]いて出[で]て来[き]た。"
  34: "戦[たたか]いが始[はじ]まると、ユダヤ人[じん]のうちのわずかな者[もの]が倒[たお]れた。"
  35: "バキノルの部下[ぶか]の一人[ひとり]で、騎手[きしゅ]として勇[いさ]ましいドシフェイは、ゴルギアスに追[お]いつき、その外套[がいとう]をつかんで力[ちから]ずく引[ひ]き寄[よ]せ、あの忌[い]まわしい者[もの]を生[い]け捕[ど]りにしようとした。ところが、トラキア人[じん]の騎兵[きへい]の一人[ひとり]が彼[かれ]に襲[おそ]いかかって肩[かた]を切[き]り落[お]としたので、ゴルギアスはマリサへ逃[に]げ延[の]びた。"
  36: "エズドリンの部下[ぶか]たちが長[なが]く戦[たたか]って疲[つか]れ果[は]てたとき、ユダは、戦[いくさ]の味方[みかた]となり先導[せんどう]者[しゃ]となってくださるようにと主[しゅ]を呼[よ]び求[もと]め、"
  37: "父[ちち]たちの言葉[ことば]で歌[うた]いながら叫[さけ]び声[ごえ]を上[あ]げ、不意[ふい]にゴルギアスの者[もの]たちに襲[おそ]いかかって、彼らを敗走[はいそう]させた。"
  38: "ユダは軍[ぐん]を率[ひき]いてオドラムの町[まち]へ来[き]た。七日目[なのかめ]が近[ちか]づいたので、彼らは慣習[かんしゅう]に従[したが]って身[み]を清[きよ]め、そこにいて安息日[あんそくび]を過[す]ごした。"
  39: "その翌日[よくじつ]、ユダとその仲間[なかま]たちは、務[つと]めとして、倒[たお]れた者[もの]たちの遺体[いたい]を引[ひ]き取[と]り、親[しん]族[ぞく]とともに先祖[せんぞ]の墓[はか]に納[おさ]めようと出[で]かけた。"
  40: "ところが、死者[ししゃ]のそれぞれの衣[ころも]の下[した]に、ヤムニアの偶像[ぐうぞう]にささげた品[しな]が見[み]つかった。律法[りっぽう]はユダヤ人[じん]にこれを禁[きん]じている。そこで、彼らが倒[たお]れた理由[りゆう]がすべての人[ひと]に明[あき]らかになった。"
  41: "そこで彼らは皆[みな]、隠[かく]されたことを明[あき]らかにされる正[ただ]しい裁[さば]き手[て]である主[しゅ]をほめたたえ、"
  42: "祈[いの]りに移[うつ]って、行[おこな]われた罪[つみ]が完全[かんぜん]に消[け]し去[さ]られるようにと願[ねが]った。そして、勇敢[ゆうかん]なユダは、倒[たお]れた者[もの]たちの罪[つみ]のために起[お]こったことを目の当[あ]たりに見[み]た者[もの]として、民[たみ]に自分[じぶん]たちを罪[つみ]のない者[もの]として保[たも]つように勧[すす]めた。"
  43: "そして、男[おとこ]たちから二千[にせん]ドラクメの銀[ぎん]を集[あつ]め、罪[つみ]のための犠牲[ぎせい]をささげるためにエルサレムへ送[おく]った。彼[かれ]は非常[ひじょう]によく、また敬虔[けいけん]にふるまい、復活[ふっかつ]について考[かんが]えていたのである。"
  44: "もし倒[たお]れた者[もの]たちがよみがえることを望[のぞ]んでいなければ、死者[ししゃ]のために祈[いの]ることは余計[よけい]で、むなしいことであろう。"
  45: "しかし彼[かれ]は、敬虔[けいけん]のうちに眠[ねむ]った者[もの]たちに最[さい]良[りょう]の報[むく]いが用意[ようい]されていることを見[み]ていた。それは聖[せい]なる、敬虔[けいけん]な考[かんが]えである。"
  46: "それゆえ彼[かれ]は、死者[ししゃ]のためにとりなしをして、彼らが罪[つみ]から解[と]かれるようにしたのである。"

notes:
  1: "τῶν συνθηκῶν τούτων — «этих договоров» (συνθῆκαι); ἀπῄει πρὸς τὸν βασιλέα — «отходил к царю»; περὶ τὴν γεωργίαν ἐγίνοντο — «занимались земледелием»."
  2: "οἱ κατὰ τόπον στρατηγοί — «местные военачальники»; Ἀπολλώνιος ὁ τοῦ Γενναίου — «Аполлоний, сын Геннея»; Ἱερώνυμος καὶ Δημοφών — «Иероним и Демофон» (イエロニモス, デモフォン); Νικάνωρ ὁ Κυπριάρχης — «Никанор, начальник Кипра» (Κυπριάρχης); οὐκ εἴων αὐτοὺς εὐσταθεῖν — «не давали им быть в покое» (εὐσταθέω)."
  3: "Ἰοππῖται — «иоппийцы» (イオッピア人[じん]); τηλικοῦτο… δυσσέβημα — «такое нечестие»; ἐμβῆναι εἰς τὰ… σκάφη — «взойти на суда» (σκάφος); ὡς μηδεμιᾶς ἐνεστώσης… δυσμενείας — «как будто нет никакой вражды»."
  4: "κατὰ τὸ κοινὸν τῆς πόλεως ψήφισμα — «по общему решению города»; ὡς ἂν εἰρηνεύειν θελόντων — «как желающих мира»; ἐπαναχθέντας αὐτοὺς ἐβύθισαν — «отплыв, их потопили» (βυθίζω); οὐκ ἔλαττον τῶν διακοσίων — «не менее двухсот»."
  5: "μεταλαβὼν… τὴν… ὠμότητα — «узнав о жестокости» (ὠμότης); παραγγείλας τοῖς περὶ αὐτὸν ἀνδράσιν — «возвестив бывшим при нём мужам»."
  6: "ἐπικαλεσάμενος τὸν δίκαιον κριτὴν θεόν — «призвав праведного судию Бога»; τοὺς μιαιφόνους τῶν ἀδελφῶν — «убийц братьев» (μιαιφόνος); τὸν λιμένα νύκτωρ ἐνέπρησεν — «пристань ночью сжёг»; τὰ σκάφη κατέφλεξεν — «суда сжёг» (καταφλέγω); ἐξεκέντησεν — «пронзил»."
  7: "τοῦ χωρίου συγκλεισθέντος — «когда место было заперто» (συγκλείω); ἐκριζῶσαι πολίτευμα — «искоренить гражданство (общество)» (ἐκριζόω)."
  8: "τοὺς ἐν Ιαμνείᾳ — «жителей Иамнии» (ヤムニア); τὸν αὐτὸν… τρόπον τοῖς παροικοῦσιν Ιουδαίοις — «то же сделать с живущими [там] иудеями» (παροικέω)."
  9: "τοῖς Ιαμνίταις νυκτὸς ἐπιβαλών — «напав ночью на иамнитян»; ὑφῆψεν τὸν λιμένα σὺν τῷ στόλῳ — «сжёг пристань с флотом» (στόλος); τὰς αὐγὰς τοῦ φέγγους — «лучи света (зарево)»; σταδίων ὄντων διακοσίων τεσσαράκοντα — «при расстоянии двухсот сорока стадий»."
  10: "ἀποσπάσαντες σταδίους ἐννέα — «отойдя на девять стадий»; Ἄραβες… οὐκ ἐλάττους τῶν πεντακισχιλίων — «арабы, не менее пяти тысяч»; ἱππεῖς πεντακόσιοι — «всадников пятьсот»."
  11: "καρτερᾶς μάχης — «упорной битвы»; διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν εὐημε ρησάντων — «по помощи Божией одержавших верх»; οἱ νομάδες — «кочевники» (νομάς); δεξιὰς αὐτοῖς — «десницы (мир)»; βοσκήματα — «пастбища (скот)»."
  12: "ἐν πολλοῖς αὐτοὺς χρησίμους — «что они во многом полезны»; εἰρήνην ἄξειν πρὸς αὐτούς — «вести (заключить) с ними мир»; εἰς τὰς σκηνὰς ἐχωρίσθησαν — «удалились в шатры»."
  13: "γεφύραις ὀχυράν — «укреплённый мостами»; τε ίχεσιν περιπεφραγμένην — «стенами окружённый» (περιφράσσω); παμμείγ εσιν ἔθνεσιν — «всякими смешанными народами»; ὄνομα δὲ Κασπιν — «по имени Каспин» (カスピン)."
  14: "τῇ τῶν βρωμάτων παραθέσει — «запасом пищи» (βρῶμα); ἀναγωγότερον ἐχρῶντο — «держались надменно (высокомерно)» (ἀνάγωγος — необузданный); λοιδοροῦντες — «злословя» (λοιδορέω)."
  15: "τὸν μέγαν τοῦ κόσμου δυνάστην — «великого Владыку мира»; ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν — «без таранов и механических орудий» (κριός — стенобитное бревно, ὄργανον); κατακρημνίσαντα τὴν Ιεριχω — «низвергшего Иерихон»; ἐνέσεισαν θηριωδῶς τῷ τε ίχει — «зверски устремились на стену» (ἐνσείω)."
  16: "τῇ τοῦ θεοῦ θελήσει — «по воле Божией»; ἀμυθήτους… σφαγάς — «несказанные избиения» (ἀμύθητος); τὴν παρακειμένην λίμνην — «лежащее рядом озеро»; κατ άρρυτον αἵματι — «залитое кровью»."
  17: "ἀποσπάσαντες σταδίους ἑπτακοσίους πεντήκοντα — «отойдя на семьсот пятьдесят стадий»; εἰς τὸν Χάρακα — «в Харак» (ハラク); Τουβιανοὺς Ιουδαίους — «иудеев-тувиан» (トビア人[じん])."
  18: "ἐπὶ τῶν τόπων οὐ κατέλαβον — «не застали на местах»; ἄπρακτον — «ничего не сделавшего»; καταλελοιπότα δὲ φρουρὰν… ὀχυράν — «оставившего весьма крепкую стражу»."
  19: "Δοσίθεος δὲ καὶ Σωσίπατρος — «Досифей и Сосипатр» (ドシフェイ, ソシパトロス); τῶν περὶ τὸν Μακκαβαῖον ἡγεμόνων — «из начальников при Маккавее»; ἐξοδεύσαντες — «выступив»; πλείους τῶν μυρίων — «более десяти тысяч»."
  20: "σπειρηδὸν — «по когортам (отрядам)»; ἐπὶ τῶν σπειρῶν — «над отрядами»; μυριάδας δώδεκα πεζῶν — «двенадцать мириад пеших» (сто двадцать тысяч); ἱππεῖς δὲ δισχιλίους πρὸς τοῖς πεντακοσίοις — «всадников две тысячи пятьсот»."
  21: "προεξαπέστειλεν — «выслал вперёд»; τὴν ἄλλην ἀποσκευήν — «остальной обоз» (ἀποσκευή); Καρνιον — «Карнион» (カルニオン); δυσπολιό ρκητον καὶ δυσπρόσιτον — «трудно осаждаемое и труднодоступное»; διὰ τὴν… στενότητα — «из-за тесноты»."
  22: "τῆς Ιουδου σπείρας πρώτης — «первой когорты Иуды»; τῆς τοῦ τὰ πάντα ἐφορῶντος ἐπιφανείας — «явления всевидящего»; εἰς φυγὴν ὥρμησαν — «устремились в бегство»; ἄλλος ἀλλαχῇ φερόμενος — «один туда, другой сюда несясь»; ὑπὸ τῶν ἰδίων βλάπτεσθαι — «от своих повреждаться»; ταῖς τῶν ξιφῶν ἀκμαῖς ἀναπείρεσθαι — «остриями мечей пронзаться» (ἀναπείρω)."
  23: "τὸν διωγμὸν εὐτονώτερον — «погоню настойчивее» (εὔτονος); συγκεντῶν τοὺς ἀλιτηρίους — «пронзая нечестивых» (ἀλιτήριος); εἰς μυριάδας τρεῖς ἀνδρῶν — «до трёх мириад мужей» (тридцать тысяч)."
  24: "ἐμπεσὼν τοῖς περὶ τὸν Δοσίθεον — «попав к людям Досифея»; μετὰ πολλῆς γοητείας — «с большим колдовством (ухищрением)» (γοητεία); ἐξαφεῖναι σῶον — «отпустить невредимым»; πλειόνων μὲν γονεῖς, ὧν δὲ ἀδελφοὺς ἔχειν — «иметь родителей многих, а некоторых — братьев»; ἀλογηθῆναι συμβήσεται — «случится, что о них не позаботятся» (ἀλογέω)."
  25: "πιστώσαντος… διὰ πλειόνων τὸν ὁρισμὸν ἀποκαταστῆσαι — «когда он многими [словами] уверил в обещании вернуть» (ὁρισμός); ἀπημάν τους — «невредимыми» (ἀπήμαντος)."
  26: "ἐπὶ τὸ Καρνιον καὶ τὸ Ατεργατειον — «на Карнион и Атергатейон» (アテルガテイオン); μυριάδας σωμάτων δύο καὶ πεντακισχιλίους — «двадцать пять тысяч тел»."
  27: "μετὰ τὴν τούτων τροπὴν καὶ ἀπώλειαν — «после их поражения и гибели»; ἐπὶ Εφρων πόλιν ὀχυράν — «на Ефрон, город крепкий»; Λυσίας — «Лисий»; πάμφυλα πλήθη — «всякие (из всех племён) множества»; νεανίαι ῥωμαλέοι — «сильные юноши»; ὀργάνων καὶ βελῶν πολλαὶ παραθέσεις — «много запасов орудий и стрел»."
  28: "τὸν δυνάστην τὸν μετὰ κράτους συντρίβοντα τὰς τῶν πολεμίων ἀλκάς — «Владыку, с силой сокрушающего силы врагов» (ἀλκή); ὑποχείριον — «под руку (в подчинение)»; εἰς μυριάδας δύο πεντακισχιλίους — «до двадцати пяти тысяч»."
  29: "ἐπὶ Σκυθῶν πόλιν — «на город скифов»; ἀπέχουσαν… σταδίους ἑξακοσίους — «отстоящий на шестьсот стадий»."
  30: "ἀπομαρτυρησάντων — «засвидетельствовавших» (ἀπομαρτυρέω); οἱ Σκυθοπολῖται — «скифополиты» (スキトポリス); τὴν… εὔνοιαν — «благорасположение»; ἥμερον ἀπάντησιν — «кроткое обхождение» (ἥμερος)."
  31: "εὐχαριστήσαντες καὶ προσπαρακαλέσαντες — «поблагодарив и попросив»; εἰς τὰ λοιπὰ πρὸς τὸ γένος εὐμενεῖς εἶναι — «и в дальнейшем быть благосклонными к роду»; τῆς τῶν ἑβδομάδων ἑορτῆς οὔσης ὑπογύου — «когда праздник седмиц был близок» (ὑπόγυος)."
  32: "τὴν λεγομένην πεντηκοστήν — «так называемую Пятидесятницу» (五旬節[ごじゅんせつ]); ἐπὶ Γοργίαν τὸν τῆς Ιδουμαίας στρατηγόν — «на Горгия, военачальника Идумеи»."
  33: "ἐξῆλθεν… μετὰ πεζῶν τρισχιλίων, ἱππέων δὲ τετρακοσίων — «вышел с тремя тысячами пеших и четырьмястами всадников». Подлежащее по gr — Горгий (ru относит к Иуде); держим gr."
  34: "παραταξαμένους… πεσεῖν ὀλίγους τῶν Ιουδαίων — «когда построились, пасть немногим из иудеев» (παρατάσσω)."
  35: "Δοσίθεος… τῶν τοῦ Βακήνορος — «Досифей, из людей Вакинора» (バキノル); ἔφιππος ἀνὴρ καὶ καρτερός — «муж конный и крепкий»; τῆς χλαμύδος — «за плащ (хламиду)»; ζωγρίαν — «живым в плен» (ζωγρία); Θρᾳκῶν — «фракийцев» (トラキア人[じん]); τὸν ὦμον καθελόντος — «отсекши плечо»; εἰς Μαρισα — «в Марису» (マリサ)."
  36: "τῶν περὶ τὸν Εσδριν — «бывших с Ездрином» (エズドリン); κατακόπων ὄντων — «будучи изнемогшими (изрубленными)» (κάτακος? κατάκοπος — утомлённый); σὺνμμαχον φανῆναι καὶ προοδηγὸν τοῦ πολέμου — «явиться союзником и предводителем войны» (προοδηγός)."
  37: "καταρξάμενος τῇ πατρίῳ φωνῇ τὴν μεθ᾽ ὕμνων κραυγήν — «начав на отеческом языке с гимнами крик» (κραυγή); ἐνσείσας ἀπροσδοκήτως — «устремившись неожиданно»; τροπὴν αὐτῶν ἐποιήσατο — «обратил их в бегство» (τροπή)."
  38: "εἰς Οδολλαμ πόλιν — «в город Одоллам» (オドラム); τῆς ἑβδομάδος ἐπιβαινούσης — «когда наступала седмица»; ἁγνισθέντες — «очистившись» (ἁγνίζω); τὸ σάββατον διήγαγον — «субботу провели»."
  39: "τὰ σώματα τῶν προπεπτωκότων ἀνακομίσασθαι — «тела павших подобрать» (ἀνακομίζω); μετὰ τῶν συγγενῶν ἀποκαταστῆσαι — «с родными положить»; εἰς τοὺς πατρῴους τάφους — «в отеческие гробницы»."
  40: "ὑπὸ τοὺς χιτῶνας — «под хитонами» (χιτών); ἱερώματα τῶν ἀπὸ Ιαμνείας εἰδώλων — «священные вещи иамнийских идолов» (ἱέρωμα); ὁ νόμος ἀπείργει — «закон запрещает» (ἀπείργω); διὰ τήνδε τὴν αἰτίαν τούσδε πεπτωκέναι — «по этой причине они пали»."
  41: "τὰ τοῦ δικαιοκρίτου κυρίου — «праведного Судии Господа» (δικαιοκρίτης); τὰ κεκρυμμένα φανερὰ ποιοῦντος — «делающего сокрытое явным»."
  42: "εἰς ἱκετείαν ἐτράπησαν — «обратились к молению»; τελείως ἐξαλειφθῆναι — «совершенно изгладиться» (ἐξαλείφω); συντηρεῖν αὑτοὺς ἀναμαρτήτους — «хранить себя безгрешными»; ὑπ᾽ ὄψιν ἑωρακότας — «видя своими глазами»."
  43: "κατ᾽ ἀνδρολογίαν — «по счёту мужей (сбор)» (ἀνδρολογία); εἰς ἀργυρίου δραχμὰς δισχιλίας — «до двух тысяч драхм серебра»; προσαγαγεῖν περὶ ἁμαρτίας θυσίαν — «принести жертву за грех»; ὑπὲρ ἀναστάσεως διαλογιζόμενος — «помышляя о воскресении» (ἀνάστασις)."
  44: "εἰ μὴ… ἀναστῆναι προσεδόκα — «если бы не надеялся, что восстанут»; περισσὸν καὶ ληρῶδες — «излишне и пустословно» (ληρώδης); ὑπὲρ νεκρῶν εὔχεσθαι — «о мёртвых молиться»."
  45: "εἶτε ἐμβλέπων — «или (но) взирая»; τοῖς μετ᾽ εὐσεβείας κοιμωμένοις — «в благочестии почившим» (κοιμάομαι); κάλλιστον ἀποκείμενον χαριστήριον — «прекраснейшая уготованная награда» (χαριστήριον); ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια — «святая и благочестивая мысль» (ἐπίνοια). Здесь по слав. стих кончается."
  46: "ὅθεν περὶ τῶν τεθνηκότων τὸν ἐξιλασμὸν ἐποιήσατο τῆς ἁμαρτίας ἀπολυθῆναι — «потому за умерших умилостивление совершил, чтобы от греха освободились» (ἐξιλασμός). В gr это конец ст. 45; в слав. отдельный стих (слав. 12:46) — нумерация по слав."
