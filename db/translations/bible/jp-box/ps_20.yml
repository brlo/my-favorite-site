verses:
  0: "指揮者[しきしゃ]のために。ダビデの詩[うた]。"
  1: "主[しゅ]よ、王[おう]はあなたの力[ちから]を喜[よろこ]び、あなたの救[すく]いを大[おお]いに喜[よろこ]び躍[おど]る。"
  2: "あなたは彼[かれ]の魂[たましい]の願[ねが]いを与[あた]え、その唇[くちびる]の求[もと]めを拒[こば]まれなかった。"
  3: "あなたは恵[めぐ]みの祝福[しゅくふく]をもって彼[かれ]を迎[むか]え、その頭[あたま]に高価[こうか]な石[いし]の冠[かんむり]を置[お]かれた。"
  4: "彼[かれ]があなたに命[いのち]を求[もと]めたので、あなたは彼[かれ]に、とこしえに続[つづ]く長[なが]い日[ひ]々[び]を与[あた]えられた。"
  5: "あなたの救[すく]いによって、彼[かれ]の栄光[えいこう]は大[おお]きい。あなたは彼[かれ]に栄光[えいこう]と威厳[いげん]を着[き]せられる。"
  6: "あなたは彼[かれ]に、とこしえの祝福[しゅくふく]を与[あた]え、あなたの御顔[みかお]とともにある喜[よろこ]びで彼[かれ]を喜[よろこ]ばせられる。"
  7: "王[おう]は主[しゅ]に寄[よ]り頼[たの]む。いと高[たか]き方[かた]の恵[めぐ]みによって、彼[かれ]は決[けっ]して揺[ゆ]るがない。"
  8: "あなたの手[て]は、あなたのすべての敵[てき]を見[み]つけ、あなたの右[みぎ]の手[て]は、あなたを憎[にく]む者[もの]をすべて見[み]つける。"
  9: "あなたは彼[かれ]らを、あなたが御顔[みかお]を現[あらわ]される時[とき]に、火[ひ]の炉[ろ]のようにする。主[しゅ]はその怒[いか]りによって彼[かれ]らをかき乱[みだ]し、火[ひ]が彼[かれ]らを食[く]い尽[つ]くす。"
  10: "あなたは彼[かれ]らの実[み]を地[ち]から、その子孫[しそん]を人[ひと]の子[こ]らの中[なか]から滅[ほろ]ぼされる。"
  11: "彼[かれ]らはあなたに悪[わる]を向[む]け、企[くわだ]てた計画[けいかく]を成[な]し遂[と]げることはできない。"
  12: "あなたは彼[かれ]らに背[せ]を向[む]けさせ、あなたの残[のこ]りの矢[や]を、彼[かれ]らの顔[かお]に向[む]けて備[そな]えられる。"
  13: "主[しゅ]よ、あなたの力[ちから]のうちに高[たか]く上[あ]がってください。わたしたちはあなたの力[ちから]あるわざを歌[うた]い、ほめ歌[うた]う。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者のために。ダビデの詩. Надписание — стих 0."
  1: "ἐν τῇ δυνάμει σου — あなたの力. ἐπὶ τῷ σωτηρίῳ σου — あなたの救い. ἀγαλλιάσεται σφόδρα — 大いに喜び躍る."
  2: "ἐπιθυμία τῆς ψυχῆς — 魂の願い. θέλησις τῶν χειλέων — 唇の求め. οὐκ ἐστέρησας — 拒まれなかった."
  3: "προέφθασας ἐν εὐλογίαις χρηστότητος — 恵みの祝福をもって迎え. στέφανος ἐκ λίθου τιμίου — 高価な石の冠."
  4: "ζωὴν ᾐτήσατο — 命を求めた. μακρότητα ἡμερῶν — 長い日々."
  5: "μεγάλη ἡ δόξα — 栄光は大きい. μεγαλοπρέπεια — 威厳."
  6: "εὐλογίαν εἰς αἰῶνα — とこしえの祝福. ἐν χαρᾷ μετὰ τοῦ προσώπου σου — 御顔とともにある喜び."
  7: "ἐλπίζει ἐπὶ κύριον — 主に寄り頼む. οὐ μὴ σαλευθῇ — 決して揺るがない."
  8: "εὑρεθείη — да обрящет. εὕροι — да найдёт."
  9: "κλίβανος πυρός — 火の炉. εἰς καιρὸν τοῦ προσώπου σου — 御顔を現される時. συνταράξει — かき乱し. καταφάγεται — 食い尽くす."
  10: "καρπός — 実. σπέρμα — 子孫."
  11: "ἔκλιναν εἰς σὲ κακά — あなたに悪を向け. βουλήν — 計画. στῆσαι — 成し遂げる."
  12: "νῶτον — 背. ἐν τοῖς περιλοίποις σου — 残りの矢で (περιλοίποις — «остатками»; смысл: обратишь их в бегство). ἑτοιμάσεις τὸ πρόσωπον — 顔を射る備えをする."
  13: "ὑψώθητι — 高く上がってください. δυναστείας — 力あるわざ."
