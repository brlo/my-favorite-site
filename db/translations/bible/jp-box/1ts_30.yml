# jp-box, 1-я Царств, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (811 стихов, под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 30: Секелаг сожжён амаликитянами, жёны и дети уведены (1–6);
# ефод и вопрос Господу (7–8); погоня до потока Восор, египетский отрок (9–16);
# поражение амаликитян и возвращение добычи (17–20); раздел добычи и устав
# Давида (21–25); дары старейшинам Иуды (26–31).
# Речь персонажей — 「…」 (6 — слова народа внутри повествования, 7–8, 13–15,
# 22–24, 26); речь Давида открывается в 23 и закрывается в 24; вложенной речи
# нет. Красного нет.
# Нумерация по gr: 31 стих, совпадает с csl/ru; в gr 30:28 внутри стиха стоит
# пометка «28a» — деление LXX, в текст не вынесена.
# Гр 30:26–31 — один период (перечень городов при «послал»); по-японски каждый
# стих закрыт повтором 送った, иначе стих без главного предложения.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет.
# Сносок ⟨…⟩ нет: 戦利品, 長老, エフォド, 祭司, アマレク人 уже в корпусе.

