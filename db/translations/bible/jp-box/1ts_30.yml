verses:
  1: "ダビデとその部下[ぶか]たちがセケラクに着[つ]いた三日目[みっかめ]、アマレクは南[みなみ]の地[ち]とセケラクに襲[おそ]いかかり、セケラクを打[う]って火[ひ]で焼[や]き払[はら]った。"
  2: "町[まち]の中[なか]にいた女[おんな]たちと、そこにあるすべてのものを、小[ちい]さな者[もの]から大[おお]きな者[もの]に至[いた]るまで、彼[かれ]らは男[おとこ]も女[おんな]も殺[ころ]さず、ただ捕[と]らえて、自分[じぶん]たちの道[みち]を行[い]った。"
  3: "ダビデとその部下[ぶか]たちが町[まち]に来[く]ると、見[み]よ、町[まち]は火[ひ]で焼[や]かれ、彼[かれ]らの妻[つま]も息子[むすこ]も娘[むすめ]も捕[と]らえられていた。"
  4: "ダビデも、彼[かれ]とともにいた者[もの]たちも、声[こえ]を上[あ]げて泣[な]いた。もはや泣[な]く力[ちから]も残[のこ]らないほどであった。"
  5: "ダビデの二人[ふたり]の妻[つま]、イズレエル人[じん]アヒノアムと、カルメル人[じん]ナバルの妻[つま]アビガイルも捕[と]らえられた。"
  6: "民[たみ]が「彼[かれ]を石[いし]で打[う]ち殺[ころ]そう」と言[い]ったので、ダビデはひどく苦[くる]しんだ。民[たみ]はみな、それぞれ自分[じぶん]の息子[むすこ]や娘[むすめ]のことで心[こころ]を痛[いた]めていたからである。しかしダビデは、自分[じぶん]の神[かみ]である主[しゅ]によって強[つよ]められた。"
  7: "ダビデは祭司[さいし]アビアタル、アヒメレクの子[こ]に言[い]った。「エフォドをわたしのところへ持[も]って来[き]よ。」"
  8: "ダビデは主[しゅ]に問[と]うて言[い]った。「わたしはこの一団[いちだん]の後[あと]を追[お]うべきか。彼[かれ]らに追[お]いついて捕[つか]まえられるか。」主[しゅ]は彼[かれ]に言[い]った。「追[お]え。あなたは必[かなら]ず追[お]いつき、必[かなら]ず奪[うば]い返[かえ]す。」"
  9: "ダビデは、自分[じぶん]とともにいた六百人[ろっぴゃくにん]の男[おとこ]たちとともに行[い]った。彼[かれ]らはボソル川[がわ]のところまで来[き]たが、あとの者[もの]たちはそこに立[た]ち止[ど]まった。"
  10: "ダビデは四百人[よんひゃくにん]の男[おとこ]たちとともに追[お]った。二百人[にひゃくにん]の男[おとこ]たちは、ボソル川[がわ]の向[む]こう側[がわ]に座[すわ]ったまま残[のこ]った。"
  11: "彼[かれ]らは野[の]でエジプト人[じん]の男[おとこ]を見[み]つけ、彼[かれ]を連[つ]れて来[き]てダビデのところへ引[ひ]き出[だ]し、パンを与[あた]えて食[た]べさせ、水[みず]を飲[の]ませた。"
  12: "また、干[ほ]しいちじくを固[かた]めたものをひときれ与[あた]えたので、彼[かれ]はそれを食[た]べ、元気[げんき]を取[と]り戻[もど]した。彼[かれ]は三日三晩[みっかみばん]、パンも水[みず]も口[くち]にしていなかったからである。"
  13: "ダビデは彼[かれ]に言[い]った。「おまえはだれの者[もの]で、どこから来[き]たのか。」エジプト人[じん]の若者[わかもの]は言[い]った。「わたしはアマレク人[じん]の男[おとこ]のしもべだ。主人[しゅじん]はわたしを置[お]き去[ざ]りにした。わたしは三日前[みっかまえ]から病気[びょうき]になってしまったからだ。」"
  14: "「わたしたちは、ホルティの南[みなみ]とユダの地方[ちほう]、それにヘルブの南[みなみ]を襲[おそ]い、セケラクを火[ひ]で焼[や]いた。」"
  15: "ダビデは彼[かれ]に言[い]った。「わたしをこの一団[いちだん]のところへ案内[あんない]できるか。」彼[かれ]は言[い]った。「神[かみ]にかけて、わたしを殺[ころ]さず、わたしを主人[しゅじん]の手[て]に引[ひ]き渡[わた]さないと誓[ちか]ってほしい。そうすれば、わたしはあなたをこの一団[いちだん]のところへ案内[あんない]する。」"
  16: "彼[かれ]がダビデをそこへ連[つ]れて行[い]くと、見[み]よ、アマレク人[じん]は地[ち]の全面[ぜんめん]に散[ち]らばって、食[た]べたり飲[の]んだりしていた。ペリシテ人[じん]の地[ち]とユダの地[ち]から奪[うば]った多[おお]くの戦利品[せんりひん]のために、祝[いわ]いを催[もよお]していたのである。"
  17: "ダビデは明[あ]けの明星[みょうじょう]のころから夕方[ゆうがた]まで、そして翌日[よくじつ]に至[いた]るまで彼[かれ]らを討[う]ち続[つづ]けた。彼[かれ]らのうち、らくだに乗[の]って逃[に]げた四百人[よんひゃくにん]の若者[わかもの]たちのほかは、一人[ひとり]も逃[のが]れられなかった。"
  18: "ダビデは、アマレク人[じん]が奪[うば]ったすべてのものを取[と]り戻[もど]し、自分[じぶん]の二人[ふたり]の妻[つま]も連[つ]れ戻[もど]した。"
  19: "彼[かれ]らには、小[ちい]さな者[もの]から大[おお]きな者[もの]に至[いた]るまで、戦利品[せんりひん]も、息子[むすこ]も娘[むすめ]も、彼[かれ]らが奪[うば]ったすべてのものも、何[なに]一[ひと]つ欠[か]けなかった。ダビデはすべてを連[つ]れ帰[かえ]った。"
  20: "ダビデはすべての羊[ひつじ]の群[む]れと牛[うし]の群[む]れを取[と]り、それらを戦利品[せんりひん]の前[まえ]に追[お]い立[た]てた。そして、その戦利品[せんりひん]について、「これはダビデの戦利品[せんりひん]だ」と言[い]った。"
  21: "ダビデは、自分[じぶん]について来[く]ることができず、ボソル川[がわ]のところに残[のこ]らせておいた二百人[にひゃくにん]の男[おとこ]たちのところへ来[き]た。彼[かれ]らはダビデと、彼[かれ]とともにいる民[たみ]を迎[むか]えに出[で]て来[き]た。ダビデは民[たみ]に近[ちか]づき、彼[かれ]らに安否[あんぴ]を尋[たず]ねた。"
  22: "ダビデとともに行[い]った戦[たたか]う者[もの]たちのうち、悪[わる]い者[もの]とよこしまな者[もの]はみな答[こた]えて言[い]った。「彼[かれ]らはわたしたちとともに行[い]かなかったのだから、わたしたちが取[と]り戻[もど]した戦利品[せんりひん]から彼[かれ]らに何[なに]も与[あた]えない。ただ、それぞれ自分[じぶん]の妻[つま]と子[こ]どもだけを連[つ]れて帰[かえ]らせよ。」"
  23: "ダビデは言[い]った。「兄弟[きょうだい]たち、そんなことをしてはならない。主[しゅ]がわたしたちを守[まも]り、わたしたちを襲[おそ]ったあの一団[いちだん]をわたしたちの手[て]に渡[わた]してくださったのだ。"
  24: "このことで、だれがあなたがたの言[い]うことを聞[き]くというのか。彼[かれ]らもあなたがたに劣[おと]らない。戦[たたか]いに出[で]て行[い]く者[もの]の受[う]ける分[ぶん]は、器[うつわ]のそばに座[すわ]っている者[もの]の分[ぶん]と同[おな]じである。同[おな]じように分[わ]け合[あ]う。」"
  25: "その日[ひ]から後[のち]、これが定[さだ]めとなり、イスラエルにとって掟[おきて]となって、今日[きょう]に至[いた]っている。"
  26: "ダビデはセケラクに来[き]て、戦利品[せんりひん]をユダの長老[ちょうろう]たちと自分[じぶん]の近[ちか]しい者[もの]たちに送[おく]って言[い]った。「見[み]よ、主[しゅ]の敵[てき]から奪[うば]った戦利品[せんりひん]の一部[いちぶ]だ。」"
  27: "すなわち、バイトスルにいる者[もの]たち、南[みなみ]のラマにいる者[もの]たち、イェトルにいる者[もの]たちに送[おく]った。"
  28: "また、アロエル、アマディ、サフィ、エシュティエ、ゲト、キナン、サフェク、ティマトにいる者[もの]たちにも送[おく]った。"
  29: "また、カルメルにいる者[もの]たち、イェラメルの町[まち]々[まち]にいる者[もの]たち、ケネズの町[まち]々[まち]にいる者[もの]たちにも送[おく]った。"
  30: "また、イェリムト、ベエルサベエ、ノオにいる者[もの]たちにも送[おく]った。"
  31: "また、ヘブロンにいる者[もの]たち、およびダビデが自分[じぶん]とその部下[ぶか]たちとともに歩[あゆ]んだすべての場所[ばしょ]にも送[おく]った。"

notes:
  1: "ἐγενήθη εἰσελθόντος Δαυιδ ... εἰς Σεκελακ τῇ ἡμέρᾳ τῇ τρίτῃ — «было, когда вошёл Давид в Секелаг, в третий день» (родительный абсолютный). Ἀμαληκ ἐπέθετο ἐπὶ τὸν νότον — Амалик напал на юг (νότος — юг). ἐνεπύρισεν ἐν πυρί — сжёг огнём. Σεκελακ — セケラク (греч. форма; евр. Циклаг)."
  2: "ἀπὸ μικροῦ ἕως μεγάλου — от малого до великого. οὐκ ἐθανάτωσαν ἄνδρα καὶ γυναῖκα — не умертвили ни мужа, ни жены. ᾐχμαλώτευσαν — увели в плен (αἰχμαλωτεύω). ἀπῆλθον εἰς τὴν ὁδὸν αὐτῶν — пошли своим путём."
  3: "ἰδοὺ ἐμπεπύρισται ἐν πυρί — вот, сожжён огнём (перфект). ᾐχμαλωτευμένοι — взяты в плен (причастие перфекта, без глагола-связки)."
  4: "ἦρεν τὴν φωνὴν αὐτῶν — подняли голос свой. ἕως ὅτου οὐκ ἦν ἐν αὐτοῖς ἰσχὺς ἔτι κλαίειν — доколе не стало в них силы плакать."
  5: "ἀμφότεραι αἱ γυναῖκες — обе жены. Αχινοομ ἡ Ιεζραηλῖτις — Ахиноам Изреелянка (アヒノアム). Αβιγαια ἡ γυνὴ Ναβαλ τοῦ Καρμηλίου — Авигаиль, жена Навала Кармилитянина (アビガイル)."
  6: "ἐθλίβη Δαυιδ σφόδρα — Давид сильно стеснён, в тяжком положении. λιθοβολῆσαι αὐτόν — побить его камнями. κατώδυνος ψυχὴ παντὸς τοῦ λαοῦ — душа всего народа в страдании (κατώδυνος). ἐκραταιώθη ἐν κυρίῳ θεῷ αὐτοῦ — укрепился в Господе Боге своём; в ru это перенесено в 30:7, в gr стих кончается здесь."
  7: "πρὸς Αβιαθαρ τὸν ἱερέα υἱὸν Αχιμελεχ — к Авиафару священнику, сыну Ахимелеха. Προσάγαγε τὸ εφουδ — принеси ефод. В csl/ru добавлено «и принёс Авиафар ефод к Давиду» — в gr нет."
  8: "διὰ τοῦ κυρίου — через Господа. γεδδουρ — отряд, полчище (др.-евр. גְּדוּד), 一団. καταλαμβάνων καταλήμψῃ — «настигая настигнешь» (гебраизм, усиление). ἐξαιρούμενος ἐξελῇ — «избавляя избавишь», т. е. отнимешь добычу."
  9: "οἱ ἑξακόσιοι ἄνδρες — шестьсот мужей. χειμάρρους Βοσορ — поток Восор (ボソル川). οἱ περισσοὶ ἔστησαν — остальные остановились; в ru «усталые остановились» — по евр. тексту."
  10: "κατεδίωξεν ἐν τετρακοσίοις ἀνδράσιν — преследовал с четырьмястами. ὑπέστησαν — остались (ὑφίστημι). πέραν τοῦ χειμάρρου — за потоком."
  11: "εὑρίσκουσιν ἄνδρα Αἰγύπτιον ἐν ἀγρῷ — находят египтянина в поле. ἄγουσιν αὐτὸν πρὸς Δαυιδ — приводят его к Давиду. ἐπότισαν αὐτὸν ὕδωρ — напоили его водой."
  12: "κλάσμα παλάθης — кусок смоковной лепёшки (παλάθη — спрессованные плоды), 干しいちじくを固めたもの. κατέστη τὸ πνεῦμα αὐτοῦ ἐν αὐτῷ — «дух его утвердился в нём», т. е. ожил. οὐ βεβρώκει ... τρεῖς ἡμέρας καὶ τρεῖς νύκτας — не ел и не пил три дня и три ночи. В ru добавлены «две связки изюму» (по евр.) — в gr только лепёшка."
  13: "Τίνος σὺ εἶ καὶ πόθεν εἶ — чей ты и откуда. τὸ παιδάριον τὸ Αἰγύπτιον — отрок-египтянин, 若者. κατέλιπέν με ὁ κύριός μου — оставил меня господин мой. ἠνωχλήθην ... τριταῖος — «я отяготился, занемог, сегодня уже третий день» (τριταῖος — на третий день)."
  14: "ἐπεθέμεθα ἐπὶ νότον τοῦ Χολθι — напали на юг Холфи (LXX; слав. «до хелефи», ru «Керети»). τὰ τῆς Ιουδαίας μέρη — области Иудеи. νότον Χελουβ — юг Хелуба (LXX; слав. «гелвуй», ru «Халева»). ἐνεπυρίσαμεν ἐν πυρί — сожгли огнём."
  15: "κατάξεις με ἐπὶ τὸ γεδδουρ — сведёшь, приведёшь меня к отряду. Ὄμοσον δή μοι κατὰ τοῦ θεοῦ — поклянись мне Богом. μὴ θανατώσειν με — что не умертвишь меня. μὴ παραδοῦναί με εἰς χεῖρας τοῦ κυρίου μου — не предашь меня в руки господина моего."
  16: "κατήγαγεν αὐτὸν ἐκεῖ — свёл его туда. διακεχυμένοι ἐπὶ πρόσωπον πάσης τῆς γῆς — разлившиеся, рассыпанные по лицу всей земли. ἑορτάζοντες — празднующие. ἐν πᾶσι τοῖς σκύλοις τοῖς μεγάλοις — из-за всей великой добычи (σκῦλα — добыча, 戦利品)."
  17: "ἀπὸ ἑωσφόρου ἕως δείλης — от утренней звезды (рассвета) до вечера (δεῖλη — послеполуденный зной, вечер). καὶ τῇ ἐπαύριον — и до следующего дня. οὐκ ἐσώθη ... ἀλλ᾽ ἢ τετρακόσια παιδάρια — не спасся никто, кроме четырёхсот отроков. ἐπιβεβηκότα ἐπὶ τὰς καμήλους — севшие на верблюдов."
  18: "ἀφείλατο — отнял (ἀφαιρέομαι). ἀμφοτέρας τὰς γυναῖκας αὐτοῦ ἐξείλατο — обеих жён его избавил, вырвал (ἐξαιρέομαι), 連れ戻した."
  19: "οὐ διεφώνησεν αὐτοῖς — «не оказалось недостатка у них» (διαφωνέω — недоставать). ἀπὸ μικροῦ ἕως μεγάλου — от малого до великого. ἐπέστρεψεν — возвратил."
  20: "τὰ ποίμνια καὶ τὰ βουκόλια — мелкий и крупный скот (ποίμνιον, βουκόλιον). ἀπήγαγεν ἔμπροσθεν τῶν σκύλων — погнал их впереди (прочей) добычи. τοῖς σκύλοις ἐκείνοις ἐλέγετο — «той добыче говорилось»: тёмное место, в слав. «плен оный нарицашеся сей плен давидов», в ru — «говорили: это добыча Давида»."
  21: "τοὺς διακοσίους ἄνδρας τοὺς ἐκλυθέντας τοῦ πορεύεσθαι — двести мужей, ослабевших идти (ἐκλύω). ἐκάθισεν αὐτοὺς ἐν τῷ χειμάρρῳ — посадил их при потоке. ἐξῆλθον εἰς ἀπάντησιν — вышли навстречу. ἠρώτησαν αὐτὸν τὰ εἰς εἰρήνην — спросили его о мире (приветствие): 安否を尋ねた."
  22: "πᾶς ἀνὴρ λοιμὸς καὶ πονηρός — всякий муж негодный и злой (λοιμός). οὐ κατεδίωξαν μεθ᾽ ἡμῶν — не преследовали с нами. οὐ δώσομεν αὐτοῖς ἐκ τῶν σκύλων — не дадим им из добычи. ἕκαστος ... ἀπαγέσθωσαν καὶ ἀποστρεφέτωσαν — пусть каждый возьмёт жену и детей и уходит."
  23: "Οὐ ποιήσετε οὕτως — не сделайте так. μετὰ τὸ παραδοῦναι τὸν κύριον ἡμῖν — после того как Господь предал нам. φυλάξαι ἡμᾶς — сохранил нас. τὸν γεδδουρ τὸν ἐπερχόμενον ἐφ᾽ ἡμᾶς — отряд, приходивший на нас. В csl добавлено «братия моя» (по евр.), в gr только «так»."
  24: "τίς ὑπακούσεται ὑμῶν τῶν λόγων τούτων — кто послушает вас в этих словах. οὐχ ἧττον ὑμῶν εἰσιν — они не меньше вас (ἥττων). κατὰ τὴν μερίδα τοῦ καταβαίνοντος εἰς πόλεμον — по доле сходящего на войну. τοῦ καθημένου ἐπὶ τὰ σκεύη — сидящего при сосудах, т. е. при обозе. κατὰ τὸ αὐτὸ μεριοῦνται — по тому же разделятся."
  25: "ἀπὸ τῆς ἡμέρας ἐκείνης καὶ ἐπάνω — от того дня и выше, т. е. и далее. πρόσταγμα καὶ δικαίωμα — повеление и установление (устав). ἕως τῆς σήμερον — до сего дня."
  26: "ἀπέστειλεν τοῖς πρεσβυτέροις Ιουδα τῶν σκύλων — послал старейшинам Иуды из добычи. τοῖς πλησίον αὐτοῦ — ближним своим. Ἰδοὺ ἀπὸ τῶν σκύλων τῶν ἐχθρῶν κυρίου — «вот из добычи врагов Господних»; в csl добавлено «благословение» (по евр.), в gr его нет."
  27: "Βαιθσουρ — Байтсур (バイトスル; слав./ru дают здесь Вефсур/Вефиль). Ραμα νότου — Рама южная (南のラマ). Ιεθθορ — Иетфор (イェトル; в ru «Иаттир»)."
  28: "Ἀροηρ — Ароер. Ἀμμαδι — Аммади. Σαφι — Сафи. Εσθιε — Есфие; в gr внутри стиха пометка «28a» — деление LXX, в текст не вынесена. Γεθ — Геф (ゲト). Κιναν — Кинан. Σαφεκ — Сафек. Θιμαθ — Фимаф. Список LXX расходится с csl/ru (там Шифмоф, Естемоа и др.)."
  29: "Καρμήλῳ — Кармил. ταῖς πόλεσιν τοῦ Ιεραμηλι — города Иерамеила (イェラメル). ταῖς πόλεσιν τοῦ Κενεζι — города Кенезея (ケネズ)."
  30: "Ιεριμουθ — Иеримуф (イェリムト). Βηρσαβεε — Вирсавия (греч. Βηρσαβεε, ベエルサベエ). Νοο — Ноо (ノオ; слав. «номва», ru «Хорма»)."
  31: "Χεβρων — Хеврон. εἰς πάντας τοὺς τόπους, οὓς διῆλθεν Δαυιδ ἐκεῖ — во все места, где проходил Давид там, он и мужи его."
