# jp-box, Откровение Иоанна, глава 16. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 16: семь чаш гнева (1–12); три нечистых духа и Армагеддон (13–16);
# седьмая чаша, землетрясение и суд над Вавилоном (17–21).
# Красное <j> — только 16:15 (слова Христа): 「」 с <j> внутри. Голоса из храма
# (16:1, 17) и от жертвенника (16:7) — не Христос, не красные.
# 〔…〕: 16:5 — церковное κύριε (проверено: κυριε в базе НЕТ); 16:7 — церковное ἄλλου
# (проверено: αλλου в базе НЕТ). В 16:5 TR добавляет καὶ ὁ ἐσόμενος, но Елизаветинская,
# Синодальный и jp-joc его не читают — не добавлено.
# 16:9 — в базе и у Церкви совпадает, 〔〕 нет.
# Сноска ⟨…⟩ одна: 16:16 ハルマゲドン (первое место в корпусе).
# jp-ni не использовался.

