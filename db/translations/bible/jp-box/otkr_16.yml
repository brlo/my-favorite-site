verses:
  1: "また、わたしは神殿[しんでん]から大[おお]きな声[こえ]がして、七人[しちにん]の天使[てんし]たちに「行[い]って、神[かみ]の怒[いか]りの七[なな]つの鉢[はち]を地[ち]に注[そそ]ぎなさい」と言[い]うのを聞[き]いた。"
  2: "第一[だいいち]の天使[てんし]が行[い]って、自分[じぶん]の鉢[はち]を地[ち]に注[そそ]いだ。すると、獣[けもの]の刻印[こくいん]を持[も]つ者[もの]たちと、その像[ぞう]を拝[はい]む者[もの]たちとに、悪性[あくせい]の痛[いた]い腫[は]れ物[もの]ができた。"
  3: "第二[だいに]の天使[てんし]が自分[じぶん]の鉢[はち]を海[うみ]に注[そそ]いだ。すると、海[うみ]は死[し]人[にん]の血[ち]のようになり、海[うみ]の中[なか]の生[い]き物[もの]はすべて死[し]んだ。"
  4: "第三[だいさん]の天使[てんし]が自分[じぶん]の鉢[はち]を川[かわ]と水[みず]の泉[いずみ]に注[そそ]いだ。すると、水[みず]は血[ち]になった。"
  5: "また、わたしは水[みず]をつかさどる天使[てんし]が言[い]うのを聞[き]いた。「〔主[しゅ]よ、〕あなたは正[ただ]しい。今[いま]おられ、かつておられた方[かた]、聖[せい]なる方[かた]よ。あなたはこれらのことを裁[さば]かれたからである。"
  6: "彼[かれ]らは聖[せい]なる者[もの]たちと預言者[よげんしゃ]たちの血[ち]を流[なが]した。あなたは彼[かれ]らに血[ち]を飲[の]ませた。彼[かれ]らはそれにふさわしい者[もの]たちである。」"
  7: "また、わたしは祭壇[さいだん]から〔別[べつ]の者[もの]が〕言[い]うのを聞[き]いた。「然[しか]り、主[しゅ]なる神[かみ]、全能者[ぜんのうしゃ]よ。あなたの裁[さば]きは真実[しんじつ]で、正[ただ]しい。」"
  8: "第四[だいし]の天使[てんし]が自分[じぶん]の鉢[はち]を太陽[たいよう]に注[そそ]いだ。すると、太陽[たいよう]には、火[ひ]で人[ひと]々[びと]を焼[や]く力[ちから]が与[あた]えられた。"
  9: "人[ひと]々[びと]は激[はげ]しい熱[ねつ]に焼[や]かれ、これらの災[わざわ]いを支配[しはい]する神[かみ]の名[な]を冒涜[ぼうとく]した。そして、悔[く]い改[あらた]めて神[かみ]に栄光[えいこう]を帰[き]すことをしなかった。"
  10: "第五[だいご]の天使[てんし]が自分[じぶん]の鉢[はち]を獣[けもの]の座[ざ]に注[そそ]いだ。すると、獣[けもの]の国[くに]は暗[くら]くなり、人[ひと]々[びと]は苦[くる]しみのあまり自分[じぶん]の舌[した]をかんだ。"
  11: "そして、自分[じぶん]の苦[くる]しみと腫[は]れ物[もの]のゆえに天[てん]の神[かみ]を冒涜[ぼうとく]し、自分[じぶん]の行[おこな]いを悔[く]い改[あらた]めなかった。"
  12: "第六[だいろく]の天使[てんし]が自分[じぶん]の鉢[はち]を大[おお]きな川[かわ]、ユーフラテスに注[そそ]いだ。すると、その水[みず]は干上[ひあ]がった。日[ひ]の昇[のぼ]る方[ほう]から来[く]る王[おう]たちの道[みち]を備[そな]えるためであった。"
  13: "また、わたしは、龍[りゅう]の口[くち]と獣[けもの]の口[くち]と偽[ぎ]預言者[よげんしゃ]の口[くち]から、蛙[かえる]に似[に]た三[みっ]つの汚[けが]れた霊[れい]が出[で]て来[く]るのを見[み]た。"
  14: "これらはしるしを行[おこな]う悪霊[あくりょう]の霊[れい]であって、全[ぜん]世界[せかい]の王[おう]たちのところへ出[で]て行[い]き、全能者[ぜんのうしゃ]なる神[かみ]の大[おお]きな日[ひ]の戦[たたか]いのために彼[かれ]らを集[あつ]める。"
  15: "「<j>見[み]よ、わたしは盗人[ぬすびと]のように来[く]る。目[め]を覚[さ]まして自分[じぶん]の衣[ころも]を守[まも]り、裸[はだか]で歩[ある]いてその恥[はじ]を人[ひと]に見[み]られないようにする者[もの]は幸[さいわ]いである。</j>」"
  16: "そして、彼[かれ]らを、ヘブライ語[ご]でハルマゲドン⟨「メギドの山[やま]」の意[い]。⟩と呼[よ]ばれる所[ところ]に集[あつ]めた。"
  17: "第七[だいしち]の天使[てんし]が自分[じぶん]の鉢[はち]を空気[くうき]に注[そそ]いだ。すると、神殿[しんでん]から、すなわち御座[みくら]から、大[おお]きな声[こえ]が出[で]て言[い]った。「事[こと]は成[な]った。」"
  18: "すると、稲妻[いなずま]と声[こえ]と雷[かみなり]が起[おこ]り、大[おお]きな地震[じしん]が起[おこ]った。人[ひと]が地[ち]の上[うえ]に現[あらわ]れて以来[このかた]、これほど大[おお]きな地震[じしん]はなかった。"
  19: "大[おお]きな都[みやこ]は三[みっ]つに裂[さ]け、諸国[しょこく]の町[まち]々[まち]は倒[たお]れた。大[おお]きなバビロンは神[かみ]の前[まえ]に覚[おぼ]えられ、神[かみ]の激[はげ]しい怒[いか]りの酒[さけ]の杯[さかずき]を彼女[かのじょ]に与[あた]えることになった。"
  20: "島[しま]はすべて逃[に]げ去[さ]り、山[やま]々[やま]も見[み]えなくなった。"
  21: "また、一[いち]タラントほどの大[おお]きな雹[ひょう]が天[てん]から人[ひと]々[びと]の上[うえ]に降[ふ]って来[き]た。人[ひと]々[びと]は雹[ひょう]の災[わざわ]いのゆえに神[かみ]を冒涜[ぼうとく]した。その災[わざわ]いは甚[はなは]だ大[おお]きかったからである。"

notes:
  1: "μεγάλης φωνῆς ἐκ τοῦ ναοῦ — 神殿からの大きな声. Ὑπάγετε καὶ ἐκχέετε τὰς ἑπτὰ φιάλας — 行って、七つの鉢を注ぎなさい. τοῦ θυμοῦ τοῦ θεοῦ — 神の怒り. Говорящий не назван; не красное."
  2: "ἀπῆλθεν ὁ πρῶτος — 第一の天使が行って. ἕλκος κακὸν καὶ πονηρόν — 悪性の痛い腫れ物. τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου — 獣の刻印を持つ者たち. τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ — その像を拝む者たち."
  3: "ψυχὴ ζωῆς — 生き物 (букв. «душа жизни»). ἀπέθανεν τὰ ἐν τῇ θαλάσσῃ — 海の中の生き物はすべて死んだ."
  4: "εἰς τοὺς ποταμοὺς καὶ τὰς πηγὰς τῶν ὑδάτων — 川と水の泉に. ἐγένετο αἷμα — 水は血になった."
  5: "ὁ ἄγγελος τῶν ὑδάτων — 水をつかさどる天使. Δίκαιος εἶ … ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος — あなたは正しい…今おられ、かつておられた方、聖なる方. В критической базе нет κύριε; церковный текст (Елизаветинская «Господи», jp-joc 主よ) читает — 〔主よ、〕 (проверено: κυριε в 16:5 НЕТ); для естественности обращение поставлено в начало. TR добавляет καὶ ὁ ἐσόμενος, но Елизаветинская, Синодальный и jp-joc его не читают — не добавлено. ὅτι ταῦτα ἔκρινας — これらのことを裁かれた."
  6: "αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν — 聖なる者たちと預言者たちの血を流した. αἷμα αὐτοῖς δέδωκας πιεῖν — 彼らに血を飲ませた. ἄξιοί εἰσιν — 彼らはそれにふさわしい."
  7: "τοῦ θυσιαστηρίου λέγοντος — 祭壇から言うのを聞いた. В критической базе нет ἄλλου; церковный текст (Елизаветинская «другого от жертвенника», jp-joc 他の者) читает — 〔別の者〕 (проверено: αλλου в 16:7 НЕТ). ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου — あなたの裁きは真実で、正しい."
  8: "ἐδόθη αὐτῷ καυματίσαι τοὺς ἀνθρώπους ἐν πυρί — 太陽に、火で人々を焼く力が与えられた."
  9: "ἐκαυματίσθησαν … καῦμα μέγα — 激しい熱に焼かれた. ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ — 神の名を冒涜した. οὐ μετενόησαν δοῦναι αὐτῷ δόξαν — 悔い改めて神に栄光を帰すことをしなかった. В базе и у Церкви совпадает, 〔〕 нет."
  10: "ἐπὶ τὸν θρόνον τοῦ θηρίου — 獣の座に (θρόνος зверя — 座[ざ], не 御座[みくら]). ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη — 獣の国は暗くなった. ἐμασῶντο τὰς γλώσσας αὐτῶν — 自分の舌をかんだ."
  11: "ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ — 天の神を冒涜した. ἐκ τῶν πόνων … καὶ ἐκ τῶν ἑλκῶν — 苦しみと腫れ物のゆえに. οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν — 自分の行いを悔い改めなかった."
  12: "τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην — 大きな川ユーフラテス. ἐξηράνθη τὸ ὕδωρ αὐτοῦ — 水は干上がった. τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου — 日の昇る方から来る王たち."
  13: "ἐκ τοῦ στόματος τοῦ δράκοντος … τοῦ θηρίου … τοῦ ψευδοπροφήτου — 龍と獣と偽預言者の口から. πνεύματα τρία ἀκάθαρτα ὡς βάτραχοι — 蛙に似た三つの汚れた霊."
  14: "πνεύματα δαιμονίων ποιοῦντα σημεῖα — しるしを行う悪霊の霊. βασιλεῖς τῆς οἰκουμένης ὅλης — 全世界の王たち. εἰς τὸν πόλεμον τῆς μεγάλης ἡμέρας τοῦ θεοῦ τοῦ παντοκράτορος — 全能者なる神の大きな日の戦い."
  15: "Ἰδοὺ ἔρχομαι ὡς κλέπτης — 見よ、わたしは盗人のように来る. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ — 目を覚まして自分の衣を守る者は幸い. ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ — 裸で歩いて恥を見られないように. Единственное красное в главах 14–18: слова Христа, <j> внутри 「」."
  16: "συνήγαγεν αὐτοὺς εἰς τὸν τόπον … Ἑβραϊστὶ Ἁρμαγεδών — ヘブライ語でハルマゲドンと呼ばれる所に集めた. Сноска при первом месте в корпусе."
  17: "ἐξῆλθεν φωνὴ μεγάλη ἐκ τοῦ ναοῦ ἀπὸ τοῦ θρόνου — 神殿から、御座から大きな声. Γέγονεν — 事は成った (perfect, «совершилось»)."
  18: "ἀστραπαὶ καὶ φωναὶ καὶ βρονταί — 稲妻と声と雷. σεισμὸς … τηλικοῦτος … οὕτω μέγας — これほど大きな地震. ἀφ᾽ οὗ ἄνθρωπος ἐγένετο ἐπὶ τῆς γῆς — 人が地の上に現れて以来."
  19: "ἡ πόλις ἡ μεγάλη εἰς τρία μέρη — 大きな都は三つに裂けた. αἱ πόλεις τῶν ἐθνῶν ἔπεσαν — 諸国の町々は倒れた. ἐμνήσθη … ἐνώπιον τοῦ θεοῦ — 神の前に覚えられた. τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ — 神の激しい怒りの酒の杯 (θυμός и ὀργή сведены в 激しい怒り)."
  20: "πᾶσα νῆσος ἔφυγεν — 島はすべて逃げ去った. ὄρη οὐχ εὑρέθησαν — 山々も見えなくなった."
  21: "χάλαζα μεγάλη ὡς ταλαντιαία — 一タラントほどの大きな雹 (талант — мера веса; сноска о таланте уже в Мф 18:24). ἐβλασφήμησαν … ἐκ τῆς πληγῆς τῆς χαλάζης — 雹の災いのゆえに神を冒涜した. μεγάλη … σφόδρα — 甚だ大きかった."
