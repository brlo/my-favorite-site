verses:
  1: "ダビデは言[い]った。「ここが主[しゅ]なる神[かみ]の家[いえ]であり、これがイスラエルのための燔祭[はんさい]の祭壇[さいだん]である。」"
  2: "ダビデは、イスラエルの地[ち]にいるすべての寄留者[きりゅうしゃ]を集[あつ]めるように命[めい]じ、神[かみ]の家[いえ]を建[た]てるために、石[いし]を切[き]り出[だ]し、整[ととの]えた石にする石工[いしく]たちを置[お]いた。"
  3: "ダビデは、扉[とびら]や門[もん]の釘[くぎ]と留[と]め金[がね]のために多[おお]くの鉄[てつ]を、また量[はか]りきれないほど多[おお]くの青銅[せいどう]を用意[ようい]した。"
  4: "また、数[かず]えきれないほど多[おお]くの杉[すぎ]の木[き]を用意した。シドン人[じん]とツロの人[ひと]たちが、ダビデのもとへ大量[たいりょう]の杉の木を運[はこ]んで来[き]たからである。"
  5: "ダビデは言[い]った。「わが子[こ]ソロモンは幼[おさな]く、力[ちから]が弱[よわ]い。しかし、主[しゅ]のために建[た]てる家[いえ]は、上[うえ]なる威光[いこう]のため、また全[ぜん]地[ち]に及[およ]ぶ名[な]と栄光[えいこう]のために、はなはだ壮大[そうだい]でなければならない。だから、わたしが彼のために用意[ようい]しよう。」ダビデは自分[じぶん]の終[お]わりが来[く]る前[まえ]に、多[おお]くのものを用意した。"
  6: "ダビデはその子[こ]ソロモンを呼[よ]んで、イスラエルの神[かみ]である主[しゅ]の家[いえ]を建[た]てるように命[めい]じた。"
  7: "ダビデはソロモンに言[い]った。「子[こ]よ、わたしは主[しゅ]なるわたしの神[かみ]の名[な]のために家[いえ]を建[た]てることを心[こころ]に思[おも]っていた。"
  8: "しかし、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。『お前[まえ]は多[おお]くの血[ち]を流[なが]し、大[おお]きな戦[いくさ]をした。わたしの名[な]のために家[いえ]を建[た]ててはならない。お前がわたしの前[まえ]で、地[ち]の上[うえ]に多[おお]くの血を流[なが]したからである。"
  9: "見[み]よ、お前に子[こ]が生[う]まれる。彼[かれ]は安[やす]らぎの人[ひと]となる。わたしは彼を、周[まわ]りのすべての敵[てき]から安[やす]らがせる。彼の名[な]はソロモン。わたしは彼の日々[ひび]に、イスラエルに平和[へいわ]と静[しず]けを与[あた]える。"
  10: "彼[かれ]がわたしの名[な]のために家[いえ]を建[た]てる。彼はわたしの子[こ]となり、わたしは彼の父[ちち]となる。わたしは彼の王国[おうこく]の王座[おうざ]を、イスラエルの上[うえ]に永遠[えいえん]に堅[かた]くする。』"
  11: "今[いま]、わが子[こ]よ、主[しゅ]があなたとともにいて、あなたを栄[さか]えさせ、あなたは主なる神[かみ]の家[いえ]を建[た]てる。主があなたについて語[かた]られたとおりに。"
  12: "ただ、主[しゅ]があなたに知恵[ちえ]と分別[ふんべつ]を与[あた]え、イスラエルの上[うえ]にあなたを強[つよ]く立[た]て、あなたが主なる神[かみ]の律法[りっぽう]を守[まも]り行[おこな]うようにしてくださるように。"
  13: "そのとき、あなたは栄[さか]える。ただし、主[しゅ]がモーセに命[めい]じてイスラエルに与[あた]えられた戒[いまし]めと定[さだ]めを守[まも]って行[おこな]うなら。雄々[おお]しくあれ、強[つよ]くあれ。恐[おそ]れてはならない。おののいてはならない。"
  14: "見[み]よ、わたしは自分[じぶん]の貧[まず]しさに応[おう]じて、主[しゅ]の家[いえ]のために金[きん]十万[じゅうまん]タラント、銀[ぎん]百万[ひゃくまん]タラントを用意[ようい]した。青銅[せいどう]と鉄[てつ]は多[おお]すぎて量[はか]れない。木[き]と石[いし]も用意した。あなたはこれに加[くわ]えよ。"
  15: "主[しゅ]はあなたとともにいる。あなたには、仕事[しごと]をする者[もの]が多[おお]く加[くわ]わる。工匠[こうしょう]、石[いし]を積[つ]む者[もの]、木工[もっこう]、あらゆる仕事に巧[たく]みな者[もの]である。"
  16: "金[きん]、銀[ぎん]、青銅[せいどう]、鉄[てつ]には数[かず]がない。立[た]ち上[あ]がって、行[おこな]え。主[しゅ]があなたとともにいる。」"
  17: "ダビデはイスラエルのすべての長[おさ]たちに、その子[こ]ソロモンを助[たす]けるように命[めい]じた。"
  18: "「主[しゅ]はあなたがたとともにいるではないか。主はあなたがたに周[まわ]りから安[やす]らぎを与[あた]えられた。地[ち]に住[す]む者[もの]をあなたがたの手[て]に渡[わた]されたからである。地は主[しゅ]の前[まえ]、またその民[たみ]の前[まえ]に服[ふく]した。"
  19: "今[いま]、あなたがたの心[こころ]と魂[たましい]を、主[しゅ]なるあなたがたの神[かみ]を求[もと]めることに向[む]けよ。立[た]ち上[あ]がって、主なるあなたがたの神のために聖所[せいしょ]を建[た]てよ。主[しゅ]の契約[けいやく]の箱[はこ]と、神の聖[せい]なる器[うつわ]を、主の名[な]のために建てられる家[いえ]へ運[はこ]び入[い]れるために。」"

notes:
  1: "Οὗτός ἐστιν ὁ οἶκος — «сей есть дом». εἰς ὁλοκαύτωσιν τῷ Ισραηλ — для всесожжения Израилю."
  2: "προσηλύτους — пришельцев, переселенцев (寄留者[きりゅうしゃ]). λατόμους — каменотёсов (λατόμος). λίθους ξυστούς — тёсаные камни (ξυστός)."
  3: "ἥλους — гвозди (ἧλος). θυρωμάτων — дверей. στροφεῖς — крюки, петли, связи (στροφεύς). χαλκόν — медь, бронза (青銅[せいどう]). οὐκ ἦν σταθμός — не было веса."
  4: "ξύλα κέδρινα — кедровые деревья (杉[すぎ]). εἰς πλῆθος — во множестве. ἐφέροσαν — приносили."
  5: "παιδάριον ἁπαλόν — «отрок юный, нежный» (ἁπαλός); csl «детищь млад». εἰς μεγαλωσύνην ἄνω — «в величество высоко» (μεγαλωσύνη). εἰς ὄνομα καὶ εἰς δόξαν — во имя и славу. τελευτή — кончина. В csl в скобках «(всего)» — вставка, не переведена."
  6: "ἐκάλεσεν — призвал. ἐνετείλατο — заповедал (ἐντέλλομαι). В LXX подлежащее — Давид, а Σαλωμων стоит в аккузативе (Σαλωμων τὸν υἱόν); по смыслу и csl Давид призывает Соломона."
  7: "Τέκνον — чадо, сын. ἐπὶ ψυχῇ — «на душе», в сердце; csl «мне бяше в сердцы». В csl добавлено «моего» (Бога моего) — нет в LXX, по паритету в тексте わたしの神[かみ]."
  8: "Αἷμα εἰς πλῆθος ἐξέχεας — «кровь во множестве пролил» (ἐκχέω). πολέμους μεγάλους — большие войны. οὐ οἰκοδομήσεις — не построишь."
  9: "υἱὸς τίκτεταί σοι — сын рождается тебе. ἀνὴρ ἀναπαύσεως — муж покоя (ἀνάπαυσις). ἀναπαύσω — успокою (ἀναπαύω). κυκλόθεν — окрест. Σαλωμων — Соломон; имя созвучно евр. «мир». εἰρήνην καὶ ἡσυχίαν — мир и тишину (ἡσυχία)."
  10: "οἰκοδομήσει — построит. εἰς υἱὸν … εἰς πατέρα — в сына … в отца (ср. 2 Цар 7:14). ἀνορθώσω — утвержу (ἀνορθόω). ἕως αἰῶνος — до века."
  11: "εὐοδώσει — даст успех (εὐοδόω); csl «благопоспешит». ὡς ἐλάλησεν περὶ σοῦ — как сказал о тебе."
  12: "ἀλλ᾿ ἢ δῴη — «но да даст» (оптатив δίδωμι). σοφία καὶ σύνεσις — премудрость и разум. κατισχύσαι — укрепит (κατισχύω). φυλάσσεσθαι καὶ ποιεῖν — хранить и исполнять."
  13: "προστάγματα — повеления (戒[いまし]め). κρίματα — суды (定[さだ]め). ἀνδρίζου καὶ ἴσχυε — мужайся и укрепляйся. πτοηθῇς — устрашишься (πτοέω). В csl в скобках «(да учит)» — вставка, не переведена."
  14: "κατὰ τὴν πτωχείαν μου — по убожеству моему (πτωχεία). ταλάντων ἑκατὸν χιλιάδας — сто тысяч талантов. ἀργυρίου … χιλίας χιλιάδας — тысяча тысяч (миллион) талантов. πρόσθες — прибавь (προστίθημι)."
  15: "τεχνῖται — мастера (工匠[こうしょう]). οἰκοδόμοι λίθων — каменщики. τέκτονες ξύλων — плотники (木工[もっこう]). σοφὸς ἐν παντὶ ἔργῳ — искусный во всяком деле. В csl добавлено «Господь» и «приложиши» — нет в LXX, по паритету в тексте."
  16: "ἀνάστηθι — встань, начни. ποίει — делай. Здесь закрывается речь Давида, начатая в ст. 7."
  17: "ἐνετείλατο — заповедал. ἀντιλαβέσθαι — поддержать, помочь (ἀντιλαμβάνομαι). В csl «глаголя» вводит речь ст. 18."
  18: "ἀνέπαυσεν — успокоил (ἀναπαύω). κυκλόθεν — окрест. ὑπετάγη — покорилась (ὑποτάσσω). В csl «в руки вашя» — «в ваши руки»; в LXX без уточнения."
  19: "δότε καρδίας … καὶ ψυχάς — дайте сердца и души. ἁγίασμα — святыня, святилище (聖所[せいしょ]). κιβωτὸς διαθήκης — ковчег завета (契約[けいやく]の箱[はこ]). σκεύη τὰ ἅγια — священные сосуды (器[うつわ]). εἰσενέγκαι — внести."
