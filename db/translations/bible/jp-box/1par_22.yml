# jp-box, 1-я Паралипоменон, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: место храма и приготовления (1–5), завещание Соломону (6–16),
# наставление князьям (17–19).
# Речь Давида — 「…」; слово Господне внутри его речи (8–10) — 『…』.
# Нумерация по gr: 19 стихов, совпадает с csl/ru.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 神殿, 祭壇, 燔祭, 契約の箱, 青銅 уже в корпусе.

