verses:
  1: "愚[おろ]かな人[ひと]には空[むな]しい望[のぞ]みと偽[いつわ]りの望みがある。夢[ゆめ]は愚かな者[もの]に翼[つばさ]を与[あた]える。"
  2: "影[かげ]をつかみ、風[かぜ]を追[お]いかける者[もの]のように、夢[ゆめ]にすがる者[もの]もいる。"
  3: "これはこれに対[たい]する。夢[ゆめ]の幻[まぼろし]は、顔[かお]と顔[かお]を向[む]かい合[あ]わせた似姿[にすがた]にすぎない。"
  4: "汚[けが]れたものから何[なに]が清[きよ]められようか。偽[いつわ]りから何[なに]が真[しん]となろうか。"
  5: "占[うらな]いと兆[きざ]しと夢[ゆめ]は空[むな]しい。人[ひと]の心[こころ]は、子[こ]を産[う]もうとする女[おんな]のように思[おも]い描[えが]く。"
  6: "いと高[たか]き者[もの]から、顧[かえり]みのために遣[つか]わされたものでないなら、それらに心[こころ]を向[む]けてはならない。"
  7: "夢[ゆめ]は多[おお]くの者[もの]を迷[まよ]わせた。それを頼[たの]みにした者[もの]たちは倒[たお]れた。"
  8: "偽[いつわ]りなく律法[りっぽう]は全[まっと]うされ、知恵[ちえ]は信[しん]ある口[くち]によって完成[かんせい]へと至[いた]る。"
  9: "さまざまな所[ところ]を巡[めぐ]った者[もの]は多[おお]くを知[し]り、多[おお]くを経験[けいけん]した者[もの]は悟[さと]りを語[かた]る。"
  10: "試[ため]されたことのない者[もの]は知[し]ることが少[すく]ない。しかし、巡[めぐ]り歩[ある]いた者[もの]は才覚[さいかく]を増[ま]す。"
  11: "わたしは旅[たび]のうちに多[おお]くのことを見[み]た。わたしの悟[さと]りは、わたしが語[かた]る言葉[ことば]よりも大[おお]きい。"
  12: "わたしは幾度[いくど]も死[し]の危[あや]うきに陥[おちい]ったが、これらのことのゆえに救[すく]われた。"
  13: "主[しゅ]を恐[おそ]れる者[もの]の霊[れい]は生[い]きる。彼らの望[のぞ]みは、彼らを救[すく]う方[かた]にあるからである。"
  14: "主[しゅ]を恐れる者[もの]は何[なに]も恐[おそ]れず、ひるむこともない。主ご自身が彼の望みだからである。"
  15: "主[しゅ]を恐れる者[もの]の魂[たましい]は幸[さいわ]いである。彼は誰[だれ]に寄[よ]り頼[たの]み、誰が彼の支[ささ]えとなるのか。"
  16: "主[しゅ]の目[め]はご自分[じぶん]を愛[あい]する者[もの]の上[うえ]にある。力[ちから]の楯[たて]、強[つよ]さの支[ささ]え、熱[あつ]さからの覆[おお]い、真昼[まひる]の暑[あつ]さからの覆い、つまずきからの守[まも]り、倒[たお]れからの助[たす]け、"
  17: "魂[たましい]を高[たか]く挙[あ]げ、目[め]を照[て]らし、癒[いや]しを与[あた]え、命[いのち]と祝福[しゅくふく]を与[あた]える方[かた]である。"
  18: "不正[ふせい]なものから犠牲[ぎせい]を献[ささ]げるなら、その供[そな]え物[もの]は咎[とが]められる。不法[ふほう]な者[もの]の贈[おく]り物[もの]は喜[よろこ]ばれない。"
  19: "いと高[たか]き者[もの]は不敬[ふけい]な者[もの]の供[そな]え物[もの]を喜[よろこ]ばない。多[おお]くの犠牲[ぎせい]によっても、罪[つみ]が贖[あがな]われることはない。"
  20: "貧[まず]しい者[もの]の財[ざい]から犠牲[ぎせい]を献[ささ]げる者[もの]は、その父[ちち]の前[まえ]で子[こ]を屠[ほふ]る者[もの]のようである。"
  21: "乏[とぼ]しい者[もの]のパンは貧[まず]しい者[もの]の命[いのち]である。それを奪[うば]う者[もの]は血[ち]の人[ひと]である。"
  22: "生[い]きる糧[かて]を奪[うば]う者[もの]は隣人[りんじん]を殺[ころ]し、雇[やと]い人[びと]の賃金[ちんぎん]を奪う者[もの]は血[ち]を流[なが]す者[もの]である。"
  23: "一人[ひとり]が建[た]て、もう一人[ひとり]が壊[こわ]す。彼らは労苦[ろうく]のほかに何[なに]を得[え]たというのか。"
  24: "一人[ひとり]が祈[いの]り、もう一人[ひとり]が呪[のろ]う。主[しゅ]はどちらの声[こえ]を聞[き]き入[い]れられるのか。"
  25: "死者[ししゃ]に触[ふ]れて身[み]を洗[あら]い、またその死者に触れる者[もの]は、その洗[あら]いによって何[なに]の益[えき]を得[え]るのか。"
  26: "同[おな]じように、自分[じぶん]の罪[つみ]のために断食[だんじき]しながら、また出[で]かけて同[おな]じことをする者[もの]がいる。誰[だれ]がその祈[いの]りを聞[き]き入[い]れるだろうか。その人[ひと]が身[み]を低[ひく]くしたことに、何[なに]の益[えき]があるというのか。"

notes:
  1: "Κεναὶ ἐλπίδες καὶ ψευδεῖς ἀσυνέτῳ ἀνδρί — «пустые надежды и ложные — мужу неразумному» (κενός — пустой; ἀσύνετος — неразумный); слав. «тщетны надежды и лживы неразумиву мужу». ἐνύπνια ἀναπτεροῦσιν ἄφρονας — «сны окрыляют (возносят) неразумных» (ἀναπτερόω — давать крылья); слав. «сония вперяют безумных»."
  2: "ὡς δρασσόμενος σκιᾶς — «как хватающий тень» (δράσσομαι — схватывать, сжимать). διώκων ἄνεμον — «гонящий ветер». ὁ ἐπέχων ἐνυπνίοις — «держащийся за сны» (ἐπέχω — держаться, внимать); слав. «емляй веру сном»."
  3: "τοῦτο κατὰ τούτου — «это против этого», т. е. одно отвечает другому. ὅρασις ἐνυπνίων — «видение снов» (ὅρασις — зрение, видение). κατὰ πρόσωπον ὁμοίωμα προσώπου — «лицом к лицу подобие лица»: сон лишь повторяет образ, но не сам предмет; слав. «прямо лицу подобие лица»."
  4: "ἀπὸ ἀκαθάρτου τί καθαρισθήσεται; — «от нечистого что очистится?» (ἀκάθαρτος; καθαρίζω). ἀπὸ ψευδοῦς τί ἀληθεύσει; — «от ложного что скажет истину (будет истинным)?» (ἀληθεύω); слав. «от лживаго кая истина?»."
  5: "μαντεῖαι καὶ οἰωνισμοὶ καὶ ἐνύπνια μάταιά ἐστιν — «гадания, и птицегадания, и сны — суетны» (μαντεία — гадание; οἰωνισμός — примета по птицам; μάταιος — суетный). ὡς ὠδινούσης φαντάζεται καρδία — «как у рождающей, воображает сердце» (ὠδίνω — мучиться родами; φαντάζομαι — представлять, рисовать образы); слав. «якоже раждающия сердцу мечтания бывают»."
  6: "ἐὰν μὴ παρὰ ὑψίστου ἀποσταλῇ — «если не от Всевышнего послано будет» (ἀποστέλλω). ἐν ἐπισκοπῇ — «в посещении», т. е. для вразумления, промыслительного посещения (ἐπισκοπή). μὴ δῷς εἰς αὐτὰ τὴν καρδίαν σου — «не давай им сердца твоего»; слав. «не вдаждь в ня сердца твоего»."
  7: "πολλοὺς γὰρ ἐπλάνησεν τὰ ἐνύπνια — «ибо многих ввело в заблуждение сны» (πλανάω). ἐξέπεσον ἐλπίζοντες ἐπ᾽ αὐτοῖς — «выпали (пали) надеявшиеся на них» (ἐκπίπτω — выпадать, гибнуть). Слав. «отпадоша надеющеся на ня»."
  8: "ἄνευ ψεύδους συντελεσθήσεται νόμος — «без лжи совершится закон» (ἄνευ — без; συντελέω — совершать, исполнять). σοφία στόματι πιστῷ τελείωσις — «премудрость устами верными — совершение» (τελείωσις — завершение, полнота); слав. «премудрость во устех верных совершение»."
  9: "Ἀνὴρ πεπλανημένος ἔγνω πολλά — «муж странствующий (блуждающий) познал многое» (πλανάω в пассиве — странствовать); слав. «муж ученый» — иное понимание. ὁ πολύπειρος ἐκδιηγήσεται σύνεσιν — «многоопытный возвестит разумение» (πολύπειρος — многоопытный; ἐκδιηγέομαι — рассказывать подробно)."
  10: "ὃς οὐκ ἐπειράθη, ὀλίγα οἶδεν — «кто не был испытан, мало знает» (πειράομαι — испытывать). ὁ πεπλανημένος πληθυνεῖ πανουργίαν — «странствующий умножит хитрость (изобретательность, опытность)» (πανουργία — хитроумие); слав. «обходяй же страны умножит хитрость»."
  11: "πολλὰ ἑώρακα ἐν τῇ ἀποπλανήσει μου — «многое я видел в странствии моём» (ἀποπλάνησις — блуждание, странствие); слав. «во обхождении моем». πλείονά τῶν λόγων μου σύνεσίς μου — «больше слов моих (моё) разумение»; слав. «вящшая словес моих разум мой»."
  12: "πλεονάκις ἕως θανάτου ἐκινδύνευσα — «многократно до смерти был в опасности» (πλεονάκις — много раз; κινδυνεύω). διεσώθην τούτων χάριν — «спасён был ради этого» (διασῴζω; χάριν — ради); слав. «спасен бых сих ради», т. е. ради приобретённого опыта."
  13: "πνεῦμα φοβουμένων κύριον ζήσεται — «дух боящихся Господа будет жить» (πνεῦμα — дух, дыхание); слав. «дух боящихся Господа поживет». ἡ ἐλπὶς αὐτῶν ἐπὶ τὸν σῴζοντα αὐτούς — «надежда их на Спасающего их» (σῴζω — спасать)."
  14: "ὁ φοβούμενος κύριον οὐδὲν εὐλαβηθήσεται — «боящийся Господа ни в чём не убоится» (εὐλαβέομαι — остерегаться, страшиться). οὐ μὴ δειλιάσῃ — «не оробеет» (δειλιάω). αὐτὸς ἐλπὶς αὐτοῦ — «Он — надежда его»."
  15: "φοβουμένου τὸν κύριον μακαρία ἡ ψυχή — «боящегося Господа блаженна душа» (μακάριος — блаженный); слав. «боящемуся Господа блаженна душа». τίνι ἐπέχει; — «на кого он опирается (держится)?» (ἐπέχω). τίς αὐτοῦ στήριγμα; — «кто его утверждение (опора)?» (στήριγμα)."
  16: "οἱ ὀφθαλμοὶ κυρίου ἐπὶ τοὺς ἀγαπῶντας αὐτόν — «очи Господа на любящих Его». ὑπερασπισμὸς δυναστείας — «защита силы (могущества)» (ὑπερασπισμός — заступничество; δυναστεία — сила, власть). στήριγμα ἰσχύος — «утверждение крепости». σκέπη ἀπὸ καύσωνος καὶ σκέπη ἀπὸ μεσημβρίας — «покров от зноя и покров от полудня» (σκέπη — кров, покров; καύσων — зной; μεσημβρία — полдень). φυλακὴ ἀπὸ προσκόμματος καὶ βοήθεια ἀπὸ πτώσεως — «охрана от преткновения и помощь от падения». Период продолжается в ст. 17."
  17: "ἀνυψῶν ψυχὴν καὶ φωτίζων ὀφθαλμούς — «возвышающий душу и просвещающий очи» (ἀνυψόω; φωτίζω). ἴασιν διδούς — «дающий исцеление» (ἴασις). ζωὴν καὶ εὐλογίαν — «жизнь и благословение». Причастия продолжают подлежащее ст. 16 — «Он»."
  18: "Θυσιάζων ἐξ ἀδίκου — «приносящий жертву от неправедного (стяжания)» (θυσιάζω; ἄδικος — неправедный). προσφορὰ μεμωμημένη — «приношение порочное (порицаемое)» (μωμάομαι — порицать); слав. «приношение порочно». οὐκ εἰς εὐδοκίαν δωρήματα ἀνόμων — «не в благоволение дары беззаконных» (δώρημα — дар; ἄνομος — беззаконный)."
  19: "οὐκ εὐδοκεῖ ὁ ὕψιστος ἐν προσφοραῖς ἀσεβῶν — «не благоволит Всевышний к приношениям нечестивых» (εὐδοκέω; ἀσεβής). οὐδὲ ἐν πλήθει θυσιῶν ἐξιλάσκεται ἁμαρτίας — «и множеством жертв не умилостивляется за грехи» (ἐξιλάσκομαι — умилостивлять, искупать); слав. «ни множеством жертв очистит грехи»."
  20: "θύων υἱὸν ἔναντι τοῦ πατρὸς αὐτοῦ — «заколающий сына пред отцом его» (θύω — приносить в жертву, закалать); слав. «яко жряй сына пред отцем его». ὁ προσάγων θυσίαν ἐκ χρημάτων πενήτων — «приносящий жертву из имущества бедных» (προσάγω — приносить; χρήματα — имущество; πένης — бедный)."
  21: "ἄρτος ἐπιδεομένων ζωὴ πτωχῶν — «хлеб нуждающихся — жизнь бедных» (ἐπιδεής — нуждающийся; πτωχός — нищий). ὁ ἀποστερῶν αὐτὴν ἄνθρωπος αἱμάτων — «отнимающий её — человек кровей», т. е. кровопийца (ἀποστερέω — лишать; αἷμα — кровь); слав. «лишаяй его человек кровей есть»."
  22: "φονεύων τὸν πλησίον ὁ ἀφαιρούμενος ἐμβίωσιν — «убивает ближнего отнимающий пропитание» (φονεύω; ἐμβίωσις — средства к жизни); слав. «отемляй ему поживление». ἐκχέων αἷμα ὁ ἀποστερῶν μισθὸν μισθίου — «проливает кровь лишающий платы наёмника» (μισθὸς μισθίου — плата наёмному работнику); слав. «мзды наемника»."
  23: "εἷς οἰκοδομῶν, καὶ εἷς καθαιρῶν — «один строит, и один разрушает» (οἰκοδομέω; καθαιρέω). τί ὠφέλησαν πλεῖον ἢ κόπους; — «что они приобрели больше, чем труды?» (ὠφελέω — приносить пользу); слав. «что успеет более, токмо труд?»."
  24: "εἷς εὐχόμενος, καὶ εἷς καταρώμενος — «один молится, и один проклинает» (εὔχομαι; καταράομαι). τίνος φωνῆς εἰσακούσεται ὁ δεσπότης; — «чей голос услышит Владыка?» (εἰσακούω — выслушивать; δεσπότης — владыка, господин)."
  25: "βαπτιζόμενος ἀπὸ νεκροῦ — «омывающийся от мёртвого», т. е. очищающийся после осквернения (βαπτίζω — погружать, омывать; νεκρός). πάλιν ἁπτόμενος αὐτοῦ — «снова прикасающийся к нему». τί ὠφέλησεν ἐν τῷ λουτρῷ αὐτοῦ; — «какая польза ему от омовения его?» (λουτρόν — омовение, баня); слав. «кая польза ему от бани?»."
  26: "νηστεύων ἐπὶ τῶν ἁμαρτιῶν αὐτοῦ — «постящийся за грехи свои (над грехами)» (νηστεύω; ἐπί с род. — по поводу). πάλιν πορευόμενος καὶ τὰ αὐτὰ ποιῶν — «снова идущий и то же делающий»; слав. «паки ходяй и таяжде творяй». τῆς προσευχῆς αὐτοῦ τίς εἰσακούσεται; — «кто услышит молитву его?» τί ὠφέλησεν ἐν τῷ ταπεινωθῆναι αὐτόν; — «какая польза ему от того, что он смирился?» (ταπεινόω); слав. «что успе смирением своим?»."
