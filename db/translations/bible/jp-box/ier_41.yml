# jp-box, Иеремия, глава 41. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги почти нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 41 = слав./ru 34: Седекия и отпущение рабов. 1 надписание (осада Иерусалима);
# 2–5 слово Господа к Седекии через пророка: город будет предан, царь отведён в Вавилон,
# но умрёт в мире и будет оплакан; 6 пророк пересказывает это царю; 7 война против
# Лахиса и Азеки; 8–11 завет царя с народом об отпущении рабов и его нарушение;
# 12–16 слово Господа: завет с отцами, шесть лет рабства, осквернение имени;
# 17–22 «отпущение» на меч, голод и смерть, завет рассечённого тельца, гибель города.
# Голоса: 1 — авторский текст; 2–5 — 「…» (слово Господа, вложенное в уста пророка;
# формула «так говорит Господь» в 4 внутри речи не разрывает кавычек); в 5 плач
# 『ああ、主君よ』; 6–11 — авторский текст; 12 — вводная формула; 13–22 — 「…»
# (слово Господа; в 14 содержание завета — 『…』).
# Нумерация по gr: 22 стиха, совпадает со слав. 34:1–22 и ru. «Точек» в главе нет.
# 〔…〕 нет. Слав. добавления внесены без скобок и оговорены: 1 «и вси людие»,
# 8 «иже во Иерусалиме», 10 «и ктому не владети ими; слышаша и отпустиша»,
# 18 «разсекоша на две части и ходиша между разделенными частьми его»,
# 19 «князи иерусалимли».
# Сносок ⟨…⟩ нет: 都, 軍勢, 解放, 契約, 奴隷, 子牛, 王座 уже в корпусе.
# Имена — транслитерация греческого (LXX): ゼデキヤ, ネブカドネツァル, ラキシュ, アゼカ.

