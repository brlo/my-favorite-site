verses:
  1: "主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]は、バビロンの王[おう]ネブカドネツァルとそのすべての軍[ぐん]勢[ぜい]、およびその支配[しはい]の及[およ]ぶすべての地[ち]とすべての民[たみ]が、エルサレムとユダのすべての都[みやこ]を攻[せ]めていたときのことである。"
  2: "主[しゅ]はこう言[い]われる。「ゼデキヤのもとへ行[い]って言[い]え。主はこう言われる。見[み]よ、わたしはこの都[みやこ]をバビロンの王[おう]の手[て]に渡[わた]す。彼はこれを取[と]って火[ひ]で焼[や]く。"
  3: "あなたも彼の手[て]から救[すく]われない。必[かなら]ず捕[と]らえられて彼の手に渡[わた]され、あなたの目[め]は彼の目を見[み]、彼の口[くち]はあなたの口と語[かた]り合[あ]い、あなたはバビロンへ行[い]く。"
  4: "しかし、ユダの王[おう]ゼデキヤよ、主[しゅ]の言葉[ことば]を聞[き]け。主はあなたについてこう言[い]われる。あなたは剣[つるぎ]で死[し]ぬことはなく、"
  5: "平和[へいわ]のうちに死[し]ぬ。あなたより前[まえ]に王[おう]であったあなたの父[ちち]たちのために泣[な]き悲[かな]しんだように、人[ひと]々[びと]はあなたのためにも泣き、『ああ、主君[しゅくん]よ』と言[い]ってあなたのために泣[な]き叫[さけ]ぶ。わたしがこの言葉[ことば]を語[かた]ったからである、と主[しゅ]は言[い]われる。」"
  6: "エレミヤは、これらのすべての言葉[ことば]をエルサレムでユダの王[おう]ゼデキヤに語[かた]った。"
  7: "バビロンの王[おう]の軍[ぐん]勢[ぜい]は、エルサレムと、まだ残[のこ]っていたユダの都[みやこ]々[みやこ]、すなわちラキシュとアゼカを攻[せ]めていた。ユダの都々のうち、堅[かた]固[こ]な都として残っていたのはこれらだけであったからである。"
  8: "ゼデキヤ王[おう]が、エルサレムにいる民[たみ]に解放[かいほう]を告[つ]げ知[し]らせるために彼らと契約[けいやく]を結[むす]んだ後[あと]、主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]は、次[つぎ]のとおりである。"
  9: "それは、それぞれが自分の奴隷[どれい]と女奴隷[おんなどれい]を、すなわちヘブライ人[じん]の男[おとこ]とヘブライ人[じん]の女[おんな]を自由[じゆう]の身[み]として送[おく]り出[だ]し、イスラエルから来[き]た男[おとこ]をだれも奴隷[どれい]として使[つか]わないようにするためであった。"
  10: "そこで、契約[けいやく]に入[はい]ったすべての君[きみ]たちとすべての民[たみ]は、それぞれ自分の奴隷[どれい]と女奴隷[おんなどれい]を自由[じゆう]の身[み]として送[おく]り出[だ]し、もはや彼らを所有[しょゆう]しないために、翻[ひるがえ]った。彼らはこれを聞[き]き入[い]れて、送り出した。"
  11: "しかし、その後[のち]、彼らはまた翻[ひるがえ]って、自由[じゆう]の身[み]として送り出した自分の奴隷[どれい]たちと女奴隷[おんなどれい]たちを引[ひ]き戻[もど]し、彼らを捕[と]らえて、再[ふたた]び奴隷[どれい]と女奴隷[おんなどれい]とした。"
  12: "主[しゅ]の言葉[ことば]がエレミヤに臨[のぞ]んで言[い]った。"
  13: "イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。「わたしは、あなたがたの父[ちち]たちをエジプトの地[ち]、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]した日[ひ]に、彼らと契約[けいやく]を結[むす]んで言[い]った。"
  14: "『六年[ろくねん]が満[み]ちたら、あなたに売[う]られたヘブライ人[じん]の兄弟[きょうだい]を送[おく]り出[だ]せ。彼は六年の間あなたに仕[つか]える。そして、彼をあなたのもとから自由[じゆう]の身[み]として送り出せ』と。しかし、あなたがたの父[ちち]たちはわたしに聞[き]き従[したが]わず、耳[みみ]を傾[かたむ]けなかった。"
  15: "あなたがたは今日[きょう]、それぞれ自分[じぶん]の隣人[りんじん]に解放[かいほう]を告[つ]げ知[し]らせて、わたしの目[め]に正[ただ]しいことを行[おこな]い、わたしの名[な]がその上[うえ]に呼[よ]ばれている家[いえ]で、わたしの前[まえ]に契約[けいやく]を結[むす]んだ。"
  16: "しかし、あなたがたは翻[ひるがえ]って、わたしの名[な]を汚[けが]した。自分[じぶん]の魂[たましい]のままに自由[じゆう]の身[み]として送[おく]り出[だ]した自分の奴隷[どれい]と女奴隷[おんなどれい]を引[ひ]き戻[もど]し、彼らをあなたがたの奴隷[どれい]と女奴隷[おんなどれい]としようとして、彼らを従[したが]わせた。」"
  17: "それゆえ、主[しゅ]はこう言[い]われる。「あなたがたは、それぞれ自分[じぶん]の兄弟[きょうだい]と隣人[りんじん]に解放[かいほう]を告[つ]げ知[し]らせることを、わたしに聞[き]き従[したが]って行[おこな]わなかった。見[み]よ、わたしはあなたがたに解放を告げ知らせる。剣[つるぎ]と死[し]と飢[う]えへの解放を。そして、あなたがたを地[ち]のすべての王国[おうこく]への散[ち]らしとする。"
  18: "わたしは、わたしの契約[けいやく]を踏[ふ]み越[こ]え、わたしの前[まえ]に結[むす]んだ契約の言葉[ことば]を固[かた]く守[まも]らなかった者[もの]たちを渡[わた]す。彼らは子牛[こうし]を二[ふた]つに裂[さ]き、その裂[さ]かれた間[あいだ]を通[とお]った者たちである。"
  19: "すなわち、ユダの君[きみ]たちとエルサレムの君たち、宮廷[きゅうてい]の高官[こうかん]たちと祭司[さいし]たち、およびこの地[ち]のすべての民[たみ]のうち、二つに裂かれた子牛[こうし]の間を通った者たちを。"
  20: "わたしは彼らを敵[てき]の手[て]に、また彼らの命[いのち]を求[もと]める者[もの]の手に渡[わた]す。彼らの死体[したし]は天[てん]の鳥[とり]と地[ち]の獣[けだもの]の餌[えさ]となる。"
  21: "また、ユダの王[おう]ゼデキヤとその君[きみ]たちを、わたしは彼らの敵[てき]の手に、彼らの命[いのち]を求める者[もの]の手に、彼らから離[はな]れ去[さ]ったバビロンの王[おう]の軍[ぐん]勢[ぜい]の手に渡す。"
  22: "見[み]よ、わたしは命[めい]じる、と主[しゅ]は言[い]われる。わたしは彼らをこの地[ち]に戻[もど]す。彼らはこの都[みやこ]を攻[せ]め、これを取って火[ひ]で焼[や]き、ユダの都[みやこ]々[みやこ]を住[す]む者[もの]のいない荒[あ]れ地[ち]とする。」"

notes:
  1: "Ὁ λόγος ὁ γενόμενος πρὸς Ιερεμιαν παρὰ κυρίου — «слово, бывшее к Иеремии от Господа»; ὅτε... ἐπολέμουν — «когда... воевали» (имперфект, длительное действие); πᾶν τὸ στρατόπεδον αὐτοῦ — «всё войско его»; πᾶσα ἡ γῆ ἀρχῆς αὐτοῦ — «вся земля власти его». Слав. добавляет «и вси людие» — нет в LXX, внесено без скобок (すべての民). λέγων в конце стиха вводит речь следующего стиха; в ст. 1 не переведено. ru (МТ) «все царства земли, подвластные руке его, и все народы»."
  2: "Οὕτως εἶπεν κύριος Βάδισον... — «так сказал Господь: пойди... и скажи ему»; Παραδόσει παραδοθήσεται — «преданием предастся» (датив усиления, «непременно будет предан»); συλλήμψεται αὐτὴν καὶ καύσει ἐν πυρί — «возьмёт его и сожжёт огнём». Слав. «преданием предастся сей град в руце царя вавилонска, и возмет его и пожжет его огнем». Внутренняя формула «так говорит Господь» не разрывает кавычек."
  3: "καὶ σὺ οὐ μὴ σωθῇς ἐκ χειρὸς αὐτοῦ — «и ты не спасёшься от руки его»; συλλήμψει συλλημφθήσῃ — «схваченный будешь схвачен» (усиление); οἱ ὀφθαλμοί σου τοὺς ὀφθαλμοὺς αὐτοῦ ὄψονται — «глаза твои увидят глаза его» (о встрече лицом к лицу); τὸ στόμα αὐτοῦ μετὰ τοῦ στόματός σου λαλήσει — «уста его с устами твоими будут говорить»; εἰς Βαβυλῶνα εἰσελεύσῃ — «в Вавилон войдёшь»."
  4: "ἀλλὰ ἄκουσον τὸν λόγον κυρίου — «но послушай слово Господне»; обращение к царю по имени: Σεδεκια βασιλεῦ Ιουδα. Слав. «но обаче слыши слово Господне, седекие, царю иудинъ! тако глаголет Господь к тебе» — «к тебе» в греч. нет при этой формуле, отнесено к смыслу следующего стиха (あなたについて)."
  5: "Ἐν εἰρήνῃ ἀποθανῇ — «в мире умрёшь»; ὡς ἔκλαυσαν τοὺς πατέρας σου — «как оплакали отцов твоих»; τοὺς βασιλεύσαντας πρότερόν σου — «царствовавших прежде тебя»; Ὦ αδων κόψονταί σε — «“о господин” восплачут о тебе» (ἄδων, звательный падеж от «господин»); ὅτι λόγον ἐγὼ ἐλάλησα — «ибо слово Я изрёк». Слав. повторяет плач дважды («увы, господи, и: увы, господи!») и добавляет «восплачутся и тебе»; в тексте один плач. ru (МТ) добавляет сожжение благовоний при погребении — нет в LXX."
  6: "ἐλάλησεν Ιερεμιας πρὸς τὸν βασιλέα Σεδεκιαν — «говорил Иеремия царю Седекии»; πάντας τοὺς λόγους τούτους ἐν Ιερουσαλημ — «все слова сии в Иерусалиме». Слав. «иеремиа пророк». Авторский текст; кавычки слова Господа закрыты в ст. 5."
  7: "ἡ δύναμις βασιλέως Βαβυλῶνος — «сила (войско) царя Вавилонского»; ἐπὶ Λαχις καὶ ἐπὶ Αζηκα — «против Лахиса и Азеки» (ラキシュ、アゼカ); ὅτι αὗται κατελείφθησαν ἐν πόλεσιν Ιουδα πόλεις ὀχυραί — «ибо они остались из городов Иуды городами укреплёнными» (ὀχυρός — крепкий). Слав. «на грады иудины оставшыяся»."
  8: "μετὰ τὸ συντελέσαι τὸν βασιλέα Σεδεκιαν διαθήκην πρὸς τὸν λαόν — «после того как царь Седекия заключил завет с народом» (συντελέω — завершать); τοῦ καλέσαι ἄφεσιν — «чтобы наречь (объявить) отпущение» (καλέω — называть, объявлять; ἄφεσις — отпущение, освобождение). Слав. добавляет «иже во Иерусалиме» — нет в LXX, внесено (エルサレムにいる)."
  9: "τοῦ ἐξαποστεῖλαι ἕκαστον τὸν παῖδα αὐτοῦ καὶ... τὴν παιδίσκην αὐτοῦ — «чтобы отпустить каждого раба своего и... рабу свою»; τὸν Εβραῖον καὶ τὴν Εβραίαν ἐλευθέρους — «еврея и евреянку свободными»; πρὸς τὸ μὴ δουλεύειν ἄνδρα ἐξ Ιουδα — «чтобы не служил муж из Иуды»; слав. читает «от израиля» — в тексте по csl (イスラエル), чтение LXX отмечено здесь."
  10: "καὶ ἐπεστράφησαν πάντες οἱ μεγιστᾶνες — «и обратились все вельможи» (μεγιστάν — вельможа, 君); οἱ εἰσελθόντες ἐν τῇ διαθήκῃ — «вошедшие в завет». LXX обрывается на «отпустить»; слав. добавляет «и ктому не владети ими. Слышаша убо и отпустиша» — нет в LXX, внесено без скобок."
  11: "καὶ ἔωσαν αὐτοὺς εἰς παῖδας καὶ παιδίσκας — тёмное место: «и обратили их в рабов и рабынь» (ἔωσαν — редкий, тёмный глагол). Слав. «обратишася по сих вспять и удержаша паки рабы и рабыни своя, ихже отпустиша свободных, и взяша в рабы»; в тексте по csl, LXX отмечен здесь."
  12: "ἐγενήθη λόγος κυρίου πρὸς Ιερεμιαν λέγων — вводная формула вне кавычек."
  13: "Ἐγὼ ἐθέμην διαθήκην πρὸς τοὺς πατέρας ὑμῶν — «Я положил завет с отцами вашими» (τίθημι); ἐν τῇ ἡμέρᾳ, ᾗ ἐξειλάμην αὐτοὺς — «в день, когда Я избавил их» (ἐξαιρέω); ἐξ οἴκου δουλείας — «из дома рабства». Слав. «аз завещах завет ко отцем вашым»."
  14: "Ὅταν πληρωθῇ ἓξ ἔτη — «когда исполнится шесть лет»; ἀποστελεῖς τὸν ἀδελφόν σου τὸν Εβραῖον — «отпустишь брата твоего еврея»; ὃς πραθήσεταί σοι — «который продан тебе» (πιπράσκω); ἐργᾶταί σοι ἓξ ἔτη — «пусть работает тебе шесть лет»; ἐξαποστελεῖς αὐτὸν ἐλεύθερον. οὐκ ἤκουσάν μου καὶ οὐκ ἔκλιναν τὸ οὖς αὐτῶν — «не послушали Меня и не приклонили уха своего». Содержание завета — вложенная речь 『…』. ru (МТ) «в конце седьмого года» — иное счисление."
  15: "ἐπέστρεψαν σήμερον ποιῆσαι τὸ εὐθὲς πρὸ ὀφθαλμῶν μου — «обратились сегодня сделать правое пред очами Моими» (εὐθής — прямой, правый); καλέσαι ἄφεσιν ἕκαστον τῷ πλησίον αὐτοῦ — «объявить отпущение каждый ближнему своему»; συνετέλεσαν διαθήκην κατὰ πρόσωπόν μου — «заключили завет предо Мною»; ἐν τῷ οἴκῳ, οὗ ἐπεκλήθη τὸ ὄνομά μου ἐπ' αὐτῷ — «в доме, над которым наречено имя Моё»."
  16: "ἐπεστρέψατε καὶ ἐβεβηλώσατε τὸ ὄνομά μου — «обратились и осквернили имя Моё» (βεβηλόω — осквернять); οὓς ἐξαπεστείλατε ἐλευθέρους τῇ ψυχῇ αὐτῶν — «которых отпустили свободными по душе их» (т. е. по их желанию); ὑμῖν εἰς παῖδας καὶ παιδίσκας — «вам в рабов и рабынь». Слав. «отвратистеся, и осквернисте завет мой» — при «имя» в LXX; в тексте 名."
  17: "ἰδοὺ ἐγὼ καλῶ ἄφεσιν ὑμῖν εἰς μάχαιραν καὶ εἰς τὸν θάνατον καὶ εἰς τὸν λιμόν — «вот, Я нарекаю (объявляю) вам отпущение — на меч, на смерть и на голод»: игра слов с ἄφεσις (отпущение рабов / освобождение на казнь); δώσω ὑμᾶς εἰς διασπορὰν πάσαις ταῖς βασιλείαις τῆς γῆς — «отдам вас в рассеяние всем царствам земли» (διασπορά; ср. 1 Пет 1:1). Слав. «нарицаю отпущение вам на мечь и на смерть и на глад»."
  18: "τοὺς παρεληλυθότας τὴν διαθήκην μου — «преступивших завет Мой» (παρέρχομαι — проходить мимо, преступать); τοὺς μὴ στήσαντας τὴν διαθήκην — «не устоявших в завете» (ἵστημι); τὸν μόσχον ὃν ἐποίησαν ἐργάζεσθαι αὐτῷ — тёмное место LXX (букв. «тельца, которого сделали, чтобы он работал ему»?); слав. «телца егоже разсекоша на две части и ходиша между разделенными частьми его» — внесено без скобок (子牛を二つに裂き…), LXX отмечен. Об обряде рассечения тельца см. Быт 15:10,17."
  19: "τοὺς ἄρχοντας Ιουδα καὶ τοὺς δυνάστας καὶ τοὺς ἱερεῖς καὶ τὸν λαόν — «князей Иуды, и вельмож, и священников, и народ»; слав. добавляет «князи иерусалимли» (エルサレムの君たち) — нет в LXX, внесено. Стих продолжает перечень ст. 18 (винительный при «отдам»)."
  20: "δώσω αὐτοὺς τοῖς ἐχθροῖς αὐτῶν — «отдам их врагам их»; καὶ ἔσται τὰ θνησιμαῖα αὐτῶν βρῶσις — «и будут трупы их в пищу» (θνησιμαῖον — падаль, труп); τοῖς πετεινοῖς τοῦ οὐρανοῦ καὶ τοῖς θηρίοις τῆς γῆς — «птицам небесным и зверям земным» (ср. 7:33; 16:4)."
  21: "καὶ τὸν Σεδεκιαν... δώσω εἰς χεῖρας ἐχθρῶν αὐτῶν — «и Седекию... отдам в руки врагов их»; δυνάμει βασιλέως Βαβυλῶνος τοῖς ἀποτρέχουσιν ἀπ' αὐτῶν — «силе царя Вавилонского, отбежавшим от них»: вероятно, о войске, ушедшем от Иерусалима (ср. 44:5,11); ru (МТ) «которое отступило от вас» — иное понимание."
  22: "ἰδοὺ ἐγὼ συντάσσω — «вот, Я повелеваю» (συντάσσω — приказывать, ср. 33:2); ἐπιστρέψω αὐτοὺς εἰς τὴν γῆν ταύτην — «возвращу их в землю сию»; πολεμήσουσιν ἐπ' αὐτὴν καὶ λήμψονται... κατακαύσουσιν — «будут воевать против неё, возьмут... сожгут»; δώσω αὐτὰς ἐρήμους ἀπὸ κατοικούντων — «сделаю их пустыми от жителей». Слав. «се, аз завещаю... и дам я в непроходны от живущих»."
