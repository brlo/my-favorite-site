# jp-box, Псалтирь, псалом 135. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..26.
# Псалом 135: великая хвала с припевом «ибо вовек милость Его» — призыв (1–3),
# Творец (4–9), исход и дар земли (10–22), смирение и избавление (23–25),
# заключительный призыв (26).
# Красного и синего нет. Кавычек нет: в псалме нет прямой речи.
# Припев «そのあわれみは永遠に続く» повторяется дословно в каждом стихе, как в греч.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 紅海, 荒野, 贖い уже в корпусе.
# jp-ni не использовался.

