verses:
  1: "アリルイヤ。主[しゅ]に感謝[かんしゃ]せよ。主[しゅ]は善[よ]い方[かた]である。そのあわれみは永遠[えいえん]に続[つづ]く。"
  2: "神[かみ]々[がみ]の神[かみ]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  3: "もろもろの主[しゅ]の主[しゅ]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  4: "ただひとり大[おお]きな奇[き]跡[せき]を行[おこな]われる方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  5: "知恵[ちえ]によって天[てん]を造[つく]られた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  6: "水[みず]の上[うえ]に地[ち]を固[かた]められた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  7: "ただひとり大[おお]きな光[ひかり]を造[つく]られた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  8: "昼[ひる]を治[おさ]めるために日[ひ]を置[お]かれた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  9: "夜[よる]を治[おさ]めるために月[つき]と星[ほし]とを置[お]かれた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  10: "エジプトとその初[うい]子[ご]たちを打[う]たれた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  11: "イスラエルを彼[かれ]らのただ中[なか]から導[みちび]き出[だ]された方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  12: "すなわち、強[つよ]い手[て]と高[たか]く上[あ]げられた腕[うで]とによる。そのあわれみは永遠[えいえん]に続[つづ]く。"
  13: "紅海[こうかい]を分[わ]けた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  14: "イスラエルをそのただ中[なか]を通[とお]らせた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  15: "ファラオとその軍勢[ぐんぜい]を紅海[こうかい]に振[ふ]り落[お]とした方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  16: "ご自分[じぶん]の民[たみ]を荒野[こうや]に導[みちび]かれた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。固[かた]い岩[いわ]から水[みず]を出[だ]された方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  17: "大[おお]きな王[おう]たちを打[う]たれた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  18: "強[つよ]い王[おう]たちを殺[ころ]された方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  19: "アモリ人[びと]の王[おう]シホンを打[う]たれた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  20: "バシャンの王[おう]オグを打[う]たれた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  21: "彼[かれ]らの地[ち]を受[う]け継[つ]ぎとして与[あた]えられた方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  22: "すなわち、その僕[しもべ]イスラエルへの受[う]け継[つ]ぎである。そのあわれみは永遠[えいえん]に続[つづ]く。"
  23: "わたしたちが卑[いや]しめられたとき、わたしたちを思[おも]い出[だ]された方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  24: "わたしたちを敵[てき]から贖[あがな]い出[だ]された方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  25: "すべての肉[にく]あるものに食物[しょくもつ]を与[あた]えられる方[かた]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"
  26: "天[てん]の神[かみ]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。もろもろの主[しゅ]の主[しゅ]に感謝[かんしゃ]せよ。そのあわれみは永遠[えいえん]に続[つづ]く。"

notes:
  1: "Αλληλουια — アリルイヤ (евр. «хвалите Господа»; в ru-базе «Аллилуия»). Стих 0; скобками не маркируется. В греч. базе 27 строк (0–26), припев «ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ» стоит в каждом стихе и передан дословно одним и тем же そのあわれみは永遠に続く. В csl-ru отдельного стиха 0 нет — надписание влито в ст. 1. Ἐξομολογεῖσθε τῷ κυρίῳ — 主に感謝せよ (ἐξομολογέομαι — «исповедовать, славить», в псалме — благодарственная хвала; передано 感謝, как в церковном чтении «исповедайтеся»). ὅτι χρηστός — 主は善い方である (χρηστός — «благ, милостив»). ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — そのあわれみは永遠に続く (εἰς τὸν αἰῶνα — «во век»; ἔλεος — あわれみ; формула припева)."
  2: "ἐξομολογεῖσθε τῷ θεῷ τῶν θεῶν — 神々の神に感謝せよ (θεὸς τῶν θεῶν — превосходная степень, «Бог богов»; порядок греч. сохранён). Припев тот же, дословно."
  3: "ἐξομολογεῖσθε τῷ κυρίῳ τῶν κυρίων — もろもろの主の主に感謝せよ (κύριος τῶν κυρίων — «Господь господ»; параллель ст. 2, повтор сохранён). Припев тот же."
  4: "τῷ ποιοῦντι θαυμάσια μεγάλα μόνῳ — ただひとり大きな奇跡を行われる方に (θαυμάσιον — «дивное»; μόνος — «единственный», отсюда ただひとり). Датив причастия зависит от ἐξομολογεῖσθε ст. 1, поэтому 方に感謝せよ повторяется в каждом стихе, чтобы стих читался отдельно. Припев тот же."
  5: "τῷ ποιήσαντι τοὺς οὐρανοὺς ἐν συνέσει — 知恵によって天を造られた方に (οὐρανοί мн. — «небеса»; σύνεσις — «разумение, понимание», отсюда 知恵, а не σοφία; ἐν — «в, по»). Припев тот же."
  6: "τῷ στερεώσαντι τὴν γῆν ἐπὶ τῶν ὑδάτων — 水の上に地を固められた方に (στερεόω — «утверждать»; ἐπί + gen. — «на, над»; образ земли, поднятой над водами, ср. Быт 1:9). Припев тот же."
  7: "τῷ ποιήσαντι φῶτα μεγάλα μόνῳ — ただひとり大きな光を造られた方に (φῶτα мн. — «светила»; μόνος, как в ст. 4). Припев тот же."
  8: "τὸν ἥλιον εἰς ἐξουσίαν τῆς ἡμέρας — 昼を治めるために日を置かれた方に (ἥλιος — 日; ἐξουσία — «власть», отсюда 治める; εἰς — «для, во власть»). Винительный падеж продолжает ряд дативов ст. 4–7; по-японски дан самостоятельный оборот. Припев тот же."
  9: "τὴν σελήνην καὶ τὰ ἄστρα εἰς ἐξουσίαν τῆς νυκτός — 夜を治めるために月と星とを置かれた方に (σελήνη — 月; ἄστρον — 星; параллель ст. 8 сохранена). Припев тот же."
  10: "τῷ πατάξαντι Αἴγυπτον σὺν τοῖς πρωτοτόκοις αὐτῶν — エジプトとその初子たちを打たれた方に (πατάσσω — «поражать»; πρωτότοκος — 初子, ср. 134:8; σύν — «вместе с»). Припев тот же."
  11: "καὶ ἐξαγαγόντι τὸν Ισραηλ ἐκ μέσου αὐτῶν — イスラエルを彼らのただ中から導き出された方に (ἐξάγω — «выводить»; ἐκ μέσου — «из среды»). Припев тот же."
  12: "ἐν χειρὶ κραταιᾷ καὶ ἐν βραχίονι ὑψηλῷ — すなわち、強い手と高く上げられた腕とによる (χείρ — 手; βραχίων — «мышца»; ὑψηλός — «высокий»; формула исхода, ср. Втор 5:15). В греч. это обстоятельство при причастии ст. 11; по-японски — отдельное предложение с による, чтобы стих не повис. Припев тот же."
  13: "τῷ καταδιελόντι τὴν ἐρυθρὰν θάλασσαν εἰς διαιρέσεις — 紅海を分けた方に (καταδιαιρέω — «разделять на части»; ἐρυθρὰ θάλασσα — 紅海; διαίρεσις — «разделение», передано глаголом 分ける). Припев тот же."
  14: "καὶ διαγαγόντι τὸν Ισραηλ διὰ μέσου αὐτῆς — イスラエルをそのただ中を通らせた方に (διάγω — «проводить»; διὰ μέσου — «через середину»). Припев тот же."
  15: "καὶ ἐκτινάξαντι Φαραω καὶ τὴν δύναμιν αὐτοῦ εἰς θάλασσαν ἐρυθράν — ファラオとその軍勢を紅海に振り落とした方に (ἐκτινάσσω — «стряхивать»; δύναμις — «сила, войско», отсюда 軍勢). Припев тот же."
  16: "τῷ διαγαγόντι τὸν λαὸν αὐτοῦ ἐν τῇ ἐρήμῳ — ご自分の民を荒野に導かれた方に (διάγω, как в ст. 14; ἔρημος — 荒野). В этом стихе база держит два члена с припевом после каждого: τῷ ἐξαγαγόντι ὕδωρ ἐκ πέτρας ἀκροτόμου — 固い岩から水を出された方に (ἐξάγω — «выводить»; πέτρα ἀκρότομος — «камень скальный, кремень»). Поэтому припев стоит дважды, как в греч."
  17: "τῷ πατάξαντι βασιλεῖς μεγάλους — 大きな王たちを打たれた方に (πατάσσω, как в ст. 10; μέγας — «великий»). Припев тот же."
  18: "καὶ ἀποκτείναντι βασιλεῖς κραταιούς — 強い王たちを殺された方に (ἀποκτείνω — «умерщвлять»; κραταιός — «крепкий», ср. 134:10). Припев тот же."
  19: "τὸν Σηων βασιλέα τῶν Αμορραίων — アモリ人の王シホンを打たれた方に (Σηων — シホン; Αμορραῖοι — アモリ人; винительный падеж при πατάξαντι ст. 17, поэтому сказуемое повторено). Припев тот же."
  20: "καὶ τὸν Ωγ βασιλέα τῆς Βασαν — バシャンの王オグを打たれた方に (Ωγ — オグ; Βασαν — バシャン, ср. 134:11). Припев тот же."
  21: "καὶ δόντι τὴν γῆν αὐτῶν κληρονομίαν — 彼らの地を受け継ぎとして与えられた方に (δίδωμι — «давать»; κληρονομία — «наследие», ср. 134:12). Припев тот же."
  22: "κληρονομίαν Ισραηλ δούλῳ αὐτοῦ — すなわち、その僕イスラエルへの受け継ぎである (повтор κληρονομία из ст. 21; δοῦλος — 僕; датив «Израилю, рабу Своему»). Припев тот же."
  23: "ὅτι ἐν τῇ ταπεινώσει ἡμῶν ἐμνήσθη ἡμῶν ὁ κύριος — わたしたちが卑しめられたとき、わたしたちを思い出された方に (ταπείνωσις — «уничижение, унижение»; μιμνήσκομαι + gen. — «вспомнить»). Припев тот же."
  24: "καὶ ἐλυτρώσατο ἡμᾶς ἐκ τῶν ἐχθρῶν ἡμῶν — わたしたちを敵から贖い出された方に (λυτρόω — 贖う, ср. 129:8; ἐκ — «из»). Припев тот же."
  25: "ὁ διδοὺς τροφὴν πάσῃ σαρκί — すべての肉あるものに食物を与えられる方に (τροφή — «пища»; σάρξ — «плоть», отсюда 肉あるもの; πᾶς — «всякий»). Припев тот же; в базе стих кончается припевом."
  26: "ἐξομολογεῖσθε τῷ θεῷ τοῦ οὐρανοῦ — 天の神に感謝せよ (θεὸς τοῦ οὐρανοῦ — «Бог небесный»; ср. Ездр 5:11). ἐξομολογεῖσθε τῷ κυρίῳ τῶν κυρίων — もろもろの主の主に感謝せよ (повтор ст. 3, как в греч.; в ru-базе этого второго члена нет, но в gr-lxx-byz он есть, поэтому переведён). Припев — после каждого из двух членов."
