verses:
  1: "小羊[こひつじ]が七[なな]つの封印[ふういん]の一[ひと]つを開[ひら]いたとき、わたしは見[み]た。四[よっ]つの生[い]き物[もの]の一[ひと]つが、雷[かみなり]のような声[こえ]で言[い]うのを聞[き]いた。「来[き]なさい、〔そして見[み]なさい〕。」"
  2: "そして、わたしが見[み]ると、白[しろ]い馬[うま]がいた。それに乗[の]っている者[もの]は弓[ゆみ]を持[も]ち、冠[かんむり]が与[あた]えられていた。彼[かれ]は勝[か]ちを得[え]ながら、さらに勝[か]つために出[で]て行[い]った。"
  3: "第二[だいに]の封印[ふういん]を開[ひら]いたとき、わたしは第二[だいに]の生[い]き物[もの]が「来[き]なさい、〔そして見[み]なさい〕」と言[い]うのを聞[き]いた。"
  4: "すると、別[べつ]の馬[うま]、火[ひ]のように赤[あか]い馬[うま]が出[で]て来[き]た。それに乗[の]っている者[もの]には、地[ち]から平和[へいわ]を奪[うば]い、人々[ひとびと]が互[たが]いに殺[ころ]し合[あ]うようにする権限[けんげん]が与[あた]えられた。また、大[おお]きな剣[つるぎ]が彼[かれ]に与[あた]えられた。"
  5: "第三[だいさん]の封印[ふういん]を開[ひら]いたとき、わたしは第三[だいさん]の生[い]き物[もの]が「来[き]なさい、〔そして見[み]なさい〕」と言[い]うのを聞[き]いた。わたしが見[み]ると、黒[くろ]い馬[うま]がいた。それに乗[の]っている者[もの]は、手[て]にはかりを持[も]っていた。"
  6: "わたしは、四[よっ]つの生[い]き物[もの]の間[あいだ]から出[で]る声[こえ]のようなものを聞[き]いた。「小麦[こむぎ]一升[いっしょう]がデナリオン一[いち]枚[まい]、大麦[おおむぎ]三升[さんしょう]がデナリオン一[いち]枚[まい]。油[あぶら]と酒[さけ]を損[そこ]なってはならない。」"
  7: "第四[だいよん]の封印[ふういん]を開[ひら]いたとき、わたしは第四[だいよん]の生[い]き物[もの]の声[こえ]が「来[き]なさい、〔そして見[み]なさい〕」と言[い]うのを聞[き]いた。"
  8: "わたしが見[み]ると、青白[あおじろ]い馬[うま]がいた。それに乗[の]っている者[もの]の名[な]は死[し]であり、陰府[よみ]がその後[あと]に従[したが]っていた。彼[かれ]らには、地[ち]の四分[しぶん]の一[いち]を、剣[つるぎ]と飢[う]えと死[し]と地[ち]の獣[けもの]によって殺[ころ]す権限[けんげん]が与[あた]えられた。"
  9: "第五[だいご]の封印[ふういん]が開[ひら]くと、わたしは祭壇[さいだん]の下[した]に、神[かみ]の言葉[ことば]のゆえに、また自分[じぶん]が持[も]っていた証[あかし]のゆえに屠[ほふ]られた者[もの]たちの魂[たましい]を見[み]た。"
  10: "彼[かれ]らは大[おお]きな声[こえ]で叫[さけ]んだ。「聖[せい]にして真[しん]実[じつ]なる主[しゅ]よ、いつまで、地[ち]に住[す]む者[もの]たちにわたしたちの血[ち]の報[むく]いをなさらず、裁[さば]きをなさらないのか。」"
  11: "彼[かれ]らは一人[ひとり]ひとり白[しろ]い衣[ころも]を与[あた]えられ、まだしばらく休[やす]んでいるように言[い]われた。彼[かれ]ら自身[じしん]のように殺[ころ]されることになっている、同[おな]じ僕[しもべ]たちや兄弟[きょうだい]たちの数[かず]が満[み]ちるまでである。"
  12: "第六[だいろく]の封印[ふういん]が開[ひら]かれると、大[おお]きな地震[じしん]が起[お]こった。太陽[たいよう]は毛[け]の粗[あら]い袋[ふくろ]のように黒[くろ]くなり、月[つき]は全[まった]く血[ち]の色[いろ]になった。"
  13: "天[てん]の星[ほし]たちは、大[おお]きな風[かぜ]に揺[ゆ]られるいちじくの木[き]がまだ熟[じゅく]さない実[み]を落[お]とすように、地[ち]に落[お]ちた。"
  14: "天[てん]は巻[ま]かれる巻物[まきもの]のように退[の]き、すべての山[やま]と島[しま]は、その場所[ばしょ]から移[うつ]された。"
  15: "地[ち]の王[おう]たち、高官[こうかん]たち、千人[せんにん]の長[ちょう]たち、富[と]める者[もの]たち、力[ちから]ある者[もの]たち、すなわちすべての奴隷[どれい]と自由[じゆう]の者[もの]とは、洞穴[ほらあな]や山[やま]の岩[いわ]の中[なか]に身[み]を隠[かく]した。"
  16: "そして、山[やま]と岩[いわ]に向[む]かって言[い]った。「わたしたちの上[うえ]に落[お]ちて、御座[みくら]に座[すわ]っておられる方[かた]の顔[かお]から、また小羊[こひつじ]の怒[いか]りから、わたしたちを隠[かく]してくれ。"
  17: "彼[かれ]らの怒[いか]りの大[おお]きな日[ひ]が来[き]た。だれがそれに立[た]ち向[む]かえるだろうか。」"

notes:
  1: "Ἔρχου — 来なさい. καὶ ἴδε в базе нет (проверено: ιδε — НЕТ), это церковное чтение, поэтому 〔そして見なさい〕. Голос одного из живых существ — «…», не красный."
  2: "ἵππος λευκός — 白い馬. τόξον — 弓. ἐδόθη αὐτῷ στέφανος — 冠が与えられた. νικῶν καὶ ἵνα νικήσῃ — 勝ちを得ながら、さらに勝つために."
  3: "См. 6:1; в базе тоже только Ἔρχου."
  4: "πυρρός — огненно-красный: 火のように赤い. ἀλλήλους σφάξουσιν — 互いに殺し合う. μάχαιρα μεγάλη — 大きな剣."
  5: "ζυγός — はかり (весы); в кане, чтобы не вводить редкое 秤. См. 6:1 о 〔そして見なさい〕."
  6: "χοῖνιξ — мера зерна (≈1,1 л), передано 一升 / 三升. δηναρίου — за денарий: デナリオン一枚. μὴ ἀδικήσῃς — 損なってはならない."
  7: "См. 6:1; в базе только Ἔρχου."
  8: "χλωρός — 青白い (бледный, зеленовато-серый). Θάνατος — 死, ᾅδης — 陰府 (как 1:18 в otkr_01). ῥομφαία — 剣, λιμός — 飢え, θάνατος — 死 (в части рукописей λοιμός «мор», но в базе θανάτῳ — 死). ἐπὶ τὸ τέταρτον τῆς γῆς — 地の四分の一."
  9: "θυσιαστήριον — 祭壇. ψυχαὶ τῶν ἐσφαγμένων — 屠られた者たちの魂. μαρτυρία ἣν εἶχον — 自分が持っていた証."
  10: "δεσπότης — 主 (не κύριος); 聖にして真実なる主. ἐκδικεῖς τὸ αἷμα — 血の報いをする. Вопрос «доколе» сохранён."
  11: "στολὴ λευκή — 白い衣. ἀναπαύσονται — 休む. ἕως πληρωθῶσιν — 数が満ちるまで. σύνδουλοι — 同じ僕たち."
  12: "σεισμὸς μέγας — 大きな地震. σάκκος τρίχινος — 毛の粗い袋 (дерюга). σελήνη ὅλη — 月は全く. В базе всё на месте — 〔…〕 нет."
  13: "ὄλυνθοι — незрелые смоквы: まだ熟さない実. συκῆ… σειομένη — 揺られるいちじくの木."
  14: "βιβλίον ἑλισσόμενον — 巻かれる巻物 (свиток). ὄρος καὶ νῆσος — 山と島."
  15: "βασιλεῖς, μεγιστᾶνες, χιλίαρχοι, πλούσιοι, ἰσχυροί, δοῦλοι, ἐλεύθεροι — 王たち、高官たち、千人の長たち、富める者たち、力ある者たち、奴隷、自由の者. σπήλαια — 洞穴."
  16: "ἀπὸ προσώπου — 顔から. ὀργὴ τοῦ ἀρνίου — 小羊の怒り. Речь царей и людей — «…», не красная."
  17: "ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς αὐτῶν — 彼らの怒りの大きな日 (αὐτῶν — «их», о Боге и Агнце). τίς δύναται σταθῆναι — だれが立ち向かえるか."
