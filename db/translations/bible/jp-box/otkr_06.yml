# jp-box, Откровение Иоанна, глава 6. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; чего в нём нет, то в 〔…〕.
# Глава 6: снятие первых шести печатей — четыре всадника (1–8), души под жертвенником (9–11),
# шестая печать и день гнева (12–17).
# Красного <j> в главе нет: прямой речи Христа нет. Голоса живых существ (6:1, 3, 5, 7)
# и возгласы мучеников (6:10) — в «…», не красные; 6:16–17 — речь царей и людей, тоже не красная.
# 〔…〕: 6:1, 3, 5, 7 — 〔そして見なさい〕: в базе только Ἔρχου, а καὶ ἴδε — церковное чтение
# (проверено: ιδε — НЕТ, ερχου — ЕСТЬ). Прочее в базе есть (6:8 [αὐτοῦ], [ὁ] — квадратные
# скобки базы, слово есть, 〔…〕 не ставятся). Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

