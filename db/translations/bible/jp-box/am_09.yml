# jp-box, Амос, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 9 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–4 Господь у жертвенника: поражение, некуда убежать — ни в ад,
# ни на небо, ни на Кармил, ни в глубины моря, ни в плен; 5–6 гимн Творцу;
# 7–8 «не как сыны Ефиоплян вы для Меня», очи Господа на грешное царство,
# но дом Иакова не истреблён до конца; 9–10 просеивание Израиля, гибель
# грешников; 11–15 восстановление скинии Давида, «взыщут Господа остальные
# люди и все народы», жатва и виноград, возвращение из плена, насаждение
# на земле — «не будут более исторгаемы».
# Голоса: 1 — слово Господа в 「…» (пророк видит Господа); 2–4 — продолжение
# слова Господа (кавычки 1-го стиха не закрываются до конца 4-го);
# 5–10 — речь пророка, слова грешников в 10 — 「…»; 11–15 — слово Господа
# в 「…» (формула «говорит Господь» внутри 12 и 13, кавычки закрываются в 15).
# Цит. Деян 15:16–17: 9:11–12.
# Термины: 陰府 (ᾅδης), 幕屋 (σκηνή), 残りの者 (κατάλοιποι), ふるいにかける
# (λικμάω), 全能者 (παντοκράτωρ), 嗣業/土地 (γῆ).
# Имена: イスラエル, ヤコブ, ダビデ, エドム (в notes), エチオピア人, ペリシテ人,
# シリア人, カパドキア, カルメル, シオン, エルサレム, ダマスコ.
#
