verses:
  1: "わたしは主[しゅ]が祭壇[さいだん]の上[うえ]に立[た]っておられるのを見[み]た。主[しゅ]は言[い]われた。「戸口[とぐち]の柱[はしら]を打[う]て。そうすれば、入口[いりぐち]が震[ふる]える。すべての者の頭[あたま]を打[う]ち砕[くだ]け。残[のこ]りの者[もの]は剣[つるぎ]で殺[ころ]す。逃[に]げる者[もの]は一人[ひとり]もなく、逃[のが]れ延[の]びる者もない。"
  2: "たとえ彼らが陰府[よみ]に身[み]を隠[かく]しても、そこからわたしの手[て]が彼らを引[ひ]き出[だ]す。たとえ彼らが天[てん]に上[のぼ]っても、そこからわたしは彼らを引[ひ]き下[お]ろす。"
  3: "たとえ彼らがカルメルの頂[いただき]に隠れても、わたしはそこから探[さが]し出[だ]して捕[とら]える。たとえ彼らがわたしの目[め]から逃[のが]れて海[うみ]の深[ふか]みに潜[もぐ]っても、そこでは海[うみ]の大蛇[おろち]に命[めい]じて、彼らをかませる。"
  4: "たとえ彼らが敵[てき]の前[まえ]に捕囚[ほしゅう]として連[つ]れ去[さ]られても、そこで剣[つるぎ]に命じて彼らを殺[ころ]させる。わたしは彼らに災[わざわ]いを下[くだ]すために目[め]を注[そそ]ぎ、幸[しあわ]せのために注がない。」"
  5: "主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]が地[ち]に触[ふ]れると、地[ち]は溶[と]け、そこに住[す]む者[もの]はみな嘆[なげ]く。地[ち]はナイル川[がわ]のように上[あ]がり、エジプトの川のように沈[しず]む。"
  6: "主[しゅ]は天[てん]にご自分[じぶん]の上[のぼ]り口[ぐち]を建[た]て、地[ち]の上[うえ]にその約束[やくそく]を据[す]え、海[うみ]の水[みず]を呼[よ]び寄[よ]せて地[ち]の面[おもて]に注[そそ]がれる。その名[な]は主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]。"
  7: "イスラエルの子[こ]らよ、あなたがたはわたしにとって、エチオピア人[じん]の子らと何[なん]ら変[か]わらないではないか、と主[しゅ]は言[い]われる。わたしはイスラエルをエジプトの地[ち]から、ペリシテ人[じん]をカパドキアから、シリア人[じん]を穴[あな]から導[みちび]き出[だ]したではないか。"
  8: "見[み]よ、主[しゅ]である神[かみ]の目[め]は、罪[つみ]の王国[おうこく]の上[うえ]にある。わたしはそれを地[ち]の面[おもて]から滅[ほろ]ぼす。しかし、わたしはヤコブの家[いえ]を完全[かんぜん]には滅ぼさない、と主[しゅ]は言[い]われる。"
  9: "見[み]よ、わたしは命[めい]じて、イスラエルの家[いえ]をすべての国民[こくみん]の間[あいだ]でふるいにかける。ふるいにかけられて、一[ひと]つも地[ち]に落[お]ちるものはない。"
  10: "わたしの民[たみ]のうち、『災[わざわ]いは近[ちか]づかず、わたしたちに臨[のぞ]まない』と言[い]う罪[つみ]人[びと]は、みな剣[つるぎ]で死[し]ぬ。"
  11: "「その日[ひ]、わたしは倒[たお]れたダビデの幕屋[まくや]を建[た]て直[なお]す。その破[やぶ]れた所[ところ]を建て直し、その壊[こわ]された所を起[お]こし、昔[むかし]の日[ひ]々[び]のようにこれを建て直す。"
  12: "それは、残[のこ]りの人[ひと]々[びと]と、わたしの名[な]が呼[よ]び求められているすべての国民[こくみん]が、主[しゅ]を求[もと]めるためである、とこれをなさる主[しゅ]である神[かみ]は言[い]われる。"
  13: "見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。耕[たがや]す者[もの]が刈[か]り入[い]れる者[もの]に追[お]いつき、ぶどうを踏[ふ]む者[もの]が種[たね]を蒔[ま]く者[もの]に追いつく。山[やま]々[やま]は甘[あま]いぶどう酒[しゅ]を滴[したた]らせ、すべての丘[おか]は豊[ゆた]かな実[み]を結[むす]ぶ。"
  14: "わたしは捕囚[ほしゅう]となったわたしの民[たみ]イスラエルを帰[かえ]し、彼らは荒[あ]れ果[は]てた町[まち]々[まち]を建[た]て直[なお]して住[す]み、ぶどう畑[ばたけ]を植[う]えてそのぶどう酒[しゅ]を飲[の]み、園[その]を造[つく]ってその実[み]を食[た]べる。"
  15: "わたしは彼らをその地[ち]に植[う]え、わたしが彼らに与[あた]えたその地から、もはや抜[ぬ]き取[と]られないようにする。」と主[しゅ]である神[かみ]、全能者[ぜんのうしゃ]は言[い]われる。"

notes:
  1: "Εἶδον τὸν κύριον ἐφεστῶτα ἐπὶ τοῦ θυσιαστηρίου — «видел я Господа стоящим над жертвенником» (ἐφίστημι — стоять над, 上に立つ; θυσιαστήριον — 祭壇); Πάταξον ἐπὶ τὸ ἱλαστήριον — «ударь в очистилище» (ἱλαστήριον — очистилище/крышка ковчега, csl «очистилище»; в контексте — притолока/порог, ru «притолоку»; передано 戸口の柱); σεισθήσεται τὰ πρόπυλα — «потрясутся преддверия» (πρόπυλα — 入口の柱); διάκοψον εἰς κεφαλὰς πάντων — «рассеки в головы всех» (διακόπτω — разрубать, 打ち砕く); τοὺς καταλοίπους αὐτῶν ἐν ῥομφαίᾳ ἀποκτενῶ — «остатки их мечом убью» (κατάλοιποι — 残りの者; ῥομφαία — 剣); οὐ μὴ διαφύγῃ… φεύγων — «не убежит бегущий» (διαφεύγω — 逃げ延びる); οὐ μὴ διασωθῇ… ἀνασῳζόμενος — «не спасётся спасаемый» (διασῴζω — 逃れる)."
  2: "ἐὰν κατορυγῶσιν εἰς ᾅδου — «если сокроются в аде» (κατορύσσω — зарываться, 身を隠す; ᾅδης — 陰府); ἐκεῖθεν ἡ χείρ μου ἀνασπάσει αὐτούς — «оттуда рука Моя извлечёт их» (ἀνασπάω — вытаскивать, 引き出す); ἐὰν ἀναβῶσιν εἰς τὸν οὐρανόν — «если взойдут на небо»; ἐκεῖθεν κατάξω αὐτούς — «оттуда низведу их» (κατάγω — 引き下ろす)."
  3: "ἐὰν ἐγκρυβῶσιν εἰς τὴν κορυφὴν τοῦ Καρμήλου — «если скроются на вершине Кармила» (ἐγκρύπτω — 隠れる; κορυφή — 頂; Κάρμηλος — カルメル); ἐξερευνήσω καὶ λήμψομαι αὐτούς — «разыщу и возьму их» (ἐξερευνάω — 探し出す; λαμβάνω — 捕らえる); εἰς τὰ βάθη τῆς θαλάσσης — «в глубины моря» (βάθος — 深み); ἐκεῖ ἐντελοῦμαι τῷ δράκοντι καὶ δήξεται αὐτούς — «там повелю дракону (морскому змею), и ужалит их» (ἐντέλλομαι — 命じる; δράκων — 大蛇; δάκνω — かませる)."
  4: "ἐὰν πορευθῶσιν ἐν αἰχμαλωσίᾳ πρὸ προσώπου τῶν ἐχθρῶν αὐτῶν — «если пойдут в плен пред лицом врагов своих» (αἰχμαλωσία — 捕囚; ἐχθρός — 敵); ἐκεῖ ἐντελοῦμαι τῇ ῥομφαίᾳ καὶ ἀποκτενεῖ αὐτούς — «там повелю мечу, и убьёт их» (ῥομφαία — 剣); στηριῶ τοὺς ὀφθαλμούς μου ἐπ' αὐτοὺς εἰς κακά — «утвержу очи Мои на них на зло» (στηρίζω — утверждать, 注ぐ; ὀφθαλμός — 目); οὐκ εἰς ἀγαθά — «не на благо» (幸せのためではない). Здесь слово Господа (1–4) закрывается."
  5: "κύριος κύριος ὁ θεὸς ὁ παντοκράτωρ — «Господь Бог Вседержитель» (παντοκράτωρ — 全能者); ὁ ἐφαπτόμενος τῆς γῆς καὶ σαλεύων αὐτήν — «касающийся земли и колеблющий её» (ἐφάπτομαι — 触れる; σαλεύω — 溶ける/揺れる); πενθήσουσιν πάντες οἱ κατοικοῦντες αὐτήν — «восплачут все живущие на ней» (πενθέω — 嘆く); ἀναβήσεται ὡς ποταμὸς συντέλεια αὐτῆς — «поднимется, как река, конец её» (ποταμός — 川; συντέλεια — конец); καταβήσεται ὡς ποταμὸς Αἰγύπτου — «опустится, как река Египетская» (Нил, ナイル川)."
  6: "ὁ οἰκοδομῶν εἰς τὸν οὐρανὸν ἀνάβασιν αὐτοῦ — «строящий на небо восхождение Своё» (οἰκοδομέω — 建てる; ἀνάβασις — восход/лестница, 上り口; в ru «горние чертоги» — МТ); τὴν ἐπαγγελίαν αὐτοῦ ἐπὶ τῆς γῆς θεμελιῶν — «обещание Своё на земле основывающий» (ἐπαγγελία — 約束; θεμελιόω — 据える); ὁ προσκαλούμενος τὸ ὕδωρ τῆς θαλάσσης — «призывающий воду моря» (προσκαλέομαι — 呼び寄せる); ἐκχέων αὐτὸ ἐπὶ πρόσωπον τῆς γῆς — «изливающий её на лицо земли» (ἐκχέω — 注ぐ); κύριος ὁ θεὸς ὁ παντοκράτωρ ὄνομα αὐτῷ — «Господь Бог Вседержитель имя Ему»."
  7: "οὐχ ὡς υἱοὶ Αἰθιόπων ὑμεῖς ἐστέ μοι, υἱοὶ Ισραηλ — «не как сыны Ефиоплян вы для Меня, сыны Израилевы» (Αἰθίοψ — エチオピア人; риторический вопрос); οὐ τὸν Ισραηλ ἀνήγαγον ἐκ γῆς Αἰγύπτου — «не Израиля ли Я вывел из земли Египетской» (ἀνάγω — 導き出す); τοὺς ἀλλοφύλους ἐκ Καππαδοκίας — «иноплеменников из Каппадокии» (ἀλλόφυλοι — ペリシテ人; Καππαδοκία — カパドキア; в МТ/ru «из Кафтора» — не внесено); τοὺς Σύρους ἐκ βόθρου — «Сирийцев из рва (ямы)» (Σύρος — シリア人; βόθρος — 穴; в МТ/ru «из Кира» — не внесено)."
  8: "οἱ ὀφθαλμοὶ κυρίου τοῦ θεοῦ ἐπὶ τὴν βασιλείαν τῶν ἁμαρτωλῶν — «очи Господа Бога на царство грешников» (ὀφθαλμός — 目; βασιλεία — 王国; ἁμαρτωλός — 罪人); ἐξαρῶ αὐτὴν ἀπὸ προσώπου τῆς γῆς — «исторгну его с лица земли» (ἐξαίρω — 滅ぼす); πλὴν ὅτι οὐκ εἰς τέλος ἐξαρῶ τὸν οἶκον Ιακωβ — «впрочем, не до конца исторгну дом Иакова» (εἰς τέλος — 完全には; οἶκος Ιακωβ — ヤコブの家)."
  9: "ἐγὼ ἐντέλλομαι καὶ λικμιῶ ἐν πᾶσι τοῖς ἔθνεσιν τὸν οἶκον τοῦ Ισραηλ — «Я повелеваю и провею дом Израилев среди всех народов» (λικμάω — веять/просеивать, ふるいにかける; ἔθνη — 国民); ὃν τρόπον λικμᾶται ἐν τῷ λικμῷ — «как веют в решете» (λικμός — решето, ふるい); οὐ μὴ πέσῃ σύντριμμα ἐπὶ τὴν γῆν — «не упадёт сокрушение (обломок) на землю» (πίπτω — 落ちる; σύντριμμα — обломок/сокрушение, csl «сотрение»)."
  10: "ἐν ῥομφαίᾳ τελευτήσουσι πάντες ἁμαρτωλοὶ λαοῦ μου — «мечом умрут все грешники народа Моего» (ῥομφαία — 剣; τελευτάω — 死ぬ); οἱ λέγοντες Οὐ μὴ ἐγγίσῃ οὐδ' οὐ μὴ γένηται ἐφ' ἡμᾶς τὰ κακά — «говорящие: не приблизится и не придёт на нас зло» (ἐγγίζω — 近づく; γίνομαι — 臨む; κακά — 災い). Слова грешников — 「…」."
  11: "ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀναστήσω τὴν σκηνὴν Δαυιδ τὴν πεπτωκυῖαν — «в тот день восставлю скинию Давида падшую» (ἀνίστημι — 起こす; σκηνή — 幕屋; Δαυιδ — ダビデ; πίπτω — 倒れる); ἀνοικοδομήσω τὰ πεπτωκότα αὐτῆς — «отстрою падшее её» (ἀνοικοδομέω — 建て直す); τὰ κατεσκαμμένα αὐτῆς ἀναστήσω — «разрушенное её восставлю» (κατασκάπτω — 壊す, 壊された所); ἀνοικοδομήσω αὐτὴν καθὼς αἱ ἡμέραι τοῦ αἰῶνος — «отстрою её, как дни века (древние)» (αἰών — 昔). Цит. Деян 15:16."
  12: "ὅπως ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων — «чтобы взыскали оставшиеся из людей» (ἐκζητέω — 求める; κατάλοιποι — 残りの人々); πάντα τὰ ἔθνη, ἐφ' οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ' αὐτούς — «все народы, на которых призвано имя Моё» (ἐπικαλέομαι — 呼び求められる); λέγει κύριος ὁ θεὸς ὁ ποιῶν ταῦτα — «говорит Господь Бог, творящий это». В МТ/ru «чтобы овладели остатком Едома» — иное чтение; LXX/Деян 15:17 «взыщут Господа» — держимся LXX."
  13: "ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος — «вот, дни идут, говорит Господь»; καταλήμψεται ὁ ἀλοητὸς τὸν τρύγητον — «постигнет молотьба сбор винограда» (ἀλοητός — молотьба, 脱穀; καταλαμβάνω — 追いつく; τρύγητος — 取り入れ); περκάσει ἡ σταφυλὴ ἐν τῷ σπόρῳ — «созреет гроздь в посеве» (περκάζω — созревать/темнеть, 豊かな実を結ぶ; σταφυλή — гроздь; σπόρος — 種蒔き); ἀποσταλάξει τὰ ὄρη γλυκασμόν — «источат горы сладость» (ἀποστάζω — 滴らせる; γλυκασμός — 甘いぶどう酒); πάντες οἱ βουνοὶ σύμφυτοι ἔσονται — «все холмы сращёнными (засаженными) будут» (σύμφυτος — сросшийся/насаждённый; 豊かな実を結ぶ)."
  14: "ἐπιστρέψω τὴν αἰχμαλωσίαν λαοῦ μου Ισραηλ — «возвращу плен народа Моего Израиля» (ἐπιστρέφω — 帰す; αἰχμαλωσία — 捕囚); οἰκοδομήσουσιν πόλεις τὰς ἠφανισμένας καὶ κατοικήσουσιν — «построят города опустошённые и будут жить» (ἀφανίζω — 荒らす; κατοικέω — 住む); καταφυτεύσουσιν ἀμπελῶνας καὶ πίονται τὸν οἶνον αὐτῶν — «насадят виноградники и будут пить вино их» (καταφυτεύω — 植える; ἀμπελών — ぶどう畑); φυτεύσουσιν κήπους καὶ φάγονται τὸν καρπὸν αὐτῶν — «насадят сады и будут есть плод их» (κῆπος — 園; καρπός — 実)."
  15: "καταφυτεύσω αὐτοὺς ἐπὶ τῆς γῆς αὐτῶν — «насажу их на земле их» (καταφυτεύω — 植える); οὐ μὴ ἐκσπασθῶσιν οὐκέτι ἀπὸ τῆς γῆς αὐτῶν — «не будут более исторгнуты с земли их» (ἐκσπάω — 抜き取る); ἧς ἔδωκα αὐτοῖς — «которую Я дал им» (δίδωμι — 与える); λέγει κύριος ὁ θεὸς ὁ παντοκράτωρ — «говорит Господь Бог Вседержитель» (παντοκράτωρ — 全能者; в ru «Господь Бог твой» — МТ)."
