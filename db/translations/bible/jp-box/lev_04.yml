# jp-box, Левит, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: закон жертвы за грех — 贖罪祭: общий случай (1–2), помазанный
# священник (3–12), всё общество (13–21), начальник (22–26), частный человек (27–35).
# Речь Бога — 「…」 (2–35), красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (текст полный, проверено по выгрузке).
# Сноска ⟨…⟩ одна: 贖罪祭 (4:3) — первое упоминание в корпусе.
# Стихи 2, 8, 11, 13, 22, 27 обрываются по греческому (продолжение в следующем стихе),
# поэтому кончаются на 「…、」.
# jp-ni не использовался.

tr_code: jp-box
book: lev
chapter: 4
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。もし人[ひと]が、主[しゅ]の前[まえ]で、してはならない主[しゅ]の戒[いまし]めのどれか一つを思[おも]わずに行[おこな]って罪[つみ]を犯[おか]すなら、"
  3: "油[あぶら]を注[そそ]がれた大祭司[だいさいし]が、民[たみ]をも罪[つみ]に陥[おとしい]れるような罪[つみ]を犯[おか]すなら、彼[かれ]は自分[じぶん]が犯[おか]した罪[つみ]のために、傷[きず]のない子牛[こうし]を、主[しゅ]への贖罪祭[しょくざいさい]⟨罪[つみ]を償[つぐな]うために献[ささ]げる供[そな]え物[もの]。⟩として献[ささ]げなさい。"
  4: "彼[かれ]はその子牛[こうし]を、証[あかし]の幕屋[まくや]の入口[いりぐち]のそば、主[しゅ]の前[まえ]に連[つ]れて来[き]て、主[しゅ]の前[まえ]でその子牛[こうし]の頭[あたま]に手[て]を置[お]き、主[しゅ]の前[まえ]でその子牛[こうし]を屠[ほふ]りなさい。"
  5: "油[あぶら]を注[そそ]がれ、手[て]を満[み]たされた祭司[さいし]は、その子牛[こうし]の血[ち]を取[と]り、それを証[あかし]の幕屋[まくや]の内[うち]へ持[も]って入[はい]りなさい。"
  6: "祭司[さいし]は指[ゆび]をその血[ち]に浸[ひた]し、聖[せい]なる垂[た]れ幕[まく]に向[む]かって、主[しゅ]の前[まえ]に血[ち]を七回[ななかい]振[ふ]りかけなさい。"
  7: "祭司[さいし]はまた、その子牛[こうし]の血[ち]を、主[しゅ]の前[まえ]にある、証[あかし]の幕屋[まくや]の内[うち]の調[ちょう]合[ごう]香[こう]の祭壇[さいだん]の角[つの]に塗[ぬ]りなさい。そして、その子牛[こうし]の血[ち]をすべて、証[あかし]の幕屋[まくや]の入口[いりぐち]のそばにある燔祭[はんさい]の祭壇[さいだん]の基[もとい]に注[そそ]ぎ出[だ]しなさい。"
  8: "彼[かれ]は贖罪祭[しょくざいさい]の子牛[こうし]から、その脂肪[しぼう]をすべて取[と]り除[のぞ]きなさい。すなわち、内臓[ないぞう]を覆[おお]う脂肪[しぼう]と、内臓[ないぞう]の上[うえ]にあるすべての脂肪[しぼう]、"
  9: "また、二[ふた]つの腎臓[じんぞう]と、その上[うえ]の脂肪[しぼう]、すなわち腰[こし]のあたりにあるもの、および肝臓[かんぞう]の上[うえ]の部分[ぶぶん]を、腎臓[じんぞう]とともに取[と]り除[のぞ]きなさい。"
  10: "これは、酬恩祭[しゅうおんさい]の犠牲[ぎせい]の子牛[こうし]から取[と]り除[のぞ]くのと同[おな]じである。祭司[さいし]はそれを、焼[や]き尽[つ]くす捧[ささ]げ物[もの]の祭壇[さいだん]の上[うえ]で焼[や]きなさい。"
  11: "その子牛[こうし]の皮[かわ]、その肉[にく]のすべて、頭[あたま]、四[し]肢[し]、腹[はら]、汚物[おぶつ]とともに、"
  12: "その子牛[こうし]を丸[まる]ごと、宿営[しゅくえい]の外[そと]の、灰[はい]を捨[す]てる清[きよ]い場所[ばしょ]へ運[はこ]び出[だ]し、薪[たきぎ]の上[うえ]の火[ひ]で焼[や]きなさい。それは灰[はい]を捨[す]てる場所[ばしょ]で焼[や]かなければならない。"
  13: "もしイスラエルの会衆[かいしゅう]のすべてが思[おも]わず罪[つみ]を犯[おか]し、その事[こと]が会衆[かいしゅう]の目[め]から隠[かく]れて、主[しゅ]の戒[いまし]めのうち、してはならないことのどれか一つを行[おこな]って責[せめ]を負[お]うなら、"
  14: "その犯[おか]した罪[つみ]が彼[かれ]らに知[し]らされるなら、会衆[かいしゅう]は贖罪祭[しょくざいさい]として、傷[きず]のない子牛[こうし]を牛[うし]の群[む]れから献[ささ]げ、それを証[あかし]の幕屋[まくや]の入口[いりぐち]のそばに連[つ]れて来[き]なさい。"
  15: "会衆[かいしゅう]の長老[ちょうろう]たちは、主[しゅ]の前[まえ]でその子牛[こうし]の頭[あたま]に手[て]を置[お]き、主[しゅ]の前[まえ]でその子牛[こうし]を屠[ほふ]りなさい。"
  16: "油[あぶら]を注[そそ]がれた祭司[さいし]は、その子牛[こうし]の血[ち]を証[あかし]の幕屋[まくや]の内[うち]へ持[も]って入[はい]りなさい。"
  17: "祭司[さいし]は指[ゆび]をその血[ち]に浸[ひた]し、聖[せい]なる垂[た]れ幕[まく]の前[まえ]、主[しゅ]の前[まえ]に、それを七回[ななかい]振[ふ]りかけなさい。"
  18: "また、その血[ち]を、主[しゅ]の前[まえ]にある、証[あかし]の幕屋[まくや]の内[うち]の調[ちょう]合[ごう]香[こう]の祭壇[さいだん]の角[つの]に塗[ぬ]り、その血[ち]のすべてを、証[あかし]の幕屋[まくや]の入口[いりぐち]のそばにある燔祭[はんさい]の祭壇[さいだん]の基[もとい]に注[そそ]ぎ出[だ]しなさい。"
  19: "彼[かれ]はその脂肪[しぼう]をすべて取[と]り除[のぞ]き、祭壇[さいだん]の上[うえ]で焼[や]きなさい。"
  20: "その子牛[こうし]を、贖罪祭[しょくざいさい]の子牛[こうし]と同[おな]じように扱[あつか]いなさい。祭司[さいし]は彼[かれ]らのために贖[あがな]いをし、彼[かれ]らの罪[つみ]は赦[ゆる]される。"
  21: "その子牛[こうし]を丸[まる]ごと宿営[しゅくえい]の外[そと]へ運[はこ]び出[だ]し、前[まえ]の子牛[こうし]を焼[や]いたのと同[おな]じように焼[や]きなさい。これは会衆[かいしゅう]のための贖罪祭[しょくざいさい]である。"
  22: "もし指導者[しどうしゃ]が罪[つみ]を犯[おか]し、自分[じぶん]の神[かみ]であられる主[しゅ]の戒[いまし]めのうち、してはならないことのどれか一つを思[おも]わずに行[おこな]って責[せめ]を負[お]うなら、"
  23: "自分[じぶん]が犯[おか]した罪[つみ]が彼[かれ]に知[し]らされるなら、彼[かれ]は山羊[やぎ]の群[む]れから、傷[きず]のない雄[おす]の山羊[やぎ]の子[こ]を捧[ささ]げ物[もの]として献[ささ]げなさい。"
  24: "彼[かれ]はその山羊[やぎ]の子[こ]の頭[あたま]に手[て]を置[お]き、燔祭[はんさい]を屠[ほふ]る場所[ばしょ]、主[しゅ]の前[まえ]でそれを屠[ほふ]りなさい。これは贖罪祭[しょくざいさい]である。"
  25: "祭司[さいし]はその贖罪祭[しょくざいさい]の血[ち]を指[ゆび]で取[と]り、燔祭[はんさい]の祭壇[さいだん]の角[つの]に塗[ぬ]り、その血[ち]のすべてを燔祭[はんさい]の祭壇[さいだん]の基[もとい]に注[そそ]ぎ出[だ]しなさい。"
  26: "また、その脂肪[しぼう]をすべて、酬恩祭[しゅうおんさい]の犠牲[ぎせい]の脂肪[しぼう]と同[おな]じように祭壇[さいだん]の上[うえ]で焼[や]きなさい。祭司[さいし]は彼[かれ]の罪[つみ]のために贖[あがな]いをし、彼[かれ]の罪[つみ]は赦[ゆる]される。"
  27: "もし国[くに]の民[たみ]のうちの一人[ひとり]が思[おも]わず罪[つみ]を犯[おか]し、主[しゅ]の戒[いまし]めのうち、してはならないことのどれか一つを行[おこな]って責[せめ]を負[お]うなら、"
  28: "自分[じぶん]が犯[おか]した罪[つみ]が彼[かれ]に知[し]らされるなら、彼[かれ]は自分[じぶん]の罪[つみ]のために、傷[きず]のない雌[めす]の山羊[やぎ]の子[こ]を、山羊[やぎ]の群[む]れから捧[ささ]げ物[もの]として献[ささ]げなさい。"
  29: "彼[かれ]はその罪[つみ]のための贖罪祭[しょくざいさい]の頭[あたま]に手[て]を置[お]き、燔祭[はんさい]を屠[ほふ]る場所[ばしょ]で、その贖罪祭[しょくざいさい]の山羊[やぎ]の子[こ]を屠[ほふ]りなさい。"
  30: "祭司[さいし]はその血[ち]を指[ゆび]で取[と]り、燔祭[はんさい]の祭壇[さいだん]の角[つの]に塗[ぬ]り、その血[ち]のすべてを祭壇[さいだん]の基[もとい]に注[そそ]ぎ出[だ]しなさい。"
  31: "彼[かれ]はその脂肪[しぼう]をすべて、酬恩祭[しゅうおんさい]の犠牲[ぎせい]から脂肪[しぼう]を取[と]り除[のぞ]くのと同[おな]じように取[と]り除[のぞ]きなさい。祭司[さいし]はそれを祭壇[さいだん]の上[うえ]で、主[しゅ]に芳[かんば]しい香[かおり]となるものとして焼[や]きなさい。祭司[さいし]は彼[かれ]の罪[つみ]のために贖[あがな]いをし、彼[かれ]の罪[つみ]は赦[ゆる]される。"
  32: "もし彼[かれ]が贖罪祭[しょくざいさい]として羊[ひつじ]を捧[ささ]げ物[もの]として献[ささ]げるなら、傷[きず]のない雌[めす]を献[ささ]げなさい。"
  33: "彼[かれ]はその贖罪祭[しょくざいさい]の頭[あたま]に手[て]を置[お]き、燔祭[はんさい]を屠[ほふ]る場所[ばしょ]でそれを屠[ほふ]りなさい。"
  34: "祭司[さいし]はその贖罪祭[しょくざいさい]の血[ち]を指[ゆび]で取[と]り、燔祭[はんさい]の祭壇[さいだん]の角[つの]に塗[ぬ]り、その血[ち]のすべてを燔祭[はんさい]の祭壇[さいだん]の基[もとい]に注[そそ]ぎ出[だ]しなさい。"
  35: "彼[かれ]はその脂肪[しぼう]をすべて、酬恩祭[しゅうおんさい]の犠牲[ぎせい]の羊[ひつじ]から脂肪[しぼう]を取[と]り除[のぞ]くのと同[おな]じように取[と]り除[のぞ]きなさい。祭司[さいし]はそれを祭壇[さいだん]の上[うえ]、主[しゅ]への燔祭[はんさい]の上[うえ]に置[お]きなさい。祭司[さいし]は彼[かれ]が犯[おか]した罪[つみ]のために贖[あがな]いをし、彼[かれ]の罪[つみ]は赦[ゆる]される。」"

notes:
  1: "ἐλάλησεν … λέγων — «сказал, говоря»; λέγων отдельно по-японски не передаётся (как в 1:1)."
  2: "Ψυχή — «душа», здесь «человек». ἀκουσίως — невольно, по ошибке (思わず). προστάγματα — повеления, заповеди (戒め). ὧν οὐ δεῖ ποιεῖν — «которых не должно делать». Стих — придаточное, продолжение в ст. 3; поэтому кончается на 「…なら、」."
  3: "ὁ ἀρχιερεὺς ὁ κεχρισμένος — «помазанный архиерей» (χρίω — мазать, помазывать); τοῦ τὸν λαὸν ἁμαρτεῖν — «так что народ согрешает» (винительный с артиклем как обозначение цели), слав. «во еже людем согрешити», Синодальный «и сделает виновным народ». μόσχον ἐκ βοῶν — тельца из крупного скота. περὶ τῆς ἁμαρτίας — «за грех» (формула жертвы за грех)."
  4: "ἐπιθήσει τὴν χεῖρα — возложит руку. ἔναντι κυρίου трижды — «пред Господом» (повтор, как в LXX). σφάξει — заколет."
  5: "ὁ ἱερεὺς ὁ χριστὸς ὁ τετελειωμένος τὰς χεῖρας — «священник помазанный, руки которого совершены/наполнены» (τελειόω — совершать, посвящать; слав. «совершен руками»). Идиома «наполнить руки» = посвятить в священство; в корпусе она передана 手を満たす (Исх 29:9), поэтому здесь 手を満たされた. εἰσοίσει — внесёт (в скинию)."
  6: "βάψει τὸν δάκτυλον — омочит перст (指). προσρανεῖ — покропит (προσραίνω). ἑπτάκις — семь раз. κατὰ τὸ καταπέτασμα τὸ ἅγιον — «пред завесою святою» (καταπέτασμα — завеса, 垂れ幕)."
  7: "κέρατα τοῦ θυσιαστηρίου — роги жертвенника (角). θυμίαμα τῆς συνθέσεως — «фимиам состава», то есть благовонная смесь (調合香); слав. «фимиама сложения». βάσις — основание (基). ἐκχεεῖ — выльет."
  8: "ἐνδόσθια — внутренности (内臓). περιελεῖ — отделит. Стих обрывается, продолжение в ст. 9."
  9: "Ср. 3:4. В критическом издании σὺν τοῖς νεφροῖς περιελεῖ αὐτό в квадратных скобках, но в базе gr-lxx-byz есть."
  10: "ὃν τρόπον ἀφαιρεῖται — «как отделяется» (ἀφαιρέω). θυσία σωτηρίου — мирная жертва (酬恩祭). θυσιαστήριον τῆς καρπώσεως — «жертвенник сожигания»."
  11: "ἀκρωτήρια — крайние части, конечности (四肢); κόπρος — помёт, нечистота (汚物). Стих — перечень, продолжение в ст. 12."
  12: "παρεμβολή — стан (宿営). σποδιά — пепел (灰). ἐπὶ τῆς ἐκχύσεως τῆς σποδιᾶς — «на месте высыпания пепла»; καυθήσεται — «сожжён будет»."
  13: "συναγωγὴ Ισραηλ — собрание, общество Израиля (会衆). ἀγνοήσῃ — «погрешит по неведению» (ἀγνοέω). λάθῃ ῥῆμα ἐξ ὀφθαλμῶν — «утаится дело от глаз» (λανθάνω). πλημμελήσωσιν — «станут повинны» (πλημμελέω; ср. 5:15 — 愆祭); в тексте 責めを負う."
  14: "γνωσθῇ — «будет узнан» (γινώσκω). προσάξει ἡ συναγωγή — «приведёт общество» (единственное число при собирательном подлежащем). περὶ τῆς ἁμαρτίας — за грех."
  15: "πρεσβύτεροι τῆς συναγωγῆς — старейшины общества (長老). ἐπιθήσουσιν τὰς χεῖρας — возложат руки."
  16: "ὁ ἱερεὺς ὁ χριστός — помазанный священник (ср. ст. 5)."
  17: "ῥανεῖ — покропит (ῥαίνω); ἑπτάκις — семь раз; κατενώπιον — «пред лицом»."
  18: "θυσιαστήριον τῶν θυμιαμάτων τῆς συνθέσεως — жертвенник фимиамов состава (ср. ст. 7). τὸ πᾶν αἷμα — «всю кровь»."
  19: "τὸ πᾶν στέαρ — «весь тук» (ср. 3:16)."
  20: "ποιήσει … ὃν τρόπον ἐποίησεν — «сделает так, как сделал». ἐξιλάσεται — умилостивит, совершит очищение (贖う). ἀφεθήσεται — «будет прощено» (ἀφίημι)."
  21: "ἔξω τῆς παρεμβολῆς — вне стана. ἁμαρτία συναγωγῆς ἐστιν — «это жертва за грех общества» (ἁμαρτία здесь = жертва за грех)."
  22: "ὁ ἄρχων — начальник, князь (指導者); слав. «князь». τοῦ θεοῦ αὐτῶν — «Бога их» (мн. ч., хотя речь об одном начальнике, — так в LXX)."
  23: "χίμαρος ἐξ αἰγῶν, ἄρσεν ἄμωμον — козёл из коз, мужского пола, непорочный."
  24: "χίμαρος — козёл (ср. ст. 23). σφάξουσιν — заколют. ἁμαρτία ἐστίν — «это жертва за грех»."
  25: "τῷ δακτύλῳ — перстом. κέρατα — роги. βάσις — основание."
  26: "ὥσπερ τὸ στέαρ θυσίας σωτηρίου — «как тук мирной жертвы». ἐξιλάσεται … ἀφεθήσεται — ср. ст. 20."
  27: "ψυχὴ μία — «одна душа», то есть отдельный человек. ἐκ τοῦ λαοῦ τῆς γῆς — «из народа земли» (国の民). πλημμελήσῃ — ср. ст. 13."
  28: "χίμαιραν ἐξ αἰγῶν, θήλειαν ἄμωμον — козу из коз, женского пола, непорочную."
  29: "ἐπὶ τὴν κεφαλὴν τοῦ ἁμαρτήματος αὐτοῦ — «на главу греха его» (ἁμάρτημα — грех; здесь = жертва за грех). ἁμαρτία — ср. ст. 24."
  30: "λήμψεται — возьмёт. τῷ δακτύλῳ — перстом. ἐκχεεῖ — выльет."
  31: "περιαιρεῖται — «отделяется» (περιαιρέω). εἰς ὀσμὴν εὐωδίας — «в благоухание». ἐξιλάσεται … ἀφεθήσεται — ср. ст. 20."
  32: "πρόβατον … εἰς ἁμαρτίαν — «овцу в жертву за грех». θῆλυ ἄμωμον — женского пола, непорочную."
  33: "τοῦ τῆς ἁμαρτίας — «принадлежащего жертве за грех» (родительный падеж). σφάξουσιν — заколют. Слав. прибавляет «(на месте святе)»: в греч. этих слов нет (проверено: αγιω в 4:33 — НЕТ), поэтому в перевод не внесены и 〔…〕 не ставятся."
  34: "λαβών — взяв. ἐπιθήσει — возложит. ἐκχεεῖ — выльет."
  35: "περιαιρεῖται στέαρ προβάτου — «как отделяется тук овцы». ἐπὶ τὸ ὁλοκαύτωμα κυρίου — «на всесожжение Господне». ἐξιλάσεται … ἀφεθήσεται — ср. ст. 26, 31."
