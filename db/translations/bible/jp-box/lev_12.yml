# jp-box, Левит, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник.
# jp-joc в Левите почти отсутствует: в этой главе есть только ст. 3, 4, 6, 8 (文語);
# используется лишь для сверки смысла, не как образец стиля.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: очищение родильницы после сына (2–4) и после дочери (5);
# жертва по окончании очищения (6–7); замена агнца для бедной (8).
# Красного и синего нет. Речь Бога — 「…」 (2–8).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 割礼, 燔祭, 贖罪祭, 山鳩, 家鳩 уже в корпусе или понятны.
# LXX 12:2–8 по смыслу совпадает с масоретским; 12:4 — «33 дня»,
# 12:5 — «дважды семь (14) и 66 дней», как в евр.
# jp-ni не использовался.

