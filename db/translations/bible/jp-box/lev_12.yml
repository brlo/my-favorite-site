verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。女[おんな]が身[み]ごもって男[おとこ]の子[こ]を産[う]んだなら、七日[なぬか]の間[あいだ]汚[けが]れた者[もの]となる。生理[せいり]の汚[けが]れの日々[ひび]と同[おな]じように、彼女[かのじょ]は汚[けが]れた者[もの]となる。"
  3: "八日目[ようかめ]に、その子[こ]の包皮[ほうひ]の肉[にく]に割礼[かつれい]を施[ほどこ]しなさい。"
  4: "そして、彼女[かのじょ]は三十三日[さんじゅうさんにち]の間[あいだ]、自分[じぶん]の汚[けが]れた血[ち]のうちにとどまる。聖[せい]なるものには何[なに]も触[ふ]れてはならず、聖所[せいしょ]に入[はい]ってもならない。自分[じぶん]の清[きよ]めの日々[ひび]が満[み]ちるまでである。"
  5: "もし女[おんな]の子[こ]を産[う]んだなら、彼女[かのじょ]は二週間[にしゅうかん]、生理[せいり]の汚[けが]れに従[したが]って汚[けが]れた者[もの]となる。そして六十六日[ろくじゅうろくにち]の間[あいだ]、自分[じぶん]の汚[けが]れた血[ち]のうちにとどまる。"
  6: "自分[じぶん]の清[きよ]めの日々[ひび]が、男[おとこ]の子[こ]のためであれ女[おんな]の子[こ]のためであれ満[み]ちたなら、彼女[かのじょ]は一歳[いっさい]の傷[きず]のない小羊[こひつじ]を燔祭[はんさい]として、また家鳩[いえばと]の雛[ひな]か山鳩[やまばと]を贖罪祭[しょくざいさい]として、証[あかし]の幕屋[まくや]の入口[いりぐち]にいる祭司[さいし]のところへ持[も]って来[き]る。"
  7: "祭司[さいし]はそれを主[しゅ]の前[まえ]に献[ささ]げ、彼女[かのじょ]のために贖[あがな]いをして、彼女[かのじょ]をその血[ち]の源[みなもと]から清[きよ]める。これが、男[おとこ]の子[こ]または女[おんな]の子[こ]を産[う]む者[もの]についての律法[りっぽう]である。"
  8: "もし彼女[かのじょ]の手[て]が小羊[こひつじ]に届[とど]かないなら、彼女[かのじょ]は山鳩[やまばと]二羽[にはわ]か家鳩[いえばと]の雛[ひな]二羽[にはわ]を取[と]る。一羽[いちわ]を燔祭[はんさい]に、もう一羽[いちわ]を贖罪祭[しょくざいさい]に用[もち]いる。祭司[さいし]は彼女[かのじょ]のために贖[あがな]いをし、彼女[かのじょ]は清[きよ]くなる。」"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — Господь сказал Моисею, говоря."
  2: "σπερματισθῇ — зачнёт (σπερματίζω, букв. «принять семя»). τέκῃ ἄρσεν — родит мужского пола. ἀφέδρος — месячное истечение (生理); χωρισμός — отделение. κατὰ τὰς ἡμέρας τοῦ χωρισμοῦ τῆς ἀφέδρου αὐτῆς — по дням отделения её истечения."
  3: "περιτεμεῖ — обрежет (περιτέμνω, будущее). σὰρξ τῆς ἀκροβυστίας — плоть крайней плоти (包皮の肉). ἀκροβυστία — крайняя плоть."
  4: "καθήσεται — будет сидеть, оставаться (κάθημαι). ἐν αἵματι ἀκαθάρτῳ — в нечистой крови. ἁγιαστήριον — святилище (聖所). ἡμέραι καθάρσεως — дни очищения."
  5: "δὶς ἑπτά — дважды семь, 14 дней (二週間). ἑξήκοντα… ἓξ — 66. κατὰ τὴν ἄφεδρον — по истечению."
  6: "ἀμνὸς ἐνιαύσιος ἄμωμος — годовалый непорочный агнец. νεοσσὸς περιστερᾶς — птенец голубя (家鳩の雛). τρυγών — горлица (山鳩). εἰς ὁλοκαύτωμα — во всесожжение. περὶ ἁμαρτίας — за грех. πρὸς τὸν ἱερέα — к священнику."
  7: "ἐξιλάσεται περὶ αὐτῆς — совершит умилостивление за неё. καθαριεῖ — очистит. πηγὴ τοῦ αἵματος — источник крови (血の源). τίκτουσα — рожающая."
  8: "μὴ εὑρίσκῃ ἡ χεὶρ αὐτῆς τὸ ἱκανόν — рука её не находит достаточного (идиома: не по средствам; 手が届かない). εἰς ἀμνόν — на агнца. δύο τρυγόνας ἢ δύο νεοσσούς — двух горлиц или двух птенцов. μίαν… καὶ μίαν — одну… и одну."
