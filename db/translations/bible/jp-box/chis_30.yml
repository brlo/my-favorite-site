# jp-box, Числа, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30 — закон об обетах: обет мужчины (3), обет девушки в доме отца (4–6),
# обет вышедшей замуж (7–9), обет вдовы и разведённой (10), обет жены в доме
# мужа и право мужа утвердить или отменить его (11–16), итог (17).
# Речь: 1 — рассказ; 2 — речь Моисея 「…」, внутри неё слова Господа 『…』
# (3–16); 17 — рассказ-итог. Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 誓願, 誓い, 寡, 離縁 уже в корпусе или понятны по контексту.
# Нумерация: держимся gr-lxx-byz (17 стихов). В печатных слав. и Синодальном
# гл. 30 имеет 16 стихов, а их 29:40 = наш 30:1, их 30:1 = наш 30:2 и т.д.
# В базе тексты уже перенумерованы по LXX, поэтому выгрузка совпадает стих
# в стих; расхождение отмечено в notes.
# LXX: 30:11 «с клятвою» (μεθ᾿ ὅρκου); 30:14 «узы, чтобы смирить душу»
# (δεσμοῦ κακῶσαι ψυχήν); 30:17 «в доме отца» без «её».
# jp-ni не использовался.

