verses:
  1: "モーセは、主[しゅ]が彼[かれ]に命[めい]じられたすべてのことを、イスラエルの子[こ]らに語[かた]った。"
  2: "モーセはイスラエルの部族[ぶぞく]の長[ちょう]たちに語[かた]って言[い]った。「主[しゅ]が命[めい]じられた言葉[ことば]は次[つぎ]のとおりである。『"
  3: "人[ひと]はだれでも、主[しゅ]に誓願[せいがん]を立[た]て、または誓[ちか]いをし、または自分[じぶん]の身[み]を束縛[そくばく]する定[さだ]めを定[さだ]めるなら、その言葉[ことば]を汚[けが]してはならない。その口[くち]から出[で]たすべてのことを行[おこな]わなければならない。"
  4: "もし女[おんな]が、父[ちち]の家[いえ]で、自分[じぶん]の若[わか]いとき、主[しゅ]に誓願[せいがん]を立て、または定[さだ]めを定めるなら、"
  5: "その父が彼女[かのじょ]の誓願と、彼女が自分について定めた定めを聞き、父が彼女に黙[だま]っているなら、彼女の誓願はすべて成[な]り立[た]ち、彼女が自分について定めた定めもすべて彼女のために有効[ゆうこう]である。"
  6: "しかし、父が聞いた日[ひ]に、彼女の誓願と、彼女が自分について定めた定めをすべて拒[こば]むなら、それらは成り立たない。主[しゅ]は彼女を清[きよ]める。父がそれを拒んだからである。"
  7: "もし彼女が結婚して妻[つま]となり、その誓願が彼女の上[うえ]にあり、自分の唇[くちびる]で言[い]い表[あらわ]したとおりに自分の身について定めたなら、"
  8: "夫[おっと]がそれを聞いた日に黙っているなら、彼女の誓願はすべて成り立ち、彼女が自分の身について定めた定めも成り立つ。"
  9: "しかし、夫が聞いた日にそれを拒むなら、彼女の誓願も、自分について定めた定めも、すべて効力[こうりょく]を失[うしな]う。夫が彼女を拒んだからである。主[しゅ]は彼女を清める。"
  10: "寡婦[かふ]と離縁[りえん]された女[おんな]の誓願は、自分について立てたものは何でも、彼女のためにそのまま有効である。"
  11: "しかし、彼女が夫の家[いえ]で誓[ちか]いを伴[ともな]う誓願[せいがん]を立て、または自分の身について定めを定めるなら、"
  12: "夫がそれを聞いて彼女に黙り、拒まないなら、彼女の誓願はすべて成り立ち、自分について定めた定めもすべて彼女に対して効力を持つ。"
  13: "しかし、夫が聞いた日にそれを取[と]り消[け]すなら、彼女の唇から出たすべてのもの、すなわちその誓願と、自分の身についての定めは、彼女のために効力を持たない。夫がそれを取り消したからである。主[しゅ]は彼女を清める。"
  14: "すべての誓願と、身を苦[くる]しめるための束縛[そくばく]の誓[ちか]いは、夫がそれを彼女のために確定[かくてい]し、また夫がそれを取り消すことができる。"
  15: "しかし、夫が日[ひ]から日へと彼女に黙っているなら、彼女の誓願をすべて彼女のために成り立たせたのであり、彼女の上にある定めも彼女のために成り立たせたのである。聞いた日に彼女に黙っていたからである。"
  16: "しかし、聞いた日[ひ]の後[あと]になって彼女の誓願を取り消すなら、彼は自分[じぶん]の罪[つみ]を負[お]う。』」"
  17: "これらは、主[しゅ]がモーセに命[めい]じられた定[さだ]めである。夫[おっと]とその妻[つま]、また父[ちち]と、父の家[いえ]にいる若[わか]い娘[むすめ]との間[あいだ]についての定めである。"

notes:
  1: "κατὰ πάντα, ὅσα ἐνετείλατο κύριος τῷ Μωυσῇ — всё, что повелел Господь Моисею (κατά — «сообразно», ἐντέλλομαι — «заповедать»). В печатных слав. и Синодальном это 29:40: LXX начинает гл. 30 с этого стиха (сдвиг нумерации); в базе текст перенумерован по gr-lxx-byz."
  2: "τοὺς ἄρχοντας τῶν φυλῶν — начальников колен. ῥῆμα — слово, дело. συνέταξεν — повелел, установил (συντάσσω). Далее до ст. 16 — речь Господа, переданная Моисеем: в тексте она оформлена вложенной цитатой 『…』. В печатных слав./Синодальном это 30:1 (наш 30:2)."
  3: "ἄνθρωπος ἄνθρωπος — «человек человек», усилительное повторение (слав. «человек человек»), т.е. всякий человек. εὔξηται εὐχήν — даст обет (cognate accusative). ὀμόσῃ ὅρκον — поклянётся клятвою. ὁρίσηται ὁρισμῷ — положит зарок (ὁρίζω — «определять, назначать предел»; ὁρισμός — «определение, зарок»). κατὰ τῆς ψυχῆς αὐτοῦ — на душу свою, т.е. на себя самого (слав. «о души своей»). οὐ βεβηλώσει τὸ ῥῆμα — не осквернит слова (βεβηλόω), т.е. не нарушит."
  4: "ἐν τῷ οἴκῳ τοῦ πατρὸς αὐτῆς ἐν τῇ νεότητι αὐτῆς — в доме отца своего в юности своей. Речь о девушке, ещё не вышедшей замуж; ср. ст. 17."
  5: "παρασιωπήσῃ — промолчит (παρασιωπάω), т.е. не запретит. στήσονται — состоятся, будут действительны (ἵστημι в знач. «утверждать»). μενοῦσιν αὐτῇ — пребудут ей, останутся за ней (μένω)."
  6: "ἀνανεύων ἀνανεύσῃ — «отказом откажет» (ἀνανεύω — «отрицать, отклонять», букв. «кивать назад»). ᾗ ἂν ἡμέρᾳ ἀκούσῃ — в тот день, когда услышит. οὐ στήσονται — не состоятся. καθαριεῖ — очистит (καθαρίζω), здесь в смысле «простит» (слав. «очистит», Синодальный «простит»)."
  7: "γενομένη γένηται ἀνδρὶ — «сделавшись, сделается мужу», т.е. выйдет замуж (γίνομαι + датив). αἱ εὐχαὶ αὐτῆς ἐπ᾿ αὐτῇ — обеты её на ней. κατὰ τὴν διαστολὴν τῶν χειλέων — по определению/различению уст (διαστολή, букв. «разделение, различение»; слав. «по определении уст»), т.е. по изречённому."
  8: "παρασιωπήσῃ αὐτῇ — промолчит ей (датив). οὕτως — так, при этом условии. στήσονται — состоятся (в стихе дважды)."
  9: "ἀνανεύσῃ — откажет (ср. ст. 6). οὐ μενοῦσιν — не пребудут. ὁ ἀνὴρ ἀνένευσεν ἀπ᾿ αὐτῆς — муж отказал от неё, т.е. аннулировал обет. καθαριεῖ — очистит."
  10: "χήρα — вдова (寡婦[かふ]); ἐκβεβλημένη — отвергнутая, разведённая (ἐκβάλλω; 離縁). ὅσα ἂν εὔξηται κατὰ τῆς ψυχῆς αὐτῆς — что бы ни дала обетом на душу свою. μενοῦσιν αὐτῇ — пребудут ей, т.е. обязательны для неё."
  11: "ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς — в доме мужа своего. μεθ᾿ ὅρκου — с клятвою (ὅρκος), т.е. обет, подкреплённый клятвой; в масоретском тексте — «или связала душу свою узами»."
  12: "καὶ μὴ ἀνανεύσῃ αὐτῇ — и не откажет ей. στήσονται κατ᾿ αὐτῆς — состоятся на неё, т.е. будут обязательны для неё (слав. «да состоятся на ню»)."
  13: "περιελὼν περιέλῃ — «отняв отнимет» (περιαιρέω — «отнимать, уничтожать»). πάντα, ὅσα ἐὰν ἐξέλθῃ ἐκ τῶν χειλέων αὐτῆς — всё, что выйдет из уст её. οὐ μενεῖ αὐτῇ — не пребудет ей. περιεῖλεν — отнял, уничтожил."
  14: "πᾶσα εὐχὴ καὶ πᾶς ὅρκος δεσμοῦ — всякий обет и всякая клятва уза (δεσμός). κακῶσαι ψυχήν — чтобы смирить/изнурить душу (κακόω), т.е. обет поста и самоограничения. ὁ ἀνὴρ αὐτῆς στήσει αὐτῇ — муж её утвердит ей; καὶ... περιελεῖ — и отнимет, т.е. может утвердить или отменить."
  15: "σιωπῶν παρασιωπήσῃ — «молчанием промолчит». ἡμέραν ἐξ ἡμέρας — день ото дня, изо дня в день. στήσει αὐτῇ — утвердит ей (futurum от ἵστημι). ἐσιώπησεν — промолчал."
  16: "περιελὼν περιέλῃ — отнимет (ср. ст. 13). μετὰ τὴν ἡμέραν, ἣν ἤκουσεν — после дня, в который услышал. λήμψεται τὴν ἁμαρτίαν αὐτοῦ — примет грех свой, т.е. понесёт ответственность (слав. «приимет грех свой»). Здесь закрываются и слова Господа 『』, и речь Моисея 「」."
  17: "δικαιώματα — уставы, оправдания (δικαίωμα; слав. «оправдания»). ἀνὰ μέσον ἀνδρὸς καὶ γυναικὸς αὐτοῦ — между мужем и женою его. πατρὸς καὶ θυγατρός — отца и дочери. ἐν νεότητι ἐν οἴκῳ πατρός — в юности, в доме отца (без «её» в греч. — эллипсис)."
