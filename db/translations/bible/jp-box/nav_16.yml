# jp-box, Иисус Навин, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: удел сынов Иосифа (1–4), граница Ефрема (5–9), хананеи в Газере (10).
# Речи нет, красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz; славянские добавления (16:3 «даже до
# газера», 16:7 «в наарафа») не внесены.
# Сносок ⟨…⟩ нет: 嗣業, 部族, 氏族 уже в корпусе.
# Отличия LXX: 16:1 Βαιθηλ Λουζα — два имени подряд (слав. «в вефиль», ru «к горе
# Вефильской»); 16:5 Γαζαρα и 16:10 Γαζερ — один город (Гезар), поэтому везде ガザラ;
# 16:10 во второй половине стиха в гр. и слав. есть рассказ о фараоне, которого
# в ru нет (ru обрывает стих на дани).
# jp-ni не использовался.

tr_code: jp-box
book: nav
chapter: 16
draft: true

verses:
  1: "ヨセフの子[こ]らの境界[きょうかい]は、東[ひがし]の側[がわ]では、エリコに面[めん]したヨルダン川[がわ]から始[はじ]まった。それはエリコから山地[さんち]の荒野[こうや]へ上[のぼ]り、ベテル・ルザに至[いた]る。"
  2: "境界[きょうかい]はベテルから出[で]て、ハタロティの境[さかい]を過[す]ぎる。"
  3: "そして海[うみ]へ下[くだ]り、アプタリムの境[さかい]に及び、下[しも]のベテ・ホロンの境に至[いた]る。その果[は]ては海である。"
  4: "ヨセフの子[こ]ら、エフライムとマナセは嗣業[しぎょう]として受[う]け継[つ]いだ。"
  5: "エフライムの子[こ]らの境界[きょうかい]は、その氏族[しぞく]ごとに次[つぎ]のとおりであった。彼[かれ]らの嗣業[しぎょう]の境[さかい]は、東[ひがし]のアタロトとエロクから、上[かみ]のベテ・ホロンとガザラに及[およ]んだ。"
  6: "境界[きょうかい]は海[うみ]へ向[む]かって進[すす]み、北[きた]のフェルマからイカスモンに及[およ]ぶ。そして東[ひがし]へ巡[めぐ]ってフェナサとセレサに至[いた]り、東からイアノカへと過[す]ぎる。"
  7: "またマホとアタロト、およびそれらの村々[むらむら]に及[およ]び、エリコに至[いた]って、ヨルダン川[がわ]へと出[で]る。"
  8: "境界[きょうかい]はタフから海[うみ]へ向[む]かって進[すす]み、ヘルカナに至[いた]る。その果[は]ては海である。これがエフライムの部族[ぶぞく]の嗣業[しぎょう]、その氏族[しぞく]ごとのものである。"
  9: "また、エフライムの子[こ]らに分[わ]けられた町々[まちまち]が、マナセの子らの嗣業[しぎょう]の真[ま]ん中[なか]にあった。それはすべて、町とその村々[むらむら]である。"
  10: "しかしエフライムは、ガザラに住[す]むカナン人[じん]を滅[ほろ]ぼさなかった。そこでカナン人はエフライムの間[あいだ]に、今日[きょう]まで住んでいた。やがてエジプトの王[おう]ファラオが上[のぼ]って来[き]て、その町[まち]を取[と]り、火[ひ]で焼[や]き払[はら]い、カナン人とペリジ人、およびガザラに住む者[もの]たちを刺[さ]し殺[ころ]した。そしてファラオはその町を、自分[じぶん]の娘[むすめ]に持[も]ち物[もの]として与[あた]えた。"

notes:
  1: "ἐγένετο τὰ ὅρια — «стали пределы» (γίνομαι). ἀπὸ τοῦ Ιορδάνου τοῦ κατὰ Ιεριχω ἀπ᾿ ἀνατολῶν — «от Иордана, что при Иерихоне, от востока». ὀρεινὴ ἡ ἔρημος — «горная пустыня». Βαιθηλ Λουζα — два имени подряд: Вефиль, он же Луз (слав. «в вефиль», ru «к горе Вефильской»)."
  2: "Χαταρωθι — Хатароти (слав. «ахиатароф»). ἐξελεύσεται — «выйдет» (ἐξέρχομαι), παρελεύσεται — «пройдёт мимо» (παρέρχομαι)."
  3: "διελεύσεται ἐπὶ τὴν θάλασσαν — «пройдёт к морю». Απταλιμ — Апталим (ru «Иафлет»). Βαιθωρων ἡ κάτω — нижний Беф-Орон (ベテ・ホロン). διέξοδος — «выход», конец границы. Слав. добавляет «даже до газера», в этом стихе гр. нет."
  4: "ἐκληρονόμησαν — «получили в удел» (κληρονομέω); в корпусе 嗣業として受け継ぐ. Порядок имён в гр. «Ефрем и Манассия» (в ru наоборот)."
  5: "κατὰ δήμους — по родам (氏族ごと). Αταρωθ καὶ Εροκ — Атарот и Ерок (ru «Атароф-Адар»). Βαιθωρων ἡ ἄνω — верхний Беф-Орон. Γαζαρα — тот же город, что Γαζερ в ст. 10, поэтому и здесь ガザラ."
  6: "Ικασμων — Икасмон (слав. «махфоф», ru «Михмефаф»). Θερμα — Ферма (у слав. опущено). Θηνασα καὶ Σελλησα — Фенаса и Селеса (ru «Фаанаф-Силома»). Ιανωκα — Ианока."
  7: "Μαχω — Махо; Αταρωθ — Атарот (ср. ст. 5). Слав. и ru добавляют «Наараф», в гр. только Махо и Атарот. διεκβαλεῖ — «выйдет, достигнет» (διεκβάλλω)."
  8: "Ταφου — Таф (ru «Таппуах»). Χελκανα — Хелкана; слав. «водотечь кана» понимает как поток Кана, в гр. стоит имя места."
  9: "αἱ πόλεις αἱ ἀφορισθεῖσαι — «города отделённые» (ἀφορίζω). Речь о ефремовых городах внутри удела Манассии."
  10: "οὐκ ἀπώλεσεν — «не погубил» (ἀπόλλυμι). Γαζερ — Газер (ガザラ, ср. ст. 5). ἐξεκέντησαν — «пронзили» (ἐκκεντέω). ἐν φερνῇ — «в приданое» (φερνή). Вторая половина стиха (фараон) есть в гр. и слав., но отсутствует в ru."
