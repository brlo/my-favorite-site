# Голоса: 1–2 — авторский текст; 3 — 「…」 (речь посланных); 4–5 — авторский текст;
# 6 — вводная формула; 7–10 — 「…」 (слово Господа; в 9 слова народа — 『…』);
# 11–16 — авторский текст; 17 — 「…」 (вопрос царя) и 「…」 (ответ пророка); 18–20 — 「…»
# (речь пророка; в 19 слова лжепророков — 『…』); 21 — авторский текст.
# Нумерация по gr: 21 стих, совпадает со слав. 37:1–21 и ru. «Точек» в главе нет:
# ст. 10, 11, 15 в gr-lxx-byz полные, ст. 22 в главе отсутствует (всего 21 стих);
# «точки» 37:10,11,15,22 относятся к gr 37 = слав. 30, другой главе.
# 〔…〕 нет. Слав. расхождения и добавления внесены без скобок: 1 «вместо иехонии
# сына иоакимова» (LXX «вместо Иоакима»), 3 «Богу нашему», 20 «молютися».
# Сносок ⟨…⟩ нет: 牢, 穴, 泥, 縄, パン, 祭司, 断食 уже в корпусе.
