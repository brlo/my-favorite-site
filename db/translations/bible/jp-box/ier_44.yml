verses:
  1: "ヨシヤの子[こ]ゼデキヤは、ヨヤキムの子[こ]エホヤキンの代[か]わりに王[おう]となった。ネブカドネツァルが彼をユダの王[おう]としたのである。"
  2: "しかし、彼も、そのしもべたちも、この地[ち]の民[たみ]も、主[しゅ]がエレミヤの手[て]によって語[かた]った主の言葉[ことば]に聞[き]き従[したが]わなかった。"
  3: "ゼデキヤ王[おう]は、シェレミヤの子[こ]ヨアハルと、マアセヤの子[こ]である祭司[さいし]ゼパニヤをエレミヤのもとへ遣[つか]わして言[い]った。「どうか、わたしたちのために、わたしたちの神[かみ]である主[しゅ]に祈[いの]ってほしい。」"
  4: "エレミヤはそのころ、なお自由[じゆう]に町[まち]の中[なか]を歩[あゆ]いていた。人[ひと]々[びと]が彼を牢[ろう]に入[い]れなかったからである。"
  5: "ファラオの軍[ぐん]勢[ぜい]がエジプトから出[で]て来[き]た。カルデア人[じん]はその知[し]らせを聞[き]くと、エルサレムから退[しりぞ]いた。"
  6: "主[しゅ]の言葉[ことば]がエレミヤに臨[のぞ]んで言[い]った。"
  7: "イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。「あなたがたを遣[つか]わしてわたしに尋[たず]ねさせたユダの王[おう]に、こう告[つ]げよ。見[み]よ、あなたがたを助[たす]けるために出[で]て来[き]たファラオの軍[ぐん]勢[ぜい]は、エジプトの地[ち]へ引[ひ]き返[かえ]す。"
  8: "カルデア人[じん]自身も戻[もど]って来[き]てこの都[みやこ]を攻[せ]め、これを取[と]って火[ひ]で焼[や]く。"
  9: "主[しゅ]はこう言[い]われる。『カルデア人[じん]はわたしたちから去[さ]って行[い]く』と言[い]って、自分[じぶん]の魂[たましい]を欺[あざむ]いてはならない。彼らは去[さ]らないからである。"
  10: "たとえあなたがたが、自分[じぶん]たちと戦[たたか]うカルデア人[じん]の全[ぜん]軍[ぐん]勢[ぜい]を打[う]ち破[やぶ]り、そのうちの幾人[いくにん]かが、それぞれ自分[じぶん]の場所[ばしょ]で傷[きず]ついたまま残[のこ]ったとしても、彼らは起[お]き上[あ]がってこの都[みやこ]を火[ひ]で焼[や]くであろう。」"
  11: "カルデア人[じん]の軍[ぐん]勢[ぜい]が、ファラオの軍勢[ぐんせい]のゆえにエルサレムから退[しりぞ]いたとき、"
  12: "エレミヤは、民[たみ]の間[あいだ]に混[ま]じってそこで何[なに]かを買[か]うために、エルサレムを出[で]てベニヤミンの地[ち]へ向[む]かった。"
  13: "彼がベニヤミンの門[もん]にいたとき、そこに、彼が滞在[たいざい]していた家[いえ]の者[もの]、すなわちアナニヤの子[こ]シェレミヤの子[こ]サルヤがいて、エレミヤを捕[つか]まえて言[い]った。「あなたはカルデア人[じん]のもとへ逃[に]げるのか。」"
  14: "エレミヤは言[い]った。「偽[いつわ]りだ。わたしはカルデア人[じん]のもとへ逃[に]げるのではない。」しかし、サルヤは彼の言[い]うことを聞[き]かず、エレミヤを捕[つか]まえて君[きみ]たちのところへ連[つ]れて行[い]った。"
  15: "君[きみ]たちはエレミヤに怒[いか]り、彼を打[う]ちたたき、書記[しょき]ヨナタンの家[いえ]に送[おく]った。人[ひと]々[びと]がそこを牢[ろう]としたからである。"
  16: "エレミヤは穴[あな]の家[いえ]、すなわち地下[ちか]の倉[くら]に入[はい]り、そこに多[おお]くの日[ひ]を過[す]ごした。"
  17: "ゼデキヤ王[おう]は人[ひと]を遣[つか]わして彼を呼[よ]び寄[よ]せた。王[おう]は彼に密[ひそ]かに尋[たず]ねて言[い]った。「主[しゅ]からの言葉[ことば]はあるか。」エレミヤは言った。「ある。あなたはバビロンの王[おう]の手[て]に渡[わた]される。」"
  18: "エレミヤは王[おう]に言[い]った。「わたしがあなたに、またあなたのしもべたちに、またこの民[たみ]に、どんな罪[つみ]を犯[おか]したというので、あなたがたはわたしを牢[ろう]に入[い]れるのか。"
  19: "あなたがたの預言者[よげんしゃ]たちはどこにいるのか。彼らはあなたがたに、『バビロンの王[おう]はあなたがたとこの地[ち]に来[こ]ない』と預言[よげん]していたではないか。"
  20: "いま、わが主[しゅ]である王[おう]よ、どうか、わたしの願[ねが]いがあなたの前[まえ]に届[とど]くようにしてほしい。わたしを書記[しょき]ヨナタンの家[いえ]へ送[おく]り返[かえ]さないでほしい。そこで死[し]にたくないのだ。」"
  21: "そこでゼデキヤ王[おう]は命[めい]じて、エレミヤを牢[ろう]の庭[にわ]に入[い]れさせ、パン焼[や]き人[びと]の通[とお]りから毎日[まいにち]パン一[ひと]切[き]れを彼に与[あた]えさせた。都[みやこ]のパンが尽[つ]きるまで、そうされた。エレミヤは牢の庭[にわ]にとどまった。"

notes:
  1: "καὶ ἐβασίλευσεν Σεδεκιας υἱὸς Ιωσια ἀντὶ Ιωακιμ — «и воцарился Седекия, сын Иосии, вместо Иоакима» (LXX); слав. читает «вместо иехонии сына иоакимова» (по МТ) — в тексте по csl (エホヤキン), LXX отмечен здесь; ὃν ἐβασίλευσεν Ναβουχοδονοσορ — «которого поставил царём Навуходоносор»."
  2: "οὐκ ἤκουσεν αὐτὸς καὶ οἱ παῖδες αὐτοῦ καὶ ὁ λαὸς τῆς γῆς — «не послушал он, и отроки его, и народ земли»; τοὺς λόγους κυρίου, οὓς ἐλάλησεν ἐν χειρὶ Ιερεμιου — «слова Господни, которые Он говорил рукою Иеремии» (ἐν χειρί — через). Слав. «словес Господних, яже глагола рукою иеремииною»."
  3: "ἀπέστειλεν... τὸν Ιωαχαλ υἱὸν Σελεμιου καὶ τὸν Σοφονιαν υἱὸν Μαασαιου τὸν ἱερέα — «послал... Иоахала, сына Селемии, и Софонию, сына Маасеи, священника» (ヨアハル — новое имя, в LXX Ιωαχαλ, евр. Иегухал; ゼパニヤ, マアセヤ); Πρόσευξαι δὴ περὶ ἡμῶν πρὸς κύριον — «помолись же о нас ко Господу» (δή — усиление); слав. добавляет «Богу нашему» — нет в LXX, внесено (わたしたちの神である)."
  4: "καὶ Ιερεμιας ἦλθεν καὶ διῆλθεν διὰ μέσου τῆς πόλεως — «Иеремия приходил и проходил среди города»; οὐκ ἔδωκαν αὐτὸν εἰς οἶκον τῆς φυλακῆς — «не отдали (не ввели) его в дом темницы». Слав. «иеремиа же свободен прихождаше и прохождаше среде града»."
  5: "δύναμις Φαραω ἐξῆλθεν ἐξ Αἰγύπτου — «сила (войско) фараона вышла из Египта»; ἤκουσαν οἱ Χαλδαῖοι τὴν ἀκοὴν αὐτῶν — «услышали Халдеи слух (весть) их»; ἀνέβησαν ἀπὸ Ιερουσαλημ — «поднялись (ушли) от Иерусалима». Слав. «слышавше халдее облегшии Иерусалим слух их, отступиша»."
  6: "ἐγένετο λόγος κυρίου πρὸς Ιερεμιαν λέγων — вводная формула вне кавычек."
  7: "Οὕτως ἐρεῖς πρὸς βασιλέα Ιουδα τὸν ἀποστείλαντα πρὸς σὲ τοῦ ἐκζητῆσαί με — «так скажи царю Иудину, пославшему к тебе вопросить Меня» (ἐκζητέω — искать, вопрошать); ἰδοὺ δύναμις Φαραω ἡ ἐξελθοῦσα ὑμῖν εἰς βοήθειαν — «вот, сила фараона, вышедшая вам на помощь» (βοήθεια — помощь); ἀποστρέψουσιν εἰς γῆν Αἰγύπτου — «возвратятся в землю Египетскую»."
  8: "ἀναστρέψουσιν αὐτοὶ οἱ Χαλδαῖοι — «возвратятся сами Халдеи»; πολεμήσουσιν ἐπὶ τὴν πόλιν ταύτην; συλλήμψονται αὐτὴν καὶ καύσουσιν ἐν πυρί — «возьмут её и сожгут огнём»."
  9: "Μὴ ὑπολάβητε ταῖς ψυχαῖς ὑμῶν — «не подумайте (не обольщайте) в душах ваших» (ὑπολαμβάνω — думать, предполагать); Ἀποτρέχοντες ἀπελεύσονται ἀφ' ἡμῶν οἱ Χαλδαῖοι — «отбегая отбегут от нас Халдеи» (усиление); ὅτι οὐ μὴ ἀπέλθωσιν — «ибо не отойдут». Слова народа — 『…』."
  10: "ἐὰν πατάξητε πᾶσαν δύναμιν τῶν Χαλδαίων — «если поразите всю силу Халдеев» (πατάσσω); καταλειφθῶσίν τινες ἐκκεκεντημένοι — «останутся некоторые пронзённые» (καταλείπω — оставлять; κεντέω — колоть, пронзать); ἕκαστος ἐν τῷ τόπῳ αὐτοῦ — «каждый на месте своём» (ru: «из палатки своей»); ἀναστήσονται καὶ καύσουσιν — «встанут и сожгут». Здесь слово Господа закрывается. В gr-lxx-byz стих полный, лакуны модуля здесь нет («точки» 37:10,11 относятся к gr 37 = слав. 30, другой главе)."
  11: "ἀνέβη ἡ δύναμις τῶν Χαλδαίων ἀπὸ Ιερουσαλημ ἀπὸ προσώπου τῆς δυνάμεως Φαραω — «поднялась сила Халдейская от Иерусалима от лица силы фараона» (ἀπὸ προσώπου — из-за, от). Слав. «взыде сила халдейска от Иерусалима, от лица силы фараони»."
  12: "ἐξῆλθεν Ιερεμιας... τοῦ πορευθῆναι εἰς γῆν Βενιαμιν — «вышел Иеремия, чтобы идти в землю Вениамина»; τοῦ ἀγορᾶσαι ἐκεῖθεν ἐν μέσῳ τοῦ λαοῦ — тёмное место: «купить оттуда среди народа» (ἀγοράζω — покупать); ru (МТ) «скрываясь оттуда среди народа» — иное понимание, в текст не внесено."
  13: "ἐν πύλῃ Βενιαμιν — «в воротах Вениамина»; παρ' ᾧ κατέλυεν — «у которого он останавливался» (καταλύω — останавливаться, ночевать); Σαρουιας υἱὸς Σελεμιου υἱοῦ Ανανιου — «Саруия, сын Селемии, сына Анании» (サルヤ; ru/МТ «Иреия»); συνέλαβεν — «схватил» (συλλαμβάνω); Πρὸς τοὺς Χαλδαίους σὺ φεύγεις — «к Халдеям ты убегаешь»."
  14: "Ψεῦδος — «ложь»; οὐκ εἰς τοὺς Χαλδαίους ἐγὼ φεύγω — «не к Халдеям я убегаю»; οὐκ ἤκουσεν αὐτοῦ — «не послушал его»; εἰσήγαγεν αὐτὸν πρὸς τοὺς ἄρχοντας — «привёл его к князьям» (君たち)."
  15: "ἐπικράνθησαν οἱ ἄρχοντες ἐπὶ Ιερεμιαν — «разгневались князья на Иеремию» (πικραίνω — огорчать, озлоблять); ἐπάταξαν αὐτὸν — «били его»; ἀπέστειλαν εἰς οἰκίαν Ιωναθαν τοῦ γραμματέως — «послали в дом Ионафана писца» (書記ヨナタン); ὅτι ταύτην ἐποίησαν εἰς οἰκίαν φυλακῆς — «ибо сделали его домом темницы»."
  16: "καὶ ἦλθεν Ιερεμιας εἰς οἰκίαν τοῦ λάκκου καὶ εἰς τὴν χερεθ — «и пришёл Иеремия в дом рва и в херет»: тёмное место (χερεθ — вероятно, «яма, подвал»; ru «подвал»), передано как 地下の倉; ἐκάθισεν ἐκεῖ ἡμέρας πολλάς — «сидел там дни многие»."
  17: "ἠρώτα αὐτὸν ὁ βασιλεὺς κρυφαίως — «спрашивал его царь тайно» (κρυφαίως); εἰ ἔστιν λόγος παρὰ κυρίου — «есть ли слово от Господа»; Ἔστιν — «есть»; εἰς χεῖρας βασιλέως Βαβυλῶνος παραδοθήσῃ — «в руки царя Вавилонского предан будешь»."
  18: "Τί ἠδίκησά σε — «чем я обидел (согрешил против) тебя» (ἀδικέω); καὶ τοὺς παῖδάς σου καὶ τὸν λαὸν τοῦτον — «и отроков твоих, и народ сей»; ὅτι σὺ δίδως με εἰς οἰκίαν φυλακῆς — «что ты даёшь меня в дом темницы». С этих слов речь пророка к царю (18–20)."
  19: "ποῦ εἰσιν οἱ προφῆται ὑμῶν — «где пророки ваши»; οἱ προφητεύσαντες ὑμῖν λέγοντες — «пророчествовавшие вам, говоря»; Οὐ μὴ ἔλθῃ βασιλεὺς Βαβυλῶνος ἐπὶ τὴν γῆν ταύτην — «не придёт царь Вавилонский на землю сию». Слова лжепророков — 『…』."
  20: "κύριε βασιλεῦ — «господин царь» (звательный); πεσέτω τὸ ἔλεός μου κατὰ πρόσωπόν σου — «да падёт моление моё пред лицом твоим» (ἔλεος — милость, здесь моление); μὴ ἀποστρέφεις με εἰς οἰκίαν Ιωναθαν — «не возвращай меня в дом Ионафана»; οὐ μὴ ἀποθάνω ἐκεῖ — «чтобы мне не умереть там». Слав. добавляет «молютися» — внесено (どうか). Здесь речь закрывается."
  21: "συνέταξεν ὁ βασιλεύς — «повелел царь»; ἐνεβάλοσαν αὐτὸν εἰς οἰκίαν τῆς φυλακῆς — «ввергли его в дом темницы»; ἐδίδωσαν αὐτῷ ἄρτον ἕνα τῆς ἡμέρας — «давали ему один хлеб в день»; ἔξωθεν οὗ πέσσουσιν — «извне, где пекут» (ἀπὸ τῆς ὁδοῦ τῶν ἀρτοποιῶν, ср. ru); ἕως ἐξέλιπον οἱ ἄρτοι ἐκ τῆς πόλεως — «доколе не кончились хлебы в городе»; ἐκάθισεν ἐν τῇ αὐλῇ τῆς φυλακῆς — «сидел во дворе темницы»."
