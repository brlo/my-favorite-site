verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。彼[かれ]らから、父[ちち]の家[いえ]ごとに一本[いっぽん]ずつ杖[つえ]を取[と]りなさい。すなわち、彼[かれ]らのすべての長[かしら]から、父[ちち]の家[いえ]に従[したが]って取[と]るのである。十二本[じゅうにほん]の杖[つえ]である。そして、それぞれの名[な]をその杖[つえ]に書[か]き記[しる]しなさい。"
  3: "レビの杖[つえ]にはアロンの名[な]を書[か]き記[しる]しなさい。レビの家[いえ]には一本[いっぽん]の杖[つえ]があるからである。彼[かれ]らは父[ちち]の家[いえ]の部族[ぶぞく]ごとに杖[つえ]を出[だ]す。"
  4: "その杖[つえ]を証[あかし]の幕屋[まくや]に、証[あかし]の前[まえ]に置[お]きなさい。そこは、わたしがあなたに現[あらわ]れる所[ところ]である。"
  5: "わたしが選[えら]ぶ者[もの]の杖[つえ]は芽[め]を出[だ]すであろう。こうして、わたしはイスラエルの子[こ]らがあなたがたに対[たい]してつぶやく、そのつぶやきを、わたしから取[と]り除[のぞ]く。」"
  6: "モーセはイスラエルの子[こ]らに語[かた]った。すると、彼[かれ]らの長[かしら]たちはみな、長[かしら]ひとりに一本[いっぽん]ずつ、父[ちち]の家[いえ]ごとの長[かしら]に従[したが]って、十二本[じゅうにほん]の杖[つえ]を彼[かれ]に与[あた]えた。アロンの杖[つえ]も彼[かれ]らの杖[つえ]の間[あいだ]にあった。"
  7: "モーセはその杖[つえ]を主[しゅ]の前[まえ]に、証[あかし]の幕屋[まくや]に置[お]いた。"
  8: "翌日[よくじつ]、モーセとアロンが証[あかし]の幕屋[まくや]に入[はい]ると、見[み]よ、レビの家[いえ]のアロンの杖[つえ]が芽[め]を出[だ]し、若枝[わかえだ]を伸[の]ばし、花[はな]を咲[さ]かせ、アーモンドの実[み]を結[むす]んでいた。"
  9: "モーセはすべての杖[つえ]を主[しゅ]の前[まえ]からイスラエルの子[こ]ら全員[ぜんいん]のところへ持[も]ち出[だ]した。彼[かれ]らは見[み]て、それぞれ自分[じぶん]の杖[つえ]を取[と]った。"
  10: "「アロンの杖[つえ]を証[あかし]の前[まえ]に置[お]きなさい。それは保存[ほぞん]のため、不[ふ]従[じゅう]の子[こ]らへのしるしである。彼[かれ]らのつぶやきがわたしから去[さ]り、彼[かれ]らが死[し]ぬことのないためである。」"
  11: "モーセとアロンは、主[しゅ]がモーセに命[めい]じられたとおりに行[おこな]った。まさにそのとおりに行[おこな]った。"
  12: "イスラエルの子[こ]らはモーセに言[い]った。「見[み]よ、わたしたちは絶[た]え、滅[ほろ]び、消[き]え果[は]ててしまう。"
  13: "主[しゅ]の幕屋[まくや]に触[ふ]れる者[もの]はだれでも死[し]ぬ。わたしたちはついに、みな死[し]に絶[た]えるのか。」"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに語って言われた (λέγων отдельно не передаётся; речь начинается со ст. 2)."
  2: "ῥάβδον ῥάβδον κατ᾿ οἴκους πατριῶν — «жезл, жезл по домам отцов»: повтор в распределительном значении, отсюда 一本ずつ. οἶκος πατριῶν — «дом отцов», род (父の家). ἀρχόντων — начальники родов (長). ἐπίγραψον — напиши (ἐπιγράφω). δώδεκα ῥάβδους — двенадцать жезлов, по числу князей."
  3: "τὸ ὄνομα Ααρων ἐπὶ τῆς ῥάβδου Λευι — имя Аарона на жезле Левия. ἔστιν γὰρ ῥάβδος μία — «ибо есть один жезл»: у дома Левия один жезл, поэтому имя Аарона ставится на нём. κατὰ φυλὴν οἴκου πατριῶν αὐτῶν δώσουσιν — «по племени дома отцов их дадут» (слав. «да дадят»)."
  4: "θήσεις αὐτὰς — положишь их. κατέναντι τοῦ μαρτυρίου — «против свидетельства» (μαρτύριον — свидетельство, ковчег откровения; слав. «прямо свидению»). ἐν οἷς γνωσθήσομαί σοι ἐκεῖ — «в них явлюсь тебе там» (γνωσθήσομαι, будущее от γινώσκω, — «буду узнан, явлен»)."
  5: "ἐκλέξωμαι — изберу (ἐκλέγομαι). ἐκβλαστήσει — произрастит (ἐκβλαστάνω, ср. ст. 8). περιελῶ τὸν γογγυσμόν — отниму ропот (περιαιρέω). γογγύζουσιν ἐφ᾿ ὑμῖν — ропщут на вас (ἐπί + дат.)."
  6: "τῷ ἄρχοντι τῷ ἑνὶ ῥάβδον — «одному начальнику жезл» (распределение). ἀνὰ μέσον τῶν ῥάβδων — среди жезлов; жезл Аарона лежал вместе с остальными."
  7: "ἀπέθηκεν — положил (ἀποτίθημι; ср. 17:10 ἀπόθες)."
  8: "τῇ ἐπαύριον — на другой день (ἐπαύριον). ἐξήνεγκεν βλαστόν — выпустил побег (βλαστός). ἐξήνθησεν ἄνθη — расцвёл цветами (ἐξανθέω). ἐβλάστησεν κάρυα — произвёл орехи (κάρυον — орех; здесь миндаль, ср. Иер 1:11 «жезл миндальный»). εἰς οἶκον Λευι — «в дом Левия», т. е. жезл дома Левия."
  9: "ἐξήνεγκεν … ἀπὸ προσώπου κυρίου — вынес от лица Господня. εἶδον καὶ ἔλαβον ἕκαστος — увидели и взял каждый."
  10: "Ἀπόθες — положи (императив). ἐνώπιον τῶν μαρτυρίων — «пред свидетельствами» (слав. «пред свидением»). εἰς διατήρησιν σημεῖον — «в сохранение, знамение» (два винительных: цель и назначение). τοῖς υἱοῖς τῶν ἀνηκόων — «сынам непокорным» (ἀνήκοος — неслушающий; слав. «ослушливых»). παυσάσθω — да прекратится. οὐ μὴ ἀποθάνωσιν — усиленное отрицание: «никак не умрут»."
  11: "ἐποίησεν Μωϋσῆς καὶ Ααρων … οὕτως ἐποίησαν — единственное число, затем множественное (слав. «сотвори … тако сотвориша»); в переводе сглажено."
  12: "ἐξανηλώμεθα, ἀπολώλαμεν, παρανηλώμεθα — три синонима: «истреблены, погибли, уничтожены» (ἐξαναλίσκομαι, ἀπόλλυμι, παραναλίσκομαι); тройное усиление сохранено."
  13: "ἕως εἰς τέλος ἀποθάνωμεν — «доколе до конца умрём?»: риторический вопрос — неужели все погибнем. τῆς σκηνῆς κυρίου — «скинии Господней» (не μαρτυρίου, как обычно)."
