verses:
  1: "イスラエルの王[おう]、ヨアハズの子[こ]ヨアシュの第二年[だいにねん]に、ヨアシュの子アマツヤがユダの王となった。"
  2: "彼[かれ]は二十五歳[にじゅうごさい]で王[おう]となり、エルサレムで二十九年[にじゅうきゅうねん]治[おさ]めた。母[はは]の名[な]はヨアディンといい、エルサレムの出[で]であった。"
  3: "彼は主[しゅ]の目[め]に正[ただ]しいことを行[おこな]った。ただし、父[ちち]ダビデのようではなく、父ヨアシュが行ったすべてのことにならって行った。"
  4: "ただ、高[たか]い所[ところ]は除[のぞ]かなかった。民[たみ]はなおも高い所で犠牲[ぎせい]を献[ささ]げ、香[こう]をたいた。"
  5: "王国[おうこく]が彼の手[て]に確[たし]かになると、彼は自分[じぶん]の父[ちち]を打[う]ち殺[ころ]した僕[しもべ]たちを打ち殺した。"
  6: "しかし、その殺[ころ]した者[もの]たちの子[こ]らは殺[ころ]さなかった。モーセの律法[りっぽう]の書[しょ]に書[か]かれているとおりである。主[しゅ]が命[めい]じて言[い]われた。「父[ちち]たちは子[こ]らのために死[し]なず、子らも父たちのために死なない。それぞれ自分[じぶん]の罪[つみ]によって死ぬ。」"
  7: "彼はエドムを塩[しお]の谷[たに]で一万人[いちまんにん]打[う]ち、戦[たたか]いでセラを取[と]って、その名[な]をヨクテエルと呼[よ]んだ。それは今日[きょう]まで続[つづ]いている。"
  8: "そのとき、アマツヤは使者[ししゃ]たちをイスラエルの王、イエフの子[こ]ヨアハズの子ヨアシュのもとへ遣[つか]わして言[い]った。「さあ、顔[かお]を合[あ]わせよう。」"
  9: "イスラエルの王ヨアシュはユダの王アマツヤに遣わして言った。「レバノンの茨[いばら]はレバノンの杉[すぎ]に遣わして言った。『あなたの娘[むすめ]をわたしの子[こ]の妻[つま]に与[あた]えよ』と。すると、レバノンの野[の]の獣[けもの]たちが通[とお]って、その茨を踏[ふ]みつけた。"
  10: "あなたはエドムを打[う]ち破[やぶ]って、心[こころ]が高[たか]ぶった。自分の家[いえ]に座[すわ]って栄光[えいこう]を誇[ほこ]れ。なぜ、あなたは災[わざわ]いを招[まね]く争[あらそ]いをするのか。あなたも、あなたとともにユダも倒[たお]れるであろう。」"
  11: "しかし、アマツヤは聞[き]かなかった。イスラエルの王は上[のぼ]って来[き]て、彼とユダの王アマツヤは、ユダにあるベト・シェメシュで顔[かお]を合[あ]わせた。"
  12: "ユダはイスラエルの前[まえ]で打[う]ち負[ま]かされ、それぞれ自分[じぶん]の天幕[てんまく]へ逃[に]げた。"
  13: "イスラエルの王ヨアシュは、ユダの王アマツヤ、すなわちヨアシュの子[こ]、アハズヤの子をベト・シェメシュで捕[と]らえ、エルサレムに来[き]て、エルサレムの城壁[じょうへき]をエフライムの門[もん]から隅[すみ]の門[もん]まで四百[よんひゃく]キュビト壊[こわ]した。"
  14: "彼は主[しゅ]の家[いえ]と王[おう]の家[いえ]の宝庫[ほうこ]にあった金[きん]と銀[ぎん]、すべての器[うつわ]を取[と]り、また人質[ひとじち]たちを取って、サマリアへ帰[かえ]った。"
  15: "ヨアシュの残[のこ]りの言葉[ことば]、彼が武勇[ぶゆう]をもって行[おこな]ったすべてのこと、およびユダの王アマツヤと戦[たたか]ったことは、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されているではないか。"
  16: "ヨアシュは父[ちち]たちとともに眠[ねむ]り、サマリアでイスラエルの王[おう]たちとともに葬[ほうむ]られた。代[か]わってその子[こ]ヤロブアムが王となった。"
  17: "ヨアシュ、すなわちヨアハズの子、イスラエルの王が死[し]んだ後[のち]、ヨアシュの子アマツヤ、ユダの王は十五年[じゅうごねん]生[い]きた。"
  18: "アマツヤの残[のこ]りの言葉、彼が行ったすべてのことは、ユダの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されているではないか。"
  19: "彼に対[たい]してエルサレムで一団[いちだん]が謀[む]を企[くわだ]てた。彼はラキシュへ逃[に]げ、人[ひと]々[びと]は彼の後[あと]を追[お]ってラキシュへ行[い]き、そこで彼を殺[ころ]した。"
  20: "人々は彼を馬[うま]に乗[の]せて運[はこ]び、エルサレムで父[ちち]たちとともに、ダビデの町[まち]に葬[ほうむ]った。"
  21: "ユダの民[たみ]はみなアザリヤを取[と]った。彼は十六歳[じゅうろくさい]で、民は彼を父[ちち]アマツヤの代[か]わりに王[おう]とした。"
  22: "彼はエラトを建[た]て、王[おう]が父[ちち]たちとともに眠[ねむ]った後[のち]、それをユダに戻[もど]した。"
  23: "ユダの王、ヨアシュの子[こ]アマツヤの第十五年[だいじゅうごねん]に、ヨアシュの子ヤロブアムがサマリアでイスラエルの王となり、四十一[よんじゅういち]年[ねん]治[おさ]めた。"
  24: "彼は主[しゅ]の前[まえ]に悪[わる]いことを行[おこな]い、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させたすべての罪[つみ]から離[はな]れなかった。"
  25: "彼はイスラエルの国境[こっきょう]を、ハマトの入口[いりぐち]からアラバの海[うみ]まで回復[かいふく]した。イスラエルの神[かみ]、主[しゅ]が、ガト・ヘフェルの預言者[よげんしゃ]であるアミタイの子[こ]ヨナ、その僕[しもべ]の手[て]によって語[かた]られた言葉[ことば]のとおりである。"
  26: "主[しゅ]はイスラエルの屈辱[くつじょく]が非常[ひじょう]に苦[くる]しく、彼らがわずかになり、閉[と]じ込[こ]められ、乏[とぼ]しくなり、見捨[みす]てられて、助[たす]ける者[もの]もないのをご覧[らん]になったからである。"
  27: "主[しゅ]は天[てん]の下[した]からイスラエルの種[たね]を消[け]し去[さ]ることを語[かた]られず、ヨアシュの子[こ]ヤロブアムの手[て]によって彼らを救[すく]われた。"
  28: "ヤロブアムの残[のこ]りの言葉、彼が行ったすべてのこと、彼の武勇[ぶゆう]、彼が戦[たたか]ったこと、およびダマスコとハマトをイスラエルでユダに戻[もど]したことは、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されているではないか。"
  29: "ヤロブアムは父[ちち]たちとともに、イスラエルの王[おう]たちとともに眠[ねむ]った。代[か]わってその子[こ]ゼカリヤが王[おう]となった。"

notes:
  1: "Ἐν ἔτει δευτέρῳ τῷ Ιωας υἱῷ Ιωαχας βασιλεῖ Ισραηλ — во второй год Иоаса, сына Иоахаза, царя Израильского. ἐβασίλευσεν Αμεσσιας υἱὸς Ιωας βασιλεὺς Ιουδα — воцарился Амасия, сын Иоаса, царь Иудейский."
  2: "υἱὸς εἴκοσι καὶ πέντε ἐτῶν ἦν ἐν τῷ βασιλεύειν αὐτόν — был сыном двадцати пяти лет, когда воцарился. εἴκοσι καὶ ἐννέα ἔτη ἐβασίλευσεν — двадцать девять лет царствовал. В слав. «и двадесять пять лет царствова» — порча (ср. 14:17 и 14:23, где сходится только 29); в тексте 29 по гр. и ru. ὄνομα τῆς μητρὸς αὐτοῦ Ιωαδιν — имя матери его Иоадин (слав. «иоадина», ru «Иегоаддань»)."
  3: "ἐποίησεν τὸ εὐθὲς ἐν ὀφθαλμοῖς κυρίου — делал правое в очах Господа (τὸ εὐθές). πλὴν οὐχ ὡς Δαυιδ ὁ πατὴρ αὐτοῦ — впрочем не как Давид, отец его. κατὰ πάντα, ὅσα ἐποίησεν Ιωας ὁ πατὴρ αὐτοῦ — по всему, что сделал Иоас, отец его."
  4: "τὰ ὑψηλὰ οὐκ ἐξῆρεν — высот не убрал (ἐξαίρω). ἔτι ὁ λαὸς ἐθυσίαζεν καὶ ἐθυμίων — ещё народ приносил жертвы и кадил (θυμιάω). ἐν τοῖς ὑψηλοῖς — на высотах."
  5: "ὅτε κατίσχυσεν ἡ βασιλεία ἐν χειρὶ αὐτοῦ — когда утвердилось царство в руке его (κατισχύω). ἐπάταξεν τοὺς δούλους αὐτοῦ τοὺς πατάξαντας τὸν πατέρα αὐτοῦ — умертвил слуг своих, убивших отца его."
  6: "τοὺς υἱοὺς τῶν παταξάντων οὐκ ἐθανάτωσεν — сыновей убийц не умертвил. καθὼς γέγραπται ἐν βιβλίῳ νόμων Μωυσῆ — как написано в книге законов Моисея. Οὐκ ἀποθανοῦνται πατέρες ὑπὲρ υἱῶν, καὶ υἱοὶ οὐκ ἀποθανοῦνται ὑπὲρ πατέρων — не умрут отцы за сыновей, и сыновья не умрут за отцов. ἕκαστος ἐν ταῖς ἁμαρτίαις αὐτοῦ ἀποθανεῖται — каждый в грехах своих умрёт."
  7: "αὐτὸς ἐπάταξεν τὸν Εδωμ ἐν Γαιμελε δέκα χιλιάδας — он поразил Едома в Гаймеле, десять тысяч (Γαιμελε — евр. Гей-Мелах, «долина соли»; слав. «в гемеле», ru «на долине Соляной»; в тексте по смыслу — 塩の谷). συνέλαβε τὴν Πέτραν ἐν τῷ πολέμῳ — взял Петру войной, т. е. Селу (Πέτρα «скала»; слав. «камень»; в тексте имя セラ). ἐκάλεσεν τὸ ὄνομα αὐτῆς Καθοηλ — нарёк имя её Кафоил (слав. «иефоил», т. е. Иокфеил; в тексте ヨクテエル). ἕως τῆς ἡμέρας ταύτης — до сего дня."
  8: "ἀπέστειλεν Αμεσσιας ἀγγέλους πρὸς Ιωας — послал Амасия послов к Иоасу. Δεῦρο ὀφθῶμεν προσώποις — «приди, увидимся лицами», т. е. лицом к лицу."
  9: "Ὁ ακαν ὁ ἐν τῷ Λιβάνῳ — терн (ἄκαν, колючка) на Ливане. τὴν κέδρον τὴν ἐν τῷ Λιβάνῳ — кедр на Ливане. Δὸς τὴν θυγατέρα σου τῷ υἱῷ μου εἰς γυναῖκα — отдай дочь твою сыну моему в жену. τὰ θηρία τοῦ ἀγροῦ — звери полевые. συνεπάτησαν τὸν ακανα — истоптали терн."
  10: "τύπτων ἐπάταξας τὴν Ιδουμαίαν — «поражая, поразил Идумею» (усиление). ἐπῆρέν σε ἡ καρδία σου — вознесло тебя сердце твоё. ἐνδοξάσθητι καθήμενος ἐν τῷ οἴκῳ σου — прославься, сидя в доме твоём. ἵνα τί ἐρίζεις ἐν κακίᾳ σου — зачем ссоришься во зле твоём. πεσῇ σὺ καὶ Ιουδας μετὰ σοῦ — падёшь ты и Иуда с тобою."
  11: "οὐκ ἤκουσεν Αμεσσιας — не послушал Амасия. ἀνέβη ὁ βασιλεὺς Ισραηλ — поднялся царь Израильский. ὤφθησαν προσώποις — увиделись лицом к лицу. ἐν Βαιθσαμυς τῇ τοῦ Ιουδα — в Беф-Самисе, что в Иудее (ベト・シェメシュ)."
  12: "ἔπταισεν Ιουδας ἀπὸ προσώπου Ισραηλ — споткнулся, потерпел поражение Иуда пред лицом Израиля (πταίω). ἔφυγεν ἀνὴρ εἰς τὸ σκήνωμα αὐτοῦ — побежал каждый в шатёр свой."
  13: "συνέλαβεν... ἐν Βαιθσαμυς — захватил в Беф-Самисе. ἦλθεν εἰς Ιερουσαλημ — пришёл в Иерусалим. καθεῖλεν ἐν τῷ τείχει Ιερουσαλημ ἀπὸ πύλης Εφραιμ ἕως πύλης τῆς γωνίας — разрушил в стене Иерусалима от ворот Ефремовых до ворот угольных (καθαιρέω). τετρακοσίους πήχεις — четыреста локтей."
  14: "ἔλαβεν τὸ χρυσίον καὶ τὸ ἀργύριον — взял золото и серебро. σκεύη τὰ εὑρεθέντα ἐν οἴκῳ κυρίου — сосуды, найденные в доме Господнем. τοὺς υἱοὺς τῶν συμμίξεων — «сыновей смешений», т. е. заложников (слав. «сыны смесившихся», ru «заложников»). ἀπέστρεψεν εἰς Σαμάρειαν — возвратился в Самарию."
  15: "τὰ λοιπὰ τῶν λόγων Ιωας, ὅσα ἐποίησεν ἐν δυναστείᾳ αὐτοῦ — прочее слов Иоаса, что он сделал в силе своей. ἃ ἐπολέμησεν μετὰ Αμεσσιου — что воевал с Амасией."
  16: "ἐκοιμήθη Ιωας μετὰ τῶν πατέρων αὐτοῦ καὶ ἐτάφη ἐν Σαμαρείᾳ μετὰ τῶν βασιλέων Ισραηλ — почил Иоас с отцами и погребён в Самарии с царями Израильскими. ἐβασίλευσεν Ιεροβοαμ υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Иеровоам, сын его, вместо него."
  17: "ἔζησεν Αμεσσιας... μετὰ τὸ ἀποθανεῖν Ιωας — жил Амасия после того, как умер Иоас. πεντεκαίδεκα ἔτη — пятнадцать лет."
  18: "τὰ λοιπὰ τῶν λόγων Αμεσσιου — прочее слов Амасии. ἐπὶ βιβλίῳ λόγων τῶν ἡμερῶν τοῖς βασιλεῦσιν Ιουδα — в книге слов дней царей Иудейских."
  19: "συνεστράφησαν ἐπ᾽ αὐτὸν σύστρεμμα — составили против него заговор (συστρέφω, σύστρεμμα). ἔφυγεν εἰς Λαχις — убежал в Лахис. ἀπέστειλαν ὀπίσω αὐτοῦ — послали за ним. ἐθανάτωσαν αὐτὸν ἐκεῖ — умертвили его там."
  20: "ἦραν αὐτὸν ἐφ᾽ ἵππων — подняли его на коней. ἐτάφη ἐν Ιερουσαλημ... ἐν πόλει Δαυιδ — погребён в Иерусалиме, в городе Давида."
  21: "ἔλαβεν πᾶς ὁ λαὸς Ιουδα τὸν Αζαριαν — взял весь народ Иудин Азарию. καὶ αὐτὸς υἱὸς ἑκκαίδεκα ἐτῶν — а он был сыном шестнадцати лет (вставка в гр.). ἐβασίλευσαν αὐτὸν ἀντὶ τοῦ πατρὸς αὐτοῦ — воцарили его вместо отца его."
  22: "ᾠκοδόμησεν τὴν Αιλωθ — построил Елаф (Αιλωθ, Элат). ἐπέστρεψεν αὐτὴν τῷ Ιουδα — возвратил его Иуде. μετὰ τὸ κοιμηθῆναι τὸν βασιλέα μετὰ τῶν πατέρων αὐτοῦ — после того как царь почил с отцами своими."
  23: "Ἐν ἔτει πεντεκαιδεκάτῳ τοῦ Αμεσσιου — в пятнадцатый год Амасии. ἐβασίλευσεν Ιεροβοαμ υἱὸς Ιωας ἐπὶ Ισραηλ — воцарился Иеровоам, сын Иоаса, над Израилем. τεσσαράκοντα καὶ ἓν ἔτος — сорок один год."
  24: "ἐποίησεν τὸ πονηρὸν ἐνώπιον κυρίου — делал злое пред Господом. οὐκ ἀπέστη ἀπὸ πασῶν ἁμαρτιῶν Ιεροβοαμ — не отступил от всех грехов Иеровоама."
  25: "ἀπέστησεν τὸ ὅριον Ισραηλ — восстановил предел Израиля (ἀφίστημι). ἀπὸ εἰσόδου Αιμαθ ἕως τῆς θαλάσσης τῆς Αραβα — от входа Емафа до моря Арава (ハマトの入口...アラバの海). κατὰ τὸ ῥῆμα κυρίου θεοῦ Ισραηλ — по слову Господа Бога Израилева. ἐν χειρὶ δούλου αὐτοῦ Ιωνα υἱοῦ Αμαθι τοῦ προφήτου τοῦ ἐκ Γεθχοβερ — рукою раба Своего Ионы, сына Амафиина, пророка из Гафхефера (ガト・ヘフェル)."
  26: "εἶδεν κύριος τὴν ταπείνωσιν Ισραηλ πικρὰν σφόδρα — увидел Господь унижение Израиля, горькое весьма (ταπείνωσις). ὀλιγοστοὺς συνεχομένους καὶ ἐσπανισμένους καὶ ἐγκαταλελειμμένους — малых, стеснённых, оскудевших и оставленных (ὀλιγοστός, σπανίζω, ἐγκαταλείπω). οὐκ ἦν ὁ βοηθῶν τῷ Ισραηλ — не было помогающего Израилю."
  27: "οὐκ ἐλάλησεν κύριος ἐξαλεῖψαι τὸ σπέρμα Ισραηλ — не изрёк Господь истребить семя Израиля (ἐξαλείφω). ὑποκάτωθεν τοῦ οὐρανοῦ — из-под неба. ἔσωσεν αὐτοὺς διὰ χειρὸς Ιεροβοαμ — спас их рукою Иеровоама."
  28: "ὅσα ἐπολέμησεν — что воевал. ὅσα ἐπέστρεψεν τὴν Δαμασκὸν καὶ τὴν Αιμαθ τῷ Ιουδα ἐν Ισραηλ — что возвратил Дамаск и Емаф Иуде при Израиле; тёмное место, передано буквально (слав. «како возврати дамаск и емаф иуде во израили»)."
  29: "ἐκοιμήθη Ιεροβοαμ μετὰ τῶν πατέρων αὐτοῦ μετὰ βασιλέων Ισραηλ — почил Иеровоам с отцами своими, с царями Израильскими. В гр. далее «καὶ ἐβασίλευσεν Αζαριας υἱὸς Αμεσσιου» — воцарился Азария, сын Амасии; слав. и ru читают «Захария, сын его». По паритету в тексте ゼカリヤ (слав.), вариант гр. отмечен здесь."
