verses:
  1: "アブラムが九十九歳[きゅうじゅうきゅうさい]になったとき、主[しゅ]はアブラムに現[あらわ]れて言[い]われた。「わたしはあなたの神[かみ]である。わたしの前[まえ]でわたしに喜[よろこ]ばれる者[もの]となり、非[ひ]の打[う]ちどころのない者[もの]となれ。」"
  2: "「わたしは、わたしとあなたとの間[あいだ]に、わたしの契約[けいやく]を立[た]て、あなたを大[おお]いに増[ふ]やそう。」"
  3: "アブラムは顔[かお]を伏[ふ]して倒[たお]れた。神[かみ]は彼[かれ]に語[かた]って言[い]われた。"
  4: "「見[み]よ、わたしの契約[けいやく]はあなたとともにあり、あなたは多[おお]くの民[たみ]の父[ちち]となる。"
  5: "あなたの名[な]はもはやアブラムとは呼[よ]ばれず、あなたの名[な]はアブラハムとなる。わたしはあなたを多[おお]くの民[たみ]の父[ちち]としたからである。"
  6: "わたしはあなたを大[おお]いに、大[おお]いに増[ふ]やし、あなたから諸[しょ]民[みん]を起[お]こし、あなたから王[おう]たちが現[あらわ]れる。"
  7: "わたしは、わたしとあなたとの間[あいだ]、またあなたの後[あと]の子孫[しそん]との間[あいだ]に、代々[よよ]にわたって、わたしの契約[けいやく]を立[た]てる。それは永遠[えいえん]の契約[けいやく]であり、わたしはあなたと、あなたの後[あと]の子孫[しそん]の神[かみ]となる。"
  8: "わたしは、あなたと、あなたの後[あと]の子孫[しそん]に、あなたが寄留[きりゅう]している地[ち]、すなわちカナンの全[ぜん]地[ち]を、永遠[えいえん]の所有[しょゆう]として与[あた]え、彼[かれ]らの神[かみ]となる。」"
  9: "神[かみ]はアブラハムに言[い]われた。「あなたと、あなたの後[あと]の子孫[しそん]は、代々[よよ]にわたって、わたしの契約[けいやく]を守[まも]らなければならない。"
  10: "わたしとあなたがたとの間[あいだ]、またあなたの後[あと]の子孫[しそん]の代々[よよ]との間[あいだ]で、あなたがたが守[まも]るべきわたしの契約[けいやく]はこれである。あなたがたのうちの男[おとこ]はみな割礼[かつれい]を受[う]けなければならない。"
  11: "あなたがたは、自分の包皮[ほうひ]の肉[にく]を切[き]り取[と]らなければならない。それが、わたしとあなたがたとの間[あいだ]の契約[けいやく]のしるしとなる。"
  12: "八日[ようか]目[め]の男[おとこ]の子[こ]は、あなたがたの代々[よよ]にわたって、あなたがたのうちで割礼[かつれい]を受[う]けなければならない。家[いえ]で生[う]まれた者[もの]も、あなたの子孫[しそん]でない他国人[たこくじん]から銀[ぎん]で買[か]った者[もの]も、同[おな]じである。"
  13: "あなたの家[いえ]で生[う]まれた者[もの]も、買[か]い取[と]った者[もの]も、必[かなら]ず割礼[かつれい]を受[う]けなければならない。わたしの契約[けいやく]は、あなたがたの肉[にく]の上[うえ]にあって、永遠[えいえん]の契約[けいやく]となる。"
  14: "八日[ようか]目[め]に自分の包皮[ほうひ]の肉[にく]を切[き]り取[と]らない男[おとこ]は、その者[もの]は民[たみ]のうちから絶[た]たれる。その者[もの]がわたしの契約[けいやく]を破[やぶ]ったからである。」"
  15: "神[かみ]はアブラハムに言[い]われた。「あなたの妻[つま]サラは、その名[な]をサラと呼[よ]ばれることはない。その名[な]はサラとなる。"
  16: "わたしは彼女[かのじょ]を祝福[しゅくふく]し、彼女[かのじょ]からあなたに子[こ]を与[あた]える。わたしはその子[こ]を祝福[しゅくふく]し、その子[こ]から諸[しょ]民[みん]が起[お]こり、諸[しょ]民[みん]の王[おう]たちがその子[こ]から出[で]る。」"
  17: "アブラハムは顔[かお]を伏[ふ]して倒[たお]れ、笑[わら]って、心[こころ]のうちに言[い]った。「百歳[ひゃくさい]の者[もの]に子[こ]が生[う]まれるだろうか。九十歳[きゅうじゅっさい]のサラに、子[こ]を産[う]むことがあるだろうか。」"
  18: "アブラハムは神[かみ]に言[い]った。「このイシュマエルが、あなたの前[まえ]で生[い]き続[つづ]けますように。」"
  19: "神[かみ]はアブラハムに言[い]われた。「そのとおり。見[み]よ、あなたの妻[つま]サラがあなたに男[おとこ]の子[こ]を産[う]む。あなたはその名[な]をイサクと名[な]づけなさい。わたしは彼[かれ]と、彼[かれ]の後[あと]の子孫[しそん]との間に、永遠[えいえん]の契約[けいやく]として、わたしの契約[けいやく]を立[た]てる。"
  20: "イシュマエルについては、見[み]よ、わたしはあなたの願[ねが]いを聞[き]いた。見[み]よ、わたしは彼[かれ]を祝福[しゅくふく]し、彼[かれ]を大[おお]いに増[ふ]やし、その数[かず]を大[おお]いに多[おお]くする。彼[かれ]は十二[じゅうに]の民[たみ]を生[う]み、わたしは彼[かれ]を大[おお]きな民[たみ]とする。"
  21: "わたしの契約[けいやく]は、イサクと立[た]てる。サラが、来[らい]年[ねん]のこの時[とき]に、あなたに産[う]む子[こ]である。」"
  22: "神[かみ]は彼[かれ]に語[かた]り終[お]えて、アブラハムから上[のぼ]られた。"
  23: "アブラハムは、自分の子[こ]イシュマエルと、自分[じぶん]の家[いえ]で生[う]まれたすべての者[もの]、自分[じぶん]が買[か]い取[と]ったすべての者[もの]、すなわちアブラハムの家[いえ]にいるすべての男[おとこ]を連[つ]れて、神[かみ]が彼[かれ]に言[い]われたとおりに、その同[おな]じ日[ひ]に、彼[かれ]らの包皮[ほうひ]の肉[にく]を切[き]り取[と]った。"
  24: "アブラハムは、自分の包皮[ほうひ]の肉[にく]を切[き]り取[と]ったとき、九十九歳[きゅうじゅうきゅうさい]であった。"
  25: "その子[こ]イシュマエルは、自分の包皮[ほうひ]の肉[にく]を切[き]り取[と]られたとき、十三歳[じゅうさんさい]であった。"
  26: "その同[おな]じ日[ひ]に、アブラハムとその子[こ]イシュマエルは割礼[かつれい]を受[う]けた。"
  27: "また、その家[いえ]のすべての男[おとこ]たち、すなわち家[いえ]で生[う]まれた者[もの]も、他[た]の民[たみ]から買[か]い取[と]った者[もの]も、彼[かれ]は割礼[かつれい]を施[ほどこ]した。"

notes:
  1: "Ἐγένετο δὲ Αβραμ ἐτῶν ἐνενήκοντα ἐννέα — アブラムが九十九歳になったとき (ἐτῶν — «лет», родительный возраста). ὤφθη κύριος τῷ Αβραμ — 主はアブラムに現れた (ὤφθη, аорист от ὁράω, «явился»). Ἐγώ εἰμι ὁ θεός σου — わたしはあなたの神である (LXX: «Бог твой»; евр. אֵל שַׁדַּי и Синодальный — «Бог Всемогущий»; держимся греческого, поэтому не 全能の神). εὐαρέστει ἐναντίον ἐμοῦ — わたしの前で喜ばれる者となれ (εὐαρεστέω — «быть угодным»). γίνου ἄμεμπτος — 非の打ちどころのない者となれ (ἄμεμπτος — «безупречный»)."
  2: "θήσομαι τὴν διαθήκην — 契約を立てる (τίθημι διαθήκην — устойчивое выражение, «поставить завет»). ἀνὰ μέσον ἐμοῦ καὶ ἀνὰ μέσον σοῦ — わたしとあなたとの間に (ἀνὰ μέσον — «между»; повтор предлога сохранён). πληθυνῶ σε σφόδρα — 大いに増やそう (πληθύνω — «умножать»)."
  3: "ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ — 顔を伏して倒れた (букв. «пал на лицо своё»). ἐλάλησεν αὐτῷ ὁ θεὸς λέγων — 神は彼に語って言われた (λέγων — семитский оборот, сохранён)."
  4: "ἰδοὺ ἡ διαθήκη μου μετὰ σοῦ — 見よ、わたしの契約はあなたとともに (μετά — «с»). ἔσῃ πατὴρ πλήθους ἐθνῶν — 多くの民の父となる (πλῆθος — «множество»; ἔθνη — «народы»)."
  5: "οὐ κληθήσεται ἔτι τὸ ὄνομά σου Αβραμ — 名はもはやアブラムと呼ばれない (καλέω — «называть»). Αβρααμ — アブラハム. ὅτι πατέρα πολλῶν ἐθνῶν τέθεικά σε — 多くの民の父としたからである (perfect τέθεικα — «поставил и поставил»)."
  6: "αὐξανῶ σε σφόδρα σφόδρα — 大いに、大いに増やし (двойное σφόδρα, как евр. מְאֹד מְאֹד; повтор сохранён). θήσω σε εἰς ἔθνη — 諸民を起こし (букв. «поставлю тебя в народы»). βασιλεῖς ἐκ σοῦ ἐξελεύσονται — 王たちがあなたから出る."
  7: "στήσω τὴν διαθήκην ... εἰς γενεὰς αὐτῶν — 代々にわたって契約を立てる. εἰς διαθήκην αἰώνιον — 永遠の契約として. εἶναί σου θεὸς καὶ τοῦ σπέρματός σου — あなたと後の子孫の神となる (εἶναι с дательным — «быть кому-то Богом»)."
  8: "τὴν γῆν, ἣν παροικεῖς — あなたが寄留している地 (παροικέω — «жить пришельцем»). πᾶσαν τὴν γῆν Χανααν — カナンの全地. εἰς κατάσχεσιν αἰώνιον — 永遠の所有として (κατάσχεσις — «владение»). ἔσομαι αὐτοῖς θεός — 彼らの神となる."
  9: "Σὺ δὲ τὴν διαθήκην μου διατηρήσεις — あなたはわたしの契約を守らなければならない (διατηρέω — «соблюдать»). σὺ καὶ τὸ σπέρμα σου — あなたと後の子孫 (σπέρμα — собирательное, «семя»)."
  10: "αὕτη ἡ διαθήκη, ἣν διατηρήσεις — あなたがたが守るべき契約はこれである. περιτμηθήσεται ὑμῶν πᾶν ἀρσενικόν — 男はみな割礼を受けなければならない (περιτέμνω — «обрезать»; ἀρσενικός — «мужского пола»)."
  11: "περιτμηθήσεσθε τὴν σάρκα τῆς ἀκροβυστίας ὑμῶν — 包皮の肉を切り取らなければならない (ἀκροβυστία — «крайняя плоть»). ἐν σημείῳ διαθήκης — 契約のしるしとして (σημεῖον — «знак»)."
  12: "παιδίον ὀκτὼ ἡμερῶν — 八日目の男の子 (букв. «дитя восьми дней»). ὁ οἰκογενὴς τῆς οἰκίας σου — 家で生まれた者 (οἰκογενής — «рождённый в доме»). ὁ ἀργυρώνητος ἀπὸ παντὸς υἱοῦ ἀλλοτρίου — 他国人から銀で買った者 (ἀργυρώνητος — «купленный за серебро»; ἀλλότριος — «чужой»)."
  13: "περιτομῇ περιτμηθήσεται — 必ず割礼を受けなければならない (датив усиления при глаголе, как в евр.). ἐπὶ τῆς σαρκὸς ὑμῶν — あなたがたの肉の上に."
  14: "ἀπερίτμητος ἄρσην — 割礼を受けない男 (ἀπερίτμητος — «необрезанный»). ἐξολεθρευθήσεται ἡ ψυχὴ ἐκείνη ἐκ τοῦ γένους αὐτῆς — その者は民のうちから絶たれる (ἐξολεθρεύω — «истреблять»; γένος — «род»). τὴν διαθήκην μου διεσκέδασεν — わたしの契約を破った (διασκεδάννυμι — «разрушать, нарушать»)."
  15: "Σαρα ... οὐ κληθήσεται τὸ ὄνομα αὐτῆς Σαρα, ἀλλὰ Σαρρα — サラ…その名はサラとなる (греч. различает Σαρα и Σαρρα; по-японски оба サラ, различие только в notes)."
  16: "εὐλογήσω ... δώσω σοι ἐξ αὐτῆς τέκνον — 彼女を祝福し、彼女から子を与える. ἔσται εἰς ἔθνη — 諸民となる. βασιλεῖς ἐθνῶν ἐξ αὐτοῦ — 諸民の王たちがその子から出る (αὐτόν/αὐτοῦ — о сыне, мужской род)."
  17: "ἐγέλασεν — 笑った (γέλως; ср. имя Исаак — יִצְחָק, «он засмеётся»). εἶπεν ἐν τῇ διανοίᾳ αὐτοῦ — 心のうちに言った (διάνοια — «мысль, разум»). Εἰ τῷ ἑκατονταετεῖ γενήσεται — 百歳の者に子が生まれるだろうか (εἰ в вопросе с оттенком сомнения). ἐνενήκοντα ἐτῶν οὖσα — 九十歳で."
  18: "Ισμαηλ οὗτος ζήτω ἐναντίον σου — このイシュマエルがあなたの前で生き続けますように (ζήτω — императив 3 л.; οὗτος — «этот»)."
  19: "Ναί — そのとおり (ответ на просьбу). καλέσεις τὸ ὄνομα αὐτοῦ Ισαακ — 名をイサクと名づけなさい. στήσω τὴν διαθήκην μου πρὸς αὐτόν — 彼と契約を立てる (πρός — «с»)."
  20: "ἐπήκουσά σου — あなたの願いを聞いた (ἐπακούω + род.). εὐλόγησα ... αὐξανῶ ... πληθυνῶ — благословил (аорист), умножу (будущее); смена времён сохранена. δώδεκα ἔθνη γεννήσει — 十二の民を生む (ἔθνη здесь — «племена»)."
  21: "εἰς τὸν καιρὸν τοῦτον ἐν τῷ ἐνιαυτῷ τῷ ἑτέρῳ — 来年のこの時に (букв. «в это время, в другой год»)."
  22: "συνετέλεσεν λαλῶν — 語り終えて. ἀνέβη ὁ θεὸς ἀπὸ Αβρααμ — 神はアブラハムから上られた (ἀναβαίνω — «восходить», о конце явления)."
  23: "ἔλαβεν ... Ισμαηλ ... καὶ πάντας τοὺς οἰκογενεῖς ... καὶ πάντας τοὺς ἀργυρωνήτους — イシュマエル…家で生まれた者…買い取った者. περιέτεμεν τὰς ἀκροβυστίας αὐτῶν — 彼らの包皮を切った. ἐν τῷ καιρῷ τῆς ἡμέρας ἐκείνης — その同じ日に."
  24: "ἐνενήκοντα ἐννέα ἐτῶν — 九十九歳. ἡνίκα περιέτεμεν — 切り取ったとき (ἡνίκα — «когда»)."
  25: "ἐτῶν δέκα τριῶν — 十三歳. περιετμήθη — 割礼を受けた (страдательный залог)."
  26: "ἐν τῷ καιρῷ τῆς ἡμέρας ἐκείνης — その同じ日に. περιετμήθη Αβρααμ καὶ Ισμαηλ — アブラハムとイシュマエルは割礼を受けた."
  27: "οἱ ἄνδρες τοῦ οἴκου — 家のすべての男たち. οἱ οἰκογενεῖς καὶ οἱ ἀργυρώνητοι ἐξ ἀλλογενῶν ἐθνῶν — 家で生まれた者と、他の民から買い取った者 (ἀλλογενής — «иноплеменный»). περιέτεμεν αὐτούς — 彼らに割礼を施した."
