verses:
  1: "エリフはさらに語[かた]り続[つづ]けて言[い]った。"
  2: "「わたしを少[すこ]し待[ま]て。あなたに示[しめ]そう。わたしにはまだ神[かみ]のために語[かた]るべき言葉[ことば]がある。"
  3: "わたしは知識[ちしき]を遠[とお]くから取[と]り上[あ]げ、わたしのわざによって正[ただ]しいことを語[かた]ろう。"
  4: "まことに、言葉[ことば]は不[ふ]正[せい]ではない。あなたは不[ふ]正[せい]に悟[さと]っている。"
  5: "知[し]れ。主[しゅ]は無垢[むく]な者[もの]を決[けっ]して退[しりぞ]けられない。心[こころ]の力[ちから]において強[つよ]い方[かた]である。"
  6: "神[かみ]は不敬[ふけい]な者[もの]を生[い]かさず、貧[まず]しい者[もの]たちの裁[さば]きを与[あた]えられる。"
  7: "神[かみ]は正[ただ]しい者[もの]からその目[め]を離[はな]されない。彼[かれ]らを王[おう]たちとともに王座[おうざ]に着[つ]かせ、勝利[しょうり]のうちに置[お]かれ、彼[かれ]らは高[たか]く上[あ]げられる。"
  8: "もし彼[かれ]らが手枷[てかせ]にかけられ、貧[まず]しさの綱[つな]で縛[しば]られるなら、"
  9: "神[かみ]は彼[かれ]らに、そのわざと、彼[かれ]らが強[つよ]くなろうとしたそのそむきの罪[つみ]とを告[つ]げられる。"
  10: "神[かみ]は正[ただ]しい者[もの]の言[こと]を聞[き]き、彼[かれ]らが不正[ふせい]から立[た]ち返[かえ]ると言[い]われる。"
  11: "もし彼[かれ]らが聞[き]き従[したが]って仕[つか]えれば、その日[ひ]々[び]を良[よ]いもののうちに、その年[とし]々[どし]を麗[うるわ]しさのうちに終[お]える。"
  12: "しかし、不敬[ふけい]な者[もの]たちは救[すく]われない。彼[かれ]らは主[しゅ]を知[し]ろうと望[のぞ]まず、戒[いまし]めを受[う]けても聞[き]かなかったからである。"
  13: "心[こころ]の偽[いつわ]り者[もの]たちは怒[いか]りを蓄[たくわ]える。神が彼[かれ]らを縛[しば]られたのに、彼[かれ]らは叫[さけ]ばない。"
  14: "その魂[たましい]は若[わか]さのうちに死[し]に、その命[いのち]は天使[てんし]たちに傷[きず]つけられて死[し]ぬであろう。"
  15: "彼[かれ]らが病[やまい]ある者[もの]と力[ちから]なき者[もの]を虐[しいた]げたからである。神は柔和[にゅうわ]な者[もの]の裁[さば]きを明[あき]らかにされる。"
  16: "また、神[かみ]はあなたを敵[てき]の口[くち]から引[ひ]き出[だ]された。深[ふか]み、その下[した]の流[なが]れ。そして、あなたの食卓[しょくたく]は脂[あぶら]で満[み]ちるほどに下[くだ]った。"
  17: "しかし、正[ただ]しい者[もの]から裁[さば]きが欠[か]けることはない。"
  18: "不敬[ふけい]な者[もの]たちの上[うえ]には怒[いか]りがある。彼[かれ]らが不正[ふせい]のために受[う]け取[と]った贈[おく]り物[もの]の不敬[ふけい]のゆえである。"
  19: "あなたの心[こころ]が、苦[くる]しみのうちにある弱[よわ]い者[もの]たちの願[ねが]いから、力[ちから]を強[つよ]くするすべての者[もの]から、好[この]んで離[はな]れてはならない。"
  20: "夜[よる]を引[ひ]き出[だ]して、民[たみ]を彼[かれ]らの代[か]わりに上[のぼ]らせてはならない。"
  21: "しかし、身[み]を守[まも]れ。不正[ふせい]を行[おこな]ってはならない。あなたはそれを、貧[まず]しさよりも選[えら]んだのだから。"
  22: "見[み]よ、力[ちから]ある方[かた]はその力[ちから]をもって強[つよ]くあられる。この方[かた]のような支配者[しはいしゃ]が、ほかにだれがいるだろうか。"
  23: "だれが神[かみ]のわざを調[しら]べ尽[つ]くせるだろうか。だれが『神は不正[ふせい]を行[おこな]った』と言[い]えるだろうか。"
  24: "覚[おぼ]えていよ。神[かみ]のわざは大[おお]きい。人[ひと]々[びと]はそれらを治[おさ]めてきた。"
  25: "すべての人[ひと]は、自分[じぶん]のうちに、死[し]すべき者[もの]がどれほど傷[きず]つけられるかを見[み]ている。"
  26: "見[み]よ、力[ちから]ある方[かた]は大[おお]いなる方[かた]であり、わたしたちは知[し]ることができない。その年[とし]の数[かず]は限[かぎ]りがない。"
  27: "神[かみ]は雨[あめ]のしずくを数[かぞ]えられ、それは雨[あめ]として雲[くも]に注[そそ]がれる。"
  28: "古[ふる]いものが流[なが]れ出[で]、雲[くも]は数[かず]しれぬ人[ひと]々[びと]の上[うえ]に影[かげ]を落[お]とす。神は時[とき]を家畜[かちく]に定[さだ]め、彼[かれ]らは床[とこ]の順[じゅん]を知[し]っている。"
  29: "これらすべてのゆえに、あなたの思[おも]いは驚[おどろ]かないのか。あなたの心[こころ]は体[からだ]から離[はな]れないのか。雲[くも]の広[ひろ]がりと、その幕屋[まくや]の均[ひと]しさを、あなたが悟[さと]ることができるなら。"
  30: "見[み]よ、神[かみ]はその上[うえ]に光[ひかり]を広[ひろ]げ、海[うみ]の根[ね]を覆[おお]われた。"
  31: "まことに、神[かみ]はそれらによって民[たみ]を裁[さば]き、力[ちから]ある者[もの]に食[た]べ物[もの]を与[あた]えられる。"
  32: "神[かみ]はその手[て]の上[うえ]に光[ひかり]を覆[おお]い、それについて、迎[むか]え出[で]る者[もの]に命[めい]じられた。"
  33: "神[かみ]はそのことについて友[とも]に告[つ]げられる。すなわち、家畜[かちく]のことも、不正[ふせい]のことも。」"

notes:
  1: "Повествование (вводная формула): Προσθεὶς δὲ Ελιους ἔτι λέγει — «и приложив Елиус ещё, говорит» (csl «Приложив же еще елиус, рече»). Вне кавычек; речь 36:2–33 — одна цитата, которая продолжается в главе 37 (там нет новой формулы); здесь она закрыта в конце главы только ради баланса кавычек внутри главы."
  2: "Елиуй. Μεῖνόν με μικρὸν ἔτι — «подожди меня ещё немного» (μένω в императиве); ἵνα διδάξω σε — «чтобы я научил тебя» (διδάσκω); ἔτι γὰρ ἐν ἐμοί ἐστιν λέξις — «ибо ещё есть во мне слово» (λέξις — «слово, речь»; csl «еще бо у мене есть слово»)."
  3: "Елиуй. ἀναλαβὼν τὴν ἐπιστήμην μου μακράν — «взяв знание моё издалека» (ἀναλαμβάνω — «брать, воспринимать»; ἐπιστήμη — «знание»; μακράν — «издалека»); ἔργοις δέ μου δίκαια ἐρῶ — «и делами моими правое скажу» (csl «Приим хитрость мою отдалеча, делы же моими праведная реку»)."
  4: "Елиуй. ἐπ᾽ ἀληθείας καὶ οὐκ ἄδικα ῥήματα — «по истине и не неправедны слова» (ἄδικος — «неправедный»); ἀδίκως συνίεις — «неправо разумеешь» (συνίημι — «понимать»); тёмное место, csl «без правды уразумееши» (буд. время) — передано настоящим по смыслу."
  5: "Елиуй. γίγνωσκε δὲ ὅτι ὁ κύριος οὐ μὴ ἀποποιήσηται τὸν ἄκακον — «знай же, что Господь не отвергнет незлобивого» (ἀποποιέομαι — «отвергать»; ἄκακος — «незлобивый, невинный»; csl «не отринет незлобиваго»); δυνατὸς ἰσχύι καρδίας — «силён крепостью сердца» (ἰσχύς — «сила»; csl относит это к 36:6 — держимся LXX). Здесь мысль «Бог велик в силе»."
  6: "Елиуй. ἀσεβῆ οὐ μὴ ζωοποιήσει — «нечестивого не оживит» (ζωοποιέω — «оживлять»); κρίμα πτωχῶν δώσει — «суд нищих даст» (κρίμα — «суд», т. е. правое дело бедных; csl «суд нищым даст»)."
  7: "Елиуй. οὐκ ἀφελεῖ ἀπὸ δικαίου ὀφθαλμοὺς αὐτοῦ — «не отнимет от праведного очей Своих» (ἀφαιρέω — «отнимать»); μετὰ βασιλέων εἰς θρόνον καθιεῖ αὐτούς — «с царями на престол посадит их» (καθίζω — «сажать»); εἰς νεῖκος — «в победу» (νεῖκος обычно «ссора, распря», здесь, вероятно, «победа»; csl «на победу»); ὑψωθήσονται — «возвысятся»."
  8: "Елиуй. καὶ εἰ πεπεδημένοι ἐν χειροπέδαις — «и если, связанные в ручных оковах» (πεδάω — «связывать»; χειροπέδη — «ручные оковы»; csl «связаннии в ручных узах»); συσχεθήσονται ἐν σχοινίοις πενίας — «будут держимы в верёвках бедности» (σχοινίον — «верёвка»; πενία — «бедность»). Условие продолжается в 36:9–10."
  9: "Елиуй. ἀναγγελεῖ αὐτοῖς τὰ ἔργα αὐτῶν — «возвестит им дела их» (ἀναγγέλλω); τὰ παραπτώματα αὐτῶν — «прегрешения их» (παράπτωμα); ὅτι ἰσχύσουσιν — «что они укрепятся» (ἰσχύω; csl «яко укрепятся»). Тёмное: возможно, «что они возобладали» (превозмогли); передано буквально."
  10: "Елиуй. ἀλλὰ τοῦ δικαίου εἰσακούσεται — «но праведного услышит» (εἰσακούω; род. падеж, ед. ч.); καὶ εἶπεν ὅτι ἐπιστραφήσονται ἐξ ἀδικίας — «и сказал, что обратятся от неправды» (ἐπιστρέφω; косвенная речь, без кавычек; csl «и рече, яко обратятся от неправды»)."
  11: "Елиуй. ἐὰν ἀκούσωσιν καὶ δουλεύσωσιν — «если услышат и послужат» (δουλεύω — «служить»); συντελέσουσιν τὰς ἡμέρας αὐτῶν ἐν ἀγαθοῖς — «завершат дни свои во благах» (συντελέω — «завершать»); τὰ ἔτη αὐτῶν ἐν εὐπρεπείαις — «и годы свои в благолепии» (εὐπρέπεια — «благолепие, красота»; csl «в благолепоте»)."
  12: "Елиуй. ἀσεβεῖς δὲ οὐ διασῴζει — «нечестивых же не спасёт» (διασῴζω); παρὰ τὸ μὴ βούλεσθαι εἰδέναι αὐτοὺς τὸν κύριον — «из-за того, что не хотели знать Господа» (παρά + inf.); διότι νουθετούμενοι ἀνήκοοι ἦσαν — «ибо, будучи вразумляемы, были непослушны» (νουθετέω; ἀνήκοος — «непослушный»; csl «учими не послушливи беша»)."
  13: "Елиуй. ὑποκριταὶ καρδίᾳ — «лицемеры сердцем» (ὑποκριτής — «лицемер»); τάξουσιν θυμόν — «положат гнев» (τάσσω — «ставить, полагать»; csl «возмутят ярость»); οὐ βοήσονται, ὅτι ἔδησεν αὐτούς — «не возопиют, ибо Он связал их» (δέω — «связывать»)."
  14: "Елиуй. ἀποθάνοι τοίνυν ἐν νεότητι ἡ ψυχὴ αὐτῶν — «да умрёт же в юности душа их» (ἀποθάνοι — оптатив; νεότης — «юность»); ἡ δὲ ζωὴ αὐτῶν τιτρωσκομένη ὑπὸ ἀγγέλων — «жизнь же их, уязвляемая ангелами» (τιτρώσκω — «ранить»; csl «житие же их уязвляемо ангелы»). Тёмное: о казнящих ангелах."
  15: "Елиуй. ἀνθ᾽ ὧν ἔθλιψαν ἀσθενῆ καὶ ἀδύνατον — «за то, что притеснили немощного и бессильного» (ἀνθ᾽ ὧν — «за то, что»; θλίβω — «теснить»); κρίμα δὲ πραέων ἐκθήσει — «и суд кротких изложит» (πραΰς — «кроткий»; ἐκτίθημι — «излагать, производить»; csl «суд же кротких изложит»). В ru/МТ иное («спасает бедного…»), в LXX этой мысли нет."
  16: "Елиуй. καὶ προσέτι ἠπάτησέν σε ἐκ στόματος ἐχθροῦ — «и ещё обманул/увлёк тебя от уст врага» (ἀπατάω — «обманывать, увлекать»; csl «исторгну тя от уст вражиих» — иное чтение); ἄβυσσος, κατάχυσις ὑποκάτω αὐτῆς — «бездна, разлитие под нею» (κατάχυσις — «разлитие, поток»; отрицания при этих словах в греч. нет, поэтому не добавлено); κατέβη τράπεζά σου πλῆρης πιότητος — «сошёл стол твой, полный тука» (πιότης — «тук, жир»; csl «сниде трапеза твоя исполнена тука»). Место тёмное."
  17: "Елиуй. οὐχ ὑστερήσει δὲ ἀπὸ δικαίων κρίμα — «не оскудеет же у праведных суд» (ὑστερέω — «недоставать, лишаться»; csl «не оскудеет же от праведных суд»). В рукописной традиции стих короткий; в ru/МТ он продолжен иначе — не внесено."
  18: "Елиуй. θυμὸς δὲ ἐπ᾽ ἀσεβεῖς ἔσται — «ярость же на нечестивых будет» (θυμός); δι᾽ ἀσέβειαν δώρων — «за нечестие даров» (δῶρον — «дар»; csl «нечестия ради даров их»); ὧν ἐδέχοντο ἐπ᾽ ἀδικίαις — «которые они принимали за неправды» (δέχομαι — «принимать»; csl «ихже приимаху на неправде»)."
  19: "Елиуй. μή σε ἐκκλινάτω ἑκὼν ὁ νοῦς — «да не уклонит тебя добровольно ум» (ἐκκλίνω — «уклонять»; ἑκών — «добровольно»; νοῦς — «ум»); δεήσεως ἐν ἀνάγκῃ ὄντων ἀδυνάτων — «прошения немощных, находящихся в нужде» (δέησις — «прошение»; ἀνάγκη — «нужда, беда»); πάντας τοὺς κραταιοῦντας ἰσχύν — «и всех, укрепляющих силу» (κραταιόω). Тёмное место, передано близко к csl."
  20: "Елиуй. μὴ ἐξελκύσῃς τὴν νύκτα — «не привлеки ночь» (ἐξελκύω — «вытаскивать, привлекать»; csl «не привлецы нощи»); τοῦ ἀναβῆναι λαοὺς ἀντ᾽ αὐτῶν — «чтобы взошли народы вместо них» (ἀντί — «вместо»; csl «еже взыти людем вместо их»)."
  21: "Елиуй. ἀλλὰ φύλαξαι μὴ πράξῃς ἄτοπα — «но берегись, не сделай неуместного» (φυλάσσω — «беречься»; ἄτοπος — «неуместный, злой»; csl «сохранися, да не содееши зла»); ἐπὶ τοῦτον γὰρ ἐξελέξω ἀπὸ πτωχείας — «ибо это ты избрал вместо нищеты» (ἐκλέγω; ἀπό — «вместо»; πτωχεία — «нищета, страдание»). В csl иначе: «сих бо ради изят еси от нищеты» («за это ты изъят из нищеты») — уникальное чтение, расходится и с LXX, и с контекстом, поэтому взят LXX, csl в notes."
  22: "Елиуй. ἰδοὺ ὁ ἰσχυρὸς κραταιώσει ἐν ἰσχύι αὐτοῦ — «вот, Крепкий укрепится в силе Своей» (κραταιόω — «укреплять»; csl «крепкий удержит крепостию своею»); τίς γάρ ἐστιν κατ᾽ αὐτὸν δυνάστης — «ибо кто есть, как Он, властелин?» (δυνάστης — «властелин, сильный»; csl «кто бо есть, якоже той, силен?»)."
  23: "Елиуй. τίς δέ ἐστιν ὁ ἐτάζων αὐτοῦ τὰ ἔργα — «кто же есть испытующий дела Его?» (ἐτάζω — «испытывать, исследовать»); ἢ τίς ὁ εἴπας Ἔπραξεν ἄδικα — «или кто сказал: сделал неправое?» (πράσσω). Слова хулящего — 『…』."
  24: "Елиуй. μνήσθητι ὅτι μεγάλα ἐστὶν αὐτοῦ τὰ ἔργα — «помни, что велики дела Его» (μνήσθητι — «помни»); ὧν ἦρξαν ἄνδρες — «которыми владели мужи» (ἄρχω — «начальствовать, владеть»; csl «имиже владеша мужие»). Тёмное: возможно, «которые начали люди» (ἄρχω также «начинать»); передано по csl."
  25: "Елиуй. πᾶς ἄνθρωπος εἶδεν ἐν ἑαυτῷ — «всякий человек увидел в себе» (ἐν ἑαυτῷ — «в себе»); ὅσοι τιτρωσκόμενοί εἰσιν βροτοί — «сколь уязвляемы смертные» (τιτρώσκω — «ранить»; βροτός — «смертный»; csl «елицы уязвляеми суть человецы»). Тёмное место; мысль о хрупкости человека сохранена без сглаживания."
  26: "Елиуй. ἰδοὺ ὁ ἰσχυρὸς πολύς — «вот, Крепкий велик» (πολύς — «многий, великий»; csl «крепкий великий»); καὶ οὐ γνωσόμεθα — «и мы не познаем» (γινώσκω); ἀριθμὸς ἐτῶν αὐτοῦ καὶ ἀπέραντος — «и число лет Его беспредельно» (ἀπέραντος — «бесконечный»; csl «безконечное»). Здесь мысль «Бог велик в силе Своей»."
  27: "Елиуй. ἀριθμηταὶ δὲ αὐτῷ σταγόνες ὑετοῦ — «исчислены Ему капли дождя» (ἀριθμητός — «исчислимый»; σταγών — «капля»; ὑετός — «дождь»); ἐπιχυθήσονται ὑετῷ εἰς νεφέλην — «изольются дождём в облако» (ἐπιχέω — «изливать»; csl «излиются дождем во облак»)."
  28: "Елиуй. ῥυήσονται παλαιώματα — «потекут обветшания» (ῥέω — «течь»; παλαίωμα — «обветшалое, старое»; csl «потекут обетшания»); ἐσκίασεν δὲ νέφη ἐπὶ ἀμυθήτων βροτῶν — «осенили же облака над неисчислимыми смертными» (σκιάζω — «осенять»; ἀμύθητος — «несказанный, бесчисленный»); далее подстих модуля «28a» (метка не выводится): ὥραν ἔθετο κτήνεσιν — «время поставил скоту» (κτῆνος — «скот»); οἴδασιν δὲ κοίτης τάξιν — «знают же ложа чин» (τάξις — «порядок»; csl «время постави скоту, ведят же ложа чин»). Место тёмное."
  29: "Елиуй. ἐπὶ τούτοις πᾶσιν οὐκ ἐξίσταταί σου ἡ διάνοια — «над всем этим не изумляется ли твой ум?» (ἐξίστημι — «изумляться»; διάνοια — «ум, мысль»; вопрос передан двумя вопросами; csl относит это к концу 36:28); οὐδὲ διαλλάσσεταί σου ἡ καρδία ἀπὸ σώματος — «и не изменяется ли сердце твоё от тела?» (διαλλάσσω — «изменять»; тёмное); ἐὰν συνῇς ἀπεκτάσεις νεφέλης — «если постигнешь пространства облака» (ἀπέκτασις — «протяжение»); ἰσότητα σκηνῆς αὐτοῦ — «соразмерность шатра Его» (ἰσότης — «равенство»; σκηνή — «шатёр»; csl «равенство скинии его»)."
  30: "Елиуй. ἰδοὺ ἐκτείνει ἐπ᾽ αὐτὸν ἠδώ — «вот, простирает на него…»: ἠδώ — тёмное, вероятно испорченное слово (возможно, ἠχώ «отзвук»), csl читает «свет» — по паритету взят церковный «свет» (光[ひかり]), LXX-форма в notes; ἐκάλυψεν ῥιζώματα τῆς θαλάσσης — «покрыл корни моря» (ῥίζωμα — «корень»; csl «корения морская покры»)."
  31: "Елиуй. ἐν γὰρ αὐτοῖς κρινεῖ λαούς — «ибо ими судит народы» (ἐν αὐτοῖς — «ими», т. е. дождём и облаками); δώσει τροφὴν τῷ ἰσχύοντι — «даст пищу крепкому» (τροφή — «пища»; ἰσχύων — «сильный, могущий»; csl «даст пищу могущему»)."
  32: "Елиуй. ἐπὶ χειρῶν ἐκάλυψεν φῶς — «на руках покрыл свет» (ἐπὶ χειρῶν — «на руках»; csl «на руку покры свет»); ἐνετείλατο περὶ αὐτῆς ἐν ἀπαντῶντι — «заповедал о нём встречающему» (ἐντέλλομαι; ἀπαντάω — «встречать»; αὐτῆς — ж. род, тёмное согласование; csl «заповеда о нем сретающему»)."
  33: "Елиуй. ἀναγγελεῖ περὶ αὐτοῦ φίλον αὐτοῦ — «возвестит о нём друга его» (ἀναγγέλλω; φίλος — «друг»; csl «возвестит о нем другу своему Господь»); κτῆσις καὶ περὶ ἀδικίας — «стяжание и о неправде» (κτῆσις — «имущество, скот»; csl «стяжание, и о неправде»). Место тёмное, возможно испорченное; передано по csl. Здесь закрывается цитата 36:2–33; речь продолжается в главе 37 — в iov_37.yml кавычку нужно снова открыть в 37:1 и закрыть в 37:24."
