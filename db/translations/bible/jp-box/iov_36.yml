# jp-box, Иов, глава 36. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 36: четвёртая речь Елиуя — «подожди немного» (2–4), Бог не отвергает незлобивого
# и судит по правде (5–12), лицемеры погибают (13–15), урок Иову: не уклонись в неправду
# (16–21), величие Бога в творении (22–33).
# Голоса: 36:1 — вводная формула Елиуя, повествование, вне кавычек; 36:2–33 — его речь,
# одна цитата 「…」, которая ПРОДОЛЖАЕТСЯ В ГЛАВЕ 37 (37:1 — без новой формулы,
# речь идёт до 37:24). Кавычка закрыта в конце 36:33 ради баланса главы; в iov_37.yml
# её нужно снова открыть в 37:1 и закрыть в 37:24. Внутри речи — слова хулящего
# Бога: 『…』: 23.
# Нумерация по gr: 33 стиха, как в csl-ru и ru. Расхождения: слав. относит
# «силен крепостию сердца» (LXX 36:5b) к началу 36:6, а «О всех сих не дивитлитися ум…»
# (LXX 36:29a) — к концу 36:28; держимся деления LXX. В 36:28 модуль держит подстих
# «28a» — метка не выводится, текст переведён внутри стиха (см. notes 28).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): ヨブ, エリフ.

