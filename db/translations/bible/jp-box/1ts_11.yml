# jp-box, 1-я Царств, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в книге нет.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы — по греческому.
# Глава 11: Наас у Иависа Галаадского (1–3), весть и плач в Гиве (4–5), Дух
# Господень на Сауле и рассечённые волы (6–7), смотр в Везеке (8), обещание
# помощи (9–10), победа над аммонитянами (11), помилование (12–13), обновление
# царства в Галгале (14–15).
# Речи — 「…」: старейшины Иависа (1, 3, 10), Наас (2), Саул (5, 13), послание
# Саула (7), Саул с вестью внутри (9, вложенная 『…』), народ (12, вложенная
# цитата 『…』), Самуил (14). Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе); слав. добавление
# «мужие иависа галаадскаго» в 11:3 в текст не внесено — см. notes.
# Сносок ⟨…⟩ нет: 契約, 燔祭, 酬恩祭, 王 уже пояснены в корпусе; новых терминов нет.
# Отличия LXX: 11:1 — «около месяца» (в ru без этого); 11:5 — gr «шёл утром
# с поля» (в ru «позади волов» — по МТ); 11:8 — Αβιεζεκ ἐν Βαμα (в csl «в везеце,
# в ваме», в ru «в Везеке»), численность 600 000 и 70 000 (в ru 300 000 и 30 000);
# 11:15 — gr «возрадовался Самуил» (в csl «саул»).

