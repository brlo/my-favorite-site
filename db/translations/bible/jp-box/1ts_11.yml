verses:
  1: "一[ひと]か月[つき]ほどたって、アンモン人[じん]のナアスが上[のぼ]って来[き]て、ヤビス・ギレアデに対して陣[じん]を敷[し]いた。ヤビスの男[おとこ]たちはみな、ナアスに言[い]った。「わたしたちと契約[けいやく]を結[むす]んでください。そうすれば、あなたに仕[つか]える。」"
  2: "アンモン人[じん]のナアスは彼[かれ]らに言[い]った。「この条件[じょうけん]で、わたしはあなたがたと契約[けいやく]を結[むす]ぼう。あなたがたの右[みぎ]の目[め]をすべてえぐり出[だ]し、イスラエルに恥[はじ]を負[お]わせる、という条件だ。」"
  3: "ヤビスの男[おとこ]たちは彼[かれ]に言[い]った。「七日[なぬか]の猶予[ゆうよ]をわたしたちに与[あた]え、イスラエルの全[ぜん]領[りょう]に使者[ししゃ]を送[おく]らせてください。もしわたしたちを救[すく]う者[もの]がないなら、あなたがたのところへ出[で]て行[い]く。」"
  4: "使者[ししゃ]たちはサウルのギベアへ来[き]て、この言葉[ことば]を民[たみ]の耳[みみ]に語[かた]った。民[たみ]はみな声[こえ]を上[あ]げて泣[な]いた。"
  5: "見[み]よ、サウルは野[の]から朝[あさ]のうちに来[き]ていた。サウルは言[い]った。「民[たみ]が泣[な]いているのは、どうしたことか。」彼[かれ]らはヤビスの男[おとこ]たちの言葉[ことば]を彼[かれ]に語[かた]った。"
  6: "サウルがこの言葉[ことば]を聞[き]くと、主[しゅ]の霊[れい]が彼[かれ]の上[うえ]に激[はげ]しく臨[のぞ]み、彼[かれ]の怒[いか]りは彼らに対して激しく燃[も]え上[のぼ]った。"
  7: "彼[かれ]は二頭[にとう]の牛[うし]を取[と]ってこれを切[き]り分[わ]け、使者[ししゃ]の手[て]によってイスラエルの全[ぜん]領[りょう]に送[おく]り、こう言[い]わせた。「サウルとサムエルに従[したが]って出[で]て来[こ]ない者[もの]の牛[うし]は、このようにされる。」すると、主[しゅ]への恐[おそ]れが民[たみ]を襲[おそ]い、彼[かれ]らは一[ひと]人[り]のように声[こえ]を上[あ]げた。"
  8: "サウルはアビエゼクのバマで彼[かれ]らを数[かぞ]えた。イスラエルの男[おとこ]は六十万人[ろくじゅうまんにん]、ユダの男は七万人[ななまんにん]であった。"
  9: "彼[かれ]は来[き]た使者[ししゃ]たちに言[い]った。「ヤビスの男[おとこ]たちにこう告[つ]げなさい。『明日[あす]、太陽[たいよう]が暖[あたた]かくなるころ、あなたがたに救[すく]いがある』と。」使者[ししゃ]たちは町[まち]へ来[き]て、ヤビスの男[おとこ]たちに告[つ]げた。彼[かれ]らは喜[よろこ]んだ。"
  10: "ヤビスの男[おとこ]たちはナアスに言[い]った。「明日[あす]、わたしたちはあなたがたのところへ出[で]て行[い]く。あなたがたの前[まえ]で良[よ]いと思[おも]うことを、わたしたちにしなさい。」"
  11: "翌日[よくじつ]、サウルは民[たみ]を三[みっ]つの隊[たい]に分[わ]け、朝[あさ]の見張[みは]りのころに陣営[じんえい]の中[なか]へ入[はい]って、昼[ひる]が暑[あつ]くなるまでアンモン人[じん]を討[う]った。残[のこ]った者[もの]たちは散[ち]り散[ぢ]りになり、二人[ふたり]そろって残った者[もの]はいなかった。"
  12: "民[たみ]はサムエルに言[い]った。「『サウルはわたしたちの王[おう]にならない』と言[い]ったのはだれか。その者[もの]たちを引[ひ]き渡[わた]せ。わたしたちが彼[かれ]らを殺[ころ]す。」"
  13: "サウルは言[い]った。「今日[きょう]はだれも死[し]なない。今日、主[しゅ]がイスラエルに救[すく]いを成[な]し遂[と]げられたからだ。」"
  14: "サムエルは民[たみ]に言[い]った。「さあ、ギルガルへ行[い]き、そこで王国[おうこく]を新[あら]たにしよう。」"
  15: "民[たみ]はみなギルガルへ行[い]った。サムエルはそこで、主[しゅ]の前[まえ]でサウルに油[あぶら]を注[そそ]いで王[おう]とし、主の前でいけにえと酬恩祭[しゅうおんさい]をささげた。サムエルとイスラエルは皆、大[おお]いに喜[よろこ]んだ。"

notes:
  1: "ὡς μετὰ μῆνα — спустя около месяца (в ru этого нет). Ναας ὁ Αμμανίτης — Наас Аммонитянин (ナアス; евр. Нахаш). παρεμβάλλει ἐπὶ Ιαβις Γαλααδ — становится станом против Иависа Галаадского (ヤビス・ギレアデ). Διάθου ἡμῖν διαθήκην — заключи с нами завет."
  2: "ἐξορύξαι … πάντα ὀφθαλμὸν δεξιόν — выкопать каждый правый глаз (ἐξορύσσω). θήσομαι ὄνειδος ἐπὶ Ισραηλ — положу позор на Израиль (ὄνειδος)."
  3: "Ἄνες ἡμῖν ἑπτὰ ἡμέρας — оставь нам семь дней (ἀνίημι). εἰς πᾶν ὅριον Ισραηλ — во все пределы Израиля (ὅριον). ὁ σῴζων ἡμᾶς — спасающий нас. В csl добавлено «галаадскаго» при мужах Иависа — в gr его нет."
  4: "οἱ ἄγγελοι — вестники (ἄγγελος). εἰς Γαβαα — в Гиву (Γαβαα; ギベア). λαλοῦσιν … εἰς τὰ ὦτα τοῦ λαοῦ — говорят в уши народа. ἦραν τὴν φωνήν — подняли голос."
  5: "μετὰ τὸ πρωῒ ἐξ ἀγροῦ — утром с поля (в ru «позади волов» — по МТ). Τί ὅτι κλαίει ὁ λαός — «что это, что плачет народ». διηγοῦνται — рассказывают (διηγέομαι)."
  6: "ἐφήλατο πνεῦμα κυρίου — «ринулся Дух Господень» (ἐφάλλομαι). ἐθυμώθη … ὀργὴ αὐτοῦ σφόδρα — сильно воспламенился гнев его (θυμόω)."
  7: "ἐμέλισεν αὐτὰς — рассек их на части (μελίζω). ἐν χειρὶ ἀγγέλων — рукою вестников. Ὃς οὐκ ἔστιν ἐκπορευόμενος ὀπίσω Σαουλ καὶ ὀπίσω Σαμουηλ — кто не выйдет вслед Саула и вслед Самуила. κατὰ τάδε ποιήσουσιν — так сделают. ἐπῆλθεν ἔκστασις κυρίου — напал ужас, исступление Господне (ἔκστασις; слав. «ужас»). ὡς ἀνὴρ εἷς — как один человек."
  8: "ἐπισκέπτεται — пересчитывает, делает смотр (ἐπισκέπτομαι). Αβιεζεκ ἐν Βαμα — форма gr (в csl «в везеце, в ваме» — два топонима, в ru «в Везеке»; вероятно, в LXX слилось ἐν Βεζεκ и Βαμα). ἑξακοσίας χιλιάδας — шестьсот тысяч; ἑβδομήκοντα χιλιάδας — семьдесят тысяч (в ru 300 000 и 30 000 — по МТ)."
  9: "Αὔριον ὑμῖν ἡ σωτηρία — завтра вам спасение. διαθερμάναντος τοῦ ἡλίου — когда солнце обогреет (διαθερμαίνω). εὐφράνθησαν — обрадовались."
  10: "ποιήσετε ἡμῖν τὸ ἀγαθὸν ἐνώπιον ὑμῶν — сделайте нам доброе пред вами, т. е. как вам угодно."
  11: "ἔθετο … εἰς τρεῖς ἀρχάς — поставил в три отряда (ἀρχή). ἐν φυλακῇ τῇ πρωινῇ — в утреннюю стражу. ἔτυπτον — поражали (τύπτω). ἕως διεθερμάνθη ἡ ἡμέρα — до того как день разогрелся. διεσπάρησαν — рассеялись (διασπείρω). οὐχ ὑπελείφθησαν … δύο κατὰ τὸ αὐτό — не осталось двоих вместе."
  12: "Τίς ὁ εἴπας — кто сказал. παράδος τοὺς ἄνδρας — предай мужей (παραδίδωμι). θανατώσομεν — умертвим (θανατόω)."
  13: "Οὐκ ἀποθανεῖται οὐδείς — никто не умрёт. σήμερον κύριος ἐποίησεν σωτηρίαν — сегодня Господь совершил спасение."
  14: "Πορευθῶμεν — пойдём (сослагательное, увещание). ἐγκαινίσωμεν τὴν βασιλείαν — обновим царство (ἐγκαινίζω — «обновить, освятить»; слав. «обновим»)."
  15: "ἔχρισεν … εἰς βασιλέα — помазал в царя. ἔθυσεν θυσίας καὶ εἰρηνικάς — принёс жертвы и мирные. εὐφράνθη Σαμουηλ καὶ πᾶς Ισραηλ — возрадовался Самуил и весь Израиль (в csl «саул» — иное чтение). ὥστε λίαν — весьма."
