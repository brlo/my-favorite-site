# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
# Глава 15 — христианское добавление: пророчество-«горе» против языческого мира.
# 1–4 повеление записать пророчество; 5–13 суд над землёй и Египтом;
# 14–19 горе веку, войны и разорение; 20–27 цари земли и отмщение;
# 28–33 видение грозного с востока (змии, кармоняне, ассирияне);
# 34–45 бури, звёзды, потопление Вавилона; 46–63 горе Асии (= Риму).
# Вавилон в 15–16 — Рим (церковная традиция чтения; ср. Откр 17–18); в тексте
# оставлено バビロン, отождествление — только в notes.
