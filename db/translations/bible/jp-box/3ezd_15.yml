verses:
  1: "主[しゅ]は言[い]われる。「わたしの民[たみ]の耳[みみ]に、わたしがあなたの口[くち]に授[さず]ける預言[よげん]の言葉[ことば]を語[かた]れ。"
  2: "それらを羊皮紙[ようひし]に書[か]き記[しる]させよ。それらは真[しん]実[じつ]で確[たし]かなものであるからだ。"
  3: "あなたに敵[てき]する思[おも]いを恐[おそ]れるな。語[かた]る者[もの]たちの不信仰[ふしんこう]に心[こころ]を乱[みだ]されるな。"
  4: "信[しん]じない者[もの]はみな、自分[じぶん]の不信仰[ふしんこう]のうちに死[し]ぬからである。"
  5: "見[み]よ、わたしは地[ち]の円[えん]の上[うえ]に災[わざわ]いを、剣[つるぎ]と飢[う]えと死[し]と滅[ほろ]びを下[くだ]す、と主[しゅ]は言[い]われる。"
  6: "不法[ふほう]が全[ぜん]地[ち]を汚[けが]し、彼らの害[がい]になるわざが満[み]ちているからである。"
  7: "それゆえ、主[しゅ]は言[い]われる。"
  8: "わたしは、彼らが不法[ふほう]に働[はたら]く不敬[ふけい]について、もはや黙[だま]らない。彼らが悪[わる]く行[おこな]うことをも、もはや耐[た]えない。見[み]よ、罪[つみ]なき正[ただ]しい血[ち]が、また正[ただ]しい者[もの]たちの魂[たましい]が、絶[た]え間[ま]なくわたしに叫[さけ]んでいる。"
  9: "わたしは必[かなら]ず彼らに報復[ほうふく]する、と主[しゅ]は言[い]われる。わたしは彼らから、すべての罪[つみ]なき血[ち]をわたしのもとへ受[う]け取[と]る。"
  10: "見[み]よ、わたしの民[たみ]は屠[ほふ]り場[ば]へ引[ひ]かれる群[む]れのようだ。わたしは、彼らがエジプトの地[ち]に住[す]むことをもはや耐[た]えない。"
  11: "わたしは強[つよ]い手[て]と高[たか]く上[あ]げた腕[うで]をもって彼らを導[みちび]き出[だ]し、かつてのようにエジプトを災[わざわ]いで打[う]ち、その全[ぜん]地[ち]を滅[ほろ]ぼす。"
  12: "エジプトは泣[な]き叫[さけ]び、その基[もと]は神[かみ]が下[くだ]す災[わざわ]いと罰[ばつ]によって打[う]たれる。"
  13: "地[ち]を耕[たがや]す農夫[のうふ]たちは泣[な]く。彼らの種[たね]は、錆[さび]と雹[ひょう]と恐[おそ]ろしい星[ほし]によって乏[とぼ]しくなるからである。"
  14: "災[わざわ]いだ、この世[よ]と、そこに住[す]む者[もの]たちに。"
  15: "彼らを砕[くだ]く剣[つるぎ]が近[ちか]づき、民[たみ]は民[たみ]に逆[さか]らって戦[たたか]いを起[お]こし、その手[て]には剣[つるぎ]があるからである。"
  16: "人[ひと]々[びと]は不安定[ふあんてい]になり、互[たが]いに打[う]ち勝[か]とうとする者[もの]たちは自分[じぶん]の王[おう]を軽[かろ]んじ、道[みち]を導[みちび]く者[もの]たちは自分[じぶん]の権力[けんりょく]のうちで自分[じぶん]のわざを顧[かえり]みなくなる。"
  17: "人[ひと]は町[まち]へ行[い]こうと望[のぞ]んでも、できない。"
  18: "彼らの高[こう]慢[まん]のゆえに町々[まちまち]は騒[さわ]ぎ乱[みだ]れ、家[いえ]は砕[くだ]かれ、人[ひと]々[びと]は恐[おそ]れる。"
  19: "人[ひと]は隣人[りんじん]に同情[どうじょう]せず、彼らの家[いえ]を武[ぶ]力[りょく]で滅[ほろ]ぼし、彼らの財産[ざいさん]を奪[うば]い取[と]る。パンが欠[か]け、多[おお]くの苦[くる]しみがあるからである。"
  20: "見[み]よ、わたしは地[ち]のすべての王[おう]たちを呼[よ]び集[あつ]める、と主[しゅ]は言[い]われる。東[ひがし]と南[みなみ]、北[きた]とレバノンから来[く]る者[もの]たちが、わたしを恐[おそ]れ、自[みずか]らに立[た]ち返[かえ]り、彼らがかの者[もの]たちにしたことを、そのまま報[むく]い返[かえ]すために。"
  21: "彼らが今日[きょう]までわたしの選[えら]ばれた者[もの]たちに行[おこな]ってきたとおりに、わたしも行[おこな]い、彼らの懐[ふところ]に報[むく]い返[かえ]す。主[しゅ]なる神[かみ]はこう言[い]われる。"
  22: "わたしの右[みぎ]の手[て]は罪[つみ]ある者[もの]たちを容[ゆる]さず、剣[つるぎ]は、地[ち]の上[うえ]に罪[つみ]なき血[ち]を流[なが]す者[もの]たちの上[うえ]に休[やす]まらない。"
  23: "その怒[いか]りから火[ひ]が出[で]て、地[ち]の基[もと]を焼[や]き尽[つ]くし、罪[つみ]ある者[もの]たちは燃[も]える柴[しば]のようになった。"
  24: "災[わざわ]いだ、罪[つみ]を犯[おか]し、わたしの戒[いまし]めを守[まも]らない者[もの]たちに、と主[しゅ]は言[い]われる。"
  25: "わたしは彼らを容[ゆる]さない。子[こ]らよ、権力[けんりょく]から去[さ]れ。わたしの聖[せい]なるものを汚[けが]すな。"
  26: "主[しゅ]は、自分[じぶん]に罪[つみ]を犯[おか]す者[もの]をすべて知[し]っておられ、それゆえ彼らを死[し]と屠[ほふ]りに渡[わた]された。"
  27: "地[ち]の円[えん]の上[うえ]にすでに災[わざわ]いが来[き]た。あなたがたはその中[なか]に留[とど]まる。神[かみ]はあなたがたを救[すく]わない。あなたがたが神[かみ]の前[まえ]に罪[つみ]を犯[おか]したからである。"
  28: "見[み]よ、恐[おそ]ろしい幻[まぼろし]が、東[ひがし]からその顔[かお]を向[む]けて来[く]る。"
  29: "アラビアの蛇[へび]の子[こ]らが多[おお]くの戦車[せんしゃ]に乗[の]って出[で]て来[く]る。その数[かず]は風[かぜ]の息[いき]のように地[ち]の上[うえ]を駆[か]け巡[めぐ]り、それを聞[き]く者[もの]はみな恐[おそ]れて震[ふる]える。"
  30: "カルモン人[じん]は怒[いか]りに狂[くる]って、森[もり]から猪[いのしし]のように出[で]て来[く]る。彼らは大[おお]きな力[ちから]をもって来[き]て彼らと戦[たたか]い、アッシリアの地[ち]の一部[いちぶ]を荒[あ]らす。"
  31: "その後[あと]、自分[じぶん]の生[う]まれを覚[おぼ]えている蛇[へび]たちが勝[か]ち、大[おお]きな力[ちから]を合[あ]わせて彼らを追[お]いかけるために向[む]きを変[か]える。"
  32: "彼らは心[こころ]を乱[みだ]し、その力[ちから]の前[まえ]に黙[だま]り込み、足[あし]を向[む]けて逃[に]げる。"
  33: "アッシリアの地方[ちほう]から、待[ま]ち伏[ぶ]せする者[もの]が彼らを取[と]り囲[かこ]み、彼らのうちの一人[ひとり]を殺[ころ]す。彼らの陣営[じんえい]に恐[おそ]れと恐怖[きょうふ]が起[お]こり、王[おう]たちへの憤[いきどお]りが生[しょう]じる。"
  34: "見[み]よ、雲[くも]が東[ひがし]と北[きた]から南[みなみ]まで来[き]る。その顔[かお]はひどく恐[おそ]ろしく、怒[いか]りと嵐[あらし]に満[み]ちている。"
  35: "彼らは互[たが]いに打[う]ち合[あ]い、多[おお]くの星[ほし]を地[ち]の上[うえ]に、また彼らの星[ほし]を打[う]ち落[お]とす。剣[つるぎ]による血[ち]が胎[たい]にまで及[およ]ぶ。"
  36: "人[ひと]の汚[けが]れはらくだの鞍[くら]にまで及[およ]び、地[ち]の上[うえ]には大[おお]きな恐[おそ]れと恐怖[きょうふ]が満[み]ちる。"
  37: "この怒[いか]りを見[み]る者[もの]たちは恐[おそ]れ、震[ふる]えが彼らを捕[と]らえる。"
  38: "その後[あと]、南[みなみ]と北[きた]から、また西[にし]からの別[べつ]の一部[いちぶ]から、多[おお]くの嵐[あらし]が起[お]こる。"
  39: "東[ひがし]からの風[かぜ]が勝[か]ち、それを開[ひら]く。わたしが怒[いか]りのうちに起[お]こした雲[くも]も開[ひら]かれ、東[ひがし]の風[かぜ]と西[にし]の風[かぜ]による恐[おそ]れを生[しょう]むために備[そな]えられた星[ほし]は損[そこ]なわれる。"
  40: "大[おお]きく激[はげ]しい雲[くも]が怒[いか]りに満[み]ちて起[お]こり、星[ほし]もまた、全[ぜん]地[ち]とそこに住[す]む者[もの]を恐[おそ]れさせるために起[お]こる。彼らは高[たか]くそびえたすべての場所[ばしょ]に恐[おそ]ろしい星[ほし]を注[そそ]ぎ、"
  41: "火[ひ]と雹[ひょう]、飛[と]び交[か]う剣[つるぎ]、多[おお]くの水[みず]を注[そそ]ぎ、すべての野[の]とすべての泉[いずみ]を多[おお]くの水[みず]で満[み]たす。"
  42: "彼らは町々[まちまち]と城壁[じょうへき]、山[やま]と丘[おか]（と谷[たに]）、森[もり]の木[き]々[ぎ]、野原[のはら]の草[くさ]、彼らの麦[むぎ]を砕[くだ]く。"
  43: "彼らは揺[ゆ]るぎなくバビロンまで進[すす]み、それを打[う]ち砕[くだ]く。"
  44: "彼らはバビロンのもとへ集[あつ]まり、それを取[と]り囲[かこ]んで、星[ほし]とすべての激[はげ]しい怒[いか]りをその上[うえ]に注[そそ]ぐ。塵[ちり]と煙[けむり]が天[てん]にまで上[のぼ]り、周[まわ]りの者[もの]はみなバビロンのために泣[な]き叫[さけ]ぶ。"
  45: "そのもとに残[のこ]った者[もの]たちは、彼らを恐[おそ]れさせた者[もの]たちに仕[つか]える。"
  46: "そしてあなた、アシアよ。あなたはバビロンの望[のぞ]みと、その顔[かお]の栄光[えいこう]とに与[くみ]している。"
  47: "災[わざわ]いだ、哀[あわ]れな女[おんな]よ。あなたはバビロンに似[に]て、自分[じぶん]の娘[むすめ]たちを淫[いん]らに飾[かざ]り、あなたとともにいつも淫[みだ]らにふけろうと願[ねが]った愛人[あいじん]たちに喜[よろこ]ばれ、ほめたたえられるようにした。"
  48: "あなたは憎[にく]むべき者[もの]のすべてのわざと企[くわだ]てに倣[なら]った。"
  49: "それゆえ、と主[しゅ]は言[い]われる、わたしはあなたに、寡婦[かふ]となること、貧[まず]しさ、飢[う]え、剣[つるぎ]、そしてあなたの家[いえ]を暴[ぼう]力[りょく]と死[し]によって荒[あ]らし滅[ほろ]ぼす滅[ほろ]びを送[おく]る。"
  50: "あなたの力[ちから]の栄光[えいこう]は、あなたに送[おく]られた炎熱[えんねつ]が起[お]こるとき、花[はな]のように枯[か]れる。"
  51: "あなたは、女[おんな]たちに打[う]たれ傷[きず]つけられた最も貧[まず]しい者[もの]のように弱[よわ]り果[は]てる。有力[ゆうりょく]な者[もの]たちも愛人[あいじん]たちも、あなたを受[う]け入[い]れることができないからである。"
  52: "わたしがこのようにあなたを憎[にく]んだだろうか、と主[しゅ]は言[い]われる。"
  53: "あなたが、いつもわたしの選[えら]ばれた者[もの]たちを屠[ほふ]り、彼らを打[う]ち倒[たお]そうと手[て]を上[あ]げ、酔[よ]っていたときに彼らの死[し]について語[かた]らなかったのなら、そうではなかった。"
  54: "あなたの顔[かお]の美[うつく]しさを飾[かざ]れ。"
  55: "あなたの淫[いん]行[こう]の報酬[ほうしゅう]はあなたの懐[ふところ]にある。それゆえ、あなたは報[むく]いを受[う]ける。"
  56: "あなたがわたしの選[えら]ばれた者[もの]たちにしたとおりに、神[かみ]もあなたにそうし、あなたを災[わざわ]いへと渡[わた]される、と主[しゅ]は言[い]われる。"
  57: "あなたの子[こ]どもたちは飢[う]えで死[し]に、あなたは剣[つるぎ]で倒[たお]れ、あなたの町々[まちまち]は砕[くだ]かれ、あなたの者[もの]たちはみな野[の]で武[ぶ]器[き]によって倒[たお]れる。"
  58: "山[やま]にいる者[もの]たちは飢[う]えで死[し]に、パンに飢[う]えて自分[じぶん]の肉[にく]を食[た]べ、水[みず]に渇[かわ]いて血[ち]を飲[の]む。"
  59: "不幸[ふこう]のうちに海[うみ]を渡[わた]り、また災[わざわ]いを受[う]ける。"
  60: "移[うつ]り行[ゆ]く途中[とちゅう]で、彼らは打[う]ち壊[こわ]された町[まち]を襲[おそ]い、あなたの地[ち]のある部分[ぶぶん]を根[ね]こそぎにし、あなたの栄光[えいこう]の一部[いちぶ]を滅[ほろ]ぼす。そして再[ふたた]び、滅[ほろ]ぼされたバビロンへと戻[もど]る。"
  61: "あなたは彼らによって柴[しば]のように壊[こわ]され、彼らはあなたにとって火[ひ]のようになる。"
  62: "彼らはあなたとあなたの町々[まちまち]、あなたの地[ち]と山[やま]を焼[や]き尽[つ]くし、あなたのすべての森[もり]と実[み]のなる木[き]を火[ひ]で焼[や]き払[はら]う。"
  63: "あなたの息子[むすこ]たちは捕[と]らわれの身[み]に連[つ]れて行[い]かれ、あなたの財[ざい]は略奪[りゃくだつ]されて奪[うば]い取[と]られ、あなたの顔[かお]の栄光[えいこう]は滅[ほろ]ぼされる。」"

notes:
  1: "Во уши людем моим — «в уши народа Моего»; яже дам во уста твоя — «которые дам в уста твои»; глаголет Господь — вводка, вне кавычек."
  2: "На хартии — «на хартии (пергамене)»; яко верна и истинна суть — «ибо они верны и истинны»."
  3: "От помышлений на тя — «от помышлений против тебя»; неверности глаголющих — «неверие говорящих»."
  5: "На круг земный — «на круг земной», т. е. на ойкумену. «Рече Господь» — формула внутри речи."
  8: "Кровь неповинная и праведная вопиет ко мне — «кровь неповинная и праведная вопиет ко Мне» (ср. Быт 4:10)."
  10: "Яко стада к заколению ведутся — «как стадо на заклание ведётся»."
  11: "Мышцею высокою — «мышцей высокою» (ср. Исх 6:6); поражу (египет) казнию якоже прежде — «поражу Египет казнью, как прежде»."
  13: "От ржи и града — «от ржавчины и града»; от звезды страшныя — «от страшной звезды»."
  14: "Горе веку, и иже обитают в нем — «горе веку и тем, кто живёт в нём»."
  16: "Началницы путий — тёмное: «начальники путей». ru «начальники — о ходе дел своих»; передано «道を導く者たち» (ведущие пути)."
  20: "Тёмное: ко обращению къ себе — «к обращению к себе»; ru «чтобы обратились к себе самим». Передано описательно: «自らに立ち返り»; воздати, яже воздаша тем — «воздать, что они воздали тем»."
  25: "Тёмное: отидите, сынове, от власти — «отступите, сыны, от власти». ru «Удалитесь, сыновья отступников» — иное чтение, в тексте по слав."
  28: "Видение грозное, и лице его от востока — «видение грозное, и лицо его с востока»."
  29: "Рождения змиев аравских — «порождения аравийских змиев» (драконов); якоже дыхание (ветровъ) — «как дыхание ветров»."
  30: "Кармоняне — народ не отождествлён (カルモン人); вепри от дубравы — «вепри из дубравы»."
  33: "Обстоятель обстанет их — «осаждающий (находящийся в засаде) окружит их»; рвение на цари их — «ропот (негодование) на царей их»."
  35: "Сразят звезду многу на земли и звезду их — «свергнут многие звёзды на землю и звезду их»."
  39: "Тёмное: отворят его — «откроют его» (облако?); звезда… повредится — «звезда… повредится»."
  42: "Слав. «(и удолия)» — редакционная вставка в скобках, переведена («と谷»)."
  46: "Асия — римская провинция Асия; в 15–16 Вавилон понимается как Рим (ср. Откр 17–18), в тексте оставлено バビロン."
  49: "Губителство на разорение домов твоих от насилия и смерти — «погибель на разорение домов твоих от насилия и смерти»."
  51: "Тёмное: язвена и наказана от жен — «изъязвлена и наказана жёнами». ru «избитая и израненная женщинами» — то же чтение; оставлено по слав."
  53: "Егда упивалася еси — «когда ты упивалась»; условная конструкция продолжает вопрос 52: «если бы ты не убивала…»."
  54: "Украси лепоту лица твоего — «украшай красоту лица твоего» (ирония)."
  59: "Неблагополучна чрез моря приидеши — «в несчастии пойдёшь по морям»."
  60: "К вавилону превращенному — «к превращённому (разрушенному) Вавилону»."
