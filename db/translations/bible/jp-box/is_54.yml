# jp-box, Исаия, глава 54. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для гл. 54 есть только стих 54:1; сверен как свидетель
# церковного чтения (棄てられたる婦 — «оставленная жена»), в текст не взят;
# jp-ni не использовался. Разночтения сверены по gr-lxx-swete (Свит) — в notes.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 54: 1–3 «возвеселись, неплодная»: шатёр, потомство, города; 4–8 страх прочь,
# Господь — Творец и Искупитель, жена оставленная, малый гнев и вечная милость;
# 9–10 воды Ноя, горы и холмы, завет мира; 11–17 камни и стены нового города,
# наученные Богом сыновья, правда, кузнец и губитель, наследие служащих Господу.
# Голоса: 54:1–6 — призыв пророка, без кавычек (формулы «ибо сказал Господь» в 54:1
# и «сказал Бог твой» в 54:6 — вне кавычек); 54:7–17 — 「…» (слово Господа; формулы
# «сказал избавивший тебя Господь» в 54:8, «милостив к тебе» в 54:10 и «говорит
# Господь» в 54:17 — внутри речи, как в 1:11, потому что греч. и слав. ставят их
# внутри прямой речи).
# Нумерация по gr: 17 стихов, как у csl и ru. Слав. переносит «рече бо Господь»
# из конца 54:1 в начало 54:2 — держим gr; слав. 54:15 добавляет «и вселятся у тебе»
# (нет в LXX), 54:5 добавляет «святый» при «Бог Израилев» — внесено по паритету
# и оговорено в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 天幕, 杭, 碧玉, 水晶, ルビー, サファイア уже в корпусе.
# Имена — транслитерация греческого (LXX).

