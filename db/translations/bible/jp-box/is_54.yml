verses:
  1: "喜[よろこ]べ、子[こ]を産[う]まない不妊[ふにん]の女[おんな]よ。声[こえ]を張[は]り上[あ]げて叫[さけ]べ、産[う]みの苦[くる]しみを知[し]らない女よ。荒[あ]れ果[は]てた女[おんな]の子[こ]らは、夫[おっと]を持[も]つ女の子らよりも多[おお]い。主[しゅ]がそう言[い]われたからである。"
  2: "あなたの天幕[てんまく]の場所[ばしょ]を広[ひろ]げ、あなたの幕[まく]も広げよ。張[は]り渡[わた]せ、惜[お]しむな。あなたの綱[つな]を長[なが]くし、あなたの杭[くい]を強[つよ]くせよ。"
  3: "あなたはさらに右[みぎ]にも左[ひだり]にも広[ひろ]がり、あなたの子孫[しそん]は諸国[しょこく]の民[たみ]を嗣業[しぎょう]として受[う]け、荒[あ]れ果[は]てた都[みやこ]々[みやこ]に住[す]む。"
  4: "あなたが辱[はずかし]められたからといって、恐[おそ]れるな。あなたがそしられたからといって、恥[は]じるな。あなたは永遠[えいえん]の恥[はじ]を忘[わす]れ、やもめのそしりをもう思[おも]い出[だ]さないからである。"
  5: "あなたを造[つく]られる方[かた]は主[しゅ]である。その名[な]は万軍[ばんぐん]の主[しゅ]。あなたを贖[あがな]われた方[かた]はイスラエルの聖[せい]なる神[かみ]であり、その方[かた]は全[ぜん]地[ち]で呼[よ]ばれる。"
  6: "主[しゅ]はあなたを、捨[す]てられて心[こころ]が挫[くじ]けた女[おんな]として呼[よ]ばれたのではない。若[わか]いときから憎[にく]まれた女としてでもない、とあなたの神[かみ]は言[い]われる。"
  7: "「わたしはわずかの間[あいだ]、あなたを捨[す]てた。しかし、大[おお]きなあわれみをもって、あなたをあわれむ。"
  8: "わずかな怒[いか]りのうちに、わたしはあなたから顔[かお]を背[そむ]けた。しかし、永遠[えいえん]のあわれみをもって、あなたをあわれむ、とあなたを贖[あがな]った主[しゅ]は言[い]われる。"
  9: "ノアのときの水[みず]のことが、わたしにとってはこのとおりだからである。あのとき、わたしが地[ち]について彼に誓[ちか]ったように、わたしはあなたに対[たい]してもはや怒[いか]らず、あなたを脅[おど]かすこともない。"
  10: "山[やま]を移[うつ]し、あなたの丘[おか]を動[うご]かすことはない。そのように、わたしからあなたへのあわれみは尽[つ]きず、あなたの平和[へいわ]の契約[けいやく]も移[うつ]ることはない、とあなたに情[なさ]け深[ぶか]い主[しゅ]は言[い]われる。"
  11: "卑[ひく]くされ、揺[ゆ]れ動[うご]き、慰[なぐさ]められなかった者[もの]よ。見[み]よ、わたしはルビーであなたの石[いし]を、サファイアであなたの基[もとい]を整[ととの]える。"
  12: "わたしはあなたの胸壁[きょうへき]を碧玉[へきぎょく]に、あなたの門[もん]を水晶[すいしょう]の石[いし]に、あなたの周[まわ]りの囲[かこ]いをえり抜[ぬ]きの石にする。"
  13: "あなたの子[こ]らはみな、神[かみ]に教[おし]えられた者[もの]となり、あなたの子[こ]どもには大[おお]きな平和[へいわ]がある。"
  14: "あなたは義[ぎ]によって建[た]てられる。不正[ふせい]から遠[とお]ざかれ。あなたは恐[おそ]れることがなく、震[ふる]えもあなたに近[ちか]づかない。"
  15: "見[み]よ、寄留[きりゅう]の者[もの]たちが、わたしによってあなたのもとへ来[き]、あなたのもとに住[す]み、あなたのもとへ逃[に]げ込[こ]む。"
  16: "見[み]よ、わたしはあなたを造[つく]る。炭[すみ]を吹[ふ]いて仕事[しごと]のための器[うつわ]を作[つく]り出[だ]す鍛冶[かじ]のように、あなたを造るのではない。わたしはあなたを、滅[ほろ]ぼして朽[くち]させるために造ったのではない。"
  17: "あなたに敵[てき]して造[つく]られた器[うつわ]は、わたしが成[な]し遂[と]げさせない。あなたに逆[さか]らって裁[さば]きのために起[お]こるすべての声[こえ]も。あなたはそれらすべてに打[う]ち勝[か]つ。あなたに責[せ]めのある者[もの]たちは、その中[なか]にある。これが主[しゅ]に仕[つか]える者[もの]たちの嗣業[しぎょう]であり、あなたがたはわたしにとって正[ただ]しい者[もの]となる、と主[しゅ]は言[い]われる。」"

notes:
  1: "Εὐφράνθητι — «возвеселись» (εὐφραίνω); στεῖρα ἡ οὐ τίκτουσα — «бесплодная, не рождающая» (στείρα, τίκτω). ῥῆξον καὶ βόησον — «разорвись и возопи» (ῥήγνυμι, βοάω); ἡ οὐκ ὠδίνουσα — «не мучившаяся родами». τὰ τέκνα τῆς ἐρήμου — «дети пустынной, оставленной» (ἔρημος); в тексте 荒れ果てた女, смысл «оставленной без мужа» — в этой заметке (jp-joc: 棄てられたる婦, т. е. «оставленная жена»; в LXX и слав. — «пустынная»). εἶπεν γὰρ κύριος — формула в конце стиха по gr; слав. переносит её в начало 54:2 («Рече бо Господь»), деление держим по gr. Цитируется в Гал 4:27."
  2: "πλάτυνον τὸν τόπον τῆς σκηνῆς σου — «распространи место шатра твоего» (πλατύνω, σκηνή). αὐλαία — «покров, завеса» (слав. «покров»). πῆξον, μὴ φείσῃ — «водрузи, не пощади» (πήγνυμι, φείδομαι). σχοινίσματα — «верви» (слав. «ужя»); πάσσαλοι — «колья» (слав. «колие»); κατίσχυσον — «укрепи» (κατισχύω)."
  3: "ἔτι εἰς τὰ δεξιὰ καὶ εἰς τὰ ἀριστερὰ ἐκπέτασον — «ещё направо и налево распрострись» (ἐκπετάννυμι). τὸ σπέρμα σου ἔθνη κληρονομήσει — «семя твоё народы наследует» (κληρονομέω). πόλεις ἠρημωμένας κατοικιεῖς — «города опустошённые населишь» (κατοικέω)."
  4: "μὴ φοβοῦ ὅτι κατῃσχύνθης — «не бойся, что посрамлена» (καταισχύνω); μηδὲ ἐντραπῇς — «и не устыдись» (ἐντρέπω). αἰσχύνην αἰώνιον ἐπιλήσῃ — «срамоту вечную забудешь» (ἐπιλανθάνομαι); в Синодальном «посрамление юности твоей» — по МТ, не внесено. ὄνειδος τῆς χηρείας σου — «укоризну вдовства твоего» (χηρεία)."
  5: "κύριος ὁ ποιῶν σε — «Господь, создающий тебя»; в Синодальном «Творец твой — супруг твой» по МТ, в LXX слова «муж» нет. κύριος σαβαωθ ὄνομα αὐτῷ — «Господь Саваоф имя Ему». ὁ ῥυσάμενός σε — «избавивший тебя» (ῥύομαι); слав. добавляет «святый» («святый Бог израилев»), в LXX и у Свита только θεὸς Ισραηλ — добавка внесена по паритету (イスラエルの聖なる神), «святый» в LXX нет. πάσῃ τῇ γῇ κληθήσεται — «по всей земле назовётся»; в Синодальном «Богом всей земли назовётся» — по МТ."
  6: "ὀλιγόψυχον — «малодушную» (ὀλιγόψυχος); κέκληκέν σε — «призвал тебя» (καλέω). οὐδ᾿ ὡς γυναῖκα ἐκ νεότητος μεμισημμένην — «и не как жену от юности возненавиденную» (μισέω); в Синодальном «жену юности, которая была отвержена» — по МТ. εἶπεν ὁ θεός σου — формула в конце, вне кавычек."
  7: "χρόνον μικρὸν κατέλιπόν σε — «на малое время оставил тебя» (καταλείπω). μετὰ ἐλέους μεγάλου ἐλεήσω σε — «с милостью великою помилую тебя» (ἔλεος, ἐλεέω); figura etymologica сохранена (あわれみをもって…あわれむ)."
  8: "ἐν θυμῷ μικρῷ — «в ярости малой» (θυμός); в Синодальном «в жару гнева» — по МТ. ἀπέστρεψα τὸ πρόσωπόν μου — «отвратил лицо Моё» (ἀποστρέφω). ἐν ἐλέει αἰωνίῳ — «в милости вечной». εἶπεν ὁ ῥυσάμενός σε κύριος — «сказал избавивший тебя Господь»: формула внутри речи (как в 1:11), в тексте と、あなたを贖った主は言われる."
  9: "ἀπὸ τοῦ ὕδατος τοῦ ἐπὶ Νωε — «от воды, что при Ное», т. е. «как было с водой Ноя»; слав. «От воды, яже при нои». καθότι ὤμοσα αὐτῷ — «как Я поклялся ему» (ὄμνυμι). μὴ θυμωθήσεσθαι ἐπὶ σοὶ ἔτι — «не гневаться на тебя более». μηδὲ ἐν ἀπειλῇ σου — «и не в угрозе твоей»: оборот тёмный (σου — «твоей»), понят как «не угрожая тебе»; в тексте あなたを脅かすこともない, буквальный вариант — здесь. Стих в LXX обрывается, продолжение — в 54:10."
  10: "τὰ ὄρη μεταστήσεσθαι οὐδὲ οἱ βουνοί σου μετακινηθήσονται — «горы сдвинуться, и холмы твои не поколеблются»: инфинитив и будущее соединены несогласно (анаколуф), отсюда 山を移し、あなたの丘を動かすことはない. οὐδὲ τὸ παρ᾿ ἐμοῦ σοι ἔλεος ἐκλείψει — «и милость от Меня к тебе не оскудеет» (ἐκλείπω). ἡ διαθήκη τῆς εἰρήνης σου — «завет мира твоего». εἶπεν γὰρ κύριος Ἵλεώς σοι — «ибо сказал Господь: милостив к тебе»; слав. «рече бо милостив к тебе Господь», отсюда あなたに情け深い主は言われる; у Свита иначе: εἶπεν γάρ· Ἵλεώς σοι, Κύριε."
  11: "Ταπεινὴ καὶ ἀκατάστατος — «смиренная и непостоянная, колеблемая» (ἀκατάστατος); слав. «смиренная и колеблемая». οὐ παρεκλήθης — «не получила утешения» (παρακαλέω). ἄνθραξ — «карбункул, красный камень» (слав. «анфракс»), передан ルビー; σάπφειρος — «сапфир». ἑτοιμάζω σοὶ ἄνθρακα τὸν λίθον σου — «готовлю тебе карбункул, камень твой»; в Синодальном по МТ «положу камни твои на рубине»."
  12: "ἐπάλξεις — «зубцы, забрала» (слав. «забрала»), отсюда 胸壁. ἴασπις — «яспис» (碧玉); κρύσταλλος — «кристалл, хрусталь» (слав. «камение кристалла»); περίβολος — «ограда» (слав. «ограждение»); λίθοι ἐκλεκτοί — «камни избранные». В Синодальном по МТ «окна из рубинов и ворота из жемчужин» — иное чтение, не внесено."
  13: "διδακτοὺς θεοῦ — «наученные Богом» (διδακτός); в LXX нет сказуемого (эллипсис), в тексте дано なる. καὶ ἐν πολλῇ εἰρήνῃ τὰ τέκνα σου — «и в великом мире дети твои». Ср. Ин 6:45 («будут все научены Богом») — цитата близкая, но не дословная."
  14: "ἐν δικαιοσύνῃ οἰκοδομηθήσῃ — «правдою созиждешься» (οἰκοδομέω). ἀπέχου ἀπὸ ἀδίκου — «удались от неправедного» (ἀπέχω); в Синодальном «будешь далека от угнетения» — по МТ, не внесено. τρόμος οὐκ ἐγγιεῖ σοι — «трепет не приблизится к тебе» (τρόμος, ἐγγίζω)."
  15: "προσήλυτοι — «пришельцы, прозелиты» (προσήλυτος); слав. «пришелцы». δι᾿ ἐμοῦ — «через Меня»; ἐπὶ σὲ καταφεύξονται — «к тебе прибегут» (καταφεύγω). Слав. добавляет «и вселятся у тебе» — добавка внесена по паритету (あなたのもとに住み), в LXX её нет. В Синодальном по МТ «будут вооружаться против тебя» — противоположный смысл, держим LXX и слав."
  16: "ἰδοὺ ἐγὼ κτίζω σε — «вот, Я создаю тебя» (κτίζω); у Свита прошедшее ἔκτισά σε. χαλκεὺς φυσῶν ἄνθρακας — «кузнец, раздувающий угли» (χαλκεύς, φυσάω); ἐκφέρων σκεῦος εἰς ἔργον — «выносящий сосуд на дело». ἐγὼ δὲ ἔκτισά σε οὐκ εἰς ἀπώλειαν φθεῖραι — «Я создал тебя не на погибель, чтобы погубить» (ἀπώλεια, φθείρω). Место тёмное: в МТ «Я творю губителя для истребления»; переведено по греч. и слав. без сглаживания."
  17: "πᾶν σκεῦος φθαρτόν — «всякий сосуд тленный»; у Свита и в слав. σκευαστόν/«соделан» («сделанный»), поэтому в тексте 造られた器. οὐκ εὐοδώσω — «не дам успеха» (εὐοδόω). εἰς κρίσιν — «на суд». οἱ ἔνοχοί σου ἔσονται ἐν αὐτῇ — «повинные твои будут в ней»: ἐν αὐτῇ женский род, предмет неясен (суд? город?), слав. «в нем»; оставлено буквально (その中に) с этой заметкой. ἔστιν κληρονομία τοῖς θεραπεύουσιν κύριον — «это наследие служащим Господу» (θεραπεύω). λέγει κύριος — формула в конце, внутри речи (как в 1:11)."
