verses:
  1: "指揮者[しきしゃ]に。ダビデの詩[うた]。主[しゅ]よ、わたしを悪[わる]い人[ひと]から救[すく]い出[だ]し、暴[ぼう]虐[ぎゃく]な人[ひと]からわたしを助[たす]け出[だ]してください。"
  2: "彼[かれ]らは心[こころ]のうちに不[ふ]法[ほう]を企[くわだ]て、日[ひ]ごとに戦[たたか]いを仕組[しく]む。"
  3: "彼[かれ]らは舌[した]を蛇[へび]のように鋭[するど]くし、その唇[くちびる]の下[した]には蝮[まむし]の毒[どく]がある。"
  4: "主[しゅ]よ、わたしを罪[つみ]人[びと]の手[て]から守[まも]り、不[ふ]義[ぎ]な人[ひと]たちからわたしを救[すく]い出[だ]してください。彼[かれ]らはわたしの足[あし]を滑[すべ]らせようと企[くわだ]てる。"
  5: "高[たか]ぶる者[もの]たちはわたしのために罠[わな]を隠[かく]し、縄[なわ]を張[は]り、わたしの道[みち]のそばに網[あみ]を仕掛[しか]け、"
  6: "わたしの足[あし]もとに落[お]とし穴[あな]を置[お]いた。"
  7: "わたしは主[しゅ]に言[い]った。「あなたはわたしの神[かみ]である」と。主[しゅ]よ、わたしの願[ねが]いの声[こえ]に耳[みみ]を傾[かたむ]けてください。"
  8: "主[しゅ]よ、主[しゅ]よ、わたしの救[すく]いの力[ちから]よ。あなたは戦[たたか]いの日[ひ]に、わたしの頭[あたま]を覆[おお]われた。"
  9: "主[しゅ]よ、わたしを罪[つみ]人[びと]の望[のぞ]みに渡[わた]さないでください。彼[かれ]らはわたしに対して企[くわだ]てる。わたしを見捨[みす]てないでください。彼[かれ]らが高[たか]ぶることがないように。"
  10: "彼[かれ]らを囲[かこ]む者[もの]たちの頭[あたま]を、その唇[くちびる]のわざが覆[おお]う。"
  11: "燃[も]える炭[すみ]が彼[かれ]らの上[うえ]に降[ふ]りかかる。あなたは彼[かれ]らを火[ひ]の中[なか]に投[な]げ込[こ]まれ、彼[かれ]らは苦難[くなん]のうちに立[た]ち上[あ]がることはない。"
  12: "舌[した]の達者[たっしゃ]な人[ひと]は地[ち]に堅[かた]く立[た]つことができない。災[わざわ]いが不[ふ]義[ぎ]な人[ひと]を捕[と]らえて滅[ほろ]びに引[ひ]き入[い]れる。"
  13: "わたしは知[し]っている。主[しゅ]は苦[くる]しむ者[もの]のために裁[さば]きを行[おこな]い、貧[まず]しい者[もの]のために正[ただ]しい裁[さば]きを行[おこな]われる。"
  14: "しかし、正[ただ]しい者[もの]たちはあなたの名[な]に感謝[かんしゃ]をささげ、心[こころ]のまっすぐな者[もの]たちはあなたの顔[かお]の前[まえ]に住[す]まう。"

notes:
  1: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ — 指揮者に。ダビデの詩. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Ἐξελοῦ με, κύριε, ἐξ ἀνθρώπου πονηροῦ — 主よ、わたしを悪い人から救い出し (ἐξαιρέω — «изымать, избавлять»). ἀπὸ ἀνδρὸς ἀδίκου ῥῦσαί με — 不義な人からわたしを助け出してください (ῥύομαι — «избавлять»; два синонима сохранены)."
  2: "οἵτινες ἐλογίσαντο ἀδικίας ἐν καρδίᾳ — 彼らは心のうちに不法を企て (λογίζομαι — «замышлять»). ὅλην τὴν ἡμέραν παρετάσσοντο πολέμους — 日ごとに戦いを仕組む (παρατάσσομαι — «строиться в боевой порядок»)."
  3: "ἠκόνησαν γλῶσσαν αὐτῶν ὡσεὶ ὄφεως — 舌を蛇のように鋭くし (ἀκονάω — «точить»). ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν — 唇の下には蝮の毒がある (ἰός — «яд»; ἀσπίς — «аспид, змея»). διάψαλμα в конце стиха не передаётся."
  4: "φύλαξόν με, κύριε, ἐκ χειρὸς ἁμαρτωλοῦ — 主よ、わたしを罪人の手から守り (φυλάσσω — «охранять»). οἵτινες ἐλογίσαντο ὑποσκελίσαι τὰ διαβήματά μου — わたしの足を滑らせようと企てる (ὑποσκελίζω — «подставлять ногу»; διάβημα — «шаг»)."
  5: "ἔκρυψαν ὑπερήφανοι παγίδα μοι — 高ぶる者たちはわたしのために罠を隠し (παγίς — «сеть, ловушка»). σχοινία διέτειναν — 縄を張り (διατείνω — «протягивать»). Слав. ст. 5 — до слов «道のそばに網を仕掛け»."
  6: "ἐχόμενα τρίβου σκάνδαλον ἔθεντό μοι — 道のそばに落とし穴を置いた (σκάνδαλον — «соблазн, западня»). διάψαλμα не передаётся. Слав. ст. 6 — «わたしの足もとに落とし穴を置いた» (σκάνδαλα)."
  7: "εἶπα τῷ κυρίῳ· Θεός μου εἶ σύ — わたしは主に言った、「あなたはわたしの神である」. ἐνώτισαι, κύριε, τὴν φωνὴν τῆς δεήσεώς μου — 主よ、わたしの願いの声に耳を傾けてください (ἐνωτίζομαι — «внимать»). Слова псалмопевца — 「」, как в Пс 15:2."
  8: "κύριε κύριε δύναμις τῆς σωτηρίας μου — 主よ、主よ、わたしの救いの力よ (двойное обращение сохранено). ἐπεσκίασας ἐπὶ τὴν κεφαλήν μου ἐν ἡμέρᾳ πολέμου — 戦いの日に、わたしの頭を覆われた (ἐπισκιάζω — «осенять»)."
  9: "μὴ παραδῷς με, κύριε, ἀπὸ τῆς ἐπιθυμίας μου ἁμαρτωλῷ — 主よ、わたしを罪人の望みに渡さないでください (ἐπιθυμία — «желание, похоть»). διελογίσαντο κατ᾿ ἐμοῦ — 彼らはわたしに対して企てる. μὴ ἐγκαταλίπῃς με, μήποτε ὑψωθῶσιν — わたしを見捨てないでください、彼らが高ぶることがないように (ἐγκαταλείπω — «оставлять»). διάψαλμα не передаётся."
  10: "ἡ κεφαλὴ τοῦ κυκλώματος αὐτῶν — 彼らを囲む者たちの頭 (κύκλωμα — «окружение»; тёмное место). κόπος τῶν χειλέων αὐτῶν καλύψει αὐτούς — その唇のわざが彼らを覆う (κόπος — «труд»; καλύπτω — «покрывать»)."
  11: "πεσοῦνται ἐπ᾿ αὐτοὺς ἄνθρακες — 燃える炭が彼らの上に降りかかる (ἄνθραξ — «уголь»). ἐν πυρὶ καταβαλεῖς αὐτούς — あなたは彼らを火の中に投げ込まれる (καταβάλλω — «низвергать»). ἐν ταλαιπωρίαις οὐ μὴ ὑποστῶσιν — 彼らは苦難のうちに立ち上がることはない (ὑφίστημι — «устоять»)."
  12: "ἀνὴρ γλωσσώδης οὐ κατευθυνθήσεται ἐπὶ τῆς γῆς — 舌の達者な人は地に堅く立つことができない (γλωσσώδης — «болтливый, злоязычный»; κατευθύνω — «направлять, утверждать»). ἄνδρα ἄδικον κακὰ θηρεύσει εἰς διαφθοράν — 災いが不義な人を捕らえて滅びに引き入れる (θηρεύω — «ловить»; διαφθορά — «погибель»)."
  13: "ἔγνων ὅτι ποιήσει κύριος τὴν κρίσιν τοῦ πτωχοῦ — 主は苦しむ者のために裁きを行い (κρίσις — 裁き). τὴν δίκην τῶν πενήτων — 貧しい者のために正しい裁きを (δίκη — «правда, суд»; πένης — «убогий»)."
  14: "πλὴν δίκαιοι ἐξομολογήσονται τῷ ὀνόματί σου — しかし、正しい者たちはあなたの名に感謝をささげ (πλήν — «впрочем, однако»). κατοικήσουσιν εὐθεῖς σὺν τῷ προσώπῳ σου — 心のまっすぐな者たちはあなたの顔の前に住まう (εὐθής — «прямой»; σὺν τῷ προσώπῳ σου — «пред лицом Твоим»)."
