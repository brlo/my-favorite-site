verses:
  1: "知恵[ちえ]は自分[じぶん]の魂[たましい]をほめたたえ、自分[じぶん]の民[たみ]の間[あいだ]で誇[ほこ]る。"
  2: "いと高[たか]い方[かた]の集会[しゅうかい]のうちで、彼女[かのじょ]は口[くち]を開[ひら]き、その力[ちから]の前[まえ]で誇[ほこ]る。"
  3: "「わたしは、いと高[たか]い方[かた]の口[くち]から出[で]て、霧[きり]のように地[ち]を覆[おお]った。"
  4: "わたしは高[たか]い所[ところ]に住[す]み、わたしの王座[おうざ]は雲[くも]の柱[はしら]のうちにあった。"
  5: "わたしはただ一人[ひとり]で天[てん]の円[えん]を巡[めぐ]り、深[ふか]い淵[ふち]の底[そこ]を歩[ある]いた。"
  6: "海[うみ]の波[なみ]の中[なか]にも、全[すべ]ての地[ち]にも、すべての民[たみ]と国民[こくみん]のうちにも、わたしは所有[しょゆう]を得[え]た。"
  7: "これらすべてのものとともに、わたしは安[やす]らぎを求[もと]め、だれの嗣業[しぎょう]のうちに宿[やど]ろうかと思[おも]った。"
  8: "そのとき、すべてのものの造[つく]り手[て]がわたしに命[めい]じ、わたしを造[つく]られた方[かた]がわたしの幕屋[まくや]を定[さだ]めて安[やす]らわせ、言[い]われた。『ヤコブのうちに住[す]め、イスラエルのうちで嗣業[しぎょう]を受けよ』と。"
  9: "世界[せかい]の始[はじ]まりより前[まえ]、初[はじ]めから、神[かみ]はわたしを造[つく]られた。わたしは永遠[えいえん]に尽[つ]きることがない。"
  10: "わたしは聖[せい]なる幕屋[まくや]のうちで、神[かみ]の前[まえ]に仕[つか]え、こうしてシオン[しおん]に据[す]えられた。"
  11: "同[おな]じように、神はわたしを愛[あい]された都[みやこ]に安[やす]らわせ、エルサレムのうちにわたしの権威[けんい]を置[お]かれた。"
  12: "わたしは栄光[えいこう]の民[たみ]のうちに根[ね]を下[おろ]し、主[しゅ]の嗣業[しぎょう]である分[ぶん]のうちに根を張[は]った。"
  13: "わたしはレバノンの杉[すぎ]のように高[たか]くされ、ヘルモンの山々[やまやま]の糸杉[いとすぎ]のようになった。"
  14: "わたしはエンガディの棕櫚[しゅろ]のように高くされ、エリコの薔薇[ばら]の若木[わかぎ]のようになった。平野[へいや]の美[うつく]しいオリーブのようであり、プラタナスのように高くされた。"
  15: "わたしは肉桂[にっけい]とアスパラトスの香辛料[こうしんりょう]のように香[かお]りを与[あた]え、選[えら]ばれた没薬[もつやく]のように良[よ]い香[かおり]を広[ひろ]げた。ハルバネ、オニキス、スタクテのように、また幕屋[まくや]の乳香[にゅうこう]の煙[けむり]のように。"
  16: "わたしはテレビンの木[き]のように枝[えだ]を広[ひろ]げ、わたしの枝は栄光[えいこう]と{恵[めぐ]み|恩寵[おんちょう]}の枝である。"
  17: "わたしはぶどうの木のように{恵[めぐ]み|恩寵[おんちょう]}を芽吹[めぶ]かせ、わたしの花[はな]は栄光と富[とみ]の実[み]である。"
  18: "わたしは美[うつく]しい愛[あい]と、恐[おそ]れと、知識[ちしき]と、聖[せい]なる希望[きぼう]の母[はは]である。わたしは永遠[えいえん]の者[もの]として、神[かみ]によって名[な]づけられたすべての子[こ]らに与[あた]えられる。"
  19: "わたしを慕[した]う者[もの]たちよ、わたしのところへ来[き]なさい。わたしの実[み]から満[み]たされなさい。"
  20: "わたしの思[おも]い出[で]は蜜[みつ]よりも甘[あま]く、わたしの嗣業[しぎょう]は蜜[みつ]の巣[す]よりも甘い。"
  21: "わたしを食[た]べる者[もの]はなお飢[う]え、わたしを飲[の]む者[もの]はなお渇[かわ]く。"
  22: "わたしに聞[き]き従[したが]う者[もの]は恥[は]じず、わたしのうちに働[はたら]く者[もの]は罪[つみ]を犯[おか]さない。」"
  23: "これらすべては、いと高[たか]い神[かみ]の契約[けいやく]の書[しょ]、すなわちモーセがわたしたちに命[めい]じた律法[りっぽう]であり、ヤコブの集会[しゅうかい]への嗣業[しぎょう]である。"
  24: "主[しゅ]にあって力[ちから]を失[うしな]ってはならない。主に寄[よ]り添[そ]いなさい。そうすれば主はあなたがたを強[つよ]くされる。全能者[ぜんのうしゃ]である主はただ一人[ひとり]の神[かみ]であり、彼[かれ]のほかには救[すく]い主[ぬし]がない。"
  25: "それはピソンのように知恵[ちえ]で満[み]たし、新[あたら]しい実[み]の日[ひ]のティグリスのようである。"
  26: "エウフラテスのように悟[さと]りを満たし、刈[か]り入[い]れの日[ひ]のヨルダンのようである。"
  27: "光[ひかり]のように戒[いまし]めを照[て]らし出[だ]し、ぶどうの収穫[しゅうかく]の日[ひ]のギホンのようである。"
  28: "初[はじ]めの者[もの]もこれを知[し]り尽[つ]くすことはできず、同[おな]じように最後[さいご]の者[もの]もこれを探[さぐ]り出[だ]せなかった。"
  29: "その思[おも]いは海[うみ]よりも増[ふ]え、その計画[けいかく]は大[おお]きな淵[ふち]よりも深[ふか]いからである。"
  30: "わたしは川[かわ]からの水路[すいろ]のように、また庭[にわ]へ流[なが]れ出[で]る用水路[ようすいろ]のようになった。"
  31: "わたしは言[い]った。「わたしの庭[にわ]に水[みず]を注[そそ]ぎ、わたしの畑[はたけ]を潤[うるお]そう」と。すると見[み]よ、わたしの水路[すいろ]は川[かわ]となり、わたしの川は海[うみ]となった。"
  32: "わたしはまだ、戒[いまし]めを暁[あかつき]のように照[て]らし、それを遠[とお]くまで明[あき]らかにする。"
  33: "わたしはまだ、教[おし]えを預言[よげん]のように注[そそ]ぎ出[だ]し、それを永遠[えいえん]の世代[せだい]に残[のこ]す。"
  34: "見[み]よ、わたしが労苦[ろうく]したのは自分[じぶん]ひとりのためではなく、これらを求[もと]めるすべての者[もの]のためである。"

notes:
  1: "Ἡ σοφία αἰνέσει ψυχὴν αὐτῆς — «Премудрость восхвалит душу свою» (αἰνέω). ἐν μέσῳ λαοῦ αὐτῆς καυχήσεται — «посреди народа своего похвалится» (καυχάομαι)."
  2: "ἐν ἐκκλησίᾳ ὑψίστου — «в собрании (церкви) Вышнего» (ἐκκλησία — собрание). στόμα αὐτῆς ἀνοίξει — «уста свои откроет». ἔναντι δυνάμεως αὐτοῦ — «пред силою Его» (δύναμις — сила, ангельское воинство); слав. «прямо силе его»."
  3: "ἀπὸ στόματος ὑψίστου ἐξῆλθον — «из уст Вышнего вышла» (ἐξέρχομαι). ὡς ὁμίχλη κατεκάλυψα γῆν — «как мгла (туман) покрыла землю» (ὁμίχλη; κατακαλύπτω). Здесь начинается речь Премудрости — 「…」 до 24:22."
  4: "ἐν ὑψηλοῖς κατεσκήνωσα — «на высотах вселилась» (κατασκηνόω). ὁ θρόνος μου ἐν στύλῳ νεφέλης — «престол мой в столпе облачном» (στῦλος; νεφέλη); слав. «в столпе облачне»."
  5: "γῦρον οὐρανοῦ ἐκύκλωσα μόνη — «круг небесный обошла одна» (γῦρος — круг; κυκλόω). ἐν βάθει ἀβύσσων περιεπάτησα — «в глубине бездн ходила» (ἄβυσσος; περιπατέω)."
  6: "ἐν κύμασιν θαλάσσης — «в волнах моря» (κῦμα). ἐν παντὶ λαῷ καὶ ἔθνει ἐκτησάμην — «во всяком народе и племени приобрела (владение)» (κτάομαι); слав. «стяжах»."
  7: "μετὰ τούτων πάντων ἀνάπαυσιν ἐζήτησα — «среди всех их покоя искала» (ἀνάπαυσις). ἐν κληρονομίᾳ τίνος αὐλισθήσομαι — «в наследии чьём водворюсь» (αὐλίζομαι — располагаться станом); слав. «водворюся»."
  8: "ὁ κτίστης ἁπάντων — «Создатель всего» (κτίστης). κατέπαυσεν τὴν σκηνήν μου — «упокоил (поставил) скинию мою» (καταπαύω; σκηνή — 幕屋). Ἐν Ιακωβ κατασκήνωσον καὶ ἐν Ισραηλ κατακληρονομήθητι — слова Бога, поэтому внутри речи Премудрости стоят 『…』; слав. 24:8–9."
  9: "πρὸ τοῦ αἰῶνος ἀπ᾿ ἀρχῆς ἔκτισέν με — «прежде века от начала создал меня» (κτίζω). ἕως αἰῶνος οὐ μὴ ἐκλίπω — «до века не иссякну (не прекращусь)» (ἐκλείπω); слав. «не оскудею»."
  10: "ἐν σκηνῇ ἁγίᾳ ἐνώπιον αὐτοῦ ἐλειτούργησα — «в скинии святой пред Ним служила» (λειτουργέω — священнослужение). ἐν Σιων ἐστηρίχθην — «в Сионе утвердилась» (στηρίζω)."
  11: "ἐν πόλει ἠγαπημένῃ — «в городе возлюбленном» (ἀγαπάω). ὁμοίως με κατέπαυσεν — «также меня упокоил (дал мне покой)». ἐν Ιερουσαλημ ἡ ἐξουσία μου — «в Иерусалиме власть моя» (ἐξουσία)."
  12: "ἐρρίζωσα ἐν λαῷ δεδοξασμένῳ — «укоренилась в народе прославленном» (ῥιζόω; δοξάζω). ἐν μερίδι κυρίου, κληρονομίας αὐτοῦ — «в части Господа, наследия Его» (μερίς)."
  13: "ὡς κέδρος ἀνυψώθην ἐν τῷ Λιβάνῳ — «как кедр возвысилась в Ливане» (κέδρος; ἀνυψόω). ὡς κυπάρισσος ἐν ὄρεσιν Αερμων — «как кипарис на горах Ермона» (κυπάρισος; Αερμων — Ермон, ヘルモン)."
  14: "ὡς φοῖνιξ ἀνυψώθην ἐν Αιγγαδοις — «как пальма возвысилась в Енгадди» (φοῖνιξ — пальма; Αιγγαδοις — Енгадди, エンガディ). ὡς φυτὰ ῥόδου ἐν Ιεριχω — «как растения розы в Иерихоне»; ἐλαία εὐπρεπής — «маслина прекрасная»; πλάτανος — платан. Слав. 24:15–16."
  15: "κιννάμωμον καὶ ἀσπάλαθος — корица и аспалаф (благовонные растения); ἀρωμάτων δέδωκα ὀσμήν — «благоухание дала» (ὀσμή). σμύρνα ἐκλεκτή — «мирра избранная» (σμύρνα — 没薬); χαλβάνη, ὄνυξ, στακτή — халвани, оникс, стакти (благовония); λιβάνου ἀτμὶς ἐν σκηνῇ — «пар (дым) ливана в скинии» (λιβανός — ладан, 乳香). Слав. 24:17–18."
  16: "ὡς τερέμινθος — «как теревинф» (терпентинное дерево). ἐξέτεινα κλάδους μου — «простёрла ветви мои» (κλάδος). κλάδοι δόξης καὶ χάριτος — «ветви славы и благодати»; χάρις — пара {恵み|恩寵}."
  17: "ὡς ἄμπελος ἐβλάστησα χάριν — «как виноградная лоза произрастила благодать» (ἀμπελός; βλαστάνω). τὰ ἄνθη μου καρπὸς δόξης καὶ πλούτου — «цветы мои — плод славы и богатства» (ἄνθος; πλοῦτος)."
  18: "В gr-lxx-byz на месте стиха «.» (дефект модуля); в csl и ru этого стиха нет (краткая редакция). Переведено по пространной редакции LXX: ἐγὼ μήτηρ τῆς ἀγαπήσεως τῆς καλῆς, καὶ φόβου καὶ γνώσεως καὶ τῆς ὁσίας ἐλπίδος, δίδομαι οὖν πᾶσι τοῖς τέκνοις μου, ἀειγενὴς τοῖς λεγομένοις ὑπ᾽ αὐτοῦ — «я матерь прекрасной любви, и страха, и знания, и святой надежды; я, вечная, дана всем детям моим, названным Им». Стих внутри речи Премудрости."
  19: "προσέλθετε πρός με, οἱ ἐπιθυμοῦντές μου — «придите ко мне, желающие меня» (ἐπιθυμέω). ἀπὸ τῶν γενημάτων μου ἐμπλήσθητε — «от произведений (плодов) моих насытьтесь» (γένημα; ἐμπίπλημι)."
  20: "τὸ μνημόσυνόν μου ὑπὲρ τὸ μέλι γλυκύ — «память моя слаще мёда» (μνημόσυνον; γλυκύς). ἡ κληρονομία μου ὑπὲρ μέλιτος κηρίον — «наследие моё — выше (слаще) медового сота» (κηρίον — соты)."
  21: "οἱ ἐσθίοντές με ἔτι πεινάσουσιν — «вкушающие меня ещё взалчут» (πεινάω). οἱ πίνοντές με ἔτι διψήσουσιν — «пьющие меня ещё возжаждут» (διψάω): насыщение не прекращает голода по Премудрости."
  22: "ὁ ὑπακούων μου οὐκ αἰσχυνθήσεται — «слушающий меня не постыдится» (ὑπακούω; αἰσχύνομαι). οἱ ἐργαζόμενοι ἐν ἐμοὶ οὐχ ἁμαρτήσουσιν — «делающие во мне не согрешат». Здесь речь Премудрости закрывается (」)."
  23: "Ταῦτα πάντα βίβλος διαθήκης θεοῦ ὑψίστου — «всё это — книга Завета Бога Вышнего» (βίβλος; διαθήκη). νόμον ὃν ἐνετείλατο ἡμῖν Μωϋσῆς — «закон, который заповедал нам Моисей»; κληρονομίαν συναγωγαῖς Ιακωβ — «наследие собраниям Иакова» (συναγωγή). Слав. 25–26 делят стих на две половины."
  24: "В gr-lxx-byz «.» (дефект); в csl и ru стиха нет. Переведено по пространной редакции LXX: μὴ ἐκλύεσθε ἰσχὺν ἐν κυρίῳ, κολλᾶσθε δὲ πρὸς αὐτόν, ἵνα κραταιώσῃ ὑμᾶς, κύριος παντοκράτωρ θεὸς μόνος ἐστί, καὶ οὐκ ἔστιν ἔτι πλὴν αὐτοῦ σωτήρ — «не изнемогайте силою в Господе, но прилепитесь к Нему, чтобы Он укрепил вас; Господь Вседержитель — Бог единый, и нет иного спасителя, кроме Него»."
  25: "ὁ πιμπλῶν ὡς Φισων σοφίαν — «наполняющий, как Фисон, премудростью» (πίμπλημι; Φισων — райская река, ピソン). ὡς Τίγρις ἐν ἡμέραις νέων — «как Тигр во дни новых (плодов)» (Τίγρις — ティグリス; νέων — новин)."
  26: "ὁ ἀναπληρῶν ὡς Εὐφράτης σύνεσιν — «восполняющий, как Евфрат, разумом» (ἀναπληρόω; σύνεσις). ὡς Ιορδάνης ἐν ἡμέραις θερισμοῦ — «как Иордан во дни жатвы» (θερισμός)."
  27: "ὁ ἐκφαίνων ὡς φῶς παιδείαν — «являющий, как свет, наказание (учение)» (ἐκφαίνω; παιδεία). ὡς Γηων ἐν ἡμέραις τρυγήτου — «как Гион во дни собирания винограда» (Γηων — ギホン; τρύγητος)."
  28: "οὐ συνετέλεσεν ὁ πρῶτος γνῶναι αὐτήν — «не завершил первый познать её» (συντελέω). ὁ ἔσχατος οὐκ ἐξιχνίασεν αὐτήν — «последний не исследовал её» (ἐξιχνιάζω — выследить, постичь)."
  29: "ἀπὸ γὰρ θαλάσσης ἐπληθύνθη διανόημα αὐτῆς — «ибо более моря умножилась мысль её» (διανόημα). ἡ βουλὴ αὐτῆς ἀπὸ ἀβύσσου μεγάλης — «совет её — от великой бездны» (ἄβυσσος)."
  30: "Κἀγὼ ὡς διῶρυξ ἀπὸ ποταμοῦ — «и я, как канал (провод) от реки» (διῶρυξ). ὡς ὑδραγωγὸς ἐξῆλθον εἰς παράδεισον — «как водопровод вышла в рай (сад)» (ὑδραγωγός; παράδεισος — 庭)."
  31: "εἶπα Ποτιῶ μου τὸν κῆπον — «я сказала: напою сад мой» (ποτίζω; κῆπος). μεθύσω μου τὴν πρασιάν — «упою гряды мои» (μεθύσκω; πρασιά — грядка, луг). ἡ διῶρυξ εἰς ποταμόν — «канал стал рекою»; ὁ ποταμός μου εἰς θάλασσαν — «река моя стала морем». Слова Премудрости о себе — «…」; слав. 33–34."
  32: "ἔτι παιδείαν ὡς ὄρθρον φωτιῶ — «ещё наказание (учение), как утренний свет, просвещу» (ὄρθρος; φωτίζω). ἐκφανῶ αὐτὰ ἕως εἰς μακράν — «явлю их до дальних (пределов)»."
  33: "ἔτι διδασκαλίαν ὡς προφητείαν ἐκχεῶ — «ещё учение, как пророчество, изолью» (διδασκαλία; προφητεία; ἐκχέω). καταλείψω αὐτὴν εἰς γενεὰς αἰώνων — «оставлю его в роды веков» (καταλείπω; γενεά)."
  34: "ἴδετε ὅτι οὐκ ἐμοὶ μόνῳ ἐκοπίασα — «видите, что не себе одному я трудилась» (κοπιάω). ἅπασιν τοῖς ἐκζητοῦσιν αὐτήν — «но всем, ищущим её» (ἐκζητέω). Слав. «Видите, яко не себе единому трудихся…»."
