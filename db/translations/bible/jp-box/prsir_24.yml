# jp-box, Сирах, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: 1–2 вступление; 3–22 речь Премудрости о своём происхождении, обитании
# в Израиле, красоте и приглашении к трапезе; 23–34 Премудрость есть книга Завета
# и закон Моисея, её полнота и её труд для всех ищущих.
# Прямая речь: 24:3–22 — речь Премудрости целиком в 「…」 (открывается в 3,
# закрывается в 22); внутри 8 — слова Бога, поэтому 『…』. 1–2 и 23–34 — авторский
# текст, без кавычек. Красного и синего нет.
# Нумерация по gr: 34 стиха. Дефекты gr: 24:18 и 24:24 стоят как «.» — этих стихов
# нет ни в csl, ни в ru (краткая редакция); переведены по пространной редакции LXX:
# 24:18 «ἐγὼ μήτηρ ἀγαπήσεως…», 24:24 «μὴ ἐκλύεσθε ἰσχὺν ἐν κυρίῳ…». Отмечено в notes.
# Слав. — 37 стихов: csl 8–9 делят гр 8, csl 15–16 — гр 14, csl 17–18 — гр 15,
# csl 25–26 — гр 23, csl 33–34 — гр 31; эти половины влиты в соответствующие
# греческие стихи, стихи не добавлялись и не делились.
# 〔…〕 нет; сносок ⟨…⟩ нет: 知恵, 主, 契約, 幕屋, 乳香 и пр. уже в корпусе.
# Имена и топонимы — транслитерация греческого (LXX).

