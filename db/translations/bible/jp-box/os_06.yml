# jp-box, Осия, глава 6. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной
# (в csl 6:1 включён конец 5:15, поэтому сверка внутри главы идёт по частям стихов).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–3 речь народа после 5:15: «пойдём и обратимся», Он уязвил и исцелит,
# через два дня и в третий день восставит, «познаем Господа», утренняя заря и дождь;
# 4–6 ответ Господа: «что сделаю тебе, Ефрем?», милость как утренний облак, поражу
# пророков, «милости хочу, а не жертвы»; 7–10 нарушенный завет, Галаад, священники
# на пути, мерзость в доме Израиля; 11 жатва при возвращении плена.
# Голоса: 1–3 — речь народа в 「…」 (продолжает «говоря» 5:15); 4–11 — слово Господа
# в 「…」 (закрывается в 11).
# 6:7: LXX «ὡς ἄνθρωπος παραβαίνων» — «как человек преступающий», не «как Адам»
# (ru/МТ); в тексте греч.
# 6:9: «ἐφόνευσαν Σικιμα» — «убили Сихем» (город как собирательное); передано
# «シケムで人を殺した».
#
tr_code: jp-box
book: os
chapter: 6
draft: true

verses:
  1: "「さあ、主[しゅ]に帰[かえ]ろう。主[しゅ]はわたしたちを引[ひ]き裂[さ]き、また癒[いや]してくださる。打[う]ち砕[くだ]き、また包[つつ]んでくださる。"
  2: "主[しゅ]は二日[ふつか]の後[あと]にわたしたちを生[い]かし、三日目[みっかめ]にわたしたちは起[お]き上[あ]がって、主[しゅ]の前[まえ]に生[い]きる。"
  3: "わたしたちは知[し]ろうとし、主[しゅ]を知[し]ることを追[お]い求[もと]める。主[しゅ]は備[そな]えられた夜明[よあ]けのように見[み]いだされ、地[ち]に降[ふ]る前[さき]の雨[あめ]、後[のち]の雨[あめ]のように、わたしたちに来[こ]られる」。"
  4: "「エフライムよ、わたしはあなたに何[なに]をしようか。ユダよ、わたしはあなたに何[なに]をしようか。あなたがたのあわれみは朝[あさ]の雲[くも]、朝[あさ]早[はや]く消[き]える露[つゆ]のようである。"
  5: "それゆえ、わたしはあなたがたの預言者[よげんしゃ]たちを刈[か]り倒[たお]し、わたしの口[くち]の言葉[ことば]で彼らを殺[ころ]した。わたしの裁[さば]きは光[ひかり]のように出[で]て行[い]く。"
  6: "わたしはあわれみを望[のぞ]み、いけにえを望[のぞ]まない。神[かみ]を知[し]ることを、燔祭[はんさい]よりも望[のぞ]む。"
  7: "しかし、彼らは契約[けいやく]を破[やぶ]る人間[にんげん]のようである。そこで彼らはわたしを蔑[さげす]んだ。"
  8: "ギレアデは、むなしいことを行[おこな]い、水[みず]を濁[にご]す都[みやこ]である。"
  9: "あなたの力[ちから]は強盗[ごうとう]のものとなった。祭司[さいし]たちは主[しゅ]の道[みち]を隠[かく]し、シケムで人[ひと]を殺[ころ]した。彼らは不法[ふほう]を行[おこな]ったからである。"
  10: "イスラエルの家[いえ]で、わたしは恐[おそ]ろしいことを見[み]た。そこにエフライムの淫行[いんこう]がある。イスラエルとユダは汚[けが]れた。"
  11: "わたしがわたしの民[たみ]の捕囚[ほしゅう]を帰[かえ]すとき、あなたは自分[じぶん]のためにぶどうを摘[つ]み始[はじ]めよ」。"

notes:
  1: "Πορευθῶμεν καὶ ἐπιστρέψωμεν πρὸς κύριον τὸν θεὸν ἡμῶν — «пойдём и обратимся к Господу Богу нашему»; αὐτὸς ἥρπακεν καὶ ἰάσεται ἡμᾶς — «Он похитил (растерзал) и исцелит нас» (ἁρπάζω, ср. 5:14 лев); πατάξει καὶ μοτώσει ἡμᾶς — «поразит и перевяжет нас» (μοτόω — перевязывать раны; слав. «уязвит, и уврачует ны»)."
  2: "ὑγιάσει ἡμᾶς μετὰ δύο ἡμέρας — «исцелит нас после двух дней» (ὑγιάζω — делать здоровым); ἐν τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστησόμεθα — «в третий день восстанем» (ἀνίστημι); ζησόμεθα ἐνώπιον αὐτοῦ — «будем жить пред Ним»."
  3: "γνωσόμεθα διώξομεν τοῦ γνῶναι τὸν κύριον — «познаем, будем стремиться познать Господа» (διώκω — гнаться, стремиться); ὡς ὄρθρον ἕτοιμον εὑρήσομεν αὐτόν — «как готовый рассвет найдём Его» (слав. «яко утро готово обрящем его»); ἥξει ὡς ὑετὸς ἡμῖν πρόιμος καὶ ὄψιμος τῇ γῇ — «придёт нам как дождь ранний и поздний земле» (ὑετός — дождь; πρόιμος — ранний, ὄψιμος — поздний)."
  4: "τί σοι ποιήσω, Εφραιμ; τί σοι ποιήσω, Ιουδα; — «что сделаю тебе, Ефрем? что сделаю тебе, Иуда?»; τὸ ἔλεος ὑμῶν ὡς νεφέλη πρωινὴ — «милость ваша как облако утреннее» (ἔλεος здесь — верность, благочестие, ср. 6:6; слав. «милость бо ваша»); ὡς δρόσος ὀρθρινὴ πορευομένη — «и как роса утренняя, уходящая»."
  5: "ἀπεθέρισα τοὺς προφήτας ὑμῶν — «Я пожал (скосил) пророков ваших» (ἀποθερίζω — сжинать); ἀπέκτεινα αὐτοὺς ἐν ῥήμασιν στόματός μου — «умертвил их словами уст Моих»; τὸ κρίμα μου ὡς φῶς ἐξελεύσεται — «суд Мой как свет изыдет»."
  6: "ἔλεος θέλω καὶ οὐ θυσίαν — «милости хочу, а не жертвы» (слав. «милости хощу а не жертвы»); ἐπίγνωσιν θεοῦ ἢ ὁλοκαυτώματα — «ведение Бога, нежели всесожжения» (ὁλοκαύτωμα — 燔祭); ср. Мф 9:13; 12:7."
  7: "αὐτοὶ δέ εἰσιν ὡς ἄνθρωπος παραβαίνων διαθήκην — «они же как человек, преступающий завет» (LXX ἄνθρωπος, не «Адам»; в ru/МТ «подобно Адаму»); ἐκεῖ κατεφρόνησέν μου — «там презрел Меня» (καταφρονέω — презирать; слав. «тамо презреша мя»)."
  8: "Γαλααδ πόλις ἐργαζομένη μάταια — «Галаад — город, делающий суетное» (ἐργάζομαι — делать; μάταιος — пустой); ταράσσουσα ὕδωρ — «мутящий воду» (ταράσσω — мутить; слав. «мутяй воду»); в ru/МТ «запятнанный кровью»."
  9: "ἡ ἰσχύς σου ἀνδρὸς πειρατοῦ — «крепость твоя — мужа разбойника» (πειρατής — разбойник; слав. «яко мужа морскаго разбойника»); ἔκρυψαν ἱερεῖς ὁδὸν κυρίου — «скрыли священники путь Господень»; ἐφόνευσαν Σικιμα — «убили Сихем» (город как собирательное; слав. «убиша сикиму»), передано «シケムで人を殺した»; ὅτι ἀνομίαν ἐποίησαν — «ибо беззаконие сотворили»."
  10: "ἐν τῷ οἴκῳ Ισραηλ εἶδον φρικώδη — «в доме Израиля увидел Я ужасное» (φρικώδης — страшный); ἐκεῖ πορνείαν τοῦ Εφραιμ — «там блуд Ефрема»; ἐμιάνθη Ισραηλ καὶ Ιουδα — «осквернился Израиль и Иуда»."
  11: "Ἄρχου τρυγᾶν σεαυτῷ — «начни собирать (виноград) себе» (τρυγάω — собирать виноград; слав. «начни оымати виноград себе»); ἐν τῷ ἐπιστρέφειν με τὴν αἰχμαλωσίαν τοῦ λαοῦ μου — «когда Я возвращу плен народа Моего» (αἰχμαλωσία — пленение, 捕囚). Стих стоит в конце главы по LXX; в евр. это начало 7-й главы."
