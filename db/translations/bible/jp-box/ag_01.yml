# jp-box, Аггей, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (csl-ru): в этой главе 14 стихов; в gr-lxx-byz
# и ru — 15 (gr 1:15 = слав. 2:1, дата 24-го дня 6-го месяца). Дальше слав. 2:N =
# gr 2:(N−1); всего в книге 38 стихов (14 + 24). Карта границ — в шапке 2-й главы
# и в notes к 2:1.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — по корпусу: ハガイ, ゼルバベル, サラティエル,
# イエシュア (первосвященник, не ヨシュア), ヨセデク, ダリウス; ユダ, イスラエル.
#
# Содержание: 1 дата и повеление сказать Зоровавелю и Иисусу; 2 народ говорит «не время
# строить дом Господень»; 3–4 новое слово: вам время жить в домах ваших, а дом Мой пуст;
# 5–6 сеете много, собираете мало; 7–8 взойдите на гору, стройте дом; 9–11 за дом Мой
# пуст — небо удержало росу, земля — плоды; 12 народ убоялся; 13 «Я с вами»;
# 14 Господь воздвиг дух Зоровавеля, Иисуса и народа, и они начали работу.
# Голоса: 1 — формула вне кавычек, затем 「…」 (повеление пророку, закрывается в 2);
# 3 — формула; 4–11 — 「…» (в 2 слова народа — 『…』; «говорит Господь» внутри речи);
# 13 — слова Аггея, в них 「…»; 14 — повествование.
# 1:11: в LXX ῥομφαία («меч»), в ru/МТ «засуха» — в тексте меч по csl/LXX.
#
tr_code: jp-box
book: ag
chapter: 1
draft: true

verses:
  1: "ダリウス王[おう]の第二年[だいにねん]、第六[だいろく]の月[つき]の一日[ついたち]に、主[しゅ]の言葉[ことば]が預言者[よげんしゃ]ハガイの手[て]によって臨[のぞ]んで言[い]った。「ユダの部族[ぶぞく]のサラティエルの子[こ]ゼルバベルと、大祭司[だいさいし]ヨセデクの子[こ]イエシュアとに告[つ]げよ。"
  2: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。この民[たみ]は『主[しゅ]の家[いえ]を建[た]てる時[とき]はまだ来[き]ていない』と言[い]っている」。"
  3: "主[しゅ]の言葉[ことば]が預言者[よげんしゃ]ハガイの手[て]によって臨[のぞ]んで言[い]った。"
  4: "「あなたがたが板張[いたば]りの家[いえ]に住[す]む時[とき]はあるのに、この家[いえ]は荒[あ]れ果[は]てているのか。"
  5: "今[いま]、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。あなたがたの道[みち]を心[こころ]に留[と]めよ。"
  6: "あなたがたは多[おお]く蒔[ま]いても少[すこ]ししか集[あつ]めず、食[た]べても満[み]ち足[た]りず、飲[の]んでも酔[よ]わず、着[き]ても暖[あたた]まらず、賃金[ちんぎん]を稼[かせ]ぐ者[もの]は破[やぶ]れた袋[ふくろ]に集[あつ]めている。"
  7: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。あなたがたの道[みち]を心[こころ]に留[と]めよ。"
  8: "山[やま]に上[のぼ]って木[き]を切[き]り、それを運[はこ]んで家[いえ]を建[た]てよ。そうすれば、わたしはそれに喜[よろこ]び、栄光[えいこう]を受[う]ける、と主[しゅ]は言[い]われる。"
  9: "あなたがたは多[おお]くに目[め]を向[む]けたが、それは少[すく]なくなった。あなたがたがわたしの家[いえ]に持[も]ち込[こ]んでも、わたしはそれを吹[ふ]き散[ち]らした。それはなぜか、と万軍[ばんぐん]の主[しゅ]は言[い]われる。わたしの家[いえ]が荒[あ]れ果[は]てているのに、あなたがたはそれぞれ自分[じぶん]の家[いえ]に走[はし]って行[い]くからである。"
  10: "それゆえ、天[てん]は露[つゆ]をとどめ、地[ち]はその産物[さんぶつ]を差[さ]し控[ひか]えている。"
  11: "わたしは剣[つるぎ]を地[ち]に、山[やま]に、麦[むぎ]に、ぶどう酒[しゅ]に、油[あぶら]に、地[ち]が産[う]み出[だ]すすべてのものに、人[ひと]にも家畜[かちく]にも、手[て]のすべての労苦[ろうく]にも臨[のぞ]ませた」。"
  12: "サラティエルの子[こ]ゼルバベル、ヨセデクの子[こ]イエシュア、および民[たみ]の残[のこ]りすべては、自分[じぶん]たちの神[かみ]である主[しゅ]の声[こえ]と、主[しゅ]が彼らに遣[つか]わした預言者[よげんしゃ]ハガイの言葉[ことば]を聞[き]いた。民[たみ]は主[しゅ]の前[まえ]に恐[おそ]れた。"
  13: "主[しゅ]の使[つか]いであるハガイは、主[しゅ]の使[つか]いたちの間[あいだ]で、民[たみ]に告[つ]げて言[い]った。「わたしはあなたがたと共[とも]にいる、と主[しゅ]は言[い]われる」。"
  14: "主[しゅ]は、ユダの部族[ぶぞく]のサラティエルの子[こ]ゼルバベルの霊[れい]と、大祭司[だいさいし]ヨセデクの子[こ]イエシュアの霊[れい]と、民[たみ]の残[のこ]りすべての霊[れい]を奮[ふる]い立[た]たせた。彼らは来[き]て、自分[じぶん]たちの神[かみ]である万軍[ばんぐん]の主[しゅ]の家[いえ]で仕事[しごと]をした。"

notes:
  1: "Ἐν τῷ δευτέρῳ ἔτει ἐπὶ Δαρείου τοῦ βασιλέως — «во второе лето при Дарии царе»; ἐν τῷ μηνὶ τῷ ἕκτῳ μιᾷ τοῦ μηνός — «в шестой месяц, в первый день месяца»; ἐγένετο λόγος κυρίου ἐν χειρὶ Αγγαιου τοῦ προφήτου — «было слово Господне рукою Аггея пророка» (ἐν χειρί — через, рукою); Εἰπὸν δὴ πρὸς Ζοροβαβελ τὸν τοῦ Σαλαθιηλ ἐκ φυλῆς Ιουδα — «скажи Зоровавелю, сыну Салафиила, из племени Иуды»; πρὸς Ἰησοῦν τὸν τοῦ Ιωσεδεκ τὸν ἱερέα τὸν μέγαν — «и Иисусу, сыну Иоседека, иерею великому». Имена: ゼルバベル (по корпусу, ср. езд./неем.), サラティエル, イエシュア (первосвященник, не ヨシュア; ср. езд. 3:2), ヨセデク, ダリウス. Слав. «от колена иудова» — из племени Иуды."
  2: "Τάδε λέγει κύριος παντοκράτωρ — «так говорит Господь Вседержитель» (в тексте 万軍の主 по корпусу); ὁ λαὸς οὗτος λέγουσιν — «народ сей говорит» (мн. ч. при ед. подлежащем); Οὐχ ἥκει ὁ καιρὸς τοῦ οἰκοδομῆσαι τὸν οἶκον κυρίου — «не пришло время строить дом Господень». Слав. «людие сии глаголют: не прииде время создати храм Господень». οἶκος — дом (家), не ναός."
  3: "Формула повторена внутри слова (gr 1:3): поэтому цитата 1:2 закрывается до неё, а 1:4 открывается заново. καὶ ἐγένετο λόγος κυρίου ἐν χειρὶ Αγγαιου τοῦ προφήτου λέγων — «и было слово Господне рукою Аггея пророка, говоря»."
  4: "Εἰ καιρὸς ὑμῖν μέν ἐστιν τοῦ οἰκεῖν ἐν οἴκοις ὑμῶν κοιλοστάθμοις — «разве время вам жить в домах ваших с потолком (резных)» (κοιλόσταθμος — с углублённым потолком, обшитый; слав. «истесаных» — тёсаных); ὁ δὲ οἶκος οὗτος ἐξηρήμωται — «а дом сей опустел» (ἐρημόω)."
  5: "Τάξατε δὴ τὰς καρδίας ὑμῶν εἰς τὰς ὁδοὺς ὑμῶν — «обратите сердца ваши на пути ваши» (τάσσω — ставить, располагать; слав. «устройте сердца ваша в пути вашя»)."
  6: "ἐσπείρατε πολλὰ καὶ εἰσηνέγκατε ὀλίγα — «сеяли много и внесли мало»; ἐφάγετε καὶ οὐκ εἰς πλησμονήν — «ели и не в сытость»; ἐπίετε καὶ οὐκ εἰς μέθην — «пили и не в опьянение»; περιεβάλεσθε καὶ οὐκ ἐθερμάνθητε — «оделись и не согрелись»; ὁ τοὺς μισθοὺς συνάγων συνήγαγεν εἰς δεσμὸν τετρυπημένον — «собирающий плату собрал в дырявую связку (мошну)» (δεσμός — связка, кошель; τιτρώσκω — продырявливать)."
  7: "Повтор 1:5 (Θέσθε τὰς καρδίας ὑμῶν). Слав. «положите сердца ваша»."
  8: "ἀνάβητε ἐπὶ τὸ ὄρος καὶ κόψατε ξύλα — «взойдите на гору и срубите деревья»; καὶ οἰκοδομήσατε τὸν οἶκον — «и постройте дом»; καὶ εὐδοκήσω ἐν αὐτῷ καὶ ἐνδοξασθήσομαι — «и Я буду благоволить к нему и прославлюсь». Слав. добавляет «и принесите» (и внесите дерева) — нет в LXX, внесено в текст (運[はこ]んで)."
  9: "ἐπεβλέψατε εἰς πολλά, καὶ ἐγένετο ὀλίγα — «вы посмотрели на многое, и стало мало» (ἐπιβλέπω — взирать, ожидать); ἐξεφύσησα αὐτά — «Я дунул на них (развеял)» (ἐκφυσάω); ὁ οἶκός μού ἐστιν ἔρημος — «дом Мой пуст»; διώκετε ἕκαστος εἰς τὸν οἶκον αὐτοῦ — «бежите каждый в дом свой»."
  10: "ἀνέξει ὁ οὐρανὸς ἀπὸ δρόσου — «небо удержится от росы» (ἀνέχω — удерживать); ἡ γῆ ὑποστελεῖται τὰ ἐκφόρια αὐτῆς — «земля утаит (оскудеет в) произведения свои» (ὑποστέλλομαι — скрывать, умалять; ἐκφόριον — произведение, плод)."
  11: "ἐπάξω ῥομφαίαν ἐπὶ τὴν γῆν — «наведу меч на землю» (ῥομφαία — меч); καὶ ἐπὶ τὸν σῖτον καὶ ἐπὶ τὸν οἶνον καὶ ἐπὶ τὸ ἔλαιον — «и на пшеницу, и на вино, и на елей»; καὶ ἐπὶ πάντας τοὺς πόνους τῶν χειρῶν αὐτῶν — «и на все труды рук их». В ru/МТ «засуха» — иное чтение (с масоретского), в текст не внесено; здесь меч по csl/LXX. Здесь слово Господа 1:4–11 закрывается."
  12: "καὶ ἤκουσεν Ζοροβαβελ… καὶ Ἰησοῦς… καὶ πάντες οἱ κατάλοιποι τοῦ λαοῦ — «и услышал Зоровавель… и Иисус… и все остатки народа» (κατάλοιπος — остаток); τῆς φωνῆς κυρίου τοῦ θεοῦ αὐτῶν — «гласа Господа Бога их»; καθότι ἐξαπέστειλεν αὐτὸν κύριος ὁ θεὸς αὐτῶν πρὸς αὐτούς — «так как послал его Господь Бог их к ним»; ἐφοβήθη ὁ λαὸς ἀπὸ προσώπου κυρίου — «убоялся народ лица Господня»."
  13: "Αγγαιος ὁ ἄγγελος κυρίου — «Аггей, вестник Господень»; ἐν ἀγγέλοις κυρίου — «среди вестников Господних» (слав. «в вестницех Господних»); Ἐγώ εἰμι μεθ' ὑμῶν — «Я с вами»; λέγει κύριος — «говорит Господь». Слово короткое, в 「…」 внутри слов Аггея."
  14: "ἐξήγειρεν κύριος τὸ πνεῦμα Ζοροβαβελ… καὶ τὸ πνεῦμα Ἰησοῦ… καὶ τὸ πνεῦμα τῶν καταλοίπων παντὸς τοῦ λαοῦ — «воздвиг Господь дух Зоровавеля… и дух Иисуса… и дух остатков всего народа» (ἐξεγείρω — воздвигать, будить); εἰσῆλθον καὶ ἐποίουν ἔργα ἐν τῷ οἴκῳ κυρίου παντοκράτορος θεοῦ αὐτῶν — «вошли и делали работы в доме Господа Вседержителя, Бога своего». Последний стих главы по слав.; дата (gr 1:15) — слав. 2:1."
