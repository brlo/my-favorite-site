# jp-box, Второе послание к Коринфянам, глава 7. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# Глава 7: очищение и вмещение (1–4), скорбь по Боге и радость о Тите (5–16).
# Красного и синего нет: прямой речи Христа в главе нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: 7:8 — в базе вторая половина стиха стоит в квадратных скобках, но она
# есть, поэтому без 〔〕. 7:12 — в базе σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν («ваше о нас»),
# церковный текст (слав., Синодальный, jp-joc) читает ἡμῶν τὴν ὑπὲρ ὑμῶν («наше о вас») —
# принято, это замена, не добавка.
# Цитат Писания в главе нет. Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 7
draft: true

verses:
  1: "それゆえ、愛[あい]する者[もの]たちよ、わたしたちはこれらの約束[やくそく]を持[も]っているのだから、肉[にく]と霊[れい]のすべての汚[けが]れから自分[じぶん]を清[きよ]め、神[かみ]への恐[おそ]れのうちに聖[せい]さを全[まっと]うするべきである。"
  2: "わたしたちをあなたがたの心[こころ]に迎[むか]え入[い]れなさい。わたしたちは、だれも不当[ふとう]に扱[あつか]わず、だれも滅[ほろ]ぼさず、だれからも利[り]を貪[むさぼ]らなかった。"
  3: "わたしは、あなたがたを罪[つみ]に定[さだ]めるために言[い]っているのではない。あなたがたはわたしたちの心[こころ]の内[うち]にあり、わたしたちとともに死[し]に、ともに生[い]きる者[もの]である、とわたしは前[まえ]に言[い]ったからである。"
  4: "あなたがたに対するわたしの大胆[だいたん]さは大[おお]きく、あなたがたについてのわたしの誇[ほこ]りも大[おお]きい。わたしは慰[なぐさ]めに満[み]ち、わたしたちのすべての苦難[くなん]のうちにあって、喜[よろこ]びに溢[あふ]れている。"
  5: "なぜなら、わたしたちがマケドニアに来[き]たとき、わたしたちの肉体[にくたい]には何[なん]の安[やす]らぎもなかったからである。かえって、わたしたちはすべてのことに苦[くる]しみ、外[そと]には争[あらそ]い、内[うち]には恐[おそ]れがあった。"
  6: "しかし、へりくだる者[もの]たちを慰[なぐさ]めてくださる神[かみ]は、テトスが来[き]たことによって、わたしたちを慰[なぐさ]めてくださった。"
  7: "そして、ただ彼[かれ]が来[き]たことによってだけでなく、彼[かれ]があなたがたのところで受[う]けた慰[なぐさ]めによっても、慰められた。彼[かれ]は、あなたがたの慕[した]い、あなたがたの嘆[なげ]き、わたしに対するあなたがたの熱心[ねっしん]をわたしたちに告[つ]げたので、わたしはますます喜[よろこ]んだ。"
  8: "だから、たとえわたしが手紙[てがみ]によってあなたがたを悲[かな]しませたとしても、わたしは後悔[こうかい]しない。たとえ後悔したとしても（あの手紙[てがみ]が、しばらくの間[あいだ]ではあるが、あなたがたを悲しませたことを、わたしは見[み]ている）。"
  9: "今[いま]、わたしは喜[よろこ]んでいる。あなたがたが悲しんだからではなく、あなたがたが悲しんで悔[く]い改[あらた]めに至[いた]ったからである。あなたがたは神[かみ]の御心[みこころ]に従[したが]って悲しんだのであり、それは、あなたがたがわたしたちから何[なん]の損[そん]も受[う]けないためであった。"
  10: "なぜなら、神[かみ]の御心[みこころ]に従[したが]う悲[かな]しみは、悔[く]いのない悔[く]い改[あらた]めを生[しょう]じて救[すく]いに至[いた]らせるが、世[よ]の悲しみは死[し]を生[しょう]じるからである。"
  11: "見[み]よ、あなたがたが神[かみ]の御心[みこころ]に従って悲しんだこと自体が、あなたがたのうちに、どれほどの熱意[ねつい]を、いや、どんな弁明[べんめい]を、いや、どんな憤[いきどお]りを、いや、どんな恐[おそ]れを、いや、どんな慕[した]いを、いや、どんな熱心[ねっしん]を、いや、どんな罰[ばつ]を生[しょう]じさせたことか。あなたがたはすべてのことにおいて、この事[こと]に自分[じぶん]が潔白[けっぱく]であることを示[しめ]したのである。"
  12: "だから、わたしがあなたがたに手紙[てがみ]を書[か]いたのは、不当[ふとう]を行[おこな]った者[もの]のためでも、不当を行われた者[もの]のためでもなく、あなたがたに対するわたしたちの熱意[ねつい]が、神[かみ]の前[まえ]であなたがたに明[あき]らかになるためであった。"
  13: "それゆえ、わたしたちは慰[なぐさ]められた。そして、この慰めのうえに、なおさら喜[よろこ]んだのは、テトスの喜びによる。彼[かれ]の霊[れい]があなたがたすべてによって安[やす]められたからである。"
  14: "わたしは、あなたがたについて彼[かれ]に誇[ほこ]ったが、恥[は]ずかしい思[おも]いをしなかった。しかし、わたしたちがあなたがたに語[かた]ったすべてのことが真実[しんじつ]であるように、テトスの前[まえ]でのわたしたちの誇りも、また真実となったのである。"
  15: "そして、彼[かれ]の心[こころ]は、あなたがたに対してますます深[ふか]くなっている。彼[かれ]は、あなたがたすべての従順[じゅうじゅん]と、あなたがたが恐[おそ]れと震[ふる]えをもって彼[かれ]を受[う]け入[い]れたことを思[おも]い起[おこ]しているのである。"
  16: "わたしは、あなたがたについてすべてのことに確信[かくしん]を持[も]てることを喜[よろこ]んでいる。"

notes:
  1: "ἐπαγγελίαι — 約束. μολυσμός — 汚れ. ἐπιτελοῦντες ἁγιωσύνην — 聖さを全うする. ἐν φόβῳ θεοῦ — 神への恐れのうちに."
  2: "Χωρήσατε — «вместите»; 心に迎え入れなさい. ἠδικήσαμεν — 不当に扱う; ἐφθείραμεν — 滅ぼす; ἐπλεονεκτήσαμεν — 利を貪る."
  3: "πρὸς κατάκρισιν — 罪に定めるために. προείρηκα — 前に言った. γάρ передан «からである»."
  4: "παρρησία — 大胆さ. πεπλήρωμαι τῇ παρακλήσει — 慰めに満ち. ὑπερπερισσεύομαι — 溢れている."
  5: "ἄνεσις — 安らぎ. ἔξωθεν μάχαι, ἔσωθεν φόβοι — 外には争い、内には恐れ."
  6: "ὁ παρακαλῶν τοὺς ταπεινούς — へりくだる者たちを慰めてくださる神. παρουσία Τίτου — テトスが来たこと."
  7: "ἐπιπόθησις — 慕い; ὀδυρμός — 嘆き; ζῆλος ὑπὲρ ἐμοῦ — わたしに対する熱心."
  8: "В базе вторая половина в квадратных скобках [βλέπω…]; она есть, поэтому без 〔〕. μεταμέλομαι — 後悔する."
  9: "εἰς μετάνοιαν — 悔い改めに至る. κατὰ θεόν — 神の御心に従って. ζημιωθῆτε — 損を受ける."
  10: "ἀμεταμέλητον — 悔いのない. ἡ τοῦ κόσμου λύπη — 世の悲しみ."
  11: "ἀλλά шесть раз передано «いや» — риторическое нарастание (слав. «но»). σπουδή, ἀπολογία, ἀγανάκτησις, φόβος, ἐπιπόθησις, ζῆλος, ἐκδίκησις — 熱意、弁明、憤り、恐れ、慕い、熱心、罰. ἁγνοί — 潔白."
  12: "В базе σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν («ваше о нас»); церковный текст (слав., Синодальный, jp-joc) читает ἡμῶν τὴν ὑπὲρ ὑμῶν — わたしたちの熱意. Замена, поэтому без 〔〕."
  13: "παρακεκλήμεθα — 慰められた. ἀναπέπαυται τὸ πνεῦμα αὐτοῦ — 彼の霊が安められた."
  14: "κατῃσχύνθην — 恥ずかしい思いをした. καύχησις — 誇り."
  15: "σπλάγχνα — 心. ὑπακοή — 従順; φόβος καὶ τρόμος — 恐れと震え."
  16: "θαρρῶ ἐν ὑμῖν — あなたがたについて確信している."
