verses:
  1: "これらの言葉[ことば]の後[のち]、王[おう]の怒[いか]りは静[しず]まり、王はもはやアスティンのことを思[おも]い出[だ]さなかった。ただ、彼女[かのじょ]が何[なに]を語[かた]ったか、王がどのように彼女を裁[さば]いたかを思い返しながら。"
  2: "王[おう]の僕[しもべ]たちが言[い]った。「王のために、汚[けが]れのない、姿[すがた]の美[うつく]しい娘[むすめ]たちが探[さが]し求[もと]められ、王がご自分[じぶん]の王国[おうこく]のすべての地方[ちほう]に、娘たちを捜[さが]す者[もの]たちを置[お]かれるように。"
  3: "王[おう]は王国[おうこく]のすべての地方[ちほう]に村[むら]々[むら]の長[おさ]たちを置[お]き、彼[かれ]らに、処女[しょじょ]で姿[すがた]の美[うつく]しい娘[むすめ]たちをスサの都[みやこ]の後宮[こうきゅう]に選[えら]び出[だ]させ、女[おんな]たちを守[まも]る者[もの]である王の宦官[かんがん]に渡[わた]させ、塗[ぬ]り油[あぶら]とそのほかの手入[てい]れの品[しな]を与[あた]えさせるように。"
  4: "そして、王[おう]の気[き]に入[い]る女[おんな]が、アスティンの代[か]わりに王妃[おうひ]となるように。」王はこの言葉[ことば]を良[よ]しとし、そのとおりに行[おこな]った。"
  5: "スサの都[みやこ]に、一人[ひとり]のユダヤ人[じん]の男[おとこ]がいた。名[な]はモルデカイといい、ヤイロの子[こ]、セメイの子、キサイの子で、ベニヤミン族[ぞく]の者[もの]であった。"
  6: "この人[ひと]は、バビロンの王[おう]ネブカドネツァルが捕[と]らえたエルサレムから連[つ]れて来[き]た捕囚[ほしゅう]の者[もの]であった。"
  7: "彼[かれ]には養[やしな]い子[ご]があった。父[ちち]の兄弟[きょうだい]であるアミナダブの娘[むすめ]で、名[な]をエステルといった。両親[りょうしん]が死[し]ぬと、モルデカイは彼女[かのじょ]を自分[じぶん]の娘として育[そだ]てた。この娘は姿[すがた]が美[うつく]しかった。"
  8: "王[おう]の命令[めいれい]が聞[き]かれると、多[おお]くの娘[むすめ]たちがスサの都[みやこ]に集[あつ]められ、ガイの手[て]に委[ゆだ]ねられた。エステルもまた、女[おんな]たちを守[まも]る者[もの]であるガイのもとへ連[つ]れて行[ゆ]かれた。"
  9: "この娘[むすめ]は彼[かれ]の気[き]に入[い]り、彼の前[まえ]で恵[めぐ]みを得[え]た。そこで彼は急[いそ]いで彼女[かのじょ]に塗[ぬ]り油[あぶら]と分[わ]け前、また王[おう]の家[いえ]から彼女に定[さだ]められた七人[しちにん]の娘たちを与[あた]えた。そして後宮[こうきゅう]で、彼女とその女中[じょちゅう]たちを手厚[てあつ]く扱[あつか]った。"
  10: "エステルは自分[じぶん]の民族[みんぞく]のことも、故郷[こきょう]のことも明[あき]らかにしなかった。モルデカイが、それを告[つ]げてはならないと彼女[かのじょ]に命[めい]じていたからである。"
  11: "モルデカイは毎日[まいにち]、女[おんな]たちの庭[にわ]を行[ゆ]き来[き]して、エステルがどうなるかをうかがっていた。"
  12: "娘[むすめ]が王[おう]のもとへ行[ゆ]く時[とき]は、十二[じゅうに]か月[げつ]が満[み]ちるまでであった。女[おんな]たちの手入[てい]れの日[ひ]々[び]はこうして満ちる。すなわち、六[ろっ]か月は香料[こうりょう]と女たちの塗[ぬ]り油[あぶら]のうちに、六か月は没薬[もつやく]の油を塗って過[す]ごすのである。"
  13: "そして、その時[とき]、彼女[かのじょ]は王[おう]のもとへ入[はい]る。後宮[こうきゅう]から王宮[おうきゅう]まで、自分[じぶん]を連[つ]れて行[い]くよう彼女が言[い]った者[もの]はだれでも、彼女とともに入る。"
  14: "彼女[かのじょ]は夕[ゆう]べに入[はい]り、朝[あさ]には第二[だいに]の後宮[こうきゅう]、すなわち王[おう]の宦官[かんがん]で女[おんな]たちを守[まも]る者[もの]ガイのいる所[ところ]へ帰[かえ]って行[い]く。そして、名[な]を呼[よ]ばれないかぎり、もはや王のもとへは入らない。"
  15: "モルデカイの父[ちち]の兄弟[きょうだい]アミナダブの娘[むすめ]、すなわちモルデカイが自分[じぶん]の娘として迎[むか]えたエステルが、王[おう]のもとへ入[はい]る時[とき]が満[み]ちると、彼女[かのじょ]は、女[おんな]たちを守[まも]る宦官[かんがん]が命[めい]じたことのうち、何[なに]ひとも拒[こば]まなかった。エステルは、彼女を見[み]るすべての人[ひと]から恵[めぐ]みを得[え]ていたからである。"
  16: "エステルは、アルタシャスタ王[おう]の治世[ちせい]の第七年[だいしちねん]、第十二[だいじゅうに]の月[つき]、すなわちアダルに、王のもとへ入[はい]った。"
  17: "王[おう]はエステルを愛[あい]し、彼女[かのじょ]はすべての処女[しょじょ]たちにまさって恵[めぐ]みを得[え]た。そこで王は彼女に王妃[おうひ]の王冠[おうかん]を載[の]せた。"
  18: "王[おう]はすべての友[とも]たちと軍勢[ぐんぜい]のために七日間[なのかかん]の酒宴[しゅえん]を開[ひら]き、エステルの婚礼[こんれい]を高[たか]く挙[あ]げ、自分[じぶん]の王国[おうこく]の下[もと]にある者[もの]たちに負担[ふたん]の免除[めんじょ]を行[おこな]った。"
  19: "モルデカイは王[おう]の宮廷[きゅうてい]で仕[つか]えていた。"
  20: "エステルは自分[じぶん]の故郷[こきょう]のことも、自分の民族[みんぞく]のことも、自分の民[たみ]のことも明[あき]らかにしなかった。モルデカイが、神[かみ]を恐[おそ]れ、神の戒[いまし]めを行[おこな]うよう彼女[かのじょ]に命[めい]じていたからである。彼[かれ]のもとにいた時[とき]と同[おな]じように、エステルは自分の生活[せいかつ]の仕方[しかた]を変[か]えなかった。"
  21: "王[おう]の宦官[かんがん]のうち、護衛[ごえい]の長[ちょう]である二人[ふたり]は、モルデカイが取[と]り立[た]てられたことを苦[くる]しく思[おも]い、アルタシャスタ王を殺[ころ]そうと図[はか]った。"
  22: "この話[はなし]はモルデカイに知[し]らされ、彼[かれ]はエステルに告[つ]げ、彼女[かのじょ]がその陰謀[いんぼう]の次第[しだい]を王[おう]に明[あ]らかにした。"
  23: "王[おう]は二人[ふたり]の宦官[かんがん]を取[と]り調[しら]べ、彼[かれ]らは自白[じはく]したので、二人を絞[くく]り首[くび]にした。王は、モルデカイの好意[こうい]について、記念[きねん]として王の書庫[しょこ]に賛辞[さんじ]をもって記[しる]すよう命[めい]じた。"

notes:
  1: "μετὰ τοὺς λόγους τούτους — «после этих слов»; ἐκόπασεν ὁ βασιλεὺς τοῦ θυμοῦ — «утих царь от гнева» (κοπάζω с родительным падежом); οὐκέτι ἐμνήσθη τῆς Αστιν — «уже не вспомнил Астинь» (μιμνήσκομαι); μνημονεύων οἷα ἐλάλησεν καὶ ὡς κατέκρινεν αὐτήν — «вспоминая, что она сказала и как он осудил её». Противоречие «не вспомнил — вспоминая» сохранено, как в греческом. Слав. «не воспомяну ктому астини»; ru (МТ) читает наоборот («вспомнил об Астинь») — не вносим."
  2: "Ζητηθήτω — импер. пасс. «да будут найдены, пусть ищут»; κοράσια ἄφθορα — «девицы непорочные» (ἄφθορος — нетронутый); καλὰ τῷ εἴδει — «красивые видом» (датив отношения). Слав. добавляет «и да поставит царь взыскатели во всех странах царствия своего» — в LXX этого нет, внесено в основной текст без скобок по паритету (ср. κωμάρχαι в ст. 3)."
  3: "κωμάρχας — «сельских начальников» (κώμη — село); слав. в ст. 3 это слово не переводит, оно у него в 2:2 как «взыскатели». ἐπιλεξάτωσαν — импер. «пусть выберут»; γυναικῶνα — 後宮, женская половина; τῷ φύλακι τῶν γυναικῶν — «стражу женщин» (φύλαξ); σμῆγμα — «притирание, мазь» (塗り油); ἡ λοιπὴ ἐπιμέλεια — «прочее попечение» (слав. «прочыя потребы»)."
  4: "ἡ γυνή, ἣ ἂν ἀρέσῃ — «женщина, которая понравится» (ἀρέσκω с дативом); βασιλεύσει ἀντὶ Αστιν — «будет царицей вместо Астинь» (βασιλεύω — царствовать; о женщине — 王妃となる); ἤρεσεν τῷ βασιλεῖ τὸ πρᾶγμα — «угодно было царю дело» (слав. «слово»). Здесь закрывается прямая речь, начатая в ст. 2; 2:2–2:4a — одна цитата."
  5: "ἄνθρωπος ἦν Ιουδαῖος — «был человек иудей»; ὁ τοῦ Ιαιρου τοῦ Σεμειου τοῦ Κισαιου — цепь родительных: «[сын] Иаира, [сына] Семея, [сына] Кисая»; ἐκ φυλῆς Βενιαμιν — «из племени Вениамина» (φυλή — колено, племя). Слав. «сын иаиров, сына семеина, сына кисеова» — та же цепь."
  6: "αἰχμάλωτος ἐξ Ιερουσαλημ — «пленник из Иерусалима»; ἣν ᾐχμαλώτευσεν — относительное местоимение женского рода: «который (город) увёл в плен» (αἰχμαλωτεύω); слав. «пленен от Иерусалима». ru (МТ) добавляет «с Иехониею, царем Иудейским» — в LXX этого нет."
  7: "παῖς θρεπτή — «воспитанница» (θρεπτός — вскормленный); θυγάτηρ Αμιναδαβ ἀδελφοῦ πατρὸς αὐτοῦ — «дочь Аминадава, брата отца его», т. е. двоюродная сестра Мардохея; ἐν τῷ μεταλλάξαι αὐτῆς τοὺς γονεῖς — «когда её родители скончались» (μεταλλάσσω — эвфемизм смерти); ἐπαίδευσεν αὐτὴν ἑαυτῷ εἰς γυναῖκα — букв. «воспитал её себе в жену»; слав. «прия ю во дщере место» (в дочь) — по паритету в тексте церковное чтение, контекст 2:8–9, 2:15 подтверждает дочернее отношение."
  8: "τὸ τοῦ βασιλέως πρόσταγμα — «повеление царя» (πρόσταγμα); ὑπὸ χεῖρα Γαι — «под руку Гая», т. е. под надзор; ἤχθη — аор. пасс. «была приведена» (ἄγω). Γαι — ガイ; в ru «Гегай» — иная форма имени."
  9: "ἤρεσεν αὐτῷ — «понравилась ему»; εὗρεν χάριν ἐνώπιον αὐτοῦ — «обрела милость пред ним»; ἔσπευσεν — «поспешил»; σμῆγμα καὶ μερίδα — «притирание и долю» (μερίς — часть, паёк; слав. «участие»); τὰ ἑπτὰ κοράσια τὰ ἀποδεδειγμένα — «семь девиц назначенных» (ἀποδείκνυμι); ἐχρήσατο αὐτῇ καλῶς — «обошёлся с ней хорошо» (χράομαι)."
  10: "οὐχ ὑπέδειξεν — «не показала, не обнаружила» (ὑποδείκνυμι); τὸ γένος — «род, племя»; πατρίδα — «отечество»; ἐνετείλατο — «заповедал» (ἐντέλλομαι); μὴ ἀπαγγεῖλαι — «не объявлять» (ἀπαγγέλλω)."
  11: "περιεπάτει — имперфект «хаживал» (περιπατέω); κατὰ τὴν αὐλὴν τὴν γυναικείαν — «по женскому двору» (αὐλή — двор, 庭); ἐπισκοπῶν — «наблюдая, наведываясь» (ἐπισκοπέω); τί Εσθηρ συμβήσεται — «что с Есфирью случится» (συμβαίνω)."
  12: "οὗτος ἦν καιρὸς κορασίου εἰσελθεῖν — «это было время девице войти»; ἀναπληρώσῃ μῆνας δέκα δύο — «исполнит двенадцать месяцев»; αἱ ἡμέρες τῆς θεραπείας — «дни ухода» (θεραπεία; слав. «украшение»); σμυρνίνῳ ἐλαίῳ — «мирровым маслом» (σμύρνα — мирра, 没薬); ἄρωμα — 香料. Слав. меняет порядок: сначала ароматы и притирания, потом мирровое масло; в тексте порядок csl; в LXX наоборот — сначала шесть месяцев мирра, затем ароматы."
  13: "εἰσπορεύεται — наст. ист. «входит»; ὃ ἐὰν εἴπῃ — «что бы она ни сказала»; παραδώσει αὐτῇ — «даст ей»; συνεισέρχεσθαι αὐτῇ — «войти вместе с нею». Слав. «емуже аще речет привести ю» понимает ὃ как лицо (кому скажет) и опускает παραδώσει «даст»; в тексте это понимание (позволение выражено самой конструкцией), в LXX — «что бы она ни сказала, он даст ей войти с нею»."
  14: "δείλης — «вечером» (δείλη — послеполуденное время); ἀποτρέχει — «убегает, возвращается» (ἀποτρέχω); γυναικῶνα τὸν δεύτερον — «второй женский дом»; ἐὰν μὴ κληθῇ ὀνόματι — «если не будет позвана по имени» (καλέω)."
  15: "ἀναπληροῦσθαι τὸν χρόνον — «исполняться времени»; οὐδὲν ἠθέτησεν — «ничего не отвергла» (ἀθετέω); ὧν ἐνετείλατο — «из того, что заповедал»; εὑρίσκουσα χάριν — «находившая милость» (прич. наст.). Слав. добавляет «иже поял ю себе в дщере место» — в LXX нет, внесено без скобок."
  16: "τῷ δωδεκάτῳ μηνί — «в двенадцатый месяц»; ὅς ἐστιν Αδαρ — «который есть Адар»; τῷ ἑβδόμῳ ἔτει — «в седьмой год». ru (МТ) читает «десятый месяц, Тебеф» — расхождение с LXX и csl, не вносим."
  17: "ἠράσθη — «полюбил» (ἐράω); εὗρεν χάριν παρὰ πάσας τὰς παρθένους — «обрела милость более всех девиц» (παρά с винитивом сравнения); τὸ διάδημα τὸ γυναικεῖον — «женский венец» (διάδημα — 王冠). ru добавляет «сделал её царицей на место Астинь» — в LXX этого нет."
  18: "πότος — «пир, попойка»; ταῖς δυνάμεσιν — «силам», т. е. войску и сановникам; ὕψωσεν τοὺς γάμους — «возвысил брак»; ἄφεσιν ἐποίησεν — «сделал отпущение, льготу» (ἄφεσις; слав. «отраду») — вероятно, податное облегчение, поэтому 負担の免除."
  19: "ἐθεράπευεν — «служил» (θεραπεύω); ἐν τῇ αὐλῇ — «при дворе». Слав. добавляет в скобках «цареве» — в LXX нет, внесено без скобок. ru (МТ) добавляет «когда во второй раз собраны были девицы» — в LXX нет."
  20: "οὐχ ὑπέδειξεν τὴν πατρίδα — «не показала отечества» (故郷); слав. читает «рода своего» (民族) и добавляет «ни людий своих» (民) — в LXX этого добавления нет, внесено без скобок; φοβεῖσθαι τὸν θεὸν καὶ ποιεῖν τὰ προστάγματα — «бояться Бога и исполнять повеления Его»: по LXX это заповедал ей Мардохей, необычность выражения сохранена; καθὼς ἦν μετ᾽ αὐτοῦ — «как было при нём»; ἀγωγή — «образ жизни»."
  21: "ἐλυπήθησαν — «опечалились, огорчились» (λυπέω); ἀρχισωματοφύλακες — «начальники телохранителей» (ἀρχι- + σωματοφύλαξ); προήχθη — «был выдвинут» (προάγω); ἐζήτουν ἀποκτεῖναι — «искали убить». Имена Гавафа и Фарра (ru, МТ) в LXX отсутствуют."
  22: "ἐδηλώθη — «было донесено» (δηλόω); ἐσήμανεν — «дал знак, сообщил» (σημαίνω); ἐνεφάνισεν — «объявила» (ἐμφανίζω); τὰ τῆς ἐπιβουλῆς — «обстоятельства покушения» (ἐπιβουλή)."
  23: "ἤτασεν — «подверг допросу» (ἐτάζω); ἐκρέμασεν — «повесил» (κρεμάννυμι); καταχωρῆσαι εἰς μνημόσυνον — «записать в память» (καταχωρίζω); ἐν τῇ βασιλικῇ βιβλιοθήκῃ — «в царском книгохранилище» (βιβλιοθήκη, 書庫); ὑπὲρ τῆς εὐνοίας — «о благодеянии» (εὔνοια); ἐν ἐγκωμίῳ — «в похвалу» (ἐγκώμιον). Слав. добавляет «и исповедаста» — в LXX нет, внесено без скобок."
