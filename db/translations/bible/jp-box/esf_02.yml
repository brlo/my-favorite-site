# jp-box, Есфирь, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: совет искать девиц (1–4), Мардохей и Есфирь в Сузах (5–7), Есфирь в доме
# Гая (8–11), приготовления (12–14), Есфирь избрана царицей (15–18), заговор евнухов
# и запись в книгу (19–23).
# Прямая речь — 2:2–2:4a, одна цитата на три стиха (в 2:2 открывается, в 2:4
# закрывается); красного и синего нет.
# Нумерация по gr: 23 стиха; деление совпадает с csl-ru и ru.
# Слав. добавления внесены в основной текст без скобок по паритету: 2:2 «да поставит
# царь взыскатели…» (в LXX нет; ср. κωμάρχαι в 2:3), 2:15 «иже поял ю себе в дщере
# место», 2:19 «цареве», 2:20 «ни людий своих», 2:23 «и исповедаста». В 2:7 csl
# читает «в дщере место» (в дочь), LXX — εἰς γυναῖκα; взят csl, вариант в notes.
# В 2:12 csl меняет порядок шести месяцев; в тексте порядок csl, порядок LXX — в notes.
# 〔…〕 нет: все 23 стиха есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 後宮, 宦官, 女中,
# 塗り油, 王冠, 書庫 — по брифу сносок в книге нет.
# Имена — транслитерация греческого (LXX): アルタシャスタ, アスティン, エステル,
# モルデカイ, アミナダブ, ヤイロ, セメイ, キサイ, ベニヤミン, ガイ.

