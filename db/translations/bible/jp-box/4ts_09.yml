# jp-box, 4-я Царств, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 9: помазание Ииуя (1–10); заговор и воцарение (11–14); Иорам и Охозия
# выезжают навстречу и гибнут (15–29); Иезавель у окна (30–37).
# Речь — 「…」, вложенная — 『…』; пророческая речь 6–10 и слово Илии 36–37
# держатся открытыми через границы стихов (как в 3ts 19).
# Красного нет.
# Нумерация по gr: 37 стихов, совпадает с csl/ru.
# 〔…〕 нет: на месте всех стихов есть текст.
# Паритет: слав. добавления внесены в основной текст без скобок (8 «от руки всего
# дома Ахаава», 16 «и лежаше тамо», 27 «не имам оставити»); варианты LXX — в notes.
# Сносок ⟨…⟩ нет: 預言者, 戦車, 宦官, 墓 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 4ts
chapter: 9
draft: true

verses:
  1: "預言者[よげんしゃ]エリシャは、預言者[よげんしゃ]の子[こ]らの一人[ひとり]を呼[よ]んで言[い]った。「腰[こし]を引[ひ]き締[し]め、この油[あぶら]の入[はい]った壺[つぼ]を手[て]に取[と]って、ギレアデのラモトへ行[い]きなさい。"
  2: "そこへ行[い]くと、ヨシャファトの子[こ]、ニムシの子[こ]イエフがいるのを見[み]る。そして中[なか]に入[はい]り、彼[かれ]を兄弟[きょうだい]たちの間[あいだ]から立[た]たせ、奥[おく]の部屋[へや]へ連[つ]れて行[い]きなさい。"
  3: "油[あぶら]の壺[つぼ]を取[と]って彼[かれ]の頭[あたま]に注[そそ]ぎ、こう言[い]いなさい。『主[しゅ]はこう言[い]われる。私[わたし]はあなたに油[あぶら]を注[そそ]いで、イスラエルの王[おう]とした。』そして戸[と]を開[あ]け、逃[に]げなさい。そこに留[とど]まってはならない。」"
  4: "預言者[よげんしゃ]の若者[わかもの]はギレアデのラモトへ行[い]った。"
  5: "彼[かれ]が入[はい]ると、軍[ぐん]の長[かしら]たちが座[すわ]っていた。彼[かれ]は言[い]った。「長官[ちょうかん]、あなたに申[もう]し上[あ]げることがある。」イエフは言[い]った。「私[わたし]たちのうち、誰[だれ]に。」彼[かれ]は言[い]った。「長官[ちょうかん]、あなたに。」"
  6: "イエフは立[た]ち上[あ]がって家[いえ]の中[なか]に入[はい]った。若者[わかもの]は油[あぶら]を彼[かれ]の頭[あたま]に注[そそ]いで言[い]った。「イスラエルの神[かみ]、主[しゅ]はこう言[い]われる。私[わたし]はあなたに油[あぶら]を注[そそ]いで、主[しゅ]の民[たみ]イスラエルの王[おう]とした。"
  7: "あなたは、自分[じぶん]の主[あるじ]であるアハブの家[いえ]を私[わたし]の前[まえ]から根絶[こんぜつ]やしにし、わがしもべである預言者[よげんしゃ]たちの血[ち]と、主[しゅ]のすべてのしもべたちの血[ち]について、イゼベルの手[て]から報[ほう]いをする。"
  8: "また、アハブの家[いえ]のすべての者[もの]から報[ほう]いをする。アハブの家[いえ]から、壁[かべ]に向[む]かって放[はな]つ者[もの]も、閉[と]じ込[こ]められた者[もの]も、イスラエルに残[のこ]された者[もの]も、断[た]ち滅[ほろ]ぼす。"
  9: "私[わたし]はアハブの家[いえ]を、ネバトの子[こ]ヤロブアムの家[いえ]と、アヒヤの子[こ]バシャの家[いえ]と同[おな]じ末路[すえろ]にする。"
  10: "イゼベルはイズレエルの地[ち]で犬[いぬ]に食[く]われ、葬[ほうむ]る者[もの]もいなくなる。」そして彼[かれ]は戸[と]を開[あ]けて逃[に]げた。"
  11: "イエフが出[で]て来[き]ると、主君[しゅくん]の召使[めしつか]いたちが彼[かれ]に言[い]った。「無事[ぶじ]か。あの気[き]の変[へん]な男[おとこ]が、なぜあなたのところへ来[き]たのか。」彼[かれ]は言[い]った。「あなたがたは、あの男[おとこ]が何者[なにもの]で、どんなおしゃべりをするか知[し]っているだろう。」"
  12: "彼[かれ]らは言[い]った。「嘘[うそ]だ。話[はな]せ。」イエフは言[い]った。「彼[かれ]は私[わたし]にこう言[い]った。『主[しゅ]はこう言[い]われる。私[わたし]はあなたに油[あぶら]を注[そそ]いで、イスラエルの王[おう]とした。』」"
  13: "彼[かれ]らはこれを聞[き]くと、急[いそ]いでそれぞれ自分[じぶん]の衣[ころも]を取[と]り、彼[かれ]の足[あし]もとの階段[かいだん]に敷[し]いた。そして角笛[つのぶえ]を吹[ふ]いて言[い]った。「イエフが王[おう]となった。」"
  14: "ヨシャファトの子[こ]、ニムシの子[こ]イエフは、ヨラムに対[たい]して謀反[むほん]を起[お]こした。ヨラムは、シリアの王[おう]ハザエルに備[そな]えて、自分[じぶん]もイスラエルのすべての者[もの]も、ギレアデのラモトで見張[みは]りをしていた。"
  15: "ヨラム王[おう]は、シリアの王[おう]ハザエルと戦[たたか]ったときにシリア人[じん]から受[う]けた傷[きず]を癒[いや]すため、イズレエルへ戻[もど]っていた。イエフは言[い]った。「もしあなたがたが私[わたし]に心[こころ]を寄[よ]せているなら、だれもこの町[まち]から逃[に]げ出[だ]して、イズレエルに知[し]らせに行[い]ってはならない。」"
  16: "イエフは馬[うま]に乗[の]ってイズレエルへ下[くだ]って行[い]った。イスラエルの王[おう]ヨラムは、シリアの王[おう]ハザエルと戦[たたか]ったときにアラム人[じん]がラモトで負[お]わせた傷[きず]を癒[いや]すため、イズレエルで療養[りょうよう]していた。彼[かれ]は力[ちから]ある勇士[ゆうし]であった。そして、そこに横[よこ]になっていた。ユダの王[おう]アハズヤもヨラムを見舞[みま]うために下[くだ]って来[き]ていた。"
  17: "イズレエルのやぐらに上[のぼ]った見張[みは]りが、イエフが近[ちか]づいて来[く]るのを見[み]て、その土[つち]ぼこりを認[みと]め、言[い]った。「土[つち]ぼこりが見[み]える。」ヨラムは言[い]った。「騎手[きしゅ]を一人[ひとり]用意[ようい]して、彼[かれ]らに会[あ]いに行[い]かせ、『無事[ぶじ]か』と言[い]わせなさい。」"
  18: "騎手[きしゅ]は馬[うま]で彼[かれ]らに会[あ]いに行[い]き、言[い]った。「王[おう]はこう言[い]われる。『無事[ぶじ]か。』」イエフは言[い]った。「平和[へいわ]があなたに何[なん]の関係[かんけい]があるのか。私[わたし]の後[うし]ろに回[まわ]れ。」見張[みは]りは告[つ]げて言[い]った。「使者[ししゃ]は彼[かれ]らのところへ着[つ]いたが、戻[もど]って来[こ]ない。」"
  19: "ヨラムは二番目[にばんめ]の騎手[きしゅ]を送[おく]った。彼[かれ]は彼[かれ]らのところへ来[き]て言[い]った。「王[おう]はこう言[い]われる。『無事[ぶじ]か。』」イエフは言[い]った。「平和[へいわ]があなたに何[なん]の関係[かんけい]があるのか。私[わたし]の後[うし]ろに回[まわ]れ。」"
  20: "見張[みは]りは告[つ]げて言[い]った。「彼[かれ]は彼[かれ]らのところへ着[つ]いたが、戻[もど]って来[こ]ない。しかも、その走[はし]り方[かた]はニムシの子[こ]イエフのようだ。彼[かれ]は猛[もう]烈[れつ]に走[はし]っているからだ。」"
  21: "ヨラムは言[い]った。「馬[うま]を繋[つな]げ。」そして戦車[せんしゃ]が繋[つな]がれた。イスラエルの王[おう]ヨラムとユダの王[おう]アハズヤは、それぞれ自分[じぶん]の戦車[せんしゃ]に乗[の]って出[で]て行[い]き、イエフに会[あ]った。そして、イズレエル人[じん]ナボテの畑[はたけ]で彼[かれ]を見[み]つけた。"
  22: "ヨラムはイエフを見[み]ると言[い]った。「イエフよ、無事[ぶじ]か。」イエフは言[い]った。「あなたの母[はは]イゼベルの淫行[いんこう]と、その多[おお]くの呪術[じゅじゅつ]が続[つづ]いているのに、どうして平和[へいわ]がありえようか。」"
  23: "ヨラムは手[て]を巡[めぐ]らして逃[に]げようとし、アハズヤに言[い]った。「アハズヤよ、裏切[うらぎ]りだ。」"
  24: "イエフは弓[ゆみ]をいっぱいに引[ひ]き、ヨラムの両肩[りょうかた]の間[あいだ]を射抜[いぬ]いた。矢[や]は彼[かれ]の心臓[しんぞう]を貫[つらぬ]き、彼[かれ]はひざの上[うえ]にうずくまった。"
  25: "イエフは自分[じぶん]の高官[こうかん]ビデカルに言[い]った。「彼[かれ]を取[と]って、イズレエル人[じん]ナボテの畑[はたけ]に投[な]げ捨[す]てよ。思[おも]い出[だ]せ。私[わたし]とあなたが、彼[かれ]の父[ちち]アハブの後[うし]ろを二頭立[にとうだ]ての戦車[せんしゃ]で進[すす]んでいたとき、主[しゅ]は彼[かれ]についてこの宣告[せんこく]を下[くだ]された。"
  26: "『ナボテの血[ち]と、その息子[むすこ]たちの血[ち]を、私[わたし]は昨日[きのう]見[み]た』と主[しゅ]は言[い]われる。『私[わたし]はこの畑[はたけ]で彼[かれ]に報[むく]いる』と主[しゅ]は言[い]われる。今[いま]、彼[かれ]を取[と]って、主[しゅ]の言葉[ことば]どおりに、この畑[はたけ]に投[な]げ捨[す]てよ。」"
  27: "ユダの王[おう]アハズヤはそれを見[み]て、ベト・ハガンの道[みち]へ逃[に]げた。イエフは彼[かれ]を追[お]って言[い]った。「あの者[もの]も撃[う]て。」そして、彼[かれ]がガイへ上[のぼ]って行[い]くとき、イエフは戦車[せんしゃ]の上[うえ]で彼[かれ]を撃[う]った。そこはイブレアムである。アハズヤはメギドへ逃[に]げ、そこで死[し]んだ。"
  28: "彼[かれ]の家来[けらい]たちは彼[かれ]を戦車[せんしゃ]に乗[の]せ、エルサレムへ運[はこ]び、ダビデの町[まち]にある彼[かれ]の墓[はか]に葬[ほうむ]った。"
  29: "イスラエルの王[おう]ヨラムの第十一年[だいじゅういちねん]に、アハズヤがユダの王[おう]となった。"
  30: "イエフはイズレエルに来[き]た。イゼベルはそれを聞[き]くと、自分[じぶん]の目[め]に化粧[けしょう]を施[ほどこ]し、頭[あたま]を飾[かざ]って、窓[まど]から外[そと]をのぞいた。"
  31: "イエフが町[まち]の門[もん]に入[はい]ろうとしているとき、彼女[かのじょ]は言[い]った。「無事[ぶじ]でいられるのか、ザムリよ、主君[しゅくん]を殺[ころ]した者[もの]よ。」"
  32: "彼[かれ]は窓[まど]へ顔[かお]を上[あ]げ、彼女[かのじょ]を見[み]て言[い]った。「おまえは誰[だれ]だ。私[わたし]のところへ下[お]りて来[こ]い。」すると、二人[ふたり]の宦官[かんがん]が彼[かれ]のほうに身[み]を乗[の]り出[だ]した。"
  33: "彼[かれ]は言[い]った。「彼女[かのじょ]を突[つ]き落[お]とせ。」彼[かれ]らは彼女[かのじょ]を突[つ]き落[お]とした。その血[ち]が壁[かべ]と馬[うま]に飛[と]び散[ち]り、人々[ひとびと]は彼女[かのじょ]を踏[ふ]みつけた。"
  34: "イエフは中[なか]に入[はい]って食[た]べたり飲[の]んだりし、そして言[い]った。「あの呪[のろ]われた女[おんな]を見[み]に行[い]き、葬[ほうむ]ってやれ。王[おう]の娘[むすめ]だから。」"
  35: "彼[かれ]らは彼女[かのじょ]を葬[ほうむ]ろうとして行[い]ったが、見[み]つかったのは頭蓋骨[ずがいこつ]と両足[りょうあし]と両手[りょうて]のひらだけだった。"
  36: "彼[かれ]らは戻[もど]って来[き]て、彼[かれ]に告[つ]げた。イエフは言[い]った。「これは、主[しゅ]がそのしもべ、ティシュベ人[じん]エリヤによって語[かた]られた主[しゅ]の言葉[ことば]だ。『イズレエルの地[ち]で、犬[いぬ]がイゼベルの肉[にく]を食[く]う。"
  37: "イゼベルの死体[したい]は、イズレエルの地[ち]の畑[はたけ]の面[おもて]に、糞[ふん]のように転[ころ]がる。だれも『これがイゼベルだ』と言[い]うことができない。』」"

notes:
  1: "ἐκάλεσεν ἕνα τῶν υἱῶν τῶν προφητῶν — одного из сынов пророков, т. е. учеников пророческих (預言者の子ら). Ζῶσαι τὴν ὀσφύν — «препояшь чресла», подпояшься для дороги. φακός — фляга, сосуд для масла (слав. «сосуд елеа»). Ῥεμμωθ Γαλααδ — Рамоф Галаадский (ギレアデのラモト)."
  2: "Ιου υἱὸν Ιωσαφατ υἱοῦ Ναμεσσι — Ииуй, сын Иосафата, сына Намессии (イエフ, ニムシ; слав. «намессиева»). ἀναστήσεις — «поднимешь», заставишь встать. ταμιεῖον — внутренняя комната, клеть; ἐν τῷ ταμιείῳ — «во внутренней комнате» (плеоназм LXX)."
  3: "ἐπιχεεῖς — возольёшь (ἐπιχέω). Κέχρικά σε — «помазал Я тебя» (perfect от χρίω). ἀνοίξεις τὴν θύραν — откроешь дверь. φεύξῃ καὶ οὐ μενεῖς — убежишь и не останешься."
  4: "τὸ παιδάριον ὁ προφήτης — «отрок, пророк» (приложение); слав. «отрочищь пророк». Синод. «отрок, слуга пророка»."
  5: "οἱ ἄρχοντες τῆς δυνάμεως — начальники войска. Λόγος μοι πρὸς σέ — «слово мне к тебе», у меня дело. ὁ ἄρχων — «начальник», обращение (слав. «княже»), 長官."
  6: "ἐπέχεεν τὸ ἔλαιον — вылил елей. ὁ θεὸς Ισραηλ — Бог Израиля. ἐπὶ λαὸν κυρίου — над народом Господним. Речь продолжается до ст. 10."
  7: "ἐξολεθρεύσεις — истребишь (ἐξολοθρεύω). ἐκ προσώπου μου — от лица Моего. ἐκδικήσεις τὰ αἵματα — отмстишь за кровь (ἐκδικέω). ἐκ χειρὸς Ιεζαβελ — от руки Иезавели."
  8: "ἐκ χειρὸς ὅλου τοῦ οἴκου Αχααβ — «от руки всего дома Ахава»; слав. добавление «и от руки всего дому ахаавля» внесено в начало стиха. οὐρῶν πρὸς τοῖχον — «мочащийся к стене», евр. идиома «мужчина». συνεχόμενον — «заключённого» (συνέχω). ἐγκαταλελειμμένον — «оставленного». Формула полного истребления дома."
  9: "δώσω — «дам», т. е. сделаю с ним то же. Иеровоам, сын Навата; Вааса, сын Ахии — цари, чьи дома были истреблены (3 Цар 15:29; 16:11). ὡς τὸν οἶκον — как дом."
  10: "καταφάγονται οἱ κύνες — съедят псы. ἐν τῇ μερίδι Ιεζραελ — в уделе Изрееля (イズレエル). ὁ θάπτων — погребающий. ἤνοιξεν τὴν θύραν καὶ ἔφυγεν — отворил дверь и убежал; здесь закрывается речь, начатая в ст. 6."
  11: "Εἰ εἰρήνη; — «с миром ли?», т. е. всё ли благополучно. ἐπίλημπτος — неистовый, одержимый (ἐπιλαμβάνω); передано 気の変な. ἀδολεσχία — пустословие, болтовня."
  12: "Ἄδικον — «неправда» (букв. «неправо»); слав. «не правда». ἀπάγγειλον — возвести, расскажи. Οὕτως καὶ οὕτως — «так и так»."
  13: "ἔσπευσαν — поспешили. ἱμάτιον — плащ, одежда. ἐπὶ γαρεμ τῶν ἀναβαθμῶν — «на герем ступеней» (евр. גֶּרֶם — кость, здесь, вероятно, «помост, самый верх»); слав. «на единем от степений». ἐσάλπισαν ἐν κερατίνῃ — затрубили в рог (κερατίνη). Ἐβασίλευσεν Ιου — «воцарился Ииуй»."
  14: "συνεστράφη — «сговорился, составил заговор» (συστρέφω); слав. «возвратися» понято иначе. ἐφύλασσεν — охранял, стоял на страже. ἀπὸ προσώπου Αζαηλ — «от лица Азаила», т. е. против Азаила."
  15: "ἀπέστρεψεν — возвратился. ἰατρευθῆναι — лечиться. ἔπαισαν — нанесли удары (παίω). Εἰ ἔστιν ἡ ψυχὴ ὑμῶν μετ᾽ ἐμοῦ — «если душа ваша со мною», если вы за меня. διαπεφευγώς — убежав. ἀπαγγεῖλαι — возвестить."
  16: "ἵππευσεν — сел на коня, поехал (ἱππεύω). ἐθεραπεύετο — лечился (θεραπεύω). ἀπὸ τῶν τοξευμάτων — от стрел (τόξευμα). κατετόξευσαν — обстреляли (κατατοξεύω); οἱ Αραμιν — арамеи (アラム人). ὅτι αὐτὸς δυνατὸς καὶ ἀνὴρ δυνάμεως — «ибо он был силён и муж силы»; тёмное место, возможно, передаёт евр. «он лежал там»; слав. добавляет «и лежаше тамо» — внесено. κατέβη ἰδεῖν — сошёл увидеть."
  17: "σκοπός — страж, 見張り. πύργος — башня, やぐら. κονιορτός — пыль (слав. «прах»); Синод. «полчище» — иначе. ἐπιβάτης — всадник. Εἰ εἰρήνη; — «с миром ли?»"
  18: "εἰς ἀπαντήν — навстречу. Τί σοι καὶ εἰρήνῃ; — «что тебе и миру?», что общего у тебя с миром. ἐπιστρέφου εἰς τὰ ὀπίσω μου — «обратись за мною». ὁ ἄγγελος — посланный, всадник. οὐκ ἀνέστρεψεν — не возвратился."
  19: "δεύτερον — второго. Повтор вопроса и ответа (ср. 18). ἐπιστρέφου — обращайся (imper. praes.)."
  20: "ὁ ἄγων — «ведущий», возница, предводитель (ἄγω). ἐν παραλλαγῇ — «в перемене», т. е. необычно, стремительно; слав. «в премене». ἦγεν — вёл."
  21: "Ζεῦξον — «запрягай» (ζεύγνυμι). ἅρμα — колесница, 戦車. ἀνὴρ ἐν τῷ ἅρματι αὐτοῦ — каждый в своей колеснице. ἐν τῇ μερίδι Ναβουθαι — на участке Навуфея (ナボテ)."
  22: "Εἰ εἰρήνη, Ιου; — «с миром ли, Ииуй?» αἱ πορνεῖαι — блудодеяния (πορνεία), здесь идолослужение. φάρμακα — зелья, волхвования (φάρμακον). τῆς μητρός σου — матери твоей (Иезавели)."
  23: "ἐπέστρεψεν τὰς χεῖρας — «обратил руки», повернул поводья. Δόλος — «измена, коварство» (слав. «лесть»)."
  24: "ἔπλησεν τὴν χεῖρα αὐτοῦ ἐν τῷ τόξῳ — «наполнил руку свою луком», натянул лук. ἀνὰ μέσον τῶν βραχιόνων — между плечами (βραχίων). τὸ βέλος — стрела. διὰ τῆς καρδίας — через сердце. ἔκαμψεν ἐπὶ τὰ γόνατα — согнулся на колени."
  25: "Βαδεκαρ — Вадекар (слав.; Синод. «Бидекар»), ビデカル. τριστάτης — тристат, 高官. Ῥῖψον — брось (ῥίπτω). ἐν τῇ μερίδι ἀγροῦ — на участке поля. ἐπιβεβηκότες ἐπὶ ζεύγη — «севшие на упряжки», ехавшие в колесницах. τὸ λῆμμα — «изречение, пророческое слово» (λῆμμα)."
  26: "Εἰ μὴ — клятвенная формула: «не так ли…», «если не…». ἀνταποδώσω — воздам (ἀνταποδίδωμι). ἐν τῇ μερίδι ταύτῃ — на участке этом. κατὰ τὸ ῥῆμα κυρίου — по слову Господню. Вложенная речь внутри слов Ииуя."
  27: "Βαιθαγγαν — Бет-Хагган (слав. «вефган»), ベト・ハガン. Καί γε αὐτόν — «и его тоже»; слав. «и сего (не имам оставити)» — добавление. Γαι, ἥ ἐστιν Ιεβλααμ — Гай, который есть Иевлаам (слав. «гай, иже есть иевлаам»), ガイ, イブレアム. Μαγεδδων — Мегиддон (メギド)."
  28: "ἐπεβίβασαν — возложили, посадили на колесницу. ἤγαγον — привезли. ἔθαψαν ἐν τῷ τάφῳ αὐτοῦ — похоронили в гробнице его."
  29: "ἐν ἔτει ἑνδεκάτῳ — в одиннадцатый год (ср. 8:25 — двенадцатый; расхождение LXX и евр. текста). ἐβασίλευσεν ἐπὶ Ιουδαν — воцарился над Иудой."
  30: "ἐστιμίσατο τοὺς ὀφθαλμούς — подвела глаза сурьмой (στίμμι); слав. «намаза лице свое» — неточно. ἠγάθυνεν τὴν κεφαλήν — украсила голову. διέκυψεν διὰ τῆς θυρίδος — выглянула в окно (θυρίς)."
  31: "Ζαμβρι — Замврий (Зимри), узурпатор, убивший царя (3 Цар 16:9–20); ирония: Иезавель называет Ииуя новым Замврием. ὁ φονευτής — убийца. Εἰ εἰρήνη; — «с миром ли?»"
  32: "Τίς εἶ σύ; — «кто ты?» (слав. то же); Синод. иначе: «кто со мною?» ἐπῆρεν τὸ πρόσωπον — поднял лицо. κατάβηθι μετ᾽ ἐμοῦ — сойди ко мне. εὐνοῦχοι — евнухи, 宦官."
  33: "Κυλίσατε — «свергните, скатите» (κυλίω). ἐρραντίσθη — окропилась (ῥαντίζω). πρὸς τὸν τοῖχον καὶ πρὸς τοὺς ἵππους — на стену и на коней. συνεπάτησαν — потоптали."
  34: "Ἐπισκέψασθε — «осмотрите» (ἐπισκέπτομαι). κατηραμένη — проклятая. θυγάτηρ βασιλέως — дочь царя."
  35: "κρανίον — череп. οἱ πόδες — ноги. τὰ ἴχνη τῶν χειρῶν — «следы рук», т. е. кисти, ладони (слав. «длани»). οὐχ εὗρον ἄλλο τι ἤ — не нашли ничего, кроме."
  36: "ἐν χειρὶ δούλου αὐτοῦ Ηλιου τοῦ Θεσβίτου — «рукою раба Своего Илии Фесвитянина» (ティシュベ人). Исполнение 3 Цар 21:23. καταφάγονται — съедят. Слово Илии продолжается в ст. 37."
  37: "θνησιμαῖον — труп, падаль. κοπρία — навоз. ἐπὶ προσώπου τοῦ ἀγροῦ — «на лице поля», на поверхности поля. ὥστε μὴ εἰπεῖν — так что нельзя сказать. Здесь закрываются вложенная речь и слова Ииуя."
