# jp-box, Исход, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru. jp-joc в этой главе нет.
# ru (с масоретского) — только для понимания, его чтения не вносим.
# Язык — современный 常体; речь людей — в 「…」, вложенная — 『…』.
# Глава 5: «отпусти народ» и ответ фараона (1–5), приказ не давать соломы (6–9),
# разосланные сборщики и побои надзирателям (10–14), жалоба надзирателей (15–19),
# встреча с Моисеем и Аароном (20–21), ропот Моисея (22–23).
# Красного и синего нет: прямая речь — людей (фараона, надзирателей, Моисея).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 5:3 — у LXX «смерть или убийство», а не «язва или меч» (масоретский текст, Синодальный).
# 5:21 — ἐβδελύξατε τὴν ὀσμὴν ἡμῶν передано буквально («сделали запах наш мерзким»).
# Сносок ⟨…⟩ нет: れんが, わら, 剣 уже в корпусе; 書記 понятно по контексту.
# jp-ni не использовался.

