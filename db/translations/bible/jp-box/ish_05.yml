verses:
  1: "その後[のち]、モーセとアロンはファラオのところへ行[い]って言[い]った。「イスラエルの神[かみ]、主[しゅ]はこう言[い]われる。『わたしの民[たみ]を去[さ]らせよ。荒野[こうや]でわたしのために祭[まつ]りを行[おこな]わせるためである。』」"
  2: "ファラオは言[い]った。「主[しゅ]とは何者[なにもの]か。わたしがその声[こえ]に聞[き]き従[したが]って、イスラエルを去[さ]らせるというのか。わたしは主[しゅ]を知[し]らない。イスラエルも去[さ]らせない。」"
  3: "彼[かれ]らは言[い]った。「ヘブライ人[じん]の神[かみ]がわたしたちを呼[よ]ばれた。どうか、荒野[こうや]へ三日[みっか]の道[みち]のりを行[い]かせてください。わたしたちの神[かみ]に犠牲[ぎせい]を献[ささ]げるためです。そうでなければ、死[し]か殺[ころ]されることが、わたしたちに降[ふ]りかかるかもしれません。」"
  4: "エジプトの王[おう]は彼[かれ]らに言[い]った。「モーセ、アロンよ、なぜあなたがたは民[たみ]を仕事[しごと]から引[ひ]き離[はな]すのか。それぞれ自分[じぶん]の仕事[しごと]に戻[もど]れ。」"
  5: "ファラオはまた言[い]った。「見[み]よ、今[いま]やこの民[たみ]は多[おお]い。しかも、あなたがたは彼[かれ]らを仕事[しごと]から休[やす]ませようとしている。」"
  6: "その日[ひ]、ファラオは民[たみ]の仕事[しごと]の督促[とくそく]役[やく]たちと書記[しょき]たちに命[めい]じて言[い]った。"
  7: "「これからは、れんがを作[つく]るためのわらを、これまでどおり民[たみ]に与[あた]えてはならない。彼[かれ]ら自身に行[い]かせ、わらを自分[じぶん]たちで集[あつ]めさせよ。"
  8: "また、これまで彼[かれ]らが作[つく]っていたれんがの割[わ]り当[あ]てを、そのまま彼[かれ]らに課[か]せ、少[すこ]しも減[へ]らしてはならない。彼[かれ]らは手[て]が空[す]いているからだ。だから、『行[い]って、わたしたちの神[かみ]に犠牲[ぎせい]を献[ささ]げよう』と叫[さけ]んでいるのである。"
  9: "この者[もの]たちの仕事[しごと]を重[おも]くし、彼[かれ]らがそれに専念[せんねん]して、むだな言葉[ことば]にかかわらないようにせよ。」"
  10: "民[たみ]の仕事[しごと]の督促[とくそく]役[やく]たちと書記[しょき]たちは彼[かれ]らをせき立[た]てて言[い]った。「ファラオはこう言[い]われる。『わたしはもう、あなたがたにわらを与[あた]えない。"
  11: "あなたがたは自分[じぶん]で行[い]って、見[み]つけた所[ところ]からわらを集[あつ]めよ。しかし、あなたがたの割[わ]り当[あ]ては少[すこ]しも減[へ]らされない。』」"
  12: "民[たみ]はエジプト全土[ぜんど]に散[ち]って、わらの代[か]わりに刈[か]り株[かぶ]を集[あつ]めた。"
  13: "督促[とくそく]役[やく]たちは彼[かれ]らをせき立[た]てて言[い]った。「わらが与[あた]えられていたときと同[おな]じように、毎日[まいにち]の決[き]まった仕事[しごと]を仕上[しあ]げよ。」"
  14: "ファラオの役人[やくにん]たちは、イスラエルの子[こ]らの中[なか]から立[た]てた書記[しょき]たちを打[う]って言[い]った。「なぜ、昨日[きのう]も今日[きょう]も、れんがの割[わ]り当[あ]てをこれまでどおりに仕上[しあ]げないのか。」"
  15: "イスラエルの子[こ]らの書記[しょき]たちは、ファラオのところへ行[い]って叫[さけ]んだ。「なぜ、あなたはしもべたちにこのようなことをなさるのですか。"
  16: "わらはしもべたちに与[あた]えられていないのに、『れんがを作[つく]れ』と言[い]われます。しかも、しもべたちは打[う]たれています。あなたはご自分[じぶん]の民[たみ]に不正[ふせい]をしています。」"
  17: "ファラオは言[い]った。「あなたがたは手[て]が空[す]いている。手[て]が空[す]いているから、『行[い]って、わたしたちの神[かみ]に犠牲[ぎせい]を献[ささ]げよう』と言[い]うのだ。"
  18: "さあ、行[い]って働[はたら]け。わらは与[あた]えられないが、れんがの割[わ]り当[あ]ては納[おさ]めよ。」"
  19: "イスラエルの子[こ]らの書記[しょき]たちは、自分[じぶん]たちが悪[わる]い状[じょう]態[たい]に置[お]かれているのを見[み]た。「その日[ひ]のれんがの割[わ]り当[あ]てを欠[か]かしてはならない」と言[い]われたからである。"
  20: "彼[かれ]らがファラオのところから出[で]て来[き]たとき、モーセとアロンが彼[かれ]らを迎[むか]えようとして来[き]ていたので、彼[かれ]らは二人[ふたり]に会[あ]った。"
  21: "そして言[い]った。「神[かみ]があなたがたをご覧[らん]になり、裁[さば]いてくださいますように。あなたがたは、わたしたちの臭[にお]いをファラオの前[まえ]でも、その廷臣[ていしん]たちの前[まえ]でも忌[い]み嫌[きら]うべきものとし、わたしたちを殺[ころ]すための剣[つるぎ]を彼[かれ]の手[て]に渡[わた]したのです。」"
  22: "モーセは主[しゅ]のもとへ戻[もど]って言[い]った。「主[しゅ]よ、なぜあなたはこの民[たみ]に災[わざわ]いを下[くだ]されたのですか。なぜわたしを遣[つか]わされたのですか。"
  23: "わたしがあなたの名[な]によって語[かた]るためにファラオのところへ行[い]ってから、彼[かれ]はこの民[たみ]をますます苦[くる]しめています。あなたは、ご自分[じぶん]の民[たみ]を救[すく]い出[だ]してはいません。」"

notes:
  1: "Τάδε λέγει κύριος ὁ θεὸς Ισραηλ — イスラエルの神、主はこう言われる. ἑορτάσωσιν — 祭りを行わせる (ἑορτάζω — «праздновать»). Слав. «да праздник сотворят» — то же."
  2: "Τίς ἐστιν οὗ εἰσακούσομαι τῆς φωνῆς αὐτοῦ — 主とは何者か、わたしがその声に聞き従うとは (οὗ — род. при εἰσακούομαι). οὐκ οἶδα τὸν κύριον — わたしは主を知らない."
  3: "Ὁ θεὸς τῶν Εβραίων — ヘブライ人の神 (без κύριος; слав. добавляет «Господь», Синодальный — «Господь, Бог Евреев»). μήποτε συναντήσῃ ἡμῖν θάνατος ἢ φόνος — 死か殺されることが…降りかかるかもしれない (букв. «смерть или убийство»; масоретский текст и Синодальный: «язвою или мечом»)."
  4: "διαστρέφετε τὸν λαόν μου ἀπὸ τῶν ἔργων — 民を仕事から引き離す (διαστρέφω — «развращать, отвлекать»). ἀπέλθατε ἕκαστος… πρὸς τὰ ἔργα αὐτοῦ — それぞれ自分の仕事に戻れ."
  5: "Ἰδοὺ νῦν πολυπληθεῖ ὁ λαός — 見よ、今やこの民は多い (πολυπληθέω). μὴ οὖν καταπαύσωμεν αὐτοὺς ἀπὸ τῶν ἔργων — 仕事から休ませようとしている (καταπαύω — «давать покой»). Слав. добавляет «на земли» — у LXX этого нет."
  6: "τοῖς ἐργοδιώκταις τοῦ λαοῦ — 民の仕事の督促役たち (ἐργοδιώκτης). τοῖς γραμματεῦσιν — その書記たち (γραμματεύς; это надзиратели из самих израильтян, ср. 5:14). λέγων — «говоря»: речь начинается со следующего стиха."
  7: "Οὐκέτι προστεθήσεται διδόναι ἄχυρον — これからは…わらを与えてはならない (ἄχυρον — «солома»). εἰς τὴν πλινθουργίαν — れんがを作るために (πλινθουργία). καθάπερ ἐχθὲς καὶ τρίτην ἡμέραν — これまでどおり (букв. «как вчера и третьего дня»). συναγαγέτωσαν ἑαυτοῖς ἄχυρα — 自分たちで集めさせよ."
  8: "τὴν σύνταξιν τῆς πλινθείας — れんがの割り当て (σύνταξις — «урочное число»). ἐπιβαλεῖς αὐτοῖς — 彼らに課せ (ἐπιβάλλω). σχολάζουσιν γάρ — 彼らは手が空いているからだ (σχολάζω — «быть праздным»). κεκράγασιν — 叫んでいる (κραυγάζω)."
  9: "βαρυνέσθω τὰ ἔργα — 仕事を重くせよ (βαρύνω). μεριμνάτωσαν ταῦτα — それに専念して (μεριμνάω — «заботиться»). μὴ μεριμνάτωσαν ἐν λόγοις κενοῖς — むだな言葉にかかわらない (κενός — «пустой»)."
  10: "κατέσπευδον αὐτούς — 彼らをせき立てた (κατασπεύδω). Τάδε λέγει Φαραω — ファラオはこう言われる."
  11: "ὅθεν ἐὰν εὕρητε — 見つけた所から. οὐ γὰρ ἀφαιρεῖται ἀπὸ τῆς συντάξεως ὑμῶν οὐθέν — 割り当ては少しも減らされない (ἀφαιρέω — «отнимать»)."
  12: "διεσπάρη ὁ λαὸς ἐν ὅλῃ Αἰγύπτῳ — 民はエジプト全土に散って (διασπείρω). καλάμην εἰς ἄχυρα — わらの代わりに刈り株 (καλάμη — «стерня, солома»; слав. «тростие»)."
  13: "τὰ καθήκοντα καθ᾿ ἡμέραν — 毎日の決まった仕事 (καθήκω — «подобать»)."
  14: "ἐμαστιγώθησαν — 打たれた (μαστιγόω — «бичевать»). οἱ γραμματεῖς τοῦ γένους τῶν υἱῶν Ισραηλ — イスラエルの子らの書記たち. ἐπ᾿ αὐτοὺς ὑπὸ τῶν ἐπιστατῶν τοῦ Φαραω — ファラオの役人たちが彼らの上に立てた (ἐπιστάτης — «надзиратель»). καὶ τὸ τῆς σήμερον — 今日も (букв. «и сегодняшнее»)."
  15: "κατεβόησαν πρὸς Φαραω — ファラオのところへ叫んだ (καταβοάω — «вопиять»). τοῖς σοῖς οἰκέταις — しもべたちに (οἰκέτης — «домочадец, раб»)."
  16: "ἄχυρον οὐ δίδοται — わらは与えられていない. οἱ παῖδές σου μεμαστίγωνται — しもべたちは打たれている (perfect). ἀδικήσεις οὖν τὸν λαόν σου — あなたの民が悪いのです (ἀδικέω — «обижать, поступать неправо»; Синодальный: «грех народу твоему»)."
  17: "Σχολάζετε, σχολασταί ἐστε — 手が空いている、手が空いているのだ (удвоение; σχολαστής — «праздный»)."
  18: "τὴν σύνταξιν τῆς πλινθείας ἀποδώσετε — れんがの割り当ては納めよ (ἀποδίδωμι — «отдавать»)."
  19: "ἑώρων… ἑαυτοὺς ἐν κακοῖς — 自分たちが悪い状態に置かれているのを見た (букв. «видели себя во зле»). Οὐκ ἀπολείψετε τῆς πλινθείας τὸ καθῆκον τῇ ἡμέρᾳ — その日のれんがの割り当てを欠かしてはならない (ἀπολείπω — «оставлять»)."
  20: "συνήντησαν δὲ Μωυσῇ καὶ Ααρων — モーセとアロンに会った. ἐρχομένοις εἰς συνάντησιν αὐτοῖς — 彼らを迎えようとして来ていた (εἰς συνάντησιν — «навстречу»)."
  21: "Ἴδοι ὁ θεὸς ὑμᾶς καὶ κρίναι — 神があなたがたをご覧になり、裁いてくださいますように (в LXX — ὁ θεός, не κύριος). ἐβδελύξατε τὴν ὀσμὴν ἡμῶν — わたしたちの臭いを…忌み嫌うべきものとし (букв. «сделали запах наш мерзким»; ὀσμή — «запах»; образ сохранён). δοῦναι ῥομφαίαν εἰς τὰς χεῖρας αὐτοῦ — 剣を彼の手に渡した (ῥομφαία — «меч»)."
  22: "ἐπέστρεψεν… πρὸς κύριον — 主のもとへ戻って. διὰ τί ἐκάκωσας τὸν λαὸν τοῦτον; — なぜこの民に災いを下されたのか (κακόω — «озлоблять»). ἵνα τί ἀπέσταλκάς με; — なぜわたしを遣わされたのか."
  23: "ἀφ᾿ οὗ πεπόρευμαι — 行ってから (ἀφ᾿ οὗ — «с тех пор как»). ἐπὶ τῷ σῷ ὀνόματι — あなたの名によって. ἐκάκωσεν τὸν λαὸν τοῦτον — この民をますます苦しめている. οὐκ ἐρρύσω τὸν λαόν σου — 救い出してはいない (ῥύομαι — «избавлять»)."
