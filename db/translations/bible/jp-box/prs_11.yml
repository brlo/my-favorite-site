verses:
  1: "知恵[ちえ]は、聖[せい]なる預言者[よげんしゃ]の手[て]によって彼[かれ]らのわざを栄[さか]えさせた。"
  2: "彼[かれ]らは人[ひと]の住[す]まない荒野[こうや]を旅[たび]し、踏[ふ]み入[い]ることのできない所[ところ]に天幕[てんまく]を張[は]った。"
  3: "彼[かれ]らは敵[てき]に立[た]ち向[む]かい、仇[あだ]を撃[う]ち退[しりぞ]けた。"
  4: "彼[かれ]らは渇[かわ]き、あなたを呼[よ]び求[もと]めた。すると、切[き]り出[だ]された岩[いわ]から水[みず]が、硬[かた]い石[いし]から渇[かわ]きの癒[いや]しが与[あた]えられた。"
  5: "敵[てき]たちが罰[ばつ]されたそのことによって、彼[かれ]ら自身[じしん]は乏[とぼ]しい中[なか]にあって恵[めぐ]みを受[う]けたのである。"
  6: "絶[た]えず流[なが]れる川[かわ]の泉[いずみ]が汚[けが]れた血[ち]で濁[にご]らされた、その代[か]わりに、"
  7: "あなたは、幼[おさな]い子[こ]を殺[ころ]す掟[おきて]への非難[ひなん]として、彼[かれ]らに思[おも]いがけないほど豊[ゆた]かな水[みず]を与[あた]えた。"
  8: "そのときの渇[かわ]きによって、あなたが敵対[てきたい]する者[もの]たちをいかに罰[ばつ]したかを示[しめ]したのである。"
  9: "彼[かれ]らは試[ため]されたとき、あわれみのうちに戒[いまし]められながらも、不敬虔[ふけいけん]な者[もの]たちが怒[いか]りのうちに裁[さば]かれて、いかに苦[くる]しめられたかを知[し]った。"
  10: "あなたは、こちらを父[ちち]のように戒[いまし]めて試[ため]し、あちらを厳[きび]しい王[おう]のように罪[つみ]を定[さだ]めて調[しら]べた。"
  11: "また、遠[とお]くにいる者[もの]もそばにいる者も、同[おな]じように苦[くる]しんだ。"
  12: "彼[かれ]らを、二重[にじゅう]の悲[かな]しみと、過[す]ぎ去[さ]ったことの思[おも]い出[で]によるうめきが捕[と]らえた。"
  13: "彼[かれ]らは、自分[じぶん]たちの罰[ばつ]によってあの人[ひと]々が恵[めぐ]みを受[う]けたと聞[き]いて、主[しゅ]を感[かん]じ取[と]った。"
  14: "彼[かれ]らは、昔[むかし]、外[そと]に捨[す]てられたその者[もの]を嘲[あざけ]って拒[こば]んだが、事[こと]の終[お]わりにその成[な]り行[ゆ]きを見[み]て驚[おどろ]いた。正[ただ]しい者[もの]たちとは異[こと]なる渇[かわ]きを味[あじ]わっていたからである。"
  15: "しかし、彼[かれ]らの不義[ふぎ]の思[おも]いが愚[おろ]かであったため、あなたは彼らに、理[ことわり]のない獣[けもの]の群[む]れを報復[ほうふく]のために送[おく]り込[こ]んだ。彼らは惑[まど]わされて、理のない這[は]うものや、卑[いや]しい小[ちい]さな生き物[もの]を拝[おが]んでいたのである。"
  16: "それは、人[ひと]が罪[つみ]を犯[おか]すそのことによって罰[ばつ]されることを、彼[かれ]らが知[し]るためである。"
  17: "あなたの全能[ぜんのう]の手[て]は、形[かたち]のない材料[ざいりょう]から世界[せかい]を造[つく]ったその手である。その手が、彼[かれ]らに多[おお]くの熊[くま]や、獰猛[どうもう]な獅子[しし]を送[おく]ることに欠[か]けるところはなかった。"
  18: "あるいは、怒[いか]りに満[み]ちた新[あら]たに造[つく]られた未知[みち]の獣[けもの]たち、すなわち火[ひ]を吐[は]く息[いき]を吹[ふ]きかけ、または煙[けむり]のとどろきを撒[ま]き散[ち]らし、または目[め]から恐[おそ]ろしい火花[ひばな]を閃[ひらめ]かせる獣たちを。"
  19: "それらの獣[けもの]は、その害[がい]だけでも彼[かれ]らを砕[くだ]くことができたが、その姿[すがた]もまた、彼らを恐[おそ]れさせて滅[ほろ]ぼすことができた。"
  20: "また、これらの獣[けもの]がなくても、彼[かれ]らは一[ひと]つの息[いき]によって倒[たお]れることができた。裁[さば]きに追[お]われ、あなたの力[ちから]の霊[れい]によって吹[ふ]き散[ち]らされたからである。しかし、あなたはすべてのものを、量[りょう]と数[かず]と重[おも]さによって整[ととの]えた。"
  21: "あなたには、常[つね]に大[おお]いに強[つよ]くあることが備[そな]わっている。あなたの腕[うで]の力[ちから]に、だれが立[た]ち向[む]かえるだろうか。"
  22: "世界[せかい]の全[すべ]ては、あなたの前[まえ]では、天秤[てんびん]の皿[さら]の傾[かたむ]きのようであり、朝[あさ]に地[ち]に降[お]りる露[つゆ]の一滴[いってき]のようである。"
  23: "しかし、あなたはすべてのものをあわれまれる。すべてをなしうるからである。そして、人[ひと]の罪[つみ]を、悔[く]い改[あらた]めのために見逃[みのが]される。"
  24: "あなたは存在[そんざい]するすべてのものを愛[あい]し、造[つく]ったものを何[なに]ひとか嫌[きら]わない。憎[にく]みながら何かを造るようなことは、ないからである。"
  25: "もしあなたが望[のぞ]まれなかったら、何[なに]が存続[そんぞく]しえたであろうか。あなたに呼[よ]ばれなかったものが、保[たも]たれたであろうか。"
  26: "しかし、あなたはすべてのものを惜[お]しむ。すべてはあなたのものだからである。魂[たましい]を愛[あい]する主[しゅ]よ。"

notes:
  1: "Εὐόδωσεν — «дала успех, благоустроила» (εὐοδόω); τὰ ἔργα αὐτῶν — дела народа в исходе. ἐν χειρὶ προφήτου ἁγίου — «рукою святого пророка» (Моисей)."
  2: "διώδευσαν — «прошли» (διοδεύω); ἔρημον ἀοίκητον — «пустыню необитаемую»; ἐν ἀβάτοις — «в непроходимых местах» (ἄβατος); ἔπηξαν σκηνάς — «водрузили кущи» (πήγνυμι — вбивать, ставить)."
  3: "ἀντέστησαν — «противостали»; ἠμύναντο — «отразили, отомстили» (ἀμύνω — защищать, отражать); слав. «отмстиша врагом»."
  4: "ἐδίψησαν — «возжаждали»; ἐπεκαλέσαντό σε — «призвали Тебя». πέτρα ἀκρότομος — «скала, отсечённая [целиком]» (ἀκρότομος); ἴαμα δίψης — «исцеление жажды» (ἴαμα); λίθος σκληρός — «камень твёрдый» (Исх 17:6; Чис 20:11)."
  5: "δι᾽ ὧν … διὰ τούτων — «чем… тем»: соответствие наказания и благодеяния. ἀποροῦντες — «будучи в нужде, в затруднении» (ἀπορέω); слав. 11:5–6 делит этот стих на два: «Имиже бо наказани быша врази их» + «сими сии во оскудении суще благодетелствовани быша». Оба полустишия сведены в наш 11:5; это и есть лишний слав. стих (csl 11:6)."
  6: "ἀντὶ μὲν πηγῆς ἀενάου ποταμοῦ — «вместо источника вечно текущей реки» (ἀέναος); αἵματι λυθρώδει — «кровью, подобной сукровице» (λυθρώδης), слав. «кровию излиянною» — иное слово. ταραχθέντος — «возмущённого» (ταράσσω). Стих — начало фразы, продолжающейся в 11:7."
  7: "εἰς ἔλεγχον νηπιοκτόνου διατάγματος — «в обличение повеления, убивающего младенцев» (ἔλεγχος — обличение; διάταγμα — повеление). δαψιλὲς ὕδωρ — «обильная вода»; ἀνελπίστως — «нечаянно, сверх надежды»."
  8: "δείξας — «показав» (δεικνύω); διὰ τοῦ τότε δίψους — «через тогдашнюю жажду»; ὑπεναντίους — «противников» (ὑπεναντίος). Это стих csl 11:9: от csl 11:7 слав. нумерация идёт на один вперёд (см. 11:5), но содержание то же, добавки нет."
  9: "ἐν ἐλέει παιδευόμενοι — «в милости наставляемые» (παιδεύω — воспитывать, наказывать); μετ᾽ ὀργῆς κρινόμενοι — «в гневе судимые»; ἐβασανίζοντο — «мучимы были» (βασανίζω). Наш 11:9 = csl 11:10 (сдвиг +1)."
  10: "νουθετῶν — «вразумляя» (νουθετέω); ἀπότομος — «отсекающий, строгий» (ἀπότομος); καταδικάζων ἐξήτασας — «осуждая, испытывал» (ἐξετάζω — исследовать, допрашивать)."
  11: "ἀπόντες … παρόντες — «отсутствующие и присутствующие»; ἐτρύχοντο — «изнурялись, мучились» (τρύχω)."
  12: "διπλῆ λύπη — «двойная скорбь»; στεναγμὸς μνημῶν τῶν παρελθόντων — «стенание воспоминаний о прошедшем» (μνήμη, παρέρχομαι); ἔλαβεν — «охватила»."
  13: "ᾔσθοντο τοῦ κυρίου — «ощутили Господа» (αἰσθάνομαι — воспринимать); διὰ τῶν ἰδίων κολάσεων — «через собственные наказания»."
  14: "ἐν ἐκθέσει ῥιφέντα — «выброшенного на погибель» (ἔκθεσις — выставление, подкидывание; о Моисее в корзине); ἀπεῖπον χλευάζοντες — «отвергли с насмешкой» (ἀπεῖπον — отреклись); ἐπὶ τέλει τῶν ἐκβάσεων — «при конце исходов» (ἔκβασις — исход); οὐχ ὅμοια δικαίοις διψήσαντες — «возжаждав не так, как праведные»."
  15: "ἀντὶ λογισμῶν ἀσυνέτων — «вместо неразумных помыслов» (ἀσύνετος); ἐθρήσκευον — «служили, чтили» (θρησκεύω); ἄλογα ἑρπετά — «бессловесные пресмыкающиеся»; κνώδαλα εὐτελῆ — «презренные гады, твари»; ἐπαπέστειλας — «наслал» (ἐπαποστέλλω)."
  16: "ἵνα γνῶσιν — «чтобы познали»; δι᾽ ὧν τις ἁμαρτάνει, διὰ τούτων κολάζεται — «чем кто согрешает, тем и наказывается»."
  17: "ἠπόρει — «недоставало, была в затруднении» (ἀπορέω); παντοδύναμος χείρ — «всесильная рука»; ἐξ ἀμόρφου ὕλης — «из необразного вещества» (ἄμορφος ὕλη); ἐπιπέμψαι — «наслать»; ἄρκων — «медведей» (ἄρκος); θρασεῖς λέοντας — «дерзких львов»."
  18: "νεοκτίστους θῆρας — «новосозданных зверей»; θυμοῦ πλήρεις — «исполненных ярости»; ἀγνώστους — «неведомых»; πυρπνόον ἄσθμα — «огнедышащее дыхание»; βρόμον λικμωμένους καπνοῦ — «развевающих рёв дыма» (λικμάω — веять); σπινθῆρας — «искры» (σπινθήρ)."
  19: "βλάβη — «вред»; συνεκτρῖψαι — «сокрушить» (συντρίβω); ὄψις ἐκφοβήσασα — «вид, устрашивший» (ἐκφοβέω); διολέσαι — «погубить»."
  20: "χωρὶς τούτων — «без этого»; ἑνὶ πνεύματι — «одним духом, дыханием»; ὑπὸ τῆς δίκης διωχθέντες — «гонимые правосудием» (δίκη); λικμηθέντες — «развеянные»; μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ — «мерою, числом и весом»; διέταξας — «устроил»."
  21: "τὸ μεγάλως ἰσχύειν — «великая сила»; πάρεστιν — «присуща»; κράτει βραχίονός σου — «силе мышцы Твоей» (κράτος, βραχίων); ἀντιστήσεται — «противостанет»."
  22: "ῥοπὴ ἐκ πλαστίγγων — «наклон чаши весов» (ῥοπή — склонение; πλάστιγξ — чаша весов); ῥανὶς δρόσου ὀρθρινῆς — «капля утренней росы» (ῥανίς, δρόσος); κατελθοῦσα ἐπὶ γῆν — «сошедшая на землю»."
  23: "ἐλεεῖς — «милуешь» (ἐλεάω); παρορᾷς ἁμαρτήματα — «смотришь мимо грехов, оставляешь без внимания» (παροράω); εἰς μετάνοιαν — «ради покаяния»."
  24: "ἀγαπᾷς τὰ ὄντα πάντα — «любишь всё существующее»; βδελύσσῃ — «гнушаешься» (βδελύσσομαι); οὐδὲ γὰρ ἂν μισῶν τι κατεσκεύασας — «ибо если бы что ненавидел, не создал бы» (κατασκευάζω)."
  25: "διέμεινεν — «пребыло бы» (διαμένω); τὸ μὴ κληθὲν ὑπὸ σοῦ — «то, что не было призвано Тобою»; διετηρήθη — «сохранилось бы» (διατηρέω)."
  26: "φείδῃ — «щадишь» (φείδομαι); δέσποτα φιλόψυχε — «Владыко, любящий души» (φιλόψυχος, редкое слово); слав. «Владыко душелюбче». Обращение внутри стиха — без кавычек."
