# jp-box, Премудрость Соломона, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: промысел в пустыне и в Египте (1–14), наказание египтян и милость
# к Израилю (15–26). Прямой речи нет, кавычек нет.
# Нумерация по gr: 26 стихов. У csl 27: csl делит гр. 11:5 на csl 11:5
# («Имиже бо наказани быша врази их») + csl 11:6 («сими сии во оскудении суще
# благодетелствовани быша»); оба полустишия сведены в наш 11:5. Поэтому от csl 11:7
# идёт сдвиг +1: csl 11:9 = гр. 11:8, csl 11:10 = гр. 11:9, …, csl 11:27 = гр. 11:26.
# Отдельных стихов не добавлено.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

