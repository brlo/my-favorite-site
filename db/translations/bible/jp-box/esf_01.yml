verses:
  1: "大[おお]いなるアルタシャスタの治世[ちせい]の第二年[だいにねん]、ニサの月[つき]の一日[ついたち]に、夢[ゆめ]を見[み]たのはモルデカイであった。彼はヤイロの子[こ]、セメイの子、キサイの子で、ベニヤミン族[ぞく]の者[もの]、ユダヤ人[じん]であり、スサの都[みやこ]に住[す]み、王[おう]の宮廷[きゅうてい]に仕[つか]える大いなる者であった。彼は、バビロンの王ネブカドネツァルがエルサレムからユダヤの王エホヤキンとともに捕[と]らえて行[い]った捕囚[ほしゅう]の者の一人[ひとり]であった。彼の夢はこうであった。見よ、声[こえ]と騒[さわ]ぎ、雷[かみなり]と地震[じしん]、地[ち]の上[うえ]の混乱[こんらん]。見よ、二匹[にひき]の大きな竜[りゅう]が、互[たが]いに組[く]み打[う]つために進[すす]み出[で]て、その声は大きかった。その声によって、すべての国民[こくみん]は、正[ただ]しい者たちの国民と戦[たたか]うために、戦[いくさ]の備[そな]えをした。見よ、闇[やみ]と暗黒[あんこく]の日[ひ]、苦難[くなん]と狭[せま]さ、災[わざわ]いと地の上の大いなる混乱。正しい者たちの国民は皆、自分[じぶん]たちの災いを恐[おそ]れて乱[みだ]れ、滅[ほろ]びる覚悟[かくご]をして、神[かみ]に向[む]かって叫[さけ]んだ。しかし、彼らの叫びから、小[ちい]さな泉[いずみ]から大きな川[かわ]が、多[おお]くの水[みず]が生[しょう]じた。そして、光[ひかり]と太陽[たいよう]が昇[のぼ]り、低[ひく]くされた者たちは高[たか]くされ、栄[さか]えた者たちを食[く]い尽[つ]くした。この夢を見たモルデカイは目[め]を覚[さ]まし、神が何[なに]をなさるつもりかを心[こころ]に納[おさ]め、夜[よる]まで、あらゆる言葉[ことば]によってそれを悟[さと]ろうとした。モルデカイは宮廷で、宮廷を守[まも]る王の二人[ふたり]の宦官[かんがん]、ガバタとタラとともに静[しず]かに過[す]ごしていた。彼は二人の思[おも]いを聞[き]き、彼らの心配[しんぱい]を探[さぐ]り出[だ]した。そして、彼らが王アルタシャスタに手[て]をかけようと備えていることを知[し]った。そこでモルデカイはそのことを王に知らせた。王は二人の宦官を取[と]り調[しら]べ、彼らは自白[じはく]して連[つ]れ去[さ]られた。王はこのことを記念[きねん]のために書[か]き留[とど]め、モルデカイもこのことを書き記[しる]した。王はモルデカイに宮廷で仕えるよう命[めい]じ、このことのゆえに彼に贈[おく]り物[もの]を与[あた]えた。王の前[まえ]では、アマダトの子でブガイ人のアマンが栄えていた。彼は、王の二人の宦官のことで、モルデカイと彼の民[たみ]に災いを加[くわ]えようと狙[ねら]っていた。これらの言葉の後[のち]、アルタシャスタの日[ひ]々[び]に、こういうことがあった。このアルタシャスタは、インドからエチオピアに至[いた]るまで、百二十七[ひゃくにじゅうなな]の地方[ちほう]を支配[しはい]していた。"
  2: "その同[おな]じ日[ひ]々[び]に、王[おう]アルタシャスタがスサの都[みやこ]で王座[おうざ]に着[つ]いたとき、"
  3: "彼の治世[ちせい]の三年[さんねん]目[め]に、王[おう]は友[とも]たちと、ほかのすべての国民[こくみん]、すなわちペルシア人[じん]とメディア人の高[たか]い身分[みぶん]の者[もの]たち、また太守領[たいしゅりょう]の長[かしら]たちのために宴会[えんかい]を開[ひら]いた。"
  4: "そしてその後[のち]、自分[じぶん]の王国[おうこく]の富[とみ]と、自分の喜[よろこ]びの栄光[えいこう]を彼[かれ]らに示[しめ]してから、百八十日[ひゃくはちじゅうにち]の間[あいだ]、"
  5: "宴会[えんかい]の日[ひ]々[び]が満[み]ちると、王[おう]は都[みやこ]にいるすべての国民[こくみん]のために、王の家[いえ]の庭[にわ]で六日間[むいかかん]、酒宴[しゅえん]を開[ひら]いた。"
  6: "その庭[にわ]は、亜麻布[あまぬの]と緑[みどり]の幕[まく]で飾[かざ]られ、その幕は、亜麻布と紫[むらさき]の綱[つな]で、金[きん]と銀[ぎん]の環[わ]と、パロス石[いし]や石の柱[はしら]にかけられ、金と銀の寝台[しんだい]が、エメラルドの石と、ピンナ石と、パロス石の敷石[しきいし]の上[うえ]に置[お]かれ、透[す]き通[とお]る敷物[しきもの]がさまざまに花[はな]模様[もよう]に彩[いろど]られ、周[まわ]りには薔薇[ばら]が散[ち]らされていた。"
  7: "金[きん]と銀[ぎん]の杯[さかずき]、またカーバンクルの石[いし]の杯が並[なら]べられ、その価[あたい]は三万[さんまん]タラントに及[およ]んだ。ぶどう酒[しゅ]も豊[ゆた]かで甘[あま]く、王[おう]自身[じしん]が飲[の]むものであった。"
  8: "この酒宴[しゅえん]は、定[さだ]められた法[のり]に従[したが]って行[おこな]われたのではなく、王[おう]がそう望[のぞ]んで、家[いえ]を管理[かんり]する者[もの]たちに、自分[じぶん]と人[ひと]々[びと]の望みどおりに行わせるよう命[めい]じたのである。"
  9: "また、王妃[おうひ]アスティンは、王[おう]アルタシャスタのいる王宮[おうきゅう]で、女[おんな]たちのために宴会[えんかい]を開[ひら]いた。"
  10: "七日目[なのかめ]に、王[おう]は上機嫌[じょうきげん]になり、アマン、バザン、タラ、ボラゼ、ザトルタ、アバタザ、タラバ、すなわち王アルタシャスタに仕[つか]える七人[しちにん]の宦官[かんがん]に言[い]った。"
  11: "「王妃[おうひ]アスティンをわたしのもとへ連[つ]れて来[こ]させ、彼女[かのじょ]を王妃[おうひ]として立[た]たせ、王冠[おうかん]を彼女に戴[いただ]かせ、その美[うつく]しさをすべての長[かしら]たちと国民[こくみん]に見[み]せよ」と命[めい]じた。彼女は美しかったからである。"
  12: "しかし、王妃[おうひ]アスティンは、宦官[かんがん]たちとともに来[く]るようにという王[おう]の言葉[ことば]を聞[き]き入[い]れなかった。王は悲[かな]しみ、怒[いか]った。"
  13: "王[おう]は自分[じぶん]の友[とも]たちに言[い]った。「アスティンはこのように語[かた]った。それゆえ、このことについて法[のり]と裁[さば]きを定[さだ]めよ。」"
  14: "ペルシア人[じん]とメディア人の長[かしら]で、王[おう]に近[ちか]く、王のそばに座[すわ]る最上位[さいじょうい]の者[もの]たちであるアルケサイオス、サルサタイオス、マレセアルが、彼[かれ]のもとに進[すす]み出[で]て、"
  15: "法[のり]に従[したが]って王妃[おうひ]アスティンにどう対処[たいしょ]すべきかを王[おう]に告[つ]げた。王が宦官[かんがん]たちを通[とお]して命[めい]じたことを、彼女[かのじょ]が行[おこな]わなかったからである。"
  16: "ムカイオスは王[おう]と長[かしら]たちに言[い]った。「アスティン王妃[おうひ]が傷[きず]つけたのは、王一人[ひとり]だけではない。王のすべての長たち、すべての指導者[しどうしゃ]たちも傷つけたのだ。"
  17: "というのは、王妃[おうひ]の言葉[ことば]と、彼女[かのじょ]が王[おう]に逆らった次第[しだい]が彼[かれ]らに語[かた]られたからである。それゆえ、彼女が王アルタシャスタに逆らったのと同じように、"
  18: "今日[こんにち]、ペルシア人[じん]とメディア人の長[かしら]たちのほかの長[かしら]たちの妻[つま]たちも、王妃[おうひ]が王[おう]に語[かた]ったことを聞[き]いて、同じように夫[おっと]たちを辱[はずかし]めることをためらわないであろう。"
  19: "それゆえ、もし王[おう]がよしとされるなら、王の勅令[ちょくれい]を出[だ]させ、メディア人[じん]とペルシア人の法[のり]に従[したが]って書[か]き記[しる]させよ。ほかのように取[と]り扱[あつか]ってはならない。王妃[おうひ]はもはや王のもとへ入[はい]ってはならない。王は彼女[かのじょ]の王国[おうこく]を、彼女より良[よ]い女[おんな]に与[あた]えよ。"
  20: "また、王[おう]が定[さだ]める法[のり]が、その王国[おうこく]のうちで聞[き]かれるように。そうすれば、すべての女[おんな]たちは、富[とみ]む者[もの]から貧[まず]しい者に至[いた]るまで、自分[じぶん]の夫[おっと]たちを敬[うやま]うであろう。」"
  21: "この言葉[ことば]は王[おう]と長[かしら]たちの心[こころ]にかなった。王はムカイオスが語[かた]ったとおりに行[おこな]った。"
  22: "王[おう]は書[しょ]を全[ぜん]王国[おうこく]に、地方[ちほう]ごとに、それぞれの言葉[ことば]に従[したが]って送[おく]り、こうして彼らは自分[じぶん]の家[いえ]のうちに恐[おそ]れを抱[いだ]くことになった。"

notes:
  1: "Стих = Добавление A (сон Мардохея) + основной LXX 1:1. Ἔτους δευτέρου βασιλεύοντος Ἀρταξέρξου τοῦ μεγάλου τῇ μιᾷ τοῦ Νισα — «во второй год царствования Артаксеркса великого, в первый [день] Нисана»: Νισα — месяц, μιᾷ — «первого числа». ἐνύπνιον εἶδεν — «сон видел»; δράκοντες — «драконы, змеи» (竜); ἀπὸ μικρᾶς πηγῆς ποταμὸς μέγας — «из малого источника река великая»; οἱ ταπεινοὶ ὑψώθησαν — «смиренные возвысились». Ἀμαν Ἀμαδάθου Βουγαῖος — Аман, сын Амадафа, вугеянин (ブガイ人). В слав. Добавления A нет (csl 1:1 = только основной стих); слав. добавление «даже до ефиопии» в LXX отсутствует и внесено в текст без 〔…〕."
  2: "ἐν αὐταῖς ταῖς ἡμέραις — «в те самые дни» (αὐτός усилительное); ὅτε ἐθρονίσθη — «когда был посажен на престол» (θρονίζω). Придаточное с ὅτε продолжается в ст. 3, где стоит главное сказуемое ἐποίησεν, поэтому стих кончается на 「、». В слав. то же деление."
  3: "δοχή — «угощение, пир» (宴会; не πότος); τοῖς λοιποῖς ἔθνεσιν — «остальным народам»; ἐνδόξοις — «славным, знатным». σατράπης — 太守, σατραπεία — 太守領; τοῖς ἄρχουσιν τῶν σατραπῶν — «начальникам сатрапий» (слав. «началным сатраиом»)."
  4: "μετὰ τὸ δεῖξαι — «после того как показал» (ἀπ. инф. с μετά); εὐφροσύνη — «веселие, радость». Слав. опускает τοῦ πλούτου αὐτοῦ («богатства своего»), поэтому в тексте 自分の喜びの栄光; вариант LXX — «славу веселия богатства своего». ἐπὶ ἡμέρας ἑκατὸν ὀγδοήκοντα — «на сто восемьдесят дней»; стих кончается на 「、», продолжаясь в ст. 5."
  5: "ἀνεπληρώθησαν αἱ ἡμέραι τοῦ γάμου — «исполнились дни брака»: γάμος здесь значит «пиршество»; слав. читает «дние пира» (宴会). ἐπὶ ἡμέρας ἕξ — шесть дней (слав. «на дний шесть»); в Син. семь дней по МТ — не вносим. τοῖς εὑρεθεῖσιν εἰς τὴν πόλιν — «оказавшимся в городе»; Син. добавляет «от большого до малого» (МТ) — не вносим."
  6: "Слав. делит иначе: csl 1:6 = только завесы, csl 1:7 = ложа и покровы; здесь оба куска в ст. 6 по LXX. καρπάσινος — карпасийская (тонкая) ткань; слав. «зелеиыми» поняло как цвет (緑). ἐπὶ κύβοις χρυσοῖς — «на кубах, подножиях»; слав. «на колцах» — кольцах (環). πίννινος λίθος — «пиннийский камень» (перламутр), σμαράγδιτος — エメラルド; στρωμναί — 敷物, ῥόδα — 薔薇."
  7: "Слав. 1:7 (ложа) относится к нашему ст. 6; здесь начинается csl 1:8. ἀνθράκινον κυλίκιον — «кубок из антрацита, карбункула»; слав. «чаша анфракса камене», поэтому カーバンクルの石の杯. ἀπὸ ταλάντων τρισμυρίων — «[ценой] от тридцати тысяч талантов» (τρισμύριοι = 30 000). οἶνος πολὺς καὶ ἡδύς — «вино многое и сладкое»."
  8: "Это вторая половина csl 1:8. πότος — «питие, попойка» (酒宴); οὐ κατὰ προκείμενον νόμον — «не по установленному закону»; οἰκονόμοι — «управители, домоправители». τὸ θέλημα αὐτοῦ καὶ τῶν ἀνθρώπων — «волю его и людей», т. е. каждого (Син. «по воле каждого»)."
  9: "βασίλισσα — 王妃; βασίλεια — «царские покои, дворец» (王宮). ἐποίησε πότον — «сделала питие» (宴会), в отличие от δοχή в ст. 3. ὅπου ὁ βασιλεὺς Ἀρταξέρξης — «где [был] царь Артаксеркс»."
  10: "ἡδέως γενόμενος — «став веселым, в хорошем расположении»; Син. «когда развеселилось сердце от вина» — по МТ, не вносим. Семь евнухов: Αμαν, Βαζαν, Θαρρα, Βωραζη, Ζαθολθα, Αβαταζα, Θαραβα (слав. аман, вазан, фарра, вараз, зафолфан, аватаза, фарав). Аман здесь — евнух, не будущий злодей: это омоним, имя совпадает с Αμαν Αμαδαθου 3:1 и далее."
  11: "βασιλεύειν αὐτήν — «чтобы она была царицей»: передано 「王妃として立たせ」; слав. «еже воцарити ю». διάδημα — 王冠; κάλλος — «красота»; ὅτι καλὴ ἦν — «ибо прекрасна была». В греч. при εἶπεν стоит инфинитив, в тексте передано прямой речью."
  12: "εἰσήκουσεν — «послушала» (εἰσακούω); ἐλθεῖν μετὰ τῶν εὐνούχων — «прийти с евнухами». ἐλυπήθη … ὠργίσθη — «опечалился и разгневался»: у слав. эти слова стоят в начале 1:13, здесь по LXX в конце ст. 12."
  13: "εἶπεν τοῖς φίλοις αὐτοῦ — «сказал друзьям своим»; Син. «мудрецам, знающим прежние времена» — по МТ, не источник. Κατὰ ταῦτα ἐλάλησεν Αστιν — «так сказала Астин»; ποιήσατε … νόμον καὶ κρίσιν — «сделайте закон и суд», т. е. постановление (法と裁き)."
  14: "Три имени по LXX и слав. (Аркесай, Сарсафай, Малисеар); у Син. семь князей по МТ — не вносим. οἱ ἐγγὺς τοῦ βασιλέως — «близкие царя»; οἱ πρῶτοι παρακαθήμενοι τῷ βασιλεῖ — «первые сидящие при царе». Сказуемое — в ст. 15 (ἀπήγγειλαν), поэтому стих кончается на 「、」."
  15: "ἀπήγγειλαν — «возвестили»; κατὰ τοὺς νόμους … ὡς δεῖ ποιῆσαι — «по законам, как должно поступить». τὰ ὑπὸ τοῦ βασιλέως προσταχθέντα διὰ τῶν εὐνούχων — «повеленное царём через евнухов» (προστάσσω)."
  16: "Μουχαιος — Мухай (ムカイオス), слав. «мухей». ἠδίκησεν — «обидела, повредила» (ἀδικέω); οὐ τὸν βασιλέα μόνον — «не одного царя». ἄρχοντες καὶ ἡγούμενοι — 長たち、指導者たち."
  17: "καὶ γὰρ διηγήσατο αὐτοῖς … — «ибо рассказал им слова царицы и как она противоречила царю»: в издании Rahlfs в квадратных скобках, но есть и в слав., поэтому в тексте без 〔…〕. Подлежащее при διηγήσατο не названо — передано страдательным 語られた. ὡς … ἀντεῖπεν — начало сравнения, которое завершается в ст. 18 (οὕτως); слав. 1:17 = только первая половина."
  18: "αἱ τυραννίδες αἱ λοιπαὶ τῶν ἀρχόντων — «остальные жёны начальников» (τυραννίς здесь «владычица, госпожа»); слав. «госпожи жены прочыя князей» — передано 「ほかの長たちの妻たち」. ἀτιμάσαι — «бесчестить» (ἀτιμάζω); ἀκούσασαι τὰ τῷ βασιλεῖ λεχθέντα ὑπ᾽ αὐτῆς — «услышав сказанное царю от неё»."
  19: "προσταξάτω βασιλικόν — «пусть повелит царское [повеление]» (эллипсис); κατὰ τοὺς νόμους Μήδων καὶ Περσῶν — «по законам мидян и персов», т. е. неизменным. μὴ ἄλλως χρησάσθω — «пусть не иначе поступят» (слав. «инако да не будет»); τὴν βασιλείαν αὐτῆς — «царство её», т. е. царское достоинство; γυναικὶ κρείττονι αὐτῆς — «жене лучшей её»."
  20: "περιθήσουσιν τιμὴν — «возложат честь» (περιτίθημι), т. е. будут чтить (слав. «возложат честь»). ἀπὸ πτωχοῦ ἕως πλουσίου — «от бедного до богатого»; слав. меняет порядок: «от богата даже до убога», в тексте по слав."
  21: "ἤρεσεν ὁ λόγος — «угодно было слово»; καθὰ ἐλάλησεν ὁ Μουχαιος — «как сказал Мухай». Слав. «якоже рече ему мухей»."
  22: "Слав. добавляет «книги» (письма) — в LXX этого слова нет, внесено в текст без 〔…〕 (書). κατὰ χώραν κατὰ τὴν λέξιν αὐτῶν — «по стране, по их наречию»; ὥστε εἶναι φόβον αὐτοῖς ἐν ταῖς οἰκίαις αὐτῶν — «чтобы был страх им в домах их». Син. «чтобы всякий муж был господином в доме своем» — по МТ, не вносим."
