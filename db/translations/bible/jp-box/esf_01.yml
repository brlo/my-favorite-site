# jp-box, Есфирь, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: сон Мардохея и заговор евнухов (1 = Добавление A + основной ст. 1),
# воцарение и пир (2–4), семидневный пир и убранство (5–8), пир Астин (9),
# семь евнухов и отказ Астин (10–12), совет приближённых, речь Мухаиоса (13–16),
# указ мидян и персов (17–22). Прямая речь — 「…」 (13; речь Мухаиоса 16–20);
# красного и синего нет.
# Нумерация по gr: 22 стиха. Особенность модуля: в ст. 1 влито Добавление A
# (сон Мардохея; в издании Rahlfs A1–A17); переведено внутри ст. 1, скобок Rahlfs нет.
# В csl Добавления A нет: csl 1:1 = только основной стих («И бысть по словесех сих…»).
# Дальше csl в гл. 1 сдвинут: csl 1:6 = LXX 1:6a, csl 1:7 = LXX 1:6b,
# csl 1:8 = LXX 1:7 + 1:8; держимся деления LXX.
# 〔…〕 нет: все 22 стиха есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 宦官, 王冠, 亜麻布, 紫,
# 寝台, エメラルド, タラント, 太守領, 王宮 уже в корпусе.
# Имена — транслитерация греческого (LXX); слав. формы имён в 1:3, 10, 14 иные.

