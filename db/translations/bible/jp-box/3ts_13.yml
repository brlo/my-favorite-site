verses:
  1: "見[み]よ、ユダから神[かみ]の人[ひと]が、主[しゅ]の言葉[ことば]によってベテルに来[き]た。ヤロブアムは祭壇[さいだん]の上[うえ]で香[こう]をたこうとして立[た]っていた。"
  2: "「祭壇[さいだん]よ、祭壇よ。主[しゅ]はこう言[い]われる。『見[み]よ、ダビデの家[いえ]に子[こ]が生[う]まれる。その名[な]はヨシヤ。彼[かれ]は、あなたの上[うえ]で香[こう]をたかせる高[たか]い所[ところ]の祭司[さいし]たちを、あなたの上で屠[ほふ]り、人[ひと]の骨[ほね]をあなたの上で焼[や]く。』」"
  3: "その日[ひ]、彼[かれ]はしるしを与[あた]えて言[い]った。「これが、主[しゅ]が語[かた]られた言葉[ことば]である。見[み]よ、祭壇[さいだん]は裂[さ]け、その上[うえ]の脂肪[しぼう]は流[なが]れ出[で]る。」"
  4: "ヤロブアム王[おう]が、ベテルの祭壇[さいだん]にむかって叫[さけ]んだ神[かみ]の人[ひと]の言葉[ことば]を聞[き]くと、王は祭壇から手[て]を伸[の]ばして言[い]った。「あの者[もの]を捕[つか]まえよ。」すると、見[み]よ、彼[かれ]にむかって伸ばしたその手は枯[か]れ、自分[じぶん]のところへ引[ひ]き戻[もど]すことができなかった。"
  5: "祭壇[さいだん]は裂[さ]け、脂肪[しぼう]は祭壇から流[なが]れ出[で]た。神[かみ]の人[ひと]が主[しゅ]の言葉[ことば]によって与[あた]えたしるしのとおりであった。"
  6: "王[おう]は神[かみ]の人[ひと]に言[い]った。「どうか、あなたの神であられる主[しゅ]の顔[かお]をなだめて、わたしの手[て]がもとへ戻[もど]るように祈[いの]ってくれ。」神の人が主の顔をなだめると、王の手はもとへ戻り、前[まえ]のとおりになった。"
  7: "王[おう]は神[かみ]の人[ひと]に言[い]った。「わたしとともに家[いえ]へ入[はい]って食事[しょくじ]をしなさい。贈[おく]り物[もの]をしよう。」"
  8: "神[かみ]の人[ひと]は王[おう]に言[い]った。「たとえあなたが家[いえ]の半[なか]分[ぶん]をくださっても、わたしはあなたとともに入[はい]らない。この場所[ばしょ]ではパンを食[た]べず、水[みず]も飲[の]まない。"
  9: "主[しゅ]は言葉[ことば]によってわたしに命[めい]じて、こう言[い]われたからだ。『パンを食[た]べるな。水[みず]を飲[の]むな。来[き]た道[みち]を引[ひ]き返[かえ]すな。』」"
  10: "彼[かれ]は別[べつ]の道[みち]を行[い]き、ベテルへ来[き]た道を引[ひ]き返[かえ]さなかった。"
  11: "ベテルには老[お]いた預言者[よげんしゃ]が一人[ひとり]住[す]んでいた。その息子[むすこ]たちが来[き]て、神[かみ]の人[ひと]がその日[ひ]ベテルで行[おこな]ったすべてのわざと、王[おう]に語[かた]った言葉[ことば]を、父[ちち]に告[つ]げた。"
  12: "父[ちち]は彼[かれ]らに言[い]った。「彼はどの道[みち]を行[い]ったのか。」息子[むすこ]たちは、ユダから来[き]た神[かみ]の人[ひと]が行った道を教[おし]えた。"
  13: "彼[かれ]は息子[むすこ]たちに言[い]った。「わたしのためにろばに鞍[くら]を置[お]け。」彼らがろばに鞍を置くと、彼はそれに乗[の]った。"
  14: "彼[かれ]は神[かみ]の人[ひと]の後[あと]を追[お]い、大[おお]きな木[き]の下[した]に座[すわ]っているのを見[み]つけて言[い]った。「あなたが、ユダから来[き]た神の人か。」彼は言った。「わたしだ。」"
  15: "彼[かれ]は言[い]った。「わたしと一緒[いっしょ]に来[き]て、パンを食[た]べなさい。」"
  16: "彼[かれ]は言[い]った。「わたしはあなたと一緒[いっしょ]に引[ひ]き返[かえ]すことはできない。この場所[ばしょ]でパンを食[た]べることも、水[みず]を飲[の]むこともできない。"
  17: "主[しゅ]は言葉[ことば]によってわたしに命[めい]じて言[い]われたからだ。『そこではパンを食[た]べるな。水[みず]を飲[の]むな。行[い]った道[みち]を引[ひ]き返[かえ]すな。』」"
  18: "彼[かれ]は言[い]った。「わたしもあなたと同じ預言者[よげんしゃ]だ。主[しゅ]の言葉[ことば]によって、天使[てんし]がわたしに語[かた]って言った。『彼をあなたの家[いえ]へ連[つ]れ戻[もど]し、パンを食[た]べさせ、水[みず]を飲[の]ませよ。』」こうして彼は、神[かみ]の人[ひと]に嘘[うそ]をついた。"
  19: "彼[かれ]は神[かみ]の人[ひと]を連[つ]れ戻[もど]した。神の人は彼の家[いえ]でパンを食[た]べ、水[みず]を飲[の]んだ。"
  20: "二人[ふたり]が食卓[しょくたく]に着[つ]いていたとき、主[しゅ]の言葉[ことば]が、神[かみ]の人[ひと]を連[つ]れ戻[もど]したその預言者[よげんしゃ]に臨[のぞ]んだ。"
  21: "彼[かれ]は、ユダから来[き]た神[かみ]の人[ひと]にむかって言[い]った。「主[しゅ]はこう言われる。『あなたは主の言葉[ことば]を軽[かろ]んじ、あなたの神であられる主があなたに命[めい]じた戒[いまし]めを守[まも]らなかった。"
  22: "その場所[ばしょ]に引[ひ]き返[かえ]し、主[しゅ]があなたに『パンを食[た]べるな、水[みず]を飲[の]むな』と言[い]われたその場所で、パンを食べ、水を飲んだ。だから、あなたの体[からだ]は父[ちち]たちの墓[はか]に入[はい]らない。』」"
  23: "彼[かれ]がパンを食[た]べ、水[みず]を飲[の]み終[お]えると、老[お]いた預言者[よげんしゃ]は彼のためにろばに鞍[くら]を置[お]いた。神[かみ]の人[ひと]はそこを去[さ]った。"
  24: "神[かみ]の人[ひと]が行[い]くと、獅子[しし]が道[みち]で彼[かれ]を見[み]つけて殺[ころ]した。彼の体[からだ]は道に投[な]げ捨[す]てられ、ろばはそのそばに立[た]ち、獅子もその体のそばに立っていた。"
  25: "見[み]よ、そこを通[とお]りかかった人[ひと]々[びと]が、道[みち]に投[な]げ捨[す]てられた死体[したい]と、そのそばに立[た]つ獅子[しし]を見た。彼[かれ]らは行[い]って、老[お]いた預言者[よげんしゃ]が住[す]んでいる町[まち]でこれを語[かた]った。"
  26: "神[かみ]の人[ひと]を道[みち]から連[つ]れ戻[もど]した者[もの]はこれを聞[き]いて言[い]った。「これは、主[しゅ]の言葉[ことば]を軽[かろ]んじたあの神の人だ。主は彼[かれ]を獅子[しし]に渡[わた]し、獅子が彼を砕[くだ]き、主が彼に語[かた]られた言葉のとおりに、彼を殺[ころ]したのだ。」"
  27: "彼[かれ]は息子[むすこ]たちに命[めい]じて言[い]った。「わたしのためにろばに鞍[くら]を置[お]け。」彼らは鞍を置いた。"
  28: "彼[かれ]は行[い]って、神[かみ]の人[ひと]の体[からだ]が道[みち]に投[な]げ捨[す]てられ、ろばと獅子[しし]がその体のそばに立[た]っているのを見[み]つけた。獅子は神の人の体を食[た]べず、ろばも砕[くだ]かなかった。"
  29: "預言者[よげんしゃ]は神[かみ]の人[ひと]の体[からだ]を取[と]り上[あ]げてろばに載[の]せ、それを町[まち]へ持[も]ち帰[かえ]って葬[ほうむ]った。"
  30: "彼[かれ]はそれを自分[じぶん]の墓[はか]に納[おさ]めた。人[ひと]々[びと]は彼のために泣[な]いて言[い]った。「ああ、兄[あに]よ。」"
  31: "彼[かれ]を葬[ほうむ]り終[お]えると、預言者[よげんしゃ]は息子[むすこ]たちに言[い]った。「わたしが死[し]んだら、神[かみ]の人[ひと]が葬られているこの墓[はか]に、わたしを葬れ。彼の骨[ほね]のそばにわたしを置[お]け。わたしの骨が彼の骨とともに救[すく]われるために。"
  32: "彼[かれ]が主[しゅ]の言葉[ことば]によって、ベテルの祭壇[さいだん]と、サマリアにある高[たか]い所[ところ]の家[いえ]々[いえ]について語[かた]ったその言葉は、必[かなら]ず成[な]り立[た]つからである。」"
  33: "この言葉[ことば]の後[あと]も、ヤロブアムは自分[じぶん]の悪[わる]い道[みち]から離[はな]れなかった。彼[かれ]はまた、民[たみ]の一部[いちぶ]から高[たか]い所[ところ]の祭司[さいし]たちを立[た]て、望[のぞ]む者[もの]がいれば、その手[て]を満[み]たして高い所の祭司とした。"
  34: "このことは、ヤロブアムの家[いえ]にとって罪[つみ]となり、地[ち]の面[おもて]から滅[ほろ]ぼされ、消[き]え去[さ]るに至[いた]った。"

notes:
  1: "ἰδοὺ ἄνθρωπος τοῦ θεοῦ — 神の人 (человек Божий, обычное именование пророка). παρεγένετο ἐν λόγῳ κυρίου εἰς Βαιθηλ — пришёл по слову Господню в Вефиль. εἱστήκει ἐπὶ τὸ θυσιαστήριον — стоял у жертвенника (плюсквамперфект ἵστημι). τοῦ ἐπιθῦσαι — чтобы воскурить (ἐπιθύω — принести жертву на жертвеннике; отсюда 香をたく)."
  2: "ἐπεκάλεσεν πρὸς τὸ θυσιαστήριον — воззвал к жертвеннику. θυσιαστήριον θυσιαστήριον — двойное обращение. τίκτεται — рождается (наст. в знач. буд.; слав. «раждается»). Ἰωσιας — Иосия; слав. «Иосиа». θύσει — заколет (θύω). τῶν ὑψηλῶν — высот (高[たか]い所)."
  3: "ἔδωκεν ... τέρας — дал знамение (τέρας). τοῦτο τὸ ῥῆμα, ὃ ἐλάλησεν κύριος — «это слово, которое изрёк Господь»: знамение подтверждает слово. ῥήγνυται — расседается (ῥήγνυμι, наст. в знач. буд.). πιότης — тук, жир (слав. «тук»; Синодальный понимает как «пепел»)."
  4: "ἐξέτεινεν τὴν χεῖρα ... ἀπὸ τοῦ θυσιαστηρίου — простёр руку от жертвенника. Συλλάβετε — схватите (συλλαμβάνω). ἐξηράνθη — иссохла, одеревенела (ξηραίνω). ἐπιστρέψαι ... πρὸς ἑαυτόν — возвратить к себе."
  5: "ἐρράγη — расселся (аорист ῥήγνυμι). ἐξεχύθη — излился (ἐκχέω). κατὰ τὸ τέρας — по знамению."
  6: "Δεήθητι τοῦ προσώπου κυρίου — умоли лицо Господа (δέομαι + род.; слав. «помолися пред лицем»). ἐπιστρεψάτω ἡ χείρ μου πρός με — да возвратится рука моя ко мне. ἐγένετο καθὼς τὸ πρότερον — стало как прежде."
  7: "εἴσελθε ... καὶ ἄριστησον — войди и пообедай (ἀριστάω). δῶμα — дар, подарок (слав. «дар»)."
  8: "Ἐάν μοι δῷς τὸ ἥμισυ τοῦ οἴκου σου — если дашь мне половину дома твоего. οὐδὲ μή — усиленное отрицание. ἄρτον — хлеб, т. е. еду."
  9: "ἐνετείλατό μοι ἐν λόγῳ κύριος — заповедал мне Господь словом. ᾗ ἐπορεύθης ἐν αὐτῇ — которою ты шёл."
  10: "ἐν ὁδῷ ἄλλῃ — другой дорогой; οὐκ ἀνέστρεψεν — не возвратился."
  11: "προφήτης εἷς πρεσβύτης — один старый пророк. ἔρχονται — приходят (историческое наст.). διηγήσαντο — рассказали. ἐπέστρεψαν τὸ πρόσωπον τοῦ πατρὸς αὐτῶν — букв. «обратили лицо отца их» (слав. «поведаша отцу своему»); место тёмное."
  12: "Ποίᾳ ὁδῷ πεπόρευται — какою дорогою он пошёл. ἀνῆλθεν — поднялся, пошёл."
  13: "Ἐπισάξατέ μοι τὸν ὄνον — оседлайте мне осла (ἐπισάσσω). ἐπέβη ἐπ᾿ αὐτόν — сел на него."
  14: "κατώπισθεν — вслед. ὑπὸ δρῦν — под дубом (δρῦς; в тексте 大[おお]きな木[き]). Εἰ σὺ εἶ — ты ли. Ἐγώ — «я» (слав. «аз»)."
  15: "Δεῦρο μετ᾿ ἐμοῦ — иди со мною. φάγε ἄρτον — поешь хлеба."
  16: "Οὐ μὴ δύνωμαι — не могу (усиленное отриц.). φάγομαι — буду есть (буд. от ἐσθίω)."
  17: "ἐντέταλταί μοι — заповедано мне (перф. ἐντέλλομαι). ἐκεῖ — там (в ст. 9 этого слова нет: в LXX оно добавлено вторично)."
  18: "Κἀγὼ προφήτης εἰμὶ καθὼς σύ — и я пророк, как ты. ἄγγελος λελάληκεν — ангел говорил (перф.). ἐψεύσατο αὐτῷ — солгал ему (ψεύδομαι)."
  19: "ἐπέστρεψεν αὐτόν — возвратил его; ἔφαγεν ... ἔπιεν — ел, пил."
  20: "αὐτῶν καθημένων — когда они сидели (род. абс.). ἐπὶ τῆς τραπέζης — за столом. τὸν ἐπιστρέψαντα αὐτόν — возвратившего его."
  21: "Ἀνθ᾽ ὧν — за то что (ἀντί + род.). παρεπίκρανας — преогорчил, огорчил (παραπικραίνω). ἐφύλαξας — сохранил, соблюл."
  22: "οὐ μὴ εἰσέλθῃ τὸ σῶμά σου — тело твоё не войдёт (двойное отриц.). τάφος — гроб, могила."
  23: "ἐπέσαξεν αὐτῷ τὸν ὄνον — оседлал ему осла. ἐπέστρεψεν — возвратился, ушёл (слав. «возвратися, и отиде» — два глагола)."
  24: "εὗρεν αὐτὸν λέων — нашёл его лев. ἐθανάτωσεν — умертвил. ἐρριμμένον — брошенное (перф. пассив ῥίπτω). εἱστήκει — стоял."
  25: "θνησιμαῖον — мертвечина, труп. ἐχόμενα τοῦ θνησιμαίου — близ трупа (ἐχόμενος + род.)."
  26: "ὁ ἐπιστρέψας αὐτὸν ἐκ τῆς ὁδοῦ — возвративший его с дороги. παρεπίκρανε — преогорчил. Слав. здесь добавляет «и предаде его Господь льву, и сокруши его, и умертви его по глаголу Господню» — в LXX этого нет; добавление внесено в основной текст (паритет), отмечено здесь."
  27: "В gr-lxx-byz на месте стиха стоит «.» — стих в модуле отсутствует; перевод по csl-ru: «И повеле сыном своим... оседлайте ми осля. И оседлаша». ἐπέσαξαν — оседлали (ср. ст. 13)."
  28: "συνέτριψεν — сокрушил (συντρίβω). οὐκ ἔφαγεν — не съел."
  29: "ἦρεν — поднял (αἴρω). ἐπέθηκεν ... ἐπὶ τὸν ὄνον — положил на осла. τοῦ θάψαι — чтобы похоронить (θάπτω)."
  30: "ἐν τῷ τάφῳ ἑαυτοῦ — в гробе своём (стих продолжает 29). ἐκόψαντο — оплакали (κόπτομαι). Οὐαὶ ἀδελφέ — «увы, брат» (слав. «увы, брате»)."
  31: "ἐγένετο μετὰ τὸ κόψασθαι — было после оплакивания. Ἐὰν ἀποθάνω — если умру. παρὰ τὰ ὀστᾶ — подле костей. ἵνα σωθῶσι — чтобы спаслись (σῴζω): надежда на спасительную близость к пророку."
  32: "γινόμενον ἔσται — непременно сбудется (букв. «становящимся будет»). οἴκους τοὺς ὑψηλούς — «дома высокие» (слав.) = капища на высотах; Синодальный: «капища на высотах, в городах Самарийских». τοῦ ἐν Βαιθηλ — что в Вефиле."
  33: "οὐκ ἐπέστρεψεν ... ἀπὸ τῆς κακίας — не обратился от злобы. ἐκ μέρους τοῦ λαοῦ — из части народа (слав. «от части единыя людий»). ἐπλήρου τὴν χεῖρα αὐτοῦ — «наполнял руку его», т. е. посвящал (обряд поставления, ср. Исх 29:9); в тексте образ сохранён."
  34: "εἰς ἁμαρτίαν — в грех. εἰς ὄλεθρον — на погибель. εἰς ἀφανισμόν — на истребление (ἀφανισμός). ἀπὸ προσώπου τῆς γῆς — с лица земли."
