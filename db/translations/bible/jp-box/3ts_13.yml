# jp-box, 3-я Царств, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 13: человек Божий из Иуды и жертвенник в Вефиле (1–10), старый пророк
# в Вефиле и его обман (11–19), обличение за столом (20–22), лев на дороге (23–25),
# погребение и завещание старого пророка (26–32), нераскаянность Иеровоама (33–34).
# Речь — 「…」: человек Божий (2–3, 8–9, 16–17), царь Иеровоам (4, 6, 7),
# старый пророк (12, 13, 15, 18, 21–22, 27, 31–32). Вложенная речь — 『…』:
# слово Господа в устах человека Божия (2, 9, 17) и старого пророка (21–22);
# слова ангела в лживой речи пророка (18). Красного нет.
# Нумерация по gr: 34 стиха, совпадает с csl-ru и ru.
# Паритет LXX/csl: csl-чтения в основном тексте без 〔…〕; вариант LXX — в notes.
# В 13:26 слав. добавление о льве («предаде его Господь льву...») внесено в текст,
# в LXX его нет — отмечено в notes. 〔…〕 не ставим.
# 13:27 в gr-lxx-byz отсутствует («.») — дефект модуля; стих переведён по csl-ru,
# об этом сказано в notes. Сносок ⟨…⟩ нет: 神の人, 祭壇, 預言者, 高[たか]い所
# уже в корпусе.
# jp-ni не использовался.

