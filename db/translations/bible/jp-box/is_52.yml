# jp-box, Исаия, глава 52. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для гл. 52 есть только стихи 13–15 (начало песни Раба), сверен
# как свидетель церковного чтения, в текст не копировался; jp-ni не использовался.
# Разночтения сверены по gr-lxx-swete (Свит) — в notes.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 52: 1–2 «восстань, восстань, Сион»: сила и слава, прах и узы; 3–6 слово
# Господа: проданы ни за что, Египет и Ассирия, имя Божие в поругании, «Я здесь»;
# 7–10 прекрасные ноги благовестника, стражи, обнажённая мышца, спасение до концов
# земли; 11–12 «выходите из среды её», Господь идёт впереди; 13–15 начало четвёртой
# песни Раба: «вот, Раб Мой уразумеет», обезображенный вид, народы и цари.
# Голоса: 52:1–2 — призыв пророка, без кавычек; 52:3–6 — 「…» (слово Господа;
# формулы «так говорит Господь» в 52:5 — вне кавычек, поэтому цитата закрывается
# и снова открывается); 52:7 — возглас пророка и слова Господа в 「…」, внутри речь
# к Сиону 『…』; 52:8–12 — пророческая речь, без кавычек; 52:13–15 — 「…» (слово
# Господа о Рабе, обращённое к нему; песнь продолжается в гл. 53, где речь уже
# от «мы» — отмечено в notes 15 и в шапке гл. 53).
# Нумерация по gr: 15 стихов, как у csl и ru. Слав. 52:12 «и собираяй вы Господь
# Бог израилев» — причастие при втором подлежащем, как в gr; деление совпадает.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 無割礼, 捕囚, 僕, 栄光 уже в корпусе.
# Имена — транслитерация греческого (LXX).

