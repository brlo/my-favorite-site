verses:
  1: "目[め]を覚[さ]ませ、目を覚ませ、シオンよ。あなたの力[ちから]を身[み]にまとえ、シオンよ。あなたの栄光[えいこう]を身にまとえ、エルサレムよ、聖[せい]なる都[みやこ]よ。無割礼[むかつれい]の者[もの]も汚[けが]れた者[もの]も、もはやあなたを通[とお]り抜[ぬ]けることはない。"
  2: "あなたの身[み]から塵[ちり]を振[ふ]り払[はら]い、立[た]ち上[あ]がって座[すわ]れ、エルサレムよ。あなたの首[くび]の鎖[くさり]を外[はず]せ、捕囚[ほしゅう]の娘[むすめ]シオンよ。"
  3: "主[しゅ]はこう言[い]われる。「あなたがたは代[か]なき値[あたい]で売[う]られ、銀[ぎん]によらずに贖[あがな]われる。」"
  4: "主[しゅ]はこう言[い]われる。「わたしの民[たみ]は初[はじ]め、寄留[きりゅう]するためにエジプトへ下[くだ]った。そしてアッシリア人[じん]のもとへ力[ちから]ずくで引[ひ]き立[た]てられた。"
  5: "それなのに今[いま]、あなたがたはここで何[なに]をしているのか。」主[しゅ]はこう言[い]われる。「わたしの民[たみ]はただ同然[どうぜん]で取[と]り去[さ]られた。だから驚[おどろ]き、泣[な]き叫[さけ]べ。」主[しゅ]はこう言[い]われる。「あなたがたのゆえに、わたしの名[な]はいつも諸国[しょこく]の民[たみ]の間[あいだ]で汚[けが]されている。"
  6: "だから、わたしの民[たみ]はその日[ひ]、わたしの名[な]を知[し]る。語[かた]っているのはこのわたしである、と。わたしはここにいる。」"
  7: "山[やま]の上[うえ]で、平和[へいわ]の知[し]らせを告[つ]げ知[し]らせる者[もの]の足[あし]は、なんと美[うつく]しいことか。良[よ]い知らせを告げ知らせる者の足は。「見[み]よ、わたしはあなたの救[すく]いを聞[き]こえるものとし、シオンに言[い]う。『あなたの神[かみ]は王[おう]として治[おさ]められる。』」"
  8: "あなたを守[まも]る者[もの]たちの声[こえ]は高[たか]く上[あ]がった。彼[かれ]らは声[こえ]を合[あ]わせてともに喜[よろこ]ぶ。主[しゅ]がシオンをあわれまれるとき、彼らは目[め]と目を合[あ]わせて見[み]るからである。"
  9: "エルサレムの荒[あ]れ果[は]てた所[ところ]よ、ともに喜[よろこ]びをほとばしらせよ。主[しゅ]がご自分[じぶん]の民[たみ]をあわれみ、エルサレムを贖[あがな]われたからである。"
  10: "主[しゅ]は諸国[しょこく]の民[たみ]すべての前[まえ]で、その聖[せい]なる腕[うで]を現[あらわ]される。地[ち]のすべての果[は]ては、わたしたちの神[かみ]による救[すく]いを見[み]る。"
  11: "立[た]ち去[さ]れ、立ち去れ。そこから出[で]よ。汚[けが]れたものに触[ふ]れるな。その都[みやこ]の真[ま]ん中[なか]から出[で]て、身[み]を分[わ]けよ。主[しゅ]の器[うつわ]を運[はこ]ぶ者[もの]たちよ。"
  12: "あなたがたは騒[さわ]ぎ立[た]って出[で]ることも、逃[に]げて行[い]くこともない。あなたがたの前[まえ]を進[すす]まれるのは主[しゅ]であり、あなたがたを集[あつ]める方[かた]は、イスラエルの神[かみ]、主である。"
  13: "「見[み]よ、わたしの僕[しもべ]は悟[さと]り、高[たか]く上[あ]げられ、大[おお]いに栄光[えいこう]を受[う]ける。"
  14: "多[おお]くの者[もの]があなたのゆえに驚[おどろ]く。そのように、あなたの姿[すがた]は人[ひと]々[びと]によって辱[はずかし]められ、あなたの栄光[えいこう]も人[ひと]の子[こ]らによって辱められる。"
  15: "そのように、多[おお]くの民[たみ]が彼のゆえに驚[おどろ]き、王[おう]たちは彼[かれ]の前[まえ]で口[くち]を閉[と]ざす。彼[かれ]について告[つ]げられなかったことを彼らは見[み]、聞[き]いたことのないことを悟[さと]るからである。」"

notes:
  1: "Ἐξεγείρου ἐξεγείρου — двойной призыв (слав. «Востани, востани»); ἔνδυσαι повторено дважды (ἰσχύν — «силу», δόξαν — «славу»), повтор сохранён. ἀπερίτμητος καὶ ἀκάθαρτος — «необрезанный и нечистый». οὐκέτι προστεθήσεται διελθεῖν διὰ σοῦ — «уже не приложится пройти через тебя»; безличный оборот передан личной конструкцией, как и в слав. («ктому не приложит проити»)."
  2: "ἐκτίναξαι τὸν χοῦν — «отряси прах» (ἐκτινάσσω, χοῦς). ἀνάστηθι κάθισον — «встань, сядь»: две противоположные позы рядом, как в греч. и слав. («востани, сяди»). ἔκδυσαι τὸν δεσμὸν τοῦ τραχήλου σου — «сними узы с шеи твоей» (δεσμός). ἡ αἰχμάλωτος θυγάτηρ Σιων — «пленная дочь Сиона»."
  3: "τάδε λέγει κύριος — формула вне кавычек. Δωρεὰν ἐπράθητε — «за ничто проданы» (δωρεάν — «даром»; πιπράσκω — «продавать»). οὐ μετὰ ἀργυρίου λυτρωθήσεσθε — «не с серебром выкупитесь» (λυτρόω); слав. «не сребром избавитеся»."
  4: "Εἰς Αἴγυπτον κατέβη ὁ λαός μου τὸ πρότερον παροικῆσαι ἐκεῖ — «в Египет сошёл народ Мой прежде, чтобы пожить там» (παροικέω — «жить пришельцем»). εἰς Ἀσσυρίους βίᾳ ἤχθησαν — «к ассирийцам силою отведены» (βία — «насилие»); в Синодальном «Ассур теснил его ни за что» — иное чтение, не внесено."
  5: "καὶ νῦν τί ὧδέ ἐστε — «и ныне что вы здесь», вопрос без сказуемого. Формула τάδε λέγει κύριος стоит в стихе дважды; по правилу она вне кавычек, поэтому цитата в яп. закрывается и снова открывается. ὅτι ἐλήμφθη ὁ λαός μου δωρεάν — «ибо взят народ Мой даром». θαυμάζετε καὶ ὀλολύζετε — «дивитесь и вопите» (ὀλολύζω — «громко кричать, рыдать»). δι᾿ ὑμᾶς τὸ ὄνομά μου βλασφημεῖται — «из-за вас имя Моё хулится» (βλασφημέω), ср. Рим 2:24. В Синодальном по МТ «властители их неистовствуют» — не внесено."
  6: "γνώσεται ὁ λαός μου τὸ ὄνομά μου — «узнает народ Мой имя Моё». ὅτι ἐγώ εἰμι αὐτὸς ὁ λαλῶν — «что Я есмь Сам говорящий». πάρειμι — «Я здесь, Я присущ» (без связки); слав. «ту есмь», в Синодальном «вот Я». Стих обрывается на этом слове, обрыв сохранён."
  7: "ὡς ὥρα ἐπὶ τῶν ὀρέων — «как пора/красота на горах»: ὥρα здесь, видимо, вместо ὡραῖοι («прекрасны»), слав. «коль красны». εὐαγγελιζομένου ἀκοὴν εἰρήνης — «благовествующего слух мира», т. е. весть о мире (ἀκοή — «слух, весть»), отсюда 平和の知らせ. Цитируется в Рим 10:15. ἀκουστὴν ποιήσω τὴν σωτηρίαν σου — «сделаю слышимым спасение твоё»; подлежащее не выражено (Господь или благовестник), поэтому первое лицо оставлено без уточнения, а слова к Сиону — 『…』; в МТ благовестник говорит «воцарился Бог твой»."
  8: "φωνὴ τῶν φυλασσόντων σε ὑψώθη — «голос хранящих тебя возвысился» (φυλάσσω — «стеречь»). τῇ φωνῇ ἅμα εὐφρανθήσονται — «голосом вместе возрадуются». ὀφθαλμοὶ πρὸς ὀφθαλμοὺς ὄψονται — «очи к очам увидят», т. е. лицом к лицу (слав. «очи ко очесем воззрят»). ἡνίκα ἂν ἐλεήσῃ κύριος τὴν Σιων — «когда помилует Господь Сион»."
  9: "ῥηξάτω εὐφροσύνην — «да извергнут радость» (ῥήγνυμι — «разрывать, изливать»); слав. «да отрыгнут веселие». τὰ ἔρημα Ιερουσαλημ — «пустыни Иерусалима». ἠλέησεν κύριος αὐτὴν καὶ ἐρρύσατο Ιερουσαλημ — «помиловал её Господь и избавил Иерусалим» (ῥύομαι); слав. «помилова Господь людий своих» (по МТ «утешил народ Свой»), в LXX αὐτὴν — «её». Взято слав. чтение, вариант LXX отмечен здесь."
  10: "ἀποκαλύψει κύριος τὸν βραχίονα αὐτοῦ τὸν ἅγιον — «откроет Господь мышцу Свою святую» (будущее; в Синодальном прошедшее). ἐνώπιον πάντων τῶν ἐθνῶν — «пред всеми народами». τὴν σωτηρίαν τὴν παρὰ τοῦ θεοῦ — «спасение, которое от Бога»; слав. добавляет «нашего» («еже от Бога нашего») — внесено по паритету (わたしたちの神による救い), в LXX этого слова нет."
  11: "ἀπόστητε ἀπόστητε ἐξέλθατε — тройной призыв (ἀφίστημι, ἐξέρχομαι), все сохранены. ἀκαθάρτου μὴ ἅπτεσθε — «нечистого не касайтесь». ἐξέλθατε ἐκ μέσου αὐτῆς — «выйдите из среды её»: αὐτῆς женский род (Вавилон), слав. «его» — отмечено. οἱ φέροντες τὰ σκεύη κυρίου — «носящие сосуды Господни»."
  12: "οὐ μετὰ ταραχῆς — «не с мятежом, не в смятении» (ταραχή). οὐδὲ φυγῇ πορεύσεσθε — «и не бегством пойдёте» (φυγή). πορεύσεται πρότερος ὑμῶν κύριος — «пойдёт прежде вас Господь» (πρότερος). ὁ ἐπισυνάγων ὑμᾶς — «собирающий вас» (ἐπισυνάγω); в МТ «Бог Израилев будет стражем позади вас» — иное чтение, не внесено. В яп. два подлежащих разведены на два предложения со связкой."
  13: "Ἰδοὺ συνήσει ὁ παῖς μου — «вот, уразумеет Раб Мой» (παῖς — 僕; συνίημι — «понимать, разуметь»; в Синодальном «будет благоуспешен» по МТ). ὑψωθήσεται καὶ δοξασθήσεται σφόδρα — «возвысится и прославится весьма» (σφόδρα); три члена сохранены. Начало четвёртой песни Раба (52:13–53:12)."
  14: "ὃν τρόπον ἐκστήσονται ἐπὶ σὲ πολλοί — «как изумятся о тебе многие» (ἐξίστημι). ἀδοξήσει ἀπὸ ἀνθρώπων τὸ εἶδός σου — «обесчестится от людей вид твой» (ἀδοξέω); во втором члене слав. «от сынов человеческих» (в LXX ἀπὸ τῶν ἀνθρώπων повторено), разнообразие слав. сохранено. Речь обращена к Рабу («ты»), как в греч. и слав. Тире в модуле — редакторская помета, не перенесена."
  15: "οὕτως θαυμάσονται ἔθνη πολλά — «так удивятся народы многие» (θαυμάζω); ἐπ᾿ αὐτῷ — «о Нём»: третье лицо после «ты» в 52:14, смена лица сохранена. συνέξουσιν βασιλεῖς τὸ στόμα αὐτῶν — «цари закроют уста свои» (συγκλείω). οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ, ὄψονται — «кому не возвещено было о Нём, увидят»; цитируется в Рим 15:21. Стих закрывает слово Господа о Рабе; в гл. 53 речь сменяется на «мы» (исповедь), поэтому цитата здесь закрыта, а гл. 53 дана без кавычек — см. шапку гл. 53."
