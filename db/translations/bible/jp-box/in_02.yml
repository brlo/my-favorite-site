verses:
  1: "三[みっ]日目[め]に、ガリラヤのカナで婚礼[こんれい]があった。イエスの母[はは]もそこにいた。"
  2: "イエスも弟子[でし]たちも、その婚礼[こんれい]に招[まね]かれた。"
  3: "ぶどう酒[さけ]がなくなると、イエスの母[はは]はイエスに言[い]った。「<mo>ぶどう酒[さけ]がありません。</mo>」"
  4: "イエスは彼女[かのじょ]に言[い]われた。「<j>婦人[ふじん]よ、わたしとあなたと何[なん]の関[かか]わりがあるのか。わたしの時[とき]はまだ来[き]ていない。</j>」"
  5: "母[はは]は給仕[きゅうじ]たちに言[い]った。「<mo>この方[かた]があなたがたに言[い]われることは、何[なん]でも行[おこな]いなさい。</mo>」"
  6: "そこには、ユダヤ人[じん]の清[きよ]めの習[なら]わしに従[したが]って置[お]かれた石[いし]の水[みず]がめが六[むっ]つあり、それぞれ二斗[にと]か三斗[さんと]ほど入[はい]る。"
  7: "イエスは彼[かれ]らに言[い]われた。「<j>この水[みず]がめに水[みず]を満[み]たしなさい。</j>」彼[かれ]らは、縁[ふち]までいっぱいに満[み]たした。"
  8: "そして言[い]われた。「<j>さあ、くんで、宴会[えんかい]の司[つかさ]に持[も]って行[い]きなさい。</j>」彼[かれ]らは持[も]って行[い]った。"
  9: "宴会[えんかい]の司[つかさ]は、ぶどう酒[さけ]になった水[みず]を味[あじ]わった。どこから来[き]たのかは知[し]らなかったが、水[みず]をくんだ給仕[きゅうじ]たちは知[し]っていた。そこで司[つかさ]は花婿[はなむこ]を呼[よ]んで、"
  10: "言[い]った。「だれでも、まず良[よ]いぶどう酒[さけ]を出[だ]し、客[きゃく]が酔[よ]ってから劣[おと]ったものを出[だ]す。あなたは良[よ]いぶどう酒[さけ]を今[いま]まで取[と]っておいた。」"
  11: "イエスはガリラヤのカナで、これがしるしの始[はじ]めを行[おこな]い、ご自身[じしん]の栄光[えいこう]を現[あらわ]された。弟子[でし]たちはイエスを信[しん]じた。"
  12: "その後[そののち]、イエスは母[はは]と兄弟[きょうだい]たちと弟子[でし]たちとともにカファルナウムへ下[くだ]り、そこに幾日[いくにち]かとどまられた。"
  13: "ユダヤ人[じん]の過越祭[すぎこしまつり]が近[ちか]づき、イエスはエルサレムへ上[のぼ]られた。"
  14: "神殿[しんでん]の内[うち]で、牛[うし]や羊[ひつじ]、鳩[はと]を売[う]る者[もの]たちや、両替人[りょうがえにん]が座[すわ]っているのをご覧[らん]になった。"
  15: "そして、縄[なわ]で鞭[むち]を作[つく]り、羊[ひつじ]も牛[うし]もろとも、すべての者[もの]を神殿[しんでん]から追[お]い出[だ]し、両替人[りょうがえにん]の金[かね]をまき散[ち]らし、台[だい]をひっくり返[かえ]された。"
  16: "鳩[はと]を売[う]る者[もの]たちには言[い]われた。「<j>これをここから持[も]って行[い]け。わたしの父[ちち]の家[いえ]を商[あきな]いの家[いえ]にするな。</j>」"
  17: "弟子[でし]たちは、「あなたの家[いえ]への熱意[ねつい]がわたしを食[く]い尽[つ]くす」と書[か]かれているのを思[おも]い出[だ]した。"
  18: "そこでユダヤ人[じん]たちは答[こた]えて言[い]った。「あなたがこれらのことを行[おこな]うのなら、どんなしるしを見[み]せてくれるのか。」"
  19: "イエスは答[こた]えて言[い]われた。「<j>この神殿[しんでん]を壊[こわ]せ。わたしは三日[みっか]でそれを建[た]て直[なお]す。</j>」"
  20: "ユダヤ人[じん]たちは言[い]った。「この神殿[しんでん]は建[た]てるのに四十六年[よんじゅうろくねん]もかかった。それをあなたは三日[みっか]で建[た]て直[なお]すというのか。」"
  21: "しかし、イエスが言[い]われたのは、ご自身[じしん]の体[からだ]という神殿[しんでん]のことだった。"
  22: "それで、イエスが死者[ししゃ]の中[なか]から起[お]こされたとき、弟子[でし]たちはこのことを思[おも]い出[だ]し、聖書[せいしょ]とイエスが言[い]われた言葉[ことば]とを信[しん]じた。"
  23: "過越祭[すぎこしまつり]の祭[まつ]りの間[あいだ]、イエスがエルサレムにおられたとき、多[おお]くの人[ひと]が、イエスの行[おこな]われるしるしを見[み]て、その名[な]を信[しん]じた。"
  24: "しかし、イエスご自身[じしん]は、彼[かれ]らにご自身[じしん]を委[ゆだ]ねられなかった。すべての人[ひと]を知[し]っておられたからである。"
  25: "また、人[ひと]についてだれかが証言[しょうげん]する必要[ひつよう]もなかった。人[ひと]の内[うち]に何[なに]があるかを、ご自身[じしん]で知[し]っておられたからである。"

notes:
  1: "τῇ ἡμέρᾳ τῇ τρίτῃ — «в третий день»; 三日目."
  4: "γύναι — звательное «женщина, госпожа», не грубость; τί ἐμοὶ καὶ σοί — семитский оборот «что мне и тебе». Передано без сглаживания: 婦人よ、わたしとあなたと何の関わりがあるのか. οὔπω ἥκει — perfect «ещё не пришёл», まだ来ていない."
  6: "μετρητής — около 39 литров; шесть каменных водоносов по две-три меры. «二斗か三斗» — традиционная японская передача меры, точный объём сосуда около 80–120 литров."
  10: "μεθυσθῶσιν — «напились допьяна»; 酔ってから. Речь распорядителя пира, не красная."
  11: "ἀρχὴν τῶν σημεείων — «начало знамений»; しるしの始め."
  17: "ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με — Пс 68:10 (69:9); «熱意がわたしを食い尽くす»."
  20: "τεσσεράκοντα καὶ ἓξ ἔτεσιν — датив времени, «сорока шестью годами»; 四十六年."
  25: "ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου — «чтобы кто свидетельствовал о человеке»; 人についてだれかが証言する."
