# jp-box, Евангелие от Иоанна, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: брак в Кане (1–12), очищение храма (13–22), в Иерусалиме на Пасхе (23–25).
# Красное (<j>): 2:4, 7, 8, 16, 19 — слова Христа.
# Синее (<mo>): 2:3 и 2:5 — слова Богородицы (единственные в книге).
# Слова распорядителя пира и иудеев — не красные. jp-ni не использовался.

