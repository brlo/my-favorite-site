# jp-box, Неемия, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz): ezd 18 = Неем 8; контроль — церковнославянский
# (csl-ru), по паритету (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes);
# ru (Синодальный) — только для понимания, не источник. jp-ni в Неемии есть,
# но источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: чтение закона на площади у Водяных ворот (1–8), плач народа и
# призыв к радости (9–12), праздник кущей (13–18).
# Речь в 「…」 (9–11, 15); красного нет: говорит человек, не Бог.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 律法, 仮庵, 会衆 уже в корпусе.
# Паритет: ст. 6 «アーメン、アーメン» (двойное у слав.), ст. 7 — имена слав.,
# ст. 10 «主の喜び» (слав.) — в тексте; вариант LXX назван в notes.
# Слова «наступил седьмой месяц» по греч. делению стоят в 7:73 (см. neem_07).

