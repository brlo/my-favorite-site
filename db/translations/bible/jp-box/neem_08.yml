verses:
  1: "民[たみ]はすべて、一[ひと]人[り]の男[おとこ]のように、水[みず]の門[もん]の前[まえ]の広場[ひろば]に集[あつ]まった。そして、書記[しょき]エズラに、主[しゅ]がイスラエルに命[めい]じたモーセの律法[りっぽう]の書[しょ]を持[も]って来[く]るように言[い]った。"
  2: "祭司[さいし]エズラは、第七[だいしち]の月[つき]の第[だい]一[いち]日[にち]に、男[おとこ]から女[おんな]に至[いた]るまで、また聞[き]いて理解[りかい]できる者[もの]たちすべての前[まえ]に、律法[りっぽう]を持[も]って来[き]た。"
  3: "彼[かれ]は水[みず]の門[もん]の前[まえ]の広場[ひろば]で、日[ひ]が照[て]り始[はじ]める時[とき]から昼[ひる]まで、男[おとこ]たちと女[おんな]たちの前[まえ]でその書[しょ]を読[よ]んだ。彼[かれ]らは理解[りかい]しており、民[たみ]はすべて、耳[みみ]を律法[りっぽう]の書[しょ]に傾[かたむ]けていた。"
  4: "書記[しょき]エズラは木[き]の演壇[えんだん]の上[うえ]に立[た]った。彼[かれ]の右[みぎ]にはマタティア、サマヤ、アナニヤ、ウリヤ、エルキヤ、マアセヤが、左[ひだり]にはファダヤ、ミサエル、マルキヤ、オサム、アサブダナ、ザカリヤ、モソラムが立[た]った。"
  5: "エズラが民[たみ]すべての前[まえ]で書[しょ]を開[ひら]くと、彼[かれ]は民[たみ]より高[たか]い所[ところ]にいたので、民[たみ]はすべて立[た]ち上[あ]がった。"
  6: "エズラは大[おお]いなる神[かみ]である主[しゅ]をほめたたえた。民[たみ]はすべて答[こた]えて「アーメン、アーメン」と言[い]い、手[て]を高[たか]く上[あ]げ、身[み]をかがめて地[ち]にひれ伏[ふ]し、主[しゅ]を拝[はい]した。"
  7: "イエシュア、バナヤ、サラビヤ、アカン、サバタイ、カムパス、アザルヤ、イオザバダン、アニファネス、およびレビ人[びと]たちは、民[たみ]に律法[りっぽう]を教[おし]えていた。民[たみ]は立[た]ったままでいた。"
  8: "彼[かれ]らは神[かみ]の律法[りっぽう]の書[しょ]を読[よ]み、エズラは主[しゅ]の理解[りかい]に基[もと]づいて教[おし]え、その意味[いみ]を明[あき]らかにしたので、民[たみ]はその読[よ]み聞[き]かせを理解[りかい]した。"
  9: "ネヘミヤと、祭司[さいし]で書記[しょき]でもあるエズラと、民[たみ]を教[おし]えていたレビ人[びと]たちは、民[たみ]すべてに言[い]った。「この日[ひ]は、あなたがたの神[かみ]である主[しゅ]にとって聖[せい]なる日[ひ]である。悲[かな]しんではならない。泣[な]いてもならない。」民[たみ]はすべて、律法[りっぽう]の言葉[ことば]を聞[き]いて泣[な]いていたからである。"
  10: "彼[かれ]は彼[かれ]らに言[い]った。「行[い]って、肥[こ]えた物[もの]を食[た]べ、甘[あま]い物[もの]を飲[の]み、何[なに]も用意[ようい]していない者[もの]には分[わ]け与[あた]えなさい。この日[ひ]は、私たちの主[しゅ]にとって聖[せい]なる日[ひ]だからである。悲[かな]しんではならない。主[しゅ]の喜[よろこ]びがあなたがたの力[ちから]だからである。」"
  11: "レビ人[びと]たちは民[たみ]すべてを静[しず]めて言[い]った。「静[しず]かにしなさい。この日[ひ]は聖[せい]なる日[ひ]だから、気[き]を落[お]としてはならない。」"
  12: "民[たみ]はすべて、食[た]べ、飲[の]み、分[わ]け与[あた]え、大[おお]きな喜[よろこ]びを祝[いわ]うために去[さ]った。彼[かれ]らは、自分[じぶん]たちに示[しめ]された言葉[ことば]を理解[りかい]したからである。"
  13: "第[だい]二[に]日[にち]に、民[たみ]全体[ぜんたい]の父[ちち]の家[いえ]の長[かしら]たちが、祭司[さいし]たちとレビ人[びと]たちとともに、律法[りっぽう]のすべての言葉[ことば]を悟[さと]るために、書記[しょき]エズラのもとに集[あつ]まった。"
  14: "彼[かれ]らは律法[りっぽう]のうちに、主[しゅ]がモーセに命[めい]じたことが記[しる]されているのを見[み]つけた。すなわち、イスラエルの子[こ]らは第七[だいしち]の月[つき]の祭[まつ]りに仮庵[かりいお]の中[なか]に住[す]むべきである、ということである。"
  15: "また、自分[じぶん]の町[まち]々[まち]とエルサレムで角笛[つのぶえ]を吹[ふ]いて告[つ]げ知[し]らせるべきである、とも。そしてエズラは言[い]った。「山[やま]に行[い]って、オリーブの葉[は]、糸杉[いとすぎ]の木[き]の葉[は]、ミルトスの葉[は]、なつめやしの葉[は]、茂[しげ]った木[き]の葉[は]を持[も]って来[き]て、記[しる]されているとおりに仮庵[かりいお]を造[つく]りなさい。」"
  16: "民[たみ]は出[で]て行[い]き、持[も]って来[き]て、それぞれ自分[じぶん]の屋根[やね]の上[うえ]、自分[じぶん]の庭[にわ]、神[かみ]の家[いえ]の庭[にわ]、町[まち]の広場[ひろば]、またエフライムの門[もん]に至[いた]るまで、仮庵[かりいお]を造[つく]った。"
  17: "捕囚[ほしゅう]から帰[かえ]って来[き]た者[もの]たちの会衆[かいしゅう]はすべて、仮庵[かりいお]を造[つく]ってその中[なか]に住[す]んだ。ヌンの子[こ]イエシュアの日[ひ]からこの日[ひ]まで、イスラエルの子[こ]らはこのようにしたことがなかった。そして、大[おお]きな喜[よろこ]びがあった。"
  18: "彼[かれ]は神[かみ]の律法[りっぽう]の書[しょ]を、第[だい]一[いち]日[にち]から最後[さいご]の日[ひ]まで、日[ひ]ごとに読[よ]んだ。彼[かれ]らは七[なな]日[にち]の間[あいだ]祭[まつ]りを行[おこな]い、第[だい]八[はち]日[にち]には定[さだ]めに従[したが]って閉会[へいかい]の集[つど]いを開[ひら]いた。"

notes:
  1: "Глава в гр. начинается сразу с собрания: εἰς τὸ πλάτος τὸ ἔμπροσθεν πύλης τοῦ ὕδατος — на пространство (площадь) перед Водяными воротами; 水の門, 広場. ὡς ἀνὴρ εἷς — как один человек. Слова «наступил седьмой месяц, и сыны Израилевы были в городах своих» в csl/ru открывают 8:1, а в гр. стоят в 17:73 — там и переведены."
  2: "ἀπὸ ἀνδρὸς καὶ ἕως γυναικὸς — от мужа до жены, т.е. от мужчин до женщин. πᾶς ὁ συνίων ἀκούειν — всякий, кто мог понимать слышимое (συνίημι). ἐν ἡμέρᾳ μιᾷ τοῦ μηνὸς τοῦ ἑβδόμου — в первый день седьмого месяца."
  3: "ἀπὸ τῆς ὥρας τοῦ διαφωτίσαι τὸν ἥλιον — от часа, когда солнце даёт свет (διαφωτίζω), т.е. от восхода. ἕως ἡμίσους τῆς ἡμέρας — до половины дня, до полудня. ὦτα παντὸς τοῦ λαοῦ εἰς τὸ βιβλίον — уши всего народа к книге. Слав. добавляет «явно на пространстве, еже пред враты водными» — в гр. этого уточнения нет, в текст не внесено."
  4: "βῆμα ξύλινον — деревянное возвышение (βῆμα); 演壇. Имена справа: Ματταθιας, Σαμαιας, Ανανιας, Ουριας, Ελκιας, Μαασαιας — マタティア, サマヤ, アナニヤ, ウリヤ, エルキヤ, マアセヤ; слева: Φαδαιας, Μισαηλ, Μελχιας, Ωσαμ, Ασαβδανα, Ζαχαριας, Μοσολλαμ — ファダヤ, ミサエル, マルキヤ, オサム, アサブダナ, ザカリヤ, モソラム. В слав. те же 13 имён, в ru иные формы."
  5: "ἤνοιξεν τὸ βιβλίον — открыл книгу. ὅτι αὐτὸς ἦν ἐπάνω τοῦ λαοῦ — ибо он был над народом, т.е. стоял выше. ἔστη πᾶς ὁ λαός — весь народ встал (знак благоговения)."
  6: "ηὐλόγησεν κύριον τὸν θεὸν τὸν μέγαν — благословил Господа Бога великого. ἀπεκρίθη … καὶ εἶπαν Αμην — отвечал… и сказали: аминь; в гр. «аминь» один раз, слав. удваивает («аминь, аминь») — по паритету в тексте двойное. ἐπάραντες χεῖρας — подняв руки. ἔκυψαν καὶ προσεκύνησαν … ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — склонились и поклонились лицом до земли."
  7: "В гр. только три имени: Ἰησοῦς καὶ Βαναιας καὶ Σαραβια — イエシュア, バナヤ, サラビヤ. Слав. добавляет ещё Акан, Саватей, Кампас, Азария, Иозавадан, Анифанес (по МТ) — по паритету внесены в текст. συνετίζω — вразумлять, объяснять (слав. «вразумляюще»). ὁ λαὸς ἐν τῇ στάσει αὐτοῦ — народ стоял на своём месте."
  8: "ἀνέγνωσαν ἐν βιβλίῳ νόμου τοῦ θεοῦ — читали в книге закона Божия. ἐδίδaσκεν … καὶ διέστελλεν — учил и разделял, т.е. разбирал по частям (διαστέλλω). ἐν ἐπιστήμῃ κυρίου — в знании Господнем, т.е. вразумительно; 主の理解に基づいて. συνῆκεν ὁ λαὸς ἐν τῇ ἀναγνώσει — народ понял при чтении."
  9: "Νεεμιας — Неемия; в гр. без титула «тиршата», его добавляют ru и МТ. ὁ ἱερεὺς καὶ γραμματεύς — священник и книжник. οἱ συνετίζοντες τὸν λαόν — вразумлявшие народ. Ἡ ἡμέρα ἁγία ἐστὶν τῷ κυρίῳ — день свят Господу. μὴ πενθεῖτε μηδὲ κλαίετε — не скорбите и не плачьте (πενθέω — оплакивать)."
  10: "Πορεύεσθε φάγετε λιπάσματα — идите, ешьте жирное, тучное (λίπασμα). πίετε γλυκάσματα — пейте сладкое. ἀποστείλατε μερίδας τοῖς μὴ ἔχουσιν — пошлите доли неимущим. μὴ διαπέσητε — не падайте духом, не унывайте (διαπίπτω); слав. «не печалитеся». В гр. ἐστὶν ἰσχὺς ὑμῶν — «это ваша сила»; слав. поясняет «радость Господня сия есть сила наша» — по паритету в тексте 主の喜び."
  11: "κατεσιώπων — заставляли молчать (κατασιωπάω), имперфект. Σιωπᾶτε — молчите. μὴ καταπίπτετε — не падайте, не изнемогайте; слав. «не тужите»."
  12: "ἀπῆλθεν … φαγεῖν καὶ πιεῖν καὶ ἀποστέλλειν μερίδας — пошёл есть, пить и посылать доли. ποιῆσαι εὐφροσύνην μεγάλην — сотворить великое веселье. οἷς ἐγνώρισεν αὐτοῖς — которые Он (или Ездра) дал им знать."
  13: "οἱ ἄρχοντες τῶν πατριῶν τῷ παντὶ λαῷ — главы отечеств всего народа (конструкция гр. сбита, передана по смыслу). ἐπιστῆσαι πρὸς πάντας τοὺς λόγους τοῦ νόμου — «вникнуть во все слова закона» (ἐφίστημι); отсюда 悟るために."
  14: "εὕροσαν γεγραμμένον — нашли написанным (аорист с окончанием -οσαν, эллинистическая форма). ἐν σκηναῖς — в кущах, шатрах; 仮庵. ἑορτὴ ἐν μηνὶ τῷ ἑβδόμῳ — праздник в седьмом месяце (праздник кущей, Лев 23:34)."
  15: "σημάνωσιν σάλπιγξιν — дать знак трубами (σημαίνω, σάλπιγξ); 角笛. φύλλα ἐλαίας — листья маслины; κυπαρίσσων — кипариса (糸杉); μυρσίνης — мирта (ミルトス); φοινίκων — пальмы (なつめやし); ξύλου δασέος — древесного, густого дерева (δασύς); слав. «древес дубравных». ποιῆσαι σκηνὰς κατὰ τὸ γεγραμμένον — сделать кущи по написанному."
  16: "ἐξῆλθεν ὁ λαός — вышел народ. ἕκαστος ἐπὶ τοῦ δώματος αὐτοῦ — каждый на своей кровле (δῶμα); 屋根. ἐν ταῖς αὐλαῖς — во дворах (αὐλή). ἐν πλατείαις τῆς πόλεως — на площадях города; слав. читает «на пространстве врат водных» — иное чтение, в тексте гр."
  17: "πᾶσα ἡ ἐκκλησία οἱ ἐπιστρέψαντες ἀπὸ τῆς αἰχμαλωσίας — всё общество возвратившихся из плена. οὐκ ἐποίησαν ἀπὸ ἡμερῶν Ἰησοῦ υἱοῦ Ναυη — не делали со дней Иисуса, сына Навина (Ναυη, евр. נוּן; принятое ヌン). ἐγένετο εὐφροσύνη μεγάλη — была радость великая."
  18: "ἀνέγνω … ἡμέραν ἐν ἡμέρᾳ — читал день за днём (ἡμέραν ἐν ἡμέρᾳ). ἑορτὴν ἑπτὰ ἡμέρας — праздник семь дней. τῇ ἡμέρᾳ τῇ ὀγδόῃ ἐξόδιον κατὰ τὸ κρίμα — в восьмой день выход, заключительное собрание по уставу (ἐξόδιον; слав. «собрание по обычаю», ru «попразднество»); отсюда 閉会の集い."
