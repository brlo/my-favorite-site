verses:
  1: "ギレアデ人[びと]エフタは力[ちから]に優[すぐ]れた勇士[ゆうし]であった。彼[かれ]は娼婦[しょうふ]の女[おんな]から生[う]まれた子[こ]であり、その女がギレアデにエフタを産[う]んだ。"
  2: "ギレアデの妻[つま]も彼[かれ]に息子[むすこ]たちを産[う]んだ。妻の息子たちが成人[せいじん]すると、彼らはエフタを追[お]い出[だ]して言[い]った。「おまえは私たちの父[ちち]の家[いえ]を嗣[つ]ぐことはできない。おまえは遊女[ゆうじょ]の子[こ]だから。」"
  3: "エフタは兄弟[きょうだい]たちの前[まえ]から逃[に]げ、トブの地[ち]に住[す]んだ。すると、ならず者[もの]たちがエフタのもとに集[あつ]まり、彼[かれ]とともに出[で]て行[ゆ]った。"
  4: "しばらくして、アンモンの子[こ]らはイスラエルと戦[たたか]った。"
  5: "アンモンの子らがイスラエルと戦っていたとき、ギレアデの長老[ちょうろう]たちは、トブの地へエフタを迎[むか]えに行[ゆ]った。"
  6: "そしてエフタに言[い]った。「来[き]て、私たちの指導者[しどうしゃ]になってください。アンモンの子らと戦[たたか]いましょう。」"
  7: "エフタはギレアデの長老たちに言った。「あなたがたこそ、私を憎[にく]み、父[ちち]の家[いえ]から追[お]い出[だ]し、あなたがたのもとから送[おく]り出[だ]したのではないか。なぜ、あなたがたが苦[くる]しんでいる今[いま]、私のところへ来[き]たのか。」"
  8: "ギレアデの長老たちはエフタに言った。「そうではない。今、私たちはあなたのところへ来たのだ。あなたは私たちと一緒[いっしょ]に行[い]き、私たちはアンモンの子[こ]らと戦[たたか]う。そして、あなたはギレアデに住[す]むすべての者の頭[かしら]となるのだ。」"
  9: "エフタはギレアデの長老たちに言った。「もしあなたがたが、私を連[つ]れ戻[もど]してアンモンの子[こ]らと戦[たたか]わせ、主[しゅ]が彼らを私の前[まえ]に渡[わた]してくださるなら、私があなたがたの頭[かしら]になる。」"
  10: "ギレアデの長老たちはエフタに言った。「私たちがあなたの言葉[ことば]どおりに行[おこな]わないなら、主[しゅ]が私たちの間[あいだ]で聞[き]いておられる。」"
  11: "エフタはギレアデの長老たちとともに行[ゆ]った。彼[かれ]らは彼[かれ]を自分[じぶん]たちの上[うえ]の頭[かしら]、また指導者[しどうしゃ]とした。エフタはミツパで、自分のすべての言葉[ことば]を主[しゅ]の前[まえ]に語[かた]った。"
  12: "エフタはアンモンの子[こ]らの王[おう]に使者[ししゃ]を遣[つか]わして言[い]った。「私とあなたの間[あいだ]に何[なに]があるのか。なぜ、あなたは私の地[ち]に攻[せ]め上[のぼ]って来[き]て、私と戦[たたか]おうとするのか。」"
  13: "アンモンの子[こ]らの王[おう]はエフタの使者[ししゃ]たちに言[い]った。「イスラエルがエジプトから上[のぼ]って来[き]たとき、アルノンからヤボク、そしてヨルダンに至[いた]るまでの私の地[ち]を取[と]ったからだ。今、それを平和[へいわ]のうちに返[かえ]せ。」"
  14: "使者[ししゃ]たちはエフタのもとへ帰[かえ]った。エフタはアンモンの子[こ]らの王[おう]に使者を遣[つか]わした。"
  15: "「エフタはこう言[い]う。イスラエルはモアブの地[ち]も、アンモンの子[こ]らの地も取[と]っていない。"
  16: "エジプトから上[のぼ]って来[き]たとき、イスラエルはむしろ荒野[こうや]を紅海[こうかい]まで進[すす]み、カデスに至[いた]った。"
  17: "イスラエルはエドムの王[おう]に使者[ししゃ]を遣[つか]わして言[い]った。『あなたの地[ち]を通[とお]らせてください。』しかし、エドムの王は聞[き]き入[い]れなかった。モアブの王にも使者を遣わしたが、彼も応[おう]じなかった。イスラエルはカデスにとどまった。"
  18: "そして、荒野[こうや]を通[とお]り、エドムの地[ち]とモアブの地を回[まわ]り込[こ]んで、モアブの地の日[ひ]の昇[のぼ]る方[ほう]に来[き]て、アルノンの向[む]こう側[がわ]に陣営[じんえい]を張[は]った。しかし、モアブの領界[りょうかい]には入[はい]らなかった。アルノンがモアブの領界であったからである。"
  19: "イスラエルはアモリ人[じん]の王[おう]、エセボンの王シホンに使者[ししゃ]を遣[つか]わし、彼[かれ]に言[い]った。『あなたの地[ち]を通[とお]って、私たちの場所[ばしょ]まで行[ゆ]かせてください。』"
  20: "しかし、シホンはイスラエルが自分の領界[りょうかい]を通[とお]るのを許[ゆる]さなかった。シホンは自分の民[たみ]をことごとく集[あつ]め、ヤッサに陣営[じんえい]を張[は]って、イスラエルと戦[たたか]った。"
  21: "イスラエルの神[かみ]である主[しゅ]は、シホンとその民すべてをイスラエルの手[て]に渡[わた]し、イスラエルは彼らを打[う]ち倒[たお]した。こうしてイスラエルは、その地[ち]に住[す]んでいたアモリ人[じん]の全[すべ]ての地を嗣業[しぎょう]として受[う]け継[つ]いだ。"
  22: "すなわち、アルノンからヤボクまで、また荒野[こうや]からヨルダンまでの、アモリ人[じん]の全[すべ]ての領界[りょうかい]を嗣業[しぎょう]として受[う]け継[つ]いだ。"
  23: "今[いま]、イスラエルの神[かみ]である主[しゅ]が、ご自分[じぶん]の民[たみ]イスラエルの前[まえ]からアモリ人[じん]を追[お]い払[はら]われたのに、あなたがそれを自分のために嗣業[しぎょう]として受[う]け継[つ]ごうというのか。"
  24: "あなたの神[かみ]であるハモスがあなたに嗣業[しぎょう]として与[あた]えたものを、あなたが受[う]け継[つ]ぐのではないか。私たちの神である主[しゅ]が私たちの前[まえ]から追[お]い払[はら]われたものはすべて、私たちが嗣業として受け継ぐのだ。"
  25: "今、あなたはモアブの王[おう]、セポルの子[こ]バラクよりも優[すぐ]れているのか。バラクはイスラエルと争[あらそ]っただろうか。彼らと戦[たたか]っただろうか。"
  26: "イスラエルがエセボンとそれに属[ぞく]する町々[まちまち]、ヤゼルとそれに属する町々、またヨルダン沿[ぞ]いのすべての町々に住[す]んでから、三百年[さんびゃくねん]になる。彼らはなぜ、その時[とき]、それらを奪[うば]い返[かえ]さなかったのか。"
  27: "私はあなたに罪[つみ]を犯[おか]していないのに、あなたは私と戦[たたか]おうとして、私に悪[わる]をしている。今日[きょう]、裁[さば]く方[かた]である主[しゅ]が、イスラエルの子[こ]らとアンモンの子らの間[あいだ]を裁[さば]かれるように。」"
  28: "しかし、アンモンの子[こ]らの王[おう]は、エフタが彼に送[おく]った言葉[ことば]に聞[き]き入[い]れなかった。"
  29: "主[しゅ]の霊[れい]がエフタの上[うえ]に下[くだ]った。エフタはギレアデの地[ち]とマナセを通[とお]り過[す]ぎ、ギレアデの見張[みは]り櫓[やぐら]を通って、ギレアデの見張り櫓からアンモンの子[こ]らの向[む]こう側[がわ]へ行[ゆ]った。"
  30: "エフタは主[しゅ]に誓願[せいがん]を立[た]てて言[い]った。『もし、あなたがアンモンの子[こ]らを私の手[て]に渡[わた]してくださるなら、"
  31: "私がアンモンの子らから平和[へいわ]のうちに帰[かえ]るとき、私の家[いえ]の戸口[とぐち]から私を迎[むか]えに出[で]て来[く]る者[もの]は、主[しゅ]のものとなり、私はその者を焼[や]き尽[つ]くす捧[ささ]げ物[もの]として献[ささ]げます。』"
  32: "エフタはアンモンの子[こ]らと戦[たたか]うために彼らのところへ渡[わた]って行[ゆ]き、主[しゅ]は彼らをエフタの手[て]に渡[わた]された。"
  33: "エフタはアロエルからセモイトに至[いた]るまで、二十[にじゅう]の町[まち]、すなわちぶどう畑[ばたけ]のアベルに至[いた]るまで、彼らを非常[ひじょう]に大[おお]きな打撃[だげき]で打[う]った。アンモンの子[こ]らはイスラエルの子らの前[まえ]に打[う]ちひしがれた。"
  34: "エフタはミツパの自分の家[いえ]に帰[かえ]った。すると、見[み]よ、彼[かれ]の娘[むすめ]がタンバリンと踊[おど]りをもって彼を迎[むか]えに出[で]て来[き]た。彼女[かのじょ]は彼のただ一人[ひとり]の愛[あい]する娘で、彼には彼女のほかに息子[むすこ]も娘もいなかった。"
  35: "彼女[かのじょ]を見[み]ると、彼[かれ]は自分の衣[ころも]を引[ひ]き裂[さ]いて言[い]った。「ああ、娘[むすめ]よ。おまえは私を打[う]ち倒[たお]した。おまえは私の目[め]につまずきとなった。私はおまえのことを主[しゅ]の前[まえ]で口[くち]にした。もう取[と]り消[け]すことはできない。」"
  36: "彼女[かのじょ]は彼[かれ]に言った。「父[ちち]よ。もし、あなたが私のことで主[しゅ]に向かって口を開かれたのなら、あなたの口から出[で]たとおりに、私の身[み]にしてください。主があなたのために、あなたの敵[てき]、アンモンの子[こ]らに復讐[ふくしゅう]を果[は]たされたのですから。」"
  37: "彼女[かのじょ]は父[ちち]に言った。「どうか、このことを私にしてください。二か月[にかげつ]の間[あいだ]、私を放[はな]してください。私は友[とも]たちとともに山[やま]へ下[くだ]って行[ゆ]き、自分の処女[しょじょ]の身[み]を泣[な]いて過[す]ごします。」"
  38: "父[ちち]は言った。「行[ゆ]きなさい。」こうして彼[かれ]は彼女[かのじょ]を二か月の間[あいだ]送[おく]り出[だ]した。彼女は友たちとともに行き、山々[やまやま]で自分の処女の身を泣いて過[す]ごした。"
  39: "二か月[にかげつ]が終[お]わると、彼女[かのじょ]は父[ちち]のところへ帰[かえ]って来[き]た。父[ちち]は彼女に対して、自分[じぶん]が立[た]てた誓願[せいがん]を果[は]たした。彼女は男[おとこ]を知[し]らなかった。これがイスラエルで定[さだ]めとなった。"
  40: "イスラエルの娘[むすめ]たちは、年[とし]ごとに、年のうち四日[よっか]の間[あいだ]、ギレアデ人エフタの娘を悼[いた]みに通[かよ]った。"

notes:
  1: "δυνατὸς ἐν ἰσχύι — «сильный крепостью», т. е. храбрый воин (слав. «силен крепостию»). γυναικὸς πόρνης — женщины-блудницы (πόρνη; 娼婦). ἔτεκεν τῷ Γαλααδ — «родила Галааду» (датив — отцу)."
  2: "ἡδρύνθησαν — возмужали (ἁδρύνομαι). ἐξέβαλον — изгнали. οὐ κληρονομήσεις ἐν τῷ οἴκῳ — «не наследуешь в доме»; 嗣業. γυναικὸς ἑταίρας — «женщины-гетеры» (ἑταίρα, не πόρνη, как в ст. 1); 遊女. Речь в 「」."
  3: "ἀπέδρα — убежал (ἀποδιδράσκω). ἐν γῇ Τωβ — в земле Тов. ἄνδρες λιτοί — «мужи скудные, пустые, праздные» (λιτός; слав. «праздни», ру «праздные»); ならず者 (букв. «пустые люди»). συνεξεπορεύοντο — выходили вместе с ним."
  4: "μεθ᾿ ἡμέρας — через несколько дней. ἐπολέμησαν ... μετὰ Ισραηλ — воевали с Израилем."
  5: "ἡνίκα ἐπολέμουν — когда воевали. οἱ πρεσβύτεροι Γαλααδ — старейшины Галаада (長老). παραλαβεῖν — взять, привести."
  6: "Δεῦρο καὶ ἔσῃ ἡμῖν εἰς ἡγούμενον — «приди и будь нам вождём» (ἡγούμενος); 指導者. πολεμήσωμεν — сразимся (cohortative). Речь в 「」."
  7: "ἐμισήσατέ με — возненавидели меня. ἐξεβάλετέ με — изгнали. ἐξαπεστείλατέ με ἀφ᾿ ὑμῶν — «выслали меня от вас». ἡνίκα ἐθλίβητε — когда были в беде (θλίβω). Речь в 「」."
  8: "Οὐχ οὕτως — «не так» (слав. «сего ради» понял связь иначе). συμπορεύσῃ ἡμῖν — пойдёшь с нами. ἔσῃ ἡμῖν εἰς κεφαλήν — будешь нам главою. Речь в 「」."
  9: "εἰ ἐπιστρέφετέ με — «если вы возвращаете меня» (ἐπιστρέφω). παραδῷ κύριος — предаст Господь. ἐγὼ ὑμῖν ἔσομαι εἰς κεφαλήν — «я буду вам главою»: в гр. без вопросительного знака, поэтому утверждение; слав. и ру оформляют как вопрос («буду ли князь?»)."
  10: "Κύριος ἔσται ὁ ἀκούων ἀνὰ μέσον ἡμῶν — «Господь будет слышащим между нами», т. е. свидетелем (слав. «да будет послух»). εἰ μὴ κατὰ τὸ ῥῆμά σου οὕτως ποιήσομεν — «если не по слову твоему так сделаем»: клятвенная формула; порядок частей в японском перевёрнут для естественности."
  11: "κατέστησαν αὐτὸν ἐπ᾿ αὐτῶν — поставили его над собой (καθίστημι); подлежащее — старейшины. εἰς κεφαλὴν εἰς ἡγούμενον — в главу и вождя. ἐλάλησεν ... πάντας τοὺς λόγους αὐτοῦ — произнёс все слова свои. ἐν Μασσηφα — в Массифе (ミツパ)."
  12: "ἀπέστειλεν ... ἀγγέλους — послал послов (ἄγγελος). Τί ἐμοὶ καὶ σοί — «что мне и тебе», идиома тяжбы. ἥκεις ... πολεμῆσαί με — пришёл воевать со мной. Речь в 「」."
  13: "Διότι ἔλαβεν Ισραηλ — потому что взял Израиль. ἀπὸ Αρνων ἕως Ιαβοκ καὶ ἕως τοῦ Ιορδάνου — от Арнона до Иавока и до Иордана. ἐπίστρεψον αὐτὰς μετ᾿ εἰρήνης — «возврати их (земли) с миром»: αὐτὰς жен. р. мн. ч.; слав. добавляет «и отиду», в гр. нет."
  14: "ἀπέστρεψαν οἱ ἄγγελοι — послы возвратились. καὶ ἀπέστειλεν Ιεφθαε ἀγγέλους — и послал Иеффай послов (без «снова»; слав. «приложи еще» — добавка). Стих обрывается перед λέγων ст. 15."
  15: "Τάδε λέγει Ιεφθαε — «так говорит Иеффай» (формула посольства). Οὐκ ἔλαβεν Ισραηλ — не взял Израиль. γῆν Μωαβ καὶ γῆν υἱῶν Αμμων — землю Моава и землю сынов Аммона. Речь послания — 「」, открывается здесь."
  16: "ἐν τῇ ἀναβάσει αὐτῶν ἐξ Αἰγύπτου — при восхождении их из Египта. ἀλλ᾿ ἐπορεύθη — «но пошёл» (ἀλλά); в японском без отдельного «но», противопоставление ясно из предыдущего отрицания. θάλασσα ἐρυθρά — Чермное море (紅海). Καδης — Кадес."
  17: "ἀπέστειλεν ... πρὸς βασιλέα Εδωμ — послал к царю Едома. Παρελεύσομαι διὰ τῆς γῆς σου — «пройду через землю твою». οὐκ ἤκουσεν — не послушал. καί γε — «и даже». ἐκάθισεν ἐν Καδης — «сел в Кадесе», т. е. оставался."
  18: "διῆλθεν ἐν τῇ ἐρήμῳ — прошёл пустыней. ἐκύκλωσεν — обошёл (κυκλόω). κατ᾿ ἀνατολὰς ἡλίου — к востоку солнца. παρενέβαλον ἐν τῷ πέραν Αρνων — расположились станом за Арноном. ὅριον — предел, граница (領界)."
  19: "Σηων βασιλέα Εσεβων τὸν Αμορραῖον — Сигон, царь Есевона, Аморреянин; в японском порядок «Аморреянин, царь Есевона, Сигон». Παρελεύσομαι ... ἕως τοῦ τόπου μου — пройду до места моего."
  20: "οὐκ ἠθέλησεν Σηων διελθεῖν — не захотел пропустить (διέρχομαι). συνήγαγεν — собрал. παρενέβαλεν εἰς Ιασσα — расположился станом в Иассе (ヤッサ, как в Числ 21:23). ἐπολέμησεν μετὰ Ισραηλ — воевал с Израилем."
  21: "παρέδωκεν κύριος ὁ θεὸς Ισραηλ — предал Господь Бог Израилев. ἐπάταξεν — поразил (πατάσσω). ἐκληρονόμησεν — наследовал (κληρονομέω); 嗣業. τοῦ κατοικοῦντος ἐν τῇ γῇ — жившего в земле."
  22: "πᾶν τὸ ὅριον τοῦ Αμορραίου — весь предел Аморрея. ἀπὸ Αρνων καὶ ἕως τοῦ Ιαβοκ καὶ ἀπὸ τῆς ἐρήμου καὶ ἕως τοῦ Ιορδάνου — от Арнона до Иавока и от пустыни до Иордана. Стих продолжает ст. 21."
  23: "ἐξῆρεν — изгнал (ἐξαίρω). ἀπὸ προσώπου τοῦ λαοῦ αὐτοῦ Ισραηλ — от лица народа Своего Израиля. σὺ κληρονομήσεις αὐτὸν ἐπὶ σοῦ — «ты наследуешь его на себе»; слав. «ты ли хощеши наследити его?» — вопрос."
  24: "οὐχὶ ὅσα κατεκληρονόμησέν σοι Χαμως ὁ θεός σου — «не то ли, что дал тебе в наследие Хамос, бог твой» (κατακληρονομέω). Χαμως — ハモス (как в корпусе). κύριος ὁ θεὸς ἡμῶν — Господь Бог наш. Риторический вопрос передан как «...のではないか»."
  25: "μὴ κρείσσων εἶ σὺ τοῦ Βαλακ — «не лучше ли ты Валака» (κρείσσων). Βαλακ υἱὸς Σεπφωρ — Валак, сын Сепфора (バラク; не Варак из гл. 4). μὴ μάχῃ ἐμαχέσατο — «разве ссорился» (μάχη и μάχομαι). ἢ πολεμῶν ἐπολέμησεν — «или воюя воевал»."
  26: "ἐν τῷ οἴκῳ Ισραηλ — «в доме Израиля»: греч. фраза без глагола (анаколуф), по-японски передана оборотом «イスラエルが...住んで、三百年になる». θυγατέρες — «дочери», т. е. зависимые селения (слав. «пределы»); в тексте «それに属する町々», буквально отмечено здесь. Ιαζηρ — Иазер (ヤゼル). τριακόσια ἔτη — 300 лет. ἐρρύσαντο — 3 л. мн. ч. «избавили, отняли»; слав. и ру обращаются к царю («ты/вы»), в гр. 3-е лицо."
  27: "οὐχ ἥμαρτόν σοι — не согрешил тебе. ποιεῖς μετ᾿ ἐμοῦ πονηρίαν — делаешь со мной зло. κρῖναι κύριος ὁ κρίνων σήμερον — «да судит Господь, судящий сегодня» (оптатив). ἀνὰ μέσον — между. Конец послания — закрывающая 「」."
  28: "οὐκ εἰσήκουσεν ... καὶ οὐκ εἰσήκουσεν — «не послушал... и не послушал»: повтор в гр. сохранён одной конструкцией с усилением. ὧν ἀπέστειλεν πρὸς αὐτόν — которые он послал к нему."
  29: "ἐγενήθη ἐπὶ Ιεφθαε πνεῦμα κυρίου — «был на Иеффае Дух Господень»; 主の霊 (не 聖霊). διέβη τὴν γῆν Γαλααδ καὶ τὸν Μανασση — прошёл землю Галаад и Манассию. σκοπιά Γαλααδ — сторожевая башня, наблюдательный пункт Галаада (σκοπιά); 見張り櫓. εἰς τὸ πέραν υἱῶν Αμμων — в страну за [Иорданом] сынов Аммона."
  30: "ηὔξατο ... εὐχὴν τῷ κυρίῳ — дал обет Господу (εὔχομαι, εὐχή); 誓願. Ἐὰν παραδώσει παραδῷς — «если преданием предашь» (усилительный повтор). Обет 30–31 по заданию оформлен в 『…』; остальная речь — 「…」."
  31: "ὃς ἂν ἐξέλθῃ ἐκ τῶν θυρῶν τοῦ οἴκου μου εἰς ἀπάντησίν μου — «кто бы ни вышел из дверей дома моего навстречу мне»: относительное ὅς муж. р., поэтому 者 (человек), а не «что»; евр. и ру оставляют двусмысленность («что выйдет»). ἐν τῷ ἐπιστρέψαι με ἐν εἰρήνῃ — когда я возвращусь с миром. καὶ ἔσται τῷ κυρίῳ — «будет Господу», т. е. посвящён. ἀνοίσω αὐτὸν ὁλοκαύτωμα — «вознесу его во всесожжение»; 焼き尽くす捧げ物 (по брифу), без сглаживания; богословский вопрос — здесь, в notes, не в тексте."
  32: "διέβη Ιεφθαε πρὸς τοὺς υἱοὺς Αμμων — перешёл к сынам Аммона. παρέδωκεν αὐτοὺς κύριος ἐν χειρὶ αὐτοῦ — предал их Господь в руку его."
  33: "ἀπὸ Αροηρ καὶ ἕως τοῦ ἐλθεῖν εἰς Σεμωιθ — от Ароера до прихода в Семиоф (Σεμωιθ; セモイト). εἴκοσι πόλεις — двадцать городов. ἕως Αβελ ἀμπελώνων — до Авель-виноградников: LXX переводит имя (ἀμπελών — виноградник), поэтому ぶどう畑のアベル. πληγὴν μεγάλην σφόδρα — поражением весьма великим. ἐνετράπησαν — были посрамлены, обращены в бегство (ἐντρέπω); 打ちひしがれた."
  34: "ἐν τυμπάνοις καὶ χοροῖς — с тимпанами и хорами (τύμπανον — бубен; χορός — хоровод); タンバリンと踊り (ср. Исх 15:20). μονογενὴς αὐτῷ ἀγαπητή — единственная у него, любимая. οὐκ ἔστιν αὐτῷ πλὴν αὐτῆς υἱὸς ἢ θυγάτηρ — не было у него кроме неё сына или дочери."
  35: "διέρρηξεν τὰ ἱμάτια — разодрал одежды (διαρρήγνυμι). Οἴμμοι — увы (междометие). ἐμπεποδοστάτηκάς με — «ты стала мне преградой, подсекла ноги» (ἐμποδοστατέω); слав. «смущающи смутила мя еси», ру «ты сразила меня»; 打ち倒した. εἰς σκῶλον ἐγένου ἐν ὀφθαλμοῖς μου — стала преткновением в очах моих (σκῶλον). ἤνοιξα τὸ στόμα μου περὶ σοῦ πρὸς κύριον — открыл уста о тебе пред Господом. οὐ δυνήσομαι ἀποστρέψαι — не смогу отвратить (ἀποστρέφω), т. е. отменить."
  36: "εἰ ἐν ἐμοὶ ἤνοιξας τὸ στόμα σου — «если обо мне, из-за меня открыл уста» (ἐν ἐμοί). ποίει μοι ὃν τρόπον ἐξῆλθεν ἐκ τοῦ στόματός σου — сделай мне, как вышло из уст твоих. ἀνθ᾿ ὧν — потому что. ἐποίησέν σοι κύριος ἐκδικήσεις ἐκ τῶν ἐχθρῶν σου — «совершил тебе отмщения от врагов твоих» (ἐκδίκησις; форма может быть и будущим «отомстишь»); 復讐を果たされた."
  37: "ποίησόν μοι τὸ ῥῆμα τοῦτο — сделай мне это слово, дело. ἔασόν με δύο μῆνας — оставь меня на два месяца. καταβήσομαι ἐπὶ τὰ ὄρη — сойду на горы. κλαύσομαι ἐπὶ τὰ παρθένιά μου — оплачу девство моё (τὰ παρθένια). αἱ συνεταιρίδες μου — подруги мои (συνεταιρίς)."
  38: "Πορεύου — иди (императив). ἐξαπέστειλεν αὐτὴν δύο μῆνας — отпустил её на два месяца. ἔκλαυσεν ... ἐπὶ τὰ ὄρη — оплакала на горах."
  39: "ἀνέκαμψεν — возвратилась (ἀνακάμπτω). ἐπετέλεσεν ... τὴν εὐχήν — исполнил обет (ἐπιτελέω); «彼女に対して...果たした» передаёт «совершил над нею» (слав. «сотвори на ней»). οὐκ ἔγνω ἄνδρα — не познала мужа. εἰς πρόσταγμα — в постановление, обычай (πρόσταγμα)."
  40: "ἐξ ἡμερῶν εἰς ἡμέρας — «из дней в день», т. е. ежегодно; 年ごとに. θρηνεῖν — оплакивать (θρηνέω); 悼みに. τέσσαρας ἡμέρας ἐν τῷ ἐνιαυτῷ — четыре дня в году."
