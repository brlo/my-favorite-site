verses:
  1: "イエスは十二人[じゅうににん]の弟子[でし]たちに命[めい]じ終[お]えると、そこを立[た]ち去[さ]り、彼[かれ]らの町々[まちまち]で教[おし]え、宣[の]べ伝[つた]えられた。"
  2: "ヨハネは牢[ろう]の中[なか]でキリストのなされた業[わざ]を聞[き]き、自分[じぶん]の弟子[でし]たちを遣[つか]わして、"
  3: "「来[く]るべき方[かた]はあなたですか。それとも、ほかの方[かた]を待[ま]つべきでしょうか」と言[い]わせた。"
  4: "イエスは彼[かれ]らにお答[こた]えになった。「<j>行[い]って、自分[じぶん]たちが聞[き]き、見[み]ていることをヨハネに告[つ]げなさい。</j>"
  5: "<j>見[み]えなかった者[もの]が目[め]を開[ひら]き、歩[ある]けなかった者[もの]が歩[ある]き、重[おも]い皮膚病[ひふびょう]の者[もの]が清[きよ]められ、耳[みみ]の聞[き]こえなかった者[もの]が聞[き]こえ、死者[ししゃ]は生[い]き返[かえ]り、貧[まず]しい人[ひと]びとには福音[ふくいん]が告[つ]げ知[し]らされている。</j>"
  6: "<j>わたしのゆえにつまずくことがないなら、その人[ひと]は幸[さいわ]いである。</j>」"
  7: "ヨハネの弟子[でし]たちが去[さ]ると、イエスは群衆[ぐんしゅう]に向[む]かってヨハネのことを語[かた]り始[はじ]められた。「<j>あなたがたは荒[あ]れ野[の]へ、何[なに]を見[み]に出[で]かけたのか。風[かぜ]に揺[ゆ]らぐ葦[あし]か。</j>"
  8: "<j>では、何[なに]を見[み]に出[で]かけたのか。柔[やわ]らかい衣[ころも]を着[き]た人[ひと]か。柔[やわ]らかい衣[ころも]を着[き]た人[ひと]なら、王[おう]の宮[みや]にいる。</j>"
  9: "<j>では、何[なに]を見[み]に出[で]かけたのか。預言者[よげんしゃ]か。そうだ、あなたがたに言[い]う。預言者[よげんしゃ]よりも大[おお]きな者[もの]である。</j>"
  10: "<j>この人[ひと]こそ、『見[み]よ、わたしはあなたの前[まえ]に使者[ししゃ]を遣[つか]わし、あなたの前[まえ]に道[みち]を備[そな]えさせよう』と書[か]いてある者[もの]である。</j>"
  11: "<j>はっきり言[い]っておく。女[おんな]から生[う]まれた者[もの]のうち、洗礼者[せんれいしゃ]ヨハネより大[おお]きな者[もの]は現[あらわ]れたことがない。しかし、天[てん]の国[くに]で最[もっと]も小[ちい]さい者[もの]でも、彼[かれ]よりは大[おお]きい。</j>"
  12: "<j>洗礼者[せんれいしゃ]ヨハネの日[ひ]から今[いま]に至[いた]るまで、天[てん]の国[くに]は力[ちから]ずくで得[え]られ、力[ちから]を用[もち]いる者[もの]がそれを奪[うば]い取[と]っている。</j>"
  13: "<j>すべての預言者[よげんしゃ]と律法[りっぽう]は、ヨハネの時[とき]まで預言[よげん]していたのである。</j>"
  14: "<j>あなたがたに受[う]け入[い]れる気[き]があるなら、この人[ひと]こそ、来[く]るべきエリヤである。</j>"
  15: "<j>聞[き]く耳[みみ]を持[も]つ者[もの]は、耳[みみ]を澄[す]ませよ。</j>"
  16: "<j>この時代[じだい]の人々[ひとびと]を、何[なに]にたとえようか。広場[ひろば]に座[すわ]って、ほかの者[もの]たちに呼[よ]びかける子[こ]どもたちに似[に]ている。</j>"
  17: "<j>『わたしたちが笛[ふえ]を吹[ふ]いたのに、あなたがたは踊[おど]らなかった。弔[とむら]いの歌[うた]を歌[うた]ったのに、あなたがたは泣[な]かなかった』と言[い]う。</j>"
  18: "<j>ヨハネが来[き]て、食[た]べることも飲[の]むこともしないでいると、人々[ひとびと]は『あの者[もの]は悪霊[あくりょう]に取[と]りつかれている』と言[い]い、</j>"
  19: "<j>人[ひと]の子[こ]が来[き]て飲[の]み食[た]べすると、『見[み]ろ、大食[おおぐ]いで大酒[おおざけ]飲[の]みだ。徴税人[ちょうぜいにん]や罪人[ざいにん]の仲間[なかま]だ』と言[い]う。しかし、知恵[ちえ]はその子[こ]らによって正[ただ]しいと認[みと]められた。</j>」"
  20: "そこで、イエスは、多[おお]くの奇跡[きせき]が行[おこな]われた町々[まちまち]が悔[く]い改[あらた]めなかったので、その町々[まちまち]を責[せ]め始[はじ]められた。"
  21: "「<j>コラジンよ、お前[まえ]は不幸[ふこう]だ。ベトサイダよ、お前[まえ]も不幸[ふこう]だ。お前[まえ]たちの間[あいだ]でなされた奇跡[きせき]がティルスやシドンでなされていたのなら、彼[かれ]らはとうに粗布[あらぬの]を身[み]にまとって灰[はい]をかぶり、悔[く]い改[あらた]めていたにちがいない。</j>"
  22: "<j>しかし、あなたがたに言[い]う。裁[さば]きの日[ひ]には、ティルスとシドンの方[ほう]が、あなたがたよりも軽[かる]く済[す]む。</j>"
  23: "<j>カファルナウムよ。天[てん]まで押[お]し上[あ]げられるとでも思[おも]うのか。お前[まえ]は陰府[よみ]まで突[つ]き落[お]とされるのだ。お前[まえ]の間[あいだ]でなされた奇跡[きせき]がソドムでなされていたなら、その町[まち]は今[いま]なお残[のこ]っていたにちがいない。</j>"
  24: "<j>しかし、あなたがたに言[い]う。裁[さば]きの日[ひ]には、ソドムの地[ち]の方[ほう]が、お前[まえ]よりも軽[かる]く済[す]む。</j>」"
  25: "そのとき、イエスは言[い]われた。「<j>父[ちち]よ、天[てん]と地[ち]の主[しゅ]よ。あなたをほめたたえます。あなたはこれらのことを、知恵[ちえ]ある者[もの]や賢[かしこ]い者[もの]から隠[かく]して、幼[おさな]い者[もの]たちに現[あらわ]しになりましたからです。</j>"
  26: "<j>そうです、父[ちち]よ。これがあなたの御前[みまえ]でよしとされた御心[みこころ]だったからです。</j>"
  27: "<j>わたしはすべてを、父[ちち]から委[ゆだ]ねられています。子[こ]を知[し]っているのは父[ちち]だけであり、父[ちち]を知[し]っているのは子[こ]だけです。そのほかで父[ちち]を知[し]りうるのは、子[こ]が明[あき]らかにしようと選[えら]んだ者[もの]だけです。</j>」"
  28: "「<j>疲[つか]れた者[もの]、重[おも]い荷[に]を負[お]う者[もの]は、だれでもわたしのもとに来[き]なさい。わたしがあなたがたを休[やす]ませる。</j>"
  29: "<j>わたしの軛[くびき]を負[お]って、わたしに学[まな]びなさい。わたしは柔和[じゅうわ]で、心[こころ]のへりくだった者[もの]だからである。そうすれば、あなたがたは魂[たましい]に安[やす]らぎを得[え]る。</j>"
  30: "<j>わたしの荷[に]は軽[かる]く、わたしの軛[くびき]は負[お]いやすいのだから。</j>」"

notes:
  1: "μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν — «перешёл оттуда, чтобы учить и проповедовать». ταῖς πόλεσιν αὐτῶν оставлено как 彼らの町々: чьи именно — в греч. не уточнено."
  2: "τὰ ἔργα τοῦ Χριστοῦ — пишу キリスト, чтобы сработал переключатель ハリストス. У jp-joc двое учеников (二人を遣はして); в критической базе числа нет, не добавляю."
  3: "Слова Иоанна (переданные через учеников) — по правилу не красные. εἶπεν αὐτῷ — «сказал Ему»; передано 「…」と言わせた."
  7: "κάλαμος ὑπὸ ἀνέμου σαλευόμενον — «тростник, ветром колеблемый»; 葦."
  12: "βιάζεται — средний/страдательный залог, буквально «берётся силою». Церковь читает положительно (Елизаветинская: «Царство Небесное силою берется»; jp-joc 力を以て得らる), jp-ni — как насилие над Царством. Взято церковное чтение (力ずくで得られ), двусмысленность греческого не снята — спорное место."
  14: "εἰ θέλετε δέξασθαι — «если хотите принять»; jp-ni сглаживает («認めようとすれば分かることだが»)."
  17: "Слова «детей» — цитата внутри речи Христа, поэтому остаются красными."
  19: "В критической базе ἀπὸ τῶν ἔργων αὐτῆς («от дел её»); Церковь читает ἀπὸ τῶν τέκνων αὐτῆς («от чад её»; jp-joc 睿智の子) — взято церковное чтение, その子ら, без 〔〕 (как 6:1). jp-ni передаёт критическое «その働き»."
  21: "οὐαί σοι — «горе тебе»; 不幸だ (не архаичное 禍なる哉). σάκκος καὶ σποδός — вретище и пепел, знаки покаяния."
  23: "ᾅδης — 陰府[よみ] (в церковном употреблении «ад, преисподняя»). μὴ ἕως οὐρανοῦ ὑψωθήσῃ — вопрос с μή, ожидающий отрицания: 〜とでも思うのか."
  25: "Молитва-славословие 11:25-27 — です・ます, как молитва Господня в 6:9-13; с 11:28 снова 常体 (так же у jp-ni)."
  26: "εὐδοκία ἐγένετο ἔμπροσθέν σου — буквально «благоволение было пред Тобою», без добавления «оказалось»."
  29: "ζυγός — ярмо; сноски нет: по контексту понятно. ταπεινὸς τῇ καρδίᾳ — 心のへりくだった者."
  30: "ζυγός … φορτίον: члены переставлены (у jp-ni порядок греческий), оба сохранены, смысл тот же."
