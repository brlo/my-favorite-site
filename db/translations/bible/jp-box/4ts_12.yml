# jp-box, 4-я Царств, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 12: воцарение Иоаса (1–3), высоты (4), повеление о серебре (5–6),
# двадцать третий год и вопрос царя (7–8), согласие священников (9), ящик для
# серебра (10), счёт и раздача (11–13), отсутствие утвари (14–15), честность
# распорядителей (16), серебро за грех (17), нашествие Азаила (18–19),
# летопись (20), заговор и смерть Иоаса (21–22).
# Нумерация по gr: 22 стиха; у csl 21 — гр 12:1 = слав. 11:21, слав. 12:1 =
# гр 12:2 (сдвиг на один). Отличия отмечены в notes.
# Речь — 「…」 (5–6, 8). Красного нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 大祭司, 日誌, 聖別 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 4ts
chapter: 12
draft: true

verses:
  1: "ヨアシュは王[おう]となったとき、七歳[ななさい]であった。"
  2: "ヨアシュはイエフの第七年[だいななねん]に王[おう]となり、エルサレムで四十年[よんじゅうねん]治[おさ]めた。母[はは]の名[な]はアビアといい、ベエル・シェバの出[で]であった。"
  3: "ヨアシュは、祭司[さいし]ヨヤダが彼[かれ]を教[おし]え導[みちび]いたすべての日[ひ]、主[しゅ]の前[まえ]に正[ただ]しいことを行[おこな]った。"
  4: "ただ、高[たか]い所[ところ]は取[と]り除[のぞ]かれなかった。民[たみ]はなお、高[たか]い所[ところ]で犠牲[ぎせい]をささげ、香[こう]をたき続[つづ]けた。"
  5: "ヨアシュは祭司[さいし]たちに言[い]った。「主[しゅ]の神殿[しんでん]に持[も]ち込[こ]まれる聖[せい]なるものの銀[ぎん]、すなわち評価[ひょうか]の銀[ぎん]、人[ひと]が評価[ひょうか]に従[したが]って納[おさ]める銀[ぎん]、だれかが心[こころ]に思[おも]い立[た]って主[しゅ]の神殿[しんでん]に持[も]って来[く]る銀[ぎん]はすべて、"
  6: "祭司[さいし]たちはそれぞれ自分[じぶん]の売[う]り上[あ]げから取[と]り、それによって神殿[しんでん]の破損[はそん]を、破損[はそん]のある所[ところ]すべてにおいて修復[しゅうふく]するように。」"
  7: "しかし、ヨアシュ王[おう]の第二十三年[だいにじゅうさんねん]になっても、祭司[さいし]たちは神殿[しんでん]の破損[はそん]を修復[しゅうふく]しなかった。"
  8: "そこでヨアシュ王[おう]は祭司[さいし]ヨヤダと祭司[さいし]たちを呼[よ]んで言[い]った。「なぜ、あなたがたは神殿[しんでん]の破損[はそん]を修復[しゅうふく]しないのか。今[いま]からは、あなたがたの売[う]り上[あ]げから銀[ぎん]を取[と]ってはならない。神殿[しんでん]の破損[はそん]のためにそれを渡[わた]しなさい。」"
  9: "祭司[さいし]たちは、民[たみ]から銀[ぎん]を取[と]らないこと、また自分[じぶん]たちで神殿[しんでん]の破損[はそん]を修復[しゅうふく]しないことに同意[どうい]した。"
  10: "祭司[さいし]ヨヤダは一[ひと]つの箱[はこ]を取[と]り、その板[いた]に穴[あな]を開[あ]けて、祭壇[さいだん]のそば、主[しゅ]の神殿[しんでん]に入[はい]る者[もの]たちの右側[みぎがわ]に置[お]いた。入口[いりぐち]を守[まも]る祭司[さいし]たちは、主[しゅ]の神殿[しんでん]で見[み]つかった銀[ぎん]をすべてそこに入[い]れた。"
  11: "箱[はこ]の中[なか]に銀[ぎん]が多[おお]いのを見[み]ると、王[おう]の書記[しょき]と大祭司[だいさいし]が上[のぼ]って来[き]て、主[しゅ]の神殿[しんでん]で見[み]つかった銀[ぎん]を袋[ふくろ]に縛[しば]り込[こ]んで数[かぞ]えた。"
  12: "彼[かれ]らは用意[ようい]された銀[ぎん]を、主[しゅ]の神殿[しんでん]の工事[こうじ]をする者[もの]たちを束[つか]ねる監督[かんとく]たちの手[て]に渡[わた]し、それを木工[もくこう]たちと、主[しゅ]の神殿[しんでん]で働[はたら]く建築[けんちく]する者[もの]たちに渡[わた]した。"
  13: "また、城壁[じょうへき]を築[きず]く者[もの]たちや石切[いしき]りたちに、木材[もくざい]と切[き]り出[だ]した石[いし]を買[か]わせ、主[しゅ]の神殿[しんでん]の破損[はそん]を修復[しゅうふく]するために神殿[しんでん]に費[つい]やされたすべてに充[あ]てた。"
  14: "ただ、主[しゅ]の神殿[しんでん]に持[も]ち込[こ]まれた銀[ぎん]からは、主[しゅ]の神殿[しんでん]のために銀[ぎん]の戸[と]、釘[くぎ]、鉢[はち]、ラッパ、また金[きん]の器[うつわ]も銀[ぎん]の器[うつわ]も作[つく]られなかった。"
  15: "それは、工事[こうじ]をする者[もの]たちに渡[わた]して、それによって主[しゅ]の神殿[しんでん]を修復[しゅうふく]するためであった。"
  16: "彼[かれ]らは、工事[こうじ]をする者[もの]たちに渡[わた]すために銀[ぎん]を手[て]に委[まか]ねた人[ひと]たちから、その会計[かいけい]を求[もと]めなかった。彼[かれ]らは誠実[せいじつ]に事[こと]を行[おこな]っていたからである。"
  17: "罪[つみ]のための銀[ぎん]と違反[いはん]のための銀[ぎん]は、主[しゅ]の神殿[しんでん]に持[も]ち込[こ]まれたものでも、祭司[さいし]たちのものとなった。"
  18: "そのとき、シリアの王[おう]ハザエルが上[のぼ]って来[き]てガテと戦[たたか]い、それを取[と]った。そしてハザエルはエルサレムへ上[のぼ]ろうと決意[けつい]した。"
  19: "ユダの王[おう]ヨアシュは、父[ちち]たち、すなわちヨシャファト、ヨラム、アハズヤというユダの王[おう]たちが聖別[せいべつ]した聖[せい]なるものすべて、また自分[じぶん]が聖別[せいべつ]したもの、主[しゅ]の神殿[しんでん]と王[おう]の家[いえ]の宝物庫[ほうもつこ]で見[み]つかった金[きん]をすべて取[と]って、シリアの王[おう]ハザエルに送[おく]った。そこでハザエルはエルサレムから去[さ]った。"
  20: "ヨアシュの残[のこ]りの事[こと]ども、彼[かれ]が行[おこな]ったすべてのことは、ユダの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  21: "彼[かれ]のしもべたちは立[た]ち上[あ]がって陰謀[いんぼう]を企[くわだ]て、ヨアシュをガアラにあるミロの家[いえ]で打[う]ち殺[ころ]した。"
  22: "彼[かれ]のしもべたち、すなわちイエムアテの子[こ]ヨザカルとシメルの子[こ]ヨザバドが彼[かれ]を打[う]って殺[ころ]したので、彼[かれ]は死[し]んだ。人々[ひとびと]は彼[かれ]を父[ちち]たちとともにダビデの町[まち]に葬[ほうむ]り、その子[こ]アマツヤが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "Υἱὸς ἐτῶν ἑπτά — «сын семи лет», т. е. семи лет от роду. В слав. этот стих стоит в конце гл. 11 (11:21); в гр — начало гл. 12. ἐν τῷ βασιλεύειν αὐτόν — «когда он воцарился»."
  2: "ἐν ἔτει ἑβδόμῳ τῷ Ιου — «в седьмой год Ииуя». Αβια — Авия (アビア; в слав. «Савиа», в ru «Цивья» — по МТ). Βηρσαβεε — Вирсавия (ベエル・シェバ). Гр 12:2 = слав. 12:1: слав. нумерация гл. 12 сдвинута на один."
  3: "ἐφώτισεν — «просветил» (φωτίζω), т. е. наставлял. πάσας τὰς ἡμέρας ἃς — «во все дни, когда». Гр 12:3 = слав. 12:2."
  4: "ὑψηλά — высоты (高い所, как 3Цар 22:44). οὐ μετεστάθησαν — «не были сняты» (μεθίστημι). ἐθυμίων — «кадили» (θυμιάω), имперфект. Гр 12:4 = слав. 12:3."
  5: "τὸ εἰσοδιαζόμενον — «вносимое» (εἰσοδιάζω, редкий глагол). ἀργύριον συντιμήσεως — «серебро оценки» (τίμησις — оценка; ср. Лев 27). ἀνὴρ ἀργύριον λαβὼν συντιμήσεως — букв. «человек, взявший серебро оценки», т. е. вносимое по оценке. ἀναβῇ ἐπὶ καρδίαν — «взойдёт на сердце», т. е. придёт на ум. Стих не закончен: продолжение в ст. 6. Гр 12:5 = слав. 12:4."
  6: "βεδεκ — передача евр. בֶּדֶק («повреждение, трещина»); слав. «ведек»; переведено «повреждение». ἀνὴρ ἀπὸ τῆς πράσεως — «каждый от продажи своей», из выручки. κρατήσουσιν — «будут держать, укреплять», т. е. чинить. Стих завершает речь, начатую в ст. 5."
  7: "ἐγενήθη ἐν τῷ εἰκοστῷ καὶ τρίτῳ ἔτει τῷ βασιλεῖ — «было в двадцать третий год царю». οὐκ ἐκραταίωσαν — «не укрепили», не починили."
  8: "Τί ὅτι — «почему это» (вопрос с упрёком). ἐκραταιοῦτε — имперфект «вы не укрепляли». μὴ λάβητε — запрет «не берите». δώσετε — «отдадите» (буд. в значении повеления)."
  9: "συνεφώνησαν — «согласились» (συμφωνέω). τοῦ μὴ λαβεῖν… τοῦ μὴ ἐνισχῦσαι — два инфинитива с артиклем: «не брать… и не укреплять». ἐνισχύω — «укреплять», чинить. Смысл: священники слагают с себя и сбор серебра, и самый ремонт."
  10: "κιβωτός — ящик, ковчег (здесь 箱). τρῶγλη — «дыра, отверстие» (τρώγλη); слав. «скважня». σανίς — доска, крышка. ιαμιβιν — передача евр. יָמִין («правая сторона»); гр оборот тёмен («в доме человека дома Господня»), слав. «при олтари одесную входящих мужей» — чтение csl включено в текст по паритету. σταθμός — «дверной косяк, порог» (слав. «дверь»); отсюда 入口を守る."
  11: "γραμματεύς — писец (書記). ὁ ἱερεὺς ὁ μέγας — великий священник, первосвященник (大祭司). ἔσφιγξαν — «стянули, завязали» (σφίγγω), т. е. ссыпали в мешки. ἠρίθμησαν — сочли (ἀριθμέω)."
  12: "τὸ ἑτοιμασθέν — «приготовленное», сосчитанное серебро. ἐπὶ χεῖρας ποιούντων τὰ ἔργα — «в руки делающих работы». ἐπίσκοποι οἴκου κυρίου — надзиратели дома Господня. τέκτονες τῶν ξύλων — плотники (τέκτων). οἰκοδόμοι — строители. Стих не закончен: продолжение в ст. 13."
  13: "τειχισταί — «строители стен» (τειχιστής). λατόμοι τῶν λίθων — каменотёсы (λατόμος). κτῆσασθαι — «приобрести, купить». λίθους λατομητούς — тёсаные камни. κατασχεῖν τὸ βεδεκ — «удержать, исправить повреждение» (κατέχω). ἐξωδιάσθη — «было израсходовано» (ἐξοδιάζω)."
  14: "θύραι ἀργυραῖ — серебряные двери (слав. «двери сребряны»). ἧλοι — гвозди. φιάλαι — чаши (φιάλη). σκεῦος — сосуд. εἰσενεχθέντος — «внесённого». Стих не закончен: продолжение в ст. 15."
  15: "ὅτι — «ибо, потому что». δώσουσιν — «отдадут». ἐκραταίωσαν ἐν αὐτῷ — «укрепили им дом» (κραταιόω), т. е. починили."
  16: "ἐξελογίζοντο — «требовали отчёта» (ἐκλογίζομαι); слав. «сочитаху». ἐν πίστει — «в верности», честно. ποιοῦσιν — наст. вр. «делают»."
  17: "ἀργύριον περὶ ἁμαρτίας — серебро за грех (жертва за грех). περὶ πλημμελείας — за преступление, вину (πλημμέλεια; слав. «преступление»). ὅ τι — «что бы ни». ἐγένετο — «стало», досталось священникам. Гр 12:17 = слав. 12:16."
  18: "προκατελάβετο — «захватил, взял» (προκαταλαμβάνω). ἔταξεν τὸ πρόσωπον — «обратил лицо», т. е. решил (слав. «обрати лице свое»). Γεθ — Геф (ガテ)."
  19: "τὰ ἅγια — святыни, посвящённое. ἡγίασεν — освятил. θησαυροί — сокровищницы (宝物庫). ἀνέβη ἀπὸ Ιερουσαλημ — «отошёл от Иерусалима» (ἀναβαίνω здесь «удалился»; слав. «отиде»)."
  20: "τὰ λοιπὰ τῶν λόγων — «прочее слов». οὐκ ἰδού — «не вот ли». βιβλίον λόγων τῶν ἡμερῶν — летопись (日誌の書)."
  21: "ἔδησαν πάντα σύνδεσμον — букв. «связали всякую связку», т. е. составили заговор (σύνδεσμος — «связка, заговор»); слав. «совещаша всяк совет». Μαλλω τῷ ἐν Γααλλα — «Малло, что в Гаалле» (в ru «дом Милло, на дороге к Силле» — по МТ). Гр 12:21 = слав. 12:20."
  22: "Ιεζιχαρ — Иозакар (ヨザカル), сын Иемуафа; Ιεζεβουθ — Иегозавад (ヨザバド), сын Сомира (Σωμηρ). Гр «ὁ υἱὸς αὐτοῦ Σωμηρ» тёмен; принято по слав. «сын Сомиров». πόλις Δαυιδ — город Давида. Αμεσσιας — Амасия (アマツヤ). Гр 12:22 = слав. 12:21."
