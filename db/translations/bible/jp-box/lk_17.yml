verses:
  1: "イエスは弟子[でし]たちに言[い]われた。「<j>つまずきが来[く]るのを避[さ]けることはできない。しかし、それをもたらす者[もの]は不幸[ふこう]である。</j>"
  2: "<j>この小[ちい]さな者[もの]たちの一人[ひとり]をつまずかせるよりは、大[おお]きな石臼[いしうす]を首[くび]に巻[ま]きつけられて海[うみ]に投[な]げ込[こ]まれたほうが、その人[ひと]にはよかった。</j>"
  3: "<j>自分[じぶん]自身[じしん]に気[き]をつけなさい。もし兄弟[きょうだい]が〔あなたに対[たい]して〕罪[つみ]を犯[おか]したら、その人[ひと]を戒[いまし]めなさい。その人[ひと]が悔[く]い改[あらた]めたら、赦[ゆる]しなさい。</j>"
  4: "<j>たとえ一[いち]日[にち]に七度[ななたび]あなたに対[たい]して罪[つみ]を犯[おか]し、七度[ななたび]あなたのところへ戻[もど]って来[き]て『悔[く]い改[あらた]める』と言[い]っても、その人[ひと]を赦[ゆる]しなさい。</j>」"
  5: "使徒[しと]たちが主[しゅ]に言[い]った。「わたしたちに信仰[しんこう]を増[ま]してください。」"
  6: "主[しゅ]は言[い]われた。「<j>もしあなたがたに、からし種[だね]ほどの信仰[しんこう]があったなら、この桑[くわ]の木[き]に『根[ね]を抜[ぬ]かれて、海[うみ]に植[う]えられよ』と言[い]えば、それはあなたがたに従[したが]ったであろう。</j>"
  7: "<j>あなたがたのうち、畑[はたけ]を耕[たがや]したり羊[ひつじ]を飼[か]ったりする僕[しもべ]を持[も]っている者[もの]が、その僕[しもべ]が畑[はたけ]から帰[かえ]って来[き]たとき、『すぐに来[き]て食卓[しょくたく]に着[つ]け』と言[い]うだろうか。</j>"
  8: "<j>むしろ、こう言[い]うのではないか。『わたしの夕食[ゆうしょく]を用意[ようい]し、帯[おび]を締[し]めて、わたしが食[た]べ、飲[の]んでいる間[あいだ]、仕[つか]えなさい。その後[あと]で、あなたが食[た]べ、飲[の]みなさい』と。</j>"
  9: "<j>その僕[しもべ]が命[めい]じられたとおりにしたからといって、その僕[しもべ]に感謝[かんしゃ]するだろうか。〔そうは思[おも]わない。〕</j>"
  10: "<j>あなたがたも同[おな]じである。命[めい]じられたことをすべて行[おこな]ったときには、『わたしたちは役[やく]に立[た]たない僕[しもべ]です。しなければならなかったことをしただけです』と言[い]いなさい。</j>」"
  11: "イエスはエルサレムへ向[む]かう途中[とちゅう]、サマリアとガリラヤの間[あいだ]を通[とお]られた。"
  12: "ある村[むら]に入[はい]ろうとしておられたとき、十人[じゅうにん]の重[おも]い皮膚病[ひふびょう]の人[ひと]たちがイエスを迎[むか]えた。彼[かれ]らは遠[とお]くに立[た]っていた。"
  13: "彼[かれ]らは声[こえ]を上[あ]げて言[い]った。「イエス、先生[せんせい]、わたしたちを憐[あわ]れんでください。」"
  14: "イエスは彼[かれ]らをご覧[らん]になって言[い]われた。「<j>行[い]って、祭司[さいし]たちに自分[じぶん]の体[からだ]を見[み]せなさい。</j>」そして、彼[かれ]らが行[い]く途中[とちゅう]で、清[きよ]くなった。"
  15: "そのうちの一人[ひとり]は、自分[じぶん]が癒[いや]されたのを見[み]て引[ひ]き返[かえ]し、大[おお]きな声[こえ]で神[かみ]を賛美[さんび]しながら、"
  16: "イエスの足[あし]もとにひれ伏[ふ]して感謝[かんしゃ]した。彼[かれ]はサマリア人[じん]であった。"
  17: "イエスはお答[こた]えになった。「<j>清[きよ]くなった者[もの]は十人[じゅうにん]ではなかったか。残[のこ]りの九人[きゅうにん]はどこにいるのか。</j>"
  18: "<j>神[かみ]に栄光[えいこう]を帰[き]そうと引[ひ]き返[かえ]して来[き]た者[もの]は、この異邦人[いほうじん]のほかには見[み]つからなかったのか。</j>」"
  19: "そして、その人[ひと]に言[い]われた。「<j>立[た]って、行[い]きなさい。あなたの信仰[しんこう]があなたを救[すく]ったのだ。</j>」"
  20: "ファリサイ派[は]の人々[ひとびと]に、神[かみ]の国[くに]はいつ来[く]るのかと問[と]われて、イエスはお答[こた]えになった。「<j>神[かみ]の国[くに]は、目[め]に見[み]える形[かたち]で来[く]るのではない。</j>"
  21: "<j>また、『見[み]よ、ここだ』『あそこだ』と言[い]うこともない。見[み]よ、神[かみ]の国[くに]はあなたがたの内[うち]にあるのだ。</j>」"
  22: "弟子[でし]たちに言[い]われた。「<j>あなたがたが、人[ひと]の子[こ]の日[ひ]のうちの一[ひと]日[にち]でも見[み]たいと願[ねが]う日[ひ]が来[く]る。しかし、見[み]ることはできない。</j>"
  23: "<j>人々[ひとびと]はあなたがたに『見[み]よ、あそこだ』『見[み]よ、ここだ』と言[い]うだろう。しかし、出[で]かけてはならない。追[お]いかけてはならない。</j>"
  24: "<j>稲妻[いなずま]が天[てん]の果[は]てから果[は]てまで閃[ひらめ]いて光[ひか]るように、人[ひと]の子[こ]も〔その日[ひ]には〕そのようになる。</j>"
  25: "<j>しかし、まず、人[ひと]の子[こ]は多[おお]くの苦[くる]しみを受[う]け、この時代[じだい]の人々[ひとびと]から拒[こば]まれなければならない。</j>"
  26: "<j>ノアの日[ひ]に起[お]こったとおりに、人[ひと]の子[こ]の日[ひ]にも起[お]こる。</j>"
  27: "<j>人々[ひとびと]は食[た]べ、飲[の]み、娶[めと]り、嫁[とつ]ぎ、ノアが箱舟[はこぶね]に入[はい]る日[ひ]まで、そうしていた。そして洪水[こうずい]が来[き]て、すべての者[もの]を滅[ほろ]ぼした。</j>"
  28: "<j>ロトの日[ひ]も同[おな]じであった。人々[ひとびと]は食[た]べ、飲[の]み、買[か]い、売[う]り、植[う]え、建[た]てていた。</j>"
  29: "<j>しかし、ロトがソドムから出[で]たその日[ひ]、天[てん]から火[ひ]と硫黄[いおう]が降[ふ]り注[そそ]ぎ、すべての者[もの]を滅[ほろ]ぼした。</j>"
  30: "<j>人[ひと]の子[こ]が現[あらわ]される日[ひ]にも、同[おな]じことが起[お]こる。</j>"
  31: "<j>その日[ひ]、屋根[やね]の上[うえ]にいる者[もの]は、家[いえ]の中[なか]に家財[かざい]があっても、それを取[と]りに下[お]りてはならない。畑[はたけ]にいる者[もの]も、同[おな]じく後[うし]ろへ戻[もど]ってはならない。</j>"
  32: "<j>ロトの妻[つま]を思[おも]い起[おこ]しなさい。</j>"
  33: "<j>自分[じぶん]の命[いのち]を生[い]かそうとする者[もの]は、それを失[うしな]う。それを失[うしな]う者[もの]は、それを生[い]かす。</j>"
  34: "<j>あなたがたに言[い]う。その夜[よ]、二人[ふたり]が一[ひと]つの寝台[しんだい]にいる。一人[ひとり]は取[と]られ、一人[ひとり]は残[のこ]される。</j>"
  35: "<j>女[おんな]が二人[ふたり]、共[とも]に粉[こな]を挽[ひ]いている。一人[ひとり]は取[と]られ、一人[ひとり]は残[のこ]される。</j>"
  36: "〔<j>二人[ふたり]が畑[はたけ]にいる。一人[ひとり]は取[と]られ、一人[ひとり]は残[のこ]される。</j>〕」"
  37: "彼[かれ]らは答[こた]えて言[い]った。「主[しゅ]よ、どこにですか。」イエスは言[い]われた。「<j>死体[したい]のある所[ところ]には、鷲[わし]も集[あつ]まって来[く]る。</j>」"

notes:
  1: "σκάνδαλα — つまずき (как Мк 9:42). ἀνένδεκτον — «невозможно»; 避けることはできない. οὐαί передано 不幸, как в Мф 23."
  3: "εἰς σέ («против тебя») в критическом тексте отсутствует, у jp-joc есть (爾に罪を獲ば); церковное чтение отмечено 〔あなたに対して〕. ἐπιτίμησον — 戒めなさい, юридически «обличи»."
  6: "συκάμινος — тутовое дерево (桑), не смоковница; ср. 19:4 συκομορέα. ἐκριζώθητι — «будь вырвано с корнем»; 根を抜かれて. Сноску на からし種 не ставил: в Мк 4:31 её нет."
  7: "Притча о неблагодарном рабе: вопрос 7 продолжается в 8 (ἀλλ᾽ οὐχὶ ἐρεῖ), поэтому 7 кончается «…と言うだろうか», а 8 начинается «むしろ…»."
  9: "οὐ δοκῶ («не думаю») в критическом тексте отсутствует, в церковном (jp-joc 我之を意はず) есть — 〔そうは思わない〕."
  12: "λέπρα — 重い皮膚病 (как Мк 1:40), без архаичного 癩. δέκα λεπροὶ ἄνδρες — 十人の重い皮膚病の人たち."
  13: "ἐπιστάτα — «наставник»; 先生, как в Лк 5:5."
  14: "καθαρίζω — 清くなる, культовое «очищение», не только «исцеление»; ср. 17:17."
  18: "ἀλλογενής — «иноплеменник»; 異邦人, без сглаживания в «чужестранец»."
  20: "παρατήρησις — «наблюдение, слежение»; 目に見える形. Не сглаживал в «торжественно» или «с приметами»."
  21: "ἐντὸς ὑμῶν двусмысленно: «внутри вас» и «среди вас, в вашей среде». Оставлено 内にある по церковному чтению (jp-joc 衷に在り); двусмысленность в тексте не разъясняется."
  24: "ἐν τῇ ἡμέρᾳ αὐτοῦ в критическом тексте под скобками; Церковь читает — 〔その日には〕."
  25: "ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης — «быть отвергнутым родом сим»; この時代の人々から拒まれる."
  31: "ὃς ἔσται ἐπὶ τοῦ δώματος — «кто будет на кровле»; 屋根の上, без пояснения о плоских кровлях. σκεῦος — 家財."
  34: "κλίνη — 寝台 (не бытовая «постель»)."
  36: "Стих отсутствует в критическом тексте (Byz/TR: «двое на поле»); церковное чтение — весь стих в 〔…〕, как Мк 9:44 и сл."
  37: "ἀετοί — орлы (или грифы); 鷲. τὸ σῶμα — «тело, труп»; 死体."
