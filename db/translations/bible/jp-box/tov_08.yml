verses:
  1: "彼らが夕食[ゆうしょく]を終[お]えると、トビアを彼女[かのじょ]のもとへ連[つ]れて入[い]った。"
  2: "彼は行[い]きながら、ラファエルの言葉[ことば]を思[おも]い出[だ]し、香炉[こうろ]を取[と]って、魚[さかな]の心臓[しんぞう]と肝臓[かんぞう]を置[お]き、煙[けむり]を立[た]てた。"
  3: "悪霊[あくりょう]アスモダイは、そのにおいをかぐと、エジプトの上[かみ]の地方[ちほう]へ逃[に]げ去[さ]り、天使[てんし]が彼を縛[しば]った。"
  4: "二人[ふたり]が共[とも]に閉[と]じ込[こ]められると、トビアは寝床[ねどこ]から起[お]き上[あ]がって言[い]った。「起[お]きなさい、妻[つま]よ、そして祈[いの]ろう。主[しゅ]がわたしたちをあわれんでくださるように。」"
  5: "「わたしたちの父祖[ふそ]の神[かみ]よ、あなたはほめたたえられる方[かた]である。あなたの聖[せい]なる、栄[えい]えある御名[みな]も、とこしえにほめたたえられる。天[てん]も、あなたのすべての造[つく]られたものも、あなたをほめたたえるように。"
  6: "あなたはアダムを造[つく]り、彼に助[たす]け手[て]として、支[ささ]えとなる妻[つま]エバを与[あた]えた。この二人[ふたり]から人[ひと]の種[たね]が生[う]まれた。あなたは言[い]われた。『人[ひと]が独[ひと]りでいるのは良[よ]くない。彼に似[に]た助け手を造ろう。』"
  7: "そして今[いま]、主[しゅ]よ、わたしがこの人[ひと]を妻[つま]とするのは、みだらな行[おこな]いのためではなく、真実[しんじつ]による。わたしをあわれみ、この人[ひと]とともに老[お]いることをお命[めい]じください。」"
  8: "彼女[かのじょ]も彼とともに「アーメン」と言[い]った。"
  9: "二人[ふたり]はその夜[よる]、共[とも]に眠[ねむ]った。"
  10: "ラグエルは起[お]きて行[い]き、墓[はか]を掘[ほ]って言[い]った。「この者[もの]も死[し]んだのではあるまいか。」"
  11: "ラグエルは自分[じぶん]の家[いえ]へ帰[かえ]って来[き]た。"
  12: "そして妻[つま]エドナに言った。「女中[じょちゅう]を一人[ひとり]遣[つか]わして、あの者[もの]が生[い]きているかどうか見[み]させなさい。もし死[し]んでいたら、葬[ほうむ]って、だれにも知[し]られないようにしよう。」"
  13: "女中[じょちゅう]は戸[と]を開[あ]けて入[はい]り、二人[ふたり]が眠[ねむ]っているのを見[み]つけた。"
  14: "そして出[で]て来[き]て、あの者[もの]は生[い]きていると彼らに告[つ]げた。"
  15: "ラグエルは神[かみ]をほめたたえて言った。「神よ、あなたはすべての清[きよ]い、聖[せい]なる祝福[しゅくふく]をもってほめたたえられる方[かた]である。あなたの聖なる者[もの]たちも、あなたのすべての造[つく]られたものも、あなたのすべての天使[てんし]たちも、あなたに選[えら]ばれた者たちも、とこしえにあなたをほめたたえるように。"
  16: "あなたはほめたたえられる方である。あなたはわたしを喜[よろこ]ばせ、わたしの思[おも]っていたようにはならず、あなたの大[おお]きなあわれみに従[したが]って、わたしたちを扱[あつか]ってくださった。"
  17: "あなたはほめたたえられる方である。あなたは、それぞれただ一人[ひとり]の子[こ]である二人[ふたり]をあわれまれた。主[しゅ]よ、彼らにあわれみを行[おこな]い、彼らの一生[いっしょう]を健康[けんこう]のうちに、喜[よろこ]びとあわれみとともに全[まっと]うさせてください。」"
  18: "そして、しもべたちに墓[はか]を埋[う]めさせた。"
  19: "そして彼らのために十四日[じゅうよっか]の婚礼[こんれい]を行[おこな]った。"
  20: "ラグエルは彼に、婚礼[こんれい]の日[ひ]々[び]が終[お]わる前[まえ]に、誓[ちか]いをもって言った。「婚礼の十四日が満[み]ちるまでは、出[で]て行[い]かないように。"
  21: "そして後[のち]に、その財産[ざいさん]の半分[はんぶん]を持[も]って、無事[ぶじ]にあなたの父[ちち]のもとへ行[い]きなさい。残[のこ]りは、わたしと妻[つま]が死[し]んだときにあなたのものになる。」"

notes:
  1: "συνετέλεσαν δειπνοῦντες — окончили ужинать (δειπνέω — ужинать). εἰσήγαγον Τωβιαν πρὸς αὐτήν — ввели Товию к ней (εἰσάγω); подлежащее не названо — слуги. Слав. «введоша товию к ней»."
  2: "ὁ δὲ πορευόμενος — он, идя (идучи). ἐμνήσθη τῶν λόγων Ραφαηλ — вспомнил слова Рафаила (μιμνῄσκομαι). τὴν τέφραν τῶν θυμιαμάτων — пепел курений (τέφρα — пепел; θυμίαμα — фимиам); в тексте слав. «жераток фимиамный» — кадильница (香炉), LXX даёт τέφρα. ἐπέθηκεν τὴν καρδίαν τοῦ ἰχθύος καὶ τὸ ἧπαρ — положил сердце и печень рыбы. ἐκάπνισεν — воскурил, пустил дым (καπνίζω)."
  3: "ὠσφράνθη τὸ δαιμόνιον τῆς ὀσμῆς — демон почуял запах (ὀσφραίνομαι с род. падежом). ἔφυγεν εἰς τὰ ἀνώτατα Αἰγύπτου — убежал в верхние [области] Египта (ἀνώτατος). ἔδησεν αὐτὸ ὁ ἄγγελος — ангел связал его (δέω). В LXX и слав. демон не назван; имя Асмодей известно из 3:8, поэтому в тексте 悪霊アスモダイ."
  4: "συνεκλείσθησαν ἀμφότεροι — оба были заперты (συγκλείω). ἀνέστη ἀπὸ τῆς κλίνης — встал с ложа (κλίνη). Ἀνάστηθι, ἀδελφή — встань, сестра (зват.); ἀδελφή здесь — родственное обращение к жене, по-японски 妻よ (ср. 5:21). προσευξώμεθα — помолимся (προσεύχομαι, гортатив). ἐλεήσῃ — помилует (ἐλεάω)."
  5: "Εὐλογητὸς εἶ — благословен Ты (εὐλογητός). ὁ θεὸς τῶν πατρῶν ἡμῶν — Бог отцов наших. εὐλογητὸν τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον — благословенно имя Твоё святое и славное (ἔνδοξος). εὐλογησάτωσάν σε οἱ οὐρανοὶ καὶ πᾶσαι αἱ κτίσεις σου — да благословят Тебя небеса и все создания Твои (κτίσις). Молитва Товии — 「…」, это Ветхий Завет, красного нет."
  6: "σὺ ἐποίησας Αδαμ — Ты сотворил Адама. βοηθὸν Ευαν στήριγμα τὴν γυναῖκα αὐτοῦ — помощницу Еву, утверждение, жену его (στήριγμα — опора, утверждение): приложение к Ευαν. ἐκ τούτων ἐγενήθη τὸ ἀνθρώπων σπέρμα — от них произошло семя человеческое. σὺ εἶπας — Ты сказал. Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον — нехорошо быть человеку одному (ср. Быт 2:18). ποιήσωμεν αὐτῷ βοηθὸν ὅμοιον αὐτῷ — сотворим ему помощника, подобного ему. Слова Бога внутри молитвы — 『』."
  7: "οὐ διὰ πορνείαν — не ради блуда (πορνεία). ἐπ᾿ ἀληθείας — по истине. ἐπίταξον ἐλεῆσαί με — повели помиловать меня (ἐπιτάσσω). ταύτῃ συγκαταγηρᾶσαι — состариться вместе с ней (συγκαταγηράω). τὴν ἀδελφήν μου ταύτην — «сестру мою сию»: обращение к родственнице-жене, передано この人."
  8: "εἶπεν μετ᾿ αὐτοῦ Αμην — сказала с ним: аминь, т. е. присоединилась к молитве. Слав. «И рече с ним: аминь»; подлежащее — Сарра, в греческом оно не названо."
  9: "ἐκοιμήθησαν ἀμφότεροι τὴν νύκτα — оба спали ночь (κοιμάομαι). Слав. в этом стихе уже начинает 8:10 («И востав рагуил… ископа гроб»): в слав. 8:9 и 8:10 перераспределены; в тексте по LXX."
  10: "ἀναστὰς ἐπορεύθη — встав, пошёл. ὤρυξεν τάφον — выкопал могилу (ὀρύσσω; τάφος). Μὴ καὶ οὗτος ἀποθάνῃ — не умер ли и этот (μή в вопросе выражает опасение). Слав. здесь только «еда и той умре?», а копание могилы — в 8:9."
  11: "ἦλθεν εἰς τὴν οἰκίαν ἑαυτοῦ — пришёл в дом свой. Короткий стих-переход; в слав. совпадает («И прииде рагуил в дом свой»)."
  12: "Ἀπόστειλον μίαν τῶν παιδισκῶν — пошли одну из служанок (παιδίσκη). ἰδέτωσαν εἰ ζῇ — пусть посмотрят, жив ли: 3 л. мн. ч. при одной посланной, согласование по смыслу. εἰ δὲ μή, ἵνα θάψωμεν — если нет, чтобы похоронить (θάπτω). μηδεὶς γνῷ — никто не узнал (γινώσκω, opt. аориста)."
  13: "ἀνοίξασα τὴν θύραν — открыв дверь (ἀνοίγω). εὗρεν τοὺς δύο καθεύδοντας — нашла обоих спящими (καθεύδω, причастие). Слав. «обрете обоих спящих»."
  14: "ἐξελθοῦσα ἀπήγγειλεν — выйдя, возвестила (ἀπαγγέλλω). ὅτι ζῇ — что жив (ζάω). Слав. «яко жив есть»."
  15: "εὐλόγησεν Ραγουηλ τὸν θεόν — благословил Рагуил Бога. ἐν πάσῃ εὐλογίᾳ καθαρᾷ καὶ ἁγίᾳ — всяким благословением чистым и святым (καθαρός, ἅγιος). εὐλογείτωσάν σε οἱ ἅγιοί σου — да благословят Тебя святые Твои. οἱ ἐκλεκτοί σου — избранные Твои (ἐκλεκτός). εἰς πάντας τοὺς αἰῶνας — во все века."
  16: "ηὔφρανάς με — возвеселил меня (εὐφραίνω). οὐκ ἐγένετό μοι καθὼς ὑπενόουν — не случилось со мною так, как я думал (ὑπονοέω). κατὰ τὸ πολὺ ἔλεός σου — по великой милости Твоей (ἔλεος). ἐποίησας μεθ᾿ ἡμῶν — сотворил с нами."
  17: "δύο μονογενεῖς — двух единственных детей (μονογενής): Товия и Сарра — единственные дети у своих родителей. ποίησον αὐτοῖς, δέσποτα, ἔλεος — сотвори им, Владыка, милость (δεσπότης — владыка; в тексте 主). συντέλεσον τὴν ζωὴν αὐτῶν — доверши жизнь их (συντελέω). ἐν ὑγιείᾳ μετὰ εὐφροσύνης καὶ ἐλέους — в здравии с веселием и милостью."
  18: "ἐκέλευσεν τοῖς οἰκέταις — повелел слугам (οἰκέτης). χῶσαι τὸν τάφον — засыпать могилу (χώννυμι). Слав. «повеле же рабом засыпати гроб»."
  19: "ἐποίησεν αὐτοῖς γάμον — сделал им брачный пир (γάμος — свадьба, брачный пир). ἡμερῶν δέκα τεσσάρων — четырнадцати дней (род. меры). Слав. «брак дний четыренадесть»."
  20: "πρὶν ἢ συντελεσθῆναι τὰς ἡμέρας τοῦ γάμου — прежде чем окончатся дни брака. ἐνόρκως — под клятвой (ἔνορκος). μὴ ἐξελθεῖν αὐτόν — чтобы он не выходил: инфинитив в косвенной речи после клятвы. ἐὰν μὴ πληρωθῶσιν αἱ δέκα τέσσαρες ἡμέραι — если не исполнятся четырнадцать дней."
  21: "λαβόντα τὸ ἥμισυ τῶν ὑπαρχόντων αὐτοῦ — взяв половину имущества его (τὰ ὑπάρχοντα — имущество). πορεύεσθαι μετὰ ὑγιείας — идти с миром, в здравии (ὑγίεια). τὰ λοιπά — остальное. ὅταν ἀποθάνω καὶ ἡ γυνή μου — когда умру я и жена моя: эллипсис без сказуемого, по-японски добавлено あなたのものになる."
