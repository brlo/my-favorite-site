# jp-box, Товит, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: брачная ночь. Товия вспоминает слова Рафаила и сожигает сердце и печень
# рыбы (1–2), Асмодей изгнан и связан (3), молитва Товии и Сарры (4–9), Рагуил велит
# копать могилу (10–14), благодарение и благословение Рагуила (15–17), могилу
# засыпают (18), свадебный пир на четырнадцать дней (19–21).
# Молитва Товии и Сарры — 「…」: 5–7; в 8 — её «アーメン» внутри повествования.
# Слова Бога внутри молитвы — 『…』: 6.
# Прямая речь — 「…」: 4, 10, 12, 15, 16, 17, 20, 21. Красного и синего нет.
# Нумерация по gr: 21 стих. Слав. 8:9 вбирает начало 8:10, а 8:10 — только конец
# («еда и той умре?»); в тексте по LXX.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 悪霊, 天使, 婚礼, 祝福 уже в корпусе; имя Асмодей — из 3:8.
# Имена — транслитерация греческого (LXX).

