verses:
  1: "第七[だいしち]の月[つき]になって、王[おう]の血筋[ちすじ]に連[つら]なるエリシャマの子[こ]、ネタニヤの子[こ]イシュマエルが、王[おう]の高官[こうかん]たち、すなわち十人[じゅうにん]の者[もの]とともに、ミツパのゲダルヤのもとへ来[き]て、そこで一緒[いっしょ]にパンを食[た]べた。"
  2: "イシュマエルと彼とともにいた十人[じゅうにん]の者[もの]たちは立[た]ち上[あ]がり、バビロンの王[おう]がその地[ち]の上[うえ]に立[た]てたゲダルヤを剣[つるぎ]で打[う]ち殺[ころ]した。"
  3: "また、彼とともにミツパにいたすべてのユダヤ人[じん]、およびそこにいたすべてのカルデア人[じん]、戦[いくさ]の男[おとこ]たちを、イシュマエルは打[う]ち殺[ころ]した。"
  4: "ゲダルヤを打[う]ち殺[ころ]した翌日[よくじつ]、まだだれも知[し]らなかったとき、"
  5: "シェケム、サレム、サマリアから八十人[はちじゅうにん]の者[もの]が来[き]た。ひげをそり、衣[ころも]を裂[さ]き、体[からだ]を傷[きず]つけ、手[て]に穀物[こくもつ]の供[そな]え物[もの]と乳香[にゅうこう]を持[も]って、主[しゅ]の家[いえ]に携[たずさ]えて行[い]こうとしていた。"
  6: "イシュマエルはミツパから彼[かれ]らを迎[むか]えに出[で]た。彼らは歩[あゆ]みながら泣[な]いていた。イシュマエルは彼らに言[い]った。「ゲダルヤのもとへ入[はい]りなさい。」"
  7: "彼らが町[まち]のただ中[なか]に入[はい]ったとき、イシュマエルと彼とともにいた者[もの]たちは、彼らを殺[ころ]して穴[あな]に投[な]げ入[い]れた。"
  8: "しかし、そこに十人[じゅうにん]の者[もの]が見[み]つかり、イシュマエルに言[い]った。「わたしたちを殺[ころ]さないでください。野[の]に隠[かく]した宝[たから]、小麦[こむぎ]、大麦[おおむぎ]、蜜[みつ]、油[あぶら]があるのです。」そこで彼は思[おも]いとどまり、彼らを兄弟[きょうだい]たちのただ中[なか]で殺[ころ]さなかった。"
  9: "イシュマエルが、自分[じぶん]が打[う]ち殺[ころ]したすべての者[もの]を投[な]げ入[い]れたその穴[あな]は、イスラエルの王[おう]バシャを恐[おそ]れてアサ王[おう]が造[つく]った大[おお]きな穴[あな]である。イシュマエルはこれを殺[ころ]された者[もの]たちで満[み]たした。"
  10: "イシュマエルは、ミツパに残[のこ]されたすべての民[たみ]と、親衛隊[しんえいたい]の長[ちょう]がアヒカムの子[こ]ゲダルヤに任[まか]せた王[おう]の娘[むすめ]たちを捕[と]らえて連[つ]れ去[さ]り、アンモンの子[こ]らの向[む]こう側[がわ]へ行[い]った。"
  11: "カレアの子[こ]ヨハナンと、彼とともにいる軍[ぐん]の長[ちょう]たちはすべて、イシュマエルが行[おこな]ったすべての悪[あく]を聞[き]いた。"
  12: "彼[かれ]らは自分[じぶん]たちの全軍[ぜんぐん]を率[ひき]いて行[い]き、イシュマエルと戦[たたか]おうとして、ギベオンの豊[ゆた]かな水[みず]のほとりで彼を見[み]つけた。"
  13: "イシュマエルとともにいた民[たみ]はみな、カレアの子[こ]ヨハナンと、彼とともにいる軍[ぐん]の長[ちょう]たちを見[み]ると、"
  14: "イシュマエルがミツパから捕[と]らえて行[い]った民[たみ]はみな、引[ひ]き返[かえ]してヨハナンのもとへ行[い]った。"
  15: "イシュマエルは八人[はちにん]の者[もの]とともに逃[のが]れ、アンモンの子[こ]らのもとへ行[い]った。"
  16: "ヨハナンと、彼とともにいる軍[ぐん]の長[ちょう]たちはすべて、イシュマエルから取[と]り戻[もど]した民[たみ]の残[のこ]りの者[もの]たち、すなわち戦[いくさ]に強[つよ]い男[おとこ]たち、女[おんな]たち、その他[た]の者[もの]たち、宦官[かんがん]たちを、ギベオンから連[つ]れ戻[もど]した。"
  17: "彼らは行[い]って、ベツレヘムに近[ちか]いガベロト・ハマアムに住[す]んだ。エジプトへ行[い]って入[はい]るためであった。"
  18: "カルデア人[じん]を恐[おそ]れてのことである。彼らはカルデア人を恐れた。イシュマエルが、バビロンの王[おう]がユダの地[ち]に立[た]てたゲダルヤを打[う]ち殺[ころ]したからである。"

notes:
  1: "τῷ μηνὶ τῷ ἑβδόμῳ — «в седьмой месяц»; Ισμαηλ υἱὸς Ναθανιου υἱοῦ Ελασα — Исмаил, сын Нафании, сына Елисама (в тексте エリシャマ, как 4 Цар 25:25); ἀπὸ γένους τοῦ βασιλέως — «из рода царского» (γένος — род, в тексте 血筋). Слав. добавляет «и вельможи царевы» (王の高官たち) при десяти мужах — нет в LXX (по МТ); по паритету внесено в текст без скобок. ἔφαγον ἐκεῖ ἄρτον ἅμα — «ели там хлеб вместе» (ἅμα — вместе, одновременно)."
  2: "ἀνέστη — «встал»; ἐπάταξαν τὸν Γοδολιαν — «поразили Годолию» (πατάσσω); ὃν κατέστησεν βασιλεὺς Βαβυλῶνος ἐπὶ τῆς γῆς — «которого поставил царь Вавилонский над землёю». Слав. добавляет «мечем, и убиша» (мечом и убили) — нет в LXX; внесено в текст без скобок (剣で打ち殺した). Параллель: 4 Цар 25:25."
  3: "В греч. стих обрывается без сказуемого: «и всех иудеев, которые были с ним в Массифе, и всех халдеев, которые нашлись там». Слав. восполняет сказуемое и добавляет «мужей военных» («и мужей военных изби исмаил») — нет в LXX; по паритету внесено в текст без скобок (戦の男たちを…打ち殺した). Сверх слав. стих не дополнялся."
  4: "ἐγένετο τῇ ἡμέρᾳ τῇ δευτέρᾳ — «было на второй день», в тексте 翌日; πατάξαντος αὐτοῦ τὸν Γοδολιαν — «когда он поразил Годолию» (родительный абсолютный); ἄνθρωπος οὐκ ἔγνω — «и человек не узнал», т. е. никто ещё не знал. Стих обрывается без точки, продолжение — 5; деление по gr."
  5: "ἤλθοσαν ἄνδρες ἀπὸ Συχεμ καὶ ἀπὸ Σαλημ καὶ ἀπὸ Σαμαρείας — «пришли мужи из Сихема, и из Салима, и из Самарии»: Συχεμ — シェケム, Σαλημ — サレム (у LXX так; по МТ здесь Силом, ср. Σηλωμ в 33:6 — シロ; держим греч. форму), Σαμαρεια — サマリア. ὀγδοήκοντα ἄνδρες — «восемьдесят мужей». ἐξυρημένοι πώγωνας — «обрившие бороды» (ξυράω — брить); διερρηγμένοι τὰ ἱμάτια — «разодравшие одежды» (διαρρήγνυμι); κοπτόμενοι — «бичующие себя», в знак плача (в тексте 体を傷つけ). μαναα καὶ λίβανος — «дар (хлебный) и ливан (фимиам)»: μαναα — евр. מִנְחָה, хлебный дар, в тексте 穀物の供え物; λίβανος — 乳香. εἰσενεγκεῖν εἰς οἶκον κυρίου — «внести в дом Господень»."
  6: "ἐξῆλθεν εἰς ἀπάντησιν αὐτοῖς Ισμαηλ — «вышел навстречу им Исмаил»; слав. добавляет «от массифы» (из Массифы) — нет в LXX; внесено в текст без скобок (ミツパから). αὐτοὶ ἐπορεύοντο καὶ ἔκλαιον — «они шли и плакали»; Εἰσέλθετε πρὸς Γοδολιαν — «войдите к Годолии»: речь Исмаила — 「…」, одна фраза."
  7: "εἰσελθόντων αὐτῶν εἰς τὸ μέσον τῆς πόλεως — «когда они вошли в середину города» (родительный абсолютный); ἔσφαξεν αὐτοὺς εἰς τὸ φρέαρ — «заклал их в ров (колодец)» (σφάζω — закалать; φρέαρ — колодец, яма, в тексте 穴). Слав. добавляет «той и мужие, иже беша с ним» (он и мужи, бывшие с ним) — нет в LXX; внесено в текст без скобок."
  8: "θησαυροὶ ἐν ἀγρῷ — «сокровища в поле», т. е. спрятанные запасы (в тексте 野に隠した宝); πυροὶ καὶ κριθαί — «пшеница и ячмень»; μέλι καὶ ἔλαιον — «мёд и масло». παρῆλθεν — «прошёл мимо», т. е. удержался, не тронул; οὐκ ἀνεῖλεν αὐτοὺς ἐν μέσῳ τῶν ἀδελφῶν αὐτῶν — «не умертвил их среди братьев их» (ἀναιρέω — убивать, устранять). Прямая речь — 「…」, закрывается внутри стиха."
  9: "τὸ φρέαρ, εἰς ὃ ἔρριψεν... πάντας οὓς ἐπάταξεν — «ров, в который бросил… всех, кого поразил»; φρέαρ μέγα — «ров великий» (в тексте 大きな穴); ὃ ἐποίησεν ὁ βασιλεὺς Ασα ἀπὸ προσώπου Βαασα βασιλέως Ισραηλ — «который сделал царь Аса из-за лица Ваасы, царя Израилева», т. е. опасаясь Ваасы (3 Цар 15:22); Ἀσά — アサ王, Βαασά — バシャ (по корпусу). τοῦτο ἐνέπλησεν Ισμαηλ τραυματιῶν — «это наполнил Исмаил убитыми» (τραυματίας — раненый, убитый)."
  10: "ἀπέστρεψεν — «обратил, увёл»; πάντα τὸν λαὸν τὸν καταλειφθέντα εἰς Μασσηφα — «весь народ, оставшийся в Массифе»; τὰς θυγατέρας τοῦ βασιλέως — «дочерей царя»; ἃς παρεκατέθετο ὁ ἀρχιμάγειρος τῷ Γοδολια — «которых поручил начальник телохранителей Годолии»; ᾤχετο εἰς τὸ πέραν υἱῶν Αμμων — «ушёл за [реку] к сынам Аммоновым» (πέραν — по ту сторону). Слав. добавляет «и взя их исмаил сын нафань» — нет в LXX; внесено в текст без скобок (捕らえて連れ去り)."
  11: "πάντα τὰ κακά, ἃ ἐποίησεν Ισμαηλ — «всё зло, которое сделал Исмаил». Слав. «и слыша иоанан… вся злая, яже сотвори исмаил»; в тексте すべての悪. Стих — начало рассказа о погоне, продолжение в 12."
  12: "ἤγαγον ἅπαν τὸ στρατόπεδον αὐτῶν — «привели весь стан (войско) свой» (στρατόπεδον — лагерь, войско; в тексте 全軍); ᾤχοντο πολεμεῖν αὐτόν — «пошли воевать с ним»; ἐπὶ ὕδατος πολλοῦ ἐν Γαβαων — «при воде многой (обильной) в Гаваоне» (Γαβαων — ギベオン, ср. 2 Цар 2:13)."
  13: "ὅτε εἶδον πᾶς ὁ λαὸς ὁ μετὰ Ισμαηλ — «когда увидел весь народ, который с Исмаилом» (нарушение согласования в греч.: πᾶς… εἶδον — сохранено как простое «みな…見ると»); τοὺς ἡγεμόνας τῆς δυνάμεως τῆς μετ᾿ αὐτοῦ — «вождей силы, которые с ним». Стих обрывается, продолжение — 14."
  14: "καὶ ἀνέστρεψαν πρὸς Ιωαναν — «и обратились к Иоахану»: в греч. стих очень короткий. Слав. распространяет: «и возвратишася вси людие, ихже плени исмаил от массифы, и возвратившеся отидоша ко иоанну сыну кариеву» — по паритету внесено в текст без скобок (イシュマエルがミツパから捕らえて行った民はみな…)."
  15: "ἐσώθη σὺν ὀκτὼ ἀνθρώποις — «спасся с восемью человеками» (σῴζω — спасать; ἐν τῷ σωθῆναι — спастись бегством); ᾤχετο πρὸς τοὺς υἱοὺς Αμμων — «ушёл к сынам Аммоновым». Слав. «уцеле со осмию мужи»."
  16: "πάντας τοὺς καταλοίπους τοῦ λαοῦ — «всех остатков (остаток) народа» (κατάλοιπος — остальной); οὕς ἀπέστρεψεν ἀπὸ Ισμαηλ — «которых он возвратил от Исмаила»; δυνατοὺς ἄνδρας ἐν πολέμῳ — «мужей сильных в войне»; καὶ τὰς γυναῖκας καὶ τὰ λοιπὰ καὶ τοὺς εὐνούχους — «и жён, и прочее, и евнухов» (εὐνοῦχος — 宦官); οὓς ἀπέστρεψεν ἀπὸ Γαβαων — «которых он возвратил от Гаваона»."
  17: "ᾤχοντο καὶ ἐκάθισαν ἐν Γαβηρωθ — χαμααμ — «пошли и сели в Гавироф-Хамааме»: в byz текст разделён тире на «Γαβηρωθ» и «χαμααμ», у swete одним словом Γαβηρωχαμάα; слав. «на земли вирофоамли» (в земле Вирофоамля); по МТ — Герут-Кимхам. В тексте ガベロト・ハマアム — новое имя, транслитерация byz. τὴν πρὸς Βηθλεεμ — «который при Вифлееме» (Βηθλεεμ — ベツレヘム); τοῦ πορευθῆναι εἰσελθεῖν εἰς Αἴγυπτον — «чтобы пойти войти в Египет». Слав. добавляет здесь «от лица халдейска, понеже убояшася от лица их» — в LXX эти слова стоят в 18; деление держим по gr, отмечено."
  18: "ἀπὸ προσώπου τῶν Χαλδαίων — «от лица халдеев»; ὅτι ἐφοβήθησαν ἀπὸ προσώπου αὐτῶν — «ибо они убоялись лица их»; ὅτι ἐπάταξεν Ισμαηλ τὸν Γοδολιαν — «ибо поразил Исмаил Годолию»; ὃν κατέστησεν βασιλεὺς Βαβυλῶνος ἐν τῇ γῇ — «которого поставил царь Вавилонский в земле»; слав. добавляет «иудине» (ユダの地) — нет в LXX; внесено в текст без скобок. Повтор «страх перед халдеями» (ἀπὸ προσώπου… ἀπὸ προσώπου) в греч. двойной — сохранён."
