# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 48 = слав./ru 41: Исмаил. План: 1 седьмой месяц, Исмаил с десятью приходит
# к Годолии в Массифу, едят хлеб; 2–3 убийство Годолии и всех бывших с ним иудеев
# и халдеев; 4 второй день, никто не знает; 5 восемьдесят человек из Сихема, Салима
# и Самарии с дарами идут в дом Господень; 6 Исмаил выходит навстречу; 7 убивает их
# у рва; 8 десять человек спасаются, обещав запасы; 9 ров царя Асы; 10 Исмаил уводит
# остаток народа и дочерей царя к сынам Аммона; 11 Иоханан слышит; 12 погоня, настигают
# при водах Гаваона; 13–14 народ переходит к Иоханану; 15 Исмаил бежит с восемью;
# 16 Иоханан собирает остаток; 17 идут в Гавироф-Хамаам близ Вифлеема; 18 страх
# перед халдеями.
# Голоса: 1–5, 7, 9–18 — авторский текст; 6 — 「…」 (слова Исмаила, одна фраза);
# 8 — 「…」 (слова десяти человек) и авторское «и прошёл мимо…» вне кавычек.
# Нумерация: gr 18 стихов = слав. 41:1–18, номер в номер; «точек» в этой главе нет.
# Деление в 17–18 иное, чем в слав.: «от лица халдейска» у слав. — в 17, в LXX — в 18;
# держим gr, отмечено в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 乳香, 小麦, 大麦, 宦官, 親衛隊 уже в корпусе; サレム,
# タナエメト, オフェ, ベリサ, ガベロト・ハマアム — новые имена, оговорены в notes.
# Имена — транслитерация греческого (LXX): イシュマエル, ネタニヤ, エリシャマ,
# ゲダルヤ, ヨハナン, ミツパ (Μασσηφα), シェケム, サレム (Σαλημ), サマリア,
# アサ (Ασα), バシャ (Βαασα), ギベオン (Γαβαων), ベツレヘム, アンモン, カルデア人.

