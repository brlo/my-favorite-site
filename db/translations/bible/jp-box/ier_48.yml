verses:
  1: "モアブについて。全能者[ぜんのうしゃ]なる主[しゅ]、イスラエルの神[かみ]はこう言[い]われた。「ああ、ネボは滅[ほろ]びた。キリアタイムは取[と]られ、アマトは辱[はずかし]められて打[う]ち負[ま]かされた。"
  2: "モアブにはもはや癒[いや]しがない。エセボンには喜[よろこ]びもない。人[ひと]々[びと]はモアブに逆[さから]って悪[あく]を企[たくら]み、『さあ、これを諸[しょ]民[みん]から断[た]ち滅[ほろ]ぼそう』と言[い]った。それゆえ、おまえは黙[だま]り込[こ]む。剣[つるぎ]がおまえの後[うし]ろを進[すす]む。"
  3: "オロナイムから叫[さけ]ぶ声[こえ]がする。滅[ほろ]びと大[おお]きな破[は]壊[かい]である。"
  4: "モアブは砕[くだ]かれた。その幼[おさな]い者[もの]たちの叫[さけ]びを告[つ]げよ。"
  5: "アラオトは泣[な]き声[ごえ]で満[み]ちた。オロナイムの道[みち]を泣きながら上[のぼ]って行[ゆ]く。敵[てき]よ、砕[くだ]かれる叫[さけ]びを聞[き]け。"
  6: "逃[に]げよ。自分[じぶん]の命[いのち]を救[すく]え。あなたがたは荒野[こうや]の野[の]ろばのようになれ。"
  7: "おまえは自分[じぶん]の城[しろ]に、自分の宝[たから]に望[のぞ]みを置[お]いていた。それゆえ、おまえも捕[と]らえられる。ハモスは捕[と]らわれの民[たみ]となって出[で]て行[ゆ]き、その祭司[さいし]たちも、その君[きみ]たちも共[とも]に行く。"
  8: "滅[ほろ]ぼす者[もの]がすべての町[まち]に来[く]る。どの町も救[すく]われない。谷[たに]は滅[ほろ]び、平野[へいや]は断[た]ち滅ぼされる。主[しゅ]が言[い]われたとおりである。"
  9: "モアブにしるしを立[た]てよ。それは火[ひ]が付[つ]けられて燃[も]え上[あ]がるからである。そのすべての町[まち]は、人[ひと]の住[す]まない所[ところ]となる。だれがそこに住[す]む者[もの]となるのか。"
  10: "主[しゅ]の業[わざ]を怠[おこた]りに行[おこな]う者[もの]は呪[のろ]われる。自分[じぶん]の剣[つるぎ]を血[ち]から引[ひ]き止[と]める者も呪われる。"
  11: "モアブは若[わか]い時[とき]から安[やす]らかにして、自分[じぶん]の栄[えい]光[こう]に望[のぞ]みを置[お]いていた。器[うつわ]から器へと注[そそ]がれることもなく、捕[と]らわれの民[たみ]となって行[ゆ]くこともなかった。それゆえ、その味[あじ]はその中[なか]に残[のこ]り、その香[かお]りも変[か]わらなかった。"
  12: "それゆえ、見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。わたしは彼のもとへ、器[うつわ]を傾[かたむ]ける者[もの]たちを遣[つか]わす。彼らは彼を傾[かたむ]け、その器[うつわ]を空[あ]らにし、その角[つの]を打[う]ち砕[くだ]く。"
  13: "モアブはハモスによって恥[はじ]を見[み]る。イスラエルの家[いえ]が、自分[じぶん]たちが望[のぞ]みを置[お]いていたベテルによって恥を見たように。"
  14: "どうして、あなたがたは『われわれは強[つよ]い。戦[いくさ]に強[つよ]い男[おとこ]だ』と言[い]えるのか。"
  15: "モアブは滅[ほろ]び、その町[まち]も滅びた。その選[えら]ばれた若者[わかもの]たちは屠[ほふ]り場[ば]へ下[くだ]って行[い]った、と王[おう]、その名[な]を全能者[ぜんのうしゃ]なる主[しゅ]という方[かた]は言[い]われる。"
  16: "モアブの日[ひ]は近[ちか]い。その災[わざわ]いは速[すみ]やかに来[く]る。"
  17: "彼[かれ]の周[まわ]りのすべての者[もの]よ、その名[な]を知[し]るすべての者よ、彼を慰[なぐさ]めよ。そして言[い]え。『どうして、力[ちから]ある杖[つえ]が、輝[かがや]かしい杖が砕[くだ]かれたのか』と。"
  18: "栄[えい]光[こう]から下[お]りて、湿[しめ]りの中[なか]に座[すわ]れ。ダイボンに住[す]む娘[むすめ]よ。モアブは滅[ほろ]びた。滅[ほろ]ぼす者[もの]がおまえのところへ上[のぼ]り、おまえの城[しろ]を壊[こわ]すからである。"
  19: "道[みち]に立[た]って見[み]よ。アロエルに住[す]む者[もの]よ。逃[に]げる者[もの]、逃[のが]れ出[で]る者[もの]に問[と]え。『何[なに]が起[お]こったのか』と。"
  20: "モアブは恥[はじ]を見[み]た。砕[くだ]かれたからである。泣[な]き叫[さけ]べ。アルノンで告[つ]げよ。モアブは滅[ほろ]びた、と。"
  21: "裁[さば]きはミソルの地[ち]に来[く]る。ハイロン、ヤッサ、モファトに、"
  22: "ダイボン、ネボ、ベト・デブラタイムに、"
  23: "キリアタイム、ベト・ガモル、ベト・マオンに、"
  24: "カリオト、ボソル、またモアブのすべての町[まち]、遠[とお]いものも近[ちか]いものも。"
  25: "モアブの角[つの]は切[き]られ、その腕[うで]は砕[くだ]かれた、と主[しゅ]は言[い]われる。"
  26: "彼を酔[よ]わせよ。彼は主[しゅ]に逆[さから]って大[おお]きくなったからである。モアブは自分[じぶん]の手[て]を突[つ]いて倒[たお]れ、自分も笑[わら]い者[もの]となる。"
  27: "イスラエルはおまえにとって笑[わら]い者[もの]であったのか。彼が盗[ぬす]みの中[なか]で見[み]つかったからといって、おまえは彼と戦[たたか]ったのか。おまえはほかへ移[うつ]される。"
  28: "モアブに住[す]む者[もの]たちよ、町々[まちまち]を捨[す]てて岩[いわ]の上[うえ]に住[す]め。穴[あな]の口[くち]の岩の間[あいだ]に巣[す]を作[つく]る鳩[はと]のようになれ。"
  29: "わたしはモアブの高慢[こうまん]を聞[き]いた。それは甚[はなは]だしい。その高慢と誇[ほこ]り、その心[こころ]の高[たか]ぶりを。"
  30: "しかし、わたしは彼の業[わざ]を知[し]っている、と主[しゅ]は言[い]われる。その誇[ほこ]りは十[じゅう]分[ぶん]ではない。彼はそのようにはしなかった。"
  31: "それゆえ、至[いた]る所[ところ]でモアブの上[うえ]に泣[な]き叫[さけ]べ。乾[かわ]ききったキラダスの男[おとこ]たちの上に叫[さけ]べ。"
  32: "ヤゼルの泣[な]きをもって、わたしはおまえのために泣[な]こう。セベマのぶどうの木[き]よ。おまえの枝[えだ]は海[うみ]を越[こ]え、ヤゼルに達[たっ]した。おまえの果[か]実[じつ]の取[と]り入[い]れに、ぶどうの収穫[しゅうかく]に、滅[ほろ]ぼす者[もの]が襲[おそ]いかかった。"
  33: "モアブの地[ち]から喜[よろこ]びと楽[たの]しみは取[と]り去[さ]られた。おまえの酒[さか]ぶねにはぶどう酒[ぶどうしゅ]があった。朝[あさ]にも夕[ゆう]べにも、だれも踏[ふ]まなかった。ぶどう踏[ふ]みの歌[うた]もなかった。"
  34: "エセボンの叫[さけ]びからエレアレにまで、その町々[まちまち]は声[こえ]を上[あ]げた。ゾゴルからオロナイムにまで、アグラトにまで。三歳[さんさい]の雌[めす]の若[わか]牛[うし]も。ネブリムの水[みず]さえ焼[や]き尽[つ]くされるからである。"
  35: "わたしはモアブを滅[ほろ]ぼす、と主[しゅ]は言[い]われる。高[たか]い所[ところ]に上[のぼ]って自分の神々[かみがみ]に香[こう]をたこうとする者[もの]を。"
  36: "それゆえ、わたしの心[こころ]はモアブのために笛[ふえ]のように鳴[な]り響[ひび]く。わたしの心はキラダスの男[おとこ]たちのために笛のように鳴り響く。それゆえ、彼が蓄[たくわ]えたものは消[き]え失[う]せた。人[ひと]の間[あいだ]から。"
  37: "すべての頭[あたま]は、どこの場所[ばしょ]でも剃[そ]られ、すべての鬚[ひげ]は剃られ、すべての手[て]は切[き]り刻[きざ]まれ、すべての腰[こし]には粗布[あらぬの]が着[つ]けられる。"
  38: "モアブのすべての屋根[やね]の上[うえ]にも、その広[ひろ]い通[とお]りにも、泣[な]き声[ごえ]がある。わたしはモアブを、だれも用[もち]いない器[うつわ]のように砕[くだ]いたからである、と主[しゅ]は言[い]われる。"
  39: "どうして、彼は変[か]わったのか。モアブはどうして背[せ]を向[む]けたのか。モアブは恥[はじ]を見[み]て、その周[まわ]りのすべての者[もの]の笑[わら]い者[もの]、憎[にく]まれ者[もの]となった。"
  40: "主[しゅ]はこう言[い]われた。まことに、鷲[わし]のように彼は飛[と]び、モアブの上[うえ]に翼[つばさ]を広[ひろ]げる。"
  41: "カリオトは取[と]られ、その要塞[ようさい]も取[と]られた。その日[ひ]、モアブの強[つよ]い者[もの]たちの心[こころ]は、産[う]みの苦[くる]しみの中[なか]の女[おんな]の心のようになる。"
  42: "モアブは民[たみ]の中[なか]から滅[ほろ]びる。主[しゅ]に逆[さから]って大[おお]きくなったからである。"
  43: "恐怖[きょうふ]と落[お]とし穴[あな]と罠[わな]がおまえの上[うえ]にある。モアブに住[す]む者[もの]よ、と主[しゅ]は言[い]われる。"
  44: "恐怖[きょうふ]の前[まえ]から逃[に]げる者[もの]は落[お]とし穴[あな]に落[お]ち、落とし穴から上[あ]がる者[もの]は罠[わな]にかかる。わたしがこれらのことを、その訪[おとず]れの年[とし]にモアブに臨[のぞ]ませるからである、と主[しゅ]は言[い]われる。"
  45: "エセボンの陰[かげ]に、力[ちから]を失[うしな]った逃[に]げる者[もの]たちが立[た]ち止[と]まった。火[ひ]がエセボンから出[で]て、シオンの中[なか]から炎[ほのお]が上[のぼ]り、モアブの側[そば]と、騒[さわ]ぎの子[こ]らたちの頭[いただき]を焼[や]いた。"
  46: "ああ、モアブよ。ハモスの民[たみ]は滅びた。おまえの息子[むすこ]たちも娘[むすめ]たちも捕[と]らわれの身[み]となったからである。"
  47: "しかし、わたしは終[お]わりの日[ひ]にモアブの捕[と]らわれを帰[かえ]す、と主[しゅ]は言[い]われる。」ここまでがモアブへの裁[さば]きである。"

notes:
  1: "Τῇ Μωαβ — надписание «О Моаве»: в слав. влито в формулу («О моаве тако рече Господь вседержитель, Бог израилев»), в тексте вынесено в начало. Οὐαὶ ἐπὶ Ναβαυ — «горе Нево» (Ναβαυ — город, не гора; слав. «нававу»). ὤλετο — погиб (ἀπόλλυμι); ἐλήμφθη — взят; ᾐσχύνθη — посрамлён; ἡττήθη — побеждён (ἡττάομαι). Слав. в конце «посрамися масигафъ» — иное имя на месте греч. Αμαθ (слав. идёт за МТ «Мизгав»); в тексте Амат."
  2: "οὐκ ἔστιν ἔτι ἰατρεία Μωαβ — «нет уже врачевания Моаву» (ἰατρεία — лечение, исцеление); слав. «несть ктому целение в моаве». ἀγαυρίαμα — «веселие, ликование» (редкое слово, точное значение спорно); слав. «веселие во есевоне». ἐκόψαμεν — аорист 1-го л. мн. ч. «мы отсекли», т. е. в LXX сбой лица; слав. читает как речь заговорщиков «приидите и потребим я от язык», по ней и переведено. Слова заговорщиков — 『…』. παῦσιν παύσεται — «молчанием замолкнет» (усиление); ὄπισθεν σου βαδιεῖται μάχαιρα — «за тобою пойдёт меч»."
  3: "φωνὴ κεκραγότων ἐξ Ωρωναιμ — «голос вопиющих от Оронаима»; ὄλεθρος — погибель; σύντριμμα μέγα — «сокрушение великое» (σύντριμμα — слом, разрушение). Слав. «глас вопля от оронаима, погубление и сотрение велико»."
  4: "Συνετρίβη Μωαβ — «сокрушён Моав»; ἀναγγείλατε εἰς Ζογορα — «возвестите в Сигор» (греч. имя места). Слав. «возвестите вопль малых его» — идёт за МТ («вопль подняли дети его»), поэтому в тексте по-церковнославянски: «его малых». Разница отмечена; имя Сигор в стихе не сохранено."
  5: "ἐπλήσθη Αλαωθ ἐν κλαυθμῷ — «исполнился Алаоф плача» (Αλαωθ — город). ἀναβήσεται κλαίων ἐν ὁδῷ Ωρωναιμ — «взойдёт плача путём Оронаима»: восхождение на Лухит, о котором говорит ru, в LXX нет. κραυγὴν συντρίμματος ἠκούσατε — «вопль сокрушения вы услышали». Слав. добавляет обращение «врази» («врази, вопль сотрения слышасте») — нет в LXX, внесено в текст без скобок (敵よ)."
  6: "Φεύγετε καὶ σώσατε τὰς ψυχὰς ὑμῶν — «бегите и спасайте души ваши» (ψυχή здесь — жизнь); ἔσεσθε ὥσπερ ὄνος ἄγριος ἐν ἐρήμῳ — «будете как дикий осёл в пустыне». Слав. «осел дивий»; ru «как обнажённое дерево» — масоретское чтение, не внесено."
  7: "ἐπεποίθεις ἐν ὀχυρώμασίν σου — «ты надеялся на крепости твои»; συλλημφθήσῃ — «будешь взят» (συλλαμβάνω). ἐξελεύσεται Χαμως ἐν ἀποικίᾳ — «выйдет Хамос в переселение»: идол Моава идёт в плен вместе с народом (ἀποικία — переселение, плен). Слав. добавляет «и в сокровищих твоих» — нет в LXX, внесено в текст без скобок (自分の宝に)."
  8: "ἥξει ὄλεθρος ἐπὶ πᾶσαν πόλιν — «придёт погибель на всякий город»; слав. «приидет губитель» (лицо вместо отвлечённого слова), по ней и переведено. ἀπολεῖται ὁ αὐλών — «погибнет долина» (αὐλών — ущелье, лощина); ἐξολεθρευθήσεται ἡ πεδινή — «истребится равнина» (πεδινή — низменность). καὶ πόλις οὐ μὴ σωθῇ — «и город не спасётся»."
  9: "δότε σημεῖα τῇ Μωαβ — «дайте знаки Моаву» (σημεῖον — знак, сигнал; вероятно, сигнальные огни или знаки бедствия); слав. «дайте знамение моаву». ἁφῇ ἀναφθήσεται — «от прикосновения возгорится» (ἁφή — прикосновение; ἀνάπτω — зажигать); слав. «прикосновением прикосновен будет» — буквально, по смыслу «будет зажжён». εἰς ἄβατον — «в непроходимое», т. е. безлюдное; πόθεν ἔνοικος αὐτῇ; — «откуда житель ей?» (риторический вопрос), у слав. нет."
  10: "ἐπικατάρατος ὁ ποιῶν τὰ ἔργα κυρίου ἀμελῶς — «проклят делающий дела Господни с небрежением» (ἀμελῶς — нерадиво); слав. «с небрежением». ἐξαίρων μάχαιραν αὐτοῦ ἀφ' αἵματος — букв. «поднимающий меч свой от крови» (ἐξαίρω — поднимать, изымать); слав. понял как «возбраняяй мечу своему от крове» — удерживающий меч от крови, по нему и переведено. Стих о том, что исполняющий суд Божий не должен щадить."
  11: "ἀνεπαύσατο Μωαβ ἐκ παιδαρίου — «почил Моав от отрочества» (παιδάριον — мальчик, отрок); слав. «почиваше моав от младости своея». οὐκ ἐνέχεεν ἐξ ἀγγείου εἰς ἀγγεῖον — «не переливал из сосуда в сосуд» (ἐγχέω — наливать): вино, не перелитое с осадка, сохраняет вкус; образ долгого покоя без плена. ἀποικισμός — переселение. ἔστη γεῦμα αὐτοῦ ἐν αὐτῷ — «остался вкус его в нём»; ὀσμὴ αὐτοῦ οὐκ ἐξέλιπεν — «запах его не исчез» (ἐκλείπω)."
  12: "ἡμέραι ἔρχονται — «дни приходят»; ἀποστελῶ αὐτῷ κλίνοντας — «пошлю ему наклоняющих» (κλίνω — наклонять, переливать): те, кто перельёт Моав, как вино с осадка; слав. «преселители» (переселенцы) — иное понимание. λεπτυνοῦσιν — «истощат, опустошат» (λεπτύνω — делать тонким); τὰ κέρατα αὐτοῦ συγκόψουσιν — «рога его сокрушат» (κέρας — рог, символ силы)."
  13: "καταισχυνθήσεται Μωαβ ἀπὸ Χαμως — «посрамится Моав от Хамоса»: идол не спасёт, как Вефиль не спас Израиль (ср. 3 Цар 12:28–29). ὥσπερ κατῃσχύνθη οἶκος Ισραηλ ἀπὸ Βαιθηλ — «как посрамлён дом Израилев от Вефиля». ἐλπίδος αὐτῶν πεποιθότες ἐπ' αὐτοῖς — «надежда их, на которую они полагались» (родительный при ἀπό); слав. «в немже имяху надежду»."
  14: "πῶς ἐρεῖτε — «как вы говорите?»: слова самого Моава даны вложенной речью 『…』. Ἰσχυροί ἐσμεν — «мы сильны»; ἄνθρωπος ἰσχύων εἰς τὰ πολεμικά — «человек, сильный в войне» (πολεμικά — военное дело). Слав. «сильни есмы и мужие крепцы во бранех»."
  15: "ὤλετο Μωαβ πόλις αὐτοῦ — «погиб Моав, город его» (в греч. сбой согласования); ἐκλεκτοὶ νεανίσκοι — «избранные юноши»; κατέβησαν εἰς σφαγήν — «сошли на заклание» (σφαγή — бойня, заклание). Слав. добавляет в конце «глаголет Царь, Господь вседержитель имя его» — нет в LXX, внесено в текст без скобок (王、その名を全能者なる主という方は言われる)."
  16: "ἐγγὺς ἡμέρα Μωαβ ἐλθεῖν — «близок день Моава, чтобы прийти»; πονηρία αὐτοῦ ταχεῖα σφόδρα — «злоба (бедствие) его весьма скора». Слав. «близ день моавль, еже приити, и зло его скоро зело»."
  17: "κινήσατε αὐτῷ — букв. «двиньте ему» (κινέω — двигать; вероятно, «покачайте [головой] о нём», жест соболезнования); слав. «утешайте его» — по нему и переведено, разница отмечена. πάντες εἰδότες ὄνομα αὐτοῦ — «все знающие имя его». βακτηρία εὐκλεής — «жезл славный» (βακτηρία — посох, палка); ῥάβδος μεγαλώματος — «жезл величия» (ῥάβδος — жезл, лоза). Два синонима переданы двумя «杖» с разными определениями; слова, которые велят сказать, — 『…』."
  18: "κατάβηθι ἀπὸ δόξης — «сойди с славы»; κάθισον ἐν ὑγρασίᾳ — «сядь во влаге» (ὑγρασία — влажность, сырость; слав. «во влаге», ru «в жажде» — масоретское чтение, не внесено). καθημένη Δαιβων — «сидящая [в] Дивоне»; слав. «дщи дивоня» — добавление «дщи» (дочь), в тексте ダイボンに住む娘. ἐκτρίβητε — «истёрты будьте»; ἀνέβη εἰς σὲ λυμαινόμενος ὀχύρωμά σου — «взошёл на тебя губящий крепость твою» (λυμαίνομαι — разорять)."
  19: "ἐφ' ὁδοῦ στῆθι καὶ ἔπιδε — «на дороге стань и смотри» (ἐφοράω); καθημένη ἐν Αροηρ — «сидящая в Ароере». ἐρώτησον φεύγοντα καὶ σῳζόμενον — «спроси бегущего и спасающегося»; вопрос дан вложенной речью 『…』. Слав. «что се бысть?»."
  20: "κατῃσχύνθη Μωαβ, ὅτι συνετρίβη — «посрамлён Моав, ибо сокрушён»; ὀλόλυξον καὶ κέκραξον — «возопи, закричи» (ὀλολύζω — вопить, рыдать); в слав. мн. ч. «рыдайте и вопийте» — число изменено, в тексте по греч. ед. ч. ἀνάγγειλον ἐν Αρνων — «возвести в Арноне» (город/река)."
  21: "κρίσις ἔρχεται εἰς γῆν τοῦ Μισωρ — «суд идёт на землю Мишор» (Μισωρ — «равнина», заиорданское плато); слав. «на землю напольную». Далее перечень городов: Χαιλων (слав. «хелон»), Ιασσα (слав. ошибочно «рефас»), Μωφαθ. Перечень в греч. — одно предложение, растянутое до 24-го стиха; в тексте каждый стих кончается запятой, точка — в 24."
  22: "Δαιβων, Ναβαυ, οἶκος Δεβλαθαιμ — Дивон, Нево, «дом Деблафаима» (слав. «девон… наво… дом девлафаим»). Оборот οἶκος + имя («дом такого-то») передан как ベト・…, как принято для составных топонимов."
  23: "Καριαθαιμ, οἶκος Γαμωλ, οἶκος Μαων — Кириафаим, «дом Гамола», «дом Маона» (слав. «кариафаим… вефгамул… дом маонов»)."
  24: "Καριωθ, Βοσορ — Кариоф, Восор (слав. «кариоф… восора»); τὰς πόρρω καὶ τὰς ἐγγύς — «дальние и ближние». Стих закрывает перечень, начатый в 21."
  25: "κατεάχθη κέρας Μωαβ — «отсечён рог Моава» (κατάγνυμι — ломать); τὸ ἐπίχειρον αὐτοῦ συνετρίβη — «мышца его сокрушена» (ἐπίχειρον — рука, мышца). Слав. добавляет «глаголет Господь» — нет в LXX, внесено в текст без скобок."
  26: "μεθύσατε αὐτόν — «напоите его допьяна» (μεθύω — напиваться); ἐπὶ κύριον ἐμεγαλύνθη — «против Господа возвеличился». ἐπικρούσει Μωαβ ἐν χειρὶ αὐτοῦ — «ударит Моав рукою своею», т. е. в бессилии упадёт на руки; слав. «приразит моав руку свою (о блевотину)», скобки слав. — по МТ, в текст не внесены; переведено по смыслу (手を突いて倒れ). εἰς γέλωτα — «в посмеяние»."
  27: "εἰ μὴ εἰς γελοιασμὸν ἦν σοι Ισραηλ; — «не был ли тебе Израиль в посмеяние?»; εἰ ἐν κλοπαῖς σου εὑρέθη — «если в воровстве твоём он найден» (намек на пленение). ἐπολέμεις — «ты воевал». Слав. добавляет «преселишися инамо» («переселишься в иное место») — нет в LXX, внесено в текст без скобок в конце стиха."
  28: "κατέλιπον τὰς πόλεις καὶ ᾤκησαν ἐν πέτραις — в греч. аорист 3-го л. мн. ч. («оставили города и поселились в скалах»), что не согласуется с дальнейшим; слав. читает как повеление («оставите грады и пребывайте на камени»), по нему и переведено. περιστεραὶ νοσσεύουσαι — «голуби, гнездящиеся» (νοσσεύω); στόματι βοθύνου — «при устье пещеры» (βόθυνος — яма, нора, пещера)."
  29: "ἤκουσα ὕβριν Μωαβ — «услышал я надменность Моава» (ὕβρις — наглость, надменность); ὕβρισέν λίαν — «вознёсся весьма». В греч. ὕβρις повторено трижды («надменность… надменность его и гордость его»), повтор сохранён (高慢…誇り…高ぶり). ὑψώθη ἡ καρδία αὐτοῦ — «вознеслось сердце его». Слав. добавляет «презорство… кичение… возношение и воздвижение сердца» — по МТ, в текст не внесено."
  30: "ἐγὼ δὲ ἔγνων ἔργα αὐτοῦ — «Я же познал дела его»; οὐχὶ τὸ ἱκανὸν αὐτοῦ, οὐχ οὕτως ἐποίησεν — тёмное место: букв. «не достаточно ли его? не так сделал» (ἱκανός — достаточный). Слав. «не доволство ли его тако сотвори?»; ru «пустые слова его: не так сделают». Смысл: похвальба Моава несостоятельна, он не сделал так, как говорит. Переведено по смыслу, с оговоркой; слав. добавляет «глаголет Господь» — внесено в текст."
  31: "ὀλολύζετε πάντοθεν — «рыдайте отовсюду»; βοήσατε ἐπ' ἄνδρας Κιραδας αὐχμοῦ — «возопите о мужах Кирада засухи» (Κιραδας — Кирхарес; αὐχμός — засуха, зной); слав. «кирады смущения» — иное понимание слова. В тексте «乾ききった»."
  32: "ὡς κλαυθμὸν Ιαζηρ ἀποκλαύσομαί σοι — «плачем Иазера оплачу тебя» (ἀποκλαίω); ἄμπελος Σεβημα — «виноградник Севамский» (Σεβημα — Севам/Шибма). κλήματά σου διῆλθεν θάλασσαν — «лозы твои прошли море»; Ιαζηρ ἥψαντο — «до Иазера достигли» (ἅπτομαι). ἐπὶ ὀπώραν σου — «на поздние плоды твои» (ὀπώρα — осенние плоды); ἐπὶ τρυγηταῖς σου — «на собирателей винограда твоего» (τρυγητής); ὄλεθρος ἐπέπεσεν — «погибель пала». Слав. «хищник нападе» — добавление, внесено в текст (滅ぼす者が襲いかかった)."
  33: "συνεψήσθη χαρμοσύνη καὶ εὐφροσύνη — «угасла радость и веселие» (συμψήχω — сметать, уничтожать; букв. «сметены»). Слав. добавляет «от кармила» — нет в LXX, в текст не внесено. οἶνος ἦν ἐπὶ ληνοῖς σου — «вино было на точилах твоих» (ληνός — точило, давильня). πρωῒ οὐκ ἐπάτησαν οὐδὲ δείλης — «ни утром, ни вечером не топтали»; οὐκ ἐποίησαν αιδαδ — «не издавали хедад», т. е. крик при топтании винограда (евр. заимствование, оставлено как есть по смыслу: «песни топтания не было»); слав. «по обычаю песни воспоет»."
  34: "ἀπὸ κραυγῆς Εσεβων ἕως Ελεαλη — «от вопля Есевона до Елеалы»; αἱ πόλεις αὐτῶν ἔδωκαν φωνὴν αὐτῶν — «города их дали голос свой». ἀπὸ Ζογορ ἕως Ωρωναιμ καὶ Αγλαθ — «от Сигора до Оронаима и Аглафа». σαλισια — непереводимое слово (вероятно, евр. «третья Эгла», ср. ru); слав. «юница трилетная» — по нему и переведено (三歳の雌の若牛), разница отмечена. τὸ ὕδωρ Νεβριμ εἰς κατάκαυμα ἔσται — «вода Небрима будет в сожжение» (κατάκαυμα — сожжение, пожарище)."
  35: "ἀπολῶ τὸν Μωαβ — «истреблю Моав»; ἀναβαίνοντα ἐπὶ βωμὸν — «восходящего на жертвенник» (βωμός — жертвенник, высота); θυμιῶντα θεοῖς αὐτοῦ — «калящего богам своим» (θυμιάω — воскурять). Слав. «на горах» на месте βωμός. Смысл: истреблю и тех, кто ещё ходит в капища."
  36: "καρδία μου, Μωαβ, ὥσπερ αὐλοὶ βομβήσουσιν — «сердце моё, о Моав, как свирели зазвучит» (αὐλός — свирель, флейта; βομβέω — гудеть); слав. «сердце моава, яко цевницы звяцати будут» — иное согласование. ἐπ' ἀνθρώπους Κιραδας — «о людях Кирада». ἃ περιεποιήσατο, ἀπώλετο ἀπὸ ἀνθρώπου — «что он приобрёл, погибло от человека»; слав. «яже пристяжа, погибоша от человек», переведено «人の間から消え失せた»."
  37: "πᾶσαν κεφαλὴν ἐν παντὶ τόπῳ ξυρήσονται — «всякую голову на всяком месте обреют» (ξυράω); πᾶς πώγων ξυρηθήσεται — «всякая борода обрита будет»; πᾶσαι χεῖρες κόψονται — «все руки изрезаны будут» (знак траура, ср. 16:6); ἐπὶ πάσης ὀσφύος σάκκος — «на всякой чресле вретище» (ὀσφύς — чресла, поясница; σάκκος — 粗布). Слав. «оброснется» на месте «обреется» — иное чтение, в тексте по греч."
  38: "ἐπὶ πάντων τῶν δωμάτων Μωαβ — «на всех кровлях Моава»; ἐπὶ πλατείαις αὐτῆς — «на улицах (площадях) его». Слав. добавляет «всяк плачь» — нет в LXX, внесено в текст (泣き声がある). συνέτριψα τὸν Μωαβ ὡς ἀγγεῖον, οὗ οὐκ ἔστιν χρεία αὐτοῦ — «сокрушил Моав, как сосуд, в котором нет нужды», т. е. ненужный; слав. «якоже сосуд непотребен»."
  39: "πῶς κατήλλαξεν; — «как изменился?» (καταλλάσσω — менять, менять на другое); πῶς ἔστρεψεν νῶτον Μωαβ; — «как обратил Моав хребет?» (νῶτον — спина), т. е. побежал. Слав. добавляет «возрыдаша» — нет в LXX, в текст не внесено. ἐγκότημα — «предмет негодования» (ἐγκοτέω — гневаться), «ненависть» у слав.; переведено 憎まれ者."
  40: "В gr стих — только формула «ибо так говорит Господь»; образ орла (ср. Втор 32:11) сохранён в слав. 48:40 и по паритету внесён в текст без скобок («нет в LXX» — точнее, утрачен в модуле). Образ того, кто налетает на Моав: слав. «якоже орел полетит и распрострет криле свои на моава»."
  41: "ἐλήμφθη Ακκαριωθ — «взят Аккариоф» (город); τὰ ὀχυρώματα συνελήμφθη — «крепости взяты». ἕκαστος... ὡς καρδία γυναικὸς ὠδινούσης — ср. 30:24; здесь «сердце сильных Моава в тот день, как сердце женщины родящей» (ὠδίνω — мучиться родами), слав. «яко сердце жены родящия»."
  42: "ἀπολεῖται Μωαβ ἀπὸ ὄχλου — «погибнет Моав от народа (из среды народов)»; ἐπὶ τὸν κύριον ἐμεγαλύνθη — «против Господа возвеличился». В конец стиха по содержанию влит слав. 48:46 («горе тебе, Моав! погиб народ Хамоса, сыны и дщери в плен»): в LXX этого стиха нет, он стоит в МТ; в тексте — без скобок, как продолжение плача о Хамосе из 31:7."
  43: "παγὶς καὶ φόβος καὶ βόθυνος — «сеть, страх и яма» (παγίς — петля, силок; βόθυνος — яма); порядок слав. иной («страх и пропасть и сеть»), в тексте по греч. Слав. добавляет «глаголет Господь» — нет в LXX, внесено в текст без скобок."
  44: "ὁ φεύγων ἀπὸ προσώπου τοῦ φόβου ἐμπεσεῖται εἰς τὸν βόθυνον — «бегущий от лица страха упадёт в яму»; ὁ ἀναβαίνων ἐκ τοῦ βοθύνου συλλημφθήσεται ἐν τῇ παγίδι — «выходящий из ямы пойман будет сетью». ἐν ἐνιαυτῷ ἐπισκέψεως αὐτῆς — «в год посещения её». В конец стиха влиты: слав. 48:45 (бегущие у стены Есевона, огонь из Есевона и пламя «от среды Сиона», сожжён бок Моава и темя сынов смятения) — в LXX нет, стоит в МТ, продолжает образ сетей; и слав. 48:47 («возвращу плен Моава в последние дни») — обетование в конце оракула. Заключительная формула слав. 48:47 «доселе суд Моава» вынесена из кавычек: это заметка собирателя, а не речь Господа."
  45: "Слав. 48:45 (МТ 48:45), в гр. модуле стиха нет: «Во стени есевонстей сташа от силы избегше…» — у стены Есевона встали бегущие, огонь вышел из Есевона и пламя «от среды Сиона», сожжён бок Моава и темя сынов смятения. В прежней (греческой) нумерации входило в конец 31:44."
  46: "Слав. 48:46 (МТ 48:46), в гр. модуле стиха нет: «Горе тебе, моаве! погибоша людие хамоса…» — «Горе тебе, Моав! погиб народ Хамоса: сыновья твои и дочери твои отведены в плен». В прежней (греческой) нумерации входило в конец 31:42."
  47: "Слав. 48:47 (МТ 48:47): «И возвращу плен моавль в последния дни… До зде суд моавль» — обетование о возвращении плена Моава; заключительная заметка собирателя вынесена из кавычек. В прежней (греческой) нумерации входило в конец 31:44."
