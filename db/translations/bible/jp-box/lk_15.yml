verses:
  1: "徴税人[ちょうぜいにん]たちや罪人[ざいにん]たちはみな、イエスの話[はなし]を聞[き]こうとして、そばに寄[よ]って来[き]ていた。"
  2: "ファリサイ派[は]の人[ひと]たちも律法学者[りっぽうがくしゃ]たちも、つぶやいて言[い]った。「この人[ひと]は罪人[ざいにん]たちを迎[むか]え入[い]れて、一緒[いっしょ]に食[た]べている。」"
  3: "そこで、イエスは彼[かれ]らにこのたとえを語[かた]られた。"
  4: "「<j>あなたがたのうち、百匹[ひゃっぴき]の羊[ひつじ]を持[も]つ人[ひと]が、その一匹[いっぴき]をなくしたら、九十九匹[きゅうじゅうきゅうひき]を荒[あ]れ野[の]に残[のこ]しておいて、なくした一匹[いっぴき]を見[み]つけるまで捜[さが]しに行[い]かないだろうか。</j>"
  5: "<j>見[み]つけると、喜[よろこ]んでそれを自分[じぶん]の肩[かた]に乗[の]せる。</j>"
  6: "<j>そして、家[いえ]に帰[かえ]ると、友[とも]や隣人[りんじん]を呼[よ]び集[あつ]めて言[い]う。『わたしと一緒[いっしょ]に喜[よろこ]んでください。なくしたわたしの羊[ひつじ]を見[み]つけたからです。』</j>"
  7: "<j>言[い]っておく。同じように、天[てん]では、悔[く]い改[あらた]める罪人[ざいにん]一人[ひとり]のためには、悔[く]い改[あらた]める必要[ひつよう]のない九十九人[きゅうじゅうきゅうにん]の正[ただ]しい人[ひと]たちのためよりも、大[おお]きな喜[よろこ]びがある。</j>」"
  8: "「<j>また、どの女[おんな]が、ドラクマ銀貨[ぎんか]⟨ギリシアの銀貨[ぎんか]。労働者[ろうどうしゃ]の一日分[いちにちぶん]の賃金[ちんぎん]に当[あ]たる。⟩を十枚[じゅうまい]持[も]っていて、一枚[いちまい]をなくしたら、ともし火[び]をともし、家[いえ]を掃[は]き、見[み]つけるまで念入[ねんい]りに捜[さが]さないだろうか。</j>"
  9: "<j>見[み]つけると、友[とも]や隣人[りんじん]を呼[よ]び集[あつ]めて言[い]う。『わたしと一緒[いっしょ]に喜[よろこ]んでください。なくしたドラクマ銀貨[ぎんか]を見[み]つけたからです。』</j>"
  10: "<j>同じように、言[い]っておく。悔[く]い改[あらた]める罪人[ざいにん]一人[ひとり]のためには、神[かみ]の天使[てんし]たちの前[まえ]に喜[よろこ]びがある。</j>」"
  11: "また言[い]われた。「<j>ある人[ひと]に二人[ふたり]の息子[むすこ]がいた。</j>"
  12: "<j>弟[おとうと]が父[ちち]に言[い]った。『父[ちち]よ、わたしに与[あた]えられるべき財産[ざいさん]の分[ぶん]をください。』そこで父[ちち]は、財産[ざいさん]を二人[ふたり]に分[わ]け与[あた]えた。</j>"
  13: "<j>幾日[いくにち]もたたないうちに、弟[おとうと]はすべてを集[あつ]めて遠[とお]い国[くに]へ旅立[たびだ]ち、そこで放蕩[ほうとう]に暮[く]らして、財産[ざいさん]を散[ち]らしてしまった。</j>"
  14: "<j>すべてを使[つか]い果[は]たすと、その国[くに]にひどい飢[き]饉[きん]が起[おこ]り、彼[かれ]は困[こま]り始[はじ]めた。</j>"
  15: "<j>そこで、その国[くに]の住民[じゅうみん]の一人[ひとり]のところへ行[い]って身[み]を寄[よ]せると、その人[ひと]は彼[かれ]を畑[はたけ]にやって豚[ぶた]を飼[か]わせた。</j>"
  16: "<j>彼[かれ]は、豚[ぶた]が食[た]べている豆莢[まめがら]で腹[はら]を満[み]たそうとしたが、だれも与[あた]えなかった。</j>"
  17: "<j>そこで、自分[じぶん]に思[おも]い返[かえ]して言[い]った。『父[ちち]の家[いえ]には、雇[やと]い人[びと]がパンをあり余[あま]るほど持[も]っているのに、わたしはここで飢[う]え死[じ]にしようとしている。</j>"
  18: "<j>立[た]って、父[ちち]のもとへ行[い]こう。そして言[い]おう。「父[ちち]よ、わたしは天[てん]に対[たい]しても、あなたの前[まえ]でも罪[つみ]を犯[おか]しました。</j>"
  19: "<j>もうあなたの息子[むすこ]と呼[よ]ばれる値打[ねう]ちはありません。わたしをあなたの雇[やと]い人[びと]の一人[ひとり]にしてください。」』</j>"
  20: "<j>そして、立[た]って父[ちち]のもとへ向[む]かった。まだ遠[とお]く離[はな]れていたとき、父[ちち]は息子[むすこ]を見[み]つけて深[ふか]く憐[あわ]れに思[おも]い、走[はし]り寄[よ]ってその首[くび]を抱[だ]き、何度[なんど]も口[くち]づけした。</j>"
  21: "<j>息子[むすこ]は父[ちち]に言[い]った。『父[ちち]よ、わたしは天[てん]に対[たい]しても、あなたの前[まえ]でも罪[つみ]を犯[おか]しました。もうあなたの息子[むすこ]と呼[よ]ばれる値打[ねう]ちはありません。』</j>"
  22: "<j>しかし、父[ちち]は僕[しもべ]たちに言[い]った。『最[もっと]も良[よ]い衣[ころも]を出[だ]して彼[かれ]に着[き]せ、指輪[ゆびわ]をその手[て]に、履物[はきもの]をその足[あし]に与[あた]えなさい。</j>"
  23: "<j>そして、肥[こ]えた子牛[こうし]を引[ひ]いて来[き]てほふり、わたしたちは食[た]べて祝[いわ]おう。</j>"
  24: "<j>この息子[むすこ]は死[し]んでいたのに生[い]き返[かえ]り、いなくなっていたのに見[み]つかったのだから。』そこで、彼[かれ]らは祝[いわ]い始[はじ]めた。</j>"
  25: "<j>ところが、長男[ちょうなん]は畑[はたけ]にいた。帰[かえ]って来[き]て家[いえ]に近[ちか]づくと、音楽[おんがく]や踊[おど]りの音[おと]が聞[き]こえた。</j>"
  26: "<j>そこで、僕[しもべ]の一人[ひとり]を呼[よ]んで、これは何[なに]のことかと尋[たず]ねた。</j>"
  27: "<j>僕[しもべ]は言[い]った。『あなたの弟[おとうと]が帰[かえ]って来[き]たのです。あなたの父[ちち]さまは、弟[おとうと]が無事[ぶじ]に戻[もど]ったというので、肥[こ]えた子牛[こうし]をほふられたのです。』</j>"
  28: "<j>長男[ちょうなん]は怒[おこ]って、家[いえ]に入[はい]ろうとしなかった。父[ちち]は出[で]て行[い]って、彼[かれ]に勧[すす]めた。</j>"
  29: "<j>しかし、彼[かれ]は父[ちち]に答[こた]えて言[い]った。『見[み]よ、わたしはこれほど長[なが]い間[あいだ]あなたに仕[つか]えてきて、あなたの掟[おきて]を一度[いちど]も破[やぶ]ったことがありません。それなのに、あなたはわたしに、友人[ゆうじん]たちと一緒[いっしょ]に祝[いわ]うための子山羊[こやぎ]一匹[いっぴき]さえ与[あた]えてくださいませんでした。</j>"
  30: "<j>ところが、あなたの財産[ざいさん]を遊女[ゆうじょ]たちと一緒[いっしょ]に食[く]い尽[つ]くしたこの息子[むすこ]が帰[かえ]って来[き]たとなると、あなたはそのために肥[こ]えた子牛[こうし]をほふられたのです。』</j>"
  31: "<j>父[ちち]は彼[かれ]に言[い]った。『子[こ]よ、あなたはいつもわたしと一緒[いっしょ]にいて、わたしのものはすべてあなたのものである。</j>"
  32: "<j>だが、このあなたの弟[おとうと]は、死[し]んでいたのに生[い]き返[かえ]り、いなくなっていたのに見[み]つかったのだから、喜[よろこ]び祝[いわ]うのは当然[とうぜん]であった。』</j>」"

notes:
  1: "τελῶναι καὶ ἁμαρτωλοί — 徴税人たちや罪人たち; ἐγγίζοντες — «приближались»; そばに寄って来ていた."
  2: "διεγόγγυζον — «роптали»; つぶやいて. Слова фарисеев — не красным. συνεσθίει — 一緒に食べている."
  3: "παραβολή — たとえ."
  4: "καταλείπει… ἐν τῇ ἐρήμῳ — «оставляет… в пустыне»; 荒れ野に残しておいて."
  5: "χαίρων — «радуясь»; 喜んで."
  6: "συγκαλεῖ — «созывает»; 呼び集めて. Речь друзей и соседей — в 『』."
  7: "ἢ ἐπὶ ἐνενήκοντα ἐννέα — «нежели о девяноста девяти»; よりも大きな喜び, сравнение сохранено. χρείαν ἔχουσιν μετανοίας — 悔い改める必要のない."
  8: "δραχμή — ドラクマ; первое упоминание в корпусе — сноска. ἅπτει λύχνον — 灯りをともし. σαροῖ — 掃き. ἐπιμελῶς — 念入りに."
  9: "συγχάρητέ μοι — わたしと一緒に喜んでください."
  10: "ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ — 神の天使たちの前に."
  11: "δύο υἱούς — 二人の息子."
  12: "τὸ ἐπιβάλλον μέρος — «причитающуюся часть»; 与えられるべき分. τὸν βίον — «имение, жизнь»; 財産."
  13: "ἀσώτως — «распутно»; 放蕩に. διεσκόρπισεν — 散らした."
  14: "λιμὸς ἰσχυρά — ひどい飢饉. ὑστερεῖσθαι — 困り始めた."
  15: "ἐκολλήθη — «прилепился»; 身を寄せた. βόσκειν χοίρους — 豚を飼わせた."
  16: "В критическом χορτασθῆναι («насытиться»), в TR/Елизаветинской/jp-joc γεμίσαι τὴν κοιλίαν («наполнить чрево») — 腹を満たす, без 〔〕 (замена). κεράτια — 豆莢."
  17: "εἰς ἑαυτὸν ἐλθών — «придя в себя»; 自分に思い返して. μίσθιοι — 雇い人."
  18: "ἥμαρτον εἰς τὸν οὐρανὸν — «согрешил против неба»; 天に対しても. Слова сына внутри его же речи — третьим уровнем кавычек: 「」 внутри 『』."
  19: "ἄξιος κληθῆναι υἱός σου — 息子と呼ばれる値打ちはない. ποίησόν με — してください."
  20: "ἐσπλαγχνίσθη — «сжалился»; 深く憐れに思って. ἐπέπεσεν ἐπὶ τὸν τράχηλον — 首を抱き. κατεφίλησεν — 何度も口づけした."
  21: "Сын повторяет только первую часть; «сделай меня наёмником» не повторено — как в критическом и jp-joc."
  22: "στολὴ ἡ πρώτη — «лучшая одежда»; 最も良い衣. δακτύλιος, ὑποδήματα — 指輪、履物."
  23: "μόσχος σιτευτός — «откормленный телёнок»; 肥えた子牛. θύσατε — ほふり. εὐφρανθῶμεν — 祝いましょう."
  24: "νεκρὸς ἦν καὶ ἀνέζησεν — 死んでいたのに生き返り; ἀπολωλὼς καὶ εὑρέθη — いなくなっていたのに見つかった."
  25: "συμφωνία καὶ χοροί — 音楽や踊り."
  26: "παῖς — 僕. ἐπυνθάνετο — 尋ねた."
  27: "ὑγιαίνοντα — «здоровым»; 無事に."
  28: "ὠργίσθη — 怒って. παρεκάλει — 勧めた."
  29: "ἐντολήν σου παρῆλθον — «преступил заповедь»; 掟を破った. ἔριφος — 子山羊."
  30: "καταφαγών σου τὸν βίον — «съевший имение твое»; 財産を食い尽くした. πόρναι — 遊女."
  31: "Τέκνον — 子よ. πάντα τὰ ἐμὰ σά — わたしのものはすべてあなたのもの."
  32: "ἔδει — «надлежало»; 当然であった. Формула та же, что в 24."
