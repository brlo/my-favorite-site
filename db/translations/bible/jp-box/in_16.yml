verses:
  1: "「<j>わたしがこれらのことをあなたがたに話[はな]してきたのは、あなたがたがつまずかないためである。</j>"
  2: "<j>あなたがたを会堂[かいどう]から追[お]い出[だ]す。しかし、あなたがたを殺[ころ]す者[もの]はだれでも、自分[じぶん]は神[かみ]に奉仕[ほうし]していると考[かんが]える時[とき]が来[く]る。</j>"
  3: "<j>彼[かれ]らがこれらのことを行[おこな]うのは、父[ちち]もわたしも知[し]らないからである。</j>"
  4: "<j>しかし、わたしがこれらのことをあなたがたに話してきたのは、彼[かれ]らの時[とき]が来[き]たとき、わたしがこれらのことをあなたがたに言[い]ったのを、あなたがたが思[おも]い出[だ]すためである。初[はじ]めからこれらのことをあなたがたに言わなかったのは、わたしがあなたがたと一緒[いっしょ]にいたからである。</j>"
  5: "<j>今[いま]、わたしはわたしを遣[つか]わした方[かた]のもとへ行[い]く。しかし、あなたがたのうちのだれも、『どこへ行[い]くのか』とわたしに尋[たず]ねない。</j>"
  6: "<j>しかし、わたしがこれらのことをあなたがたに話したために、悲[かな]しみがあなたがたの心[こころ]を満[み]たしている。</j>"
  7: "<j>しかし、わたしはあなたがたに真理[しんり]を言[い]う。わたしが去[さ]ることは、あなたがたにとって益[えき]である。わたしが去らなければ、助[たす]け主[ぬし]はあなたがたのところへ来[こ]ない。わたしが行[い]けば、あなたがたのところへその方[かた]を遣[つか]わす。</j>"
  8: "<j>その方[かた]が来[く]ると、罪[つみ]と義[ぎ]と裁[さば]きについて、世[よ]を責[せ]める。</j>"
  9: "<j>罪[つみ]については、彼[かれ]らがわたしを信[しん]じないからである。</j>"
  10: "<j>義[ぎ]については、わたしが父[ちち]のもとへ行[い]き、あなたがたがもはやわたしを見[み]なくなるからである。</j>"
  11: "<j>裁[さば]きについては、この世[よ]の支配者[しはいしゃ]が裁[さば]かれたからである。</j>"
  12: "<j>わたしにはまだあなたがたに言[い]うべきことが多[おお]くあるが、今[いま]はあなたがたはそれを担[にな]うことができない。</j>"
  13: "<j>しかし、その方[かた]、すなわち真理[しんり]の霊[れい]が来[く]ると、あなたがたをすべての真理[しんり]へと導[みちび]く。その方[かた]は自分[じぶん]から語[かた]るのではなく、聞[き]いたことを語[かた]り、来[きた]るべきことをあなたがたに告[つ]げる。</j>"
  14: "<j>その方[かた]はわたしに栄光[えいこう]を帰[き]する。わたしのもののうちから取[と]って、あなたがたに告[つ]げるからである。</j>"
  15: "<j>父[ちち]が持[も]っているものはすべてわたしのものである。だから、わたしは『その方[かた]はわたしのもののうちから取[と]って、あなたがたに告[つ]げる』と言[い]ったのである。</j>"
  16: "<j>しばらくすると、あなたがたはもはやわたしを見[み]なくなる。またしばらくすると、あなたがたはわたしを見[み]る。〔わたしが父[ちち]のもとへ行[い]くからである。〕</j>」"
  17: "そこで、弟子[でし]たちのうちのある者[もの]たちが互[たが]いに言[い]った。「あの方がわたしたちに『しばらくすると、あなたがたはわたしを見[み]なくなる。またしばらくすると、あなたがたはわたしを見[み]る』と言[い]われるのは、どういうことか。また『わたしが父[ちち]のもとへ行[い]く』と言われるのは、どういうことか。」"
  18: "そこで彼[かれ]らは言[い]った。「『しばらく』とは、どういうことか。あの方が何[なに]を言[い]っておられるのか、わたしたちには分[わ]からない。」"
  19: "イエスは、彼[かれ]らがご自分[じぶん]に尋[たず]ねたがっているのを知[し]って、彼らに言[い]われた。「<j>わたしが『しばらくすると、あなたがたはわたしを見[み]なくなる。またしばらくすると、あなたがたはわたしを見[み]る』と言[い]ったことについて、あなたがたは互[たが]いに論[ろん]じ合[あ]っているのか。</j>」"
  20: "<j>よくよく言[い]っておく。あなたがたは泣[な]き、嘆[なげ]く。しかし世[よ]は喜[よろこ]ぶ。あなたがたは悲[かな]しむが、あなたがたの悲しみは喜[よろこ]びに変[か]わる。</j>"
  21: "<j>女[おんな]は子[こ]を産[う]むとき、悲[かな]しみを抱[いだ]く。その時[とき]が来[き]たからである。しかし、子を産[う]んでしまうと、ひとりの人[ひと]が世[よ]に生[う]まれた喜[よろこ]びのために、もはやその苦[くる]しみを思[おも]い出[だ]さない。</j>"
  22: "<j>あなたがたも今[いま]は悲[かな]しみを抱[いだ]いている。しかし、わたしは再[ふたた]びあなたがたを見[み]る。すると、あなたがたの心[こころ]は喜[よろこ]ぶ。そして、あなたがたの喜びを奪[うば]う者[もの]はいない。</j>"
  23: "<j>その日[ひ]には、あなたがたはわたしに何[なに]も尋[たず]ねない。よくよく言[い]っておく。あなたがたがわたしの名[な]によって父[ちち]に求[もと]めるものは、何[なに]でも父があなたがたに与[あた]える。</j>"
  24: "<j>今[いま]まで、あなたがたはわたしの名[な]によって何[なに]も求[もと]めたことがなかった。求[もと]めなさい。そうすれば受[う]け取[と]る。あなたがたの喜[よろこ]びが満[み]ちあふれるためである。</j>"
  25: "<j>わたしはこれらのことをたとえで話[はな]してきた。しかし、時[とき]が来[く]る。わたしはもうたとえで話さず、父[ちち]のことをあなたがたに明[あき]らかに告[つ]げる。</j>"
  26: "<j>その日[ひ]には、あなたがたはわたしの名[な]によって求[もと]める。わたしは、あなたがたのために父[ちち]に願[ねが]う、とは言[い]わない。</j>"
  27: "<j>父[ちち]ご自身[じしん]があなたがたを愛[あい]しておられるのは、あなたがたがわたしを愛[あい]し、わたしが神[かみ]のもとから出[で]たことを信[しん]じているからである。</j>"
  28: "<j>わたしは父[ちち]のもとから出[で]て、世[よ]に来[き]た。また世を離[はな]れて、父のもとへ行[い]く。</j>"
  29: "弟子[でし]たちは言[い]った。「今[いま]、あなたは明[あき]らかに話[はな]しておられ、少しもたとえを用[もち]いておられません。"
  30: "今[いま]、わたしたちは、あなたがすべてをご存[ぞん]じで、だれがあなたに尋[たず]ねる必要[ひつよう]もないことを知[し]りました。これによって、あなたが神[かみ]のもとから出[で]て来[き]られたことを信[しん]じます。」"
  31: "イエスは彼[かれ]らに答[こた]えられた。「<j>今[いま]、あなたがたは信[しん]じているのか。</j>"
  32: "<j>見[み]よ、時[とき]が来[く]る。いや、すでに来[き]ている。あなたがたはそれぞれ自分[じぶん]のところへ散[ち]らされ、わたしをひとり残[のこ]す。しかし、わたしはひとりではない。父[ちち]がわたしと一緒[いっしょ]にいるからである。</j>"
  33: "<j>わたしがこれらのことをあなたがたに話[はな]したのは、あなたがたがわたしにあって平和[へいあん]を持[も]つためである。世[よ]にあってあなたがたは苦難[くなん]を受[う]ける。しかし、勇気[ゆうき]を出[だ]しなさい。わたしは世[よ]に勝[か]った。</j>」"

notes:
  1: "Глава продолжает прощальную беседу (15:18–27), поэтому цитата открывается заново."
  2: "ἀποσυναγώγους ποιήσουσιν ὑμᾶς — «сделают вас отлучёнными от синагоги»; 会堂から追い出す."
  7: "παράκλητος — 助[たす]け主[ぬし], как в 14:16,26; 15:26 (единство термина). ἐὰν γὰρ μὴ ἀπέλθω… — условие сохранено."
  8: "ἐλέγξει — «обличит, изобличит»; 責める, как у jp-joc (世を責めん), без смягчения до «наставит»."
  11: "ὁ ἄρχων τοῦ κόσμου τούτου — «князь мира сего»; この世の支配者 (не 君, чтобы не путать с обращением きみ)."
  13: "τὸ πνεῦμα τῆς ἀληθείας — «Дух истины»; у jp-joc ошибочно 眞實の神, поэтому 真理の霊. τὰ ἐρχόμενα — 来たるべきこと."
  14: "δοξάζω — 栄光を帰する, единообразно в 17:1,4,5,10,22."
  16: "В критическом издании стих кончается на ὄψεσθέ με; Церковь (Елизаветинская «яко Аз иду ко Отцу», jp-joc) читает с добавлением ὅτι ὑπάγω πρὸς τὸν πατέρα — 〔…〕."
  20: "ἀμὴν ἀμὴν λέγω ὑμῖν — よくよく言っておく (16:23 так же), формула корпуса."
  25: "ἐν παροιμίαις / παρρησίᾳ — たとえで / 明らかに. たとえ в корпусе пишется без кандзи."
