# jp-box, Псалтирь, псалом 28. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..N.
# Псалом 28: глас Господень над водами (3–4), глас, сокрушающий кедры (5–6),
# огонь и пустыня (7–9), Господь — Царь вовек (10), сила и мир народу (11).
# Красного и синего нет. Прямой речи нет, кавычки не ставятся.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# Сносок ⟨…⟩ нет: 幕屋, 杉, 野牛, 洪水 понятны; 神殿 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 28
draft: true

verses:
  1: "ダビデの詩[うた]。幕屋[まくや]の祭[まつ]りが終[お]わるときのもの。神[かみ]の子[こ]らよ、主[しゅ]にささげよ。主[しゅ]に雄羊[おひつじ]の子[こ]らをささげよ。主[しゅ]に栄光[えいこう]と誉[ほま]れとをささげよ。"
  2: "主[しゅ]の名[な]にふさわしい栄光[えいこう]を、主[しゅ]にささげよ。主[しゅ]の聖[せい]なる庭[にわ]で、主[しゅ]を伏[ふ]し拝[おが]めよ。"
  3: "主[しゅ]の声[こえ]は水[みず]の上[うえ]にある。栄光[えいこう]の神[かみ]は雷[かみなり]を鳴[な]らされた。主[しゅ]は多[おお]くの水[みず]の上[うえ]におられる。"
  4: "主[しゅ]の声[こえ]は力[ちから]のうちにあり、主[しゅ]の声[こえ]は威厳[いげん]のうちにある。"
  5: "主[しゅ]の声[こえ]は杉[すぎ]を砕[くだ]き、主[しゅ]はレバノンの杉[すぎ]を砕[くだ]かれる。"
  6: "主[しゅ]はそれらを子[こ]牛[うし]のように、レバノンをも、愛[あい]された者[もの]をも、若[わか]い野牛[やぎゅう]のように細[こま]かく砕[くだ]かれる。"
  7: "主[しゅ]の声[こえ]は火[ひ]の炎[ほのお]を切[き]り裂[さ]く。"
  8: "主[しゅ]の声[こえ]は荒[あ]れ野[の]を震[ふる]わせ、主[しゅ]はカデスの荒[あ]れ野[の]を震[ふる]わせられる。"
  9: "主[しゅ]の声[こえ]は雌鹿[めじか]に子[こ]を産[う]ませ、林[はやし]を裸[はだか]にする。主[しゅ]の神殿[しんでん]では、すべての者[もの]が栄光[えいこう]を告[つ]げる。"
  10: "主[しゅ]は洪水[こうずい]の上[うえ]に座[すわ]られる。主[しゅ]は王[おう]としてとこしえに座[すわ]られる。"
  11: "主[しゅ]はご自身[じしん]の民[たみ]に力[ちから]を与[あた]え、主[しゅ]はご自身[じしん]の民[たみ]を平和[へいわ]のうちに祝福[しゅくふく]される。"

notes:
  1: "Ψαλμὸς τῷ Δαυιδ, ἐξοδίου σκηνῆς — ダビデの詩、幕屋の祭りが終わるときのもの (ἐξόδιον — «исход, окончание»; σκηνή — 幕屋, скиния; Синодальный «при окончании праздника кущей»). Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Ἐνέγκατε τῷ κυρίῳ, υἱοὶ θεοῦ — воздайте Господу, сыны Божии (ἐνέγκατε — императив от φέρω, «приносить»). ἐνέγκατε τῷ κυρίῳ υἱοὺς κριῶν — принесите Господу сынов овних (κριός — «баран»; слав. «сыны овни»; Синодальный это место опускает). ἐνέγκατε τῷ κυρίῳ δόξαν καὶ τιμήν — троекратный повтор ἐνέγκατε сохранён."
  2: "ἐνέγκατε τῷ κυρίῳ δόξαν ὀνόματι αὐτοῦ — воздайте Господу славу имени Его (датив ὀνόματι — «подобающую имени»). προσκυνήσατε τῷ κυρίῳ ἐν αὐλῇ ἁγίᾳ αὐτοῦ — 主の聖なる庭で、主を伏し拝め (αὐλή — «двор»; Синодальный «в благолепном святилище Его»)."
  3: "φωνὴ κυρίου ἐπὶ τῶν ὑδάτων — 主の声は水の上にある; «глас Господень» — формула, повторяющаяся в ст. 3–9, повтор сохранён. ὁ θεὸς τῆς δόξης ἐβρόντησεν — 栄光の神は雷を鳴らされた (βροντάω — «греметь»). κύριος ἐπὶ ὑδάτων πολλῶν — 主は多くの水の上におられる."
  4: "φωνὴ κυρίου ἐν ἰσχύι — 主の声は力のうちにあり. φωνὴ κυρίου ἐν μεγαλοπρεπείᾳ — 主の声は威厳のうちにある (μεγαλοπρέπεια — «величие, великолепие»). Два параллельных члена без глагола сохранены."
  5: "φωνὴ κυρίου συντρίβοντος κέδρους — 主の声は杉を砕き (κέδρος — «кедр»). συντρίψει κύριος τὰς κέδρους τοῦ Λιβάνου — 主はレバノンの杉を砕かれる; повтор «кедры» и «сокрушать» сохранён."
  6: "καὶ λεπτυνεῖ αὐτὰς ὡς τὸν μόσχον τὸν Λίβανον — «и истончит их, как тельца, Ливан» (λεπτύνω — «делать тонким, измельчать»); слав. «и истончит яко телца Ливанска». ὁ ἠγαπημένος ὡς υἱὸς μονοκερώτων — возлюбленный, как сын единорогов (μονόκερως — «единорог», здесь, вероятно, дикий бык). Синодальный и jp-joc по евр. читают «скакать, как молодой единорог»; оставлено греческое и славянское чтение — стих тёмный, см. отчёт."
  7: "φωνὴ κυρίου διακόπτοντος φλόγα πυρός — 主の声は火の炎を切り裂く (διακόπτω — «рассекать»; Синодальный «высекает пламень огня»)."
  8: "φωνὴ κυρίου συσσείοντος ἔρημον — 主の声は荒れ野を震わせ (συσσείω — «сотрясать»; ἔρημος — «пустыня»). συσσείσει κύριος τὴν ἔρημον Καδης — 主はカデスの荒れ野を震わせられる; повтор сохранён."
  9: "φωνὴ κυρίου καταρτιζομένου ἐλάφους — 主の声は雌鹿に子を産ませ (καταρτίζω — «устроять»; ἔλαφος — «лань»). ἀποκαλύψει δρυμούς — 林を裸にする (δρυμός — «дубрава, чаща»). ἐν τῷ ναῷ αὐτοῦ πᾶς τις λέγει δόξαν — 主の神殿では、すべての者が栄光を告げる (не прямая речь, кавычки не ставятся)."
  10: "κύριος τὸν κατακλυσμὸν κατοικιεῖ — «Господь потоп населяет» (κατοικίζω — «поселять»; κατακλυσμός — «потоп»); слав. «Господь потоп населяет», jp-joc «主は洪水の上に坐せり». καθίεται κύριος βασιλεὺς εἰς τὸν αἰῶνα — 主は王としてとこしえに座られる (καθίζω — «восседать»)."
  11: "κύριος ἰσχὺν τῷ λαῷ αὐτοῦ δώσει — 主はご自身の民に力を与え. κύριος εὐλογήσει τὸν λαὸν αὐτοῦ ἐν εἰρήνῃ — 主はご自身の民を平和のうちに祝福される (ἐν εἰρήνῃ — «с миром»; Синодальный «благословит народ Свой миром»)."
