verses:
  1: "モアブについての言葉[ことば]。一夜[ひとよ]のうちにモアブは滅[ほろ]び、一夜[ひとよ]のうちにモアブの城壁[じょうへき]は滅[ほろ]びる。"
  2: "自分[じぶん]たちのことを悲[かな]しめ。ディボンも滅[ほろ]びるからである。そこにあなたがたの祭壇[さいだん]がある。あなたがたはそこに上[のぼ]って泣[な]く。モアブのネボの上[うえ]では泣[な]き叫[さけ]べ。すべての頭[あたま]は剃[そ]られ、すべての腕[うで]は切[き]り落[お]とされている。"
  3: "その広場[ひろば]では粗布[あらぬの]をまとって身[み]を打[う]ち、その屋根[やね]の上[うえ]でも、その路地[ろじ]でも、その広場[ひろば]でも、すべての者が泣[な]きながら泣[な]き叫[さけ]ぶ。"
  4: "エセボンとエレアレが叫[さけ]び、その声[こえ]はヤッサにまで聞[き]こえた。それゆえ、モアブの腰[こし]は叫[さけ]び、その魂[たましい]は知[し]る。"
  5: "モアブの心[こころ]はその内[うち]でツォアルにまで叫[さけ]ぶ。それは三歳[さんさい]の雌[めす]の子牛[こうし]だからである。ルヒトの上[のぼ]り道[みち]では、人々[ひとびと]は泣[な]きながらあなたのところへ上[のぼ]る。アロニムの道[みち]では、破滅[はめつ]と震動[しんどう]を叫[さけ]ぶ。"
  6: "ネムリムの水[みず]は涸[か]れ、その草[くさ]は絶[た]える。青[あお]い草[くさ]はもはやないからである。"
  7: "「それでも、このようにして救[すく]われるのだろうか。わたしは谷[たに]にアラビア人[じん]を導[みちび]き入[い]れ、彼らはそれを取[と]る。」"
  8: "その叫[さけ]びはモアブの国境[こっきょう]のアガリムにまで届[とど]き、その泣[な]き声[ごえ]はアイリムの井戸[いど]にまで及[およ]ぶ。"
  9: "「レモンの水[みず]は血[ち]で満[み]ちる。わたしはレモンにアラビア人[じん]を導[みちび]き入[い]れ、モアブの種[たね]とアリエルとアダマの残[のこ]りを取[と]り去[さ]る。」"

notes:
  1: "Τὸ ῥῆμα τὸ κατὰ τῆς Μωαβίτιδος — «слово о Моавитиде»: надписание, в слав. его нет (слав. начинается сразу «Нощию погибнет...»), внесено по LXX. Μωαβῖτις — «земля Моав» (モアブ). νυκτὸς ἀπολεῖται — «ночью погибнет» (一夜のうちに); τεῖχος — «стена, крепость» (城壁); повтор «ночью» сохранён."
  2: "λυπεῖσθε ἐφ᾽ ἑαυτοῖς — «печальтесь о себе» (自分たちのことを悲しめ); ἀπολεῖται καὶ Δηβων — «погибнет и Дивон» (ディボン). οὗ ὁ βωμὸς ὑμῶν — «где жертвенник ваш» (祭壇); ἐκεῖ ἀναβήσεσθε κλαίειν — «там взойдёте плакать». Ναβαυ τῆς Μωαβίτιδος — モアブのネボ (по корпусу ネボ); ὀλολύζετε — «рыдайте»; φαλάκρωμα — «плешь» (剃られた頭); βραχίονες κατατετμημένοι — «руки обсечены» (траурный обряд, 切り落とされた腕)."
  3: "ἐν ταῖς πλατείαις αὐτῆς — «на площадях, широких улицах её» (広場); περιζώσασθε σάκκους — «препояшьтесь вретищами» (粗布); κόπτεσθε — «бейте себя [в грудь]» (身を打つ). ἐπὶ τῶν δωμάτων — «на кровлях» (屋根); ἐν ταῖς ῥύμαις — «в переулках» (路地). Слав. добавляет второе «на стогнах его» — по паритету внесено, поэтому 広場 повторено (その広場でも)."
  4: "κέκραγεν Εσεβων καὶ Ελεαλη — «возопил Есевон и Елеала» (エセボン по корпусу, エレアレ); ἕως Ιασσα ἠκούσθη ἡ φωνὴ αὐτῶν — «до Иассы слышен голос их» (ヤッサ). ὀσφὺς τῆς Μωαβίτιδος — «чресла Моавитиды» (腰); ἡ ψυχὴ αὐτῆς γνώσεται — «душа её узнает» (魂は知る)."
  5: "ἡ καρδία τῆς Μωαβίτιδος βοᾷ — «сердце Моавитиды вопиет» (心は叫ぶ); ἕως Σηγωρ — «до Сигора» (ツォアル по корпусу). δάμαλις τριετής — «трёхлетняя телица» (三歳の雌の子牛); образ оставлен без сглаживания. ἀνάβασις Λουιθ — «восхождение Луит» (ルヒトの上り道); πρὸς σέ — «к тебе»; ὁδὸς Αρωνιιμ — «дорога Арониим» (アロニム); σύντριμμα καὶ σεισμός — «сокрушение и потрясение» (слав. «сотрение и трус»)."
  6: "τὸ ὕδωρ τῆς Νεμριμ — «вода Немрима» (ネムリム); ἔρημον ἔσται — «будет пустынно, безводно» (涸れる); ὁ χόρτος αὐτῆς ἐκλείψει — «трава её оскудеет, исчезнет» (絶える); χόρτος χλωρός — «трава зелёная» (青い草)."
  7: "μὴ καὶ οὕτως μέλλει σωθῆναι — «неужели и так имеет спастись» (それでも救われるのだろうか); ἐπάξω γὰρ ἐπὶ τὴν φάραγγα Ἄραβας — «ибо наведу на ущелье аравитян» (谷にアラビア人を導き入れる); φάραγξ — «ущелье, долина»; λήμψονται αὐτήν — «возьмут её». Стих понят как речь Господа (первое лицо ἐπάξω), поэтому целиком в 「」; в LXX границы речи не отмечены."
  8: "συνῆψεν ἡ βοὴ τὸ ὅριον τῆς Μωαβίτιδος — «достиг вопль предела Моавитиды» (国境のアガリムにまで届く); ὅριον — «предел, граница». Αγαλλιμ — アガリム; ὀλολυγμὸς αὐτῆς — «вопль, рыдание её» (泣き声); ἕως τοῦ φρέατος τοῦ Αιλιμ — «до колодца Аилим» (アイリムの井戸); φρέαρ — «колодец»."
  9: "τὸ ὕδωρ τὸ Ρεμμων — «вода Реммона» (レモン; слав. читает «Димон» — иное чтение, не внесено, имя дано по LXX). πλησθήσεται αἵματος — «наполнится крови»; ἐπάξω ἐπὶ Ρεμμων Ἄραβας — «наведу на Реммон аравитян»; ἀρῶ τὸ σπέρμα Μωαβ — «возьму, унесу семя Моава» (取り去る); Αριηλ — アリエル; κατάλοιπον Αδαμα — «остаток Адамы» (アダマ). Стих — речь Господа (ἐπάξω, ἀρῶ), целиком в 「」."
