# jp-box, Исаия, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 15 нет (фрагменты книги — 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: 1 надписание и ночная гибель Моава; 2–4 плач Дивона, Нево, Есевона, Елеалы
# и Иассы; 5–8 бегство к Сигору, дорога Арониим, воды Немрим, вопль до Агаллима;
# 9 воды Реммона и суд над остатком. Поэзия, параллелизмы сохранены.
# Прямая речь: 15:7 и 15:9 — слова Господа от первого лица (ἐπάξω, ἀρῶ), даны в 「…」;
# в LXX границы речи не отмечены, поэтому стихи целиком поняты как речь Господа.
# Остальное — плач пророка без кавычек. Красного и синего нет.
# Нумерация по gr: 9 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет. Слав. добавления: в 15:1 у слав. нет надписания «Слово о Моаве» — внесено
# по LXX; в 15:3 слав. повторяет «на стогнах его» — внесено (その広場でも).
# Сносок ⟨…⟩ нет: 城壁, 祭壇, 粗布, 井戸, 涸れる уже в корпусе.
# Имена — транслитерация греческого (LXX): モアブ, ディボン, ネボ, エセボン, エレアレ,
# ヤッサ, ツォアル, ルヒト, アロニム, ネムリム, アガリム, アイリム, レモン, アリエル, アダマ.

