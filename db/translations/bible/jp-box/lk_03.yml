# jp-box, Евангелие от Луки, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: проповедь Иоанна (1–20), крещение Иисуса (21–22), родословие (23–38).
# Слов Христа в главе нет — красного нет; синего нет. jp-ni не использовался.
# Родословие идёт от Иисуса к Адаму (обратно Мф 1), поэтому формула «AはBの子».

tr_code: jp-box
book: lk
chapter: 3
draft: true

verses:
  1: "皇帝[こうてい]ティベリウスの在位[ざいい]十五年[じゅうごねん]、ポンティオ・ピラトがユダヤの総督[そうとく]、ヘロデがガリラヤの領主[りょうしゅ]、その兄弟[きょうだい]ピリポがイトゥラヤとトラコニティスの地方[ちほう]の領主[りょうしゅ]、リサニアがアビレネの領主[りょうしゅ]であったとき、"
  2: "アンナスとカヤパが大祭司[だいさいし]であったとき、神[かみ]の言葉[ことば]が荒[あ]れ野[の]でザカリヤの子[こ]ヨハネに臨[のぞ]んだ。"
  3: "ヨハネはヨルダン川[がわ]の周辺[しゅうへん]一帯[いったい]を巡[めぐ]り、罪[つみ]の赦[ゆる]しに至[いた]る悔[く]い改[あらた]めの洗礼[せんれい]を宣[の]べ伝[つた]えた。"
  4: "預言者[よげんしゃ]イザヤの言葉[ことば]の書[しょ]に書[か]かれているとおりである。「荒[あ]れ野[の]に叫[さけ]ぶ者[もの]の声[こえ]がする。『主[しゅ]の道[みち]を整[ととの]えよ。その小道[こみち]をまっすぐにせよ。』"
  5: "すべての谷[たに]は埋[う]められ、すべての山[やま]と丘[おか]は低[ひく]くされ、曲[ま]がった所[ところ]はまっすぐに、険[けわ]しい道[みち]は平[たい]らかにされる。"
  6: "そして、すべての肉[にく]なる者[もの]が、神[かみ]の救[すく]いを見[み]る。」"
  7: "ヨハネは、洗礼[せんれい]を受[う]けに来[き]た群衆[ぐんしゅう]たちに言[い]った。「蝮[まむし]の子[こ]らよ。迫[せま]り来[く]る怒[いか]りを逃[のが]れることを、だれがあなたがたに教[おし]えたのか。"
  8: "だから、悔[く]い改[あらた]めにふさわしい実[み]を結[むす]べ。『わたしたちには父[ちち]アブラハムがいる』と心[こころ]の中[なか]で言[い]い始[はじ]めてはならない。あなたがたに言[い]っておく。神[かみ]はこの石[いし]ころからでも、アブラハムのために子[こ]を起[お]こすことができる。"
  9: "斧[おの]はすでに木[き]の根[ね]もとに置[お]かれている。良[よ]い実[み]を結[むす]ばない木[き]は残[のこ]らず切[き]り倒[たお]され、火[ひ]の中[なか]へ投[な]げ込[こ]まれる。」"
  10: "群衆[ぐんしゅう]はヨハネに尋[たず]ねた。「では、わたしたちは何[なに]をすればよいのですか。」"
  11: "ヨハネは答[こた]えた。「二枚[にまい]の衣[ころも]を持[も]つ者[もの]は、持[も]たない者[もの]に分[わ]け与[あた]えなさい。食[た]べ物[もの]のある者[もの]も、同[おな]じようにしなさい。」"
  12: "徴税人[ちょうぜいにん]たちも洗礼[せんれい]を受[う]けに来[き]て、「先生[せんせい]、わたしたちは何[なに]をすればよいのですか」と尋[たず]ねた。"
  13: "ヨハネは彼[かれ]らに言[い]った。「決[き]められた以上[いじょう]のものは取[と]り立[た]てるな。」"
  14: "兵士[へいし]たちも同[おな]じように尋[たず]ねた。「わたしたちはどうすればよいのですか。」ヨハネは言[い]った。「だれかを脅[おびや]かして奪[うば]い取[と]ったり、偽[いつわ]って訴[うった]えたりしてはならない。自分[じぶん]の給料[きゅうりょう]で満足[まんぞく]していなさい。」"
  15: "民[たみ]は期待[きたい]を抱[いだ]き、ヨハネがもしかするとキリストではないかと、皆[みな]心[こころ]の中[なか]で思[おも]っていた。"
  16: "ヨハネは皆[みな]に答[こた]えて言[い]った。「わたしは水[みず]であなたがたに洗礼[せんれい]を授[さず]ける。しかし、わたしより強[つよ]い方[かた]が来[く]る。わたしは、その方[かた]の履物[はきもの]のひもを解[と]く値打[ねう]ちもない。その方[かた]は{聖霊[せいれい]|聖神[せいしん]}と火[ひ]で、あなたがたに洗礼[せんれい]をお授[さず]けになる。"
  17: "その方[かた]は手[て]に箕[み]を持[も]ち、脱穀場[だっこくじょう]をきれいにし、麦[むぎ]を倉[くら]に集[あつ]め、もみ殻[がら]は消[き]えることのない火[ひ]で焼[や]き払[はら]われる。」"
  18: "ヨハネはほかにも多[おお]くのことを勧[すす]めながら、民[たみ]に福音[ふくいん]を告[つ]げ知[し]らせた。"
  19: "ところが、領主[りょうしゅ]ヘロデは、兄弟[きょうだい]の妻[つま]ヘロディアのことや、自分[じぶん]が行[おこな]ったすべての悪[わる]いことについて、ヨハネに責[せ]められたので、"
  20: "そのうえ、すべてのことの上[うえ]に、ヨハネを牢[ろう]に閉[と]じ込[こ]めた。"
  21: "民[たみ]がすべて洗礼[せんれい]を受[う]けているとき、イエスも洗礼[せんれい]を受[う]け、祈[いの]っておられた。すると、天[てん]が開[ひら]き、"
  22: "{聖霊[せいれい]|聖神[せいしん]}が鳩[はと]のような姿[すがた]でイエスの上[うえ]に降[くだ]り、天[てん]から声[こえ]がした。「あなたはわたしの愛[あい]する子[こ]。わたしはあなたを喜[よろこ]びとする。」"
  23: "イエスが務[つと]めを始[はじ]めたのは、三十歳[さんじゅっさい]くらいのときであった。人々[ひとびと]はイエスをヨセフの子[こ]と思[おも]っていた。ヨセフはエリの子[こ]、"
  24: "エリはマタトの子[こ]、マタトはレビの子[こ]、レビはメルキの子[こ]、メルキはヤンナイの子[こ]、ヤンナイはヨセフの子[こ]、"
  25: "ヨセフはマタテアの子[こ]、マタテアはアモスの子[こ]、アモスはナホムの子[こ]、ナホムはエスリの子[こ]、エスリはナンガイの子[こ]、"
  26: "ナンガイはマハトの子[こ]、マハトはマタテアの子[こ]、マタテアはシメイの子[こ]、シメイはヨセクの子[こ]、ヨセクはヨダの子[こ]、"
  27: "ヨダはヨハナンの子[こ]、ヨハナンはレサの子[こ]、レサはゾロバベルの子[こ]、ゾロバベルはサラティエルの子[こ]、サラティエルはネリの子[こ]、"
  28: "ネリはメルキの子[こ]、メルキはアディの子[こ]、アディはコサムの子[こ]、コサムはエルマダムの子[こ]、エルマダムはエルの子[こ]、"
  29: "エルはイエスの子[こ]、イエスはエリエゼルの子[こ]、エリエゼルはヨリムの子[こ]、ヨリムはマタトの子[こ]、マタトはレビの子[こ]、"
  30: "レビはシメオンの子[こ]、シメオンはユダの子[こ]、ユダはヨセフの子[こ]、ヨセフはヨナムの子[こ]、ヨナムはエリアキムの子[こ]、"
  31: "エリアキムはメレアの子[こ]、メレアはメンナの子[こ]、メンナはマタタの子[こ]、マタタはナタンの子[こ]、ナタンはダビデの子[こ]、"
  32: "ダビデはエッサイの子[こ]、エッサイはオベドの子[こ]、オベドはボアズの子[こ]、ボアズはサラの子[こ]、サラはナアソンの子[こ]、"
  33: "ナアソンはアミナダブの子[こ]、アミナダブはアラムの子[こ]、アラムはエスロムの子[こ]、エスロムはファレスの子[こ]、ファレスはユダの子[こ]、"
  34: "ユダはヤコブの子[こ]、ヤコブはイサクの子[こ]、イサクはアブラハムの子[こ]、アブラハムはテラの子[こ]、テラはナホルの子[こ]、"
  35: "ナホルはセルクの子[こ]、セルクはラガウの子[こ]、ラガウはファレクの子[こ]、ファレクはエベルの子[こ]、エベルはサラの子[こ]、"
  36: "サラはカイナンの子[こ]、カイナンはアルファクサドの子[こ]、アルファクサドはセムの子[こ]、セムはノアの子[こ]、ノアはラメクの子[こ]、"
  37: "ラメクはメトセラの子[こ]、メトセラはエノクの子[こ]、エノクはヤレトの子[こ]、ヤレトはマレレエルの子[こ]、マレレエルはカイナンの子[こ]、"
  38: "カイナンはエノスの子[こ]、エノスはセトの子[こ]、セトはアダムの子[こ]、アダムは神[かみ]の子[こ]である。"

notes:
  1: "τετρααρχῶν — «четвертовластник»; передал 領主, ἡγεμονία — 在位, ἡγεμών — 総督 (как в 2:2). Имена: ティベリウス, ピラト, ヘロデ, ピリポ, リサニア."
  2: "ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα — «при первосвященнике Анне и Каиафе»; 大祭司. Анна уже не занимал должность, но сохранял влияние — в тексте оба названы."
  3: "βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν — «крещение покаяния для прощения грехов»; 罪の赦しに至る悔い改めの洗礼."
  5: "Ис 40:4. У Луки цитата продолжена до «всякая плоть» (3:6); ср. Мф 3:3, где она короче."
  6: "πᾶσα σάρξ — «всякая плоть»; すべての肉なる者, без замены на «люди»."
  8: "μὴ ἄρξησθε λέγειν — «не начинайте говорить»; 言い始めてはならない."
  9: "ἀξίνη — «топор»; 斧. Стихи 7–9 параллельны Мф 3:7–10, но набраны независимо."
  11: "χιτών — нижняя одежда; 衣 (не верхняя 上着)."
  14: "διασείειν — «вымогать угрозой», συκοφαντεῖν — «ложно обвинять»; 脅かして奪い取る / 偽って訴える. ὀψώνια — жалованье; 給料."
  15: "μήποτε αὐτὸς εἴη ὁ Χριστός — «не он ли Христос»; キリストではないか."
  16: "ἱμάς — ремень, завязка обуви; 履物のひも."
  19: "Ἡρωδιάς — Иродиада, жена брата Ирода; ヘロディア. ὃν ἔκλεισεν — 牢に閉じ込めた."
  23: "ὡς ἐνομίζετο — «как думали»; 人々は…と思っていた. Родословие Луки идёт от Иисуса к Адаму (обратно Мф 1), поэтому формула «AはBの子»."
  27: "Ζοροβαβέλ — ゾロバベル (греческая форма); в Мф 1:12 — ゼルバベル."
  33: "В критической базе между Аминадавом и Есромом стоят Ἀδμίν и Ἀρνί; церковный текст (Елизаветинская, jp-joc「アラム」) читает Ἀράμ — взято церковное чтение, как в Мф 1:3–4 (разночтение имени, без 〔〕)."
  38: "τοῦ θεοῦ — «Божий»; 神の子. Родословие кончается на Адаме, а не на Аврааме, как у Матфея."
