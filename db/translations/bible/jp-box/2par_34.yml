verses:
  1: "ヨシヤは八歳[さい]で王[おう]となり、エルサレムで三十一年[さんじゅういちねん]治[おさ]めた。"
  2: "彼[かれ]は主[しゅ]の目[め]に正[ただ]しいことを行[おこな]い、父[ちち]ダビデの道[みち]を歩[あゆ]み、右[みぎ]にも左[ひだり]にもそれなかった。"
  3: "治世[ちせい]の第八年目[だいはちねんめ]、彼[かれ]はまだ幼[おさな]かったが、父[ちち]ダビデの神[かみ]である主[しゅ]を尋[たず]ね求[もと]め始[はじ]めた。治世の第十二年目[だいじゅうにねんめ]には、ユダとエルサレムから高[たか]い所[ところ]とアシェラの木立[こだち]、および鋳物[いもの]の像[ぞう]を除[のぞ]き去[さ]り始[はじ]めた。"
  4: "彼[かれ]の前[まえ]でバアルの祭壇[さいだん]とその上[うえ]の高[たか]い所[ところ]が打[う]ち壊[こわ]され、アシェラの木立[こだち]が切[き]り倒[たお]され、彫[ほ]り物[もの]と鋳物[いもの]が砕[くだ]かれ、細[こま]かくされて、それらにいけにえをささげた者[もの]たちの墓[はか]の前[まえ]にまかれた。"
  5: "また、祭司[さいし]たちの骨[ほね]を祭壇[さいだん]の上[うえ]で焼[や]き、ユダとエルサレムを清[きよ]めた。"
  6: "また、エフライム、マナセ、シメオン、ナフタリの町[まち]々[まち]と、その周[まわ]りのすべての場所[ばしょ]でも、"
  7: "彼[かれ]はアシェラの木立[こだち]と祭壇[さいだん]を打[う]ち壊[こわ]し、偶像[ぐうぞう]を細[こま]かく砕[くだ]き、イスラエルの全土[ぜんど]の高[たか]い所[ところ]をすべて切[き]り倒[たお]して、エルサレムに戻[もど]った。"
  8: "治世[ちせい]の第十八年目[だいじゅうはちねんめ]、すなわち地[ち]と神殿[しんでん]を清[きよ]めた後[あと]、彼[かれ]はエセリヤの子[こ]シャファン、町[まち]の長[かしら]マアセヤ、およびヨアハズの子[こ]ヨア、すなわち自分の記録官[きろくかん]を遣[つか]わして、自分の神[かみ]である主[しゅ]の家[いえ]を固[かた]く修復[しゅうふく]させた。"
  9: "彼[かれ]らは大祭司[だいさいし]ヒルキヤのもとへ行[い]き、神[かみ]の家[いえ]に持[も]ち込[こ]まれた銀[ぎん]を渡[わた]した。それは、門[もん]を守[まも]るレビ人[びと]たちが、マナセとエフライム、すべての長[かしら]たち、イスラエルの残[のこ]りのすべて、ユダとベニヤミンの子[こ]ら、エルサレムの住民[じゅうみん]から集[あつ]めたものであった。"
  10: "彼[かれ]らはそれを主[しゅ]の家[いえ]に任[まか]された工事[こうじ]をする者[もの]たちの手[て]に渡[わた]した。それは、主の家で働[はたら]く者[もの]たちに渡され、家[いえ]を修復[しゅうふく]して強[つよ]くするために用[もち]いられた。"
  11: "すなわち、大工[だいく]と建築[けんちく]する者[もの]たちに、四角[しかく]に切[き]った石[いし]と、ユダの王[おう]たちが壊[こわ]した家[いえ]を屋根[やね]で覆[おお]うための梁[はり]の木材[もくざい]を買[か]わせるためであった。"
  12: "この人[ひと]々[びと]は誠実[せいじつ]に工事[こうじ]に当[あ]たった。彼[かれ]らの上[うえ]には、メラリの子[こ]らであるレビ人[びと]のイエトとアブディヤ、カアトの子らであるザカリヤとモソラムが監督[かんとく]として置[お]かれ、歌[うた]の楽器[がっき]に通[つう]じたレビ人は、すべて楽器[がっき]を奏[かな]でる者[もの]であった。"
  13: "また、荷[に]を運[はこ]ぶ者[もの]たちの上[うえ]に、またあらゆる仕事[しごと]に携[たずさ]わるすべての者[もの]の上に、レビ人[びと]たちのうちから書記[しょき]と裁判官[さいばんかん]と門番[もんばん]が置[お]かれた。"
  14: "彼[かれ]らが主[しゅ]の家[いえ]に持[も]ち込[こ]まれた銀[ぎん]を運[はこ]び出[だ]すとき、祭司[さいし]ヒルキヤは、モーセの手[て]による主の律法[りっぽう]の書[しょ]を見[み]つけた。"
  15: "ヒルキヤは答[こた]えて書記[しょき]シャファンに言[い]った。「わたしは主[しゅ]の家[いえ]で律法[りっぽう]の書[しょ]を見[み]つけた。」ヒルキヤはその書[しょ]をシャファンに渡[わた]した。"
  16: "シャファンはその書[しょ]を王[おう]のもとへ持[も]って行[い]き、さらに王に報告[ほうこく]して言[い]った。「あなたのしもべたちの手[て]に渡[わた]された銀[ぎん]はすべて、仕事[しごと]をする者[もの]たちの手に渡[わた]されている。"
  17: "また、主[しゅ]の家[いえ]で見[み]つかった銀はまとめられ、監督[かんとく]たちの手[て]と、仕事をする者[もの]たちの手に渡[わた]された。」"
  18: "書記[しょき]シャファンは王[おう]に告[つ]げて言[い]った。「祭司[さいし]ヒルキヤがわたしに書[しょ]を渡[わた]した。」そしてシャファンは王の前[まえ]でそれを読[よ]み上[あ]げた。"
  19: "王[おう]は律法[りっぽう]の言葉[ことば]を聞[き]くと、自分[じぶん]の衣[ころも]を裂[さ]いた。"
  20: "王[おう]はヒルキヤ、シャファンの子[こ]アヒカム、ミカヤの子[こ]アブドン、書記[しょき]シャファン、王のしもべアサヤに命[めい]じて言[い]った。"
  21: "「行[い]って、わたしのため、イスラエルとユダに残[のこ]ったすべての者[もの]のために、見[み]つかったこの書[しょ]の言葉[ことば]について主[しゅ]に尋[たず]ねなさい。主の怒[いか]りはわたしたちに対[たい]して大[おお]きく燃[も]え上[あ]がっているからである。父[ちち]たちがこの書に書[か]かれているすべてのことに従[したが]って行[おこな]わず、主の言葉に聞[き]き従[したが]わなかったからである。」"
  22: "ヒルキヤと、王[おう]が遣[つか]わした者[もの]たちは、預言者[よげんしゃ]フルダのもとへ行[い]った。彼女[かのじょ]は衣[ころも]を守[まも]る者[もの]シャルムの妻[つま]で、シャルムはテクワの子[こ]、ハルハスの子[こ]である。彼女はエルサレムのマセナに住[す]んでいた。彼らはこのことについて彼女に語[かた]った。"
  23: "彼女[かのじょ]は彼[かれ]らに言[い]った。「イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。わたしのもとへあなたがたを遣[つか]わした人[ひと]に言[い]いなさい。"
  24: "『主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの場所[ばしょ]とそこに住[す]む者[もの]たちに災[わざわ]いをもたらす。すなわち、ユダの王[おう]の前[まえ]で読[よ]まれた書[しょ]に書[か]かれているすべての言葉[ことば]である。"
  25: "彼[かれ]らがわたしを捨[す]て、ほかの神々[かみがみ]に香[こう]をたき、自分[じぶん]の手[て]のわざのすべてによってわたしを怒[いか]らせたからである。わたしの怒[いか]りはこの場所[ばしょ]に燃[も]え上[あ]がり、消[き]えることはない。』"
  26: "また、あなたがたを遣[つか]わして主[しゅ]に尋[たず]ねさせたユダの王[おう]には、こう言[い]いなさい。『イスラエルの神[かみ]である主はこう言われる。あなたが聞[き]いた言葉[ことば]については、"
  27: "あなたの心[こころ]が柔[やわ]らかになり、あなたがこの場所[ばしょ]とそこに住[す]む者[もの]たちについてのわたしの言葉[ことば]を聞[き]いて、わたしの前[まえ]で身[み]を低[ひく]くしたからである。あなたはわたしの前で身を低くし、衣[ころも]を裂[さ]き、わたしの前で泣[な]いた。それゆえ、わたしもまた聞[き]いた、と主[しゅ]は言[い]われる。"
  28: "見[み]よ、わたしはあなたをあなたの父[ちち]たちに加[くわ]える。あなたは平和[へいわ]のうちに墓[はか]に加えられ、わたしがこの場所[ばしょ]とそこに住[す]む者[もの]たちにもたらすすべての災[わざわ]いを、あなたの目[め]は見[み]ることがない。』」そして彼[かれ]らは王[おう]にこの言葉[ことば]を伝[つた]えた。"
  29: "王[おう]は人[ひと]を遣[つか]わし、ユダとエルサレムのすべての長老[ちょうろう]たちを集[あつ]めた。"
  30: "王[おう]は主[しゅ]の家[いえ]に上[のぼ]り、ユダのすべての者[もの]、エルサレムの住民[じゅうみん]、祭司[さいし]たち、レビ人[びと]たち、および大[おお]きい者[もの]から小[ちい]さい者[もの]まで民[たみ]のすべてが、王とともに上[のぼ]った。そして王は彼[かれ]らの耳[みみ]に、主の家で見[み]つかった契約[けいやく]の書[しょ]のすべての言葉[ことば]を読[よ]み聞[き]かせた。"
  31: "王[おう]は柱[はしら]のそばに立[た]ち、主[しゅ]の前[まえ]で契約[けいやく]を結[むす]んで、主に従[したが]って歩[あゆ]み、心[こころ]を尽[つ]くし、魂[たましい]を尽くして、主の戒[いまし]めと証[あかし]と掟[おきて]を守[まも]り、この書[しょ]に書[か]かれている契約の言葉[ことば]を行[おこな]うことを誓[ちか]った。"
  32: "そして、エルサレムとベニヤミンにいるすべての者[もの]を、その契約[けいやく]に立[た]たせた。エルサレムの住民[じゅうみん]は、父祖[ふそ]の神[かみ]である主[しゅ]の家[いえ]で契約を行[おこな]った。"
  33: "ヨシヤは、イスラエルの子[こ]らのものであるすべての地[ち]から、すべての忌[い]まわしいもの[もの]を取[と]り除[のぞ]き、エルサレムとイスラエルにいるすべての者[もの]に、彼[かれ]らの神[かみ]である主[しゅ]に仕[つか]えさせた。彼[かれ]はそのすべての日[ひ]々[び]、父祖[ふそ]の神である主から離[はな]れなかった。"

notes:
  1: "Υἱὸς ὀκτὼ ἐτῶν — «сын восьми лет», т. е. восьми лет; τριάκοντα ἓν ἔτος — тридцать один год; в 4 Цар 22:1 те же числа, там же названа мать (Едида), в 2 Пар она не упомянута."
  2: "τὸ εὐθὲς ἐναντίον κυρίου — правое пред Господом (εὐθύς); ἐπορεύθη ἐν ὁδοῖς Δαυιδ — ходил путями Давида; οὐκ ἐξέκλινεν δεξιὰ καὶ ἀριστερά — не уклонялся ни направо, ни налево (ἐκκλίνω); ср. 4 Цар 22:2."
  3: "ἐν τῷ ὀγδόῳ ἔτει — в восьмой год; καὶ αὐτὸς ἔτι παιδάριον — «и он ещё отрок» (вставка в гр. тексте, отмечена тире); ἤρξατο τοῦ ζητῆσαι — начал искать (ζητέω); ἐν τῷ δωδεκάτῳ ἔτει — в двенадцатый год; καθαρίσαι — очистить; ἀπὸ τῶν ὑψηλῶν καὶ τῶν ἄλσεων καὶ ἀπὸ τῶν χωνευτῶν — от высот, рощ и литых [идолов]. В csl добавлено «и от капищ» — в тексте не отражено."
  4: "κατέσπασεν κατὰ πρόσωπον αὐτοῦ — низверг пред лицом его (в csl «разориша» — мн. ч.); τὰ θυσιαστήρια τῶν Βααλιμ — жертвенники Ваалов; ἔκοψεν τὰ ἄλση — вырубил рощи; συνέτριψεν — сокрушил; ἐλέπτυνεν — истончил, растёр (λεπτύνω); ἔρριψεν ἐπὶ πρόσωπον τῶν μνημάτων — бросил пред лицом гробниц; τῶν θυσιαζόντων αὐτοῖς — приносивших им жертвы. В csl добавлено «и растопи» — не переведено."
  5: "ὀστᾶ ἱερέων κατέκαυσεν ἐπὶ τὰ θυσιαστήρια — кости жрецов сжёг на жертвенниках (слав. «на олтарех их» — добавлено «их»); ἐκαθάρισεν — очистил. Ср. 4 Цар 23:20."
  6: "ἐν πόλεσιν Εφραιμ καὶ Μανασση καὶ Συμεων καὶ Νεφθαλι — в городах Ефрема, Манассии, Симеона и Неффалима; κατὰ τοὺς τόπους αὐτῶν κύκλῳ — по местам их окрест. В LXX стих — обстоятельство без сказуемого (сказуемое в 7); порядок имён у csl иной (Манассия, Ефрем, Симеон, «даже до Неффалима»); в ru добавлено «опустошенных»."
  7: "κατέσπασεν τὰ ἄλση καὶ τὰ θυσιαστήρια — низверг рощи и жертвенники; κατέκοψεν λεπτά — изрубил мелко (κατακόπτω); πάντα τὰ ὑψηλά — все высоты; ἀπὸ πάσης τῆς γῆς Ισραηλ — со всей земли Израиля; ἀπέστρεψεν εἰς Ιερουσαλημ — возвратился в Иерусалим."
  8: "ἐν τῷ ὀκτωκαιδεκάτῳ ἔτει — в восемнадцатый год; τοῦ καθαρίσαι τὴν γῆν καὶ τὸν οἶκον — «очистить землю и дом» (инфинитив цели; слав. «егда очищена бысть земля и церковь» — пассив); ἀπέστειλεν τὸν Σαφαν — послал Шафана (シャファン, ср. 4 Цар 22:3); Μαασιαν ἄρχοντα τῆς πόλεως — Маасею, начальника города (町の長); Ιουαχ υἱὸν Ιωαχαζ τὸν ὑπομνηματογράφον — Иоаха, сына Иоахаза, дееписателя (ὑπομνηματογράφος, 記録官; слав. «памятописца»); κραταιῶσαι τὸν οἶκον — укрепить дом."
  9: "ἦλθον πρὸς Χελκιαν τὸν ἱερέα τὸν μέγαν — пришли к Хелкии, священнику великому (大祭司); τὸ ἀργύριον τὸ εἰσενεχθέν — серебро, внесённое; οἱ Λευῖται φυλάσσοντες τὴν πύλην — левиты, охраняющие дверь (слав. «хранящии дверь»); ἐκ χειρὸς Μανασση καὶ Εφραιμ — из руки Манассии и Ефрема, т. е. от них; ἀρχόντων — начальников; ἀπὸ παντὸς καταλοίπου — от всего остатка; οἰκούντων ἐν Ιερουσαλημ — живущих в Иерусалиме."
  10: "οἱ καθεσταμένοι ἐν οἴκῳ κυρίου — приставленные в доме Господнем; ἔδωκαν ἐπὶ χεῖρα — отдали в руки; ἐπισκευάσαι κατισχῦσαι τὸν οἶκον — исправить и укрепить дом (ἐπισκευάζω); в csl «да обновят и укрепят храм»."
  11: "τέκτονες — плотники, ремесленники (大工); οἰκοδόμοι — строители; λίθοι τετράπεδοι — четырёхугольные, тёсаные камни; ξύλα εἰς δοκούς — дерево на балки; στεγάσαι τοὺς οἴκους — покрыть дома; οὓς ἐξωλέθρευσαν βασιλεῖς Ιουδα — которые разорили цари Иудейские."
  12: "οἱ ἄνδρες ἐν πίστει ἐπὶ τῶν ἔργων — мужи при работах в верности, т. е. честно (слав. «верно творяху»); ἐπίσκοποι — надзиратели (監督); Ιεθ καὶ Αβδιας — Иахаф и Овадия; ἐξ υἱῶν Μεραρι — из сынов Мерари; Ζαχαριας καὶ Μοσολλαμ ἐκ τῶν υἱῶν Κααθ — Захария и Мешуллам из сынов Каафа; ἐπισκοπεῖν — надзирать; πᾶς Λευίτης πᾶς συνίων ἐν ὀργάνοις ᾠδῶν — всякий левит, разумеющий в музыкальных орудиях: сказуемое опущено, в csl добавлено «пети» — по паритету 奏でる者であった."
  13: "νωτοφόροι — носильщики (νωτοφόρος, «носящий на плечах»); ἐργασίᾳ καὶ ἐργασίᾳ — «работой и работой», т. е. всякой работой (слав. «всяким деланием»); γραμματεῖς καὶ κριταὶ καὶ πυλωροί — писцы, судьи и привратники (書記, 裁判官, 門番)."
  14: "ἐν τῷ ἐκφέρειν αὐτούς — когда они выносили (ἐκφέρω); τὸ εἰσοδιασθέν — внесённое (εἰσοδιάζω); εὗρεν Χελκιας ὁ ἱερεύς — нашёл Хелкия священник; βιβλίον νόμου κυρίου — книгу закона Господня (律法の書); διὰ χειρὸς Μωυσῆ — рукою Моисея; в csl скобочная вставка «(яже дана бысть)» — не переведена."
  15: "ἀπεκρίθη Χελκιας καὶ εἶπεν — ответил и сказал (семитизм); πρὸς Σαφαν τὸν γραμματέα — Шафану писцу (書記); Βιβλίον νόμου εὗρον — «книгу закона нашёл»; ἔδωκεν τὸ βιβλίον — дал книгу."
  16: "εἰσήνεγκεν τὸ βιβλίον πρὸς τὸν βασιλέα — внёс книгу к царю; ἀπέδωκεν ἔτι τῷ βασιλεῖ λόγον — дал ещё царю отчёт (ἀποδίδωμι λόγον; слав. «возвести еще ко царю слово»); Πᾶν τὸ δοθὲν ἀργύριον — всё данное серебро; ἐν χειρὶ τῶν παίδων σου — в руке рабов твоих; τῶν ποιούντων τὸ ἔργον — делающих работу. Стих обрывается, продолжение в 17; прямая речь закрывается в 17."
  17: "ἐχώνευσαν — расплавили, слили (χωνεύω; слав. «слияша»), т. е. собрали в одно; τὸ εὑρεθὲν ἐν οἴκῳ κυρίου — найденное в доме Господнем; ἐπὶ χεῖρα τῶν ἐπισκόπων — в руки надзирателей; ποιούντων ἐργασίαν — делающих работу."
  18: "ἀπήγγειλεν — возвестил (ἀπαγγέλλω); Βιβλίον ἔδωκέν μοι — «книгу дал мне» (без «закона», ср. 4 Цар 22:10); ἀνέγνω — прочитал (ἀναγινώσκω); ἐναντίον τοῦ βασιλέως — пред царём."
  19: "ἐγένετο ὡς ἤκουσεν — «и было, когда услышал»; τοὺς λόγους τοῦ νόμου — слова закона; διέρρηξεν τὰ ἱμάτια αὐτοῦ — разодрал одежды свои (διαρρήγνυμι)."
  20: "ἐνετείλατο — повелел (ἐντέλλομαι); τῷ Χελκια — Хелкии; Αχικαμ υἱῷ Σαφαν — Ахикаму, сыну Шафана; Αβδων υἱῷ Μιχαια — Абдону, сыну Михея; Σαφαν τῷ γραμματεῖ — Шафану писцу; Ασαια παιδὶ τοῦ βασιλέως — Асаии, слуге царскому (слав. «рабу цареву»); λέγων — «говоря», вводит речь 21."
  21: "Πορεύθητε ζητήσατε — пойдите, вопросите (два повелительных); περὶ ἐμοῦ — за меня; περὶ παντὸς τοῦ καταλειφθέντος — обо всём оставшемся; περὶ τῶν λόγων τοῦ βιβλίου — о словах книги (слав. «молитеся», «о словесех книги»); ἐκκέκαυται ἐν ἡμῖν — возжжён на нас (перфект ἐκκαίω); εἰσήκουσαν τῶν λόγων — послушали слов (слав. «послушаша словес»)."
  22: "πρὸς Ολδαν τὴν προφῆτιν — к Олде пророчице (フルダ, как 4 Цар 22:14); γυναῖκα Σελλημ υἱοῦ Θακουαθ υἱοῦ Χελλης — жену Шаллума, сына Тиквы, сына Хархаса; φυλάσσουσαν τὰς στολάς — «хранящую одежды» (στολή): причастие ж. р. согласовано с «жену», но по 4 Цар 22:14 и csl («ризохранителя») хранитель одежд — сам Шаллум, так и передано; в csl добавлено «хранящей заповеди» (τὰς ἐντολάς) — в тексте не отражено; ἐν μασανα — «во второй части» (евр. מִשְׁנֶה; слав. «в масане»)."
  23: "Οὕτως εἶπεν κύριος ὁ θεὸς Ισραηλ — так сказал Господь Бог Израилев; Εἴπατε τῷ ἀνδρὶ τῷ ἀποστείλαντι ὑμᾶς — скажите человеку, пославшему вас; в csl в конце стиха добавлено «сия рече Господь» (дублет) — не переведено; здесь открывается речь Хулды, внутри неё — слово Господа (『…』, 24–28)."
  24: "ἐπάγω κακά — навожу зло; ἐπὶ τὸν τόπον τοῦτον — на место сие; τοὺς πάντας λόγους τοὺς γεγραμμένους — все слова написанные; τῷ ἀνεγνωσμένῳ — прочитанном (перфект причастия ἀναγινώσκω); «и на жителей его» в csl добавлено — в LXX только «место»; по паритету そこに住む者たち."
  25: "ἀνθ᾿ ὧν — за то что; ἐγκατέλιπόν με — оставили Меня; ἐθυμίασαν θεοῖς ἀλλοτρίοις — кадили чужим богам (θυμιάω); παροργίσωσίν με — прогневать Меня; ἐν πᾶσιν τοῖς ἔργοις τῶν χειρῶν αὐτῶν — всеми делами рук своих; ἐξεκαύθη ὁ θυμός μου — возгорелся гнев Мой; οὐ σβεσθήσεται — не угаснет."
  26: "ἐπὶ βασιλέα Ιουδα — к царю Иуде (ἐπί с вин.); τὸν ἀποστείλαντα ὑμᾶς τοῦ ζητῆσαι — пославшего вас вопросить; οὕτως ἐρεῖτε αὐτῷ — так скажите ему; Τοὺς λόγους, οὓς ἤκουσας — слова, которые ты слышал: стих обрывается, продолжение в 27."
  27: "ἐνετράπη ἡ καρδία σου — смягчилось, устыдилось сердце твоё (ἐντρέπω); ἐταπεινώθης ἀπὸ προσώπου μου — смирился пред лицом Моим; ἐν τῷ ἀκοῦσαί σε — когда ты услышал; ἐπὶ τὸν τόπον τοῦτον καὶ ἐπὶ τοὺς κατοικοῦντας αὐτόν — о месте сем и живущих в нём; ἐταπεινώθης ἐναντίον μου — повтор (в слав. тоже дважды); διέρρηξας τὰ ἱμάτιά σου — разодрал одежды; ἔκλαυσας κατεναντίον μου — плакал предо Мною; ἐγὼ ἤκουσά φησιν κύριος — «Я услышал, говорит Господь»."
  28: "προστίθημί σε πρὸς τοὺς πατέρας σου — приложу тебя к отцам твоим; προστεθήσῃ πρὸς τὰ μνήματά σου ἐν εἰρήνῃ — приложишься к гробницам твоим в мире (слав. «ко гробом твоим»); οὐκ ὄψονται οἱ ὀφθαλμοί σου — не увидят глаза твои; ἀπέδωκαν τῷ βασιλεῖ λόγον — принесли царю ответ; в конце стиха в gr редакторское тире."
  29: "ἀπέστειλεν ὁ βασιλεύς — послал царь; συνήγαγεν — собрал; τοὺς πρεσβυτέρους Ιουδα καὶ Ιερουσαλημ — старейшин Иуды и Иерусалима (長老)."
  30: "ἀνέβη εἰς οἶκον κυρίου — взошёл в дом Господень; πᾶς Ιουδα — весь Иуда (слав. «вси мужие иудины» — мужи); οἱ ἱερεῖς καὶ οἱ Λευῖται — священники и левиты; ἀπὸ μεγάλου ἕως μικροῦ — от великого до малого; ἀνέγνω ἐν ὠσὶν αὐτῶν — прочитал вслух их (ἐν ὠσίν); βιβλίου τῆς διαθήκης — книги завета (契約の書); τοῦ εὑρεθέντος ἐν οἴκῳ κυρίου — найденной в доме Господнем."
  31: "ἔστη ἐπὶ τὸν στῦλον — стал на столпе (στῦλος; слав. «на столпе»; в ru «на месте своем» — по МТ); διέθετο διαθήκην — заключил завет (διατίθημι); τοῦ πορευθῆναι ἐνώπιον κυρίου — ходить пред Господом; φυλάσσειν τὰς ἐντολὰς αὐτοῦ καὶ μαρτύρια καὶ προστάγματα — соблюдать заповеди, откровения (μαρτύρια, 証) и повеления (掟); ἐν ὅλῃ καρδίᾳ καὶ ἐν ὅλῃ ψυχῇ — всем сердцем и всею душою; τοὺς λόγους τῆς διαθήκης τοὺς γεγραμμένους — слова завета написанные."
  32: "ἔστησεν πάντας τοὺς εὑρεθέντας — поставил всех находившихся (в смысле обязал); ἐν Ιερουσαλημ καὶ Βενιαμιν — в Иерусалиме и Вениамине; ἐποίησαν … διαθήκην — заключили завет; ἐν οἴκῳ κυρίου θεοῦ πατέρων αὐτῶν — в доме Господа, Бога отцов их."
  33: "περιεῖλεν τὰ πάντα βδελύγματα — убрал все мерзости; ἐκ πάσης τῆς γῆς, ἣ ἦν υἱῶν Ισραηλ — из всей земли, которая была сынов Израилевых; ἐποίησεν … τοῦ δουλεύειν — заставил служить (каузатив); πάσας τὰς ἡμέρας αὐτοῦ — во все дни его; οὐκ ἐξέκλινεν ἀπὸ ὄπισθεν κυρίου — не уклонился от Господа (ед. ч., об Иосии; в ru мн. ч. «они не отступали»)."
