# jp-box, Второе послание к Коринфянам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), благодарение и утешение в скорби (3–11),
# почему Павел не пришёл раньше (12–24): легкость в обещаниях, «да» и «нет», печать Духа.
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 1:6 — церковное καὶ σωτηρίας во втором члене (в базе σωτηρίας только в первом).
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 1
draft: true

verses:
  1: "パウロ、神[かみ]の御心[みこころ]によるキリスト・イエスの使徒[しと]、および兄弟[きょうだい]テモテは、コリントにある神[かみ]の教会[きょうかい]、ならびにアカイア全土[ぜんど]にいるすべての聖[せい]なる者[もの]たちに。"
  2: "{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]が、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、あなたがたにありますように。"
  3: "わたしたちの主[しゅ]イエス・キリストの父[ちち]である神[かみ]、憐[あわ]れみの父[ちち]、すべての慰[なぐさ]めの神[かみ]は、ほめたたえられる方[かた]である。"
  4: "神[かみ]は、わたしたちのすべての苦難[くなん]においてわたしたちを慰[なぐさ]め、わたしたち自身[じしん]が神[かみ]から受[う]ける慰[なぐさ]めによって、すべての苦難[くなん]の中[なか]にある者[もの]たちを慰[なぐさ]めることができるようにしてくださる。"
  5: "なぜなら、キリストの苦[くる]しみがわたしたちのうちに満[み]ちあふれるように、キリストによってわたしたちの慰[なぐさ]めも満[み]ちあふれるからである。"
  6: "わたしたちが苦難[くなん]を受[う]けるのも、あなたがたの慰[なぐさ]めと救[すく]いのためであり、慰[なぐさ]めを受[う]けるのも、あなたがたの慰[なぐさ]め〔と救[すく]い〕のためである。その慰[なぐさ]め〔と救[すく]い〕は、あなたがたが、わたしたちも苦[くる]しんでいる同[おな]じ苦難[くなん]を耐[た]え忍[しの]ぶ中[なか]で働[はたら]いているのである。"
  7: "そして、あなたがたについてのわたしたちの希望[きぼう]は確[かく]かである。あなたがたがわたしたちの苦[くる]しみにあずかる者[もの]であるように、慰[なぐさ]めにもあずかる者[もの]であることを知[し]っているからである。"
  8: "なぜなら、兄弟[きょうだい]たちよ、わたしたちは、アシアでわたしたちに起[お]こった苦難[くなん]について、あなたがたに知[し]らないでいてほしくはない。わたしたちは、力[ちから]を超[こ]えてはなはだしく圧[お]しつぶされ、生[い]きる望[のぞ]みさえも失[うしな]うほどであった。"
  9: "実際[じっさい]、わたしたちは自分自身[じぶんじしん]のうちに死[し]の宣告[せんこく]を受[う]けた。自分自身[じぶんじしん]を頼[たの]みとせず、死[し]者[しゃ]を復活[ふっかつ]させる神[かみ]を頼[たの]みとするためであった。"
  10: "神[かみ]は、これほどの死[し]からわたしたちを救[すく]い出[だ]し、今[いま]も救[すく]い出[だ]してくださる。わたしたちはこの方[かた]に希望[きぼう]を置[お]いている。この方[かた]はなおも救[すく]い出[だ]してくださる。"
  11: "あなたがたもまた、わたしたちのために祈[いの]って、わたしたちと共[とも]に働[はたら]いてくれる。それは、多[おお]くの人[ひと]々[びと]を通[とお]してわたしたちに与[あた]えられた賜物[たまもの]のゆえに、多[おお]くの人[ひと]々[びと]からわたしたちのために感謝[かんしゃ]がささげられるためである。"
  12: "なぜなら、わたしたちの誇[ほこ]りはこれである。すなわち、わたしたちの良心[りょうしん]の証[あかし]である。わたしたちは、神[かみ]に対して純朴[じゅんぼく]で誠実[せいじつ]な心[こころ]をもって、肉[にく]の知恵[ちえ]によってではなく、神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}によって、世[よ]にあって、とりわけあなたがたに対して歩[あゆ]んできたのである。"
  13: "なぜなら、わたしたちがあなたがたに書[か]いているのは、あなたがたが読[よ]み、また悟[さと]っていることのほかではない。わたしは、あなたがたが終[お]わりまで悟[さと]るようになることを希望[きぼう]している。"
  14: "あなたがたも、わたしたちをいくらかは悟[さと]ったとおりである。すなわち、主[しゅ]イエスの日[ひ]に、わたしたちがあなたがたの誇[ほこ]りであり、あなたがたもわたしたちの誇[ほこ]りである。"
  15: "わたしはこの確信[かくしん]をもって、あなたがたが二度目[にどめ]の{恵[めぐ]み|恩寵[おんちょう]}を受[う]けるために、まずあなたがたのところへ行[い]こうと思[おも]っていた。"
  16: "そして、あなたがたを通[とお]ってマケドニアへ行[い]き、またマケドニアからあなたがたのところへ戻[もど]り、あなたがたにユダヤへ送[おく]り出[だ]してもらうためであった。"
  17: "そこで、このように企[くわだ]てたとき、わたしは軽率[けいそつ]に振[ふ]る舞[ま]ったのだろうか。それとも、わたしが企[くわだ]てていることを肉[にく]に従[したが]って企[くわだ]てているので、わたしのもとで「はい、はい」と「いいえ、いいえ」が共[とも]にあるためなのだろうか。"
  18: "しかし、神[かみ]は信実[しんじつ]である。あなたがたに対するわたしたちの言葉[ことば]は、「はい」と「いいえ」ではない。"
  19: "というのは、神[かみ]の子[こ]イエス・キリスト、すなわち、わたしたち、つまりわたしとシルワノとテモテによってあなたがたの間[あいだ]に宣[の]べ伝[つた]えられた方[かた]は、「はい」と「いいえ」にはならなかった。この方[かた]において「はい」となったのである。"
  20: "なぜなら、神[かみ]の約束[やくそく]はすべて、この方[かた]において「はい」となるからである。それゆえ、この方[かた]によって、わたしたちを通[とお]して神[かみ]に「アーメン」が唱[とな]えられ、神[かみ]に栄光[えいこう]が帰[き]されるのである。"
  21: "わたしたちをあなたがたとともにキリストにあって確[かく]かなものとし、わたしたちに油[あぶら]を注[そそ]がれた方[かた]は、神[かみ]である。"
  22: "神[かみ]はまた、わたしたちに印[いん]を押[お]し、霊[れい]を保証[ほしょう]としてわたしたちの心[こころ]に与[あた]えられた。"
  23: "わたしは、自分[じぶん]の魂[たましい]に対して神[かみ]を証人[しょうにん]として呼[よ]び求[もと]める。あなたがたを惜[お]しんで、わたしはこれ以上[いじょう]コリントへ行[い]かなかったのである。"
  24: "それは、わたしたちがあなたがたの信仰[しんこう]を支配[しはい]しているからではない。わたしたちは、あなたがたの喜[よろこ]びのために共[とも]に働[はたら]く者[もの]なのである。あなたがたは信仰[しんこう]によって立[た]っているからである。"

notes:
  1: "Χριστοῦ Ἰησοῦ — порядок «Христос Иисус», как в греч.: キリスト・イエス. διὰ θελήματος θεοῦ — 神の御心による. ἀδελφός — 兄弟 (о Тимофее). Ἀχαΐα — アカイア."
  3: "ὁ πατὴρ τῶν οἰκτιρμῶν — «Отец милосердии»; 憐れみの父. θεὸς πάσης παρακλήσεως — すべての慰めの神; цепь παράκλησις (慰め) сохранена в 3–7."
  4: "παρακαλῶν ἐπὶ πάσῃ τῇ θλίψει — «утешающий при всякой скорби»; すべての苦難において慰め. θλῖψις — 苦難 (как в Рим 5:3), πάθημα — 苦しみ."
  5: "παθήματα τοῦ Χριστοῦ — キリストの苦しみ; περισσεύει — 満ちあふれる."
  6: "Во втором члене церковный текст (Елизаветинская, jp-joc) читает καὶ σωτηρίας; в базе σωτηρίας только в первом члене (проверено: 1 вхождение, во втором — 0) — 〔と救い〕 (дважды, включая относительное предложение). θλίψις — 苦難, πάσχω — 苦しむ."
  7: "κοινωνοὶ τῶν παθημάτων — 苦しみにあずかる者; ἐλπίς — 希望."
  8: "ἀγνοεῖν — не знать; καθ᾽ ὑπερβολὴν ὑπὲρ δύναμιν — сверх меры и сверх силы; ἐξαπορηθῆναι καὶ τοῦ ζῆν — 生きる望みさえ失う."
  9: "ἀπόκριμα τοῦ θανάτου — «приговор смерти»; 死の宣告. ἐγείρειν τοὺς νεκρούς — 死者を復活させる."
  10: "τηλικούτων θανάτων — «стольких смертей»; これほどの死. ῥύσεται — 救い出す (трижды, включая надежду)."
  11: "συνυπουργούντων — «содействующих»; 共に働く. πρόσωπα — 人々; χάρισμα — 賜物."
  12: "καύχησις — 誇り; ἁπλότης — 純朴, εἰλικρίνεια — 誠実; ἀνεστράφημεν — 歩んできた."
  13: "ἀναγινώσκειν / ἐπιγινώσκειν — 読む / 悟る; ἕως τέλους — 終わりまで."
  14: "В базе τοῦ κυρίου Ἰησοῦ; церковный текст полнее («Господа нашего Иисуса Христа»), но оставлено по базе, как 1 Кор 5:5. καύχημα — 誇り."
  15: "πεποίθησις — 確信; δευτέρα χάρις — 二度目の恵み."
  17: "ἐλαφρίᾳ — 軽率; τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ — «да, да» и «нет, нет»; оба вопроса сохранены."
  18: "πιστὸς ὁ θεός — 神は信実; Ναὶ καὶ Οὔ — «да» и «нет»."
  19: "Σιλουανός — シルワノ; Ναὶ ἐν αὐτῷ γέγονεν — この方において「はい」となった."
  20: "ἐπαγγελίαι — 約束; τὸ Ἀμὴν — アーメン; πρὸς δόξαν — 栄光のために."
  21: "βεβαιῶν — 確かなものとし; χρίσας — 油を注がれた."
  22: "σφραγισάμενος — 印を押し; ἀρραβών — 保証 (залог)."
  23: "μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν — 自分の魂に対して神を証人として呼び求める; φειδόμενος — 惜しんで."
  24: "κυριεύειν — 支配する; συνεργοί — 共に働く者."
