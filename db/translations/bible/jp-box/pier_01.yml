verses:
  1: "どうして、民[たみ]の多[おお]かった都[みやこ]が、ひとり座[すわ]っているのか。諸国[しょこく]のうちで多かった者[もの]が、寡婦[かふ]のようになった。国々[くにぐに]を治[おさ]めていた者[もの]が、貢[みつ]ぎを納[おさ]める者[もの]となった。"
  2: "夜[よる]のうちに、彼女[かのじょ]は泣[な]きに泣[な]いた。その涙[なみだ]は頬[ほお]に流[なが]れる。彼女を愛[あい]したすべての者[もの]のうちに、慰[なぐさ]める者[もの]はいない。親[した]しくしていた者[もの]たちはみな、彼女を裏切[うらぎ]り、敵[てき]となった。"
  3: "ユダはその卑[ひく]さと、重[おも]い奴隷[どれい]の務[つと]めのゆえに、移[うつ]された。諸国[しょこく]の民[たみ]の間[あいだ]に住[す]んでも、安[やす]らぎを見[み]いだせない。追[お]い求[もと]める者[もの]たちはみな、苦[くる]しめる者[もの]たちのただ中[なか]で、彼女[かのじょ]を捕[と]らえた。"
  4: "シオンの道[みち]は嘆[なげ]いている。祭[まつ]りに上[のぼ]って来[く]る者[もの]がいないからである。すべての門[もん]は荒[あ]れ果[は]て、その祭司[さいし]たちは深[ふか]く嘆息[たんそく]し、処女[おとめ]たちは引[ひ]き立[た]てられて行[ゆ]く。彼女[かのじょ]自身[じしん]も、うちに苦[にが]い思[おも]いを抱[かか]えている。"
  5: "彼女[かのじょ]を苦[くる]しめる者[もの]たちが頭[かしら]となり、その敵[てき]たちは栄[さか]えている。主[しゅ]が、彼女の多[おお]くの不敬[ふけい]のゆえに彼女を卑[ひく]くされたからである。その幼子[おさなご]たちは、苦しめる者[もの]の前[まえ]を捕囚[ほしゅう]となって去[さ]って行[い]った。"
  6: "シオンの娘[むすめ]から、その美[うつく]しさはすべて去[さ]った。その支配者[しはいしゃ]たちは、牧[まき]草[ぐさ]を見[み]いだせない雄羊[おひつじ]のようになり、力[ちから]なくして、追[お]う者[もの]の前[まえ]を歩[あゆ]んで行[い]った。"
  7: "エルサレムは、自分[じぶん]が卑[ひく]くされ、追[お]い払[はら]われた日[ひ]々[び]のこと、昔[むかし]から持[も]っていたすべての慕[した]わしいもののことを思[おも]い出[だ]した。民[たみ]が苦[くる]しめる者[もの]の手[て]に落[お]ち、助[たす]ける者[もの]がなかったときのことである。敵[てき]たちはこれを見[み]て、彼女[かのじょ]の移[うつ]されるのを笑[わら]った。"
  8: "エルサレムは罪[つみ]を犯[おか]しに犯した。それゆえ、彼女[かのじょ]は揺[ゆ]れ動[うご]く者[もの]となった。彼女をたたえていた者[もの]たちはみな、彼女を卑[ひく]くした。その恥[はじ]をさらしているのを見[み]たからである。彼女自身[じしん]も、嘆[なげ]きながら後[うし]ろを向[む]いた。"
  9: "汚[けが]れはその足[あし]もとにある。彼女[かのじょ]は自分[じぶん]の終[お]わりを思[おも]い起[おこ]さなかった。それゆえ、驚[おどろ]くほどに低[ひく]く落[お]とされた。慰[なぐさ]める者[もの]はいない。「主[しゅ]よ、わたしの卑[ひく]さをご覧[らん]ください。敵[てき]が大[おお]きくなりましたから。」"
  10: "苦[くる]しめる者[もの]は、彼女[かのじょ]の慕[した]わしいものすべてに手[て]を広[ひろ]げた。彼女[かのじょ]は、諸国[しょこく]の民[たみ]がその聖所[せいしょ]に入[はい]るのを見[み]た。あなたが、彼ら[かれら]をあなたの会衆[かいしゅう]に入[い]れてはならないと命[めい]じられた者[もの]たちである。"
  11: "その民[たみ]はみな、パンを求[もと]めて深[ふか]く嘆[なげ]き、魂[たましい]を生[い]かえすために、慕[した]わしいものを食[た]べ物[もの]と引[ひ]き換[か]えた。「主[しゅ]よ、ご覧[らん]ください。わたしが辱[はずかし]められているのを、どうか見[み]てください。"
  12: "道[みち]を行[ゆ]き交[か]うすべての者[もの]よ、あなたがたには無縁[むえん]なことなのか。立[た]ち返[かえ]って見[み]よ。主[しゅ]がその怒[いか]りの激[はげ]しさの日[ひ]に、わたしに向[む]かって語[かた]り、わたしを卑[ひく]くされた、その痛[いた]みのような痛みが、ほかにあるかどうかを。"
  13: "主[しゅ]は高[たか]みから火[ひ]を送[おく]り、それをわたしの骨[ほね]のうちに下[くだ]らせた。わたしの足[あし]に網[あみ]を広[ひろ]げ、わたしを後[うし]ろへ退[しりぞ]かせ、わたしを荒[あ]れ果[は]てた者[もの]とし、一日中[いちにちじゅう]苦[くる]しませた。"
  14: "わたしの不敬[ふけい]の上[うえ]に、見張[みは]りの目[め]が注[そそ]がれた。それらはわたしの手[て]のうちで絡[から]み合[あ]い、わたしの首[くび]に上[のぼ]って来[き]た。わたしの力[ちから]は衰[おとろ]えた。主[しゅ]がわたしの手[て]に苦[くる]しみを渡[わた]されたからである。わたしは立[た]っていることができない。"
  15: "主[しゅ]はわたしのただ中[なか]から、力[ちから]ある者[もの]をすべて取[と]り去[さ]られた。わたしに向[む]けて、わたしの選[えら]ばれた者[もの]たちを打[う]ち砕[くだ]く時[とき]を呼[よ]び寄[よ]せられた。主は、ユダの娘[むすめ]である処女[おとめ]の上[うえ]で、ぶどう搾[しぼ]り場[ば]を踏[ふ]まれた。このことのゆえに、わたしは泣[な]く。"
  16: "わたしの目[め]は水[みず]を流[なが]す。わたしを慰[なぐさ]め、わたしの魂[たましい]を生[い]かえす者[もの]が、わたしから遠[とお]く離[はな]れたからである。わたしの子[こ]どもたちは荒[あ]れ果[は]てた。敵[てき]が強[つよ]くなったからである。"
  17: "シオンは両手[りょうて]を広[ひろ]げた。慰[なぐさ]める者[もの]はいない。主[しゅ]はヤコブについて命[めい]じられた。苦[くる]しめる者[もの]たちが彼[かれ]の周[まわ]りを囲[かこ]んだ。エルサレムは彼ら[かれら]の間[あいだ]で、汚[けが]れた者[もの]となった。"
  18: "主[しゅ]は正[ただ]しい。わたしがその口[くち]に逆[さか]らったからである。諸国[しょこく]の民[たみ]よ、すべて聞[き]け。わたしの痛[いた]みを見[み]よ。わたしの処女[おとめ]たちも若者[わかもの]たちも、捕囚[ほしゅう]となって行[い]った。"
  19: "わたしは恋人[こいびと]たちを呼[よ]んだが、彼ら[かれら]はわたしを欺[あざむ]いた。わたしの祭司[さいし]たちと長老[ちょうろう]たちは、都[みやこ]のうちで息絶[いきた]えた。自分[じぶん]たちの魂[たましい]を生[い]かえすために食[た]べ物[もの]を求[もと]めたが、見[み]いだせなかったからである。"
  20: "主[しゅ]よ、ご覧[らん]ください。わたしは苦[くる]しんでいます。わたしの腹[はら]は騒[さわ]ぎ立[た]ち、心[こころ]はわたしの内[うち]で引[ひ]き返[かえ]りました。わたしが逆[さか]らいに逆らったからです。外[そと]では剣[つるぎ]が、家[いえ]のうちでは死[し]が、わたしから子[こ]どもを奪[うば]いました。"
  21: "聞[き]いてください。わたしが嘆[なげ]いているのを。慰[なぐさ]める者[もの]はひとりもいません。わたしの敵[てき]はみな、わたしの災[わざわ]いを聞[き]いて喜[よろこ]びました。あなたがそうされたからです。あなたは日[ひ]を導[みちび]き入[い]れ、時[とき]を呼[よ]び寄[よ]せられました。彼ら[かれら]もわたしのようになりました。"
  22: "彼ら[かれら]の悪[あく]がすべて、あなたの前[まえ]に入[はい]りますように。彼らがわたしのすべての罪[つみ]のゆえにわたしを摘[つ]み尽[つ]くしたように、あなたも彼らを摘[つ]み尽[つ]くしてください。わたしの嘆[なげ]きは多[おお]く、心[こころ]は悲[かな]しんでいるからです。」"

notes:
  1: "Πῶς ἐκάθισεν μόνη ἡ πόλις ἡ πεπληθυμμένη λαῶν — «как одиноко сидит город, полный народов»: πῶς открывает книгу и повторяется в 2:1 и 4:1 — одна формула どうして…のか. ἐγενήθη ὡς χήρα — «стал как вдова» (χήρα — 寡婦). ἄρχουσα ἐν χώραις — «владычествующая в областях»; εἰς φόρον — «в дань, под подать» (φόρος). Пролог в квадратных скобках (Καὶ ἐγένετο μετὰ τὸ αἰχμαλωτισθῆναι τὸν Ισραηλ… ἐκάθισεν Ιερεμιας κλαίων καὶ ἐθρήνησεν τὸν θρῆνον τοῦτον ἐπὶ Ιερουσαλημ καὶ εἶπεν) — рубрика, не стих: в текст не внесена, как слав. надписание «Песнь» в 1 Пар 16:8; в csl она входит в 1:1, в ru вынесена в заглавие книги. Акростих: Алеф (в слав. — разметка, не слово текста; в японском не воспроизводится)."
  2: "Κλαίουσα ἔκλαυσεν ἐν νυκτί — «плача плакала в ночи»: cognatus accusativus сохранён (泣きに泣いた). ἐπὶ τῶν σιαγόνων αὐτῆς — «на ланитах её» (σιαγών — щека, 頬). οὐχ ὑπάρχει ὁ παρακαλῶν αὐτὴν ἀπὸ πάντων τῶν ἀγαπώντων αὐτήν — «нет утешающего её из всех любивших её»: формула 慰める者がいない, ср. 1:9, 17, 21. πάντες οἱ φιλοῦντες αὐτὴν ἠθέτησαν ἐν αὐτῇ — «все дружившие с ней изменили ей» (ἀθετέω — отвергаться). Акростих: Беф."
  3: "Μετῳκίσθη ἡ Ιουδαία ἀπὸ ταπεινώσεως αὐτῆς καὶ ἀπὸ πλήθους δουλείας αὐτῆς — «переселён Иуда от унижения своего и от множества рабства своего» (μετοικίζω — переселять; слав. «ради смирения своего»). ἐκάθισεν ἐν ἔθνεσιν, οὐχ εὗρεν ἀνάπαυσιν — «поселился среди народов, не нашёл покоя» — в тексте 住んでも、安らぎを見いだせない. πάντες οἱ καταδιώκοντες αὐτὴν κατέλαβον αὐτὴν ἀνὰ μέσον τῶν θλιβόντων — «все гнавшие её настигли её среди теснящих». Акростих: Гимель."
  4: "Ὁδοὶ Σιων πενθοῦσιν — «пути Сиона рыдают» (πενθέω — оплакивать): олицетворение сохранено, 嘆いている. παρὰ τὸ μὴ εἶναι ἐρχομένους ἐν ἑορτῇ — «ибо нет приходящих на праздник» (ἑορτή — 祭り). ἠφανισμέναι — «опустошены» (ἀφανίζω). οἱ ἱερεῖς αὐτῆς ἀναστενάζουσιν — «священники её воздыхают». αἱ παρθένοι αὐτῆς ἀγόμεναι — «девы её уводимы» (ἄγω — вести; слав. «ведомы»), передано 引き立てられて行く. πικραινομένη ἐν ἑαυτῇ — «горько страдая в себе». Акростих: Далеф."
  5: "Ἐγένοντο οἱ θλίβοντες αὐτὴν εἰς κεφαλήν — «стали теснящие её во главу», т. е. во главе (буквально 頭となった). εὐθηνοῦσαν — «благоденствовали» (εὐθηνέω; слав. «угобзишася»). ὅτι κύριος ἐταπείνωσεν αὐτὴν ἐπὶ τὸ πλῆθος τῶν ἀσεβειῶν αὐτῆς — «ибо Господь смирил её за множество нечестий её» (ἀσέβεια — 不敬). τὰ νήπια αὐτῆς ἐπορεύθησαν ἐν αἰχμαλωσίᾳ κατὰ πρόσωπον θλίβοντος — «младенцы её пошли в плен пред лицом теснящего» (νήπιος — 幼子). Акростих: Ге."
  6: "ἐξῆλθεν ἐκ θυγατρὸς Σιων πᾶσα ἡ εὐπρέπεια αὐτῆς — «отошла от дщери Сиона вся красота её» (εὐπρέπεια; слав. «отяся… вся лепота ея»). ὡς κριοὶ οὐχ εὑρίσκοντες νομήν — «как овны, не находящие пажити» (κριός — баран, 雄羊; νομή — пастбище, 牧草). ἐπορεύοντο ἐν οὐκ ἰσχύι — «шли не в силе», т. е. без силы. Акростих: Вав."
  7: "Ἐμνήσθη Ιερουσαλημ ἡμερῶν ταπεινώσεως αὐτῆς καὶ ἀπωσμῶν αὐτῆς — «вспомнил Иерусалим дни унижения своего и отриновений своих» (ἀπωσμός — отвержение, изгнание). πάντα τὰ ἐπιθυμήματα αὐτῆς — «все вожделения (драгоценности) её»; в тексте 慕わしいもの, как в 1:10, 11. ἐπὶ μετοικεσίᾳ αὐτῆς — «над переселением его»: в ru (МТ) «над субботами» (שַׁבַּתִּים) — масоретское чтение, в текст не внесено. Акростих: Заин."
  8: "Ἁμαρτίαν ἥμαρτεν Ιερουσαλημ — «грехом согрешил Иерусалим»: cognatus accusativus сохранён (罪を犯しに犯した). διὰ τοῦτο εἰς σάλον ἐγένετο — «потому пришёл в колебание» (σάλος — качание, смятение; слав. «в мятеж бысть»; в МТ נִידָה — «нечистой», отсюда ru «отвратительным»): держим LXX/csl, 揺れ動く者. ἀσχημοσύνη — «срам, нагота» (恥). καί γε αὐτὴ στενάζουσα καὶ ἀπεστράφη ὀπίσω — «и она, стеная, обратилась назад». Акростих: Иф."
  9: "ἀκαθαρσία αὐτῆς πρὸς ποδῶν αὐτῆς — «нечистота её у ног её» (на подоле; ср. Ис 64:6). οὐκ ἐμνήσθη ἔσχατα αὐτῆς — «не вспомнила последнего своего». καὶ κατεβίβασεν ὑπέρογκα — «и низвела сверх меры» (ὑπέρογκα — чрезмерно; слав. «низведеся пречудно»): передано 驚くほどに低く落とされた. ἰδὲ κύριε τὴν ταπείνωσίν μου — первое слово города, 「…」. Акростих: Теф."
  10: "Χεῖρα αὐτοῦ ἐξεπέτασεν θλίβων ἐπὶ πάντα τὰ ἐπιθυμήματα αὐτῆς — «руку свою простёр теснящий на всё драгоценное её» (ἐκπετάννυμι — распростирать). εἰς τὸ ἁγίασμα αὐτῆς — «во святилище её» (ἁγίασμα — 聖所). ἃ ἐνετείλω μὴ εἰσελθεῖν αὐτὰ εἰς ἐκκλησίαν σου — «которым Ты заповедал не входить в собрание Твоё» (ἐκκλησία — 会衆; ср. Втор 23:3). Акростих: Иод."
  11: "Πᾶς ὁ λαὸς αὐτῆς καταστενάζοντες — «весь народ её, глубоко вздыхая» (καταστενάζω). ἔδωκαν τὰ ἐπιθυμήματα αὐτῆς ἐν βρώσει τοῦ ἐπιστρέψαι ψυχήν — «отдали драгоценности свои в пищу, чтобы возвратить душу», т. е. подкрепить (生かえす). ἰδὲ κύριε καὶ ἐπίβλεψον, ὅτι ἐγενήθην ἠτιμωμένη — «воззри, Господи, и призри, ибо я обесчещена» (ἀτιμόω): здесь открывается непрерывная речь города 11б–22. Акростих: Каф."
  12: "Οὐ πρὸς ὑμᾶς, πάντες οἱ παραπορευόμενοι ὁδόν — «не к вам ли, все проходящие путём» (вопрос; слав. «вси, иже к вам проходящии» понял как обращение): あなたがたには無縁なことなのか. ἐπιστρέψατε καὶ ἴδετε εἰ ἔστιν ἄλγος κατὰ τὸ ἄλγος μου — «обратитесь и увидите, есть ли боль, подобная боли моей» (ἄλγος — боль, 痛み). φθεγξάμενος ἐν ἐμοὶ ἐταπείνωσέν με κύριος — «возгласив на меня, смирил меня Господь» (φθέγγομαι — издавать голос; слав. «глаголавый о мне смири мя»): тёмное место, передано わたしに向かって語り. Акростих: Ламед."
  13: "Ἐξ ὕψους αὐτοῦ ἀπέστειλεν πῦρ — «с высоты своей послал огонь». ἐν τοῖς ὀστέοις μου κατήγαγεν αὐτό — «в кости мои низвёл его». διεπέτασεν δίκτυον τοῖς ποσίν μου — «распростёр сеть ногам моим» (δίκτυον — 網). ἀπέστρεψέν με εἰς τὰ ὀπίσω — «обратил меня вспять». ἔδωκέν με ἠφανισμένην, ὅλην τὴν ἡμέραν ὀδυνωμένην — «предал меня опустошению, весь день страдающую» (ὀδυνάω). Акростих: Мем."
  14: "Ἐγρηγορήθη ἐπὶ τὰ ἀσεβήματά μου — «бодрствовал (наблюдал) над беззакониями моими» (γρηγορέω; слав. «бдяше на нечестия моя»), передано 見張りの目が注がれた. ἐν χερσίν μου συνεπλάκησαν — «в руках моих сплелись» (συμπλέκω; образ ярма и пут), 絡み合い. ἀνέβησαν ἐπὶ τὸν τράχηλόν μου — «взошли на шею мою» (τράχηλος). ἠσθένησεν ἡ ἰσχύς μου — «обессилела крепость моя». ἔδωκεν κύριος ἐν χερσίν μου ὀδύνας — «предал Господь в руки мои страдания». οὐ δυνήσομαι στῆναι — «не смогу устоять». Акростих: Нун."
  15: "Ἐξῆρεν πάντας τοὺς ἰσχυρούς μου ὁ κύριος ἐκ μέσου μου — «изъял всех сильных моих Господь из среды моей». ἐκάλεσεν ἐπ᾿ ἐμὲ καιρὸν τοῦ συντρῖψαι ἐκλεκτούς μου — «созвал на меня время сокрушить избранных моих». ληνὸν ἐπάτησεν κύριος παρθένῳ θυγατρὶ Ιουδα — «точило истоптал Господь деве, дщери Иуды» (ληνός — ぶどう搾り場; дательный «для, над»). ἐπὶ τούτοις ἐγὼ κλαίω — «о сём я плачу» (слав. «о сих аз плачу»). Акростих: Самех."
  16: "Ὁ ὀφθαλμός μου κατήγαγεν ὕδωρ — «око моё низвело воду»: формула слёз, ср. 3:48 (ἀφέσεις ὑδάτων). ὅτι ἐμακρύνθη ἀπ᾿ ἐμοῦ ὁ παρακαλῶν με, ὁ ἐπιστρέφων ψυχήν μου — «ибо удалился от меня утешающий меня, возвращающий душу мою» (生かえす, как в 1:11). ἐγένοντο οἱ υἱοί μου ἠφανισμένοι — «сыны мои стали опустошены». ὅτι ἐκραταιώθη ὁ ἐχθρός — «ибо усилился враг» (κραταιόω). Акростих: Аин."
  17: "Διεπέτασεν Σιων χεῖρας αὐτῆς, οὐκ ἔστιν ὁ παρακαλῶν αὐτήν — «распростёр Сион руки свои, нет утешающего его». ἐνετείλατο κύριος τῷ Ιακωβ, κύκλῳ αὐτοῦ οἱ θλίβοντες αὐτόν — «заповедал Господь Иакову: вокруг него теснящие его». ἐγενήθη Ιερουσαλημ εἰς ἀποκαθημένην ἀνὰ μέσον αὐτῶν — «стал Иерусалим сидящим отдельно (нечистым, отверженным) среди них» (ἀποκάθημαι — о женщине в очищении; слав. «яко осквернена кровоточением»). Акростих: Фи."
  18: "Δίκαιός ἐστιν κύριος, ὅτι τὸ στόμα αὐτοῦ παρεπίκρανα — «праведен Господь, ибо уста Его огорчил (противился)» (παραπικραίνω): начало второй части речи города. ἀκούσατε δή, πάντες οἱ λαοί, καὶ ἴδετε τὸ ἄλγος μου — «услышьте же, все народы, и увидьте боль мою». παρθένοι μου καὶ νεανίσκοι μου ἐπορεύθησαν ἐν αἰχμαλωσίᾳ — «девы мои и юноши мои пошли в плен». Акростих: Цади."
  19: "Ἐκάλεσα τοὺς ἐραστάς μου, αὐτοὶ δὲ παρελογίσαντό με — «позвала любовников моих, они же обманули меня» (ἐραστής — любовник; образ города-блудницы и ложных союзников, ср. Иез 16; 23): 恋人たち. ἐξέλιπον — «скончались, иссякли» (ἐκλείπω), 息絶えた. ἐζήτησαν βρῶσιν αὐτοῖς, ἵνα ἐπιστρέψωσιν ψυχὰς αὐτῶν, καὶ οὐχ εὗρον — «искали пищи себе, чтобы возвратить души свои, и не нашли». Акростих: Коф."
  20: "Ἰδὲ κύριε ὅτι θλίβομαι — «воззри, Господи, ибо я тесним». ἡ κοιλία μου ἐταράχθη — «утроба моя взволновалась» (κοιλία — 腹). ἡ καρδία μου ἐστράφη ἐν ἐμοί — «сердце моё обратилось во мне». ὅτι παραπικραίνουσα παρεπίκρανα — «ибо, огорчаясь, огорчил» (усиление: 逆らいに逆らった). ἔξωθεν ἠτέκνωσέν με μάχαιρα ὥσπερ θάνατος ἐν οἴκῳ — «извне обесчадил меня меч, как смерть в доме» (ἀτεκνόω). Акростих: Реш."
  21: "Ἀκούσατε δὴ ὅτι στενάζω ἐγώ — «услышьте же, что я стенаю». οὐκ ἔστιν ὁ παρακαλῶν με — «нет утешающего меня» (формула). οἱ ἐχθροί μου ἤκουσαν τὰ κακά μου καὶ ἐχάρησαν — «враги мои услышали о бедах моих и возрадовались». ἐπήγαγες ἡμέραν, ἐκάλεσας καιρόν, καὶ ἐγένοντο ὅμοιοι ἐμοί — «навёл день, призвал время, и стали они подобны мне»: греч. аорист; слав. «будут подобни мне» — в тексте передано совершившимся (彼らもわたしのようになりました), слав. вариант отмечен. Акростих: Шин."
  22: "Εἰσέλθοι πᾶσα ἡ κακία αὐτῶν κατὰ πρόσωπόν σου — «да войдёт вся злоба их пред лицо Твоё» (оптатив). καὶ ἐπιφύλλισον αὐτοῖς, ὃν τρόπον ἐποίησαν ἐπιφυλλίδα περὶ πάντων τῶν ἁμαρτημάτων μου — «и обери их, как они обобрали меня за все грехи мои» (ἐπιφυλλίζω — собирать остатки винограда, обирать дочиста; ср. 2:20; 3:51): 摘み尽くす. ὅτι πολλοὶ οἱ στεναγμοί μου, καὶ ἡ καρδία μου λυπεῖται — «ибо многочисленны стенания мои, и сердце моё скорбит». Речь города закрывается. Акростих: Фав."
