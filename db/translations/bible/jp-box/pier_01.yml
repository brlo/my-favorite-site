# jp-box, Плач Иеремии, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Плача нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Структура книги — по слав./Синодальному (решение автора проекта), а не по греч.
# модулю: 5 глав, 154 стиха (1:22, 2:22, 3:66, 4:22, 5:22).
# Глава 1: 1–8 плач пророка над опустевшим городом (одиночество и вдовство, слёзы,
# плен и отсутствие покоя, пустые праздники и поруганная святыня, враги во главе,
# ушедшая красота, память о прежних днях, грех и срам); 9–22 речь самого города
# (Сиона): 9б первое воззвание к Господу, 11б–22 одна непрерывная речь — «нет
# утешающего», обращение к проходящим, огонь с высоты и сеть, ярмо беззаконий,
# истоптанное точило, слёзы о детях, «праведен Господь», обманувшие любовники,
# молитва о суде над врагами.
# Акростих: в слав. перед каждым стихом стоит название евр. буквы (Алеф, Беф, Гимель,
# Далеф, Ге, Вав, Заин, Иф, Теф, Иод, Каф, Ламед, Мем, Нун, Самех, Аин, Фи, Цади, Коф,
# Реш, Шин, Фав) — по одной на стих, всего 22. Это разметка акростиха, а не слова
# текста: в перевод не включена, отмечена в notes каждого стиха (здесь группа = стих);
# в японском акростих не воспроизводится (как буквы алфавита в Пс 118). В самом
# gr-lxx-byz названий букв нет — они только в слав.
# Нумерация по gr: 22 стиха, совпадает с csl и ru; акростих ложится на те же стихи.
# gr 1:1 открывается прологом в квадратных скобках («И было после того, как Израиль
# был отведён в плен, и Иерусалим опустошён, сел Иеремия плача и оплакал этот плач
# над Иерусалимом и сказал»): в csl он входит в 1:1, в ru вынесен в заглавие книги.
# Это рубрика, а не стих: в текст не внесена (как 1 Пар 16:8), содержание — в notes 1:1.
# 〔…〕 нет. Редакционных помет в скобках в слав. тексте этой главы нет.
# Кавычки: 1:9б — 「…」 (первое слово города); 1:11б–1:22 — одна непрерывная речь
# города в 「…」 (открывается в 11, закрывается в 22). Вложенной речи нет.
# Сносок ⟨…⟩ нет: 寡婦, 寄留, 聖所, 会衆, 処女, 捕囚, 恋人 уже в корпусе или понятны.
# Имена: エルサレム, シオン, ユダ, ヤコブ, イスラエル — по корпусу.
# Повторяющиеся формулы переведены одинаково: πῶς → どうして…のか (1:1; 2:1; 4:1);
# οὐκ ἔστιν ὁ παρακαλῶν → 慰める者がいない (1:2, 9, 17, 21).

