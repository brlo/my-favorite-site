verses:
  1: "ヨブはさらに言葉[ことば]を続[つづ]けて、格言[かくげん]によって言[い]った。"
  2: "「だれがわたしを、過[す]ぎ去[さ]った日[ひ]々[び]の月[つき]のようにしてくれるのか。神[かみ]がわたしを守[まも]っておられた、あの月のように。"
  3: "そのとき、彼の灯[ともしび]がわたしの頭[あたま]の上[うえ]で輝[かがや]き、わたしはその光[ひかり]によって闇[やみ]の中[なか]を歩[あゆ]んだ。"
  4: "わたしが道[みち]を重[おも]く踏[ふ]んでいたとき、神[かみ]がわたしの家[いえ]を顧[かえり]みてくださったとき、"
  5: "わたしが非常[ひじょう]に豊[ゆた]かで、僕[しもべ]たちがわたしの周[まわ]りにいたとき、"
  6: "わたしの道[みち]がバターで流[なが]れ、山々[やまやま]が乳[ちち]で流れていたとき。"
  7: "わたしが朝[あさ]早[はや]く都[みやこ]に出[で]て行[ゆ]き、広場[ひろば]にわたしの座[ざ]を設[もう]けたとき、"
  8: "若[わか]い者[もの]たちはわたしを見[み]ると隠[かく]れ、年[とし]寄[よ]りたちはみな立[た]ち上[あ]がった。"
  9: "貴[き]人[じん]たちは語[かた]ることをやめ、指[ゆび]を口[くち]に当[あ]てた。"
  10: "聞[き]く者[もの]たちはわたしを幸[さいわ]いな者[もの]と呼[よ]び、彼らの舌[した]は喉[のど]に貼[は]りついた。"
  11: "耳[みみ]はわたしの話[はなし]を聞[き]いてわたしをほめたたえ、目[め]はわたしを見[み]てうなずいた。"
  12: "わたしは貧[まず]しい者[もの]を力[ちから]ある者[もの]の手[て]から救[すく]い、助[たす]けのない孤児[こじ]を助[たす]けたからである。"
  13: "滅[ほろ]びゆく者[もの]の祝福[しゅくふく]がわたしの上[うえ]に来[く]るように。寡婦[かふ]の口[くち]がわたしを祝福した。"
  14: "わたしは正義[せいぎ]を着[き]て身[み]を包[つつ]み、裁[さば]きを衣[ころも]のようにまとった。"
  15: "わたしは盲人[もうじん]の目[め]であり、足[あし]の不自由[ふじゆう]な者[もの]の足であった。"
  16: "わたしは弱[よわ]い者[もの]たちの父[ちち]であった。知[し]らない争[あらそ]い事[ごと]でも、詳[くわ]しく調[しら]べた。"
  17: "わたしは不正[ふせい]な者[もの]の顎[あご]を砕[くだ]き、その歯[は]の間[あいだ]から奪[うば]われたものをもぎ取[と]った。"
  18: "わたしは言[い]った。『わたしの齢[よわい]は老[お]いて、棕櫚[しゅろ]の幹[みき]のように、長[なが]い年月[としつき]を生[い]きるだろう。"
  19: "わたしの根[ね]は水[みず]のそばに開[ひら]き、露[つゆ]はわたしの刈[か]り入[い]れの上[うえ]に宿[やど]る。"
  20: "わたしの栄光[えいこう]は新[あたら]しく、わたしの弓[ゆみ]はわたしの手[て]の中[なか]を進[すす]む。』"
  21: "わたしの話[はなし]を聞[き]いた者[もの]たちは耳[みみ]を傾[かたむ]け、わたしの助言[じょげん]に黙[だま]り込[こ]んだ。"
  22: "わたしの言葉[ことば]に付[つ]け加[くわ]えることはせず、わたしが語[かた]るときには、喜[よろこ]びにあふれていた。"
  23: "乾[かわ]いた土[つち]が雨[あめ]を待[ま]ち望[のぞ]むように、彼らはわたしの語[かた]りを待ち望んだ。"
  24: "わたしが彼らに微笑[ほほえ]んでも、彼らは信[しん]じなかった。わたしの顔[かお]の光[ひかり]が失[う]せられることはなかった。"
  25: "わたしは彼らの道[みち]を選[えら]び、君主[くんしゅ]として座[すわ]り、勇士[ゆうし]たちの中[なか]の王[おう]のように住[す]んだ。悲[かな]しむ者[もの]を慰[なぐさ]める者[もの]のように。」"

notes:
  1: "Повествование. Ἔτι δὲ προσθεὶς Ιωβ εἶπεν τῷ προοιμίῳ — та же формула, что 27:1: «И ещё, продолжив, Иов сказал в притче»: προοίμιον — «вступление, притча» (слав. «рече в притчах»). Формула вне кавычек; речь открывается в ст. 2. Глава 29 начинает последнюю большую речь Иова (29–31)."
  2: "Иов. Τίς ἄν με θείη κατὰ μῆνα ἔμπροσθεν ἡμερῶν — «кто поставил бы меня по месяцам прежних дней?»: τίθημι — «ставить»; κατὰ μῆνα — «по месяцу». ὧν με ὁ θεὸς ἐφύλαξεν — «в которых меня Бог хранил»: φυλάσσω — «охранять». Оптатив с ἄν передан вопросом-пожеланием (о, если бы)."
  3: "Иов. ὡς ὅτε ηὔγει ὁ λύχνος αὐτοῦ ὑπὲρ κεφαλῆς μου — «когда светил светильник Его над головой моей»: αὐγάζω — «светить»; λύχνος — «светильник». ὅτε τῷ φωτὶ αὐτοῦ ἐπορευόμην ἐν σκότει — «когда при свете Его я ходил во тьме». Слав. «егда светяшеся светилник его над главою моею»."
  4: "Иов. ὅτε ἤμην ἐπιβρίθων ὁδοῖς — «когда я был тяжек на путях»: ἐπιβρίθω — «налегать, отягощать», тёмное место (слав. «тяжек в путех»; в Синодальном по евр. «дни молодости»). ὅτε ὁ θεὸς ἐπισκοπὴν ἐποιεῖτο τοῦ οἴκου μου — «когда Бог посещение творил дому моему»: ἐπισκοπή — «посещение, попечение»."
  5: "Иов. ὅτε ἤμην ὑλώδης λίαν — «когда я был весьма обилен»: ὑλώδης — «лесистый, обильный» (от ὕλη — «лес, вещество»); слав. «егда бех богат зело». κύκλῳ δέ μου οἱ παῖδες — «и вокруг меня отроки (слуги)»: παῖς — «дитя, слуга» (слав. «раби»; в Синодальном «дети» — по евр. נְעָרַי)."
  6: "Иов. ὅτε ἐχέοντό μου αἱ ὁδοὶ βουτύρῳ — «когда пути мои обливались маслом»: βούτυρον — «сливочное масло» (в тексте バター); слав. «маслом кравиим». τὰ δὲ ὄρη μου ἐχέοντο γάλακτι — «и горы мои обливались молоком»; притяжательное «горы мои» сохранено."
  7: "Иов. ὅτε ἐξεπορευόμην ὄρθριος ἐν πόλει — «когда я выходил рано в город»: ὄρθριος — «утренний, рано». ἐν δὲ πλατείαις ἐτίθετό μου ὁ δίφρος — «и на площадях ставилось мне седалище»: πλατεῖα — «широкая улица, площадь»; δίφρος — «седалище, кресло». Слав. «на стогнах же поставляшеся ми престол»."
  8: "Иов. ἰδόντες με νεανίσκοι ἐκρύβησαν — «увидев меня, юноши скрылись»: νεανίσκος — «юноша». πρεσβῦται δὲ πάντες ἔστησαν — «и все старцы встали»: πρεσβύτης — «старец». Знаки почтения; слав. «видяще мя юноши скрывашася»."
  9: "Иов. ἁδροὶ δὲ ἐπαύσαντο λαλοῦντες — «и вельможи перестали говорить»: ἁδρός — «полный, знатный, важный» (в тексте 貴人). δάκτυλον ἐπιθέντες ἐπὶ στόματι — «возложив перст на уста»: ἐπιτίθημι — «возлагать». Слав. «вельможи же преставаху глаголати, перст возложше на уста своя»."
  10: "Иов. οἱ δὲ ἀκούσαντες ἐμακάρισάν με — «и слышавшие ублажали меня»: μακαρίζω — «ублажать, называть блаженным». γλῶσσα αὐτῶν τῷ λάρυγγι αὐτῶν ἐκολλήθη — «язык их прилип к гортани их»: λάρυγξ — «гортань»; κολλάω — «прилеплять». Слав. «слышавшии же блажиша мя»."
  11: "Иов. ὅτι οὖς ἤκουσεν καὶ ἐμακάρισέν με — «ибо ухо, услышав, ублажало меня». ὀφθαλμὸς δὲ ἰδών με ἐξέκλινεν — «и глаз, увидев меня, склонился»: ἐκκλίνω — «уклоняться, склоняться»; тёмное место, слав. «око же видев мя уклонися», в Синодальном «восхваляло» — иное чтение."
  12: "Иов. διέσωσα γὰρ πτωχὸν ἐκ χειρὸς δυνάστου — «ибо я спас бедного из руки сильного»: διασῴζω — «спасать»; δυνάστης — «сильный, владыка». ὀρφανῷ, ᾧ οὐκ ἦν βοηθός, ἐβοήθησα — «сироте, у которого не было помощника, помог». Слав. «спасох бо убогаго от руки сильнаго»."
  13: "Иов. εὐλογία ἀπολλυμένου ἐπ᾿ ἐμὲ ἔλθοι — «благословение погибающего на меня да придёт»: εὐλογία — «благословение»; ἀπόλλυμι — «погибать»; оптатив ἔλθοι передан пожеланием. στόμα δὲ χήρας με εὐλόγησεν — «и уста вдовы благословили меня». Слав. «благословение погибающаго на мя да приидет»."
  14: "Иов. δικαιοσύνην δὲ ἐνεδεδύκειν — «в правду я облёкся»: ἐνδύω — «надевать, облекаться» (перфект со значением состояния). ἠμφιασάμην δὲ κρίμα ἴσα διπλοΐδι — «и оделся судом, как двойным плащом»: ἀμφιέννυμι — «одевать»; διπλοΐς — «двойной плащ, мантия». Слав. «в правду же облачахся, одевахся же в суд яко в ризу»."
  15: "Иов. ὀφθαλμὸς ἤμην τυφλῶν — «я был глазом слепых»: τυφλός — «слепой». ποὺς δὲ χωλῶν — «и ногой хромых»: χωλός — «хромой». Слав. «око бех слепым, нога же хромым»."
  16: "Иов. ἐγὼ ἤμην πατὴρ ἀδυνάτων — «я был отцом немощных»: ἀδύνατος — «бессильный, немощный». δίκην δέ, ἣν οὐκ ᾔδειν, ἐξιχνίασα — «и тяжбу, которой не знал, разобрал»: δίκη — «суд, тяжба»; ἐξιχνιάζω — «разыскивать, исследовать». Слав. «аз бых отец немощным»."
  17: "Иов. συνέτριψα δὲ μύλας ἀδίκων — «я сокрушил челюсти (коренные зубы) неправедных»: μύλη — «коренной зуб, челюсть»; συντρίβω — «сокрушать». ἐκ δὲ μέσου τῶν ὀδόντων αὐτῶν ἅρπαγμα ἐξέσπασα — «и из среды зубов их похищенное исторг»: ἅρπαγμα — «похищенное»; ἐκσπάω — «вырывать». Слав. «сотрох же членовныя неправедных»."
  18: "Иов; свои прежние слова — 『…』, продолжаются до ст. 20 (в греческом нет закрывающей формулы). εἶπα δέ — «я сказал же». Ἡ ἡλικία μου γηράσει — «возраст мой состарится»: ἡλικία — «возраст, зрелость»; γηράσκω — «стареть». ὥσπερ στέλεχος φοίνικος πολὺν χρόνον βιώσω — «как ствол финиковой пальмы, много времени проживу»: στέλεχος — «ствол»; φοῖνιξ — «финиковая пальма». Слав. «возраст мой состареется якоже стебло финиково»."
  19: "Иов (продолжение прежних слов, 『…』). ἡ ῥίζα μου διήνοικται ἐπὶ ὕδατος — «корень мой открыт при воде»: διανοίγω — «открывать»; ῥίζα — «корень». δρόσος αὐλισθήσεται ἐν τῷ θερισμῷ μου — «роса будет ночевать на жатве моей»: δρόσος — «роса»; αὐλίζομαι — «ночевать, обитать». Слав. «корень разверзеся при воде»."
  20: "Иов (конец прежних слов). ἡ δόξα μου καινὴ μετ᾿ ἐμοῦ — «слава моя нова со мною»: καινός — «новый». τὸ τόξον μου ἐν χειρὶ αὐτοῦ πορεύσεται — «и лук мой в руке его пойдёт»; слав. читает «в руце моей» — взято слав. (в LXX αὐτοῦ, «его»). Здесь закрывается 『…』."
  21: "Иов. ἐμοῦ ἀκούσαντες προσέσχον — «меня послушав, внимали»: προσέχω — «внимать». ἐσιώπησαν δὲ ἐπὶ τῇ ἐμῇ βουλῇ — «и умолкали при совете моём»: σιωπάω — «молчать»; βουλή — «совет, решение». Слав. «слышавшии мя внимаху, молчаху же о моем совете»."
  22: "Иов. ἐπὶ δὲ τῷ ἐμῷ ῥήματι οὐ προσέθεντο — «к слову моему не прибавляли»: προστίθημι — «прибавлять». περιχαρεῖς δὲ ἐγίνοντο, ὁπόταν αὐτοῖς ἐλάλουν — «и становились весьма радостны, когда я говорил им»: περίχαρις — «преисполненный радости». Слав. «к моему глаголу не прилагаху»."
  23: "Иов. ὥσπερ γῆ διψῶσα προσδεχομένη τὸν ὑετόν — «как земля жаждущая, ожидающая дождя»: διψάω — «жаждать»; ὑετός — «дождь». οὕτως οὗτοι τὴν ἐμὴν λαλιάν — «так и они — речи моей»: λαλιά — «речь, беседа». Слав. «якоже земля жаждущая ожидает дождя»."
  24: "Иов. ἐὰν γελάσω πρὸς αὐτούς — «если я улыбнусь им»: γελάω — «смеяться, улыбаться». οὐ μὴ πιστεύσωσιν — «они не поверят» (усиленное отрицание), т. е. не смеют поверить своему счастью. φῶς τοῦ προσώπου μου οὐκ ἀπέπιπτεν — «и свет лица моего не отпадал»: ἀποπίπτω — «опадать, спадать». Слав. «аще возсмеюся к ним, не вериша»."
  25: "Иов. ἐξελεξάμην ὁδὸν αὐτῶν — «я избирал путь их»: ἐκλέγω — «выбирать». ἐκάθισα ἄρχων — «сидел князем»: ἄρχων — «начальник, князь». κατεσκήνουν ὡσεὶ βασιλεὺς ἐν μονοζώνοις — «обитал, как царь среди препоясанных (воинов)»: κατασκηνόω — «обитать»; μονόζωνος — «препоясанный воин». ὃν τρόπον παθεινοὺς παρακαλῶν — «как утешающий печальных»: παθεινός — «страждущий, печальный»; παρακαλέω — «утешать». Слав. «вселяхся якоже царь посреде храбрых, аки утешаяй печальных». Цитата закрыта; речь продолжается в следующей главе."
