# jp-box, Иов, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 29: начало последней большой речи Иова (29–31). Ст. 1 — формула
# (повествование), вне кавычек; речь 2–25 — одна цитата 「…」, закрыта в конце главы
# и продолжается в гл. 30 (там без новой формулы).
# Ст. 2–6 — «о, если бы я был, как в прежние месяцы»; 7–11 — почёт у городских ворот;
# 12–17 — заступничество за бедных; 18–20 — прежняя самоуверенная речь Иова (『…』,
# свои прежние слова); 21–25 — как его слушали и ждали.
# Красного и синего нет.
# Нумерация по gr: 25 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

