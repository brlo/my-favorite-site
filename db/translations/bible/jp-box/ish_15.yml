verses:
  1: "そのとき、モーセとイスラエルの子[こ]らは、この歌[うた]を神[かみ]に歌[うた]って言[い]った。「主[しゅ]に歌[うた]おう。主[しゅ]は大[おお]いに栄光[えいこう]を現[あらわ]されたからである。馬[うま]と乗[の]り手[て]を海[うみ]に投[な]げ込[こ]まれた。"
  2: "主[しゅ]はわたしの助[たす]け、わたしを守[まも]る方[かた]となり、わたしの救[すく]いとなられた。この方[かた]こそわたしの神[かみ]、わたしはこの方[かた]を賛美[さんび]する。わたしの父[ちち]の神[かみ]、わたしはこの方[かた]をあがめる。"
  3: "主[しゅ]は戦[いくさ]を砕[くだ]く方[かた]、その名[な]は主[しゅ]である。"
  4: "ファラオの戦車[せんしゃ]とその軍勢[ぐんせい]を海[うみ]に投[な]げ込[こ]まれた。選[えら]ばれた騎兵[きへい]の長[おさ]たちを紅海[こうかい]に沈[しず]められた。"
  5: "海[うみ]が彼[かれ]らを覆[おお]った。彼[かれ]らは石[いし]のように深[ふか]みに沈[しず]んだ。"
  6: "主[しゅ]よ、あなたの右[みぎ]の手[て]は力[ちから]のうちに栄光[えいこう]を現[あらわ]した。主[しゅ]よ、あなたの右[みぎ]の手[て]は敵[てき]を砕[くだ]いた。"
  7: "あなたは栄光[えいこう]の豊[ゆた]かさによって、あなたに逆[さか]らう者[もの]たちを打[う]ち砕[くだ]いた。あなたが怒[いか]りを放[はな]つと、それは彼[かれ]らを藁[わら]のように焼[や]き尽[つ]くした。"
  8: "あなたの怒[いか]りの息[いき]によって水[みず]は分[わ]かれた。流[なが]れは壁[かべ]のように固[かた]まり、波[なみ]は海[うみ]の中[なか]で固[かた]まった。"
  9: "敵[てき]は言[い]った。『わたしは追[お]いかけて捕[つか]まえる。分捕[ぶんど]り物[もの]を分[わ]ける。わたしの魂[たましい]を満[み]たす。わたしの剣[つるぎ]で殺[ころ]す。わたしの手[て]が彼[かれ]らを支配[しはい]する。』"
  10: "あなたが息[いき]を送[おく]ると、海[うみ]が彼[かれ]らを覆[おお]った。彼[かれ]らは鉛[なまり]のように激[はげ]しい水[みず]に沈[しず]んだ。"
  11: "主[しゅ]よ、神々[かみがみ]のうちで、だれがあなたに似[に]ているだろうか。だれがあなたに似[に]ているだろうか。聖[せい]なる者[もの]たちのうちにあって栄光[えいこう]を受[う]け、栄光[えいこう]のうちに驚[おどろ]くべき方[かた]、奇[き]跡[せき]を行[おこな]う方[かた]よ。"
  12: "あなたが右[みぎ]の手[て]を伸[の]べると、地[ち]が彼[かれ]らを飲[の]み込[こ]んだ。"
  13: "あなたは、贖[あがな]い出[だ]されたこの民[たみ]を、あなたの義[ぎ]によって導[みちび]かれた。あなたの力[ちから]によって、あなたの聖[せい]なる住[す]まいへと伴[とも]なわれた。"
  14: "諸国[しょこく]の民[たみ]は聞[き]いて怒[いか]り、フィリスティヤの住[す]む者[もの]たちは産[さん]の苦[くる]しみに捕[と]らわれた。"
  15: "そのとき、エドムの首長[しゅちょう]たちは慌[あわ]て、モアブの支配者[しはいしゃ]たちを震[ふる]えが捕[と]らえた。カナンの住[す]む者[もの]たちはみな溶[と]け去[さ]った。"
  16: "恐[おそ]れと震[ふる]えが彼[かれ]らに降[ふ]りかかるように。あなたの腕[うで]の大[おお]きさによって、彼[かれ]らは石[いし]のように固[かた]まるように。主[しゅ]よ、あなたの民[たみ]が通[とお]り過[す]ぎるまで。あなたが獲[え]られたこの民[たみ]が通[とお]り過[す]ぎるまで。"
  17: "あなたは彼[かれ]らを導[みちび]き入[い]れて、あなたの嗣業[しぎょう]の山[やま]に植[う]えてください。主[しゅ]よ、あなたがご自分[じぶん]の住[す]まいとして造[つく]られた備[そな]えの所[ところ]、主[しゅ]よ、あなたの手[て]が備[そな]えられた聖所[せいしょ]に。"
  18: "主[しゅ]は王[おう]として治[おさ]められる。世々[よよ]に、永遠[えいえん]に、いつまでも。」"
  19: "ファラオの馬[うま]が、戦車[せんしゃ]と騎兵[きへい]とともに海[うみ]に入[はい]ると、主[しゅ]は海[うみ]の水[みず]を彼[かれ]らの上[うえ]に引[ひ]き戻[もど]された。しかしイスラエルの子[こ]らは、海[うみ]の中[なか]の乾[かわ]いた地[ち]を歩[ある]いて渡[わた]った。"
  20: "預言者[よげんしゃ]ミリアム、アロンの姉[あね]は、手[て]にタンバリンを取[と]った。女[おんな]たちはみな、タンバリンと踊[おど]りを携[たずさ]えて、彼女[かのじょ]の後[あと]に従[したが]って出[で]て来[き]た。"
  21: "ミリアムは彼女[かのじょ]たちに先[さき]だって歌[うた]った。「主[しゅ]に歌[うた]おう。主[しゅ]は大[おお]いに栄光[えいこう]を現[あらわ]されたからである。馬[うま]と乗[の]り手[て]を海[うみ]に投[な]げ込[こ]まれた。」"
  22: "モーセはイスラエルの子[こ]らを紅海[こうかい]から導[みちび]き出[だ]し、スルの荒野[こうや]へ連[つ]れて行[い]った。彼[かれ]らは荒野[こうや]を三日[みっか]歩[ある]いたが、飲[の]む水[みず]が見[み]つからなかった。"
  23: "彼[かれ]らはマラに来[き]たが、マラの水[みず]は飲[の]めなかった。苦[にが]かったからである。それゆえ、その場所[ばしょ]の名[な]は「苦[にが]さ」と名[な]づけられた。"
  24: "民[たみ]はモーセに向[む]かってつぶやいて言[い]った。「わたしたちは何[なに]を飲[の]むのか。」"
  25: "モーセが主[しゅ]に叫[さけ]ぶと、主[しゅ]は彼[かれ]に一本[いっぽん]の木[き]を示[しめ]された。彼[かれ]がそれを水[みず]に投[とう]げ入[い]れると、水[みず]は甘[あま]くなった。そこは、主[しゅ]が彼[かれ]のために掟[おきて]と裁[さば]きを定[さだ]め、彼[かれ]を試[こころ]みた所[ところ]である。"
  26: "そして言[い]われた。「あなたが、あなたの神[かみ]であられる主[しゅ]の声[こえ]によく聞[き]き従[したが]い、主[しゅ]の前[まえ]に喜[よろこ]ばれることを行[おこな]い、その戒[いまし]めに耳[みみ]を傾[かたむ]け、そのすべての掟[おきて]を守[まも]るなら、わたしがエジプト人[じん]に下[くだ]したどの病[やまい]も、あなたには下[くだ]さない。わたしは主[しゅ]、あなたを癒[いや]す者[もの]である。」"
  27: "彼[かれ]らはエリムに来[き]た。そこには十二[じゅうに]の水[みず]の泉[いずみ]と七十本[ななじゅうほん]の棕櫚[しゅろ]の木[き]があった。彼[かれ]らはそこで、水[みず]のそばに陣[じん]を張[は]った。"

notes:
  1: "ᾖσεν … τὴν ᾠδὴν ταύτην τῷ θεῷ — この歌を神に歌って (ᾄδω; ᾠδή — «песнь»; датив τῷ θεῷ — «Богу», не «Господу»). Ἄισωμεν τῷ κυρίῳ — 主に歌おう (hortativus; в 21 тот же призыв — «пойте»). ἐνδόξως γὰρ δεδόξασται — 大いに栄光を現された (ἐνδόξως — «славно»; perfect δεδόξασται; слав. «славно бо прославися»). ἵππον καὶ ἀναβάτην ἔρριψεν εἰς θάλασσαν — 馬と乗り手を海に投げ込まれた (ῥίπτω; ἀναβάτης — «всадник, колесничий»)."
  2: "βοηθὸς καὶ σκεπαστής — 助け、守る方 (σκεπαστής — «покровитель, покрывающий»). ἐγένετό μοι εἰς σωτηρίαν — わたしの救いとなられた (εἰς σωτηρίαν — «во спасение»). οὗτός μου θεός — この方こそわたしの神 (LXX без «Господь» в начале; масоретский текст — «Господь сила моя»). δοξάσω — 賛美する. ὑψώσω — あがめる (ὑψόω — «возвышать»)."
  3: "κύριος συντρίβων πολέμους — 主は戦を砕く方 (συντρίβω — «сокрушать»; πολέμους — мн. ч., «брани»; слав. «сокрушаяй брани»). κύριος ὄνομα αὐτῷ — その名は主である (букв. «Господь имя Ему»)."
  4: "ἅρματα Φαραω — ファラオの戦車 (ἅρμα). ἐπιλέκτους ἀναβάτας τριστάτας — 選ばれた騎兵の長たち (τριστάτης — «третьчий», боец на колеснице; ср. 14:7). κατεπόντισεν — 沈められた (καταποντίζω — «потоплять»). ἐν ἐρυθρᾷ θαλάσσῃ — 紅海に (ἐρυθρά — «красная»; Чермное, 紅海)."
  5: "πόντῳ ἐκάλυψεν — 海が覆った (πόντος — «море, пучина»). κατέδυσαν εἰς βυθόν — 深みに沈んだ (βυθός — «глубина»). ὡσεὶ λίθος — 石のように."
  6: "ἡ δεξιά σου — あなたの右の手 (δεξιά — «десница»). δεδόξασται ἐν ἰσχύι — 力のうちに栄光を現した (ἰσχύς — «крепость»). ἔθραυσεν ἐχθρούς — 敵を砕いた (θραύω — «сокрушать»)."
  7: "τῷ πλήθει τῆς δόξης σου — 栄光の豊かさによって (πλῆθος — «множество, полнота»). συνέτριψας τοὺς ὑπεναντίους — 逆らう者たちを打ち砕いた (ὑπεναντίος — «противник»). ἀπέστειλας τὴν ὀργήν σου — 怒りを放つと (ἀποστέλλω). κατέφαγεν αὐτοὺς ὡς καλάμην — 藁のように焼き尽くした (καλάμη — «солома, стерня»; κατεσθίω — «поедать»)."
  8: "διὰ πνεύματος τοῦ θυμοῦ σου — 怒りの息によって (πνεῦμα — «дыхание, ветер»; θυμός — «ярость»). διέστη τὸ ὕδωρ — 水は分かれた (διΐστημι). ἐπάγη ὡσεὶ τεῖχος — 壁のように固まり (πήγνυμι — «стущать, затвердевать»; слав. «огустеша»). κύματα — 波 (κῦμα)."
  9: "εἶπεν ὁ ἐχθρός — 敵は言った (прямая речь врага в 『…』). Διώξας καταλήμψομαι — 追いかけて捕まえる (καταλαμβάνω). μεριῶ σκῦλα — 分捕り物を分ける (σκῦλον — «добыча»). ἐμπλήσω ψυχήν μου — 魂を満たす. ἀνελῶ τῇ μαχαίρῃ μου — わたしの剣で殺す (ἀναιρέω — «убивать, уничтожать»; μάχαιρα — «меч»; слав. «убию мечем моим»). κυριεύσει ἡ χείρ μου — 手が支配する (κυριεύω)."
  10: "ἀπέστειλας τὸ πνεῦμά σου — 息を送ると (ср. 15:8). ἐκάλυψεν αὐτοὺς θάλασσα — 海が覆った. ἔδυσαν ὡσεὶ μόλιβος — 鉛のように沈んだ (μόλιβος — «свинец»; δύω — «погружаться»). ἐν ὕδατι σφοδρῷ — 激しい水に (σφοδρός — «сильный, бурный»)."
  11: "τίς ὅμοιός σοι ἐν θεοῖς — 神々のうちで、だれがあなたに似ているか (вопрос повторён дважды — как в LXX и слав.). δεδοξασμένος ἐν ἁγίοις — 聖なる者たちのうちにあって栄光を受け (ἅγιοι — «святые»; слав. «прославлен во святых»). θαυμαστὸς ἐν δόξαις — 栄光のうちに驚くべき方 (θαυμαστός). ποιῶν τέρατα — 奇跡を行う方 (τέρας — «знамение, чудо»)."
  12: "ἐξέτεινας τὴν δεξιάν σου — 右の手を伸べると (ἐκτείνω). κατέπιεν αὐτοὺς γῆ — 地が彼らを飲み込んだ (καταπίνω)."
  13: "ὡδήγησας τῇ δικαιοσύνῃ σου — あなたの義によって導かれた (ὁδηγέω; δικαιοσύνη — «правда, праведность»). ὃν ἐλυτρώσω — 贖い出された (λυτρόω). παρεκάλεσας τῇ ἰσχύι σου — 力によって伴なわれた (παρακαλέω — «утешать, вести»; слав. «утешил еси»). εἰς κατάλυμα ἅγιόν σου — 聖なる住まいへ (κατάλυμα — «жилище, пристанище»)."
  14: "ἤκουσαν ἔθνη — 諸国の民は聞いて (ἔθνη — «народы, языки»). ὠργίσθησαν — 怒り (ὀργίζομαι). ὠδῖνες ἔλαβον — 産の苦しみに捕らわれた (ὠδίν — «родовые муки»; слав. «болезни прияша»). κατοικοῦντας Φυλιστιιμ — フィリスティヤに住む者たち (τοὺς κατοικοῦντας — винительный при ἔλαβον)."
  15: "τότε ἔσπευσαν ἡγεμόνες Εδωμ — そのとき、エドムの首長たちは慌て (σπεύδω — «спешить, тревожиться»; ἡγεμών — «вождь»). ἄρχοντες Μωαβιτῶν — モアブの支配者たち. ἔλαβεν αὐτοὺς τρόμος — 震えが捕らえた (τρόμος — «трепет»; слав. «прият я трепет»). ἐτάκησαν — 溶け去った (τήκω — «плавить, таять»; слав. «растаяша»)."
  16: "ἐπιπέσοι ἐπ᾽ αὐτοὺς φόβος καὶ τρόμος — 恐れと震えが彼らに降りかかるように (оптатив ἐπιπέσοι — пожелание; передано «…ように»). μεγέθει βραχίονός σου — あなたの腕の大きさによって (βραχίων — «мышца, рука»). ἀπολιθωθήτωσαν — 石のように固まるように (ἀπολιθόω — «окаменевать»; императив 3 л.). ἕως ἂν παρέλθῃ ὁ λαός σου — あなたの民が通り過ぎるまで (повтор сохранён; слав. «дондеже пройдут»). ὃν ἐκτήσω — 獲られた (κτάομαι — «приобретать»)."
  17: "εἰσαγαγὼν καταφύτευσον — 導き入れて植えてください (καταφυτεύω — «насаждать»; императив). εἰς ὄρος κληρονομίας σου — あなたの嗣業の山に (κληρονομία — «наследие»). εἰς ἕτοιμον κατοικητήριόν σου — 備えの所に (ἕτοιμος — «готовый»). ὃ κατειργάσω — あなたが造られた (κατεργάζομαι — «совершать»). ἁγίασμα — 聖所 (ἁγίασμα — «святыня»). ὃ ἡτοίμασαν αἱ χεῖρές σου — あなたの手が備えられた (ἑτοιμάζω)."
  18: "κύριος βασιλεύων τὸν αἰῶνα καὶ ἐπ᾽ αἰῶνα καὶ ἔτι — 主は王として治められる、世々に、永遠に、いつまでも (βασιλεύω — «царствовать»; καὶ ἔτι — «и ещё», усиление; слав. «и еще»; Синодальный — «во веки и в вечность»)."
  19: "Ὅτι εἰσῆλθεν ἵππος Φαραω — ファラオの馬が…入ると (ὅτι — причинное; по-японски связка не передаётся, стих продолжает песнь как объяснение). ἐπήγαγεν ἐπ᾽ αὐτοὺς τὸ ὕδωρ — 水を彼らの上に引き戻された (ἐπάγω). οἱ δὲ υἱοὶ Ισραηλ ἐπορεύθησαν διὰ ξηρᾶς — イスラエルの子らは乾いた地を歩いて渡った."
  20: "Λαβοῦσα … τὸ τύμπανον — タンバリンを取った (τύμπανον — «тимпа́н, бубен»; слав. «тимпан»). ἡ προφῆτις — 女預言者 (προφῆτις). ἡ ἀδελφὴ Ααρων — アロンの姉 (Мариам — сестра Аарона и Моисея; здесь названа по Аарону). μετὰ τυμπάνων καὶ χορῶν — タンバリンと踊りを携えて (χορός — «хоровод, пляска»)."
  21: "ἐξῆρχεν δὲ αὐτῶν Μαριαμ — ミリアムは彼女たちに先だって歌った (ἐξάρχω — «запевать, начинать»). Слова песни дословно совпадают с 15:1 — так и в LXX (в 1-м стихе «воспоём», здесь «пойте» по смыслу; по-японски форма одна)."
  22: "Ἐξῆρεν … ἀπὸ θαλάσσης ἐρυθρᾶς — 紅海から導き出し (ἐξαίρω). εἰς τὴν ἔρημον Σουρ — スルの荒野へ (Σουρ — «Сур»). τρεῖς ἡμέρας — 三日. οὐχ ηὕρισκον ὕδωρ ὥστε πιεῖν — 飲む水が見つからなかった (εὑρίσκω)."
  23: "ἦλθον δὲ εἰς Μερρα — マラに来た (Μερρα; в японской традиции マラ; слав. и Синодальный — «Мерра»). πικρὸν γὰρ ἦν — 苦かったからである (πικρός). ἐπωνομάσθη … Πικρία — 「苦さ」と名づけられた (Πικρία — «горечь»; слав. «наречеся имя месту тому горесть»)."
  24: "διεγόγγυζεν ὁ λαὸς ἐπὶ Μωυσῆν — 民はモーセに向かってつぶやいて (διαγογγύζω — «роптать»; ἐπί + вин. — «против»). Τί πιόμεθα; — わたしたちは何を飲むのか (futurum в значении вопроса)."
  25: "ἐβόησεν — 叫ぶと (βοάω). ἔδειξεν αὐτῷ κύριος ξύλον — 主は彼に一本の木を示された (ξύλον — «дерево»). ἐγλυκάνθη τὸ ὕδωρ — 水は甘くなった (γλυκαίνω — «делать сладким»). ἐκεῖ ἔθετο αὐτῷ δικαιώματα καὶ κρίσεις — そこは…掟と裁きを定め (δικαίωμα — «оправдание, устав»; κρίσις — «суд»). ἐπεὶρασεν αὐτόν — 彼を試みた (πειράζω; ср. Быт 22:1)."
  26: "Ἐὰν ἀκοῇ ἀκούσῃς — よく聞き従うなら (гебраизм, абсолютный инфинитив). τὰ ἀρεστὰ ἐναντίον αὐτοῦ ποιήσῃς — 主の前に喜ばれることを行い (ἀρεστός — «угодный»). ἐνωτίσῃ — 耳を傾け (ἐνωτίζομαι). πᾶσαν νόσον — どの病も (νόσος). ἐγὼ γάρ εἰμι κύριος ὁ ἰώμενός σε — わたしは主、あなたを癒す者である (ἰάομαι — «исцелять»; от этого имени — 癒し主)."
  27: "ἤλθοσαν εἰς Αιλιμ — エリムに来た (Αιλιμ). δώδεκα πηγαὶ ὑδάτων — 十二の水の泉 (πηγή — «источник»). ἑβδομήκοντα στελέχη φοινίκων — 七十本の棕櫚の木 (στέλεχος — «ствол»; φοῖνιξ — «финиковая пальма»). παρενέβαλον — 陣を張った (παρεμβάλλω; ср. 14:9)."
