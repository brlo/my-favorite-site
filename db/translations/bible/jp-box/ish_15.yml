# jp-box, Исход, глава 15. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и jp-joc (1901, public domain; ст. 1–19 и 22–27).
# ru — только для понимания, не источник. Язык — современный 常体.
# Глава 15: песнь Моисея (1–18), итог перехода (19), песнь Мириам и хоровод (20–21),
# воды Мерры (22–25a), устав и испытание, «Я Господь, целитель твой» (25b–26),
# Елим с двенадцатью источниками (27).
# Красного и синего нет: песнь Моисея — не речь Христа во плоти; «<j>» не ставится.
# Песнь 1–18 — прямая речь в 「…」 (одна цитата на всю песнь, как в Быт 49);
# слова врага внутри песни — 『…』 (9); песнь Мириам — снова 「…」 (21).
# Параллелизм сохранён: повторяющиеся полустишия не сглаживаются (1 и 21 совпадают
# дословно — так и в LXX). Оптатив 16 передаётся «…ように», просьба 17 — «…ください»,
# как в Псалтири.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 15:22–23: LXX — Μερρα, в японском тексте マラ (церковное название); имя места
# по-гречески — Πικρία, «горечь». 15:4 — ἐρυθρὰ θάλασσα, 紅海 (Чермное, 紅海).
# Сносок ⟨…⟩ нет. jp-ni не использовался.

