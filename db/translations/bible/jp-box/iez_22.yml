verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  2: "「人[ひと]の子[こ]よ、あなたは血[ち]の都[みやこ]を裁[さば]くのか。この都[みやこ]に、そのすべての不法[ふほう]を示[しめ]せ。"
  3: "そして言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。血[ち]をそのただ中[なか]に流[なが]して自分[じぶん]の時[とき]を来[こ]させ、自分[じぶん]を汚[けが]すために偶像[ぐうぞう]を造[つく]る都[みやこ]よ。"
  4: "あなたは流[なが]した血[ち]によって罪[つみ]を負[お]い、造[つく]った偶像[ぐうぞう]によって汚[けが]れた。あなたは自分[じぶん]の日[ひ]を近[ちか]づけ、自分の年[とし]の時[とき]を来[こ]させた。それゆえ、わたしはあなたを諸国[しょこく]の嘲[あざけ]りと、すべての地[ち]の物笑[ものわら]いとした。"
  5: "近[ちか]い者[もの]も遠[とお]い者[もの]も、あなたを嘲[あざけ]る。ああ、汚[けが]れた者[もの]、名高[なだか]く、不法[ふほう]の多[おお]い者よ。"
  6: "見[み]よ、イスラエルの家[いえ]の指導者[しどうしゃ]たちは、それぞれ自分[じぶん]の親族[しんぞく]とともに、あなたのただ中[なか]で血[ち]を流[なが]そうとして混[ま]じり合[あ]っている。"
  7: "あなたのただ中[なか]で、父[ちち]と母[はは]をののしり、寄留[きりゅう]の者[もの]に不法[ふほう]をもって対[たい]し、孤児[こじ]と寡婦[かふ]を虐[しいた]げた。"
  8: "わたしの聖[せい]なるもの[もの]を蔑[さげす]み、わたしの安息日[あんそくび]を汚[けが]した。"
  9: "あなたのただ中[なか]には、血[ち]を流[なが]すために待[ま]ち伏[ぶ]せる者[もの]たちがいる。彼らは山[やま]の上[うえ]で食[た]べ、あなたのただ中で恥[は]ずべきことを行[おこな]った。"
  10: "あなたのただ中[なか]で父[ちち]の裸[はだか]を暴[あば]き、汚[けが]れのうちに座[すわ]る女[おんな]を辱[はずかし]めた。"
  11: "それぞれが隣人[りんじん]の妻[つま]と不法[ふほう]を行[おこな]い、それぞれが嫁[よめ]を不敬[ふけい]のうちに汚[けが]し、それぞれが自分[じぶん]の姉妹[しまい]、父[ちち]の娘[むすめ]をあなたのただ中[なか]で辱[はずかし]めた。"
  12: "あなたのただ中[なか]で、血[ち]を流[なが]すために賄賂[わいろ]を取[と]り、利息[りそく]と増[ま]し身[み]を取[と]った。あなたは不法[ふほう]な搾取[さくしゅ]によって隣人[りんじん]から利[り]をむさぼり、わたしを忘[わす]れた、と主[しゅ]なる神[かみ]は言[い]われる。"
  13: "見[み]よ、わたしは、あなたが得[え]た不正[ふせい]のゆえに、またあなたのただ中[なか]に流[なが]れた血[ち]のゆえに、手[て]を手[て]に打[う]ち鳴[な]らす。"
  14: "あなたの心[こころ]は耐[た]えられるのか。あなたの手[て]は、わたしがあなたに対して行[おこな]う日[ひ]々[び]に強[つよ]くありうるか。わたしは主[しゅ]、語[かた]った。そして行[おこな]う。"
  15: "わたしはあなたを諸国[しょこく]の間[あいだ]に散[ち]らし、地々[ちち]にまき散[ち]らす。あなたの汚[けが]れはあなたから消[き]え去[さ]る。"
  16: "わたしは諸国[しょこく]の目[め]の前[まえ]で、あなたのうちに嗣業[しぎょう]を受[う]ける。あなたがたは、わたしが主[しゅ]であることを知[し]る。」"
  17: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  18: "「人[ひと]の子[こ]よ、見[み]よ、イスラエルの家[いえ]はわたしにとって、すべて銅[どう]、鉄[てつ]、錫[すず]、鉛[なまり]と混[ま]じり合[あ]ったもの、銀[ぎん]のただ中[なか]に混[ま]じり合[あ]った滓[かす]となった。"
  19: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。あなたがたはみな一[ひと]つの混[こ]ぜ物[もの]となった。それゆえ、わたしはあなたがたをエルサレムのただ中[なか]に集[あつ]める。"
  20: "銀[ぎん]、銅[どう]、鉄[てつ]、錫[すず]、鉛[なまり]が炉[ろ]のただ中[なか]に集[あつ]められ、その上[うえ]に火[ひ]を吹[ふ]きかけて溶[と]かされるように、わたしは怒[いか]りのうちであなたがたを集[あつ]め、あなたがたを溶[と]かす。"
  21: "わたしは怒[いか]りの火[ひ]をもってあなたがたに吹[ふ]きかける。あなたがたはそのただ中[なか]で溶[と]かされる。"
  22: "炉[ろ]のただ中[なか]で銀[ぎん]が溶[と]かされるように、あなたがたもそのただ中で溶[と]かされる。あなたがたは、わたしが主[しゅ]であること、あなたがたの上[うえ]にわたしの怒[いか]りを注[そそ]いだことを知[し]る。」"
  23: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  24: "「人[ひと]の子[こ]よ、この地[ち]に言[い]え。あなたは、怒[いか]りの日[ひ]に雨[あめ]が降[ふ]らず、潤[うるお]いもしない地[ち]である。"
  25: "その指導者[しどうしゃ]たちは、そのただ中[なか]でほえる獅子[しし]のようであり、獲物[えもの]を奪[うば]い、力[ちから]をもって魂[たましい]を食[く]らい、不正[ふせい]をもって財[ざい]と誉[ほま]れを取[と]る。あなたの寡婦[かふ]たちはそのただ中で多[おお]くなった。"
  26: "その祭司[さいし]たちはわたしの律法[りっぽう]を破[やぶ]り、わたしの聖[せい]なるもの[もの]を汚[けが]した。彼らは聖[せい]なるものと汚[けが]れたものとを区別[くべつ]せず、汚[けが]れたものと清[きよ]いものとを分[わ]けず、わたしの安息日[あんそくび]から目[め]を覆[おお]い、わたしは彼らのただ中[なか]で汚[けが]された。"
  27: "その君[きみ]たちは、そのただ中[なか]で獲物[えもの]を奪[うば]う狼[おおかみ]のようであり、血[ち]を流[なが]し、魂[たましい]を滅[ほろ]ぼし、貪[むさぼ]りによって貪[むさぼ]る。"
  28: "その預言者[よげんしゃ]たちは、彼らに白[しろ]を塗[ぬ]りながら、自[みずか]ら倒[たお]れる。空[むな]しいものを見[み]、偽[いつわ]りを占[うらな]い、『主[しゅ]なる神[かみ]はこう言[い]われる』と言[い]う。しかし主[しゅ]は語[かた]ってはいない。"
  29: "この地[ち]の民[たみ]は不法[ふほう]をもって虐[しいた]げ、奪[うば]い、貧[まず]しい者[もの]と乏[とぼ]しい者[もの]を虐[しいた]げ、寄留[きりゅう]の者[もの]を裁[さば]きをもって扱[あつか]わない。"
  30: "わたしは彼らの中[なか]から、正[ただ]しく歩[あゆ]み、わたしの前[まえ]に全[まった]く立[た]って、わたしの怒[いか]りの時[とき]にこの地[ち]を滅[ほろ]ぼし尽[つ]くさないようにする人[ひと]を求[もと]めたが、見[み]いだせなかった。"
  31: "わたしは彼らの上[うえ]に怒[いか]りを注[そそ]ぎ、怒[いか]りの火[ひ]をもって彼らを滅[ほろ]ぼし尽[つ]くす。わたしは彼らの道[みち]を彼らの頭[あたま]に返[かえ]す、と主[しゅ]なる神[かみ]は言[い]われる。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — вводная формула; нумерация совпадает с gr, csl и ru."
  2: "εἰ κρινεῖς τὴν πόλιν τῶν αἱμάτων — «будешь ли судить город кровей?» (εἰ — вопрос); παράδειξον αὐτῇ πάσας τὰς ἀνομίας αὐτῆς — «покажи ей все беззакония её». Титул «город кровей» повторён в 24:6,9."
  3: "Ὦ πόλις ἐκχέουσα αἵματα ἐν μέσῳ αὐτῆς — «о город, проливающий кровь среди себя»; τοῦ ἐλθεῖν καιρὸν αὐτῆς — «чтобы пришло время её»; ποιοῦσα ἐνθυμήματα καθ᾿ αὑτῆς τοῦ μιαίνειν αὐτήν — «делающая идолов (помышления) против себя, чтобы осквернить себя»; слав. «творяй кумиры на себе»."
  4: "ἐν τοῖς αἵμασιν αὐτῶν, οἷς ἐξέχεας, παραπέπτωκας — «кровью, которую ты пролил, ты согрешил (пал)»; ἤγγισας τὰς ἡμέρας σου — «приблизил дни твои»; εἰς ὄνειδος... καὶ εἰς ἐμπαιγμόν — «в поношение и в посмеяние»."
  5: "ταῖς ἐγγιζούσαις... καὶ ταῖς μακρὰν ἀπεχούσαις — «близким и далёким»; Ἀκάθαρτος ἡ ὀνομαστὴ καὶ πολλὴ ἐν ταῖς ἀνομίαις — «нечистая, именитая и великая в беззакониях»; слав. «о, нечистый, пресловутый и мног во беззакониих»."
  6: "οἱ ἀφηγούμενοι οἴκου Ισραηλ — «вожди дома Израилева»; ἕκαστος πρὸς τοὺς συγγενεῖς αὐτοῦ συνανεφύροντο ἐν σοί — «каждый с родственниками своими смешивался в тебе»; ὅπως ἐκχέωσιν αἷμα — «чтобы пролить кровь»."
  7: "πατέρα καὶ μητέρα ἐκακολόγουν ἐν σοί — «отца и мать злословили в тебе» (κακολογέω); πρὸς τὸν προσήλυτον ἀνεστρέφοντο ἐν ἀδικίαις — «с пришельцем обращались неправдою»; ὀρφανὸν καὶ χήραν κατεδυνάστευον — «сироту и вдову притесняли»."
  8: "τὰ ἅγιά μου ἐξουδένουν — «святыни Мои уничижали»; τὰ σάββατά μου ἐβεβήλουν — «субботы Мои оскверняли»."
  9: "ἄνδρες λῃσταὶ ἐν σοί — «мужи разбойники в тебе»; ἐπὶ τῶν ὀρέων ἤσθοσαν ἐν σοί — «на горах ели в тебе» (речь об идоложертвенном, ср. ru); ἀνόσια ἐποίουν — «нечестивое делали»."
  10: "αἰσχύνην πατρὸς ἀπεκάλυψαν — «наготу отца открыли»; ἐν ἀκαθαρσίαις ἀποκαθημένην ἐταπείνουν — «сидящую в нечистотах (менструации) унижали» (ἀποκάθημαι, ср. Плач 1:17)."
  11: "ἕκαστος τὴν γυναῖκα τοῦ πλησίον αὐτοῦ ἠνόμουν — «каждый с женой ближнего беззаконновал»; τὴν νύμφην αὐτοῦ ἐμίαινεν ἐν ἀσεβείᾳ — «невестку свою осквернял в нечестии»; τὴν ἀδελφὴν αὐτοῦ θυγατέρα τοῦ πατρὸς αὐτοῦ — «сестру свою, дочь отца своего» (единокровную)."
  12: "δῶρα ἐλαμβάνοσαν... ὅπως ἐκχέωσιν αἷμα — «взятки брали, чтобы пролить кровь»; τόκον καὶ πλεονασμόν — «рост и лихву (избыток)»; ἐμοῦ δὲ ἐπελάθου — «а Меня забыл»."
  13: "ἐὰν δὲ πατάξω χεῖρά μου πρὸς χεῖρά μου — «вот, Я ударю руку Мою о руку Мою» (всплесну руками); ἐφ᾿ οἷς συντετέλεσαι — «за то, что ты совершил (приобрёл)»; ἐπὶ τοῖς αἵμασίν σου — «за кровь твою»."
  14: "εἰ ὑποστήσεται ἡ καρδία σου; — «устоит ли сердце твоё?»; εἰ κρατήσουσιν αἱ χεῖρές σου — «будут ли крепки руки твои»; ἐν ταῖς ἡμέραις, αἷς ἐγὼ ποιῶ ἐν σοί — «в дни, когда Я действую в тебе»."
  15: "διασκορπιῶ σε ἐν τοῖς ἔθνεσιν — «рассею тебя по народам»; διασπερῶ σε ἐν ταῖς χώραις — «развею тебя по странам»; ἐκλείψει ἡ ἀκαθαρσία σου ἐκ σοῦ — «оскудеет нечистота твоя из тебя»."
  16: "κατακληρονομήσω ἐν σοί — «наследую в тебе» (κληρονομέω); κατ᾿ ὀφθαλμοὺς τῶν ἐθνῶν — «пред глазами народов». Слав. «владети буду тобою пред очима языков»; ru (МТ) «сделаешь сам себя презренным» — иное чтение, в текст не внесено."
  17: "Вводная формула; далее притча о плавильной печи (18–22)."
  18: "ἀναμεμειγμένοι πάντες χαλκῷ καὶ σιδήρῳ καὶ κασσιτέρῳ καὶ μολύβδῳ — «все смешаны с медью, железом, оловом и свинцом» (χαλκός — медь/бронза, 銅; κασσίτερος — олово, 錫; μόλιβδος — свинец, 鉛). ἐν μέσῳ ἀργυρίου ἀναμεμειγμένος ἐστίν — «среди серебра смешан». Слав. добавляет «в пещи» («среде пещи сребро смешено») — нет в LXX, отмечено."
  19: "εἰς σύγκρασιν μίαν — «в одно смешение (сплав)»; ἐγὼ εἰσδέχομαι ὑμᾶς εἰς μέσον Ιερουσαλημ — «Я принимаю (собираю) вас в середину Иерусалима»."
  20: "καθὼς εἰσδέχεται ἄργυρος καὶ χαλκὸς... εἰς μέσον καμίνου — «как принимается серебро и медь... в середину горнила»; τοῦ ἐκφυσῆσαι εἰς αὐτὸ πῦρ τοῦ χωνευθῆναι — «чтобы раздуть на него огонь, чтобы расплавить»; συνάξω καὶ χωνεύσω ὑμᾶς — «соберу и расплавлю вас»."
  21: "ἐκφυσήσω ἐφ᾿ ὑμᾶς ἐν πυρὶ ὀργῆς μου — «дохну на вас огнём гнева Моего»; χωνευθήσεσθε ἐν μέσῳ αὐτῆς — «расплавитесь в середине его (горнила)»."
  22: "ὃν τρόπον χωνεύεται ἀργύριον — «как плавится серебро»; ἐξέχεα τὸν θυμόν μου ἐφ᾿ ὑμᾶς — «излил гнев Мой на вас»."
  23: "Вводная формула; далее слово о земле, князьях, священниках, пророках и народе (24–31)."
  24: "γῆ ἡ οὐ βρεχομένη — «земля неорошаемая» (βρέχω — орошать); οὐδὲ ὑετὸς ἐγένετο ἐπὶ σὲ ἐν ἡμέρᾳ ὀργῆς — «и дождь не был на тебя в день гнева». ru (МТ) читает «неочищенная» — иное чтение, в текст не внесено."
  25: "ἧς οἱ ἀφηγούμενοι... ὡς λέοντες ὠρυόμενοι — «её вожди, как львы рыкающие» (ὀρύομαι — рычать); ἁρπάζοντες ἁρπάγματα — «похищающие похищенное»; ψυχὰς κατεσθίοντες ἐν δυναστείᾳ — «души поедающие насилием»; τιμὰς λαμβάνοντες ἐν ἀδικίᾳ — «почести принимающие в неправде». В LXX и слав. здесь «князья»; ru/МТ читает «заговор пророков её» — держим LXX/csl."
  26: "οἱ ἱερεῖς αὐτῆς ἠθέτησαν νόμον μου — «священники её отвергли закон Мой»; ἀνὰ μέσον ἁγίου καὶ βεβήλου οὐ διέστελλον — «между святым и осквернённым не различали»; ἀπὸ τῶν σαββάτων μου παρεκάλυπτον τοὺς ὀφθαλμούς — «от суббот Моих закрывали глаза свои»."
  27: "οἱ ἄρχοντες αὐτῆς... ὡς λύκοι ἁρπάζοντες ἁρπάγματα — «князья её, как волки, похищающие добычу»; τοῦ ἐκχέαι αἷμα — «чтобы пролить кровь»; ὅπως πλεονεξίᾳ πλεονεκτῶσιν — «чтобы корыстолюбием корыстолюбствовать». Слав. добавляет «и погубити душы» — нет в LXX, внесено без скобок."
  28: "οἱ προφῆται αὐτῆς ἀλείφοντες αὐτοὺς πεσοῦνται — «пророки её, умащающие их, падут» (ἀλείφω — мазать, ср. 13:10–15, где белят стену); ὁρῶντες μάταια, μαντευόμενοι ψευδῆ — «видящие пустое, гадающие ложно»; λέγοντες Τάδε λέγει κύριος, καὶ κύριος οὐ λελάληκεν — «говорящие: так говорит Господь, — а Господь не говорил». Слова ложных пророков — 『…』."
  29: "λαὸν τῆς γῆς ἐκπιεζοῦντες ἀδικίᾳ — «народ земли притесняющие неправдою»; διαρπάζοντες ἁρπάγματα — «расхищающие»; πτωχὸν καὶ πένητα καταδυναστεύοντες — «бедного и нищего притесняющие»; πρὸς τὸν προσήλυτον οὐκ ἀναστρεφόμενοι μετὰ κρίματος — «с пришельцем не обращающиеся по суду»."
  30: "ἐζήτουν ἐξ αὐτῶν ἄνδρα ἀναστρεφόμενον ὀρθῶς καὶ ἑστῶτα πρὸ προσώπου μου ὁλοσχερῶς — «искал Я у них человека, обращающегося право и стоящего пред лицом Моим совершенно»; ἐν καιρῷ τῆς γῆς — «во время земли» (слав. «во время гнева моего», в тексте слав.); τοῦ μὴ εἰς τέλος ἐξαλεῖψαι αὐτήν — «чтобы не до конца истребить её»; καὶ οὐχ εὗρον — «и не нашёл». В ru/МТ — образ стены и пролома, в LXX его нет."
  31: "ἐξέχεα ἐπ᾿ αὐτὴν θυμόν μου ἐν πυρὶ ὀργῆς μου — «излил на неё гнев Мой в огне ярости Моей»; τὰς ὁδοὺς αὐτῶν εἰς κεφαλὰς αὐτῶν δέδωκα — «пути их на головы их дал»."
