# jp-box, Иезекииль, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в этой главе gr, csl и ru совпадают: 31 стих.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
# Содержание: 1–5 «город кровей» — кровь и идолы, близкие и далёкие смеются;
# 6–12 перечень беззаконий: вожди, родители, пришелец, сирота и вдова, святыни
# и субботы, разбойники, кровосмешение, взятки и рост; 13–16 всплеск рук, рассеяние
# по народам; 17–22 притча о плавильной печи: дом Израилев — изгарь, Господь
# собирает и плавит в Иерусалиме; 23–31 земля неорошаемая: князья-львы,
# священники, князья-волки, пророки, народ; нет мужа, стоящего в проломе.
# Речи: 1 — формула вне кавычек; 2–16 — 「…」; 17 — формула; 18–22 — 「…»;
# 23 — формула; 24–31 — 「…» (в 28 слова ложных пророков — 『…』).
# Паритет: 22:16 слав. «владети буду тобою» при греч. «наследую в тебе», ru/МТ иное;
# 22:18 слав. добавляет «в пещи» — нет в LXX; 22:25 в LXX/csl «князья», в ru/МТ
# «пророки» — держим LXX/csl; 22:27 слав. добавляет «погубити душы» — нет в LXX;
# 22:30 слав. «во время гнева моего» при греч. «во время земли», ru/МТ — стена
# и пролом, в LXX их нет.
# Имена: エルサレム, イスラエル, ユダ.

