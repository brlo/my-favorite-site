# jp-box, Аввакум, глава 1. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной: наш 1:1–17 = gr 1:1–17 и csl 1:1–17, стих в стих.
# В книге 56 стихов (1: 17, 2: 20, 3: 19). Отличие только в гл. 3: слав. 3:1 включает
# начало gr 3:2 («Господи, услышах слух твой и убояхся»), поэтому наш 3:1 длиннее;
# нумерация дальше совпадает (см. avm_03).
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 надписание; 2–4 «доколе, Господи»: насилие, закон разорён, суд
# превратный; 5–11 ответ Господа: халдеи, быстрые и страшные, «дело, которому
# не поверите»; 12–17 молитва пророка: «не Ты ли издревле», люди как рыбы,
# халдей ловит всех удою.
# Голоса: 1 — надписание; 2–4 — молитва пророка (без внешних кавычек); 5–11 —
# слово Господа в 「…» (формулы-вводки нет, речь начинается с «смотрите»);
# в 11 слова халдея о своём боге — 『…』; 12–17 — молитва пророка.
# 1:11: слав. «пременит дух и прейдет и помолится: сия крепость Богу моему» —
# «изменит дух, пройдёт и помолится: это сила бога моего»; понято как молитва
# халдея своему богу, поэтому 『…』; вариант понимания — в notes.
# 1:3: ὁ κριτὴς λαμβάνει — «судья берёт» (слав. «вземлет»); по смыслу — берёт дары,
# в тексте «賄を取る», буквальность оговорена в notes.
# 1:15: συντέλειαν ἐν ἀγκίστρῳ ἀνέσπασεν — тёмное («истребление удою извлёк»),
# передано буквально.
#
tr_code: jp-box
book: avm
chapter: 1
draft: true

verses:
  1: "預言者[よげんしゃ]ハバククが見[み]た託宣[たくせん]。"
  2: "主[しゅ]よ、いつまでわたしは叫[さけ]び、あなたは聞[き]かれないのか。わたしは虐[しいた]げられながら、あなたに向[む]かって叫[さけ]ぶのに、あなたは救[すく]わないのか。"
  3: "なぜあなたはわたしに労苦[ろうく]と苦[くる]しみを見[み]せ、悲惨[ひさん]と不法[ふほう]を見[み]させられるのか。わたしの前[まえ]に裁[さば]きが逆[さか]さになり、裁[さば]き手[て]は賄[わいろ]を取[と]る。"
  4: "それゆえ、律法[りっぽう]は崩[くず]れ、裁[さば]きは全[まった]く行[おこな]われない。悪[わる]い者[もの]が正[ただ]しい者[もの]を押[お]さえているからである。それゆえ、裁[さば]きは曲[ま]げて出[で]て来[く]る。"
  5: "「あなたがた、侮[あなど]る者[もの]たちよ、見[み]よ、眺[なが]めよ、驚[おどろ]け、そして消[き]え失[う]せよ。あなたがたの時代[じだい]にわたしは一[ひと]つのわざを行[おこな]う。だれかがあなたがたに告[つ]げても、あなたがたは信[しん]じないであろう。"
  6: "見[み]よ、わたしはカルデア人[じん]、戦[いくさ]に強[つよ]い者[もの]たちを起[お]こす。苦[にが]く、速[はや]い民[たみ]で、地[ち]の広[ひろ]がりを歩[あゆ]み、自分[じぶん]のものでない住[す]まいを嗣業[しぎょう]として得[え]ようとする。"
  7: "それは恐[おそ]ろしく、また目立[めだ]つ。その裁[さば]きはその者[もの]から出[で]、その取[と]り分[ぶん]もその者[もの]から出[で]る。"
  8: "その馬[うま]は豹[ひょう]よりも速[はや]く、アラビアの狼[おおかみ]よりも鋭[するど]い。その騎兵[きへい]は跳[は]ね、遠[とお]くから突[つ]き進[すす]み、食[く]らうことに飢[う]えた鷲[わし]のように飛[と]ぶ。"
  9: "そのすべてもろもろの者が虐[しいた]げるために来[き]て、その顔[かお]は前[まえ]を向[む]き、捕[と]らえた者[もの]を砂[すな]のように集[あつ]める。"
  10: "それは王[おう]たちの間[あいだ]で喜[よろこ]び、支配[しはい]者[しゃ]たちはその玩[もてあそ]び物[もの]となる。それはすべての城塞[じょうさい]をあざけり、土[つち]を積[つ]み上[あ]げてこれを取[と]る。"
  11: "そのとき、彼は心[こころ]を変[か]えて通[とお]り過[す]ぎ、こう祈[いの]る。『これがわたしの神[かみ]の力[ちから]だ』」。"
  12: "あなたは昔[むかし]から、主[しゅ]なるわたしの神[かみ]、わが聖[せい]なる方[かた]ではないのか。わたしたちは死[し]なない。主[しゅ]よ、あなたは彼を裁[さば]きのために立[た]て、岩[いわ]なる方[かた]よ、彼を懲[こら]しめるために備[そな]えられた。"
  13: "あなたの目[め]はあまりに清[きよ]くて悪[わる]を見[み]ることができず、苦[くる]しみを見[み]ることもできない。なぜあなたは裏切[うらぎ]る者[もの]たちを見[み]過[ご]し、悪[わる]い者[もの]が自分[じぶん]より正[ただ]しい者[もの]を飲[の]み込[こ]むとき、黙[だま]っておられるのか。"
  14: "あなたは人[ひと]を海[うみ]の魚[さかな]のように、治[おさ]める者[もの]のない這[は]うもののように造[つく]られる。"
  15: "彼はすべてを釣[つ]り針[ばり]で引[ひ]き上[あ]げ、網[あみ]で引[ひ]き、地引[じび]き網[あみ]で集[あつ]める。それゆえ彼は喜[よろこ]び、その心[こころ]は楽[たの]しむ。"
  16: "それゆえ、彼は自分の網[あみ]に犠牲[ぎせい]をささげ、自分の地引[じび]き網[あみ]に香[こう]をたき、それによってその分[ぶん]け前[まえ]が肥[こ]え、その食[た]べ物[もの]が選[え]り抜[ぬ]かれたものとなる。"
  17: "それゆえ、彼はその地引[じび]き網[あみ]を広[ひろ]げ、国[くに]々[ぐに]を絶[た]えず惜[お]しみなく殺[ころ]すのか。"

notes:
  1: "Τὸ λῆμμα, ὃ εἶδεν Αμβακουμ ὁ προφήτης — «видение (бремя), которое увидел пророк Аввакум» (λῆμμα — «бремя», в корпусе передаётся 託宣 (ср. Наум 1:1, Иер); слав. «видение»); ハバクク — форма корпуса."
  2: "Ἕως τίνος, κύριε, κεκράξομαι καὶ οὐ μὴ εἰσακούσῃς — «доколе, Господи, буду взывать и не услышишь» (κράζω — взывать, 叫ぶ); βοήσομαι πρὸς σὲ ἀδικούμενος — «буду вопиять к Тебе, терпя обиду» (ἀδικέω — обижать, 虐げられる); οὐ σώσεις — «и не спасёшь»."
  3: "ἵνα τί μοι ἔδειξας κόπους καὶ πόνους — «зачем Ты показал мне труды и болезни» (κόπος — труд, 労苦; πόνος — боль, 苦しみ); ἐπιβλέπειν ταλαιπωρίαν καὶ ἀσέβειαν — «смотреть на страдание и нечестие» (ταλαιπωρία — бедствие, 苦しみ; ἀσέβεια — нечестие, 不法); ἐξ ἐναντίας μου γέγονεν κρίσις — «против меня стал суд»; ὁ κριτὴς λαμβάνει — «судья берёт»: вероятно, берёт дары (слав. «вземлет»), поэтому 賄を取る; буквально «берёт»."
  4: "διεσκέδασται νόμος — «разорился (рассеялся) закон» (διασκεδάννυμι — рассеивать, 崩れる); οὐ διεξάγεται εἰς τέλος κρίμα — «не совершается до конца суд» (διεξάγω — доводить до конца); ὁ ἀσεβὴς καταδυναστεύει τὸν δίκαιον — «нечестивый притесняет праведного» (καταδυναστεύω — притеснять, 押さえる); ἐξελεύσεται τὸ κρίμα διεστραμμένον — «изыдет суд развращённый» (διαστρέφω — извращать, 曲げる)."
  5: "ἴδετε, οἱ καταφρονηταί — «смотрите, презрители» (καταφρονητής — презирающий, 侮る者); θαυμάσατε θαυμάσια — «удивитесь чудесам» (θαυμάσιος — чудесный); ἀφανίσθητε — «исчезните» (ἀφανίζω — уничтожать, 消え失せる); ἔργον ἐγὼ ἐργάζομαι ἐν ταῖς ἡμέραις ὑμῶν — «дело Я делаю во дни ваши» (цит. Деян 13:41); ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται — «которому не поверите, если кто и расскажет» (ἐκδιηγέομαι — рассказывать, 告げる). В ru «посмотрите между народами» — по МТ, в LXX нет."
  6: "ἐξεγείρω ἐφ᾿ ὑμᾶς τοὺς Χαλδαίους τοὺς μαχητάς — «воздвигаю на вас Халдеев, воинственных» (Χαλδαῖοι — カルデア人; μαχητής — воин); τὸ ἔθνος τὸ πικρὸν καὶ τὸ ταχινόν — «народ горький и быстрый» (πικρός — горький, 苦い; ταχινός — скорый, 速い); πορευόμενον ἐπὶ τὰ πλάτη τῆς γῆς — «ходящий по широтам земли» (πλάτος — широта, 広がり); κατακληρονομῆσαι σκηνώματα οὐκ αὐτοῦ — «наследовать селения не свои» (κατακληρονομέω — наследовать, 嗣業として得る)."
  7: "φοβερὸς καὶ ἐπιφανής ἐστιν — «страшен и явен есть» (ἐπιφανής — видный, 目立つ); ἐξ αὐτοῦ τὸ κρίμα αὐτοῦ ἔσται — «от него суд его будет»; τὸ λῆμμα αὐτοῦ ἐξ αὐτοῦ ἐξελεύσεται — «взятие (бремя) его от него изыдет»."
  8: "ἐξαλοῦνται ὑπὲρ παρδάλεις οἱ ἵπποι αὐτοῦ — «вскочат паче барсов кони его» (πάρδαλις — барс, 豹); ὀξύτεροι ὑπὲρ τοὺς λύκους τῆς Ἀραβίας — «быстрее волков Аравийских» (ὀξύς — острый/быстрый, 鋭い); ἐξιππάσονται οἱ ἱππεῖς — «поскачут всадники» (ἐξιππάζομαι); ὁρμήσουσιν μακρόθεν — «устремятся издалека»; πετασθήσονται ὡς ἀετὸς πρόθυμος εἰς τὸ φαγεῖν — «полетят как орёл, готовый на еду» (ἀετός — 鷲)."
  9: "συντέλεια εἰς ἀσεβεῖς ἥξει — «конец (истребление) на нечестивых придёт»; ἀνθεστηκότας προσώποις αὐτῶν ἐξ ἐναντίας — «противостоящих лицам их напротив»; συνάξει ὡς ἄμμον αἰχμαλωσίαν — «соберёт как песок плен» (ἄμμος — песок, 砂; αἰχμαλωσία — плен, 捕らえた者)."
  10: "ἐν βασιλεῦσιν ἐντρυφήσει — «над царями насладится (посмеётся)» (ἐντρυφάω — наслаждаться, 喜ぶ); τύραννοι παίγνια αὐτοῦ — «тираны — игрушки его» (παίγνιον — игрушка, 玩び物); εἰς πᾶν ὀχύρωμα ἐμπαίξεται — «над всякой крепостью посмеётся» (ὀχύρωμα — крепость, 城塞); βαλεῖ χῶμα καὶ κρατήσει αὐτοῦ — «насыплет вал и овладеет ею» (χῶμα — насыпь, 土)."
  11: "τότε μεταβαλεῖ τὸ πνεῦμα — «тогда изменит дух» (μεταβάλλω — изменять, 変える); διελεύσεται — «пройдёт»; ἐξιλάσεται — «умилостивится (помолится)» (ἐξιλάσκομαι — умилостивлять, 祈る); αὕτη ἡ ἰσχὺς τῷ θεῷ μου — «сия крепость Богу моему»: слова халдея о своём боге, поэтому 『…』; иное понимание — «это сила моего Бога» как восклицание пророка (слав. «Богу моему») — отмечено. Здесь слово Господа закрывается."
  12: "οὐχὶ σὺ ἀπ᾿ ἀρχῆς, κύριε — «не Ты ли издревле, Господи»; ὁ θεὸς ὁ ἅγιός μου — «Бог, Святый мой»; οὐ μὴ ἀποθάνωμεν — «мы не умрём»; εἰς κρίμα τέταχας αὐτόν — «на суд Ты поставил его» (τάσσω — ставить, 立てる); ἔπλασέν με τοῦ ἐλέγχειν παιδείαν αὐτοῦ — «создал меня обличать наказание его» (πλάσσω — лепить, 造る; ἐλέγχω — обличать, 責める). В ru «Скала моя!» — по МТ, в LXX нет."
  13: "καθαρὸς ὀφθαλμὸς τοῦ μὴ ὁρᾶν πονηρά — «чист оком, чтобы не видеть зла»; ἐπιβλέπειν ἐπὶ πόνους οὐ δυνήσῃ — «взирать на труды (страдания) не можешь»; ἵνα τί ἐπιβλέπεις ἐπὶ καταφρονοῦντας — «зачем призираешь на презрителей»; παρασιωπήσῃ ἐν τῷ καταπίνειν ἀσεβῆ τὸν δίκαιον — «премолчишь, когда поглощает нечестивый праведного» (παρασιωπάω — молчать, 黙る)."
  14: "ποιήσεις τοὺς ἀνθρώπους ὡς τοὺς ἰχθύας τῆς θαλάσσης — «сделаешь людей как рыб морских»; ὡς τὰ ἑρπετὰ τὰ οὐκ ἔχοντα ἡγούμενον — «как пресмыкающихся, не имеющих вождя» (ἑρπετόν — пресмыкающееся, 這うもの; ἡγούμενος — вождь, 治める者)."
  15: "συντέλειαν ἐν ἀγκίστρῳ ἀνέσπασεν — «истребление удою извлёк» (ἄγκιστρον — крючок, 釣り針; ἀνασπάω — вытаскивать, 引き上げる): LXX συντέλειαν как объект — тёмное место, передано буквально; εἵλκυσεν αὐτὸν ἐν ἀμφιβλήστρῳ — «повлёк его в сети» (ἀμφίβληστρον — сеть, 網); συνήγαγεν ἐν ταῖς σαγήναις αὐτοῦ — «собрал в невода свои» (σαγήνη — невод, 地引き網)."
  16: "θύσει τῇ σαγήνῃ αὐτοῦ — «принесёт жертву неводу своему» (θύω — приносить жертву, 犠牲をささげる; слав. «пожрет мрежи своей» понял иначе — взято LXX); θυμιάσει τῷ ἀμφιβλήστρῳ — «покадит сети своей» (θυμιάω — кадить, 香をたく); ἐν αὐτοῖς ἐλίπανεν μερίδα αὐτοῦ — «ими утучнил часть свою» (λιπαίνω — утучнять, 肥える); τὰ βρώματα αὐτοῦ ἐκλεκτά — «пищи его избранные»."
  17: "ἀμφιβαλεῖ τὸ ἀμφίβληστρον αὐτοῦ — «забросит сеть свою» (ἀμφιβάλλω — набрасывать); ἀποκτέννειν ἔθνη οὐ φείσεται — «убивать народы не пощадит» (φείδομαι — щадить, 惜しむ)."
