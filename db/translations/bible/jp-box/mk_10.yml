verses:
  1: "イエスはそこを立[た]って、ユダヤの地[ち]とヨルダン川[がわ]の向[む]こう側[がわ]へ行[い]かれた。群衆[ぐんしゅう]がまた集[あつ]まって来[き]たので、イエスはいつものように、また教[おし]え始[はじ]められた。"
  2: "〔ファリサイ派[は]の人々[ひとびと]が〕近[ちか]寄[ちかよ]って、イエスに尋[たず]ねた。「夫[おっと]が妻[つま]を離縁[りえん]することは、律法[りっぽう]にかなっているでしょうか。」イエスを試[こころ]みようとしたのである。"
  3: "イエスはお答[こた]えになった。「<j>モーセはあなたがたに、何[なん]と命[めい]じたか。</j>」"
  4: "彼[かれ]らは言[い]った。「モーセは、離縁状[りえんじょう]を書[か]いて妻[つま]を去[さ]らせることを許[ゆる]しました。」"
  5: "イエスは言[い]われた。「<j>あなたがたの心[こころ]がかたくなだから、モーセはこの掟[おきて]をあなたがたに書[か]いたのだ。</j>"
  6: "<j>だが、世[よ]の初[はじ]めから、神[かみ]は人[ひと]を男[おとこ]と女[おんな]としてお造[つく]りになった。</j>"
  7: "<j>それゆえ、男[おとこ]は父[ちち]と母[はは]を離[はな]れ、妻[つま]と結[むす]ばれ、</j>"
  8: "<j>二人[ふたり]は一[ひと]つの肉[にく]になる。もはや二人[ふたり]ではなく、一[ひと]つの肉[にく]なのだ。</j>"
  9: "<j>だから、神[かみ]が結[むす]び合[あ]わせたものを、人[ひと]が引[ひ]き離[はな]してはならない。</j>」"
  10: "家[いえ]の中[なか]で、弟子[でし]たちはもう一度[いちど]この問題[もんだい]をイエスに尋[たず]ねた。"
  11: "イエスは言[い]われた。「<j>妻[つま]を離縁[りえん]して別[べつ]の女[おんな]と結婚[けっこん]する者[もの]は、妻[つま]に対[たい]して姦淫[かんいん]を犯[おか]す。</j>"
  12: "<j>妻[つま]もまた、夫[おっと]を離縁[りえん]して別[べつ]の男[おとこ]と結婚[けっこん]すれば、姦淫[かんいん]を犯[おか]すのである。</j>」"
  13: "人々[ひとびと]は、イエスに触[さわ]っていただこうとして、子[こ]どもたちを連[つ]れて来[き]た。弟子[でし]たちはその人[ひと]たちを叱[しか]った。"
  14: "イエスはこれを見[み]て腹[はら]を立[た]て、言[い]われた。「<j>子[こ]どもたちをわたしのところへ来[こ]させなさい。邪魔[じゃま]をしてはならない。神[かみ]の国[くに]は、このような者[もの]たちのものだからである。</j>"
  15: "<j>はっきり言[い]っておく。神[かみ]の国[くに]を子[こ]どものように受[う]け取[と]らない者[もの]は、そこに入[はい]れない。</j>」"
  16: "イエスは子[こ]どもたちを抱[だ]き、手[て]を置[お]いて、祝福[しゅくふく]された。"
  17: "イエスが道[みち]に出[で]られると、一人[ひとり]の男[おとこ]が走[はし]り寄[よ]って、ひざまずき、「善[よ]い先生[せんせい]、永遠[えいえん]の命[いのち]を受[う]け継[つ]ぐには、何[なに]をすればよいでしょうか」と尋[たず]ねた。"
  18: "イエスは言[い]われた。「<j>なぜ、わたしを善[よ]いと呼[よ]ぶのか。善[よ]い方は、神[かみ]おひとりだけである。</j>"
  19: "<j>あなたは掟[おきて]を知[し]っている。『殺[ころ]すな』『姦淫[かんいん]するな』『盗[ぬす]むな』『偽[いつわ]りの証[あかし]を立[た]てるな』『欺[だま]し取[と]るな』『父[ちち]と母[はは]を敬[うやま]え』。</j>」"
  20: "男[おとこ]は言[い]った。「先生[せんせい]、そういうことはみな、若[わか]い時[とき]から守[まも]ってきました。」"
  21: "イエスはその男[おとこ]を見[み]つめ、彼[かれ]を愛[あい]して言[い]われた。「<j>あなたに足[た]りないものが一[ひと]つある。持[も]っているものを売[う]り払[はら]って貧[まず]しい人[ひと]に施[ほどこ]しなさい。そうすれば、天[てん]に宝[たから]を積[つ]むことができる。〔そして、十字架[じゅうじか]を負[お]って〕わたしに従[したが]いなさい。</j>」"
  22: "男[おとこ]はこの言葉[ことば]に顔[かお]を曇[くも]らせ、悲[かな]しみながら去[さ]って行[い]った。多[おお]くの財産[ざいさん]を持[も]っていたからである。"
  23: "イエスは見回[みまわ]して、弟子[でし]たちに言[い]われた。「<j>財産[ざいさん]を持[も]つ者[もの]が神[かみ]の国[くに]に入[はい]るのは、なんと難[むずか]しいことか。</j>」"
  24: "弟子[でし]たちはその言葉[ことば]に驚[おどろ]いた。イエスはまた言[い]われた。「<j>子[こ]どもたちよ、〔富[とみ]を頼[たの]む者[もの]が〕神[かみ]の国[くに]に入[はい]るのは、なんと難[むずか]しいことか。</j>"
  25: "<j>らくだが針[はり]の穴[あな]を通[とお]り抜[ぬ]けるほうが、富[とみ]ある者[もの]が神[かみ]の国[くに]に入[はい]るより易[やさ]しい。</j>」"
  26: "彼[かれ]らはますます驚[おどろ]いて、「それでは、誰[だれ]が救[すく]われるのだろうか」と互[たが]いに言[い]った。"
  27: "イエスは彼[かれ]らを見[み]つめて言[い]われた。「<j>人[ひと]にはできないが、神[かみ]にはできる。神[かみ]にはすべてができるからである。</j>」"
  28: "ペトロが言[い]い出[だ]した。「ご覧[らん]ください。わたしたちは何[なに]もかも捨[す]てて、あなたに従[したが]ってきました。」"
  29: "イエスは言[い]われた。「<j>はっきり言[い]っておく。わたしのため、また福音[ふくいん]のために家[いえ]を、兄弟[きょうだい]を、姉妹[しまい]を、母[はは]を、父[ちち]を、子[こ]を、畑[はたけ]を捨[す]てた者[もの]で、</j>"
  30: "<j>今[いま]この世[よ]で百倍[ひゃくばい]の家[いえ]、兄弟[きょうだい]、姉妹[しまい]、母[はは]、子[こ]、畑[はたけ]を、迫害[はくがい]とともに受[う]け、来[く]るべき世[よ]では永遠[えいえん]の命[いのち]を受[う]けない者[もの]は、一人[ひとり]もいない。</j>"
  31: "<j>しかし、先[さき]の者[もの]の多[おお]くは後[あと]になり、後[あと]の者[もの]は先[さき]になる。</j>」"
  32: "一行[いっこう]はエルサレムへ上[のぼ]る道[みち]を進[すす]んでいた。イエスは先[さき]に立[た]って歩[ある]かれ、弟子[でし]たちは驚[おどろ]き、従[したが]う者[もの]たちは恐[おそ]れを抱[いだ]いた。イエスは十二人[じゅうににん]をそばに呼[よ]んで、これからご自身[じしん]に起[お]こることを話[はな]し始[はじ]められた。"
  33: "「<j>これから、わたしたちはエルサレムへ上[のぼ]る。人[ひと]の子[こ]は祭司長[さいしちょう]たちや律法学者[りっぽうがくしゃ]たちに引[ひ]き渡[わた]され、死刑[しけい]に定[さだ]められ、異邦人[いほうじん]に引[ひ]き渡[わた]される。</j>"
  34: "<j>彼[かれ]らは人[ひと]の子[こ]を嘲[あざけ]り、唾[つば]をかけ、鞭[むち]で打[う]ち、殺[ころ]す。しかし、三日[みっか]の後[のち]に復活[ふっかつ]する。</j>」"
  35: "ゼベダイの子[こ]ヤコブとヨハネが近[ちか]づいて来[き]て言[い]った。「先生[せんせい]、わたしたちが願[ねが]うことを、何[なん]でもかなえてください。」"
  36: "イエスは言[い]われた。「<j>わたしに何[なに]をしてほしいのか。</j>」"
  37: "二人[ふたり]は言[い]った。「あなたの栄光[えいこう]の座[ざ]で、一人[ひとり]をあなたの右[みぎ]に、一人[ひとり]を左[ひだり]に座[すわ]らせてください。」"
  38: "イエスは言[い]われた。「<j>あなたがたは、自分[じぶん]が何[なに]を求[もと]めているのか分[わ]かっていない。わたしが飲[の]む杯[さかずき]を飲[の]み、わたしが受[う]ける洗礼[せんれい]を受[う]けることができるのか。</j>」"
  39: "二人[ふたり]は「できます」と答[こた]えた。イエスは言[い]われた。「<j>わたしが飲[の]む杯[さかずき]は、あなたがたも飲[の]む。わたしが受[う]ける洗礼[せんれい]は、あなたがたも受[う]ける。</j>"
  40: "<j>しかし、わたしの右[みぎ]や左[ひだり]に座[すわ]ることは、わたしが許[ゆる]すことではない。それは、備[そな]えられている人[ひと]たちのものである。</j>」"
  41: "ほかの十人[じゅうにん]はこれを聞[き]いて、ヤコブとヨハネに腹[はら]を立[た]てた。"
  42: "イエスは彼[かれ]らを呼[よ]んで言[い]われた。「<j>異邦人[いほうじん]の支配者[しはいしゃ]たちは民[たみ]を思[おも]いのままに支配[しはい]し、大[おお]きな者[もの]たちは権力[けんりょく]を振[ふ]り回[まわ]している。あなたがたも知[し]っているとおりである。</j>"
  43: "<j>だが、あなたがたの間[あいだ]では、そうであってはならない。あなたがたの間[あいだ]で偉[えら]くなりたい者[もの]は、あなたがたに仕[つか]える者[もの]になり、</j>"
  44: "<j>あなたがたの間[あいだ]で一[いち]番[ばん]になりたい者[もの]は、すべての者[もの]の僕[しもべ]になるのだ。</j>"
  45: "<j>人[ひと]の子[こ]も、仕[つか]えてもらうために来[き]たのではなく、仕[つか]えるために、また多[おお]くの人[ひと]の贖[あがな]いとして自分[じぶん]の命[いのち]を与[あた]えるために来[き]たのである。</j>」"
  46: "一行[いっこう]はエリコに着[つ]いた。イエスが弟子[でし]たちや大勢[おおぜい]の群衆[ぐんしゅう]とともにエリコを出[で]ようとしたとき、ティマイの子[こ]バルティマイという目[め]の見[み]えない人[ひと]が、道[みち]のそばに座[すわ]って物[もの]乞[ご]いをしていた。"
  47: "イエス・ナザレの人[ひと]だと聞[き]くと、叫[さけ]び始[はじ]めた。「ダビデの子[こ]イエスよ、わたしを憐[あわ]れんでください。」"
  48: "多[おお]くの人[ひと]が黙[だま]るように叱[しか]ったが、彼[かれ]はいよいよ大[おお]きな声[こえ]で叫[さけ]んだ。「ダビデの子[こ]よ、わたしを憐[あわ]れんでください。」"
  49: "イエスは足[あし]を止[と]めて言[い]われた。「<j>彼[かれ]を呼[よ]びなさい。</j>」人々[ひとびと]は目[め]の見[み]えない人[ひと]を呼[よ]んで言[い]った。「安心[あんしん]しなさい。起[お]きなさい。あなたを呼[よ]んでおられる。」"
  50: "彼[かれ]は上着[うわぎ]を投[な]げ捨[す]てて飛[と]び起[お]き、イエスのもとへ来[き]た。"
  51: "イエスは言[い]われた。「<j>わたしに何[なに]をしてほしいのか。</j>」目[め]の見[み]えない人[ひと]は言[い]った。「ラボニ⟨「わたしの先生[せんせい]」の意[い]のヘブライ語[ご]。⟩、見[み]えるようになりたいのです。」"
  52: "イエスは言[い]われた。「<j>行[い]きなさい。あなたの信仰[しんこう]が、あなたを癒[いや]したのだ。</j>」すると、彼[かれ]はすぐに見[み]えるようになり、イエスに従[したが]って道[みち]を歩[ある]いて行[い]った。"

notes:
  1: "В критической базе καί при πέραν под скобками; союз без смысловой нагрузки, 〔〕 не ставил."
  2: "[προσελθόντες Φαρισαῖοι] в критической базе под скобками; Церковь читает — 〔…〕."
  4: "ἀποστάσιον — разводная грамота; 離縁状, как в Мф 19:7."
  7: "В критической базе καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ под скобками (западное чтение). Это часть цитаты Быт 2:24; оставлено без 〔〕, как в Мф 19:5."
  8: "σὰρξ μία — «одна плоть»; передал 一つの肉, чтобы не смешивать с 一体 (единство) и не сглаживать телесный образ."
  21: "TR и jp-joc (十字架を負ひて) добавляют ἄρας τὸν σταυρόν; в критической базе этого нет — 〔そして、十字架を負って〕."
  24: "В критической базе нет τοὺς πεποιθότας ἐπὶ τοῖς χρήμασιν; Церковь (jp-joc 富を恃む者) читает — 〔富を頼む者〕."
  29: "Порядок перечня по критическому греческому (μητέρα раньше πατέρα). У jp-joc в перечне есть 妻 — западное/TR добавление, в критической базе отсутствует, поэтому не беру."
  43: "διάκονος — служитель; 仕える者, чтобы не путать с 僕 (δοῦλος) в 44-м."
