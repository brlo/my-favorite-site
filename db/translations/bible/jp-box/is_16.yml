verses:
  1: "わたしは地[ち]の上[うえ]に、はうもののように遣[つか]わす。シオンの娘[むすめ]の山[やま]は、荒[あ]れ果[は]てた岩[いわ]なのか。"
  2: "モアブの娘[むすめ]よ、あなたは飛[と]び立[た]つ鳥[とり]の、奪[うば]い去[さ]られた雛[ひな]のようになるからだ。その後[のち]は、アルノンよ。"
  3: "さらに多[おお]くの計[はかり]ごとをせよ。彼女[かのじょ]のために、悲[かな]しみの覆[おお]いを絶[た]えず設[もう]けよ。彼らは真昼[まひる]の暗[やみ]の中[なか]を逃[に]げ、驚[おどろ]き惑[まど]っている。連[つ]れ去[さ]られてはならない。"
  4: "モアブの逃亡者[とうぼうしゃ]たちはあなたのもとに住[す]み、彼らはあなたがたの覆[おお]いとなって、迫[せま]る者[もの]の顔[かお]から守[まも]る。あなたの助[たす]けは取[と]り去[さ]られ、地[ち]を踏[ふ]みにじる支配者[しはいしゃ]は滅[ほろ]びたからである。"
  5: "そして、あわれみとともに王座[おうざ]が定[さだ]められ、ダビデの幕屋[まくや]のうちで、その王座に真理[しんり]をもって座[すわ]る者[もの]がある。その者は裁[さば]きを行[おこな]い、定[さだ]めを求[もと]め、義[ぎ]を急[いそ]ぐ。"
  6: "わたしたちはモアブの傲慢[ごうまん]を聞[き]いた。それはひどく傲慢[ごうまん]で、その高[たか]ぶりを高[たか]く上[あ]げた。あなたの占[うらな]いはそうではない。"
  7: "そうではない。モアブは泣[な]き叫[さけ]び、モアブの地[ち]ではすべての者[もの]が泣[な]き叫[さけ]ぶ。デセトに住[す]む者[もの]たちのためには、あなたは思[おも]いめぐらし、恥[は]じることはない。"
  8: "エセボンの畑[はたけ]は嘆[なげ]き、セバマのぶどうの木[き]は嘆く。もろもろの民[たみ]を食[く]らい尽[つ]くす者[もの]たちよ、ヤゼルに至[いた]るまで、彼女[かのじょ]のぶどう畑[ばたけ]を踏[ふ]みにじれ。あなたがたは決[けっ]して結[むす]び合[あ]うことはない。荒[あ]れ野[の]をさまよえ。遣[つか]わされた者[もの]たちは捨[す]て去[さ]られ、彼らは海[うみ]を渡[わた]ったからである。"
  9: "それゆえ、わたしはヤゼルの泣[な]きをもって、セバマのぶどうの木[き]のために泣[な]く。エセボンとエレアレよ、彼はあなたの木々[きぎ]を切[き]り倒[たお]した。あなたの刈[か]り入[い]れと、あなたのぶどうの収穫[しゅうかく]の上[うえ]を、わたしは踏[ふ]みつける。すべてのものは倒[たお]れる。"
  10: "ぶどう畑[ばたけ]から喜[よろこ]びと歓喜[かんき]が取[と]り去[さ]られる。あなたのぶどう畑[ばたけ]では、もはや喜[よろこ]ぶ者[もの]もなく、ぶどうを踏[ふ]んで酒[さか]ぶねに満[み]たす者[もの]もいない。それは終[お]わったからである。"
  11: "それゆえ、わたしの腹[はら]はモアブのために竪琴[たてごと]のように鳴[な]り、わたしの内[うち]なるものは、あなたが新[あら]たにした城壁[じょうへき]のようになる。"
  12: "そして、あなたが恥[は]じることになる。モアブは高[たか]い所[ところ]で疲[つか]れ果[は]て、自分の手[て]で造[つく]ったもののところに入[はい]って祈[いの]っても、それを救[すく]い出[だ]すことは決[けっ]してできないからである。"
  13: "これは、モアブについて主[しゅ]が語[かた]られた言葉[ことば]、主が語られたその言葉である。"
  14: "「しかし今[いま]、わたしは言[い]う。雇[やと]い人[びと]の年[とし]をもって数[かぞ]える三[さん]年[ねん]のうちに、モアブの栄光[えいこう]は、その多[おお]くの富[とみ]とともに軽[かろ]んじられ、残[のこ]りはわずかとなり、尊[とうと]くもなくなる。」"

notes:
  1: "Ἀποστελῶ ὡς ἑρπετὰ ἐπὶ τὴν γῆν — «пошлю как пресмыкающихся по земле»: LXX поняла евр. «пошли агнца» иначе (ἑρπετά — «гады, пресмыкающиеся»; слав. «послю аки гады на землю»), поэтому в тексте «はうもの». μὴ πέτρα ἔρημός ἐστιν τὸ ὄρος Σιων — «разве гора Сиона — пустая скала?»: вопрос с ожиданием отрицательного ответа. Слав. добавляет «дщере» («гора дщери Сиона»); в LXX только τὸ ὄρος Σιων, по паритету добавление внесено в основной текст. У МТ и Синодального стих иной: «посылайте агнцев владетелю земли из Селы»."
  2: "ἔσῃ γὰρ ὡς πετεινοῦ ἀνιπταμένου νεοσσὸς ἀφῃρημένος — «ибо будешь как птенец отнятый птицы улетающей»: ἀνίπταμαι — «улетать», νεοσσός — «птенец», ἀφαιρέω — «отнимать»; слав. «аки птицы парящия птенец отятый». θύγατερ Μωαβ — обращение к Моаву как к дочери. ἔπειτα δέ, Αρνων — «потом же, Арнон»: LXX оставляет висящее обращение к реке, к которому относится начало 16:3. Слав. переносит πλείονα βουλεύου («множайше совещавай») в конец этого стиха."
  3: "πλείονα βουλεύου — «больше советуйся, принимай больше решений» (βουλεύομαι); в слав. это стоит в конце 16:2. ποιεῖτε σκέπην πένθους αὐτῇ διὰ παντός — «делайте ей покров плача постоянно»: σκέπη — «покров, кров», πένθος — «плач, скорбь»; слав. «сотворите покров плача ея присно». ἐν μεσημβρινῇ σκοτίᾳ φεύγουσιν, ἐξέστησαν — «в полуденной тьме бегут, изумились» (ἐξίστημι — «быть вне себя, ужасаться»): настоящее время среди будущего сохранено. μὴ ἀπαχθῇς — «не будь уведён» (ἀπάγω — «уводить, увлекать»)."
  4: "παροικήσουσίν σοι οἱ φυγάδες Μωαβ — «поселятся у тебя беглецы Моава» (παροικέω — «жить пришельцем»), обращение к Сиону. ἔσονται σκέπη ὑμῖν — «будут покровом вам»: смена числа (σοι — ὑμῖν) сохранена. ἤρθη ἡ συμμαχία σου — «взята помощь твоя»: συμμαχία — «союз, союзничество», слав. читает «помощь»; в тексте по слав. 助け. ὁ ἄρχων ἀπώλετο ὁ καταπατῶν ἐπὶ τῆς γῆς — «погиб начальствующий, попирающий землю»."
  5: "διορθωθήσεται μετ᾿ ἐλέους θρόνος — «престол исправится с милостью» (διορθόω — «выпрямлять, утверждать»; слав. «исправится»). καθίεται ἐπ᾿ αὐτοῦ μετὰ ἀληθείας ἐν σκηνῇ Δαυιδ — «сядет на нём с истиной в скинии Давида»; мессианское место, держим буквально, без сглаживания. κρίνων καὶ ἐκζητῶν κρίμα καὶ σπεύδων δικαιοσύνην — «судя, взыскивая суд и ускоряя правду» (κρίμα — «суд, приговор», σπεύδω — «спешить»)."
  6: "Ἠκούσαμεν — «мы слышали»: говорит пророк от лица своих. ὕβριν Μωαβ, ὑβριστὴς σφόδρα — «обиду Моава, обидчик весьма»; ὑπερηφανία — «высокомерие», ἐξῆρας — «ты вознёс» (ἐξαίρω). οὐχ οὕτως ἡ μαντεία σου — «не так прорицание твоё» (μαντεία — «прорицание, волхвование»; слав. «волхвование»). В слав. «не тако… не тако» повторено: второе «не тако» — начало 16:7 в LXX, слав. отнесла его к 16:6."
  7: "οὐχ οὕτως — «не так», начало стиха в LXX (слав. переносит в конец 16:6). ὀλολύξει Μωαβ … πάντες ὀλολύξουσιν — «возвопит Моав… все возвопят»: ὀλολύζω — «громко вопить, рыдать». τοῖς κατοικοῦσιν Δεσεθ μελετήσεις καὶ οὐκ ἐντραπήσῃ — тёмное место: «о живущих в Десефе будешь размышлять и не постыдишься» (μελετάω — «обдумывать, замышлять»; ἐντρέπομαι — «стыдиться»). Δεσεθ — чтение LXX; слав. «сефе», у МТ Кир-Харесет."
  8: "τὰ πεδία Εσεβων πενθήσει — «поля Есевона восплачут» (πεδίον — «поле, равнина»; слав. «поля есевоня»). ἄμπελος Σεβαμα — «виноград Севамы» (ἄμπελος — «лоза, виноградник»). καταπίνοντες τὰ ἔθνη καταπατήσατε — «пожирающие народы, попирайте»: причастие и императив соединены без связи, сохранено. ἕως Ιαζηρ … οὐ μὴ συνάψητε, πλανήθητε τὴν ἔρημον — «до Язира… не соединитесь, блуждайте по пустыне». οἱ ἀπεσταλμένοι ἐγκατελείφθησαν, διέβησαν γὰρ τὴν ἔρημον — «посланные оставлены, ибо перешли пустыню»; слав. «проидоша бо море» («море» вместо «пустыни») — чтение, совпадающее с МТ (יָם), по паритету оставлено в основном тексте."
  9: "διὰ τοῦτο κλαύσομαι ὡς τὸν κλαυθμὸν Ιαζηρ — «потому буду плакать, как плачем Язира»: винитив меры при κλαίω. ἄμπελον Σεβαμα — «о лозе Севамы». τὰ δένδρα σου κατέβαλεν — «деревья твои он низверг» (καταβάλλω); подлежащее не названо, в тексте безличное «彼». ἐπὶ τῷ θερισμῷ καὶ ἐπὶ τῷ τρυγήτῳ σου καταπατήσω — «на жатву твою и на сбор винограда твой наступлю» (τρυγητός — «сбор винограда»; слав. «оымание вина» — опечатка модуля)."
  10: "ἀρθήσεται εὐφροσύνη καὶ ἀγαλλίαμα ἐκ τῶν ἀμπελώνων σου — «отнимется веселие и ликование из виноградников твоих» (ἀγαλλίαμα — «ликующий крик»); слав. «от виноградов» без «твоих», в тексте по LXX あなたの. οὐ μὴ πατήσουσιν οἶνον εἰς τὰ ὑπολήνια — «не будут топтать вино в подточилия» (ὑπολήνιον — «чан под точилом»), передано 酒ぶね. πέπαυται γάρ — «ибо прекратилось»; слав. «престало бо есть»."
  11: "ἡ κοιλία μου ἐπὶ Μωαβ ὡς κιθάρα ἠχήσει — «утроба моя о Моаве, как кифара, зазвучит» (ἠχέω — «звучать»; κιθάρα — 竪琴). τὰ ἐντός μου ὡσεὶ τεῖχος, ὃ ἐνεκαίνισας — «внутреннее моё как стена, которую ты обновил» (ἐγκαινίζω — «обновлять, освящать»); слав. «аки стену обновил еси». Второе лицо («ты обновил») не имеет ясного адресата — сохранено."
  12: "ἔσται εἰς τὸ ἐντραπῆναί σε — «будет к тому, что ты постыдишься» (ἐντρέπομαι — «стыдиться»). ἐκοπίασεν Μωαβ ἐπὶ τοῖς βωμοῖς — «утрудился Моав на жертвенниках» (βωμός — «жертвенник, высота»; слав. «требище»). εἰσελεύσεται εἰς τὰ χειροποίητα αὐτῆς — «войдёт в рукотворённое её»: αὐτῆς — «её» (страны?), далее αὐτόν — «его» (Моава); смена рода сохранена. ὥστε προσεύξασθαι, καὶ οὐ μὴ δύνηται ἐξελέσθαι αὐτόν — «чтобы помолиться, и не сможет избавить его»."
  13: "Τοῦτο τὸ ῥῆμα, ὃ ἐλάλησεν κύριος ἐπὶ Μωαβ, ὁπότε καὶ ἐλάλησεν — «это слово, которое изрёк Господь о Моаве, когда и изрёк»: греч. намеренно повторяет ἐλάλησεν (слав. «глагола… возглагола»). Оборот вводит датированное слово 16:14; повтор в тексте сохранён."
  14: "καὶ νῦν λέγω — «и ныне я говорю»: по LXX говорит Господь (в МТ «но теперь сказал Господь»), поэтому стих дан прямой речью. Ἐν τρισὶν ἔτεσιν ἐτῶν μισθωτοῦ — «в три года, [считая] по годам наёмника»: наёмничьи годы — точный, не сокращаемый срок (ср. 21:16). ἀτιμασθήσεται ἡ δόξα Μωαβ ἐν παντὶ τῷ πλούτῳ τῷ πολλῷ — «обесчестится слава Моава при всём богатстве многом» (ἀτιμάζω — «бесчестить»). καταλειφθήσεται ὀλιγοστὸς καὶ οὐκ ἔντιμος — «останется малочисленный и не почтенный» (ὀλιγοστός — «немногий», ἔντιμος — «в чести»)."
