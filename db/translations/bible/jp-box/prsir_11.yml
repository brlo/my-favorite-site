# jp-box, Сирах, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: 1–6 превратность судьбы и сдержанность в оценке; 7–13 о суде, совете
# и труде, о возвышении униженного; 14–28 о богатстве и его конце; 29–34 о том,
# что нельзя вводить в дом всякого.
# Прямая речь — только цитаты в 11:17 и 11:23–24 (слова богача и самоуспокоения),
# они в 「…」; остальное — авторский текст.
# Нумерация: 34 стиха. В гр. 11:15–16 в критическом тексте отсутствуют (в модуле «.»);
# csl на их месте читает δόσις κυρίου / ἔστιν πλουτῶν, но нумерует этот блок иначе:
# csl 17–18 — две половины гр. 19, csl 19 — гр. 20, csl 20–21 — две половины гр. 21;
# с 22 номера совпадают. Чтобы не дублировать δόσις/ἔστιν (они же стоят в гр. 17–18),
# сохранено церковное деление csl: 15–16 по csl, 17–18 — половины гр. 19, 19 — гр. 20,
# 20–21 — половины гр. 21. Подробно в notes 15–21.
# 〔…〕 нет: в дефектных 15–16 стоит csl-текст, скобки по правилу не ставятся.
# Сносок ⟨…⟩ нет: 知恵, 主, 契約, よみ, 王冠 и пр. уже в корпусе.
# Имён и топонимов в главе нет.

