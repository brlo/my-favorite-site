verses:
  1: "知恵[ちえ]は謙遜[けんそん]な者[もの]の頭[あたま]を高[たか]く上[あ]げ、高官[こうかん]たちの間[あいだ]に彼[かれ]を座[すわ]らせる。"
  2: "人[ひと]をその美[うつく]しさのゆえにほめるな。また、その外見[がいけん]のゆえに人を忌[い]み嫌[きら]うな。"
  3: "鳥[とり]の中[なか]では蜜蜂[みつばち]は小[ちい]さいが、その実[み]は甘[あま]いものの初穂[はつほ]である。"
  4: "衣[ころも]の装[よそお]いを誇[ほこ]るな。栄光[えいこう]の日[ひ]に高[たか]ぶるな。主[しゅ]のみわざは驚[おどろ]くべきものであり、そのみわざは人々[ひとびと]に隠[かく]されているからである。"
  5: "多[おお]くの支配者[しはいしゃ]が地面[じめん]に座[すわ]ったが、思[おも]いもよらぬ者[もの]が王冠[おうかん]をかぶった。"
  6: "多[おお]くの有力者[ゆうりょくしゃ]がひどく辱[はずかし]められ、栄光[えいこう]ある者[もの]たちが他人[たにん]の手[て]に渡[わた]された。"
  7: "調[しら]べる前[まえ]に責[せ]めるな。まず悟[さと]り、それから叱[しか]れ。"
  8: "聞[き]く前[まえ]に答[こた]えるな。話[はなし]の途中[とちゅう]に割[わ]り込[こ]むな。"
  9: "自分[じぶん]に必要[ひつよう]のない事[こと]について争[あらそ]うな。罪人[つみびと]たちの裁[さば]きに同席[どうせき]するな。"
  10: "子[こ]よ、あなたのなすべき事[こと]が多[おお]くあってはならない。多くすれば、罪[つみ]なき者[もの]とはされない。追[お]い求[もと]めても、得[え]ることはない。逃[に]げても、逃[のが]れられない。"
  11: "労[ろう]し、苦[くる]しみ、急[いそ]いでいるのに、かえっていっそう乏[とぼ]しくなる者[もの]がいる。"
  12: "助[たす]けを必要[ひつよう]とし、力[ちから]に乏[とぼ]しく、貧[まず]しさに満[み]ちている鈍[にぶ]い者[もの]がいる。主[しゅ]の目[め]は彼[かれ]を顧[かえり]みて善[ぜん]をなし、その卑[ひ]しめから彼を起[お]こされた。"
  13: "そして彼[かれ]の頭[あたま]を高[たか]く上[あ]げられたので、多[おお]くの者[もの]が彼について驚[おどろ]いた。"
  14: "善[ぜん]も悪[あく]も、生[いのち]も死[し]も、貧[まず]しさも富[とみ]も、主[しゅ]から出[で]る。"
  15: "主[しゅ]の賜物[たまもの]は敬虔[けいけん]な者[もの]にとどまり、そのみこころは永遠[えいえん]に栄[さか]える。"
  16: "自分[じぶん]の倹約[けんやく]と出[だ]し惜[お]しみによって富[とみ]む者[もの]がいる。これがその報[むく]いの分[ぶん]である。"
  17: "彼[かれ]が「わたしは安[やす]らぎを得[え]た。今[いま]、自分[じぶん]の善[よ]いものから食[た]べよう」と言[い]うとき、"
  18: "彼[かれ]は、どんな時[とき]が来[き]て、それらを他人[たにん]に残[のこ]して死[し]ぬことになるかを知[し]らない。"
  19: "自分[じぶん]の契約[けいやく]にとどまり、それに専念[せんねん]せよ。自分の仕事[しごと]にあって老[お]いよ。"
  20: "罪人[つみびと]のわざに驚[おどろ]くな。主[しゅ]を信[しん]じ、自分[じぶん]の労苦[ろうく]にとどまれ。"
  21: "主[しゅ]の目[め]には、貧[まず]しい者[もの]をたちまちに富[とみ]ませることはたやすいからである。"
  22: "主[しゅ]の祝福[しゅくふく]は敬虔[けいけん]な者[もの]の報[むく]いのうちにあり、その祝福は速[すみ]やかな時[とき]に芽吹[めぶ]く。"
  23: "「わたしに何[なん]の必要[ひつよう]があるのか。これから何[なに]がわたしの善[よ]いものとなるのか」と言[い]うな。"
  24: "「わたしには十分[じゅうぶん]だ。これから何[なに]の悪[あく]を受[う]けることがあろうか」と言[い]うな。"
  25: "善[よ]い日[ひ]には悪[あ]しき日のことを忘[わす]れ、悪しき日には善い日のことを思[おも]い出[だ]さない。"
  26: "主[しゅ]の前[まえ]には、終[お]わりの日[ひ]に人[ひと]にその道[みち]に応[おう]じて報[むく]いることはたやすいからである。"
  27: "一時[いちじ]の苦[くる]しみは快楽[かいらく]を忘[わす]れさせ、人[ひと]の終[お]わりにはそのわざが明[あき]らかにされる。"
  28: "死[し]ぬ前[まえ]に、だれも幸[さいわ]いな者[もの]と呼[よ]ぶな。人[ひと]はその子[こ]らによって知[し]られるからである。"
  29: "すべての人[ひと]を自分[じぶん]の家[いえ]に入[い]れるな。狡猾[こうかつ]な者[もの]の待[ま]ち伏[ぶ]せは多[おお]いからである。"
  30: "猟師[りょうし]の山鶉[やまうずら]がかごの中[なか]にいるように、高[たか]ぶる者[もの]の心[こころ]はそうであり、その者は偵察者[ていさつしゃ]のように倒[たお]れるのをうかがう。"
  31: "善[よ]いものを悪[あ]しきものに変[か]えて、その者[もの]は待[ま]ち伏[ぶ]せし、選[えら]ばれたものにも汚点[おてん]を置[お]くからである。"
  32: "火花[ひばな]から炭火[すみび]が多[おお]くなる。罪人[つみびと]も血[ち]のために待[ま]ち伏[ぶ]せする。"
  33: "悪事[あくじ]を謀[はか]る者[もの]に気[き]をつけよ。その者は悪[わる]いことをたくらみ、いつかあなたに永遠[えいえん]の汚点[おてん]を与[あた]えるからである。"
  34: "他人[たにん]を住[す]まわせると、その者[もの]は騒動[そうどう]のうちにあなたを乱[みだ]し、あなたを自分[じぶん]のものから遠[とお]ざける。"

notes:
  1: "σοφία ταπεινοῦ ἀνυψώσει κεφαλήν — «премудрость смиренного возвысит главу» (ἀνυψόω — поднимать вверх; слав. «вознесет главу его»). ἐν μέσῳ μεγιστάνων — «среди вельмож» (μεγιστάν — знатный, вельможа; слав. «посреде вельмож»); καθίσει — «посадит» (καθίζω). Смирение возносит — ср. Лк 14:11."
  2: "μὴ αἰνέσῃς ἄνδρα ἐν κάλλει αὐτοῦ — «не хвали мужа за красоту его» (αἰνέω — хвалить; κάλλος — красота; слав. «похвали»). μὴ βδελύξῃ ἄνθρωπον ἐν ὁράσει αὐτοῦ — «не возгнушайся человеком по виду его» (βδελύσσομαι — гнушаться; ὅρασις — вид, наружность). Запрет судить по внешности с двух сторон: не превозносить и не презирать."
  3: "μικρὰ ἐν πετεινοῖς μέλισσα — «мала среди птиц пчела» (πετεινόν — птица; слав. «в пернатых»). ἀρχὴ γλυκασμάτων ὁ καρπὸς αὐτῆς — «начаток сладостей плод её» (γλύκασμα — сладость; ἀρχή — начало, начаток). Малое существо приносит великое; пример из природы."
  4: "ἐν περιβολῇ ἱματίων — «в одеянии одежд» (περιβολή — облачение; слав. «во одеянии риз»); μὴ καυχήσῃ — «не хвались» (καυχάομαι); ἐν ἡμέρᾳ δόξης μὴ ἐπαίρου — «в день славы не превозносись» (ἐπαίρω). θαυμαστὰ τὰ ἔργα κυρίου — «дивны дела Господни»; κρυπτὰ ... ἀνθρώποις — «сокровенны людям». Слава человеческая противопоставлена непостижимости дел Божиих."
  5: "τύραννοι — «властители» (слав. «мучителие»), ἐπὶ ἐδάφους — «на земле, на полу» (ἔδαφος — основание, пол). ἀνυπονόητος — «нечаянный, непредвиденный» (слав. «нечаемый»); ἐφόρεσεν διάδημα — «носил диадему» (φορέω — носить; слав. «увязеся венцем» передаёт иначе, смысл тот же). О перемене жребия: униженный возвышается."
  6: "δυνάσται — «сильные, властелины»; ἠτιμάσθησαν σφόδρα — «обесчещены весьма» (ἀτιμάζω). ἔνδοξοι — «славные»; παρεδόθησαν εἰς χεῖρας ἑτέρων — «преданы в руки иных». Антитеза к 11:5 продолжена."
  7: "Πρὶν ἐξετάσῃς, μὴ μέμψῃ — «прежде нежели испытаешь, не порицай» (ἐξετάζω — исследовать; μέμφομαι — укорять; слав. «первее неже испытаеши, не порицай»). νόησον πρῶτον καὶ τότε ἐπιτίμα — «уразумей прежде и тогда запрещай» (ἐπιτιμάω — укорять, запрещать). Сдержанность суждения."
  8: "πρὶν ἢ ἀκοῦσαι μὴ ἀποκρίνου — «прежде нежели услышишь, не отвечай»; ἐν μέσῳ λόγων μὴ παρεμβάλλου — «среди слов не вмешивайся» (παρεμβάλλω — вбрасывать, вмешиваться; слав. «не влагайся в среду беседы»)."
  9: "περὶ πράγματος, οὗ οὐκ ἔστιν σοι χρεία, μὴ ἔριζε — «о деле, в котором нет тебе нужды, не спорь» (ἐρίζω — спорить). ἐν κρίσει ἁμαρτωλῶν μὴ συνέδρευε — «с судом грешников не заседай» (συνεδρεύω — сидеть вместе, заседать; слав. «на суде грешников не седай»)."
  10: "Τέκνον — «чадо»; μὴ περὶ πολλὰ ἔστωσαν αἱ πράξεις σου — «да не будут дела твои о многом» (слав. «деяния твоя да не будут о мнозе»). ἐὰν πληθύνῃς, οὐκ ἀθῳωθήσῃ — «если умножишь, не останешься без вины» (ἀθῳόω — признавать невиновным). οὐ μὴ καταλάβῃς — «не достигнешь»; οὐ μὴ ἐκφύγῃς διαδράς — «не убежишь, убежав» (διαδιδράσκω). Тройное οὐ μή — усиленное отрицание."
  11: "κοπιῶν καὶ πονῶν καὶ σπεύδων — «трудящийся, страдающий и спешащий» (κοπιάω, πονέω, σπεύδω). τόσῳ μᾶλλον ὑστερεῖται — «тем более лишается» (ὑστερέω — не иметь, терпеть недостаток). Три причастия переданы деепричастным оборотом; слав. «труждаяйся и потяся и тщася»."
  12: "νωθρός — «медлительный, вялый»; προσδεόμενος ἀντιλήμψεως — «нуждающийся в заступлении» (ἀντίλημψις — помощь; слав. «требуяй заступления»). ὑστερῶν ἰσχύι — «недостающий силой»; πτωχείᾳ περισσεύει — «изобилует нищетой» (πτωχεία). ἐπέβλεψαν ... εἰς ἀγαθά — «призрели на него во благо» (ἐπιβλέπω); ἀνώρθωσεν — «восставил» (ἀνορθόω). Слав. переносит вторую половину стиха (о глазах Господних) в 11:13."
  13: "ἀνύψωσεν κεφαλήν — «вознёс главу»; ἀπεθαύμασαν ἐπ᾽ αὐτῷ — «дивились о нём» (ἀποθαυμάζω). По гр. это продолжение 11:12; слав. 11:13 соединяет обе половины (11:12b и 11:13) в одном стихе — здесь деление по гр."
  14: "ἀγαθὰ καὶ κακά, ζωὴ καὶ θάνατος, πτωχεία καὶ πλοῦτος — шесть членов попарно: «благая и злая, жизнь и смерть, нищета и богатство» (слав. «живот» — жизнь). παρὰ κυρίου ἐστίν — «от Господа суть». Источник всего — Бог; но это не делает Его автором зла (ср. 15:11–12)."
  15: "В gr-lxx-byz на месте стиха «.»: в критическом тексте (Swete) стих отсутствует, в модуле текста нет. Переведено по csl-ru: «Даяние Господне пребывает благочестивым, и благоволение его благопоспешится во век» (δόσις — дар, даяние; εὐδοκία — благоволение; εὐοδόω — давать успех). Тот же греч. текст (δόσις κυρίου παραμένει εὐσεβέσιν...) в модуле стоит как 11:17; по церковному делению csl он относится сюда, без 〔…〕."
  16: "Стих в gr-lxx-byz — «.», в критическом тексте отсутствует; перевод по csl-ru: «Есть богатяйся удержанием и скупостию своею, и сия часть мзды его» (σφιγγία — сжатость, скупость; μερίς — часть, доля; μισθός — награда, мзда). Греч. ἔστιν πλουτῶν ἀπὸ προσοχῆς καὶ σφιγγίας αὐτοῦ в модуле — 11:18; по csl это ст. 16."
  17: "По csl = первая половина гр. 11:19 (гр. 17, δόσις, по церковному делению csl отнесён к ст. 15): ἐν τῷ εἰπεῖν αὐτόν — «когда он скажет»; Εὗρον ἀνάπαυσιν — «я нашёл покой» (εὑρίσκω, ἀνάπαυσις); φάγομαι ἐκ τῶν ἀγαθῶν μου — «буду есть от благ моих» (ἐσθίω). Слова богача — в 「…」; слав. «внегда рещи ему: обретох покой и ныне ям от благ моих»."
  18: "По csl = вторая половина гр. 11:19 (гр. 18, ἔστιν πλουτῶν, отнесён к ст. 16): οὐκ οἶδεν τίς καιρὸς παρελεύσεται — «не знает, какое время пройдёт»; καταλείψει αὐτὰ ἑτέροις — «оставит их иным»; ἀποθανεῖται — «умрёт». Слав. выносит эту половину отдельным стихом 11:18."
  19: "Гр. 11:20 (слав. 11:19): Στῆθι ἐν διαθήκῃ σου — «стой в завете твоём»; ὁμίλει ἐν αὐτῇ — «обращайся в нём» (ὁμιλέω — общаться, держаться); παλαιώθητι — «состарься» (παλαιόω; слав. «обетшай»). Завет — с Богом или принятое призвание; в тексте 契約 без пояснения."
  20: "Гр. 11:21a (слав. 11:20): μὴ θαύμαζε ἐν ἔργοις ἁμαρτωλοῦ — «не дивись делам грешника»; πίστευε δὲ κυρίῳ — «веруй же Господу»; ἔμμενε τῷ πόνῳ σου — «пребывай в труде твоём» (ἐμμένω — оставаться)."
  21: "Гр. 11:21b (слав. 11:21): κοῦφον ἐν ὀφθαλμοῖς κυρίου — «легко пред очами Господа» (κοῦφος — лёгкий); διὰ τάχους ἐξάπινα — «скоро, внезапно»; πλουτῖσαι πένητα — «обогатить бедного» (πλουτίζω)."
  22: "εὐλογία κυρίου ἐν μισθῷ εὐσεβοῦς — «благословение Господне в награде благочестивого»; ἐν ὥρᾳ ταχινῇ — «в час скорый» (ταχινός); ἀναθάλλει — «процветает, зеленеет» (ἀναθάλλω). Слав. «на мзде благочестиваго»."
  23: "μὴ εἴπῃς Τίς ἐστίν μου χρεία — «не говори: какая мне нужда»; τίνα ... μου τὰ ἀγαθά — «какие отныне будут мне блага». Слова в 「…」; слав. «кая ми потреба есть»."
  24: "Αὐτάρκη μοί ἐστιν — «довольно мне» (αὐτάρκης — самодостаточный, довольный); τί ... κακωθήσομαι — «что озлоблен буду» (κακόω — причинять зло). Слова в 「…」; слав. «доволна ми суть»."
  25: "ἐν ἡμέρᾳ ἀγαθῶν ἀμνησία κακῶν — «в день благ — забвение зол» (ἀμνησία — забвение); ἐν ἡμέρᾳ κακῶν οὐ μνησθήσεται ἀγαθῶν — «в день зол не вспомнятся благая» (μιμνήσκομαι). Антитеза сохранена."
  26: "κοῦφον ἔναντι κυρίου — «легко пред Господом»; ἐν ἡμέρᾳ τελευτῆς — «в день кончины» (τελευτή); ἀποδοῦναι ... κατὰ τὰς ὁδοὺς αὐτοῦ — «воздать по путям его». Слав. «в день смерти»."
  27: "κάκωσις ὥρας — «озлобление часа», т. е. минутное страдание (κάκωσις — притеснение, беда); ἐπιλησμονὴν ποιεῖ τρυφῆς — «производит забвение наслаждения» (τρυφή — роскошь, наслаждение); ἐν συντελείᾳ ἀνθρώπου — «при завершении человека» (συντέλεια); ἀποκάλυψις ἔργων αὐτοῦ — «открытие дел его»."
  28: "πρὸ τελευτῆς μὴ μακάριζε μηδένα — «прежде смерти не ублажай никого» (μακαρίζω — называть блаженным); ἐν τέκνοις αὐτοῦ γνωσθήσεται ἀνήρ — «в детях своих познается муж» (γνωσθήσεται — будет узнан)."
  29: "Μὴ πάντα ἄνθρωπον εἴσαγε εἰς τὸν οἶκόν σου — «не всякого человека вводи в дом твой» (εἴσαγε — вводи, императив от εἰσάγω); πολλὰ ... τὰ ἔνεδρα τοῦ δολίου — «много козней у коварного» (ἔνεδρον — засада; δόλιος — лукавый)."
  30: "πέρδιξ θηρευτής — «куропатка-охотник», т. е. птица, приманивающая других (θηρευτής — охотник; слав. «рябка»); ἐν καρτάλλῳ — «в корзине, клетке» (κάρταλλος — плетёная корзина); ὑπερήφανος — «надменный»; κατάσκοπος — «соглядатай»; ἐπιβλέπει πτῶσιν — «наблюдает падение»."
  31: "τὰ ἀγαθὰ εἰς κακὰ μεταστρέφων — «обращающий благое в злое» (μεταστρέφω); ἐνεδρεύει — «подстерегает»; ἐν τοῖς αἱρετοῖς — «в избранном» (αἱρετός — избранный, предпочтительный); ἐπιθήσει μῶμον — «положит пятно» (μῶμος — порок, пятно; слав. «порок»)."
  32: "ἀπὸ σπινθῆρος πυρός — «от искры огня» (σπινθήρ — искра); πληθύνεται ἀνθρακιά — «умножается угольное жаркое» (ἀνθρακιά — угли); εἰς αἷμα ἐνεδρεύει — «на кровь подстерегает». Образ малого начала зла."
  33: "πρόσεχε ἀπὸ κακούργου — «блюдись злодея» (προσέχω — внимать, беречься; κακοῦργος — злодей); πονηρὰ ... τεκταίνει — «злое замышляет» (τεκταίνω — устраивать, замышлять); μήποτε μῶμον εἰς τὸν αἰῶνα δῷ σοι — «не даст ли тебе пятна навек»."
  34: "ἐνοίκισον ἀλλότριον — «посели чужого» (ἀλλότριος — чужой); διαστρέψει σε ἐν ταραχαῖς — «развратит тебя в смятениях» (διαστρέφω — совращать; ταραχή — смута); ἀπαλλοτριώσει σε τῶν ἰδίων σου — «отчуждит тебя от твоих собственных» (ἀπαλλοτριόω)."
