# jp-box, Иоиль, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 1 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: нашествие саранчи. 1 надписание; 2–4 призыв слушать и передавать
# потомству, четыре стадии саранчи; 5–7 пробуждение пьяниц, народ-гусеница
# с львиными зубами опустошил виноградник; 8–12 плач земли, невесты, земледельцев:
# прекратились жертва и возлияние, засохли хлеб, вино, елей; 13–14 призыв к
# священникам, пост и собрание; 15–20 день Господень близок, огонь пожрал пастбища.
# Голоса: 1 — надписание; 2–20 — речь пророка, прямой речи Бога нет. 8 и 13 —
# императивы («рыдай», «препояшьтесь»), 15 — восклицание пророка.
# Термины: いなご (ἀκρίς), 芋虫 (κάμπη), 毛虫 (βροῦχος), ばった (ἐρυσίβη) —
# четыре стадии; в 1:4 и 2:25 порядок один и тот же. 粗布[あらぬの] — σάκκος;
# 注[そそ]ぎの供[そな]え物 — σπονδή; 供[そな]え物 — θυσία.
# Имена: ヨエル, ベトエル (LXX Βαθουηλ; csl Вафуил; в корпусе ベトエル —
# отец Ревекки, Быт 24–25).
#
tr_code: jp-box
book: iol
chapter: 1
draft: true

verses:
  1: "主[しゅ]の言葉[ことば]が、ベトエルの子[こ]ヨエルに臨[のぞ]んだ。"
  2: "これを聞[き]け、長老[ちょうろう]たちよ。耳[みみ]を傾[かたむ]けよ、この地[ち]に住[す]むすべての者[もの]よ。このようなことが、あなたがたの時代[じだい]に、またあなたがたの父[ちち]たちの時代にあっただろうか。"
  3: "このことについて、あなたがたの子[こ]どもに語[かた]り伝[つた]えよ。あなたがたの子どもはその子[こ]らに、その子らは次[つぎ]の世代[せだい]に伝えよ。"
  4: "芋虫[いもむし]が食[く]い残[のこ]したものを、いなごが食[く]い、いなごが食い残したものを、毛虫[けむし]が食い、毛虫が食い残したものを、ばったが食[く]った。"
  5: "酔[よ]った者[もの]たちよ、目[め]を覚[さ]ませ、自分[じぶん]たちのぶどう酒[しゅ]のことで泣[な]け。酒[さけ]を飲[の]んで酔[よ]う者[もの]たちよ、みな嘆[なげ]け。喜[よろこ]びと楽しみが、あなたがたの口[くち]から取[と]り去[さ]られたからである。"
  6: "まことに、強[つよ]く数[かぞ]えきれない民[たみ]が、わたしの地[ち]に上[のぼ]って来[き]た。その歯[は]は獅子[しし]の歯、その奥歯[おくば]は若[わか]い獅子の歯である。"
  7: "その民はわたしのぶどうの木[き]を荒[あ]らし、わたしのいちじくの木を折[お]り砕[くだ]いた。それを剥[は]ぎ取[と]って捨[す]て、その枝[えだ]を白[しろ]くした。"
  8: "わたしに向[む]かって嘆[なげ]け。若[わか]い夫[おっと]を失[うしな]った花嫁[はなよめ]が、粗布[あらぬの]をまとって嘆くように。"
  9: "主[しゅ]の家[いえ]から、供[そな]え物[もの]と注[そそ]ぎの供え物が絶[た]えた。祭壇[さいだん]に仕[つか]える祭司[さいし]たちよ、泣[な]け。"
  10: "畑[はたけ]は荒[あ]れ果[は]て、地[ち]は嘆[なげ]いている。穀物[こくもつ]が荒れ果て、ぶどう酒[しゅ]が干[ひ]あがり、油[あぶら]が乏[とぼ]しくなったからである。"
  11: "農夫[のうふ]たちよ、恥[は]じよ。ぶどうを作[つく]る者[もの]たちよ、小麦[こむぎ]と大麦[おおむぎ]のゆえに泣[な]け。畑[はたけ]の取[と]り入[い]れが失[うしな]われたからである。"
  12: "ぶどうの木[き]は枯[か]れ、いちじくの木は衰[おとろ]えた。ざくろ、なつめやし、りんご、畑[はたけ]のすべての木[き]が枯れた。人[ひと]の子[こ]らから喜[よろこ]びが消[き]え去[さ]ったからである。"
  13: "祭司[さいし]たちよ、粗布[あらぬの]をまとって胸[むね]を打[う]て。祭壇[さいだん]に仕[つか]える者[もの]たちよ、泣け。神[かみ]に仕える者たちよ、粗布をまとって夜[よる]を過[す]ごせ。あなたがたの神の家[いえ]から、供え物と注ぎの供え物が取[と]り去[さ]られたからである。"
  14: "断食[だんじき]を聖別[せいべつ]し、礼拝[れいはい]を告[つ]げ知[し]らせ、この地[ち]に住[す]むすべての長老[ちょうろう]たちを、あなたがたの神[かみ]の家[いえ]に集[あつ]めよ。そして主[しゅ]に熱心[ねっしん]に叫[さけ]べ。"
  15: "ああ、ああ、ああ、その日[ひ]よ。主[しゅ]の日[ひ]が近[ちか]いからである。苦[くる]しみから苦しみとなって来[く]る。"
  16: "食[た]べ物[もの]があなたがたの目[め]の前[まえ]で断[た]たれ、神[かみ]の家[いえ]から喜[よろこ]びと楽しみが消[き]えたではないか。"
  17: "若[わか]い雌牛[めうし]たちは、飼[か]い葉[ば]おけのそばで跳[は]ね回[まわ]った。倉[くら]は荒[あ]らされ、貯[ちょ]蔵[ぞう]室[しつ]は壊[こわ]され、穀物[こくもつ]が干[ひ]あがったからである。"
  18: "わたしたちは自分[じぶん]たちのために何[なに]を蓄[たくわ]えられるだろうか。牛[うし]の群[む]れは泣[な]き、牛の群れはうめいた。飼[か]い葉[ば]がないからである。羊[ひつじ]の群れもまた滅[ほろ]びた。"
  19: "主[しゅ]よ、わたしはあなたに叫[さけ]ぶ。荒[あ]れ野[の]の美[うつく]しい牧[まき]場[ば]が火[ひ]に焼[や]き尽[つ]くされ、野[の]のすべての木[き]が炎[ほのお]で燃[も]えたからである。"
  20: "野[の]の獣[けもの]たちもあなたを見上[みあ]げる。水[みず]の流[なが]れが涸[か]れ、荒[あ]れ野[の]の美しい牧[まき]場[ば]が火に焼き尽くされたからである。"

notes:
  1: "Λόγος κυρίου, ὃς ἐγενήθη πρὸς Ιωηλ τὸν τοῦ Βαθουηλ — «слово Господне, которое было к Иоилю, сыну Вафуила». Надписание без глагола «говорит»; евр. и ru — «сыну Вафуила». Βαθουηλ передан ベトエル, как в Быт 24–25 (отец Ревекки); csl «вафуилеву» — та же форма в церковном чтении."
  2: "Ἀκούσατε δὴ ταῦτα, οἱ πρεσβύτεροι — «услышьте же это, старцы» (δή — усиление, これを…聞け); ἐνωτίσασθε — «внушите» (ἐνωτίζομαι, букв. «вложить в уши», 耳を傾けよ); εἰ γέγονεν τοιαῦτα — риторический вопрос «бывало ли такое»; ἐν ταῖς ἡμέραις τῶν πατέρων ὑμῶν — «во дни отцов ваших»."
  3: "ὑπὲρ αὐτῶν τοῖς τέκνοις ὑμῶν διηγήσασθε — «о них расскажите детям вашим» (διηγέομαι — повествовать, 語り伝える); καὶ τὰ τέκνα αὐτῶν εἰς γενεὰν ἑτέραν — «а их дети — в род иной», т.е. следующему поколению. Слав. «О сих чадом своим поведите»; порядок поколений сохранён."
  4: "Четыре стадии: κάμπη (芋虫), ἀκρίς (いなご), βροῦχος (毛虫, как в 2 Пар 6:28), ἐρυσίβη (ばった; обычно «ржавчина, головня», здесь — вид саранчи, csl «сиплеве»). Греч. порядок: остаток κάμπη ест ἀκρίς, остаток ἀκρίς — βροῦχος, остаток βροῦχος — ἐρυσίβη. Слав. порядок тот же, но имена иные (гусеницы, прузи, мшицы, сиплеве); в 2:25 порядок повторён."
  5: "ἐκνήψατε, οἱ μεθύοντες, ἐξ οἴνου αὐτῶν — «протрезвитесь, пьяные, от вина своего» (ἐκνήφω — пробудиться от опьянения, 目を覚ませ; αὐτῶν — «их», csl «своего»); εἰς μέθην — «до опьянения» (слав. «до пиянства»); ἐξῆρται ἐκ στόματος ὑμῶν εὐφροσύνη καὶ χαρά — «отняты от уст ваших веселье и радость»."
  6: "ἔθνος ἀνέβη ἐπὶ τὴν γῆν μου ἰσχυρὸν καὶ ἀναρίθμητον — «народ поднялся на землю Мою сильный и бесчисленный»; οἱ ὀδόντες αὐτοῦ ὀδόντες λέοντος — «зубы его — зубы льва»; αἱ μύλαι αὐτοῦ σκύμνου — «жернова (коренные зубы) его — [как] у львёнка» (μύλη — коренной зуб, 奥歯; σκύμνος — молодой лев, csl «львичище»)."
  7: "ἔθετο τὴν ἄμπελόν μου εἰς ἀφανισμόν — «положил виноградник Мой в опустошение»; ἐρευνῶν ἐξηρεύνησεν αὐτὴν καὶ ἔρριψεν — «разыскивая, разыскал её и бросил» (усиление, csl «взыскуя оыска»); ἐλεύκανεν κλήματα αὐτῆς — «побелил ветви её»."
  8: "θρήνησον πρός με — «рыдай ко Мне» (πρός με — к Богу, csl «восплачися ко мне»); ὑπὲρ νύμφην περιεζωσμένην σάκκον — «о невесте, опоясанной вретищем» (σάκκος — 粗布); ἐπὶ τὸν ἄνδρα αὐτῆς τὸν παρθενικόν — «о муже её девственном», т.е. о муже юности (ru «о муже юности своей»)."
  9: "ἐξῆρται θυσία καὶ σπονδὴ ἐξ οἴκου κυρίου — «отнята жертва и возлияние из дома Господня» (θυσία — 供え物; σπονδή — 注ぎの供え物); πενθεῖτε, οἱ ἱερεῖς οἱ λειτουργοῦντες θυσιαστηρίῳ — «плачьте, священники, служащие жертвеннику» (λειτουργέω — 仕える)."
  10: "τεταλαιπώρηκεν τὰ πεδία — «опустошены (букв. измучены) поля»; πενθείτω ἡ γῆ — «да плачет земля»; τεταλαιπώρηκεν σῖτος — «истреблена пшеница» (σῖτος — хлеб/пшеница, 穀物); ἐξηράνθη οἶνος, ὠλιγώθη ἔλαιον — «высохло вино, умалился елей»."
  11: "ἐξηράνθησαν οἱ γεωργοί — «иссохли земледельцы» (LXX; csl «посрамишася земледелателе» — «постыдились»): по паритету принято csl 恥じよ, вариант LXX отмечен; θρηνεῖτε, κτήματα — «рыдайте, владения/имущества» (κτῆμα; csl «села» — сёла, ru «виноградари» из МТ); ἀπόλωλεν τρυγητὸς ἐξ ἀγροῦ — «погиб сбор винограда с поля» (τρυγητός — жатва/сбор)."
  12: "ἡ ἄμπελος ἐξηράνθη — «виноградная лоза засохла»; ῥόα καὶ φοῖνιξ καὶ μῆλον — «гранат, пальма и яблоня» (ῥόα — гранат, ざくろ; φοῖνιξ — пальма, なつめやし; μῆλον — яблоко); слав. «шипки» вместо «граната» — вероятно, порча, держимся LXX/МТ (ざくろ); ᾔσχυναν χαρὰν οἱ υἱοὶ τῶν ἀνθρώπων — «посрамили радость сыны человеческие», т.е. у людей исчезла радость."
  13: "περιζώσασθε καὶ κόπτεσθε, οἱ ἱερεῖς — «опояшьтесь и бейте себя [в грудь]» (κόπτομαι — плакать, бить себя, csl «бийтеся»); εἰσέλθατε ὑπνώσατε ἐν σάκκοις — «войдите, ночуйте во вретищах» (ὑπνόω — спать, 夜を過ごせ); ἀπέσχηκεν ἐξ οἴκου θεοῦ ὑμῶν θυσία καὶ σπονδή — «отступили от дома Бога вашего жертва и возлияние»."
  14: "ἁγιάσατε νηστείαν — «освятите пост» (断食を聖別し); κηρύξατε θεραπείαν — «проповедуйте служение» (θεραπεία — служение/богослужебное собрание, 礼拝; csl «цельбу» — «исцеление», понято иначе); συναγάγετε πρεσβυτέρους πάντας κατοικοῦντας γῆν — «соберите старейшин, всех живущих на земле»; ἐκτενῶς — «усердно» (熱心に)."
  15: "Οἴμμοι οἴμμοι οἴμμοι εἰς ἡμέραν — троекратное «увы мне» (передано ああ、ああ、ああ、その日よ); ἐγγὺς ἡμέρα κυρίου — «близок день Господень»; ὡς ταλαιπωρία ἐκ ταλαιπωρίας ἥξει — «как беда от беды придёт» (csl «беда от беды»). В ru (МТ) «как опустошение от Всемогущего» — иное чтение, не внесено."
  16: "κατέναντι τῶν ὀφθαλμῶν ὑμῶν βρώματα ἐξωλεθρεύθη — «пред глазами вашими истреблена пища» (βρῶμα — еда; ἐξολεθρεύω — истреблять); ἐξ οἴκου θεοῦ ὑμῶν εὐφροσύνη καὶ χαρά — «из дома Бога вашего веселье и радость». Греч. «вашими»; ru «нашими» — слав.-синод. передача, в тексте по греч."
  17: "ἐσκίρτησαν δαμάλεις ἐπὶ ταῖς φάτναις αὐτῶν — «вскочили телицы при яслях своих» (σκιρτάω — прыгать; δάμαλις — молодая корова); ἠφανίσθησαν θησαυροί — «исчезли сокровищницы» (θησαυρός — хранилище, 倉); κατεσκάφησαν ληνοί — «подкопаны (разрушены) точила» (ληνός — давильня, ぶどう搾り場); ὅτι ἐξηράνθη σῖτος — «ибо высох хлеб». В ru (МТ) «истлели зёрна под глыбами» — иное чтение, не внесено."
  18: "τί ἀποθήσομεν ἑαυτοῖς; — «что отложим себе?» (ἀποτίθημι — откладывать, 蓄える; csl «что положим себе»); ἔκλαυσαν βουκόλια βοῶν — «заплакали стада волов» (βουκόλιον — стадо); οὐχ ὑπῆρχεν νομὴ αὐτοῖς — «не было пажити им»; τὰ ποίμνια τῶν προβάτων ἠφανίσθησαν — «стада овец исчезли»."
  19: "πρὸς σέ, κύριε, βοήσομαι — «к Тебе, Господи, воззову» (βοάω — взывать); πῦρ ἀνήλωσεν τὰ ὡραῖα τῆς ἐρήμου — «огонь поело красоты пустыни» (ὡραῖος — прекрасный; τὰ ὡραῖα — красивые места/пастбища, 美しい牧場); φλὸξ ἀνῆψεν πάντα τὰ ξύλα τοῦ ἀγροῦ — «пламя зажгло все деревья поля»."
  20: "τὰ κτήνη τοῦ πεδίου ἀνέβλεψαν πρὸς σέ — «звери поля воззрели к Тебе» (ἀναβλέπω — поднять глаза, 見上げる); ἐξηράνθησαν ἀφέσεις ὑδάτων — «иссохли источники (букв. отпущения) вод» (ἄφεσις — поток/источник; csl «источницы воднии»); πῦρ κατέφαγεν τὰ ὡραῖα τῆς ἐρήμου — «огонь поел красоты пустыни»."
