# jp-box, Сирах, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30: воспитание сына (1–13), здоровье лучше богатства (14–17), пища у гроба
# и идол (18–20), печаль и радость сердца (21–25). Прямой речи нет: всё — авторское
# поучение; красного и синего в Ветхом Завете нет.
# Нумерация по gr: 25 стихов. Слав. 30:1–27: деление дробит греч. (19+20 = гр 19;
# 24+25 = гр 23; 26 = гр 24; 27 = гр 25); слав. добавления в 11 («и не презри
# неведения его») и 12 («сляцы выю его») в LXX отсутствуют, внесены в основной
# текст без 〔…〕 по паритету, отмечены в notes; стихов не добавлено.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

