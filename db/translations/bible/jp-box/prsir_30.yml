verses:
  1: "自分[じぶん]の息子[むすこ]を愛[あい]する者[もの]は、その子[こ]に鞭[むち]を絶[た]えず加[くわ]える。そうすれば、終[お]わりに喜[よろこ]ぶことができる。"
  2: "自分[じぶん]の息子[むすこ]を訓[くん]育[いく]する者[もの]は、その子によって益[えき]を受[う]け、知人[ちじん]たちの間[あいだ]でその子を誇[ほこ]る。"
  3: "自分[じぶん]の息子[むすこ]を教[おし]える者[もの]は敵[てき]を嫉妬[しっと]させ、友[とも]たちの前[まえ]でその子を喜[よろこ]ぶ。"
  4: "その父[ちち]が死[し]んでも、死ななかったのと同[おな]じである。自分[じぶん]に似[に]た者[もの]を後[あと]に残[のこ]したからである。"
  5: "父[ちち]は生[い]きている間[あいだ]に子[こ]を見[み]て喜[よろこ]び、終[お]わりの時[とき]にも悲[かな]しまなかった。"
  6: "敵[てき]の前[まえ]には復讐[ふくしゅう]する者[もの]を、友[とも]には恩[おん]を返[かえ]す者を残[のこ]した。"
  7: "息子[むすこ]を甘[あま]やかす者[もの]はその傷[きず]を包[つつ]み、叫[さけ]び声[ごえ]のたびに心[こころ]を騒[さわ]がせる。"
  8: "馴[な]らされていない馬[うま]は手[て]に負[お]えなくなり、放[はな]ち置[お]かれた息子[むすこ]は厚[あつ]かましくなる。"
  9: "子[こ]どもを甘[あま]やかせば、あなたを驚[おどろ]かせる。その子と遊[あそ]べば、あなたを悲[かな]しませる。"
  10: "その子とともに笑[わら]ってはならない。ともに苦[くる]しむことになり、終[お]わりに歯[は]を噛[か]みしめることになるからである。"
  11: "若[わか]いとき、その子に自由[じゆう]を与[あた]えてはならない。その無知[むち]を見過[みす]ごしてはならない。"
  12: "その子がまだ幼[おさな]いうちに、首[くび]を曲[ま]げ、肋[あばら]を砕[くだ]け。そうでなければ、頑[かた]くなってあなたに従[したが]わなくなる。"
  13: "あなたの息子[むすこ]を訓[くん]育[いく]し、その子のために働[はたら]け。そうすれば、その子のみだらな行[おこな]いにつまずくことはない。"
  14: "健康[けんこう]で体[からだ]の強[つよ]い貧[まず]しい者[もの]は、体を打[う]たれた富[とみ]ある者よりも良[よ]い。"
  15: "健康[けんこう]と良[よ]い体[からだ]の調子[ちょうし]は、すべての金[きん]よりも勝[まさ]り、丈夫[じょうぶ]な体は測[はか]り知[し]れない富[とみ]よりも勝る。"
  16: "体[からだ]の健康[けんこう]に勝[まさ]る富[とみ]はなく、心[こころ]の喜[よろこ]びに勝る楽[たの]しみはない。"
  17: "死[し]は苦[にが]い生[いき]き方[かた]にまさり、永遠[えいえん]の安[やす]らぎは長[なが]引[び]く病[やまい]にまさる。"
  18: "閉[と]ざされた口[くち]の前[まえ]に注[そそ]がれた良[よ]いものは、墓[はか]のそばに置[お]かれた食[た]べ物[もの]のようなものである。"
  19: "偶像[ぐうぞう]に供[そな]え物[もの]をしても何[なん]の益[えき]があろうか。それは食[た]べることも嗅[か]ぐこともできない。主[しゅ]から追[お]い払[はら]われる者[もの]も同じである。"
  20: "目[め]で見[み]ながら呻[うめ]くのは、処女[しょじょ]を抱[だ]きしめながら呻く去勢[きょせい]された者[もの]のようである。"
  21: "あなたの魂[たましい]を悲[かな]しみに委[ゆだ]ねてはならない。自分[じぶん]の思[おも]い込[こ]みで自分を苦[くる]しめてはならない。"
  22: "心[こころ]の楽[たの]しみは人[ひと]の命[いのち]であり、人の喜[よろこ]びは長[なが]生[い]きである。"
  23: "自分[じぶん]の魂[たましい]を慰[なぐさ]め、心[こころ]を励[はげ]まし、悲[かな]しみを遠[とお]くから追[お]い払[はら]え。悲しみは多[おお]くの人[ひと]を滅[ほろ]ぼしたが、そこには何[なん]の益[えき]もないからである。"
  24: "妬[ねた]みと怒[いか]りは日[ひ]を減[へ]らし、思[おも]い煩[わずら]いは時[とき]より早[はや]く老[お]いを連[つ]れてくる。"
  25: "明[あか]るく良[よ]い心[こころ]は、自分の食[しょく]事[じ]にも気[き]を配[くば]る。"

notes:
  1: "Ὁ ἀγαπῶν τὸν υἱὸν αὐτοῦ ἐνδελεχήσει μάστιγας αὐτῷ — 自分の息子を愛する者はその子に鞭を絶えず加える (ἐνδελεχίζω — делать постоянно; μάστιξ — бич, удар; слав. «участит ему раны»). ἵνα εὐφρανθῇ ἐπ᾿ ἐσχάτων αὐτοῦ — 終わりに喜ぶため (ἐπ᾿ ἐσχάτων — в последних, в конце)."
  2: "ὁ παιδεύων τὸν υἱὸν αὐτοῦ ὀνήσεται ἐπ᾿ αὐτῷ — 息子を訓育する者はその子によって益を受ける (παιδεύω — воспитывать, наставлять; ὀνίνημι — получать пользу). ἀνὰ μέσον γνωρίμων ἐπ᾿ αὐτῷ καυχήσεται — 知人たちの間でその子を誇る (γνώριμος — знакомый; καυχάομαι — хвалиться)."
  3: "ὁ διδάσκων τὸν υἱὸν αὐτοῦ παραζηλώσει τὸν ἐχθρόν — 息子を教える者は敵を嫉妬させる (διδάσκω — учить; παραζηλόω — возбуждать ревность). ἔναντι φίλων ἐπ᾿ αὐτῷ ἀγαλλιάσεται — 友たちの前でその子を喜ぶ (ἀγαλλιάομαι — радоваться)."
  4: "ἐτελεύτησεν αὐτοῦ ὁ πατήρ, καὶ ὡς οὐκ ἀπέθανεν — 父が死んでも死ななかったのと同じ (τελευτάω — умирать; ὡς — как будто). ὅμοιον γὰρ αὐτῷ κατέλιπεν μετ᾿ αὐτόν — 自分に似た者を後に残したから (ὅμοιος — подобный; καταλείπω — оставлять)."
  5: "ἐν τῇ ζωῇ αὐτοῦ εἶδεν καὶ εὐφράνθη — 生きている間に父は子を見て喜び (ζωή — жизнь; εὐφραίνω — радовать). ἐν τῇ τελευτῇ αὐτοῦ οὐκ ἐλυπήθη — 終わりの時にも悲しまなかった (τελευτή — кончина; λυπέω — печалить)."
  6: "ἐναντίον ἐχθρῶν κατέλιπεν ἔκδικον — 敵の前には復讐する者を残した (ἐναντίον — напротив, перед; ἔκδικος — мститель). τοῖς φίλοις ἀνταποδιδόντα χάριν — 友には恩を返す者を (ἀνταποδίδωμι — воздавать; χάρις — благодарность, милость)."
  7: "περιψύχων υἱὸν καταδεσμεύσει τραύματα αὐτοῦ — 息子を甘やかす者はその傷を包む (περιψύχω — обхаживать, баловать; καταδεσμέω — перевязывать; слав. «обяжет струпы его»). ἐπὶ πάσῃ βοῇ ταραχθήσεται σπλάγχνα αὐτοῦ — 叫び声のたびに心を騒がせる (βοή — крик; σπλάγχνα — внутренности, сердце; слав. «утроба»)."
  8: "ἵππος ἀδάμαστος ἐκβαίνει σκληρός — 馴らされていない馬は手に負えなくなる (ἀδάμαστος — неукрощённый; σκληρός — жёсткий, строптивый). υἱὸς ἀνειμένος ἐκβαίνει προαλής — 放ち置かれた息子は厚かましくなる (ἀνίημι — отпускать; προαλής — дерзкий, своевольный; слав. «продерз»)."
  9: "τιθήνησον τέκνον, καὶ ἐκθαμβήσει σε — 子どもを甘やかせば、あなたを驚かせる (τιθηνέω — лелеять, кормить; ἐκθαμβέω — изумлять, пугать). σύμπαιξον αὐτῷ, καὶ λυπήσει σε — その子と遊べば、あなたを悲しませる (συμπαίζω — играть вместе)."
  10: "μὴ συγγελάσῃς αὐτῷ, ἵνα μὴ συνοδυνηθῇς — その子とともに笑ってはならない、ともに苦しむことにならないように (συγγελάω — смеяться вместе; συνοδυνάομαι — сострадать, мучиться вместе). ἐπ᾿ ἐσχάτων γομφιάσεις τοὺς ὀδόντας σου — 終わりに歯を噛みしめる (γομφιάζω — скрежетать зубами; ὀδούς — зуб)."
  11: "μὴ δῷς αὐτῷ ἐξουσίαν ἐν νεότητι — 若いときその子に自由を与えるな (ἐξουσία — власть, свобода; νεότης — юность). Слав. добавляет «и не презри неведения его» (その無知を見過ごすな): в LXX этого нет, внесено в основной текст без 〔…〕 по паритету."
  12: "θλάσον τὰς πλευρὰς αὐτοῦ, ὡς ἔστιν νήπιος — 幼いうちに肋を砕け (θλάω — сокрушать; πλευρά — ребро; νήπιος — младенец). μήποτε σκληρυνθεὶς ἀπειθήσῃ σοι — 頑くなって従わなくなるといけないから (σκληρύνω — ожесточать; ἀπειθέω — не слушаться). Слав. добавляет «сляцы выю его в юности» (首を曲げよ): в LXX нет, внесено без 〔…〕 по паритету."
  13: "παίδευσον τὸν υἱόν σου καὶ ἔργασαι ἐν αὐτῷ — 息子を訓育し、その子のために働け (ἐργάζομαι — трудиться, возделывать). ἵνα μὴ ἐν τῇ ἀσχημοσύνῃ αὐτοῦ προσκόψῃς — そのみだらな行いにつまずかないように (ἀσχημοσύνη — непристойность; προσκόπτω — претыкаться)."
  14: "Κρείσσων πτωχὸς ὑγιὴς καὶ ἰσχύων τῇ ἕξει — 健康で体の強い貧しい者は良い (ὑγιής — здоровый; ἰσχύω — быть сильным; ἕξις — состояние тела). ἢ πλούσιος μεμαστιγωμένος εἰς σῶμα αὐτοῦ — 体を打たれた富ある者よりも (μαστιγόω — бичевать; σῶμα — тело)."
  15: "ὑγίεια καὶ εὐεξία βελτίων παντὸς χρυσίου — 健康と良い体の調子はすべての金よりも勝る (εὐεξία — хорошее состояние; βελτίων — лучше; χρυσίον — золото). σῶμα εὔρωστον ἢ ὄλβος ἀμέτρητος — 丈夫な体は測り知れない富よりも (εὔρωστος — крепкий; ὄλβος — богатство; ἀμέτρητος — неизмеримый)."
  16: "οὐκ ἔστιν πλοῦτος βελτίων ὑγιείας σώματος — 体の健康に勝る富はない (ὑγίεια — здоровье). οὐκ ἔστιν εὐφροσύνη ὑπὲρ χαρὰν καρδίας — 心の喜びに勝る楽しみはない (εὐφροσύνη — веселье; χαρά — радость)."
  17: "κρείσσων θάνατος ὑπὲρ ζωὴν πικράν — 死は苦い生き方にまさる (πικρός — горький). ἀνάπαυσις αἰῶνος ἢ ἀρρώστημα ἔμμονον — 永遠の安らぎは長引く病にまさる (ἀνάπαυσις — покой; αἰών — век; ἀρρώστημα — болезнь; ἔμμονος — постоянный)."
  18: "ἀγαθὰ ἐκκεχυμένα ἐπὶ στόματι κεκλεισμένῳ — 閉ざされた口の前に注がれた良いもの (ἐκχέω — изливать; κλείω — закрывать). θέματα βρωμάτων παρακείμενα ἐπὶ τάφῳ — 墓のそばに置かれた食べ物 (θέμα — поставленное; βρῶμα — пища; παράκειμαι — лежать рядом; τάφος — могила)."
  19: "τί συμφέρει κάρπωσις εἰδώλῳ; — 偶像に供え物をしても何の益があるか (κάρπωσις — приношение; εἴδωλον — идол; συμφέρω — приносить пользу). οὔτε ἔδεται οὔτε μὴ ὀσφρανθῇ — 食べることも嗅ぐこともできない (ἐσθίω — есть; ὀσφραίνομαι — обонять). οὕτως ὁ ἐκδιωκόμενος ὑπὸ κυρίου — 主から追い払われる者も同じ (ἐκδιώκω — изгонять)."
  20: "βλέπων ἐν ὀφθαλμοῖς καὶ στενάζων — 目で見ながら呻く (στενάζω — стенать). ὥσπερ εὐνοῦχος περιλαμβάνων παρθένον καὶ στενάζων — 処女を抱きしめながら呻く去勢された者のよう (εὐνοῦχος — евнух; περιλαμβάνω — обнимать; παρθένος — дева)."
  21: "Μὴ δῷς εἰς λύπην τὴν ψυχήν σου — 魂を悲しみに委ねるな (λύπη — печаль; ψυχή — душа). μὴ θλίψῃς σεαυτὸν ἐν βουλῇ σου — 自分の思い込みで自分を苦しめるな (θλίβω — теснить, мучить; βουλή — замысел, помысел)."
  22: "εὐφροσύνη καρδίας ζωὴ ἀνθρώπου — 心の楽しみは人の命 (εὐφροσύνη — веселье). ἀγαλλίαμα ἀνδρὸς μακροημέρευσις — 人の喜びは長生き (ἀγαλλίαμα — ликование; μακροημέρευσις — долгоденствие)."
  23: "ἀπάτα τὴν ψυχήν σου καὶ παρακάλει τὴν καρδίαν σου — 自分の魂を慰め、心を励ませ (ἀπατάω — успокаивать, обманывать; παρακαλέω — утешать). λύπην μακρὰν ἀπόστησον ἀπὸ σοῦ — 悲しみを遠くから追い払え. πολλοὺς γὰρ ἀπώλεσεν ἡ λύπη — 悲しみは多くの人を滅ぼした. οὐκ ἔστιν ὠφέλεια ἐν αὐτῇ — そこには何の益もない (ὠφέλεια — польза)."
  24: "ζῆλος καὶ θυμὸς ἐλαττοῦσιν ἡμέρας — 妬みと怒りは日を減らす (ζῆλος — ревность, зависть; ἐλαττόω — уменьшать). πρὸ καιροῦ γῆρας ἄγει μέριμνα — 思い煩いは時より早く老いを連れてくる (γῆρας — старость; μέριμνα — забота)."
  25: "λαμπρὰ καρδία καὶ ἀγαθή — 明るく良い心 (λαμπρός — светлый, радостный). ἐπὶ ἐδέσμασιν τῶν βρωμάτων αὐτῆς ἐπιμελήσεται — 自分の食事にも気を配る (ἔδεσμα — яства; βρῶμα — пища; ἐπιμελέομαι — заботиться)."
