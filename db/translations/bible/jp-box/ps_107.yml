verses:
  0: "ダビデの詩[うた]の歌[うた]。"
  1: "神[かみ]よ、わたしの心[こころ]は備[そな]わった。わたしの心[こころ]は備[そな]わった。わたしは歌[うた]い、わたしの栄光[えいこう]をもってほめ歌[うた]おう。"
  2: "目[め]を覚[さ]ませ、琴[こと]と竪琴[たてごと]。わたしは夜明[よあ]けに目[め]を覚[さ]ます。"
  3: "主[しゅ]よ、わたしは諸国[しょこく]の民[たみ]の間[あいだ]であなたに感謝[かんしゃ]をささげ、もろもろの民[たみ]の間[あいだ]であなたをほめたたえる。"
  4: "あなたのあわれみは天[てん]よりも高[たか]く、あなたの真実[しんじつ]は雲[くも]にまで届[とど]くからである。"
  5: "神[かみ]よ、天[てん]の上[うえ]に上[あ]げられてください。あなたの栄光[えいこう]が全[ぜん]地[ち]の上[うえ]にあるように。"
  6: "あなたに愛[あい]された者[もの]たちが救[すく]われるために、あなたの右[みぎ]の手[て]で救[すく]って、わたしの声[こえ]を聞[き]いてください。"
  7: "神[かみ]はその聖所[せいしょ]で言[い]われた。「わたしは喜[よろこ]び、シケムを分[わ]け、幕[まく]の谷[たに]を測[はか]る。"
  8: "ギルアデはわたしのもの、マナセもわたしのもの。エフライムはわたしの頭[あたま]の守[まも]り、ユダはわたしの王[おう]。"
  9: "モアブはわたしの望[のぞ]みの洗[あら]い盤[ばん]。エドムの上[うえ]に、わたしの履[は]き物[もの]を伸[の]べ広[ひろ]げる。ペリシテ人[じん]はわたしに服[ふく]した。」"
  10: "だれがわたしを、堅[かた]い都[みやこ]へ連[つ]れて行[ゆ]くのか。だれがわたしをエドムまで導[みちび]くのか。"
  11: "神[かみ]よ、わたしたちを退[しりぞ]けたのは、あなたではないか。神[かみ]よ、あなたはわたしたちの軍[ぐん]とともに出[で]て行[ゆ]かれない。"
  12: "苦[くる]しみのうちで、わたしたちに助[たす]けを与[あた]えてください。人[ひと]の救[すく]いは空[むな]しい。"
  13: "わたしたちは神[かみ]によって力[ちから]を現[あらわ]す。神[かみ]はわたしたちの敵[てき]を軽[かろ]んじられる。"

notes:
  0: "Ὠιδὴ ψαλμοῦ τῷ Δαυιδ — ダビデの詩の歌 (ᾠδή — 歌, ψαλμός — 詩; порядок как в Пс 65:0 復活の詩の歌). Надписание — стих 0."
  1: "Ἑτοίμη ἡ καρδία μου, ὁ θεός — 神よ、わたしの心は備わった; повтор сохранён. ᾄσομαι καὶ ψαλῶ ἐν τῇ δόξῃ μου — わたしは歌い、わたしの栄光をもってほめ歌おう (ψάλλω — «играть и петь»; δόξα — 栄光, здесь о душе или языке, ср. Пс 56:8)."
  2: "ἐξεγέρθητι, ψαλτήριον καὶ κιθάρα — 目を覚ませ、琴と竪琴 (ψαλτήριον — 琴, κιθάρα — 竪琴, как в Пс 56:8). ἐξεγερθήσομαι ὄρθρου — 夜明けに目を覚ます (ὄρθρος — «рассвет»)."
  3: "ἐξομολογήσομαί σοι ἐν λαοῖς — 諸国の民の間であなたに感謝をささげ (ἐξομολογέομαι — «славить, благодарить»). ψαλῶ σοι ἐν ἔθνεσιν — もろもろの民の間であなたをほめたたえる (λαοί и ἔθνη переданы различно — 諸国の民 и もろもろの民, как в Пс 56:9)."
  4: "μέγα ἐπάνω τῶν οὐρανῶν τὸ ἔλεός σου — あわれみは天よりも高く (μέγας — «велик»). ἕως τῶν νεφελῶν ἡ ἀλήθειά σου — 真実は雲にまで届く (νεφέλη — «облако»)."
  5: "ὑψώθητι ἐπὶ τοὺς οὐρανούς, ὁ θεός — 神よ、天の上に上げられてください (ὑψόω — «возносить»). ἐπὶ πᾶσαν τὴν γῆν ἡ δόξα σου — 栄光が全地の上にあるように. Припев, как в Пс 56:11."
  6: "ὅπως ἂν ῥυσθῶσιν οἱ ἀγαπητοί σου — あなたに愛された者たちが救われるために (ῥύομαι — «избавлять»; ἀγαπητός — «возлюбленный»). σῶσον τῇ δεξιᾷ σου — 右の手で救って. ἐπάκουσόν μου — わたしの声を聞いてください."
  7: "ὁ θεὸς ἐλάλησεν ἐν τῷ ἁγίῳ αὐτοῦ — 神はその聖所で言われた (ἐν τῷ ἁγίῳ — «во святыне Своей»). Ἀγαλλιάσομαι καὶ διαμεριῶ Σικιμα — わたしは喜び、シケムを分け (διαμερίζω — «делить»). τὴν κοιλάδα τῶν σκηνῶν διαμετρήσω — 幕の谷を測る (κοιλάς — «долина»; σκηναί — «шатры», евр. Суккот). С этого места говорит Бог — 「」."
  8: "ἐμός ἐστιν Γαλααδ… — ギルアデはわたしのもの (повтор ἐμός сохранён; ギルアデ, как в Пс 59:7). Εφραιμ ἀντίλημψις τῆς κεφαλῆς μου — エフライムは頭の守り (ἀντίλημψις — «поддержка, опора»). Ιουδας βασιλεύς μου — ユダはわたしの王."
  9: "Μωαβ λέβης τῆς ἐλπίδος μου — モアブは望みの洗い盤 (λέβης — «таз, котёл»; слав. «коноб»). ἐπὶ τὴν Ιδουμαίαν ἐκτενῶ τὸ ὑπόδημά μου — エドムの上に、わたしの履き物を伸べ広げる (ἐκτείνω — «простирать»; знак владения). ἐμοὶ ἀλλόφυλοι ὑπετάγησαν — ペリシテ人はわたしに服した (ἀλλόφυλος — «иноплеменник», обычное в LXX обозначение филистимлян). Здесь речь Бога заканчивается."
  10: "τίς ἀπάξει με εἰς πόλιν περιοχῆς — だれがわたしを堅い都へ連れて行くのか (περιοχή — «ограда, укрепление»). τίς ὁδηγήσει με ἕως τῆς Ιδουμαίας — だれがエドムまで導くのか. Говорит псалмопевец."
  11: "οὐχὶ σύ, ὁ θεός, ὁ ἀπωσάμενος ἡμᾶς — 神よ、あなたではないか、退けたのは (ἀπωθέω — «отринуть»; вопрос с ожиданием «да»). οὐκ ἐξελεύσῃ… ἐν ταῖς δυνάμεσιν ἡμῶν — わたしたちの軍とともに出て行かれない (δυνάμεις — «силы, войска»)."
  12: "δὸς ἡμῖν βοήθειαν ἐκ θλίψεως — 苦しみのうちで助けを与えてください. ματαία σωτηρία ἀνθρώπου — 人の救いは空しい (ματαῖος — «тщетный»; σωτηρία — 救い)."
  13: "ἐν τῷ θεῷ ποιήσομεν δύναμιν — わたしたちは神によって力を現す (ποιέω δύναμιν — «сотворить силу»). αὐτὸς ἐξουδενώσει τοὺς ἐχθροὺς ἡμῶν — わたしたちの敵を軽んじられる (ἐξουδενόω — «уничижать»; в Пс 59:12 стоит τοὺς θλίβοντας ἡμᾶς — 苦しめる者, здесь ἐχθρούς — 敵)."
