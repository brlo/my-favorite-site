# jp-box, Псалтирь, псалом 107. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 107: готовность петь (1–6) и слово Божие о народах (7–9),
# молитва о помощи в войне (10–13). Пс 107 составлен из Пс 56:8–12 и Пс 59:6–12:
# совпадающие стихи переведены тем же текстом, что и в этих псалмах.
# Красного и синего нет. Кавычки: слово Божие в 7–9 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: シケム, ギルアデ, モアブ, エドム, ペリシテ уже в корпусе (Пс 59).
# jp-ni не использовался.

