verses:
  1: "シュヒ人[じん]ビルダドは答[こた]えて言[い]った。"
  2: "「いったい、何[なに]が始[はじ]まりと言[い]えようか。高[たか]い所[ところ]で万象[ばんしょう]を造[つく]る方[かた]から出[で]る恐[おそ]れのほかに。"
  3: "彼のもとで軍勢[ぐんぜい]が遅[おく]れることなどない、とだれが思[おも]うだろうか。だれの上[うえ]に、彼からの待[ま]ち伏[ぶ]せが臨[のぞ]まないというのか。"
  4: "どうして人[ひと]は主[しゅ]の前[まえ]に正[ただ]しい者[もの]でありえようか。女[おんな]から生[う]まれた者[もの]が、どうして自分[じぶん]を清[きよ]めえようか。"
  5: "彼が月[つき]に命[めい]じれば、月は光[ひかり]を放[はな]たない。星々[ほしぼし]も彼の前[まえ]では清[きよ]くない。"
  6: "まして、人[ひと]は腐[くさ]れ物[もの]、人の子[こ]は虫[むし]にすぎない。」"

notes:
  1: "Повествование. Ὑπολαβὼν δὲ Βαλδαδ ὁ Σαυχίτης λέγει — «И отвечал Вилдад Савхеянин и сказал»: ὑπολαμβάνω — «подхватывать, отвечать»; исторический презенс λέγει. Σαυχίτης — シュヒ人 (слав. «савхейский», Син. «Савхеянин»). Формула стоит вне кавычек; речь Вилдада открывается в ст. 2 и закрыта в конце ст. 6."
  2: "Вилдад. Τί γὰρ προοίμιον ἢ φόβος παρ᾿ αὐτοῦ — «Ибо что начало, если не страх от Него»: προοίμιον — «вступление, начало»; LXX передаёт евр. מָשָׁל («власть, притча») словом προοίμιον, отсюда тёмное «начало». ὁ ποιῶν τὴν σύμπασαν ἐν ὑψίστῳ — «Тот, кто творит всё в вышних»: σύμπασα — «всё, вселенная»; слав. «иже творит всяческая в вышних». Риторический вопрос сохранён; в евр. здесь «власть и страх у Него» — иное чтение, не вносим."
  3: "Вилдад. μὴ γάρ τις ὑπολάβοι ὅτι ἔστιν παρέλκυσις πειραταῖς — «да не подумает кто, что есть промедление у разбойников»: παρέλκυσις — «затягивание, промедление»; πειραταί — «разбойники, пираты», слав. передаёт «воинством». ἐπὶ τίνας δὲ οὐκ ἐπελεύσεται ἔνεδρα παρ᾿ αὐτοῦ — «и на кого не найдёт засада от Него?»: ἔνεδρον — «засада». В евр. иной образ («счёт воинствам», «свет Его») — Синодальный следует масоретскому тексту, не вносим."
  4: "Вилдад. πῶς γὰρ ἔσται δίκαιος βροτὸς ἔναντι κυρίου — «как будет праведен смертный пред Господом?»: βροτός — «смертный, человек». ἢ τίς ἂν ἀποκαθαρίσαι ἑαυτὸν γεννητὸς γυναικὸς — «или кто очистит себя, рождённый от жены?»: ἀποκαθαρίζω — «очищать»; γεννητός — «рождённый». Параллелизм двух вопросов сохранён; δίκαιος — 正しい者, как в брифе."
  5: "Вилдад. εἰ σελήνῃ συντάσσει, καὶ οὐκ ἐπιφαύσκει — «если Он повелевает луне, и она не светит»: συντάσσω — «приказывать»; ἐπιφαύσκω — «светить». ἄστρα δὲ οὐ καθαρὰ ἐναντίον αὐτοῦ — «и звёзды нечисты пред Ним»; слав. «аще луне повелевает, и не сияет». Условное εἰ передано условно-временным 命じれば, без сглаживания."
  6: "Вилдад. ἔα δέ — «тем паче» (усилительная частица, слав. «кольми паче»). ἄνθρωπος σαπρία καὶ υἱὸς ἀνθρώπου σκώληξ — «человек — гниль, и сын человеческий — червь»: σαπρία — «гниль, гной»; σκώληξ — «червь». В евр. последнее слово иное («моль»), Синодальный даёт «моль» — чтение не вносим; цитата закрыта."
