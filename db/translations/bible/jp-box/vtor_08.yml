# jp-box, Второзаконие, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru (jp-joc в гл. 8 отсутствует).
# ru (Синодальный, с масоретского) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: речь Моисея: помни путь сорока лет (1–4), манна и «не одним хлебом» (3),
# наставление как отец сына (5), описание доброй земли (6–10),
# опасность забыть Бога в довольстве (11–18), предостережение о погибели (19–20).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавки («сие четыредесятое
# лето» в 8:2) в греч. нет — не переводим; «сорок лет» стоит в 8:4.
# Сносок ⟨…⟩ нет: マナ уже в корпусе (Исх 16), 蠍, 嗣業, 契約 понятны.
# jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 8
draft: true

verses:
  1: "「わたしが今日[きょう]あなたがたに命[めい]じる戒[いまし]めをすべて、あなたがたは守[まも]って行[おこな]わなければならない。そうすれば、あなたがたは生[い]き、多[おお]く増[ふ]え、あなたがたの父[ちち]たちに誓[ちか]われた地[ち]に入[はい]って、それを嗣業[しぎょう]として受[う]け継[つ]ぐことができる。"
  2: "あなたは、あなたの神[かみ]である主[しゅ]が荒野[こうや]であなたを導[みちび]かれたすべての道[みち]のことを覚[おぼ]えていなさい。それは、主[しゅ]があなたを苦[くる]しめ、試[ため]て、あなたの心[こころ]にあるもの、すなわちあなたが主[しゅ]の戒[いまし]めを守[まも]るかどうかを知[し]られるためであった。"
  3: "主[しゅ]はあなたを苦[くる]しめ、飢[う]えさせ、あなたの父[ちち]たちが知[し]らなかったマナをあなたに食[た]べさせられた。それは、人[ひと]はパンだけによって生[い]きるのではなく、主[しゅ]の口[くち]から出[で]るすべての言葉[ことば]によって生[い]きることを、あなたに知[し]らせるためであった。"
  4: "あなたの衣[ころも]はすり切れず、あなたの足[あし]は腫[は]れなかった。見[み]よ、四十年[よんじゅうねん]の間[あいだ]のことである。"
  5: "あなたは心[こころ]で、人[ひと]が自分[じぶん]の息子[むすこ]を教[おし]え導[みちび]くように、あなたの神[かみ]である主[しゅ]があなたを教[おし]え導[みちび]かれることを知[し]らなければならない。"
  6: "あなたは、あなたの神[かみ]である主[しゅ]の戒[いまし]めを守[まも]り、その道[みち]を歩[あゆ]み、主[しゅ]を恐[おそ]れなければならない。"
  7: "あなたの神[かみ]である主[しゅ]は、あなたを良[よ]い広[ひろ]い地[ち]へ導[みちび]き入[い]れられる。そこには水[みず]の流[なが]れと淵[ふち]の泉[いずみ]が、平野[へいや]と山[やま]を貫[つらぬ]いて流[なが]れ出[で]ている。"
  8: "小麦[こむぎ]と大麦[おおむぎ]、ぶどうの木[き]、いちじく、ざくろの地[ち]、オリーブの油[あぶら]と蜜[みつ]の地[ち]である。"
  9: "あなたが乏[とぼ]しい思[おも]いをすることなくパンを食[た]べ、何[なに]ひとつ不足[ふそく]しない地[ち]、その石[いし]が鉄[てつ]であり、その山[やま]から銅[どう]を掘[ほ]り出[だ]す地[ち]である。"
  10: "あなたは食[た]べて満[み]ち足[た]り、あなたの神[かみ]である主[しゅ]があなたに与[あた]えられた良[よ]い地[ち]のゆえに、主[しゅ]を祝福[しゅくふく]しなければならない。"
  11: "自分[じぶん]に気[き]をつけなさい。あなたの神[かみ]である主[しゅ]を忘[わす]れて、わたしが今日[きょう]あなたに命[めい]じるその戒[いまし]めと裁[さば]きと定[さだ]めのすべてを守[まも]らないことのないように。"
  12: "あなたが食[た]べて満[み]ち足[た]り、良[よ]い家[いえ]を建[た]ててそこに住[す]み、"
  13: "あなたの牛[うし]や羊[ひつじ]が増[ふ]え、銀[ぎん]や金[きん]が増[ふ]え、あなたの持[も]つすべてのものが増[ふ]えるとき、"
  14: "あなたの心[こころ]が高[たか]ぶれて、あなたをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]した、あなたの神[かみ]である主[しゅ]を忘[わす]れてはならない。"
  15: "主[しゅ]は、あの大[おお]きく恐[おそ]ろしい荒野[こうや]をあなたに通[とお]らせた。そこには人[ひと]を噛[か]む蛇[へび]と蠍[さそり]があり、渇[かわ]きがあり、水[みず]はなかった。主[しゅ]は硬[かた]い岩[いわ]から、あなたのために水[みず]の泉[いずみ]を出[だ]させられた。"
  16: "荒野[こうや]であなたにマナを食[た]べさせられた。それはあなたの父[ちち]たちが知[し]らなかったものである。主[しゅ]があなたを苦[くる]しめ、試[ため]し、あなたの日[ひ]々[び]の終[お]わりにあなたを幸[しあわ]せにするためであった。"
  17: "あなたは心[こころ]の中[なか]で『わたしの力[ちから]と、わたしの手[て]の強[つよ]さが、この大[おお]きな力[ちから]をわたしにもたらした』と言[い]ってはならない。"
  18: "あなたは、あなたの神[かみ]である主[しゅ]を覚[おぼ]えていなさい。あなたに力[ちから]を与[あた]えてこの力[ちから]を成[な]さしめ、あなたの父[ちち]たちに誓[ちか]われた契約[けいやく]を、今日[きょう]のように成[な]り立[た]たせるのは、主[しゅ]ご自身[じしん]だからである。"
  19: "あなたが、あなたの神[かみ]である主[しゅ]をすっかり忘[わす]れ、ほかの神[かみ]々[がみ]に従[したが]って行[い]き、それらに仕[つか]え、それらを拝[おが]むなら、わたしは今日[きょう]、天[てん]と地[ち]を証[あかし]として、あなたがたに警告[けいこく]する。あなたがたは必[かなら]ず滅[ほろ]びる。"
  20: "主[しゅ]があなたがたの前[まえ]から滅[ほろ]ぼされるほかの民[たみ]々[びと]と同じく、あなたがたも滅[ほろ]びる。あなたがたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]わなかったからである。」"

notes:
  1: "φυλάξεσθε ποιεῖν — храните исполнять. ἵνα ζῆτε — чтобы жили. πολυπλασιασθῆτε — умножитесь (πολυπλασιάζω). ἣν κύριος ὁ θεὸς ὑμῶν ὤμοσεν — которую Господь Бог ваш клялся."
  2: "μνησθήσῃ πᾶσαν τὴν ὁδόν — вспомни весь путь. ἐκπειράσῃ — искусит, испытает. διαγνωσθῇ — станет известно (διαγινώσκω). Слав. в этом стихе добавляет «сие четыредесятое лето»; в греч. «сорок лет» стоит в 8:4, поэтому здесь не вставляем."
  3: "ἐλιμαγχόνησεν — изнурил голодом (λιμαγχονέω). ἐψώμισεν — напитал (ψωμίζω). μαννα — マナ. οὐκ ἐπ᾿ ἄρτῳ μόνῳ — не о хлебе едином. ἐπὶ παντὶ ῥήματι τῷ ἐκπορευομένῳ διὰ στόματος θεοῦ — всяким словом, исходящим из уст Божиих (в переводе 主の口 — формула корпуса). ζήσεται ὁ ἄνθρωπος повторено в греч. дважды."
  4: "ἱμάτια — одежды. οὐ κατετρίβη — не истлела (κατατρίβω). ἐτυλώθησαν — покрылись мозолями, опухли (τυλόω); слав. «не язвишася». ἰδοὺ τεσσαράκοντα ἔτη — вот сорок лет."
  5: "παιδεύσαι … παιδεύσει — наставит, воспитает, научит (παιδεύω; слав. «накажет»). ὡς εἴ τις — как если бы кто."
  6: "φυλάξῃ … πορεύεσθαι … φοβεῖσθαι — храни, ходи и бойся (инфинитивы как содержание заповеди)."
  7: "χείμαρροι ὑδάτων — потоки вод (χείμαρρος «зимний поток»). πηγαὶ ἀβύσσων — источники бездн (ἄβυσσος). πεδία — равнины, 平野."
  8: "πυρός — пшеница, κριθή — ячмень. ἄμπελοι, συκαῖ, ῥόαι — виноградники, смоковницы, гранаты. ἐλαίας ἐλαίου — маслина елея (то же сочетание, что в 6:11)."
  9: "οὐ μετὰ πτωχείας — не с бедностью, т. е. без скудости (πτωχεία «нищета»). ἐνδεηθήσῃ — будешь нуждаться. οἱ λίθοι σίδηρος — камни — железо. μεταλλεύσεις χαλκόν — будешь высекать медь (μεταλλεύω)."
  10: "ἐμπλησθήσῃ — насытишься. εὐλογήσεις κύριον — благословишь Господа (в японском обычнее ほめたたえる, но термин 祝福 сохранён). ἧς ἔδωκέν σοι — которую дал тебе."
  11: "τοῦ μὴ φυλάξαι — «чтобы не соблюдать»: предостережение от забвения, выражающегося в несоблюдении. κρίματα, δικαιώματα — 裁き, 定め."
  12: "οἰκίας καλάς — дома хорошие. Здесь начинается условный период, продолжающийся до 8:14."
  13: "πληθυνθέντων — когда умножится (род. абсолютный). βοῶν, προβάτων — крупный и мелкий скот. ἀργύριον, χρυσίον — серебро, золото."
  14: "ὑψωθῇς τῇ καρδίᾳ — вознесёшься сердцем (ὑψόω). ἐξ οἴκου δουλείας — из дома рабства."
  15: "ὄφις δάκνων — змей кусающий. σκορπίος — скорпион, 蠍. δίψα — жажда. πέτρα ἀκρότομος — скала несокрушённая, гранит (ἀκρότομος «отсечённая»)."
  16: "ψωμίσαντος — напитавшего. ἐπ᾿ ἐσχάτων τῶν ἡμερῶν σου — в последние дни твои."
  17: "ἰσχύς, κράτος — сила и крепость. δύναμιν τὴν μεγάλην — силу великую (в Синодальном «богатство» — толкование)."
  18: "δίδωσιν ἰσχὺν τοῦ ποιῆσαι δύναμιν — даёт силу приобретать силу/богатство. στῆσαι τὴν διαθήκην — поставить, утвердить завет."
  19: "λήθῃ ἐπιλάθῃ — забвением забудешь (удвоение). διαμαρτύρομαι — свидетельствуюсь, торжественно предупреждаю. ἀπωλείᾳ ἀπολεῖσθε — погибелью погибнете."
  20: "τὰ λοιπὰ ἔθνη — прочие народы. ἀνθ᾿ ὧν — за то, что (ἀντί + род.)."
