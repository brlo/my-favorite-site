# jp-box, Иезекииль, глава 46. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 46 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: конец видения храма. 1–15 — богослужебный устав: внутренние восточные
# ворота затворены шесть рабочих дней и открываются в субботу и новомесячие; князь
# входит притвором, священники совершают его всесожжение и спасения, князь поклоняется
# у входа и выходит; народ поклоняется у входа в субботы и новомесячия; субботняя жертва
# (шесть агнцев и овен), новомесячная (телец, шесть агнцев, овен), хлебное приношение
# и елей; входы и выходы народа в праздники (с севера — на юг, с юга — на север), князь
# посреди народа; добровольное приношение князя; ежедневный агнец и хлебное приношение
# утром; 16–18 — наследственные дары князя: сыновьям в вечное владение, рабам до года
# отпущения, и запрет отнимать удел народа; 19–24 — комнаты священников, где варят и
# пекут жертвы, и четыре малых двора с поварнями по углам.
# Голоса: 1 — формула «так говорит Господь Бог» вне кавычек; 1б–18 — одна речь Господа
# в 「…」 (формула «так говорит Господь Бог» в 16 внутри речи); 19–24 — повествование,
# в 20 и 24 короткая речь Господа в 「…」.
# «Точек» (лакун) в главе нет.
# Термины: 君[きみ] — ὁ ἀφηγούμενος (слав. «старейшина»), тот же титул, что ἄρχων;
# 門[もん] — πύλη; 前廊[ぜんろう] — αιλαμ (крытый портик); 燔祭[はんさい] — ὁλοκαύτωμα;
# 救[すく]いの犠牲[ぎせい] — τὸ σωτήριον; 穀物[こくもつ]の供[そな]え物[もの] — μαναα (минха); 焼[や]いた供[そな]え物[もの] — πέμμα
# (слав. «опреснок»); ヒン — τὸ ιν (гин); 安息日[あんそくび]; 新月[しんげつ] — νουμηνία;
# 厨房[ちゅうぼう] — μαγειρεῖον; 部屋[へや] — ἐξέδρα.
# Термины жертв выровнены по 40–45: μαναα — 穀物[こくもつ]の供[そな]え物[もの], σωτήριον —
# 救[すく]いの犠牲[ぎせい], πέμμα — 焼[や]いた供[そな]え物[もの] (в Левите — 素祭[そさい], 酬恩祭[しゅうおんさい]).
# Имена: собственных имён, кроме イスラエル, в главе нет.
