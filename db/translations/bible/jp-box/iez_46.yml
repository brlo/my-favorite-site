verses:
  1: "主[しゅ]なる神[かみ]はこう言[い]われる。「内庭[ないてい]にある東[ひがし]に面[めん]した門[もん]は、働[はたら]きの六日[むいか]の間[あいだ]は閉[と]ざされ、安息日[あんそくび]の日[ひ]には開[ひら]かれ、新月[しんげつ]の日[ひ]にも開[ひら]かれる。"
  2: "君[きみ]は外[そと]の門[もん]の前廊[ぜんろう]の道[みち]から入[はい]り、門[もん]の入口[いりぐち]に立[た]つ。祭司[さいし]たちは彼[かれ]の燔祭[はんさい]と彼の救[すく]いの犠牲[ぎせい]をささげる。彼は門[もん]の入口[いりぐち]で礼拝[れいはい]し、そして出[で]て行[く]。門[もん]は夕[ゆう]べまで決[けっ]して閉[と]ざされない。"
  3: "地[ち]の民[たみ]は、安息日[あんそくび]と新月[しんげつ]に、主[しゅ]の前[まえ]で、その門[もん]の入口[いりぐち]で礼拝[れいはい]する。"
  4: "君[きみ]が主[しゅ]にささげる燔祭[はんさい]は、安息日[あんそくび]の日[ひ]には、傷[きず]のない子羊[こひつじ]六匹[ろっぴき]と、傷[きず]のない雄羊[おひつじ]一匹[いっぴき]である。"
  5: "穀物[こくもつ]の供[そな]え物[もの]は、雄羊[おひつじ]には焼[や]いた供[そな]え物[もの]、子羊[こひつじ]たちには犠牲[ぎせい]、すなわち彼[かれ]の手[て]の贈[おく]り物[もの]、その焼[や]いた供[そな]え物[もの]に油[あぶら]一[いっ]ヒンである。"
  6: "新月[しんげつ]の日[ひ]には、群[む]れのうちの傷[きず]のない雄牛[おうし]の子[こ]と六匹[ろっぴき]の子羊[こひつじ]、そして傷[きず]のない雄羊[おひつじ]一匹[いっぴき]をささげる。"
  7: "穀物[こくもつ]の供[そな]え物[もの]としては、雄羊[おひつじ]に一[ひと]つのパン、雄牛[おうし]の子[こ]に一[ひと]つのパンがあり、子羊[こひつじ]たちには彼[かれ]の手[て]の及[およ]ぶ限[かぎ]り、その焼[や]いた供[そな]え物[もの]に油[あぶら]一[いっ]ヒンである。"
  8: "君[きみ]が入[はい]るときは、門[もん]の前廊[ぜんろう]の道[みち]から入[はい]り、門[もん]の道[みち]から出[で]て行[く]。"
  9: "地[ち]の民[たみ]が祭[まつ]りに主[しゅ]の前[まえ]に入[はい]るとき、北[きた]に面[めん]した門[もん]の道[みち]から入[はい]って礼拝[れいはい]する者[もの]は、南[みなみ]に面[めん]した門[もん]の道[みち]から出[で]て行[く]。南[みなみ]に面[めん]した門[もん]の道[みち]から入[はい]る者[もの]は、北[きた]に面[めん]した門[もん]の道[みち]から出[で]て行[く]。自分[じぶん]が入[はい]った門[もん]から引[ひ]き返[かえ]してはならない。ただ、その真[ま]っ直[す]ぐ前[まえ]から出[で]て行[く]。"
  10: "君[きみ]は彼[かれ]らの真[ま]ん中[なか]にいる。彼らが入[はい]るときには彼らとともに入[はい]り、彼らが出[で]て行[く]ときには出[で]て行[く]。"
  11: "祭[まつ]りと祝[いわ]いの集[つど]いのときの穀物[こくもつ]の供[そな]え物[もの]は、雄牛[おうし]の子[こ]に一[ひと]つのパン、雄羊[おひつじ]に一[ひと]つのパン、子羊[こひつじ]たちには彼[かれ]の手[て]の及[およ]ぶ限[かぎ]り、その焼[や]いた供[そな]え物[もの]に油[あぶら]一[いっ]ヒンである。"
  12: "しかし、君[きみ]が自[みずか]ら進[すす]んで、告白[こくはく]として主[しゅ]に燔祭[はんさい]や救[すく]いの犠牲[ぎせい]をささげるなら、東[ひがし]に面[めん]した門[もん]を自分[じぶん]のために開[ひら]き、安息日[あんそくび]の日[ひ]に行[おこな]うのと同[おな]じように、彼の燔祭[はんさい]と彼の救[すく]いの犠牲[ぎせい]を行[おこな]う。彼は出[で]て行[い]き、出[で]た後[あと]で扉[とびら]を閉[と]ざす。"
  13: "彼[かれ]は毎日[まいにち]、主[しゅ]に燔祭[はんさい]として、傷[きず]のない一歳[いっさい]の子羊[こひつじ]をささげる。朝[あさ]、これをささげる。"
  14: "その上[うえ]に穀物[こくもつ]の供[そな]え物[もの]を朝[あさ]ごとにささげる。すなわち、量[りょう]りの六分[ろくぶん]の一[いち]、油[あぶら]は一[いっ]ヒンの三分[さんぶん]の一[いち]を、上等[じょうとう]の小麦粉[こむぎこ]に混[ま]ぜ合[あ]わせて、主[しゅ]への穀物[こくもつ]の供[そな]え物[もの]とする。これは永遠[えいえん]の定[さだ]めである。"
  15: "あなたがたは朝[あさ]ごとに、子羊[こひつじ]と穀物[こくもつ]の供[そな]え物[もの]と油[あぶら]をささげ、絶[た]えず燔祭[はんさい]としなさい。"
  16: "主[しゅ]なる神[かみ]はこう言[い]われる。もし君[きみ]が自分[じぶん]の嗣業[しぎょう]のうちから、その子[こ]らの一人[ひとり]に贈[おく]り物[もの]を与[あた]えるなら、それは彼[かれ]の子[こ]らのものとなり、嗣業[しぎょう]としての所有[しょゆう]となる。"
  17: "しかし、もし彼[かれ]がその僕[しもべ]たちの一人[ひとり]に贈[おく]り物[もの]を与[あた]えるなら、それは解放[かいほう]の年[とし]までその者[もの]のものとなり、やがて君[きみ]に返[かえ]される。ただ彼[かれ]の子[こ]らの嗣業[しぎょう]は彼らのものとなる。"
  18: "君[きみ]は民[たみ]の嗣業[しぎょう]を取[と]って彼[かれ]らを虐[しいた]げてはならない。彼[かれ]は自分[じぶん]の所有[しょゆう]のうちから子[こ]らに嗣業[しぎょう]を与[あた]える。わたしの民[たみ]が、それぞれ自分[じぶん]の所有[しょゆう]から散[ち]らされてはならないからである。」"
  19: "彼[かれ]はわたしを、南[みなみ]に面[めん]した門[もん]の入口[いりぐち]から、北[きた]に面[めん]した祭司[さいし]たちの聖[せい]なる部屋[へや]へ連[つ]れて行[い]った。見[み]よ、そこには区切[くぎ]られた所[ところ]があった。"
  20: "彼[かれ]はわたしに言[い]った。「これが、祭司[さいし]たちが無知[むち]によるものと罪[つみ]によるものを煮[に]る所[ところ]である。そこでは穀物[こくもつ]の供[そな]え物[もの]をすっかり焼[や]く。外庭[がいてい]に持[も]ち出[だ]して民[たみ]を聖[せい]なるものとしてはならないからである。」"
  21: "彼[かれ]はわたしを外庭[がいてい]へ連[つ]れ出[だ]し、庭[にわ]の四[よっ]つの側[がわ]へと巡[めぐ]らせた。見[み]よ、庭[にわ]の側[がわ]に庭[にわ]があり、庭[にわ]の側[がわ]に庭[にわ]があった。"
  22: "庭[にわ]の四[よっ]つの側[がわ]には小[ちい]さな庭[にわ]があり、長[なが]さは四十[よんじゅう]キュビト、幅[はば]は三十[さんじゅう]キュビトで、四[よっ]つとも同[おな]じ寸法[すんぽう]であった。"
  23: "それらの庭[にわ]の内[うち]には周[まわ]りに部屋[へや]があり、四[よっ]つとも周[まわ]りにあった。その部屋[へや]の下[した]には、周[まわ]りに厨房[ちゅうぼう]が設[もう]けられていた。"
  24: "彼[かれ]はわたしに言[い]った。「これらは厨房[ちゅうぼう]の家[いえ]である。ここで、家[いえ]に仕[つか]える者[もの]たちが民[たみ]の犠牲[ぎせい]を煮[に]る。」"

notes:
  1: "Πύλη ἡ ἐν τῇ αὐλῇ τῇ ἐσωτέρᾳ — «ворота во внутреннем дворе» (内[うち]の庭[にわ]); ἡ βλέπουσα πρὸς ἀνατολάς — «смотрящие на восток»; ἓξ ἡμέρας τὰς ἐνεργούς — «шесть дней рабочих» (ἐνεργός — деятельный, рабочий; слав. «делных»); ἐν δὲ τῇ ἡμέρᾳ τῶν σαββάτων — «в день суббот»; νουμηνία — новомесячие (新月[しんげつ]). Ворота внутреннего двора затворены в будни и открываются в субботу и новомесячие."
  2: "ὁ ἀφηγούμενος — «ведущий, начальник» (君[きみ]; слав. «старейшина»); κατὰ τὴν ὁδὸν τοῦ αιλαμ τῆς πύλης τῆς ἔξωθεν — «путём притвора внешних ворот» (αιλαμ — крытый портик, 前廊[ぜんろう]); ἐπὶ τὰ πρόθυρα τῆς πύλης — «у преддверия ворот» (入口[いりぐち]); τὰ ὁλοκαυτώματα αὐτοῦ καὶ τὰ τοῦ σωτηρίου αὐτοῦ — «его всесожжения и его спасения» (燔祭[はんさい], 救[すく]いの犠牲[ぎせい]); οὐ μὴ κλεισθῇ ἕως ἑσπέρας — «не затворится до вечера». Слав. делит иначе: конец стиха («и поклонится… до вечера») стоит в слав. 46:3; держим деление LXX."
  3: "ὁ λαὸς τῆς γῆς — «народ земли» (地[ち]の民[たみ]); κατὰ τὰ πρόθυρα τῆς πύλης ἐκείνης — «у преддверия тех ворот»; ἐν τοῖς σάββατοις καὶ ἐν ταῖς νουμηνίαις — «в субботы и новомесячия»; ἐναντίον κυρίου — «пред Господом». Слав. в начале стиха повторяет конец предыдущего («и да поклонится…»), в LXX этого нет; не внесено."
  4: "τὰ ὁλοκαυτώματα προσοίσει — «всесожжения принесёт» (προσφέρω); ἓξ ἀμνοὺς ἀμώμους — «шесть агнцев непорочных» (傷[きず]のない子羊[こひつじ]六匹[ろっぴき]); κριὸν ἄμωμον — «овна непорочного» (雄羊[おひつじ]). Слав. «в день субботный» — в тексте 安息日の日."
  5: "μαναα — транслитерация евр. מִנְחָה, хлебное приношение (穀物[こくもつ]の供[そな]え物[もの]); πέμμα τῷ κριῷ — «печёное (лепёшка) овну» (焼[や]いた供[そな]え物[もの]; слав. «опреснок»); τοῖς ἀμνοῖς θυσίαν δόμα χειρὸς αὐτοῦ — «агнцам жертву, дар руки его», т. е. по мере щедрости (手[て]の贈[おく]り物[もの]); ἐλαίου τὸ ιν — «елея гин» (τὸ ιν — евр. הִין, мера жидкости; ヒン); τῷ πέμματι — «на печёное»."
  6: "μόσχον ἄμωμον — «тельца непорочного» (雄牛[おうし]の子[こ]); ἓξ ἀμνούς — «шесть агнцев»; κριὸς ἄμωμος ἔσται — «овен непорочный да будет». Слав. добавляет «от стада» (群[む]れのうちの) — нет в LXX, внесено без 〔…〕."
  7: "πέμμα τῷ κριῷ καὶ πέμμα τῷ μόσχῳ ἔσται μαναα — «печёное овну и печёное тельцу будет хлебным приношением» (порядок греч.: овен, телец; слав. наоборот — телец, овен); καθὼς ἐὰν ἐκποιῇ ἡ χεὶρ αὐτοῦ — «как достанет рука его», т. е. сколько может; ἐλαίου τὸ ιν τῷ πέμματι — «елея гин на печёное»."
  8: "κατὰ τὴν ὁδὸν τοῦ αιλαμ τῆς πύλης εἰσελεύσεται — «путём притвора ворот войдёт»; κατὰ τὴν ὁδὸν τῆς πύλης ἐξελεύσεται — «путём ворот выйдет». Слав. «по пути елама врат да внидет и по пути врат да изыдет»."
  9: "ἐν ταῖς ἑορταῖς — «в праздники» (祭[まつ]り); ὁ εἰσπορευόμενος κατὰ τὴν ὁδὸν τῆς πύλης τῆς πρὸς βορρᾶν προσκυνεῖν — «входящий путём северных ворот для поклонения»; οὐκ ἀναστρέψει — «не возвратится»; ἀλλ' ἢ κατ' εὐθὺ αὐτῆς ἐξελεύσεται — «но прямо против них выйдет» (κατ' εὐθύ — прямо напротив; слав. «прямо им»), т. е. через противоположные ворота."
  10: "ἐν μέσῳ αὐτῶν — «посреди них»; εἰσελεύσεται μετ' αὐτῶν — «войдёт с ними»; ἐκπορεύεσθαι — «выходить». Князь не идёт отдельным путём, а вместе с народом."
  11: "ἐν ταῖς ἑορταῖς καὶ ἐν ταῖς πανηγύρεσιν — «в праздники и в торжественные собрания» (πανήγυρις — 祝[いわ]いの集[つど]い); τὸ μαναα πέμμα τῷ μόσχῳ καὶ πέμμα τῷ κριῷ — «хлебное приношение: печёное тельцу и печёное овну»; τοῖς ἀμνοῖς καθὼς ἂν ἐκποιῇ ἡ χεὶρ αὐτοῦ — «агнцам, как достанет рука его»; ἐλαίου τὸ ιν τῷ πέμματι."
  12: "ὁμολογίαν — «исповедание» (слав. «исповедание»); здесь — добровольное приношение по обету и усердию (ср. Лев 22:18–23), в тексте буквально 告白[こくはく]として; ἀνοίξει ἑαυτῷ τὴν πύλην τὴν βλέπουσαν κατ' ἀνατολάς — «отворит себе ворота, смотрящие на восток»; ὃν τρόπον ποιεῖ ἐν τῇ ἡμέρᾳ τῶν σαββάτων — «как делает в день субботний»; κλείσει τὰς θύρας μετὰ τὸ ἐξελθεῖν αὐτόν — «затворит двери после выхода его» (扉[とびら])."
  13: "ἀμνὸν ἐνιαύσιον ἄμωμον — «агнца однолетнего непорочного» (一歳[いっさい]の); εἰς ὁλοκαύτωμα καθ' ἡμέραν — «во всесожжение каждый день»; πρωῒ ποιήσει αὐτόν — «утром совершит его» (朝[あさ])."
  14: "μαναα … τὸ πρωῒ ἕκτον τοῦ μέτρου — «хлебное приношение утром, шестую часть меры» (μέτρον — мера объёма; 量[りょう]りの六分[ろくぶん]の一[いち]); ἐλαίου τὸ τρίτον τοῦ ιν — «елея третью часть гина» (一[いっ]ヒンの三分[さんぶん]の一[いち]); ἀναμεῖξαι τὴν σεμίδαλιν — «смешать пшеничную муку» (上等[じょうとう]の小麦粉[こむぎこ]); πρόσταγμα διὰ παντός — «постановление навсегда»."
  15: "ποιήσετε τὸν ἀμνὸν καὶ τὸ μαναα καὶ τὸ ἔλαιον — «совершайте агнца, хлебное приношение и елей» (2 л. мн. ч.); τὸ πρωῒ ὁλοκαύτωμα διὰ παντός — «утром всесожжение постоянно». Слав. добавляет «масло древяно» (оливковое масло) — уточнение к τὸ ἔλαιον, внесено (油[あぶら])."
  16: "Ἐὰν δῷ ὁ ἀφηγούμενος δόμα ἑνὶ ἐκ τῶν υἱῶν αὐτοῦ — «если даст князь дар одному из сыновей своих»; ἐκ τῆς κληρονομίας αὐτοῦ — «из наследия своего»; τοῦτο τοῖς υἱοῖς αὐτοῦ ἔσται κατάσχεσις ἐν κληρονομίᾳ — «это сынам его будет во владение в наследие» (嗣業[しぎょう]としての所有[しょゆう]). Формула «так говорит Господь Бог» стоит внутри непрерывной речи."
  17: "ἕως τοῦ ἔτους τῆς ἀφέσεως — «до года отпущения» (解放[かいほう]の年[とし]), т. е. юбилейного года (ср. Лев 25:10); ἀποδώσει τῷ ἀφηγουμένῳ — «воздаст (вернёт) князю»; πλὴν τῆς κληρονομίας τῶν υἱῶν αὐτοῦ, αὐτοῖς ἔσται — «только наследие сыновей его им будет»."
  18: "οὐ μὴ λάβῃ … ἐκ τῆς κληρονομίας τοῦ λαοῦ καταδυναστεῦσαι αὐτούς — «не возьмёт из наследия народа, чтобы притеснить их» (καταδυναστεύω — насильственно господствовать); ἐκ τῆς κατασχέσεως αὐτοῦ κατακληρονομήσει τοῖς υἱοῖς αὐτοῦ — «из владения своего даст наследие сынам своим»; ὅπως μὴ διασκορπίζηται ὁ λαός μου ἕκαστος ἐκ τῆς κατασχέσεως αὐτοῦ — «чтобы не рассеивался народ Мой, каждый из владения своего». Здесь речь Господа закрывается."
  19: "εἰς τὴν εἴσοδον τῆς κατὰ νώτου τῆς πύλης — «ко входу, что за воротами» (κατὰ νώτου — позади, за спиной); слав. «во вход врат, яже к югу» — иное чтение, в тексте слав. (南[みなみ]に面[めん]した門[もん]), LXX-вариант отмечен; εἰς τὴν ἐξέδραν τῶν ἁγίων τῶν ἱερέων — «в комнату святынь священников» (祭司[さいし]たちの聖[せい]なる部屋[へや]); τόπος ἐκεῖ κεχωρισμένος — «место там отделённое» (区切[くぎ]られた所[ところ])."
  20: "οὗ ἑψήσουσιν … τὰ ὑπὲρ ἀγνοίας καὶ τὰ ὑπὲρ ἁμαρτίας — «где сварят [жертвы] за неведение и за грех» (無知[むち], 罪[つみ]); πέψουσι τὸ μαναα τὸ παράπαν — «испекут хлебное приношение совершенно» (παράπαν — совсем, вполне); τοῦ μὴ ἐκφέρειν εἰς τὴν αὐλὴν τὴν ἐξωτέραν τοῦ ἁγιάζειν τὸν λαόν — «чтобы не выносить на внешний двор и не освящать народ»."
  21: "ἐπὶ τὰ τέσσαρα μέρη τῆς αὐλῆς — «на четыре стороны двора» (四[よっ]つの側[がわ]); αὐλὴ κατὰ τὸ κλίτος τῆς αὐλῆς αὐλὴ κατὰ τὸ κλίτος τῆς αὐλῆς — «двор у стороны двора, двор у стороны двора»: повтор в LXX сохранён; слав. сжимает в «двор по углам двора»."
  22: "αὐλὴ μικρά — «малый двор» (小[ちい]さな庭[にわ]); μῆκος πηχῶν τεσσαράκοντα καὶ εὖρος πηχῶν τριάκοντα — «длиною в сорок локтей и шириною в тридцать» (キュビト); μέτρον ἓν ταῖς τέσσαρσιν — «мера одна четырём» (四[よっ]つとも同[おな]じ寸法[すんぽう])."
  23: "ἐξέδραι κύκλῳ ἐν αὐταῖς — «комнаты кругом в них» (部屋[へや]); μαγειρεῖα γεγονότα ὑποκάτω τῶν ἐξεδρῶν — «поварни, устроенные под комнатами» (厨房[ちゅうぼう])."
  24: "οἶκοι τῶν μαγειρείων — «дома поварен» (厨房[ちゅうぼう]の家[いえ]); οἱ λειτουργοῦντες τῷ οἴκῳ — «служащие дому (храму)» (家[いえ]に仕[つか]える者[もの]たち); τὰ θύματα τοῦ λαοῦ — «заклания (жертвы) народа» (民[たみ]の犠牲[ぎせい])."
