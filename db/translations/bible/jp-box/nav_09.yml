verses:
  1: "アモリ人[じん]の王[おう]たち、すなわちヨルダンの向[む]こう側[がわ]の山地[さんち]と平地[へいち]に住[す]む者[もの]、大[おお]きな海[うみ]の岸辺[きしべ]の全[すべ]てに住[す]む者[もの]、またアンティレバノンに近[ちか]い者[もの]たち、またヘテ人[じん]、カナン人[じん]、ペリジ人[じん]、ヒビ人[じん]、アモリ人[じん]、ゲルガシ人[じん]、エブス人[じん]は、これを聞[き]いて、"
  2: "一[いっ]致[ち]してヨシュアとイスラエルと戦[たたか]うために、共[とも]に集[あつ]まった。"
  3: "しかし、ガバオンの住[す]む者[もの]たちは、主[しゅ]がエリコとアイにされたすべてのことを聞[き]いて、"
  4: "彼[かれ]らもまた策略[さくりゃく]を用[もち]いた。すなわち、出[で]かけて旅[たび]の食[たべ]物[もの]を用意[ようい]し、古[ふる]い袋[ふくろ]と、破[やぶ]れてつぎを当[あ]てた古[ふる]い酒袋[さかぶくろ]とを取[と]って、自分[じぶん]たちのろばに載[の]せ、"
  5: "履[は]き物[もの]の底[そこ]はくぼみ、サンダルは古[ふる]くてつぎを当[あ]てて足[あし]に履[は]き、着物[きもの]は古[ふる]びて身[み]にまとい、旅[たび]のパンは乾[かわ]いてかび、砕[くだ]けていた。"
  6: "彼[かれ]らはガルガルのイスラエルの宿営[しゅくえい]にいるヨシュアのもとへ来[き]て、彼[かれ]とイスラエルに言[い]った。「わたしたちは遠[とお]い国[くに]から来[き]ました。どうか今[いま]、わたしたちと契約[けいやく]を結[むす]んでください。」"
  7: "イスラエルの人[ひと]々[びと]はそのホル人[じん]に言[い]った。「見[み]よ、あなたはわたしの間[あいだ]に住[す]んでいるのではないか。どうしてあなたと契約[けいやく]を結[むす]べるだろうか。」"
  8: "彼[かれ]らはヨシュアに言[い]った。「わたしたちはあなたのしもべです。」ヨシュアは彼[かれ]らに言[い]った。「あなたがたはどこから来[き]たのか。どこから来[き]たのか。」"
  9: "彼[かれ]らは言[い]った。「あなたのしもべたちは、あなたの神[かみ]である主[しゅ]の名[な]によって、非常[ひじょう]に遠[とお]い国[くに]から来[き]ました。主[しゅ]の名[な]と、主[しゅ]がエジプトで行[おこな]われたすべてのことを、わたしたちは聞[き]いたからです。"
  10: "また、ヨルダンの向[む]こう側[がわ]にいたアモリ人[じん]の二人[ふたり]の王[おう]、すなわちエセボンの王[おう]シホンと、アスタロトとエドラインに住[す]んでいたバシャンの王[おう]オグに、主[しゅ]がされたすべてのことを。」"
  11: "「そこで、それを聞[き]いて、わたしたちの長老[ちょうろう]たちと、わたしたちの地[ち]に住[す]むすべての者[もの]たちが、わたしたちに言[い]いました。『旅[たび]のための食[たべ]物[もの]を取[と]って、彼[かれ]らに会[あ]いに行[ゆ]き、こう言[い]いなさい。「わたしたちはあなたがたのしもべです。どうか今[いま]、わたしたちと契約[けいやく]を結[むす]んでください」と。』」"
  12: "「これはわたしたちのパンです。あなたがたのもとへ行[ゆ]こうとして出[で]た日[ひ]に、わたしたちはこれを熱[あつ]いうちに家[いえ]から持[も]ち出[だ]しました。ところが今[いま]、見[み]てください、これは乾[かわ]いて、ぼろぼろになっています。"
  13: "また、この酒袋[さかぶくろ]は、わたしたちが新[あたら]しいうちに満[み]たしたものですが、見[み]てください、破[やぶ]れてしまいました。わたしたちの着物[きもの]も履[は]き物[もの]も、長[なが]い旅[たび]のため、ひどく古[ふる]びました。」"
  14: "長[おさ]たちは彼[かれ]らの食[たべ]物[もの]を受[う]け取[と]ったが、主[しゅ]に問[と]うことをしなかった。"
  15: "ヨシュアは彼[かれ]らと和[わ]を結[むす]び、彼[かれ]らを生[い]かしておくという契約[けいやく]を彼[かれ]らと結[むす]んだ。会衆[かいしゅう]の長[おさ]たちは彼[かれ]らに誓[ちか]った。"
  16: "契約[けいやく]を結[むす]んでから三日[みっか]の後[のち]、彼[かれ]らは、あの人[ひと]々[びと]が近[ちか]くにいること、自分[じぶん]たちの間[あいだ]に住[す]んでいることを聞[き]いた。"
  17: "イスラエルの人[ひと]々[びと]は旅立[たびだ]って、彼[かれ]らの町[まち]々へ来[き]た。その町[まち]々とは、ガバオン、ケフィラ、ベロト、ヤリムの町[まち]であった。"
  18: "イスラエルの人[ひと]々[びと]は彼[かれ]らと戦[たたか]わなかった。会衆[かいしゅう]の長[おさ]たちがみな、イスラエルの神[かみ]である主[しゅ]によって彼[かれ]らに誓[ちか]っていたからである。会衆[かいしゅう]はみな、長[おさ]たちにつぶやいた。"
  19: "長[おさ]たちはみな会衆[かいしゅう]に言[い]った。「わたしたちはイスラエルの神[かみ]である主[しゅ]によって彼[かれ]らに誓[ちか]った。だから今[いま]、彼[かれ]らに手[て]を触[ふ]れることはできない。"
  20: "こうしよう。彼[かれ]らを生[い]かしておき、彼[かれ]らを守[まも]ろう。そうすれば、彼[かれ]らに誓[ちか]った誓[ちか]いのゆえに、わたしたちに怒[いか]りが下[くだ]ることはない。」"
  21: "こうして彼[かれ]らは生[い]きながら、会衆[かいしゅう]全[ぜん]体[たい]のために薪[まき]を割[わ]り、水[みず]を汲[く]む者[もの]となった。長[おさ]たちが彼[かれ]らに言[い]ったとおりである。"
  22: "ヨシュアは彼[かれ]らを呼[よ]び寄[よ]せて言[い]った。「なぜあなたがたは、『わたしたちはあなたから非常[ひじょう]に遠[とお]くにいる』と言[い]って、わたしを欺[あざむ]いたのか。あなたがたは、わたしたちの間[あいだ]に住[す]む者[もの]たちのうちの土着[どちゃく]の者[もの]ではないか。"
  23: "だから今[いま]、あなたがたは呪[のろ]われている。あなたがたのうちから、わたしとわたしの神[かみ]とに仕[つか]えるしもべ、すなわち薪[まき]を割[わ]る者[もの]が絶[た]えることはない。」"
  24: "彼[かれ]らはヨシュアに答[こた]えて言[い]った。「あなたの神[かみ]である主[しゅ]が、そのしもべモーセに命[めい]じて、この地[ち]をあなたがたに与[あた]え、あなたがたの前[まえ]から、この地[ち]に住[す]むすべての者[もの]を滅[ほろ]ぼし尽[つ]くすようにされたことが、わたしたちに告[つ]げられたので、あなたがたのゆえに、わたしたちの命[いのち]のことをひどく恐[おそ]れ、このことを行[おこな]ったのです。"
  25: "だから今[いま]、見[み]てください、わたしたちはあなたがたの手[て]の下[した]にあります。あなたがたに良[よ]いと思[おも]われ、そうと思[おも]われるとおりに、わたしたちにしてください。」"
  26: "彼[かれ]らはそのとおりにした。ヨシュアはその日[ひ]、彼[かれ]らをイスラエルの人[ひと]々[びと]の手[て]から救[すく]い出[だ]し、彼[かれ]らを殺[ころ]さなかった。"
  27: "その日[ひ]、ヨシュアは彼[かれ]らを、会衆[かいしゅう]全[ぜん]体[たい]のため、また神[かみ]の祭壇[さいだん]のために、薪[まき]を割[わ]り、水[みず]を汲[く]む者[もの]とした。それゆえ、ガバオンの住[す]む者[もの]たちは、今日[こんにち]に至[いた]るまで、また主[しゅ]が選[えら]ばれる所[ところ]において、神[かみ]の祭壇[さいだん]のために薪[まき]を割[わ]り、水[みず]を汲[く]む者[もの]となった。"

notes:
  1: "Ὡς δ᾿ ἤκουσαν — когда же услышали (ὡς δέ с аористом). οἱ ἐν τῷ πέραν τοῦ Ιορδάνου — те, что по ту сторону Иордана. ὀρεινή — 山地 (нагорье), πεδινή — 平地 (низменность). παραλία τῆς θαλάσσης τῆς μεγάλης — побережье великого моря, т.е. Средиземного (в корпусе 大きな海). Ἀντιλίβανος — アンティレバノン. Порядок народов в LXX: Хеттеи, Хананеи, Ферезеи, Евеи, Аморреи, Гергесеи, Иевусеи; по-японски — формы корпуса (Втор 20:17): ヘテ人, カナン人, ペリジ人, ヒビ人, アモリ人, ゲルガシ人, エブス人. Стих обрывается на союзе «и» — продолжение в ст. 2, как в LXX; поэтому в конце стоит «、», а не «。」."
  2: "συνήλθοσαν ἐπὶ τὸ αὐτό — собрались вместе (ἐπὶ τὸ αὐτό — «в одно место», слав. «вкупе»). ἐκπολεμῆσαι — чтобы воевать (ἐκπολεμέω). ἅμα πάντες — все вместе, единодушно (слав. «единомысленно»)."
  3: "οἱ κατοικοῦντες Γαβαων — жители Гаваона (ガバオン, как в Числ и по брифу). ἤκουσαν πάντα ὅσα ἐποίησεν κύριος — услышали всё, что сделал Господь; в слав. добавлено «в холме» — в гр. нет. Иерихон и Гай — エリコ, アイ."
  4: "καὶ ἐποίησαν καί γε αὐτοὶ μετὰ πανουργίας — и они также поступили с хитростью (πανουργία — «лукавство, уловка»; отсюда 策略). ἐλθόντες ἐπεσιτίσαντο καὶ ἡτοιμάσαντο — придя, запаслись провизией и приготовились (ἐπισιτίζομαι — «заготовлять снедь»). σάκκοι — 袋 (мешки, обычно дерюжные); ἀσκοὶ οἴνου — 酒袋 (мехи для вина). ἀποδεδεμένους — завязанные (ἀποδέω)."
  5: "τὰ κοῖλα τῶν ὑποδημάτων — «впадины обуви», т.е. стоптанная, разбитая обувь (κοῖλος — «полый»; слав. «сапоги ветхи», ru «обувь ветхая»). σανδάλια — сандалии; καταπεπελματωμένα — покрытые заплатами (πελματόω, от πέλμα — «подошва, стопа»; слав. «заплачены»). ἄρτος τοῦ ἐπισιτισμοῦ — дорожный хлеб; ξηρός — сухой; εὐρωτιῶν — заплесневелый (εὐρωτιάω); βεβρωμένος — раздробленный, искрошенный (βιβρώσκω)."
  6: "ἤλθοσαν πρὸς Ἰησοῦν εἰς τὴν παρεμβολὴν Ισραηλ εἰς Γαλγαλα — пришли к Иисусу в стан Израилев в Галгал (παρεμβολή — 宿営, как в Числ; Γαλγαλα — ガルガル). Ἐκ γῆς μακρόθεν ἥκαμεν — «из земли издалека мы пришли» (ἥκω — «прибыть»). διάθεσθε ἡμῖν διαθήκην — заключите с нами договор (διατίθεμαι διαθήκην; 契約を結ぶ — форма корпуса)."
  7: "πρὸς τὸν Χορραῖον — «к Хоррею», ед. ч. вместо мн. ч. (собирательно). Греч. Χορραῖος — хоррей (ホル人); масоретский текст и ru читают здесь «Евеи», слав. сохраняет «хоррею» — держимся LXX. Ὅρα μὴ ἐν ἐμοὶ κατοικεῖς — «смотри, не во мне ли (т.е. среди меня) ты живёшь»: в греч. ед. ч. ἐμοί, а не «в нас» (слав. «посреде ли нас»); ед. ч. сохранено, отсюда 見よ и わたしの間. πῶς σοι διαθῶμαι διαθήκην — как заключу с тобой договор?"
  8: "Οἰκέται σού ἐσμεν — «рабы твои мы» (οἰκέτης — домочадец, раб; しもべ). Πόθεν ἐστὲ καὶ πόθεν παραγεγόνατε — откуда вы и откуда пришли: LXX повторяет вопрос дважды, повтор сохранён."
  9: "ἐν ὀνόματι κυρίου τοῦ θεοῦ σου — именем Господа Бога твоего (т.е. ради Его имени). ἀκηκόαμεν γάρ — ибо мы слышали (perfect ἀκούω). Стих кончается союзом «и» (ὅσα … ἐν Αἰγύπτῳ), продолжение в ст. 10, поэтому «。」 внутри речи, а закрытие кавычек — в ст. 10."
  10: "τῷ Σηων βασιλεῖ Εσεβων — Сигону, царю Есевонскому (シホン, エセボン). τῷ Ωγ βασιλεῖ τῆς Βασαν — Огу, царю Васанскому (オグ, バシャン). ὃς κατῴκει ἐν Ασταρωθ καὶ ἐν Εδραιν — который жил в Астароте и Едраине (アスタロト, エドライン; слав. «во астарофе и во едраине», ru оставляет только Астароф). Здесь закрывается речь, начатая в ст. 9."
  11: "οἱ πρεσβύτεροι ἡμῶν καὶ πάντες οἱ κατοικοῦντες τὴν γῆν ἡμῶν — старейшины наши и все жители земли нашей. Три уровня речи: слова гаваонитян — 「…」, слова старейшин — 『…』, вложенная в них весть к Иисусу — снова 「…」 (в японской традиции третий уровень возвращается к 「」). Λάβετε ἑαυτοῖς ἐπισιτισμὸν εἰς τὴν ὁδόν — возьмите себе снеди на дорогу. ἐρεῖτε πρός — скажите им. διάθεσθε ἡμῖν διαθήκην — заключите с нами договор."
  12: "οὗτοι οἱ ἄρτοι, θερμοὺς ἐφωδιάσθημεν αὐτούς — «этот хлеб, горячими мы его взяли в запас» (ἐφοδιάζω — снабжать в дорогу; винительный θερμούς при страдательной форме — по LXX). ἐν τῇ ἡμέρᾳ, ᾗ ἐξήλθομεν παραγενέσθαι πρὸς ὑμᾶς — в день, когда мы вышли, чтобы прийти к вам. ἐξηράνθησαν — высохли; γεγόνασιν βεβρωμένοι — стали искрошенными."
  13: "ἀσκοὶ τοῦ οἴνου, οὓς ἐπλήσαμεν καινούς — мехи вина, которые мы наполнили новыми (καινούς — согласовано с ἀσκούς, «новые мехи»). ἐρρώγασιν — треснули, лопнули (ῥήγνυμι, perfect). πεπαλαίωται ἀπὸ τῆς πολλῆς ὁδοῦ σφόδρα — обветшали от долгой дороги весьма."
  14: "ἔλαβον οἱ ἄρχοντες τοῦ ἐπισιτισμοῦ αὐτῶν — начальники взяли их припасы (слав. «взяша князи брашно их»; ru «Израильтяне взяли их хлеба» — подлежащее обобщено). κύριον οὐκ ἐπηρώτησαν — Господа не вопросили (ἐπερωτάω — «спрашивать, вопрошать»); отсюда 主に問うことをしなかった."
  15: "ἐποίησεν Ἰησοῦς πρὸς αὐτοὺς εἰρήνην — Иисус заключил с ними мир. διέθετο … διαθήκην τοῦ διασῶσαι αὐτούς — постановил договор о том, чтобы сохранить их живыми (διασῴζω). ὤμοσαν αὐτοῖς οἱ ἄρχοντες τῆς συναγωγῆς — поклялись им начальники собрания (συναγωγή — 会衆, как в Числ)."
  16: "μετὰ τρεῖς ἡμέρας μετὰ τὸ διαθέσθαι — через три дня после заключения договора. ἐγγύθεν αὐτῶν εἰσιν — они близки к ним. ἐν αὐτοῖς κατοικοῦσιν — живут среди них."
  17: "ἀπῆραν — отправились (ἀπαίρω, слав. «восташа»). αἱ δὲ πόλεις αὐτῶν — а города их: Γαβαων, Κεφιρα, Βηρωθ, πόλις Ιαριν — ガバオン, ケフィラ, ベロト, ヤリムの町. Последнее — евр. Кириаф-Иарим; в греч. буквально «город Ярин», поэтому ヤリムの町 (в слав. «град иарим», в ru «Кириаф-Иарим»). В греч. нет «в третий день» — это добавка csl и ru, не переводим."
  18: "οὐκ ἐμαχέσαντο αὐτοῖς — не воевали с ними (μάχομαι; слав. «не сотвориша рати», ru «не побили»). ὤμοσαν … κύριον τὸν θεὸν Ισραηλ — клялись Господом Богом Израилевым (винительный при ὄμνυμι). διεγόγγυσαν — возроптали, стали роптать (διαγογγύζω; отсюда つぶやいた). ἐπὶ τοῖς ἄρχουσιν — на начальников."
  19: "Ἡμεῖς ὠμόσαμεν αὐτοῖς — мы поклялись им. οὐ δυνησόμεθα ἅψασθαι αὐτῶν — не сможем прикоснуться к ним (ἅπτομαι — «касаться», здесь эвфемизм «поднять руку, убить»). Речь продолжается в ст. 20, поэтому кавычки закрываются там."
  20: "τοῦτο ποιήσομεν, ζωγρῆσαι αὐτούς — «это сделаем: оставим их живыми» (ζωγρέω — «брать живым»; слав. «еже живити их»). περιποιησόμεθα αὐτούς — сохраним, пощадим их (περιποιέω — «оберегать»). οὐκ ἔσται καθ᾿ ἡμῶν ὀργὴ διὰ τὸν ὅρκον — не будет на нас гнева за клятву (слав. «гнева клятвы ради»)."
  21: "ζήσονται καὶ ἔσονται ξυλοκόποι καὶ ὑδροφόροι — будут жить и будут дровосеками и водоносами (ξυλοκόπος — 薪を割る者, ὑδροφόρος — 水を汲む者; слав. «древосечцы и водоносцы»). В греч. это уже не прямая речь, а решение; слав. вводит слова князей («И рекоша им князи: да живут сии») и прибавку «И сотвори весь сонм, якоже рекоша им князи» — в LXX их нет, поэтому 21-й передан повествованием, кавычек нет. καθάπερ εἶπαν αὐτοῖς οἱ ἄρχοντες — как сказали им начальники."
  22: "Διὰ τί παρελογίσασθέ με — зачем вы обманули меня (παραλογίζομαι — «обсчитывать, обманывать»). Их ложь передана вложенной цитатой 『…』. ἐγχώριοι — местные, туземцы (ἐγχώριος; отсюда 土着の者; слав. «населницы»). τῶν κατοικούντων ἐν ἡμῖν — из живущих среди нас."
  23: "ἐπικατάρατοι — проклятые (ἐπικατάρατος; слав. «прокляти»). οὐ μὴ ἐκλίπῃ ἐξ ὑμῶν δοῦλος οὐδὲ ξυλοκόπος — да не иссякнет из вас раб и дровосек (ἐκλείπω — «оскудевать»). ἐμοὶ καὶ τῷ θεῷ μου — мне и Богу моему. Слав. добавляет «ниже водоносец» — в греч. нет, не переводим."
  24: "ἀπεκρίθησαν τῷ Ἰησοῖ λέγοντες — отвечали Иисусу, говоря (датив при ἀποκρίνομαι). Ἀνηγγέλη ἡμῖν — возвещено было нам. ὅσα συνέταξεν κύριος ὁ θεός σου Μωυσῇ τῷ παιδὶ αὐτοῦ — всё, что заповедал Господь Бог твой Моисею, рабу Своему (παῖς — しもべ). ἐξολεθρεῦσαι — истребить. ἐφοβήθημεν σφόδρα περὶ τῶν ψυχῶν ἡμῶν — весьма устрашились о душах наших, т.е. за жизнь свою."
  25: "ἰδοὺ ἡμεῖς ὑποχείριοι ὑμῖν — вот мы в руках ваших (ὑποχείριος — «подручный»; слав. «подручни»). ὡς ἀρέσκει ὑμῖν καὶ ὡς δοκεῖ ὑμῖν, ποιήσατε ἡμῖν — как угодно вам и как кажется вам, так и поступите с нами (повтор мысли, как в LXX; в ru сглажено «как лучше и справедливее»)."
  26: "ἐποίησαν αὐτοῖς οὕτως — сделали им так (мн. ч.; слав. «сотвориша»). ἐξείλατο αὐτοὺς Ἰησοῦς … ἐκ χειρῶν υἱῶν Ισραηλ — избавил их Иисус из рук сынов Израилевых (ἐξαιρέω). οὐκ ἀνεῖλον αὐτούς — не убили их."
  27: "κατέστησεν αὐτοὺς … ξυλοκόπους καὶ ὑδροφόρους πάσῃ τῇ συναγωγῇ καὶ τῷ θυσιαστηρίῳ τοῦ θεοῦ — поставил их дровосеками и водоносами для всего общества и для жертвенника Божия (θυσιαστήριον — 祭壇). ἕως τῆς σήμερον ἡμέρας — до сего дня (今日に至るまで). εἰς τὸν τόπον, ὃν ἐὰν ἐκλέξηται κύριος — на место, какое бы ни избрал Господь (ἐκλέγομαι)."
