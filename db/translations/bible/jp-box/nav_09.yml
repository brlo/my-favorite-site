# jp-box, Иисус Навин, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: цари Ханаана собираются на войну (1–2); хитрость гаваонитян: ветхие мехи,
# стоптанная обувь, заплесневелый хлеб (3–13); договор заключён без вопрошания Господа
# (14–15); обман открылся через три дня (16–21); Иисус делает гаваонитян дровосеками
# и водоносами при жертвеннике (22–27).
# Кавычки: речь гаваонитян — 「…」 (6, 9–13, 24–25), слова старейшин внутри их речи —
# 『…』 (11), вложенная в неё весть к Иисусу — 「…» (11); вопрос израильтян — 「…」 (7);
# ответ гаваонитян — 「…」 (8); слова Иисуса — 「…」 (22–23); ответ начальников
# обществу — 「…」 (19–20).
# Красного <j> нет. 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 聖絶 (Лев 27), 契約, 祭壇, 宿営, 部族 уже в корпусе.
# Отличия LXX: 9:7 в гр. τὸν Χορραῖον (хоррей, ед. ч.), масорет и ru — евеи;
# 9:17 в гр. нет «в третий день» (это csl и ru);
# 9:21 в гр. нет слов князей и «И сотвори весь сонм» — там просто решение;
# 9:23 в гр. только δοῦλος и ξυλοκόπος, «водоносец» — слав. добавка (не переводим).
# jp-ni не использовался.

