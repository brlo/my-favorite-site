chapter: 24
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに命[めい]じて、ともし火[び]をいつもともすために、打[う]って搾[しぼ]った清[きよ]いオリーブ油[ゆ]を、わたしのために持[も]って来[き]させなさい。"
  3: "アロンとその子[こ]らである祭司[さいし]たちは、証[あかし]の幕屋[まくや]の垂[た]れ幕[まく]の外[そと]で、夕[ゆう]べから朝[あさ]まで、主[しゅ]の前[まえ]でそれを絶[た]えずともしなさい。これはあなたがたの代々[よよ]にわたる永遠[えいえん]の定[さだ]めである。"
  4: "あなたがたは清[きよ]い燭台[しょくだい]の上[うえ]で、朝[あさ]まで主[しゅ]の前[まえ]にともし火[び]をともしなさい。"
  5: "あなたがたは小麦粉[こむぎこ]を取[と]り、それで十二[じゅうに]個[こ]のパンを作[つく]りなさい。一[ひと]つのパンは小麦粉[こむぎこ]の十分[じゅうぶん]の二[ふた]つでなければならない。"
  6: "あなたがたはそれらを二[ふた]つの列[れつ]に分[わ]け、一[ひと]つの列[れつ]に六[むっ]つのパンを置[お]いて、主[しゅ]の前[まえ]にある清[きよ]い机[つくえ]の上[うえ]に並[なら]べなさい。"
  7: "また、それぞれの列[れつ]の上[うえ]に、清[きよ]い乳香[にゅうこう]と塩[しお]を置[お]きなさい。それはパンとともに、主[しゅ]の前[まえ]に置[お]かれる記念[きねん]の捧[ささ]げ物[もの]となる。"
  8: "それは安息日[あんそくび]ごとに、イスラエルの子[こ]らの前[まえ]で、主[しゅ]の前[まえ]に絶[た]えず置[お]かれる。これは永遠[えいえん]の契約[けいやく]である。"
  9: "それらはアロンとその子[こ]らに属[ぞく]し、彼[かれ]らは聖[せい]なる場所[ばしょ]でそれを食[た]べる。それは主[しゅ]に献[ささ]げられるもののうちから、彼[かれ]にとって最[もっと]も聖[せい]なるものである。これは永遠[えいえん]の定[さだ]めである。」"
  10: "さて、イスラエル人[じん]の女[おんな]の息子[むすこ]が、イスラエルの子[こ]らの間[あいだ]に出[で]て来[き]た。彼[かれ]はエジプト人[じん]の子[こ]であった。そのイスラエル人の女[おんな]の息子[むすこ]と、あるイスラエル人[じん]の男[おとこ]とが、宿営[しゅくえい]の中で争[あらそ]った。"
  11: "そのイスラエル人の女[おんな]の息子[むすこ]は、主[しゅ]の名[な]を唱[とな]えて呪[のろ]った。そこで人々[ひとびと]は彼[かれ]をモーセのもとに連[つ]れて来[き]た。彼[かれ]の母[はは]の名[な]はサロミトといい、ダンの部族[ぶぞく]のダブリの娘[むすめ]であった。"
  12: "人々[ひとびと]は彼[かれ]を監禁[かんきん]し、主[しゅ]の命令[めいれい]によって裁[さば]かれるのを待[ま]った。"
  13: "主[しゅ]はモーセに言[い]われた。"
  14: "「呪[のろ]った者[もの]を宿営[しゅくえい]の外[そと]に連[つ]れ出[だ]しなさい。聞[き]いた者[もの]はすべて、その頭[あたま]に手[て]を置[お]きなさい。そして全会衆[ぜんかいしゅう]が彼[かれ]を石打[いしう]ちにしなさい。"
  15: "イスラエルの子[こ]らに語[かた]って言[い]いなさい。神[かみ]を呪[のろ]う者[もの]は、自分[じぶん]の罪[つみ]を負[お]う。"
  16: "主[しゅ]の名[な]を唱[とな]える者[もの]は、必[かなら]ず死刑[しけい]に処[しょ]せられる。イスラエルの全会衆[ぜんかいしゅう]が彼[かれ]を石[いし]で打[う]ちなさい。寄留者[きりゅうしゃ]であれ、その地[ち]に生[う]まれた者[もの]であれ、主[しゅ]の名[な]を唱[とな]えるなら、その者[もの]は死[し]ななければならない。"
  17: "人[ひと]を打[う]って死[し]なせた者[もの]は、必[かなら]ず死刑[しけい]に処[しょ]せられる。"
  18: "家畜[かちく]を打[う]って死[し]なせた者[もの]は、命[いのち]には命[いのち]をもって償[つぐな]わなければならない。"
  19: "隣人[りんじん]に傷[きず]を負[お]わせた者[もの]は、自分[じぶん]がしたとおりのことを自分[じぶん]にもされなければならない。"
  20: "骨折[こっせつ]には骨折[こっせつ]を、目[め]には目[め]を、歯[は]には歯[は]を。人[ひと]に傷[きず]を負[お]わせたとおりに、その者[もの]にもそのとおりにされなければならない。"
  21: "人[ひと]を打[う]って死[し]なせた者[もの]は、必[かなら]ず死刑[しけい]に処[しょ]せられる。"
  22: "寄留者[きりゅうしゃ]にも、その地[ち]の者[もの]にも、同[おな]じ一[ひと]つの裁[さば]きがある。わたしは主[しゅ]、あなたがたの神[かみ]である。」"
  23: "モーセはイスラエルの子[こ]らに語[かた]った。人々[ひとびと]は呪[のろ]った者[もの]を宿営[しゅくえい]の外[そと]に連[つ]れ出[だ]し、石打[いしう]ちにした。イスラエルの子[こ]らは、主[しゅ]がモーセに命[めい]じたとおりに行[おこな]った。"

notes:
  1: "εἶπεν κύριος πρὸς Μωυσῆν λέγων — стандартная формула введения речи; λέγων отдельно не передаётся."
  2: "Ἔντειλαι — прикажи (ἐντέλλομαι, имп. аор.). ἔλαιον ἐλάινον — масло масличное, оливковое. κεκομμένον — выбитое, толчёное (κόπτω, perf. part.; слав. «исцежен»). εἰς φῶς καῦσαι λύχνον — для света, чтобы горел светильник. διὰ παντός — непрестанно."
  3: "καταπέτασμα — завеса (слав. «завеса»). ἐν τῇ σκηνῇ τοῦ μαρτυρίου — в скинии свидетельства. καύσουσιν — будут возжигать. ἀπὸ ἑσπέρας ἕως πρωί — от вечера до утра. ἐνδελεχῶς — постоянно (слав. «непрестанно»). νόμιμον αἰώνιον — вечный устав."
  4: "λυχνία ἡ καθαρά — чистый светильник, подсвечник. καύσετε τοὺς λύχνους — возжжёте лампады. ἕως τὸ πρωί — до утра."
  5: "σεμίδαλις — пшеничная мука тонкого помола. δώδεκα ἄρτους — двенадцать хлебов. δύο δεκάτων — две десятых [ефы]. ὁ ἄρτος ὁ εἷς — один хлеб."
  6: "δύο θέματα — два ряда, два положения (θὲμα; слав. «два положения»). τράπεζα ἡ καθαρά — чистый стол."
  7: "λίβανον καθαρόν — чистый ливан, ладан. ἅλα — соль: LXX добавляет, в масоретском тексте только ливан (слав. «ливан чист и соль»). εἰς ἀνάμνησιν — в память. προκείμενα — предлежащие (πρόκειμαι)."
  8: "τῇ ἡμέρᾳ τῶν σαββάτων — в день суббот. προθήσεται — будет полагаться (προτίθημι, 3 л. ед.). ἐνώπιον τῶν υἱῶν Ισραηλ — пред сынами Израиля. διαθήκην αἰώνιον — завет вечный (в конце стиха)."
  9: "ἔσται Ααρων καὶ τοῖς υἱοῖς αὐτοῦ — будет Аарону и сынам его. ἅγια τῶν ἁγίων — святое святых, великая святыня. ἀπὸ τῶν θυσιαζομένων — из приносимого в жертву (θυσιάζω)."
  10: "υἱὸς γυναικὸς Ισραηλίτιδος — сын женщины-израильтянки. οὗτος ἦν υἱὸς Αἰγυπτίου — он был сыном египтянина. ἐμαχέσαντο — ссорились, боролись (μάχομαι). παρεμβολή — стан, лагерь (宿営)."
  11: "ἐπονομάσας τὸ ὄνομα — произнеся имя (ἐπονομάζω); в LXX не сказано «имя Господне», слав. добавляет «(Господне)». κατηράσατο — проклял (καταράομαι). Σαλωμιθ θυγάτηρ Δαβρι — Саломиф, дочь Даврии (слав. «саломииф, дщерь давриина»). φυλὴ Δαν — колено Даново."
  12: "ἀπέθεντο εἰς φυλακήν — поместили под стражу (ἀποτίθημι). διακρῖναι — чтобы рассудить (διακρίνω). διὰ προστάγματος κυρίου — по повелению Господню (πρόσταγμα)."
  13: "Формула введения речи."
  14: "Ἐξάγαγε — выведи. ἐπιθήσουσιν τὰς χεῖρας — возложат руки (знак свидетельства). λιθοβολήσουσιν — побьют камнями (λιθοβολέω). συναγωγή — собрание, община (会衆)."
  15: "Ἄνθρωπος, ὃς ἐὰν καταράσηται θεόν — человек, который проклянёт Бога. ἁμαρτίαν λήμψεται — примет грех, понесёт вину."
  16: "ὀνομάζων τὸ ὄνομα κυρίου — называющий имя Господне. θανάτῳ θανατούσθω — смертью да умрёт (гебраизм, усилительная конструкция). ἐάν τε προσήλυτος ἐάν τε αὐτόχθων — пришлец или туземец. τελευτάτω — да умрёт (τελευτάω)."
  17: "πατάξῃ ψυχὴν ἀνθρώπου — поразит душу человека (ψυχή здесь = человек). θανάτῳ θανατούσθω — ср. ст. 16."
  18: "κτῆνος — скот. ἀποτεισάτω — пусть заплатит (ἀποτίνω). ψυχὴν ἀντὶ ψυχῆς — душу за душу."
  19: "μῶμον — порок, увечье (слав. «порок»). ὡς ἐποίησεν αὐτῷ — как он сделал ему. ἀντιποιηθήσεται — будет сделано в ответ (ἀντιποιέω)."
  20: "σύντριμμα ἀντὶ συντρίμματος — перелом за перелом (σύντριμμα). ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ — око за око. ὀδόντα ἀντὶ ὀδόντος — зуб за зуб. καθότι ἂν δῷ μῶμον — как нанесёт увечье. δοθήσεται αὐτῷ — будет дано ему."
  21: "Повтор ст. 17 (в LXX почти дословно; слав. «иже аще ударит человека»). В Синодальном ст. 21 говорит о скоте — иное деление текста."
  22: "δικαίωσις μία — одно оправдание, один суд (слав. «оправдание едино»); ср. Исх 12:49 (νόμος εἷς). ἐγχώριος — местный, туземец."
  23: "ἐξήγαγον … ἐλιθοβόλησαν — вывели и побили камнями. καθὰ συνέταξεν κύριος — как повелел Господь (συντάσσω)."
