# jp-box, Левит, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24 — елей для светильника (1–4), хлебы предложения (5–9),
# наказание богохульника (10–16), «око за око» (17–22), исполнение (23).
# Речь Бога — 「…」: 2–9, 14–22; красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 祭司, 幕屋, 祭壇, 聖なる場所 уже в корпусе; 最も聖なるもの
# понятно из контекста.
# LXX: 24:7 добавляет «и соль» (καὶ ἅλα) к ливану — в масоретском только ливан;
# 24:11 в LXX просто τὸ ὄνομα, слав. добавляет «(Господне)»;
# 24:21 в LXX дословно повторяет ст. 17 (в Синодальном иначе — о скоте);
# 24:22 δικαίωσις («суд») вместо νόμος Исх 12:49.
# jp-ni не использовался.

tr_code: jp-box
