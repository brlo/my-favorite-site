# jp-box, Числа, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# ru (Синодальный) — только для понимания, не источник. jp-joc есть в ст. 2, 3, 5–9, 17, 18
# (чтение 1901 г., public domain) — свидетель церковного чтения, но не образец языка;
# в 24:6 он читает по евр. (沈香樹, 柏香木), поэтому 24:6 переведено по LXX (κέδροι — 杉).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: второе и третье пророчества Валаама (1–9), гнев Валака (10–14),
# пророчество о звезде и восстающем от Иакова (15–19), пророчества об Амалике, Кенеях, Оге и Киттимах (20–24),
# возвращение Валаама и Валака (25).
# Красного нет. Кавычки: пророчества — 「…」 (3–9, 15–19, 20, 21–22, 23–24),
# слова Валака — 「…」 (10–11), слова Валаама — 「…」 (12–14), его прежняя речь — 『…』 (13),
# своя речь Валака — 『…』 (11).
# Поэтические строки держатся по греческому: ἢ Γωγ («чем Гог», 7), δόξα μονοκέρωτος (8),
# σκύμνος / λέων (9) не сглажены.
# 24:17: в gr-lxx-byz стоит ἀναστήσεται ἄνθρωπος — «восстанет человек», а не σκῆπτρον
# и не евр. שֵׁבֶט («жезл», отсюда «жезл» Синодального и традиционное 王杖); держимся LXX,
# поэтому в тексте 人, а вариант «жезл/王杖» разобран в notes (ср. Быт 49:10 — там скипетр
# в LXX есть, и он передан 王杖).
# 〔…〕 нет: все слова есть в gr-lxx-byz (Γωγ, Ωγ, Βεωρ, Σηθ проверены по базе).
# Сносок ⟨…⟩ нет: 星, 嗣業, 獅子, 野牛, 巣, 天幕 понятны по контексту или уже в корпусе.
# jp-ni не использовался.

