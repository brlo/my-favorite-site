verses:
  1: "バラムは、イスラエルを祝福[しゅくふく]することが主[しゅ]の前[まえ]に良[よ]いことであるのを見[み]て、いつものように鳥占[とりうら]いのために出[で]かけることをせず、顔[かお]を荒野[こうや]の方[ほう]へ向[む]けた。"
  2: "バラムは目[め]を上[あ]げて、イスラエルが部族[ぶぞく]ごとに宿営[しゅくえい]しているのを見[み]た。そして、神[かみ]の霊[れい]が彼[かれ]の上[うえ]に臨[のぞ]んだ。"
  3: "彼[かれ]はそのたとえを取[と]り上[あ]げて言[い]った。「ベオルの子[こ]バラムが言[い]う。まことに見[み]る人[ひと]が言[い]う。"
  4: "神[かみ]の言葉[ことば]を聞[き]く者[もの]が言う。夢[ゆめ]のうちに神[かみ]の幻[まぼろし]を見[み]た者[もの]が。その目[め]は開[ひら]かれている。"
  5: "ヤコブよ、あなたの住[す]まいは何[なん]と美[うつく]しいことか。イスラエルよ、あなたの天幕[てんまく]は。"
  6: "陰[かげ]を落[お]とす谷[たに]のように、川[かわ]べの園[その]のように、主[しゅ]が植[う]えた天幕[てんまく]のように、水辺[みずべ]の杉[すぎ]のようである。"
  7: "彼[かれ]の種[たね]から人[ひと]が出[で]て、多[おお]くの国々[くにぐに]を支配[しはい]する。彼[かれ]の王国[おうこく]はゴグよりも高[たか]く上[あ]げられ、その王国[おうこく]は大[おお]きくなる。"
  8: "神[かみ]は彼[かれ]をエジプトから導[みちび]き出[だ]された。彼[かれ]には野牛[やぎゅう]の輝[かがや]きがある。彼[かれ]は敵[てき]の国々[くにぐに]を食[た]べ、その骨[ほね]の髄[ずい]まで食[く]い尽[つ]くし、矢[や]で敵[てき]を射[い]抜[ぬ]く。"
  9: "彼[かれ]は身[み]をかがめて伏[ふ]し、獅子[しし]のように、獅子[しし]の子[こ]のように眠[ねむ]った。誰[だれ]が彼[かれ]を起[おこ]こすのか。あなたを祝福[しゅくふく]する者[もの]は祝福[しゅくふく]され、あなたを呪[のろ]う者[もの]は呪[のろ]われる。」"
  10: "バラクはバラムに怒[いか]りを燃[も]やし、手[て]を打[う]ち鳴[な]らした。バラクはバラムに言[い]った。「私[わたし]は敵[てき]を呪[のろ]うためにあなたを呼[よ]んだのに、見[み]よ、あなたはもう三度[さんど]も祝福[しゅくふく]してしまった。"
  11: "今[いま]、あなたの場所[ばしょ]へ逃[に]げなさい。私[わたし]は『あなたを厚[あつ]く遇[もてな]そう』と言[い]ったが、見[み]よ、主[しゅ]はあなたから栄[えい]光[こう]を奪[うば]われた。」"
  12: "バラムはバラクに言[い]った。「私[わたし]は、あなたが私[わたし]のもとに遣[つか]わした使者[ししゃ]たちに、こう言[い]ったではないか。"
  13: "『たとえバラクが、銀[ぎん]と金[きん]に満[み]ちたその家[いえ]を私[わたし]に与[あた]えても、私[わたし]は主[しゅ]の言葉[ことば]を越[こ]えて、悪[わる]いことか善[よ]いことを自分[じぶん]から行[おこな]うことはできない。神[かみ]が語[かた]られることは何[なん]でも、それを私[わたし]は語[かた]ろう』。」"
  14: "「そして今[いま]、見[み]よ、私[わたし]は自分[じぶん]の場所[ばしょ]へ帰[かえ]る。さあ、私[わたし]はあなたに、この民[たみ]があなたの民[たみ]に末[すえ]の日[ひ]々[び]に行[おこな]うことを告[つ]げよう。」"
  15: "彼[かれ]はそのたとえを取[と]り上[あ]げて言[い]った。「ベオルの子[こ]バラムが言[い]う。まことに見[み]る人[ひと]が言[い]う。"
  16: "神[かみ]の言葉[ことば]を聞[き]き、いと高[たか]い方[かた]からの知識[ちしき]を知[し]っている者[もの]が言う。夢[ゆめ]のうちに神[かみ]の幻[まぼろし]を見[み]て、目[め]を開[ひら]かれている者[もの]が言う。"
  17: "私[わたし]は彼[かれ]に示[しめ]す。しかし、今[いま]ではない。私[わたし]は彼[かれ]を幸[さいわ]いだと言[い]う。しかし、近[ちか]くはない。ヤコブから星[ほし]が昇[のぼ]り、イスラエルから人[ひと]が起[お]こり立[た]ち、モアブの長[おさ]たちを打[う]ち砕[くだ]き、セトの子[こ]らをすべて奪[うば]い去[さ]る。"
  18: "エドムは嗣業[しぎょう]となる。その敵[てき]であるエサウも嗣業[しぎょう]となる。イスラエルは力[ちから]をもって行[おこな]った。"
  19: "ヤコブから出[で]る者[もの]が起[お]こり、町[まち]から救[すく]われる者[もの]を滅[ほろ]ぼす。」"
  20: "彼[かれ]はアマレクを見[み]、そのたとえを取[と]り上[あ]げて言[い]った。「アマレクは国々[くにぐに]の初[はじ]めである。しかし、その種[たね]は滅[ほろ]びる。」"
  21: "彼[かれ]はカイン人[じん]を見[み]、そのたとえを取[と]り上[あ]げて言[い]った。「あなたの住[す]まいは強[つよ]い。あなたは岩[いわ]の上[うえ]に巣[す]を置[お]く。"
  22: "しかし、ベオルに狡猾[こうかつ]な巣[す]ができても、アッスル人[じん]があなたを捕虜[ほりょ]にする。」"
  23: "彼[かれ]はオグを見[み]、そのたとえを取[と]り上[あ]げて言[い]った。「ああ、ああ。神[かみ]がこれらを置[お]かれるとき、誰[だれ]が生[い]き延[の]びるだろうか。"
  24: "キティム人[じん]の手[て]から出[で]て、アッスルを苦[くる]しめ、ヘブライ人[じん]を苦[くる]しめ、彼[かれ]らもまた共[とも]に滅[ほろ]びる。」"
  25: "バラムは立[た]って、自分[じぶん]の場所[ばしょ]へ帰[かえ]った。バラクもまた、自分[じぶん]のところへ行[い]った。"

notes:
  1: "εἰωθός — обычай (τὸ εἰωθός, «как обычно»). εἰς συνάντησιν τοῖς οἰωνοῖς — «навстречу знамениям (птицам)», т.е. на птицегадание (οἰωνός — «птица, знамение»; слав. «в сретение волхвованием»). ἀπέστρεψεν τὸ πρόσωπον — обратил лицо (ἀποστρέφω)."
  2: "ἐξάρας τοὺς ὀφθαλμούς — подняв глаза (ἐξαίρω). καθορᾷ — видит (καθοράω, настоящее время). ἐστρατοπεδευκότα κατὰ φυλάς — стоящего станом по племенам (στρατοπεδεύω; φυλή — 部族). πνεῦμα θεοῦ ἐν αὐτῷ — Дух Божий в нём (ἐν, не ἐπί, как в 23:7)."
  3: "Φησὶν Βαλααμ υἱὸς Βεωρ — «говорит Валаам, сын Веора» (φημί; формула пророческой речи). φησὶν ὁ ἄνθρωπος ὁ ἀληθινῶς ὁρῶν — «говорит человек, истинно видящий» (ὁρῶν — причастие ὁράω; ἀληθινῶς — «истинно»). Речь идёт до 9-го."
  4: "ἀκούων λόγια θεοῦ — слышащий слова (изречения) Божии (λόγιον — «изречение»). ὅρασιν θεοῦ εἶδεν ἐν ὕπνῳ — видел видение Божие во сне (ὅρασις — 幻; ὕπνος). ἀποκεκαλυμμένοι οἱ ὀφθαλμοὶ αὐτοῦ — «открыты глаза его» (perfect pass. ἀποκαλύπτω; именительный самостоятельный, оставлен назывным, как в греч.); слав. «отверсты очи его»."
  5: "Ὡς καλοί σου οἱ οἶκοι — как прекрасны жилища твои (οἶκος — «дом, жилище»; 住まい). αἱ σκηναί σου — шатры твои (σκηνή; 天幕, не 幕屋 — скиния). Восклицание Ὡς καλός — «как прекрасно»."
  6: "ὡσεὶ νάπαι σκιάζουσαι — как осеняющие лощины (νάπη — «лесистая ложбина»; σκιάζω — «давать тень»; 陰を落とす谷). ὡσεὶ παράδεισοι ἐπὶ ποταμῶν — как сады при реках (παράδεισος — «сад, парк»). ἃς ἔπηξεν κύριος — которые водрузил Господь (πήγνυμι). ὡσεὶ κέδροι παρ᾽ ὕδατα — как кедры при водах (κέδρος — 杉, как по корпусу)."
  7: "ἐξελεύσεται ἄνθρωπος ἐκ τοῦ σπέρματος αὐτοῦ — выйдет человек из семени его. κυριεύσει ἐθνῶν πολλῶν — будет господствовать над многими народами (κυριεύω + род.). ὑψωθήσεται ἢ Γωγ βασιλεία αὐτοῦ — «возвысится более (чем) Гог царство его» (ἤ после положительной степени — «чем»; Γωγ — ゴグ; слав. «паче гога»); ru «превзойдет Агага» — по евр. αὐξηθήσεται — возрастёт."
  8: "ὡδήγησεν — вёл (ὁδηγέω). ὡς δόξα μονοκέρωτος αὐτῷ — как слава (великолепие) единорога у него (μονόκερως — 野牛; δόξα — «слава»; слав. «якоже слава единорога ему»). ἔδεται ἔθνη ἐχθρῶν αὐτοῦ — будет есть народы врагов его. τὰ πάχη αὐτῶν ἐκμυελιεῖ — «тук их выест до мозга» (πάχος — «тук, толщина»; ἐκμυελίζω — «вынимать мозг»; слав. «толщы их измождит»). ταῖς βολίσιν — стрелами (βολίς). κατατοξεύσει — поразит из лука (κατατοξεύω)."
  9: "κατακλιθεὶς ἀνεπαύσατο — лёг и почил (κατακλίνω, ἀναπαύω). ὡς λέων καὶ ὡς σκύμνος — как лев и как львёнок (σκύμνος — 獅子の子). τίς ἀναστήσει αὐτόν; — кто поднимет его? οἱ εὐλογοῦντές σε εὐλόγηνται — благословляющие тебя благословенны (perfect pass.). οἱ καταρώμενοί σε κεκατήρανται — проклинающие тебя прокляты. Формула повторяет 22:6 и Быт 12:3."
  10: "ἐθυμώθη Βαλακ ἐπὶ Βαλααμ — воспылал Валак на Валаама (θυμόω). συνεκρότησεν ταῖς χερσὶν αὐτοῦ — всплеснул руками (συγκροτέω — «ударять»; слав. «плесну руками»). Καταρᾶσθαι τὸν ἐχθρόν μου κέκληκά σε — я призвал тебя проклясть врага моего (καταράομαι). τρίτον τοῦτο — вот уже третий раз."
  11: "φεῦγε εἰς τὸν τόπον σου — беги в место твоё (φεύγω). εἶπα Τιμήσω σε — я сказал: «почту тебя» (прямая речь внутри — 『…』; слав. «рекох, почту тя»). ἐστέρησέν σε κύριος τῆς δόξης — лишил тебя Господь славы (στερέω — «лишать» + род.; слав. «лиши тя Господь славы»)."
  12: "Οὐχὶ καὶ τοῖς ἀγγέλοις σου … ἐλάλησα λέγων — не говорил ли я и послам твоим, говоря (ἄγγελος здесь — «посол»; 使者). οὓς ἀπέστειλας πρός με — которых ты послал ко мне."
  13: "Ἐάν μοι δῷ Βαλακ πλήρη τὸν οἶκον — если бы дал мне Валак полный дом (ἐάν + конъюнктив в нереальном условии). παραβῆναι τὸ ῥῆμα κυρίου — преступить слово Господа (παραβαίνω). πονηρὸν ἢ καλόν — злое или доброе (порядок LXX: сначала «злое»). παρ᾽ ἐμαυτοῦ — от себя самого. ὅσα ἐὰν εἴπῃ ὁ θεός, ταῦτα ἐρῶ — что скажет Бог, то и скажу."
  14: "ἀποτρέχω εἰς τὸν τόπον μου — ухожу в место моё (ἀποτρέχω). συμβουλεύσω σοι — посоветую тебе (συμβουλεύω). τί ποιήσει ὁ λαὸς οὗτος τὸν λαόν σου — что сделает этот народ твоему народу (двойной винительный). ἐπ᾽ ἐσχάτου τῶν ἡμερῶν — в последние дни (букв. «на последке дней»); отсюда «в последние дни» — пророческий горизонт."
  15: "Повтор 24:3 дословно: вторая притча начинается той же формулой (Φησὶν Βαλααμ …). Держимся LXX, не сокращая повтор."
  16: "ἀκούων λόγια θεοῦ — слышащий изречения Божии (ср. 4). ἐπιστάμενος ἐπιστήμην παρὰ ὑψίστου — знающий знание от Всевышнего (ἐπίσταμαι; ἐπιστήμη; ὕψιστος — いと高い方). ὅρασιν θεοῦ ἰδὼν ἐν ὕπνῳ — видевший видение Божие во сне. ἀποκεκαλυμμένοι οἱ ὀφθαλμοὶ αὐτοῦ — открыты глаза его."
  17: "Δείξω αὐτῷ — покажу ему (δείκνυμι). μακαρίζω — ублажаю, называю блаженным (μακαρίζω). ἀνατελεῖ ἄστρον ἐξ Ιακωβ — взойдёт звезда от Иакова (ἀνατέλλω; ἄστρον — 星). ἀναστήσεται ἄνθρωπος ἐξ Ισραηλ — восстанет человек от Израиля (слав. «востанет человек»; в масоретском тексте שֵׁבֶט — «жезл, скипетр», отсюда ru «жезл» и традиционное 王杖; держимся LXX — 人). θραύσει τοὺς ἀρχηγοὺς Μωαβ — сокрушит начальников (вождей) Моава (θραύω). προνομεύσει πάντας υἱοὺς Σηθ — разграбит всех сынов Сифа (Σηθ — セト)."
  18: "καὶ ἔσται Εδωμ κληρονομία — и будет Едом наследием (κληρονομία — 嗣業). καὶ ἔσται κληρονομία Ησαυ ὁ ἐχθρὸς αὐτοῦ — и будет наследием Исав, враг его (Ησαυ — エサウ; Едом = Исав; ru «Сеир» — по евр.). Ισραηλ ἐποίησεν ἐν ἰσχύι — Израиль сделал (явил) в силе (ἰσχύς; слав. «сотвори крепость»)."
  19: "ἐξεγερθήσεται ἐξ Ιακωβ — поднимется (восстанет) от Иакова (ἐξεγείρω). ἀπολεῖ σῳζόμενον ἐκ πόλεως — погубит спасающегося из города (σῴζω, pass. причастие; слав. «погубит спасаемаго от града»)."
  20: "ἰδὼν τὸν Αμαληκ — увидев Амалика (Αμαληκ — アマレク). Ἀρχὴ ἐθνῶν Αμαληκ — «начало народов Амалик» (ἀρχή — «начаток, первый»; слав. «начало языков»). τὸ σπέρμα αὐτῶν ἀπολεῖται — семя их погибнет (мн. ч. αὐτῶν при ед. ч. Αμαληκ — как в LXX)."
  21: "τὸν Καιναῖον — Кенеянина (Καιναῖος; евр. קֵינִי — кенеи; カイン人). Ἰσχυρὰ ἡ κατοικία σου — крепко жилище твоё (κατοικία). ἐὰν θῇς ἐν πέτρᾳ τὴν νοσσιάν σου — если положишь на скале гнездо твоё (τίθημι; νοσσιά — «гнездо»)."
  22: "ἐὰν γένηται τῷ Βεωρ νεοσσιὰ πανουργίας — если будет у Беора гнездо коварства (Βεωρ — ベオル; в евр. здесь, по-видимому, «Каин», ру «Каин»; πανουργία — «коварство»). Ἀσσύριοι σε αἰχμαλωτεύσουσιν — ассирийцы возьмут тебя в плен (αἰχμαλωτεύω; Ἀσσύριοι — アッスル人)."
  23: "Ὦ ὦ — «о, о» (горестный вопль; слав. «горе, горе»). ἰδὼν τὸν Ωγ — увидев Ога (Ωγ — オグ; в масоретском тексте имени нет, LXX вносит его; ru без имени). τίς ζήσεται, ὅταν θῇ ταῦτα ὁ θεός — кто будет жить, когда поставит это Бог (τίθημι)."
  24: "ἐξελεύσεται ἐκ χειρὸς Κιτιαίων — выйдет из руки Киттимов (Κιτιαῖοι — キティム人; слав. «китиейских»). κακώσουσιν Ασσουρ — озлобят (смирят) Ассура (κακόω). κακώσουσιν Εβραίους — озлобят Евреев (Εβραῖοι — ヘブライ人). ὁμοθυμαδὸν ἀπολοῦνται — вместе (единодушно) погибнут (ὁμοθυμαδόν)."
  25: "ἀναστὰς … ἀπῆλθεν ἀποστραφεὶς εἰς τὸν τόπον αὐτοῦ — встав, пошёл, возвратившись в место своё (ἀποστρέφω; слав. «отиде, возвратився на место свое»). Βαλακ ἀπῆλθεν πρὸς ἑαυτόν — Валак пошёл к себе (πρὸς ἑαυτόν — «к своим»)."
