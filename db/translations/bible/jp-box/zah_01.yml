# jp-box, Захария, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной.
# Граница глав 1/2: у слав. в 1-й главе 21 стих, во 2-й — 13; в gr-lxx-byz 1:1–17,
# 2:1–17, причём gr 2:1–4 (четыре рога и четыре плотника) = слав. 1:18–21.
# Здесь стихи 1–21 по слав.; ст. 18–21 переведены с gr 2:1–4 и в гл. 2 не дублируются.
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 дата и призвание; 2–6 «обратитесь ко Мне», отцы и прежние пророки;
# 7–17 первое ночное видение: муж на рыжем коне между тенистыми горами, кони и
# всадники, обход земли, молитва Ангела о Иерусалиме, ревность Господа о Сионе,
# «дом Мой созиждется», землемерная вервь; 18–21 четыре рога и четыре плотника.
# Голоса: 1 — рассказ; 2–6 — слово Господа в 「…」; 4 — слово прежних пророков
# в 『…』; 6 — ответ отцов в 『…』; 7–13 — рассказ и диалог с Ангелом; 14–17 — речь
# Ангела в 「…」 со словом Господа в 『…』 (два провозглашения, 14–16 и 17);
# 18–21 — рассказ и диалог.
# Термины: 万軍[ばんぐん]の主[しゅ] — κύριος παντοκράτωρ; 天使[てんし] — ἄγγελος;
# 測[はか]り縄[なわ] — σχοινίον γεωμετρικόν / μέτρον; 角[つの] — κέρας; 大工[だいく] — τέκτων.
#
tr_code: jp-box
book: zah
chapter: 1
draft: true

verses:
  1: "ダリウスの第二年[だいにねん]の第八[だいはち]の月[つき]、主[しゅ]の言葉[ことば]が、バラキヤの子[こ]、イドの子[こ]である預言者[よげんしゃ]ゼカリヤに臨[のぞ]んだ。"
  2: "「主[しゅ]はあなたがたの父[ちち]たちに、大[おお]きな怒[いか]りをもって怒[いか]られた。"
  3: "だから、彼らに言[い]え。『万軍[ばんぐん]の主[しゅ]はこう言[い]われる。わたしに帰[かえ]れ。そうすれば、わたしもあなたがたに帰[かえ]る、と万軍[ばんぐん]の主[しゅ]は言[い]われる』。"
  4: "あなたがたの父[ちち]たちのようになってはならない。彼らについて、かつての預言者[よげんしゃ]たちが責[せ]めて言[い]った。『万軍[ばんぐん]の主[しゅ]はこう言[い]われる。あなたがたの悪[わる]い道[みち]から、またあなたがたの悪[わる]い行[おこな]いから離[はな]れよ』と。しかし、彼らは聞[き]かず、耳[みみ]を傾[かたむ]けなかった、と主[しゅ]は言[い]われる。"
  5: "あなたがたの父[ちち]たちはどこにいるのか。預言者[よげんしゃ]たちは永遠[えいえん]に生[い]きるのか。"
  6: "しかし、わたしがわが霊[れい]によって、わがしもべである預言者[よげんしゃ]たちに命[めい]じたわたしの言葉[ことば]とわたしの定[さだ]めとを受[う]け入[い]れよ。それらはあなたがたの父[ちち]たちに及[およ]んだではないか。そして彼らは答[こた]えて言[い]った。『万軍[ばんぐん]の主[しゅ]がわたしたちの道[みち]と行[おこな]いに従[したが]ってなさろうと定[さだ]めたとおりに、そのとおりにわたしたちに成[な]された』と。」"
  7: "第十一[だいじゅういち]の月[つき]、すなわちシェバトの月[つき]の二十四日[にじゅうよっか]、ダリウスの第二年[だいにねん]に、主[しゅ]の言葉[ことば]が、バラキヤの子[こ]、イドの子[こ]である預言者[よげんしゃ]ゼカリヤに臨[のぞ]んだ。"
  8: "わたしは夜[よる]、見[み]た。見[み]よ、赤[あか]い馬[うま]に乗[の]った男[ひと]が、木陰[こかげ]の山[やま]々[やま]の間[あいだ]に立[た]っていた。そのうしろには、赤[あか]い馬[うま]、灰色[はいいろ]の馬[うま]、まだらの馬[うま]、白[しろ]い馬[うま]がいた。"
  9: "わたしは言[い]った。「主[しゅ]よ、これらは何[なん]ですか。」わたしのうちに語[かた]る天使[てんし]が言[い]った。「これらが何[なん]であるか、わたしがあなたに示[しめ]そう。」"
  10: "すると、山[やま]々[やま]の間[あいだ]に立[た]っている男[ひと]が答[こた]えて言[い]った。「これらは、主[しゅ]が地[ち]を行[い]き巡[めぐ]らせるために遣[つか]わした者[もの]たちである。」"
  11: "彼らは、山[やま]々[やま]の間[あいだ]に立[た]っている主[しゅ]の天使[てんし]に答[こた]えて言[い]った。「わたしたちは全[ぜん]地[ち]を行[い]き巡[めぐ]りました。見[み]よ、全[ぜん]地[ち]は人[ひと]が住[す]み、静[しず]かです。」"
  12: "主[しゅ]の天使[てんし]は答[こた]えて言[い]った。「万軍[ばんぐん]の主[しゅ]よ、あなたはいつまでエルサレムとユダの町[まち]々[まち]を憐[あわ]れまれないのですか。あなたがこれらを顧[かえり]みられずに、もう七十年目[ななじゅうねんめ]になるのですか。」"
  13: "主[しゅ]は、わたしのうちに語[かた]る天使[てんし]に、良[よ]い言葉[ことば]、慰[なぐさ]めの言葉[ことば]を答[こた]えられた。"
  14: "わたしのうちに語[かた]る天使[てんし]はわたしに言[い]った。「叫[さけ]んで言[い]え。『万軍[ばんぐん]の主[しゅ]はこう言[い]われる。わたしはエルサレムとシオンのために、大[おお]きな熱[ねつ]心[しん]をもって熱心[ねっしん]になった。"
  15: "わたしは、わたしに攻[せ]めかかってくる民[たみ]たちに、大[おお]きな憤[いきどお]りをもって怒[いか]っている。わたしが少[すこ]し怒[いか]ったとき、彼らは災[わざわ]いを加[くわ]えたからである。"
  16: "それゆえ、主[しゅ]はこう言[い]われる。わたしは憐[あわ]れみをもってエルサレムに帰[かえ]る。わたしの家[いえ]はその中[なか]に建[た]てられ、測[はか]り縄[なわ]がエルサレムの上[うえ]に張[は]られる、と万軍[ばんぐん]の主[しゅ]は言[い]われる』。"
  17: "もう一度[いちど]、叫[さけ]んで言[い]え。『万軍[ばんぐん]の主[しゅ]はこう言[い]われる。わたしの町[まち]々[まち]は再[ふたた]び良[よ]いもので満[み]ちる。主[しゅ]は再[ふたた]びシオンを慰[なぐさ]め、再[ふたた]びエルサレムを選[えら]ばれる』」と。"
  18: "わたしは目[め]を上[あ]げて見[み]た。見[み]よ、四[よっ]つの角[つの]があった。"
  19: "わたしは、わたしのうちに語[かた]る天使[てんし]に言[い]った。「これらは何[なん]ですか。」彼はわたしに言[い]った。「これらは、ユダとイスラエルとエルサレムを散[ち]らした角[つの]である。」"
  20: "主[しゅ]はわたしに四[よっ]人[にん]の大工[だいく]を示[しめ]された。"
  21: "わたしは言[い]った。「これらは何[なに]をしに来[き]たのですか。」彼は言[い]った。「あれらは、ユダを散[ち]らして、だれも頭[あたま]を上[あ]げられなくした角[つの]である。これらの大工[だいく]は、それを脅[おど]かすために来[き]た。すなわち、ユダの地[ち]に角[つの]を上[あ]げた民[たみ]たちの角[つの]を打[う]ち落[お]とし、それを散[ち]らすために。」"

notes:
  1: "ἐν τῷ ὀγδόῳ μηνὶ ἔτους δευτέρου ἐπὶ Δαρείου — «в восьмой месяц второго года при Дарии»; Βαραχιου… Αδδω — Варахия, Адда (バラキヤ, イド). Дарий — ダリウス, как в корпусе (Ездра)."
  2: "Ὠργίσθη… ὀργὴν μεγάλην — «прогневался гневом великим» (усиление); слав. «прогневася… гневом велиим»."
  3: "Ἐπιστρέψατε… ἐπιστραφήσομαι — «обратитесь… обращусь»; слав. дважды добавляет «глаголет Господь сил» (в LXX рефрен один раз в конце) — рефрен передан."
  4: "οἱ προφῆται οἱ ἔμπροσθεν — «прежние пророки»; ἐπιτηδευμάτων — «начинаний, дел»; слав. «не послушаша и не вняша» — «не послушали и не вняли»."
  5: "ποῦ εἰσιν… μὴ τὸν αἰῶνα ζήσονται — «где они? разве будут жить вечно?»; слав. «еда во век поживут»."
  6: "τὰ νόμιμά μου — «уставы Мои»; δέχεσθε — повелительное «принимайте»; κατελάβοσαν — «постигли, настигли» (слав. «постигнуша»); ответ отцов — 『…』."
  7: "τετράδι καὶ εἰκάδι τῷ ἑνδεκάτῳ μηνί… Σαβατ — 24-й день 11-го месяца, Шеват (シェバト); слав. «сават»."
  8: "ἀνὴρ ἐπιβεβηκὼς ἐπὶ ἵππον πυρρόν — «муж, сидящий на рыжем коне»; ἀνὰ μέσον τῶν δύο ὀρέων τῶν κατασκίων — «между двумя тенистыми горами» (слав. «осеняющими»); евр./ru «мирты» — не внесено, держим LXX/слав. Кони: πυρροί, ψαροί, ποικίλοι, λευκοί — рыжие, серые, пёстрые, белые (слав. «рыжы, сери, пестри, бели»)."
  9: "κύριε — обращение к Ангелу («господин мой»), передано 主よ; ὁ ἄγγελος ὁ λαλῶν ἐν ἐμοί — «Ангел, говорящий во мне»."
  10: "ὁ ἀνὴρ ὁ ἐφεστηκώς — «муж стоящий»; περιοδεῦσαι — «обойти»."
  11: "τῷ ἀγγέλῳ κυρίου — «Ангелу Господню»; κατοικεῖται καὶ ἡσυχάζει — «населена и покоится»."
  12: "ἕως τίνος — «доколе»; ἃς ὑπερεῖδες — «которые Ты презрел»; ἑβδομηκοστὸν ἔτος — «семидесятый год»."
  13: "ῥήματα καλὰ καὶ λόγους παρακλητικούς — «слова добрые и слова утешительные»; слав. «глаголголы» — опечатка вместо «глаголы»."
  14: "Ἐζήλωκα… ζῆλον μέγαν — «возревновал ревностью великою»; Ἀνάκραγε — «возопи, провозгласи»."
  15: "ἐπὶ τὰ ἔθνη τὰ συνεπιτιθέμενα — «на народы нападающие»; ἀνθ' ὧν… — «за то, что»; слав. «налегоша во злая» — «устремились на зло»."
  16: "ἐν οἰκτιρμῷ — «в милосердии, с жалостью»; μέτρον ἐκταθήσεται — «вервь протянется» (землемерная)."
  17: "Ἔτι διαχυθήσονται πόλεις ἐν ἀγαθοῖς — «ещё разольются города благами»; αἱρετιεῖ — «изберёт»."
  18: "Слав. 1:18 = gr 2:1 (начало главы в gr): τέσσαρα κέρατα — «четыре рога». В gr 1:18–21 пусто; граница глав иная, см. шапку."
  19: "Слав. 1:19 = gr 2:2; слав. добавляет «и Иерусалима» — нет в LXX, внесено (エルサレム); τὰ κέρατα τὰ διασκορπίσαντα — «рога, рассеявшие»."
  20: "Слав. 1:20 = gr 2:3; τέκτονας — «плотников» (слав. «древоделя»), 大工."
  21: "Слав. 1:21 = gr 2:4; κατέαξαν — «сокрушили»; ἐπαιρόμενα κέρας ἐπὶ τὴν γῆν κυρίου — «поднимающие рог на землю Господню»; слав. «на землю Господню», в ru «на землю Иуды» (МТ) — не внесено."
