# jp-box, Исаия, глава 40. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 40 нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 40: начало утешения — «утешайте народ Мой» (1–2), глас в пустыне (3–5),
# слово о траве и слове Божием (6–8), благовестник Сиона (9–11), несравнимость
# Господа: мера, совет, народы, идолы (12–20), «разве не знаете?» (21–24),
# «кому уподобите Меня?» (25), звёзды и «поднимите глаза в высоту» (26),
# ропот Иакова и ответ (27–31).
# Речи: слова Господа/гласа — 「…」 (1–2; 3–5; 6; 8; 25), слова народа — 「…」
# (27), реплика пророка внутри диалога (6) и весть благовестника (9) — тоже 「…」.
# Вводные формулы («говорит Бог», «сказал Святой») — вне кавычек.
# Нумерация по gr: 31 стих; у csl и ru тоже 31.
# Паритет: csl-добавки внесены без 〔…〕 — 40:14 «или кто прежде даде ему, и
# воздастся ему?»; в 40:10 csl переносит «се, Бог ваш» из конца 40:9 и удваивает
# «Господь, Господь» — держим деление gr (notes 9–10). 40:3–5 (цит. Мф 3:3,
# Лк 3:6) переведено буквально по LXX.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 天蓋, 天幕, いなご, 燔祭, 秤, 天秤, 鷲 уже в корпусе.
# Имена — транслитерация греческого (LXX).

