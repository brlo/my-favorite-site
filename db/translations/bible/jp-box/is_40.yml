verses:
  1: "「慰[なぐさ]めよ、慰[なぐさ]めよ、わたしの民[たみ]を」と、神[かみ]は言[い]われる。"
  2: "「祭司[さいし]たちよ、エルサレムの心[こころ]に語[かた]り、これを慰[なぐさ]めよ。彼女[かのじょ]の辱[はずかし]めは満[み]ち、彼女[かのじょ]の罪[つみ]は解[と]かれたからである。彼女[かのじょ]は主[しゅ]の手[て]から、そのすべての罪[つみ]に対して二倍[にばい]のものを受[う]け取[と]ったからである。」"
  3: "荒野[こうや]で叫[さけ]ぶ者[もの]の声[こえ]。「主[しゅ]の道[みち]を備[ととの]えよ。わたしたちの神[かみ]の道筋[みちすじ]をまっすぐにせよ。"
  4: "すべての谷[たに]は埋[う]められ、すべての山[やま]と丘[おか]は低[ひく]くされる。曲[ま]がった所[ところ]はすべてまっすぐに、険[けわ]しい所[ところ]は平[たい]らかな野[の]となる。"
  5: "主[しゅ]の栄光[えいこう]が現[あら]われ、すべての肉[にく]は神[かみ]の救[すく]いを見[み]る。主[しゅ]が語[かた]られたからである。」"
  6: "呼[よ]ばわる者[もの]の声[こえ]。「叫[さけ]べ。」わたしは言[い]った。「何[なに]を叫[さけ]ぼうか。」「すべての肉[にく]は草[くさ]、人[ひと]のすべての栄[えい]えは野[の]の草[くさ]の花[はな]のようである。"
  7: "草[くさ]は枯[か]れ、花[はな]は散[ち]った。"
  8: "しかし、わたしたちの神[かみ]の言葉[ことば]は永遠[えいえん]に立[た]つ。」"
  9: "高[たか]い山[やま]に上[のぼ]れ、シオンに良[よ]い知[し]らせをもたらす者[もの]よ。力[ちから]をこめて声[こえ]を上[あ]げよ、エルサレムに良[よ]い知[し]らせをもたらす者[もの]よ。声[こえ]を上[あ]げよ、恐[おそ]れるな。ユダの町[まち]々[まち]に言[い]え。「見[み]よ、あなたがたの神[かみ]である。」"
  10: "見[み]よ、主[しゅ]は力[ちから]を伴[ともな]って来[く]られ、その腕[うで]は支配[しはい]とともにある。見[み]よ、その報[むく]いはその方[かた]とともにあり、その働[はたら]きはその方[かた]の前[まえ]にある。"
  11: "彼[かれ]は羊飼[ひつじか]いのように自分[じぶん]の群[む]れを飼[か]い、その腕[うで]で小羊[こひつじ]たちを集[あつ]め、胸[むね]に抱[だ]く。身重[みおも]の母羊[ははひつじ]を慰[なぐさ]められる。"
  12: "だれが、手[て]で水[みず]を量[はか]り、指[ゆび]を広[ひろ]げた長[なが]さで天[てん]を測[はか]り、ひと握[にぎ]りで地[ち]を量[はか]ったのか。だれが、秤[はかり]で山[やま]を、天秤[てんびん]で丘[おか]を量[はか]ったのか。"
  13: "だれが主[しゅ]の心[こころ]を知[し]ったのか。だれがその助言者[じょげんしゃ]となって、主[しゅ]を教[おし]えたのか。"
  14: "主[しゅ]はだれと相談[そうだん]して、だれが主[しゅ]を悟[さと]らせたのか。だれが主[しゅ]に裁[さば]きを教[おし]え、だれが主[しゅ]に知識[ちしき]の道[みち]を教[おし]えたのか。だれが主[しゅ]に先[さき]に与[あた]えて、その返[かえ]しを求[もと]めたのか。"
  15: "見[み]よ、国[くに]々[ぐに]は桶[おけ]からの一滴[いってき]のしずくのように、秤[はかり]のわずかな傾[かたむ]きのように数[かぞ]えられ、つばのように見[み]なされる。"
  16: "レバノンは燃[も]やすのに足[た]りず、その獣[けもの]たちは燔祭[はんさい]に足[た]りない。"
  17: "すべての国[くに]々[ぐに]は、彼[かれ]の前[まえ]では無[む]に等[ひと]しく、何[なに]もないもの、空[むな]しいものとして数[かぞ]えられる。"
  18: "あなたがたは主[しゅ]をだれに似[に]せたのか。どんな似姿[にすがた]に主[しゅ]を似[に]せたのか。"
  19: "職人[しょくにん]が像[ぞう]を造[つく]ったのか。金細工[きんざいく]師[し]が金[きん]を溶[と]かしてこれに金[きん]をかぶせ、似姿[にすがた]に造[つく]り上[あ]げたのか。"
  20: "職人[しょくにん]は朽[く]ちない木[き]を選[えら]び、その像[ぞう]が揺[ゆ]るがないようにと、どう据[す]えるかを賢[かしこ]く考[かんが]える。"
  21: "あなたがたは悟[さと]らないのか。聞[き]かないのか。初[はじ]めからあなたがたに告[つ]げられなかったのか。地[ち]の基[もとい]を悟[さと]らなかったのか。"
  22: "地[ち]の円[えん]の上[うえ]に座[すわ]り、その上[うえ]に住[す]む者[もの]をいなごのように見[み]る方[かた]。天[てん]を天蓋[てんがい]のように据[す]え、住[す]まいの天幕[てんまく]のように広[ひろ]げた方[かた]。"
  23: "主[しゅ]は君主[くんしゅ]たちを、何[なに]もないものとして治[おさ]めさせ、地[ち]を何[なに]もないものとしてしまわれる。"
  24: "まことに、彼[かれ]らは植[う]えることも、蒔[ま]くこともなく、その根[ね]は地[ち]に根[ね]づくこともない。主[しゅ]が彼[かれ]らに息[いき]を吹[ふ]きかけると枯[か]れ、つむじ風[かぜ]が枯[か]れ枝[えだ]のように彼[かれ]らを吹[ふ]き去[さ]る。"
  25: "「では、あなたがたはわたしをだれに似[に]せたのか。だれによってわたしは高[たか]く上[あ]げられるというのか」と、聖[せい]なる方[かた]は言[い]われる。"
  26: "あなたがたは目[め]を高[たか]く上[あ]げて見[み]よ。だれがこれらを造[つく]ったのか。主[しゅ]は数[かず]に従[したが]ってその軍勢[ぐんぜい]を導[みちび]き出[だ]し、そのすべてを名[な]によって呼[よ]ばれる。その栄光[えいこう]の多[おお]さと、その力[ちから]の強[つよ]さにより、何[なに]一[ひと]つあなたに隠[かく]れてはいない。"
  27: "なぜ、ヤコブよ、あなたは言[い]うのか。イスラエルよ、あなたは語[かた]るのか。「わたしの道[みち]は神[かみ]から隠[かく]され、わたしの神[かみ]はわたしの裁[さば]きを取[と]り去[さ]って、去[さ]ってしまわれた」と。"
  28: "あなたは知[し]らないのか。聞[き]かなかったのか。地[ち]の果[は]てを造[つく]った永遠[えいえん]の神[かみ]、主[しゅ]は、飢[う]えることも、疲[つか]れることもない。その悟[さと]りを探[さぐ]り出[だ]すことはできない。"
  29: "主[しゅ]は飢[う]える者[もの]たちに力[ちから]を与[あた]え、苦[くる]しみのない者[もの]たちに悲[かな]しみを与[あた]えられる。"
  30: "若[わか]い者[もの]たちは飢[う]え、青年[せいねん]たちは疲[つか]れ、選[えら]ばれた者[もの]たちも力[ちから]を失[うしな]う。"
  31: "しかし、神[かみ]を待[ま]ち望[のぞ]む者[もの]たちは力[ちから]を新[あら]たにする。彼[かれ]らは鷲[わし]のように翼[つばさ]を生[は]やし、走[はし]っても疲[つか]れず、歩[あゆ]んでも飢[う]えない。"

notes:
  1: "Παρακαλεῖτε παρακαλεῖτε — удвоенный императив: «утешайте, утешайте»; τὸν λαόν μου — «народ Мой»; λέγει ὁ θεός — «говорит Бог» (в ru «Бог ваш» — по МТ, в гр и csl просто «Бог»). Формула «говорит Бог» стоит вне кавычек; речь обращена к вестникам утешения."
  2: "ἱερεῖς — «священники»: LXX читает здесь ἱερεῖς, в МТ слова «священники» нет (слав. «священницы» — то же чтение, сохранено); λαλήσατε εἰς τὴν καρδίαν — «говорите в сердце», т. е. ласково и внятно; ἐπλήσθη ἡ ταπείνωσις αὐτῆς — «исполнилось уничижение её» (ταπείνωσις); λέλυται αὐτῆς ἡ ἁμαρτία — «разрешён грех её» (λύω); ἐδέξατο … διπλᾶ τὰ ἁμαρτήματα αὐτῆς — «приняла вдвойне за грехи свои»."
  3: "φωνὴ βοῶντος ἐν τῇ ἐρήμῳ — «голос вопиющего в пустыне»; Ἑτοιμάσατε τὴν ὁδὸν κυρίου — «приготовьте путь Господу»; εὐθείας ποιεῖτε τὰς τρίβους — «прямыми делайте стези» (τρίβος — тропа). Цитируется в Мф 3:3; переведено буквально по LXX."
  4: "φάραγξ — дол, ущелье (谷); πληρωθήσεται — наполнится; ταπεινωθήσεται — понизится; τὰ σκολιὰ εἰς εὐθεῖαν — «кривое в прямое» (σκολιός); ἡ τραχεῖα εἰς πεδία — «шероховатое в равнины» (τραχύς; в слав. «острая в пути гладки» — иначе). Цитируется в Лк 3:5."
  5: "ὀφθήσεται ἡ δόξα κυρίου — «явится слава Господня»; ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ — «узрит всякая плоть спасение Божие» (цит. Лк 3:6); ὅτι κύριος ἐλάλησεν — «ибо Господь изрёк». Здесь закрывается речь гласа."
  6: "φωνὴ λέγοντος — «голос говорящего»; Βόησον — «воззови»; καὶ εἶπα Τί βοήσω — «и я сказал: что воззову?»; πᾶσα σὰρξ χόρτος — «всякая плоть — трава»; πᾶσα δόξα ἀνθρώπου ὡς ἄνθος χόρτου — «всякая слава человека — как цвет травы» (ἄνθος). Цитируется в 1 Пет 1:24."
  7: "ἐξηράνθη ὁ χόρτος — «иссохла трава» (ξηραίνω); τὸ ἄνθος ἐξέπεσεν — «цвет опал» (ἐκπίπτω). В ru добавлено «когда дунет на него дуновение Господа» — по МТ, в LXX и csl этого нет."
  8: "τὸ δὲ ῥῆμα τοῦ θεοῦ ἡμῶν — «слово же Бога нашего»; μένει εἰς τὸν αἰῶνα — «пребывает в век» (μένω). Цитируется в 1 Пет 1:25; здесь закрывается ответ."
  9: "ἐπ᾽ ὄρος ὑψηλὸν ἀνάβηθι — «взойди на гору высокую»; ὁ εὐαγγελιζόμενος Σιων — «благовествующий Сиону» (εὐαγγελίζομαι); ὕψωσον τῇ ἰσχύι τὴν φωνήν σου — «возвысь крепостью голос твой»; ὑψώσατε — форма мн. ч. при обращении в ед. ч. (сбой числа в оригинале, в японском не передаётся, отмечен здесь); μὴ φοβεῖσθε — «не бойтесь»; εἰπὸν ταῖς πόλεσιν Ιουδα — «скажи городам Иуды». Весть благовестника («вот Бог ваш») — в 「…」; csl переносит её в начало 40:10."
  10: "ἰδοὺ κύριος μετὰ ἰσχύος ἔρχεται — «вот Господь с силою идёт»; ὁ βραχίων μετὰ κυριείας — «мышца с владычеством» (κυριεία — 支配); ὁ μισθὸς αὐτοῦ μετ᾽ αὐτοῦ — «награда Его с Ним» (μισθός); τὸ ἔργον ἐναντίον αὐτοῦ — «дело Его пред Ним». Csl начинает стих с «се, Бог ваш» и удваивает «Господь, Господь» — деление и чтение иные, держим gr."
  11: "ὡς ποιμὴν ποιμανεῖ — «как пастырь упасёт» (ποιμαίνω); τῷ βραχίονι αὐτοῦ συνάξει ἄρνας — «мышцею Своею соберёт агнцев» (ἀρήν); ἐν γαστρὶ ἐχούσας παρακαλέσει — «имеющих во чреве утешит», т. е. суягных (в ru «водить дойных» — по МТ)."
  12: "ἐμέτρησεν τῇ χειρὶ τὸ ὕδωρ — «измерил рукою воду»; σπιθαμῇ — пядью (指を広げた長さ); δρακί — горстью (ひと握り; δράξ); ἔστησεν τὰ ὄρη σταθμῷ — «поставил горы на вес» (σταθμός); τὰς νάπας ζυγῷ — «лощины на весы» (ζυγός; νάπη — лощина, 谷). Риторические вопросы сохранены."
  13: "νοῦν κυρίου — «ум Господень» (νοῦς); σύμβουλος — советник; ὃς συμβιβᾷ αὐτόν — «который научает Его» (συμβιβάζω). Стих цитируется в Рим 11:34 и 1 Кор 2:16."
  14: "συνεβουλεύσατο — «советовался» (συμβουλεύομαι); συνεβίβασεν — «наставил»; κρίσιν — суд, решение (裁き); ὁδὸν συνέσεως — «путь разумения» (σύνεσις). Csl добавляет четвёртый вопрос «или кто прежде даде ему, и воздастся ему?» (ср. Рим 11:35) — внесён в текст без 〔…〕."
  15: "ὡς σταγὼν ἀπὸ κάδου — «как капля из ведра» (κάδος); ῥοπὴ ζυγοῦ — «наклон весов» (ῥοπή); ἐλογίσθησαν — «вменились» (λογίζομαι); ὡς σίελος — «как слюна» (σίελος; в ru «как порошинку» — по МТ, иное чтение; в слав. «плюновение» — как здесь)."
  16: "ὁ Λίβανος οὐχ ἱκανὸς εἰς καῦσιν — «Ливан недостаточен для сожжения»; τὰ τετράποδα — четвероногие, скот; ὁλοκάρπωσις — всесожжение (燔祭). Csl «дубрава ливанова» — «лес Ливанский» (передано именем レバノン)."
  17: "ὡς οὐδέν εἰσι — «как ничто они»; εἰς οὐθὲν ἐλογίσθησαν — «в ничто вменились». В ru по МТ добавлено «менее ничтожества и пустоты» — в LXX и csl этого нет."
  18: "τίνι ὡμοιώσατε κύριον — «кому уподобили Господа» (ὁμοιόω); ὁμοίωμα — подобие (似姿). Вопрос обращён к тем, кто делает идолов."
  19: "μὴ εἰκόνα ἐποίησεν τέκτων — «разве образ сделал плотник»: вопрос с μή подразумевает отрицательный ответ; χρυσοχόος — золотарь (金細工師); χωνεύσας — отлив (χωνεύω); περιεχρύσωσεν — позолотил (περιχρυσόω); ὁμοίωμα κατεσκεύασεν — «подобие устроил» (κατασκευάζω)."
  20: "ξύλον ἄσηπτον — «дерево негниющее» (ἄσηπτος); ἐκλέγεται — «избирает»; σοφῶς ζητεῖ — «мудро ищет»; πῶς στήσει — «как поставит»; ἵνα μὴ σαλεύηται — «чтобы не поколебался» (σαλεύω). Стих тёмный, передан близко к букве."
  21: "οὐ γνώσεσθε; οὐκ ἀκούσεσθε; — «не узнаете? не услышите?»; οὐκ ἀνηγγέλη ἐξ ἀρχῆς ὑμῖν — «не возвещено ли вам изначала» (ἀναγγέλλω); τὰ θεμέλια τῆς γῆς — «основания земли» (θεμέλιος). Четыре риторических вопроса сохранены."
  22: "ὁ κατέχων τὸν γῦρον τῆς γῆς — «держащий круг земли» (γῦρος); ὡς ἀκρίδες — «как саранча» (ἀκρίς, いなご); ὡς καμάραν τὸν οὐρανόν — «небо как свод» (καμάρα — сводчатый покой, 天蓋); διατείνας ὡς σκηνὴν κατοικεῖν — «распростёр, как скинию для обитания»."
  23: "ὁ διδοὺς ἄρχοντας εἰς οὐδὲν ἄρχειν — «дающий князей ни во что властвовать» (ἄρχω); τὴν γῆν ὡς οὐδὲν ἐποίησεν — «землю как ничто сотворил». Место тёмное; в ru по МТ иначе («обращает князей в ничто»), переведено по гр и слав."
  24: "οὐ γὰρ μὴ σπείρωσιν — «ибо не посеют» (усиленное отрицание); οὐδὲ μὴ φυτεύσωσιν — «и не посадят»; ῥιζωθῇ — «укоренится» (ῥιζόω); ἔπνευσεν ἐπ᾽ αὐτούς — «дохнул на них» (πνέω); καταιγίς — буря (つむじ風); φρύγανα — хворост, сучья (枯れ枝). В слав. «дхну на них ветр» — подлежащее «ветр»."
  25: "τίνι με ὡμοιώσατε — «кому вы уподобили Меня»; ὑψωθήσομαι — «вознесусь, буду возвышен»; εἶπεν ὁ ἅγιος — «сказал Святой» (聖なる方). Формула «сказал Святой» — вне кавычек."
  26: "ἀναβλέψατε εἰς ὕψος τοὺς ὀφθαλμοὺς ὑμῶν — «поднимите глаза ваши в высоту» (ἀναβλέπω); τίς κατέδειξεν πάντα ταῦτα — «кто показал всё это» (καταδείκνυμι); ὁ ἐκφέρων κατὰ ἀριθμὸν τὸν κόσμον αὐτοῦ — «выводящий по числу воинство Своё» (κόσμος здесь — строй, воинство); ἐπ᾽ ὀνόματι καλέσει — «по имени назовёт»; ἀπὸ πολλῆς δόξης καὶ ἐν κράτει ἰσχύος οὐδέν σε ἔλαθεν — «от многой славы и в державе крепости ничто не укрылось от тебя» (λανθάνω; место тёмное, передано буквально)."
  27: "Μὴ γὰρ εἴπῃς — «не говори же»; Ἀπεκρύβη ἡ ὁδός μου ἀπὸ τοῦ θεοῦ — «сокрыт путь мой от Бога» (ἀποκρύπτω); τὴν κρίσιν ἀφεῖλεν — «суд отнял» (ἀφαιρέω); καὶ ἀπέστη — «и отступил» (ἀφίστημι). Слова народа — в 「…」."
  28: "οὐκ ἔγνως εἰ μὴ ἤκουσας — «разве ты не узнал, разве не услышал» (оборот с εἰ μή); θεὸς αἰώνιος — «Бог вечный»; ὁ κατασκευάσας τὰ ἄκρα τῆς γῆς — «устроивший концы земли»; οὐ πεινάσει οὐδὲ κοπιάσει — «не взалчет и не утрудится» (LXX говорит о Боге «не взалчет» буквально; в ru «не утомляется и не изнемогает» — по МТ); ἐξεύρεσις τῆς φρονήσεως αὐτοῦ — «изобретение разума Его» (ἐξεύρεσις)."
  29: "διδοὺς τοῖς πεινῶσιν ἰσχύν — «дающий алчущим крепость»; τοῖς μὴ ὀδυνωμένοις λύπην — «неболезненным печаль» (ὀδυνάω — мучить; λύπη — печаль). Место тёмное; в ru по МТ «изнемогшему дарует крепость». Передано по гр и слав. без сглаживания."
  30: "πεινάσουσιν … νεώτεροι — «взалчут юнейшие»; κοπιάσουσιν νεανίσκοι — «утрудятся юноши»; ἐκλεκτοὶ ἀνίσχυες ἔσονται — «избранные не крепкими будут» (ἀνίσχυρος). Три члена сохранены."
  31: "οἱ ὑπομένοντες τὸν θεόν — «терпящие Бога», т. е. надеющиеся (ὑπομένω); ἀλλάξουσιν ἰσχύν — «изменят крепость», обновятся в силе (ἀλλάσσω); πτεροφυήσουσιν ὡς ἀετοί — «окрылатеют как орлы» (πτεροφυέω, ἀετός); δραμοῦνται καὶ οὐ κοπιάσουσιν — «потекут и не утрудятся»; βαδιοῦνται καὶ οὐ πεινάσουσιν — «пойдут и не взалчут» (в ru «не утомятся» — по МТ)."
