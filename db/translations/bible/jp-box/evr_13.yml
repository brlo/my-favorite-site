verses:
  1: "兄弟愛[きょうだいあい]は、いつまでも保[たも]ちなさい。"
  2: "旅人[たびびと]をもてなすことを忘[わす]れてはならない。それによって、気[き]づかずに天使[てんし]たちをもてなした人[ひと]たちがいるのである。"
  3: "囚[とら]われている者[もの]たちを、自分[じぶん]もともに囚[とら]われているかのように思[おも]い、苦[くる]しめられている者[もの]たちを、自分[じぶん]も同[おな]じ体[からだ]を持[も]つ者[もの]として思[おも]いなさい。"
  4: "結婚[けっこん]はすべての人[ひと]の間[あいだ]で尊[とうと]ばれ、寝床[ねどこ]は汚[けが]されてはならない。神[かみ]は、淫[いん]らな者[もの]と姦淫[かんいん]する者[もの]とを裁[さば]かれるからである。"
  5: "金銭[きんせん]を愛[あい]さないで、持[も]っているもので満足[まんぞく]しなさい。神[かみ]ご自身[じしん]が「わたしは決[けっ]してあなたを離[はな]れず、決[けっ]してあなたを見捨[みす]てない」と言[い]われたからである。"
  6: "だから、わたしたちは大胆[だいたん]にこう言[い]うことができる。「主[しゅ]はわたしの助[たす]け手[て]。わたしは恐[おそ]れない。人[ひと]がわたしに何[なに]をなし得[え]ようか。」"
  7: "あなたがたに神[かみ]の言葉[ことば]を語[かた]った指導者[しどうしゃ]たちを思[おも]い起[おこ]し、彼[かれ]らの生涯[しょうがい]の結末[けつまつ]をよく見[み]て、その信仰[しんこう]に倣[なら]いなさい。"
  8: "イエス・キリストは、昨日[きのう]も今日[きょう]も、いつまでも同[おな]じ方[かた]である。"
  9: "さまざまな、また異[こと]なった教[おし]えによって、引[ひ]き回[まわ]されてはならない。心[こころ]が{恵[めぐ]み|恩寵[おんちょう]}によって強[つよ]められるのが良[よ]いのであって、食物[しょくもつ]によるのではない。食物[しょくもつ]に従[したが]って歩[あゆ]んだ者[もの]たちは、益[えき]を受[う]けなかったのである。"
  10: "わたしたちには祭壇[さいだん]がある。幕屋[まくや]に仕[つか]える者[もの]たちは、そこから食[た]べる権利[けんり]を持[も]たない。"
  11: "というのは、大祭司[だいさいし]によって罪[つみ]のためにその血[ち]が聖所[せいしょ]に携[たずさ]え入れられる生[い]け物[もの]のからだは、宿営[しゅくえい]の外[そと]で焼[や]かれるからである。"
  12: "それゆえ、イエスも、ご自身[じしん]の血[ち]によって民[たみ]を聖[きよ]めるために、門[もん]の外[そと]で苦[くる]しみを受[う]けられたのである。"
  13: "したがって、わたしたちも、この方[かた]の辱[はずかし]めを負[お]って、宿営[しゅくえい]の外[そと]へ出[で]て行[ゆ]こう。"
  14: "というのは、わたしたちには、ここにいつまでも残[のこ]る都[みやこ]はないからである。わたしたちは、来[きた]るべき都[みやこ]を求[もと]めているのである。"
  15: "だから、わたしたちは、この方[かた]によって、絶[た]えず神[かみ]に賛美[さんび]のいけにえをささげよう。すなわち、その御名[みな]を告白[こくはく]する唇[くちびる]の実[み]である。"
  16: "善[よ]い行[おこな]いと施[ほどこ]しとを忘[わす]れてはならない。神[かみ]は、このようないけにえを喜[よろこ]ばれるのである。"
  17: "あなたがたの指導者[しどうしゃ]たちに従[したが]い、その言葉[ことば]に服[ふく]しなさい。彼[かれ]らは、あなたがたの魂[たましい]のために目[め]を覚[さ]ましているからである。やがて報告[ほうこく]を求[もと]められる者[もの]として、そうしているのである。彼[かれ]らが喜[よろこ]びをもってこのことを行[おこな]い、嘆[なげ]きながら行[おこな]わないようにしなさい。嘆[なげ]きながらでは、あなたがたの益[えき]にならないからである。"
  18: "わたしたちのために祈[いの]ってほしい。わたしたちは、正[ただ]しい良心[りょうしん]を持[も]っていると確信[かくしん]しているからである。すべてのことにおいて、立派[りっぱ]に歩[あゆ]みたいと願[ねが]っているのである。"
  19: "なお、いっそう強[つよ]く願[ねが]う。わたしが早[はや]くあなたがたのところへ戻[もど]されるように、祈[いの]ってほしい。"
  20: "平和[へいわ]の神[かみ]、すなわち、永遠[えいえん]の契約[けいやく]の血[ち]によって、羊[ひつじ]の大[おお]きな牧者[ぼくしゃ]であるわたしたちの主[しゅ]イエスを死者[ししゃ]の中[なか]から導[みちび]き上[あ]げられた方[かた]が、"
  21: "あなたがたを、あらゆる善[よ]い業[わざ]において、その御心[みこころ]を行[おこな]うために整[ととの]え、また、わたしたちのうちに、その方[かた]の御前[みまえ]に喜[よろこ]ばれるものを、イエス・キリストによって成[な]し遂[と]げてくださるように。栄光[えいこう]が、世々[よよ]限[かぎ]りなく、この方[かた]にあるように。アーメン。"
  22: "兄弟[きょうだい]たちよ、どうか、この勧[すす]めの言葉[ことば]を聞[き]き入[い]れてほしい。わたしはあなたがたに、手短[てみじか]に書[か]き送[おく]ったのである。"
  23: "わたしたちの兄弟[きょうだい]テモテが釈放[しゃくほう]されたことを知[し]ってほしい。彼[かれ]が早[はや]く来[く]れば、わたしは彼[かれ]と一緒[いっしょ]にあなたがたに会[あ]いたい。"
  24: "あなたがたの指導者[しどうしゃ]たちと、すべての聖[せい]なる者[もの]たちによろしく伝[つた]えてほしい。イタリアから来[き]た者[もの]たちが、あなたがたによろしくと言[い]っている。"
  25: "{恵[めぐ]み|恩寵[おんちょう]}が、あなたがたすべてとともにありますように。"

notes:
  1: "Ἡ φιλαδελφία μενέτω — 兄弟愛は、いつまでも保ちなさい; φιλαδελφία — 兄弟愛[きょうだいあい] (термин главы, ср. Рим 12:10). Настоящее время μενέτω — «пусть пребывает»."
  2: "τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε — 旅人をもてなすことを忘れてはならない; φιλοξενία — страннолюбие, 旅人[たびびと]をもてなすこと. διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους — それによって、気づかずに天使たちをもてなした人たちがいる; λανθάνω — «оставаться незамеченным», поэтому 気づかずに (Авраам, Быт 18; Лот, Быт 19)."
  3: "μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι — 囚われている者たちを、自分もともに囚われているかのように思いなさい; συνδέω — «быть связанным вместе». τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι — 苦しめられている者たちを、自分も同じ体を持つ者として; ἐν σώματι — «в теле», то есть в той же телесной жизни."
  4: "Τίμιος ὁ γάμος ἐν πᾶσιν — 結婚はすべての人の間で尊ばれ; τίμιος — «честной, досточтимый». ἡ κοίτη ἀμίαντος — 寝床は汚されてはならない; κοίτη — 寝床[ねどこ], ἀμίαντος — «неосквернённый». πόρνους γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός — 神は、淫らな者と姦淫する者とを裁かれる; πόρνος — 淫[いん]らな者, μοιχός — 姦淫[かんいん]する者 (термины главы)."
  5: "Ἀφιλάργυρος ὁ τρόπος — 金銭を愛さないで; ἀφιλάργυρος — «нелюбостяжательный», ὁ τρόπος — «нрав, образ поведения». ἀρκούμενοι τοῖς παροῦσιν — 持っているもので満足しなさい; ἀρκέω — «довольствоваться». Втор 31:6: Οὐ μή σε ἀνῶ οὐδ᾽ οὐ μή σε ἐγκαταλίπω — わたしは決してあなたを離れず、決してあなたを見捨てない; двойное οὐ μή передано повтором 決して. Цитата в 「…」."
  6: "ὥστε θαρροῦντας ἡμᾶς λέγειν — だから、わたしたちは大胆にこう言うことができる; θαρρέω — «дерзать». Пс 118:6: Κύριος ἐμοὶ βοηθός, [καὶ] οὐ φοβηθήσομαι — 主はわたしの助け手。わたしは恐れない; [καὶ] в базе есть. τί ποιήσει μοι ἄνθρωπος — 人がわたしに何をなし得ようか; цитата в 「…」."
  7: "Μνημονεύετε τῶν ἡγουμένων ὑμῶν — あなたがたの指導者たちを思い起こし; ἡγούμενοι — 指導者[しどうしゃ] (термин главы, ср. 13:17,24). οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ — あなたがたに神の言葉を語った. ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς — 彼らの生涯の結末をよく見て; ἔκβασις — «исход, конец», ἀναστροφή — «образ жизни». μιμεῖσθε τὴν πίστιν — その信仰に倣いなさい."
  8: "Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός — イエス・キリストは、昨日も今日も同じ方; ὁ αὐτός — «тот же», без глагола в греч. καὶ εἰς τοὺς αἰῶνας — いつまでも."
  9: "διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε — さまざまな、また異なった教えによって引き回されてはならない; παραφέρομαι — «увлекаться, быть уносимым». καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν — 心が恵みによって強められるのが良い; βεβαιόω — «утверждать» (ср. 2:3). οὐ βρώμασιν — 食物によるのではなく; βρῶμα — 食物[しょくもつ]. ἐν οἷς οὐκ ὠφελήθησαν οἱ περιπατοῦντες — それに従って歩んだ者たちは、益を受けなかった; ὠφελέω — «приносить пользу»."
  10: "ἔχομεν θυσιαστήριον — わたしたちには祭壇がある; θυσιαστήριον — 祭壇[さいだん] (термин книги, ср. 7:13). ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες — 幕屋に仕える者たちは、そこから食べる権利を持たない; σκηνή — 幕屋[まくや], λατρεύω — «служить»."
  11: "ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως — 大祭司によって罪のためにその血が聖所に携え入れられる生き物の; εἰσφέρω — «вносить». τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς — そのからだは宿営の外で焼かれる (Лев 4:12,21); παρεμβολή — 宿営[しゅくえい] (термин главы, ср. 13:13)."
  12: "διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν — イエスも、ご自身の血によって民を聖めるために. ἔξω τῆς πύλης ἔπαθεν — 門の外で苦しみを受けられた; πύλη — 門[もん], не «врата» города."
  13: "τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς — したがって、わたしたちも…宿営の外へ出て行こう; ἐξέρχομαι — «выходить». τὸν ὀνειδισμὸν αὐτοῦ φέροντες — この方の辱めを負って; ὀνειδισμός — ср. 10:33; 11:26."
  14: "οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν — ここにいつまでも残る都はない; μένουσαν — причастие от μένω, «пребывающий» (ср. 13:1 μενέτω). ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν — 来るべき都を求めている; ἐπιζητέω — ср. 11:14."
  15: "δι᾽ αὐτοῦ οὖν ἀναφέρωμεν θυσίαν αἰνέσεως — この方によって、絶えず神に賛美のいけにえをささげよう; ἀναφέρω — «возносить» (жертву), αἴνεσις — «хвала». διὰ παντός — 絶えず. καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ — その御名を告白する唇の実 (Ос 14:3); χεῖλος — 唇[くちびる]."
  16: "τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε — 善い行いと施しとを忘れてはならない; εὐποιΐα — «благодеяние», κοινωνία — «общение, разделение с нуждающимися», передано 施[ほどこ]し. τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός — 神は、このようないけにえを喜ばれる; εὐαρεστέω — ср. 11:5,6."
  17: "Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε — 指導者たちに従い、その言葉に服しなさい; ὑπείκω — «уступать, покоряться». αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν — 彼らは、あなたがたの魂のために目を覚ましている; ἀγρυπνέω — «бодрствовать». ὡς λόγον ἀποδώσοντες — やがて報告を求められる者として; λόγον ἀποδίδωμι — «давать отчёт». ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες — 喜びをもって行い、嘆きながら行わないように; στενάζω — «стенать». ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο — 嘆きながらでは、あなたがたの益にならない; ἀλυσιτελής — «неприбыльный, вредный»."
  18: "Προσεύχεσθε περὶ ἡμῶν — わたしたちのために祈ってください; περὶ ἡμῶν — «о нас», не «за нас» в смысле замещения. πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν — 正しい良心を持っていると確信している; πείθομαι — «быть уверенным». ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι — すべてのことにおいて、立派に歩みたいと願っている; ἀναστρέφομαι — «вести себя, жить»."
  19: "περισσοτέρως δὲ παρακαλῶ τοῦτο ποιῆσαι — なお、いっそう強くお願いする; περισσοτέρως — «тем более, усиленно». ἵνα τάχιον ἀποκατασταθῶ ὑμῖν — 早くあなたがたのところへ戻ることができるように; ἀποκαθίστημι — «восстанавливать, возвращать»."
  20: "Ὁ δὲ θεὸς τῆς εἰρήνης — 平和の神; формула благословения (ср. Рим 15:33). ὁ ἀναγαγὼν ἐκ νεκρῶν — 死者の中から導き上げられた; ἀνάγω — «возводить» (о воскресении, ср. Евр 13:20; Рим 10:7). τὸν ποιμένα τῶν προβάτων τὸν μέγαν — 羊の大きな牧者; ποιμήν — 牧者[ぼくしゃ] (ср. Еф 4:11), μέγας — 大きな. ἐν αἵματι διαθήκης αἰωνίου — 永遠の契約の血によって (Зах 9:11). τὸν κύριον ἡμῶν Ἰησοῦν — わたしたちの主イエス. Период 20–21 не дробится: сказуемое — καταρτίσαι (21)."
  21: "καταρτίσαι ὑμᾶς ἐν παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ — あなたがたを、あらゆる善い業において、その御心を行うために整え; καταρτίζω — «приводить в порядок, снаряжать» (ср. 11:3). ποιῶν ἐν ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ — わたしたちのうちに、その方の御前に喜ばれるものを成し遂げて; τὸ εὐάρεστον — «угодное». διὰ Ἰησοῦ Χριστοῦ — イエス・キリストによって. ᾧ ἡ δόξα εἰς τοὺς αἰῶνας [τῶν αἰώνων] — 栄光が、世々限りなく、この方にあるように; [τῶν αἰώνων] в базе есть, 〔…〕 не ставятся. ἀμήν — アーメン (в базе есть, поэтому без скобок, ср. Рим 16:27)."
  22: "Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί — 兄弟たちよ、どうか…; παρακαλῶ — «прошу, увещаю». ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως — この勧めの言葉を聞き入れてほしい; ἀνέχομαι — «принимать, терпеть», παράκλησις — 勧[すす]め (ср. 12:5). καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν — わたしはあなたがたに、手短に書き送った; διὰ βραχέων — «вкратце»."
  23: "Γινώσκετε τὸν ἀδελφὸν ἡμῶν Τιμόθεον ἀπολελυμένον — わたしたちの兄弟テモテが釈放されたことを知ってほしい; ἀπολύω — «освобождать» (perfect pass.). μεθ᾽ οὗ ἐὰν τάχιον ἔρχηται ὄψομαι ὑμᾶς — 彼が早く来れば、わたしは彼と一緒にあなたがたに会いたい; ἐάν + conj. — условие."
  24: "Ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους — あなたがたの指導者たちと、すべての聖なる者たちによろしく伝えてほしい; ἀσπάζομαι — «приветствовать». ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας — イタリアから来た者たちが、あなたがたによろしくと言っている."
  25: "ἡ χάρις μετὰ πάντων ὑμῶν — 恵みが、あなたがたすべてとともにありますように; заключительная формула (ср. Рим 16:20). В базе нет ἀμήν, не добавлено."
