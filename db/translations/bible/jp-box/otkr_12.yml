verses:
  1: "また、天[てん]に大[おお]きなしるしが現[あらわ]れた。太陽[たいよう]をまとった女[おんな]がいて、その足[あし]の下[した]には月[つき]があり、頭[あたま]には十二[じゅうに]の星[ほし]の冠[かんむり]をかぶっていた。"
  2: "女[おんな]は身[み]ごもっており、産[う]みの苦[くる]しみにあえぎ、叫[さけ]んでいた。"
  3: "また、天[てん]に別[べつ]のしるしが現[あらわ]れた。見[み]よ、大[おお]きな赤[あか]い龍[りゅう]がいて、七[なな]つの頭[あたま]と十[じゅう]の角[つの]があり、その頭[あたま]には七[なな]つの王冠[おうかん]をかぶっていた。"
  4: "その尾[お]は天[てん]の星[ほし]の三分[さんぶん]の一[いち]を引[ひ]きずり、地[ち]に投[な]げ落[お]とした。龍[りゅう]は、産[う]もうとしている女[おんな]の前[まえ]に立[た]ち、産[う]まれる子[こ]を食[た]べようとしていた。"
  5: "女[おんな]は男[おとこ]の子[こ]を産[う]んだ。この子[こ]は、鉄[てつ]の杖[つえ]で諸国[しょこく]の民[たみ]を治[おさ]める者[もの]である。その子[こ]は神[かみ]のもと、神[かみ]の御座[みくら]のもとへ引[ひ]き上[あ]げられた。"
  6: "女[おんな]は荒[あ]れ野[の]へ逃[に]げた。そこには、神[かみ]が備[そな]えておられた場所[ばしょ]があり、千二百六十日[せんにひゃくろくじゅうにち]の間[あいだ]、女[おんな]はそこで養[やしな]われることになっていた。"
  7: "天[てん]に戦[たたか]いが起[お]こった。ミカエルとその天使[てんし]たちが龍[りゅう]と戦[たたか]い、龍[りゅう]とその天使[てんし]たちも戦[たたか]ったが、"
  8: "勝[か]つことができず、天[てん]にはもはや彼[かれ]らの居場所[いばしょ]もなくなった。"
  9: "こうして、あの大[おお]きな龍[りゅう]、すなわち、昔[むかし]の蛇[へび]、悪魔[あくま]ともサタンとも呼[よ]ばれる者[もの]、全[ぜん]世界[せかい]を惑[まど]わす者[もの]が地[ち]に投[な]げ落[お]とされた。その天使[てんし]たちも一緒[いっしょ]に投[な]げ落[お]とされた。"
  10: "わたしは、天[てん]に大[おお]きな声[こえ]がして言[い]うのを聞[き]いた。「今[いま]、わたしたちの神[かみ]の救[すく]いと力[ちから]と国[くに]、そして、そのキリストの権威[けんい]が現[あらわ]れた。わたしたちの兄弟[きょうだい]たちを告発[こくはつ]し、昼[ひる]も夜[よる]もわたしたちの神[かみ]の御前[みまえ]で告発[こくはつ]していた者[もの]が、投[な]げ落[お]とされたからである。"
  11: "彼[かれ]らは、小羊[こひつじ]の血[ち]と、自分[じぶん]たちの証[あかし]の言葉[ことば]によって、龍[りゅう]に勝[か]った。彼[かれ]らは死[し]に至[いた]るまで自分[じぶん]の命[いのち]を愛[あい]さなかった。"
  12: "それゆえ、天[てん]と、そこに住[す]む者[もの]たちよ、喜[よろこ]べ。しかし、地[ち]と海[うみ]には災[わざわ]いがある。悪魔[あくま]が、自分[じぶん]の時[とき]が短[みじか]いことを知[し]って、大[おお]きな怒[いか]りを抱[いだ]いて、あなたがたのところへ下[くだ]って来[き]たからである。」"
  13: "龍[りゅう]は、自分[じぶん]が地[ち]に投[な]げ落[お]とされたのを見[み]て、男[おとこ]の子[こ]を産[う]んだ女[おんな]を追[お]いかけた。"
  14: "女[おんな]には、大[おお]きなワシの二[ふた]つの翼[つばさ]が与[あた]えられた。それで女[おんな]は荒[あ]れ野[の]へ飛[と]び、自分[じぶん]の場所[ばしょ]で、蛇[へび]の顔[かお]を避[さ]けて、一[いち]年[ねん]、二[に]年[ねん]、半[はん]年[ねん]の間[あいだ]、そこで養[やしな]われることになっていた。"
  15: "蛇[へび]は、女[おんな]の後[うしろ]に、自分[じぶん]の口[くち]から川[かわ]のような水[みず]を吐[は]き出[だ]して、女[おんな]を流[なが]し去[さ]ろうとした。"
  16: "しかし、地[ち]が女[おんな]を助[たす]け、地[ち]が口[くち]を開[ひら]いて、龍[りゅう]が口[くち]から吐[は]き出[だ]した川[かわ]を飲[の]み干[ほ]した。"
  17: "龍[りゅう]は女[おんな]に怒[いか]り、女[おんな]の残[のこ]りの子孫[しそん]、すなわち、神[かみ]の戒[いまし]めを守[まも]り、イエスの証[あかし]を保[たも]っている者[もの]たちと戦[たたか]おうとして、出[で]て行[い]った。"
  18: "そして、わたしは海[うみ]の砂[すな]の上[うえ]に立[た]った。"

notes:
  1: "σημεῖον μέγα — 大きなしるし. γυνὴ περιβεβλημένη τὸν ἥλιον — 太陽をまとった女. σελήνη ὑποκάτω τῶν ποδῶν — 足の下に月. στέφανος ἀστέρων δώδεκα — 十二の星の冠."
  2: "ἐν γαστρὶ ἔχουσα — 身ごもって. κράζει ὠδίνουσα — 産みの苦しみに叫ぶ; βασανιζομένη τεκεῖν — 産もうとして苦しむ."
  3: "δράκων πυρρὸς μέγας — 大きな赤い龍. κεφαλὰς ἑπτὰ καὶ κέρατα δέκα — 七つの頭と十の角. διαδήματα — 王冠 (не στέφανος)."
  4: "ἡ οὐρὰ αὐτοῦ σύρει — 尾が引きずる. τὸ τρίτον τῶν ἀστέρων — 星の三分の一. ἕστηκεν ἐνώπιον — 女の前に立つ. καταφάγῃ — 食べようとする."
  5: "υἱὸν ἄρσεν — 男の子. ποιμαίνειν … ἐν ῥάβδῳ σιδηρᾷ — 鉄の杖で治める. ἡρπάσθη — 引き上げられた (восхищен). πρὸς τὸν θρόνον αὐτοῦ — 御座のもとへ."
  6: "εἰς τὴν ἔρημον — 荒れ野へ. τόπον ἡτοιμασμένον ἀπὸ τοῦ θεοῦ — 神が備えた場所. τρέφωσιν — 養う; ἡμέρας χιλίας διακοσίας ἑξήκοντα — 千二百六十日."
  7: "πόλεμος ἐν τῷ οὐρανῷ — 天の戦い. Μιχαήλ — ミカエル. τοῦ πολεμῆσαι — 戦うために."
  8: "οὐκ ἴσχυσεν — 勝てなかった. τόπος … ἔτι — もはや居場所がない."
  9: "ὁ ὄφις ὁ ἀρχαῖος — 昔の蛇. Διάβολος καὶ ὁ Σατανᾶς — 悪魔、サタン. ὁ πλανῶν τὴν οἰκουμένην ὅλην — 全世界を惑わす者. ἐβλήθη — 投げ落とされた."
  10: "φωνὴν μεγάλην ἐν τῷ οὐρανῷ — 天の大きな声. ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία — 救いと力と国. ἐξουσία τοῦ Χριστοῦ — キリストの権威. ὁ κατήγωρ — 告発者; κατηγορῶν — 告発していた. Голос с неба — славословие в 「」, не красное."
  11: "διὰ τὸ αἷμα τοῦ ἀρνίου — 小羊の血によって. διὰ τὸν λόγον τῆς μαρτυρίας — 証しの言葉によって. οὐκ ἠγάπησαν τὴν ψυχὴν … ἄχρι θανάτου — 死に至るまで命を愛さなかった."
  12: "εὐφραίνεσθε, οὐρανοί — 天よ、喜べ. οὐαὶ τὴν γῆν καὶ τὴν θάλασσαν — 地と海には災い. ὀλίγον καιρόν — 短い時. θυμὸν μέγαν — 大きな怒り."
  13: "ἐδίωξεν — 追いかけた. ἥτις ἔτεκεν τὸν ἄρσενα — 男の子を産んだ女."
  14: "αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου — 大きなワシの二つの翼. καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ — 一年、二年、半年 (3,5 года). ἀπὸ προσώπου τοῦ ὄφεως — 蛇の顔を避けて."
  15: "ὕδωρ ὡς ποταμόν — 川のような水. ποταμοφόρητον ποιήσῃ — 流し去ろうとする."
  16: "ἐβοήθησεν ἡ γῆ — 地が助けた. κατέπιεν τὸν ποταμόν — 川を飲み干した."
  17: "ὠργίσθη … ἐπὶ τῇ γυναικί — 女に怒った. τῶν λοιπῶν τοῦ σπέρματος — 残りの子孫. τὰς ἐντολὰς τοῦ θεοῦ — 神の戒め. τὴν μαρτυρίαν Ἰησοῦ — イエスの証し."
  18: "καὶ ἐστάθη ἐπὶ τὴν ἄμμον τῆς θαλάσσης — 海の砂の上に立った. В gr-lxx-byz ἐστάθη (3 л.), в церковном тексте (TR, Синодальный, jp-joc) — 1 л. «я стал»; взято 1 л., 〔…〕 не ставятся: стих в базе есть, различие в окончании глагола."
