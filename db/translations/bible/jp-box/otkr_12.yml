# jp-box, Откровение Иоанна, глава 12. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 12: жена и дракон (1–6); война на небе и низвержение дракона (7–12);
# дракон преследует жену и её семя (13–18).
# Красного нет: 12:10–12 — громкий голос с неба, славословие, а не слова Христа;
# песнь в 「」, но не красная. <j>/<mo> не ставятся.
# 〔…〕 нет: 12:18 в gr-lxx-byz есть («καὶ ἐστάθη ἐπὶ τὴν ἄμμον τῆς θαλάσσης»), стих
# не обёрнут; в критическом тексте он иногда отсутствует, здесь стоит по базе.
# Сносок ⟨…⟩ нет: 龍, 女, 荒れ野, 獣 — обычные слова или уже в корпусе.
# jp-ni не использовался.

