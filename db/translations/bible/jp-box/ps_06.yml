verses:
  0: "指揮者[しきしゃ]に。賛美[さんび]のうちに。第八[だいはち]について。ダビデの詩[うた]。"
  1: "主[しゅ]よ、憤[いきどお]りをもってわたしを責[せ]めないでください。怒[いか]りをもってわたしを懲[こ]らさないでください。"
  2: "主[しゅ]よ、わたしをあわれんでください。わたしは弱[よわ]いからである。主[しゅ]よ、わたしをいやしてください。わたしの骨[ほね]は震[ふる]えている。"
  3: "わたしの魂[たましい]もひどく震[ふる]えている。主[しゅ]よ、あなたは、いつまでなのか。"
  4: "主[しゅ]よ、向[む]きを変[か]えて、わたしの魂[たましい]を救[すく]い出[だ]してください。あなたのあわれみのゆえに、わたしを救[すく]ってください。"
  5: "死[し]のうちには、あなたを覚[おぼ]えている者[もの]はいない。陰府[よみ]のうちで、だれがあなたをほめたたえるだろうか。"
  6: "わたしは呻[うめ]きによって疲[つか]れ果[は]てた。毎晩[まいばん]、わたしは寝床[ねどこ]を涙[なみだ]で洗[あら]い、敷布[しきふ]を涙[なみだ]で濡[ぬ]らす。"
  7: "わたしの目[め]は悲[かな]しみに衰[おとろ]え、わたしのすべての敵[てき]のゆえに古[ふる]びた。"
  8: "不法[ふほう]を行[おこな]うすべての者[もの]よ、わたしから離[はな]れよ。主[しゅ]はわたしの泣[な]き声[ごえ]を聞[き]かれたからである。"
  9: "主[しゅ]はわたしの願[ねが]いを聞[き]かれた。主[しゅ]はわたしの祈[いの]りを受[う]け入[い]れてくださった。"
  10: "わたしの敵[てき]はすべて恥[は]じ、ひどく震[ふる]えるように。向[む]きを変[か]えて退[しりぞ]き、たちまち大[おお]いに恥[は]じるように。"

notes:
  0: "Εἰς τὸ τέλος, ἐν ὕμνοις, ὑπὲρ τῆς ὀγδόης· ψαλμὸς τῷ Δαυιδ — 指揮者に。賛美のうちに。第八について。ダビデの詩 (ὕμνοι — «гимны»; ὑπὲρ τῆς ὀγδόης — «об осьмом», в церковнослав. «о осмом»; вероятно, восьмой глас или восьмиструнный инструмент — в переводе оставлено как 第八, без домысла). Надписание — стих 0."
  1: "Κύριε, μὴ τῷ θυμῷ σου ἐλέγξῃς με — 主よ、憤りをもってわたしを責めないでください (θυμός — 憤り, как в Пс 2:5; ἐλέγχω — «обличать»). μηδὲ τῇ ὀργῇ σου παιδεύσῃς με — 怒りをもってわたしを懲らさないでください (ὀργή — 怒り; παιδεύω — «наказывать, вразумлять»). Порядок θυμός/ὀργή сохранён."
  2: "ἐλέησόν με, κύριε, ὅτι ἀσθενής εἰμι — 主よ、わたしをあわれんでください、わたしは弱いからである (ἀσθενής — «немощный, бессильный»). ἴασαί με — いやしてください (ἰάομαι — «врачевать»). ὅτι ἐταράχθη τὰ ὀστᾶ μου — わたしの骨は震えている (ταράσσω — «потрясать, приводить в смятение»; ὀστᾶ — 骨)."
  3: "καὶ ἡ ψυχή μου ἐταράχθη σφόδρα — わたしの魂もひどく震えている (ψυχή — 魂; σφόδρα — «весьма»). καὶ σύ, κύριε, ἕως πότε — 主よ、あなたは、いつまで (вопрос без сказуемого, как в греч., не развёрнут в «доколе будешь медлить»)."
  4: "ἐπίστρεψον, κύριε — 主よ、向きを変えて (ἐπιστρέφω — «обращаться, возвращаться»). ῥῦσαι τὴν ψυχήν μου — わたしの魂を救い出してください (ῥύομαι — «избавлять»). σῶσόν με ἕνεκεν τοῦ ἐλέους σου — あなたのあわれみのゆえに、わたしを救ってください (ἕνεκεν — «ради»)."
  5: "οὐκ ἔστιν ἐν τῷ θανάτῳ ὁ μνημονεύων σου — 死のうちには、あなたを覚えている者はいない (μνημονεύω — «помнить»; мысль о шеоле как месте молчания). ἐν δὲ τῷ ᾅδῃ τίς ἐξομολογήσεταί σοι — 陰府のうちで、だれがあなたをほめたたえるだろうか (ᾅδης — 陰府; ἐξομολογέομαι — «исповедовать, славить», передано ほめたたえる, как по корпусу)."
  6: "ἐκοπίασα ἐν τῷ στεναγμῷ μου — わたしは呻きによって疲れ果てた (κοπιάω — «утомляться»; στεναγμός — 呻き). λούσω καθ᾽ ἑκάστην νύκτα τὴν κλίνην μου — 毎晩、わたしは寝床を涙で洗い (λούω — «омывать»; κλίνη — «ложе»). ἐν δάκρυσίν μου τὴν στρωμνήν μου βρέξω — 敷布を涙で濡らす (στρωμνή — «постель»; βρέχω — «мочить»)."
  7: "ἐταράχθη ἀπὸ θυμοῦ ὁ ὀφθαλμός μου — わたしの目は悲しみに衰え (букв. «смутился от ярости око мое»; θυμός здесь — ярость плача, горе; передано 悲しみ, ср. Синодальный «иссохло от печали»). ἐπαλαιώθην ἐν πᾶσιν τοῖς ἐχθροῖς μου — わたしのすべての敵のゆえに古びた (παλαιόω — «стареть, изнашиваться»)."
  8: "ἀπόστητε ἀπ᾽ ἐμοῦ, πάντες οἱ ἐργαζόμενοι τὴν ἀνομίαν — 不法を行うすべての者よ、わたしから離れよ. ὅτι εἰσήκουσεν κύριος τῆς φωνῆς τοῦ κλαυθμοῦ μου — 主はわたしの泣き声を聞かれたからである (κλαυθμός — «плач»)."
  9: "εἰσήκουσεν κύριος τῆς δεήσεώς μου — 主はわたしの願いを聞かれた (δέησις — «прошение»). κύριος τὴν προσευχήν μου προσεδέξατο — 主はわたしの祈りを受け入れてくださった (προσδέχομαι — «принимать»)."
  10: "αἰσχυνθείησαν καὶ ταραχθείησαν σφόδρα πάντες οἱ ἐχθροί μου — わたしの敵はすべて恥じ、ひどく震えるように (αἰσχύνομαι — «стыдиться»; оптатив 3 л. передан 〜ように). ἀποστραφείησαν καὶ καταισχυνθείησαν σφόδρα διὰ τάχους — 向きを変えて退き、たちまち大いに恥じるように (διά τάχους — «скоро, тотчас»)."
