# jp-box, Псалтирь, псалом 6. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 6: первый покаянный — обличение и наказание (1), немощь и исцеление (2–3),
# просьба о возвращении (4), память о смерти и шеоле (5), слёзы и изнеможение (6–7),
# удаление делающих беззаконие (8), услышанная молитва (9), посрамление врагов (10).
# Слова Бога и Христа не звучат; красного и синего нет. Прямой речи нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ в этом псалме нет; διάψαλμα не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 陰府, 魂, 骨 уже в корпусе.
# jp-ni не использовался.

