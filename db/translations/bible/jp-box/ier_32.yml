# jp-box, Иеремия, глава 32. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc этой главы не имеет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 32 — чаша гнева (в слав./ru это 25:15–38). ВАЖНО: в gr-lxx-byz глава 32
# состоит из 38 строк, но строки 1–12 и 14 — «точки» (`.`), т. е. в модуле их нет;
# ст. 13 — заголовок «Ὅσα ἐπροφήτευσεν Ιερεμιας ἐπὶ πάντα τὰ ἔθνη» («что изрёк
# Иеремия на все народы»), тоже не стих оракула. Настоящая LXX-глава 32 — 24 стиха
# (ср. gr-lxx-swete ier 32). Поэтому ст. 1–14 опущены по решению для книги
# (в jp_box_check добавлено исключение ot_gaps для ier 32:1–14), файл содержит только
# ст. 15–38. Ключ 15 = LXX 32:1. В notes — на 15..38.
# План: 15–16 «возьми из руки Моей чашу вина неразбавленного» и «будут пить и
# беситься»; 17–26 пророк берёт чашу и перечисляет народы (Иерусалим, Египет,
# филистимляне, Едом, Моав, Аммон, Тир, Сидон, Дедан, Феман, Рос, Аравия, Елам,
# Персия, все цари востока, Сасак); 27–29 «пейте, упивайтесь, изблюйте» — суд
# начинается с города, на котором наречено имя Господне; 30–33 глас Господень с
# высоты, суд над всякой плотью, поражённые от края до края; 34–38 плач пастырей,
# «оставил, как лев, жилище своё».
# Голоса: 15–16 — 「…」 (слово Господа; формула «так говорит Господь» вне кавычек);
# 17–26 — авторский рассказ пророка о том, как он взял чашу (первое лицо, но это
# не прямая речь в кавычках, ср. is 1:9–10); 27–38 — 「…」 (слово Господа пророку,
# вводные формулы внутри речи кавычек не разрывают); закрывается в конце 38.
# Нумерация: gr 32:15–38 = слав./ru 25:15–38, номер в номер (слав. 25:1–14 — то,
# чего в LXX нет; опущены вместе с лакуной). Стихи не добавлялись, не делились.
# 〔…〕 нет; сносок ⟨…⟩ нет: 杯, 酔う, 刈る, 粗布 уже в корпусе, пояснения — в notes.
# Имена — транслитерация греческого (LXX): ファラオ, アスカロン, ガザ, アッカロン,
# アゾト, エドム, モアブ, アンモン, ツロ, シドン, デダン, テマン, ロス, エラム,
# ペルシア, セサク (в слав. «сесах»; криптограмма Вавилона — см. notes 26).

