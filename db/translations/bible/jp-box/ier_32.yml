verses:
  15: "イスラエルの神[かみ]である主[しゅ]はこう言[い]われた。「わたしの手[て]から、この混[ま]ぜ物[もの]のないぶどう酒[ぶどうしゅ]の杯[さかずき]を取[と]り、わたしがあなたを遣[つか]わすすべての民[たみ]に飲[の]ませよ。"
  16: "彼らは飲[の]み、吐[は]き出[だ]し、わたしが彼らの間[あいだ]に送[おく]る剣[つるぎ]のゆえに狂[くる]う。」"
  17: "そこで、わたしは主[しゅ]の手[て]から杯[さかずき]を取[と]り、主がわたしを遣[つか]わしたすべての民[たみ]に飲[の]ませた。"
  18: "すなわち、エルサレムとユダの町々[まちまち]、その王[おう]たちと君[きみ]たちである。これらを荒[あ]れ果[は]てたものとし、通[とお]り過[す]ぎる者[もの]のない所[ところ]、口笛[くちぶえ]の的[まと]とし、呪[のろ]いとするためである。"
  19: "エジプトの王[おう]ファラオとそのしもべたち、その貴族[きぞく]たち、そのすべての民[たみ]、"
  20: "その混血[こんけつ]の者[もの]たちすべて、ウツの地[ち]の王[おう]たちすべて、異邦[いほう]人[じん]の王たちすべて、すなわちアスカロン、ガザ、アッカロン、またアゾトの残[のこ]りの者[もの]たち、"
  21: "エドム、モアブ、アンモンの子[こ]らたち、"
  22: "ツロの王[おう]たちすべて、シドンの王たち、海[うみ]の向[む]こう側[がわ]にいる王たち、"
  23: "デダン、テマン、ロス、またもみあげを剃[そ]ったすべての者[もの]たち、"
  24: "アラビアの王[おう]たちすべて、荒野[こうや]に住[す]む混血[こんけつ]の者[もの]たちすべて、"
  25: "ジムブリの王[おう]たちすべて、エラムの王たちすべて、ペルシアの王たちすべて、"
  26: "東[ひがし]からの王[おう]たちすべて、遠[とお]い者[もの]も近[ちか]い者[もの]も、互[たがい]に兄弟[きょうだい]ごとに、また地[ち]の面[おもて]にあるすべての国[くに]々[ぐに]である。セサクの王[おう]は彼[かれ]らの後[あと]に飲[の]む。"
  27: "「あなたは彼らに言[い]え。全能者[ぜんのうしゃ]なる主[しゅ]はこう言[い]われる。飲[の]め。酔[よ]え。吐[は]き出[せ]。倒[たお]れて、二度[にど]と起[お]き上[あ]がるな。わたしがあなたがたの間[あいだ]に送[おく]る剣[つるぎ]のゆえに。"
  28: "彼らがあなたの手[て]から杯[さかずき]を受[う]けて飲[の]むことを望[のぞ]まないなら、あなたは彼らに言[い]え。主[しゅ]はこう言[い]われる。あなたがたは必[かなら]ず飲[の]むからである。"
  29: "わたしの名[な]がその上[うえ]に呼[よ]ばれた町[まち]で、わたしは災[わざわ]いを下[くだ]し始[はじ]める。まして、あなたがたは罰[ばつ]を免[まぬが]れられない。わたしは地[ち]に住[す]むすべての者[もの]の上[うえ]に剣[つるぎ]を呼[よ]び寄[よ]せるからである、と全能者[ぜんのうしゃ]なる主[しゅ]は言[い]われる。"
  30: "あなたは彼らに対して、このすべての言葉[ことば]を預言[よげん]して言[い]え。主[しゅ]は高[たか]い所[ところ]から裁[さば]きを行[おこな]い、その聖[せい]なる所[ところ]から声[こえ]を出[だ]される。自分[じぶん]の住[す]まいの上[うえ]に言葉を語[かた]られる。ぶどうを踏[ふ]む者[もの]たちのように、彼らは答[こた]える。そして、地[ち]に住[す]むすべての者[もの]の上[うえ]に、"
  31: "滅[ほろ]びが地[ち]の一方[いっぽう]に来[き]た。主[しゅ]は諸[しょ]民[みん]の間[あいだ]で裁[さば]きを行[おこな]われるからである。主はすべての肉[にく]なる者[もの]と裁[さば]き合[あ]う。不敬[ふけい]な者[もの]たちは剣[つるぎ]に渡[わた]された、と主[しゅ]は言[い]われる。"
  32: "主[しゅ]はこう言[い]われる。見[み]よ、災[わざわ]いは民[たみ]から民へと進[すす]み、大[おお]きな嵐[あらし]が地[ち]の果[は]てから出[で]て来[く]る。"
  33: "主[しゅ]に打[う]たれた者[もの]たちが、主[しゅ]の日[ひ]に、地[ち]の端[はし]から地の端まで横[よこ]たわる。彼らは嘆[なげ]かれもせず、集[あつ]められもせず、葬[ほうむ]られもしない。地[ち]の面[おもて]の肥[こや]しとなる。"
  34: "羊飼[ひつじか]いたちよ、叫[さけ]べ。雄羊[おひつじ]たちよ、泣[な]き叫[さけ]べ。あなたがたの日[ひ]は屠[ほふ]りのために満[み]ち、あなたがたは選[えら]ばれた雄羊[おひつじ]のように倒[たお]れるからである。"
  35: "羊飼[ひつじか]いからは逃[に]げる道[みち]が、雄羊[おひつじ]たちからは救[すく]いが失[うしな]われる。"
  36: "羊飼[ひつじか]いの叫[さけ]び、羊[ひつじ]たちと雄羊[おひつじ]たちの声[こえ]がする。主[しゅ]が彼らの牧[まき]場[ば]を滅[ほろ]ぼしたからである。"
  37: "平[へい]和[わ]の残[のこ]りも、わたしの憤[いきどお]りと怒[いか]りのゆえに止[や]む。"
  38: "主[しゅ]は獅子[しし]のように自分[じぶん]の住[す]まいを捨[す]てた。彼らの地[ち]は、大[おお]いなる剣[つるぎ]のゆえに人[ひと]の住[す]まない所[ところ]となったからである。」"

notes:
  15: "Ключ 15 = LXX 32:1 (в слав./ru 25:15). ЛАКУНА МОДУЛЯ: в gr-lxx-byz стихи 32:1–12 и 14 стоят «точками» (`.`), ст. 13 — заголовок к оракулам о народах («Ὅσα ἐπροφήτευσεν Ιερεμιας ἐπὶ πάντα τὰ ἔθνη»), а не стих оракула. Настоящая LXX-глава 32 — 24 стиха, поэтому эти 14 строк опущены (стихи не добавлены и не разделены), файл начинается с 15 = LXX 32:1. Οὕτως εἶπεν κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев», формула вне кавычек. τὸ ποτήριον τοῦ οἴνου τοῦ ἀκράτου — «чаша вина неразбавленного» (ἄκρατος — несмешанный, неразбавленный); слав. «чашу вина нераствореннаго». ποτιεῖς — «напоишь»."
  16: "πίονται καὶ ἐξεμοῦνται καὶ μανήσονται — «будут пить, изблюют и обезумеют» (ἐξεμέω — извергать, выблёвывать; μαίνομαι — безумствовать); слав. «испиют и изблюют, и обуяют». ἀπὸ προσώπου τῆς μαχαίρας — «от лица меча», т. е. при виде меча. ἧς ἐγὼ ἀποστέλλω ἀνὰ μέσον αὐτῶν — «который Я посылаю между ними». Здесь закрывается слово Господа, открытое в 15."
  17: "καὶ ἔλαβον τὸ ποτήριον ἐκ χειρὸς κυρίου — «и взял я чашу из руки Господней»: первое лицо пророка, но это рассказ о действии, а не прямая речь, поэтому без кавычек (ср. is 1:9–10). ἐπότισα — «напоил». Слав. «вся языки» — «все народы», в тексте すべての民. Дальше 18–26 — один перечень, продолжающий этот стих."
  18: "τὴν Ιερουσαλημ καὶ τὰς πόλεις Ιουδα — «Иерусалим и города Иуды»; βασιλεῖς Ιουδα καὶ ἄρχοντας αὐτοῦ — «царей Иуды и князей его» (αὐτοῦ — сбой рода, «его/её»). τοῦ θεῖναι αὐτὰς εἰς ἐρήμωσιν — «чтобы положить их в опустошение»; εἰς ἄβατον — «в непроходимое»; εἰς συριγμὸν — «в свист (посвист)», т. е. в предмет изумления и насмешки проходящих; слав. «во звиздание». Слав. добавляет «и в проклятие, яко день сей» — по МТ; «呪い» внесено в текст без скобок, «как день сей» — нет (временная глосса)."
  19: "τὸν Φαραω βασιλέα Αἰγύπτου — «фараона, царя Египетского»; παῖδες — слуги; μεγιστᾶνες — вельможи, знатные (слав. «вельможы»). Перечень идёт без глагола, как в греч."
  20: "τοὺς συμμίκτους αὐτοῦ — «смешанный народ его» (σύμμικτος — смешанный, разнородный); слав. «примесники». βασιλεῖς ἀλλοφύλων — «царей иноплеменников» (ἀλλόφυλοι — филистимляне). Ἀσκαλων, Γαζα, Ακκαρων, τὸ ἐπίλοιπον Ἀζώτου — Аскалон, Газа, Аккарон, остаток Азота. Слав. добавляет «вся цари земли ус» — по МТ, внесено в текст без скобок (ウツの地の王たち)."
  21: "Ιδουμαία — Идумея (エドム по имени народа); Μωαβῖτις — Моавитида (земля Моава); υἱοὺς Αμμων — «сыны Аммона»."
  22: "βασιλεῖς Τύρου καὶ βασιλεῖς Σιδῶνος — «цари Тира и цари Сидона»; βασιλεῖς τοὺς ἐν τῷ πέραν τῆς θαλάσσης — «цари, которые за морем» (о островах и прибрежье). Слав. «т¦рски» — дефект набора (знак на месте буквы)."
  23: "Δαιδαν, Θαιμαν, Ρως — Дедан, Феман, Рос (слав. «дедана и фемана, и роса»); πᾶν περικεκαρμένον κατὰ πρόσωπον αὐτοῦ — «всякий остриженный по лицу своему», т. е. со срезанными волосами на висках (арабские племена, ср. 9:26; 25:23); слав. «остриженаго по лицу его»."
  24: "συμμίκτους τοὺς καταλύοντας ἐν τῇ ἐρήμῳ — «смешанные народы, живущие в пустыне» (καταλύω — жить, располагаться); слав. «смесники обитающыя в пустыни». Слав. добавляет «вся цари аравии» — по МТ, внесено в текст без скобок (アラビアの王たちすべて)."
  25: "Αιλαμ — Елам; Περσῶν — «персов» (слав. «персския»). Слав. добавляет «вся цари замврийския» (Зимврия, МТ 25:25) — нет в LXX, внесено в текст без скобок (ジムブリの王たち)."
  26: "ἀπὸ ἀπηλιώτου — «от востока» (ἀπηλιώτης — восточный ветер, восток); τοὺς πόρρω καὶ τοὺς ἐγγύς — «дальних и близких»; ἕκαστον πρὸς τὸν ἀδελφὸν αὐτοῦ — «каждого к брату его», т. е. одного за другим, по соседству. Слав. добавляет «и царь сесах испиет последи их» — по МТ; Сасак (סֵסַךְ) — криптограмма Вавилона (ср. 51:41; евр. атбаш), имя оставлено транслитерацией и в тексте, и в notes."
  27: "Πίετε καὶ μεθύσθητε καὶ ἐξεμέσατε — «пейте, опьянейте, изблюйте»; πεσεῖσθε καὶ οὐ μὴ ἀναστῆτε — «падёте и не встанете» (двойное отрицание — усиленное «никогда»). ἀπὸ προσώπου τῆς μαχαίρας — «от лица меча». Формулы «так говорит Господь» внутри речи кавычек не разрывают: говорит тот же Господь."
  28: "ἐὰν μὴ βούλωνται δέξασθαι τὸ ποτήριον — «если не захотят принять чашу»; ὥστε πιεῖν — «чтобы пить». Πιόντες πίεσθε — букв. «пьющие пейте», гебраизм усиления: «непременно будете пить» (слав. «пиюще пийте»)."
  29: "ἐν πόλει, ἐν ᾗ ὠνομάσθη τὸ ὄνομά μου ἐπ' αὐτήν — «в городе, на котором наречено имя Моё» (об Иерусалиме, ср. 3 Цар 8:43); ἐγὼ ἄρχομαι κακῶσαι — «Я начинаю озлоблять (наводить бедствие)». καθάρσει οὐ μὴ καθαρισθῆτε — «очищением не очиститесь», т. е. никаким очищением не избежите кары; слав. «очищением не очиститеся». μάχαιραν ἐγὼ καλῶ — «меч Я призываю»."
  30: "χρηματιεῖ — «возвестит, изречёт» (χρηματίζω — давать оракул, возвещать); ἀφ' ὑψηλοῦ — «с высоты»; ἀπὸ τοῦ ἁγίου αὐτοῦ δώσει φωνὴν αὐτοῦ — «от святыни Своей даст голос Свой». λόγον χρηματιεῖ ἐπὶ τοῦ τόπου αὐτοῦ — «слово возвестит на месте Своём». αιδαδ ὥσπερ τρυγῶντες ἀποκριθἤσονται — «хедад, как собирающие виноград, ответят», т. е. ответят криком, как при топтании винограда (евр. הֵידָד, ср. 32:33); слав. «сии же яко о‹емлюще виноград отвещают». Слав. добавляет в конце «и на вся седящыя на земли прииде пагуба» — этот член по греч. открывает ст. 31; раздел держим по gr, смысл един (в 30 конец фразы, в 31 начало)."
  31: "ἥκει ὄλεθρος ἐπὶ μέρος τῆς γῆς — «пришла погибель на часть земли»; κρίσις τῷ κυρίῳ ἐν τοῖς ἔθνεσιν — «суд Господу (у Господа) с народами»; κρίνεται αὐτὸς πρὸς πᾶσαν σάρκα — «судится Он со всякой плотью» (πρός — «против, с»); οἱ δὲ ἀσεβεῖς ἐδόθησαν εἰς μάχαιραν — «нечестивые же преданы мечу». Слав. «судитися имать той со всякою плотию»."
  32: "κακὰ ἔρχεται ἀπὸ ἔθνους ἐπὶ ἔθνος — «бедствия идут от народа на народ»; λαῖλαψ μεγάλη — «буря великая» (λαῖλαψ — вихрь, буря); ἐκπορεύεται ἀπ' ἐσχάτου τῆς γῆς — «исходит от конца земли»."
  33: "τραυματίαι ὑπὸ κυρίου — «поражённые (раненые) Господом» (τραυματίας — раненый, сражённый); ἐν ἡμέρᾳ κυρίου — «в день Господень»; ἐκ μέρους τῆς γῆς καὶ ἕως εἰς μέρος τῆς γῆς — «от края земли и до края земли». οὐ μὴ κατορυγῶσιν — «не будут погребены» (κατορύσσω — закапывать); εἰς κόπρια — «в навоз» (κόπριον — навоз, сор); слав. «в гной». Слав. добавляет «не оплачутся, ниже соберутся» — нет в LXX, внесено в текст без скобок."
  34: "ἀλαλάξατε, ποιμένες — «воскликните, пастыри» (ἀλαλάζω — кричать, вопить); κόπτεσθε, οἱ κριοὶ τῶν προβάτων — «плачьте (бейте себя), овны стада» (κρίος — баран, овен); ἐπληρώθησαν αἱ ἡμέραι ὑμῶν εἰς σφαγήν — «исполнились дни ваши для заклания». πεσεῖσθε ὥσπερ οἱ κριοὶ οἱ ἐκλεκτοί — «падёте, как овны избранные»; слав. «якоже овни избраннии»."
  35: "ἀπολεῖται φυγὴ ἀπὸ τῶν ποιμένων — «погибнет бегство от пастырей», т. е. некуда будет бежать; σωτηρία ἀπὸ τῶν κριῶν — «спасение от овнов». Слав. «изгибнет бегство от пастухов и спасение от овнов овчих»."
  36: "φωνὴ κραυγῆς τῶν ποιμένων — «голос вопля пастырей»; ἀλαλαγμὸς τῶν προβάτων καὶ τῶν κριῶν — «вопль овец и овнов»; ὠλόθρευσεν κύριος τὰ βοσκήματα αὐτῶν — «истребил Господь пастбища их» (βόσκημα — пастбище, а также скот); слав. «пажити их»."
  37: "παύσεται τὰ κατάλοιπα τῆς εἰρήνης — «прекратится остаток мира», т. е. умолкнут и последние мирные места (κατάλοιπος — остающийся); ἀπὸ προσώπου ὀργῆς θυμοῦ μου — «от лица ярости гнева Моего» (ὀργή и θυμός — два слова гнева, оба сохранены). Слав. «останцы мира от лица ярости гнева Господня» — при местоимении «Господня» вместо «Моего», в тексте по греч."
  38: "ἐγκατέλιπεν ὥσπερ λέων κατάλυμα αὐτοῦ — «оставил, как лев, жилище своё» (κατάλυμα — жилище, пристанище): Господь покинул Своё жилище, как лев логово. ἐγενήθη ἡ γῆ αὐτῶν εἰς ἄβατον — «земля их стала непроходимой (безлюдной)»; ἀπὸ προσώπου τῆς μαχαίρας τῆς μεγάλης — «от лица меча великого». Слав. «виталище свое»."
