verses:
  1: "ユダの王[おう]ゼデキヤの第十年[だいじゅうねん]、すなわち、バビロンの王[おう]ネブカドネツァルの第十八年[だいじゅうはちねん]に、主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]は、次[つぎ]のとおりである。"
  2: "その時[とき]、バビロンの王[おう]の軍[ぐん]はエルサレムを包囲[ほうい]し、エレミヤは王[おう]の家[いえ]にある牢[ろう]の庭[にわ]に閉[と]じ込[こ]められていた。"
  3: "ゼデキヤ王[おう]は彼をそこに閉じ込めて言[い]った。「なぜ、あなたは預言[よげん]して言[い]うのか。『主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの都[みやこ]をバビロンの王[おう]の手[て]に渡[わた]す。彼はそれを取[と]る。"
  4: "ユダの王[おう]ゼデキヤはカルデア人[じん]の手から救[すく]われない。彼は必[かなら]ずバビロンの王の手に渡[わた]され、口[くち]と口を合[あ]わせて語[かた]り、目[め]と目を合[あ]わせる。"
  5: "ゼデキヤはバビロンに入[はい]り、わたしが彼を顧[かえり]みるまでそこにいる、と主[しゅ]は言[い]われる。あなたがたがカルデア人と戦[たたか]っても、何[なに]も成功[せいこう]しない。』」"
  6: "エレミヤは言[い]った。主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  7: "「見[み]よ、あなたの父[ちち]の兄弟[きょうだい]であるシャルムの子[こ]ハナメエルが、あなたのもとへ来[き]て、『アナトトにあるわたしの畑[はたけ]を買[か]え。あなたがそれを買[か]い取[と]る権利[けんり]があるからである』と言[い]う。」"
  8: "そこで、父[ちち]の兄弟の子[こ]ハナメエルが、主[しゅ]の言葉[ことば]のとおりに、牢[ろう]の庭[にわ]にいるわたしのもとへ来[き]て言[い]った。「アナトトにあるわたしの畑[はたけ]を、ベニヤミンの地[ち]で買い取ってください。あなたに買い取る権利があり、あなたが年長[ねんちょう]だからです。」そこでわたしは、これが主の言葉であることを知[し]った。"
  9: "わたしは父[ちち]の兄弟の子[こ]ハナメエルから、アナトトにある畑[はたけ]を買い取り、彼に銀[ぎん]十七[じゅうなな]シケルを量[はか]って渡[わた]した。"
  10: "わたしは書[しょ]に記[しる]し、封印[ふういん]し、証人[しょうにん]たちに立[た]ち会[あ]わせ、銀[ぎん]を天秤[てんびん]で量[はか]った。"
  11: "わたしは、封印された売買[ばいばい]の書[しょ]と、開[ひら]かれた書とを取[と]った。"
  12: "そして、それをネリヤの子[こ]、マアセヤの孫[まご]であるバルクに、父[ちち]の兄弟の子[こ]ハナメエルの目の前[まえ]で、また売買の書に署名[しょめい]した証人[しょうにん]たちの目の前で、牢[ろう]の庭[にわ]に座[すわ]っているすべてのユダヤ人[じん]の目の前で渡[わた]した。"
  13: "わたしは彼らの目の前でバルクに命[めい]じて言[い]った。"
  14: "「万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。この売買[ばいばい]の書[しょ]と、開[ひら]かれた書とを取[と]り、土[つち]の器[うつわ]に入[い]れよ。長[なが]い日[ひ]の間[あいだ]保[たも]たれるためである。"
  15: "まことに、万軍の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。『この地[ち]で再[ふたた]び、家[いえ]と畑[はたけ]とぶどう畑[ばたけ]が買[か]われる。』」"
  16: "わたしは、売買[ばいばい]の書[しょ]をネリヤの子[こ]バルクに渡[わた]した後[あと]、主[しゅ]に祈[いの]って言[い]った。"
  17: "「ああ、主[しゅ]よ。あなたは大[おお]きな力[ちから]と高[たか]く上[あ]げた腕[うで]をもって、天[てん]と地[ち]を造[つく]られた。あなたに隠[かく]れるものは何[なに]もない。"
  18: "あなたは千代[せんだい]にいたるまであわれみを行[おこな]い、父[ちち]たちの罪[つみ]をその子[こ]どもたちのふところに報[むく]いられる。大[おお]きく強[つよ]い神[かみ]よ。"
  19: "大[おお]いなる計[はか]らいの主[しゅ]、その業[わざ]に強[つよ]い方[かた]、大[おお]きな神[かみ]、万軍[ばんぐん]の主[しゅ]、大[おお]いなる名[な]の主[しゅ]よ。あなたの目[め]は人[ひと]の子[こ]らすべての道[みち]に注[そそ]がれ、それぞれにその道[みち]に応[おう]じて報[むく]いられる。"
  20: "あなたはエジプトの地[ち]で、今日[こんにち]にいたるまでしるしと不思議[ふしぎ]を行[おこな]い、イスラエルの中でも、地[ち]に生[う]まれた者[もの]たちの間[あいだ]でも行って、今日のように、ご自分[じぶん]のために名[な]を立[た]てられた。"
  21: "あなたはしるしと不思議[ふしぎ]と、強[つよ]い手[て]と高[たか]く上[あ]げた腕[うで]と、大[おお]きな幻[まぼろし]とによって、あなたの民[たみ]イスラエルをエジプトの地[ち]から連[つ]れ出[だ]された。"
  22: "あなたは彼[かれ]らにこの地[ち]を与[あた]えられた。父祖[ふそ]たちに誓[ちか]って約束[やくそく]された、乳[ちち]と蜜[みつ]の流[なが]れる地[ち]である。"
  23: "彼らはそこに入[はい]り、それを手[て]に入[い]れたが、あなたの声[こえ]に聞[き]き従[したが]わず、あなたの掟[おきて]のうちを歩[あゆ]まなかった。あなたが彼らに命[めい]じたすべてを行[おこな]わず、それゆえ、あなたはこのすべての災[わざわ]いを彼らの上[うえ]に降[ふ]りかけられた。"
  24: "見[み]よ、軍勢[ぐんぜい]はこの都[みやこ]を取[と]るために来[き]ている。都は剣[つるぎ]と飢饉[ききん]と疫病[えきびょう]のゆえに、攻[せ]めているカルデア人[じん]の手[て]に渡[わた]されようとしている。あなたが語[かた]られたとおりになり、あなたはそれを見[み]ておられる。"
  25: "主[しゅ]よ、あなたはわたしに『銀[ぎん]で畑[はたけ]を買[か]え、証人[しょうにん]を立[た]てよ』と言[い]われた。わたしは書[しょ]を記[しる]し、封印[ふういん]し、証人を立てた。しかし、都[みやこ]はカルデア人[じん]の手に渡されている。」"
  26: "すると、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  27: "「見[み]よ、わたしはすべての肉[にく]なる者[もの]の神[かみ]である主[しゅ]。わたしから隠[かく]れるものがあろうか。"
  28: "それゆえ、主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの都[みやこ]をバビロンの王[おう]の手[て]に渡[わた]す。王はそれを取[と]る。"
  29: "カルデア人[じん]はこの都[みやこ]に攻[せ]め上[のぼ]って来[き]て、これを火[ひ]で焼[や]き、屋根[やね]の上[うえ]でバアルに香[こう]をたき、ほかの神々[かみがみ]に注[そそ]ぎ物[もの]をして、わたしを怒[いか]らせた家[いえ]々[いえ]を焼[や]き払[はら]う。"
  30: "イスラエルの子[こ]らとユダの子らは、若[わか]い時[とき]から、わたしの目の前[まえ]で悪[あく]だけを行[おこな]ってきたからである。イスラエルの子らは、自分[じぶん]の手[て]の業[わざ]でわたしを怒らせてきた、と主[しゅ]は言[い]われる。"
  31: "この都[みやこ]は、建[た]てられた日[ひ]から今日[こんにち]まで、わたしの怒[いか]りと憤[いきどお]りの的[まと]となってきた。わたしの顔[かお]からこれを退[しりぞ]けるために。"
  32: "それは、イスラエルの子[こ]らとユダの子らが行[おこな]ったすべての悪[あく]のゆえである。彼らも、その王[おう]たちも、その君[きみ]たちも、その貴族[きぞく]たちも、その祭司[さいし]たちも、その預言者[よげんしゃ]たちも、ユダの人[ひと]も、エルサレムに住[す]む者[もの]も、わたしを怒[いか]らせた。"
  33: "彼らはわたしに背[せ]を向[む]け、顔[かお]を向けなかった。わたしが朝[あさ]早[はや]くから彼らを教[おし]えても、彼らは懲[こ]らしめを受[う]け入[い]れようとしなかった。"
  34: "彼らは自分[じぶん]の忌[い]まわしいもの[もの]を、わたしの名[な]が呼[よ]ばれている家[いえ]に、その汚[けが]れのうちに置[お]いた。"
  35: "彼らはベン・ヒンノムの谷[たに]にバアルの祭壇[さいだん]を建[た]て、自分[じぶん]の息子[むすこ]や娘[むすめ]を火[ひ]の中[なか]を通[とお]らせてモロクに献[ささ]げた。わたしはこれを命[めい]じたこともなく、この忌[い]まわしいことを行[おこな]ってユダに罪[つみ]を犯[おか]させるとは、心[こころ]に思[おも]いもしなかった。"
  36: "今[いま]、イスラエルの神[かみ]である主[しゅ]は、あなたがたが『剣[つるぎ]と飢饉[ききん]と疫病[えきびょう]によってバビロンの王[おう]の手[て]に渡[わた]される』と言[い]うこの都[みやこ]について、こう言[い]われる。"
  37: "見[み]よ、わたしは彼[かれ]らを、怒[いか]りと憤[いきどお]りと大[おお]きな激怒[げきど]のうちに散[ち]らしたすべての地[ち]から集[あつ]め、この場所[ばしょ]に連[つ]れ戻[もど]し、安[あん]心[しん]して住[す]まわせる。"
  38: "彼らはわたしの民[たみ]、わたしは彼らの神[かみ]となる。"
  39: "わたしは彼らに別[べつ]の道[みち]と別の心[こころ]を与[あた]え、彼らとその後の子[こ]らが、いつもわたしを恐[おそ]れるようにする。彼らのためにも、その後の子らのためにも善[よ]いこととなるために。"
  40: "わたしは彼らと永遠[えいえん]の契約[けいやく]を結[むす]び、それを彼らから取[と]り去[さ]らない。わたしは彼らに善[よ]いことを行[おこな]い、わたしの恐[おそ]れを彼らの心[こころ]に与[あた]えて、わたしから離[はな]れないようにする。"
  41: "わたしは彼らを幸[しあわ]せにしようと彼らを顧[かえり]み、この地[ち]に真実[しんじつ]をもって、心[こころ]を尽[つ]くし、魂[たましい]を尽くして彼らを植[う]える。"
  42: "主[しゅ]はこう言[い]われる。わたしがこの民[たみ]にこのすべての大[おお]きな災[わざわ]いを降[ふ]りかけたように、そのようにわたしは、彼らに語[かた]ったすべての良[よ]いことを彼らの上[うえ]に降りかける。"
  43: "この地[ち]で、あなたが『人[ひと]も家畜[かちく]もいない荒[あ]れ地[ち]であり、カルデア人[じん]の手[て]に渡[わた]された』と言[い]うその地で、再[ふたた]び畑[はたけ]が買[か]われる。"
  44: "人々[ひとびと]は銀[ぎん]で畑を買[か]い、書[しょ]に記[しる]して封印[ふういん]し、証人[しょうにん]を立[た]てる。ベニヤミンの地[ち]でも、エルサレムの周[まわ]りでも、ユダの都[みやこ]々[みやこ]でも、山[やま]の都々でも、低[ひく]い地[ち]の都々でも、南[みなみ]の都々でも。わたしは彼らの捕囚[ほしゅう]を帰[かえ]らせるからである、と主[しゅ]は言[い]われる。」"

notes:
  1: "Ὁ λόγος ὁ γενόμενος παρὰ κυρίου πρὸς Ιερεμιαν — «слово, бывшее от Господа к Иеремии»; ἐν τῷ ἐνιαυτῷ τῷ δεκάτῳ τῷ βασιλεῖ Σεδεκια — «в десятый год царю Седекии» (дательный при βασιλεῖ); οὗτος ἐνιαυτὸς ὀκτωκαιδέκατος τῷ βασιλεῖ Ναβουχοδονοσορ — «этот год — восемнадцатый царю Навуходоносору» (десятый год Седекии = 18-й Навуходоносора, ср. 4 Цар 25:8). Слав. «в десятое лето седекии… то лето осмоенадесять навуходоносору». Дата согласуется с 4 Цар 25 и Иер 52."
  2: "δύναμις βασιλέως Βαβυλῶνος — «сила (войско) царя Вавилонского» (δύναμις — войско); ἐχαράκωσεν ἐπὶ Ιερουσαλημ — «обложил Иерусалим укреплением» (χαρακόω — обносить частоколом, 包囲する); ἐφυλάσσετο ἐν αὐλῇ τῆς φυλακῆς — «содержался во дворе стражи» (φυλάσσω — стеречь; αὐλή — двор; в тексте 牢の庭); ἥ ἐστιν ἐν οἴκῳ τοῦ βασιλέως — «который при доме царя». Слав. «острог обложи окрест Иерусалима, иеремиа же стегомь бяше во дворе темничнем»."
  3: "Διὰ τί σὺ προφητεύεις λέγων — «зачем ты пророчествуешь, говоря»: слова Седекии — 「…」, внутри них слово Господа — 『…』 (3–5). Οὕτως εἶπεν κύριος — «так говорит Господь»; Ἰδοὺ ἐγὼ δίδωμι τὴν πόλιν ταύτην ἐν χερσὶν βασιλέως Βαβυλῶνος — «вот, Я отдаю город сей в руки царя Вавилонского»; λήμψεται αὐτήν — «он возьмёт его» (λαμβάνω). Слав. «почто ты прорицаеши, глаголя: тако рече Господь: се, аз даю сей град в руце царя вавилонска»."
  4: "Σεδεκιας οὐ μὴ σωθῇ ἐκ χειρὸς τῶν Χαλδαίων — «Седекия не спасётся от руки Халдеев» (Χαλδαῖοι — カルデア人); παραδόσει παραδοθήσεται — «преданием предастся» (dat. cognatus: усиленное «непременно предан будет»); λαλήσει στόμα αὐτοῦ πρὸς στόμα αὐτοῦ — «уста его будут говорить с устами его», т. е. лицом к лицу; οἱ ὀφθαλμοὶ αὐτοῦ τοὺς ὀφθαλμοὺς αὐτοῦ ὄψονται — «глаза его увидят глаза его». Повторы греч. сохранены."
  5: "εἰσελεύσεται Σεδεκιας εἰς Βαβυλῶνα καὶ ἐκεῖ καθιεῖται — «войдёт Седекия в Вавилон и там сядет» (καθέζομαι — сидеть, оставаться); ἕως… ἐπισκέψομαι αὐτόν — «доколе не посещу его» (ἐπισκέπτομαι — посетить, вспомнить); ἐὰν… πολεμῆτε… οὐδὲν μὴ εὐοδωθῆτε — «если будете воевать, ничего не успеете» (εὐοδόω — иметь успех; в тексте 何も成功しない). Слав. «аще же воевати будете на халдеи, ничесоже успеете». Обе цитаты закрываются."
  6: "καὶ λόγος κυρίου ἐγενήθη πρὸς Ιερεμιαν λέγων — «и было слово Господне к Иеремии, говоря»: вводная формула, слово Господа начинается в 39:7. Слав. добавляет «И рече иеремиа» («И сказал Иеремия») — нет в LXX, внесено без скобок (エレミヤは言った)."
  7: "Ἀναμεηλ υἱὸς Σαλωμ ἀδελφοῦ πατρός σου — «Анамеил, сын Салома, брата отца твоего», т. е. двоюродный дядя (ἀδελφὸς πατρός — дядя; в тексте 父の兄弟); ハナメエル, シャルム — транслитерация LXX. Κτῆσαι σεαυτῷ τὸν ἀγρὸν μου — «купи себе поле моё» (κτάομαι — приобретать, покупать; ἀγρός — поле, 畑). σοὶ κρίμα παραλαβεῖν εἰς κτῆσιν — «тебе право принять во владение» (κρίμα здесь — право, ср. слав. «суд ужичества», т. е. право родственного выкупа): речь Анамеила — 『…』. Слав. «аиамеил, сын саломль, брата отца твоего»."
  8: "ἦλθεν πρός με… εἰς τὴν αὐλὴν τῆς φυλακῆς — «пришёл ко мне… во двор стражи»; ἐν γῇ Βενιαμιν τὸν ἐν Αναθωθ — «в земле Вениамина, в Анафофе» (Анатот — город левитов в земле Вениамина); ὅτι σοὶ κρίμα κτήσασθαι — «ибо тебе право купить»; σὺ πρεσβύτερος — «ты старший» (πρεσβύτερος — старший по возрасту/праву, 年長). ἔγνων ὅτι λόγος κυρίου ἐστίν — «я узнал, что это слово Господне». Слав. добавляет «по словеси Господню» — нет в LXX, внесено без скобок (主の言葉のとおりに)."
  9: "ἐκτησάμην τὸν ἀγρόν — «я купил поле»; ἔστησα αὐτῷ ἑπτὰ σίκλους καὶ δέκα ἀργυρίου — «отвесил ему семь сиклей и десять серебра» (ἵστημι — ставить на весы, отвешивать; σίκλος — сикль, シケル). Слав. «поставих ему седмьнадесять сикль сребра» — «семнадцать сикелей серебра» (слав. складывает 7+10; ср. МТ «семнадцать сиклей»); в тексте по csl 十七シケル, вариант LXX отмечен здесь."
  10: "ἔγραψα εἰς βιβλίον — «я записал в книгу» (βιβλίον — свиток, документ; в тексте 書); ἐσφραγισάμην — «запечатал» (σφραγίζω, 封印); διεμαρτυράμην μάρτυρας — «призвал свидетелей» (διαμαρτύρομαι — свидетельствовать, призывать в свидетели; μάρτυς — свидетель, 証人); ἔστησα τὸ ἀργύριον ἐν ζυγῷ — «положил серебро на весы» (ζυγός здесь — весы, 天秤). Слав. «вписах в книгу и запечатах, и засвидетелствовах послухи и поставих сребро на весах»."
  11: "ἔλαβον τὸ βιβλίον τῆς κτήσεως τὸ ἐσφραγισμένον καὶ τὸ ἀνεγνωσμένον — «я взял книгу приобретения, запечатанную и прочитанную» (ἀναγινώσκω — читать; ἀνεγνωσμένον — прочитанное, т. е. открытый экземпляр). Слав. «И взях книгу купления прочтену и запечатану». В тексте 封印された書と、開かれた書 (ср. ru «запечатанную… и открытую»)."
  12: "ἔδωκα αὐτὸ τῷ Βαρουχ υἱῷ Νηριου υἱοῦ Μαασαιου — «отдал её Варуху, сыну Нирии, сына Маасеи» (バルク, ネリヤ, マアセヤ — транслитерация); κατ᾽ ὀφθαλμοὺς Αναμεηλ — «на глазах Анамеила» (κατ᾽ ὀφθαλμούς — в присутствии); τῶν ἑστηκότων καὶ γραφόντων ἐν τῷ βιβλίῳ τῆς κτήσεως — «стоявших и подписавших книгу приобретения» (γράφω — подписывать); τῶν Ιουδαίων τῶν ἐν τῇ αὐλῇ τῆς φυλακῆς — «Иудеев, бывших во дворе стражи». Слав. «пред очима… стоящих послух и вписавших в книги купления»."
  13: "καὶ συνέταξα τῷ Βαρουχ κατ᾽ ὀφθαλμοὺς αὐτῶν λέγων — «и заповедал я Варуху в глазах их, говоря» (συντάσσω — приказывать, заповедовать). Слав. «И завещах варуху пред очима их, глаголя». Далее — прямая речь Иеремии (39:14–15)."
  14: "Λαβὲ τὸ βιβλίον τῆς κτήσεως τοῦτο — «возьми эту книгу приобретения»; τὸ βιβλίον τὸ ἀνεγνωσμένον — «книгу прочитанную (открытую)»; θήσεις αὐτὸ εἰς ἀγγεῖον ὀστράκινον — «положи её в глиняный сосуд» (ἀγγεῖον — сосуд; ὀστράκινος — глиняный, 土の器); ἵνα διαμείνῃ ἡμέρας πλεῖους — «чтобы осталась на многие дни» (διαμένω — пребывать). Слав. «возми книгу сию купления запечатленну и книгу прочтеную и вложи ю в сосуд глинян, да пребудет дни множайшыя»."
  15: "Ἔτι κτηθήσονται ἀγροὶ καὶ οἰκίαι καὶ ἀμπελῶνες ἐν τῇ γῇ ταύτῃ — «ещё будут куплены поля, дома и виноградники в земле этой» (κτάομαι — покупать; ἀμπελών — виноградник): знамение надежды при осаде. Слав. «еще притяжутся храмины и села и винограды на сей земли». Цитата, начатая в 39:14, закрывается."
  16: "Καὶ προσευξάμην πρὸς κύριον μετὰ τὸ δοῦναί με τὸ βιβλίον… πρὸς Βαρουχ — «и помолился я Господу после того, как отдал книгу… Варуху». Слав. «И молихся ко Господеви по отдании книги прикупления варуху сыну нириину». Начало молитвы (39:17–25) — 「…」."
  17: "Ὦ κύριε — «о Господи» (звательный); σὺ ἐποίησας τὸν οὐρανὸν καὶ τὴν γῆν τῇ ἰσχύι σου τῇ μεγάλῃ — «Ты сотворил небо и землю великою силою Твоею»; τῷ βραχίονί σου τῷ ὑψηλῷ καὶ τῷ μετεώρῳ — «и мышцею Твоею высокою и возвышенною» (βραχίων — мышца, 腕; μετέωρος — возвышенный; слав. «мышцею твоею высокою»); οὐ μὴ ἀποκρυβῇ ἀπὸ σοῦ οὐθέν — «не утаится от Тебя ничто» (ἀποκρύπτω — скрывать). Основа молитвы — всемогущество Творца."
  18: "ποιῶν ἔλεος εἰς χιλιάδας — «творящий милость до тысяч [родов]» (ἔλεος; χιλιάς — тысяча, 千代); ἀποδιδοὺς ἁμαρτίας πατέρων εἰς κόλπους τέκνων αὐτῶν μετ᾽ αὐτούς — «воздающий грехи отцов в недра детей их после них» (ἀποδίδωμι — воздавать; κόλπος — недро, ふところ); ὁ θεὸς ὁ μέγας καὶ ἰσχυρός — «Бог великий и сильный». Здесь gr-lxx-byz обрывает стих (в ru/МТ добавлено «Господь Саваоф» — в текст не внесено). Слав. «Бог великий и крепкий»."
  19: "κύριος μεγάλης βουλῆς — «Господь великого совета» (βουλή — совет, замысел; мессианский титул, ср. Ис 9:6 LXX); δυνατὸς τοῖς ἔργοις — «сильный в делах» (ἔργον); ὁ θεὸς ὁ μέγας ὁ παντοκράτωρ — «Бог великий, Вседержитель» (παντοκράτωρ — 万軍の主); μεγαλώνυμος κύριος — «великоимённый Господь» (μεγαλώνυμος); οἱ ὀφθαλμοί σου εἰς τὰς ὁδοὺς τῶν υἱῶν τῶν ἀνθρώπων — «очи Твои на пути сынов человеческих»; δοῦναι ἑκάστῳ κατὰ τὴν ὁδὸν αὐτοῦ — «дать каждому по пути его». Слав. «Бог велика совета и силен делесы… очи твои отверсты на вся пути сынов человеческих»."
  20: "ὃς ἐποίησας σημεῖα καὶ τέρατα ἐν γῇ Αἰγύπτῳ — «Который сотворил знамения и чудеса в земле Египетской» (σημεῖον — знамение, しるし; τέρας — чудо, 不思議); ἕως τῆς ἡμέρας ταύτης — «до сего дня»; ἐν Ισραηλ καὶ ἐν τοῖς γηγενέσιν — «в Израиле и в земнородных» (γηγενής — рождённый от земли, 地に生まれた者; слав. «в людех»); ἐποίησας σεαυτῷ ὄνομα — «сделал Себе имя». Слав. «иже сотворил еси знамения и чудеса во земли египетстей, даже до сего дне»."
  21: "ἐξήγαγες τὸν λαόν σου Ισραηλ ἐκ γῆς Αἰγύπτου — «вывел народ Твой Израиля из земли Египетской»; ἐν σημείοις καὶ ἐν τέρασιν — «знамениями и чудесами»; ἐν χειρὶ κραταιᾷ καὶ ἐν βραχίονι ὑψηλῷ — «рукою крепкою и мышцею высокою» (κραταιός — крепкий); ἐν ὁράμασιν μεγάλοις — «видениями великими» (ὅραμα — видение, 幻; слав. «видении великими»)."
  22: "ἔδωκας αὐτοῖς τὴν γῆν ταύτην — «дал им землю эту»; ἣν ὤμοσας τοῖς πατράσιν αὐτῶν — «которую поклялся отцам их» (ὄμνυμι — клясться); γῆν ῥέουσαν γάλα καὶ μέλι — «землю, текущую молоком и мёдом» (ῥέω — течь; γάλα — молоко, 乳; μέλι — мёд, 蜜). Слав. «землю кипящую медом и млеком»."
  23: "εἰσήλθοσαν καὶ ἐλάβοσαν αὐτὴν — «вошли и взяли её»; οὐκ ἤκουσαν τῆς φωνῆς σου — «не послушали гласа Твоего»; ἐν τοῖς προστάγμασίν σου οὐκ ἐπορεύθησαν — «по повелениям Твоим не ходили» (πρόσταγμα — повеление, 掟); ἅπαντα, ἃ ἐνετείλω αὐτοῖς, οὐκ ἐποίησαν — «всего, что заповедал им, не сделали» (ἐντέλλομαι); ἐποίησας συμβῆναι αὐτοῖς πάντα τὰ κακὰ ταῦτα — «сделал, что постигло их всё это зло» (συμβαίνω — случаться). Слав. «(творити)» — редакционная помета в скобках, не внесена."
  24: "ἰδοὺ ὄχλος ἥκει εἰς τὴν πόλιν ταύτην συλλαβεῖν αὐτήν — «вот, толпа (войско) пришла к городу сему, чтобы взять его» (ὄχλος — толпа, войско; συλλαμβάνω — захватывать); ἡ πόλις ἐδόθη εἰς χεῖρας Χαλδαίων — «город предан в руки Халдеев»; ἀπὸ προσώπου μαχαίρας καὶ τοῦ λιμοῦ — «от лица меча и голода» (μάχαιρα, λιμός); ὡς ἐλάλησας, οὕτως ἐγένετο — «как Ты сказал, так и было». Слав. добавляет «и мора» («и мор») и «и се, ты зриши» («и вот, Ты видишь») — нет в LXX, внесено без скобок."
  25: "καὶ σὺ λέγεις πρός με — «а Ты говоришь мне»: слова Господа, переданные Иеремией в молитве, — 『…』. Κτῆσαι σεαυτῷ ἀγρὸν ἀργυρίου — «купи себе поле за серебро»; ἐγὼ ἔγραψα βιβλίον καὶ ἐσφραγισάμην καὶ ἐπεμαρτυράμην μάρτυρας — «я записал книгу, запечатал и призвал свидетелей» (ἐπιμαρτύρομαι); ἡ πόλις ἐδόθη εἰς χεῖρας Χαλδαίων — «город предан в руки Халдеев». Слав. «А ты ко мне глаголеши: притяжи себе село сребром». Молитва закрывается."
  26: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: вводная формула; ответ Господа — 39:27–35. Слав. «И бысть слово Господне ко мне глаголя»."
  27: "Ἐγὼ κύριος ὁ θεὸς πάσης σαρκός — «Я Господь Бог всякой плоти» (σάρξ — плоть, 肉); μὴ ἀπ᾽ ἐμοῦ κρυβήσεταί τι; — «разве от Меня скроется что-либо?» (κρύπτω — скрывать). Слав. «аз Господь Бог всея плоти, еда от мене утаится что?». В ru (МТ) «есть ли что невозможное для Меня?» — иное чтение, отмечено; в тексте по LXX/csl вопрос о сокрытом."
  28: "Δοθεῖσα παραδοθήσεται ἡ πόλις αὕτη — «отданная предастся» (dat. cognatus: «непременно будет предана»); εἰς χεῖρας βασιλέως Βαβυλῶνος — «в руки царя Вавилонского»; λήμψεται αὐτήν — «он возьмёт её». Слав. «отдан предастся сей град в руце царя вавилонска»."
  29: "ἥξουσιν οἱ Χαλδαῖοι πολεμοῦντες ἐπὶ τὴν πόλιν — «придут Халдеи, воюющие против города»; καύσουσιν ἐν πυρί — «сожгут огнём»; κατακαύσουσιν τὰς οἰκίας — «сожгут дома» (κατακαίω); ἐν αἷς ἐθυμιῶσαν ἐπὶ τῶν δωμάτων αὐτῶν τῇ Βααλ — «в которых кадили на кровлях своих Ваалу» (θυμιάω — кадить, 香をたく; δῶμα — кровля, 屋根); ἔσπενδον σπονδὰς θεοῖς ἑτέροις — «возливали возлияния иным богам» (σπένδω — возливать; σπονδή — возлияние, 注ぎ物); πρὸς τὸ παραπικρᾶναί με — «чтобы прогневать Меня» (παραπικραίνω)."
  30: "ἦσαν οἱ υἱοὶ Ισραηλ καὶ οἱ υἱοὶ Ιουδα μόνοι ποιοῦντες τὸ πονηρόν — «сыны Израиля и сыны Иуды только зло делали» (μόνοι — одни, только); κατ᾽ ὀφθαλμούς μου — «пред очами Моими»; ἐκ νεότητος αὐτῶν — «от юности их». В gr-lxx-byz стих на этом кончается; слав. добавляет «сынове израилевы подвизают мя на гнев в делех рук своих, рече Господь» — нет в LXX, внесено без скобок (手の業でわたしを怒らせてきた…と主は言われる)."
  31: "ἐπὶ τὴν ὀργήν μου καὶ ἐπὶ τὸν θυμόν μου ἦν ἡ πόλις αὕτη — «на гнев Мой и на ярость Мою был город сей» (ὀργή, θυμός); ἀφ᾽ ἧς ἡμέρας ᾠκοδόμησαν αὐτὴν καὶ ἕως τῆς ἡμέρας ταύτης — «с того дня, как построили его, и до сего дня»; ἀπαλλάξαι αὐτὴν ἀπὸ προσώπου μου — «чтобы удалить его от лица Моего» (ἀπαλλάσσω — удалять, 退ける). Слав. «яко на гнев мой и на ярость мою бе град сей… яко отставити его от лица моего»."
  32: "διὰ πάσας τὰς πονηρίας τῶν υἱῶν Ισραηλ καὶ Ιουδα — «за все злобы сынов Израиля и Иуды» (πονηρία — злоба); ὧν ἐποίησαν πικρᾶναί με — «которые они сделали, чтобы прогневать Меня»; αὐτοὶ καὶ οἱ βασιλεῖς αὐτῶν καὶ οἱ ἄρχοντες αὐτῶν καὶ οἱ ἱερεῖς αὐτῶν καὶ οἱ προφῆται αὐτῶν — «они, и цари их, и князья их, и священники их, и пророки их»; ἄνδρες Ιουδα καὶ οἱ κατοικοῦντες Ιερουσαλημ — «мужи Иуды и живущие в Иерусалиме». Слав. добавляет «и вельможи их» — нет в LXX, внесено без скобок (貴族たち)."
  33: "ἐπέστρεψαν πρός με νῶτον καὶ οὐ πρόσωπον — «обратились ко Мне спиною, а не лицом» (νῶτον — спина, 背); ἐδίδαξα αὐτοὺς ὄρθρου καὶ ἐδίδαξα — «учил их с рассвета, и учил» (ὄρθρος — рассвет, раннее утро; повтор сохранён); οὐκ ἤκουσαν ἐπιλαβεῖν παιδείαν — «не послушали, чтобы принять наставление» (ἐπιλαμβάνω — принимать; παιδεία — наставление, 懲らしめ). Слав. «обратиша хребет ко мне, а не лице: и наказах я из утра»."
  34: "ἔθηκαν τὰ μιάσματα αὐτῶν ἐν τῷ οἴκῳ — «поставили мерзости свои в доме» (μίασμα — скверна, мерзость); οὗ ἐπεκλήθη τὸ ὄνομά μου ἐπ᾽ αὐτῷ — «над которым наречено имя Моё» (ἐπικαλέω — нарекать); ἐν ἀκαθαρσίαις αὐτῶν — «в нечистотах их» (ἀκαθαρσία). Слав. «положиша осквернения своя в дому, идеже наречеся имя мое, в нечистотах своих»."
  35: "ᾠκοδόμησαν τοὺς βωμοὺς τῇ Βααλ — «построили жертвенники Ваалу» (βωμός — жертвенник, 祭壇; Βααλ — バアル); ἐν φάραγγι υἱοῦ Εννομ — «в долине сына Еннома» (φάραγξ — ущелье, долина; в тексте ベン・ヒンノムの谷 — новое имя, по евр. גיא בן הנם; ср. 4 Цар 23:10); ἀναφέρειν τοὺς υἱοὺς αὐτῶν καὶ τὰς θυγατέρας αὐτῶν τῷ Μολοχ βασιλεῖ — «приносить сыновей и дочерей своих Молоху-царю» (ἀναφέρω — возносить, приносить в жертву; Μολοχ — モロク); ἃ οὐ συνέταξα αὐτοῖς — «чего Я не заповедал им»; οὐκ ἀνέβη ἐπὶ καρδίαν μου — «не восходило на сердце Моё» (образ: не приходило на ум); πρὸς τὸ ἐφαμαρτεῖν τὸν Ιουδαν — «чтобы ввести в грех Иуду» (ἐφαμαρτάνω)."
  36: "ἐπὶ τὴν πόλιν, ἣν σὺ λέγεις — «о городе, о котором ты говоришь» (обращение к пророку); Παραδοθήσεται εἰς χεῖρας βασιλέως Βαβυλῶνος — «предастся в руки царя Вавилонского»; ἐν μαχαίρᾳ καὶ ἐν λιμῷ καὶ ἐν ἀποστολῇ — «мечом, голодом и посланием» (ἀποστολή — здесь, вероятно, «мор», ср. 39:24; слав. «мечем и гладом и мором»): слова людей — 『…』. Слав. «предан будет в руце царя вавилонска мечем и гладом и мором»."
  37: "συνάγω αὐτοὺς ἐκ πάσης τῆς γῆς — «собираю их из всей земли»; οὗ διέσπειρα αὐτοὺς ἐκεῖ — «куда рассеял их там» (διασπείρω — рассеивать); ἐν ὀργῇ μου καὶ τῷ θυμῷ μου καὶ παροξυσμῷ μεγάλῳ — «в гневе Моём, ярости Моей и великом раздражении» (παροξυσμός — раздражение, 激怒); ἐπιστρέψω εἰς τὸν τόπον τοῦτον — «возвращу на место это»; καθιῶ αὐτοὺς πεποιθότας — «посажу их с уверенностью», т. е. в безопасности (πείθω в перф. — доверять, быть уверенным, 安心して). Слав. «посажду я во уповании»."
  38: "καὶ ἔσονταί μοι εἰς λαόν, καὶ ἐγὼ ἔσομαι αὐτοῖς εἰς θεόν — «и они будут Мне народом, и Я буду им Богом»: формула завета (ср. 38:1, 38:33; Лев 26:12). Слав. «и будут ми в люди, и аз буду им в Бога»."
  39: "δώσω αὐτοῖς ὁδὸν ἑτέραν καὶ καρδίαν ἑτέραν — «дам им путь иной и сердце иное» (ἕτερος — другой, иной; в тексте 別の); φοβηθῆναί με πάσας τὰς ἡμέρας — «бояться Меня во все дни»; εἰς ἀγαθὸν αὐτοῖς καὶ τοῖς τέκνοις αὐτῶν μετ᾽ αὐτούς — «во благо им и детям их после них». В ru (МТ) «одно сердце и один путь» — масоретское чтение, в текст не внесено; слав. «путь ин и сердце ино»."
  40: "διαθήσομαι αὐτοῖς διαθήκην αἰωνίαν — «заключу с ними завет вечный» (διαθήκη; αἰώνιος — вечный, 永遠); ἣν οὐ μὴ ἀποστρέψω ὄπισθεν αὐτῶν — «которого не отвращу после них», т. е. не отниму (ἀποστρέφω — отвращать, отнимать); τὸν φόβον μου δώσω εἰς τὴν καρδίαν αὐτῶν — «страх Мой дам в сердце их»; πρὸς τὸ μὴ ἀποστῆναι αὐτοὺς ἀπ᾽ ἐμοῦ — «чтобы не отступили они от Меня» (ἀφίστημι). Слав. «завещаю им завет вечный, егоже не отвращу последи их, и страх мой дам в сердце их»."
  41: "ἐπισκέψομαι τοῦ ἀγαθῶσαι αὐτούς — «посещу, чтобы облагодетельствовать их» (ἐπισκέπτομαι; ἀγαθόω — благотворить); φυτεύσω αὐτοὺς ἐν τῇ γῇ ταύτῃ — «насажу их в земле этой» (φυτεύω, 植える); ἐν πίστει — «в верности» (πίστις — верность, истина; в тексте 真実); ἐν πάσῃ καρδίᾳ καὶ ἐν πάσῃ ψυχῇ — «всем сердцем и всею душою». Слав. «посещу еже ублажити я и насажду я в сей земли с верою и со всем сердцем моим и со всею душею моею»."
  42: "Καθὰ ἐπήγαγον ἐπὶ τὸν λαὸν τοῦτον πάντα τὰ κακὰ τὰ μεγάλα ταῦτα — «как Я навёл на народ этот все эти великие бедствия» (ἐπάγω — наводить); οὕτως ἐπάξω ἐπ᾽ αὐτοὺς πάντα τὰ ἀγαθά — «так наведу на них все блага»; ἃ ἐλάλησα ἐπ᾽ αὐτούς — «которые изрёк о них». Слав. «якоже наведох на люди сия вся злая сия великая, тако аз наведу на них вся благоты». Открывается обетование (39:42–44)."
  43: "κτηθήσονται ἔτι ἀγροὶ ἐν τῇ γῇ — «ещё будут куплены поля в земле»; ᾗ σὺ λέγεις Ἄβατός ἐστιν ἀπὸ ἀνθρώπων καὶ κτήνους — «о которой ты говоришь: непроходима от людей и скота» (ἄβατος — непроходимый, пустынный; в тексте 荒れ地); παρεδόθησαν εἰς χεῖρας Χαλδαίων — «преданы в руки Халдеев» (мн. ч. — о полях/городах); союз καί перед глаголом передан связкой であり. Слав. «непроходна будет от человек и скота, и предашася в руце халдейсте». Слова людей — 『…』."
  44: "κτήσονται ἀγροὺς ἐν ἀργυρίῳ — «будут покупать поля за серебро»; γράψεις βιβλίον καὶ σφραγιῇ καὶ διαμαρτυρῇ μάρτυρας — «напишешь книгу, запечатаешь и призовёшь свидетелей»: в греч. и слав. внезапно 2-е л. ед. ч. после 3-го мн. (правильный текст, вероятно, 3-е л.); в тексте сохранён переход 人々は…買い、あなたは…記し. ἐν γῇ Βενιαμιν καὶ κύκλῳ Ιερουσαλημ — «в земле Вениамина и вокруг Иерусалима»; ἐν πόλεσιν τοῦ ὄρους — «в городах горных»; τῆς Σεφηλα — «Шефелы» (низменность, 低い地); τῆς Ναγεβ — «Негева» (юг, 南); ὅτι ἀποστρέψω τὰς ἀποικίας αὐτῶν — «ибо возвращу переселения их» (ἀποικία — переселение, 捕囚). Слав. добавляет «глаголет Господь» — внесено. Цитата закрывается."
