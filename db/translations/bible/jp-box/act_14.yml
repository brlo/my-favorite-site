verses:
  1: "イコニオンでも、二人[ふたり]は同じようにユダヤ人[じん]の会堂[かいどう]に入[はい]り、語[かた]った。そのため、ユダヤ人[じん]もギリシア人[じん]も大[おお]ぜいが信[しん]じた。"
  2: "しかし、信[しん]じなかったユダヤ人[じん]たちは、異邦人[いほうじん]たちをけしかけて、兄弟[きょうだい]たちへの反感[はんかん]を募[つの]らせた。"
  3: "それでも二人[ふたり]は長[なが]い間[あいだ]そこにとどまり、主[しゅ]に信[しん]頼[らい]して大胆[だいたん]に語[かた]った。主[しゅ]は、彼[かれ]らの手[て]によってしるしと奇跡[きせき]を行[おこな]わせ、御自分[ごじぶん]の{恵[めぐ]み|恩寵[おんちょう]}の言葉[ことば]を証[あか]ししてくださった。"
  4: "町[まち]の人々[ひとびと]は二[ふた]つに分[わ]かれ、ある者[もの]はユダヤ人[じん]たちの側[がわ]に、ある者[もの]は使徒[しと]たちの側[がわ]についた。"
  5: "異邦人[いほうじん]たちとユダヤ人[じん]たちが、その指導者[しどうしゃ]たちとともに、二人[ふたり]を辱[はずか]しめて石[いし]を投[な]げつけようと攻[せ]めかかろうとしたとき、"
  6: "二人[ふたり]はそれと悟[さと]って、ルカオニアの町[まち]であるリストラ、デルベと、その周辺[しゅうへん]の地方[ちほう]へ逃[に]げ、"
  7: "そこで福音[ふくいん]を告[つ]げ知[し]らせていた。"
  8: "リストラには、足[あし]のきかない男[おとこ]が座[すわ]っていた。母[はは]の胎内[たいない]から足[あし]が不自由[ふじゆう]で、これまで一度[いちど]も歩[ある]いたことがなかった。"
  9: "この男[おとこ]はパウロが話[はな]すのを聞[き]いていた。パウロは彼[かれ]をじっと見[み]つめ、癒[いや]される信仰[しんこう]があるのを見[み]て、"
  10: "大[おお]きな声[こえ]で言[い]った。「あなたの足[あし]でまっすぐに立[た]ちなさい。」すると男[おとこ]は跳[は]ね上[あ]がって、歩[ある]き出[だ]した。"
  11: "群衆[ぐんしゅう]はパウロのしたことを見[み]て、声[こえ]を張[は]り上[あ]げ、ルカオニアの言葉[ことば]で言[い]った。「神々[かみがみ]が人[ひと]の姿[すがた]になって、わたしたちのところへ降[お]りてきた。」"
  12: "そして、バルナバをゼウスと呼[よ]び、パウロをヘルメス⟨ギリシア神話[しんわ]で弁舌[べんぜつ]をつかさどる神[かみ]。⟩と呼[よ]んだ。パウロが話[はな]しの中心[ちゅうしん]であったからである。"
  13: "町[まち]の前[まえ]にあるゼウスの神殿[しんでん]の祭司[さいし]は、雄牛[おうし]と花[はな]の冠[かんむり]を門[もん]のところへ持[も]って来[き]て、群衆[ぐんしゅう]とともに供[そな]え物[もの]をささげようとした。"
  14: "使徒[しと]たちであるバルナバとパウロはこれを聞[き]くと、自分[じぶん]たちの衣[ころも]を裂[さ]き、群衆[ぐんしゅう]の中[なか]へ飛[と]び込[こ]んで叫[さけ]んだ。"
  15: "「皆[みな]さん、なぜこんなことをするのか。わたしたちも、あなたがたと同じ人間[にんげん]である。あなたがたに福音[ふくいん]を告[つ]げ知[し]らせているのは、これらの空[むな]しいものから生[い]ける神[かみ]へとあなたがたを向[む]けさせるためである。この神[かみ]は天[てん]と地[ち]と海[うみ]、そしてその中[なか]のすべてのものを造[つく]られた方[かた]である。"
  16: "神[かみ]は過[す]ぎ去[さ]った時代[じだい]には、すべての異邦人[いほうじん]がそれぞれ自分[じぶん]たちの道[みち]を行[い]くままに任[まか]せておられた。"
  17: "それでも、善[よ]いことを行[おこな]って御自分[ごじぶん]についての証[あか]しを絶[た]やさず、天[てん]から雨[あめ]を降[ふ]らせ、実[みの]りの時[とき]をお与[あた]えになり、食物[しょくもつ]と喜[よろこ]びとで、あなたがたの心[こころ]を満[み]たしてこられた。」"
  18: "こう言[い]って、二人[ふたり]はようやく群衆[ぐんしゅう]を説得[せっとく]して、自分[じぶん]たちに供[そな]え物[もの]をささげるのをやめさせた。"
  19: "ところが、アンティオキアとイコニオンからユダヤ人[じん]たちが来[き]て、群衆[ぐんしゅう]を味方[みかた]につけ、パウロに石[いし]を投[な]げつけて町[まち]の外[そと]まで引[ひ]きずり出[だ]した。死[し]んだと思[おも]ったのである。"
  20: "しかし、弟子[でし]たちが彼[かれ]の周[まわ]りに集[あつ]まると、彼[かれ]は起[お]き上[あ]がって町[まち]へ戻[もど]った。そして翌日[よくじつ]、バルナバとともにデルベへ出[で]かけた。"
  21: "二人[ふたり]はこの町[まち]で福音[ふくいん]を告[つ]げ知[し]らせ、多[おお]くの人[ひと]を弟子[でし]としてから、リストラ、イコニオン、アンティオキアへと引[ひ]き返[かえ]した。"
  22: "弟子[でし]たちの心[こころ]を強[つよ]め、信仰[しんこう]にとどまるように勧[すす]め、また、わたしたちは多[おお]くの患難[かんなん]を通[とお]って神[かみ]の国[くに]に入[はい]らなければならないと教[おし]えた。"
  23: "また、各[かく]教会[きょうかい]に長老[ちょうろう]を選[えら]び、断食[だんじき]して祈[いの]り、彼[かれ]らが信[しん]じた主[しゅ]に彼[かれ]らを委[ゆだ]ねた。"
  24: "二人[ふたり]はピシディアを通[とお]ってパンフィリアへ行[い]き、"
  25: "ペルゲで主[しゅ]の言葉[ことば]を語[かた]ってから、アタリアへ下[くだ]った。"
  26: "そこから船[ふね]でアンティオキアへ向[む]かった。そこは、彼[かれ]らが今[いま]成[な]し遂[と]げた働[はたら]きのために、神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}に委[ゆだ]ねられて出[で]発[はつ]した場所[ばしょ]である。"
  27: "着[つ]くと、二人[ふたり]は教会[きょうかい]を集[あつ]めて、神[かみ]が自分[じぶん]たちとともに行[おこな]われたすべてのこと、また異邦人[いほうじん]に信仰[しんこう]の扉[とびら]を開[ひら]かれたことを報告[ほうこく]した。"
  28: "二人[ふたり]はかなりの間[あいだ]、弟子[でし]たちとともにそこで過[す]ごした。"

notes:
  1: "κατὰ τὸ αὐτό — «вместе, так же»; 同じように. Ἕλληνες — ギリシア人."
  2: "ἀπειθήσαντες — «не поверившие, непокорные»; 信じなかった. ἐκάκωσαν τὰς ψυχάς — «озлобили души»; 反感を募らせた."
  3: "παρρησιαζόμενοι — «говоря с дерзновением»; 大胆に語った. σημεῖα καὶ τέρατα — しるしと奇跡."
  8: "χωλὸς ἐκ κοιλίας μητρός — «хромой от чрева матери»; 母の胎内から足が不自由."
  11: "Λυκαονιστί — на ликаонском наречии; ルカオニアの言葉."
  12: "Δίας — ゼウス, Ἑρμῆς — ヘルメス. Павла приняли за Гермеса потому, что он «был ведущим в слове» (ὁ ἡγούμενος τοῦ λόγου); сноска объясняет, что Гермес — бог красноречия."
  13: "στέμματα — венки, которые надевали на жертвенных животных; 花の冠. πυλῶνας — ворота перед городом."
  15: "ὁμοιοπαθεῖς — «подобные [вам] по природе»; 同じ人間. μάταια — «ничтожные» идолы; 空しいもの."
  17: "ἀμάρτυρον αὐτὸν οὐκ ἀφῆκεν — «не оставил Себя без свидетельства»; 証しを絶やさず. καρποφόρους — 実りの時."
  22: "διὰ πολλῶν θλίψεων δεῖ… εἰσελθεῖν — «многими скорбями надлежит войти»; 多くの患難を通って…入らなければならない, без смягчения."
  23: "χειροτονήσαντες — «избрав, поставив» (рукоположение не подчёркнуто в греч. слове); 選び. С постом и молитвой — 断食して祈り."
