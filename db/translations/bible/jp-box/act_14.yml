# jp-box, Деяния апостолов, глава 14. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 14: Иконий (1–7), исцеление хромого в Листре и «боги сошли» (8–18),
# избиение Павла и возвращение через Листру, Иконий, Антиохию (19–28).
# Красного в главе нет: Христос здесь не говорит; речь Павла (15–17),
# слова толпы (11), слова Павла в Листре (10) — не красные.
# 〔…〕 в главе нет: все чтения церковного текста в базе есть.
# Сноска одна — 14:12 (ヘルメス: почему Павла приняли за Гермеса).

