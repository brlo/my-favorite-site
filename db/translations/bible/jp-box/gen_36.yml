verses:
  1: "これがエサウの系図[けいず]である。彼[かれ]はエドムである。"
  2: "エサウはカナン人の娘[むすめ]たちのうちから妻[つま]を迎[むか]えた。すなわち、ヒッタイト人[じん]エロンの娘[むすめ]アダ、ヒビ人[じん]ツィブオンの子[こ]アナの娘[むすめ]オホリバマ、"
  3: "およびイシュマエルの娘[むすめ]で、ネバヨトの妹[いもうと]であるバセマト。"
  4: "アダはエサウにエリファズを産[う]み、バセマトはレウエルを産[う]んだ。"
  5: "オホリバマはイエウシュ、ヤラム、コラを産[う]んだ。これらはエサウの息子[むすこ]たちで、カナンの地[ち]で彼[かれ]に生[う]まれた者[もの]たちである。"
  6: "エサウは自分[じぶん]の妻[つま]たち、息子[むすこ]たち、娘[むすめ]たち、家[いえ]のすべての者[もの]、すべての財産[ざいさん]、すべての家畜[かちく]、そしてカナンの地[ち]で得[え]たすべてのもの、手[て]に入[い]れたすべてのものを携[たずさ]えて、カナンの地[ち]を去[さ]り、弟[おとうと]ヤコブの顔[かお]を避[さ]けて行[い]った。"
  7: "彼[かれ]らの財産[ざいさん]が多[おお]すぎて、ともに住[す]むことができなかったからである。彼[かれ]らが寄留[きりゅう]していた地[ち]は、その財産[ざいさん]の多[おお]さゆえに、彼[かれ]らを支[ささ]えきれなかった。"
  8: "エサウはセイルの山[やま]に住[す]んだ。エサウはすなわちエドムである。"
  9: "セイルの山[やま]に住[す]むエドムの父[ちち]であるエサウの系図[けいず]は、次[つぎ]のとおりである。"
  10: "エサウの息子[むすこ]たちの名[な]は次[つぎ]のとおりである。エサウの妻[つま]アダの子[こ]エリファズ、エサウの妻[つま]バセマトの子[こ]レウエル。"
  11: "エリファズの子[こ]らは、テマン、オマル、ツェフォ、ガタム、ケナズ。"
  12: "ティムナはエサウの子[こ]エリファズの側女[そばめ]で、エリファズにアマレクを産[う]んだ。これらはエサウの妻[つま]アダの息子[むすこ]たちである。"
  13: "レウエルの息子[むすこ]たちは、ナハト、ゼラ、シャンマ、ミザである。これらはエサウの妻[つま]バセマトの息子[むすこ]たちであった。"
  14: "これらは、ツィブオンの子[こ]アナの娘[むすめ]で、エサウの妻[つま]であるオホリバマの息子[むすこ]たちであった。彼女[かのじょ]はエサウにイエウシュ、ヤラム、コラを産[う]んだ。"
  15: "これらはエサウの子[こ]ら、すなわち族長[ぞくちょう]たちである。エサウの長子[ちょうし]エリファズの息子[むすこ]たちは、族長[ぞくちょう]テマン、族長[ぞくちょう]オマル、族長[ぞくちょう]ツェフォ、族長[ぞくちょう]ケナズ、"
  16: "族長[ぞくちょう]コラ、族長[ぞくちょう]ガタム、族長[ぞくちょう]アマレク。これらはイドマヤの地[ち]におけるエリファズの族長[ぞくちょう]たちである。これらはアダの子[こ]らである。"
  17: "エサウの子[こ]レウエルの息子[むすこ]たちは、族長[ぞくちょう]ナハト、族長[ぞくちょう]ゼラ、族長[ぞくちょう]シャンマ、族長[ぞくちょう]ミザ。これらはエドムの地[ち]におけるレウエルの族長[ぞくちょう]たちである。これらはエサウの妻[つま]バセマトの子[こ]らである。"
  18: "これらはエサウの妻[つま]オホリバマの息子[むすこ]たちである。族長[ぞくちょう]イエウシュ、族長[ぞくちょう]ヤラム、族長[ぞくちょう]コラ。これらはオホリバマの族長[ぞくちょう]たちである。"
  19: "これらはエサウの子[こ]らであり、これらが彼[かれ]らの族長[ぞくちょう]たちである。これらはエドムの子[こ]らである。"
  20: "その地[ち]に住[す]んでいたホリ人[じん]セイルの子[こ]らは次[つぎ]のとおりである。ロタン、ショバル、ツィブオン、アナ、"
  21: "ディション、エツェル、ディシャン。これらはエドムの地[ち]における、セイルの子[こ]であるホリ人[じん]の族長[ぞくちょう]たちである。"
  22: "ロタンの子[こ]らは、ホリとヘマンであった。ロタンの妹[いもうと]はティムナである。"
  23: "ショバルの子[こ]らは、アルワン、マナハト、エバル、シェフォ、オナムである。"
  24: "ツィブオンの子[こ]らは、アヤとアナである。このアナは、父[ちち]ツィブオンのろばを飼[か]っていたとき、荒[あ]れ野[の]でヤミンを見[み]つけた者[もの]である。"
  25: "アナの子[こ]らは、ディションと、アナの娘[むすめ]オホリバマである。"
  26: "ディションの子[こ]らは、ヘムダン、エシュバン、イトラン、ケラハである。"
  27: "エツェルの子[こ]らは、ビルハン、ザアワン、アカン、ウカンである。"
  28: "ディシャンの子[こ]らは、ウツとアランである。"
  29: "ホリ人[じん]の族長[ぞくちょう]たちは、族長[ぞくちょう]ロタン、族長[ぞくちょう]ショバル、族長[ぞくちょう]ツィブオン、族長[ぞくちょう]アナ、"
  30: "族長[ぞくちょう]ディション、族長[ぞくちょう]エツェル、族長[ぞくちょう]ディシャン。これらはエドムの地[ち]で、それぞれの族長[ぞくちょう]の家[いえ]に従[したが]うホリ人[じん]の族長[ぞくちょう]たちである。"
  31: "イスラエルに王[おう]が治[し]める前[まえ]に、エドムの地[ち]を治[し]めた王[おう]たちは次[つぎ]のとおりである。"
  32: "エドムで治[し]めたのは、ベオルの子[こ]ベラで、その町[まち]の名[な]はディンハバであった。"
  33: "ベラが死[し]ぬと、代[か]わって、ボツラから来[き]たザラの子[こ]ヨバブが治[し]めた。"
  34: "ヨバブが死[し]ぬと、代[か]わって、テマン人[じん]の地[ち]から来[き]たフシャムが治[し]めた。"
  35: "フシャムが死[し]ぬと、代[か]わって、ベダドの子[こ]ハダドが治[し]めた。彼[かれ]はモアブの野[の]でミディアン人[じん]を打[う]ち破[やぶ]った者[もの]で、その町[まち]の名[な]はアビトであった。"
  36: "ハダドが死[し]ぬと、代[か]わって、マスレカから来[き]たサムラが治[し]めた。"
  37: "サムラが死[し]ぬと、代[か]わって、川[かわ]のほとりのレホボトから来[き]たシャウルが治[し]めた。"
  38: "シャウルが死[し]ぬと、代[か]わって、アフボルの子[こ]バアル・ハナンが治[し]めた。"
  39: "アフボルの子[こ]バアル・ハナンが死[し]ぬと、代[か]わって、ハダルが治[し]めた。その町[まち]の名[な]はパウ、妻[つま]の名[な]はメヘタブエルで、マトレドの娘[むすめ]、メザハブの孫[まご]にあたる。"
  40: "エサウの族長[ぞくちょう]たちの名[な]は、その氏族[しぞく]ごと、その場所[ばしょ]ごと、その国々[くにぐに]ごと、その民[たみ]ごとに、次[つぎ]のとおりである。族長[ぞくちょう]ティムナ、族長[ぞくちょう]アルワ、族長[ぞくちょう]エテル、"
  41: "族長[ぞくちょう]オホリバマ、族長[ぞくちょう]エラ、族長[ぞくちょう]ピノン、"
  42: "族長[ぞくちょう]ケナズ、族長[ぞくちょう]テマン、族長[ぞくちょう]ミブツァル、"
  43: "族長[ぞくちょう]マグディエル、族長[ぞくちょう]イラム。これらは、その所有[しょゆう]の地[ち]に築[きず]かれた町々[まちまち]に住[す]むエドムの族長[ぞくちょう]たちである。これがエサウ、エドムの父[ちち]である。"

notes:
  1: "Αὗται δὲ αἱ γενέσεις Ησαυ — これがエサウの系図 (γένεσις — «происхождение, родословие»; отсюда обычное заглавие «вот родословие»). αὐτός ἐστιν Εδωμ — 彼はエドム (в gr-lxx-byz в квадратных скобках; скобки не ставятся)."
  2: "ἀπὸ τῶν θυγατέρων τῶν Χαναναίων — カナン人の娘たちのうちから. Αδα — アダ. Αιλων τοῦ Χετταίου — ヒッタイト人エロン (Χετταῖος — «хетт»). Ελιβεμα — オホリバマ (LXX Ἐλιβεμά; евр. Oholibamah). Ανα τοῦ υἱοῦ Σεβεγων τοῦ Ευαίου — ヒビ人ツィブオンの子アナ (Σεβεγών — ツィブオン; Εὐαῖος — «евеянин», ヒビ人)."
  3: "Βασεμμαθ — バセマト. θυγατέρα Ισμαηλ ἀδελφὴν Ναβαιωθ — イシュマエルの娘で、ネバヨトの妹 (ἀδελφή — «сестра»)."
  4: "ἔτεκεν — 産み (τίκτω). Ελιφας — エリファズ (LXX Ἐλιφάς). Ραγουηλ — レウエル (LXX Ῥαγουήλ)."
  5: "Ιεους — イエウシュ. Ιεγλομ — ヤラム (LXX Ἰεγλόμ; евр. Jalam). Κορε — コラ (LXX Κορέ). οἳ ἐγένοντο αὐτῷ ἐν γῇ Χανααν — カナンの地で彼に生まれた者たち."
  6: "τὰ σώματα τοῦ οἴκου αὐτοῦ — 家のすべての者 (σῶμα здесь «человек, челядь», ср. 34:29; не «тела»). τὰ ὑπάρχοντα — 財産 (τὰ ὑπάρχοντα — «имущество»). τὰ κτήνη — 家畜. ὅσα ἐκτήσατο καὶ ὅσα περιεποιήσατο — 得たすべてのもの、手に入れたすべてのもの (κτάομαι — «приобретать»; περιποιέομαι — «наживать, сберегать»). ἀπὸ προσώπου Ιακωβ — ヤコブの顔を避けて (т. е. из-за него)."
  7: "ἦν γὰρ αὐτῶν τὰ ὑπάρχοντα πολλὰ τοῦ οἰκεῖν ἅμα — 彼らの財産が多すぎて、ともに住むことができなかった (τοῦ οἰκεῖν — «чтобы жить»). οὐκ ἐδύνατο ἡ γῆ τῆς παροικήσεως αὐτῶν φέρειν αὐτούς — 寄留していた地は彼らを支えきれなかった (παροίκησις — «странствование, пришельничество»; φέρω — «нести, выдерживать»)."
  8: "ᾤκησεν — 住んだ. ἐν τῷ ὄρει Σηιρ — セイルの山に (Σηιρ — горная страна Идумея). Ησαυ αὐτός ἐστιν Εδωμ — エサウはすなわちエドム (в квадратных скобках в базе; не маркируем)."
  9: "πατρὸς Εδωμ — エドムの父 (т. е. родоначальник идумеев)."
  10: "γυναικὸς Ησαυ — エサウの妻 (γυνή здесь «жена»)."
  11: "Θαιμαν — テマン. Ωμαρ — オマル. Σωφαρ — ツェフォ (LXX Σωφάρ; евр. Zepho). Γοθομ — ガタム (LXX Γοθόμ; евр. Gatam). Κενεζ — ケナズ."
  12: "Θαμνα — ティムナ (LXX Θαμνά). παλλακή — 側女 (наложница). Αμαληκ — アマレク. οὗτοι υἱοὶ Αδας — これらはアダの息子たち (т. е. потомки; Амалик — сын Фамны, но причислен к дому Ады)."
  13: "Ναχοθ — ナハト. Ζαρε — ゼラ. Σομε — シャンマ (LXX Σομέ; евр. Shammah). Μοζε — ミザ (LXX Μοζέ; евр. Mizzah)."
  14: "Ελιβεμας θυγατρὸς Ανα τοῦ υἱοῦ Σεβεγων — ツィブオンの子アナの娘オホリバマ. ἔτεκεν δὲ τῷ Ησαυ — エサウに…産んだ."
  15: "ἡγεμών — 族長 (букв. «вождь, правитель»; слав. «старейшина»; титул эдомских родовых глав). πρωτότοκος — 長子 (первородный). Порядок имён — как в LXX."
  16: "ἐν γῇ Ιδουμαίᾳ — イドマヤの地で (Ἰδουμαία — Идумея). οὗτοι υἱοὶ Αδας — これらはアダの子ら."
  17: "οὗτοι ἡγεμόνες Ραγουηλ ἐν γῇ Εδωμ — これらはエドムの地におけるレウエルの族長たち."
  18: "οὗτοι ἡγεμόνες Ελιβεμας — これらはオホリバマの族長たち."
  19: "οὗτοι υἱοὶ Ησαυ… οὗτοί εἰσιν υἱοὶ Εδωμ — これらはエサウの子ら…エドムの子ら (формула итога)."
  20: "Σηιρ τοῦ Χορραίου τοῦ κατοικοῦντος τὴν γῆν — その地に住んでいたホリ人セイル (Χορραῖος — «хорреянин»; ホリ人). Λωταν, Σωβαλ, Σεβεγων, Ανα — ロタン、ショバル、ツィブオン、アナ."
  21: "Δησων — ディション. Ασαρ — エツェル (LXX Ἀσάρ; евр. Etser). Ρισων — ディシャン (LXX Ῥισών; евр. Dishan). τοῦ Χορραίου τοῦ υἱοῦ Σηιρ — セイルの子であるホリ人."
  22: "Χορρι καὶ Αιμαν — ホリとヘマン (LXX Χορρί, Αἰμάν). ἀδελφὴ δὲ Λωταν Θαμνα — ロタンの妹はティムナ."
  23: "Γωλων — アルワン (LXX Γωλών; евр. Alvan). Μαναχαθ — マナハト. Γαιβηλ — エバル (LXX Γαιβήλ; евр. Ebal). Σωφ — シェフォ (LXX Σώφ; евр. Shepho). Ωμαν — オナム (LXX Ὠμάν; евр. Onam)."
  24: "Αιε καὶ Ωναν — アヤとアナ (LXX Αἰέ, Ὠνάν; евр. Anah — то же имя, что Ανα в ст. 2, 14, 20 и далее; LXX здесь транслитерирует его иначе). ὁ Ωνας — このアナ (LXX Ὡνᾶς). Ιαμιν — ヤミン (LXX оставляет евр. слово без перевода; в ru «теплые воды» — по другому чтению). ἔνεμεν τὰ ὑποζύγια — ろばを飼っていた (νέμω — «пасти»; ὑποζύγιον — «вьючное животное, осёл»)."
  25: "Δησων… Ελιβεμα θυγάτηρ Ανα — ディション…アナの娘オホリバマ. υἱοί здесь включают дочь — «дети»."
  26: "Αμαδα — ヘムダン (LXX Ἀμαδά; евр. Hemdan). Ασβαν — エシュバン. Ιεθραν — イトラン. Χαρραν — ケラハ (LXX Χαρράν; евр. Keran)."
  27: "Βαλααν — ビルハン. Ζουκαμ — ザアワン. Ιωυκαμ — アカン. Ουκαν — ウカン (в LXX четыре имени; в масоретском тексте три: Билхан, Зааван, Акан; лишнее греческое имя сохранено)."
  28: "Ως καὶ Αραμ — ウツとアラン (LXX Ὤς, Ἀράμ; евр. Uz, Aran)."
  29: "οὗτοι ἡγεμόνες Χορρι — ホリ人の族長たち. Перечень тот же, что в 20–21."
  30: "ἐν ταῖς ἡγεμονίαις αὐτῶν — それぞれの族長の家に従う (ἡγεμονία — «начальство, область правления»; в csl «во областех их», в ru «по старшинствам их»)."
  31: "οἱ βασιλεύσαντες ἐν Εδωμ πρὸ τοῦ βασιλεῦσαι βασιλέα ἐν Ισραηλ — イスラエルに王が治める前にエドムの地を治めた王たち (историческая заметка; речь о царях до Давида)."
  32: "Βαλακ υἱὸς τοῦ Βεωρ — ベオルの子ベラ (LXX Βαλάκ; евр. Bela). Δενναβα — ディンハバ (LXX Δενναβά; евр. Dinhabah). ὄνομα τῇ πόλει αὐτοῦ — その町の名は."
  33: "Ιωβαβ υἱὸς Ζαρα ἐκ Βοσορρας — ボツラから来たザラの子ヨバブ (Βοσορρά — Боцра). ἐβασίλευσεν ἀντ αὐτοῦ — 代わって…が治めた (ἀντί — «вместо»)."
  34: "Ασομ ἐκ τῆς γῆς Θαιμανων — テマン人の地から来たフシャム (LXX Ἀσόμ; евр. Husham; Θαιμανῶν — «феманитян»)."
  35: "Αδαδ υἱὸς Βαραδ — ベダドの子ハダド (LXX Ἀδάδ, Βαράδ; евр. Hadad, Bedad). ὁ ἐκκόψας Μαδιαμ ἐν τῷ πεδίῳ Μωαβ — モアブの野でミディアン人を打ち破った者 (ἐκκόπτω — «срубать, поражать»). Γεθθαιμ — アビト (LXX Γεθθαίμ; евр. Avith)."
  36: "Σαμαλα ἐκ Μασεκκας — マスレカから来たサムラ (LXX Σαμαλά, Μασεκκάς; евр. Samlah, Masrekah)."
  37: "Σαουλ ἐκ Ροωβωθ τῆς παρὰ ποταμόν — 川のほとりのレホボトから来たシャウル (Ῥοωβώθ; «при реке» — уточнение LXX)."
  38: "Βαλαεννων υἱὸς Αχοβωρ — アフボルの子バアル・ハナン (LXX Βαλαεννών; евр. Baal-Hanan)."
  39: "Αραδ υἱὸς Βαραδ — ハダル (LXX Ἀράδ; евр. Hadar). Φογωρ — パウ (LXX Φογώρ; евр. Pau). Μαιτεβεηλ θυγάτηρ Ματραιθ υἱοῦ Μαιζοοβ — メヘタブエル、マトレドの娘、メザハブの孫 (букв. «дочь Матреды, сына Мезахава»)."
  40: "ἐν ταῖς φυλαῖς αὐτῶν κατὰ τόπον αὐτῶν, ἐν ταῖς χώραις αὐτῶν καὶ ἐν τοῖς ἔθνεσιν αὐτῶν — その氏族ごと、その場所ごと、その国々ごと、その民ごとに (φυλή — «племя, род»; χώρα — «страна»; ἔθνος — «народ»). Θαμνα, Γωλα, Ιεθερ — ティムナ、アルワ、エテル (LXX Γωλά, Ἰεθέρ)."
  41: "Ελιβεμας, Ηλας, Φινων — オホリバマ、エラ、ピノン (LXX Ἠλάς, Φινών)."
  42: "Κενεζ, Θαιμαν, Μαζαρ — ケナズ、テマン、ミブツァル (LXX Μαζάρ; евр. Mibzar)."
  43: "Μεγεδιηλ, Ζαφωιμ — マグディエル、イラム (LXX Μεγεδιήλ, Ζαφωίμ; евр. Magdiel, Iram). ἐν ταῖς κατῳκοδομημέναις ἐν τῇ γῇ τῆς κτήσεως αὐτῶν — その所有の地に築かれた町々に住む (κατοικοδομέω — «застраивать, населять»; κτῆσις — «владение»). Οὗτος Ησαυ πατὴρ Εδωμ — これがエサウ、エドムの父である."
