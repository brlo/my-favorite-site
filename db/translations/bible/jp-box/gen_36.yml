# jp-box, Бытие, глава 36. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru и ru. jp-joc для Быт 36 отсутствует.
# Язык — современный 常体, порядок членов — по греческому.
# Глава 36: родословие Исава-Едома (1–19), родословие Сеира Хорреянина (20–30),
# цари Едома до царей Израиля (31–39), старейшины Едома (40–43).
# Имена даны в принятой японской библейской форме; где LXX передаёт имя иначе,
# греческая форма указана в notes. Титул ἡγεμών — 族長[ぞくちょう] («старейшина», глава рода).
# Красного и синего нет; вложенной речи нет. 〔…〕 нет: в gr-lxx-byz есть все слова.
# Сносок ⟨…⟩ нет: 族長, 系図, 側女, 寄留 — понятные слова или уже встречались в корпусе.
