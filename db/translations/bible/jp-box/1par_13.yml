# Давида в Иудее, ковчег на новой колеснице (6–8); Оза и его смерть (9–11);
# страх Давида, ковчег в доме Аведдара (12–14).
# Речь — 「…」: 13:2–3 (Давид), 13:4 (собрание), 13:12 (Давид).
