verses:
  1: "ダビデは千人隊[せんにんたい]の長[かしら]たち、百人隊[ひゃくにんたい]の長たち、すなわちすべての指導者[しどうしゃ]と相談[そうだん]した。"
  2: "ダビデはイスラエルの全会衆[ぜんかいしゅう]に言[い]った。「もしあなたがたが良[よ]しとし、わたしたちの神[かみ]である主[しゅ]が道[みち]を開[ひら]いてくださるなら、イスラエルの全[ぜん]土[ど]に残[のこ]っている兄弟[きょうだい]たち、またその所有[しょゆう]の町[まち]々[まち]にいる祭司[さいし]たちとレビ人[びと]たちのもとへ使者[しし]を送[おく]り、彼らをわたしたちのもとへ集[あつ]めよう。"
  3: "そして、わたしたちの神[かみ]の箱[はこ]をわたしたちのもとへ移[うつ]そう。サウルの日[ひ]々[び]には、わたしたちはそれを求[もと]めなかったからである。」"
  4: "集会[しゅうかい]はみな、そうすることを言[い]った。「そのとおりにしよう。」この言葉[ことば]はすべての民[たみ]の目[め]に正[ただ]しく映[うつ]ったからである。"
  5: "ダビデは、神[かみ]の箱[はこ]をキルヤト・ヤリムの町[まち]から運[はこ]び入[い]れるために、エジプトの国境[こっきょう]からハマトの入口[いりぐち]に至[いた]るまで、イスラエルのすべてを集[あつ]めた。"
  6: "ダビデはそれを運[はこ]び上[のぼ]らせた。イスラエルはみな、ユダにあるダビデの町[まち]へ上[のぼ]って行[い]った。そこから、ケルビムの上[うえ]に座[すわ]る神[かみ]である主[しゅ]の箱[はこ]を運[はこ]び上[あ]げるためである。その名[な]はそこで呼[よ]び求[もと]められている。"
  7: "彼らは神[かみ]の箱[はこ]をアミナダブの家[いえ]から新[あたら]しい車[くるま]に載[の]せた。オザとその兄弟[きょうだい]たちが車を引[ひ]いた。"
  8: "ダビデとイスラエルはみな、神[かみ]の前[まえ]で力[ちから]の限[かぎ]りを尽[つ]くして遊[あそ]び、歌[うた]い、竪琴[たてごと]と琴[こと]、太鼓[たいこ]、シンバル、ラッパで奏[かな]でた。"
  9: "彼らがキドンの脱穀場[だっこくじょう]まで来[き]たとき、オザは箱[はこ]を押[お]さえようとして手[て]を伸[の]ばした。牛[うし]が箱を傾[かたむ]けたからである。"
  10: "主[しゅ]の怒[いか]りはオザに向[む]かって燃[も]え上[あ]がり、主は彼をそこで打[う]たれた。彼が箱に手を伸ばしたからである。彼は神[かみ]の前[まえ]で、そこで死[し]んだ。"
  11: "ダビデは、主[しゅ]がオザに破[やぶ]れを生[しょう]じさせたことを悲[かな]しんだ。それゆえその場所[ばしょ]は今日[きょう]までオザの破れと呼[よ]ばれている。"
  12: "その日[ひ]、ダビデは神[かみ]を恐[おそ]れて言[い]った。「どうしてわたしは、神[かみ]の箱[はこ]をわたしのもとへ迎[むか]え入[い]れられるだろうか。」"
  13: "ダビデは箱[はこ]を自分[じぶん]のもとへ、ダビデの町[まち]へ持[も]ち帰[かえ]さず、ガテ人[じん]オベデ・エドムの家[いえ]へ回[まわ]した。"
  14: "神[かみ]の箱[はこ]はオベデ・エドムの家[いえ]に三[みっ]か月[げつ]とどまった。神[かみ]はオベデ・エドムとそのすべてのものとを祝福[しゅくふく]された。"

notes:
  1: "ἐβουλεύσατο — совещался (βουλεύομαι; слав. «сотвори совет»). χιλίαρχοι καὶ ἑκατόνταρχοι — тысячники и сотники (千人隊, 百人隊). παντὶ ἡγουμένῳ — всякому вождю (すべての指導者); слав. в скобках добавляет «со князи» — редакционная вставка, не внесена."
  2: "τῇ πάσῃ ἐκκλησίᾳ — всему собранию (会衆; ἐκκλησία). εἰ ἐφ᾽ ὑμῖν ἀγαθόν — если вам угодно. παρὰ κυρίου … εὐοδωθῇ — от Господа будет успешно (слав. «благопоспешится»). τοὺς ὑπολελειμμένους — оставшихся. πόλεις κατασχέσεως — города владения (слав. «градех обдержания»). С 2 по 3 — одна речь Давида."
  3: "μετενέγκωμεν — перенесём (μεταφέρω). οὐκ ἐζήτησαν αὐτήν — не искали её (слав. «не взыскахом»), т.е. не обращались к ковчегу. ἀφ᾽ ἡμερῶν Σαουλ — со дней Саула."
  4: "πᾶσα ἡ ἐκκλησία — всё собрание. τοῦ ποιῆσαι οὕτως — сделать так (слав. «да тако будет»). εὐθὴς ὁ λόγος — слово прямое, справедливое (слав. «угодно бысть слово сие»)."
  5: "ἐξεκκλησίασεν — созвал собрание (ἐκκλησιάζω). ἀπὸ ὁρίων Αἰγύπτου — от пределов Египта. ἕως εἰσόδου Ημαθ — до входа в Емаф (слав. «до входа имафова»). ἐκ πόλεως Ιαριμ — из города Иарим (Кириаф-Иарим, キルヤト・ヤリム)."
  6: "ἀνήγαγεν αὐτήν — вознёс её (ἀνάγω). εἰς πόλιν Δαυιδ, ἣ ἦν τοῦ Ιουδα — в город Давида, что в Иудее; по 2 Цар 6:2 это Кириаф-Иарим (キルヤト・ヤリム), в Синод. он назван прямо. καθημένου ἐπὶ χερουβιν — сидящего на херувимах. οὗ ἐπεκλήθη ὄνομα αὐτοῦ — где призвано имя Его (ἐπικαλέω)."
  7: "ἐπέθηκαν — положили (ἐπιτίθημι). ἅμαξα καινή — новая колесница (車). ἦγον — вели (слав. «ведяху»). Αμιναδαβ — Аминадав (アミナダブ, как в 2 Цар 6:3)."
  8: "παίζοντες — играя, веселясь (слав. «играху»). ἐν πάσῃ δυνάμει — всею силою. ψαλτῳδοί — певцы (слав. «в песнех»). κινύρα — кинира (竪琴), νάβλα — псалтирь (琴), τύμπανον — тимпан (太鼓), κύμβαλον — кимвал (シンバル), σάλπιγξ — труба (ラッパ)."
  9: "ἕως τῆς ἅλωνος — до гумна; имени при гумне в гр. нет, оно есть в csl («гумну хидоню») и внесено в текст (キドン); в МТ Нахон (ср. 2 Цар 6:6 — гумно Надава). ἐξέκλινεν ὁ μόσχος — телец наклонил (слав. «юнец уклони»)."
  10: "ἐθυμώθη ὀργῇ — воспылал гневом (θυμόω; слав. «прогневася гневом»). ἐπάταξεν — поразил (πατάσσω). διὰ τὸ ἐκτεῖναι τὴν χεῖρα — за то, что простёр руку; слав. в скобках добавляет «и прикоснуся» — редакционное пояснение, не внесено. ἀπέναντι τοῦ θεοῦ — «напротив Бога», т.е. пред Богом (слав. «пред Богом»)."
  11: "ἠθύμησεν — опечалился, пал духом (ἀθυμέω; слав. «оскорбися»). διέκοψεν … διακοπήν — «прорвал прорывом», поразил (διακόπτω). Διακοπὴ Οζα — «прорыв Озы» (オザの破れ; слав. «пресечение озане»)."
  12: "ἐφοβήθη τὸν θεόν — убоялся Бога (φοβέομαι). Πῶς εἰσοίσω — «как внесу» (εἰσφέρω). πρὸς ἐμαυτόν — к себе."
  13: "οὐκ ἀπέστρεψεν — не возвратил (ἀποστρέφω; слав. «не возврати»). ἐξέκλινεν — уклонил (ἐκκλίνω). Αβεδδαρα τοῦ Γεθθαίου — Аведдар Гефянин (ガテ人オベデ・エドム, как в 2 Цар 6:10; в 15:18 и далее гр. Αβδεδομ — オベデ・エドム)."
  14: "ἐκάθισεν — «сел», остался (καθίζω; слав. «пребываше»). τρεῖς μῆνας — три месяца. εὐλόγησεν ὁ θεὸς Αβεδδαραμ — благословил Бог Аведдара (форма Αβεδδαραμ — винительный падеж)."
