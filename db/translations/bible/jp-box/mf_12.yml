verses:
  1: "そのころ、ある安息日[あんそくび]のこと、イエスは麦畑[むぎばたけ]の間[あいだ]を通[とお]られた。弟子[でし]たちは腹[はら]が減[へ]って、麦[むぎ]の穂[ほ]を摘[つ]み、食[た]べ始[はじ]めた。"
  2: "ファリサイ派[は]の人々[ひとびと]はそれを見[み]ると、イエスに言[い]った。「ご覧[らん]なさい。安息日[あんそくび]にしてはならないことを、あなたの弟子[でし]たちがしている。」"
  3: "イエスは彼[かれ]らに言[い]われた。「<j>ダビデが空腹[くうふく]のとき、連[つ]れの者[もの]たちと一緒[いっしょ]に何[なに]をしたか、あなたがたは読[よ]んだことがないのか。</j>"
  4: "<j>神[かみ]の家[いえ]に踏[ふ]み入[い]り、祭司[さいし]だけに許[ゆる]された供[そな]えのパンを、自分[じぶん]も連[つ]れの者[もの]たちも食[た]べたではないか。</j>"
  5: "<j>それとも、祭司[さいし]たちが安息日[あんそくび]に神殿[しんでん]で安息日[あんそくび]を汚[けが]しても罪[つみ]とされない、と律法[りっぽう]に書[か]いてあるのを、あなたがたは読[よ]んだことがないのか。</j>"
  6: "<j>あなたがたに言[い]うが、神殿[しんでん]よりも大[おお]きなものがここにある。</j>"
  7: "<j>『わたしが望[のぞ]むのは憐[あわ]れみであり、いけにえではない』という言葉[ことば]が何[なに]を意味[いみ]するかをわきまえていたなら、あなたがたは罪[つみ]のない者[もの]たちをとがめなかったであろう。</j>"
  8: "<j>人[ひと]の子[こ]は安息日[あんそくび]の主[しゅ]だからである。</j>」"
  9: "イエスはそこを去[さ]って、彼[かれ]らの会堂[かいどう]に入[はい]られた。"
  10: "そこに、片手[かたて]の萎[な]えた人[ひと]がいた。人々[ひとびと]はイエスを訴[うった]えるため、こう尋[たず]ねた。「安息日[あんそくび]に病気[びょうき]を癒[いや]すことは、律法[りっぽう]で許[ゆる]されているのですか。」"
  11: "イエスは言[い]われた。「<j>あなたがたのうちに、羊[ひつじ]を一匹[いっぴき]持[も]つ者[もの]がいて、それが安息日[あんそくび]に穴[あな]に落[お]ちたら、その羊[ひつじ]をつかんで引[ひ]き上[あ]げない者[もの]がいるだろうか。</j>"
  12: "<j>人間[にんげん]は羊[ひつじ]と比[くら]べようもなく尊[とうと]い。だから、安息日[あんそくび]に善[よ]い行[おこな]いをするのは、禁[きん]じられていない。</j>」"
  13: "それから、その人[ひと]に向[む]かって言[い]われた。「<j>手[て]を伸[の]ばせ。</j>」その人[ひと]が伸[の]ばすと、手[て]はもう片方[かたほう]と同[じ]ように、もとの通[とお]り健康[けんこう]になった。"
  14: "ファリサイ派[は]の人々[ひとびと]はそこを出[で]て、イエスを殺[ころ]す手立[てだ]てを話[はな]し合[あ]った。"
  15: "イエスはそれを知[し]ると、そこを離[はな]れられた。多[おお]くの群衆[ぐんしゅう]がイエスに従[したが]った。イエスはそのすべてを癒[いや]し、"
  16: "自分[じぶん]のことを知[し]らせないようにと、彼[かれ]らを戒[いまし]められた。"
  17: "それは、預言者[よげんしゃ]イザヤによって語[かた]られた言葉[ことば]が成就[じょうじゅ]するためであった。"
  18: "「見[み]よ、わたしが選[えら]んだ、わたしの僕[しもべ]。わたしの心[こころ]にかなった、わたしの愛[あい]する者[もの]。わたしは彼[かれ]にわたしの霊[れい]を授[さず]ける。彼[かれ]は異邦人[いほうじん]に裁[さば]きを告[つ]げ知[し]らせる。"
  19: "彼[かれ]は争[あらそ]わず、叫[さけ]ばず、その声[こえ]を大通[おおどお]りで聞[き]く者[もの]はいない。"
  20: "彼[かれ]は、傷[いた]ついた葦[あし]を折[お]らず、くすぶる灯心[とうしん]を消[け]さない。裁[さば]きを勝[かち]へと導[みちび]き出[だ]すまで、"
  21: "異邦人[いほうじん]は彼[かれ]の名[な]に望[のぞ]みを置[お]く。」"
  22: "そのとき、悪霊[あくりょう]に取[と]りつかれ、目[め]も見[み]えず口[くち]も利[き]けない人[ひと]が、イエスのもとへ連[つ]れられて来[き]た。イエスがその人[ひと]を癒[いや]すと、口[くち]の利[き]けない人[ひと]はものを言[い]い、目[め]も見[み]えるようになった。"
  23: "群衆[ぐんしゅう]はみな驚[おどろ]いて、「この人[ひと]こそ、ダビデの子[こ]なのではないか」と言[い]った。"
  24: "ところが、ファリサイ派[は]の人々[ひとびと]はそれを聞[き]くと、「この者[もの]が悪霊[あくりょう]を追[お]い出[だ]すのは、悪霊[あくりょう]の頭[かしら]ベルゼブルによるほかはない」と言[い]った。"
  25: "イエスは彼[かれ]らの考[かんが]えを見抜[みぬ]いて、言[い]われた。「<j>どんな国[くに]も、自[みずか]ら分裂[ぶんれつ]すれば荒[あ]れ果[は]て、どんな町[まち]や家[いえ]も、自[みずか]ら分裂[ぶんれつ]すれば立[た]ち行[ゆ]かない。</j>"
  26: "<j>サタンがサタンを追[お]い出[だ]すのなら、それは自[みずか]ら分裂[ぶんれつ]したことになる。そんなふうでは、どうしてその国[くに]が立[た]ち行[ゆ]くだろうか。</j>"
  27: "<j>わたしがベルゼブルによって悪霊[あくりょう]を追[お]い出[だ]しているのなら、あなたがたの子[こ]らは、だれによって追[お]い出[だ]しているのか。だから、彼[かれ]らがあなたがたを裁[さば]く者[もの]となる。</j>"
  28: "<j>しかし、わたしが神[かみ]の霊[れい]によって悪霊[あくりょう]を追[お]い出[だ]しているのなら、神[かみ]の国[くに]は、あなたがたのところに臨[のぞ]んでいるのである。</j>"
  29: "<j>また、強[つよ]い者[もの]をまず縛[しば]り上[あ]げない限[かぎ]り、だれがその家[いえ]に押[お]し入[はい]って、家財[かざい]を奪[うば]えるだろうか。縛[しば]ってしまえば、あとはその家[いえ]を荒[あ]らし尽[つ]くす。</j>"
  30: "<j>わたしの側[がわ]にいない者[もの]は、わたしに敵[てき]する者[もの]であり、わたしと一緒[いっしょ]に集[あつ]めない者[もの]は、散[ち]らしている者[もの]である。</j>"
  31: "<j>だから、あなたがたに言[い]う。人[ひと]の犯[おか]す罪[つみ]と冒瀆[ぼうとく]は、どんなものでも赦[ゆる]される。しかし、霊[れい]に対[たい]する冒瀆[ぼうとく]は赦[ゆる]されない。</j>"
  32: "<j>人[ひと]の子[こ]に逆[さか]らう言葉[ことば]を言[い]う者[もの]は赦[ゆる]されるが、{聖霊[せいれい]|聖神[せいしん]}に逆[さか]らう言葉[ことば]を言[い]う者[もの]は、この世[よ]でも来[きた]るべき世[よ]でも赦[ゆる]されない。</j>」"
  33: "「<j>木[き]を良[よ]いものとし、その実[み]も良[よ]いものとせよ。木[き]を悪[わる]いものとし、その実[み]も悪[わる]いものとせよ。木[き]はその実[み]によって分[わ]かるからである。</j>"
  34: "<j>蝮[まむし]の子[こ]らよ。あなたがたは悪[わる]い者[もの]なのに、どうして善[よ]いことを言[い]えようか。心[こころ]に満[み]ちあふれることが、口[くち]から出[で]るのである。</j>"
  35: "<j>善[よ]い人[ひと]は善[よ]い宝[たから]から善[よ]いものを取[と]り出[だ]し、悪[わる]い人[ひと]は悪[わる]い宝[たから]から悪[わる]いものを取[と]り出[だ]す。</j>"
  36: "<j>あなたがたに言[い]う。人[ひと]が語[かた]るむだな言葉[ことば]は、すべて裁[さば]きの日[ひ]にその言[こと]葉[ば]について答[こた]えを求[もと]められる。</j>"
  37: "<j>あなたが義[ぎ]とされるのも、罪[つみ]に定[さだ]められるのも、あなた自身[じしん]の言葉[ことば]によるからである。</j>」"
  38: "すると、律法学者[りっぽうがくしゃ]とファリサイ派[は]の人々[ひとびと]のうちの何人[なんにん]かが、「先生[せんせい]、あなたのしるしを見[み]せてください」と言[い]った。"
  39: "イエスはお答[こた]えになった。「<j>悪[わる]い、姦淫[かんいん]の時代[じだい]の者[もの]たちはしるしを求[もと]めるが、預言者[よげんしゃ]ヨナのしるしのほかには、しるしは与[あた]えられない。</j>"
  40: "<j>ヨナは三日三晩[みっかみばん]、大魚[おおうお]の腹[はら]の中[なか]にいた。それと同[じ]ように、人[ひと]の子[こ]も三日三晩[みっかみばん]、地[ち]の心[こころ]の中[なか]にいるのである。</j>"
  41: "<j>ニネベの人々[ひとびと]は裁[さば]きのとき、この時代[じだい]の人々[ひとびと]と共[とも]に立[た]ち上[あ]がって、この時代[じだい]を罪[つみ]に定[さだ]める。彼[かれ]らはヨナの宣教[せんきょう]によって悔[く]い改[あらた]めたからである。ここに、ヨナにまさるものがある。</j>"
  42: "<j>南[みなみ]の女王[じょおう]は裁[さば]きのとき、この時代[じだい]の人々[ひとびと]と共[とも]に立[た]ち上[あ]がって、この時代[じだい]を罪[つみ]に定[さだ]める。彼女[かのじょ]はソロモンの知恵[ちえ]を聞[き]くために、地[ち]の果[は]てから来[き]たからである。ここに、ソロモンにまさるものがある。</j>」"
  43: "「<j>汚[けが]れた霊[れい]が人[ひと]から出[で]て行[い]くとき、水[みず]のない所[ところ]を巡[めぐ]り歩[ある]いて、休[やす]む場所[ばしょ]を求[もと]めるが、見[み]つからない。</j>"
  44: "<j>そこで、『出[で]て来[き]た自分[じぶん]の家[いえ]に戻[もど]ろう』と言[い]う。戻[もど]ってみると、家[いえ]は空[あ]いており、掃[は]き清[きよ]められ、整[ととの]えられていた。</j>"
  45: "<j>そこで、出[で]かけて行[い]き、自分[じぶん]より悪[わる]い霊[れい]を七[なな]つ連[つ]れて戻[もど]り、この人[ひと]に入[はい]り込[こ]んで住[す]みついてしまう。こうして、その人[ひと]の末[すえ]は初[はじ]めより悪[わる]くなる。この悪[わる]い時代[じだい]も、その通[とお]りになるであろう。</j>」"
  46: "イエスがまだ群衆[ぐんしゅう]に話[はな]しておられると、母[はは]と兄弟[きょうだい]たちが、イエスと話[はな]そうと外[そと]に立[た]っていた。"
  47: "すると、ある人[ひと]がイエスに言[い]った。「ご覧[らん]なさい。あなたの母[はは]と兄弟[きょうだい]たちが、お話[はなし]ししようと外[そと]に立[た]っておられます。」"
  48: "しかし、イエスはそう言[い]った人[ひと]に答[こた]えられた。「<j>だれがわたしの母[はは]か。だれがわたしの兄弟[きょうだい]か。</j>」"
  49: "そして、弟子[でし]たちに手[て]を差[さ]し伸[の]べて言[い]われた。「<j>ほら、ここにいるのがわたしの母[はは]であり、わたしの兄弟[きょうだい]だ。</j>"
  50: "<j>天[てん]におられるわたしの父[ちち]の御心[みこころ]を行[おこな]う者[もの]は、その人[ひと]がわたしの兄弟[きょうだい]であり、姉妹[しまい]であり、母[はは]なのだ。</j>」"

notes:
  1: "ἐν ἐκείνῳ τῷ καιρῷ — «в то время»; jp-ni опускает, оставил そのころ. τοῖς σάββασιν (мн. ч.) — ある安息日のこと."
  2: "Слова фарисеев — не красные. ἰδού передано ご覧なさい; порядок слов в цитате подстроен под японский."
  6: "τοῦ ἱεροῦ μεῖζόν ἐστιν — средний род, «нечто большее храма»; поэтому 大きなもの, а не 者. Так же 12:41-42 (πλεῖον Ἰωνᾶ / Σολομῶνος)."
  7: "Ос 6:6."
  10: "χεῖρα ἔχων ξηράν — «руку имеющий сухую», т. е. одна рука; 片手の萎えた人."
  12: "πόσῳ διαφέρει — «насколько же больше»; 比べようもなく尊い. ὥστε ἔξεστιν — «итак, позволительно»; 禁じられていない."
  18: "Ис 42:1-4; это пророчество, а не слова Христа — не красные. ὁ παῖς μου — 僕."
  20: "λίνον τυφόμενον — «курящийся лён» (фитиль); 灯心. εἰς νῖκος — «к победе»."
  22: "κωφός здесь «немой» (λαλεῖν; ср. 9:32), поэтому 口の利けない."
  28: "πνεύματι θεοῦ — 神の霊 (не 聖霊, кальки нет); βασιλεία τοῦ θεοῦ — 神の国, единственное τοῦ θεοῦ в этой главе."
  31: "ἡ τοῦ πνεύματος βλασφημία — без ἁγίου, поэтому 霊. В ст. 32 уже τοῦ πνεύματος τοῦ ἁγίου — 聖霊, с калькой."
  33: "ἢ ποιήσατε … ἢ ποιήσατε — повелительное наклонение («признайте»), не условие; поэтому 〜とせよ."
  36: "ἀργόν — «праздное, пустое»; むだな言葉. ἀποδώσουσιν λόγον — «дадут отчёт»."
  39: "γενεὰ πονηρὰ καὶ μοιχαλίς — «род лукавый и прелюбодейный»."
  40: "καρδία τῆς γῆς — «сердце земли» (евр. идиома «недра»); сохранил образ 地の心 (jp-joc так же), jp-ni сглаживает до 大地の中. У Мф в критической базе «три дня и три ночи» в обоих членах."
  41: "πλεῖον Ἰωνᾶ — средний род: まさるもの. μετενόησαν εἰς τὸ κήρυγμα — «покаялись от проповеди»."
  43: "ἀκάθαρτον πνεῦμα — 汚れた霊 (в отличие от 悪霊 = δαιμόνιον)."
  47: "В критической базе стих в квадратных скобках; Церковь читает — весь стих в 〔…〕 (как Мк 7:16, 9:44)."
  50: "ὅστις ἐὰν ποιήσῃ — «кто бы ни исполнил»; ἀδελφὴ — 姉妹, в греч. ед. ч."
