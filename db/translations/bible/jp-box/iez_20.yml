notes:
  1: "ἐν τῷ ἔτει τῷ ἑβδόμῳ… δεκάτῃ τοῦ μηνός — «в седьмой год, в пятый месяц, в десятый день месяца»: точная дата, ср. 1:1–2; ἦλθον ἄνδρες ἐκ τῶν πρεσβυτέρων οἴκου Ισραηλ — «пришли мужи из старейшин дома Израилева»; ἐπερωτῆσαι τὸν κύριον — «вопросить Господа» (ἐπερωτάω); ἐκάθισαν πρὸ προσώπου μου."
  2: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — формула начала речи."
  3: "Εἰ ἐπερωτῆσαί με ὑμεῖς ἔρχεσθε; — «разве вопросить Меня вы приходите?»; ζῶ ἐγὼ εἰ ἀποκριθήσομαι ὑμῖν — клятва «живу Я, если отвечу вам» (= не отвечу), ср. 20:31; λέγει κύριος."
  4: "εἰ ἐκδικήσω αὐτοὺς ἐκδικήσει; — «если отмщу им отмщением?» (ἐκδικέω, cognatus) — «будешь ли судиться с ними?»; τὰς ἀνομίας τῶν πατέρων αὐτῶν διαμάρτυραι αὐτοῖς — «беззакония отцов их засвидетельствуй им» (διαμαρτύρομαι)."
  5: "ἀφ᾽ ἧς ἡμέρας ᾑρέτισα τὸν οἶκον Ισραηλ — «с того дня, как Я избрал дом Израилев» (αἱρετίζω — избирать); ἐγνωρίσθην τῷ σπέρματι οἴκου Ιακωβ — «явил Себя семени дома Иакова» (γνωρίζω); ἀντελαβόμην τῇ χειρί μου αὐτῶν — «взял (поднял) руку Мою на них» (ἀντιλαμβάνομαι) — жест клятвы; слова клятвы Ἐγὼ κύριος ὁ θεὸς ὑμῶν — 『…』."
  6: "ἀντελαβόμην τῇ χειρί μου αὐτῶν τοῦ ἐξαγαγεῖν — «поднял руку Мою, чтобы вывести их»; γῆν ῥέουσαν γάλα καὶ μέλι — «землю, текущую молоком и мёдом» (γάλα, μέλι); κηρίον ἐστὶν παρὰ πᾶσαν τὴν γῆν — «медовый сот она перед всею землёю», т. е. лучшая из земель (κηρίον — сот)."
  7: "Ἕκαστος τὰ βδελύγματα τῶν ὀφθαλμῶν αὐτοῦ ἀπορριψάτω — «каждый мерзости очей своих да отвергнет» (βδέλυγμα, ἀπορρίπτω); ἐν τοῖς ἐπιτηδεύμασιν Αἰγύπτου μὴ μιαίνεσθε — «делами (обычаями) Египта не оскверняйтесь» (ἐπιτήδευμα, μιαίνω)."
  8: "ἀπέστησαν ἀπ᾽ ἐμοῦ — «отступили от Меня» (ἀφίστημι); οὐκ ἠθέλησαν εἰσακοῦσαί μου — «не захотели послушать Меня»; τοῦ ἐκχέαι τὸν θυμόν μου… τοῦ συντελέσαι τὴν ὀργήν μου — «излить гнев Мой… завершить ярость Мою» (ἐκχέω, συντελέω)."
  9: "ἐποίησα ὅπως τὸ ὄνομά μου τὸ παράπαν μὴ βεβηλωθῇ — «поступил так, чтобы имя Моё вовсе не осквернилось» (βεβηλόω); ἐνώπιον τῶν ἐθνῶν, ὧν αὐτοί εἰσιν ἐν μέσῳ αὐτῶν — «пред народами, среди которых они»; ἐγνώσθην πρὸς αὐτοὺς ἐνώπιον αὐτῶν — «познан был ими пред ними»."
  10: "ἐξήγαγον αὐτοὺς ἐκ γῆς Αἰγύπτου καὶ ἤγαγον αὐτοὺς εἰς τὴν ἔρημον — «вывел их из земли Египетской и привёл их в пустыню»."
  11: "ἔδωκα αὐτοῖς τὰ προστάγματά μου — «дал им уставы (заповеди) Мои» (πρόσταγμα, 掟); τὰ δικαιώματά μου ἐγνώρισα αὐτοῖς — «определения Мои объявил им» (δικαίωμα, 定め); ὅσα ποιήσει αὐτὰ ἄνθρωπος καὶ ζήσεται ἐν αὐτοῖς — «которые исполнит человек и будет жив в них»."
  12: "τὰ σάββατά μου ἔδωκα αὐτοῖς — «субботы Мои дал им»; εἰς σημεῖον ἀνὰ μέσον ἐμοῦ καὶ ἀνὰ μέσον αὐτῶν — «в знамение между Мною и ими» (σημεῖον, しるし); ἐγὼ κύριος ὁ ἁγιάζων αὐτούς — «Я Господь, освящающий их» (ἁγιάζω, 聖とする)."
  13: "καὶ εἶπα πρὸς τὸν οἶκον τοῦ Ισραηλ… Ἐν τοῖς προστάγμασίν μου πορεύεσθε — «и сказал Я дому Израилеву… в заповедях Моих ходите»: слова Бога в 『…』; οὐκ ἐπορεύθησαν — «не пошли»; τὰ δικαιώματά μου ἀπώσαντο — «определения Мои отвергли» (ἀπωθέω); ἐβεβήλωσαν σφόδρα — «осквернили весьма» (βεβηλόω); τοῦ ἐξαναλῶσαι αὐτούς — «чтобы истребить их» (ἐξαναλίσκω)."
  14: "ἐποίησα ὅπως τὸ ὄνομά μου… μὴ βεβηλωθῇ ἐνώπιον τῶν ἐθνῶν — «поступил, чтобы имя Моё не осквернилось пред народами»; ὧν ἐξήγαγον αὐτοὺς κατ᾽ ὀφθαλμοὺς αὐτῶν — «которых вывел их на глазах у них»."
  15: "ἐξῆρα τὴν χεῖρά μου ἐπ᾽ αὐτοὺς — «поднял руку Мою на них» (клятва); τὸ παράπαν τοῦ μὴ εἰσαγαγεῖν αὐτοὺς — «вовсе не ввести их»; γῆν ῥέουσαν γάλα καὶ μέλι, κηρίον… — повтор 20:6."
  16: "τὰ δικαιώματά μου ἀπώσαντο — «определения Мои отвергли»; ἐν τοῖς προστάγμασίν μου οὐκ ἐπορεύθησαν — «по заповедям Моим не ходили»; ὀπίσω τῶν ἐνθυμημάτων τῶν καρδιῶν αὐτῶν ἐπορεύοντο — «вслед помышлений сердца своего ходили» (ἐνθύμημα)."
  17: "ἐφείσατο ὁ ὀφθαλμός μου ἐπ᾽ αὐτοὺς τοῦ ἐξαλεῖψαι αὐτοὺς — «пощадил глаз Мой их, чтобы истребить их» (φείδομαι, ἐξαλείφω); οὐκ ἐποίησα αὐτοὺς εἰς συντέλειαν — «не сделал им конца» (συντέλεια)."
  18: "Ἐν τοῖς νομίμοις τῶν πατέρων ὑμῶν μὴ πορεύεσθε — «по законам (уставам) отцов ваших не ходите» (νόμιμος); τὰ δικαιώματα αὐτῶν μὴ φυλάσσεσθε; ἐν τοῖς ἐπιτηδεύμασιν αὐτῶν μὴ συναναμίσγεσθε — «с делами их не смешивайтесь» (συναναμίγνυμι). csl вместо «их» читает «египетским» — держим csl."
  19: "ἐγὼ κύριος ὁ θεὸς ὑμῶν — «Я Господь Бог ваш»; ἐν τοῖς προστάγμασίν μου πορεύεσθε — «по заповедям Моим ходите»; τὰ δικαιώματά μου φυλάσσεσθε καὶ ποιεῖτε αὐτά — «определения Мои храните и исполняйте их»."
  20: "τὰ σάββατά μου ἁγιάζετε — «субботы Мои освящайте» (ἁγιάζω); ἔστω εἰς σημεῖον ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν — «да будет в знамение между Мною и вами»; τοῦ γινώσκειν διότι ἐγὼ κύριος ὁ θεὸς ὑμῶν."
  21: "παρεπίκρανάν με — «прогневали (огорчили) Меня» (παραπικραίνω); οὐκ ἐφυλάξαντο τοῦ ποιεῖν αὐτά — «не сохранили, чтобы исполнять их»; τὰ σάββατά μου ἐβεβήλουν — «субботы Мои оскверняли»; τοῦ συντελέσαι τὴν ὀργήν μου — «чтобы завершить ярость Мою»."
  22: "ἐποίησα ὅπως τὸ ὄνομά μου… μὴ βεβηλωθῇ ἐνώπιον τῶν ἐθνῶν — повтор 20:14 (в ru/МТ «отклонил руку Мою» — нет в LXX, не внесено)."
  23: "ἐξῆρα τὴν χεῖρά μου ἐπ᾽ αὐτοὺς ἐν τῇ ἐρήμῳ — «поднял руку Мою на них в пустыне»; τοῦ διασκορπίσαι αὐτοὺς ἐν τοῖς ἔθνεσιν — «рассеять их по народам» (διασκορπίζω); διασπεῖραι αὐτοὺς ἐν ταῖς χώραις — «развеять их по странам» (διασπείρω)."
  24: "τὰ δικαιώματά μου οὐκ ἐποίησαν — «определений Моих не исполняли»; ὀπίσω τῶν ἐνθυμημάτων τῶν πατέρων αὐτῶν ἦσαν οἱ ὀφθαλμοὶ αὐτῶν — «вслед помыслов отцов их были очи их»."
  25: "ἔδωκα αὐτοῖς προστάγματα οὐ καλὰ — «дал им уставы недобрые»; δικαιώματα ἐν οἷς οὐ ζήσονται ἐν αὐτοῖς — «определения, в которых они не будут живы»: попущение в наказание (ср. Рим 1:24)."
  26: "μιανῶ αὐτοὺς ἐν τοῖς δόμασιν αὐτῶν — «оскверню их дарами их» (δόμα); ἐν τῷ διαπορεύεσθαι πᾶν διανοῖγον μήτραν — «когда проходит всякое разверзающее ложесна» (διανοίγω, μήτρα): первенцы через огонь; ὅπως ἀφανίσω αὐτούς — «чтобы истребить их» (ἀφανίζω). csl добавляет «да уразумеют, яко аз Господь» — нет в LXX, внесено."
  27: "Ἕως τούτου παρώργισάν με οἱ πατέρες ὑμῶν — «до сего прогневали Меня отцы ваши» (παροργίζω); ἐν τοῖς παραπτώμασιν αὐτῶν, ἐν οἷς παρέπεσον εἰς ἐμέ — «в преступлениях своих, которыми преступили против Меня» (παράπτωμα, παραπίπτω)."
  28: "ἔθυσαν ἐκεῖ τοῖς θεοῖς αὐτῶν — «принесли там жертвы богам своим» (θύω); ἔταξαν ἐκεῖ ὀσμὴν εὐωδίας — «поставили там благоухание»; ἔσπεισαν… σπονδὰς αὐτῶν — «возлили возлияния свои» (σπένδω, σπονδή); csl добавляет «ярость даров своих» — нет в LXX, внесено."
  29: "Τί ἐστιν Αβαμα, ὅτι ὑμεῖς εἰσπορεύεσθε ἐκεῖ; — «что такое Авама (высота), что вы входите туда?» (евр. במה, bamah — высота, 高み); ἐπεκάλεσαν τὸ ὄνομα αὐτοῦ Αβαμα ἕως τῆς σήμερον ἡμέρας — «назвали имя его Авама до сего дня»."
  30: "Εἰ ἐν ταῖς ἀνομίαις τῶν πατέρων ὑμῶν ὑμεῖς μιαίνεσθε — «разве вы не оскверняетесь беззакониями отцов ваших?»; ὀπίσω τῶν βδελυγμάτων αὐτῶν ὑμεῖς ἐκπορνεύετε — «вслед мерзостей их вы блудите» (βδέλυγμα, ἐκπορνεύω)."
  31: "ἐν ταῖς ἀπαρχαῖς τῶν δομάτων ὑμῶν — «в начатках даров ваших» (ἀπαρχή, δόμα); ἐν τοῖς ἀφορισμοῖς — «в отделениях (посвящениях)» (ἀφορισμός); ἐγὼ ἀποκριθῶ ὑμῖν… εἰ ἀποκριθήσομαι ὑμῖν — «Я отвечу вам?… если отвечу вам» (= не отвечу); csl добавляет «аще взыдет на дух ваш сие» — нет в LXX, внесено."
  32: "Ἐσόμεθα ὡς τὰ ἔθνη καὶ ὡς αἱ φυλαὶ τῆς γῆς — «будем, как народы и как племена земли»; λατρεύειν ξύλοις καὶ λίθοις — «служить деревам и камням» (λατρεύω); καὶ οὐκ ἔσται ὃν τρόπον ὑμεῖς λέγετε — «и не будет так, как вы говорите». Слова народа — 『…』."
  33: "ἐν χειρὶ κραταιᾷ καὶ ἐν βραχίονι ὑψηλῷ — «рукой крепкой и мышцей высокой» (κραταιός, βραχίων); ἐν θυμῷ κεχυμένῳ — «в излиянном гневе» (χέω); βασιλεύσω ἐφ᾽ ὑμᾶς — «буду царствовать над вами» (βασιλεύω)."
  34: "ἐξάξω ὑμᾶς ἐκ τῶν λαῶν — «выведу вас из народов»; εἰσδέξομαι ὑμᾶς ἐκ τῶν χωρῶν — «приму вас из стран» (εἰσδέχομαι); οὗ διεσκορπίσθητε ἐν αὐταῖς — «где вы были рассеяны» (διασκορπίζω)."
  35: "εἰς τὴν ἔρημον τῶν λαῶν — «в пустыню народов»; διακριθήσομαι πρὸς ὑμᾶς ἐκεῖ — «буду судиться с вами там» (διακρίνω — разбирать, судить); πρόσωπον κατὰ πρόσωπον — «лицом к лицу»."
  36: "ὃν τρόπον διεκρίθην πρὸς τοὺς πατέρας ὑμῶν ἐν τῇ ἐρήμῳ γῆς Αἰγύπτου — «как Я судился с отцами вашими в пустыне земли Египетской»; οὕτως κρινῶ ὑμᾶς — «так буду судить вас»."
  37: "διάξω ὑμᾶς ὑπὸ τὴν ῥάβδον μου — «проведу вас под жезлом Моим» (διάγω; ῥάβδος — 杖); εἰσάξω ὑμᾶς ἐν ἀριθμῷ — «введу вас в числе» (ἀριθμός): образ счёта овец; csl добавляет «завета» — нет в LXX, внесено."
  38: "ἐκλέξω ἐξ ὑμῶν τοὺς ἀσεβεῖς καὶ τοὺς ἀφεστηκότας — «изберу из вас нечестивых и отступивших» (ἀσεβής, ἀφίστημι); ἐκ τῆς παροικεσίας αὐτῶν ἐξάξω αὐτοὺς — «из пришельства (обитания) их выведу их» (παροικεσία)."
  39: "Ἕκαστος τὰ ἐπιτηδεύματα αὐτοῦ ἐξάρατε — «каждый дела свои устраните» (ἐξαίρω); εἰ μὴ ὑμεῖς εἰσακούετέ μου — «если вы не слушаете Меня» (εἰ μή — отрицание; csl читает «аще послушаете» без отрицания — держим csl, отмечено); τὸ ὄνομά μου τὸ ἅγιον οὐ βεβηλώσετε οὐκέτι — «имени Моего святого не оскверните более» (βεβηλόω)."
  40: "ἐπὶ τοῦ ὄρους τοῦ ἁγίου μου, ἐπ᾽ ὄρους ὑψηλοῦ — «на горе святой Моей, на горе высокой»; εἰς τέλος — «до конца», т. е. все до конца; ἐπισκέψομαι τὰς ἀπαρχὰς ὑμῶν — «потребую (посещу) начатки ваши» (ἐπισκέπτομαι); τὰς ἀπαρχὰς τῶν ἀφορισμῶν ὑμῶν — «начатки отделений (посвящений) ваших» (ἀφορισμός)."
  41: "ἐν ὀσμῇ εὐωδίας προσδέξομαι ὑμᾶς — «в запахе благоухания приму вас» (ὀσμή, εὐωδία); ἁγιασθήσομαι ἐν ὑμῖν — «освящусь в вас» (ἁγιάζω, страдат.); κατ᾽ ὀφθαλμοὺς τῶν λαῶν — «на глазах народов»."
  42: "εἰς ἣν ἦρα τὴν χεῖρά μου τοῦ δοῦναι αὐτὴν τοῖς πατράσιν ὑμῶν — «в которую Я поднял руку Мою, чтобы дать её отцам вашим»; ἐπιγνώσεσθε ὅτι ἐγὼ κύριος — «узнаете, что Я Господь»."
  43: "μνησθήσεσθε ἐκεῖ τὰς ὁδοὺς ὑμῶν — «вспомните там пути ваши»; ἐν οἷς ἐμιαίνεσθε — «которыми вы осквернялись» (μιαίνω); κόψεσθε τὰ πρόσωπα ὑμῶν — «будете бить лица ваши» (κόπτω) — знак стыда."
  44: "ἐν τῷ ποιῆσαί με οὕτως ὑμῖν — «когда Я сделаю так вам»; ὅπως τὸ ὄνομά μου μὴ βεβηλωθῇ — «чтобы имя Моё не осквернилось»; κατὰ τὰς ὁδοὺς ὑμῶν τὰς κακάς — «не по путям вашим злым» (в ru/МТ «ради имени Моего»); csl добавляет обращение «доме израилев» — нет в LXX, внесено. Здесь речь Господа (20:3–44) закрывается."
  45: "gr 21:1 Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: в слав. это 20:45, а в gr-lxx-byz — начало 21-й главы; новый зачин после 20:44."
  46: "gr 21:2 στήρισον τὸ πρόσωπόν σου ἐπὶ Θαιμαν — «утверди лицо твоё на Феман (юг)» (στηρίζω); ἐπίβλεψον ἐπὶ Δαρωμ — «воззри на Даром (юг)»; προφήτευσον ἐπὶ δρυμὸν ἡγούμενον Ναγεβ — «прорицай на дубраву начальствующую Негев» (δρυμός — дубрава, 森; ἡγούμενον — ведущий, главный); csl «на дубрану старейшину нагева» (можно понять и как «древний»), в тексте 古い森. Слав. 20:46."
  47: "gr 21:3 Ἰδοὺ ἐγὼ ἀνάπτω ἐν σοὶ πῦρ — «вот, Я зажигаю в тебе огонь» (ἀνάπτω); καταφάγεται… πᾶν ξύλον χλωρὸν καὶ πᾶν ξύλον ξηρόν — «пожрёт всякое дерево зелёное и всякое дерево сухое» (χλωρός); ἀπὸ ἀπηλιώτου ἕως βορρᾶ — «от востока до севера» (ἀπηλιώτης — восток), csl «от полудне до севера» — держим csl (南から北まで). Слав. 20:47."
  48: "gr 21:4 ἐπιγνώσονται πᾶσα σὰρξ — «узнает всякая плоть» (σάρξ); ἐξέκαυσα αὐτό — «Я зажёг его» (ἐκκαίω); οὐ σβεσθήσεται — «не угаснет» (σβέννυμι). Слав. 20:48."
  49: "gr 21:5 καὶ εἶπα Μηδαμῶς, κύριε κύριε — «и сказал я: никак, Господи Господи!» (μηδαμῶς — отнюдь нет); αὐτοὶ λέγουσιν πρός με Οὐχὶ παραβολή ἐστιν λεγομένη αὕτη; — «они говорят мне: не притча ли это говоримая?». Слова пророка — 「…」, слова народа — 『…』. Слав. 20:49; в гр. модуле — 21:5."
