# jp-box, Иезекииль, глава 20. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: в этой главе 49 стихов. Стихи 1–44 = gr 20:1–44;
# стихи 45–49 = gr 21:1–5 («обрати лицо на юг… притча ли это?»), которые в славянской
# Библии стоят как 20:45–49, а в gr-lxx-byz открывают 21-ю главу. Поэтому:
#   • 20:45 = gr 21:1, 20:46 = gr 21:2, 20:47 = gr 21:3, 20:48 = gr 21:4, 20:49 = gr 21:5;
#   • csl-контроль для 45–49 берётся из csl 20:45–49 (в модуле на этих местах стоит
#     именно слав. 20:45–49; в слав. Библии эта речь отнесена к 20-й главе, а не к 21-й).
# Переход от 20:44 к 20:45 — новый зачин «И было слово Господне», начало новой речи.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–4 старейшины приходят вопросить Господа и получают отказ; 5–9 избрание
# в Египте и клятва вывести, но отцы возмутились; 10–17 пустыня: закон и суббота,
# возмущение и пощада; 18–26 дети в пустыне, недобрые уставы, первенцы через огонь;
# 27–31 хула на высотах и в дарах, отказ отвечать; 32–38 «будем, как народы» — не
# сбудется: суд в пустыне народов, жезл и число; 39–44 святая гора, очищение и
# «узнаете, что Я Господь»; 45–49 (слав. 20:45–49) огонь на южный лес и ропот на притчу.
# Речь: 20:1–2 — вне кавычек; 20:3–44 — одна непрерывная речь Господа в 「…».
# Внутри: 20:5 — слова клятвы в 『…』; 20:13 — слова Бога отцам в 『…』; 20:32 — слова
# народа в 『…』. 20:45 — формула вне кавычек; 20:46–48 — слово Господа в 「…»;
# 20:49 — ответ пророка в 「…» с словами народа в 『…』.
# Паритет: 20:13 csl/LXX цитируют повеление «в заповедях Моих ходите»; 20:18 csl
# читает «египетским» вместо «их» (LXX αὐτῶν) — держим csl; 20:26 csl добавляет
# «да уразумеют, яко аз Господь» — нет в LXX, внесено; 20:28 csl добавляет «ярость
# даров своих» — нет в LXX, внесено; 20:31 csl добавляет «аще взыдет на дух ваш сие» —
# нет в LXX, внесено; 20:37 csl добавляет «завета» — нет в LXX; 20:47 LXX «от востока
# до севера» (ἀπηλιώτου), csl «от полудне» (юг) — держим csl.

