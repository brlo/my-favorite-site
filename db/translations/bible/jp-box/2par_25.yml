verses:
  1: "アマツヤは二十五歳[にじゅうごさい]で王[おう]となり、エルサレムで二十九年[にじゅうきゅうねん]治[おさ]めた。母[はは]の名[な]はヨアディンといい、エルサレムの出[で]であった。"
  2: "彼[かれ]は主[しゅ]の前[まえ]に正[ただ]しいことを行[おこな]ったが、心[こころ]は十分[じゅうぶん]ではなかった。"
  3: "王国[おうこく]が彼の手[て]に確[たし]かになると、彼は自分[じぶん]の父[ちち]である王[おう]を殺[ころ]した僕[しもべ]たちを殺した。"
  4: "しかし、その子[こ]らは殺[ころ]さなかった。主[しゅ]の律法[りっぽう]の契約[けいやく]に従[したが]い、モーセの律法の書[しょ]に書[か]かれているとおりである。主が命[めい]じて言[い]われた。「父[ちち]たちは子らのために死[し]なず、子らも父たちのために死なない。それぞれ自分[じぶん]の罪[つみ]によって死ぬ。」"
  5: "アマツヤはユダの家[いえ]を集[あつ]め、父[ちち]の家ごとに千人[せんにん]の長[かしら]と百人[ひゃくにん]の長を置[お]いて、ユダとベニヤミンの全土[ぜんど]に配置[はいち]した。そして二十歳[にじゅうさい]以上[いじょう]の者を数[かぞ]え、槍[やり]と盾[たて]を取[と]って戦[たたか]いに出[で]る勇士[ゆうし]が三十万[さんじゅうまん]人[にん]いるのを見[み]いだした。"
  6: "また、イスラエルから勇士[ゆうし]十万[じゅうまん]人[にん]を、銀[ぎん]百[ひゃく]タラントで雇[やと]った。"
  7: "すると神[かみ]の人[ひと]が彼[かれ]のもとに来[き]て言[い]った。「王[おう]よ、イスラエルの軍勢[ぐんぜい]をあなたとともに行[い]かせてはならない。主[しゅ]はエフライムの子[こ]らであるイスラエルのすべてとともにはおられないからである。"
  8: "たとえあなたがこの者[もの]たちによって強[つよ]くなろうと思[おも]っても、主[しゅ]はあなたを敵[てき]の前[まえ]で敗走[はいそう]させる。強くすることも、敗走させることも、主によるのだからである。」"
  9: "アマツヤは神[かみ]の人[ひと]に言[い]った。「では、イスラエルの軍勢[ぐんぜい]に与[あた]えた百[ひゃく]タラントはどうしたらよいのか。」神の人は言った。「主[しゅ]は、それよりも多[おお]くをあなたに与えることができる。」"
  10: "アマツヤは、自分[じぶん]のもとへ来[き]たエフライムからの軍勢[ぐんぜい]を、自分の場所[ばしょ]へ帰[かえ]らせた。すると彼[かれ]らはユダに対[たい]して激[はげ]しく怒[いか]り、怒りの炎[ほのお]を抱[いだ]いたまま自分の場所へ帰って行[い]った。"
  11: "アマツヤは勇[いさ]み、自分[じぶん]の民[たみ]を率[ひき]いて塩[しお]の谷[たに]へ行[い]き、そこでセイルの子[こ]ら一万人[いちまんにん]を打[う]った。"
  12: "ユダの子[こ]らは一万人[いちまんにん]を生[い]けどりにし、それを岩[いわ]の頂[いただき]へ連[つ]れて行[い]って、岩の頂から投[な]げ落[お]とした。彼[かれ]らはみな、たたき割[わ]れた。"
  13: "しかし、アマツヤが戦[たたか]いに同行[どうこう]させずに帰[かえ]らせた軍勢[ぐんぜい]の者[もの]たちは、サマリアからベト・ホロンに至[いた]るユダの町[まち]々[まち]を襲[おそ]い、そのうちの三千人[さんぜんにん]を打[う]ち殺[ころ]して、多[おお]くの分捕[ぶんど]り品[ひん]を奪[うば]った。"
  14: "アマツヤはエドムを打[う]ち破[やぶ]って帰[かえ]った後[のち]、セイルの子[こ]らの神[かみ]々[がみ]を自分[じぶん]のところへ持[も]ち帰り、それらを自分の神としたて、その前[まえ]にひれ伏[ふ]し、自分もそれらに犠牲[ぎせい]をささげた。"
  15: "主[しゅ]の怒[いか]りがアマツヤに下[くだ]り、主は預言者[よげんしゃ]たちを彼[かれ]のもとへ遣[つか]わした。彼らは彼に言[い]った。「あなたはなぜ、自分[じぶん]の民[たみ]をあなたの手[て]から救[すく]い出[だ]せなかった民の神[かみ]々[がみ]を求[もと]めたのか。」"
  16: "彼[かれ]が語[かた]っていると、王[おう]は彼に言[い]った。「だれがあなたを王の顧問[こもん]にしたのか。気[き]をつけよ。むち打[う]ちにされないように。」そこで預言者[よげんしゃ]は黙[だま]り、言った。「私[わたし]は知[し]っている。神[かみ]があなたを滅[ほろ]ぼすことを決[き]めたのだ。あなたがこのことを行[おこな]い、私の忠告[ちゅうこく]に聞[き]き従[したが]わなかったからである。」"
  17: "アマツヤは相談[そうだん]の上[うえ]、イエフの子[こ]ヨアハズの子であるイスラエルの王[おう]ヨアシュに使者[ししゃ]を遣[つか]わして言[い]った。「さあ、顔[かお]を合[あ]わせよう。」"
  18: "イスラエルの王[おう]ヨアシュは、ユダの王アマツヤに遣[つか]わして言[い]った。「レバノンの茨[いばら]はレバノンの杉[すぎ]に遣わして言った。『あなたの娘[むすめ]をわたしの子[こ]の妻[つま]に与[あた]えよ』と。すると、レバノンの野[の]の獣[けもの]たちが通[とお]って、その茨を踏[ふ]みつけた。"
  19: "あなたは言[い]った。『見[み]よ、わたしはエドムを打[う]ち破[やぶ]った』と。そのため心[こころ]は高[たか]ぶって慢心[まんしん]している。今[いま]は自分[じぶん]の家[いえ]に座[すわ]っていなさい。なぜ、あなたは災[わざわ]いを招[まね]く争[あらそ]いをするのか。あなたも、あなたとともにユダも倒[たお]れるであろう。」"
  20: "しかし、アマツヤは聞[き]かなかった。これは主[しゅ]から出[で]たことで、彼を敵[てき]の手[て]に渡[わた]すためであった。彼がエドムの神[かみ]々[がみ]を求[もと]めたからである。"
  21: "そこでイスラエルの王[おう]ヨアシュは上[のぼ]って来[き]た。彼とユダの王アマツヤは、ユダにあるベト・シェメシュで顔[かお]を合[あ]わせた。"
  22: "ユダはイスラエルの前[まえ]で打[う]ち負[ま]かされ、それぞれ自分[じぶん]の天幕[てんまく]へ逃[に]げた。"
  23: "イスラエルの王[おう]ヨアシュは、ユダの王アマツヤ、すなわちヨアシュの子[こ]、アハズヤの子をベト・シェメシュで捕[と]らえ、エルサレムに連[つ]れて来[き]て、エルサレムの城壁[じょうへき]をエフライムの門[もん]から隅[すみ]の門まで四百[よんひゃく]キュビト壊[こわ]した。"
  24: "彼は主[しゅ]の家[いえ]で見[み]つかった金[きん]と銀[ぎん]、すべての器[うつわ]、およびオベデ・エドムのもとにあったもの、王[おう]の家の宝[たから]、さらに人質[ひとじち]たちを取[と]って、サマリアへ帰[かえ]った。"
  25: "アマツヤ、すなわちヨアシュの子[こ]であるユダの王[おう]は、ヨアハズの子であるイスラエルの王ヨアシュが死[し]んだ後[のち]、十五年[じゅうごねん]生[い]きた。"
  26: "アマツヤの残[のこ]りの言葉[ことば]、最初[さいしょ]から最後[さいご]まで、見[み]よ、ユダとイスラエルの王[おう]たちの書[しょ]に記[しる]されているではないか。"
  27: "アマツヤが主[しゅ]から離[はな]れた後[のち]、エルサレムで彼に対[たい]する謀[む]が企[くわだ]てられた。彼はラキシュへ逃[に]げたが、人[ひと]々[びと]は彼の後[あと]を追[お]ってラキシュへ人[ひと]を遣[つか]わし、そこで彼を殺[ころ]した。"
  28: "人[ひと]々[びと]は彼を馬[うま]に乗[の]せて運[はこ]び、ダビデの町[まち]で父[ちち]たちとともに葬[ほうむ]った。"

notes:
  1: "Ὢν πέντε καὶ εἴκοσι ἐτῶν — был сыном двадцати пяти лет, т. е. ему было двадцать пять. ἐβασίλευσεν Αμασιας — воцарился Амасия. εἴκοσι ἐννέα ἔτη ἐβασίλευσεν ἐν Ιερουσαλημ — двадцать девять лет царствовал в Иерусалиме. ὄνομα τῇ μητρὶ αὐτοῦ Ιωαδεν — имя матери его Иоаден (слав. «иоадаень», ru «Иегоаддань»; в тексте ヨアディン, как в 4 Цар 14:2). ἀπὸ Ιερουσαλημ — из Иерусалима."
  2: "ἐποίησεν τὸ εὐθὲς ἐνώπιον κυρίου — делал правое пред Господом (τὸ εὐθές; слав. «правое»). ἀλλ᾿ οὐκ ἐν καρδίᾳ πλήρει — но не в полном сердце (καρδία πλήρης — «полное, совершенное сердце»; слав. «не сердцем совершенным», ru «не от полного сердца»). В 4 Цар 14:3 добавлено «но не как Давид, отец его» — в гр. 2 Пар этого нет."
  3: "ὡς κατέστη ἡ βασιλεία ἐν χειρὶ αὐτοῦ — когда утвердилось царство в руке его (καθίστημι). ἐθανάτωσεν τοὺς παῖδας αὐτοῦ — умертвил слуг своих (παῖς — «отрок, слуга»; слав. и ru «рабы»). τοὺς φονεύσαντας τὸν βασιλέα πατέρα αὐτοῦ — убивших царя, отца его (φονεύω)."
  4: "κατὰ τὴν διαθήκην τοῦ νόμου κυρίου — по завету закона Господня (διαθήκη — «завет»; слав. «по заповедем»). καθὼς γέγραπται — как написано. Слав. добавляет «в книзе закона моисеова» (по МТ; ср. 4 Цар 14:6) — внесено в текст по паритету. ὡς ἐνετείλατο κύριος λέγων — как заповедал Господь, говоря. Οὐκ ἀποθανοῦνται πατέρες ὑπὲρ τέκνων — не умрут отцы за детей (τέκνον; слав. «за сыны»). ἀλλ᾿ ἢ ἕκαστος τῇ ἑαυτοῦ ἁμαρτίᾳ ἀποθανοῦνται — но каждый в своём грехе умрёт."
  5: "συνήγαγεν τὸν οἶκον Ιουδα — собрал дом Иудин. ἀνέστησεν αὐτοὺς κατ᾿ οἴκους πατριῶν — поставил их по домам отцов. εἰς χιλιάρχους καὶ ἑκατοντάρχους — в тысячники и сотники (χιλίαρχος, ἑκατόνταρχος). ἐν παντὶ Ιουδα καὶ Ιερουσαλημ — во всей Иудее и Иерусалиме; слав. и ru «по всей Иудее и Вениамину» (МТ) — в тексте по слав., вариант LXX отмечен здесь. ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — от двадцатилетнего и выше. τριακοσίας χιλιάδας — триста тысяч. κρατοῦντας δόρυ καὶ θυρεόν — держащих копьё и щит (θυρεός — большой, ростовой щит)."
  6: "ἐμισθώσατο ἀπὸ Ισραηλ — нанял из Израиля (μισθόω). ἑκατὸν χιλιάδας δυνατοὺς ἰσχύι — сто тысяч сильных крепостью. ἑκατὸν ταλάντων ἀργυρίου — за сто талантов серебра."
  7: "ἄνθρωπος τοῦ θεοῦ — человек Божий (титул пророка). οὐ πορεύσεται μετὰ σοῦ δύναμις Ισραηλ — не пойдёт с тобою сила Израиля. ὅτι οὐκ ἔστιν κύριος μετὰ Ισραηλ — ибо нет Господа с Израилем. πάντων τῶν υἱῶν Εφραιμ — со всеми сынами Ефрема (северное царство названо по главному колену)."
  8: "ἐὰν ὑπολάβῃς κατισχῦσαι ἐν τούτοις — если ты подумаешь укрепиться ими (ὑπολαμβάνω — «полагать, думать»). τροπώσεταί σε κύριος ἐναντίον τῶν ἐχθρῶν — обратит тебя в бегство пред врагами (τροπόω). ἔστιν παρὰ κυρίου καὶ ἰσχῦσαι καὶ τροπώσασθαι — от Господа и укрепить, и обратить в бегство. Ru (Синод.) читает здесь по МТ совсем иначе («но иди ты один, делай дело…»); в тексте гр. и слав."
  9: "τὰ ἑκατὸν τάλαντα, ἃ ἔδωκα τῇ δυνάμει Ισραηλ — сто талантов, которые я отдал войску Израиля. Ἔστιν τῷ κυρίῳ δοῦναί σοι πλεῖστα τούτων — есть у Господа дать тебе гораздо больше этого (πλεῖστα — превосходная степень)."
  10: "διεχώρισεν... τῇ δυνάμει τῇ ἐλθούσῃ πρὸς αὐτὸν ἀπὸ Εφραιμ — отделил войско, пришедшее к нему от Ефрема (διαχωρίζω). ἀπελθεῖν εἰς τὸν τόπον αὐτῶν — уйти в своё место. ἐθυμώθησαν σφόδρα ἐπὶ Ιουδαν — сильно разгневались на Иуду (θυμόω). ἐπέστρεψαν... ἐν ὀργῇ θυμοῦ — возвратились в ярости гнева (букв. «в гневе ярости»)."
  11: "κατίσχυσεν — укрепился, собрался с силой (слав. «укрепися», ru «отважился»). παρέλαβεν τὸν λαὸν αὐτοῦ — взял народ свой. εἰς τὴν κοιλάδα τῶν ἁλῶν — в долину солей (слав. «в удоль сланую»; евр. Гей-Мелах). τοὺς υἱοὺς Σηιρ — сынов Сеира (Σηιρ — Сеир, т. е. Едом). δέκα χιλιάδας — десять тысяч."
  12: "ἐζώγρησαν — взяли живыми (ζωγρέω). ἐπὶ τὸ ἄκρον τοῦ κρημνοῦ — на край обрыва (κρημνός — «утёс, круча»). κατεκρήμνιζον — сбрасывали с кручи (κατακρημνίζω). πάντες διερρήγνυντο — все разбивались (διαρρήγνυμι; слав. «разседошася»)."
  13: "οἱ υἱοὶ τῆς δυνάμεως — сыны силы, т. е. воины. οὓς ἀπέστρεψεν Αμασιας τοῦ μὴ πορευθῆναι μετ᾿ αὐτοῦ — которых Амасия отослал, чтобы не шли с ним. ἐπέθεντο ἐπὶ τὰς πόλεις Ιουδα — напали на города Иуды (ἐπιτίθημι). ἀπὸ Σαμαρείας ἕως Βαιθωρων — от Самарии до Вефорона (ベト・ホロン). ἐπάταξαν ἐν αὐτοῖς τρεῖς χιλιάδας — поразили в них три тысячи. ἐσκύλευσαν σκῦλα πολλά — захватили много добычи (σκυλεύω)."
  14: "ἤνεγκεν πρὸς αὐτοὺς τοὺς θεοὺς υἱῶν Σηιρ — принёс к ним (по смыслу «к себе»; слав. «себе») богов сынов Сеира. ἔστησεν αὐτοὺς ἑαυτῷ εἰς θεούς — поставил их себе в боги. ἐναντίον αὐτῶν προσεκύνει — пред ними поклонялся (προσκυνέω). αὐτοῖς αὐτὸς ἔθυεν — им сам приносил жертвы (θύω; слав. «кадяше»)."
  15: "ἐγένετο ὀργὴ κυρίου ἐπὶ Αμασιαν — был гнев Господень на Амасию. ἀπέστειλεν αὐτῷ προφήτας — послал ему пророков (мн. ч.; слав. и ru — один пророк). Τί ἐζήτησας τοὺς θεοὺς τοῦ λαοῦ — зачем ты взыскал богов народа. οἳ οὐκ ἐξεῖλαντο τὸν λαὸν αὐτῶν ἐκ χειρός σου — которые не избавили народ свой из руки твоей (ἐξαιρέω)."
  16: "Μὴ σύμβουλον τοῦ βασιλέως δέδωκά σε — разве я поставил тебя советником царя. πρόσεχε μὴ μαστιγωθῇς — смотри, чтобы тебя не высекли (μαστιγόω; слав. «да не биен будеши», ru «чтобы не убили тебя»). ἐσιώπησεν ὁ προφήτης — замолчал пророк (σιωπάω). ἐβούλετο ἐπὶ σοὶ τοῦ καταφθεῖραί σε — замыслил о тебе погубить тебя (καταφθείρω); слав. добавляет «Господь» — в гр. подлежащее не названо. οὐκ ἐπήκουσας τῆς συμβουλίας μου — не послушал совета моего."
  17: "ἐβουλεύσατο — держал совет, совещался (βουλεύομαι; слав. «совеща»). ἀπέστειλεν πρὸς Ιωας υἱὸν Ιωαχαζ υἱοῦ Ιου — послал к Иоасу, сыну Иоахаза, сына Ииуя. Δεῦρο ὀφθῶμεν προσώποις — «приди, увидимся лицами», т. е. лицом к лицу (ср. 4 Цар 14:8)."
  18: "Ὁ αχουχ ὁ ἐν τῷ Λιβάνῳ — терн на Ливане (ἀχουχ, евр. חוֹחַ; в 4 Цар 14:9 — ἄκαν). τὴν κέδρον τὴν ἐν τῷ Λιβάνῳ — кедр на Ливане. Δὸς τὴν θυγατέρα σου τῷ υἱῷ μου εἰς γυναῖκα — отдай дочь твою сыну моему в жену. τὰ θηρία τοῦ ἀγροῦ τὰ ἐν τῷ Λιβάνῳ — звери полевые, что на Ливане. κατεπάτησαν τὸν αχουχ — истоптали терн (καταπατέω)."
  19: "εἶπας Ἰδοὺ ἐπάταξας τὴν Ιδουμαίαν — ты сказал: вот, ты поразил Идумею. ἐπαίρει σε ἡ καρδία ἡ βαρεῖα — поднимает тебя сердце тяжёлое (καρδία βαρεῖα, букв. «сердце тяжёлое»; слав. «воздвизается сердце твое в гордыню» — в тексте по слав.). κάθησο ἐν οἴκῳ σου — сиди в доме твоём. ἵνα τί συμβάλλεις ἐν κακίᾳ — зачем затеваешь злое (συμβάλλω — «сшибаться, вступать в бой»). πεσῇ σὺ καὶ Ιουδας μετὰ σοῦ — падёшь ты и Иуда с тобою."
  20: "οὐκ ἤκουσεν Αμασιας — не послушал Амасия. παρὰ κυρίου ἐγένετο — от Господа было. τοῦ παραδοῦναι αὐτὸν εἰς χεῖρας — чтобы предать его в руки (слав. добавляет «иоасу» — по МТ). ὅτι ἐξεζήτησεν τοὺς θεοὺς τῶν Ιδουμαίων — ибо он взыскал богов Идумейских."
  21: "ἀνέβη Ιωας βασιλεὺς Ισραηλ — поднялся Иоас, царь Израильский. ὤφθησαν ἀλλήλοις — увиделись друг с другом (ὁράω, аор. страд.). ἐν Βαιθσαμυς, ἥ ἐστιν τοῦ Ιουδα — в Беф-Самисе, что в Иудее (ベト・シェメシュ)."
  22: "ἐτροπώθη Ιουδας κατὰ πρόσωπον Ισραηλ — обращён в бегство Иуда пред лицом Израиля (τροπόω). ἔφυγεν ἕκαστος εἰς τὸ σκήνωμα — побежал каждый в шатёр свой (σκήνωμα)."
  23: "τὸν τοῦ Ιωας — сына Иоасова; слав. добавляет «сына охозиина» (по МТ, ср. 4 Цар 14:13) — внесено в текст по паритету. κατέλαβεν — захватил (καταλαμβάνω). εἰσήγαγεν αὐτὸν εἰς Ιερουσαλημ — ввёл его в Иерусалим. κατέσπασεν ἀπὸ τοῦ τείχους — разрушил часть стены (κατασπάω). ἀπὸ πύλης Εφραιμ ἕως πύλης γωνίας — от ворот Ефремовых до ворот угла. τετρακοσίους πήχεις — четыреста локтей."
  24: "πᾶν τὸ χρυσίον καὶ τὸ ἀργύριον — всё золото и серебро. τὰ σκεύη τὰ εὑρεθέντα ἐν οἴκῳ κυρίου — сосуды, найденные в доме Господнем. παρὰ τῷ Αβδεδομ — у Аведдара (Αβδεδομ, オベデ・エドム; то же лицо, что в 1 Пар 13:13–14). τοὺς θησαυροὺς οἴκου τοῦ βασιλέως — сокровища дома царя. τοὺς υἱοὺς τῶν συμμίξεων — «сыновей смешений» (σύμμιξις), т. е. заложников (слав. «сынов залога», ru «заложников»). ἐπέστρεψεν εἰς Σαμάρειαν — возвратился в Самарию."
  25: "ἔζησεν Αμασιας... μετὰ τὸ ἀποθανεῖν Ιωας — жил Амасия после того, как умер Иоас. ἔτη δέκα πέντε — пятнадцать лет (слав. «пятьнадесять»)."
  26: "οἱ λοιποὶ λόγοι Αμασιου οἱ πρῶτοι καὶ οἱ ἔσχατοι — прочие слова Амасии, первые и последние. ἐπὶ βιβλίου βασιλέων Ιουδα καὶ Ισραηλ — в книге царей Иудейских и Израильских (слав. «в книзе царей иудиных и израилевых»). οὐκ ἰδοὺ γεγραμμένοι — не вот ли записаны."
  27: "ἐν τῷ καιρῷ, ᾧ ἀπέστη Αμασιας ἀπὸ κυρίου — во время, когда отступил Амасия от Господа. ἐπέθεντο αὐτῷ ἐπίθεσιν — составили против него заговор (ἐπιτίθημι, ἐπίθεσις). ἔφυγεν ἀπὸ Ιερουσαλημ εἰς Λαχις — убежал из Иерусалима в Лахис (ラキシュ). ἀπέστειλαν κατόπισθεν αὐτοῦ — послали за ним (κατόπισθεν — «сзади, вслед»). ἐθανάτωσαν αὐτὸν ἐκεῖ — умертвили его там."
  28: "ἀνέλαβον αὐτὸν ἐπὶ τῶν ἵππων — подняли его на коней (ἀναλαμβάνω). ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ — погребли его с отцами его. ἐν πόλει Δαυιδ — в городе Давида (ru «в городе Иудином» — иное чтение МТ)."
