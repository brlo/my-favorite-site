# jp-box, 2-я Паралипоменон, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 25: Амасия и убийцы отца (1–4); смотр войска и наёмники из Израиля (5–10);
# победа над Сеиром (11–12); разорение наёмниками городов Иуды (13);
# боги Сеира и пророк (14–16); вызов Иоасу (17–19); поражение и разграбление
# Иерусалима (20–24); смерть Амасии (25–28).
# Речь — 「…」 (7–9, 16, 18–19). Красного нет.
# Нумерация по gr: 28 стихов, совпадает с csl/ru.
# Паритет LXX/csl: csl-чтения в основном тексте без 〔…〕; вариант LXX — в notes.
# 25:8 — в тексте гр. и слав. («если думаешь укрепиться ими…»), ru иначе (по МТ).
# 25:15 — в тексте пророки во мн. ч. (гр.); слав. и ru — один пророк.
# 〔…〕 не ставим. Сносок ⟨…⟩ нет: 神殿, 祭壇, 高[たか]い所[ところ], 預言者 уже в корпусе.

