# jp-box, Послание к Ефесянам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: домостроительство тайны для язычников (1–13), молитва о любви Христовой
# и славословие (14–21).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕: 3:9 — «διὰ Ἰησοῦ Χριστοῦ» (Елизаветинская «создавшем всяческая Иисус
# Христом», jp-joc «イイススハリストスを以て萬物を造りし神»); 3:14 — «τοῦ κυρίου
# ἡμῶν Ἰησοῦ Χριστοῦ» (Елизаветинская и jp-joc читают). Оба места проверены по базе:
# в gr-lxx-byz слов Ἰησοῦ/Χριστοῦ в этих стихах нет. В 3:1 [Ἰησοῦ], 3:3 [ὅτι],
# 3:9 [πάντας] в базе есть — не оборачиваются.
# Сносок ⟨…⟩ в главе нет: 経綸 пояснено при первом месте (1:10).
# jp-ni не использовался.

tr_code: jp-box
book: ef
chapter: 3
draft: true

verses:
  1: "このゆえに、わたしパウロは、あなたがた異邦人[いほうじん]のために、キリスト・イエスの囚人[しゅうじん]となっているのである。"
  2: "あなたがたのためにわたしに与[あた]えられた神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}の経綸[けいりん]について、あなたがたは聞[き]いているはずである。"
  3: "すなわち、奥義[おうぎ]が啓示[けいじ]によってわたしに知[し]らされたのである。わたしが先[さき]に手短[てみじか]に書[か]いたとおりである。"
  4: "あなたがたはそれを読[よ]めば、わたしがキリストの奥義[おうぎ]について持[も]っている理解[りかい]を悟[さと]ることができる。"
  5: "この奥義[おうぎ]は、霊[れい]によって、今[いま]、その聖[せい]なる使徒[しと]たちと預言者[よげんしゃ]たちに啓示[けいじ]されたように、ほかの時代[じだい]の人[ひと]々[びと]には知[し]らされなかったのである。"
  6: "すなわち、異邦人[いほうじん]が、キリスト・イエスにあって、福音[ふくいん]によって、わたしたちとともに相続人[そうぞくにん]となり、同[おな]じ体[からだ]に属[ぞく]する者[もの]となり、同[おな]じ約束[やくそく]にあずかる者[もの]となることである。"
  7: "わたしは、この福音[ふくいん]の奉仕者[ほうししゃ]となった。それは、神[かみ]の力[ちから]の働[はたら]きに従[したが]ってわたしに与[あた]えられた、神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}の賜物[たまもの]によるのである。"
  8: "すべての聖[せい]なる者[もの]のうちで最も小[ちい]さいわたしに、この{恵[めぐ]み|恩寵[おんちょう]}が与[あた]えられた。それは、異邦人[いほうじん]に、キリストの計[はか]り知[し]れない富[とみ]を福音[ふくいん]として宣[の]べ伝[つた]え、"
  9: "また、すべてのものを〔イエス・キリストによって〕造[つく]られた神[かみ]のうちに、世々[よよ]から隠[かく]されていた奥義[おうぎ]の経綸[けいりん]とは何[なに]であるかを、すべての人[ひと]を照[て]らして明[あき]らかにするためである。"
  10: "それは、今[いま]、教会[きょうかい]によって、天[てん]にある支配[しはい]と権威[けんい]とに、神[かみ]の多様[たよう]な知恵[ちえ]が知[し]られるためである。"
  11: "これは、わたしたちの主[しゅ]であるキリスト・イエスにあって神[かみ]が実現[じつげん]された、世々[よよ]にわたるご計画[けいかく]に従[したが]ったものである。"
  12: "この方[かた]にあって、わたしたちは、この方[かた]への信仰[しんこう]によって、大胆[だいたん]さと、確信[かくしん]をもって近[ちか]づくこととを、得[え]ている。"
  13: "それゆえ、わたしは、あなたがたのために受[う]けている苦難[くなん]のゆえに、落胆[らくたん]しないでほしいと願[ねが]っている。それはあなたがたの栄光[えいこう]なのである。"
  14: "このゆえに、わたしは、〔わたしたちの主[しゅ]イエス・キリスト〕の父[ちち]の前[まえ]に、ひざをかがめる。"
  15: "天[てん]と地[ち]におけるすべての父[ちち]なるものが、その方[かた]から名[な]づけられている。"
  16: "どうか、その方[かた]が、その栄光[えいこう]の富[とみ]に従[したが]って、あなたがたの内[うち]なる人[ひと]を、その霊[れい]によって力[ちから]をもって強[つよ]めてくださるように。"
  17: "そして、キリストが、信仰[しんこう]によって、あなたがたの心[こころ]のうちに住[す]んでくださるように。あなたがたが、愛[あい]のうちに根[ね]ざされ、基[もと]づけられて、"
  18: "すべての聖[せい]なる者[もの]たちとともに、広[ひろ]さ、長[なが]さ、高[たか]さ、深[ふか]さが何[なに]であるかを悟[さと]り、"
  19: "また、キリストの愛[あい]が、知識[ちしき]をはるかに超[こ]えていることを知[し]り、あなたがたが、神[かみ]の満[み]ちあふれのすべてに満[み]たされるためである。"
  20: "さて、わたしたちのうちに働[はたら]いている力[ちから]に従[したが]って、わたしたちが願[ねが]うことや思[おも]うことのすべてを、はるかに超[こ]えて行[おこな]うことのできる方[かた]に、"
  21: "教会[きょうかい]において、またキリスト・イエスにあって、世々[よよ]のすべての世代[せだい]に至[いた]るまで、栄光[えいこう]がこの方[かた]にありますように。アーメン。"

notes:
  1: "Τούτου χάριν — このゆえに. ὁ δέσμιος τοῦ Χριστοῦ [Ἰησοῦ] — キリスト・イエスの囚人; в базе [Ἰησοῦ] есть, 〔〕 не ставятся. ὑπὲρ ὑμῶν τῶν ἐθνῶν — あなたがた異邦人のために. Фраза обрывается (анаколуф), продолжение — в 14 ст."
  2: "εἴ γε ἠκούσατε — 聞いているはずである. οἰκονομία τῆς χάριτος τοῦ θεοῦ — 神の恵みの経綸 (οἰκονομία — домостроительство; сноска при первом месте, 1:10). τῆς δοθείσης μοι εἰς ὑμᾶς — あなたがたのためにわたしに与えられた."
  3: "κατὰ ἀποκάλυψιν — 啓示によって. В базе [ὅτι] — слово есть, 〔〕 не ставятся. ἐγνωρίσθη μοι — わたしに知らされた. προέγραψα ἐν ὀλίγῳ — 先に手短に書いた."
  4: "πρὸς ὃ δύνασθε… νοῆσαι — それを読めば…悟ることができる. σύνεσις — 理解. μυστήριον τοῦ Χριστοῦ — キリストの奥義."
  5: "ἑτέραις γενεαῖς — ほかの時代に. τοῖς υἱοῖς τῶν ἀνθρώπων — 人々に. ὡς νῦν ἀπεκαλύφθη — 今…啓示されたように. τοῖς ἁγίοις ἀποστόλοις καὶ προφήταις — その聖なる使徒たちと預言者たち. ἐν πνεύματι — 霊によって."
  6: "συγκληρονόμα, σύσσωμα, συμμέτοχα — ともに相続人、同じ体に属する者、同じ約束にあずかる者 (три σύν- сохранены). ἐν Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου — キリスト・イエスにあって、福音によって."
  7: "διάκονος — 奉仕者. δωρεὰ τῆς χάριτος — 恵みの賜物. κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ — 神の力の働きに従って."
  8: "ἐλαχιστοτέρῳ πάντων ἁγίων — すべての聖なる者のうちで最も小さい. ἀνεξιχνίαστον πλοῦτος τοῦ Χριστοῦ — キリストの計り知れない富 (ἀνεξιχνίαστος — неисследимый)."
  9: "φωτίσαι — 照らして明らかにする. [πάντας] в базе есть — すべての人, 〔〕 не ставятся. В базе нет «διὰ Ἰησοῦ Χριστοῦ»; церковный текст (Елизаветинская, jp-joc) читает — 〔イエス・キリストによって〕. Проверено по базе: Ἰησοῦ и Χριστοῦ в ef 3:9 в gr-lxx-byz — 0. ἀπὸ τῶν αἰώνων — 世々から. οἰκονομία τοῦ μυστηρίου — 奥義の経綸."
  10: "γνωρισθῇ — 知られる. ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις — 支配と権威に (чины). ἐν τοῖς ἐπουρανίοις — 天にある. πολυποίκιλος σοφία — 多様な知恵 (букв. «многоразличная»)."
  11: "κατὰ πρόθεσιν τῶν αἰώνων — 世々にわたるご計画に従って. ἣν ἐποίησεν ἐν τῷ Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν — わたしたちの主であるキリスト・イエスにあって神が実現された."
  12: "παρρησία — 大胆さ. προσαγωγή — 近づくこと (доступ). ἐν πεποιθήσει — 確信をもって. διὰ τῆς πίστεως αὐτοῦ — この方への信仰によって."
  13: "αἰτοῦμαι μὴ ἐγκακεῖν — 落胆しないでほしいと願っている (ἐγκακέω — унывать, терять сердце). ἐν ταῖς θλίψεσίν μου — 苦難のゆえに. ἥτις ἐστὶν δόξα ὑμῶν — それはあなたがたの栄光 (о моих страданиях)."
  14: "Τούτου χάριν — このゆえに. В базе нет «τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ»; Елизаветинская и jp-joc читают — 〔わたしたちの主イエス・キリスト〕. Проверено по базе: κυρίου, Ἰησοῦ, Χριστοῦ в ef 3:14 в gr-lxx-byz — 0. κάμπτω τὰ γόνατά μου — ひざをかがめる. πρὸς τὸν πατέρα — 父の前に."
  15: "πατριά — 父なるもの (игра слов с πατήρ; «всякое отечество»). ἐξ οὗ — その方から. ἐν οὐρανοῖς καὶ ἐπὶ γῆς — 天と地における. ὀνομάζεται — 名づけられている."
  16: "ἵνα δῷ — どうか…くださるように. κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ — その栄光の富に従って. δυνάμει κραταιωθῆναι — 力をもって強めて. διὰ τοῦ πνεύματος αὐτοῦ — その霊によって. εἰς τὸν ἔσω ἄνθρωπον — 内なる人."
  17: "κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως — キリストが信仰によって住んでくださる. ἐν ταῖς καρδίαις ὑμῶν — あなたがたの心のうちに. ἐν ἀγάπῃ ἐρριζωμένοι καὶ τεθεμελιωμένοι — 愛のうちに根ざされ、基づけられて (причастия относятся к 18 ст.)."
  18: "ἐξισχύσητε καταλαβέσθαι — 悟り. σὺν πᾶσιν τοῖς ἁγίοις — すべての聖なる者たちとともに. πλάτος, μῆκος, ὕψος, βάθος — 広さ、長さ、高さ、深さ (порядок греч. сохранён)."
  19: "γνῶναί τε — また…知り. τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην — 知識をはるかに超えている愛. ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ — 神の満ちあふれのすべてに満たされるため."
  20: "Τῷ δὲ δυναμένῳ — さて、…できる方に (славословие). ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν — 願うことや思うことのすべてを、はるかに超えて行う. κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν — うちに働いている力に従って."
  21: "αὐτῷ ἡ δόξα — 栄光がこの方に. ἐν τῇ ἐκκλησίᾳ καὶ ἐν Χριστῷ Ἰησοῦ — 教会において、またキリスト・イエスにあって. εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων — 世々のすべての世代に至るまで. ἀμήν — アーメン."
