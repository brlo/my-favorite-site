chapter: 5
draft: true

verses:
  1: "このころ、アンティオコスはエジプトへの二度目[にどめ]の遠征[えんせい]を企[くわだ]てた。"
  2: "すると、都[みやこ]の全体[ぜんたい]に、およそ四十日[よんじゅうにち]の間[あいだ]、空[そら]を駆[か]ける騎兵[きへい]たちが現[あら]われた。金糸[きんし]の衣[ころも]をまとい、槍[やり]を隊列[たいれつ]に構[かま]え、剣[けん]を抜[ぬ]き放[はな]った姿[すがた]であった。"
  3: "また、隊列[たいれつ]を組[く]んだ馬[うま]の群[む]れ、双方[そうほう]からの突撃[とつげき]と駆[か]け込[こ]み、盾[たて]の動[うご]き、投[とう]げ槍[やり]の多[おお]さ、矢[や]の飛[と]び交[か]い、金[きん]の飾[かざ]りの輝[かがや]き、あらゆる鎧[よろい]の姿[すがた]があった。"
  4: "そこで人[ひと]々[びと]はみな、この現[あら]われが良[よ]いことのために起こったのだと願[ねが]った。"
  5: "ところが、アンティオコスが死[し]んだという偽[いつわ]りのうわさが流[なが]れると、ヤソンは千人[せんにん]を下[くだ]らない者[もの]を集[あつ]め、突然[とつぜん]都[みやこ]に攻[せ]めかかった。城壁[じょうへき]の上[うえ]の者[もの]たちが押[お]し込[こ]められ、ついに都[みやこ]が取[と]られようとしたとき、メネラオスは城塞[じょうさい]へ逃[に]げ込[こ]んだ。"
  6: "ヤソンは自分[じぶん]の市民[しみん]たちを容赦[ようしゃ]なく殺[ころ]した。同族[どうぞく]に対する成功[せいこう]が最大[さいだい]の不幸[ふこう]であることを悟[さと]らず、敵[てき]に、同じ民[たみ]の者[もの]ではなく敵に対する戦勝[せんしょう]の記念[きねん]を建[た]てるつもりでいたのである。"
  7: "しかし彼[かれ]はその職[しょく]を得[え]ることはできず、その企[くわだ]ての結末[けつまつ]は恥[はじ]であり、再[ふたた]びアンモン人[じん]の地[ち]へ逃亡者[とうぼうしゃ]として去[さ]った。"
  8: "こうして彼[かれ]は悪[わる]い最期[さいご]を遂[と]げた。アラビア人[じん]の王[おう]アレタスのもとで訴[うった]えられ、町[まち]から町へと逃[に]げ回[まわ]り、すべての人[ひと]に追[お]われ、律法[りっぽう]の背教者[はいきょうしゃ]として憎[にく]まれ、父[ちち]の国[くに]と市民[しみん]の敵[てき]として忌[い]み嫌[きら]われ、エジプトへ追[お]い出[だ]された。"
  9: "そして、多[おお]くの者[もの]を父[ちち]の国[くに]から遠[とお]ざけた者[もの]が、異郷[いきょう]で滅[ほろ]びた。ラケダイモン人[じん]のもとへ行[い]き、同族[どうぞく]のゆえに保護[ほご]が得[え]られると思[おも]ったのである。"
  10: "また、多[おお]くの死体[したい]を葬[ほうむ]らずに捨[す]てた者[もの]が、自分[じぶん]は悼[いた]まれることもなく、どんな埋葬[まいそう]も、父[ちち]たちの墓[はか]も受[う]けられなかった。"
  11: "この出来事[できごと]が王[おう]に伝[つた]えられると、王[おう]はユダヤが離反[りはん]したと受[う]け取[と]った。そこでエジプトから進[すす]み出[で]た彼[かれ]は、魂[たましい]を獣[けもの]のように荒[あら]らせて、都[みやこ]を力[ちから]ずくで取[と]り、"
  12: "兵[へい]たちに、出会[であ]う者[もの]を容赦[ようしゃ]なく切[き]り捨[す]て、家[いえ]に逃[に]げ込[こ]む者[もの]を殺[ころ]すように命[めい]じた。"
  13: "若[わか]い者[もの]も年[とし]寄[よ]りも殺[ころ]され、成年[せいねん]に達[たっ]しない者[もの]、女[おんな]、子[こ]どもは消[き]し去[さ]られ、処女[しょじょ]と乳飲[ちのみ]子[ご]は殺[ころ]された。"
  14: "こうして三日[みっか]の間[あいだ]に八万[はちまん]人[にん]が滅[ほろ]びた。四万[よんまん]人が殺[ころ]され、殺[ころ]された者[もの]に劣[おと]らぬ数[かず]が売[う]り払[はら]われたのである。"
  15: "これに満足[まんぞく]せず、彼[かれ]は全[ぜん]地[ち]で最も聖[せい]なる神殿[しんでん]に踏[ふ]み込[こ]むことを敢[あえ]てした。律法[りっぽう]と父[ちち]の国[くに]の裏切[うらぎ]り者[もの]となったメネラオスを案内[あんない]者[しゃ]として、"
  16: "汚[けが]れた手[て]で聖[せい]なる器[うつわ]を取[と]り、ほかの王[おう]たちがこの場所[ばしょ]の増[ま]しと栄[えい]と誉[ほま]れのためにささげたものを、俗[ぞく]な手[て]でかき集[あつ]めた。"
  17: "アンティオコスは心[こころ]を高[たか]ぶらせた。都[みやこ]に住[す]む者[もの]たちの罪[つみ]のゆえに、主[しゅ]がしばらく怒[いか]られたこと、それゆえこの場所[ばしょ]が顧[かえり]みられなくなったことを悟[さと]らなかったのである。"
  18: "もし彼らが多[おお]くの罪[つみ]に捕[と]らわれていなかったなら、王[おう]セレウコスに遣[つか]わされて宝物庫[ほうもつこ]の検査[けんさ]に来[き]たヘリオドロスがそうであったように、この者[もの]も進[すす]み出[で]たとたんに打[う]たれ、その大胆[だいたん]さをくじかれたであろう。"
  19: "しかし主[しゅ]が選[えら]ばれたのは、場所[ばしょ]のゆえに民[たみ]ではなく、民のゆえに場所[ばしょ]であった。"
  20: "それゆえ、この場所[ばしょ]もまた、民[たみ]の災[わざわ]いに共[とも]にあずかったが、のちには恵[めぐ]みにもあずかった。全能[ぜんのう]の怒[いか]りのうちに捨[す]てられたこの場所[ばしょ]は、大[おお]いなる主[しゅ]の和解[わかい]のうちに、すべての栄光[えいこう]とともに再[ふたた]び立[た]ち直[なお]ったのである。"
  21: "こうしてアンティオコスは、神殿[しんでん]から千八百[せんはっぴゃく]タラントを持[も]ち出[だ]し、心[こころ]の高[たか]ぶりから、陸[りく]を航海[こうかい]の道[みち]に、海[うみ]を徒歩[とほ]の道[みち]にしようと考[かんが]えて、急[いそ]いでアンティオキアへ去[さ]った。"
  22: "彼[かれ]はまた、民[たみ]を苦[くる]しめる監督[かんとく]たちを残[のこ]した。エルサレムにはフィリッポスを。彼はフリュギアの出[で]で、自分[じぶん]を任[まか]せた者[もの]よりもさらに野蛮[やばん]な気質[きしつ]の持[も]ち主[ぬし]であった。"
  23: "ガリジンにはアンドロニコスを、そのうえにメネラオスを残[のこ]した。メネラオスはほかの誰[だれ]よりもひどく市民[しみん]を虐[しいた]げ、ユダヤ人の市民[しみん]たちに敵意[てきい]を抱[いだ]いていた。"
  24: "また、ミュシア人[じん]の部隊[ぶたい]の長[ちょう]アポロニオスを二万二千[にまんにせん]の軍[ぐん]とともに遣[つか]わし、成年[せいねん]に達[たっ]した者[もの]をすべて殺[ころ]し、女[おんな]と子[こ]どもは売[う]るように命[めい]じた。"
  25: "彼[かれ]はエルサレムに来[き]て、しばらく平和[へいわ]を装[よそお]い、安息日[あんそくび]の聖[せい]なる日[ひ]まで待[ま]った。そして、ユダヤ人[じん]たちがくつろいでいるのを見[み]て、自分[じぶん]の部下[ぶか]たちに武器[ぶき]を取[と]るように命[めい]じ、"
  26: "見物[けんぶつ]に出[で]て来[き]た者[もの]をすべて刺[さ]し殺[ころ]し、武器[ぶき]を手[て]に都[みやこ]へなだれ込[こ]んで、多[おお]くの民[たみ]を倒[たお]した。"
  27: "さて、マッカバイオスと呼ばれるユダは、十番目[じゅうばんめ]に生[う]まれた者[もの]であったが、荒野[こうや]へ退[の]き、自分[じぶん]とともにいる者[もの]たちと山[やま]の中[なか]で獣[けもの]のように暮[く]らし、草[くさ]を食[た]べて過[す]ごしていた。それは汚[けが]れに加[くわ]わらないためであった。"

notes:
  1: "τὴν δευτέραν ἔφοδον… εἰς Αἴγυπτον ἐστείλατο — «второй поход в Египет предпринял» (ἐφοδος — нашествие, 遠征[えんせい])."
  2: "σχεδὸν ἐφ᾽ ἡμέρας τεσσαράκοντα — «почти в течение сорока дней»; φαίνεσθαι διὰ τῶν ἀέρων τρέχοντας ἱππεῖς — «являться по воздуху скачущих всадников»; διαχρύσους στολάς — «златотканые одежды» (διάχρυσος); λόγχας σπειρηδὸν ἐξωπλισμένους — «копьями по отрядам (по когортам) вооружённых» (σπειρηδόν); μαχαιρῶν σπασμούς — «обнажения мечей» (σπασμός)."
  3: "ἴλας ἵππων διατεταγμένας — «отряды конницы в строю» (ἴλη — эскадрон); προσβολὰς… καὶ καταδρομάς — «нападения и стремительные атаки»; καμάκων πλήθη — «множество копий (дротиков)» (κάμαξ); θωρακισμούς — «доспехи, брони» (θωρακισμός)."
  4: "ἠξίουν ἐπ᾽ ἀγαθῷ τὴν ἐπιφάνειαν γεγενῆσθαι — «просили, чтобы явление было ко благу». Слав. «моляхуся, да явление во благо будет»."
  5: "λαλιᾶς ψευδοῦς — «молвы ложной» (λαλιά); οὐκ ἐλάττους τῶν χιλίων — «не менее тысячи»; τῶν δὲ ἐπὶ τῷ τείχει συνελασθέντων — «когда бывшие на стене были стеснены» (συνελαύνω); τέλος ἤδη καταλαμβανομένης τῆς πόλεως — «наконец, когда город уже был взят»; εἰς τὴν ἀκρόπολιν ἐφυγάδευσεν — «в крепость убежал»."
  6: "σφαγὰς τῶν πολιτῶν τῶν ἰδίων ἀφειδῶς — «избиения своих граждан нещадно» (ἀφειδῶς); οὐ συννοῶν — «не разумея»; τὴν εἰς τοὺς συγγενεῖς εὐημερίαν δυσημερίαν εἶναι τὴν μεγίστην — «что успех против родных есть величайшее несчастье»; τρόπαια καταβάλλεσθαι — «трофеи ставить» (καταβάλλομαι)."
  7: "τῆς μὲν ἀρχῆς οὐκ ἐκράτησεν — «начальства не получил»; τὸ τέλος τῆς ἐπιβουλῆς αἰσχύνην λαβόν — «конец замысла приняв позор»; φυγὰς πάλιν εἰς τὴν Αμμανῖτιν ἀπῆλθεν — «беглецом снова в Аммонитиду ушёл»."
  8: "πέρας… κακῆς καταστροφῆς ἔτυχεν — «достиг конца злой погибели»; ἐγκληθεὶς πρὸς Ἀρέταν τὸν τῶν Ἀράβων τύραννον — «обвинённый пред Аретой, арабским тираном» (アレタス); στυγούμενος ὡς τῶν νόμων ἀποστάτης — «ненавидимый как отступник законов»; ὡς πατρίδος καὶ πολιτῶν δήμιος — «как враг (палач) отечества и граждан»; εἰς Αἴγυπτον ἐξεβράσθη — «в Египет извержен»."
  9: "συχνοὺς τῆς πατρίδος ἀποξενώσας — «многих лишивший отечества» (ἀποξενόω); ἐπὶ ξένης ἀπώλετο — «на чужбине погиб»; πρὸς Λακεδαιμονίους ἀναχθείς — «к лакедемонянам отправившись» (ラケダイモン人); ὡς διὰ τὴν συγγένειαν τευξόμενος σκέπης — «как бы по родству имея получить защиту» (σκέπη)."
  10: "πλῆθος ἀτάφων ἐκρίψας — «множество [тел] без погребения выбросивший» (ἄταφος, ἐκρίπτω); ἀπένθητος — «неоплаканный»; κηδείας οὐδ᾽ ἡστινοσοῦν… μετέσχεν — «никакого погребения не получил»."
  11: "Προσπεσόντων… τῷ βασιλεῖ περὶ τῶν γεγονότων — «когда царю донесли о происшедшем» (προσπίπτω); διέλαβεν ἀποστατεῖν τὴν Ιουδαίαν — «решил, что Иудея отлагается»; ἀναζεύξας ἐξ Αἰγύπτου — «выступив из Египта»; τεθηριωμένος τῇ ψυχῇ — «одичав душой» (θηριόω); δοριάλωτον — «взятый копьём» (δορυάλωτος)."
  12: "κόπτειν ἀφειδῶς τοὺς ἐμπίπτοντας — «рубить нещадно попадающихся»; τοὺς εἰς τὰς οἰκίας ἀναβαίνοντας κατασφάζειν — «в дома входящих закалывать»."
  13: "νέων καὶ πρεσβυτέρων ἀναίρεσις — «избиение юных и старцев»; ἀνήβων — «несовершеннолетних» (ἄνηβος); ἀφανισμός — «истребление»; παρθένων τε καὶ νηπίων σφαγαί — «дев и младенцев заклания». Слав. «мужей и жен» вместо ἀνήβων — в тексте по gr."
  14: "ὀκτὼ… μυριάδες — «восемь десятков тысяч» (80 000); τέσσαρες — «сорок тысяч»; ἐν χειρῶν νομαῖς — «в избиении рук» (χειρῶν νομή — рукопашная); οὐχ ἧττον δὲ τῶν ἐσφαγμένων ἐπράθησαν — «не меньше убитых были проданы»."
  15: "οὐκ ἀρκεσθεὶς δὲ τούτοις — «не удовольствовавшись этим»; τὸ πάσης τῆς γῆς ἁγιώτατον ἱερόν — «святейший на всей земле храм»; ὁδηγὸν ἔχων τὸν Μενέλαον — «имея проводником Менелая» (ὁδηγός); τῶν νόμων καὶ τῆς πατρίδος προδότην — «законов и отечества предателя»."
  16: "ταῖς μιαραῖς χερσίν — «скверными руками» (μιαρός); τὰ ὑπ᾽ ἄλλων βασιλέων ἀνατεθέντα — «поставленное другими царями» (ἀνατίθημι — посвящать); πρὸς αὔξησιν καὶ δόξαν… καὶ τιμήν — «на умножение, славу и честь»; ταῖς βεβήλοις χερσὶν συσσύρων — «нечистыми руками сгребая» (συσσύρω)."
  17: "ἐμετεωρίζετο τὴν διάνοιαν — «превозносился мыслью» (μετεωρίζομαι); οὐ συνορῶν — «не видя»; ἀπώργισται βραχέως ὁ δεσπότης — «Владыка на краткое время прогневался»; περὶ τὸν τόπον παρόρασις — «пренебрежение (оставление без попечения) места» (παρόρασις)."
  18: "εἰ δὲ μὴ συνέβη προσενέχεσθαι πολλοῖς ἁμαρτήμασιν — «если бы не случилось им быть объятыми многими грехами» (προσέχομαι — быть преданным); καθάπερ ἦν ὁ Ἡλιόδωρος — «как был Илиодор»; ἐπὶ τὴν ἐπίσκεψιν τοῦ γαζοφυλακίου — «на осмотр сокровищницы»; προαχθεὶς παραχρῆμα μαστιγωθεὶς ἀνετράπη τοῦ θράσους — «выступив, тотчас бичеванный, отвращён от дерзости» (ἀνατρέπω)."
  19: "οὐ διὰ τὸν τόπον τὸ ἔθνος, ἀλλὰ διὰ τὸ ἔθνος τὸν τόπον ὁ κύριος ἐξελέξατο — «не ради места народ, но ради народа место Господь избрал». Слав. «не ради места язык, но языка ради место Господь избра»."
  20: "συμμετασχὼν τῶν τοῦ ἔθνους δυσπετημάτων — «став причастным народным бедствиям» (δυσπέτημα); ὕστερον εὐεργετημάτων ἐκοινώνησεν — «потом благодеяний приобщился»; ὁ καταλειφθεὶς ἐν τῇ τοῦ παντοκράτορος ὀργῇ — «оставленный в гневе Вседержителя»; ἐν τῇ τοῦ μεγάλου δεσπότου καταλλαγῇ — «в примирении великого Владыки»; ἐπανωρθώθη — «восстановлен» (ἐπανορθόω)."
  21: "ὀκτακόσια πρὸς τοῖς χιλίοις… τάλαντα — «тысячу восемьсот талантов»; θᾶττον εἰς τὴν Ἀντιόχειαν ἐχωρίσθη — «поспешно в Антиохию удалился»; οἰόμενος… τὴν μὲν γῆν πλωτὴν καὶ τὸ πέλαγος πορευτὸν θέσθαι — «думая землю сделать плаваемой, а море проходимым»; διὰ τὸν μετεωρισμὸν τῆς καρδίας — «из-за превозношения сердца»."
  22: "ἐπιστάτας τοῦ κακοῦν τὸ γένος — «надзирателей, чтобы мучить народ» (ἐπιστάτης — 監督[かんとく]); τὸ μὲν γένος Φρύγα — «родом фригийца»; τὸν δὲ τρόπον βαρβαρώτερον ἔχοντα τοῦ καταστήσαντος — «нравом более варварского, чем поставивший его» (καθίστημι)."
  23: "ἐν δὲ Γαριζιν Ἀνδρόνικον — «в Гаризине Андроника»; ὃς χείριστα τῶν ἄλλων ὑπερῄρετο τοῖς πολίταις — «который хуже других обходился с гражданами» (ὑπεραίρω — превозноситься, здесь: обходиться); ἀπεχθῆ… ἔχων διάθεσιν — «имея враждебное расположение». Слав. обрывается на «озлобляше граждан» — конец стиха по gr."
  24: "τὸν Μυσάρχην Ἀπολλώνιον — «Аполлония Мистарха»: либо титул (начальник мисийских наёмников, ミュシア人[じん]の長[ちょう]), либо имя; слав. понял как «ненавистного начальника», ru — «виновника нечестия»; в тексте титул, отмечено; δισμυρίους δὲ πρὸς τοῖς δισχιλίοις — «двадцать две тысячи»; τοὺς ἐν ἡλικίᾳ — «взрослых»; τοὺς νεωτέρους πωλεῖν — «младших продавать»."
  25: "τὸν εἰρηνικὸν ὑποκριθεὶς — «разыграв мирного» (ὑποκρίνομαι); ἐπέσχεν ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου — «медлил до святого дня субботы»; λαβὼν ἀργοῦντας τοὺς Ιουδαίους — «застав иудеев праздными»; ἐξοπλησί αν παρήγγειλεν — «приказал вооружиться»."
  26: "τοὺς ἐξελθόντας πάντας ἐπὶ τὴν θεωρίαν — «всех вышедших на зрелище» (θεωρία — смотр, зрелище); συνεξεκέντησεν — «переколол» (συνεκκεντέω); ἱκανὰ κατέστρωσεν πλήθη — «немалое множество поверг» (καταστρώννυμι)."
  27: "ὁ καὶ Μακκαβαῖος — «и (прозываемый) Маккавей»; δέκατός που γενηθεὶς — «бывший примерно десятым» (т. е. десятым в роде; ru «десятый в роде своем»); ἀναχωρήσας εἰς τὴν ἔρημον — «удалившись в пустыню»; θηρίων τρόπον ἐν τοῖς ὄρεσιν διέζη — «звериным образом в горах жил»; τὴν χορτώδη τροφὴν σιτούμενοι — «травяную пищу вкушая»; πρὸς τὸ μὴ μετασχεῖν τοῦ μολυσμοῦ — «чтобы не приобщиться осквернения» (μολυσμός)."
