# jp-box, 2 Маккавейская, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 27 стихов, совпадает с gr.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–4 второй поход Антиоха в Египет и небесные знамения над городом;
# 5–10 ложный слух о смерти царя, нападение Иасона, его гибель; 11–14 взятие
# Иерусалима, избиение и продажа в рабство; 15–20 осквернение храма и слово
# автора о месте и народе; 21–26 Антиох в Антиохии, поставленные им приставники,
# Аполлоний и избиение в субботу; 27 Иуда Маккавей в пустыне.
# Голоса: прямой речи в главе нет; 5:18 — речь автора в форме «если бы…»,
# без кавычек. 5:18 «он» — Илиодор (сравнение).
# Имена: アレタス, ラケダイモン人, ミュシア人, フィリッポス, アンドロニコス —
# новое; アンティオコス, ヤソン, メネラオス, アポロニオス, セレウコス,
# ヘリオドロス, プトレマイオス, ユダ, エルサレム, ガリジン, アンモン人.

tr_code: jp-box
