# jp-box, 3-я Царств, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru) по паритету LXX/csl (docs/japanese-bible.md);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 3: брак с дочерью фараона и высоты (1–4), сон в Гаваоне и просьба
# о сердце (5–15), суд о двух женщинах (16–28).
# Особенность базы: в gr-lxx-byz 3:1 стоит знак «.» (пустой стих, дефект
# модуля). Весь стих 3:1 — церковное чтение csl-ru (ср. 2:35c), внесён без 〔…〕.
# 〔…〕 нет.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, 祭壇, 燔祭, 酬恩祭, 遊女, 高[たか]い所[ところ]
# уже в корпусе.
# jp-ni не использовался.

