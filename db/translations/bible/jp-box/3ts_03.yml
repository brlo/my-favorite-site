verses:
  1: "ソロモンの手[て]に王国[おうこく]が固[かた]く据[す]えられると、彼[かれ]はエジプトの王[おう]ファラオと姻戚[いんせき]関係[かんけい]を結[むす]び、ファラオの娘[むすめ]を迎[むか]えてダビデの町[まち]に住[す]ませた。自分[じぶん]の家[いえ]と主[しゅ]の家[いえ]、エルサレムの周[まわ]りの城壁[じょうへき]を建[た]て終[お]えるまで、そうしていた。"
  2: "ただ、民[たみ]は高[たか]い所[ところ]でいけにえを捧[ささ]げていた。主[しゅ]の名[な]のために家[いえ]が建[た]てられていなかったからだ、あの日[ひ]までは。"
  3: "ソロモンは主[しゅ]を愛[あい]し、父[ちち]ダビデの定[さだ]めに従[したが]って歩[あゆ]んだ。ただ、彼[かれ]も高[たか]い所[ところ]でいけにえを捧[ささ]げ、香[こう]をたいた。"
  4: "王[おう]は立[た]ってギベオンへ行[い]き、そこでいけにえを捧[ささ]げた。そこが最も高[たか]く大[おお]きな高[たか]い所[ところ]だったからだ。ソロモンはギベオンの祭壇[さいだん]の上[うえ]に千[せん]の燔祭[はんさい]を捧[ささ]げた。"
  5: "夜[よる]、夢[ゆめ]の中[なか]で主[しゅ]がソロモンに現[あらわ]れ、言[い]われた。「願[ねが]いなさい。自分[じぶん]のために何[なに]を願[ねが]うのか。」"
  6: "ソロモンは言[い]った。「あなたは、しもべダビデ、わたしの父[ちち]に大[おお]きな慈[いつく]しみを施[ほどこ]された。彼[かれ]が真実[しんじつ]と正[ただ]しさと、あなたとともにある正[ただ]しい心[こころ]をもってあなたの前[まえ]を歩[あゆ]んだからだ。あなたは彼[かれ]にこの大[おお]きな慈[いつく]しみを保[たも]って、その子[こ]を彼[かれ]の王座[おうざ]に座[すわ]らせてくださった。今日[きょう]のとおりだ。"
  7: "今[いま]、わが主[しゅ]なる神[かみ]よ。あなたはしもべを、父[ちち]ダビデの代[か]わりに立[た]てられた。しかし、わたしは小[ちい]さな子[こ]どもにすぎず、自分[じぶん]の出[で]ることも入[はい]ることも知[し]らない。"
  8: "このしもべは、あなたが選[えら]ばれたあなたの民[たみ]のただ中[なか]にいる。それは多[おお]くの民[たみ]で、数[かぞ]えることもできない。"
  9: "どうか、しもべに従[したが]う心[こころ]を与[あた]え、あなたの民[たみ]を正[ただ]しく裁[さば]き、善[ぜん]と悪[あく]を見分[みわ]けることができるようにしてください。この重[おも]いあなたの民[たみ]を、だれが裁[さば]くことができるだろうか。」"
  10: "ソロモンがこの願[ねが]いをしたことは、主[しゅ]の前[まえ]に良[よ]いこととされた。"
  11: "主[しゅ]は彼[かれ]に言[い]われた。「あなたはこのことをわたしに願[ねが]い、自分[じぶん]のために長[なが]い日[ひ]を願[ねが]わず、富[とみ]を願[ねが]わず、敵[てき]の命[いのち]を願[ねが]わず、ただ裁[さば]きを聞[き]き分[わ]ける悟[さと]りを自分[じぶん]のために願[ねが]ったので、"
  12: "見[み]よ、わたしはあなたの言葉[ことば]のとおりにした。見[み]よ、わたしはあなたに賢[かしこ]く、悟[さと]りのある心[こころ]を与[あた]えた。あなたのような者[もの]は、あなたより前[まえ]にはいなかったし、あなたの後[あと]にも起[お]こらない。"
  13: "また、あなたが願[ねが]わなかったもの、すなわち富[とみ]と名誉[めいよ]も与[あた]えた。あなたの生涯[しょうがい]の間[あいだ]、王[おう]たちの間[あいだ]に、あなたのような者[もの]はいない。"
  14: "もし、あなたが父[ちち]ダビデが歩[あゆ]んだように、わたしの道[みち]を歩[あゆ]み、わたしの戒[いまし]めと定[さだ]めを守[まも]るなら、わたしはあなたの日[ひ]を長[なが]くする。」"
  15: "ソロモンは目[め]を覚[さ]まし、見[み]よ、それは夢[ゆめ]だった。彼[かれ]は立[た]ち、エルサレムへ来[き]て、シオンにある主[しゅ]の契約[けいやく]の箱[はこ]の前[まえ]の祭壇[さいだん]の前[まえ]に立[た]ち、燔祭[はんさい]を捧[ささ]げ、酬恩祭[しゅうおんさい]をささげ、自分[じぶん]とすべてのしもべたちのために大[おお]きな酒宴[しゅえん]を開[ひら]いた。"
  16: "そのころ、二人[ふたり]の遊女[ゆうじょ]が王[おう]のところへ来[き]て、彼[かれ]の前[まえ]に立[た]った。"
  17: "女[おんな]の一[ひと]人[り]が言[い]った。「お願[ねが]いだ、ご主人[しゅじん]さま。わたしとこの女[おんな]は同[おな]じ家[いえ]に住[す]んでいる。そして、家[いえ]で子[こ]どもを産[う]んだ。"
  18: "わたしが産[う]んだ三[みっ]日[か]目[め]に、この女[おんな]も産[う]んだ。わたしたちは一緒[いっしょ]で、家[いえ]にはわたしたち二人[ふたり]のほか、だれもいなかった。"
  19: "すると、この女[おんな]の子[こ]どもが夜[よる]のうちに死[し]んだ。この女[おんな]が子[こ]どもの上[うえ]に寝[ね]てしまったからだ。"
  20: "この女[おんな]は夜[よる]の半[なか]ばに起[お]き、わたしの腕[うで]の中[なか]からわたしの子[こ]どもを取[と]って自分[じぶん]の懐[ふところ]に寝[ね]かせ、自分[じぶん]の死[し]んだ子[こ]どもをわたしの懐[ふところ]に寝[ね]かせた。"
  21: "朝[あさ]、わたしは子[こ]どもに乳[ちち]を飲[の]ませようと起[お]き、見[み]ると、その子[こ]は死[し]んでいた。朝[あさ]、よくよく見[み]ても、それはわたしが産[う]んだ子[こ]どもではない。」"
  22: "すると、もう一人[ひとり]の女[おんな]が言[い]った。「いいえ。生[い]きているのはわたしの子[こ]で、死[し]んだのはあなたの子[こ]だ。」このように、彼女[かのじょ]らは王[おう]の前[まえ]で言[い]い争[あらそ]った。"
  23: "王[おう]は彼女[かのじょ]らに言[い]った。「あなたは『生[い]きているこれはわたしの子[こ]で、死[し]んだのはこの女[おんな]の子[こ]だ』と言[い]い、あなたは『いいえ、生[い]きているのはわたしの子[こ]で、死[し]んだのはあなたの子[こ]だ』と言[い]う。」"
  24: "王[おう]は言[い]った。「わたしに剣[つるぎ]を持[も]って来[こ]い。」そして、剣[つるぎ]が王[おう]の前[まえ]に運[はこ]ばれた。"
  25: "王[おう]は言[い]った。「生[い]きている乳飲[ちの]み子[ご]を二[ふた]つに切[き]り分[わ]け、その半[はん]分[ぶん]をこの女[おんな]に、半[はん]分[ぶん]をあの女[おんな]に与[あた]えよ。」"
  26: "生[い]きている子[こ]の母[はは]である女[おんな]は、自分の子[こ]のことで心[こころ]が騒[さわ]ぎ立[た]ち、王[おう]に答[こた]えて言[い]った。「お願[ねが]いだ、ご主人[しゅじん]さま。生[い]きている子[こ]どもをこの女[おんな]に与[あた]えてください。どうか殺[ころ]さないでください。」しかし、もう一人[ひとり]は言[い]った。「わたしにも、あの女[おんな]にも、子[こ]どもは要[い]らない。切[き]り分[わ]けよ。」"
  27: "王[おう]は答[こた]えて言[い]った。「『この女[おんな]に子[こ]どもを与[あた]えよ。殺[ころ]してはならない』と言[い]った女[おんな]に、その子[こ]どもを与[あた]えよ。この女[おんな]がその母[はは]である。」"
  28: "全[ぜん]イスラエルは、王[おう]が下[くだ]したこの判決[はんけつ]を聞[き]いて、王[おう]を恐[おそ]れた。神[かみ]の知恵[ちえ]が彼[かれ]のうちにあって、正[ただ]しい裁[さば]きをするのを見[み]たからだ。"

notes:
  1: "В gr-lxx-byz на месте стиха стоит «.» (дефект модуля); весь стих — церковное чтение csl-ru: «Егда же царство утвердися в руце соломона, сватовство сотвори соломон с фараоном царем египетским…». «Сватовство» — свадебный сговор, родство (γαμβρεύω); та же мысль в 2:35c: ἔλαβεν τὴν θυγατέρα Φαραω. Внесено в основной текст без 〔…〕."
  2: "πλὴν — только, впрочем; ἦσαν θυμιῶντες ἐπὶ τοῖς ὑψηλοῖς — кадили на высотах (θυμιάω); слав. «жруще на высоких» — приносили жертвы (жрети). Взято слав. чтение; ἡμέρας — род. времени «до сего дня»."
  3: "ἠγάπησεν τὸν κύριον — возлюбил Господа; τοῦ πορεύεσθαι ἐν τοῖς προστάγμασιν — ходить в повелениях (定め); πλὴν ἐν τοῖς ὑψηλοῖς ἔθυεν καὶ ἐθυμία — однако на высотах приносил жертвы и кадил (несов.)."
  4: "ἀνέστη καὶ ἐπορεύθη — встал и пошёл; ὅτι αὐτὴ ὑψηλοτάτη καὶ μεγάλη — что она высочайшая и великая; χιλίαν ὁλοκαύτωσιν ἀνήνεγκεν — тысячу всесожжений вознёс (ἀναφέρω). Синод. «главный жертвенник» — по МТ, в гр./слав. этого нет."
  5: "ὤφθη — явился (ὁράω, pass.); ἐν ὕπνῳ τὴν νύκτα — во сне, ночью; Αἴτησαί τι αἴτημα σαυτῷ — «проси себе прошения» (внутренний винительный); слав. «проси что хощеши себе»."
  6: "ἔλεος μέγα — милость великую; διῆλθεν ἐνώπιόν σου — прошёл, ходил пред Тобою (διέρχομαι); ἐν εὐθύτητι καρδίας — в правоте сердца; ἐφύλαξας αὐτῷ τὸ ἔλεος — сохранил ему милость; ὡς ἡ ἡμέρα αὗτη — как день сей."
  7: "ἀντὶ Δαυιδ τοῦ πατρός μου — вместо Давида, отца моего; παιδάριον μικρόν — отрок малый; οὐκ οἶδα τὴν ἔξοδόν μου καὶ τὴν εἴσοδόν μου — не знаю исхода и входа моего (слав. «исхода и входа»)."
  8: "ὁ δὲ δοῦλός σου ἐν μέσῳ τοῦ λαοῦ σου — раб же Твой посреди народа Твоего; ὃν ἐξελέξω — которого избрал; ὃς οὐκ ἀριθμηθήσεται — который не будет исчислен; ἀπὸ πλήθους — от множества."
  9: "καρδίαν ἀκούειν — «сердце слышащее» (ἀκούω — и слышать, и слушаться); по решению передано 従う心; слав. «сердце смыслено слышати». διακρίνειν τὸν λαόν — различать, судить народ; ἀνὰ μέσον ἀγαθοῦ καὶ κακοῦ — между добром и злом; λαὸν τὸν βαρύν — народ тяжёлый, т. е. многочисленный."
  10: "ἤρεσεν ἐνώπιον κυρίου — было угодно пред Господом (ἀρέσκω); ὅτι ᾐτήσατο τὸ ῥῆμα τοῦτο — что испросил слово это (αἰτέω)."
  11: "Ἀνθ᾽ ὧν — «за то, что»; οὐκ ᾐτήσω σαυτῷ ἡμέρας πολλάς — не просил себе дней многих; πλοῦτον — богатство; ψυχὰς ἐχθρῶν σου — души врагов твоих (жизни); σύνεσιν τοῦ εἰσακούειν κρίμα — разумение, чтобы внимать суду."
  12: "πεποίηκα — сделал (перф.); δέδωκά σοι — дал тебе (перф.); καρδίαν φρονίμην καὶ σοφήν — сердце разумное и мудрое; ὡς σὺ οὐ γέγονεν ἔμπροσθέν σου — как ты, не было прежде тебя; οὐκ ἀναστήσεται ὅμοιός σοι — не восстанет подобный тебе."
  13: "ἃ οὐκ ᾐτήσω — чего не просил; πλοῦτον καὶ δόξαν — богатство и славу; ὡς οὐ γέγονεν ἀνὴρ ὅμοιός σοι ἐν βασιλεῦσιν — как не было мужа, подобного тебе, между царями. Слав. добавляет «во вся дни твоя» (из МТ) — внесено в основной текст без скобок."
  14: "ἐὰν πορευθῇς ἐν τῇ ὁδῷ μου — если пойдёшь путём Моим; φυλάσσειν τὰς ἐντολάς — хранить заповеди; ὡς ἐπορεύθη Δαυιδ ὁ πατήρ σου — как ходил Давид, отец твой; πληθυνῶ τὰς ἡμέρας σου — умножу дни твои."
  15: "ἐξυπνίσθη — пробудился (ἐξυπνίζω); ἐνύπνιον — сновидение; κατὰ πρόσωπον τοῦ θυσιαστηρίου τοῦ κατὰ πρόσωπον κιβωτοῦ — пред лицом жертвенника, что пред ковчегом; ἀνήγαγεν ὁλοκαυτώσεις — вознёс всесожжения; ἐποίησεν εἰρηνικάς — совершил мирные жертвы (酬恩祭); πότον μέγαν — большой пир (πότος, 酒宴)."
  16: "Τότε — тогда; ὤφθησαν — явились; πόρναι — блудницы (遊女); ἔστησαν ἐνώπιον αὐτοῦ — стали пред ним (ἵστημι)."
  17: "Ἐν ἐμοί, κύριε — букв. «во мне, господи»: еврейская формула вежливости, «прошу тебя, господин мой»; передана お願いだ. οἰκοῦμεν ἐν οἴκῳ ἑνί — живём в одном доме; ἐτέκομεν ἐν τῷ οἴκῳ — родили в доме."
  18: "ἐν τῇ ἡμέρᾳ τῇ τρίτῃ τεκούσης μου — в третий день после того, как я родила (род. самостоятельный); καὶ ἡμεῖς κατὰ τὸ αὐτό — и мы вместе; οὐκ ἔστιν οὐθεὶς μεθ᾽ ἡμῶν πάρεξ ἀμφοτέρων — нет никого с нами, кроме нас обеих."
  19: "ἀπέθανεν ὁ υἱὸς τῆς γυναικὸς ταύτης τὴν νύκτα — умер сын этой женщины ночью; ὡς ἐπεκοιμήθη ἐπ᾽ αὐτόν — так как заспала его (ἐπικοιμάομαι — лечь на него); слав. «яко лежа на нем»."
  20: "μέσης τῆς νυκτός — среди ночи (род. времени); ἐκ τῶν ἀγκαλῶν μου — из объятий моих (ἀγκάλη); ἐν τῷ κόλπῳ αὐτῆς — в лоно, на грудь (κόλπος, 懐); τὸ τεθνηκός — умершее (перф. прич.)."
  21: "θηλάσαι — накормить грудью (θηλάζω); ἐκεῖνος ἦν τεθνηκώς — тот был мёртв (перф.); κατενόησα — всмотрелась, вгляделась (κατανοέω); οὐκ ἦν ὁ υἱός μου, ὃν ἔτεκον — не был сын мой, которого я родила."
  22: "ἡ ἑτέρα — другая; Οὐχί — нет, не так; ὁ υἱός μου ὁ ζῶν — сын мой живой; ἐλάλησαν ἐνώπιον τοῦ βασιλέως — говорили пред царём. В Синод. спор распространён по МТ; здесь кратко, по гр./слав."
  23: "Σὺ λέγεις — ты говоришь; Οὗτος ὁ υἱός μου ὁ ζῶν — этот сын мой живой; повтор реплик женщин в косвенной речи, как в гр. (слав. «ты глаголеши»)."
  24: "Λάβετέ μοι μάχαιραν — «возьмите мне меч» (μάχαιρα); προσήνεγκαν τὴν μάχαιραν ἐνώπιον τοῦ βασιλέως — принесли меч пред царя."
  25: "Διέλετε — разделите (διαιρέω); τὸ παιδίον τὸ θηλάζον τὸ ζῶν — дитя сосущее живое; εἰς δύο — на две части; τὸ ἥμισυ αὐτοῦ — половину его (каждой)."
  26: "ἐταράχθη ἡ μήτρα αὐτῆς ἐπὶ τῷ υἱῷ αὐτῆς — взволновалась утроба её о сыне её (μήτρα — матка, утроба); передано 心が騒ぎ立つ. θανάτῳ μὴ θανατώσητε — «смертью не умертвите» (усиление); Μήτε ἐμοὶ μήτε αὐτῇ ἔστω — пусть не будет ни мне, ни ей; διέλετε — разделите."
  27: "τῇ εἰπούσῃ — сказавшей (прич. аорист); Δότε τὸ παιδίον ... καὶ θανάτῳ μὴ θανατώσητε — дайте дитя и смертью не умертвите; αὐτὴ ἡ μήτηρ αὐτοῦ — она мать его."
  28: "τὸ κρῖμα — суд, приговор (κρίμα); ἐφοβήθησαν ἀπὸ προσώπου τοῦ βασιλέως — убоялись лица царя; φρόνησις θεοῦ ἐν αὐτῷ — разум Божий в нём; δικαίωμα — правый суд, оправдание (слав. «оправдания»)."
