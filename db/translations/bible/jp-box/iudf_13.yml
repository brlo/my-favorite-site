verses:
  1: "夕方[ゆうがた]になると、彼のしもべたちは急[いそ]いで立[た]ち去[さ]ろうとした。バゴアスは外[そと]から天幕[てんまく]を閉[と]じ、自分の主人[しゅじん]の前[まえ]に立[た]っていた者[もの]たちを退[しりぞ]かせた。彼らは自分たちの寝床[ねどこ]へ去[さ]って行[い]った。酒宴[しゅえん]が長引[ながび]いたため、皆[みな]が疲[つか]れていたからである。"
  2: "しかし、ユディトだけが天幕[てんまく]のうちに残[のこ]った。ホロフェルネスは自分の寝台[しんだい]に伏[ふ]していた。彼はぶどう酒に満[み]ちあふれていたからである。"
  3: "ユディトは自分の女奴隷[おんなどれい]に言[い]った。「わたしの寝室[しんしつ]の外[そと]に立[た]って、日[ひ]ごとのように、わたしの出[で]るのを待[ま]ちなさい。わたしは祈[いの]りのために出[で]て行[ゆ]くからである。」彼女はバゴアスにもこれらの言葉[ことば]どおりに語った。"
  4: "皆[みな]が彼女[かのじょ]の前[まえ]から去[さ]り、寝室[しんしつ]には小[ちい]さな者[もの]から大[おお]きな者[もの]まで一人[ひとり]も残[のこ]らなかった。ユディトは彼の寝台[しんだい]のそばに立[た]って、心[こころ]のうちに言[い]った。「すべての力[ちから]の主[しゅ]である神[かみ]よ、この時[とき]、エルサレムを高[たか]く挙[あ]げるために、わたしの手[て]のわざに目[め]を注[そそ]いでください。"
  5: "今[いま]こそ、あなたの嗣業[しぎょう]を助[たす]け、わたしの企[くわだ]てを、わたしたちに逆[さか]らって立[た]った敵[てき]の打[う]ち砕[くだ]きとして成[な]し遂[と]げる時[とき]だからである。」"
  6: "そして、ホロフェルネスの頭[あたま]のあたりにある寝台[しんだい]の柱[はしら]に近[ちか]づき、彼から短剣[たんけん]を下[お]ろした。"
  7: "彼女は寝台[しんだい]に近[ちか]づいて、彼の頭[あたま]の髪[かみ]をつかみ、言[い]った。「イスラエルの神[かみ]である主[しゅ]よ、この日[ひ]、わたしを強[つよ]くしてください。」"
  8: "そして、自分の力[ちから]をもって、彼の首[くび]を二度[にど]打[う]ち、彼から頭[あたま]を取[と]り去[さ]った。"
  9: "彼女はその体[からだ]を寝台[しんだい]から転[ころ]がし落[お]とし、垂[た]れ幕[まく]を柱[はしら]から取[と]り外[はず]した。しばらくして、彼女は出[で]て行[い]き、自分の女中[じょちゅう]にホロフェルネスの頭[あたま]を渡[わた]した。"
  10: "彼女はそれを自分の食[た]べ物[もの]の袋[ふくろ]に入[い]れた。二人[ふたり]はいつもの習[なら]わしに従[したが]って、そろって祈[いの]りに出[で]かけた。二人は陣営[じんえい]を通[とお]り抜[ぬ]け、あの谷[たに]を回[まわ]り込[こ]んで、ベトリアの山[やま]に登[のぼ]り、その門[もん]のところへ来[き]た。"
  11: "ユディトは遠[とお]くから門[もん]を守[まも]る者[もの]たちに言[い]った。「開[あ]けよ、門を開けよ。わたしたちとともに神[かみ]がおられる。わたしたちの神が、今日[きょう]もなさったとおり、イスラエルにさらに力[ちから]を、敵[てき]に対しては強[つよ]さを、お与[あた]えになる。」"
  12: "彼女の町[まち]の人々[ひとびと]が彼女の声[こえ]を聞[き]くと、彼らは急[いそ]いで自分たちの町の門[もん]へ下[くだ]り、町の長老[ちょうろう]たちを呼[よ]び集[あつ]めた。"
  13: "小[ちい]さな者[もの]から大[おお]きな者[もの]まで、皆[みな]が駆[か]け寄[よ]った。彼女が来[き]たことは彼らにとって予想外[よそうがい]だったからである。彼らは門を開[ひら]けて二人[ふたり]を迎[むか]え入[い]れ、明[あ]かりのために火[ひ]をともして、二人を取り囲[かこ]んだ。"
  14: "彼女は彼らに大[おお]きな声[こえ]で言った。「神[かみ]をほめたたえよ、ほめたたえよ。神をほめたたえよ。神はイスラエルの家[いえ]からご自分のあわれみを取[と]り去[さ]らず、この夜[よる]、わたしの手[て]によってわたしたちの敵[てき]を打[う]ち砕[くだ]かれた。」"
  15: "彼女は袋[ふくろ]から頭[あたま]を取[と]り出[だ]して見[み]せ、彼らに言った。「見[み]よ、アッシリアの軍勢[ぐんぜい]の総大将[そうだいしょう]ホロフェルネスの頭である。そして見よ、彼が自分の酔[よ]いの中[なか]に横[よこ]たわっていた垂[た]れ幕[まく]である。主[しゅ]は女[おんな]の手[て]によって彼を打[う]たれた。"
  16: "主[しゅ]は生[い]きておられる。主はわたしが歩[あゆ]んだ道[みち]でわたしを守[まも]られた。わたしの顔[かお]が彼を欺[あざむ]いて彼の滅[ほろ]びとなり、彼はわたしに対して、汚[けが]れや恥[はじ]となる罪[つみ]を犯[おか]さなかったからである。」"
  17: "民[たみ]は皆[みな]、ひどく驚[おどろ]いた。彼らは身[み]をかがめて神[かみ]を拝[おが]み、心[こころ]を一[ひと]つにして言った。「あなたはほむべきかな、わたしたちの神[かみ]よ。あなたはこの日[ひ]、あなたの民[たみ]の敵[てき]を取[と]るに足[た]らない者[もの]とされた。」"
  18: "オジヤは彼女に言[い]った。「娘[むすめ]よ、あなたは地[ち]の上[うえ]のすべての女[おんな]たちよりも、いと高[たか]き神[かみ]によって祝福[しゅくふく]されている。また、天[てん]と地[ち]を造[つく]られた主[しゅ]である神も、ほむべきかな。主はわたしたちの敵[てき]の長[かしら]の頭[あたま]に傷[きず]を負[お]わせるために、あなたを導[みちび]かれた。"
  19: "あなたの希望[きぼう]は、神[かみ]の力[ちから]を覚[おぼ]えている人々[ひとびと]の心[こころ]から、永遠[とこしえ]に離[はな]れることはないからである。"
  20: "どうか、神[かみ]があなたに、永遠[えいえん]の高[たか]みとしてこれを成[な]し、良[よ]いことのうちにあなたを顧[かえり]みてくださるように。あなたはわたしたちの一族[いちぞく]の辱[はずかし]めのゆえに、自分の命[いのち]を惜[お]しまず、かえってわたしたちが倒[たお]れたとき、わたしたちの神[かみ]の前[まえ]をまっすぐに歩[あゆ]んで、わたしたちの倒れたところへ進[すす]み出[で]たからである。」民[たみ]は皆[みな]言った。「そうなりますように、そうなりますように。」"

notes:
  1: "Ὡς δὲ ὀψία ἐγένετο — когда наступил вечер (ὀψία). ἀναλύειν — уходить, сниматься (ἀναλύω); слав. «отити». συνέκλεισεν τὴν σκηνὴν ἔξωθεν — запер шатёр снаружи (συγκλείω). ἀπέκλεισεν τοὺς παρεστῶτας ἐκ προσώπου — отстранил предстоявших от лица (ἀποκλείω); слав. «отпусти предстоящих». κοίτας — ложа, постели (κοίτη). κεκοπωμένοι — утомлённые (perf. κοπιάω). ἐπὶ πλεῖον γεγονέναι τὸν πότον — что пир стал слишком долгим."
  2: "ὑπελείφθη — осталась (аор. пасс. ὑπολείπω). προπεπτωκὼς ἐπὶ τὴν κλίνην — упавший на ложе (προπίπτω). ἦν γὰρ περικεχυμένος αὐτῷ ὁ οἶνος — «ибо вино было разлито вокруг него» (περιχέω, perf. pass.); слав. «бяше бо преисполнен вином» и Син. «был переполнен вином» поняли иначе — в тексте церковное чтение, буквальный смысл LXX отмечен здесь."
  3: "στῆναι ἔξω τοῦ κοιτῶνος — стать вне спальни (κοιτών — 寝室). ἐπιτηρεῖν τὴν ἔξοδον αὐτῆς — наблюдать за выходом её (ἐπιτηρέω). καθάπερ καθ᾽ ἡμέραν — как каждый день. ἐξελεύσεσθαι γὰρ ἔφη ἐπὶ τὴν προσευχὴν αὐτῆς — ибо, говорила она, выйдет на молитву свою (φημί). τῷ Βαγώᾳ ἐλάλησεν κατὰ τὰ ῥήματα ταῦτα — и Багоасу сказала те же слова."
  4: "ἀπήλθοσαν πάντες ἐκ προσώπου — ушли все от лица [её]; слав. добавляет «ея» (нет в LXX). ἀπὸ μικροῦ ἕως μεγάλου — от малого до великого. στᾶσα παρὰ τὴν κλίνην — став у ложа. εἶπεν ἐν τῇ καρδίᾳ αὐτῆς — сказала в сердце своём: молитва без слов, поэтому 心のうちに言った. ἐπὶ τὰ ἔργα τῶν χειρῶν μου — на дела рук моих. εἰς ὕψωμα Ιερουσαλημ — к возвышению Иерусалима (ὕψωμα)."
  5: "ἀντιλαβέσθαι τῆς κληρονομίας σου — взяться за наследие Твоё, помочь ему (ἀντιλαμβάνομαι + род.). ἐπιτήδευμα — начинание, замысел. εἰς θραῦσμα ἐχθρῶν — в сокрушение врагов (θραῦσμα — раздробление). ἐπανέστησαν ἡμῖν — восстали на нас (ἐπανίστημι). Молитва начата в ст. 4 и закрывается здесь."
  6: "κανών — столбик, стержень ложа (κανών); слав. «столпник одра», Син. «столбик постели». πρὸς κεφαλῆς — в головах (πρός + род.). καθεῖλεν — снял, спустил (καθαιρέω). ἀκινάκης — короткий персидский меч, 短剣 (слав. «мечь»). Стих обрывается без точки, как и в греческом."
  7: "ἐγγίσασα τῆς κλίνης — приблизившись к ложу (ἐγγίζω + род.). ἐδράξατο τῆς κόμης — схватила волосы (δράσσομαι + род.; κόμη — волосы). Κραταίωσόν με — укрепи меня (κραταιόω, импер. аор.). κύριε ὁ θεὸς Ισραηλ — звательные: Господи, Боже Израилев."
  8: "ἐπάταξεν εἰς τὸν τράχηλον — ударила в шею (πατάσσω; τράχηλος — шея, слав. «выя»). δίς — дважды. ἐν τῇ ἰσχύι αὐτῆς — в силе своей (ἰσχύς). ἀφεῖλεν — сняла, отняла (ἀφαιρέω)."
  9: "ἀπεκύλισε — скатила, отвалила (ἀποκυλίω). στρωμνή — постель, подстилка. ἀφεῖλε τὸ κωνώπιον ἀπὸ τῶν στύλων — сняла завесу (москитный полог) со столбов; κωνώπιον — полог от комаров, слав. «завеса», поэтому 垂れ幕. μετ᾽ ὀλίγον — вскоре, спустя немного. ἅβρα — служанка, 女中 (слав. «рабыня»)."
  10: "πήρα τῶν βρωμάτων — мешок с едой (πήρα — 袋; βρῶμα — пища). ἐθισμός — обычай, привычка. διελθοῦσαι τὴν παρεμβολήν — пройдя стан (παρεμβολή). ἐκύκλωσαν τὴν φάραγγα — обошли долину кругом (κυκλόω). προσανέβησαν τὸ ὄρος — поднялись на гору (προσαναβαίνω). Слав. здесь неожиданно даёт формы двойственного числа 2-го лица («изыдосте… обыдосте… взыдосте… приидосте»); греч. держит 3-е лицо мн. ч., за ним и перевод."
  11: "μακρόθεν — издалека. τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν — стражам при воротах (φυλάσσω). Ἀνοίξατε ἀνοίξατε — двойной императив, усиление. μεθ᾽ ἡμῶν ὁ θεός — «с нами Бог» (ср. Ис 7:14; 8:8). ποιῆσαι ἔτι ἰσχὺν ἐν Ισραηλ — сотворить ещё силу в Израиле: инфинитив цели при «с нами Бог», передан финитно. κράτος κατὰ τῶν ἐχθρῶν — крепость, мощь на врагов."
  12: "οἱ ἄνδρες τῆς πόλεως αὐτῆς — мужи города её. ἐσπούδασαν τοῦ καταβῆναι — поспешили сойти (σπεύδω + инф.). συνεκάλεσαν τοὺς πρεσβυτέρους — созвали старейшин (συγκαλέω; πρεσβύτερος — 長老)."
  13: "συνέδραμον — сбежались (συντρέχω). ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν — от малого до великого их. παράδοξον ἦν αὐτοῖς τὸ ἐλθεῖν αὐτήν — сверх чаяния было для них пришествие её (παράδοξος). ὑπεδέξαντο — приняли (ὑποδέχομαι). ἅψαντες πῦρ εἰς φαῦσιν — зажёгши огонь для освещения (ἅπτω; φαῦσις — свет). περιεκύκλωσαν — окружили (περικυκλόω)."
  14: "φωνῇ μεγάλῃ — громким голосом. Αἰνεῖτε τὸν θεόν, αἰνεῖτε· αἰνεῖτε τὸν θεόν — троекратное «хвалите», повтор сохранён. οὐκ ἀπέστησεν τὸ ἔλεος αὐτοῦ — не отнял, не отставил милости Своей (ἀφίστημι); слав. «не отстави милости». ἔθραυσε — сокрушил (θραύω). διὰ χειρός μου — рукою моею."
  15: "προελοῦσα — вынув (προαιρέω). ἀρχιστράτηγος δυνάμεως Ασσουρ — главнокомандующий силы Ассура, 総大将 (по корпусу). κωνώπιον — полог, завеса (слав. «завеса»). ἐν ταῖς μέθαις αὐτοῦ — в опьянении своём (μέθη — пьянство). ἐν χειρὶ θηλείας — рукою женщины (θῆλυς — женский)."
  16: "ζῇ κύριος — «жив Господь»: клятвенная формула. διεφύλαξέν με — сохранил меня (διαφυλάσσω). ᾗ ἐπορεύθην — которым я шла (πορεύομαι). ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου — обмануло его лицо моё (ἀπατάω). εἰς ἀπώλειαν αὐτοῦ — на погибель его. οὐκ ἐποίησεν ἁμάρτημα μετ᾽ ἐμοῦ — не сделал греха со мною. εἰς μίασμα καὶ αἰσχύνην — в осквернение и позор (μίασμα — скверна)."
  17: "ἐξέστη — изумился (ἐξίστημι). κύψαντες — преклонившись (κύπτω). ὁμοθυμαδόν — единодушно. Εὐλογητὸς εἶ — «благословен Ты». ὁ ἐξουδενώσας — уничиживший, обративший в ничто (ἐξουδενόω); поэтому 取るに足らない者とされた."
  18: "Εὐλογητὴ σύ, θύγατερ — «благословенна ты, дочь». τῷ θεῷ τῷ ὑψίστῳ — Богом Всевышним (дат. действующего лица при пассиве). παρὰ πάσας τὰς γυναῖκας — более всех жён. ὁ κτίσας — создавший (κτίζω). κατεύθυνέν σε εἰς τραῦμα κεφαλῆς — направил тебя на рану, поражение головы (τραῦμα — рана; слав. «на сокрушение главы»). ἄρχων τῶν ἐχθρῶν — начальник врагов."
  19: "οὐκ ἀποστήσεται ἡ ἐλπίς σου — не отступит надежда твоя (ἀφίστημι). ἀπὸ καρδίας ἀνθρώπων μνημονευόντων — от сердца людей, помнящих (μνημονεύω). ἰσχὺν θεοῦ — силу Божию. ἕως αἰῶνος — до века."
  20: "ποιήσαι σοι αὐτὰ ὁ θεὸς εἰς ὕψος αἰώνιον — да сотворит тебе это Бог в высоту, возвышение вечное (ὕψος); оптатив. ἐπισκέψασθαι ἐν ἀγαθοῖς — посетить благами (ἐπισκέπτομαι). ἀνθ᾽ ὧν — за то, что. οὐκ ἐφείσω τῆς ψυχῆς σου — не пощадила души твоей (φείδομαι). διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν — ради уничижения рода нашего. ἐπεξῆλθες τῷ πτώματι ἡμῶν — тёмное место: «выступила при падении нашем» (ἐπέξειμι); слав. «пособствовала еси падению нашему», Син. «выступила вперёд, когда мы падали»; в тексте «выступила при падении нашем» (わたしたちの倒れたところへ進み出た), без сглаживания. ἐπ᾽ εὐθεῖαν πορευθεῖσα — ходя прямо. Γένοιτο γένοιτο — «да будет, да будет» (слав. «буди, буди»), двойное подтверждение; слова народа — отдельная реплика после речи Озии."
