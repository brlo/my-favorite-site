# jp-box, Иудифь, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Иудифи нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: вечер, все уходят (1), Иудифь одна с пьяным Олоферном (2), велит служанке
# ждать у входа (3), все уходят; молитва в сердце (4–5), берёт короткий меч (6), схватывает
# волосы и молится (7), два удара и отсечение головы (8), скатывает тело и снимает
# завесу (9), отдаёт голову служанке, кладёт в мешок, уходят (10), кричит стражам
# у ворот (11), город сбегается (12–13), её речь (14–16), народ благословляет Бога
# (17), Озия благословляет её (18–20), «да будет, да будет».
# Речь — 「…」: 3, 4–5 (молитва в сердце), 7, 11, 14–16 (её речь к городу), 17 (народ),
# 18–20 (Озия); слова народа в 20 — отдельная реплика 「…」 после речи Озии.
# 『…』 нет: вложенной речи в главе нет. Красного и синего нет.
# Нумерация по gr: 20 стихов; деление совпадает с csl. Слав. 13:10 даёт неожиданные
# формы двойственного числа 2-го лица («изыдосте… обыдосте…»), греч. — 3-е мн. ч.;
# держимся греческого.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 短剣, 垂れ幕, 総大将, 嗣業, 女中 уже в корпусе или в брифе.
# Имена — транслитерация греческого (LXX): ユディト, ホロフェルネス, バゴアス, オジヤ.

