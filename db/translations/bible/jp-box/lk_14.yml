verses:
  1: "安息日[あんそくび]に、イエスはファリサイ派[は]の指導者[しどうしゃ]の一人[ひとり]の家[いえ]に入[はい]ってパンを食[た]べようとされた。彼[かれ]らはイエスをじっと見[み]つめていた。"
  2: "すると、水腫[すいしゅ]を病[や]む人[ひと]がイエスの前[まえ]にいた。"
  3: "イエスは律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の人々[ひとびと]に答[こた]えて言[い]われた。「<j>安息日[あんそくび]に癒[いや]すことは許[ゆる]されるか。</j>」"
  4: "彼[かれ]らは黙[だま]っていた。イエスはその人[ひと]の手[て]を取[と]って癒[いや]し、帰[かえ]らせた。"
  5: "そして、彼[かれ]らに言[い]われた。「<j>あなたがたのうち、だれかが自分のろばか牛[うし]を井戸[いど]に落[お]としたら、安息日[あんそくび]でもすぐに引[ひ]き上[あ]げるではないか。</j>」"
  6: "彼[かれ]らはこれに答[こた]えることができなかった。"
  7: "イエスは、招[まね]かれた者[もの]たちが上座[かみざ]を選[えら]んでいるのをご覧[らん]になって、彼[かれ]らにたとえを語[かた]って言[い]われた。"
  8: "「<j>だれかに婚宴[こんえん]に招[まね]かれたら、上座[かみざ]に着[つ]いてはならない。あなたより尊[とうと]い人[ひと]が招[まね]かれているかもしれないからである。</j>"
  9: "<j>すると、あなたとその人[ひと]を招[まね]いた主[あるじ]が来[き]て、『この人[ひと]に席[せき]を譲[ゆず]ってください』と言[い]うであろう。そのとき、あなたは恥[は]ずかしげに末席[まっせき]に着[つ]くことになる。</j>"
  10: "<j>むしろ、招[まね]かれたら、末席[まっせき]に行[い]って着[つ]きなさい。そうすれば、あなたを招[まね]いた人[ひと]が来[き]たとき、『友[とも]よ、もっと上[うえ]へ進[すす]んでください』と言[い]うであろう。そのとき、あなたは同席[どうせき]の者[もの]たちの前[まえ]で名誉[めいよ]を受[う]ける。</j>"
  11: "<j>だれでも、自分[じぶん]を高[たか]くする者[もの]は低[ひく]くされ、自分[じぶん]を低[ひく]くする者[もの]は高[たか]くされるからである。</j>」"
  12: "イエスはまた、自分[じぶん]を招[まね]いた人[ひと]にも言[い]われた。「<j>昼食[ちゅうしょく]や夕食[ゆうしょく]を用意[ようい]するとき、友人[ゆうじん]や兄弟[きょうだい]、親類[しんるい]、それに裕福[ゆうふく]な隣人[りんじん]を呼[よ]んではならない。彼[かれ]らもあなたを招[まね]き返[かえ]して、あなたに返礼[へんれい]があるかもしれないからである。</j>"
  13: "<j>むしろ、宴会[えんかい]を開[ひら]くときは、貧[まず]しい者[もの]、体[からだ]に障[さわ]りのある者[もの]、足[あし]のきかない者[もの]、目[め]の見[み]えない者[もの]を招[まね]きなさい。</j>"
  14: "<j>そうすれば、あなたは幸[さいわ]いである。彼[かれ]らにはあなたに返[かえ]すことができないからである。あなたは正[ただ]しい人[ひと]たちの復活[ふっかつ]のとき、報[むく]いを受[う]ける。</j>」"
  15: "同席[どうせき]の者[もの]の一人[ひとり]がこれを聞[き]いて、イエスに言[い]った。「神[かみ]の国[くに]でパンを食[た]べる者[もの]は幸[さいわ]いです。」"
  16: "イエスは言[い]われた。「<j>ある人[ひと]が大[おお]きな宴会[えんかい]を開[ひら]いて、多[おお]くの人[ひと]を招[まね]いた。</j>"
  17: "<j>そして、宴会[えんかい]の時[とき]になると、僕[しもべ]を遣[つか]わして、招[まね]かれた者[もの]たちにこう言[い]わせた。『さあ、おいでください。もうすっかり用意[ようい]が整[ととの]いました。』</j>"
  18: "<j>ところが、彼[かれ]らはみな、そろって断[ことわ]り始[はじ]めた。最初[さいしょ]の者[もの]は言[い]った。『畑[はたけ]を買[か]いましたので、見[み]に行[い]って確[たし]かめなければなりません。お願[ねが]いですから、わたしの断[ことわ]りをお許[ゆる]しください。』</j>"
  19: "<j>次[つぎ]の者[もの]は言[い]った。『牛[うし]を五対[ごつい]買[か]いましたので、それを試[ため]しに行[い]くところです。お願[ねが]いですから、わたしの断[ことわ]りをお許[ゆる]しください。』</j>"
  20: "<j>また別[べつ]の者[もの]は言[い]った。『妻[つま]を迎[むか]えたばかりですので、行[い]くことができません。』</j>"
  21: "<j>僕[しもべ]は帰[かえ]って、このことを主人[しゅじん]に告[つ]げた。すると、家[いえ]の主人[しゅじん]は怒[おこ]って、僕[しもべ]に言[い]った。『急[いそ]いで町[まち]の大通[おおどお]りや路地[ろじ]に出[で]て、貧[まず]しい者[もの]、体[からだ]に障[さわ]りのある者[もの]、足[あし]のきかない者[もの]、目[め]の見[み]えない者[もの]を、ここへ連[つ]れて来[き]なさい。』</j>"
  22: "<j>僕[しもべ]は言[い]った。『ご主人[しゅじん]さま、お命[めい]じのとおりにいたしましたが、まだ席[せき]が空[あ]いております。』</j>"
  23: "<j>主人[しゅじん]は僕[しもべ]に言[い]った。『街道[かいどう]や生[い]け垣[がき]のあいだに出[で]て、無理[むり]にでも入[はい]らせて、わたしの家[いえ]を満[み]たしなさい。</j>"
  24: "<j>あなたがたに言[い]っておく。あの招[まね]かれた者[もの]たちのうち、だれ一人[ひとり]としてわたしの宴会[えんかい]の料理[りょうり]を味[あじ]わう者[もの]はない。〔招[まね]かれる者[もの]は多[おお]いが、選[えら]ばれる者[もの]は少[すく]ない。〕』</j>」"
  25: "大[おお]ぜいの群衆[ぐんしゅう]がイエスと一緒[いっしょ]に歩[あゆ]んでいた。イエスは振[ふ]り向[む]いて、彼[かれ]らに言[い]われた。"
  26: "「<j>わたしのもとへ来[く]る者[もの]は、自分[じぶん]の父[ちち]、母[はは]、妻[つま]、子[こ]ども、兄弟[きょうだい]、姉妹[しまい]、さらに自分[じぶん]の命[いのち]さえも憎[にく]まなければ、わたしの弟子[でし]になることはできない。</j>"
  27: "<j>自分[じぶん]の十字架[じゅうじか]を負[お]ってわたしの後[あと]について来[こ]ない者[もの]も、わたしの弟子[でし]になることはできない。</j>"
  28: "<j>あなたがたのうち、だれが塔[とう]を建[た]てようとするとき、まず座[すわ]って、仕上[しあ]げるのに足[た]りるだけの費用[ひよう]があるかどうかを計算[けいさん]しないだろうか。</j>"
  29: "<j>そうしないと、土台[どだい]を据[す]えたままで仕上[しあ]げることができなくなったとき、見[み]ている者[もの]たちはみな、その人[ひと]を笑[わら]い始[はじ]める。</j>"
  30: "<j>『この人[ひと]は建[た]て始[はじ]めたのに、仕上[しあ]げることができなかった』と言[い]って。</j>"
  31: "<j>また、どの王[おう]が、ほかの王[おう]と戦[たたか]うために出[で]て行[い]くとき、まず座[すわ]って、一万人[いちまんにん]で、二万人[にまんにん]を率[ひき]いて自分[じぶん]に攻[せ]めて来[く]る者[もの]に立[た]ち向[か]えることができるかどうかを考[かんが]えないだろうか。</j>"
  32: "<j>できないとなれば、相手[あいて]がまだ遠[とお]くにいるうちに使者[ししゃ]を遣[つか]わして、和平[わへい]を願[ねが]うであろう。</j>"
  33: "<j>同じように、あなたがたのうち、自分[じぶん]の持[も]っているものをすべて手放[てばな]さない者[もの]は、だれもわたしの弟子[でし]になることはできない。</j>"
  34: "<j>塩[しお]は良[よ]いものである。しかし、塩[しお]がその味[あじ]を失[うしな]ったら、何[なに]でそれに味[あじ]をつけることができるだろうか。</j>"
  35: "<j>土地[とち]にも肥[こ]やしにも役[やく]に立[た]たない。外[そと]に捨[す]てるだけである。聞[き]く耳[みみ]を持[も]つ者[もの]は、聞[き]きなさい。</j>」"

notes:
  1: "ἄρχων τῶν Φαρισαίων — ファリサイ派の指導者. παρατηρούμενοι — «наблюдали»; じっと見つめていた."
  2: "ὑδρωπικός — «водяночный»; 水腫を病む."
  3: "νομικοί — 律法学者. Ἔξεστιν… ἢ οὔ; в критическом есть ἢ οὔ, у jp-joc и Елизаветинской вопрос без «или нет» — 許されるか."
  4: "ἐπιλαβόμενος — «взяв [за руку]»; 手を取って. ἀπέλυσεν — «отпустил»; 帰らせた."
  5: "В критическом υἱὸς ἢ βοῦς («сын или вол»), в TR/Елизаветинской/jp-joc ὄνος ἢ βοῦς — ろばか牛; взято церковное чтение, без 〔〕 (замена, а не добавка)."
  6: "οὐκ ἴσχυσαν ἀνταποκριθῆναι — 答えることができなかった."
  7: "ἐπέχων — «наблюдая, обращая внимание»; 目を留め."
  8: "γάμοι — 婚宴. πρωτοκλισία — 上座."
  9: "Δὸς τούτῳ τόπον — この人に席を譲ってください."
  10: "προσανάβηθι ἀνώτερον — «поднимись выше»; もっと上へ進んでください."
  11: "ὁ ὑψῶν ἑαυτόν — 自分を高くする者."
  12: "ἄριστον ἢ δεῖπνον — 昼食や夕食; δοχή (13) — 宴会. ἀνταπόδομα — 返礼."
  13: "ἀναπείρους, χωλούς, τυφλούς — 体に障りのある者、足のきかない者、目の見えない者 (порядок jp-joc)."
  14: "ἀνταποδοθήσεται — «воздастся»; 報いを受ける."
  15: "Слова гостя — не красным. ἄρτον φάγεται — パンを食べる者."
  16: "δεῖπνον μέγα — 大きな宴会."
  17: "ἕτοιμα — 用意が整いました."
  18: "ἀπὸ μιᾶς — «единодушно»; そろって. ἔχε με παρῃτημένον — «извини меня»; 断りをお許しください."
  19: "Ζεύγη βοῶν πέντε — «пять пар волов»; 牛を五対."
  20: "γυναῖκα ἔγημα — «жену взял»; 妻を迎えた."
  21: "ῥύμαι — «переулки»; 路地."
  22: "γέγονεν ὃ ἐπέταξας — お命じのとおりにいたしました. ἔτι τόπος ἐστίν — «ещё есть место»; まだ席が空いております."
  23: "φραγμοί — «изгороди»; 生け垣. ἀνάγκασον — «принуди»; 無理にでも入らせて."
  24: "В критическом стих кончается на γεύσεταί μου τοῦ δείπνου; в TR/Елизаветинской/jp-joc добавлено «много званых, мало избранных» — в 〔〕. Речь хозяина пира — в 『』."
  25: "συνεπορεύοντο — «шли вместе»; 一緒に歩いていた."
  26: "μισεῖ — 憎まなければ; не сглажено. ψυχή — 命."
  27: "βαστάζει τὸν σταυρόν — 十字架を負う."
  28: "ψηφίζει τὴν δαπάνην — «считает издержки»; 費用を計算する. ἀπαρτισμός — «завершение»; 仕上げ."
  29: "θέντος θεμέλιον — «положив основание»; 土台を据えた."
  30: "Насмешка — в 『』."
  31: "δέκα χιλιάσιν… εἴκοσι χιλιάδων — 一万人…二万人."
  32: "πρεσβείαν — 使者; τὰ πρὸς εἰρήνην — 和平."
  33: "ἀποτάσσεται — «отрекается»; 手放す."
  34: "μωρανθῇ — «стал глупым, потерял вкус»; 味を失う. ἀρτυθήσεται — «приправится»; 味をつける."
  35: "εἰς κοπρίαν — «в навоз»; 肥やし. Формула «имеющий уши…» — как в 8:8."
