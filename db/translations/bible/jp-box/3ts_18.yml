verses:
  1: "多[おお]くの日[ひ]が過[す]ぎたころ、第三年目[だいさんねんめ]に、主[しゅ]の言葉[ことば]がエリヤに臨[のぞ]んで言[い]われた。「行[い]ってアハブの前[まえ]に現[あらわ]れなさい。わたしは地[ち]の面[おもて]に雨[あめ]を降[ふ]らせる。」"
  2: "エリヤはアハブの前[まえ]に現[あらわ]れようとして行[い]った。サマリアにはひどい飢饉[ききん]があった。"
  3: "アハブは家令[かれい]アブデヤを呼[よ]んだ。アブデヤは主[しゅ]をひどく恐[おそ]れていた。"
  4: "イゼベルが主[しゅ]の預言者[よげんしゃ]たちを殺[ころ]していたとき、アブデヤは百人[ひゃくにん]の預言者を連[つ]れて行[い]き、五十人[ごじゅうにん]ずつ二[ふた]つの洞窟[どうくつ]に隠[かく]し、パンと水[みず]で養[やしな]っていた。"
  5: "アハブはアブデヤに言[い]った。「さあ、この地[ち]を巡[めぐ]り、水[みず]の泉[いずみ]と谷川[たにがわ]をすべても見[み]て来[こ]よう。草[くさ]が見[み]つかれば、馬[うま]やらばを生[い]かしておける。家畜[かちく]を失[しな]わずに済[す]むように。」"
  6: "彼らは地[ち]を分[わ]けて通[とお]ることにした。アハブは一人[ひとり]で一[ひと]つの道[みち]を行[い]き、アブデヤは一人でほかの道を行[い]った。"
  7: "アブデヤが一人[ひとり]で道[みち]を行[い]っていると、エリヤが一人で彼[かれ]のところへ来[き]た。アブデヤは急[いそ]いで彼の前[まえ]にひれ伏[ふ]して言[い]った。「あなたは、わが主人[しゅじん]エリヤではないか。」"
  8: "エリヤは彼に言[い]った。「わたしだ。行[い]って、あなたの主人[しゅじん]に『エリヤがここにいる』と言[い]いなさい。」"
  9: "アブデヤは言[い]った。「わたしが何[なに]を罪[つみ]に犯[おか]したというので、あなたはこのしもべをアハブの手[て]に渡[わた]して殺[ころ]そうとするのか。"
  10: "あなたの神[かみ]である主[しゅ]は生[い]きておられる。わたしの主人[しゅじん]があなたを捜[さが]しに人[ひと]を遣[つか]わさなかった国[くに]や王国[おうこく]は一[ひと]つもない。そして、『いない』と言うと、彼はその王国とその地方[ちほう]に、あなたが見[み]つからないと誓[ちか]わせた。"
  11: "そして今、あなたはわたしに『行[い]って、あなたの主人[しゅじん]に、エリヤがここにいる、と言え』と言うのか。"
  12: "わたしがあなたから離[はな]れると、主[しゅ]の霊[れい]があなたを、わたしの知[し]らない地[ち]へ運[はこ]んで行[い]くかもしれない。わたしが行[い]ってアハブに告[つ]げ、彼があなたを見[み]つけられなければ、彼はわたしを殺[ころ]すだろう。このしもべは幼[おさな]いときから主を恐[おそ]れてきた。"
  13: "わが主人[しゅじん]よ、あなたに告[つ]げられていないのか。わたしが、イゼベルが主[しゅ]の預言者[よげんしゃ]たちを殺[ころ]したとき、何[なに]をしたか。わたしは主の預言者たちのうち百人[ひゃくにん]を、五十人[ごじゅうにん]ずつ二[ふた]つの洞窟[どうくつ]に隠[かく]し、パンと水[みず]で養[やしな]った。"
  14: "それなのに今、あなたはわたしに『行[い]って、あなたの主人[しゅじん]に、エリヤがここにいる、と言え』と言うのか。彼はわたしを殺[ころ]すだろう。」"
  15: "エリヤは言[い]った。「わたしがその前[まえ]に立[た]つ万軍[ばんぐん]の主[しゅ]は生[い]きておられる。今日[きょう]、わたしは必[かなら]ず彼の前[まえ]に現[あらわ]れる。」"
  16: "アブデヤはアハブに会[あ]いに行[い]って告[つ]げた。アハブは走[はし]り出[で]てエリヤに会[あ]いに出[で]かけた。"
  17: "アハブはエリヤを見[み]ると言[い]った。「イスラエルを乱[みだ]す者[もの]よ、それはあなたか。」"
  18: "エリヤは言[い]った。「わたしがイスラエルを乱[みだ]しているのではない。あなたと、あなたの父[ちち]の家[いえ]が乱しているのだ。あなたがたが自分[じぶん]たちの神[かみ]である主[しゅ]を捨[す]てて、バアルたちに従[したが]ったからである。"
  19: "そして今、人[ひと]を遣[つか]わして、イスラエルのすべての者[もの]をカルメル山[やま]に、またバアルの恥[はじ]ずべき預言者[よげんしゃ]四百五十人[にん]と、木立[こだち]の預言者四百人[にん]、すなわちイゼベルの食卓[しょくたく]から食[た]べている者[もの]たちを、わたしのところに集[あつ]めなさい。」"
  20: "アハブはイスラエルのすべての者[もの]に人を遣[つか]わし、すべての預言者[よげんしゃ]をカルメル山[やま]に集[あつ]めた。"
  21: "エリヤはすべての民[たみ]に近[ちか]づいて言[い]った。「いつまであなたがたは、両足[りょうあし]でびっこを引[ひ]いているのか。もし主[しゅ]が神[かみ]なら、主に従[したが]いなさい。もしバアルが神なら、バアルに従いなさい。」民[たみ]は彼に一言[ひとこと]も答[こた]えなかった。"
  22: "エリヤは民[たみ]に言[い]った。「わたしはただ一人[ひとり]で主[しゅ]の預言者[よげんしゃ]として残[のこ]っているが、バアルの預言者は四百五十人[にん]、木立[こだち]の預言者が四百人[にん]いる。"
  23: "二頭[にとう]の雄牛[おすうし]を私たちに与[あた]えなさい。彼らに一頭[いっとう]を選[えら]ばせ、それを切[き]り裂[さ]かせ、薪[たきぎ]の上[うえ]に置[お]かせなさい。火[ひ]はつけてはならない。わたしももう一頭の雄牛を切[き]り裂[さ]いて用意[ようい]し、薪の上に置く。火はつけない。"
  24: "そして、あなたがたは自分[じぶん]たちの神[かみ]の名[な]を呼[よ]び、わたしは主[しゅ]の名を呼ぼう。火[ひ]をもって答[こた]える神が、その神である。」民[たみ]は皆[みな]答[こた]えて言[い]った。「よい言葉[ことば]だ。」"
  25: "エリヤは恥[はじ]ずべき預言者[よげんしゃ]たちに言[い]った。「あなたがたは多[おお]いのだから、まず一頭[いっとう]の子牛[こうし]を選[えら]んで、それを作[つく]りなさい。自分[じぶん]たちの神[かみ]の名[な]を呼[よ]びなさい。ただし、火[ひ]はつけてはならない。」"
  26: "彼らは子牛[こうし]を取[と]り、それを用意[ようい]して、朝[あさ]から昼[ひる]までバアルの名[な]を呼[よ]び続[つづ]けた。「バアルよ、わたしたちに答[こた]えてくれ。」しかし、声[こえ]もなく、答[こた]えもなかった。彼らは自分[じぶん]たちが造[つく]った祭壇[さいだん]の周[まわ]りを走[はし]り回[まわ]った。"
  27: "昼[ひる]になると、エリヤは彼らをあざ笑[わら]って言[い]った。「大声[おおごえ]で呼[よ]べ。彼は神[かみ]なのだから。彼はきっと考[かんが]え込[こ]んでいるのだ。あるいは、何[なに]かほかのことをしているのか、それとも眠[ねむ]っていて、目[め]を覚[さ]ますのかもしれない。」"
  28: "彼らは大声[おおごえ]で呼[よ]び、自分[じぶん]たちの習[なら]わしに従[したが]って、剣[つるぎ]や槍[やり]で体[からだ]を切[き]り裂[さ]き、むちで自分[じぶん]たちを打[う]ち、血[ち]が流[なが]れ出[で]るまでにした。"
  29: "彼らは夕方[ゆうがた]まで預言[よげん]していた。夕[ゆう]べの捧[ささ]げ物[もの]を献[ささ]げる時[とき]になっても、声[こえ]もなく、答[こた]えもなかった。エリヤは忌[い]まわしいものの預言者[よげんしゃ]たちに言[い]った。「今[いま]から退[しりぞ]きなさい。わたしがわたしの燔祭[はんさい]を献[ささ]げる。」彼らは退[しりぞ]いて、黙[だま]った。"
  30: "エリヤは民[たみ]に言[い]った。「わたしのところへ来[き]なさい。」民[たみ]は皆[みな]、彼のところへ来[き]た。"
  31: "エリヤは、イスラエルの部族[ぶぞく]の数[かず]に合[あ]わせて十二[じゅうに]の石[いし]を取[と]った。主[しゅ]が彼に「あなたの名[な]はイスラエルとなる」と言[い]われたからである。"
  32: "エリヤはその石[いし]で主[しゅ]の名[な]によって祭壇[さいだん]を築[きず]き、壊[こわ]されていた祭壇を直[なお]した。そして祭壇の周[まわ]りに、種[たね]二[に]サタを入[い]れるほどの溝[みぞ]を造[つく]った。"
  33: "彼は薪[たきぎ]を祭壇[さいだん]の上[うえ]に並[なら]べ、燔祭[はんさい]の獣[けもの]を切[き]り裂[さ]いてその薪の上に置[お]き、祭壇の上に載[の]せた。"
  34: "エリヤは言[い]った。「水[みず]を満[み]たした四[よっ]つの水がめを持[も]って来[き]て、燔祭[はんさい]と薪[たきぎ]の上[うえ]に注[そそ]ぎなさい。」彼らはそのとおりにした。彼は言った。「もう一度[いちど]しなさい。」彼らはもう一度した。彼は言った。「三度目[さんどめ]もしなさい。」彼らは三度目をした。"
  35: "水[みず]は祭壇[さいだん]の周[まわ]りに流[なが]れ、溝[みぞ]も水で満[み]たされた。"
  36: "夕[ゆう]べの捧[ささ]げ物[もの]を献[ささ]げる時[とき]に、預言者[よげんしゃ]エリヤが近[ちか]づいて言[い]った。「アブラハムの神[かみ]、イサクの神、ヤコブの神である主[しゅ]よ。今日[きょう]、火[ひ]をもってわたしに答[こた]えてほしい。あなたこそ、イスラエルの唯一[ゆいいつ]の主[しゅ]であること、わたしがあなたのしもべであること、わたしがこれらすべてのことをあなたのために行[おこな]ったことを、この民[たみ]すべてに知[し]らせてほしい。"
  37: "主[しゅ]よ、わたしに答えてほしい。火[ひ]をもって答えてほしい。この民[たみ]に、あなたが主であり神[かみ]であること、あなたがこの民の心[こころ]をあなたのほうへ向[む]け直[なお]されたことを知[し]らせてほしい。」"
  38: "すると、主[しゅ]の火[ひ]が天[てん]から降[ふ]って来[き]て、燔祭[はんさい]と薪[たきぎ]、そして溝[みぞ]の中[なか]の水[みず]を焼[や]き尽[つ]くした。火は石[いし]も土[つち]もなめ尽くした。"
  39: "民[たみ]は皆[みな]、これを見[み]て顔[かお]を地[ち]につけて伏[ふ]し、言[い]った。「主[しゅ]こそ神[かみ]である。主こそ神である。」"
  40: "エリヤは民[たみ]に言[い]った。「バアルの預言者[よげんしゃ]たちを捕[つか]まえなさい。一人[ひとり]も逃[に]がしてはならない。」彼らは預言者たちを捕まえた。エリヤは彼らをキション川[がわ]へ連[つ]れて下[くだ]り、そこで殺[ころ]した。"
  41: "エリヤはアハブに言[い]った。「上[のぼ]って、食[た]べ、飲[の]みなさい。雨[あめ]の足音[あしおと]が聞[き]こえる。」"
  42: "アハブは食[た]べ飲[の]みに上[のぼ]った。エリヤはカルメル山[やま]に上り、地[ち]に身[み]をかがめて、顔[かお]を両膝[りょうひざ]の間[あいだ]に置[お]いた。"
  43: "彼は若者[わかもの]に言[い]った。「上[のぼ]って、海[うみ]のほうを見[み]なさい。」若者は上って見たが、「何[なに]もない」と言[い]った。エリヤは言った。「もう一度、七回[ななかい]まで戻[もど]って見なさい。」"
  44: "七回目[ななかいめ]に、海[うみ]から、人[ひと]の足跡[あしあと]ほどの小[ちい]さな雲[くも]が水[みず]を伴[ともな]って上[あ]がって来[く]るのが見[み]えた。エリヤは言[い]った。「上[のぼ]って、アハブに『戦車[せんしゃ]を繋[つな]いで下[くだ]りなさい。雨[あめ]に捕[つか]まらないように』と言[い]いなさい。」"
  45: "こうしているうちに、天[そら]は雲[くも]と風[かぜ]で暗[くら]くなり、大[おお]きな雨[あめ]が降[ふ]った。アハブは泣[な]きながら、イズレエルへ向[む]かって行[い]った。"
  46: "主[しゅ]の手[て]がエリヤの上[うえ]にあった。彼は腰[こし]を帯[おび]で締[し]め、アハブの前[まえ]をイズレエルまで走[はし]った。"

notes:
  1: "μεθ' ἡμέρας πολλάς — «через много дней». ἐν τῷ ἐνιαυτῷ τῷ τρίτῳ — «в третий год» (засухи). ὄφθητι — «покажись» (страдат. повелит. от ὁράω). ἐπὶ πρόσωπον τῆς γῆς — «на лицо земли»."
  2: "τοῦ ὀφθῆναι τῷ Αχααβ — «чтобы показаться Ахаву» (инфинитив цели). λιμὸς κραταιά — «сильный голод» (飢饉)."
  3: "οἰκονόμος — домоправитель (家令). φοβούμενος τὸν κύριον σφόδρα — «весьма боящийся Господа». В LXX ст. 3b–4 стоят в издательских квадратных скобках; скобки не воспроизведены."
  4: "ἐν τῷ τύπτειν τὴν Ιεζαβελ — «когда избивала Иезавель» (τύπτω). κατὰ πεντήκοντα — «по пятидесяти». σπήλαιον — пещера (洞窟); слав. «во двоих вертепех» — в двух пещерах. διέτρεφεν — «питал» (διατρέφω)."
  5: "Δεῦρο — «иди сюда», давай. διέλθωμεν — «пройдём» (сослагательное). ἐάν πως — «не найдём ли как-нибудь». βοτάνη — трава, зелень (草). περιποιησώμεθα — «сохраним, прокормим». ἡμίονος — лошак (らば). ἐξολοθρευθήσονται — «погибнут» (ἐξολοθρεύω)."
  6: "ἐμέρισαν ἑαυτοῖς τὴν ὁδόν — «разделили между собой путь». ἐν ὁδῷ μιᾷ μόνος — «один по одной дороге»."
  7: "εἰς συνάντησιν — «навстречу». ἔσπευσεν — «поспешил» (σπεύδω). ἔπεσεν ἐπὶ πρόσωπον — «пал на лицо». Εἰ σὺ εἶ αὐτός — «ты ли это сам». κύριέ μου — «господин мой»."
  8: "Ἐγώ — «я». Ἰδού — «вот». Речь Илии — 「…」, слова для Ахава — 『…』."
  9: "Τί ἡμάρτηκα — «чем я согрешил». δίδως εἰς χεῖρα — «предаёшь в руку». θανατῶσαι — «умертвить». Речь Авдия продолжается до ст. 14 (одни кавычки)."
  10: "ζῇ κύριος ὁ θεός σου — клятва. ἔθνος ἢ βασιλεία — «народ или царство». ἐνέπρησεν — «сжёг» (ἐμπίπρημι); слав. «закля» — «заставил поклясться» (следует МТ) — чтение внесено в текст, LXX-вариант «сжёг» отмечен. οὐχ εὕρηκέν σε — «не нашёл тебя»."
  11: "ἀνάγγελλε — «объяви, возвести» (ἀναγγέλλω). Слова Илии внутри речи Авдия — 『…』."
  12: "πνεῦμα κυρίου ἀρεῖ σε — «Дух Господень унесёт тебя» (αἴρω). εἰς γῆν, ἣν οὐκ οἶδα — «в землю, которой я не знаю». ἀποκτενεῖ με — «убьёт меня». ἐκ νεότητος — «от юности»."
  13: "ἦ οὐκ ἀπηγγέλη σοι τῷ κυρίῳ μου — «разве не возвещено тебе, господину моему» (Авдий обращается к Илии). οἷα πεποίηκα — «что я сделал» (перфект). ἀνὰ πεντήκοντα — «по пятидесяти». ἔθρεψα — «питал» (τρέφω)."
  14: "καὶ νῦν — «и теперь». ἀποκτενεῖ με — «убьёт меня». Конец речи Авдия; кавычки закрываются."
  15: "Ζῇ κύριος τῶν δυνάμεων — «жив Господь сил» (слав. «жив Господь сил»). ᾧ παρέστην — «Которому предстою». σήμερον ὀφθήσομαι αὐτῷ — «сегодня явлюсь ему»."
  16: "εἰς συναντήν — «навстречу». ἐξέδραμεν — «выбежал» (ἐκτρέχω)."
  17: "ὁ διαστρέφων τὸν Ισραηλ — «развращающий, смущающий Израиля» (διαστρέφω). Εἰ σὺ εἶ αὐτός — «ты ли это»."
  18: "Οὐ διαστρέφω — «не я смущаю». ἀλλ' ἤ — «но [не кто иной, как]». καταλιμπάνειν — «оставлять» (καταλείπω). Βααλιμ — Ваалы (мн. ч.; слав. «ваала»). Речь продолжается в ст. 19."
  19: "ἀπόστειλον συνάθροισον — «пошли и собери» (два повелит.). ὄρος τὸ Καρμήλιον — гора Кармил (カルメル山). προφῆται τῆς αἰσχύνης — «пророки срама», т. е. Ваала (слав. «студныя»). τῶν ἀλσῶν — «рощ» (слав. «дубравных»), т. е. Асиры. ἐσθίοντας τράπεζαν Ιεζαβελ — «ядущие от стола Иезавели»."
  20: "ἐπισυνήγαγεν — «собрал» (ἐπισυνάγω)."
  21: "χωλανεῖτε ἐπ' ἀμφοτέραις ταῖς ἰγνύαις — «хромаете на оба колена» (χωλαίνω; ἰγνύα — подколенье, колено; слав. «на обе плесне»); передано 両足でびっこを引く. οὐκ ἀπεκρίθη λόγον — «не ответил ни слова»."
  22: "ὑπολέλειμμαι — «остался» (перфект ὑπολείπω). μονώτατος — «единственный». τετρακόσιοι — четыреста; в LXX ст. 22 снова называет 400 пророков рощ (ср. ст. 19: 450 + 400)."
  23: "δότωσαν — «пусть дадут» (повелит. 3 л. мн.). μελισάτωσαν — «пусть рассекут» (μελίζω). ἐπιθέτωσαν — «пусть положат». πῦρ οὐ μὴ ἐπιθῶ — «огня отнюдь не возложу» (усиленное отрицание). слав. добавляет «растешу» (рассеку) — внесено."
  24: "βοᾶτε — «взывайте». ἐπακούσῃ ἐν πυρί — «услышит огнём». Καλὸν τὸ ῥῆμα — «хорошо слово», «доброе дело». слав. добавляет «илиин» и «да будет тако» (в скобках) — не внесено."
  25: "μόσχος — телёнок, молодой бык (子牛). ποιήσατε — «приготовьте». ὅτι πολλοὶ ὑμεῖς — «потому что вас много». πῦρ μὴ ἐπιθῆτε — «не возлагайте огня»."
  26: "ἐπεκαλοῦντο — «призывали» (imperfect). ἐκ πρωίθεν — «с утра». μεσημβρία — полдень. οὐκ ἦν φωνή… ἀκρόασις — «не было ни голоса, ни слуха» (ответа). διέτρεχον — «бегали» (διατρέχω)."
  27: "ἐμυκτήρισεν — «осмеял, сморщил нос» (μυκτηρίζω). ἀδολεσχία — «беседа, пустословие» (слав. «непраздность» — занятость); по смыслу «задумался, занят»; передано 考え込んでいる. χρηματίζει — «вещает, даёт ответ» (χρηματίζω); слав. «негли что ино строит» — «может быть, другое делает» (внесено). καθεύδει… ἐξαναστήσεται — «спит… встанет». В ru/МТ добавлено «в дороге» — в LXX нет."
  28: "κατετέμνοντο — «резали себя» (κατατέμνω). κατὰ τὸν ἐθισμόν — «по обычаю». μάχαιρα — нож, меч; σειρομάστης — копьё с крюком; слав. добавляет «мнози бишася бичми» (многие били себя бичами) — внесено. ἕως ἐκχύσεως αἵματος — «до излияния крови»."
  29: "ἐπροφήτευον — «пророчествовали» (imperfect; здесь о бесновании). δειλινόν — вечер. ἀναβῆναι τὴν θυσίαν — «вознести жертву». προσοχθίσματα — «мерзости» (о Ваале). μετέστησαν — «отступили». ἀπῆλθον — «ушли»; слав. «умолкнуша» — «замолчали» (внесено). слав. также добавляет «ниже послушания»."
  30: "Προσαγάγετε — «подойдите, приступите» (προσάγω). В ru/МТ в конце ст. 30 добавлено «И восстановил разрушенный жертвенник Господень»; в LXX это стоит в ст. 32 (ἰάσατο), поэтому здесь не внесено."
  31: "κατ' ἀριθμὸν φυλῶν τοῦ Ισραηλ — «по числу племён Израиля». Ισραηλ ἔσται τὸ ὄνομά σου — «Израиль будет имя твоё» (ср. Быт 32:28)."
  32: "ᾠκοδόμησεν τοὺς λίθους ἐν ὀνόματι κυρίου — «построил из камней во имя Господа». ἰάσατο — «исцелил, восстановил» (ἰάομαι). κατεσκαμμένον — «разрушенный» (κατασκάπτω). θααλα — неясное слово, вероятно «ров» (слав. «море»); передано 溝. δύο μετρητάς — «две меры» (サタ). κυκλόθεν — «вокруг»."
  33: "ἐστοίβασεν — «разложил» (στοιβάζω). σχίδακες — дрова, поленья (薪). ἐμέλισεν — «рассек» (μελίζω). ὁλοκαύτωμα — всесожжение (燔祭)."
  34: "ὑδρία — водонос, кувшин (水がめ). ἐπιχέετε — «возливайте». Δευτερώσατε — «сделайте во второй раз» (δευτερόω). Τρισσώσατε — «в третий раз» (τρισσόω)."
  35: "διεπορεύετο — «разливалась» (διαπορεύομαι). κύκλῳ — «вокруг». θααλα — ров (см. ст. 32). ἔπλησαν — «наполнили»."
  36: "Κύριε ὁ θεὸς Αβρααμ καὶ Ισαακ καὶ Ισραηλ — у LXX «Бог Авраама, Исаака и Израиля»; слав. «Боже авраамов и исааков и иаковль» — ヤコブ внесён в текст, LXX-вариант «Израиль» отмечен. σὺ εἶ κύριος ὁ θεὸς Ισραηλ — «Ты Господь Бог Израилев»; слав. «Господь един израилев» — 唯一の внесено. ἐπάκουσον ἐν πυρί — «услышь огнём». διὰ σέ — «ради Тебя». Молитва продолжается в ст. 37."
  37: "ἐπάκουσον — «услышь». γνώτω — «да узнает» (повелит. 3 л.). ἔστρεψας — «обратил» (στρέφω). ὀπίσω — «вслед» (слав. «вслед тебе»); слав. в скобках добавляет «един» — не внесено."
  38: "ἔπεσεν πῦρ παρὰ κυρίου ἐκ τοῦ οὐρανοῦ — «пал огонь от Господа с неба». κατέφαγεν — «пожрал». ἐξέλιξεν — «слизал»; χοῦς — прах, пыль (土)."
  39: "ἔπεσεν ἐπὶ πρόσωπον — «пал на лицо». Ἀληθῶς — «истинно». αὐτὸς ὁ θεός — «Он Бог» (слав. «той есть Бог»)."
  40: "Συλλάβετε — «схватите» (συλλαμβάνω). μηθεὶς σωθήτω — «никто да не спасётся». κατάγει — «сводит» (praes. hist.). χειμάρρους Κισων — поток Киссон (キション川). ἔσφαξεν — «заколол» (σφάζω)."
  41: "Ἀνάβηθι — «поднимись». φωνὴ τῶν ποδῶν τοῦ ὑετοῦ — «голос шагов дождя» (слав. «глас есть дождевнаго хождения»)."
  42: "ἀνέβη τοῦ φαγεῖν — «поднялся, чтобы есть». ἔκυψεν — «наклонился» (κύπτω). ἀνὰ μέσον τῶν γονάτων — «между коленями»."
  43: "ἐπίβλεψον — «посмотри» (ἐπιβλέπω). ὁδὸν τῆς θαλάσσης — «по дороге моря», в сторону моря. ἐπίστρεψον ἑπτάκι — «обратись семь раз» (ἑπτάκι — семь раз)."
  44: "ἐν τῷ ἑβδόμῳ — «в седьмой [раз]». νεφέλη μικρά — небольшое облако. ἴχνος ἀνδρός — след человека (слав. «аки след ноги мужеския»). ἀνάγουσα ὕδωρ — «поднимающее воду»; слав. добавляет «из моря». Ζεῦξον τὸ ἅρμα — «запряги колесницу» (ζεύγνυμι). μὴ καταλάβῃ — «чтобы не застал» (καταλαμβάνω)."
  45: "ἕως ὧδε καὶ ὧδε — букв. «до сих пор и до сих пор», т. е. «тем временем». συνεσκότασεν — «потемнел» (συσκοτάζω). πνεῦμα — ветер. ἔκλαιεν — «плакал» (κλαίω); в ru/МТ «сел в колесницу» — не внесено."
  46: "χεὶρ κυρίου — рука Господня. συνέσφιγξεν τὴν ὀσφύν — «опоясал чресла» (σφίγγω). ἔτρεχεν ἔμπροσθεν — «бежал перед»."
