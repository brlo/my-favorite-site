# jp-box, 3-я Царств, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 18: слово Господне — показаться Ахаву (1–2); Авдий и пророки (3–6);
# встреча Авдия с Илией (7–16); Ахав и Илия (17–20); на Кармиле, выбор народа
# (21–24); пророки Ваала (25–29); жертвенник, камни, вода (30–35); молитва
# и огонь (36–38); исповедание народа (39); казнь пророков (40); дождь (41–46).
# Речи — 「…」: Господь (1), Ахав (5, 17), Авдий (7, 9–14), Илия (8, 15, 18–19,
# 21–25, 27, 29–31, 34, 36–37, 40–41, 43–44), пророки Ваала (26), народ (24, 39).
# Вложенная речь — 『…』: слова Илии в передаче Авдия (11, 14), ответ людей
# в рассказе Авдия (10), слова Илии для Ахава (44). Красного нет.
# Нумерация по gr: 46 стихов; у csl тоже 46. Ст. 3b–4 в LXX стоят в издательских
# квадратных скобках; скобки не воспроизведены.
# Слав. чтения (18:10 «закля», 18:23 «растешу», 18:27 «строит», 18:28 «бичми»,
# 18:29 «умолкнуша», 18:36 «иаковль» и «един», 18:44 «из моря») внесены в основной
# текст без 〔…〕; LXX-варианты — в notes. 〔…〕 нет.
# Сносок ⟨…⟩ нет: 預言者, 祭壇, 燔祭, カルメル山, イズレエル уже в корпусе.

