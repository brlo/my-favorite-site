verses:
  1: "主[しゅ]はこう言[い]われる。「裁[さば]きを守[まも]り、義[ぎ]を行[おこな]え。わたしの救[すく]いが近[ちか]づいて現[あら]われ、わたしのあわれみが明[あき]らかにされようとしているからである。"
  2: "これをなす人[ひと]は幸[さいわ]いであり、これに堅[かた]くすがり、安息日[あんそくび]を汚[けが]さずに守[まも]り、自分[じぶん]の手[て]を保[たも]って悪[あく]を行[おこな]わない人[ひと]は幸[さいわ]いである。"
  3: "主[しゅ]に結[むす]びついた異国人[いこくじん]は、『主[しゅ]はきっとわたしを御自分[ごじぶん]の民[たみ]から切[き]り離[はな]される』と言[い]ってはならない。宦官[かんがん]も、『わたしは枯[か]れた木[き]にすぎない』と言ってはならない。」"
  4: "主[しゅ]は宦官[かんがん]たちにこう言[い]われる。「わたしの安息日[あんそくび]を守[まも]り、わたしの喜[よろこ]ぶことを選[えら]び、わたしの契約[けいやく]を堅[かた]く守[まも]る宦官[かんがん]たちには、"
  5: "わたしの家[いえ]とわたしの城壁[じょうへき]の中[なか]で、息子[むすこ]や娘[むすめ]たちにもまさる名[な]ある場所[ばしょ]を与[あた]える。わたしは彼[かれ]らに永遠[えいえん]の名[な]を与[あた]え、それは絶[た]えることがない。"
  6: "また、主[しゅ]に仕[つか]え、主の名[な]を愛[あい]し、男[おとこ]の僕[しもべ]にも女[おんな]の僕にもなろうとして主に結[むす]びついた異国人[いこくじん]、すなわち、わたしの安息日[あんそくび]を汚[けが]さずに守[まも]り、わたしの契約[けいやく]を堅[かた]く守るすべての者[もの]を、"
  7: "わたしは彼[かれ]らをわたしの聖[せい]なる山[やま]へ連[つ]れて行[い]き、わたしの祈[いの]りの家[いえ]で彼らを喜[よろこ]ばせる。彼らの燔祭[はんさい]と犠牲[ぎせい]はわたしの祭壇[さいだん]の上[うえ]で受[う]け入[い]れられる。わたしの家[いえ]は、すべての民[たみ]にとって祈りの家と呼ばれるからである。」"
  8: "散[ち]らされたイスラエルを集[あつ]める主[しゅ]は言[い]われる。「わたしは彼[かれ]に、さらに集[あつ]め加[くわ]える。」"
  9: "野[の]のすべての獣[けもの]よ、来[き]て食[く]え。森[もり]のすべての獣よ。"
  10: "見[み]よ、彼[かれ]らはみな盲目[もうもく]になり、悟[さと]ることを知[し]らない。彼らはみな、物言[ものい]わぬ犬[いぬ]で、吠[ほ]えることもできない。寝床[ねどこ]で夢[ゆめ]を見[み]て、まどろむことを好[この]む。"
  11: "この犬[いぬ]どもは魂[たましい]の厚[あつ]かましい者[もの]で、飽[あ]き足[た]りることを知[し]らない。彼らは悪[あく]しき者で、悟[さと]りを知らない。彼らはみな自分[じぶん]の道[みち]に従[したが]って行[い]き、それぞれ自分[じぶん]の利[り]に迷[まよ]い込[こ]んだ。初[はじ]めの者[もの]から終[お]わりの者[もの]まで、そうである。「さあ、ぶどう酒[ぶどうしゅ]を取[と]って、酔[よ]い満[み]ちよう。明日[あす]も今日[きょう]と同[おな]じように、いや、もっと多[おお]くあろう。」"

notes:
  1: "Τάδε λέγει κύριος — «так говорит Господь»; Φυλάσσεσθε κρίσιν — «храните суд» (φυλάσσω — соблюдать, хранить; слав. «сохраните суд»); ποιήσατε δικαιοσύνην — «сотворите правду» (義[ぎ]). ἤγγισεν γὰρ τὸ σωτήριόν μου παραγίνεσθαι — «ибо приблизилось спасение Моё — прийти» (ἐγγίζω, παραγίνομαι); τὸ ἔλεός μου ἀποκαλυφθῆναι — «милость Моя — открыться» (ἀποκαλύπτω). Оба инфинитива при ἤγγισεν сохранены."
  2: "μακάριος ἀνήρ — «блажен муж»; ὁ ἀντεχόμενος αὐτῶν — «держащийся их» (ἀντέχομαι — крепко держаться; слав. «держайся их»); φυλάσσων τὰ σάββατα μὴ βεβηλοῦν — «хранящий субботы, чтобы не осквернять» (βεβηλόω — осквернять); διατηρῶν τὰς χεῖρας αὐτοῦ μὴ ποιεῖν ἀδίκημα — «соблюдающий руки свои, чтобы не делать неправды» (διατηρέω; ἀδίκημα — неправда, зло). В ru/МТ «сын человеческий» — по евр. «бен адам», в LXX ἄνθρωπος, поэтому «人»."
  3: "ἀλλογενής — «иноплеменник, чужеземец» (異国人[いこくじん]; слав. «иноплеменник»), ὁ προσκείμενος πρὸς κύριον — «присоединившийся к Господу» (πρόσκειμαι). Ἀφοριεῖ με ἄρα κύριος ἀπὸ τοῦ λαοῦ αὐτοῦ — «отделит меня Господь от народа Своего» (ἀφορίζω; ἄρα — усилительная частица). εὐνοῦχος — «евнух» (宦官[かんがん]; слав. «каженик»); ξύλον ξηρόν — «дерево сухое» (枯[か]れた木[き]). Обе реплики — 『…』 внутри речи Господа."
  4: "Τάδε λέγει κύριος — «так говорит Господь»; τοῖς εὐνούχοις — дательный «евнухам»; ὅσοι ἂν φυλάξωνται τὰ σάββατά μου — «которые будут хранить субботы Мои» (φυλάσσω); ἐκλέξωνται ἃ ἐγὼ θέλω — «изберут, что Я хочу» (ἐκλέγομαι); ἀντέχωνται τῆς διαθήκης μου — «будут держаться завета Моего». Формула «так говорит Господь» — вне кавычек, обращение к евнухам — в вводной части."
  5: "δώσω αὐτοῖς … τόπον ὀνομαστόν — «дам им место именитое» (ὀνομαστός — именитый, славный; слав. «место именито»); κρείττω υἱῶν καὶ θυγατέρων — «лучше сыновей и дочерей» (κρείττων — лучше); ὄνομα αἰώνιον — «имя вечное»; οὐκ ἐκλείψει — «не оскудеет» (ἐκλείπω). Обещание противопоставлено телесному потомству."
  6: "τοῖς ἀλλογενέσι … δουλεύειν αὐτῷ — «иноплеменникам… служить Ему» (δουλεύω); ἀγαπᾶν τὸ ὄνομα κυρίου — «любить имя Господне»; τοῦ εἶναι αὐτῷ εἰς δούλους καὶ δούλας — «чтобы быть Ему в рабов и рабынь» (передано «男の僕にも女の僕にも»); φυλασσομένους τὰ σάββατά μου μὴ βεβηλοῦν — «хранящих субботы Мои, чтобы не осквернять». Длинный датив продолжается в 56:7 при εἰσάξω."
  7: "εἰσάξω αὐτοὺς εἰς τὸ ὄρος τὸ ἅγιόν μου — «введу их в гору святую Мою» (εἰσάγω); εὐφρανῶ — «возвеселю»; οἶκος προσευχῆς — «дом молитвы» (祈[いの]りの家[いえ]); ὁλοκαυτώματα — «всесожжения» (燔祭[はんさい]); δεκταί — «приятны, угодны» (δεκτός); θυσιαστήριον — «жертвенник» (祭壇[さいだん]). ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν — «дом Мой домом молитвы наречётся для всех народов»: цитируется в Мф 21:13; Мк 11:17; Лк 19:46."
  8: "εἶπεν κύριος ὁ συνάγων τοὺς διεσπαρμένους Ισραηλ — «сказал Господь, собирающий рассеянных Израиля» (συνάγω, διασπείρω); ὅτι συνάξω ἐπ᾽ αὐτὸν συναγωγήν — «ибо соберу к нему собрание» (συναγωγή); ὅτι здесь вводит прямую речь. В ru/МТ «к собранным у него Я буду ещё собирать других» — иное; в LXX и слав. «соберу к нему собор»."
  9: "Πάντα τὰ θηρία τὰ ἄγρια — «все звери полевые» (ἄγριος — дикий); δεῦτε φάγετε — «придите, ешьте»; θηρία τοῦ δρυμοῦ — «звери дубравы» (δρυμός — лес, чаща; слав. «зверие дубравнии»). Пророческий призыв к зверям — без кавычек, как возглас."
  10: "ἴδετε ὅτι πάντες ἐκτετύφλωνται — «видите, что все ослепли» (ἐκτυφλόω); οὐκ ἔγνωσαν φρονῆσαι — «не познали, как рассудить» (φρονέω); κύνες ἐνεοί — «псы немые» (ἐνεός — немой); οὐ δυνήσονται ὑλακτεῖν — «не могут лаять» (ὑλακτέω); ἐνυπνιαζόμενοι κοίτην — «снящие на ложе» (ἐνυπνιάζομαι, κοίτη); φιλοῦντες νυστάξαι — «любящие дремать» (νυστάζω). В ru/МТ начинают «стражи их» — в LXX этого слова нет."
  11: "οἱ κύνες ἀναιδεῖς τῇ ψυχῇ — «псы бесстыдные душою» (ἀναιδής; слав. «безстуднии душею»); οὐκ εἰδότες πλησμονήν — «не знающие насыщения» (πλησμονή); οὐκ εἰδότες σύνεσιν — «не знающие разумения» (σύνεσις); πάντες ἐν ταῖς ὁδοῖς αὐτῶν ἐξηκολούθησαν — «все по своим путям последовали» (ἐξακολουθέω); ἕκαστος κατὰ τὸ ἑαυτοῦ — «каждый по своему». Слав. добавляет «кийждо уклонишася в лихоимство свое, от перваго и до последняго» (каждый уклонился в лихоимство своё, от первого до последнего) — в LXX нет, внесено без 〔…〕. Слав. 56:12 («Приидите, да возмем вино и наполнимся пиянства, и будет яко днесь, тако и заутра, и много множае») в gr-lxx-byz отсутствует: в модуле стих пустой. Содержание внесено в конец этого стиха как речь пьяниц; отдельного 56:12 нет, деление gr держим."
