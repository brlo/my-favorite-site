# jp-box, Исаия, глава 56. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для главы отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 56: 1–2 призыв хранить суд и творить правду, блаженство исполняющего; 3–8
# иноплеменник и евнух в доме молитвы, собирание рассеянных; 9–11 слепые стражи и
# жадные псы; в конце 11 — речь пьяниц (слав. 56:12).
# Голоса: 1–3 речь Господа — 「…」 (в 3 возражения иноплеменника и евнуха — 『…』);
# 4–7 новое слово Господа — 「…」; 8 формула и краткое слово — 「…」; 9–11 авторский
# текст, в конце — речь пьяниц в 「…」.
# Нумерация по gr: 11 стихов. У csl/ru 12: слав. 56:12 («Приидите, да возмем вино…»)
# в модуле отсутствует (в gr пустая строка); содержание внесено в конец 56:11 без
# нового стиха и без 〔…〕. Слав. в 56:11 добавляет «кийждо уклонишася в лихоимство
# свое, от перваго и до последняго» — нет в LXX, внесено без 〔…〕.
# 〔…〕 нет; сносок ⟨…⟩ нет: 宦官, 異国人, 燔祭, 祭壇, 安息日 уже в корпусе.
# Имена — транслитерация греческого (LXX).

