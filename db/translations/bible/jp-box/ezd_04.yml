# jp-box, Ездра, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni (под авторским правом)
# не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: отказ в участии и остановка стройки (1–5), донос при Ахашвероше (6),
# письмо Артаксерксу (7–16), ответ царя и остановка работ (17–24).
# Речь: 4:2–3, письмо 4:11–16, ответ царя 4:18–22 — 「…」; красного нет.
# Нумерация по gr: 24 стиха. 〔…〕 нет; слав. добавления внесены в текст без скобок:
# 4:6 глосса «иже есть артаксеркс» (в тексте アハシュエロス、すなわちアルタシャスタ),
# 4:9 «савее» (нет в LXX), 4:13 «летняго воздаяния» (годичная подать), 4:14 «едим
# соль» у Синодального отсутствует в LXX и слав. — не внесено, отмечено в notes.
# 4:21 в LXX и слав. фраза обрывается на «чтобы от решения…» — переведено как есть.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 祭司, 貢ぎ, 城壁 уже в корпусе.
# jp-ni не использовался.

