verses:
  1: "ユダとベニヤミンの敵[てき]たちは、捕囚[ほしゅう]の移住[いじゅう]から帰[かえ]って来[き]た者[もの]たちが、主[しゅ]イスラエルの神[かみ]のために家[いえ]を建[た]てていると聞[き]いた。"
  2: "彼[かれ]らはゼルバベルと氏族[しぞく]の長[かしら]たちのところへ近[ちか]づき、彼[かれ]らに言[い]った。「わたしたちもあなたがたとともに建[た]てよう。わたしたちもあなたがたと同[おな]じように、あなたがたの神[かみ]を求[もと]めているからである。アッシリアの王[おう]アサラダンがわたしたちをここへ連[つ]れて来[き]て以来[いらい]、わたしたちはその神[かみ]にいけにえを捧[ささ]げてきた。」"
  3: "ゼルバベルとイエシュア、およびイスラエルの氏族[しぞく]の長[かしら]たちの残[のこ]りの者[もの]たちは、彼[かれ]らに言[い]った。「あなたがたとわたしたちが一緒[いっしょ]に、わたしたちの神[かみ]の家[いえ]を建[た]てることはできない。わたしたちだけで、ペルシアの王[おう]クロスがわたしたちに命[めい]じたとおりに、主[しゅ]イスラエルの神[かみ]のために建[た]てるのだ。」"
  4: "そこで、その地[ち]の民[たみ]はユダの民[たみ]の手[て]を弱[よわ]らせ、彼[かれ]らが建[た]てるのを妨[さまた]げた。"
  5: "また、彼[かれ]らの計画[けいかく]をくじくために、彼[かれ]らに逆[さか]らう相談役[そうだんやく]たちを雇[やと]った。これはペルシアの王[おう]クロスのすべての日[ひ]々[び]、すなわちペルシアの王[おう]ダリウスの治世[ちせい]に至[いた]るまで続[つづ]いた。"
  6: "アハシュエロス、すなわちアルタシャスタの治世[ちせい]、その治世[ちせい]の初[はじ]めに、彼[かれ]らはユダとエルサレムに住[す]む者[もの]たちに訴[うった]えの手紙[てがみ]を書[か]いた。"
  7: "また、アルタシャスタの日[ひ]々[び]に、ミトラダテスとタベエル、および彼[かれ]の残[のこ]りの同僚[どうりょう]たちは、ペルシアの王[おう]アルタシャスタに手紙[てがみ]を書[か]いた。それは平和[へいわ]のうちに書[か]かれた。すなわち、書記官[しょきかん]がシリア語[ご]で書[か]き、通訳[つうやく]された文書[ぶんしょ]である。"
  8: "レウム・バアルタムと書記[しょき]サムサイは、エルサレムに逆[さか]らう一通[いっつう]の手紙[てがみ]を、アルタシャスタ王[おう]に書[か]いた。"
  9: "すなわち、レウム・バアルタムと書記[しょき]サムサイ、および彼[かれ]らの残[のこ]りの同僚[どうりょう]たち、ディナイ人[じん]、アファルサタハイ人[じん]、タルファライ人[じん]、アファルサイ人[じん]、アルキアイ人[じん]、バビロニア人[じん]、スサナハイ人[じん]、サベ人[じん]、すなわちエラム人[じん]たちは、こう定[さだ]めた。"
  10: "また、大[おお]いなる者[もの]にして尊[とうと]い者[もの]アセンナファルが移[うつ]し、サマリアの町[まち]々[まち]と川向[かわむ]こうの残[のこ]りの地[ち]に住[す]まわせた諸国民[しょこくみん]の残[のこ]りの者[もの]たちも定[さだ]めた。"
  11: "これが、彼[かれ]らが彼[かれ]に送[おく]った手紙[てがみ]の写[うつ]しである。「アルタシャスタ王[おう]へ。あなたのしもべたち、川向[かわむ]こうの人[ひと]々[びと]より。」"
  12: "「王[おう]に知[し]らせる。あなたのもとから上[のぼ]って来[き]たユダヤ人[じん]たちは、わたしたちのところへ来[き]てエルサレムに上[のぼ]り、背[そむ]いた悪[わる]い町[まち]を建[た]てている。彼[かれ]らはその城壁[じょうへき]をすでに整[ととの]え、その基[もとい]を高[たか]くしている。」"
  13: "「今[いま]、王[おう]に知[し]らせる。もしあの町[まち]が建[た]て直[なお]され、その城壁[じょうへき]が整[ととの]えられるなら、王[おう]には貢[みつ]ぎも税[ぜい]も年[とし]の納[おさ]め物[もの]も渡[わた]さず、何[なに]も与[あた]えないであろう。これは王[おう]たちを害[がい]することになる。」"
  14: "「わたしたちは王[おう]の辱[はずかし]めを見[み]ることを許[ゆる]されない。それゆえ、人[ひと]を遣[つか]わして王[おう]に知[し]らせた。」"
  15: "「王[おう]の父祖[ふそ]たちの記録[きろく]の書[しょ]を調[しら]べさせてほしい。そうすれば、あの町[まち]が昔[むかし]から背[そむ]いた町[まち]であり、王[おう]たちと国[くに]々[ぐに]を害[がい]したこと、また昔[むかし]からその中[なか]にしもべたちの逃[に]げ場[ば]があったことを見[み]いだし、知[し]るであろう。それゆえ、この町[まち]は荒[あ]らされたのである。」"
  16: "「それゆえ、わたしたちは王[おう]に知[し]らせる。もしあの町[まち]が建[た]てられ、その城壁[じょうへき]が整[ととの]えられるなら、王[おう]には平和[へいわ]はないであろう。」"
  17: "王[おう]は、レウム・バアルタムと書記[しょき]サムサイ、およびサマリアに住[す]む彼[かれ]らの残[のこ]りの同僚[どうりょう]たちと、川向[かわむ]こうの残[のこ]りの者[もの]たちに、平和[へいわ]を送[おく]って言[い]った。"
  18: "「あなたがたがわたしたちに送[おく]った書記官[しょきかん]の文書[ぶんしょ]は、わたしの前[まえ]で明[あき]らかに読[よ]まれた。」"
  19: "「そして、わたしは命令[めいれい]を出[だ]し、調査[ちょうさ]させた。すると、あの町[まち]は昔[むかし]から王[おう]たちに逆[さか]らって立[た]ち、その中[なか]で背[そむ]きと逃[に]げ場[ば]が起[お]こっていることが見[み]いだされた。」"
  20: "「また、エルサレムには強[つよ]い王[おう]たちがいて、川向[かわむ]こうのすべての地[ち]を支配[しはい]し、彼[かれ]らには貢[みつ]ぎが十分[じゅうぶん]に納[おさ]められ、その分[わ]け前[まえ]も与[あた]えられていた。」"
  21: "「それゆえ今[いま]、あの者[もの]たちをやめさせ、あの町[まち]がこれ以上[いじょう]建[た]てられないように命令[めいれい]を定[さだ]めなさい。」"
  22: "「このことについて不注意[ふちゅうい]を犯[おか]さないように用心[ようじん]しなさい。王[おう]たちに対[たい]する害[がい]が増[ふ]えないためである。」"
  23: "アルタシャスタ王[おう]の書記官[しょきかん]の手紙[てがみ]が、レウム・バアルタムと書記[しょき]サムサイ、および彼[かれ]らの同僚[どうりょう]たちの前[まえ]で読[よ]まれると、彼[かれ]らは急[いそ]いでエルサレムとユダへ行[い]き、馬[うま]と力[ちから]をもって彼[かれ]らをやめさせた。"
  24: "こうして、エルサレムにある神[かみ]の家[いえ]の工事[こうじ]はやんだ。それはペルシアの王[おう]ダリウスの治世[ちせい]の第二年[だいにねん]まで、やんだままであった。"

notes:
  1: "οἱ θλίβοντες Ιουδα καὶ Βενιαμιν — теснящие, притесняющие Иуду и Вениамина (θλίβω); слав. «врази». οἱ υἱοὶ τῆς ἀποικίας — сыны переселения (ἀποικία). οἰκοδομοῦσιν οἶκον τῷ κυρίῳ θεῷ Ισραηλ — строят дом Господу Богу Израилеву."
  2: "ἤγγισαν — приблизились (ἐγγίζω). Οἰκοδομήσομεν μεθ᾿ ὑμῶν — построим с вами. ἐκζητοῦμεν τῷ θεῷ ὑμῶν — взыскиваем, ищем Бога вашего (ἐκζητέω). θυσιάζομεν — приносим жертвы (θυσιάζω). ἀπὸ ἡμερῶν Ασαραδδων βασιλέως Ασσουρ — от дней Асараддана, царя Ассирийского (слав. «асарадана»). τοῦ ἐνέγκαντος ἡμᾶς ὧδε — приведшего нас сюда."
  3: "Οὐχ ἡμῖν καὶ ὑμῖν τοῦ οἰκοδομῆσαι — не нам и вам строить. ἐπὶ τὸ αὐτὸ οἰκοδομήσομεν — «вместе построим»; слав. «сами особно» — иное понимание. ὡς ἐνετείλατο ἡμῖν Κῦρος — как повелел нам Кир."
  4: "ἦν ὁ λαὸς τῆς γῆς ἐκλύων τὰς χεῖρας — народ земли ослаблял руки (ἐκλύω). ἐνεπόδιζον — препятствовали (ἐμποδίζω). τοῦ οἰκοδομεῖν — строить. Слав. «людие земли (тоя)» — добавка «тоя» в скобках."
  5: "μισθούμενοι ἐπ᾿ αὐτοὺς βουλευομένους — нанимая против них советников (μισθόω, βουλεύομαι). τοῦ διασκεδάσαι βουλὴν αὐτῶν — чтобы рассеять их замысел (διασκεδάζω). πάσας τὰς ἡμέρας Κύρου … ἕως βασιλείας Δαρείου — во все дни Кира до царствования Дария."
  6: "ἐν βασιλείᾳ Ασουηρου — в царствование Ахашвероша (Ασουηρος). ἔγραψαν ἐπιστολὴν ἐπὶ οἰκοῦντας Ιουδα — написали письмо на живущих в Иудее (ἐπί + acc. — против). Слав. добавляет глоссу «(иже есть артаксеркс)» — в тексте アハシュエロス、すなわちアルタシャスタ."
  7: "ἐν ἡμέραις Αρθασασθα — во дни Артаксеркса (в тексте アルタシャスタ). ἔγραψεν ἐν εἰρήνῃ Μιθραδάτῃ Ταβεηλ — «написал в мире Митрадату [и] Тавеилу»: ἐν εἰρήνῃ, вероятно, искажение имени Билшан (слав. «в мире»). ὁ φορολόγος — сборщик податей, писец (в тексте 書記官). γραφὴν Συριστὶ καὶ ἡρμηνευμένην — письмо по-сирийски и переведённое (ἑρμηνεύω)."
  8: "Ραουμ βααλταμ — Реум-Ваалтам (слав. «реум валтаам»). Σαμσαι ὁ γραμματεύς — Шимшай писец (γραμματεύς). ἐπιστολὴν μίαν κατὰ Ιερουσαλημ — одно письмо против Иерусалима."
  9: "τάδε ἔκρινεν — так постановил (κρίνω). σύνδουλοι — сослужители, товарищи (σύνδουλος). Διναῖοι, Αφαρσαθαχαῖοι, Ταρφαλλαῖοι, Αφαρσαῖοι, Αρχυαῖοι, Βαβυλώνιοι, Σουσαναχαῖοι — перечисление народов. [οἵ εἰσιν Ηλαμαῖοι] — «которые суть Еламиты» (в скобках критического издания, есть и в слав.). Слав. добавляет «савее» — в тексте サベ人, в LXX этого народа нет."
  10: "οἱ κατάλοιποι ἐθνῶν — остальные народы (ἔθνος). Ασενναφαρ ὁ μέγας καὶ ὁ τίμιος — Асеннафар великий и почтенный (τίμιος). κατῴκισεν αὐτοὺς ἐν πόλεσιν τῆς Σομορων — поселил их в городах Самарии. τὸ κατάλοιπον πέραν τοῦ ποταμοῦ — остаток за рекой."
  11: "αὕτη ἡ διαταγὴ τῆς ἐπιστολῆς — таково содержание, список письма (διαταγή). ἧς ἀπέστειλαν πρὸς αὐτόν — которое послали к нему. παῖδές σου ἄνδρες πέραν τοῦ ποταμοῦ — рабы твои, мужи за рекой."
  12: "γνωστὸν ἔστω τῷ βασιλεῖ — да будет известно царю. οἱ Ιουδαῖοι ἀναβάντες ἀπὸ σοῦ — иудеи, вышедшие от тебя. τὴν πόλιν τὴν ἀποστάτιν καὶ πονηράν — город мятежный и злой (ἀποστάτις). κατηρτισμένοι εἰσίν — приведены в порядок, устроены (καταρτίζω). θεμελίους αὐτῆς ἀνύψωσαν — основания её возвысили (ἀνυψόω)."
  13: "ἐὰν … ἀνοικοδομηθῇ — если будет отстроен (ἀνοικοδομέω). φόροι οὐκ ἔσονταί σοι — податей не будет тебе (φόρος). οὐδὲ δώσουσιν — и не дадут. Слав. добавляет «(летняго воздаяния)» — годичная подать, нет в LXX; в тексте 年の納め物. βασιλεῖς κακοποιεῖ — царям делает зло (κακοποιέω)."
  14: "ἀσχημοσύνην βασιλέως οὐκ ἔξεστιν ἡμῖν ἰδεῖν — бесчестия царя не позволено нам видеть (ἀσχημοσύνη). ἐπέμψαμεν καὶ ἐγνωρίσαμεν — послали и известили (γνωρίζω). В LXX и слав. нет «едим соль» (ru и МТ) — это чтение Синодального, в текст не внесено."
  15: "ἐπισκέψηται ἐν βιβλίῳ ὑπομνηματισμοῦ τῶν πατέρων σου — пусть посмотрят в книге памятных записей отцов твоих (ὑπομνηματισμός). πόλις ἀποστάτις καὶ κακοποιοῦσα βασιλεῖς καὶ χώρας — город мятежный и вредящий царям и странам. φυγάδια δούλων — убежища рабов (φυγάδιον). ἀπὸ χρόνων αἰῶνος — от времён века. ἠρημώθη — опустошён (ἐρημόω)."
  16: "γνωρίζομεν — извещаем. ἐὰν οἰκοδομηθῇ … οὐκ ἔστιν σοι εἰρήνη — если будет построен, не будет тебе мира. LXX и слав. без «за рекой»; ru добавляет «владения за рекою» (МТ)."
  17: "ἀπέστειλεν ὁ βασιλεὺς πρὸς Ραουμ … εἰρήνην καί φησιν — послал царь … мир и говорит. Ответ царя начинается с 18."
  18: "Ὁ φορολόγος, ὃν ἀπεστείλατε — «сборщик податей», т. е. письмо, которое вы послали (φορολόγος). ἐκλήθη ἔμπροσθεν ἐμοῦ — «был призван, оглашён предо мной»; слав. «призван пред мене»; ru «внятно прочитано предо мною» — в тексте 朗読された."
  19: "παρ᾿ ἐμοῦ ἐτέθη γνώμη — от меня дано повеление (γνώμη). ἐπεσκεψάμεθα — мы рассмотрели, разыскали (ἐπισκέπτομαι). ἐπὶ βασιλεῖς ἐπαίρεται — против царей поднимается (ἐπαίρω). ἀποστάσεις καὶ φυγάδια γίνονται — бывают отпадения и убежища."
  20: "βασιλεῖς ἰσχυροὶ γίνονται ἐπὶ Ιερουσαλημ — были цари сильные над Иерусалимом. ἐπικρατοῦντες ὅλης τῆς ἑσπέρας τοῦ ποταμοῦ — владевшие всем западом реки (ἑσπέρα — запад). φόροι πλήρεις καὶ μέρος δίδοται — подати полные и часть давалась (μέρος — доля)."
  21: "θέτε γνώμην καταργῆσαι τοὺς ἄνδρας — положите решением прекратить тех мужей (καταργέω). οὐκ οἰκοδομηθήσεται ἔτι — не будет более строиться. ὅπως ἀπὸ τῆς γνώμης — «чтобы от решения…»: фраза обрывается и в LXX, и в слав.; ru и МТ продолжают «доколе от меня не будет дано повеление»."
  22: "πεφυλαγμένοι ἦτε — будьте осторожны (φυλάσσω). ἄνεσιν ποιῆσαι — допустить ослабление, небрежность (ἄνεσις). μήποτε πληθυνθῇ ἀφανισμός — чтобы не умножилось истребление (ἀφανισμός). εἰς κακοποίησιν βασιλεῦσιν — на зло царям."
  23: "ὁ φορολόγος τοῦ Αρθασασθα — [послание] Артаксеркса (φορολόγος). ἀνέγνω ἐνώπιον — прочитал перед (ἀναγινώσκω). ἐπορεύθησαν σπουδῇ — пошли с поспешностью (σπουδή). κατήργησαν αὐτοὺς ἐν ἵπποις καὶ δυνάμει — остановили их конями и силой (καταργέω; слав. «мышцею сильною»)."
  24: "ἤργησεν τὸ ἔργον — остановилось дело (ἀργέω). ἦν ἀργοῦν — оставалось в бездействии. ἕως δευτέρου ἔτους τῆς βασιλείας Δαρείου — до второго года царствования Дария."
