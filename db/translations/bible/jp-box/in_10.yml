# Глава 10: притча о дворе овчем (1–5), речь о двери (7–10), добрый пастырь
# и наёмник (11–13), единое стадо (14–16), власть отдать и принять жизнь (17–18),
# спор в храме (19–24), свидетельство дел (25–30), обвинение в богохульстве
# и слово о Писании (31–38), уход за Иордан (39–42).
# Слова Христа — красным (<j>); слова иудеев и толпы — вне тегов.
# Абзацы прямой речи — в своих 「」; вложенная цитата (Пс 82:6) — 『』.
# Сноска одна: 奉献祭 (10:22).

