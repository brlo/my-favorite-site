verses:
  1: "「<j>よくよく言[い]っておく。羊[ひつじ]の囲[かこ]いに入[はい]るのに、門[もん]から入[はい]らず、ほかの所[ところ]から乗[の]り越[こ]えて来[く]る者[もの]は、盗人[ぬすびと]であり、強盗[ごうとう]である。</j>"
  2: "<j>門[もん]から入[はい]る者[もの]は、羊[ひつじ]の羊飼[ひつじか]いである。</j>"
  3: "<j>この者[もの]には門番[もんばん]が門[もん]を開[あ]け、羊[ひつじ]たちはその声[こえ]を聞[き]く。彼[かれ]は自分[じぶん]の羊[ひつじ]を名[な]で呼[よ]んで、連[つ]れ出[だ]す。</j>"
  4: "<j>自分[じぶん]の羊[ひつじ]をすべて外[そと]へ出[だ]すと、彼[かれ]はその前[まえ]を歩[ある]いて行[い]く。羊[ひつじ]たちは彼[かれ]の後[あと]について行[い]く。彼[かれ]の声[こえ]を知[し]っているからである。</j>"
  5: "<j>羊[ひつじ]たちは見知[みし]らぬ者[もの]には決[けっ]してついて行[い]かず、その者[もの]から逃[に]げる。見知[みし]らぬ者[もの]の声[こえ]を知[し]らないからである。</j>」"
  6: "イエスはこのたとえを彼[かれ]らに語[かた]られたが、彼[かれ]らは、イエスが語[かた]っておられることがどういうことなのか、悟[さと]らなかった。"
  7: "そこで、イエスはまた言[い]われた。「<j>よくよく言[い]っておく。わたしは羊[ひつじ]の門[もん]である。</j>"
  8: "<j>〔わたしより先[さき]に〕来[き]た者[もの]はみな、盗人[ぬすびと]であり、強盗[ごうとう]である。だが、羊[ひつじ]たちは彼[かれ]らの言[い]うことを聞[き]かなかった。</j>"
  9: "<j>わたしは門[もん]である。わたしを通[とお]って入[はい]る者[もの]は救[すく]われ、入[はい]り、出[で]て、牧草[ぼくそう]を見[み]つける。</j>"
  10: "<j>盗人[ぬすびと]が来[く]るのは、盗[ぬす]み、殺[ころ]し、滅[ほろ]ぼすためでしかない。わたしが来[き]たのは、羊[ひつじ]たちが命[いのち]を持[も]ち、それを豊[ゆた]かに持[も]つためである。</j>」"
  11: "「<j>わたしは良[よ]い羊飼[ひつじか]いである。良[よ]い羊飼[ひつじか]いは、羊[ひつじ]のために自分[じぶん]の命[いのち]を捨[す]てる。</j>"
  12: "<j>羊飼[ひつじか]いではなく、羊[ひつじ]が自分[じぶん]のものではない雇[やと]い人[びと]は、狼[おおかみ]が来[く]るのを見[み]ると、羊[ひつじ]を捨[す]てて逃[に]げる。狼[おおかみ]は羊[ひつじ]を奪[うば]い、散[ち]らす。</j>"
  13: "<j>雇[やと]い人[びと]だからである。羊[ひつじ]のことを顧[かえり]みない。</j>」"
  14: "「<j>わたしは良[よ]い羊飼[ひつじか]いである。わたしは自分[じぶん]の羊[ひつじ]を知[し]り、自分[じぶん]の羊[ひつじ]もわたしを知[し]っている。</j>"
  15: "<j>父[ちち]がわたしを知[し]っておられるように、わたしも父[ちち]を知[し]っている。わたしは羊[ひつじ]のために自分[じぶん]の命[いのち]を捨[す]てる。</j>"
  16: "<j>わたしには、この囲[かこ]いのものではないほかの羊[ひつじ]たちもいる。その羊[ひつじ]たちも導[みちび]かなければならない。彼[かれ]らはわたしの声[こえ]を聞[き]き、一[ひと]つの群[む]れ、一[ひと]りの羊飼[ひつじか]いになる。</j>」"
  17: "「<j>父[ちち]がわたしを愛[あい]してくださるのは、わたしが自分[じぶん]の命[いのち]を捨[す]てて、またそれを取[と]り戻[もど]すためである。</j>"
  18: "<j>だれもわたしからそれを奪[うば]うことはできない。わたしが自分[じぶん]から進[すす]んで捨[す]てるのである。わたしにはそれを捨[す]てる権限[けんげん]があり、またそれを取[と]り戻[もど]す権限[けんげん]がある。この掟[おきて]は、わたしの父[ちち]から受[う]けたものである。</j>」"
  19: "これらの言葉[ことば]のゆえに、ユダヤ人[じん]の間[あいだ]でまた分裂[ぶんれつ]が起[お]こった。"
  20: "多[おお]くの者[もの]が言[い]った。「あの人[ひと]は悪霊[あくりょう]に憑[つ]かれている。気[き]が狂[くる]っているのだ。なぜ、あの人[ひと]の言[い]うことを聞[き]くのか。」"
  21: "ほかの者[もの]たちは言[い]った。「悪霊[あくりょう]に憑[つ]かれた者[もの]の言葉[ことば]ではない。悪霊[あくりょう]が盲人[もうじん]の目[め]を開[ひら]くことができるだろうか。」"
  22: "そのとき、エルサレムで奉献祭[ほうけんさい]⟨神殿[しんでん]の清[きよ]めを記念[きねん]するユダヤの祭[まつ]り。⟩があった。冬[ふゆ]であった。"
  23: "イエスは神殿[しんでん]の中[なか]のソロモンの回廊[かいろう]を歩[ある]いておられた。"
  24: "そこで、ユダヤ人[じん]たちがイエスを取[と]り囲[かこ]んで言[い]った。「いつまで、わたしたちを迷[まよ]わせておくのか。あなたがキリストなら、はっきりとわたしたちに言[い]ってください。」"
  25: "イエスは彼[かれ]らに答[こた]えて言[い]われた。「<j>わたしはあなたがたに言[い]ったが、あなたがたは信[しん]じない。わたしが父[ちち]の名[な]によって行[おこな]っている業[わざ]が、わたしについての証[あかし]である。</j>"
  26: "<j>だが、あなたがたは信[しん]じない。わたしの羊[ひつじ]ではないからである。〔わたしがあなたがたに言[い]ったとおりである。〕</j>"
  27: "<j>わたしの羊[ひつじ]はわたしの声[こえ]を聞[き]く。わたしは彼[かれ]らを知[し]っており、彼[かれ]らはわたしについて来[く]る。</j>"
  28: "<j>わたしは彼[かれ]らに永遠[えいえん]の命[いのち]を与[あた]える。彼[かれ]らは決[けっ]して滅[ほろ]びることがなく、だれもわたしの手[て]から彼[かれ]らを奪[うば]うことはできない。</j>"
  29: "<j>彼[かれ]らをわたしに与[あた]えてくださったわたしの父[ちち]は、すべてのものより大[おお]きい。だれも父[ちち]の手[て]から彼[かれ]らを奪[うば]うことはできない。</j>"
  30: "<j>わたしと父[ちち]とは一[ひと]つである。</j>」"
  31: "そこで、ユダヤ人[じん]たちはまた石[いし]を取[と]り上[あ]げて、イエスを石打[いしう]ちにしようとした。"
  32: "イエスは彼[かれ]らに答[こた]えて言[い]われた。「<j>わたしは父[ちち]から多[おお]くの良[よ]い業[わざ]をあなたがたに示[しめ]した。そのうちのどの業[わざ]のために、あなたがたはわたしを石打[いしう]ちにしようとするのか。</j>」"
  33: "ユダヤ人[じん]たちは答[こた]えて言[い]った。「良[よ]い業[わざ]のためではなく、神[かみ]を冒涜[ぼうとく]したために、あなたを石打[いしう]ちにするのだ。あなたは人[ひと]でありながら、自分[じぶん]を神[かみ]としているからである。」"
  34: "イエスは彼[かれ]らに答[こた]えて言[い]われた。「<j>あなたがたの律法[りっぽう]に、『わたしは言[い]った。あなたがたは神[かみ]である』と書[か]いてあるではないか。</j>"
  35: "<j>神[かみ]の言葉[ことば]が臨[のぞ]んだ者[もの]たちを、神[かみ]と呼[よ]んでいるのである。聖書[せいしょ]が破[やぶ]られることはない。</j>"
  36: "<j>父[ちち]が聖[せい]なる者[もの]として世[よ]に遣[つか]わした者[もの]が『わたしは神[かみ]の子[こ]である』と言[い]ったからといって、あなたがたは、わたしが神[かみ]を冒涜[ぼうとく]していると言[い]うのか。</j>"
  37: "<j>わたしが父[ちち]の業[わざ]を行[おこな]っていないのなら、わたしを信[しん]じるな。</j>"
  38: "<j>しかし、行[おこな]っているのなら、たとえわたしを信[しん]じなくても、その業[わざ]を信[しん]じなさい。父[ちち]がわたしのうちにおられ、わたしが父[ちち]のうちにいることを、知[し]り、また悟[さと]るためである。</j>」"
  39: "そこで、彼[かれ]らはまたイエスを捕[と]らえようとしたが、イエスは彼[かれ]らの手[て]から逃[のが]れられた。"
  40: "イエスはまたヨルダン川[がわ]の向[む]こうへ行[い]き、ヨハネが初[はじ]めに洗礼[せんれい]を授[さず]けていた所[ところ]にとどまられた。"
  41: "多[おお]くの人[ひと]がイエスのもとへ来[き]て言[い]った。「ヨハネは何[なん]のしるしも行[おこな]わなかったが、ヨハネがこの人[ひと]について言[い]ったことは、すべて真実[しんじつ]であった。」"
  42: "そこでは、多[おお]くの人[ひと]がイエスを信[しん]じた。"

notes:
  8: "В критической базе πρὸ ἐμοῦ под скобками; Церковь читает с «прежде Меня» — 〔わたしより先に〕 (добавление Церкви, поэтому в скобках)."
  24: "αἴρεις τὴν ψυχήν — букв. «поднимаешь/уносишь нашу душу», то есть держишь в напряжении, не даёшь покоя; 迷わせておく. παρρησίᾳ — «открыто»; はっきりと."
  26: "В критической базе стих кончается на «не из Моих овец»; Церковь и jp-joc добавляют «как Я сказал вам» — 〔わたしがあなたがたに言ったとおりである〕."
  29: "ὃ δέδωκέν μοι πάντων μεῖζόν ἐστιν — букв. «то, что дал Мне, больше всего»; передано по церковному чтению и jp-joc: «Отец, давший Мне их, больше всех»."
