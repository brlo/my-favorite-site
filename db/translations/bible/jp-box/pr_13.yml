verses:
  1: "賢[かしこ]い子[こ]は父[ちち]に従[したが]い、逆[さか]らう子[こ]は滅[ほろ]びの中[なか]にある。"
  2: "正[ただ]しさの実[み]を善[よ]い人[ひと]は食[た]べる。しかし不[ふ]法[ほう]な者[もの]の魂[たましい]は、時[とき]ならず滅[ほろ]びる。"
  3: "自分[じぶん]の口[くち]を守[まも]る者[もの]は自分の魂[たましい]を守り、唇[くちびる]で軽[かる]はずみなことを言[い]う者[もの]は自分を怯[ひる]ませる。"
  4: "怠[おこた]る者[もの]は欲望[よくぼう]の中[なか]にいる。しかし勇敢[ゆうかん]な者[もの]の手[て]は勤[つと]めに携[たずさ]わっている。"
  5: "正[ただ]しい者[もの]は不[ふ]正[せい]な言葉[ことば]を憎[にく]み、不敬[ふけい]な者[もの]は恥[は]じて大胆[だいたん]さを得[え]ない。"
  6: "正[ただ]しさは無[む]垢[く]な者[もの]を守[まも]り、罪[つみ]は不敬[ふけい]な者[もの]を悪[わる]い者[もの]にする。"
  7: "自分[じぶん]を富[とみ]ませて何[なに]も持[も]たない者[もの]があり、自分を低[ひく]くして多[おお]くの富[とみ]を持つ者[もの]もある。"
  8: "人[ひと]の魂[たましい]の贖[あがな]いとなるのは、その人自身[じしん]の富[とみ]である。しかし貧[まず]しい者[もの]は脅[おど]しにも耐[た]えない。"
  9: "正[ただ]しい者[もの]にはいつも光[ひかり]があり、不敬[ふけい]な者[もの]の光は消[き]える。欺[あざむ]きの魂[たましい]は罪[つみ]の中[なか]をさまよい、正しい者はあわれんで施[ほどこ]す。"
  10: "悪[わる]い者[もの]は高慢[こうまん]さを伴[ともな]って悪[あく]を行[おこな]う。しかし自分[じぶん]を知[し]る者[もの]は知恵[ちえ]がある。"
  11: "不[ふ]法[ほう]とともに急[いそ]いで集[あつ]めた財産[ざいさん]は減[へ]ってゆく。しかし敬虔[けいけん]さとともに集める者[もの]は増[ふ]えてゆく。正[ただ]しい者[もの]はあわれみ、貸[か]し与[あた]える。"
  12: "心[こころ]から助[たす]け始[はじ]める者[もの]は、約束[やくそく]して希望[きぼう]へ導[みちび]く者[もの]よりも良[よ]い。善[よ]い願[ねが]いは命[いのち]の木[き]であるからだ。"
  13: "事[こと]を蔑[ないがし]ろにする者[もの]は、その事によって蔑ろにされる。しかし戒[いまし]めを恐[おそ]れる者[もの]は健[すこ]やかである。悪[わる]い子[こ]には何[なに]ひとつ善[よ]いものはない。しかし知恵[ちえ]ある奴隷[どれい]には仕事[しごと]がうまく運[はこ]び、その道[みち]はまっすぐに整[ととの]えられる。"
  14: "知恵[ちえ]ある者[もの]の掟[おきて]は命[いのち]の泉[いずみ]である。しかし思慮[しりょ]のない者[もの]は罠[わな]にかかって死[し]ぬ。"
  15: "良[よ]い悟[さと]りは恵[めぐ]みを与[あた]える。掟[おきて]を知[し]ることは良[よ]い思[おも]いから出[で]る。しかし蔑[ないがし]ろにする者[もの]の道[みち]は滅[ほろ]びの中[なか]にある。"
  16: "賢[かしこ]い者[もの]は皆[みな]、知識[ちしき]をもって事[こと]を行[おこな]う。しかし愚[おろ]かな者[もの]は自分[じぶん]の悪[あく]をさらけ出[だ]す。"
  17: "向[む]こう見[み]ずな王[おう]は災[わざわ]いに陥[おち]いる。しかし知恵[ちえ]ある使者[ししゃ]は彼[かれ]を救[すく]う。"
  18: "貧[まず]しさと恥[はじ]とを取[と]り去[さ]るのは戒[いまし]めである。しかし叱[しか]りを大[だい]事[じ]にする者[もの]は栄[えい]えられる。"
  19: "敬虔[けいけん]な者[もの]の願[ねが]いは魂[たましい]を快[こころよ]くする。しかし不敬[ふけい]な者[もの]の業[わざ]は知識[ちしき]から遠[とお]い。"
  20: "知恵[ちえ]ある者[もの]とともに歩[ある]く者[もの]は知恵ある者となる。しかし愚[おろ]かな者[もの]とともに歩く者[もの]は、そのとおりの者として知[し]られる。"
  21: "罪[つみ]を犯[おか]す者[もの]を災[わざわ]いが追[お]い、正[ただ]しい者[もの]には善[よ]いことが及[およ]ぶ。"
  22: "善[よ]い人[ひと]は子[こ]の子[こ]らを嗣業[しぎょう]として受[う]け継[つ]ぎ、不敬[ふけい]な者[もの]の富[とみ]は正[ただ]しい者[もの]のために蓄[たくわ]えられる。"
  23: "正[ただ]しい者[もの]たちは富[とみ]のうちに多[おお]くの年[とし]を過[す]ごす。しかし不[ふ]正[せい]な者[もの]たちはたちまち滅[ほろ]びる。"
  24: "杖[つえ]を惜[お]しむ者[もの]は自分[じぶん]の子[こ]を憎[にく]んでいる。しかし子を愛[あい]する者[もの]は、よく懲[こら]しめる。"
  25: "正[ただ]しい者[もの]は食[た]べて自分[じぶん]の魂[たましい]を満[み]たす。しかし不敬[ふけい]な者[もの]の魂は乏[とぼ]しい。"

notes:
  1: "υἱὸς πανοῦργος — «сын благоразумный» (πανοῦργος в этой книге обычно «смышлёный, ловкий», не «коварный»; слав. «благоразумный»); ὑπήκοος πατρί — «послушный отцу» (ὑπήκοος). υἱὸς ἀνήκοος — «сын непослушный» (ἀνήκοος); ἐν ἀπωλείᾳ — «в погибели», без глагола, как в греч. и слав. («в погибель»). ru/MT добавляет «не слушает обличения», jp-joc — «не слушает наставления»; в LXX и csl этих слов нет, не внесены."
  2: "ἀπὸ καρπῶν δικαιοσύνης — «от плодов правды» (καρπός; δικαιοσύνη); φάγεται ἀγαθός — «вкусит добрый». В ru/MT и jp-joc иное чтение — «от плода уст своих»; слав. и LXX держат «плодов правды», оно и переведено. ψυχαὶ παρανόμων ὀλοῦνται ἄωροι — «души беззаконных погибнут безвременно» (ὄλλυμι; ἄωρος — «не в срок, рано»), отсюда 時ならず (ср. 11:30)."
  3: "φυλάσσει τὸ ἑαυτοῦ στόμα — «хранит свои уста» (φυλάσσω); τηρεῖ τὴν ψυχήν — «соблюдает свою душу» (τηρέω). ὁ προπετὴς χείλεσιν — «опрометчивый устами» (προπετής — «стремительный, необдуманный»); πτοήσει ἑαυτόν — «приведёт себя в смятение, устрашит себя» (πτοέω), передано 怯ませる; слав. «устрашит себе»."
  4: "ἐν ἐπιθυμίαις ἐστὶν πᾶς ἀεργός — «всякий праздный в пожеланиях» (ἐπιθυμία; ἀεργός — «неделающий»); χεῖρες ἀνδρεῖων ἐν ἐπιμελείᾳ — «руки мужественных в усердии» (ἀνδρεῖος; ἐπιμέλεια — «старание»). ru/MT: «душа ленивого желает, но тщетно; а душа прилежных насытится» — иное чтение, не внесено."
  5: "λόγον ἄδικον μισεῖ δίκαιος — «слово неправедное ненавидит праведник» (ἄδικος); ἀσεβὴς αἰσχύνεται — «нечестивый стыдится» (αἰσχύνομαι); οὐχ ἕξει παρρησίαν — «не получит дерзновения» (παρρησία — «свобода речи, смелость»), передано 大胆さ."
  6: "δικαιοσύνη φυλάσσει ἀκάκους — «правда хранит незлобивых» (ἄκακος; в корпусе 無垢); τοὺς ἀσεβεῖς φαύλους ποιεῖ ἁμαρτία — «нечестивых дурными делает грех» (φαῦλος — «дурной, ничтожный»; ἁμαρτία)."
  7: "πλουτίζοντες ἑαυτοὺς μηδὲν ἔχοντες — «обогащающие себя, ничего не имея» (πλουτίζω); ταπεινοῦντες ἑαυτοὺς ἐν πολλῷ πλούτῳ — «смиряющие себя при большом богатстве» (ταπεινόω), т. е. выдающие себя за бедных; слав. «смиряющеся во мнозе богатстве». ru/MT поясняет: «выдает себя за богатого… за бедного»."
  8: "λύτρον ἀνδρὸς ψυχῆς ὁ ἴδιος πλοῦτος — «выкуп за душу человека — его собственное богатство» (λύτρον — «выкуп»); πτωχὸς οὐχ ὑφίσταται ἀπειλήν — «бедный не выдерживает угрозы» (ὑφίσταμαι — «подставлять себя, выдерживать»; ἀπειλή). Место многозначно: слав. «не терпит прещения», jp-joc «и угроз не слышит»; оставлено «не выдерживает угрозы»."
  9: "φῶς δικαίοις διὰ παντός — «свет праведным всегда» (φῶς; διὰ παντός — «всегда»); φῶς ἀσεβῶν σβέννυται — «свет нечестивых угасает» (σβέννυμι). Подстих 9a (ψυχαὶ δόλιαι πλανῶνται ἐν ἁμαρτίαις, δίκαιοι οἰκτίρουσιν καὶ ἐλεῶσιν — «души льстивые блуждают во грехах, праведные милуют и щедрят»; δόλιος; πλανάω; οἰκτίρω; ἐλεέω) в базе стоит при 13:9, и слав. держит его в том же стихе 9; переведён здесь, стих не делим."
  10: "κακὸς μεθ᾽ ὕβρεως πράσσει κακά — «злой с надменностью делает злое» (ὕβρις — «наглость, досаждение»; πράσσω); οἱ ἑαυτῶν ἐπιγνώμονες σοφοί — «знающие себя мудры» (ἐπιγνώμων — «сведущий, рассудительный»). ru/MT: «от высокомерия происходит раздор, а у советующихся — мудрость»; слова «раздор» в LXX и csl нет."
  11: "ὕπαρξις ἐπισπουδαζομένη μετὰ ἀνομίας — «имение, поспешно собранное с беззаконием» (ὕπαρξις; ἐπισπουδάζω — «торопить»); ἐλάσσων γίνεται — «умаляется» (ἐλάσσων). ὁ συνάγων ἑαυτῷ μετ᾽ εὐσεβείας πληθυνθήσεται — «собирающий себе с благочестием умножится» (εὐσέβεια; πληθύνω). δίκαιος οἰκτίρει καὶ κιχρᾷ — «праведный милует и даёт в долг» (κιχράω); слав. «дает», поэтому в тексте уточнено 貸し与える."
  12: "κρείσσων ἐναρχόμενος βοηθῶν καρδίᾳ — «лучше начинающий помогать сердцем» (κρείσσων; ἐνάρχομαι; βοηθέω); τοῦ ἐπαγγελλομένου καὶ εἰς ἐλπίδα ἄγοντος — «чем обещающий и ведущий к надежде» (ἐπαγγέλλομαι; ἐλπίς). δένδρον γὰρ ζωῆς ἐπιθυμία ἀγαθή — «ибо древо жизни — желание доброе» (δένδρον ζωῆς — 命の木, как в Быт 2:9). ru/MT здесь иное («надежда, долго не сбывающаяся, томит сердце…») — масоретское чтение, не внесено."
  13: "καταφρονεῖ πράγματος — «пренебрегает делом (вещью)» (καταφρονέω; πρᾶγμα); καταφρονηθήσεται ὑπ᾽ αὐτοῦ — «будет презрен им», т. е. самим этим делом (место тёмное; слав. «презрен будет от нея»). ὁ φοβούμενος ἐντολήν — «боящийся заповеди» (ἐντολή — 戒め); ὑγιαίνει — «здравствует» (ὑγιαίνω). Подстих 13a (υἱῷ δολίῳ οὐδὲν ἔσται ἀγαθόν, οἰκέτῃ δὲ σοφῷ εὔοδοι ἔσονται πράξεις, καὶ κατευθυνθήσεται ἡ ὁδὸς αὐτοῦ — «сыну лукавому не будет ничего доброго; а рабу мудрому успешны будут дела, и исправится путь его»; δόλιος; οἰκέτης; εὔοδος; κατευθύνω) стоит в gr при 13:13, а слав. выносит его отдельным стихом 13:14 — здесь содержание влито в 13:13, стих не добавлен."
  14: "νόμος σοφοῦ πηγὴ ζωῆς — «закон (учение) мудрого — источник жизни» (νόμος; πηγή); слав. «закон мудрому» (датив), по gr родительный, поэтому 知恵ある者の掟. ἄνους ὑπὸ παγίδος θανεῖται — «безумный от сети умрёт» (ἄνους; παγίς — 罠). Слав. 13:15 = наш 13:14: после вставки 13a слав. нумерация сдвинута на −1."
  15: "σύνεσις ἀγαθὴ δίδωσιν χάριν — «добрый разум даёт благодать» (σύνεσις; χάρις — 恵み (в кальке 恩寵)); τὸ γνῶναι νόμον διανοίας ἐστὶν ἀγαθῆς — «познать закон — дело доброго помышления» (διάνοια); ὁδοὶ καταφρονούντων ἐν ἀπωλείᾳ — «пути презирающих — в погибели» (ἀπώλεια)."
  16: "πᾶς πανοῦργος πράσσει μετὰ γνώσεως — «всякий смышлёный действует со знанием» (γνῶσις); ἄφρων ἐξεπέτασεν ἑαυτοῦ κακίαν — «глупый разверз (выставил) свою злобу» (ἐκπετάννυμι — «раскрывать»; κακία). Слав. «прострет свою злобу»."
  17: "βασιλεὺς θρασύς — «царь дерзкий» (θρασύς); ἐμπεσεῖται εἰς κακά — «впадёт в беды». ἄγγελος πιστὸς ῥύσεται αὐτόν — «вестник верный спасёт его» (ἄγγελος здесь «посланник»; πιστός; ῥύομαι); слав. «вестник же мудр» — иное чтение, по паритету взято слав. (知恵ある使者)."
  18: "πενίαν καὶ ἀτιμίαν ἀφαιρεῖται παιδεία — «бедность и бесчестие отнимает наказание (воспитание)» (πενία; ἀτιμία; ἀφαιρέω; παιδεία — 戒め); ὁ φυλάσσων ἐλέγχους δοξασθήσεται — «хранящий обличения прославится» (ἔλεγχος — 叱り; δοξάζω)."
  19: "ἐπιθυμίαι εὐσεβῶν ἡδύνουσιν ψυχήν — «желания благочестивых услаждают душу» (ἡδύνω — «делать сладким»); ἔργα ἀσεβῶν μακρὰν ἀπὸ γνώσεως — «дела нечестивых далеки от знания». ru/MT и jp-joc дают масоретское «желание исполнившееся приятно душе»; в LXX и csl иначе."
  20: "συμπορευόμενος σοφοῖς — «ходящий вместе с мудрыми» (συμπορεύομαι); σοφὸς ἔσται — «будет мудр». ὁ συμπορευόμενος ἄφροσι γνωσθήσεται — «ходящий с глупыми будет узнан» (γινώσκω), т. е. его узнают по спутникам."
  21: "ἁμαρτάνοντας καταδιώξεται κακά — «согрешающих постигнет, будет преследовать злое» (καταδιώκω); τοὺς δικαίους καταλήμψεται ἀγαθά — «праведных постигнет доброе» (καταλαμβάνω)."
  22: "ἀγαθὸς ἀνὴρ κληρονομήσει υἱοὺς υἱῶν — «добрый человек наследует сынов сынов» (κληρονομέω), т. е. увидит внуков; θησαυρίζεται δὲ δικαίοις πλοῦτος ἀσεβῶν — «сберегается же праведным богатство нечестивых» (θησαυρίζω — «копиться»), ср. 13:23."
  23: "δίκαιοι ποιήσουσιν ἐν πλούτῳ ἔτη πολλά — «праведные проведут в богатстве много лет» (ποιέω — «проводить», букв. «сделают»); ἄδικοι ἀπολοῦνται συντόμως — «неправедные погибнут скоро» (συντόμως). Слав. «насладятся в богатстве лета многа» — иное чтение; по gr в тексте 過ごす."
  24: "ὃς φείδεται τῆς βακτηρίας — «кто жалеет жезла, розги» (φείδομαι; βακτηρία — 杖, слав. «жезл»); μισεῖ τὸν υἱὸν αὐτοῦ — «ненавидит сына своего»; ὁ ἀγαπῶν ἐπιμελῶς παιδεύει — «любящий прилежно наказывает, воспитывает» (ἐπιμελῶς; παιδεύω)."
  25: "δίκαιος ἔσθων ἐμπιπλᾷ τὴν ψυχήν — «праведный, вкушая, насыщает душу» (ἐσθίω; ἐμπίπλημι); ψυχαὶ ἀσεβῶν ἐνδεεῖς — «души нечестивых в недостатке» (ἐνδεής). Слав. 13:26 = наш 13:25; ru/MT: «праведник ест до сытости, а чрево беззаконных терпит лишение»."
