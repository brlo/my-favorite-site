# jp-box, Притчи, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в гл. 13 есть выборочно (по нумерации gr — стихи 1–9 и 19–25;
# у самого jp-joc после слав. вставки 13a нумерация на один стих больше) — контроль
# церковного чтения. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: двустишия о послушном сыне (1, 24), устах и речи (2–3, 17), лени
# и прилежании (4), правде, богатстве и надежде (5–12, 19, 21–23), свете (9),
# наказании и обличении (13–18, 24), общении с мудрыми (20).
# Прямой речи нет: все стихи — авторские изречения, кавычек нет.
# Нумерация по gr: 25 стихов (13:26 в греческой базе пуст). Дефект csl: слав.
# вставляет 13a («Сыну лукавому ничтоже есть благо…») отдельным стихом 13:14;
# в gr это подстих 13:13, поэтому его содержание влито в наш 13:13 (стих не добавлен),
# а с csl 13:15 начинается сдвиг на −1 (csl 13:15 = наш 13:14).
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

