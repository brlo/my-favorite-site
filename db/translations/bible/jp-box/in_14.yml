verses:
  1: "「<j>あなたがたの心[こころ]を騒[さわ]がせてはならない。神[かみ]を信[しん]じ、またわたしを信[しん]じなさい。</j>"
  2: "<j>わたしの父[ちち]の家[いえ]には、住[す]まいが多[おお]くある。もしそうでなければ、あなたがたに言[い]っておいたであろう。わたしは、あなたがたのために場所[ばしょ]を用意[ようい]しに行[い]く。</j>"
  3: "<j>行[い]ってあなたがたのために場所[ばしょ]を用意[ようい]したなら、また来[き]て、あなたがたをわたしのもとへ引[ひ]き取[と]る。わたしがいるところに、あなたがたもいるようになるためである。</j>"
  4: "<j>わたしが行[い]く所[ところ]を、あなたがたは知[し]っており、その道[みち]も知[し]っている。</j>」"
  5: "トマスは言[い]った。「主[しゅ]よ、あなたがどこへ行[い]かれるのか、わたしたちは知[し]りません。どうして、その道[みち]を知[し]ることができるでしょうか。」"
  6: "イエスは言[い]われた。「<j>わたしは道[みち]、真理[しんり]、命[いのち]である。わたしを通[とお]らなければ、だれも父[ちち]のもとへ来[く]ることはない。</j>"
  7: "<j>もしあなたがたがわたしを知[し]ったのなら、わたしの父[ちち]をも知[し]るであろう。今[いま]からは、あなたがたは父[ちち]を知[し]っており、父[ちち]を見[み]てきたのである。</j>"
  8: "ピリポは言[い]った。「主[しゅ]よ、父[ちち]をわたしたちに見[み]せてください。それで十分[じゅうぶん]です。」"
  9: "<j>ピリポ、こんなに長[なが]い間[あいだ]、わたしはあなたがたと一緒[いっしょ]にいるのに、あなたはわたしを知[し]らないのか。わたしを見[み]た者[もの]は父[ちち]を見[み]たのである。どうして、『父[ちち]をわたしたちに見[み]せてください』と言[い]うのか。</j>"
  10: "<j>わたしが父[ちち]のうちにいて、父[ちち]がわたしのうちにおられることを、あなたは信[しん]じないのか。わたしがあなたがたに語[かた]る言葉[ことば]は、自分[じぶん]から語[かた]っているのではない。わたしのうちにおられる父[ちち]が、ご自分[じぶん]のわざを行[おこな]っておられるのである。</j>"
  11: "<j>わたしが父[ちち]のうちにいて、父[ちち]がわたしのうちにおられることを信[しん]じなさい。もし信[しん]じられないなら、わざそのものによって信[しん]じなさい。</j>"
  12: "<j>よくよく言[い]っておく。わたしを信[しん]じる者[もの]は、わたしが行[おこな]うわざを行[おこな]い、それよりも大[おお]きなわざを行[おこな]うであろう。わたしが父[ちち]のもとへ行[い]くからである。</j>"
  13: "<j>あなたがたがわたしの名[な]によって求[もと]めることは、何[なん]でもわたしが行[おこな]う。父[ちち]が子[こ]によって栄光[えいこう]をお受[う]けになるためである。</j>"
  14: "<j>あなたがたがわたしの名[な]によってわたしに求[もと]めるなら、わたしがそれを行[おこな]う。</j>」"
  15: "「<j>もしあなたがたがわたしを愛[あい]するなら、わたしの掟[おきて]を守[まも]りなさい。</j>"
  16: "<j>わたしは父[ちち]に願[ねが]い、父[ちち]はあなたがたに別[べつ]の助[たす]け主[ぬし]を授[さず]けて、いつまでもあなたがたと一緒[いっしょ]にいてくださるようにする。</j>"
  17: "<j>すなわち真理[しんり]の霊[れい]である。この世[よ]はこれを受[う]け入[い]れることができない。見[み]ることも知[し]ることもないからである。あなたがたはこれを知[し]っている。あなたがたのもとにとどまり、あなたがたのうちにおられるからである。</j>"
  18: "<j>わたしはあなたがたを孤児[みなしご]にはしない。あなたがたのところへ来[く]る。</j>"
  19: "<j>もうしばらくすると、この世[よ]はもはやわたしを見[み]なくなる。しかし、あなたがたはわたしを見[み]る。わたしが生[い]きているから、あなたがたも生[い]きるのである。</j>"
  20: "<j>その日[ひ]には、あなたがたは、わたしが父[ちち]のうちにいて、あなたがたがわたしのうちにいて、わたしがあなたがたのうちにいることを知[し]るであろう。</j>"
  21: "<j>わたしの掟[おきて]を持[も]ち、それを守[まも]る者[もの]が、わたしを愛[あい]する者[もの]である。わたしを愛[あい]する者[もの]は、わたしの父[ちち]に愛[あい]され、わたしもその人[ひと]を愛[あい]して、その人[ひと]にわたし自身[じしん]を現[あらわ]すであろう。</j>」"
  22: "イスカリオテでないユダは言[い]った。「主[しゅ]よ、あなたがわたしたちにはご自身[じしん]を現[あらわ]そうとなさり、この世[よ]には現[あらわ]そうとなさらないのは、どうしてでしょうか。」"
  23: "イエスは答[こた]えて言[い]われた。「<j>わたしを愛[あい]する者[もの]は、わたしの言葉[ことば]を守[まも]る。わたしの父[ちち]もその人[ひと]を愛[あい]し、わたしたちはその人[ひと]のところへ行[い]って、その人[ひと]とともに住[す]まうようになる。</j>"
  24: "<j>わたしを愛[あい]さない者[もの]は、わたしの言葉[ことば]を守[まも]らない。あなたがたが聞[き]く言葉[ことば]は、わたしのものではなく、わたしを遣[つか]わした父[ちち]のものである。</j>"
  25: "<j>わたしは、あなたがたと一緒[いっしょ]にいる間[あいだ]、これらのことをあなたがたに語[かた]ってきた。</j>"
  26: "<j>しかし、助[たす]け主[ぬし]、すなわち父[ちち]がわたしの名[な]によって遣[つか]わされる{聖霊[せいれい]|聖神[せいしん]}が、あなたがたにすべてのことを教[おし]え、わたしがあなたがたに言[い]ったことをすべて思[おも]い起[おこ]させてくださる。</j>"
  27: "<j>わたしはあなたがたに平和[へいわ]を残[のこ]す。わたしの平和[へいわ]をあなたがたに与[あた]える。わたしが与[あた]えるのは、この世[よ]が与[あた]えるようなものではない。あなたがたの心[こころ]を騒[さわ]がせてはならない。おそれてはならない。</j>"
  28: "<j>あなたがたは、わたしが『わたしは行[い]って、またあなたがたのところへ来[く]る』と言[い]ったのを聞[き]いた。もしあなたがたがわたしを愛[あい]していたなら、わたしが父[ちち]のもとへ行[い]くことを喜[よろこ]んだであろう。父[ちち]はわたしより大[おお]きいからである。</j>"
  29: "<j>今[いま]、事[こと]が起[お]こる前[まえ]に、それらをあなたがたに言[い]っておいた。事[こと]が起[お]こったとき、あなたがたが信[しん]じるためである。</j>"
  30: "<j>わたしはもう、あなたがたに多[おお]くを語[かた]らない。この世[よ]の支配者[しはいしゃ]が来[く]るからである。だが、その者[もの]はわたしのうちに何[なに]も持[も]っていない。</j>"
  31: "<j>しかし、この世[よ]が、わたしが父[ちち]を愛[あい]していること、また、父[ちち]が命[めい]じられたとおりにわたしが行[おこな]っていることを知[し]るためである。立[た]ちなさい。ここから行[い]こう。</j>」"

notes:
  1: "Μὴ ταρασσέσθω ὑμῶν ἡ καρδία — «да не смущается сердце ваше»; 心を騒がせてはならない. πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε — можно читать и как изъявительное («веруете»), и как повелительное; взято повелительное, как у jp-joc (信じよ)."
  2: "ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί — «в доме Отца Моего обителей много»; μονή — 住まい (обитель), не «комната». εἰ δὲ μή, εἶπον ἂν ὑμῖν — «а если бы не так, Я сказал бы вам»; условное с ἄν, передано 言っておいたであろう."
  3: "παραλήμψομαι — «возьму [к Себе]»; 引き取る. ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε — «чтобы, где Я, и вы были»; порядок сохранён."
  4: "καὶ ὅπου ἐγὼ ὑπάγω οἴδατε τὴν ὁδόν — «и куда Я иду, знаете путь»; 行く所を知っており、その道も知っている. В критическом издании [ἐγώ] под скобками — на перевод не влияет."
  5: "Θωμᾶς — トマス. Вопрос Фомы — вне красного. πῶς δυνάμεθα τὴν ὁδὸν εἰδέναι; — «как можем знать путь?»"
  6: "Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή — «Я есмь путь и истина и жизнь»; わたしは道[みち]、真理[しんり]、命[いのち]である (по заданию). οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι᾽ ἐμοῦ — «никто не приходит к Отцу, как только через Меня»."
  7: "εἰ ἐγνώκατέ με — «если бы вы познали Меня» (условное с перфектом); ἀπ᾽ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε αὐτόν — «отныне знаете Его и видели Его»; perfect ἑωράκατε — 見てきた."
  8: "Φίλιππος — ピリポ. δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν — «покажи нам Отца, и довольно для нас». Просьба Филиппа — вне красного."
  9: "Τοσούτῳ χρόνῳ — «столько времени»; こんなに長い間. ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα — «видевший Меня видел Отца» (по заданию); perfect сохранён: 見たのである. Вложенная цитата — 『』."
  10: "ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί — взаимное пребывание; 父のうちにいて、父が…おられる. τὰ ῥήματα ἃ ἐγὼ λαλῶ — 語る言葉. ὁ πατὴρ ἐν ἐμοὶ μένων ποιεῖ τὰ ἔργα αὐτοῦ — «Отец, во Мне пребывающий, творит дела Свои»; ご自分のわざを行っておられる."
  11: "πιστεύετέ μοι — «верьте Мне»; εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ πιστεύετε — «если же нет, по делам самим верьте»."
  12: "ἀμὴν ἀμὴν λέγω ὑμῖν — よくよく言っておく. κἀκεῖνος ποιήσει — «и тот сотворит»; καὶ μείζονα τούτων — «и больше сих»; ὅτι ἐγὼ πρὸς τὸν πατέρα πορεύομαι — «ибо Я к Отцу иду»."
  13: "ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου — «если чего попросите во имя Моё». В критическом тексте здесь нет «у Отца» (в отличие от 16:23); 求める без 父 — так и передано. ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ — 父が子によって栄光をお受けになる."
  14: "ἐάν τι αἰτήσητέ με — с με («у Меня»), поэтому わたしに求める. Разница с 13 сохранена, не сглажена."
  15: "Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς τηρήσετε — «если любите Меня, заповеди Мои соблюдете»; 掟[おきて] — как во всём корпусе (ἐντολή)."
  16: "παράκλητος — «Утешитель, Заступник»; принято 助け主[たすけぬし] (聖霊の称号: 慰め、支え、導く者). У jp-joc 撫恤者. ἄλλον — «другого», не «иного»; 別の. εἰς τὸν αἰῶνα — «вовек»; いつまでも."
  17: "τὸ πνεῦμα τῆς ἀληθείας — «Дух истины»; 真理の霊. ὁ κόσμος οὐ δύναται λαβεῖν — «мир не может принять»; 受け入れる. παρ᾽ ὑμῖν μένει καὶ ἐν ὑμῖν ἐστιν — «у вас пребывает и в вас есть»; もとにとどまり、うちにおられる."
  18: "ὀρφανούς — «сирот»; 孤児[みなしご]. ἔρχομαι πρὸς ὑμᾶς — настоящее время, «прихожу к вам»; ところへ来る."
  19: "ἔτι μικρὸν — «ещё немного»; もうしばらくすると. ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ζήσετε — «ибо Я живу и вы будете жить»; 生きているから…生きる."
  20: "ἐν ἐκείνῃ τῇ ἡμέρᾳ — «в тот день»; その日. Тройное ἐν (в Отце, во Мне, во вас) сохранено."
  21: "ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτάς — «имеющий заповеди Мои и соблюдающий их»; ἐμφανίσω αὐτῷ ἐμαυτόν — «явлю ему Себя»; わたし自身を現す."
  22: "Ἰούδας, οὐχ ὁ Ἰσκαριώτης — «Иуда, не Искариот» (апостол Иуда Фаддей); イスカリオテでないユダ. τί γέγονεν ὅτι — «что это [значит], что»; どうしてでしょうか. Вопрос — вне красного."
  23: "Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει — «кто любит Меня, слово Моё соблюдёт»; μονὴν παρ᾽ αὐτῷ ποιησόμεθα — «обитель у него сотворим»; ともに住まうようになる. Мысли о «обители» из 14:2 сохранены."
  24: "ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ — «не любящий Меня слов Моих не соблюдает»; множественное λόγους — 言葉. ὁ λόγος ὃν ἀκούετε — «слово, которое слышите»."
  25: "Ταῦτα λελάληκα ὑμῖν παρ᾽ ὑμῖν μένων — «сие сказал Я вам, находясь с вами»; perfect — 語ってきた."
  26: "παράκλητος, τὸ πνεῦμα τὸ ἅγιον — «Утешитель, Дух Святый»; 助け主、すなわち聖霊. {聖霊[せいれい]|聖神[せいしん]} — калька в этой главе только здесь (ср. Ин 1:32–33, 7:39 и др.). ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου — «Которого пошлёт Отец во имя Моё»; ὑπομνήσει — «напомнит»; 思い起こさせる."
  27: "εἰρήνην ἀφίημι ὑμῖν — «мир оставляю вам»; 平和[へいわ] (по заданию). οὐ καθὼς ὁ κόσμος δίδωσιν — «не так, как мир даёт»; μηδὲ δειλιάτω — «и да не устрашается»; おそれてはならない."
  28: "εἰ ἠγαπᾶτέ με ἐχάρητε ἄν — «если бы вы любили Меня, возрадовались бы»; 喜んだであろう. ὁ πατὴρ μείζων μού ἐστιν — «Отец больше Меня»; 父はわたしより大きい (по заданию; не «старше»)."
  29: "πρὶν γενέσθαι — «прежде нежели сбылось»; 起こる前に. ἵνα… πιστεύσητε — «чтобы вы поверили»."
  30: "ὁ τοῦ κόσμου ἄρχων — «князь мира сего»; この世の支配者[しはいしゃ]. καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν — «и во Мне не имеет ничего»; подлежащее — «князь мира сего», поэтому その者は…持っていない."
  31: "ἀλλ᾽ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα — «но чтобы мир знал, что Я люблю Отца»; придаточное цели без главного глагола, как в греческом. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν — «встаньте, пойдём отсюда»; 立ちなさい。ここから行こう."
