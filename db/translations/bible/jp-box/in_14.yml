# jp-box, Евангелие от Иоанна, глава 14.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# jp-ni не использовался.
#
# Прощальная беседа: «обители» и путь к Отцу (1–7), «Я есмь путь, истина, жизнь»
# и просьба Филиппа (8–14), обетование Утешителя (15–26), мир и уход (27–31).
# Речь Христа — красным; слова Фомы, Филиппа и Иуды (не Искариота) — вне тегов.
# παράκλητος — 助け主[たすけぬし] (14:16, 14:26), пояснение — в notes.

