verses:
  1: "「しるしについては、見[み]よ、日[ひ]が来[く]る。その日[ひ]には、地[ち]に住[す]む者[もの]たちは多[おお]くの税[みつぎ]に重[おも]くさいなまれ、正[ただ]しさの道[みち]は隠[かく]され、世界[せかい]は信仰[しんこう]を失[うしな]って不毛[ふもう]になる。"
  2: "不[ふ]正[せい]は、あなたが今[いま]見[み]ているものよりも、また昔[むかし]からあなたが聞[き]いてきたものよりも、さらに増[ふ]え広[ひろ]がる。"
  3: "あなたが今[いま]入[はい]って見[み]ている、あの支[し]配[はい]している地[ち]も、荒[あ]れ果[は]てたものとして見[み]られるようになる。"
  4: "しかし、いと高[たか]き方[かた]があなたを生[い]きながらえさせてくださるなら、あなたは第三[だいさん]のラッパの後[あと]に、夜[よる]のうちに日[ひ]が突然[とつぜん]輝[かがや]き出[だ]し、月[つき]が一日[いちにち]に三度[さんど]輝くのを見[み]る。"
  5: "木[き]から血[ち]が滴[したた]り、石[いし]が声[こえ]を発[はっ]し、諸[もろもろ]の民[たみ]が揺[ゆ]れ動[うご]く。"
  6: "地[ち]に住[す]む者[もの]たちが思[おも]いもよらない者[もの]が王[おう]として君臨[くんりん]し、鳥[とり]たちはその場所[ばしょ]から移[うつ]り去[さ]る。"
  7: "ソドムの海[うみ]は魚[さかな]を吐[は]き出[だ]し、夜[よる]に声[こえ]を発[はっ]する。多[おお]くの者[もの]が知[し]らなかったその声[こえ]を、すべての者[もの]が聞[き]く。"
  8: "多[おお]くの場所[ばしょ]に混乱[こんらん]が起こり、火[ひ]がしばしば降[ふ]り注[そそ]ぎ、野[の]の獣[けもの]たちは移[うつ]り住[す]み、病[やまい]を負[お]った女[おんな]たちは怪[あや]しきものを産[う]む。"
  9: "甘[あま]い水[みず]に塩[しお]けが現[あらわ]れ、友[とも]はこぞって互[たが]いに陣[じん]を構[かま]える。そのとき、知性[ちせい]は隠[かく]され、理性[りせい]はその倉[くら]へ退[しりぞ]く。"
  10: "それは多[おお]くの者[もの]に求[もと]められるが、見[み]つからない。不[ふ]正[せい]と放縦[ほうじゅう]が地[ち]に増[ふ]える。"
  11: "一[ひと]つの地方[ちほう]は隣[となり]の地方[ちほう]に問[と]うて言[い]う。『あなたのところに、人[ひと]を正[ただ]しくする正[ただ]しさが通[とお]り過[す]ぎなかったか』と。すると、それは否[いな]む。"
  12: "その時[とき]、人[ひと]々[びと]は望[のぞ]みを抱[いだ]くが、受[う]け取[と]れない。労[ろう]しても、その道[みち]は整[ととの]わない。"
  13: "これらのしるしについては、わたしがあなたに語[かた]ることが許[ゆる]されている。もしあなたがもう一度[いちど]祈[いの]り、今[いま]のように泣[な]き、七日[なのか]の断食[だんじき]をしたなら、これよりもさらに大[おお]きいことを聞[き]くであろう。」"
  14: "わたしは目[め]を覚[さ]ました。体[からだ]はひどく震[ふる]え、魂[たましい]は消[き]え入[い]りそうになって弱[よわ]り果[は]てた。"
  15: "わたしに語[かた]っていた天[てん]使[し]が来[き]てわたしを支[ささ]え、力[ちから]づけて足[あし]の上[うえ]に立[た]たせた。"
  16: "二[ふた]つ目[め]の夜[よる]、民[たみ]の長[かしら]であるサラティエルがわたしのところへ来[き]て言[い]った。「どこにいたのか。なぜ、あなたの顔[かお]は悲[かな]しげなのか。"
  17: "あなたは、イスラエルがその捕囚[ほしゅう]の地[ち]であなたに委[ゆだ]ねられていることを知[し]らないのか。"
  18: "だから、立[た]ってパンを食[た]べよ。羊[ひつじ]飼[か]いがその群[む]れを悪[わる]い狼[おおかみ]たちの手[て]に残[のこ]すように、わたしたちを置[お]き去[ざ]りにしないでほしい。」"
  19: "わたしは彼[かれ]に言[い]った。「わたしから離[はな]れて、近[ちか]づかないでくれ。」彼[かれ]はわたしの言[い]うことを聞[き]くと、わたしから去[さ]って行[い]った。"
  20: "わたしは、天[てん]使[し]ウリエルが命[めい]じたとおりに、七日[なのか]のあいだ嘆[なげ]き泣[な]きながら断食[だんじき]をした。"
  21: "七日[なのか]が過[す]ぎると、再[ふたた]び心[こころ]の思[おも]いがわたしにひどく重[おも]くのしかかった。"
  22: "わたしの魂[たましい]は悟[さと]りの霊[れい]を受[う]け、わたしは再[ふたた]びいと高[たか]き方[かた]の前[まえ]で語[かた]り始[はじ]めた。"
  23: "「ああ、主[しゅ]なる神[かみ]よ。あなたは地[ち]のすべての森[もり]、そのすべての木[き]の中[なか]から、ただ一[ひと]つの葡萄[ぶどう]の木[き]を選[えら]ばれました。"
  24: "地[ち]の圏[けん]の全[すべ]てからただ一[ひと]つの谷[たに]を、世界[せかい]のすべての花[はな]からただ一[ひと]つの百合[ゆり]を御自分[おんじしん]のために選[えら]ばれました。"
  25: "海[うみ]のすべての淵[ふち]からただ一[ひと]つの泉[いずみ]を御自分[おんじしん]のために満[み]たし、造[つく]られたすべての都[みやこ]の中[なか]からシオンを御自分[おんじしん]のために聖別[せいべつ]されました。"
  26: "造[つく]られたすべての飛[と]ぶものの中[なか]からただ一[ひと]つの鳩[はと]を御自分[おんじしん]のために名[な]づけ、造[つく]られたすべての家畜[かちく]の中[なか]からただ一[ひと]つの羊[ひつじ]を御自分[おんじしん]のために備[そな]えられました。"
  27: "多[おお]くの民[たみ]の中[なか]からただ一[ひと]つの民[たみ]を御自分[おんじしん]のために求[もと]め、あなたが愛[あい]されたその民[たみ]に、よく試[こころ]まれた律法[りっぽう]を与[あた]えられました。"
  28: "しかし今[いま]、主[しゅ]よ、なぜあなたはこの一[ひと]つを多[おお]くの者[もの]に引[ひ]き渡[わた]されたのですか。なぜ一[ひと]つの根[ね]に多[おお]くの他[た]のものを備[そな]え、あなたのただ一[ひと]つを多[おお]くのものの中[なか]へ散[ち]らされたのですか。"
  29: "あなたの約束[やくそく]に逆[さか]らって語[かた]り、あなたの契約[けいやく]を信[しん]じなかった者[もの]たちが、それを踏[ふ]みにじりました。"
  30: "もしあなたがあなたの民[たみ]を憎[にく]みに憎[にく]まれたのなら、彼らはあなたの御手[みて]によって罰[ばっ]せられるべきです。」"
  31: "わたしがこれらの言葉[ことば]を語[かた]っていると、前[まえ]の夜[よる]にわたしのところへ来[き]た天[てん]使[し]が、わたしに遣[つか]わされた。"
  32: "彼[かれ]はわたしに言[い]った。「わたしに聞[き]け、教[おし]えよう。わたしに耳[みみ]を傾[かたむ]けよ、あなたの前[まえ]にさらに語[かた]ろう。」"
  33: "わたしは言[い]った。「語[かた]ってください、わが主[しゅ]よ。」彼[かれ]はわたしに言[い]った。「あなたはイスラエルのゆえに、知性[ちせい]の迷[まよ]いにひどく陥[おちい]っている。それとも、あなたはこれを造[つく]られた方[かた]よりも、この民[たみ]を愛[あい]しているのか。」"
  34: "わたしは彼[かれ]に言[い]った。「いいえ、わが主[しゅ]よ。しかし、苦[くる]しみながら語[かた]ったのです。いと高[たか]き方[かた]の道[みち]を捕[と]らえ、その裁[さば]きの一部分[いちぶぶん]を探[さぐ]り求[もと]めようとするわたしを、腰[こし]が絶[た]えず苦[くる]しめるのです。」"
  35: "彼[かれ]はわたしに言[い]った。「できない。」わたしは言[い]った。「なぜですか、わが主[しゅ]よ。なぜわたしは生[う]まれたのですか。なぜ母[はは]の胎[たい]はわたしの墓[はか]とならなかったのですか。そうすれば、わたしはヤコブの苦[くる]しみとイスラエルの家[いえ]の衰[おとろ]えを見[み]ずにすんだのに。」"
  36: "彼[かれ]はわたしに言[い]った。「まだ来[こ]ないものをわたしのために数[かぞ]え、散[ち]らばった滴[しずく]をわたしのために集[あつ]め、枯[か]れた花[はな]をわたしのために緑[みどり]にせよ。"
  37: "閉[と]ざされた倉[くら]をわたしのために開[ひら]き、そこに閉[と]じ込[め]られた風[かぜ]をわたしのために連[つ]れ出[だ]せ。声[こえ]の形[かたち]をわたしに示[しめ]せ。そうすれば、あなたが切[せつ]に望[のぞ]んでいる労[ろう]苦[く]を、わたしはあなたに示[しめ]そう。」"
  38: "わたしは言[い]った。「ああ、主[しゅ]なる神[かみ]よ。人[ひと]と住[す]まいを共[とも]にしない者[もの]のほかに、だれがこれを知[し]ることができるでしょう。"
  39: "わたしは愚[おろ]かです。どうして、あなたがわたしに問[と]われたこれらのことを語[かた]ることができるでしょう。」"
  40: "彼[かれ]はわたしに言[い]った。「あなたがこれらの語[かた]られたことの一[ひと]つも行[おこな]えないように、あなたはわたしの裁[さば]きも、わたしが民[たみ]に約束[やくそく]した愛[あい]の限[かぎ]りも見[み]いだせない。」"
  41: "わたしは言[い]った。「しかし、主[しゅ]よ、あなたは終[お]わりに近[ちか]づく者[もの]たちの近[ちか]くにおられます。わたしより前[まえ]にいた者[もの]たち、わたしたち、またわたしたちの後[あと]に来[く]る者[もの]たちは、何[なに]をするのでしょうか。」"
  42: "彼[かれ]はわたしに言[い]った。「わたしはわたしの裁[さば]きを冠[かんむり]に似[に]たものとしよう。後[あと]の者[もの]たちの遅[おく]れもなく、先[さき]の者[もの]たちの急[いそ]ぎもない。」"
  43: "わたしは答[こた]えて言[い]った。「あなたは、すでに造[つく]られた者[もの]たち、今[いま]ある者[もの]たち、やがて来[く]る者[もの]たちを一[ひと]つに造[つく]って、あなたの裁[さば]きを早[はや]く示[しめ]すことはできなかったのですか。」"
  44: "彼[かれ]は答[こた]えて言[い]った。「造[つく]られたものが造[つく]り主[ぬし]より先[さき]を急[いそ]ぐことはできない。この世[よ]も、その中[なか]で一[ひと]つに造[つく]られる者[もの]たちを共[とも]に抱[かか]えることはできない。"
  45: "あなたは僕[しもべ]に、ご自分[じぶん]が造[つく]られたものを一[ひと]つに生[い]かし、その造[つく]られたものがそれを担[にな]った、と言[い]われました。ならば今[いま]ある者[もの]たちも一[ひと]つに担[にな]うことができたはずです。」"
  46: "彼[かれ]はわたしに言[い]った。「女[おんな]の胎[たい]に問[と]い、こう言[い]え。『あなたが産[う]むなら、なぜ時[とき]を分[わ]けて産[う]むのか』と。そして彼女[かのじょ]に、十人[じゅうにん]を一[いち]度[ど]に産[う]むように求[もと]めよ。」"
  47: "わたしは言[い]った。「それはできません。時[とき]を分[わ]けてでしか産[う]めません。」"
  48: "彼[かれ]はわたしに言[い]った。「わたしもまた、地[ち]の胎[たい]に、そこに蒔[ま]かれた者[もの]たちを時[とき]を分[わ]けて産[う]む力を与[あた]えた。"
  49: "幼[おさな]い子[こ]が年寄[としよ]りに属[ぞく]するものを産[う]むことができないのと同[おな]じように、わたしはわたしが造[つく]った世[よ]を整[ととの]えた。」"
  50: "わたしは問[と]うて言[い]った。「あなたがすでにわたしに道[みち]を開[ひら]かれたのですから、あなたの前[まえ]に語[かた]ります。あなたがわたしに語[かた]られたわたしたちの母[はは]は、まだ若[わか]いのに、すでに老[お]いに近[ちか]づいています。」"
  51: "彼[かれ]は答[こた]えて言[い]った。「産[う]む者[もの]に問[と]え。彼女[かのじょ]があなたに答[こた]える。"
  52: "あなたは彼女[かのじょ]に言[い]わねばならない。『なぜ、あなたが産[う]んだ者[もの]たちは、あなたより前[まえ]の者[もの]たちに似[に]ず、背[せ]が低[ひく]いのか』と。"
  53: "彼女[かのじょ]もあなたに言[い]うであろう。『若[わか]い力[ちから]のうちに産[う]まれた者[もの]たちと、老[お]いの時[とき]に衰[おとろ]えた胎[たい]から産[う]まれた者[もの]たちとは違[ちが]うのです』と。"
  54: "だからあなたも、あなたがたがあなたがたより前[まえ]の者[もの]たちよりも背[せ]が低[ひく]いことを悟[さと]れ。"
  55: "あなたがたの後[あと]の者[もの]たちはあなたがたよりもさらに低[ひく]い。造[つく]られたものがすでに老[お]い、若[わか]さの力[ちから]が過[す]ぎ去[さ]ったからである。」"
  56: "わたしは言[い]った。「主[しゅ]よ、お願[ねが]いします。もしあなたの目[め]の前[まえ]に恵[めぐ]みを得[え]たのなら、あなたがだれによってあなたの造[つく]られたものを訪[おとず]れるのか、僕[しもべ]に示[しめ]してください。」"

notes:
  1: "слав. «обременени будут даньми многими» — «будут обременены многими податями»; «будет вселенная неплодна от веры» — «вселенная станет неплодной от веры». ru: «многие... обладающие ведением, будут восхищены» — иное чтение (вместо «данями»), в текст не внесено."
  2: "«паче сея, юже ты видиши, и паче тоя, о нейже еси слышал издревле» — «более той, которую ты видишь, и более той, о которой слышал издревле»."
  3: "«в нюже вшед ныне видиши царствующую» — «в которую войдя, ты видишь её ныне царствующей»; «узрят ю опустену» — «увидят её опустошённой». ru сглаживает: «страна... подвергнется опустошению»."
  4: "«даст вышний живу быти» — «даст Всевышний быть живым»; «по третией трубе» — «после третьей трубы»; «луна трижды в день» — буквально «луна трижды в день»."
  5: "«воскаплет кровь от древа» — «закаплет кровь с дерева»; «поколеблются людие» — «поколеблются народы»."
  6: "«егоже не надеются живущии на земли» — «которого не ожидают живущие на земле»; «птицы прейдут от места своего» — «птицы перейдут с места своего»."
  7: "«море содомское» — Содомское (Мёртвое) море; «даст глас нощию» — «издаст голос ночью»; «егоже мнози не знаша» — «которого многие не знали»."
  8: "«зверие польстии» — «полевые (дикие) звери»; «жены болезнивыя породят щуда» — «женщины, имеющие болезни, родят чудеса» (щуда — «чудеса», диковинное); ru: «нечистые женщины будут рождать чудовищ» — иное чтение."
  9: "«в сладких водах сланы обрящутся» — «в сладких водах солёные найдутся»; «друзи вси сами на ся ополчатся» — «все друзья ополчатся друг на друга»; «ум... разум отлучится в хранилище свое» — «ум сокроется, разум удалится в своё хранилище»."
  10: "«взыщется от многих и не обрящется» — «будет иском многими и не найдётся» (подлежащее — ум/разум из ст. 9); «невоздержание» — «невоздержанность, распущенность»."
  11: "«не прейде ли по тебе правда праведнаго творящая?» — «не прошла ли по тебе правда, делающая праведным?»; «и сего отречется» — «и та отречётся»."
  12: "«уповати будут человецы и не восприимут» — «люди будут надеяться и не получат»; «не управятся путие их» — «пути их не выправятся»."
  13: "«попущено есть мне глаголати к тебе» — «мне позволено говорить тебе»; «еще болшая сих услышиши» — «услышишь ещё большее сего». Здесь речь ангела закрывается."
  14: "«возбнух» — «я очнулся, пришёл в себя»; «душа моя утрудися, аки бы исчезала» — «душа моя изнемогла, как бы исчезая»."
  15: "«иже прииде ангел, иже глаголаше ко мне» — «пришедший ангел, который говорил мне»; «постави мя на ногах» — «поставил меня на ноги»."
  16: "«в нощь вторую» — «во вторую ночь»; «салафиил вождь людем» — «Салафиил, вождь народа»; «вскую лице твое скорбно?» — «почему лицо твоё печально?»"
  17: "«тебе вверен есть израиль во стране преселения их» — «тебе вверен Израиль в стране переселения их»."
  18: "«не остави нас, якоже пастырь стадо свое в руках волков лукавых» — «не оставь нас, как пастырь своё стадо в руках лукавых волков»."
  19: "«иди от мене и не приближайся ко мне» — «отойди от меня и не приближайся ко мне»; «отиде от мене» — «ушёл от меня»."
  20: "«постихся дний седмь стеня и плачя» — «постился семь дней, стеная и плача»; «уриил ангел» — «ангел Уриил»."
  21: "«помышления сердца моего трудна бяху мне зело» — «помышления сердца моего были мне весьма тягостны»."
  22: "«восприя душа моя дух разума» — «душа моя приняла дух разумения»; «начах глаголати пред вышним словеса» — «начал говорить пред Всевышним слова»."
  23: "«от всех дубрав земли... избрал еси виноград един» — «из всех дубрав земли... Ты избрал одну виноградную лозу»."
  24: "«от всего круга земнаго избрал еси себе юдоль едину» — «из всего круга земного избрал Себе одну долину»; «от всех цветов вселенныя... крин един» — «из всех цветов вселенной... одну лилию». ru: «одну пещеру» — иное чтение, в текст не внесено."
  25: "«от всех бездн морских исполнил еси себе источник един» — «из всех морских пучин наполнил Себе один источник»; «от всех созданных градов освятил еси себе сион» — «из всех построенных городов освятил Себе Сион»."
  26: "«от всех сотворений летающих именовал еси себе голубицу едину» — «из всех сотворённых птиц Ты назвал Себе одну голубицу»; «от всех сотворенных скотов промыслил еси себе овцу едину» — «из всех сотворённых скотов Ты предусмотрел Себе одну овцу»."
  27: "«от всех умноженных людий взыскал еси себе народ един» — «из всех многочисленных народов Ты взыскал Себе один народ»; «от всех искушен закон дал еси сим» — «из всех испытанный закон дал Ты им» (то есть превосходный, испытанный). ru: «дал ему закон совершенный»."
  28: "«вскую предал еси единаго многим» — «зачем Ты предал одного многим»; «уготовал еси на един корень многи иныя» — «на одном корне Ты приготовил многие другие»; «расточил еси един твой во многи» — «рассеял единственный Твой между многими»."
  29: "«потопташа его, иже противу глаголаша обетованием твоим» — «попрали его те, кто говорил против обетований Твоих»; «иже твоим заветом не вероваху» — «кто не веровал Твоим заветам»."
  30: "«аще ненавидящь возненавидел еси люди твоя, твоими руками долженствуют наказатися» — «если, возненавидев, Ты возненавидел народ Твой, то пусть он будет наказан Твоими руками» (усиление: «ненавидя ненавидел»)."
  31: "«послан есть ангел ко мне, иже прежде прииде ко мне в прешедшую нощь» — «послан был ко мне ангел, приходивший прежде в прошедшую ночь»."
  32: "«послушай мя, и научу тя: и вонми ми, и предложу пред тобою» — «послушай меня, и научу тебя; внимай мне, и предложу пред тобою»."
  33: "«зело ты во ужасе ума сотворился еси ради израиля» — «ты пришёл в великое недоумение ума ради Израиля»; «или паче возлюбил еси его, неже сотворивый его?» — «или больше любишь его, чем Сотворивший его?». ru: «ты слишком далеко зашёл пытливостью ума твоего»."
  34: "«болящь глаголал есмь» — «я говорил, болея (от скорби)»; «мучат бо мя лядвия моя по вся часы» — «ибо мучают меня чресла мои всякий час»; «изследовати часть суда его» — «исследовать хотя часть суда Его»."
  35: "«не можеши» — «не можешь»; «почто родихся? или вскую не сотворися утроба матере моея мне гроб» — «зачем я родился? или почему утроба матери моей не сделалась мне гробом»; «труда иаковля и изнеможения рода израилева» — «труда Иакова и изнеможения рода Израилева»."
  36: "«сочти ми сия, яже еще не приидоша» — «исчисли мне то, что ещё не пришло»; «собери ми разсеянныя капли» — «собери мне рассеянные капли»; «озелени ми сухия цветы» — «озелени мне сухие цветы»."
  37: "«отверзи ми запертая хранилища» — «открой мне запертые хранилища»; «изведи ми заключенныя в них ветры» — «выведи мне заключённые в них ветры»; «покажи ми гласа образ» — «покажи мне образ голоса»."
  38: "«кто бо есть, иже может сия ведети, разве той, иже с человеки обитания не имать?» — «кто может знать это, кроме Того, Кто не имеет обитания с людьми?»."
  39: "«аз же безумен» — «я же безумен»; «о нихже мене вопросил еси» — «о которых Ты меня спросил»."
  40: "«якоже не можеши сотворити едино от сих... тако не можеши обрести суда моего» — «как не можешь сделать одного из сего... так не можешь постичь суда Моего»; «или в конец любве, юже людем обещах» — «или предел любви, которую Я обещал народу»."
  41: "«ты близ еси сих, иже при концы суть» — «Ты близок к тем, кто при конце»; «что сотворят, иже прежде мене быша, или мы, или иже последи нас?» — «что сделают бывшие прежде меня, или мы, или которые после нас?»."
  42: "«венцу уподоблю суд мой» — «уподоблю суд Мой венцу» (круг без начала и конца); «якоже не последних умедление, тако ниже первых ускорение» — «как нет замедления у последних, так нет и ускорения у первых»."
  43: "«не могл ли еси сотворити сих... вкупе» — «не мог ли Ты сотворить всех их вместе»; «дабы скорее суд твой показал еси» — «чтобы скорее показать суд Твой»; «сеорее» — форма вместо «скорее»."
  44: "«не может ускорити творение над творца» — «не может творение опередить творца»; «ниже снести век сих, иже в нем творими суть вкупе» — «ни век сей не может понести тех, кто в нём творится вместе»."
  45: "«оживляя оживил еси... творение во едино, и сносило творение» — «оживотворяя, Ты оживотворил созданное Тобою воедино, и творение понесло это»; «может и ныне носити настоящих во едино» — «может и ныне понести нынешних воедино»."
  46: "«вопроси ложесн женских» — «спроси женскую утробу»; «аще родиши, вскую по времени?» — «если рождаешь, почему по временам?»; «да родит десять во едино» — «чтобы родила десять вдруг». Слова, которые надо сказать женщине, — 『…』."
  47: "«не может, но по времени» — «не может, но по временам»."
  48: "«и аз дах ложесна земли сим, иже посеяни суть на ней по времени» — «и Я дал утробу земли тем, кто посеян на ней, по временам»."
  49: "«имже бо образом младенец не родит тех, яже старых суть» — «как младенец не рождает того, что свойственно старым»; «тако аз устроих... век» — «так Я устроил... век»."
  50: "«понеже уже даеши ми путь, возглаголю пред тобою» — «так как Ты уже даёшь мне путь, буду говорить пред Тобою»; «мати наша... еще млада есть, а уже к старости приближается» — «мать наша... ещё молода, а уже приближается к старости». ru превращает в вопрос, в тексте по слав. утверждение."
  51: "«вопроси тоя, яже родит, и речет тебе» — «спроси рождающую, и она скажет тебе». Речь ангела продолжается до ст. 55."
  52: "«вскую, коих родила еси, ныне не суть подобни тем, иже прежде тебе, но менши возрастом?» — «почему рождённые тобою ныне не подобны тем, что прежде тебя, но меньше ростом?»."
  53: "«инии суть, иже в юности силы рождени суть» — «одни рождены в юности силы»; «под время старости оскудевающим ложеснам родишася» — «другие родились под старость, когда утроба оскудела». Слова женщины — 『…』."
  54: "«разумен убо и ты, яко менши возрастом есте от тех, иже прежде вас» — «уразумей и ты, что вы меньше ростом тех, кто прежде вас»."
  55: "«иже последи вас, менши неже вы» — «кто после вас — меньше вас»; «аки уже стареющаяся творения, и крепость юности преминующая» — «как уже стареющее творение, и крепость юности миновавшая»."
  56: "«имже посетиши творение твое» — «кем (через кого) Ты посещаешь творение Твоё»; ru: «через кого Ты посещаешь творение Твое?» — тот же смысл."
