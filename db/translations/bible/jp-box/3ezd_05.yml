# jp-box, 3-я Ездры, глава 5. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте (gr-lxx-byz) книги нет;
# ru (Синодальный) — только для понимания, не источник; у ru другое деление стихов,
# сверка по содержанию. Нумерация — славянская. Язык — современный 常体; 〔…〕 нет;
# сносок ⟨…⟩ нет. Красного и синего в Ветхом Завете нет.
# jp-joc в книге нет; jp-ni не использовался.
#
# Содержание: 1–13 знамения последних времён (третья труба, кровь из дерева,
# говорящий камень, Содомское море, помрачение ума); 14–15 Ездра приходит в себя;
# 16–19 Салафиил зовёт его вкусить хлеба и не оставлять народ, Ездра отсылает его;
# 20–22 семидневный пост и молитва; 23–30 молитва о народе: виноград, юдоль, лилия,
# источник, Сион, голубица, овца, народ — «зачем предал еси единаго многим»;
# 31–40 явление Уриила: «ты не можешь» — сочти грядущее, собери капли, озелени цветы;
# 41–49 притча о венце, о море и о жене, рождающей по времени;
# 50–55 мать наша состарилась, поздние меньше ростом; 56 просьба показать, кем посещает.
# Голоса: 1–13 — 「…」 (продолжение речи ангела, начатой в 4:52); 16–18 — речь
# Салафиила 「…」; 19 — ответ Ездры 「…」; 23–30 — молитва 「…」; далее диалог:
# ангел — 32, 33 (вопрос), 35 (первое слово), 36–37, 40, 42, 44, 46, 48–49, 51–55;
# Ездра — 33 (ответ), 34, 35 (второе слово), 38–39, 41, 43, 45, 47, 50, 56.
# В 46 слова, которые надо сказать женщине, — 『…』; в 52–53 её слова — 『…』.
# Слав. «(глаголющь)» и подобные редакционные скобки не переносились.
# Имена: エズラ, サラティエル, ウリエル — по брифу. Новые: ソドムの海 (Мёртвое море).

