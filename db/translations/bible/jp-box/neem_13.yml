# jp-box, Неемия, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста (новый паритет, docs/japanese-bible.md):
# слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление
# на клаузы — по греческому.
# Глава 13: отделение иноплеменников по закону (1–3); Товия в кладовой
# и изгнание его (4–9); удержание десятин и содержания левитам (10–14);
# нарушение субботы и её охрана (15–22); смешанные браки, обличение
# и изгнание зятя Санаваллата (23–29); итог очищения (30–31).
# Речь — 「…」: 11, 17–18, 21, 25; 26–27 — продолжение той же речи.
# Красного нет.
# Нумерация по gr: 31 стих, совпадает с csl/ru.
# 〔…〕 нет: на месте всех стихов есть текст.
# Сносок ⟨…⟩ нет: 会衆, 律法, 安息日, 大祭司, 契約, 十分の一, 初穂 уже в корпусе.
# jp-ni не использовался.

