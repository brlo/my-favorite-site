verses:
  1: "その日[ひ]、モーセの書[しょ]が民[たみ]の耳[みみ]に読[よ]み聞[き]かされ、その中[なか]に、アンモン人[じん]とモアブ人[じん]は永遠[えいえん]に神[かみ]の会衆[かいしゅう]に入[はい]ってはならない、と書[か]かれているのが見[み]つかった。"
  2: "彼[かれ]らはパンと水[みず]をもってイスラエルの子[こ]らを迎[むか]えず、かえってバラムを雇[やと]って彼[かれ]らを呪[のろ]わせた。しかし、われらの神[かみ]はその呪[のろ]いを祝福[しゅくふく]に変[か]えられた。"
  3: "律法[りっぽう]が読[よ]まれるのを聞[き]くと、彼[かれ]らはイスラエルのすべての混[こん]ざった者[もの]たちを分[わ]け離[はな]した。"
  4: "これより前[まえ]、祭司[さいし]エリアシブは、われらの神[かみ]の家[いえ]の倉[くら]の一[ひと]つに住[す]んでいて、トビヤの縁者[えんじゃ]であった。"
  5: "彼[かれ]はトビヤのために大[おお]きな倉[くら]を造[つく]った。そこには以前[いぜん]、供[そな]え物[もの]、乳香[にゅうこう]、器[うつわ]、およびレビ人[びと]、歌[うた]い手[て]、門衛[もんえい]のために定[さだ]められた小麦[こむぎ]とぶどう酒[しゅ]、油[あぶら]の十分[じゅうぶん]の一[いち]、祭司[さいし]たちの初穂[はつほ]が納[おさ]められていた。"
  6: "しかし、これらのことのすべての間[あいだ]、私[わたし]はエルサレムにいなかった。バビロンの王[おう]アルタシャスタの第三十二[だいさんじゅうに]年[ねん]に、私[わたし]は王[おう]のところへ行[い]ったからである。そして幾日[いくにち]かが過[す]ぎた後[あと]、私[わたし]は王[おう]に願[ねが]い出[で]た。"
  7: "そしてエルサレムに帰[かえ]り、エリアシブがトビヤのために神[かみ]の家[いえ]の庭[にわ]に倉[くら]を造[つく]って行[おこな]った悪[あく]を悟[さと]った。"
  8: "それは私[わたし]には非常[ひじょう]に悪[わる]いことと思[おも]われたので、私[わたし]はトビヤの家[いえ]のすべての器[うつわ]を倉[くら]の外[そと]に投[な]げ出[だ]した。"
  9: "そして命[めい]じて倉[くら]を清[きよ]めさせ、神[かみ]の家[いえ]の器[うつわ]、供[そな]え物[もの]、乳香[にゅうこう]をそこに戻[もど]した。"
  10: "また、レビ人[びと]たちへの分[ぶん]が与[あた]えられていないことを知[し]った。レビ人[びと]たちと、務[つと]めに当[あ]たっていた歌[うた]い手[て]たちは、それぞれ自分[じぶん]の畑[はたけ]へ帰[かえ]ってしまっていた。"
  11: "私[わたし]は長官[ちょうかん]たちと争[あらそ]って言[い]った。「なぜ神[かみ]の家[いえ]は見捨[みす]てられたのか。」そして彼[かれ]らを集[あつ]め、もとの務[つと]めの場所[ばしょ]に立[た]たせた。"
  12: "ユダのすべての人[ひと]々[びと]は、小麦[こむぎ]、ぶどう酒[しゅ]、油[あぶら]の十分[じゅうぶん]の一[いち]を倉[くら]に運[はこ]び込[こ]んだ。"
  13: "そして倉[くら]を、祭司[さいし]シェレミヤ、律法学者[りっぽうがくしゃ]サドク、レビ人[びと]のうちのフェダイヤの手[て]に任[まか]せ、彼[かれ]らの手[て]の下[もと]にハナン、すなわちザクルの子[こ]、マタニヤの子[こ]を任[にん]じた。彼[かれ]らは忠実[ちゅうじつ]な者[もの]と認[みと]められ、その兄弟[きょうだい]たちに分[わ]け与[あた]える務[つと]めを負[お]ったからである。"
  14: "わが神[かみ]よ、このことのために私[わたし]を覚[おぼ]えていてください。私[わたし]がわが主[しゅ]なる神[かみ]の家[いえ]とその務[つと]めの組[くみ]のために行[おこな]った慈[いつく]しみを忘[わす]れないでください。"
  15: "そのころ、私[わたし]はユダで、安息日[あんそくび]に酒[さけ]ぶどうを搾[しぼ]り、束[たば]を運[はこ]び、ろばにぶどう酒[しゅ]、ぶどうの房[ふさ]、いちじく、あらゆる荷[に]をくくりつけて、安息日[あんそくび]にエルサレムへ運[はこ]んでいる者[もの]たちを見[み]た。私[わたし]は彼[かれ]らが売[う]り買[か]いする日[ひ]に、彼[かれ]らを戒[いまし]めた。"
  16: "またティルス人[じん]がそこに住[す]み、魚[さかな]やあらゆる商品[しょうひん]を運[はこ]んで来[き]て、安息日[あんそくび]にユダの子[こ]らとエルサレムの人[ひと]々[びと]に商[あきな]っていた。"
  17: "私[わたし]はユダのおもだった者[もの]たちと争[あらそ]って言[い]った。「あなたがたが行[おこな]っているこの悪[わる]い事[こと]は何[なん]だ。あなたがたは安息日[あんそくび]を汚[けが]しているではないか。"
  18: "あなたがたの父[ちち]たちも、そのようにしたではないか。それゆえ、われらの神[かみ]はこのすべての災[わざわ]いを、彼[かれ]らの上[うえ]にも、われわれの上[うえ]にも、この町[まち]の上[うえ]にも下[くだ]された。それなのに、あなたがたは安息日[あんそくび]を汚[けが]して、イスラエルの上[うえ]に憤[いきどお]りを加[くわ]えている。」"
  19: "エルサレムの門[もん]に安息日[あんそくび]の前[まえ]の影[かげ]がさすと、私[わたし]は命[めい]じて門[もん]をしめさせ、安息日[あんそくび]が過[す]ぎるまで開[ひら]かないように言[い]った。また、私[わたし]の若[わか]い者[もの]たちのうちから幾人[いくにん]かを門[もん]のところに配置[はいち]して、安息日[あんそくび]に荷[に]を運[はこ]び込[こ]まないようにさせた。"
  20: "商人[しょうにん]たちは皆[みな]、エルサレムの外[そと]に一度[いちど]また二度[にど]と宿[やど]をとって、商[あきな]いをした。"
  21: "私[わたし]は彼[かれ]らを戒[いまし]めて言[い]った。「なぜあなたがたは城壁[じょうへき]の前[まえ]にたむろしているのか。もう一度[いちど]そうしたなら、私[わたし]はあなたがたに手[て]をかける。」その時[とき]から、彼[かれ]らは安息日[あんそくび]には来[こ]なくなった。"
  22: "また私[わたし]は、身[み]を清[きよ]めたレビ人[びと]たちに、門[もん]を守[まも]るために来[き]て、安息日[あんそくび]を聖[せい]なる日[ひ]として聖別[せいべつ]するように命[めい]じた。わが神[かみ]よ、このことのゆえに私[わたし]を覚[おぼ]え、あなたの慈[いつく]しみの多[おお]さに従[したが]って私[わたし]を赦[ゆる]してください。"
  23: "そのころ、私[わたし]は、アシュドドの女[おんな]たち、アンモン人[じん]の女[おんな]たち、モアブ人[じん]の女[おんな]たちを妻[つま]に迎[むか]えたユダの人[ひと]々[びと]を見[み]た。"
  24: "彼[かれ]らの子[こ]どもたちは、その半分[はんぶん]がアシュドドの言葉[ことば]を話[はな]し、ユダの言葉[ことば]を話[はな]すことができなかった。"
  25: "私[わたし]は彼[かれ]らと争[あらそ]い、彼[かれ]らを呪[のろ]い、そのうちの幾人[いくにん]かにむちをふるい、彼[かれ]らの髪[かみ]をむしって、神[かみ]にかけて彼[かれ]らに誓[ちか]わせた。「あなたがたは自分[じぶん]の娘[むすめ]たちを彼[かれ]らの息子[むすこ]たちに与[あた]えてはならない。また、彼[かれ]らの娘[むすめ]たちを、あなたがたの息子[むすこ]たちや自分[じぶん]自身[じしん]のために娶[めと]ってはならない。」"
  26: "「イスラエルの王[おう]ソロモンも、そのように罪[つみ]を犯[おか]したではないか。多[おお]くの国々[くにぐに]のうちに、彼[かれ]に似[に]た王[おう]はなかった。彼[かれ]は神[かみ]に愛[あい]され、神[かみ]は彼[かれ]を全[すべ]てのイスラエルの上[うえ]の王[おう]とされた。しかし、外国[がいこく]の女[おんな]たちが彼[かれ]さえも迷[まよ]わせた。"
  27: "あなたがたの言[こと]を聞[き]き入[い]れて、われわれの神[かみ]に背[そむ]き、外国[がいこく]の女[おんな]たちを妻[つま]に迎[むか]えるという、このすべての悪[あく]を行[おこな]うべきだろうか。」"
  28: "大祭司[だいさいし]エリアシブの子[こ]ヨイアダの子[こ]の一人[ひとり]は、ホロン人[じん]サンバラトの婿[むこ]であった。私[わたし]は彼[かれ]を追放[ついほう]した。"
  29: "わが神[かみ]よ、彼[かれ]らが祭司[さいし]の職[しょく]と、祭司[さいし]とレビ人[びと]の契約[けいやく]を汚[けが]したことを覚[おぼ]えていてください。"
  30: "私[わたし]は彼[かれ]らをすべての異[い]国[こく]のものから清[きよ]め、祭司[さいし]たちとレビ人[びと]たちに、それぞれの務[つと]めに応[おう]じて組[くみ]を定[さだ]めた。"
  31: "また、定[さだ]められた時[とき]に薪[たきぎ]を納[おさ]めることと、初[はつ]物[もの]の捧[ささ]げ物[もの]も定[さだ]めた。わが神[かみ]よ、私[わたし]を良[よ]いことのために覚[おぼ]えていてください。"

notes:
  1: "ἀνεγνώσθη — было прочитано (ἀναγινώσκω). ἐν βιβλίῳ Μωυσῆ — в книге Моисея. ἐκκλησία θεοῦ — общество, собрание Божие, 会衆. ἕως αἰῶνος — до века, вечно."
  2: "συνήντησαν — встретили (συναντάω). ἐμισθώσαντο ἐπ᾽ αὐτὸν τὸν Βαλααμ — наняли против него Валаама (τοὺς υἱοὺς Ισραηλ). καταρᾶσθαι — проклясть. ἔστρεψεν … τὴν κατάραν εἰς εὐλογίαν — обратил проклятие в благословение."
  3: "ἐχωρίσθησαν — отделились (χωρίζω). πᾶς ἐπίμικτος — вся смесь, смешанное множество (слав. «всех чуждих»), т. е. иноплеменники в Израиле."
  4: "πρὸ τούτου — прежде сего. οἰκῶν ἐν γαζοφυλακίῳ — живущий в кладовой (γαζοφυλάκιον). ἐγγίων Τωβια — близкий Товии, родственник (слав. «сродник товиин»)."
  5: "μαναα — хлебное приношение (מִנְחָה), 供え物. λίβανος — ладан, 乳香. σκεύη — сосуды. δεκάτη — десятина. ἐντολή — установление. ἀπαρχαί — начатки."
  6: "ἐν παντὶ τούτῳ — при всём этом. ἔτος τριακοστὸν δεύτερον — тридцать второй год. Ἀρθασασθα — Артаксеркс (слав. «артаксеркса»). βασιλεὺς Βαβυλῶνος — царь Вавилонский. ᾐτησάμην παρὰ τοῦ βασιλέως — испросил у царя."
  7: "συνῆκα ἐν τῇ πονηρίᾳ — понял в зле, уразумел зло. αὐλή — двор."
  8: "πονηρόν μοι ἐφάνη σφόδρα — показалось мне весьма злым. ἔρριψα — выбросил (ῥίπτω). σκεύη οἴκου Τωβια — вещи дома Товии."
  9: "ἐκαθάρισαν — очистили. ἐπέστρεψα — возвратил. μαναα καὶ λίβανος — хлебное приношение и ладан."
  10: "μερίδες — части, доли содержания. οὐκ ἐδόθησαν — не были даны. ἐφύγοσαν — убежали (φεύγω). ἀνὴρ εἰς ἀγρὸν αὐτοῦ — каждый на поле своё."
  11: "ἐμαχεσάμην — я спорил, вознегодовал (μάχομαι). στρατηγοί — начальствующие, 長官. ἐγκατελείφθη — оставлен (ἐγκαταλείπω). ἐπὶ τῇ στάσει αὐτῶν — на месте, на стоянии их (στάσις)."
  12: "δεκάτη τοῦ πυροῦ — десятина пшеницы. θησαυροί — сокровищницы. Слав. в этом стихе добавляет назначение Шелемии, Садока и Федаии (в LXX оно в ст. 13); деление держим по LXX."
  13: "ἐπὶ χεῖρα — под руку, в ведение. γραμματεύς — книжник, 律法学者. πιστοὶ ἐλογίσθησαν — были сочтены верными. μερίζειν — разделять."
  14: "μνήσθητί μου — помяни меня. μὴ ἐξαλειφθῇ — да не изгладится. ἔλεός μου — милость моя, дела милосердия. Слав. добавляет «и в чинех его» (и в чредах его) — в LXX нет, внесено."
  15: "ληνοί — точила, давильни. δράγματα — снопы. ἐπιγεμίζοντας — навьючивающих. βάσταγμα — ноша, груз. ἐπεμαρτυράμην — я засвидетельствовал, предупредил. ἐν ἡμέρᾳ πράσεως αὐτῶν — в день продажи их."
  16: "ἰχθύς — рыба. πρᾶσις — продажа, товар. В LXX нет слова «тиряне»: καὶ ἐκάθισαν ἐν αὐτῇ — «и сели в нём»; слав. «тиряне обиташа в нем». Внесено по слав."
  17: "τοῖς υἱοῖς Ιουδα τοῖς ἐλευθέροις — сыновьям Иуды свободным, т. е. знатным (слав. «свободных»). βεβηλοῦτε — оскверняете (βεβηλόω)."
  18: "οὐχὶ οὕτως — не так ли. ἤνεγκεν ἐπ᾽ αὐτούς — навёл на них. προστίθετε ὀργήν — прилагаете гнев. βεβηλῶσαι τὸ σάββατον — осквернить субботу."
  19: "ἡνίκα κατέστησαν πύλαι — когда наступали (устанавливались) ворота, т. е. при наступлении темноты; слав. «егда поставишася врата». ὀπίσω τοῦ σαββάτου — после субботы. παιδάρια — слуги, отроки."
  20: "ηὐλίσθησαν — провели ночь (αὐλίζομαι). ἅπαξ καὶ δίς — раз и два."
  21: "διεμαρτυράμην — засвидетельствовал, предупредил. ἐὰν δευτερώσητε — если сделаете вторично. ἐκτενῶ τὴν χεῖρά μου — простру руку мою."
  22: "καθαριζόμενοι — очищаемые, очистившиеся. ἁγιάζειν τὴν ἡμέραν — освящать день. φεῖσαί μου — пощади меня. κατὰ τὸ πλῆθος τοῦ ἐλέους — по множеству милости."
  23: "Ἀζώτιοι — азотяне, жители Азота (アシュドド); слав. «азотския». Αμμανίτιδες, Μωαβίτιδες — аммонитянки, моавитянки."
  24: "ἥμισυ λαλοῦντες Ἀζωτιστί — наполовину говорящие по-азотски. Ἰουδαϊστί — по-иудейски. οὐκ … ἐπιγινώσκοντες — не умеющие."
  25: "κατηρασάμην — проклял. ἐπάταξα ἐν αὐτοῖς ἄνδρας — избил некоторых из них. ἐμαδάρωσα — обрил или вырвал волосы (μαδάω); слав. «оплеших». ὥρκισα — заклинал. Слав. добавляет «и себе» (и за себя) — в LXX нет, внесено."
  26: "ἥμαρτεν — согрешил. οὐκ ἦν βασιλεὺς ὅμοιος αὐτῷ — не было царя подобного ему. ἀγαπώμενος τῷ θεῷ — любимый Богом. ἐξέκλιναν — совратили (ἐκκλίνω)."
  27: "ἀσυνθετῆσαι — поступить вероломно (ἀσυνθετέω). καθίσαι γυναῖκας ἀλλοτρίας — взять жён чужих."
  28: "νυμφίος — зять, жених. Ωρωνίτης — хоронит, из Хорона (ホロン). ἐξέβρασα — изгнал, выбросил (ἐκβράζω)."
  29: "ἐπὶ ἀγχιστείᾳ τῆς ἱερατείας — при родстве священства (ἀγχιστεία — родство, близость); слав. «за осквернение священства» — иное понимание. διαθήκη — завет."
  30: "ἀλλοτρίωσις — чуждое, иноплеменное. ἐφημερίαι — чреды. ἀνὴρ ὡς τὸ ἔργον αὐτοῦ — каждый по делу его."
  31: "ξυλοφόροι — дровоносы (ξυλοφόρος), те, кто доставляет дрова. βακχούρια — тёмное слово; слав. «первородных», Синод. «начатки»; передано как 初物. εἰς ἀγαθωσύνην — во благо."
