verses:
  1: "アヒトフェルはアブサロムに言[い]った。「わたしは今[いま]、一万二千人[いちまんにせんにん]の男[おとこ]たちを選[えら]び、立[た]って、夜[よる]のうちにダビデの後[あと]を追[お]いかけます。"
  2: "そして彼[かれ]に迫[せま]りましょう。彼は疲[つか]れ、手[て]が弱[よわ]っています。わたしが彼を恐[おそ]れさせれば、彼とともにいる民[たみ]はみな逃[に]げ出[だ]し、わたしは王[おう]ひとりを討[う]ちます。"
  3: "民[たみ]をすべてあなたのもとへ連[つ]れ戻[もど]します。ちょうど花嫁[はなよめ]が夫[おっと]のもとへ戻るように。あなたが求[もと]めておられるのは、ただ一人[ひとり]の男[おとこ]の命[いのち]だけです。民[たみ]はすべて平和[へいわ]になるでしょう。」"
  4: "この言葉[ことば]は、アブサロムの目[め]にも、イスラエルのすべての長老[ちょうろう]たちの目にも、良[よ]いものと映[うつ]った。"
  5: "アブサロムは言[い]った。「アルキ人[じん]フシャイも呼[よ]んでくれ。彼[かれ]の口[くち]から出[で]ることも聞[き]こう。」"
  6: "フシャイがアブサロムのもとへ入[はい]ると、アブサロムは彼[かれ]に言[い]った。「アヒトフェルはこう言[い]った。彼[かれ]の言葉[ことば]どおりにしようか。いやなら、あなたが言[い]ってくれ。」"
  7: "フシャイはアブサロムに言[い]った。「今度[こんど]ばかりは、アヒトフェルが与[あた]えた勧[すす]めは良[よ]くありません。」"
  8: "フシャイは言[い]った。「あなたは父上[ちちうえ]とその者[もの]たちが、ひどく強[つよ]く、子[こ]を奪[うば]われた野[の]の雌熊[めぐま]のように、また野の荒[あら]い猪[いのしし]のように、心[こころ]が激[はげ]しくなっているのを知[し]っておられます。父上はいくさ人[びと]で、民[たみ]を休[やす]ませることはありません。"
  9: "見[み]てください。彼[かれ]は今[いま]、どれか一[ひと]つの丘[おか]、あるいはどこか一つの場所[ばしょ]に身[み]を隠[かく]しています。彼らが真っ先にあなたがたを襲[おそ]うとき、それを聞[き]いた者[もの]が『アブサロムに従[したが]う民[たみ]に大[おお]きな打撃[だげき]があった』と言[い]うでしょう。"
  10: "そのときは、ライオンの心[こころ]のような心[こころ]を持[も]つ勇士[ゆうし]でさえ、すっかり気[き]を失[うしな]ってしまいます。イスラエルはすべて、あなたの父上[ちちうえ]が強[つよ]く、ともにいる者[もの]たちが勇士[ゆうし]であることを知[し]っているからです。"
  11: "そこで、わたしはこう勧[すす]めます。ダンからベエル・シェバまで、イスラエルをすべて、海[うみ]の砂[すな]のように多[おお]くあなたのもとへ集[あつ]め、あなた自[みずか]らが彼[かれ]らの真[ま]ん中[なか]を進[すす]まれるのです。"
  12: "そして、彼[かれ]が見[み]つかるどこか一つの場所[ばしょ]へ行[い]き、地[ち]に降[ふ]りる露[つゆ]のように彼[かれ]の上[うえ]に陣[じん]を敷[し]きましょう。彼にも、彼とともにいる者[もの]たちにも、一人[ひとり]も残[のこ]しません。"
  13: "もし彼が町[まち]に集[あつ]まったなら、イスラエルはすべてその町に綱[つな]を持[も]って来[き]て、谷川[たにがわ]までその町を引[ひ]き倒[たお]しましょう。そこには石[いし]一つ残[のこ]りません。」"
  14: "アブサロムとイスラエルのすべての者[もの]は言[い]った。「アルキ人[じん]フシャイの勧[すす]めは、アヒトフェルの勧めよりも良[よ]い。」主[しゅ]はアヒトフェルの良[よ]い勧めを打[う]ち砕[くだ]くよう命[めい]じておられた。主[しゅ]がアブサロムにすべての災[わざわ]いを下[くだ]すためであった。"
  15: "アルキ人[じん]フシャイは祭司[さいし]たち、サドクとアビアタルに言[い]った。「アヒトフェルはアブサロムとイスラエルの長老[ちょうろう]たちにこうこう勧[すす]め、わたしはこうこう勧めました。"
  16: "今[いま]、すぐに人[ひと]を遣[つか]わしてダビデに告[つ]げなさい。『この夜[よる]、荒野[こうや]の平野[へいや]で夜[よ]を明[あ]かすな。急[いそ]いで渡[わた]れ。王[おう]と、ともにいる民[たみ]がすべて滅[ほろ]ぼされないように』と。」"
  17: "ヨナタンとアヒマアスはロゲルの泉[いずみ]のそばに立[た]っていた。女[おんな]の召[め]し使[つか]いが行[い]って彼[かれ]らに告[つ]げ、彼らは行ってダビデ王[おう]に告げた。彼らは町[まち]に入[はい]って姿[すがた]を見[み]せることができなかったからである。"
  18: "一人[ひとり]の若者[わかもの]が彼[かれ]らを見[み]て、アブサロムに告[つ]げた。二人[ふたり]は急[いそ]いで行[い]き、バフリムのある人[ひと]の家[いえ]に入[はい]った。その人の庭[にわ]には井戸[いど]があり、二人はそこに降[お]りた。"
  19: "女[おんな]は覆[おお]いを取[と]って井戸[いど]の口[くち]に広[ひろ]げ、その上[うえ]に穀物[こくもつ]をまき散[ち]らした。こうして何[なに]も知[し]られなかった。"
  20: "アブサロムの若者[わかもの]たちが女[おんな]の家[いえ]へ来[き]て言[い]った。「アヒマアスとヨナタンはどこにいる。」女は彼[かれ]らに言った。「水[みず]を少[すこ]し渡[わた]りました。」彼らは探[さが]したが見[み]つからず、エルサレムへ帰[かえ]った。"
  21: "彼[かれ]らが去[さ]った後[あと]、二人[ふたり]は井戸[いど]から上[あ]がり、行[い]ってダビデ王[おう]に告[つ]げた。そしてダビデに言った。「立[た]って、急[いそ]いで水[みず]を渡[わた]ってください。アヒトフェルがあなたがたについて、あのように勧[すす]めたからです。」"
  22: "ダビデと、彼[かれ]とともにいる民[たみ]はすべて立[た]ち、朝[あさ]の光[ひかり]までにヨルダン川[がわ]を渡[わた]った。渡らなかった者[もの]は一人[ひとり]もいなかった。"
  23: "アヒトフェルは、自分[じぶん]の勧[すす]めが行[おこな]われなかったのを見[み]ると、ろばに鞍[くら]を置[お]いて立[た]ち、自分[じぶん]の町[まち]の家[いえ]へ帰[かえ]った。そして家[いえ]の者[もの]たちに遺言[ゆいごん]をし、首[くび]を吊[つ]って死[し]に、父[ちち]の墓[はか]に葬[ほうむ]られた。"
  24: "ダビデはマハナイムへ行[い]った。アブサロムは、イスラエルのすべての者[もの]とともにヨルダン川[がわ]を渡[わた]った。"
  25: "アブサロムはヨアブに代[か]えてアマサを軍[ぐん]の長[ちょう]とした。アマサは、イエフェルという名[な]のイスラエル人[じん]の男[おとこ]の子[こ]であった。その男は、ヨアブの母[はは]であるツルヤの妹[いもうと]、エッサイの娘[むすめ]アビガイルのところへ入[はい]った者[もの]である。"
  26: "イスラエルとアブサロムはギレアドの地[ち]に陣[じん]を敷[し]いた。"
  27: "ダビデがマハナイムへ来[き]たとき、アンモン人[じん]のラバからナアスの子[こ]ウエスビが、ロダバルからアミエルの子[こ]マキルが、ロゲリムからギレアド人[じん]バルジライが来[き]ていた。"
  28: "彼[かれ]らは寝台[しんだい]十[じゅう]台[だい]と敷[し]き物[もの]、鍋[なべ]十[じゅう]個[こ]、土[つち]の器[うつわ]を運[はこ]んできた。また小麦[こむぎ]、大麦[おおむぎ]、粉[こな]、ひき割[わ]り、そら豆[まめ]、レンズ豆[まめ]も運[はこ]んできた。"
  29: "また蜂蜜[はちみつ]、バター、羊[ひつじ]、牛[うし]のチーズを運[はこ]んできて、ダビデと、彼[かれ]とともにいる民[たみ]に食[た]べるために差[さ]し出[だ]した。彼らは言[い]った。「民[たみ]は荒野[こうや]で飢[うえ]え、疲[つか]れ、渇[かわ]いている」と。"

notes:
  1: "Ἐπιλέξω δὴ ἐμαυτῷ — «изберу же себе» (δή — усилительная частица). δώδεκα χιλιάδας ἀνδρῶν — двенадцать тысяч мужей. καταδιώξω ὀπίσω Δαυιδ τὴν νύκτα — «погонюсь за Давидом ночью»."
  2: "ἐπελεύσομαι ἐπ᾽ αὐτόν — «нападу на него» (ἐπέρχομαι). κοπιῶν καὶ ἐκλελυμένος χερσίν — «трудящийся и ослабевший руками» (слав. «утружден и ослаблен руками»). ἐκστήσω αὐτόν — «приведу его в страх» (ἐξίστημι). πατάξω ... μονώτατον — «поражу... единственного», одного."
  3: "ὃν τρόπον ἐπιστρέφει ἡ νύμφη πρὸς τὸν ἄνδρα αὐτῆς — «как возвращается невеста к мужу своему». πλὴν ψυχὴν ἑνὸς ἀνδρὸς σὺ ζητεῖς — «только душу одного мужа ты ищешь». παντὶ τῷ λαῷ ἔσται εἰρήνη — «всему народу будет мир»."
  4: "εὐθής — «прямой»; в контексте «угодный, приемлемый» (слав. «угодно бысть»). ἐν ὀφθαλμοῖς — «в глазах», обычная формула оценки."
  5: "τὸν Χουσι τὸν Αραχι — Хусий Арахитянин (в 16:16 — Αρχι, тот же этникон); слав. «хусиа арахиина». καί γε αὐτοῦ — «и его самого», т. е. его мнение."
  6: "κατὰ τὸ ῥῆμα τοῦτο — «по слову этому». εἰ ποιήσομεν κατὰ τὸν λόγον αὐτοῦ — «сделаем ли по слову его?». εἰ δὲ μή, σὺ λάλησον — «если же нет, ты говори». Содержание совета Ахитофела передано косвенно, поэтому слова Авессалома даны без вложенной речи."
  7: "Οὐκ ἀγαθὴ αὕτη ἡ βουλή — «не хорош этот совет». τὸ ἅπαξ τοῦτο — «на этот раз» (букв. «этот один раз»); слав. «единою сие». Речь Хусия продолжается до ст. 13."
  8: "δυνατοὶ σφόδρα — «весьма сильны». κατάπικροι τῇ ψυχῇ — «горьки душою», т. е. раздражены, ожесточены. ὡς ἄρκος ἠτεκνωμένη ἐν ἀγρῷ — «как медведица, лишённая детёнышей, в поле» (ἄρκος — медведица). ὗς τραχεῖα — дикая, свирепая свинья. ἀνὴρ πολεμιστής — муж воинственный. οὐ μὴ καταλύσῃ τὸν λαόν — «не даст покоя народу» (καταλύω — останавливаться на ночлег)."
  9: "ἐν ἑνὶ τῶν βουνῶν — «в одном из холмов». ἔσται ἐν τῷ ἐπιπεσεῖν αὐτοῖς ἐν ἀρχῇ — «будет, когда они нападут на них в начале». θραῦσις — «поражение, сокрушение» (слав. «сокрушение»). Слова народа переданы вложенной речью 『…』."
  10: "υἱὸς δυνάμεως — «сын силы», т. е. храбрец. ἡ καρδία καθὼς ἡ καρδία τοῦ λέοντος — «сердце как сердце льва». τηκομένη τακήσεται — «растаяв, растает» (τήκω), усилительная конструкция. οἱ μετ᾽ αὐτοῦ — «те, кто с ним»."
  11: "συμβουλεύων ἐγὼ συνεβούλευσα — «советуя, я посоветовал» (усилительный гебраизм). συναγόμενος συναχθήσεται — «собираясь, соберётся». ἀπὸ Δαν καὶ ἕως Βηρσαβεε — «от Дана и до Вирсавии». ὡς ἡ ἄμμος ἡ ἐπὶ τῆς θαλάσσης — «как песок при море». τὸ πρόσωπόν σου πορευόμενον ἐν μέσῳ αὐτῶν — «лицо твоё, идущее посреди них», т. е. ты сам пойдёшь с ними."
  12: "ἥξομεν πρὸς αὐτὸν εἰς ἕνα τῶν τόπων — «придём к нему в одно из мест». παρεμβαλοῦμεν ἐπ᾽ αὐτόν — «расположимся станом против него» (παρεμβάλλω). ὡς πίπτει ἡ δρόσος ἐπὶ τὴν γῆν — «как падает роса на землю». οὐχ ὑπολειψόμεθα — «не оставим» (ὑπολείπω)."
  13: "σχοινία — верёвки. συροῦμεν αὐτὴν ἕως εἰς τὸν χειμάρρουν — «стащим его до потока» (σύρω). ὅπως μὴ καταλειφθῇ ... μηδὲ λίθος — «чтобы не осталось там ни одного камня»."
  14: "Ἀγαθὴ ἡ βουλὴ Χουσι ... ὑπὲρ τὴν βουλὴν Αχιτοφελ — «хорош совет Хусия более совета Ахитофела» (ὑπέρ — лучше). ἐνετείλατο διασκεδάσαι — «заповедал рассеять, разрушить» (διασκεδάννυμι). ὅπως ἂν ἐπαγάγῃ κύριος ... τὰ κακὰ πάντα — «чтобы навёл Господь все бедствия»."
  15: "Οὕτως καὶ οὕτως — «так и так» (сокращённая передача содержания совета). Садок и Авиафар — священники при Давиде. Речь продолжается в ст. 16."
  16: "μὴ αὐλισθῇς — «не ночуй» (αὐλίζομαι). ἐν αραβωθ τῆς ἐρήμου — «на равнинах пустыни» (арава — пустынная равнина); слав. «во аравофе пустыни». διαβαίνων σπεῦσον — «переходя, поспеши». μήποτε καταπίῃ τὸν βασιλέα — «как бы не поглотил царя» (καταπίνω)."
  17: "εἱστήκεισαν — стояли (плюсквамперфект ἵστημι). ἐν τῇ πηγῇ Ρωγηλ — у источника Рогель (слав. «на студенце рогили»). ἡ παιδίσκη — служанка. οὐκ ἐδύναντο ὀφθῆναι τοῦ εἰσελθεῖν — «не могли показаться, чтобы войти» в город."
  18: "παιδάριον — отрок, слуга. εἰς οἰκίαν ἀνδρὸς ἐν Βαουριμ — «в дом человека в Бауриме». λάκκος — яма, колодец, цистерна. ἐν τῇ αὐλῇ — во дворе. κατέβησαν — спустились (καταβαίνω)."
  19: "διεπέτασεν τὸ ἐπικάλυμμα ἐπὶ πρόσωπον τοῦ λάκκου — «растянула покрывало над лицом (устьем) колодца». ἔψυξεν ἐπ᾽ αὐτῷ αραφωθ — «высушила/рассыпала на нём арафоф»; αραφωθ — неясное слово (по ru — крупа); слав. оставил без перевода. οὐκ ἐγνώσθη ῥῆμα — «не стало известно слово», т. е. ничего не было заметно."
  20: "Ποῦ Αχιμαας καὶ Ιωναθαν — «где Ахимаас и Ионафан?». Παρῆλθαν μικρὸν τοῦ ὕδατος — «прошли немного воды» (слав. «преидоста вмале воду»). ἀνέστρεψαν εἰς Ιερουσαλημ — «возвратились в Иерусалим»."
  21: "ἐγένετο δὲ μετὰ τὸ ἀπελθεῖν αὐτούς — «было же после того, как они ушли». Ἀνάστητε καὶ διάβητε ταχέως τὸ ὕδωρ — «встаньте и перейдите быстро воду». οὕτως ἐβουλεύσατο περὶ ὑμῶν — «так посоветовал о вас»."
  22: "διέβησαν τὸν Ιορδάνην ἕως τοῦ φωτὸς τοῦ πρωί — «перешли Иордан до утреннего света». ἕως ἑνὸς οὐκ ἔλαθεν ὃς οὐ διῆλθεν — «до одного не остался (букв. не укрылся), кто не перешёл»."
  23: "ἐπέσαξεν τὴν ὄνον — «оседлал осла» (ἐπισάσσω; слав. «оседла осля свое»). ἐνετείλατο τῷ οἴκῳ αὐτοῦ — «распорядился домом своим» (о завещании). ἀπήγξατο — «удавился, повесился» (ἀπάγχω). ἐτάφη ἐν τῷ τάφῳ τοῦ πατρός — «погребён в гробе отца своего»."
  24: "Μαναιμ — Маханаим (слав. «манаим»). διέβη τὸν Ιορδάνην αὐτὸς καὶ πᾶς ἀνὴρ Ισραηλ μετ᾽ αὐτοῦ — «перешёл Иордан сам и всякий муж Израиля с ним»."
  25: "κατέστησεν ... ἀντὶ Ιωαβ ἐπὶ τῆς δυνάμεως — «поставил вместо Иоава над силой», т. е. над войском. Ἰοθορ ὁ Ισραηλίτης — Иофор Израильтянин (в слав. «иефер иезраилитин»); в тексте дано слав. имя. θυγατέρα Ναας — дочь Нааса (так в LXX); слав. «дщери иессеине» — «дочь Иессея», вероятно согласование с 1 Пар 2:16, чтение внесено в основной текст, вариант LXX отмечен здесь. ἀδελφὴν Σαρουιας μητρὸς Ιωαβ — сестра Саруи (ツルヤ), матери Иоава."
  26: "παρενέβαλεν — расположился станом (παρεμβάλλω). εἰς τὴν γῆν Γαλααδ — «в землю Галаад» (ギレアド)."
  27: "Ουεσβι υἱὸς Ναας ἐκ Ραββαθ υἱῶν Αμμων — Сови, сын Нааса, из Раввы Аммонитской (в слав. «уесвий»; ラバ, アンモン人). Μαχιρ υἱὸς Αμιηλ ἐκ Λωδαβαρ — Махир, сын Амиила, из Лодавара. Βερζελλι ὁ Γαλααδίτης ἐκ Ρωγελλιμ — Верзеллий Галаадитянин из Рогелима. В LXX перечисление продолжается в ст. 28 («принесли»), поэтому ст. 27 закончен самостоятельно, а ст. 28 начинается с «они»."
  28: "κοίτη — постель, ложе; ἀμφίταπος — двойное покрывало, ковёр (слав. «постели устроены»). λέβης — котёл. σκεύη κεράμου — глиняные сосуды. ἄλφιτον — крупа, толокно (слав. «пшено»). κύαμος — боб; φακός — чечевица."
  29: "μέλι, βούτυρον, πρόβατα, σαφφωθ βοῶν — мёд, масло (сливочное), овцы, коровьи сыры; σαφφωθ — неясное слово, понято как «сыры» (слав. «сыры кравия»). προσήνεγκαν — принесли. ὁ λαὸς πεινῶν καὶ ἐκλελυμένος καὶ διψῶν ἐν τῇ ἐρήμῳ — «народ голоден, утомлён и жаждет в пустыне»."
