# jp-box, 2-я Царств, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 17: совет Ахитофела — ночное нападение на Давида (1–4); Хусий призван,
# его совет собрать весь Израиль (5–14); весть Давиду через Садока и Авиафара,
# Ионатан и Ахимаас у источника Рогель, женщина в Бахуриме (15–22); смерть
# Ахитофела (23); Давид в Маханаиме, Авессалом переходит Иордан, Амаса вместо
# Иоава (24–26); помощь Сови, Махира и Верзеллия (27–29).
# Речи — 「…」: Ахитофел (1–3), Авессалом (5, 6), Авессалом и весь народ (14),
# Хусий (7–13, 15–16), женщина (20), вестники (21). Вложенная речь — 『…』:
# слова народа (9), весть Давиду (16).
# Нумерация по gr: 29 стихов, совпадает с csl/ru.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст; слав. чтения, которых
# нет в LXX (напр., «дщерь Иессеева» в ст. 25), внесены в основной текст без
# скобок, вариант LXX отмечен в notes.
# Сносок ⟨…⟩ нет: все термины (祭司, 長老, 陣, 天幕) уже в корпусе.
# Красного нет.
# jp-ni не использовался.

