# jp-box, Притчи, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в гл. 15 есть почти везде (кроме 5–6) — контроль церковного
# чтения. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: кроткий ответ и язык (1–4, 7, 23, 28), страх Господень (16, 33),
# наказание и обличение (5, 10, 12, 31–32), жертвы и молитвы нечестивых и праведных
# (8–9), бедность и довольство (15–17), дары и милостыня (27), всеведение Божие (3, 11).
# Прямой речи нет: все стихи — авторские изречения, кавычек нет.
# Нумерация по gr: 33 стиха. Дефект модуля: 15:31 стоит как «.» — переведён по csl
# («Слушаяй обличений живота…»), единственному свидетелю в модуле (то же чтение
# у jp-joc), без 〔…〕. Слав. 15:29 вбирает gr 15:29a и начало gr 15:30, поэтому
# слав. 15:30 = вторая половина нашего 15:30.
# Подстихи 5a, 18a, 27a, 28a, 29a в gr стоят при своих стихах (как и в csl);
# переведены в тех же стихах, стихи не дробились.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

