verses:
  1: "怒[いか]りは知恵[ちえ]ある者[もの]をも滅[ほろ]ぼす。しかし柔[やわ]らかな答[こた]えは憤[いきどお]りをそらし、きつい言葉[ことば]は怒[いか]りをかき立[た]てる。"
  2: "知恵[ちえ]ある者[もの]の舌[した]は良[よ]いことを知[し]っており、愚[おろ]かな者[もの]の口[くち]は悪[わる]いことを告[つ]げる。"
  3: "どこにでも主[しゅ]の目[め]はあり、悪[わる]い者[もの]も善[よ]い者[もの]も見張[みは]っている。"
  4: "舌[した]の癒[いや]しは命[いのち]の木[き]である。それを保[たも]つ者[もの]は霊[れい]に満[み]たされる。"
  5: "愚[おろ]かな者[もの]は父[ちち]の戒[いまし]めを嘲[あざけ]る。しかし掟[おきて]を守[まも]る者[もの]は賢[かしこ]い。正[ただ]しさが満ちあふれるところには大[おお]きな力[ちから]がある。しかし不敬[ふけい]な者[もの]は根[ね]こそぎ地[ち]から滅[ほろ]ぼされる。"
  6: "正[ただ]しい者[もの]の家[いえ]には大[おお]きな力[ちから]がある。しかし不敬[ふけい]な者[もの]の実[み]は滅[ほろ]びる。"
  7: "知恵[ちえ]ある者[もの]の唇[くちびる]はわきまえによって縛[しば]られ、愚[おろ]かな者[もの]の心[こころ]は確[たし]かでない。"
  8: "不敬[ふけい]な者[もの]のいけにえは主[しゅ]に忌[い]み嫌[きら]われ、直[ただ]しく歩[あゆ]む者[もの]の祈[いの]りは主に喜[よろこ]ばれる。"
  9: "不敬[ふけい]な者[もの]の道[みち]は主[しゅ]に忌[い]み嫌[きら]われ、正[ただ]しさを追[お]い求[もと]める者[もの]は主に愛[あい]される。"
  10: "無[む]垢[く]な者[もの]の戒[いまし]めは、行[ゆ]き交[か]う人[ひと]々[びと]によって知[し]られる。しかし叱[しか]りを憎[にく]む者[もの]は恥[は]ずかしい死[し]に終[お]わる。"
  11: "よみと滅[ほろ]びは主[しゅ]の前[まえ]に現[あらわ]である。まして人[ひと]の心[こころ]は言[い]うまでもない。"
  12: "無[む]教[きょう]養[よう]な者[もの]は自分[じぶん]を叱[しか]る者[もの]を愛[あい]さず、知恵[ちえ]ある者[もの]と語[かた]らうこともない。"
  13: "心[こころ]が喜[よろこ]ぶとき、顔[かお]は輝[かがや]く。しかし悲[かな]しみのうちにあるとき、顔は暗[くら]くなる。"
  14: "正[ただ]しい心[こころ]はわきまえを求[もと]め、無教養な者[もの]の口[くち]は悪[わる]いことを知[し]る。"
  15: "悪[わる]い者[もの]の目[め]はいつも災[わざわ]いを待[ま]ち望[のぞ]み、善[よ]い者[もの]はいつも静[しず]かである。"
  16: "主[しゅ]を恐[おそ]れることとともに持[も]つわずかな分[ぶん]は、恐れのない大[おお]きな宝[たから]よりも良[よ]い。"
  17: "野菜[やさい]の食事[しょくじ]でも愛[あい]と恵[めぐ]みがあれば、憎[にく]しみの伴[ともな]う牛[うし]のごちそうよりも良[よ]い。"
  18: "怒[いか]りやすい人[ひと]は争[あらそ]いを起[お]こし、怒りを遅[おそ]くする者[もの]は、これから起きる争いさえも鎮[しず]める。怒りを遅くする人は争いを消[け]し、不敬[ふけい]な者[もの]はいっそうこれをかき立[た]てる。"
  19: "怠[おこた]る者[もの]の道[みち]は茨[いばら]で敷[し]き詰[つ]められ、勇敢[ゆうかん]な者[もの]の道はよく踏[ふ]み固[かた]められている。"
  20: "知恵[ちえ]ある子[こ]は父[ちち]を喜[よろこ]ばせ、愚[おろ]かな子[こ]は母[はは]を嘲[あざけ]る。"
  21: "思慮[しりょ]のない者[もの]の小道[こみち]は分別[ふんべつ]に欠[か]けている。しかし分別ある者[もの]はまっすぐに歩[あゆ]む。"
  22: "集[つど]いを尊[とうと]ばない者[もの]は思[おも]いを後回[あとまわ]しにする。しかし相談[そうだん]する者[もの]の心[こころ]には計画[けいかく]が残[のこ]る。"
  23: "悪[わる]い者[もの]はその助言[じょげん]に聞[き]き従[したが]わず、共[とも]の益[えき]となる時宜[じぎ]にかなった善[よ]いことを語[かた]ることもない。"
  24: "思慮[しりょ]ある者[もの]の思[おも]いは命[いのち]の道[みち]であり、よみから離[はな]れて救[すく]われるためである。"
  25: "主[しゅ]は高慢[こうまん]な者[もの]の家[いえ]を打[う]ち倒[たお]し、寡婦[やもめ]の境界[きょうかい]を固[かた]くされる。"
  26: "不[ふ]正[せい]な思[おも]いは主[しゅ]に忌[い]み嫌[きら]われ、清[きよ]い者[もの]の言葉[ことば]は尊[とうと]い。"
  27: "賄賂[わいろ]を受[う]け取[と]る者[もの]は自分[じぶん]を滅[ほろ]ぼす。しかし贈[おく]り物[もの]を受けるのを憎[にく]む者[もの]は救[すく]われる。施[ほどこ]しと信[しん]実[じつ]によって罪[つみ]は清[きよ]められ、主[しゅ]を恐[おそ]れることによってすべての人[ひと]は悪[あく]から離[はな]れる。"
  28: "正[ただ]しい者[もの]の心[こころ]は信[しん]実[じつ]を思[おも]い、不敬[ふけい]な者[もの]の口[くち]は悪[わる]いことに答[こた]える。主[しゅ]の前[まえ]に正しい人[ひと]々[びと]の道[みち]は喜[よろこ]ばれ、それによって敵[てき]さえも友[とも]となる。"
  29: "神[かみ]は不敬[ふけい]な者[もの]から遠[とお]く離[はな]れておられ、正[ただ]しい者[もの]の祈[いの]りには耳[みみ]を傾[かたむ]けられる。少[すこ]しの受[う]け取[と]りでも正しさを伴[ともな]うほうが、多[おお]くの収穫[しゅうかく]に不[ふ]正[せい]が伴うより良[よ]い。"
  30: "人[ひと]は心[こころ]に正[ただ]しいことを思[おも]え。そうすれば、その歩[あゆ]みは神[かみ]によって直[なお]される。良[よ]いものを見[み]る目[め]は心を喜[よろこ]ばせる。良い評判[ひょうばん]は骨[ほね]を肥[こ]やす。"
  31: "命[いのち]へと導[みちび]く叱[しか]りを聞[き]こうとする耳[みみ]は、知恵[ちえ]ある者[もの]たちの間[あいだ]に住[す]む。"
  32: "戒[いまし]めを退[しりぞ]ける者[もの]は自分[じぶん]を憎[にく]み、叱[しか]りを心[こころ]に留[とど]める者[もの]は自分の魂[たましい]を愛[あい]している。"
  33: "神[かみ]を恐[おそ]れることは戒[いまし]めであり知恵[ちえ]である。栄光[えいこう]の始[はじ]めは、これに応[こた]える。"

notes:
  1: "ὀργὴ ἀπόλλυσιν καὶ φρονίμους — «гнев губит и разумных» (ἀπόλλυμι; φρόνιμος): в ru это предложение вынесено в скобки, у jp-joc его нет, но в gr и csl оно есть и переведено. ἀπόκρισις ὑποπίπτουσα ἀποστρέφει θυμόν — «уступающий, кроткий ответ отвращает ярость» (ὑποπίπτω — «поддаваться»; ἀποστρέφω; θυμός); λόγος λυπηρός ἐγείρει ὀργάς — «слово огорчающее возбуждает гнев» (λυπηρός; ἐγείρω)."
  2: "γλῶσσα σοφῶν καλὰ ἐπίσταται — «язык мудрых знает доброе» (ἐπίσταμαι); στόμα ἀφρόνων ἀναγγελεῖ κακά — «уста глупых возвестят злое» (ἀναγγέλλω)."
  3: "ἐν παντὶ τόπῳ ὀφθαλμοὶ κυρίου — «на всяком месте очи Господни»; σκοπεύουσιν κακούς τε καὶ ἀγαθούς — «наблюдают злых и добрых» (σκοπεύω)."
  4: "ἴασις γλώσσης δένδρον ζωῆς — «исцеление языка — древо жизни» (ἴασις); ὁ συντηρῶν αὐτὴν πλησθήσεται πνεύματος — «хранящий его исполнится духа» (συντηρέω; πνεῦμα — «дух»; слав. «Духа» с заглавной, в греч. без артикля, поэтому 霊 без уточнения). ru/MT: «необузданный — сокрушение духа» — иное чтение."
  5: "ἄφρων μυκτηρίζει παιδείαν πατρός — «глупый насмехается над наказанием отца» (μυκτηρίζω — «издеваться»; παιδεία); φυλάσσων ἐντολὰς πανουργότερος — «хранящий заповеди смышлёнее» (ἐντολή; πανουργότερος, сравн. ст.). Подстих 5a (ἐν πλεοναζούσῃ δικαιοσύνῃ ἰσχὺς πολλή, οἱ δὲ ἀσεβεῖς ὁλόρριζοι ἐκ γῆς ὀλοῦνται — «в преизбыточествующей правде сила многая, нечестивые же искоренятся с земли»; πλεονάζω; ὁλόρριζος) стоит при 15:5 и в csl в том же стихе; переведён здесь. 5a почти дословно повторяет 15:6 («в домах праведных сила многая») — дублет отмечен."
  6: "οἴκοις δικαίων ἰσχὺς πολλή — «в домах праведных сила многая» (ἰσχύς); καρποὶ ἀσεβῶν ἀπολοῦνται — «плоды нечестивых погибнут» (καρπός). Слав. «в домех праведных крепость многа». Стих — дублет подстиха 5a, см. notes 15:5."
  7: "χείλη σοφῶν δέδεται αἰσθήσει — «уста мудрых связаны пониманием» (δέω — «связывать»; αἴσθησις); καρδίαι ἀφρόνων οὐκ ἀσφαλεῖς — «сердца глупых не тверды» (ἀσφαλής). ru/MT и jp-joc: «уста мудрых распространяют знание» — масоретское чтение, не внесено."
  8: "θυσίαι ἀσεβῶν βδέλυγμα κυρίῳ — «жертвы нечестивых — мерзость Господу» (βδέλυγμα); εὐχαὶ κατευθυνόντων δεκταὶ παρ᾽ αὐτῷ — «молитвы правоходящих угодны Ему» (εὐχή — «молитва, обет»; слав. «обеты»; κατευθύνω)."
  9: "βδέλυγμα κυρίῳ ὁδοὶ ἀσεβοῦς — «мерзость Господу пути нечестивого»; διώκοντας δικαιοσύνην ἀγαπᾷ — «гонящих правду любит» (διώκω)."
  10: "παιδεία ἀκάκου γνωρίζεται ὑπὸ τῶν παριόντων — «наказание, воспитание незлобивого узнаётся проходящими» (γνωρίζω; παριών — «проходящий»); μισοῦντες ἐλέγχους τελευτῶσιν αἰσχρῶς — «ненавидящие обличения кончаются срамно» (τελευτάω; αἰσχρῶς). ru/MT: «злое наказание — уклоняющемуся от пути» — иное чтение."
  11: "ᾅδης καὶ ἀπώλεια φανερὰ παρὰ τῷ κυρίῳ — «ад и погибель явны пред Господом» (ᾅδης — よみ, как в Псалтири; ἀπώλεια); πῶς οὐχὶ καὶ αἱ καρδίαι τῶν ἀνθρώπων; — «как же не сердца человеческие?», риторический вопрос."
  12: "οὐκ ἀγαπήσει ἀπαίδευτος τοὺς ἐλέγχοντας αὐτόν — «не возлюбит невоспитанный обличающих его» (ἀπαίδευτος; ἐλέγχω); μετὰ σοφῶν οὐχ ὁμιλήσει — «с мудрыми не побеседует» (ὁμιλέω)."
  13: "καρδίας εὐφραινομένης πρόσωπον θάλλει — «когда сердце веселится, лицо цветёт» (θάλλω — «цвести»); ἐν λύπαις οὔσης σκυθρωπάζει — «когда в печалях — мрачнеет» (σκυθρωπάζω)."
  14: "καρδία ὀρθὴ ζητεῖ αἴσθησιν — «сердце правое ищет понимания» (αἴσθησις); στόμα ἀπαιδεύτων γνώσεται κακά — «уста невоспитанных познают злое» (γινώσκω)."
  15: "πάντα τὸν χρόνον οἱ ὀφθαλμοὶ τῶν κακῶν προσδέχονται κακά — «во всё время очи злых ожидают злого» (προσδέχομαι); οἱ ἀγαθοὶ ἡσυχάζουσιν διὰ παντός — «добрые безмолвствуют, пребывают в покое всегда» (ἡσυχάζω). ru/MT: «все дни несчастного печальны…» — иное чтение."
  16: "κρείσσων μικρὰ μερὶς μετὰ φόβου κυρίου — «лучше малая часть со страхом Господним» (μερίς); ἢ θησαυροὶ μεγάλοι μετὰ ἀφοβίας — «чем сокровища великие без страха Божия» (ἀφοβία)."
  17: "κρείσσων ξενισμὸς λαχάνων πρὸς φιλίαν καὶ χάριν — «лучше угощение овощами с дружбой и приязнью» (ξενισμός — «угощение»; λάχανον; φιλία; χάρις — 恵み (в кальке 恩寵); здесь «благоволение», слав. «благодать»). ἢ παράθεσις μόσχων μετὰ ἔχθρας — «чем поставление тельцов с враждой» (παράθεσις — «накрытый стол»; μόσχος)."
  18: "ἀνὴρ θυμώδης παρασκευάζει μάχας — «муж вспыльчивый готовит брани» (παρασκευάζω; μάχη); μακρόθυμος καὶ τὴν μέλλουσαν καταπραΰνει — «долготерпеливый и будущую укрощает» (μέλλουσαν — «предстоящую»). Подстих 18a (μακρόθυμος ἀνὴρ κατασβέσει κρίσεις, ὁ δὲ ἀσεβὴς ἐγείρει μᾶλλον — «долготерпеливый муж угасит распри, нечестивый же воздвигает более»; κατασβέννυμι; κρίσεις — «суды, распри») стоит при 15:18 и в csl в том же стихе; переведён здесь."
  19: "ὁδοὶ ἀεργῶν ἐστρωμέναι ἀκάνθαις — «пути праздных устланы терниями» (στρώννυμι; ἄκανθα); αἱ τῶν ἀνδρείων τετριμμέναι — «пути мужественных протоптаны, утрамбованы» (τρίβω)."
  20: "υἱὸς σοφὸς εὐφραίνει πατέρα — «сын мудрый веселит отца»; υἱὸς ἄφρων μυκτηρίζει μητέρα αὐτοῦ — «сын глупый насмехается над матерью своей» (μυκτηρίζω)."
  21: "ἀνοήτου τρίβοι ἐνδεεῖς φρενῶν — «стези безумного скудны ума» (τρίβος — «тропа»; ἐνδεής; φρήν); ἀνὴρ φρόνιμος κατευθύνων πορεύεται — «разумный, направляя путь, идёт» (κατευθύνω)."
  22: "ὑπερτίθενται λογισμούς — «отлагают помышления» (ὑπερτίθημι); οἱ μὴ τιμῶντες συνέδρια — «не чтущие собраний, советов» (συνέδριον); ἐν καρδίαις βουλευομένων μένει βουλή — «в сердцах советующихся пребывает совет» (βουλεύομαι; βουλή — 計画). ru/MT: «без совета предприятия расстроятся…» — иное чтение, не внесено."
  23: "οὐ μὴ ὑπακούσῃ ὁ κακὸς αὐτῇ — «не послушается злой её, то есть совета» (ὑπακούω): αὐτῇ жен. р., вероятно βουλή из ст. 22; οὐδὲ μὴ εἴπῃ καίριόν τι καὶ καλὸν τῷ κοινῷ — «и не скажет ничего благовременного и доброго для общего блага» (καίριος; κοινόν). Место тёмное; ru/MT и jp-joc: «радость человеку в ответе уст его…» — иное чтение, не внесено."
  24: "ὁδοὶ ζωῆς διανοήματα συνετοῦ — «пути жизни — помышления разумного» (διανόημα; συνετός); ἵνα ἐκκλίνας ἐκ τοῦ ᾅδου σωθῇ — «чтобы, уклонившись от ада, спастись» (ἐκκλίνω; σῴζω)."
  25: "οἴκους ὑβριστῶν κατασπᾷ κύριος — «домы надменных низвергает Господь» (ὑβριστής; κατασπάω); ἐστήρισεν ὅριον χήρας — «утвердил предел вдовы» (στηρίζω; ὅριον — 境界; χήρα)."
  26: "βδέλυγμα κυρίῳ λογισμὸς ἄδικος — «мерзость Господу помысел неправедный» (λογισμός); ἁγνῶν ῥήσεις σεμναί — «чистых речи честны, достойны» (ἁγνός; ῥῆσις; σεμνός)."
  27: "ἐξόλλυσιν ἑαυτὸν ὁ δωρολήμπτης — «губит себя берущий дары, мздоимец» (ἐξόλλυμι; δωρολήμπτης — «принимающий дары»); μισῶν δώρων λήμψεις σῴζεται — «ненавидящий принятие даров спасётся» (λῆμψις). Подстих 27a (ἐλεημοσύναις καὶ πίστεσιν ἀποκαθαίρονται ἁμαρτίαι, τῷ δὲ φόβῳ κυρίου ἐκκλίνει πᾶς ἀπὸ κακοῦ — «милостынями и верами очищаются грехи, страхом же Господним уклоняется всякий от зла»; ἐλεημοσύνη; ἀποκαθαίρω) стоит при 15:27 и в csl в том же стихе; переведён здесь."
  28: "καρδίαι δικαίων μελετῶσιν πίστεις — «сердца праведных поучаются вере, верности» (μελετάω; πίστις); στόμα ἀσεβῶν ἀποκρίνεται κακά — «уста нечестивых отвечают злое» (ἀποκρίνομαι). Подстих 28a (δεκταὶ παρὰ κυρίῳ ὁδοὶ ἀνθρώπων δικαίων, διὰ δὲ αὐτῶν καὶ οἱ ἐχθροὶ φίλοι γίνονται — «угодны пред Господом пути людей праведных, через них и враги становятся друзьями»; δεκτός; ἐχθρός) стоит при 15:28 и в csl в том же стихе; переведён здесь."
  29: "μακρὰν ἀπέχει ὁ θεὸς ἀπὸ ἀσεβῶν — «далеко отстоит Бог от нечестивых» (ἀπέχω); εὐχαῖς δικαίων ἐπακούει — «молитвам праведных внимает» (ἐπακούω). Подстих 29a (κρείσσων ὀλίγη λῆμψις μετὰ δικαιοσύνης ἢ πολλὰ γενήματα μετὰ ἀδικίας — «лучше малое приобретение с правдой, чем много жита с неправдой»; λῆμψις; γένημα) стоит при 15:29; слав. 15:29 вбирает также начало gr 15:30 («сердце мужа да мыслит праведная…»), поэтому слав. 15:30 = вторая половина нашего 15:30."
  30: "καρδία ἀνδρὸς λογιζέσθω δίκαια — «сердце человека да помышляет праведное» (λογίζομαι, импер. 3 л.); ἵνα ὑπὸ τοῦ θεοῦ διορθωθῇ τὰ διαβήματα αὐτοῦ — «чтобы от Бога исправлены были шаги его» (διορθόω; διαβήματα). θεωρῶν ὀφθαλμὸς καλὰ εὐφραίνει καρδίαν — «видящий глаз доброе веселит сердце» (θεωρέω); φήμη ἀγαθὴ πιαίνει ὀστᾶ — «добрая молва утучняет кости» (φήμη; πιαίνω)."
  31: "Дефект модуля: в gr-lxx-byz на месте стиха стоит «.», греческий текст утрачен. Переведено по csl-ru («Слушаяй обличений живота посреде премудрых водворится») — единственному свидетелю в модуле; jp-joc даёт то же церковное чтение («生命の敎誨を聽かんと欲する耳は智慧ある者の間に駐まる»). Греч. лексемы восстанавливаются лишь предположительно: ἔλεγχοι ζωῆς, «водворится» — κατασκηνοῖ; поэтому 〔…〕 не ставятся: стих церковный, а не добавка."
  32: "ὃς ἀπωθεῖται παιδείαν, μισεῖ ἑαυτόν — «отвергающий наказание ненавидит себя» (ἀπωθέω; μισεῖ); ὁ τηρῶν ἐλέγχους ἀγαπᾷ ψυχὴν αὐτοῦ — «хранящий обличения любит свою душу» (τηρέω; ἀγαπάω)."
  33: "φόβος θεοῦ παιδεία καὶ σοφία — «страх Божий — наказание и мудрость» (φόβος; παιδεία); ἀρχὴ δόξης ἀποκριθήσεται αὐτῇ — «начало славы ответит ей» (ἀποκρίνομαι — «отвечать»), место тёмное. Слав. «и начало славы отвещает ей (, предидет же смиренным слава)»: в скобках — добавка по МТ («славе предшествует смирение»), в LXX её нет и она не внесена; ru/MT и jp-joc читают только эту добавку."
