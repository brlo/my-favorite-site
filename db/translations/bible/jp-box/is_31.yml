verses:
  1: "エジプトへ下[くだ]って助[たす]けを求[もと]め、馬[うま]と戦車[せんしゃ]に頼[たの]む者[もの]たちは、災[わざわ]いだ。戦車は多[おお]く、馬も非常[ひじょう]に多[おお]いからである。彼[かれ]らはイスラエルの聖[せい]なる方[かた]に頼まず、神[かみ]を求[もと]めなかった。"
  2: "主[しゅ]ご自身[じしん]は知恵[ちえ]ある方[かた]で、彼[かれ]らの上[うえ]に災[わざわ]いを導[みちび]き入[い]れられる。その言葉[ことば]は決[けっ]して無[む]にされない。主は悪[わる]い人[ひと]々[びと]の家[いえ]に、また彼らのむなしい望[のぞ]みに立[た]ち向[む]かわれる。"
  3: "エジプト人[じん]は人[ひと]であって神[かみ]ではなく、馬[うま]は肉[にく]であって、助[たす]けにはならない。主[しゅ]が彼[かれ]らの上[うえ]に手[て]を下[くだ]されると、助[たす]ける者[もの]たちは力[ちから]尽[つ]き、すべての者[もの]がともに滅[ほろ]びる。"
  4: "主[しゅ]はこうわたしに言[い]われた。「獅子[しし]が、また若[わか]い獅子が、自分[じぶん]が取[と]った獲物[えもの]の上[うえ]でほえるとき、その上で叫[さけ]び、その声[こえ]で山々[やまやま]が満[み]ちるまで、彼[かれ]らは打[う]ち負[ま]かされ、怒[いか]りの群[む]れはおののいた。同じように、万軍[ばんぐん]の主[しゅ]は、シオンの山[やま]、その山々に戦[たたか]うために下[くだ]って来[く]られる。」"
  5: "鳥[とり]が飛[と]び回[まわ]るように、万軍[ばんぐん]の主[しゅ]はエルサレムのために守[まも]り、守って救[すく]い出[だ]し、養[やしな]い、救[すく]う。"
  6: "立[た]ち返[かえ]れ。深[ふか]い謀[はかりごと]を、不法[ふほう]な謀をめぐらす者[もの]たちよ、イスラエルの子[こ]らよ。"
  7: "その日[ひ]、人[ひと]々[びと]は、自分[じぶん]の手[て]で造[つく]った銀[ぎん]と金[きん]の手作[てづく]りの物[もの]を捨[す]てる。"
  8: "アッシリアは倒[たお]れる。人[ひと]の剣[つるぎ]ではなく、人の剣がそれを食[く]い尽[く]すのではない。それは剣[つるぎ]の前[まえ]からではなく、それでも逃[に]げる。若者[わかもの]たちは敗北[はいぼく]となる。"
  9: "彼[かれ]らは岩[いわ]によって、とりでのように囲[かこ]まれ、打[う]ち負[ま]かされる。逃[に]げる者[もの]は捕[と]らえられる。主[しゅ]はこう言[い]われる。「シオンに子孫[しそん]を、エルサレムに親族[しんぞく]を持[も]つ者[もの]は幸[さいわ]いである。」"

notes:
  1: "Οὐαὶ οἱ καταβαίνοντες εἰς Αἴγυπτον ἐπὶ βοήθειαν — «горе сходящим в Египет за помощью» (ἐπί с винитивом — цель движения; καταβαίνω — сходить). οἱ ἐφ᾿ ἵπποις πεποιθότες καὶ ἐφ᾿ ἅρμασιν — «надеющиеся на коней и на колесницы»: греч. дважды повторяет ἐφ᾿ ἵπποις («на конях… и на конях, множество весьма»), слав. передаёт второе как «конническое множество» — в тексте 馬も非常に多い. ἔστιν γὰρ πολλά — «ибо их много» (средний род мн. ч. — о колесницах). οὐκ ἦσαν πεποιθότες ἐπὶ τὸν ἅγιον τοῦ Ισραηλ — «не были надеющимися на Святого Израилева» (ἦσαν + причастие — описательная форма); τὸν θεὸν οὐκ ἐξεζήτησαν — «Бога не взыскали» (ἐκζητέω — искать усердно). Син. «на Господа не прибегают» — иное чтение (МТ)."
  2: "καὶ αὐτὸς σοφὸς ἦγεν ἐπ᾿ αὐτοὺς κακά — «и Он, премудрый, наводил на них злое» (ἄγω — вести, наводить; имперфект — действие длящееся); слав. «Тойже премудре наведе на них злая» (аорист). ὁ λόγος αὐτοῦ οὐ μὴ ἀθετηθῇ — «слово Его не будет отвергнуто, не отменится» (ἀθετέω — отвергать, отменять); слав. «не отринется». ἐπαναστήσεται ἐπ᾿ οἴκους ἀνθρώπων πονηρῶν — «восстанет на дома людей злых»; ἐπὶ τὴν ἐλπίδα αὐτῶν τὴν ματαίαν — «и на надежду их тщетную» (ματαία — пустая, суетная). Син. «против помощи делающих беззаконие» — МТ."
  3: "Αἰγύπτιον ἄνθρωπον καὶ οὐ θεόν — «египтянин — человек, а не Бог» (винитив как продолжение мысли ст. 2). ἵππων σάρκας καὶ οὐκ ἔστιν βοήθεια — «плоть коней, и нет помощи»; слав. «конски плоти, и не будет помощи». В МТ и у Син. добавлено «а не дух» («кони их — плоть, а не дух»); ни в LXX, ни в слав. этого нет — в текст не внесено. ὁ δὲ κύριος ἐπάξει τὴν χεῖρα αὐτοῦ ἐπ᾿ αὐτούς — «Господь же наведёт руку Свою на них»; κοπιάσουσιν οἱ βοηθοῦντες — «утрудятся помогающие» (κοπιάω — утруждаться, изнемогать); ἅμα πάντες ἀπολοῦνται — «вместе все погибнут»."
  4: "ὅτι οὕτως εἶπέν μοι κύριος — «ибо так сказал мне Господь»: вводная формула вне кавычек. Ὃν τρόπον ἐὰν βοήσῃ ὁ λέων ἢ ὁ σκύμνος ἐπὶ τῇ θήρᾳ, ᾗ ἔλαβεν — «как заревёт лев или львёнок над добычей, которую взял» (σκύμνος — львёнок, слав. «львичищь»; θήρα — лов, добыча); καὶ κεκράξῃ ἐπ᾿ αὐτῇ — «и закричит над нею» (повтор «над нею» сохранён). ἕως ἂν ἐμπλησθῇ τὰ ὄρη τῆς φωνῆς αὐτοῦ — «доколе не наполнятся горы голосом его». καὶ ἡττήθησαν καὶ τὸ πλῆθος τοῦ θυμοῦ ἐπτοήθησαν — «и были побеждены, и множество ярости устрашилось»: подлежащее в греч. не выражено (по МТ — пастухи, кричащие на льва); слав. «и победишася и множества ярости убояшася». ἐπιστρατεῦσαι ἐπὶ τὸ ὄρος τὸ Σιων — «воевать за гору Сион»."
  5: "ὡς ὄρνεα πετόμενα — «как птицы летающие» (ὄρνεον — птица; слав. «птицы парящыя»). ὑπερασπιεῖ — «защитит, покроет щитом» (ὑπέρ + ἀσπίς, щит). καὶ ἐξελεῖται καὶ περιποιήσεται καὶ σώσει — «и избавит, и сбережёт, и спасёт» (ἐξαιρέω, περιποιέομαι, σῴζω); слав. дважды повторяет «защитит» («защитит Господь саваоф…, защитит и избавит, и снабдит и спасет») — повтор сохранён, поэтому в тексте пять глаголов. Речь Господа, начатая в ст. 4, здесь продолжается; кавычки закрываются в конце стиха. Слав. добавляет «саваоф» при втором «Господь» — в LXX только κύριος; по паритету внесено в основной текст (万軍の主)."
  6: "ἐπιστράφητε — «обратитесь» (ἐπιστρέφω). οἱ τὴν βαθεῖαν βουλὴν βουλευόμενοι καὶ ἄνομον — «замышляющие глубокий и беззаконный совет» (βαθεῖα βουλή — глубокий замысел; ἄνομος — беззаконный). Слав. добавляет обращение «сынове израилевы» — в LXX его нет, внесено в основной текст без 〔…〕 по паритету; поставлено в конце, как у слав. Син. по МТ: «Обратитесь к Тому, от Которого вы столько отпали»."
  7: "ἀπαρνήσονται — «отвергнутся, откажутся» (ἀπαρνέομαι). τὰ χειροποίητα αὐτῶν τὰ ἀργυρᾶ καὶ τὰ χρυσᾶ — «рукотворённое их, серебряное и золотое» (χειροποίητος — сделанный руками, об идолах); слав. «рукотворенная своя сребряная и рукотворенная златая». ἃ ἐποίησαν αἱ χεῖρες αὐτῶν — «что сделали руки их» (двойное указание на руки сохранено)."
  8: "πεσεῖται Ασσουρ — «падёт Ассур» (Ассирия). οὐ μάχαιρα ἀνδρὸς οὐδὲ μάχαιρα ἀνθρώπου καταφάγεται αὐτόν — «не меч мужа и не меч человека пожрёт его» (κατεσθίω — съедать); слав. «не мечем человеческим, ни мечь мужеский пояст его». φεύξεται οὐκ ἀπὸ προσώπου μαχαίρας — «побежит не от лица меча» (букв. «не от лица», в тексте 剣の前から), т. е. обратится в бегство, хотя никто не гонится; Син. «он избежит от меча» — иное чтение (МТ). οἱ νεανίσκοι ἔσονται εἰς ἥττημα — «юноши будут в поражение» (ἥττημα — поражение, разгром; слав. «в побеждение»)."
  9: "πέτρᾳ περιλημφθήσονται ὡς χάρακι — «скалой будут охвачены, как частоколом» (πέτρα — скала; χάραξ — частокол, острог; περιλαμβάνω — охватывать, окружать); слав. «Камением бо обымутся яко острогом». ὁ δὲ φεύγων ἁλώσεται — «бегущий будет пленён» (ἁλίσκομαι — быть взятым). Τάδε λέγει κύριος — вводная формула вне кавычек. Μακάριος ὃς ἔχει ἐν Σιων σπέρμα καὶ οἰκείους ἐν Ιερουσαλημ — «блажен, кто имеет в Сионе семя и домашних в Иерусалиме» (σπέρμα — семя, потомство; οἰκεῖοι — свои, родня); слав. «(блажен,) иже имеет племя в сионе и южики во Иерусалиме» — «блажен» у слав. в скобках как добавленное, но соответствует LXX. Син. по МТ даёт совсем иное: «князья его будут пугаться знамени… Которого огонь на Сионе и горнило в Иерусалиме»."
