# 4–5 речь Господа: лев над добычей и птицы над Иерусалимом — Господь Саваоф
# сойдёт воевать за Сион и покроет Иерусалим; 6 призыв обратиться; 7 в тот день
# отвергнут рукотворённых идолов; 8–9 падение Ассура не от человеческого меча,
# «блажен, кто имеет семя в Сионе».
# Голоса: 1–3 авторский текст; 4–5 речь Господа — 「…」 (вводная формула «так сказал
# мне Господь» вне кавычек); 6 пророческий призыв без кавычек; 7–8 авторский текст;
# 9 вводная формула «так говорит Господь» вне кавычек, изречение — 「…」.
# Нумерация по gr: 9 стихов; деление совпадает с csl и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавления внесены в основной текст
# без скобок по паритету: 31:5 «Саваоф» при втором «Господь» (нет в LXX), 31:6
# «сынове израилевы» (нет в LXX). 31:9 слав. слово «блажен» соответствует LXX
# Μακάριος, но стоит у слав. в скобках как добавленное.
# Сносок ⟨…⟩ нет: 戦車, 馬, 剣, 岩, 子孫 уже в корпусе.
# Имена — транслитерация греческого (LXX): エジプト, イスラエル, シオン, エルサレム,
