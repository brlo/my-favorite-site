# jp-box, 2-я Царств, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания.
# jp-joc в книге нет; jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 1: известие о смерти Саула и Ионафана (1–12), амаликитянин-вестник и его
# казнь (13–16), плач Давида, названный «луком» (17–27).
# 1:17–18 — прозаическая рамка плача (в LXX это слова самого Давида и примечание
# о «книге Праведного»), поэзия 19–27 — в 「…」, рефрен «как пали сильные»
# (19, 25, 27). Красного и синего нет.
# 〔…〕 нет: славянская фраза, которой нет в LXX (1:18 «стрелянию» — из МТ),
# внесена в основной текст без скобок; в остальном стихи совпадают с gr.
# Сносок ⟨…⟩ нет: ペリシテ人, 無割礼, 石柱, 油を注がれた者 уже в корпусе.

tr_code: jp-box
book: 2ts
chapter: 1
draft: true

verses:
  1: "サウルが死[し]んだ後[のち]、ダビデはアマレク人[じん]を打[う]ち破[やぶ]って帰[かえ]り、セケラクに二日[ふつか]とどまった。"
  2: "三日目[みっかめ]のこと、見[み]よ、サウルの陣営[じんえい]から一人[ひとり]の男[おとこ]が来[き]た。その衣[ころも]は裂[さ]け、頭[あたま]には塵[ちり]があった。彼[かれ]がダビデのもとに来[く]ると、地[ち]に伏[ふ]して彼[かれ]を拝[おが]んだ。"
  3: "ダビデは彼[かれ]に言[い]った。「どこから来[き]たのか。」彼[かれ]は言[い]った。「イスラエルの陣営[じんえい]から逃[に]げて来[き]た。」"
  4: "ダビデは彼[かれ]に言[い]った。「どうしたことか。わたしに告[つ]げよ。」彼[かれ]は言[い]った。「民[たみ]は戦[いくさ]から逃[に]げ、民[たみ]のうちの多[おお]くの者[もの]が倒[たお]れて死[し]んだ。サウルも、その息子[むすこ]ヨナタンも死[し]んだ。」"
  5: "ダビデは、自分[じぶん]に告[つ]げた若者[わかもの]に言[い]った。「サウルとその息子[むすこ]ヨナタンが死[し]んだことを、どうして知[し]っているのか。」"
  6: "若者[わかもの]は答[こた]えて言[い]った。「わたしはふとギルボア山[やま]に来[き]た。すると、見[み]よ、サウルは自分[じぶん]の槍[やり]に寄[よ]りかかり、戦車[せんしゃ]と騎兵[きへい]の長[ちょう]たちが彼[かれ]に迫[せま]っていた。"
  7: "彼[かれ]は後[うし]ろを振[ふ]り向[む]いてわたしを見[み]、わたしを呼[よ]んだ。わたしは『はい、ここにいる』と言[い]った。"
  8: "彼[かれ]はわたしに言[い]った。『おまえはだれか。』わたしは言[い]った。『わたしはアマレク人[じん]だ。』"
  9: "彼[かれ]はわたしに言[い]った。『わたしの上[うえ]に立[た]って、わたしを殺[ころ]してくれ。ひどい暗[やみ]がわたしを捕[と]らえ、わたしの魂[たましい]がまだわたしの内[うち]にあるからだ。』"
  10: "そこでわたしは彼[かれ]の上[うえ]に立[た]ち、彼を殺[ころ]した。倒[たお]れた後[のち]はもう生[い]きていないと知[し]っていたからだ。そして、彼の頭[あたま]にあった王冠[おうかん]と、その腕[うで]にあった腕輪[うでわ]を取[と]り、ここに、わたしの主人[しゅじん]のもとへ持[も]って来[き]た。」"
  11: "ダビデは自分[じぶん]の衣[ころも]をつかんで裂[さ]き、彼[かれ]とともにいたすべての者[もの]たちも、自分[じぶん]たちの衣[ころも]を裂[さ]いた。"
  12: "彼[かれ]らはサウルとその息子[むすこ]ヨナタンのため、またユダの民[たみ]とイスラエルの家[いえ]のために、夕暮[ゆうぐ]れまで嘆[なげ]き、泣[な]き、断食[だんじき]した。彼らが剣[つるぎ]で殺[ころ]されたからである。"
  13: "ダビデは、自分[じぶん]に告[つ]げた若者[わかもの]に言[い]った。「おまえはどこから来[き]たのか。」彼[かれ]は言[い]った。「わたしはアマレク人[じん]の寄留者[きりゅうしゃ]の子[こ]だ。」"
  14: "ダビデは彼[かれ]に言[い]った。「どうして恐[おそ]れずに、手[て]を上[あ]げて主[しゅ]の油[あぶら]を注[そそ]がれた者[もの]を滅[ほろ]ぼそうとしたのか。」"
  15: "ダビデは自分[じぶん]の若者[わかもの]の一人[ひとり]を呼[よ]んで言[い]った。「近[ちか]づいて、彼を打[う]て。」若者[わかもの]は彼[かれ]を打[う]ち、彼は死[し]んだ。"
  16: "ダビデは彼[かれ]に言[い]った。「あなたの血[ち]はあなたの頭[あたま]に帰[き]する。あなたの口[くち]があなた自身[じしん]に不利[ふり]な証言[しょうげん]をし、『わたしが主[しゅ]の油[あぶら]を注[そそ]がれた者[もの]を殺[ころ]した』と言[い]ったからだ。」"
  17: "ダビデはこの挽歌[ばんか]を歌[うた]い、サウルとその息子[むすこ]ヨナタンのために嘆[なげ]いた。"
  18: "そして言[い]った。「ユダの子[こ]らに弓[ゆみ]を射[い]ることを教[おし]えよ。」見[み]よ、このことは『正[ただ]しき者[もの]の書[しょ]』に記[しる]されている。"
  19: "「イスラエルよ、あなたの高[たか]き所[ところ]で死[し]んだ者[もの]たちのために、石柱[せきちゅう]を立[た]てよ。どうして強[つよ]い者[もの]たちは倒[たお]れたのか。"
  20: "ガトで告[つ]げてはならない。アスカロンの通[とお]りで知[し]らせてはならない。ペリシテ人[じん]の娘[むすめ]たちが喜[よろこ]び、無[む]割礼[かつれい]の者[もの]たちの娘[むすめ]たちが小[おど]り上[あ]がってはならないからだ。"
  21: "ギルボアの山[やま]々[やま]よ、あなたがたの上[うえ]に露[つゆ]も雨[あめ]も降[ふ]らず、初穂[はつほ]の畑[はたけ]もないように。そこでは強[つよ]い者[もの]たちの盾[たて]が投[な]げ捨[す]てられ、サウルの盾[たて]は油[あぶら]を塗[ぬ]られなかったからだ。"
  22: "刺[さ]された者[もの]たちの血[ち]により、強[つよ]い者[もの]たちの脂肪[しぼう]によって、ヨナタンの弓[ゆみ]は空[むな]しく引[ひ]き返[かえ]されることはなく、サウルの剣[つるぎ]も空しく帰[かえ]ることはなかった。"
  23: "サウルとヨナタンは愛[あい]され、麗[うるわ]しく、離[はな]れ合[あ]うことがなかった。生[い]きている間[あいだ]も美[うつく]しく、死[し]ぬ時[とき]にも分[わ]かれなかった。彼[かれ]らは鷲[わし]よりも速[はや]く、獅子[しし]よりも強[つよ]かった。"
  24: "イスラエルの娘[むすめ]たちよ、サウルのために泣[な]け。彼はあなたがたに緋色[ひいろ]の衣[ころも]を飾[かざ]りとともに着[き]せ、金[きん]の飾りをあなたがたの衣[ころも]の上[うえ]に付[つ]けてくれた。"
  25: "どうして強[つよ]い者[もの]たちは戦[いくさ]のただ中[なか]で倒[たお]れたのか。ヨナタンはあなたの高[たか]き所[ところ]で刺[さ]されて倒[たお]れた。"
  26: "兄弟[きょうだい]ヨナタンよ、わたしはあなたのことで苦[くる]しんでいる。あなたはわたしにとても麗[うるわ]しかった。あなたの愛[あい]は女[おんな]たちの愛にもまして、わたしには驚[おどろ]くべきものだった。"
  27: "どうして強[つよ]い者[もの]たちは倒[たお]れ、戦[いくさ]の武具[ぶぐ]は失[うしな]われたのか。」"

notes:
  1: "μετὰ τὸ ἀποθανεῖν Σαυλ — после того как умер Саул. ἀνέστρεψεν τύπτων τὸν Αμαληκ — возвратился, поразив Амалика (τύπτω — бить, поражать; слав. «победив амалика»). ἐκάθισεν ἐν Σεκελακ ἡμέρας δύο — пробыл в Секелаге два дня (καθίζω здесь — оставаться); セケラク — как в 1 Цар."
  2: "τῇ ἡμέρᾳ τῇ τρίτῃ — в третий день. ἐκ τῆς παρεμβολῆς ἐκ τοῦ λαοῦ Σαυλ — из стана, из народа Саулова. τὰ ἱμάτια αὐτοῦ διερρωγότα — одежды его разодраны (прич. перф. διαρρήγνυμι). γῆ ἐπὶ τῆς κεφαλῆς — прах на голове, знак скорби. προσεκύνησεν αὐτῷ — поклонился ему. Слав. вставляет в скобках «(отрок)» — пояснение, в LXX его нет; в текст не внесено."
  3: "Πόθεν σὺ παραγίνῃ; — откуда ты приходишь (παραγίνομαι). διασέσῳσμαι — я спасся бегством (перф. διασῴζω)."
  4: "Τίς ὁ λόγος οὗτος; — «что это за слово/дело?». ἀπάγγειλόν μοι — возвести мне. Ἔφυγεν ὁ λαὸς ἐκ τοῦ πολέμου — побежал народ с войны. πεπτώκασι — пали (перф. πίπτω)."
  5: "τῷ παιδαρίῳ τῷ ἀπαγγέλλοντι αὐτῷ — отроку, возвещавшему ему (παιδάριον, 若者). Πῶς οἶδας — как ты знаешь."
  6: "Περιπτώματι περιέπεσον — «случайно наткнулся» (περίπτωμα — случай). ἐπεστήρικτο ἐπὶ τὸ δόρυ αὐτοῦ — опирался на копьё своё (ἐπιστηρίζω); слав. «нападаше на копие свое». ἱππάρχαι — начальники конницы; слав. «вельможи». συνῆψαν αὐτῷ — сошлись с ним, настигли."
  7: "ἐπέβλεψεν ἐπὶ τὰ ὀπίσω αὐτοῦ — оглянулся назад. ἐκάλεσέν με — позвал меня. Ἰδοὺ ἐγώ — «вот я». Слав. добавляет в скобках «(саул)» — пояснение, в LXX нет."
  8: "Αμαληκίτης ἐγώ εἰμι — я амаликитянин."
  9: "Στῆθι δὴ ἐπάνω μου — стань надо мной. θανάτωσόν με — умертви меня. κατέσχεν με σκότος δεινόν — объяла меня тьма лютая. πᾶσα ἡ ψυχή μου ἐν ἐμοί — вся душа моя во мне (LXX); слав. «еще душа моя во мне», в тексте держим слав. «ещё»."
  10: "τὸ βασίλειον — царский венец. χλιδῶνα τὸν ἐπὶ τοῦ βραχίονος — запястье/нарукавник на руке (χλιδών); слав. «нарамницу, яже бе на плещу» (на плече). ἐνήνοχα — принёс (перф. φέρω)."
  11: "ἐκράτησεν τῶν ἱματίων — схватил одежды свои. διέρρηξεν — разодрал (διαρρήγνυμι). Знак скорби, ср. 3:31."
  12: "ἐκόψαντο — рыдали, били себя (κόπτομαι). ἕως δείλης — до вечера (δείλη — послеполуденное время). ἐπὶ τὸν λαὸν Ιουδα — о народе Иудином (так LXX и слав.); Синод. «о народе Господнем» (по МТ). ἐπλήγησαν ἐν ῥομφαίᾳ — поражены мечом."
  13: "Υἱὸς ἀνδρὸς παροίκου Αμαληκίτου — сын мужа-пришельца амаликитянина (πάροικος — переселенец, 寄留者)."
  14: "ἐπενεγκεῖν χεῖρά σου — наложить руку твою. διαφθεῖραι — погубить. χριστὸν κυρίου — помазанника Господня, 主の油を注がれた者."
  15: "ἓν τῶν παιδαρίων — одного из отроков. ἀπάντησον αὐτῷ — подойди, напади на него; слав. «иди, убий его». ἐπάταξεν — поразил."
  16: "Τὸ αἷμά σου ἐπὶ τὴν κεφαλήν σου — кровь твоя на голове твоей (формула вины). ἀπεκρίθη κατὰ σοῦ — «ответила против тебя», т.е. свидетельствовала против тебя."
  17: "ἐθρήνησεν τὸν θρῆνον τοῦτον — оплакал этим плачем (внутренний винительный). Плач назван «луком» (קֶשֶׁת; ср. 1:18), отсюда 弓の歌."
  18: "τοῦ διδάξαι τοὺς υἱοὺς Ιουδα — научить сынов Иудиных; слав. добавляет «стрелянию» (из МТ: קָשֶׁת, «лук»), в LXX дополнения нет — по паритету внесено в основной текст без скобок. βιβλίον τοῦ εὐθοῦς — «книга Праведного» (εὐθής — прямой, правый; евр. Сефер ха-Яшар)."
  19: "Στήλωσον — поставь столп (στηλόω), 石柱を立てよ; слав. «воздвигни столп». ὑπὲρ τῶν τεθνηκότων ἐπὶ τὰ ὕψη σου τραυματιῶν — за умерших, поражённых на высотах твоих. В МТ и Синод. «краса твоя, Израиль» (הַצְּבִי) — чтения, которого нет ни в LXX, ни в слав., поэтому в текст не внесено. πῶς ἔπεσαν δυνατοί — как пали сильные (рефрен 19, 25, 27)."
  20: "μὴ ἀναγγείλητε ἐν Γεθ — не возвещайте в Гефе. ἐν ταῖς ἐξόδοις Ἀσκαλῶνος — на выходах, т.е. на улицах Аскалона (ἔξοδος). θυγατέρες ἀλλοφύλων — дочери иноплеменников. τῶν ἀπεριτμήτων — необрезанных."
  21: "ὄρη τὰ ἐν Γελβουε — горы Гелвуйские (обращение). μὴ καταβῇ δρόσος — да не сойдёт роса. ἀγροὶ ἀπαρχῶν — поля начатков, 初穂の畑 (ἀπαρχή — первый плод). προσωχθίσθη — «стал мерзок/прогневан» (προσοχθίζω); слав. и Синод. «повержен». θυρεός — большой щит. οὐκ ἐχρίσθη ἐν ἐλαίῳ — не был помазан елеем."
  22: "ἀφ᾽ αἵματος τραυματιῶν, ἀπὸ στέατος δυνατῶν — от крови поражённых, от тука сильных (ἀπό причины). οὐκ ἀπεστράφη κενόν — не возвратился пустым (ἀποστρέφω). οὐκ ἀνέκαμψεν κενή — не повернул назад пустым (ἀνακάμπτω)."
  23: "οἱ ἠγαπημένοι καὶ ὡραῖοι — возлюбленные и прекрасные. οὐ διακεχωρισμένοι — неразлучные (διαχωρίζω). εὐπρεπεῖς ἐν τῇ ζωῇ αὐτῶν — благообразные в жизни своей. οὐ διεχωρίσθησαν — не разлучились. ὑπὲρ ἀετοὺς κοῦφοι — легче орлов. ὑπὲρ λέοντας ἐκραταιώθησαν — крепче львов стали."
  24: "θυγατέρες Ισραηλ — дочери Израиля. τὸν ἐνδιδύσκοντα ὑμᾶς κόκκινα — одевавшего вас в багряное. μετὰ κόσμου ὑμῶν — с украшениями вашими (κόσμος). ἀναφέροντα κόσμον χρυσοῦν — возлагавшего золотое украшение."
  25: "ἐν μέσῳ τοῦ πολέμου — среди брани. ἐπὶ τὰ ὕψη σου τραυματίας — на высотах твоих поражён (Ионафан)."
  26: "ἀλγῶ ἐπὶ σοί — болею о тебе (ἀλγέω). ὡραιώθης μοι σφόδρα — ты стал очень прекрасен для меня. ἐθαυμαστώθη ἡ ἀγάπησίς σου — дивной стала любовь твоя. ὑπὲρ ἀγάπησιν γυναικῶν — более любви женской."
  27: "σκεύη πολεμικά — оружие войны, 戦の武具. Рефрен 19 и 25 завершает плач."
