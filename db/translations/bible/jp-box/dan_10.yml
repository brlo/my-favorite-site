# jp-box, Даниил, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 10 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 третий год Кира, слово о видении; 2–3 пост Даниила три седмицы;
# 4–6 муж у Тигра: виссон, золотой пояс, тело как тарсис, глаза как светильники;
# 7–9 ужас спутников, Даниил один, силы оставили его; 10–14 рука поднимает его,
# «муж желаний», двадцать один день, князь Персии, Михаил, последние дни;
# 15–19 немота, подобие сына человеча касается уст, «не бойся, мир тебе»;
# 20–21 князь Персии и князь Греции, запись истины, Михаил — ваш князь.
# Голоса: 1–10 повествование; 11–14 речь ангела в 「…」 (формула «и сказал мне»
# вне кавычек); 15 повествование; 16–17 речь Даниила в 「…」; 18 повествование;
# 19–21 речь ангела в 「…»; в 20–21 она продолжается и переходит в главу 11.
# «Муж желаний» — 望[のぞ]みの人[ひと] (LXX ἐλεεινός, слав. «желаний»).
# Термины: 幻[まぼろし] (ὅρασις), 君[きみ] (στρατηγός/ἄρχων), 亜麻布[あまぬの] (βύσσος),
# タルシスの石[いし] (θαρσις), ギリシア (Ἕλληνες), ペルシア.
#
tr_code: jp-box
book: dan
chapter: 10
draft: true

verses:
  1: "ペルシアの王[おう]クロスの第三年[だいさんねん]、言葉[ことば]がダニエルに啓示[けいじ]された。彼[かれ]はバルタザルという名[な]で呼[よ]ばれていた。その言葉[ことば]は真実[しんじつ]であり、力[ちから]も大[おお]きく、彼[かれ]には幻[まぼろし]のうちに悟[さと]りが与[あた]えられた。"
  2: "その日[ひ]々[び]、わたしダニエルは三週間[さんしゅうかん]、悲[かな]しみのうちに過[す]ごした。"
  3: "わたしは好[この]ましいパンを食[た]べず、肉[にく]もぶどう酒[しゅ]も口[くち]に入[い]れず、油[あぶら]を塗[ぬ]ることもなく、三週間[さんしゅうかん]が満[み]ちるまでそうしていた。"
  4: "第一[だいいち]の月[つき]の二十四日[にじゅうよっか]、わたしは大[おお]きな川[かわ]、すなわちティグリス（エデケル）の岸[きし]にいた。"
  5: "目[め]を上[あ]げて見[み]ると、見[み]よ、一人[ひとり]の男[おとこ]が亜麻布[あまぬの]の衣[ころも]を着[き]、腰[こし]には光[ひか]る金[きん]の帯[おび]を締[し]めていた。"
  6: "その体[からだ]はタルシスの石[いし]のよう、顔[かお]は稲妻[いなずま]の輝[かがや]きのよう、目[め]は燃[も]えるともしびのよう、腕[うで]と足[あし]は磨[みが]かれた青銅[せいどう]のように光[ひか]り、その語[かた]りの声[こえ]は多[おお]くの民[たみ]のざわめきのようであった。"
  7: "わたしダニエルだけがこの大[おお]きな幻[まぼろし]を見[み]た。しかし、わたしと共[とも]にいた人[ひと]々[びと]はこの幻[まぼろし]を見[み]ず、大[おお]きな恐[おそ]れが彼[かれ]らに襲[おそ]いかかり、彼[かれ]らは恐[こわ]れのうちに逃[に]げ去[さ]った。"
  8: "わたしは一人[ひとり]残[のこ]され、この大[おお]きな幻[まぼろし]を見[み]た。しかし、わたしのうちに力[ちから]は残[のこ]らず、わたしの栄光[えいこう]は崩[くず]れ去[さ]り、力[ちから]を保[たも]つことができなかった。"
  9: "わたしは彼[かれ]の語[かた]りの声[こえ]を聞[き]いた。それを聞[き]いたとき、わたしは打[う]ちひしがれ、顔[かお]を地[ち]に伏[ふ]せた。"
  10: "すると見[み]よ、手[て]がわたしに近[ちか]づき、わたしを膝[ひざ]と両手[りょうて]のひらをつくようにして起[お]こされた。"
  11: "そして、わたしに言[い]った。「ダニエル、望[のぞ]みの人[ひと]よ、わたしがあなたに語[かた]ることばに心[こころ]を向[む]け、あなたの場所[ばしょ]に立[た]ちなさい。今[いま]、わたしはあなたのもとへ遣[つか]わされたからである。」彼がこの言葉[ことば]をわたしに語[かた]ったとき、わたしは震[ふる]えながら立[た]った。"
  12: "「恐[おそ]れるな、ダニエル。あなたが心[こころ]を向[む]けて悟[さと]ろうとし、あなたの神[かみ]である主[しゅ]の前[まえ]で努[つと]めた最初[さいしょ]の日[ひ]から、あなたの言葉[ことば]は聞[き]き入[い]れられ、わたしはあなたの言葉[ことば]のゆえに来[き]たのである。"
  13: "しかし、ペルシアの国[くに]の君[きみ]が二十一日[にじゅういちにち]の間[あいだ]、わたしに逆[さか]らって立[た]っていた。すると見[み]よ、ミカエル、最初[さいしょ]の君[きみ]たちの一人[ひとり]が助[たす]けに来[き]た。わたしは彼[かれ]をそこに、ペルシアの国[くに]の君[きみ]と共[とも]に残[のこ]した。"
  14: "わたしは、あなたの民[たみ]に終[お]わりの日[ひ]々[び]に何[なに]が起[お]こるかを示[しめ]すために来[き]た。この幻[まぼろし]はまだ日[ひ]々[び]の先[さき]にあるからである。」"
  15: "彼がこれらの言葉[ことば]をわたしに語[かた]ったとき、わたしは顔[かお]を地[ち]に伏[ふ]せ、深[ふか]く心[こころ]を痛[いた]めて黙[だま]った。"
  16: "すると見[み]よ、人[ひと]の子[こ]のようなものがわたしの唇[くちびる]に触[ふ]れた。わたしは口[くち]を開[ひら]いて語[かた]り、わたしの前[まえ]に立[た]っている方[かた]に言[い]った。「主[しゅ]よ、あなたの幻[まぼろし]のうちで、わたしの内[うち]はひっくり返[かえ]るようになり、力[ちから]がない。"
  17: "どうしてこの僕[しもべ]が、このわが主[しゅ]と語[かた]ることができようか。わたしは力[ちから]を失[うしな]い、今[いま]はもう、わたしのうちに力[ちから]も息[いき]も残[のこ]っていない。」"
  18: "すると、人[ひと]のような姿[すがた]のものが再[ふたた]び触[ふ]れて、わたしを強[つよ]くした。"
  19: "そして、わたしに言[い]った。「恐[おそ]れるな、望[のぞ]みの人[ひと]よ。平安[へいあん]があなたにあるように。勇[いさ]ましくあれ、強[つよ]くあれ。」彼がわたしに語[かた]ったとき、わたしは力[ちから]を得[え]て言[い]った。「わが主[しゅ]よ、語[かた]ってください。あなたがわたしを強[つよ]くしてくださったからだ。」"
  20: "彼は言[い]った。「わたしがなぜあなたのもとへ来[き]たか、あなたは知[し]っているか。今[いま]、わたしはペルシアの王[おう]の君[きみ]と戦[たたか]うために帰[かえ]ろうとしている。わたしが出[で]て行[い]くと、見[み]よ、ギリシアの君[きみ]が入[はい]って来[く]る。"
  21: "しかし、わたしは真実[しんじつ]の書[しょ]に記[しる]されていることの初[はじ]めをあなたに示[しめ]そう。これらのことについて、わたしと共[とも]に助[たす]ける者[もの]は一人[ひとり]もいない。ただ、あなたがたの君[きみ]ミカエルのほかには。」"

notes:
  1: "Ἐν τῷ ἐνιαυτῷ τῷ πρώτῳ Κύρου — «в первый год Кира»; слав. «в лето третие» (Феодотион), по паритету взято церковное 第三年. πρόσταγμα — «повеление, слово» (言葉); ἀληθὲς τὸ ὅραμα καὶ τὸ πρόσταγμα — «истинно видение и повеление»; слав. «истинно же слово и сила велика и разум дадеся ему в видении» — отсюда 力も大きく…悟りが与えられた. LXX: τὸ πλῆθος τὸ ἰσχυρὸν διανοηθήσεται τὸ πρόσταγμα — «сильное множество уразумеет повеление»; слав. сводит это к «разум дадеся ему»."
  2: "ἐν ταῖς ἡμέραις ἐκείναις ἐγὼ Δανιηλ ἤμην πενθῶν τρεῖς ἑβδομάδας — «в те дни я, Даниил, был скорбя три седмицы» (πενθέω — плакать, сетовать); слав. «бех рыдая три седмицы дний»; 三週間 — по слав. (ἑβδομάς — седмица, неделя)."
  3: "ἄρτον ἐπιθυμιῶν — «хлеб вожделений» (лучший, вкусный хлеб); κρέας καὶ οἶνος — «мясо и вино»; ἔλαιον οὐκ ἠλειψάμην — «елеем не умащался» (слав. «мастию не помазахся»). Пост длится до исполнения трёх седмиц."
  4: "χεῖλος τοῦ ποταμοῦ τοῦ μεγάλου, ὅς ἐστι Τίγρης — «берег большой реки, то есть Тигра»; слав. добавляет евр. имя «еддекель» (חדקל), отсюда ティグリス、エデケル."
  5: "ἄνθρωπος εἷς ἐνδεδυμένος βύσσινα — «один муж, облечённый в виссон» (βύσσος — тонкий лён, 亜麻布); τὴν ὀσφὺν περιεζωσμένος βυσσίνῳ — «чресла препоясаны виссоном», καὶ ἐκ μέσου αὐτοῦ φῶς — «и из середины его свет»; слав. «чресла его препоясана златом светлым» (Феодотион), по паритету 金の帯."
  6: "θαρσις — камень (хризолит или берилл); в корпусе タルシスの石 (ср. Иез 1:16); οἱ ὀφθαλμοὶ ὡσεὶ λαμπάδες πυρός — «очи как светильники огня»; χαλκὸς ἐξαστράπτων — «сверкающая медь» (青銅); φωνὴ θορύβου — «голос шума», слав. «глас народа» (民のざわめき)."
  7: "οἱ ἄνθρωποι οἱ ὄντες μετ' ἐμοῦ οὐκ εἴδοσαν — «люди, бывшие со мной, не видели»; ἀπέδρασαν ἐν σπουδῇ — «убежали поспешно», слав. «отбегнуша во страсе» (в страхе), отсюда 恐れのうちに; слав. «един» — «я один»."
  8: "κατελείφθην μόνος — «оставлен один»; οὐκ ἐγκατελείφθη ἐν ἐμοὶ ἰσχύς — «не осталось во мне силы»; πνεῦμα ἐπεστράφη ἐπ' ἐμὲ εἰς φθοράν — «дух (дыхание) обратился во мне в тление»; слав. «слава моя обратися в разсыпание» (Феодотион), по паритету 栄光."
  9: "καὶ οὐκ ἤκουσα τὴν φωνὴν λαλιᾶς αὐτοῦ — «и я не услышал голоса его речи» (LXX); слав. «и слышах глас словес его», по паритету утвердительное 聞いた. Далее: «был повержен лицом на землю»."
  10: "χεῖρα προσήγαγέ μοι — «рука приблизилась ко мне»; ἤγειρέ με ἐπὶ τῶν γονάτων ἐπὶ τὰ ἴχνη τῶν ποδῶν μου — «поднял меня на колени и на ступни ног» (LXX); слав. «на колена моя и на длани рук моих», отсюда 膝と両手のひら."
  11: "ἄνθρωπος ἐλεεινός — «человек жалкий, помилованный» (LXX); слав. «мужу желаний» (איש חמודות), по паритету 望みの人. διανοήθητι τοῖς προστάγμασιν — «уразумей повеления»; στῆθι ἐπὶ τοῦ τόπου σου — «стань на месте твоём»; ἄρτι ἀπεστάλην ἐπὶ σέ — «ныне послан к тебе»."
  12: "ἀπὸ τῆς ἡμέρας τῆς πρώτης, ἧς ἔδωκας τὸ πρόσωπόν σου — «с первого дня, когда ты обратил лицо твоё»; слав. «подал еси сердце твое» и «трудитися» вместо «смириться» (LXX ταπεινωθῆναι), отсюда 心を向け…努めた. εἰσηκούσθη τὸ ῥῆμά σου — «услышано слово твоё»."
  13: "ὁ στρατηγὸς βασιλέως Περσῶν — «воевода (князь) царя Персидского»; слав. «князь царства персскаго»; ἀνθειστήκει ἐναντίον μου — «противился мне»; εἷς τῶν ἀρχόντων τῶν πρώτων — «один из первых князей»; αὐτὸν ἐκεῖ κατέλιπον — «его там оставил» (тёмное место, в тексте буквально)."
  14: "Ἦλθον ὑποδεῖξαί σοι τί ὑπαντήσεται τῷ λαῷ σου ἐπ' ἐσχάτου τῶν ἡμερῶν — «пришёл показать тебе, что встретит народ твой в последние дни»; ἔτι γὰρ ὅρασις εἰς ἡμέρας — «ибо ещё видение на дни» (отдалённые)."
  15: "ἐν τῷ αὐτὸν λαλῆσαι… ἔδωκα τὸ πρόσωπόν μου ἐπὶ τὴν γῆν καὶ ἐσιώπησα — «когда он говорил… я обратил лицо моё к земле и замолчал» (LXX); слав. «и умилихся» — «умилился, сокрушился», отсюда соединение 深く心を痛めて黙った."
  16: "ὡς ὁμοίωσις χειρὸς ἀνθρώπου — «как подобие руки человеческой» (LXX); слав. «аки подобие сына человеча» (без «руки»), по паритету 人の子のようなもの. ὡς ὅρασις ἀπεστράφη ἐπὶ τὸ πλευρόν μου — «как видение обратилось на бок мой» (тёмное); слав. «в видении твоем обратися утроба моя во мне»."
  17: "πῶς δυνήσεται ὁ παῖς λαλῆσαι μετὰ τοῦ κυρίου αὐτοῦ — «как сможет раб говорить с господином своим»; слав. добавляет «господи» и «отныне», в скобках «(сила бо)» — редакционная вставка, не перенесена; πνεῦμα οὐ κατελείφθη ἐν ἐμοί — «дыхание не осталось во мне»."
  18: "προσέθηκε καὶ ἥψατό μου ὡς ὅρασις ἀνθρώπου — «приложил и коснулся меня как видение человека»; слав. «яко зрак человечь»; κατίσχυσέ με — «укрепил меня»."
  19: "ἄνθρωπος ἐλεεινός εἶ — «человек жалкий, помилованный»; слав. «мужу желаний»; ὑγίαινε — «будь здоров» (приветствие), слав. «мир тебе», отсюда 平安が; ἀνδρίζου καὶ ἴσχυε — «мужайся и укрепляйся»; в LXX/ru повтор «мужайся, мужайся», слав. один раз."
  20: "Γινώσκεις τί ἦλθον πρὸς σέ — «знаешь ли, зачем я пришёл к тебе»; ἐπιστρέψω διαμάχεσθαι μετὰ τοῦ στρατηγοῦ βασιλέως τῶν Περσῶν — «возвращусь бороться с воеводой царя Персидского»; στρατηγὸς Ἑλλήνων — «воевода Греции» (ギリシアの君)."
  21: "τὰ πρῶτα ἐν ἀπογραφῇ ἀληθείας — «первое в записи истины»; слав. «вчиненое в писании истины» (真実の書に記されていることの初め); οὐθεὶς ἦν ὁ βοηθῶν μετ' ἐμοῦ — «никто не помогал мне»; ἀλλ' ἢ Μιχαηλ ὁ ἄγγελος — «кроме Михаила ангела»; слав. «михаил князь ваш», по паритету あなたがたの君."
