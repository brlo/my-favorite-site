verses:
  1: "神[かみ]の箱[はこ]を運[はこ]び入[い]れ、ダビデがそのために張[は]った天幕[てんまく]の中央[ちゅうおう]に据[す]え、主[しゅ]の前[まえ]で燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげた。"
  2: "ダビデは燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげ終[お]えると、主[しゅ]の名[な]によって民[たみ]を祝福[しゅくふく]した。"
  3: "そして、イスラエルのすべての人[ひと]に、男[おとこ]から女[おんな]まで、一人[ひとり]ごとにパン一個[いっこ]と、油[あぶら]で焼[や]いた上等[じょうとう]の粉[こな]の菓子[かし]一個を分[わ]け与[あた]えた。"
  4: "主[しゅ]の契約[けいやく]の箱[はこ]の前[まえ]に、レビ人[びと]の中[なか]から、仕[つか]えて呼[よ]ばわり、感謝[かんしゃ]し、イスラエルの神[かみ]、主をほめたたえる者[もの]たちを置[お]いた。"
  5: "アサフを長[かしら]とし、彼[かれ]に次[つ]ぐ者[もの]はゼカリヤ、イエイル、セミラモト、イエイル、マタティア、エリアブ、ベナヤ、オベデ・エドム、イエイルで、彼らは楽器[がっき]、琴[こと]、竪琴[たてごと]を奏[かな]で、アサフはシンバルを鳴[な]らして呼[よ]ばわった。"
  6: "祭司[さいし]であるベナヤとオジエルは、神[かみ]の契約[けいやく]の箱[はこ]の前[まえ]で、絶[た]えずラッパを吹[ふ]いた。"
  7: "その日[ひ]、ダビデは初[はじ]めて、アサフとその兄弟[きょうだい]たちの手[て]によって主[しゅ]をほめたたえることを定[さだ]めた。"
  8: "「主[しゅ]に感謝[かんしゃ]せよ。その名[な]を呼[よ]べ。諸国[しょこく]の民[たみ]の中[なか]に、そのわざを告[つ]げ知[し]らせよ。"
  9: "主[しゅ]に歌[うた]い、ほめ歌[うた]を歌[うた]え。主が行[おこな]われたそのすべての奇[き]跡[せき]を語[かた]り伝[つた]えよ。"
  10: "その聖[せい]なる名[な]を誇[ほこ]れ。主[しゅ]を尋[たず]ね求[もと]める者[もの]の心[こころ]は喜[よろこ]べ。"
  11: "主[しゅ]を尋[たず]ねて強[つよ]くなれ。いつも主の顔[かお]を尋[たず]ねよ。"
  12: "主[しゅ]が行[おこな]われた奇[き]跡[せき]を、そのしるしと、その口[くち]の裁[さば]きとを思[おも]い出[だ]せ。"
  13: "そのしもべであるイスラエルの子孫[しそん]よ、その選[えら]ばれた者[もの]であるヤコブの子[こ]らよ。"
  14: "主[しゅ]はわたしたちの神[かみ]である。その裁[さば]きは全[ぜん]地[ち]に及[およ]ぶ。"
  15: "とこしえに、その契約[けいやく]を覚[おぼ]えよ。千[せん]代[だい]に及[およ]ぶまでに命[めい]じられたその言葉[ことば]を。"
  16: "すなわち、アブラハムと結[むす]ばれた契約[けいやく]、イサクに対する誓[ちか]いであり、"
  17: "主[しゅ]はそれをヤコブに対する定[さだ]めとし、イスラエルに対する永遠[えいえん]の契約[けいやく]とされた。"
  18: "そして言[い]われた。『わたしはあなたにカナンの地[ち]を、あなたがたの嗣業[しぎょう]の測[はか]り縄[なわ]として与[あた]える。』"
  19: "そのとき、彼[かれ]らは数[かず]が少[すく]なく、ごくわずかで、その地[ち]に寄留[きりゅう]していた。"
  20: "彼[かれ]らは民[たみ]から民へ、王国[おうこく]からほかの民へと渡[わた]って行[ゆ]った。"
  21: "主[しゅ]はだれにも彼[かれ]らを害[がい]することを許[ゆる]さず、彼らのために王[おう]たちを戒[いまし]めて、"
  22: "『わたしの油[あぶら]を注[そそ]がれた者[もの]たちに触[ふ]れるな。わたしの預言者[よげんしゃ]たちに悪[わる]をなすな』と言[い]われた。"
  23: "全[ぜん]地[ち]よ、主[しゅ]に歌[うた]え。日[ひ]から日へと、その救[すく]いを告[つ]げ知[し]らせよ。"
  24: "諸国[しょこく]の民[たみ]の中[なか]にその栄光[えいこう]を、すべての民[たみ]の中にその奇[き]跡[せき]を告[つ]げ知[し]らせよ。"
  25: "主[しゅ]は大[おお]いなる方[かた]、大[おお]いにほめたたえられるべき方[かた]、すべての神[かみ]々[がみ]の上[うえ]に恐[おそ]るべき方[かた]である。"
  26: "諸国[しょこく]の民[たみ]の神[かみ]々[がみ]はみな偶像[ぐうぞう]にすぎない。しかし、わたしたちの主[しゅ]は天[てん]を造[つく]られた。"
  27: "栄光[えいこう]と賛美[さんび]はその前[まえ]にあり、力[ちから]と誇[ほこ]りはその聖[せい]なる場所[ばしょ]にある。"
  28: "諸国[しょこく]の民[たみ]の氏族[しぞく]よ、主[しゅ]に帰[き]せよ。栄光[えいこう]と力[ちから]を主に帰せよ。"
  29: "その名[な]の栄光[えいこう]を主[しゅ]に帰[き]せよ。贈[おく]り物[もの]を取[と]って、その前[まえ]に携[たずさ]えて来[き]て、その聖[せい]なる庭[にわ]で主を拝[おが]めよ。"
  30: "全[ぜん]地[ち]よ、その前[まえ]に震[ふる]えよ。地[ち]は固[かた]く据[す]えられ、揺[ゆ]るがないように。"
  31: "天[てん]は喜[よろこ]べ、地[ち]は喜[よろこ]び躍[おど]れ。諸国[しょこく]の民[たみ]の間[あいだ]で『主[しゅ]は王[おう]となられた』と言[い]わせよ。"
  32: "海[うみ]とその中[なか]に満[み]ちるものは鳴[な]りとどろけ。野[の]の木[き]も、その上[うえ]にあるすべてのものも。"
  33: "そのとき、森[もり]の木々[きぎ]は主[しゅ]の前[まえ]で喜[よろこ]び躍[おど]る。主が地[ち]を裁[さば]くために来[こ]られたからである。"
  34: "主[しゅ]に感謝[かんしゃ]せよ。主[しゅ]は良[よ]い方[かた]、その慈[いつく]しみは永遠[えいえん]に絶[た]えない。"
  35: "そして言[い]え。『わたしたちを救[すく]ってください。わたしたちの救[すく]いの神[かみ]よ。わたしたちを集[あつ]め、諸国[しょこく]の民[たみ]から救[すく]い出[だ]して、あなたの聖[せい]なる名[な]をほめたたえ、あなたの賛美[さんび]を誇[ほこ]りとさせてください』と。"
  36: "イスラエルの神[かみ]、主[しゅ]は、とこしえからとこしえまでほむべきかな。民[たみ]はすべて『アーメン』と言[い]う。そして彼[かれ]らは主を賛美[さんび]した。」"
  37: "そこに、主[しゅ]の契約[けいやく]の箱[はこ]の前[まえ]に、アサフとその兄弟[きょうだい]たちを残[のこ]して、日[ひ]ごとに絶[た]えず箱の前で仕[つか]えさせた。"
  38: "またオベデ・エドムとその兄弟[きょうだい]たち、六十八人[ろくじゅうはちにん]を置[お]き、オベデ・エドム、すなわちエドトンの子[こ]と、オッサを門衛[もんえい]とした。"
  39: "祭司[さいし]サドクとその兄弟[きょうだい]である祭司たちを、ギベオンにある高[たか]き所[ところ]で、主[しゅ]の幕屋[まくや]の前[まえ]に置[お]いた。"
  40: "それは、朝[あさ]と夕[ゆう]べに絶[た]えず、燔祭[はんさい]の祭壇[さいだん]の上[うえ]で主[しゅ]に燔祭をささげ、主の律法[りっぽう]に書[か]かれているすべてのこと、すなわち神[かみ]のしもべモーセによってイスラエルの子[こ]らに命[めい]じられたすべてのことを行[おこな]うためであった。"
  41: "また彼[かれ]とともにエマン、エドトン、および名[な]を挙[あ]げて選[えら]ばれたほかの者[もの]たちを置[お]き、主[しゅ]をほめたたえさせた。その慈[いつく]しみは永遠[えいえん]に絶[た]えないからである。"
  42: "彼[かれ]らとともに、呼[よ]ばわるためのラッパとシンバル、および神[かみ]への歌[うた]のための楽器[がっき]があった。エドトンの子[こ]らは門[もん]に配置[はいち]された。"
  43: "民[たみ]はみな、それぞれ自分[じぶん]の家[いえ]へ帰[かえ]って行[い]った。ダビデもまた、自分の家を祝福[しゅくふく]するために帰った。"

notes:
  1: "εἰσήνεγκαν — внесли; ἀπηρείσαντο — поставили, утвердили (ἀπερείδω). ἐν μέσῳ τῆς σκηνῆς, ἧς ἔπηξεν αὐτῇ Δαυιδ — посреди скинии, которую поставил для неё Давид (πήγνυμι — 張る). προσήνεγκαν ὁλοκαυτώματα καὶ σωτηρίου — принесли всесожжения и спасительные [жертвы] (σωτήριον — 酬恩祭). ἐναντίον τοῦ θεοῦ — пред Богом; в csl «пред Господем» — принято 主の前で."
  2: "συνετέλεσεν … ἀναφέρων — окончил, принося (ἀναφέρω — возносить). εὐλόγησεν τὸν λαὸν ἐν ὀνόματι κυρίου — благословил народ именем Господним."
  3: "διεμέρισεν — разделил, роздал. ἀπὸ ἀνδρὸς καὶ ἕως γυναικὸς — от мужчины до женщины. ἄρτον ἕνα ἀρτοκοπικὸν — один печёный хлеб (ἀρτοκοπικός). ἀμορίτην — лепёшка, род печенья; csl «пряженый со елеем семидал» (жареное на масле из тонкой муки) — отсюда 上等の粉. Слав. в скобках «(и часть печена мяса)» — редакционное добавление из МТ, в текст не внесено (ср. 2 Цар 6:19)."
  4: "ἔταξεν — поставил. κατὰ πρόσωπον τῆς κιβωτοῦ διαθήκης κυρίου — пред ковчегом завета Господня. λειτουργοῦντας — служащих (λειτουργέω). ἀναφωνοῦντας — возглашающих (ἀναφωνέω). ἐξομολογεῖσθαι — исповедовать, благодарить. αἰνεῖν — хвалить. Слав. в скобках «(дела его)» — пояснение издания, не внесено."
  5: "Ασαφ ὁ ἡγούμενος — Асаф начальствующий (ἡγούμενος); δευτερεύων αὐτῷ — второй по нём. Имена: Ιιηλ — イエイル, Σεμιραμωθ — セミラモト, Ματταθιας — マタティア, Ελιαβ — エリアブ, Βαναιας — ベナヤ, Αβδεδομ — オベデ・エドム. ἐν ὀργάνοις, νάβλαις καὶ κινύραις — на инструментах, псалтирях и кинирах (νάβλα — 琴, κινύρα — 竪琴). ἐν κυμβάλοις ἀναφωνῶν — на кимвалах возглашая."
  6: "Βαναιας καὶ Οζιηλ οἱ ἱερεῖς — Ванея и Озиил, священники (オジエル). ἐν ταῖς σάλπιγξιν διὰ παντὸς — трубами постоянно (σάλπιγξ — ラッパ). Слав. в скобках «(трубиша)» — глагол, добавленный изданием для ясности; в тексте передан по смыслу."
  7: "Ἐν τῇ ἡμέρᾳ ἐκείνῃ τότε — в тот день тогда. ἐν ἀρχῇ τοῦ αἰνεῖν — в начале хвалить, т. е. впервые (初めて). ἐν χειρὶ Ασαφ καὶ τῶν ἀδελφῶν αὐτοῦ — рукою Асафа и братьев его, т. е. через них."
  8: "Ἐξομολογεῖσθε — благодарите, исповедуйте (ἐξομολογέομαι). ἐπικαλεῖσθε ἐν ὀνόματι αὐτοῦ — призывайте имя Его. γνωρίσατε ἐν λαοῖς τὰ ἐπιτηδεύματα αὐτοῦ — возвестите в народах дела Его (ἐπιτήδευμα — わざ). Слав. перед стихом добавляет надписание «Песнь» — рубрика псалма, в текст не внесена. С 8 по 36 — песнь Давида: 「…」."
  9: "ᾄσατε … ὑμνήσατε — пойте … воспевайте. διηγήσασθε πᾶσιν τὰ θαυμάσια αὐτοῦ — поведайте всем чудеса Его (θαυμάσιον — 奇跡). ἃ ἐποίησεν κύριος — которые сотворил Господь; в Пс 104:2 этих слов нет, поэтому там иначе."
  10: "αἰνεῖτε ἐν ὀνόματι ἁγίῳ αὐτοῦ — хвалитесь именем святым Его. εὐφρανθήσεται καρδία ζητοῦσα τὴν εὐδοκίαν αὐτοῦ — да возвеселится сердце, ищущее благоволения Его (εὐδοκία); в Пс 104:3 иначе — «ищущих Господа»."
  11: "ζητήσατε τὸν κύριον καὶ ἰσχύσατε — ищите Господа и укрепляйтесь. ζητήσατε τὸ πρόσωπον αὐτοῦ διὰ παντός — ищите лица Его всегда."
  12: "μνημονεύετε — вспоминайте. τέρατα καὶ κρίματα τοῦ στόματος αὐτοῦ — знамения и суды уст Его (τέρας — しるし)."
  13: "σπέρμα Ισραηλ παῖδες αὐτοῦ — семя Израиля, рабы Его (παῖς — раб, слуга); в Пс 104:6 на этом месте σπέρμα Αβρααμ — семя Авраама. υἱοὶ Ιακωβ ἐκλεκτοὶ αὐτοῦ — сыны Иакова, избранные Его."
  14: "αὐτὸς κύριος ὁ θεὸς ἡμῶν — Он Господь Бог наш. ἐν πάσῃ τῇ γῇ τὰ κρίματα αὐτοῦ — по всей земле суды Его."
  15: "μνημονεύων εἰς αἰῶνα διαθήκης αὐτοῦ — помнящий вовеки завет Его (причастие; слав. «Помянем» — императив, отсюда 覚えよ). λόγον αὐτοῦ, ὃν ἐνετείλατο εἰς χιλίας γενεάς — слово Его, которое заповедал в тысячи родов."
  16: "ὃν διέθετο τῷ Αβρααμ — которое завещал Аврааму (διατίθεμαι — заключать завет). τὸν ὅρκον αὐτοῦ τῷ Ισαακ — клятву Свою Исааку."
  17: "ἔστησεν αὐτὸν τῷ Ιακωβ εἰς πρόσταγμα — поставил его Иакову в повеление (πρόσταγμα — 定め). τῷ Ισραηλ διαθήκην αἰώνιον — Израилю завет вечный."
  18: "Σοὶ δώσω τὴν γῆν Χανααν — тебе дам землю Ханаанскую. σχοίνισμα κληρονομίας ὑμῶν — мерный шнур наследия вашего (σχοίνισμα — 測り縄, удел); слав. «уже достояния вашего». Слова Бога — 『…』 (внутри песни)."
  19: "ἐν τῷ γενέσθαι αὐτοὺς ὀλιγοστοὺς ἀριθμῷ — когда они стали немногочисленны числом (ὀλιγοστός). ὡς ἐσμικρύνθησαν — как умалились. παρῴκησαν ἐν αὐτῇ — поселились в ней (παροικέω — 寄留する)."
  20: "ἐπορεύθησαν ἀπὸ ἔθνους εἰς ἔθνος — переходили от народа к народу. ἀπὸ βασιλείας εἰς λαὸν ἕτερον — из царства к иному народу."
  21: "οὐκ ἀφῆκεν ἄνδρα τοῦ δυναστεῦσαι αὐτούς — не дал человеку притеснить их (δυναστεύω). ἤλεγξεν περὶ αὐτῶν βασιλεῖς — обличил за них царей."
  22: "Μὴ ἅψησθε τῶν χριστῶν μου — не прикасайтесь к помазанным Моим (χριστός здесь — помазанник, не Христос; 油を注がれた者). ἐν τοῖς προφήταις μου μὴ πονηρεύεσθε — пророкам Моим не делайте зла (πονηρεύομαι)."
  23: "ᾄσατε τῷ κυρίῳ, πᾶσα ἡ γῆ — пой Господу, вся земля. ἀναγγείλατε ἐξ ἡμέρας εἰς ἡμέραν σωτηρίαν αὐτοῦ — возвещайте изо дня в день спасение Его."
  24: "В gr-lxx-byz на месте стиха стоит «.» (лакуна), поэтому стих переведён по csl: «возвестите во языцех славу его, во всех людех чудеса его». Текст совпадает с Пс 95:3. В LXX 1 Пар 16:24 отсутствует."
  25: "μέγας κύριος καὶ αἰνετὸς σφόδρα — велик Господь и достохвален весьма (αἰνετός). φοβερός ἐστιν ἐπὶ πάντας τοὺς θεούς — страшен над всеми богами."
  26: "πάντες οἱ θεοὶ τῶν ἐθνῶν εἴδωλα — все боги народов — идолы (εἴδωλον — 偶像); в Пс 95:5 δαιμόνια — 悪霊, поэтому здесь иное слово. ὁ θεὸς ἡμῶν οὐρανὸν ἐποίησεν — Бог наш сотворил небо; в csl «Господь же наш небеса сотвори» — принято 主."
  27: "δόξα καὶ ἔπαινος κατὰ πρόσωπον αὐτοῦ — слава и хвала пред лицом Его. ἰσχὺς καὶ καύχημα ἐν τόπῳ αὐτοῦ — сила и похвала на месте Его (καύχημα — 誇り). В csl «слава и величество» (ἔπαινος понято иначе) и добавлено «в месте его святем» — внесено 聖なる."
  28: "δότε τῷ κυρίῳ, πατριαὶ τῶν ἐθνῶν — воздайте Господу, племена народов (πατριά — 氏族). δόξαν καὶ ἰσχύν — славу и силу (в Пс 95:7 τιμήν — честь)."
  29: "δόξαν ὀνόματος αὐτοῦ — славу имени Его. λάβετε δῶρα καὶ ἐνέγκατε — примите дары и принесите. κατὰ πρόσωπον αὐτοῦ — пред лицо Его. ἐν αὐλαῖς ἁγίαις αὐτοῦ — во дворах святых Его (αὐλή — 庭)."
  30: "φοβηθήτω ἀπὸ προσώπου αὐτοῦ πᾶσα ἡ γῆ — да убоится от лица Его вся земля. κατορθωθήτω ἡ γῆ καὶ μὴ σαλευθήτω — да утвердится земля и да не поколеблется (κατορθόω, σαλεύω)."
  31: "εὐφρανθήτω ὁ οὐρανός — да возвеселятся небеса. ἀγαλλιάσθω ἡ γῆ — да возрадуется земля. εἰπάτωσαν ἐν τοῖς ἔθνεσιν Κύριος βασιλεύων — да скажут в народах: Господь царствует (слова народов — 『…』)."
  32: "βομβήσει ἡ θάλασσα σὺν τῷ πληρώματι — возгласит море с полнотою своею (βομβέω — 鳴りとどろく; πλήρωμα — 満ちるもの). ξύλον ἀγροῦ καὶ πάντα τὰ ἐν αὐτῷ — дерево полевое и всё, что на нём; стих обрывается, продолжаясь в 33 (так же и в слав.)."
  33: "τότε εὐφρανθήσεται τὰ ξύλα τοῦ δρυμοῦ — тогда возвеселятся деревья дубравы (δρυμός — 森). ἀπὸ προσώπου κυρίου — от лица Господа. ὅτι ἦλθεν κρῖναι τὴν γῆν — ибо пришёл судить землю."
  34: "ἐξομολογεῖσθε τῷ κυρίῳ, ὅτι ἀγαθόν — благодарите Господа, ибо благ. εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — в век милость Его (慈しみ); ср. Пс 105:1."
  35: "Σῶσον ἡμᾶς, ὁ θεὸς τῆς σωτηρίας ἡμῶν — спаси нас, Боже спасения нашего. ἐξελοῦ ἡμᾶς ἐκ τῶν ἐθνῶν — изыми нас из народов (ἐξαιρέω). τοῦ αἰνεῖν τὸ ὄνομα τὸ ἅγιόν σου — чтобы хвалить имя святое Твоё. καυχᾶσθαι ἐν ταῖς αἰνέσεσίν σου — хвалиться хвалами Твоими. Слав. добавляет «и собери нас» (нет в LXX) — внесено: 集め."
  36: "εὐλογημένος κύριος ὁ θεὸς Ισραηλ — благословен Господь Бог Израилев. ἀπὸ τοῦ αἰῶνος καὶ ἕως τοῦ αἰῶνος — от века и до века. ἐρεῖ πᾶς ὁ λαός Αμην — скажет весь народ: аминь (『アーメン』). καὶ ᾔνεσαν τῷ κυρίῳ — и восхвалили Господа (в ru «аллилуия»). Здесь закрывается 「…」 песни."
  37: "κατέλιπον — оставили (3-е л. мн. ч., без названного субъекта; в ru «Давид оставил»). ἔναντι τῆς κιβωτοῦ — пред ковчегом. τοῦ λειτουργεῖν … διὰ παντὸς τὸ τῆς ἡμέρας εἰς ἡμέραν — служить постоянно, [что] дневное — изо дня в день."
  38: "Αβδεδομ καὶ οἱ ἀδελφοὶ αὐτοῦ, ἑξήκοντα καὶ ὀκτώ — Овед-Едом и братья его, шестьдесят восемь. Αβδεδομ υἱὸς Ιδιθων — Овед-Едом, сын Идифуна (エドトン). Οσσα — Осса (オッサ). εἰς πυλωρούς — в привратники (πυλωρός — 門衛); слав. в скобках «(поставлени)» — редакционная вставка, не внесена."
  39: "Σαδωκ τὸν ἱερέα — Садок священник. ἐναντίον σκηνῆς κυρίου — пред скиниею Господнею. ἐν Βαμα τῇ ἐν Γαβαων — в Баме, что в Гаваоне (Βαμα — «высота», 高き所; слав. «в вышних»); передано нарицательно, как в ru, с предлогом で при месте."
  40: "ἀναφέρειν ὁλοκαυτώματα … τὸ πρωῒ καὶ τὸ ἑσπέρας — возносить всесожжения … утром и вечером. ἐπὶ τοῦ θυσιαστηρίου τῶν ὁλοκαυτωμάτων — на жертвеннике всесожжений. κατὰ πάντα τὰ γεγραμμένα ἐν νόμῳ κυρίου — по всему написанному в законе Господнем (νόμος — 律法). ἐν χειρὶ Μωυσῆ τοῦ θεράποντος τοῦ θεοῦ — рукою Моисея, раба Божия (θεράπων — служитель)."
  41: "μετ᾿ αὐτοῦ Αιμαν καὶ Ιδιθων — с ним Еман и Идифун (エマン, エドトン). οἱ λοιποὶ ἐκλεγέντες ἐπ᾿ ὀνόματος — прочие избранные по имени (слав. «кийждо званием своим»). ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — ибо в век милость Его."
  42: "σάλπιγγες καὶ κύμβαλα τοῦ ἀναφωνεῖν — трубы и кимвалы для возглашения. ὄργανα τῶν ᾠδῶν τοῦ θεοῦ — инструменты для песен Божиих. υἱοὶ Ιδιθων εἰς τὴν πύλην — сыны Идифуна к воротам (в гр. нет глагола; слав. в скобках «(стояху)» — не внесено, отсюда 配置された)."
  43: "ἐπορεύθη ἅπας ὁ λαὸς ἕκαστος εἰς τὸν οἶκον αὐτοῦ — пошёл весь народ, каждый в дом свой. ἐπέστρεψεν Δαυιδ τοῦ εὐλογῆσαι τὸν οἶκον αὐτοῦ — возвратился Давид, чтобы благословить дом свой."
