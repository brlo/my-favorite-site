# jp-box, 1-я Паралипоменон, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); по паритету csl-ru — второй свидетель церковного
# текста: его чтения и добавления входят в основной текст без 〔…〕, отличия LXX — в notes.
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (943 стиха, под авторским правом) источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: перенесение ковчега, жертвы и раздача (1–3); левиты на службе (4–7);
# песнь Давида (8–36): 8–22 = Пс 104:1–15, 23–33 = Пс 95:1–13, 34 = Пс 105:1,
# 35–36 = Пс 105:47–48; служение пред ковчегом и в Гаваоне (37–43).
# Песнь — поэзия, целиком в 「…」 (открывается в 8, закрывается в 36); слова Бога
# в 18 и слова народа в 31, 35, 36 — вложенные 『…』. Красного нет.
# 〔…〕 нет. 16:24 в gr-lxx-byz — точка (лакуна), стих переведён по csl (см. notes).
# csl-добавления внесены: 16:35 «и собери нас». Пометы csl в скобках — редакционные
# (16:3 «часть печена мяса», 16:4 «дела его», 16:6 «трубиша», 16:42 «стояху») —
# не внесены, оговорены в notes. 16:8 слав. надписание «Песнь» как рубрика не внесено.
# Сносок ⟨…⟩ нет: 契約の箱, 燔祭, 酬恩祭, レビ人, 門衛, 祭司, 幕屋, 楽器 уже в корпусе.
# Отличия LXX/csl: 16:1 слав. «пред Господем» (LXX «пред Богом»); 16:26 εἴδωλα —
# 偶像 (в Пс 95:5 δαιμόνια — 悪霊); 16:27 слав. «величество» и «в месте его святем»;
# 16:39 Βαμα — «высота» (高き所). jp-ni не использовался.

