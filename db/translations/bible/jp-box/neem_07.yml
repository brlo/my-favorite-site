# jp-box, Неемия, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz): ezd 17 = Неем 7; контроль — церковнославянский
# (csl-ru), по паритету (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes);
# ru (Синодальный) — только для понимания, не источник. jp-ni в Неемии есть,
# но источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: окончена стена и поставлены двери (1–3); город малолюден (4);
# перепись возвратившихся (5–73): знатные с Зоровавелем (5–7), миряне по родам
# (8–38), священники (39–42), левиты (43), певцы (44), привратники (45),
# нефинеи (46–56), рабы Соломоновы (57–60), не доказавшие рода (61–65),
# итог и дары (66–72), расселение по городам (73).
# Речи нет, красного нет.
# Ст. 73 по греч. включает начало 8-й главы («наступил седьмой месяц»);
# в csl/ru эти слова открывают 8:1 — отмечено в notes.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 神殿, 祭司, レビ人, 歌い手, 門衛, 系図 уже в корпусе.
# Имена — транслитерация греческого (LXX); где принята форма корпуса
# или иная слав. форма, это сказано в notes.

tr_code: jp-box
book: neem
chapter: 7
draft: true

verses:
  1: "城壁[じょうへき]が建[た]てられ、私[わたし]が扉[とびら]を立[た]てたとき、門衛[もんえい]たち、歌[うた]い手[て]たち、レビ人[びと]たちが数[かぞ]えられた。"
  2: "私[わたし]は兄弟[きょうだい]ハナニと、城塞[じょうさい]の長[かしら]ハナニヤに命[めい]じた。彼[かれ]は多[おお]くの人[ひと]よりも真実[しんじつ]な人[ひと]で、神[かみ]を畏[おそ]れる者[もの]であったからである。"
  3: "私[わたし]は彼[かれ]らに言[い]った。「日[ひ]が昇[のぼ]るまで、エルサレムの門[もん]を開[ひら]いてはならない。彼[かれ]らがまだ見張[みは]りをしている間[あいだ]に、扉[とびら]を閉[と]じ、かんぬきを差[さ]し込[こ]めなさい。エルサレムに住[す]む者[もの]たちのうちから見張[みは]りを立[た]て、それぞれ自分[じぶん]の持[も]ち場[ば]に、またそれぞれ自分[じぶん]の家[いえ]の前[まえ]に置[お]きなさい。」"
  4: "町[まち]は広[ひろ]くて大[おお]きかったが、その中[なか]の民[たみ]は少[すく]なく、家[いえ]々[いえ]も建[た]てられていなかった。"
  5: "神[かみ]はこのことを私[わたし]の心[こころ]に置[お]き、私[わたし]は貴族[きぞく]たち、長[かしら]たち、民[たみ]を集[あつ]めて系図[けいず]にまとめた。すると、先[さき]に上[のぼ]って来[き]た者[もの]たちの系図[けいず]の書[しょ]が見[み]つかり、その中[なか]に次[つぎ]のように記[しる]されていた。"
  6: "次[つぎ]の者[もの]たちは、この地方[ちほう]の者[もの]たちで、バビロンの王[おう]ネブカドネツァルが移[うつ]した捕囚[ほしゅう]の民[たみ]のうちから上[のぼ]って来[き]て、エルサレムとユダに戻[もど]り、それぞれ自分[じぶん]の町[まち]へ帰[かえ]った者[もの]たちである。"
  7: "ゼルバベル、イエシュア、ネヘミヤ、アザルヤ、ダエミア、ナエマニ、モルデカイ、バルサン、マスファラト、エズラ、バゴイ、ナウム、バアナ、マスファルとともに来[き]た者[もの]たち、すなわちイスラエルの民[たみ]の男[おとこ]たちである。"
  8: "パロシュの子[こ]ら、二千百七十二人[にせんひゃくななじゅうににん]。"
  9: "サファティアの子[こ]ら、三百七十二人[さんびゃくななじゅうににん]。"
  10: "エラの子[こ]ら、六百五十二人[ろっぴゃくごじゅうににん]。"
  11: "パハト・モアブの子[こ]ら、すなわちイエシュアとヨアブの子[こ]ら、二千八百十八人[にせんはっぴゃくじゅうはちにん]。"
  12: "アイラムの子[こ]ら、千二百五十四人[せんにひゃくごじゅうよにん]。"
  13: "ザトゥアの子[こ]ら、八百四十五人[はっぴゃくよんじゅうごにん]。"
  14: "ザクの子[こ]ら、七百六十人[ななひゃくろくじゅうにん]。"
  15: "バヌイの子[こ]ら、六百四十八人[ろっぴゃくよんじゅうはちにん]。"
  16: "ベビの子[こ]ら、六百二十八人[ろっぴゃくにじゅうはちにん]。"
  17: "アスガドの子[こ]ら、二千三百二十二人[にせんさんびゃくにじゅうににん]。"
  18: "アデニカムの子[こ]ら、六百六十七人[ろっぴゃくろくじゅうななにん]。"
  19: "バゴイの子[こ]ら、二千六十七人[にせんろくじゅうななにん]。"
  20: "エディンの子[こ]ら、六百五十五人[ろっぴゃくごじゅうごにん]。"
  21: "エゼキヤの家[いえ]のアテルの子[こ]ら、九十八人[きゅうじゅうはちにん]。"
  22: "エサムの子[こ]ら、三百二十八人[さんびゃくにじゅうはちにん]。"
  23: "ベシの子[こ]ら、三百二十四人[さんびゃくにじゅうよにん]。"
  24: "アリフの子[こ]ら、百十二人[ひゃくじゅうににん]。"
  25: "ガバオンの者[もの]たち、九十五人[きゅうじゅうごにん]。"
  26: "ベツレヘムの子[こ]ら、百二十三人[ひゃくにじゅうさんにん]。ネトファの子[こ]ら、五十六人[ごじゅうろくにん]。"
  27: "アナトトの子[こ]ら、百二十八人[ひゃくにじゅうはちにん]。"
  28: "ベト・アズマベトの者[もの]たち、四十二人[よんじゅうににん]。"
  29: "キリアト・ヤリム、ケフィラ、ベエロトの者[もの]たち、七百四十三人[ななひゃくよんじゅうさんにん]。"
  30: "ラマとゲバの者[もの]たち、六百二十一人[ろっぴゃくにじゅういちにん]。"
  31: "ミクマスの者[もの]たち、百二十二人[ひゃくにじゅうににん]。"
  32: "ベテルとアイの者[もの]たち、百二十三人[ひゃくにじゅうさんにん]。"
  33: "ネボの者[もの]たち、すなわち別[べつ]のネボの者[もの]たち、五十二人[ごじゅうににん]。"
  34: "エラムの子[こ]ら、すなわち別[べつ]のエラムの者[もの]たち、千二百五十四人[せんにひゃくごじゅうよにん]。"
  35: "ハリムの子[こ]ら、三百二十人[さんびゃくにじゅうにん]。"
  36: "エリコの子[こ]ら、三百四十五人[さんびゃくよんじゅうごにん]。"
  37: "ロド、アディド、オノの子[こ]ら、七百二十一人[ななひゃくにじゅういちにん]。"
  38: "サナアの子[こ]ら、三千九百三十人[さんぜんきゅうひゃくさんじゅうにん]。"
  39: "祭司[さいし]たちは、イオダイの子[こ]ら、すなわちイエシュアの家[いえ]に属[ぞく]する者[もの]たち、九百七十三人[きゅうひゃくななじゅうさんにん]。"
  40: "エメルの子[こ]ら、千五十人[せんごじゅうにん]。"
  41: "パスクルの子[こ]ら、千二百四十七人[せんにひゃくよんじゅうななにん]。"
  42: "ハリムの子[こ]ら、千十七人[せんじゅうななにん]。"
  43: "レビ人[びと]は、イエシュア、すなわちカドミエルの子[こ]、オドウィアの子[こ]らのうちの者[もの]たち、七十四人[ななじゅうよにん]。"
  44: "歌[うた]い手[て]たちは、アサフの子[こ]ら、百四十八人[ひゃくよんじゅうはちにん]。"
  45: "門衛[もんえい]たちは、サロムの子[こ]ら、アテルの子[こ]ら、テルモンの子[こ]ら、アクブの子[こ]ら、アティタの子[こ]ら、サビの子[こ]ら、百三十八人[ひゃくさんじゅうはちにん]。"
  46: "ネティニムは、セアの子[こ]ら、アシファの子[こ]ら、タバオトの子[こ]ら、"
  47: "キラスの子[こ]ら、スイアの子[こ]ら、ファドンの子[こ]ら、"
  48: "ラバナの子[こ]ら、アガバの子[こ]ら、サラミの子[こ]ら、"
  49: "アナンの子[こ]ら、ガデルの子[こ]ら、ガアルの子[こ]ら、"
  50: "ラアイアの子[こ]ら、ラソンの子[こ]ら、ネコダの子[こ]ら、"
  51: "ゲザムの子[こ]ら、オジの子[こ]ら、フェセの子[こ]ら、"
  52: "ベシの子[こ]ら、メイノムの子[こ]ら、ネフォサシムの子[こ]ら、"
  53: "バクブクの子[こ]ら、アキファの子[こ]ら、アルルの子[こ]ら、"
  54: "バサロトの子[こ]ら、メイダの子[こ]ら、アダサンの子[こ]ら、"
  55: "バルクスの子[こ]ら、シサラの子[こ]ら、テマの子[こ]ら、"
  56: "ニシアの子[こ]ら、アティファの子[こ]ら。"
  57: "ソロモンの僕[しもべ]たちの子[こ]らは、ストの子[こ]ら、サファラトの子[こ]ら、フェリダの子[こ]ら、"
  58: "イエアレの子[こ]ら、ドルコンの子[こ]ら、ガデルの子[こ]ら、"
  59: "サファティアの子[こ]ら、エテルの子[こ]ら、ファハラトの子[こ]ら、サバイムの子[こ]ら、エミムの子[こ]ら。"
  60: "ネティニムと、ソロモンの僕[しもべ]たちの子[こ]らは、全部[ぜんぶ]で三百九十二人[さんびゃくきゅうじゅうににん]である。"
  61: "また、テルメレト、アレサ、ハルブ、エロン、イエメルから上[のぼ]って来[き]た者[もの]たちがいたが、彼[かれ]らは自分[じぶん]の父[ちち]の家[いえ]とその血統[けっとう]を告[つ]げることができず、イスラエルに属[ぞく]するかどうかも分[わ]からなかった。"
  62: "すなわち、ダライアの子[こ]ら、トビヤの子[こ]ら、ネコダの子[こ]ら、六百四十二人[ろっぴゃくよんじゅうににん]である。"
  63: "祭司[さいし]たちのうちでは、エビアの子[こ]ら、アコスの子[こ]ら、ベルゼリの子[こ]ら。この者[もの]はガラアデ人[じん]ベルゼリの娘[むすめ]たちから妻[つま]を迎[むか]え、その名[な]によって呼[よ]ばれた者[もの]である。"
  64: "彼[かれ]らは自分[じぶん]の系図[けいず]の記録[きろく]を求[もと]めたが、見[み]つからなかった。そこで彼[かれ]らは祭司[さいし]の職[しょく]から除[のぞ]かれた。"
  65: "アテルサタは彼[かれ]らに、光[ひかり]を示[しめ]す祭司[さいし]が立[た]つまで、聖[せい]なる聖[せい]なるもののうちから食[た]べてはならないと言[い]った。"
  66: "会衆[かいしゅう]は全部[ぜんぶ]で四万二千三百六十人[よんまんにせんさんびゃくろくじゅうにん]であった。"
  67: "そのほかに、彼[かれ]らの男女[だんじょ]の僕[しもべ]が七千三百三十七人[ななせんさんびゃくさんじゅうななにん]、歌[うた]い手[て]の男[おとこ]と女[おんな]が二百四十五人[にひゃくよんじゅうごにん]いた。"
  68: "馬[うま]は七百三十六頭[ななひゃくさんじゅうろくとう]、らばは二百四十五頭[にひゃくよんじゅうごとう]。"
  69: "らくだは四百三十五頭[よんひゃくさんじゅうごとう]、ろばは六千七百二十頭[ろくせんななひゃくにじゅうとう]。"
  70: "父[ちち]の家[いえ]の長[かしら]たちのうちのある者[もの]たちは、仕事[しごと]のために捧[ささ]げ物[もの]をした。アテルサタに、すなわち宝物庫[たからものこ]に、金[きん]千[せん]枚[まい]、鉢[はち]五十[ごじゅう]個[こ]、祭司[さいし]の衣[ころも]三十[さんじゅう]着[ちゃく]を納[おさ]めた。"
  71: "父[ちち]の家[いえ]の長[かしら]たちのある者[もの]たちは、その仕事[しごと]の宝物庫[たからものこ]に金[きん]二万[にまん]枚[まい]、銀[ぎん]二千二百[にせんにひゃく]ミナを入[い]れた。"
  72: "民[たみ]の残[のこ]りの者[もの]たちは、金[きん]二万[にまん]枚[まい]、銀[ぎん]二千二百[にせんにひゃく]ミナ、祭司[さいし]の衣[ころも]六十七[ろくじゅうなな]着[ちゃく]を捧[ささ]げた。"
  73: "祭司[さいし]たち、レビ人[びと]たち、門衛[もんえい]たち、歌[うた]い手[て]たち、民[たみ]の者[もの]たち、ネティニム、すなわち全[ぜん]イスラエルは、自分[じぶん]の町[まち]々[まち]に住[す]んだ。第七[だいしち]の月[つき]が来[き]て、イスラエルの子[こ]らは自分[じぶん]の町[まち]々[まち]にいた。"

notes:
  1: "ᾠκοδομήθη τὸ τεῖχος — была построена стена; ἔστησα τὰς θύρας — я поставил двери (θύρα — 扉). ἐπεσκέπησαν — «были пересмотрены, поставлены на смотр» (ἐπισκέπτομαι); слав. «сочтох» — «я пересчитал», отсюда 数えられた. πυλωροί — 門衛, ᾄδοντες — 歌い手, Λευῖται — レビ人."
  2: "ἐνετειλάμην — приказал (ἐντέλλομαι). В гр. имя Ананиа стоит дважды; в МТ это разные лица (Ханани, брат Неемии, и Ханания, начальник крепости), поэтому ハナニ и ハナニヤ. ἄρχων τῆς βιρα — начальник крепости (βιρα, евр. בִּירָה); слав. «началник дому» понял как «дом». ὡς ἀνὴρ ἀληθής — как муж истинный; φοβούμενος τὸν θεόν — боящийся Бога."
  3: "Οὐκ ἀνοιγήσονται — «не откроются» (буд. вр. в значении запрета). ἕως ἅμα τῷ ἡλίῳ — «до восхода солнца» (ἅμα τῷ ἡλίῳ — вместе с солнцем); слав. «дондеже взыдет солнце». ἔτι αὐτῶν γρηγορούντων — пока они ещё бодрствуют (γρηγορέω). σφηνούσθωσαν — пусть будут заперты на засов (σφηνόω, σφήν — клин). ἀνὴρ ἐν προφυλακῇ αὐτοῦ — каждый на своей страже."
  4: "ἡ πόλις πλατεῖα καὶ μεγάλη — город широкий и большой (πλατύς). ὀλίγος — малочисленный. οὐκ ἦσαν οἰκίαι ᾠκοδομημέναι — не было построенных домов (перфект пассива)."
  5: "ἔδωκεν ὁ θεὸς εἰς τὴν καρδίαν μου — Бог вложил в сердце моё. τοὺς ἐντίμους — знатных (ἔντιμος). εἰς συνοδίας — «в собрания», здесь о родословном списке (συνοδία передаёт евр. הִתְיַחֵשׂ); βιβλίον τῆς συνοδίας — книга родословия."
  6: "υἱοὶ τῆς χώρας — сыны страны, т.е. области (χώρα). ἀπὸ αἰχμαλωσίας τῆς ἀποικίας — из плена переселения (ἀποικία — выселение). ἧς ἀπῴκισεν — которое выселил. ἀνὴρ εἰς τὴν πόλιν αὐτοῦ — каждый в свой город."
  7: "μετὰ Ζοροβαβελ — с Зоровавелем. Гр. даёт 14 имён (в МТ 11): после Νεεμια стоят Αζαρια, Δαεμια (слав. «веелма»), Ναεμανι (слав. «наеман»), Μαρδοχαιος (モルデカイ), Βαλσαν, Μασφαραθ (マスファラト), затем Εσδρα, Βαγοι, Ναουμ, Βαανα, Μασφαρ. ἄνδρες λαοῦ Ισραηλ — мужи народа Израилева: заголовок к списку."
  8: "υἱοὶ Φορος — сыны Пароша (パロシュ; слав. «форосовы»). δισχίλιοι ἑκατὸν ἑβδομήκοντα δύο — 2172; у слав. то же. Счёт в гр. буквами, в тексте — кандзи."
  9: "Σαφατια — Сафатия (サファティア; слав. «сафатиевы»). τριακόσιοι ἑβδομήκοντα δύο — 372."
  10: "Ηρα — Арах (エラ; слав. «ираевы», ru «Араха»). ἑξακόσιοι πεντήκοντα δύο — 652."
  11: "Φααθμωαβ — Пахаф-Моав (パハト・モアブ; слав. «фааф-моавли»). τοῖς υἱοῖς Ἰησοῦ καὶ Ιωαβ — «сынам Иисуса и Иоава», т.е. род делится на две ветви; イエシュア, ヨアブ. δισχίλιοι ὀκτακόσιοι δέκα ὀκτώ — 2818."
  12: "Αιλαμ — Елам (アイラム; слав. «еламовы»). χίλιοι διακόσιοι πεντήκοντα τέσσαρες — 1254."
  13: "Ζαθουα — Заффу (ザトゥア; слав. «соффуевы», ru «Заффу»). ὀκτακόσιοι τεσσαράκοντα πέντε — 845."
  14: "Ζακχου — Закхай (ザク; слав. «заханевы», ru «Закхая»). ἑπτακόσιοι ἑξήκοντα — 760."
  15: "Βανουι — Биннуй (バヌイ; слав. «вануиевы», ru «Биннуя»). ἑξακόσιοι τεσσαράκοντα ὀκτώ — 648."
  16: "Βηβι — Бевай (ベビ; слав. «вереиевы», ru «Бевая»). ἑξακόσιοι εἴκοσι ὀκτώ — 628."
  17: "Ασγαδ — Азгад (アスガド; слав. «гетадовы», ru «Азгада»). δισχίλιοι τριακόσιοι εἴκοσι δύο — 2322."
  18: "Αδενικαμ — Адоникам (アデニカム; слав. «адоникамли»). ἑξακόσιοι ἑξήκοντα ἑπτά — 667."
  19: "Βαγοι — Бигвай (バゴイ; слав. «вагуиевы»). δισχίλιοι ἑξήκοντα ἑπτά — 2067; в ru «две тысячи шестьсот семь» (2607) — расхождение с гр. и слав."
  20: "Ηδιν — Адин (エディン; слав. «идини»). ἑξακόσιοι πεντήκοντα πέντε — 655; слав. читает «шесть сот пятьдесят четыри» (654), вероятно порча, держимся гр."
  21: "Ατηρ τῷ Εζεκια — Атер, из дома Езекии (アテル; слав. «атировы и сынове езекиевы»). ἐνενήκοντα ὀκτώ — 98."
  22: "Ησαμ — Хашум (エサム; слав. «исамиевы», ru «Хашума»). τριακόσιοι εἴκοσι ὀκτώ — 328."
  23: "Βεσι — Бецай (ベシ; слав. «васеиевы», ru «Вецая»). τριακόσιοι εἴκοσι τέσσαρες — 324."
  24: "Αριφ — Хариф (アリフ; слав. «арифовы»). ἑκατὸν δώδεκα — 112. Слав. добавляет здесь ещё «сынове асеновы двести двадесять три» (223) — в гр. этого рода нет, как порчу не вносим."
  25: "Γαβαων — Гаваон (ガバオン). ἐνενήκοντα πέντε — 95; это жители города, поэтому 者たち, а не «сыны»."
  26: "Βαιθλεεμ — Вифлеем (ベツレヘム), Νετωφα — Нетофа (ネトファ). В гр. оба счёта в одном стихе: 123 и 56; слав. так же, ru соединяет их в 188 и делит иначе."
  27: "Αναθωθ — Анафоф (アナトト). ἑκατὸν εἴκοσι ὀκτώ — 128."
  28: "Βηθασμωθ — Беф-Азмавеф (ベト・アズマベト; слав. «азамофовы, мужие вифовы»). τεσσαράκοντα δύο — 42."
  29: "Καριαθιαριμ, Καφιρα, Βηρωθ — Кириаф-Иарим, Кефира, Беероф (キリアト・ヤリム, ケフィラ, ベエロト). ἑπτακόσιοι τεσσαράκοντα τρεῖς — 743."
  30: "Αραμα καὶ Γαβαα — Рама и Гева (ラマ, ゲバ; слав. «арама и гаваа»). ἑξακόσιοι εἴκοσι εἷς — 621."
  31: "Μαχεμας — Михмас (ミクマス; слав. «махимасовы»). ἑκατὸν εἴκοσι δύο — 122."
  32: "Βηθηλ καὶ Αια — Вефиль и Гай (ベテル, アイ). ἑκατὸν εἴκοσι τρεῖς — 123. Слав. добавляет в этот стих «мужие анавиа другаго сто пятьдесят два» — начало следующего счёта (52), см. ст. 33."
  33: "ἄνδρες Ναβι — ααρ — «люди Нево, (ααρ)»: в издании помета ααρ, вероятно сокращение «другого» (слав. «другаго»). πεντήκοντα δύο — 52; слав. в ст. 33 читает «мегевосовы сто пятьдесят шесть» (156) — порча, в текст не внесена. В тексте «別のネボ» по смыслу."
  34: "ἄνδρες Ηλαμ — ααρ — «люди Елама, другого» (та же помета); χίλιοι διακόσιοι πεντήκοντα τέσσαρες — 1254; слав. «тысяща двести пятьдесят два» (1252) — расхождение, держимся гр. и ru."
  35: "Ηραμ — Харим (ハリム по ru и МТ; в гр. Ηραμ, отсюда слав. «ирамли»). τριακόσιοι εἴκοσι — 320."
  36: "Ιεριχω — Иерихон (エリコ). τριακόσιοι τεσσαράκοντα πέντε — 345."
  37: "Λοδ, Αδιδ, Ωνω — Лод, Хадид, Оно (ロド, アディド, オノ). ἑπτακόσιοι εἴκοσι εἷς — 721."
  38: "Σαναα — Сеная (サナア; слав. «ананини», ru «Сенаи»). τρισχίλιοι ἐννακόσιοι τριάκοντα — 3930."
  39: "οἱ ἱερεῖς — заголовок раздела, 祭司たち. Ιωδαε εἰς οἶκον Ἰησοῦ — Иодай, «в дом Иисусов» (εἰς οἶκον — к дому, т.е. из рода Иешуа); イオダイ. ἐννακόσιοι ἑβδομήκοντα τρεῖς — 973."
  40: "Εμμηρ — Иммер (エメル; слав. «еммировы»). χίλιοι πεντήκοντα δύο — 1052."
  41: "Φασσουρ — Пашхур (パスクル, форма 1 Пар 9:12; слав. «фассеуровы»). χίλιοι διακόσιοι τεσσαράκοντα ἑπτά — 1247."
  42: "Ηραμ — Харим (ハリム; слав. «ирамовы»). χίλιοι δέκα ἑπτά — 1017."
  43: "οἱ Λευῖται — заголовок, レビ人. Ἰησοῦ τῷ Καδμιηλ τοῖς υἱοῖς τοῦ Ουδουια — Иешуа, сын Кадмиила, из сынов Годевы (イエシュア, カドミエル, オドウィア); конструкция гр. сбита, передана по смыслу. ἑβδομήκοντα τέσσαρες — 74."
  44: "οἱ ᾄδοντες — заголовок, 歌い手. υἱοὶ Ασαφ — сыны Асафа (アサフ). ἑκατὸν τεσσαράκοντα ὀκτώ — 148; слав. «сто двадесять осмь» (128) — расхождение, держимся гр. и ru."
  45: "οἱ πυλωροί — заголовок, 門衛. Σαλουμ, Ατηρ, Τελμων, Ακουβ, Ατιτα, Σαβι — Саллум, Атер, Телмон, Аккув, Хатита, Шовай (サロム, アテル, テルモン, アクブ, アティタ, サビ). ἑκατὸν τριάκοντα ὀκτώ — 138."
  46: "οἱ ναθινιμ — «отданные», храмовые служители (евр. נְתִינִים); в Неемии передано ネティニム, как в 3:26 (в 1 Пар 9:2 — описательно). Σηα, Ασιφα, Ταβαωθ — Сеа, Хасифа, Таббаоф (セア, アシファ, タバオト)."
  47: "Κιρας, Σουια, Φαδων — Кир, Сиа, Фадон (キラス, スイア, ファドン)."
  48: "Λαβανα, Αγαβα, Σαλαμι — Левана, Хагава, Салмай (ラバナ, アガバ, サラミ)."
  49: "Αναν, Γαδηλ, Γααρ — Ханан, Гиддел, Гахар (アナン, ガデル, ガアル)."
  50: "Ρααια, Ρασων, Νεκωδα — Реаия, Рецин, Некода (ラアイア, ラソン, ネコダ)."
  51: "Γηζαμ, Οζι, Φεση — Газзам, Узза, Пасеах (ゲザム, オジ, フェセ)."
  52: "Βησι, Μεινωμ, Νεφωσασιμ — Бесай, Меуним, Нефишсим (ベシ, メイノム, ネフォサシム)."
  53: "Βακβουκ, Αχιφα, Αρουρ — Бакбук, Хакуфа, Хархур (バクブク, アキファ, アルル)."
  54: "Βασαλωθ, Μειδα, Αδασαν — Бацлиф, Мехида, Харша (バサロト, メイダ, アダサン)."
  55: "Βαρκους, Σισαρα, Θημα — Баркос, Сисера, Фамах (バルクス, シサラ, テマ)."
  56: "Νισια, Ατιφα — Нециах, Хатифа (ニシア, アティファ). Список нефинеев окончен."
  57: "υἱοὶ δούλων Σαλωμων — сыны рабов Соломоновых, ソロモンの僕たちの子ら. Σουτι, Σαφαραθ, Φεριδα — Сотай, Софереф, Ферида (スト, サファラト, フェリダ)."
  58: "Ιεαλη, Δορκων, Γαδηλ — Иаала, Даркон, Гиддел (イエアレ, ドルコン, ガデル)."
  59: "Σαφατια, Ετηλ, Φαχαραθ, Σαβαιμ, Ημιμ — Сафатия, Хаттил, Похереф-Гаццеваим, Амон (サファティア, エテル, ファハラト, サバイム, エミム); в гр. пять имён, в ru они разнесены по ст. 58–59."
  60: "πάντες οἱ ναθινιμ καὶ υἱοὶ δούλων Σαλωμων — все нефинеи и сыны рабов Соломоновых. τριακόσιοι ἐνενήκοντα δύο — 392."
  61: "ἀνέβησαν ἀπὸ Θελμελεθ, Αρησα, Χαρουβ, Ηρων, Ιεμηρ — вышли из Тель-Мелаха, Тель-Харши, Херув-Аддона, Иммера (テルメレト, アレサ, ハルブ, エロン, イエメル): это названия мест, не родов. οὐκ ἠδυνάσθησαν ἀπαγγεῖλαι οἴκους πατριῶν αὐτῶν — не могли объявить домов отцов своих. σπέρμα — семя, род (血統)."
  62: "Δαλαια, Τωβια, Νεκωδα — Делаия, Товия, Некода (ダライア, トビヤ, ネコダ). ἑξακόσιοι τεσσαράκοντα δύο — 642."
  63: "Εβια, Ακως, Βερζελλι — Ховаия, Гаккоц, Верзеллий (エビア, アコス, ベルゼリ). ὅτι ἔλαβεν ἀπὸ θυγατέρων Βερζελλι τοῦ Γαλααδίτου γυναῖκας — ибо взял жену из дочерей Верзеллия Галаадитянина (ガラアデ人 — галиадитянин). ἐκλήθη ἐπ᾽ ὀνόματι αὐτῶν — назван их именем."
  64: "γραφὴν αὐτῶν τῆς συνοδίας — запись их родословия. οὐχ εὑρέθη — не нашлась. ἠγχιστεύθησαν ἀπὸ τῆς ἱερατείας — были отстранены (букв. «отчуждены») от священства; слав. «извержени суть»."
  65: "Αθερσαθα — титул персидского наместника (תִּרְשָׁתָא), не имя; поэтому оставлен как есть, アテルサタ. ἵνα μὴ φάγωσιν ἀπὸ τοῦ ἁγίου τῶν ἁγίων — чтобы не ели от святая святых. ἕως ἀναστῇ ὁ ἱερεὺς φωτίσων — пока не восстанет священник, «просвещающий»: имеется в виду священник с уримом и туммимом (слав. «изявляяй»), отсюда 光を示す祭司."
  66: "πᾶσα ἡ ἐκκλησία ὡς εἷς — всё общество как один (ἐκκλησία — собрание; 会衆). τέσσαρες μυριάδες δισχίλιοι τριακόσιοι ἑξήκοντα — 42 360."
  67: "παρὲξ δούλων αὐτῶν καὶ παιδισκῶν — кроме рабов и рабынь. ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά — 7337. ᾄδοντες καὶ ᾄδουσαι — поющие мужчины и женщины (певцы и певицы). διακόσιοι τεσσαράκοντα πέντε — 245; слав. «двести тридесять шесть» (236) — расхождение, держимся гр. и ru."
  68: "ἵπποι ἑπτακόσιοι τριάκοντα ἕξ — 736 коней; ἡμίονοι διακόσιοι τεσσαράκοντα πέντε — 245 мулов (らば)."
  69: "κάμηλοι τετρακόσιοι τριάκοντα πέντε — 435 верблюдов; ὄνοι ἑξακισχίλιοι ἑπτακόσιοι εἴκοσι — 6720 ослов. В ряде рукописей ст. 68 отсутствует (в МТ его нет); в базе он есть, переведён."
  70: "ἀπὸ μέρους ἀρχηγῶν τῶν πατριῶν — из части глав отечеств, т.е. некоторые из них. εἰς τὸ ἔργον τῷ Νεεμια — на дело, отданное Неемии (тиршате): он назван получателем, а не распорядителем. χρυσοῦς χιλίους — тысячу золотых (дариков); φιάλας πεντήκοντα — 50 чаш; χοθωνωθ τῶν ἱερέων τριάκοντα — 30 священнических одежд (χοθωνωθ, евр. כֻּתֹּנֶת). В ru «пятьсот тридцать одежд» — иное чтение, в гр. и слав. 30."
  71: "ἀργυρίου μνᾶς δισχιλίας διακοσίας — 2200 мин серебра; слав. «две тысящы и триста» (2300) — расхождение, держимся гр. и ru. χρυσίου δύο μυριάδας — 20 000 золотых."
  72: "οἱ κατάλοιποι τοῦ λαοῦ — остаток народа (слав. «прочии людие»). χρυσίου δύο μυριάδας — 20 000; ἀργυρίου μνᾶς δισχιλίας διακοσίας — 2200 мин; χοθωνωθ τῶν ἱερέων ἑξήκοντα ἑπτά — 67 одежд."
  73: "καὶ ἐκάθισαν — и сели (жить), 住んだ. οἱ ἀπὸ τοῦ λαοῦ — «из народа», простые люди. οἱ ναθινιμ — храмовые служители (ネティニム). Καὶ ἔφθασεν ὁ μὴν ὁ ἕβδομος — «и наступил седьмой месяц»: по греч. делению это конец 7-й главы, в csl/ru — начало 8:1; поэтому здесь и там не повторяется."
