# jp-box, Псалтирь, псалом 1. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..N.
# Красного и синего нет: прямая речь Христа и Богородицы в псалме не звучит.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 律法, 裁き, 集い уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 1
draft: true

verses:
  1: "ダビデの詩[うた]。幸[さいわ]いなのは、悪[わる]い者[もの]の計[はかりごと]に従[したが]って歩[あゆ]まず、罪[つみ]人[びと]の道[みち]に立[た]たず、嘲[あざけ]る者[もの]の座[ざ]に着[つ]かない人[ひと]である。"
  2: "その人[ひと]の喜[よろこ]びは主[しゅ]の律法[りっぽう]にあり、昼[ひる]も夜[よる]もその律法[りっぽう]を思[おも]い巡[めぐ]らす。"
  3: "その人[ひと]は、水路[すいろ]のそばに植[う]えられた木[き]のようになり、季[き]節[せつ]が来[く]ると実[み]を結[むす]び、葉[は]も枯[か]れることがない。その人[ひと]のすべきことは、すべてうまく進[すす]む。"
  4: "悪[わる]い者[もの]はそうではない。風[かぜ]が吹[ふ]き飛[と]ばすもみ殻[がら]のようである。"
  5: "それゆえ、悪[わる]い者[もの]は裁[さば]きの場[ば]に立[た]つことができず、罪[つみ]人[びと]は正[ただ]しい者[もの]の集[つど]いに加[くわ]わることができない。"
  6: "主[しゅ]は正[ただ]しい者[もの]の道[みち]を知[し]っておられ、悪[わる]い者[もの]の道[みち]は滅[ほろ]びるからである。"

notes:
  1: "В gr-lxx-byz надписания у Пс 1 нет, но в славянской и русской традиции (ru-база сайта) стоит «Псалом Давида»; надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1), поэтому поставлено ダビデの詩 без 〔…〕 (надписания не маркируются скобками). Μακάριος ἀνήρ — 幸いなのは…人である (μακάριος — «блажен»; в псалмах передаётся 幸いなのは…で、стих начинается с именного сказуемого, как в евр.). ὃς οὐκ ἐπορεύθη ἐν βουλῇ ἀσεβῶν — 悪い者の計らいに従って歩まず (βουλή — «совет, замысел»). ἐν ὁδῷ ἁμαρτωλῶν οὐκ ἔστη — 罪人の道に立たず. ἐπὶ καθέδραν λοιμῶν οὐκ ἐκάθισεν — 嘲る者の座に着かず (λοιμός — «насмешник, кощун»; 座[ざ] — кафедра). Три глагола — три ступени: пошёл, стал, сел; сохранены."
  2: "ἀλλ᾽ ἢ ἐν τῷ νόμῳ κυρίου τὸ θέλημα αὐτοῦ — その人の喜びは主の律法にあり (θέλημα — «воля, желание»). ἐν τῷ νόμῳ αὐτοῦ μελετήσει ἡμέρας καὶ νυκτός — 昼も夜もその律法を思い巡らす (μελετάω — «размышлять, повторять шёпотом»). 律法[りっぽう] — νόμος, как по всему корпусу."
  3: "ὡς τὸ ξύλον τὸ πεφυτευμένον παρὰ τὰς διεξόδους τῶν ὑδάτων — 水路のそばに植えられた木のように (διέξοδος — «проток, канал»). ὃ τὸν καρπὸν αὐτοῦ δώσει ἐν καιρῷ αὐτοῦ — 季節が来ると実を結び. τὸ φύλλον αὐτοῦ οὐκ ἀπορρυήσεται — 葉も枯れることがない. πάντα ὅσα ἂν ποιῇ κατευοδωθήσεται — すべきことはすべてうまく進む (κατευοδόω — «приводить к успеху»; не «преуспевает» в смысле богатства)."
  4: "οὐχ οὕτως οἱ ἀσεβεῖς, οὐχ οὕτως — 悪い者はそうではない, повтор отрицания сохранён одним そうではない (по-японски повтор звучал бы как заикание). ὡς ὁ χνοῦς ὃν ἐκριπτεῖ ὁ ἄνεμος — 風が吹き飛ばすもみ殻のよう (χνοῦς — «мякина, пыль»)."
  5: "διὰ τοῦτο οὐκ ἀναστήσονται ἀσεβεῖς ἐν κρίσει — 悪い者は裁きの場に立つことができず (ἀναστήσονται — «встанут, устоят»). οὐδὲ ἁμαρτωλοὶ ἐν βουλῇ δικαίων — 罪人は正しい者の集いに加わることができない (βουλή δικαίων — собрание, совет праведных)."
  6: "ὅτι γινώσκει κύριος ὁδὸν δικαίων — 主は正しい者の道を知っておられる (γινώσκω — «знать» в смысле «принимать, хранить»). ὁδὸς ἀσεβῶν ἀπολεῖται — 悪い者の道は滅びる. Оба 道[みち] сохранены."
