# jp-box, Сирах, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: осторожность в отношениях с сильными, богатыми, дерзкими на язык,
# невеждами, стариками, грешниками (1–14); предостережения от опасных спутников,
# глупцов, чужих и от излишней откровенности (15–19). Всё — авторское поучение,
# прямой речи нет, кавычек нет.
# Нумерация по gr: 19 стихов. Слав. 22: csl 8:2–3 делят гр. 8:2; csl 8:9–10
# делят гр. 8:8; csl 8:11–12 делят гр. 8:9; дальше сдвиг на три номера
# (csl 8:13 = гр. 8:10 … csl 8:22 = гр. 8:19). Держимся деления gr; лишних
# стихов нет.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имён в главе нет.

tr_code: jp-box
book: prsir
chapter: 8
draft: true

verses:
  1: "力[ちから]ある人[ひと]と争[あらそ]うな。その手[て]に落[お]ちるかもしれないからである。"
  2: "富[とみ]ある人[ひと]と争[あらそ]うな。その人があなたに対して重[おも]みを増[ま]すかもしれないからである。金[きん]は多[おお]くの者[もの]を滅[ほろ]ぼし、王[おう]たちの心[こころ]を曲[ま]げてきた。"
  3: "口[くち]の達者[たっしゃ]な人[ひと]と争[あらそ]うな。その火[ひ]に薪[まき]を積[つ]み重[かさ]ねるな。"
  4: "教[おし]えのない者[もの]とふざけるな。あなたの先祖[せんぞ]が辱[はずかし]められるからである。"
  5: "罪[つみ]から離[はな]れようとしている人[ひと]を責[せ]めるな。わたしたちは皆[みな]、懲[こ]らしめの下[した]にあることを覚[おぼ]えておけ。"
  6: "年老[としお]いた人[ひと]を辱[はずかし]めるな。わたしたちもまた老[お]いていくからである。"
  7: "あなたに最も敵対[てきたい]していた者[もの]でも、死[し]んだなら喜[よろこ]ぶな。わたしたちは皆[みな]死ぬことを覚[おぼ]えておけ。"
  8: "賢[かしこ]い者[もの]たちの語[かた]りを蔑[ないがし]ろにするな。その格言[かくげん]のうちに生[い]きよ。彼[かれ]らから教[おし]えを学[まな]び、高官[こうかん]たちに仕[つか]えるすべを学ぶからである。"
  9: "老人[ろうじん]たちの語[かた]りを逃[のが]すな。彼[かれ]らもまた、自分[じぶん]の父[ちち]たちから学[まな]んだのである。あなたは彼らから悟[さと]りを得[え]、必要[ひつよう]な時[とき]に答[こた]えることを学ぶからである。"
  10: "罪人[つみびと]の炭火[すみび]を燃[も]え立[た]たせるな。その炎[ほのお]の火[ひ]に焼[や]かれるからである。"
  11: "横柄[おうへい]な者[もの]に立[た]ち向[む]かうな。その者があなたの口[くち]に罠[わな]を仕掛[しか]けることのないように。"
  12: "あなたより強[つよ]い人[ひと]に金[きん]を貸[か]すな。貸すなら、失[うしな]ったものとして思[おも]え。"
  13: "あなたの力[ちから]を超[こ]えて保証人[ほしょうにん]になるな。なるなら、返[かえ]す義務[ぎむ]がある者[もの]として心[こころ]を配[くば]れ。"
  14: "裁[さば]き手[て]と争[あらそ]うな。その人[ひと]の判断[はんだん]に応[おう]じて、その人のために裁きがなされるからである。"
  15: "大胆[だいたん]な者[もの]と道[みち]を行[ゆ]くな。その者があなたの重荷[おもに]となるからである。その者は自分[じぶん]の望[のぞ]みのままに行[おこな]い、あなたはその愚[おろ]かさのゆえに共[とも]に滅[ほろ]びる。"
  16: "怒[いか]りっぽい者[もの]と争[あらそ]いを起[お]こすな。その者と荒野[こうや]を行[ゆ]くな。その目[め]には血[ち]が何[なに]でもないからである。助[たす]けのない所[ところ]で、その者はあなたを倒[たお]す。"
  17: "愚[おろ]かな者[もの]と相談[そうだん]するな。その者は言葉[ことば]を秘[ひ]めておけないからである。"
  18: "他人[たにん]の前[まえ]で隠[かく]し事[ごと]をするな。それが何[なに]を生[う]むか、あなたは知[し]らないからである。"
  19: "すべての人[ひと]にあなたの心[こころ]を明[あ]かすな。その人が偽[いつわ]りの感謝[かんしゃ]であなたに報[むく]いることのないように。"

notes:
  1: "μὴ διαμάχου — «не ссорься, не спорь» (διαμάχομαι); ἀνθρώπου δυνάστου — «с человеком сильным, властным» (δυνάστης); μήποτε ἐμπέσῃς εἰς τὰς χεῖρας αὐτοῦ — «как бы не впасть в руки его»."
  2: "μὴ ἔριζε — «не тяжись, не спорь» (ἐρίζω); ἀντιστήσῃ σου τὴν ὁλκήν — «противопоставит тебе вес, перевес» (ὁλκή — тяга, вес; слав. «меру»); τὸ χρυσίον — золото; καρδίας βασιλέων ἐξέκλινεν — «сердца царей склонило» (ἐκκλίνω). Слав. 8:2–3 делят стих; здесь обе половины."
  3: "γλωσσώδης — «языкастый, дерзкий на язык» (слав. «язычный»); ἐπιστοιβάσῃς ἐπὶ τὸ πῦρ αὐτοῦ ξύλα — «наложишь дров на огонь его» (ἐπιστοιβάζω)."
  4: "μὴ πρόσπαιζε — «не шути, не забавляйся» (προσπαίζω); ἀπαιδεύτῳ — «невежде»; ἀτιμάζωνται οἱ πρόγονοί σου — «бесчестятся предки твои» (ἀτιμάζω, πρόγονος)."
  5: "μὴ ὀνείδιζε — «не укоряй, не поноси» (ὀνειδίζω); ἀποστρέφοντα ἀπὸ ἁμαρτίας — «обращающегося от греха»; ἐν ἐπιτίμοις — «под наказаниями, епитимиями» (ἐπιτίμια), передано 懲らしめの下; слав. «во епитимиах»."
  6: "μὴ ἀτιμάσῃς ἄνθρωπον ἐν γήρᾳ αὐτοῦ — «не бесчести человека в старости его» (γῆρας); ἐξ ἡμῶν γηράσκουσιν — «и из нас стареют» (γηράσκω)."
  7: "μὴ ἐπίχαιρε ἐπὶ νεκρῷ — «не радуйся над мёртвым» (ἐπιχαίρω); πάντες τελευτῶμεν — «все умираем» (τελευτάω). Слав. добавляет «бывшем враждебнейшем тебе» — «даже если он был самым враждебным тебе»; в LXX этих слов нет, но по паритету они внесены в основной текст."
  8: "μὴ παρίδῃς διήγημα σοφῶν — «не пренебреги повестью мудрых» (παροράω, διήγημα); ἐν ταῖς παροιμίαις αὐτῶν ἀναστρέφου — «в притчах их вращайся, живи» (ἀναστρέφω); λειτουργῆσαι μεγιστᾶσιν — «служить вельможам» (μεγιστάν). Слав. 8:9–10 делят стих; здесь обе половины."
  9: "μὴ ἀστόχει διηγήματος γερόντων — «не промахнись мимо повести старцев» (ἀστοχέω); παρὰ τῶν πατέρων — «от отцов»; σύνεσις — разумение; ἐν καιρῷ χρείας δοῦναι ἀπόκρισιν — «в нужное время дать ответ». Слав. 8:11–12 делят стих; здесь обе половины."
  10: "μὴ ἔκκαιε ἄνθρακας ἁμαρτωλοῦ — «не разжигай углей грешника» (ἐκκαίω, ἄνθραξ); μὴ ἐμπυρισθῇς — «не сгоришь» (ἐμπυρίζω); φλόξ — пламя. Слав. «не возгнещай углия грешнику»."
  11: "μὴ ἐξαναστῇς ἀπὸ προσώπου ὑβριστοῦ — «не поднимайся против лица дерзкого, наглого» (ἐξανίστημι, ὑβριστής); слав. «не востани на лице досадителево» — то же; ἐγκαθίσῃ ὡς ἔνεδρον τῷ στόματί σου — «сядет как засада у рта твоего» (ἔνεδρον — засада), т. е. подстережёт тебя в словах."
  12: "μὴ δανείσῃς — «не дай взаймы» (δανείζω); ἰσχυροτέρῳ σου — «более сильному, чем ты»; ὡς ἀπολωλεκὼς γίνου — «будь как потерявший» (ἀπόλλυμι), т. е. считай деньги пропавшими."
  13: "μὴ ἐγγυήσῃ ὑπὲρ δύναμίν σου — «не поручайся сверх силы твоей» (ἐγγυάω); ὡς ἀποτείσων φρόντιζε — «заботься, как о том, кто должен заплатить» (ἀποτίνω)."
  14: "μὴ δικάζου μετὰ κριτοῦ — «не судись с судьёй» (δικάζομαι); κατὰ τὴν δόξαν αὐτοῦ — «по славе, мнению его» (δόξα); слав. «по разсуждению бо его будут судити ему» — «по его рассуждению», поэтому в тексте 判断; κρινοῦσιν αὐτῷ — «будут судить ему», т. е. в его пользу."
  15: "μετὰ τολμηροῦ — «с дерзким, отважным» (τολμηρός); βαρύνηται κατὰ σοῦ — «отяготится против тебя» (βαρύνω); κατὰ τὸ θέλημα αὐτοῦ ποιήσει — «по воле своей сделает»; τῇ ἀφροσύνῃ αὐτοῦ συναπολῇ — «с безумием его погибнешь» (συναπόλλυμαι)."
  16: "θυμώδης — «вспыльчивый, яростный»; μὴ ποιήσῃς μάχην — «не заводи ссоры»; διαπορεύου τὴν ἔρημον — «проходи пустыню»; ὡς οὐδὲν ἐν ὀφθαλμοῖς αὐτοῦ αἷμα — «как ничто в глазах его кровь»; καταβαλεῖ σε — «низложит тебя» (καταβάλλω)."
  17: "μετὰ μωροῦ μὴ συμβουλεύου — «с глупым не советуйся»; οὐ δυνήσεται λόγον στέξαι — «не сможет слова удержать, сохранить в тайне» (στέγω — держать, покрывать)."
  18: "ἐνώπιον ἀλλοτρίου — «пред чужим» (ἀλλότριος); μὴ ποιήσῃς κρυπτόν — «не делай тайного»; οὐ γινώσκεις τί τέξεται — «не знаешь, что родится» (τίκτω), т. е. чем это обернётся."
  19: "μὴ ἔκφαινε σὴν καρδίαν — «не открывай сердца твоего» (ἐκφαίνω); μὴ ἀναφερέτω σοι χάριν — «пусть не принесёт тебе благодарности»; слав. «да не воздаст ти благодати ложныя» — «ложной благодарности», передано 偽りの感謝."
