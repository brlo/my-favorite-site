# jp-box, Иезекииль, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в этой главе gr, csl и ru совпадают: 17 стихов.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
# Содержание: 1–7 Аммон — радость о поругании святыни и пленении, отдан сынам
# востока, Равва — пастбище верблюдов; 8–11 Моав и Сеир — «как все народы»,
# разрушение городов и суд; 12–14 Едом (Идумея) — злопамятное мщение, рука Израиля;
# 15–17 филистимляне (Критяне) — вечная вражда, истребление остатка на побережье.
# Речи: 1 — формула вне кавычек; 2–17 — одна непрерывная речь Господа в 「…»;
# в 8 слова Моава и Сеира — 『…』. Формулы «так говорит Господь» внутри речи.
# Паритет: 25:3 ru/МТ добавляет возглас «а! а!» — в LXX нет; 25:8 слав. добавляет
# «и сиир» (セイル) — нет в LXX, внесено без скобок; 25:9 слав. в скобках добавляет
# «(ваелмона и кариафаима)» — редакционная вставка, не перенесена; 25:13 слав.
# «гоними» при греч. «падут», ru/МТ добавляет «до Дедана» — в LXX нет.
# Имена: アンモン人, モアブ, セイル, イドマヤ (Ιδουμαια, ср. Ис 34; エドム — для Εδωμ),
# テマン, ペリシテ人, クレタ人, アシムト (Ασιμουθ), ラバ (Равва, ср. 2 Цар 11–12).

