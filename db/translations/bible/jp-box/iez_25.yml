verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]われた。"
  2: "「人[ひと]の子[こ]よ、あなたの顔[かお]をアンモン人[じん]の子[こ]らに向[む]け、彼らについて預言[よげん]せよ。"
  3: "アンモン人[じん]の子[こ]らに言[い]え。主[しゅ]なる神[かみ]の言葉[ことば]を聞[き]け。主[しゅ]なる神[かみ]はこう言[い]われる。あなたがたが、わたしの聖所[せいしょ]が汚[けが]されたこと、イスラエルの地[ち]が荒[あ]れたこと、ユダの家[いえ]が捕囚[ほしゅ]となって行[い]ったことを喜[よろこ]んだゆえに。"
  4: "それゆえ、見[み]よ、わたしはあなたがたを東[ひがし]の子[こ]らに嗣業[しぎょう]として渡[わた]す。彼らは自分[じぶん]の財産[ざいさん]とともにあなたのうちに住[す]み、その天幕[てんまく]をあなたのうちに張[は]る。彼らはあなたの実[み]を食[た]べ、あなたの脂[あぶら]を飲[の]む。"
  5: "わたしはアンモンの都[みやこ]をらくだの牧場[ぼくじょう]とし、アンモン人[じん]の子[こ]らを羊[ひつじ]の群[む]れの牧[まき]場[ば]とする。あなたがたは、わたしが主[しゅ]であることを知[し]る。"
  6: "主[しゅ]なる神[かみ]はこう言[い]われる。あなたが手[て]を打[う]ち鳴[な]らし、足[あし]を踏[ふ]み鳴[な]らし、イスラエルの地[ち]について魂[たましい]の底[そこ]から喜[よろこ]んだゆえに。"
  7: "それゆえ、見[み]よ、わたしはあなたの上[うえ]に手[て]を伸[の]べ、あなたを諸国[しょこく]の掠[かす]め物[もの]とし、民[たみ]の間[あいだ]からあなたを絶[た]ち、国々[くにぐに]からあなたを滅[ほろ]ぼす。わたしはあなたを滅ぼし尽[つ]くす。あなたは、わたしが主[しゅ]であることを知[し]る。"
  8: "主[しゅ]なる神[かみ]はこう言[い]われる。モアブとセイルが言[い]ったゆえに。『見[み]よ、イスラエルの家[いえ]もユダも、すべての国々[くにぐに]のようになった』と。"
  9: "それゆえ、見[み]よ、わたしはモアブの肩[かた]を、その国々[くにぐに]の境[さかい]にあるその諸都市[しょとし]から、すなわち選[え]り抜[ぬ]かれた地[ち]、海沿[うみぞ]いの町[まち]の泉[いずみ]の上[うえ]にあるアシムトの家[いえ]から解[と]き放[はな]つ。"
  10: "東[ひがし]の子[こ]らに、アンモン人[じん]の子[こ]らとともに、それを嗣業[しぎょう]として与[あた]える。アンモン人[じん]の子[こ]らの名[な]はもはや諸国[しょこく]の間[あいだ]で覚[おぼ]えられない。"
  11: "わたしはモアブの上[うえ]に裁[さば]きを行[おこな]う。あなたがたは、わたしが主[しゅ]であることを知[し]る。"
  12: "主[しゅ]なる神[かみ]はこう言[い]われる。イドマヤがユダの家[いえ]に復讐[ふくしゅう]して復讐し、彼らに恨[うら]みを抱[いだ]いて報[むく]いを果[は]たしたゆえに。"
  13: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。わたしはイドマヤの上[うえ]に手[て]を伸[の]べ、そこから人[ひと]と家畜[かちく]を絶[た]ち、これを荒[あ]れ地[ち]とする。テマンから、彼らは剣[つるぎ]に追[お]われて倒[たお]れる。"
  14: "わたしはわたしの民[たみ]イスラエルの手[て]によって、イドマヤにわたしの復讐[ふくしゅう]をする。彼らはわたしの怒[いか]りとわたしの憤[いきどお]りに従[したが]ってイドマヤを扱[あつか]う。彼らはわたしの復讐[ふくしゅう]を知[し]る、と主[しゅ]なる神[かみ]は言[い]われる。"
  15: "主[しゅ]なる神[かみ]はこう言[い]われる。ペリシテ人[じん]が復讐[ふくしゅう]をもって報[むく]い、魂[たましい]の底[そこ]から喜[よろこ]んで憎[にく]しみを抱[いだ]き、永遠[えいえん]に滅[ほろ]ぼそうとして復讐[ふくしゅう]を起[お]こしたゆえに。"
  16: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはペリシテ人[じん]の上[うえ]に手[て]を伸[の]べ、クレタ人[じん]を絶[た]ち、海沿[うみぞ]いの地[ち]に住[す]む残[のこ]りの者[もの]を滅[ほろ]ぼす。"
  17: "わたしは彼らの上[うえ]に大[おお]きな復讐[ふくしゅう]を行[おこな]い、わたしの怒[いか]りの叱責[しっせき]をもってこれを果[は]たす。わたしが彼らの上[うえ]にわたしの復讐[ふくしゅう]をするとき、彼らは、わたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — вводная формула. Глава открывает цикл оракулов о народах (25–32): Аммон, Моав, Едом, филистимляне, Тир, Сидон, Египет."
  2: "στήρισον τὸ πρόσωπόν σου ἐπὶ τοὺς υἱοὺς Αμμων — «утверди лице твоё на сынов Аммона», ср. 21:2; προφήτευσον ἐπ᾿ αὐτούς — «пророчествуй на них»."
  3: "Ἀνθ᾿ ὧν ἐπεχάρητε ἐπὶ τὰ ἅγιά μου, ὅτι ἐβεβηλώθη — «за то, что вы радовались о святынях Моих, что они осквернены»; ἐπὶ τὴν γῆν τοῦ Ισραηλ, ὅτι ἠφανίσθη — «о земле Израилевой, что она опустошена»; ἐπὶ τὸν οἶκον τοῦ Ιουδα, ὅτι ἐπορεύθησαν ἐν αἰχμαλωσίᾳ — «о доме Иуды, что они пошли в плен». ru добавляет возглас «а! а!» (МТ) — в LXX его нет, в текст не внесён."
  4: "παραδίδωμι ὑμᾶς τοῖς υἱοῖς Κεδεμ εἰς κληρονομίαν — «предаю вас сынам Кедема (востока) в наследие»; κατασκηνώσουσιν ἐν τῇ ἀπαρτίᾳ αὐτῶν ἐν σοί — «поселятся со скарбом (имуществом) своим в тебе»; δώσουσιν... τὰ σκηνώματα αὐτῶν — «поставят шатры свои»; φάγονται τοὺς καρπούς σου — «съедят плоды твои»; πίονται τὴν πιότητά σου — «выпьют тук (жир) твой»."
  5: "τὴν πόλιν τοῦ Αμμων — «город Аммона» (Равва, ラバ; слав. «град аммонь»); εἰς νομὰς καμήλων — «в пастбища верблюдов» (νομή — пастбище, 牧場); εἰς νομὴν προβάτων — «в пастбище овец»."
  6: "ἐκρότησας τὴν χεῖρά σου καὶ ἐπεψόφησας τῷ ποδί σου — «ты ударил рукой твоей и топнул ногой твоей» (знаки злорадства); ἐπέχαρας ἐκ ψυχῆς σου — «возрадовался от души твоей»; ἐπὶ τὴν γῆν τοῦ Ισραηλ — «о земле Израилевой»."
  7: "ἐκτενῶ τὴν χεῖρά μου ἐπὶ σέ — «простру руку Мою на тебя»; δώσω σε εἰς διαρπαγὴν ἐν τοῖς ἔθνεσιν — «отдам тебя на расхищение народам»; ἐξολεθρεύσω σε ἐκ τῶν λαῶν — «истреблю тебя из народов»; ἀπολῶ σε ἐκ τῶν χωρῶν ἀπωλείᾳ — «погублю тебя из стран погибелью»."
  8: "εἶπεν Μωαβ — «сказал Моав»; слав. добавляет «и сиир» (セイル) — нет в LXX, внесено без скобок. Ἰδοὺ ὃν τρόπον πάντα τὰ ἔθνη οἶκος Ισραηλ καὶ Ιουδα — «вот, как все народы, дом Израиля и Иуды»: слова Моава — 『…』."
  9: "ἀπὸ πόλεων ἀκρωτηρίων αὐτοῦ — «от городов окраин его»; ἐκλεκτὴν γῆν — «избранную землю»; οἶκον Ασιμουθ ἐπάνω πηγῆς πόλεως παραθαλασσίας — «дом Асимуфа (Беф-Иешимоф) над источником приморского города»; слав. в скобках добавляет «(ваелмона и кариафаима)» — редакционная вставка, не перенесена (ru: Ваалмеон и Кириафаим)."
  10: "τοῖς υἱοῖς Κεδεμ ἐπὶ τοὺς υἱοὺς Αμμων δέδωκα αὐτοὺς εἰς κληρονομίαν — «сынам Кедема вместе с сынами Аммона Я дал их в наследие»; ὅπως μὴ μνεία γένηται τῶν υἱῶν Αμμων — «чтобы не было памяти о сынах Аммона»."
  11: "εἰς Μωαβ ποιήσω ἐκδίκησιν — «над Моавом совершу мщение»; ἐπιγνώσονται διότι ἐγὼ κύριος — «узнают, что Я Господь»."
  12: "ἐν τῷ ἐκδικῆσαι αὐτοὺς ἐκδίκησιν εἰς τὸν οἶκον Ιουδα — «когда они мстили дом Иуды»; ἐμνησικάκησαν — «злопамятствовали» (μνησικακέω); ἐξεδίκησαν δίκην — «мстили судом (спор)». Слав. «(во гневе)» — редакционная вставка в скобках, не перенесена."
  13: "ἐκτενῶ τὴν χεῖρά μου ἐπὶ τὴν Ιδουμαίαν — «простру руку Мою на Идумею» (Ιδουμαία — イドマヤ, ср. Ис 34); ἐξολεθρεύσω ἐξ αὐτῆς ἄνθρωπον καὶ κτῆνος — «истреблю из неё человека и скот»; θήσομαι αὐτὴν ἔρημον — «сделаю её пустыней»; ἐκ Θαιμαν διωκόμενοι ἐν ῥομφαίᾳ πεσοῦνται — «от Фемана гонимые мечом падут» (слав. «гоними»); ru/МТ добавляет «до Дедана» — в LXX нет."
  14: "δώσω ἐκδίκησίν μου ἐπὶ τὴν Ιδουμαίαν ἐν χειρὶ λαοῦ μου Ισραηλ — «дам отмщение Моё над Идумеей рукою народа Моего Израиля»; ποιήσουσιν... κατὰ τὴν ὀργήν μου — «поступят... по гневу Моему»; ἐπιγνώσονται τὴν ἐκδίκησίν μου — «узнают отмщение Моё»."
  15: "οἱ ἀλλόφυλοι — «иноплеменники» (ペリシテ人 по корпусу); ἐν ἐκδικήσει — «в мщении»; ἐξανέστησαν ἐκδίκησιν — «восстали (воздвигли) мщение»; ἐπιχαίροντες ἐκ ψυχῆς — «радуясь от души»; τοῦ ἐξαλεῖψαι ἕως αἰῶνος — «чтобы истребить до века»."
  16: "ἐκτενῶ τὴν χεῖρά μου ἐπὶ τοὺς ἀλλοφύλους — «простру руку Мою на иноплеменников»; ἐξολεθρεύσω Κρῆτας — «истреблю Критян» (Κρῆτες — критяне, здесь о филистимлянах, ср. Соф 2:5; 1 Цар 30:14); ἀπολῶ τοὺς καταλοίπους τοὺς κατοικοῦντας τὴν παραλίαν — «погублю остаток, живущий на побережье»."
  17: "ποιήσω ἐν αὐτοῖς ἐκδικήσεις μεγάλας — «совершу над ними великие отмщения»; ἐν ἐλεγμοῖς θυμοῦ — «в обличениях ярости» (ἐλεγμός — обличение, 叱責); ἐν τῷ δοῦναι τὴν ἐκδίκησίν μου ἐπ᾿ αὐτούς — «когда дам отмщение Моё на них»."
