# jp-box, Числа, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: закон о рыжей телице — приведение и заклание вне стана (1–3),
# кропление кровью и сожжение с кедром, иссопом и червлёной нитью (4–6),
# нечистота совершающих (7–8), пепел и вода кропления (9–10),
# осквернение от мёртвого и очищение в третий и седьмой день (11–13),
# мёртвый в доме и открытый сосуд (14–15), прикосновение в поле (16),
# приготовление и употребление воды кропления (17–19),
# истребление неочистившегося (20–22).
# Речь Бога — 「…」 (2–22, одна непрерывная речь); красного и синего нет.
# Нумерация: 22 стиха — как в gr-lxx-byz, csl-ru и ru (совпадает).
# 19:14 LXX читает οἰκίᾳ («дом»), а не «шатёр» масоретского текста и Синодального.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (jp-joc в главе пуст;
# добавка csl 19:12 «(сею водою)» — пояснение переводчика, в текст не внесена).
# Сносок ⟨…⟩ нет: ヒソプ пояснён в Ин 19:29, 灰, 宿営, 会衆, 祭壇, 祭司 —
# уже в корпусе; 赤い雌牛 понятна по контексту.
# jp-ni не использовался.

