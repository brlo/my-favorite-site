verses:
  1: "主[しゅ]はモーセとアロンに語[かた]って言[い]われた。"
  2: "「これは、主[しゅ]が命[めい]じられた律法[りっぽう]の定[さだ]めである。イスラエルの子[こ]らに語[かた]りなさい。彼[かれ]らはあなたのところへ、傷[きず]のない赤[あか]い雌牛[めうし]を連[つ]れて来[き]なさい。それには欠[けっ]点[てん]がなく、まだくびきを負[お]わせたことのないものである。"
  3: "あなたはそれを祭司[さいし]エレアザルに渡[わた]しなさい。彼[かれ]らはそれを宿営[しゅくえい]の外[そと]の清[きよ]い場所[ばしょ]へ連[つ]れ出[だ]し、彼[かれ]の目[め]の前[まえ]で屠[ほふ]る。"
  4: "エレアザルはその血[ち]を取[と]り、証[あかし]の幕屋[まくや]の正面[しょうめん]に向[む]かって、その血[ち]を七度[ななど]振[ふ]りかける。"
  5: "そして、彼[かれ]の目[め]の前[まえ]でそれを焼[や]きなさい。その皮[かわ]、肉[にく]、血[ち]、およびその汚物[おぶつ]もともに焼[や]かれる。"
  6: "祭司[さいし]は杉[すぎ]の木[き]とヒソプと緋[ひ]の糸[いと]を取[と]り、雌牛[めうし]を焼[や]く火[ひ]の中[なか]に投[な]げ入[い]れる。"
  7: "祭司[さいし]は自分[じぶん]の衣[ころも]を洗[あら]い、体[からだ]を水[みず]で浴[あ]び、その後[のち]に宿営[しゅくえい]に入[はい]る。祭司[さいし]は夕[ゆう]べまで不[ふ]潔[けつ]である。"
  8: "それを焼[や]く者[もの]も自分[じぶん]の衣[ころも]を洗[あら]い、体[からだ]を水[みず]で浴[あ]びる。彼[かれ]は夕[ゆう]べまで不[ふ]潔[けつ]である。"
  9: "清[きよ]い人[ひと]が雌牛[めうし]の灰[はい]を集[あつ]め、宿営[しゅくえい]の外[そと]の清[きよ]い場所[ばしょ]に置[お]く。それはイスラエルの子[こ]らの会衆[かいしゅう]のために、保存[ほぞん]されるべきもの、振[ふ]りかける水[みず]となる。それは清[きよ]めである。"
  10: "雌牛[めうし]の灰[はい]を集[あつ]める者[もの]は自分[じぶん]の衣[ころも]を洗[あら]う。彼[かれ]は夕[ゆう]べまで不[ふ]潔[けつ]である。これはイスラエルの子[こ]らと、彼[かれ]らに加[くわ]わった寄留者[きりゅうしゃ]にとって、永遠[えいえん]の定[さだ]めとなる。"
  11: "人[ひと]の死[し]んだ体[からだ]に触[ふ]れる者[もの]は、七日[なのか]の間[あいだ]不[ふ]潔[けつ]である。"
  12: "その人[ひと]は三日目[みっかめ]と七日目[なのかめ]に清[きよ]められ、清[きよ]くなる。もし三日目[みっかめ]と七日目[なのかめ]に清[きよ]められなければ、清[きよ]くはならない。"
  13: "人[ひと]が死[し]んで、その人[ひと]に触[ふ]れた者[もの]が清[きよ]められないなら、その者[もの]は主[しゅ]の幕屋[まくや]を汚[けが]したのである。その者[もの]はイスラエルから断[た]たれる。振[ふ]りかける水[みず]がその者[もの]の上[うえ]に振[ふ]りかけられなかったからである。その者[もの]は不[ふ]潔[けつ]であり、その汚[けが]れはなお彼[かれ]の上[うえ]にある。"
  14: "これは律法[りっぽう]である。人[ひと]が家[いえ]の中[なか]で死[し]んだなら、その家[いえ]に入[はい]る者[もの]はだれでも、また家[いえ]の中[なか]にあるものはすべて、七日[なのか]の間[あいだ]不[ふ]潔[けつ]である。"
  15: "また、ふたをして縛[しば]っていない開[あ]いた器[うつわ]は、すべて不[ふ]潔[けつ]である。"
  16: "野[の]の面[おもて]で、殺[ころ]された者[もの]、死[し]んだ者[もの]、人[ひと]の骨[ほね]、または墓[はか]に触[ふ]れる者[もの]はだれでも、七日[なのか]の間[あいだ]不[ふ]潔[けつ]である。"
  17: "不[ふ]潔[けつ]な者[もの]のために、清[きよ]めのために焼[や]かれた灰[はい]を取[と]り、その上[うえ]に生[い]き水[みず]を器[うつわ]に注[そそ]ぎなさい。"
  18: "清[きよ]い人[ひと]がヒソプを取[と]り、その水[みず]に浸[ひた]して、家[いえ]、器[うつわ]、そこにいる人[ひと]たち、また人[ひと]の骨[ほね]、殺[ころ]された者[もの]、死[し]んだ者[もの]、または墓[はか]に触[ふ]れた者[もの]の上[うえ]に振[ふ]りかける。"
  19: "清[きよ]い人[ひと]は三日目[みっかめ]と七日目[なのかめ]に、不[ふ]潔[けつ]な者[もの]の上[うえ]に振[ふ]りかける。七日目[なのかめ]にその人[ひと]は清[きよ]められ、衣[ころも]を洗[あら]い、水[みず]で体[からだ]を浴[あ]びる。彼[かれ]は夕[ゆう]べまで不[ふ]潔[けつ]である。"
  20: "汚[けが]れて清[きよ]められない人[ひと]は、会衆[かいしゅう]の中[なか]から断[た]たれる。主[しゅ]の聖[せい]なるものを汚[けが]したからである。振[ふ]りかける水[みず]がその人[ひと]の上[うえ]に振[ふ]りかけられなかったので、その人[ひと]は不[ふ]潔[けつ]である。"
  21: "これはあなたがたの永遠[えいえん]の定[さだ]めとなる。振[ふ]りかける水[みず]を振[ふ]りかける者[もの]も自分[じぶん]の衣[ころも]を洗[あら]う。振[ふ]りかける水[みず]に触[ふ]れた者[もの]は夕[ゆう]べまで不[ふ]潔[けつ]である。"
  22: "不[ふ]潔[けつ]な者[もの]が触[ふ]れたものは、すべて不[ふ]潔[けつ]になる。また、それに触[ふ]れた人[ひと]は夕[ゆう]べまで不[ふ]潔[けつ]である。」"

notes:
  1: "В отличие от обычной формулы, речь обращена к Моисею и Аарону вместе (καὶ … καὶ Ααρων)."
  2: "διαστολὴ τοῦ νόμου — «изложение, устав закона» (διαστολή — разграничение, постановление; слав. «расположение закона»). δάμαλις — молодая корова, телица. πυρρά — огненно-рыжая. ἄμωμος … μῶμος — непорочная, без порока (повтор корня). ζυγός — ярмо; ᾗ οὐκ ἐπεβλήθη ζυγός — «на которую не возлагали ярма»."
  3: "Ελεαζαρ — Елеазар, сын Аарона. ἔξω τῆς παρεμβολῆς — вне стана. τόπον καθαρόν — чистое место. σφάξουσιν ἐνώπιον αὐτοῦ — заколют при нём (σφάζω)."
  4: "ῥανεῖ — покропит (ῥαίνω). ἀπέναντι τοῦ προσώπου τῆς σκηνῆς — «против лица скинии». ἑπτάκις — семь раз. Кропление совершает сам священник Елеазар, а не закалывающий."
  5: "κατακαύσουσιν — сожгут (κατακαίω). δέρμα — кожа. κόπρος — помёт, нечистота (слав. «мотыла»). σὺν τῇ κόπρῳ αὐτῆς — вместе с нечистотою её."
  6: "ξύλον κέδρινον — кедровое дерево (κέδρινος; 杉の木). ὕσσωπον — иссоп. κόκκινον — червлёное, красная шерсть (слав. «соскание червленое»). ἐμβαλοῦσιν εἰς μέσον τοῦ κατακαύματος — бросят в середину сожжения."
  7: "πλυνεῖ τὰ ἱμάτια — вымоет одежды (πλύνω). λούσεται τὸ σῶμα — омоет тело (λούω). ἀκάθαρτος ἕως ἑσπέρας — нечист до вечера."
  8: "ὁ κατακαίων — сожигающий (причастие наст. вр.)."
  9: "σποδός — пепел. ἀποθήσει — положит (ἀποτίθημι). εἰς διατήρησιν — «на сохранение». ὕδωρ ῥαντισμοῦ — вода кропления (ῥαντισμός). ἅγνισμα — очищение (ἁγνισμός); слав. «очищение есть»."
  10: "ὁ συνάγων τὴν σποδιάν — собирающий пепел (σποδιά). προσκείμενοι προσήλυτοι — «присоединившиеся пришельцы» (προσήλυτος — пришелец, прозелит). νόμιμον αἰώνιον — вечный устав."
  11: "τοῦ τεθνηκότος πάσης ψυχῆς ἀνθρώπου — «умершего всякой души человеческой»: ψυχή здесь значит «человек, тело» (слав. «мертвому всякия души человечи»). ἑπτὰ ἡμέρας — семь дней."
  12: "ἁγνισθήσεται — будет очищен (ἁγνίζω). ἀφαγνισθῇ — очистится (ἀφαγνίζω, усилительная форма). В csl добавлено пояснение «(сею водою)» — в греческом его нет."
  13: "ἐὰν ἀποθάνῃ — «если умрёт»: гебраизм при «умершем», в переводе слито с «человек умер». ἐμίανεν — осквернил (μιαίνω). ἐκτριβήσεται — истребится (ἐκτρίβω). περιερραντίσθη — окроплён (περιρραντίζω). ἀκαθαρσία — нечистота. ἔτι … ἐν αὐτῷ ἐστιν — «ещё в нём есть»."
  14: "οὗτος ὁ νόμος — «вот закон». οἰκίᾳ — дом (в масоретском тексте — шатёр, אֹהֶל; Синодальный: «в шатре»). εἰσπορευόμενος — входящий."
  15: "σκεῦος ἀνεῳγμένον — открытый сосуд (ἀνοίγω, perfect). δεσμός — завязка, обвязка. καταδέδεται — привязан (καταδέω)."
  16: "ἐπὶ προσώπου τοῦ πεδίου — «на лице поля», т. е. в открытом поле (еврейский оборот). τραυματίας — убитый, раненый. ὀστέον ἀνθρώπινον — человеческая кость. μνῆμα — могила."
  17: "τῆς σποδιᾶς τῆς κατακεκαυμένης τοῦ ἁγνισμοῦ — «пепла сожжённой (жертвы) очищения» (perfect κατακαίω). ὕδωρ ζῶν — живая, проточная вода. εἰς σκεῦος — в сосуд."
  18: "λήμψεται ὕσσωπον — возьмёт иссоп. βάψει — омочит (βάπτω). περιρρανεῖ — покропит (περιρραίνω). ψυχάς — людей (см. ст. 11). ἡμμένον — прикоснувшегося (ἡμμένος, perfect от ἅπτω)."
  19: "περιρρανεῖ ὁ καθαρός — чистый покропит. ἀφαγνισθήσεται — очистится. πλυνεῖ … λούσεται — вымоет… омоется. ἀκάθαρτος ἕως ἑσπέρας — нечист до вечера."
  20: "μιανθῇ — осквернится (μιαίνω, страд.). ἐξολεθρευθήσεται — истребится (ἐξολοθρεύω). ἐκ μέσου τῆς συναγωγῆς — из среды общества. τὰ ἅγια κυρίου — святыни Господни."
  21: "νόμιμον αἰώνιον — вечный устав. ὁ περιρραίνων ὕδωρ ῥαντισμοῦ — кропящий водою кропления; и он нечист до вечера."
  22: "παντός, οὗ ἐὰν ἅψηται — «всего, чего коснётся» (родительный при ἅπτομαι). ἡ ἁπτομένη — прикасающийся (ψυχή подразумевается)."
