# jp-box, Псалтирь, псалом 131. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..18.
# Псалом 131: молитва о Давиде (1), его клятва (2–5), обретение ковчега (6–7),
# восшествие в покой (8–10), клятва Господа Давиду (11–12),
# избрание Сиона и обетования ему (13–18).
# Красного и синего нет: слова Господа в псалме — пророчество, а не евангельская речь.
# Кавычки: клятва Давида в 3–5 — 「…」; клятва Господа в 11–12 — 「…」;
# слова Господа о Сионе в 14–18 — 「…」 (по указанию о 131:11–12 и 131:14).
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 契約, 王座, 祭司, 角 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 131
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。主[しゅ]よ、ダビデと、そのすべての柔和[にゅうわ]さを覚[おぼ]えてください。"
  2: "それは、彼[かれ]が主[しゅ]に誓[ちか]い、ヤコブの力[ちから]ある神[かみ]に願[ねが]いを立[た]てたときのことである。"
  3: "「わたしは自分[じぶん]の家[いえ]の天幕[てんまく]に入[はい]らない。わたしの寝床[ねどこ]に上[のぼ]らない。"
  4: "わたしの目[め]に眠[ねむ]りを、まぶたにまどろみを、こめかみに休[やす]みを与[あた]えない。"
  5: "主[しゅ]のために場所[ばしょ]を、ヤコブの力[ちから]ある神[かみ]のために住[す]まいを見[み]つけるまで」。"
  6: "見[み]よ、わたしたちはそれをエフラタで聞[き]き、野[の]の林[はやし]の中[なか]でそれを見[み]つけた。"
  7: "わたしたちはその住[す]まいに入[はい]り、その足[あし]が立[た]った場所[ばしょ]にひれ伏[ふ]そう。"
  8: "主[しゅ]よ、あなたと、あなたの聖所[せいしょ]の箱[はこ]とが、あなたの安[やす]らぎの場[ば]へ上[のぼ]ってください。"
  9: "あなたの祭司[さいし]たちは義[ぎ]を着[き]て、あなたの聖[せい]なる者[もの]たちは喜[よろこ]び躍[おど]る。"
  10: "あなたの僕[しもべ]ダビデのゆえに、あなたの油[あぶら]を注[そそ]がれた者[もの]から、顔[かお]をそむけないでください。"
  11: "主[しゅ]はダビデに真実[しんじつ]をもって誓[ちか]い、それを破[やぶ]られることはない。「わたしは、あなたの腹[はら]の実[み]を、あなたの王座[おうざ]に据[す]える。"
  12: "もしあなたの子[こ]らが、わたしの契約[けいやく]と、わたしが彼[かれ]らに教[おし]えるこれらの証[あかし]とを守[まも]るなら、彼[かれ]らの子[こ]らも、とこしえにあなたの王座[おうざ]に座[すわ]る」。"
  13: "主[しゅ]はシオンを選[えら]び、そこをご自分[じぶん]の住[す]まいとして選[えら]ばれた。"
  14: "「ここが、とこしえにわたしの安[やす]らぎの場[ば]である。わたしはここに住[す]もう。わたしはここを選[えら]んだからである。"
  15: "わたしはその食糧[しょくりょう]を祝福[しゅくふく]して祝福[しゅくふく]する。その貧[まず]しい者[もの]たちをパンで満[み]ち足[た]らせる。"
  16: "わたしはその祭司[さいし]たちに救[すく]いを着[き]せ、その聖[せい]なる者[もの]たちは喜[よろこ]びに喜[よろこ]ぶ。"
  17: "わたしはそこでダビデのために角[つの]を生[は]えさせ、わたしの油[あぶら]を注[そそ]がれた者[もの]のために灯[ともしび]を整[ととの]える。"
  18: "わたしはその敵[てき]たちに恥[はじ]を着[き]せる。しかし、その上[うえ]にはわたしの聖[せい]なるものが花[はな]咲[さ]く」。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; совпадает в gr-lxx-byz и в ru-базе. В csl-ru отдельного стиха 0 нет — надписание влито в ст. 1. Μνήσθητι, κύριε, τοῦ Δαυιδ — 主よ、ダビデと…を覚えてください (μιμνήσκομαι + gen. — «помнить»; императив аориста). καὶ πάσης τῆς πραΰτητος αὐτοῦ — そのすべての柔和さを (πραΰτης — «кротость, мягкость»; у jp-joc «憂ひ» — «скорби», по евр. עֱנוּת «страдание»; взято греч. чтение базы). Формула «помяни, Господи, Давида» открывает псалом и связана с обетованием ст. 11."
  2: "ὡς ὤμοσεν τῷ κυρίῳ — 彼が主に誓い…ときのことである (ὄμνυμι — «клясться»; ὡς — «как», здесь вводит содержание клятвы). ηὔξατο τῷ θεῷ Ιακωβ — ヤコブの力ある神に願いを立てた (εὔχομαι — «давать обет, молиться»; θεός Ιακωβ — «Бог Иакова», устойчивое имя, ср. 131:5; 20:2). 力ある — передача церковного «крепкаго» (так читается в славянской традиции); в греч. только θεός."
  3: "Εἰ εἰσελεύσομαι εἰς σκήνωμα οἴκου μου — わたしは自分の家の天幕に入らない (εἰ + будущее в клятвенной формуле — «не войду»; σκήνωμα — «скиния, шатёр»). εἰ ἀναβήσομαι ἐπὶ κλίνης στρωμνῆς μου — わたしの寝床に上らない (κλίνη — «ложе»; στρωμνή — «постель»). Клятва Давида — 「…」, замыкается в ст. 5."
  4: "εἰ δώσω ὕπνον τοῖς ὀφθαλμοῖς μου — わたしの目に眠りを…与えない (δίδωμι ὕπνον — «дать сон»; εἰ — продолжение клятвенного отрицания). καὶ τοῖς βλεφάροις μου νυσταγμόν — まぶたにまどろみを (βλέφαρον — «веко»; νυσταγμός — «дремота», ср. 120:3). καὶ ἀνάπαυσιν τοῖς κροτάφοις μου — こめかみに休みを (κρόταφος — «висок»; ἀνάπαυσις — «покой»). Три члена параллелизма сохранены."
  5: "ἕως οὗ εὕρω τόπον τῷ κυρίῳ — 主のために場所を見つけるまで (εὑρίσκω — «находить»; τόπος — «место», т. е. место для ковчега). σκήνωμα τῷ θεῷ Ιακωβ — ヤコブの力ある神のために住まいを (повтор σκήνωμα из ст. 3 и имени Божия из ст. 2 сохранён). Здесь клятва Давида замыкается."
  6: "ἰδοὺ ἠκούσαμεν αὐτὴν ἐν Εφραθα — 見よ、わたしたちはそれをエフラタで聞き (ἀκούω — «слышать»; Εφραθα — Ефрафа, ср. Быт 35:19; Мих 5:2; αὐτὴν — скинию/ковчег). εὕρομεν αὐτὴν ἐν τοῖς πεδίοις τοῦ δρυμοῦ — 野の林の中でそれを見つけた (πεδίον — «поле»; δρυμός — «дубрава, лес», т. е. Кириаф-Иарим, «город леса»)."
  7: "εἰσελευσόμεθα εἰς τὰ σκηνώματα αὐτοῦ — わたしたちはその住まいに入り (σκήνωμα, как в ст. 3 и 5; мн. ч. — «обители»). προσκυνήσομεν εἰς τὸν τόπον — その…場所にひれ伏そう (προσκυνέω — «поклоняться, падать ниц»; εἰς + acc. — «к»). οὗ ἔστησαν οἱ πόδες αὐτοῦ — その足が立った (ἵστημι — «стоять»; образ подножия, ср. 131:7 и 98:5)."
  8: "ἀνάστηθι, κύριε, εἰς τὴν ἀνάπαυσίν σου — 主よ、…あなたの安らぎの場へ上ってください (ἀνίστημι — «вставать, восходить»; ἀνάπαυσις — «покой», ср. ст. 14). σὺ καὶ ἡ κιβωτὸς τοῦ ἁγιάσματός σου — あなたと、あなたの聖所の箱とが (κιβωτός — «ковчег»; ἁγίασμα — «святыня», отсюда 聖所の箱, а не «ковчег завета», которого в греч. нет)."
  9: "οἱ ἱερεῖς σου ἐνδύσονται δικαιοσύνην — あなたの祭司たちは義を着て (ἐνδύω — «облекать»; δικαιοσύνη — 義). καὶ οἱ ὅσιοί σου ἀγαλλιάσονται — あなたの聖なる者たちは喜び躍る (ὅσιος — «преподобный, святой»; ἀγαλλιάομαι — «ликовать»)."
  10: "ἕνεκεν Δαυιδ τοῦ δούλου σου — あなたの僕ダビデのゆえに (δοῦλος — 僕; ἕνεκεν — «ради»). μὴ ἀποστρέψῃς τὸ πρόσωπον τοῦ χριστοῦ σου — あなたの油を注がれた者から、顔をそむけないでください (ἀποστρέφω — «отвращать»; χριστός здесь — «помазанник», титул, поэтому 油を注がれた者, а не キリスト, ср. 2:2)."
  11: "ὤμοσεν κύριος τῷ Δαυιδ ἀλήθειαν — 主はダビデに真実をもって誓い (ἀλήθεια — «истина», т. е. «поклялся истиной»; ср. ст. 2). καὶ οὐ μὴ ἀθετήσει αὐτήν — それを破られることはない (ἀθετέω — «отменять, нарушать»; οὐ μή — сильное отрицание). Ἐκ καρποῦ τῆς κοιλίας σου — 「わたしは、あなたの腹の実を (καρπός — «плод»; κοιλία — «чрево»). θήσομαι ἐπὶ τὸν θρόνον σου — あなたの王座に据える (τίθημι — «ставить»; θρόνος — 王座). Начало клятвы Господа — 「…」 (по указанию о 131:11–12)."
  12: "ἐὰν φυλάξωνται οἱ υἱοί σου τὴν διαθήκην μου — もしあなたの子らが、わたしの契約を守るなら (φυλάσσω — 守る; διαθήκη — 契約). καὶ τὰ μαρτύριά μου ταῦτα, ἃ διδάξω αὐτούς — わたしが彼らに教えるこれらの証しを (μαρτύριον — «свидетельство»; διδάσκω — «учить»). καὶ οἱ υἱοὶ αὐτῶν ἕως τοῦ αἰῶνος καθιοῦνται ἐπὶ τοῦ θρόνου σου — 彼らの子らも、とこしえにあなたの王座に座る (καθίζω — «сидеть, восседать»; ἕως τοῦ αἰῶνος — «до века»). Здесь клятва замыкается."
  13: "ὅτι ἐξελέξατο κύριος τὴν Σιων — 主はシオンを選び (ἐκλέγομαι — «избирать»). ᾑρετίσατο αὐτὴν εἰς κατοικίαν ἑαυτῷ — そこをご自分の住まいとして選ばれた (αἱρετίζω — «избирать, предпочитать»; второй глагол избрания, как в ст. 14, сохранён 選ぶ)."
  14: "Αὕτη ἡ κατάπαυσίς μου εἰς αἰῶνα αἰῶνος — 「ここが、とこしえにわたしの安らぎの場である (κατάπαυσις — «покой, место покоя»; εἰς αἰῶνα αἰῶνος — «во век века», усиление). ὧδε κατοικήσω — わたしはここに住もう (κατοικέω — «обитать»). ὅτι ᾑρετισάμην αὐτήν — わたしはここを選んだからである (αἱρετίζω, как в ст. 13). Слова Господа о Сионе — 「…」, замыкаются в ст. 18 (все дальнейшие глаголы — 1 л. ед. ч. от лица Господа)."
  15: "τὴν θήραν αὐτῆς εὐλογῶν εὐλογήσω — わたしはその食糧を祝福して祝福する (θῆρα — «ловля, добыча», здесь «съестные припасы», отсюда 食糧; евр. конструкция «благословляя благословлю» передана повтором 祝福して祝福する). τοὺς πτωχοὺς αὐτῆς χορτάσω ἄρτων — その貧しい者たちをパンで満ち足らせる (πτωχός — «нищий»; χορτάζω — «насыщать»; ἄρτος — パン)."
  16: "τοὺς ἱερεῖς αὐτῆς ἐνδύσω σωτηρίαν — わたしはその祭司たちに救いを着せ (ἐνδύω — «облекать», ср. ст. 9; σωτηρία — 救い). καὶ οἱ ὅσιοι αὐτῆς ἀγαλλιάσει ἀγαλλιάσονται — その聖なる者たちは喜びに喜ぶ (ἀγαλλίασις — «ликование»; повтор глагола с существительным — евр. усиление, передано повтором 喜びに喜ぶ)."
  17: "ἐκεῖ ἐξανατελῶ κέρας τῷ Δαυιδ — わたしはそこでダビデのために角を生えさせ (ἐξανατέλλω — «произращать»; κέρας — «рог», символ силы и царства). ἡτοίμασα λύχνον τῷ χριστῷ μου — わたしの油を注がれた者に灯を整える (ἑτοιμάζω — «готовить»; λύχνος — «светильник»; χριστός — «помазанник», ср. ст. 10)."
  18: "τοὺς ἐχθροὺς αὐτοῦ ἐνδύσω αἰσχύνην — わたしはその敵たちに恥を着せる (αἰσχύνη — «стыд, позор»; ἐνδύω, как в ст. 9 и 16). ἐπὶ δὲ αὐτὸν ἐξανθήσει τὸ ἁγίασμά μου — しかし、その上にはわたしの聖なるものが花咲く (ἐξανθέω — «расцветать»; ἁγίασμα — «святыня, освящение», ср. ст. 8; образ венца-святыни на помазаннике, в слав. «на немже процветет святыня моя»; буквальный смысл тёмен и оставлен без сглаживания). Здесь «…» замыкаются."
