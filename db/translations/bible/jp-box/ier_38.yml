# стражи на горах Ефрема; 7–9 радость Иакова, возвращение с севера, Ефрем — первенец;
# 10–14 слово к народам: рассеявший соберёт, потоки вод, насыщение; 15–17 Рахиль,
# голос в Раме, награда и надежда; 18–20 плач Ефрема и ответ Господа; 21–22 «поставь
# себе стражу», «жена спасёт мужа» (LXX: новое насаждение); 23–25 благословение
# города, насыщение; 26 пробуждение пророка; 27–30 сеяние, «отцы ели кислый виноград»;
# 31–34 **новый завет** («вложу закон Мой, на сердцах напишу»); 35–40 знамение солнца
# и светил, незыблемость рода, восстановление города.
# Голоса: 38:1 — 「…» (слово Господа, формула внутри); 38:2 — формула + 「…»;
# 38:3 — авторское «Господь издалека явился ему», затем 「…» (слова Господа, цитата идёт
# до конца 38:6; в 6 призыв стражей — вложенная 『…』); 38:7–14 — 「…» (одно слово Господа, в 7 слова
# народов — 『…』, закрывается в конце 14); 38:15–17 — 「…»; 38:18–19 — 「…» с плачем
# Ефрема в 『…』 (закрывается в конце 19); 38:20 — 「…» (ответ Господа); 38:21–22 — 「…»;
# 38:23–25 — 「…» (в 23 благословение города — 『…』); 38:26 — авторская речь пророка
# без кавычек; 38:27–30 — 「…» (в 29 поговорка — 『…』); 38:31–34 — 「…» (новый завет,
# «говорит Господь» внутри речи); 38:35 — 「…» (закрывается в стихе); 38:36–37 — 「…»;
# 38:38–40 — 「…». Формулы «так
# говорит Господь» — вне кавычек.
