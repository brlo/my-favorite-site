verses:
  1: "マタンの子[こ]サファテヤ、パスクルの子[こ]ゲダルヤ、シェレミヤの子[こ]ヨアハル、およびマルキヤの子[こ]パスクルは、エレミヤがすべての民[たみ]に語[かた]った言葉[ことば]を聞[き]いた。"
  2: "主[しゅ]はこう言[い]われる。「この都[みやこ]にとどまる者[もの]は、剣[つるぎ]と飢[う]えと疫病[えきびょう]で死[し]ぬ。しかし、カルデア人[じん]のもとへ出[で]て行[い]く者[もの]は生[い]き延[の]び、その魂[たましい]は自分[じぶん]のための獲物[えもの]となって、生[い]きる。"
  3: "主[しゅ]はこう言[い]われる。この都[みやこ]は必[かなら]ずバビロンの王[おう]の軍[ぐん]勢[ぜい]の手[て]に渡[わた]され、彼はこれを取[と]る。」"
  4: "君[きみ]たちは王[おう]に言[い]った。「あの者[もの]を殺[ころ]してほしい。あの者は、この都[みやこ]に残[のこ]った戦[たたか]いの男[おとこ]たちの手[て]を、またすべての民[たみ]の手を弱[よわ]らせている。彼はこの民に平和[へいわ]ではなく、ただ災[わざわ]いを告[つ]げているからである。」"
  5: "王[おう]は言[い]った。「見[み]よ、彼はあなたがたの手[て]のうちにある。」王[おう]は彼らに逆[さから]うことができなかったからである。"
  6: "そこで彼らはエレミヤを取[と]って、王[おう]の子[こ]であるマルキヤの穴[あな]に投[な]げ入[い]れた。その穴は牢[ろう]の庭[にわ]にあった。彼らは縄[なわ]でエレミヤを穴の中[なか]に下[お]ろした。穴には水[みず]がなく、ただ泥[どろ]があった。エレミヤは泥の中にいた。"
  7: "エチオピア人[じん]エベデメレクは、人[ひと]々[びと]がエレミヤを穴[あな]に入[い]れたことを聞[き]いた。そのとき、彼は王[おう]の家[いえ]にいた。王[おう]はベニヤミンの門[もん]に座[すわ]っていた。"
  8: "エベデメレクは王[おう]の家[いえ]から出[で]て来[き]て、王に言[い]った。"
  9: "「あなたは悪[わる]いことをした。この人[ひと]を飢[う]えのために殺[ころ]そうとしたとは。都[みやこ]にはもはやパンがないのだから。」"
  10: "王[おう]はエベデメレクに命[めい]じて言[い]った。「ここから三十人[さんじゅうにん]の者[もの]をあなたの手[て]に取[と]って、エレミヤを穴[あな]から引[ひ]き上[あ]げよ。彼が死[し]なないように。」"
  11: "エベデメレクはその者[もの]たちを連[つ]れて、王[おう]の家[いえ]の地下[ちか]の倉[くら]に入[はい]り、そこから古[ふる]いぼろ切[き]れと古い縄[なわ]を取[と]って、エレミヤのもとへ穴[あな]の中に投[な]げ下[お]ろした。"
  12: "そして言[い]った。「このぼろ切[き]れを縄[なわ]の下[した]に当[あ]てなさい。」エレミヤはそのとおりにした。"
  13: "彼らは縄[なわ]でエレミヤを引[ひ]き上[あ]げて穴[あな]から出[だ]した。エレミヤは牢[ろう]の庭[にわ]にとどまった。"
  14: "王[おう]は人[ひと]を遣[つか]わしてエレミヤを呼[よ]び寄[よ]せ、主[しゅ]の家[いえ]にあるアセリシの家[いえ]へ連[つ]れて来[き]させた。王[おう]は彼に言[い]った。「わたしはあなたに一[ひと]つのことを尋[たず]ねる。わたしから何[なに]も隠[かく]してはならない。」"
  15: "エレミヤは王[おう]に言[い]った。「わたしがあなたに告[つ]げれば、あなたは必[かなら]ずわたしを殺[ころ]すではないか。わたしがあなたに勧[すす]めても、あなたは聞[き]き入[い]れないだろう。」"
  16: "王[おう]はエレミヤに誓[ちか]って言[い]った。「わたしにこの魂[たましい]を造[つく]られた生[い]ける主[しゅ]にかけて、わたしはあなたを殺[ころ]さず、あなたの魂を求[もと]めるあの者[もの]たちの手[て]にも渡[わた]さない。」"
  17: "エレミヤは彼に言[い]った。「イスラエルの神[かみ]である万軍[ばんぐん]の主[しゅ]はこう言[い]われる。もしあなたがバビロンの王[おう]の将軍[しょうぐん]たちのもとへ出[で]て行[い]くなら、あなたの魂[たましい]は生[い]き残[のこ]り、この都[みやこ]は火[ひ]で焼[や]かれず、あなたもあなたの家[いえ]も生[い]きる。"
  18: "しかし、もし出[で]て行[い]かないなら、この都[みやこ]はカルデア人[じん]の手[て]に渡[わた]され、彼らはこれを火[ひ]で焼[や]く。あなたは彼らの手[て]から逃[のが]れられない。」"
  19: "王[おう]はエレミヤに言[い]った。「わたしは、カルデア人[じん]のもとへ逃[に]げたユダヤ人[じん]たちが気[き]にかかる。わたしが彼らの手[て]に渡[わた]され、彼らに嘲[あざけ]られるのではないか。」"
  20: "エレミヤは言[い]った。「渡[わた]されない。どうか、わたしがあなたに語[かた]る主[しゅ]の言葉[ことば]に聞[き]き従[したが]ってほしい。そうすれば、あなたにとって良[よ]いことであり、あなたの魂[たましい]も生[い]き残[のこ]る。"
  21: "しかし、もしあなたが出[で]て行[い]くことを望[のぞ]まないなら、主[しゅ]がわたしに示[しめ]されたこの言葉[ことば]を聞[き]け。"
  22: "見[み]よ、ユダの王[おう]の家[いえ]に残[のこ]ったすべての女[おんな]たちは、バビロンの王[おう]の君[きみ]たちのもとへ連[つ]れ出[だ]される。そして、彼女[かのじょ]たちは言[い]う。『あなたの平和[へいわ]の友[とも]たちがあなたを欺[あざむ]き、あなたに勝[か]った。あなたの足[あし]は滑[すべ]ってよろめき、彼らはあなたから離[はな]れ去[さ]った』と。"
  23: "また、あなたの妻[つま]たちと子[こ]どもたちはカルデア人[じん]のもとへ連[つ]れ出[だ]される。あなたは逃[のが]れられない。バビロンの王[おう]の手[て]によって捕[と]らえられ、この都[みやこ]は火[ひ]で焼[や]かれるからである。」"
  24: "王[おう]はエレミヤに言[い]った。「これらの言葉[ことば]をだれにも知[し]らせるな。そうすれば、あなたは死[し]なない。"
  25: "もし君[きみ]たちが、わたしがあなたと語[かた]ったことを聞[き]いて、あなたのところへ来[き]て言[い]うなら、『王[おう]があなたに何[なに]を語ったか、わたしたちに告[つ]げよ。わたしたちに隠[かく]すな。そうすれば、わたしたちはあなたを殺[ころ]さない。王[おう]があなたに何を語ったのか』と。"
  26: "そのとき、あなたは彼らに言[い]え。『わたしは、王[おう]の前[まえ]に自分[じぶん]の願[ねが]いを投[な]げかけた。それは、わたしをヨナタンの家[いえ]に送[おく]り返[かえ]して、そこで死[し]なせないためである』と。」"
  27: "すべての君[きみ]たちはエレミヤのところへ来[き]て彼に尋[たず]ねた。彼は、王[おう]が命[めい]じたとおりのすべての言葉[ことば]を彼らに告[つ]げた。そこで彼らは黙[だま]った。主[しゅ]の言葉[ことば]が聞[き]かれなかったからである。"
  28: "エレミヤは、エルサレムが取[と]られる時[とき]まで、牢[ろう]の庭[にわ]にとどまった。"

notes:
  1: "Σαφατιας υἱὸς Μαθαν — «Сафатия, сын Матана» (サファテヤ, マタン — формы корпуса); Γοδολιας υἱὸς Πασχωρ — «Годолия, сын Пасхора» (ゲダルヤ, パスクル); Ιωαχαλ υἱὸς Σελεμιου — «Иоахал, сын Селемии» (ヨアハル — новое имя, в LXX Ιωαχαλ, евр. Иегухал); слав. добавляет четвёртое имя «фасхор сын мелхиев» (Пасхор, сын Малхии) — нет в LXX, внесено (マルキヤの子パスクル); τοὺς λόγους, οὓς ἐλάλει Ιερεμιας ἐπὶ τὸν λαόν — «слова, которые говорил Иеремия к народу»."
  2: "Ὁ κατοικῶν ἐν τῇ πόλει ταύτῃ — «сидящий (остающийся) в городе сем»; ἀποθανεῖται ἐν ῥομφαίᾳ καὶ ἐν λιμῷ — «умрёт от меча и голода»; слав. добавляет «и мором» (疫病) — нет в LXX, внесено; ὁ ἐκπορευόμενος πρὸς τοὺς Χαλδαίους ζήσεται — «выходящий к Халдеям будет жив»; ἔσται ἡ ψυχὴ αὐτοῦ εἰς εὕρεμα — «душа его будет в находку (добычу)» (εὕρεμα — находка)."
  3: "Παραδιδομένη παραδοθήσεται — «преданием предастся» (усиление); εἰς χεῖρας δυνάμεως βασιλέως Βαβυλῶνος — «в руки силы (войска) царя Вавилонского»; συλλήμψεται αὐτήν — «возьмёт его». Здесь слово Господа закрывается."
  4: "Ἀναιρεθῆτω δὴ ὁ ἄνθρωπος ἐκεῖνος — «да будет убит человек тот» (ἀναιρέω — убивать; δή — усиление); ἐκλύει τὰς χεῖρας τῶν ἀνθρώπων τῶν πολεμούντων — «расслабляет руки мужей воюющих» (ἐκλύω — ослаблять); οὐ χρησμολογεῖ εἰρήνην τῷ λαῷ τούτῳ ἀλλ' ἢ πονηρά — «не прорицает мира народу сему, а только злое» (χρησμολογέω — прорицать)."
  5: "Ἰδοὺ αὐτὸς ἐν χερσὶν ὑμῶν — «вот, он в руках ваших»; ὅτι οὐκ ἠδύνατο ὁ βασιλεὺς πρὸς αὐτούς — «ибо царь не мог против них». Слав. «се, той в руках ваших. Понеже не можаше царь противу им»."
  6: "ἔρριψαν αὐτὸν εἰς τὸν λάκκον Μελχιου υἱοῦ τοῦ βασιλέως — «бросили его в ров Малхии, сына царя» (マルキヤ); ὃς ἦν ἐν τῇ αὐλῇ τῆς φυλακῆς — «который был во дворе темницы»; ἐχάλασαν αὐτὸν εἰς τὸν λάκκον — «опустили его в ров» (χαλάω); οὐκ ἦν ὕδωρ ἀλλ' ἢ βόρβορος — «не было воды, а только грязь (тина)» (βόρβορος); ἦν ἐν τῷ βορβόρῳ."
  7: "Αβδεμελεχ ὁ Αἰθίοψ — «Авдемелех Ефиоплянин» (エベデメレク — новое имя, エチオピア人); αὐτὸς ἐν οἰκίᾳ τοῦ βασιλέως — «он был в доме царя»; ὁ βασιλεὺς ἦν ἐν τῇ πύλῃ Βενιαμιν — «царь был в воротах Вениамина»."
  8: "ἐξῆλθεν πρὸς αὐτὸν καὶ ἐλάλησεν πρὸς τὸν βασιλέα — «вышел к нему (к царю) и говорил с царём». Слав. «изыде авдемелех от дому царева и рече ко царю»."
  9: "Ἐπονηρεύσω ἃ ἐποίησας — «ты сделал зло, что сделал» (2 л. ед. ч.); τοῦ ἀποκτεῖναι τὸν ἄνθρωπον τοῦτον ἀπὸ προσώπου τοῦ λιμοῦ — «убивая человека сего от лица (из-за) голода»; οὐκ εἰσὶν ἔτι ἄρτοι ἐν τῇ πόλει — «нет более хлеба в городе». ru (МТ) «худо сделали эти люди» — иное чтение, в тексте по csl/LXX обращение к царю."
  10: "Λαβὲ εἰς τὰς χεῖράς σου ἐντεῦθεν τριάκοντα ἀνθρώπους — «возьми в руки твои отсюда тридцать человек»; ἀνάγαγε αὐτὸν ἐκ τοῦ λάκκου — «вытащи его изо рва» (ἀνάγω — выводить вверх); ἵνα μὴ ἀποθάνῃ — «чтобы он не умер»."
  11: "εἰσῆλθεν εἰς τὴν οἰκίαν τοῦ βασιλέως τὴν ὑπόγειον — «вошёл в дом царя подземный (нижний)» (ὑπόγειος — подземный, 地下の倉); παλαιὰ ῥάκη καὶ παλαιὰ σχοινία — «старые рубища и старые верёвки» (ῥάκος — лоскут, рубище; σχοινίον — верёвка); ἔρριψεν αὐτὰ πρὸς Ιερεμιαν εἰς τὸν λάκκον — «бросил их Иеремии в ров»."
  12: "Ταῦτα θὲς ὑποκάτω τῶν σχοινίων — «положи это под верёвки» (ὑποκάτω — под); ru (МТ) уточняет «под мышки рук твоих» — нет в LXX; ἐποίησεν Ιερεμιας οὕτως — «сделал Иеремия так»."
  13: "εἵλκυσαν αὐτὸν τοῖς σχοινίοις — «вытащили его верёвками» (ἕλκω — тянуть); ἀνήγαγον αὐτὸν ἐκ τοῦ λάκκου — «вывели его изо рва»; ἐκάθισεν ἐν τῇ αὐλῇ τῆς φυλακῆς — «сел (остался) во дворе темницы»."
  14: "εἰς οἰκίαν ασελισι τὴν ἐν οἴκῳ κυρίου — тёмное место: «в дом аселиси, что в доме Господнем» (ασελισι — неясное слово; ru «при третьем входе»), передано как アセリシの家; Ἐρωτήσω σε λόγον — «спрошу тебя слово»; μὴ κρύψῃς ἀπ' ἐμοῦ ῥῆμα — «не скрой от меня слова»."
  15: "Ἐὰν ἀναγγείλω σοι, οὐχὶ θανάτῳ με θανατώσεις; — «если возвещу тебе, не смертью ли умертвишь меня?» (усиление, ср. 33:8); ἐὰν συμβουλεύσω σοι, οὐ μὴ ἀκούσῃς μου — «если посоветую тебе, не послушаешь меня»."
  16: "ὤμοσεν αὐτῷ ὁ βασιλεύς — «поклялся ему царь» (ὀμνύω); Ζῇ κύριος, ὃς ἐποίησεν ἡμῖν τὴν ψυχὴν ταύτην — «жив Господь, который сотворил нам душу сию»; εἰ ἀποκτενῶ σε — клятвенное «если» (= не убью); εἰ δώσω σε εἰς χεῖρας τῶν ἀνθρώπων τούτων — «если предам тебя в руки людей сих». Слав. добавляет «ищущих души твоея (на смерть)» — нет в LXX, внесено (あなたの魂を求める)."
  17: "πρὸς ἡγεμόνας βασιλέως Βαβυλῶνος — «к воеводам (начальникам) царя Вавилонского» (ἡγεμών — вождь, 将軍); ζήσεται ἡ ψυχή σου — «жива будет душа твоя»; ἡ πόλις αὕτη οὐ μὴ κατακαυθῇ ἐν πυρί — «город сей не будет сожжён огнём»; ζήσῃ σὺ καὶ ἡ οἰκία σου — «будешь жить ты и дом твой». С этих слов слово Господа в устах пророка (17–18)."
  18: "δοθήσεται ἡ πόλις αὕτη εἰς χεῖρας τῶν Χαλδαίων — «предан будет город сей в руки Халдеев»; καύσουσιν αὐτὴν ἐν πυρί; σὺ οὐ μὴ σωθῇς — «ты не спасёшься». Здесь слово Господа закрывается."
  19: "Ἐγὼ λόγον ἔχω τῶν Ιουδαίων τῶν πεφευγότων πρὸς τοὺς Χαλδαίους — «я имею слово (опасение) об Иудеях, убежавших к Халдеям» (λόγον ἔχω — имею concern, ср. слав. «опасение имам»); μὴ δώσειν με εἰς χεῖρας αὐτῶν — «чтобы не отдали меня в руки их»; καταμωκήσονταί μου — «насмеются надо мною» (καταμωκάομαι)."
  20: "Οὐ μὴ παραδῶσίν σε — «не предадут тебя»; ἄκουσον τὸν λόγον κυρίου — «послушай слово Господне»; βέλτιον ἔσται σοι — «лучше будет тебе» (βελτίων — лучший); ζήσεται ἡ ψυχή σου — «жива будет душа твоя»."
  21: "εἰ μὴ θέλεις σὺ ἐξελθεῖν — «если не хочешь ты выйти»; οὗτος ὁ λόγος, ὃν ἔδειξέν μοι κύριος — «вот слово, которое показал мне Господь» (δείκνυμι — показывать)."
  22: "αἱ γυναῖκες αἱ καταλειφθεῖσαι ἐν οἰκίᾳ βασιλέως Ιουδα — «жёны, оставшиеся в доме царя Иудина»; ἐξήγοντο πρὸς ἄρχοντας βασιλέως Βαβυλῶνος — «выведутся к князьям царя Вавилонского»; Ἠπάτησάν σε — «обольстили тебя» (ἀπατάω); ἄνδρες εἰρηνικοί σου — «мужи мирные твои»; καταλύσουσιν ἐν ὀλισθήμασιν πόδας σου — тёмное место: «ослабят в поползновениях ноги твои» (ὀλίσθημα — скольжение, падение; καταλύω — ослаблять, разрушать); ἀπέστρεψαν ἀπὸ σοῦ — «отвратились от тебя». Слова жён — 『…』."
  23: "τὰς γυναῖκάς σου καὶ τὰ τέκνα σου ἐξάξουσιν πρὸς τοὺς Χαλδαίους — «жён твоих и детей твоих выведут к Халдеям»; σὺ οὐ μὴ σωθῇς — «ты не спасёшься»; ἐν χειρὶ βασιλέως Βαβυλῶνος συλλημφθῇ — «рукою царя Вавилонского будешь взят»; ἡ πόλις αὕτη κατακαυθήσεται — «город сей сожжён будет». Здесь речь пророка закрывается."
  24: "Ἄνθρωπος μὴ γνώτω ἐκ τῶν λόγων τούτων — «пусть человек не узнает из слов этих»; καὶ σὺ οὐ μὴ ἀποθάνῃς — «и ты не умрёшь». Речь царя продолжается в 25–26."
  25: "ἐὰν ἀκούσωσιν οἱ ἄρχοντες ὅτι ἐλάλησά σοι — «если услышат князья, что я говорил с тобою»; Ἀνάγγειλον ἡμῖν τί ἐλάλησέν σοι ὁ βασιλεύς — «возвести нам, что говорил тебе царь»; μὴ κρύψῃς ἀφ' ἡμῶν — «не скрой от нас»; οὐ μὴ ἀνέλωμέν σε — «не убьём тебя». Слова князей — 『…』."
  26: "Ῥίπτω ἐγὼ τὸ ἔλεός μου κατ' ὀφθαλμοὺς τοῦ βασιλέως — «я повергаю моление моё пред глаза царя» (ῥίπτω — бросать; ἔλεος — моление о милости); πρὸς τὸ μὴ ἀποστρέψαι με εἰς οἰκίαν Ιωναθαν ἀποθανεῖν ἐκεῖ — «чтобы не возвратили меня в дом Ионафана умереть там». Ответ пророка князьям — 『…』."
  27: "ἀπεσιώπησαν — «умолкли» (ἀποσιωπάω); ὅτι οὐκ ἠκούσθη λόγος κυρίου — «ибо не было слышно слова Господня»: тёмное место; ru (МТ) «потому что не узнали сказанного царю» — иное понимание, в текст не внесено."
  28: "ἐκάθισεν Ιερεμιας ἐν τῇ αὐλῇ τῆς φυλακῆς — «сидел Иеремия во дворе темницы»; ἕως χρόνου οὗ συνελήμφθη Ιερουσαλημ — «до времени, когда был взят Иерусалим». ru добавляет «И Иерусалим был взят» — нет в LXX, в текст не внесено."
