verses:
  1: "主[しゅ]はモーセとアロンに言[い]われた。"
  2: "「人[ひと]の皮膚[ひふ]に、傷跡[きずあと]のような目立[めだ]つしるしができ、その皮膚[ひふ]に重[おも]い皮膚病[ひふびょう]の患部[かんぶ]ができたなら、その人[ひと]を祭司[さいし]であるアロンのところ、あるいは彼[かれ]の子[こ]らである祭司の一人[ひとり]のところへ連[つ]れて来[こ]なさい。"
  3: "祭司[さいし]はその人[ひと]の皮膚[ひふ]の患部[かんぶ]を見[み]なさい。患部の毛[け]が白[しろ]く変[か]わり、患部の見[み]た目[め]が皮膚よりくぼんでいるなら、それは重[おも]い皮膚病[ひふびょう]の患部である。祭司はこれを見[み]て、その人を汚[けが]れた者[もの]と宣言[せんげん]しなさい。"
  4: "しかし、そのしるしが皮膚[ひふ]の上[うえ]で白[しろ]く目立[めだ]っても、見[み]た目[め]が皮膚よりくぼんでおらず、毛[け]が白く変[か]わっておらず、その患部[かんぶ]がかすんでいるなら、祭司[さいし]はその患部を七日間[なぬかかん]隔離[かくり]しなさい。"
  5: "七日目[なぬかめ]に祭司[さいし]はその患部[かんぶ]を見[み]なさい。見[み]ると、患部はその目[め]の前[まえ]で同[おな]じままにとどまり、皮膚[ひふ]の上[うえ]で広[ひろ]がっていない。祭司はその人[ひと]を、もう一度[いちど]七日間[なぬかかん]隔離[かくり]しなさい。"
  6: "二度目[にどめ]の七日目[なぬかめ]に祭司[さいし]がその人[ひと]を見[み]ると、患部[かんぶ]はかすみ、皮膚[ひふ]の上[うえ]で広[ひろ]がっていない。祭司はその人を清[きよ]い者[もの]と宣言[せんげん]しなさい。それはしるしにすぎないからである。その人[ひと]は衣[ころも]を洗[あら]いなさい。そうすれば清[きよ]い者となる。"
  7: "しかし、祭司[さいし]がその人[ひと]を清[きよ]い者[もの]と宣言[せんげん]するために見[み]た後[あと]で、そのしるしが皮膚[ひふ]の上[うえ]で広[ひろ]がり出[だ]したなら、その人[ひと]は再[ふたた]び祭司[さいし]の前[まえ]に出[で]なければならない。"
  8: "祭司[さいし]はその人[ひと]を見[み]なさい。しるしが皮膚[ひふ]の上[うえ]で広[ひろ]がっていれば、祭司はその人を汚[けが]れた者[もの]と宣言[せんげん]しなさい。それは重[おも]い皮膚病[ひふびょう]である。"
  9: "人[ひと]に重[おも]い皮膚病[ひふびょう]の患部[かんぶ]ができたなら、その人[ひと]は祭司[さいし]のところへ来[こ]なさい。"
  10: "祭司[さいし]が見[み]ると、皮膚[ひふ]に白[しろ]い傷跡[きずあと]があり、その毛[け]が白[しろ]く変[か]わり、その傷跡[きずあと]のところに生[い]きた肉[にく]が現[あら]われている。"
  11: "それは根[ね]づいた重[おも]い皮膚病[ひふびょう]であり、その人[ひと]の皮膚[ひふ]の病[やまい]である。祭司[さいし]はその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]し、隔離[かくり]しなさい。その人[ひと]は汚[けが]れているからである。"
  12: "しかし、重[おも]い皮膚病[ひふびょう]が皮膚[ひふ]に芽生[めば]え、頭[あたま]から足[あし]まで、祭司[さいし]の目[め]に映[うつ]るかぎり、患部[かんぶ]の皮膚のすべてを覆[おお]ったなら、"
  13: "祭司[さいし]が見[み]て、重[おも]い皮膚病[ひふびょう]がその人[ひと]の皮膚[ひふ]のすべてを覆[おお]っているなら、祭司はその患部[かんぶ]を清[きよ]いものと宣言[せんげん]しなさい。すべてが白[しろ]く変[か]わったのだから、その人[ひと]は清[きよ]いのである。"
  14: "しかし、生[い]きた肉[にく]が現[あら]われる日[ひ]には、その人[ひと]は汚[けが]れる。"
  15: "祭司[さいし]が生[い]きた肉[にく]を見[み]るなら、その生きた肉は汚[けが]れている。祭司はその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]しなさい。それは重[おも]い皮膚病[ひふびょう]だからである。"
  16: "しかし、その生[い]きた肉[にく]が元[もと]に戻[もど]って白[しろ]く変[か]わったなら、その人[ひと]は祭司[さいし]のところへ来[こ]なさい。"
  17: "祭司[さいし]が見[み]て、患部[かんぶ]が白[しろ]く変[か]わっていれば、祭司[さいし]はその患部[かんぶ]を清[きよ]いものと宣言[せんげん]しなさい。その人[ひと]は清[きよ]いのである。"
  18: "皮膚[ひふ]にできものができて治[なお]ったなら、"
  19: "そのできものの跡[あと]に、白[しろ]い傷跡[きずあと]、あるいは白[しろ]く目立[めだ]つしるし、あるいは赤[あか]みを帯[お]びたしるしができて、祭司[さいし]のところに現[あら]われたなら、"
  20: "祭司[さいし]が見[み]て、その見[み]た目[め]が皮膚[ひふ]よりくぼみ、その毛[け]が白[しろ]く変[か]わっていれば、祭司はその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]しなさい。それは重[おも]い皮膚病[ひふびょう]であり、そのできもののところに芽生[めば]えたのである。"
  21: "しかし、祭司[さいし]が見[み]て、そこに白[しろ]い毛[け]がなく、皮膚[ひふ]よりくぼんでおらず、そのしるしがかすんでいるなら、祭司[さいし]はその人[ひと]を七日間[なぬかかん]隔離[かくり]しなさい。"
  22: "しかし、それが皮膚[ひふ]の上[うえ]で広[ひろ]がるなら、祭司[さいし]はその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]しなさい。それは重[おも]い皮膚病[ひふびょう]の患部[かんぶ]であり、そのできもののところに芽生[めば]えたのである。"
  23: "しかし、その目立[めだ]つしるしが同[おな]じ場所[ばしょ]にとどまり、広[ひろ]がらないなら、それはできものの跡[あと]である。祭司[さいし]はその人[ひと]を清[きよ]い者[もの]と宣言[せんげん]しなさい。"
  24: "皮膚[ひふ]に火[ひ]による火傷[やけど]ができ、その火傷[やけど]が治[なお]ったところに、白[しろ]く光[ひか]る目立[めだ]つしるしができ、それがやや赤[あか]みがかっているか、あるいは真[ま]っ白[しろ]であるなら、"
  25: "祭司[さいし]がその人[ひと]を見[み]て、その光[ひか]るしるしの毛[け]が白[しろ]く変[か]わり、見[み]た目[め]が皮膚[ひふ]よりくぼんでいれば、それは重[おも]い皮膚病[ひふびょう]であり、火傷[やけど]のところに芽生[めば]えたのである。祭司[さいし]はその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]しなさい。それは重[おも]い皮膚病[ひふびょう]の患部[かんぶ]である。"
  26: "しかし、祭司[さいし]が見[み]て、その光[ひか]るしるしに白[しろ]い毛[け]がなく、皮膚[ひふ]よりくぼんでおらず、そのしるしがかすんでいるなら、祭司[さいし]はその人[ひと]を七日間[なぬかかん]隔離[かくり]しなさい。"
  27: "七日目[なぬかめ]に祭司[さいし]はその人[ひと]を見[み]なさい。もしそれが皮膚[ひふ]の上[うえ]でひどく広[ひろ]がるなら、祭司[さいし]はその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]しなさい。それは重[おも]い皮膚病[ひふびょう]の患部[かんぶ]であり、できもののところに芽生[めば]えたのである。"
  28: "しかし、その光[ひか]るしるしが同[おな]じ場所[ばしょ]にとどまり、皮膚[ひふ]の上[うえ]で広[ひろ]がらず、かすんでいるなら、それは火傷[やけど]の跡[あと]である。祭司[さいし]はその人[ひと]を清[きよ]い者[もの]と宣言[せんげん]しなさい。それは火傷[やけど]の印[しるし]にすぎないからである。"
  29: "男[おとこ]にも女[おんな]にも、頭[あたま]やひげに重[おも]い皮膚病[ひふびょう]の患部[かんぶ]ができたなら、"
  30: "祭司[さいし]がその患部[かんぶ]を見[み]て、見[み]た目[め]が皮膚[ひふ]より深[ふか]くくぼみ、そこに黄色[きいろ]がかった細[ほそ]い毛[け]があれば、祭司[さいし]はその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]しなさい。それはかさぶた状[じょう]の患部[かんぶ]であり、頭[あたま]やひげの重[おも]い皮膚病[ひふびょう]である。"
  31: "しかし、祭司[さいし]がそのかさぶた状[じょう]の患部[かんぶ]を見[み]て、見[み]た目[め]が皮膚[ひふ]よりくぼんでおらず、そこに黄色[きいろ]がかった毛[け]がなければ、祭司[さいし]はその患部[かんぶ]を七日間[なぬかかん]隔離[かくり]しなさい。"
  32: "七日目[なぬかめ]に祭司[さいし]はその患部[かんぶ]を見[み]なさい。見[み]ると、そのかさぶた状[じょう]の患部[かんぶ]は広[ひろ]がっておらず、そこに黄色[きいろ]がかった毛[け]もなく、その患部[かんぶ]の見[み]た目[め]も皮膚[ひふ]よりくぼんでいない。"
  33: "その人[ひと]は皮膚[ひふ]の毛[け]を剃[そ]りなさい。ただし、その患部[かんぶ]は剃[そ]ってはならない。祭司[さいし]はその患部[かんぶ]を、もう一度[いちど]七日間[なぬかかん]隔離[かくり]しなさい。"
  34: "七日目[なぬかめ]に祭司[さいし]はその患部[かんぶ]を見[み]なさい。見[み]ると、そのかさぶた状[じょう]の患部[かんぶ]は、剃[そ]った後[あと]も皮膚[ひふ]の上[うえ]で広[ひろ]がっておらず、その患部[かんぶ]の見[み]た目[め]も皮膚[ひふ]よりくぼんでいない。祭司[さいし]はその人[ひと]を清[きよ]い者[もの]と宣言[せんげん]しなさい。その人[ひと]は衣[ころも]を洗[あら]えば清[きよ]くなる。"
  35: "しかし、その人[ひと]が清[きよ]くなった後[あと]で、かさぶた状[じょう]の患部[かんぶ]が皮膚[ひふ]の上[うえ]でひどく広[ひろ]がり出[だ]したなら、"
  36: "祭司[さいし]が見[み]て、その患部[かんぶ]が皮膚[ひふ]の上[うえ]で広[ひろ]がっていれば、祭司は黄色[きいろ]がかった毛[け]を調[しら]べる必要[ひつよう]はない。その人[ひと]は汚[けが]れているからである。"
  37: "しかし、その患部[かんぶ]が同[おな]じ場所[ばしょ]にとどまり、そこに黒[くろ]い毛[け]が生[は]えてきたなら、その患部[かんぶ]は癒[いや]えている。その人[ひと]は清[きよ]いのであり、祭司[さいし]はその人[ひと]を清[きよ]い者[もの]と宣言[せんげん]しなさい。"
  38: "男[おとこ]にも女[おんな]にも、その体[からだ]の皮膚[ひふ]に白[しろ]く光[ひか]る斑点[はんてん]ができたなら、"
  39: "祭司[さいし]が見[み]て、その体[からだ]の皮膚[ひふ]に白[しろ]く光[ひか]る斑点[はんてん]があれば、それは白斑[はくはん]であり、その人[ひと]は清[きよ]い。それはその体[からだ]の皮膚[ひふ]に芽生[めば]えたものだから、その人[ひと]は清[きよ]いのである。"
  40: "頭[あたま]の毛[け]が抜[ぬ]け落[お]ちた人[ひと]は、はげ頭[あたま]であるが、清[きよ]いのである。"
  41: "頭[あたま]の前[まえ]のほうの毛[け]が抜[ぬ]け落[お]ちた人[ひと]は、前[まえ]がはげているが、清[きよ]いのである。"
  42: "しかし、はげた頭[あたま]やはげた額[ひたい]のところに白[しろ]い患部[かんぶ]、あるいは赤[あか]みがかった患部[かんぶ]ができたなら、それははげた頭[あたま]やはげた額[ひたい]の重[おも]い皮膚病[ひふびょう]である。"
  43: "祭司[さいし]がその人[ひと]を見[み]て、はげた頭[あたま]やはげた額[ひたい]の患部[かんぶ]の見[み]た目[め]が白[しろ]く赤[あか]みがかっており、その体[からだ]の皮膚[ひふ]にできる重[おも]い皮膚病[ひふびょう]の姿[すがた]に似[に]ていれば、"
  44: "その人[ひと]は重[おも]い皮膚病[ひふびょう]の人[ひと]である。祭司[さいし]は必[かなら]ずその人[ひと]を汚[けが]れた者[もの]と宣言[せんげん]しなさい。その患部[かんぶ]はその人[ひと]の頭[あたま]にある。"
  45: "患部[かんぶ]のある重[おも]い皮膚病[ひふびょう]の人[ひと]は、衣[ころも]を裂[さ]き、頭[あたま]を覆[おお]わず、口[くち]のあたりを覆[おお]いなさい。その人[ひと]は『汚[けが]れた者[もの]』と呼[よ]ばれる。"
  46: "患部[かんぶ]があるかぎりのすべての日[ひ]、その人[ひと]は汚[けが]れた者[もの]であり、汚[けが]れたままである。その人[ひと]は離[はな]れて住[す]み、その住[す]まいは宿営[しゅくえい]の外[そと]になければならない。"
  47: "衣[ころも]に重[おも]い皮膚病[ひふびょう]の患部[かんぶ]ができたなら、羊毛[ようもう]の衣[ころも]であれ、麻[あさ]の衣[ころも]であれ、"
  48: "縦糸[たていと]でも、横糸[よこいと]でも、麻[あさ]のものでも、羊毛[ようもう]のものでも、皮[かわ]でも、どのような皮[かわ]の細工物[さいくもの]でも、"
  49: "その患部[かんぶ]が、皮[かわ]でも、衣[ころも]でも、縦糸[たていと]でも、横糸[よこいと]でも、どのような皮[かわ]の細工物[さいくもの]でも、緑[みどり]がかって、あるいは赤[あか]みがかって現[あら]われたなら、それは重[おも]い皮膚病[ひふびょう]の患部[かんぶ]である。それを祭司[さいし]に見[み]せなさい。"
  50: "祭司[さいし]はその患部[かんぶ]を見[み]、その患部[かんぶ]を七日間[なぬかかん]隔離[かくり]しなさい。"
  51: "七日目[なぬかめ]に祭司[さいし]はその患部[かんぶ]を見[み]なさい。もしその患部[かんぶ]が、衣[ころも]でも、縦糸[たていと]でも、横糸[よこいと]でも、どのような細工[さいく]にも用[もち]いられるあらゆる皮[かわ]でも、広[ひろ]がっているなら、その患部[かんぶ]はしつこく残[のこ]る重[おも]い皮膚病[ひふびょう]であり、汚[けが]れている。"
  52: "その衣[ころも]、縦糸[たていと]、横糸[よこいと]、羊毛[ようもう]のものや麻[あさ]のもの、患部[かんぶ]のあるどのような皮[かわ]の細工物[さいくもの]でも、焼[や]き捨[す]てなさい。しつこく残[のこ]る重[おも]い皮膚病[ひふびょう]だから、火[ひ]で焼[や]き尽[つ]くさねばならない。"
  53: "しかし、祭司[さいし]が見[み]て、その患部[かんぶ]が衣[ころも]、縦糸[たていと]、横糸[よこいと]、どのような皮[かわ]の細工物[さいくもの]にも広[ひろ]がっていなければ、"
  54: "祭司[さいし]は命[めい]じなさい。患部[かんぶ]のあるものはそれを洗[あら]わせなさい。祭司[さいし]はその患部[かんぶ]を、もう一度[いちど]七日間[なぬかかん]隔離[かくり]しなさい。"
  55: "洗[あら]った後[あと]で祭司[さいし]がその患部[かんぶ]を見[み]なさい。患部[かんぶ]がまだその見[み]た目[め]を変[か]えておらず、広[ひろ]がっていなければ、それは汚[けが]れている。火[ひ]で焼[や]き尽[つ]くさねばならない。それは衣[ころも]、縦糸[たていと]、横糸[よこいと]に染[し]みついているからである。"
  56: "しかし、祭司[さいし]が見[み]て、洗[あら]った後[あと]でその患部[かんぶ]がかすんでいれば、その部分[ぶぶん]を衣[ころも]から、あるいは皮[かわ]から、あるいは縦糸[たていと]から、あるいは横糸[よこいと]から引[ひ]き裂[さ]きなさい。"
  57: "それがまた衣[ころも]、縦糸[たていと]、横糸[よこいと]、どのような皮[かわ]の細工物[さいくもの]に現[あら]われたなら、それは芽生[めば]え出[で]る重[おも]い皮膚病[ひふびょう]である。患部[かんぶ]のあるものは火[ひ]で焼[や]き尽[つ]くさねばならない。"
  58: "衣[ころも]、縦糸[たていと]、横糸[よこいと]、どのような皮[かわ]の細工物[さいくもの]でも、洗[あら]って患部[かんぶ]がそこから離[はな]れたなら、もう一度[いちど]洗[あら]えば清[きよ]いものとなる。"
  59: "これが、羊毛[ようもう]の衣[ころも]、麻[あさ]の衣[ころも]、縦糸[たていと]、横糸[よこいと]、どのような皮[かわ]の細工物[さいくもの]に生[しょう]じる重[おも]い皮膚病[ひふびょう]の患部[かんぶ]について、それを清[きよ]いものとし、あるいは汚[けが]れたものとするための律法[りっぽう]である。」"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν καὶ Ααρων λέγων — 主はモーセとアロンに言われた (λέγων «говоря»; слав. «глаголя»). Здесь Бог обращается к обоим; с 14:1 — только к Моисею."
  2: "ἀνθρώπῳ ἐάν τινι — «если у кого». οὐλὴ σημασίας τηλαυγής — «сияющий знак рубца»: LXX сжато передаёт евр. שְׂאֵת, סַפַּחַת, בַּהֶרֶת (опухоль, лишай, пятно); слав. добавляет «или блеск» (в греч. нет ἤ). ἁφή — «поражённое место» (евр. נֶגַע), не «прикосновение». ἀχθήσεται — «пусть его приведут» (pass.)."
  3: "μεταβάλῃ λευκή — «изменится в белый» (о волосе). ταπεινή — «ниже, углублена» (букв. «низкая»). μιανεῖ — «объявит нечистым» (μιαίνω «осквернять»; слав. «осквернит»)."
  4: "τηλαυγὴς λευκή — «сияюще-белый». ἀμαυρά — «тусклый, неясный». ἀφοριεῖ — «изолирует, заключит» (ἀφορίζω «отделять»); объект — сама язва (τὴν ἁφήν), не человек."
  5: "μένει ἐναντίον αὐτοῦ — «остаётся на его глазах», т.е. в прежнем виде. οὐ μετέπεσεν — «не переместилась, не распространилась» (μεταπίπτω). τὸ δεύτερον — «во второй раз»."
  6: "ἀμαυρά — «потускнела». σημασίας γάρ ἐστιν — «ибо это знак, примета» (σημασία); слав. «знамение», Син. «лишаи» (с евр.). καθαριεῖ — «объявит чистым» (καθαρίζω; слав. «очистит»)."
  7: "μεταβαλοῦσα μεταπέσῃ — усилительное сочетание: «изменившись, распространится». μετὰ τὸ ἰδεῖν… τοῦ καθαρίσαι — «после того как священник видел его, чтобы объявить чистым». ὀφθήσεται — «явится, будет показан»."
  8: "В слав. стих начинается без «и увидит его священник» — в греч. καὶ ὄψεται αὐτὸν ὁ ἱερεύς есть. λέπρα ἐστίν — «это проказа»."
  9: "ἁφὴ λέπρας — «язва проказы». ἥξει — «придёт» (ἥκω)."
  10: "οὐλὴ λευκή — «белый рубец, струп» (οὐλή). ἀπὸ τοῦ ὑγιοῦς τῆς σαρκὸς τῆς ζώσης — «от здорового [мяса] живой плоти», т.е. живое мясо в язве (слав. «от здравыя плоти живыя в струпе»)."
  11: "λέπρα παλαιουμένη — «застарелая проказа» (παλαιόω «делать старым»). μιανεῖ καὶ ἀφοριεῖ — «объявит нечистым и заключит»."
  12: "ἐξανθοῦσα ἐξανθήσῃ — гебраизм-усиление (абсолютный инфинитив): «расцветёт». καλύψῃ πᾶν τὸ δέρμα τῆς ἁφῆς — «покроет всю кожу [поражённого]» (ἁφῆς — gen. при δέρμα). καθ᾽ ὅλην τὴν ὅρασιν — «по всему, что видит взгляд»."
  13: "ἐκάλυψεν πᾶν τὸ δέρμα τοῦ χρωτός — «покрыла всю кожу тела». καθαριεῖ… τὴν ἁφήν — «объявит язву чистой» (вин. объекта — язва). πᾶν μετέβαλεν λευκόν — «всё стало белым»."
  14: "ᾗ ἂν ἡμέρᾳ — «в какой бы день». χρὼς ζῶν — «живая, здоровая плоть» (χρώς «кожа, плоть»). μιανθήσεται — «станет нечистым» (pass.)."
  15: "τὸν χρῶτα τὸν ὑγιῆ — «здоровую плоть» (ὑγιής). Смысл: священник видит живое мясо — оно нечисто."
  16: "ἀποκαταστῇ — «вернётся в прежнее состояние» (ἀποκαθίστημι). μεταβάλῃ λευκή — «изменится в белое»."
  17: "μετέβαλεν ἡ ἁφὴ εἰς τὸ λευκόν — «язва обратилась в белое». καθαριεῖ… τὴν ἁφήν — как в ст. 13."
  18: "ἕλκος — «гнойная рана, язва» (евр. שְׁחִין). ὑγιασθῇ — «заживёт» (ὑγιάζω)."
  19: "οὐλὴ λευκὴ ἢ τηλαυγὴς λευκαίνουσα ἢ πυρρίζουσα — «белый рубец, или сияюще-белое, или красноватое». πυρρίζω — «краснеть» (πυρρός «рыжий, красный»)."
  20: "ταπεινοτέρα τοῦ δέρματος — «ниже кожи» (сравн.). ἐξήνθησεν — «расцвела, появилась» (ἐξανθάω)."
  21: "οὐκ ἔστιν ἐν αὐτῷ θρὶξ λευκή — «нет в ней белого волоса». ἀμαυρά — «тусклая». ἀφοριεῖ — «заключит» (объект — человек)."
  22: "διαχέηται — «распространяется» (διαχέω, букв. «разливаться»). ἐν τῷ ἕλκει ἐξήνθησεν — «на язве расцвела»."
  23: "κατὰ χώραν μεῖνῃ — «останется на своём месте» (χώρα). τὸ τηλαύγημα — «сияющее пятно» (τηλαύγημα, ср. τηλαυγής). οὐλὴ τοῦ ἕλκους — «рубец язвы»."
  24: "κατάκαυμα πυρός — «ожог огня». τὸ ὑγιασθὲν τοῦ κατακαύματος — «зажившее [место] ожога». αὐγάζον — «сияющее» (αὐγάζω). ὑποπυρρίζον — «слегка красноватое» (ὑπό + πυρρίζω). ἔκλευκον — «совершенно белое»."
  25: "μετέβαλεν θρὶξ λευκὴ εἰς τὸ αὐγάζον — «белый волос изменился в сияющий» (слав. «пременися влас бел в блещащийся»). ἐν τῷ κατακαύματι ἐξήνθησεν — «на ожоге расцвела»."
  26: "ἐν τῷ αὐγάζοντι — «на сияющем [пятне]» (прич. ср. рода). ἀμαυρόν — «тусклое»."
  27: "διαχύσει διαχέηται — усиление: «сильно распространится». ἐν τῷ ἕλκει ἐξήνθησεν — здесь LXX говорит о «язве» (ἕλκος), хотя речь об ожоге (ср. ст. 25 κατάκαυμα); слав. «гной»."
  28: "τὸ αὐγάζον — «сияющее [пятно]». ἡ οὐλὴ τοῦ κατακαύματός — «рубец ожога». χαρακτήρ — «отпечаток, след» (слав. «образ»)."
  29: "ἀνδρὶ καὶ γυναικί — «мужчине и женщине». πώγων — «борода»."
  30: "ἐγκοιλοτέρα τοῦ δέρματος — «глубже кожи» (ἔγκοιλος «впалый»), ср. ταπεινός в ст. 3. θρὶξ ξανθίζουσα λεπτή — «волос желтоватый тонкий» (ξανθίζω «быть жёлтым»). θραῦσμα — «надлом, парша» (евр. נֶתֶק; слав. «вред»)."
  31: "θραῦσμα — «парша» (как в ст. 30). ἀφοριεῖ τὴν ἁφὴν τοῦ θραύσματος — «заключит поражённое место парши». В евр. «волос не чёрный», в греч. «нет желтоватого волоса»."
  32: "οὐ διεχύθη τὸ θραῦσμα — «не распространилась парша». κοίλη ἀπὸ τοῦ δέρματος — «впалая относительно кожи»."
  33: "ξυρηθήσεται τὸ δέρμα — «кожа будет обрита» (ξυράω); τὸ δὲ θραῦσμα οὐ ξυρηθήσεται — «паршу же не брить». В переводе добавлено 毛 («волосы»): по-японски «брить кожу» невозможно (слав. «острижет кожу»). τὸ δεύτερον — «во второй раз»."
  34: "μετὰ τὸ ξυρηθῆναι αὐτόν — «после того как он обрит». καθαριεῖ — «объявит чистым». πλυνάμενος τὰ ἱμάτια — «омыв одежды»."
  35: "διαχύσει διαχέηται — усиление (ср. ст. 27). μετὰ τὸ καθαρισθῆναι αὐτόν — «после того как он объявлен чистым»."
  36: "οὐκ ἐπισκέψεται περὶ τῆς τριχὸς τῆς ξανθῆς — «не будет искать жёлтого волоса» (ἐπισκέπτομαι «осматривать, разыскивать»)."
  37: "ἐνώπιον μεῖνῃ — «останется в прежнем виде» (букв. «перед ним»). ἐπὶ χώρας — «на своём месте». θρὶξ μέλαινα ἀνατείλῃ — «взойдёт чёрный волос». ὑγίακεν — perfect: «исцелела» (ὑγιάζω)."
  38: "αὐγάσματα αὐγάζοντα λευκαθίζοντα — «сияющие, белеющие пятна» (αὔγασμα, λευκαθίζω)."
  39: "ἀλφός — «белое пятно, витилиго» (евр. בֹּהַק; слав. «лишай»). ἐξανθεῖ — «расцветает»."
  40: "μαδήσῃ ἡ κεφαλή — «выпадут волосы головы» (μαδάω). φαλακρός — «плешивый»."
  41: "κατὰ πρόσωπον — «спереди». ἀναφάλαντος — «с лысиной на лбу» (слав. «взлыс»)."
  42: "φαλάκρωμα / ἀναφαλάντωμα — «плешь / лысина спереди». ἁφὴ λευκὴ ἢ πυρρίζουσα — «белая или красноватая язва»."
  43: "ὡς εἶδος λέπρας — «как вид проказы». πυρρίζουσα — «красноватая»."
  44: "μιάνσει μιανεῖ — гебраизм-усиление: «непременно объявит нечистым». ἐν τῇ κεφαλῇ αὐτοῦ ἡ ἁφὴ αὐτοῦ — «на голове его язва его»."
  45: "παραλελυμένα — «распущены, разодраны» (παραλύω). ἀκατακάλυπτος — «непокрытая». περὶ τὸ στόμα περιβαλέσθω — «пусть обернёт около уст» (закрыть верхнюю губу). ἀκάθαρτος κεκλήσεται — «будет назван нечистым» (слав. «прозовется»); Син. добавляет из евр. «кричать: нечист! нечист!» — в LXX этого нет."
  46: "κεχωρισμένος καθήσεται — «будет сидеть отдельно» (χωρίζω). διατριβή — «пребывание, жилище» (слав. «пребывание»). ἔξω τῆς παρεμβολῆς — «вне стана» (παρεμβολή)."
  47: "ἱμάτιον ἔρεον — «шерстяная одежда» (ἔρεος). στιππύϊνον — «льняное» (στιππύϊνον, от στύππη «пенька, лён»)."
  48: "στήμων — «основа» (продольные нити), κρόκη — «уток» (поперечные). λινᾶ — «льняное», ἐρεᾶ — «шерстяное». σκεῦος ἐργάσιμον δέρμα — «изделие из кожи» (ἐργάσιμος «обработанный»)."
  49: "χλωρίζουσα ἢ πυρρίζουσα — «зеленоватая или красноватая». δείξει τῷ ἱερεῖ — «покажет священнику»."
  50: "ἀφοριεῖ τὴν ἁφήν — «заключит язву» (не человека)."
  51: "κατὰ πάντα, ὅσα ἂν ποιηθῇ δέρματα ἐν τῇ ἐργασίᾳ — «по всему, что делается из кожи в работе». λέπρα ἔμμονος — «упорная проказа» (ἔμμονος «пребывающий»)."
  52: "κατακαύσει — «сожжёт» (κατακαίω). ἐν πυρὶ κατακαυθήσεται — «будет сожжено в огне»."
  53: "σκεύει δερματίνῳ — «кожаное изделие» (δερμάτινος, ср. ст. 48 ἐργάσιμον δέρμα)."
  54: "συντάξει — «прикажет» (συντάσσω). πλυνεῖ ἐφ᾽ οὗ ἂν ᾖ ἡ ἁφή — «омоет то, на чём язва». τὸ δεύτερον — «во второй раз»."
  55: "ἥδε μὴ μετέβαλεν τὴν ὄψιν — «не изменила вида» (ἥδε — усилительная частица). ἐστήρισται — perfect: «утвердилась, въелась» (στηρίζω)."
  56: "ἀμαυρά — «тусклая». ἀπορρήξει — «оторвёт» (ἀπορρήγνυμι). В конце греч. нет δέρμα («кожа») — так же и в слав."
  57: "λέπρα ἐξανθοῦσα — «расцветающая проказа». ἐν ᾧ ἐστὶν ἡ ἁφή — «то, на чём язва»."
  58: "ὃ πλυθήσεται — «что будет вымыто». ἀποστήσεται ἀπ᾽ αὐτοῦ ἡ ἁφή — «отойдёт от него язва». πλυθήσεται τὸ δεύτερον — «вымыто вторично»."
  59: "νόμος ἁφῆς λέπρας ἱματίου — «закон о язве проказы одежды». εἰς τὸ καθαρίσαι… ἢ μιᾶναι — «чтобы объявить чистым или нечистым»."
