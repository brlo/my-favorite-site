verses:
  1: "ファリサイ派[は]の人々[ひとびと]と、エルサレムから来[き]た律法学者[りっぽうがくしゃ]たちの何人[なんにん]かが、イエスのもとに集[あつ]まった。"
  2: "彼[かれ]らは、イエスの弟子[でし]たちのうちの何人[なんにん]かが、汚[けが]れた手[て]、すなわち洗[あら]わない手[て]でパンを食[た]べているのを見[み]た。"
  3: "（ファリサイ派[は]の人々[ひとびと]をはじめ、ユダヤ人[じん]は皆[みな]、昔[むかし]の人々[ひとびと]の言[い]い伝[つた]えを固[かた]く守[まも]り、手[て]をきちんと洗[あら]わなければ食事[しょくじ]をしない。"
  4: "また、市場[いちば]から帰[かえ]ったときも、身[み]を清[きよ]めなければ食[た]べない。ほかにも、杯[さかずき]、水差[みずさ]し、銅[どう]の器[うつわ]などを洗[あら]うことなど、受[う]け継[つ]いで固[かた]く守[まも]っていることが多[おお]くある。）"
  5: "そこで、ファリサイ派[は]の人々[ひとびと]と律法学者[りっぽうがくしゃ]たちはイエスに尋[たず]ねた。「あなたの弟子[でし]たちは、なぜ昔[むかし]の人々[ひとびと]の言[い]い伝[つた]えに従[したが]わず、汚[けが]れた手[て]でパンを食[た]べるのですか。」"
  6: "イエスは言[い]われた。「<j>イザヤは、あなたがた偽善者[ぎぜんしゃ]についてよく預言[よげん]した。こう書[か]かれている。『この民[たみ]は口先[くちさき]でわたしを敬[うやま]うが、その心[こころ]はわたしから遠[とお]ざかっている。</j>"
  7: "<j>彼[かれ]らは人[ひと]の掟[おきて]を教[おし]えとして教[おし]えながら、むなしくわたしを崇[あが]めている。』</j>"
  8: "<j>あなたがたは神[かみ]の掟[おきて]を捨[す]てて、人[ひと]の言[い]い伝[つた]えを固[かた]く守[まも]っている。〔すなわち、杯[さかずき]や水差[みずさ]しを洗[あら]うことなど、ほかにも似[に]たようなことを多[おお]く行[おこな]っている。〕</j>"
  9: "<j>あなたがたは、自分[じぶん]たちの言[い]い伝[つた]えを立[た]てるために、神[かみ]の掟[おきて]をうまく無効[むこう]にしている。</j>"
  10: "<j>モーセは『父[ちち]と母[はは]を敬[うやま]え』と言[い]い、また『父[ちち]または母[はは]を罵[ののし]る者[もの]は死[し]に処[しょ]せられる』と言[い]っている。</j>"
  11: "<j>ところが、あなたがたはこう言[い]う。『人[ひと]が父[ちち]または母[はは]に「コルバン」、すなわち「捧[ささ]げ物[もの]」と言[い]ったなら、</j>"
  12: "<j>その人[ひと]が父[ちち]や母[はは]のために何[なに]かをすることを、もはや許[ゆる]さない。</j>』"
  13: "<j>こうして、あなたがたは自分[じぶん]たちが伝[つた]えてきた言[い]い伝[つた]えによって、神[かみ]の言葉[ことば]を無効[むこう]にしている。そして、このようなことを多[おお]く行[おこな]っている。</j>」"
  14: "イエスは再[ふたた]び群衆[ぐんしゅう]を呼[よ]び寄[よ]せて言[い]われた。「<j>あなたがたは皆[みな]、わたしの話[はなし]を聞[き]いて悟[さと]りなさい。</j>"
  15: "<j>人[ひと]の外[そと]から入[はい]って来[く]るもので、その人[ひと]を汚[けが]すものは何[なに]もない。人[ひと]から出[で]て来[く]るものが、その人[ひと]を汚[けが]すのである。</j>」"
  16: "〔<j>聞[き]く耳[みみ]を持[も]つ者[もの]は、聞[き]きなさい。</j>〕"
  17: "イエスが群衆[ぐんしゅう]を離[はな]れて家[いえ]に入[はい]られると、弟子[でし]たちはこのたとえの意味[いみ]を尋[たず]ねた。"
  18: "イエスは言[い]われた。「<j>あなたがたまで、そんなに物分[ものわ]かりが悪[わる]いのか。外[そと]から人[ひと]に入[はい]って来[く]るものは、その人[ひと]を汚[けが]せないということが、まだ飲[の]み込[こ]めないのか。</j>"
  19: "<j>それは、その人[ひと]の心[こころ]に入[はい]らず、腹[はら]に入[はい]って、やがて外[そと]へ出[で]て行[い]くからである。</j>」こうしてイエスは、すべての食物[しょくもつ]を清[きよ]いものとされた。"
  20: "そして言[い]われた。「<j>人[ひと]から出[で]て来[く]るもの、それが人[ひと]を汚[けが]すのである。</j>"
  21: "<j>それは、内[うち]から、すなわち人[ひと]の心[こころ]から出[で]て来[く]るものである。悪[わる]い考[かんが]え、淫[いん]らな行[おこな]い、盗[ぬす]み、殺人[さつじん]、</j>"
  22: "<j>姦淫[かんいん]、貪欲[どんよく]、悪意[あくい]、欺[あざむ]き、放縦[ほうじゅう]、ねたみの目[め]、中傷[ちゅうしょう]、高慢[こうまん]、愚[おろ]かさである。</j>"
  23: "<j>これらの悪[わる]いものはすべて、内[うち]から出[で]て来[く]て、人[ひと]を汚[けが]すのである。</j>」"
  24: "イエスはそこを立[た]って、ティル〔とシドン〕の地方[ちほう]へ行[い]かれた。そして、ある家[いえ]に入[はい]って、だれにも知[し]られたくないと思[おも]われたが、隠[かく]れていることはできなかった。"
  25: "むしろ、汚[けが]れた霊[れい]に娘[むすめ]を取[と]りつかれていた女[おんな]が、イエスのうわさを聞[き]くとすぐに来[き]て、イエスの足[あし]もとにひれ伏[ふ]した。"
  26: "この女[おんな]は異邦人[いほうじん]で、シリア・フェニキアの出[で]であった。そして、娘[むすめ]から悪霊[あくりょう]を追[お]い出[だ]してほしいとイエスに願[ねが]った。"
  27: "イエスは言[い]われた。「<j>まず、子[こ]どもたちを満腹[まんぷく]にさせなさい。子[こ]どもたちのパンをもらって、小犬[こいぬ]に投[な]げ与[あた]えるのはよくないことだ。</j>」"
  28: "女[おんな]は答[こた]えて言[い]った。「主[しゅ]よ、そのとおりです。でも、小犬[こいぬ]も食卓[しょくたく]の下[した]で、子[こ]どもたちのパンの屑[くず]を食[た]べます。」"
  29: "イエスは言[い]われた。「<j>その言葉[ことば]のゆえに、帰[かえ]りなさい。悪霊[あくりょう]はあなたの娘[むすめ]から出[で]て行[い]った。</j>」"
  30: "女[おんな]は家[いえ]へ帰[かえ]ると、子[こ]どもが寝床[ねどこ]に横[よこ]たわっているのを見[み]た。悪霊[あくりょう]はもう出[で]て行[い]っていた。"
  31: "イエスは再[ふたた]びティルの地方[ちほう]を出[で]て、シドンを通[とお]り、デカポリスの地方[ちほう]を抜[ぬ]けて、ガリラヤ湖[みずうみ]へ行[い]かれた。"
  32: "人々[ひとびと]は、耳[みみ]が聞[き]こえず、うまく話[はな]せない人[ひと]をイエスのところへ連[つ]れて来[き]て、その人[ひと]に手[て]を置[お]いてくださいと願[ねが]った。"
  33: "イエスはその人[ひと]を群衆[ぐんしゅう]から離[はな]れた所[ところ]へ連[つ]れて行[い]き、指[ゆび]をその人[ひと]の耳[みみ]に入[い]れ、唾[つば]をつけてから、その舌[した]に触[ふ]れられた。"
  34: "そして天[てん]を仰[あお]いで深[ふか]い息[いき]をもらし、その人[ひと]に言[い]われた。「<j>エッファタ</j>」。すなわち「開[ひら]け」という意味[いみ]である。"
  35: "すると、その人[ひと]の耳[みみ]が開[ひら]け、舌[した]の結[むす]び目[め]も解[と]けて、正[ただ]しく話[はな]せるようになった。"
  36: "イエスはだれにも話[はな]さないようにと彼[かれ]らを戒[いまし]めた。しかし、戒[いまし]めれば戒[いまし]めるほど、彼[かれ]らはいよいよ盛[さか]んに宣[の]べ広[ひろ]めた。"
  37: "人々[ひとびと]はひどく驚[おどろ]いて言[い]った。「この方[かた]のなさったことは、どれもすばらしい。耳[みみ]の聞[き]こえない人[ひと]を聞[き]こえるようにし、口[くち]のきけない人[ひと]を話[はな]せるようにされる。」"

notes:
  3: "πυγμῇ νίψωνται — букв. «кулаком» (то есть тщательно, до локтя); передал きちんと洗う, без этнографической детали."
  4: "βαπτισμοὺς ποτηρίων… — омовения чаш и сосудов; [καὶ κλινῶν] в критическом тексте в скобках, «постелей» не добавлял."
  8: "В критическом тексте стих кончается на «предание человеческое»; Визант. (jp-joc) добавляет «омовения чаш и сосудов и многое другое» — в 〔…〕. Отсюда повтор списка из ст. 4 — так в церковном тексте."
  16: "В критическом издании стиха нет; церковное чтение — весь стих в 〔…〕, слова Христа оставлены красным."
  19: "καθαρίζων πάντα τὰ βρώματα — ремарка евангелиста, не речь Христа: вынесена за пределы красного текста."
  22: "ὀφθαλμὸς πονηρός — «завистливый глаз»; βλασφημία в списке пороков — «клевета», передал 中傷."
  24: "В критическом тексте «пределы Тирские»; Церковь читает «Тирские и Сидонские» — добавка 〔とシドン〕."
  26: "Ἑλληνίς — «гречанка», то есть язычница; передал 異邦人, как в церковной традиции. Συροφοινίκισσα — сирофиникиянка."
  27: "κυνάρια — уменьшительное «собачки», не «псы»; 小犬."
  31: "Δεκάπολις — Десятиградие; デカポリス."
  34: "Ἐφφαθά — арамейское «откройся»; エッファタ (у jp-joc エッファファ)."
  35: "εὐθέως в критическом тексте в квадратных скобках; «すぐに» не добавлял, стоит すると."
