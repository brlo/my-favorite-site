# jp-box, Притчи, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в гл. 14 есть выборочно (стихи 1–6 и 15–35; 7–14 пусты) —
# контроль церковного чтения. jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: мудрость и глупость в доме и на пути (1–9), страх Господень (2, 26–27),
# домы и шатры (11), путь смерти (12), сердце, его горе и радость (10, 13, 30, 33),
# свидетельство и язык (3, 5, 25), бедные и богатые (20–21, 31), гнев и долготерпение
# (17, 29), цари и народ (28, 35).
# Прямой речи нет: все стихи — авторские изречения, кавычек нет.
# Нумерация по gr: 35 стихов, дефектов модуля нет. Отличия csl: 14:26 «утверждение
# (мира)» и 14:32 «надеяйжеся на Господа» — добавки, в LXX их нет (отмечены в notes);
# 14:33 слав. вставляет глагол «почиет».
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

