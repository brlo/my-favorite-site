verses:
  1: "知恵[ちえ]ある女[おんな]たちは家[いえ]を建[た]て、愚[おろ]かな女は自分[じぶん]の手[て]でそれを壊[こわ]した。"
  2: "まっすぐに歩[あゆ]む者[もの]は主[しゅ]を恐[おそ]れる。しかし自分の道[みち]を曲[ま]げる者[もの]は辱[はずかし]めを受[う]ける。"
  3: "愚[おろ]かな者[もの]の口[くち]からは高慢[こうまん]の杖[つえ]が出[で]る。しかし知恵[ちえ]ある者[もの]の唇[くちびる]は彼[かれ]らを守[まも]る。"
  4: "牛[うし]のいないところでは、飼[か]い葉桶[ばおけ]は清[きよ]い。しかし多[おお]くの収穫[しゅうかく]があるところには、牛の力[ちから]が現[あらわ]れている。"
  5: "忠実[ちゅうじつ]な証人[しょうにん]は偽[いつわ]りを言[い]わない。しかし不[ふ]正[せい]な証人は偽りを燃[も]え上[あ]がらせる。"
  6: "悪[わる]い者[もの]たちの間[あいだ]に知恵[ちえ]を求[もと]めても、見[み]つけることはない。しかし分別[ふんべつ]ある者[もの]のもとでは、わきまえはたやすい。"
  7: "愚[おろ]かな人[ひと]にはすべてが逆[さか]らう。しかし知恵[ちえ]ある唇[くちびる]は、わきまえの武具[ぶぐ]である。"
  8: "賢[かしこ]い者[もの]の知恵[ちえ]は自分の道[みち]を見分[みわ]ける。しかし愚[おろ]かな者[もの]の無知[むち]は迷[まよ]いの中[なか]にある。"
  9: "不[ふ]法[ほう]な者[もの]の家[いえ]は清[きよ]めを負[お]う。しかし正[ただ]しい者[もの]の家は受[う]け入[い]れられる。"
  10: "人[ひと]の心[こころ]は敏感[びんかん]で、その魂[たましい]は悲[かな]しんでいる。しかし喜[よろこ]ぶときには、傲慢[ごうまん]さは混[ま]じり込[こ]まない。"
  11: "不敬[ふけい]な者[もの]の家[いえ]は消[き]え去[さ]り、正[ただ]しく歩[あゆ]む者[もの]の天幕[てんまく]は立[た]ち続[つづ]ける。"
  12: "人[ひと]の目[め]にまっすぐに見[み]える道[みち]がある。しかしその終[お]わりはよみの底[そこ]に至[いた]る。"
  13: "喜[よろこ]びの中[なか]に悲[かな]しみは混[ま]じらない。しかし喜びの終わりは嘆[なげ]きへと至る。"
  14: "心[こころ]の頑[かた]な者[もの]は自分の道[みち]に満[み]ち足[た]りる。しかし善[よ]い人[ひと]もまた、自分の思[おも]いによって満ち足りる。"
  15: "無[む]邪[じゃ]気[き]な者[もの]はどんな言葉[ことば]でも信[しん]じる。しかし賢[かしこ]い者[もの]は悔[く]い改[あらた]めに至[いた]る。"
  16: "知恵[ちえ]ある者[もの]は恐[おそ]れて悪[あく]から離[はな]れる。しかし愚[おろ]かな者[もの]は自分[じぶん]に頼[たよ]って不[ふ]法[ほう]な者[もの]と交[まじ]わる。"
  17: "怒[いか]りやすい者[もの]は思慮[しりょ]なく事[こと]を行[おこな]い、分別[ふんべつ]ある者[もの]は多[おお]くのことを耐[た]え忍[しの]ぶ。"
  18: "愚[おろ]かな者[もの]たちは悪[あく]を分[わ]け前[まえ]とし、賢[かしこ]い者[もの]たちはわきまえを手[て]に入[い]れる。"
  19: "悪[わる]い者[もの]たちは善[よ]い者[もの]たちの前[まえ]でつまずき、不敬[ふけい]な者[もの]たちは正[ただ]しい者[もの]の門[もん]の前で仕[つか]える。"
  20: "貧[まず]しい友[とも]は友に憎[にく]まれ、富[とみ]める者[もの]には友が多[おお]い。"
  21: "貧[まず]しい者[もの]を辱[はずかし]める者[もの]は罪[つみ]を犯[おか]す。しかし貧しい者をあわれむ者[もの]は幸[さいわ]いである。"
  22: "迷[まよ]う者[もの]たちは悪[あく]を営[いとな]み、善[よ]い者[もの]たちはあわれみと真理[しんり]を営む。悪をなす者[もの]たちはあわれみも信[しん]実[じつ]も知[し]らない。しかし善[よ]いことをなす者たちのところには、あわれみと信実がある。"
  23: "すべていそしむ者[もの]には余[よ]りがある。しかし快楽[かいらく]にふけり、何[なに]も気[き]にかけない者[もの]は乏[とぼ]しくなる。"
  24: "知恵[ちえ]ある者[もの]の冠[かんむり]はその富[とみ]である。しかし愚[おろ]かな者[もの]の暮[く]らしは災[わざわ]いである。"
  25: "忠実[ちゅうじつ]な証人[しょうにん]は魂[たましい]を災[わざわ]いから救[すく]い、欺[あざむ]く者[もの]は偽[いつわ]りを燃[も]え上[あ]がらせる。"
  26: "主[しゅ]を恐[おそ]れることのうちに、力[ちから]への希望[きぼう]がある。主はご自分[じぶん]の子[こ]らに支[ささ]えを残[のこ]される。"
  27: "主[しゅ]を恐れることは命[いのち]の泉[いずみ]であり、死[し]の罠[わな]から身[み]をかわさせる。"
  28: "民[たみ]の多[おお]いことは王[おう]の栄光[えいこう]であり、民の少[すく]ないことは君主[くんしゅ]の破滅[はめつ]である。"
  29: "怒[いか]りを遅[おそ]くする者[もの]は多[おお]くの分別[ふんべつ]を持[も]ち、気[き]の短[みじか]い者[もの]はひどく愚[おろ]かである。"
  30: "柔和[にゅうわ]な人[ひと]は心[こころ]の医者[いしゃ]である。しかし敏感[びんかん]な心は骨[ほね]を食[く]う虫[むし]である。"
  31: "貧[まず]しい者[もの]を虐[しいた]げる者[もの]は、これを造[つく]られた方[かた]を怒[いか]らせる。しかしこの方を敬[うやま]う者[もの]は貧しい者をあわれむ。"
  32: "不敬[ふけい]な者[もの]は自分の悪[あく]によって退[しりぞ]けられ、主[しゅ]に頼[たよ]る者[もの]は自分の聖[せい]さによって正[ただ]しい。"
  33: "善[よ]い心[こころ]のうちに知恵[ちえ]は宿[やど]る。しかし愚[おろ]かな者[もの]の心のうちでは、それは知[し]られない。"
  34: "正[ただ]しさは民[たみ]を高[たか]くし、罪[つみ]は部族[ぶぞく]を少[すく]なくする。"
  35: "思慮[しりょ]ある僕[しもべ]は王[おう]に喜[よろこ]ばれ、その巧[たくみ]さによって辱[はずかし]めを取[と]り除[のぞ]く。"

notes:
  1: "σοφαὶ γυναῖκες — «мудрые жёны» (мн. ч.), ἡ ἄφρων — «глупая» (ед. ч.): разница числа в греч. и слав. («мудрыя жены… безумная же») сохранена, в ru/MT обе половины в ед. ч. ᾠκοδόμησαν οἴκους — «создали дома» (οἰκοδομέω); κατέσκαψεν ταῖς χερσὶν αὐτῆς — «раскопала своими руками» (κατασκάπτω)."
  2: "ὁ πορευόμενος ὀρθῶς — «ходящий прямо» (ὀρθῶς); φοβεῖται τὸν κύριον — 主を恐れる. σκολιάζων ταῖς ὁδοῖς αὐτοῦ — «кривящий пути свои» (σκολιάζω — «делать кривым»); ἀτιμασθήσεται — «будет обесчещен» (ἀτιμάζω). ru/MT: «небрежет о Нем» — масоретское чтение, не внесено."
  3: "ἐκ στόματος ἀφρόνων βακτηρία ὕβρεως — «из уст глупых — жезл надменности» (βακτηρία — 杖; ὕβρις — «наглость»); χείλη σοφῶν φυλάσσει αὐτούς — «уста мудрых хранят их» (αὐτούς — их, т. е. самих мудрых)."
  4: "οὗ μή εἰσιν βόες, φάτναι καθαραί — «где нет волов, ясли чисты» (φάτνη — 飼い葉桶; καθαρός — «чистый», не «пустой»: ru «пусты», jp-joc «虚し»); οὗ πολλὰ γενήματα, φανερὰ βοὸς ἰσχύς — «где много урожая, явна сила вола» (γένημα — «произведение земли»; ἰσχύς)."
  5: "μάρτυς πιστὸς οὐ ψεύδεται — «свидетель верный не лжёт» (ψεύδομαι); ἐκκαίει ψεύδη μάρτυς ἄδικος — «разжигает ложь свидетель неправедный» (ἐκκαίω — «зажигать»)."
  6: "ζητήσεις σοφίαν παρὰ κακοῖς καὶ οὐχ εὑρήσεις — «будешь искать мудрость у злых и не найдёшь» (ζητέω); αἴσθησις παρὰ φρονίμοις εὐχερής — «понимание у разумных легко» (αἴσθησις — わきまえ, «чувство, различение»; εὐχερής — «легко достижимый»). ru/MT: «распутный ищет мудрости» — иное чтение."
  7: "πάντα ἐναντία ἀνδρὶ ἄφρονι — «всё противно человеку глупому» (ἐναντίος); ὅπλα αἰσθήσεως χείλη σοφά — «оружие понимания — уста мудрые» (ὅπλον — 武具). ru/MT: «отойди от человека глупого…» — масоретское чтение, не внесено."
  8: "σοφία πανούργων ἐπιγνώσεται τὰς ὁδούς αὐτῶν — «мудрость смышлёных познает пути их» (ἐπιγινώσκω); ἄνοια ἀφρόνων ἐν πλάνῃ — «безумие глупых в заблуждении» (ἄνοια; πλάνη)."
  9: "οἰκίαι παρανόμων ὀφειλήσουσιν καθαρισμόν — «дома беззаконных будут должны очищение» (ὀφείλω — «быть должным»; καθαρισμός); οἰκίαι δικαίων δεκταί — «дома праведных приняты, угодны» (δεκτός). ru/MT: «глупые смеются над грехом…» — иное чтение."
  10: "καρδία ἀνδρὸς αἰσθητική — «сердце человека чувствительное, восприимчивое» (αἰσθητικός); λυπηρὰ ψυχὴ αὐτοῦ — «печальна душа его»; ὅταν εὐφραίνηται, οὐκ ἐπιμείγνυται ὕβρει — «когда веселится, не примешивается к надменности, досаждению» (ἐπιμείγνυμι; ὕβρις). Место тёмное; ru/MT: «сердце знает горе души своей, и в радость его не вмешается чужой» — иное чтение."
  11: "οἰκίαι ἀσεβῶν ἀφανισθήσονται — «дома нечестивых исчезнут» (ἀφανίζω); σκηναὶ κατορθούντων στήσονται — «шатры правоходящих устоят» (σκηνή — 天幕; κατορθόω — «направлять прямо»; ἵστημι)."
  12: "ἔστιν ὁδὸς ἣ δοκεῖ ὀρθὴ εἶναι παρὰ ἀνθρώποις — «есть путь, который кажется прямым у людей» (δοκέω); τὰ τελευταῖα αὐτῆς ἔρχεται εἰς πυθμένα ᾅδου — «конец его приходит в дно ада» (πυθμήν — «дно»; ᾅδης — よみ, как в Псалтири; слав. «ад»)."
  13: "ἐν εὐφροσύναις οὐ προσμείγνυται λύπη — «в радостях не примешивается печаль» (εὐφροσύνη; προσμείγνυμι); τελευταία χαρὰ εἰς πένθος ἔρχεται — «последняя радость приходит в плач» (πένθος). Первая половина в LXX и слав. читается как утверждение, у ru/MT — «и при смехе иногда болит сердце»; оставлено по gr, напряжение отмечено."
  14: "τῶν ἑαυτοῦ ὁδῶν πλησθήσεται θρασυκάρδιος — «путей своих насытится дерзосердый» (θρασυκάρδιος — «дерзкий сердцем»); ἀπὸ τῶν διανοημάτων αὐτοῦ ἀνὴρ ἀγαθός — «от помышлений своих — человек добрый» (διανόημα), вторая половина с эллипсисом."
  15: "ἄκακος πιστεύει παντὶ λόγῳ — «незлобивый верит всякому слову» (ἄκακος); πανοῦργος ἔρχεται εἰς μετάνοιαν — «смышлёный приходит в раскаяние» (μετάνοια). Место тёмное: ru/MT и jp-joc читают «благоразумный внимателен к путям своим»; держимся gr и csl."
  16: "σοφὸς φοβηθεὶς ἐξέκλινεν ἀπὸ κακοῦ — «мудрый, убоявшись, уклонился от зла» (ἐκκλίνω); ἄφρων ἑαυτῷ πεποιθὼς μείγνυται ἀνόμῳ — «глупый, на себя понадеявшись, смешивается с беззаконным» (πείθω в perfect — «довериться»; μείγνυμι)."
  17: "ὀξύθυμος πράσσει μετὰ ἀβουλίας — «вспыльчивый действует без совета, необдуманно» (ὀξύθυμος; ἀβουλία); ἀνὴρ φρόνιμος πολλὰ ὑποφέρει — «разумный много переносит» (ὑποφέρω). ru/MT: «человек, умышленно делающий зло, ненавистен» — иное чтение."
  18: "μεριοῦνται ἄφρονες κακίαν — «получат в удел, разделят глупые злобу» (μερίζω); πανοῦργοι κρατήσουσιν αἰσθήσεως — «смышлёные овладеют пониманием» (κρατέω). ru/MT: «увенчаются знанием» — иное чтение."
  19: "ὀλισθήσουσιν κακοὶ ἔναντι ἀγαθῶν — «поскользнутся злые пред добрыми» (ὀλισθάνω); ἀσεβεῖς θεραπεύσουσιν θύρας δικαίων — «нечестивые будут прислуживать у ворот праведных» (θεραπεύω; θύρα)."
  20: "φίλοι μισήσουσιν φίλους πτωχούς — «друзья возненавидят друзей бедных» (μισέω; πτωχός); φίλοι πλουσίων πολλοί — «у богатых друзей много» (πλούσιος)."
  21: "ὁ ἀτιμάζων πένητας ἁμαρτάνει — «бесчестящий бедных грешит» (πένης); ἐλεῶν πτωχοὺς μακαριστός — «милующий нищих блажен» (μακαριστός — редкая форма)."
  22: "πλανώμενοι τεκταίνουσι κακά — «блуждающие замышляют злое» (πλανάω; τεκταίνω — «строить, мастерить»); ἔλεον καὶ ἀλήθειαν τεκταίνουσιν ἀγαθοί — «милость и истину замышляют добрые» (ἔλεος; ἀλήθεια). οὐκ ἐπίστανται ἔλεον καὶ πίστιν τέκτονες κακῶν — «не знают милости и веры делатели зла» (πίστις — здесь «верность»); ἐλεημοσύναι καὶ πίστεις παρὰ τέκτοσιν ἀγαθοῖς — «милостыни и веры у делателей добрых» (ἐλεημοσύνη)."
  23: "ἐν παντὶ μεριμνῶντι ἔνεστιν περισσόν — «во всяком заботящемся есть избыток, прибыток» (μεριμνάω; περισσόν); ἡδὺς καὶ ἀνάλγητος ἐν ἐνδείᾳ ἔσται — «сладострастный и беспечальный будет в нужде» (ἡδύς — «любящий удовольствия»; ἀνάλγητος — «не знающий боли, беспечный»; ἔνδεια). ru/MT: «от пустословия только ущерб» — иное чтение."
  24: "στέφανος σοφῶν πανοῦργος — «венец мудрых — πανοῦργος»: в gr слово значит «смышлёность, ловкость», в csl и jp-joc стоит «богатство их» (иное греч. чтение πλοῦτος); по паритету взято церковное 富, вариант gr отмечен. διατριβὴ ἀφρόνων κακή — «житие, занятие глупых дурно» (διατριβή)."
  25: "ῥύσεται ἐκ κακῶν ψυχὴν μάρτυς πιστός — «избавит от зол душу свидетель верный» (ῥύομαι); ἐκκαίει ψεύδη δόλιος — «разжигает ложь лукавый» (δόλιος)."
  26: "ἐν φόβῳ κυρίου ἐλπὶς ἰσχύος — «в страхе Господнем надежда силы» (ἐλπίς; ἰσχύς); τοῖς τέκνοις αὐτοῦ καταλείπει ἔρεισμα — «чадам своим оставляет утверждение, опору» (καταλείπω; ἔρεισμα — «подпора»). Слав. «утверждение (мира)»: «мира» стоит в скобках как вариант, в LXX его нет, не внесено."
  27: "πρόσταγμα κυρίου πηγὴ ζωῆς — «повеление Господне — источник жизни» (πρόσταγμα); ποιεῖ ἐκκλίνειν ἐκ παγίδος θανάτου — «заставляет уклоняться от сети смерти» (παγίς). Слав. «Страх Господень источник жизни»; по паритету взято слав. 主を恐れること, вариант LXX отмечен."
  28: "ἐν πολλῷ ἔθνει δόξα βασιλέως — «во множестве народа слава царю» (ἔθνος; δόξα); ἐν ἐκλείψει λαοῦ συντριβὴ δυνάστου — «в оскудении людей сокрушение властителю» (ἔκλειψις; συντριβή; δυνάστης)."
  29: "μακρόθυμος ἀνὴρ πολὺς ἐν φρονήσει — «долготерпеливый муж велик в разуме» (μακρόθυμος; φρόνησις); ὀλιγόψυχος ἰσχυρῶς ἄφρων — «малодушный крепко глуп» (ὀλιγόψυχος; ἰσχυρῶς)."
  30: "πραΰθυμος ἀνὴρ καρδίας ἰατρός — «кроткий муж — врач сердца» (πραΰθυμος; ἰατρός); σὴς ὀστέων καρδία αἰσθητική — «моль костей — сердце чувствительное» (σής — «моль»). Место тёмное: ru/MT и jp-joc читают «зависть — гниль для костей» (φθόνος), в LXX и csl — αἰσθητική; держимся gr, вариант отмечен."
  31: "ὁ συκοφαντῶν πένητα παροξύνει τὸν ποιήσαντα αὐτόν — «притесняющий бедного раздражает Сотворившего его» (συκοφαντέω — «клеветать, теснить»; παροξύνω); ὁ τιμῶν αὐτὸν ἐλεᾷ πτωχόν — «почитающий Его милует нищего» (τιμάω): «Его» — Бога, смена подлежащего сохранена."
  32: "ἐν κακίᾳ αὐτοῦ ἀπωσθήσεται ἀσεβής — «во злобе своей отринут будет нечестивый» (ἀπωθέω); πεποιθὼς τῇ ἑαυτοῦ ὁσιότητι δίκαιος — «уверенный в своей святости праведен» (ὁσιότης — «благочестие, святость»). Слав. добавляет «на Господа» («надеяйжеся на Господа»), в LXX этого нет; по паритету внесено (主に頼る), добавка отмечена. ru/MT: «праведный и при смерти своей имеет надежду» — иное."
  33: "ἐν καρδίᾳ ἀγαθῇ ἀνδρὸς σοφία — «в добром сердце человека — мудрость», без глагола; ἐν καρδίᾳ ἀφρόνων οὐ διαγινώσκεται — «в сердце глупых не познаётся» (διαγινώσκω). Слав. вставляет глагол «почиет» (нет в LXX) — передан 宿る, добавка отмечена."
  34: "δικαιοσύνη ὑψοῖ ἔθνος — «правда возвышает народ» (ὑψόω); ἐλασσονοῦσι φυλὰς ἁμαρτίαι — «умаляют племена грехи» (ἐλασσονόω — «делать меньшим»; φυλή)."
  35: "δεκτὸς βασιλεῖ ὑπηρέτης νοήμων — «угоден царю слуга разумный» (δεκτός; ὑπηρέτης; νοήμων); τῇ ἑαυτοῦ εὐστροφίᾳ ἀφαιρεῖται ἀτιμίαν — «своей ловкостью отнимает бесчестие» (εὐστροφία — «оборотистость»; ἀφαιρέω). Подлежащее второй половины — тот же разумный слуга; ru/MT: «гнев его — против того, кто позорит его» — иное, не внесено."
