verses:
  1: "安息日[あんそくび]が終[お]わった後[あと]、週[しゅう]の初[はじ]めの日[ひ]が明[あ]けかけたころ、マグダラのマリアともう一人[ひとり]のマリアが、墓[はか]を見[み]に来[き]た。"
  2: "すると、大地震[おおじしん]が起[お]きた。主[しゅ]の天使[てんし]が天[てん]から下[お]り、石[いし]を転[ころ]がしてわきへどけ、その上[うえ]に腰[こし]を下[お]ろしたのである。"
  3: "まとう衣[ころも]は雪[ゆき]のように白[しろ]く、姿[すがた]は稲妻[いなずま]のようだった。"
  4: "見張[みは]りの者[もの]たちは恐[おそ]ろしさのあまり震[ふる]え上[あ]がり、死[し]んだ者のようになった。"
  5: "天使[てんし]は婦人[ふじん]たちに言[い]った。「あなたがたは恐[おそ]れることはない。十字架[じゅうじか]につけられたイエスを捜[さが]していることを、わたしは知[し]っている。"
  6: "あの方[かた]はここにはおられない。言[い]われたとおり、復活[ふっかつ]されたのだ。来[き]て、お納[おさ]めしてあった所[ところ]を見[み]なさい。"
  7: "そして、すぐに行[い]って弟子[でし]たちに告[つ]げなさい。『あの方[かた]は死者[ししゃ]の中[なか]から復活[ふっかつ]され、あなたがたより先[さき]にガリラヤへ行[い]かれる。そこでお目[め]にかかれる。』見[み]よ、わたしはあなたがたに告[つ]げた。」"
  8: "婦人[ふじん]たちは、恐[おそ]れと大[おお]きな喜[よろこ]びを抱[かか]えて墓[はか]から急[いそ]ぎ去[さ]り、弟子[でし]たちに知[し]らせようと走[はし]って行[い]った。"
  9: "すると、イエスが彼女[かのじょ]たちの前[まえ]に現[あらわ]れて、「<j>喜[よろこ]びなさい</j>」と言[い]われた。彼女[かのじょ]たちは近[ちか]づいてイエスの足[あし]を抱[いだ]き、拝[おが]んだ。"
  10: "イエスは彼女[かのじょ]たちに言[い]われた。「<j>恐[おそ]れることはない。わたしの兄弟[きょうだい]たちのところへ行[い]き、ガリラヤへ向[む]かうように伝[つた]えなさい。そこで、彼[かれ]らはわたしに会[あ]う。</j>」"
  11: "婦人[ふじん]たちが行[い]く途中[とちゅう]、番兵[ばんぺい]のうちの何人[なんにん]かが都[みやこ]へ行[い]き、起[お]こった一部始終[いちぶしじゅう]を祭司長[さいしちょう]たちに報告[ほうこく]した。"
  12: "祭司長[さいしちょう]たちは長老[ちょうろう]たちと集[あつ]まって協議[きょうぎ]し、兵士[へいし]たちに多[おお]くの銀[ぎん]を与[あた]えた。"
  13: "そして言[い]った。「『夜[よる]、わたしたちが眠[ねむ]っている間[あいだ]に、あの弟子[でし]たちが来[き]て遺体[いたい]を盗[ぬす]んだ』と言[い]え。"
  14: "これが総督[そうとく]の耳[みみ]に入[はい]っても、わたしたちが総督[そうとく]を説得[せっとく]して、あなたがたに迷惑[めいわく]がかからないようにしよう。」"
  15: "銀[ぎん]を受[う]け取[と]った兵士[へいし]たちは、教[おし]えられたとおりにした。この話[はなし]はこうして、今日[こんにち]に至[いた]るまでユダヤ人[じん]の間[あいだ]に流[なが]れている。"
  16: "十一人[じゅういちにん]の弟子[でし]たちはガリラヤへ向[む]かい、イエスがお定[さだ]めになった山[やま]に着[つ]いた。"
  17: "そして、イエスを見[み]て拝[おが]んだが、疑[うたが]う者[もの]もいた。"
  18: "イエスはそばに寄[よ]って来[き]て、彼[かれ]らに語[かた]られた。「<j>わたしには、天[てん]と地[ち]のすべての権威[けんい]が与[あた]えられた。</j>"
  19: "<j>だから、あなたがたは出[で]かけて行[い]き、すべての民[たみ]を弟子[でし]にしなさい。彼[かれ]らに、父[ちち]と子[こ]と{聖霊[せいれい]|聖神[せいしん]}の名[な]によって洗礼[せんれい]を授[さず]け、</j>"
  20: "<j>わたしがあなたがたに命[めい]じたすべてのことを守[まも]るように、彼[かれ]らに教[おし]えなさい。見[み]よ、わたしは世[よ]の終[お]わりまで、いつもあなたがたと共[とも]にいる。</j>」"

notes:
  1: "ὀψὲ δὲ σαββάτων — «после же субботы» (позднее чтение — «поздно в субботу»); τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων — «на рассвете первого дня недели»; 週の初めの日が明けかけたころ, как в Мк 16:2. Пришли обе Марии — та же пара, что в 27:61."
  2: "σεισμὸς μέγας — «великое землетрясение»; 大地震. ἄγγελος κυρίου — 主の天使. Он отваливает камень и садится на него (腰を下ろした); у Марка камень уже отвален (16:4), у Матфея описано, как это произошло."
  3: "εἰδέα — «вид, облик»; 姿. ὡς ἀστραπή — «как молния»; 稲妻のよう. ὡς χιών — «как снег»; 雪のように. Части переставлены (сначала одежда, потом вид) ради ритма; смысл и оба сравнения сохранены."
  4: "ἀπὸ τοῦ φόβου αὐτοῦ — «от страха перед ним»; 恐ろしさのあまり. ἐγενήθησαν ὡς νεκροί — «стали как мёртвые»; 死んだ者のようになった (о страже, не о жёнах)."
  5: "Слова ангела — не красные. Μὴ φοβεῖσθε ὑμεῖς — «не бойтесь вы» (эмфатическое ὑμεῖς); あなたがたは恐れることはない. Ἰησοῦν τὸν ἐσταυρωμένον — 十字架につけられたイエス."
  6: "οὐκ ἔστιν ὧδε — «Его нет здесь»; ここにはおられない. ἠγέρθη — «восстал, пробуждён»; 復活された. καθὼς εἶπεν — «как сказал»; 言われたとおり. δεῦτε ἴδετε — «подойдите, посмотрите»; 来て…見なさい."
  7: "καὶ ταχὺ πορευθεῖσαι εἴπατε — «и быстро пойдя, скажите»; すぐに行って…告げなさい. προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν — «идёт перед вами в Галилею»; あなたがたより先にガリラヤへ行かれる, как в 26:32; 28:10, 16. ἰδοὺ εἶπον ὑμῖν — «вот, Я сказал вам»; 見よ、わたしはあなたがたに告げた."
  8: "μετὰ φόβου καὶ χαρᾶς μεγάλης — «со страхом и великой радостью»; 恐れと大きな喜びを抱えて — оба чувства вместе, не сглажено. ἔδραμον — «побежали»; 走って行った."
  9: "Χαίρετε — приветствие «радуйтесь»; передано 喜びなさい (в 26:49 χαῖρε — 喜んでください, там отмечено для ревью). Слова Христа красные. ἐκράτησαν τοὺς πόδας — «ухватились за ноги»; 足を抱き."
  10: "ἀδελφοῖς μου — «братьям Моим»; わたしの兄弟たち (не «ученикам»); ср. 28:7. κἀκεῖ με ὄψονται — «там Меня увидят»; そこで、彼らはわたしに会う (передано прямым будущим, не «смогут увидеть»)."
  11: "κουστωδία — «стража» (римская); 番兵, как в 27:65–66. ἅπαντα τὰ γενόμενα — «всё происшедшее»; 一部始終."
  12: "συμβούλιόν τε λαβόντες — «держав совет»; 協議し. ἀργύρια ἱκανά — «достаточно серебра»; 多くの銀."
  13: "ἡμῶν κοιμωμένων — «когда мы спали»; わたしたちが眠っている間に. Слова первосвященников, вложенная речь стражи — 『』, не красные."
  14: "ἐὰν ἀκουσθῇ τοῦτο ἐπὶ τοῦ ἡγεμόνος — «если это дойдёт до правителя»; 総督の耳に入っても. ἡμεῖς πείσομεν — «мы убедим»; わたしたちが総督を説得して. ἀμερίμνους — «беззаботными»; 迷惑がかからないように."
  15: "διεφημίσθη — «разнеслось, стало известно»; 流れている. παρὰ Ἰουδαίοις — «у иудеев»; ユダヤ人の間に. μέχρι τῆς σήμερον — «до сего дня»; 今日に至るまで."
  16: "οἱ ἕνδεκα — 十一人. τὸ ὄρος οὗ ἐτάξατο — «гора, которую назначил (велел прийти)»; お定めになった山; ср. 26:32 и 28:7, 10."
  17: "οἱ δὲ ἐδίστασαν — «некоторые же усомнились»; 疑う者もいた, без сглаживания в «уверовали». προσεκύνησαν — 拝んだ."
  18: "ἐδόθη μοι πᾶσα ἐξουσία — «дана Мне всякая власть»; すべての権威が与えられた. ἐξουσία — 権威, не 力; ἐν οὐρανῷ καὶ ἐπὶ γῆς — 天と地の."
  19: "μαθητεύσατε πάντα τὰ ἔθνη — «сделайте учениками все народы»; すべての民を弟子にしなさい. βαπτίζοντες εἰς τὸ ὄνομα — «крестя во имя»; 名によって…洗礼を授け. Формула 父と子と聖霊の名によって; 聖霊 дано как {聖霊[せいれい]|聖神[せいしん]}, чтобы работала калька 聖神."
  20: "τηρεῖν πάντα ὅσα ἐνετειλάμην — «соблюдать всё, что Я заповедал»; 守るように…教えなさい. ἕως τῆς συντελείας τοῦ αἰῶνος — «до конца века»; 世の終わりまで. ἐγὼ μεθ᾽ ὑμῶν εἰμι — «Я с вами»; わたしは…共にいる. Стих завершает Евангелие; в jp-joc добавлено «アミン», в византийском тексте его нет — не добавляю."
