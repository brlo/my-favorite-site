# jp-box, Иисус Навин, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: Иерихон (1–27): обход города, семь священников с трубами, ковчег,
# обрушение стен, спасение Раав, проклятие восстановителю.
# Речь Бога — 「…」 (2–5); речь Иисуса — 「…」 (7–9, 10, 16–19, 22, 25–26);
# вложенная речь — 『…』 (6:10, слова, которые народ должен возгласить).
# Красного нет. jp-ni не использовался.
# Нумерация по gr: 27 стихов. У csl 26, причём csl 6:1–26 = gr 6:2–27,
# а gr 6:1 (= csl 5:16) — «Иерихон же заключен…». Держимся gr.
# 〔…〕 один: 6:4 — в gr на месте стиха стоит «.», стих целиком по csl 6:3
# (внутри речи Бога, начатой в 6:2).
# Сносок ⟨…⟩ нет: 契約の箱, 祭司, 聖絶, 娼婦 уже пояснены в корпусе.

