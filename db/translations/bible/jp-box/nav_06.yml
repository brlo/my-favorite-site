verses:
  1: "エリコは閉[と]ざされ、堅[かた]く固[かた]められていた。そこから出[で]る者[もの]も、そこへ入[はい]る者も、だれもいなかった。"
  2: "主[しゅ]はヨシュアに言[い]われた。「見[み]よ、わたしはエリコとその王[おう]、およびその中[なか]にいる力[ちから]ある者[もの]たちを、あなたの手[て]に渡[わた]す。"
  3: "あなたは戦[たたか]う者[もの]たちを町[まち]の周[まわ]りに立[た]たせなさい。"
  4: "〔七人[しちにん]の祭司[さいし]に、契約[けいやく]の箱[はこ]の前[まえ]で七本[しちほん]の雄羊[おひつじ]の角[つの]のラッパを取[と]らせなさい。七日目[なのかめ]には町[まち]の周[まわ]りを七度[ななと]回[まわ]り、祭司[さいし]たちはラッパを吹[ふ]き鳴[な]らしなさい。〕"
  5: "あなたがたがラッパを吹[ふ]き鳴[な]らすと、民[たみ]はみな一斉[いっせい]に叫[さけ]ぶ。彼[かれ]らが叫[さけ]ぶと、町[まち]の城壁[じょうへき]はひとりでに崩[くず]れ落[お]ち、民[たみ]はみな、おのおのまっすぐに町[まち]へとなだれ込[こ]む。」"
  6: "ヌンの子[こ]ヨシュアは祭司[さいし]たちのところへ行[い]き、"
  7: "彼[かれ]らに言[い]った。「民[たみ]に命[めい]じて、町[まち]を回[まわ]って囲[かこ]ませなさい。戦[たたか]う者[もの]たちは武具[ぶぐ]を着[つ]けて主[しゅ]の前[まえ]を行[ゆ]き過[す]ぎなさい。"
  8: "七人[しちにん]の祭司[さいし]は七本[しちほん]の聖[せい]なるラッパを持[も]ち、同[おな]じように主[しゅ]の前[まえ]を行[ゆ]き過[す]ぎて、力強[ちからづよ]く吹[ふ]き鳴[な]らしなさい。契約[けいやく]の箱[はこ]はその後[あと]をついて行[い]く。"
  9: "戦[たたか]う者[もの]たちは前[まえ]を行[ゆ]き、後[うし]ろを閉[し]める祭司[さいし]たちは、契約[けいやく]の箱[はこ]の後[うし]ろを、ラッパを吹[ふ]き鳴[な]らしながら行[ゆ]きなさい。」"
  10: "ヨシュアは民[たみ]に命[めい]じた。「叫[さけ]んではならない。あなたがたの声[こえ]をだれにも聞[き]かせてはならない。わたしが自[みずか]らあなたがたに『叫[さけ]べ』と告[つ]げ知[し]らせる日[ひ]まで、そうしていなさい。そのとき、あなたがたは叫[さけ]ぶのだ。」"
  11: "神[かみ]の契約[けいやく]の箱[はこ]は町[まち]を回[まわ]り終[お]えると、すぐに宿営[しゅくえい]へ戻[もど]り、そこで夜[よる]を明[あ]かした。"
  12: "二日目[ふつかめ]の朝[あさ]、ヨシュアは早[はや]く起[お]きた。祭司[さいし]たちは契約[けいやく]の箱[はこ]を担[かつ]ぎ、"
  13: "七人[しちにん]の祭司[さいし]は七本[しちほん]のラッパを担[かつ]いで主[しゅ]の前[まえ]を行[ゆ]き、その後[あと]を戦[たたか]う者[もの]たちと残[のこ]りの群衆[ぐんしゅう]が、契約[けいやく]の箱[はこ]の後[うし]ろについて行[い]った。祭司[さいし]たちはラッパを吹[ふ]き鳴[な]らし、残[のこ]りの群衆[ぐんしゅう]はみな、町[まち]の近[ちか]くを回[まわ]り、"
  14: "そしてまた宿営[しゅくえい]へ戻[もど]った。こうして六日[むいか]の間[あいだ]、そのとおりに行[おこな]った。"
  15: "七日目[なのかめ]の暁[あかつき]に彼[かれ]らは起[お]き、町[まち]を六度[ろくど]回[まわ]った。"
  16: "七度目[ななとめ]の回[まわ]りで祭司[さいし]たちがラッパを吹[ふ]き鳴[な]らすと、ヨシュアはイスラエルの子[こ]らに言[い]った。「叫[さけ]べ。主[しゅ]があなたがたにこの町[まち]を渡[わた]されたからである。"
  17: "この町[まち]は、その中[なか]にあるすべてのものとともに、万軍[ばんぐん]の主[しゅ]への聖絶[せいぜつ]の物[もの]となる。ただ、娼婦[しょうふ]ラハブと、その家[いえ]にあるすべてのものを生[い]かしておきなさい。"
  18: "ただし、あなたがたは聖絶[せいぜつ]の物[もの]から十分[じゅうぶん]に用心[ようじん]しなさい。あなたがたが心[こころ]に思[おも]って聖絶の物から取[と]り、イスラエルの子[こ]らの宿営[しゅくえい]を聖絶の物として、わたしたちを滅[ほろ]ぼしてしまうことのないように。"
  19: "銀[ぎん]でも金[きん]でも、青銅[せいどう]でも鉄[てつ]でも、すべては主[しゅ]に聖[せい]なるものとなり、主[しゅ]の宝庫[ほうこ]へ運[はこ]び入[い]れられる。」"
  20: "祭司[さいし]たちがラッパを吹[ふ]き鳴[な]らした。民[たみ]はラッパの音[ね]を聞[き]くと、みな一斉[いっせい]に大[おお]きな力[ちから]ある叫[さけ]び声[ごえ]を上[あ]げた。すると、周[まわ]りの城壁[じょうへき]はすべて崩[くず]れ落[お]ち、民[たみ]はみな町[まち]へ上[のぼ]って行[い]った。"
  21: "ヨシュアは町[まち]と、その中[なか]にあるすべてのものを聖絶[せいぜつ]した。男[おとこ]も女[おんな]も、若[わか]い者[もの]も年[とし]取[と]った者[もの]も、子牛[こうし]も荷[に]を運[はこ]ぶ家畜[かちく]も、みな剣[つるぎ]の刃[は]にかけて滅[ほろ]ぼした。"
  22: "地[ち]を探[さぐ]った二人[ふたり]の若者[わかもの]にヨシュアは言[い]った。「あの女[おんな]の家[いえ]に入[はい]り、彼女[かのじょ]と、彼女のところにあるすべてのものを、そこから連[つ]れ出[だ]しなさい。」"
  23: "町[まち]を探[さぐ]った二人[ふたり]の若者[わかもの]は、その女[おんな]の家[いえ]に入[はい]り、娼婦[しょうふ]ラハブと、その父[ちち]、母[はは]、兄弟[きょうだい]、彼女[かのじょ]にあるすべてのもの、またその親族[しんぞく]すべてを連[つ]れ出[だ]し、イスラエルの宿営[しゅくえい]の外[そと]に立[た]たせた。"
  24: "町[まち]は、その中[なか]にあるすべてのものとともに火[ひ]で焼[や]かれた。ただ、銀[ぎん]、金[きん]、青銅[せいどう]、鉄[てつ]は、主[しゅ]の宝庫[ほうこ]へ運[はこ]び入[い]れるために取[と]っておかれた。"
  25: "娼婦[しょうふ]ラハブとその父[ちち]の家[いえ]のすべてを、ヨシュアは生[い]かしておいた。彼女[かのじょ]は今日[きょう]に至[いた]るまでイスラエルの中[なか]に住[す]んだ。彼女が、ヨシュアがエリコを探[さぐ]らせるために遣[つか]わした者[もの]たちを隠[かく]したからである。"
  26: "その日[ひ]、ヨシュアは主[しゅ]の前[まえ]で誓[ちか]って言[い]った。「この町[まち]を建[た]て直[なお]す人[ひと]は、主[しゅ]の前[まえ]で呪[のろ]われる。彼[かれ]は長男[ちょうなん]を失[うしな]ってその礎[いしずえ]を据[す]え、末[すえ]の子[こ]を失ってその門[もん]を立[た]てることになる。」こうしてベテルのオザンは、長男[ちょうなん]アビロンによってその礎[いしずえ]を据[す]え、末[すえ]の生[い]き残[のこ]った子[こ]によってその門[もん]を立[た]てた。"
  27: "主[しゅ]はヨシュアとともにおられ、ヨシュアの名[な]は全[ぜん]地[ち]に響[ひび]き渡[わた]った。"

notes:
  1: "συγκεκλεισμένη καὶ ὠχυρωμένη — заперт и укреплён (συγκλείω, ὀχυρόω). οὐθεὶς ἐξεπορεύετο ἐξ αὐτῆς οὐδὲ εἰσεπορεύετο — никто не выходил из неё и не входил. У csl этот стих стоит как 5:16."
  2: "Ἰδοὺ ἐγὼ παραδίδωμι ὑποχείριόν σου — «вот, Я предаю в твои руки» (ὑποχείριος). τὸν βασιλέα αὐτῆς τὸν ἐν αὐτῇ δυνατοὺς ὄντας ἐν ἰσχύι — царя её и находящихся в ней, сильных крепостью; в греч. анаколуф, винительный ряд, сохранён."
  3: "σὺ δὲ περίστησον αὐτῇ τοὺς μαχίμους κύκλῳ — «ты же поставь вокруг неё воинов» (περίστημι; μάχιμος — воин). Стих короткий, продолжение в 4–5."
  4: "В gr-lxx-byz (и в gr-ru) на месте стиха стоит «.» — текст в модуле утрачен. Стих целиком по csl 6:3: семь священников с семью роговыми трубами пред ковчегом, в седьмой день обойти город семь раз, священники трубят. Часть этих слов в греч. есть в 6:8 — двойное чтение LXX; повтор оставлен, как в церковном тексте."
  5: "καὶ ἔσται ὡς ἂν σαλπίσητε — «и будет, когда затрубите» (σαλπίζω). ἀνακραγέτω πᾶς ὁ λαὸς ἅμα — пусть воскликнет весь народ вместе (ἀνακράζω). πεσεῖται αὐτόματα τὰ τείχη — падут сами собою стены (αὐτόματος). ὁρμήσας ἕκαστος κατὰ πρόσωπον — устремившись каждый прямо перед собою."
  6: "καὶ εἰσῆλθεν Ἰησοῦς ὁ τοῦ Ναυη πρὸς τοὺς ἱερεῖς — вошёл Иисус, сын Навин, к священникам; фраза обрывается, продолжение в 7."
  7: "Παραγγείλατε τῷ λαῷ — возвестите народу (παραγγέλλω). περιελθεῖν καὶ κυκλῶσαι — обойти и окружить. οἱ μάχιμοι παραπορευέσθωσαν ἐνωπλισμένοι ἐναντίον κυρίου — воины пусть проходят вооружённые пред Господом (παραπορεύομαι; ἐνοπλίζω)."
  8: "ἑπτὰ ἱερεῖς ἔχοντες ἑπτὰ σάλπιγγας ἱερὰς — семь священников с семью священными трубами. σημαινέτωσαν εὐτόνως — пусть трубят усиленно, громко (σημαίνω; εὐτόνως). ἡ κιβωτὸς τῆς διαθήκης κυρίου ἐπακολουθείτω — ковчег завета Господня пусть следует (ἐπακολουθέω)."
  9: "οἱ ἱερεῖς οἱ οὐραγοῦντες ὀπίσω τῆς κιβωτοῦ — священники, замыкающие позади ковчега (οὐραγέω). πορευόμενοι καὶ σαλπίζοντες — идя и трубя. Здесь закрывается речь Иисуса, начатая в 7."
  10: "μὴ βοᾶτε — не кричите. μηδὲ ἀκουσάτω μηθεὶς ὑμῶν τὴν φωνήν — и пусть никто не слышит голоса вашего. ἕως ἂν ἡμέραν αὐτὸς διαγγείλῃ ἀναβοῆσαι — до того дня, когда сам возвестит воскликнуть (διαγγέλλω). καὶ τότε ἀναβοήσετε — и тогда воскликнете. Слова 『叫べ』 — вложенная речь."
  11: "περιελθοῦσα ἡ κιβωτὸς ... τὴν πόλιν — обойдя город. εὐθέως ἀπῆλθεν εἰς τὴν παρεμβολήν — тотчас ушла в стан. ἐκοιμήθη ἐκεῖ — почила, ночевала там."
  12: "τῇ ἡμέρᾳ τῇ δευτέρᾳ — во второй день. ἀνέστη Ἰησοῦς τὸ πρωί — встал Иисус рано. ἦραν οἱ ἱερεῖς τὴν κιβωτόν — понесли священники ковчег; стих обрывается, продолжение в 13."
  13: "οἱ ἑπτὰ ἱερεῖς οἱ φέροντες τὰς σάλπιγγας — семь священников, несущие трубы. προεπορεύοντο ἐναντίον κυρίου — шли впереди пред Господом. ὁ λοιπὸς ὄχλος ὄπισθε τῆς κιβωτοῦ — остальной народ позади ковчега. περιεκύκλωσε τὴν πόλιν ἐγγύθεν — обошёл город вблизи."
  14: "καὶ ἀπῆλθεν πάλιν εἰς τὴν παρεμβολήν — и ушёл опять в стан. οὕτως ἐποίει ἐπὶ ἓξ ἡμέρας — так делал шесть дней."
  15: "τῇ ἡμέρᾳ τῇ ἑβδόμῃ ... ὄρθρου — в седьмой день, на рассвете (ὄρθρος). περιήλθοσαν τὴν πόλιν ἑξάκις — обошли город шесть раз (ἑξάκις; слав. «седмижды»)."
  16: "τῇ περιόδῳ τῇ ἑβδόμῃ — при седьмом обходе (περίοδος). Κεκράξατε — воскликните. παρέδωκεν γὰρ κύριος ὑμῖν τὴν πόλιν — ибо предал Господь вам город. Речь Иисуса продолжается до 19."
  17: "ἀνάθεμα ... κυρίῳ σαβαωθ — заклятое Господу Саваофу (ἀνάθεμα; σαβαωθ = «воинств»). πλὴν Ρααβ τὴν πόρνην περιποιήσασθε — только Раав блудницу сохраните (περιποιέω)."
  18: "φυλάξασθε σφόδρα ἀπὸ τοῦ ἀναθέματος — берегитесь крепко заклятого. μήποτε ἐνθυμηθέντες ... λάβητε — чтобы, помыслив, не взяли. ποιήσητε τὴν παρεμβολὴν ... ἀνάθεμα — не сделали стан заклятым. ἐκτρίψητε ἡμᾶς — не погубили нас (ἐκτρίβω)."
  19: "πᾶν ἀργύριον ἢ χρυσίον ἢ χαλκὸς ἢ σίδηρος — всякое серебро, золото, медь, железо. ἅγιον ἔσται τῷ κυρίῳ — свято будет Господу. εἰς θησαυρὸν κυρίου εἰσενεχθήσεται — в сокровищницу Господню будет внесено."
  20: "ἐσάλπισαν ταῖς σάλπιγξιν — затрубили трубами. ἠλάλαξεν ... ἀλαλαγμῷ μεγάλῳ καὶ ἰσχυρῷ — воскликнул воплем великим и сильным (ἀλαλάζω, ἀλαλαγμός). ἔπεσεν ἅπαν τὸ τεῖχος κύκλῳ — пала вся стена вокруг. ἀνέβη πᾶς ὁ λαὸς εἰς τὴν πόλιν — взошёл весь народ в город. Слав. добавляет «и прияша град» — в gr нет."
  21: "ἀνεθεμάτισεν αὐτὴν Ἰησοῦς — предал её заклятию Иисус. ἀπὸ ἀνδρὸς καὶ ἕως γυναικός — от мужа и до жены. ἀπὸ νεανίσκου καὶ ἕως πρεσβύτου — от юноши и до старца. ἕως μόσχου καὶ ὑποζυγίου — до телёнка и вьючного животного. ἐν στόματι ῥομφαίας — «устами меча», т. е. мечом."
  22: "τοῖς δυσὶν νεανίσκοις τοῖς κατασκοπεύσασιν — двум юношам, осматривавшим. Εἰσέλθατε εἰς τὴν οἰκίαν τῆς γυναικὸς — войдите в дом женщины. ἐξαγάγετε ... ὅσα ἐστὶν αὐτῇ — выведите её и всё, что у неё."
  23: "ἐξηγάγοσαν Ρααβ τὴν πόρνην — вывели Раав блудницу. πᾶσαν τὴν συγγένειαν αὐτῆς — всё родство её (συγγένεια). κατέστησαν αὐτὴν ἔξω τῆς παρεμβολῆς Ισραηλ — поставили её вне стана Израиля."
  24: "ἐνεπρήσθη ἐμπυρισμῷ — сожжён сожжением (ἐμπίμπρημι, внутренний винительный). πλὴν ἀργυρίου καὶ χρυσίου — кроме серебра и золота. ἔδωκαν εἰς θησαυρὸν κυρίου εἰσενεχθῆναι — отдали, чтобы внести в сокровищницу Господню."
  25: "ἐζώγρησεν — оставил в живых (ζωγρέω). κατῴκησεν ἐν τῷ Ισραηλ ἕως τῆς σήμερον ἡμέρας — жила в Израиле до сего дня. διότι ἔκρυψεν τοὺς κατασκοπεύσαντας — потому что скрыла осматривавших."
  26: "ὥρκισεν Ἰησοῦς ... ἐναντίον κυρίου — заклинал Иисус пред Господом (ὁρκίζω). Ἐπικατάρατος ὁ ἄνθρωπος — проклят человек (ἐπικατάρατος). ἐν τῷ πρωτοτόκῳ αὐτοῦ θεμελιώσει — на первенце своём положит основание. ἐν τῷ ἐλαχίστῳ ... ἐπιστήσει τὰς πύλας — на меньшем поставит ворота. Οζαν ὁ ἐκ Βαιθηλ ... ἐν τῷ Αβιρων — Озан из Вефиля, на Авироне; исполнение проклятия (ср. 3 Цар 16:34)."
  27: "ἦν κύριος μετὰ Ἰησοῦ — был Господь с Иисусом. ἦν τὸ ὄνομα αὐτοῦ κατὰ πᾶσαν τὴν γῆν — имя его по всей земле."
