verses:
  1: "「主[しゅ]よ、わたしの命[いのち]の父[ちち]また主人[しゅじん]よ、彼[かれ]らの相談[そうだん]のうちにわたしを捨[す]て置[お]かないでください。彼[かれ]らの間[あいだ]でわたしを倒[たお]れさせないでください。"
  2: "だれがわたしの思[おも]いに鞭[むち]を置[お]き、わたしの心[こころ]に知恵[ちえ]の戒[いまし]めを置[お]いてくれるでしょう。わたしの無[む]知[ち]のゆえに彼[かれ]らが容赦[ようしゃ]せず、彼[かれ]らの罪[つみ]が過[す]ぎ去[さ]らないためです。"
  3: "そうでなければ、わたしの無[む]知[ち]が増[ふ]え、わたしの罪[つみ]が多[おお]くなり、わたしが敵[てき]の前[まえ]で倒[たお]れ、わたしの敵[かたき]がわたしを喜[よろこ]ぶでしょう。"
  4: "主[しゅ]よ、わたしの命[いのち]の父[ちち]また神[かみ]よ、わたしに目[め]の高[たか]ぶりを与[あた]えないでください。わたしから情[じょう]欲[よく]を遠[とお]ざけてください。"
  5: "腹[はら]の欲[よく]と交[まじ]わりがわたしを捕[と]らえず、恥[はじ]知[し]らずの魂[たましい]にわたしを渡[わた]さないでください。」"
  6: "子[こ]らよ、口[くち]の戒[いまし]めを聞[き]け。これを守[まも]る者[もの]は、自分[じぶん]の唇[くちびる]によって捕[と]らえられない。"
  7: "罪人[つみびと]はその唇[くちびる]によって捕[と]らえられ、ののしる者[もの]と高慢[こうまん]な者[もの]はそれによってつまずく。"
  8: "あなたの口[くち]を誓[ちか]いに慣[な]らしてはならない。"
  9: "聖[せい]なる方[かた]の名[な]を唱[とな]えることに慣れてはならない。"
  10: "なぜなら、しもべが絶[た]えず調[しら]べられても、その打[う]ち傷[きず]が少[すく]なくなることはないのと同じように、絶[た]えず誓[ちか]い、名[な]を唱[とな]える者[もの]も、罪[つみ]から決[けっ]して清[きよ]められないからである。"
  11: "多[おお]く誓[ちか]う男[おとこ]は不法[ふほう]に満[み]ち、その家[いえ]から鞭[むち]が離[はな]れない。"
  12: "もし彼[かれ]が過[あやま]ちを犯[おか]せば、その罪[つみ]は彼[かれ]の上[うえ]にある。もし軽[かろ]んじても、彼は二重[にじゅう]に罪を犯[おか]したことになる。"
  13: "もし空[むな]しく誓[ちか]っても、彼は正[ただ]しいとされない。その家[いえ]は災[わざわ]いで満ちるからである。"
  14: "死[し]に比[くら]べられるような言葉[ことば]がある。それはヤコブの嗣業[しぎょう]のうちに見[み]いだされてはならない。"
  15: "敬虔[けいけん]な者[もの]たちからは、これらすべてが遠[とお]ざかるからである。彼[かれ]らは罪[つみ]のうちに転[ころ]がり込[こ]まない。"
  16: "あなたの口[くち]を無[む]教養[きょうよう]なことに慣[な]らしてはならない。そこには罪[つみ]の言葉[ことば]があるからである。"
  17: "父[ちち]と母[はは]を思[おも]い起[おこ]せ。あなたは偉[えら]い者[もの]たちの間[あいだ]に座[すわ]っているのだから。"
  18: "彼[かれ]らの前[まえ]で忘[わす]れ、習慣[しゅうかん]によって愚[おろ]かになり、生[う]まれなかったほうがよかったと願[ねが]い、自分[じぶん]の誕生[たんじょう]の日[ひ]を呪[のろ]わないためである。"
  19: "ののしりの言葉[ことば]に慣[な]れた人[ひと]は、その日々[ひび]のすべてにおいて戒[いまし]めを受[う]けない。"
  20: "二[ふた]つの種類[しゅるい]のものが罪[つみ]を増[ふ]やし、第三[だいさん]のものが怒[いか]りを引[ひ]き起[おこ]す。"
  21: "燃[も]え盛[さか]る火[ひ]のような熱[あつ]い魂[たましい]は、飲[の]み込[こ]まれるまで消[き]えない。"
  22: "自分[じぶん]の肉[にく]の体[からだ]のうちで淫[いん]を働[はたら]く者[もの]は、火[ひ]を燃[も]え上[あ]がらせるまでやめない。"
  23: "淫[いん]を働く者[もの]にはどんなパンも甘[あま]く、彼[かれ]は死[し]ぬまで休[やす]まない。"
  24: "自分[じぶん]の寝床[ねどこ]から外[はず]れて歩[ある]く者[もの]は、心[こころ]のうちで言[い]う。「だれがわたしを見[み]るのか。"
  25: "闇[やみ]がわたしを囲[かこ]み、壁[かべ]がわたしを覆[おお]っている。だれもわたしを見ていない。何[なに]を恐[おそ]れることがあるのか。いと高[たか]い方[かた]はわたしの罪[つみ]を思[おも]い出[だ]さない。」"
  26: "また、彼[かれ]が恐[おそ]れるのは人[ひと]の目[め]だけである。"
  27: "彼[かれ]は知[し]らないのだ。主[しゅ]の目[め]は太陽[たいよう]よりも万倍[まんばい]明[あか]るく、"
  28: "人[ひと]のすべての道[みち]を見[み]渡[わた]し、隠[かく]れた所[ところ]まで見[み]通[とお]していることを。"
  29: "すべてのものが造[つく]られる前[まえ]から、それらは彼[かれ]に知[し]られており、造[つく]られた後[あと]も同[おな]じである。"
  30: "この者[もの]は都[みやこ]の広場[ひろば]で罰[ばつ]せられ、思[おも]いもよらなかった所[ところ]で捕[と]らえられる。"
  31: "同[おな]じように、夫[おっと]を捨[す]てて他人[たにん]から嗣業[しぎょう]の子[こ]を産[う]む女[おんな]もそうである。"
  32: "第一[だいいち]に、彼女[かのじょ]はいと高[たか]い方[かた]の律法[りっぽう]に背[そむ]いた。第二[だいに]に、自分[じぶん]の夫[おっと]に対して過[あやま]ちを犯[おか]した。第三[だいさん]に、淫[いん]を働[はたら]いて姦淫[かんいん]し、他人[たにん]の夫[おっと]から子[こ]を産[う]んだのである。"
  33: "彼女[かのじょ]は集会[しゅうかい]へ引[ひ]き出[だ]され、その子[こ]らについても調[しら]べられる。"
  34: "彼女[かのじょ]の子[こ]らは根[ね]を張[は]らず、その枝[えだ]は実[み]を結[むす]ばない。"
  35: "彼女[かのじょ]はのろいのために記憶[きおく]を残[のこ]し、その恥[はじ]は消[き]え去[さ]らない。"
  36: "そして、残[のこ]された者[もの]たちは知[し]る。主[しゅ]を恐[おそ]れることにまさるものはなく、主[しゅ]の戒[いまし]めに心[こころ]を留[と]めることよりも甘[あま]いものはない、ということを。"
  37: "主[しゅ]に従[したが]うことは大[おお]きな栄光[えいこう]であり、主に受[う]け入[い]れられることは長[なが]い命[いのち]の日々[ひび]である。"

notes:
  1: "κύριε πάτερ καὶ δέσποτα ζωῆς μου — «Господи, Отче и Владыко жизни моей» (δέσποτα — зват. от δεσπότης, 主人). μὴ ἐγκαταλίπῃς με ἐν βουλῇ αὐτῶν — «не оставь меня в совете их» (βουλή — совет, замысел). μὴ ἀφῇς με πεσεῖν ἐν αὐτοῖς — «не дай мне пасть среди них»."
  2: "τίς ἐπιστήσει ἐπὶ τοῦ διανοήματός μου μάστιγας — «кто приставит к помыслу моему бичи» (ἐφίστημι; μάστιξ — бич). παιδείαν σοφίας — «наказание премудрости»; ἵνα ἐπὶ τοῖς ἀγνοήμασίν μου μὴ φείσωνται — «чтобы не пощадили неведений моих» (ἀγνόημα, φείδομαι). οὐ μὴ παρῇ τὰ ἁμαρτήματα αὐτῶν — «и не пройдут грехи их»."
  3: "πληθυνθῶσιν αἱ ἄγνοιαί μου — «умножатся неведения мои»; αἱ ἁμαρτίαι μου πλεονάσωσιν — «грехи мои преумножатся». πεσοῦμαι ἔναντι τῶν ὑπεναντίων — «паду перед противниками» (ὑπεναντίος); ἐπιχαρεῖταί μοι ὁ ἐχθρός — «порадуется мне враг мой» (ἐπιχαίρω)."
  4: "μετεωρισμὸν ὀφθαλμῶν μὴ δῷς μοι — «возношение очей не дай мне» (μετεωρισμός — надменность; слав. «возношение очима»). Греч. 23:4 и слав. 4 начинаются одинаково. καὶ ἐπιθυμίαν ἀπόστρεψον ἀπ᾽ ἐμοῦ — «и вожделение отврати от меня» (ἐπιθυμία — желание, похоть). В слав. эта половина соединена с ст. 4 в csl 23:4 («и вожделение отврати от мене»), у нас — по делению gr 23:5."
  5: "κοιλίας ὄρεξις — «вожделение чрева» (ὄρεξις — аппетит, страсть); συνουσιασμός — «соитие, блуд»; μὴ καταλαβέτωσάν με — «да не овладеют мною». ψυχῇ ἀναιδεῖ μὴ παραδῷς με — «душе бесстыдной не предай меня» (ἀναιδής)."
  6: "Παιδείαν στόματος ἀκούσατε, τέκνα — «наставление уст выслушайте, дети». ὁ φυλάσσων οὐ μὴ ἁλῷ — «соблюдающий не будет уловлен» (ἁλίσκομαι). Здесь кончается молитва и начинается поучение."
  7: "ἐν τοῖς χείλεσιν αὐτοῦ καταληφθήσεται ἁμαρτωλός — «устами своими уловлен будет грешник». λοίδορος — «злоречивый, поноситель»; ὑπερήφανος — «надменный»; σκανδαλισθήσονται ἐν αὐτοῖς — «преткнутся в них» (σκανδαλίζω)."
  8: "ὅρκῳ μὴ ἐθίσῃς τὸ στόμα σου — «к клятве не приучай уст своих» (ὅρκος; ἐθίζω). ὀνομασίᾳ τοῦ ἁγίου μὴ συνεθισθῇς — «к именованию Святого не привыкай» (ὀνομασία; слав. «клятися именем святым не навыкай» — слав. делит на csl 8–9)."
  9: "Продолжение ст. 8 (тот же стих по-гречески)."
  10: "ὥσπερ γὰρ οἰκέτης ἐξεταζόμενος ἐνδελεχῶς — «ибо как раб, постоянно испытуемый» (ἐξετάζω; ἐνδελεχῶς — непрестанно). ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται — «от рубца (раны) не умалится» (μώλωψ; ἐλαττόω). ὁ ὀμνύων καὶ ὀνομάζων διὰ παντός — «клянущийся и именующий непрестанно»."
  11: "ἀνὴρ πολύορκος — «муж многоклятвенный» (πολύορκος). πλησθήσεται ἀνομίας — «исполнится беззакония». οὐκ ἀποστήσεται ἀπὸ τοῦ οἴκου αὐτοῦ μάστιξ — «не отступит от дома его бич». ἐὰν πλημμελήσῃ — «если погрешит» (πλημμελέω); κἂν ὑπερίδῃ, ἥμαρτεν δισσῶς — «если и презрит, согрешил двояко» (ὑπεροράω); διὰ κενῆς ὤμοσεν — «всуе поклялся»."
  12: "Продолжение ст. 11 (тот же стих по-гречески)."
  13: "Продолжение ст. 11 (тот же стих по-гречески)."
  14: "Ἔστιν λέξις ἀντιπαραβεβλημένη θανάτῳ — «есть слово, уподобленное смерти» (ἀντιπαραβάλλω). μὴ εὑρεθήτω ἐν κληρονομίᾳ Ιακωβ — «да не найдётся в наследии Иакова». ἀπὸ γὰρ εὐσεβῶν ταῦτα πάντα ἀποστήσεται — «ибо от благочестивых всё это отступит» (εὐσεβής); ἐν ἁμαρτίαις οὐκ ἐγκυλισθήσονται — «в грехи не впадут (не погрязнут)» (ἐγκυλίω; слав. 23:15)."
  15: "Продолжение ст. 14 (тот же стих по-гречески)."
  16: "ἀπαιδευσίαν ἀσυρῆ — «грубое невежество» (ἀσυρής — грубый, неотесанный). μὴ συνεθίσῃς τὸ στόμα σου — «не приучай уст своих». ἔστιν γὰρ ἐν αὐτῇ λόγος ἁμαρτίας — «ибо в ней слово греха»."
  17: "μνήσθητι πατρὸς καὶ μητρός σου — «помни отца и мать твою». ἀνὰ μέσον γὰρ μεγιστάνων συνεδρεύεις — «ибо среди вельмож сидишь» (μεγιστάν; συνεδρεύω). μήποτε ἐπιλάθῃ ἐνώπιον αὐτῶν — «как бы не забыть пред ними»; τῷ ἐθισμῷ σου μωρανθῇς — «обычаем своим не обезуметь» (ἐθισμός); θελήσεις εἰ μὴ ἐγεννήθης — «пожелаешь, что не родился»; τὴν ἡμέραν τοῦ τοκετοῦ σου καταράσῃ — «день рождения твоего проклянёшь». Греч. 23:14 включает csl 17–18."
  18: "Продолжение ст. 17 (тот же стих по-гречески)."
  19: "ἄνθρωπος συνεθιζόμενος λόγοις ὀνειδισμοῦ — «человек, привыкающий к словам поношения» (ὀνειδισμός). ἐν πάσαις ταῖς ἡμέραις αὐτοῦ οὐ μὴ παιδευθῇ — «во все дни свои не научится»."
  20: "Δύο εἴδη πληθύνουσιν ἁμαρτίας — «два вида умножают грехи» (εἶδος — вид, род). τὸ τρίτον ἐπάξει ὀργήν — «третье наведёт гнев» (ἐπάγω). Слав. 23:20."
  21: "ψυχὴ θερμὴ ὡς πῦρ καιόμενον — «душа горячая, как огонь пылающий»; οὐ μὴ σβεσθῇ ἕως ἂν καταποθῇ — «не угаснет, пока не поглощена будет» (καταπίνω). ἄνθρωπος πόρνος — «человек блудник» (πόρνος); ἕως ἂν ἐκκαύσῃ πῦρ — «пока не возжжёт огонь» (ἐκκαίω). πᾶς ἄρτος ἡδύς — «всякий хлеб сладок»; οὐ μὴ κοπάσῃ ἕως ἂν τελευτήσῃ — «не перестанет, пока не умрёт» (κοπάζω). Греч. 23:17 — csl 21–23."
  22: "Продолжение ст. 21 (тот же стих по-гречески)."
  23: "Продолжение ст. 21 (тот же стих по-гречески)."
  24: "ἄνθρωπος παραβαίνων ἀπὸ τῆς κλίνης αὐτοῦ — «человек, преступающий (ложе) от постели своей» (κλίνη). λέγων ἐν τῇ ψυχῇ αὐτοῦ — «говоря в душе своей». σκότος κύκλῳ μου — «тьма вокруг меня»; οἱ τοῖχοί με καλύπτουσιν — «стены покрывают меня»; τί εὐλαβοῦμαι — «чего я боюсь»; τῶν ἁμαρτιῶν μου οὐ μὴ μνησθήσεται ὁ ὕψιστος — «грехов моих не вспомнит Всевышний». Греч. 23:18 — csl 24–25; слова грешника в 「…」."
  25: "Продолжение ст. 24 (тот же стих по-гречески). Продолжение прямой речи, начатой в ст. 24; кавычки на границе стиха не закрываются — так по всему корпусу."
  26: "ὀφθαλμοὶ ἀνθρώπων ὁ φόβος αὐτοῦ — «очи человеческие — страх его»: боится только людских глаз. οὐκ ἔγνω — «не познал». ὀφθαλμοὶ κυρίου μυριοπλασίως ἡλίου φωτεινότεροι — «очи Господа в мириады раз светлее солнца» (μυριοπλασίως); ἐπιβλέποντες πάσας ὁδοὺς ἀνθρώπων — «взирающие на все пути человеческие»; κατανοοῦντες εἰς ἀπόκρυφα μέρη — «проникающие в сокровенные места». Греч. 23:19 — csl 26–28."
  27: "Продолжение ст. 26 (тот же стих по-гречески)."
  28: "Продолжение ст. 26 (тот же стих по-гречески)."
  29: "πρὶν ἢ κτισθῆναι τὰ πάντα ἔγνωσται αὐτῷ — «прежде чем создано всё, известно Ему» (κτίζω). οὕτως καὶ μετὰ τὸ συντελεσθῆναι — «так и после совершения» (συντελέω)."
  30: "οὗτος ἐν πλατείαις πόλεως ἐκδικηθήσεται — «таковой на улицах города будет наказан» (πλατεῖα; ἐκδικέω). οὗ οὐχ ὑπενόησεν, πιασθήσεται — «где не помыслил, будет схвачен» (πιάζω)."
  31: "Οὕτως καὶ γυνὴ καταλιποῦσα τὸν ἄνδρα — «так и жена, оставившая мужа»; παριστῶσα κληρονόμον ἐξ ἀλλοτρίου — «представившая наследника от чужого» (παρίστημι); ἀλλότριος — чужой."
  32: "πρῶτον μὲν γὰρ ἐν νόμῳ ὑψίστου ἠπείθησεν — «во-первых, закону Всевышнего не покорилась» (ἀπειθέω). δεύτερον εἰς ἄνδρα αὐτῆς ἐπλημμέλησεν — «во-вторых, против мужа своего согрешила». τὸ τρίτον ἐν πορνείᾳ ἐμοιχεύθη — «в-третьих, в блуде прелюбодействовала» (μοιχεύω); ἐξ ἀλλοτρίου ἀνδρὸς τέκνα παρέστησεν — «от чужого мужа детей произвела»."
  33: "αὕτη εἰς ἐκκλησίαν ἐξαχθήσεται — «она будет выведена в собрание» (ἐκκλησία — собрание; ἐξάγω). ἐπὶ τὰ τέκνα αὐτῆς ἐπισκοπὴ ἔσται — «над детьми её будет посещение (расследование)» (ἐπισκοπή)."
  34: "οὐ διαδώσουσιν τὰ τέκνα αὐτῆς εἰς ῥίζαν — «не распространятся дети её в корень» (διαδίδωμι), т. е. не укоренятся. οἱ κλάδοι αὐτῆς οὐκ οἴσουσιν καρπόν — «ветви её не принесут плода» (κλάδος, φέρω)."
  35: "καταλείψει εἰς κατάραν τὸ μνημόσυνον αὐτῆς — «оставит в проклятие память её» (μνημόσυνον). τὸ ὄνειδος αὐτῆς οὐκ ἐξαλειφθήσεται — «позор её не изгладится» (ἐξαλείφω)."
  36: "καὶ ἐπιγνώσονται οἱ καταλειφθέντες — «и познают оставшиеся» (καταλείπω). οὐθὲν κρεῖττον φόβου κυρίου — «ничего нет лучше страха Господня» (κρείττων). οὐθὲν γλυκύτερον τοῦ προσέχειν ἐντολαῖς κυρίου — «ничего нет слаще внимать заповедям Господним» (γλυκύς, προσέχω). Слав. 23:37 добавляет «Слава велия еже последовати Богу, долгота же дний еже прияту тебе быти от него» — этого нет в LXX; по паритету внесено в основной текст без скобок (主に従うことは大きな栄光…)."
  37: "Продолжение ст. 36 (тот же стих по-гречески)."
