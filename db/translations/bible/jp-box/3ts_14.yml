# jp-box, 3-я Царств, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому, а для 14:1–21 — по csl (в gr этих стихов нет).
# Глава 14: болезнь Авии и поручение Иеровоама жене (1–4), слово Господа Ахии (5),
# встреча у порога и пророчество о доме Иеровоама (6–16), смерть ребёнка (17–18),
# конец Иеровоама (19–20), Ровоам и нашествие Сусакима (21–31).
# Речь — 「…」: Иеровоам (2–3), Господь к Ахии (5), Ахия (6–16). Вложенная речь —
# 『…』: слово Господа в устах Ахии (7–16). Красного нет.
# Нумерация по gr: 31 стих, совпадает с csl и ru.
# Дефект модуля gr-lxx-byz: на месте 14:1–21 стоит «.», а 14:22 содержит слитый
# текст двух стихов (начало его — стих 21 о воцарении Ровоама). Стихи 1–21
# переведены по csl-ru, основным текстом без 〔…〕 (паритет LXX/csl); об этом
# сказано в notes. 〔…〕 не ставим.
# Расхождения csl и ru (14:3 «гроздие», 14:10, 14:14, 14:17 Фирца/Сарира,
# 14:21, 14:26, 14:31) отмечены в notes.
# Сносок ⟨…⟩ нет: 預言者, 王, 妻, 墓, 高[たか]い所, 祭司 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
