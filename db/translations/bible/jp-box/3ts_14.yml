chapter: 14
draft: true

verses:
  1: "そのころ、ヤロブアムの子[こ]アビヤは重[おも]い病[やまい]にかかった。"
  2: "ヤロブアムは妻[つま]に言[い]った。「立[た]って、着物[きもの]を着替[きが]えなさい。あなたがヤロブアムの妻だと知[し]られないためだ。そしてシロへ行[い]きなさい。見[み]よ、そこに預言者[よげんしゃ]アヒヤがいる。この民[たみ]を治[おさ]める王[おう]になると、わたしに告[つ]げたのは彼[かれ]である。"
  3: "手[て]に、神[かみ]の人[ひと]へのパン十[じゅう]個[こ]と、その子[こ]どもへの種[たね]なしパンと、ぶどうの房[ふさ]と、はちみつの壺[つぼ]を持[も]って、彼[かれ]のもとへ行[い]きなさい。彼はその子がどうなるかを告[つ]げてくれる。」"
  4: "ヤロブアムの妻[つま]はそのとおりにした。立[た]ってシロへ行[い]き、アヒヤの家[いえ]に入[はい]った。アヒヤはもう見[み]ることができなかった。老[お]いのために目[め]が鈍[にぶ]っていたからである。"
  5: "主[しゅ]はアヒヤに言[い]われた。「見[み]よ、ヤロブアムの妻[つま]が、病[や]んでいる子[こ]のことをあなたに尋[たず]ねようとして来[き]ている。彼女[かのじょ]にこう告[つ]げなさい。」彼女が入[はい]って来たとき、彼女は見しらぬ者[もの]のふりをしていた。"
  6: "アヒヤは、彼女[かのじょ]が門[もん]に入[はい]って来[き]る足音[あしおと]を聞[き]いて言[い]った。「入りなさい、ヤロブアムの妻[つま]よ。なぜそのように見[み]しらぬ者[もの]のふりをしているのか。わたしはあなたのもとへ遣[つか]わされた、厳[きび]しい使者[ししゃ]である。"
  7: "行[い]ってヤロブアムに言[い]いなさい。主[しゅ]はこう言われる。『わたしはあなたを民[たみ]の中[なか]から高[たか]く上[あ]げ、わたしの民イスラエルの上[うえ]に立[た]つ導[みちび]き手[て]とした。"
  8: "わたしはダビデの家[いえ]から王国[おうこく]を裂[さ]き取[と]って、あなたに与[あた]えた。しかし、あなたはわたしの僕[しもべ]ダビデのようではなかった。彼[かれ]はわたしの戒[いまし]めを守[まも]り、わたしの目[め]に正[ただ]しいことをすべて行[おこな]うために、心[こころ]を尽[つ]くしてわたしに従[したが]った。"
  9: "あなたは、あなたより前[まえ]にいたすべての者[もの]よりも悪[わる]いことをした。行[い]って、わたしを怒[いか]らせるために、ほかの神[かみ]々[がみ]と鋳物[いもの]の像[ぞう]を造[つく]り、わたしをあなたの後[うし]ろに投[な]げ捨[す]てた。"
  10: "それゆえ、見[み]よ、わたしはヤロブアムの家[いえ]に災[わざわ]いをもたらす。ヤロブアムに属[ぞく]する者[もの]を、壁[かべ]に向[む]かって小水[しょうすい]をする者も、イスラエルに閉[と]じ込[こ]められた者も、残[のこ]りなく断[た]ち絶[た]やす。ヤロブアムの家を、汚[よご]れ物[もの]を掃[は]き出[だ]して跡形[あとかた]もなくするように、断ち絶やす。"
  11: "ヤロブアムの家[いえ]で死[し]ぬ者は町[まち]では犬[いぬ]が食[く]い、野[の]で死ぬ者は空[そら]の鳥[とり]が食う。主[しゅ]がそう言[い]われたからである。"
  12: "あなたは立[た]って自分[じぶん]の家[いえ]へ帰[かえ]りなさい。あなたの足[あし]が町[まち]に入[はい]るとき、その子[こ]は死[し]ぬ。"
  13: "イスラエルは皆[みな]、彼[かれ]のために泣[な]いてこれを葬[ほうむ]る。ヤロブアムの家[いえ]のうちで、主[しゅ]であるイスラエルの神[かみ]について良[よ]いものが見[み]いだされたのは彼だけで、ヤロブアムの墓[はか]に入[はい]るのも彼だけだからである。"
  14: "主[しゅ]はイスラエルの上[うえ]に、ご自分[じぶん]のために王[おう]を立[た]てる。その王はこの日[ひ]、ヤロブアムの家[いえ]を打[う]つ。そして今[いま]も、そうなる。"
  15: "主[しゅ]はイスラエルを打[う]たれる。水[みず]の上[うえ]で揺[ゆ]れる葦[あし]のように。主はイスラエルを、彼[かれ]らの父[ちち]たちに与[あた]えたこの良[よ]い地[ち]から引[ひ]き抜[ぬ]き、川[かわ]の向[む]こう側[がわ]へ追[お]いやる。彼らが自分[じぶん]のために木立[こだち]を造[つく]って主を怒[いか]らせたからである。"
  16: "主[しゅ]はイスラエルを、ヤロブアムが犯[おか]した罪[つみ]、すなわち彼[かれ]が自[みずか]ら犯し、イスラエルを罪に陥[おとしい]れたその罪のゆえに、渡[わた]される。』」"
  17: "ヤロブアムの妻[つま]は立[た]ってティルツァへ行[い]き、家[いえ]の戸口[とぐち]に入[はい]った。そのとき、子[こ]は死[し]んだ。"
  18: "彼[かれ]を葬[ほうむ]り、イスラエルは皆[みな]、主[しゅ]がその僕[しもべ]預言者[よげんしゃ]アヒヤによって語[かた]られた言葉[ことば]のとおりに、彼のために泣[な]いた。"
  19: "ヤロブアムの残[のこ]りの言葉[ことば]、すなわち彼[かれ]がどれほど戦[たたか]い、どれほど治[おさ]めたかは、見[み]よ、イスラエルの王[おう]たちの日々[ひび]の言葉の書[しょ]に記[しる]されている。"
  20: "ヤロブアムが治[おさ]めた日[ひ]は二十二[にじゅうに]年[ねん]であった。彼[かれ]は父[ちち]たちとともに眠[ねむ]り、代[か]わってその子[こ]ナダブが王[おう]となった。"
  21: "ソロモンの子[こ]レハブアムはユダの上[うえ]に王[おう]となった。彼[かれ]は四十一[よんじゅういち]歳[さい]で王となり、エルサレムで十七[じゅうなな]年[ねん]治[おさ]めた。エルサレムは、主[しゅ]がイスラエルのすべての部族[ぶぞく]の中[なか]から選[えら]んで、そこにご自分[じぶん]の名[な]を置[お]かれた町[まち]である。母[はは]の名はナアマといい、アンモン人[じん]であった。"
  22: "レハブアムは主[しゅ]の目[め]に悪[わる]を行[おこな]い、父[ちち]たちが行ったすべてのことと、彼[かれ]らが犯[おか]した罪[つみ]によって、主を怒[いか]らせた。"
  23: "彼[かれ]らは自分[じぶん]たちのために高[たか]い所[ところ]、石柱[せきちゅう]、木立[こだち]を、すべての高い丘[おか]の上[うえ]と、すべての茂[しげ]った木[き]の下[した]に造[つく]った。"
  24: "また、この地[ち]には汚[けが]れた交[まじ]わりがあった。彼[かれ]らは、主[しゅ]がイスラエルの子[こ]らの中[なか]から追[お]い払[はら]った諸[しょ]国[こく]民[みん]のすべての忌むべき行[おこな]いをした。"
  25: "レハブアムの治[おさ]めの第五[だいご]年[ねん]、エジプトの王[おう]シシャクがエルサレムに攻[せ]め上[のぼ]った。"
  26: "彼[かれ]は主[しゅ]の家[いえ]の宝[たから]と王[おう]の家の宝をすべて取[と]った。すなわち、ダビデがスバの王アドラアザルの若者[わかもの]たちの手[て]から取ってエルサレムに運[はこ]び入[い]れた金[きん]の槍[やり]、そのすべてを取った。ソロモンが造[つく]った金の盾[たて]も取って、エジプトへ運んだ。"
  27: "レハブアム王[おう]は、その代[か]わりに青銅[せいどう]の盾[たて]を造[つく]り、王の家[いえ]の門[もん]を守[まも]る近衛[このえ]の長[ちょう]たちに預[あず]けた。"
  28: "王[おう]が主[しゅ]の家[いえ]に入[はい]るたびに、近衛[このえ]の者[もの]たちがそれを持[も]ち、またそれを近衛の武具[ぶぐ]庫[こ]に戻[もど]した。"
  29: "レハブアムの残[のこ]りの言葉[ことば]、および彼[かれ]が行[おこな]ったすべてのことは、見[み]よ、ユダの王国[おうこく]の日々[ひび]の言葉の書[しょ]に記[しる]されているではないか。"
  30: "レハブアムとヤロブアムの間[あいだ]には、いつの日[ひ]も戦[たたか]いがあった。"
  31: "レハブアムは父[ちち]たちとともに眠[ねむ]り、ダビデの町[まち]で父たちとともに葬[ほうむ]られた。代[か]わってその子[こ]アビヤが王[おう]となった。"

notes:
  1: "В gr-lxx-byz на месте стиха «.»: 14:1–21 в модуле отсутствуют (дефект модуля — текст 21–22 слит в ст. 22). Перевод по csl-ru: «Во время оно разболеся авиа сын иеровоамль». «Во время оно» — слав. зачин; разболеся — заболел."
  2: "По csl-ru: «востани и измени ризы своя, да не познают» — встань и перемени одежду твою, чтобы не узнали; «се бо, тамо ахиа пророк» — вот, там Ахия пророк; «той глагола мне еже царствовати над людьми сими» — он сказал мне, что я буду царствовать над этим народом."
  3: "По csl-ru: десять хлебов, опресноки детям его, «гроздие» (виноградные гроздья) и сосуд мёда. В ru «гроздие» опущено — в тексте сохранено по csl. «той возвестит ти, что будет отрочати» — он возвестит тебе, что будет с ребёнком."
  4: "По csl-ru: «вниде в дом ахиин: человек же стар бяше еже видети» — вошла в дом Ахии; он был стар и не мог видеть; «притупистася очи его от старости его» — глаза его притупились от старости."
  5: "По csl-ru: «по сему и по сему да глаголеши к ней» — «так и так говори ей» (букв. «по сему и по сему»; в тексте сведено к こう告げなさい). «странноявляшеся» — притворялась, являлась чужой (в ru «переодетая»)."
  6: "По csl-ru: «шум ног ея» — звук шагов её; «почто ты тако странноявляешися» — почему ты так притворяешься; «посланник к тебе жесток» — грозный, тяжёлый посол к тебе (в ru «грозный посланник»)."
  7: "По csl-ru: «сия глаголет Господь Бог израилев»; «толико вознесох тя от среды людий» — Я возвысил тебя из среды народа; «вожда над людьми моими израилем» — вождём над народом Моим Израилем."
  8: "По csl-ru: «раздрах царство от дому давидова» — отторг царство от дома Давидова; «не был еси якоже раб мой давид»; «хождаше вслед мене всем сердцем своим» — последовал за Мною всем сердцем; «всякую правоту пред очима моима» — всякую правду пред очами Моими."
  9: "По csl-ru: «излукавствовал еси» — стал лукавым, поступал хуже всех; «боги чужды и слияны» — богов чужих и литых; «отвергл мя еси назад себе» — отбросил Меня назад, за спину."
  10: "По csl-ru: «потреблю иеровоамля мочащаго к стене, держащагося и оставленаго во израили» — истреблю у Иеровоама и мочащегося к стене (т. е. мужчину), и заключённого, и оставленного в Израиле (формула полного истребления). «якоже истребляется гной, дондеже скончатися ему» — как истребляется навоз, доколе не кончится; в тексте образ передан через 汚[よご]れ物[もの]."
  11: "По csl-ru: «умерших иеровоамлих во граде снедят пси» — умерших у Иеровоама в городе съедят псы; «на селе» — в поле — птицы небесные; «яко Господь глагола» — ибо Господь сказал."
  12: "По csl-ru: «внегда входити ногама твоима во град, умрет детищь» — как только ноги твои войдут в город, умрёт дитя. Адресат здесь меняется: слово обращено уже к жене (ср. ст. 7 «пойди, скажи Иеровоаму»)."
  13: "По csl-ru: «восплачется по нем весь израиль» — оплачет его весь Израиль; «той един внидет иеровоаму во гроб» — он один у Иеровоама войдёт в гробницу; «обретеся в нем глагол благ о Господе Бозе израилеве» — в нём нашлось доброе слово о Господе Боге Израилевом."
  14: "По csl-ru: «возставит Господь себе царя над израилем»; «иже поразит дом иеровоамов в сей день» — который поразит дом Иеровоама в тот день; «а что, и ныне?» — тёмный оборванный оборот («и что же? и ныне»), в ru «и что? даже теперь»."
  15: "По csl-ru: «якоже колеблется трость на воде» — как колеблется тростник в воде; «истребит... свыше земли благия сея» — истребит Израиля с этой доброй земли; «завеет их за ону страну реки» — развеет их за ту сторону реки (Евфрат); «дубравы своя» — рощи свои (в ru «идолов»)."
  16: "По csl-ru: «предаст Господь израиля за грехи иеровоамли»; «иже согреши и иже во грех введе израиля» — который согрешил и ввёл Израиля в грех."
  17: "По csl-ru: «прииде во сариру» — пришла в Сариру (в ru «Фирца», евр. תִּרְצָה; в гр. модуле стиха нет). «в преддверие дому» — к порогу дома."
  18: "По csl-ru: «погребоша его, и плакашася его весь израиль»; «по словеси Господню, еже глагола рукою раба своего ахии пророка» — по слову Господню, которое Он изрёк рукою раба Своего Ахии пророка."
  19: "По csl-ru: «останок словес иеровоамовых» — прочие слова (дела) Иеровоама; «елика ратоваше и елика царствоваше» — сколько воевал и сколько царствовал; «в книзе словес дний царей израилевых» — в книге слов дней царей Израилевых."
  20: "По csl-ru: «дние, в нихже царствова» — дни, в которые он царствовал; «двадесять два лета» — двадцать два года; «успе со отцы своими» — почил с отцами; «воцарися нават сын его» — воцарился Нават, сын его."
  21: "В gr-lxx-byz стих отдельно отсутствует: его текст — начало ст. 22 («... 21 Καὶ Ροβοαμ υἱὸς Σαλωμων ἐβασίλευσεν ἐπὶ Ιουδα»), в модуле нумерация сдвинута. Перевод по csl-ru; ср. гр. в ст. 22: «сын сорока и одного года... семнадцать лет царствовал в Иерусалиме, городе, который избрал Господь положить имя Своё там из всех колен Израиля; имя матери его Наама Аммонитянка»."
  22: "καὶ ἐποίησεν Ροβοαμ τὸ πονηρὸν ἐνώπιον κυρίου — сотворил Ровоам лукавое пред Господом; παρεζήλωσεν αὐτὸν ἐν πᾶσιν, οἷς ἐποίησαν οἱ πατέρες αὐτοῦ — раздражил Его всем, что сделали отцы его; ἐν ταῖς ἁμαρτίαις αὐτῶν, αἷς ἥμαρτον — и грехами их, которыми они согрешили. Слав. то же."
  23: "ᾠκοδόμησαν ἑαυτοῖς ὑψηλὰ καὶ στήλας καὶ ἄλση — построили себе высоты, столпы и рощи (ἄλσος — священная роща, 木立); ἐπὶ πάντα βουνὸν ὑψηλὸν καὶ ὑποκάτω παντὸς ξύλου συσκίου — на всяком высоком холме и под всяким тенистым деревом."
  24: "σύνδεσμος ἐγένετο ἐν τῇ γῇ — «связь, смешение было в земле» (σύνδεσμος; слав. «смешение»): речь о содомском грехе и культовой проституции; в ru «блудники». Буквально передано как 交[まじ]わり. ἐποίησαν ἀπὸ πάντων τῶν βδελυγμάτων τῶν ἐθνῶν — делали из всех мерзостей народов; ὧν ἐξῆρεν κύριος ἀπὸ προσώπου υἱῶν Ισραηλ — которых Господь изгнал от лица сынов Израилевых."
  25: "ἐν τῷ ἐνιαυτῷ τῷ πέμπτῳ βασιλεύοντος Ροβοαμ — в пятый год царствования Ровоама; ἀνέβη Σουσακιμ βασιλεὺς Αἰγύπτου ἐπὶ Ιερουσαλημ — взошёл Сусаким, царь Египетский, на Иерусалим (Σουσακιμ — Шешонк I, シシャク)."
  26: "ἔλαβεν πάντας τοὺς θησαυροὺς οἴκου κυρίου καὶ τοὺς θησαυροὺς οἴκου τοῦ βασιλέως — взял все сокровища дома Господня и сокровища дома царя. τὰ δόρατα τὰ χρυσᾶ — золотые копья; ἃ ἔλαβεν Δαυιδ ἐκ χειρὸς τῶν παίδων Αδρααζαρ βασιλέως Σουβα — которые взял Давид из руки отроков Адраазара, царя Сувского; εἰσήνεγκεν αὐτὰ εἰς Ιερουσαλημ — принёс их в Иерусалим; ὅπλα τὰ χρυσᾶ — золотые щиты (ὅπλα — оружие, здесь щиты). Слав. добавляет «яже сотвори соломон, и внесе я во египет» — в гр. этого нет; добавление внесено в текст (паритет), отмечено здесь."
  27: "ὅπλα χαλκᾶ ἀντ᾽ αὐτῶν — медные щиты вместо них (χαλκοῦς, 青銅); οἱ ἡγούμενοι τῶν παρατρεχόντων — начальники телохранителей (παρατρέχω — бежать рядом); οἱ φυλάσσοντες τὸν πυλῶνα οἴκου τοῦ βασιλέως — охраняющие вход дома царя."
  28: "ὅτε εἰσεπορεύετο ὁ βασιλεὺς εἰς οἶκον κυρίου — когда царь входил в дом Господень; ᾖρον αὐτὰ οἱ παρατρέχοντες — несли их телохранители; ἀπηρείδοντο αὐτὰ εἰς τὸ θεε τῶν παρατρεχόντων — относили их в хранилище телохранителей (τὸ θεε — непереведённое евр. תָּא, помещение); слав. «во оружехранилище»."
  29: "τὰ λοιπὰ τῶν λόγων Ροβοαμ — прочее слов Ровоама; ἐν βιβλίῳ λόγων τῶν ἡμερῶν τοῖς βασιλεῦσιν Ιουδα — в книге слов дней царей Иудейских."
  30: "πόλεμος ἦν ἀνὰ μέσον Ροβοαμ καὶ ἀνὰ μέσον Ιεροβοαμ πάσας τὰς ἡμέρας — война была между Ровоамом и между Иеровоамом все дни."
  31: "ἐκοιμήθη Ροβοαμ μετὰ τῶν πατέρων αὐτοῦ — почил Ровоам с отцами своими; θάπτεται... ἐν πόλει Δαυιδ — погребён в городе Давида; ἐβασίλευσεν Αβιου υἱὸς αὐτοῦ ἀντ᾽ αὐτοῦ — воцарился Авия, сын его, вместо него. В ru добавлено «имя матери его Наама Аммонитянка» — в гр. и csl этого нет, не внесено."
