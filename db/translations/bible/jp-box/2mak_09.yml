verses:
  1: "そのころ、アンティオコスはペルシアの地方[ちほう]から、面目[めんぼく]を失[うしな]って引[ひ]き返[かえ]しつつあった。"
  2: "彼[かれ]はペルセポリスと呼[よ]ばれる都[みやこ]に入[はい]り、神殿[しんでん]を荒[あら]し、都[みやこ]を押[お]さえようとした。そこで民[たみ]が武器[ぶき]を取[と]って立[た]ち上[あ]がったので、彼らは退[しりぞ]き、アンティオコスは地元[じもと]の者[もの]たちに敗[やぶ]れて、恥[はじ]ずかしい退却[たいきゃく]をすることになった。"
  3: "彼[かれ]がエクバタナにいたとき、ニカノルとティモテオスのもとで起[お]こったことが伝[つた]えられた。"
  4: "彼[かれ]は怒[いか]りにかられて、自分[じぶん]を追[お]い払[はら]った者[もの]たちへの敵意[てきい]をユダヤ人[じん]にぶつけようと考[かんが]えた。それで御者[ぎょしゃ]に、休[やす]まず先[さき]を急[いそ]がせて旅[たび]を進[すす]めるように命[めい]じた。天[てん]からの裁[さば]きがすでに彼[かれ]とともにあったのである。というのは、彼[かれ]はこう高慢[こうまん]に言[い]ったからである。「わたしがそこへ行[い]ったら、エルサレムをユダヤ人[じん]の墓場[はかば]にしてやろう。」"
  5: "しかし、すべてを見[み]通[とお]す主[しゅ]、イスラエルの神[かみ]が、いやしがたい見[み]えざる打撃[だげき]で彼[かれ]を打[う]たれた。彼[かれ]がその言葉[ことば]を言[い]い終[お]えるやいなや、やりきれない腹[はら]の痛[いた]みと、内臓[ないぞう]の激[はげ]しい苦[くる]しみが彼[かれ]を襲[おそ]った。"
  6: "それはまったく正[ただ]しいことであった。彼[かれ]は多[おお]くの、そして異常[いじょう]な災[わざわ]いによって、他人[たにん]の内臓[ないぞう]を苦[くる]しめてきたからである。"
  7: "しかし彼[かれ]は高慢[こうまん]さを少[すこ]しもやめず、なおも傲慢[ごうまん]に満[み]ちて、ユダヤ人[じん]に対して怒[いか]りの火[ひ]を吐[は]き、旅[たび]を急[いそ]がせるように命[めい]じていた。すると、疾走[しっそう]する戦車[せんしゃ]から彼[かれ]は落[お]ち、激[はげ]しい落下[らっか]のために体[からだ]のすべての部分[ぶぶん]を挫[くじ]いてしまった。"
  8: "つい先[さき]まで、人[ひと]を超[こ]えた傲慢[ごうまん]さから海[うみ]の波[なみ]に命[めい]じ、天秤[てんびん]で山[やま]の高[たか]さを測[はか]ろうとしていた者[もの]が、地[ち]に伏[ふ]し、担架[たんか]に運[はこ]ばれる身[み]となって、すべての人[ひと]に神[かみ]の力[ちから]をありありと示[しめ]した。"
  9: "不敬[ふけい]な者[もの]の体[からだ]からは虫[むし]が湧[わ]き上[あ]がり、生[い]きながらにして痛[いた]みと苦[くる]しみのうちに肉[にく]がくずれ落[お]ち、その悪臭[あくしゅう]のゆえに軍[ぐん]の全[ぜん]体[たい]が耐[た]えがたく思[おも]った。"
  10: "少し前[まえ]まで天[てん]の星[ほし]に手[て]が届[とど]くと思[おも]われていた者[もの]を、だれもその耐[た]えがたい悪臭[あくしゅう]の重[おも]さのゆえに運[はこ]ぶことができなかった。"
  11: "ここで彼[かれ]は、打[う]ち砕[くだ]かれて、大[おお]きな高慢[こうまん]さをようやく捨[す]て始[はじ]め、神[かみ]のむちによって刻[きざ]みごとに苦[くる]しみを強[つよ]められながら、悟[さと]りへと導[みちび]かれ始[はじ]めた。"
  12: "自分[じぶん]の悪臭[あくしゅう]さえ耐[た]えられなくなると、彼[かれ]は言[い]った。「神[かみ]に服[ふく]するのは正[ただ]しいことだ。死[し]すべき者[もの]が、神[かみ]と等[ひと]しい者[もの]のように思[おも]い上[あ]がってはならない。」"
  13: "この汚[けが]れた者[もの]は、もはや自分[じぶん]をあわれむことのない主[しゅ]に、こう祈[いの]った。"
  14: "「わたしが急[いそ]いで行[い]って地[ち]ならし、墓場[はかば]として建[た]てようとした聖[せい]なる都[みやこ]を、自由[じゆう]の都[みやこ]とし、"
  15: "葬[ほうむ]りも許[ゆる]さず、子[こ]どもたちとともに鳥[とり]や獣[けもの]に投[な]げ捨[す]てるつもりだったユダヤ人[じん]たちを、すべてアテネ人[じん]と同[おな]じ市民[しみん]とし、"
  16: "先[さき]に略奪[りゃくだつ]した聖[せい]なる神殿[しんでん]を最[さい]上の奉納物[ほうのうもの]で飾[かざ]り、聖[せい]なる器[うつわ]をすべて何倍[なんばい]にして返[かえ]し、犠牲[ぎせい]に必要[ひつよう]な費用[ひよう]を自分の収入[しゅうにゅう]から出す。"
  17: "そのうえ、自分[じぶん]もユダヤ人[じん]となり、すみかがある所[ところ]をすべて巡[めぐ]って、神[かみ]の力[ちから]を告[つ]げ知[し]らせよう。」"
  18: "しかし痛[いた]みはまったく治[なお]まらなかった。神[かみ]の正[ただ]しい裁[さば]きが彼[かれ]に下[くだ]ったからである。自分[じぶん]のことをあきらめると、彼[かれ]はユダヤ人[じん]に、以下[いか]に記[しる]す手紙[てがみ]を書[か]いた。それは嘆願[たんがん]の形[かたち]のもので、次[つぎ]のように記[しる]されていた。"
  19: "「市民[しみん]である良[よ]いユダヤ人[じん]たちに、多[おお]くの喜[よろこ]びと健康[けんこう]、そして繁栄[はんえい]を、王[おう]また将軍[しょうぐん]アンティオコスより。"
  20: "あなたがたと子[こ]どもたちが無事[ぶじ]で、あなたがたの事[こと]が思[おも]いどおりであるなら、天[てん]に望[のぞ]みを置[お]く者[もの]として、"
  21: "わたしはあなたがたの面目[めんぼく]と好意[こうい]を心[こころ]から思[おも]い起[おこ]していた。ペルシアの地方[ちほう]から帰[かえ]る途中[とちゅう]、重[おも]い病[やまい]にかかったので、すべての者[もの]の安全[あんぜん]について気[き]を配[くば]るのがよいと考[かんが]えたのだ。"
  22: "自分[じぶん]のことをあきらめているのではなく、この病[やまい]から逃[のが]れることに大[おお]きな望[のぞ]みを置[お]いている。"
  23: "しかし、父[ちち]が上[うえ]の地方[ちほう]へ軍を進[すす]めたとき、後継[あとつ]ぎを決[き]めていたことに思[おも]い至[いた]った。"
  24: "それは、予期[よき]しないことが起[お]こり、あるいは不都合[ふつごう]な知[し]らせが届[とど]いた場合[ばあい]、その地方[ちほう]の人[ひと]々[びと]が、事[こと]をゆだねられた者[もの]を知[し]っていて、動揺[どうよう]しないためである。"
  25: "そのうえ、近隣[きんりん]の支配者[しはいしゃ]たちが王国[おうこく]に隣[となり]合[あ]わせて時[とき]をうかがい、成[な]り行[ゆ]きを待[ま]っているのを見[み]て、王子[おうじ]アンティオコスを王[おう]として定[さだ]めた。上[うえ]の太守[たいしゅ]領[りょう]へ幾度[いくど]も出征[しゅっせい]したとき、あなたがたの多[おお]くの者[もの]に彼[かれ]を託[たく]し、紹介[しょうかい]したからである。そして彼[かれ]には、以下[いか]のことを書[か]き送[おく]った。"
  26: "そこで、あなたがたに求[もと]める。わたしが公[おおやけ]にも個[こ]人[じん]としても与[あた]えた恩恵[おんけい]を思[おも]い起[おこ]し、それぞれがわたしとわたしの息子[むすこ]への好意[こうい]を保[たも]つようにしてほしい。"
  27: "わたしは確[かく]信[しん]している。彼[かれ]はこのわたしの考[かんが]えに従[したが]って、穏[おだ]やかに、そして人[ひと]を思[おも]いやる心[こころ]で、あなたがたに接[せっ]するであろう。」"
  28: "こうして、人殺[ひとごろ]しで神[かみ]を冒瀆[ぼうとく]する者[もの]は、自分[じぶん]が他人[たにん]にしたのと同[おな]じ、最[さい]悪[あく]の苦[くる]しみを受け、異郷[いきょう]の山[やま]の中で、もっともみじめな死[し]に方[ほう]をとげた。"
  29: "その体[からだ]を運[はこ]んだのは、側近[そっきん]のフィリッポスであった。彼[かれ]もアンティオコスの子[こ]を恐[おそ]れて、エジプトのプトレマイオス・フィロメトルのもとへ去[さ]った。"

notes:
  1: "ἀναλελυκὼς ἀκόσμως — «отступив бесчинно (с позором)» (ἀκόσμως — беспорядочно, бесчестно). Слав. «с безчестием возвратися»."
  2: "Περσέπολιν — «Персеполь» (ペルセポリス); ἱεροσυλεῖν — «святотатствовать»; τὴν πόλιν συνέχειν — «город сдерживать (удерживать)»; τῶν πληθῶν ὁρμησάντων ἐπὶ τὴν τῶν ὅπλων βοήθειαν — «когда народ устремился к помощи оружия»; ἀσχήμονα τὴν ἀναζυγὴν ποιήσασθαι — «постыдное отступление совершить» (ἀναζυγή)."
  3: "κατ᾽ Ἐκβάτανα — «при Екбатанах» (エクバタナ); προσέπεσεν τὰ κατὰ Νικάνορα — «донесено было о делах Никанора»."
  4: "ἐπαρθεὶς τῷ θυμῷ — «воспалившись гневом»; τὴν τῶν πεφυγαδευκότων αὐτὸν κακίαν… ἐναπερε ίσασθαι — «злобу изгнавших его выместить» (ἐναπερείδομαι); ἁρματηλάτης — «возница» (御者[ぎょしゃ]); κατανύειν τὴν πορείαν — «ускорять путь»; τῆς ἐξ οὐρανοῦ… κρίσεως συνούσης αὐτῷ — «когда небесный суд сопровождал его»; Πολυάνδριον Ιουδαίων Ιεροσόλυμα ποιήσω — «Иерусалим сделаю многолюдным кладбищем иудеев» (πολυάνδριον — общее погребение, 墓場[はかば]). Речь Антиоха в 「…」."
  5: "ὁ παντεπόπτης κύριος — «всевидящий Господь»; ἀνιάτῳ καὶ ἀοράτῳ πληγῇ — «неизлечимым и невидимым ударом»; ἄρτι… καταλήξαντος τὸν λόγον — «едва он окончил слово»; ἀνήκεστος τῶν σπλάγχνων ἀλγηδών — «нестерпимая боль внутренностей» (ἀνήκεστος); πικραὶ τῶν ἔνδον βάσανοι — «горькие внутренние мучения»."
  6: "πάνυ δικαίως — «вполне праведно»; τὸν πολλαῖς καὶ ξενιζούσαις συμφοραῖς ἑτέρων σπλάγχνα βασανίσαντα — «мучившего внутренности других многими и необычными бедствиями» (ξενίζω — поражать, быть странным)."
  7: "τῆς ἀγερωχίας — «высокомерия» (ἀγερωχία); πῦρ πνέων τοῖς θυμοῖς — «дыша огнём ярости»; ἐποξύνειν τὴν πορείαν — «ускорять путь»; φερομένου ῥοίζῳ — «несомого со свистом (с шумом)» (ῥοῖζος); πάντα τὰ μέλη τοῦ σώματος ἀποστρεβλοῦσθαι — «все члены тела вывихнуть (повредить)» (ἀποστρεβλόω)."
  8: "τοῖς τῆς θαλάσσης κύμασιν ἐπιτάσσειν — «повелевать морским волнам»; διὰ τὴν ὑπὲρ ἄνθρωπον ἀλαζονείαν — «по сверхчеловеческому хвастовству» (ἀλαζονεία); πλάστιγγι τὰ τῶν ὀρέων… ὕψη στήσειν — «весами высоты гор поставить (измерить)» (πλάστιγξ); ἐν φορείῳ παρεκομίζετο — «на носилках носился» (φορεῖον, 担架[たんか])."
  9: "σκώληκας ἀναζεῖν — «червям кипеть (во множестве появляться)» (ἀναζέω); τὰς σάρκας αὐτοῦ διαπίπτειν — «плоти его распадаться (отпадать)»; ὑπὸ τῆς ὀσμῆς αὐτοῦ — «от запаха его»; βαρύνεσθαι τὴν σαπρίαν — «тяготиться зловонием (гнилостью)» (σαπρία). Слав. «червию кипети»."
  10: "τῶν οὐρανίων ἄστρων ἅπτεσθαι δοκοῦντα — «казавшегося касаться небесных звёзд»; διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος — «из-за невыносимой тяжести запаха» (ἀφόρητος)."
  11: "ἐνταῦθα… ἤρξατο τὸ πολὺ τῆς ὑπερηφανίας λήγειν — «здесь начал оставлять великую гордость»; τεθραυσμένος — «сокрушённый» (θραύω); εἰς ἐπίγνωσιν ἔρχεσθαι — «приходить в познание»; θεία μάστιγι κατὰ στιγμὴν ἐπιτεινόμενος ταῖς ἀλγηδόσιν — «божественным бичом с каждым мгновением усиливаемый в болях»."
  12: "μηδὲ τῆς ὀσμῆς αὐτοῦ δυνάμενος ἀνέχεσθαι — «не могши терпеть и своего запаха»; Δίκαιον ὑποτάσσεσθαι τῷ θεῷ — «праведно покоряться Богу»; μὴ θνητὸν ὄντα ἰσόθεα φρονεῖν — «смертному не мыслить равного Богу» (ἰσόθεος). Слова Антиоха в 「…」."
  13: "ηὔχετο… πρὸς τὸν οὐκέτι αὐτὸν ἐλεήσοντα δεσπότην — «молился… к уже не милующему его Владыке»; οὕτως λέγων — «говоря так»."
  14: "τὴν ἁγίαν πόλιν… ἰσόπεδον ποιῆσαι καὶ πολυάνδριον οἰκοδομῆσαι — «святой город сравнять с землёй и кладбищем построить»; ἐλευθέραν ἀναδεῖξαι — «свободным объявить». Начало молитвы-обета в 「…」 (в 13 «говоря так»)."
  15: "μηδὲ ταφῆς ἀξιῶσαι — «не удостоить и погребения»; οἰωνοβρώτους… ἐκρίψειν θηρίοις — «на съедение птицам и зверям выбросить» (οἰωνοβρωτός); ἴσους Ἀθηναίοις ποιήσειν — «равными афинянам сделать» (дарование гражданства)."
  16: "ὃν πρότερον ἐσκύλευσεν ἅγιον νεώ — «святой храм, который прежде ограбил» (σκυλεύω); καλλίστοις ἀναθήμασιν κοσμήσειν — «прекраснейшими приношениями украсить» (ἀνάθημα); τὰ ἱερὰ σκεύη πολυπλάσια… ἀποδώσειν — «священные сосуды во много раз больше вернуть»; τὰς ἐπιβαινούσας πρὸς τὰς θυσίας συντάξεις — «надлежащие на жертвы расходы» (σύνταξις)."
  17: "καὶ Ιουδαῖον ἔσεσθαι — «и иудеем стать»; πάντα τόπον οἰκητὸν ἐπελεύσεσθαι καταγγέλλοντα τὸ τοῦ θεοῦ κράτος — «всякое обитаемое место обойти, возвещая силу Божию». Здесь моление закрывается."
  18: "οὐδαμῶς… ληγόντων τῶν πόνων — «боли нисколько не унимались»; ἐπεληλύθει… δικαία ἡ τοῦ θεοῦ κρίσις — «пришёл праведный суд Божий»; τὰ κατ᾽ αὐτὸν ἀπελπίσας — «отчаявшись в своём положении»; ἐπιστολὴν ἱκετηρίας τάξιν ἔχουσαν — «письмо, имеющее вид моления» (ἱκετηρία)."
  19: "Τοῖς χρηστοῖς Ιουδαίοις τοῖς πολίταις — «добрым иудеям-гражданам»; πολλὰ χαίρειν καὶ ὑγιαίνειν καὶ εὖ πράττειν — «много радоваться, здравствовать и благоденствовать»; βασιλεὺς καὶ στρατηγὸς Ἀντίοχος — «царь и военачальник Антиох». Начало письма в 「…」."
  20: "εἰ ἔρρωσθε — «если вы здоровы»; τὰ ἴδια κατὰ γνώμην ἐστὶν ὑμῖν — «ваши дела по вашему желанию»; εἰς οὐρανὸν τὴν ἐλπίδα ἔχων — «имея надежду на небо». Слав. добавляет «благодарю убо Богу великим благодарением» — нет в gr (пропуск в модуле), не внесено."
  21: "ὑμῶν τὴν τιμὴν καὶ τὴν εὔνοιαν ἐμνημόνευον φιλοστόργως — «вашу честь и благорасположение вспоминал с любовью»; περιπεσὼν ἀσθενείᾳ δυσχέρειαν ἐχούσῃ — «впав в болезнь тяжкую»; τῆς κοινῆς πάντων ἀσφαλείας — «общей всех безопасности»."
  22: "οὐκ ἀπογινώσκων τὰ κατ᾽ ἐμαυτόν — «не отчаиваясь в своём»; ἐκφεύξεσθαι τὴν ἀσθένειαν — «избежать болезни»."
  23: "καθ᾽ οὓς καιροὺς εἰς τοὺς ἄνω τόπους ἐστρατοπέδευσεν — «в какие времена он воевал в верхних странах»; ἀνέδειξεν τὸν διαδεξάμενον — «объявил преемника»."
  24: "ἐάν τι παράδοξον ἀποβαίνῃ — «если случится что неожиданное» (παράδοξος); ᾧ καταλέλειπται τὰ πράγματα — «кому оставлены дела»; μὴ ἐπιταράσσωνται — «не смущались» (ἐπιταράσσω)."
  25: "τοὺς παρακειμένους δυνάστας — «окрестных владетелей»; τοῖς καιροῖς ἐπέχοντας — «следящих за временами» (ἐπέχω); ἀναδ έδειχα τὸν υἱὸν Ἀντίοχον βασιλέα — «объявил сына Антиоха царём»; σατραπείας — «сатрапии» (太守[たいしゅ]領[りょう]); παρεκατετιθέμην καὶ συνίστων — «поручал и представлял»."
  26: "μεμνημένους τῶν εὐεργεσιῶν — «помня благодеяния»; κοινῇ καὶ κατ᾽ ἰδίαν ἕκαστον — «сообща и порознь каждый»; συντηρεῖν τὴν οὖσαν εὔνοιαν — «сохранять сущее благорасположение»."
  27: "πέπεισμαι — «я уверен»; ἐπιεικῶς καὶ φιλανθρώπως — «кротко и человеколюбиво»; παρακολουθοῦντα τῇ ἐμῇ προαιρέσει — «следующего моему намерению»; συμπεριενεχθήσεσθαι ὑμῖν — «будет обходиться с вами». Здесь письмо закрывается."
  28: "ὁ ἀνδροφόνος καὶ βλάσφημος — «человекоубийца и богохульник»; τὰ χείριστα παθών, ὡς ἑτέρους διέθηκεν — «претерпев худшее, как он распорядился другими»; ἐπὶ ξένης ἐν τοῖς ὄρεσιν — «на чужбине, в горах»; οἰκτίστῳ μόρῳ κατέστρεψεν τὸν βίον — «жалчайшей смертью окончил жизнь» (οἴκτιστος, μόρος)."
  29: "Φίλιππος ὁ σύντροφος αὐτοῦ — «Филипп, сверстник (воспитанник) его» (σύντροφος); διευλαβηθεὶς τὸν υἱὸν Ἀντιόχου — «убоявшись сына Антиохова»; πρὸς Πτολεμαῖον τὸν Φιλομήτορα εἰς Αἴγυπτον διεκομίσθη — «к Птолемею Филометору в Египет удалился». Слав. «к птоломею филомитору»; ru «Филопатору» — в тексте по gr/csl."
