# jp-box, Первое соборное послание Петра, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: вооружись тем же помыслом, что и Христос (1–6), конец близок:
# трезвитесь, любите, служите дарами (7–11), радость в страданиях за Христа (12–19).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 одно — 4:14 〔彼[かれ]らによってはののしられ、あなたがたによっては
# 崇[あが]められる。〕: церковное чтение κατά μὲν αὐτοὺς βλασφημεῖται,
# κατὰ δὲ ὑμᾶς δοξάζεται (Елизаветинская «оне убо хулится, а в вас прославляется»;
# jp-joc 彼等に因りて彼は瀆され、爾等に因りて榮せらる). В gr-lxx-byz этих слов
# НЕТ (проверено: βλασφημεῖται — НЕТ, δοξάζεται — НЕТ), поэтому они в 〔…〕.
# Цитаты Писания: 4:8 (Притч 10:12), 4:18 (Притч 11:31) — в 「」, атрибуция в notes.
# 4:14 — τὸ τῆς δόξης … πνεῦμα: πνεῦμα без ἅγιον, поэтому 霊[れい], не 聖霊.
# Сносок ⟨…⟩ нет: 賜物, 管理者, 悪魔 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
book: 1pet
chapter: 4
draft: true

verses:
  1: "キリストは肉[にく]において苦[くる]しみを受けられたのだから、あなたがたも同[おな]じ覚悟[かくご]をもって身[み]を武装[ぶそう]しなさい。肉[にく]において苦[くる]しみを受[う]けた者[もの]は、罪[つみ]から離[はな]れたのである。"
  2: "それは、もはや人[ひと]の欲[よく]にではなく、神[かみ]の御心[みこころ]に従[したが]って、肉[にく]にある残[のこ]りの時[とき]を生[い]きるためである。"
  3: "あなたがたが過[す]ぎ去[さ]った時[とき]の間[あいだ]に、異邦人[いほうじん]の望[のぞ]むままに、好色[こうしょく]、欲[よく]、酒[さけ]に溺[おぼ]れること、宴会[えんかい]、暴飲[ぼういん]、律法[りっぽう]に反[はん]する偶像崇拝[ぐうぞうすうはい]に歩[あゆ]んだことは、もう十分[じゅうぶん]である。"
  4: "彼[かれ]らは、あなたがたが同[おな]じ放蕩[ほうとう]の奔流[ほんりゅう]に加[くわ]わらないのを不思議[ふしぎ]に思[おも]って、ののしっている。"
  5: "彼[かれ]らは、生[い]ける者[もの]も死[し]んだ者[もの]も裁[さば]く用意[ようい]のできている方[かた]に、言[い]い開[ひら]きをすることになる。"
  6: "死人[しにん]にも福音[ふくいん]が告[つ]げられたのは、このためである。それは、彼[かれ]らが人[ひと]に従[したが]って肉[にく]において裁[さば]かれながら、神[かみ]に従[したが]って霊[れい]において生[い]きるためである。"
  7: "すべてのものの終[お]わりが近[ちか]づいている。だから、慎[つつし]み深[ぶか]く、祈[いの]りのために目[め]を覚[さ]ましていなさい。"
  8: "何[なに]より、互[たがい]への愛[あい]を熱[あつ]く保[たも]ちなさい。「愛[あい]は多[おお]くの罪[つみ]をおおう」からである。"
  9: "不平[ふへい]を言[い]わずに、互[たが]いに旅[たび]の人[ひと]を迎[むか]え入[い]れなさい。"
  10: "それぞれが受[う]けた賜物[たまもの]に従[したが]って、神[かみ]のさまざまな恵[めぐ]みの良[よ]い管理者[かんりしゃ]として、互[たが]いに仕[つか]え合[あ]いなさい。"
  11: "語[かた]る者[もの]は神[かみ]の言葉[ことば]として語[かた]り、仕[つか]える者[もの]は神[かみ]が与[あた]えてくださる力[ちから]によって仕[つか]えなさい。そうすれば、すべてのことにおいて、イエス・キリストを通して神[かみ]が崇[あが]められる。栄光[えいこう]と権能[けんのう]は、世[よ]々[よ]限[かぎ]りなく、キリストにありますように。アーメン。"
  12: "愛[あい]する者[もの]たちよ、あなたがたを試[ため]すために起[お]こる燃[も]えるような試練[しれん]を、自分[じぶん]たちに珍[めずら]しいことが起[お]こったかのように驚[おどろ]いてはならない。"
  13: "むしろ、あなたがたがキリストの苦[くる]しみにあずかっているのを喜[よろこ]びなさい。それは、キリストの栄光[えいこう]が現[あらわ]れるとき、あなたがたも喜[よろこ]び、小躍[こおど]りするためである。"
  14: "キリストの名[な]のためにあなたがたが非難[ひなん]されるなら、あなたがたは幸[さいわ]いである。栄光[えいこう]の霊[れい]、神[かみ]の霊[れい]が、あなたがたの上[うえ]に安[やす]らわれているからである。〔彼[かれ]らによってはののしられ、あなたがたによっては崇[あが]められる。〕"
  15: "あなたがたのうちのだれも、人殺[ひとごろ]し、盗人[ぬすびと]、悪[あく]を行[おこな]う者[もの]、あるいは他人[たにん]のことに口[くち]を出[だ]す者[もの]として苦[くる]しみを受[う]けてはならない。"
  16: "しかし、キリスト者[しゃ]として苦[くる]しみを受[う]けるなら、恥[は]じてはならない。むしろ、その名[な]のゆえに神[かみ]を崇[あが]めなさい。"
  17: "神[かみ]の家[いえ]から始[はじ]まる裁[さば]きの時[とき]が来[き]ている。もしそれがまずわたしたちから始[はじ]まるなら、神[かみ]の福音[ふくいん]に従[したが]わない者[もの]たちの終[お]わりはどうなるであろうか。"
  18: "「正[ただ]しい者[もの]がやっと救[すく]われるのであれば、不敬虔[ふけいけん]な者[もの]と罪人[ざいにん]はどこに現[あらわ]れるというのか。」"
  19: "だから、神[かみ]の御心[みこころ]に従[したが]って苦[くる]しみを受[う]ける者[もの]たちは、善[ぜん]を行[おこな]いつつ、自分[じぶん]の魂[たましい]を、信[しん]実[じつ]な造[つく]り主[ぬし]に委[ゆだ]ねなさい。"

notes:
  1: "παθόντος σαρκὶ — 肉において苦しみを受けられた. τὴν αὐτὴν ἔννοιαν ὁπλίσασθε — 同じ覚悟をもって身を武装しなさい (ὁπλίζω — вооружать; ἔννοια — мысль, намерение). πέπαυται ἁμαρτίας — 罪から離れた (перфект: совершилось; ἁμαρτίας — род. отделения)."
  2: "εἰς τὸ μηκέτι … βιῶσαι — もはや…生きるため. ἀνθρώπων ἐπιθυμίαις — 人の欲に. θελήματι θεοῦ — 神の御心に従って. τὸν ἐπίλοιπον ἐν σαρκὶ χρόνον — 肉にある残りの時."
  3: "ἀρκετὸς ὁ παρεληλυθὼς χρόνος — 過ぎ去った時の間で十分. τὸ βούλημα τῶν ἐθνῶν — 異邦人の望むまま. Шесть пороков сохранены: ἀσέλγεια, ἐπιθυμία, οἰνοφλυγία, κῶμος, πότος, ἀθέμιτος εἰδωλολατρία — 好色、欲、酒に溺れること、宴会、暴飲、律法に反する偶像崇拝."
  4: "ξενίζονται — 不思議に思う (ср. 4:12). μὴ συντρεχόντων ὑμῶν — あなたがたが加わらない. ἀσωτία — 放蕩. ἀνάχυσις — 奔流 (hapax: «разлив»). βλασφημοῦντες — ののしっている."
  5: "ἀποδώσουσιν λόγον — 言い開きをする (ср. Мф 12:36). τῷ ἑτοίμως ἔχοντι κρῖναι — 裁く用意のできている方. ζῶντας καὶ νεκρούς — 生ける者も死んだ者も."
  6: "νεκροῖς εὐηγγελίσθη — 死人にも福音が告げられた (ср. 3:19). κριθῶσι μὲν κατὰ ἀνθρώπους σαρκί — 人に従って肉において裁かれ. ζῶσι δὲ κατὰ θεὸν πνεύματι — 神に従って霊において生きる."
  7: "τὸ τέλος ἤγγικεν — 終わりが近づいている (перфект). σωφρονήσατε — 慎み深く. νήψατε εἰς προσευχάς — 祈りのために目を覚まして."
  8: "πρὸ πάντων — 何より. ἀγάπη ἐκτενής — 熱い愛. Цитата Притч 10:12 (ср. Иак 5:20; 1 Кор 13:7). καλύπτει πλῆθος ἁμαρτιῶν — 多くの罪をおおう."
  9: "φιλόξενοι — 旅人を迎え入れる者 (ср. 1 Тим 3:2). ἄνευ γογγυσμοῦ — 不平を言わずに (γογγυσμός — ропот, ср. Флп 2:14)."
  10: "χάρισμα — 賜物. οἰκονόμοι ποικίλης χάριτος θεοῦ — 神のさまざまな恵みの良い管理者 (οἰκονόμος — домоправитель, ср. Лк 12:42). διακονοῦντες — 仕え合いなさい."
  11: "λόγια θεοῦ — 神の言葉 (λόγιον — изречение, ср. Деян 7:38). ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός — 神が与えてくださる力によって. ἵνα ἐν πᾶσιν δοξάζηται ὁ θεός — すべてのことにおいて神が崇められる. Доксология: ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων — 栄光と権能は世々限りなく; ἀμήν в базе есть."
  12: "μὴ ξενίζεσθε — 驚いてはならない. πύρωσις — 燃えるような試練 (букв. «воспламенение»). πρὸς πειρασμὸν ὑμῖν γινομένῃ — あなたがたを試すために起こる. ὡς ξένου συμβαίνοντος — 自分たちに珍しいことが起こったかのように."
  13: "καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν — キリストの苦しみにあずかっている. ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ — キリストの栄光が現れるとき. ἀγαλλιώμενοι — 小躍りして喜ぶ (ср. 1:6)."
  14: "ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ — キリストの名のために非難される. μακάριοι — 幸いである. τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα — 栄光の霊、神の霊; πνεῦμα без ἅγιον, поэтому 霊[れい]. ἐφ᾿ ὑμᾶς ἀναπαύεται — あなたがたの上に安らわれている. 〔彼らによっては…〕: церковное добавление κατά μὲν αὐτοὺς βλασφημεῖται, κατὰ δὲ ὑμᾶς δοξάζεται (Елизаветинская, jp-joc), в gr-lxx-byz его нет — проверено; подлежащее в греч. не названо, поэтому не уточнено."
  15: "μὴ … πασχέτω — 苦しみを受けてはならない. φονεύς, κλέπτης, κακοποιός, ἀλλοτριεπίσκοπος — 人殺し、盗人、悪を行う者、他人のことに口を出す者; ἀλλοτριεπίσκοπος — hapax, «вмешивающийся в чужие дела»."
  16: "ὡς Χριστιανός — キリスト者として (единственное место в НЗ, где слово стоит в устах апостола). μὴ αἰσχυνέσθω — 恥じてはならない. δοξαζέτω τὸν θεὸν ἐν τῷ ὀνόματι τούτῳ — その名のゆえに神を崇めなさい."
  17: "ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ — 神の家から始まる裁きの時. εἰ δὲ πρῶτον ἀφ᾿ ἡμῶν — もしそれがまずわたしたちから始まるなら. τί τὸ τέλος τῶν ἀπειθούντων — 従わない者たちの終わりはどうなるか."
  18: "Цитата Притч 11:31 (LXX). ὁ δίκαιος μόλις σῴζεται — 正しい者がやっと救われる. ἀσεβής — 不敬虔な者. ποῦ φανεῖται — どこに現れるのか."
  19: "ὥστε — だから. οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ θεοῦ — 神の御心に従って苦しみを受ける者たち. πιστῷ κτίστῃ — 信実な造り主. παρατιθέσθωσαν τὰς ψυχάς — 魂を委ねなさい (ср. Лк 23:46). ἐν ἀγαθοποιΐᾳ — 善を行いつつ."
