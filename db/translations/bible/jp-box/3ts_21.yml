# jp-box, 3-я Царств, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация — славяно-синодальная (по csl-ru): 29 стихов, стих в стих совпадает
# с прежней греческой (слав. 21:1 = прежний гр 20:1).
# Глава 21: виноградник Навуфея (1–4), заговор Иезавели и убийство (5–16),
# слово Господне Илии и приговор дому Ахава (17–29).
# Перестановка глав: в LXX история Навуфея — гл. 20, а войны с сирийцами — гл. 21;
# у слав. и в Синодальном наоборот, поэтому прежний гр. текст гл. 20 стоит здесь
# как гл. 21, а сирийские войны — в гл. 20 (номера стихов при этом не менялись).
# Речь — 「…」, вложенная — 『…』. Красного нет.
# Паритет: 4 — слав. «пришёл в дом свой смущённый…» нет в LXX (по МТ), внесено;
# 27 — слав. «хождаше скорбен» нет в LXX, внесено; LXX-варианты — в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 嗣業, 脱穀場, 断食, 預言者 уже в корпусе;
# 粗布 понятно по контексту.
# jp-ni не использовался.

