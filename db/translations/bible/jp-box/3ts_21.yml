verses:
  1: "ベン・ハダドは自分[じぶん]の全[ぜん]軍[ぐん]を集[あつ]め、上[のぼ]ってサマリアを包囲[ほうい]した。彼[かれ]とともに三十二人[さんじゅうににん]の王[おう]、すべての馬[うま]と戦車[せんしゃ]がいた。彼[かれ]らは上ってサマリアを包囲し、それと戦[たたか]った。"
  2: "彼[かれ]は人[ひと]を、サマリアの町[まち]にいるイスラエルの王[おう]アハブのもとへ送[おく]った。"
  3: "そして言[い]った。「ベン・ハダドはこう言[い]う。あなたの銀[ぎん]と金[きん]は私[わたし]のものであり、あなたの妻[つま]たちと、あなたの子[こ]らのうち最[さい]良[りょう]の者[もの]たちは私[わたし]のものだ。」"
  4: "イスラエルの王[おう]は答[こた]えて言[い]った。「わが主[あるじ]なる王[おう]よ、あなたが言[い]ったとおり、私[わたし]はあなたのもの、私[わたし]のすべてはあなたのものだ。」"
  5: "使者[ししゃ]たちは戻[もど]って来[き]て言[い]った。「ベン・ハダドはこう言[い]う。私[わたし]はあなたに人[ひと]を送[おく]って、『あなたの銀[ぎん]と金[きん]、あなたの妻[つま]たちと子[こ]らを私[わたし]に与[あた]えよ』と言[い]った。」"
  6: "「それというのも、明日[あした]のこの時刻[じこく]に、私[わたし]は自分[じぶん]の僕[しもべ]たちをあなたのもとへ送[おく]るからだ。彼[かれ]らはあなたの家[いえ]と、あなたの僕[しもべ]たちの家[いえ]を調[しら]べ、あなたの目[め]に望[のぞ]ましいもの、彼[かれ]らが手[て]をかけるものは何[なに]でも取[と]って行[い]く。」"
  7: "イスラエルの王[おう]はすべての長老[ちょうろう]たちを呼[よ]んで言[い]った。「よく知[し]って見[み]なさい。この者[もの]は悪[わる]を求[もと]めている。彼[かれ]は私[わたし]の妻[つま]たち、私の息子[むすこ]たち、私の娘[むすめ]たちのことで私に人を送り、私の銀[ぎん]と金[きん]も、彼[かれ]に与[あた]えることを拒[こば]まなかったのだ。」"
  8: "長老[ちょうろう]たちとすべての民[たみ]は彼[かれ]に言[い]った。「聞[き]いてはならない。応[おう]じてはならない。」"
  9: "彼[かれ]はベン・ハダドの使者[ししゃ]たちに言[い]った。「あなたがたの主[あるじ]に言[い]いなさい。『私[わたし]は前[まえ]にあなたが僕[しもべ]に送ったすべてのことを行[おこな]おう。しかし、この言葉[ことば]はできない。』」使者[ししゃ]たちは去[さ]って彼[かれ]に答[こた]えを返[かえ]した。"
  10: "ベン・ハダドは彼[かれ]に人[ひと]を送[おく]って言[い]った。「神々[かみがみ]が私[わたし]にこうし、さらにこう加[くわ]えるように。もしサマリアの土[つち]が、私[わたし]に従[したが]うすべての歩兵[ほへい]の手[て]に一握[ひとにぎ]りずつ足[た]りるなら。」"
  11: "イスラエルの王[おう]は答[こた]えて言[い]った。「十分[じゅうぶん]だ。かがんでいる者[もの]が、まっすぐに立[た]つ者[もの]のように誇[ほこ]ってはならない。」"
  12: "この返事[へんじ]を受[う]けたとき、彼[かれ]は彼[かれ]とともにいるすべての王[おう]たちと天幕[てんまく]で酒[さけ]を飲[の]んでいた。彼[かれ]は自分[じぶん]の僕[しもべ]たちに言[い]った。「土塁[どるい]を築[きず]け。」彼[かれ]らは町[まち]に向[む]かって土塁を築[きず]いた。"
  13: "見[み]よ、一人[ひとり]の預言者[よげんしゃ]がイスラエルの王[おう]のもとに来[き]て言[い]った。「主[しゅ]はこう言[い]われる。『あなたはこの大[おお]きな群衆[ぐんしゅう]をすべて見[み]たか。見よ、私[わたし]は今日[きょう]、それをあなたの手[て]に与[あた]える。あなたは私[わたし]が主[しゅ]であることを知[し]る。』」"
  14: "アハブは言[い]った。「誰[だれ]によってか。」預言者[よげんしゃ]は言[い]った。「主[しゅ]はこう言[い]われる。『地方[ちほう]の長[かしら]たちの若者[わかもの]たちによって。』」アハブは言[い]った。「誰[だれ]が戦[たたか]いを始[はじ]めるのか。」預言者[よげんしゃ]は言[い]った。「あなたが。」"
  15: "アハブは地方[ちほう]の長[かしら]たちの若者[わかもの]たちを数[かぞ]えたところ、二百三十二人[にひゃくさんじゅうににん]であった。その後[あと]で彼[かれ]は民[たみ]を、すなわち力[ちから]ある者[もの]すべてを数[かぞ]えたところ、七千[しちせん]人[にん]であった。"
  16: "彼[かれ]らは正午[しょうご]に出[で]て行[い]った。ベン・ハダドはスコトで、彼[かれ]とともにいる三十二人[さんじゅうににん]の王[おう]たち、すなわち彼[かれ]を助[たす]ける王たちとともに、酔[よ]って酒[さけ]を飲[の]んでいた。"
  17: "地方[ちほう]の長[かしら]たちの若者[わかもの]たちが先[さき]に出[で]て行[い]った。すると、人[ひと]がベン・ハダドに告[つ]げて言[い]った。「人々[ひとびと]がサマリアから出[で]て来[き]た。」"
  18: "彼[かれ]は言[い]った。「もし彼[かれ]らが平和[へいわ]のために出[で]て来[き]たなら、生[い]けどりにせよ。もし戦[たたか]いのために出て来たなら、やはり生けどりにせよ。町[まち]から出[で]てはならない。」"
  19: "地方[ちほう]の長[かしら]たちの若者[わかもの]たちは町[まち]から出[で]て行[い]った。そして軍[ぐん]が彼[かれ]らの後[あと]に続[つづ]いた。"
  20: "彼[かれ]らはそれぞれ自分[じぶん]の相手[あいて]を打[う]ち、それぞれ自分の相手をもう一度[いちど]打[う]った。シリアは逃[に]げ、イスラエルは彼[かれ]らを追[お]った。シリアの王[おう]ベン・ハダドは馬[うま]に乗[の]って逃[のが]れた。"
  21: "イスラエルの王[おう]は出[で]て行[い]って、すべての馬[うま]と戦車[せんしゃ]を取[と]り、シリアに大[おお]きな打撃[だげき]を与[あた]えた。"
  22: "預言者[よげんしゃ]はイスラエルの王[おう]のもとに来[き]て言[い]った。「強[つよ]くし、よく考[かんが]え、何[なに]をすべきかを見[み]きわめなさい。年[とし]が巡[めぐ]って来[く]ると、シリアの王[おう]ベン・ハダドがあなたに向[む]かって上[のぼ]って来[く]るからだ。」"
  23: "シリアの王[おう]の僕[しもべ]たちは彼[かれ]に言[い]った。「彼[かれ]らの神[かみ]は山[やま]の神であって、谷[たに]の神ではない。だから彼[かれ]らは私[わたし]たちに勝[まさ]ったのだ。もし私[わたし]たちが彼[かれ]らと平地[へいち]で戦[たたか]えば、きっと彼[かれ]らに勝[か]つ。"
  24: "また、このことを行[おこな]いなさい。王[おう]たちをそれぞれ自分[じぶん]の場所[ばしょ]へ帰[かえ]し、彼[かれ]らの代[か]わりに太守[たいしゅ]たちを置[お]きなさい。"
  25: "そして、あなたから倒[たお]れた軍勢[ぐんぜい]に代[か]わる軍勢を、馬[うま]に代わる馬、戦車[せんしゃ]に代わる戦車を、あなたのために整[ととの]えよう。そうすれば、私たちは彼[かれ]らと平地[へいち]で戦[たたか]って、きっと彼[かれ]らに勝[か]つ。」彼[かれ]は彼[かれ]らの声[こえ]を聞[き]き入[い]れて、そのとおりに行[おこな]った。"
  26: "年[とし]が巡[めぐ]ると、ベン・ハダドはシリアを召集[しょうしゅう]して、イスラエルと戦[たたか]うためにアフェクへ上[のぼ]って来[き]た。"
  27: "イスラエルの子[こ]らも召集[しょうしゅう]されて、彼[かれ]らを迎[むか]えに出[で]た。イスラエルは彼[かれ]らの前[まえ]に、山羊[やぎ]の二[ふた]つの群[む]れのように陣[じん]を敷[し]いた。シリアは地[ち]を満[み]たした。"
  28: "神[かみ]の人[ひと]が来[き]てイスラエルの王[おう]に言[い]った。「主[しゅ]はこう言[い]われる。『シリアが、主[しゅ]は山[やま]の神[かみ]であって谷[たに]の神ではない、と言[い]ったがゆえに、私[わたし]はこの大[おお]きな軍勢[ぐんぜい]をあなたの手[て]に与[あた]える。あなたは私[わたし]が主[しゅ]であることを知[し]る。』」"
  29: "彼[かれ]らは七[なな]日間[なのかかん]、互[たが]いに向[む]かい合[あ]って陣[じん]を敷[し]いた。七日目[なぬかめ]に戦[たたか]いが始[はじ]まり、イスラエルは一日[いちにち]のうちにシリアの歩兵[ほへい]十二万[じゅうにまん]人[にん]を打[う]ち殺[ころ]した。"
  30: "残[のこ]りの者[もの]たちはアフェクの町[まち]へ逃[に]げ、城壁[じょうへき]が残りの者[もの]二万七千人[にまんななせんにん]の上[うえ]に崩[くず]れ落[お]ちた。ベン・ハダドも逃[に]げて、寝室[しんしつ]の奥[おく]の部屋[へや]に入[はい]った。"
  31: "僕[しもべ]たちは彼[かれ]に言[い]った。「見[み]てください。イスラエルの家[いえ]の王[おう]たちは情[なさ]け深[ぶか]い王[おう]だと、私たちは知[し]っている。私たちは粗布[あらぬの]を腰[こし]に巻[ま]き、縄[なわ]を頭[あたま]に巻[ま]いて、イスラエルの王[おう]のもとへ出[で]て行[い]こう。もしかすると、彼[かれ]は私たちの命[いのち]を生[い]かしてくれるかもしれない。」"
  32: "彼[かれ]らは粗布[あらぬの]を腰[こし]に巻[ま]き、縄[なわ]を頭[あたま]に巻[ま]いて、イスラエルの王[おう]のもとへ来[き]て言[い]った。「あなたの僕[しもべ]ベン・ハダドがこう言[い]っている。『どうか、私[わたし]の命[いのち]を生[い]かしてほしい』と。」王[おう]は言[い]った。「彼[かれ]はまだ生[い]きているのか。彼[かれ]は私[わたし]の兄弟[きょうだい]だ。」"
  33: "その人[ひと]たちはそれを吉兆[きっちょう]と見[み]て、すぐにその言葉[ことば]を彼[かれ]の口[くち]から取[と]り上[あ]げ、言[い]った。「あなたの兄弟[きょうだい]ベン・ハダドだ。」王[おう]は言[い]った。「行[い]って、彼[かれ]を連[つ]れて来[き]なさい。」ベン・ハダドは彼[かれ]のもとに出[で]て来[き]た。そして人[ひと]々[びと]は彼[かれ]を王[おう]の戦車[せんしゃ]に乗[の]せた。"
  34: "ベン・ハダドは彼[かれ]に言[い]った。「私[わたし]の父[ちち]があなたの父[ちち]から取[と]った町々[まちまち]を、私[わたし]はあなたに返[かえ]す。また、あなたはダマスコに自分[じぶん]のための市場[いちば]を設[もう]けることができる。私[わたし]の父[ちち]がサマリアに設[もう]けたように。」そこでアハブは彼[かれ]と契約[けいやく]を結[むす]び、彼[かれ]を去[さ]らせた。"
  35: "預言者[よげんしゃ]の子[こ]らの一人[ひとり]が、主[しゅ]の言葉[ことば]によって隣人[りんじん]に言[い]った。「私[わたし]を打[う]ってください。」しかし、その人[ひと]は彼[かれ]を打[う]とうとしなかった。"
  36: "彼[かれ]はその人[ひと]に言[い]った。「あなたは主[しゅ]の声[こえ]に聞[き]かなかったから、見[み]よ、あなたが私[わたし]から去[さ]ると、ライオンがあなたを打[う]つ。」その人[ひと]が彼[かれ]から去[さ]ると、ライオンが彼[かれ]を見[み]つけて打[う]った。"
  37: "彼[かれ]は別[べつ]の人[ひと]を見[み]つけて言[い]った。「私[わたし]を打[う]ってください。」その人[ひと]は彼[かれ]を打[う]ち、打[う]ち砕[くだ]いた。"
  38: "預言者[よげんしゃ]は行[い]って、道[みち]で王[おう]の前[まえ]に立[た]ち、布[ぬの]で自分[じぶん]の目[め]を覆[おお]った。"
  39: "王[おう]が通[とお]り過[す]ぎるとき、彼[かれ]は王[おう]に向[む]かって叫[さけ]んで言[い]った。「僕[しもべ]は戦[たたか]いに出[で]て行[い]った。すると、一人[ひとり]の男[おとこ]が一人の男を私[わたし]のところへ連[つ]れて来[き]て、私に言[い]った。『この男[おとこ]を守[まも]れ。もし彼[かれ]が逃[に]げ出[だ]したら、あなたの命[いのち]が彼[かれ]の命の代[か]わりになるか、さもなければ銀[ぎん]一[いち]タラントを納[おさ]めよ』と。」"
  40: "「僕[しもべ]がこちらを見[み]たり、あちらを見[み]たりしているうちに、その男[おとこ]はいなくなっていた。」イスラエルの王[おう]は彼[かれ]に言[い]った。「見[み]よ、それがあなたへの裁[さば]きだ。あなた自身[じしん]が決[き]めたのだ。」"
  41: "彼[かれ]は急[いそ]いで目[め]から覆[おお]いを取[と]り去[さ]った。イスラエルの王[おう]は彼[かれ]を認[みと]めて、彼[かれ]が預言者[よげんしゃ]の一人[ひとり]であることを知[し]った。"
  42: "彼[かれ]に言[い]った。「主[しゅ]はこう言[い]われる。『あなたが、私[わたし]が滅[ほろ]ぼすと決[き]めた男[おとこ]を自分[じぶん]の手[て]から逃[に]がしたので、あなたの命[いのち]が彼[かれ]の命の代[か]わりとなり、あなたの民[たみ]が彼[かれ]の民の代[か]わりとなる。』」"
  43: "イスラエルの王[おう]は心[こころ]乱[みだ]れ、気力[きりょく]を失[うしな]って家[いえ]へ帰[かえ]り、サマリアに来[き]た。"

notes:
  1: "υἱὸς Αδερ — «сын Адера», т. е. Венадад (בן־הדד); в LXX всюду эта перифраза, передано ベン・ハダド. συνήθροισεν — собрал (συναθροίζω). τριάκοντα καὶ δύο βασιλεῖς — тридцать два царя. περιεκάθισεν — осадил (περικαθίζω). В csl и ru это 20:1 (главы переставлены; здесь нумерация по gr)."
  2: "Стих в гр. обрывается: «послал к Ахаву … в город», продолжение — в ст. 3. В слав. 20:2 конец тот же."
  3: "τὸ ἀργύριόν σου καὶ τὸ χρυσίον σου ἐμόν ἐστιν — серебро и золото твоё — моё. τὰ τέκνα σου ἐμά ἐστιν — дети твои мои; слав. «чада твоя добрая» (лучшие), в ru «лучшие сыновья» — по МТ; внесено 最良の者たち."
  4: "Καθὼς ἐλάλησας, κύριε βασιλεῦ — «как ты сказал, господин мой царь». σὸς ἐγώ εἰμι — «я твой»."
  5: "ἀνέστρεψαν οἱ ἄγγελοι — возвратились послы (ἄγγελος здесь — посланник). ἀπέσταλκα — послал (перфект). δώσεις ἐμοί — «отдашь мне» (будущее как повеление)."
  6: "ἐρευνήσουσιν — обыщут (ἐρευνάω). τὰ ἐπιθυμήματα ὀφθαλμῶν αὐτῶν — желаемое очей их. ἐπιβάλωσι τὰς χεῖρας — наложат руки. λήμψονται — возьмут."
  7: "Γνῶτε δὴ καὶ ἴδετε — «знайте и видьте». κακίαν οὗτος ζητεῖ — «он ищет зла». οὐκ ἀπεκώλυσα — не воспрепятствовал (ἀποκωλύω)."
  8: "Μὴ ἀκούσῃς καὶ μὴ θελήσῃς — «не слушай и не соизволь»; слав. добавляет «дати» — в тексте не отражено."
  9: "ἐν πρώτοις — «в первых [посланиях]», т. е. прежде. τὸ ῥῆμα τοῦτο οὐ δυνήσομαι ποιῆσαι — «этого слова не смогу сделать». ἀπῆραν — ушли (ἀπαίρω). ἐπέστρεψαν λόγον — принесли ответ."
  10: "χοῦς Σαμαρείας — прах Самарии. ταῖς ἀλώπεξιν — букв. «лисицам» (ἀλώπηξ), тёмное место; слав. «горстем» (горстями), по смыслу — по горсти. Передано по слав. πεζοῖς — пешим, 歩兵."
  11: "Ἱκανούσθω — «довольно». μὴ καυχάσθω ὁ κυρτὸς ὡς ὁ ὀρθός — «да не хвалится согбенный, как прямой» (κυρτός — согбенный, ὀρθός — прямой); слав. «слячен … прямый». В ru иначе: «пусть не хвалится подпоясывающийся, как распоясывающийся» (по МТ)."
  12: "ἐν σκηναῖς — в шатрах (σκηνή). Οἰκοδομήσατε χάρακα — «постройте вал» (χάραξ — осадный вал, 土塁). ἔθεντο χάρακα ἐπὶ τὴν πόλιν — поставили вал против города."
  13: "ὁ ὄχλος ὁ μέγας — великое множество, полчище. δίδωμι … εἰς χεῖρας σάς — даю в руки твои. γνώσῃ ὅτι ἐγὼ κύριος — узнаешь, что Я Господь."
  14: "Ἐν τίνι; — «через кого?». παιδάρια τῶν ἀρχόντων τῶν χωρῶν — отроки, слуги начальников областей (χώρα — округ); 地方の長たちの若者たち. Τίς συνάψει τὸν πόλεμον — «кто начнёт войну» (συνάπτω). Σύ — «ты»."
  15: "ἐπεσκέψατο — пересчитал, сделал смотр (ἐπισκέπτομαι). διακόσιοι καὶ τριάκοντα — двести тридцать. ἑξήκοντα χιλιάδας — шестьдесят тысяч (LXX); слав. и ru читают «семь тысяч» (по МТ) — взято слав. число 七千, вариант LXX в сноске. υἱὸς δυνάμεως — «сын силы», воин."
  16: "μεσημβρίας — в полдень (μεσημβρία). πίνων μεθύων — пил, напиваясь (μεθύω). ἐν Σοκχωθ — в Сокхофе (スコト). συμβοηθοί — союзные помощники."
  17: "παιδάρια ἀρχόντων τῶν χωρῶν — отроки начальников областей. ἐν πρώτοις — первыми. ἀπαγγέλλουσιν — возвещают. Ἄνδρες ἐξεληλύθασιν — «мужи вышли» (перфект ἐξέρχομαι)."
  18: "εἰ εἰς εἰρήνην … εἰ εἰς πόλεμον — «если за миром … если на войну». ζῶντας συλλάβετε — живыми возьмите (συλλαμβάνω). Слав. добавляет в конце «да не исходят из града» — в LXX эта фраза стоит в начале ст. 19; по слав. отнесена к ст. 18."
  19: "μὴ ἐξελθάτωσαν ἐκ τῆς πόλεως — «да не выходят из города» (в LXX — начало стиха; см. ст. 18). ἡ δύναμις ὀπίσω αὐτῶν — «сила за ними». Слав. «и тии изыдоша … и сила вслед их» — по слав. в тексте."
  20: "ἐπάταξεν ἕκαστος τὸν παρ᾿ αὐτοῦ — «поразил каждый своего». ἐδευτέρωσεν — «повторил», ударил во второй раз (δευτερόω). ἔφυγεν Συρία — Сирия побежала. ἐφ᾿ ἵππου ἱππέως — «на коне всадника», тёмное выражение; передано просто 馬に乗って."
  21: "ἔλαβεν πάντας τοὺς ἵππους — взял всех коней. πληγὴν μεγάλην — великое поражение (πληγή)."
  22: "Κραταιοῦ καὶ γνῶθι — «укрепи себя и знай» (κραταιόω). ἐπιστρέφοντος τοῦ ἐνιαυτοῦ — «по возвращении года», через год."
  23: "Θεὸς ὀρέων … οὐ θεὸς κοιλάδων — «Бог гор … не Бог долин». ἐκραταίωσεν ὑπὲρ ἡμᾶς — «одолел нас». κατ᾿ εὐθύ — «лицом к лицу», на равнине. εἰ μὴ κραταιώσομεν — «разве не одолеем» (клятвенное)."
  24: "ἀπόστησον τοὺς βασιλεῖς — отставь царей. θοῦ ἀντ᾿ αὐτῶν σατράπας — поставь вместо них сатрапов (σατράπης), 太守."
  25: "ἀλλάξομεν — переменим (ἀλλάσσω). κατὰ τὴν δύναμιν τὴν πεσοῦσαν ἀπὸ σοῦ — «по силе, павшей от тебя». ἤκουσεν τῆς φωνῆς — послушал голоса."
  26: "ἐπεσκέψατο τὴν Συρίαν — собрал Сирию. εἰς Αφεκα — в Афек (アフェク)."
  27: "παρεγένοντο εἰς ἀπαντήν — пришли навстречу. παρενέβαλεν — расположился станом (παρεμβάλλω). ὡσεὶ δύο ποίμνια αἰγῶν — «как два стада коз». ἔπλησεν τὴν γῆν — наполнила землю."
  28: "ἄνθρωπος τοῦ θεοῦ — человек Божий. Ἀνθ᾿ ὧν — «за то, что». κύριος ὁ θεὸς Ισραηλ — Господь Бог Израиля. εἰς χεῖρα σήν — в руку твою."
  29: "παρεμβάλλουσιν — стоят станом. ἑπτὰ ἡμέρας — семь дней. ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ — в седьмой день. ἑκατὸν χιλιάδας πεζῶν — сто тысяч пеших (LXX); слав. «сто и двадесять тысящ» — 120 000, взято слав. число 十二万, вариант LXX в сноске. μιᾷ ἡμέρᾳ — в один день."
  30: "κατάλοιποι — остальные. ἔπεσεν τὸ τεῖχος — упала стена. εἴκοσι καὶ ἑπτὰ χιλιάδας — двадцать семь тысяч. οἶκος τοῦ κοιτῶνος — дом спальни. ταμίειον — внутренняя комната, покой."
  31: "Οἶδα — знаю. βασιλεῖς ἐλέους — цари милости. ἐπιθώμεθα σάκκους — возложим вретища. σχοινία ἐπὶ τὰς κεφαλάς — верёвки на головы (знак покорности). ζωογονήσει — оставит в живых (ζωογονέω)."
  32: "περιεζώσαντο — опоясались. Δοῦλός σου υἱὸς Αδερ λέγει — «раб твой Венадад говорит». Ζησάτω ἡ ψυχή μου — «да живёт душа моя», пощади жизнь мою. ἀδελφός μού ἐστιν — «он брат мой»."
  33: "οἱ ἄνδρες οἰωνίσαντο — «мужи приняли за знамение» (οἰωνίζομαι — гадать, видеть знак); слав. «за знак и в залог прияша». ἀνέλεξαν τὸν λόγον ἐκ τοῦ στόματος — «подхватили слово из уст его». ἀναβιβάζουσιν ἐπὶ τὸ ἅρμα — подняли на колесницу."
  34: "ἐξόδους θήσεις σαυτῷ ἐν Δαμασκῷ — «выходы (улицы, торговые кварталы) сделаешь себе в Дамаске»; слав. «на исход», в ru «площади». διαθήκη — договор, завет; διέθετο — заключил (διατίθημι). ἐξαπέστειλεν — отпустил."
  35: "υἱοὶ τῶν προφητῶν — сыны пророческие, ученики пророков. ἐν λόγῳ κυρίου — по слову Господню. Πάταξον δή με — «ударь же меня»."
  36: "Ἀνθ᾿ ὧν οὐκ ἤκουσας — «за то, что не послушал». ἀποτρέχεις ἀπ᾿ ἐμοῦ — «отбегаешь от меня». πατάξει σε λέων — поразит тебя лев. εὑρίσκει — находит (исторический презенс)."
  37: "Πάταξόν με δή — «ударь же меня». πατάξας καὶ συνέτριψεν — ударив, сокрушил (συντρίβω)."
  38: "ἔστη τῷ βασιλεῖ ἐπὶ τῆς ὁδοῦ — стал на пути царя. κατεδήσατο τελαμῶνι τοὺς ὀφθαλμούς — обвязал глаза повязкой (τελαμών); слав. «покры покрывалом»."
  39: "παρεπορεύετο — проходил мимо (παραπορεύομαι). ἐπὶ τὴν στρατιὰν τοῦ πολέμου — «на войну брани», в войско. Φύλαξον — охрани, стереги. ἐκπηδῶν ἐκπηδήσῃ — «выпрыгнет» (усиление). τάλαντον ἀργυρίου — талант серебра (タラント). στήσεις — поставишь, отвесишь."
  40: "περιεβλέψατο ὧδε καὶ ὧδε — «оглянулся туда и сюда». Ἰδοὺ καὶ τὰ ἔνεδρα, παρ᾿ ἐμοὶ ἐφόνευσας — тёмное место: «вот и засада, при мне ты убил»; слав. «се, суд твой при мне, сам себе убил еси» — передано по смыслу (裁き)."
  41: "ἔσπευσεν — поспешил. ἀφεῖλεν τὸν τελαμῶνα — снял повязку. ἐπέγνω — узнал (ἐπιγινώσκω). ἐκ τῶν προφητῶν οὗτος — «он из пророков»."
  42: "ἄνδρα ὀλέθριον — «мужа пагубного», обречённого погибели (ὀλέθριος). ἐξήνεγκας … ἐκ χειρός σου — «вынес (выпустил) из руки твоей». ἀντὶ τῆς ψυχῆς — вместо души."
  43: "συγκεχυμένος — смущённый, потрясённый (συγχέω). ἐκλελυμένος — расслабленный, обессиленный (ἐκλύω). Слав. добавляет «к дому своему» — внесено (家へ)."
