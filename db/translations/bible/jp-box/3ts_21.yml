# jp-box, 3-я Царств, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# ВНИМАНИЕ: нумерация по gr-lxx-byz. Здесь гл. 21 — сирийские войны Ахава
# (43 стиха); в csl/ru та же история — глава 20, стих в стих (слав. 20:1 = gr 21:1).
# Глава 21: осада Самарии Венададом (1–12), первая победа (13–21),
# вторая победа при Афеке (22–30), пленение и договор с Венададом (31–34),
# притча пророка и приговор Ахаву (35–43).
# Речь — 「…」, вложенная — 『…』. Красного нет.
# Паритет: 15 — «семь тысяч» (слав. и ru, по МТ) против 60 000 в LXX;
# 29 — «сто двадцать тысяч» (слав.) против 100 000 в LXX; взяты слав. числа,
# варианты LXX — в notes. Прочие слав. добавления внесены без скобок.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 戦車, 預言者, 契約 уже в корпусе;
# 粗布 понятно по контексту.
# jp-ni не использовался.

