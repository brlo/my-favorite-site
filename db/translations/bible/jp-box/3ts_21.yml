chapter: 21
draft: true

verses:
  1: "イズレエル人[じん]ナボテには、サマリアの王[おう]アハブの脱穀場[だっこくじょう]のそばに、一[ひと]つのぶどう畑[ばたけ]があった。"
  2: "アハブはナボテに話[はな]しかけて言[い]った。「あなたのぶどう畑を私[わたし]に与[あた]えなさい。私[わたし]の家[いえ]に近[ちか]いので、それを野菜畑[やさいばたけ]にしたい。代[か]わりに、それよりも良[よ]いぶどう畑をあなたに与[あた]えよう。もしあなたが望[のぞ]むなら、このぶどう畑の代金[だいきん]として銀[ぎん]を与[あた]えよう。そうすれば、それは私[わたし]の野菜畑になる。」"
  3: "ナボテはアハブに言[い]った。「主[しゅ]なる私[わたし]の神[かみ]によって、父祖[ふそ]の嗣業[しぎょう]をあなたに与[あた]えるようなことは、私[わたし]には決[けっ]してできない。」"
  4: "アハブは家[いえ]に帰[かえ]り、イズレエル人[じん]ナボテが「父祖[ふそ]の嗣業[しぎょう]はあなたに与[あた]えない」と言[い]ったその言葉[ことば]のことで、悩[なや]み、傷[きず]ついた。そして彼[かれ]の心[こころ]は乱[みだ]れ、自分[じぶん]の寝床[ねどこ]に伏[ふ]して顔[かお]を覆[おお]い、パンを食[た]べなかった。"
  5: "妻[つま]イゼベルが彼[かれ]のところに来[き]て言[い]った。「なぜあなたの心[こころ]は乱[みだ]れているのか。なぜパンを食[た]べないのか。」"
  6: "彼[かれ]は彼女[かのじょ]に言[い]った。「私[わたし]はイズレエル人[じん]ナボテに『あなたのぶどう畑を銀[ぎん]で私に与えなさい。もし望[のぞ]むなら、代[か]わりに別[べつ]のぶどう畑を与えよう』と言[い]った。しかし彼[かれ]は『父祖[ふそ]の嗣業[しぎょう]はあなたに与えない』と言ったのだ。」"
  7: "妻[つま]イゼベルは彼[かれ]に言[い]った。「あなたは今[いま]、イスラエルの王[おう]として、そのように振[ふ]る舞[ま]うのか。起[お]きてパンを食[た]べ、落[お]ち着[つ]きなさい。私[わたし]があなたに、イズレエル人[じん]ナボテのぶどう畑を与[あた]えよう。」"
  8: "彼女[かのじょ]はアハブの名[な]で手紙[てがみ]を書[か]き、彼[かれ]の印[いん]で封印[ふういん]して、ナボテとともに住[す]んでいる長老[ちょうろう]たちと自由人[じゆうじん]たちに送[おく]った。"
  9: "手紙[てがみ]にはこう書[か]かれていた。「断食[だんじき]を布告[ふこく]し、ナボテを民[たみ]の先頭[せんとう]に座[すわ]らせなさい。"
  10: "そして、彼[かれ]の向[む]かいに、ならず者[もの]の子[こ]らである二人[ふたり]の男[おとこ]を座らせ、彼[かれ]に不利[ふり]な証言[しょうげん]をさせて、『彼[かれ]は神[かみ]と王[おう]をのろった』と言[い]わせなさい。そして彼[かれ]を外[そと]に連[つ]れ出[だ]して石[いし]で打[う]ち殺[ころ]し、死[し]なせなさい。」"
  11: "彼[かれ]の町[まち]の人々[ひとびと]、すなわち、彼の町に住[す]んでいた長老[ちょうろう]たちと自由人[じゆうじん]たちは、イゼベルが彼[かれ]らに送[おく]ったとおりに、彼女[かのじょ]が彼らに送った手紙[てがみ]に書[か]かれていたとおりに行[おこな]った。"
  12: "彼[かれ]らは断食[だんじき]を布告[ふこく]し、ナボテを民[たみ]の先頭[せんとう]に座[すわ]らせた。"
  13: "すると、ならず者[もの]の子[こ]らである二人[ふたり]の男[おとこ]が来[き]て彼[かれ]の向[む]かいに座[すわ]り、民[たみ]の前[まえ]で彼[かれ]に不利[ふり]な証言[しょうげん]をして言[い]った。「あなたは神[かみ]と王[おう]をのろった。」そこで彼[かれ]らは彼[かれ]を町[まち]の外[そと]に連[れ]出[だ]し、石[いし]で打[う]って殺[ころ]した。彼[かれ]は死[し]んだ。"
  14: "彼[かれ]らはイゼベルに人[ひと]を送[おく]って言[い]った。「ナボテは石[いし]で打[う]たれて死[し]んだ。」"
  15: "イゼベルはそれを聞[き]くと、アハブに言[い]った。「起[お]きて、イズレエル人[じん]ナボテのぶどう畑を手[て]に入[い]れなさい。彼[かれ]は銀[ぎん]と引[ひ]き換[か]えにあなたに与[あた]えようとしなかったが、ナボテはもう生[い]きていない。死[し]んだからだ。」"
  16: "アハブは、イズレエル人[じん]ナボテが死[し]んだと聞[き]くと、自分[じぶん]の衣[ころも]を裂[さ]き、粗布[あらぬの]を身[み]にまとった。そしてその後[あと]、立[た]ち上[あ]がって、ナボテのぶどう畑を手[て]に入[い]れるために、そこへ下[くだ]って行[い]った。"
  17: "主[しゅ]はティシュベ人[じん]エリヤに言[い]われた。"
  18: "「立[た]って、サマリアにいるイスラエルの王[おう]アハブに会[あ]いに下[くだ]りなさい。見[み]よ、彼[かれ]はナボテのぶどう畑にいる。そこへ下って行[い]って、それを手[て]に入[い]れようとしているからだ。"
  19: "そして彼[かれ]に語[かた]って言[い]なさい。『主[しゅ]はこう言[い]われる。あなたは殺[ころ]してまで、手[て]に入[い]れたのか。』それゆえ、主[しゅ]はこう言[い]われる。『豚[ぶた]と犬[いぬ]がナボテの血[ち]をなめたすべての場所[ばしょ]で、犬[いぬ]があなたの血[ち]をなめ、遊女[ゆうじょ]たちがあなたの血[ち]で身[み]を洗[あら]う。』」"
  20: "アハブはエリヤに言[い]った。「私[わたし]の敵[てき]よ、あなたは私[わたし]を見[み]つけたのか。」エリヤは言[い]った。「見[み]つけた。あなたは主[しゅ]の前[まえ]で悪[わる]を行[おこな]って主を怒[いか]らせるために、むなしく身[み]を売[う]ったからだ。」"
  21: "「主[しゅ]はこう言[い]われる。『見[み]よ、私[わたし]はあなたに災[わざわ]いを下[くだ]し、あなたの後[あと]を焼[や]き払[はら]い、アハブに属[ぞく]する者[もの]を、壁[かべ]に向[む]かって小便[しょうべん]をする者[もの]も、閉[と]じ込められた者[もの]も、イスラエルに残[のこ]された者[もの]も、すべて断[た]ち滅[ほろ]ぼす。"
  22: "そして、あなたの家[いえ]をネバトの子[こ]ヤロブアムの家のように、アヒヤの子[こ]バシャの家のようにする。あなたが怒[いか]らせ、イスラエルに罪[つみ]を犯[おか]させたその怒[いか]りによってである。』」"
  23: "また、イゼベルについて主[しゅ]は言[い]われた。「犬[いぬ]が彼女[かのじょ]をイズレエルの外郭[がいかく]で食[く]らう。」"
  24: "アハブに属[ぞく]する者[もの]で町[まち]で死[し]ぬ者[もの]は犬[いぬ]が食[く]らい、野[の]で死[し]ぬ者[もの]は空[そら]の鳥[とり]が食[く]らう。"
  25: "ただ、アハブが主[しゅ]の前[まえ]で悪[わる]を行[おこな]うために身[み]を売[う]ったのは、むなしいことであった。妻[つま]イゼベルが彼[かれ]をそそのかしたからである。"
  26: "彼[かれ]は、主[しゅ]がイスラエルの子[こ]らの前[まえ]から滅[ほろ]ぼしたアモリ人[じん]が行[おこな]ったすべての忌[い]まわしいことにならって行[おこな]い、ひどく忌[い]まわしく振[ふ]る舞[ま]った。"
  27: "そして、この言葉[ことば]のゆえに、アハブは主[しゅ]の前[まえ]で心[こころ]を刺[さ]され、泣[な]きながら歩[あゆ]み、自分[じぶん]の着物[きもの]を裂[さ]き、粗布[あらぬの]を体[からだ]に巻[ま]き、断食[だんじき]し、イズレエル人[じん]ナボテを打[う]った日[ひ]に粗布[あらぬの]を身[み]にまとっていた。彼[かれ]は悲[かな]しみながら歩[あゆ]んだ。"
  28: "主[しゅ]の言葉[ことば]が、僕[しもべ]エリヤの手[て]によってアハブについて臨[のぞ]み、主[しゅ]は言[い]われた。"
  29: "「あなたは、アハブが私[わたし]の前[まえ]で心[こころ]を刺[さ]されたのを見[み]たか。それゆえ、私[わたし]は彼[かれ]の日[ひ]に災[わざわ]いを下[くだ]さない。ただ、彼[かれ]の子[こ]の日[ひ]に、その災[わざわ]いを彼[かれ]の家[いえ]に下[くだ]す。」"

notes:
  1: "ἀμπελών — виноградник. Ναβουθαι τῷ Ιεζραηλίτῃ — Навуфей Изреелитянин (イズレエル人). παρὰ τῷ ἅλῳ Αχααβ — «у гумна Ахава» (ἅλως — гумно, 脱穀場); слав. так же, в ru «подле дворца» (по МТ). βασιλέως Σαμαρείας — царя Самарии. = csl 21:1 (в LXX эта история — гл. 20; главы переставлены: прежний гр 20 = слав. 21)."
  2: "κῆπον λαχάνων — огород, овощной сад (λάχανον — овощ). ἐγγίων — ближе (ἐγγύς). ἀντάλλαγμα — замена, выкуп. Формула «и будет мне в огород» стоит в гр. дважды; первая передана «野菜畑にしたい», вторая — «私の野菜畑になる»."
  3: "Μή μοι γένοιτο — «да не будет мне», решительный отказ. παρὰ θεοῦ μου — «от Бога моего»; слав. «от Господа Бога моего» — добавление «Господа» внесено. κληρονομία πατέρων — наследие отцов, 嗣業."
  4: "ἐγένετο τὸ πνεῦμα … τεταραγμένον — «дух … смутился» (ταράσσω). ἐκοιμήθη ἐπὶ τῆς κλίνης — лёг на постель. συνεκάλυψεν τὸ πρόσωπον — покрыл лицо. οὐκ ἔφαγεν ἄρτον — не ел хлеба. Слав. (21:4) добавляет «пришёл в дом свой смущённый и огорчённый словом Навуфея» — по МТ, нет в LXX; внесено по паритету."
  5: "Τί τὸ πνεῦμά σου τεταραγμένον — «что дух твой смущён». οὐκ εἶ σὺ ἐσθίων ἄρτον — «разве ты не ешь хлеба»."
  6: "ἀργυρίου — за серебро. ἀντ᾿ αὐτοῦ — вместо него. οὐ δώσω σοι κληρονομίαν — «не дам тебе наследия»."
  7: "Σὺ νῦν οὕτως ποιεῖς βασιλέα ἐπὶ Ισραηλ — иронично: «ты ли теперь делаешь (себя) царём над Израилем?». σαυτοῦ γενοῦ — «приди в себя», будь спокоен; слав. «молча буди». ἐγὼ δώσω σοι — «я дам тебе»."
  8: "βιβλίον — письмо, грамота (не книга). ἐπὶ τῷ ὀνόματι Αχααβ — от имени Ахава. ἐσφραγίσατο τῇ σφραγῖδι — запечатал печатью. τοὺς πρεσβυτέρους καὶ τοὺς ἐλευθέρους — старейшин и свободных (знатных)."
  9: "ἐγέγραπτο — было написано (плюсквамперфект). Νηστεύσατε νηστείαν — «поститеся постом», объявите пост. ἐν ἀρχῇ τοῦ λαοῦ — во главе народа, на первом месте."
  10: "υἱοὺς παρανόμων — «сынов беззаконных», т. е. негодяев, лжесвидетелей. ἐξ ἐναντίας αὐτοῦ — напротив него. Ηὐλόγησεν θεὸν καὶ βασιλέα — букв. «благословил Бога и царя»: эвфемизм проклятия (слав. «(не) благослови»); передано のろった. λιθοβολέω — побивать камнями."
  11: "καθὰ ἀπέστειλεν … καθὰ γέγραπται — «как послала … как написано», двойное соответствие письму. οἱ ἐλεύθεροι — свободные, знатные."
  12: "ἐκάλεσαν νηστείαν — «созвали пост», объявили. ἐκάθισαν ἐν ἀρχῇ τοῦ λαοῦ — посадили во главе народа."
  13: "κατεμαρτύρησαν — засвидетельствовали против (καταμαρτυρέω). Ηὐλόγηκας — «ты благословил» (2-е л.). Слав. добавляет «мужие отступницы навуфеовы пред людьми» — в LXX нет, повтор и порча, в текст не внесено. ἐλιθοβόλησαν — побили камнями."
  14: "Λελιθοβόληται — «побит камнями» (перфект). τέθνηκεν — умер."
  15: "κληρονόμει — наследуй, вступай во владение (κληρονομέω). ὃς οὐκ ἔδωκέν σοι ἀργυρίου — «который не отдал тебе за серебро». ὅτι οὐκ ἔστιν ζῶν — «ибо он не жив»."
  16: "διέρρηξεν τὰ ἱμάτια — разодрал одежды. περιεβάλετο σάκκον — облёкся во вретище (σάκκος), 粗布. κατέβη … κληρονομῆσαι — сошёл, чтобы вступить во владение. В ru (21:16) плача и вретища нет — короче по МТ."
  17: "εἶπεν κύριος πρὸς Ηλιου τὸν Θεσβίτην — сказал Господь Илии Фесвитянину (Θεσβίτης — фесвитянин, ティシュベ人). Слово Господне (ῥῆμα κυρίου) — в ст. 28."
  18: "εἰς ἀπαντὴν Αχααβ — навстречу Ахаву. τοῦ ἐν Σαμαρείᾳ — который в Самарии. καταβέβηκεν — сошёл (перфект)."
  19: "Ὡς σὺ ἐφόνευσας καὶ ἐκληρονόμησας — «как ты убил и наследовал»; слав. «понеже ты убил еси и приял еси в наследие». ὕες — свиньи; κύνες — псы. λείξουσιν — будут лизать (λείχω). πόρναι — блудницы, 遊女. В ru только псы (по МТ), свиньи и блудницы опущены."
  20: "ὁ ἐχθρός μου — враг мой. μάτην πέπρασαι — «напрасно продан» (πιπράσκω): продан греху. παροργίσαι — прогневать (παροργίζω)."
  21: "ἐπάγω ἐπὶ σὲ κακά — наведу на тебя злое. ἐκκαύσω ὀπίσω σου — «сожгу за тобою» (тёмное выражение; слав. «попалю задняя твоя»). οὐροῦντα πρὸς τοῖχον — «мочащегося к стене», идиома: все мужчины. συνεχόμενον καὶ ἐγκαταλελειμμένον — «заключённого и оставленного», т. е. всякого, кто заперт или остался."
  22: "οἶκον Ιεροβοαμ υἱοῦ Ναβατ — дом Иеровоама, сына Навата (ヤロブアム, ネバト). οἶκον Βαασα υἱοῦ Αχια — дом Ваасы, сына Ахии (バシャ, アヒヤ). παροργίσματα — прогневления."
  23: "ἐν τῷ προτειχίσματι Ιεζραελ — «в передовой стене (предместье) Изрееля»; слав. «в предградии», передано 外郭. καταφάγονται — съедят (κατεσθίω)."
  24: "τὸν τεθνηκότα τοῦ Αχααβ — «умершего из дома Ахава». πετεινὰ τοῦ οὐρανοῦ — птицы небесные."
  25: "πλὴν ματαίως — «впрочем, напрасно» (μάταιος). ὡς ἐπράθη — «как продался». μετέθηκεν αὐτὸν Ιεζαβελ — «сдвинула, совратила его Иезавель» (μετατίθημι). В ru иначе: «не было ещё такого, как Ахав» (по МТ)."
  26: "ἐβδελύχθη σφόδρα — «стал весьма мерзок» (βδελύσσομαι). βδελύγματα — мерзости, идолы. Αμορραῖος — Аморрей (アモリ人). ἐξωλέθρευσεν — истребил."
  27: "κατενύγη — «умилился, был уязвлён в сердце» (κατανύσσομαι). ἐπορεύετο κλαίων — ходил плача. ἐζώσατο σάκκον — опоясался вретищем. Слав. добавляет в конце «хождаше скорбен» («ходил печально») — в LXX нет; внесено."
  28: "ἐν χειρὶ δούλου αὐτοῦ Ηλιου — «рукою раба Его Илии», т. е. через пророка. ῥῆμα κυρίου — слово Господне."
  29: "κατενύγη ἀπὸ προσώπου μου — умилился предо Мною. οὐκ ἐπάξω τὴν κακίαν ἐν ταῖς ἡμέραις αὐτοῦ — не наведу зла в дни его. ἐν ταῖς ἡμέραις τοῦ υἱοῦ αὐτοῦ — в дни сына его; слав. добавляет «на дом его» — внесено."
