# jp-box, Иов, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23: ответ Иова Елифазу (2–17): желание найти Бога и изложить дело (2–7),
# Бог непостижим — идёт ли вперёд, назад, влево, вправо (8–9), Он испытывает, как
# золото (10–12), Его решение непреложно (13), трепет пред Ним (14–17).
# Голоса: ст. 1 — формула, повествование, вне кавычек; ст. 2–17 — речь Иова, одна
# цитата 「…」 от начала ст. 2 до конца ст. 17. Речь продолжается в гл. 24 (там она
# снова открыта в 24:1 и закрыта в 24:25) — кавычки сбалансированы внутри каждой главы.
# Красного и синего нет (Ветхий Завет).
# Нумерация по gr: 17 стихов; в csl-ru 17, но деление в конце иное (см. notes 14–15).
# ДЕФЕКТ МОДУЛЯ: в gr-lxx-byz ст. 14 стоит как «.» — текста нет. Ст. 14 переведён
# по csl-ru (единственный свидетель), без 〔…〕: «Сего ради о нем трепелен бых,
# наказуемь же попекохся о нем». Этот слав. ст. 14 перекрывает начало gr 23:15
# (διὰ τοῦτο ἐπ᾿ αὐτῷ ἐσπούδακα, νουθετούμενος δὲ ἐφρόντισα αὐτοῦ), а слав. 23:15
# = gr 23:15a. Gr 23:15 переведён полностью, как есть; перекрытие отмечено в notes.
# 〔…〕 нет; сносок ⟨…⟩ нет: 全能者, 主, よみ уже в корпусе. Имена — по греческому (LXX).

tr_code: jp-box
book: iov
chapter: 23
draft: true

verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「わたしは知[し]っている。わたしの訴[うった]えは自分[じぶん]の手[て]から出[で]ていること、そして、彼の手がわたしの嘆[なげ]きよりも重[おも]くのしかかっていることを。"
  3: "だれが知[し]るだろうか、わたしが彼を見[み]いだし、終[お]わりにまで至[いた]ることができるかを。"
  4: "わたしは自分[じぶん]の訴[うった]えを述[の]べ、口[くち]を責[せ]め言葉[ことば]で満[み]たす。"
  5: "彼がわたしに語[かた]る言葉[ことば]を知[し]り、わたしに告[つ]げることを悟[さと]りたい。"
  6: "たとえ彼が大[おお]きな力[ちから]をもってわたしに臨[のぞ]んでも、脅[おど]しをもってわたしを扱[あつか]うことはない。"
  7: "まことは彼から出[で]る。彼がわたしの裁[さば]きを最後[さいご]まで明[あき]らかにされるように。"
  8: "わたしが前[まえ]へ進[すす]んでも、そこに彼はいない。後[うし]ろに退[しりぞ]いても、わたしには分[わ]からない。"
  9: "彼が左[ひだり]で働[はたら]いても、わたしは捉[とら]えられない。右[みぎ]に回[まわ]られても、わたしは見[み]ない。"
  10: "彼はすでにわたしの道[みち]を知[し]っており、わたしを金[きん]のように試[ため]した。"
  11: "わたしは彼の戒[いまし]めのうちを歩[あゆ]む。わたしは彼の道[みち]を守[まも]り、それることはない。"
  12: "わたしは彼の戒[いまし]めから離[はな]れず、その言葉[ことば]をふところに隠[かく]した。"
  13: "しかし、もし彼がそう定[さだ]めたのなら、だれが彼に逆[さか]らって言[い]えようか。彼が望[のぞ]んだことを、彼は行[おこな]ったのだ。"
  14: "それゆえ、わたしは彼のゆえにおののいた。懲[こ]らしめを受[う]けながら、わたしは彼のことを思[おも]った。"
  15: "だから、わたしは彼のもとへ急[いそ]いだ。戒[いまし]められながら、わたしは彼のことを気[き]にかけた。それゆえ、わたしは彼の顔[かお]の前[まえ]で慌[あわ]てふためき、思[おも]い巡[めぐ]らして、彼を恐[おそ]れるであろう。"
  16: "主[しゅ]はわたしの心[こころ]を弱[よわ]らせ、全能者[ぜんのうしゃ]はわたしを恐[おそ]れさせた。"
  17: "わたしは、自分[じぶん]のもとに闇[やみ]が来[く]ることを知[し]らなかった。彼はわたしの顔[かお]の前[まえ]に暗黒[あんこく]を覆[おお]われた。」"

notes:
  1: "Ὑπολαβὼν δὲ Ιωβ λέγει — вводная формула, повествование, вне кавычек; слав. «Отвещав же иов, рече». Речь Иова — ст. 2–17, одна цитата; продолжается в гл. 24 (24:1–25), поэтому здесь кавычка закрыта в конце ст. 17."
  2: "Καὶ δὴ οἶδα — «и вот я знаю» (καί δή — усилительное). ὅτι ἐκ χειρός μου ἡ ἔλεγξίς ἐστιν — «что из руки моей обличение моё» (ἔλεγξις — обличение, тяжба): тёмное место, буквально, без сглаживания; слав. «вем убо, яко из руки моея обличение мое есть». ἡ χεὶρ αὐτοῦ βαρεῖα γέγονεν ἐπ᾿ ἐμῷ στεναγμῷ — «рука Его стала тяжела сверх воздыхания моего» (βαρύς — тяжёлый; στεναγμός — стон). В МТ и ru здесь иное («горька речь моя»), не внесено. Говорящий: Иов."
  3: "τίς δ᾿ ἄρα γνοίη — «кто же узнал бы» (ἄρα — выражает недоумение). ὅτι εὕροιμι αὐτὸν — «что я найду Его» (εὑρίσκω). ἔλθοιμι εἰς τέλος — «и приду к концу», т. е. достигну конца дела (слав. «прииду ко кончине»). Форма желания-вопроса сохранена. В ru и МТ здесь прямое желание («О, если бы я знал, где найти Его, и мог подойти к престолу Его») — иное чтение, не внесено. Говорящий: Иов."
  4: "εἴποιμι δὲ ἐμαυτοῦ κρίμα — «я изложил бы своё дело (суд)» (κρίμα — суд, дело). τὸ δὲ στόμα μου ἐμπλήσαιμι ἐλέγχων — «и уста мои наполнил бы обличениями» (ἐμπίπλημι; ἔλεγχος — обличение); слав. «и реку мой суд, уста же моя исполню обличения». Говорящий: Иов."
  5: "γνῴην δὲ ῥήματα, ἅ μοι ἐρεῖ — «и узнал бы слова, которые Он мне скажет» (ῥῆμα — слово). αἰσθοίμην δὲ τίνα μοι ἀπαγγελεῖ — «и понял бы, что Он мне возвестит» (αἰσθάνομαι — чувствовать, понимать). Слав. вместо «слова» читает «изцеления» («уразумею же изцеления, яже ми речет»); это расходится и с LXX, и с контекстом, поэтому в тексте LXX (言葉), слав. отмечено здесь. Говорящий: Иов."
  6: "καὶ εἰ ἐν πολλῇ ἰσχύι ἐπελεύσεταί μοι — «и если с великою силою на меня найдёт» (ἰσχύς — сила). εἶτα ἐν ἀπειλῇ μοι οὐ χρήσεται — «то угрозой против меня не воспользуется» (ἀπειλή — угроза; χράομαι — пользоваться); слав. «посем же не воспретит ми». Говорящий: Иов."
  7: "ἀλήθεια γὰρ καὶ ἔλεγχος παρ᾿ αὐτοῦ — «ибо истина и обличение от Него» (ἀλήθεια — истина). ἐξαγάγοι δὲ εἰς τέλος τὸ κρίμα μου — «да изведёт Он вконец суд мой» (ἐξάγω — выводить); слав. «да изведет же в конец суд мой». Говорящий: Иов."
  8: "εἰς γὰρ πρῶτα πορεύσομαι καὶ οὐκέτι εἰμί — «ибо пойду в первые (вперёд) — и меня уже нет»: буквально, тёмное место (слав. «ктому несмь»); смысл — иду вперёд, а Его нет, поэтому передано そこに彼はいない. τὰ δὲ ἐπ᾿ ἐσχάτοις τί οἶδα — «а о последнем что я знаю»; слав. «в последних же, како вем его». Говорящий: Иов."
  9: "ἀριστερὰ ποιήσαντος αὐτοῦ καὶ οὐ κατέσχον — «когда Он делает левое, я не удержал», т. е. не постиг (κατέχω — удерживать, постигать; слав. «не разумех»). περιβαλεῖ δεξιά, καὶ οὐκ ὄψομαι — «обойдёт (обступит) справа, и я не увижу» (περιβάλλω); слав. «обложит одесную, и не узрю». Говорящий: Иов."
  10: "οἶδεν γὰρ ἤδη ὁδόν μου — «ибо Он уже знает путь мой» (ἤδη — уже). διέκρινεν δέ με ὥσπερ τὸ χρυσίον — «и испытал (рассудил) меня, как золото» (διακρίνω — разбирать, испытывать; χρυσίον — золото); слав. «искуси же мя яко злато». Образ плавки сохранён. Говорящий: Иов."
  11: "ἐξελεύσομαι δὲ ἐν ἐντάλμασιν αὐτοῦ — «выйду же в заповедях Его», т. е. буду идти в них (ἔνταλμα — заповедь, повеление). ὁδοὺς γὰρ αὐτοῦ ἐφύλαξα καὶ οὐ μὴ ἐκκλίνω — «ибо пути Его я сохранил и не уклонюсь» (ἐκκλίνω — уклоняться); слав. «изыду же в заповедех его… и не уклонюся от заповедий его» (слав. добавляет «от заповедий его» — это уже ст. 12). Говорящий: Иов."
  12: "ἀπὸ ἐνταλμάτων αὐτοῦ καὶ οὐ μὴ παρέλθω — «от заповедей Его и не преступлю» (παρέρχομαι — проходить мимо, преступать). ἐν δὲ κόλπῳ μου ἔκρυψα ῥήματα αὐτοῦ — «в недрах (в пазухе) моих сокрыл слова Его» (κόλπος — недра, пазуха); слав. «в недрех же моих сокрых глаголы его». Говорящий: Иов."
  13: "εἰ δὲ καὶ αὐτὸς ἔκρινεν οὕτως — «если же и Он так рассудил» (κρίνω). τίς ἐστιν ὁ ἀντειπὼν αὐτῷ — «кто есть противоречивший Ему» (ἀντιλέγω). ὃ γὰρ αὐτὸς ἠθέλησεν, καὶ ἐποίησεν — «ибо что Он захотел, то и сделал»; слав. «сам бо восхоте и сотвори». Говорящий: Иов."
  14: "В gr-lxx-byz на месте этого стиха стоит «.» — дефект модуля, текста нет. Переведено по csl-ru (единственный свидетель, церковное чтение): «Сего ради о нем трепелен бых, наказуемь же попекохся о нем» — то есть «потому я трепетал пред Ним, и, будучи наказываем (вразумляем), заботился о Нём» (трепетать — τρέμω; наказывать, вразумлять — νουθετέω). Без 〔…〕, по общему правилу о лакунах модуля. ВАЖНО: этот слав. стих по содержанию совпадает с началом gr 23:15 (διὰ τοῦτο ἐπ᾿ αὐτῷ ἐσπούδακα, νουθετούμενος δὲ ἐφρόντισα αὐτοῦ), поэтому текст ст. 14 и ст. 15 частично перекрывается — так и должно быть по указанию партии: 14 по csl, 15 по gr полностью. Говорящий: Иов."
  15: "В gr-lxx-byz стих содержит и основной текст, и подстих 15a: διὰ τοῦτο ἐπ᾿ αὐτῷ ἐσπούδακα, νουθετούμενος δὲ ἐφρόντισα αὐτοῦ (это и есть содержание слав. 23:14, отсюда перекрытие со ст. 14) и ἐπὶ τούτῳ ἀπὸ προσώπου αὐτοῦ κατασπουδασθῶ, κατανοήσω καὶ πτοηθήσομαι ἐξ αὐτοῦ (= слав. 23:15 «сего ради от лица его потщуся, поучуся и убоюся от него»). ἐσπούδακα — «поспешил, постарался» (σπεύδω); κατασπουδασθῶ — «приду в смятение, в страх» (κατασπουδάζω); κατανοήσω — «вникну, усмотрю» (κατανοέω); πτοηθήσομαι — «устрашусь» (πτοέω). Переведено полностью, как есть; метка подстиха 15a не выводится. Говорящий: Иов."
  16: "κύριος δὲ ἐμαλάκυνεν τὴν καρδίαν μου — «Господь же умягчил (ослабил) сердце моё» (μαλακύνω — смягчать, расслаблять). ὁ δὲ παντοκράτωρ ἐσπούδασέν με — «и Вседержитель устремился на меня» (σπεύδω с винительным — устремляться на); слав. «и вседержитель потщася о мне» — понято иначе («позаботился обо мне»), но это противоречит контексту страха, поэтому в тексте LXX (恐れさせた), слав. отмечено здесь. Говорящий: Иов."
  17: "οὐ γὰρ ᾔδειν ὅτι ἐπελεύσεταί μοι σκότος — «ибо я не знал, что найдёт на меня тьма» (σκότος). πρὸ προσώπου δέ μου ἐκάλυψεν γνόφος — «и предо мною покрыл мрак» (γνόφος — мрак, туман); слав. «не ведех бо, яко найдет на мя тма, пред лицем же моим покрыет мрак». Закрывающая кавычка — конец главы; речь продолжается в гл. 24. Говорящий: Иов."
