# jp-box, Екклесиаст, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация LXX: глава 7 = 29 стихов (7:1–14 — «лучше…», параллелизм сохранён дословно;
# 7:15–22 — о праведнике и грешнике; 7:23–29 — испытание мудрости, женщина и итог о творении).
# Красного и синего нет: речь Екклесиаста — от первого лица, без кавычек; чужая речь и его
# собственные слова о себе — в 「…」/「…」 (7:10, 7:23).
# 〔…〕 нет: все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 嗣業, 銀, 奴隷, 罠 уже в корпусе или понятны.
# Дефект модуля csl-ru: вся глава сдвинута на один стих (слав. 7:2 = греч. 7:1, слав. 7:30 =
# греч. 7:29); перевод и notes — по греческой нумерации.
# 7:26–29 не сглаживаются: слова о женщине — наблюдение Екклесиаста в ряду испытаний,
# а 7:29 даёт итог: Бог сотворил человека правым.
# jp-ni не использовался.

tr_code: jp-box
book: ekl
chapter: 7
draft: true

verses:
  1: "良[よ]い名[な]は良[よ]い油[あぶら]にまさり、死[し]の日[ひ]は生[う]まれた日[ひ]にまさる。"
  2: "悲[かな]しみの家[いえ]へ行[い]くほうが、酒宴[しゅえん]の家[いえ]へ行[い]くより良[よ]い。そこがすべての人[ひと]の終[お]わりだからである。生[い]きている者[もの]は、それを心[こころ]に留[と]める。"
  3: "怒[いか]りは笑[わら]いより良[よ]い。顔[かお]が曇[くも]るとき、心[こころ]は良[よ]くなるからである。"
  4: "知恵[ちえ]ある者[もの]の心[こころ]は悲[かな]しみの家[いえ]にあり、愚[おろ]かな者[もの]の心[こころ]は喜[よろこ]びの家[いえ]にある。"
  5: "知恵[ちえ]ある者[もの]の戒[いまし]めを聞[き]くほうが、愚[おろ]かな者[もの]の歌[うた]を聞[き]くより良[よ]い。"
  6: "茨[いばら]が鍋[なべ]の下[した]でぱちぱちと鳴[な]るようなもの、それが愚[おろ]かな者[もの]の笑[わら]いである。これもまた空[むな]しい。"
  7: "虐[しいた]げは知恵[ちえ]ある者[もの]を惑[まど]わせ、その心[こころ]の強[つよ]さを滅[ほろ]ぼす。"
  8: "言葉[ことば]の終[お]わりは、その始[はじ]めより良[よ]い。気[き]の長[なが]い者[もの]は、霊[れい]の高[たか]ぶった者[もの]より良[よ]い。"
  9: "心[こころ]を急[いそ]がせて怒[いか]ってはならない。怒[いか]りは愚[おろ]かな者[もの]の胸[むね]に宿[やど]るからである。"
  10: "「なぜ、昔[むかし]の日[ひ]々[び]は今[いま]よりも良[よ]かったのか」と言[い]ってはならない。それを問[と]うのは知恵[ちえ]によることではないからである。"
  11: "知恵[ちえ]は嗣業[しぎょう]とともに良[よ]い。太陽[たいよう]を見[み]る者[もの]たちにとっては、なおさらである。"
  12: "知恵[ちえ]はその陰[かげ]において、銀[ぎん]の陰[かげ]のようである。しかし知識[ちしき]の益[えき]は、知恵[ちえ]がそれを持[も]つ者[もの]を生[い]かすことにある。"
  13: "神[かみ]の業[わざ]を見[み]よ。神[かみ]が曲[ま]げられたものを、誰[だれ]がまっすぐにできるだろうか。"
  14: "良[よ]い日[ひ]には善[よ]いことのうちに生[い]き、悪[わる]い日[ひ]には見[み]よ。神[かみ]はこの両方[りょうほう]を、互[たが]いに対[たい]になるように造[つく]られた。人[ひと]が自分[じぶん]の後[あと]に何[なに]も見[み]いだせないためである。"
  15: "わたしは空[むな]しい日[ひ]々[び]のうちに、すべてのことを見[み]た。自[みずか]らの正[ただ]しさのうちに滅[ほろ]びる正[ただ]しい者[もの]があり、自[みずか]らの悪[あく]のうちに長[なが]らえる不敬虔[ふけいけん]な者[もの]がいる。"
  16: "あまりに正[ただ]しくなりすぎてはならない。あまりに知恵[ちえ]を尽[つ]くしてはならない。あなたが打[う]ちのめされることのないように。"
  17: "あまりに不敬虔[ふけいけん]になってはならない。頑[かたくな]になってはならない。時[とき]でないときに死[し]ぬことのないように。"
  18: "これに堅[かた]くすがるのは良[よ]い。しかも、あれから手[て]を引[ひ]いてはならない。神[かみ]を畏[おそ]れる者[もの]は、すべてのことを免[まぬか]れるからである。"
  19: "知恵[ちえ]は、町[まち]にいる十人[じゅうにん]の支配者[しはいしゃ]よりも、知恵[ちえ]ある者[もの]を強[つよ]く助[たす]ける。"
  20: "地[ち]の上[うえ]に、善[よ]いことを行[おこな]って罪[つみ]を犯[おか]さない正[ただ]しい人[ひと]は一人[ひとり]もいないからである。"
  21: "人[ひと]が語[かた]るすべての言葉[ことば]に、心[こころ]を置[お]いてはならない。あなたの奴隷[どれい]があなたを呪[のろ]うのを聞[き]かないためである。"
  22: "人[ひと]は幾度[いくど]もあなたに悪[わる]いことをし、多[おお]くの思[おも]いによってあなたの心[こころ]を苦[くる]しめる。あなた自身[じしん]もまた、ほかの者[もの]を呪[のろ]ったのだから。"
  23: "わたしはこれらすべてを知恵[ちえ]によって試[ため]した。わたしは「知恵[ちえ]深[ふか]くなろう」と言[い]った。"
  24: "しかし知恵[ちえ]は、もとあったよりもはるか遠[とお]く、わたしから離[はな]れて行[い]った。深[ふか]い深淵[しんえん]である。誰[だれ]がそれを見[み]いだせるだろうか。"
  25: "わたしは心[こころ]を巡[めぐ]らし、知[し]ろうとし、見極[みきわ]めようとし、知恵[ちえ]と理[ことわり]を求[もと]め、不敬虔[ふけいけん]の愚[おろ]かさと、頑[かたくな]なことと、迷[まよ]いを知[し]ろうとした。"
  26: "わたしは、死[し]よりも苦[にが]いものを見[み]いだした。それは女[おんな]である。その心[こころ]は罠[わな]と網[あみ]、その手[て]は鎖[くさり]である。神[かみ]の前[まえ]で善[よ]い者[もの]は彼女[かのじょ]から救[すく]い出[だ]され、罪[つみ]を犯[おか]す者[もの]は彼女[かのじょ]に捕[つか]まえられる。"
  27: "見[み]よ、わたしはこれを見[み]いだした、とコヘレトは言[い]った。一[ひと]つ一[ひと]つ数[かぞ]えて、思[おも]いを巡[めぐ]らしながら。"
  28: "わたしの魂[たましい]がなおも求[もと]めたが、見[み]いだせなかったものがある。わたしは千人[せんにん]のうち一人[ひとり]の人[ひと]を見[み]いだしたが、そのすべてのうちに女[おんな]を一人[ひとり]も見[み]いだせなかった。"
  29: "ただし、わたしはこれを見[み]いだした。神[かみ]は人[ひと]を正[ただ]しい者[もの]として造[つく]られた。しかし人[ひと]々[びと]は多[おお]くの思[おも]いを求[もと]めたのである。"

notes:
  1: "ἔλαιον — «елей, оливковое масло» (слав. «елей благ»). День смерти лучше дня рождения, ср. 4:2. В модуле csl-ru глава 7 сдвинута на стих: слав. 7:2 = греч. 7:1, и так до слав. 7:30 = греч. 7:29."
  2: "οἶκος πένθους — «дом плача»; πότος — «пир, попойка». καθότι τοῦτο τέλος παντὸς τοῦ ἀνθρώπου — «ибо это конец всякого человека». ὁ ζῶν δώσει εἰς καρδίαν αὐτοῦ — «живой положит в сердце своё»."
  3: "θυμός — «гнев, печаль»; γέλως — «смех». ἐν κακίᾳ προσώπου — «при худом (печальном) лице» (слав. «во злобе лица»). ἀγαθυνθήσεται — «станет добрым»."
  4: "καρδία σοφῶν ἐν οἴκῳ πένθους — параллелизм с 7:2–3 сохранён дословно. εὐφροσύνη — 喜び, веселье."
  5: "ἐπιτίμησις — «обличение, укор» (слав. «прещение»); ᾆσμα — «песнь». Конструкция: «лучше слышать… чем человека, слушающего…»."
  6: "ὡς φωνὴ τῶν ἀκανθῶν ὑπὸ τὸν λέβητα — «как звук терния под котлом»: хворост трещит и сгорает. λέβης — «котёл». γέλως — «смех»."
  7: "συκοφαντία — «притеснение, клевета»; περιφέρει — «кружит, сбивает с пути»; εὐτονία — «твёрдость, сила» (слав. «благородствие»). Синодальный «подарки портят сердце» — с масоретского, в LXX иначе."
  8: "ἐσχάτη λόγων ὑπὲρ ἀρχὴν αὐτοῦ — «конец слов лучше начала его». μακρόθυμος — «долготерпеливый»; ὑψηλὸν πνεύματι — «высокого духом», т.е. надменного."
  9: "μὴ σπεύσῃς ἐν πνεύματί σου τοῦ θυμοῦσθαι — «не спеши духом гневаться». ἐν κόλπῳ — «в недре, на груди»; ἀναπαύσεται — «почиет, гнездится»."
  10: "Τί ἐγένετο ὅτι… — «почему это…»; вопрос чужой, поэтому 「…」. οὐκ ἐν σοφίᾳ ἐπηρώτησας — «не по мудрости ты спросил»."
  11: "κληροδοσία — «наследство, удел» (嗣業; слово уже в корпусе — 1 Пет 1:4, Деян 7:5). περισσεία — «преимущество»; θεωροῦσιν τὸν ἥλιον — «видящие солнце», т.е. живые."
  12: "ἐν σκιᾷ αὐτῆς ἡ σοφία ὡς σκιὰ τοῦ ἀργυρίου — «под сенью её мудрость, как сень серебра» (слав. «в сени его мудрость, якоже сень сребра»). ζωοποιήσει — «оживит»; περισσεία γνώσεως — «преимущество знания»."
  13: "ἰδὲ τὰ ποιήματα τοῦ θεοῦ — «смотри на дела Божии». κοσμῆσαι — «привести в порядок, выпрямить» (слав. «украсити»); διαστρέψῃ — «извратит, искривит»; ср. 1:15."
  14: "ἐν ἡμέρᾳ ἀγαθωσύνης — «в день блага»; ἐν ἡμέρᾳ κακίας ἰδέ — «в день зла смотри». σὺν τοῦτο σύμφωνον τούτῳ — «и это согласно с этим»; περὶ λαλιᾶς — «о речи» (слав. «о глаголании»). ὀπίσω αὐτοῦ — «после него»."
  15: "Σὺν τὰ πάντα — «всё вместе». δίκαιος ἀπολλύμενος ἐν δικαίῳ αὐτοῦ — «праведник, погибающий в правде своей»; ἀσεβὴς μένων ἐν κακίᾳ — «нечестивый, пребывающий во зле». Синодальный «живет долго» — толкование."
  16: "μὴ γίνου δίκαιος πολύ — «не будь слишком праведен»; μὴ σοφίζου περισσά — «не мудрствуй чрезмерно». ἐκπλαγῇς — «будешь поражён, ошеломлён»; Синодальный «зачем тебе губить себя» — толковательное расширение."
  17: "μὴ ἀσεβήσῃς πολύ — «не нечествуй много»; σκληρός — «жёсткий, упрямый»; ἐν οὐ καιρῷ σου — «не в своё время»."
  18: "ἀντέχεσθαι — «держаться»; ἀπὸ τούτου μὴ ἀνῇς τὴν χεῖρα — «от того не отпускай руки». ἐξελεύσεται τὰ πάντα — «выйдет из всего», т.е. избежит (слав. «поспешатся вся»). «Это» и «то» — два совета 7:16–17, держаться нужно обоих."
  19: "βοηθήσει — «поможет»; ὑπὲρ δέκα ἐξουσιάζοντας — «более десяти властвующих»; τοὺς ὄντας ἐν τῇ πόλει — «тех, кто в городе»."
  20: "ἄνθρωπος οὐκ ἔστιν δίκαιος ἐν τῇ γῇ — «нет человека праведного на земле»; ср. 3 Цар 8:46; Рим 3:10. ἁμαρτήσεται — «согрешит»."
  21: "μὴ θῇς καρδίαν σου — «не полагай сердца», т.е. не принимай близко к сердцу. καταρωμένου — «проклинающего»; δοῦλος — 奴隷, раб."
  22: "πλειστάκις πονηρεύσεταί σε — «весьма часто будет лукавить против тебя»; καθόδους πολλάς — «многими оборотами»; κατηράσω ἑτέρους — «проклял других» (слав. «якоже и ты клял еси иныя»)."
  23: "ἐπείρασα — «испытал»; Σοφισθήσομαι — «стану мудрым»; слова о себе — в 「…」, как 1:16. Продолжение — в 7:24 («и она удалилась»)."
  24: "μακρὰν ὑπὲρ ὃ ἦν — «далеко сверх того, чем была»; βαθὺ βάθος — «глубокая глубина» (слав. «бездны глубина»); αὐτό — «это» (ср. род)."
  25: "ἐκύκλωσα — «обошёл кругом», т.е. обратился всем сердцем; ψῆφος — «камешек для счёта, число, разум» (слав. «разум»); σκληρία — «жёсткость»; περιφορά — «кружение, блуждание»."
  26: "πικρότερον ὑπὲρ θάνατον — «горче смерти»; θηρεύματα — «тенёта, ловы»; σαγῆναι — «сети»; δεσμοί — «узы». ἐξαιρεθήσεται — «будет изъят»; συλλημφθήσεται — «будет пойман». Это наблюдение Екклесиаста в ряду испытаний (7:23–29), а не оценка женщины как творения: в 7:29 он говорит, что Бог сотворил человека правым. Ср. Притч 5:3–5; 7:21–23. Не сглаживаю."
  27: "μία τῇ μιᾷ — «одно к одному», т.е. перебирая по одному; τοῦ εὑρεῖν λογισμόν — «чтобы найти рассуждение» (слав. «еже обрести помысл»). εἶπεν ὁ Ἐκκλησιαστής — «сказал Екклесиаст»; コヘレト пояснён в 1:1."
  28: "ὃν ἔτι ἐζήτησεν ἡ ψυχή μου — «которого ещё искала душа моя» (ὅν — муж. род). ἄνθρωπον ἕνα ἀπὸ χιλίων — «одного человека из тысячи»; γυναῖκα… οὐχ εὗρον — «женщины… не нашёл». Речь о личном опыте Екклесиаста, не о природе женщины; итог — в 7:29."
  29: "πλὴν ἰδὲ τοῦτο εὗρον — «но вот что я нашёл». σὺν τὸν ἄνθρωπον εὐθῆ — «и человека прямым» (слав. «праваго»); ἐζήτησαν λογισμοὺς πολλούς — «взыскали помыслов многих». Итог книги о творении: зло не в природе человека, а в его помыслах."
