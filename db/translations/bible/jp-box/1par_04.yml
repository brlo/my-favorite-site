# jp-box, 1-я Паралипоменон, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй свидетель
# церковного текста: слав. чтения и добавки входят в основной текст без 〔…〕,
# вариант LXX — в notes. ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: сыны Иуды (1–8); Иавис и его молитва (9–10); Халев, сын Асхи,
# и род Ештона (11–12); Кеназ, Халев сын Иефоннии (13–16); род Езры (17–20);
# сыны Шило и гончары (21–23); сыны Симеона и их города (24–33); князья
# Симеона (34–38); расселение до Герара (39–40) и на Сеир (41–43).
# Имена: где лицо или место есть в Быт 46, Нав 15, Числ 26, 1–4 Цар, взята форма
# корпуса (ペレツ, アスロン, ハルミ, エフンネ, カレブ, ゴトニエル, アクサ,
# ベエル・シェバ, モラダ, エルマ, ツィクラグ, ナムエル, ザラ); остальные
# транслитерированы с греческого 1 Пар. Расхождения с csl/Синод. — в notes.
# В греч. тексте ст. 18 и 35 часть слов стоит в квадратных скобках издания
# ([αὕτη Αδια], [καὶ οὗτος υἱὸς Ισαβια]) — переведены без скобок, отмечено в notes.
# Речи: слова матери Иависа (9) и молитва самого Иависа (10) — 「…」; красного нет.
# 〔…〕 нет: в gr-lxx-byz на месте всех стихов есть текст.
# Сносок ⟨…⟩ нет: 陶工, 牧場, 聖絶, つかさ уже в корпусе.
# jp-ni не использовался.

