verses:
  1: "ユダの子[こ]らは、ペレツ、アスロン、ハルミ、オル、ショバルである。"
  2: "ショバルの子[こ]ラヤ。ショバルはヤハトを生[う]み、ヤハトはアヒムとラハドを生[う]んだ。これらはサラタ人[じん]の系譜[けいふ]である。"
  3: "エタムの子[こ]らは、イズレエル、イシュマ、イドバシュ。彼[かれ]らの姉妹[しまい]の名[な]はハツレルポニであった。"
  4: "ペヌエルはゲドルの父[ちち]、エゼルはフシャの父[ちち]である。これらはエフラタの長子[ちょうし]オルの子[こ]ら、ベツレヘムの父[ちち]である。"
  5: "テコアの父[ちち]アシュフルには、二人[ふたり]の妻[つま]があった。アオダとトアダである。"
  6: "アオダは彼[かれ]にアハザム、ヘフェル、テムニ、アハシュタリを産[う]んだ。これらはアオダの子[こ]らである。"
  7: "トアダの子[こ]らは、サレト、サアル、エトナンである。"
  8: "コツはエノブとサビバを生[う]み、またイアリムの子[こ]レカブの兄弟[きょうだい]の諸氏族[しょしぞく]を生[う]んだ。"
  9: "ヤベツはその兄弟[きょうだい]たちよりも尊[とうと]ばれた。母[はは]は彼[かれ]の名[な]をヤベツと名[な]づけて言[い]った。「わたしは苦[くる]しみのうちに彼を産[う]んだ。」"
  10: "ヤベツはイスラエルの神[かみ]を呼[よ]び求[もと]めて言[い]った。「どうか、あなたがわたしを祝福[しゅくふく]して祝福し、わたしの境[さかい]を広[ひろ]げ、あなたの手[て]がわたしとともにあって、わたしを卑[ひく]しめないように、わたしに悟[さと]りを与[あた]えてください。」神は彼[かれ]が願[ねが]ったすべてのことをかなえられた。"
  11: "アシュハの父[ちち]カレブはマキルを生[う]んだ。マキルはエシュトンの父[ちち]である。"
  12: "エシュトンはベト・ラファ、パセアハ、ナハシュの町[まち]の父[ちち]タナを生[う]んだ。これらはレハの人[ひと]々[びと]である。"
  13: "ケナズの子[こ]らは、ゴトニエルとセラヤ。ゴトニエルの子[こ]らは、ハタトである。"
  14: "マナティはゴフェラを生[う]み、セラヤはヨアブを生[う]んだ。ヨアブは職人[しょくにん]の谷[たに]の父[ちち]である。彼[かれ]らは職人であったからである。"
  15: "エフンネの子[こ]カレブの子[こ]らは、イル、エラ、ナアム。エラの子[こ]らは、ケナズである。"
  16: "その子[こ]はゲセエル、アミアヒ、ザファ、ザイラ、エセラエルである。"
  17: "エスリの子[こ]らは、イェテル、モラド、アフェル、ヤロン。イェテルはマロン、シェマイ、およびエシュテモンの父[ちち]マレトを生[う]んだ。"
  18: "彼[かれ]の妻[つま]アディアは、ゲドルの父[ちち]ヤレド、ソコの父[ちち]アベル、ザノアの父[ちち]イェクティエルを産[う]んだ。これらはモレドがめとったファラオの娘[むすめ]ベテヤの子[こ]らである。"
  19: "ユディヤの子[こ]らは、ナヘムの姉妹[しまい]による者[もの]である。ケイラの父[ちち]ダリヤ、ヨマンの父[ちち]シメオン。またケイラの父[ちち]ナヘムの子[こ]らは、アガルミと、マアハ人[じん]エシュテモアである。"
  20: "シメオンの子[こ]らは、アムノン、ラナ、アナンの子[こ]、ティロン。イシャイの子[こ]らは、ゾハトとその子[こ]らである。"
  21: "ユダの子[こ]セロムの子[こ]らは、レハの父[ちち]エル、マレシャの父[ちち]ラアダ、およびアシュベアの家[いえ]の亜麻布[あまぬの]織[お]りの家系[かけい]である。"
  22: "またヨアキム、コゼバの人[ひと]々[びと]、ヨアシュ、サラフ。彼[かれ]らはモアブに住[す]んだ者[もの]たちで、アベディルが彼らをアトキムに帰[かえ]した。"
  23: "彼[かれ]らは陶工[とうこう]で、ナタイムとガデラに住[す]み、王[おう]のもとでその王国[おうこく]のために務[つと]めを果[は]たし、そこに住んだ。"
  24: "シメオンの子[こ]らは、ナムエル、ヤミン、ヤリブ、ザラ、サウル。"
  25: "その子[こ]サレム、その子[こ]マバサム、その子[こ]マスマ、"
  26: "その子[こ]アムエル、その子[こ]サブド、その子[こ]ザクル、その子[こ]シェメイ。"
  27: "シェメイには十六人[じゅうろくにん]の子[こ]らと三人[さんにん]の娘[むすめ]があった。しかしその兄弟[きょうだい]たちには子[こ]らが多[おお]くなかった。その氏族[しぞく]はすべて、ユダの子[こ]らのように増[ふ]えなかった。"
  28: "彼[かれ]らはベエル・シェバ、サマ、モラダ、エセル・スアルに住[す]んだ。"
  29: "バラア、ボアソム、トラド、"
  30: "バトエル、エルマ、ツィクラグ、"
  31: "ベト・マルカボト、ハツァル・スシムの半分[はんぶん]、ベト・ビリ、シャアライム。これらはダビデが王[おう]となるまでの彼[かれ]らの町々[まちまち]である。"
  32: "彼[かれ]らの村[むら]々[むら]は、エタム、アイン、リモン、トケン、アシャン、五[いつ]つの町[まち]である。"
  33: "また彼[かれ]らのすべての村[むら]々[むら]は、これらの町々[まちまち]の周[まわ]りに、バアルに至[いた]るまであった。これが彼[かれ]らの所有地[しょゆうち]とその系図[けいず]である。"
  34: "またメショバブ、ヤムレク、ヨシヤ、アマツヤの子[こ]、"
  35: "ヨエル、およびヨシビヤの子[こ]、セラヤの子[こ]、アシエルの子[こ]、"
  36: "エリオエナイ、ヤコバ、イェショハヤ、アサヤ、アディエル、イェシミエル、ベナヤ、"
  37: "およびシフィの子[こ]、アロンの子[こ]、エダヤの子[こ]、シムリの子[こ]、シェマヤの子[こ]であるズザ。"
  38: "これらは、その氏族[しぞく]において名[な]を挙[あ]げられたつかさたちである。彼[かれ]らの父[ちち]の家[いえ]はおびただしく増[ふ]えた。"
  39: "彼[かれ]らはゲラルに至[いた]り、東[ひがし]の谷[たに]の入口[いりぐち]まで行[い]って、家畜[かちく]の牧場[ぼくじょう]を求[もと]めた。"
  40: "彼[かれ]らは肥[こ]えた良[よ]い牧場[ぼくじょう]を見[み]つけた。その地[ち]は広[ひろ]く、平穏[へいおん]で安[やす]らかであった。以前[いぜん]そこに住[す]んでいたのはハムの子[こ]らであったからである。"
  41: "これらの者[もの]たちは、ユダの王[おう]エゼキヤの日[ひ]に名[な]を記[しる]された者たちで、彼[かれ]らの家[いえ]々[いえ]と、そこに見[み]つけたミナイ人[じん]を打[う]ち、今日[きょう]に至[いた]るまで彼らを聖絶[せいぜつ]して、彼らの代[か]わりに住[す]んだ。彼らの家畜[かちく]の牧場[ぼくじょう]がそこにあったからである。"
  42: "また彼[かれ]らの中[なか]から、シメオンの子[こ]らのうち五百人[ごひゃくにん]が、イシャイの子[こ]らである指導者[しどうしゃ]ペラテヤ、ノアデヤ、ラファヤ、ウジエルとともに、セイルの山[やま]へ行[い]った。"
  43: "彼[かれ]らはアマレクの残[のこ]りの者[もの]を打[う]ち、今日[きょう]に至[と]るまでそこに住[す]んでいる。"

notes:
  1: "Καὶ υἱοὶ Ιουδα· Φαρες, Αρσων καὶ Χαρμι καὶ Ωρ, Σουβαλ — ペレツ、アスロン、ハルミ、オル、ショバル. Греч. Φαρες, Αρσων (слав. «фарес, есром»); формы корпуса ペレツ, アスロン (Быт 46:12). Ωρ — Хур (Исх 31:2 オル), Σουβαλ — Шовал (Быт 36:20 ショバル)."
  2: "καὶ Ραια υἱὸς αὐτοῦ· καὶ Σουβαλ ἐγέννησεν τὸν Ιεθ, καὶ Ιεθ ἐγέννησεν τὸν Αχιμι καὶ τὸν Λααδ· αὗται αἱ γενέσεις τοῦ Σαραθι — «и Реая, сын его; и Шовал родил Яхафа, и Яхаф родил Ахима и Лаада; вот поколения Цорянина». Греч. Ραια — Реая (сын Шовала, ср. ст. 1); Σαραθι — из Цоры (サラタ人)."
  3: "καὶ οὗτοι υἱοὶ Αιταμ· Ιεζραηλ καὶ Ραγμα καὶ Ιαβας, καὶ ὄνομα ἀδελφῆς αὐτῶν Εσηλεββων — イズレエル、イシュマ、イドバシュ; «имя сестры их — Ецлелпони». Греч. Ραγμα — Ишма, Ιαβας — Идбаш (Синод.); слав. «иесман и иевдан» (порча)."
  4: "καὶ Φανουηλ πατὴρ Γεδωρ, καὶ Αζηρ πατὴρ Ωσαν. οὗτοι υἱοὶ Ωρ τοῦ πρωτοτόκου Εφραθα πατρὸς Βαιθλαεμ — ペヌエル (отец Гедора), エゼル (отец Хуша); «это сыны Хура, первенца Ефрафы, отца Вифлеема» (πατήρ — родоначальник)."
  5: "καὶ τῷ Σαουρ πατρὶ Θεκωε ἦσαν δύο γυναῖκες, Αωδα καὶ Θοαδα — «у Ашхура, отца Фекои, были две жены: Аода и Тоада». Греч. имена жён Αωδα, Θοαδα; слав. «халла и маара» (Хела и Наара — по евр.)."
  6: "καὶ ἔτεκεν αὐτῷ Αωδα τὸν Ωχαζαμ καὶ τὸν Ηφαδ καὶ τὸν Θαιμαν καὶ τὸν Ασθηραν· πάντες οὗτοι υἱοὶ Αωδας — アハザム、ヘフェル、テムニ、アハシュタリ; «все эти — сыны Аоды». Слав. приписывает их Мааре (Нааре); в LXX — Аоде."
  7: "καὶ υἱοὶ Θοαδα· Σαρεθ καὶ Σααρ καὶ Εθναν — サレト、サアル、エトナン; в LXX это сыны Тоады, в слав. — Хелы. Перестановка жён в двух традициях; держимся греч."
  8: "καὶ Κως ἐγέννησεν τὸν Ενωβ καὶ τὸν Σαβηβα. καὶ γεννήσεις ἀδελφοῦ Ρηχαβ υἱοῦ Ιαριμ — コツ родил Енов и Савиву; «и рождения брата Рехава, сына Иарима» — место тёмное (γεννήσεις — «роды, рождения»). Синод. «племена Ахархела, сына Гарумова»."
  9: "καὶ ἦν Ιγαβης ἔνδοξος ὑπὲρ τοὺς ἀδελφοὺς αὐτοῦ· καὶ ἡ μήτηρ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ιγαβης λέγουσα Ἔτεκον ὡς γαβης — «Иавис был славнее братьев своих; и мать назвала его Иавис, говоря: я родила его в болезни» (ἔνδοξος — славный, 尊い). Греч. Ἔτεκον ὡς γαβης — тёмное место, букв. «родила как габис»; слав. «нарече имя его в болезни» без прямой речи. Имя передано обычной формой ヤベツ (греч. Ιγαβης)."
  10: "καὶ ἐπεκαλέσατο Ιγαβης τὸν θεὸν Ισραηλ λέγων Ἐὰν εὐλογῶν εὐλογήσῃς με καὶ πληθύνῃς τὰ ὅριά μου καὶ ᾖ ἡ χείρ σου μετ᾿ ἐμοῦ, καὶ ποιήσεις γνῶσιν τοῦ μὴ ταπεινῶσαί με. καὶ ἐπήγαγεν ὁ θεὸς πάντα, ὅσα ᾐτήσατο — молитва Иависа: «если благословляя благословишь меня и расширишь пределы мои, и будет рука Твоя со мною, и сделаешь [мне] знание, чтобы не унизить меня». εὐλογῶν εὐλογήσῃς — усилительное сочетание (слав. «благословляя благословиши»). ποιήσεις γνῶσιν — тёмное место, слав. «сотвориши мя во уразумение»; Синод. понимает иначе: «охраняя меня от зла». ἐπήγαγεν — «привёл, послал» (ἐπάγω)."
  11: "καὶ Χαλεβ πατὴρ Ασχα ἐγέννησεν τὸν Μαχιρ· οὗτος πατὴρ Ασσαθων — «Халев, отец Ашхи, родил Махира; он — отец Ештона». Греч. Χαλεβ здесь не Халев-кенезянин, а Хелув (евр.); πατὴρ Ασχα — «отец Ашхи» (родоначальник)."
  12: "καὶ Ασσαθων ἐγέννησεν τὸν Βαθρεφαν καὶ τὸν Φεσσηε καὶ τὸν Θανα πατέρα πόλεως Ναας ἀδελφοῦ Εσελων τοῦ Κενεζι· οὗτοι ἄνδρες Ρηφα — ベト・ラファ、パセアハ、Тану, «отца города Нааса, брата Еселона Кенезея; это мужи Рехи». Греч. текст испорчен (лишние родительные); слав. добавляет «и ахазова»."
  13: "καὶ υἱοὶ Κενεζ· Γοθονιηλ καὶ Σαραια. καὶ υἱοὶ Γοθονιηλ· Αθαθ — ゴトニエル、セラヤ; сын Гофониила — ハタト (Нав 15:17; Суд 1:13; 3:9)."
  14: "καὶ Μαναθι ἐγέννησεν τὸν Γοφερα. καὶ Σαραια ἐγέννησεν τὸν Ιωαβ πατέρα Αγεαδδαιρ, ὅτι τέκτονες ἦσαν — マナティ, ゴフェラ; «Серая родил Иоава, отца Агеаддаира, ибо они были ремесленники» (τέκτων — 職人). Греч. Αγεαδδαιρ — транслитерация евр. «долина ремесленников» (גֵּיא חֲרָשִׁים); слав. «гисасариим»."
  15: "καὶ υἱοὶ Χαλεβ υἱοῦ Ιεφοννη· Ηρα, Αλα καὶ Νοομ. καὶ υἱοὶ Αλα· Κενεζ — イル、エラ、ナアム; сын Елы — ケナズ. Это Халев, сын Иефоннии (Числ 13:6; Нав 14:6), а не Халев, сын Есрома (гл. 2)."
  16: "καὶ υἱὸς αὐτοῦ Γεσεηλ, Αμηαχι καὶ Ζαφα καὶ Ζαιρα καὶ Εσεραηλ — «и сын его Гесеил, Амиахи, Зафа, Заира и Есраил». Греч. начинает с «сын его», затем перечисление; слав. «сынове же амелимли» иные имена (зиф, зефа, фириа, есерил)."
  17: "καὶ υἱοὶ Εσρι· Ιεθερ, Μωραδ καὶ Αφερ καὶ Ιαλων. καὶ ἐγέννησεν Ιεθερ τὸν Μαρων καὶ τὸν Σεμαι καὶ τὸν Μαρεθ πατέρα Εσθεμων — イェテル、モラド、アフェル、ヤロン; Иефер родил マロン、シェマイ、マレト, «отца Ештемоны». Слав. добавляет «и иесву отца гедорова и отца есфамоня» — в гр. нет."
  18: "καὶ ἡ γυνὴ αὐτοῦ [αὕτη Αδια] ἔτεκεν τὸν Ιαρεδ πατέρα Γεδωρ καὶ τὸν Αβερ πατέρα Σωχων καὶ τὸν Ιεκθιηλ πατέρα Ζανω· καὶ οὗτοι υἱοὶ Γελια θυγατρὸς Φαραω, ἣν ἔλαβεν Μωρηδ — жена его アディア родила ヤレド、アベル、イェクティエル; «это сыны Бетеи, дочери фараоновой, которую взял Моред» (Γελια — евр. Битъя, ベテヤ; слав. «веффии»). В гр. слова αὕτη Αδια стоят в квадратных скобках издания — переведены без скобок."
  19: "καὶ υἱοὶ γυναικὸς τῆς Ιδουιας ἀδελφῆς Ναχεμ. καὶ Δαλια πατὴρ Κειλα, καὶ Σεμειων πατὴρ Ιωμαν. καὶ υἱοὶ Ναημ πατρὸς Κειλα· Αγαρμι καὶ Εσθεμωη Μαχαθι — «сыны жены Иудии, сестры Нахема: Далия, отец Кеилы, и Шимон, отец Иомана; и сыны Наима, отца Кеилы: Гарми и Ешфемоа Маахатянин». Греч. Ιδουιας — «Иудеянка» (слав. «идумеаныни»), поэтому в тексте имя передано как ユディヤ. Синтаксис тёмен; Синод. сводит к «Гарми и Ешфемоа — Маахатянин»."
  20: "καὶ υἱοὶ Σεμιων· Αμνων καὶ Ρανα, υἱὸς Αναν καὶ Θιλων. καὶ υἱοὶ Ισει· Ζωαθ καὶ υἱοὶ Ζωαθ — アムノン、ラナ, «сын Анана», ティロン; сыны Ишая: ゾハト и сыны Зохата. Σεμιων — Шимон (иное лицо, чем Симеон-патриарх в ст. 24)."
  21: "Υἱοὶ Σηλωμ υἱοῦ Ιουδα· Ηρ πατὴρ Ληχα καὶ Λααδα πατὴρ Μαρησα καὶ γενέσεις οἰκιῶν εφραθ αβακ τῷ οἴκῳ Εσοβα — エル (отец Лехи), ラアダ (отец Мареши), «и семейства домов, [делающих] виссон, дому Ашбеи». Греч. εφραθ αβακ — испорченное место; слав. «племя дому делателей виссона в дому есовы» (βύσσος — 亜麻布). Σηλωμ — Шило (シェラ в Быт 38/46)."
  22: "καὶ Ιωακιμ καὶ ἄνδρες Χωζηβα καὶ Ιωας καὶ Σαραφ, οἳ κατῴκησαν ἐν Μωαβ· καὶ ἀπέστρεψεν αὐτοὺς αβεδηριν αθουκιιν — ヨアキム、コゼバの人々、ヨアシュ、サラフ; «которые жили в Моаве; и возвратил их абедирин атукиин» — последние слова транслитерируют евр., смысл утрачен (слав. «аведир в мафукиим», Синод. «Иашувилехем»)."
  23: "οὗτοι κεραμεῖς οἱ κατοικοῦντες ἐν Ναταιμ καὶ Γαδηρα· μετὰ τοῦ βασιλέως ἐν τῇ βασιλείᾳ αὐτοῦ ἐνίσχυσαν καὶ κατῴκησαν ἐκεῖ — «это гончары, живущие в Натаиме и Гадере; при царе, в царстве его, они укрепились и поселились там» (κεραμεύς — 陶工, ἐνισχύω — укрепляться)."
  24: "Υἱοὶ Συμεων· Ναμουηλ καὶ Ιαμιν, Ιαριβ, Ζαρε, Σαουλ — ナムエル、ヤミン、ヤリブ、ザラ、サウル. Греч. формы совпадают с Числ 26:12–13 (ナムエル、ヤミン、ヤキン、ザラ、サウル); в Быт 46:10 иные (イェムエル, ヤキン, サアル). Ιαριβ — Ярив, добавлен в 1 Пар."
  25: "Σαλεμ υἱὸς αὐτοῦ, Μαβασαμ υἱὸς αὐτοῦ, Μασμα υἱὸς αὐτοῦ — サレム、マバサム、マスマ; цепочка «сын его», как в ст. 24–26. Слав. «салем, масан, масма»."
  26: "Αμουηλ υἱὸς αὐτοῦ, Σαβουδ υἱὸς αὐτοῦ, Ζακχουρ υἱὸς αὐτοῦ, Σεμει υἱὸς αὐτοῦ — アムエル、サブド、ザクル、シェメイ. Греч. Σαβουδ (Савуд), слав. «савуд»."
  27: "καὶ τῷ Σεμει υἱοὶ ἑκκαίδεκα καὶ θυγατέρες τρεῖς· καὶ τοῖς ἀδελφοῖς αὐτῶν οὐκ ἦσαν υἱοὶ πολλοί· καὶ πᾶσαι αἱ πατριαὶ αὐτῶν οὐκ ἐπλεόνασαν ὡς υἱοὶ Ιουδα — «у Шимея было шестнадцать сыновей и три дочери; у братьев их было немного сыновей, и все племена их не умножились, как сыны Иуды» (πλεονάζω — умножаться). Слав. «дщерей шесть» — иное чтение."
  28: "καὶ κατῴκησαν ἐν Βηρσαβεε καὶ Σαμα καὶ Μωλαδα καὶ Εσηρσουαλ — «и поселились в Вирсавии, Саме, Моладе и Есерсуале». Формы корпуса: ベエル・シェバ (Быт 21:31), モラダ (Нав 15:26); Σαμα — Шема, Εσηρσουαλ — Хацар-Шуал (エセル・スアル)."
  29: "καὶ ἐν Βαλαα καὶ Βοασομ καὶ Θουλαδ — バラア、ボアソム、トラド. Слав. «валааи, асеме, фоладе»; Синод. «Билга, Ецем, Фолад» (ср. Нав 15:29)."
  30: "καὶ Βαθουηλ καὶ Ερμα καὶ Σεκλαγ — バトエル、エルマ、ツィクラグ. Формы корпуса: エルマ (Нав 15:30), ツィクラグ (Нав 15:31; 1 Цар 27:6). Σεκλαγ — Секелаг (слав. «сикелаг»)."
  31: "καὶ Βαιθμαρχαβωθ καὶ ἥμισυ Σωσιμ καὶ οἶκον Βαρουμσεωριμ· αὗται πόλεις αὐτῶν ἕως βασιλέως Δαυιδ — ベト・マルカボト, «половина Сосима», «дом Баромсеорима»; «вот города их до царя Давида» (ἥμισυ — половина)."
  32: "καὶ ἐπαύλεις αὐτῶν· Αιταμ καὶ Ηνρεμμων καὶ Θοκκαν καὶ Αισαν, πόλεις πέντε — «и селения их: Етам, Ен-Реммон, Токкан и Асан, пять городов» (ἔπαυλις — 村, селение). Слав. «етам и ин, рамнон и фоккан и есар»."
  33: "καὶ πᾶσαι αἱ ἐπαύλεις αὐτῶν κύκλῳ τῶν πόλεων τούτων ἕως Βααλ· αὕτη ἡ κατάσχεσις αὐτῶν καὶ ὁ καταλοχισμός — «и все селения их вокруг этих городов до Ваала; вот владение их и распределение их» (κατάσχεσις — владение, καταλοχισμός — распределение по родам, 系図)."
  34: "καὶ Μοσωβαβ καὶ Ιεμολοχ καὶ Ιωσια υἱὸς Αμασια — メショバブ、ヤムレク、ヨシヤ (сын Амасии). Греч. Ιεμολοχ — евр. Иамлех."
  35: "καὶ Ιωηλ [καὶ οὗτος υἱὸς Ισαβια], υἱὸς Σαραια, υἱὸς Ασιηλ — ヨエル, «и этот — сын Иосавии», сын Сераии, сын Асиила. Слова в квадратных скобках издания переведены без скобок; слав. «и ииуй сын асавиев»."
  36: "καὶ Ελιωηναι καὶ Ιακαβα καὶ Ιασουια καὶ Ασαια καὶ Εδιηλ καὶ Ισμαηλ καὶ Βαναια — エリオエナイ、ヤコバ、イェショハヤ、アサヤ、アディエル、イェシミエル、ベナヤ. Греч. Ισμαηλ здесь — Ишмаил, не Измаил-патриарх."
  37: "καὶ Ζουζα υἱὸς Σεφει υἱοῦ Αλλων υἱοῦ Ιεδια υἱοῦ Σαμαρι υἱοῦ Σαμαιου — ズザ, сын Шифи, сына Аллона, сына Иедаии, сына Шимрия, сына Шемаии; цепочка родительных передана повтором の子."
  38: "οὗτοι οἱ διελθόντες ἐν ὀνόμασιν ἀρχόντων ἐν ταῖς γενέσεσιν αὐτῶν· καὶ ἐν οἴκοις πατριῶν αὐτῶν ἐπληθύνθησαν εἰς πλῆθος — «эти, внесённые по именам как князья в родах своих, и в домах отцов своих умножились до множества» (διέρχομαι ἐν ὀνόμασιν — проходить по списку имён; ἀρχηγός/ἄρχων — つかさ)."
  39: "καὶ ἐπορεύθησαν ἕως τοῦ ἐλθεῖν Γεραρα ἕως τῶν ἀνατολῶν τῆς Γαι τοῦ ζητῆσαι νομὰς τοῖς κτήνεσιν αὐτῶν — «и пошли до прихода в Герар, до востока Гая, чтобы найти пастбища для скота своего» (νομή — 牧場, κτῆνος — скот)."
  40: "καὶ εὗρον νομὰς πίονας καὶ ἀγαθάς, καὶ ἡ γῆ πλατεῖα ἐναντίον αὐτῶν καὶ εἰρήνη καὶ ἡσυχία, ὅτι ἐκ τῶν υἱῶν Χαμ τῶν κατοικούντων ἐκεῖ ἔμπροσθεν — «и нашли пастбища тучные и хорошие; земля обширна, и мир, и покой, ибо прежде там жили сыны Хама» (πίων — тучный, πλατύς — обширный, ἡσυχία — покой)."
  41: "καὶ ἤλθοσαν οὗτοι οἱ γεγραμμένοι ἐπ᾽ ὀνόματος ἐν ἡμέραις Εζεκιου βασιλέως Ιουδα καὶ ἐπάταξαν τοὺς οἴκους αὐτῶν καὶ τοὺς Μιναίους, οὓς εὗροσαν ἐκεῖ, καὶ ἀνεθεμάτισαν αὐτοὺς ἕως τῆς ἡμέρας ταύτης καὶ ᾤκησαν ἀντ αὐτῶν, ὅτι νομαὶ τοῖς κτήνεσιν αὐτῶν ἐκεῖ — «пришли эти, записанные по имени, во дни Езекии, царя Иудейского, и поразили дома их и Минеев, которых нашли там, и предали их заклятию до сего дня, и поселились вместо них, ибо там пастбища для скота их» (ἀναθεματίζω — 聖絶する). Греч. Μιναῖοι, слав. «обитание» (порча); Синод. «кочующих и оседлых»."
  42: "καὶ ἐξ αὐτῶν ἀπὸ τῶν υἱῶν Συμεων ἐπορεύθησαν εἰς ὄρος Σηιρ ἄνδρες πεντακόσιοι, καὶ Φαλεττια καὶ Νωαδια καὶ Ραφαια καὶ Οζιηλ υἱοὶ Ιεσι ἄρχοντες αὐτῶν — «из них, из сынов Симеона, пошли на гору Сеир пятьсот человек, и Пелатия, Неария, Рефаия и Узиил, сыны Ишия, — начальники их» (ἄρχων — 指導者)."
  43: "καὶ ἐπάταξαν τοὺς καταλοίπους τοὺς καταλειφθέντας τοῦ Αμαληκ καὶ κατῴκησαν ἐκεῖ ἕως τῆς ἡμέρας ταύτης — «и поразили остаток уцелевших амаликитян, и живут там до сего дня» (κατάλοιπος — остаток, καταλείπω — оставлять)."
