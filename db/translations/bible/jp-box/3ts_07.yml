verses:
  1: "ソロモンは自分[じぶん]の家[いえ]を十三[じゅうさん]年[ねん]かけて建[た]てた。こうしてソロモンは自分[じぶん]の家[いえ]すべてを完成[かんせい]させた。"
  2: "彼[かれ]はレバノンの森[もり]の家[いえ]を建[た]てた。長[なが]さ百[ひゃく]キュビト、幅[はば]五十[ごじゅう]キュビト、高[たか]さ三十[さんじゅう]キュビトで、三列[さんれつ]の杉[すぎ]の柱[はしら]があり、柱[はしら]には杉[すぎ]の梁[はり]があった。"
  3: "その家[いえ]は柱[はしら]の側面[そくめん]の上[うえ]に板[いた]を張[は]って覆[おお]い、柱[はしら]の数[かず]は四十五[よんじゅうご]本[ほん]、一列[いちれつ]に十五[じゅうご]本[ほん]であった。"
  4: "また、三[みっ]つの梁[はり]と、三[みっ]重[じゅう]に並[なら]んだ側面[そくめん]があった。"
  5: "すべての戸口[とぐち]と側面[そくめん]は四角[しかく]で、梁[はり]が渡[わた]されており、戸口[とぐち]から戸口[とぐち]へと三[みっ]重[じゅう]に向[む]かい合[あ]っていた。"
  6: "また、柱[はしら]の前廊[ぜんろう]は長[なが]さ五十[ごじゅう]キュビト、幅[はば]三十[さんじゅう]キュビトで、互[たが]いに組[く]み合[あ]わされていた。その前[まえ]に前廊[ぜんろう]があり、前廊[ぜんろう]の前[まえ]には柱[はしら]と厚[あつ]みがあった。"
  7: "また、王座[おうざ]の前廊[ぜんろう]、すなわち彼[かれ]がそこで裁[さば]く前廊[ぜんろう]、裁[さば]きの前廊[ぜんろう]を造[つく]った。そして床[ゆか]から天井[てんじょう]まで杉[すぎ]の板[いた]で覆[おお]った。"
  8: "また、彼[かれ]が住[す]むための家[いえ]があり、この仕事[しごと]に応[おう]じて一[ひと]つの庭[にわ]が設[もう]けられていた。また、ソロモンが娶[めと]ったファラオの娘[むすめ]のために、この前廊[ぜんろう]に似[に]せた家[いえ]を建[た]てた。"
  9: "これらはすべて、内側[うちがわ]でも外側[そとがわ]でも、基礎[きそ]から軒[のき]まで、また大[おお]きな庭[にわ]に至[いた]るまで、寸法[すんぽう]に従[したが]って切[き]り出[だ]された貴重[きちょう]な石[いし]で造[つく]られていた。"
  10: "その基礎[きそ]は貴重[きちょう]な大[おお]きな石[いし]、十[じゅう]キュビトの石[いし]と八[はち]キュビトの石[いし]で据[す]えられていた。"
  11: "その上[うえ]には、寸法[すんぽう]に従[したが]って切[き]出[だ]された貴重[きちょう]な石[いし]と杉[すぎ]があった。"
  12: "大[おお]きな庭[にわ]の周[まわ]りには、切[き]出[だ]された石[いし]の三列[さんれつ]と、切[き]り出[だ]した杉[すぎ]の一列[いちれつ]があった。また、神殿[しんでん]の内[うち]の庭[にわ]と、神殿[しんでん]の前[まえ]の前廊[ぜんろう]を造[つく]った。"
  13: "ソロモン王[おう]は人[ひと]を遣[つか]わして、ツロからヒラムを連[つ]れて来[こ]させた。"
  14: "彼[かれ]はやもめの子[こ]で、ナフタリの部族[ぶぞく]の者[もの]であった。父[ちち]はツロの人[ひと]で青銅[せいどう]の細工師[さいくし]であり、あらゆる青銅[せいどう]の仕事[しごと]をする技術[ぎじゅつ]と理解[りかい]と知識[ちしき]に満[み]ちていた。彼[かれ]はソロモン王[おう]のもとへ連[つ]れて来[こ]られ、すべての仕事[しごと]を行[おこな]った。"
  15: "彼[かれ]は神殿[しんでん]の前廊[ぜんろう]のために二本[にほん]の柱[はしら]を鋳造[いちゅう]した。一本[いっぽん]の柱[はしら]の高[たか]さは十八[じゅうはち]キュビト、その周[まわ]りは十四[じゅうよん]キュビトで、柱[はしら]を取[と]り囲[かこ]んでいた。柱[はしら]の厚[あつ]さは指[ゆび]四本分[よんほんぶん]で、溝[みぞ]があった。第二[だい]の柱[はしら]も同[おな]じであった。"
  16: "また、柱[はしら]の頭[あたま]に載[の]せるための二[ふた]つの柱頭[ちゅうとう]を造[つく]った。青銅[せいどう]の鋳物[いもの]で、一[ひと]つの柱頭[ちゅうとう]の高[たか]さは五[ご]キュビト、もう一[ひと]つの柱頭[ちゅうとう]の高[たか]さも五[ご]キュビトであった。"
  17: "また、柱[はしら]の柱頭[ちゅうとう]を覆[おお]うための二[ふた]つの網細工[あみざいく]を造[つく]った。一[ひと]つの柱頭[ちゅうとう]に一[ひと]つの網[あみ]、もう一[ひと]つの柱頭[ちゅうとう]に一[ひと]つの網[あみ]を付[つ]けた。"
  18: "また、垂[た]れ下[さ]がる細工[さいく]、すなわち青銅[せいどう]のざくろを二列[にれつ]にした網細工[あみざいく]を造[つく]った。列[れつ]の上[うえ]に列[れつ]を重[かさ]ねた垂[た]れ下[さ]がる細工[さいく]である。第二[だい]の柱頭[ちゅうとう]にも同[おな]じように造[つく]った。"
  19: "柱[はしら]の頭[あたま]には、前廊[ぜんろう]に合[あ]わせて四[よん]キュビトの百合[ゆり]の細工[さいく]があった。"
  20: "二本[にほん]の柱[はしら]の上[うえ]には梁[はり]があり、その側面[そくめん]の上[うえ]には、その厚[あつ]さに応[おう]じた梁[はり]の覆[おお]いがあった。また、第二[だい]の柱頭[ちゅうとう]の周[まわ]りには、二百[にひゃく]のざくろが列[れつ]をなしていた。"
  21: "彼[かれ]は神殿[しんでん]の前廊[ぜんろう]に柱[はしら]を立[た]てた。一[ひと]つの柱[はしら]を立[た]ててその名[な]をヤフムと呼[よ]び、もう一[ひと]つの柱[はしら]を立[た]ててその名[な]をバアズと呼[よ]んだ。"
  22: "こうして柱[はしら]の仕事[しごと]は完成[かんせい]した。"
  23: "彼[かれ]は青銅[せいどう]の海[うみ]を造[つく]った。縁[ふち]から縁[ふち]まで十[じゅう]キュビトで、周[まわ]りは全[まった]く円[えん]く、高[たか]さは五[ご]キュビト、その周[まわ]りは三十[さんじゅう]キュビトであった。"
  24: "その縁[ふち]の下[した]には周[まわ]りを取[と]り囲[かこ]む支[ささ]えがあり、一[いち]キュビトごとに十[とお]、周[まわ]りに海[うみ]を支[ささ]えていた。支[ささ]えは二列[にれつ]あり、海[うみ]とともに一体[いったい]に鋳造[いちゅう]されていた。"
  25: "海[うみ]の下[した]には十二[じゅうに]頭[とう]の牛[うし]がいた。三[さん]頭[とう]は北[きた]を向[む]き、三[さん]頭[とう]は西[にし]を向[む]き、三[さん]頭[とう]は南[みなみ]を向[む]き、三[さん]頭[とう]は東[ひがし]を向[む]いていた。すべての後[しり]の部分[ぶぶん]は内側[うちがわ]へ向[む]き、海[うみ]はその上[うえ]にあった。"
  26: "その縁[ふち]は杯[さかずき]の縁[ふち]のような細工[さいく]で、百合[ゆり]の花[はな]のつぼみの形[かたち]であった。その厚[あつ]さは手[て]のひらであった。"
  27: "彼[かれ]は青銅[せいどう]の台座[だいざ]を十[じゅう]個[こ]造[つく]った。一[ひと]つの台座[だいざ]の長[なが]さは五[ご]キュビト、幅[はば]は四[よん]キュビト、高[たか]さは六[ろく]キュビトであった。"
  28: "台座[だいざ]の造[つく]りは次[つぎ]のとおりであった。羽目板[はめいた]があり、突出部[とっしゅつぶ]の間[あいだ]にも羽目板[はめいた]があった。"
  29: "その羽目板[はめいた]の上[うえ]、突出部[とっしゅつぶ]の間[あいだ]には、獅子[しし]と牛[うし]とケルビムがあった。突出部[とっしゅつぶ]の上[うえ]にも同[おな]じであった。獅子[しし]と牛[うし]の上[うえ]にも下[した]にも、垂[た]れ飾[かざ]りがあった。"
  30: "一[ひと]つの台座[だいざ]に四[よっ]つの青銅[せいどう]の車輪[しゃりん]があり、その青銅[せいどう]の軸[じく]もあった。その四[よっ]つの部分[ぶぶん]には、洗[あら]い盤[ばん]の下[した]に肩[かた]があった。"
  31: "取[と]っ手[て]の間[あいだ]の部分[ぶぶん]は四角[しかく]で、円[えん]くはなかった。"
  32: "台座[だいざ]の車輪[しゃりん]には取[と]っ手[て]があり、一[ひと]つの車輪[しゃりん]の高[たか]さは一[いち]キュビト半[はん]であった。"
  33: "車輪[しゃりん]の造[つく]りは戦車[せんしゃ]の車輪[しゃりん]の造[つく]りのようであった。その取[と]っ手[て]も、背[せ]も、その細工[さいく]も、すべて鋳物[いもの]であった。"
  34: "一[ひと]つの台座[だいざ]の四[よっ]つの角[かど]には四[よっ]つの肩[かた]があり、その肩[かた]は台座[だいざ]から出[で]ていた。"
  35: "台座[だいざ]の頭[あたま]には、周[まわ]りに半[はん]キュビトの円[えん]い高[たか]まりがあった。その取[と]っ手[て]の付根[つけね]も羽目板[はめいた]も台座[だいざ]から出[で]ており、取[と]っ手[て]の付根[つけね]に開[ひら]いていた。"
  36: "その羽目板[はめいた]にはケルビムと獅子[しし]と棕櫚[しゅろ]の木[き]が立[た]っており、それぞれが内側[うちがわ]でも周[まわ]りでも、その前[まえ]の面[めん]に沿[そ]って並[なら]んでいた。"
  37: "彼[かれ]は十[じゅう]の台座[だいざ]をすべて同[おな]じように造[つく]った。すべて同[おな]じ形[かたち]と同[おな]じ寸法[すんぽう]であった。"
  38: "彼[かれ]は青銅[せいどう]の洗[あら]い盤[ばん]を十[じゅう]個[こ]造[つく]った。一[ひと]つの洗[あら]い盤[ばん]は四十[しじゅう]コスを入[い]れることができ、その寸法[すんぽう]は四[よん]キュビトであった。一[ひと]つの洗[あら]い盤[ばん]が十[じゅう]の台座[だいざ]の一[ひと]つずつに載[の]っていた。"
  39: "彼[かれ]は十[じゅう]の台座[だいざ]を置[お]いた。神殿[しんでん]の右側[みぎがわ]に五[いつ]つ、左側[ひだりがわ]に五[いつ]つである。海[うみ]は神殿[しんでん]の右側[みぎがわ]、東[ひがし]に向[む]かう南[みなみ]の角[かど]に置[お]いた。"
  40: "ヒラムは大釜[おおがま]と火皿[ひざら]と鉢[はち]を造[つく]った。ヒラムは、主[しゅ]の神殿[しんでん]のためにソロモン王[おう]に造[つく]ったすべての仕事[しごと]を終[お]えた。"
  41: "すなわち、二本[にほん]の柱[はしら]、柱[はしら]の頭[あたま]にある二[ふた]つのねじり飾[かざ]り、柱[はしら]の上[うえ]のねじり飾[かざ]りを覆[おお]う二[ふた]つの網[あみ]である。"
  42: "また、二[ふた]つの網[あみ]に四百[よんひゃく]のざくろを付[つ]けた。一[ひと]つの網[あみ]に二列[にれつ]のざくろがあり、両方[りょうほう]の柱[はしら]の上[うえ]のねじり飾[かざ]りを覆[おお]っていた。"
  43: "十[じゅう]の台座[だいざ]と、台座[だいざ]の上[うえ]の十[じゅう]の洗[あら]い盤[ばん]があった。"
  44: "また、一[ひと]つの海[うみ]と、その海[うみ]の下[した]の十二[じゅうに]頭[とう]の牛[うし]があった。"
  45: "また、大釜[おおがま]と火皿[ひざら]と鉢[はち]、すなわちヒラムが主[しゅ]の神殿[しんでん]のためにソロモン王[おう]に造[つく]ったすべての器[うつわ]があった。王[おう]の家[いえ]と主[しゅ]の家[いえ]の柱[はしら]は四十八[よんじゅうはち]本[ほん]であった。王[おう]が造[つく]らせたすべての仕事[しごと]は、ことごとく青銅[せいどう]であった。"
  46: "王[おう]はそれらをヨルダン川[がわ]の周辺[しゅうへん]、スコトとシラの間[あいだ]の土[つち]の厚[あつ]みの中[なか]で鋳造[いちゅう]した。"
  47: "このすべての仕事[しごと]に用[もち]いた青銅[せいどう]は、その量[りょう]が非常[ひじょう]に多[おお]かったため、重[おも]さを量[はか]ることができなかった。青銅[せいどう]の重[おも]さには限[かぎ]りがなかった。"
  48: "ソロモン王[おう]は、主[しゅ]の神殿[しんでん]のために造[つく]った器[うつわ]、すなわち金[きん]の祭壇[さいだん]と、供[そな]えのパンを載[の]せる金[きん]の机[つくえ]を納[おさ]めた。"
  49: "また、燭台[しょくだい]、すなわち至[し]聖所[せいしょ]の前[まえ]に右[みぎ]に五[いつ]つ、左[ひだり]に五[いつ]つある金[きん]の燭台[しょくだい]と、その灯[あか]りと、ともし火[び]と、金[きん]の火挟[ひばさ]みを納[おさ]めた。"
  50: "また、戸口[とぐち]と釘[くぎ]と鉢[はち]と小皿[こざら]と香炉[こうろ]、すなわち金[きん]のもの、また最[もっと]も内[うち]なる神殿[しんでん]、すなわち至[し]聖所[せいしょ]の扉[とびら]と、神殿[しんでん]の扉[とびら]を、金[きん]で造[つく]った。"
  51: "こうして、ソロモンが主[しゅ]の神殿[しんでん]のために行[おこな]ったすべての仕事[しごと]が完成[かんせい]した。ソロモンは父[ちち]ダビデの聖別[せいべつ]したものと、自分[じぶん]の聖別[せいべつ]したすべてのもの、すなわち銀[ぎん]と金[きん]と器[うつわ]を持[も]ち込[こ]み、主[しゅ]の神殿[しんでん]の宝物庫[ほうもつこ]に納[おさ]めた。"

notes:
  1: "τὸν οἶκον αὐτοῦ — свой дом, дворец; τρισκαίδεκα ἔτεσιν — тринадцать лет. Слав. 7:1 «И дом свой созда соломон треминадесять леты, и соверши соломон весь дом свой»; с этого стиха начинается дворец: слав. 7:1–12 = gr 7:38–50. συνετέλεσεν ὅλον τὸν οἶκον αὐτοῦ — завершил весь свой дом; слав. 7:1b «и соверши соломон весь дом свой» (в начале главы). В LXX этим стихом заканчивается глава; в слав./МТ глава кончается стихом о совершении дела храма (слав. 7:51)."
  2: "δρυμῷ τοῦ Λιβάνου — «лесом Ливанским» (レバノンの森の家); τριῶν στίχων στύλων κεδρίνων — три ряда кедровых столпов (杉); ὠμίαι κέδριναι — кедровые балки. Слав. 7:2."
  3: "ἐφάτνωσεν — покрыл, обшил; ἀριθμὸς τῶν στύλων τεσσαράκοντα καὶ πέντε, δέκα καὶ πέντε ὁ στίχος — 45 столпов, по 15 в ряд. Слав. 7:3."
  4: "μέλαθρα τρία — три балки, перекрытия; χώρα ἐπὶ χώραν τρισσῶς — ряд на ряд, трижды (слав. «камара над камарою трегубо»). Слав. 7:4."
  5: "θυρώματα — дверные проёмы (戸口); τετράγωνοι — четырёхугольные; μεμελαθρωμέναι — с перекрытиями; ἀπὸ τοῦ θυρώματος ἐπὶ θύραν τρισσῶς — от проёма к двери трижды. Слав. 7:5."
  6: "αιλαμ τῶν στύλων — притвор столпов; ἐζυγωμένα — соединённые, сопряжённые; στῦλοι καὶ πάχος ἐπὶ πρόσωπον — столпы и толщина перед ним. Слав. 7:6."
  7: "αιλαμ τῶν θρόνων — притвор престолов; οὗ κρινεῖ ἐκεῖ — где он судит; αιλαμ τοῦ κριτηρίου — притвор судилища. Слав. 7:7 добавляет «и покры и от земли даже до верха дщицами кедровыми» (покрыл от земли до верха кедровыми досками) — внесено."
  8: "αὐλὴ μία ἐξελισσομένη — один двор, устроенный; οἶκον τῇ θυγατρὶ Φαραω — дом для дочери фараона; κατὰ τὸ αιλαμ τοῦτο — по этому притвору. Слав. 7:8."
  9: "ἐκ λίθων τιμίων — из дорогих камней; ἐκ διαστήματος — по размеру, по мерке; γεῖσα — карниз, выступ (軒); αὐλὴ μεγάλη — большой двор. Слав. 7:9."
  10: "τεθεμελιωμένην — основанный; λίθοις δεκαπήχεσιν καὶ ὀκταπήχεσιν — камни в 10 и 8 локтей. Слав. 7:10."
  11: "ἐπάνωθεν — сверху; ἀπελεκήτων — тёсаных, обтёсанных; κέδροις — кедром. Слав. 7:11."
  12: "τρεῖς στίχοι ἀπελεκήτων καὶ στίχος κεκολαμμένης κέδρου — три ряда тёсаных камней и один ряд обтёсанного кедра. Слав. 7:12 добавляет «и созда двор храма внутреннейший притвора дому сущаго пред лицем храма» (внутренний двор и притвор; по МТ 7:12) — внесено."
  13: "καὶ ἀπέστειλεν ... καὶ ἔλαβεν — «послал и взял» (слав. 7:13 «И посла царь соломон в тир, и взя хирама от тира»). В слав./МТ дворец стоит в начале главы (7:1–12), а храмовая утварь в 7:13–51; в LXX наоборот, поэтому gr 7:1 = слав. 7:13. Хирам — ヒラム."
  14: "υἱὸν γυναικὸς χήρας — сын женщины-вдовы; ἀπὸ τῆς φυλῆς Νεφθαλι — из колена Неффалимова; ἀνὴρ Τύριος — муж тирянин; τέκτων χαλκοῦ — медник (χαλκός — медь/бронза); πεπληρωμένος τῆς τέχνης καὶ συνέσεως καὶ ἐπιγνώσεως — исполнен искусства, разумения и знания; εἰσήχθη πρὸς τὸν βασιλέα — был приведён к царю. Слав. 7:14 добавляет «и приведоша его ко царю соломону» и «и сотвори вся дела»."
  15: "ἐχώνευσεν — отлил (χωνεύω); αιλαμ — притвор (前廊); ὀκτωκαίδεκα πήχεις — 18 локтей; περίμετρον τεσσάρων καὶ δέκα — обвод 14 локтей; τὸ πάχος ... τεσσάρων δακτύλων τὰ κοιλώματα — толщина в четыре пальца, с желобками (κοίλωμα — впадина, желобок); слав. 7:15 «четырех перстов вглубления». Слав. «такожде бе и вторый столп» = gr καὶ οὕτως ὁ στῦλος ὁ δεύτερος."
  16: "ἐπιθέματα — венцы, капители (柱頭); χωνευτὰ χαλκᾶ — литые из меди; по пяти локтей каждый. Слав. 7:16 «возложения»."
  17: "δίκτυα — сети, сетчатые покрытия (網細工); περικαλύψαι — чтобы покрыть; по сети на каждый венец. Слав. 7:17."
  18: "ἔργον κρεμαστόν — «висячая работа» (слав. «дело висимо»); στίχοι ῥοῶν χαλκῶν — ряды медных гранатов (ざくろ); δεδικτυωμένοι — сплетённые в сетку; στίχος ἐπὶ στίχον — ряд на ряд; так же для второго венца. Слав. 7:18."
  19: "ἔργον κρίνου — работа в виде лилии (百合); κατὰ τὸ αιλαμ — сообразно притвору; τεσσάρων πηχῶν — в четыре локтя. Слав. 7:19 добавляет «якоже во еламе» — внесено."
  20: "μέλαθρον — балка, перекрытие (梁; слав. «строение»); ἐπὶ τῶν πλευρῶν — на боковых сторонах; ἐπίθεμα τὸ μέλαθρον τῷ πάχει — покрытие-балка по толщине. Слав. 7:20 добавляет «и яблоков двести рядов около на вторей главе» (200 гранатов венцом; в LXX нет, чтение по МТ 7:20) — внесено в основной текст."
  21: "ἔστησεν τοὺς στύλους τοῦ αιλαμ τοῦ ναοῦ — поставил столпы притвора храма; ἐπεκάλεσεν τὸ ὄνομα — нарёк имя. LXX: Ιαχουμ и Βααζ (ヤフム, バアズ); слав. 7:21 «иахун» и «воос» (передано по LXX). В слав./МТ этот стих стоит после описания лилий (7:21), в LXX — раньше; здесь порядок слав."
  22: "Слав. 7:22: «И на главах столпов дело криново, и сконча дело столпов» (и окончил дело столпов) — внесено. В gr отдельного стиха нет, поэтому наш прежний 8 разделён: лилии — ст. 19 (csl 7:19), завершение — ст. 22 (csl 7:22)."
  23: "θάλασσα — «море», литая чаша для омовений (青銅の海); ἀπὸ τοῦ χείλους ἕως τοῦ χείλους — от края до края; στρογγύλον κύκλῳ — круглое; συνηγμένοι τριάκοντα τρεῖς — обвод в 33 локтя (LXX); слав. 7:23 «тридесять лактей» (по МТ) — в тексте 30 по csl."
  24: "ὑποστηρίγματα — подпоры (слав. «подкрепления»); δέκα ἐν πήχει — по десяти на локоть; ἀνιστᾶν — поддерживать. Слав. 7:24 добавляет «два ряда подкреплений... слиты во слиянии его» (два ряда, по МТ) — внесено в основной текст."
  25: "θάλασσα здесь также сторона света — запад (семитское словоупотребление); βορρᾶς — север, νότος — юг, ἀνατολή — восток; ὀπίσθια — задние части; εἰς τὸν οἶκον — внутрь, к дому. Слав. 7:25 называет сторону прямо («на запад»)."
  26: "χεῖλος ... ὡς ἔργον χείλους ποτηρίου — край, как работа края чаши; βλαστὸς κρίνου — побег, цветок лилии; παλαιστής — ладонь (мера). Слав. 7:26; в слав. это после волов (gr 13): порядок LXX иной."
  27: "μεχωνωθ — подставы, bases (台座; слав. «мехонофы»); пять на четыре на шесть локтей. Отдел подстав (gr 7:14–25) в слав. стоит в 7:27–38, после моря и волов. Слав. 7:27."
  28: "σύγκλειστον — «заключённое», панель, филёнка (羽目板); ἐξεχόμενα — выступающие части (突出部). Слав. 7:28 «споеное о себе и споеное посреде произницающих» — спаянное само по себе и между выступами."
  29: "συγκλείσματα — панели; ἀνὰ μέσον τῶν ἐξεχομένων — между выступами; λέοντες καὶ βόες καὶ χερουβιν — львы, волы и херувимы (ケルビム); χῶραι — обрамления, поля (слав. «места»); ἔργον καταβάσεως — «работа спуска», свисающие украшения (слав. «дело низхождения»). Слав. 7:29."
  30: "τροχοί — колёса (車輪); τὰ προσέχοντα χαλκᾶ — медные оси и принадлежности (слав. «придержания медяна»); ὠμίαι ὑποκάτω τῶν λουτήρων — плечи под умывальницами (λουτήρ — 洗い盤). Слав. 7:30."
  31: "Слав. 7:31: «и междустолпия их четвероуголна, а не кругла» (промежутки четырёхугольны, не круглы; по МТ 7:31). В gr модуля этой клаузы нет; она была влита в наш прежний ст. 21 и теперь выделена в ст. 31. В csl 7:31 есть также описание «уст» подставы (уста внутрь главы, выше локтя, круглые, в полтора локтя, с изваяниями), которого в gr-lxx-byz нет и которое в переводе отсутствует — расхождение отмечено при сверке."
  32: "χεῖρες — рукояти (слав. «руце»); ὕψος ... πήχεος καὶ ἡμίσους — полтора локтя. Слав. 7:32 «высота единаго колеса лакоть и пол»."
  33: "ἅρμα — колесница (戦車); νῶτοι — задние части, ободья (слав. «хребты»); πραγματεία — устройство, работа; χωνευτά — литые. Слав. 7:33."
  34: "ὠμίαι — плечи, выступы на четырёх углах; ἐκ τῆς μεχωνωθ οἱ ὦμοι αὐτῆς — из самой подставы её плечи. Слав. 7:34."
  35: "ἀρχὴ χειρῶν — начало рукоятей (付根); συγκλείσματα — панели; ἠνοίγετο ἐπὶ τὰς ἀρχὰς τῶν χειρῶν — открывалось к началам рукоятей. Слав. 7:35."
  36: "φοίνικες — пальмы (棕櫚); ἑστῶτα — стоящие; ἐχόμενον ἕκαστον κατὰ πρόσωπον αὐτοῦ — каждое примыкает к своей лицевой стороне; ἔσω καὶ τὰ κυκλόθεν — внутри и вокруг. Слав. 7:36."
  37: "κατ' αὐτὴν — по ней, одинаково; τάξιν μίαν καὶ μέτρον ἕν — один порядок и одна мера. Слав. 7:37."
  38: "χυτροκαύλους — умывальницы (洗い盤); τεσσαράκοντα χοεῖς — сорок хоев (χοῦς — мера объёма, ок. 3,3 л); μετρήσει — по мере. Слав. 7:38 «по четыредесяти мер... мерою четырех лактей»."
  39: "ὠμία τοῦ οἴκου — боковая сторона дома; ἐκ δεξιῶν — справа, ἐξ ἀριστερῶν — слева; κατ' ἀνατολὰς ἀπὸ τοῦ κλίτους τοῦ νότου — к востоку от южной стороны. Слав. 7:39."
  40: "λέβητας — котлы (大釜); θερμάστρεις — совки, жаровни (火皿); φιάλας — чаши (鉢); συνετέλεσεν — завершил. Слав. 7:40."
  41: "στύλους δύο — два столпа; στρεπτὰ τῶν στύλων — витые украшения (слав. «обвития»); δίκτυα — сети; γλυφαί — резьба, изображения. Слав. 7:41."
  42: "ῥόας τετρακοσίας — 400 гранатов (по 200 на сетку); δύο στίχοι ῥοῶν — два ряда гранатов. Слав. 7:42."
  43: "καὶ τὰς μεχωνωθ δέκα καὶ τοὺς χυτροκαύλους δέκα ἐπὶ τῶν μεχωνωθ — перечень; слав. 7:43 «и мехонофов десять и конобов десять на мехонофе»."
  44: "θάλασσαν μίαν καὶ βόας δώδεκα — одно море и двенадцать волов; слав. 7:44."
  45: "οἱ στῦλοι τεσσαράκοντα καὶ ὀκτὼ τοῦ οἴκου τοῦ βασιλέως καὶ τοῦ οἴκου κυρίου — 48 столпов дома царского и дома Господня; χαλκᾶ ἄρδην — целиком из меди. Слав. 7:45."
  46: "ἐν τῷ περιοίκῳ τοῦ Ιορδάνου — в окрестности Иордана; ἐν τῷ πάχει τῆς γῆς — в толще земли, в глинистой земле; ἀνὰ μέσον Σοκχωθ καὶ ... Σιρα — между Сокхофом и Сирой. Слав. 7:46; порядок: в слав. этот стих идёт перед стихом о весе меди (7:47), в LXX — после."
  47: "σταθμός — вес; τέρμα — предел; ἐκ πλήθους σφόδρα — по причине чрезвычайного множества. Слав. 7:47."
  48: "ἔδωκεν ... ἐν οἴκῳ κυρίου — поставил в доме Господнем; θυσιαστήριον τὸ χρυσοῦν — золотой жертвенник; τράπεζαν, ἐφ' ἧς οἱ ἄρτοι τῆς προσφορᾶς — стол с хлебами предложения (供えのパン). Слав. 7:48."
  49: "λυχνίας — светильники (燭台); κατὰ πρόσωπον τοῦ δαβιρ — перед давиром, то есть перед 至聖所; χρυσᾶς συγκλειομένας — золотые, кованые; λαμπάδια, λύχνους, ἐπαρυστρίδας — лампады, светильники, щипцы (火挟み; слав. «щипцы»). Слав. 7:49 добавляет пояснение «(святая святых)» — глосса, в текст не внесена."
  50: "πρόθυρα — дверные проёмы (戸口); ἧλοι — гвозди; φιάλαι — чаши (鉢); τρύβλια — блюда (小皿); θυίσκαι — кадильницы (香炉); σύγκλειστα — кованые; θυρώματα — дверные полотна; ἅγια ἁγίων — 至聖所. Слав. 7:50."
  51: "ἀνεπληρώθη — исполнилось; τὰ ἅγια Δαυιδ — святыни Давида; θησαυρούς — сокровищницы. Слав. 7:51. Здесь в LXX кончается отдел храмовой утвари; далее (gr 7:38–50) — дворец, который в слав./МТ стоит в начале главы (7:1–12)."
