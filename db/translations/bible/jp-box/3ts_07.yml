# jp-box, 3-я Царств, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по паритету (docs/japanese-bible.md, «Паритет LXX
# и церковнославянского»); ru (Синодальный) — только для понимания, не источник.
# jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: по csl — дворец Соломона (1–12), затем мастер Хирам и убранство храма
# (13–51); в LXX порядок обратный (храм, потом дворец).
# Нумерация — славяно-синодальная (по csl-ru): 51 стих. Карта (csl ← гр):
#   7:1 = гр 7:38 + 7:50 (13 лет и завершение дома); 7:2–12 = гр 7:39–49;
#   7:13 = гр 7:1; 7:14 = гр 7:2; 7:15 = гр 7:3; 7:16 = гр 7:4; 7:17 = гр 7:5;
#   7:18 = гр 7:6; 7:19 = гр 7:8a (лилии); 7:20 = гр 7:9; 7:21 = гр 7:7 (имена
#   столпов); 7:22 = гр 7:8b (завершение столпов);
#   7:23–26 = гр 7:10–13 (море: 23=10, 24=11, 25=13, 26=12);
#   7:27–39 = гр 7:14–25 (подставы), причём 7:31 = часть гр 7:21 (междустолпия;
#   описания «уст» подставы в gr-lxx-byz нет), 7:32–34 = гр 7:18–20,
#   7:35 = другая часть гр 7:21, 7:36–39 = гр 7:22–25;
#   7:40–51 = гр 7:26–37.
# Прямой речи в главе нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст; слав. добавки
# (окончание дела столпов в 7:22, 200 гранатов в 7:20, два ряда подпор в 7:24,
# четырёхугольные промежутки в 7:31, кедровые доски в 7:44, внутренний двор
# в 7:49) внесены в основной текст без скобок, вариант LXX — в notes.
# Глосса csl «(святая святых)» в 7:49 — пояснение переводчика, в текст не внесена.
# Сносок ⟨…⟩ нет: 神殿, 契約の箱, ケルビム, 燭台, 洗い盤, 台座 уже в корпусе.
# Красного нет.
