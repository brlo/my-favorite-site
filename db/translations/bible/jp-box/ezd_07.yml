verses:
  1: "これらの出来事[できごと]の後[あと]、ペルシアの王[おう]アルタシャスタの治世[ちせい]に、エズラが上[のぼ]って来[き]た。彼[かれ]はセラヤの子[こ]、アザルヤの子[こ]、ヒルキヤの子[こ]、"
  2: "サルムの子[こ]、サドクの子[こ]、アヒトブの子[こ]、"
  3: "アマルヤの子[こ]、アザルヤの子[こ]、メラヨトの子[こ]、"
  4: "ザラヤの子[こ]、オジの子[こ]、ボカイの子[こ]、"
  5: "アビスの子[こ]、ピネハスの子[こ]、エレアザルの子[こ]、最初[さいしょ]の祭司[さいし]アロンの子[こ]である。"
  6: "このエズラはバビロンから上[のぼ]って来[き]た。彼[かれ]は、イスラエルの神[かみ]である主[しゅ]が与[あた]えたモーセの律法[りっぽう]に熟達[じゅくたつ]した学者[がくしゃ]であった。彼[かれ]が求[もと]めたすべてのことを、王[おう]は彼[かれ]に与[あた]えた。彼[かれ]の神[かみ]である主[しゅ]の手[て]が彼[かれ]の上[うえ]にあったからである。"
  7: "また、イスラエルの子[こ]ら、祭司[さいし]たち、レビ人[びと]たちのうちから、また歌[うた]い手[て]、門衛[もんえい]、神殿[しんでん]のしもべたちのうちからも、アルタシャスタ王[おう]の第七年[だいななねん]に、エルサレムへ上[のぼ]って行[い]った。"
  8: "彼[かれ]は第五[だいご]の月[つき]、すなわち王[おう]の第七年[だいななねん]に、エルサレムに着[つ]いた。"
  9: "第一[だいいち]の月[つき]の一日[ついたち]にバビロンからの旅立[たびだ]ちが始[はじ]まり、第五[だいご]の月[つき]の一日[ついたち]にエルサレムに着[つ]いた。彼[かれ]の神[かみ]の良[よ]い手[て]が彼[かれ]の上[うえ]にあったからである。"
  10: "エズラは、主[しゅ]の律法[りっぽう]を研究[けんきゅう]し、これを行[おこな]い、イスラエルで掟[おきて]と裁[さば]きを教[おし]えるために、心[こころ]を定[さだ]めていたからである。"
  11: "アルタシャスタ王[おう]が、祭司[さいし]エズラ、すなわちイスラエルに対して主[しゅ]の戒[いまし]めの言葉[ことば]とその掟[おきて]を記[しる]した書[しょ]の学者[がくしゃ]に与[あた]えた文書[ぶんしょ]の写[うつ]しは、次[つぎ]のとおりである。"
  12: "「アルタシャスタ、王[おう]の王[おう]なる者[もの]から、天[てん]の神[かみ]の律法[りっぽう]の学者[がくしゃ]である祭司[さいし]エズラへ。言葉[ことば]と答[こた]えは全[まった]うされた。"
  13: "わたしから命令[めいれい]を下[くだ]す。わたしの王国[おうこく]のうちで、イスラエルの民[たみ]、その祭司[さいし]、レビ人[びと]のうち、エルサレムへ行[い]くことを志[こころざ]す者[もの]はだれでも、あなたとともに行[い]ってよい。"
  14: "あなたは王[おう]とその七人[しちにん]の顧問[こもん]たちから遣[つか]わされ、あなたの手[て]にある神[かみ]の律法[りっぽう]に従[したが]って、ユダヤとエルサレムを視察[しさつ]する。"
  15: "また、王[おう]とその顧問[こもん]たちが、エルサレムに住[す]まわれるイスラエルの神[かみ]に惜[お]しみなくささげた銀[ぎん]と金[きん]を、主[しゅ]の家[いえ]へ運[はこ]ぶためであり、"
  16: "また、バビロンの全[ぜん]地方[ちほう]であなたが見[み]つける銀[ぎん]と金[きん]のすべて、および民[たみ]と祭司[さいし]たちがエルサレムにある自分[じぶん]たちの神[かみ]の家[いえ]のために惜[お]しみなくささげる献金[けんきん]も、合[あ]わせて携[たずさ]えて行[い]くためである。"
  17: "また、すべての収入[しゅうにゅう]も、この書[しょ]に怠[おこた]りなく記[しる]せ。雄牛[おうし]、雄羊[おひつじ]、子羊[こひつじ]、およびその献[ささ]げ物[もの]と注[そそ]ぎの献[ささ]げ物[もの]である。あなたはそれらを、エルサレムにあるあなたがたの神[かみ]の家[いえ]の祭壇[さいだん]にささげよ。"
  18: "残[のこ]った銀[ぎん]と金[きん]で、あなたとあなたの兄弟[きょうだい]たちが良[よ]いと思[おも]うことを、あなたがたの神[かみ]の御心[みこころ]にかなうままに行[おこな]いなさい。"
  19: "あなたに与[あた]えられた器[うつわ]は、あなたの神[かみ]の家[いえ]の務[つと]めのために、エルサレムの神[かみ]の前[まえ]に納[おさ]めなさい。"
  20: "あなたの神[かみ]の家[いえ]に必要[ひつよう]で、あなたが必要[ひつよう]と認[みと]める残[のこ]りのものは、王[おう]の宝物庫[たからものぐら]から出[だ]しなさい。"
  21: "わたし、アルタシャスタ王[おう]から命令[めいれい]を下[くだ]す。川向[かわむ]こうのすべての宝物庫[たからものぐら]の管理者[かんりしゃ]たちよ、祭司[さいし]エズラ、すなわち天[てん]の神[かみ]の律法[りっぽう]の学者[がくしゃ]があなたがたに求[もと]めるものは何[なん]でも、すぐに用意[ようい]せよ。"
  22: "銀[ぎん]は百[ひゃく]タラントまで、小麦[こむぎ]は百[ひゃく]コルまで、ぶどう酒[しゅ]は百[ひゃく]バトまで、油[あぶら]も百[ひゃく]バトまで、塩[しお]は数量[すうりょう]の定[さだ]めなく。"
  23: "天[てん]の神[かみ]の御心[みこころ]にあることはすべて、天[てん]の神[かみ]の家[いえ]で行[おこな]われなければならない。気[き]をつけよ。だれも天[てん]の神[かみ]の家[いえ]に手[て]を伸[の]べてはならない。王[おう]の王国[おうこく]と王[おう]、その子[こ]らたちの上[うえ]に怒[いか]りが下[くだ]らないようにするためである。"
  24: "また、あなたがたに知[し]らせる。祭司[さいし]、レビ人[びと]、歌[うた]い手[て]、門衛[もんえい]、神殿[しんでん]のしもべたち、およびこの神[かみ]の家[いえ]の奉仕者[ほうししゃ]のうち、だれにも税金[ぜいきん]を課[か]してはならない。あなたには彼[かれ]らを奴隷[どれい]にする権限[けんげん]はない。"
  25: "エズラよ、あなたの手[て]にあるあなたの神[かみ]の知恵[ちえ]に従[したが]って、さばき人[びと]と裁[さば]き手[て]を立[た]て、川向[かわむ]こうのすべての民[たみ]、すなわちあなたの神[かみ]の律法[りっぽう]を知[し]る者[もの]すべてをさばかせよ。知[し]らない者[もの]には、あなたがたは教[おし]えよ。"
  26: "あなたの神[かみ]の律法[りっぽう]と王[おう]の律法[りっぽう]を行[おこな]わない者[もの]には、ただちにさばきが下[くだ]されよ。死[し]か、懲[こ]らしめか、財産[ざいさん]の没収[ぼっしゅう]か、投獄[とうごく]かである。」"
  27: "わたしたちの父祖[ふそ]の神[かみ]である主[しゅ]はほむべきかな。主は王[おう]の心[こころ]に、エルサレムにある主[しゅ]の家[いえ]を崇[あが]めようとする思いを置[お]かれた。"
  28: "また、王[おう]とその顧問[こもん]たち、および王[おう]のすべてもろもろの力[ちから]ある長[かしら]たちの前[まえ]で、わたしに慈[いつく]しみを傾[かたむ]けられた。わたしは、わたしの神[かみ]である主[しゅ]の手[て]がわたしの上[うえ]にあったので力[ちから]づき、イスラエルから長[かしら]たちを集[あつ]めて、わたしとともに上[のぼ]るようにした。"

notes:
  1: "μετὰ τὰ ῥήματα ταῦτα — после этих событий (ῥῆμα — слово, дело); ἐν βασιλείᾳ Αρθασασθα — в царствование Артаксеркса (Αρθασασθα, アルタシャスタ); ἀνέβη — взошёл, отправился в Иудею (ἀναβαίνω — обычный глагол о возвращении из плена); υἱὸς Σαραιου — сын Сераии (セラヤ); Αζαριου — Азарии (アザルヤ); Ελκια — Хелкии (ヒルキヤ; в 1 Пар 6:13 тот же ряд). Родословие продолжается в ст. 2–5 без глагола."
  2: "Σαλουμ — Саллум (サルム; слав. «селлумля»); Σαδδουκ — Садок (サドク); Αχιτωβ — Ахитув (アヒトブ). Родительный падеж υἱοῦ повторяется при каждом имени: «(сын) Шаллума, (сын) Садока…»."
  3: "Σαμαρια — Амария (アマルヤ; в LXX Ездры форма иная, чем в 1 Пар 6:11); Εσρια — Азария (アザルヤ; слав. «есриева»); Μαρερωθ — Мераиоф (メラヨト). Имена даны в формах корпуса (1 Пар 5–6), ср. 1 Пар 6:7–13."
  4: "Ζαραια — Зерахия (ザラヤ; слав. «зараиев»); Σαουια — Уззий (オジ; слав. «езеиев»); Βοκκι — Буккий (ボカイ)."
  5: "Αβισουε — Авишуй (アビス); Φινεες — Финеес (ピネハス); Ελεαζαρ — Елеазар (エレアザル); Ααρων τοῦ ἱερέως τοῦ πρώτου — Аарона, первого священника, т. е. первосвященника (слав. «священника перваго»); родословие доведено до Аарона."
  6: "αὐτὸς Εσδρας ἀνέβη — «сам Ездра взошёл»; γραμματεὺς ταχύς — «скорый книжник», искусный в законе (ταχύς — быстрый, ловкий; слав. «писец скор»; 熟達した学者); ὃν ἔδωκεν κύριος — который дал Господь; ἔδωκεν αὐτῷ ὁ βασιλεύς — царь дал ему [всё]; χεὶρ κυρίου … ἐπ᾿ αὐτόν — рука Господа над ним; ἐν πᾶσιν, οἷς ἐζήτει — во всём, чего он искал."
  7: "ἀνέβησαν ἀπὸ υἱῶν Ισραηλ — взошли из сынов Израиля; οἱ ᾄδοντες — певцы (歌い手); οἱ πυλωροί — привратники (門衛); οἱ ναθινιμ — нефинеи, храмовые служители (в гл. 2 — 神殿のしもべたち; слав. «нафиними»); ἐν ἔτει ἑβδόμῳ τῷ Αρθασασθα — в седьмой год Артаксеркса."
  8: "ἤλθοσαν εἰς Ιερουσαλημ τῷ μηνὶ τῷ πέμπτῳ — пришли в Иерусалим в пятый месяц; τοῦτο ἔτος ἕβδομον τῷ βασιλεῖ — «это седьмой год царю» (дат. при βασιλεῖ)."
  9: "ἐν μιᾷ τοῦ μηνὸς τοῦ πρώτου — в первый день первого месяца; ἐθεμελίωσεν τὴν ἀνάβασιν — «положил основание восхождению», т. е. начал выход (θεμελιόω; слав. «нача восходити»); ἐν δὲ τῇ πρώτῃ τοῦ μηνὸς τοῦ πέμπτου — в первый день пятого месяца; χεὶρ θεοῦ … ἀγαθή — благая рука Бога."
  10: "ἔδωκεν ἐν καρδίᾳ αὐτοῦ — «положил в сердце своём» (слав. «уготова сердце»); ζητῆσαι τὸν νόμον — исследовать закон; ποιεῖν — исполнять; διδάσκειν — учить; προστάγματα καὶ κρίματα — повеления и суды (掟と裁き); csl добавляет «(Господня)» — в LXX просто «закон», добавка принята."
  11: "διασάφησις — изъяснение, список (διασαφέω — разъяснять; слав. «сказание»); διάταγμα — повеление, указ; τῷ γραμματεῖ βιβλίου λόγων ἐντολῶν κυρίου — книжнику книги слов заповедей Господних; csl добавляет «царь» (Артаксеркс) — принято; ἐπὶ τὸν Ισραηλ — для Израиля."
  12: "Αρθασασθα βασιλεὺς βασιλέων — Артаксеркс, царь царей (титул персидских царей); γραμματεῖ νόμου τοῦ θεοῦ τοῦ οὐρανοῦ — книжнику закона Бога небесного; csl добавляет «священнику» и «Господа» — приняты (祭司, 主); τετέλεσται ὁ λόγος καὶ ἡ ἀπόκρισις — «слово и ответ совершены», т. е. письмо дано в окончательной форме. С этого стиха идёт текст письма (кавычки до ст. 26)."
  13: "ἀπ᾿ ἐμοῦ ἐτέθη γνώμη — от меня положено решение; ὁ ἑκουσιαζόμενος — добровольно желающий (ἑκουσιάζομαι); ἀπὸ λαοῦ Ισραηλ καὶ ἱερέων καὶ Λευιτῶν — из народа Израиля, священников и левитов; csl добавляет «усердие благо» — принято; πορευθῆναι μετὰ σοῦ — идти с тобой."
  14: "ἀπὸ προσώπου τοῦ βασιλέως — «от лица царя»; ἑπτὰ συμβούλων — семи советников (顧問); ἀπεστάλη — ты послан (2-е л. ед. ч.); ἐπισκέψασθαι — обозреть, посетить (ἐπισκέπτομαι); νόμῳ θεοῦ αὐτῶν τῷ ἐν χειρί σου — по закону Бога их, который в руке твоей."
  15: "εἰς οἶκον κυρίου — в дом Господень; ἀργύριον καὶ χρυσίον — серебро и золото; ἃ … ἡκουσιάσθησαν — которые добровольно пожертвовали (ἑκουσιάζω, страд.); τῷ θεῷ τοῦ Ισραηλ τῷ ἐν Ιερουσαλημ κατασκηνοῦντι — Богу Израилеву, обитающему в Иерусалиме (κατασκηνόω)."
  16: "πᾶν ἀργύριον καὶ χρυσίον — всё серебро и золото; ὅ τι ἐὰν εὕρῃς — что бы ты ни нашёл; ἐν πάσῃ χώρᾳ Βαβυλῶνος — во всей области Вавилонской; μετὰ ἑκουσιασμοῦ τοῦ λαοῦ — с добровольным приношением народа (ἑκουσιασμός); τῶν ἑκουσιαζομένων — добровольно жертвующих."
  17: "πᾶν προσπορευόμενον — «всё приходящее» (προσπορεύομαι); csl понял как «всякий доход» и передал «впиши в книгу сию» (ἔνταξον ἐν βιβλίῳ τούτῳ) — принято csl; μόσχους, κριούς, ἀμνούς — тельцов, баранов, агнцев; θυσίας αὐτῶν καὶ σπονδάς — их жертвы и возлияния (σπονδή, 注ぎの献げ物); προσοίσεις ἐπὶ θυσιαστηρίου — принесёшь на жертвенник; ср. Синод., где по евр. «купи»."
  18: "εἴ τι ἐπὶ σὲ καὶ τοὺς ἀδελφούς σου ἀγαθυνθῇ — если что тебе и братьям твоим покажется хорошим (ἀγαθύνω); ἐν καταλοίπῳ — в остатке (κατάλοιπος); ὡς ἀρεστὸν τῷ θεῷ ὑμῶν — как угодно Богу вашему (ἀρεστός)."
  19: "σκεύη τὰ διδόμενά σοι — сосуды, даваемые тебе; εἰς λειτουργίαν οἴκου θεοῦ — для служения дому Божию (λειτουργία); παράδος — передай (παραδίδωμι); ἐνώπιον τοῦ θεοῦ ἐν Ιερουσαλημ — пред Богом в Иерусалиме."
  20: "κατάλοιπον χρείας — остаток нужды (χρεία); ὃ ἂν φανῇ σοι δοῦναι — что тебе покажется нужным дать; ἀπὸ οἴκων γάζης βασιλέως — из домов сокровищницы царя (γάζα)."
  21: "ἀπ᾿ ἐμοῦ, ἐγὼ Αρθασασθα — «от меня, я Артаксеркс»; ἔθηκα γνώμην — положил решение; πάσαις ταῖς γάζαις ταῖς ἐν πέρα τοῦ ποταμοῦ — всем сокровищницам за рекой; ἑτοίμως γιγνέσθω — пусть немедленно делается."
  22: "ἕως ἀργυρίου ταλάντων ἑκατὸν — серебра до ста талантов; πυροῦ κόρων ἑκατόν — пшеницы до ста коров (κόρος — мера сыпучего); οἴνου βάδων ἑκατόν — вина до ста батов (βάδος); ἐλαίου βάδων ἑκατόν — масла до ста батов; ἅλας οὗ οὐκ ἔστιν γραφή — соли, которой нет записи, т. е. без счёта (γραφή — запись)."
  23: "πᾶν, ὅ ἐστιν ἐν γνώμῃ θεοῦ — всё, что в решении Бога; γιγνέσθω — да будет; csl добавляет «в дому Бога небеснаго» — принято; προσέχετε μή τις ἐπιχειρήσῃ — смотрите, чтобы кто не посягнул (ἐπιχειρέω); μήποτε γένηται ὀργὴ ἐπὶ τὴν βασιλείαν — чтобы не было гнева на царство."
  24: "ἐγνώρισται — да будет известно (γνωρίζω); φόρος μὴ ἔστω σοι — подати да не будет тебе; οὐκ ἐξουσιάσεις καταδουλοῦσθαι — ты не имеешь власти порабощать (καταδουλόω); λειτουργοῖς οἴκου θεοῦ — служителям дома Божия; перечислены священники, левиты, певцы, привратники, нефинеи (神殿のしもべたち)."
  25: "ὡς ἡ σοφία τοῦ θεοῦ ἐν χειρί σου — по премудрости Бога твоего, которая в руке твоей; κατάστησον γραμματεῖς καὶ κριτάς — поставь книжников и судей (καθίστημι); ἵνα ὦσιν κρίνοντες — чтобы они судили; παντὶ τῷ λαῷ τῷ ἐν πέρα τοῦ ποταμοῦ — всему народу за рекой; τῷ μὴ εἰδότι γνωριεῖτε — незнающему дайте знать."
  26: "μὴ ᾖ ποιῶν — не будет исполнять; νόμον τοῦ θεοῦ καὶ νόμον τοῦ βασιλέως — закон Бога и закон царя; τὸ κρίμα ἔσται γιγνόμενον ἐξ αὐτοῦ — суд будет произведён над ним; εἰς θάνατον — на смерть; εἰς παιδείαν — в наказание (παιδεία; csl «в наказание», Синод. «на изгнание» — по евр.); εἰς ζημίαν τοῦ βίου — в лишение имущества (ζημία, βίος); εἰς δεσμά — в узы, темницу."
  27: "Εὐλογητὸς κύριος — благословен Господь; ὁ θεὸς τῶν πατέρων ἡμῶν — Бог отцов наших; ἔδωκεν ἐν καρδίᾳ τοῦ βασιλέως — вложил в сердце царя; δοξάσαι τὸν οἶκον κυρίου — прославить дом Господень (δοξάζω; 崇める). С этого стиха снова говорит Ездра."
  28: "ἐπ᾿ ἐμὲ ἔκλινεν ἔλεος — склонил ко мне милость (κλίνω); ἐν ὀφθαλμοῖς τοῦ βασιλέως — в очах царя; τῶν ἀρχόντων τοῦ βασιλέως τῶν ἐπηρμένων — князей царя, возвышенных (ἐπαίρω), т. е. могущественных; ἐκραταιώθην — укрепился (κραταιόω); συνῆξα ἀπὸ Ισραηλ ἄρχοντας — собрал из Израиля начальников."
