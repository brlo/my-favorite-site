verses:
  1: "エリシャは、息子[むすこ]を生[い]かしてもらった女[おんな]に言[い]った。「立[た]ちなさい。あなたも、あなたの家[いえ]の者[もの]も、身[み]を寄[よ]せられる所[ところ]へ行[い]って、そこに身[み]を寄[よ]せなさい。主[しゅ]がこの地[ち]に飢饉[ききん]を呼[よ]び寄[よ]せられたからだ。それは七[なな]年[ねん]の間[あいだ]、この地[ち]に及[およ]ぶ。」"
  2: "女[おんな]は立[た]ち上[あ]がり、エリシャの言葉[ことば]どおりに行[おこな]った。彼女[かのじょ]は自分[じぶん]の家[いえ]の者[もの]とともに、ペリシテ人[じん]の地[ち]に七[なな]年[ねん]の間[あいだ]住[す]んだ。"
  3: "七[なな]年[ねん]が終[お]わると、女[おんな]はペリシテ人[じん]の地[ち]から町[まち]へ戻[もど]り、自分[じぶん]の家[いえ]と畑[はたけ]のことを王[おう]に訴[うった]えに出[で]た。"
  4: "王[おう]は、神[かみ]の人[ひと]エリシャの召使[めしつか]いギエジと話[はな]していて、言[い]った。「エリシャが行[おこな]ったすべての大[おお]きなわざを、私[わたし]に話[はな]して聞[き]かせなさい。」"
  5: "彼[かれ]が、エリシャが死[し]んだ者[もの]を生[い]かしたことを王[おう]に話[はな]しているとき、ちょうど、その息子[むすこ]を生[い]かしてもらった女[おんな]が、自分[じぶん]の家[いえ]と畑[はたけ]のことを王[おう]に訴[うった]えて来[き]た。ギエジは言[い]った。「王[おう]さま、この女[おんな]だ。そして、こちらがその息子[むすこ]だ。エリシャが生[い]かした子[こ]だ。」"
  6: "王[おう]は女[おんな]に尋[たず]ね、女[おんな]はすべてを話[はな]した。そこで王[おう]は一人[ひとり]の宦官[かんがん]を彼女[かのじょ]に与[あた]えて言[い]った。「彼女[かのじょ]のものをすべて、また、彼女[かのじょ]がこの地[ち]を離[はな]れた日[ひ]から今[いま]に至[いた]るまで、その畑[はたけ]のすべての収穫[しゅうかく]を返[かえ]しなさい。」"
  7: "エリシャはダマスコに来[き]た。シリアの王[おう]ベン・ハダドは病気[びょうき]だった。人々[ひとびと]は王[おう]に告[つ]げて言[い]った。「神[かみ]の人[ひと]がここまで来[き]ている。」"
  8: "王[おう]はハザエルに言[い]った。「手[て]に贈[おく]り物[もの]を持[も]って、神[かみ]の人[ひと]に会[あ]いに行[い]き、私[わたし]がこの病気[びょうき]から生[い]き延[の]びられるかどうか、彼[かれ]を通[とお]して主[しゅ]に尋[たず]ねなさい。」"
  9: "ハザエルはエリシャに会[あ]いに行[い]き、贈[おく]り物[もの]として、ダマスコのすべての良[よ]い物[もの]を四十頭[よんじゅうとう]のらくだに負[お]わせて携[たずさ]えて行[い]った。そして来[き]て、彼[かれ]の前[まえ]に立[た]ち、エリシャに言[い]った。「あなたの子[こ]であるシリアの王[おう]ベン・ハダドが、私[わたし]をあなたのもとへ遣[つか]わして、こう言[い]わせた。『私[わたし]はこの病気[びょうき]から生[い]き延[の]びられるだろうか。』」"
  10: "エリシャは言[い]った。「行[い]って彼[かれ]に言[い]いなさい。『あなたはきっと生[い]き延[の]びる。』しかし主[しゅ]は、あなたが必[かなら]ず死[し]ぬことを私[わたし]に示[しめ]された。」"
  11: "神[かみ]の人[ひと]は彼[かれ]の前[まえ]に立[た]ち、彼[かれ]が恥[は]じ入[い]るまで、じっと彼[かれ]を見[み]つめていた。そして神[かみ]の人[ひと]は泣[な]いた。"
  12: "ハザエルは言[い]った。「なぜ、わが主[あるじ]よ、泣[な]かれるのか。」エリシャは言[い]った。「あなたがイスラエルの子[こ]らにどんな悪[わる]を行[おこな]うかを、私[わたし]は知[し]っているからだ。あなたは彼[かれ]らの要塞[ようさい]を火[ひ]で焼[や]き、彼[かれ]らの選[えら]ばれた者[もの]たちを剣[つるぎ]で殺[ころ]し、彼[かれ]らの幼子[おさなご]たちを打[う]ち砕[くだ]き、彼[かれ]らの妊婦[にんぷ]を引[ひ]き裂[さ]く。」"
  13: "ハザエルは言[い]った。「このしもべが何者[なにもの]なのだろう。死[し]んだ犬[いぬ]にすぎない私[わたし]が、どうしてそんな大[おお]きなことをするというのか。」エリシャは言[い]った。「主[しゅ]は、あなたがシリアを治[おさ]める王[おう]となることを私[わたし]に示[しめ]された。」"
  14: "彼[かれ]はエリシャのもとを去[さ]って、自分[じぶん]の主[あるじ]のもとへ行[い]った。王[おう]は彼[かれ]に言[い]った。「エリシャはあなたに何[なに]と言[い]ったか。」彼[かれ]は言[い]った。「『あなたはきっと生[い]き延[の]びる』と言[い]われた。」"
  15: "翌日[よくじつ]、彼[かれ]は毛布[もうふ]を取[と]って水[みず]に浸[ひた]し、それを王[おう]の顔[かお]に掛[か]けた。王[おう]は死[し]んだ。そしてハザエルが彼[かれ]に代[か]わって王[おう]となった。"
  16: "イスラエルの王[おう]、アハブの子[こ]ヨラムの第五年[だいごねん]、すなわちユダの王[おう]ヨシャファトの時代[じだい]に、ヨシャファトの子[こ]ヨラムがユダの王[おう]となった。"
  17: "彼[かれ]は三十二歳[さんじゅうにさい]で王[おう]となり、エルサレムで八[はち]年[ねん]治[おさ]めた。"
  18: "彼[かれ]はイスラエルの王[おう]たちの道[みち]を歩[あゆ]み、アハブの家[いえ]がしたとおりに行[おこな]った。アハブの娘[むすめ]が彼[かれ]の妻[つま]であったからである。そして主[しゅ]の目[め]の前[まえ]に悪[わる]を行[おこな]った。"
  19: "しかし主[しゅ]は、ご自分[じぶん]のしもべダビデのために、ユダを滅[ほろ]ぼそうとはされなかった。主[しゅ]が彼[かれ]とその子[こ]らに、すべての日々[ひび]、ともしびを与[あた]えると約束[やくそく]されたからである。"
  20: "彼[かれ]の時代[じだい]に、エドムはユダの手[て]から離[はな]れて背[そむ]き、自分[じぶん]たちの上[うえ]に王[おう]を立[た]てた。"
  21: "ヨラムはツァイルへ行[い]き、すべての戦車[せんしゃ]も彼[かれ]とともにあった。そして彼[かれ]が立[た]ち上[あ]がったとき、彼[かれ]を取[と]り囲[かこ]んでいたエドム人[じん]と戦車[せんしゃ]の長[かしら]たちを打[う]った。民[たみ]は天幕[てんまく]へ逃[に]げた。"
  22: "エドムは今日[こんにち]に至[いた]るまでユダの手[て]から離[はな]れて背[そむ]いた。そのとき、リブナもまた背[そむ]いた。"
  23: "ヨラムの残[のこ]りの事績[じせき]、彼[かれ]が行[おこな]ったすべてのことは、ユダの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  24: "ヨラムは先祖[せんぞ]たちとともに眠[ねむ]り、先祖[せんぞ]たちとともに父[ちち]ダビデの町[まち]に葬[ほうむ]られた。そして、その子[こ]アハズヤが彼[かれ]に代[か]わって王[おう]となった。"
  25: "イスラエルの王[おう]、アハブの子[こ]ヨラムの第十二年[だいじゅうにねん]、ヨラムの子[こ]アハズヤがユダの王[おう]となった。"
  26: "アハズヤは二十二歳[にじゅうにさい]で王[おう]となり、エルサレムで一[いち]年[ねん]治[おさ]めた。母[はは]の名[な]はアタリヤといい、イスラエルの王[おう]オムリの娘[むすめ]であった。"
  27: "彼[かれ]はアハブの家[いえ]の道[みち]を歩[あゆ]み、アハブの家[いえ]がしたように、主[しゅ]の目[め]の前[まえ]に悪[わる]を行[おこな]った。彼[かれ]はアハブの家[いえ]の婿[むこ]であったからである。"
  28: "彼[かれ]はアハブの子[こ]ヨラムとともに、異邦人[いほうじん]の王[おう]ハザエルと戦[たたか]うために、ギレアデのラモトへ行[い]った。そしてシリア人[じん]はヨラムを打[う]った。"
  29: "ヨラム王[おう]は、ラモトでシリアの王[おう]ハザエルと戦[たたか]ったときに受[う]けた傷[きず]を癒[いや]すため、イズレエルへ戻[もど]った。ユダの王[おう]、ヨラムの子[こ]アハズヤは、アハブの子[こ]ヨラムを見舞[みま]うためにイズレエルへ下[くだ]って行[い]った。ヨラムが病気[びょうき]だったからである。"

notes:
  1: "ἧς ἐζωπύρησεν τὸν υἱόν — «которой оживил сына» (ζωοπυρέω; ср. 4:8–37). παροίκει οὗ ἐὰν παροικήσῃς — «живи пришельцем там, где будешь пришельцем» (παροικέω). κέκληκεν κύριος λιμόν — «призвал Господь голод» (perfect). καί γε ἦλθεν ἐπὶ τὴν γῆν ἑπτὰ ἔτη — «и вот, пришёл на землю на семь лет» (аорист, голод уже начался); слав. «приидет» — будущее, внесено по csl."
  2: "ἀνέστη — встала. κατὰ τὸ ῥῆμα Ελισαιε — по слову Елисея (слав. «по глаголу елиссееву»). ἐν γῇ ἀλλοφύλων — в земле иноплеменников, т. е. филистимлян (ペリシテ人). παρῴκει — жила пришельцем."
  3: "μετὰ τὸ τέλος τῶν ἑπτὰ ἐτῶν — по окончании семи лет. ἐπέστρεψεν — возвратилась. βοῆσαι πρὸς τὸν βασιλέα — воззвать к царю (βοάω). περὶ τοῦ οἴκου καὶ περὶ τῶν ἀγρῶν — о доме и о полях."
  4: "Γιεζι τὸ παιδάριον — Гиезий, отрок/слуга (παιδάριον). Διήγησαι — «расскажи» (διηγέομαι). τὰ μεγάλα — великие дела."
  5: "ἐξηγουμένου — когда он рассказывал (ἐξηγέομαι). ἐζωπύρησεν υἱὸν τεθνηκότα — оживил умершего сына. βοῶσα — взывая. ἐζωπύρησεν — оживил (в 4:32–37 воскрешение)."
  6: "ἐπηρώτησεν — спросил. εὐνοῦχον ἕνα — одного евнуха (придворного), 宦官. Ἐπίστρεψον — «возврати». τὰ γενήματα τοῦ ἀγροῦ — произведения поля, урожай. ἀπὸ τῆς ἡμέρας, ἧς κατέλιπεν τὴν γῆν — с того дня, как она оставила землю."
  7: "υἱὸς Αδερ — «сын Адера», т. е. Венадад (ベン・ハダド; слав. «сын адеров»). ἠρρώστει — был болен (ἀρρωστέω). Ἥκει — «пришёл» (ἥκω). ἕως ὧδε — до этого места, сюда."
  8: "μαναα — дар, приношение (др.-евр. מִנְחָה, транслитерация в LXX); слав. «дар». εἰς ἀπαντὴν — навстречу. ἐπιζήτησον τὸν κύριον παρ᾽ αὐτοῦ — «вопроси Господа от него», через него. Εἰ ζήσομαι — «буду ли жив»."
  9: "ἄρσιν τεσσάρακοντα καμήλων — «ношу сорока верблюдов» (ἄρσις — ноша). πάντα τὰ ἀγαθὰ Δαμασκοῦ — все блага Дамаска. Ὁ υἱός σου — «сын твой», почтительное обращение подданного к царю."
  10: "Ζωῇ ζήσῃ — «жизнью жить будешь», гебраистическое усиление (слав. «живя поживеши»). θανάτῳ ἀποθανῇ — «смертью умрёшь», непременно умрёшь. Пророчество двусмысленно: от болезни царь выздоровеет, но умрёт иначе."
  11: "παρέστη τῷ προσώπῳ αὐτοῦ — «встал пред лицом его». ἔθηκεν ἕως αἰσχύνης — «положил (взор) до стыда», т. е. смотрел, пока тот не смутился (слав. «возложи (руки) даже до постыдения» — тёмное место). ἔκλαυσεν — заплакал."
  12: "Τί ὅτι — «что это, что». τὰ ὀχυρώματα — крепости (ὀχύρωμα). ἐξαποστελεῖς ἐν πυρί — «пошлёшь в огонь», предашь огню. ἐκλεκτούς — избранных. ἐνσείσεις — «потрясёшь, разобьёшь» (ἐνσείω) о младенцах. ἀναρρήξεις — «расторгнешь» беременных (ἀναρρήγνυμι)."
  13: "ὁ κύων ὁ τεθνηκώς — «мёртвый пёс», формула крайнего самоуничижения. βασιλεύοντα ἐπὶ Συρίαν — царствующим над Сирией."
  14: "ἀπῆλθεν — ушёл. πρὸς τὸν κύριον αὐτοῦ — к господину своему, царю (слав. добавляет в скобках «(царь)» — пояснение). Εἶπέν μοι Ζωῇ ζήσῃ — сказал мне: жизнью жить будешь."
  15: "τὸ μαχμα — покрывало, одеяло (слово евр. происхождения; слав. «одеяло»). ἔβαψεν ἐν τῷ ὕδατι — намочил в воде. περιέβαλεν ἐπὶ τὸ πρόσωπον — накинул на лицо; способ удушения. ἐβασίλευσεν Αζαηλ ἀντ αὐτοῦ — воцарился Азаил вместо него."
  16: "В LXX: Ἐν ἔτει πέμπτῳ τῷ Ιωραμ υἱῷ Αχααβ βασιλεῖ Ισραηλ ἐβασίλευσεν Ιωραμ υἱὸς Ιωσαφατ — без «и Иосафата царя иудина»; слав. добавление внесено в текст. Двойной Иорам: израильский (сын Ахава) и иудейский (сын Иосафата)."
  17: "υἱὸς τριάκοντα καὶ δύο ἐτῶν — сын тридцати двух лет; ὀκτὼ ἔτη — восемь лет. Формула летописи."
  18: "ἐπορεύθη ἐν ὁδῷ βασιλέων Ισραηλ — пошёл путём царей Израиля. θυγάτηρ Αχααβ ἦν αὐτῷ εἰς γυναῖκα — дочь Ахава была ему в жёны (Гофолия, 8:26). τὸ πονηρὸν ἐνώπιον κυρίου — злое пред Господом."
  19: "διαφθεῖραι — погубить (διαφθείρω). διὰ Δαυιδ τὸν δοῦλον αὐτοῦ — ради Давида, раба Своего. δοῦναι αὐτῷ λύχνον — дать ему светильник, т. е. потомство и царский род."
  20: "ἠθέτησεν — отложился, восстал (ἀθετέω). ὑποκάτωθεν χειρὸς Ιουδα — «из-под руки Иуды», из-под власти. ἐβασίλευσαν ἐφ᾽ ἑαυτούς — поставили над собой царя."
  21: "εἰς Σιωρ — в Сиор (слав. «Сиор»; Синод. «Цаир»), вероятно евр. Цаир, ツァイル. ἐγένετο αὐτοῦ ἀναστάντος — «было, когда он встал». ἐπάταξεν — поразил. τὸν κυκλώσαντα ἐπ᾽ αὐτόν — окружившего его. ἄρχοντες τῶν ἁρμάτων — начальники колесниц. εἰς τὰ σκηνώματα — в шатры."
  22: "ἕως τῆς ἡμέρας ταύτης — до сего дня. τότε ἠθέτησεν Λοβενα — тогда отложилась Ливна (Λοβενα; слав. «ловна»), リブナ. ἐν τῷ καιρῷ ἐκείνῳ — в то время."
  23: "τὰ λοιπὰ τῶν λόγων — прочее словес. βιβλίον λόγων τῶν ἡμερῶν — книга слов дней, летопись. Формула отсылки к летописи."
  24: "ἐκοιμήθη μετὰ τῶν πατέρων — почил с отцами. ἐτάφη — погребён. ἐν πόλει Δαυιδ — в городе Давида. Οχοζιας υἱὸς αὐτοῦ — Охозия (Ахазия), сын его."
  25: "Ἐν ἔτει δωδεκάτῳ — в двенадцатый год. В LXX при Охозии нет «царя иудина»; слав. «сын иорама царя иудина» — внесено. Ср. 9:29 (одиннадцатый год) — расхождение LXX и евр. текста."
  26: "εἴκοσι καὶ δύο ἐτῶν — двадцати двух лет. ἐνιαυτὸν ἕνα — один год. Γοθολια — Гофолия (アタリヤ, слав. «гофолиа»). θυγάτηρ Αμβρι — дочь Амврия (オムリ), т. е. из дома Амврия."
  27: "καθὼς ὁ οἶκος Αχααβ — как дом Ахава. В LXX нет «зять бо бе дому Ахаавлю» (он был зятем дома Ахава); слав. добавление внесено."
  28: "μετὰ Αζαηλ βασιλέως ἀλλοφύλων — с Азаилом, царём иноплеменников; в LXX ἀλλόφυλοι здесь, вероятно, вместо «Сирии» (слав. «иноплеменнича», Синод. «Сирийским»). ἐν Ρεμμωθ Γαλααδ — в Рамофе Галаадском (ギレアデのラモト). ἐπάταξαν οἱ Σύροι — поразили Сирияне."
  29: "τοῦ ἰατρευθῆναι — чтобы лечиться (ἰατρεύω). ἀπὸ τῶν πληγῶν — от ран. ἐν τῷ πολεμεῖν — когда воевал. κατέβη τοῦ ἰδεῖν — сошёл посмотреть. ἠρρώστει — болел. Слав. добавляет при Охозии «царь иудин» — внесено."
