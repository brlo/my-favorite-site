# jp-box, 4-я Царств, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 8: земля сунамитянки возвращается ей (1–6); Елисей в Дамаске,
# пророчество о смерти Венадада и воцарении Азаила (7–15); Иорам иудейский
# (16–24); Охозия иудейский (25–29).
# Речь — 「…」, вложенная — 『…』. Красного нет.
# Нумерация по gr: 29 стихов, совпадает с csl/ru.
# 〔…〕 нет: на месте всех стихов есть текст.
# Паритет: слав. добавления внесены в основной текст без скобок (16 «и Иосафата
# царя иудина», 25 и 29 «царь иудин», 27 «зять бо бе дому Ахаавлю»); варианты
# LXX — в notes.
# Сносок ⟨…⟩ нет: 神の人, 畑, 宦官, 戦車, 日誌 уже в корпусе.
# jp-ni не использовался.

