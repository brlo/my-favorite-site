# 14–28 тайная беседа с царём: «если выйдешь — будешь жив», страх царя перед иудеями,
# совет скрыть разговор, пророк остаётся во дворе стражи.
# Голоса: 1 — авторский текст; 2–3 — 「…」 (слово Господа); 4 — 「…」 (речь князей);
# 5 — 「…」 (слова царя); 6–8 — авторский текст; 9 — 「…」 (речь Авдемелеха);
# 10 — 「…」 (повеление царя); 11–13 — авторский текст; 12 — 「…」 (слова Авдемелеха);
# 14–16 — «…» (царь, затем пророк); 17–18 — 「…» (слово Господа в устах пророка);
# 19 — 「…」 (царь); 20–23 — 「…」 (пророк; в 22 слова жён — 『…』); 24–26 — 「…»
