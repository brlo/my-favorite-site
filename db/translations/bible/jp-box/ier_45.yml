verses:
  1: "預言者[よげんしゃ]エレミヤがバルク、ネリヤの子[こ]に語[かた]った言葉[ことば]は次[つぎ]のとおりである。それは、ユダの王[おう]ヨヤキムの第四年[だいよんねん]に、バルクがエレミヤの口[くち]からこれらの言葉[ことば]を書[か]き物[もの]に記[しる]したときのことである。"
  2: "主[しゅ]はあなたについてこう言[い]われる。"
  3: "「あなたは言[い]った。『ああ、わたしは不幸[ふこう]だ。ああ、わたしは不幸[ふこう]だ。主[しゅ]がわたしの苦[くる]しみに労苦[ろうく]を加[くわ]えられた。わたしは嘆[なげ]きながら眠[ねむ]りにつき、安[やす]らぎを得[え]なかった』と。"
  4: "彼に言[い]え。主[しゅ]はこう言[い]われる。見[み]よ、わたしが建[た]てたものを、わたしが壊[こわ]し、わたしが植[う]えたものを、わたしが抜[ぬ]き去[さ]る。この地[ち]も、すべて。"
  5: "あなたは自分[じぶん]のために大[おお]きなことを求[もと]めているのか。求[もと]めるな。見[み]よ、わたしはすべての肉[にく]なる者[もの]に災[わざわ]いを下[くだ]す、と主[しゅ]は言[い]われる。あなたの魂[たましい]は、あなたがどこへ行[い]っても、獲物[えもの]として与[あた]えられる。」"

notes:
  1: "Ὁ λόγος, ὃν ἐλάλησεν Ιερεμιας ὁ προφήτης πρὸς Βαρουχ υἱὸν Νηριου — «слово, которое сказал Иеремия пророк Варуху, сыну Нирии»; ὅτε ἔγραφεν τοὺς λόγους τούτους ἐν τῷ βιβλίῳ ἀπὸ στόματος Ιερεμιου — «когда он записывал эти слова в книгу из уст Иеремии»; ἐν τῷ ἐνιαυτῷ τῷ τετάρτῳ τῷ Ιωακιμ υἱῷ Ιωσια βασιλέως Ιουδα — «в четвёртый год Иоакима, сына Иосии, царя Иудейского». Это слово в слав. вынесено в главу 45: gr 51:31–35 = слав. 45:1–5, номер в номер; в LXX оно стоит в конце книги Иеремии."
  2: "Οὕτως εἶπεν κύριος ἐπὶ σοί, Βαρουχ — «так говорит Господь о тебе, Варух». Вводная формула, кавычек нет; речь Господа открывается в 33."
  3: "Ὅτι εἶπας — «ибо ты сказал»: слова Варуха даны вложенной речью 『…』; Οἴμμοι οἴμμοι — «горе мне, горе мне» (οἴμμοι — возглас скорби); ὅτι προσέθηκεν κύριος κόπον ἐπὶ πόνον μοι — «ибо Господь приложил труд к болезни моей» (πόνος — боль, страдание); ἐκοιμήθην ἐν στεναγμοῖς — «я уснул в стенаниях» (στεναγμός — стенание); ἀνάπαυσιν οὐχ εὗρον — «покоя не нашёл»."
  4: "εἰπὸν αὐτῷ — «скажи ему»; Ἰδοὺ οὓς ἐγὼ ᾠκοδόμησα, ἐγὼ καθαιρῶ — «вот, что Я построил, Я разрушаю»; οὓς ἐγὼ ἐφύτευσα, ἐγὼ ἐκτίλλω — «что Я насадил, Я искореняю»; слав. добавляет «и всю землю мою» (この地も、すべて) — нет в LXX, внесено в текст без скобок."
  5: "καὶ σὺ ζητεῖς σεαυτῷ μεγάλα; — «и ты ищешь себе великого?»; μὴ ζητήσῃς — «не ищи»; ἐγὼ ἐπάγω κακὰ ἐπὶ πᾶσαν σάρκα — «Я навожу бедствия на всякую плоть»; δώσω τὴν ψυχήν σου εἰς εὕρεμα — «дам душу твою в находку (добычу)» (εὕρεμα — находка, 獲物); ἐν παντὶ τόπῳ, οὗ ἐὰν βαδίσῃς ἐκεῖ — «на всяком месте, куда бы ты ни пошёл». Здесь закрываются слово Господа и глава."
