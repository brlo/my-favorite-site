verses:
  0: "ダビデの詩[うた]。ゴリアトに対[たい]するもの。"
  1: "わたしの神[かみ]である主[しゅ]は、ほむべきかな。主[しゅ]はわたしの手[て]を戦[いくさ]に、わたしの指[ゆび]を戦[たたか]いに教[おし]えられる。"
  2: "わたしのあわれみ、わたしの避[ひ]けどころ、わたしの守[まも]り、わたしの救[すく]い主[ぬし]、わたしの盾[たて]である主[しゅ]に、わたしは寄[よ]り頼[たの]む。主[しゅ]はわたしの民[たみ]をわたしの足[あし]もとに従[したが]わせられる。"
  3: "主[しゅ]よ、人[ひと]とは何[なに]ものか、あなたがこれを知[し]っておられるとは。人[ひと]の子[こ]とは何[なに]ものか、あなたがこれを顧[かえり]みられるとは。"
  4: "人[ひと]はむなしいものに似[に]て、その日[ひ]々[び]は過[す]ぎ去[さ]る影[かげ]のようである。"
  5: "主[しゅ]よ、あなたの天[てん]を傾[かたむ]けて降[くだ]り、山[やま]に触[ふ]れてください。山[やま]は煙[けむり]を上[あ]げる。"
  6: "稲妻[いなずま]を光[ひか]らせて彼[かれ]らを散[ち]らし、あなたの矢[や]を放[はな]って彼[かれ]らをかき乱[みだ]してください。"
  7: "高[たか]いところからあなたの手[て]を伸[の]べ、わたしを救[すく]い出[だ]してください。大水[おおみず]から、異[い]国の者[もの]たちの手[て]から、わたしを助[たす]け出[だ]してください。"
  8: "彼[かれ]らの口[くち]はむなしいことを語[かた]り、その右[みぎ]の手[て]は不[ふ]義[ぎ]の右[みぎ]の手[て]である。"
  9: "神[かみ]よ、わたしはあなたに新[あたら]しい歌[うた]を歌[うた]い、十[じゅう]弦[げん]の竪琴[たてごと]で、あなたにほめ歌[うた]を歌[うた]います。"
  10: "あなたは王[おう]たちに救[すく]いを与[あた]え、あなたの僕[しもべ]ダビデを悪[わる]い剣[つるぎ]から贖[あがな]い出[だ]される方[かた]である。"
  11: "わたしを異[い]国の者[もの]たちの手[て]から救[すく]い出[だ]してください。彼[かれ]らの口[くち]はむなしいことを語[かた]り、その右[みぎ]の手[て]は不[ふ]義[ぎ]の右[みぎ]の手[て]である。"
  12: "わたしたちの息子[むすこ]たちは、若[わか]いときから根[ね]を張[は]った苗木[なえぎ]のようであり、わたしたちの娘[むすめ]たちは、宮[みや]のように美[うつく]しく飾[かざ]られた。"
  13: "わたしたちの倉[くら]は満[み]ちあふれ、あれもこれもと溢[あふ]れ出[で]、わたしたちの羊[ひつじ]は野[の]に幾千[いくせん]となく増[ふ]える。"
  14: "わたしたちの牛[うし]は太[ふと]っている。破[やぶ]れ目[め]もなく、抜[ぬ]け道[みち]もなく、わたしたちの広場[ひろば]に叫[さけ]び声[ごえ]もない。"
  15: "このようなものを持つ民[たみ]は幸[さいわ]いである。主[しゅ]をその神[かみ]とする民[たみ]は幸[さいわ]いである。"

notes:
  0: "Τῷ Δαυιδ, πρὸς τὸν Γολιαδ — ダビデの詩。ゴリアトに対するもの (Γολιαδ — ゴリアト). Надписание — стих 0."
  1: "Εὐλογητὸς κύριος ὁ θεός μου — わたしの神である主は、ほむべきかな (формула благословения, как в Пс 27:6; 65:20). ὁ διδάσκων τὰς χεῖράς μου εἰς παράταξιν — わたしの手を戦に教え (παράταξις — «боевой строй»). τοὺς δακτύλους μου εἰς πόλεμον — わたしの指を戦いに (πόλεμος — «война»)."
  2: "ἔλεός μου καὶ καταφυγή μου — わたしのあわれみ、わたしの避けどころ (καταφυγή — «убежище»). ἀντιλήμπτωρ μου καὶ ῥύστης μου — わたしの守り、わたしの救い主 (ἀντιλήμπτωρ — «заступник»; ῥύστης — «избавитель»). ὑπερασπιστής μου — わたしの盾 (ὑπερασπίζω — «защищать»). ὁ ὑποτάσσων τὸν λαόν μου ὑπ᾽ ἐμέ — わたしの民をわたしの足もとに従わせる (ὑποτάσσω — «покорять»)."
  3: "τί ἐστιν ἄνθρωπος, ὅτι ἐγνώσθης αὐτῷ — 人とは何ものか、あなたがこれを知っておられるとは (γινώσκομαι — «быть знаемым»). ἢ υἱὸς ἀνθρώπου, ὅτι λογίζῃ αὐτόν — 人の子とは何ものか、あなたがこれを顧みられるとは (λογίζομαι — «считать, вменять»)."
  4: "ἄνθρωπος ματαιότητι ὡμοιώθη — 人はむなしいものに似て (ματαιότης — «суета»; ὁμοιόω — «уподоблять»). αἱ ἡμέραι αὐτοῦ ὡσεὶ σκιὰ παράγουσιν — その日々は過ぎ去る影のようである (σκιά — «тень»; παράγω — «проходить»)."
  5: "κλῖνον οὐρανούς σου καὶ κατάβηθι — あなたの天を傾けて降り (κλίνω — «наклонять»). ἅψαι τῶν ὀρέων, καὶ καπνισθήσονται — 山に触れてください、山は煙を上げる (ἅπτομαι — «касаться»; καπνίζω — «дымиться»)."
  6: "ἄστραψον ἀστραπὴν καὶ σκορπιεῖς αὐτούς — 稲妻を光らせて彼らを散らし (ἀστράπτω — «сверкать»; σκορπίζω — «рассеивать»). ἐξαπόστειλον τὰ βέλη σου καὶ συνταράξεις αὐτούς — あなたの矢を放って彼らをかき乱してください (βέλος — «стрела»; συνταράσσω — «приводить в смятение»)."
  7: "ἐξαπόστειλον τὴν χεῖρά σου ἐξ ὕψους — 高いところからあなたの手を伸べ (ὕψος — «высота»). ἐξελοῦ με καὶ ῥῦσαί με ἐξ ὑδάτων πολλῶν — 大水からわたしを救い出し、助け出してください. ἐκ χειρὸς υἱῶν ἀλλοτρίων — 異国の者たちの手から (ἀλλότριος — «чужой»)."
  8: "ὧν τὸ στόμα ἐλάλησεν ματαιότητα — 彼らの口はむなしいことを語り (ματαιότης — «суета, пустое»). ἡ δεξιὰ αὐτῶν δεξιὰ ἀδικίας — その右の手は不義の右手 (ἀδικία — «неправда»; рука как орудие клятвы и договора)."
  9: "ᾠδὴν καινὴν ᾄσομαί σοι — 新しい歌をあなたに歌い (καινός — «новый»). ἐν ψαλτηρίῳ δεκαχόρδῳ ψαλῶ σοι — 十弦の竪琴で、あなたにほめ歌を歌います (ψαλτήριον — 竪琴; δεκάχορδος — «десятиструнный»)."
  10: "τῷ διδόντι τὴν σωτηρίαν τοῖς βασιλεῦσιν — 王たちに救いを与え. τῷ λυτρουμένῳ Δαυιδ τὸν δοῦλον αὐτοῦ ἐκ ῥομφαίας πονηρᾶς — あなたの僕ダビデを悪い剣から贖い出す (λυτρόω — «искупать, избавлять»; ῥομφαία — «меч»). Датив продолжает 9: «пою Тебе, подающему…»; по-японски передано отдельным сказуемым."
  11: "ῥῦσαί με καὶ ἐξελοῦ με ἐκ χειρὸς υἱῶν ἀλλοτρίων — 異国の者たちの手からわたしを救い出してください (повтор 7). ὧν τὸ στόμα ἐλάλησεν ματαιότητα — 彼らの口はむなしいことを語り. ἡ δεξιὰ αὐτῶν δεξιὰ ἀδικίας — その右の手は不義の右手 (повтор 8 сохранён буквально)."
  12: "ὧν οἱ υἱοὶ ὡς νεόφυτα ἡδρυμμένα ἐν τῇ νεότητι αὐτῶν — 息子たちは、若いときから根を張った苗木のようであり (νεόφυτον — «молодое растение»; ἱδρύω — «укоренять»). αἱ θυγατέρες αὐτῶν κεκαλλωπισμέναι περικεκοσμημέναι ὡς ὁμοίωμα ναοῦ — 娘たちは宮のように美しく飾られた (καλλωπίζω — «украшать»; ὁμοίωμα ναοῦ — «подобие храма», буквально; 柱 — домысел jp-joc, не добавлен)."
  13: "τὰ ταμιεῖα αὐτῶν πλήρη ἐξερευγόμενα ἐκ τούτου εἰς τοῦτο — 倉は満ちあふれ、あれもこれもと溢れ出し (ταμεῖον — «житница»; ἐξερεύγομαι — «изрыгать»). τὰ πρόβατα αὐτῶν πολυτόκα πληθύνοντα ἐν ταῖς ἐξόδοις αὐτῶν — 羊は野に幾千となく増える (πολυτόκος — «многоплодный»)."
  14: "οἱ βόες αὐτῶν παχεῖς — 牛は太っている (βόες — «волы»; παχύς — «тучный»). οὐκ ἔστιν κατάπτωμα φραγμοῦ — 破れ目もなく (κατάπτωμα — «обвал»; φραγμός — «ограда»). οὐδὲ διέξοδος — 抜け道もなく (διέξοδος — «выход, проход»). οὐδὲ κραυγὴ ἐν ταῖς πλατείαις αὐτῶν — 広場に叫び声もない (κραυγή — «вопль»)."
  15: "ἐμακάρισαν τὸν λαόν, ᾧ ταῦτά ἐστιν — このようなものを持つ民は幸いである (μακαρίζω — «ублажать»). μακάριος ὁ λαός, οὗ κύριος ὁ θεὸς αὐτοῦ — 主をその神とする民は幸いである."
