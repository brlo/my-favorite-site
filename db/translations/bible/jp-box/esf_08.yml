# jp-box, Есфирь, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: имущество Амана и перстень (1–2), слёзная просьба Есфири (3–6), ответ
# царя (7–8), новый указ (9–12), указ и письмо царя — Добавление E (13), гонцы,
# слава Мардохея и радость иудеев (14–17).
# Прямая речь: Есфирь (5–6), царь (7–8), письмо царя (13, в «…»). Красного и синего нет.
# Нумерация по gr: 17 стихов. Особенность модуля: в ст. 13 целиком влито Добавление E
# (подстихи 13a–13ac, письмо царя в пользу иудеев, около 4 000 знаков) — переведено
# внутри ст. 13, подстихи не выводились; 13z–13ac в греч. дословно повторяют
# 8:14–8:17 (в слав. письмо кончается на 13y).
# Карта csl: csl 8:13–8:24 = письмо (наш 8:13), csl 8:25 = наш 8:14,
# csl 8:26 = наш 8:15, csl 8:27 = наш 8:16, csl 8:28 = наш 8:17.
# 〔…〕 нет: все стихи есть в gr-lxx-byz (в модуле пусты 8:18–8:28 — текст письма
# стоит в 8:13). Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): アルタシャスタ, エステル, モルデカイ,
# アマン, アマダト, ニサ, アダル, マケドニア人 (Аман в письме); ブガタン — в гл. 7.

