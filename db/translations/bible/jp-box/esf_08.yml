# jp-box, Есфирь, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Есфири нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: имущество Амана и перстень (1–2), слёзная просьба Есфири (3–6), ответ
# царя (7–8), новый указ (9–12), письмо царя — Добавление E (13–24), гонцы,
# слава Мардохея и радость иудеев (25–28).
# Прямая речь: Есфирь (5–6), царь (7–8), письмо царя (13–24, в 「…」). Красного и синего нет.
# Нумерация — славяно-синодальная (csl): 28 стихов. Письмо (Добавление E, подстихи
# 13a–13ac; в gr-lxx-byz всё стоит в одном 8:13) разрезано по слав. границам на
# двенадцать стихов 13–24: 13 — надпись и адрес (13a), 14–17 — рассуждение о
# временщиках (13b–13h), 18 — об Амане (13k–13o), 19 — об иудеях (13p–13q),
# 20–24 — распоряжения (13r–13y). Границы проходят внутри цитаты: на каждом стыке
# 「…」 закрываются и открываются заново (продолжение письма отмечено в notes).
# 13z–13ac (всадники, слава Мардохея, свет у иудеев, обрезание язычников) в слав.
# письмо не входят (оно кончается на 13y = csl 8:24): в модуле они стоят отдельными
# стихами gr 8:14–8:17 и у нас — 8:25–28 (csl 8:25–8:28).
# Карта csl: csl 8:13–8:24 = наши 8:13–8:24 (письмо), csl 8:25 = наш 8:25,
# csl 8:26 = наш 8:26, csl 8:27 = наш 8:27, csl 8:28 = наш 8:28.
# 〔…〕 нет: все стихи есть в gr-lxx-byz (gr 8 содержит только 17 стихов — текст
# письма стоит целиком в gr 8:13); после разрезания счёт совпадает с csl.
# Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX): アルタシャスタ, エステル, モルデカイ,
# アマン, アマダト, ニサ, アダル, マケドニア人 (Аман в письме); ブガタン — в гл. 7.

