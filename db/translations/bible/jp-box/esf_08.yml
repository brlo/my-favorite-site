verses:
  1: "その日[ひ]、王[おう]アルタシャスタは、中傷[ちゅうしょう]する者[もの]アマンに属[ぞく]していたすべてを、エステルに与[あた]えた。モルデカイは王[おう]の前[まえ]に呼[よ]ばれた。エステルが、彼[かれ]は自分[じぶん]の親族[しんぞく]であると告[つ]げたからである。"
  2: "王[おう]は、アマンから取[と]り上[あ]げた指輪[ゆびわ]を手[て]にし、モルデカイに与[あた]えた。エステルは、アマンに属[ぞく]するすべての上[うえ]にモルデカイを立[た]てた。"
  3: "エステルはさらに王[おう]に語[かた]り続[つづ]け、その足[あし]もとに身[み]を投[な]げ伏[ふ]して泣[な]き、アマンの悪意[あくい]と、彼[かれ]がユダヤ人[じん]たちに対[たい]して抱[いだ]いた企[くわだ]てとを取[と]り除[のぞ]いてくださるよう願[ねが]った。"
  4: "王[おう]はエステルに黄金[おうごん]の王笏[おうしゃく]を差[さ]し伸[の]べた。エステルは起[お]き上[あ]がって、王[おう]の前[まえ]に立[た]った。"
  5: "エステルは言[い]った。「もしあなたが良[よ]しと思[おも]い、わたしが恵[めぐ]みを見出[みいだ]したのなら、アマンが送[おく]り、あなたの王国[おうこく]にいるユダヤ人[じん]たちを滅[ほろ]ぼすために書[か]き記[しる]した書簡[しょかん]を撤回[てっかい]させるよう、お命[めい]じください。"
  6: "どうしてわたしは、自分[じぶん]の民[たみ]の苦[くる]しみを見[み]ていられようか。どうしてわたしは、自分の祖国[そこく]の滅[ほろ]びの中で救[すく]われ得[え]ようか。」"
  7: "王[おう]はエステルに言[い]った。「見[み]よ、わたしはアマンの全[すべ]ての財産[ざいさん]をあなたに与[あた]え、彼[かれ]自身[じしん]はユダヤ人[じん]に手[て]を伸[の]べたゆえに柱[はしら]にかけた。まだ何[なに]を求[もと]めるのか。"
  8: "あなたがたも、わたしの名[な]によって、あなたがたが良[よ]いと思[おも]うように書[か]き、わたしの指輪[ゆびわ]で封印[ふういん]せよ。王[おう]が命[めい]じて書かれるもの、わたしの指輪で封印されるものには、だれも逆[さから]えないからである。」"
  9: "その年[とし]の第一[だいいち]の月[つき]、すなわちニサの二十三日[にじゅうさんにち]に、書記[しょき]たちが呼[よ]ばれた。そして、モルデカイが命[めい]じたすべてが、ユダヤ人[じん]たちに、またインドからエチオピアに至[いた]る百二十七[ひゃくにじゅうなな]の太守領[たいしゅりょう]の管理[かんり]する者[もの]たちと太守[たいしゅ]たちの長[ちょう]たちに、国[くに]ごとにそれぞれの言葉[ことば]に従[したが]って書[か]かれた。"
  10: "王[おう]の命[めい]によって書[か]き記[しる]され、その指輪[ゆびわ]で封印[ふういん]されて、書簡[しょかん]は書[しょ]を運[はこ]ぶ者[もの]たちによって送[おく]り出[だ]された。"
  11: "すべての都[みやこ]で自分[じぶん]たちの法[ほう]を用[もち]い、自分たちを助[たす]け、自分たちの敵[てき]や、自分たちに敵対[てきたい]する者[もの]たちに、彼[かれ]らが望[のぞ]むように対[たい]することを、彼らに命[めい]じたのである。"
  12: "アルタシャスタの王国[おうこく]のすべてにおいて、第十二[だいじゅうに]の月[つき]、すなわちアダルの十三日[じゅうさんにち]、一日[いちにち]のうちに。"
  13: "この書簡[しょかん]の写[うつ]しは、次[つぎ]に記[しる]すとおりである。「大[だい]いなる王[おう]アルタシャスタは、インドからエチオピアに至[いた]る百二十七[ひゃくにじゅうなな]の太守領[たいしゅりょう]の国[くに]の長[ちょう]たち、およびわたしたちの考[かんが]えを抱[いだ]く者[もの]たちに、挨拶[あいさつ]を送[おく]る。多[おお]くの者[もの]は、恩人[おんじん]たちの最[もっと]も大[おお]きな善意[ぜんい]によってたびたび敬[うやま]われながら、かえって高慢[こうまん]になり、わたしたちに従[したが]う者[もの]たちを害[がい]しようとするだけでなく、満[み]ち足[た]りを担[にな]いきれずに、自分[じぶん]たちの恩人にも計[はか]りごとを巡[めぐ]らそうとする。人々[ひとびと]から感謝[かんしゃ]を奪[うば]い去[さ]るだけでなく、善[ぜん]に疎[うと]い者[もの]たちの誇[ほこ]りに高[たか]ぶらされて、すべてを常[つね]に眺[なが]めおろす神[かみ]が悪[あく]を憎[にく]んで下[くだ]す裁[さば]きを免[まぬか]れ得[え]ると考[かんが]えている。またしばしば、権力[けんりょく]の座[ざ]に置[お]かれ、友人[ゆうじん]たちの事[こと]を任[まか]された多[おお]くの者を、甘言[かんげん]が無実[むじつ]の血[ち]の共犯者[きょうはんしゃ]とし、いえぬ患[わずら]いをまとわせてきた。悪意[あくい]の偽[いつわ]りの理屈[りくつ]が、支配[しはい]する者[もの]たちの清[きよ]い善意を欺[あざむ]いたからである。そして、このことを見[み]ることはできる。それは、わたしたちが伝[つた]えてきた古[ふる]い歴史[れきし]からよりも、あなたがたが足[あし]もとを調[しら]べるなら明[あき]らかな、ふさわしくもない者[もの]たちが支配[しはい]することの害毒[がいどく]によって不敬[ふけい]にも行[おこな]われたことからである。また、これから後[のち]のことに心[こころ]を配[くば]り、変更[へんこう]を加[くわ]えず、目[め]の前[まえ]に来[き]ることをいつもより穏[おだ]やかな応対[おうたい]をもって見分[みわ]けながら、わたしたちがすべての人[ひと]に、平和[へいわ]のうちに乱[みだ]れのない王国[おうこく]を備[そな]え与[あた]えるためである。というのも、アマダトの子[こ]アマンはマケドニア人[じん]であって、真[しん]にペルシアの血とは縁[えん]がなく、わたしたちの善意からも遠[とお]く隔[へだ]たっていたのに、わたしたちのもとに客[きゃく]として迎[むか]えられ、わたしたちがすべての民[たみ]に抱[いだ]く人[ひと]への慈[いつく]しみを、それほどまでに受[う]けた。そのため、わたしたちの父[ちち]と唱[とな]えられ、すべての者[もの]に敬[うやま]われて、王[おう]の王座[おうざ]の次[つぎ]の席[せき]にあり続[つづ]けた。しかし、その高慢に耐[た]えきれず、わたしたちから支配と息[いき]とを奪[うば]おうと企[くわだ]て、わたしたちの救[すく]い主[ぬし]であり、いつも恩[おん]を施[ほどこ]す者[もの]であるモルデカイと、この王国の汚[けが]れなき伴[とも]であるエステルとを、その民[たみ]すべてとともに、さまざまに絡[から]み合[あ]った方法[ほうほう]の欺[あざむ]きによって滅[ほろ]びに渡[わた]すことを求[もと]めた。こうした手立[てだ]てによって、わたしたちを孤立[こりつ]させてしまえば、ペルシアの支配をマケドニア人[じん]たちに移[うつ]し替[か]えられると考[かんが]えたのである。しかし、わたしたちは、かの三度[みたび]も呪[のろ]わしい者[もの]によって滅[ほろ]びに渡[わた]されたユダヤ人[じん]たちが、悪[わる]いことを行[おこな]う者[もの]ではなく、最[もっと]も正[ただ]しい法[ほう]によって暮[く]らしているのを見出[みいだ]す。彼[かれ]らは、いと高[たか]く、最も大[おお]いなる、生[い]ける神[かみ]の子[こ]らである。その神は、わたしたちにも、わたしたちの先祖[せんぞ]にも、王国を最も良い状態[じょうたい]に治[おさ]めてくださる。それゆえ、あなたがたは、アマダトの子アマンが送[おく]った書簡を用[もち]いないなら、よく事[こと]を運[はこ]ぶことになる。それは、これらを行[おこな]ったその者[もの]自身[じしん]が、家[いえ]のすべてとともにスサの門[もん]の前[まえ]で柱[はしら]にかけられたからである。すべてを支配する神[かみ]が、すみやかに彼[かれ]にふさわしい裁[さば]きを返[かえ]されたのである。この書簡の写[うつ]しをあらゆる場所[ばしょ]に大胆[だいたん]に掲[かか]げ、ユダヤ人[じん]たちが自分[じぶん]たちの法を用[もち]いるのを許[ゆる]し、彼[かれ]らに力[ちから]を添[そ]えて、苦難[くなん]の時[とき]に彼[かれ]らに襲[おそ]いかかる者[もの]たちを、第十二[だいじゅうに]の月[つき]アダルの十三日[じゅうさんにち]、その同[おな]じ日[ひ]に防[ふせ]ぎ返[かえ]させよ。すべてを支配する神が、この日[ひ]を、選[えら]ばれた民[たみ]の滅[ほろ]びに代[か]えて、彼[かれ]らにとっての喜[よろこ]びとしたからである。だから、あなたがたも、自分[じぶん]たちの名[な]を冠[かぶ]した祭[まつ]りにおいて、この特[とく]別[べつ]な日を、あらゆる宴[うたげ]とともに過[す]ごせ。そうすれば、今[いま]も後[のち]も、わたしたちと、わたしたちに好意[こうい]を抱[いだ]くペルシア人[じん]とに救[すく]いがあり、わたしたちに計[はか]りごとを企[くわだ]てる者[もの]には滅[ほろ]びの記念[きねん]となる。しかし、すべての都[みやこ]や地方[ちほう]は、これに従[したが]って行[おこな]わないなら、怒[いか]りとともに槍[やり]と火[ひ]によって焼[や]き尽[つ]くされる。それは人[ひと]が通[とお]れないばかりか、獣[けもの]や鳥[とり]にも、いつの世[よ]までも最も忌[い]むべき所[ところ]とされる。この写[うつ]しは、王国のすべてに、目[め]に明[あき]らかなように掲[かか]げられよ。また、ユダヤ人[じん]はすべて、この日[ひ]に自分[じぶん]たちの敵[てき]と戦[たたか]う用意[ようい]をしておけ。」"
  14: "そこで、騎兵[きへい]たちは、王[おう]が語[かた]ったことを成[な]し遂[と]げようと急[いそ]いで出[で]て行[い]った。勅令[ちょくれい]はスサにも掲[かか]げられた。"
  15: "モルデカイは、王[おう]の衣装[いしょう]を身[み]にまとい、金[きん]の冠[かんむり]と亜麻布[あまぬの]の紫[むらさき]の王冠[おうかん]とをつけて出[で]て来[き]た。スサにいる者[もの]たちは、これを見[み]て喜[よろこ]んだ。"
  16: "ユダヤ人[じん]には光[ひかり]と喜[よろこ]びが生[う]まれた。"
  17: "都[みやこ]ごと、地方[ちほう]ごとに、勅令[ちょくれい]が掲[かか]げられた所[ところ]、その掲示[けいじ]がされた所[ところ]では、ユダヤ人[じん]に喜[よろこ]びと楽[たの]しみがあり、酒宴[しゅえん]と喜[よろこ]びがあった。また、ユダヤ人[じん]への恐[おそ]れのゆえに、多[おお]くの民[たみ]の者[もの]たちが割礼[かつれい]を受[う]け、ユダヤの習[なら]いを受[う]け入[い]れた。"

notes:
  1: "ἐδωρήσατο Εσθηρ ὅσα ὑπῆρχεν Αμαν τῷ διαβόλῳ — «подарил Есфири всё, что принадлежало Аману, клеветнику» (δωρέομαι; διάβολος здесь «клеветник», не 悪魔). Слав. добавляет в скобках «(иудейска)» — тёмное чтение, в текст не внесено. προσεκλήθη ὑπὸ τοῦ βασιλέως — «был призван царём». ἐνοικείωται αὐτῇ — «он в родстве с ней» (ἐνοικειόομαι); слав. «сродник есть ей»."
  2: "ἔλαβεν τὸν δακτύλιον ὃν ἀφείλατο Αμαν — «взял перстень, который отнял у Амана» (δακτύλιος, ἀφαιρέομαι). κατέστησεν Εσθηρ Μαρδοχαῖον ἐπὶ πάντων τῶν Αμαν — «поставила Есфирь Мардохея над всем [имуществом] Амана» (καθίστημι). Слав. «перстень свой»: слова «свой» в LXX нет."
  3: "προσθεῖσα ἐλάλησεν — «продолжая, говорила» (προστίθημι с инфинитивом — «ещё»). προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ — «припала к ногам его». ἠξίου ἀφελεῖν τὴν Αμαν κακίαν — «умоляла отстранить злобу Амана» (ἀξιόω, ἀφαιρέω). Слав. в скобках «(и восплака)» — «заплакала» (есть и в ru), поэтому 泣き внесено в текст. ὅσα ἐποίησεν τοῖς Ιουδαίοις — «что он сделал иудеям»; слав. передаёт «и мысль его, еюже помысли на иудеи», в тексте 企て по слав."
  4: "ἐξέτεινεν … τὴν ῥάβδον τὴν χρυσῆν — «простёр золотой жезл» (ῥάβδος; здесь тот же царский скипетр, что σκῆπτρον в 4:11 и 5:2, поэтому 王笏, как в 5:2). ἐξηγέρθη — «была поднята, встала». παρεστηκέναι τῷ βασιλεῖ — «предстать царю» (παρίστημι), в тексте 王の前に立った."
  5: "πεμφθήτω ἀποστραφῆναι τὰ γράμματα — букв. «да будет послано [повеление], чтобы возвратились письма» (πέμπω, ἀποστρέφω); в тексте 撤回させるようお命じください. τὰ γραφέντα ἀπολέσθαι τοὺς Ιουδαίους — «написанные об истреблении иудеев». οἵ εἰσιν ἐν τῇ βασιλείᾳ σου — «которые в царстве твоём». Речь продолжается в ст. 6."
  6: "πῶς γὰρ δυνήσομαι ἰδεῖν τὴν κάκωσιν τοῦ λαοῦ μου — «ибо как смогу я видеть бедствие народа моего» (κάκωσις). πῶς δυνήσομαι σωθῆναι ἐν τῇ ἀπωλείᾳ τῆς πατρίδος μου — «как смогу спастись при погибели отечества моего»: σωθῆναι — «спастись, уцелеть» (слав. «спастися»). ru передаёт по МТ «видеть погибель родных моих»."
  7: "εἰ πάντα τὰ ὑπάρχοντα Αμαν ἔδωκα … τί ἔτι ἐπιζητεῖς — «если всё имущество Амана я отдал… что ещё ты ищешь?» (ἐπιζητέω). τὰς χεῖρας ἐπήνεγκε τοῖς Ιουδαίοις — «поднял руки на иудеев» (ἐπιφέρω). ru добавляет «и Мардохею Иудеянину» — масоретское, в LXX обращение только к Есфири. Речь продолжается в ст. 8."
  8: "γράψατε καὶ ὑμεῖς — «напишите и вы» (мн. ч.: Есфирь и Мардохей). ἐκ τοῦ ὀνόματός μου — «от имени моего». σφραγίσατε τῷ δακτυλίῳ μου — «запечатайте перстнем моим» (σφραγίζω). οὐκ ἔστιν αὐτοῖς ἀντειπεῖν — «нельзя им прекословить» (ἀντιλέγω); слав. «не возможно им противорещи»."
  9: "ἐν τῷ πρώτῳ μηνί, ὅς ἐστι Νισα, τρίτῃ καὶ εἰκάδι τοῦ αὐτοῦ ἔτους — «в первый месяц, который есть Ниса, в двадцать третий [день] того же года»: в LXX «года», в слав. «того же месяца»; ru по МТ ставит третий месяц Сиван. ἐγράφη τοῖς Ιουδαίοις ὅσα ἐνετείλατο — «написано было иудеям всё, что повелел»: подлежащее не названо, слав. вносит имя Мардохея — по паритету в тексте モルデカイ. ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις — «ста двадцати семи сатрапиям»; κατὰ τὴν ἑαυτῶν λέξιν — «по их собственному наречию»."
  10: "ἐγράφη δὲ διὰ τοῦ βασιλέως — «написано через царя» (или «царём»); слав. «велением царевым», в тексте 王の命によって. ἐσφραγίσθη τῷ δακτυλίῳ αὐτοῦ — «запечатано перстнем его». διὰ βιβλιαφόρων — «через книгоносцев» (βιβλιαφόρος; слав. «писмоносцы»), т. е. гонцов, несших письма. ru добавляет коней, дромадеров и мулов — масоретское, в LXX нет."
  11: "ὡς ἐπέταξεν αὐτοῖς — «как повелел им»: придаточное продолжает ст. 10, поэтому стих кончается на …と命じたのである. χρῆσθαι τοῖς νόμοις αὐτῶν ἐν πάσῃ πόλει — «пользоваться своими законами во всяком городе». βοηθῆσαί τε αὑτοῖς — «и помочь себе» (слав. «да помогают им» — местоимение двусмысленно). χρῆσθαι τοῖς ἀντιδίκοις … ὡς βούλονται — «поступить с противниками, как хотят»."
  12: "ἐν ἡμέρᾳ μιᾷ — «в один день». ἐν πάσῃ τῇ βασιλείᾳ Ἀρταξέρξου — «во всём царстве Артаксеркса». τῇ τρισκαιδεκάτῃ τοῦ δωδεκάτου μηνός, ὅς ἐστιν Αδαρ — «в тринадцатый день двенадцатого месяца, который есть Адар». В ru дальше сразу идёт текст письма (Добавление E); по греческой нумерации письмо — в ст. 13."
  13: "Ст. 13 = основной стих (Ὧν ἐστιν ἀντίγραφον τῆς ἐπιστολῆς τὰ ὑπογεγραμμένα — «список с этой грамоты — нижеследующее») + Добавление E, подстихи 13a–13ac. Состав: 13a адрес (великий царь Артаксеркс — правителям 127 сатрапий от Индии до Эфиопии и доброжелателям, χαίρειν); 13b–13h рассуждение о временщиках, которые за доброту платят злом и не боятся суда Божия; 13k–13o об Амане (Αμαδαθου Μακεδών, «чуждый персидской крови», облагодетельствованный, замыслил погубить царя, Мардохея и Есфирь и передать власть македонянам); 13p–13q об иудеях (живут по праведнейшим законам, сыны вышнего Бога); 13r–13y распоряжения — не пользоваться грамотами Амана (он повешен при воротах Суз со всем домом), выставить список, позволить иудеям защищаться 13 адара, праздновать этот день, непокорные города истребить, списки выставить открыто. Границы письма — в «…» (адрес 13a тоже внутри кавычек); подстихи в текст не выводились. 13z–13ac (всадники, слава Мардохея, свет у иудеев, обрезание язычников) в греч. модуле дословно повторяют 8:14–8:17, в слав. письмо кончается на 13y (csl 8:24), поэтому в тексте ст. 13 они переведены ещё раз, как в модуле; повтор не сглажен. Отдельные чтения: τρισαλιτηρίου — «трижды нечестивого» (в тексте 三度も呪わしい者); ἀπειράγαθος (13c) — тёмное слово, «не знающий добра по опыту» (слав. «не приявших благодеяний»); ἐσταυρῶσθαι (13r) — «быть распятым/посаженным на кол», слав. «повешен», в тексте 柱にかけられた. В 13g–13h греч. χρώμενοι ταῖς μεταβολαῖς — «пользуясь переменами», слав. «не употребляюще пременений» (так же ru); по паритету взято слав. чтение (変更を加えず), вариант LXX отмечен здесь."
  14: "οἱ μὲν οὖν ἱππεῖς ἐξῆλθον σπεύδοντες — «итак, всадники вышли, спеша» (ἱππεύς, σπεύδω). τὰ ὑπὸ τοῦ βασιλέως λεγόμενα ἐπιτελεῖν — «исполнить сказанное царём» (ἐπιτελέω). ἐξετέθη δὲ τὸ πρόσταγμα καὶ ἐν Σούσοις — «указ выставлен и в Сузах» (ἐκτίθημι, πρόσταγμα). Это csl 8:25; те же слова стоят в греч. ещё в 13z."
  15: "ἐστολισμένος τὴν βασιλικὴν στολήν — «облечённый в царскую одежду» (στολίζω, στολή). στέφανον χρυσοῦν — «золотой венец» (στέφανος), διάδημα βύσσινον πορφυροῦν — «льняная пурпурная диадема» (διάδημα — 王冠, βύσσινος — 亜麻布). ἰδόντες δὲ οἱ ἐν Σούσοις ἐχάρησαν — «увидев, бывшие в Сузах возрадовались». Это csl 8:26 (= 13aa)."
  16: "φῶς καὶ εὐφροσύνη — «свет и веселие» (φῶς, εὐφροσύνη). В модуле стих обрывается на этих словах, без продолжения 13ac; продолжение — в ст. 17. Это csl 8:27 (= 13ab)."
  17: "κατὰ πόλιν καὶ χώραν, οὗ ἂν ἐξετέθη τὸ πρόσταγμα· οὗ ἂν ἐξετέθη τὸ ἔκθεμα — «по городу и стране, где бы ни был выставлен указ, где бы ни было выставлено объявление»: повтор πρόσταγμα / ἔκθεμα сохранён без сглаживания. κώθων καὶ εὐφροσύνη — «пиршество и веселие» (κώθων — «кубок, попойка»; слав. «пирование и утешение»). περιετέμοντο καὶ ιουδάιζον — «обрезывались и иудействовали»; слав. «и закон иудейский приимаху» — в тексте переданы оба смысла. Это csl 8:28 (= 13ac)."
