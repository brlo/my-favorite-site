verses:
  1: "戒[いまし]めを愛[あい]する者[もの]は知識[ちしき]を愛する。しかし、責[せ]めを憎[にく]む者[もの]は愚[おろ]かな者である。"
  2: "主[しゅ]のもとで恵[めぐ]みを見出[みいだ]す者[もの]は良[よ]い。しかし、不法[ふほう]な者[もの]は黙[だま]らせられる。"
  3: "人[ひと]は不法[ふほう]によって堅[かた]く立[た]つことはない。しかし、正[ただ]しい者[もの]たちの根[ね]は抜[ぬ]き取[と]られない。"
  4: "雄々[おお]しい妻[つま]は夫[おっと]の冠[かんむり]。しかし、悪[あく]を行[おこな]う妻[つま]は、木[き]のうちの虫[むし]のように、夫[おっと]を滅[ほろ]ぼす。"
  5: "正[ただ]しい者[もの]たちの思[おも]いは裁[さば]きである。しかし、不敬[ふけい]な者[もの]は欺[あざむ]きを操[あやつ]る。"
  6: "不敬[ふけい]な者[もの]のことばは血[ち]を流[なが]すための欺[あざむ]きである。しかし、まっすぐな者[もの]の口[くち]は彼[かれ]らを救[すく]う。"
  7: "どこに身[み]を向[む]けても、不敬[ふけい]な者[もの]は消[き]え去[さ]る。しかし、正[ただ]しい者[もの]たちの家[いえ]は残[のこ]る。"
  8: "思慮[しりょ]ある者[もの]の口[くち]は人[ひと]に賛[ほ]められる。しかし、心[こころ]の鈍[にぶ]い者[もの]は侮[あなど]られる。"
  9: "卑[いや]しい身[み]で自分[じぶん]のために働[はたら]く者[もの]は、自[みずか]らを尊[とうと]くしてパンに乏[とぼ]しい者[もの]より良[よ]い。"
  10: "正[ただ]しい者[もの]は自分[じぶん]の家畜[かちく]のいのちを慈[いつく]しむ。しかし、不敬[ふけい]な者[もの]の心[こころ]は無[む]慈悲[じひ]である。"
  11: "自分[じぶん]の畑[はたけ]を耕[たがや]す者[もの]はパンに満[み]ち足[た]りる。しかし、空[むな]しいことを追[お]う者[もの]は思慮[しりょ]に欠[か]ける。酒[さけ]の宴[うたげ]を楽[たの]しむ者[もの]は、自分[じぶん]の砦[とりで]のうちに辱[はずかし]めを残[のこ]す。"
  12: "不敬[ふけい]な者[もの]の願[ねが]いは悪[あく]である。しかし、敬虔[けいけん]な者[もの]たちの根[ね]は堅固[けんご]なところにある。"
  13: "唇[くちびる]の罪[つみ]によって罪人[ざいにん]は罠[わな]に陥[おちい]る。しかし、正[ただ]しい者[もの]はそこから逃[のが]れ出[だ]す。柔和[にゅうわ]にものを見[み]る者[もの]は憐[あわ]れみを受[う]け、門[もん]のところで出会[であ]う者[もの]は人[ひと]の魂[たましい]を押[お]し砕[くだ]く。"
  14: "口[くち]の実[み]によって人[ひと]の魂[たましい]は良[よ]いもので満[み]たされ、その唇[くちびる]の報[むく]いがその人に与[あた]えられる。"
  15: "愚[おろ]かな者[もの]たちの道[みち]は自分[じぶん]の前[まえ]で正[ただ]しく見[み]える。しかし、知恵[ちえ]ある者[もの]は助言[じょげん]に聞[き]き従[したが]う。"
  16: "愚[おろ]かな者[もの]はその日[ひ]のうちに怒[いか]りを言[い]い広[ひろ]める。しかし、賢[かしこ]い者[もの]は自分[じぶん]の辱[はずかし]めを隠[かく]す。"
  17: "正[ただ]しい者[もの]は示[しめ]された信実[しんじつ]を告[つ]げ知[し]らせる。しかし、不正[ふせい]な者[もの]たちの証人[しょうにん]は欺[あざむ]きである。"
  18: "剣[つるぎ]で刺[さ]すように語[かた]る者[もの]たちがいる。しかし、知恵[ちえ]ある者[もの]の舌[した]は癒[いや]す。"
  19: "真実[しんじつ]な唇[くちびる]は証[あかし]を堅[かた]くする。しかし、急[せ]く証人[しょうにん]は不正[ふせい]な舌[した]を持[も]つ。"
  20: "悪[あく]を企[くわだ]てる者[もの]の心[こころ]には欺[あざむ]きがある。しかし、平和[へいわ]を願[ねが]う者[もの]たちは喜[よろこ]ぶ。"
  21: "正[ただ]しい者[もの]は何[なに]一つ不正[ふせい]なことを喜[よろこ]ばない。しかし、不敬[ふけい]な者[もの]たちは悪[あく]で満[み]たされる。"
  22: "偽[いつわ]りの唇[くちびる]は主[しゅ]の忌[い]むところ。しかし、信実[しんじつ]を行[おこな]う者[もの]は主に喜[よろこ]ばれる。"
  23: "思慮[しりょ]ある人[ひと]は知識[ちしき]の玉座[ぎょくざ]。しかし、愚[おろ]かな者[もの]の心[こころ]は呪[のろ]いに出会[であ]う。"
  24: "選[えら]ばれた者[もの]たちの手[て]は易々[やすやす]と支配[しはい]する。しかし、欺[あざむ]く者[もの]たちは略奪[りゃくだつ]に回[まわ]される。"
  25: "恐[おそ]ろしい言葉[ことば]は正[ただ]しい人[ひと]の心[こころ]を騒[さわ]がせる。しかし、良[よ]い知[し]らせはその人を喜[よろこ]ばせる。"
  26: "識見[しきけん]ある正[ただ]しい者[もの]は自分[じぶん]の友[とも]となる。しかし、不敬[ふけい]な者[もの]たちの思[おも]いは情[なさ]けがない。罪[つみ]を犯[おか]す者[もの]たちを災[わざわ]いが追[お]いかける。しかし、不敬[ふけい]な者[もの]たちの道[みち]は彼[かれ]らを迷[まよ]わせる。"
  27: "欺[あざむ]く者[もの]は獲物[えもの]を得[え]ない。しかし、清[きよ]い人[ひと]の財産[ざいさん]は尊[とうと]い。"
  28: "正[ただ]しさの道[みち]にはいのちがある。しかし、悪[あく]を忘[わす]れない者[もの]たちの道[みち]は死[し]に至[いた]る。"

notes:
  1: "ὁ ἀγαπῶν παιδείαν ἀγαπᾷ αἴσθησιν — любящий наставление любит знание (παιδεία — наставление, наказание; αἴσθησις — чувство, разумение; csl «чувство»). ὁ δὲ μισῶν ἐλέγχους ἄφρων — ненавидящий же обличения глуп (ἔλεγχος — обличение)."
  2: "κρείσσων ὁ εὑρὼν χάριν παρὰ κυρίῳ — лучше нашедший благодать у Господа (κρείσσων — сравн. степень «лучше» без второй части сравнения, как в csl). ἀνὴρ δὲ παράνομος παρασιωπηθήσεται — муж же беззаконный будет обойдён молчанием (παρασιωπάω — умолчать, премолчать)."
  3: "οὐ κατορθώσει ἄνθρωπος ἐξ ἀνόμου — не утвердится человек от беззакония (κατορθόω — исправлять, утверждать). αἱ δὲ ῥίζαι τῶν δικαίων οὐκ ἐξαρθήσονται — корни же праведных не будут исторгнуты (ἐξαίρω — поднимать, исторгать)."
  4: "γυνὴ ἀνδρεία στέφανος τῷ ἀνδρὶ αὐτῆς — жена мужественная — венец мужу своему (ἀνδρεῖος — мужественный, добродетельный; στέφανος — венец). ὥσπερ ἐν ξύλῳ σκώληξ — как в дереве червь (σκώληξ — червь). οὕτως ἄνδρα ἀπόλλυσιν γυνὴ κακοποιός — так мужа губит жена злотворная (κακοποιός — злодейка)."
  5: "λογισμοὶ δικαίων κρίματα — помышления праведных — суды (λογισμός — помышление; κρίμα — суд, правый приговор). κυβερνῶσιν δὲ ἀσεβεῖς δόλους — нечестивые же управляют обманами (κυβερνάω — управлять, править; δόλος — коварство)."
  6: "λόγοι ἀσεβῶν δόλιοι — слова нечестивых коварны (δόλιος — лукавый, льстивый). στόμα δὲ ὀρθῶν ῥύσεται αὐτούς — уста же прямых избавят их. csl добавляет «в кровь» («льстива в кровь») — нет в LXX, по паритету внесено в основной текст (血を流すための)."
  7: "οὗ ἐὰν στραφῇ, ἀσεβὴς ἀφανίζεται — куда бы ни обратился нечестивый, исчезает (ἀφανίζομαι — исчезать). οἶκοι δὲ δικαίων παραμένουσιν — дома же праведных пребывают (παραμένω — оставаться). jp-joc для этого стиха нет."
  8: "στόμα συνετοῦ ἐγκωμιάζεται ὑπὸ ἀνδρός — уста разумного восхваляются мужем (ἐγκωμιάζω — восхвалять; συνετός — разумный). νωθροκάρδιος δὲ μυκτηρίζεται — слабосердый же осмеивается (νωθροκάρδιος — вялый сердцем; μυκτηρίζω — поднимать на смех)."
  9: "κρείσσων ἀνὴρ ἐν ἀτιμίᾳ δουλεύων ἑαυτῷ — лучше муж в бесчестии работающий себе. ἢ τιμὴν ἑαυτῷ περιτιθεὶς καὶ προσδεόμενος ἄρτου — нежели возлагающий на себя честь и нуждающийся в хлебе (περιτίθημι — возлагать; προσδέομαι — нуждаться)."
  10: "δίκαιος οἰκτίρει ψυχὰς κτηνῶν αὐτοῦ — праведный милует души скотов своих (οἰκτίρω — миловать, щадить; κτῆνος — скот). τὰ δὲ σπλάγχνα τῶν ἀσεβῶν ἀνελεήμονα — внутренности же нечестивых немилостивы (σπλάγχνον — внутренности, сердце; csl «утробы»)."
  11: "ὁ ἐργαζόμενος τὴν ἑαυτοῦ γῆν ἐμπλησθήσεται ἄρτων — возделывающий свою землю насытится хлебов. οἱ δὲ διώκοντες μάταια ἐνδεεῖς φρενῶν — гонящиеся же за суетным скудны разумом (μάταια — суетное; ἔνδεια — недостаток). Подстих 11a: ὅς ἐστιν ἡδὺς ἐν οἴνων διατριβαῖς — кто падок на винные попойки (ἡδύς — сладкий, падкий; διατριβή — времяпрепровождение); ἐν τοῖς ἑαυτοῦ ὀχυρώμασιν καταλείψει ἀτιμίαν — в своих твердынях оставит бесчестие (ὀχύρωμα — твердыня). В csl 11a — вторая половина того же стиха, в один стих не дробим."
  12: "ἐπιθυμίαι ἀσεβῶν κακαί — желания нечестивых злы. αἱ δὲ ῥίζαι τῶν εὐσεβῶν ἐν ὀχυρώμασιν — корни же благочестивых в твердынях (εὐσεβής — благочестивый). ru «желает уловить в сеть зла» — МТ."
  13: "δι᾽ ἁμαρτίαν χειλέων ἐμπίπτει εἰς παγίδας ἁμαρτωλός — за грех уст впадает в сети грешник (παγίς — сеть). ἐκφεύγει δὲ ἐξ αὐτῶν δίκαιος — избегает же от них праведник. Подстих 13a: ὁ βλέπων λεῖα ἐλεηθήσεται — смотрящий кротко помилован будет (λεῖα — гладкое, кроткое); ὁ δὲ συναντῶν ἐν πύλαις ἐκθλίψει ψυχάς — встречающий во вратах сокрушит души (ἐκθλίβω — сокрушать, теснить). Место тёмное; в csl 13a — вторая половина того же стиха, в один стих не дробим."
  14: "ἀπὸ καρπῶν στόματος ψυχὴ ἀνδρὸς πλησθήσεται ἀγαθῶν — от плодов уст душа человека насытится благ. ἀνταπόδομα δὲ χειλέων αὐτοῦ δοθήσεται αὐτῷ — воздаяние же уст его дано будет ему (ἀνταπόδομα — воздаяние). ru «по делам рук его» — МТ."
  15: "ὁδοὶ ἀφρόνων ὀρθαὶ ἐνώπιον αὐτῶν — пути глупых прямы в глазах их. εἰσακούει δὲ συμβουλίας σοφός — слушает же совета мудрый (συμβουλία — совет)."
  16: "ἄφρων αὐθημερὸν ἐξαγγέλλει ὀργὴν αὐτοῦ — глупый в тот же день разглашает гнев свой (αὐθημερόν — в тот же день; ἐξαγγέλλω — разглашать). κρύπτει δὲ τὴν ἑαυτοῦ ἀτιμίαν πανοῦργος — скрывает же своё бесчестие хитрый (πανοῦργος — хитрый, ловкий; csl «хитрый»), передано 賢い."
  17: "ἐπιδεικνυμένην πίστιν ἀπαγγέλλει δίκαιος — явленную верность возвещает праведный (πίστις — верность, вера; ἀπαγγέλλω — возвещать). ὁ δὲ μάρτυς τῶν ἀδίκων δόλιος — свидетель же неправедных коварен (μάρτυς — свидетель)."
  18: "εἰσὶν οἳ λέγοντες τιτρώσκουσιν μαχαίρᾳ — есть, кто словами ранят, как мечом (τιτρώσκω — ранить; μάχαιρα — меч). γλῶσσαι δὲ σοφῶν ἰῶνται — языки же мудрых врачуют (ἰάομαι — исцелять)."
  19: "χείλη ἀληθινὰ κατορθοῖ μαρτυρίαν — уста истинные утверждают свидетельство (κατορθόω — утверждать; μαρτυρία — свидетельство). μάρτυς δὲ ταχὺς γλῶσσαν ἔχει ἄδικον — свидетель же скорый имеет язык неправедный (ταχύς — скорый, поспешный)."
  20: "δόλος ἐν καρδίᾳ τεκταινομένου κακά — коварство в сердце замышляющего зло (δόλος — коварство, лесть). οἱ δὲ βουλόμενοι εἰρήνην εὐφρανθήσονται — желающие же мира возрадуются."
  21: "οὐκ ἀρέσει τῷ δικαίῳ οὐδὲν ἄδικον — не будет угодно праведному ничто неправедное (ἀρέσκω — быть угодным). οἱ δὲ ἀσεβεῖς πλησθήσονται κακῶν — нечестивые же исполнятся зол."
  22: "βδέλυγμα κυρίῳ χείλη ψευδῆ — мерзость Господу уста лживые (ψευδής — лживый). ὁ δὲ ποιῶν πίστεις δεκτὸς παρ᾽ αὐτῷ — творящий же верность угоден Ему (ποιῶν πίστεις — «творящий веры», csl «творяй верно»; δεκτός — угодный)."
  23: "ἀνὴρ συνετὸς θρόνος αἰσθήσεως — муж разумный — престол чувства (θρόνος — престол; αἴσθησις — чувство, знание). καρδία δὲ ἀφρόνων συναντήσεται ἀραῖς — сердце же глупых встретится с проклятиями (ἀρά — проклятие)."
  24: "χεὶρ ἐκλεκτῶν κρατήσει εὐχερῶς — рука избранных будет властвовать легко (ἐκλεκτός — избранный; εὐχερῶς — легко, удобно). δόλιοι δὲ ἔσονται εἰς προνομήν — лукавые же будут в добычу (προνομή — добыча, разграбление; csl «во пленении»)."
  25: "φοβερὸς λόγος καρδίαν ταράσσει ἀνδρὸς δικαίου — страшное слово смущает сердце мужа праведного (φοβερός — страшный; ταράσσω — смущать). ἀγγελία δὲ ἀγαθὴ εὐφραίνει αὐτόν — весть же благая веселит его."
  26: "ἐπιγνώμων δίκαιος ἑαυτοῦ φίλος ἔσται — благоразумный праведник будет другом себе (ἐπιγνώμων — сведущий, благоразумный; csl «разумив»). αἱ δὲ γνῶμαι τῶν ἀσεβῶν ἀνεπιεικεῖς — мысли же нечестивых неблагосклонны (γνώμη — мысль, мнение; ἀνεπιεικής — жестокий, недобрый). ἁμαρτάνοντας καταδιώξεται κακά — согрешающих постигнут беды (κακά — злое, беды). ἡ δὲ ὁδὸς τῶν ἀσεβῶν πλανήσει αὐτούς — путь же нечестивых введёт их в заблуждение. Четыре клаузы в одном стихе переведены все; jp-joc короче (МТ)."
  27: "οὐκ ἐπιτεύξεται δόλιος θήρας — не достигнет лукавый лова (ἐπιτυγχάνω — достигать; θήρα — лов, добыча). κτῆμα δὲ τίμιον ἀνὴρ καθαρός — стяжание же драгоценное — муж чистый (κτῆμα — стяжание, имущество; τίμιος — драгоценный). ru «ленивый не жарит своей дичи» — МТ."
  28: "ἐν ὁδοῖς δικαιοσύνης ζωή — на путях правды жизнь. ὁδοὶ δὲ μνησικάκων εἰς θάνατον — пути же злопамятных в смерть (μνησίκακος — злопамятный; csl «злопомнящих»)."
