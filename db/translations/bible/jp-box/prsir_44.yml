verses:
  1: "さあ、すばらしい人々[ひとびと]を、わたしたちの父[ちち]たちを、その生[う]まれによってほめたたえよう。"
  2: "主[しゅ]は彼[かれ]らに多[おお]くの栄光[えいこう]を造[つく]り、世[よ]の初[はじ]めからその偉[い]大[だい]さを示[しめ]された。"
  3: "彼[かれ]らは自[じ]分[ぶん]の王国[おうこく]を治[おさ]め、力[ちから]ある名[な]の知[し]られた者[もの]であった。また、自分の悟[さと]りによって計[はか]り、預言[よげん]によって告[つ]げ知らせた。"
  4: "彼[かれ]らは民[たみ]の導[みちび]き手[て]となり、議[ぎ]論[ろん]と民の書[しょ]き物[もの]の理解[りかい]とに長[た]けていた。その教[きょう]えのうちには知恵[ちえ]ある言葉[ことば]があった。"
  5: "彼[かれ]らは楽[がく]人[じん]の節[ふし]を求[もと]め、詩[し]を書[か]いて語[かた]り伝[つた]えた。"
  6: "富[とみ]ある者[もの]たちは力[ちから]を備[そな]えられ、自[じ]分[ぶん]の住[す]まいのうちで平[へい]和[わ]に暮[く]らした。"
  7: "これらすべての者[もの]は代々[よよ]の間[あいだ]に栄光[えいこう]を受[う]け、その時代[じだい]の誇[ほこ]りとなった。"
  8: "そのうちには、名[な]を残[のこ]してほめたたえられる者[もの]たちがいる。"
  9: "また、思[おも]い出[だ]されることのない者[もの]たちもいる。彼[かれ]らは存在[そんざい]しなかったかのように滅[ほろ]び、生[う]まれなかったかのように消[き]え去[さ]り、その後[あと]の子[こ]どもも同[おな]じである。"
  10: "しかし、かの者[もの]たちはあわれみの人々[ひとびと]であり、その正[せい]義[ぎ]は忘[わす]れられない。"
  11: "良[よ]い遺[い]産[さん]はその子孫[しそん]とともに残[のこ]り、その子[こ]どもたちもまた残る。"
  12: "その子孫[しそん]は契[けい]約[やく]のうちに立[た]ち、その子[こ]どもたちも彼[かれ]らのゆえに立つ。"
  13: "その子孫[しそん]は永遠[えいえん]に絶[た]えず、その栄光[えいこう]は消[け]し去[さ]られることがない。"
  14: "その体[からだ]は平[へい]和[わ]のうちに葬[ほうむ]られ、その名[な]は代々[よよ]に生[い]き続[つづ]ける。"
  15: "民[たみ]たちはその知恵[ちえ]を語[かた]り、集[しゅう]会[かい]はその誉[ほま]れを告[つ]げる。"
  16: "エノクは主[しゅ]に喜[よろこ]ばれ、移[うつ]された。すなわち、代々[よよ]の者[もの]にとっての悔[く]い改[あらた]めの手本[てほん]である。"
  17: "ノアは完全[かんぜん]で正[ただ]しい者[もの]として見[み]出[い]だされ、怒[いか]りの時[とき]に代[か]わりの供[そな]えとなった。彼[かれ]のゆえに、洪水[こうずい]の時に地[ち]に残[のこ]る者が生[しょう]じた。"
  18: "彼[かれ]との間に永遠[えいえん]の契[けい]約[やく]が結[むす]ばれ、もはや洪水[こうずい]によってすべての肉[にく]が滅[ほろ]ぼされないことになった。"
  19: "アブラハムは多[おお]くの民[たみ]の父[ちち]となる大[おお]きな者[もの]であり、その栄光[えいこう]において並[なら]ぶ者は見[み]つからなかった。"
  20: "彼[かれ]はいと高[たか]き者[もの]の律法[りっぽう]を守[まも]り、主[しゅ]との契[けい]約[やく]のうちにいた。主は彼の肉[にく]によって契約を立[た]て、試[ため]しの時[とき]に彼が忠[ちゅう]実[じつ]であることを見[み]出[い]だされた。"
  21: "それゆえ、主[しゅ]は誓[ちか]いをもって彼[かれ]に定[さだ]められた。すなわち、彼の子孫[しそん]によって諸[しょ]国[こく]の民[たみ]が祝福[しゅくふく]され、彼が地[ち]の砂[すな]のように増[ふ]え、その子孫が星[ほし]のように高[たか]く挙[あ]げられ、海[うみ]から海へ、川[かわ]から地の果[は]てまでを継[つ]ぐ者[もの]となることである。"
  22: "また、イサクのうちにも、その父[ちち]アブラハムのゆえに、同[おな]じように定[さだ]められた。"
  23: "すべての人[ひと]への祝福[しゅくふく]と契[けい]約[やく]は、ヤコブの頭[あたま]の上[うえ]に置[お]かれた。主[しゅ]はその祝福のうちに彼[かれ]を知[し]り、彼に遺[い]産[さん]を与[あた]え、その分[ぶん]け前[まえ]を分[わ]けて、十二[じゅうに]の部[ぶ]族[ぞく]に割[わ]り当[あ]てられた。"

notes:
  1: "Αἰνέσωμεν δὴ ἄνδρας ἐνδόξους — «восхвалим же мужей славных» (αἰνέω — хвалить; ἔνδοξος — славный). τοὺς πατέρας ἡμῶν τῇ γενέσει — «отцов наших по рождению» (γένεσις — рождение, род); слав. «в бытии»."
  2: "πολλὴν δόξαν ἔκτισεν ὁ κύριος — «многую славу создал Господь» (κτίζω — создавать). τὴν μεγαλωσύνην αὐτοῦ ἀπ᾽ αἰῶνος — «величие Своё от века» (μεγαλωσύνη — величие)."
  3: "κυριεύοντες ἐν ταῖς βασιλείαις αὐτῶν — «владычествующие в царствах своих» (κυριεύω — господствовать). ἄνδρες ὀνομαστοὶ ἐν δυνάμει — «мужи именитые силою» (ὀνομαστός — знаменитый). βουλεύοντες ἐν συνέσει αὐτῶν — «советующие разумом своим» (βουλεύω — совещаться; σύνεσις — разумение); ἀπηγγελκότες ἐν προφητείαις — «возвестившие в пророчествах» (ἀπαγγέλλω — возвещать)."
  4: "ἡγούμενοι λαοῦ ἐν διαβουλίοις — «водители народа в совещаниях» (διαβούλιον — совещание). συνέσει γραμματείας λαοῦ — «разумением книжности народа» (γραμματεία — писание, книжность). σοφοὶ λόγοι ἐν παιδείᾳ αὐτῶν — «мудрые слова в наставлении их» (παιδεία — наставление). Слав. 5 вбирает конец этого стиха."
  5: "ἐκζητοῦντες μέλη μουσικῶν — «ищущие напевов музыкантов» (ἐκζητέω — разыскивать; μέλος — напев, песнь; μουσικός — музыкант). διηγούμενοι ἔπη ἐν γραφῇ — «излагающие песни в письме» (ἔπος — слово, стих; γραφή — письмо)."
  6: "ἄνδρες πλούσιοι κεχορηγημένοι ἰσχύι — «мужи богатые, наделённые силою» (χορηγέω — снабжать, наделять). εἰρηνεύοντες ἐν κατοικίαις αὐτῶν — «живущие в мире в жилищах своих» (κατοικία — жилище)."
  7: "πάντες οὗτοι ἐν γενεαῖς ἐδοξάσθησαν — «все они в родах прославлены». ἐν ταῖς ἡμέραις αὐτῶν καύχημα — «в дни их — похвала» (καύχημα — похвала, предмет гордости)."
  8: "εἰσὶν αὐτῶν οἳ κατέλιπον ὄνομα — «есть из них, оставившие имя» (καταλείπω — оставлять). τοῦ ἐκδιηγήσασθαι ἐπαίνους — «чтобы возвестить похвалы» (ἔπαινος — похвала)."
  9: "εἰσὶν ὧν οὐκ ἔστιν μνημόσυνον — «есть такие, у которых нет памяти» (μνημόσυνον — память). ἀπώλοντο ὡς οὐχ ὑπάρξαντες — «погибли, как не существовавшие» (ὑπάρχω — существовать); ἐγένοντο ὡς οὐ γεγονότες — «стали, как не бывшие». τὰ τέκνα αὐτῶν μετ᾽ αὐτούς — «и дети их после них»."
  10: "ἀλλ᾽ ἢ οὗτοι ἄνδρες ἐλέους — «но вот эти — мужи милости» (ἔλεος — милость). ὧν αἱ δικαιοσύναι οὐκ ἐπελήσθησαν — «которых правды не забыты» (δικαιοσύνη — правда; ἐπιλανθάνομαι — забывать)."
  11: "μετὰ τοῦ σπέρματος αὐτῶν διαμενεῖ — «с семенем их пребудет». ἀγαθὴ κληρονομία ἔκγονα αὐτῶν — «доброе наследие — потомки их» (ἔκγονος — потомок)."
  12: "ἐν ταῖς διαθήκαις ἔστη τὸ σπέρμα αὐτῶν — «в заветах стало семя их» (διαθήκη — завет; ἵστημι — ставить, утверждать). τὰ τέκνα αὐτῶν δι᾽ αὐτούς — «и дети их ради них»."
  13: "ἕως αἰῶνος μενεῖ σπέρμα αὐτῶν — «до века пребудет семя их». ἡ δόξα αὐτῶν οὐκ ἐξαλειφθήσεται — «слава их не изгладится» (ἐξαλείφω — изглаживать)."
  14: "τὰ σώματα αὐτῶν ἐν εἰρήνῃ ἐτάφη — «тела их в мире погребены» (θάπτω — погребать). τὸ ὄνομα αὐτῶν ζῇ εἰς γενεάς — «имя их живёт в роды»."
  15: "σοφίαν αὐτῶν διηγήσονται λαοί — «мудрость их возвестят народы». τὸν ἔπαινον ἐξαγγέλλει ἐκκλησία — «похвалу их возвещает церковь» (ἐξαγγέλλω — объявлять; ἐκκλησία — собрание, церковь)."
  16: "Ενωχ εὐηρέστησεν κυρίῳ — «Енох угодил Господу» (εὐαρεστέω — угождать). μετετέθη — «был перенесён» (μετατίθημι; ср. Быт 5:24). ὑπόδειγμα μετανοίας ταῖς γενεαῖς — «образ покаяния для родов» (ὑπόδειγμα — образец; μετάνοια — покаяние)."
  17: "Νωε εὑρέθη τέλειος δίκαιος — «Ной нашёлся совершенным, праведным» (τέλειος — совершенный). ἐν καιρῷ ὀργῆς ἐγένετο ἀντάλλαγμα — «во время гнева стал заменой» (ἀντάλλαγμα — замена, выкуп). διὰ τοῦτον ἐγενήθη κατάλειμμα τῇ γῇ — «ради него остался остаток на земле» (κατάλειμμα — остаток)."
  18: "διαθῆκαι αἰῶνος ἐτέθησαν πρὸς αὐτόν — «заветы века положены с ним». ἵνα μὴ ἐξαλειφθῇ κατακλυσμῷ πᾶσα σάρξ — «чтобы не изгладилась потопом всякая плоть» (κατακλυσμός — потоп)."
  19: "Αβρααμ μέγας πατὴρ πλήθους ἐθνῶν — «Авраам — великий отец множества народов» (πλῆθος — множество; ἔθνος — народ). οὐχ εὑρέθη ὅμοιος ἐν τῇ δόξῃ — «не нашёлся подобный в славе»."
  20: "ὃς συνετήρησεν νόμον ὑψίστου — «который соблюл закон Всевышнего» (συντηρέω — соблюдать). ἐγένετο ἐν διαθήκῃ μετ᾽ αὐτοῦ — «был в завете с Ним». ἐν σαρκὶ αὐτοῦ ἔστησεν διαθήκην — «во плоти его поставил завет», т. е. обрезание. ἐν πειρασμῷ εὑρέθη πιστός — «в искушении оказался верным» (πειρασμός — испытание)."
  21: "ἐν ὅρκῳ ἔστησεν αὐτῷ — «с клятвою поставил ему» (ὅρκος — клятва). ἐνευλογηθῆναι ἔθνη ἐν σπέρματι αὐτοῦ — «благословиться народам в семени его». πληθῦναι αὐτὸν ὡς χοῦν τῆς γῆς — «умножить его, как прах земли» (χοῦς — прах, песок). ὡς ἄστρα ἀνυψῶσαι τὸ σπέρμα αὐτοῦ — «как звёзды возвысить семя его». κατακληρονομῆσαι ἀπὸ θαλάσσης ἕως θαλάσσης — «наследовать от моря до моря»."
  22: "ἐν τῷ Ισαακ ἔστησεν οὕτως — «в Исааке поставил так». δι᾽ Αβρααμ τὸν πατέρα αὐτοῦ — «ради Авраама, отца его»."
  23: "εὐλογίαν πάντων ἀνθρώπων καὶ διαθήκην κατέπαυσεν ἐπὶ κεφαλὴν Ιακωβ — «благословение всех людей и завет положил на главу Иакова» (καταπαύω — полагать, давать покой). ἐπέγνω αὐτὸν ἐν εὐλογίαις αὐτοῦ — «Он узнал его в благословениях Своих», т. е. признал и благословил. διέστειλεν μερίδας αὐτοῦ — «разделил части его» (διαστέλλω — разделять); ἐν φυλαῖς ἐμέρισεν δέκα δύο — «в племенах разделил двенадцать»."
