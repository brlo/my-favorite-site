verses:
  0: "ダビデの詩[うた]。イエメニの子[こ]クシの言葉[ことば]のことで、主[しゅ]に歌[うた]ったもの。"
  1: "主[しゅ]、わたしの神[かみ]よ、わたしはあなたに寄[よ]り頼[たの]んだ。わたしを追[お]い求[もと]めるすべての者[もの]から、わたしを救[すく]い、助[たす]け出[だ]してください。"
  2: "獅子[しし]のように、だれも救[すく]い出[だ]さず、助[たす]けもしないままに、わたしの魂[たましい]が引[ひ]き裂[さ]かれないように。"
  3: "主[しゅ]、わたしの神[かみ]よ、もしわたしがこのことをしたのなら、もしわたしの手[て]に不義[ふぎ]があるのなら。"
  4: "もしわたしに悪[わる]を報[むく]いる者[もの]に、わたしが悪[わる]を報[むく]いたのなら、わたしは敵[てき]の前[まえ]から、何[なに]も持[も]たずに退[しりぞ]くがよい。"
  5: "敵[てき]がわたしの魂[たましい]を追[お]い、捕[つか]まえ、わたしの命[いのち]を地[ち]に踏[ふ]みにじみ、わたしの栄[えい]光[こう]を塵[ちり]のうちに住[す]まわせるがよい。"
  6: "主[しゅ]よ、怒[いか]りのうちに立[た]ち上[あ]がってください。わたしの敵[てき]の境[さかい]の上[うえ]に高[たか]く上[あ]がってください。主[しゅ]、わたしの神[かみ]よ、あなたが命[めい]じられた定[さだ]めに従[したが]って、目[め]を覚[さ]ましてください。"
  7: "諸民[しょみん]の集[つど]いがあなたを囲[かこ]む。その集[つど]いの上[うえ]、高[たか]みに戻[もど]ってください。"
  8: "主[しゅ]は諸民[しょみん]を裁[さば]かれる。主[しゅ]よ、わたしの義[ぎ]に、わたしのうちなる汚[けが]れのなさに従[したが]って、わたしを裁[さば]いてください。"
  9: "罪[つみ]人[びと]の悪[わる]が終[お]わるように。あなたは正[ただ]しい者[もの]を立[た]て直[なお]される。神[かみ]よ、あなたは心[こころ]と腎[じん]とを試[こころ]みられる方[かた]である。"
  10: "わたしの助[たす]けは、心[こころ]の正[ただ]しい者[もの]を救[すく]う神[かみ]のもとにある、正[ただ]しい助[たす]けである。"
  11: "神[かみ]は正[ただ]しく、力[ちから]ある、寛[かん]容[よう]な裁[さば]き主[ぬし]であり、日[ひ]ごとに怒[いか]りを下[くだ]されるのではない。"
  12: "あなたがたが向[む]きを変[か]えないなら、神[かみ]はその剣[つるぎ]を磨[みが]かれる。神[かみ]は弓[ゆみ]を張[は]り、それを構[かま]えた。"
  13: "その弓[ゆみ]に死[し]の武具[ぶぐ]を備[そな]え、燃[も]える矢[や]を整[ととの]えられた。"
  14: "見[み]よ、彼[かれ]は不義[ふぎ]を身[み]ごもり、労苦[ろうく]をはらみ、不法[ふほう]を産[う]んだ。"
  15: "彼[かれ]は穴[あな]を掘[ほ]り、それを深[ふか]くし、自分[じぶん]の掘[ほ]った落[お]とし穴[あな]に落[お]ちる。"
  16: "彼[かれ]の労苦[ろうく]は彼[かれ]の頭[あたま]に返[かえ]り、その不義[ふぎ]は彼[かれ]の頂[いただき]に下[くだ]る。"
  17: "わたしは主[しゅ]の義[ぎ]に従[したが]って主[しゅ]をほめたたえ、いと高[たか]い主[しゅ]の名[な]をほめ歌[うた]う。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ, ὃν ᾖσεν τῷ κυρίῳ ὑπὲρ τῶν λόγων Χουσι υἱοῦ Ιεμενι — ダビデの詩。イエメニの子クシの言葉のことで、主に歌ったもの (Χουσι — Хусий, в jp-joc フス; Ιεμενι — Иемений, «сын Иеминии», т. е. вениамитянин; добавления ベニヤミン人 нет, потому что в греч. его нет). Надписание — стих 0."
  1: "Κύριε ὁ θεός μου, ἐπὶ σοὶ ἤλπισα — 主わたしの神よ、わたしはあなたに寄り頼んだ (ἐλπίζω ἐπί — «надеяться на»). σῶσόν με ἐκ πάντων τῶν διωκόντων με — わたしを追い求めるすべての者から、わたしを救い (διώκω — «гнать, преследовать»). ῥῦσαί με — 助け出してください (ῥύομαι)."
  2: "μήποτε ἁρπάσῃ ὡς λέων τὴν ψυχήν μου — 獅子のように…わたしの魂が引き裂かれないように (ἁρπάζω — «похищать, терзать»; λέων — 獅子). μὴ ὄντος λυτρουμένου μηδὲ σῴζοντος — だれも救い出さず、助けもしないままに (λυτρόω — «выкупать, избавлять»; отрицание при родительном абсолютном)."
  3: "εἰ ἐποίησα τοῦτο — もしわたしがこのことをしたのなら. εἰ ἔστιν ἀδικία ἐν χερσίν μου — もしわたしの手に不義があるのなら (ἀδικία — «неправда»; ἐν χερσίν — «в руках», т. е. в делах). Условие продолжается в ст. 4–5."
  4: "εἰ ἀνταπέδωκα τοῖς ἀνταποδιδοῦσίν μοι κακά — もしわたしに悪を報いる者に、わたしが悪を報いたのなら (ἀνταποδίδωμι — «воздавать»). ἀποπέσοιν ἄρα ἀπὸ τῶν ἐχθρῶν μου κενός — わたしは敵の前から、何も持たずに退くがよい (ἀποπίπτω — «отпадать»; κενός — «пустой»; оптатив передан 〜がよい)."
  5: "καταδιώξαι ἄρα ὁ ἐχθρὸς τὴν ψυχήν μου καὶ καταλάβοι — 敵がわたしの魂を追い、捕まえ (καταλαμβάνω — «захватывать»). καταπατήσαι εἰς γῆν τὴν ζωήν μου — わたしの命を地に踏みにじみ (καταπατέω — «попирать»). τὴν δόξαν μου εἰς χοῦν κατασκηνώσαι — わたしの栄光を塵のうちに住まわせる (χοῦς — «прах, пыль»). διάψαλμα не передаётся."
  6: "ἀνάστηθι, κύριε, ἐν ὀργῇ σου — 主よ、怒りのうちに立ち上がってください. ὑψώθητι ἐν τοῖς πέρασι τῶν ἐχθρῶν μου — わたしの敵の境の上に高く上がってください (πέρατα — «пределы»). ἐξεγέρθητι…ἐν προστάγματι, ᾧ ἐνετείλω — あなたが命じられた定めに従って、目を覚ましてください (ἐξεγείρομαι — «пробуждаться»; πρόσταγμα — «повеление»)."
  7: "καὶ συναγωγὴ λαῶν κυκλώσει σε — 諸民の集いがあなたを囲む (συναγωγή — «собрание»; κυκλόω — «окружать»). καὶ ὑπὲρ ταύτης εἰς ὕψος ἐπίστρεψον — その集いの上、高みに戻ってください (ὑπὲρ ταύτης — «над нею»; ἐπίστρεψον — «обратись, взойди»)."
  8: "κύριος κρινεῖ λαούς — 主は諸民を裁かれる. κρῖνόν με, κύριε, κατὰ τὴν δικαιοσύνην μου — 主よ、わたしの義に従って、わたしを裁いてください. κατὰ τὴν ἀκακίαν μου ἐπ᾽ ἐμοί — わたしのうちなる汚れのなさに従って (ἀκακία — «незлобие, непорочность»; ἐπ᾽ ἐμοί — «во мне»)."
  9: "συντελεσθήτω δὴ πονηρία ἁμαρτωλῶν — 罪人の悪が終わるように (συντελέω — «завершать, истреблять»; πονηρία — «злоба»). κατευθυνεῖς δίκαιον — あなたは正しい者を立て直される (κατευθύνω — «направлять, утверждать»). ἐτάζων καρδίας καὶ νεφροὺς ὁ θεός — 神よ、あなたは心と腎とを試みられる方である (ἐτάζω — «испытывать»; νεφροί — «почки», по-японски 腎, как место чувств; ср. 腎 в ст. 10 LXX и Откр 2:23)."
  10: "δικαία ἡ βοήθειά μου παρὰ τοῦ θεοῦ — わたしの助けは、神のもとにある、正しい助けである (βοήθεια — «помощь»; δικαία — «праведная»). τοῦ σῴζοντος τοὺς εὐθεῖς τῇ καρδίᾳ — 心の正しい者を救う (εὐθύς τῇ καρδίᾳ — «правый сердцем»)."
  11: "ὁ θεὸς κριτὴς δίκαιος καὶ ἰσχυρὸς καὶ μακρόθυμος — 神は正しく、力ある、寛容な裁き主 (κριτής — «судья»; μακρόθυμος — «долготерпеливый»). μὴ ὀργὴν ἐπάγων καθ᾽ ἑκάστην ἡμέραν — 日ごとに怒りを下されるのではない (ἐπάγω — «наводить»)."
  12: "ἐὰν μὴ ἐπιστραφῆτε — あなたがたが向きを変えないなら. τὴν ῥομφαίαν αὐτοῦ στιλβώσει — 神はその剣を磨かれる (ῥομφαία — «меч»; στιλβόω — «начищать, блистать»). τὸ τόξον αὐτοῦ ἐνέτεινεν καὶ ἡτοίμασεν αὐτό — 神は弓を張り、それを構え (ἐντείνω — «натягивать»)."
  13: "καὶ ἐν αὐτῷ ἡτοίμασεν σκεύη θανάτου — その弓に死の武具を備え (σκεύη θανάτου — «сосуды смерти»). τὰ βέλη αὐτοῦ τοῖς καιομένοις ἐξειργάσατο — 燃える矢を整えられた (βέλος — «стрела»; καιόμενα — «горящие», т. е. зажигательные стрелы)."
  14: "ἰδοὺ ὠδίννησεν ἀδικίαν — 見よ、彼は不義を身ごもり (ὠδίνω — «мучиться родами»). συνέλαβεν πόνον — 労苦をはらみ (συλλαμβάνω — «зачинать»; πόνος — «труд, боль»). ἔτεκεν ἀνομίαν — 不法を産んだ (τίκτω — «рождать»). Три глагола рождения сохранены."
  15: "λάκκον ὤρυξεν καὶ ἀνέσκαψεν αὐτόν — 彼は穴を掘り、それを深くし (λάκκος — «яма»; ἀνασκάπτω — «разрывать, углублять»). ἐμπεσεῖται εἰς βόθρον, ὃν εἰργάσατο — 自分の掘った落とし穴に落ちる (βόθρος — «ров, яма»)."
  16: "ἐπιστρέψει ὁ πόνος αὐτοῦ εἰς κεφαλὴν αὐτοῦ — 彼の労苦は彼の頭に返り. ἐπὶ κορυφὴν αὐτοῦ ἡ ἀδικία αὐτοῦ καταβήσεται — その不義は彼の頂に下る (κορυφή — «темя, вершина»; оба слова «голова» переданы различно — 頭 и 頂)."
  17: "ἐξομολογήσομαι κυρίῳ κατὰ τὴν δικαιοσύνην αὐτοῦ — わたしは主の義に従って主をほめたたえ (ἐξομολογέομαι — «славить, исповедовать»). ψαλῶ τῷ ὀνόματι κυρίου τοῦ ὑψίστου — いと高い主の名をほめ歌う (ψάλλω — «петь под струны»; ὕψιστος — いと高い)."
