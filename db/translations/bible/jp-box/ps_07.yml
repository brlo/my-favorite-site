# Бог — судия и щит (9–11), меч и стрелы на нераскаянных (12–13),
# беззаконие зачинается и падает на главу свою (14–16), обет хвалы (17).
# Красного и синего нет. Прямой речи людей и Бога нет; кавычек в главе нет.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα, в конце ст. 5) не передаётся — по решению пользователя, как у jp-joc.
