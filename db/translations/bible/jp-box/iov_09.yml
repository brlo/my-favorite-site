verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「まことに、わたしは知[し]っている。そのとおりだ。しかし、人[ひと]がどうして主[しゅ]の前[まえ]で正[ただ]しい者[もの]であり得[え]るだろうか。"
  3: "神[かみ]が人[ひと]と裁[さば]きを争[あらそ]おうと望[のぞ]まれても、神は聞[き]き入[い]れず、人はその千[せん]の言葉[ことば]の一[ひと]つにも答[こた]えることができない。"
  4: "神は心[こころ]に知[ち]恵[え]があり、強[つよ]く、大[おお]いなる方である。だれが神に逆[さか]らって身[み]を固[かた]くし、そのまま立[た]ち続[つづ]けられただろうか。"
  5: "神は山々[やまやま]を移[うつ]されるが、山々はそれを知[し]らない。怒[いか]りのうちに山々を覆[くつがえ]される。"
  6: "神は天[てん]の下[した]の地[ち]を基[き]から揺[ゆ]るがせ、その柱[はしら]を震[ふる]わせる。"
  7: "神が太陽[たいよう]に命[めい]じれば昇[のぼ]らず、星[ほし]々[ぼし]には封印[ふういん]をされる。"
  8: "神はただ一人[ひとり]で天[てん]を張[は]り、海[うみ]を地[ち]のように歩[ある]まれる。"
  9: "神はプレアデス、ヘスペロス、アルクトゥロス、南[みなみ]の宝庫[ほうこ]を造[つく]られた。"
  10: "神は大[おお]いなること、探[さぐ]り知[し]れないこと、栄光[えいこう]あること、驚[おどろ]くべきことを、数[かぞ]えきれないほど行[おこな]われる。"
  11: "神がわたしのそばを通[とお]り過[す]ぎても、わたしは見[み]ることができない。過[す]ぎ去[さ]られても、わたしには分[わ]からない。"
  12: "神が取[と]り去[さ]られれば、だれがそれを引[ひ]き返[かえ]せるだろうか。だれが神に『何[なに]をなさったのか』と言[い]えるだろうか。"
  13: "神はご自分[じぶん]の怒[いか]りを退[しりぞ]けられる。神の下[した]で、天[てん]の下の巨獣[きょじゅう]たちも身[み]をかがめた。"
  14: "神がわたしの言[い]うことを聞[き]かれるとしても、わたしの言葉[ことば]を吟味[ぎんみ]してくださるだろうか。"
  15: "たとえわたしが正[ただ]しくても、神は聞[き]き入[い]れてくださらない。わたしはただ神の裁[さば]きに願[ねが]い求[もと]めるほかない。"
  16: "たとえわたしが呼[よ]びかけ、神が答[こた]えられたとしても、わたしは神が自分の声[こえ]を聞[き]いたとは信[しん]じない。"
  17: "神は暗[くら]やみでわたしを打[う]ち砕[くだ]かれる。理由[りゆう]もなく、わたしの傷[きず]を多[おお]くされた。"
  18: "神はわたしに息[いき]をつかせず、苦[にが]さでわたしを満[み]たされた。"
  19: "神は力[ちから]によって支配[しはい]される。だれが神の裁[さば]きに逆[さか]らえるだろうか。"
  20: "たとえわたしが正[ただ]しくても、わたしの口[くち]は不[ふ]敬[けい]なことを言[い]う。たとえわたしが非[ひ]のない者[もの]でも、わたしは曲[ま]がった者[もの]とされる。"
  21: "たとえわたしが不[ふ]敬[けい]であっても、わたしはそれを魂[たましい]で知[し]らない。ただ、わたしの命[いのち]が取[と]り去[さ]られるのみである。"
  22: "だから、わたしは言[い]った、『怒[いか]りは大[おお]いなる者[もの]も強[つよ]い者[もの]も滅[ほろ]ぼす』と。"
  23: "悪[わる]い者[もの]は恐[おそ]ろしい死[し]に倒[たお]れ、正[ただ]しい者[もの]はあざ笑[わら]われるからである。"
  24: "地[ち]は不[ふ]敬[けい]な者[もの]の手[て]に渡[わた]され、その裁[さば]き手[て]たちの顔[かお]は覆[おお]われる。もし神でなければ、だれがそうするのか。"
  25: "わたしの日々[ひび]は走[はし]り手[て]よりも速[はや]い。彼[かれ]らは逃[に]げ去[さ]り、何[なに]も見[み]なかった。"
  26: "舟[ふね]の通[とお]った跡[あと]が残[のこ]るだろうか。餌[えさ]を求[もと]めて飛[と]ぶ鷲[わし]の跡が残るだろうか。"
  27: "たとえわたしが『語[かた]ることを忘[わす]れよう』と言[い]っても、わたしは顔[かお]を伏[ふ]せて嘆[なげ]く。"
  28: "わたしは全身[ぜんしん]を震[ふる]わせている。あなたがわたしを罪[つみ]なき者[もの]として放[はな]っておかれないことを知[し]っているからである。"
  29: "わたしは不[ふ]敬[けい]な者[もの]であるのに、なぜ死[し]ななかったのか。"
  30: "たとえわたしが雪[ゆき]で身[み]を洗[あら]い、手[て]を清[きよ]くして清[きよ]めても、"
  31: "あなたはわたしを汚[よご]れの中[なか]にすっかり浸[ひた]し、わたしの衣[ころも]さえわたしを忌[い]み嫌[きら]う。"
  32: "あなたはわたしのような人[ひと]ではない。わたしがあなたと論[ろん]じ合[あ]い、ともに裁[さば]きの座[ざ]に臨[のぞ]むことなどできない。"
  33: "ああ、わたしたちの間[あいだ]に立[た]ち、双方[そうほう]の間で責[せ]め、また聞[き]き分[わ]ける仲介者[ちゅうかいしゃ]がいてくれたら。"
  34: "神がわたしからその杖[つえ]を取[と]り去[さ]り、その恐[おそ]ろしさがわたしをかき乱[みだ]さないように。"
  35: "そうすれば、わたしは恐[おそ]れずに語[かた]ることができる。わたしは自分[じぶん]をそのようには知[し]っていないからである。」"

notes:
  1: "Повествование. Ὑπολαβὼν δὲ Ιωβ λέγει — «И отвечал Иов и сказал». Формула вне кавычек; речь начинается в ст. 2."
  2: "Иов. Ἐπ᾿ ἀληθείας οἶδα — «поистине знаю». πῶς ἔσται δίκαιος βροτός — «как будет праведен смертный» (βροτός — «смертный»). παρὰ κυρίῳ — «у Господа». Здесь открывается 「 (закрывается в 9:35)."
  3: "Иов. βούληται κριθῆναι αὐτῷ — «захочет судиться с Ним» (κρίνομαι). οὐ μὴ ὑπακούσῃ — «не послушает» (ὑπακούω). ἀντείπῃ πρὸς ἕνα λόγον ἐκ χιλίων — «ответит на одно слово из тысячи» (ἀντιλέγω)."
  4: "Иов. σοφὸς διανοίᾳ — «мудр разумом» (διάνοια); κραταιός — «крепкий, могучий». τίς σκληρὸς γενόμενος ἐναντίον αὐτοῦ ὑπέμεινεν — «кто, ожесточившись против Него, устоял» (σκληρός, ὑπομένω)."
  5: "Иов. ὁ παλαιῶν ὄρη — «старящий, сдвигающий горы» (παλαιόω — «делать старым»); καὶ οὐκ οἴδασιν — «и они не знают». καταστρέφων — «ниспровергающий» (καταστρέφω); ὀργῇ — «в гневе»."
  6: "Иов. σείων τὴν ὑπ᾿ οὐρανόν — «потрясающий поднебесную» (σείω). ἐκ θεμελίων — «от оснований». στῦλοι αὐτῆς σαλεύονται — «столпы её колеблются» (σαλεύω)."
  7: "Иов. λέγων τῷ ἡλίῳ καὶ οὐκ ἀνατέλλει — «говорящий солнцу, и не восходит». κατὰ ἄστρων κατασφραγίζει — «на звёзды налагает печать» (κατασφραγίζω)."
  8: "Иов. τανύσας τὸν οὐρανὸν μόνος — «один распростёрший небо» (τανύω). περιπατῶν ὡς ἐπ᾿ ἐδάφους ἐπὶ θαλάσσης — «ходящий по морю, как по полу» (ἔδαφος)."
  9: "Иов. Πλειάς — プレアデス; Ἕσπερος — ヘスペロス (вечерняя звезда); Ἀρκτοῦρος — アルクトゥロス; ταμεῖα νότου — «хранилища юга» (ταμεῖον). Слав. транслитерирует: «плиады, еспера, арктура»."
  10: "Иов. μεγάλα καὶ ἀνεξιχνίαστα — «великое и неисследимое»; ἔνδοξα καὶ ἐξαίσια — «славное и дивное»; ὧν οὐκ ἔστιν ἀριθμός — «которым нет числа». Оборот дословно повторяет 5:9."
  11: "Иов. ἐὰν ὑπερβῇ με — «если пройдёт мимо меня» (ὑπερβαίνω). οὐ μὴ ἴδω — «не увижу». παρέλθῃ — «пройдёт» (παρέρχομαι); οὐδ᾿ ὧς ἔγνων — «и так не узнал»."
  12: "Иов. ἐὰν ἀπαλλάξῃ — «если отнимет, удалит» (ἀπαλλάσσω). τίς ἀποστρέψει — «кто отвратит, вернёт». τίς ἐρεῖ αὐτῷ· Τί ἐποίησας — «кто скажет Ему: что сделал?»: прямая речь в 『…』."
  13: "Иов. ἀπέστραπται ὀργήν — «отвратил гнев» (ἀποστρέφω). ὑπ᾿ αὐτοῦ ἐκάμφθησαν κήτη — «под Ним согнулись чудовища» (κάμπτω; κῆτος — «морское чудовище»); τὰ ὑπ᾿ οὐρανόν — «поднебесные». Тёмный образ, передан 巨獣."
  14: "Иов. ἐὰν δέ μου ὑπακούσηται — «если Он меня послушает». ἦ διακρινεῖ τὰ ῥήματά μου — «разве разберёт, рассудит слова мои» (διακρίνω). Вопрос с оттенком сомнения."
  15: "Иов. ἐάν τε ὦ δίκαιος — «если и буду праведен». οὐκ εἰσακούσεταί μου — «не услышит меня». τοῦ κρίματος αὐτοῦ δεηθήσομαι — «буду умолять о суде Его» (δέομαι)."
  16: "Иов. ἐάν τε καλέσω καὶ ὑπακούσῃ — «если и воззову, и Он услышит». οὐ πιστεύω ὅτι εἰσακήκοέν μου — «не верю, что Он услышал меня» (перфект εἰσακούω)."
  17: "Иов. μὴ γνόφῳ με ἐκτρίψῃ — «разве не в мраке сотрёт меня» (γνόφος — «мрак, туча»; ἐκτρίβω — «стирать»). πολλὰ συντρίμματα — «многие сокрушения» (σύντριμμα); διὰ κενῆς — «без причины»."
  18: "Иов. οὐκ ἐᾷ με ἀναπνεῦσαι — «не даёт мне вздохнуть, перевести дух» (ἐάω, ἀναπνέω). ἐνέπλησέν με πικρίας — «наполнил меня горечью» (πικρία)."
  19: "Иов. ἰσχύι κρατεῖ — «силою властвует, одолевает» (κρατέω). τίς κρίματι αὐτοῦ ἀντιστήσεται — «кто суду Его противостанет» (ἀνθίστημι)."
  20: "Иов. ἐὰν ὦ δίκαιος, τὸ στόμα μου ἀσεβήσει — «если праведен, уста мои будут нечестивы»; ἀσεβέω — «быть нечестивым». ἄμεμπτος — «непорочный»; σκολιὸς ἀποβήσομαι — «стану кривым, превратным» (σκολιός)."
  21: "Иов. εἴτε γὰρ ἠσέβησα, οὐκ οἶδα τῇ ψυχῇ — «если и нечествовал, не знаю душою». πλὴν ὅτι ἀφαιρεῖταί μου ἡ ζωή — «только что отнимается жизнь моя» (ἀφαιρέω)."
  22: "Иов. διὸ εἶπον — «потому я сказал». Μέγαν καὶ δυνάστην ἀπολλύει ὀργή — «великого и сильного губит гнев»: изречение самого Иова, передано прямой речью в 『…』."
  23: "Иов. φαῦλοι ἐν θανάτῳ ἐξαισίῳ — «ничтожные в смерти дивной, страшной» (ἐξαίσιος). δίκαιοι καταγελῶνται — «праведные осмеиваются» (καταγελάω)."
  24: "Иов. παραδίδονται εἰς χεῖρας ἀσεβοῦς — «предаются в руки нечестивого»; слав. добавляет «земля». πρόσωπα κριτῶν αὐτῆς συγκαλύπτει — «лица судей её покрывает» (συγκαλύπτω). εἰ δὲ μὴ αὐτός, τίς ἐστιν — «если не Он, кто же»."
  25: "Иов. ἐλαφρότερος δρομέως — «быстрее бегуна» (δρομεύς); слав. «легчае скоротечца». ἀπέδρασαν καὶ οὐκ εἴδοσαν — «убежали и не увидели»; объект не назван, в тексте 何も見なかった, в notes отмечена недоговорённость."
  26: "Иов. ναυσὶν ἴχνος ὁδοῦ — «след пути кораблям» (ἴχνος); ἀετοῦ πετομένου ζητοῦντος βοράν — «орла летящего, ищущего добычу» (βορά)."
  27: "Иов. ἐάν τε εἴπω, ἐπιλήσομαι λαλῶν — «если скажу: забуду говорить»: своя речь в 『…』. συγκύψας τῷ προσώπῳ — «склонив лицо»; στενάξω — «воздохну, застону» (στενάζω)."
  28: "Иов. σείομαι πᾶσιν τοῖς μέλεσιν — «трясусь всеми членами» (σείω). οὐκ ἀθῷόν με ἐάσεις — «не оставишь меня безвинным, невиновным» (ἀθῷος)."
  29: "Иов. ἐπειδὴ δέ εἰμι ἀσεβής — «если же я нечестив». διὰ τί οὐκ ἀπέθανον — «почему не умер». ἀσεβής — 不敬な者."
  30: "Иов. ἀπολούσωμαι χιόνι — «омоюсь снегом» (ἀπολούω). ἀποκαθάρωμαι χερσὶν καθαραῖς — «очищусь руками чистыми» (ἀποκαθαίρω). Условие продолжается в ст. 31."
  31: "Иов. ἱκανῶς ἐν ῥύπῳ με ἔβαψας — «достаточно погрузил меня в грязь» (ῥύπος — «грязь»; βάπτω — «погружать»). ἐβδελύξατο δέ με ἡ στολή — «возгнушалась мною одежда моя» (βδελύσσομαι)."
  32: "Иов. οὐ γὰρ εἶ ἄνθρωπος κατ᾿ ἐμέ — «ибо Ты не человек, как я». ᾧ ἀντικρινοῦμαι — «с которым я мог бы судиться» (ἀντικρίνομαι). ὁμοθυμαδὸν εἰς κρίσιν — «вместе на суд»."
  33: "Иов. εἴθε ἦν ὁ μεσίτης ἡμῶν — «о если бы был посредник наш» (μεσίτης): это пожелание, а не утверждение «нет посредника»; ru по МТ читает «нет между нами посредника» — расхождение отмечено. ἐλέγχων — «обличающий»; διακούων — «выслушивающий» (διακούω); ἀνὰ μέσον ἀμφοτέρων — «между обоими»."
  34: "Иов. ἀπαλλαξάτω ἀπ᾿ ἐμοῦ τὴν ῥάβδον — «да удалит от меня жезл Свой» (ἀπαλλάσσω, ῥάβδος). ὁ φόβος αὐτοῦ μή με στροβείτω — «страх Его да не потрясает меня» (στροβέω — «вертеть, мучить»)."
  35: "Иов. καὶ οὐ μὴ φοβηθῶ, ἀλλὰ λαλήσω — «и не убоюсь, но буду говорить». οὐ γὰρ οὕτω συνεπίσταμαι — «ибо я не так себя сознаю» (συνεπίσταμαι): тёмный оборот, слав. «ибо тако не вем сам себе». Здесь цитата закрывается; речь Иова продолжается в главе 10."
