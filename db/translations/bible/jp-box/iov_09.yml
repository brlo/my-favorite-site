# jp-box, Иов, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только главы 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: ответ Иова. Формула (1), кто оправдается пред Богом (2–4),
# могущество Божие в творении (5–10), непостижимость Его путей (11–13),
# нет оправдания пред Богом (14–24), краткость и горечь жизни (25–31),
# желание посредника и страх перед Богом (32–35).
# Голоса: 9:1 — повествование (формула вне кавычек); 9:2–35 — Иов, одна цитата.
# Речь продолжается в главе 10; здесь, по требованию партии, цитата закрывается
# в конце 9:35 (в главе 10 она снова откроется), в notes отмечено.
# Вложенная речь — 『…』 в 9:12 («что Ты сделал?»), 9:22 («гнев губит великого
# и сильного») и 9:27 («забуду говорить»), внутри внешней цитаты Иова.
# Нумерация по gr: 35 стихов; деление совпадает с csl и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет: プレアデス, 封印, 巨獣 и пр.
# уже в корпусе. Имена: プレアデス, ヘスペロス, アルクトゥロス (9:9); テマン и サボン — в гл. 6.

