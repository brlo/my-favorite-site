verses:
  1: "さて、過越祭[すぎこしまつり]⟨エジプト脱出[だっしゅつ]を記念[きねん]するユダヤの祭[まつ]り。除酵祭[じょこうさい]は、それに続[つづ]いてパン種[だね]のないパンを食[た]べる祭[まつ]り。⟩と除酵祭[じょこうさい]まで、あと二日[ふつか]になっていた。祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちは、どのように計略[けいりゃく]を用[もち]いてイエスを捕[と]らえ、殺[ころ]そうかと考[かんが]えていた。"
  2: "ただ、彼[かれ]らは言[い]っていた。「祭[まつ]りの期間[きかん]はよそう。民[たみ]が騒[さわ]ぐといけないから。」"
  3: "イエスがベタニアで、重[おも]い皮膚病[ひふびょう]の人[ひと]シモンの家[いえ]に食卓[しょくたく]に着[つ]いておられたとき、一人[ひとり]の女[おんな]が、純粋[じゅんすい]なナルドの香油[こうゆ]の入[はい]った石膏[せっこう]の壺[つぼ]を持[も]って来[き]た。壺[つぼ]を壊[こわ]して、香油[こうゆ]をイエスの頭[あたま]に注[そそ]ぎかけた。"
  4: "すると、ある者[もの]たちが憤[いきどお]って、互[たが]いに言[い]った。「どうして、こんな無駄遣[むだづか]いをするのか。"
  5: "この香油[こうゆ]は三百[さんびゃく]デナリオン以上[いじょう]で売[う]れて、貧[まず]しい人々[ひとびと]に施[ほどこ]すこともできたのに。」そして、彼[かれ]らは女[おんな]を責[せ]めた。"
  6: "イエスは言[い]われた。「<j>そのままにしておきなさい。なぜ、この女[おんな]を煩[わずら]わすのか。わたしによい行[おこな]いをしてくれたのだ。</j>"
  7: "<j>貧[まず]しい人々[ひとびと]なら、いつでもあなたがたと一緒[いっしょ]にいて、望[のぞ]むときにはいつでも彼[かれ]らに善[よ]い行[おこな]いをすることもできる。だが、わたしはいつでも一緒[いっしょ]にいるのではない。</j>"
  8: "<j>この人[ひと]は、自分[じぶん]にできることをしたのだ。わたしの体[からだ]に先[さき]だって香油[こうゆ]を塗[ぬ]り、葬[ほうむ]りの用意[ようい]をしたのである。</j>"
  9: "<j>はっきり言[い]っておく。世界中[せかいじゅう]のどこでこの福音[ふくいん]が宣[の]べ伝[つた]えられても、この女[おんな]がしたことは、その記念[きねん]として語[かた]り伝[つた]えられる。</j>」"
  10: "すると、十二人[じゅうににん]の一人[ひとり]であるイスカリオテのユダが、イエスを祭司長[さいしちょう]たちに引[ひ]き渡[わた]すために、彼[かれ]らのもとへ出[で]かけて行[い]った。"
  11: "彼[かれ]らはそれを聞[き]いて喜[よろこ]び、ユダに銀[ぎん]を与[あた]えることを約束[やくそく]した。そこでユダは、イエスを都合[つごう]よく引[ひ]き渡[わた]す機会[きかい]をうかがい始[はじ]めた。"
  12: "除酵祭[じょこうさい]の初[はじ]めの日[ひ]、すなわち過越[すぎこし]の小羊[こひつじ]を屠[ほふ]る時[とき]、弟子[でし]たちがイエスに言[い]った。「過越[すぎこし]の食事[しょくじ]をなさるのに、わたしたちはどこへ行[い]って用意[ようい]をしようか。」"
  13: "そこで、イエスは弟子[でし]たちのうちの二人[ふたり]を遣[つか]わして言[い]われた。「<j>都[みやこ]へ行[い]きなさい。すると、水[みず]の入[はい]った甕[かめ]を運[はこ]んで来[く]る男[おとこ]が、あなたがたに出会[であ]う。その人[ひと]について行[い]き。</j>"
  14: "<j>その人[ひと]が入[はい]って行[い]く家[いえ]の主人[しゅじん]に、こう言[い]いなさい。『先生[せんせい]が、「わたしが弟子[でし]たちと一緒[いっしょ]に過越[すぎこし]の食事[しょくじ]をする部屋[へや]はどこか」と言[い]っています』。</j>"
  15: "<j>すると、その人[ひと]は、敷[し]き物[もの]が敷[し]かれ、支度[したく]の整[ととの]った大[おお]きな二階[にかい]の部屋[へや]を、あなたがたに見[み]せる。そこに、わたしたちの用意[ようい]をしなさい。</j>」"
  16: "弟子[でし]たちは出[で]かけて都[みやこ]へ行[い]き、イエスが言[い]われたとおりのことを見[み]つけて、過越[すぎこし]の食事[しょくじ]の用意[ようい]をした。"
  17: "夕方[ゆうがた]になると、イエスは十二人[じゅうににん]と一緒[いっしょ]に来[こ]られた。"
  18: "そして、一同[いちどう]が食卓[しょくたく]に着[つ]いて食事[しょくじ]をしていたとき、イエスは言[い]われた。「<j>はっきり言[い]っておく。あなたがたのうちの一人[ひとり]、このわたしと一緒[いっしょ]に食事[しょくじ]をしている者[もの]が、わたしを裏切[うらぎ]るのだ。</j>」"
  19: "彼[かれ]らは悲[かな]しみ始[はじ]め、一人[ひとり]ひとりが、「まさか、わたしでは」とイエスに言[い]った。"
  20: "イエスは言[い]われた。「<j>十二人[じゅうににん]の一人[ひとり]で、このわたしと一緒[いっしょ]に皿[さら]に手[て]を浸[ひた]している者[もの]だ。</j>"
  21: "<j>人[ひと]の子[こ]は、自分[じぶん]について書[か]かれているとおりに去[さ]って行[く]。しかし、人[ひと]の子[こ]を裏切[うらぎ]るその人[ひと]は災[わざわ]いだ。その人[ひと]は、生[う]まれなかったほうがよかったのだ。</j>」"
  22: "一同[いちどう]が食事[しょくじ]をしているとき、イエスはパンを取[と]り、賛美[さんび]の祈[いの]りを唱[とな]えてからそれを裂[さ]き、弟子[でし]たちに渡[わた]して言[い]われた。「<j>取[と]って〔食[た]べなさい〕。これはわたしの体[からだ]である。</j>」"
  23: "次[つぎ]に、杯[さかずき]を取[と]って感謝[かんしゃ]の祈[いの]りを唱[とな]え、彼[かれ]らに渡[わた]された。すると皆[みな]、その杯[さかずき]から飲[の]んだ。"
  24: "そして、言[い]われた。「<j>これは、多[おお]くの人[ひと]のために流[なが]される〔新[あたら]しい〕契約[けいやく]のわたしの血[ち]である。</j>"
  25: "<j>はっきり言[い]っておく。わたしは、神[かみ]の国[くに]でそれを新[あたら]しく飲[の]むその日[ひ]まで、もはやぶどうの実[み]から造[つく]ったものは飲[の]まない。</j>」"
  26: "そして、賛美[さんび]の歌[うた]を歌[うた]い終[お]えると、オリーブ山[やま]へ出[で]て行[い]った。"
  27: "イエスは弟子[でし]たちに言[い]われた。「<j>あなたがたは皆[みな]、つまずく。『わたしが羊飼[ひつじか]いを打[う]つと、羊[ひつじ]は散[ち]らされる』と書[か]いてあるからである。</j>"
  28: "<j>だが、わたしは復活[ふっかつ]したあと、あなたがたに先[さき]立[だ]ってガリラヤへ向[む]かう。</j>」"
  29: "ペトロは言[い]った。「たとえ皆[みな]がつまずいても、わたしはつまずかない。」"
  30: "イエスは言[い]われた。「<j>はっきり言[い]っておく。今日[きょう]、この夜[よる]のうちに、鶏[にわとり]が二度[にど]鳴[な]く前[まえ]に、あなたは三度[さんど]、わたしを知[し]らないと言[い]うのだ。</j>」"
  31: "しかし、ペトロは強[つよ]く言[い]い張[は]った。「たとえ、あなたと一緒[いっしょ]に死[し]ぬことになっても、わたしは決[けっ]してあなたを知[し]らないとは言[い]わない。」皆[みな]も同[おな]じように言[い]った。"
  32: "そして、ゲツセマネという名[な]の所[ところ]へ来[こ]られた。イエスは弟子[でし]たちに言[い]われた。「<j>わたしが祈[いの]るまで、ここに座[すわ]っていなさい。</j>」"
  33: "イエスはペトロ、ヤコブ、ヨハネを伴[ともな]って行[い]かれた。そして、恐[おそ]れと苦[くる]しみに沈[しず]み始[はじ]められた。"
  34: "そして言[い]われた。「<j>わたしの魂[たましい]は、死[し]ぬほどに悲[かな]しい。ここを動[うご]かず、目[め]を覚[さ]ましていなさい。</j>」"
  35: "イエスは少[すこ]し先[さき]へ進[すす]んで行[い]き、地[ち]に伏[ふ]して、できることなら、この時[とき]が自分[じぶん]から過[す]ぎ去[さ]るようにと祈[いの]られた。"
  36: "そして言[い]われた。「<j>アバ、父[ちち]よ。あなたには何[なん]でもおできになります。この杯[さかずき]をわたしから過[す]ぎ去[さ]らせてください。しかし、わたしの望[のぞ]むとおりではなく、あなたの望[のぞ]まれるとおりに。</j>」"
  37: "イエスは戻[もど]って来[き]て、弟子[でし]たちが眠[ねむ]っているのをご覧[らん]になり、ペトロに言[い]われた。「<j>シモン、眠[ねむ]っているのか。一時間[いちじかん]も目[め]を覚[さ]ましていられなかったのか。</j>"
  38: "<j>誘惑[ゆうわく]に陥[おちい]らぬよう、目[め]を覚[さ]まして祈[いの]っていなさい。霊[れい]は進[すす]んでいても、肉体[にくたい]は弱[よわ]い。</j>」"
  39: "イエスはまた離[はな]れて行[い]き、同[おな]じ言葉[ことば]で祈[いの]られた。"
  40: "そして、また戻[もど]って来[き]てご覧[らん]になると、彼[かれ]らは眠[ねむ]っていた。目[め]がひどく重[おも]かったからである。彼[かれ]らは、何[なん]とお答[こた]えしてよいか分[わ]からなかった。"
  41: "三度目[さんどめ]に来[き]て、イエスは言[い]われた。「<j>まだ眠[ねむ]って休[やす]んでいるのか。もう十分[じゅうぶん]だ。時[とき]が来[き]た。見[み]よ、人[ひと]の子[こ]は罪人[ざいにん]たちの手[て]に引[ひ]き渡[わた]される。</j>"
  42: "<j>立[た]ちなさい。行[い]こう。見[み]よ、わたしを裏切[うらぎ]る者[もの]が近[ちか]づいている。</j>」"
  43: "イエスがまだ話[はな]しておられるうちに、すぐに、十二人[じゅうににん]の一人[ひとり]のユダがやって来[き]た。祭司長[さいしちょう]たち、律法学者[りっぽうがくしゃ]たち、長老[ちょうろう]たちのもとから遣[つか]わされた群衆[ぐんしゅう]が、剣[けん]や棒[ぼう]を持[も]って彼[かれ]と一緒[いっしょ]に来[き]た。"
  44: "イエスを裏切[うらぎ]る者[もの]は、あらかじめ彼[かれ]らに合図[あいず]を決[き]めておいて、こう言[い]っていた。「わたしが接吻[せっぷん]する者[もの]が、その人[ひと]だ。捕[つか]まえて、確[かく]実[じつ]に引[ひ]き立[た]てて行[い]け。」"
  45: "そして、来[く]るとすぐ、イエスに近[ちか]づいて、「先生[せんせい]」と言[い]って接吻[せっぷん]した。"
  46: "すると、彼[かれ]らはイエスに手[て]をかけて捕[と]らえた。"
  47: "そばに立[た]っていた者[もの]の一人[ひとり]が剣[けん]を抜[ぬ]いて、大祭司[だいさいし]の僕[しもべ]を打[う]ち、その耳[みみ]を切[き]り落[と]した。"
  48: "イエスは言[い]われた。「<j>まるで強盗[ごうとう]にでも向[む]かうように、剣[けん]や棒[ぼう]を持[も]ってわたしを捕[と]らえに来[き]たのか。</j>"
  49: "<j>わたしは毎日[まいにち]、神殿[しんでん]であなたがたと一緒[いっしょ]にいて教[おし]えていたのに、あなたがたはわたしを捕[と]らえなかった。しかし、これは聖書[せいしょ]が成就[じょうじゅ]するためなのである。</j>」"
  50: "そのとき、弟子[でし]たちは皆[みな]、イエスを置[お]いて逃[に]げた。"
  51: "イエスに従[したが]って来[き]ていた若者[わかもの]が一人[ひとり]いた。裸[はだか]の体[からだ]に亜麻布[あまぬの]を一枚[いちまい]まとっていただけである。人々[ひとびと]は彼[かれ]を捕[つか]まえたが、"
  52: "彼[かれ]は亜麻布[あまぬの]を捨[す]てて、裸[はだか]のまま逃[に]げ去[さ]った。"
  53: "人々[ひとびと]はイエスを大祭司[だいさいし]のところへ引[ひ]き連[つ]れて行[い]った。そこには、祭司長[さいしちょう]たち、長老[ちょうろう]たち、律法学者[りっぽうがくしゃ]たちが皆[みな]、集[あつ]まっていた。"
  54: "ペトロは遠[とお]くからイエスに従[したが]って、大祭司[だいさいし]の屋敷[やしき]の中庭[なかにわ]の奥[おく]まで入[はい]り、下役[したやく]たちと一緒[いっしょ]に座[すわ]って、火[ひ]の光[ひかり]のそばで体[からだ]を暖[あたた]めていた。"
  55: "祭司長[さいしちょう]たちと最高法院[さいこうほういん]の全員[ぜんいん]は、イエスを死刑[しけい]にするために、証言[しょうげん]を求[もと]めていたが、見[み]つからなかった。"
  56: "多[おお]くの者[もの]がイエスに不利[ふり]な偽[いつわ]りの証言[しょうげん]をしたが、その証言[しょうげん]は一致[いっち]しなかった。"
  57: "すると、何人[なんにん]かが立[た]ち上[あ]がって、イエスに不利[ふり]な偽[いつわ]りの証言[しょうげん]をして言[い]った。"
  58: "「わたしたちは、この人[ひと]が『わたしは、この手[て]で造[つく]られた神殿[しんでん]を壊[こわ]し、三日[みっか]のうちに、手[て]で造[つく]られていない別[べつ]の神殿[しんでん]を建[た]てる』と言[い]うのを聞[き]きました。」"
  59: "しかし、このようにしても、彼[かれ]らの証言[しょうげん]は一致[いっち]しなかった。"
  60: "そこで、大祭司[だいさいし]は真[ま]ん中[なか]に立[た]ち上[あ]がって、イエスに尋[たず]ねた。「何[なに]も答[こた]えないのか。この者[もの]たちが、おまえに不利[ふり]なことを証言[しょうげん]しているが、どうなのか。」"
  61: "しかし、イエスは黙[だま]ったままで、何[なに]もお答[こた]えにならなかった。大祭司[だいさいし]は重[かさ]ねて尋[たず]ねた。「おまえは、ほめたたえられる方[かた]の子[こ]、キリストなのか。」"
  62: "イエスは言[い]われた。「<j>わたしこそ、そうだ。そして、あなたがたは、人[ひと]の子[こ]が力[ちから]ある方[かた]の右[みぎ]に座[すわ]り、天[てん]の雲[くも]に乗[の]って来[く]るのを見[み]るであろう。</j>」"
  63: "大祭司[だいさいし]は衣[ころも]を引[ひ]き裂[さ]いて言[い]った。「これ以上[いじょう]、何[なん]の証人[しょうにん]が必要[ひつよう]だろうか。"
  64: "あなたがたは、神[かみ]を冒涜[ぼうとく]する言葉[ことば]を聞[き]いたのだ。どう思[おも]うか。」彼[かれ]らは皆[みな]、イエスを死[し]に値[あたい]する者[もの]と定[さだ]めた。"
  65: "すると、ある者[もの]たちはイエスに唾[つば]をかけて顔[かお]を覆[おお]い、こぶしで打[う]ちつけながら、「預言[よげん]してみよ」と言[い]い、また下役[したやく]たちも平手[ひらて]でイエスを打[う]った。"
  66: "ペトロが下[した]の中庭[なかにわ]にいたとき、大祭司[だいさいし]の女中[じょちゅう]の一人[ひとり]が来[き]て、"
  67: "ペトロが火[ひ]に当[あ]たって暖[あたた]まっているのを見[み]ると、じっと見[み]つめて言[い]った。「あなたも、ナザレのイエスと一緒[いっしょ]にいましたね。」"
  68: "しかし、ペトロは否[いな]んで言[い]った。「あなたが何[なに]を言[い]っているのか、わたしには分[わ]からないし、知[し]りもしない。」そして、外[そと]の前庭[ぜんてい]へ出[で]て行[い]った。〔そして、鶏[にわとり]が鳴[な]いた。〕"
  69: "女中[じょちゅう]はペトロをまた見[み]て、そばに立[た]っている人々[ひとびと]に言[い]い始[はじ]めた。「この人[ひと]も、あの仲間[なかま]の一人[ひとり]です。」"
  70: "しかし、ペトロはまた否[いな]んだ。しばらくすると、そばに立[た]っていた人々[ひとびと]がまたペトロに言[い]った。「確[たし]かに、あなたはあの者[もの]たちの一人[ひとり]だ。あなたはガリラヤ人[じん]だから。」"
  71: "しかし、ペトロは呪[のろ]いの言葉[ことば]を口[くち]にし、誓[ちか]って言[い]い始[はじ]めた。「あなたがたの言[い]うその人[ひと]は、わたしは知[し]らない。」"
  72: "すると、すぐに鶏[にわとり]が二度目[にどめ]に鳴[な]いた。ペトロは、イエスが自分[じぶん]に言[い]われた「鶏[にわとり]が二度[にど]鳴[な]く前[まえ]に、あなたは三度[さんど]、わたしを知[し]らないと言[い]うだろう」という言葉[ことば]を思[おも]い出[だ]して、泣[な]き崩[くず]れた。"

notes:
  1: "τὰ ἄζυμα — «опресноки»; 過越祭 и 除酵祭 здесь впервые в Марке, поэтому сноска одна на оба (в Мф 26:2 она уже была). μετὰ δύο ἡμέρας — «через два дня»."
  2: "ἐν δόλῳ (14:1) — «с хитростью»; θόρυβος — «смятение, волнение»; 騒ぐ."
  3: "κατακειμένου αὐτοῦ — «когда Он возлежал»; у Матфея иначе (26:6). συντρίψασα τὴν ἀλάβαστρον — у Марка женщина разбивает сосуд, у Матфея этого нет; деталь сохранена. πιστικῆς — тёмное слово, понято как «чистый, настоящий» (純粋な)."
  4: "τινες — «некоторые»; у Матфея негодуют ученики (26:8). πρὸς ἑαυτούς — «между собой»."
  5: "ἐπάνω δηναρίων τριακοσίων — «более трёхсот динариев»; у Матфея цены нет. ἐνεβριμῶντο — «строго выговаривали ей»."
  7: "У Марка добавлено καὶ ὅταν θέλητε δύνασθε αὐτοῖς εὖ ποιῆσαι — «когда захотите, можете делать добро»; у Матфея 26:11 этого нет."
  8: "ὃ ἔσχεν ἐποίησεν — «сделала, что могла»; προέλαβεν — «заранее», деталь Марка: она помазала тело прежде погребения."
  9: "εἰς μνημόσυνον αὐτῆς — «в память её»."
  10: "У Марка нет суммы (тридцать сребреников — только у Мф 26:15); ἀργύριον — «серебро, деньги»."
  12: "ὅτε τὸ πάσχα ἔθυον — «когда заколали пасхального агнца»; у Матфея этого нет."
  15: "ἀνάγαιον μέγα ἐστρωμένον ἕτοιμον — «большая горница, устланная, готовая»; 二階の部屋."
  18: "ὁ ἐσθίων μετ᾽ ἐμοῦ — «едящий со Мною»; у Матфея 26:21 этого нет."
  19: "У Марка только Μήτι ἐγώ; — «не я ли?», без κύριε (ср. Мф 26:22)."
  20: "εἰς τὸ τρύβλιον — «в (одно) блюдо»; у Марка не сказано «руку», но по-японски действие требует дополнения — 手を浸す."
  21: "καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος — «лучше было бы ему, если бы не родился человек тот»."
  22: "В базе сайта только Λάβετε; Церковь (Елизаветинская «приимите, ядите», jp-joc) читает и φάγετε — добавка в 〔…〕. εὐλογήσας — «благословив» (賛美の祈り), в 14:23 εὐχαριστήσας — «возблагодарив» (感謝の祈り); у Марка это разные слова, не выравнивались."
  23: "У Марка нет слов Христа над чашей: «и пили из него все» — речь евангелиста; слова Христа только в 14:24. В Мф 26:27–28 иначе."
  24: "В базе τῆς διαθήκης без καινῆς; Церковь читает καινῆς — 〔新[あたら]しい〕; ὑπὲρ πολλῶν — «за многих»."
  25: "οὐκέτι οὐ μὴ πίω — усиленное отрицание; γενήματος τῆς ἀμπέλου — «от плода виноградной лозы», передано ぶどうの実. В Мф 26:29 — «в Царстве Отца Моего», у Марка — «в Царстве Божием»."
  27: "Зах 13:7. У Марка нет «в эту ночь» (есть у Мф 26:31); ἐν ἐμοί нет — つまずく без дополнения."
  28: "προάξω ὑμᾶς — «пойду впереди вас»."
  30: "πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι — «прежде нежели дважды пропоёт петух»; деталь Марка, у Матфея петух поёт один раз. σήμερον ταύτῃ τῇ νυκτί — 今日、この夜のうちに."
  31: "ἐκπερισσῶς ἐλάλει — «говорил с большей силой, настойчиво»."
  33: "ἐκθαμβεῖσθαι καὶ ἀδημονεῖν — «ужасаться и тосковать»; у Матфея 26:37 λυπεῖσθαι, поэтому здесь 恐れ, а не 悲しみ."
  34: "У Марка нет μετ᾽ ἐμοῦ («со Мною»), которое есть у Матфея 26:38."
  36: "Ἀββᾶ ὁ πατήρ — «Авва, Отче»; ἀλλ᾽ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ — буквально «не что Я хочу, но что Ты», у Матфея 26:39 иначе."
  38: "ἵνα μὴ ἔλθητε εἰς πειρασμόν — «чтобы не прийти в искушение»; у Матфея ἵνα μὴ εἰσέλθητε — «не войти»."
  40: "οὐκ ᾔδεισαν τί ἀποκριθῶσιν αὐτῷ — «не знали, что Ему ответить»; деталь Марка."
  41: "τὸ λοιπὸν… ἀπέχει — тёмное место; ἀπέχει понято как «довольно, кончено» — もう十分だ. У Матфея 26:45 иначе."
  49: "У Марка только αἱ γραφαί, без «пророков» (ср. Мф 26:56)."
  51: "σινδών — льняное полотно, обычно погребальное; эпизод есть только у Марка. ἐπὶ γυμνοῦ — «на голом теле»."
  53: "У Марка перечислены все три группы: первосвященники, старцы, книжники (у Матфея 26:57 иначе). Сноски на 大祭司 нет: слово уже встречалось в 2:26."
  54: "ἕως ἔσω εἰς τὴν αὐλήν — «вплоть до внутренней части двора»; πρὸς τὸ φῶς — «у огня/света»; у Матфея 26:58 Петр сидит снаружи."
  56: "ἴσαι αἱ μαρτυρίαι — «равные, согласные показания»; 一致しなかった."
  58: "Слова лжесвидетелей — не красным: это не речь Христа, а пересказ. χειροποίητος/ἀχειροποίητος — «рукотворный/нерукотворный», передано 手で造られた/手で造られていない."
  61: "ὁ υἱὸς τοῦ εὐλογητοῦ — «Сын Благословенного», перифраза имени Божия; ほめたたえられる方の子. У Матфея 26:63 — «Сын Божий»."
  62: "ἐγώ εἰμι — «Я есмь»; わたしこそ、そうだ. ἐκ δεξιῶν τῆς δυνάμεως — «одесную Силы», ещё одна перифраза имени Божия — 力ある方の右."
  64: "ἔνοχον θανάτου — «повинного смерти»; κατέκριναν — «осудили»."
  65: "У Марка нет «кто ударил Тебя» (есть у Мф 26:68) — только Προφήτευσον."
  68: "καὶ ἀλέκτωρ ἐφώνησεν в критической базе в скобках; Церковь читает — 〔…〕. Это первое пение петуха, второе — в 14:72 (εὐθὺς ἐκ δευτέρου)."
  70: "У Марка нет «речь твоя обличает тебя» (Мф 26:73), только καὶ γὰρ Γαλιλαῖος εἶ — «ибо ты галилеянин»."
  71: "ἀναθεματίζειν — «клясться с проклятиями», передано 呪いの言葉を口にし、誓って."
  72: "ἐπιβαλών — тёмное место: «бросившись» или «начав»; передано 泣き崩れた. Воспоминание передано косвенной цитатой, поэтому не красным."
