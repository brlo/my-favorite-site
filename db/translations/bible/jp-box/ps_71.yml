verses:
  1: "ソロモンについて。ダビデの詩[うた]。神[かみ]よ、あなたの裁[さば]きを王[おう]に、あなたの義[ぎ]を王[おう]の子[こ]に与[あた]えてください。"
  2: "王[おう]があなたの民[たみ]を義[ぎ]をもって裁[さば]き、あなたの貧[まず]しい者[もの]たちを正[ただ]しい裁[さば]きをもって裁[さば]くために。"
  3: "山[やま]々[やま]があなたの民[たみ]に平和[へいわ]を、丘[おか]が義[ぎ]を担[にな]いますように。"
  4: "王[おう]は民[たみ]の貧[まず]しい者[もの]を裁[さば]き、乏[とぼ]しい者[もの]の子[こ]らを救[すく]い、そしる者[もの]を低[ひく]くされる。"
  5: "王[おう]は太陽[たいよう]とともに、月[つき]より前[まえ]から、代[よ]々[よ]の代[よ]まで続[つづ]く。"
  6: "王[おう]は羊毛[ようもう]の上[うえ]に降[ふ]る雨[あめ]のように、地[ち]にしたたる雨[あめ]の滴[しずく]のように降[ふ]りてくる。"
  7: "王[おう]の日[ひ]に義[ぎ]が芽[め]生[ば]え、月[つき]が取[と]り去[さ]られるまで、平和[へいわ]が豊[ゆた]かに満[み]ちる。"
  8: "王[おう]は海[うみ]から海[うみ]まで、川[かわ]から地[ち]の果[は]てまで治[しはい]する。"
  9: "エチオピア人[じん]は王[おう]の前[まえ]にひれ伏[ふ]し、その敵[てき]は塵[ちり]をなめる。"
  10: "タルシシュの王[おう]たちと島[しま]々[じま]は贈[おく]り物[もの]をささげ、アラビアの王[おう]たちとシバは贈[おく]り物[もの]を携[たずさ]えて来[く]る。"
  11: "すべての王[おう]が王[おう]を拝[おが]み、すべての民[たみ]が王[おう]に仕[つか]える。"
  12: "王[おう]は貧[まず]しい者[もの]を強[つよ]い者[もの]の手[て]から、助[たす]けのない乏[とぼ]しい者[もの]を救[すく]い出[だ]したからである。"
  13: "王[おう]は貧[まず]しい者[もの]と乏[とぼ]しい者[もの]をあわれみ、乏[とぼ]しい者[もの]の魂[たましい]を救[すく]う。"
  14: "王[おう]は彼[かれ]らの魂[たましい]を高[たか]利[り]と不正[ふせい]から贖[あがな]い、彼[かれ]らの名[な]を王[おう]の前[まえ]で尊[とうと]いものとする。"
  15: "王[おう]は生[い]き、アラビアの金[きん]が王[おう]に与[あた]えられる。人[ひと]々[びと]はいつも王[おう]のために祈[いの]り、日[ひ]の暮[く]れまで王[おう]を祝福[しゅくふく]する。"
  16: "地[ち]には、山[やま]の頂[いただき]に支[ささ]えが置[お]かれる。その実[み]はレバノンよりも高[たか]くそびえ、町[まち]では地[ち]の草[くさ]のように人[ひと]が増[ふ]える。"
  17: "その名[な]が永遠[えいえん]にほめたたえられますように。その名[な]は太陽[たいよう]より前[まえ]からある。地[ち]のすべての部[ぶ]族[ぞく]が王[おう]によって祝福[しゅくふく]され、すべての民[たみ]が王[おう]を幸[さいわ]いな者[もの]と呼[よ]ぶ。"
  18: "ほむべきかな、主[しゅ]なる神[かみ]、イスラエルの神[かみ]は。ただひとりで奇[き]跡[せき]を行[おこな]われる方[かた]である。"
  19: "その栄光[えいこう]の名[な]も、永遠[えいえん]に、世[よ]々[よ]にほめたたえられますように。全[ぜん]地[ち]がその栄光[えいこう]に満[み]ちますように。アーメン、アーメン。エッサイの子[こ]ダビデの歌[うた]は、ここで終[お]わる。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Εἰς Σαλωμων — «О Соломоне» (Σαλωμων — ソロモン). В слав. и ru-базе добавлено «Псалом Давида», в греч. базе этого нет; надписание скобками не маркируется, поэтому ダビデの詩 поставлено без 〔…〕, как в Пс 1. Надписание влито в ст. 1. Стих: τὸ κρίμα σου τῷ βασιλεῖ δός — あなたの裁きを王に与えてください (κρίμα — «суд, приговор»; 裁き как по корпусу). τὴν δικαιοσύνην σου τῷ υἱῷ τοῦ βασιλέως — あなたの義を王の子に (δικαιοσύνη — 義)."
  2: "κρίνειν τὸν λαόν σου ἐν δικαιοσύνῃ — あなたの民を義をもって裁くために (инфинитив цели, продолжает ст. 1). τοὺς πτωχούς σου ἐν κρίσει — あなたの貧しい者たちを正しい裁きをもって (κρίσις — «суд»; слав. «нищым Твоим в суде»)."
  3: "ἀναλαβέτω τὰ ὄρη εἰρήνην τῷ λαῷ σου — 山々があなたの民に平和を担いますように (ἀναλαμβάνω — «принимать, поднимать»; εἰρήνη — 平和). οἱ βουνοὶ ἐν δικαιοσύνῃ — 丘が義を (эллипсис: «да принесут правду»; βουνός — «холм»; слав. «и холми правду»)."
  4: "κρινεῖ τοὺς πτωχοὺς τοῦ λαοῦ — 民の貧しい者を裁き (κρίνω — 裁く). σώσει τοὺς υἱοὺς τῶν πενήτων — 乏しい者の子らを救い (πένης — «неимущий»). ταπεινώσει συκοφάντην — そしる者を低くされる (συκοφάντης — «клеветник, притеснитель»; ταπεινόω — «смирять»)."
  5: "συμπαραμενεῖ τῷ ἡλίῳ — 太陽とともに続く (συμπαραμένω — «пребывать вместе»). πρὸ τῆς σελήνης — 月より前から (т. е. прежде, чем луна; слав. «прежде луны»). γενεὰς γενεῶν — 代々の代まで (повтор сохранён). В ru-базе иначе — «будут бояться Тебя, доколе пребудут солнце и луна», по евр.; здесь греч."
  6: "καταβήσεται ὡς ὑετὸς ἐπὶ πόκον — 羊毛の上に降る雨のように降りてくる (ὑετός — «дождь»; πόκος — «руно, овечья шерсть»; образ Гедеонова руна, Суд 6:37). ὡσεὶ σταγόνες στάζουσαι ἐπὶ τὴν γῆν — 地にしたたる雨の滴のように (σταγών — «капля»; στάζω — «капать»)."
  7: "ἀνατελεῖ ἐν ταῖς ἡμέραις αὐτοῦ δικαιοσύνη — 王の日に義が芽生え (ἀνατέλλω — «восходить, произрастать»). πλῆθος εἰρήνης ἕως οὗ ἀνταναιρεθῇ ἡ σελήνη — 月が取り去られるまで、平和が豊かに満ちる (ἀνταναιρέω — «отнимать, уничтожать»)."
  8: "κατακυριεύσει ἀπὸ θαλάσσης ἕως θαλάσσης — 海から海まで治める (κατακυριεύω — «господствовать»). ἀπὸ ποταμοῦ ἕως περάτων τῆς οἰκουμένης — 川から地の果てまで (ποταμός — «река»; οἰκουμένη — «вселенная»; в ru-базе примечание «Евфрат» — по евр., не добавлено)."
  9: "ἐνώπιον αὐτοῦ προπεσοῦνται Αἰθίοπες — エチオピア人は王の前にひれ伏し (προπίπτω — «падать ниц»; Αἰθίοπες — エチオピア人; в ru-базе «жители пустынь» — по евр., здесь греч.). οἱ ἐχθροὶ αὐτοῦ χοῦν λείξουσιν — その敵は塵をなめる (χοῦς — «прах, пыль»; λείχω — «лизать»; ср. Ис 49:23)."
  10: "βασιλεῖς Θαρσις καὶ αἱ νῆσοι — タルシシュの王たちと島々 (Θαρσις — タルシシュ; νῆσος — «остров»). δῶρα προσοίσουσιν — 贈り物をささげ (προσφέρω — «приносить»). βασιλεῖς Ἀράβων καὶ Σαβα — アラビアの王たちとシバ (Ἄραβες — アラビア人; Σαβα — シバ, ср. 3 Цар 10:1)."
  11: "προσκυνήσουσιν αὐτῷ πάντες οἱ βασιλεῖς — すべての王が王を拝み (προσκυνέω — «падать ниц»). πάντα τὰ ἔθνη δουλεύσουσιν αὐτῷ — すべての民が王に仕える (δουλεύω — «служить»)."
  12: "ἐρρύσατο πτωχὸν ἐκ χειρὸς δυνάστου — 貧しい者を強い者の手から救い出した (ῥύομαι — «избавлять»; δυνάστης — «сильный, властитель»). πένητα, ᾧ οὐχ ὑπῆρχεν βοηθός — 助けのない乏しい者を (βοηθός — «помощник»; в ru-базе добавлено «вопиющего» — по евр., не добавлено)."
  13: "φείσεται πτωχοῦ καὶ πένητος — 貧しい者と乏しい者をあわれみ (φείδομαι — «щадить»). ψυχὰς πενήτων σώσει — 乏しい者の魂を救う (ψυχή — 魂)."
  14: "ἐκ τόκου καὶ ἐξ ἀδικίας λυτρώσεται τὰς ψυχὰς αὐτῶν — 彼らの魂を高利と不正から贖い (τόκος — «рост, лихва»; ἀδικία — «неправда»; в ru-базе «от коварства и насилия» — по евр.). ἔντιμον τὸ ὄνομα αὐτῶν ἐνώπιον αὐτοῦ — 彼らの名を王の前で尊いものとする (ἔντιμος — «драгоценный, почтенный»; αὐτοῦ отнесено к царю, как в ru-базе «пред очами его»; в ru-базе «кровь их» — по евр., здесь ὄνομα — 名)."
  15: "ζήσεται — 王は生き (ζάω). δοθήσεται αὐτῷ ἐκ τοῦ χρυσίου τῆς Ἀραβίας — アラビアの金が王に与えられる (χρυσίον — 金). προσεύξονται περὶ αὐτοῦ διὰ παντός — いつも王のために祈り (προσεύχομαι — «молиться»). ὅλην τὴν ἡμέραν εὐλογήσουσιν αὐτόν — 日の暮れまで王を祝福する."
  16: "ἔσται στήριγμα ἐν τῇ γῇ ἐπ᾽ ἄκρων τῶν ὀρέων — 地には、山の頂に支えが置かれる (στήριγμα — «опора, утверждение»; ἄκρον — «вершина»; слав. «утверждение на земли на версех гор»). ὑπεραρθήσεται ὑπὲρ τὸν Λίβανον ὁ καρπὸς αὐτοῦ — その実はレバノンよりも高くそびえる (ὑπεραίρω — «поднимать выше»; Λίβανος — レバノン). ἐξανθήσουσιν ἐκ πόλεως ὡσεὶ χόρτος τῆς γῆς — 町では地の草のように人が増える (ἐξανθέω — «расцветать»; χόρτος — «трава»; в ru-базе «в городах размножатся люди» — тот же смысл)."
  17: "ἔστω τὸ ὄνομα αὐτοῦ εὐλογημένον εἰς τοὺς αἰῶνας — その名が永遠にほめたたえられますように. πρὸ τοῦ ἡλίου διαμενεῖ τὸ ὄνομα αὐτοῦ — その名は太陽より前からある (διαμένω — «пребывать»; слав. «прежде солнца пребывает имя Его»; в ru-базе иначе — по евр.). εὐλογηθήσονται ἐν αὐτῷ πᾶσαι αἱ φυλαὶ τῆς γῆς — 地のすべての部族が王によって祝福され (φυλή — «племя»). πάντα τὰ ἔθνη μακαριοῦσιν αὐτόν — すべての民が王を幸いな者と呼ぶ (μακαρίζω — «ублажать»)."
  18: "Εὐλογητὸς κύριος ὁ θεὸς ὁ θεὸς Ισραηλ — ほむべきかな、主なる神、イスラエルの神は (двойное θεός сохранено). ὁ ποιῶν θαυμάσια μόνος — ただひとりで奇跡を行われる方 (θαυμάσιον — «дивное»; μόνος — «един»; слав. «творяй чудеса един»)."
  19: "εὐλογητὸν τὸ ὄνομα τῆς δόξης αὐτοῦ — その栄光の名もほめたたえられますように (род. «имя славы Его»). εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — 永遠に、世々に (двойная формула сохранена). πληρωθήσεται τῆς δόξης αὐτοῦ πᾶσα ἡ γῆ — 全地がその栄光に満ちる (πληρόω — «наполнять»). γένοιτο γένοιτο — アーメン、アーメン (букв. «да будет, да будет»; слав. «буди, буди», у jp-joc 「アミン」; в корпусе принято アーメン). Прежний ст. 20: Ἐξέλιπον οἱ ὕμνοι Δαυιδ τοῦ υἱοῦ Ιεσσαι — «скончались песни Давида, сына Иессеева» (ἐκλείπω — «оканчиваться»; ὕμνος — «песнь, гимн»). Заключительная приписка к собранию псалмов; 歌, чтобы не смешивать с 賛美 (αἶνος). Ιεσσαι — エッサイ."
