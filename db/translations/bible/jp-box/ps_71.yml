# Псалом 71: 19 стихов (было 21; надписание у нас — ст. 0).
# Надписание влито в ст. 1; приписка «エッサイの子ダビデの歌は、ここで終わる» (прежний ст. 20) присоединена к ст. 19 — в слав. она не нумеруется.
# Текст сохранён: стихи соединены/разделены по границам csl; notes перенумерованы.
# Ниже — прежняя шапка: номера в ней — прежние (по LXX/gr), notes — по прежним номерам.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 71: молитва о царе — суд и правда (1–4), мир и власть до концов земли (5–8),
# дань царей и спасение нищих (9–15), обилие хлеба и вечное имя (16–17),
# славословие и конец собрания Давида (18–20).
# Это псалом о Соломоне и о Царе-Христе; красного нет (ср. решение по Пс 2).
# Кавычек в главе нет: прямой речи нет, заключительное «アーメン、アーメン» — не речь.
