# Надписание: в греч. только Εἰς Σαλωμων; «ダビデの詩» добавлено по слав. и ru-базе,
# надписание скобками не маркируется (как в Пс 1).
# Сносок ⟨…⟩ нет: 羊毛, 琴, 塵, 贖う уже в корпусе. jp-ni не использовался.

