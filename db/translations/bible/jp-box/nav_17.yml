# jp-box, Иисус Навин, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: удел Манассии и дочери Салпаада (1–6), граница и города (7–13),
# просьба сынов Иосифа и ответ Иисуса (14–18).
# Речь людей — 「…」 (4, 14, 15, 16, 17–18); красного нет.
# 〔…〕 нет: добавления слав./ru (17:3 родословие Салпаада, 17:5 «десять
# участков», 17:13 дань, 17:15 «в земле ферезея и рафаима») в гр. отсутствуют
# и не внесены.
# Сносок ⟨…⟩ нет: 嗣業, 部族, 氏族, くじ уже в корпусе.
# Отличия LXX: 17:11 слав. перечисляет больше городов (Ивлеам, Ен-Дор, Фаанах,
# Танах), в гр. их нет; 17:7 в гр. «пред лицом сынов Анаф» (слав. «пред лицем
# сихема»); 17:9 τερέμινθος — «теревинф», тёмное место. Имена дочерей даны по
# Числ 26–27 (マフラ, ノア, ホグラ, ミルカ, ティルツァ); в LXX они иные
# (Μααλα, Νουα, Εγλα, Μελχα, Θερσα).
# jp-ni не использовался.

