verses:
  1: "マナセの子[こ]らの部族[ぶぞく]の境界[きょうかい]は次[つぎ]のとおりであった。マナセはヨセフの長子[ちょうし]であったからである。マナセの長子マキル、すなわちギレアデの父[ちち]には、ギレアデとバシャンが与[あた]えられた。彼[かれ]は戦[いくさ]に強[つよ]い人[ひと]であったからである。"
  2: "またマナセの残[のこ]りの子[こ]らにも、その氏族[しぞく]ごとに地[ち]が与[あた]えられた。すなわちイエゼルの子ら、ケレズの子ら、イエジエルの子ら、シェケムの子ら、スマリムの子ら、オフェルの子らである。これらはその氏族ごとの男[おとこ]たちであった。"
  3: "オフェルの子[こ]サルパアデには、息子[むすこ]がなく、娘[むすめ]たちだけがいた。その娘たちの名[な]は次[つぎ]のとおりである。マフラ、ノア、ホグラ、ミルカ、ティルツァ。"
  4: "彼女[かのじょ]らは祭司[さいし]エレアザルとヨシュア、および長[かしら]たちの前[まえ]に立[た]って言[い]った。「神[かみ]はモーセの手[て]によって、私たちの兄弟[きょうだい]の間[あいだ]に嗣業[しぎょう]を与[あた]えるよう命[めい]じられました。」そこで彼女らには、主[しゅ]の命令[めいれい]によって、父[ちち]の兄弟の間にくじが与えられた。"
  5: "マナセのくじは、アナッサから、ギレアデから出[で]たラベクの平野[へいや]に落[お]ちた。それはヨルダン川[がわ]の向[む]こう側[がわ]である。"
  6: "マナセの子[こ]らの娘[むすめ]たちが、その兄弟[きょうだい]たちの間[あいだ]でくじによって嗣業[しぎょう]を受[う]け継[つ]いだからである。ギレアデの地[ち]は、マナセの残[のこ]りの子らに与[あた]えられた。"
  7: "マナセの子[こ]らの境界[きょうかい]はデラナトであった。それはアナトの子らの前[まえ]にある。境界はヤミンとヤシフへ進[すす]み、タフトトの泉[いずみ]に至[いた]る。"
  8: "タフェトの地[ち]はマナセのものとなり、マナセの境界[きょうかい]にあるタフェトは、エフライムの子[こ]らのものとなった。"
  9: "境界[きょうかい]はカラナの谷[たに]へ下[くだ]り、南[みなみ]ではヤリエルの谷に沿[そ]って下る。テレビンの木[き]はエフライムのものとなり、マナセの町[まち]の間[あいだ]にある。マナセの境界は北[きた]へ、谷川[たにがわ]に及[およ]び、その果[は]ては海[うみ]である。"
  10: "南[みなみ]はエフライムのもの、北[きた]はマナセのものであり、海[うみ]が彼[かれ]らの境界[きょうかい]であった。彼らは北でアシェルに、東[ひがし]でイッサカルに接[せっ]した。"
  11: "イッサカルとアシェルの中[なか]で、マナセにはベト・シャンとその村々[むらむら]、ドルに住[す]む者[もの]たちとその村々、メギドに住む者たちとその村々、およびナフェトの三分[さんぶん]の一[いち]とその村々が属[ぞく]した。"
  12: "しかしマナセの子[こ]らは、これらの町[まち]を滅[ほろ]ぼし尽[つ]くすことができなかった。カナン人[じん]はこの地[ち]に住[す]み続[つづ]けた。"
  13: "イスラエルの子[こ]らが強[つよ]くなると、彼[かれ]らはカナン人[じん]を従[したが]わせたが、滅[ほろ]ぼし尽[つ]くすことはしなかった。"
  14: "ヨセフの子[こ]らはヨシュアに答[こた]えて言[い]った。「なぜあなたは、私たちに一[ひと]つのくじ、一つの測[はか]り綱[づな]だけを嗣業[しぎょう]として与[あた]えたのですか。私[わたし]は多[おお]くの民[たみ]です。神[かみ]が私を祝福[しゅくふく]してくださったからです。」"
  15: "ヨシュアは彼[かれ]らに言[い]った。「もしあなたが多[おお]くの民[たみ]であるなら、森[もり]に上[のぼ]って、自分[じぶん]のために切[き]り開[ひら]きなさい。エフライムの山地[さんち]があなたを狭[せま]くしているのなら。」"
  16: "ヨセフの子[こ]らは言[い]った。「エフライムの山地[さんち]は私たちに足[た]りません。カナン人[じん]には選[え]り抜[ぬ]かれた馬[うま]と鉄[てつ]があり、そのカナン人はベト・シャンとその村々[むらむら]に、またイズレエルの谷[たに]に住[す]んでいます。」"
  17: "ヨシュアはヨセフの家[いえ]、すなわちエフライムとマナセに言[い]った。「あなたは多[おお]い民[たみ]であり、大[おお]きな力[ちから]を持っている。あなたのくじは一[ひと]つにとどまらない。"
  18: "山[やま]はあなたのものとなる。そこは森[もり]だから、あなたはそれを切[き]り開[ひら]き、自分のものとする。あなたがカナン人[じん]を滅[ほろ]ぼし尽[つ]くすとき、たとえ彼[かれ]に選[え]り抜[ぬ]かれた馬[うま]があっても、あなたは彼に勝[まさ]るからである。」"

notes:
  1: "ὅτι οὗτος πρωτότοκος τῷ Ιωσηφ — «ибо он первенец Иосифу». Μαχιρ — Махир (マキル, как в Числ 27). Γαλααδίτις и Βασανῖτις — Галаад и Васан (ギレアデ, バシャン). В квадратных скобках гр. стоит пояснение «ибо он был муж воинственный»."
  2: "κατὰ δήμους — по родам. Имена: Ιεζερ, Κελεζ, Ιεζιηλ, Συχεμ, Συμαριμ, Οφερ; в слав. и ru иные формы (Ахиезер, Хелек, Асриил, Шехем, Хефер, Шемида)."
  3: "Σαλπααδ — Салпаад (サルパアデ, как в Числ 26–27). Гр. называет только отца Офера; слав. добавляет родословие «сына Галаадова, сына Махирова, сына Манассиина» — в гр. его нет. Дочери даны по Числ 26–27 (マフラ, ノア, ホグラ, ミルカ, ティルツァ); в LXX здесь иные формы: Μααλα, Νουα, Εγλα, Μελχα, Θερσα."
  4: "ἔστησαν ἐναντίον — «стали пред». Речь дочерей — 「…」. διὰ προστάγματος κυρίου — «по повелению Господню». κλῆρος — くじ."
  5: "σχοινισμός — «верёвочная мера», участок (слав. «жребий»). ἀπὸ Ανασσα — «от Анассы», вероятно начало отсчёта. πεδίον Λαβεκ — поле Лавек. Слова «десять» (в ru) в гр. нет."
  6: "ὅτι — «ибо», объяснение предыдущего. θυγατέρες … ἐκληρονόμησαν κλῆρον — дочери получили жребий. καταλελειμμένοι — «оставшиеся»."
  7: "Δηλαναθ — Деланаф (слав. «данаф»). κατὰ πρόσωπον υἱῶν Αναθ — «пред лицом сынов Анаф» (слав. «пред лицем сихема», ru «против Сихема»). Ιαμιν, Ιασσιβ — Ямин, Ясиф. Θαφθωθ — Тафтоф."
  8: "Θαφεθ — Фафеф (ru «Таппуах»). Смысл: земля принадлежит Манассии, а город на границе — Ефрему."
  9: "φάραγξ Καρανα — долина Карана; φάραγξ Ιαριηλ — долина Яриил. τερέμινθος — «теревинф» (теревинт); стоит на месте «города/предела» (слав. «теревинф ефрему»), чтение тёмное, переведено буквально. χειμάρρους — 谷川."
  10: "ἀπὸ λιβός — с юга; ἐπὶ βορρᾶν — к северу. συνάψουσιν — «примкнут» (συνάπτω)."
  11: "Βαιθσαν — Беф-Сан (ベト・シャン). Δωρ — Дор. Μαγεδδω — Мегиддо (メギド). Ναφετα — Нафеф. τὸ τρίτον — третья часть. Слав. перечисляет здесь больше городов (Ивлеам, Ен-Дор, Фаанах, Танах), в гр. их нет."
  12: "ἐξολεθρεῦσαι — истребить (ἐξολεθρεύω). ἤρχετο … κατοικεῖν — «начал жить»."
  13: "κατίσχυσαν — «укрепились». ὑπήκοοι — подвластные (слав. «послушных»). ἐξολεθρεῦσαι δὲ αὐτοὺς οὐκ ἐξωλέθρευσαν — «истребить же их не истребили» (тавтология греч.)."
  14: "ἀντεῖπαν — «возразили» (ἀντιλέγω). κλῆρος εἷς καὶ σχοίνισμα ἕν — один жребий и одна мера. ὁ θεός — здесь «Бог», не «Господь»."
  15: "δρυμός — лес, чаща. ἐκκάθαρον σεαυτῷ — «расчисти себе». στενοχωρεῖ — «теснит» (στενοχωρέω). Слав. добавляет «в земле ферезея и рафаима», в гр. нет."
  16: "ἵππος ἐπίλεκτος — отборный конь (подразумеваются колесницы); σίδηρος — железо. κοιλὰς Ιεζραελ — долина Изреель (イズレエル). Βαιθσαν — ベト・シャン."
  17: "εἰ λαὸς πολὺς εἶ … οὐκ ἔσται σοι κλῆρος εἷς — «если народ мног ты… не будет тебе жребий один»."
  18: "ὁ γὰρ δρυμὸς ἔσται σοι — «ибо лес будет тебе». ἐκκαθαριεῖς — расчистишь. ὑπερισχύεις — «преодолеешь, будешь сильнее» (ὑπερισχύω)."
