verses:
  1: "「エドムから来[く]るこの者[もの]はだれか。ボソルから来る者、衣[ころも]は赤[あか]く、装[よそお]いは美[うつく]しく、力[ちから]強[づよ]く歩[あゆ]む者——それはだれか。」「わたしは義[ぎ]を語[かた]り、救[すく]いの裁[さば]きを告[つ]げる者である。」"
  2: "「なぜ、あなたの衣[ころも]は赤[あか]く、あなたの衣服[いふく]はぶどう搾[しぼ]り場[ば]を踏[ふ]んだ者[もの]のようであるのか。」"
  3: "「わたしは踏[ふ]みつけられたぶどう搾[しぼ]り場[ば]に満[み]ちている。諸国[しょこく]のうちに、わたしとともにいる者[もの]は一人[ひとり]もいない。わたしは憤[いきどお]りをもって彼[かれ]らを踏みつけ、彼らを土[つち]のように砕[くだ]き、彼らの血[ち]を地[ち]に流[なが]し下[くだ]した。そして、わたしの衣[ころも]をことごとく濡[ぬ]らした。"
  4: "報[むく]いの日[ひ]が彼[かれ]らの上[うえ]に来[き]たからである。贖[あがな]いの年[とし]が近[ちか]づいている。"
  5: "わたしは見[み]たが、助[たす]ける者[もの]はなく、顧[かえり]みたが、支[ささ]える者もいなかった。そこで、わたしの腕[うで]が彼[かれ]らを救[すく]い、わたしの憤[いきどお]りがわたしを支[ささ]えた。"
  6: "わたしは怒[いか]りをもって彼[かれ]らを踏みつけ、彼らの血[ち]を地[ち]に流[なが]し下[くだ]した。」"
  7: "「わたしは主[しゅ]のあわれみを、主がわたしたちに報[むく]いてくださるすべてのことにおける主の徳[とく]を、思[おも]い起[おこ]した。主はイスラエルの家[いえ]にとって善[よ]い裁[さば]き手[て]であり、そのあわれみに従[したが]い、その義[ぎ]の豊[ゆた]かさに従って、わたしたちに臨[のぞ]まれる。"
  8: "主は『彼[かれ]らはわたしの民[たみ]、裏切[うらぎ]らない子[こ]らではないか』と言[い]われた。そして、主は彼らにとって救[すく]いとなった。"
  9: "すべての苦[くる]しみから彼[かれ]らを救[すく]ったのは、執[と]り成[な]し手[て]でも天[てん]使[し]でもなく、主[しゅ]ご自身[じしん]であった。主は彼らを愛[あい]し、彼らをあわれまれたので、彼らを贖[あがな]い、彼らを抱[だ]き上[あ]げ、永遠[えいえん]の日[ひ]々[び]のすべてにおいて彼らを高[たか]くされた。"
  10: "しかし、彼[かれ]らは不従順[ふじゅうじゅん]になり、その聖[せい]なる霊[れい]を怒[いか]らせた。そこで、主は彼らにとって敵[てき]となり、ご自身[じしん]が彼らと戦[たたか]われた。"
  11: "わたしは永遠[えいえん]の日[ひ]々[び]を思[おも]い起[おこ]した。羊[ひつじ]の牧者[ぼくしゃ]を地[ち]から上[あ]げた方[かた]の日々を。彼[かれ]らの中[なか]に聖[せい]なる霊[れい]を置[お]いた方は、どこにおられるのか。"
  12: "その栄光[えいこう]の腕[うで]は、モーセを右[みぎ]の手[て]によって導[みちび]き、ご自身[じしん]の前[まえ]で水[みず]を分[わ]け、ご自身に永遠[えいえん]の名[な]を造[つく]られた。"
  13: "主は彼[かれ]らを深[ふか]い淵[ふち]を通[とお]って導[みちび]かれた。馬[うま]が荒[あ]れ野[の]を行[ゆ]くように。そして、彼らは疲[つか]れなかった。"
  14: "家畜[かちく]が平[ひら]らな野[の]を行くように、主[しゅ]からの霊[れい]が下[くだ]って彼[かれ]らを導[みちび]いた。このように、あなたはご自身の民[たみ]を導き、ご自身に栄光[えいこう]の名[な]を造[つく]られた。"
  15: "主[しゅ]よ、天[てん]から向[む]き直[なお]り、あなたの聖[せい]なる家[いえ]、栄光の家から見[み]てください。あなたの熱心[ねっしん]と力[ちから]はどこにあるのですか。あなたのあわれみと慈[いつく]しみの豊[ゆた]かさはどこにあるのですか。あなたはわたしたちを忍[しの]んでこられたからです。"
  16: "あなたはわたしたちの父[ちち]である。アブラハムがわたしたちを知[し]らず、イスラエルがわたしたちを認[みと]めなくても、主[しゅ]よ、あなたはわたしたちの父である。わたしたちを救[すく]い出[だ]してください。あなたの名[な]は初[はじ]めからわたしたちの上[うえ]にあるのです。"
  17: "主[しゅ]よ、なぜあなたはわたしたちをあなたの道[みち]から迷[まよ]わせ、あなたを恐[おそ]れないようにわたしたちの心[こころ]を固[かた]くされたのですか。あなたのしもべたちのために、あなたの嗣業[しぎょう]である部族[ぶぞく]のために、向[む]きを変[か]えてください。"
  18: "あなたの聖[せい]なる山[やま]を、わたしたちがわずかでも嗣業[しぎょう]として受[う]け継[つ]げるために。わたしたちの敵[てき]は、あなたの聖所[せいしょ]を踏[ふ]みにじってしまった。"
  19: "わたしたちは、あなたがわたしたちを治[おさ]めず、あなたの名[な]がわたしたちの上[うえ]に呼[よ]ばれもしなかった初[はじ]めの時[とき]のようになった。あなたが天[てん]を開[ひら]かれるなら、山[やま]々[やま]はあなたの前[まえ]に震[ふる]え、溶[と]け去[さ]るであろう。」"

notes:
  1: "Τίς οὗτος ὁ παραγινόμενος ἐξ Εδωμ — «кто сей, приходящий от Едома» (παραγίνομαι — приходить); ἐρύθημα ἱματίων ἐκ Βοσορ — «краснота одежд из Восора» (ἐρύθημα — краснота; Βοσορ — Боцра; в тексте ボソル, форма корпуса, ср. 1 Пар 6:78). οὕτως ὡραῖος ἐν στολῇ — «столь прекрасный в облачении» (στολή — облачение); βίᾳ μετὰ ἰσχύος — «с силою, с крепостию» (βία — сила, напор; ἰσχύς — крепость). ἐγὼ διαλέγομαι δικαιοσύνην καὶ κρίσιν σωτηρίου — «Я возвещаю правду и суд спасения» (διαλέγομαι — беседовать, возвещать). Диалог без авторских помет: вопрос (стражи/пророк) и ответ Господа — две реплики в 「…」. Ср. Откр 19:13.15 — одежда, обагрённая кровью, и точило."
  2: "διὰ τί σου ἐρυθρὰ τὰ ἱμάτια — «почему у Тебя красны одежды»; τὰ ἐνδύματά σου ὡς ἀπὸ πατητοῦ ληνοῦ — «одежды Твои, как от топтавшего точило» (πατητός — топтавший; ληνός — точило, в тексте ぶどう搾り場, как в Откр 19:15)."
  3: "πλήρης καταπεπατημένης — букв. «полон истоптанного [точила]» (καταπατέω — топтать); так LXX передаёт евр. «точило топтал Я один». τῶν ἐθνῶν οὐκ ἔστιν ἀνὴρ μετ᾽ ἐμοῦ — «из народов нет мужа со Мною». κατεπάτησα αὐτοὺς ἐν θυμῷ — «попрал их в ярости» (θυμός — ярость, в тексте 憤り); κατέθλασα αὐτοὺς ὡς γῆν — «сокрушил их, как землю» (καταθλάω — раздроблять; слав. «яко персть»); κατήγαγον τὸ αἷμα αὐτῶν εἰς γῆν — «низвёл кровь их в землю» (κατάγω — сводить вниз). Слав. добавляет в конце «и вся ризы моя омочих» — в LXX этих слов нет, внесено в основной текст без 〔…〕."
  4: "ἡμέρα γὰρ ἀνταποδόσεως ἐπῆλθεν αὐτοῖς — «ибо день воздаяния настал для них» (ἐπέρχομαι — приходить на; ἀνταπόδοσις — воздаяние); ἐνιαυτὸς λυτρώσεως πάρεστιν — «год искупления настоит» (λύτρωσις — искупление, выкуп). Син. «день мщения — в сердце Моем» — по МТ."
  5: "ἐπέβλεψα — «Я посмотрел» (ἐπιβλέπω); οὐδεὶς βοηθός — «нет помощника» (βοηθός); προσενόησα — «Я вразумился, обратил внимание» (προνοέω); οὐθεὶς ἀντελαμβάνετο — «никто не поддержал» (ἀντιλαμβάνω). ἐρρύσατο αὐτοὺς ὁ βραχίων μου — «избавила их мышца Моя» (ῥύομαι; в гр. и слав. «их», у Син. «помогла Мне» — МТ); ὁ θυμός μου ἐπέστη — «ярость Моя настала» (ἐφίστημι — наступать); в тексте 支えた по смыслу, ср. Син. «ярость Моя поддержала Меня»."
  6: "κατεπάτησα αὐτοὺς τῇ ὀργῇ μου — «попрал их гневом Моим» (ὀργή — гнев, в тексте 怒り); κατήγαγον τὸ αἷμα αὐτῶν εἰς γῆν — «низвёл кровь их в землю». Стих почти дословно повторяет конец 63:3 (в LXX двойка) — повтор сохранён, не сглажен."
  7: "Τὸν ἔλεον κυρίου ἐμνήσθην — «милость Господню я вспомнил» (ἔλεος — милость, в тексте あわれみ); τὰς ἀρετὰς κυρίου — «добродетели Господни» (ἀρετή — доблесть, совершенство; в тексте 徳); ἐν πᾶσιν, οἷς ὁ κύριος ἡμῖν ἀνταποδίδωσιν — «во всём, что Господь нам воздаёт». κύριος κριτὴς ἀγαθὸς τῷ οἴκῳ Ισραηλ — «Господь — судия благой дому Израилеву» (κριτής — судия); ἐπάγει ἡμῖν κατὰ τὸ ἔλεος αὐτοῦ — «наводит нам по милости Своей» (ἐπάγω — наводить; глагол может звучать грозно, но здесь — по милости). Здесь начинается молитва-плач (63:7–64:11): одна цитата, закрывается в конце 63:19 и открывается снова в 64:1."
  8: "καὶ εἶπεν — «и сказал»; Οὐχ ὁ λαός μου τέκνα οὐ μὴ ἀθετήσωσιν — «не народ ли Мой, дети, не отвергнутся» (ἀθετέω — отвергать, быть неверным); καὶ ἐγένετο αὐτοῖς εἰς σωτηρίαν — «и стал им во спасение». Слова Господа внутри молитвы — 『…』. Слав. относит к своему 63:8 ещё «и всякия скорби их» — это начало гр. 63:9 (ἐκ πάσης θλίψεως), деление иное (см. notes 9)."
  9: "ἐκ πάσης θλίψεως — «от всякой скорби» (θλῖψις — скорбь, беда): в гр. стоит в начале стиха как продолжение фразы 63:8; в тексте соединено с ἔσωσεν («спас их»), чтобы не начинать стих обрывком; слав. относит эти слова к концу своего 63:8. οὐ πρέσβυς οὐδὲ ἄγγελος — «не посланник и не ангел» (πρέσβυς — старейшина, посол; слав. «ходатай»); ἀλλ᾽ αὐτὸς κύριος ἔσωσεν αὐτούς — «но Сам Господь спас их». διὰ τὸ ἀγαπᾶν αὐτοὺς καὶ φείδεσθαι αὐτῶν — «за то, что любит их и щадит их» (φείδομαι — щадить); αὐτὸς ἐλυτρώσατο — «Сам искупил» (λυτρόω); ἀνέλαβεν — «принял, поднял» (ἀναλαμβάνω); ὕψωσεν — «возвысил» (ὑψόω); πάσας τὰς ἡμέρας τοῦ αἰῶνος — «во все дни века»."
  10: "ἠπείθησαν — «не покорились» (ἀπειθέω); παρώξυναν τὸ πνεῦμα τὸ ἅγιον αὐτοῦ — «раздражили Духа Святого Его» (παροξύνω — раздражать, ожесточать); ἐστράφη αὐτοῖς εἰς ἔχθραν — «обратился им в вражду» (στρέφω; ἔχθρα — вражда); ἐπολέμησεν αὐτούς — «воевал против них» (πολεμέω)."
  11: "ἐμνήσθη ἡμερῶν αἰωνίων — «вспомнил дни вечные»; в гр. 3 л. ед. ч., у слав. «помяну» — 1 л. (ср. МТ «я вспомнил»), принято слав. ὁ ἀναβιβάσας ἐκ τῆς γῆς τὸν ποιμένα τῶν προβάτων — «возведший от земли пастыря овец» (ἀναβιβάζω — поднимать, возводить). ποῦ ἐστιν ὁ θεὶς ἐν αὐτοῖς τὸ πνεῦμα τὸ ἅγιον — «где полагающий в них Духа Святого» (τίθημι — полагать)."
  12: "ὁ ἀγαγὼν τῇ δεξιᾷ Μωυσῆν — «ведший десницею Моисея» (ἄγω — вести); ὁ βραχίων τῆς δόξης αὐτοῦ — «мышца славы Его»; κατίσχυσεν ὕδωρ ἀπὸ προσώπου αὐτοῦ — «одолел воду пред лицом его» (κατισχύω — одолевать, брать верх; слав. «раздели воду», в тексте 分け); ποιῆσαι αὐτῷ ὄνομα αἰώνιον — «сотворить Себе имя вечное»."
  13: "ἤγαγεν αὐτοὺς διὰ τῆς ἀβύσσου ὡς ἵππον δι᾽ ἐρήμου — «повёл их через бездну, как коня через пустыню» (ἄβυσσος — бездна, в тексте 淵). καὶ οὐκ ἐκοπίασαν — «и не утомились» (κοπιάω)."
  14: "ὡς κτήνη διὰ πεδίου — «как скот по полю» (κτῆνος — скот; πεδίον — равнина); κατέβη πνεῦμα παρὰ κυρίου — «сошёл Дух от Господа» (καταβαίνω); ὡδήγησεν — «наставил» (ὁδηγέω). ἤγαγες τὸν λαόν σου — «Ты повёл народ Твой» (2 л. ед. ч.; смена лица в гр. сохранена); ποιῆσαι σεαυτῷ ὄνομα δόξης — «сотворить Себе имя славы»."
  15: "Ἐπίστρεψον ἐκ τοῦ οὐρανοῦ — «обратись с неба» (ἐπιστρέφω); ἰδὲ ἐκ τοῦ οἴκου τοῦ ἁγίου σου καὶ δόξης — «воззри из дома святого Твоего и славы»; ποῦ ἐστιν ὁ ζῆλός σου — «где ревность Твоя» (ζῆλος — ревность, в тексте 熱心); τὸ πλῆθος τοῦ ἐλέους σου καὶ τῶν οἰκτιρμῶν σου — «множество милости Твоей и щедрот Твоих» (οἰκτιρμός — сострадание, в тексте 慈しみ); ὅτι ἀνέσχου ἡμῶν — «ибо Ты терпел нас» (ἀνέχω — терпеть, удерживаться). Слав. добавляет обращение «Господи» (в LXX его нет) — внесено в основной текст без 〔…〕."
  16: "σὺ γὰρ ἡμῶν εἶ πατήρ — «ибо Ты Отец наш»; ὅτι Αβρααμ οὐκ ἔγνω ἡμᾶς — «ибо Авраам не познал нас» (γινώσκω); Ισραηλ οὐκ ἐπέγνω ἡμᾶς — «Израиль не признал нас» (ἐπιγινώσκω); ῥῦσαι ἡμᾶς — «избавь нас» (ῥύομαι); ἀπ᾽ ἀρχῆς τὸ ὄνομά σου ἐφ᾽ ἡμᾶς ἐστιν — «изначала имя Твоё на нас есть». Син. «Искупитель наш» — по МТ."
  17: "τί ἐπλάνησας ἡμᾶς — «что Ты совратил нас» (πλανάω — вводить в заблуждение); ἐσκλήρυνας ἡμῶν τὰς καρδίας — «ожесточил сердца наши» (σκληρύνω); τοῦ μὴ φοβεῖσθαί σε — «чтобы не бояться Тебя»; ἐπίστρεψον διὰ τοὺς δούλους σου — «обратись ради рабов Твоих»; διὰ τὰς φυλὰς τῆς κληρονομίας σου — «ради племён наследия Твоего» (φυλή — племя, колено)."
  18: "ἵνα μικρὸν κληρονομήσωμεν τοῦ ὄρους τοῦ ἁγίου σου — «чтобы нам мало наследовать гору святую Твою» (ἵνα — продолжение прошения 63:17; слав. «да (поне) мало наследим»); οἱ ὑπεναντίοι ἡμῶν — «противники наши» (ὑπεναντίος); κατεπάτησαν τὸ ἁγίασμά σου — «попрали святыню Твою» (ἁγίασμα — святыня, святилище)."
  19: "ἐγενόμεθα ὡς τὸ ἀπ᾽ ἀρχῆς — «мы стали как в начале»; ὅτε οὐκ ἦρξας ἡμῶν — «когда Ты не владел нами» (ἄρχω — властвовать); οὐδὲ ἐπεκλήθη τὸ ὄνομά σου ἐφ᾽ ἡμᾶς — «и не было призвано имя Твоё на нас» (ἐπικαλέω). ἐὰν ἀνοίξῃς τὸν οὐρανόν — «если Ты откроешь небо» (ἀνοίγω); τρόμος λήμψεται ἀπὸ σοῦ ὄρη — «трепет объимет от Тебя горы» (τρόμος — трепет); καὶ τακήσονται — «и растают» (τήκω). В слав. эти слова открывают гл. 64 (слав. 64:1) — отсюда сдвиг нумерации; кавычки закрыты в конце стиха и открыты снова в 64:1: молитва продолжается."
