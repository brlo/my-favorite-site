# jp-box, Исаия, глава 63. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 63 — 15 стихов из 19, в выгрузку не входил;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 63: 1–6 диалог «кто это идёт из Едома»: красные ризы, топтание точила,
# день воздаяния, мышца Господня; 7–19 молитва-плач: милость Господня к дому
# Израилеву, «не народ ли Мой», спасение Самого Господа, раздражённый Дух,
# воспоминание дней Моисея, «Ты Отец наш», «для чего Ты попустил нам
# совратиться», попранная святыня, «если Ты откроешь небо».
# Голоса: 1 вопрос и ответ — две реплики в 「…」; 2 вопрос — 「…」; 3–6 ответ
# Господа — 「…」 (вводной формулы нет, диалог без авторских помет);
# 7–19 молитва — одна цитата 「…」, слова Господа внутри неё — 『…』 (63:8).
# Молитва продолжается в гл. 64; цитата закрыта в конце 63:19 и открыта снова
# в 64:1 (деление по главам требует парности кавычек).
# Нумерация по gr: 19 стихов. У csl 19, но слав. 63:19 заканчивается на «ниже
# бе наречено имя твое на нас», а «аще отверзеши небо, трепет приимут от тебе
# горы, и растаются» отнесено к слав. 64:1; в гр. эти слова — конец нашего 63:19.
# Отсюда сдвиг в гл. 64: csl N = наш N−1.
# Паритет: слав. добавления внесены в основной текст без 〔…〕 — 63:3 «и вся ризы
# моя омочих» (нет в LXX), 63:15 обращение «Господи» (нет в LXX). 63:11 — по слав.
# «помяну» (1 л.), в гр. 3 л. ед. ч. 63:12 — слав. «раздели воду» при гр.
# κατίσχυσεν ὕδωρ. 〔…〕 нет.
# Сносок ⟨…⟩ нет: 衣, 搾り場, 淵, 嗣業, 慈しみ уже в корпусе.
# Имена — транслитерация греческого (LXX): エドム, ボソル (Βοσορ; у Син. «Восор»),
# モーセ, アブラハム, イスラエル.

