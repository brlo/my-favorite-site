verses:
  1: "七[なな]つの鉢[はち]を持[も]つ七人[しちにん]の天使[てんし]の一人[ひとり]が来[き]て、わたしに語[かた]りかけた。「来[き]なさい。多[おお]くの水[みず]の上[うえ]に座[すわ]っている大淫婦[だいいんぷ]⟨淫[いん]行[こう]の女[おんな]の意[い]。⟩に対[たい]する裁[さば]きを、あなたに見[み]せよう。」"
  2: "地[ち]の王[おう]たちは彼女[かのじょ]と淫行[いんこう]を重[かさ]ね、地[ち]に住[す]む者[もの]たちは彼女[かのじょ]の淫行[いんこう]の酒[さけ]に酔[よ]っていた。"
  3: "そして、天使[てんし]はわたしを霊[れい]のうちに荒[あ]れ野[の]へ連[つ]れて行[い]った。わたしは、赤[あか]い獣[けもの]に座[すわ]っている女[おんな]を見[み]た。その獣[けもの]には冒涜[ぼうとく]の名[な]が満[み]ち、七[なな]つの頭[あたま]と十[じゅう]の角[つの]があった。"
  4: "その女[おんな]は紫[むらさき]と赤[あか]の衣[ころも]をまとい、金[きん]と宝石[ほうせき]と真珠[しんじゅ]で飾[かざ]られ、手[て]には憎[にく]むべきものと自分[じぶん]の淫行[いんこう]の汚[けが]れが満[み]ちた金[きん]の杯[さかずき]を持[も]っていた。"
  5: "その額[ひたい]には、「奥義[おうぎ]、大[おお]きなバビロン、地[ち]の淫婦[いんぷ]たちと憎[にく]むべき者[もの]たちの母[はは]」という名[な]が記[しる]されていた。"
  6: "わたしは、その女[おんな]が聖[せい]なる者[もの]たちの血[ち]と、イエスの証人[しょうにん]たちの血[ち]に酔[よ]っているのを見[み]た。わたしは彼女[かのじょ]を見[み]て、大[おお]いに驚[おどろ]いた。"
  7: "天使[てんし]はわたしに言[い]った。「なぜ驚[おどろ]くのか。わたしは、この女[おんな]と、この女[おんな]を乗[の]せている獣[けもの]、七[なな]つの頭[あたま]と十[じゅう]の角[つの]を持つ獣[けもの]の奥義[おうぎ]を、あなたに告[つ]げよう。"
  8: "あなたが見[み]た獣[けもの]は、かつていたが、今[いま]はいない。そして、底知[そこし]れぬ深[ふか]みから上[のぼ]って来[き]て、滅[ほろ]びへと去[さ]って行[い]く。地[ち]に住[す]む者[もの]たちのうち、世[よ]の始[はじ]まりから命[いのち]の書[しょ]に名[な]が記[しる]されていない者[もの]たちは、獣[けもの]がかつてあり、今[いま]はいなく、やがて現[あらわ]れるのを見[み]て驚[おどろ]く。"
  9: "ここに、知恵[ちえ]のある心[こころ]がある。七[なな]つの頭[あたま]は、女[おんな]がその上[うえ]に座[すわ]っている七[なな]つの山[やま]である。また、七人[しちにん]の王[おう]である。"
  10: "その五[ご]人[にん]は倒[たお]れ、一人[ひとり]は今[いま]おり、もう一人[ひとり]はまだ来[き]ていない。来[き]たときには、しばらくの間[あいだ]とどまらなければならない。"
  11: "かつてあり、今[いま]はいない獣[けもの]は、第八[だいはち]の者[もの]であり、しかも七人[しちにん]のうちの一人[ひとり]であって、滅[ほろ]びへと去[さ]って行[い]く。"
  12: "あなたが見[み]た十[じゅう]の角[つの]は十人[じゅうにん]の王[おう]である。彼[かれ]らはまだ国[くに]を受[う]けていないが、獣[けもの]とともに一[いち]時間[じかん]だけ王[おう]としての権[けん]を受[う]ける。"
  13: "彼[かれ]らは心[こころ]を一[ひと]つにし、自分[じぶん]の力[ちから]と権[けん]を獣[けもの]に与[あた]える。"
  14: "彼[かれ]らは小羊[こひつじ]と戦[たたか]うが、小羊[こひつじ]が彼[かれ]らに勝[か]つ。小羊[こひつじ]は主[しゅ]の主[しゅ]、王[おう]の王[おう]だからである。また、彼[かれ]とともにいる者[もの]たちは、召[め]され、選[えら]ばれ、忠実[ちゅうじつ]な者[もの]たちである。」"
  15: "また、天使[てんし]はわたしに言[い]った。「あなたが見[み]た水[みず]、すなわち淫婦[いんぷ]が座[すわ]っている所[ところ]の水[みず]は、もろもろの民[たみ]と群衆[ぐんしゅう]、諸国[しょこく]と諸[しょ]言語[げんご]である。"
  16: "あなたが見[み]た十[じゅう]の角[つの]と獣[けもの]とは、この淫婦[いんぷ]を憎[にく]み、彼女[かのじょ]を荒[あ]らし、裸[はだか]にし、その肉[にく]を食[く]らい、火[ひ]で彼女[かのじょ]を焼[や]き尽[つ]くす。"
  17: "神[かみ]は彼[かれ]らの心[こころ]の内[うち]に、ご自分[じぶん]の御心[みこころ]を行[おこな]う思[おも]いを与[あた]えられた。すなわち、心[こころ]を一[ひと]つにして自分[じぶん]たちの国[くに]を獣[けもの]に与[あた]え、神[かみ]の言葉[ことば]が成就[じょうじゅ]するまで、そうするのである。"
  18: "あなたが見[み]た女[おんな]は、地[ち]の王[おう]たちの上[うえ]に王[おう]としての位[くらい]を持[も]つ大[おお]きな都[みやこ]である。」"

notes:
  1: "εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας — 七つの鉢を持つ七人の天使の一人. Δεῦρο, δείξω σοι τὸ κρίμα — 来なさい、裁きを見せよう. τῆς πόρνης τῆς μεγάλης — 大淫婦 (ср. 19:2); сноска при первом месте в корпусе. τῆς καθημένης ἐπὶ ὑδάτων πολλῶν — 多くの水の上に座っている."
  2: "μεθ᾽ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς — 地の王たちは彼女と淫行を重ね. ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς — 地に住む者たちは彼女の淫行の酒に酔っていた."
  3: "ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι — 霊のうちに荒れ野へ連れて行った (πνεῦμα без ἅγιον — 霊[れい]). θηρίον κόκκινον — 赤い獣. γέμοντα ὀνόματα βλασφημίας — 冒涜の名が満ち (в базе мн. ч.). κεφαλὰς ἑπτὰ καὶ κέρατα δέκα — 七つの頭と十の角."
  4: "περιβεβλημένη πορφυροῦν καὶ κόκκινον — 紫と赤の衣をまとい. κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις — 金と宝石と真珠で飾られ. ποτήριον χρυσοῦν … γέμον βδελυγμάτων — 憎むべきものが満ちた金の杯."
  5: "ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον — 額に名が記されていた. μυστήριον — 奥義. Βαβυλὼν ἡ μεγάλη — 大きなバビロン. ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς — 地の淫婦たちと憎むべき者たちの母. Надпись — 「」, не речь."
  6: "μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων — 聖なる者たちの血に酔っている. τῶν μαρτύρων Ἰησοῦ — イエスの証人たち. ἐθαύμασα … θαῦμα μέγα — 大いに驚いた."
  7: "Διὰ τί ἐθαύμασας; — なぜ驚くのか. τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου — 女と獣の奥義. τοῦ βαστάζοντος αὐτήν — 女を乗せている. τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα — 七つの頭と十の角を持つ."
  8: "ἦν καὶ οὐκ ἔστιν — かつていたが、今はいない. μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου — 底知れぬ深みから上って来る. εἰς ἀπώλειαν ὑπάγει — 滅びへと去って行く. οὐ γέγραπται τὸ ὄνομα … ἐπὶ τὸ βιβλίον τῆς ζωῆς — 命の書に名が記されていない. ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται — かつてあり、今はいなく、やがて現れる (в слав. «и преста», но jp-joc 後復出づる и база читают παρέσται)."
  9: "ὧδε ὁ νοῦς ὁ ἔχων σοφίαν — ここに知恵のある心がある. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη — 七つの頭は七つの山. ὅπου ἡ γυνὴ κάθηται ἐπ᾽ αὐτῶν — 女がその上に座っている. καὶ βασιλεῖς ἑπτά εἰσιν — また七人の王である; в базе относится к ст. 9 (у jp-joc — к ст. 10), поэтому стих не делится."
  10: "οἱ πέντε ἔπεσαν — その五人は倒れた. ὁ εἷς ἔστιν — 一人は今いる. ὁ ἄλλος οὔπω ἦλθεν — もう一人はまだ来ていない. ὀλίγον αὐτὸν δεῖ μεῖναι — しばらくの間とどまらなければならない."
  11: "ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν — 第八の者であり、七人のうちの一人. εἰς ἀπώλειαν ὑπάγει — 滅びへと去って行く."
  12: "τὰ δέκα κέρατα … δέκα βασιλεῖς εἰσιν — 十の角は十人の王. βασιλείαν οὔπω ἔλαβον — まだ国を受けていない. ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν — 一時間だけ王としての権を受ける."
  13: "μίαν γνώμην ἔχουσιν — 心を一つにし. τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν — 自分の力と権を獣に与える."
  14: "μετὰ τοῦ ἀρνίου πολεμήσουσιν — 小羊と戦う. κύριος κυρίων … βασιλεὺς βασιλέων — 主の主、王の王. κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί — 召され、選ばれ、忠実な者たち."
  15: "Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται — 淫婦が座っている所の水. λαοὶ καὶ ὄχλοι … καὶ ἔθνη καὶ γλῶσσαι — もろもろの民と群衆、諸国と諸言語."
  16: "τὰ δέκα κέρατα … καὶ τὸ θηρίον — 十の角と獣. μισήσουσιν τὴν πόρνην — 淫婦を憎む. ἠρημωμένην … καὶ γυμνήν — 荒らし、裸にし. τὰς σάρκας αὐτῆς φάγονται — その肉を食べ. κατακαύσουσιν ἐν πυρί — 火で焼き尽くす."
  17: "ὁ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν — 神は彼らの心に…置かれた. ποιῆσαι τὴν γνώμην αὐτοῦ — ご自分の御心を行う. δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ — 自分たちの国を獣に与える. ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ — 神の言葉が成就するまで."
  18: "ἡ γυνὴ … ἔστιν ἡ πόλις ἡ μεγάλη — 女は大きな都. ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς — 地の王たちの上に王としての位を持つ."
