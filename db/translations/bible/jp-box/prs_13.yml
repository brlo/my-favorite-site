verses:
  1: "実[じつ]に、すべての人[ひと]は生[う]まれつき空[むな]しい。神[かみ]についての無知[むち]が彼[かれ]らのうちにあり、見[み]える善[よ]いものから存在[そんざい]する方[かた]を知[し]る力[ちから]もなく、そのわざに目[め]を留[と]めても、その造[つく]り手[て]を見分[みわ]けなかった。"
  2: "かえって、火[ひ]、風[かぜ]、速[はや]い空気[くうき]、星[ほし]の巡[めぐ]り、激[はげ]しい水[みず]、天[てん]の光[ひかり]るものを、世界[せかい]を治[おさ]める神々[かみがみ]と思[おも]った。"
  3: "これらの美[うつく]しさに喜[よろこ]んで、それらを神々[かみがみ]としたのなら、これらの主人[しゅじん]がどれほど優[すぐ]れているかを知[し]るがよい。美しさの源[みなもと]である方[かた]が、これらを造[つく]られたからである。"
  4: "もし彼[かれ]らの力[ちから]と働[はたら]きに驚[おどろ]いたのなら、彼らから悟[さと]るがよい。これらを造[つく]った方[かた]がどれほど力強[ちからづよ]いかを。"
  5: "造[つく]られたものの大[おお]きさと美[うつく]しさから、その造[つく]り主[ぬし]はそれに応[おう]じて見[み]て取[と]られるからである。"
  6: "しかし、それでも彼[かれ]らへの責[せ]めは小[ちい]さい。彼らは神[かみ]を求[もと]め、見[み]いだそうとして、たまたま迷[まよ]っているのかもしれないからである。"
  7: "彼[かれ]らはそのわざの中[なか]に身[み]を置[お]き、探[さぐ]り求[もと]めて、見[み]えるものが美[うつく]しいことに納得[なっとく]している。"
  8: "しかし、彼[かれ]らもまた許[ゆる]されない。"
  9: "もし彼[かれ]らが、この世[よ]を推[お]し量[はか]ることができるほどに知[し]る力[ちから]を持[も]っていたのなら、なぜ、その主人[しゅじん]をもっと早[はや]く見[み]いださなかったのか。"
  10: "しかし、不幸[ふこう]な者[もの]たちであり、その希望[きぼう]は死[し]んだものの中[なか]にある。彼らは人間[にんげん]の手[て]のわざを神々[かみがみ]と呼[よ]んだ。金[きん]や銀[ぎん]、技[わざ]の工夫[くふう]、獣[けもの]の似姿[にすがた]、また役[やく]に立[た]たない石[いし]、いにしえの手のわざを。"
  11: "また、ある木[き]こりが、扱[あつか]いやすい木[き]を切[き]り出[だ]し、巧[たく]みにその皮[かわ]をすべて削[けず]り取[と]り、器用[きよう]に整[ととの]えて、暮[く]らしに役立[やくだ]つ器[うつわ]を作[つく]ったとする。"
  12: "その仕事[しごと]の切[き]りくずを、食物[しょくもつ]の用意[ようい]に使[つか]い尽[つ]くして、腹[はら]を満[み]たした。"
  13: "また、それらから出[で]た、何[なん]の役[やく]にも立[た]たない切[き]りくず、曲[ま]がって枝[えだ]の絡[から]まった木[き]を取[と]って、自分[じぶん]の暇[ひま]つぶしに念入[ねんい]りに彫[ほ]り、理解[りかい]の技[わざ]で形[かたち]を整[ととの]え、人間[にんげん]の像[ぞう]に似[に]せた。"
  14: "あるいは、何[なに]か取[と]るに足[た]らない獣[けもの]に似[に]せ、赤土[あかつち]と海藻[かいそう]の染料[せんりょう]を塗[ぬ]ってその色[いろ]を赤[あか]く染[そ]め、その上[うえ]の汚[よご]れを残[のこ]らず塗[ぬ]り隠[かく]した。"
  15: "そして、それにふさわしい住[す]まいを作[つく]って壁[かべ]に据[す]え、鉄[てつ]でしっかりと固定[こてい]した。"
  16: "それは、それが倒[たお]れないためである。彼[かれ]は、それが自分[じぶん]を助[たす]ける力[ちから]のないことを知[し]って、あらかじめ気[き]を配[くば]ったのである。それは像[ぞう]であり、助けを必要[ひつよう]としているからである。"
  17: "また、財産[ざいさん]や結婚[けっこん]や子[こ]どものことを祈[いの]るとき、彼[かれ]は恥[は]じることなく、魂[たましい]のないものに語[かた]りかけ、健康[けんこう]については弱[よわ]いものを呼[よ]び求[もと]め、"
  18: "命[いのち]については死[し]んだものを求[もと]め、助[たす]けについては最も経験[けいけん]のないものを請[こ]い、旅[たび]については一歩[いっぽ]も歩[ある]けないものを求め、"
  19: "商[あきな]いと仕事[しごと]と手[て]のわざの成功[せいこう]については、最も無力[むりょく]なものに、手[て]の確[たし]かさを請[こ]うのである。"

notes:
  1: "Μάταιοι μὲν γὰρ πάντες ἄνθρωποι φύσει — «ибо суетны все люди по природе»: μάταιος — «пустой, тщетный», не столько «глупый»; φύσει — «по природе», т. е. по естеству, а не по личной вине. οἷς παρῆν θεοῦ ἀγνωσία — «у которых было неведение о Боге» (ἀγνωσία — «незнание»); ἐκ τῶν ὁρωμένων ἀγαθῶν — «из видимых благ», т. е. из красоты и благости творения. τὸν ὄντα — «Сущего» (ὁ ὤν, ср. Исх 3:14), передано 存在する方; τεχνίτης — «художник, мастер» (造り手)."
  2: "ἀλλ᾿ ἤ … ἤ … — перечисление стихий и светил; πνεῦμα здесь «ветер, дыхание» (風), не «дух»: речь о стихиях мира (ср. csl «дух», Син. «ветер»). κύκλον ἄστρων — «круг звёзд», звёздный свод; πρυτάνεις κόσμου — «правители мира»: светила названы управителями космоса; θεοὺς ἐνόμισαν — «сочли богами». csl «строители миру» — иное понимание πρυτάνεις."
  3: "ὧν εἰ μὲν τῇ καλλονῇ τερπόμενοι — «если, услаждаясь их красотой»; γνώτωσαν — императив 3 л. («пусть узнают»), передан 知るがよい. ὁ δεσπότης — «владыка, хозяин» (主人), не κύριος. ὁ τοῦ κάλλους γενεσιάρχης — «родоначальник красоты» (γενεσιάρχης — редкое слово, «прародитель, источник рождения»), отсюда 美しさの源; слав. «родоначалник созда я»."
  4: "εἰ δὲ δύναμιν καὶ ἐνέργειαν ἐκπλαγέντες — «если же, поражённые силой и действием»; νοησάτωσαν ἀπ᾿ αὐτῶν — «пусть уразумеют от них»; κατασκευάσας — «устроивший, создавший» (造った方). Сравнение «насколько сильнее» (πόσῳ … δυνατώτερός ἐστιν) сохранено."
  5: "ἐκ γὰρ μεγέθους καὶ καλλονῆς κτισμάτων — «ибо из величия и красоты созданий»; ἀναλόγως — «соразмерно, по аналогии» (それに応じて); ὁ γενεσιουργός — «Создатель, производящий бытие» (造り主); θεωρεῖται — «созерцается, усматривается» (見て取られる). Мысль: творение даёт соразмерное, но не исчерпывающее знание о Творце."
  6: "ἀλλ᾿ ὅμως — «но всё же»; μέμψις ἐστὶν ὀλίγη — «порицание небольшое», т. е. они менее виновны; τάχα πλανῶνται — «может быть, заблуждаются» (τάχα — «пожалуй, возможно»); θεὸν ζητοῦντες — «ища Бога». csl «негли прельщаются» — «может быть, обольщаются»."
  7: "ἐν γὰρ τοῖς ἔργοις αὐτοῦ ἀναστρεφόμενοι — «обращаясь среди дел Его» (ἀναστρέφομαι — «вращаться, проводить время»); διερευνῶσιν — «исследуют, разыскивают»; πείθονται τῇ ὄψει — «убеждаются зрением»; ὅτι καλὰ τὰ βλεπόμενα — «что прекрасно видимое». Речь о тех, кто изучает творение, но останавливается на видимом."
  8: "πάλιν δ᾿ οὐδ᾿ αὐτοὶ συγγνωστοί — «но опять и они не заслуживают прощения» (συγγνωστός — «извинительный»); πάλιν вводит возврат к мысли ст. 6. csl «паки ниже сии прощения достойни»."
  9: "εἰ γὰρ τοσοῦτον ἴσχυσαν εἰδέναι — «если они столько смогли познать»; ἵνα δύνωνται στοχάσασθαι τὸν αἰῶνα — «чтобы быть в состоянии постичь век/мир» (στοχάζομαι — «метить, догадываться»; αἰών здесь — «мир, век»); τὸν τούτων δεσπότην — «Владыку этого» (主人); πῶς τάχιον οὐχ εὗρον — «как же не нашли скорее». csl «како скорее не обретоша»."
  10: "Ταλαίπωροι — «жалкие, несчастные» (рус. «окаянные»); ἐν νεκροῖς αἱ ἐλπίδες αὐτῶν — букв. «в мёртвом/среди мёртвых их надежды», т. е. надежда на бездушные предметы; возможно и «на мертвецов». ἔργα χειρῶν ἀνθρώπων — «дела рук человеческих»; τέχνης ἐμμελέτημα — «упражнение искусства», искусная работа. ἀπεικάσματα ζῴων — «изображения животных»; λίθον ἄχρηστον — «камень негодный»; χειρὸς ἔργον ἀρχαίας — «дело древней руки»."
  11: "ὑλοτόμος τέκτων — «плотник-дровосек» (ὑλοτόμος — «рубящий лес»); εὐκίνητον φυτὸν — «дерево, удобное для обработки» (εὐκίνητος букв. «легко движимый»), отсюда 扱いやすい木; ἐκπρίσας — «выпилив, срезав»; περιέξυσεν εὐμαθῶς — «обтесал сноровисто»; εἰς ὑπηρεσίαν ζωῆς — «для потребностей жизни»."
  12: "τὰ ἀποβλήματα τῆς ἐργασίας — «отбросы работы, обрезки»; εἰς ἑτοιμασίαν τροφῆς ἀναλώσας — «употребив на приготовление пищи»; ἐνεπλήσθη — «насытился» (букв. «наполнился»). csl «останки же дела на уготование брашна изнурив насытися»."
  13: "τὸ ἐξ αὐτῶν ἀπόβλημα εἰς οὐθὲν εὔχρηστον — «остаток от них, ни на что не годный»; ξύλον σκολιὸν καὶ ὄζοις συμπεφυκός — «дерево кривое и сучьями сросшееся»; ἔγλυψεν ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ — «вырезал с тщанием своего досуга» (ἀργία — «праздность, досуг»); ἐμπειρίᾳ συνέσεως — «опытом понимания»; ἀπείκασεν εἰκόνι ἀνθρώπου — «уподобил образу человека»."
  14: "καταχρίσας μίλτῳ καὶ φύκει — «намазав красной охрой и багрянкой» (μίλτος — красная охра; φῦκος — морская водоросль, дающая багряную краску); ἐρυθήνας χρόαν αὐτοῦ — «сделав цвет его красным»; πᾶσαν κηλῖδα τὴν ἐν αὐτῷ — «всякое пятно на нём» (κηλίς — «пятно, порок»); καταχρίσας — «замазав». csl «шарами различными» обобщает две краски."
  15: "οἴκημα — «жилище, вместилище» (здесь ниша или ковчежец для идола); ἐν τοίχῳ ἔθηκεν — «поставил в стене», т. е. в нише или на стене; ἀσφαλισάμενος σιδήρῳ — «укрепив железом» (гвоздями или скобами). csl «на стене постави, укрепив железом»."
  16: "ἵνα μὴ καταπέσῃ — «чтобы не упал»; προενόησεν αὐτοῦ — «заранее позаботился о нём»; ἀδυνατεῖ ἑαυτῷ βοηθῆσαι — «не может помочь сам себе»; εἰκών — «образ, изображение» (здесь уже 像, не 偶像, как в csl «идол»); χρείαν ἔχει βοηθείας — «имеет нужду в помощи». Ирония: мастер знает бессилие идола."
  17: "κτημάτων — «имущество, стяжания»; γάμων — «браков»; τέκνων — «детей»; οὐκ αἰσχύνεται τῷ ἀψύχῳ προσλαλῶν — «не стыдится говорить с бездушным»; περὶ μὲν ὑγιείας τὸ ἀσθενὲς ἐπικαλεῖται — «о здоровье призывает немощное». В csl эта клауза («и о здравии… призывает») перенесена в ст. 18, у нас — по гр. в ст. 17."
  18: "περὶ δὲ ζωῆς τὸ νεκρὸν ἀξιοῖ — «о жизни просит мёртвое»; ἐπικουρίας — «помощь, поддержка»; τὸ ἀπειρότατον — «самое неопытное, ничего не испытывавшее»; ἱκετεύει — «умоляет»; ὁδοιπορίας — «путешествие»; τὸ μηδὲ βάσει χρῆσθαι δυνάμενον — «не могущее даже шагать» (βάσις — «шаг, хождение»). В csl «о путешествии» перенесено в ст. 19."
  19: "πορισμοῦ — «приобретение, промысел» (商い); ἐργασίας — «работа, дело»; χειρῶν ἐπιτυχίας — «успех рук»; τὸ ἀδρανέστατον — «самое бессильное»; εὐδράνειαν — «устойчивость, крепость» (手の確かさ); αἰτεῖται — «выпрашивает». csl «мужества просит» передаёт εὐδράνειαν как ἀνδρείαν («мужество»); в LXX — «твёрдость рук»."
