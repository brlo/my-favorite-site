# jp-box, Премудрость Соломона, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Премудрости нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: безрассудство поклоняющихся природе (1–9): все люди по природе суетны,
# они не познали Сущего из Его творений; идолы и их мастера (10–19): жалки те,
# кто называет богами дела рук человеческих — от дерева и камня до изделий
# художника, которому молятся о здоровье, жизни и удаче.
# Прямой речи нет; вся глава — авторский текст (риторический вопрос 9 — не речь
# персонажа). Красного и синего нет.
# Нумерация по gr: 19 стихов; деление совпадает с csl-ru и ru. Слав. внутри
# 13:17–19 делит клаузы иначе: «о здравии» (гр. 13:17) csl относит к ст. 18,
# «о путешествии» (гр. 13:18) — к ст. 19; у нас — по гр.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: новых неочевидных терминов, требующих пояснения, в главе нет.
# Имена — транслитерация греческого (LXX).

