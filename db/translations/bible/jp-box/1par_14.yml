# jp-box, 1-я Паралипоменон, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: послы и строители от Хирама (1–2); жёны и сыновья в Иерусалиме (3–7);
# две победы над филистимлянами (8–16); слава Давида (17).
# Речь — 「…」: 14:10 (Давид и Господь), 14:11 (Давид), 14:14–15 (Бог).
# Красного нет.
# 〔…〕 нет: слав. добавление «царем» (14:2) внесено в текст, иночтения в notes.
# Сносок ⟨…⟩ нет: ペリシテ人, 巨人, 杉, 使者 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 14
draft: true

verses:
  1: "ティルスの王[おう]ヒラムはダビデに使者[しし]たちと杉[すぎ]の木[き]、石工[せっこう]たち、木工[もくこう]たちを送[おく]り、彼のために家[いえ]を建[た]てさせた。"
  2: "ダビデは、主[しゅ]が自分[じぶん]をイスラエルの王[おう]として備[そな]えられたこと、またご自分[じぶん]の民[たみ]イスラエルのためにその王国[おうこく]を高[たか]められたことを悟[さと]った。"
  3: "ダビデはエルサレムでさらに妻[つま]たちを迎[むか]え、さらに息子[むすこ]たちと娘[むすめ]たちが生[う]まれた。"
  4: "エルサレムで彼に生[う]まれた者[もの]たちの名[な]は次[つぎ]のとおりである。サマア、イソバアム、ナタン、ソロモン、"
  5: "イバアル、エリサエ、エリファレト、"
  6: "ナゲ、ナファグ、ヤヌエ、"
  7: "エリサマエ、バレグダエ、エリファレト。"
  8: "ペリシテ人[じん]は、ダビデが全[すべ]てのイスラエルの上[うえ]に王[おう]として油[あぶら]を注[そそ]がれたと聞[き]いて、ダビデを求[もと]めて上[のぼ]って来[き]た。ダビデはそれを聞いて、彼らを迎[むか]えに出[で]た。"
  9: "ペリシテ人[じん]は来[き]て、巨人[きょじん]たちの谷[たに]に集[あつ]まった。"
  10: "ダビデは神[かみ]に問[と]いかけて言[い]った。「ペリシテ人[じん]のところへ上[のぼ]るべきだろうか。あなたは彼らをわたしの手[て]に渡[わた]してくださるだろうか。」主[しゅ]は彼に言[い]われた。「上[のぼ]れ。わたしは彼らをあなたの手[て]に渡す。」"
  11: "彼らはバアル・ファラシンへ上[のぼ]り、ダビデはそこで彼らを討[う]った。ダビデは言[い]った。「神[かみ]は水[みず]の破[やぶ]れのように、わたしの手[て]によってわたしの敵[てき]を破[やぶ]られた。」それゆえ、その場所[ばしょ]の名[な]はファラシンの破れと呼[よ]ばれた。"
  12: "ペリシテ人[じん]はそこに自分[じぶん]たちの神々[かみがみ]を捨[す]てておいた。ダビデはそれらを火[ひ]で焼[や]くよう命[めい]じた。"
  13: "ペリシテ人[じん]は再[ふたた]び来[き]て、巨人[きょじん]たちの谷[たに]に集[あつ]まった。"
  14: "ダビデはさらに神[かみ]に問[と]いかけた。神[かみ]は彼に言[い]われた。「彼らの後[あと]を追[お]って行[い]ってはならない。彼らから離[はな]れて回[まわ]り込み、梨[なし]の木[き]のそばで彼らに迫[せま]れ。"
  15: "梨[なし]の木[き]の頂[いただき]で行軍[こうぐん]の音[おと]を聞[き]いたなら、そのとき戦[いくさ]に出[で]よ。神[かみ]があなたの前[まえ]に出[で]て、ペリシテ人[じん]の陣営[じんえい]を討[う]たれるからである。」"
  16: "ダビデは神[かみ]が命[めい]じたとおりに行[おこな]い、ガバオンからガゼルに至[いた]るまでペリシテ人[じん]の陣営[じんえい]を討[う]った。"
  17: "ダビデの名[な]はすべての国[くに]々[ぐに]に広[ひろ]がり、主[しゅ]は彼への恐[おそ]れをすべての国民[こくみん]の上[うえ]に置[お]かれた。"

notes:
  1: "Χιραμ βασιλεὺς Τύρου — Хирам, царь Тирский (ヒラム, ティルス; ср. 2 Цар 5:11). ξύλα κέδρινα — кедровые деревья (杉). οἰκοδόμοι τοίχων — строители стен, каменщики (石工); τέκτονες ξύλων — плотники (木工). τοῦ οἰκοδομῆσαι αὐτῷ οἶκον — чтобы построить ему дом."
  2: "ἔγνω — узнал, познал (γινώσκω). ἡτοίμησεν — утвердил, приготовил (слав. «уготова»); слав. добавляет «царем» — внесено в текст. ηὐξήθη εἰς ὕψος — возрос в высоту (слав. «воздвижеся в высоту»). διὰ τὸν λαὸν αὐτοῦ — ради народа Его."
  3: "ἔλαβεν … ἔτι γυναῖκας — взял ещё жён (слав. «поят еще жены»). ἐτέχθησαν — родились (τίκτω). υἱοὶ καὶ θυγατέρες — сыновья и дочери."
  4: "Σαμαα — Самаа (слав. «саммаа»). Ισοβααμ — Исоваам (слав. «совав»; в 1 Пар 3:5 — Σωβαβ, ショバブ). Ναθαν — Нафан (ナタン). Σαλωμων — Соломон (ソロモン). В 2 Цар 5:14 греч. формы иные (Σαμμους, Σωβαβ)."
  5: "Ιβααρ — Иваар (слав. «иеваар»; в 3:6 — イバアル). Ελισαε — Елисае (слав. «елисуй»; в 3:6 — Ελισαμα, エリシャマ). Ελιφαλετ — Елифалет (слав. «елифааф»)."
  6: "Ναγε — Наге (слав. «нагеф»). Ναφαγ — Нафаг (слав. «нафаг»). Ιανουου — Иануу (ヤヌエ, как в 3:7; слав. «иафие»; в Синод. Иафиа)."
  7: "Ελισαμαε — Елисамае (слав. «елисама»). Βαλεγδαε — Валегдае (слав. «валиада»). Ελιφαλετ — Елифалет; имя повторяется, как в гр. и слав."
  8: "ἤκουσαν … ὅτι ἐχρίσθη — услышали, что помазан (χρίω). ἀνέβησαν — поднялись (ἀναβαίνω). ζητῆσαι τὸν Δαυιδ — искать Давида. εἰς ἀπάντησιν — навстречу."
  9: "κοιλὰς τῶν γιγάντων — долина гигантов (γίγας), т.е. рефаимов (в МТ); слав. «юдоль исполинов»; 2 Цар 5:18 — 巨人たちの谷. συνέπεσον — сошлись, расположились (συμπίπτω)."
  10: "ἠρώτησεν … διὰ τοῦ θεοῦ — вопросил через Бога, т.е. у Бога. ἀναβῶ — взойти (ἀναβαίνω). δώσεις αὐτοὺς εἰς τὰς χεῖράς μου — предашь их в руки мои. ἀνάβηθι — взойди."
  11: "Βααλφαρασιν — Ваал-Фарасим (バアル・ファラシン; слав. «ваал-фарасин»). Διέκοψεν — «прорвал» (διακόπτω). ὡς διακοπὴν ὕδατος — как прорыв воды. Διακοπὴ φαρασιν — «прорыв Фарасим» (ファラシンの破れ; слав. «фарасин, разсечение»)."
  12: "ἐγκατέλιπον — оставили (ἐγκαταλείπω; слав. «оставиша»). τοὺς θεοὺς αὐτῶν — богов своих, т.е. идолов. κατακαῦσαι αὐτοὺς ἐν πυρί — сжечь их огнём (слав. «сожещи огнем»). В 2 Цар 5:21 Давид и его люди взяли их — иное чтение."
  13: "προσέθεντο ἔτι — «приложили ещё», снова (προστίθημι). συνέπεσαν ἔτι — снова расположились."
  14: "ἠρώτησεν … ἔτι ἐν θεῷ — ещё вопросил у Бога. οὐ πορεύσῃ ὀπίσω αὐτῶν — не пойдёшь за ними. ἀποστρέφου ἀπ᾽ αὐτῶν — уклонись от них. ἀπίων — грушевых деревьев (ἄπιον — груша; слав. «грушей»); в 2 Цар 5:23 иное слово (κλαυθμών — 泣きの森)."
  15: "συσσεισμός — сотрясение, шум (слав. «глас шума»). ἄκρων τῶν ἀπίων — вершин грушевых деревьев. ἐξελεύσῃ εἰς τὸν πόλεμον — выйдешь на войну. ἐξῆλθεν ὁ θεὸς ἔμπροσθέν σου — вышел Бог пред тобою. παρεμβολή — стан, лагерь (陣営)."
  16: "ἐνετείλατο — заповедал (ἐντέλλομαι). ἐπάταξεν — поразил (πατάσσω). ἀπὸ Γαβαων ἕως Γαζαρα — от Гаваона до Газера (ガバオン, ガゼル; ср. 2 Цар 5:25)."
  17: "ἐγένετο ὄνομα — «стало имя», т.е. прославилось. ἔδωκεν τὸν φόβον αὐτοῦ — дал страх его (слав. «даде страх его»). ἐπὶ πάντα τὰ ἔθνη — на все народы (国民)."
