# jp-box, Судьи, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: завоевание после смерти Иисуса — поход Иуды и Симеона (1–7), взятие
# Иерусалима и южных городов (8–15), кенеи (16), Хорма (17), неполное овладение
# прибрежьем (18–19), Халев в Хевроне (20), иевусеи в Иерусалиме (21), дом Иосифа
# и Вефиль (22–26), неполное изгнание у Манассии, Ефрема, Завулона, Асира,
# Неффалима, Дана (27–36).
