verses:
  1: "ヨシュアが死[し]んで後[のち]、イスラエルの子[こ]らは主[しゅ]に問[と]いかけて言[い]った。「だれがわたしたちに先立[さきだ]って、カナン人[じん]との戦[たたか]いを導[みちび]くために上[のぼ]るのでしょうか。」"
  2: "「ユダが上[のぼ]る。見[み]よ、わたしはその地[ち]を彼[かれ]の手[て]に与[あた]えた。」"
  3: "ユダは兄弟[きょうだい]シメオンに言[い]った。「わたしの割[わ]り当[あ]ての地[ち]で、わたしとともに上[のぼ]って、カナン人[じん]と戦[たたか]おう。わたしもまた、あなたの割[わ]り当[あ]ての地[ち]で、あなたとともに戦[たたか]いに行[ゆ]こう。」シメオンは彼[かれ]とともに出[で]かけた。"
  4: "ユダは上[のぼ]った。主[しゅ]はカナン人[じん]とペリジ人[じん]を彼[かれ]の手[て]に渡[わた]されたので、彼[かれ]はベゼクで彼[かれ]らを打[う]ち、一万人[いちまんにん]の者[もの]を倒[たお]した。"
  5: "彼[かれ]らはベゼクでアドニ・ベゼクを見[み]つけ、彼[かれ]と戦[たたか]って、カナン人[じん]とペリジ人[じん]を打[う]った。"
  6: "アドニ・ベゼクは逃[に]げたが、彼[かれ]らは後[あと]を追[お]って彼[かれ]を捕[と]らえ、その手[て]と足[あし]の親指[おやゆび]を切[き]り落[お]とした。"
  7: "アドニ・ベゼクは言[い]った。「七十人[ななじゅうにん]の王[おう]たちが、手足[てあし]の親指[おやゆび]を切[き]り落[お]とされて、わたしの食卓[しょくたく]の下[した]でくずを拾[ひろ]っていた。わたしがしたとおりに、神[かみ]はわたしに報[むく]い返[かえ]された。」彼[かれ]らは彼[かれ]をエルサレムに連[つ]れて行[い]き、彼[かれ]はそこで死[し]んだ。"
  8: "ユダの子[こ]らはエルサレムに向[む]かって戦[たたか]い、それを取[と]って、剣[つるぎ]の刃[は]にかけて打[う]ち、町[まち]を火[ひ]で焼[や]いた。"
  9: "その後[のち]、ユダの子[こ]らは下[くだ]って、山地[さんち]と南[みなみ]の地[ち]と平地[へいち]に住[す]むカナン人[じん]と戦[たたか]った。"
  10: "ユダはヘブロンに住[す]むカナン人[じん]のところへ行[い]った。ヘブロンは彼[かれ]に向[む]かって出[で]て来[き]た。ヘブロンの名[な]は以前[いぜん]、キリアト・アルボク・セフェルであった。彼[かれ]はシェシとアヒマンとトルミを打[う]った。彼[かれ]らはエナクの子孫[しそん]である。"
  11: "そこから彼[かれ]らはダビルに住[す]む者[もの]たちのところへ行[い]った。ダビルの名[な]は以前[いぜん]、文字[もじ]の町[まち]であった。"
  12: "カレブは言[い]った。「文字[もじ]の町[まち]を打[う]ってそれを取[と]る者[もの]には、わたしの娘[むすめ]アクサを妻[つま]として与[あた]えよう。」"
  13: "ケネズの子[こ]で、カレブの弟[おとうと]であるオトニエルがそれを取[と]ったので、カレブは娘[むすめ]アクサを彼[かれ]に妻[つま]として与[あた]えた。"
  14: "彼女[かのじょ]が嫁[とつ]いで行[ゆ]くとき、オトニエルは彼女[かのじょ]に、父[ちち]から畑[はたけ]を求[もと]めるよう促[うなが]した。彼女[かのじょ]はろばの上[うえ]でつぶやき、ろばの上[うえ]から叫[さけ]んだ。「わたしを南[みなみ]の地[ち]にやられたのですか。」カレブは彼女[かのじょ]に言[い]った。「どうしたのか。」"
  15: "アクサは彼[かれ]に言[い]った。「わたしに祝福[しゅくふく]をください。あなたはわたしを南[みなみ]の地[ち]に与[あた]えたのですから、わたしに水[みず]の源[みなもと]も与[あた]えてください。」カレブは彼女[かのじょ]の心[こころ]にかなうように、上[かみ]の水源[すいげん]と下[しも]の水源[すいげん]を与[あた]えた。"
  16: "ケニ人[じん]でモーセのしゅうとであるホバブの子[こ]らは、なつめやしの町[まち]から上[のぼ]って、ユダの子[こ]らとともに、アラドの下[くだ]りにある南[みなみ]の荒野[こうや]へ行[い]き、民[たみ]とともに住[す]んだ。"
  17: "ユダは兄弟[きょうだい]シメオンとともに出[で]かけて、セフェトに住[す]むカナン人[じん]を打[う]ち、それを聖絶[せいぜつ]して滅[ほろ]ぼし、町[まち]の名[な]を「滅[ほろ]ぼし」と呼[よ]んだ。"
  18: "ユダはガザとその境[さかい]、アスカロンとその境[さかい]、エクロンとその境[さかい]、アゾトとその周辺[しゅうへん]を嗣業[しぎょう]として得[え]なかった。"
  19: "主[しゅ]はユダとともにいて、彼[かれ]は山地[さんち]を嗣業[しぎょう]として得[え]た。しかし谷[たに]に住[す]む者[もの]たちを嗣業[しぎょう]として得[え]ることはできなかった。レハブが彼[かれ]らを阻[はば]んだからである。"
  20: "カレブには、モーセが語[かた]ったとおりにヘブロンが与[あた]えられた。彼[かれ]はそこから三[みっ]つの町[まち]を嗣業[しぎょう]として得[え]、そこからエナクの三人[さんにん]の子[こ]らを追[お]い出[だ]した。"
  21: "ベニヤミンの子[こ]らは、エルサレムに住[す]むエブス人[じん]を追[お]い出[だ]さなかった。エブス人[じん]は今日[きょう]までベニヤミンの子[こ]らとともにエルサレムに住[す]んでいる。"
  22: "ヨセフの子[こ]らもまた、ベテルへ上[のぼ]った。ユダも彼[かれ]らとともにいた。"
  23: "イスラエルの家[いえ]はベテルに陣[じん]を張[は]った。町[まち]の名[な]は以前[いぜん]、ルズであった。"
  24: "見張[みは]りをしていた者[もの]たちは、町[まち]から出[で]て来[く]る人[ひと]を見[み]つけ、彼[かれ]を捕[つか]まえて言[い]った。「この町[まち]への入口[いりぐち]をわたしたちに示[しめ]してくれ。そうすれば、わたしたちはあなたに親切[しんせつ]にしよう。」"
  25: "彼[かれ]は町[まち]への入口[いりぐち]を彼[かれ]らに示[しめ]した。彼[かれ]らは町[まち]を剣[つるぎ]の刃[は]にかけて打[う]ち、その人[ひと]とその一族[いちぞく]は送[おく]り出[だ]した。"
  26: "その人[ひと]はヘテ人[じん]の地[ち]へ行[い]って町[まち]を建[た]て、その名[な]をルズと呼[よ]んだ。それが今日[きょう]までその町[まち]の名[な]である。"
  27: "マナセはベト・シャン、すなわちスキト人[じん]の町[まち]を嗣業[しぎょう]として得[え]なかった。その娘[むすめ]たちの町[まち]々[まち]も、その周辺[しゅうへん]も、エクタナアドとその娘[むすめ]たちの町[まち]も、ドルに住[す]む者[もの]とその娘[むすめ]たちの町[まち]も、バラアムに住[す]む者[もの]とその娘[むすめ]たちの町[まち]も、メギドンに住[す]む者[もの]とその娘[むすめ]たちの町[まち]も、イエブラアムに住[す]む者[もの]とその娘[むすめ]たちの町[まち]も得[え]なかった。そしてカナン人[じん]はこの地[ち]に住[す]み始[はじ]めた。"
  28: "イスラエルが強[つよ]くなったとき、カナン人[じん]に貢[みつ]ぎを納[おさ]めさせたが、追[お]い出[だ]すことは決[けっ]してなかった。"
  29: "エフライムはガゼルに住[す]むカナン人[じん]を追[お]い出[だ]さなかった。カナン人[じん]はガゼルで彼[かれ]のただ中[なか]に住[す]み、貢[みつ]ぎを納[おさ]める者[もの]となった。"
  30: "ゼブルンはケドロンに住[す]む者[もの]たちとエナアラに住[す]む者[もの]たちを追[お]い出[だ]さなかった。カナン人[じん]は彼[かれ]のただ中[なか]に住[す]み、貢[みつ]ぎを納[おさ]める者[もの]となった。"
  31: "アシェルはアッコに住[す]む者[もの]たちを追[お]い出[だ]さず、彼[かれ]らは彼[かれ]に貢[みつ]ぎを納[おさ]める者[もの]となった。またドル、シドン、アアラフに住[す]む者[もの]たちも、アハジブも、ヘルバも、アフェクも、ロオブも追[お]い出[だ]さなかった。"
  32: "アシェルは、その地[ち]に住[す]むカナン人[じん]のただ中[なか]に住[す]んだ。彼[かれ]らを追[お]い出[だ]すことができなかったからである。"
  33: "ナフタリはベト・シェメシュに住[す]む者[もの]たちも、ベト・エネトに住[す]む者[もの]たちも追[お]い出[だ]さなかった。イスラエルは、その地[ち]に住[す]むカナン人[じん]のただ中[なか]に住[す]んだ。ベト・シェメシュとベト・エネトに住[す]む者[もの]たちは、彼[かれ]らに貢[みつ]ぎを納[おさ]める者[もの]となった。"
  34: "アモリ人[じん]はダンの子[こ]らを山地[さんち]に押[お]し込[こ]めた。彼[かれ]らが谷[たに]へ下[くだ]るのを許[ゆる]さなかったからである。"
  35: "アモリ人[じん]は、熊[くま]と狐[きつね]のいるミルシノンの山[やま]に住[す]み始[はじ]めた。しかしヨセフの家[いえ]の手[て]はアモリ人[じん]の上[うえ]に重[おも]くなり、彼[かれ]らは貢[みつ]ぎを納[おさ]める者[もの]となった。"
  36: "アモリ人[じん]の境[さかい]は、エドム人[じん]の境[さかい]であり、アクラビムの上[うえ]の岩[いわ]から、さらに上[うえ]へと及[およ]んだ。"

notes:
  1: "ἐγένετο μετὰ τὴν τελευτήν — «было после кончины» (τελευτή — кончина; слав. «по скончании»). ἐπηρώτων — имперфект, «спрашивали, вопрошали»; ἐν κυρίῳ — «в Господе» (слав. «Господа»: вопрошали Господа). ἀφηγούμενος — «ведущий, предводительствующий» (при πολεμῆσαι: кто пойдёт воевать). ἀναβήσεται — «взойдёт»."
  2: "Ιουδας ἀναβήσεται — «Иуда взойдёт»: имя племени в ед. ч. (как в слав.; ru «пойдёт»). δέδωκα — perfect, «Я дал» (слав. «дах»). ἐν χειρὶ αὐτοῦ — «в руку его»."
  3: "ἐν τῷ κλήρῳ μου — «в уделе моём»: κλῆρος здесь не жребий-жеребьёвка, а доставшаяся по жребию земля; передано 割り当ての地 (в ст. 3 дважды). πολεμήσωμεν — конъюнктив 1-го л. мн. ч. «будем воевать». καί γε ἐγώ — «и я тоже». ἐπορεύθη — «пошёл» (о Симеоне)."
  4: "ἐπάταξεν — «поразил» (πατάσσω). ἐν Βεζεκ — «в Везеке». δέκα χιλιάδας ἀνδρῶν — «десять тысяч мужей»: винительный количества при ἐπάταξεν, отсюда 一万人の者を倒した. Слав. «избиша... до десяти тысящ»."
  5: "εὗρον — «нашли» (слав. «обретоша»). ἐπολέμησαν ἐν αὐτῷ — «сразились с ним». Адони-Везек — «господин Везека» (имя царя)."
  6: "τὰ ἄκρα τῶν χειρῶν καὶ τῶν ποδῶν — «концы рук и ног», т. е. большие пальцы (слав. «краи рук его и краи ног его»; ru «большие пальцы»). κατεδίωξαν ὀπίσω αὐτοῦ — «погнались за ним». ἀπέκοψαν — «отсекли»."
  7: "Ἑβδομήκοντα βασιλεῖς... ἀποκεκομμένοι ἦσαν συλλέγοντες — «семьдесят царей... собирали» (описательная конструкция с perfect-причастием). τὰ ὑποκάτω τῆς τραπέζης — «то, что под столом», крохи. ἀνταπέδωκεν — «воздал» (слав. «воздаде»). ἤγαγον εἰς Ιερουσαλημ — «привели в Иерусалим»."
  8: "ἐν στόματι ῥομφαίας — букв. «устами меча», т. е. остриём/лезвием; по корпусу 剣の刃にかけて. τὴν πόλιν ἐνέπρησαν ἐν πυρί — «город сожгли огнём»."
  9: "πεδινή — «равнина, низменность» (слав. «равняя»). κατέβησαν — «сошли» (из горной части). ὀρεινή — «горная страна»."
  10: "ἐξῆλθεν Χεβρων ἐξ ἐναντίας — «вышел Хеврон навстречу» (жители города; слав. «изыде хеврон со страны»). Καριαθαρβοκσεφερ — Кириат-Арбы (слав. «кариафарвок-сефер»; ru «Кириаф-Арбы»). γεννήματα τοῦ Ενακ — «порождения Енака», т. е. потомки (в ст. 20 — «сыны Енаковы»)."
  11: "Πόλις γραμμάτων — «город письмён» (слав. «град писмен»), отождествляется с Кириаф-Сефером (ст. 12). ἐκεῖθεν — «оттуда»."
  12: "Ὃς ἂν πατάξῃ — «кто поразит» (ἄν + конъюнктив). προκαταλάβηται — «захватит, овладеет» (слав. «возмет»). δώσω... εἰς γυναῖκα — «дам в жёны»."
  13: "ἀδελφὸς Χαλεβ ὁ νεώτερος — «младший брат Халева»: по LXX Гофониил — брат Халева (в евр./ru — «сын Кеназа, младшего брата Халевова»); порядок слов греческого сохранён. προκατελάβετο — «овладел»."
  14: "ἐν τῷ εἰσπορεύεσθαι — «когда она входила» (выходила замуж). ἐπέσεισεν — «побудил» (ἐπισείω); подлежащее в греческом не названо (слав. добавляет «Гофониил»). ἐγόγγυζεν — «роптала, ворчала»; ἐπάνω τοῦ ὑποζυγίου — «на осле» (ὑποζύγιον — вьючное животное). ἐκδέδοσαί με — «ты отдал меня»."
  15: "Δός μοι εὐλογίαν — «дай мне благословение»: просьба о даре к приданому. λύτρωσις ὕδατος — букв. «искупление воды»; так LXX передаёт евр. גֻּלּוֹת «источники» (слав. «исходища водная»), отсюда 水の源. λύτρωσιν μετεώρων καὶ ταπεινῶν — «источники верхние и нижние» (слав. «исходища вышних и исходища нижних»)."
  16: "οἱ υἱοὶ Ιωβαβ τοῦ Κιναίου πενθεροῦ Μωυσῆ — «сыны Иоава Кенеянина, тестя Моисеева» (в 4:11 тот же назван γαμβρός). πόλις τῶν φοινίκων — «город пальм» (Иерихон). ἐπὶ καταβάσεως Αραδ — «при спуске Арада». ἐπορεύθη καὶ κατῴκησεν — ед. ч. при собирательном подлежащем."
  17: "ἀνεθεμάτισαν — «предали заклятию», 聖絶. Ἐξολόθρευσις — «истребление»: LXX переводит евр. имя Хорма (חָרְמָה); в ru — «Хорма», в слав. — «потребление». ἐκάλεσαν τὸ ὄνομα — «назвали имя»."
  18: "οὐκ ἐκληρονόμησεν — «не наследовал, не овладел»: LXX читает отрицание; слав. и ru («взял...») — положительно (иное понимание/текст). περισπόρια — «предместья, окрестности» (слав. «окрестная»)."
  19: "ἐδύνατο — имперфект «мог». κοιλάς — «долина». Ρηχαβ διεστείλατο αὐτήν — «Рехав преградил её»: вероятно, евр. רֶכֶב «колесницы» прочитано LXX как имя собственное; слав. «Рехав противоста им, и колесницы железныя бяху тым» (двойное чтение), ru — «железные колесницы». Тёмное место."
  20: "καθὰ ἐλάλησεν Μωϋσῆς — «как сказал Моисей». τὰς τρεῖς πόλεις — «три города» (слав. «три грады»); τοὺς τρεῖς υἱοὺς Ενακ — «трёх сынов Енака»."
  21: "ἕως τῆς ἡμέρας ταύτης — «до сего дня» (今日まで). В конце слав. добавляет «во Иерусалиме», в греческом этого нет."
  22: "καί γε αὐτοί — «и сами они». καὶ Ιουδας μετ' αὐτῶν — «и Иуда с ними»; слав. читает «Господь бяше с ними» (иное чтение)."
  23: "παρενέβαλον — «расположились станом» (слав. «ополчишася»); слав. добавляет «соглядаша» (разведали), в греческом нет. Λουζα — Луз, прежнее имя Вефиля."
  24: "οἱ φυλάσσοντες — «стражи». ἔλεος — «милость» (слав. «милость»); ποιήσομεν μετὰ σοῦ ἔλεος — «окажем тебе милость» (клятвенная формула), передано 親切にしよう."
  25: "ἐξαπέστειλαν — «отпустили» (слав. «отпустиша»). ἐν στόματι ῥομφαίας — см. ст. 8."
  26: "γῆ Χεττιιμ — «земля Хеттеев» (слав. «землю хеттиим»). ᾠκοδόμησεν — «построил»."
  27: "θυγατέρες — букв. «дочери», т. е. зависимые селения (слав. «дщери»); отсюда 娘たちの町. περισπόρια — «окрестности». Σκυθῶν πόλις — «город скифов» (слав. «скифский град»). Имена: Βαιθσαν — Беф-Сан, Εκθανααδ — Екфанаад (слав. «фанах»), Δωρ — Дор, Βαλααμ — Балаам (слав. «иевлам»), Μαγεδων — Мегиддон, Ιεβλααμ — Иевлаам. ἤρξατο κατοικεῖν — «начал жить»."
  28: "ἐνίσχυσεν — «укрепился». ἔθετο... εἰς φόρον — «обратил в данников» (φόρος — дань, 貢ぎ). ἐξαίρων οὐκ ἐξῆρεν — усилительное «изгоняя не изгнал», т. е. так и не изгнал."
  29: "Γαζερ — Газер. κατῴκει — имперфект «жил». ἐν μέσῳ αὐτοῦ — «среди него» (Ефрема). ἐγένετο εἰς φόρον — «стал данником»."
  30: "Κεδρων, Ενααλα — Кедрон и Енаала (слав. «хеврон» и «амман» — иные чтения). ἐγένετο εἰς φόρον — «стал данником»."
  31: "Ακχω — Акко (Птолемаида). В середину списка вставлено «и стал ему данником» (слав. в скобках). Ααλαφ, Αχαζιβ, Χελβα, Αφεκ, Ροωβ — Аалаф, Ахазив, Хелва, Афек, Рехов (ru «Рехов»)."
  32: "κατῴκησεν Ασηρ ἐν μέσῳ — «жил Асир среди». οὐκ ἐδυνάσθη — «не смог»."
  33: "Βαιθσαμυς, Βαιθενεθ — Беф-Самис и Беф-Анаф (слав. «вефсамис», «вефанах»). οἱ κατοικοῦντες... ἐγενήθησαν αὐτοῖς εἰς φόρον — «жители... стали им данниками»."
  34: "ἐξέθλιψεν — «стеснил, притеснил» (θλίβω). εἰς τὸ ὄρος — «в горы». οὐκ ἀφῆκεν αὐτὸν καταβῆναι — «не позволил ему сойти» (αὐτόν — Дан, ед. ч.)."
  35: "ὄρος τοῦ Μυρσινῶνος — «гора Мирсинона»; пояснение «где медведи и лисицы» стоит в греческом (слав. добавляет «и в Салавине»). ἐβαρύνθη ἡ χεὶρ οἴκου Ιωσηφ — «отяготела рука дома Иосифова»."
  36: "ὅριον τοῦ Αμορραίου — «предел Аморрея»; ὁ Ιδουμαῖος — «идумей» (слав. «идумей»), в евр./ru — «от возвышенности Акравим и от Селы». ἐπάνω Ακραβιν ἐπὶ τῆς Πέτρας καὶ ἐπάνω — «выше Акравима, на Камне (Селе/Петре) и выше». Тёмное, вероятно повреждённое место."
