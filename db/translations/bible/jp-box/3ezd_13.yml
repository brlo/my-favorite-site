verses:
  1: "七日[なのか]の後[のち]、わたしは夜[よる]の夢[ゆめ]を見[み]た。"
  2: "見[み]よ、海[うみ]から風[かぜ]が起[お]こり、その波[なみ]をことごとくかき乱[みだ]そうとしていた。"
  3: "わたしが見[み]ていると、見[み]よ、その人[ひと]は天[てん]の幾千[いくせん]の軍勢[ぐんぜい]とともに力[ちから]を増[ま]し、顔[かお]を向[む]けて見渡[みわた]すところ、そのもとに見[み]えるものはすべて震[ふる]えていた。"
  4: "その口[くち]から声[こえ]が出[で]るたび、それを聞[き]く者[もの]はみな燃[も]え上[あ]がった。地[ち]が火[ひ]を感[かん]じて鎮[しず]まるかのように。"
  5: "その後[あと]に見[み]た。見[み]よ、天[てん]の四方[しほう]の風[かぜ]から、数[かぞ]えきれないほどの人[ひと]々[びと]が集[あつ]まって、海[うみ]から出[で]てきたその人[ひと]を打[う]ち負[ま]かそうとしていた。"
  6: "わたしが見[み]ていると、見[み]よ、彼は自[みずか]らのために大[おお]きな山[やま]を刻[きざ]み出[だ]して、その上[うえ]に飛[と]び上[のぼ]った。"
  7: "わたしは、その山[やま]がどこから刻[きざ]み出[だ]されたのか、その地[ち]や場所[ばしょ]を見[み]ようと求[もと]めたが、できなかった。"
  8: "その後[あと]に見[み]た。見[み]よ、彼に敵[てき]して集[あつ]まった者[もの]たちはみな、ひどく恐[おそ]れながらも、あえて戦[たたか]おうとしていた。"
  9: "見[み]よ、彼は押[お]し寄[よ]せる大群[たいぐん]の激[はげ]しい勢[いきお]いを見[み]ても、手[て]を上[あ]げず、槍[やり]も持[も]たず、戦[いくさ]の武具[ぶぐ]を一切[いっさい]持[も]たなかった。ただ、わたしが見[み]たところでは、"
  10: "彼は口[くち]から火[ひ]の息[いき]のようなもの、唇[くちびる]から炎[ほのお]の息[いき]のようなものを吹[ふ]き出[だ]し、舌[した]から火花[ひばな]と嵐[あらし]を放[はな]った。そして、これらはすべて一つに合[あ]わさった。火の息、炎の息、そして激[はげ]しい嵐である。"
  11: "彼は戦[いくさ]の備[そな]えをしたその大群[たいぐん]に激[はげ]しく襲[おそ]いかかり、すべてを焼[や]き尽[つ]くした（根[ね]こそぎにした）。たちまち、数[かぞ]えきれない大群[たいぐん]のうちには何[なに]も見[み]えなくなり、ただ塵[ちり]と煙[けむり]のにおいだけが残[のこ]った。わたしはこれを見[み]て恐[おそ]れた。"
  12: "その後[あと]、わたしはその人[ひと]が山[やま]から下[お]りてくるのを見[み]た。彼は別[べつ]の、平和[へいわ]な大群[たいぐん]を自分[じぶん]のもとへ呼[よ]び寄[よ]せていた。"
  13: "多[おお]くの人[ひと]の顔[かお]が彼のもとへ進[すす]み出[で]た。ある者[もの]は喜[よろこ]び、ある者[もの]は悲[かな]しみ、ある者[もの]は縄[なわ]で縛[しば]られ、ある者[もの]は連[つ]れて来[こ]られる者[もの]たちを引[ひ]き連[つ]れていた。わたしは恐[おそ]れのあまり力[ちから]を失[うしな]い、目[め]を覚[さ]まして言[い]った。"
  14: "「あなたは初[はじ]めから、この僕[しもべ]にこれらの驚[おどろ]くべきわざを示[しめ]し、わたしを、わたしの祈[いの]りをお受[う]けになるにふさわしい者[もの]としてくださいました。"
  15: "今[いま]、どうかこの夢[ゆめ]の解[と]き明[あ]かしを、さらにわたしに示[しめ]してください。"
  16: "わたしの思[おも]いと感[かん]じるところでは、その日[ひ]に残[のこ]される者[もの]には災[わざわ]いがあり、まして残[のこ]されない者[もの]にはなおさら災[わざわ]いがあります。"
  17: "残[のこ]されない者[もの]たちは悲[かな]しんでいたからです。"
  18: "今[いま]、わたしは理解[りかい]します。終[お]わりの日[ひ]々[び]のために取[と]っておかれたことが、彼らにも、また残[のこ]された者[もの]たちにも臨[のぞ]むのです。"
  19: "それゆえ、この夢[ゆめ]が示[しめ]すとおり、彼らは大[おお]きな災[わざわ]いと多[おお]くの苦[くる]しみに陥[おちい]ったのです。"
  20: "しかし、災[わざわ]いの中[なか]にある者[もの]がこれに遭[あ]うほうが、雲[くも]のようにこの世[よ]を通[とお]り過[す]ぎて、終[お]わりの時[とき]に起[お]こることを今[いま]見[み]ないよりは、まだ軽[かろ]いのです。」彼はわたしに答[こた]えて言[い]った。"
  21: "「わたしはあなたに、この幻[まぼろし]の解[と]き明[あ]かしを告[つ]げ、あなたが語[かた]ったことについても、あなたに明[あ]かしにしよう。"
  22: "あなたが、残[のこ]された者[もの]たちについて語[かた]った、その解[と]き明[あ]かしはこうである。"
  23: "その時[とき]に災[わざわ]いを退[しりぞ]ける者[もの]は、自分[じぶん]を保[たも]った者[もの]である。災[わざわ]いに陥[おちい]った者[もの]たちとは、業[わざ]と、力[ちから]ある方[かた]への信仰[しんこう]とを抱[いだ]く者[もの]たちである。"
  24: "だから知[し]るがよい。残[のこ]された者[もの]たちは、死[し]んだ者[もの]たちよりも、さらに祝福[しゅくふく]されているのだ。"
  25: "この幻[まぼろし]の解[と]き明[あ]かしはこうである。あなたが見[み]た、海[うみ]の真[ま]ん中[なか]から上[のぼ]ってくる人[ひと]は、"
  26: "いと高[たか]き方[かた]が長[なが]い時[とき]にわたって守[まも]っておられる者[もの]である。彼は自[みずか]らによって、ご自分[じぶん]の造[つく]られたものの贖[あがな]いをし、残[のこ]された者[もの]たちを顧[かえり]みられる。"
  27: "あなたが、彼の口[くち]から息[いき]と火[ひ]と嵐[あらし]のようなものが出[で]るのを見[み]たのは、"
  28: "また、彼が剣[つるぎ]も戦[いくさ]の武具[ぶぐ]も持[も]たなかったのに、彼の激[はげ]しい勢[いきお]いが、彼と戦[たたか]おうと来[き]た大群[たいぐん]を打[う]ち倒[たお]したことは、こういうことである。"
  29: "見[み]よ、いと高[たか]き方[かた]が、地[ち]の上[うえ]にある者[もの]たちを贖[あがな]い始[はじ]める日[ひ]が来[く]る。"
  30: "そのとき、地[ち]に住[す]む者[もの]たちに、心[こころ]を驚[おどろ]かす恐[おそ]れが臨[のぞ]む。"
  31: "人[ひと]々[びと]は、町[まち]は町[まち]に、場[ば]は場[ば]に、民[たみ]は民[たみ]に、国[くに]は国[くに]に敵[てき]して、互[たが]いに戦[たたか]おうと企[くわだ]てる。"
  32: "これらのことが起[お]こり、わたしが前[まえ]にあなたに示[しめ]したしるしが現[あらわ]れるとき、そのとき、あなたが海[うみ]から上[のぼ]る人[ひと]として見[み]たわたしの子[こ]が現[あらわ]れる。"
  33: "すべての民[たみ]が彼の声[こえ]を聞[き]くとき、それぞれが自分[じぶん]の国[くに]で、互[たが]いに持[も]っていた戦[たたか]いをやめる。"
  34: "そして、数[かぞ]えきれない大群[たいぐん]が一[ひと]つの集[つど]いとして集[あつ]まり、彼を攻[せ]めようと戦[いくさ]の備[そな]えを整[ととの]える。"
  35: "彼はシオンの山[やま]の頂[いただき]に立[た]つ。"
  36: "シオンは、あなたが手[て]によらず刻[きざ]まれた山[やま]を見[み]たように、備[そな]えられ整[ととの]えられて、すべての者[もの]の前[まえ]に現[あらわ]れる。"
  37: "わたしの子[こ]は、もろもろの民[たみ]が考[かんが]え出[だ]した不敬[ふけい]を明[あ]るみに出[だ]す。すなわち、彼らの悪[わる]い思[おも]いと、彼らが苦[くる]しめられ始[はじ]める苦[くる]しみのゆえに、嵐[あらし]に近[ちか]づいた、あの不敬[ふけい]である。"
  38: "それらは炎[ほのお]に似[に]ている。彼は、火[ひ]に似[に]た律法[りっぽう]によって、彼らを労[ろう]せずに滅[ほろ]ぼす。"
  39: "あなたが、彼が別[べつ]の平和[へいわ]な大群[たいぐん]を自分[じぶん]のもとへ集[あつ]めるのを見[み]たのは、"
  40: "すなわち、ホセア王[おう]の日[ひ]に自分[じぶん]の地[ち]から捕[と]らわれの身[み]となった十[じゅう]の部族[ぶぞく]である。アッシリアの王[おう]サルマナサルが彼[かれ]を捕[と]らえ、彼らを川[かわ]の向[む]こうへ移[うつ]し、別[べつ]の地[ち]へ連[つ]れて行[い]った。"
  41: "彼らは相談[そうだん]して、多[おお]くの民[たみ]を捨[す]て、人[ひと]の住[す]んだことのない遠[とお]い国[くに]へ行[い]こうと決[き]めた。"
  42: "そこでは、自分[じぶん]の国[くに]では守[まも]らなかった自分[じぶん]の律法[りっぽう]を守[まも]るためであった。"
  43: "彼らは狭[せま]い通[とお]り道[みち]からユーフラテス川[がわ]のほとりへ進[すす]んだ。"
  44: "そのとき、いと高[たか]き方[かた]は彼らのためにしるしを行[おこな]い、彼らが通[とお]り過[す]ぎるまで川[かわ]の流[なが]れを止[と]められたからである。"
  45: "その地[ち]を通[とお]る道[みち]は長[なが]く、一年[いちねん]半[はん]の旅[たび]であった。その地[ち]はアルサレフと呼[よ]ばれている。"
  46: "彼らはそこに、終[お]わりの時[とき]まで住[す]んだ。そして今[いま]、彼らが再[ふたた]び来[こ]ようとし始[はじ]めると、"
  47: "いと高[たか]き方[かた]は再[ふたた]び川[かわ]の流[なが]れを止[と]めて、彼らが通[とお]れるようにされる。あなたが平和[へいわ]な大群[たいぐん]を見[み]たのは、この者[もの]たちのゆえである。"
  48: "しかし、あなたの民[たみ]のうちで残[のこ]された者[もの]たちとは、わたしの領界[りょうかい]の内[うち]に見[み]いだされる者[もの]たちである。"
  49: "それゆえ、集[あつ]まったもろもろの民[たみ]の大群[たいぐん]を滅[ほろ]ぼし始[はじ]めるとき、彼は民[たみ]のうちで勝[か]ち残[のこ]った者[もの]たちを守[まも]られる。"
  50: "そのとき、彼は彼らに多[おお]くの驚[おどろ]くべきわざを示[しめ]される。」"
  51: "わたしは言[い]った。「主[しゅ]よ、どうかこのことをわたしに示[しめ]してください。なぜわたしは、海[うみ]の真[ま]ん中[なか]から上[のぼ]ってくる人[ひと]を見[み]たのですか。」彼はわたしに言[い]った。"
  52: "「あなたが海[うみ]の深[ふか]みにあることを究[きわ]め、知[し]ることができないように、地[ち]の上[うえ]でだれも、わたしの子[こ]も、彼とともにいる者[もの]たちも、その日[ひ]の時[とき]でなければ見[み]ることができない。"
  53: "これが、あなたが見[み]た夢[ゆめ]の解[と]き明[あ]かしである。あなたはこのゆえに、ここでただ一人[ひとり]照[て]らされたのだ。"
  54: "あなたは自分[じぶん]のことを捨[す]てて、わたしの律法[りっぽう]の周[まわ]りのことを務[つと]め、それを求[もと]めたからである。"
  55: "あなたは自分[じぶん]の生[い]き方[かた]を知恵[ちえ]によって整[ととの]え、悟[さと]りを母[はは]と呼[よ]んだからである。"
  56: "それゆえ、わたしはあなたに、いと高[たか]き方[かた]のもとでの報[むく]いを示[しめ]した。さらに三日[みっか]の後[のち]、わたしはあなたに別[べつ]のことを語[かた]り、重[おも]いことと驚[おどろ]くべきことをあなたに明[あ]かしにする。」"
  57: "わたしは行[い]って野[の]に出[で]、いと高[たか]き方[かた]が時[とき]に応[おう]じて行[おこな]われる驚[おどろ]くべきわざのゆえに、大[おお]いにたたえ、ほめたたえた。"
  58: "また、このことと、時[とき]のうちに行[おこな]われたことを治[おさ]めておられることを、たたえた。そしてわたしはそこに三日[みっか]座[すわ]っていた。"

notes:
  1: "По днех седми — «после семи дней»; сон нощию — «сон ночью». Видение начинается без вводки, как в слав."
  2: "От моря ветр воставаше — «с моря поднимался ветер»; да возмутит вся волны его — «чтобы возмутить все волны его»."
  3: "С тысящьми небесными — «с небесными тысячами (воинством)»; ru «с воинством небесным». Аможе лице свое обращаше, да воззрит, трепетаху вся — «куда ни обращал лицо, чтобы взглянуть, всё трепетало»."
  4: "Тёмное место: якоже покоится земля, егда услышит огнь — «как успокаивается (замирает) земля, когда почувствует огонь». ru «как тает воск, когда почувствует огонь» — иное чтение; возможно, слав. «земля» стоит вместо «воск» (ср. Пс 67:3). В тексте — по слав."
  5: "От четырех ветр небесных — «от четырёх небесных ветров», т. е. со всех сторон света."
  6: "Извая гору велику — «изваял (вытесал) себе великую гору»; возлете на ню — «взлетел на неё»."
  9: "Не воздвиже руки своея, ни оружия держаше и ни котораго орудия браннаго — «не поднял руки своей, не держал ни копья, ни какого-либо воинского орудия». Слав. «токмо якоже видех» — «только, как я видел» — вводит описание в 10."
  10: "Дохновение огня… дух пламене — «дыхание огня… дух пламени»; слав. «и соединена суть вся вкупе сия» — «и соединено всё это вместе»."
  11: "Слав. «(и искорени)» — редакционная вставка в скобках, переведена как «根こそぎにした». «Дыма воня» — «запах дыма»."
  13: "Лица человеков многих — «лица многих людей»; нецыи привязани, нецыи приводяще от тех, иже приношахуся — тёмное: «одни связаны, другие приводят тех, кого приносили»; изнемогох от множества страха — «изнемог от великого страха»."
  16: "Горе иже оставлени будут… и наипаче горе сим, иже не суть оставлени — «горе оставленным… и тем более горе не оставленным». Слав. «горе» — существительное, передано 災い."
  20: "Неже прейти яко облаку от века — «чем пройти, как облаку, из века (из мира) сего»; яже случатся в последняя времена — «что случится в последние времена». Слав. «и ныне видети» стоит без отрицания; ru «и не видеть» — в тексте по смыслу ru («見ないよりは»), отмечено."
  23: "Иже отимет беду в то время — «кто отнимет (отвратит) беду в то время»; дела и веру к крепчайшему — «дела и веру к Крепчайшему (Всевышнему)»."
  26: "Разсмотрит, иже оставлени суть — «призрит (посетит) оставленных»; ru «управит тех, которые оставлены» — оттенок иной, в тексте «顧みられる»."
  30: "Ужас ума — «ужас ума (изумление)»; ru «приведёт в изумление живущих на земле»."
  37: "Тёмное место: яже к бури приближишася ради лукавых помышлений их и мучений, имиже начнут мучитися — «которые приблизились к буре ради злых помышлений их и мучений, которыми начнут мучиться». Передано близко к слав. и ru."
  40: "Слав. «осин» — Осия, царь Израиля (4 Цар 17); передано ホセア. Салманасар — ассирийский царь; «преведе их за реку» — за Евфрат."
  45: "Арсареф — слав. «арсареф», ru «Арсареф»; страна не отождествлена. Лето едино и пол — «полтора года»."
  49: "Тёмное: защитит их, иже премогоша людий — «защитит тех, кто одолел народ». ru «Он защитит народ Свой, который останется» — иное чтение; в тексте «民のうちで勝ち残った者たち」 по слав."
  51: "Чесо ради видех — «почему я видел»; «И рече мне» — вводка ответа, вне кавычек."
  52: "Токмо во время дне — «только во время дня (Его)»."
  54: "Тёмное: оставил бо еси твой… — «ибо ты оставил своё»; окрест моего упразднялся еси закона — «упражнялся около закона Моего». ru «Ты оставил дела твои и упражнялся в законе Моём» — поясняет."
  56: "Мзды у вышняго — «награды у Всевышнего»; тяжкая и дивная — «важное и чудное»."
  58: "Яко управляет сие, и яже суть во временех сотворена — «что Он управляет этим и тем, что совершено во временах»."
