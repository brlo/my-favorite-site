# jp-box, 3-я Ездры, глава 13. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте книги нет; ru — для понимания.
# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
# Глава 13: видение мужа, восходящего из моря (1–13); молитва Ездры (14–20);
# толкование ангела: муж — Сын Божий, сожжение народов, десять колен (21–50);
# вопрос Ездры и ответ (51–56); Ездра в поле три дня (57–58).
# Голоса: 1–13 — повествование без кавычек; 14–20 — молитва Ездры в 「…」,
# вводка «Он отвечал мне и сказал» (13:20) вне кавычек; 21–50 — слово ангела в 「…」;
# 13:51 — вводка, вопрос Ездры в 「…」, снова вводка; 52–56 — ответ ангела в 「…」;
# 57–58 — повествование. Прямая речь Бога/ангела — 常体, молитва Ездры — です・ます.
# Слав. «якоже покоится земля» (13:4) при ru «как тает воск» — см. notes.

