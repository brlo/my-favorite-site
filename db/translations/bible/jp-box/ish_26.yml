verses:
  1: "「あなたは幕屋[まくや]を十枚[じゅうまい]の幕[まく]で造[つく]れ。撚[よ]った亜麻布[あまぬの]と青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸で造[つく]り、織[お]り手[て]の技[わざ]でケルビムを織[お]り込[こ]め。"
  2: "一枚[いちまい]の幕[まく]の長[なが]さは二十八[にじゅうはち]キュビト、一枚[いちまい]の幕[まく]の幅[はば]は四[よん]キュビトとする。すべての幕[まく]は同[おな]じ寸法[すんぽう]とする。"
  3: "五枚[ごまい]の幕[まく]は互[たが]いにつながり、五枚[ごまい]の幕[まく]も互[たが]いにつながる。"
  4: "あなたは一枚[いちまい]の幕[まく]の縁[ふち]に、つなぎ目[め]の側[がわ]の端[はし]に青[あお]の紐[ひも]の環[かん]を造[つく]り、もう一枚[いちまい]の幕[まく]の縁[ふち]にも、第二[だいに]のつなぎ目[め]の側[がわ]に同[おな]じように造[つく]れ。"
  5: "一枚[いちまい]の幕[まく]に五十[ごじゅう]の環[かん]を、もう一枚[いちまい]の幕[まく]の端[はし]、第二[だいに]のつなぎ目[め]に沿[そ]ったところに五十[ごじゅう]の環[かん]を造[つく]れ。その環[かん]は互[たが]いに向[む]かい合[あ]う。"
  6: "あなたは金[きん]の鉤[かぎ]を五十[ごじゅう]造[つく]り、その鉤[かぎ]で幕[まく]を互[たが]いにつなげ。そうして幕屋[まくや]は一[ひと]つとなる。」"
  7: "「あなたは幕屋[まくや]の覆[おお]いとして、山羊[やぎ]の毛[け]の天幕[てんまく]を造[つく]れ。十一枚[じゅういちまい]の天幕[てんまく]を造[つく]る。"
  8: "一枚[いちまい]の天幕[てんまく]の長[なが]さは三十[さんじゅう]キュビト、一枚[いちまい]の天幕[てんまく]の幅[はば]は四[よん]キュビトとする。十一枚[じゅういちまい]の天幕[てんまく]は同[おな]じ寸法[すんぽう]とする。"
  9: "あなたは五枚[ごまい]の天幕[てんまく]を一[ひと]つに、六枚[ろくまい]の天幕[てんまく]を一[ひと]つにつなげ。六枚目[ろくまいめ]の天幕[てんまく]は幕屋[まくや]の正面[しょうめん]で二重[にじゅう]に折[お]れ。"
  10: "あなたは、一[ひと]つにつないだ天幕[てんまく]の縁[ふち]、つなぎ目[め]のところに五十[ごじゅう]の環[かん]を、もう一[ひと]つにつないだ天幕[てんまく]の縁[ふち]にも五十[ごじゅう]の環[かん]を造[つく]れ。"
  11: "あなたは青銅[せいどう]の鉤[かぎ]を五十[ごじゅう]造[つく]り、その鉤[かぎ]を環[かん]に通[とお]して天幕[てんまく]をつなげ。そうして一[ひと]つになる。"
  12: "幕屋[まくや]の天幕[てんまく]のうちで余[あま]るもの、すなわち残[のこ]った半枚[はんまい]の天幕[てんまく]は、幕屋[まくや]の後[うし]ろに垂[た]らす。"
  13: "天幕[てんまく]の長[なが]さのうちで余[あま]る一[いっ]キュビトと一[いっ]キュビトは、幕屋[まくや]の側面[そくめん]に、こちら側[がわ]とあちら側[がわ]に垂[た]れて覆[おお]う。こうして覆[おお]うためである。"
  14: "あなたは幕屋[まくや]のために、赤[あか]く染[そ]めた雄羊[おひつじ]の皮[かわ]の覆[おお]いと、その上[うえ]に青[あお]い皮[かわ]の覆[おお]いを造[つく]れ。」"
  15: "「あなたは幕屋[まくや]のために、アカシアの木[き]で板[いた]を造[つく]れ。"
  16: "一枚[いちまい]の板[いた]の長[なが]さは十[じゅう]キュビト、一枚[いちまい]の板[いた]の幅[はば]は一[いっ]キュビト半[はん]とする。"
  17: "一枚[いちまい]の板[いた]に二[ふた]つのほぞを、互[たが]いに向[む]かい合[あ]うように造[つく]れ。幕屋[まくや]のすべての板[いた]に同[おな]じようにせよ。"
  18: "幕屋[まくや]の板[いた]は、北[きた]の側[がわ]に二十[にじゅう]枚[まい]造[つく]れ。"
  19: "二十[にじゅう]枚[まい]の板[いた]のために銀[ぎん]の台座[だいざ]を四十[よんじゅう]造[つく]れ。一枚[いちまい]の板[いた]に二[ふた]つの台座[だいざ]を、その両側[りょうがわ]に。もう一枚[いちまい]の板[いた]にも二[ふた]つの台座[だいざ]を、その両側[りょうがわ]に。"
  20: "第二[だいに]の側[がわ]、南[みなみ]の側[がわ]にも二十[にじゅう]枚[まい]の板[いた]を造[つく]れ。"
  21: "その四十[よんじゅう]の銀[ぎん]の台座[だいざ]も。一枚[いちまい]の板[いた]に二[ふた]つの台座[だいざ]を、その両側[りょうがわ]に。もう一枚[いちまい]の板[いた]にも二[ふた]つの台座[だいざ]を。"
  22: "幕屋[まくや]の後[うし]ろ、海[うみ]の側[がわ]には六枚[ろくまい]の板[いた]を造[つく]れ。"
  23: "幕屋[まくや]の後[うし]ろの隅[すみ]には二枚[にまい]の板[いた]を造[つく]れ。"
  24: "それらは下[した]では同[おな]じになり、上[うえ]でも同[おな]じになって、一[ひと]つの結[むす]びに合[あ]う。二[ふた]つの隅[すみ]ともそのように造[つく]れ。それらは等[ひと]しくある。"
  25: "八枚[はちまい]の板[いた]と、その銀[ぎん]の台座[だいざ]十六[じゅうろく]つ。一枚[いちまい]の板[いた]に二[ふた]つの台座[だいざ]、もう一枚[いちまい]の板[いた]にも二[ふた]つの台座[だいざ]。"
  26: "あなたはアカシアの木[き]で横木[よこぎ]を造[つく]れ。幕屋[まくや]の一方[いっぽう]の側[がわ]の板[いた]に五[いつ]つ造[つく]れ。"
  27: "もう一方[いっぽう]の側[がわ]の板[いた]に五[いつ]つ、幕屋[まくや]の後[うし]ろ、海[うみ]の側[がわ]の板[いた]に五[いつ]つ造[つく]れ。"
  28: "中間[ちゅうかん]の横木[よこぎ]は、板[いた]の真[ま]ん中[なか]を一方[いっぽう]の端[はし]から他方[たほう]の端[はし]まで通[とお]るようにせよ。"
  29: "あなたは板[いた]を金[きん]で覆[おお]い、板[いた]の環[かん]を金[きん]で造[つく]れ。横木[よこぎ]を通[とお]すためである。横木[よこぎ]も金[きん]で覆[おお]え。"
  30: "あなたは山[やま]であなたに示[しめ]された形[かたち]のとおりに幕屋[まくや]を立[た]てよ。」"
  31: "「あなたは青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸、撚[よ]った亜麻布[あまぬの]で垂[た]れ幕[まく]を造[つく]れ。織[お]り手[て]の技[わざ]でケルビムを織[お]り込[こ]め。"
  32: "あなたはそれを四本[よんほん]の柱[はしら]に掛[か]けよ。アカシアの木[き]の柱[はしら]で、金[きん]で覆[おお]われ、金[きん]の頭[かしら]があり、四[よっ]つの銀[ぎん]の台座[だいざ]がある。"
  33: "あなたは垂[た]れ幕[まく]を柱[はしら]に掛[か]け、垂[た]れ幕[まく]の内側[うちがわ]に証[あかし]の箱[はこ]を運[はこ]び入[い]れよ。垂[た]れ幕[まく]はあなたがたのために聖所[せいしょ]と至[し]聖所[せいしょ]とを分[わ]ける。"
  34: "あなたは至[し]聖所[せいしょ]で、証[あかし]の箱[はこ]を垂[た]れ幕[まく]で覆[おお]え。」"
  35: "「あなたは垂[た]れ幕[まく]の外[そと]に机[つくえ]を置[お]き、幕屋[まくや]の南[みなみ]の側[がわ]に、机[つくえ]に向[む]かい合[あ]わせて燭台[しょくだい]を置[お]け。机[つくえ]は幕屋[まくや]の北[きた]の側[がわ]に置[お]く。」"
  36: "「あなたは幕屋[まくや]の入口[いりぐち]のために、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸、撚[よ]った亜麻布[あまぬの]で幕[まく]を造[つく]れ。刺繍[ししゅう]師[し]の技[わざ]による。"
  37: "あなたはその幕[まく]のために五本[ごほん]の柱[はしら]を造[つく]り、金[きん]で覆[おお]い、金[きん]の頭[かしら]をつけよ。またそのために五[いつ]つの青銅[せいどう]の台座[だいざ]を鋳[い]て造[つく]れ。」"

notes:
  1: "σκηνή — 幕屋 (скиния). αὐλαία — 幕 (полог, полотнище; десять штук). βύσσος κεκλωσμένη — кручёный виссон (撚った亜麻布). ὑάκινθος — 青 (голубая шерсть), πορφύρα — 紫, κόκκινον — 緋. χερουβιμ ἐργασίᾳ ὑφάντου — херувимы «работой ткача», т.е. вытканы в полотне."
  2: "μῆκος … ὀκτὼ καὶ εἴκοσι πήχεων, εὖρος τεσσάρων πηχέων — 28 и 4 локтя; μέτρον τὸ αὐτό — «мера одна» (все пологи одинаковы)."
  3: "πέντε δὲ αὐλαῖαι … ἐξ ἀλλήλων ἐχόμεναι — пять пологов, держащихся друг за друга; сшиваются в два полотнища по пять."
  4: "ἀγκύλαι ὑακινθῖναι — петли из голубой (шерсти), 青の紐の輪; ἐπὶ τοῦ χείλους … εἰς τὴν συμβολὴν — у края, к соединению. εἰς τὴν συμβολὴν τῇ δευτέρᾳ — «к второму соединению»."
  5: "ἀντιπρόσωποι ἀντιπίπτουσαι ἀλλήλαις — «лицом к лицу, друг против друга», т.е. петли должны совпадать."
  6: "κρίκοι χρυσοῖ — золотые крючки (金の鉤); συνάψεις … καὶ ἔσται ἡ σκηνὴ μία — «и будет скиния одна»."
  7: "δέρρεις τρίχιναι — козьи покровы (букв. «волосяные»), 山羊の毛の天幕; σκέπη — покров. Одиннадцать штук — на один больше, чтобы закрывать стык."
  8: "30 и 4 локтя; так же «мера одна» для одиннадцати."
  9: "ἐπιδιπλώσεις τὴν δέρριν τὴν ἕκτην κατὰ πρόσωπον τῆς σκηνῆς — шестой покров удвоишь «к лицу скинии», т.е. он ляжет вдвое надо входом."
  10: "Пятьдесят петель на краю каждого из двух сшитых полотнищ."
  11: "κρίκοι χαλκοῖ — медные (青銅) крючки; ἔσται ἕν — «будет одно»."
  12: "τὸ πλεονάζον … τὸ ἥμισυ τῆς δέρρεως τὸ ὑπολελειμμένον — остаток, «половина оставшегося покрова», свисает сзади."
  13: "πῆχυν ἐκ τούτου καὶ πῆχυν ἐκ τούτου — по локтю с той и другой стороны из выступающей длины; ἔνθεν καὶ ἔνθεν — «отсюда и отсюда»."
  14: "κατακάλυμμα — покров; δέρματα κριῶν ἠρυθροδανωμένα — красные бараньи кожи; ἐπικαλύμματα δέρματα ὑακίνθινα — «синие кожи» (в евр. תחשׁ, по традиции じゅごんの皮; LXX передаёт цвет)."
  15: "στύλους τῇ σκηνῇ ἐκ ξύλων ἀσήπτων — LXX и слав. называют их «столпами» (στῦλοι, столпы), но по размерам (10×1,5 локтя, с шипами) это брусья-доски (евр. קרשים); в переводе 板, чтобы читатель не представил круглые столбы. ἄσηπτα — «негниющие» (アカシアの木)."
  16: "Десять локтей в длину, полтора в ширину — высота стены скинии."
  17: "ἀγκωνίσκοι — шипы, которыми брус входит в подножие (ほぞ); ἀντιπίπτοντας ἕτερον τῷ ἑτέρῳ — один против другого."
  18: "У LXX здесь «север» (πρὸς βορρᾶν), у масоретского текста и Синодального — юг; переводим по LXX, дальше (26:20) — юг."
  19: "βάσεις ἀργυραῖ — серебряные подножия (台座); LXX повторяет формулу «два подножия столпу одному по обе стороны его» дважды — повтор сохранён."
  20: "τὸ κλῖτος τὸ δεύτερον τὸ πρὸς νότον — вторая сторона, южная."
  21: "Сорок подножий на двадцать брусьев."
  22: "τὸ μέρος τὸ πρὸς θάλασσαν — «к морю», т.е. на запад (θάλασσα у LXX = западная сторона); в тексте оставлено 海の側."
  23: "δύο στύλους ἐπὶ τῶν γωνιῶν — два бруса на углах задней стороны."
  24: "ἐξ ἴσου κάτωθεν … ἴσοι ἐκ τῶν κεφαλίδων εἰς σύμβλησιν μίαν — снизу равны и сверху равны, сходясь в одно соединение; κεφαλίδες — верхние концы."
  25: "Восемь брусьев и шестнадцать подножий: по два на брус."
  26: "μοχλοί — шесты-засовы (横木), проходящие сквозь кольца; пять на одну сторону."
  27: "Пять на вторую сторону и пять на заднюю, «к морю» (запад)."
  28: "ὁ μοχλὸς ὁ μέσος — средний шест; διικνείσθω — пусть проходит насквозь от одного края до другого."
  29: "καταχρυσώσεις — обложишь золотом; δακτύλιοι — кольца (環) для шестов."
  30: "κατὰ τὸ εἶδος τὸ δεδειγμένον σοι ἐν τῷ ὄρει — по образу, показанному на горе."
  31: "καταπέτασμα — завеса (垂れ幕), отделяющая Святое святых; ἔργον ὑφαντόν — тканая работа, с херувимами."
  32: "Четыре столпа (κεχρυσωμένων χρυσίῳ — обложены золотом), κεφαλίδες — главы (金の頭), τέσσαρες βάσεις ἀργυραῖ — четыре серебряных подножия."
  33: "κιβωτὸς τοῦ μαρτυρίου — ковчег свидетельства (не «завета»: μαρτύριον, а не διαθήκη); διοριεῖ — разделит; ἅγιον и ἅγια τῶν ἁγίων — 聖所 и 至聖所."
  34: "κατακαλύψεις τῷ καταπετάσματι — «покрой завесой» ковчег в Святом святых (у Синодального иначе: «положи крышку»)."
  35: "τράπεζα — стол (机) с хлебами; λυχνία — светильник (燭台); ἀπέναντι — напротив. Стол — на северной стороне, светильник — на южной."
  36: "ἐπίσπαστρον — завеса входа (幕); ἔργον ποικιλτοῦ — работа вышивальщика (刺繍師)."
  37: "LXX называет завесу входа тем же словом καταπέτασμα, что и завесу 26:31; пять столпов, κεφαλίδες золотые, пять медных подножий (χωνεύσεις — отольёшь)."
