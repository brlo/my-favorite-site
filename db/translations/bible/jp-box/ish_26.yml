# jp-box, Исход, глава 26. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и русский Синодальный (ru). jp-joc для Исхода в базе нет (пустые строки).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 26: десять пологов скинии (1–6), козьи покровы (7–13), внешние покровы (14),
# брусья и подножия (15–30), завеса и Святое святых (31–34), стол и светильник (35),
# завеса входа (36–37). Размеры — по LXX (28×4, 30×4, 10×1,5 локтя; 20+20+6+2 бруса).
# Красного и синего нет: речь Бога — 「…」.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено bracket_check.rb).
# Сносок ⟨…⟩ нет: 幕屋, 垂れ幕, ケルビム, キュビト уже в корпусе или понятны.
# jp-ni не использовался.

