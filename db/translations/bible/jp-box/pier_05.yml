# jp-box, Плач Иеремии, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Плача нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5 — общая молитва народа (единственная глава книги не акростишная): 1 призыв
# вспомнить; 2–10 наследие у чужих, сиротство и вдовство, вода и дрова за плату,
# погоня в шею, Египет и Ассирия, отцы согрешили, рабы господствуют, хлеб с опасностью
# жизни, кожа как печь; 11–16 поругание жён и девиц, повешенные князья, юноши у жерновов,
# старцы у ворот, угасшая радость, павший венец; 17–18 сердце изныло, очи померкли,
# Сион опустел; 19–22 «Ты пребываешь во веки», «для чего забываешь нас», «обрати нас,
# и мы обратимся», «неужели совсем отверг».
# Нумерация по gr: 22 стиха, совпадает с csl и ru; «.» в главе нет.
# Слав. перед 5:1 стоит надписание «Молитва иеремии пророка» (в gr и в ru его нет):
# это рубрика, а не стих, поэтому в текст не внесена (как в 1 Пар 16:8); отмечена в notes 1.
# 「…」 нет: вся глава — молитва народа, а молитва в корпусе не берётся в кавычки
# (так Пс 79; 85), поэтому, хотя это прямая речь к Богу, кавычек в главе нет.
# Вложенной речи нет.
# 〔…〕 нет. Редакционных помет в скобках в слав. тексте этой главы нет.
# Сносок ⟨…⟩ нет: 嗣業, 寡婦, 孤児, 王座, 贖う уже в корпусе.
# Имена: シオン, ユダ, エジプト, アッシリア — по корпусу.

