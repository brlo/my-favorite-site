verses:
  1: "主[しゅ]よ、わたしたちに起[おこ]ったことを思[おも]い起[おこ]してください。目[め]を留[と]め、わたしたちの辱[はずかし]めをご覧[らん]ください。"
  2: "わたしたちの嗣業[しぎょう]は他[た]の者[もの]のものとなり、わたしたちの家[いえ]は異国[いこく]の者[もの]のものになった。"
  3: "わたしたちは孤児[こじ]となった。父[ちち]はいない。母[はは]たちは寡婦[かふ]のようである。"
  4: "わたしたちは水[みず]を銀[ぎん]で買[か]って飲[の]み、わたしたちのまきは代価[だいか]を払[はら]って手[て]に入[い]れた。"
  5: "わたしたちは首[くび]すじを追[お]い立[た]てられ、働[はたら]けども休[やす]めない。"
  6: "エジプトが手[て]を貸[か]し、アッシリアがわたしたちを満[み]たした。"
  7: "わたしたちの父[ちち]たちは罪[つみ]を犯[おか]したが、もういない。わたしたちが彼ら[かれら]の不法[ふほう]を負[お]っている。"
  8: "奴隷[どれい]たちがわたしたちを支配[しはい]している。彼ら[かれら]の手[て]からわたしたちを贖[あがな]い出[だ]す者[もの]はいない。"
  9: "わたしたちは荒野[こうや]の剣[つるぎ]を前[まえ]にして、命[いのち]がけでパンを持[も]ち帰[かえ]る。"
  10: "わたしたちの皮膚[ひふ]は炉[ろ]のように黒[くろ]く焼[や]け、飢[うえ]えの嵐[あらし]のゆえに縮[ちぢ]んだ。"
  11: "彼ら[かれら]はシオンで女[おんな]たちを辱[はずかし]め、ユダの都[みやこ]々[みやこ]で処女[おとめ]たちを辱めた。"
  12: "支配者[しはいしゃ]たちは彼ら[かれら]の手[て]で吊[つ]るされ、長老[ちょうろう]たちは敬[うやま]われなかった。"
  13: "選[えら]ばれた者[もの]たちは泣[な]き声[ごえ]をあげ、若者[わかもの]たちは木[き]の上[うえ]でよろめき倒[たお]れた。"
  14: "長老[ちょうろう]たちは門[もん]から退[しりぞ]き、選[えら]ばれた者[もの]たちはその歌[うた]をやめた。"
  15: "わたしたちの心[こころ]の喜[よろこ]びは消[き]え、踊[おど]りは嘆[なげ]きに変[か]わった。"
  16: "わたしたちの頭[あたま]の冠[かんむり]は落[お]ちた。ああ、わたしたちは災[わざわ]いだ。罪[つみ]を犯[おか]したからである。"
  17: "このゆえに、わたしたちの心[こころ]は痛[いた]み、このゆえに、わたしたちの目[め]は暗[くら]くなった。"
  18: "シオンの山[やま]が荒[あ]れ果[は]て、狐[きつね]がそこを行[ゆ]き交[か]うからである。"
  19: "しかし、主[しゅ]よ、あなたはとこしえに住[す]まわれる。あなたの王座[おうざ]は代[よ]々[よ]に及[およ]ぶ。"
  20: "なぜ、あなたはとこしえにわたしたちを忘[わす]れ、長[なが]い日[ひ]の間[あいだ]、わたしたちを捨[す]てておかれるのか。"
  21: "主[しゅ]よ、わたしたちをあなたへと立[た]ち返[かえ]らせてください。そうすれば、わたしたちは立[た]ち返[かえ]ります。わたしたちの日[ひ]々[び]を、昔[むかし]のように新[あら]たにしてください。"
  22: "あなたはわたしたちを退[しりぞ]けに退け、わたしたちに激[はげ]しく怒[いか]られたのだから。"

notes:
  1: "Μνήσθητι, κύριε, ὅ τι ἐγενήθη ἡμῖν — «вспомни, Господи, что стало с нами» (μιμνήσκομαι). ἐπίβλεψον καὶ ἰδὲ τὸν ὀνειδισμὸν ἡμῶν — «призри и увидь поношение наше» (ὀνειδισμός — 辱め). Слав. перед стихом ставит надписание «Молитва иеремии пророка» (Προσευχὴ Ιερεμιου) — рубрика, а не стих: в gr и в ru её нет, в текст не внесена (как слав. «Песнь» в 1 Пар 16:8); отмечена здесь. Глава не акростишная — букв евр. алфавита в слав. нет."
  2: "κληρονομία ἡμῶν μετεστράφη ἀλλοτρίοις — «наследие наше перешло к чужим» (κληρονομία — 嗣業, как по всему корпусу; μεταστρέφω — обращать, передавать). οἱ οἶκοι ἡμῶν ξένοις — «домы наши — иноплеменникам» (ξένος — 異国の者)."
  3: "ὀρφανοὶ ἐγενήθημεν, οὐχ ὑπάρχει πατήρ — «сиротами мы стали, нет отца» (ὀρφανός — 孤児). μητέρες ἡμῶν ὡς αἱ χῆραι — «матери наши — как вдовы» (χήρα — 寡婦, как в 1:1)."
  4: "Греч. строка испорчена: ἐξ ἡμερῶν ἡμῶν ξύλα ἡμῶν ἐν ἀλλάγματι ἦλθεν — «из дней наших дрова наши пришли за обмен» (ἐν ἀλλάγματι — в обмен). В евр. здесь «воду свою за серебро пили», и LXX прочитал מֵימֵינוּ («воды наши») как מִיָּמֵינוּ («из дней наших»); слав. даёт полное церковное чтение: «Воду нашу за сребро пихом, дрова наша за цену куповахом». По паритету церковное чтение внесено в основной текст без 〔…〕 (вода и дрова), вариант LXX отмечен здесь."
  5: "ἐπὶ τὸν τράχηλον ἡμῶν ἐδιώχθημεν — «по шее нашей нас гнали» (τράχηλος — 首; διώκω — гнать): 首すじを追い立てられ. ἐκοπιάσαμεν, οὐκ ἀνεπαύθημεν — «трудились, не отдохнули» (κοπιάω — 労する; ἀναπαύω — 休む): 働けども休めない."
  6: "Αἴγυπτος ἔδωκεν χεῖρα, Ασσουρ εἰς πλησμονὴν αὐτῶν — «Египет дал руку, Ассир — для насыщения их» (πλησμονή — 満たすこと): в LXX и слав. подлежащие — Египет и Ассирия (слав. «Египет даде руку, ассур в насыщение их»); в ru по МТ «протягиваем руку к Египтянам, к Ассириянам». Держим LXX/csl, буквально 手を貸し…満たした."
  7: "οἱ πατέρες ἡμῶν ἥμαρτον, οὐχ ὑπάρχουσιν — «отцы наши согрешили, их нет» (ὑπάρχω — быть, существовать). ἡμεῖς τὰ ἀνομήματα αὐτῶν ὑπέσχομεν — «мы беззакония их понесли» (ὑπέχω — подставлять, нести; ἀνόμημα — 不法). Стих стал поговоркой (ср. Иер 31:29; Иез 18:2), но здесь без иронии."
  8: "δοῦλοι ἐκυρίευσαν ἡμῶν — «рабы возгосподствовали над нами» (κυριεύω — 支配する). λυτρούμενος οὐκ ἔστιν ἐκ τῆς χειρὸς αὐτῶν — «нет избавляющего (искупающего) из руки их» (λυτρόω — 贖う)."
  9: "ἐν ταῖς ψυχαῖς ἡμῶν εἰσοίσομεν ἄρτον ἡμῶν — «с жизнями (душами) нашими внесём хлеб наш», т. е. с опасностью для жизни (ψυχή — 命). ἀπὸ προσώπου ῥομφαίας τῆς ἐρήμου — «от лица меча пустыни» (ῥομφαία — меч; ἔρημος — 荒野): 荒野の剣を前にして. Слав. «в душах наших носихом хлеб наш»."
  10: "τὸ δέρμα ἡμῶν ὡς κλίβανος ἐπελειώθη — «кожа наша, как печь, истончилась (обожглась)» (κλίβανος — 炉; πελειόω — доводить до конца, истончать; слав. «аки пещь обгоре»). συνεσπάσθησαν ἀπὸ προσώπου καταιγίδων λιμοῦ — «сжались от лица бурь голода» (συσπάω — сжимать; καταιγίς — 嵐): 飢えの嵐のゆえに縮んだ."
  11: "γυναῖκας ἐν Σιων ἐταπείνωσαν — «жён в Сионе смирили (обесчестили)» (ταπεινόω — смирять, здесь о поругании). παρθένους ἐν πόλεσιν Ιουδα — «девиц в городах Иуды» (παρθένος — 処女)."
  12: "ἄρχοντες ἐν χερσὶν αὐτῶν ἐκρεμάσθησαν — «князья руками их (врагов) повешены» (κρεμάννυμι — вешать): 吊るされ. πρεσβύτεροι οὐκ ἐδοξάσθησαν — «старцы не прославлены (не почтены)» (δοξάζω — прославлять, чтить): 敬われなかった, как в 4:16."
  13: "ἐκλεκτοὶ κλαυθμὸν ἀνέλαβον — «избранные приняли плач (стенание)» (ἀναλαμβάνω — брать, поднимать; κλαυθμός — 泣き声). νεανίσκοι ἐν ξύλῳ ἠσθένησαν — «юноши на дереве изнемогли» (ξύλον — дерево; слав. «в кладе изнемогоша»; в ru по МТ «падают под ношами дров»): тёмное место, держим LXX буквально 木の上でよろめき倒れた."
  14: "πρεσβῦται ἀπὸ πύλης κατέπαυσαν — «старцы от ворот прекратились (оставили)» (καταπαύω; πύλη — 門): у ворот сидели старейшины как суд. ἐκλεκτοὶ ἐκ ψαλμῶν αὐτῶν κατέπαυσαν — «избранные от песней своих прекратились» (ψαλμός — 歌): 歌をやめた."
  15: "κατέλυσεν χαρὰ καρδίας ἡμῶν — «разрушилась (прекратилась) радость сердца нашего» (καταλύω — разрушать, прекращать). ἐστράφη εἰς πένθος ὁ χορὸς ἡμῶν — «обратился в плач хоровод наш» (χορός — 踊り; πένθος — 嘆き)."
  16: "ἔπεσεν ὁ στέφανος τῆς κεφαλῆς ἡμῶν — «пал венец с головы нашей» (στέφανος — 冠). οὐαὶ δὴ ἡμῖν, ὅτι ἡμάρτομεν — «горе нам, ибо мы согрешили» (οὐαί — 災い): ああ、わたしたちは災いだ."
  17: "περὶ τούτου ἐγενήθη ὀδυνηρὰ ἡ καρδία ἡμῶν — «от сего стало болезненным (скорбным) сердце наше» (ὀδυνηρός — 痛む; повтор περὶ τούτου сохранён: このゆえに…このゆえに). περὶ τούτου ἐσκότασαν οἱ ὀφθαλμοὶ ἡμῶν — «от сего померкли глаза наши» (σκοτάζω — темнеть)."
  18: "ἐπ᾿ ὄρος Σιων, ὅτι ἠφανίσθη — «на горе Сион, ибо опустела» (ἀφανίζω). ἀλώπεκες διῆλθον ἐν αὐτῇ — «лисицы прошли по ней» (ἀλώπηξ — 狐): 狐が行き交う."
  19: "σὺ δέ, κύριε, εἰς τὸν αἰῶνα κατοικήσεις — «Ты же, Господи, в век (вовеки) обитаешь» (κατοικέω — 住む): とこしえに住まわれる. ὁ θρόνος σου εἰς γενεὰν καὶ γενεάν — «престол Твой в род и род» (γενεά — 代): 王座は代々に及ぶ. Перелом главы: вопреки запустению — вечность Бога."
  20: "ἵνα τί εἰς νεῖκος ἐπιλήσῃ ἡμῶν — «для чего в век (навсегда) забываешь нас» (ἐπιλανθάνομαι; νεῖκος здесь «вечность, победа», слав. «во веки»). καταλείψεις ἡμᾶς εἰς μακρότητα ἡμερῶν — «оставишь нас в долготу дней» (καταλείπω; μακρότης — 長い間)."
  21: "ἐπίστρεψον ἡμᾶς, κύριε, πρὸς σέ, καὶ ἐπιστραφησόμεθα — «обрати нас, Господи, к Тебе, и обратимся» (ἐπιστρέφω, повтор корня сохранён: 立ち返らせてください…立ち返ります; ср. 3:40). ἀνακαίνισον ἡμέρας ἡμῶν καθὼς ἔμπροσθεν — «обнови дни наши, как прежде» (ἀνακαινίζω — 新たにする): ключевой рефрен книги, та же формула, что у пророков о возвращении."
  22: "ὅτι ἀπωθούμενος ἀπώσω ἡμᾶς — «ибо, отвергая, Ты отверг нас» (cognatus: 退けに退け; ἀπωθέω). ὠργίσθης ἐφ᾿ ἡμᾶς ἕως σφόδρα — «прогневался на нас весьма» (ὀργίζομαι; σφόδρα — сильно): 激しく怒られた. ὅτι причинное: молитва кончается на отвержении — по букве текста; в синагогальном чтении после 22 повторяют 21, чтобы не кончать на проклятии (обычай отмечен, в текст не внесён)."
