verses:
  1: "アルタシャスタ王[おう]の治世[ちせい]に、わたしとともにバビロンから上[のぼ]って来[き]た者[もの]たちの、その父祖[ふそ]の家[いえ]の長[かしら]たちと系図[けいず]は次[つぎ]のとおりである。"
  2: "ピネハスの子[こ]らからはギルション。イタマルの子[こ]らからはダニエル。ダビデの子[こ]らからはハトス。"
  3: "シェカニヤの子[こ]ら、すなわちパロシュの子[こ]らからはザカリヤ。彼[かれ]とともに男[おとこ]は百五十人[ひゃくごじゅうにん]。"
  4: "パハト・モアブの子[こ]らからは、ザラヤの子[こ]エルヤナ。彼[かれ]とともに男[おとこ]は二百人[にひゃくにん]。"
  5: "ザトエスの子[こ]らからは、アジエルの子[こ]セヘニヤ。彼[かれ]とともに男[おとこ]は三百人[さんびゃくにん]。"
  6: "また、アディンの子[こ]らからは、ヨナタンの子[こ]オベト。彼[かれ]とともに男[おとこ]は五十人[ごじゅうにん]。"
  7: "また、エラムの子[こ]らからは、アテリヤの子[こ]イエシヤ。彼[かれ]とともに男[おとこ]は七十人[ななじゅうにん]。"
  8: "また、サファテヤの子[こ]らからは、ミカエルの子[こ]ザブデヤ。彼[かれ]とともに男[おとこ]は八十人[はちじゅうにん]。"
  9: "また、ヨアブの子[こ]らからは、イエヒエルの子[こ]アバデヤ。彼[かれ]とともに男[おとこ]は二百十八人[にひゃくじゅうはちにん]。"
  10: "また、バアニの子[こ]らからは、ヨセフヤの子[こ]サリムト。彼[かれ]とともに男[おとこ]は百六十人[ひゃくろくじゅうにん]。"
  11: "また、バビの子[こ]らからは、バビの子[こ]ザカリヤ。彼[かれ]とともに男[おとこ]は二十八人[にじゅうはちにん]。"
  12: "また、アスガドの子[こ]らからは、アカタンの子[こ]ヨハナン。彼[かれ]とともに男[おとこ]は百十人[ひゃくじゅうにん]。"
  13: "また、アドニカムの子[こ]らからは最後[さいご]の者[もの]たちで、その名[な]はアリファラト、イエヒエル、サマヤ。彼[かれ]らとともに男[おとこ]は六十人[ろくじゅうにん]。"
  14: "また、バゴの子[こ]らからはウタイとザブド。彼[かれ]らとともに男[おとこ]は七十人[ななじゅうにん]。"
  15: "わたしは彼[かれ]らを、アウエへ流[なが]れ込[こ]む川[かわ]のほとりに集[あつ]めた。そこに三日間[みっかかん]宿営[しゅくえい]した。わたしは民[たみ]と祭司[さいし]たちを調[しら]べたが、レビ人[びと]の子[こ]らはそこに一人[ひとり]も見[み]つからなかった。"
  16: "わたしはエレアザル、アリエル、サマヤ、アロナム、ヤリブ、エルナタン、ナタン、ザカリヤ、メシュラムという名[な]の者[もの]たちと、ヨアリブ、エルナタンを、悟[さと]りのある者[もの]たちとして遣[つか]わした。"
  17: "わたしは彼[かれ]らを、カスフィヤの地[ち]の長[かしら]アダイのもとへやった。そして、わたしの神[かみ]の家[いえ]のために歌[うた]い手[て]たちを連[つ]れて来[く]るよう、アダイと、カスフィヤの地[ち]にいる彼[かれ]の兄弟[きょうだい]である神殿[しんでん]のしもべたちに語[かた]るべき言葉[ことば]を、彼[かれ]らの口[くち]に置[お]いた。"
  18: "わたしたちの神[かみ]の手[て]がわたしたちの上[うえ]に良[よ]かったので、彼[かれ]らはわたしたちのもとに、マフリの子[こ]、レビの子[こ]、イスラエルの子[こ]のうちから、サホンという名[な]の者[もの]、またシェレビヤと、その子[こ]らおよび兄弟[きょうだい]たち十八人[じゅうはちにん]を連[つ]れて来[き]た。"
  19: "また、メラリの子[こ]らから、アサビヤとイエシヤ、およびその兄弟[きょうだい]たちと子[こ]らたち、二十人[にじゅうにん]。"
  20: "また、ダビデとその長[かしら]たちがレビ人[びと]の奉仕[ほうし]のために与[あた]えた神殿[しんでん]のしもべたちのうちから、二百二十人[にひゃくにじゅうにん]。彼[かれ]らは皆[みな]、名[な]によって記[しる]されていた。"
  21: "わたしはそこで、アウエの川[かわ]のほとりで断食[だんじつ]を布告[ふこく]した。わたしたちの神[かみ]の前[まえ]でへりくだり、自分[じぶん]たちと子[こ]どもたち、およびすべての財産[ざいさん]のために良[よ]い道[みち]を神に求[もと]めるためであった。"
  22: "わたしは王[おう]に、道中[どうちゅう]で敵[てき]から守[まも]るための軍隊[ぐんたい]と騎兵[きへい]を求[もと]めるのを恥[は]じたからである。わたしたちは王[おう]に、「わたしたちの神[かみ]の手[て]は、神を求[もと]めるすべての者[もの]に良[よ]く、その力[ちから]と怒[いか]りは、神を見捨[みす]てるすべての者[もの]の上[うえ]にある」と語[かた]っていたからである。"
  23: "そこでわたしたちは断食[だんじつ]して、このことについてわたしたちの神[かみ]に願[ねが]った。すると神はわたしたちの願[ねが]いを聞[き]き入[い]れられた。"
  24: "わたしは祭司[さいし]たちの長[かしら]たちのうちから十二人[じゅうににん]を選[えら]び分[わ]けた。すなわちシェレビヤ、アサビヤ、および彼[かれ]らとともに、その兄弟[きょうだい]たちのうちから十人[じゅうにん]である。"
  25: "わたしは、王[おう]とその顧問[こもん]たち、その長[かしら]たち、およびそこにいたすべてのイスラエル人[じん]がささげた、わたしたちの神[かみ]の家[いえ]の初穂[はつほ]の銀[ぎん]、金[きん]、器[うつわ]を量[はか]って彼[かれ]らに渡[わた]した。"
  26: "わたしは彼[かれ]らの手[て]に量[はか]って渡[わた]した。銀[ぎん]六百五十[ろっぴゃくごじゅう]タラント、銀[ぎん]の器[うつわ]百[ひゃく]、金[きん]百[ひゃく]タラント、"
  27: "また、金[きん]の杯[さかずき]二十[にじゅう]で千[せん]ドラクマ、および金[きん]のように尊[とうと]い、よく磨[みが]かれた良質[りょうしつ]の青銅[せいどう]のさまざまな器[うつわ]。"
  28: "わたしは彼[かれ]らに言[い]った。「あなたがたは主[しゅ]に聖[せい]なる者[もの]であり、器[うつわ]も聖[せい]なるものである。銀[ぎん]と金[きん]は、あなたがたの父祖[ふそ]の神[かみ]である主[しゅ]への自発[じはつ]のささげ物[もの]である。"
  29: "エルサレムで、祭司[さいし]たちとレビ人[びと]たちの長[かしら]たち、およびイスラエルの父祖[ふそ]の家[いえ]の長[かしら]たちの前[まえ]で、主[しゅ]の家[いえ]の幕屋[まくや]で、これを量[はか]って渡[わた]すまで、警戒[けいかい]して守[まも]りなさい。」"
  30: "祭司[さいし]たちとレビ人[びと]たちは、量[はか]られた銀[ぎん]、金[きん]、器[うつわ]を受[う]け取[と]り、エルサレムにあるわたしたちの神[かみ]の家[いえ]へ運[はこ]ぶことにした。"
  31: "第一[だいいち]の月[つき]の十二日[じゅうににち]、わたしたちはアウエの川[かわ]からエルサレムへ向[む]けて出発[しゅっぱつ]した。わたしたちの神[かみ]の手[て]がわたしたちの上[うえ]にあり、道中[どうちゅう]で敵[てき]や仇敵[きゅうてき]の手[て]からわたしたちを救[すく]い出[だ]した。"
  32: "わたしたちはエルサレムに着[つ]き、そこに三日間[みっかかん]とどまった。"
  33: "四日目[よっかめ]に、わたしたちの神[かみ]の家[いえ]で、銀[ぎん]、金[きん]、器[うつわ]を量[はか]って、祭司[さいし]メレモト、すなわちウリヤの子[こ]の手[て]に渡[わた]した。彼[かれ]とともにエレアザル、すなわちピネハスの子[こ]、また彼[かれ]らとともにレビ人[びと]ヨザバド、すなわちイエシュアの子[こ]、およびノアデヤ、すなわちバナヤの子[こ]がいた。"
  34: "すべては数[かず]と重[おも]さによって確[たし]かめられ、その重[おも]さはすべて書[か]き記[しる]された。"
  35: "その時[とき]、捕囚[ほしゅう]から帰[かえ]った者[もの]たち、すなわち移住[いじゅう]の子[こ]らは、イスラエルの神[かみ]に燔祭[はんさい]をささげた。すなわち、イスラエル全部[ぜんぶ]のために雄牛[おうし]十二頭[じゅうにとう]、雄羊[おひつじ]九十六頭[きゅうじゅうろくとう]、子羊[こひつじ]七十七頭[ななじゅうななとう]、罪[つみ]の献[ささ]げ物[もの]として雄山羊[おやぎ]十二頭[じゅうにとう]。これらはすべて主[しゅ]への燔祭[はんさい]である。"
  36: "彼[かれ]らは王[おう]の命令[めいれい]を、王[おう]の管理[かんり]者[しゃ]たちと川向[かわむ]こうの知事[ちじ]たちに渡[わた]した。すると彼[かれ]らは民[たみ]と神[かみ]の家[いえ]を尊[とうと]んだ。"

notes:
  1: "οἱ ἄρχοντες πατριῶν αὐτῶν — главы отцов их, т. е. родов (πατριά); οἱ ὁδηγοί — вожди (ὁδηγός; слав. «вождеве»); ἀναβαίνοντες μετ᾿ ἐμοῦ — восходящие со мной; ἐν βασιλείᾳ Αρτασασθα τοῦ βασιλέως Βαβυλῶνος — в царствование Артаксеркса, царя Вавилонского (так в LXX)."
  2: "ἀπὸ υἱῶν Φινεες Γηρσωμ — из сыновей Финееса Гирсон (Γηρσωμ — ギルション; слав. «гирсон»); Ιθαμαρ — Ифамар (イタマル); Δανιηλ — Даниил (ダニエル); Δαυιδ — Давид (ダビデ); Ατους — Хаттуш (ハトス; слав. «аттус»). Список — главы родов, шедшие с Ездрой."
  3: "Σαχανια — Шехания (シェカニヤ). Двойное ἀπὸ υἱῶν: «из сыновей Шехании, из сыновей Пароша» — Захария принадлежит к роду Пароша; Φορος — Парош (フォロス; слав. «форосов»); τὸ σύστρεμμα — «собрание, отряд», здесь список (слав. «мужей»); ἑκατὸν καὶ πεντήκοντα — 150 мужского пола (τὰ ἀρσενικά)."
  4: "Φααθμωαβ — Пахаф-Моав (パハト・モアブ); Ελιανα — Эльегоенай (エルヤナ; слав. «елиана»); Ζαραια — Зерахия (ザラヤ); διακόσιοι — 200."
  5: "Ζαθοης — Затфу (ザトエス; слав. «зафоисовых»); Σεχενιας — Шехания (セヘニヤ); Αζιηλ — Яхазиил (アジエル; слав. «азиилев»); τριακόσιοι — 300."
  6: "Αδιν — Адин (アディン); Ωβηθ — Евед (オベト; слав. «овин»); Ιωναθαν — Ионафан (ヨナタン); πεντήκοντα — 50."
  7: "Ηλαμ — Елам (エラム); Ιεσια — Иешаия (イエシヤ; слав. «исаиа»); Αθελια — Афалия (アテリヤ; слав. «афелиин»); ἑβδομήκοντα — 70."
  8: "Σαφατια — Сафатия (サファテヤ); Ζαβδια — Зевадия (ザブデヤ); Μιχαηλ — Михаил (ミカエル); ὀγδοήκοντα — 80."
  9: "Ιωαβ — Иоав (ヨアブ); Αβαδια — Овадия (アバデヤ); Ιιηλ — Иехиил (イエヒエル); διακόσιοι δέκα ὀκτώ — 218."
  10: "Βαανι — Бааний (バアニ); Σαλιμουθ — Шеломиф (サリムト; слав. «селимуф»); Ιωσεφια — Иосифия (ヨセフヤ; слав. «иосефиев»); ἑκατὸν ἑξήκοντα — 160."
  11: "Βαβι — Бевай (バビ); Ζαχαρια — Захария (ザカリヤ); υἱὸς Βαβι — «сын Бевая» (в LXX повтор имени); в LXX ἑβδομήκοντα ὀκτώ — 78, в csl «двадесять осмь» — 28; принято csl (28), вариант LXX в сноске. Синод. по евр. также 28."
  12: "Ασγαδ — Азгад (アスガド); Ιωαναν — Иоханан (ヨハナン); Ακαταν — Гаккатан (アカタン; слав. «икатанов»); ἑκατὸν δέκα — 110."
  13: "Αδωνικαμ — Адоникам (アドニカム); ἔσχατοι — последние (в роде); Αλιφαλατ — Елифелет (アリファラト; слав. «едифалаф»); Ιιηλ — Иеиел (イエヒエル); Σαμαια — Шемаия (サマヤ); ἑξήκοντα — 60."
  14: "Βαγο — Бигвай (バゴ); Ουθι — Уфай (ウタイ; слав. «уфай»); csl добавляет второе имя «Завуд» (ザブド), которого в LXX нет, — принято csl; ἑβδομήκοντα — 70."
  15: "πρὸς τὸν ποταμὸν τὸν ἐρχόμενον πρὸς τὸν Ευι — к реке, текущей к Еви (в LXX здесь Ευι; в 8:21, 31 — Αουε, アウエ; слав. «евии»/«ауи»); παρενεβάλομεν — расположились станом (παρεμβάλλω); συνῆκα ἐν τῷ λαῷ — «понял в народе», т. е. осмотрел, сделал смотр; ἀπὸ υἱῶν Λευι οὐχ εὗρον — из сыновей Левия не нашёл."
  16: "ἀπέστειλα τῷ Ελεαζαρ — послал к Елеазару (дат.); Αριηλ — Ариэл (アリエル); Σαμαια — Шемаия (サマヤ); Αλωναμ — Элнафан (アロナム; слав. «маонану»); Ιαριβ — Иарив (ヤリブ); Ελναθαν — Элнафан (エルナタン); Ναθαν — Нафан (ナタン); Μεσουλαμ — Мешуллам (メシュラム); ἄνδρας — мужей; Ιωαριβ — Иоарив (ヨアリブ); συνίοντας — разумеющих, смышлёных (συνίημι; слав. «премудрых»)."
  17: "ἐπὶ ἄρχοντος ἐν ἀργυρίῳ τοῦ τόπου — тёмное место: «к начальнику в серебре места»; csl понял как имя «Адай» (アダイ) и «место Касфиа» (カスフィヤ) — принято csl; в LXX имени нет; λόγους λαλῆσαι — слова, чтобы говорить; τοὺς ἀδελφοὺς αὐτῶν τοὺς ναθινιμ — братьев их, храмовых служителей (神殿のしもべたち); ἐνέγκαι ἡμῖν ᾄδοντας — привести нам певцов (ᾄδω; в LXX «поющих», у csl и Синод. «служителей»)."
  18: "ἀνὴρ σαχωλ — «человек разумный» (σαχωλ, вероятно, евр. «разум»); csl передал как имя «сахон» (サホン) — принято csl; ἀπὸ υἱῶν Μοολι — из сыновей Махлия (マフリ); καὶ ἀρχὴν ἤλθοσαν — «и пришли начальствующие»; csl добавляет имя «Саравия» (シェレビヤ; Шеревия), которого в LXX нет, — принято; ὀκτωκαίδεκα — 18."
  19: "Ασεβια — Хашавия (アサビヤ); Ωσαιαν — Иешаия (イエシヤ); ἀπὸ υἱῶν Μεραρι — из сыновей Мерари (メラリ); ἀδελφοὶ αὐτοῦ καὶ υἱοὶ αὐτῶν — братья его и сыновья их; εἴκοσι — 20."
  20: "ναθινιμ — нефинеи, храмовые служители (神殿のしもべたち; слав. «нафиними»); οὓς ἔδωκεν Δαυιδ — которых дал Давид; εἰς δουλείαν τῶν Λευιτῶν — на службу левитам; διακόσιοι καὶ εἴκοσι — 220; ἐν ὀνόμασιν — по именам."
  21: "ἐκάλεσα νηστείαν — «созвал пост», провозгласил (καλέω); ἐπὶ τὸν ποταμὸν Αουε — у реки Агавы (Αουε — アウエ; слав. «ауи»); ταπεινωθῆναι — смириться (ταπεινόω); ὁδὸν εὐθεῖαν — прямой, благополучный путь; κτῆσις — имущество, стяжание."
  22: "ᾐσχύνθην αἰτήσασθαι — устыдился просить (αἰσχύνομαι, αἰτέω); δύναμιν καὶ ἱππεῖς — войско и всадников (ἱππεύς); σῶσαι — спасти; εἴπαμεν τῷ βασιλεῖ λέγοντες — сказали царю, говоря; χεὶρ τοῦ θεοῦ … εἰς ἀγαθόν — рука Бога на всех ищущих Его во благо; κράτος καὶ θυμὸς αὐτοῦ — сила и гнев Его; ἐγκαταλείποντας — оставляющих (ἐγκαταλείπω)."
  23: "ἐνηστεύσαμεν καὶ ἐζητήσαμεν — постились и искали, просили (ζητέω); ἐπήκουσεν ἡμῖν — услышал нас (ἐπακούω); csl «молихомся» — молились."
  24: "διέστειλα — отделил, выделил (διαστέλλω); ἀπὸ ἀρχόντων τῶν ἱερέων δώδεκα — из начальствующих священников двенадцать; Σαραια — Шеревия (シェレビヤ; слав. «сараию»); Ασαβια — Хашавия (アサビヤ); δέκα — десять."
  25: "ἔστησα αὐτοῖς — «поставил им», вверил; ἀπαρχὴ οἴκου θεοῦ — начатки дома Божия (ἀπαρχή, 初穂); ἃ ὕψωσεν — которые вознёс, пожертвовал (ὑψόω); οἱ εὑρισκόμενοι — находившиеся (слав. «обретаяйся»)."
  26: "ἔστησα ἐπὶ χεῖρας αὐτῶν — «поставил на руки их», вверил; ἀργυρίου τάλαντα ἑξακόσια καὶ πεντήκοντα — 650 талантов серебра; σκεύη ἀργυρᾶ ἑκατὸν — сто серебряных сосудов; τάλαντα χρυσίου ἑκατὸν — сто талантов золота."
  27: "καφουρη χρυσοῖ εἴκοσι — двадцать золотых чаш (καφουρή — перс. слово, «чаша»; 杯); εἰς τὴν ὁδὸν χαμανιμ χίλιοι — тёмное: «в путь хаманим тысяча»; csl передал как «драхм тысящу» (千ドラクマ) — принято csl; ср. Синод. «в тысячу драхм»; σκεύη χαλκοῦ στίλβοντος ἀγαθοῦ — сосуды блестящей хорошей меди (στίλβω — блестеть); διάφορα ἐπιθυμητά — различные, драгоценные; ἐν χρυσίῳ — «в золоте», т. е. ценимые как золото."
  28: "ἅγιοι τῷ κυρίῳ — святы Господу; τὰ σκεύη ἅγια — сосуды святы; ἑκούσια — добровольные даяния; τῷ κυρίῳ θεῷ πατέρων ὑμῶν — Господу Богу отцов ваших."
  29: "ἀγρυπνεῖτε καὶ τηρεῖτε — бодрствуйте и храните (ἀγρυπνέω, τηρέω); ἕως στῆτε — доколе не предстанете, не сдадите; ἐνώπιον ἀρχόντων τῶν ἱερέων — пред начальствующими священников; ἐν σκηναῖς οἴκου κυρίου — в скиниях дома Господня (σκηνή; слав. «во скиниих»), т. е. в хранилищах при доме."
  30: "ἐδέξαντο — приняли (δέχομαι); σταθμὸν τοῦ ἀργυρίου — вес серебра (σταθμός); ἐνεγκεῖν εἰς Ιερουσαλημ — отнести в Иерусалим."
  31: "ἐξήραμεν — «поднялись», выступили (ἐξαίρω); ἐν τῇ δωδεκάτῃ τοῦ μηνὸς τοῦ πρώτου — в двенадцатый день первого месяца; ἐρρύσατο ἡμᾶς — избавил нас (ῥύομαι); ἐκ χειρὸς ἐχθροῦ καὶ πολεμίου — от руки врага и неприятеля; ἐν τῇ ὁδῷ — на пути."
  32: "ἤλθομεν … ἐκαθίσαμεν — пришли и пробыли (καθίζω — сесть, остаться); ἡμέρας τρεῖς — три дня."
  33: "ἐγενήθη τῇ ἡμέρᾳ τῇ τετάρτῃ — было в четвёртый день; ἐστήσαμεν — поставили, сдали весом; ἐπὶ χεῖρα Μεριμωθ — на руки Меремофу (Μεριμωθ — メレモト; слав. «маримофа»); υἱοῦ Ουρια — сына Урии (ウリヤ); Ελεαζαρ υἱὸς Φινεες — Елеазар, сын Финееса; Ιωζαβαδ υἱὸς Ἰησοῦ — Иозавад, сын Иисуса (イエシュア); Νωαδια υἱὸς Βαναια — Ноадия, сын Ванеи (ノアデヤ, バナヤ; слав. «ноадиа сын ванаиев»)."
  34: "ἐν ἀριθμῷ καὶ ἐν σταθμῷ — по числу и весу; ἐγράφη πᾶς ὁ σταθμός — записан весь вес; ἐν τῷ καιρῷ ἐκείνῳ — «в то время»: в LXX стоит в конце ст. 34, csl относит к началу ст. 35 («Во время то»); принято csl — その時 в ст. 35."
  35: "οἱ ἐλθόντες ἀπὸ τῆς αἰχμαλωσίας — пришедшие из плена (αἰχμαλωσία); υἱοὶ τῆς παροικίας — сыны пришельства (παροικία; слав. «сынове преселения»); ὁλοκαυτώσεις — всесожжения (燔祭); μόσχοι δώδεκα — 12 тельцов; κριοὶ ἐνενήκοντα ἕξ — 96 баранов; ἀμνοὶ ἑβδομήκοντα ἑπτά — 77 агнцев; χίμαροι περὶ ἁμαρτίας δώδεκα — 12 козлов за грех; τὰ πάντα ὁλοκαυτώματα — всё это всесожжения."
  36: "νόμισμα τοῦ βασιλέως — «монета царя»; здесь, вероятно, «царский указ» (νόμισμα — монета, установление); csl «повеление царево» — принято; διοικηταί — правители, сатрапы (管理する者); ἐπάρχοις πέραν τοῦ ποταμοῦ — заречным начальникам; ἐδόξασαν — прославили, почтили (δοξάζω); τὸν λαὸν καὶ τὸν οἶκον τοῦ θεοῦ — народ и дом Божий."
