verses:
  1: "これらの言葉[ことば]をすべて語[かた]り終[お]えたイエスは、弟子[でし]たちに言[い]われた。"
  2: "「<j>あなたがたが知[し]っているとおり、二日後[ふつかご]には過越祭[すぎこしまつり]⟨エジプト脱出[だっしゅつ]を記念[きねん]するユダヤの祭[まつ]り。除酵祭[じょこうさい]は、それに続[つづ]いてパン種[だね]のないパンを食[た]べる祭[まつ]り。⟩になる。人[ひと]の子[こ]は十字架[じゅうじか]につけられるために引[ひ]き渡[わた]される。</j>」"
  3: "そのとき、祭司長[さいしちょう]たちと民[たみ]の長老[ちょうろう]たちは、カヤパという大祭司[だいさいし]⟨最高法院[さいこうほういん]の長[ちょう]を務[つと]める祭司[さいし]。⟩の屋敷[やしき]の庭[にわ]に集[あつ]まった。"
  4: "そして、計略[けいりゃく]を巡[めぐ]らしてイエスを捕[と]らえ、殺[ころ]そうと相談[そうだん]した。"
  5: "ただ、彼[かれ]らはこう言[い]っていた。「祭[まつ]りの期間[きかん]はよそう。民[たみ]が騒[さわ]ぎ立[た]つといけないから」。"
  6: "さて、イエスはベタニアに来[き]ておられた。重[おも]い皮膚病[ひふびょう]の人[ひと]シモンの家[いえ]でのことである。"
  7: "食事[しょくじ]の席[せき]に着[つ]いておられたとき、一人[ひとり]の女[おんな]が、高価[こうか]な香油[こうゆ]の入[はい]った石膏[せっこう]の壺[つぼ]を持[も]って近[ちか]づき、イエスの頭[あたま]に注[そそ]ぎかけた。"
  8: "弟子[でし]たちはそれを見[み]て憤[いきどお]り、「何[なん]のためにこんな無駄遣[むだづか]いをしたのか。"
  9: "この香油[こうゆ]は高[たか]い値[ね]で売[う]って、その金[かね]を貧[まず]しい人々[ひとびと]に施[ほどこ]すこともできたのに」と言[い]った。"
  10: "イエスはそのことを知[し]って、彼[かれ]らに言[い]われた。「<j>なぜ、この女[おんな]を煩[わずら]わすのか。わたしによいことをしてくれたのだ。</j>"
  11: "<j>貧[まず]しい人々[ひとびと]なら、いつでもあなたがたのそばにいる。だが、わたしはいつでもそばにいるのではない。</j>"
  12: "<j>この女[おんな]がわたしの体[からだ]にこの香油[こうゆ]を注[そそ]いだのは、わたしを葬[ほうむ]る用意[ようい]のためだったのだ。</j>"
  13: "<j>はっきり言[い]っておく。世界中[せかいじゅう]のどこでこの福音[ふくいん]が宣[の]べ伝[つた]えられても、この女[おんな]のしたことは、彼女[かのじょ]の記念[きねん]として語[かた]り伝[つた]えられる。</j>」"
  14: "さて、十二人[じゅうににん]の一人[ひとり]、イスカリオテのユダが、祭司長[さいしちょう]たちのもとへ出[で]かけて行[い]った。"
  15: "そして言[い]った。「わたしがあなたがたに引[ひ]き渡[わた]せば、何[なに]をくれますか。」彼[かれ]らは銀[ぎん]三十枚[さんじゅうまい]を量[はか]って与[あた]えることを約束[やくそく]した。"
  16: "それからユダは、イエスを引[ひ]き渡[わた]す機会[きかい]をうかがい始[はじ]めた。"
  17: "さて、除酵祭[じょこうさい]の初[はじ]めの日[ひ]になった。弟子[でし]たちがイエスのそばに寄[よ]って来[き]て尋[たず]ねた。「過越[すぎこし]の食事[しょくじ]の用意[ようい]は、どこでいたしましょうか。」"
  18: "イエスは言[い]われた。「<j>都[みやこ]へ行[い]って、ある人[ひと]にこう言[い]いなさい。『先生[せんせい]が、「わたしの時[とき]は近[ちか]づいた。あなたのところで、弟子[でし]たちと一緒[いっしょ]に過越[すぎこし]の食事[しょくじ]をする」と言[い]っています』。</j>」"
  19: "弟子[でし]たちはイエスが言[い]われたとおりに、過越[すぎこし]の食事[しょくじ]の用意[ようい]を整[ととの]えた。"
  20: "夕方[ゆうがた]になると、イエスは十二人[じゅうににん]とともに食卓[しょくたく]に着[つ]かれた。"
  21: "食事[しょくじ]の席[せき]で、イエスは言[い]われた。「<j>はっきり言[い]っておく。あなたがたの中[なか]の一人[ひとり]が、わたしを裏切[うらぎ]るのだ。</j>」"
  22: "彼[かれ]らはひどく悲[かな]しみ、一人[ひとり]ひとりが「主[しゅ]よ、まさかわたしでは」と言[い]い始[はじ]めた。"
  23: "イエスは答[こた]えて言[い]われた。「<j>わたしと一緒[いっしょ]に手[て]を鉢[はち]に浸[ひた]す者[もの]が、わたしを裏切[うらぎ]る。</j>"
  24: "<j>人[ひと]の子[こ]は、自分[じぶん]について書[か]かれているとおりに去[さ]って行[く]。しかし、人[ひと]の子[こ]を裏切[うらぎ]るその人[ひと]は災[わざわ]いだ。その人[ひと]は生[う]まれなかったなら、それでよかったのだ。</j>」"
  25: "イエスを裏切[うらぎ]ろうとしていたユダが、「先生[せんせい]、まさかわたしでは」と言[い]った。イエスは言[い]われた。「<j>あなたが言[い]ったとおりだ。</j>」"
  26: "食事[しょくじ]の最中[さいちゅう]、イエスはパン[ぱん]を取[と]り、賛美[さんび]の祈[いの]りを唱[とな]えてからそれを裂[さ]き、弟子[でし]たちに手渡[てわた]して言[い]われた。「<j>取[と]って食[た]べなさい。これはわたしの体[からだ]である。</j>」"
  27: "次[つぎ]に、杯[さかずき]を取[と]って感謝[かんしゃ]の祈[いの]りを唱[とな]え、彼[かれ]らに渡[わた]しながら言[い]われた。「<j>あなたがたは皆[みな]、この杯[さかずき]から飲[の]みなさい。</j>"
  28: "<j>これは〔新[あたら]しい〕契約[けいやく]のわたしの血[ち]であり、罪[つみ]の赦[ゆる]しのために、多[おお]くの人[ひと]のために流[なが]される。</j>"
  29: "<j>あなたがたに言[い]っておく。今[いま]からは、父[ちち]の国[くに]であなたがたと共[とも]に新[あたら]しいものを飲[の]むその日[ひ]まで、わたしはぶどうの実[み]から造[つく]ったものを飲[の]まない。</j>」"
  30: "一同[いちどう]は賛美[さんび]を歌[うた]い終[お]えると、オリーブ山[やま]の方[ほう]へ出[で]て行[い]った。"
  31: "そのとき、イエスは弟子[でし]たちに告[つ]げられた。「<j>今夜[こんや]、あなたがたは皆[みな]、わたしにつまずく。『わたしが羊飼[ひつじか]いを打[う]つと、群[む]れの羊[ひつじ]は散[ち]らされる』と書[か]いてあるからだ。</j>"
  32: "<j>だが、復活[ふっかつ]した後[あと]、わたしはあなたがたより先[さき]にガリラヤへ向[む]かう。</j>」"
  33: "すると、ペトロが答[こた]えて言[い]った。「たとえ皆[みな]があなたにつまずいても、わたしは決[けっ]してつまずきません。」"
  34: "イエスはペトロに語[かた]られた。「<j>はっきり言[い]っておく。今夜[こんや]、鶏[にわとり]が鳴[な]く前[まえ]に、あなたは三度[さんど]、わたしを知[し]らないと言[い]うだろう。</j>」"
  35: "ペトロは言[い]った。「たとえ、あなたと一緒[いっしょ]に死[し]ななければならなくなっても、あなたを知[し]らないなどとは言[い]いません。」弟子[でし]たちも皆[みな]、同[おな]じように言[い]った。"
  36: "それから、イエスは弟子[でし]たちと一緒[いっしょ]に、ゲツセマネという所[ところ]へ来[こ]られた。そして弟子[でし]たちに言[い]われた。「<j>わたしが向[む]こうへ行[い]って祈[いの]るまで、ここに座[すわ]っていなさい。</j>」"
  37: "そして、ペトロとゼベダイの二人[ふたり]の子[こ]を伴[ともな]って、イエスは悲[かな]しみと苦[くる]しみに沈[しず]み始[はじ]められた。"
  38: "そして言[い]われた。「<j>わたしの魂[たましい]は死[し]ぬほどに悲[かな]しい。ここに留[とど]まって、わたしと共[とも]に目[め]を覚[さ]ましていなさい。</j>」"
  39: "イエスは少[すこ]し進[すす]んで行[い]き、顔[かお]を伏[ふ]せて祈[いの]られた。「<j>わたしの父[ちち]よ、できれば、この杯[さかずき]をわたしから過[す]ぎ去[さ]らせてください。しかし、わたしの思[おも]うとおりではなく、あなたの思[おも]われるとおりに。</j>」"
  40: "それから弟子[でし]たちのところへ戻[もど]って、眠[ねむ]っているのをご覧[らん]になると、ペトロに言[い]われた。「<j>このように、一時間[いちじかん]もわたしと一緒[いっしょ]に目[め]を覚[さ]ましていられなかったのか。</j>"
  41: "<j>誘惑[ゆうわく]に陥[おちい]らないように、目[め]を覚[さ]まして祈[いの]っていなさい。霊[れい]は進[すす]んでいても、肉体[にくたい]は弱[よわ]い。</j>」"
  42: "イエスは再[ふたた]び行[い]って祈[いの]られた。「<j>わたしの父[ちち]よ、これを飲[の]まないでは過[す]ぎ去[さ]らせることができないのなら、あなたの御心[みこころ]がなりますように。</j>」"
  43: "そして戻[もど]って来[き]てご覧[らん]になると、また眠[ねむ]っていた。彼[かれ]らの目[め]がひどく重[おも]かったからである。"
  44: "イエスは彼[かれ]らをそのままにして、また行[い]って、同[おな]じ言葉[ことば]で三度目[さんどめ]の祈[いの]りをされた。"
  45: "それから、弟子[でし]たちのところへ来[き]て言[い]われた。「<j>まだ眠[ねむ]って休[やす]んでいるのか。見[み]よ、時[とき]は近[ちか]づいた。人[ひと]の子[こ]は罪人[ざいにん]たちの手[て]に引[ひ]き渡[わた]される。</j>"
  46: "<j>立[た]ちなさい、行[い]こう。見[み]よ、わたしを裏切[うらぎ]る者[もの]が近[ちか]づいた。</j>」"
  47: "イエスがまだ話[はな]しておられるうちに、見[み]よ、十二人[じゅうににん]の一人[ひとり]、ユダがやって来[き]た。祭司長[さいしちょう]たちと民[たみ]の長老[ちょうろう]たちのもとから遣[つか]わされた大[おお]ぜいの群衆[ぐんしゅう]が、剣[けん]や棒[ぼう]を持[も]ってユダと一緒[いっしょ]に来[き]た。"
  48: "イエスを裏切[うらぎ]る者[もの]は、彼[かれ]らに合図[あいず]を決[き]めておいて、こう言[い]っていた。「わたしが接吻[せっぷん]するのが、その人[ひと]だ。捕[つか]まえなさい。」"
  49: "そして、すぐにイエスに近[ちか]づいて、「先生[せんせい]、喜[よろこ]んでください」と言[い]って接吻[せっぷん]した。"
  50: "イエスは彼[かれ]に言[い]われた。「<j>友[とも]よ、何[なん]のために来[き]たのか。</j>」そのとき、人々[ひとびと]はイエスに手[て]をかけて捕[と]らえた。"
  51: "すると、イエスと一緒[いっしょ]にいた一人[ひとり]が手[て]を伸[の]ばし、剣[けん]を抜[ぬ]いて大祭司[だいさいし]の僕[しもべ]を打[う]ち、その耳[みみ]を切[き]り落[と]した。"
  52: "そこで、イエスは彼[かれ]に言[い]われた。「<j>剣[けん]を元[もと]の所[ところ]へ戻[もど]しなさい。剣[けん]を取[と]る者[もの]は皆[みな]、剣[けん]で滅[ほろ]びるのだ。</j>"
  53: "<j>わたしが父[ちち]に願[ねが]えば、ただちに十二[じゅうに]軍団[ぐんたん]⟨ローマの軍隊[ぐんたい]の単位[たんい]。一軍団[いちぐんたん]は六千[ろくせん]人[にん]ほど。⟩を超[こ]える天使[てんし]たちを送[おく]ってくださると、あなたは思[おも]わないのか。</j>"
  54: "<j>だが、そうなれば、こうなるべきだと書[か]かれている聖書[せいしょ]の言葉[ことば]は、どうして実現[じつげん]するのか。</j>"
  55: "<j>まるで強盗[ごうとう]でも相手[あいて]にするかのように、剣[けん]や棒[ぼう]を持[も]ってわたしを捕[と]らえに来[き]たのか。わたしは日々[ひび]、神殿[しんでん]の境内[けいだい]に座[すわ]って教[おし]えていたのに、あなたがたはわたしを捕[と]らえなかった。</j>"
  56: "<j>しかし、このすべては、預言者[よげんしゃ]たちの書[しょ]いた聖書[せいしょ]の言葉[ことば]が実現[じつげん]するために起[お]こったのだ。</j>」そのとき、弟子[でし]たちは皆[みな]、イエスを置[お]いて逃[に]げた。"
  57: "イエスを捕[と]らえた者[もの]たちは、イエスを大祭司[だいさいし]カヤパのところへ連[つ]れて行[い]った。そこには律法学者[りっぽうがくしゃ]たちと長老[ちょうろう]たちが集[あつ]まっていた。"
  58: "ペトロは遠[とお]くからイエスについて行[い]き、大祭司[だいさいし]の屋敷[やしき]の中庭[なかにわ]まで入[はい]って、結末[けつまつ]を見[み]ようと、下役[したやく]たちと一緒[いっしょ]に座[すわ]った。"
  59: "祭司長[さいしちょう]たちと最高法院[さいこうほういん]の全員[ぜんいん]は、イエスを死刑[しけい]にするため、偽[いつわ]りの証言[しょうげん]を求[もと]めていた。"
  60: "しかし、多[おお]くの偽証者[ぎしょうしゃ]が現[あらわ]れても、証言[しょうげん]は見[み]つからなかった。やがて、二人[ふたり]の者[もの]が進[すす]み出[で]て"
  61: "こう言[い]った。「この男[おとこ]は、『神[かみ]の神殿[しんでん]を壊[こわ]すことも、三日[みっか]のうちにそれを建[た]てることもできる』と言[い]いました。」"
  62: "そこで、大祭司[だいさいし]が立[た]ち上[あ]がって言[い]った。「何[なに]も答[こた]えないのか。この者[もの]たちは、お前[まえ]について何[なに]を証言[しょうげん]しているのか。」"
  63: "しかし、イエスは黙[だま]ったままでおられた。そこで、大祭司[だいさいし]は言[い]った。「生[い]ける神[かみ]によって、お前[まえ]に命[めい]じる。お前[まえ]はキリスト、神[かみ]の子[こ]なのかどうか、わたしたちに言[い]え。」"
  64: "イエスは言[い]われた。「<j>あなたが言[い]ったとおりだ。しかし、あなたがたに言[い]っておく。今[いま]から後[のち]、あなたがたは、人[ひと]の子[こ]が力[ちから]ある方[かた]の右[みぎ]に座[すわ]り、天[てん]の雲[くも]に乗[の]って来[く]るのを見[み]るだろう。</j>」"
  65: "すると、大祭司[だいさいし]は衣[ころも]を引[ひ]き裂[さ]いて言[い]った。「彼[かれ]は神[かみ]を冒涜[ぼうとく]した。これ以上[いじょう]、証人[しょうにん]が何[なん]の必要[ひつよう]があろうか。今[いま]、あなたがたは冒涜[ぼうとく]の言葉[ことば]を聞[き]いたのだ。"
  66: "どう思[おも]うか。」彼[かれ]らは答[こた]えて言[い]った。「死[し]に値[あたい]する。」"
  67: "そこで、人々[ひとびと]はイエスの顔[かお]に唾[つば]を吐[は]きかけ、こぶしで打[う]ちつけ、ある者[もの]たちは平手[ひらて]で頬[ほお]を打[う]って"
  68: "こう言[い]った。「キリストよ、わたしたちに預言[よげん]して見[み]せよ。お前[まえ]を打[う]ったのはだれか。」"
  69: "ペトロは、表[おもて]の中庭[なかにわ]に座[すわ]っていた。すると、一人[ひとり]の女中[じょちゅう]がそばに来[き]て言[い]った。「あなたも、ガリラヤのイエスと一緒[いっしょ]にいましたね。」"
  70: "しかし、ペトロは皆[みな]の前[まえ]で否[いな]んで言[い]った。「あなたの言[い]っていることは分[わ]からない。」"
  71: "ペトロが門[もん]のところへ出[で]て行[い]くと、別[べつ]の女中[じょちゅう]が彼[かれ]を見[み]て、そこにいる人々[ひとびと]に言[い]った。「この人[ひと]も、ナザレのイエスと一緒[いっしょ]にいました。」"
  72: "ペトロはまたも否[いな]み、誓[ちか]ってさえ言[い]った。「そんな人[ひと]は知[し]らない。」"
  73: "しばらくして、そこに立[た]っていた人々[ひとびと]が近[ちか]づいて来[き]て、ペトロに言[い]った。「確[たし]かに、あなたもあの仲間[なかま]の一人[ひとり]だ。あなたの話[はな]し方[かた]で分[わ]かる。」"
  74: "すると、ペトロは呪[のろ]い始[はじ]め、また誓[ちか]って言[い]った。「そんな人[ひと]は知[し]らない。」その途端[とたん]、鶏[にわとり]が鳴[な]いた。"
  75: "ふと、ペトロはイエスが言[い]われた言葉[ことば]を思[おも]い出[だ]した。「鶏[にわとり]が鳴[な]く前[まえ]に、あなたは三度[さんど]、わたしを知[し]らないと言[い]うだろう」。そして、外[そと]へ出[で]て、激[はげ]しく泣[な]いた。"

notes:
  1: "καὶ ἐγένετο ὅτε ἐτέλεσεν — «и было, когда окончил»; формула перехода у Матфея, у Марка её нет."
  2: "У Матфея Пасха впервые, поэтому сноска на 過越祭; в ней же объяснён 除酵祭 (первое упоминание обоих — здесь). Слова Христа: у Марка 14:1 это речь евангелиста, у Матфея — прямая речь."
  3: "Εἰς τὴν αὐλὴν τοῦ ἀρχιερέως — «во двор первосвященника»; у Матфея здесь только ἀρχιερεῖς καὶ πρεσβύτεροι τοῦ λαοῦ, без γραμματεῖς (они появятся в 26:57). Сноска на 大祭司 — первое упоминание в книге."
  4: "δόλῳ — «с хитростью»; передано 計略を巡らして, не сглажено."
  5: "θόρυβος — «волнение, смятение»; 騒ぎ立つ."
  6: "Τοῦ δὲ Ἰησοῦ γενομένου… — родительный самостоятельный, поэтому отдельным предложением: «Иисус пришёл в Вифанию. (Это было) в доме Симона». 重い皮膚病 — как в Мк 14:3."
  8: "ἠγανάκτησαν — «вознегодовали»; у Марка «некоторые вознегодовали», у Матфея — ученики."
  9: "У Матфея нет цены «триста динариев» (она у Марка); πολλοῦ — «дорого»."
  12: "πρὸς τὸ ἐνταφιάσαι με — «для погребения Меня»; у Марка добавлено «сделала, что могла»."
  15: "τριάκοντα ἀργύρια — тридцать сребреников (ср. Зах 11:12); 銀三十枚."
  17: "Τῇ δὲ πρώτῃ τῶν ἀζύμων — «в первый день опресноков»; у Марка добавлено «когда заколали пасхального агнца», у Матфея нет."
  18: "πρὸς τὸν δεῖνα — «к такому-то», имя не названо (ある人); ср. Мк 14:13–15, где иначе."
  21: "εἷς ἐξ ὑμῶν παραδώσει με — без «возлежащего со Мной», как в Мк 14:18."
  22: "Μήτι ἐγώ εἰμι, κύριε; — «Не я ли, Господи?»; κύριε — обращение к Христу, 主よ."
  24: "καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη — «лучше было бы ему, если бы не родился»; порядок сохранён."
  25: "ῥαββί — 先生 (как во всей книге); Σὺ εἶπας — «ты сказал», традиционная утвердительная формула."
  28: "В базе сайта (gr-lxx-byz) τὸ αἷμά μου τῆς διαθήκης, без καινῆς; Церковь читает καινῆς διαθήκης — 〔新[あたら]しい〕契約, как в Мк 14:24. εἰς ἄφεσιν ἁμαρτιῶν — «во оставление грехов» — только у Матфея. Придаточное с причастием поставлено перед «кровью», чтобы не повторять формулу Марка дословно."
  29: "У Матфея «в Царстве Отца Моего» (у Марка «в Царстве Божием»); καινόν — «новое»; ἀπ᾽ ἄρτι — «отныне»."
  31: "Зах 13:7; ἐν ἐμοί — «из-за Меня, о Мне», передано わたしにつまずく. Цитата дана в форме «わたしが…打つと、…散らされる» (πατάξω, διασκορπισθήσονται), не как у Марка."
  37: "λυπεῖσθαι καὶ ἀδημονεῖν — «скорбеть и тосковать»; у Марка «ужасаться и тосковать» (ἐκθαμβεῖσθαι)."
  38: "περίλυπος… ἡ ψυχή μου — «душа Моя скорбит смертельно»; в Мк 14:34 передано «わたしは死ぬばかりに悲しい», здесь сохранено 魂."
  39: "πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ᾽ ὡς σύ — «впрочем не как Я хочу, но как Ты»; у Марка иначе («не чего Я хочу, но что Ты»)."
  41: "τὸ πνεῦμα πρόθυμον — «дух бодр»; в Мк 14:38 передано 心は燃えても, здесь πνεῦμα — 霊, а не 心, поэтому 霊は進んでいても."
  42: "εἰ οὐ δύναται τοῦτο παρελθεῖν ἐὰν μὴ αὐτὸ πίω — двойное условие, сохранено."
  45: "τὸ λοιπόν — «в остальном, впредь»; возможно и разрешительное «спите же и почивайте». Выбрано вопросительное чтение, как в Синодальном; отмечено для ревью."
  49: "χαῖρε — приветствие «радуйся»; у Иуды оно лживо. Оставлено «喜んでください», звучит нарочито — на ревью."
  50: "ἐφ᾽ ὃ πάρει — тёмное место: «то ли, зачем пришёл» или «делай, зачем пришёл»; оставлен вопрос, двусмысленность сохранена."
  53: "πλείω δώδεκα λεγιῶνας — «более двенадцати легионов»; сноска на レギオン (в Мф слово только здесь; в Мк 5:9 уже было)."
  56: "γραφαὶ τῶν προφητῶν — «писания пророков»; у Марка только αἱ γραφαί."
  57: "Здесь, в отличие от 26:3, добавлены γραμματεῖς — 律法学者."
  61: "У Матфея «храм Божий» (ναὸν τοῦ θεοῦ); у Марка «рукотворный/нерукотворный». Слова лжесвидетелей — не красным."
  64: "ἡ δύναμις — перифраза имени Божия («Сила»), передано 力ある方; ἀπ᾽ ἄρτι — «отныне», только у Матфея; ἐκ δεξιῶν — «одесную»."
  65: "Ἐβλασφήμησεν — «Он богохульствовал»; раздирание одежд — знак скорби и суда (ср. Лев 10:6). 冒涜 в Мф уже в 9:3 и 15:19, поэтому сноску не ставил."
  67: "ἐκολάφισαν — били кулаками; ἐράπισαν — били по щеке. У Марка иначе: 目隠し и 下役."
  69: "У Матфея «ガリラヤのイエス», у Марка «ナザレのイエス»; в 26:71 у Матфея — «ナザレの». παιδίσκη — 女中."
  70: "ἔμπροσθεν πάντων — «перед всеми»; у Марка этого нет."
  73: "ἡ λαλιά σου δῆλόν σε ποιεῖ — «говор твой обличает тебя» (галилейское произношение); 話し方."
  74: "καταθεματίζειν — «клясться с проклятиями», передано 呪い始め."
  75: "ἔκλαυσεν πικρῶς — «горько плакал»; 激しく泣いた."
