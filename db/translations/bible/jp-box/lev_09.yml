# jp-box, Левит, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: восьмой день — начало служения Аарона (1–7); Аарон приносит жертвы
# за себя (8–14) и за народ (15–21); благословение и явление славы (22–23);
# огонь от Господа (24).
# Красного и синего нет. Речь Бога — нет; речь Моисея — 「…」 (2–4, 6, 7),
# слова к старейшинам внутри неё — 『…』 (3–4).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 燔祭, 贖罪祭, 酬恩祭, 素祭 уже пояснены в Лев 1–5.
# LXX 9:15 короче масоретского: нет «и сделал его жертвой за грех» (слав. «и очисти его»,
# Син. «принёс его в жертву за грех») — переводим по LXX, в 〔…〕 не берём.
# 9:24 ἐξέστη — «изумились» (слав. «ужасошася»; Син. «воскликнул от радости» — с евр.).
