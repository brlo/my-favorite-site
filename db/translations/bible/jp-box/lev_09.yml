verses:
  1: "八日目[ようかめ]に、モーセはアロンとその子[こ]ら、およびイスラエルの長老[ちょうろう]たちを呼[よ]んだ。"
  2: "「あなたは自分[じぶん]のために、牛[うし]の群[む]れから子牛[こうし]を一頭[いっとう]、贖罪祭[しょくざいさい]として、また雄羊[おすひつじ]を一頭[いっとう]、燔祭[はんさい]として、傷[きず]のないものを取[と]り、主[しゅ]の前[まえ]に献[ささ]げなさい。"
  3: "またイスラエルの長老[ちょうろう]たちに語[かた]って言[い]いなさい。『山羊[やぎ]の群[む]れから雄山羊[おすやぎ]を一頭[いっとう]、贖罪祭[しょくざいさい]として、また子牛[こうし]と一歳[いっさい]の小羊[こひつじ]を、傷[きず]のない燔祭[はんさい]として取[と]りなさい。"
  4: "また子牛[こうし]と雄羊[おすひつじ]を一頭[いっとう]ずつ、主[しゅ]の前[まえ]に酬恩祭[しゅうおんさい]の犠牲[ぎせい]として、また油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]を取[と]りなさい。今日[きょう]、主[しゅ]があなたがたのうちに現[あらわ]れるからである。』」"
  5: "彼[かれ]らはモーセが命[めい]じたとおりのものを取[と]って、証[あかし]の幕屋[まくや]の前[まえ]に運[はこ]んだ。全会衆[ぜんかいしゅう]が近[ちか]づいて、主[しゅ]の前[まえ]に立[た]った。"
  6: "モーセは言[い]った。「これは主[しゅ]が語[かた]られたことばである。これを行[おこな]いなさい。そうすれば、主[しゅ]の栄光[えいこう]があなたがたのうちに現[あらわ]れる。」"
  7: "モーセはアロンに言[い]った。「祭壇[さいだん]に近[ちか]づいて、あなたの贖罪祭[しょくざいさい]とあなたの燔祭[はんさい]を献[ささ]げ、あなた自身[じしん]とあなたの家[いえ]のために贖[あがな]いをしなさい。また民[たみ]の捧[ささ]げ物[もの]を献[ささ]げ、彼[かれ]らのために贖[あがな]いをしなさい。主[しゅ]がモーセに命[めい]じたとおりである。」"
  8: "アロンは祭壇[さいだん]に近[ちか]づき、自分[じぶん]の贖罪祭[しょくざいさい]の子牛[こうし]を屠[ほふ]った。"
  9: "アロンの子[こ]らがその血[ち]を彼[かれ]のところへ持[も]って来[き]た。彼[かれ]は指[ゆび]をその血[ち]に浸[ひた]し、祭壇[さいだん]の角[つの]に塗[ぬ]り、その血[ち]を祭壇[さいだん]の基[もとい]に注[そそ]ぎ出[だ]した。"
  10: "贖罪祭[しょくざいさい]の脂肪[しぼう]、二[ふた]つの腎臓[じんぞう]、肝臓[かんぞう]の上[うえ]の部分[ぶぶん]を、主[しゅ]がモーセに命[めい]じたとおりに、祭壇[さいだん]の上[うえ]で焼[や]いた。"
  11: "肉[にく]と皮[かわ]は、宿営[しゅくえい]の外[そと]で火[ひ]で焼[や]き捨[す]てた。"
  12: "また燔祭[はんさい]を屠[ほふ]った。アロンの子[こ]らがその血[ち]を彼[かれ]のところへ持[も]って来[き]たので、彼[かれ]は祭壇[さいだん]の周[まわ]りにその血[ち]を注[そそ]ぎかけた。"
  13: "彼[かれ]らは燔祭[はんさい]を、頭[あたま]もともに、部[ぶ]分[ぶん]ごとに彼[かれ]のところへ持[も]って来[き]た。彼[かれ]はそれらを祭壇[さいだん]の上[うえ]に置[お]いた。"
  14: "彼[かれ]は内臓[ないぞう]と足[あし]を水[みず]で洗[あら]い、燔祭[はんさい]の上[うえ]に、すなわち祭壇[さいだん]の上[うえ]に置[お]いた。"
  15: "民[たみ]の捧[ささ]げ物[もの]を献[ささ]げた。アロンは民[たみ]の贖罪祭[しょくざいさい]の雄山羊[おすやぎ]を取[と]って屠[ほふ]り、初[はじ]めのものと同[おな]じようにした。"
  16: "燔祭[はんさい]を献[ささ]げ、定[さだ]められたとおりに行[おこな]った。"
  17: "また素祭[そさい]を献[ささ]げ、その一部[いちぶ]を手[て]に満[み]たして祭壇[さいだん]の上[うえ]で焼[や]いた。朝[あさ]の燔祭[はんさい]のほかに、これを行[おこな]った。"
  18: "また民[たみ]の酬恩祭[しゅうおんさい]の子牛[こうし]と雄羊[おすひつじ]を屠[ほふ]った。アロンの子[こ]らがその血[ち]を彼[かれ]のところへ持[も]って来[き]たので、彼[かれ]は祭壇[さいだん]の周[まわ]りにその血[ち]を注[そそ]ぎかけた。"
  19: "そして、子牛[こうし]と雄羊[おすひつじ]の脂肪[しぼう]、すなわち尾[お]の脂肪[しぼう]、腹[はら]を覆[おお]う脂肪[しぼう]、二[ふた]つの腎臓[じんぞう]とその上[うえ]の脂肪[しぼう]、肝臓[かんぞう]の上[うえ]の部分[ぶぶん]を、"
  20: "彼[かれ]は脂肪[しぼう]を胸[むね]の上[うえ]に置[お]き、その脂肪[しぼう]を祭壇[さいだん]の上[うえ]で焼[や]いた。"
  21: "アロンはその胸[むね]と右[みぎ]の肩[かた]を、主[しゅ]の前[まえ]に持[も]ち上[あ]げて献[ささ]げる分[ぶん]として取[と]り分[わ]けた。主[しゅ]がモーセに命[めい]じたとおりである。"
  22: "アロンは民[たみ]に向[む]けて手[て]を上[あ]げ、彼[かれ]らを祝福[しゅくふく]した。そして、贖罪祭[しょくざいさい]と燔祭[はんさい]と酬恩祭[しゅうおんさい]を献[ささ]げ終[お]えて、降[お]りた。"
  23: "モーセとアロンは証[あかし]の幕屋[まくや]に入[はい]り、出[で]て来[き]て民[たみ]を祝福[しゅくふく]した。すると、主[しゅ]の栄光[えいこう]が民[たみ]全体[ぜんたい]に現[あらわ]れた。"
  24: "主[しゅ]のもとから火[ひ]が燃[も]え出[で]て、祭壇[さいだん]の上[うえ]のもの、すなわち燔祭[はんさい]と脂肪[しぼう]を焼[や]き尽[つ]くした。民[たみ]は皆[みな]、これを見[み]て驚[おどろ]き、顔[かお]を地[ち]につけて伏[ふ]した。"

notes:
  1: "ἐγενήθη — «было» (γίνομαι); τῇ ἡμέρᾳ τῇ ὀγδόῃ — в восьмой день (八日目). ἐκάλεσεν — созвал. γερουσία τοῦ Ισραηλ — совет старейшин, 長老たち (слав. «старцы»)."
  2: "Λαβὲ σεαυτῷ — возьми себе (σεαυτῷ — датив). μοσχάριον ἐκ βοῶν — тельца из волов (μόσχος, μοσχάριον — молодой бык). περὶ ἁμαρτίας — «за грех», т. е. в жертву за грех (贖罪祭). κριός — баран (雄羊). ἄμωμα — непорочны (оба). προσένεγκε — принеси."
  3: "χίμαρον ἐξ αἰγῶν ἕνα — одного козла из коз (χίμαρος — козёл). μοσχάριον καὶ ἀμνὸν ἐνιαύσιον — тельца и годовалого агнца. εἰς ὁλοκάρπωσιν — во всесожжение (ὁλοκάρπωσις = ὁλοκαύτωμα, 燔祭). ἄμωμα — непорочны."
  4: "μόσχον καὶ κριόν — тельца и овна (LXX; масоретский: «вола и овна»). εἰς θυσίαν σωτηρίου — в жертву спасения, 酬恩祭. σεμίδαλιν πεφυραμένην ἐν ἐλαίῳ — пшеничную муку, смешанную с елеем. ὀφθήσεται ἐν ὑμῖν — явится у вас (слав. «в вас»)."
  5: "ἔλαβον — взяли; καθὸ ἐνετείλατο — как повелел. ἀπέναντι τῆς σκηνῆς — перед скинией. προσῆλθεν πᾶσα συναγωγή — пришло всё общество (συναγωγή — собрание, 会衆). ἔστησαν — стали (мн. ч.)."
  6: "τοῦτο τὸ ῥῆμα — это слово/дело (ῥῆμα). ποιήσατε — сделайте. ὀφθήσεται… δόξα κυρίου — явится слава Господня."
  7: "πρόσελθε πρὸς τὸ θυσιαστήριον — приступи к жертвеннику. τὸ περὶ τῆς ἁμαρτίας σου — твою жертву за грех. ἐξίλασαι — умилостиви (императив аориста ἐξιλάσκομαι). τὰ δῶρα τοῦ λαοῦ — дары народа. καθάπερ ἐνετείλατο κύριος τῷ Μωυσῇ — как заповедал Господь Моисею."
  8: "ἔσφαξεν τὸ μοσχάριον τὸ περὶ τῆς ἁμαρτίας — заколол тельца в жертву за грех (свой)."
  9: "ἔβαψεν τὸν δάκτυλον — омочил перст (βάπτω — погружать). κέρατα τοῦ θυσιαστηρίου — рога жертвенника (角). ἐξέχεεν ἐπὶ τὴν βάσιν — вылил к основанию (ἐκχέω)."
  10: "τὸ στέαρ — тук, жир (脂肪). νεφροί — почки (腎臓). λοβὸς τοῦ ἥπατος — доля печени (肝臓の上の部分; слав. «препонка печени», Син. «сальник»). ἀνήνεγκεν — вознёс, сжёг. ὃν τρόπον — как."
  11: "τὰ κρέα — мясо. βύρσα — кожа, шкура. κατέκαυσεν — сжёг. ἔξω τῆς παρεμβολῆς — вне стана (宿営)."
  12: "προσέχεεν ἐπὶ τὸ θυσιαστήριον κύκλῳ — возлил вокруг жертвенника (προσχέω; не «покропил», как в Син.)."
  13: "κατὰ μέλη — по членам, кусками. αὐτὰ καὶ τὴν κεφαλήν — их и голову. ἐπέθηκεν — возложил."
  14: "ἔπλυνεν τὴν κοιλίαν — омыл внутренности (κοιλία — утроба). ἐπὶ τὸ ὁλοκαύτωμα ἐπὶ τὸ θυσιαστήριον — на всесожжение, на жертвенник (двойной предлог LXX)."
  15: "τὸ δῶρον τοῦ λαοῦ — дар народа. χίμαρος — козёл. καθὰ καὶ τὸ πρῶτον — как и первое (т. е. как первый телец). Слав. добавляет «и очисти его», Син. «принёс его в жертву за грех» — с евр., в LXX нет; не в 〔…〕, следуем базе."
  16: "ὡς καθῆκει — как подобает (καθήκω)."
  17: "τὴν θυσίαν — здесь хлебное приношение (minchah), не всесожжение; отсюда 素祭. ἔπλησεν τὰς χεῖρας ἀπ᾽ αὐτῆς — наполнил руки от неё (обрядовый жест). χωρὶς τοῦ ὁλοκαυτώματος τοῦ πρωινοῦ — кроме утреннего всесожжения."
  18: "τὸν μόσχον καὶ τὸν κριὸν τῆς θυσίας τοῦ σωτηρίου τῆς τοῦ λαοῦ — тельца и овна жертвы спасения народа (酬恩祭)."
  19: "ὀσφύς — чресла, здесь жирный хвост, курдюк (слав. «чресла», Син. «курдюк»). τὸ στέαρ τὸ κατακαλύπτον ἐπὶ τῆς κοιλίας — жир, покрывающий внутренности. λοβός — доля печени."
  20: "ἐπὶ τὰ στηθύνια — на груди (στηθύνιον). ἀνήνεγκαν — вознесли (мн. ч.; подлежащее — сыны)."
  21: "ἀφεῖλεν — отделил, взял (ἀφαιρέω). ἀφαίρεμα — возношение, «отделение» (слав. «участие»; Син. «потрясая» передаёт евр. тнуфу). βραχίων ὁ δεξιός — правое плечо."
  22: "ἐξάρας τὰς χεῖρας ἐπὶ τὸν λαόν — подняв руки к народу. εὐλόγησεν — благословил. κατέβη — сошёл (с жертвенника). ποιήσας — совершив. τὰ τοῦ σωτηρίου — жертвы спасения (酬恩祭)."
  23: "εἰσῆλθεν… εἰς τὴν σκηνὴν τοῦ μαρτυρίου — вошли в скинию свидетельства. ἐξελθόντες — выйдя. ὤφθη ἡ δόξα κυρίου — явилась слава Господня."
  24: "ἐξῆλθεν πῦρ παρὰ κυρίου — вышел огонь от Господа. κατέφαγεν — пожрал. ἐξέστη — изумился, пришёл в ужас (ἐξίστημι; слав. «ужасошася»; Син. «воскликнул от радости» — с евр., не по LXX). ἔπεσαν ἐπὶ πρόσωπον — пали на лицо."
