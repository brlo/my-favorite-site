verses:
  1: "すべての人[ひと]に大[おお]きな労苦[ろうく]が定[さだ]められ、アダムの子[こ]らには重[おも]い軛[くびき]が負[お]わされている。母[はは]の胎[たい]から出[で]る日[ひ]から、すべての母[はは]である土[つち]に帰[かえ]る日[ひ]まで。"
  2: "その思[おも]いと心[こころ]の恐[おそ]れ、待[ま]ち望[のぞ]みの考[かんが]え、そして終[お]わりの日[ひ]。"
  3: "栄[えい]えある王座[おうざ]に座[すわ]る者[もの]から、地[ち]と灰[はい]のうちに低[ひく]くされた者[もの]に至[いた]るまで。"
  4: "紫[むらさき]の衣[ころも]と冠[かんむり]をまとう者[もの]から、粗[あら]い麻[あさ]の衣をまとう者に至[いた]るまで、"
  5: "怒[いか]り、妬[ねた]み、動揺[どうよう]、騒[さわ]ぎ、死[し]の恐[おそ]れ、憤[いきどお]り、争[あらそ]いがある。憩[いこ]いの時[とき]、寝床[ねどこ]の上[うえ]で、夜[よる]の眠[ねむ]りが彼の知識[ちしき]を変[か]える。"
  6: "憩[いこ]いは少[すこ]しで、ほとんど無[な]いに等[ひと]しい。それゆえ、眠[ねむ]りのうちでは、見張[みは]りの日[ひ]のように心[こころ]が騒[さわ]ぎ、"
  7: "戦[いくさ]の前[まえ]から逃[に]げた者[もの]のように、心の幻[まぼろし]に悩[なや]まされる。必要[ひつよう]の時[とき]に彼は目[め]を覚[さ]まし、何[なに]も恐[おそ]ろしいことはなかったことに驚[おどろ]く。"
  8: "それはすべての肉[にく]とともにあり、人[ひと]から家畜[かちく]に至[いた]るまで及[およ]ぶ。罪[つみ]ある者[もの]には、その七倍[ななばい]が臨[のぞ]む。"
  9: "死[し]、血[ち]、争[あらそ]い、剣[つるぎ]、災[わざわ]い、飢[う]え、破壊[はかい]、鞭[むち]。"
  10: "これらはみな不法[ふほう]な者[もの]のために造られ、彼らのゆえに洪水[こうずい]が起[お]こった。"
  11: "地[ち]から出[で]たものはみな地に帰[かえ]り、水[みず]から出たものは海[うみ]に戻[もど]る。"
  12: "どんな贈[おく]り物[もの]も不義[ふぎ]も消[き]え去[さ]る。しかし、信[しん]実[じつ]は永遠[えいえん]に立[た]ち続[つづ]ける。"
  13: "不正[ふせい]な者[もの]の財産[ざいさん]は川[かわ]のように干上[ひあ]がり、雨[あめ]の日の大[おお]きな雷[かみなり]のように響[ひび]いて消[き]える。"
  14: "人[ひと]が手[て]を開[ひら]くとき、その人[ひと]は喜[よろこ]ぶ。同[おな]じように、違反[いはん]する者[もの]は最後[さいご]には消[き]え去[さ]る。"
  15: "不敬[ふけい]な者[もの]の子孫[しそん]は枝[えだ]を増[ふ]やさず、その汚[けが]れた根[ね]は岩[いわ]の頂[いただき]にある。"
  16: "葦[あし]はどんな水[みず]のほとり、川[かわ]の岸[きし]にあっても、どの草[くさ]よりも先[さき]に引[ひ]き抜[ぬ]かれる。"
  17: "恵[めぐ]みは祝福[しゅくふく]に満[み]ちた楽園[らくえん]のようであり、施[ほどこ]しは永遠[えいえん]に保[たも]たれる。"
  18: "自[みずか]ら足[た]りる者[もの]と働[はたら]く者[もの]の生[いのち]は甘[あま]く、そのどちらよりも、宝[たから]を見[み]いだす者[もの]の生は甘い。"
  19: "子[こ]どもと都[みやこ]の築[きず]きは名[な]を堅[かた]くする。そのどちらよりも、非[ひ]の打[う]ちどころのない妻[つま]が重[おも]んじられる。"
  20: "ぶどう酒[しゅ]と音楽[おんがく]は心[こころ]を喜[よろこ]ばせる。そのどちらよりも、知恵[ちえ]を愛[あい]することがまさる。"
  21: "笛[ふえ]と竪琴[たてごと]は歌[うた]を甘[あま]くする。そのどちらよりも、心地[ここち]よい舌[した]がまさる。"
  22: "目[め]は恵[めぐ]みと美[うつく]しさを望[のぞ]む。そのどちらよりも、蒔[ま]いた種[たね]の若葉[わかば]を望む。"
  23: "友[とも]と仲間[なかま]は時[とき]に会[あ]うもの。そのどちらよりも、夫[おっと]とともにある妻[つま]がまさる。"
  24: "兄弟[きょうだい]と助[たす]けは苦[くる]しみの時[とき]にある。そのどちらよりも、施[ほどこ]しが救[すく]い出[だ]す。"
  25: "金[きん]と銀[ぎん]は足[あし]を堅[かた]くする。そのどちらよりも、良[よ]い助言[じょげん]が重[おも]んじられる。"
  26: "財産[ざいさん]と力[ちから]は心[こころ]を高[たか]ぶらせる。そのどちらよりも、主[しゅ]を恐[おそ]れることがまさる。"
  27: "主を恐れることには乏[とぼ]しさがなく、そのうちに助[たす]けを求[もと]める必要[ひつよう]もない。"
  28: "主[しゅ]を恐れることは祝福[しゅくふく]の楽園[らくえん]のようであり、それはすべての栄光[えいこう]にまさって、その人[ひと]を覆[おお]う。"
  29: "子[こ]よ、物乞[ものご]いの生[い]き方[かた]をしてはならない。物乞いをするよりは、死[し]んだほうがましである。"
  30: "他人[たにん]の食卓[しょくたく]に目[め]を向[む]ける者[もの]は、その生[い]き方[かた]が生[い]きるための思[おも]いのうちにない。彼は他人の食物[しょくもつ]で自分[じぶん]の魂[たましい]を汚[けが]す。"
  31: "しかし、知識[ちしき]があり、よく教[おし]えられた人[ひと]は自分[じぶん]を守[まも]る。"
  32: "恥[は]じ知[し]らずの者[もの]の口[くち]では物乞[ものご]いが甘[あま]く感[かん]じられ、その腹[はら]のうちでは火[ひ]が燃[も]える。"

notes:
  1: "Ἀσχολία μεγάλη ἔκτισται παντὶ ἀνθρώπῳ — «великое занятие (труд, беспокойство) создано всякому человеку» (ἀσχολία — занятость, труд, беспокойство; κτίζω — создавать); слав. «непразднство велие создано бысть всякому человеку». ζυγὸς βαρὺς ἐπὶ υἱοὺς Αδαμ — «иго тяжкое на сынов Адама» (ζυγός — иго, ярмо; βαρύς — тяжкий); ἀφ᾿ ἡμέρας ἐξόδου ἐκ γαστρὸς μητρὸς αὐτῶν ἕως ἡμέρας ἐπιστροφῆς εἰς μητέρα πάντων — «от дня выхода из чрева матери их до дня возвращения в мать всех» (ἔξοδος — выход; ἐπιστροφή — возвращение; γαστήρ — чрево); слав. «до дне погребения в матерь всех»."
  2: "τοὺς διαλογισμοὺς αὐτῶν καὶ φόβον καρδίας — «помыслы их и страх сердечный» (διαλογισμός — помысел, размышление; φόβος — страх); слав. «размышления их и страх сердечный». ἐπίνοια προσδοκίας — «забота ожидания» (ἐπίνοια — мысль, забота; προσδοκία — ожидание); ἡμέρα τελευτῆς — «день кончины» (τελευτή — конец, смерть); слав. «день скончания»."
  3: "ἀπὸ καθημένου ἐπὶ θρόνου ἐνδόξου — «от сидящего на престоле славном» (θρόνος — престол; ἔνδοξος — славный); слав. «от седящаго на престоле славы». ἕως τεταπεινωμένου ἐν γῇ καὶ σποδῷ — «до униженного в земле и пепле» (ταπεινόω — унижать; σποδός — пепел); слав. «даже до смиреннаго на земли и пепеле»."
  4: "ἀπὸ φοροῦντος ὑακίνθινον καὶ στέφανον — «от носящего гиацинтовую [одежду] и венец» (ὑακίνθινος — гиацинтовый, пурпурный; στέφανος — венец); слав. «от носящаго багряницу и венец». ἕως περιβαλλομένου ὠμόλινον — «до одевающегося в грубый лён» (ὠμόλινον — грубая льняная ткань); слав. «даже до одевающагося льняною»."
  5: "θυμὸς καὶ ζῆλος καὶ ταραχὴ καὶ σάλος καὶ φόβος θανάτου καὶ μηνίαμα καὶ ἔρις — «ярость, ревность, смятение, волнение, страх смерти, гнев и распря» (θυμός — ярость; ζῆλος — ревность; ταραχή — смятение; σάλος — волнение; μηνίαμα — гнев; ἔρις — распря); слав. «ярость и зависть, и мятеж и молва, и страх смерти и вражда и рвение». ἐν καιρῷ ἀναπαύσεως ἐπὶ κοίτης — «во время покоя на ложе» (ἀνάπαυσις — покой; κοίτη — ложе); слав. «во время покоя на ложи». ὕπνος νυκτὸς ἀλλοιοῖ γνῶσιν αὐτοῦ — «сон ночной изменяет знание его» (ὕπνος — сон; ἀλλοιόω — изменять; γνῶσις — знание); слав. «сон нощный изменяет разум его»."
  6: "ὀλίγον ὡς οὐδὲν ἐν ἀναπαύσει — «немного, как ничего, в покое» (ὀλίγον — немного); слав. «мало яко ничтоже на покой». ἀπ᾿ ἐκείνου ἐν ὕπνοις ὡς ἐν ἡμέρᾳ σκοπιᾶς τεθορυβημένος — «от того во сне, как в день стражи, встревоженный» (σκοπιά — стража, наблюдательный пункт; ταράσσω — тревожить);"
  7: "ἐν ὁράσει καρδίας αὐτοῦ ὡς ἐκπεφευγὼς ἀπὸ προσώπου πολέμου — «в видении сердца своего, как убежавший от лица войны» (ὅρασις — видение; ἐκφεύγω — убегать); слав. «возмущен видением сердца своего, яко избежав от лица брани». ἐν καιρῷ χρείας αὐτοῦ ἐξηγέρθη — «в час нужды своей он пробудился» (χρεία — нужда; ἐξεγείρω — пробуждать); слав. «во время спасения своего воста» (χρεία понято как «спасение»), ru «во время безопасности своей». ἀποθαυμάζων εἰς οὐδένα φόβον — «дивясь, [что] нет никакого страха»; слав. «дивяся ни при единем же страсе». Смысл тёмный: пробуждение приносит облегчение."
  8: "μετὰ πάσης σαρκὸς ἀπὸ ἀνθρώπου ἕως κτήνους — «со всякой плотью, от человека до скота» (σάρξ — плоть; κτῆνος — скот); слав. «со всякою плотию от человека даже до скота». ἐπὶ ἁμαρτωλῶν ἑπταπλάσια πρὸς ταῦτα — «на грешниках семикратно к этому» (ἁμαρτωλός — грешник; ἑπταπλάσιος — семикратный); слав. «и на грешных седмерицею к сим»."
  9: "θάνατος καὶ αἷμα καὶ ἔρις καὶ ῥομφαία — «смерть, кровь, распря и меч» (αἷμα — кровь; ῥομφαία — меч); слав. «смерть и кровь, и рвение и оружие». ἐπαγωγαί, λιμὸς καὶ σύντριμμα καὶ μάστιξ — «наведения, голод, сокрушение и бич» (ἐπαγωγή — наведение, бедствие; λιμός — голод; σύντριμμα — сокрушение; μάστιξ — бич); слав. «наведения, глад и сокрушение и раны»."
  10: "ἐπὶ τοὺς ἀνόμους ἐκτίσθη ταῦτα πάντα — «на беззаконных создано всё это» (ἄνομος — беззаконный; κτίζω — создавать); слав. «на беззаконных создана быша сия вся». δι᾿ αὐτοὺς ἐγένετο ὁ κατακλυσμός — «из-за них был потоп» (κατακλυσμός — потоп); слав. «и сих ради бысть потоп»."
  11: "πάντα, ὅσα ἀπὸ γῆς, εἰς γῆν ἀναστρέφει — «всё, что от земли, в землю возвращается» (ἀναστρέφω — возвращать); слав. «вся, елика от земли, в землю возвращаются». ἀπὸ ὑδάτων, εἰς θάλασσαν ἀνακάμπτει — «что от вод, в море возвращается» (ἀνακάμπτω — возвращаться); слав. «и от воды, в море возвращаются»."
  12: "Πᾶν δῶρον καὶ ἀδικία ἐξαλειφθήσεται — «всякий дар и неправда изгладятся» (δῶρον — дар; ἀδικία — неправда; ἐξαλείφω — изглаживать); слав. «всяк дар и неправда истребится». πίστις εἰς τὸν αἰῶνα στήσεται — «верность вовеки устоит» (πίστις — вера, верность; ἵστημι — стоять); слав. «а вера во век стояти будет»."
  13: "χρήματα ἀδίκων ὡς ποταμὸς ξηρανθήσεται — «имение неправедных, как река, иссякнет» (χρῆμα — имущество; ξηραίνω — иссушать); слав. «имение неправедных яко река изсхнет». ὡς βροντὴ μεγάλη ἐν ὑετῷ ἐξηχήσει — «как великий гром в дождь отзвучит» (βροντή — гром; ὑετός — дождь; ἐξηχέω — отзвучать); слав. «якоже гром велик в дождь возгремит»."
  14: "ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας εὐφρανθήσεται — «когда он откроет руки, возрадуется» (ἀνοίγω — открывать; εὐφραίνομαι — радоваться); речь о человеке, который открывает руку, т. е. даёт; слав. «егда разгнет руце, возвеселится», ru «кто открывает руку, тот бывает весел». οἱ παραβαίνοντες εἰς συντέλειαν ἐκλείψουσιν — «преступающие до конца исчезнут» (παραβαίνω — преступать; ἐκλείπω — исчезать); слав. «преступающии до конца изчезнут»."
  15: "ἔκγονα ἀσεβῶν οὐ πληθυνεῖ κλάδους — «потомство нечестивых не умножит ветвей» (ἔκγονος — потомок; ἀσεβής — нечестивый; πληθύνω — умножать; κλάδος — ветвь); слав. «изчадия нечестивых не умножат ветвий». ῥίζαι ἀκάθαρτοι ἐπ᾿ ἀκροτόμου πέτρας — «корни нечистые на острие скалы» (ῥίζα — корень; ἀκάθαρτος — нечистый; ἀκρότομος — обрывистый); слав. «корения нечистая на тверде камени»."
  16: "ἄχι ἐπὶ παντὸς ὕδατος καὶ χείλους ποταμοῦ — «тростник при всякой воде и на берегу реки» (ἄχι — тростник, камыш; χεῖλος — губа, берег); слав. «злак над всякою водою и на брезе реки». πρὸ παντὸς χόρτου ἐκτιλήσεται — «прежде всякой травы будет вырван» (χόρτος — трава; ἐκτίλλω — вырывать); слав. «прежде всякия травы исторжен будет»."
  17: "χάρις ὡς παράδεισος ἐν εὐλογίαις — «благодать (милость), как рай в благословениях» (χάρις — благодать, милость; παράδεισος — рай; εὐλογία — благословение); слав. «благодать яко рай во благословениих». ἐλεημοσύνη εἰς τὸν αἰῶνα διαμενεῖ — «милостыня вовеки пребывает» (ἐλεημοσύνη — милостыня; διαμένω — пребывать); слав. «милостыня во век пребывает»."
  18: "Ζωὴ αὐτάρκους καὶ ἐργάτου γλυκανθήσεται — «жизнь самодостаточного и работника усладится» (αὐτάρκης — самодостаточный; ἐργάτης — работник; γλυκαίνω — делать сладким); слав. «живот самодоволнаго делателя усладится». ὑπὲρ ἀμφότερα ὁ εὑρίσκων θησαυρόν — «сверх обоих — находящий сокровище» (θησαυρός — сокровище); слав. «и паче обоих обретаяй сокровище»."
  19: "τέκνα καὶ οἰκοδομὴ πόλεως στηρίζουσιν ὄνομα — «дети и построение города утверждают имя» (οἰκοδομή — строение; στηρίζω — утверждать); слав. «чада и созидание града утверждают имя». ὑπὲρ ἀμφότερα γυνὴ ἄμωμος λογίζεται — «сверх обоих жена непорочная вменяется» (ἄμωμος — непорочный; λογίζομαι — вменяться); слав. «и паче обоих жена непорочна вменяется»."
  20: "οἶνος καὶ μουσικὰ εὐφραίνουσιν καρδίαν — «вино и музыка веселят сердце» (οἶνος — вино; μουσικά — музыка); слав. «вино и мусикиа веселят сердце». ὑπὲρ ἀμφότερα ἀγάπησις σοφίας — «сверх обоих — любовь к премудрости» (ἀγάπησις — любовь; σοφία — премудрость); слав. «а паче обоих возлюбление премудрости»."
  21: "αὐλὸς καὶ ψαλτήριον ἡδύνουσιν μέλη — «свирель и псалтирь услаждают напевы» (αὐλός — свирель, флейта; ψαλτήριον — псалтирь; ἡδύνω — услаждать; μέλος — напев); слав. «свирель и псалтирь услаждают песнь». ὑπὲρ ἀμφότερα γλῶσσα ἡδεῖα — «сверх обоих — сладкий язык» (γλῶσσα — язык; ἡδύς — сладкий); слав. «а паче обоих язык сладкий»."
  22: "χάριν καὶ κάλλος ἐπιθυμήσει ὀφθαλμός — «благодати и красоты возжелает око» (ἐπιθυμέω — желать; ὀφθαλμός — глаз); слав. «благодати и доброты возжелает око твое». ὑπὲρ ἀμφότερα χλόην σπόρου — «сверх обоих — зелень посева» (χλόη — зелень, молодой побег; σπόρος — посев, семя); слав. «а паче обоих злака семене»."
  23: "φίλος καὶ ἑταῖρος εἰς καιρὸν ἀπαντῶντες — «друг и товарищ во время встречающиеся» (ἑταῖρος — товарищ; ἀπαντάω — встречать); слав. «приятель и друг сретающася во время». ὑπὲρ ἀμφότερα γυνὴ μετὰ ἀνδρός — «сверх обоих — жена с мужем»; слав. «а паче обоих жена с мужем»."
  24: "ἀδελφοὶ καὶ βοήθεια εἰς καιρὸν θλίψεως — «братья и помощь во время скорби» (ἀδελφός — брат; βοήθεια — помощь; θλῖψις — скорбь); слав. «братия и помощь во время скорби». ὑπὲρ ἀμφότερα ἐλεημοσύνη ῥύσεται — «сверх обоих — милостыня избавит» (ῥύομαι — избавлять); слав. «а паче обоих милостыня избавит»."
  25: "χρυσίον καὶ ἀργύριον ἐπιστήσουσιν πόδα — «золото и серебро утвердят ногу» (χρυσίον — золото; ἀργύριον — серебро; ἐφίστημι — утверждать); слав. «злато и сребро утвердят ногу». ὑπὲρ ἀμφότερα βουλὴ εὐδοκιμεῖται — «сверх обоих — совет признаётся благим» (βουλή — совет; εὐδοκιμέω — одобряться); слав. «а паче обоих совет благоугоден будет»."
  26: "χρήματα καὶ ἰσχὺς ἀνυψώσουσιν καρδίαν — «имение и сила возвысят сердце» (χρῆμα — имущество; ἰσχύς — сила; ἀνυψόω — возвышать); слав. «имение и крепость вознесут сердце». ὑπὲρ ἀμφότερα φόβος κυρίου — «сверх обоих — страх Господень»;"
  27: "οὐκ ἔστιν ἐν φόβῳ κυρίου ἐλάττωσις — «нет в страхе Господнем умаления» (ἐλάττωσις — умаление, недостаток); слав. «несть во страсе Господни умаления». οὐκ ἔστιν ἐπιζητῆσαι ἐν αὐτῷ βοήθειαν — «не нужно искать в нём помощи» (ἐπιζητέω — искать); слав. «и несть в нем лишения помощи»."
  28: "φόβος κυρίου ὡς παράδεισος εὐλογίας — «страх Господень, как рай благословения»; слав. «страх Господень яко рай благословения». ὑπὲρ πᾶσαν δόξαν ἐκάλυψεν αὐτόν — «более всякой славы покрыл его» (δόξα — слава; καλύπτω — покрывать); слав. «и паче всякия славы покры его»."
  29: "Τέκνον, ζωὴν ἐπαιτήσεως μὴ βιώσῃς — «сын, жизнью прошения (нищенства) не живи» (ἐπαίτησις — прошение, попрошайничество; βιόω — жить); слав. «чадо, животом просливым не живи». κρεῖσσον ἀποθανεῖν ἢ ἐπαιτεῖν — «лучше умереть, чем просить» (κρείσσων — лучше; ἐπαιτέω — просить милостыню); слав. «лучше умрети, нежели просити»."
  30: "ἀνὴρ βλέπων εἰς τράπεζαν ἀλλοτρίαν — «муж, смотрящий на чужой стол» (τράπεζα — стол, трапеза; ἀλλότριος — чужой); слав. «муж зря на чуждую трапезу». οὐκ ἔστιν αὐτοῦ ὁ βίος ἐν λογισμῷ ζωῆς — «не в помысле жизни жизнь его» (βίος — жизнь; λογισμός — помысел); ἀλισγήσει ψυχὴν αὐτοῦ ἐν ἐδέσμασιν ἀλλοτρίοις — «осквернит душу свою чужой пищей» (ἀλισγέω — осквернять; ἔδεσμα — яство); слав. «опечалит душу свою чуждыми брашны»."
  31: "ἀνὴρ δὲ ἐπιστήμων καὶ πεπαιδευμένος φυλάξεται — «но муж знающий и воспитанный сохранится» (ἐπιστήμων — знающий; παιδεύω — воспитывать); слав. «муж же худог и наказан сохранится»."
  32: "ἐν στόματι ἀναιδοῦς γλυκανθήσεται ἐπαίτησις — «в устах бесстыдного усладится прошение» (ἀναιδής — бесстыдный; γλυκαίνω — делать сладким); слав. «во устех нестыдливаго прошение усладится». ἐν κοιλίᾳ αὐτοῦ πῦρ καήσεται — «в чреве его огонь возгорится» (κοιλία — чрево; καίω — жечь); слав. «и во чреве его огнь возгорится»."
