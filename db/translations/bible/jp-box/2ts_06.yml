# jp-box, 2-я Царств, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 2 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: ковчег на новой колеснице, семь хоров (1–5); Оза и его смерть (6–8);
# страх Давида, ковчег в доме Аведдара (9–11); перенесение в Иерусалим,
# жертвы и раздача (12–19); Мелхола (20–23).
# Речь — 「…」: 6:9 (Давид), 6:12 (вестники), 6:20 (Мелхола), 6:21–22 (Давид;
# кавычки открываются в 21 и закрываются в 22, как в 1 Цар 17:45–47).
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕 нет: слав. пометы в скобках («Господним» 6:3, «Божиим» 6:4, «идяху» 6:5)
# в текст не внесены, это пояснения издания к греч.; всё в notes.
# Расхождения LXX/слав. с МТ (Синод.) отмечены в notes: 6:1 (70 000 против 30 000),
# 6:10 (Аведдар против Овед-Едома), 6:13 (семь хоров против «через шесть шагов»),
# 6:14 (изящная одежда против льняного ефода), 6:20 («из пляшущих» против «из пустых»).
# Имя Аβεδδαρα передано с гр.: オベデ・エドム; Мелхола — ミカル, как в 1 Царств.
# Сносок ⟨…⟩ нет: 契約の箱, 燔祭, 酬恩祭, ケルビム, ラッパ уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2ts
chapter: 6
draft: true

verses:
  1: "ダビデは再[ふたた]び、イスラエルからすべての若者[わかもの]を、およそ七万人[ななまんにん]集[あつ]めた。"
  2: "ダビデは立[た]ち上[あ]がり、自分[じぶん]とともにいた民[たみ]すべてと、ユダの長[おさ]たちとともに、神[かみ]の箱[はこ]をそこから運[はこ]び上[あ]げるために上[のぼ]って行[ゆ]った。その箱の上には、ケルビムの上に座[すわ]る万軍[ばんぐん]の主[しゅ]の名[な]が呼[よ]び求[もと]められている。"
  3: "彼らは主[しゅ]の箱[はこ]を新[あたら]しい車[くるま]に載[の]せ、丘[おか]の上[うえ]にあるアミナダブの家[いえ]からそれを持[も]ち出[だ]した。アミナダブの子[こ]らであるオザと、その兄弟[きょうだい]たちが車を引[ひ]いた。"
  4: "彼の兄弟[きょうだい]たちは箱[はこ]の前[まえ]を歩[あゆ]んでいた。"
  5: "ダビデとイスラエルの子[こ]らは、主[しゅ]の前[まえ]で、力[ちから]を尽[つ]くして調[ととの]えられた楽器[がっき]を奏[かな]で、歌[うた]をうたい、琴[こと]や竪琴[たてごと]、太鼓[たいこ]、シンバル、笛[ふえ]をもって遊[あそ]んだ。"
  6: "彼らがナホンの脱穀場[だっこくじょう]まで来[き]たとき、オザは神[かみ]の箱[はこ]を押[お]さえようとして手[て]を伸[の]ばし、それを握[にぎ]った。牛[うし]がそれを傾[かたむ]けたからである。"
  7: "主[しゅ]はオザに向[む]かって怒[いか]りを発[はっ]し、そこで神[かみ]が彼を打[う]たれた。彼は主[しゅ]の箱[はこ]のそばで、神の前[まえ]で死[し]んだ。"
  8: "ダビデは、主[しゅ]がオザを打[う]ち破[やぶ]られたことで悲[かな]しんだ。その場所[ばしょ]は今日[きょう]に至[いた]るまでオザの破れと呼[よ]ばれている。"
  9: "その日[ひ]、ダビデは主[しゅ]を恐[おそ]れて言[い]った。「主[しゅ]の箱[はこ]が、どうしてわたしのところへ来[く]ることがあるだろうか。」"
  10: "ダビデは、主[しゅ]の契約[けいやく]の箱[はこ]を自分[じぶん]のところへ、すなわちダビデの町[まち]へ引[ひ]き上[あ]げることを望[のぞ]まず、それをガテ人[じん]オベデ・エドムの家[いえ]へ回[まわ]した。"
  11: "主[しゅ]の箱[はこ]はガテ人[じん]オベデ・エドムの家[いえ]に三[みっ]か月[げつ]とどまった。主[しゅ]はオベデ・エドムとその家のすべて、また彼のすべてのものを祝福[しゅくふく]された。"
  12: "ダビデ王[おう]に、「主[しゅ]は神[かみ]の箱[はこ]のゆえに、オベデ・エドムの家[いえ]とそのすべてのものを祝福[しゅくふく]された」と告[つ]げる者[もの]があった。ダビデは行[い]って、主[しゅ]の箱をオベデ・エドムの家からダビデの町[まち]へ、喜[よろこ]びとともに運[はこ]び上[あ]げた。"
  13: "箱[はこ]を運[はこ]ぶ者[もの]たちとともに七[なな]つの合唱隊[がっしょうたい]があり、いけにえとして子牛[こうし]と子羊[こひつじ]があった。"
  14: "ダビデは主[しゅ]の前[まえ]で、調[ととの]えられた楽器[がっき]を鳴[な]らした。ダビデは晴[は]れの衣[ころも]をまとっていた。"
  15: "ダビデとイスラエルの家[いえ]全体[ぜんたい]は、叫[さけ]びとラッパの音[ね]とともに主[しゅ]の箱[はこ]を運[はこ]び上[あ]げた。"
  16: "主[しゅ]の箱[はこ]がダビデの町[まち]に近[ちか]づいたとき、サウルの娘[むすめ]ミカルは窓[まど]から覗[のぞ]き込[こ]み、王[おう]ダビデが主[しゅ]の前[まえ]で踊[おど]り、楽器[がっき]を鳴[な]らしているのを見[み]て、心[こころ]のうちに彼を蔑[さげす]んだ。"
  17: "彼らは主[しゅ]の箱[はこ]を運[はこ]び入[い]れ、ダビデがそのために張[は]った天幕[てんまく]の中央[ちゅうおう]、その場所[ばしょ]に据[す]えた。ダビデは主[しゅ]の前[まえ]で燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげた。"
  18: "ダビデは燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげ終[お]えると、万軍[ばんぐん]の主[しゅ]の名[な]によって民[たみ]を祝福[しゅくふく]した。"
  19: "ダビデはイスラエルの民[たみ]すべてに、その軍勢[ぐんぜい]のすべてに、ダンからベエル・シェバまで、男[おとこ]から女[おんな]まで、一人[ひとり]ごとにパン一切[き]れと、焼[や]き肉[にく]一切れと、鉄板[てつばん]で焼いた菓子[かし]を一[ひと]つずつ分[わ]け与[あた]えた。民はみな、それぞれ自分[じぶん]の家[いえ]へ帰[かえ]った。"
  20: "ダビデが自分[じぶん]の家[いえ]を祝福[しゅくふく]しようとして戻[もど]ると、サウルの娘[むすめ]ミカルがダビデを迎[むか]えに出[で]て、彼を祝福して言[い]った。「今日[きょう]、イスラエルの王[おう]は、ご自分[じぶん]のしもべたちの女中[じょちゅう]たちの目[め]の前[まえ]で、踊[おど]る者[もの]の一人[ひとり]のように身[み]をさらして、なんと栄光[えいこう]を受[う]けられたことか。」"
  21: "ダビデはミカルに言[い]った。「わたしは主[しゅ]の前[まえ]で踊[おど]る。あなたの父[ちち]よりも、その家[いえ]のすべてよりもわたしを選[えら]び、わたしをその民[たみ]イスラエルの上[うえ]に立[た]つ指導者[しどうしゃ]としてくださった主[しゅ]は、ほめたたえられる。わたしは主の前で遊[あそ]び、踊る。"
  22: "わたしはさらにこのように身[み]をさらし、あなたの目[め]には卑[いや]しい者[もの]となる。あなたが『わたしは栄光[えいこう]を受[う]ける』と言[い]った、あの女中[じょちゅう]たちの前[まえ]では、なおさらそうなる。」"
  23: "サウルの娘[むすめ]ミカルには、死[し]ぬ日[ひ]まで子[こ]がなかった。"

notes:
  1: "συνήγαγεν — собрал (συνάγω). νεανίαν — юноша, молодой человек (слав. «юношу»); в МТ «отборные» (בָּחוּר). ὡς ἑβδομήκοντα χιλιάδας — около семидесяти тысяч; у Синод. 30 000 — масоретское чтение."
  2: "ἐν ἀναβάσει τοῦ ἀναγαγεῖν — «при восхождении, чтобы вознести» (ἀνάβασις, ἀνάγω). ἐφ᾽ ἣν ἐπεκλήθη τὸ ὄνομα — над которым призвано имя (ἐπικαλέω). κυρίου τῶν δυνάμεων — Господа сил (万軍の主). καθημένου ἐπὶ τῶν χερουβιν — сидящего на херувимах. ἀπὸ τῶν ἀρχόντων Ιουδα — от начальников Иуды (слав. «от князей иудиных»)."
  3: "ἐπεβίβασεν — поставил на (ἐπιβιβάζω). ἅμαξα καινή — новая колесница (車). ἦρεν — подняли, повезли. Αμιναδαβ — Аминадав (アミナダブ, как в 1 Цар 6:1–2). βουνός — холм. ᾖγον — вели, гнали (ἄγω). Слав. в скобках «(Господним)» — пояснение издания, в гр. нет."
  4: "σὺν τῇ κιβωτῷ — вместе с ковчегом; стих продолжает 6:3. Слав. в скобках «(Божиим)». В МТ и Синод. здесь назван Ахио, брат Озы; у LXX и слав. — «братья его»."
  5: "παίζοντες — играя, веселясь (παίζω). ὄργανα ἡρμοσμένα — настроенные инструменты (ἁρμόζω); ἐν ἰσχύι — в силе, т.е. изо всех сил. κινύρα — кинира (竪琴), νάβλα — набл, псалтирь, τύμπανον — тимпан (太鼓), κύμβαλον — кимвал (シンバル), αὐλός — свирель, флейта (笛). Слав. в скобках «(идяху)»."
  6: "ἅλων Νωδαβ — гумно Надава (слав. «гумно нахорово», в МТ Нахон) — 脱穀場. ἐξέτεινεν τὴν χεῖρα — простёр руку. κατασχεῖν … ἐκράτησεν — удержать … схватил (κατέχω, κρατέω). περιέσπασεν — рванул в сторону (περισπάω), слав. «превращаше»; μόσχος — телёнок (здесь волы)."
  7: "ἐθυμώθη — воспылал гневом (θυμόω); слав. «разгневася гневом». ἔπαισεν — поразил (παίω). У Синод. добавлено «за дерзновение» — из МТ, не внесено."
  8: "ἠθύμησεν — опечалился, пал духом (ἀθυμέω). διέκοψεν διακοπήν — «прорвал прорывом», сокрушил (διακόπτω); слав. «порази поражением». Διακοπὴ Οζα — «прорыв Озы» (オザの破れ), слав. «поражение озино»."
  9: "ἐφοβήθη τὸν κύριον — убоялся Господа (φοβέομαι). πῶς εἰσελεύσεται — «как войдёт»; недоумение передано вопросом どうして…だろうか."
  10: "οὐκ ἐβούλετο — не хотел (βούλομαι). ἐκκλῖναι — уклонить (ἐκκλίνω); слав. «уклони». κιβωτὸς διαθήκης κυρίου — ковчег завета Господня (主の契約の箱). Αβεδδαρα τοῦ Γεθθαίου — Аведдар Гефянин (ガテ人オベデ・エドム); в МТ Овед-Едом (オベデ・エドム)."
  11: "ἐκάθισεν — сел, остался (καθίζω); слав. «стояше». μῆνας τρεῖς — три месяца. εὐλόγησεν — благословил (εὐλογέω)."
  12: "ἀπηγγέλη — было возвещено (ἀπαγγέλλω). ἕνεκεν τῆς κιβωτοῦ τοῦ θεοῦ — ради ковчега Божия. ἐν εὐφροσύνῃ — с веселием (εὐφροσύνη); слав. «в веселии». Слав. «взя» — взял."
  13: "ἦσαν μετ᾽ αὐτῶν αἴροντες — были с ними, несущими (αἴρω). ἑπτὰ χοροί — семь хоров, ликов (χορός); слав. «седмь ликов». θῦμα μόσχος καὶ ἄρνα — жертва: телец и агнец. В МТ и Синод. иное: «через шесть шагов приносили в жертву тельца и откормленного»; у LXX и слав. — семь хоров."
  14: "ἀνεκρούετο — бряцал, играл (ἀνακρούω); слав. «бряцаше». στολὴ ἔξαλλος — превосходная, изящная одежда (ἔξαλλος); в МТ и Синод. — льняной ефод (エフォド), у LXX и слав. иное чтение."
  15: "οἶκος Ισραηλ — дом Израиля, т.е. весь народ. κραυγή — клик, вопль. φωνὴ σάλπιγγος — звук трубы (σάλπιγξ, ラッパ)."
  16: "διέκυπτεν διὰ τῆς θυρίδος — выглядывала в окно (διακύπτω, θυρίς). ὀρχούμενον καὶ ἀνακρουόμενον — пляшущего и играющего. ἐξουδένωσεν — уничижил, презрел (ἐξουδενόω); слав. «уничижи»."
  17: "σκηνή — скиния, шатёр (天幕). ἔπηξεν — поставил, водрузил (πήγνυμι). ὁλοκαυτώματα — всесожжения (燔祭). εἰρηνικάς — мирные жертвы (酬恩祭), слав. «мирная»."
  18: "συνετέλεσεν — окончил (συντελέω). συναναφέρων — принося вместе (συναναφέρω). ἐν ὀνόματι κυρίου τῶν δυνάμεων — именем Господа сил."
  19: "εἰς πᾶσαν τὴν δύναμιν τοῦ Ισραηλ — на всё множество, войско Израиля (δύναμις); слав. «на всю силу израилеву». κολλυρίς — хлебец, лепёшка (слав. «укрух»). ἐσχαρίτης — печёное на жаровне мясо (слав. «часть печенаго мяса»). λάγανον ἀπὸ τηγάνου — лепёшка со сковороды (слав. «сковрадный млин»). ἀπὸ Δαν ἕως Βηρσαβεε — от Дана до Вирсавии (ベエル・シェバ, как в 1 Цар 3:20)."
  20: "ἀπεκαλύφθη — открылся, обнажился (ἀποκαλύπτω). παιδίσκαι τῶν δούλων ἑαυτοῦ — рабыни рабов его. καθὼς ἀποκαλύπτεται … εἷς τῶν ὀρχουμένων — как обнажается один из пляшущих; в МТ и Синод. «как один из пустых» (בְּאַחַד הָרֵקִים) — масоретское чтение, у LXX и слав. «из пляшущих», поэтому 踊る者の一人."
  21: "Ἐνώπιον κυρίου ὀρχήσομαι — «пред Господом плясать буду». εὐλογητὸς κύριος — благословен Господь. καταστῆσαι — поставить (καθίστημι); слав. «поставити мя властелина». παίξομαι — буду играть, веселиться. Кавычки речи открываются здесь и закрываются в 22."
  22: "ἀποκαλυφθήσομαι ἔτι οὕτως — откроюсь ещё так. ἀχρεῖος — негодный, ничтожный (слав. «непотребен»). ὧν εἶπάς με δοξασθῆναι — «о которых ты сказал, что я прославлен» (гр.); слав. читает с отрицанием: «о нихже рекла еси, непрославлену быти ми» — это уникальное слав. чтение, расходящееся и с LXX, и с МТ; по принципу разумного паритета взято положительное чтение LXX/МТ, слав. вариант оставлен здесь; в Синод. «я буду славен»."
  23: "παιδίον — ребёнок (子). ἕως τῆς ἡμέρας τοῦ ἀποθανεῖν αὐτήν — до дня смерти её (слав. «до дне смерти ея»)."
