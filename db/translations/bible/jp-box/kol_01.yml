# jp-box, Послание к Колоссянам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), благодарение и молитва (3–14),
# гимн о Христе (15–20), примирение и служение Павла (21–29).
# Красного и синего нет: прямой речи Христа в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 1:2 — церковное καὶ κυρίου Ἰησοῦ Χριστοῦ; 1:14 — церковное διὰ τοῦ αἵματος
# αὐτοῦ. Оба раза в базе слов нет (проверено запросом к gr-lxx-byz).
# Гимн 15–20 — один период: 16b–20 идут одной фразой через 、 (…のであり、…ており、
# …であられ、…であり、…宿り、…のである), «образ Бога невидимого», «всё создано Им»,
# «Он есть прежде всего» не разорваны на отдельные предложения.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: kol
chapter: 1
draft: true

verses:
  1: "パウロ、神[かみ]の御心[みこころ]によるキリスト・イエスの使徒[しと]である。また、兄弟[きょうだい]テモテとともに、"
  2: "コロサイにいる聖[せい]なる者[もの]たち、すなわち、キリストにあって忠実[ちゅうじつ]な兄弟[きょうだい]たちへ。{恵[めぐ]み|恩寵[おんちょう]}と平和[へいあん]が、わたしたちの父[ちち]である神[かみ]と〔主[しゅ]イエス・キリスト〕から、あなたがたにありますように。"
  3: "わたしたちは、あなたがたのために祈[いの]りながら、いつも、わたしたちの主[しゅ]イエス・キリストの父[ちち]である神[かみ]に感謝[かんしゃ]している。"
  4: "あなたがたがキリスト・イエスにあって持[も]つ信仰[しんこう]と、すべての聖徒[せいと]たちに対[たい]する愛[あい]とを聞[き]き、"
  5: "天[てん]にあなたがたのために蓄[たくわ]えられている希望[きぼう]のゆえに、感謝[かんしゃ]しているのである。あなたがたは、その希望[きぼう]を、福音[ふくいん]の真理[しんり]の言葉[ことば]によってすでに聞[き]いていたのである。"
  6: "この福音[ふくいん]は、あなたがたのところにも届[とど]いている。全世界[ぜんせかい]でそうであるように、あなたがたの間[あいだ]でも、それを聞[き]いて神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}を真理[しんり]のうちに知[し]ったその日[ひ]から、実[み]を結[むす]び、育[そだ]っているのである。"
  7: "あなたがたは、わたしたちの愛[あい]する同労者[どうろうしゃ]であり、わたしたちのためにキリストに仕[つか]える忠実[ちゅうじつ]な奉仕者[ほうししゃ]であるエパフラスから、そのことを学[まな]んだのである。"
  8: "この人[ひと]が、あなたがたの{聖霊[せいれい]|聖神[せいしん]}による愛[あい]を、わたしたちに知[し]らせてくれたのである。"
  9: "それゆえ、わたしたちも、それを聞[き]いたその日[ひ]から、あなたがたのために祈[いの]り、願[ねが]うことをやめない。あなたがたが、あらゆる知恵[ちえ]と霊的[れいてき]な悟[さと]りとをもって、神[かみ]の御心[みこころ]についての知識[ちしき]に満[み]たされ、"
  10: "主[しゅ]にふさわしく歩[あゆ]み、すべての点[てん]で主[しゅ]を喜[よろこ]ばせ、すべての善[よ]い業[わざ]に実[み]を結[むす]び、神[かみ]についての知識[ちしき]において育[そだ]ち、"
  11: "あらゆる力[ちから]をもって強[つよ]められ、その栄光[えいこう]の権能[けんのう]に従[したが]って、あらゆる忍耐[にんたい]と寛容[かんよう]とを喜[よろこ]びをもって持[も]ち、"
  12: "光[ひかり]のうちにある聖徒[せいと]たちの嗣業[しぎょう]の分[ぶん]にあなたがたを預[あず]からせてくださった父[ちち]に、感謝[かんしゃ]しつつ、"
  13: "神[かみ]はわたしたちを闇[やみ]の支配[しはい]から救[すく]い出[だ]し、その愛[あい]する御子[みこ]の国[くに]へと移[うつ]してくださった。"
  14: "この方[かた]にあって、わたしたちは〔その血[ち]によって、〕贖[あがな]い、すなわち罪[つみ]の赦[ゆる]しを得[え]ているのである。"
  15: "この方[かた]は、見[み]えない神[かみ]の像[かたち]であり、すべての造[つく]られたものの先[さき]に生[う]まれた者[もの]である。"
  16: "というのは、天[てん]にあるものも地[ち]にあるものも、見[み]えるものも見[み]えないものも、王座[おうざ]も支配[しはい]も首[しゅ]領[りょう]も権威[けんい]も、すべてはこの方[かた]によって造[つく]られたからである。すべてはこの方[かた]によって、またこの方[かた]のために造[つく]られたのであり、"
  17: "この方[かた]はすべてに先[さき]立[だ]っておられ、すべてはこの方[かた]にあって成[な]り立[た]っており、"
  18: "この方[かた]は、その体[からだ]である教会[きょうかい]の頭[かしら]であられ、初[はじ]めであり、死者[ししゃ]の中[なか]から先[さき]に生[う]まれた者[もの]であり、すべてにおいてご自身[じしん]が先[さき]立[だ]つ者[もの]となるためであり、"
  19: "すべての満[み]ち満[み]ちたものがこの方[かた]のうちに宿[やど]り、"
  20: "その十字架[じゅうじか]の血[ち]によって平和[へいわ]を成[な]し遂[と]げ、地[ち]にあるものも天[てん]にあるものも、すべてをこの方[かた]によってご自身[じしん]と和解[わかい]させることに、み心[こころ]にかなったのである。"
  21: "あなたがたもまた、かつては遠[とお]く離[はな]れ、思[おも]いのうちで悪[あ]しき行[おこな]いによって敵[てき]となっていた者[もの]であったが、"
  22: "しかし今[いま]は、その肉[にく]の体[からだ]において、死[し]によって和解[わかい]させられたのである。それは、あなたがたを、聖[せい]なる者[もの]、傷[きず]のない者[もの]、責[せ]められるところのない者[もの]として、ご自身[じしん]の御前[みまえ]に立[た]たせるためである。"
  23: "ただし、あなたがたが信仰[しんこう]の上[うえ]に据[す]えられ、固[かた]く立[た]ち、聞[き]いた福音[ふくいん]の希望[きぼう]から動[うご]かされないでいるなら、そうなるのである。この福音[ふくいん]は、天[てん]の下[した]のすべての造[つく]られたものに宣[の]べ伝[つた]えられたものであり、わたしパウロは、その奉仕[ほうし]を担[にな]う者[もの]となったのである。"
  24: "今[いま]、わたしはあなたがたのために受[う]ける苦[くる]しみを喜[よろこ]んでいる。キリストの患難[かんなん]の足[た]りないところを、その体[からだ]である教会[きょうかい]のために、わたしの肉[にく]において補[おぎな]っているのである。"
  25: "わたしは、あなたがたのためにわたしに授[さず]けられた神[かみ]の経綸[けいりん]に従[したが]って、教会[きょうかい]の奉仕[ほうし]を担[にな]う者[もの]となった。それは、神[かみ]の言葉[ことば]を全[まっと]うするためである。"
  26: "その言葉[ことば]とは、世々[よよ]の代々[だいだい]にわたって隠[かく]され、今[いま]は神[かみ]の聖徒[せいと]たちに示[しめ]された奥義[おうぎ]のことである。"
  27: "神[かみ]は、この奥義[おうぎ]の栄光[えいこう]の富[とみ]が異邦人[いほうじん]の間[あいだ]でどれほど豊[ゆた]かなものであるかを、聖徒[せいと]たちに知[し]らせようと望[のぞ]まれた。この奥義[おうぎ]とは、あなたがたのうちにおられるキリスト、栄光[えいこう]の希望[きぼう]である。"
  28: "わたしたちはこの方[かた]を宣[の]べ伝[つた]え、あらゆる人[ひと]を諭[さと]し、あらゆる人[ひと]をあらゆる知恵[ちえ]をもって教[おし]え、すべての人[ひと]をキリストにあって完全[かんぜん]な者[もの]として立[た]たせようとしているのである。"
  29: "そのために、わたしは労[ろう]して戦[たたか]っている。この方[かた]がわたしのうちに力[ちから]をもって働[はたら]いておられる、その働[はたら]きに従[したが]ってのことである。"

notes:
  1: "Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ — без глагола, ср. Еф 1:1. διὰ θελήματος θεοῦ — 神の御心による. ὁ ἀδελφός — 兄弟テモテ; не кровное родство, а соработник, поэтому 兄弟[きょうだい], как в корпусе."
  2: "τοῖς ἐν Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ — コロサイにいる聖なる者たち、キリストにあって忠実な兄弟たち. В базе приветствие кончается на πατρὸς ἡμῶν: καὶ κυρίου Ἰησοῦ Χριστοῦ нет (проверено: κυρι- в стихе — 0). Церковный текст (Елизаветинская «и Господа Иисуса Христа», jp-joc「及び主イイススハリストスより」) читает с ним — 〔主イエス・キリスト〕. χάρις καὶ εἰρήνη — формула приветствия (ср. Рим 1:7, 1 Кор 1:3)."
  3: "Εὐχαριστοῦμεν — 1 л. мн. ч. (Павел и Тимофей). πάντοτε περὶ ὑμῶν προσευχόμενοι — あなたがたのために祈りながら、いつも."
  4: "ἀκούσαντες — причастие к εὐχαριστοῦμεν (3). πίστις ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにあって持つ信仰. εἰς πάντας τοὺς ἁγίους — すべての聖徒たちに対する."
  5: "διὰ τὴν ἐλπίδα — 希望のゆえに; причина благодарения. ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς — 天にあなたがたのために蓄えられている. προηκούσατε — すでに聞いていた. ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου — 福音という真理の言葉によって."
  6: "τοῦ παρόντος εἰς ὑμᾶς — «дошедшего до вас»; 届いている. καρποφορούμενον καὶ αὐξανόμενον — 全世界でそうであるように (букв. «принося плод и возрастая»; повтор второго причастия в японском снят, ср. 1:10). ἀφ᾽ ἧς ἡμέρας — その日から."
  7: "Ἐπαφρᾶς — エパフラス (сокращение от Ἐπαφρόδιτος). σύνδουλος — 同労者. В базе πιστὸς ὑπὲρ ἡμῶν διάκονος; jp-joc читает ὑπὲρ ὑμῶν («爾等の爲に») — оставлено по базе: わたしたちのために. διάκονος здесь не церковная должность, поэтому 奉仕者, а не 執事 (ср. Еф 6:21)."
  8: "ἐν πνεύματι — 聖霊による (не человеческим духом); калька {聖霊|聖神}."
  9: "Διὰ τοῦτο — それゆえ. οὐ παυόμεθα προσευχόμενοι καὶ αἰτούμενοι — 祈り、願うことをやめない. πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ — 御心についての知識に満たされる. σοφία καὶ σύνεσις πνευματική — 知恵と霊的な悟り."
  10: "περιπατῆσαι ἀξίως τοῦ κυρίου — 主にふさわしく歩む. εἰς πᾶσαν ἀρεσκείαν — すべての点で主を喜ばせる. ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες — すべての善い業に実を結び. αὐξανόμενοι τῇ ἐπιγνώσει τοῦ θεοῦ — 神についての知識において育ち."
  11: "δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ — その栄光の権能に従って強められ. ὑπομονή — 忍耐, μακροθυμία — 寛容. μετὰ χαρᾶς — 喜びをもって (относится к дальнейшему, 12)."
  12: "ἱκανώσαντι ὑμᾶς — в базе ὑμᾶς; jp-joc читает ἡμᾶς («我等を」) — оставлено по базе: あなたがたを. μερὶς τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί — 光のうちにある聖徒たちの嗣業の分. εὐχαριστοῦντες — 感謝しつつ (причастие, тянется к 11)."
  13: "ἐρρύσατο — 救い出した. μετέστησεν — 移した. υἱὸς τῆς ἀγάπης αὐτοῦ — その愛する御子."
  14: "В базе нет διὰ τοῦ αἵματος αὐτοῦ (проверено: αἱμ- в стихе — 0); церковный текст (Елизаветинская «Кровию Его», jp-joc「其の血を用て」) читает с ним — 〔その血によって〕. ἀπολύτρωσις — 贖い; ἄφεσις τῶν ἁμαρτιῶν — 罪の赦し (второе уточняет первое)."
  15: "εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου — 見えない神の像. πρωτότοκος πάσης κτίσεως — すべての造られたものの先に生まれた者 (род. сравнения: первенец прежде всякого творения, а не «первый из твари»)."
  16: "ὅτι — というのは…からである. ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα — 天にあるものも地にあるものも、見えるものも見えないものも. θρόνοι, κυριότητες, ἀρχαί, ἐξουσίαι — 王座・支配・首領・権威 (чины ангельские; ср. Еф 1:21). τὰ πάντα δι᾽ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται — すべてはこの方によって、またこの方のために造られた."
  17: "πρὸ πάντων — すべてに先立って (先[さき]立[だ]って). συνέστηκεν — 成り立っている (perfect: стоит и держится)."
  18: "κεφαλὴ τοῦ σώματος, τῆς ἐκκλησίας — 体である教会の頭. ἀρχή — 初め (и начало, и первенство). πρωτότοκος ἐκ τῶν νεκρῶν — 死者の中から先に生まれた者. ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων — すべてにおいてご自身が先立つ者となるため."
  19: "πᾶν τὸ πλήρωμα — すべての満ち満ちたもの (не «полнота Божества» — это 2:9). εὐδόκησεν — み心にかなった."
  20: "ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν — すべてをご自身と和解させる. εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ — その十字架の血によって平和を成し遂げ. [δι᾽ αὐτοῦ] стоит в базе в квадратных скобках — слово есть, 〔〕 не ставится."
  21: "ἀπηλλοτριωμένους — 遠く離れ. ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς — 思いのうちで悪しき行いによって敵."
  22: "νυνὶ δέ — しかし今は. ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου — その肉の体において、死によって. παραστῆσαι — 立たせる (цель; それは…ためである). ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους — 聖なる者、傷のない者、責められるところのない者."
  23: "εἴ γε — ただし…なら. τεθεμελιωμένοι καὶ ἑδραῖοι — 据えられ、固く立ち. ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν — 天の下のすべての造られたもの. διάκονος — 奉仕を担う者 (ср. 1:7)."
  24: "ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ — キリストの患難の足りないところを補う; образ не сглажен. ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία — その体である教会のために."
  25: "οἰκονομία τοῦ θεοῦ — 神の経綸 (ср. Еф 1:10; 3:2; пояснено сноской при первом месте в корпусе). πληρῶσαι τὸν λόγον τοῦ θεοῦ — 神の言葉を全うする."
  26: "μυστήριον ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν — 世々の代々にわたって隠された奥義. νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ — 今は神の聖徒たちに示された."
  27: "τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν — この奥義の栄光の富が異邦人の間で (τὸ πλοῦτος — существительное, не прилагательное). ὃ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης — あなたがたのうちにおられるキリスト、栄光の希望."
  28: "νουθετοῦντες… διδάσκοντες πάντα ἄνθρωπον — повтор «всякого человека» сохранён. ἐν πάσῃ σοφίᾳ — あらゆる知恵をもって. τέλειος ἐν Χριστῷ — キリストにあって完全な者."
  29: "κοπιῶ ἀγωνιζόμενος — 労して戦っている. κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει — わたしのうちに力をもって働いておられる、その働きに従って."
