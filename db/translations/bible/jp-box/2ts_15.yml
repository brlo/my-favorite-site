# jp-box, 2-я Царств, глава 15. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 15: колесницы и льстивый суд Авессалома (1–6), обет в Хевроне и заговор
# (7–12), весть Давиду и бегство из Иерусалима (13–18), Еффей и его ответ (19–22),
# поток Кедрон (23), ковчег и Садок (24–29), восход на Масличную гору (30),
# молитва о совете Ахитофела (31), Хусий и поручение (32–37).
# Речь — 「…」: Авессалом (7–8, 10), Давид (9, 14, 19–20, 22, 25–26, 27–28, 31,
# 33–36), слуги царя (15), вестник (13), Еффей (21). В 10 внутри речи —
# 『…』 (возглас о воцарении), в 34 — 『…』 (что сказать Авессалому).
# Непрерывная речь Давида 19–20, 25–26, 27–28 и 33–36 не закрывается на границах
# стихов.
# Красного нет.
# Гл. 15 — по новому паритету. Слав. добавления внесены в основной текст без 〔…〕:
# 15:22 «и царь», 15:25 «и да станет на месте своём» (в LXX их нет — отмечено в notes).
# Наоборот, в 15:18 и 15:20 LXX пространнее csl: повтор в LXX переведён, разница
# отмечена в notes. Где csl и LXX дают разные слова (15:15, 15:28, 15:35), взят csl,
# вариант LXX — в notes. 〔…〕 не ставим.
# Сносок ⟨…⟩ нет: 契約の箱, 祭司, 側女, 戦車, 密偵 уже в корпусе.
# jp-ni не использовался.

