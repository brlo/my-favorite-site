verses:
  1: "その後[あと]、アブサロムは自分のために戦車[せんしゃ]と馬[うま]を用意[ようい]し、自分の前[まえ]を走[はし]る者[もの]を五十人[ごじゅうにん]置[お]いた。"
  2: "アブサロムは朝早[あさはや]く起[お]きて、門[もん]への道[みち]のそばに立[た]った。裁[さば]きのために王のところへ来[く]る男[おとこ]がだれでも、アブサロムはその者に呼[よ]びかけて言[い]った。「あなたはどの町[まち]の者か。」その男は答[こた]えた。「イスラエルの部族[ぶぞく]の一つから来た、あなたの僕[しもべ]だ。」"
  3: "アブサロムは彼に言った。「見よ、あなたの言い分[いいぶん]は良[よ]いし、正[ただ]しい。しかし、あなたの話[はなし]を聞[き]いてくれる者が、王のもとにいないのだ。」"
  4: "アブサロムは言った。「だれがわたしをこの地[ち]の裁[さば]き手[て]にしてくれるのか。争[あらそ]いや裁きのある者はだれでもわたしのところへ来るがよい。わたしがその者を正[ただ]しいと認[みと]めてやろう。」"
  5: "だれかが近[ちか]づいて彼に礼[れい]をしようとすると、彼は手[て]を差[さ]し伸[の]べてその者を抱[だ]き、口[くち]づけした。"
  6: "アブサロムは、裁きのために王のところへ来るイスラエルのすべての者[もの]にこのようにした。アブサロムはイスラエルの人[ひと]々[びと]の心[こころ]を自分[じぶん]のものに引[ひ]き寄[よ]せた。"
  7: "四十年[よんじゅうねん]の終[お]わりに、アブサロムは父[ちち]に言った。「わたしはヘブロンへ行[い]って、主[しゅ]に立[た]てたわたしの誓願[せいがん]を果[は]たす。"
  8: "あなたの僕[しもべ]は、シリアのゲシュルに住[す]んでいたとき、誓願を立[た]てた。『もし主がわたしをエルサレムへ連[つ]れ戻[もど]してくださるなら、わたしは主に仕[つか]える』と。」"
  9: "王は彼に言った。「平安[へいあん]のうちに行[い]きなさい。」彼は立ってヘブロンへ行った。"
  10: "アブサロムはイスラエルのすべての部族[ぶぞく]に密偵[みってい]たちを送[おく]って言った。「あなたがたが角笛[つのぶえ]の音[ね]を聞[き]いたなら、『アブサロム王[おう]がヘブロンで王となった』と言[い]え。」"
  11: "アブサロムとともにエルサレムから二百人[にひゃくにん]の男[おとこ]たちが行[い]った。彼らは招[まね]かれて行ったのであり、何[なに]も知[し]らずに、自分[じぶん]の純朴[じゅんぼく]さのままに行ったのだった。"
  12: "アブサロムは人を送って、ダビデの顧問[こもん]であったギロ人[びと]アヒトフェルを、彼の町[まち]ギロから呼[よ]んだ。アブサロムがいけにえをささげていたときのことであった。陰謀[いんぼう]は強[つよ]くなり、民[たみ]は多[おお]く、アブサロムとともに行った。"
  13: "ダビデのもとへ知[し]らせを持[も]って来[く]る者[もの]が来て言った。「イスラエルの人々[ひとびと]の心はアブサロムの後[あと]についた。」"
  14: "ダビデは、自分とともにエルサレムにいるすべての家来[けらい]たちに言った。「立[た]って、逃[に]げよう。アブサロムの前[まえ]から逃[のが]れるすべは、わたしたちにはない。急[いそ]いで行[い]け。彼が急いで追[お]いつき、わたしたちを捕[つか]まえ、わたしたちに災[わざわ]いを及[およ]ぼし、剣[けん]の刃[は]でこの町[まち]を打[う]たないうちに。」"
  15: "王の家来たちは王に言った。「ご主人[しゅじん]である王が命[めい]じられるすべてのことに、ご覧[らん]ください、あなたの家来たちは従[したが]う。」"
  16: "王は家[いえ]のすべての者[もの]とともに、自分[じぶん]たちの足[あし]で出[で]て行[い]った。王は十人[じゅうにん]の側女[そばめ]を残[のこ]して、家を守[まも]らせた。"
  17: "王と家来たちは皆[みな]、徒歩[とほ]で出て行き、遠[とお]く離[はな]れた家のところで立[た]ち止[ど]まった。"
  18: "王の家来たちは皆、王の左右[さゆう]に分[わ]かれて進[すす]んだ。ヘテ人[じん]もペレテ人も皆、荒[あ]れ野[の]のオリーブの木[き]のところに立った。民[たみ]は皆、彼のそばを進み、彼の周[まわ]りの者も、屈強[くっきょう]な者も、すべての戦士[せんし]も、六百人[ろっぴゃくにん]の者が彼の傍[かたわ]らにいた。ケレテ人もペレテ人も皆、ガテ人[じん]も皆、六百人の者が、徒歩でガテから来て、王の前[まえ]を進んだ。"
  19: "王はガテ人イッタイに言った。「なぜ、あなたもわたしたちと一緒[いっしょ]に行[い]くのか。帰[かえ]って、王とともに住[す]みなさい。あなたは外国人[がいこくじん]であり、自分の場所[ばしょ]から移[うつ]って来た者だから。"
  20: "あなたは昨日[きのう]来[き]たばかりではないか。今日[きょう]、わたしはあなたをわたしたちとともに動[うご]かし、あなたの場所を移[うつ]すというのか。昨日あなたは出[で]て来たばかりなのに、今日、わたしはあなたをわたしたちとともに動かして行[い]かせようというのか。わたしは、わたしが行くところへ行く。帰りなさい。あなたの兄弟[きょうだい]たちをあなたとともに帰しなさい。主[しゅ]があなたとともに、恵[めぐ]みと真実[しんじつ]を行[おこな]ってくださるように。」"
  21: "イッタイは王に答[こた]えて言った。「主は生[い]きておられる。ご主人である王も生きておられる。ご主人である王がどこにおられても、死[し]にあっても生[いのち]にあっても、そこにあなたの僕[しもべ]がいる。」"
  22: "王はイッタイに言った。「さあ、わたしとともに渡[わた]りなさい。」ガテ人イッタイは、自分の家来たちすべてと、彼とともにいるすべての群衆[ぐんしゅう]とともに渡った。王も渡[わた]った。"
  23: "全[ぜん]地[ち]は大[おお]きな声[こえ]で泣[な]いていた。民は皆、キデロン川[がわ]のほとりを進[すす]み、王もキデロン川を渡った。民も王も皆、荒れ野へ向[む]かう道[みち]を進んだ。"
  24: "見[み]よ、サドクと、彼とともにいるすべてのレビ人[びと]も、主[しゅ]の契約[けいやく]の箱[はこ]をベタルから運[はこ]んで来[き]て、神[かみ]の箱を置[お]いた。アビアタルは、民が皆町[まち]から出[で]て行き終[お]えるまで、上[のぼ]って行った。"
  25: "王はサドクに言った。「神の箱を町へ戻[もど]し、それをその場所[ばしょ]に据[す]えなさい。もしわたしが主の目[め]に恵[めぐ]みを得[え]るなら、主はわたしを連れ戻し、その箱とその美[うつく]しさを見[み]せてくださるだろう。"
  26: "しかし、もし主が『わたしはあなたを喜[よろこ]ばない』と言われるなら、見よ、わたしはここにいる。主がご自分の目に良[よ]いと思[おも]われることを、わたしにしてくださればよい。」"
  27: "王は祭司[さいし]サドクに言った。「見[み]なさい。あなたは平安[へいあん]のうちに町へ戻りなさい。あなたの子[こ]アヒマアスと、アビアタルの子ヨナタン、あなたがたの二人[ふたり]の子も、あなたがたとともにいる。"
  28: "見なさい、わたしは荒れ野のアラバに身[み]を落[お]ち着[つ]けている。あなたがたから、わたしに知[し]らせる言葉[ことば]が届[とど]くまで。」"
  29: "サドクとアビアタルは箱をエルサレムへ戻[もど]し、そこにとどまった。"
  30: "ダビデはオリーブ山[やま]の上[のぼ]り道[みち]を、泣[な]きながら上って行った。頭[あたま]を覆[おお]い、裸足[はだし]で歩[あゆ]んだ。彼とともにいる民は皆、それぞれ頭を覆い、泣きながら上って行った。"
  31: "ダビデに知らせが届[とど]いて言った。「アヒトフェルも、アブサロムとともに謀[はか]る者[もの]たちの中にいる。」ダビデは言った。「主[しゅ]よ、わたしの神よ、どうかアヒトフェルの計略[けいりゃく]を打[う]ち砕[くだ]いてください。」"
  32: "ダビデがロオスまで来[き]て、そこで神を拝[おが]んだとき、見よ、ダビデの友[とも]であるアルキ人[びと]フシャイが、衣[ころも]を裂[さ]き、頭[あたま]に土[つち]を載[の]せて、彼を迎[むか]えに出[で]て来[き]た。"
  33: "ダビデは彼に言った。「もしあなたがわたしとともに渡[わた]るなら、あなたはわたしの重荷[おもに]になる。"
  34: "しかし、もしあなたが町へ戻[もど]るなら、アブサロムにこう言いなさい。『あなたの兄弟[きょうだい]たちは過[す]ぎ去[さ]り、王であるあなたの父[ちち]もわたしの後[あと]ろを過ぎ去った。今、王よ、わたしはあなたの僕[しもべ]だ。どうか、わたしを生[い]かしておいてください。以前も今に至[いた]るまで、わたしはあなたの父の僕だった。今からはわたしがあなたの僕だ』と。そうすれば、あなたはわたしのためにアヒトフェルの計略[けいりゃく]を砕[くだ]いてくれる。"
  35: "見よ、そこであなたとともに祭司[さいし]サドクとアビアタルがいる。あなたが王[おう]の口[くち]から聞[き]くことは何[なに]でも、祭司サドクとアビアタルに知[し]らせなさい。"
  36: "見よ、彼らとともに二人[ふたり]の子がいる。サドクの子アヒマアスと、アビアタルの子ヨナタンである。あなたがたが聞くことは何でも、彼らの手[て]によってわたしに送[おく]りなさい。」"
  37: "ダビデの友フシャイは町へ入[はい]って行った。そのとき、アブサロムはエルサレムへ入って行こうとしていた。"

notes:
  1: "ἅρματα καὶ ἵππους — колесницы и коней. παρατρέχειν ἔμπροσθεν — «бежать впереди» (скороходы)."
  2: "ὤρθρισεν — встал рано (ὀρθρίζω). ἀνὰ χεῖρα τῆς ὁδοῦ τῆς πύλης — «при дороге у ворот». ᾧ ἐγένετο κρίσις — «у кого было дело (тяжба)». Ἐκ μιᾶς φυλῶν Ισραηλ — «из одного из племён Израиля»."
  3: "εὔκολοι — «удобные», т. е. правые, лёгкие для решения. ἀκούων οὐκ ἔστιν σοι παρὰ τοῦ βασιλέως — «нет у тебя слушающего от царя»."
  4: "καταστήσει — поставит. ἀντιλογία — спор, пререкание. δικαιώσω — «оправдаю», т. е. рассужу в его пользу."
  5: "ἐν τῷ ἐγγίζειν ἄνδρα — «когда приближался человек». ἐξέτεινεν τὴν χεῖρα — протягивал руку. ἐπελαμβάνετο — брал (обнимал) его."
  6: "ἰδιοποιεῖτο τὴν καρδίαν — «присваивал себе сердце» (ἰδιοποιέομαι); слав. «приусвои сердца»."
  7: "ἀπὸ τέλους τεσσαράκοντα ἐτῶν — «по истечении сорока лет»; в ru уточнено «царствования Давида», в LXX и csl без уточнения. ἀποτείσω τὰς εὐχάς — «воздам обеты»."
  8: "εὐχὴν ηὔξατο — «обет дал» (внутренний объект). ἐν τῷ οἰκεῖν με — «когда я жил». ἐπιστρέφων ἐπιστρέψῃ — усиленное «возвратит». λατρεύσω — послужу."
  9: "Βάδιζε εἰς εἰρήνην — «иди с миром»."
  10: "κατασκόπους — соглядатаев, лазутчиков. κερατίνη — рог (труба из рога); слав. «труба рожана». Βεβασίλευκεν — «воцарился» (perfect)."
  11: "κλητοί — званые. τῇ ἁπλότητι αὐτῶν — «в простоте своей». οὐκ ἔγνωσαν πᾶν ῥῆμα — «не знали ни одного слова (дела)»."
  12: "σύμβουλον — советник. Γελμωναῖος — гилонянин (из Гило); слав. «галамонийский». σύστρεμμα ἰσχυρόν — «сильное скопище (заговор)»; слав. «смятение крепко». ἐν τῷ θυσιάζειν αὐτόν — «когда он приносил жертвы»."
  13: "ἡ καρδία ἀνδρῶν Ισραηλ ὀπίσω Αβεσσαλωμ — «сердце мужей Израиля за Авессаломом»."
  14: "ταχύνατε τοῦ πορευθῆναι — «поспешите идти». ἐξώσῃ ἐφ᾽ ἡμᾶς τὴν κακίαν — «наведёт на нас зло». στόματι μαχαίρης — «устами меча», т. е. остриём."
  15: "αἱρεῖται — «избирает, предпочитает»; слав. «заповесть» (повелит) — иное понимание, в тексте 命じられる по csl."
  16: "τοῖς ποσὶν αὐτῶν — «ногами своими», т. е. пешком. παλλακάς — наложницы (側女)."
  17: "πεζῇ — пешком. ἐν οἴκῳ τῷ μακράν — «в доме дальнем»; в ru «у Беф-Мерхата» (МТ), у LXX и csl — «дом вдали»."
  18: "ἀνὰ χεῖρα αὐτοῦ — «по обе стороны его». ὁ χεττι καὶ ὁ φελετθι — в LXX искажённые имена царских телохранителей (обычно χερεθθι/φελετθι, ケレテ人とペレテ人); ниже они же названы полностью. ἐπὶ τῆς ἐλαίας ἐν τῇ ἐρήμῳ — «у маслины в пустыне»; слав. эту часть опускает. ἁδροί — крепкие, сильные. Γεθθαῖοι — гефяне, уроженцы Гефа."
  19: "Ἵνα τί πορεύῃ …; — «зачем идёшь?» ἐπίστρεφε καὶ οἴκει μετὰ τοῦ βασιλέως — «возвратись и живи с царём» (с каким — неясно; ср. ru «с тем царём»). ξένος — чужеземец. μετῴκηκας — «переселился»."
  20: "εἰ ἐχθὲς παραγέγονας — «если вчера пришёл». κινήσω σε — «подвигну тебя». μεταναστήσεις τὸν τόπον σου — «переместишь место твоё». В LXX две сходные фразы (повтор), в csl одна; переведены обе."
  21: "Ζῇ κύριος καὶ ζῇ ὁ κύριός μου — двойная клятва. εἰς θάνατον καὶ εἰς ζωήν — «в смерть и в жизнь»."
  22: "Δεῦρο καὶ διάβαινε — «иди и переходи». Слав. добавляет «и царь» («прейде еффей… и царь и вси отроцы его»); в LXX этого нет, но по паритету внесено в текст."
  23: "χειμάρρους Κεδρων — поток Кедрон. ἐπὶ πρόσωπον ὁδοῦ τὴν ἔρημον — «к лицу пути пустынного», т. е. по дороге в пустыню."
  24: "κιβωτὸς διαθήκης κυρίου — ковчег завета Господня. ἀπὸ Βαιθαρ — «из Вефара» (Βαιθαρ). ἀνέβη Αβιαθαρ — «взошёл Авиафар»; в ru «стоял на возвышении» (МТ). ἕως ἐπαύσατο … παρελθεῖν — «пока не перестал народ проходить»."
  25: "Ἀπόστρεψον — возврати. εὗρω χάριν ἐν ὀφθαλμοῖς κυρίου — «обрету благодать пред очами Господа». εὐπρέπεια — благолепие, красота. Слав. добавляет «и да станет на месте своём»; в LXX этого нет, по паритету внесено в текст."
  26: "Οὐκ ἠθέληκα ἐν σοί — «не благоволил в тебе», т. е. нет Моего благоволения. ποιείτω μοι κατὰ τὸ ἀγαθὸν ἐν ὀφθαλμοῖς αὐτοῦ — «пусть делает мне по благому в очах Его»."
  27: "Ἴδετε — «смотрите». ἐπιστρέφεις … ἐν εἰρήνῃ — «возвращаешься в мире». οἱ δύο υἱοὶ ὑμῶν — «два сына ваши»."
  28: "στρατεύομαι — «стою лагерем» (LXX); слав. «вселяюся» — в тексте по csl (身を落ち着けている). ἐν αραβωθ τῆς ἐρήμου — «в Аравоф пустыни», т. е. на пустынной равнине (Арава). ἕως τοῦ ἐλθεῖν ῥῆμα — «до прихода слова»."
  29: "ἀπέστρεψεν … τὴν κιβώτον — возвратили ковчег. ἐκάθισεν — остались, «сели»."
  30: "ἐν τῇ ἀναβάσει τῶν ἐλαιῶν — «на восходе (подъёме) маслин», т. е. на Масличной горе. ἐπικεκαλυμμένος — с покрытой головой. ἀνυπόδετος — босой. ἀναβαίνοντες καὶ κλαίοντες — «восходя и плача» (усилительный повтор)."
  31: "ἀνηγγέλη — возвещено. ἐν τοῖς συστρεφομένοις — «среди совещающихся (заговорщиков)». Διασκέδασον τὴν βουλὴν — «расстрой (разрушь) совет»."
  32: "ἕως τοῦ Ροως — «до Роса» (евр. «голова, вершина»). εἰς ἀπαντὴν αὐτῷ — «навстречу ему». ὁ Αρχι — архитянин. γῆ ἐπὶ τῆς κεφαλῆς — «земля (прах) на голове» (знак скорби)."
  33: "εἰς βάσταγμα — «в тягость» (βάσταγμα — ноша)."
  34: "Διεληλύθασιν οἱ ἀδελφοί σου — «прошли братья твои». ἔασόν με ζῆσαι — «позволь мне жить». παῖς τοῦ πατρός σου ἤμην τότε καὶ ἀρτίως — «я был рабом отца твоего тогда и доныне». διασκεδάσεις — «расстроишь»."
  35: "ἔσται πᾶν ῥῆμα ὃ ἐὰν ἀκούσῃς — «будет всякое слово, которое услышишь». ἐξ οἴκου τοῦ βασιλέως — «из дома царя» (LXX); слав. «из уст царских» — в тексте по csl."
  36: "ἐν χειρὶ αὐτῶν — «рукою их», т. е. через них."
  37: "εἰσεπορεύετο — «входил» (imperfect, действие в процессе)."
