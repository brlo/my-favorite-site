verses:
  1: "ペカの子[こ]レマリヤの第十[だいじゅう]七[なな]年[ねん]に、ヨタムの子[こ]アハズがユダの王[おう]となった。"
  2: "アハズは二十[にじゅう]歳[さい]で王[おう]となり、エルサレムで十六[じゅうろく]年[ねん]治[おさ]めた。彼[かれ]は、父[ちち]ダビデのように、その神[かみ]である主[しゅ]の目[め]に正[ただ]しいことを忠実[ちゅうじつ]に行[おこな]わなかった。"
  3: "彼[かれ]はイスラエルの王[おう]ヤロブアムの道[みち]を歩[あゆ]み、さらに自分[じぶん]の子[こ]を火[ひ]の中[なか]に通[とお]らせた。主[しゅ]がイスラエルの子[こ]らの前[まえ]から追[お]い払[はら]われた異邦[いほう]の民[たみ]の忌[い]むべき行[おこな]いにならったのである。"
  4: "また、高[たか]い所[ところ]や丘[おか]の上[うえ]、またすべての茂[しげ]った木[き]の下[した]で、犠牲[ぎせい]をささげ、香[こう]をたいた。"
  5: "そのとき、シリアの王[おう]レツィンと、イスラエルの王[おう]、レマリヤの子[こ]ペカが、エルサレムに攻[せ]め上[のぼ]って戦[たたか]いを仕[しか]かけ、アハズを包囲[ほうい]したが、攻[せ]め落[おと]とすことはできなかった。"
  6: "そのころ、シリアの王[おう]レツィンはエラトをシリアに取[と]り戻[もど]し、ユダの人[ひと]々[びと]をエラトから追[お]い出[だ]した。エドムの人[ひと]々[びと]がエラトに来[き]て、今日[きょう]までそこに住[す]んでいる。"
  7: "アハズは使[つか]いをアッシリアの王[おう]ティグラト・ピレセルに遣[つか]わして言[い]った。「わたしはあなたのしもべ、あなたの子[こ]だ。上[のぼ]って来[き]て、わたしに立[た]ち向[む]かうシリアの王[おう]の手[て]と、イスラエルの王[おう]の手[て]から、わたしを救[すく]い出[だ]してほしい。」"
  8: "アハズは、主[しゅ]の家[いえ]と王[おう]の家[いえ]の宝[たから]の中[なか]に見[み]つかった銀[ぎん]と金[きん]を取[と]り、アッシリアの王[おう]に贈[おく]り物[もの]として送[おく]った。"
  9: "アッシリアの王[おう]は彼[かれ]の言葉[ことば]を聞[き]き入[い]れ、ダマスコに攻[せ]め上[のぼ]ってこれを取[と]り、その住民[じゅうみん]を移[うつ]し、レツィンを殺[ころ]した。"
  10: "アハズ王[おう]は、アッシリアの王[おう]ティグラト・ピレセルに会[あ]うためにダマスコへ行[い]き、ダマスコにある祭壇[さいだん]を見[み]た。そこでアハズ王[おう]は、その祭壇[さいだん]の形[かたち]と作[つく]り方[かた]のすべてを描[えが]いたものを、祭司[さいし]ウリヤのもとへ送[おく]った。"
  11: "祭司[さいし]ウリヤは、アハズ王[おう]がダマスコから送[おく]ってよこしたすべてのとおりに、祭壇[さいだん]を造[つく]った。"
  12: "王[おう]はダマスコから来[き]て祭壇[さいだん]を見[み]ると、その祭壇[さいだん]に上[のぼ]った。"
  13: "そして、自分[じぶん]の燔祭[はんさい]と自分[じぶん]の犠牲[ぎせい]と自分[じぶん]の注[そそ]ぎの供[そな]えを香[こう]でたき、自分[じぶん]の酬恩祭[しゅうおんさい]の血[ち]をこの祭壇[さいだん]に注[そそ]ぎかけた。"
  14: "また、主[しゅ]の前[まえ]にあった青銅[せいどう]の祭壇[さいだん]を、主[しゅ]の家[いえ]の前[まえ]から、すなわち祭壇[さいだん]と主[しゅ]の家[いえ]の間[あいだ]から取[と]り外[はず]して、祭壇[さいだん]の北[きた]の側面[そくめん]に置[お]いた。"
  15: "アハズ王[おう]は祭司[さいし]ウリヤに命[めい]じて言[い]った。「大[おお]きな祭壇[さいだん]の上[うえ]で、朝[あさ]の燔祭[はんさい]と夕[ゆう]べの犠牲[ぎせい]、王[おう]の燔祭[はんさい]とその犠牲[ぎせい]、民[たみ]すべての燔祭[はんさい]とその犠牲[ぎせい]、および彼[かれ]らの注[そそ]ぎの供[そな]えをささげなさい。燔祭[はんさい]の血[ち]も犠牲[ぎせい]の血[ち]も、すべてそれをその上[うえ]に注[そそ]ぎかけなさい。青銅[せいどう]の祭壇[さいだん]は、朝[あさ]のためにわたしのものとして残[のこ]しておく。」"
  16: "祭司[さいし]ウリヤは、アハズ王[おう]が命[めい]じたすべてのとおりに行[おこな]った。"
  17: "アハズ王[おう]は台座[だいざ]の枠[わく]を打[う]ち切[き]り、その上[うえ]から洗盤[せんばん]を取[と]り外[はず]し、青銅[せいどう]の牛[うし]の上[うえ]にあった海[うみ]を下[お]ろして、石[いし]の台[だい]の上[うえ]に置[お]いた。"
  18: "また、王[おう]の座[ざ]の基[もとい]を主[しゅ]の家[いえ]の内[うち]に築[きず]き、王[おう]の外[そと]の入口[いりぐち]を主[しゅ]の家[いえ]の内[うち]へと向[む]け変[か]えた。アッシリアの王[おう]のゆえであった。"
  19: "アハズが行[おこな]ったそのほかの事柄[ことがら]は、ユダの王[おう]たちの日々[ひび]の記録[きろく]の書[しょ]に記[しる]されているではないか。"
  20: "アハズは父[ちち]たちとともに眠[ねむ]り、父[ちち]たちとともにダビデの町[まち]に葬[ほうむ]られた。代[か]わってその子[こ]ヒゼキヤが王[おう]となった。"

notes:
  1: "Ἐν ἔτει ἑπτακαιδεκάτῳ Φακεε υἱοῦ Ρομελιου — в семнадцатый год Пекаха, сына Ремалии (Φακεε — Пеках, ペカ; Ρομελιου — Ремалия, レマリヤ; csl «факеа сына ромелиина»). ἐβασίλευσεν Αχαζ υἱὸς Ιωαθαμ βασιλέως Ιουδα — воцарился Ахаз, сын Иоафама, царя Иудейского."
  2: "υἱὸς εἴκοσι ἐτῶν ἦν — был сыном двадцати лет (ему было двадцать лет); ἑκκαίδεκα ἔτη ἐβασίλευσεν — шестнадцать лет царствовал; οὐκ ἐποίησεν τὸ εὐθὲς ἐν ὀφθαλμοῖς κυρίου θεοῦ αὐτοῦ πιστῶς — не делал правого в очах Господа Бога своего верно (πιστῶς — «верно»)."
  3: "ἐπορεύθη ἐν ὁδῷ Ιεροβοαμ υἱοῦ Ναβατ — пошёл путём Иеровоама, сына Навата; καί γε — «и даже»; διῆγεν ἐν πυρί — проводил через огонь; κατὰ τὰ βδελύγματα τῶν ἐθνῶν — по мерзостям народов (βδέλυγμα)."
  4: "ἐθυσίαζεν καὶ ἐθυμία — приносил жертвы и воскурял фимиам (θυμιάω); ἐν τοῖς ὑψηλοῖς — на высотах (高い所); ἐπὶ τῶν βουνῶν — на холмах; ὑποκάτω παντὸς ξύλου ἀλσώδους — под всяким деревом тенистым (ἀλσώδης — «рощистый»)."
  5: "τότε ἀνέβη Ραασσων — тогда поднялся Рецин (LXX Ραασσων, евр. רְצִין; в csl «раассон»); ἐπολιόρχουν ἐπὶ Αχαζ — осаждали Ахаза; οὐκ ἐδύναντο πολεμεῖν — не могли воевать; csl «и не можаста (ему) одолети» — «не смогли одолеть», скобки издания."
  6: "ἐπέστρεψεν ... τὴν Αιλαθ τῇ Συρίᾳ — вернул Елаф Сирии (Αιλαθ — Елаф/Эйлат, エラト; csl «елаф»); ἐξέβαλεν τοὺς Ιουδαίους — изгнал иудеев; Ιδουμαῖοι — идумеи (エドム人); ἕως τῆς ἡμέρας ταύτης — до сего дня."
  7: "Θαγλαθφελλασαρ — Тиглат-Пилесер (LXX; csl «фелгаффелласар»); Δοῦλός σου καὶ υἱός σου ἐγώ — «раб твой и сын твой я» (формула вассальной покорности); ἀνάβηθι καὶ σῶσόν με — взойди и спаси меня; τῶν ἐπανισταμένων ἐπ᾽ ἐμέ — восстающих на меня (ἐπανίστημι)."
  8: "τὸ ἀργύριον καὶ τὸ χρυσίον τὸ εὑρεθὲν ἐν θησαυροῖς — серебро и золото, найденное в сокровищницах; οἴκου κυρίου καὶ οἴκου τοῦ βασιλέως — дома Господня и дома царя; ἀπέστειλεν τῷ βασιλεῖ δῶρα — послал царю дары. Csl добавляет «царю ассирийску» — в гр. только τῷ βασιλεῖ."
  9: "ἤκουσεν αὐτοῦ — послушал его; ἀνέβη ... εἰς Δαμασκόν — пошёл в Дамаск; συνέλαβεν αὐτὴν καὶ ἀπῴκισεν αὐτὴν — взял её и переселил её (ἀποικίζω); τὸν Ραασσων ἐθανάτωσεν — Рецина умертвил. Ru и МТ добавляют «в Кир» — в гр. и csl этого нет."
  10: "εἰς ἀπαντὴν — навстречу; τὸ ὁμοίωμα τοῦ θυσιαστηρίου καὶ τὸν ῥυθμὸν αὐτοῦ — подобие жертвенника и очертание (ῥυθμός) его; εἰς πᾶσαν ποίησιν αὐτοῦ — для всякого изготовления его (csl «и все творение его»)."
  11: "ᾠκοδόμησεν Ουριας ὁ ἱερεὺς τὸ θυσιαστήριον — построил Урия-священник жертвенник; κατὰ πάντα, ὅσα ἀπέστειλεν — по всему, что послал. Ru добавляет «до прибытия царя Ахаза из Дамаска» (МТ) — в гр. и csl нет."
  12: "εἶδεν ὁ βασιλεὺς τὸ θυσιαστήριον καὶ ἀνέβη ἐπ᾿ αὐτό — увидел царь жертвенник и взошёл на него. Csl: «И прииде царь ахаз из дамаска и виде жертвенник» — «пришёл из Дамаска» в гр. нет (есть в МТ), внесено в текст по паритету."
  13: "ἐθυμίασεν τὴν ὁλοκαύτωσιν — воскурил всесожжение (θυμιάω — «кадить», не «сжигать»; csl «покади»); τὴν σπονδὴν αὐτοῦ — возлияние его; προσέχεεν τὸ αἷμα τῶν εἰρηνικῶν — пролил кровь мирных (酬恩祭; εἰρηνικά — «мирные жертвы»)."
  14: "τὸ θυσιαστήριον τὸ χαλκοῦν τὸ ἀπέναντι κυρίου — медный жертвенник, что пред Господом; προσήγαγεν ἀπὸ προσώπου τοῦ οἴκου κυρίου — отнёс от лица дома Господня; ἀπὸ τοῦ ἀνὰ μέσον — из среды между; ἐπὶ μηρὸν τοῦ θυσιαστηρίου κατὰ βορρᾶν — на бедро (т. е. боковую сторону) жертвенника к северу (μηρός — «бедро»)."
  15: "ἐπὶ τὸ θυσιαστήριον τὸ μέγα — на большой жертвенник; τὴν ὁλοκαύτωσιν τὴν πρωινήν — утреннее всесожжение; τὴν θυσίαν τὴν ἑσπερινήν — вечернюю жертву; πᾶν αἷμα ... ἐπ᾿ αὐτὸ προσχεεῖς — всякую кровь на него возольёшь; τὸ θυσιαστήριον τὸ χαλκοῦν ἔσται μοι εἰς τὸ πρωί — медный жертвенник будет мне на утро (тёмное место; csl «да будет мне на утро»; ru «останется до моего усмотрения» — иное, по МТ)."
  16: "ἐποίησεν Ουριας ὁ ἱερεὺς κατὰ πάντα, ὅσα ἐνετείλατο αὐτῷ ὁ βασιλεὺς Αχαζ — сделал Урия-священник по всему, что заповедал ему царь Ахаз. Стих повторяет 11, но с ἐνετείλατο (заповедал), а не ἀπέστειλεν (послал)."
  17: "συνέκοψεν τὰ συγκλείσματα τῶν μεχωνωθ — отсёк затворы (ободки) подстав (μεχωνωθ — מְכוֹנוֹת, подставы; csl «споения подставов» — «скрепы»); μετῆρεν τὸν λουτῆρα — снял умывальницу; τὴν θάλασσαν καθεῖλεν ἀπὸ τῶν βοῶν τῶν χαλκῶν — «море» снял с медных волов; ἐπὶ βάσιν λιθίνην — на основание каменное."
  18: "τὸν θεμέλιον τῆς καθέδρας ᾠκοδόμησεν ἐν οἴκῳ κυρίου — основание седалища (θεμέλιος, καθέδρα) построил в доме Господнем; τὴν εἴσοδον τοῦ βασιλέως τὴν ἔξω ἐπέστρεψεν — внешний вход царя обратил (ἐπιστρέφω); ἀπὸ προσώπου βασιλέως Ἀσσυρίων — от лица (из-за) царя Ассирийского. Тёмное место: в МТ/ru — «крытый субботний ход» (מוּסָךְ), в гр. и csl — «основание седалища»."
  19: "τὰ λοιπὰ τῶν λόγων Αχαζ — прочее слов Ахаза; ἐπὶ βιβλίῳ λόγων τῶν ἡμερῶν τοῖς βασιλεῦσιν Ιουδα — в книге слов дней царей Иудейских."
  20: "ἐκοιμήθη Αχαζ μετὰ τῶν πατέρων αὐτοῦ — почил Ахаз с отцами своими; ἐτάφη ἐν πόλει Δαυιδ — погребён в городе Давида; ἐβασίλευσεν Εζεκιας υἱὸς αὐτοῦ ἀντ᾽ αὐτοῦ — воцарился Езекия, сын его, вместо него. Csl повторяет «со отцы своими» и при погребении («погребен бысть со отцы своими во граде давидове») — в гр. только ἐτάφη ἐν πόλει Δαυιδ; повтор внесён в текст по паритету."
