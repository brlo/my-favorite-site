verses:
  1: "ナバトの子[こ]ヤロブアムの治[おさ]めの第十[だいじゅう]八[はち]年[ねん]に、レハブアムの子アビヤがユダの王[おう]となった。"
  2: "彼[かれ]は三[さん]年[ねん]治[おさ]めた。母[はは]の名[な]はマアハといい、アベサロムの娘[むすめ]であった。"
  3: "彼[かれ]は父[ちち]が自分[じぶん]の前[まえ]に行[おこな]ったすべての罪[つみ]の道[みち]を歩[あゆ]んだ。彼の心[こころ]は、父ダビデの心のように、その神[かみ]であられる主[しゅ]とともに全[まった]きものではなかった。"
  4: "しかし、ダビデのゆえに、その神[かみ]であられる主[しゅ]はエルサレムに彼[かれ]の残[のこ]りを残し、彼の後[あと]に子[こ]どもを立[た]て、エルサレムを堅[かた]くされた。"
  5: "ダビデは主[しゅ]の目[め]に正[ただ]しいことを行[おこな]い、命[めい]じられたすべてのことから、生涯[しょうがい]、いつの日[ひ]も外[はず]れなかった。ただ、ヘテ人[じん]ウリヤのことで外れただけである。"
  6: "レハブアムとヤロブアムの間[あいだ]には、彼[かれ]らの生[い]きている限[かぎ]り、すべての日[ひ]々[び]に戦[たたか]いがあった。"
  7: "アビヤの残[のこ]りの言葉[ことば]、および彼[かれ]が行[おこな]ったすべてのことは、見[み]よ、ユダの王[おう]たちの日々[ひび]の言葉の書[しょ]に記[しる]されているではないか。アビヤとヤロブアムの間には戦[たたか]いがあった。"
  8: "アビヤはヤロブアムの第二[だいに]十[じゅう]年[ねん]、父[ちち]たちとともに眠[ねむ]り、ダビデの町[まち]で父たちとともに葬[ほうむ]られた。代[か]わってその子[こ]アサが王[おう]となった。"
  9: "イスラエルの王[おう]ヤロブアムの第二[だいに]十[じゅう]年[ねん]に、アサがユダの王となった。"
  10: "彼[かれ]はエルサレムで四十一[よんじゅういち]年[ねん]治[おさ]めた。母[はは]の名[な]はアナといい、アベサロムの娘[むすめ]であった。"
  11: "アサは、父[ちち]ダビデのように、主[しゅ]の目[め]に正[ただ]しいことを行[おこな]った。"
  12: "彼[かれ]は地[ち]から汚[けが]れたものを取[と]り除[のぞ]き、父[ちち]たちが造[つく]ったすべての彫[ほ]り物[もの]を断[た]ち切[き]った。"
  13: "彼[かれ]は母[はは]アナを位[くらい]から退[しりぞ]け、もはや支配[しはい]させなかった。彼女[かのじょ]が自分[じぶん]の木立[こだち]の中[なか]に集[あつ]まりの場[ば]を造[つく]ったからである。アサはその木立を切[き]り倒[だお]し、ケドロンの谷川[たにがわ]で火[ひ]で焼[や]いた。"
  14: "ただ、高[たか]い所[ところ]は除[のぞ]かなかった。しかし、アサの心[こころ]は、そのすべての日[ひ]々[び]に、主[しゅ]の前[まえ]に全[まった]きものであった。"
  15: "彼[かれ]は父[ちち]の柱[はしら]と自分[じぶん]の柱、すなわち銀[ぎん]と金[きん]、および器[うつわ]を主[しゅ]の家[いえ]に運[はこ]び入[い]れた。"
  16: "アサとイスラエルの王[おう]バシャの間[あいだ]には、彼[かれ]らのすべての日[ひ]々[び]に戦[たたか]いがあった。"
  17: "イスラエルの王[おう]バシャはユダに攻[せ]め上[のぼ]り、ラマを建[た]てた。ユダの王アサのもとへ、だれも出入[でい]りできないようにするためであった。"
  18: "アサは、主[しゅ]の家[いえ]と王[おう]の家の宝[たから]の中[なか]に見[み]いだされた銀[ぎん]と金[きん]をすべて取[と]り、それを自分[じぶん]の若者[わかもの]たちの手[て]に渡[わた]した。アサ王は彼[かれ]らを、ダマスコに住[す]むシリアの王、すなわちアデルの子[こ]、タベレマンの子、アザイルの子のもとへ遣[つか]わして言[い]った。「"
  19: "わたしとあなたの間[あいだ]、わたしの父[ちち]とあなたの父の間に契約[けいやく]を結[むす]ぼう。見[み]よ、わたしは贈[おく]り物[もの]として銀[ぎん]と金[きん]を送[おく]った。来[き]て、あなたとイスラエルの王[おう]バシャとの契約を破[やぶ]り、彼[かれ]をわたしから離[はな]れさせてくれ。」"
  20: "アデルの子[こ]はアサ王[おう]の言[い]うことを聞[き]き、自分[じぶん]の軍[ぐん]の長[ちょう]たちをイスラエルの町[まち]々[まち]に遣[つか]わした。彼[かれ]らはアイン、ダン、アベル・ベト・マアハ、およびキンネレト全体[ぜんたい]を、ナフタリの全[ぜん]土[ど]に至[いた]るまで打[う]った。"
  21: "バシャはこれを聞[き]くと、ラマの築[きず]きをやめて、ティルツァへ帰[かえ]った。"
  22: "アサ王[おう]は、エナキムに至[いた]るまで、ユダのすべての者[もの]に命[めい]じた。彼[かれ]らはラマから石[いし]と材木[ざいもく]を運[はこ]び出[だ]した。バシャがそのために築[きず]きをしていたものである。アサ王はそれらで、ベニヤミンのすべての丘[おか]と見張[みは]り所[じょ]を建[た]てた。"
  23: "アサの残[のこ]りの言葉[ことば]、その力[ちから]のすべて、彼[かれ]が行[おこな]ったすべてのこと、また彼が建[た]てた町[まち]々[まち]は、見[み]よ、ユダの王[おう]たちの日々[ひび]の言葉の書[しょ]に記[しる]されているではないか。しかし、老[お]いのとき、彼は足[あし]を病[や]んだ。"
  24: "アサは父[ちち]たちとともに眠[ねむ]り、父ダビデの町[まち]に葬[ほうむ]られた。代[か]わってその子[こ]ヨシャファトが王[おう]となった。"
  25: "ヤロブアムの子[こ]ナダブは、ユダの王[おう]アサの第二[だい]年[ねん]にイスラエルの王となり、イスラエルを二[に]年治[おさ]めた。"
  26: "彼[かれ]は主[しゅ]の目[め]に悪[わる]を行[おこな]い、父[ちち]の道[みち]を歩[あゆ]み、父がイスラエルを罪[つみ]に陥[おとしい]れたその罪の中[なか]を歩んだ。"
  27: "アヒヤの子[こ]バシャは、アヒヤの子ベラアンの家[いえ]で彼[かれ]にむかって謀[はかりごと]を企[くわだ]て、ペリシテ人[じん]のギベトンで彼を殺[ころ]した。ナダブとイスラエルは皆[みな]、ギベトンを包囲[ほうい]していた。"
  28: "バシャはユダの王[おう]アサの第三[だいさん]年[ねん]に彼[かれ]を殺[ころ]し、代[か]わって王となった。"
  29: "彼[かれ]が王[おう]となると、ヤロブアムの家[いえ]をすべて打[う]ち、ヤロブアムに属[ぞく]する息[いき]のある者[もの]を一人[ひとり]も残[のこ]さず、主[しゅ]がその僕[しもべ]シロの人[ひと]アヒヤによって語[かた]られた言葉[ことば]のとおりに、彼らを根[ね]絶[だ]やした。"
  30: "これは、ヤロブアムが犯[おか]した罪[つみ]、すなわち彼[かれ]が自[みずか]ら犯し、イスラエルを罪に陥[おとしい]れた罪のためであり、また彼がイスラエルの神[かみ]である主[しゅ]を怒[いか]らせたその怒りのためであった。"
  31: "ナダブの残[のこ]りの言葉[ことば]、および彼[かれ]が行[おこな]ったすべてのことは、見[み]よ、イスラエルの王[おう]たちの日々[ひび]の言葉の書[しょ]に記[しる]されているではないか。"
  32: "アサとイスラエルの王[おう]バシャの間[あいだ]には、彼[かれ]らのすべての日[ひ]々[び]に戦[たたか]いがあった。"
  33: "ユダの王[おう]アサの第三[だいさん]年[ねん]に、アヒヤの子[こ]バシャがティルツァで、全[ぜん]イスラエルの上[うえ]に王となり、二十四[にじゅうし]年治[おさ]めた。"
  34: "彼[かれ]は主[しゅ]の目[め]に悪[わる]を行[おこな]い、ナバトの子[こ]ヤロブアムの道[みち]を歩[あゆ]み、ヤロブアムがイスラエルを罪[つみ]に陥[おとしい]れたその罪の中[なか]を歩んだ。"

notes:
  1: "ἐν τῷ ὀκτωκαιδεκάτῳ ἔτει βασιλεύοντος Ιεροβοαμ υἱοῦ Ναβατ — в восемнадцатый год царствования Иеровоама, сына Наватова; βασιλεύει Αβιου υἱὸς Ροβοαμ ἐπὶ Ιουδα — воцарился Авия, сын Ровоама, над Иудой."
  2: "καὶ ἓξ ἔτη ἐβασίλευσεν — «и шесть лет царствовал» (гр.); csl и ru читают «три лета» / «три года» (как в МТ). По паритету в тексте csl — 三年; вариант гр. отмечен здесь. ὄνομα τῆς μητρὸς αὐτοῦ Μααχα θυγάτηρ Αβεσσαλωμ — имя матери его Мааха, дочь Авессалома."
  3: "ἐπορεύθη ἐν ταῖς ἁμαρτίαις τοῦ πατρὸς αὐτοῦ — ходил в грехах отца своего; οὐκ ἦν ἡ καρδία αὐτοῦ τελεία μετὰ κυρίου — не было сердце его совершенно (τελεία) с Господом; ὡς ἡ καρδία Δαυιδ — как сердце Давида."
  4: "διὰ Δαυιδ ἔδωκεν αὐτῷ κύριος κατάλειμμα — ради Давида дал ему Господь остаток (κατάλειμμα; слав. «останок»; в ru «светильник» — иное понимание евр. ניר); ἵνα στήσῃ τέκνα αὐτοῦ μετ᾽ αὐτὸν καὶ στήσῃ τὴν Ιερουσαλημ — чтобы поставить детей его после него и утвердить Иерусалим. Повтор корня (残[のこ]り…残[のこ]し) сохранён вслед за csl."
  5: "ὡς ἐποίησεν Δαυιδ τὸ εὐθὲς ἐνώπιον κυρίου — как сделал Давид угодное (τὸ εὐθές, правое) пред Господом; οὐκ ἐξέκλινεν ἀπὸ πάντων, ὧν ἐνετείλατο αὐτῷ — не уклонился от всего, что заповедал ему; πάσας τὰς ἡμέρας τῆς ζωῆς αὐτοῦ — все дни жизни его. Слав. добавляет «кроме слова урии хеттеанина» (так же ru) — в гр. этого нет; добавление внесено в текст (паритет)."
  6: "В gr-lxx-byz на месте стиха «.» — стих в модуле отсутствует. По csl-ru: «И брань бе между ровоамом и между иеровоамом во вся дни живота их» — повтор 14:30 (в гр. 14:30 читается так же)."
  7: "τὰ λοιπὰ τῶν λόγων Αβιου — прочее слов Авии; ἐν βιβλίῳ λόγων τῶν ἡμερῶν τοῖς βασιλεῦσιν Ιουδα — в книге слов дней царей Иудейских; πόλεμος ἦν ἀνὰ μέσον Αβιου καὶ ἀνὰ μέσον Ιεροβοαμ — война была между Авией и между Иеровоамом."
  8: "ἐκοιμήθη Αβιου μετὰ τῶν πατέρων αὐτοῦ ἐν τῷ εἰκοστῷ καὶ τετάρτῳ ἔτει τοῦ Ιεροβοαμ — почил Авия с отцами своими в двадцать четвёртый год Иеровоама (гр.); csl и ru — «в двадесятое лето» (20-й год). По паритету в тексте csl (二十年), вариант гр. отмечен здесь. θάπτεται... ἐν πόλει Δαυιδ — погребён в городе Давида."
  9: "Ἐν τῷ ἐνιαυτῷ τῷ τετάρτῳ καὶ εἰκοστῷ τοῦ Ιεροβοαμ — в двадцать четвёртый год Иеровоама (гр.); csl и ru — «в двадесятое лето» / «в двадцатый год». В тексте csl — 二十年, вариант гр. отмечен здесь."
  10: "τεσσαράκοντα καὶ ἓν ἔτος ἐβασίλευσεν — сорок один год царствовал; ὄνομα τῆς μητρὸς αὐτοῦ Ανα θυγάτηρ Αβεσσαλωμ — имя матери его Ана, дочь Авессалома (в 15:2 она названа Мааха)."
  11: "ἐποίησεν Ασα τὸ εὐθὲς ἐνώπιον κυρίου ὡς Δαυιδ ὁ πατὴρ αὐτοῦ — делал Аса правое пред Господом, как Давид, отец его."
  12: "ἀφεῖλεν τὰς τελετὰς ἀπὸ τῆς γῆς — убрал обряды (τελεταί, посвящения) с земли; слав. «отя скверная», ru «изгнал блудников» — иное понимание; ἐξαπέστειλεν πάντα τὰ ἐπιτηδεύματα — изгнал все обычаи (ἐπιτηδεύματα); ἃ ἐποίησαν οἱ πατέρες αὐτοῦ — которые сделали отцы его."
  13: "τὴν Ανα τὴν μητέρα αὐτοῦ μετέστησεν τοῦ μὴ εἶναι ἡγουμένην — Ану, мать свою, отставил, чтобы не была начальницей (слав. «еже не владети ей»); καθὼς ἐποίησεν σύνοδον ἐν τῷ ἄλσει αὐτῆς — ибо сделала сборище (σύνοδος) в роще своей (слав. «сонмище в дубраве»; ru «истукан Астарты»); ἐξέκοψεν Ασα τὰς καταδύσεις αὐτῆς — Аса вырубил её рощу (κατάδυσις; слав. «гай ея»); ἐνέπρησεν πυρὶ ἐν τῷ χειμάρρῳ Κεδρων — сжёг огнём в потоке Кедрон."
  14: "τὰ δὲ ὑψηλὰ οὐκ ἐξῆρεν — высот же не убрал (ἐξαίρω); πλὴν ἡ καρδία Ασα ἦν τελεία μετὰ κυρίου πάσας τὰς ἡμέρας αὐτοῦ — однако сердце Асы было совершенно с Господом во все дни его."
  15: "εἰσήνεγκεν τοὺς κίονας τοῦ πατρὸς αὐτοῦ καὶ τοὺς κίονας αὐτοῦ — внёс столпы (κίων) отца своего и свои столпы; ἀργυροῦς καὶ χρυσοῦς καὶ σκεύη — серебряные, золотые и сосуды. В ru «вещи, посвящённые» — толкование; в тексте «столпы» по гр. и csl."
  16: "πόλεμος ἦν ἀνὰ μέσον Ασα καὶ ἀνὰ μέσον Βαασα βασιλέως Ισραηλ πάσας τὰς ἡμέρας — война была между Асой и между Ваасой, царём Израиля, все дни. Βαασα — バシャ (в Синодальном «Вааса»); форма по греч. и слав. «вааса»."
  17: "ἀνέβη Βαασα... ἐπὶ Ιουδαν — поднялся Вааса на Иуду; ᾠκοδόμησεν τὴν Ραμα — построил Раму (רָמָה); τοῦ μὴ εἶναι ἐκπορευόμενον καὶ εἰσπορευόμενον τῷ Ασα — чтобы не было выходящего и входящего у Асы, т. е. чтобы никто не мог ни выйти, ни войти."
  18: "ἔλαβεν Ασα τὸ ἀργύριον καὶ τὸ χρυσίον τὸ εὑρεθὲν ἐν τοῖς θησαυροῖς — взял Аса серебро и золото, найденное в сокровищницах; εἰς χεῖρας παίδων αὐτοῦ — в руки отроков (слуг) своих; πρὸς υἱὸν Αδερ υἱὸν Ταβερεμμαν υἱοῦ Αζιν βασιλέως Συρίας — к сыну Адера, сыну Тавереммана, сына Азина, царя Сирии (цепь отчеств; в слав. «ко сыну адерову сыну таверема во рамман, ко сыну азаила» — текст испорчен, «во рамман» — остаток имени Таверемман; в тексте сохранена цепь csl)."
  19: "Διάθου διαθήκην — положи завет (διατίθεμαι); ἀνὰ μέσον ἐμοῦ καὶ ἀνὰ μέσον σοῦ — между мною и между тобою; ἐξαπέσταλκά σοι δῶρα ἀργύριον καὶ χρυσίον — послал тебе дары, серебро и золото; διασκέδασον τὴν διαθήκην σου τὴν πρὸς Βαασα — расторгни завет твой с Ваасой; καὶ ἀναβήσεται ἀπ᾽ ἐμοῦ — и отойдёт от меня."
  20: "ἤκουσεν υἱὸς Αδερ τοῦ βασιλέως Ασα — послушал сын Адера царя Асы (так в гр. и csl: «послуша... царя асы»); ἀπέστειλεν τοὺς ἄρχοντας τῶν δυνάμεων — послал начальников сил; ἐπάταξεν τὴν Αιν καὶ τὴν Δαν καὶ τὴν Αβελμαα — поразил Аин, Дан и Авел-Мааху (слав. «авеля, дому маахиина»); πᾶσαν τὴν Χεζραθ ἕως πάσης τῆς γῆς Νεφθαλι — весь Хезрат (слав. «хеннереф», т. е. Киннерет) до всей земли Неффалима."
  21: "διέλιπεν τοῦ οἰκοδομεῖν τὴν Ραμα — перестал строить Раму; ἀνέστρεψεν εἰς Θερσα — возвратился в Фирцу (ティルツァ)."
  22: "παρήγγειλεν παντὶ Ιουδα εἰς Αινακιμ — повелел всему Иуде «в Енаким» (слав. «во енакиме»): тёмное место, по-видимому искажённая передача евр. אֵין נָקִי «нет свободного от повинности»; в ru «никого не исключая». В тексте сохранено тёмное чтение — エナキムに至るまで; αἴρουσιν τοὺς λίθους... καὶ τὰ ξύλα — берут камни и деревья; ἃ ᾠκοδόμησεν Βαασα — которыми строил Вааса; ᾠκοδόμησεν... πᾶν βουνὸν Βενιαμιν καὶ τὴν σκοπίαν — построил всякий холм Вениамина и сторожевой пост (σκοπιά); слав. «стражбища», ru «Гиву Вениаминову и Мицпу»."
  23: "τὰ λοιπὰ τῶν λόγων Ασα καὶ πᾶσα ἡ δυναστεία αὐτοῦ — прочее слов Асы и вся сила (δυναστεία) его; ἐν βιβλίῳ λόγων τῶν ἡμερῶν — в книге слов дней; πλὴν ἐν τῷ καιρῷ τοῦ γήρως αὐτοῦ ἐπόνεσεν τοὺς πόδας αὐτοῦ — однако во время старости его заболели (ἐπόνεσεν) ноги его."
  24: "ἐκοιμήθη Ασα... καὶ θάπτεται μετὰ τῶν πατέρων αὐτοῦ — почил и погребён с отцами; ἐν πόλει Δαυιδ — в городе Давида (слав. «во граде давида отца своего»); βασιλεύει Ιωσαφατ υἱὸς αὐτοῦ ἀντ᾽ αὐτοῦ — воцарился Иосафат, сын его, вместо него."
  25: "Ναδαβ υἱὸς Ιεροβοαμ βασιλεύει ἐπὶ Ισραηλ ἐν ἔτει δευτέρῳ τοῦ Ασα — Нават, сын Иеровоама, воцарился над Израилем во второй год Асы; ἐβασίλευσεν... ἔτη δύο — царствовал два года."
  26: "ἐποίησεν τὸ πονηρὸν ἐνώπιον κυρίου — делал злое пред Господом; ἐπορεύθη ἐν ὁδῷ τοῦ πατρὸς αὐτοῦ καὶ ἐν ταῖς ἁμαρτίαις αὐτοῦ — ходил путём отца своего и в грехах его; αἷς ἐξήμαρτεν τὸν Ισραηλ — которыми ввёл Израиля в грех (ἐξαμαρτάνω)."
  27: "περιεκάθισεν αὐτὸν Βαασα υἱὸς Αχια ἐπὶ τὸν οἶκον Βελααν — составил против него заговор Вааса, сын Ахии, из дома Велаана (ἐπὶ τὸν οἶκον — «на дом», т. е. против дома; слав. «в дому велаана сына ахиина» добавляет «сына ахиина» — вероятно, дублет); ἐπάταξεν αὐτὸν ἐν Γαβαθων τῇ τῶν ἀλλοφύλων — убил его в Гавафоне Филистимском (Γαβαθων, ギベトン; ἀλλόφυλοι — иноплеменники, ペリシテ人); περιεκάθητο ἐπὶ Γαβαθων — осаждали Гавафон."
  28: "ἐθανάτωσεν αὐτὸν Βαασα ἐν ἔτει τρίτῳ τοῦ Ασα — умертвил его Вааса в третий год Асы; ἐβασίλευσεν — воцарился."
  29: "ὡς ἐβασίλευσεν, καὶ ἐπάταξεν τὸν οἶκον Ιεροβοαμ — как только воцарился, поразил дом Иеровоама; οὐχ ὑπελίπετο πᾶσαν πνοὴν — не оставил ни одного дыхания (πνοή); ἕως τοῦ ἐξολεθρεῦσαι αὐτὸν — до полного истребления; κατὰ τὸ ῥῆμα κυρίου... ἐν χειρὶ δούλου αὐτοῦ Αχια τοῦ Σηλωνίτου — по слову Господню... рукою раба Своего Ахии Силомлянина (Σηλωνίτης)."
  30: "περὶ τῶν ἁμαρτιῶν Ιεροβοαμ — за грехи Иеровоама; ὡς ἐξήμαρτεν τὸν Ισραηλ — как он ввёл Израиля в грех; ἐν τῷ παροργισμῷ αὐτοῦ, ᾧ παρώργισεν — в раздражении его, которым он раздражил (παροργισμός)."
  31: "τὰ λοιπὰ τῶν λόγων Ναδαβ — прочее слов Навата; ἐν βιβλίῳ λόγων τῶν ἡμερῶν τοῖς βασιλεῦσιν Ισραηλ — в книге слов дней царей Израильских."
  32: "В gr-lxx-byz на месте стиха «.» — стих в модуле отсутствует. По csl-ru: «И бяше брань между асою (царем иудиным) и ваасою царем израилевым во вся дни их» — повтор 15:16; скобки в csl — пояснение издания, в текст не внесены."
  33: "ἐν τῷ ἔτει τῷ τρίτῳ τοῦ Ασα βασιλέως Ιουδα βασιλεύει Βαασα υἱὸς Αχια ἐπὶ Ισραηλ ἐν Θερσα — в третий год Асы, царя Иудейского, воцарился Вааса, сын Ахии, над Израилем в Фирце; εἴκοσι καὶ τέσσαρα ἔτη — двадцать четыре года."
  34: "ἐποίησεν τὸ πονηρὸν ἐνώπιον κυρίου — делал злое пред Господом; ἐπορεύθη ἐν ὁδῷ Ιεροβοαμ υἱοῦ Ναβατ — ходил путём Иеровоама, сына Навата; ἐν ταῖς ἁμαρτίαις αὐτοῦ, ὡς ἐξήμαρτεν τὸν Ισραηλ — и в грехах его, которыми ввёл Израиля в грех."
