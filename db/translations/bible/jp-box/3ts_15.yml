# jp-box, 3-я Царств, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: Авия, сын Ровоама (1–8), Аса и его реформа (9–15), война с Ваасой
# и договор с сирийским царём (16–24), Нават и заговор Ваасы (25–32), Вааса (33–34).
# Речь — 「…」: послание Асы сирийскому царю (19). Вложенной речи нет. Красного нет.
# Нумерация по gr: 34 стиха, у csl и ru тоже 34; 15:6 и 15:32 в gr-lxx-byz
# отсутствуют («.») — переведены по csl-ru (там это повтор 14:30 и 15:16),
# об этом сказано в notes.
# Паритет LXX/csl: csl-чтения в основном тексте без 〔…〕; вариант LXX — в notes.
# 15:5 — слав. «кроме слова урии хеттеанина» (в гр. нет) внесено в текст.
# Числа: 15:2 — гр. «шесть лет», csl и ru «три года»; 15:8–9 — гр. «двадцать
# четвёртый год», csl и ru «двадцатый». В тексте csl, оба чтения — в notes.
# 〔…〕 не ставим. Сносок ⟨…⟩ нет: 王, 高[たか]い所, 預言者, 契約 уже в корпусе.
# jp-ni не использовался.

