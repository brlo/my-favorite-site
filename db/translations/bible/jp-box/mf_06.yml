verses:
  1: "「<j>人[ひと]に見[み]てもらおうとして、人々[ひとびと]の前[まえ]で施[ほどこ]しをしないように、よく気[き]をつけなさい。さもないと、天[てん]におられるあなたがたの父[ちち]のもとで報[むく]いを受[う]けることができない。</j>"
  2: "<j>だから、施[ほどこ]しをするとき、偽善者[ぎぜんしゃ]たちのように自分[じぶん]の前[まえ]でラッパを鳴[ら]らしてはならない。彼[かれ]らは人[ひと]から賞[ほ]められようと、会堂[かいどう]や大通[おおどお]りでそうしているのだ。はっきりあなたがたに言[い]っておく。彼[かれ]らはもう自分[じぶん]の報[むく]いを受[う]け取[と]っている。</j>"
  3: "<j>あなたが施[ほどこ]しをするときには、左[ひだり]の手[て]に右[みぎ]の手[て]のしわざを悟[さと]らせるな。</j>"
  4: "<j>それは、あなたの施[ほどこ]しが人目[ひとめ]につかないようにするためである。そうすれば、隠[かく]れたところで見[み]ておられるあなたの父[ちち]が、あなたに〔表[おもて]だって〕報[むく]いてくださる。</j>」"
  5: "「<j>また、祈[いの]るときには、偽善者[ぎぜんしゃ]のようであってはならない。彼[かれ]らは、人[ひと]に見[み]てもらおうと、会堂[かいどう]や大通[おおどお]りの角[かど]に立[た]って祈[いの]ることを好[この]む。はっきり言[い]っておく。彼[かれ]らはすでに自分[じぶん]の報[むく]いを受[う]けている。</j>"
  6: "<j>あなたは祈[いの]るときには、自分[じぶん]の奥[く]の間[ま]に入[はい]って戸[と]を閉[と]ざし、人目[ひとめ]につかない所[ところ]におられるあなたの父[ちち]に祈[いの]りなさい。そうすれば、隠[かく]れた所[ところ]をご覧[らん]になるあなたの父[ちち]が、あなたに〔表[おもて]だって〕報[むく]いてくださる。</j>"
  7: "<j>また、祈[いの]るときに、異邦人[いほうじん]のようなむだ口[ぐち]をきいてはならない。彼[かれ]らは言葉[ことば]を並[なら]べ立[た]てれば聞[き]き届[とど]けられると信[しん]じている。</j>"
  8: "<j>だから、彼[かれ]らに似[に]てはならない。あなたがたの父[ちち]は、あなたがたが願[ねが]う前[まえ]から、あなたがたに必要[ひつよう]なものをご存[ぞん]じである。</j>"
  9: "<j>だから、あなたがたはこう祈[いの]りなさい。『天[てん]におられるわたしたちの父[ちち]よ。御名[みな]が聖[せい]とされますように。</j>"
  10: "<j>御国[みくに]が来[き]ますように。御心[みこころ]が、天[てん]におけるように地[ち]の上[うえ]にも行[おこな]われますように。</j>"
  11: "<j>わたしたちの日用[にちよう]の糧[かて]を、今日[きょう]わたしたちにお与[あた]えください。</j>"
  12: "<j>わたしたちに負[お]い目[め]のある人々[ひとびと]をわたしたちが赦[ゆる]したように、わたしたちの負[お]い目[め]もお赦[ゆる]しください。</j>"
  13: "<j>わたしたちを試[こころ]みに遭[あ]わせず、悪[わる]い者[もの]から救[すく]ってください。〔国[くに]と力[ちから]と栄光[えいこう]は、世々[よよ]にあなたのものです。アーメン。〕』</j>"
  14: "<j>もし、人々[ひとびと]の過[あやま]ちを赦[ゆる]すなら、あなたがたの天[てん]の父[ちち]もあなたがたを赦[ゆる]してくださる。</j>"
  15: "<j>しかし、もしあなたがたが人[ひと]を赦[ゆる]さないなら、父[ちち]もあなたがたの過[あやま]ちを赦[ゆる]さない。</j>」"
  16: "「<j>断食[だんじつ]するときには、偽善者[ぎぜんしゃ]のように暗[くら]い顔[かお]をしてはならない。彼[かれ]らは、断食[だんじつ]していることを人[ひと]に見[み]てもらおうと、顔[かお]をやつらせる。はっきり言[い]っておく。彼[かれ]らはすでに自分[じぶん]の報[むく]いを受[う]けている。</j>"
  17: "<j>断食[だんじつ]の日[ひ]には、頭[あたま]に油[あぶら]を塗[ぬ]って顔[かお]を洗[あら]いなさい。</j>"
  18: "<j>それは、断食[だんじつ]していることが人[ひと]に気[き]づかれず、隠[かく]れたところにおられるあなたの父[ちち]に知[し]られるためである。そうすれば、隠[かく]れたことを見[み]ておられるあなたの父[ちち]が、あなたに〔表[おもて]だって〕報[むく]いてくださる。</j>」"
  19: "「<j>あなたがたは地上[ちじょう]に富[とみ]を積[つ]んではならない。そこでは虫[むし]が食[く]い、さびがつき、盗人[ぬすびと]が穴[あな]を掘[ほ]って盗[ぬす]み出[だ]す。</j>"
  20: "<j>むしろ、あなたがたのために天[てん]に富[とみ]を積[つ]みなさい。そこでは虫[むし]が食[く]うことも、さびがつくこともなく、盗人[ぬすびと]が穴[あな]を掘[ほ]って盗[ぬす]むこともない。</j>"
  21: "<j>あなたの富[とみ]の置[お]かれた所[ところ]へ、あなたの心[こころ]もついて行[い]くからである。</j>」"
  22: "「<j>体[からだ]のともし火[び]は目[め]である。だから、あなたの目[め]が清[きよ]らかであれば、全身[ぜんしん]が明[あか]るくなる。</j>"
  23: "<j>しかし、あなたの目[め]が悪[わる]ければ、全身[ぜんしん]が暗[くら]くなる。だから、あなたの中[なか]にある光[ひかり]が暗[くら]みであるなら、その暗[くら]さはどれほどであろうか。</j>」"
  24: "「<j>だれも二人[ふたり]の主人[しゅじん]に兼[か]ね仕[つか]えはできない。一方[いっぽう]を憎[にく]みながら他方[たほう]を愛[あい]するか、一方[いっぽう]を大切[たいせつ]にして他方[たほう]を見下[みくだ]すか、いずれかである。あなたがたは神[かみ]と富[とみ]の両方[りょうほう]に仕[つか]えることはできない。</j>」"
  25: "「<j>だから、あなたがたに言[い]う。自分[じぶん]の命[いのち]のために何[なに]を食[た]べようか、何[なに]を飲[もう]かと、また体[からだ]のために何[なに]を着[き]ようかと思[おも]い悩[なや]んではならない。命[いのち]は食[た]べ物[もの]よりも、体[からだ]は衣服[いふく]よりも大切[たいせつ]ではないか。</j>"
  26: "<j>空[そら]の鳥[とり]たちをよく見[み]なさい。彼[かれ]らは種[たね]を蒔[ま]かず、刈[か]り入[れ]もせず、倉[くら]に納[おさ]めもしない。だが、あなたがたの天[てん]の父[ちち]は彼[かれ]らを養[やしな]ってくださる。あなたがたは、鳥[とり]よりもはるかに優[すぐ]れた者[もの]ではないか。</j>"
  27: "<j>あなたがたのうち、だれが思[おも]い悩[なや]んだからといって、自分[じぶん]の背丈[せたけ]を一[いっ]キュビト⟨肘[ひじ]から指[ゆび]の先[さき]までの長[なが]さ。約[やく]四十五[よんじゅうご]センチ。⟩伸[の]ばすことができるだろうか。</j>"
  28: "<j>なぜ衣服[いふく]のことで思[おも]い煩[わずら]うのか。野[の]の花[はな]がどう育[そだ]つのかを見[み]てごらん。働[はたら]きもせず、糸[いと]を紡[つむ]ぎもしない。</j>"
  29: "<j>だが、わたしはあなたがたに言[い]う。栄華[えいが]の極[きわ]みにあったソロモンでさえ、この花[はな]のどれ一つほどにも装[よそお]ってはいなかった。</j>"
  30: "<j>今日[きょう]は生[は]えていて明日[あした]には炉[ろ]へ投[な]げ込[こ]まれる草[くさ]でさえ、神[かみ]はこうして美[うつく]しく飾[かざ]ってくださる。ましてあなたがたには、なおさらのことではないか、信仰[しんこう]の薄[うす]い者[もの]たちよ。</j>"
  31: "<j>だから、『何[なに]を食[た]べようか』『何[なに]を飲[の]もうか』『何[なに]を着[き]ようか』と心[こころ]を騒[さわ]がせてはならない。</j>"
  32: "<j>異邦人[いほうじん]たちがこれらのことを切[せつ]に求[もと]めているからである。あなたがたの天[てん]の父[ちち]は、これらのものがすべてあなたがたに必要[ひつよう]であることを知[し]っておられる。</j>"
  33: "<j>まず、〔神[かみ]の〕国[くに]とその義[ぎ]とを求[もと]めなさい。そうすれば、これらのものはすべてあなたがたに加[くわ]えられる。</j>"
  34: "<j>だから、明日[あす]のことをくよくよ思[おも]い煩[わずら]うな。明日[あす]のことは明日[あす]が背負[せお]えばよい。その日[ひ]の苦[くる]しみは、その日[ひ]のうちに足[た]りている。</j>」"

notes:
