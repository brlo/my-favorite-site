verses:
  1: "あなたを造[つく]った方[かた]を、若[わか]い日[ひ]に覚[おぼ]えていよ。悪[わる]い日[ひ]が来[き]、「わたしにはその日々[ひび]に何[なに]の喜[よろこ]びもない」と言[い]う年[とし]が訪[おとず]れる前に。"
  2: "太陽[たいよう]と光[ひかり]と月[つき]と星[ほし]が暗[くら]くなり、雨[あめ]の後[あと]に雲[くも]が戻[もど]って来[く]る前に。"
  3: "その日[ひ]、家[いえ]を守[まも]る者[もの]たちが震[ふる]え、力[ちから]ある者[もの]たちが曲[ま]がり、粉[こな]をひく女[おんな]たちは少[すく]なくなって手[て]を休[やす]め、窓[まど]の穴[あな]からのぞく者[もの]たちは暗[くら]くなる。"
  4: "粉[こな]をひく女[おんな]の声[こえ]が弱[よわ]くなると、広場[ひろば]に面[めん]した戸[と]は閉[と]ざされる。人[ひと]は鳥[とり]の声[こえ]で目[め]を覚[さ]まし、歌[うた]う娘[むすめ]たちは皆[みな]声[こえ]を落[お]とす。"
  5: "高[たか]い所[ところ]を見[み]れば、道[みち]には恐怖[きょうふ]がある。アーモンドの木[き]は花[はな]を咲[さ]かせ、いなごは重[おも]くなり、ケッパーは実[み]を散[ち]らす。人[ひと]は自分[じぶん]の永遠[えいえん]の家[いえ]へ行[い]き、泣[な]く者[もの]たちが広場[ひろば]を巡[めぐ]るからである。"
  6: "銀[ぎん]の鎖[くさり]が断[た]たれ、金[きん]の器[うつわ]が砕[くだ]け、泉[いずみ]のほとりで水[みず]がめが割[わ]れ、車輪[しゃりん]が井戸[いど]の上[うえ]で回[まわ]り落[お]ちる前に。"
  7: "塵[ちり]は、もとのように地[ち]に帰[かえ]り、霊[れい]は、それをお与[あた]えになった神[かみ]のもとへ帰[かえ]る。"
  8: "空[むな]しさの空[むな]しさ、とコヘレトは言[い]った。すべては空[むな]しい。"
  9: "コヘレトは知恵[ちえ]ある者[もの]となっただけでなく、さらに民[たみ]に知識[ちしき]を教[おし]えた。また、耳[みみ]はたとえ話[ばなし]の美[うつく]しさを探[さぐ]り極[きわ]めた。"
  10: "コヘレトは、喜[よろこ]ばしい言葉[ことば]を見[み]いだそうとして多[おお]くを探[さぐ]り、正[ただ]しく記[しる]された真実[しんじつ]の言葉[ことば]を求[もと]めた。"
  11: "知恵[ちえ]ある者[もの]の言葉[ことば]は牛[うし]を突[つ]く棒[ぼう]⟨先[さき]を鉄[てつ]で覆[おお]った長[なが]い棒[ぼう]。牛[うし]を突[つ]いて進[すす]ませる。⟩のようであり、打[う]ち込[こ]まれた釘[くぎ]のようである。これらは一人[ひとり]の羊飼[ひつじかい]から与[あた]えられた、集[あつ]められた言葉[ことば]であり、その上[うえ]にさらに多[おお]くのものがある。"
  12: "わが子[こ]よ、多[おお]くの書[しょ]物[もの]を作[つく]ることに気[き]をつけよ。きりがない。多[おお]く学[まな]ぶことは肉体[にくたい]の疲[つか]れである。"
  13: "言葉[ことば]の終[お]わり。すべては聞[き]かれた。神[かみ]を畏[おそ]れ、その戒[いまし]めを守[まも]れ。これが人[ひと]のすべてである。"
  14: "神[かみ]は、善[よ]いものであれ悪[わる]いものであれ、すべての業[わざ]を、人[ひと]が見過[みす]ごしたすべてのこととともに、裁[さば]きへと導[みちび]かれるからである。"

notes:
  1: "μνήσθητι τοῦ κτίσαντός σε — あなたを造った方を覚えていよ (ὁ κτίσας — причастие «Сотворивший»; не «Создатель» иносказательно; «Создателя» Синодального — с масоретского בוראיך). ἐν ἡμέραις νεότητός σου — 若い日に. ἕως ὅτου μὴ ἔλθωσιν ἡμέραι τῆς κακίας — 悪い日が来て…前に (κακία — «злоба»; слав. «дние злобы твоея» добавляет «твоея», в греч. нет). φθάσωσιν ἔτη, ἐν οἷς ἐρεῖς Οὐκ ἔστιν μοι ἐν αὐτοῖς θέλημα — 「わたしにはその日々に何の喜びもない」と言う年が訪れる (φθάνω — «достигать»; θέλημα — «хотение, желание»)."
  2: "ἕως οὗ μὴ σκοτισθῇ ὁ ἥλιος καὶ τὸ φῶς καὶ ἡ σελήνη καὶ οἱ ἀστέρες — 太陽と光と月と星が暗くなる前に (σκοτίζω — «затмевать(ся)»). ἐπιστρέψωσιν τὰ νέφη ὀπίσω τοῦ ὑετοῦ — 雨の後に雲が戻って来る (ὀπίσω — «позади, после»; образ: тучи возвращаются вслед за дождём. «Нашли новые тучи» Синодального — иное чтение, с масоретского)."
  3: "ἐν ἡμέρᾳ, ᾗ ἐὰν σαλευθῶσιν φύλακες τῆς οἰκίας — 家を守る者たちが震える日 (σαλεύω — «колебать»). διαστραφῶσιν ἄνδρες τῆς δυνάμεως — 力ある者たちが曲がり (διαστρέφω — «искривлять»). ἤργησαν αἱ ἀλήθουσαι, ὅτι ὠλιγώθησαν — 粉をひく女たちは少なくなって手を休め (ἀλήθω — «молоть»; ἀργέω — «быть праздным»). σκοτάσουσιν αἱ βλέπουσαι ἐν ταῖς ὀπαῖς — 窓の穴からのぞく者たちは暗くなる (ὀπή — «отверстие, скважина»). Аллюзия старости: стражи — руки, мужи силы — ноги, мелющие — зубы, смотрящие в окна — глаза."
  4: "κλείσουσιν θύρας ἐν ἀγορᾷ — 広場に面した戸は閉ざされる (ἀγορά — «площадь, улица»). ἐν ἀσθενείᾳ φωνῆς τῆς ἀληθούσης — 粉をひく女の声が弱くなると (ἀσθένεια — «слабость»). ἀναστήσεται εἰς φωνὴν τοῦ στρουθίου — 鳥の声で目を覚まし (στρουθίον — «воробей, птичка»; подлежащее не названо). ταπεινωθήσονται πᾶσαι αἱ θυγατέρες τοῦ ᾄσματος — 歌う娘たちは皆声を落とす (θυγατέρες τοῦ ᾄσματος — «дочери песни», т.е. поющие женщины; ταπεινόω — «понижать»)."
  5: "ἀπὸ ὕψους ὄψονται — 高い所を見る (букв. «с высоты увидят»; слав. «на высоту узрят» — принято славянское понимание; «высоты будут страшны» Синодального — с масоретского). θάμβοι ἐν τῇ ὁδῷ — 道には恐怖がある (θάμβος — «ужас, оцепенение»). ἀνθήσῃ τὸ ἀμύγδαλον — アーモンドの木は花を咲かせ (образ седины). παχυνθῇ ἡ ἀκρίς — いなごは重くなり (ἀκρίς — «саранча, кузнечик»). διασκεδασθῇ ἡ κάππαρις — ケッパーは実を散らす (κάππαρις — каперс, растение, возбуждающее аппетит; образ угасания желания). ἐπορεύθη ὁ ἄνθρωπος εἰς οἶκον αἰῶνος αὐτοῦ — 人は自分の永遠の家へ行き (οἶκος αἰῶνος — «дом вечности», т.е. могила). ἐκύκλωσαν ἐν ἀγορᾷ οἱ κοπτόμενοι — 泣く者たちが広場を巡る (κόπτομαι — «бить себя [в грудь]», плакальщицы)."
  6: "σχοινίον τοῦ ἀργυρίου — 銀の鎖 (σχοινίον — «верёвка, шнур»; «цепочка» Синодального — с масоретского). ἀνθέμιον τοῦ χρυσίου — 金の器 (ἀνθέμιον — «цветок, украшение»; слав. «повязка златая»). συντριβῇ ὑδρία ἐπὶ τὴν πηγήν — 泉のほとりで水がめが割れ (ὑδρία — «водонос»). συντροχάσῃ ὁ τροχὸς ἐπὶ τὸν λάκκον — 車輪が井戸の上で回り落ちる (τροχός — «колесо», колодезный ворот; λάκκος — «яма, колодец»). Образы не разъясняются в тексте, см. 12:3."
  7: "ἐπιστρέψῃ ὁ χοῦς ἐπὶ τὴν γῆν, ὡς ἦν — 塵は、もとのように地に帰り (χοῦς — «прах, пыль»; ὡς ἦν — «как было»). τὸ πνεῦμα ἐπιστρέψῃ πρὸς τὸν θεόν, ὃς ἔδωκεν αὐτό — 霊は、それをお与えになった神のもとへ帰る (πνεῦμα здесь «дух», не «ветер», поэтому 霊; ср. 11:5)."
  8: "ματαιότης ματαιοτήτων, εἶπεν ὁ Ἐκκλησιαστής — 空しさの空しさ、とコヘレトは言った (рефрен 1:2). τὰ πάντα ματαιότης — すべては空しい."
  9: "περισσὸν ὅτι ἐγένετο Ἐκκλησιαστὴς σοφός — コヘレトは知恵ある者となっただけでなく (περισσόν — «сверх, кроме того»). ἔτι ἐδίδαξεν γνῶσιν σὺν τὸν λαόν — さらに民に知識を教えた. οὖς ἐξιχνιάσεται κόσμιον παραβολῶν — 耳はたとえ話の美しさを探り極めた (ἐξιχνιάζω — «разыскивать, исследовать»; κόσμιον — «украшение, изящество»; буквально «ухо исследует»)."
  10: "πολλὰ ἐζήτησεν Ἐκκλησιαστὴς τοῦ εὑρεῖν λόγους θελήματος — 喜ばしい言葉を見いだそうとして多くを探り (λόγοι θελήματος — «слова желания», т.е. приятные, желанные). γεγραμμένον εὐθύτητος — 正しく記された (εὐθύτης — «прямота»). λόγους ἀληθείας — 真実の言葉."
  11: "Λόγοι σοφῶν ὡς τὰ βούκεντρα — 知恵ある者の言葉は牛を突く棒のよう (βούκεντρον — «стрекало, рожон»). ὡς ἧλοι πεφυτευμένοι — 打ち込まれた釘のよう (πεφυτευμένοι — «воткнутые, вбитые»). οἳ παρὰ τῶν συναγμάτων ἐδόθησαν ἐκ ποιμένος ἑνός — これらは一人の羊飼いから与えられ、集められたもの (σύναγμα — «собрание, свод»; слав. «сложения»; ἐκ ποιμένος ἑνός — «от единого пастыря»). καὶ περισσὸν ἐξ αὐτῶν — その上にさらに多くのものがある."
  12: "υἱέ μου, φύλαξαι ποιῆσαι βιβλία πολλά — わが子よ、多くの書物を作ることに気をつけよ (φυλάσσω — «беречься»). οὐκ ἔστιν περασμός — きりがない (περασμός — «конец, предел»). μελέτη πολλὴ κόπωσις σαρκός — 多く学ぶことは肉体の疲れ (μελέτη — «упражнение, изучение»; σάρξ — «плоть»)."
  13: "Τέλος λόγου τὸ πᾶν ἀκούεται — 言葉の終わり。すべては聞かれた (ἀκούεται — пассив «слышится, услышано»; слав. «все слушай» передаёт императивный смысл, но в греч. базе пассив — он и сохранён). τὸν θεὸν φοβοῦ — 神を畏れ. τὰς ἐντολὰς αὐτοῦ φύλασσε — その戒めを守れ. ὅτι τοῦτο πᾶς ὁ ἄνθρωπος — これが人のすべてである (букв. «это — всякий человек», т.е. в этом всё для человека)."
  14: "πᾶν τὸ ποίημα ὁ θεὸς ἄξει ἐν κρίσει — 神はすべての業を裁きへと導かれる (ποίημα — «дело»; ἄγω — «вести»). ἐν παντὶ παρεωραμένῳ — 人が見過ごしたすべてのこととともに (παροράω — «просматривать, упускать»; в греч. пассив, подлежащее «людьми» добавлено по-японски, чтобы не читалось как «Богом»; слав. «о всяцем погрешении» — «за всякое прегрешение»; «все тайное» Синодального — с масоретского). ἐὰν ἀγαθὸν καὶ ἐὰν πονηρόν — 善いものであれ悪いものであれ."
