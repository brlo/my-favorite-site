# jp-box, Товит, глава 11. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: возвращение в Ниневию и разговор Рафаила с Товией (1–4), Анна видит сына
# (5–6), Рафаил велит помазать глаза желчью (7–8), встреча с матерью (9), Товит
# выходит к дверям и прозревает (10–13), благодарственная молитва (14), рассказ о
# Мидии (15), встреча с невесткой у ворот (16–17), радость в Ниневии и семидневный
# брак (18–19).
# Прямая речь — 「…」: 2–4, 7–8 (Рафаил), 6, 9 (Анна), 14 (молитва Товита),
# 17 (благословение невестки). Красного и синего нет (ВЗ).
# Нумерация по gr: 19 стихов. Сдвиг csl: начало gr 11:1 («до Ниневии») стоит в
# csl 10:13; csl 11:1 = gr 11:1b–2; далее csl 11:N = gr 11:(N+1) до N=15;
# csl 11:16 вбирает gr 11:16c–18; csl 11:17–18 = gr 11:19; csl 11:19 пуст.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 婚礼, 天使, 嫁, 胆汁 уже в корпусе; 白[しろ]い膜[まく]
# (λεύκωμα) — термин книги, появляется раньше.
# Имена — транслитерация греческого (LXX).

tr_code: jp-box
book: tov
chapter: 11
draft: true

verses:
  1: "そして彼らは、ニネベに近[ちか]づくまで歩[あゆ]み続[つづ]けた。ラファエルはトビアに言[い]った。"
  2: "「兄弟[きょうだい]よ、あなたが父[ちち]をどんなふうに後[あと]に残[のこ]してきたか、分[わ]からないのか。"
  3: "あなたの妻[つま]より先[さき]に走[はし]って行[い]って、家[いえ]を整[ととの]えよう。"
  4: "そして、魚[さかな]の胆汁[たんじゅう]を手[て]に取[と]りなさい。」そこで彼らは進[すす]み、犬[いぬ]も一緒[いっしょ]に彼らの後[うし]ろからついて来[き]た。"
  5: "アンナは座[すわ]って、自分[じぶん]の子[こ]が来[く]る道[みち]をじっと見[み]まわしていた。"
  6: "そして、彼が来[く]るのを見[み]て取[と]ると、父[ちち]に言[い]った。「見[み]なさい。あなたの息子[むすこ]が来[き]る。一緒[いっしょ]に行[い]ったあの人[ひと]も。」"
  7: "ラファエルは言[い]った。「トビアよ、わたしは知[し]っている。あなたの父[ちち]は目[め]を開[ひら]く。"
  8: "だから、あなたは彼の目[め]に胆汁[たんじゅう]を塗[ぬ]りなさい。そうすれば、彼はしみるように痛[いた]みを感[かん]じて目をこすり、白[しろ]い膜[まく]を落[お]とし、あなたを見[み]るようになる。」"
  9: "アンナは駆[か]け寄[よ]って息子[むすこ]の首[くび]に飛[と]びつき、言[い]った。「子[こ]よ、あなたを見[み]た。今[いま]からはもう死[し]んでもいい。」そして二人[ふたり]は泣[な]いた。"
  10: "トビトは戸口[とぐち]へ向[む]かって出[で]て行[い]ったが、つまずいた。息子[むすこ]は彼のもとへ駆[か]け寄[よ]った。"
  11: "そして彼は父[ちち]を支[ささ]え、父の目[め]に胆汁[たんじゅう]を塗[ぬ]って言[い]った。「勇気[ゆうき]を出[だ]して、父[ちち]よ。」"
  12: "そして、目がしみて痛[いた]むと、彼は自分[じぶん]の目をこすった。すると、白[しろ]い膜[まく]が彼の目[め]の端[はし]からはがれ落[お]ちた。"
  13: "そして、自分[じぶん]の息子[むすこ]を見[み]ると、その首[くび]に飛[と]びついて泣[な]き、言[い]った。"
  14: "「神[かみ]よ、あなたはほめたたえられる方[かた]である。あなたの名[な]も、とこしえにほめたたえられる。あなたの聖[せい]なる天使[てんし]たちも皆[みな]、ほめたたえられる。あなたはわたしを懲[こ]らしめ、またあわれんでくださったからである。見[み]よ、わたしは自分[じぶん]の息子[むすこ]トビアを見[み]ている。」"
  15: "そして息子[むすこ]は喜[よろこ]びながら入[はい]って来[き]て、メディアで自分[じぶん]に起[お]こった大[おお]きな出来事[できごと]を父[ちち]に告[つ]げ知[し]らせた。"
  16: "トビトは喜[よろこ]び、神[かみ]をほめたたえながら、ニネベの門[もん]まで嫁[よめ]を迎[むか]えに出[で]た。彼が歩[あゆ]いて来[く]るのを見[み]た者[もの]たちは、彼が目[め]が見[み]えるようになったことに驚[おどろ]いた。そしてトビトは、神が自分をあわれんでくださったことを彼らの前[まえ]で告白[こくはく]した。"
  17: "そして、トビトが自分[じぶん]の嫁[よめ]サラに近[ちか]づくと、彼女[かのじょ]を祝福[しゅくふく]して言[い]った。「娘[むすめ]よ、元気[げんき]で来[き]なさい。あなたをわたしたちのもとへ連[つ]れて来[き]てくださった神[かみ]は、ほめたたえられる方[かた]である。あなたの父[ちち]も母[はは]も、ほめたたえられる。」"
  18: "そして、ニネベにいる彼の兄弟[きょうだい]たちすべてに喜[よろこ]びがあった。"
  19: "そして、アヒカルと、彼のいとこナスバスが来[き]た。トビアの婚礼[こんれい]は喜[よろこ]びとともに七日[なぬか]行われた。"

notes:
  1: "ἐπορεύετο μέχρις οὗ ἐγγίσαι αὐτοὺς εἰς Νινευη — шли, пока не приблизились к Ниневии (ἐγγίζω; ἐγγίσαι — inf. аор.). εἶπεν Ραφαηλ πρὸς Τωβιαν — сказал Рафаил Товии; речь начинается в ст. 2. В csl слова о пути стоят в конце 10:13, а слав. 11:1 сразу начинает речь — нумерация сдвинута."
  2: "Οὐ γινώσκεις — не знаешь (γινώσκω). ἄδελφε — брат (зват.). πῶς ἀφῆκας τὸν πατέρα σου — как ты оставил отца твоего (ἀφίημι; слав. «како оставил еси»). В csl это 11:1."
  3: "προδράμωμεν — «побежим вперёд» (προτρέχω, увещательное сослагательное). ἔμπροσθεν τῆς γυναικὸς σου — перед женой твоей. ἑτοιμάσωμεν τὴν οἰκίαν — приготовим дом (ἑτοιμάζω; слав. «уготоваим дом»). В csl это 11:2."
  4: "λαβὲ παρὰ χεῖρα — «возьми в руку» (παρά + acc.). χολὴ τοῦ ἰχθύος — желчь рыбы (χολή, 胆汁). συνῆλθεν ὁ κύων ὄπισθεν αὐτῶν — с ними пошёл пёс (κύων; слав. «купно иде пес вслед их»). В csl это 11:3."
  5: "ἐκάθητο περιβλεπομένη — сидела, всматриваясь (περιβλέπομαι). εἰς τὴν ὁδὸν τὸν παῖδα αὐτῆς — на дорогу [в ожидании] сына своего (παῖς — сын, слуга). В csl это 11:4."
  6: "προσενόησεν — заметила, обратила внимание (προσενοέω). Ἰδοὺ ὁ υἱός σου ἔρχεται — вот сын твой идёт. ὁ ἄνθρωπος ὁ πορευθεὶς μετ᾽ αὐτοῦ — человек, ходивший с ним. Слав. читает «сын мой»; это расходится и с LXX, и с контекстом (Анна говорит мужу), поэтому в тексте LXX, слав. вариант отмечен здесь. В csl это 11:5."
  7: "Ἐπίσταμαι ἐγὼ — «я знаю» (ἐπίσταμαι; ἐγώ усилено). ἀνοίξει τοὺς ὀφθαλμούς — откроет глаза (ἀνοίγω). Слав. добавляет обращение «Товие» (Товия), которого нет в LXX; по паритету внесено в основной текст. В csl это 11:6."
  8: "σὺ οὖν ἔγχρισον — «итак, ты помажь» (ἐγχρίω). δηχθεὶς διατρίψει — «ужаленный [едким], потрёт» (δάκνω, διατρίβω). ἀποβαλεῖ τὰ λευκώματα — сбросит бельма (ἀποβάλλω; λεύκωμα, 白[しろ]い膜[まく]). Слав. «отверзет бельма» — уникальное чтение, не согласующееся с 11:12, где бельма спадают; в тексте LXX. В csl это 11:7."
  9: "προσδραμοῦσα — подбежав (προστρέχω). ἐπέπεσεν ἐπὶ τὸν τράχηλον — пала на шею (ἐπιπίπτω, τράχηλος). Εἶδόν σε, παιδίον — «увидела я тебя, дитя». ἀπὸ τοῦ νῦν ἀποθανοῦμαι — «отныне умру», т. е. теперь можно и умереть. ἔκλαυσαν ἀμφότεροι — заплакали оба. В csl это 11:8."
  10: "ἐξήρχετο πρὸς τὴν θύραν — выходил к двери (imperfect). προσέκοπτεν — спотыкался (προσκόπτω). ὁ δὲ υἱὸς προσέδραμεν αὐτῷ — сын подбежал к нему (προστρέχω). В csl это 11:9."
  11: "ἐπελάβετο τοῦ πατρός — взял, поддержал отца (ἐπιλαμβάνομαι). προσέπασεν τὴν χολήν — наложил желчь (προσπάσσω). Θάρσει, πάτερ — «дерзай, отче» (θαρσέω). В csl это 11:10."
  12: "ὡς δὲ συνεδήχθησαν — когда [глаза] были ужалены (συνδάκνω). διέτριψε τοὺς ὀφθαλμούς — растёр глаза (διατρίβω). ἐλεπίσθη ἀπὸ τῶν κανθῶν — «отслоились от углов [глаз]» (λεπίζω, κανθός); τὰ λευκώματα — бельма. В csl это 11:11."
  13: "ἰδὼν τὸν υἱὸν αὐτοῦ — увидев сына своего. ἐπέπεσεν ἐπὶ τὸν τράχηλον — пал на шею (ἐπιπίπτω). ἔκλαυσεν — заплакал. καὶ εἶπεν вводит молитву ст. 14. В csl это 11:12."
  14: "Εὐλογητὸς εἶ, ὁ θεός — «благословен Ты, Боже» (εὐλογητός; формула благословения). εὐλογητὸν τὸ ὄνομά σου εἰς τοὺς αἰῶνας — благословенно имя Твоё вовеки. οἱ ἅγιοί σου ἄγγελοι — святые ангелы Твои. ἐμαστίγωσας καὶ ἠλέησάς με — «Ты наказал и помиловал меня» (μαστιγόω, ἐλεέω). ἰδοὺ βλέπω Τωβιαν — вот, я вижу Товию. Молитва — 「…」, красного нет (ВЗ). В csl это 11:13."
  15: "εἰσῆλθεν ὁ υἱὸς αὐτοῦ χαίρων — вошёл сын его, радуясь. ἀπήγγειλεν — возвестил (ἀπαγγέλλω). τὰ μεγαλεῖα τὰ γενόμενα αὐτῷ ἐν τῇ Μηδίᾳ — великое, бывшее с ним в Мидии (μεγαλεῖα). В csl это 11:14."
  16: "εἰς συνάντησιν τῇ νύμφῃ αὐτοῦ — навстречу невестке (νύμφη, 嫁[よめ]). πρὸς τῇ πύλῃ Νινευη — у ворот Ниневии. ἐθαύμαζον οἱ θεωροῦντες — удивлялись смотревшие (θαυμάζω, θεωρέω). ὅτι ἔβλεψεν — что он стал видеть. ἐξωμολογεῖτο — исповедовал, открыто признавал (ἐξομολογέω). В csl это 11:15–16a."
  17: "ὡς ἤγγισεν — когда приблизился. κατευλόγησεν — благословил (κατευλογέω). Ἔλθοις ὑγιαίνουσα — оптитив: «приди здоровая» (ὑγιαίνω). θύγατερ — дочь (зват., 娘[むすめ]よ). εὐλογητὸς ὁ θεός, ὃς ἤγαγέν σε πρὸς ἡμᾶς — благословен Бог, приведший тебя к нам. καὶ ὁ πατήρ σου καὶ ἡ μήτηρ σου — «и отец твой и мать твоя»: сказуемое опущено (эллипсис), в переводе восполнено. В csl это 11:16b."
  18: "ἐγένετο χαρὰ πᾶσι … ἀδελφοῖς αὐτοῦ — радость была всем братьям его (χαρά). ἐν Νινευη — в Ниневии; дат. мн. «братьям» (слав. «братиям его»). В csl это 11:16c."
  19: "παρεγένετο — пришёл (παραγίνομαι). Αχιαχαρος — Ахикар (アヒカル). Νασβας ὁ ἐξάδελφος αὐτοῦ — Насвас, двоюродный брат его (ἐξάδελφος); слав. «сын брата его» — племянник, иное понимание родства. ἤχθη ὁ γάμος — «был проведён брак» (ἄγω, страд.); ἑπτὰ ἡμέρας — семь дней. В csl это 11:17–18."
