# jp-box, Деяния апостолов, глава 11. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 11: Пётр оправдывается перед иерусалимской церковью (1–18),
# церковь в Антиохии (19–26), Агав и голод (27–30).
# Красного в главе нет: 11:7–9 — голос с неба (не красным), 11:16 — слова Господа
# в пересказе Петра (цитата, как в Лк 24:6–7, не красным).
# 〔…〕 в главе нет: все стихи и слова в критической базе есть.
# Сноска: 11:28 Клавдий — римский император.
# jp-ni не использовался.

tr_code: jp-box
book: act
chapter: 11
draft: true

verses:
  1: "ユダヤにいる使徒[しと]たちと兄弟[きょうだい]たちは、異邦人[いほうじん]たちも神[かみ]の御言葉[みことば]を受[う]け入[い]れたと聞[き]いた。"
  2: "ペトロがエルサレムに上[のぼ]ると、割礼[かつれい]を受[う]けた者[もの]たちが、彼[かれ]を非難[ひなん]した。"
  3: "「あなたは、割礼[かつれい]を受[う]けていない人[ひと]たちのところに入[はい]って、彼[かれ]らと一緒[いっしょ]に食[た]べた。」"
  4: "ペトロは初[はじ]めから順[じゅん]を追[お]って、彼[かれ]らに説明[せつめい]し始[はじ]めた。"
  5: "「わたしはヨッパの町[まち]で祈[いの]っていたとき、夢[ゆめ]うつつを抜[ぬ]かしたような状態[じょうたい]になり、幻[まぼろし]を見[み]ました。大[おお]きな布[ぬの]のような器[うつわ]が四[よっ]隅[すみ]をつり下[さ]げられて天[てん]から降[お]り、わたしのところまで来[き]たのです。"
  6: "わたしはそれをじっと見[み]つめて、中[なか]をよく見[み]ました。すると、地上[ちじょう]の四[し]足[そく]の獣[けもの]、野[や]の獣[けもの]、這[は]うもの、空[そら]の鳥[とり]がいました。"
  7: "また、わたしに語[かた]りかける声[こえ]を聞[き]きました。『ペトロ、起[お]きて、屠[ほふ]って食[た]べよ。』"
  8: "わたしは言[い]いました。『主[しゅ]よ、決[けっ]してできません。汚[けが]れたもの、清[きよ]くないものは、これまで口[くち]に入[はい]ったことがありません。』"
  9: "すると声[こえ]が再[ふたた]び天[てん]から答[こた]えました。『神[かみ]が清[きよ]めたものを、あなたが汚[けが]れているとしてはいけない。』"
  10: "これが三[さん]度[ど]繰[く]り返[かえ]され、すべてがまた天[てん]へ引[ひ]き上[あ]げられました。"
  11: "そして、見[み]よ、すぐに、カイサリアからわたしのもとへ遣[つか]わされた三[さん]人[にん]の者[もの]が、わたしのいる家[いえ]の前[まえ]に立[た]ちました。"
  12: "{聖霊[せいれい]|聖神[せいしん]}は、何[なに]も疑[うたが]わずに彼[かれ]らと一緒[いっしょ]に行[い]くようにと、わたしに言[い]いました。また、この六人[ろくにん]の兄弟[きょうだい]たちもわたしと一緒[いっしょ]に行[い]き、わたしたちはその人[ひと]の家[いえ]に入[はい]りました。"
  13: "その人[ひと]は、天使[てんし]が家[いえ]に立[た]って、『ヨッパへ人[ひと]を遣[つか]わして、ペトロと呼[よ]ばれるシモンを呼[よ]び寄[よ]せ。"
  14: "彼[かれ]は、あなたとあなたの家族[かぞく]が救[すく]われる言葉[ことば]を、あなたに語[かた]るだろう』と言[い]ったのを、わたしたちに話[はな]しました。"
  15: "わたしが語[かた]り始[はじ]めると、{聖霊[せいれい]|聖神[せいしん]}が、初[はじ]めにわたしたちに降[くだ]ったのと同じように、彼[かれ]らにも降[くだ]りました。"
  16: "そのとき、わたしは主[しゅ]の言葉[ことば]を思[おも]い起[おこ]しました。『ヨハネは水[みず]で洗礼[せんれい]を授[さず]けたが、あなたがたは{聖霊[せいれい]|聖神[せいしん]}によって洗礼[せんれい]を受[う]ける』と。"
  17: "それなら、わたしたちが主[しゅ]イエス・キリストを信[しん]じたときと同じ賜[たまもの]を、神[かみ]が彼[かれ]らにもお与[あた]えになったのなら、神[かみ]を妨[さまた]げることなど、このわたしにできたでしょうか。」"
  18: "これを聞[き]くと、彼[かれ]らは静[しず]まり、神[かみ]を崇[あが]めて言[い]った。「それでは、神[かみ]は異邦人[いほうじん]にも、命[いのち]に至[いた]る悔[く]い改[あらた]めをお与[あた]えになったのだ。」"
  19: "さて、ステファノのことで起[お]こった苦[くる]しみのために散[ち]らされた人々[ひとびと]は、フェニキア、キプロス、アンティオキアまで行[い]ったが、ユダヤ人[じん]のほかにはだれにも御言葉[みことば]を語[かた]らなかった。"
  20: "しかし、彼[かれ]らの中[なか]にはキプロス人[じん]やキレネ人[じん]の者[もの]たちがいて、アンティオキアに来[き]てから、ギリシア人[じん]たちにも、主[しゅ]イエスの福音[ふくいん]を告[つ]げ知[し]らせた。"
  21: "主[しゅ]の手[て]が彼[かれ]らとともにあったので、多[おお]くの人[ひと]が信[しん]じて主[しゅ]に立[た]ち返[かえ]った。"
  22: "この話[はなし]はエルサレムの教会[きょうかい]の耳[みみ]にも届[とど]き、彼[かれ]らはバルナバをアンティオキアまで遣[つか]わした。"
  23: "彼[かれ]はそこに着[つ]いて神[かみ]の{恵[めぐ]み|恩寵[おんちょう]}を見[み]、喜[よろこ]んだ。そして、皆[みな]に、心[こころ]を決[けっ]して主[しゅ]にとどまるように勧[すす]めた。"
  24: "彼[かれ]は善[よ]い人[ひと]で、{聖霊[せいれい]|聖神[せいしん]}と信仰[しんこう]に満[み]ちていたからである。そして、多[おお]くの群衆[ぐんしゅう]が主[しゅ]に加[くわ]えられた。"
  25: "バルナバはサウロを捜[さが]しにタルソへ出[で]かけて行[い]き、"
  26: "彼[かれ]を見[み]つけると、アンティオキアへ連[つ]れて来[き]た。二人[ふたり]は一年[いちねん]の間[あいだ]、教会[きょうかい]に集[あつ]まって多[おお]くの群衆[ぐんしゅう]を教[おし]えた。弟子[でし]たちが「クリスチャン」と呼[よ]ばれるようになったのは、アンティオキアが初[はじ]めであった。"
  27: "そのころ、預言者[よげんしゃ]たちがエルサレムからアンティオキアへ下[くだ]って来[き]た。"
  28: "そのうちの一人[ひとり]で、アガボという名[な]の者[もの]が立[た]ち、{聖霊[せいれい]|聖神[せいしん]}によって、全世界[ぜんせかい]に大[おお]きな飢[き]饉[きん]が起[お]ころうとしていると告[つ]げた。この飢饉[ききん]は、クラウディウス⟨ローマ皇帝[こうてい]（在位[ざいい]四十一[よんじゅういち]〜五十四[ごじゅうよん]年[ねん]）。⟩の時代[じだい]に実際[じっさい]に起[お]こった。"
  29: "そこで弟子[でし]たちは、それぞれ自分[じぶん]の力[ちから]に応[おう]じて、ユダヤに住[す]む兄弟[きょうだい]たちへの援助[えんじょ]として送[おく]ることを決[き]めた。"
  30: "彼[かれ]らはそうして、バルナバとサウロの手[て]によって、長老[ちょうろう]たちに贈[おく]り物[もの]を届[とど]けた。"

notes:
  5: "ἔκστασις — «исступление»; 夢うつつを抜かしたような状態 (как в 10:10). ὀθόνη — 布 (10:11)."
  7: "Голос с неба — не красным (решение для корпуса); внутри пересказа Петра цитаты даны 『…』."
  12: "ἓξ ἀδελφοί — шесть братьев (вместе с Петром семь); この六人の兄弟 (ср. 10:23)."
  14: "ὃς λαλήσει ῥήματα πρὸς σέ… — слова ангела в пересказе Корнилия; 11:14 в критической базе есть, 〔…〕 не ставится."
  16: "Слова Господа, пересказанные Петром, — не красным (цитата, ср. Лк 24:6–7). ἐμνήσθην — «вспомнил»; 思い起こしました."
  19: "θλῖψις ἡ γενομένη ἐπὶ Στεφάνῳ — «скорбь, бывшая из-за Стефана»; ステファノのことで起こった苦しみ."
  20: "Ἕλληνας — «эллины, греки» (не Ἑλληνισταί, ср. 9:29); ギリシア人."
  22: "ἐκκλησία — 教会; ἕως Ἀντιοχείας — «до Антиохии»; アンティオキアまで."
  23: "προθέσει τῆς καρδίας — «расположением сердца»; 心を決して. παράκλησις здесь — «увещание»; 勧めた."
  26: "χρηματίσαι πρώτως… Χριστιανούς — «впервые называться христианами»; クリスチャン. В Антиохии впервые."
  28: "Κλαύδιος — Клавдий, римский император (41–54); сноска. λιμός — голод, 飢饉."
  30: "πρεσβύτεροι — 長老; διὰ χειρὸς Βαρναβᾶ καὶ Σαύλου — «через руки Варнавы и Савла»; バルナバとサウロの手によって."
