verses:
  1: "これらのことがあって後[のち]、主[しゅ]の言葉[ことば]が幻[まぼろし]の中[なか]でアブラムに臨[のぞ]み、言[い]った。「恐[おそ]れるな、アブラム。わたしはあなたを守[まも]る。あなたの報[むく]いは非常[ひじょう]に大[おお]きい。」"
  2: "アブラムは言[い]った。「主[しゅ]よ。あなたはわたしに何[なに]を与[あた]えてくださるのか。わたしは子[こ]なくして去[さ]って行[ゆ]く。わたしの家[いえ]に生[う]まれた女[おんな]の子[こ]マセク、これがダマスコのエリエゼルである。」"
  3: "アブラムは言[い]った。「あなたはわたしに子[こ]を与[あた]えてくださらなかった。だから、わたしの家[いえ]に生[う]まれた者[もの]が、わたしの嗣[つ]ぐ者[もの]となるのである。」"
  4: "すると、すぐに主[しゅ]の声[こえ]が彼[かれ]に臨[のぞ]み、言[い]った。「この者[もの]があなたの嗣[つ]ぐ者[もの]となるのではない。あなたから出[で]る者[もの]が、あなたの嗣[つ]ぐ者[もの]となるのである。」"
  5: "主[しゅ]は彼[かれ]を外[そと]に連[つ]れ出[だ]して言[い]われた。「天[てん]を仰[あお]いで、星[ほし]を数[かぞ]えてみよ。数[かぞ]えられるか。」そして言[い]われた。「あなたの子孫[しそん]は、このようになる。」"
  6: "アブラムは神[かみ]を信[しん]じた。その信仰[しんこう]が彼[かれ]の義[ぎ]と認[みと]められた。"
  7: "主[しゅ]は彼[かれ]に言[い]われた。「わたしは、あなたをカルデア人[じん]の地[ち]から導[みちび]き出[だ]して、この地[ち]をあなたに与[あた]え、嗣[つ]がせるようにした神[かみ]である。」"
  8: "アブラムは言[い]った。「主[しゅ]よ、神[かみ]よ。わたしがそれを嗣[つ]ぐことを、何[なに]によって知[し]ることができるのか。」"
  9: "主[しゅ]は彼[かれ]に言[い]われた。「わたしのために、三歳[さんさい]の雌牛[めうし]、三歳[さんさい]の雌山羊[めやぎ]、三歳[さんさい]の雄羊[おひつじ]、山鳩[やまばと]、若[わか]い鳩[はと]を取[と]れ。」"
  10: "彼[かれ]はそれらすべてを取[と]り、真[ま]ん中[なか]から裂[さ]いて、それぞれを互[たが]いに向[む]かい合[あ]わせて置[お]いた。ただ、鳥[とり]は裂[さ]かなかった。"
  11: "鳥[とり]たちがその死骸[しがい]の上[うえ]に降[くだ]って来[き]た。アブラムはそれらのそばに座[すわ]った。"
  12: "日[ひ]が沈[しず]むころ、アブラムは深[ふか]い眠[ねむ]りに包[つつ]まれ、見[み]よ、大[おお]きな暗[くら]い恐[おそ]れが彼[かれ]に降[ふ]りかかった。"
  13: "主[しゅ]はアブラムに言[い]われた。「あなたは確[たし]かに知[し]っておきなさい。あなたの子孫[しそん]は自分[じぶん]のものでない地[ち]に寄留[きりゅう]し、四百年[よんひゃくねん]の間[あいだ]、彼[かれ]らを奴隷[どれい]にし、苦[くる]しめ、低[ひく]くする。"
  14: "しかし、彼[かれ]らが仕[つか]える民[たみ]を、わたしは裁[さば]く。その後[のち]、彼[かれ]らは多[おお]くの財産[ざいさん]を携[たずさ]えて、ここへ出[で]て来[く]る。"
  15: "あなたは安[やす]らかに先祖[せんぞ]たちのところへ行[ゆ]き、良[よ]い老[お]いを遂[と]げて葬[ほうむ]られる。"
  16: "四代目[よんだいめ]に、彼[かれ]らはここへ帰[かえ]って来[く]る。アモル人[じん]の罪[つみ]は、今[いま]に至[いた]るまで、まだ満[み]ちていないからである。」"
  17: "日[ひ]が沈[しず]んで暗[くら]くなると、炎[ほのお]が現[あらわ]れ、見[み]よ、煙[けむ]る炉[かまど]と火[ひ]のたいまつが、裂[さ]かれたそれらの間[あいだ]を通[とお]り抜[ぬ]けた。"
  18: "その日[ひ]、主[しゅ]はアブラムと契約[けいやく]を結[むす]び、言[い]われた。「わたしはこの地[ち]をあなたの子孫[しそん]に与[あた]える。エジプトの川[かわ]から大[おお]きな川[かわ]、ユーフラテス川[がわ]まで、"
  19: "すなわち、カイナイ人[じん]、ケネズ人[じん]、ケドモン人[じん]、"
  20: "ヘト人[じん]、フェレジ人[じん]、ラファイン人[じん]、"
  21: "アモル人[じん]、カナン人[じん]、エビ人[じん]、ゲルゲシ人[じん]、エブス人[じん]。」"

notes:
  1: "Μετὰ τὰ ῥήματα ταῦτα — これらのことがあって後. ἐγενήθη ῥῆμα κυρίου πρὸς Αβραμ ἐν ὁράματι — 主の言葉が幻の中でアブラムに臨み (ὅραμα — «видение»). Μὴ φοβοῦ — 恐れるな. ἐγὼ ὑπερασπίζω σου — わたしはあなたを守る (ὑπερασπίζω — «защищать, быть щитом»). ὁ μισθός σου πολὺς σφόδρα — あなたの報いは非常に大きい (μισθός — «награда»)."
  2: "Δέσποτα — 主よ (δεσπότης — «владыка»; ср. ст. 8). τί μοι δώσεις — わたしに何を与えてくださるのか. ἀπολύομαι ἄτεκνος — 子なくして去って行く (ἀπολύομαι — «ухожу, умираю»; ἄτεκνος — «бездетный»). ὁ υἱὸς Μασεκ τῆς οἰκογενοῦς μου — 家の女の子マセク: тёмное место LXX, дословно передано как есть (jp-joc толкует иначе: «ダマスクのエレアザル»). Δαμασκὸς Ελιεζερ — ダマスコのエリエゼル."
  3: "Ἐπειδὴ ἐμοὶ οὐκ ἔδωκας σπέρμα — あなたはわたしに子を与えてくださらなかった. ὁ οἰκογενής μου κληρονομήσει με — 家に生まれた者がわたしの嗣ぐ者となる (κληρονομέω — 嗣ぐ)."
  4: "εὐθὺς φωνὴ κυρίου ἐγένετο — すぐに主の声が臨んだ. Οὐ κληρονομήσει σε οὗτος — この者があなたを嗣ぐのではない. ὃς ἐξελεύσεται ἐκ σοῦ — あなたから出る者."
  5: "ἐξήγαγεν αὐτὸν ἔξω — 彼を外に連れ出して. Ἀνάβλεψον δὴ εἰς τὸν οὐρανόν — 天を仰いで. ἀρίθμησον τοὺς ἀστέρας — 星を数えてみよ. Οὕτως ἔσται τὸ σπέρμα σου — あなたの子孫はこのようになる."
  6: "ἐπίστευσεν Αβραμ τῷ θεῷ — アブラムは神を信じた. ἐλογίσθη αὐτῷ εἰς δικαιοσύνην — その信仰が彼の義と認められた (λογίζομαι — «вменять, засчитывать»; δικαιοσύνη — 義; ср. Рим 4:3; Гал 3:6)."
  7: "Ἐγὼ ὁ θεὸς ὁ ἐξαγαγών σε — あなたを導き出した神である. ὥστε δοῦναί σοι τὴν γῆν ταύτην κληρονομῆσαι — この地をあなたに与えて嗣がせるために."
  8: "Δέσποτα κύριε — 主よ、神よ (два обращения: δεσπότης и κύριος). κατὰ τί γνώσομαι — 何によって知ることができるのか."
  9: "δάμαλιν τριετίζουσαν — 三歳の雌牛 (δάμαλις). αἶγα καὶ κριόν — 雌山羊、雄羊 (τριετίζων — «трёхлетний»). τρυγόνα καὶ περιστεράν — 山鳩と若い鳩."
  10: "διεῖλεν αὐτὰ μέσα — 真ん中から裂いた. ἔθηκεν ἀντιπρόσωπα ἀλλήλοις — 互いに向かい合わせて置いた. τὰ δὲ ὄρνεα οὐ διεῖλεν — ただ鳥は裂かなかった."
  11: "κατέβη ὄρνεα ἐπὶ τὰ σώματα — 鳥たちが死骸の上に降って来た. συνεκάθισεν αὐτοῖς Αβραμ — アブラムはそれらのそばに座った (συγκαθίζω; слав. «седе близу их»; масор. «отгонял» — в LXX иного чтения нет, поэтому буквально)."
  12: "περὶ ἡλίου δυσμάς — 日の沈むころ. ἔκστασις ἐπέπεσεν τῷ Αβραμ — アブラムに深い眠りが襲いかかった (ἔκστασις — «исступление, оцепенение»; слав. «ужас»). φόβος σκοτεινὸς μέγας — 大きな暗い恐れ."
  13: "Γινώσκων γνώσῃ — 確かに知っておきなさい (гебраизм: «зная узнаешь»). πάροικον ἔσται τὸ σπέρμα σου ἐν γῇ οὐκ ἰδίᾳ — あなたの子孫は自分のものでない地に寄留する. δουλώσουσιν, κακώσουσιν, ταπεινώσουσιν — 奴隷にし、苦しめ、低くする (три глагола сохранены). τετρακόσια ἔτη — 四百年."
  14: "τὸ ἔθνος ᾧ ἐὰν δουλεύσωσιν κρινῶ ἐγώ — 彼らが仕える民をわたしは裁く. μετὰ ἀποσκευῆς πολλῆς — 多くの財産を携えて."
  15: "ἀπελεύσῃ πρὸς τοὺς πατέρας σου — 先祖たちのところへ行く. μετ᾽ εἰρήνης — 安らかに. ταφεὶς ἐν γήρει καλῷ — 良い老いを遂げて葬られる (γῆρας — «старость»)."
  16: "τετάρτῃ γενεᾷ — 四代目に. οὔπω ἀναπεπλήρωνται αἱ ἁμαρτίαι τῶν Αμορραίων — アモル人の罪はまだ満ちていない (ἀναπληρόω). ἕως τοῦ νῦν — 今に至るまで."
  17: "ἐπεὶ ἐγίνετο ὁ ἥλιος πρὸς δυσμαῖς — 日が沈んで. φλὸξ ἐγένετο — 炎が現れた. κλίβανος καπνιζόμενος — 煙る炉 (κλίβανος — «печь»). λαμπάδες πυρός — 火のたいまつ. διῆλθον ἀνὰ μέσον τῶν διχοτομημάτων — 裂かれたものの間を通り抜けた (διχοτόμημα — «рассечённое»)."
  18: "διέθετο κύριος τῷ Αβραμ διαθήκην — 主はアブラムと契約を結んだ (διατίθημι). ἀπὸ τοῦ ποταμοῦ Αἰγύπτου ἕως τοῦ ποταμοῦ τοῦ μεγάλου, ποταμοῦ Εὐφράτου — エジプトの川から大きな川、ユーフラテス川まで."
  19: "Καιναίους, Κενεζαίους, Κεδμωναίους — カイナイ人、ケネズ人、ケドモン人."
  20: "Χετταίους, Φερεζαίους, Ραφαιν — ヘト人、フェレジ人、ラファイン人."
  21: "Αμορραίους, Χαναναίους, Ευαίους, Γεργεσαίους, Ιεβουσαίους — アモル人、カナン人、エビ人、ゲルゲシ人、エブス人."
