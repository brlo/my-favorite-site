# jp-box, Бытие, глава 15. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 15: видение и обетование о потомстве (1–6), завет и земля (7–8),
# жертвенные животные и пророчество о Египте (9–16), завет между рассечёнными (17–21).
# Красного и синего нет: речь Бога (1, 4, 5, 7, 9, 13–16, 18–21) и Аврама (2–3, 8) — 「…」.
# 〔…〕 нет: все слова есть в gr-lxx-byz.
# Места LXX, расходящиеся с масоретским: 15:2 (тёмное «сын Масек»), 15:11 (Аврам «сел
# при трупах», а не «отгонял птиц»), 15:15 (не названо погребение в Хевроне).
# 15:6 — «アブラムは神を信じた。その信仰が彼の義と認められた». jp-ni не использовался.

