# jp-box, Притчи, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для
# понимания, не источник. jp-joc есть только для 22:1–4 (контроль церковного чтения);
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 22: доброе имя (1), богатые и бедные (2), благоразумный (3), страх Господень (4),
# тернии и сети (5), богатые и рабы (6–7), сеющий и дающий (8–9), губитель в собрании (10),
# чистое сердце (11), очи Господни (12), ленивец и львы (13), глубокая яма (14),
# безрассудство юного (15), притеснитель бедного (16), «слова мудрых» (17–21),
# бедный у ворот (22–23), гневливый (24–25), поручительство (26–27),
# межа (28), проворный (29).
# Речь: слова ленивого в 13 — 「…」; 17–21 — наставление учителя, 20–21 — его слова
# о себе, но без внешних кавычек (как и в гл. 1–9); прочее — авторские изречения.
# Нумерация по gr: 29 стихов.
# ВНИМАНИЕ (дефект модуля и сдвиг csl):
#  22:6 в gr-lxx-byz стоит как «.», а csl 22:6–7 делят gr 22:7 на две половины
#  («Богатии убогими имут обладати» / «и раби своим господем взаим дадут»). Наш 22:6
#  переведён по csl 22:6, наш 22:7 — целиком по gr 22:7; перекрытие отмечено в notes.
#  В gr 22:8, 22:9 и 22:14 есть подстихи 8a/9a/14a (в csl они стоят отдельными стихами
#  9, 10, 15), а gr 22:20–21 в csl слиты в один ст. 21; поэтому csl с 9 по 21 идёт
#  на один стих впереди gr. Держимся деления gr, подстихи оставлены в своих стихах.
# 〔…〕 нет: пропуск модуля — не церковное добавление; сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

