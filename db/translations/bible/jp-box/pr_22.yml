verses:
  1: "良[よ]い名[な]は多[おお]くの富[とみ]にまさり、銀[ぎん]や金[きん]よりも、恵[めぐ]みは良[よ]い。"
  2: "富[とみ]める者[もの]と貧[まず]しい者[もの]は互[たが]いに出会[であ]う。両方[りょうほう]とも主[しゅ]が造[つく]られた。"
  3: "賢[かしこ]い者[もの]は、悪[あく]をなす者[もの]が厳[きび]しく罰[ばつ]せられるのを見[み]て、自分[じぶん]も戒[いまし]めを受[う]ける。しかし、愚[おろ]かな者[もの]たちは、そばを通[とお]り過[す]ぎて損[そん]をする。"
  4: "知恵[ちえ]の生[う]みは主[しゅ]を恐[おそ]れること、すなわち富[とみ]と栄光[えいこう]と命[いのち]である。"
  5: "曲[ま]がった道[みち]には茨[いばら]と罠[わな]がある。しかし、自分[じぶん]の魂[たましい]を守[まも]る者[もの]は、それらから遠[とお]ざかる。"
  6: "富[とみ]める者[もの]は貧[まず]しい者[もの]を支配[しはい]する。"
  7: "富[とみ]める者[もの]は貧[まず]しい者[もの]を支配[しはい]し、しもべは自分[じぶん]の主人[しゅじん]たちに貸[か]し与[あた]える。"
  8: "悪[あく]をまく者[もの]は悪[あく]を刈[か]り取[と]り、そのわざの打[う]ち傷[きず]を終[お]わりまで受[う]ける。神[かみ]は喜[よろこ]びに満[み]ちて与[あた]える人[ひと]を祝福[しゅくふく]し、そのわざの空[むな]しさを終[お]わらせる。"
  9: "貧[まず]しい者[もの]をあわれむ者[もの]は自分[じぶん]も養[やしな]われる。自分[じぶん]のパンを貧[まず]しい者[もの]に与[あた]えたからである。贈[おく]り物[もの]をする者[もの]は勝利[しょうり]と誉[ほま]れを得[え]るが、持[も]ち主[ぬし]たちから魂[たましい]を奪[うば]い取[と]る。"
  10: "集[あつ]まりから人[ひと]を滅[ほろ]ぼす者[もの]を追[お]い出[だ]せ。そうすれば、その者[もの]とともに争[あらそ]いも去[さ]る。その者[もの]が会合[かいごう]に座[すわ]ると、すべての者[もの]を辱[はずかし]めるからである。"
  11: "主[しゅ]は聖[せい]なる心[こころ]を愛[あい]される。傷[きず]のない者[もの]は、その道[みち]において、すべて主[しゅ]に喜[よろこ]ばれる。王[おう]は唇[くちびる]で養[やしな]う。"
  12: "主[しゅ]の目[め]は悟[さと]りを守[まも]る。しかし、不[ふ]法[ほう]な者[もの]は言葉[ことば]を蔑[さげす]む。"
  13: "怠[なま]ける者[もの]は言[い]い訳[わけ]をする。「道[みち]には獅子[しし]がいる。広場[ひろば]には人殺[ひとごろ]しがいる。」"
  14: "不[ふ]法[ほう]な者[もの]の口[くち]は深[ふか]い穴[あな]である。主[しゅ]に憎[にく]まれた者[もの]はそこに落[お]ち込[こ]む。人[ひと]の前[まえ]には悪[わる]い道[みち]があり、その人[ひと]はそこから離[はな]れることを好[この]まない。しかし、曲[ま]がった悪[わる]い道[みち]から離[はな]れなければならない。"
  15: "若[わか]い者[もの]の心[こころ]には無知[むち]が結[むす]びついている。しかし、むちと戒[いまし]めがそれを遠[とお]ざける。"
  16: "貧[まず]しい者[もの]を虐[しいた]げて自分[じぶん]の富[とみ]を増[ふ]やす者[もの]は、富[とみ]める者[もの]に与[あた]えて、かえって減[へ]らすことになる。"
  17: "知恵[ちえ]ある者[もの]たちの言葉[ことば]にあなたの耳[みみ]を傾[かたむ]け、わたしの言葉[ことば]を聞[き]け。あなたの心[こころ]を注[そそ]ぎ、それらが良[よ]いものであることを知[し]れ。"
  18: "あなたがそれらを自分[じぶん]の心[こころ]に置[お]くなら、それらはあなたの唇[くちびる]の上[うえ]で、ともにあなたを喜[よろこ]ばせる。"
  19: "それは、あなたの希望[きぼう]が主[しゅ]の上[うえ]にあるためであり、主[しゅ]があなたにご自分[じぶん]の道[みち]を知[し]らせるためである。"
  20: "あなたもまた、それらを自分[じぶん]のために三度[さんど]書[か]き記[しる]せ。計画[けいかく]と悟[さと]りと知識[ちしき]のために、あなたの心[こころ]の広[ひろ]さに応[おう]じて。"
  21: "そこで、わたしはあなたに、真[しん]実[じつ]の言葉[ことば]と良[よ]い知識[ちしき]とに聞[き]き従[したが]うことを教[おし]える。あなたに問[と]いかける者[もの]たちに、真理[しんり]の言葉[ことば]を答[こた]えるために。"
  22: "貧[まず]しい者[もの]を力[ちから]ずくで奪[うば]ってはならない。その者[もの]は貧[まず]しいからである。弱[よわ]い者[もの]を門[もん]のところで辱[はずかし]めてはならない。"
  23: "主[しゅ]がその者[もの]の訴[うった]えを裁[さば]かれるからである。そして、あなたは自分[じぶん]の無事[ぶじ]な魂[たましい]を救[すく]い出[だ]す。"
  24: "激[はげ]しく怒[いか]る人[ひと]の仲間[なかま]となってはならない。怒[いか]りっぽい友[とも]とともに宿[やど]ってはならない。"
  25: "あなたがその人[ひと]の道[みち]を学[まな]び、自分[じぶん]の魂[たましい]に罠[わな]をかけることにならないためである。"
  26: "人[ひと]の顔[かお]をはばかって、自分[じぶん]を保証[ほしょう]に差[さ]し出[だ]してはならない。"
  27: "あなたが返[かえ]すものを持[も]っていないなら、彼[かれ]らはあなたの脇[わき]の下[した]の寝床[ねどこ]を取[と]り上[あ]げるからである。"
  28: "あなたの父[ちち]たちが置[お]いた永遠[えいえん]の境[さかい]を移[うつ]してはならない。"
  29: "明敏[めいびん]で鋭[するど]い人[ひと]は、王[おう]たちの前[まえ]に立[た]つのがふさわしい。そして、鈍[にぶ]い人[ひと]たちの前[まえ]に立[た]つことはない。"

notes:
  1: "αἱρετώτερον ὄνομα καλὸν ἢ πλοῦτος πολύς — «предпочтительнее имя доброе, чем богатство многое» (αἱρετός — «предпочтительный»). ὑπὲρ δὲ ἀργύριον καὶ χρυσίον χάρις ἀγαθή — «а выше серебра и золота — благодать благая»: χάρις здесь, вероятно, «добрая слава, благоволение» (слав. «благодать благая», jp-joc 令聞); по паритету оставлено церковное 恵み."
  2: "πλούσιος καὶ πτωχὸς συνήντησαν ἀλλήλοις — «богатый и бедный встретились друг с другом» (συναντάω — «встречать»). ἀμφοτέρους δὲ ὁ κύριος ἐποίησεν — «обоих же Господь создал»; слав. «обоих же Господь сотвори»."
  3: "πανοῦργος ἰδὼν πονηρὸν τιμωρούμενον κραταιῶς αὐτὸς παιδεύεται — «смышлёный, увидев злодея жестоко наказываемым, сам научается» (πανοῦργος — «смышлёный, хитрый»; τιμωρέω — «наказывать»; παιδεύομαι — «быть наставляемым»). οἱ δὲ ἄφρονες παρελθόντες ἐζημιώθησαν — «а глупые, пройдя мимо, потерпели ущерб» (ζημιόω — «терпеть урон»)."
  4: "γενεὰ σοφίας φόβος κυρίου — «род мудрости — страх Господень» (γενεά — «род, порождение»); слав. «Род премудрости страх Господень». καὶ πλοῦτος καὶ δόξα καὶ ζωή — «и богатство, и слава, и жизнь»."
  5: "τρίβολοι καὶ παγίδες ἐν ὁδοῖς σκολιαῖς — «тернии и сети на путях кривых» (τρίβολος — «колючка, терн»; παγίς — 罠). ὁ δὲ φυλάσσων τὴν ἑαυτοῦ ψυχὴν ἀφέξεται αὐτῶν — «а хранящий свою душу воздержится от них» (ἀπέχω — «держаться вдали»)."
  6: "В gr-lxx-byz на месте стиха «.» — дефект модуля; переведено по csl 22:6: «Богатии убогими имут обладати». Это первая половина гр. 22:7: слав. делит гр. 22:7 на два стиха (csl 6 и csl 7), поэтому наш ст. 7 повторяет эту мысль и добавляет вторую половину — перекрытие отмечено в notes 7. 〔…〕 не ставятся: это пробел модуля."
  7: "πλούσιοι πτωχῶν ἄρξουσιν, καὶ οἰκέται ἰδίοις δεσπόταις δανιοῦσιν — «богатые будут начальствовать над бедными, и слуги своим господам дадут взаймы» (δανίζω — «давать в долг»; δεσπότης — 主人). Стих переведён целиком по гр., поэтому первая половина совпадает со ст. 6, взятым из csl 22:6: это слав. деление гр. 22:7, а не два разных стиха. 〔…〕 нет."
  8: "ὁ σπείρων φαῦλα θερήσει κακά — «сеющий худое пожнёт злое» (φαῦλος — «дурной»; θερίζω — «жать»). πληγὴν δὲ ἔργων αὐτοῦ συντελέσει — «и язву дел своих совершит» (πληγή — «удар, язва»; συντελέω — «завершать»). Подстих 8a дописан в модуле к ст. 8: ἄνδρα ἱλαρὸν καὶ δότην εὐλογεῖ ὁ θεός — «человека радостного и дающего благословляет Бог», ματαιότητα δὲ ἔργων αὐτοῦ συντελέσει — «и суету дел его совершит»; в csl он стоит отдельным ст. 9 («Мужа тиха и даятеля любит Господь…»). По делению gr оставлен в ст. 8, поэтому наш ст. 9 начинается с ὁ ἐλεῶν."
  9: "ὁ ἐλεῶν πτωχὸν αὐτὸς διατραφήσεται — «милующий бедного сам будет питаем» (διατρέφω — «кормить»); τῶν γὰρ ἑαυτοῦ ἄρτων ἔδωκεν τῷ πτωχῷ — «ибо от своих хлебов дал бедному». Подстих 9a (νίκην καὶ τιμὴν περιποιεῖται ὁ δώρα δούς — «победу и честь приобретает дающий дары», τὴν μέντοι ψυχὴν ἀφαιρεῖται τῶν κεκτημένων — «но душу отнимает у приобретших») в csl стоит во второй половине ст. 10; по делению gr оставлен в ст. 9. Кто отнимает душу — в греч. неясно; передано буквально."
  10: "ἔκβαλε ἐκ συνεδρίου λοιμόν — «изгони из собрания губителя» (συνέδριον — «собрание, совет»; λοιμός — «губитель, зараза»). καὶ συνεξελεύσεται αὐτῷ νεῖκος — «и выйдет с ним вместе ссора» (νεῖκος — «ссора, распря»). ὅταν γὰρ καθίσῃ ἐν συνεδρίῳ, πάντας ἀτιμάζει — «ибо когда сядет в собрании, всех бесчестит» (ἀτιμάζω — «бесчестить»)."
  11: "ἀγαπᾷ κύριος ὁσίας καρδίας — «любит Господь святые сердца» (ὅσιος — «святой, благочестивый»). δεκτοὶ δὲ αὐτῷ πάντες ἄμωμοι — «и приятны Ему все непорочные»; слав. добавляет «в путех своих» — этого нет в LXX, по паритету внесено в основной текст (その道において). χείλεσιν ποιμαίνει βασιλεύς — «устами пасёт царь»; слав. в скобках прибавляет «(люди своя)» — в перевод не внесено, объекта в гр. нет."
  12: "οἱ δὲ ὀφθαλμοὶ κυρίου διατηροῦσιν αἴσθησιν — «очи Господа соблюдают чувство/знание» (αἴσθησις — «чувство, восприятие, знание»; слав. «чувство», Син. «знание»); передано 悟り. φαυλίζει δὲ λόγους παράνομος — «а беззаконник уничижает слова» (φαυλίζω — «считать ничтожным»)."
  13: "προφασίζεται καὶ λέγει ὀκνηρός — «отговаривается и говорит ленивый» (προφασίζομαι — «искать предлог»; ὀκνηρός — «ленивый»). Λέων ἐν ταῖς ὁδοῖς, ἐν δὲ ταῖς πλατείαις φονευταί — «лев на дорогах, а на площадях убийцы»: слова ленивого, прямая речь, 「…」 (πλατεῖα — «широкая улица, площадь»; φονεύς — «убийца»)."
  14: "βόθρος βαθὺς στόμα παρανόμου — «глубокая яма — уста беззаконника» (βόθρος — «яма»). ὁ δὲ μισηθεὶς ὑπὸ κυρίου ἐμπεσεῖται εἰς αὐτόν — «а ненавидимый Господом упадёт в неё» (ἐμπίπτω — «впадать»). Подстих 14a дописан в модуле к ст. 14: εἰσὶν ὁδοὶ κακαὶ ἐνώπιον ἀνδρός… ἀποστρέφειν δὲ δεῖ ἀπὸ ὁδοῦ σκολιᾶς καὶ κακῆς — «есть пути злые пред человеком… но должно уклоняться от пути кривого и злого»; в csl он стоит отдельным ст. 15, по делению gr оставлен в ст. 14."
  15: "ἄνοια ἐξῆπται καρδίας νέου — «безрассудство привешено к сердцу юного» (ἄνοια — «неразумие»; ἐξάπτω — «привешивать, привязывать»); слав. «Безумие висит на сердцы юнаго». ῥάβδος δὲ καὶ παιδεία μακρὰν ἀπ᾽ αὐτοῦ — «жезл же и наказание далеко от него»: буквально «далеко», по смыслу отгоняют; слав. прибавляет «(отгонит)», Синодальный «удалит её от него». Передано 遠ざける."
  16: "ὁ συκοφαντῶν πένητα πολλὰ ποιεῖ τὰ ἑαυτοῦ — «притесняющий бедного многое делает своё» (συκοφαντέω — «обижать, доносить»); слав. «многая себе зла творит» — иное чтение, отмечено. δίδωσιν δὲ πλουσίῳ ἐπ᾽ ἐλάσσονι — «даёт же богатому к умалению» (ἐπ᾽ ἐλάσσονι — «к уменьшению»)."
  17: "Λόγοις σοφῶν παράβαλλε σὸν οὖς — «к словам мудрых приложи ухо твоё» (παραβάλλω — «прилагать»). καὶ ἄκουε ἐμὸν λόγον — «и слушай слово моё»: с этого стиха начинается раздел «слова мудрых» (22:17–29), речь учителя. τὴν δὲ σὴν καρδίαν ἐπίστησον, ἵνα γνῷς ὅτι καλοί εἰσιν — «и сердце твоё обрати, чтобы знать, что они хороши» (ἐφίστημι — «ставить, обращать»)."
  18: "καὶ ἐὰν ἐμβάλῃς αὐτοὺς εἰς τὴν καρδίαν σου — «и если вложишь их в сердце твоё» (ἐμβάλλω — «вкладывать»). εὐφρανοῦσίν σε ἅμα ἐπὶ σοῖς χείλεσιν — «возвеселят тебя вместе на устах твоих»; слав. «возвеслят тебе купно во твоих устнех»."
  19: "ἵνα σου γένηται ἐπὶ κύριον ἡ ἐλπίς — «чтобы надежда твоя была на Господа» (ἐλπίς — 希望). καὶ γνωρίσῃ σοι τὴν ὁδὸν αὐτοῦ — «и Он возвестит тебе путь Свой» (γνωρίζω — «давать знать»)."
  20: "καὶ σὺ δὲ ἀπόγραψαι αὐτὰ σεαυτῷ τρισσῶς — «и ты запиши их себе трижды» (ἀπογράφω — «списывать, записывать»; τρισσῶς — «трижды»). εἰς βουλὴν καὶ γνῶσιν — «в совет и знание»; слав. «на совет и смысл и разум» добавляет третий член, по паритету внесён (計画と悟りと知識). ἐπὶ τὸ πλάτος τῆς καρδίας σου — «на широте сердца твоего» (πλάτος — «широта»)."
  21: "διδάσκω οὖν σε ἀληθῆ λόγον καὶ γνῶσιν ἀγαθήν — «итак, учу тебя слову истинному и знанию доброму». ὑπακούειν τοῦ ἀποκρίνεσθαι λόγους ἀληθείας — «слушаться, чтобы отвечать словами истины» (ὑπακούω — «слушать, внимать»; ἀποκρίνομαι — «отвечать»). τοῖς προβαλλομένοις σοι — «предлагающим тебе» (προβάλλω — «предлагать, задавать»)."
  22: "Μὴ ἀποβιάζου πένητα, πτωχὸς γάρ ἐστιν — «не отнимай силой у бедного, ибо он беден» (ἀποβιάζομαι — «притеснять силой»). μηδὲ ἀτιμάσῃς ἀσθενῆ ἐν πύλαις — «и не бесчести немощного у ворот»: ворота — место суда (ἀτιμάζω — «бесчестить»; πύλη — 門)."
  23: "ὁ γὰρ κύριος κρινεῖ αὐτοῦ τὴν κρίσιν — «ибо Господь будет судить его суд», т. е. вступится в его дело. καὶ ῥύσῃ σὴν ἄσυλον ψυχήν — «и ты избавишь свою безопасную душу» (ῥύομαι — «избавлять»; ἄσυλος — «неприкосновенный, безопасный»); слав. «избавиши твою безбедную душу». Смысл второй половины тёмный, передано буквально."
  24: "μὴ ἴσθι ἑταῖρος ἀνδρὶ θυμώδει — «не будь товарищем человеку вспыльчивому» (ἑταῖρος — «товарищ»; θυμώδης — «вспыльчивый»). φίλῳ δὲ ὀργίλῳ μὴ συναυλίζου — «и с другом гневливым не живи вместе» (συναυλίζομαι — «жить под одной кровлей»)."
  25: "μήποτε μάθῃς τῶν ὁδῶν αὐτοῦ — «как бы тебе не научиться путям его» (μήποτε — «как бы не»). καὶ λάβῃς βρόχους τῇ σῇ ψυχῇ — «и не взять петли на свою душу» (βρόχος — «петля, силок»)."
  26: "μὴ δίδου σεαυτὸν εἰς ἐγγύην — «не отдавай себя в поручительство» (ἐγγύη — «поручительство, залог»). αἰσχυνόμενος πρόσωπον — «стыдясь лица», т. е. из ложного стыда перед человеком (αἰσχύνομαι — «стыдиться»); слав. «стыдяся лица»."
  27: "ἐὰν γὰρ μὴ ἔχῃς πόθεν ἀποτείσῃς — «ибо если не имеешь чем отдать» (ἀποτίνω — «выплачивать»). λήμψονται τὸ στρῶμα τὸ ὑπὸ τὰς πλευράς σου — «возьмут постель, что под боками твоими» (στρῶμα — «постель»; πλευρά — «бок, ребро»); слав. «возмут постелю, яже под ребры твоими»."
  28: "μὴ μέταιρε ὅρια αἰώνια — «не передвигай пределов вечных» (μεταίρω — «перемещать»; ὅριον — 境), ср. 23:10. ἃ ἔθεντο οἱ πατέρες σου — «которые положили отцы твои» (τίθημι — «полагать»)."
  29: "ὁρατικὸν ἄνδρα καὶ ὀξὺν ἐν τοῖς ἔργοις αὐτοῦ — «человека прозорливого и острого в делах его» (ὁρατικός — «видящий, прозорливый»; ὀξύς — «острый»). βασιλεῦσι δεῖ παρεστάναι — «подобает предстоять царям» (παρίστημι — «предстоять»); καὶ μὴ παρεστάναι ἀνδράσι νωθροῖς — «и не предстоять людям медлительным» (νωθρός — «вялый, тупой»); слав. «пред мужми простыми»."
