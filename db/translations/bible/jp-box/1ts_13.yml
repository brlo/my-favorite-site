# jp-box, 1-я Царств, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: выбор трёх тысяч (1–2), поражение Насива и сбор в Галгале (3–7),
# самовольная жертва Саула (8–12), приговор Самуила (13–14), шестьсот человек
# в Гибе (15–16), набеги филистимлян и безоружность Израиля (17–23).
# Речь Самуила и Саула — 「…」; вложенная речь — 『…』 (13:12).
# 〔…〕: 13:1 — возрастная формула слав. (в LXX её нет, проверено bracket_check);
# 13:2 — в базе «.», поэтому весь стих по csl-ru. LXX сливает МТ 13:1–2 в одном
# стихе, отчего ст. 2 повторяет содержание ст. 1; нумерация сохранена по гр.
# Сносок ⟨…⟩ нет: 燔祭, 酬恩祭, エフォド уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
