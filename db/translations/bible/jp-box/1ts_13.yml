chapter: 13
draft: true

verses:
  1: "サウルは王[おう]として治[おさ]め始[はじ]めたとき一年[いちねん]の者[もの]で、イスラエルを二年[にねん]治[おさ]めた。サウルはイスラエル人[じん]のうちから三千人[にん]を自分[じぶん]のために選[えら]んだ。二千人[にん]はサウルとともにマヘマスとベテルの山[やま]に、千人[にん]はヨナタンとともにベニヤミンのギベアにいた。残[のこ]りの民[たみ]はそれぞれ自分[じぶん]の天幕[てんまく]へ帰[かえ]した。"
  2: "サウルはイスラエル人[じん]のうちから三千人[にん]の男[おとこ]を自分[じぶん]のために選[えら]び、二千人[にん]はサウルとともにマヘマスとベテルの山[やま]に、千人[にん]はヨナタンとともにベニヤミンのギベアにいた。そして残[のこ]りの民[たみ]をそれぞれの住[す]みかへ帰[かえ]した。"
  3: "ヨナタンは丘[おか]にいたペリシテ人[じん]の守備隊[しゅびたい]を打[う]った。ペリシテ人[じん]がそれを聞[き]くと、サウルは全[ぜん]国[こく]に角笛[つのぶえ]を吹[ふ]き鳴[な]らして言[い]った。「奴隷[どれい]たちが逆[さか]らった。」"
  4: "イスラエルはみな、サウルがペリシテ人[じん]の守備隊[しゅびたい]を打[う]ったこと、またイスラエルがペリシテ人[じん]に憎[にく]まれるようになったことを聞[き]いた。民[たみ]はサウルの後[あと]にギルガルへ集[あつ]まった。"
  5: "ペリシテ人[じん]はイスラエルに敵[てき]して戦[たたか]いのため集[あつ]まり、イスラエルに上[のぼ]って来[き]た。戦車[せんしゃ]三万[さんまん]、騎兵[きへい]六千[ろくせん]、民[たみ]は海[うみ]の岸[きし]の砂[すな]のように多[おお]かった。彼[かれ]らは上[のぼ]って来[き]て、ベトンの南[みなみ]、マヘマスに陣[じん]を敷[し]いた。"
  6: "イスラエル人[じん]は自分[じぶん]たちが迫[せま]られているのを見[み]た。民[たみ]が苦[くる]しめられていたからである。民[たみ]は洞穴[どうけつ]、囲[かこ]いの中[なか]、岩[いわ]の間[あいだ]、穴[あな]の中[なか]、水[みず]ための中[なか]に隠[かく]れた。"
  7: "そして、渡[わた]る者[もの]たちはヨルダン川を渡[わた]ってガドとギレアデの地[ち]へ行[い]った。サウルはまだギルガルにいて、彼[かれ]とともにいた民[たみ]はみな震[ふる]えていた。"
  8: "サウルはサムエルが言[い]ったとおり、定[さだ]めの七日間[なのかかん]を待[ま]った。しかしサムエルはギルガルへ来[こ]なかったので、民[たみ]は彼[かれ]から散[ち]り始[はじ]めた。"
  9: "サウルは言[い]った。「燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげられるように、こちらへ持[も]って来[こ]させよ。」そして彼[かれ]は燔祭[はんさい]をささげた。"
  10: "彼[かれ]が燔祭[はんさい]をささげ終[お]わったとき、見[み]よ、サムエルが来[き]た。サウルは彼[かれ]を迎[むか]えて挨拶[あいさつ]するために出[で]て行[い]った。"
  11: "サムエルは言[い]った。「何[なに]をしたのか。」サウルは言[い]った。「民[たみ]がわたしから散[ち]って行[い]くのを見[み]、あなたも、定[さだ]められた日[ひ]のとおりに来[こ]られず、ペリシテ人[じん]がマヘマスに集[あつ]まっているのを見[み]たので、"
  12: "『今[いま]、ペリシテ人[じん]がギルガルでわたしのところへ下[くだ]って来[く]る。それなのに、わたしはまだ主[しゅ]の顔[かお]をなだめていない』と思[おも]い、思[おも]い切[き]って燔祭[はんさい]をささげてしまった。」"
  13: "サムエルはサウルに言[い]った。「あなたは愚[おろ]かなことをした。あなたは、主[しゅ]があなたに命[めい]じられた命令[めいれい]を守[まも]らなかった。主[しゅ]は今[いま]、あなたの王国[おうこく]をイスラエルの上[うえ]に永遠[えいえん]に確立[かくりつ]しておられただろうに。"
  14: "しかし今[いま]、あなたの王国[おうこく]は立[た]ち続[つづ]かない。主[しゅ]はご自分[じぶん]のために、ご自分[じぶん]の心[こころ]にかなう人[ひと]を探[さが]し、その者[もの]を民[たみ]の上[うえ]の指導者[しどうしゃ]として命[めい]じられる。あなたが主[しゅ]の命[めい]じられたことを守[まも]らなかったからだ。」"
  15: "サムエルは立[た]ち上[あ]がってギルガルから出[で]て、自分[じぶん]の道[みち]を行[い]った。残[のこ]りの民[たみ]は、戦[たたか]う民[たみ]の後[あと]を追[お]ってサウルの後[あと]に上[のぼ]った。彼[かれ]らがギルガルからベニヤミンのギベアへ来[き]たとき、サウルは自分[じぶん]とともにいる者[もの]を数[かぞ]えたところ、六百人[にん]であった。"
  16: "サウルとその子[こ]ヨナタン、および彼[かれ]らとともにいる者[もの]たちは、ベニヤミンのギベアに座[すわ]って泣[な]いた。ペリシテ人[じん]はマヘマスに陣[じん]を敷[し]いていた。"
  17: "ペリシテ人[じん]の陣[じん]から、土地[とち]を荒[あ]らす者[もの]たちが三[みっ]つの隊[たい]に分[わ]かれて出[で]て来[き]た。一[ひと]つの隊[たい]はゴフェラへ行[い]く道[みち]、ソガルの地[ち]へ向[む]かった。"
  18: "もう一[ひと]つの隊[たい]はベト・ホロンへ行[い]く道[みち]を、さらに別[べつ]の隊[たい]は、ガイのサビンへと入[はい]り込[こ]むギベアの道[みち]を進[すす]んだ。"
  19: "イスラエルの全土[ぜんど]には鍛冶[かじ]が見[み]つからなかった。ペリシテ人[じん]が「ヘブライ人[じん]に剣[つるぎ]や槍[やり]を作[つく]らせてはならない」と言[い]ったからである。"
  20: "イスラエルはみな、自分[じぶん]の鋤[すき]や道具[どうぐ]、斧[おの]、鎌[かま]を鍛[きた]えてもらうために、ペリシテ人[じん]の地[ち]へ下[くだ]って行[い]った。"
  21: "そして刈[か]り入[い]れの時[とき]が来[き]た。しかし農具[のうぐ]は歯[は]一[ひと]つにつき三[さん]シケルであり、斧[おの]にも鎌[かま]にも、その直[なお]しは同[おな]じ代価[だいか]であった。"
  22: "こうしてマヘマスの戦[たたか]いの日[ひ]々[びと]、サウルとヨナタンとともにいる民[たみ]のだれの手[て]にも、剣[つるぎ]も槍[やり]も見[み]つからなかった。ただサウルとその子[こ]ヨナタンにだけあった。"
  23: "ペリシテ人[じん]の陣[じん]から一[ひと]つの前哨[ぜんしょう]が出[で]て、マヘマスの向[む]こう側[がわ]へ来[き]た。"

notes:
  1: "В gr-lxx-byz ст. 1 сразу начинается с выбора тысяч (ἐκλέγεται); возрастной формулы («сын одного года», слав. 13:1) в LXX нет — проверено bracket_check (ετος/ετων — НЕТ), поэтому она дана по csl-ru в …. ἐκλέγεται ἑαυτῷ — избирает себе; δισχίλιοι — две тысячи; τὸ κατάλοιπον τοῦ λαοῦ — остаток народа; σκήνωμα — шатёр, 天幕."
  2: "В gr-lxx-byz на месте стиха `.`; весь стих — церковное чтение (csl-ru) и стоит в …. LXX сливает МТ 13:1–2 в одном стихе, поэтому здесь повторён рассказ о выборе тысяч; нумерация сохранена по гр. (ср. Быт 31:51, где так же повторён стих-дубль)."
  3: "Νασιβ — слав. «насив», Син. «охранный отряд» (гарнизон, евр. נציב); переведено 守備隊. Ἠθετήκασιν οἱ δοῦλοι — «отложились рабы» (ἀθετέω — отвергать, изменять); слав. «отвергошася раби», Син. по МТ «да услышат Евреи». σάλπιγξ — труба, 角笛."
  4: "Πέπαικεν — «поразил» (παίω, тёмная форма); слав. «порази». ᾐσχύνθησαν — «устыдились», т. е. стали ненавистны филистимлянам; ἀνεβόησαν ὀπίσω Σαυλ — собрались вслед Саулу."
  5: "τριάκοντα χιλιάδες ἁρμάτων — тридцать тысяч колесниц; ἓξ χιλιάδες ἱππέων — шесть тысяч всадников; ἄμμος παρὰ τὴν θάλασσαν — песок у моря. ἐξ ἐναντίας Βαιθων κατὰ νότου — «напротив Бефона, к югу»; Син. «с восточной стороны Беф-Авена» — по МТ."
  6: "στενῶς αὐτῷ μὴ προσάγειν — «тесно ему, что не подойти», т. е. приперт; σπήλαια — пещеры, μάνδραι — загоны и ограды, βόθροι — ямы, λάκκοι — рвы и колодцы."
  7: "οἱ διαβαίνοντες — переходящие; εἰς γῆν Γαδ καὶ Γαλααδ — в землю Гада и Галаада. ἐξέστη — «вышел из себя», был в ужасе (ἐξίστημι); слав. «ужасошася»."
  8: "διέλιπεν ἑπτὰ ἡμέρας τῷ μαρτυρίῳ — «промедлил семь дней по свидетельству», т. е. до назначенного срока (μαρτύριον здесь — условленный срок, ср. 10:8). διεσπάρη — рассеялся."
  9: "εἰρηνικάς (θυσίας) — мирные жертвы, 酬恩祭; ἀνήνεγκεν τὴν ὁλοκαύτωσιν — вознёс всесожжение."
  10: "συνετέλεσεν ἀναφέρων — окончил приносить; παραγίνεται — является (исторический презенс). εὐλογῆσαι αὐτόν — «благословить его», т. е. приветствовать."
  11: "Τί πεποίηκας; — что ты сделал? ὡς διετάξω — как ты повелел (διατάσσω); ἐν τῷ μαρτυρίῳ τῶν ἡμερῶν — «в свидетельстве дней», в назначенный срок."
  12: "τοῦ προσώπου τοῦ κυρίου οὐκ ἐδεήθην — «лица Господня не умолил» (δέομαι — просить); ἐνεκρατευσάμην — «я пересилил себя», слав. «не удержахся». Слова Саула вложены в его речь — 『…』."
  13: "Μεματαίωταί σοι — «безумие тебе» (ματαίωσις; слав. «безумие бысть тебе»). ὡς νῦν ἡτοίμασεν — «ибо ныне уготовал бы» (условное значение, ср. Син. «упрочил бы»)."
  14: "ἡ βασιλεία σου οὐ στήσεται — царство твоё не устоит; ἄνθρωπον κατὰ τὴν καρδίαν αὐτοῦ — человека по сердцу Своему; εἰς ἄρχοντα — в вождя."
  15: "ἀνέστη καὶ ἀπῆλθεν εἰς ὁδὸν αὐτοῦ — встал и пошёл в путь свой; τὸ κατάλειμμα — остаток; παραγενομένων — когда они пришли; ἐπεσκέψατο — пересчитал (ἐπισκέπτομαι)."
  16: "ἐκάθισαν — сели; ἔκλαιον — плакали (имперфект); παρεμβεβλήκεισαν — расположились станом (плюсквамперфект)."
  17: "διαφθείρων — «губящий», отряд опустошителей; τρισὶν ἀρχαῖς — тремя отрядами (ἀρχή — часть, начало). Γοφερα — Гофера; γῆ Σωγαλ — земля Согал."
  18: "Βαιθωρων — Беф-Хорон; Γαβεε τὴν εἰσκύπτουσαν ἐπὶ Γαι τὴν Σαβιν — «Гиву, вдающуюся к Гаю, Савин»; слав. «к гаисавим пустыни», Син. «к границе долины Цевоим» — место тёмное; в тексте держимся гр (ガイのサビン), вариант Син. — в notes."
  19: "τέκτων σιδήρου — кузнец по железу; ῥομφαία καὶ δόρυ — меч и копьё; μὴ ποιήσωσιν — чтобы не сделали (опасение филистимлян)."
  20: "χαλκεύειν — ковать, оттачивать; θέριστρον — серп; σκεῦος — орудие; ἀξίνη — топор; δρέπανον — серп, коса."
  21: "τὰ σκεύη ἦν τρεῖς σίκοι εἰς τὸν ὀδόντα — «орудия были три сикля за зуб» (ὀδούς — зуб, острие); τῇ ἀξίνῃ καὶ τῷ δρεπάνῳ ὑπόστασις ἦν ἡ αὐτή — «для топора и серпа основа была та же». Место тёмное: слав. «притупишася вся орудия… поправления же има не бысть», Син. по МТ даёт иной смысл (щербина, рожон)."
  22: "ῥομφαία καὶ δόρυ — меч и копьё; οὐχ εὑρέθη — не нашлось; εὑρέθη τῷ Σαυλ — нашлось у Саула (дательный принадлежности)."
  23: "ἐξ ὑποστάσεως — «из позиции, из стана»; τὴν ἐν τῷ πέραν Μαχεμας — «что на той стороне Махмаса»; Син. «к переправе Михмасской»."
