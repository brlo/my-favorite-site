# jp-box, Исаия, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть, сверен; в текст не копировался; jp-ni не
# использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: 1–7 песнь о винограднике (поющий — от лица Владельца, 1-е лицо);
# 8–23 шесть «горе»: дома и поля (8–10), вино и пиры (11–12), плен (13–14),
# унижение человека и возвышение Господа (15–17), грехи как верёвки (18–19),
# зло названо добром (20), мудрость у себя (21), сила в вине (22–23);
# 24–25 корень сгорит, гнев Господа на народ; 26–30 знамя дальнему народу,
# конница, тьма в день Господень.
# Голоса: 5:1–7 — одна цитата 「…」 (песнь, первое лицо поющего/Владельца,
# закрывается в конце 5:7). 5:19 — слова тех, кто говорит «скоро да приблизится»,
# в 「…」. Остальное — пророческие возгласы и авторский текст без кавычек.
# «Так говорит» в главе нет.
# Нумерация по gr: 30 стихов, совпадает с csl и ru; деление внутри стихов то же.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавление 5:14 «и веселяйся
# в нем» («и веселящийся в нём») внесено в основной текст без скобок, в notes
# отмечено «нет в LXX».
# Сносок ⟨…⟩ нет: ぶどう畑, 塔, 酒ぶね, 鋤, 鎌, よみ, 獅子, 戦車 уже в корпусе;
# アルタバ и メラ — меры, объяснены в notes (сноска не нужна, слово стоит в перечне).
# Имена: イスラエル, ユダ, エルサレム, シオン; новых имён нет.

