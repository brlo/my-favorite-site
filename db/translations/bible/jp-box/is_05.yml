verses:
  1: "「さあ、愛[あい]する者[もの]に歌[うた]おう。わたしのぶどう畑[ばたけ]についての、愛する者の歌[うた]を。わたしの愛する者には、肥[こ]えた地[ち]の丘[おか]の上[うえ]に、ぶどう畑があった。"
  2: "わたしはその周[まわ]りに垣[かき]を巡[めぐ]らし、石[いし]を取[と]り除[のぞ]き、選[えら]ばれたぶどうの木[き]を植[う]え、その中[なか]に塔[とう]を建[た]て、その中に酒[さけ]ぶねを掘[ほ]った。そして、良[よ]いぶどうがなるのを待[ま]ったが、生[は]えたのは茨[いばら]であった。"
  3: "さあ、エルサレムに住[す]む者[もの]たち、ユダの人[ひと]よ、わたしと、わたしのぶどう畑[ばたけ]との間[あいだ]を裁[さば]け。"
  4: "わたしのぶどう畑[ばたけ]に、まだ何[なに]をしてやれるというのか。してやらなかったことがあるだろうか。わたしは良[よ]いぶどうがなるのを待[ま]ったのに、それが生[は]やしたのは茨[いばら]であった。"
  5: "さあ、わたしはあなたがたに告[つ]げよう。わたしのぶどう畑[ばたけ]に何[なに]をするかを。わたしはその囲[かこ]いを取[と]り除[のぞ]く。それは荒[あ]らされる。わたしはその石垣[いしがき]を壊[こわ]す。それは踏[ふ]みつけられる。"
  6: "わたしは自分のぶどう畑[ばたけ]を捨[す]てる。それは刈[か]り込[こ]まれず、掘[ほ]り返[かえ]されず、その中[なか]に、乾[かわ]いた荒[あ]れ地[ち]にでもあるように、茨[いばら]が生[は]え出[で]る。わたしは雲[くも]に命[めい]じて、その上[うえ]に雨[あめ]を降[ふ]らせない。"
  7: "万軍[ばんぐん]の主[しゅ]のぶどう畑[ばたけ]は、イスラエルの家[いえ]である。ユダの人[ひと]は、主の愛[あい]する新[あら]しい植[う]え物[もの]である。主は裁[さば]きを待[ま]ったが、それは不法[ふほう]を生[う]み、義[ぎ]ではなく叫[さけ]びを生[う]んだ。」"
  8: "ああ、家[いえ]に家を、畑[はたけ]に畑を継[つ]ぎ足[た]し、隣人[りんじん]から何[なに]かを奪[うば]い取[と]るまで迫[せま]る者[もの]たちよ。あなたがたは地[ち]の上[うえ]に、ただ一[ひと]りで住[す]むのか。"
  9: "万軍[ばんぐん]の主[しゅ]の耳[みみ]に、これが聞[き]こえた。多[おお]くの家[いえ]は荒[あ]れ果[は]て、大[おお]きく美[うつく]しい家々にも住[す]む者[もの]がなくなる。"
  10: "十組[じゅうくみ]の牛[うし]が耕[たがや]す所[ところ]からは一[ひと]つの壺[つぼ]しか得[え]られず、六[むっ]つのアルタバを蒔[ま]く者[もの]も、三[みっ]つのメラしか得られない。"
  11: "ああ、朝早[あさはや]く起[お]きて濃[こ]い酒[さけ]を追[お]い求[もと]め、夜[よる]遅[おそ]くまで残[のこ]って、ぶどう酒[ぶどうしゅ]に焼[や]かれる者[もの]たちよ。"
  12: "彼[かれ]らの宴[うたげ]には琴[こと]と竪琴[たてごと]、太鼓[たいこ]と笛[ふえ]があり、彼らはぶどう酒[ぶどうしゅ]を飲[の]む。しかし、彼らは主[しゅ]の業[わざ]を見[み]ず、その手[て]の業を思[おも]いめぐらさない。"
  13: "それゆえ、わたしの民[たみ]は、主[しゅ]を知[し]らないために捕囚[ほしゅう]となった。そして、飢[う]えと水[みず]の渇[かわ]きのために、多[おお]くの死者[ししゃ]が出[で]た。"
  14: "それゆえ、よみはその魂[たましい]を広[ひろ]げ、絶[た]えることのないようにその口[くち]を開[あ]けた。彼[かれ]らのうちの栄[えい]ある者[もの]も、大[おお]きな者も、富[とみ]む者も、その滅[ほろ]ぼす者[もの]たちも、そこで喜[よろこ]ぶ者[もの]も、そこへ下[くだ]る。"
  15: "人[ひと]は低[ひく]くされ、男[おとこ]は辱[はずかし]められ、高[たか]く見[み]上[あ]げる目[め]は低くされる。"
  16: "しかし、万軍[ばんぐん]の主[しゅ]は裁[さば]きによって高[たか]く上[あ]げられ、聖[せい]なる神[かみ]は義[ぎ]によって栄光[えいこう]を受[う]ける。"
  17: "そして、奪[うば]われた者[もの]たちは雄牛[おうし]のように草[くさ]を食[は]み、奪い取[と]られた所[ところ]の荒[あ]れ野[の]を子羊[こひつじ]たちが食[た]べる。"
  18: "ああ、罪[つみ]を長[なが]い綱[つな]のように、不法[ふほう]を雌[め]の若牛[わかうし]の軛[くびき]の革[かわ]ひものように引[ひ]き寄[よ]せる者[もの]たち、"
  19: "「早[はや]く、主[しゅ]がなさることを近[ちか]づけて見[み]せよ。イスラエルの聖[せい]なる方[かた]の計[はか]らいが来[き]て、われわれが知[し]るように」と言[い]う者[もの]たちよ。"
  20: "ああ、悪[わる]いものを善[よ]いと呼[よ]び、善いものを悪いと呼ぶ者[もの]たちよ。闇[やみ]を光[ひかり]とし、光を闇とし、苦[にが]いものを甘[あま]いとし、甘いものを苦いとする者たちよ。"
  21: "ああ、自分[じぶん]に賢[かしこ]く、自分[じぶん]の前[まえ]で聡明[そうめい]な者[もの]たちよ。"
  22: "ああ、あなたがたのうちの力[ちから]ある者[もの]たち、ぶどう酒[ぶどうしゅ]を飲[の]む者たち、濃[こ]い酒[さけ]を混[ま]ぜる支配者[しはいしゃ]たちよ。"
  23: "贈[おく]り物[もの]のために不法[ふほう]な者[もの]を正[ただ]しいとし、正しい者の正[ただ]しさを取[と]り上[あ]げる者[もの]たちよ。"
  24: "それゆえ、火[ひ]の炭[すみ]がわらを焼[や]き、燃[も]え上[あ]がる炎[ほのお]がそれを焼き尽[つ]くすように、彼[かれ]らの根[ね]は塵[ちり]のようになり、彼らの花[はな]は埃[ほこり]のように上[あ]がる。彼らは万軍[ばんぐん]の主[しゅ]の律法[りっぽう]を拒[こば]み、イスラエルの聖[せい]なる方[かた]の言葉[ことば]を蔑[さげす]んだからである。"
  25: "そのため、万軍[ばんぐん]の主[しゅ]の怒[いか]りは、ご自分[じぶん]の民[たみ]に向[む]かって燃[も]え上[あ]がり、その手[て]を彼[かれ]らの上[うえ]に伸[の]べて彼らを打[う]った。山々[やまやま]は震[ふる]え、彼らの屍[しかばね]は道[みち]の真[ま]ん中[なか]の糞[ふん]のようになった。それでも、その怒りは去[さ]らず、その手[て]はなお高[たか]く上[あ]げられたままである。"
  26: "主[しゅ]は遠[とお]い民[たみ]たちの間[あいだ]に旗[はた]を上[あ]げ、地[ち]の果[は]てから彼らに口笛[くちぶえ]を吹[ふ]く。見[み]よ、彼らは速[はや]く、軽[かる]やかに来[く]る。"
  27: "彼[かれ]らは飢[う]えず、疲[つか]れず、まどろまず、眠[ねむ]らず、腰[こし]の帯[おび]を解[と]かず、履[は]き物[もの]のひもも切[き]れない。"
  28: "その矢[や]は鋭[するど]く、弓[ゆみ]はすべていっぱいに引[ひ]かれている。馬[うま]の蹄[ひづめ]は堅[かた]い岩[いわ]のように見[み]なされ、戦車[せんしゃ]の車輪[しゃりん]は嵐[あらし]のようである。"
  29: "彼[かれ]らは獅子[しし]のように襲[おそ]いかかり、獅子の子[こ]のように立[た]ち向[む]かう。彼らは捕[つか]まえて、野獣[やじゅう]のようにほえ、それを引[ひ]き去[さ]る。救[すく]い出[だ]す者[もの]はない。"
  30: "その日[ひ]、彼らのゆえに、波[なみ]立[だ]つ海[うみ]の声[こえ]のような叫[さけ]びがあがる。彼らは地[ち]を見[み]る。見よ、その行[ゆ]き詰[づ]まりのうちに、激[はげ]しい闇[やみ]がある。"

notes:
  1: "Ἄισω δὴ τῷ ἠγαπημένῳ — «спою же возлюбленному» (ᾄδω — петь; ἠγαπημένος — возлюбленный, 愛する者). ᾆσμα τοῦ ἀγαπητοῦ τῷ ἀμπελῶνί μου — «песнь возлюбленного моему винограднику»: датив τῷ ἀμπελῶνί μου понят как «о моём винограднике» (в тексте わたしのぶどう畑についての); слав. «песнь возлюбленнаго моего винограду моему», ru «о винограднике Его» (МТ). ἀμπελὼν ἐγενήθη τῷ ἠγαπημένῳ ἐν κέρατι ἐν τόπῳ πίονι — «виноград был у возлюбленного на роге, на месте тучном»: κέρας — рог, здесь мыс/вершина (слав. «в розе»), τόπος πίων — тучное место (в тексте 肥えた地の丘). Здесь открывается песнь — цитата до конца 5:7."
  2: "φραγμὸν περιέθηκα — «обнёс оградой» (περιτίθημι); ἐχαράκωσα — «окопал, обнёс частоколом» (χαρακόω); слав. «ограждением оградих и окопах». ἐφύτευσα ἄμπελον σωρηχ — «насадил лозу Сорек»: σωρηχ — вероятно, сорт или местность (Сорек); слав. переводит «лозу избранну» (в тексте 選ばれたぶどうの木). ᾠκοδόμησα πύργον ἐν μέσῳ αὐτοῦ — «построил башню посреди него»; προλήνιον ὤρυξα ἐν αὐτῷ — «выкопал в нём точило» (προλήνιον — винный пресс, 酒ぶね). ἔμεινα τοῦ ποιῆσαι σταφυλήν — «ждал, что принесёт гроздь» (σταφυλή — гроздь); ἐποίησεν δὲ ἀκάνθας — «а оно принесло тернии» (ἄκανθα — колючка, 茨); у ru (МТ) «дикие ягоды» — иное чтение, не внесено."
  3: "ἄνθρωπος τοῦ Ιουδα — «человек Иуды», т. е. муж Иудин (слав. «человече иудин»); οἱ ἐνοικοῦντες ἐν Ιερουσαλημ — «живущие в Иерусалиме»; слав. ставит Иерусалим первым, в тексте по gr. κρίνατε ἐν ἐμοὶ καὶ ἀνὰ μέσον τοῦ ἀμπελῶνός μου — «судите между мною и виноградником моим» (κρίνω — судить; ἀνὰ μέσον — между): виноградник здесь как подсудимый, олицетворение сохранено."
  4: "τί ποιήσω ἔτι τῷ ἀμπελῶνί μου καὶ οὐκ ἐποίησα αὐτῷ; — «что ещё сделаю винограднику моему, чего не сделал ему?»: вопрос с καὶ в значении «и чего…», сохранён двумя фразами. διότι ἔμεινα τοῦ ποιῆσαι σταφυλήν, ἐποίησεν δὲ ἀκάνθας — «ибо ждал, что принесёт гроздь, а оно принесло тернии»: повтор 5:2, в греч. дословный — сохранён."
  5: "ἀναγγελῶ ὑμῖν τί ποιήσω τῷ ἀμπελῶνί μου — «возвещу вам, что сделаю винограднику моему» (ἀναγγέλλω — возвещать). ἀφελῶ τὸν φραγμὸν αὐτοῦ — «отниму ограду его» (φραγμός — изгородь, 囲い); ἔσται εἰς διαρπαγήν — «будет на расхищение» (διαρπαγή — разграбление). καθελῶ τὸν τοῖχον αὐτοῦ — «снесу стену его» (καθαιρέω — сносить; τοῖχος — стена, 石垣); ἔσται εἰς καταπάτημα — «будет на попрание» (καταπάτημα — попираемое место)."
  6: "ἀνήσω τὸν ἀμπελῶνά μου — «оставлю виноградник мой» (ἀνίημι — оставлять, отпускать); οὐ μὴ τμηθῇ οὐδὲ μὴ σκαφῇ — «да не будет обрезан и не будет вскопан» (τέμνω — резать, обрезать; σκάπτω — копать); слав. «ктому не обрежется, ниже покопается». ἀναβήσεται εἰς αὐτὸν ὡς εἰς χέρσον ἄκανθα — «взойдёт на него, как на сухую [землю], терние» (χέρσος — сухая, невозделанная земля); ταῖς νεφέλαις ἐντελοῦμαι τοῦ μὴ βρέξαι — «облакам заповедаю не пролить дождя» (ἐντέλλομαι — заповедовать; βρέχω — орошать)."
  7: "ὁ γὰρ ἀμπελὼν κυρίου σαβαωθ οἶκος τοῦ Ισραηλ ἐστίν — «ибо виноградник Господа Саваофа — дом Израиля». ἄνθρωπος τοῦ Ιουδα νεόφυτον ἠγαπημένον — «человек Иуды — возлюбленное новонасаждение» (νεόφυτον — новый побег, 新しい植え物); слав. «новый сад возлюбленный». ἔμεινα τοῦ ποιῆσαι κρίσιν, ἐποίησεν δὲ ἀνομίαν — «ждал, чтобы сотворил суд, а он сотворил беззаконие»; καὶ οὐ δικαιοσύνην ἀλλὰ κραυγήν — «и не правду, но вопль» (κραυγή — вопль, 叫び). У ru (МТ) «кровопролитие» — иное чтение (מִשְׂפָּח), в текст не внесено; греч. игра слов κρίσις/ἀνομία сохранена. Здесь закрывается песнь."
  8: "Οὐαὶ οἱ συνάπτοντες οἰκίαν πρὸς οἰκίαν — «горе присоединяющим дом к дому» (συνάπτω — соединять); ἀγρὸν πρὸς ἀγρὸν ἐγγίζοντες — «приближающим поле к полю» (ἐγγίζω — приближать). ἵνα τοῦ πλησίον ἀφέλωνταί τι — «чтобы отнять что-нибудь у ближнего» (ἀφαιρέω). μὴ οἰκήσετε μόνοι ἐπὶ τῆς γῆς; — «разве вы одни поселитесь на земле?»: вопрос с μή, ожидающий отрицания; слав. «еда вселитеся едини на земли?»."
  9: "ἠκούσθη γὰρ εἰς τὰ ὦτα κυρίου σαβαωθ ταῦτα — «ибо услышано в уши Господа Саваофа это» (ἀκούω в страдательном залоге). ἐὰν γὰρ γένωνται οἰκίαι πολλαί — «ибо если и будут домы многие»; εἰς ἔρημον ἔσονται μεγάλαι καὶ καλαί — «в пустыню придут великие и прекрасные» (ἔρημος — пустыня); καὶ οὐκ ἔσονται οἱ ἐνοικοῦντες ἐν αὐταῖς — «и не будет живущих в них». У ru (МТ) «В уши мои сказал Господь Саваоф» — 1-е лицо; в LXX и слав. безличное «услышано», поэтому без кавычек."
  10: "οὗ γὰρ ἐργῶνται δέκα ζεύγη βοῶν — «ибо где возделают десять пар волов» (ζεῦγος — пара, упряжка; ἐργάζομαι — возделывать); ποιήσει κεράμιον ἕν — «сделает (даст) один кувшин» (κεράμιον — глиняный сосуд, мера вина, 壺); ὁ σπείρων ἀρτάβας ἓξ ποιήσει μέτρα τρία — «сеющий шесть артаб сделает три меры» (ἀρτάβη — персидская мера сыпучего, アルタバ; μέτρον — мера, メラ). Числа мер сохранены; «しか» передаёт скудость урожая, о которой говорит образ. У ru (МТ) меры иные — бат, хомер, ефа."
  11: "οὐαὶ οἱ ἐγειρόμενοι τὸ πρωῒ — «горе встающим рано» (πρωΐ — рано утром); τὸ σικερα διώκοντες — «гоняющимся за сикерой» (σίκερα — крепкий напиток, 濃い酒; слав. «сикер»); οἱ μένοντες τὸ ὀψέ — «остающимся до позднего [вечера]» (ὀψέ — поздно). ὁ γὰρ οἶνος αὐτοὺς συγκαύσει — «ибо вино их сожжёт» (συγκαίω — сожигать, воспламенять); слав. «вино бо сожжет я»."
  12: "μετὰ γὰρ κιθάρας καὶ ψαλτηρίου καὶ τυμπάνων καὶ αὐλῶν — «ибо с кифарой, псалтирью, тимпанами и свирелями» (κιθάρα — кифара, 琴; ψαλτήριον — струнный инструмент, 竪琴; τύμπανον — тимпан, 太鼓; αὐλός — свирель, 笛); слав. «гусли и певницы, и тимпаны и свирели». τὸν οἶνον πίνουσιν — «вино пьют». τὰ δὲ ἔργα κυρίου οὐκ ἐμβλέπουσιν — «а на дела Господни не взирают» (ἐμβλέπω — смотреть на); τὰ ἔργα τῶν χειρῶν αὐτοῦ οὐ κατανοοῦσιν — «дел рук Его не усматривают» (κατανοέω — вникать, помышлять)."
  13: "τοίνυν αἰχμάλωτος ὁ λαός μου ἐγενήθη — «итак, народ Мой стал пленником» (αἰχμάλωτος — пленный); в слав. при этом «~бо» — знак неясного чтения в выгрузке, по смыслу то же «итак». διὰ τὸ μὴ εἰδέναι αὐτοὺς τὸν κύριον — «за то, что они не знают Господа». καὶ πλῆθος ἐγενήθη νεκρῶν — «и множество стало мёртвых»; διὰ λιμὸν καὶ δίψαν ὕδατος — «от голода и жажды воды» (λιμός — голод; δίψα — жажда). У ru (МТ) «вельможи его будут голодать, и богачи его томиться жаждою» — иное чтение, не внесено."
  14: "ἐπλάτυνεν ὁ ᾅδης τὴν ψυχὴν αὐτοῦ — «расширил ад душу свою»: ᾅδης — ад, よみ; ψυχή здесь по-еврейски означает гортань, алчбу (слав. «разшири ад душу свою»), буквальный оборот сохранён. διήνοιξεν τὸ στόμα αὐτοῦ τοῦ μὴ διαλιπεῖν — «открыл уста свои, чтобы не переставать» (διαλείπω — прекращать). καταβήσονται οἱ ἔνδοξοι καὶ οἱ μεγάλοι καὶ οἱ πλούσιοι καὶ οἱ λοιμοὶ αὐτῆς — «сойдут славные, великие, богатые и губители её» (ἔνδοξος — славный; λοιμός — гибельный, губитель). Слав. добавляет «и веселяйся в нем» («и веселящийся в нём») — нет в LXX; внесено в текст без скобок."
  15: "ταπεινωθήσεται ἄνθρωπος, καὶ ἀτιμασθήσεται ἀνήρ — «смирится человек, и обесчестится муж» (ἀτιμάζω — бесчестить); οἱ ὀφθαλμοὶ οἱ μετέωροι ταπεινωθήσονται — «очи надменные (парящие) смирятся» (μετέωρος — парящий, надменный); слав. «очи высокоглядающии смирятся»."
  16: "ὑψωθήσεται κύριος σαβαωθ ἐν κρίματι — «возвысится Господь Саваоф в суде» (κρίμα — суд, определение); ὁ θεὸς ὁ ἅγιος δοξασθήσεται ἐν δικαιοσύνῃ — «Бог Святой прославится в правде» (δοξάζω — прославлять; δικαιοσύνη — правда, 義). Слав. «Бог святый прославится в правде»; антитеза 5:15 сохранена: человек низок — Господь высок."
  17: "βοσκηθήσονται οἱ διηρπασμένοι ὡς ταῦροι — «будут пастись расхищенные, как тельцы» (διαρπάζω — расхищать; ταῦρος — бык, 雄牛); τὰς ἐρήμους τῶν ἀπειλημμένων ἄρνες φάγονται — «пустыни отнятых агнцы поедят» (ἀπειλημμένοι — отнятые, захваченные): тёмное место, буквальный порядок сохранён. Слав. «упасутся расхищеннии яко юнцы, и пустыни плененных агнцы поядят»; у ru (МТ) иначе — овцы будут пастись по своей воле."
  18: "οἱ ἐπισπώμενοι τὰς ἁμαρτίας ὡς σχοινίῳ μακρῷ — «влекущие грехи как долгою верёвкою» (ἐπισπάομαι — привлекать, влечь; σχοινίον — верёвка); ὡς ζυγοῦ ἱμάντι δαμάλεως τὰς ἀνομίας — «как ремнём ярма телицы — беззакония» (ζυγόν — ярмо, 軛; ἱμάς — ремень; δάμαλις — телица, молодая корова); слав. «яко ига юнична ременем беззакония своя». Образ: грех тянут на себя, как влекут верёвку или ремень ярма."
  19: "οἱ λέγοντες — «говорящие»: продолжает «горе» 5:18, поэтому стих кончается без нового восклицания. Τὸ τάχος ἐγγισάτω ἃ ποιήσει, ἵνα ἴδωμεν — «скоро да приблизится то, что Он сделает, чтобы мы увидели» (τάχος — скорость; ἐγγίζω — приближать); ἐλθάτω ἡ βουλὴ τοῦ ἁγίου Ισραηλ, ἵνα γνῶμεν — «и да придёт совет Святого Израиля, чтобы мы познали» (βουλή — совет, решение; γινώσκω — знать). Слова этих людей — 「…」."
  20: "οἱ λέγοντες τὸ πονηρὸν καλὸν καὶ τὸ καλὸν πονηρόν — «называющие злое добрым, а доброе злым» (πονηρός — злой; καλός — добрый, прекрасный); οἱ τιθέντες τὸ σκότος φῶς καὶ τὸ φῶς σκότος — «ставящие тьму светом, а свет тьмою» (τίθημι — полагать, ставить); οἱ τιθέντες τὸ πικρὸν γλυκὺ καὶ τὸ γλυκὺ πικρόν — «ставящие горькое сладким, а сладкое горьким» (πικρός — горький; γλυκύς — сладкий). Три пары сохранены в том же порядке."
  21: "οὐαὶ οἱ συνετοὶ ἐν ἑαυτοῖς — «горе мудрым в себе» (συνετός — разумный, 賢い); καὶ ἐνώπιον ἑαυτῶν ἐπιστήμονες — «и пред собою сведущие» (ἐπιστήμων — знающий, 聡明な); слав. «иже мудри в себе самих и пред собою разумни». Краткость стиха (одна строка) сохранена."
  22: "οἱ ἰσχύοντες ὑμῶν οἱ τὸν οἶνον πίνοντες — «сильные ваши, вино пьющие» (ἰσχύω — быть сильным); οἱ δυνάσται οἱ κεραννύντες τὸ σικερα — «властители, растворяющие сикеру» (δυνάστης — властитель, 支配者; κεράννυμι — смешивать, разбавлять; σίκερα — крепкий напиток, 濃い酒); слав. «вельможам растворяющым сикер». «Сильные» и «властители» — не два класса, а усиление одной мысли."
  23: "οἱ δικαιοῦντες τὸν ἀσεβῆ ἕνεκεν δώρων — «оправдывающие нечестивого ради даров» (δικαιόω — оправдывать; ἀσεβής — нечестивый; δῶρον — дар, взятка); τὸ δίκαιον τοῦ δικαίου αἴροντες — «отнимающие правое у праведного» (τὸ δίκαιον — правое дело; αἴρω — отнимать); слав. «и еже есть праведное праведнаго вземлющым от него». Здесь кончается ряд «горе»."
  24: "ὃν τρόπον καυθήσεται καλάμη ὑπὸ ἄνθρακος πυρός — «как сгорит солома от угля огня» (καλάμη — солома, стебель; ἄνθραξ — уголь); συγκαυθήσεται ὑπὸ φλογὸς ἀνειμένης — «сожжётся от пламени разожжённого» (φλόξ — пламя; ἀνειμένος — разожжённый, отпущенный). ἡ ῥίζα αὐτῶν ὡς χνοῦς ἔσται — «корень их будет как прах (мякина)» (χνοῦς — пыль, труха); τὸ ἄνθος αὐτῶν ὡς κονιορτὸς ἀναβήσεται — «цвет их, как пыль, поднимется» (ἄνθος — цвет; κονιορτός — пыль). οὐ γὰρ ἠθέλησαν τὸν νόμον κυρίου σαβαωθ — «ибо не захотели закона Господа Саваофа»; ἀλλὰ τὸ λόγιον τοῦ ἁγίου Ισραηλ παρώξυναν — «но слово Святого Израиля раздражили» (λόγιον — изречение; παροξύνω — раздражать)."
  25: "ἐθυμώθη ὀργῇ κύριος σαβαωθ ἐπὶ τὸν λαὸν αὐτοῦ — «воспылал гневом Господь Саваоф на народ Свой» (θυμόω — гневаться; ὀργή — гнев). ἐπέβαλεν τὴν χεῖρα αὐτοῦ ἐπ᾽ αὐτοὺς καὶ ἐπάταξεν αὐτούς — «наложил руку Свою на них и поразил их» (ἐπιβάλλω; πατάσσω — поражать). παρωξύνθη τὰ ὄρη — «возмутились (потряслись) горы» (παροξύνω в страдательном); ἐγενήθη τὰ θνησιμαῖα αὐτῶν ὡς κοπρία ἐν μέσῳ ὁδοῦ — «стали трупы их как навоз посреди дороги» (θνησιμαῖος — мёртвый, падаль; κοπρία — навоз). οὐκ ἀπεστράφη ὁ θυμός — «не отвратился гнев»; ἀλλ᾽ ἔτι ἡ χεὶρ ὑψηλή — «но ещё рука высока»: рефрен, повторяющийся и в 9:12, 9:17, 10:4."
  26: "ἀρεῖ σύσσημον ἐν τοῖς ἔθνεσιν τοῖς μακράν — «поднимет знамя среди народов дальних» (αἴρω — поднимать; σύσσημον — знамя, сигнал, 旗); συριεῖ αὐτοῖς ἀπ᾽ ἄκρου τῆς γῆς — «свистнет им от края земли» (συρίζω — свистеть; ἄκρον — край); ἰδοὺ ταχὺ κούφως ἔρχονται — «вот, быстро, легко идут» (κοῦφος — лёгкий, проворный). Слав. «Воздвигнет убо знамение во языцех сущих далече»."
  27: "οὐ πεινάσουσιν οὐδὲ κοπιάσουσιν — «не взалчут и не утрудятся» (πεινάω — голодать; κοπιάω — утруждаться); οὐδὲ νυστάξουσιν οὐδὲ κοιμηθήσονται — «не воздремлют и не уснут» (νυστάζω — дремать; κοιμάομαι — спать). οὐδὲ λύσουσιν τὰς ζώνας αὐτῶν ἀπὸ τῆς ὀσφύος αὐτῶν — «и не развяжут поясов своих с чресл своих» (λύω — развязывать; ζώνη — пояс; ὀσφύς — чресла); οὐδὲ μὴ ῥαγῶσιν οἱ ἱμάντες τῶν ὑποδημάτων αὐτῶν — «и не порвутся ремни обуви их» (ῥήγνυμι — разрывать; ἱμάς — ремень; ὑπόδημα — обувь). Пять отрицаний подряд сохранены."
  28: "τὰ βέλη ὀξεῖά ἐστιν — «стрелы остры» (βέλος — стрела; ὀξύς — острый); τὰ τόξα αὐτῶν ἐντεταμένα — «луки их натянуты» (τόξον — лук; ἐντείνω — натягивать). οἱ πόδες τῶν ἵππων αὐτῶν ὡς στερεὰ πέτρα ἐλογίσθησαν — «копыта коней их как твёрдый камень сочтены» (πούς — здесь копыто; στερεός — твёрдый; λογίζομαι — считать); οἱ τροχοὶ τῶν ἁρμάτων αὐτῶν ὡς καταιγίς — «колёса колесниц их как буря» (τροχός — колесо; καταιγίς — буря, вихрь)."
  29: "ὁρμῶσιν ὡς λέοντες — «бросаются как львы» (ὁρμάω — устремляться; λέων — лев, 獅子); παρέστηκαν ὡς σκύμνος λέοντος — «встали как львёнок» (σκύμνος — детёныш, львёнок). ἐπιλήμψεται καὶ βοήσει ὡς θηρίου — «схватит и заревёт, как зверь» (ἐπιλαμβάνομαι — хватать; βοάω — кричать, реветь); ἐκβαλεῖ — «вынесет, унесёт (добычу)» (ἐκβάλλω; слав. «извержет»); οὐκ ἔσται ὁ ῥυόμενός αὐτούς — «не будет избавляющего их» (ῥύομαι — избавлять)."
  30: "βοήσει δι᾽ αὐτοὺς ἐν τῇ ἡμέρᾳ ἐκείνῃ — «возопиет из-за них в день тот»: διά с винитивом — «из-за, ради»; подлежащее не названо, в тексте безличный оборот. ὡς φωνὴ θαλάσσης κυμαινούσης — «как голос моря волнующегося» (κυμαίνω — волновать). ἐμβλέψονται εἰς τὴν γῆν — «воззрят на землю». ἰδοὺ σκότος σκληρὸν ἐν τῇ ἀπορίᾳ αὐτῶν — «вот, тьма жестокая в недоумении (безвыходности) их» (σκληρός — жестокий, суровый; ἀπορία — безвыходное положение); слав. «тма жестока в недоумении их». Конец главы; продолжение — в 6:1."
