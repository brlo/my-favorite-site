# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: 1–3 видение двух корзин со смоквами (после переселения Иехонии); 4–7 слово
# Господа: хорошие смоквы — переселенцы в землю Халдейскую, «дам им сердце знать Меня»;
# 8–10 худые смоквы — Седекия, остаток и живущие в Египте: рассеяние, поношение,
# голод, смерть и меч. Нумерация по gr: 10 стихов, совпадает со слав. и ru.
# Голоса: 1–2 авторское повествование; 3 диалог Господа и пророка — две цитаты 「…」;
# 4 вводная формула вне кавычек; 5–7 и 8–10 — слово Господа в 「…」.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX) по корпусу:
# ネブカドネツァル, ヨヤキム, エホヤキン, ゼデキヤ, カルデア人, エルサレム, エジプト.
# 
