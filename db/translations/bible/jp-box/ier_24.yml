chapter: 24
draft: true

verses:
  1: "主[しゅ]はわたしに示[しめ]された。見[み]よ、いちじくの籠[かご]が二[ふた]つ、主[しゅ]の神殿[しんでん]の前[まえ]に置[お]かれていた。それは、バビロンの王[おう]ネブカドネツァルが、ユダの王[おう]、ヨヤキムの子[こ]エホヤキンと、ユダのつかさたち、工匠[こうしょう]たち、捕[と]らわれの者[もの]たち、富[とみ]ある者[もの]たちをエルサレムから移[うつ]し、バビロンへ連[つ]れて行[い]った後[のち]のことであった。"
  2: "一[ひと]つの籠[かご]には非常[ひじょう]によいいちじくがあり、初[はじ]めのいちじくのようであった。もう一[ひと]つの籠[かご]には非常[ひじょう]に悪[わる]いいちじくがあり、その悪[わる]さのゆえに食[た]べることさえできないほどであった。"
  3: "主[しゅ]はわたしに言[い]われた。「エレミヤよ、あなたは何[なに]を見[み]ているか。」わたしは言[い]った。「いちじくだ。よいものは非常[ひじょう]によく、悪[わる]いものは非常[ひじょう]に悪[わる]く、悪[わる]さのゆえに食[た]べることさえできないほどだ。」"
  4: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  5: "イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。「このよいいちじくのように、わたしは、この場所[ばしょ]からカルデア人[じん]の地[ち]へ遣[つか]わしたユダの捕囚[ほしゅう]の者[もの]たちを、良[よ]い者[もの]として認[みと]める。"
  6: "わたしは彼[かれ]らの上[うえ]に、良[よ]いことのためにわたしの目[め]を注[そそ]ぎ、彼らをこの地[ち]に良[よ]いことのために連[つ]れ帰[かえ]る。わたしは彼らを建[た]て直[なお]して取[と]り壊[こわ]さず、彼らを植[う]えて引[ひ]き抜[ぬ]かない。"
  7: "わたしは彼[かれ]らに、わたしが主[しゅ]であることを知[し]る心[こころ]を与[あた]える。彼[かれ]らはわたしの民[たみ]となり、わたしは彼らの神[かみ]となる。彼らが心[こころ]を尽[つ]くしてわたしに帰[かえ]って来[く]るからである。」"
  8: "また、悪[わる]いいちじく、悪[わる]さのゆえに食[た]べることさえできないものについて、主[しゅ]はこう言[い]われる。「そのように、わたしはユダの王[おう]ゼデキヤと、そのおもだった者[もの]たち、すなわちこの地[ち]に残[のこ]ったエルサレムの残[のこ]りと、エジプトに住[す]む者[もの]たちを渡[わた]す。"
  9: "わたしは彼[かれ]らを地[ち]のすべての王国[おうこく]へ散[ち]らし、苦[くる]しめる。彼らは、わたしが彼らを追[お]いやったすべての場所[ばしょ]で、そしりとなり、たとえ話[ばなし]となり、憎[にく]まれ、呪[のろ]いとなる。"
  10: "わたしは彼[かれ]らの上[うえ]に飢[う]えと死[し]と剣[つるぎ]を送[おく]り、わたしが彼らとその父祖[ふそ]たちに与[あた]えた地[ち]から彼らが絶[た]え果[は]てるまで、そうする。」"

notes:
  1: "Ἔδειξέν μοι κύριος — «показал мне Господь» (δείκνυμι); слав. «показа мне Господь». δύο καλάθους σύκων — «две корзины смокв» (κάλαθος — корзина, 籠); слав. добавляет «полны» — нет в gr. κατὰ πρόσωπον ναοῦ κυρίου — «пред лицом храма Господня» (ναός — храм, 神殿). μετὰ τὸ ἀποικίσαι Ναβουχοδονοσορ — «после того как выселил Навуходоносор» (ἀποικίζω — выселять); далее перечисление: ἄρχοντας, τεχνίτας, δεσμώτας, πλουσίους — «князей, ремесленников, узников, богатых»; слав. «художников, и узников и богатых». ἤγαγεν εἰς Βαβυλῶνα — «привёл их в Вавилон»."
  2: "σύκων χρηστῶν σφόδρα — «смокв весьма хороших»; ὡς τὰ σῦκα τὰ πρόιμα — «как смоквы ранние (первого сбора)»; слав. «яко обычай смоквам быти первых времен». σύκων πονηρῶν σφόδρα — «смокв весьма худых»; ἃ οὐ βρωθήσεται ἀπὸ πονηρίας αὐτῶν — «которых нельзя есть по худости их» (ἀπό — причина); слав. «ихже ясти не возможно за худость их»."
  3: "Τί σὺ ὁρᾷς, Ιερεμια; — «что ты видишь, Иеремия?»; ответ пророка дословно повторяет определение 2-го стиха (τὰ χρηστὰ χρηστὰ λίαν…), повтор сохранён. Диалог — две цитаты 「…」; слова пророка в 常体 (いちじくだ)."
  4: "καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: вводная формула вне кавычек (臨んで言った), как в 1:4."
  5: "Τάδε λέγει κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев». Ὡς τὰ σῦκα τὰ χρηστὰ ταῦτα, οὕτως ἐπιγνώσομαι τοὺς ἀποικισθέντας Ιουδα — «как эти смоквы хорошие, так признаю хорошими переселенцев Иуды» (ἐπιγινώσκω — признавать, принимать); εἰς ἀγαθά — «во благо»."
  6: "στηριῶ τοὺς ὀφθαλμούς μου ἐπ᾿ αὐτοὺς εἰς ἀγαθά — «утвержу очи Мои на них во благо» (στηρίζω); ἀποκαταστήσω — «возвращу» (ἀποκαθίστημι); ἀνοικοδομήσω… καὶ οὐ μὴ καθελῶ — «устрою и не разрушу» (καθαιρέω); καταφυτεύσω… καὶ οὐ μὴ ἐκτίλω — «насажду и не искореню» (ἐκτίλλω — вырывать). Обе пары противопоставлений сохранены."
  7: "δώσω αὐτοῖς καρδίαν τοῦ εἰδέναι αὐτοὺς ἐμὲ ὅτι ἐγώ εἰμι κύριος — «дам им сердце, чтобы знать Меня, что Я Господь»: повтор «Я Господь» вынесен отдельным предложением. ἔσονταί μοι εἰς λαόν, καὶ ἐγὼ ἔσομαι αὐτοῖς εἰς θεόν — формула завета (ср. 31:33); ὅτι ἐπιστραφήσονται ἐπ᾿ ἐμὲ ἐξ ὅλης τῆς καρδίας αὐτῶν — «ибо обратятся ко Мне всем сердцем своим»."
  8: "ὡς τὰ σῦκα τὰ πονηρά… τάδε λέγει κύριος — формула внутри периода, по-японски вынесена в начало (主はこう言われる). παραδώσω τὸν Σεδεκιαν — «предам Седекию»; τοὺς μεγιστᾶνας αὐτοῦ — «вельмож его» (μεγιστάν), おもだった者たち; τὸ κατάλοιπον Ιερουσαλημ — «остаток Иерусалима»; τοὺς κατοικοῦντας ἐν Αἰγύπτῳ — «живущих в Египте»."
  9: "εἰς διασκορπισμὸν εἰς πάσας τὰς βασιλείας τῆς γῆς — «в рассеяние по всем царствам земли»; εἰς ὀνειδισμὸν καὶ εἰς παραβολὴν καὶ εἰς μῖσος καὶ εἰς κατάραν — «в поношение, в притчу, в ненависть и в проклятие» (παραβολή — притча, поговорка); слав. добавляет «и озлобление» («в расточение и озлобление»), внесено как 苦しめる. ἐν παντὶ τόπῳ, οὗ ἐξῶσα αὐτοὺς ἐκεῖ — «на всяком месте, куда Я изгнал их»."
  10: "ἀποστελῶ εἰς αὐτοὺς τὸν λιμὸν καὶ τὸν θάνατον καὶ τὴν μάχαιραν — «пошлю на них голод, смерть и меч» (порядок gr); слав. «мечь и глад и пагубу» — иной порядок и «пагуба» вместо «смерти»; держим gr. ἕως ἂν ἐκλίπωσιν ἀπὸ τῆς γῆς — «доколе не исчезнут с земли» (ἐκλείπω); ἧς ἔδωκα αὐτοῖς — «которую Я дал им»; слав. добавляет «и отцем их» — внесено без скобок (彼らとその父祖たちに与えた地)."
