# jp-box, 1-я Паралипоменон, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: приготовление места и скинии (1); повеление Давида левитам (2–13);
# освящение и перенесение ковчега на шестах (14–15); певцы и музыканты (16–24);
# перенесение с жертвами и ликованием (25–28); Мелхола (29).
# Речь — 「…」: 15:2 (Давид), 15:12–13 (Давид), 15:16 (Давид).
# Красного нет.
# 〔…〕 нет: слав. добавление «ефуд» (15:27) внесено в текст, см. notes.
# Пометы csl в скобках (15:2 «да от всякаго», 15:12 «на место», 15:19
# «возглашающе») — редакционные, не внесены, оговорены в notes.
# Αβδεδομ передан как オベデ・エドム — то же лицо, что Аведдар 13:13
# (гр. Αβεδδαρα; в 2 Цар 6 — オベデ・エドム).
# Числа: 15:6 по гр. и слав. 250 (в Синод. 220); 15:7 по слав. 130 (в гр. 150).
# Сносок ⟨…⟩ нет: 契約の箱, レビ人, 祭司, 歌い手, 門衛, エフォド уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 15
draft: true

verses:
  1: "ダビデはダビデの町[まち]に自分[じぶん]のために家[いえ]々[いえ]を建[た]て、神[かみ]の箱[はこ]のために場所[ばしょ]を整[ととの]え、それのために天幕[てんまく]を張[は]った。"
  2: "そのときダビデは言[い]った。「神[かみ]の箱[はこ]を運[はこ]ぶことができるのは、レビ人[びと]のほかにはだれもいない。主[しゅ]が彼らを選[えら]んで、主[しゅ]の箱を運[はこ]ばせ、とこしえに主に仕[つか]えさせるからである。」"
  3: "ダビデは、主[しゅ]の箱[はこ]を、彼がそのために整[ととの]えた場所[ばしょ]へ運[はこ]び入[い]れるために、イスラエルのすべてをエルサレムに集[あつ]めた。"
  4: "ダビデはアロン[びと]の子[こ]らとレビ人[びと]たちを集[あつ]めた。"
  5: "カアトの子[こ]らのうちでは、長[かしら]ウリエルとその兄弟[きょうだい]たち、百二十人[ひゃくにじゅうにん]。"
  6: "メラリの子[こ]らのうちでは、長[かしら]アサヤとその兄弟[きょうだい]たち、二百五十人[にひゃくごじゅうにん]。"
  7: "ゲルションの子[こ]らのうちでは、長[かしら]ヨエルとその兄弟[きょうだい]たち、百三十人[ひゃくさんじゅうにん]。"
  8: "エリサファンの子[こ]らのうちでは、長[かしら]サマヤとその兄弟[きょうだい]たち、二百人[にひゃくにん]。"
  9: "ヘブロンの子[こ]らのうちでは、長[かしら]エリエルとその兄弟[きょうだい]たち、八十人[はちじゅうにん]。"
  10: "オジエルの子[こ]らのうちでは、長[かしら]アミナダブとその兄弟[きょうだい]たち、百十二人[ひゃくじゅうににん]。"
  11: "ダビデは祭司[さいし]サドクとアビアタル、またレビ人[びと]ウリエル、アサヤ、ヨエル、サマヤ、エリエル、アミナダブを呼[よ]んだ。"
  12: "彼らに言[い]った。「あなたがたはレビ人[びと]の氏族[しぞく]の長[かしら]たちである。あなたがたも、あなたがたの兄弟[きょうだい]たちも身[み]を清[きよ]め、イスラエルの神[かみ]である主[しゅ]の箱[はこ]を、わたしがそのために整[ととの]えた場所[ばしょ]へ運[はこ]び上[あ]げなさい。"
  13: "以前[いぜん]、あなたがたがその務[つと]めを果[は]たさなかったとき、わたしたちの神[かみ]はわたしたちの間[あいだ]に破[やぶ]れを生[しょう]じさせられた。わたしたちが、定[さだ]められたとおりに箱を求[もと]めなかったからである。」"
  14: "祭司[さいし]たちとレビ人[びと]たちは身[み]を清[きよ]めて、イスラエルの神[かみ]である主[しゅ]の箱[はこ]を運[はこ]ぶことになった。"
  15: "レビ人[びと]の子[こ]らは、モーセが神[かみ]の言葉[ことば]によって命[めい]じ、聖書[せいしょ]に記[しる]されているとおりに、神[かみ]の箱[はこ]を肩[かた]に担[かつ]ぎ、担[にな]い棒[ぼう]で運[はこ]んだ。"
  16: "ダビデはレビ人[びと]の長[かしら]たちに言[い]った。「あなたがたの兄弟[きょうだい]たち、すなわち歌[うた]い手[て]たちを、楽器[がっき]である琴[こと]、竪琴[たてごと]、シンバルとともに立[た]たせ、喜[よろこ]びの声[こえ]を高[たか]く上[あ]げさせなさい。」"
  17: "レビ人[びと]たちはヨエルの子[こ]エマン、その兄弟[きょうだい]たちのうちからバラキヤの子[こ]アサフ、またメラリの子[こ]ら、その兄弟[きょうだい]たちのうちからキシャイの子[こ]エタンを立[た]てた。"
  18: "彼らとともに、第二[だいに]の組[くみ]の兄弟[きょうだい]たちを置[お]いた。ゼカリヤ、オジエル、セミラモト、イエイル、オニ、エリアブ、ベナヤ、マアセヤ、マタティア、エリファレヤ、マケニヤ、オベデ・エドム、イエイル、オジア。これらは門衛[もんえい]である。"
  19: "歌[うた]い手[て]のエマン、アサフ、エタンは、青銅[せいどう]のシンバルを打[う]ち鳴[な]らし、その音[おと]を響[ひび]かせた。"
  20: "ゼカリヤ、オジエル、セミラモト、イエイル、オニ、エリアブ、マアセヤ、ベナヤは、アラモトにあわせて琴[こと]を奏[かな]でた。"
  21: "マタティア、エリファレヤ、マケニヤ、オベデ・エドム、イエイル、オジアは、声[こえ]を強[つよ]めるためにアマセニトにあわせてシンバルを鳴[な]らした。"
  22: "レビ人[びと]の長[かしら]ケナニヤは歌[うた]の指導者[しどうしゃ]であった。彼は巧[たく]みであったからである。"
  23: "バラキヤとエルカナは箱[はこ]の門衛[もんえい]であった。"
  24: "祭司[さいし]たち、すなわちソブニヤ、ヨシャファト、ナタナエル、アマサイ、ゼカリヤ、バナイ、エリエゼルは、神[かみ]の箱[はこ]の前[まえ]でラッパを吹[ふ]いた。オベデ・エドムとイヤは神の箱の門衛[もんえい]であった。"
  25: "ダビデとイスラエルの長老[ちょうろう]たち、千人隊[せんにんたい]の長[かしら]たちは、主[しゅ]の契約[けいやく]の箱[はこ]をオベデ・エドムの家[いえ]から喜[よろこ]びとともに運[はこ]び上[あ]げるために行[い]った。"
  26: "神[かみ]がレビ人[びと]たちを助[たす]けて、主[しゅ]の契約[けいやく]の箱[はこ]を運[はこ]ばせたとき、彼らは七頭[ななとう]の子牛[こうし]と七匹[ななひき]の雄羊[おひつじ]をいけにえとしてささげた。"
  27: "ダビデは亜麻布[あまぬの]の衣[ころも]を身[み]に着[つ]けて帯[おび]を締[し]めていた。レビ人[びと]たちもみな、契約[けいやく]の箱[はこ]を運[はこ]ぶ者[もの]たちも、歌[うた]い手[て]たちも、歌[うた]の指導者[しどうしゃ]ケナニヤも同[おな]じであった。ダビデの上[うえ]には亜麻布のエフォドがあった。"
  28: "イスラエルはみな、主[しゅ]の契約[けいやく]の箱[はこ]を、叫[さけ]びと角笛[つのぶえ]の音[ね]、ラッパとシンバルを鳴[な]らし、琴[こと]と竪琴[たてごと]をかき鳴[な]らして運[はこ]び上[あ]げた。"
  29: "主[しゅ]の契約[けいやく]の箱[はこ]がダビデの町[まち]に近[ちか]づいたとき、サウルの娘[むすめ]ミカルは窓[まど]から覗[のぞ]き込み、王[おう]ダビデが踊[おど]り、遊[あそ]んでいるのを見[み]て、心[こころ]のうちに彼を蔑[さげす]んだ。"

notes:
  1: "ἐποίησεν αὐτῷ οἰκίας — построил себе домы (слав. «домы»). ἡτοίμασεν τὸν τόπον — приготовил место. σκηνή — скиния, шатёр (天幕), здесь временное жилище для ковчега."
  2: "Οὐκ ἔστιν ἆραι — «нельзя нести» (слав. «не леть есть»). ἐξελέξατο — избрал (ἐκλέγομαι). αἴρειν — носить. λειτουργεῖν — служить (при святилище). ἕως αἰῶνος — до века. Слав. в скобках «да от всякаго» — редакционная вставка, не внесена."
  3: "ἐξεκκλησίασεν — созвал (ἐκκλησιάζω). τοῦ ἀνενέγκαι — чтобы внести, вознести (ἀναφέρω). εἰς τὸν τόπον, ὃν ἡτοίμασεν — на место, которое приготовил."
  4: "συνήγαγεν — собрал (συνάγω). τοὺς υἱοὺς Ααρων καὶ τοὺς Λευίτας — сынов Аарона и левитов, т.е. священников и левитов (祭司, レビ人)."
  5: "τῶν υἱῶν Κααθ — из сынов Каафа (カアト), т.е. род Каафа. Ουριηλ ὁ ἄρχων — Уриил, глава. ἑκατὸν εἴκοσι — 120."
  6: "τῶν υἱῶν Μεραρι — из сынов Мерари (メラリ). Ασαια ὁ ἄρχων — Асаия, глава. διακόσιοι πεντήκοντα — 250; у Синод. 220 — масоретское чтение."
  7: "τῶν υἱῶν Γηρσαμ — из сынов Гирсона (ゲルション). Ιωηλ ὁ ἄρχων — Иоиль, глава. ἑκατὸν πεντήκοντα — в гр. 150; слав. «сто тридесять» — 130, по паритету взято слав. чтение, число LXX оставлено здесь."
  8: "τῶν υἱῶν Ελισαφαν — из сынов Елисафана (エリサファン). Σαμαιας — Самаия (слав. «семеиа»). διακόσιοι — 200."
  9: "τῶν υἱῶν Χεβρων — из сынов Хеврона (ヘブロン). Ελιηλ — Елиил (слав. «елиил»). ὀγδοήκοντα — 80."
  10: "τῶν υἱῶν Οζιηλ — из сынов Озиила (オジエル, как в 6:3 и 16:6). Αμιναδαβ — Аминадав (アミナダブ, как в 13:7). ἑκατὸν δέκα δύο — 112."
  11: "ἐκάλεσεν — призвал. Σαδωκ καὶ Αβιαθαρ τοὺς ἱερεῖς — Садока и Авиафара, священников (サドク, アビアタル). Далее перечислены главы левитских родов."
  12: "ἄρχοντες πατριῶν τῶν Λευιτῶν — начальники отчих родов левитов (氏族の長). ἁγνίσθητε — освятитесь (ἁγνίζω). ἀνοίσετε — понесёте, вознесёте. οὗ ἡτοίμασα αὐτῇ — куда Я приготовил для неё. Слав. в скобках «на место» — пояснение издания, отдельно не внесено."
  13: "οὐκ ἐν τῷ πρότερον ὑμᾶς εἶναι — «не в том, что прежде вас было», тёмное место; понято как «прежде вы не исполняли этого» (слав. «прежде вам не готовым сущым»). διέκοψεν ὁ θεὸς ἡμῶν ἐν ἡμῖν — Бог наш поразил нас (слав. «раздели … в нас»). οὐκ ἐζητήσαμεν ἐν κρίματι — не искали по установлению (слав. «не взыскахом по разсуждению»)."
  14: "ἡγνίσθησαν — освятились (страдат. от ἁγνίζω). τοῦ ἀνενέγκαι — чтобы вознести. С этого стиха — исполнение повеления Давида."
  15: "ἔλαβον … τὴν κιβωτὸν — взяли ковчег. ὡς ἐνετείλατο Μωϋσῆς — как заповедал Моисей. κατὰ τὴν γραφήν — по Писанию. ἀναφορεῦσιν ἐπ᾽ αὐτούς — «на шестах на них», т.е. на плечах (слав. «рамены своими на носилех»)."
  16: "τοῖς ἄρχουσιν τῶν Λευιτῶν — начальникам левитов. Στήσατε — поставьте. ψαλτῳδούς — певцов (歌い手). ὄργανα ᾠδῶν — музыкальные орудия. τοῦ φωνῆσαι εἰς ὕψος — возгласить в высоту. ἐν φωνῇ εὐφροσύνης — гласом веселия."
  17: "ἔστησαν — поставили. Αιμαν υἱὸν Ιωηλ — Емана, сына Иоиля (エマン). Ασαφ υἱὸς Βαραχια — Асаф, сын Варахии (アサフ, バラキヤ, как в 6:24). Αιθαν υἱὸς Κισαιου — Ефан, сын Кишаии (エタン, как в 6:29; слав. «ефан»)."
  18: "οἱ δεύτεροι — «вторые», т.е. второго разряда (слав. «втории чином»). πυλωροί — привратники (門衛). В списке 14 имён, как в гр. и слав."
  19: "ψαλτῳδοί — певцы. ἐν κυμβάλοις χαλκοῖς — на медных кимвалах (青銅). τοῦ ἀκουσθῆναι ποιῆσαι — «сделать, чтобы было слышно», т.е. играть громко. Слав. в скобках «возглашающе» — пояснение издания, не внесено."
  20: "ἐν νάβλαις ἐπὶ αλαιμωθ — «на псалтирях на аламоф» (νάβλα — 琴, псалтирь); ἀλαιμώθ — музыкальный термин (слав. «тайны»), оставлен транслитерацией アラモト."
  21: "ἐν κινύραις αμασενιθ τοῦ ἐνισχῦσαι — «на кинирах амасениф, чтобы усилить» (κινύρα — 竪琴); ἀμασενίθ — музыкальный термин (слав. «еже превзыти»), оставлен транслитерацией アマセニト. Слав. читает здесь «в кимвалех» (シンバル) — по паритету взято слав. чтение, LXX-вариант оставлен здесь."
  22: "Χωνενια — Хонания (ケナニヤ, как в 26:29; слав. «хонениа»). ἄρχων τῶν Λευιτῶν — начальник левитов. ἄρχων τῶν ᾠδῶν — начальник пений. συνετός — разумный, искусный (слав. «разумен»)."
  23: "Βαραχια καὶ Ηλκανα — Варахия и Елкана (バラキヤ, как в 6:24). πυλωροὶ τῆς κιβωτοῦ — привратники ковчега (門衛)."
  24: "Σοβνια — Совия (слав. «совениа»). Ιωσαφατ — Иосафат. Ναθαναηλ — Нафанаил. Αμασαι — Амасай. Βαναι — Ваней. Ελιεζερ — Елиезер. σαλπίζοντες ταῖς σάλπιγξιν — трубящие трубами. Ιια — Иия (слав. «иеиа»)."
  25: "οἱ πρεσβύτεροι — старейшины. οἱ χιλίαρχοι — тысяченачальники (千人隊の長). ἐξ οἴκου Αβδεδομ — из дома Овед-Едома (オベデ・エドム). ἐν εὐφροσύνῃ — с веселием."
  26: "ἐν τῷ κατισχῦσαι τὸν θεὸν — «когда укрепил Бог» (слав. «егда укрепляше Бог»), т.е. когда Бог помог нести. ἔθυσαν — закололи в жертву (θύω). ἑπτὰ μόσχους καὶ ἑπτὰ κριούς — семь тельцов и семь овнов."
  27: "περιεζωσμένος — опоясанный (περιζώννυμι). στολὴ βυσσίνη — виссонная одежда (亜麻布の衣). ἐπὶ Δαυιδ στολὴ βυσσίνη — у гр. повтор о виссонной одежде; слав. читает «ефуд виссонный» (エフォド) — по паритету внесено; ср. 2 Цар 6:14 (льняной ефод)."
  28: "ἐν σημασίᾳ — с сигналом, восклицанием (σημασία; слав. «с восклицанием»). σωφερ — шофар (слав. «гласом трубным»), 角笛. ἀναφωνοῦντες — возглашая. νάβλαι καὶ κινύραι — псалтири и киниры (琴, 竪琴)."
  29: "παρέκυψεν διὰ τῆς θυρίδος — выглянула в окно (παρακύπτω, θυρίς). ὀρχούμενον καὶ παίζοντα — пляшущего и играющего. ἐξουδένωσεν — уничижила, презрела (ἐξουδενόω; слав. «уничижи»). ἐν τῇ ψυχῇ αὐτῆς — в душе своей (слав. «в сердцы своем»)."
