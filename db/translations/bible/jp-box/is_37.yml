# jp-box, Исаия, глава 37. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 37 нет; структура сверена с параллелью 4 Цар 19;
# jp-ni не использовался.
# Язык — современный 常体 (в молитве тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 37: вретище Езекии и посольство к Исаии (1–7), Рабшак у Ливны и посольство
# Сеннахирима (8–13), молитва Езекии (14–20), пророчество Исаии о Сеннахириме
# (21–35), гибель ассирийского войска и смерть Сеннахирима (36–38).
# Речи: посланные передают слова Езекии — 「…」 (3–4), его слова внутри — 『…』;
# Исаия — 「…」 (6–7, 21, 30–31), слово Господа внутри — 『…』 (21–35, не закрывается
# до 35, как и указано в брифе); слова царя Ассирийского внутри пророчества —
# 「…」 (24–25); посольство Сеннахирима — 「…」 (9–13), содержание его — 『…』,
# цитата внутри него — 「…」 (10). Вводные формулы — вне кавычек.
# Нумерация по gr: 38 стихов; у csl и ru тоже 38, деление совпадает (в 37:28–29
# csl иначе распределяет «ярость же твоя» — см. notes).
# Паритет: csl-добавки внесены в основной текст без 〔…〕 — 37:4 «господин его»,
# 37:5 «Езекии», 37:8 «яко отиде от лахиса», 37:11 «и ты ли избавишися?»,
# 37:14 «прочте ю» и «вниде во храм Господень», 37:16 «Царь», 37:17 «приклони ухо»,
# «отверзи очи», «слыши», 37:34 «и во град сей не внидет»; оговорено в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 神殿, 祭壇, ケルビム, 陣営, 聖絶, 粗布 уже в корпусе.
# Имена — транслитерация греческого (LXX); сверены с 4 Цар 19.

