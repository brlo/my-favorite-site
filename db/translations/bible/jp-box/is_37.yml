verses:
  1: "王[おう]ヒゼキヤはこれを聞[き]くと、自分[じぶん]の衣[ころも]を裂[さ]き、粗布[あらぬの]を身[み]にまとって、主[しゅ]の神殿[しんでん]に上[のぼ]った。"
  2: "そして、家令[かれい]エリアキム、書記[しょき]ソムナス、祭司[さいし]たちの長老[ちょうろう]たちを、粗布[あらぬの]をまとったまま、預言者[よげんしゃ]イザヤ、アモスの子[こ]のもとへ遣[つか]わした。"
  3: "彼[かれ]らはイザヤに言[い]った。「ヒゼキヤはこう言[い]う。『この日[ひ]は苦難[くなん]と侮辱[ぶじょく]と叱責[しっせき]と怒[いか]りの日[ひ]である。産[う]みの苦[くる]しみが産[う]む者[もの]に来[き]ているのに、産[う]む力[ちから]がないからである。"
  4: "もしかすると、あなたの神[かみ]である主[しゅ]は、アッシリアの王[おう]がその主人[しゅじん]として生[い]ける神[かみ]をそしり、あなたの神[かみ]である主[しゅ]が聞[き]かれた言葉[ことば]によってそしるために遣[つか]わしたラブシャケのすべての言葉[ことば]を、聞[き]いてくださるかもしれない。あなたは、残[のこ]されている者[もの]たちのために祈[いの]ってほしい。』」"
  5: "ヒゼキヤ王[おう]の家来[けらい]たちはイザヤのもとへ来[き]た。"
  6: "イザヤは彼[かれ]らに言[い]った。「あなたがたの主人[しゅじん]にこう言[い]いなさい。『主[しゅ]はこう言[い]われる。アッシリアの王[おう]の使者[ししゃ]たちがわたしをそしったその言葉[ことば]を、あなたは聞[き]いたが、それを恐[おそ]れてはならない。"
  7: "見[み]よ、わたしは彼[かれ]の内[うち]に霊[れい]を投[な]げ入[い]れる。彼は知[し]らせを聞[き]いて自分[じぶん]の地[ち]へ帰[かえ]り、自分[じぶん]の地[ち]で剣[つるぎ]によって倒[たお]れる。』」"
  8: "ラブシャケは引[ひ]き返[かえ]し、リブナを包囲[ほうい]している王[おう]に会[あ]った。王[おう]がラキシュから去[さ]ったことを聞[き]いたからである。"
  9: "エチオピアの王[おう]ティルハカが自分[じぶん]を攻[せ]め囲[かこ]むために出[で]て来[き]た。これを聞[き]くと、引[ひ]き返[かえ]して、ヒゼキヤのもとへ使者[ししゃ]たちを遣[つか]わして言[い]わせた。「ユダの王[おう]ヒゼキヤにこう言[い]いなさい。"
  10: "『あなたが頼[たよ]りにしているあなたの神[かみ]が、あなたをそそのかして「エルサレムはアッシリアの王[おう]の手[て]に渡[わた]されることはない」と言[い]わせてはならない。"
  11: "それとも、あなたは、アッシリアの王[おう]たちがすべての地[ち]にしたこと、すなわちそれを滅[ほろ]ぼしたことを聞[き]かなかったのか。あなただけが助[たす]かるのか。"
  12: "わたしの父[ちち]たちが滅[ほろ]ぼした国[くに]々[ぐに]の神[かみ]々[がみ]は、彼[かれ]らを救[すく]い出[だ]したか。テマドの地[ち]にあるゴザン、ハラン、ラフェスを。"
  13: "ハマトの王[おう]たち、アルパドの王[おう]たち、セプファリムの町[まち]の王[おう]はどこにいるのか。アナグ、ウガワはどこにいるのか。』」"
  14: "ヒゼキヤは使者[ししゃ]たちから書[しょ]き物[もの]を受[う]け取[と]って読[よ]み、主[しゅ]の神殿[しんでん]に入[はい]って行[い]き、主[しゅ]の前[まえ]でそれを広[ひろ]げた。"
  15: "そしてヒゼキヤは主[しゅ]に祈[いの]って言[い]った。"
  16: "「万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]、ケルビムの上[うえ]に座[すわ]る方[かた]。あなただけが唯一[ゆいいつ]の神[かみ]、全世界[ぜんせかい]のすべての王国[おうこく]の王[おう]である。あなたは天[てん]と地[ち]を造[つく]られた。"
  17: "主[しゅ]よ、あなたの耳[みみ]を傾[かたむ]けて聞[き]いてください。主[しゅ]よ、あなたの目[め]を開[ひら]いて見[み]てください。センナケリブが生[い]ける神[かみ]をそしるために遣[つか]わした言葉[ことば]を聞[き]いてください。"
  18: "主[しゅ]よ、まことに、アッシリアの王[おう]たちは国[くに]々[ぐに]を、また彼[かれ]らの地[ち]を荒[あ]らし、"
  19: "彼[かれ]らの神[かみ]々[がみ]を火[ひ]に投[な]げ入[い]れた。それらは神[かみ]ではなく、人[ひと]の手[て]のわざ、木[き]と石[いし]にすぎないからである。それゆえ、彼[かれ]らはそれらを滅[ほろ]ぼした。"
  20: "そして今[いま]、わたしたちの神[かみ]、主[しゅ]よ。わたしたちを彼[かれ]の手[て]から救[すく]ってください。そうすれば、地[ち]のすべての王国[おうこく]は、主[しゅ]よ、あなただけが神[かみ]であることを知[し]るだろう。」"
  21: "イザヤ、アモスの子[こ]はヒゼキヤのもとへ遣[つか]わされ、こう言[い]った。「万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。『あなたがアッシリアの王[おう]センナケリブについてわたしに祈[いの]ったことを、わたしは聞[き]いた。"
  22: "これが、主[しゅ]が彼[かれ]について語[かた]られた言葉[ことば]である。おとめシオンの娘[むすめ]は、あなたを蔑[さげす]み、あざ笑[わら]った。エルサレムの娘[むすめ]は、あなたのことで頭[あたま]を振[ふ]った。"
  23: "あなたはだれをそしり、だれを怒[いか]らせたのか。だれに向[む]かって声[こえ]を上[あ]げ、目[め]を高[たか]く上[あ]げたのか。イスラエルの聖[せい]なる方[かた]に向[む]かってではないのか。"
  24: "あなたは使者[ししゃ]たちの手[て]によって主[しゅ]をそしって言[い]った。「わたしは戦車[せんしゃ]の多[おお]さによって山[やま]々[やま]の高[たか]みに上[のぼ]り、レバノンの果[は]てにまで上[のぼ]った。わたしはその杉[すぎ]の高[たか]いものと、その糸杉[いとすぎ]の美[うつく]しいものを切[き]り倒[たお]し、その森[もり]の奥[おく]の高[たか]みに入[はい]った。"
  25: "わたしは橋[はし]を架[か]け、水[みず]を、すべての水[みず]の集[あつ]まりを干[ひ]あがらせた。」"
  26: "あなたは聞[き]かなかったのか。わたしは昔[むかし]からそれを造[つく]り、昔[むかし]の日[ひ]々[び]にそれを定[さだ]めて、今[いま]それを実現[じつげん]した。それは、あなたが国[くに]々[ぐに]を堅固[けんご]な所[ところ]とともに荒[あ]らし、堅固[けんご]な町[まち]に住[す]む者[もの]たちを荒[あ]らすためである。"
  27: "わたしが手[て]を緩[ゆる]めると、彼[かれ]らは干[ひ]あがり、屋根[やね]の上[うえ]の干[ひ]からびた草[くさ]のように、また草[くさ]のようになった。"
  28: "今[いま]、あなたの休[やす]みも、あなたの出[で]て行[い]くことも、あなたの入[はい]って来[く]ることも、わたしは知[し]っている。"
  29: "あなたが怒[いか]ったその怒[いか]りと、あなたの苦[にが]さがわたしの耳[みみ]に上[のぼ]ったので、わたしはあなたの鼻[はな]に口輪[くちわ]を掛[か]け、あなたの唇[くちびる]にくつわを掛[か]けて、あなたが来[き]た道[みち]をそのまま帰[かえ]らせる。"
  30: "あなたへのしるしはこれである。今年[ことし]は自分[じぶん]が蒔[ま]いたものを食[た]べ、二[ふた]年目[としめ]には自然[しぜん]に生[は]えるものを食[た]べる。三[み]年目[としめ]には種[たね]をまき、刈[か]り取[と]り、ぶどう畑[ばたけ]を植[う]えて、その実[み]を食[た]べる。"
  31: "ユダの家[いえ]のうち、逃[のが]れ延[の]びた残[のこ]りの者[もの]は、再[ふたた]び下[した]に根[ね]を張[は]り、上[うえ]に実[み]を結[むす]ぶ。"
  32: "まことに、エルサレムから残[のこ]りの者[もの]が、シオンの山[やま]から逃[のが]れた者[もの]が出[で]て来[く]る。万軍[ばんぐん]の主[しゅ]の熱心[ねっしん]がこれを成[な]し遂[と]げる。"
  33: "それゆえ、主[しゅ]はアッシリアの王[おう]についてこう言[い]われる。彼[かれ]はこの町[まち]に入[はい]らず、そこに矢[や]を放[はな]たず、盾[たて]をその前[まえ]に進[すす]めず、その周[まわ]りに土塁[どるい]を築[きず]くこともない。"
  34: "彼[かれ]は来[き]た道[みち]をそのまま帰[かえ]る。この町[まち]には入[はい]らない、と主[しゅ]は言[い]われる。"
  35: "わたしはこの町[まち]を、わたし自身[じしん]のため、またわたしのしもべダビデのために守[まも]る。』」"
  36: "主[しゅ]の使[つか]いが出[で]て行[い]き、アッシリアの陣営[じんえい]で十八万五千人[じゅうはちまんごせんにん]を打[う]ち殺[ころ]した。朝[あさ]早[はや]く起[き]て見[み]ると、見[み]よ、すべてが死体[したい]であった。"
  37: "アッシリアの王[おう]センナケリブは立[た]ち去[さ]って帰[かえ]り、ニネベに住[す]んだ。"
  38: "彼[かれ]が自分[じぶん]の神[かみ]ナサラクの神殿[しんでん]で礼拝[れいはい]していたとき、その子[こ]らであるアドラメレクとサラサルが剣[つるぎ]で彼[かれ]を殺[ころ]した。彼[かれ]らはアルメニアへ逃[に]げ延[の]びた。そしてその子[こ]アソルダンが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "ἐγένετο ἐν τῷ ἀκοῦσαι — «было, когда услышал» (ἐν с аористом); ἔσχισεν τὰ ἱμάτια — разодрал одежды; σάκκον περιεβάλετο — облёкся во вретище (粗布); ἀνέβη εἰς τὸν οἶκον κυρίου — вошёл в дом Господень (神殿)."
  2: "οἰκονόμος — домоправитель (家令); γραμματεύς — писец (書記); τοὺς πρεσβυτέρους τῶν ἱερέων — старейшины священников; περιβεβλημένους σάκκους — облечённые во вретища. Стих кончается запятой: перечисление продолжается в 3."
  3: "Ἡμέρα θλίψεως καὶ ὀνειδισμοῦ καὶ ἐλεγμοῦ καὶ ὀργῆς — четыре члена: скорби, поношения, обличения и гнева (в 4 Цар 19:3 их три); ἥκει ἡ ὠδὶν τῇ τικτούσῃ — «пришла родовая мука у рождающей» (ὠδίν); ἰσχὺν δὲ οὐκ ἔχει τοῦ τεκεῖν — «а силы родить нет». Здесь открываются речь посланных (「…」) и слова Езекии (『…』)."
  4: "εἰσακούσαι — оптатив: «да услышит» (εἰσακούω); ὀνειδίζειν θεὸν ζῶντα — поносить Бога живого; csl добавляет «господин его» — внесено в текст; δεηθήσῃ — «помолишься» (δέομαι); περὶ τῶν καταλελειμμένων τούτων — «об оставшихся этих»."
  5: "οἱ παῖδες τοῦ βασιλέως — отроки, слуги царя; csl добавляет «езекии» — «Езекии», внесено. Стих короткий, служит связкой."
  6: "Οὕτως ἐρεῖτε — «так скажите»; Μὴ φοβηθῇς ἀπὸ τῶν λόγων — «не убойся слов» (ἀπό — «из-за»); οὓς ὠνείδισάν με οἱ πρέσβεις — «которыми поносили меня послы» (в 4 Цар 19:6 — παιδάρια, «отроки»). Здесь снова открывается слово Господа (『…』)."
  7: "ἐμβαλῶ εἰς αὐτὸν πνεῦμα — «вложу в него дух», т. е. пошлю побуждение; ἀκούσας ἀγγελίαν — «услышав весть» (ἀγγελία); ἀποστραφήσεται εἰς τὴν χώραν αὐτοῦ — «возвратится в землю свою»; πεσεῖται μαχαίρᾳ — «падёт мечом». В ru добавлено «Я поражу его» — по МТ, не внесено."
  8: "κατέλαβεν πολιορκοῦντα τὸν βασιλέα Λομναν — «застал царя осаждающим Ливну» (Λομνα — リブナ, в слав. «Ловна»); csl добавляет «яко отиде от лахиса» — «что он отошёл от Лахиса»; внесено без 〔…〕 (в гр этого нет)."
  9: "Θαρακα βασιλεὺς Αἰθιόπων — Тирхака, царь эфиопов (в 4 Цар 19:9 — ティルハカ, в слав. «Фарака»); πολιορκῆσαι αὐτόν — «осадить его»; ἀκούσας ἀπέστρεψεν — «услышав, повернул назад»; ἀπέστειλεν ἀγγέλους — «послал послов». Стих открывает речь посольства (「…」)."
  10: "Οὕτως ἐρεῖτε — «так скажите»; ἐφ᾿ ᾧ πεποιθὼς εἶ ἐπ᾿ αὐτῷ — «на кого ты уповаешь» (πείθω, перфект); Οὐ μὴ παραδοθῇ — усиленное отрицание будущего. Здесь открывается вложенная цитата (『…』), внутри неё ещё одна (「…」)."
  11: "ἢ οὐκ ἤκουσας — «или ты не слышал»; ἃ ἐποίησαν βασιλεῖς Ἀσσυρίων πᾶσαν τὴν γῆν ὡς ἀπώλεσαν — «что сделали цари ассирийские всей земле, как погубили её» (ἀπόλλυμι); csl добавляет «и ты ли избавишися?» — внесено."
  12: "οἱ θεοὶ τῶν ἐθνῶν — боги народов; οὓς οἱ πατέρες μου ἀπώλεσαν — которых истребили отцы мои; Γωζαν, Χαρραν, Ραφες — Гозан, Харран, Рафес (в 4 Цар 19:12 иные имена: Θαασθεν, «Фалассар»); αἵ εἰσιν ἐν χώρᾳ Θεμαδ — «которые в земле Фемад» (слав. «феемафи»; передано テマド)."
  13: "οἱ βασιλεῖς Αιμαθ καὶ Αρφαθ — цари Емафа и Арфада (ハマト、アルパド); πόλεως Σεπφαριμ — города Сеффарима (セプファリム; в 4 Цар — Σεπφαρουαιν); Αναγ, Ουγαυα — Анаг, Угава (слав. сливает их в одно «анагугана»). Стих обрывается на полуслове — речь прервана."
  14: "τὸ βιβλίον — книга, письмо; ἤνοιξεν αὐτὸ ἐναντίον κυρίου — «открыл её пред Господом»; csl добавляет «прочте ю» («прочитал её») и «вниде во храм Господень» — внесено; в гр входа в храм нет, только «открыл пред Господом»."
  15: "προσεύξατο … λέγων — «помолился, говоря». Молитва идёт 16–20; в гр перед ней нет «пред Господом» (это добавка 4 Цар 19:15)."
  16: "Κύριε σαβαωθ — Господи Саваоф (万軍の主); ὁ καθήμενος ἐπὶ τῶν χερουβιν — сидящий на херувимах; σὺ θεὸς μόνος εἶ πάσης βασιλείας τῆς οἰκουμένης — «Ты один Бог всякого царства вселенной»; csl добавляет «Царь» — внесено; σὺ ἐποίησας τὸν οὐρανὸν καὶ τὴν γῆν — «Ты сотворил небо и землю»."
  17: "εἰσάκουσον, εἴσβλεψον, ἰδέ — услышь, воззри, увидь; csl добавляет «приклони ухо», «отверзи очи» и «слыши» — внесено; ὀνειδίζειν θεὸν ζῶντα — поносить Бога живого."
  18: "ἐπ᾿ ἀληθείας — «поистине» (датив); ἠρήμωσαν — опустошили (ἐρημόω); τὴν οἰκουμένην ὅλην καὶ τὴν χώραν αὐτῶν — «всю вселенную и землю их». Стих обрывается запятой, продолжение — в 19."
  19: "ἐνέβαλον τὰ εἴδωλα αὐτῶν εἰς τὸ πῦρ — «бросили идолов своих в огонь»; οὐ γὰρ θεοὶ ἦσαν — «ибо не были богами»; ἔργα χειρῶν ἀνθρώπων, ξύλα καὶ λίθοι — дела рук человеческих, дерево и камни; ἀπώλεσαν αὐτούς — погубили их."
  20: "σῶσον ἡμᾶς ἐκ χειρὸς αὐτῶν — «спаси нас из руки их»; ἵνα γνῷ πᾶσα βασιλεία τῆς γῆς — «чтобы узнало всякое царство земли»; σὺ εἶ ὁ θεὸς μόνος — «Ты Бог един». Здесь закрывается молитва (16–20)."
  21: "ἀπεστάλη Ησαιας — «послан был Исаия» (страдательный оборот); Ἤκουσα ἃ προσηύξω — «услышал, о чём ты молился». Здесь открывается слово Господа (『…』), оно не закрывается до ст. 35."
  22: "Ἐφαύλισέν σε — презрел тебя (φαυλίζω); ἐμυκτήρισέν σε — осмеял (μυκτηρίζω, букв. «сморщил нос»); παρθένος θυγάτηρ Σιων — дева, дочь Сиона (おとめシオンの娘); ἐπὶ σοὶ κεφαλὴν ἐκίνησεν — «над тобой покачала головой» (знак насмешки); θυγάτηρ Ιερουσαλημ — дочь Иерусалима. Оборот «это слово, которое изрёк Бог о нём» — шов оригинала внутри речи Господа, передан буквально."
  23: "τίνα ὠνείδισας καὶ παρώξυνας — «кого ты поносил и раздражил» (παροξύνω); ὕψωσας τὴν φωνήν σου — возвысил голос; οὐκ ἦρας εἰς ὕψος τοὺς ὀφθαλμούς σου — «не поднял ли очи твои в высоту»; ἅγιον τοῦ Ισραηλ — Святой Израилев (イスラエルの聖なる方)."
  24: "δι᾿ ἀγγέλων — «через послов» (ἄγγελος здесь — посланник); τῷ πλήθει τῶν ἁρμάτων — «множеством колесниц» (戦車); εἰς ὕψος ὀρέων — «на высоту гор»; τὰ ἔσχατα τοῦ Λιβάνου — «пределы Ливана»; τὸ ὕψος τῆς κέδρου — «высоту кедра»; τὸ κάλλος τῆς κυπαρίσσου — «красоту кипариса» (糸杉); εἰς ὕψος μέρους τοῦ δρυμοῦ — «в высоту части чащи». Здесь речь царя Ассирийского (「…」), она идёт до конца ст. 25."
  25: "ἔθηκα γέφυραν — «положил мост» (γέφυρα; место тёмное); ἠρήμωσα ὕδατα καὶ πᾶσαν συναγωγὴν ὕδατος — «опустошил воды и всякое собрание вод». Передано буквально, без сглаживания. Здесь закрывается речь царя."
  26: "οὐ ταῦτα ἤκουσας πάλαι — «разве не слышал ты это издревле»; ἐξ ἀρχαίων ἡμερῶν συνέταξα — «от древних дней определил»; ἐξερημῶσαι ἔθνη ἐν ὀχυροῖς — «опустошить народы в твердынях» (тёмное место, передано буквально); ἐνοικοῦντας ἐν πόλεσιν ὀχυραῖς — «живущих в городах укреплённых»."
  27: "ἀνῆκα τὰς χεῖρας — «ослабил руки» (ἀνίημι), т. е. лишил поддержки; ἐξηράνθησαν — иссохли; χόρτος ξηρὸς ἐπὶ δωμάτων — «трава сухая на кровлях»; ἄγρωστις — трава, злак. В 4 Цар 19:26 перед этим стоят «изнемогли, устрашились, постыдились» — в LXX Исаии их нет."
  28: "τὴν ἀνάπαυσίν σου — «покой твой»; τὴν ἔξοδόν σου καὶ τὴν εἴσοδόν σου — «выход твой и вход твой»; ἐγὼ ἐπίσταμαι — «Я знаю». Стих обрывается, продолжение — в 29."
  29: "ὁ θυμός σου, ὃν ἐθυμώθης — «ярость твоя, которою ты разъярился»; ἡ πικρία σου — «горечь твоя»; ἐμβαλῶ φιμὸν εἰς τὴν ῥῖνά σου — «вложу намордник в ноздри твои» (φιμός — намордник; в 4 Цар 19:28 — ἄγκιστρον, крюк); χαλινὸν εἰς τὰ χείλη σου — «удила в уста твои»; ἀποστρέψω σε τῇ ὁδῷ, ᾗ ἦλθες — «возвращу тебя путём, которым пришёл»."
  30: "τὸ σημεῖον — знамение (しるし); φάγε … ἃ ἔσπαρκας — «ешь, что посеял» (в 4 Цар 19:29 — αὐτόματα, «самородное»; у Исаии иначе); τὸ κατάλειμμα — «остаток» (слав. «еже от себе растет», отсюда 自然に生えるもの); τῷ τρίτῳ σπείραντες ἀμήσατε — «в третий год, посеяв, пожните»."
  31: "οἱ καταλελειμμένοι ἐν τῇ Ιουδαίᾳ — «оставшиеся в Иудее»; φυήσουσιν ῥίζαν κάτω — «пустят корень вниз»; ποιήσουσιν σπέρμα ἄνω — «сотворят семя вверх» (σπέρμα — семя, плод)."
  32: "οἱ καταλελειμμένοι καὶ οἱ σῳζόμενοι — «оставшиеся и спасаемые»; ἐξ ὄρους Σιων — «от горы Сиона»; ὁ ζῆλος κυρίου σαβαωθ — «ревность Господа Саваофа» (万軍の主の熱心); ποιήσει ταῦτα — «сотворит это»."
  33: "διὰ τοῦτο — «посему»; οὐ μὴ εἰσέλθῃ — усиленное отрицание; βέλος — стрела; θυρεός — большой щит (盾); χάραξ — вал, частокол (土塁). Здесь снова открывается слово Господа (『…』), оно идёт до 35."
  34: "τῇ ὁδῷ, ᾗ ἦλθεν, ἐν αὐτῇ ἀποστραφήσεται — «тем путём, которым пришёл, им и возвратится»; csl добавляет «и во град сей не внидет» — внесено; τάδε λέγει κύριος — «так говорит Господь»."
  35: "ὑπερασπιῶ — «буду защищать» (ὑπερασπίζω); τοῦ σῶσαι αὐτήν — «чтобы спасти её»; δι᾿ ἐμὲ καὶ διὰ Δαυιδ τὸν παῖδά μου — «ради Меня и ради Давида, раба Моего». Здесь закрываются слово Господа и речь Исаии."
  36: "ἄγγελος κυρίου — ангел Господень (主の使い); ἀνεῖλεν — «умертвил» (ἀναιρέω); παρεμβολή — стан, лагерь (陣営); ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας — 185 000; ἐξαναστάντες τὸ πρωΐ — «встав рано утром»; σώματα νεκρά — тела мёртвые (死体)."
  37: "ἀποστραφεὶς ἀπῆλθεν — «повернув, ушёл»; ᾤκησεν ἐν Νινευη — «поселился в Ниневии» (ニネベ, как в Мф 12:41)."
  38: "Νασαραχ τὸν παταχρον αὐτοῦ — «Насараха, патахроса своего»: παταχρός — тёмное слово (слав. «отечествоначалник»), передано как «神ナサラク»; в 4 Цар 19:37 — Νεσεραχ (ネセラク). Αδραμελεχ καὶ Σαρασαρ — Адрамелех и Сарасар; εἰς Ἀρμενίαν — в Армению (в 4 Цар — γῆ Αραρατ, «Арарат»); Ασορδαν — Асордан (アソルダン). Исполнение слова 37:7."
