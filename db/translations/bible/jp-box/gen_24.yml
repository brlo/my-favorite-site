verses:
  1: "アブラハムは年老[としお]いて、日[ひ]が進[すす]んでいた。主[しゅ]はすべてのことにおいてアブラハムを祝福[しゅくふく]されていた。"
  2: "アブラハムは、家[いえ]の最[もっと]も年[とし]をとったしもべ、すなわち自分[じぶん]のすべてのものを支[し]配[はい]している者[もの]に言[い]った。「あなたの手[て]をわたしの腿[もも]の下[した]に置[お]け。"
  3: "わたしは、天[てん]の神[かみ]、地[ち]の神である主[しゅ]によって、あなたに誓[ちか]わせる。わたしの子[こ]イサクに妻[つま]を迎[むか]えるのに、わたしがその中[なか]に住[す]んでいるカナン人[じん]の娘[むすめ]たちから取[と]ってはならない。"
  4: "わたしの生[う]まれた地[ち]、わたしの部族[ぶぞく]のもとへ行[い]き、そこからわたしの子イサクに妻[つま]を迎[むか]えよ。」"
  5: "しもべは言った。「もしかすると、その女[おんな]はわたしについてこの地[ち]へ来[き]たくないかもしれません。そのときは、あなたの子[こ]を、あなたが出[で]てきた地へ帰[かえ]すのでしょうか。」"
  6: "アブラハムは言った。「自分[じぶん]に気[き]をつけよ。わたしの子をそこへ帰[かえ]してはならない。"
  7: "天の神、地の神である主[しゅ]は、わたしを父[ちち]の家[いえ]から、わたしの生まれた地から連[つ]れ出[だ]し、わたしに語[かた]り、わたしに誓[ちか]って『あなたにこの地[ち]を与[あた]え、あなたの子孫[ししそん]にも与える』と言[い]われた方[かた]である。その方[かた]があなたの前[まえ]にご自分[じぶん]の天使[てんし]をお遣[つか]わしになるので、あなたはそこからわたしの子イサクに妻を迎える。"
  8: "しかし、もしその女があなたとともにこの地へ来ることを望[のぞ]まないなら、あなたはこの誓[ちか]いから免[まぬか]れる。ただ、わたしの子をそこへ帰してはならない。」"
  9: "そこでしもべは、主人[しゅじん]であるアブラハムの腿[もも]の下[した]に手を置き、この事[こと]について彼に誓った。"
  10: "しもべは主人[しゅじん]のラクダの中から十頭[じゅっとう]のラクダを取り、主人のすべての良[よ]い物[もの]を携[たずさ]えて、立[た]ち上[あ]がり、メソポタミアへ、ナホルの町[まち]へ向[む]かった。"
  11: "彼は町[まち]の外[そと]、水[みず]の井戸[いど]のそばで、夕[ゆう]べ、水を汲[く]む女[おんな]たちが出[で]て来[く]るころに、ラクダを休[やす]ませた。"
  12: "そして言[い]った。「わたしの主人[しゅじん]アブラハムの神[かみ]である主[しゅ]よ、どうか今日[きょう]、わたしの前[まえ]で道[みち]を整[ととの]え、わたしの主人[しゅじん]アブラハムに慈[いつく]しみを施[ほどこ]してください。"
  13: "見[み]よ、わたしは水の泉[いずみ]のそばに立[た]っている。この町[まち]に住[す]む者[もの]たちの娘[むすめ]たちが、水を汲みに出て来る。"
  14: "わたしが『水[みず]がめを傾[かたむ]けて、わたしに飲[の]ませてください』と言[い]う娘[むすめ]がいて、その娘が『お飲[の]みなさい。ラクダが飲み終[お]わるまで飲ませます』と言[い]うなら、その娘こそ、あなたがしもべイサクのために備[そな]えられた方[かた]である。このことで、あなたがわたしの主人[しゅじん]アブラハムに慈[いつく]しみを施[ほどこ]されたことを知[し]る。」"
  15: "彼が心[こころ]の中[なか]でまだ語り終[お]えないうちに、見よ、リベカが出[で]て来[き]た。彼女[かのじょ]は、アブラハムの兄弟[きょうだい]ナホルの妻[つま]ミルカが、その子[こ]ベトエルに産[う]んだ娘[むすめ]で、水がめを肩[かた]に載[の]せていた。"
  16: "その娘は見[み]た目[め]が非常[ひじょう]に美[うつく]しく、処女[しょじょ]であって、まだ男[おとこ]を知[し]らなかった。彼女は泉へ下[くだ]り、水がめを満[み]たして上[のぼ]って来[き]た。"
  17: "しもべは彼女に会[あ]おうと走[はし]り寄[よ]り、言った。「あなたの水がめから、少[すこ]し水を飲ませてください。」"
  18: "彼女は言った。「お飲みください、ご主人[しゅじん]さま。」そして急[いそ]いで水がめを腕[うで]に下[お]ろし、彼に飲ませた。"
  19: "彼が飲み終[お]わるまでそうした。彼女は言った。「あなたのラクダにも水を汲[く]んでやります。みな飲み終わるまで。」"
  20: "彼女は急いで水がめを水[みず]おけに空[あ]け、さらに井戸[いど]へ走[はし]って水を汲み、すべてのラクダに水を汲んでやった。"
  21: "その人[ひと]は黙[だま]って彼女[かのじょ]を見[み]つめ、主[しゅ]が自分[じぶん]の道[みち]を整[ととの]えてくださったのか、そうでないのかを知[し]ろうとしていた。"
  22: "ラクダがみな飲み終[お]わると、その人[ひと]は、重[おも]さ一[いち]ドラクマの金[きん]の耳輪[みみわ]と、彼女[かのじょ]の腕[うで]に着[つ]ける腕輪[うでわ]二[ふた]つ、すなわち重[おも]さ十[じゅう]ドラクマのものを取[と]った。"
  23: "そして尋[たず]ねて言った。「あなたはどなたの娘[むすめ]ですか。教[おし]えてください。あなたの父[ちち]の家[いえ]に、わたしたちが泊[と]まる所[ところ]はありますか。」"
  24: "彼女は言った。「わたしは、ミルカがナホルに産[う]んだベトエルの娘[むすめ]です。」"
  25: "また言った。「わたしたちのところには、わらも飼[か]い葉[ば]もたくさんあり、泊[と]まる所もあります。」"
  26: "その人[ひと]は身[み]をかがめて主[しゅ]を拝[おが]んだ。"
  27: "そして言った。「わたしの主人[しゅじん]アブラハムの神[かみ]である主[しゅ]はほめたたえられますように。主は、わたしの主人[しゅじん]へのご自分[じぶん]の義[ぎ]と真実[しんじつ]を取[と]り去[さ]られなかった。主はわたしの道[みち]を整[ととの]え、わたしを主人[しゅじん]の兄弟[きょうだい]の家[いえ]へ導[みちび]かれた。」"
  28: "娘[むすめ]は走[はし]って、母[はは]の家[いえ]へ行[い]き、これらのことを告[つ]げた。"
  29: "リベカには兄弟[きょうだい]があり、名[な]をラバンといった。ラバンは外[そと]の泉[いずみ]のところにいるその人[ひと]のもとへ走[はし]って行[い]った。"
  30: "彼は妹[いもうと]の手[て]の耳輪[みみわ]と腕輪[うでわ]を見[み]、妹リベカが「あの人[ひと]はわたしにこう言[い]いました」と言うのを聞[き]くと、その人のもとへ来[き]た。その人は泉のそばで、ラクダのそばに立[た]っていた。"
  31: "そして言った。「さあ、入ってください。主[しゅ]はほめたたえられますように。なぜ外[そと]に立[た]っているのですか。わたしは家[いえ]と、ラクダのための場所[ばしょ]を用意[ようい]しておきました。」"
  32: "その人[ひと]は家[いえ]に入[はい]り、ラクダの鞍[くら]をはずした。そしてラクダにわらと飼[か]い葉[ば]を与[あた]え、彼と同行[どうこう]の者[もの]たちの足[あし]を洗[あら]う水[みず]を出[だ]した。"
  33: "パンが彼らの前[まえ]に供[そな]えられた。しかし彼は言った。「わたしは、自分[じぶん]の用件[ようけん]を話[はな]し終[お]えるまでは食[た]べません。」そこで彼らは言った。「話[はな]してください。」"
  34: "彼は言った。「わたしはアブラハムのしもべです。"
  35: "主[しゅ]はわたしの主人[しゅじん]を大[おお]いに祝福[しゅくふく]され、主人[しゅじん]は高[たか]くされました。主は主人に羊[ひつじ]と子牛[こうし]、銀[ぎん]と金[きん]、男[おとこ]の奴隷[どれい]と女[おんな]の奴隷[どれい]、ラクダとろばを与[あた]えられました。"
  36: "わたしの主人[しゅじん]の妻[つま]サラは、主人が年老[としお]いてから、主人に一人[ひとり]の男[おとこ]の子[こ]を産[う]みました。主人は自分のすべてのものをその子に与[あた]えました。"
  37: "主人[しゅじん]はわたしに誓[ちか]わせて、こう言[い]いました。『わたしの子[こ]に妻[つま]を迎[むか]えるのに、わたしがその地[ち]に寄[き]留[りゅう]しているカナン人[じん]の娘[むすめ]たちから取[と]ってはならない。"
  38: "ただ、わたしの父[ちち]の家[いえ]へ、わたしの部族[ぶぞく]のもとへ行[い]き、そこからわたしの子に妻を迎えよ』と。"
  39: "わたしは主人[しゅじん]に言[い]いました。『もしかすると、その女[おんな]はわたしとともに来[こ]ないかもしれません』と。"
  40: "すると主人はわたしに言いました。『わたしがその御前[おんまえ]に仕[つか]えてきた主[しゅ]が、ご自分[じぶん]の天使[てんし]をあなたとともに遣[つか]わし、あなたの道[みち]を整[ととの]えてくださる。あなたはわたしの部族[ぶぞく]とわたしの父[ちち]の家[いえ]から、わたしの子[こ]に妻[つま]を迎える。"
  41: "そのとき、あなたはわたしの呪[のろ]いから免[まぬか]れる。わたしの部族のもとへ行[い]って、彼らがあなたに与[あた]えないなら、あなたはわたしの誓[ちか]いからも免れる』。"
  42: "今日[きょう]、わたしは泉[いずみ]に来[き]て、こう言[い]いました。『わたしの主人[しゅじん]アブラハムの神[かみ]である主[しゅ]よ、もしあなたが、わたしが今[いま]進[すす]もうとしている道[みち]を整[ととの]えてくださるなら、"
  43: "見[み]よ、わたしは水[みず]の泉のそばに立[た]っています。この町[まち]の人々[ひとびと]の娘[むすめ]たちが水を汲[く]みに出て来るでしょう。わたしが『あなたの水がめから、少[すこ]し水を飲ませてください』と言[い]う娘がいて、"
  44: "その娘が『あなたもお飲[の]みなさい。ラクダにも水を汲んであげます』と言[い]うなら、その女[おんな]こそ、主[しゅ]がご自分[じぶん]のしもべイサクのために備[そな]えられた方[かた]です。このことで、あなたがわたしの主人[しゅじん]アブラハムに慈[いつく]しみを施[ほどこ]されたことを知[し]ります』。"
  45: "わたしが心[こころ]の中でまだ語り終えないうちに、すぐにリベカが、水がめを肩[かた]に載[の]せて出[で]て来[き]て、泉へ下り、水を汲みました。わたしは彼女[かのじょ]に『水を飲ませてください』と言[い]いました。"
  46: "彼女は急[いそ]いで水がめを自分[じぶん]のところから下[お]ろし、『お飲みなさい。ラクダにも飲ませます』と言[い]いました。わたしは飲み、彼女はわたしのラクダにも飲ませました。"
  47: "わたしが彼女[かのじょ]に『あなたはどなたの娘[むすめ]ですか』と尋[たず]ねると、彼女は『わたしは、ミルカがナホルに産[う]んだ、その子[こ]ベトエルの娘です』と言[い]いました。そこでわたしは彼女の手[て]に耳輪[みみわ]と腕輪[うでわ]を着[つ]けました。"
  48: "わたしは身[み]をかがめて主[しゅ]を拝[おが]み、わたしの主人[しゅじん]アブラハムの神である主をほめたたえました。主は真実[しんじつ]の道[みち]をもってわたしを導[みちび]き、主人の兄弟[きょうだい]の娘[むすめ]を、その子[こ]のために迎[むか]えさせてくださったのです。"
  49: "ですから、もしあなたがたがわたしの主人[しゅじん]に慈[いつく]しみと義[ぎ]を行[おこな]おうとされるなら、わたしに告[つ]げてください。そうでないなら、そのことも告げてください。わたしは右[みぎ]へ行[い]くか、左[ひだり]へ行くかを決[き]めます。」"
  50: "ラバンとベトエルは答[こた]えて言った。「この事[こと]は主[しゅ]から出[で]たものです。わたしたちは、あなたに良[よ]いことに悪[わる]いことを言[い]うことはできません。"
  51: "見[み]なさい、リベカはあなたの前[まえ]にいます。連[つ]れて行[い]きなさい。主[しゅ]が語[かた]られたとおり、彼女[かのじょ]をあなたの主人[しゅじん]の子[こ]の妻[つま]としなさい。」"
  52: "アブラハムのしもべはこれらの言葉[ことば]を聞[き]くと、地[ち]に伏[ふ]して主[しゅ]を拝[おが]んだ。"
  53: "しもべは銀[ぎん]の器[うつわ]と金[きん]の器、衣[ころも]を取[と]り出[だ]してリベカに与[あた]え、またその兄弟[きょうだい]と母[はは]にも贈[おく]り物[もの]を与えた。"
  54: "彼と同行[どうこう]の者[もの]たちは食[た]べ、飲[の]み、そこに宿[やど]った。朝[あさ]早[はや]く起[お]きると、彼は言った。「わたしを帰[かえ]してください。主人[しゅじん]のもとへ帰ります。」"
  55: "しかし、彼女[かのじょ]の兄弟[きょうだい]たちと母[はは]は言った。「この娘[むすめ]を十日[とおか]ほどわたしたちのもとに泊[と]まらせてください。それから出[で]かけさせます。」"
  56: "彼は言った。「わたしを引[ひ]き止[と]めないでください。主[しゅ]がわたしの道[みち]を整[ととの]えてくださったのですから。帰[かえ]してください。主人[しゅじん]のもとへ帰ります。」"
  57: "彼らは言った。「娘[むすめ]を呼[よ]んで、その口[くち]から聞[き]いてみましょう。」"
  58: "彼らはリベカを呼[よ]んで言った。「この人[ひと]とともに行[い]きますか。」彼女は言った。「行[い]きます。」"
  59: "彼らは妹[いもうと]リベカとその持[も]ち物[もの]、アブラハムのしもべとその同行[どうこう]の者[もの]たちを送[おく]り出[だ]した。"
  60: "そして妹リベカを祝福[しゅくふく]して言った。「あなたはわたしたちの妹[いもうと]である。幾千[いくせん]万[まん]となれ。あなたの子孫[ししそん]が敵[てき]の町々[まちまち]を嗣業[しいぎょう]として受[う]け継[つ]ぐように。」"
  61: "リベカとその侍女[じじょ]たちは起[お]き上[あ]がってラクダに乗[の]り、その人[ひと]とともに出[で]かけた。しもべはリベカを連[つ]れて旅立[たびだ]った。"
  62: "イサクは荒野[こうや]を通[とお]って、幻[まぼろし]の井戸[いど]のそばへ向[む]かっていた。彼は南[みなみ]の地[ち]に住[す]んでいた。"
  63: "夕方[ゆうがた]になると、イサクは野[の]へ出[で]て、思[おも]いをめぐらせていた。目[め]を上[あ]げると、ラクダが来[く]るのが見[み]えた。"
  64: "リベカも目[め]を上[あ]げてイサクを見[み]ると、ラクダから飛[と]び下[お]りた。"
  65: "そしてしもべに言った。「野[の]をこちらへ歩[ある]いて来[く]るあの人[ひと]は誰[だれ]ですか。」しもべは言った。「あの方がわたしの主人[しゅじん]です。」そこで彼女はベールを手[て]に取[と]って身[み]にまとった。"
  66: "しもべは、自分[じぶん]がしたことをすべてイサクに語[かた]った。"
  67: "イサクは母[はは]の家[いえ]に入[はい]り、リベカを娶[めと]った。彼女はイサクの妻[つま]となり、イサクは彼女を愛[あい]した。こうしてイサクは、母サラのことで慰[なぐさ]められた。"

notes:
  1: "Καὶ Αβρααμ ἦν πρεσβύτερος προβεβηκὼς ἡμερῶν — アブラハムは年老いて、日が進んでいた (προβεβηκώς — «продвинувшийся»; слав. «заматеревший во днех»; Син. «в летах преклонных»). κύριος εὐλόγησεν τὸν Αβρααμ κατὰ πάντα — 主はすべてのことにおいて…祝福されていた (κατὰ πάντα — «во всём»; имперфект: благословение длилось)."
  2: "τῷ παιδὶ αὐτοῦ τῷ πρεσβυτέρῳ τῆς οἰκίας αὐτοῦ — 家の最も年をとったしもべ (παῖς — «слуга, отрок», не «сын»). τῷ ἄρχοντι πάντων τῶν αὐτοῦ — すべてのものを持ち配している者 (ἄρχων — «начальствующий»; слав. «обладающему всеми его»). Θὲς τὴν χεῖρά σου ὑπὸ τὸν μηρόν μου — あなたの手をわたしの腿の下に置け: жест клятвы передан прямо, без замены (腿[もも]; слав. «под стегно мое»)."
  3: "ἐξορκιῶ σε κύριον τὸν θεόν… — 主によってあなたに誓わせる (ἐξορκίζω — «заклинаю»; при глаголе два винительных: тебя и Господом). ἵνα μὴ λάβῃς γυναῖκα τῷ υἱῷ μου — 妻を迎えるのに…取ってはならない (λαμβάνω γυναῖκα — «брать жену»). μεθ᾽ ὧν ἐγὼ οἰκῶ ἐν αὐτοῖς — わたしがその中に住んでいる (LXX: относительное местоимение + повторное ἐν αὐτοῖς; повтор сохранён, не сглажен)."
  4: "εἰς τὴν γῆν μου, οὗ ἐγενόμην — わたしの生まれた地 (οὗ — «где»). εἰς τὴν φυλήν μου — わたしの部族のもとへ (φυλή — «племя, колено»). πορεύσῃ… λήμψῃ — будущее в значении повеления: 行け…迎えよ."
  5: "ὁ παῖς — しもべ. Μήποτε οὐ βούλεται… — もしかすると…来たくないかもしれません (μήποτε — опасение). ἀποστρέψω τὸν υἱόν σου…; — 帰すのでしょうか (вопросительное будущее; слав. «возвращу ли»)."
  6: "Πρόσεχε σεαυτῷ — 自分に気をつけよ (букв. «внемли себе»; слав. так же). μὴ ἀποστρέψῃς — не возвращай (запрет с аористом)."
  7: "κύριος ὁ θεὸς τοῦ οὐρανοῦ καὶ ὁ θεὸς τῆς γῆς — 天の神、地の神である主 (в LXX «Бог неба и Бог земли»; далее ὅς — определение). ἔλαβέν με ἐκ τοῦ οἴκου τοῦ πατρός μου — 父の家から連れ出し. ὤμοσέν μοι λέγων — 誓って『…』と言われた: слова Бога внутри речи Авраама — вложенные кавычки 『…』. Σοὶ δώσω… καὶ τῷ σπέρματί σου — あなたに…あなたの子孫にも (σπέρμα ед. ч. — «семя»). αὐτὸς ἀποστελεῖ τὸν ἄγγελον — その方が…天使をお遣わしになる (αὐτός — «он сам», эмфаза)."
  8: "καθαρὸς ἔσῃ ἀπὸ τοῦ ὅρκου τούτου — この誓いから免れる (καθαρός — «чист»; слав. «чист будеши от заклятия»). μόνον… μὴ ἀποστρέψῃς — ただ…帰してはならない."
  9: "ἔθηκεν… τὴν χεῖρα ὑπὸ τὸν μηρὸν Αβρααμ — 腿の下に手を置き (жест повторён, как в ст. 2). ὤμοσεν αὐτῷ περὶ τοῦ ῥήματος τούτου — この事について誓った (ῥῆμα — «слово, дело»)."
  10: "δέκα καμήλους ἀπὸ τῶν καμήλων — 十頭のラクダ (ἀπό — «из»). ἀπὸ πάντων τῶν ἀγαθῶν — すべての良い物. εἰς τὴν Μεσοποταμίαν εἰς τὴν πόλιν Ναχωρ — メソポタミアへ、ナホルの町へ."
  11: "ἐκοίμισεν τὰς καμήλους — ラクダを休ませた (κοιμίζω — «укладывать»). παρὰ τὸ φρέαρ τοῦ ὕδατος — 水の井戸のそば (φρέαρ — 井戸, πηγή — 泉: в гл. 24 различаются). τὸ πρὸς ὀψέ — 夕べに (букв. «к вечеру»). αἱ ὑδρευόμεναι — 水を汲む女たち."
  12: "Κύριε ὁ θεὸς τοῦ κυρίου μου Αβρααμ — わたしの主人アブラハムの神である主よ (обращение). εὐόδωσον ἐναντίον ἐμοῦ σήμερον — 今日、わたしの前で道を整えてください (εὐοδόω — «давать успех»; слав. «благоустрой»). ποίησον ἔλεος — 慈しみを施してください."
  13: "ἕστηκα ἐπὶ τῆς πηγῆς — 泉のそばに立っている (πηγή — 泉, не φρέαρ). αἱ θυγατέρες τῶν οἰκούντων τὴν πόλιν — この町に住む者たちの娘たち. ἐκπορεύονται ἀντλῆσαι ὕδωρ — 水を汲みに出て来る (ἀντλέω — «черпать»)."
  14: "ᾗ ἂν ἐγὼ εἴπω — わたしが…と言う娘 (ᾗ ἄν — «какой бы»). Ἐπίκλινον τὴν ὑδρίαν σου — 水がめを傾けて (ὑδρία — 水がめ). Слова слуги вложены в молитву — 『…』. ἕως ἂν παύσωνται πίνουσαι — ラクダが飲み終わるまで. ταύτην ἡτοίμασας — その娘こそ、あなたが…備えられた方 (ἑτοιμάζω — «готовить»)."
  15: "πρὸ τοῦ συντελέσαι αὐτὸν λαλοῦντα ἐν τῇ διανοίᾳ — 心の中でまだ語り終えないうちに (ἐν τῇ διανοίᾳ — «в уме»; слав. «во уме своем»). ἡ τεχθεῖσα Βαθουηλ… — ベトエルに産まれた娘 (LXX: «рожденная Вафуилу» — дательный при τεχθεῖσα). ἔχουσα τὴν ὑδρίαν ἐπὶ τῶν ὤμων — 水がめを肩に載せて."
  16: "καλὴ τῇ ὄψει σφόδρα — 見た目が非常に美しく. παρθένος ἦν, ἀνὴρ οὐκ ἔγνω αὐτήν — 処女であって、まだ男を知らなかった (повтор сохранён). καταβᾶσα… ἀνέβη — 下り…上って来た (источник в низине)."
  17: "ἐπέδραμεν… εἰς συνάντησιν αὐτῆς — 彼女に会おうと走り寄り (ἐπιτρέχω). Πότισόν με μικρὸν ὕδωρ — 少し水を飲ませてください (ποτίζω — «поить»)."
  18: "Πίε, κύριε — お飲みください、ご主人さま (κύριε — вежливое обращение к господину, не «Господи»). καθεῖλεν τὴν ὑδρίαν ἐπὶ τὸν βραχίονα — 水がめを腕に下ろし."
  19: "ἕως ἐπαύσατο πίνων — 彼が飲み終わるまで (в LXX этот оборот открывает ст. 19, а не закрывает ст. 18; граница стихов сохранена). ὑδρεύσομαι — 水を汲んでやります. ἕως ἂν πᾶσαι πίωσιν — みな飲み終わるまで."
  20: "ἐξεκένωσεν τὴν ὑδρίαν εἰς τὸ ποτιστήριον — 水がめを水おけに空け (ποτιστήριον — «поило, корыто»). ἔδραμεν ἔτι ἐπὶ τὸ φρέαρ ἀντλῆσαι — さらに井戸へ走って水を汲み. ὑδρεύσατο πάσαις ταῖς καμήλοις — すべてのラクダに水を汲んでやった."
  21: "κατεμάνθανεν αὐτὴν καὶ παρεσιώπα — 黙って彼女を見つめ (καταμανθάνω — «внимательно рассматривать»; παρασιωπάω — «молчать»). εἰ εὐόδωκεν κύριος τὴν ὁδὸν αὐτοῦ ἢ οὔ — 主が自分の道を整えてくださったのか、そうでないのか."
  22: "ἐνώτια χρυσᾶ ἀνὰ δραχμὴν ὁλκῆς — 重さ一ドラクマの金の耳輪 (ἀνά — «по»; δραχμή — греческая монета и мера веса). δύο ψέλια ἐπὶ τὰς χεῖρας αὐτῆς — 腕輪二つ (ψέλιον — «запястье»). δέκα χρυσῶν ὁλκὴ αὐτῶν — 重さ十ドラクマ (χρυσοῖ — «золотые», т. е. драхмы золотом; Син. «десять сиклей»)."
  23: "Θυγάτηρ τίνος εἶ; — どなたの娘ですか. ἀνάγγειλόν μοι — 教えてください. τόπος ἡμῖν καταλῦσαι — 泊まる所 (καταλύω — «останавливаться на ночлег»)."
  24: "Θυγάτηρ Βαθουηλ… τοῦ Μελχας, ὃν ἔτεκεν τῷ Ναχωρ — ミルカがナホルに産んだベトエルの娘 (LXX: «сына Мелхи»; Μελχας — род. падеж от Μελχα, ж. р.; слав. «сына мелхина»)."
  25: "ἄχυρα καὶ χορτάσματα — わらも飼い葉も (ἄχυρα — «солома»; χορτάσματα — «корм, трава»). τόπος τοῦ καταλῦσαι — 泊まる所."
  26: "εὐδοκήσας… προσεκύνησεν κυρίῳ — 身をかがめて主を拝んだ (εὐδοκέω здесь — «склониться, изъявить волю»; слав. «благословив… поклонися»)."
  27: "Εὐλογητὸς κύριος — 主はほめたたえられますように (славословие, не «благословенный»). οὐκ ἐγκατέλιπεν τὴν δικαιοσύνην αὐτοῦ καὶ τὴν ἀλήθειαν ἀπὸ τοῦ κυρίου μου — 主人へのご自分の義と真実を取られなかった (δικαιοσύνη — «правда, верность»; ἀπό — «по отношению к»; Син. «милостью… и истиною»). ἐμὲ εὐόδωκεν κύριος εἰς οἶκον — 主はわたしを…家へ導かれた."
  28: "δραμοῦσα ἡ παῖς — 娘は走って (ἡ παῖς — «девица, служанка»). εἰς τὸν οἶκον τῆς μητρὸς αὐτῆς — 母の家へ (дом матери, ср. 24:67)."
  29: "ᾧ ὄνομα Λαβαν — 名をラバンといった. ἔδραμεν… ἔξω ἐπὶ τὴν πηγήν — 外の泉のところへ走って行った (πηγή — 泉)."
  30: "ἡνίκα εἶδεν… καὶ ὅτε ἤκουσεν — 見…聞くと (два временных оборота, как в LXX). λεγούσης Οὕτως λελάληκέν μοι ὁ ἄνθρωπος — 「あの人はわたしにこう言いました」と言うのを (речь Ревекки — первый уровень кавычек, она не внутри другой речи). ἑστηκότος αὐτοῦ ἐπὶ τῶν καμήλων — ラクダのそばに立っていた (букв. «стоящего при верблюдах»)."
  31: "Δεῦρο εἴσελθε — さあ、入ってください. εὐλογητὸς κύριος — 主はほめたたえられますように (в LXX — славословие; слав. и Син. читают иначе: «благословенный Господом», обращение к слуге, — масоретское чтение; в 〔…〕 не берём). ἵνα τί ἕστηκας ἔξω; — なぜ外に立っているのか. ἡτοίμακα τὴν οἰκίαν — 家を用意しておきました."
  32: "ἀπέσαξεν τὰς καμήλους — ラクダの鞍をはずした (ἀποσάττω — «развьючивать»; в LXX подлежащее — вошедший человек; Син. приписывает действие Лавану). ἔδωκεν ἄχυρα καὶ χορτάσματα — わらと飼い葉を与え. ὕδωρ νίψασθαι τοῖς ποσίν — 足を洗う水."
  33: "παρέθηκεν αὐτοῖς ἄρτους φαγεῖν — パンが彼らの前に供えられた (παρατίθημι — «ставить перед»; подлежащее опущено — хозяева). Οὐ μὴ φάγω ἕως τοῦ λαλῆσαί με τὰ ῥήματά μου — 自分の用件を話し終えるまでは食べません (οὐ μή с аористом — сильное отрицание). Λάλησον — 話してください."
  34: "Παῖς Αβρααμ ἐγώ εἰμι — わたしはアブラハムのしもべです (без глагола-связки, как в греч.)."
  35: "ὑψώθη — 高くされました (ὑψόω — «возвышать»; слав. «возвысися»). πρόβατα καὶ μόσχους — 羊と牛 (μόσχος — «телец»). παῖδας καὶ παιδίσκας — 男の奴隷と女の奴隷 (παῖς/παιδίσκη — «раб, рабыня»)."
  36: "υἱὸν ἕνα — 一人の男の子 (εἷς — «один, единственный»). μετὰ τὸ γηρᾶσαι αὐτόν — 主人が年老いてから. ὅσα ἦν αὐτῷ — 自分のすべてのもの."
  37: "ὥρκισέν με… λέγων — 誓わせて、こう言いました: речь Авраама внутри речи слуги — 『…』. ἐν οἷς ἐγὼ παροικῶ ἐν τῇ γῇ αὐτῶν — わたしがその地に寄留している (παροικέω — «жить пришельцем»; повтор ἐν, как в LXX)."
  38: "ἀλλ᾽ ἢ — ただ…だけ (ἀλλ᾽ ἤ — «но только»). εἰς τὸν οἶκον τοῦ πατρός μου… εἰς τὴν φυλήν μου — 父の家へ、わたしの部族のもとへ."
  39: "εἶπα δὲ τῷ κυρίῳ μου — わたしは主人に言いました (εἶπα — аорист 1 л.). Μήποτε οὐ πορεύσεται — もしかすると…来ないかもしれません."
  40: "Κύριος, ᾧ εὐηρέστησα ἐναντίον αὐτοῦ — わたしがその御前に仕えてきた主 (εὐαρεστέω — «быть угодным»; Син. «пред лицем Которого я хожу»). αὐτὸς ἀποστελεῖ — ご自分の天使を…遣わし. εὐοδώσει τὴν ὁδόν σου — あなたの道を整えてくださる."
  41: "ἀθῷος ἔσῃ ἀπὸ τῆς ἀρᾶς μου — わたしへの呪いから免れる (ἀθῷος — «невиновный, свободный»; ἀρά — «проклятие»). ἡνίκα γὰρ ἐὰν ἔλθῃς… καὶ μή σοι δῶσιν — 部族のもとへ行って、彼らが与えないなら. ἀπὸ τοῦ ὁρκισμοῦ μου — わたしの誓いからも (ὁρκισμός — «заклятие»)."
  42: "ἐλθὼν σήμερον ἐπὶ τὴν πηγήν — 今日、泉に来て. εἰ σὺ εὐοδοῖς τὴν ὁδόν μου, ἣν νῦν ἐγὼ πορεύομαι ἐπ᾽ αὐτήν — もしあなたが、わたしが今進もうとしている道を整えてくださるなら (относительное с повтором ἐπ᾽ αὐτήν; условная конструкция не закончена — продолжение в ст. 43–44)."
  43: "ἐφέστηκα ἐπὶ τῆς πηγῆς τοῦ ὕδατος — 水の泉のそばに立っています. αἱ θυγατέρες τῶν ἀνθρώπων τῆς πόλεως — この町の人々の娘たち (ἄνθρωποι — «люди»). ἐξελεύσονται ὑδρεύσασθαι — 水を汲みに出て来るでしょう."
  44: "αὕτη ἡ γυνή, ἣν ἡτοίμασεν κύριος τῷ ἑαυτοῦ θεράποντι Ισαακ — その女こそ、主がご自分のしもべイサクのために備えられた方 (θεράπων — «слуга, раб»; в ст. 14 было παῖς). πεποίηκας ἔλεος — 慈しみを施された (perfect)."
  45: "πρὸ τοῦ συντελέσαι με λαλοῦντα ἐν τῇ διανοίᾳ — 心の中でまだ語り終えないうちに. εὐθύς — すぐに (слав. «абие»). ἔχουσα τὴν ὑδρίαν ἐπὶ τῶν ὤμων — 水がめを肩に載せて. κατέβη… καὶ ὑδρεύσατο — 泉へ下り、水を汲みました."
  46: "σπεύσασα καθεῖλεν τὴν ὑδρίαν ἀφ᾽ ἑαυτῆς — 急いで水がめを自分のところから下ろし (ἀφ᾽ ἑαυτῆς — «с себя»). Πίε σύ — お飲みなさい (σύ — эмфаза). ἔπιον — аорист 1 л. ед. ч.: «я пил» (не «они пили»)."
  47: "Τίνος εἶ θυγάτηρ; — どなたの娘ですか. Θυγάτηρ Βαθουηλ εἰμὶ τοῦ υἱοῦ Ναχωρ, ὃν ἔτεκεν αὐτῷ Μελχα — ミルカがナホルに産んだ、その子ベトエルの娘 (в ст. 24 — «рожденная Вафуилу», здесь «сын Нахора»). περιέθηκα αὐτῇ τὰ ἐνώτια — 耳輪と腕輪を着けました (περιτίθημι — «надевать»)."
  48: "εὐδοκήσας προσεκύνησα — 身をかがめて拝み. ἐν ὁδῷ ἀληθείας — 真実の道をもって (букв. «в пути истины»). λαβεῖν τὴν θυγατέρα τοῦ ἀδελφοῦ — 兄弟の娘を…迎えさせてくださった."
  49: "ποιεῖτε… ἔλεος καὶ δικαιοσύνην — 慈しみと義を行う (два слова, как в LXX). ἵνα ἐπιστρέψω εἰς δεξιὰν ἢ εἰς ἀριστεράν — 右へ行くか、左へ行くかを決めます (букв. «обратиться направо или налево»; слав. «на десно, или на лево»)."
  50: "Παρὰ κυρίου ἐξῆλθεν τὸ πρόσταγμα τοῦτο — この事は主から出た (πρόσταγμα — «повеление, определение»). οὐ δυνησόμεθα… ἀντειπεῖν κακὸν καλῷ — 良いことに悪いことを言うことはできません (LXX: «κακὸν καλῷ» — «зло добру»; слав. «зло или благо» — масоретское чтение, в скобки не берём)."
  51: "ἰδοὺ Ρεβεκκα ἐνώπιόν σου — 見なさい、リベカはあなたの前にいます. λαβὼν ἀπότρεχε — 連れて行きなさい (букв. «взяв, уходи»; слав. «поемь ю, иди»). καθὰ ἐλάλησεν κύριος — 主が語られたとおり."
  52: "ἐν τῷ ἀκοῦσαι… τῶν ῥημάτων τούτων — これらの言葉を聞くと. προσεκύνησεν ἐπὶ τὴν γῆν — 地に伏して拝んだ (ἐπὶ τὴν γῆν — «до земли»)."
  53: "σκεύη ἀργυρᾶ καὶ χρυσᾶ — 銀の器と金の器 (σκεῦος — «сосуд, вещь»). ἱματισμός — 衣. δῶρα — 贈り物 (брату и матери, не отцу — как в LXX)."
  54: "ἔφαγον καὶ ἔπιον… καὶ ἐκοιμήθησαν — 食べ、飲み、宿った (κοιμάομαι — «ложиться спать»). ἀναστὰς πρωΐ — 朝早く起きると. Ἐκπέμψατέ με — わたしを帰してください (ἐκπέμπω — «отпускать»)."
  55: "Μεινάτω ἡ παρθένος μεθ᾽ ἡμῶν ἡμέρας ὡσεὶ δέκα — 十日ほどわたしたちのもとに泊まらせてください (ἡμέρας ὡσεὶ δέκα — «дней около десяти»)."
  56: "Μὴ κατέχετέ με — 引き止めないでください (κατέχω — «удерживать»). καὶ κύριος εὐόδωσεν — 主が…整えてくださったのですから (καί — «ибо, ведь»)."
  57: "Καλέσωμεν τὴν παῖδα — 娘を呼んで (παῖς — «девица»). ἐρωτήσωμεν τὸ στόμα αὐτῆς — その口から聞いてみましょう (букв. «спросим уста её»; слав. «вопросим ея изоуст»)."
  58: "Πορεύσῃ μετὰ τοῦ ἀνθρώπου τούτου; — この人とともに行きますか. Πορεύσομαι — 行きます (будущее в значении согласия)."
  59: "ἐξέπεμψαν… καὶ τὰ ὑπάρχοντα αὐτῆς — 送り出した…その持ち物 (ὑπάρχοντα — «имущество»; Син. добавляет «кормилицу ее» — масоретское чтение, в скобки не берём)."
  60: "γίνου εἰς χιλιάδας μυριάδων — 幾千万となれ (χιλιάς — «тысяча», μυριάς — «десяток тысяч»; слав. «буди в тысящы тем»). κληρονομησάτω τὸ σπέρμα σου τὰς πόλεις τῶν ὑπεναντίων — あなたの子孫が敵の町々を嗣業として受け継ぐように (κληρονομέω — 嗣業[しいぎょう]; ὑπεναντίοι — «противники»)."
  61: "αἱ ἅβραι αὐτῆς — その侍女たち (ἅβρα — «служанка, рабыня»). ἀναλαβὼν ὁ παῖς τὴν Ρεβεκκαν ἀπῆλθεν — しもべはリベカを連れて旅立った."
  62: "διὰ τῆς ἐρήμου κατὰ τὸ φρέαρ τῆς ὁράσεως — 荒野を通って、幻の井戸のそばへ (φρέαρ τῆς ὁράσεως — «колодец видения», евр. Беэр-лахай-рои; Син. оставляет имя). γῇ τῇ πρὸς λίβα — 南の地 (λίψ — «юг»; слав. «на полудне»)."
  63: "ἀδολεσχῆσαι εἰς τὸ πεδίον τὸ πρὸς δείλης — 野へ出て、思いをめぐらせていた (ἀδολεσχέω — «беседовать, размышлять»; слав. «поглумитися» — иное понимание; Син. «поразмыслить»). ἀναβλέψας τοῖς ὀφθαλμοῖς — 目を上げて."
  64: "κατεπήδησεν ἀπὸ τῆς καμήλου — ラクダから飛び下りた (καταπηδάω)."
  65: "Τίς ἐστιν ὁ ἄνθρωπος ἐκεῖνος…; — あの人は誰ですか. Οὗτός ἐστιν ὁ κύριός μου — あの方がわたしの主人です. τὸ θέριστρον περιεβάλετο — ベールを取って身にまとった (θέριστρον — «летнее покрывало»; слав. «ризу летнюю»)."
  66: "διηγήσατο… πάντα τὰ ῥήματα, ἃ ἐποίησεν — 自分がしたことをすべて語った (ῥήματα — «дела, слова»)."
  67: "εἰσῆλθεν… εἰς τὸν οἶκον τῆς μητρὸς αὐτοῦ — 母の家に入り (в LXX — οἶκος; слав. и Син. «в шатер»). ἐγένετο αὐτοῦ γυνή — 妻となった. παρεκλήθη… περὶ Σαρρας — 母サラのことで慰められた (παρακαλέω — «утешать»; περί — «о, из-за»)."
