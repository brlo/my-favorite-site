verses:
  1: "そのとき、主[しゅ]はわたしに言[い]われた。「行[い]って、粘土[ねんど]で作[つく]られた水[みず]がめを買[か]い、民[たみ]の長老[ちょうろう]たちと祭司[さいし]たちの長老[ちょうろう]たちを連[つ]れて来[き]なさい。"
  2: "エンノムの子[こ]らの墓所[ぼしょ]、すなわちハルシトの門[もん]の入口[いりぐち]の前[まえ]にある所[ところ]へ出[で]て行[い]き、わたしがあなたに語[かた]るすべての言葉[ことば]を、そこで宣[の]べ伝[つた]えなさい。"
  3: "そして言[い]いなさい。『主[しゅ]の言葉[ことば]を聞[き]け。ユダの王[おう]たち、ユダの人[ひと]々[びと]、エルサレムの住民[じゅうみん]、この門[もん]から入[はい]る者[もの]たちよ。万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。見[み]よ、わたしはこの場所[ばしょ]に災[わざわ]いを下[くだ]す。それを聞[き]く者[もの]は、その両[りょう]の耳[みみ]が鳴[な]るほどである。"
  4: "彼らがわたしを捨[す]て、この場所[ばしょ]をほかのものとし、ここで他[ほか]の神[かみ]々[がみ]に香[こう]をたき、それらを彼[かれ]らもその父[ちち]たちも知[し]らなかったからである。また、ユダの王[おう]たちはこの場所[ばしょ]を罪[つみ]なき者[もの]の血[ち]で満[み]たした。"
  5: "また、バアルに高[たか]い所[ところ]を建[た]て、自分[じぶん]の息子[むすこ]たちを火[ひ]で焼[や]いてバアルへの燔祭[はんさい]とした。それはわたしが命[めい]じたことも、語[かた]ったこともなく、わたしの心[こころ]に上[のぼ]ったこともない。"
  6: "それゆえ、見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。この場所[ばしょ]はもはや『崩[くず]れ落[お]ちる所[ところ]』とも『エンノムの子[こ]らの墓所[ぼしょ]』とも呼[よ]ばれず、『屠[ほふ]られた者[もの]の墓所[ぼしょ]』と呼ばれる。"
  7: "わたしはこの場所[ばしょ]でユダの計[はかり]ごととエルサレムの計ごとを散[ち]らし、彼らをその敵[てき]の前[まえ]、彼らの命[いのち]を求[もと]める者[もの]の手[て]で剣[つるぎ]にかからせ、彼らの死骸[しがい]を天[てん]の鳥[とり]と地[ち]の獣[けもの]のえじきに与[あた]える。"
  8: "わたしはこの都[みやこ]を荒廃[こうはい]とし、口笛[くちぶえ]の的[まと]とする。そこを通[とお]る者[もの]はすべて、そのすべての傷[きず]のゆえに驚[おどろ]き、口笛[くちぶえ]を吹[ふ]く。"
  9: "わたしは彼らに、自分[じぶん]の息子[むすこ]と娘[むすめ]の肉[にく]を食[た]べさせる。おのおの、自分[じぶん]の隣[となり]の者の肉を食[た]べる。包囲[ほうい]と閉[と]じ込[こ]めの中[なか]で、彼らの敵[てき]、彼らの命[いのち]を求[もと]める者[もの]たちが彼らを包囲[ほうい]するときである。』"
  10: "そして、あなたとともに出[で]て行[い]く者[もの]たちの目[め]の前[まえ]で、その水[みず]がめを砕[くだ]きなさい。"
  11: "そして、彼らに言[い]いなさい。『万軍[ばんぐん]の主[しゅ]はこう言[い]われる。わたしはこの民[たみ]とこの都[みやこ]を、もはや癒[いや]すことのできない陶工[とうこう]の器[うつわ]のように砕[くだ]く。彼らはトフェトに葬[ほうむ]られる。ほかに葬る場所[ばしょ]がないからである。』"
  12: "主[しゅ]はこう言[い]われる。わたしはこの場所[ばしょ]とそこに住[す]む者[もの]にこのようにし、この都[みやこ]を、崩[くず]れ落[お]ちる所[ところ]のようにする。"
  13: "エルサレムの家[いえ]々[いえ]とユダの王[おう]たちの家[いえ]々[いえ]は、すべての家[いえ]の屋上[おくじょう]で天[てん]の万軍[ばんぐん]に香[こう]をたき、他[ほか]の神[かみ]々[がみ]に注[そそ]ぎの供[そな]えをしたその汚[けが]れのゆえに、崩[くず]れ落[お]ちる所[ところ]のように汚[けが]れたものとなる。」"
  14: "エレミヤは、主[しゅ]が預言[よげん]させるために彼[かれ]を遣[つか]わした崩[くず]れ落[お]ちる所[ところ]から帰[かえ]り、主[しゅ]の家[いえ]の庭[にわ]に立[た]って、すべての民[たみ]に言[い]った。"
  15: "「万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。見[み]よ、わたしはこの都[みやこ]、そのすべての町[まち]々[まち]、その村[むら]々[むら]に、わたしがこの都について語ったすべての災[わざわ]いを下[くだ]す。彼らが首[くび]を固[かた]くして、わたしの戒[いまし]めに聞[き]き従[したが]わなかったからである。」"

notes:
  1: "Τότε εἶπεν κύριος πρός με — «тогда сказал Господь мне»: вводная формула вне кавычек. Βάδισον καὶ κτῆσαι βῖκον πεπλασμένον ὀστράκινον — «пойди и купи глиняный (из обожжённой глины) кувшин» (βῖκος — кувшин, жбан; ὀστράκινος — глиняный; πλάσσω — лепить): слав. «сосуд скудельничь жжен». ἄξεις ἀπὸ τῶν πρεσβυτέρων τοῦ λαοῦ καὶ ἀπὸ τῶν πρεσβυτέρων τῶν ἱερέων — «возьми (приведи) из старейшин народа и из старейшин священников»; слав. «приведи от старец людских и от старец священнических»."
  2: "ἐξελεύσῃ εἰς τὸ πολυάνδριον υἱῶν τῶν τέκνων αὐτῶν — «выйди в место погребения (кладбище) сынов детей их» (πολυάνδριον — многомогильное место, кладбище); ὅ ἐστιν ἐπὶ τῶν προθύρων πύλης τῆς χαρσιθ — «что при преддверии ворот Харсиф» (πρόθυρον — преддверие); слав. «в место многогробищное сынов енноних, еже есть близ придверия врат харсифских» — csl понял «υἱῶν τῶν τέκνων» как «сынов Енномовых», в тексте エンノムの子ら. Имя ворот — ハルシト (греч. χαρσιθ). ἀνάγνωθι ἐκεῖ πάντας τοὺς λόγους — «прочти (провозгласи) там все слова»."
  3: "Ἀκούσατε τὸν λόγον κυρίου, βασιλεῖς Ιουδα καὶ ἄνδρες Ιουδα καὶ οἱ κατοικοῦντες Ιερουσαλημ — «слушайте слово Господне, цари Иудейские и мужи Иуды и жители Иерусалима». Τάδε λέγει κύριος ὁ θεὸς Ισραηλ — «так говорит Господь Бог Израилев»; слав. добавляет «сил» (Σαβαωθ) — в LXX нет, внесено (万軍の主). ἐπάγω ἐπὶ τὸν τόπον τοῦτον κακά — «наведу на место сие злое»; ὥστε παντὸς ἀκούοντος αὐτὰ ἠχήσει ἀμφότερα τὰ ὦτα αὐτοῦ — «так что у всякого слышащего о них зазвучит в обоих ушах его» (ἠχέω — звучать) — слав. «зазвучит во ушию его»."
  4: "ἀνθ᾽ ὧν ἐγκατέλιπόν με — «за то, что оставили Меня»; ἀπηλλοτρίωσαν τὸν τόπον τοῦτον — «сделали чужим место сие» (ἀπαλλοτριόω); ἐθυμίασαν ἐν αὐτῷ θεοῖς ἀλλοτρίοις — «кадили в нём богам иным»; οἷς οὐκ ᾔδεισαν αὐτοὶ καὶ οἱ πατέρες αὐτῶν — «которых не знали ни они, ни отцы их»; οἱ βασιλεῖς Ιουδα ἔπλησαν τὸν τόπον τοῦτον αἱμάτων ἀθῴων — «цари Иудейские наполнили место сие кровью неповинных» (ἀθῷος — невинный). У ru (МТ) «ни цари Иудейские» отнесено к «не знали», а «наполнили» — к народу; держим LXX/csl."
  5: "ᾠκοδόμησαν ὑψηλὰ τῇ Βααλ — «построили высоты Ваалу» (ὑψηλά — высоты, 高き所); τοῦ κατακαίειν τοὺς υἱοὺς αὐτῶν ἐν πυρί — «чтобы сожигать сыновей своих огнём»; ἃ οὐκ ἐνετειλάμην οὐδὲ ἐλάλησα οὐδὲ διενοήθην ἐν τῇ καρδίᾳ μου — «чего Я не повелевал, не говорил и не помышлял в сердце Моём». Слав. добавляет «во всесожжение ваалу» (повтор) — в LXX нет; внесено без 〔…〕 (バアルへの燔祭)."
  6: "Διὰ τοῦτο ἰδοὺ ἡμέραι ἔρχονται — «посему вот, приходят дни»; οὐ κληθήσεται τῷ τόπῳ τούτῳ ἔτι Διάπτωσις καὶ Πολυάνδριον υἱοῦ Εννομ — «не назовётся место сие более „Падение“ и „Место погребения сына Еннома“»: LXX переводит евр. имя Тофет (תֹּפֶת) как διάπτωσις (падение, обвал); слав. так же — «падение и место многогробищное сынов енноних». Поэтому в тексте перевод (崩れ落ちる所, 墓所), а не имя; имя トフェト — в notes и в 19:11, где оно есть у слав. ἀλλ᾽ ἢ Πολυάνδριον τῆς σφαγῆς — «но „Место погребения заклания“» (σφαγή — заклание, 屠り)."
  7: "σφάξω τὴν βουλὴν Ιουδα καὶ τὴν βουλὴν Ιερουσαλημ — «заколю совет Иуды и совет Иерусалима» (σφάζω — закалывать); слав. читает «расточу совет» (по МТ) — держим csl, вариант LXX в notes. καταβαλῶ αὐτοὺς ἐν μαχαίρᾳ ἐναντίον τῶν ἐχθρῶν αὐτῶν — «повергну их мечом пред врагами их»; ἐν χερσὶν τῶν ζητούντων τὰς ψυχὰς αὐτῶν — «в руки ищущих души их»; δώσω τοὺς νεκροὺς αὐτῶν εἰς βρῶσιν — «отдам трупы их в пищу». Слав. «и расточу совет… и превращу их мечем… и дам трупие их в ядь птицам небесным и зверем земным»."
  8: "τάξω τὴν πόλιν ταύτην εἰς ἀφανισμὸν καὶ εἰς συριγμόν — «поставлю город сей в опустошение и в посвист» (συριγμός — свист, 口笛); πᾶς ὁ παραπορευόμενος ἐπ᾽ αὐτῆς σκυθρωπάσει — «всякий проходящий по нему помрачится (станет мрачным)» (σκυθρωπάζω); συριεῖ ὑπὲρ πάσης τῆς πληγῆς αὐτῆς — «посвищет о всякой язве его» (πληγή — язва, удар, 傷)."
  9: "ἔδονται τὰς σάρκας τῶν υἱῶν αὐτῶν — «съедят плоть сыновей своих»; ἕκαστος τὰς σάρκας τοῦ πλησίον αὐτοῦ ἔδονται — «каждый плоть ближнего своего съест»; ἐν τῇ περιοχῇ καὶ ἐν τῇ πολιορκίᾳ — «в осаде и в тесноте» (περιοχή — обложение; πολιορκία — осада); ᾗ πολιορκήσουσιν αὐτοὺς οἱ ἐχθροὶ αὐτῶν — «которой будут осаждать их враги их». Слав. добавляет «ищущии души их» — в LXX нет; внесено (命を求める者たち). Здесь закрывается 『…』 проповеди."
  10: "συντρίψεις τὸν βῖκον κατ᾽ ὀφθαλμοὺς τῶν ἀνδρῶν τῶν ἐκπορευομένων μετὰ σοῦ — «разобьёшь кувшин пред глазами мужей, выходящих с тобою» (συντρίβω — сокрушать). Слав. «И да сокрушиши сосуд пред очима мужей исходящих с тобою». Возврат к повелению; кавычка внешняя (19:1–13) продолжается."
  11: "Οὕτως συντρίψω τὸν λαὸν τοῦτον καὶ τὴν πόλιν ταύτην, καθὼς συντρίβεται ἄγγος ὀστράκινον, ὃ οὐ δυνήσεται ἰαθῆναι ἔτι — «так сокрушу народ сей и город сей, как сокрушается глиняный сосуд, который уже не может быть исцелён»; слав. добавляет «и в тофефе погребутся того ради, яко не будет иного места на погребение» — в LXX этого нет (чтение МТ), внесено без 〔…〕; здесь единственное место главы, где стоит имя トフェト (по csl). Слав. «Господь сил» при gr κύριος — добавка csl, внесена."
  12: "οὕτως ποιήσω… τῷ τόπῳ τούτῳ καὶ τοῖς κατοικοῦσιν ἐν αὐτῷ — «так сделаю… месту сему и живущим в нём»; τοῦ δοθῆναι τὴν πόλιν ταύτην ὡς τὴν διαπίπτουσαν — «чтобы отдан был город сей как падающий (рушащийся)» (διαπίπτω — обваливаться; то же слово, что в 19:6). Слав. «да поставлю град той яко падающь» — в тексте 崩れ落ちる所."
  13: "οἱ οἶκοι Ιερουσαλημ καὶ οἱ οἶκοι βασιλέων Ιουδα ἔσονται καθὼς ὁ τόπος ὁ διαπίπτων — «домы Иерусалима и домы царей Иудейских будут как место падающее»; τῶν ἀκαθαρσιῶν ἐν πάσαις ταῖς οἰκίαις — «от нечистот во всех домах»; ἐθυμίασαν ἐπὶ τῶν δωμάτων αὐτῶν — «кадили на кровлях своих» (δῶμα — кровля, 屋上); πάσῃ τῇ στρατιᾷ τοῦ οὐρανοῦ — «всему воинству небесному»; ἔσπεισαν σπονδὰς θεοῖς ἀλλοτρίοις — «возливали возлияния богам иным» (σπένδω — возливать; σπονδή — возлияние, 注ぎの供え物)."
  14: "ἦλθεν Ιερεμιας ἀπὸ τῆς διαπτώσεως — «пришёл Иеремия от падения» (т. е. от Тофета); οὗ ἀπέστειλεν αὐτὸν κύριος ἐκεῖ τοῦ προφητεῦσαι — «куда послал его Господь пророчествовать»; ἔστη ἐν τῇ αὐλῇ οἴκου κυρίου — «стал во дворе дома Господня» (αὐλή — двор). Повествование вне кавычек; далее речь пророка."
  15: "Τάδε λέγει κύριος — «так говорит Господь»; слав. добавляет «сил, Бог израилев» — в LXX нет, внесено (万軍の主、イスラエルの神). ἐπὶ τὴν πόλιν ταύτην καὶ ἐπὶ πάσας τὰς πόλεις αὐτῆς καὶ ἐπὶ τὰς κώμας αὐτῆς — «на город сей, и на все города его, и на сёла его» (κώμη — село); ἅπαντα τὰ κακά, ἃ ἐλάλησα ἐπ᾽ αὐτήν — «все беды, которые Я изрёк на него»; ὅτι ἐσκλήρυναν τὸν τράχηλον αὐτῶν — «ибо ожесточили шею свою»; τοῦ μὴ εἰσακούειν τῶν λόγων μου — «чтобы не слушать слов Моих»; слав. «заповедий моих» — иное чтение, держим csl (戒め), вариант LXX в notes."
