# jp-box, Иеремия, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31), для главы 19 его
# нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: 1–2 повеление взять глиняный кувшин и идти в место погребения сынов
# Енномовых; 3–9 слово о бедствии, о высотах Ваала и об ужасе города; 10–13 разбиение
# кувшина, гибель города; 14–15 слово во дворе дома Господня.
# Голоса: 19:1–13 — 「…」 (слово Господа к пророку); внутри него 19:3–9 『…』 (то, что
# пророк должен провозгласить) и 19:11 『…』 (второе слово, которое он говорит народу,
# по «и скажи им»); 19:12–13 возвращаются на уровень 「…»; 19:14 — повествование без
# кавычек; 19:15 — 「…」 (слово пророка во дворе храма). Вводная формула 19:1 — вне
# кавычек.
# Нумерация по gr: 15 стихов; слав. и ru — тоже 15. Слав. местами добавляет:
# 19:3 и 19:15 «Господь сил», 19:5 «во всесожжение ваалу», 19:9 «ищущии души их»,
# 19:11 «и в тофефе погребутся…» — внесено без 〔…〕, оговорено в notes.
# «Тофет»: LXX переводит имя места (Διάπτωσις — «падение», Πολυάνδριον — «место
# погребения»), и слав. тоже переводит («падение», «место многогробищное»), поэтому
# в 19:6 и 19:12–14 стоит перевод, а не имя; имя トフェト появляется только в 19:11,
# где оно есть в слав. (в LXX этого оборота нет) — см. notes 6, 11, 14.
# 〔…〕 нет: все 15 стихов есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 陶工, 粘土, 器, 祭壇,
# 高き所, 香, 注ぎの供え物, 万軍 уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, ユダ, イスラエル, エンノム
# (ベン・ヒノム), ハルシト (врата), バアル, トフェト.

