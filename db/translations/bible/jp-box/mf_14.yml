verses:
  1: "そのころ、領主[りょうしゅ]ヘロデはイエスのうわさを聞[き]いて、"
  2: "家来[けらい]たちに告[つ]げた。「あの者[もの]は洗礼者[せんれいしゃ]ヨハネにほかならない。死[し]んだ者[もの]の間[あいだ]からよみがえったのだ。だからこそ、力[ちから]あるわざが彼[かれ]の内[うち]に働[はたら]いている。」"
  3: "実[じつ]は、ヘロデはヨハネを捕[と]らえて縛[しば]り、牢[ろう]に入[い]れていた。自分[じぶん]の兄弟[きょうだい]フィリポの妻[つま]ヘロディアのことであった。"
  4: "ヨハネが、「あの女[おんな]を妻[つま]にすることは、あなたには許[ゆる]されていない」とヘロデに言[い]っていたからである。"
  5: "ヨハネを殺[ころ]したいと願[ねが]いながらも、ヘロデは民[たみ]をはばかった。人々[ひとびと]がヨハネを預言者[よげんしゃ]と見[み]なしていたからである。"
  6: "さて、ヘロデの誕生日[たんじょうび]を祝[いわ]う宴[うたげ]が開[ひら]かれ、ヘロディアの娘[むすめ]が一同[いちどう]の前[まえ]で舞[ま]い踊[おど]り、ヘロデを喜[よろこ]ばせた。"
  7: "そこで、ヘロデは誓[ちか]って、娘[むすめ]が願[ねが]うものは何[なん]でも与[あた]えると約束[やくそく]した。"
  8: "母[はは]にそそのかされるまま、娘[むすめ]は「洗礼者[せんれいしゃ]ヨハネの首[くび]を盆[ぼん]に載[の]せて、ここへお持[も]ちください」と言[い]った。"
  9: "王[おう]は心[こころ]を痛[いた]めたが、自分[じぶん]の誓[ちかい]と同席[どうせき]している客[きゃく]たちの手前[てまえ]、それを与[あた]えるように命[めい]じた。"
  10: "王[おう]は衛兵[えいへい]を遣[つか]わし、牢[ろう]の中[なか]でヨハネを斬首[ざんしゅ]させた。"
  11: "盆[ぼん]に載[の]せた首[くび]が運[はこ]ばれて少女[しょうじょ]に渡[わた]り、少女[しょうじょ]はそれを受[う]け取[と]って母[はは]に届[とど]けた。"
  12: "ヨハネの弟子[でし]たちがやって来[き]て遺体[いたい]を引[ひ]き取[と]り、葬[ほうむ]ったうえで、そのことをイエスに告[つ]げた。"
  13: "その知[し]らせを受[う]けたイエスは、舟[ふね]でそこを離[はな]れ、人[ひと]けのない所[ところ]へひとり退[しりぞ]かれた。だが群衆[ぐんしゅう]はそれと知[し]ると、町々[まちまち]から徒歩[とほ]で後[あと]を追[お]って来[き]た。"
  14: "イエスは舟[ふね]から上[あ]がると、大勢[おおぜい]の群衆[ぐんしゅう]をご覧[らん]になり、彼[かれ]らを深[ふか]く憐[あわ]れみ、その中[なか]の病人[びょうにん]たちを癒[いや]された。"
  15: "日[ひ]が傾[かたむ]いたころ、弟子[でし]たちが近[ちか]くに寄[よ]って来[き]て言[い]った。「ここは人[ひと]けのない所[ところ]ですし、もう時刻[じこく]も遅[おそ]くなりました。この人々[ひとびと]を帰[かえ]してやってください。めいめい、村々[むらむら]へ食[た]べ物[もの]を買[か]いに行[い]けますから。」"
  16: "イエスは言[い]われた。「<j>彼[かれ]らが行[い]くには及[およ]ばない。あなたがたが彼[かれ]らに食[た]べ物[もの]を与[あた]えなさい。</j>」"
  17: "弟子[でし]たちが答[こた]えた。「パンなら五[いつ]つ、魚[さかな]なら二匹[にひき]。このほかには何[なに]もありません。」"
  18: "イエスは言[い]われた。「<j>それをここに持[も]って来[き]なさい。</j>」"
  19: "そして、群衆[ぐんしゅう]に草[くさ]の上[うえ]に座[すわ]るようにお命[めい]じになり、五[いつ]つのパンと二匹[にひき]の魚[さかな]を取[と]って、天[てん]を仰[あお]いで賛美[さんび]の祈[いの]りを唱[とな]え、パンを裂[さ]いて弟子[でし]たちに渡[わた]された。弟子[でし]たちはそれを群衆[ぐんしゅう]に配[くば]った。"
  20: "一同[いちどう]は食[た]べて腹[はら]を満[み]たした。食[た]べ残[のこ]しのパン屑[ぱんくず]を集[あつ]めると、十二[じゅうに]の籠[かご]が満[み]ちた。"
  21: "食[た]べた者[もの]は、女[おんな]や子[こ]どもを除[のぞ]けば、男[おとこ]だけでおよそ五千人[ごせんにん]であった。"
  22: "すぐさま、イエスは弟子[でし]たちを強[し]いて舟[ふね]に乗[の]せ、ご自分[じぶん]より先[さき]に向[む]こう岸[ぎし]へ渡[わた]らせ、ご自分[じぶん]はその間[あいだ]に群衆[ぐんしゅう]を解散[かいさん]させることにされた。"
  23: "群衆[ぐんしゅう]を帰[かえ]したのち、祈[いの]りをささげるため、イエスはただひとり山[やま]へ上[のぼ]られた。夕暮[ゆうぐ]れになっても、そこにひとりでおられた。"
  24: "ところが、舟[ふね]はすでに陸[りく]から何[なん]スタディオン⟨ギリシアの距離[きょり]の単位[たんい]。約[やく]百八十五[ひゃくはちじゅうご]メートル。⟩も離[はな]れており、逆風[ぎゃくふう]のために波[なみ]に悩[なや]まされていた。"
  25: "まだ夜[よ]の明[あ]けぬうちに、イエスは湖[みずうみ]の水面[すいめん]を歩[あゆ]んで弟子[でし]たちのもとへ向[む]かわれた。"
  26: "弟子[でし]たちは、湖[みずうみ]の上[うえ]を歩[あゆ]んで来[く]る方[かた]を見[み]て、「幽霊[ゆうれい]だ」と言[い]っておびえ、恐怖[きょうふ]のあまり大声[おおごえ]を張[は]り上[あ]げた。"
  27: "すぐにイエスは声[こえ]をかけられた。「<j>勇気[ゆうき]を出[だ]しなさい。このわたしだ。恐[おそ]れてはならない。</j>」"
  28: "ペトロが申[もう]し上[あ]げた。「主[しゅ]よ、あなたでしたら、わたしにも水[みず]の上[うえ]を歩[あゆ]ませてください。あなたのもとへ参[まい]るよう、お命[めい]じください。」"
  29: "ペトロはイエスの「<j>来[き]なさい</j>」という言葉[ことば]に従[したが]い、舟[ふね]から水[みず]の上[うえ]へ降[お]りて、イエスのもとへ向[む]かって歩[あゆ]き出[だ]した。"
  30: "ところが、〔強[つよ]い〕風[かぜ]に恐怖[きょうふ]を覚[おぼ]え、沈[しず]みかけながら、「主[しゅ]よ、わたしをお救[すく]いください」と叫[さけ]んだ。"
  31: "すぐにイエスは手[て]を差[さ]し伸[の]べて彼[かれ]を支[ささ]え、「<j>信仰[しんこう]の薄[うす]い者[もの]よ、なぜ疑[うたが]いを抱[いだ]いたのか。</j>」と言[い]われた。"
  32: "二人[ふたり]が舟[ふね]に乗[の]り込[こ]んだとたん、風[かぜ]はぴたりとやんだ。"
  33: "舟[ふね]に乗[の]り合[あ]わせていた者[もの]たちは、イエスの前[まえ]にひれ伏[ふ]して、「まことに、あなたは神[かみ]の子[こ]です」と言[い]った。"
  34: "湖[みずうみ]の向[む]こう岸[ぎし]に着[つ]くと、そこはゲネサレトの地[ち]であった。"
  35: "その土地[とち]の人々[ひとびと]はイエスと知[し]って、付近[ふきん]一帯[いったい]にくまなく人[ひと]を遣[つか]わし、病人[びょうにん]をすべてイエスのところへ連[つ]れて来[き]た。"
  36: "せめて衣[ころも]の裾[すそ]にでも触[ふ]れさせてほしいと願[ねが]ったのだ。そして、触[ふ]れた者[もの]は一人[ひとり]も漏[も]れず癒[いや]された。"

notes:
  1: "τετραάρχης — тетрарх (правитель четвёртой части области); у jp-ni «領主»."
  2: "αἱ δυνάμεις — «силы»; 力あるわざ, ἐνεργοῦσιν — 働いている. В Мк 6:14 та же мысль передана 奇跡を行う力."
  3: "В критической базе αὐτόν в скобках (ἔδησεν [αὐτὸν]) — не маркирую, это не смысловая добавка."
  4: "ἔχειν αὐτήν — «иметь её», т.е. женой; поставил 妻にすること. У jp-ni «あの女と結婚すること»."
  8: "ὧδε ἐπὶ πίνακι — «здесь на блюде»; πίναξ — 盆, как в Мк 6:25."
  10: "ἀπεκεφάλισεν — «обезглавил»; 斬首, чтобы не повторять дословно 首をはねる."
  16: "Οὐ χρείαν ἔχουσιν ἀπελθεῖν — «им нет нужды уходить»; у jp-ni «行かせることはない», поставил 行くには及ばない."
  19: "εὐλόγησεν — «благословил»; формула передана как в Мк 6:41 (賛美の祈りを唱え), чтобы параллель о насыщении читалась одинаково."
  21: "χωρὶς γυναικῶν καὶ παιδίων — «кроме женщин и детей»; у jp-ni так же."
  24: "σταδίους πολλούς — «много стадиев»; σταδίον — греческая мера длины, отсюда сноска. У jp-ni «何スタディオンか»."
  25: "τετάρτῃ φυλακῇ — четвёртая стража ночи (около 3–6 ч.), т.е. перед рассветом; в Мк 6:48 — 夜が明けるころ."
  30: "В критической базе βλέπων δὲ τὸν ἄνεμον, без ἰσχυρόν; церковное чтение (Елизаветинская «ветр крепок», jp-joc 風の烈しき) добавляет «сильный» — 〔強い〕."
  31: "Ὀλιγόπιστε — «маловерный»; как в Мф 6:30 — 信仰の薄い者, ἐδίστασας — 疑いを抱いた."
  33: "οἱ ἐν τῷ πλοίῳ — «бывшие в лодке»; προσεκύνησαν — ひれ伏した."
  36: "κράσπεδον — край/кисть одежды; 裾. ὅσοι ἥψαντο — 触れた者は一人も漏れず."
