verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]りなさい。彼[かれ]らは引[ひ]き返[かえ]して、館[やかた]の前[まえ]、マグドルと海[うみ]の間[あいだ]、ベエルセフォンの向[む]かい側[がわ]に陣[じん]を張[は]りなさい。その前[まえ]、海[うみ]のそばに陣[じん]を張[は]るように。"
  3: "ファラオは民[たみ]について言[い]うであろう。『イスラエルの子[こ]らはこの地[ち]で迷[まよ]っている。荒野[こうや]が彼[かれ]らを閉[と]じ込[こ]めたのだ』と。"
  4: "わたしはファラオの心[こころ]をかたくなにし、彼[かれ]は彼[かれ]らの後[あと]を追[お]うであろう。わたしはファラオとそのすべての軍勢[ぐんせい]によって栄光[えいこう]を現[あらわ]す。エジプト人[じん]はみな、わたしが主[しゅ]であることを知[し]るであろう。」彼[かれ]らはそのとおりに行[おこな]った。"
  5: "民[たみ]が逃[に]げたことがエジプトの王[おう]に告[つ]げられると、ファラオとその家来[けらい]たちの心[こころ]は民[たみ]に向[む]かって変[か]わった。彼[かれ]らは言[い]った。「われわれは何[なん]ということをしたのか。イスラエルの子[こ]らを去[さ]らせて、われわれに仕[つか]えさせないようにしてしまった。」"
  6: "ファラオは戦車[せんしゃ]を整[ととの]え、民[たみ]を自分[じぶん]のところに集[あつ]めた。"
  7: "彼[かれ]は六百[ろっぴゃく]の選[えら]ばれた戦車[せんしゃ]と、エジプトのすべての馬[うま]、それにすべての上[うえ]に立[た]つ者[もの]たちを連[つ]れた。"
  8: "主[しゅ]はエジプトの王[おう]ファラオの心[こころ]とその家来[けらい]たちの心[こころ]をかたくなにされたので、彼[かれ]はイスラエルの子[こ]らの後[あと]を追[お]った。イスラエルの子[こ]らは高[たか]く手[て]を上[あ]げて出[で]て行[い]った。"
  9: "エジプト人[じん]は彼[かれ]らの後[あと]を追[お]い、ファラオのすべての馬[うま]と戦車[せんしゃ]、騎兵[きへい]とその軍[ぐん]が、館[やかた]の前[まえ]、ベエルセフォンの向[む]かい側[がわ]で、海[うみ]のそばに陣[じん]を張[は]っている彼[かれ]らに追[お]いついた。"
  10: "ファラオが近[ちか]づいた。イスラエルの子[こ]らは目[め]を上[あ]げて見[み]た。すると、エジプト人[じん]が彼[かれ]らの後[あと]に来[き]ていた。彼[かれ]らは非常[ひじょう]に恐[おそ]れ、主[しゅ]に叫[さけ]んだ。"
  11: "彼[かれ]らはモーセに言[い]った。「エジプトに墓[はか]がないからといって、あなたはわたしたちを荒野[こうや]へ連[つ]れ出[だ]して死[し]なせようとするのか。エジプトから連[つ]れ出[だ]して、わたしたちに何[なん]ということをしたのか。"
  12: "エジプトで、『わたしたちを放[はな]っておいて、エジプト人[じん]に仕[つか]えさせてくれ』と言[い]ったではないか。この荒野[こうや]で死[し]ぬよりは、エジプト人[じん]に仕[つか]えるほうがよかったのだ。」"
  13: "モーセは民[たみ]に言[い]った。「恐[おそ]れてはならない。立[た]って、主[しゅ]が今日[きょう]あなたがたのために成[な]し遂[と]げられる救[すく]いを見[み]なさい。今日[きょう]あなたがたが見[み]るエジプト人[じん]を、あなたがたは二度[にど]と、永遠[えいえん]に見[み]ることはない。"
  14: "主[しゅ]があなたがたのために戦[たたか]われる。あなたがたは黙[だま]っていなさい。」"
  15: "主[しゅ]はモーセに言[い]われた。「なぜ、あなたはわたしに叫[さけ]ぶのか。イスラエルの子[こ]らに語[かた]って、進[すす]むように言[い]いなさい。"
  16: "あなたは杖[つえ]を上[あ]げ、手[て]を海[うみ]の上[うえ]に伸[の]べて、それを分[わ]けなさい。イスラエルの子[こ]らは海[うみ]の中[なか]の乾[かわ]いた地[ち]に入[はい]るであろう。"
  17: "見[み]よ、わたしはファラオとすべてのエジプト人[じん]の心[こころ]をかたくなにする。彼[かれ]らは彼[かれ]らの後[あと]に入[はい]る。わたしはファラオとそのすべての軍勢[ぐんせい]、その戦車[せんしゃ]、その騎兵[きへい]によって栄光[えいこう]を現[あらわ]す。"
  18: "わたしがファラオとその戦車[せんしゃ]、その騎兵[きへい]によって栄光[えいこう]を現[あらわ]すとき、エジプト人[じん]はみな、わたしが主[しゅ]であることを知[し]るであろう。」"
  19: "神[かみ]の使[つか]いで、イスラエルの子[こ]らの陣営[じんえい]の前[まえ]を進[すす]んでいた者[もの]は、移[うつ]って彼[かれ]らの後[あと]へ行[い]った。雲[くも]の柱[はしら]も彼[かれ]らの前[まえ]から移[うつ]って、彼[かれ]らの後[あと]に立[た]った。"
  20: "それはエジプト人[じん]の陣営[じんえい]とイスラエルの陣営[じんえい]の間[あいだ]に入[はい]って立[た]った。そして闇[やみ]と濃[こ]い暗[くら]やみになった。夜[よる]が過[す]ぎたが、彼[かれ]らは一晩中[ひとばんじゅう]、互[たが]いに近[ちか]づかなかった。"
  21: "モーセが手[て]を海[うみ]の上[うえ]に伸[の]べると、主[しゅ]は夜[よる]通[とお]し強[つよ]い南風[みなみかぜ]で海[うみ]を退[しりぞ]かせ、海[うみ]を乾[かわ]いた地[ち]とされた。水[みず]は分[わ]かれた。"
  22: "イスラエルの子[こ]らは海[うみ]の中[なか]の乾[かわ]いた地[ち]に入[はい]った。水[みず]は彼[かれ]らのために右[みぎ]に壁[かべ]、左[ひだり]に壁[かべ]となった。"
  23: "エジプト人[じん]は追[お]いかけて、ファラオのすべての馬[うま]、戦車[せんしゃ]、騎兵[きへい]が、彼[かれ]らの後[あと]を追[お]って海[うみ]の中[なか]に入[はい]った。"
  24: "朝[あさ]の見張[みは]りの時[とき]、主[しゅ]は火[ひ]と雲[くも]の柱[はしら]のうちからエジプト人[じん]の陣営[じんえい]を眺[なが]め、エジプト人[じん]の陣営[じんえい]を混乱[こんらん]させられた。"
  25: "そして、彼[かれ]らの戦車[せんしゃ]の軸[じく]を縛[しば]って、力[ちから]ずくで進[すす]ませられた。エジプト人[じん]は言[い]った。「イスラエルの前[まえ]から逃[に]げよう。主[しゅ]が彼[かれ]らのために、エジプト人[じん]と戦[たたか]っておられるからだ。」"
  26: "主[しゅ]はモーセに言[い]われた。「あなたの手[て]を海[うみ]の上[うえ]に伸[の]べなさい。水[みず]は戻[もど]って、エジプト人[じん]と、その戦車[せんしゃ]、その騎兵[きへい]を覆[おお]うであろう。」"
  27: "モーセが手[て]を海[うみ]の上[うえ]に伸[の]べると、水[みず]は朝[あさ]になって元[もと]の所[ところ]に戻[もど]った。エジプト人[じん]は水[みず]の下[した]へ逃[に]げた。主[しゅ]はエジプト人[じん]を海[うみ]の中[なか]で振[ふ]り落[お]とされた。"
  28: "水[みず]は戻[もど]って、彼[かれ]らの後[あと]を追[お]って海[うみ]に入[はい]った戦車[せんしゃ]と騎兵[きへい]、ファラオのすべての軍勢[ぐんせい]を覆[おお]った。彼[かれ]らのうち、一人[ひとり]も残[のこ]らなかった。"
  29: "イスラエルの子[こ]らは海[うみ]の中[なか]の乾[かわ]いた地[ち]を歩[ある]いた。水[みず]は彼[かれ]らのために右[みぎ]に壁[かべ]、左[ひだり]に壁[かべ]となった。"
  30: "その日[ひ]、主[しゅ]はイスラエルをエジプト人[じん]の手[て]から救[すく]われた。イスラエルはエジプト人[じん]が海[うみ]の岸[きし]に死[し]んでいるのを見[み]た。"
  31: "イスラエルは、主[しゅ]がエジプト人[じん]になさった大[おお]きな手[て]の業[わざ]を見[み]た。民[たみ]は主[しゅ]を畏[おそ]れ、主[しゅ]とその僕[しもべ]モーセを信[しん]じた。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに語って言われた (λέγων отдельно не передаётся; речь с ст. 2)."
  2: "ἀποστρέψαντες στρατοπεδευσάτωσαν — 引き返して陣を張りなさい (ἀποστρέφω, στρατοπεδεύω). ἀπέναντι τῆς ἐπαύλεως — 館の前に (ἔπαυλις — «усадьба, двор»; LXX переводит как нарицательное, а не имя Пи-Гахироф, как в масоретском тексте, Синодальном и jp-joc — ピガヒロト). Μαγδώλου — マグドル. Βεελσεπφων — ベエルセフォン («Ваал-Цефон»)."
  3: "πλανῶνται — 迷っている (πλανάω — «блуждать»). συγκέκλεικεν αὐτοὺς ἡ ἔρημος — 荒野が彼らを閉じ込めた (perfect от συγκλείω — «запирать»; египтяне считают, что пустыня заперла израильтян)."
  4: "σκληρυνῶ τὴν καρδίαν Φαραω — ファラオの心をかたくなにする (futurum; ср. 11:10). καταδιώξεται ὀπίσω αὐτῶν — 彼らの後を追う (καταδιώκω). ἐνδοξασθήσομαι — 栄光を現す (ἐνδοξάζομαι — «быть прославленным»). ἐγώ εἰμι κύριος — わたしが主である (формула; без «сущий»)."
  5: "ἀνηγγέλη τῷ βασιλεῖ — 王に告げられると (ἀναγγέλλω). μετεστράφη ἡ καρδία — 心は…変わり (μεταστρέφω — «переворачивать»). Τί τοῦτο ἐποιήσαμεν — われわれは何ということをしたのか (риторический вопрос). τοῦ μὴ δουλεύειν ἡμῖν — われわれに仕えさせないように (двойное отрицание с τοῦ μή)."
  6: "ἔζευξεν τὰ ἅρματα — 戦車を整え (ζεύγνυμι — «запрягать»). συναπήγαγεν — 集めた (συνάγω)."
  7: "ἑξακόσια ἅρματα ἐκλεκτά — 六百の選ばれた戦車 (ἐκλεκτός — «отборный»). πᾶσαν τὴν ἵππον — すべての馬 (ἵππος — «конница»). τριστάτας ἐπὶ πάντων — すべての上に立つ者たち (τριστάτης — «третьчий, боец на колеснице»; слав. «тристаты»; jp-joc — 軍長)."
  8: "ἐσκλήρυνεν κύριος — 主は…かたくなにされた (ср. 14:4). ἐν χειρὶ ὑψηλῇ — 高く手を上げて (букв. «рукою высокою»; т. е. открыто, с поднятою рукой; слав. «рукою высокою»)."
  9: "εὕροσαν αὐτοὺς παρεμβεβληκότας — 陣を張っている彼らに追いついた (εὑρίσκω; παρεμβάλλω — «располагать стан»). οἱ ἱππεῖς — 騎兵. ἡ στρατιά — 軍 (στρατιά)."
  10: "προσῆγεν — 近づいた (προσάγω, imperfect). ἀναβλέψαντες τοῖς ὀφθαλμοῖς — 目を上げて (ср. Быт 22:4). ἐστρατοπέδευσαν ὀπίσω αὐτῶν — 彼らの後に陣を張った (т. е. расположились в тылу; у LXX так, без «и вот» — ἰδού jp-joc прибавляет). ἀνεβόησαν — 叫んだ (ἀναβοάω)."
  11: "Παρὰ τὸ μὴ ὑπάρχειν μνήματα — 墓がないからといって (μνῆμα — «могила»). ἐξήγαγες ἡμᾶς θανατῶσαι — 連れ出して死なせようとするのか (θανατόω — «умерщвлять»). τί τοῦτο ἐποίησας ἡμῖν — わたしたちに何ということをしたのか."
  12: "οὐ τοῦτο ἦν τὸ ῥῆμα — 〜と言ったではないか (ῥῆμα — «слово»). Πάρες ἡμᾶς — 放っておいてくれ (παρίημι). κρεῖσσον γὰρ ἡμᾶς δουλεύειν — 仕えるほうがよかった (κρείσσων — «лучше»)."
  13: "Θαρσεῖτε — 恐れてはならない (θαρσέω — «дерзать»). στῆτε καὶ ὁρᾶτε — 立って見なさい (ἵστημι, ὁράω). τὴν σωτηρίαν τὴν παρὰ τοῦ θεοῦ — 神からの救い (σωτηρία). οὐ προσθήσεσθε ἔτι ἰδεῖν — 二度と見ることはない (προστίθημι — «прибавлять»; ср. 11:6)."
  14: "κύριος πολεμήσει περὶ ὑμῶν — 主があなたがたのために戦われる (πολεμέω; περί + род. — «за»). ὑμεῖς σιγήσετε — あなたがたは黙っていなさい (σιγάω — «молчать»)."
  15: "Τί βοᾷς πρός με; — なぜ、あなたはわたしに叫ぶのか (удивление: молитва уже услышана). ἀναζευξάτωσαν — 進むように (ἀναζεύγνυμι — «сниматься со стоянки»)."
  16: "ἔπαρον τῇ ῥάβδῳ σου — 杖を上げ (ἐπαίρω — «поднимать»; ῥάβδος — «жезл»). ἔκτεινον τὴν χεῖρα — 手を伸べて (ἐκτείνω). ῥῆξον αὐτήν — それを分けなさい (ῥήγνυμι — «разрывать»). κατὰ τὸ ξηρόν — 乾いた地を (ξηρός — «сухой»)."
  17: "ἰδοὺ ἐγὼ σκληρυνῶ — 見よ、わたしは…かたくなにする. εἰσελεύσονται ὀπίσω αὐτῶν — 彼らの後に入る. ἐν τοῖς ἅρμασιν καὶ ἐν τοῖς ἵπποις — その戦車、その騎兵によって (ἵππος — «конь, конница»)."
  18: "ἐνδοξαζομένου μου — わたしが栄光を現すとき (genetivus absolutus). γνώσονται — 知るであろう (γινώσκω; формула знания Бога)."
  19: "ὁ ἄγγελος τοῦ θεοῦ ὁ προπορευόμενος — 神の使いで、前を進んでいた者 (προπορεύομαι). ἐξῆρεν — 移った (ἐξαίρω — «снимать»; ср. 13:20). ὁ στῦλος τῆς νεφέλης — 雲の柱 (στῦλος, νεφέλη). ἔστη ἐκ τῶν ὄπισθεν — 後ろに立った (ἵστημι)."
  20: "ἀνὰ μέσον τῆς παρεμβολῆς — 陣営の間に (παρεμβολή — «стан»). ἐγένετο σκότος καὶ γνόφος — 闇と濃い暗やみになった (σκότος — «тьма», γνόφος — «мрак»; слав. «тма и мрак»; jp-joc — 雲と為り、暗と為り, по евр. «облако и тьма»; 雲 взято по церковному чтению). διῆλθεν ἡ νύξ — 夜が過ぎた. οὐ συνέμιξαν ἀλλήλοις — 互いに近づかなかった (συμμίγνυμι — «смешиваться»)."
  21: "ὑπήγαγεν κύριος τὴν θάλασσαν — 主は海を退かせ (ὑπάγω — «отводить»). ἐν ἀνέμῳ νότῳ βιαίῳ — 強い南風で (νότος — «южный ветер»; масоретский текст и Синодальный — «восточный»; держимся LXX). ἐσχίσθη τὸ ὕδωρ — 水は分かれた (σχίζω — «раскалывать»)."
  22: "εἰσῆλθον … κατὰ τὸ ξηρόν — 乾いた地に入った. τεῖχος ἐκ δεξιῶν καὶ τεῖχος ἐξ εὐωνύμων — 右に壁、左に壁 (εὐώνυμος — «левый»)."
  23: "κατεδίωξαν — 追いかけた (καταδιώκω). οἱ ἀναβάται — 騎兵 (ἀναβάτης — «всадник, едущий на колеснице»)."
  24: "ἐν τῇ φυλακῇ τῇ ἑωθινῇ — 朝の見張りの時に (φυλακή — «стража»; ἑωθινός — «утренний»). ἐπέβλεψεν — 眺め (ἐπιβλέπω — «взирать»). ἐν στύλῳ πυρὸς καὶ νεφέλης — 火と雲の柱のうちから. συνετάραξεν — 混乱させた (συνταράσσω)."
  25: "συνέδησεν τοὺς ἄξονας — 軸を縛って (ἄξων — «ось»; слав. «связа оси»; Синодальный — «отнял колеса»). ἤγαγεν αὐτοὺς μετὰ βίας — 力ずくで進ませた (βία — «сила, насилие»; т. е. кони тащили с трудом). Φύγωμεν — 逃げよう (φεύγω). πολεμεῖ περὶ αὐτῶν — 彼らのために戦っておられる (ср. 14:14)."
  26: "ἔκτεινον τὴν χεῖρά σου — 手を伸べなさい (ср. 14:16). ἀποκαταστήτω τὸ ὕδωρ — 水は戻り (ἀποκαθίστημι — «возвращать на место»). ἐπικαλυψάτω — 覆いなさい (ἐπικαλύπτω)."
  27: "ἀπεκατέστη τὸ ὕδωρ πρὸς ἡμέραν ἐπὶ χώρας — 水は朝になって元の所に戻った (χώρα — «место»). ἔφυγον ὑπὸ τὸ ὕδωρ — 水の下へ逃げた (странный оборот LXX: убегали под воду, т. е. в воду). ἐξετίναξεν — 振り落とされた (ἐκτινάσσω — «вытрясать»; слав. «истрясе»)."
  28: "ἐπαναστραφὲν τὸ ὕδωρ — 水は戻って (ἐπαναστρέφω). εἱσπεπορευμένους ὀπίσω αὐτῶν — 彼らの後を追って入った者 (perfect). οὐ κατελείφθη … οὐδὲ εἷς — 一人も残らなかった (двойное отрицание сохранено)."
  29: "οἱ δὲ υἱοὶ Ισραηλ ἐπορεύθησαν διὰ ξηρᾶς — イスラエルの子らは乾いた地を歩いた (ξύρα — «суша»). τεῖχος … ἐξ εὐωνύμων — 左に壁 (повтор 14:22, как в LXX)."
  30: "ἐρρύσατο — 救われた (ῥύομαι — «избавлять»). ἐκ χειρὸς τῶν Αἰγυπτίων — エジプト人の手から. τεθνηκότας παρὰ τὸ χεῖλος τῆς θαλάσσης — 海の岸に死んでいる (χεῖλος — «берег, губа»)."
  31: "τὴν χεῖρα τὴν μεγάλην — 大きな手 (рука — сила Божия). ἐπίστευσαν τῷ θεῷ καὶ Μωυσῇ — 神とモーセを信じた (πιστεύω + датив). τῷ θεράποντι αὐτοῦ — その僕 (θεράπων — «слуга»; слав. «угоднику»)."
