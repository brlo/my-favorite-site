# jp-box, Исход, глава 14. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и jp-joc (1901, public domain; в этой главе полностью).
# ru — только для понимания, не источник. Язык — современный 常体.
# Глава 14: стан у моря (1–4), погоня фараона и ропот народа (5–12),
# «Господь будет поборать за вас» (13–14), разделение моря (15–22),
# гибель египтян (23–28), спасение Израиля и вера народа (29–31).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Кавычки: речь Бога — 「…」 (2–4, 15–18, 26); слова фараона, египтян и народа — 「…」;
# слова фараона внутри речи Господа — 『…』 (3).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# 14:2 LXX читает ἐπαύλεως («усадьба, двор»), а не имя Пи-Гахироф (масоретский текст,
# Синодальный, jp-joc — ピガヒロト); 14:20 — σκότος καὶ γνόφος, в тексте 闇と濃い暗やみ
# по церковному чтению jp-joc (слав. «тма и мрак»); 14:21 LXX — южный ветер (νότος),
# масоретский текст — восточный. Всё это в notes.
# Сносок ⟨…⟩ нет: 葦の海 уже пояснено в 13:18, остальное понятно по контексту.
# jp-ni не использовался.

