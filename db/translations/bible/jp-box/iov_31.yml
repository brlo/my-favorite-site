verses:
  1: "「わたしは自分[じぶん]の目[め]と契約[けいやく]を結[むす]び、処女[おとめ]に思[おも]いを向[む]けないようにした。"
  2: "神[かみ]が上[うえ]からわたしに分[わ]け与[あた]えられるものは何[なに]か、いと高[たか]き方[かた]から受[う]ける全能者[ぜんのうしゃ]の嗣業[しぎょう]は何か。"
  3: "不正[ふせい]な者[もの]には滅[ほろ]びが、不法[ふほう]を行[おこな]う者[もの]には見放[みはな]しがあるのではないか。"
  4: "神[かみ]はわたしの道[みち]をご覧[らん]になり、わたしの歩[あゆ]みをすべて数[かぞ]えられるのではないか。"
  5: "もしわたしが嘲[あざけ]る者[もの]たちとともに歩[あゆ]み、わたしの足[あし]が欺[あざむ]きへと急[いそ]いだのなら、"
  6: "わたしは正[ただ]しい秤[はかり]の上[うえ]に立[た]っている。主[しゅ]はわたしの無垢[むく]さをご覧[らん]になった。"
  7: "もしわたしの足[あし]が道[みち]からそれ、わたしの心[こころ]が目[め]の後[あと]を追[お]い、わたしの手[て]に賄賂[わいろ]が触[ふ]れたのなら、"
  8: "わたしが蒔[ま]いても、他[ほか]の者[もの]が食[た]べるがよい。わたしは地[ち]の上[うえ]で根[ね]を断[た]たれた者[もの]となればよい。"
  9: "もしわたしの心[こころ]が他[ほか]の男[おとこ]の妻[つま]を慕[した]い、彼女[かのじょ]の戸口[とぐち]に伏[ふ]せて待[ま]ったのなら、"
  10: "わたしの妻[つま]が他[ほか]の者[もの]に身[み]を任[まか]せ、わたしの幼[おさな]い子[こ]らが辱[はずかし]められるがよい。"
  11: "それは抑[おさ]えきれない怒[いか]りの激[はげ]しさであり、人[ひと]の妻[つま]を汚[けが]すことだからである。"
  12: "それはすべての部分[ぶぶん]を焼[や]く火[ひ]であり、どこに及[およ]んでも根[ね]こそぎ滅[ほろ]ぼす。"
  13: "もしわたしが、男女[だんじょ]の奴隷[どれい]がわたしと争[あらそ]ったとき、その裁[さば]きを軽[かろ]んじたのなら、"
  14: "主[しゅ]がわたしを調[しら]べられるなら、わたしは何[なに]をしようか。主が訪[おとず]れられるなら、わたしは何[なん]と答[こた]えようか。"
  15: "わたしが腹[はら]のうちに造[つく]られたように、彼[かれ]らも造られたのではないか。同[おな]じ胎[たい]のうちで、わたしたちは造られたのだ。"
  16: "無力[むりょく]な者[もの]が求[もと]めた必要[ひつよう]を、わたしが与[あた]えなかったことがあるか。やもめの目[め]を衰[おとろ]えさせたことがあるか。"
  17: "もしわたしがパンを一人[ひとり]で食[た]べ、孤児[みなしご]に分[わ]け与[あた]えなかったのなら、"
  18: "わたしは若[わか]い時[とき]から彼[かれ]を父[ちち]のように養[やしな]い、母[はは]の胎[たい]から出[で]て以来[いらい]、導[みちび]いてきたのだから。"
  19: "もしわたしが、裸[はだか]で滅[ほろ]びようとしている者[もの]を見過[みす]ごし、着物[きもの]を着[き]せなかったのなら、"
  20: "無力[むりょく]な者[もの]がわたしを祝福[しゅくふく]しなかったことがあるか。わたしの小羊[こひつじ]の毛[け]で彼[かれ]らの肩[かた]を温[あたた]めたではないか。"
  21: "わたしに多[おお]くの助[たす]けがあると信[しん]じて、孤児[みなしご]に手[て]を上[あ]げたことがあるのなら、"
  22: "わたしの肩[かた]が鎖骨[さこつ]から外[はず]れ、腕[うで]が肘[ひじ]から砕[くだ]けるがよい。"
  23: "主[しゅ]を恐[おそ]れることがわたしを捕[と]らえ、その重[おも]みのゆえにわたしは耐[た]えられないからである。"
  24: "もしわたしが金[きん]を自分[じぶん]の力[ちから]とし、貴[とうと]い石[いし]に頼[たよ]ったのなら、"
  25: "もし富[とみ]が多[おお]くあることを喜[よろこ]び、数[かぞ]えきれないほどのものを手[て]にしたことを喜んだのなら、"
  26: "わたしは輝[かがや]いては欠[か]けてゆく太陽[たいよう]や、衰[おとろ]えてゆく月[つき]を見[み]ているではないか。それは彼[かれ]らにあるのではない。"
  27: "もしわたしの心[こころ]がひそかに惑[まど]わされ、わたしが手[て]を口[くち]に当[あ]てて、その手[て]に口[くち]づけしたのなら、"
  28: "これもまた、わたしにとって最大[さいだい]の不法[ふほう]と見[み]なされるがよい。わたしはいと高[たか]き主[しゅ]なる神[かみ]に対して偽[いつわ]りを言[い]ったのだから。"
  29: "もしわたしが敵[てき]の倒[たお]れるのを喜[よろこ]び、『うまくいった』と心[こころ]で言[い]ったのなら、"
  30: "わたしの耳[みみ]が自分[じぶん]への呪[のろ]いを聞[き]くがよい。わたしは民[たみ]の間[あいだ]で悪[わる]く言[い]われ、苦[くる]しめられるがよい。"
  31: "わたしの女[おんな]奴隷[どれい]たちが、『この方[かた]の肉[にく]を腹[はら]いっぱいに食[た]べさせてくれる人[ひと]はだれか』とたびたび言[い]ったではないか。わたしはそれほど親切[しんせつ]であったのに。"
  32: "旅人[たびびと]が外[そと]で夜[よ]を明[あ]かすことはなく、わたしの戸[と]は来[く]る者[もの]すべてに開[ひら]かれていた。"
  33: "もしわたしが、思[おも]わず罪[つみ]を犯[おか]して、その罪[つみ]を隠[かく]したのなら、"
  34: "わたしは大[おお]きな群[む]れを恐[おそ]れて、彼[かれ]らの前[まえ]で言[い]い表[あらわ]すことをやめたことはない。また、無力[むりょく]な者[もの]を空[から]の懐[ふところ]でわたしの戸[と]から出[だ]したこともない。"
  35: "だれか、わたしの言[い]うことを聞[き]く者[もの]をわたしに与[あた]えてくれないだろうか。わたしが主[しゅ]の手[て]を恐[おそ]れなかったのなら、だれかに対して持[も]っている訴状[そじょう]を、"
  36: "わたしは肩[かた]に載[の]せて冠[かんむり]のようにし、読[よ]み上[あ]げただろう。"
  37: "わたしがそれを引[ひ]き裂[さ]かず、借[か]り手[て]から何[なに]も取[と]らずに返[かえ]したのなら、"
  38: "もし地[ち]がわたしに対して嘆[なげ]き、その畝[うね]がともに泣[な]いたのなら、"
  39: "もしわたしがその力[ちから]を代価[だいか]も払[はら]わずに一人[ひとり]で食[た]べ、地[ち]の主[ぬし]の魂[たましい]を奪[うば]って苦[くる]しめたのなら、"
  40: "小麦[こむぎ]の代[か]わりにいらくさが、大麦[おおむぎ]の代わりに茨[いばら]が、わたしから生[は]え出[で]るがよい。」そしてヨブは語[かた]ることをやめた。"

notes:
  1: "Иов (продолжение речи; цитата открывается здесь, закрывается в 31:40). διαθήκην ἐθέμην τοῖς ὀφθαλμοῖς μου — わたしは自分の目と契約を結び (διαθήκη — «завет»). οὐ συνήσω ἐπὶ παρθένον — 処女に思いを向けないようにした (συνίημι — «понимать, обращать ум»; слав. «да не помышлю на девицу»)."
  2: "Иов. τί ἐμέρισεν ὁ θεὸς ἀπάνωθεν — 神が上からわたしに分け与えられたものは何か (μερίζω — «делить, уделять»). κληρονομία ἱκανοῦ ἐξ ὑψίστων — いと高き方から受ける全能者の嗣業 (ἱκανός — «достаточный, сильный», здесь = Παντοκράτωρ, 全能者; слав. «всесильнаго»)."
  3: "Иов. οὐχὶ ἀπώλεια τῷ ἀδίκῳ — 不正な者には滅びがあるのではないか (ἀπώλεια — «погибель»; слав. начинает «Увы», чего в LXX нет). ἀπαλλοτρίωσις τοῖς ποιοῦσιν ἀνομίαν — 不法を行う者には見放しがある (ἀπαλλοτρίωσις — «отчуждение»)."
  4: "Иов. οὐχὶ αὐτὸς ὄψεται ὁδόν μου — 神はわたしの道をご覧になるのではないか. πάντα τὰ διαβήματά μου ἐξαριθμήσεται — わたしの歩みをすべて数えられる (ἐξαριθμέω — «исчислять»; διάβημα — «шаг»)."
  5: "Иов. εἰ δὲ ἤμην πεπορευμένος μετὰ γελοιαστῶν — もしわたしが嘲る者たちとともに歩み (γελοιαστής — «насмешник»; слав. «с посмеятели»). εἰ δὲ καὶ ἐσπούδασεν ὁ πούς μου εἰς δόλον — わたしの足が欺きへと急いだのなら (σπουδάζω — «спешить»; δόλος — «коварство»)."
  6: "Иов. ἱσταίη με ἄρα ἐν ζυγῷ δικαίῳ — в LXX оптатив: «пусть поставит меня на весы правды»; слав. «стах бо на мериле праведне» — «я стал»; взят слав. οἶδεν δὲ ὁ κύριος τὴν ἀκακίαν μου — 主はわたしの無垢さをご覧になった (ἀκακία — «незлобие»)."
  7: "Иов. εἰ ἐξέκλινεν ὁ πούς μου ἐκ τῆς ὁδοῦ — もしわたしの足が道からそれ (ἐκκλίνω — «уклоняться»). τῷ ὀφθαλμῷ ἐπηκολούθησεν ἡ καρδία μου — 心が目の後を追い (ἐπακολουθέω — «следовать»). ταῖς χερσίν μου ἡψάμην δώρων — 手に賄賂が触れた (δῶρον — «дар», здесь взятка)."
  8: "Иов. σπείραιμι ἄρα καὶ ἄλλοι φάγοισαν — わたしが蒔いても、他の者が食べるがよい (σπείρω — «сеять»). ἄρριζος δὲ γενοίμην ἐπὶ γῆς — 地の上で根を断たれた者となればよい (ἄρριζος — «без корня»)."
  9: "Иов. εἰ ἐξηκολούθησεν ἡ καρδία μου γυναικὶ ἀνδρὸς ἑτέρου — もしわたしの心が他の男の妻を慕い (ἐξακολουθέω — «следовать за»). ἐγκάθετος ἐγενόμην ἐπὶ θύραις αὐτῆς — 彼女の戸口に伏せて待った (ἐγκάθετος — «подстерегающий в засаде»; слав. «приседяй»)."
  10: "Иов. ἀρέσαι ἄρα καὶ ἡ γυνή μου ἑτέρῳ — わたしの妻が他の者に身を任せるがよい (ἀρέσκω — «нравиться»; слав. «угодна буди»). τὰ δὲ νήπιά μου ταπεινωθείη — わたしの幼い子らが辱められるがよい (ταπεινόω — «унижать»; νήπιος — «младенец»)."
  11: "Иов. θυμὸς γὰρ ὀργῆς ἀκατάσχετος — それは抑えきれない怒りの激しさ (ἀκατάσχετος — «неудержимый»). τὸ μιᾶναι ἀνδρὸς γυναῖκα — 人の妻を汚すこと (μιαίνω — «осквернять»)."
  12: "Иов. πῦρ γάρ ἐστιν καιόμενον ἐπὶ πάντων τῶν μερῶν — それはすべての部分を焼く火 (καίω — «жечь»). οὗ δ᾿ ἂν ἐπέλθῃ, ἐκ ῥιζῶν ἀπώλεσεν — どこに及んでも根こそぎ滅ぼす (ἐπέρχομαι — «находить»; ἐκ ῥιζῶν — «от корней»)."
  13: "Иов. εἰ δὲ καὶ ἐφαύλισα κρίμα θεράποντός μου ἢ θεραπαίνης — もしわたしが男女の奴隷の裁きを軽んじたのなら (φαυλίζω — «считать ничтожным»; κρίμα — «суд, тяжба»). κρινομένων αὐτῶν πρός με — 彼らがわたしと争ったとき (κρίνω — «судиться»)."
  14: "Иов. τί γὰρ ποιήσω, ἐὰν ἔτασίν μου ποιήσηται ὁ κύριος; — 主がわたしを調べられるなら、わたしは何をしようか (ἔτασις — «испытание, дознание»). ἐὰν δὲ καὶ ἐπισκοπήν, τίνα ἀπόκρισιν ποιήσομαι; — 主が訪れられるなら、何と答えようか (ἐπισκοπή — «посещение»)."
  15: "Иов. πότερον οὐχ ὡς καὶ ἐγὼ ἐγενόμην ἐν γαστρί, καὶ ἐκεῖνοι γεγόνασιν; — わたしが腹のうちに造られたように、彼らも造られたのではないか (πότερον вводит вопрос). γεγόναμεν δὲ ἐν τῇ αὐτῇ κοιλίᾳ — 同じ胎のうちで、わたしたちは造られた (κοιλία — «утроба»)."
  16: "Иов. ἀδύνατοι δὲ χρείαν, ἥν ποτ εἶχον, οὐκ ἀπέτυχον — 無力な者が求めた必要を、わたしが与えなかったことがあるか (ἀποτυγχάνω — «не получать»; двойное отрицание в греч. и слав.). χήρας δὲ τὸν ὀφθαλμὸν οὐκ ἐξέτηξα — やもめの目を衰えさせたことがあるか (ἐκτήκω — «расплавлять, иссушать»)."
  17: "Иов. εἰ δὲ καὶ τὸν ψωμόν μου ἔφαγον μόνος — もしわたしがパンを一人で食べ (ψωμός — «кусок»; слав. «хлеб мой»). οὐχὶ ὀρφανῷ μετέδωκα — 孤児に分け与えなかったのなら (μεταδίδωμι — «делиться»)."
  18: "Иов. ὅτι ἐκ νεότητός μου ἐξέτρεφον ὡς πατήρ — わたしは若い時から彼を父のように養い (ἐκτρέφω — «вскармливать»). ἐκ γαστρὸς μητρός μου ὡδήγησα — 母の胎から出て以来、導いてきた (ὁδηγέω — «вести»; слав. «наставлях»)."
  19: "Иов. εἰ δὲ καὶ ὑπερεῖδον γυμνὸν ἀπολλύμενον — もしわたしが、裸で滅びようとしている者を見過ごし (ὑπεροράω — «презирать, не замечать»). οὐκ ἠμφίασα — 着物を着せなかったのなら (ἀμφιάζω — «одевать»)."
  20: "Иов. ἀδύνατοι δὲ εἰ μὴ εὐλόγησάν με — 無力な者がわたしを祝福しなかったことがあるか (εὐλογέω — «благословлять»). ἀπὸ δὲ κουρᾶς ἀμνῶν μου ἐθερμάνθησαν οἱ ὦμοι αὐτῶν — わたしの小羊の毛で彼らの肩を温めた (κουρά — «стрижка»; ἀμνός — «агнец»; слав. «согрешася» — опечатка или иное чтение вместо «согреяшася»)."
  21: "Иов. εἰ ἐπῆρα ὀρφανῷ χεῖρα — もし孤児に手を上げたのなら (ἐπαίρω — «поднимать»). πεποιθὼς ὅτι πολλή μοι βοήθεια περίεστιν — わたしに多くの助けがあると信じて (πείθω — «полагаться»; βοήθεια — «помощь»)."
  22: "Иов. ἀποσταίη ἄρα ὁ ὦμός μου ἀπὸ τῆς κλειδός — わたしの肩が鎖骨から外れるがよい (ἀφίστημι — «отпадать»; κλείς — «ключица»; ὦμος — «плечо»). ὁ δὲ βραχίων μου ἀπὸ τοῦ ἀγκῶνός μου συντριβείη — 腕が肘から砕けるがよい (βραχίων — «рука»; ἀγκών — «локоть»)."
  23: "Иов. φόβος γὰρ κυρίου συνέσχεν με — 主を恐れることがわたしを捕らえ (συνέχω — «сжимать, охватывать»; φόβος κυρίου — 主を恐れること). ἀπὸ τοῦ λήμματος αὐτοῦ οὐχ ὑποίσω — その重みのゆえにわたしは耐えられない (λῆμμα — «бремя, тяжесть»; ὑποφέρω — «выносить»; слав. «от тягости его»)."
  24: "Иов. εἰ ἔταξα χρυσίον ἰσχύν μου — もしわたしが金を自分の力としたのなら (χρυσίον — «золото»; τάσσω — «полагать»). εἰ δὲ καὶ λίθῳ πολυτελεῖ ἐπεποίθησα — 貴い石に頼ったのなら (πολυτελής — «драгоценный»; πείθω — «надеяться»)."
  25: "Иов. εἰ δὲ καὶ εὐφράνθην πολλοῦ πλούτου μοι γενομένου — もし富が多くあることを喜んだのなら (εὐφραίνομαι — «радоваться»; πλοῦτος — «богатство»). ἐπ᾿ ἀναριθμήτοις ἐθέμην χεῖρά μου — 数えきれないほどのものに手を置いた (ἀναρίθμητος — «неисчислимый»)."
  26: "Иов. ἦ οὐχ ὁρῶ μὲν ἥλιον τὸν ἐπιφαύσκοντα ἐκλείποντα — わたしは輝いては欠けてゆく太陽を見ているではないか (ἐπιφαύσκω — «светить»; ἐκλείπω — «оскудевать»). σελήνην δὲ φθίνουσαν — 衰えてゆく月 (φθίνω — «убывать»). οὐ γὰρ ἐπ᾿ αὐτοῖς ἐστιν — それは彼らにあるのではない (тёмное место; слав. «не в них бо есть»: речь о том, что светила не боги)."
  27: "Иов. καὶ εἰ ἠπατήθη λάθρᾳ ἡ καρδία μου — もしわたしの心がひそかに惑わされ (ἀπατάω — «обманывать»; λάθρᾳ — «тайно»). χεῖρά μου ἐπιθεὶς ἐπὶ στόματί μου ἐφίλησα — 手を口に当てて、その手に口づけしたのなら (φιλέω — «целовать»; жест поклонения светилам)."
  28: "Иов. καὶ τοῦτό μοι ἄρα ἀνομία ἡ μεγίστη λογισθείη — これもまた、わたしにとって最大の不法と見なされるがよい (λογίζομαι — «вменять»; ἀνομία — «беззаконие»). ὅτι ἐψευσάμην ἐναντίον κυρίου τοῦ ὑψίστου — いと高き主なる神に対して偽りを言ったのだから (ψεύδομαι — «лгать»)."
  29: "Иов. εἰ δὲ καὶ ἐπιχαρὴς ἐγενόμην πτώματι ἐχθρῶν μου — もしわたしが敵の倒れるのを喜んだのなら (ἐπιχαρής — «радующийся чужому горю»; πτῶμα — «падение»). εἶπεν ἡ καρδία μου Εὖγε — 心で『うまくいった』と言った (εὖγε — «хорошо же!»; у слав. повторено дважды, в LXX один раз)."
  30: "Иов. ἀκοῦσαι ἄρα τὸ οὖς μου τὴν κατάραν μου — わたしの耳が自分への呪いを聞くがよい (κατάρα — «проклятие»). θρυληθείαν δὲ ἄρα ὑπὸ λαοῦ μου κακούμενος — 民の間で悪く言われ、苦しめられるがよい (θρυλέομαι — «быть притчей»; κακόω — «притеснять»)."
  31: "Иов. εἰ δὲ καὶ πολλάκις εἶπον αἱ θεράπαιναί μου — わたしの女奴隷たちがたびたび言ったではないか (θεράπαινα — «служанка»). τίς ἂν δῴη ἡμῖν τῶν σαρκῶν αὐτοῦ πλησθῆναι; — 『この方の肉を腹いっぱいに食べさせてくれる人はだれか』 (πλησθῆναι — «насытиться»). λίαν μου χρηστοῦ ὄντος — わたしはまことに親切であったのに (χρηστός — «добрый»; слав. «зело мне благу сущу»)."
  32: "Иов. ἔξω δὲ οὐκ ηὐλίζετο ξένος — 旅人が外で夜を明かすことはなく (αὐλίζομαι — «ночевать»; ξένος — «странник»). ἡ δὲ θύρα μου παντὶ ἐλθόντι ἀνέῳκτο — わたしの戸は来る者すべてに開かれていた (ἀνοίγω — «открывать»)."
  33: "Иов. εἰ δὲ καὶ ἁμαρτὼν ἀκουσίως ἔκρυψα τὴν ἁμαρτίαν μου — もしわたしが、思わず罪を犯して、その罪を隠したのなら (ἀκουσίως — «невольно»; κρύπτω — «скрывать»)."
  34: "Иов. οὐ γὰρ διετράπην πολυοχλίαν πλήθους — わたしは大きな群れのゆえに、告げることを恥じなかった (διατρέπω — «смущаться»; πολυοχλία — «многолюдство»). τοῦ μὴ ἐξαγορεῦσαι ἐνώπιον αὐτῶν — 彼らの前で言い表すことをやめなかった (ἐξαγορεύω — «объявлять»). εἰ δὲ καὶ εἴασα ἀδύνατον ἐξελθεῖν θύραν μου κόλπῳ κενῷ — 無力な者を空の懐で戸から去らせたこともない (κόλπος — «лоно, пазуха»). В слав. 31:34 в скобках добавлено «аще бы не убоялся» — повтор начала 31:35, в LXX нет, как дубль не переведено."
  35: "Иов. τίς δῴη ἀκούοντά μου; — だれか、わたしの言うことを聞く者をわたしに与えてくれないだろうか (δῴη — оптатив от δίδωμι). χεῖρα δὲ κυρίου εἰ μὴ ἐδεδοίκειν — わたしが主の手を恐れなかったのなら (δεδοίκειν — плюсквамперфект от δείδω, «бояться»; слав. «руки же Господни аще бых не убоялся»). συγγραφὴν δέ, ἣν εἶχον κατά τινος — だれかに対して持っている訴状を (συγγραφή — «запись, документ»; слав. «писание»). Синтаксис в LXX и слав. оборван; аподосис — в 31:36."
  36: "Иов. ἐπ᾿ ὤμοις ἂν περιθέμενος στέφανον ἀνεγίνωσκον — わたしは肩に載せて冠のようにし、読み上げただろう (περιτίθημι — «возлагать»; ἀναγινώσκω — «читать вслух»). ἄν — потенциальное наклонение."
  37: "Иов. καὶ εἰ μὴ ῥήξας αὐτὴν ἀπέδωκα οὐθὲν λαβὼν παρὰ χρεοφειλέτου — わたしがそれを引き裂かず、借り手から何も取らずに返したのなら (ῥήγνυμι — «разрывать»; χρεοφειλέτης — «должник»). Условная цепь 31:35–39 завершается клятвой в 31:40."
  38: "Иов. εἰ ἐπ᾿ ἐμοί ποτε ἡ γῆ ἐστέναξεν — もし地がわたしに対して嘆いたことがあるのなら (ἐπ᾿ ἐμοί — «против меня»). οἱ αὔλακες αὐτῆς ἔκλαυσαν ὁμοθυμαδόν — その畝がともに泣いたのなら (αὖλαξ — «борозда»; ὁμοθυμαδόν — «единодушно»)."
  39: "Иов. εἰ δὲ καὶ τὴν ἰσχὺν αὐτῆς ἔφαγον μόνος ἄνευ τιμῆς — もしわたしがその力を代価も払わずに一人で食べ (τιμή — «цена»). ψυχὴν κυρίου τῆς γῆς ἐκβαλὼν ἐλύπησα — 地の主の魂を奪って苦しめたのなら (κύριος τῆς γῆς — «господин земли», т. е. земледелец; ἐκβάλλω — «изгонять, отнимать»)."
  40: "Иов. ἀντὶ πυροῦ ἄρα ἐξέλθοι μοι κνίδη — 小麦の代わりにいらくさが生え出るがよい (πυρός — «пшеница»; κνίδη — «крапива»). ἀντὶ δὲ κριθῆς βάτος — 大麦の代わりに茨 (κριθή — «ячмень»; βάτος — «терновник»). Καὶ ἐπαύσατο Ιωβ ῥήμασιν — そしてヨブは語ることをやめた: повествование, вне кавычек; в слав. эти слова перенесены в начало 32:1."
