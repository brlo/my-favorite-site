# jp-box, Иов, глава 31. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге только 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 31: «завет с глазами» и перечень грехов — целомудрие (1–4), неправда и
# обман (5–8), прелюбодеяние (9–12), суд над рабами (13–15), милость к бедным
# (16–23), богатство и идолослужение светилам (24–28), злорадство и гостеприимство
# (29–32), лицемерие (33–34), вызов на суд и финальная клятва (35–40).
# Продолжение речи без вводной формулы: цитата открывается в ст. 1 и закрывается
# в ст. 40; «слова Иова кончились» в 40 — повествование, вне кавычек.
# Нумерация по gr: 40 стихов; в слав. 31:40 этих слов нет (перенесены в 32:1) — отмечено.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

