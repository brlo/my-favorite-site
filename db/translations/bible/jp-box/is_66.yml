verses:
  1: "主[しゅ]はこう言[い]われる。「天[てん]はわたしの王座[おうざ]、地[ち]はわたしの足台[あしだい]である。あなたがたはわたしにどんな家[いえ]を建[きず]くのか。わたしの憩[いこ]いの場所[ばしょ]はどこにあるのか。"
  2: "これらすべてを造[つく]ったのはわたしの手[て]であり、これらはすべてわたしのものである、と主[しゅ]は言[い]われる。わたしはだれに目[め]を注[そそ]ぐのか。へりくだり、静[しず]かにして、わたしの言葉[ことば]に震[ふる]える者[もの]にではないか。"
  3: "不法[ふほう]な者[もの]は、わたしに雄牛[おうし]を屠[ほふ]っても犬[いぬ]を殺[ころ]すのと同じであり、素祭[そさい]をささげても豚[ぶた]の血[ち]をささげるのと同じであり、香[こう]を記念[きねん]としてささげても、冒涜[ぼうとく]する者と同じである。彼らは自分[じぶん]の道[みち]を選[えら]び、その魂[たましい]が望[のぞ]む忌[い]むべきものを選んだ。"
  4: "わたしもまた、彼らの嘲[あざけ]りを選[えら]び、彼らにその罪[つみ]の報[むく]いを返[かえ]す。わたしが呼[よ]んだのに、だれも答[こた]えず、語[かた]ったのに、だれも聞[き]かず、わたしの目[め]に悪[わる]いことを行[おこな]い、わたしが望[のぞ]まないものを選んだからである。」"
  5: "主[しゅ]の言葉[ことば]に震[ふる]える者[もの]たちよ、主の言葉を聞[き]け。あなたがたを憎[にく]み、忌[い]み嫌[きら]う者[もの]たちに、「わたしたちの兄弟[きょうだい]たちよ」と言[い]え。主[しゅ]の名[な]がほめたたえられ、彼らの喜[よろこ]びのうちに現[あらわ]れるために。そして、彼らは恥[は]じる。"
  6: "町[まち]からの叫[さけ]び声[ごえ]、神殿[しんでん]からの声、主[しゅ]の声[こえ]がある。主は敵対[てきたい]する者[もの]たちに報[むく]いを返[かえ]される。"
  7: "彼女[かのじょ]は産[う]みの苦[くる]しみを味[あじ]わう前[まえ]に産[う]み、苦しみが来[く]る前に男[おとこ]の子[こ]を産んだ。"
  8: "だれがこのようなことを聞[き]いたか。だれがこのようなことを見[み]たか。地[ち]が一日[いちにち]で産[う]みの苦しみをすることがあるか。国[くに]が一度[いちど]に生[う]まれることがあるか。シオンは産[う]みの苦しみを味[あじ]わい、その子[こ]らを産んだからである。"
  9: "「わたしはこの期待[きたい]を与[あた]えたのに、あなたはわたしを思[おも]い起[おこ]さなかった」と主[しゅ]は言[い]われる。「見[み]よ、産[う]ませる者[もの]と産めない者[もの]を造[つく]ったのは、このわたしではないか」と神[かみ]は言[い]われる。"
  10: "エルサレムよ、喜[よろこ]べ。これを愛[あい]する者[もの]たち、その中に住[す]む者たちは皆[みな]、エルサレムにあって祝[いわ]え。これを悲[かな]しんだ者たちは皆、喜[よろこ]びをもって喜べ。"
  11: "あなたがたが乳[ちち]を吸[す]って、その慰[なぐさ]めの乳房[ちぶさ]から満[み]ち足[た]り、乳を吸い終わって、その栄光[えいこう]の入[い]り口[ぐち]から楽[たの]しむために。"
  12: "主[しゅ]はこう言[い]われる。「見[み]よ、わたしは彼[かれ]らの方[ほう]へ、平和[へいわ]を川[かわ]のように、諸国[しょこく]の栄光[えいこう]を溢[あふ]れ流[なが]す流れのように注[そそ]ぐ。彼らの子[こ]らは肩[かた]に抱[だ]き上[あ]げられ、膝[ひざ]の上[うえ]で慰[なぐさ]められる。"
  13: "母[はは]がその子[こ]を慰[なぐさ]めるように、わたしはあなたがたを慰める。あなたがたはエルサレムで慰められる。"
  14: "あなたがたはこれを見[み]、心[こころ]は喜[よろこ]ぶ。あなたがたの骨[ほね]は若[わか]い草[くさ]のように芽生[めば]える。主[しゅ]の手[て]は主を恐[おそ]れる者[もの]たちに知[し]られ、主は従[したが]わない者たちを脅[おど]される。」"
  15: "見[み]よ、主[しゅ]は火[ひ]のように来[く]られ、その車[くるま]は嵐[あらし]のようである。怒[いか]りをもって復讐[ふくしゅう]を、燃[も]える炎[ほのお]をもって追[お]い払[はら]いを返[かえ]すために。"
  16: "主[しゅ]は火[ひ]をもってすべての地[ち]を裁[さば]き、その剣[つるぎ]ですべての肉[にく]を裁かれる。主に殺[ころ]される者は多[おお]い。"
  17: "園[その]で身[み]を清[きよ]め、聖別[せいべつ]する者[もの]たち、前庭[まえにわ]で豚[ぶた]の肉[にく]と忌[い]むべきものと鼠[ねずみ]を食[た]べる者たちは、ともに滅[ほろ]びると主[しゅ]は言[い]われる。"
  18: "「わたしは彼[かれ]らのわざと、その思[おも]いを知[し]っている。わたしは来[き]て、すべての国[くに]々[ぐに]と国語[こくご]を集[あつ]める。彼らは来て、わたしの栄光[えいこう]を見[み]る。"
  19: "わたしは彼[かれ]らの上[うえ]にしるしを置[お]き、彼らの中から救[すく]われた者[もの]たちを、諸国[しょこく]へ、タルシシュ、プド、ルド、モソク、トベル、そしてギリシアと遠[とお]い島[しま]々[じま]へ遣[つか]わす。わたしの名[な]を聞[き]いたこともなく、わたしの栄光[えいこう]を見[み]たこともない者たちのところへ。彼らは諸国の間[あいだ]で、わたしの栄光を告[つ]げ知[し]らせる。"
  20: "そして、彼らはあなたがたの兄弟[きょうだい]たちをすべての国[くに]々[ぐに]から、馬[うま]と車[くるま]と、らばの輿[こし]、日[ひ]よけの天蓋[てんがい]に乗せて、わたしへの供[そな]え物[もの]として、わたしの聖[せい]なる都[みやこ]エルサレムに連[つ]れて来[く]る、と主[しゅ]は言[い]われる。イスラエルの子[こ]らが、自分[じぶん]たちの犠牲[ぎせい]を歌[うた]とともに主の家[いえ]に携[たずさ]えて来るように。"
  21: "わたしは彼らの中から、わたしのために祭司[さいし]とレビ人[びと]を取[と]る。」と主[しゅ]は言[い]われる。"
  22: "「新しい天[てん]と新しい地[ち]が、わたしが造[つく]るものとしてわたしの前[まえ]にとどまるように、あなたがたの子孫[しそん]と名[な]も、そのように立[た]つ。」と主[しゅ]は言[い]われる。"
  23: "「そして、月[つき]から月へ、安息日[あんそくび]から安息日へ、すべての肉[にく]はわたしの前[まえ]に来[き]て、エルサレムで礼拝[れいはい]する。」と主[しゅ]は言[い]われる。"
  24: "「そして、彼らは出[で]て行[ゆ]き、わたしに背[そむ]いた者[もの]たちの屍[しかばね]を見[み]る。彼らの虫[むし]は死[し]なず、彼らの火[ひ]は消[き]えない。彼らはすべての肉[にく]が目[め]にするものとなる。」"

notes:
  1: "Οὕτως λέγει κύριος — «так говорит Господь»: формула вне кавычек. Ὁ οὐρανός μοι θρόνος — «небо Мне престол» (θρόνος; в тексте 王座); ἡ δὲ γῆ ὑποπόδιον τῶν ποδῶν μου — «земля же подножие ног Моих» (ὑποπόδιον — подножие; в тексте 足台, как в Деян 7:49). ποῖον οἶκον οἰκοδομήσετέ μοι — «какой дом построите Мне» (ποῖος — какой); ἢ ποῖος τόπος τῆς καταπαύσεώς μου — «или какое место покоя Моего» (κατάπαυσις — покой). Стих цитируется в Деян 7:49–50; перевод сверен с act_07 («天はわたしの王座、地はわたしの足台である»), но там формула «と主は言われる» из 66:2 стоит после «どんな家を建てるのか»."
  2: "πάντα γὰρ ταῦτα ἐποίησεν ἡ χείρ μου — «ибо всё это сотворила рука Моя»; ἔστιν ἐμὰ πάντα ταῦτα — «и Моё всё это»; λέγει κύριος — «говорит Господь»: в гр. формула в середине стиха, в тексте — там же, внутри цитаты (ср. Деян 7:49). ἐπὶ τίνα ἐπιβλέψω — «на кого воззрю» (ἐπιβλέπω); ἀλλ᾽ ἢ ἐπὶ τὸν ταπεινὸν καὶ ἡσύχιον — «но на смиренного и тихого» (ταπεινός — смиренный; ἡσύχιος — тихий, спокойный); τρέμοντα τοὺς λόγους μου — «трепещущего слов Моих» (τρέμω — трепетать, в тексте 震える)."
  3: "ὁ δὲ ἄνομος — «беззаконный» (ἄνομος); ὁ θύων μοι μόσχον — «приносящий Мне тельца» (θύω — закалать; μόσχος — телец); ὡς ὁ ἀποκτέννων κύνα — «как убивающий пса» (ἀποκτέννω); ἀναφέρων σεμίδαλιν — «возносящий семидал» (σεμίδαλις — пшеничная мука; в тексте 素祭); ὡς αἷμα ὕειον — «как кровь свиную» (ὕειος — свиной); διδοὺς λίβανον εἰς μνημόσυνον — «дающий ливан в память» (λίβανος — ладан); ὡς βλάσφημος — «как хулитель» (βλάσφημος). ἐξελέξαντο τὰς ὁδούς αὐτῶν — «избрали пути свои»; τὰ βδελύγματα αὐτῶν — «мерзости их» (βδέλυγμα — мерзость)."
  4: "κἀγὼ ἐκλέξομαι τὰ ἐμπαίγματα αὐτῶν — «и Я изберу издевательства их» (ἐμπαίγματα — глумления, издевательства; смысл тёмный, передано буквально; у Син. «употреблю их обольщение» — МТ); τὰς ἁμαρτίας ἀνταποδώσω αὐτοῖς — «грехи воздам им» (ἀνταποδίδωμι); ἐκάλεσα αὐτοὺς καὶ οὐχ ὑπήκουσάν μου — «звал их, и не послушались Меня» (ὑπακούω); ἐλάλησα καὶ οὐκ ἤκουσαν — «говорил, и не услышали»."
  5: "Ἀκούσατε τὸ ῥῆμα κυρίου — «услышьте слово Господне» (ῥῆμα); οἱ τρέμοντες τὸν λόγον αὐτοῦ — «трепещущие слова Его»; εἴπατε, ἀδελφοὶ ἡμῶν, τοῖς μισοῦσιν ἡμᾶς — «скажите: братья наши, — ненавидящим нас» (слова, которые велено сказать, — 「…」, в гр. знаков нет); βδελυσσομένοις — «гнушающимся» (βδελύσσομαι); ἵνα τὸ ὄνομα κυρίου δοξασθῇ καὶ ὀφθῇ ἐν τῇ εὐφροσύνῃ αὐτῶν — «да прославится имя Господне и явится в веселии их»; κἀκεῖνοι αἰσχυνθήσονται — «и они постыдятся» (αἰσχύνω). У МТ иначе: ненавидящие говорят «да прославится Господь, и мы увидим вашу радость»; в LXX это повеление сказать «братья». Держим LXX."
  6: "φωνὴ κραυγῆς ἐκ πόλεως — «голос вопля из города» (κραυγή — вопль); φωνὴ ἐκ ναοῦ — «голос из храма» (ναός — храм); φωνὴ κυρίου ἀνταποδιδόντος ἀνταπόδοσιν — «голос Господа, воздающего воздаяние» (ἀνταπόδοσις); τοῖς ἀντικειμένοις — «противящимся» (ἀντίκειμαι)."
  7: "πρὶν ἢ τὴν ὠδίνουσαν τεκεῖν — «прежде нежели рождающей родить» (ὠδίνω — мучиться родами); πρὶν ἐλθεῖν τὸν πόνον τῶν ὠδίνων — «прежде прихода боли родов» (πόνος — боль); ἐξέφυγεν καὶ ἔτεκεν ἄρσεν — «избежала и родила мужеский пол» (ἐκφεύγω — избегать; ἄρσεν — мужского пола, в тексте 男の子)."
  8: "τίς ἤκουσεν τοιοῦτο — «кто слышал такое»; ἦ ὤδινεν γῆ ἐν μιᾷ ἡμέρᾳ — «разве мучилась земля в один день»; ἐτέχθη ἔθνος εἰς ἅπαξ — «родился народ разом» (εἰς ἅπαξ — сразу, за один раз); ὅτι ὤδινεν καὶ ἔτεκεν Σιων τὰ παιδία αὐτῆς — «ибо Сион мучился родами и родил детей своих» (передано причинным «からである»)."
  9: "ἐγὼ δὲ ἔδωκα τὴν προσδοκίαν ταύτην — «Я же дал это ожидание» (προσδοκία — ожидание); οὐκ ἐμνήσθης μου — «ты не вспомнил Меня»; εἶπεν κύριος — «сказал Господь»: формула вне кавычек, закрывает первую реплику. οὐκ ἰδοὺ ἐγὼ γεννῶσαν καὶ στεῖραν ἐποίησα — «не Я ли сотворил рождающую и бесплодную» (γεννάω — рождать; στεῖρα — бесплодная); εἶπεν ὁ θεός — «сказал Бог»."
  10: "εὐφράνθητι, Ιερουσαλημ — «возвеселись, Иерусалим»; πανηγυρίσατε ἐν αὐτῇ — «торжествуйте в ней» (πανηγυρίζω — праздновать, торжествовать); πάντες οἱ ἀγαπῶντες αὐτήν — «все любящие её»; χάρητε χαρᾷ — «возрадуйтесь радостью»; ὅσοι πενθεῖτε ἐπ᾽ αὐτῆς — «все, плачущие о ней» (πενθέω). Слав. добавляет «и живущии в нем» — в LXX этих слов нет, внесено в основной текст без 〔…〕."
  11: "ἵνα θηλάσητε καὶ ἐμπλησθῆτε — «чтобы вы сосали и насытились» (θηλάζω — сосать; ἐμπίμπλημι — наполнять); ἀπὸ μαστοῦ παρακλήσεως αὐτῆς — «от сосца утешения её» (μαστός — сосец, грудь; παράκλησις — утешение); ἐκθηλάσαντες τρυφήσητε — «нассавшись, насладитесь» (τρυφάω — наслаждаться); ἀπὸ εἰσόδου δόξης αὐτῆς — «от входа славы её»."
  12: "ὅτι τάδε λέγει κύριος — «ибо так говорит Господь»: формула вне кавычек. ἐκκλίνω εἰς αὐτοὺς ὡς ποταμὸς εἰρήνης — «Я склоняюсь к ним, как река мира» (ἐκκλίνω — склонять, направлять; ποταμός — река); ὡς χειμάρρους ἐπικλύζων δόξαν ἐθνῶν — «как поток, заливающий славу народов» (χειμάρρους — зимний поток; ἐπικλύζω — заливать); τὰ παιδία αὐτῶν ἐπ᾽ ὤμων ἀρθήσονται — «дети их на плечах будут носимы» (ὦμος — плечо; αἴρω — поднимать); ἐπὶ γονάτων παρακληθήσονται — «на коленях утешены будут» (γόνυ — колено)."
  13: "ὡς εἴ τινα μήτηρ παρακαλέσει — «как если кого мать утешит» (παρακαλέω); οὕτως καὶ ἐγὼ παρακαλέσω ὑμᾶς — «так и Я утешу вас»; ἐν Ιερουσαλημ παρακληθήσεσθε — «в Иерусалиме утешены будете»."
  14: "ὄψεσθε — «увидите»; χαρήσεται ὑμῶν ἡ καρδία — «возрадуется сердце ваше»; τὰ ὀστᾶ ὑμῶν ὡς βοτάνη ἀνατελεῖ — «кости ваши, как трава, произрастут» (ὀστέον — кость; βοτάνη — трава, зелень); γνωσθήσεται ἡ χεὶρ κυρίου τοῖς σεβομένοις αὐτόν — «познана будет рука Господня чтущими Его» (σέβομαι — чтить, бояться); ἀπειλήσει τοῖς ἀπειθοῦσιν — «погрозит непокорным» (ἀπειλέω — угрожать). Син. «на врагов Своих Он разгневается» — по МТ."
  15: "Ἰδοὺ γὰρ κύριος ὡς πῦρ ἥξει — «ибо вот, Господь, как огонь, придёт»; ὡς καταιγὶς τὰ ἅρματα αὐτοῦ — «как буря колесницы Его» (καταιγίς — буря, вихрь; ἅρμα — колесница); ἀποδοῦναι ἐν θυμῷ ἐκδίκησιν — «воздать в ярости отмщение» (ἐκδίκησις — отмщение); ἀποσκορακισμὸν ἐν φλογὶ πυρός — «отвержение в пламени огня» (ἀποσκορακισμός — отбрасывание, отвержение, букв. «бросание воронам»; в тексте 追い払い; слав. «прещение»)."
  16: "ἐν γὰρ τῷ πυρὶ κυρίου κριθήσεται πᾶσα ἡ γῆ — «ибо огнём Господним будет судима вся земля» (κρίνω — судить); ἐν τῇ ῥομφαίᾳ αὐτοῦ πᾶσα σάρξ — «и мечом Его всякая плоть» (ῥομφαία — меч); πολλοὶ τραυματίαι ἔσονται ὑπὸ κυρίου — «многие поражённые будут от Господа» (τραυματίας — поражённый, раненый)."
  17: "οἱ ἁγνιζόμενοι καὶ καθαριζόμενοι — «очищающиеся и освящающиеся» (ἁγνίζω — освящать, очищать; καθαρίζω — очищать); εἰς τοὺς κήπους — «в сады»; ἐν τοῖς προθύροις — «в преддвериях» (πρόθυρον — передний двор, притвор; в тексте 前庭); ἔσθοντες κρέας ὕειον — «едящие мясо свиное»; τὰ βδελύγματα καὶ τὸν νῦν — «мерзости и мышь» (νῦν — мышь); ἐπὶ τὸ αὐτὸ ἀναλωθήσονται — «вместе истребятся» (ἀναλίσκω — истреблять); εἶπεν κύριος — «сказал Господь» (в конце стиха, вне кавычек)."
  18: "κἀγὼ τὰ ἔργα αὐτῶν καὶ τὸν λογισμὸν αὐτῶν ἐπίσταμαι — «и Я знаю дела их и помышления их» (λογισμός — помышление); ἔρχομαι συναγαγεῖν πάντα τὰ ἔθνη καὶ τὰς γλώσσας — «иду собрать все народы и языки» (συνάγω; γλῶσσα — язык, в тексте 国語); ἥξουσιν καὶ ὄψονται τὴν δόξαν μου — «придут и увидят славу Мою». Речь Господа начинается без вводной формулы (после авторского 66:15–17)."
  19: "καταλείψω ἐπ᾽ αὐτῶν σημεῖα — «оставлю на них знамения» (σημεῖον — знак); ἐξαποστελῶ ἐξ αὐτῶν σεσῳσμένους — «пошлю из них спасённых» (σεσῳσμένος — спасённый, perfect от σῴζω); εἰς Θαρσις καὶ Φουδ καὶ Λουδ καὶ Μοσοχ καὶ Θοβελ — «в Фарсис, и Фуд, и Луд, и Мосох, и Товел» (формы корпуса: タルシシュ, プド, ルド, モソク, トベル — Быт 10; 1 Пар 1); εἰς τὴν Ἑλλάδα — «в Элладу» (ギリシア); εἰς τὰς νήσους τὰς πόρρω — «на острова дальние» (νῆσος — остров); οἳ οὐκ ἀκηκόασίν μου τὸ ὄνομα — «которые не слышали имени Моего» (ἀκούω, perfect); ἀναγγελοῦσίν μου τὴν δόξαν ἐν τοῖς ἔθνεσιν — «возвестят славу Мою в народах» (ἀναγγέλλω)."
  20: "ἄξουσιν τοὺς ἀδελφοὺς ὑμῶν — «приведут братьев ваших» (ἄγω); δῶρον κυρίῳ — «дар Господу» (δῶρον); μεθ᾽ ἵππων καὶ ἁρμάτων — «с конями и колесницами» (ἵππος — конь; ἅρμα — колесница); ἐν λαμπήναις ἡμιόνων — «в носилках [повозках] мулов» (λαμπήνη — крытая повозка, носилки; ἡμίονος — мул; в тексте らばの輿); μετὰ σκιαδίων — «с навесами [балдахинами]» (σκιάδιον — тенистый навес; в тексте 日よけの天蓋); εἰς τὴν ἁγίαν πόλιν Ιερουσαλημ — «в святой город Иерусалим»; ὡς ἂν ἐνέγκαισαν οἱ υἱοὶ Ισραηλ ἐμοὶ τὰς θυσίας αὐτῶν μετὰ ψαλμῶν — «как приносили сыны Израиля Мне жертвы свои с псалмами» (φέρω — приносить; ψαλμός — псалом, в тексте 歌). εἶπεν κύριος — «сказал Господь»: в гр. формула в середине стиха, в тексте — там же, внутри цитаты."
  21: "ἀπ᾽ αὐτῶν λήμψομαι ἐμοὶ ἱερεῖς καὶ Λευίτας — «из них возьму Себе священников и левитов» (λαμβάνω; Λευίτης — левит); εἶπεν κύριος — «сказал Господь» (в конце стиха, вне кавычек)."
  22: "ὃν τρόπον γὰρ ὁ οὐρανὸς καινὸς καὶ ἡ γῆ καινή — «как новое небо и новая земля»; ἃ ἐγὼ ποιῶ — «которые Я творю»; μένει ἐνώπιόν μου — «пребывают предо Мною» (μένω); λέγει κύριος — «говорит Господь»: в гр. формула в середине стиха, в тексте перенесена в конец ради порядка японского предложения; οὕτως στήσεται τὸ σπέρμα ὑμῶν καὶ τὸ ὄνομα ὑμῶν — «так станет семя ваше и имя ваше» (ἵστημι — стоять, стоять твёрдо)."
  23: "ἔσται μῆνα ἐκ μηνὸς καὶ σάββατον ἐκ σαββάτου — «будет месяц от месяца и суббота от субботы» (μήν — месяц; σάββατον — суббота, в тексте 安息日); ἥξει πᾶσα σὰρξ ἐνώπιόν μου προσκυνῆσαι — «придёт всякая плоть предо Мною поклониться» (προσκυνέω — поклоняться, в тексте 礼拝する); ἐν Ιερουσαλημ — «в Иерусалиме»; εἶπεν κύριος — «сказал Господь» (в конце стиха, вне кавычек)."
  24: "ἐξελεύσονται καὶ ὄψονται — «выйдут и увидят» (ἐξέρχομαι); τὰ κῶλα τῶν ἀνθρώπων — «трупы [члены] человеков» (κῶλον — член, труп; слав. «трупы», в тексте 屍); τῶν παραβεβηκότων ἐν ἐμοί — «преступивших против Меня» (παραβαίνω — преступать); ὁ σκώληξ αὐτῶν οὐ τελευτήσει — «червь их не умрёт» (σκώληξ — червь; τελευτάω — умирать, оканчиваться; ср. Мк 9:48 «彼らを食らう虫も死なず、火も消えない»); τὸ πῦρ αὐτῶν οὐ σβεσθήσεται — «огонь их не угаснет» (σβέννυμι — гасить); ἔσονται εἰς ὅρασιν πάσῃ σαρκί — «будут в зрелище всякой плоти» (ὅρασις — видение, зрелище; в тексте すべての肉が目にするもの; слав. «в позор»). Последний стих книги — не сглажен."
