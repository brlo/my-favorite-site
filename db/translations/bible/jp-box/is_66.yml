# jp-box, Исаия, глава 66. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 66 — 15 стихов из 24, в выгрузку не входил;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 66: 1–2 «небо — престол Мой»: дом и место покоя, рука, сотворившая всё,
# смиренный и трепещущий; 3–4 беззаконник, тельцы и псы, семидал и свиная кровь,
# избранные пути; 5 «скажите братьям»: ненавидящие и гнушающиеся; 6 голос из
# города и храма; 7–9 роды Сиона прежде болей, «не Я ли сотворил рождающую»;
# 10–11 «веселись, Иерусалим», сосцы утешения; 12–14 река мира, дети на плечах,
# мать и кости как трава; 15–17 огонь и меч, очищающиеся в садах; 18–21
# собрание народов, знамение, спасённые в Фарсис, Фуд, Луд, Мосох, Товел,
# Элладу, священники и левиты; 22–23 новое небо и новая земля, месяц от месяца;
# 24 последний стих книги: трупы преступивших, «червь их не умрёт».
# Голоса: 66:1–4 речь Господа — 「…» (формула 66:1 вне кавычек, λέγει κύριος
# в 66:2 — внутри цитаты, как в Деян 7:49); 66:5 — слово вестника (вне кавычек)
# и слова, которые велено сказать, — 「…」; 66:6–8 авторский текст; 66:9 — две
# реплики Господа с формулами «と主は言われる」「と神は言われる»; 66:10–11
# гимнический призыв — без кавычек; 66:12–14 речь Господа (формула 66:12 вне
# кавычек); 66:15–17 авторский текст; 66:18–24 речь Господа, начинается без
# вводной формулы (λέγει κύριος в 66:20 внутри, в 66:21 — в конце стиха);
# 66:22–24 — отдельные реплики с формулой в конце (в 66:22 в гр. она в середине).
# Нумерация по gr: 24 стиха; у csl и ru тоже 24. 66:24 — последний стих книги,
# не сглажен («червь их не умрёт», «огонь не угаснет»; ср. Мк 9:48).
# Паритет: 66:10 слав. добавление «и живущии в нем» (нет в LXX) внесено без 〔…〕.
# 66:5 — по LXX, у МТ иначе (см. notes). 〔…〕 нет.
# Сносок ⟨…⟩ нет: 王座, 足台, 素祭, 天蓋, 輿, 鼠, 屍 уже в корпусе.
# Имена — транслитерация греческого (LXX), формы корпуса (Быт 10; 1 Пар 1):
# タルシシュ (Θαρσις), プド (Φουδ), ルド (Λουδ), モソク (Μοσοχ), トベル (Θοβελ),
# ギリシア (Ἑλλάς).

