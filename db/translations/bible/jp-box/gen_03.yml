# jp-box, Бытие, глава 3. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 3: искушение (1–5), падение (6–7), суд Божий (8–13), проклятия (14–19),
# имя жены и одежды (20–21), изгнание из рая (22–24).
# Красного и синего нет; речь Бога и людей — 「…」, вложенная цитата — 『…』 (3:1, 3:3, 3:11, 3:17).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). В 3:15 у LXX τηρήσει —
# «блюсти/стеречь» (слав. «блюсти»), а не «поражать»; перевод держится греческого.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

