verses:
  1: "蛇[へび]は、主[しゅ]なる神[かみ]が造[つく]られた地[ち]のすべての獣[けもの]の中[なか]で、最[もっと]も賢[かしこ]い者[もの]であった。蛇[へび]は女[おんな]に言[い]った。「神[かみ]が『園[その]のどの木[き]からも食[た]べてはならない』と言[い]われたとは、どういうことか。」"
  2: "女[おんな]は蛇[へび]に言[い]った。「わたしたちは園[その]の木[き]の実[み]を食[た]べることができる。"
  3: "園[その]の真[ま]ん中[なか]にある木[き]の実[み]については、神[かみ]は『それから食[た]べてはならない。それに触[さわ]れてもならない。死[し]なないためである』と言[い]われた。」"
  4: "蛇[へび]は女[おんな]に言[い]った。「あなたがたは決[けっ]して死[し]なない。"
  5: "神[かみ]は、あなたがたがそれを食[た]べる日[ひ]にあなたがたの目[め]が開[ひら]き、あなたがたが神[かみ]たちのように善[ぜん]悪[あく]を知[し]る者[もの]となることを、知[し]っておられるのだ。」"
  6: "女[おんな]は、その木[き]が食[た]べるに良[よ]く、目[め]に美[うつく]しく、悟[さと]りを得[え]るのに望[のぞ]ましいと見[み]て、その実[み]を取[と]って食[た]べ、自分[じぶん]とともにいる夫[おっと]にも与[あた]えたので、彼[かれ]も食[た]べた。"
  7: "二人[ふたり]の目[め]は開[ひら]き、自分[じぶん]たちが裸[はだか]であることを知[し]った。そこで、いちじくの葉[は]を縫[ぬ]い合[あ]わせて、自分[じぶん]たちの腰帯[こしおび]を作[つく]った。"
  8: "夕暮[ゆうぐ]れに、主[しゅ]なる神[かみ]が園[その]を歩[ある]かれる声[こえ]を聞[き]いて、アダムとその妻[つま]は、主[しゅ]なる神[かみ]の顔[かお]から身[み]を隠[かく]し、園[その]の木[き]の間[あいだ]に潜[ひそ]んだ。"
  9: "主[しゅ]なる神[かみ]はアダムを呼[よ]んで言[い]われた。「アダム、あなたはどこにいるのか。」"
  10: "彼[かれ]は言[い]った。「園[その]の中[なか]を歩[ある]かれるあなたの声[こえ]を聞[き]き、裸[はだか]であるので恐[おそ]れて身[み]を隠[かく]した。」"
  11: "神[かみ]は言[い]われた。「あなたが裸[はだか]であることを、誰[だれ]があなたに告[つ]げたのか。わたしが『これだけは食[た]べてはならない』と命[めい]じた木[き]から、あなたは食[た]べたのか。」"
  12: "アダムは言[い]った。「あなたがわたしに与[あた]えられた女[おんな]が、その木[き]の実[み]をわたしに与[あた]えたので、わたしは食[た]べた。」"
  13: "主[しゅ]なる神[かみ]は女[おんな]に言[い]われた。「これは何[なん]ということをしたのか。」女[おんな]は言[い]った。「蛇[へび]がわたしを騙[だま]したので、わたしは食[た]べた。」"
  14: "主[しゅ]なる神[かみ]は蛇[へび]に言[い]われた。「あなたがこのことをしたので、あなたはすべての家畜[かちく]と地[ち]のすべての獣[けもの]の中[なか]で呪[のろ]われている。あなたは胸[むね]と腹[はら]で這[は]い、一生[いっしょう]の間[あいだ]、土[つち]を食[た]べる。"
  15: "わたしはあなたと女[おんな]との間[あいだ]、あなたの子孫[しそん]と女[おんな]の子孫[しそん]との間[あいだ]に敵意[てきい]を置[お]く。彼[かれ]はあなたの頭[あたま]を見張[みは]り、あなたは彼[かれ]のかかとを見張[みは]る。」"
  16: "女[おんな]には言[い]われた。「わたしはあなたの苦[くる]しみと嘆[なげ]きを大[おお]いに増[ふ]やす。あなたは苦[くる]しみのうちに子[こ]を産[う]む。あなたの向[む]かうところは夫[おっと]にあり、彼[かれ]はあなたを治[おさ]める。」"
  17: "アダムには言[い]われた。「あなたが妻[つま]の声[こえ]を聞[き]き、わたしが『これだけは食[た]べてはならない』と命[めい]じた木[き]から食[た]べたので、地[ち]はあなたの行[おこな]いのゆえに呪[のろ]われる。あなたは一生[いっしょう]の間[あいだ]、苦[くる]しみのうちに地[ち]の実[み]を食[た]べる。"
  18: "地[ち]はあなたのために茨[いばら]と薊[あざみ]を生[は]えさせ、あなたは野[の]の草[くさ]を食[た]べる。"
  19: "あなたは顔[かお]に汗[あせ]してパンを食[た]べ、ついに、あなたが取[と]られた地[ち]に帰[かえ]る。あなたは土[つち]であり、土[つち]に帰[かえ]るからである。」"
  20: "アダムはその妻[つま]を命[いのち]と名[な]づけた。彼女[かのじょ]はすべて生[い]きる者[もの]の母[はは]だからである。"
  21: "主[しゅ]なる神[かみ]はアダムとその妻[つま]のために皮[かわ]の衣[ころも]を作[つく]り、彼[かれ]らに着[き]せられた。"
  22: "神[かみ]は言[い]われた。「見[み]よ、アダムはわたしたちの一[ひと]りのようになり、善[ぜん]悪[あく]を知[し]る者[もの]となった。今[いま]、彼[かれ]が手[て]を伸[の]べて命[いのち]の木[き]から取[と]って食[た]べ、永遠[えいえん]に生[い]きることのないように。」"
  23: "主[しゅ]なる神[かみ]は彼[かれ]を楽[たの]しみの園[その]から追[お]い出[だ]し、彼[かれ]が取[と]られた地[ち]を耕[たがや]させられた。"
  24: "アダムを追[お]い出[だ]し、楽[たの]しみの園[その]の向[む]かいに住[す]まわせ、ケルビムと、自[みずか]ら回[まわ]る炎[ほのお]の剣[つるぎ]を置[お]いて、命[いのち]の木[き]への道[みち]を守[まも]らせられた。"

notes:
  1: "φρονιμώτατος — 最も賢い (φρόνιμος — «разумный, рассудительный»; Син. «хитрее» — с евр.). ὧν ἐποίησεν κύριος ὁ θεός — 主なる神が造られた. Τί ὅτι… — どういうことか (букв. «что, что сказал Бог»). Вложенная цитата — 『…』."
  2: "Ἀπὸ καρποῦ ξύλου τοῦ παραδείσου φαγόμεθα — 園の木の実を食べることができる (букв. «от плода дерева райского будем есть»)."
  3: "ἐν μέσῳ τοῦ παραδείσου — 園の真ん中. οὐ φάγεσθε… οὐδὲ μὴ ἅψησθε — 食べてはならない、触れてもならない (запрет прикосновения есть у LXX; в заповеди 2:17 его не было). ἵνα μὴ ἀποθάνητε — 死なないため."
  4: "Οὐ θανάτῳ ἀποθανεῖσθε — 決して死なない (букв. «смертью не умрёте»; сильное отрицание)."
  5: "ᾔδει γὰρ ὁ θεός — 神は…知っておられるのだ (ᾔδει, plusquamperfect). διανοιχθήσονται ὑμῶν οἱ ὀφθαλμοί — 目が開き. ὡς θεοὶ γινώσκοντες — 神たちのように善悪を知る者 (LXX мн. ч. θεοί; сохранено)."
  6: "καλὸν… εἰς βρῶσιν — 食べるに良く. ἀρεστὸν τοῖς ὀφθαλμοῖς ἰδεῖν — 目に美しく. ὡραῖόν ἐστιν τοῦ κατανοῆσαι — 悟りを得るのに望ましい (κατανοέω — «уразуметь»; слав. «красно есть, еже разумети»). ἔδωκεν καὶ τῷ ἀνδρὶ αὐτῆς μετ᾿ αὐτῆς — 自分とともにいる夫にも与えた."
  7: "διηνοίχθησαν οἱ ὀφθαλμοὶ τῶν δύο — 二人の目は開き. περιζώματα — 腰帯 (περίζωμα, «опоясание»)."
  8: "τὴν φωνὴν κυρίου τοῦ θεοῦ περιπατοῦντος — 主なる神が歩かれる声 (φωνή — «голос, звук»). τὸ δειλινόν — 夕暮れに (от δείλη, «пополудни, вечер»). ἀπὸ προσώπου — 顔から, т. е. от присутствия."
  9: "ἐκάλεσεν… καὶ εἶπεν — 呼んで言われた. ποῦ εἶ; — どこにいるのか."
  10: "Τὴν φωνήν σου ἤκουσα — あなたの声を聞き. ἐφοβήθην — 恐れた. ὅτι γυμνός εἰμι — 裸であるので."
  11: "Τίς ἀνήγγειλέν σοι — 誰が告げたのか. μὴ ἀπὸ τοῦ ξύλου… ἔφαγες; — не от дерева ли… ел? (вопрос с μή, ожидает «да»). Вложенная заповедь — 『…』."
  12: "Ἡ γυνή, ἣν ἔδωκας μετ᾿ ἐμοῦ — あなたがわたしに与えられた女 (μετ᾿ ἐμοῦ — «со мною»). αὕτη μοι ἔδωκεν — 彼女がわたしに与えた."
  13: "Τί τοῦτο ἐποίησας; — これは何ということをしたのか. ἠπάτησέν με — 騙した (ἀπατάω)."
  14: "ἐπικατάρατος σὺ ἀπὸ πάντων τῶν κτηνῶν — すべての家畜の中で呪われている (ἀπό — «из числа»). ἐπὶ τῷ στήθει σου καὶ τῇ κοιλίᾳ πορεύσῃ — 胸と腹で這い (букв. «на груди и чреве пойдёшь»). γῆν φάγῃ — 土を食べる."
  15: "ἔχθραν θήσω — 敵意を置く. ἀνὰ μέσον — между. αὐτός σου τηρήσει κεφαλήν — 彼はあなたの頭を見張り (τηρέω — «стеречь, хранить»; Син. «поражать», jp-joc «сокрушить» — с евр.; у LXX и слав. «блюсти»). σὺ τηρήσεις αὐτοῦ πτέρναν — あなたは彼のかかとを見張る (πτέρνα — «пята»)."
  16: "Πληθύνων πληθυνῶ — 大いに増やす (усилительное сочетание). τὸν στεναγμόν σου — あなたの嘆き (LXX добавляет «вздохи»). ἐν λύπαις τέξῃ τέκνα — 苦しみのうちに子を産む. πρὸς τὸν ἄνδρα σου ἡ ἀποστροφή σου — あなたの向かうところは夫にあり (ἀποστροφή — «обращение»; Син. «влечение»). αὐτός σου κυριεύσει — 彼はあなたを治める."
  17: "Ὅτι ἤκουσας τῆς φωνῆς τῆς γυναικὸς σου — 妻の声を聞いたので. ἐπικατάρατος ἡ γῆ ἐν τοῖς ἔργοις σου — 地はあなたの行いのゆえに呪われる (ἐν — «в»; слав. «в делех твоих»). ἐν λύπαις φάγῃ αὐτήν — 苦しみのうちに地の実を食べる."
  18: "ἀκάνθας καὶ τριβόλους — 茨と薊. ἀνατελεῖ σοι — あなたのために生えさせる. χόρτον τοῦ ἀγροῦ — 野の草."
  19: "ἐν ἱδρῶτι τοῦ προσώπου σου — 顔に汗して. ἄρτον — パン (букв. «хлеб»). ἕως τοῦ ἀποστρέψαι σε — ついに…帰るまで. γῆ εἶ καὶ εἰς γῆν ἀπελεύσῃ — 土であり、土に帰る."
  20: "Ζωή — 命 (LXX: «назвал жену Жизнью», а не «Евой»; слав. «жизнь», jp-joc 生命[エワ]; евр./Син. «Ева» — масоретское чтение, в текст не внесено). μήτηρ πάντων τῶν ζώντων — すべて生きる者の母. Имя エバ появляется в 4:1 и 4:25 (Ευα)."
  21: "χιτῶνας δερματίνους — 皮の衣 (χιτών — «рубаха, одежда»). ἐνέδυσεν — 着せられた."
  22: "γέγονεν ὡς εἷς ἐξ ἡμῶν — わたしたちの一人のようになった. μήποτε ἐκτείνῃ… — 手を伸ばして…することのないように (μήποτε — «как бы не»; фраза и в греч. обрывается). ζήσεται εἰς τὸν αἰῶνα — 永遠に生きる."
  23: "ἐξαπέστειλεν — 追い出した (ἐξαποστέλλω). παράδεισος τῆς τρυφῆς — 楽しみの園 (τρυφή — «наслаждение, роскошь»; слав. «рай сладости»). ἐργάζεσθαι τὴν γῆν — 地を耕すため."
  24: "ἐξέβαλεν… κατῴκισεν — 追い出し…住まわせた. ἀπέναντι — 向かいに (LXX без «на востоке»; Син. «на востоке» — с евр.). χερουβιμ — ケルビム (сноска уже есть в Евр 9:5, не повторяю). φλογίνην ῥομφαίαν τὴν στρεφομένην — 炎の剣、自ら回る (ῥομφαία — «меч»). φυλάσσειν τὴν ὁδόν — 道を守る."
