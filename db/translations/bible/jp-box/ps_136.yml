verses:
  0: "ダビデの詩[うた]。"
  1: "バビロンの川[かわ]のほとりに、わたしたちは座[すわ]り、シオンを思[おも]い起[おこ]したときに泣[な]いた。"
  2: "そのただ中[なか]の柳[やなぎ]の木[き]に、わたしたちは楽器[がっき]を掛[か]けた。"
  3: "そこでは、わたしたちを捕虜[ほりょ]にした者[もの]たちが歌[うた]の言葉[ことば]を求[もと]め、わたしたちを連[つ]れ去[さ]った者[もの]たちが賛美[さんび]の歌[うた]を求[もと]めて言[い]った。「シオンの歌[うた]の中[なか]から、わたしたちに歌[うた]え」と。"
  4: "どうして、異[い]国の地[ち]で主[しゅ]の歌[うた]を歌[うた]うことができるだろうか。"
  5: "エルサレムよ、もしわたしがあなたを忘[わす]れるなら、わたしの右[みぎ]の手[て]も忘[わす]れてしまえ。"
  6: "もしわたしがあなたを思[おも]い起[おこ]さず、エルサレムをわたしの喜[よろこ]びの初[はじ]めに置[お]かないなら、わたしの舌[した]はのどに貼[は]り付[つ]いてしまえ。"
  7: "主[しゅ]よ、エルサレムの日[ひ]に、エドムの子[こ]らが「崩[くず]せ、崩[くず]せ、基[もと]まで」と言[い]ったことを思[おも]い起[おこ]してください。"
  8: "惨[みじ]めなバビロンの娘[むすめ]よ。幸[さいわ]いなのは、あなたがわたしたちにした仕打[しう]ちを、あなたに報[むく]いる者[もの]である。"
  9: "幸[さいわ]いなのは、あなたの幼[おさな]子[ご]たちをつかんで、岩[いわ]に打[う]ちつける者[もの]である。"

notes:
  0: "Τῷ Δαυιδ — «Давида»; ダビデの詩 (ψαλμός подразумевается, как в надписаниях Пс 2 и 24). Надписание — стих 0, скобками не маркируется."
  1: "Ἐπὶ τῶν ποταμῶν Βαβυλῶνος — バビロンの川のほとりに (ἐπί с род. — «при, у»). ἐκεῖ ἐκαθίσαμεν — わたしたちは座り (καθίζω — «сидеть, садиться»). ἐκλαύσαμεν ἐν τῷ μνησθῆναι ἡμᾶς τῆς Σιων — シオンを思い起こしたときに泣いた (ἐν τῷ + inf. — «при воспоминании»; μιμνῄσκομαι — «вспоминать»). Два глагола — сели и плакали — сохранены в одном стихе."
  2: "ἐπὶ ταῖς ἰτέαις ἐν μέσῳ αὐτῆς — そのただ中の柳の木に (ἰτέα — «ива, верба»). ἐκρεμάσαμεν τὰ ὄργανα ἡμῶν — 楽器を掛けた (κρεμάννυμι — «вешать»; ὄργανον — «инструмент»)."
  3: "οἱ αἰχμαλωτεύσαντες ἡμᾶς — 捕虜にした者たち (αἰχμαλωτεύω — «брать в плен»). ἐπηρώτησαν… λόγους ᾠδῶν — 歌の言葉を求めた (ἐπερωτάω — «спрашивать, требовать»). οἱ ἀπαγαγόντες ἡμᾶς ὕμνον — 連れ去った者たちが賛美の歌を (ἀπάγω — «уводить»; ὕμνος — «гимн, хвалебная песнь»). Ἄισατε ἡμῖν ἐκ τῶν ᾠδῶν Σιων — 「シオンの歌の中から、わたしたちに歌え」. Слова пленителей — 「」."
  4: "πῶς ᾄσωμεν — どうして…歌うことができるだろうか (вопрос без ответа; ᾄδω — «петь»). ἐπὶ γῆς ἀλλοτρίας — 異国の地で (ἀλλότριος — «чужой»)."
  5: "ἐὰν ἐπιλάθωμαί σου, Ιερουσαλημ — エルサレムよ、もしわたしがあなたを忘れるなら (ἐπιλανθάνομαι — «забывать»). ἐπιλησθείη ἡ δεξιά μου — 右の手も忘れてしまえ (оптатив, клятвенное пожелание; повтор корня ἐπιλαθ- сохранён)."
  6: "κολληθείη ἡ γλῶσσά μου τῷ λάρυγγί μου — 舌がのどに貼り付いてしまえ (κολλάω — «прилеплять»; λάρυγξ — «гортань»). ἐὰν μὴ προανατάξωμαι τὴν Ιερουσαλημ ἐν ἀρχῇ τῆς εὐφροσύνης μου — エルサレムを喜びの初めに置かないなら (προανατάσσομαι — «ставить впереди»; εὐφροσύνη — «веселье, радость»)."
  7: "μνήσθητι, κύριε, τῶν υἱῶν Εδωμ τὴν ἡμέραν Ιερουσαλημ — 主よ、エルサレムの日に、エドムの子らが…と言ったことを思い起こしてください (ἡμέρα Ιερουσαλημ — день падения Иерусалима). Ἐκκενοῦτε ἐκκενοῦτε, ἕως ὁ θεμέλιος ἐν αὐτῇ — 「崩せ、崩せ、基まで」 (ἐκκενόω — «опустошать»; повтор сохранён). Слова Едома — 「」."
  8: "θυγάτηρ Βαβυλῶνος ἡ ταλαίπωρος — 惨めなバビロンの娘 (θυγάτηρ — «дочь», обычное обозначение города; ταλαίπωρος — «злосчастная»). μακάριος ὃς ἀνταποδώσει σοι τὸ ἀνταπόδομά σου — 幸いなのは、あなたに報いる者 (ἀνταποδίδωμι — «воздавать»; внутренний объект ἀνταπόδομα сохранён). ὃ ἀνταπέδωκας ἡμῖν — あなたがわたしたちにした仕打ちを."
  9: "μακάριος ὃς κρατήσει καὶ ἐδαφιεῖ τὰ νήπιά σου πρὸς τὴν πέτραν — 幸いなのは、幼子たちをつかんで岩に打ちつける者 (κρατέω — «хватать, держать»; ἐδαφίζω — «разбивать о землю»; здесь πρὸς τὴν πέτραν — о камень)."
