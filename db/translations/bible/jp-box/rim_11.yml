# jp-box, Послание к Римлянам, глава 11. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 11: остаток по благодати (1–10), падение Израиля и спасение язычников (11–24),
# тайна о полноте язычников и спасении Израиля (25–32), славословие (33–36).
# Красного и синего в главе нет; <j>/<mo> не ставятся. Цитаты Писания — в 『』.
# jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 11
draft: true

verses:
  1: "それでは、わたしは言[い]う。神[かみ]はご自分[じぶん]の民[たみ]を退[しりぞ]けられたのか。決[けっ]してそうではない。わたしもまたイスラエル人[じん]であり、アブラハムの子孫[しそん]、ベニヤミン族[ぞく]の者[もの]であるからである。"
  2: "神[かみ]は、あらかじめ知[し]っておられたご自分[じぶん]の民[たみ]を退[しりぞ]けられたのではない。あなたがたは、エリヤの箇所[かしょ]で聖書[せいしょ]が何[なに]と言[い]っているかを知[し]らないのか。彼[かれ]がイスラエルを神[かみ]に訴[うった]えて言[い]うには、"
  3: "「主[しゅ]よ、彼[かれ]らはあなたの預言者[よげんしゃ]たちを殺[ころ]し、あなたの祭壇[さいだん]を壊[こわ]しました。わたしだけが残[のこ]りましたが、彼[かれ]らはわたしの命[いのち]を求[もと]めているのです。」"
  4: "しかし、神[かみ]の答[こた]えは何[なに]と言[い]われたか。「わたしは、バアル⟨古代[こだい]カナン人[じん]の神[かみ]。⟩に膝[ひざ]を屈[かが]めなかった七千人[ななせんにん]を、わたしのために残[のこ]しておいた。」"
  5: "このように、今[いま]の時[とき]にも、{恵[めぐ]み|恩寵[おんちょう]}の選[えら]びによる残[のこ]りの者[もの]がいるのである。"
  6: "しかし、もし{恵[めぐ]み|恩寵[おんちょう]}によるのであれば、もはや行[おこな]いによるのではない。そうでなければ、{恵[めぐ]み|恩寵[おんちょう]}はもはや{恵[めぐ]み|恩寵[おんちょう]}ではない。〔しかし、もし行[おこな]いによるのであれば、もはやそれは{恵[めぐ]み|恩寵[おんちょう]}ではない。そうでなければ、行[おこな]いはもはや行[おこな]いではない。〕"
  7: "それでは、どうであろうか。イスラエルが求[もと]めているものを、イスラエルは得[え]なかった。しかし、選[えら]ばれた者[もの]たちは得[え]たのであり、ほかの者[もの]たちはかたくなにされたのである。"
  8: "「神[かみ]は彼[かれ]らに、まどろみの霊[れい]と、見[み]えない目[め]と、聞[き]こえない耳[みみ]を与[あた]えて、今日[きょう]に至[いた]っている」と書[か]いてあるとおりである。"
  9: "ダビデも言[い]う。「彼[かれ]らの食卓[しょくたく]が罠[わな]となり、網[あみ]となり、つまずきとなり、報[むく]いとなれ。」"
  10: "「彼[かれ]らの目[め]は暗[くら]んで見[み]えなくなるように、彼[かれ]らの背[せ]は、いつまでも曲[ま]がったままであれ。」"
  11: "それでは、わたしは言[い]う。彼[かれ]らは倒[たお]れるためにつまずいたのか。決[けっ]してそうではない。かえって、彼[かれ]らのつまずきによって救[すく]いが異邦人[いほうじん]に及[およ]び、それは彼[かれ]らを妬[ねた]ませるためであった。"
  12: "もし彼[かれ]らのつまずきが世界[せかい]の富[とみ]となり、彼[かれ]らの衰[おとろ]えが異邦人[いほうじん]の富[とみ]となったのであれば、まして彼[かれ]らの満[み]ちあふれることは、なおさらである。"
  13: "そこで、わたしはあなたがた異邦人[いほうじん]に言[い]う。わたしは異邦人[いほうじん]の使徒[しと]であるから、自分[じぶん]の務[つと]めを重[おも]んじている。"
  14: "そして、どうにかしてわたしの骨肉[こつにく]の者[もの]たちの妬[ねた]みを起[お]こし、そのうちの幾人[いくにん]かを救[すく]いたいと願[ねが]っている。"
  15: "というのは、もし彼[かれ]らの退[しりぞ]けられることが世界[せかい]の和解[わかい]であるなら、彼[かれ]らの受[う]け入[い]れられることは、死者[ししゃ]の中[なか]からの命[いのち]でなくて、何[なに]であろうか。"
  16: "もし初穂[はつほ]が聖[せい]であるなら、かたまり全体[ぜんたい]もそうである。もし根[ね]が聖[せい]であるなら、枝[えだ]もそうである。"
  17: "しかし、もしある枝[えだ]が折[お]り取[と]られ、野生[やせい]のオリーブであるあなたがそこに接[つ]ぎ木[き]⟨野生[やせい]の枝[えだ]を切[き]り、良[よ]い木[き]に接[つ]いで育[そだ]てること。⟩され、オリーブの根[ね]の豊[ゆた]かな養分[ようぶん]にあずかる者[もの]となったのであれば、"
  18: "枝[えだ]たちに対[たい]して誇[ほこ]ってはならない。もし誇[ほこ]るなら、あなたが根[ね]を支[ささ]えているのではなく、根[ね]があなたを支[ささ]えていることを思[おも]いなさい。"
  19: "そこで、あなたは言[い]うだろう。「枝[えだ]が折[お]り取[と]られたのは、わたしが接[つ]ぎ木[き]されるためである。」"
  20: "そのとおりである。彼[かれ]らは不信仰[ふしんこう]によって折[お]り取[と]られ、あなたは信仰[しんこう]によって立[た]っている。高[たか]ぶってはならない。むしろ、恐[おそ]れなさい。"
  21: "神[かみ]が本来[ほんらい]の枝[えだ]を惜[お]しまなかったのであれば、あなたをも惜[おし]しまないであろうからである。"
  22: "だから、神[かみ]の慈[いつく]しみと厳[きび]しさを見[み]なさい。倒[たお]れた者[もの]たちには厳[きび]しさがあり、あなたには神[かみ]の慈[いつく]しみがある。ただし、あなたがその慈[いつく]しみにとどまるならばのことであり、そうでなければ、あなたも切[き]り落[お]とされるであろう。"
  23: "しかし、彼[かれ]らも、不信仰[ふしんこう]にとどまらないなら、接[つ]ぎ木[き]されるであろう。神[かみ]は彼[かれ]らを再[ふたた]び接[つ]ぎ木[き]することがおできになるからである。"
  24: "というのは、もしあなたが、本来[ほんらい]野生[やせい]のオリーブの木[き]から切[き]り取[と]られ、性質[せいしつ]に反[はん]して良[よ]いオリーブの木[き]に接[つ]ぎ木[き]されたのであれば、まして彼[かれ]ら本来[ほんらい]の枝[えだ]は、自分[じぶん]のオリーブの木[き]に接[つ]ぎ木[き]されることであろう。"
  25: "兄弟[きょうだい]たち、というのは、わたしは、あなたがたがこの奥義[おうぎ]を知[し]らないままでいないように、また、自分[じぶん]で賢[かしこ]い者[もの]と思[おも]い込[こ]まないようにと願[ねが]っているからである。すなわち、イスラエルの一部[いちぶ]に起[お]こったかたくなさは、異邦人[いほうじん]の満数[まんすう]が入[はい]るまで続[つづ]き、"
  26: "そして、そのようにして、イスラエルはすべて救[すく]われるのである。「救[すく]う者[もの]がシオンから来[き]て、ヤコブから不敬[ふけい]を取[と]り除[のぞ]かれる」と書[か]いてあるとおりである。"
  27: "「そして、わたしが彼[かれ]らの罪[つみ]を取[と]り去[さ]るとき、これが彼[かれ]らへの、わたしからの契約[けいやく]である。」"
  28: "福音[ふくいん]について言[い]えば、彼[かれ]らはあなたがたのために敵[てき]であるが、選[えら]びについて言[い]えば、先祖[せんぞ]たちのゆえに愛[あい]されている者[もの]たちである。"
  29: "神[かみ]の賜物[たまもの]と召[め]しとは、取[と]り消[け]されることがないからである。"
  30: "あなたがたがかつて神[かみ]に不従順[ふじゅうじゅん]であったのに、今[いま]は彼[かれ]らの不従順[ふじゅうじゅん]によって憐[あわ]れみを受[う]けたように、"
  31: "彼[かれ]らも今[いま]は不従順[ふじゅうじゅん]であり、それは、あなたがたが受[う]けた憐[あわ]れみによって、彼[かれ]ら自身[じしん]も憐[あわ]れみを受[う]けるためである。"
  32: "神[かみ]はすべての人[ひと]を不従順[ふじゅうじゅん]の中[なか]に閉[と]じ込[こ]めて、すべての人[ひと]を憐[あわ]れもうとされたからである。"
  33: "ああ、神[かみ]の富[とみ]と知恵[ちえ]と知識[ちしき]の深[ふか]さよ。その裁[さば]きはなんと測[はか]り知[し]れず、その道[みち]はなんと究[きわ]め難[がた]いことか。"
  34: "「だれが主[しゅ]の思[おも]いを知[し]ったか。だれが主[しゅ]の助言者[じょげんしゃ]となったか。」"
  35: "「また、だれが主[しゅ]に先[さき]に与[あた]えて、主[しゅ]から報[むく]いを受[う]けることになろうか。」"
  36: "万物[ばんぶつ]は神[かみ]から出[で]、神[かみ]によって成[な]り、神[かみ]に向[む]かってあるからである。神[かみ]に栄光[えいこう]がとこしえにあるように。アーメン。"

notes:
  1: "Λέγω οὖν — «Итак, спрашиваю»; それでは、わたしは言う. φυλῆς Βενιαμείν — ベニヤミン族 (Флп 3:5). μὴ γένοιτο — 決してそうではない (как в 3:4; ср. Лк 20:16)."
  2: "ἐν Ἠλίᾳ — «в (месте об) Илии»; エリヤの箇所で. ἐντυγχάνει — «обращается, жалуется»; 訴えて. 3 Цар 19:10."
  3: "3 Цар 19:10. ζητοῦσιν τὴν ψυχήν μου — «ищут души моей»; 命を求めている."
  4: "3 Цар 19:18. χρηματισμός — «божественный ответ, оракул»; 神の答え. Сноска на バアル — первое упоминание в книге, реалия неочевидна."
  5: "λεῖμμα κατ᾿ ἐκλογὴν χάριτος — «остаток по избранию благодати»; 恵みの選びによる残りの者."
  6: "В базе стих кончается на ἐπεὶ ἡ χάρις οὐκέτι γίνεται χάρις («иначе благодать не была бы уже благодатью»). Западно-византийская вставка εἰ δὲ ἐξ ἔργων, οὐκέτι ἐστὶ χάρις· ἐπεὶ τὸ ἔργον οὐκέτι ἐστὶν ἔργον (Елизаветинская, Синодальный «А если по делам…», jp-joc「若し功に由らば…」) — в 〔…〕. Проверено по базе: ἐξ ἔργων — 1 вхождение (только первое), ἔργον — 0."
  7: "τί οὖν; — それでは、どうであろうか. ἐπωρώθησαν — «ожесточились, окаменели»; かたくなにされた."
  8: "Втор 29:4; Ис 29:10. πνεῦμα κατανύξεως — «дух оцепенения, усыпления»; まどろみの霊."
  9: "Пс 68:23 (69:23). παγίς — 罠; θήρα — «ловля, сеть»; 網; ἀνταπόδομα — 報い."
  10: "Пс 68:24 (69:24). νῶτον — «спина, хребет»; 背. σύγκαμψον — повелительное; 曲がったままであれ."
  11: "μὴ ἔπταισαν ἵνα πέσωσιν; — «неужели преткнулись, чтобы пасть?»; 倒れるためにつまずいたのか. παράπτωμα — «преткновение, падение»; つまずき."
  12: "ἥττημα — «умаление, урон»; 衰え. πλήρωμα — «полнота»; 満ちあふれること. Двойное πόσῳ μᾶλλον — まして…なおさら."
  13: "ἐφ᾿ ὅσον — «поскольку»; …であるから. δοξάζω τὴν διακονίαν — «прославляю служение»; 務めを重んじている (букв. «чту»)."
  14: "εἴ πως — «не возбужу ли как-нибудь»; どうにかして. τὴν σάρκα μου — «плоть мою», то есть родных; 骨肉の者たち."
  15: "ἀποβολή — «отвержение»; 退けられること. πρόσλημψις — «принятие»; 受け入れられること."
  16: "ἀπαρχή — «начаток, первый плод»; 初穂. Сноски нет: 初穂 уже употреблено в 8:23 без сноски. φύραμα — «тесто, смесь»; かたまり."
  17: "ἀγριέλαιος — «дикая маслина»; 野生のオリーブ. ἐγκεντρίζω — «прививать»; 接ぎ木する. Сноска на 接ぎ木 — реалия неочевидна. πιότης — «тук, сочность»; 豊かな養分."
  18: "κατακαυχῶ — «превозноситься, хвалиться против»; 誇る. οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ — порядок и противопоставление сохранены."
  19: "ἐρεῖς — «скажешь»; 言うだろう. ἐγκεντρισθῶ — «чтобы я был привит»."
  20: "καλῶς — «хорошо, верно»; そのとおりである. μὴ ὑψηλὰ φρόνει — «не высокомудрствуй»; 高ぶってはならない."
  21: "κατὰ φύσιν κλάδοι — «природные ветви»; 本来の枝."
  22: "χρηστότης / ἀποτομία — «благость / строгость»; 慈しみ / 厳しさ. ἐὰν ἐπιμένῃς τῇ χρηστότητι — «если пребудешь в благости»; その慈しみにとどまる (в базе без τοῦ θεοῦ — слово не добавлено, 〔…〕 не нужны)."
  23: "ἐὰν μὴ ἐπιμένωσιν τῇ ἀπιστίᾳ — «если не пребудут в неверии»; 不信仰にとどまらない."
  24: "παρὰ φύσιν — «противно природе»; 性質に反して. καλλιέλαιος — «хорошая (благородная) маслина»; 良いオリーブの木."
  25: "μυστήριον — «тайна»; 奥義 (церковный термин, ср. jp-joc「奧義」). πώρωσις ἀπὸ μέρους — «ожесточение отчасти»; 一部に起こったかたくなさ. πλήρωμα τῶν ἐθνῶν — «полнота язычников»; 異邦人の満数. [ἐν] ἑαυτοῖς — в базе в квадратных скобках, 〔…〕 не ставится."
  26: "Ис 59:20. ὁ ῥυόμενος — «Избавляющий»; 救う者. ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ — ヤコブから不敬を取り除かれる."
  27: "Ис 59:21; 27:9. διαθήκη — 契約. Порядок греч. сохранён: сначала «когда сниму», затем «сей завет»."
  28: "κατὰ μὲν τὸ εὐαγγέλιον… κατὰ δὲ τὴν ἐκλογήν — двойное κατά с μέν/δέ сохранено: 福音について言えば…選びについて言えば."
  29: "ἀμεταμέλητα — «непреложны, без раскаяния»; 取り消されることがない."
  30: "ἠπειθήσατε / ἠλεήθητε — «были непослушны / помилованы»; 不従順であった / 憐[あわ]れみを受けた."
  31: "τῷ ὑμετέρῳ ἐλέει — «вашим помилованием»; あなたがたが受けた憐[あわ]れみによって. ἵνα καὶ αὐτοὶ νῦν ἐλεηθῶσιν — 彼ら自身も憐[あわ]れみを受けるため."
  32: "συνέκλεισεν — «заключил»; 閉じ込めて. τοὺς πάντας — «всех»; すべての人, повторено дважды."
  33: "Славословие; βάθος πλούτου καὶ σοφίας καὶ γνώσεως — 富と知恵と知識の深さ. ἀνεξεραύνητα / ἀνεξιχνίαστοι — 測り知れず / 究め難い. Риторика не сглажена."
  34: "Ис 40:13. νοῦς κυρίου — «ум Господень»; 主の思い. σύμβουλος — 助言者."
  35: "Иов 41:3. προέδωκεν — «дал наперёд»; 先に与えて."
  36: "Славословие. ἐξ αὐτοῦ καὶ δι᾿ αὐτοῦ καὶ εἰς αὐτόν — から出、によって成り、に向かってある. Тройной предлог сохранён."
