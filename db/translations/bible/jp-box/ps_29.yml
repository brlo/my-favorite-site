verses:
  0: "ダビデの詩[うた]。宮[きゅう]の奉献[ほうけん]の歌[うた]。"
  1: "主[しゅ]よ、わたしはあなたをあがめる。あなたはわたしを引[ひ]き上[あ]げ、わたしの敵[てき]にわたしの上[うえ]で喜[よろこ]ぶことを許[ゆる]さなかったからである。"
  2: "主[しゅ]、わたしの神[かみ]よ。わたしがあなたに呼[よ]ぶと、あなたはわたしを癒[いや]された。"
  3: "主[しゅ]よ、あなたはわたしの魂[たましい]を陰府[よみ]から上[のぼ]らせ、墓[はか]に下[くだ]る者[もの]らからわたしを救[すく]われた。"
  4: "主[しゅ]の聖[せい]なる者[もの]らよ、主[しゅ]にほめ歌[うた]を歌[うた]え。その聖[せい]なる記念[きねん]をたたえよ。"
  5: "その怒[いか]りは瞬[またた]きの間[あいだ]にすぎず、その御心[みこころ]には命[いのち]がある。夜[よる]には嘆[なげ]きが宿[やど]るが、朝[あさ]には喜[よろこ]びの声[こえ]が響[ひび]く。"
  6: "わたしは安[やす]らかなとき、「わたしは決[けっ]して揺[ゆ]るがない」と言[い]った。"
  7: "主[しゅ]よ、あなたは御心[みこころ]により、わたしの麗[うるわ]しさに力[ちから]を添[そ]えられた。しかし、あなたが御顔[みかお]を隠[かく]されると、わたしは恐[おそ]れ惑[まど]った。"
  8: "主[しゅ]よ、わたしはあなたに呼[よ]び求[もと]め、わたしの神[かみ]に願[ねが]った。"
  9: "「わたしの血[ち]に何[なん]の益[えき]があるのか。わたしが朽[く]ちる所[ところ]に下[くだ]るとき。塵[ちり]があなたをたたえ、あなたの真実[しんじつ]を告[つ]げるだろうか。」"
  10: "主[しゅ]は聞[き]き、わたしをあわれまれた。主[しゅ]はわたしの助[たす]けとなられた。"
  11: "あなたはわたしの嘆[なげ]きを踊[おど]りに変[か]え、わたしの粗布[あらぬの]を裂[やぶ]いて、喜[よろこ]びをわたしに帯[おび]させられた。"
  12: "それは、わたしの栄光[えいこう]があなたにほめ歌[うた]を歌[うた]い、わたしが沈黙[ちんもく]しないためである。主[しゅ]、わたしの神[かみ]よ。わたしはとこしえにあなたをたたえる。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς ᾠδῆς τοῦ ἐγκαινισμοῦ τοῦ οἴκου· τῷ Δαυιδ — в gr-lxx-byz надписание начинается с Εἰς τὸ τέλος, но в славянской («Псалом песни обновления дому Давидова») и русской базе его нет, поэтому не переводим. ᾠδή — «песнь»; ἐγκαινισμός — «обновление, освящение» (о восстановлении дома Давидова). Надписание — стих 0."
  1: "Ὑψώσω σε, κύριε — 主よ、わたしはあなたをあがめる (ὑψόω — «превозносить»). ὅτι ὑπέλαβές με — Ты поднял меня (ὑπολαμβάνω — «подхватывать, поднимать»). οὐκ ηὔφρανας τοὺς ἐχθρούς μου ἐπ᾿ ἐμέ — не дал врагам моим восторжествовать надо мною (εὐφραίνω — «веселить»; букв. «не обрадовал врагов моих из-за меня»)."
  2: "κύριε ὁ θεός μου — 主、わたしの神よ. ἐκέκραξα πρὸς σέ, καὶ ἰάσω με — わたしがあなたに呼ぶと、あなたはわたしを癒された (ἰάομαι — «исцелять»); аорист сохранён."
  3: "κύριε, ἀνήγαγες ἐξ ᾅδου τὴν ψυχήν μου — 主よ、あなたはわたしの魂を陰府から上らせ (ᾅδης — 陰府[よみ], как по корпусу). ἔσωσάς με ἀπὸ τῶν καταβαινόντων εἰς λάκκον — 墓に下る者らからわたしを救われた (λάκκος — «ров, могила»)."
  4: "ψάλατε τῷ κυρίῳ, οἱ ὅσιοι αὐτοῦ — 主の聖なる者らよ、主にほめ歌を歌え (ὅσιος — «преподобный, святой»). ἐξομολογεῖσθε τῇ μνήμῃ τῆς ἁγιωσύνης αὐτοῦ — その聖なる記念をたたえよ (μνήμη — «память»; ἁγιωσύνη — «святыня»)."
  5: "ὅτι ὀργὴ ἐν τῷ θυμῷ αὐτοῦ, καὶ ζωὴ ἐν τῷ θελήματι αὐτοῦ — その怒りは瞬きの間にすぎず、その御心には命がある (θυμός — «ярость»; θέλημα — «воля»; слав. «гнев в ярости его, и живот в воли его»). τὸ ἑσπέρας αὐλισθήσεται κλαυθμὸς καὶ εἰς τὸ πρωῒ ἀγαλλίασις — 夜には嘆きが宿るが、朝には喜びの声が響く (αὐλίζομαι — «водворяться на ночь»; ἀγαλλίασις — «ликование»)."
  6: "ἐγὼ δὲ εἶπα ἐν τῇ εὐθηνίᾳ μου — わたしは安らかなとき…と言った (εὐθηνία — «благоденствие, изобилие»). Οὐ μὴ σαλευθῶ εἰς τὸν αἰῶνα — わたしは決して揺るがない. Это слова самого псалмопевца (так же в русской базе, ст. 6), а не речь Бога; поэтому 「」 первого уровня."
  7: "ἐν τῷ θελήματί σου παρέσχου τῷ κάλλει μου δύναμιν — あなたは御心により、わたしの麗しさに力を添えられた (κάλλος — «красота»; слав. «доброте моей»; Синодальный по евр. «Ты укрепил гору мою»). ἀπέστρεψας δὲ τὸ πρόσωπόν σου — あなたが御顔を隠されると. ἐγενήθην τεταραγμένος — わたしは恐れ惑った (ταράσσω — «смущать»)."
  8: "πρὸς σέ, κύριε, κεκράξομαι — 主よ、わたしはあなたに呼び求め. πρὸς τὸν θεόν μου δεηθήσομαι — わたしの神に願った (δέομαι — «умолять»). В греческом стих кончается без точки, и следующая строка продолжает молитву — потому в ст. 9 стоят 「」."
  9: "Τίς ὠφέλεια ἐν τῷ αἵματί μου — わたしの血に何の益があるのか (ὠφέλεια — «польза»). ἐν τῷ καταβῆναί με εἰς διαφθοράν — わたしが朽ちる所に下るとき (διαφθορά — «тление, погибель»). μὴ ἐξομολογήσεταί σοι χοῦς ἢ ἀναγγελεῖ τὴν ἀλήθειάν σου — 塵があなたをたたえ、あなたの真実を告げるだろうか (χοῦς — «прах»; μή вводит ожидание отрицательного ответа). Молитва псалмопевца — 「」."
  10: "ἤκουσεν κύριος καὶ ἠλέησέν με — 主は聞き、わたしをあわれまれた. κύριος ἐγενήθη βοηθός μου — 主はわたしの助けとなられた. В греческом и славянском здесь аорист («услышал»), в Синодальном по евр. — повелительное («услышь»); оставлено греческое чтение."
  11: "ἔστρεψας τὸν κοπετόν μου εἰς χορὸν ἐμοί — あなたはわたしの嘆きを踊りに変え (κοπετός — «плач, сетование»; χορός — «хоровод»). διέρρηξας τὸν σάκκον μου — わたしの粗布を裂いて (σάκκος — вретище; 粗布[あらぬの], как по корпусу). περιέζωσάς με εὐφροσύνην — 喜びをわたしに帯させられた (περιζώννυμι — «опоясывать»)."
  12: "ὅπως ἂν ψάλῃ σοι ἡ δόξα μου — わたしの栄光があなたにほめ歌を歌い (δόξα — «слава», здесь о душе; jp-joc 靈). οὐ μὴ κατανυγῶ — わたしが沈黙しないため (κατανύσσομαι — «сокрушаться, умолкать»). εἰς τὸν αἰῶνα ἐξομολογήσομαί σοι — とこしえにあなたをたたえる."
