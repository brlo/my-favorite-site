# jp-box, Псалтирь, псалом 29. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 29: благодарение за исцеление (1–3), призыв к святым (4–5),
# благоденствие и смущение (6–7), молитва и ответ (8–10), плач обращён в радость (11–12).
# Красного и синего нет. Кавычки: слова псалмопевца в 6 и его молитва в 9 — 「…」
# (речь псалмопевца в кавычки не берётся, поэтому это первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# Сносок ⟨…⟩ нет: 陰府, 粗布, 塵 уже в корпусе.
# jp-ni не использовался.

