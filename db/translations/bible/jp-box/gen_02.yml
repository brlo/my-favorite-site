# jp-box, Бытие, глава 2. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 2: седьмой день (1–3), начало нового раздела (4–6), сотворение человека (7),
# рай и четыре реки (8–14), заповедь о дереве (15–17), жена из ребра (18–25).
# Красного и синего нет: Бог говорит, но это не прямая речь Христа; «<j>» не ставится.
# 〔…〕: 2:4 и 2:5 — «Господь» есть в церковном чтении (csl, jp-joc), но отсутствует
# в gr-lxx-byz (там только ὁ θεός); проверено bracket_check.rb (κυριοσ — НЕТ).
# LXX отличается от масоретского текста в 2:2 (шестой день, а не седьмой), 2:6 (πηγή —
# «источник», а не «пар»), 2:4–5 (одно предложение); перевод с греческого, отличия в notes.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: gen
chapter: 2
draft: true

verses:
  1: "こうして、天[てん]と地[ち]と、そのすべての飾[かざ]りは完成[かんせい]した。"
  2: "神[かみ]は第六[だいろく]の日[ひ]に、ご自分[じぶん]の造[つく]られたすべての業[わざ]を終[お]え、第七[だいしち]の日[ひ]に、そのすべての業[わざ]から休[やす]まれた。"
  3: "神[かみ]は第七[だいしち]の日[ひ]を祝福[しゅくふく]し、その日[ひ]を聖[せい]なるものとされた。神[かみ]が造[つく]り始[はじ]められたすべての業[わざ]から、その日[ひ]に休[やす]まれたからである。"
  4: "これが天[てん]と地[ち]の生成[せいせい]の書[しょ]である。それが生[しょう]じた時[とき]、すなわち、〔主[しゅ]なる〕神[かみ]が天[てん]と地[ち]を造[つく]られた日[ひ]のことである。"
  5: "野[の]の青[あお]草[くさ]はまだ地[ち]に現[あらわ]れておらず、野[の]の草[くさ]はまだ芽[め]を出[だ]していなかった。〔主[しゅ]なる〕神[かみ]は地[ち]に雨[あめ]を降[ふ]らせず、地[ち]を耕[たがや]す人[ひと]もいなかったからである。"
  6: "泉[いずみ]が地[ち]から湧[わ]き上[あ]がり、地[ち]の面[おもて]のすべてを潤[うるお]していた。"
  7: "神[かみ]は地[ち]の塵[ちり]で人[ひと]を形[かたち]づくり、その顔[かお]に命[いのち]の息[いき]を吹[ふ]き入[い]れられた。すると、人[ひと]は生[い]ける魂[たましい]となった。"
  8: "主[しゅ]なる神[かみ]はエデンの園[その]を東[ひがし]の方[ほう]に植[う]え、そこに、形[かたち]づくられた人[ひと]を置[お]かれた。"
  9: "神[かみ]はさらに地[ち]から、見[み]るに美[うつく]しく、食[た]べるに良[よ]いすべての木[き]を生[は]えさせ、園[その]の中央[ちゅうおう]に命[いのち]の木[き]を、また善[ぜん]悪[あく]を知[し]る木[き]を生[は]えさせられた。"
  10: "エデンから川[かわ]が流[なが]れ出[で]て園[その]を潤[うるお]し、そこから分[わ]かれて四[よっ]つの源[みなもと]となった。"
  11: "一[ひと]つ目[め]の名[な]はピソンといい、これがエビラの全[ぜん]地[ち]を巡[めぐ]る者[もの]である。そこに金[きん]がある。"
  12: "その地[ち]の金[きん]は良[よ]い。そこには紅玉[こうぎょく]と緑[みどり]の石[いし]がある。"
  13: "二[ふた]つ目[め]の川[かわ]の名[な]はギオンといい、これがエチオピアの全[ぜん]地[ち]を巡[めぐ]る者[もの]である。"
  14: "三[みっ]つ目[め]の川[かわ]はティグリスといい、アッシリアの前[まえ]を流[なが]れる者[もの]である。四[よっ]つ目[め]の川[かわ]はユーフラテスである。"
  15: "主[しゅ]なる神[かみ]は、形[かたち]づくられた人[ひと]を取[と]って園[その]に置[お]かれた。園[その]を耕[たがや]し、守[まも]るためであった。"
  16: "主[しゅ]なる神[かみ]はアダムに命[めい]じて言[い]われた。「園[その]のどの木[き]の実[み]でも、思[おも]う存分[ぞんぶん]食[た]べてよい。"
  17: "しかし、善[ぜん]悪[あく]を知[し]る木[き]の実[み]は、それから食[た]べてはならない。それから食[た]べる日[ひ]には、あなたは必[かなら]ず死[し]ぬ。」"
  18: "主[しゅ]なる神[かみ]は言[い]われた。「人[ひと]がひとりでいるのは良[よ]くない。わたしは彼[かれ]のために、彼[かれ]にふさわしい助[たす]け手[て]を造[つく]ろう。」"
  19: "神[かみ]はさらに地[ち]から野[の]のすべての獣[けもの]と天[てん]のすべての鳥[とり]を形[かたち]づくり、アダムのもとに連[つ]れて来[こ]られた。アダムがそれらをどう名[な]づけるかを見[み]るためである。アダムが生[い]けるものに名[な]づけた名[な]が、その名[な]となった。"
  20: "アダムはすべての家畜[かちく]、天[てん]のすべての鳥[とり]、野[の]のすべての獣[けもの]に名[な]をつけた。しかし、アダムには、彼[かれ]に似[に]た助[たす]け手[て]は見[み]つからなかった。"
  21: "神[かみ]はアダムに深[ふか]い眠[ねむ]りを下[くだ]し、彼[かれ]が眠[ねむ]ったとき、そのあばら骨[こつ]の一[ひと]つを取[と]り、その跡[あと]を肉[にく]で満[み]たされた。"
  22: "主[しゅ]なる神[かみ]は、アダムから取[と]ったあばら骨[こつ]を女[おんな]に造[つく]り上[あ]げ、彼女[かのじょ]をアダムのもとに連[つ]れて来[こ]られた。"
  23: "アダムは言[い]った。「今[いま]、これこそわたしの骨[ほね]の骨[ほね]、わたしの肉[にく]の肉[にく]である。これこそ女[おんな]と呼[よ]ばれよう。男[おとこ]から取[と]られたからである。」"
  24: "それゆえ、人[ひと]は父[ちち]と母[はは]を離[はな]れ、妻[つま]に結[むす]びつき、二[ふた]りは一[ひと]つの肉[にく]となる。"
  25: "アダムとその妻[つま]は二人[ふたり]とも裸[はだか]であったが、恥[は]じることはなかった。"

notes:
  1: "συνετελέσθησαν — 完成した (συντελέω, «завершать»). ὁ κόσμος αὐτῶν — そのすべての飾り (κόσμος здесь «украшение, убранство»; слав. «украшение», Син. «воинство»; ср. jp-joc 装飾)."
  2: "ἐν τῇ ἡμέρᾳ τῇ ἕκτῃ — в шестой день (масоретский текст и Синодальный: «к седьмому дню»; переводим LXX). κατέπαυσεν — 休まれた (καταπαύω, «прекращать труд»)."
  3: "ηὐλόγησεν… ἡγίασεν — 祝福し…聖なるものとされた. ὧν ἤρξατο ὁ θεὸς ποιῆσαι — 造り始められたすべての業 (LXX добавляет ἤρξατο, «начал»; в масоретском этого нет)."
  4: "βίβλος γενέσεως — 生成の書 (βίβλος — «книга», γένεσις — «происхождение, бытие»). В LXX 4–5 — одно предложение, стих 4 обрывается на «в день, когда…»; по-японски разделено на два, продолжение в 5-м. κύριος в этом стихе у LXX нет (только ὁ θεός); «Господь» — церковное чтение (csl, jp-joc), поэтому 〔主なる〕."
  5: "χλωρὸν ἀγροῦ — 野の青草; χόρτον ἀγροῦ — 野の草 (два синонима, оба сохранены). οὐ γὰρ ἔβρεξεν ὁ θεός — 神は雨を降らせず (βρέχω). κύριος у LXX нет — 〔主なる〕 по церковному чтению."
  6: "πηγὴ δὲ ἀνέβαινεν ἐκ τῆς γῆς — 泉が地から湧き上がり (πηγή — «источник»; jp-joc 霧, Син. «пар» — иное чтение, с LXX не переводим). ἐπότιζεν — 潤していた (ποτίζω, «поить»)."
  7: "ἔπλασεν — 形づくられた (πλάσσω, «лепить», как горшечник; не «сотворил»). χοῦν ἀπὸ τῆς γῆς — 地の塵. πνοὴν ζωῆς — 命の息. εἰς ψυχὴν ζῶσαν — 生ける魂となった (ψυχή — «душа, жизнь»; jp-joc 生ける霊 — неточно)."
  8: "παράδεισον ἐν Εδεμ κατὰ ἀνατολάς — エデンの園を東の方に (букв. «рай в Эдеме, на востоке») (κατὰ ἀνατολάς — «на востоке»; ἐφύτευσεν — «насадил»). ἔθετο — 置かれた."
  9: "ὡραῖον εἰς ὅρασιν — 見るに美しく; καλὸν εἰς βρῶσιν — 食べるに良い. τὸ ξύλον τῆς ζωῆς — 命の木; τὸ ξύλον τοῦ εἰδέναι γνωστὸν καλοῦ καὶ πονηροῦ — 善悪を知る木 (греч. букв. «дерево знания известного добра и зла»; слав. «древо еже ведети разуметелное»; смысл сохранён, не сглажен)."
  10: "ποταμὸς ἐκπορεύεται — 川が流れ出て (historic present у LXX; в переводе прошедшее). ἀφορίζεται εἰς τέσσαρας ἀρχάς — 分かれて四つの源となる (ἀρχή здесь «начало, исток»)."
  11: "Φισων — ピソン (jp-joc フィソン). Ευιλατ — エビラ (Син. Хавила — с евр.). ὁ κυκλῶν — 巡る者 (κυκλόω, «обходить кругом»)."
  12: "ἄνθραξ — 紅玉 (карбункул; jp-joc 紅玉). λίθος ὁ πράσινος — 緑の石 (букв. «зелёный камень»; Син. «оникс» — с евр.; у LXX — «зелёный камень»)."
  13: "Γηων — ギオン (jp-joc ゲヲン). Αἰθιοπίας — エチオピア (LXX; Син. «Куш» — с евр.)."
  14: "Τίγρις — ティグリス; κατέναντι Ἀσσυρίων — アッシリアの前を (κατέναντι — «напротив»). Εὐφράτης — ユーフラテス."
  15: "ἔλαβεν… ἔθετο — 取って…置かれた. ἐργάζεσθαι αὐτὸν καὶ φυλάσσειν — それを耕し、守るため (два инфинитива; αὐτόν — «его», т. е. сад)."
  16: "ἐνετείλατο… λέγων — 命じて言われた. βρώσει φάγῃ — 思う存分食べてよい (букв. «снедию снеси», усилительное сочетание). Речь Бога — 「」, без красного."
  17: "ἀπὸ δὲ τοῦ ξύλου τοῦ γινώσκειν… — 善悪を知る木. οὐ φάγεσθε — не ешьте (в греч. мн. ч., хотя обращено к одному Адаму; в японском ед. ч.). θανάτῳ ἀποθανεῖσθε — 必ず死ぬ (букв. «смертью умрёте»)."
  18: "Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον — 人がひとりでいるのは良くない. ποιήσωμεν — 造ろう (LXX мн. ч., как 1:26; в японском число не выражено). βοηθὸν κατ᾿ αὐτόν — 彼にふさわしい助け手 (κατά — «соответственно»)."
  19: "ἔπλασεν ὁ θεός — 神は…形づくり (в LXX этого стиха нет κύριος; Син. «Господь Бог» — с евр.). ἤγαγεν — 連れて来られた. ἰδεῖν, τί καλέσει — どう名づけるかを見るため. ψυχὴν ζῶσαν — 生けるもの."
  20: "ἐκάλεσεν ὀνόματα — 名をつけた (букв. «назвал имена»). οὐχ εὑρέθη βοηθὸς ὅμοιος αὐτῷ — 彼に似た助け手は見つからなかった (ὅμοιος — «подобный»)."
  21: "В LXX этого стиха только ὁ θεός (без κύριος); jp-joc добавляет 主神, в переводе нет. ἔκστασιν — 深い眠り (ἔκστασις, «исступление, оцепенение»). μίαν τῶν πλευρῶν — あばら骨の一つ (πλευρά — «ребро, бок»). ἀνεπλήρωσεν σάρκα ἀντ᾿ αὐτῆς — その跡を肉で満たされた."
  22: "ᾠκοδόμησεν — 造り上げ (οἰκοδομέω, «строить»; о жене — «устроил»). ἤγαγεν αὐτὴν πρὸς τὸν Αδαμ — アダムのもとに連れて来られた."
  23: "Τοῦτο νῦν ὀστοῦν… — 今、これこそ… (восторженное узнавание). αὕτη κληθήσεται γυνή — 女と呼ばれよう (γυνή — «жена, женщина»; игра слов с ἀνήρ — «муж»). ὅτι ἐκ τοῦ ἀνδρὸς… — 男から取られたから."
  24: "ἕνεκεν τούτου — それゆえ. καταλείψει — 離れ (буд. вр.). προσκολληθήσεται — 結びつき. εἰς σάρκα μίαν — 一つの肉となる."
  25: "γυμνοί — 裸. οὐκ ᾐσχύνοντο — 恥じなかった (αἰσχύνομαι)."
