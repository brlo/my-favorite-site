verses:
  0: "ダビデの詩[うた]。"
  1: "主[しゅ]はわたしの主[しゅ]に言[い]われた。「わたしの右[みぎ]に座[すわ]れ。わたしがあなたの敵[てき]をあなたの足台[あしだい]とするまで」と。"
  2: "主[しゅ]はシオンから、あなたの力[ちから]の杖[つえ]を遣[つか]わされる。あなたは敵[てき]のただ中[なか]で支配[しはい]せよ。"
  3: "あなたの力[ちから]の日[ひ]、聖[せい]なる輝[かがや]きのうちに、あなたとともに支配[しはい]がある。わたしは明[あ]けの明星[みょうじょう]の前[まえ]、母[はは]の胎[たい]からあなたを生[う]んだ。"
  4: "主[しゅ]は誓[ちか]われた。そして、悔[く]やまれることはない。「あなたは永遠[えいえん]に、メルキセデクの位[くらい]に従[したが]う祭司[さいし]である」と。"
  5: "あなたの右[みぎ]におられる主[しゅ]は、その怒[いか]りの日[ひ]に王[おう]たちを砕[くだ]かれる。"
  6: "主[しゅ]は諸国[しょこく]の民[たみ]を裁[さば]き、しかばねで地[ち]を満[み]たし、広[ひろ]い地[ち]にわたって多[おお]くのかしらを砕[くだ]かれる。"
  7: "主[しゅ]は道[みち]のほとりの小川[おがわ]から飲[の]み、それゆえ、その頭[あたま]を高[たか]く上[あ]げられる。"

notes:
  0: "Τῷ Δαυιδ ψαλμός — ダビデの詩 (ψαλμός — 詩). Надписание — стих 0."
  1: "Εἶπεν ὁ κύριος τῷ κυρίῳ μου — 主はわたしの主に言われた (букв. «Сказал Господь Господу моему»). Κάθου ἐκ δεξιῶν μου — わたしの右に座れ (κάθημαι — «сидеть»). ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου — わたしがあなたの敵をあなたの足台とするまで. Слова Господа — 「…」. Красного нет: стих цитируется в Евангелиях как речь Христа (Мф 22:44; Мк 12:36; Лк 20:42; Деян 2:34; Евр 1:13), но в псалме это пророчество (см. журнал решений). Формулировка согласована с Мк 12:36."
  2: "ῥάβδον δυνάμεώς σου ἐξαποστελεῖ κύριος ἐκ Σιων — 主はシオンから、あなたの力の杖を遣わされる (ῥάβδος — «жезл»; ἐξαποστέλλω). κατακυρίευε ἐν μέσῳ τῶν ἐχθρῶν σου — 敵のただ中で支配せよ (κατακυριεύω — «господствовать»)."
  3: "μετὰ σοῦ ἡ ἀρχή — あなたとともに支配がある (ἀρχή — «начало, начальство»). ἐν ἡμέρᾳ τῆς δυνάμεώς σου — あなたの力の日 (у jp-joc и по евр. добавлено «народ твой»; в gr-lxx-byz его нет, поэтому не добавлено). ἐν ταῖς λαμπρότησιν τῶν ἁγίων — 聖なる輝きのうちに (λαμπρότης — «сияние»). ἐκ γαστρὸς πρὸ ἑωσφόρου ἐξεγέννησά σε — 明けの明星の前、母の胎からあなたを生んだ (ἑωσφόρος — «денница, утренняя звезда»; γεννάω — «рождать»)."
  4: "ὤμοσεν κύριος καὶ οὐ μεταμεληθήσεται — 主は誓われた、そして悔やまれることはない (ὀμνύω — «клясться»; μεταμέλομαι — «раскаиваться»). Σὺ εἶ ἱερεὺς εἰς τὸν αἰῶνα κατὰ τὴν τάξιν Μελχισεδεκ — あなたは永遠に、メルキセデクの位に従う祭司である (τάξις — «чин, порядок»; 位 — принятое соответствие, как в Евр 5:6). Слова клятвы — 「…」."
  5: "κύριος ἐκ δεξιῶν σου — あなたの右におられる主 (Господь одесную Тебя). συνέθλασεν ἐν ἡμέρᾳ ὀργῆς αὐτοῦ βασιλεῖς — その怒りの日に王たちを砕かれる (συνθλάω — «сокрушать»)."
  6: "κρινεῖ ἐν τοῖς ἔθνεσιν — 諸国の民を裁き (κρίνω). πληρώσει πτώματα — しかばねで地を満たし (πτῶμα — «труп, падение»). συνθλάσει κεφαλὰς ἐπὶ γῆς πολλῶν — 広い地にわたって多くの頭を砕かれる (в греч. «головы на земле многих»)."
  7: "ἐκ χειμάρρου ἐν ὁδῷ πίεται — 道のほとりの小川から飲み (χείμαρρος — «поток»). διὰ τοῦτο ὑψώσει κεφαλήν — それゆえ、その頭を高く上げられる (ὑψόω — «возвышать»)."
