# jp-box, Псалтирь, псалом 109. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 109: пророчество о Царе-Священнике — седение одесную (1), жезл из Сиона (2),
# рождение прежде денницы (3), клятва о чине Мелхиседека (4), суд над царями (5–7).
# Красного и синего нет: слова Господа Господу моему в 1 и клятва в 4 — пророчество,
# а не евангельская речь Христа; в Евангелиях стих цитируется как речь Христа
# (Мф 22:44; Мк 12:36; Лк 20:42; Деян 2:34; Евр 1:13), но в псалме красного нет.
# Кавычки: слова Господа в 1 и клятва в 4 — 「…」 (первый уровень).
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: メルキセデク уже в корпусе (Евр 5–7), 足台 — в Мк 12:36 / Деян 2:35.
# jp-ni не использовался.

