# jp-box, Послание к Римлянам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: преимущество иудея и верность Бога (1–8), все под грехом (9–20),
# правда Божия и оправдание верою (21–31).
# Красного и синего нет. 〔…〕: 3:22 — церковное καὶ ἐπὶ πάντας.
# Сноска ⟨…⟩ одна: 3:25 宥めの供え物 (ἱλαστήριον). jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 3
draft: true

verses:
  1: "それでは、ユダヤ人[じん]の優[すぐ]れている点[てん]は何[なに]か。割礼[かつれい]の益[えき]は何[なに]か。"
  2: "すべての点[てん]で、大[おお]いにあった。まず第一[だいいち]に、神[かみ]の言葉[ことば]が彼[かれ]らに委[ゆだ]ねられたことである。"
  3: "ある者[もの]たちが信[しん]じなかったとして、どうであろうか。その不信仰[ふしんこう]が神[かみ]の真実[しんじつ]を無[む]に帰[き]すのだろうか。"
  4: "決[けっ]してそうではない。むしろ、神[かみ]は真実[しんじつ]であり、人[ひと]はすべて偽[いつわ]りであるとせよ。「あなたはその言葉[ことば]において正[ただ]しいとされ、裁[さば]かれるときにも勝[か]つ」と書[か]かれているとおりである。"
  5: "しかし、もしわたしたちの不義[ふぎ]が神[かみ]の義[ぎ]を引[ひ]き立[た]てるのなら、何[なに]と言[い]おうか。怒[いか]りを下[くだ]される神[かみ]は不正[ふせい]なのか。（わたしは人[ひと]の言[い]い方[かた]で言[い]っている。）"
  6: "決[けっ]してそうではない。もしそうなら、神[かみ]はどうして世[よ]を裁[さば]くことができるであろうか。"
  7: "なぜなら、もし神[かみ]の真実[しんじつ]が、わたしの偽[いつわ]りによって増[ま]し、神[かみ]の栄光[えいこう]となったのなら、なぜ、わたしはなお罪人[ざいにん]として裁[さば]かれるのか。"
  8: "そして、なぜ「善[ぜん]が来[く]るために悪[あく]を行[おこな]おう」と言[い]わないのか。わたしたちがそう言[い]っていると、ある者[もの]たちは中傷[ちゅうしょう]している。そのような者[もの]たちの裁[さば]きは正[ただ]しい。"
  9: "それでは、どうなのか。わたしたちは優[すぐ]れているのか。決[けっ]してそうではない。わたしたちは、ユダヤ人[じん]もギリシア人[じん]もすべて罪[つみ]の下[した]にあると、すでに訴[うった]えたからである。"
  10: "「義[ぎ]なる者[もの]は一人[ひとり]もいない。"
  11: "悟[さと]る者[もの]もなく、神[かみ]を求[もと]める者[もの]もいない。"
  12: "すべての者[もの]が道[みち]を外[はず]れ、そろって無価値[むかち]な者[もの]となった。善[ぜん]を行[おこな]う者[もの]はなく、ただの一人[ひとり]もいない。"
  13: "彼[かれ]らの喉[のど]は開[ひら]いた墓[はか]、彼[かれ]らの舌[した]は欺[あざむ]き、その唇[くちびる]の下[した]には蝮[まむし]の毒[どく]がある。"
  14: "その口[くち]は呪[のろ]いと苦[にが]さに満[み]ちている。"
  15: "彼[かれ]らの足[あし]は血[ち]を流[なが]すのに速[はや]く、"
  16: "その道[みち]には破壊[はかい]と悲惨[ひさん]があり、"
  17: "平和[へいわ]の道[みち]を知[し]らない。"
  18: "その目[め]の前[まえ]に神[かみ]への恐[おそ]れはない。」"
  19: "わたしたちは知[し]っている。律法[りっぽう]が言[い]うことはすべて、律法[りっぽう]の下[した]にある者[もの]たちに言[い]っているのだ。それは、すべての口[くち]が塞[ふさ]がれ、全世界[ぜんせかい]が神[かみ]の裁[さば]きを受[う]けるべき者[もの]となるためである。"
  20: "なぜなら、律法[りっぽう]の行[おこな]いによっては、肉[にく]なる者[もの]は一人[ひとり]も神[かみ]の前[まえ]に義[ぎ]とされないからである。律法[りっぽう]を通[とお]しては、ただ罪[つみ]の知識[ちしき]が与[あた]えられるからである。"
  21: "しかし今[いま]、律法[りっぽう]とは別[べつ]に、神[かみ]の義[ぎ]が現[あらわ]された。律法[りっぽう]と預言者[よげんしゃ]たちがこれに証[しょう]している。"
  22: "すなわち、イエス・キリストを信[しん]じる信仰[しんこう]による神[かみ]の義[ぎ]であり、信[しん]じるすべての者[もの]に、〔そしてすべての信[しん]じる者[もの]の上[うえ]に〕及[およ]ぶものである。区別[くべつ]はないからである。"
  23: "すべての者[もの]が罪[つみ]を犯[おか]し、神[かみ]の栄光[えいこう]に届[とど]かずにいるからである。"
  24: "そして、キリスト・イエスの中[なか]にある贖[あがな]いによって、神[かみ]の恵[めぐ]みにより、無償[むしょう]で義[ぎ]とされている。"
  25: "神[かみ]はこの方[かた]を、その血[ち]による信仰[しんこう]によって宥[なだ]めの供[そな]え物[もの]⟨「宥[なだ]め」とは、神[かみ]の怒[いか]りを静[しず]めて和解[わかい]をもたらすこと。旧約[きゅうやく]の幕屋[まくや]・神殿[しんでん]の至聖所[しせいしょ]に置[お]かれた「贖[あがな]いの蓋[ふた]」も、このギリシア語[ご]で呼[よ]ばれる。⟩として示[しめ]された。それは、以前[いぜん]に犯[おか]された罪[つみ]が、神[かみ]の寛容[かんよう]のうちに見過[みす]ごされてきたことのゆえに、神[かみ]の義[ぎ]を明[あき]らかにするためであった。"
  26: "そうして、今[いま]の時[とき]に、神[かみ]の義[ぎ]が明[あき]らかにされた。神[かみ]が自[みずか]ら正[ただ]しくあり、しかも、イエスを信[しん]じる者[もの]を義[ぎ]とする方[かた]であるためである。"
  27: "それでは、誇[ほこ]りはどこにあるのか。退[しりぞ]けられたのである。どのような律法[りっぽう]によってか。行[おこな]いの律法[りっぽう]か。そうではなく、信仰[しんこう]の律法[りっぽう]によってである。"
  28: "だから、わたしたちは、人[ひと]が律法[りっぽう]の行[おこな]いとは別[べつ]に、信仰[しんこう]によって義[ぎ]とされることを認[みと]める。"
  29: "それとも、神[かみ]はユダヤ人[じん]だけの神[かみ]であろうか。異邦人[いほうじん]の神[かみ]でもあるのではないか。もちろん、異邦人[いほうじん]の神[かみ]でもある。"
  30: "まことに、神[かみ]は一人[ひとり]である。神[かみ]は、割礼[かつれい]の者[もの]を信仰[しんこう]によって義[ぎ]とし、無割礼[むかつれい]の者[もの]も信仰[しんこう]によって義[ぎ]とされる。"
  31: "それでは、信仰[しんこう]によってわたしたちは律法[りっぽう]を廃[はい]してしまうのか。決[けっ]してそうではない。むしろ、律法[りっぽう]を確[かく]と立[た]てるのである。"

notes:
  1: "περισσόν — «преимущество»; 優れている点. οὖν в вопросе — それでは."
  2: "τὰ λόγια τοῦ θεοῦ — «слова Божии»; 神の言葉. В базе [γὰρ] стоит в квадратных скобках, то есть слово в базе есть, — 〔〕 не ставятся."
  3: "ἀπιστία — 不信仰; καταργήσει — «упразднит»; 無に帰す."
  4: "μὴ γένοιτο — 決してそうではない. Цитата Пс 50:6 (51:4). δικαιωθῇς — 正しいとされ."
  5: "κατὰ ἄνθρωπον λέγω — «по-человечески говорю»; 人の言い方で言っている."
  8: "βλασφημούμεθα — 中傷されている. ὧν τὸ κρίμα ἔνδικον — その裁きは正しい."
  9: "προεχόμεθα — «имеем ли преимущество»; 優れている. προῃτιασάμεθα — «заранее обвинили»; すでに訴えた."
  12: "ἠχρειώθησαν — «стали негодны»; 無価値な者となった."
  13: "Цитаты: Пс 5:10; 139:4; 9:28; Ис 59:7–8; Пс 35:2."
  19: "ὑπόδικος — «подсудный»; 裁きを受けるべき者."
  20: "πᾶσα σάρξ — 肉なる者. ἐπίγνωσις ἁμαρτίας — 罪の知識."
  21: "χωρὶς νόμου — 律法とは別に. μαρτυρουμένη — 証しされている."
  22: "В критической базе εἰς πάντας τοὺς πιστεύοντας; церковный текст (Елизаветинская «во всех и на всех верующих», jp-joc「悉くの信者に…」) удваивает καὶ ἐπὶ πάντας — 〔そしてすべての信じる者の上に〕. οὐ γάρ ἐστιν διαστολή — 区別はない."
  23: "ὑστεροῦνται — «лишены, не достигают»; 届かずにいる."
  24: "δωρεάν — «даром»; 無償で. ἀπολύτρωσις — 贖い (выкуп)."
  25: "ἱλαστήριον — «умилостивление, место умилостивления» (в LXX — крышка ковчега завета, «очистилище»); передано 宥めの供え物, при первом употреблении сноска. πάρεσις — «прощение, прохождение мимо»; 見過ごす. Стихи 25–26 в греч. один период, разбит по стихам."
  26: "ἔνδειξις — «показание, явное доказательство»; 明らかにする. εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα — 自分は正しくあり、しかも義とする者."
  27: "καύχησις — 誇り. ἐξεκλείσθη — «исключена»; 退けられた. διὰ νόμου πίστεως — 信仰の律法によって."
  28: "В критической базе γάρ; церковный текст (Елизаветинская «Ибо мы признаем», jp-joc「故に」) читает οὖν — だから (замена, без 〔〕). χωρὶς ἔργων νόμου — 律法の行いとは別に."
  30: "εἴπερ — «если действительно»; まことに. περιτομή/ἀκροβυστία — 割礼の者/無割礼の者."
  31: "καταργοῦμεν — «упраздняем»; 廃する. ἱστάνομεν — «утверждаем, ставим»; 確と立てる."
