chapter: 81
draft: true

verses:
  0: "アサフの詩[うた]。"
  1: "神[かみ]は神[かみ]々[がみ]の集[つど]いの中[なか]に立[た]ち、神[かみ]々[がみ]の間[あいだ]で裁[さば]きをされる。"
  2: "「いつまで、あなたがたは不正[ふせい]に裁[さば]き、悪[わる]い者[もの]の顔[かお]を立[た]てて裁[さば]くのか。"
  3: "孤[みなしご]と貧[まず]しい者[もの]のために裁[さば]き、苦[くる]しむ者[もの]と乏[とぼ]しい者[もの]に正[ただ]しい裁[さば]きを与[あた]えよ。"
  4: "乏[とぼ]しい者[もの]と貧[まず]しい者[もの]を助[たす]け、悪[わる]い者[もの]の手[て]から救[すく]い出[だ]せ。"
  5: "彼[かれ]らは知[し]らず、悟[さと]らず、闇[やみ]の中[なか]を歩[あゆ]んでいる。地[ち]の基[もと]はすべて揺[ゆ]れ動[うご]く。"
  6: "わたしは言[い]った。あなたがたは神[かみ]々[がみ]であり、あなたがたはみな、いと高[たか]き方[かた]の子[こ]である。"
  7: "しかし、あなたがたは人[ひと]のように死[し]に、支配者[しはいしゃ]の一人[ひとり]のように倒[たお]れる。」"
  8: "神[かみ]よ、立[た]ち上[あ]がって、地[ち]を裁[さば]いてください。あなたがすべての諸国[しょこく]の民[たみ]を嗣業[しぎょう]として受[う]け継[が]れるからです。"

notes:
  0: "В gr-lxx-byz строки 0 нет (стих 1 начинается с Ὁ θεὸς ἔστη). В ru-базе и у jp-joc надписание есть: «Псалом Асафа», アサフの詠 — поставлено стихом 0 по образцу Пс 1 и 72, без 〔…〕 (надписания не маркируются)."
  1: "Ὁ θεὸς ἔστη ἐν συναγωγῇ θεῶν — 神は神々の集いに立ち (συναγωγή — 集い, собрание). ἐν μέσῳ δὲ θεοὺς διακρίνει — 神々の間で裁きをされる (διακρίνω — «судить, разбирать», слав. «посреде же боги разсудит»)."
  2: "Ἕως πότε κρίνετε ἀδικίαν — いつまで、あなたがたは不正に裁き. πρόσωπα ἁμαρτωλῶν λαμβάνετε — 悪い者の顔を立てて裁くのか (λαμβάνειν πρόσωπον — «лицеприятствовать»; ἁμαρτωλός — 悪い者, как в Пс 1). Речь Бога — 「」. διάψαλμα в конце стиха не передаётся."
  3: "κρίνατε ὀρφανὸν καὶ πτωχόν — 孤と貧しい者のために裁き (ὀρφανός — «сирота»; πτωχός — «нищий»). ταπεινὸν καὶ πένητα δικαιώσατε — 苦しむ者と乏しい者に正しい裁きを与えよ (ταπεινός — «угнетённый, смиренный»; πένης — «бедняк»; δικαιόω — «оправдывать, судить по правде»)."
  4: "ἐξέλεσθε πένητα καὶ πτωχόν — 乏しい者と貧しい者を助け (ἐξαιρέω — «избавлять»). ἐκ χειρὸς ἁμαρτωλοῦ ῥύσασθε — 悪い者の手から救い出せ (ῥύομαι — «исторгать»)."
  5: "οὐκ ἔγνωσαν οὐδὲ συνῆκαν — 彼らは知らず、悟らず (συνίημι — «разуметь»). ἐν σκότει διαπορεύονται — 闇の中を歩んでいる. σαλευθήσονται πάντα τὰ θεμέλια τῆς γῆς — 地の基はすべて揺れ動く (θεμέλιος — «основание»; σαλεύω — «колебать»)."
  6: "ἐγὼ εἶπα· Θεοί ἐστε — わたしは言った。あなたがたは神々である. υἱοὶ ὑψίστου πάντες — あなたがたはみな、いと高き方の子である (ὕψιστος — いと高き方, как в Пс 77:17)."
  7: "ὑμεῖς δὲ ὡς ἄνθρωποι ἀποθνῄσκετε — しかし、あなたがたは人のように死に (ἀποθνῄσκω — «умирать»). ὡς εἷς τῶν ἀρχόντων πίπτετε — 支配者の一人のように倒れる (ἄρχων — 支配者; εἷς τῶν ἀρχόντων — «как один из князей»). Конец речи Бога — 」."
  8: "ἀνάστα, ὁ θεός, κρῖνον τὴν γῆν — 神よ、立ち上がって、地を裁いてください (ἀνίστημι — «восставать»). ὅτι σὺ κατακληρονομήσεις ἐν πᾶσιν τοῖς ἔθνεσιν — あなたがすべての諸国の民を嗣業として受け継がれるからです (κατακληρονομέω — «получать в наследие»; 嗣業)."
