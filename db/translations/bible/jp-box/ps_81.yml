# jp-box, Псалтирь, псалом 81. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 81: суд Божий над судьями — Бог стал в сонме богов (1), обличение
# неправедного суда (2), призыв защищать бедного (3–4), слепота судей (5),
# «вы — боги» и смертный приговор (6–7), молитва о суде над землёй (8).
# В gr-lxx-byz строки 0 нет, но в ru-базе и у jp-joc надписание есть
# («Псалом Асафа», アサフの詠) — поставлено стихом 0, без 〔…〕 (по образцу Пс 1 и 72).
# Красного и синего нет. Кавычки: речь Бога — 「…」 с 2 по 7 (первый уровень).
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα, в конце ст. 2) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 集い, 基, 嗣業 уже в корпусе. jp-ni не использовался.

tr_code: jp-box
