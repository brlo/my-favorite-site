# jp-box, Исход, глава 10. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# jp-joc в этой главе отсутствует; ru (с масоретского) — только для понимания, не источник.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 10: восьмая казнь — саранча (1–20), девятая казнь — тьма (21–29).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Кавычки: речь Бога — 「…」 (1–2, 12, 21); речь Моисея и Аарона — 「…» (3–6, 9, 25–26, 29);
# слово Господа в устах Моисея — 『…』 (3–6); речь фараона — 「…» (8, 10–11, 16–17, 24, 28);
# речь слуг фараона — 「…» (7).
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе); отличия csl/МТ — в notes.
# 10:2 — ἐμπαίζω, «посмеяться, поиграть», отсюда 嘲[あざけ]る.
# 10:10 — ἀποσκευή, «имущество, скарб» (слав. «стяжание»); в МТ и Синодальном — «дети».
# 10:13 — νότος, южный ветер (МТ и Синодальный — восточный); 10:19 — ветер с моря (западный).
# 10:21 — ψηλαφητός, «осязаемый».
# Сносок ⟨…⟩ нет: いなご, 暗闇[くらやみ], 燔祭[はんさい] уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 10
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。「ファラオのところへ行[い]きなさい。わたしは彼[かれ]の心[こころ]とその家来[けらい]たちの心[こころ]を頑[かたくな]にした。それは、わたしがこれらのしるしを彼[かれ]らの上[うえ]に次々と行[おこな]うためである。"
  2: "また、わたしがエジプト人[じん]をいかに嘲[あざけ]ったか、わたしが彼[かれ]らの間[あいだ]で行[おこな]ったしるしを、あなたがたの子[こ]どもと孫[まご]たちの耳[みみ]に語[かた]り伝[つた]え、あなたがたが、わたしこそ主[しゅ]であることを知[し]るためである。」"
  3: "モーセとアロンはファラオのところへ行[い]き、彼[かれ]に言[い]った。「ヘブライ人[じん]の神[かみ]である主[しゅ]がこう言[い]われる。『いつまで、あなたはわたしを敬[うやま]うことを拒[こば]むのか。わたしの民[たみ]を去[さ]らせて、わたしに仕[つか]えさせよ。"
  4: "もし、あなたがわたしの民[たみ]を去[さ]らせることを拒[こば]むなら、見[み]よ、わたしは明日[あした]、この時刻[じこく]に、いなごをあなたの全[ぜん]領土[りょうど]に送[おく]る。"
  5: "いなごは地[ち]の面[おもて]を覆[おお]い、地[ち]を見[み]ることもできないほどになる。そして、あなたがたに残[のこ]されているもの、雹[ひょう]が残[のこ]したすべての残[のこ]りを食[た]べ尽[つ]くし、野[の]に育[そだ]つすべての木[き]を食[た]べ尽[つ]くす。"
  6: "それはあなたの家[いえ]、あなたの家来[けらい]たちの家[いえ]、エジプト人[じん]すべての家[いえ]に満[み]ちる。あなたの父[ちち]たちも、その先祖[せんぞ]たちも、この地[ち]に生[う]まれてから今日[こんにち]まで、このようなものを見[み]たことがない。』」モーセは身[み]を翻[ひるがえ]してファラオのところを出[で]た。"
  7: "ファラオの家来[けらい]たちは彼[かれ]に言[い]った。「いつまで、この者[もの]はわたしたちの悩[なや]みの種[たね]になるのでしょうか。この人[ひと]たちを去[さ]らせて、彼[かれ]らの神[かみ]である主[しゅ]に仕[つか]えさせてください。エジプトが滅[ほろ]びたことが、まだおわかりにならないのですか。」"
  8: "モーセとアロンはファラオのところへ連[つ]れ戻[もど]された。ファラオは彼[かれ]らに言[い]った。「行[い]って、あなたがたの神[かみ]に仕[つか]えよ。しかし、行[い]く者[もの]はだれとだれか。」"
  9: "モーセは言[い]った。「わたしたちは若[わか]い者[もの]も年寄[としよ]りも、息子[むすこ]も娘[むすめ]も、羊[ひつじ]も牛[うし]も連[つ]れて行[い]きます。わたしたちの神[かみ]である主[しゅ]の祭[まつ]りがあるからです。」"
  10: "ファラオは彼[かれ]らに言[い]った。「そうか、主[しゅ]があなたがたとともにおられるように。わたしがあなたがたを去[さ]らせるというのに、財産[ざいさん]まで一緒[いっしょ]に持[も]って行[い]くというのか。あなたがたに悪[わる]い企[たくら]みがあることは明[あき]らかだ。"
  11: "そうではない。男[おとこ]たちだけが行[い]って、主[しゅ]に仕[つか]えよ。それがあなたがたの求[もと]めていることだ。」そして、彼[かれ]らはファラオの前[まえ]から追[お]い出[だ]された。"
  12: "主[しゅ]はモーセに言[い]われた。「あなたの手[て]をエジプトの地[ち]に伸[の]ばしなさい。いなごがエジプトの地[ち]に上[あ]がり、地[ち]のすべての草[くさ]と、雹[ひょう]が残[のこ]した木[き]のすべての実[み]を食[た]べ尽[つ]くす。」"
  13: "モーセは杖[つえ]を天[てん]に向[む]かって上[あ]げた。主[しゅ]はその日[ひ]一日[いちにち]、そして一晩中[ひとばんじゅう]、南[みなみ]の風[かぜ]をこの地[ち]に吹[ふ]かせた。朝[あさ]になると、南[みなみ]の風[かぜ]がいなごを運[はこ]んで来[き]た。"
  14: "いなごはエジプトの全土[ぜんど]に上[あ]がり、エジプトの全[ぜん]領土[りょうど]に降[ふ]り立[た]った。その数[かず]は非常[ひじょう]に多[おお]く、これほど多[おお]くのいなごは、以前[いぜん]にはなかったし、これからもない。"
  15: "いなごは地[ち]の面[おもて]を覆[おお]い、地[ち]は打[う]ち滅[ほろ]ぼされた。いなごは地[ち]のすべての草[くさ]と、雹[ひょう]が残[のこ]した木[き]のすべての実[み]を食[た]べ尽[つ]くした。エジプトの全土[ぜんど]で、木[き]にも野[の]の草[くさ]にも、緑[みどり]のものは何[なに]一[ひと]つ残[のこ]らなかった。"
  16: "ファラオは急[いそ]いでモーセとアロンを呼[よ]び、言[い]った。「わたしは、あなたがたの神[かみ]である主[しゅ]と、あなたがたに対して罪[つみ]を犯[おか]した。"
  17: "どうか、今[いま]この一度[いちど]だけ、わたしの罪[つみ]を赦[ゆる]し、あなたがたの神[かみ]である主[しゅ]に祈[いの]って、この死[し]をわたしから取[と]り除[の]いてもらってくれ。」"
  18: "モーセはファラオのところを出[で]て、神[かみ]に祈[いの]った。"
  19: "主[しゅ]は風[かぜ]を、海[うみ]からの非常[ひじょう]に強[つよ]い風[かぜ]に変[か]え、いなごを吹[ふ]き払[はら]って紅海[こうかい]に投[な]げ込[こ]まれた。エジプトの全土[ぜんど]には、いなごが一匹[いっぴき]も残[のこ]らなかった。"
  20: "しかし、主[しゅ]はファラオの心[こころ]を頑[かたくな]にされ、ファラオはイスラエルの子[こ]らを去[さ]らせなかった。"
  21: "主[しゅ]はモーセに言[い]われた。「あなたの手[て]を天[てん]に向[む]かって伸[の]ばしなさい。エジプトの地[ち]に暗闇[くらやみ]が起[お]こり、手[て]で触[さわ]れるほどの暗闇[くらやみ]になる。」"
  22: "モーセは手[て]を天[てん]に向[む]かって伸[の]ばした。すると、エジプトの全土[ぜんど]に、三日間[みっかかん]、暗闇[くらやみ]と濃[こ]い闇[やみ]と嵐[あらし]が起[お]こった。"
  23: "人々[ひとびと]は三日間[みっかかん]、互[たが]いの顔[かお]を見[み]ることも、自分[じぶん]の寝床[ねどこ]から立[た]つこともできなかった。しかし、イスラエルの子[こ]らが住[す]んでいる所[ところ]には、すべて光[ひかり]があった。"
  24: "ファラオはモーセを呼[よ]んで言[い]った。「行[い]って、主[しゅ]に仕[つか]えよ。ただし、あなたがたの羊[ひつじ]と牛[うし]は残[のこ]せ。あなたがたの財産[ざいさん]は、あなたがたと一緒[いっしょ]に行[い]ってよい。」"
  25: "モーセは言[い]った。「いいえ。あなたはわたしたちに、燔祭[はんさい]と犠牲[ぎせい]のためのものも与[あた]えなければなりません。わたしたちはそれを、わたしたちの神[かみ]である主[しゅ]に献[ささ]げるのです。"
  26: "わたしたちの家畜[かちく]も一緒[いっしょ]に行[い]きます。ひづめ一[ひと]つも残[のこ]しはしません。わたしたちはその中[なか]から取[と]って、わたしたちの神[かみ]である主[しゅ]に仕[つか]えるのです。そこへ着[つ]くまで、何[なに]をもって主[しゅ]に仕[つか]えるべきか、わたしたちにはわからないのですから。」"
  27: "しかし、主[しゅ]はファラオの心[こころ]を頑[かたくな]にされ、ファラオは彼[かれ]らを去[さ]らせることを望[のぞ]まなかった。"
  28: "ファラオは彼[かれ]に言[い]った。「わたしの前[まえ]から去[さ]れ。気[き]をつけよ。二度[にど]とわたしの顔[かお]を見[み]ようとするな。わたしの顔[かお]を見[み]る日[ひ]には、お前[まえ]は死[し]ぬ。」"
  29: "モーセは言[い]った。「あなたの言[い]ったとおりです。わたしがあなたの前[まえ]に姿[すがた]を現[あらわ]すことは、もうありません。」"

notes:
  1: "ἐσκλήρυνα — Я ожесточил (актив, субъект — Бог). ἑξῆς — далее, подряд. ἐπέλθῃ — придут."
  2: "διηγήσησθε — расскажете (διηγέομαι). ἐμπέπαιχα — посмеялся, поиграл (ἐμπαίζω); отсюда 嘲[あざけ]った. ἐν αὐτοῖς — над ними, среди них."
  3: "Ἕως τίνος — до каких пор. ἐντραπῆναί με — устыдиться Меня, смириться (ἐντρέπω); отсюда 敬[うやま]うことを拒[こば]む."
  4: "ἐπάγω — навожу. ἀκρίς — саранча (いなご)."
  5: "καλύψει τὴν ὄψιν τῆς γῆς — покроет лицо земли. τὸ περισσόν — остаток. καταλειφθέν — оставленное."
  6: "πλησθήσονται — наполнятся. πρόπαπποι — прадеды. ἐκκλίνας — уклонившись."
  7: "σκῶλον — заноза, соблазн, мучение; отсюда 悩[なや]みの種[たね]. ἀπόλωλεν Αἴγυπτος — Египет погиб."
  8: "ἀπέστρεψαν — вернули. τίνες δὲ καὶ τίνες — кто же и кто (кто именно)."
  9: "νεανίσκοι — юноши. πρεσβύτεροι — старцы. ἑορτὴ κυρίου — праздник Господень."
  10: "Ἔστω οὕτως — пусть будет так (иронично). ἀποσκευή — имущество, скарб (слав. «стяжание»; в МТ и Синодальном — «дети»). πονηρία πρόκειται — злое у вас на уме."
  11: "μὴ οὕτως — не так. οἱ ἄνδρες — только мужчины. ἐξέβαλον — выгнали (актив мн. ч.; в переводе пассив)."
  12: "ἀναβήτω ἀκρίς — пусть взойдёт саранча. καρπός — плод."
  13: "ἐπῆρεν τὴν ῥάβδον — поднял жезл. ἄνεμον νότον — южный ветер (МТ и Синодальный — восточный). ἀνέλαβεν — поднял, понёс."
  14: "κατέπαυσεν — опустилась, легла. προτέρα αὐτῆς — прежде неё."
  15: "ἐφθάρη — погибла, истреблена. χλωρόν — зелёное."
  16: "κατέσπευδεν — поспешил. Ἡμάρτηκα — согрешил."
  17: "προσδέξασθε — примите. περιελέτω τὸν θάνατον — пусть удалит смерть."
  18: "ηὔξατο — помолился."
  19: "μετέβαλεν — переменил. ἄνεμον ἀπὸ θαλάσσης — ветер с моря (западный). ἐρυθρὰ θάλασσα — Чермное море (紅海[こうかい]). οὐχ ὑπελείφθη — не осталось."
  20: "ἐσκλήρυνεν κύριος — Господь ожесточил."
  21: "ψηλαφητὸν σκότος — осязаемая тьма (ψηλαφάω «осязать»)."
  22: "γνόφος — мрак. θύελλα — буря. τρεῖς ἡμέρας — три дня."
  23: "οὐκ εἶδεν — не видел. ἐξανέστη — встал. οἷς κατεγίνοντο — где они находились (καταγίνομαι)."
  24: "Βαδίζετε — идите. ὑπολίπεσθε — оставьте. ἀποσκευή — имущество, скарб (в МТ и Синодальном — «дети»). ἀποτρεχέτω — пусть идёт."
  25: "ὁλοκαυτώματα καὶ θυσίας — всесожжения и жертвы (燔祭[はんさい]と犠牲[ぎせい])."
  26: "ὁπλή — копыто (ひづめ). ἕως τοῦ ἐλθεῖν — до того, как придём."
  27: "ἐσκλήρυνεν — ожесточил. οὐκ ἐβουλήθη — не захотел."
  28: "Ἄπελθε — уйди. πρόσεχε σεαυτῷ — берегись. ᾗ δ᾽ ἂν ἡμέρᾳ — в какой бы день."
  29: "Εἴρηκας — ты сказал. οὐκέτι ὀφθήσομαί σοι εἰς πρόσωπον — больше не явлюсь тебе на лицо."
