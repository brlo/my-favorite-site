verses:
  1: "セデキヤは二十一歳[さい]で王[おう]となり、エルサレムで十一[じゅういち]年[ねん]治[おさ]めた。母[はは]の名[な]はハムタルといい、リブナのエレミヤの娘[むすめ]であった。"
  2: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、ヨヤキムが行[おこな]ったすべてのとおりであった。"
  3: "主[しゅ]の怒[いか]りがエルサレムとユダに下[くだ]り、ついに主[しゅ]は彼らを御顔[みかお]から退[しりぞ]けられた。そしてセデキヤはバビロンの王[おう]に背[そむ]いた。"
  4: "彼の治世[ちせい]の第九年[だいきゅうねん]、第十[だいじゅう]の月[つき]の十日[とおか]に、バビロンの王[おう]ネブカドネツァルが全[ぜん]軍[ぐん]を率[ひき]いてエルサレムに来[き]て、町[まち]に向[む]かって陣[じん]を取[と]り、周[まわ]りに四角[しかく]な石[いし]を積[つ]んで堡塁[ほるい]を築[きず]いた。"
  5: "町[まち]はセデキヤ王[おう]の第十一年[だいじゅういちねん]まで包囲[ほうい]のうちにあった。"
  6: "第四[だいし]の月[つき]の九日[ここのか]に、町[まち]の飢[き]饉[きん]が激[はげ]しくなり、その地[ち]の民[たみ]にはパンがなかった。"
  7: "町[まち]は破[やぶ]られ、戦[いくさ]の男[おとこ]たちはみな夜[よる]のうちに出[で]て、王[おう]の園[その]に面[めん]した二[ふた]つの城壁[じょうへき]の間[あいだ]の門[もん]の道[みち]から逃[に]げた。カルデア人[じん]たちは町[まち]の周[まわ]りを取[と]り囲[かこ]んでいた。彼らはアラバの道[みち]へ向[む]かった。"
  8: "カルデアの軍[ぐん]は王[おう]の後[あと]を追[お]い、エリコの向[む]こう側[がわ]で彼を捕[と]らえた。彼のしもべたちはみな、彼から散[ち]り散[ぢ]りになった。"
  9: "彼らは王[おう]を捕[と]らえ、バビロンの王[おう]のもと、リブラへ連[れ]て行[い]った。王[おう]は彼に裁[さば]きをもって語[かた]った。"
  10: "バビロンの王[おう]は、セデキヤの目[め]の前[まえ]でその子[こ]らを殺[ころ]し、リブラでユダの君[きみ]たちをことごとく殺[ころ]した。"
  11: "そしてセデキヤの目[め]をえぐり、青銅[せいどう]の足枷[あしかせ]で彼を縛[しば]って、バビロンへ連[れ]て行[い]き、死[し]ぬ日[ひ]まで粉[こな]ひきの家[いえ]に置[お]いた。"
  12: "第五[だいご]の月[つき]の十日[とおか]、すなわちバビロンの王[おう]ネブカドネツァルの第十九年[だいじゅうきゅうねん]に、バビロンの王[おう]の前[まえ]に立[た]つ親衛隊[しんえいたい]の長[ちょう]ネブザルアダンがエルサレムに来[き]た。"
  13: "彼は主[しゅ]の家[いえ]と王[おう]の家[いえ]を焼[や]き、町[まち]のすべての家[いえ]を、また大[おお]きな家[いえ]もことごとく火[ひ]で焼[や]いた。"
  14: "カルデアの軍[ぐん]のうち、親衛隊[しんえいたい]の長[ちょう]とともにいた者[もの]たちは、エルサレムの周[まわ]りの城壁[じょうへき]をことごとく打[う]ち壊[こわ]した。"
  15: "民[たみ]の貧[まず]しい者[もの]たち、および町[まち]に残[のこ]っていた民[たみ]の残[のこ]り、バビロンの王[おう]の側[がわ]に走[はし]った者[もの]たち、そのほかのすべての民[たみ]を、親衛隊[しんえいたい]の長[ちょう]ネブザルアダンは捕囚[ほしゅう]として移[うつ]した。"
  16: "しかし、民[たみ]の貧[まず]しい者[もの]たちのうちの残[のこ]りは、親衛隊[しんえいたい]の長[ちょう]が、ぶどう園[えん]を耕[たがや]す者[もの]と農夫[のうふ]として残[のこ]した。"
  17: "カルデア人[じん]たちは、主[しゅ]の家[いえ]にある青銅[せいどう]の柱[はしら]、台座[だいざ]、主[しゅ]の家[いえ]にある青銅[せいどう]の海[うみ]を砕[くだ]き、その青銅[せいどう]を取[と]ってバビロンへ運[はこ]んだ。"
  18: "また、冠[かんむり]と鉢[はち]と肉[にく]を取[と]る鉤[かぎ]、および奉仕[ほうし]に用[もち]いるすべての青銅[せいどう]の用具[ようぐ]を彼らは取[と]った。"
  19: "また、香炉[こうろ]と鉢[はち]、洗[あら]い器[き]、ともし台[だい]、香[こう]を入[い]れる器[うつわ]、杯[さかずき]、すなわち金[きん]のものは金[きん]として、銀[ぎん]のものは銀[ぎん]として、親衛隊[しんえいたい]の長[ちょう]が取[と]った。"
  20: "二[ふた]つの柱[はしら]、一[ひと]つの海[うみ]、ソロモン王[おう]が主[しゅ]の家[いえ]のために造[つく]った、海[うみ]の下[した]の十二[じゅうに]の青銅[せいどう]の牛[うし]について、その青銅[せいどう]の重[おも]さは量[はか]ることができなかった。"
  21: "柱[はしら]は一[ひと]つずつ高[たか]さ三十五[さんじゅうご]キュビト、その周[まわ]りを十二[じゅうに]キュビトの紐[ひも]が囲[かこ]み、その厚[あつ]さは周[まわ]り四[よん]指[し]であった。"
  22: "その上[うえ]に青銅[せいどう]の柱頭[ちゅうとう]があり、一[ひと]つの柱頭[ちゅうとう]の高[たか]さは五[いつ]キュビト、柱頭[ちゅうとう]の周[まわ]りには網細工[あみざいく]とざくろがあった。すべて青銅[せいどう]であった。二[ふた]つ目[め]の柱[はしら]も同[おな]じで、八[やっ]つのざくろが一[いっ]キュビトごとに十二[じゅうに]キュビトにわたってあった。"
  23: "ざくろは一[ひと]つの側[がわ]に九十六[きゅうじゅうろく]あり、網[あみ]の上[うえ]のざくろは周[まわ]りを合わせて百[ひゃく]であった。"
  24: "親衛隊[しんえいたい]の長[ちょう]は、第一[だいいち]の祭司[さいし]セラヤ、第二[だいに]の祭司[さいし]ゼパニヤ、および戸口[とぐち]を守[まも]る三人[さんにん]を取[と]った。"
  25: "また町[まち]から、戦[いくさ]の男[おとこ]たちの上[うえ]に立[た]つ一人[ひとり]の宦官[かんがん]、町[まち]で見[み]つかった、王[おう]の顔[かお]を見[み]る名[な]の知[し]られた七人[しちにん]の者[もの]、その地[ち]の民[たみ]を徴兵[ちょうへい]する軍[ぐん]の書記[しょき]、および町[まち]で見[み]つかったその地[ち]の民[たみ]六十人[ろくじゅうにん]を取[と]った。"
  26: "親衛隊[しんえいたい]の長[ちょう]ネブザルアダンは彼らを捕[と]らえ、リブラのバビロンの王[おう]のもとへ連[れ]て行[い]った。"
  27: "バビロンの王[おう]はハマテの地[ち]のリブラで彼らを打[う]ち、殺[ころ]した。こうしてユダはその地[ち]から移[うつ]された。"
  28: "これが、ネブカドネツァルが移[うつ]した民[たみ]である。第七年[だいしちねん]に、ユダヤ人[じん]三千二十三人[さんぜんにじゅうさんにん]。"
  29: "第十八年[だいじゅうはちねん]に、ネブカドネツァルがエルサレムから移[うつ]したのは、八百三十二人[はっぴゃくさんじゅうににん]である。"
  30: "第二十三年[だいにじゅうさんねん]に、親衛隊[しんえいたい]の長[ちょう]ネブザルアダンが、ユダヤ人[じん]七百四十五人[ななひゃくよんじゅうごにん]を移[うつ]した。すべてで四千六百人[よんせんろっぴゃくにん]である。"
  31: "ユダの王[おう]ヨヤキンが捕囚[ほしゅう]とされてから第三十七年[だいさんじゅうななねん]、第十二[だいじゅうに]の月[つき]の二十四日[にじゅうよっか]に、バビロンの王[おう]エビル・メロダクは、その治世[ちせい]の年[とし]に、ユダの王[おう]ヨヤキンの頭[あたま]を上[あ]げて、彼を牢[ろう]の家[いえ]から出[だ]した。"
  32: "王[おう]は彼に恵[めぐ]みの言葉[ことば]を語[かた]り、バビロンで彼とともにいる王[おう]たちの王座[おうざ]の上[うえ]に、彼の王座[おうざ]を置[お]いた。"
  33: "彼はその囚[とら]われの衣[ころも]を着替[きが]え、彼が生[い]きたすべての日[ひ]、彼の前[まえ]でいつもパンを食[た]べた。"
  34: "彼への割[わ]り当[て]は、死[し]ぬ日[ひ]まで、日[ひ]ごとにバビロンの王[おう]から絶[た]えず与[あた]えられた。"

notes:
  1: "Ὄντος εἰκοστοῦ καὶ ἑνὸς ἔτους Σεδεκιου ἐν τῷ βασιλεύειν αὐτόν — «был Седекия двадцати одного года, когда начал царствовать» (родительный самостоятельный). ὄνομα τῇ μητρὶ αὐτοῦ Αμιτααλ θυγάτηρ Ιερεμιου ἐκ Λοβεννα — «имя матери его Амиталь, дочь Иеремии из Ловны»; в тексте ハムタル и リブナ — как в 4 Цар 24:18 (там этот же стих), слав. «амиталь... от ловны»."
  2: "В модуле gr-lxx-byz стих — «.» (лакуна). Переведено по слав. 52:2, без 〔…〕: «И сотвори лукавое пред очима Господнима по всему, елико творяше иоаким» — «и делал он злое в очах Господних во всём, как делал Иоаким». В LXX стих есть (καὶ ἐποίησεν τὸ πονηρὸν ἐνώπιον κυρίου...), в модуле он потерян. Отсюда глава идёт параллельно 4 Цар 24–25."
  3: "В модуле стих — «.» (лакуна). По слав. 52:3, без 〔…〕: «яко ярость Господня бысть на Иерусалим и на иуду, дондеже отверже их от лица своего: и отступи седекиа от царя вавилонска»; ὅτι ἐθυμώθη κύριος — «ибо прогневался Господь»; ἀπέστη — «отложился». В LXX стих есть, в модуле потерян. Слав. «дондеже отверже» — «доколе не отверг»."
  4: "ἐν τῷ ἔτει τῷ ἐνάτῳ... ἐν μηνὶ τῷ δεκάτῳ δεκάτῃ τοῦ μηνός — «в девятый год... в десятый месяц, в десятый день месяца»; περιεχαράκωσαν — «обнесли валом» (χάραξ — вал, частокол); περιῳκοδόμησαν τετραπέδοις λίθοις κύκλῳ — «обстроили четвероугольными камнями вокруг» (τετράπεδος — четырёхгранный), слав. «острог от четвероуголных камений»."
  5: "καὶ ἦλθεν ἡ πόλις εἰς συνοχὴν — «и пришёл город в стеснение (συνοχή — осада)»; ἕως ἑνδεκάτου ἔτους τῷ βασιλεῖ Σεδεκια — «до одиннадцатого года царя Седекии»."
  6: "ἐν τῇ ἐνάτῃ τοῦ μηνός — «в девятый [день] месяца»: в греч. модуля месяц не назван; слав. добавляет «месяца же четвертаго» — внесено в текст без скобок (нет в LXX). ἐστερεώθη ὁ λιμός — «усилился голод» (στερεόω — укреплять); οὐκ ἦσαν ἄρτοι τῷ λαῷ τῆς γῆς — «не было хлебов народу земли»."
  7: "διεκόπη ἡ πόλις — «город был прорублен (сделан пролом)»; οἱ πολεμισταί — «воины» (πολεμιστής); κατὰ τὴν ὁδὸν τῆς πύλης ἀνὰ μέσον τοῦ τείχους καὶ τοῦ προτειχίσματος — «дорогою ворот между стеною и передовою стеною» (προτείχισμα); ὃ ἦν κατὰ τὸν κῆπον τοῦ βασιλέως — «что против царского сада»; οἱ Χαλδαῖοι ἐπὶ τῆς πόλεως κύκλῳ — «Халдеи при городе вокруг»; ἐπορεύθησαν ὁδὸν τὴν εἰς Αραβα — «пошли дорогою в Араву» (アラバ; слав. «в пустыню»)."
  8: "κατεδίωξεν ἡ δύναμις τῶν Χαλδαίων ὀπίσω τοῦ βασιλέως — «погналось войско Халдеев за царём»; κατέλαβον αὐτὸν ἐν τῷ πέραν Ιεριχω — «настигли его за Иерихоном (на той стороне)»; πάντες οἱ παῖδες αὐτοῦ διεσπάρησαν ἀπ' αὐτοῦ — «все слуги его рассеялись от него»."
  9: "συνέλαβον τὸν βασιλέα — «взяли царя»; ἤγαγον πρὸς τὸν βασιλέα Βαβυλῶνος εἰς Δεβλαθα — «привели к царю Вавилонскому в Деблафу» (Δεβλαθα, слав. «девлаф, иже есть в земли емаф»); в тексте リブラ — как в 4 Цар 25:6, где то же место. ἐλάλησεν αὐτῷ μετὰ κρίσεως — «говорил ему с судом (по суду)»."
  10: "ἔσφαξεν βασιλεὺς Βαβυλῶνος τοὺς υἱοὺς Σεδεκιου κατ' ὀφθαλμοὺς αὐτοῦ — «заколол царь Вавилонский сыновей Седекии пред глазами его» (σφάζω — закалать); πάντας τοὺς ἄρχοντας Ιουδα ἔσφαξεν ἐν Δεβλαθα — «всех князей Иуды заколол в Деблафе»."
  11: "τοὺς ὀφθαλμοὺς Σεδεκιου ἐξετύφλωσεν — «глаза Седекии ослепил» (ἐκτυφλόω); ἔδησεν αὐτὸν ἐν πέδαις — «связал его оковами» (πέδη — кандалы); εἰς οἰκίαν μύλωνος — «в дом мельницы» (μύλων — мельница), слав. «в дом жерновный»; ἕως ἡμέρας ἧς ἀπέθανεν — «до дня, в который умер»."
  12: "ἐν μηνὶ πέμπτῳ δεκάτῃ τοῦ μηνός — «в пятый месяц, в десятый день месяца»; ἦλθεν Ναβουζαρδαν ὁ ἀρχιμάγειρος — «пришёл Навузардан, начальник телохранителей (ἀρχιμάγειρος)»; ὁ ἑστηκὼς κατὰ πρόσωπον τοῦ βασιλέως Βαβυλῶνος — «стоящий пред лицом царя Вавилонского». В греч. модуля нет года; слав. в скобках добавляет «лето сие девятоенадесять навуходоносору царю вавилонску» — внесено в текст без скобок (как в 4 Цар 25:8)."
  13: "ἐνέπρησεν τὸν οἶκον κυρίου καὶ τὸν οἶκον τοῦ βασιλέως — «сжёг дом Господень и дом царя» (ἐμπίπρημι); πάσας τὰς οἰκίας τῆς πόλεως — «все дома города»; πᾶσαν οἰκίαν μεγάλην ἐνέπρησεν ἐν πυρί — «всякий дом большой сжёг огнём»."
  14: "πᾶν τεῖχος Ιερουσαλημ κύκλῳ καθεῖλεν — «всякую стену Иерусалима вокруг снёс» (καθαιρέω); ἡ δύναμις τῶν Χαλδαίων ἡ μετὰ τοῦ ἀρχιμαγείρου — «войско Халдеев, бывшее с начальником телохранителей»."
  15: "В модуле стих — «.» (лакуна). По слав. 52:15, без 〔…〕: «И от убогих людий, и останок людий, и оставшихся во граде и избегших, иже убежаша ко царю вавилонску, и прочий народ пресели навузардан воевода» — «из бедных народа, и остаток народа, и оставшихся в городе, и перебежавших, которые перебежали к царю Вавилонскому, и прочий народ выселил Навузардан». В LXX стих есть (καὶ τοὺς πτωχοὺς τοῦ λαοῦ...), в модуле потерян."
  16: "τοὺς καταλοίπους τοῦ λαοῦ κατέλιπεν ὁ ἀρχιμάγειρος εἰς ἀμπελουργοὺς καὶ εἰς γεωργούς — «остальных из народа оставил начальник телохранителей в виноградари и земледельцы» (ἀμπελουργός, γεωργός); слав. «прочиих же остави людий убогих»."
  17: "τοὺς στύλους τοὺς χαλκοῦς τοὺς ἐν οἴκῳ κυρίου — «столпы медные, что в доме Господнем»; τὰς βάσεις — «подножия, подставы» (βάσις); τὴν θάλασσαν τὴν χαλκῆν — «море медное» (θάλασσα — водоём, 海); συνέτριψαν — «разбили» (συντρίβω); ἀπήνεγκαν εἰς Βαβυλῶνα — «отнесли в Вавилон»."
  18: "τὴν στεφάνην — «венец, обод» (στεφάνη); τὰς φιάλας — «чаши» (φιάλη); τὰς κρεάγρας — «крюки для мяса» (κρεάγρα, слав. «вилицы»); πάντα τὰ σκεύη τὰ χαλκᾶ — «все сосуды медные»; ἐν οἷς ἐλειτούργουν ἐν αὐτοῖς — «которыми служили» (λειτουργέω — священнодействовать)."
  19: "τὰ σαφφωθ καὶ τὰ μασμαρωθ — тёмные древнееврейские заимствования (слав. «фимиамники... чашы, умывалницы»), переданы по слав.; τοὺς ὑποχυτῆρας — «умывальницы, тазы»; τὰς λυχνίας — «светильники» (λυχνία); τὰς θυίσκας — «кадильницы» (θυίσκη); τοὺς κυάθους — «чаши, ковши» (κύαθος); ἃ ἦν χρυσᾶ χρυσᾶ καὶ ἃ ἦν ἀργυρᾶ ἀργυρᾶ — «что было золотое — золотое, и что серебряное — серебряное» (удвоение сохранено)."
  20: "οἱ μόσχοι δώδεκα χαλκοῖ ὑποκάτω τῆς θαλάσσης — «двенадцать волов медных под морем»; ἃ ἐποίησεν ὁ βασιλεὺς Σαλωμων εἰς οἶκον κυρίου — «что сделал царь Соломон для дома Господня»; οὐκ ἦν σταθμὸς τοῦ χαλκοῦ αὐτῶν — «не было веса меди их»."
  21: "τριάκοντα πέντε πηχῶν ὕψος τοῦ στύλου τοῦ ἑνός — «тридцать пять локтей высота одного столпа»: в LXX 35, а в слав. и в 4 Цар 25:17 — 18; расхождение с 4 Цар 25:17 (十八) отмечено, в тексте по LXX. σπαρτίον δώδεκα πήχεων περιεκύκλου αὐτόν — «шнур в двенадцать локтей обвивал его»; τὸ πάχος αὐτοῦ δακτύλων τεσσάρων κύκλῳ — «толщина его — четыре перста вокруг»."
  22: "γεῖσος ἐπ' αὐτοῖς χαλκοῦν — «венчание (карниз) на них медное» (γεῖσος); πέντε πήχεων τὸ μῆκος ὑπεροχὴ τοῦ γείσους — «пять локтей длина выступа карниза»; δίκτυον καὶ ῥόαι ἐπὶ τοῦ γείσους κύκλῳ — «сеть и гранатовые яблоки на карнизе вокруг» (ῥόα — гранат); ὀκτὼ ῥόαι τῷ πήχει τοῖς δώδεκα πήχεσιν — «восемь гранатов на локоть, на двенадцать локтей»: тёмное место, передано «八つのざくろが一キュビトごとに十二キュビトにわたって»; слав. конца стиха не имеет."
  23: "αἱ ῥόαι ἐνενήκοντα ἓξ τὸ ἓν μέρος — «гранатов девяносто шесть на одну сторону»; πᾶσαι αἱ ῥόαι ἐπὶ τοῦ δικτύου κύκλῳ ἑκατόν — «всех гранатов на сети вокруг сто»."
  24: "τὸν ἱερέα τὸν πρῶτον καὶ τὸν ἱερέα τὸν δευτερεύοντα — «первого священника и второго священника»: в греч. модуля имён нет; слав. «сареа жерца старейшаго и жерца софонию втораго» — имена внесены в текст без скобок (セラヤ, ゼパニヤ; ゼパニヤ — как в этой книге, ср. 21:1 и 36:25, в 4 Цар 25:18 — ゼパニヤ, расхождение отмечено); τοὺς τρεῖς τοὺς φυλάττοντας τὴν ὁδόν — «трёх, охраняющих путь (порог)»."
  25: "εὐνοῦχον ἕνα ὃς ἦν ἐπιστάτης τῶν ἀνδρῶν τῶν πολεμιστῶν — «одного евнуха, который был начальником над воинами»; ἑπτὰ ἄνδρας ὀνομαστοὺς τοὺς ἐν προσώπῳ τοῦ βασιλέως — «семь мужей именитых, бывших пред лицом царя»; τὸν γραμματέα τῶν δυνάμεων — «писца войск»; ἑξήκοντα ἀνθρώπους ἐκ τοῦ λαοῦ τῆς γῆς — «шестьдесят человек из народа земли». Слав. «каженика единаго»."
  26: "ἔλαβεν αὐτοὺς Ναβουζαρδαν ὁ ἀρχιμάγειρος — «взял их Навузардан, начальник телохранителей»; ἤγαγεν αὐτοὺς πρὸς βασιλέα Βαβυλῶνος εἰς Δεβλαθα — «привёл их к царю Вавилонскому в Деблафу» (в тексте リブラ)."
  27: "ἐπάταξεν αὐτοὺς βασιλεὺς Βαβυλῶνος — «поразил их царь Вавилонский»; ἐν Δεβλαθα ἐν γῇ Αιμαθ — «в Деблафе, в земле Емаф» (в тексте ハマテ, как в 4 Цар 25:21); καὶ ἀπῳκίσθη Ιουδας ἀπὸ τῆς γῆς αὐτοῦ — «и переселён был Иуда из земли своей» (ἀποικίζω)."
  28: "В модуле стих — «.» (лакуна). По слав. 52:28, без 〔…〕: «Сии суть людие, ихже пресели навуходоносор в седмое лето, иудеев три тысящы и двадесять и три» — «вот люди, которых переселил Навуходоносор в седьмой год, Иудеев три тысячи двадцать три». В LXX стих есть, в модуле потерян; счёт переселений (28–30) есть только в кн. Иеремии, в 4 Цар его нет."
  29: "В модуле стих — «.» (лакуна). По слав. 52:29, без 〔…〕: «во осмоенадесять лето навуходоносор из Иерусалима душ осмь сот тридесять и две пресели» — «в восемнадцатый год Навуходоносор из Иерусалима восемьсот тридцать две души переселил». В LXX стих есть, в модуле потерян."
  30: "В модуле стих — «.» (лакуна). По слав. 52:30, без 〔…〕: «В двадесять третие лето навуходоносора пресели навузардан архимагир иудеев душ седмь сот и четыредесят пять, всех же душ четыре тысящы и шесть сот» — «в двадцать третий год Навуходоносора Навузардан, начальник телохранителей, переселил Иудеев семьсот сорок пять душ; всех же душ четыре тысячи шестьсот». В LXX стих есть, в модуле потерян."
  31: "ἐν τῷ τριακοστῷ καὶ ἑβδόμῳ ἔτει ἀποικισθέντος τοῦ Ιωακιμ — «в тридцать седьмой год по переселении Иоакима»; ἐν τῇ τετράδι καὶ εἰκάδι τοῦ μηνός — «в двадцать четвёртый день месяца»; в слав. и в ru «в двадесять пятый день» — расхождение, в тексте по LXX (二十四日). ἔλαβεν τὴν κεφαλὴν Ιωακιμ... καὶ ἐξήγαγεν αὐτὸν ἐξ οἰκίας ἧς ἐφυλάττετο — «возвысил главу Иоакима... и вывел его из дома, где он охранялся»; в тексте ヨヤキン — как в 4 Цар 25:27 (евр. Иехония; в греч. и слав. здесь Ιωακίμ / «иоаким»)."
  32: "ἐλάλησεν αὐτῷ χρηστά — «говорил ему благое» (χρηστός — благой, добрый); ἔδωκεν τὸν θρόνον αὐτοῦ ἐπάνω τῶν θρόνων τῶν βασιλέων τῶν μετ' αὐτοῦ ἐν Βαβυλῶνι — «поставил престол его выше престолов царей, которые с ним в Вавилоне»."
  33: "ἤλλαξεν τὴν στολὴν τῆς φυλακῆς αὐτοῦ — «переменил одежду темницы его» (στολή — одеяние); ἤσθιεν ἄρτον διὰ παντὸς κατὰ πρόσωπον αὐτοῦ — «ел хлеб всегда пред лицом его»; πάσας τὰς ἡμέρας, ἃς ἔζησεν — «все дни, которые жил»."
  34: "ἡ σύνταξις αὐτῷ ἐδίδου διὰ παντός — «содержание (σύνταξις) ему давалось всегда»; παρὰ τοῦ βασιλέως Βαβυλῶνος ἐξ ἡμέρας εἰς ἡμέραν — «от царя Вавилонского изо дня в день»; ἕως ἡμέρας, ἧς ἀπέθανεν — «до дня, в который умер»; слав. добавляет «во вся дни живота его» — нет в LXX, внесено в текст без скобок."
