# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 52 — приложение о падении города (параллель 4 Цар 24–25). В слав./ru это
# тоже глава 52, номер в номер.
# План: 1 Седекия, его возраст, годы правления и мать; 2–3 (обе — «точки») «делал
# злое», гнев Господень на Иерусалим и Иуду, отступление Седекии; 4–5 осада, вал;
# 6–7 голод, пролом, бегство через царский сад, дорога в Араву; 8–11 погоня,
# пленение, суд в Деблафе, казнь сыновей и князей, ослепление, оковы, дом мельницы;
# 12–14 сожжение дома Господня, дома царя и всех домов, снос стены; 15–16 (15 —
# «точка») выселение остатка и оставление бедных виноградарями и земледельцами;
# 17–23 разграбление храма: столпы, подставы, море, сосуды, венец, гранаты; 24–27
# взятие и казнь первосвященника, второго священника и сановников; 28–30 (все три —
# «точки») числа переселённых; 31–34 освобождение Иоакима (Иехонии) Евильмеродахом.
# Голоса: вся глава — авторский текст, прямой речи нет, кавычек нет.
# «Точки» (лакуны модуля): 52:2, 52:3, 52:15, 52:28, 52:29, 52:30 — в gr-lxx-byz
# на их месте «.». Переведены по слав. 52 тех же стихов, без 〔…〕; в LXX эти стихи
# есть (см. notes). Стихи не добавлялись и не делились.
# 〔…〕 нет; сносок ⟨…⟩ нет: 親衛隊の長, 宦官, 台座, 海, 網細工, ざくろ уже в корпусе
