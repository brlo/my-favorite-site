verses:
  1: "アサフの詩[うた]。神[かみ]々[がみ]の神[かみ]である主[しゅ]は語[かた]り、日[ひ]の昇[のぼ]る所[ところ]から日[ひ]の沈[しず]む所[ところ]まで、地[ち]を呼[よ]ばれた。"
  2: "その美[うつく]しさの極[きわ]みは、シオンからである。"
  3: "神[かみ]は明[あき]らかに現[あらわ]れ出[で]られる。わたしたちの神[かみ]が来[こ]られ、黙[だま]ってはおられない。その前[まえ]には火[ひ]が燃[も]え、周[まわ]りには激[はげ]しい嵐[あらし]が吹[ふ]き荒[あ]れる。"
  4: "神[かみ]は上[うえ]の天[てん]と地[ち]とを呼[よ]んで、ご自分[じぶん]の民[たみ]を裁[さば]かれる。"
  5: "「わたしの聖[せい]なる者[もの]たち、いけにえをささげてわたしと契約[けいやく]を結[むす]んだ者[もの]たちを、わたしのもとに集[あつ]めよ。」"
  6: "もろもろの天[てん]は神[かみ]の義[ぎ]を告[つ]げる。神[かみ]こそ裁[さば]き主[ぬし]である。"
  7: "「わたしの民[たみ]よ、聞[き]け。わたしは語[かた]る。イスラエルよ、わたしはあなたに証[しょう]しをする。わたしは神[かみ]、あなたの神[かみ]である。"
  8: "わたしがあなたを責[せ]めるのは、あなたのいけにえのゆえではない。あなたの全焼[ぜんしょう]のいけにえは、いつもわたしの前[まえ]にある。"
  9: "わたしはあなたの家[いえ]から雄牛[おうし]を、あなたの羊[ひつじ]の群[む]れから雄山羊[おやぎ]を受[う]け取[と]らない。"
  10: "森[もり]の獣[けもの]はすべてわたしのもの、山[やま]にいる家畜[かちく]も牛[うし]も、みなわたしのものだからである。"
  11: "わたしは空[そら]の鳥[とり]をすべて知[し]っている。野[の]の美[うつく]しさも、わたしとともにある。"
  12: "たとえわたしが飢[うえ]ても、あなたに告[つ]げはしない。世界[せかい]とそれに満[み]ちるものは、わたしのものだからである。"
  13: "わたしが雄牛[おうし]の肉[にく]を食[た]べ、雄山羊[おやぎ]の血[ち]を飲[の]むだろうか。"
  14: "神[かみ]に賛美[さんび]のいけにえをささげよ。いと高[たか]き方[かた]に、あなたの誓[ちか]いを果[は]たせ。"
  15: "苦[くる]しみの日[ひ]にわたしを呼[よ]べ。わたしはあなたを救[すく]い出[だ]し、あなたはわたしをあがめる。」"
  16: "しかし、神[かみ]は悪[わる]い者[もの]に言[い]われる。「あなたはなぜ、わたしの掟[おきて]を語[かた]り、わたしの契約[けいやく]を口[くち]にするのか。"
  17: "あなたは戒[いまし]めを憎[にく]み、わたしの言葉[ことば]を後[うし]ろに投[な]げ捨[す]てた。"
  18: "盗人[ぬすびと]を見[み]ればこれとともに走[はし]り、姦淫[かんいん]する者[もの]と同[おな]じ仲間[なかま]となった。"
  19: "あなたの口[くち]は悪[あく]をふやし、あなたの舌[した]は欺[あざむ]きを編[あ]み出[だ]した。"
  20: "あなたは座[すわ]って、自分[じぶん]の兄弟[きょうだい]をそしり、母[はは]の子[こ]につまずきを置[お]いた。"
  21: "あなたはこれらのことをしたが、わたしは黙[だま]っていた。それで、あなたはわたしがあなたと同[おな]じ者[もの]だと思[おも]った。しかし、わたしはあなたを責[せ]め、あなたの罪[つみ]をあなたの目[め]の前[まえ]に並[なら]べる。"
  22: "神[かみ]を忘[わす]れる者[もの]たちよ、これを悟[さと]れ。さもなければ、わたしは奪[うば]い去[さ]り、救[すく]い出[だ]す者[もの]はだれもいなくなる。"
  23: "賛美[さんび]のいけにえをささげる者[もの]が、わたしをあがめる。自分[じぶん]の道[みち]を慎[つつし]む者[もの]に、わたしは神[かみ]の救[すく]いを示[しめ]す。」"

notes:
  1: "Ψαλμὸς τῷ Ασαφ — アサフの詩 (Ασαφ — Асаф, начальник певцов, ср. 1 Пар 25). Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1), скобками не маркируется. Θεὸς θεῶν κύριος ἐλάλησεν — 神々の神である主は語り (Θεὸς θεῶν — «Бог богов», слав. «Бог богов Господь»; сохранено 神々の神). ἐκάλεσεν τὴν γῆν ἀπὸ ἀνατολῶν ἡλίου καὶ μέχρι δυσμῶν — 日の昇る所から日の沈む所まで、地を呼ばれた (ἀνατολή / δυσμή — «восток / запад», передано описательно, как в евр. образе)."
  2: "ἐκ Σιων ἡ εὐπρέπεια τῆς ὡραιότητος αὐτοῦ — その美しさの極みは、シオンからである (εὐπρέπεια — «благолепие»; ὡραιότης — «красота»; два слова соединены в одно 美しさの極み; подлежащего в гр. нет — оно в ст. 3). Слав. ст. 2 — только эта часть."
  3: "ἐμφανῶς ἥξει — 神は明らかに現れ出られる (ἐμφανής — «явный»). Слав. ст. 3 = вторая половина гр. ст. 2 + гр. ст. 3. ὁ θεὸς ἡμῶν, καὶ οὐ παρασιωπήσεται — わたしたちの神が来られ、黙ってはおられない (παρασιωπάω — «молчать, умалчивать»). πῦρ ἐναντίον αὐτοῦ καυθήσεται — その前には火が燃え (образ теофании, ср. Втор 4:24). κύκλῳ αὐτοῦ καταιγὶς σφόδρα — 周りには激しい嵐が吹き荒れる (καταιγίς — «буря»)."
  4: "προσκαλέσεται τὸν οὐρανὸν ἄνω καὶ τὴν γῆν — 神は上の天と地とを呼んで (προσκαλέομαι — «призывать»). διακρῖναι τὸν λαὸν αὐτοῦ — ご自分の民を裁かれる (διακρίνω — «судить, разбирать»; ср. Ис 1:2)."
  5: "συναγάγετε αὐτῷ τοὺς ὁσίους αὐτοῦ — わたしの聖なる者たちを…わたしのもとに集めよ (ὅσιοι — «преподобные, верные»; 聖なる者, как ὅσιος в Пс 4:4). τοὺς διατιθεμένους τὴν διαθήκην αὐτοῦ ἐπὶ θυσίαις — いけにえをささげてわたしと契約を結んだ者たち (διατίθεμαι — «заключать завет»; ἐπὶ θυσίαις — «при жертвах», т. е. скрепивших завет жертвой). Повеление Бога — 「」."
  6: "ἀναγγελοῦσιν οἱ οὐρανοὶ τὴν δικαιοσύνην αὐτοῦ — もろもろの天は神の義を告げる (ἀναγγέλλω — «возвещать»; небо как свидетель, ср. Втор 32:1). ὅτι ὁ θεὸς κριτής ἐστιν — 神こそ裁き主である (κριτής — 裁き主). Стих вне кавычек: это голос псалмопевца. διάψαλμα не передаётся."
  7: "Ἄκουσον, λαός μου, καὶ λαλήσω σοι — わたしの民よ、聞け。わたしは語る (обращение к народу в ед. ч., поэтому あなた, а не あなたがた). Ισραηλ, καὶ διαμαρτύρομαί σοι — イスラエルよ、わたしはあなたに証しをする (διαμαρτύρομαι — «торжественно свидетельствовать, обличать»). ὁ θεὸς ὁ θεός σού εἰμι ἐγώ — わたしは神、あなたの神である (порядок слов греч. сохранён). Начало речи Бога — 「」."
  8: "οὐκ ἐπὶ ταῖς θυσίαις σου ἐλέγξω σε — わたしがあなたを責めるのは、あなたのいけにえのゆえではない (ἐλέγχω — «обличать»; ἐπί + дат. — «за, по поводу»). τὰ ὁλοκαυτώματά σου ἐνώπιόν μού ἐστιν διὰ παντός — あなたの全焼のいけにえは、いつもわたしの前にある (ὁλοκαύτωμα — 全焼のいけにえ)."
  9: "οὐ δέξομαι ἐκ τοῦ οἴκου σου μόσχους — わたしはあなたの家から雄牛を…受け取らない (μόσχος — «телец», 雄牛). οὐδὲ ἐκ τῶν ποιμνίων σου χιμάρους — あなたの羊の群れから雄山羊を (χίμαρος — «козёл», 雄山羊)."
  10: "ὅτι ἐμά ἐστιν πάντα τὰ θηρία τοῦ δρυμοῦ — 森の獣はすべてわたしのもの (θηρίον — «зверь»; δρυμός — «дубрава, лес»). κτήνη ἐν τοῖς ὄρεσιν καὶ βόες — 山にいる家畜も牛も (κτῆνος — «скот»; βοῦς — «вол»)."
  11: "ἔγνωκα πάντα τὰ πετεινὰ τοῦ οὐρανοῦ — わたしは空の鳥をすべて知っている (πετεινόν — «птица»). ὡραιότης ἀγροῦ μετ᾿ ἐμοῦ ἐστιν — 野の美しさも、わたしとともにある (ὡραιότης — «красота»; ἀγρός — «поле»)."
  12: "ἐὰν πεινάσω, οὐ μή σοι εἴπω — たとえわたしが飢えても、あなたに告げはしない (οὐ μή — усиленное отрицание). ἐμὴ γάρ ἐστιν ἡ οἰκουμένη καὶ τὸ πλήρωμα αὐτῆς — 世界とそれに満ちるものは、わたしのものだからである (πλήρωμα — «полнота», ср. Пс 23:1)."
  13: "μὴ φάγομαι κρέα ταύρων ἢ αἷμα τράγων πίομαι; — わたしが雄牛の肉を食べ、雄山羊の血を飲むだろうか (вопрос с μή, ожидающий отрицания; ταῦρος — «бык»; τράγος — «козёл»)."
  14: "θῦσον τῷ θεῷ θυσίαν αἰνέσεως — 神に賛美のいけにえをささげよ (θυσία αἰνέσεως — «жертва хвалы»). ἀπόδος τῷ ὑψίστῳ τὰς εὐχάς σου — いと高き方に、あなたの誓いを果たせ (ἀποδίδωμι — «воздавать»; εὐχή — «обет, молитва»)."
  15: "ἐπικάλεσαί με ἐν ἡμέρᾳ θλίψεως — 苦しみの日にわたしを呼べ (ἐπικαλέομαι — «призывать»). ἐξελοῦμαί σε — わたしはあなたを救い出し (ἐξαιρέω). δοξάσεις με — あなたはわたしをあがめる (δοξάζω — «славить»). Конец речи Бога — 」, διάψαλμα не передаётся."
  16: "τῷ δὲ ἁμαρτωλῷ εἶπεν ὁ θεός — しかし、神は悪い者に言われる (ἁμαρτωλός — «грешник», здесь 悪い者, как в Пс 1). Ἵνα τί σὺ διηγῇ τὰ δικαιώματά μου — あなたはなぜ、わたしの掟を語り (διηγέομαι — «рассказывать, излагать»; δικαίωμα — 掟). ἀναλαμβάνεις τὴν διαθήκην μου διὰ στόματός σου — わたしの契約を口にするのか (ἀναλαμβάνω — «брать, поднимать», т. е. произносить устами). Новая речь Бога — 「」."
  17: "σὺ δὲ ἐμίσησας παιδείαν — あなたは戒めを憎み (παιδεία — «наставление, наказание»). ἐξέβαλες τοὺς λόγους μου εἰς τὰ ὀπίσω — わたしの言葉を後ろに投げ捨てた (букв. «бросил назад», образ отвержения)."
  18: "εἰ ἐθεώρεις κλέπτην, συνέτρεχες αὐτῷ — 盗人を見ればこれとともに走り (θεωρέω — «видеть»; συντρέχω — «сбегаться, соучаствовать»). μετὰ μοιχῶν τὴν μερίδα σου ἐτίθεις — 姦淫する者と同じ仲間となった (μοιχός — «прелюбодей»; μερίς — «доля, часть», т. е. «полагал с ними долю свою»)."
  19: "τὸ στόμα σου ἐπλεόνασεν κακίαν — あなたの口は悪をふやし (πλεονάζω — «умножать»). ἡ γλῶσσά σου περιέπλεκεν δολιότητα — あなたの舌は欺きを編み出した (περιπλέκω — «сплетать»; δολιότης — «коварство»)."
  20: "καθήμενος κατὰ τοῦ ἀδελφοῦ σου κατελάλεις — あなたは座って、自分の兄弟をそしり (καθέζομαι — «сидеть»; καταλαλέω — «злословить»). κατὰ τοῦ υἱοῦ τῆς μητρός σου ἐτίθεις σκάνδαλον — 母の子につまずきを置いた (υἱὸς τῆς μητρός — «сын матери твоей», т. е. родной брат; σκάνδαλον — «соблазн»)."
  21: "ταῦτα ἐποίησας, καὶ ἐσίγησα — あなたはこれらのことをしたが、わたしは黙っていた (σιγάω — «молчать»; образ долготерпения). ὑπέλαβες ἀνομίαν ὅτι ἔσομαί σοι ὅμοιος — あなたはわたしがあなたと同じ者だと思った (ὑπολαμβάνω — «полагать»; ὅμοιος — «подобный»). ἐλέγξω σε καὶ παραστήσω κατὰ πρόσωπόν σου — わたしはあなたを責め、あなたの罪をあなたの目の前に並べる (παρίστημι — «ставить пред»)."
  22: "σύνετε δὴ ταῦτα, οἱ ἐπιλανθανόμενοι τοῦ θεοῦ — 神を忘れる者たちよ、これを悟れ (συνίημι — «разуметь»). μήποτε ἁρπάσῃ καὶ μὴ ᾖ ὁ ῥυόμενος — さもなければ、わたしは奪い去り、救い出す者はだれもいなくなる (ἁρπάζω — «похищать»; ῥύομαι — «избавлять»; μήποτε — «как бы не»)."
  23: "θυσία αἰνέσεως δοξάσει με — 賛美のいけにえをささげる者が、わたしをあがめる. ἐκεῖ ὁδός, ᾗ δείξω αὐτῷ τὸ σωτήριον τοῦ θεοῦ — 自分の道を慎む者に、わたしは神の救いを示す (тёмное место: букв. «там путь, которым явлю ему спасение Божие»; по jp-joc «己の道を愼む者は、我彼に救を顯さん»; 道を慎む передаёт ὁδός как путь жизни, без добавления нового смысла). Конец речи Бога — 」."
