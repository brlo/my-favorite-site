# jp-box, Псалтирь, псалом 49. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..N.
# Границы стихов — слав.: ст. 2 — только «От Сиона благолепие красоты Его»,
# ст. 3 — «Бог яве приидет…» + гр. ст. 3 (наш ст. 2 разрезан).
# Псалом 49: Богоявление и суд (1–4), собрание святых (5), свидетельство небес (6),
# речь Божия: не жертвы нужны Богу (7–13), жертва хвалы (14–15);
# обличение нечестивого (16–21), призыв вразумиться (22–23).
# Красного и синего нет: речь Бога (5; 7–15; 16–23) — не красная, в псалмах красного нет.
# Кавычки: слова Бога — 「…」: повеление собрать святых (5), речь к народу (7–15),
# речь к нечестивому (16–23). Ст. 6 (свидетельство небес) — вне кавычек, это голос
# псалмопевца; поэтому речь Бога разбита на три отрывка, а не взята одним блоком 5–23.
# 〔…〕 нет: все слова в gr-lxx-byz есть (проверено tmp/bracket_check.rb).
# セラ (διάψαλμα, в конце ст. 6 и 15) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 契約, 全焼, いけにえ, 賛美 уже в корпусе.
# jp-ni не использовался.

