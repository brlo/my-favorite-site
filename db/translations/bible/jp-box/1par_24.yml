# jp-box, 1-я Паралипоменон, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Пар нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: распределение сынов Аарона (1–6), 24 жребия чред (7–18), итог (19),
# прочие левиты (20–31).
# Паритет LXX/csl: csl-чтения внесены в основной текст без 〔…〕 (24:23); где слав.
# текст испорчен (24:26–27, 29), оставлен LXX, слав. формы — в notes; LXX-добавление
# 24:28 не переведено (слав. сам ставит его в скобки). 〔…〕 по книге не ставим.
