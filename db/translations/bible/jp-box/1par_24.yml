tr_code: jp-box
book: 1par
chapter: 24
draft: true

verses:
  1: "アロンの子[こ]らには、組[くみ]分[わ]けが次[つぎ]のとおりである。アロンの子らはナダブ、アビウド、エレアザル、イタマル。"
  2: "ナダブとアビウドは父[ちち]の前[まえ]で死[し]んだ。彼[かれ]らには子[こ]らがなかった。エレアザルとイタマル、アロンの子らが祭司[さいし]として務[つと]めた。"
  3: "ダビデは、エレアザルの子[こ]らのうちのサドクと、イタマルの子らのうちのアヒメレクとともに、彼[かれ]らをその数[かぞ]えに従[したが]って、その務[つと]めに従って、その父[ちち]の家[いえ]ごとに分[わ]けた。"
  4: "エレアザルの子[こ]らは、イタマルの子らよりも、力[ちから]ある者[もの]たちの長[かしら]として多[おお]かった。そこで彼[かれ]らを分[わ]け、エレアザルの子らには父[ちち]の家[いえ]ごとの長[かしら]を十六人[じゅうろくにん]、イタマルの子らには八人[はちにん]とした。"
  5: "彼[かれ]らは互[たが]いに、くじによって分[わ]けられた。聖[せい]なるものの長[かしら]と、主[しゅ]に属[ぞく]する長[かしら]が、エレアザルの子[こ]らとイタマルの子らのうちにいたからである。"
  6: "レビ人[びと]の書記[しょき]サマヤ、ナタナエルの子[こ]が、王[おう]と長[かしら]たち、祭司[さいし]サドク、アビアタルの子アヒメレク、および祭司とレビ人の父[ちち]の家[いえ]の長たちの前[まえ]で、彼[かれ]らを書[か]き記[しる]した。父[ちち]の家[いえ]は、一[ひと]つずつエレアザルに、一[ひと]つずつイタマルに分[わ]けられた。"
  7: "第一[だいいち]のくじはヤリブに、第二[だいに]はイデヤに、"
  8: "第三[だいさん]はハレムに、第四[だいし]はセオリムに、"
  9: "第五[だいご]はメルキヤに、第六[だいろく]はミヤミンに、"
  10: "第七[だいしち]はコスに、第八[だいはち]はアビヤに、"
  11: "第九[だいきゅう]はヨシュアに、第十[だいじゅう]はセヘニヤに、"
  12: "第十一[だいじゅういち]はエリアシブに、第十二[だいじゅうに]はヤキムに、"
  13: "第十三[だいじゅうさん]はオホファに、第十四[だいじゅうよん]はイスバアルに、"
  14: "第十五[だいじゅうご]はベルガに、第十六[だいじゅうろく]はエメルに、"
  15: "第十七[だいじゅうしち]はヘジルに、第十八[だいじゅうはち]はアフェセに、"
  16: "第十九[だいじゅうきゅう]はフェタイに、第二十[だいにじゅう]はエゼキエルに、"
  17: "第二十一[だいにじゅういち]はヤキンに、第二十二[だいにじゅうに]はガムルに、"
  18: "第二十三[だいにじゅうさん]はダラヤに、第二十四[だいにじゅうよん]はマアサイに。"
  19: "これが、主[しゅ]の家[いえ]に入[はい]って務[つと]めるその務めに従[したが]った彼[かれ]らの数[かぞ]え上[あ]げである。それは彼らの定[さだ]めに従[したが]い、父[ちち]アロンの手[て]によって行われた。イスラエルの神[かみ]である主[しゅ]が命[めい]じられたとおりである。"
  20: "レビの残[のこ]りの子[こ]らについては次[つぎ]のとおりである。アムラムの子らにはシュバエル、シュバエルの子らにはエデヤ。"
  21: "レハブヤには、長[かしら]イシヤ。"
  22: "イサアルにはサロモト、サロモトの子[こ]らにはヤハト。"
  23: "エディウの子[こ]らは、第一[だいいち]はエリヤ、第二[だいに]はアマデヤ、第三[だいさん]はヤジエル、第四[だいし]はヨカムである。"
  24: "オジエルの子[こ]らはミカ、ミカの子らはサメル。"
  25: "ミカの兄弟[きょうだい]はイシヤ、イシヤの子[こ]らはゼカリヤ。"
  26: "メラリの子[こ]らはモオリとオムシ、オジヤの子ら、ボンニの子らである。"
  27: "メラリの子[こ]らのうち、オジヤの者[もの]の子らは、ヨサム、ザクル、アブデである。"
  28: "モオリにはエレアザル。エレアザルは死[し]んだ。彼[かれ]には子[こ]らがなかった。"
  29: "キスには、キスの子[こ]ら、エラメエル。"
  30: "オムシの子[こ]らはモオリ、エデル、ヤリモト。これらはレビ人[びと]の子らで、その父[ちち]の家[いえ]ごとである。"
  31: "彼[かれ]らもまた、その兄弟[きょうだい]であるアロンの子[こ]らと同[おな]じく、王[おう]とサドク、アヒメレク、および祭司とレビ人の父[ちち]の家[いえ]の長たちの前[まえ]でくじを引[ひ]いた。家長[かちょう]たちは、その弟[おとうと]たちと同[おな]じであった。"

notes:
  1: "διαιρέσεις — 組分け (разделения, чреды; слав. «разделения»). Перечисление сыновей Аарона: Надав, Авиуд, Елеазар, Ифамар (ср. Исх 6:23; Числ 3:2)."
  2: "ἀπέθανεν … ἐναντίον τοῦ πατρὸς αὐτῶν — умерли пред отцом своим (слав. «прежде отца своего»), т. е. при его жизни; καὶ υἱοὶ οὐκ ἦσαν αὐτοῖς — и сыновей не было у них; ἱεράτευσεν — священствовал (здесь о двух: Елеазар и Ифамар); ср. Числ 3:4."
  3: "διεῖλεν — разделил; Садок (Σαδωκ) из сынов Елеазара и Ахимелех (Αχιμελεχ, сын Авиафара) из сынов Ифамара — ср. 2 Цар 8:17; κατὰ τὴν ἐπίσκεψιν — по исчислению (数え), κατὰ τὴν λειτουργίαν — по служению (務め), κατ᾿ οἴκους πατριῶν — по домам отцов (父の家ごと)."
  4: "πλείους εἰς ἄρχοντας τῶν δυνατῶν — более многочисленны как начальники сильных (слав. «множайшии в началники сил»); шестнадцать и восемь родов; ср. 1 Пар 23:24."
  5: "κατὰ κλήρους — по жребиям (くじ); τούτους πρὸς τούτους — «этих против этих», т. е. чреды друг против друга (слав. «между ими»); ἄρχοντες τῶν ἁγίων καὶ ἄρχοντες κυρίου — начальники святыни и начальники Господни (слав. «началницы святилища и началницы Божии»)."
  6: "Σαμαιας υἱὸς Ναθαναηλ ὁ γραμματεὺς ἐκ τοῦ Λευι — Шемая, сын Нафанаила, писец из левитов; κατέναντι τοῦ βασιλέως — пред лицом царя; οἴκου πατριᾶς εἷς εἷς τῷ Ελεαζαρ — по одному дому отца для Елеазара (и) один для Ифамара, т. е. роды чередовались; слав. так же."
  7: "ἐξῆλθεν ὁ κλῆρος ὁ πρῶτος — вышел жребий первый; Ιαριβ — Ярив (слав. «иоарим», евр. Иегоиарив); Ιδεια — Идея (слав. «иедий», евр. Иедаия)."
  8: "Χαρημ — Харем (слав. «харив», евр. Харим); Σεωριμ — Сеорим (слав. «сеорим»)."
  9: "Μελχια — Мелхия (слав. «мелхий»); Μιαμιν — Миямин (слав. «меиамин»)."
  10: "Κως — Кос (слав. «аккос», евр. Гаккоц); Αβια — Авия (слав. «авия»); ср. Лк 1:5."
  11: "Ἰησοῦ — Иешуа (слав. «иисус»): здесь имя священника, не Господь; передано ヨシュア по принципу корпуса (ср. Деян 7:45 — Ἰησοῦς Навин); Σεχενια — Сехения (слав. «сехения», евр. Шехания)."
  12: "Ελιασιβ — Елиашив (слав. «елиасив»); Ιακιμ — Яким (слав. «иаким»)."
  13: "Οχχοφφα — Оххоффа (слав. «оффай», евр. Хуппа); Ισβααλ — Исваал (слав. «иесваал», евр. Иешевав)."
  14: "Βελγα — Белга (слав. «велгий», евр. Билга); Εμμηρ — Еммер (слав. «еммир», евр. Имер)."
  15: "Χηζιρ — Хезир (слав. «иефий», евр. Хезир); Αφεσση — Афессе (слав. «афессий», евр. Гапицец)."
  16: "Φεταια — Фетаия (слав. «феттий», евр. Петахия); Εζεκηλ — Иезекииль (слав. «езекииль»)."
  17: "Ιαχιν — Яхин (слав. «ахин», евр. Иахин); Γαμουλ — Гамул (слав. «гамуил»)."
  18: "Δαλαια — Далаия (слав. «далеий», евр. Делаия); Μαασαι — Маасай (слав. «иеил», евр. Маазия). Всего 24 чреды (ср. 24:4: 16 + 8)."
  19: "ἐπίσκεψις — исчисление; τοῦ εἰσπορεύεσθαι εἰς οἶκον κυρίου — чтобы входить в дом Господень; κατὰ τὴν κρίσιν αὐτῶν — по уставу их (κρίσις здесь «чин»; слав. «по чину своему»); διὰ χειρὸς Ααρων — чрез руку Аарона, т. е. по его установлению."
  20: "τοῖς καταλοίποις — остальным (прочим) сынам Левия; Αμβραμ — Амрам (アムラム); Σουβαηλ — Шуваил (слав. «соваил»); Ιαδια — Иедия (слав. «иадаиа»)."
  21: "Ρααβια — Рехавия (слав. «равиа»); ὁ ἄρχων Ιεσιας — начальник Иесия (слав. «началник иесиа»; у Синодального «Ишшия был первый»)."
  22: "Ισσαρι — Иссари (в корпусе イサアル, ср. Числ 3:19); Σαλωμωθ — Саломоф (サロモト, не Соломон); Ιαθ — Иаф (слав. «иаф»)."
  23: "LXX даёт только трёх сыновей (второй–четвёртый); слав. и Синодальный (с евр.) добавляют первого — Иерию (エリヤ); по правилу паритета csl-чтение в тексте, LXX-вариант отмечен. У LXX отец — Ιεδιου (エディウ), в евр. и ru — Хеврон."
  24: "Οζιηλ — Озиил (オジエル); Μιχα — Миха (ミカ); Σαμηρ — Самир (слав. «самир»)."
  25: "ἀδελφὸς Μιχα — брат Михи; Ισια — Ишия (слав. «исиа»); Ζαχαρια — Захария (ゼカリヤ)."
  26: "Место тёмное: LXX «сыны Мерари: Мооли и Муси, сыны Озии, сыны Вонни»; слав. «сын озиин вонний» (ед. ч.); у Синодального с евр. «из сыновей Иаазии: Бено». Оставлено по LXX."
  27: "LXX снова начинает «сыны Мерари у Озии»; слав. «сынове мерарины озиа: сынове его иесома и закхур и иовфи»; у Синодального (с евр.) «у Иаазии: Бено и Шогам, и Заккур и Иври». Имена: Исоам (ヨサム), Закхур, Авдий (アブデ)."
  28: "LXX прибавляет καὶ Ιθαμαρ («и Ифамар»), но слав. ставит это в скобки как сомнительное; в тексте опущено (csl-чтение), LXX-вариант отмечен. ἀπέθανεν Ελεαζαρ — умер Елеазар; οὐκ ἦσαν αὐτῷ υἱοί — не было у него сыновей."
  29: "LXX: υἱοὶ τοῦ Κις — сыны Киса (мн. ч.); слав. «сын кисов иерамеил» (ед. ч.); у Синодального «из сыновей Киса: Иерахмиил» (エラメエル)."
  30: "Μουσι — Муси (オムシ, как в Числ 3:20); Μοολι, Εδερ, Ιαριμωθ — Мооли, Едер, Иаримоф; заключительная формула «сии сыны левитов по домам отцов их»."
  31: "ἔλαβον καὶ αὐτοὶ κλήρους — взяли и они жребии; ἐναντίον τοῦ βασιλέως — пред царём; πατριάρχαι αρααβ — тёмное место (слав. «патриарси аарони», у Синодального «глава семейства наравне с меньшим братом своим»); καθὼς οἱ ἀδελφοὶ αὐτοῦ οἱ νεώτεροι — как братья его младшие, т. е. жребий не различал старших и младших."
