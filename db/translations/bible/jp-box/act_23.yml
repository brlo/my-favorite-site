verses:
  1: "パウロは最高法院[さいこうほういん]をじっと見[み]つめて言[い]った。「兄弟[きょうだい]たちよ、わたしは今日[こんにち]まで、神[かみ]の前[まえ]に、良[よ]い良心[りょうしん]を尽[つ]くして生[い]きてきました。」"
  2: "すると、大祭司[だいさいし]アナニアは、そばに立[た]っている者[もの]たちに、パウロの口[くち]を打[う]つように命[めい]じた。"
  3: "パウロは彼[かれ]に言[い]った。「白[しろ]く塗[ぬ]った壁[かべ]よ。神[かみ]はあなたを打[う]たれる。あなたは律法[りっぽう]に従[したが]ってわたしを裁[さば]くために座[すわ]っているのに、律法[りっぽう]に背[そむ]いて、わたしを打[う]てと命[めい]じるのですか。」"
  4: "そばに立[た]っていた者[もの]たちが言[い]った。「神[かみ]の大祭司[だいさいし]を侮辱[ぶじょく]するのか。」"
  5: "パウロは言[い]った。「兄弟[きょうだい]たちよ、わたしは彼[かれ]が大祭司[だいさいし]であることを知[し]りませんでした。『あなたの民[たみ]の指導者[しどうしゃ]を悪[あ]しざまに言[い]ってはならない』と書[か]かれているからです。」"
  6: "パウロは、その一方[いっぽう]がサドカイ派[は]、他方[たほう]がファリサイ派[は]であることを知[し]って、最高法院[さいこうほういん]の中[なか]で叫[さけ]んだ。「兄弟[きょうだい]たちよ、わたしはファリサイ派[は]の者[もの]で、ファリサイ派[は]の家[いえ]に生[う]まれた者[もの]です。死[し]者[しゃ]の復活[ふっかつ]と希望[きぼう]のゆえに、わたしは今[いま]、裁[さば]きを受[う]けているのです。」"
  7: "パウロがこう言[い]うと、ファリサイ派[は]とサドカイ派[は]の間[あいだ]に争[あらそ]いが起[お]こり、集[あつ]まった者[もの]たちは二[ふた]つに分[わか]れた。"
  8: "サドカイ派[は]は、復活[ふっかつ]も天使[てんし]も霊[れい]もないと言[い]い、ファリサイ派[は]は、それらをすべて認[みと]めているからである。"
  9: "大[おお]きな叫[さけ]びが起[お]こった。ファリサイ派[は]の律法学者[りっぽうがくしゃ]たちのうちの何人[なんにん]かが立[た]ち上[あ]がり、激[はげ]しく争[あらそ]って言[い]った。「この人[ひと]には何[なに]の悪[わる]い点[てん]も見[み]あたらない。もし霊[れい]か天使[てんし]が彼[かれ]に語[かた]ったのなら、〔神[かみ]に逆[さか]らってはならない。〕」"
  10: "争[あらそ]いが激[はげ]しくなると、千人隊長[せんにんたいちょう]は、パウロが彼[かれ]らに引[ひ]き裂[さ]かれるのではないかと恐[おそ]れ、兵士[へいし]たちに命[めい]じて、下[お]りて行[い]かせ、彼[かれ]を彼[かれ]らの中[なか]から奪[うば]い取[と]って兵営[へいえい]へ連[つ]れて行[い]かせた。"
  11: "その夜[よる]、主[しゅ]がパウロのそばに立[た]って言[い]われた。「<j>勇気[ゆうき]を出[だ]せ。あなたはエルサレムでわたしのことを証[あかし]したように、ローマでも証[あかし]しなければならない。</j>」"
  12: "夜[よ]が明[あ]けると、ユダヤ人[じん]たちは謀[むほん]を企[くわだ]て、パウロを殺[ころ]すまでは飲[の]み食[く]いをしないと誓[ちか]い合[あ]った。"
  13: "この誓[ちか]いを立[た]てた者[もの]は、四十人[よんじゅうにん]余[あま]りであった。"
  14: "彼[かれ]らは祭司長[さいしちょう]たちと長老[ちょうろう]たちのところへ行[い]って言[い]った。「わたしたちは、パウロを殺[ころ]すまで何[なに]も口[くち]にしないと、固[かた]く誓[ちか]いました。"
  15: "そこで今[いま]、あなたがたは最高法院[さいこうほういん]と一緒[いっしょ]に、パウロのことをもっと詳[くわ]しく取[と]り調[しら]べようとしているという体裁[ていさい]で、千人隊長[せんにんたいちょう]に申[もう]し出[で]て、彼[かれ]をあなたがたのところへ連[つ]れて来[く]るようにしてください。わたしたちは、彼[かれ]が近[ちか]づく前[まえ]に、殺[ころ]す用意[ようい]をして待[ま]っています。」"
  16: "ところが、パウロの姉妹[しまい]の子[こ]がこの陰謀[いんぼう]を聞[き]き、兵営[へいえい]に来[き]て、パウロに告[つ]げた。"
  17: "パウロは百人隊長[ひゃくにんたいちょう]の一人[ひとり]を呼[よ]んで言[い]った。「この若者[わかもの]を千人隊長[せんにんたいちょう]のところへ連[つ]れて行[い]ってください。彼[かれ]には話[はな]したいことがあるのです。」"
  18: "百人隊長[ひゃくにんたいちょう]は彼[かれ]を連[つ]れて行[い]き、千人隊長[せんにんたいちょう]に言[い]った。「囚人[しゅうじん]パウロがわたしを呼[よ]んで、この若者[わかもの]をあなたのところへ連[つ]れて来[く]るように頼[たの]みました。彼[かれ]にはあなたに話[はな]したいことがあるそうです。」"
  19: "千人隊長[せんにんたいちょう]は彼[かれ]の手[て]を取[と]って、人目[ひとめ]を離[はな]れたところへ行[い]き、尋[たず]ねた。「わたしに話[はな]したいこととは何[なん]だ。」"
  20: "彼[かれ]は言[い]った。「ユダヤ人[じん]たちは、パウロのことをもっと詳[くわ]しく調[しら]べるという体裁[ていさい]で、明日[あす]、彼[かれ]を最高法院[さいこうほういん]へ連[つ]れて来[く]るように、あなたに頼[たの]もうと申[もう]し合[あ]わせています。"
  21: "どうか、彼[かれ]らの言[い]うことを聞[き]き入[い]れないでください。彼[かれ]らのうちの四十人[よんじゅうにん]余[あま]りが、彼[かれ]を殺[ころ]すまでは飲[の]み食[く]いをしないと誓[ちか]って、待[ま]ち伏[ぶ]せしているのです。彼[かれ]らは今[いま]すでに用意[ようい]を整[ととの]え、あなたの許[ゆる]しを待[ま]っています。」"
  22: "千人隊長[せんにんたいちょう]は若者[わかもの]を帰[かえ]らせ、「このことをわたしに知[し]らせたと、だれにも話[はな]してはならない」と命[めい]じた。"
  23: "そこで、千人隊長[せんにんたいちょう]は百人隊長[ひゃくにんたいちょう]二人[ふたり]を呼[よ]んで言[い]った。「夜[よる]の第三[だいさん]時[じ]から、カイサリアへ向[む]かう用意[ようい]をせよ。兵士[へいし]二百人[にひゃくにん]、騎兵[きへい]七十人[ななじゅうにん]、投[なげ]げ槍[やり]を持[も]つ者[もの]⟨ローマ軍[ぐん]の軽装[けいそう]兵[へい]。右手[みぎて]に投[なげ]げ槍[やり]を持[も]っていた。⟩二百人[にひゃくにん]である。"
  24: "また、パウロを乗[の]せて、総督[そうとく]フェリクスのもとへ無事[ぶじ]に送[おく]り届[とど]けるために、馬[うま]を用意[ようい]せよ。」"
  25: "また、次[つぎ]のような手紙[てがみ]を書[か]いた。"
  26: "「クラウディオ・ルシアから、尊[とうと]い総督[そうとく]フェリクス閣下[かっか]へ。ご挨拶[あいさつ]を申[もう]し上[あ]げます。"
  27: "この人[ひと]はユダヤ人[じん]たちに捕[つか]まえられ、今[いま]にも殺[ころ]されようとしていましたが、わたしは彼[かれ]がローマ人[じん]であることを知[し]り、兵士[へいし]たちを率[ひき]いて行[い]き、彼[かれ]を救[すく]い出[だ]しました。"
  28: "そして、彼[かれ]らが彼[かれ]を訴[うった]えている理由[りゆう]を知[し]ろうとして、彼[かれ]を連[つ]れて行[い]き、彼[かれ]らの最高法院[さいこうほういん]に引[ひ]き出[だ]したところ、"
  29: "彼[かれ]が訴[うった]えられているのは、彼[かれ]らの律法[りっぽう]についての論争[ろんそう]のためだけで、死[し]や投獄[とうごく]に値[あたい]する罪[つみ]は何[なに]も見[み]あたりませんでした。"
  30: "ところが、この人[ひと]に対[たい]して彼[かれ]らの中[なか]から害[がい]が加[くわ]えられようとしていることが、わたしに知[し]らされたので、すぐに彼[かれ]をあなたのもとへ送[おく]りました。また、彼[かれ]を訴[うった]える者[もの]たちにも、あなたの前[まえ]で語[かた]るように命[めい]じました。〔平安[へいあん]あれ。〕」"
  31: "そこで、兵士[へいし]たちは命[めい]じられたとおりにパウロを引[ひ]き取[と]って、夜[よる]のうちにアンティパトリスへ連[つ]れて行[い]った。"
  32: "翌日[よくじつ]、騎兵[きへい]たちにパウロを送[おく]らせ、残[のこ]りの者[もの]たちは兵営[へいえい]へ帰[かえ]った。"
  33: "騎兵[きへい]たちはカイサリアに着[つ]くと、手紙[てがみ]を総督[そうとく]に渡[わた]し、パウロも彼[かれ]の前[まえ]に立[た]たせた。"
  34: "総督[そうとく]は手紙[てがみ]を読[よ]み、パウロがどの州[しゅう]の者[もの]かと尋[たず]ね、キリキアの者[もの]であることを知[し]ると、"
  35: "言[い]った。「あなたを訴[うった]える者[もの]たちが来[き]たときに、あなたの言[い]い分[ぶん]を聞[き]こう。」そして、ヘロデの官邸[かんてい]⟨ヘロデ大王[だいおう]が建[た]てた宮殿[きゅうでん]で、総督[そうとく]の官邸[かんてい]として使[つか]われていた。⟩に彼[かれ]を留[と]め置[お]くように命[めい]じた。"

notes:
  1: "συνείδησις ἀγαθή — 良い良心. πεπολίτευμαι τῷ θεῷ — «жил пред Богом»; 神の前に生きてきました."
  2: "ἐπέταξεν τοῖς παρεστῶσιν — そばに立っている者たちに命じた."
  3: "τοῖχε κεκονιαμένε — «стена подбелённая» (ср. Иез 13:10–12); 白く塗った壁."
  5: "Цитата Исх 22:28: ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς — 指導者を悪しざまに言ってはならない."
  6: "τὸ ἓν μέρος … τὸ δὲ ἕτερον — 一方…他方. υἱὸς Φαρισαίων — «сын фарисеев»; ファリサイ派の家に生まれた者. περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν — 死者の復活と希望のゆえに."
  8: "πνεῦμα здесь — «дух» (не Святой Дух); 霊."
  9: "В критической базе речь обрывается на εἰ … ἢ ἄγγελος —; церковный текст (Елизаветинская, jp-joc「我等神に敵す可からざるなり」) добавляет μὴ θεομαχῶμεν — 〔神に逆らってはならない。〕."
  11: "Слова Господа — красные. διεμαρτύρω — «засвидетельствовал»; 証しした."
  23: "δεξιόλαβος — легковооружённый воин с метательным копьём; 投げ槍を持つ者, сноска."
  26: "κρατίστῳ — почётное обращение к наместнику; 尊い…閣下."
  30: "ἔρρωσο — «будь здоров», обычное завершение письма; в критической базе отсутствует, церковный текст имеет — 〔平安あれ。〕."
  35: "πραιτώριον τοῦ Ἡρῴδου — дворец Ирода в Кесарии, ставший резиденцией наместника; ヘロデの官邸, сноска."
