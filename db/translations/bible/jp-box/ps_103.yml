# jp-box, Псалтирь, псалом 103. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 103: хвала Творцу — свет и небеса (1–4), утверждение земли и вод (5–9),
# источники и произрастания (10–18), светила и ночные звери (19–23),
# море и твари (24–26), пища от руки Божией (27–30), слава Господня (31–35).
# Красного и синего нет: псалом — хвала о творении, а не евангельская речь Христа.
# Прямой речи нет, кавычки не ставятся.
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось
# (в т. ч. «о сотворении мира» из ru и jp-joc в надписании gr-lxx-byz нет).
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 杉, 鹿, わし, 竜, 泉, 淵 понятны или уже в корпусе.
# jp-ni не использовался.

