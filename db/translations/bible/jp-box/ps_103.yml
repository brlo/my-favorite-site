verses:
  0: "ダビデの詩[うた]。"
  1: "わたしの魂[たましい]よ、主[しゅ]をほめたたえよ。わたしの神[かみ]である主[しゅ]よ、あなたはどこまでも大[おお]きく、誉[ほま]れと威厳[いげん]とを衣[ころも]としておられる。"
  2: "あなたは光[ひかり]を衣[ころも]のようにまとい、天[てん]を幕[まく]のように張[は]られる。"
  3: "あなたは水[みず]の上[うえ]にご自分[じぶん]の高[たか]い住[す]まいを建[た]て、雲[くも]をご自分[じぶん]の車[くるま]とし、風[かぜ]の翼[つばさ]の上[うえ]を歩[あゆ]まれる。"
  4: "あなたはご自分[じぶん]の使[つか]いを風[かぜ]とし、ご自分[じぶん]の仕[つか]え人[びと]を燃[も]える火[ひ]とされる。"
  5: "あなたは地[ち]をその基[もと]の上[うえ]に据[す]えられた。地[ち]は世[よ]々[よ]に揺[ゆ]るぐことがない。"
  6: "淵[ふち]はその衣[ころも]のような覆[おお]いである。水[みず]は山[やま]々[やま]の上[うえ]に立[た]つ。"
  7: "あなたが叱[しか]ると、水[みず]は逃[に]げ去[さ]り、あなたの雷[かみなり]の声[こえ]に、水[みず]は恐[おそ]れて退[しりぞ]く。"
  8: "山[やま]は上[あ]がり、平野[へいや]は下[くだ]って、あなたがそれらのために定[さだ]められた所[ところ]に至[いた]る。"
  9: "あなたは境[さかい]を定[さだ]め、それらが越[こ]えないようにされた。それらは再[ふたた]び地[ち]を覆[おお]うために戻[もど]ってこない。"
  10: "あなたは谷[たに]々[だに]に泉[いずみ]を送[おく]り、水[みず]は山[やま]と山[やま]の間[あいだ]を流[なが]れる。"
  11: "泉[いずみ]は野[の]のすべての獣[けもの]に飲[の]み水[みず]を与[あた]え、野生[やせい]のロバはその渇[かわ]きを満[み]たす。"
  12: "そのほとりに空[そら]の鳥[とり]たちが住[す]み、岩[いわ]の間[あいだ]から声[こえ]を出[だ]す。"
  13: "あなたはご自分[じぶん]の高[たか]い住[す]まいから山[やま]々[やま]に水[みず]を注[そそ]ぎ、地[ち]はあなたのわざの実[み]で満[み]ち足[た]りる。"
  14: "あなたは家畜[かちく]のために草[くさ]を、人[ひと]の働[はたら]きのために青草[あおくさ]を生[は]えさせ、地[ち]からパンを取り出[だ]させる。"
  15: "ぶどう酒[ぶどうしゅ]は人[ひと]の心[こころ]を喜[よろこ]ばせ、油[あぶら]は顔[かお]を明[あか]るくし、パンは人[ひと]の心[こころ]を支[ささ]える。"
  16: "野[の]の木[き]々[ぎ]も、主[しゅ]が植[う]えられたレバノンの杉[すぎ]も、満[み]ち足[た]りる。"
  17: "そこに小鳥[ことり]たちが巣[す]を作[つく]り、こうのとりの家[いえ]が彼[かれ]らに先立[さきだ]つ。"
  18: "高[たか]い山[やま]は鹿[しか]のためのもの、岩[いわ]は岩[いわ]だぬきの逃[に]げ場[ば]である。"
  19: "主[しゅ]は月[つき]を造[つく]って季節[きせつ]を定[さだ]め、太陽[たいよう]はその沈[しず]む所[ところ]を知[し]っている。"
  20: "あなたが暗[くら]やみを置[お]かれると夜[よる]になり、森[もり]の獣[けもの]たちはみな、その中[なか]を歩[あゆ]み回[まわ]る。"
  21: "若[わか]い獅子[しし]たちは獲物[えもの]を奪[うば]おうとほえ、神[かみ]に自分[じぶん]たちの食物[しょくもつ]を求[もと]める。"
  22: "日[ひ]が上[のぼ]ると、彼[かれ]らは集[あつ]まって自分[じぶん]たちの寝床[ねどこ]に伏[ふ]す。"
  23: "人[ひと]は夕[ゆう]べまで、自分[じぶん]の仕事[しごと]と働[はたら]きのために出[で]て行[ゆ]く。"
  24: "主[しゅ]よ、あなたのわざはなんと多[おお]いことか。あなたはすべてを知恵[ちえ]をもって造[つく]られた。地[ち]はあなたの造[つく]られたもので満[み]ちている。"
  25: "見[み]よ、この広[ひろ]く大[おお]きな海[うみ]を。そこには数[かぞ]えきれないほどの、地[ち]をはうものたち、小[ちい]さなものも大[おお]きなものもいる。"
  26: "そこを舟[ふね]が行[ゆ]き交[か]い、あなたがそこに遊[あそ]ばせようと造[つく]られたあの竜[りゅう]がいる。"
  27: "すべてのものは、あなたが時[とき]に応[おう]じて食物[しょくもつ]をお与[あた]えになるのを待[ま]っている。"
  28: "あなたがお与えになれば、彼[かれ]らは集[あつ]め、あなたが手[て]を開[ひら]かれれば、すべてのものは善[よ]いもので満[み]たされる。"
  29: "あなたが顔[かお]を背[そむ]けられると、彼[かれ]らは恐[おそ]れ惑[まど]う。あなたが彼[かれ]らの息[いき]を取[と]り上[あ]げられると、彼[かれ]らは消[き]え、塵[ちり]に帰[かえ]る。"
  30: "あなたがご自分[じぶん]の霊[れい]を送[おく]られると、彼[かれ]らは造[つく]られ、あなたは地[ち]の面[おもて]を新[あら]たにされる。"
  31: "主[しゅ]の栄光[えいこう]がとこしえにあるように。主[しゅ]がそのわざによって喜[よろこ]ばれますように。"
  32: "主[しゅ]が地[ち]に目[め]を向[む]けられると地[ち]は震[ふる]え、山[やま]に触[ふ]れられると煙[けむり]を上[あ]げる。"
  33: "わたしは生[い]きている限[かぎ]り主[しゅ]に歌[うた]い、わたしがいる限[かぎ]りわたしの神[かみ]にほめ歌[うた]を歌[うた]う。"
  34: "わたしの思[おも]いが主[しゅ]に喜[よろこ]ばれますように。わたしは主[しゅ]によって喜[よろこ]ぶ。"
  35: "罪[つみ]人[びと]が地[ち]から消[き]え、不法[ふほう]の者[もの]がもはやいなくなるように。わたしの魂[たましい]よ、主[しゅ]をほめたたえよ。"

notes:
  0: "Τῷ Δαυιδ — ダビデの詩; в gr-lxx-byz строка 0 есть, взято оттуда. В ru и jp-joc к надписанию добавлено «о сотворении мира», в греч. этого нет — не добавлено (надписание скобками не маркируется)."
  1: "Εὐλόγει, ἡ ψυχή μου, τὸν κύριον — わたしの魂よ、主をほめたたえよ (εὐλογέω — ほめたたえる, как по корпусу). ἐμεγαλύνθης σφόδρα — あなたはどこまでも大きい (μεγαλύνω — «величать, делать великим»). ἐξομολόγησιν καὶ εὐπρέπειαν ἐνεδύσω — 誉れと威厳とを衣としておられる (ἐξομολόγησις — «хвала, исповедание»; εὐπρέπεια — «благолепие»; ἐνδύω — «облекаться»; слав. «исповедание и велелепоту облеклся еси»)."
  2: "ἀναβαλλόμενος φῶς ὡς ἱμάτιον — 光を衣のようにまとい (ἀναβάλλομαι — «надевать, облекаться»). ἐκτείνων τὸν οὐρανὸν ὡσεὶ δέρριν — 天を幕のように張られる (ἐκτείνω — «простирать»; δέρρις — «кожаный покров, шатёр», ср. Пс 103:2 в слав.)."
  3: "ὁ στεγάζων ἐν ὕδασιν τὰ ὑπερῷα αὐτοῦ — 水の上にご自分の高い住まいを建て (στεγάζω — «крыть, покрывать»; ὑπερῷον — «горница, верхний покой»). ὁ τιθεὶς νέφη τὴν ἐπίβασιν αὐτοῦ — 雲をご自分の車とし (ἐπίβασις — «восход, колесница», ср. Ис 19:1). ὁ περιπατῶν ἐπὶ πτερύγων ἀνέμων — 風の翼の上を歩まれる (πτέρυγες ἀνέμων — «крылья ветров»)."
  4: "ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα — ご自分の使いを風とし (ἄγγελος — 使い; πνεῦμα — «ветер, дух»; в евр. «ветры», ср. Евр 1:7). τοὺς λειτουργοὺς αὐτοῦ πῦρ φλέγον — ご自分の仕え人を燃える火とされる (λειτουργός — «служитель»; φλέγον — «пламенеющий»); двусмысленность «ангелы/ветры» сохранена."
  5: "ἐθεμελίωσεν τὴν γῆν ἐπὶ τὴν ἀσφάλειαν αὐτῆς — 地をその基の上に据えられた (θεμελιόω — «основывать»; ἀσφάλεια — «твердыня, устойчивость»). οὐ κλιθήσεται εἰς τὸν αἰῶνα τοῦ αἰῶνος — 地は世々に揺るぐことがない (κλίνω — «наклонять, колебать»)."
  6: "ἄβυσσος ὡς ἱμάτιον τὸ περιβόλαιον αὐτοῦ — 淵はその衣のような覆いである (ἄβυσσος — 淵; περιβόλαιον — «покров, одеяние»; слав. «бездна яко риза одеяние его»). ἐπὶ τῶν ὀρέων στήσονται ὕδατα — 水は山々の上に立つ (ἵστημι — «ставить»); картина потопа."
  7: "ἀπὸ ἐπιτιμήσεώς σου φεύξονται — あなたが叱ると、水は逃げ去り (ἐπιτίμησις — «прещение»; φεύγω — «бежать»). ἀπὸ φωνῆς βροντῆς σου δειλιάσουσιν — あなたの雷の声に、水は恐れて退く (βροντή — «гром»; δειλιάω — «робеть, пугаться»)."
  8: "ἀναβαίνουσιν ὄρη καὶ καταβαίνουσιν πεδία — 山は上がり、平野は下って (πεδίον — «равнина»); речь о водах, поднявшихся и опавших при сотворении. εἰς τόπον, ὃν ἐθεμελίωσας αὐτοῖς — あなたがそれらのために定められた所に至る (θεμελιόω — «основывать, назначать»)."
  9: "ὅριον ἔθου, ὃ οὐ παρελεύσονται — あなたは境を定め、それらが越えないようにされた (ὅριον — «предел»; παραπορεύομαι — «переходить»). οὐδὲ ἐπιστρέψουσιν καλύψαι τὴν γῆν — それらは再び地を覆うために戻ってこない (καλύπτω — «покрывать»)."
  10: "ὁ ἐξαποστέλλων πηγὰς ἐν φάραγξιν — 谷々に泉を送り (πηγή — «источник»; φάραγξ — «ущелье, лощина»). ἀνὰ μέσον τῶν ὀρέων διελεύσονται ὕδατα — 水は山と山の間を流れる (διέρχομαι — «проходить»)."
  11: "ποτιοῦσιν πάντα τὰ θηρία τοῦ ἀγροῦ — 野のすべての獣に飲み水を与え (ποτίζω — «поить»; θηρίον — «зверь»). προσδέξονται ὄναγροι εἰς δίψαν αὐτῶν — 野生のロバはその渇きを満たす (ὄναγρος — «онагр, дикий осёл»; δίψα — «жажда»)."
  12: "ἐπ᾿ αὐτὰ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσει — そのほとりに空の鳥たちが住み (πετεινόν — «птица»; κατασκηνόω — «гнездиться, обитать»). ἐκ μέσου τῶν πετρῶν δώσουσιν φωνήν — 岩の間から声を出す (δίδωμι φωνήν — «подавать голос»)."
  13: "ποτίζων ὄρη ἐκ τῶν ὑπερῴων αὐτοῦ — ご自分の高い住まいから山々に水を注ぎ (ὑπερῷα — «горние покои»). ἀπὸ καρποῦ τῶν ἔργων σου χορτασθήσεται ἡ γῆ — 地はあなたのわざの実で満ち足りる (καρπός — «плод»; χορτάζω — «насыщать»)."
  14: "ἐξανατέλλων χόρτον τοῖς κτήνεσιν — 家畜のために草を生えさせ (ἐξανατέλλω — «произращать»; κτῆνος — «скот»). χλόην τῇ δουλείᾳ τῶν ἀνθρώπων — 人の働きのために青草を (χλόη — «зелень»; δουλεία — «служение, работа»). τοῦ ἐξαγαγεῖν ἄρτον ἐκ τῆς γῆς — 地からパンを取り出させる (ἐξάγω — «изводить»)."
  15: "καὶ οἶνος εὐφραίνει καρδίαν ἀνθρώπου — ぶどう酒は人の心を喜ばせ (εὐφραίνω — «веселить»). τοῦ ἱλαρῦναι πρόσωπον ἐν ἐλαίῳ — 油は顔を明るくし (ἱλαρύνω — «делать светлым, веселым»; ἔλαιον — 油). ἄρτος καρδίαν ἀνθρώπου στηρίζει — パンは人の心を支える (στηρίζω — «утверждать, подкреплять»)."
  16: "χορτασθήσεται τὰ ξύλα τοῦ πεδίου — 野の木々も満ち足りる (ξύλον — «дерево»). αἱ κέδροι τοῦ Λιβάνου, ἃς ἐφύτευσεν — 主が植えられたレバノンの杉も (κέδρος — 杉, как по корпусу); подлежащее — деревья, сказуемое предыдущего стиха подразумевается."
  17: "ἐκεῖ στρουθία ἐννοσσεύσουσιν — そこに小鳥たちが巣を作り (στρουθίον — «пташка»; ἐννοσσεύω — «вить гнездо»). τοῦ ἐρωδιοῦ ἡ οἰκία ἡγεῖται αὐτῶν — こうのとりの家が彼らに先立つ (ἐρωδιός — «цапля, аист»; ἡγέομαι — «вести, предводительствовать»); место тёмное, слав. «еродиев жилище наставляет я» — переведено буквально."
  18: "ὄρη τὰ ὑψηλὰ ταῖς ἐλάφοις — 高い山は鹿のためのもの (ἔλαφος — 鹿, как по корпусу). πέτρα καταφυγὴ τοῖς χοιρογρυλλίοις — 岩は岩だぬきの逃げ場である (χοιρογρύλλιος — «даман, горный заяц»; καταφυγή — «убежище»)."
  19: "ἐποίησεν σελήνην εἰς καιρούς — 主は月を造って季節を定め (σελήνη — «луна»; καιρός — «время, срок»). ὁ ἥλιος ἔγνω τὴν δύσιν αὐτοῦ — 太陽はその沈む所を知っている (δύσις — «заход»)."
  20: "ἔθου σκότος, καὶ ἐγένετο νύξ — あなたが暗やみを置かれると夜になり (σκότος — 暗やみ). ἐν αὐτῇ διελεύσονται πάντα τὰ θηρία τοῦ δρυμοῦ — 森の獣たちはみな、その中を歩み回る (δρυμός — «дубрава, лес»)."
  21: "σκύμνοι ὠρυόμενοι ἁρπάσαι — 若い獅子たちは獲物を奪おうとほえ (σκύμνος — «львёнок»; ὀρύομαι — «рычать»; ἁρπάζω — «похищать»). ζητῆσαι παρὰ τοῦ θεοῦ βρῶσιν αὐτοῖς — 神に自分たちの食物を求める (βρῶσις — «пища»)."
  22: "ἀνέτειλεν ὁ ἥλιος — 日が上ると (ἀνατέλλω — «восходить»). συνήχθησαν — 彼らは集まって (συνάγω — «собирать»). ἐν ταῖς μάνδραις αὐτῶν κοιτασθήσονται — 自分たちの寝床に伏す (μάνδρα — «загон, логово»; κοιτάζομαι — «ложиться»)."
  23: "ἐξελεύσεται ἄνθρωπος ἐπὶ τὸ ἔργον αὐτοῦ — 人は自分の仕事のために出て行く (ἔργον — «дело»). ἐπὶ τὴν ἐργασίαν αὐτοῦ ἕως ἑσπέρας — 自分の働きのために、夕べまで (ἐργασία — «работа, занятие»; ἑσπέρα — «вечер»)."
  24: "ὡς ἐμεγαλύνθη τὰ ἔργα σου, κύριε — 主よ、あなたのわざはなんと多いことか (μεγαλύνω — «умножать, величать»). πάντα ἐν σοφίᾳ ἐποίησας — あなたはすべてを知恵をもって造られた (σοφία — 知恵). ἐπληρώθη ἡ γῆ τῆς κτήσεώς σου — 地はあなたの造られたもので満ちている (κτῆσις — «тварь, имущество»)."
  25: "αὕτη ἡ θάλασσα ἡ μεγάλη καὶ εὐρύχωρος — 見よ、この広く大きな海を (εὐρύχωρος — «пространный»). ἐκεῖ ἑρπετά, ὧν οὐκ ἔστιν ἀριθμός — そこには数えきれない、地をはうものたち (ἑρπετόν — «пресмыкающееся»). ζῷα μικρὰ μετὰ μεγάλων — 小さなものも大きなものも (ζῷον — «живое существо»)."
  26: "ἐκεῖ πλοῖα διαπορεύονται — そこを舟が行き交い (πλοῖον — «корабль»; διαπορεύομαι — «проходить»). δράκων οὗτος, ὃν ἔπλασας ἐμπαίζειν αὐτῷ — あなたがそこに遊ばせようと造られたあの竜がいる (δράκων — 竜, как в Пс 73:13; πλάσσω — «создавать, лепить»; ἐμπαίζω — «играть»)."
  27: "πάντα πρὸς σὲ προσδοκῶσιν — すべてのものはあなたを待っている (προσδοκάω — «ожидать»). δοῦναι τὴν τροφὴν αὐτοῖς εὔκαιρον — 時に応じて食物をお与えになるのを (τροφή — «пища»; εὔκαιρος — «своевременный»)."
  28: "δόντος σου αὐτοῖς συλλέξουσιν — あなたがお与えになれば、彼らは集め (συλλέγω — «собирать»). ἀνοίξαντος δέ σου τὴν χεῖρα — あなたが手を開かれると (ἀνοίγω — «открывать»). τὰ σύμπαντα πλησθήσονται χρηστότητος — すべてのものは善いもので満たされる (χρηστότης — «благость»)."
  29: "ἀποστρέψαντος δέ σου τὸ πρόσωπον ταραχθήσονται — あなたが顔を背けられると、彼らは恐れ惑う (ἀποστρέφω — «отвращать»; ταράσσω — «смущать»). ἀντανελεῖς τὸ πνεῦμα αὐτῶν — あなたが彼らの息を取り上げられると (ἀνταναιρέω — «отнимать»; πνεῦμα — «дыхание»). ἐκλείψουσιν καὶ εἰς τὸν χοῦν αὐτῶν ἐπιστρέψουσιν — 彼らは消え、塵に帰る (ἐκλείπω — «исчезать»; χοῦς — 塵)."
  30: "ἐξαποστελεῖς τὸ πνεῦμά σου, καὶ κτισθήσονται — あなたがご自分の霊を送られると、彼らは造られる (ἐξαποστέλλω — «посылать»; πνεῦμα здесь — Дух Божий, поэтому 霊[れい]; κτίζω — «созидать»). ἀνακαινιεῖς τὸ πρόσωπον τῆς γῆς — あなたは地の面を新たにされる (ἀνακαινίζω — «обновлять»)."
  31: "ἤτω ἡ δόξα κυρίου εἰς τὸν αἰῶνα — 主の栄光がとこしえにあるように (ἤτω — повелительное 3 л. от εἰμί). εὐφρανθήσεται κύριος ἐπὶ τοῖς ἔργοις αὐτοῦ — 主がそのわざによって喜ばれますように (εὐφραίνομαι — «радоваться»)."
  32: "ὁ ἐπιβλέπων ἐπὶ τὴν γῆν καὶ ποιῶν αὐτὴν τρέμειν — 主が地に目を向けられると地は震え (ἐπιβλέπω — «призирать»; τρέμω — «трепетать»). ὁ ἁπτόμενος τῶν ὀρέων καὶ καπνίζονται — 山に触れられると煙を上げる (ἅπτομαι — «касаться»; καπνίζομαι — «дымиться»)."
  33: "ᾄσω τῷ κυρίῳ ἐν τῇ ζωῇ μου — わたしは生きている限り主に歌い (ζωή — 命). ψαλῶ τῷ θεῷ μου, ἕως ὑπάρχω — わたしがいる限りわたしの神にほめ歌を歌う (ψάλλω — «петь под струны»; ὑπάρχω — «существовать, быть»)."
  34: "ἡδυνθείη αὐτῷ ἡ διαλογή μου — わたしの思いが主に喜ばれますように (ἡδύνω — «услаждать»; διαλογή — «размышление, беседа»). ἐγὼ δὲ εὐφρανθήσομαι ἐπὶ τῷ κυρίῳ — わたしは主によって喜ぶ (ἐπί — «о, ради»)."
  35: "ἐκλίποισαν ἁμαρτωλοὶ ἀπὸ τῆς γῆς — 罪人が地から消えますように (ἐκλείπω — «исчезать»; оптатив). ἄνομοι ὥστε μὴ ὑπάρχειν αὐτούς — 不法の者がもはやいなくなるように (ἄνομος — «беззаконный»). εὐλόγει, ἡ ψυχή μου, τὸν κύριον — わたしの魂よ、主をほめたたえよ; рамка псалма, повтор ст. 1."
