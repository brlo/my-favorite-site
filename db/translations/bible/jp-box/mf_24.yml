verses:
  1: "イエスが神殿[しんでん]を出[で]て行[い]かれると、弟子[でし]たちが近[ちか]づいて来[き]て、神殿[しんでん]の建物[たてもの]をイエスに示[しめ]そうとした。"
  2: "イエスはお答[こた]えになった。「<j>あなたがたは、これらのすべてを見[み]ていないのか。はっきり言[い]っておく。ここには、崩[くず]されないで石[いし]の上[うえ]に残[のこ]る石[いし]は一[ひと]つもない。</j>」"
  3: "イエスがオリーブ山[やま]に座[すわ]っておられると、弟子[でし]たちがひそかに近[ちか]づいて来[き]て言[い]った。「わたしたちに教[おし]えてください。これらのことはいつ起[お]こるのですか。また、あなたの来臨[らいりん]と世[よ]の終[お]わりのしるしは何[なん]ですか。」"
  4: "イエスはお答[こた]えになった。「<j>だれにも惑[まど]わされないよう、気[き]を配[くば]りなさい。</j>"
  5: "<j>わたしの名[な]を名乗[なの]って『わたしがキリストだ』と言[い]う者[もの]が多[おお]く現[あらわ]れ、多[おお]くの人[ひと]を惑[まど]わすからである。</j>"
  6: "<j>戦争[せんそう]の騒[さわ]ぎや、戦争[せんそう]のうわさを聞[き]いても、慌[あわ]ててはならない。そういうことは必[かなら]ず起[お]こるが、まだ終[お]わりではない。</j>"
  7: "<j>民[たみ]は民[たみ]に、国[くに]は国[くに]に敵対[てきたい]し、方々[ほうぼう]では飢饉[ききん]と〔疫病[えきびょう]と〕地震[じしん]が起[お]こる。</j>"
  8: "<j>しかし、これらはすべて、産[う]みの苦[くる]しみの最初[さいしょ]のうめきにすぎない。</j>"
  9: "<j>そのとき、人々[ひとびと]はあなたがたを苦難[くなん]に引[ひ]き渡[わた]して殺[ころ]し、あなたがたはわたしの名[な]のために、すべての民[たみ]に憎[にく]まれる。</j>"
  10: "<j>そのとき、多[おお]くの人[ひと]がつまずき、互[たが]いに引[ひ]き渡[わた]し合[あ]い、憎[にく]み合[あ]う。</j>"
  11: "<j>また、多[おお]くの偽預言者[ぎよげんしゃ]が現[あらわ]れて、多[おお]くの人[ひと]を惑[まど]わす。</j>"
  12: "<j>不法[ふほう]が増[ふ]えるにつれて、多[おお]くの人[ひと]の愛[あい]は冷[ひ]えていく。</j>"
  13: "<j>だが、最後[さいご]まで耐[た]え抜[ぬ]く者[もの]は救[すく]われる。</j>"
  14: "<j>この天[てん]の国[くに]の福音[ふくいん]が、すべての民[たみ]への証[あかし]として、全世界[ぜんせかい]に宣[の]べ伝[つた]えられ、そのとき、終[お]わりが来[く]る。</j>」"
  15: "「<j>だから、預言者[よげんしゃ]ダニエルによって言[い]われた、荒廃[こうはい]の憎[にく]むべきものが聖[せい]なる所[ところ]に立[た]つのを見[み]たら――読[よ]む者[もの]は悟[さと]れ――、</j>"
  16: "<j>そのとき、ユダヤにいる人々[ひとびと]は山[やま]へ避難[ひなん]しなさい。</j>"
  17: "<j>屋上[おくじょう]にいる者[もの]は、家[いえ]にある物[もの]を取[と]りに下[お]りてはならない。</j>"
  18: "<j>畑[はたけ]にいる者[もの]も、上着[うわぎ]を取[と]りに後[うし]ろへ戻[もど]ってはならない。</j>"
  19: "<j>その日[ひ]には、身重[みおも]の女[おんな]と乳[ち]を飲[の]ませている女[おんな]は不幸[ふこう]である。</j>"
  20: "<j>冬[ふゆ]や安息日[あんそくび]に逃[に]げることにならないよう、祈[いの]りなさい。</j>"
  21: "<j>そのとき、世[よ]の始[はじ]めから今[いま]までなかったほどの大[おお]きな苦難[くなん]がある。今後[こんご]も、そのようなことは決[けっ]して起[お]こらない。</j>"
  22: "<j>もし、その日[ひ]が短[みじか]くされなければ、だれ一人[ひとり]救[すく]われない。しかし、選[えら]ばれた人[ひと]たちのために、その日[ひ]は短[みじか]くされる。</j>」"
  23: "「<j>そのとき、だれかが『見[み]よ、キリストはここにいる』『ここだ』と言[い]っても、信[しん]じてはならない。</j>"
  24: "<j>偽[にせ]キリストや偽預言者[ぎよげんしゃ]が現[あらわ]れて、できれば選[えら]ばれた人[ひと]たちさえも惑[まど]わそうとして、大[おお]きなしるしや不思議[ふしぎ]な業[わざ]を行[おこな]うからである。</j>"
  25: "<j>見[み]よ、わたしは前[まえ]もってあなたがたに言[い]っておいた。</j>"
  26: "<j>だから、彼[かれ]らがあなたがたに『見[み]よ、キリストは荒野[こうや]にいる』と言[い]っても、出[で]て行[い]ってはならない。『見[み]よ、奥[おく]の間[ま]にいる』と言[い]っても、信[しん]じてはならない。</j>"
  27: "<j>稲妻[いなずま]が東[ひがし]から出[で]て西[にし]まで閃[ひらめ]くように、人[ひと]の子[こ]の来臨[らいりん]もそのようである。</j>"
  28: "<j>死骸[しかばね]のある所[ところ]には、鷲[わし]が集[あつ]まる。</j>」"
  29: "「<j>その日[ひ]の苦難[くなん]のすぐ後[あと]、太陽[たいよう]は暗[くら]くなり、月[つき]は光[ひかり]を放[はな]たず、星[ほし]は天[てん]から落[お]ち、天[てん]の力[ちから]あるものは揺[ゆ]り動[うご]かされる。</j>"
  30: "<j>そのとき、天[てん]に人[ひと]の子[こ]のしるしが現[あらわ]れる。すると、地[ち]のすべての部族[ぶぞく]は嘆[なげ]き悲[かな]しみ、人[ひと]の子[こ]が大[おお]いなる力[ちから]と栄光[えいこう]を帯[お]び、天[てん]の雲[くも]に乗[の]って来[く]るのを仰[おが]ぎ見[み]る。</j>"
  31: "<j>人[ひと]の子[こ]は大[おお]きなラッパの音[ね]とともに天使[てんし]たちを遣[つか]わし、天使[てんし]たちは、天[てん]の果[は]てから天[てん]の果[は]てまで、四方[しほう]から選[えら]ばれた人[ひと]たちを集[あつ]める。</j>」"
  32: "「<j>いちじくの木[き]からたとえを学[まな]びなさい。枝[えだ]が柔[やわ]らかくなって葉[は]が萌[も]えると、夏[なつ]はもうすぐだと知[し]れる。</j>"
  33: "<j>同[おな]じように、あなたがたも、これらのことをすべて見[み]たら、人[ひと]の子[こ]が戸口[とぐち]に近[ちか]づいていることを知[し]りなさい。</j>"
  34: "<j>はっきり言[い]っておく。これらのことがすべて起[お]こるまで、この時代[じだい]は決[けっ]して過[す]ぎ去[さ]らない。</j>"
  35: "<j>天地[てんち]は過[す]ぎ去[さ]るが、わたしの言葉[ことば]は決[けっ]して過[す]ぎ去[さ]らない。</j>」"
  36: "「<j>その日[ひ]とその時[とき]を、知[し]っている者[もの]は一人[ひとり]もいない。天[てん]の天使[てんし]たちも知[し]らない。知[し]っておられるのは父[ちち]だけである。</j>"
  37: "<j>ノアの日々[ひび]のようである。人[ひと]の子[こ]の来臨[らいりん]も、そのようになる。</j>"
  38: "<j>洪水[こうずい]の前[まえ]の時代[じだい]、ノアが箱舟[はこぶね]に入[はい]る日[ひ]まで、人々[ひとびと]は食[た]べ、飲[の]み、めとり、嫁[とつ]がせていた。</j>"
  39: "<j>そして、洪水[こうずい]が来[き]てすべての者[もの]を押[お]し流[なが]すまで、彼[かれ]らは気[き]づかなかった。人[ひと]の子[こ]の来臨[らいりん]も、そのようになる。</j>"
  40: "<j>そのとき、二人[ふたり]が畑[はたけ]にいる。一人[ひとり]は取[と]られ、一人[ひとり]は残[のこ]される。</j>"
  41: "<j>二人[ふたり]の女[おんな]が臼[うす]を挽[ひ]いている。一人[ひとり]は取[と]られ、一人[ひとり]は残[のこ]される。</j>」"
  42: "「<j>だから、目[め]を覚[さ]ましていなさい。あなたがたの主[しゅ]がどの日[ひ]に来[く]るか、あなたがたは知[し]らないからである。</j>"
  43: "<j>しかし、これだけは知[し]っておきなさい。もし家[いえ]の主人[しゅじん]が、盗人[ぬすびと]の来[く]る夜[よ]の番[ばん]を知[し]っていたなら、目[め]を覚[さ]ましていて、自分[じぶん]の家[いえ]に穴[あな]を掘[ほ]らせはしなかっただろう。</j>"
  44: "<j>だから、あなたがたも用意[ようい]をしておきなさい。あなたがたが思[おも]いもしない時[とき]に、人[ひと]の子[こ]は来[く]るからである。</j>」"
  45: "「<j>主人[しゅじん]が、自分[じぶん]の家[いえ]の者[もの]たちの上[うえ]に立[た]てて、時[とき]に応[おう]じて食[た]べ物[もの]を与[あた]えさせた、忠実[ちゅうじつ]で賢[かしこ]い僕[しもべ]とは、いったいだれか。</j>"
  46: "<j>主人[しゅじん]が帰[かえ]って来[き]たとき、そのようにしているのを見[み]られる僕[しもべ]は幸[さいわ]いである。</j>"
  47: "<j>はっきり言[い]っておく。主人[しゅじん]は、その僕[しもべ]を自分[じぶん]の全[すべ]ての財産[ざいさん]の管理[かんり]に当[あ]たらせる。</j>"
  48: "<j>しかし、その悪[わる]い僕[しもべ]が心[こころ]の中[なか]で『わたしの主人[しゅじん]は来[く]るのが遅[おそ]い』と言[い]い、</j>"
  49: "<j>仲間[なかま]の僕[しもべ]たちを打[う]ち、酒飲[さかの]みたちと一緒[いっしょ]に食[た]べたり飲[の]んだりし始[はじ]めるなら、</j>"
  50: "<j>その僕[しもべ]の主人[しゅじん]は、思[おも]いもしない日[ひ]、知[し]らない時[し]に来[き]て、</j>"
  51: "<j>彼[かれ]を切[き]り裂[さ]き、その分[ぶん]を偽善者[ぎぜんしゃ]たちと同[おな]じにする。そこでは泣[な]きわめきと歯[は]ぎしりがある。</j>」"

notes:
  1: "ἱερόν — храмовый комплекс; 神殿, как в Мк 13:1."
  3: "παρουσία — 来臨 (в главе ещё 27, 37, 39); συντέλεια τοῦ αἰῶνος — 世の終わり, как в Мф 13:39–40, 49."
  7: "В критической базе λιμοὶ καὶ σεισμοί; Церковь (Елизаветинская «морове», jp-joc 疫病) читает καὶ λοιμοί — 〔疫病〕."
  8: "ὠδῖνες — «родовые муки»; 産みの苦しみ, как в Мк 13:8. ἀρχή — «начало»; 最初のうめきにすぎない передаёт «только начало», без смягчения."
  9: "εἰς θλῖψιν — 苦難に引き渡す; ἔθνη — すべての民 (не 異邦人)."
  14: "εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν — «во свидетельство всем народам»."
  15: "τὸ βδέλυγμα τῆς ἐρημώσεως (Дан 9:27); в Мк 13:14 — 憎むべき破壊者, здесь буквальнее 荒廃の憎むべきもの. ὁ ἀναγινώσκων νοείτω — обращение к читателю, как в Мк."
  20: "χειμών — зима; σάββατον — суббота (安息日)."
  21: "θλῖψις μεγάλη — 大きな苦難; ср. Мк 13:19."
  23: "ὧδε стоит дважды («здесь»); передал 『ここだ』, не сглаживая в «там»."
  24: "ψευδόχριστοι — 偽キリスト, как в Мк 13:22; τέρατα — 不思議な業."
  26: "ταμεῖα — внутренние покои; 奥の間, как в Мф 6:6."
  29: "αἱ δυνάμεις τῶν οὐρανῶν — «силы небесные»; передал 天の力あるもの. В Мк 13:25 то же место передано 天体 — расхождение сознательное, здесь буквальнее."
  31: "ἀπ᾽ ἄκρων οὐρανῶν ἕως ἄκρων αὐτῶν — «от краёв небес до краёв их»; 天の果てから天の果てまで, не сглажено в «до края земли». ἐκ τῶν τεσσάρων ἀνέμων — 四方から."
  36: "В критической базе есть οὐδὲ ὁ υἱός («ни Сын»); византийский текст, Елизаветинская («токмо Отец Мой един») и jp-joc в Мф 24:36 его не читают — в отличие от Мк 13:32. Оставил по церковному тексту, без 子も知らない; критическое чтение отмечено здесь."
  40: "παραλαμβάνεται… ἀφίεται — «берётся… оставляется»; 取られる・残される."
  43: "φυλακή — ночная стража; 夜の番."
  45: "οἰκετεία — домочадцы; 家の者たち."
  48: "χρονίζει μου ὁ κύριος — «медлит господин мой»; слова в сердце — в 『』."
  51: "διχοτομήσει — «рассечёт»; τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει — その分を偽善者たちと同じにする."
