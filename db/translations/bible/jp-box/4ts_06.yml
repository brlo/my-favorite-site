# jp-box, 4-я Царств, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 6: утонувший топор (1–7), сирийские засады и прозорливость Елисея (8–13),
# конница и огненные колесницы (14–17), ослепление сирийцев и мир (18–23),
# осада Самарии, голод и ропот царя (24–33).
# Нумерация по gr: 33 стиха, как и в csl.
# Речь — 「…」 первого уровня; вложенной речи в главе нет. Красного и синего нет.
# 〔…〕 нет: csl-чтения входят в основной текст без скобок, LXX-варианты
# и отличия от МТ отмечены в notes.
# Сносок ⟨…⟩ нет: 預言者, 神の人, 城壁, 粗布 уже в корпусе; カブ — мера объёма,
# пояснена в notes.
# jp-ni не использовался.

