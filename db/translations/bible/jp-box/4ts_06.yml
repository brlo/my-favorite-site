chapter: 6
draft: true

verses:
  1: "預言者[よげんしゃ]の弟子[でし]たちはエリシャに言[い]った。「ご覧[らん]のとおり、わたしたちがあなたの前[まえ]に住[す]んでいるこの場所[ばしょ]は、わたしたちには狭[せま]すぎる。"
  2: "ヨルダン川[がわ]まで行[い]って、そこから一人[ひとり]一[ひと]つずつ丸太[まるた]を取[と]り、そこに住[す]む所[ところ]を造[つく]ろう。」エリシャは言[い]った。「行[い]きなさい。」"
  3: "一人[ひとり]が言[い]った。「どうか、しもべたちと一緒[いっしょ]に来[き]てほしい。」エリシャは言[い]った。「わたしも行[い]こう。」"
  4: "エリシャは彼[かれ]らとともに行[い]った。彼[かれ]らはヨルダン川[がわ]へ来[き]て、木[き]を切[き]った。"
  5: "ところが、一人[ひとり]が丸太[まるた]を切[き]倒[たお]しているとき、斧[おの]の鉄[てつ]がはずれて水[みず]の中[なか]に落[お]ちた。彼[かれ]は叫[さけ]んで言[い]った。「ああ、ご主人[しゅじん]さま。これは借[か]り物[もの]だったのに。」"
  6: "神[かみ]の人[ひと]は言[い]った。「どこに落[お]ちたのか。」彼[かれ]がその場所[ばしょ]を示[しめ]すと、神[かみ]の人[ひと]は木[き]を一本[いっぽん]切[き]ってそこへ投[な]げ込[こ]んだ。すると、鉄[てつ]が浮[う]き上[あ]がった。"
  7: "エリシャは言[い]った。「自分[じぶん]で取[と]り上[あ]げなさい。」彼[かれ]は手[て]を伸[の]ばして、それを取[と]った。"
  8: "シリアの王[おう]はイスラエルと戦[たたか]っていた。彼[かれ]は自分[じぶん]の家来[けらい]たちと相談[そうだん]して言[い]った。「ある隠[かく]れた場所[ばしょ]に陣[じん]を張[は]ろう。」"
  9: "エリシャはイスラエルの王[おう]に人[ひと]を遣[つか]わして言[い]った。「あの場所[ばしょ]を通[とお]ってはならない。そこにシリアの者[もの]たちが潜[ひそ]んでいるからだ。」"
  10: "イスラエルの王[おう]は、エリシャが告[つ]げた場所[ばしょ]へ人[ひと]を遣[つか]わし、そこを警戒[けいかい]した。それは一度[いちど]や二度[にど]ではなかった。"
  11: "シリアの王[おう]の心[こころ]はこのことで騒[さわ]ぎ立[た]ち、彼[かれ]は家来[けらい]たちを呼[よ]んで言[い]った。「イスラエルの王[おう]にわたしを売[う]り渡[わた]す者[もの]がだれか、わたしに告[つ]げないのか。」"
  12: "家来[けらい]の一人[ひとり]が言[い]った。「いいえ、ご主人[しゅじん]さま、王[おう]よ。イスラエルにいる預言者[よげんしゃ]エリシャが、あなたが寝室[しんしつ]の奥[おく]の部屋[へや]で話[はな]す言葉[ことば]までも、残[のこ]らずイスラエルの王[おう]に告[つ]げているのだ。」"
  13: "王[おう]は言[い]った。「行[い]って、あの者[もの]がどこにいるか見[み]て来[こ]い。わたしは人[ひと]を遣[つか]わして、彼[かれ]を捕[と]らえる。」すると、人[ひと]々[びと]は告[つ]げて言[い]った。「見[み]よ、彼[かれ]はドタンにいる。」"
  14: "王[おう]はそこへ馬[うま]と戦車[せんしゃ]と大[おお]きな軍勢[ぐんせい]を送[おく]った。彼[かれ]らは夜[よる]のうちに来[き]て、町[まち]を包囲[ほうい]した。"
  15: "エリシャに仕[つか]える者[もの]が朝早[あさはや]く起[お]きて外[そと]へ出[で]ると、見[み]よ、軍勢[ぐんせい]が馬[うま]や戦車[せんしゃ]とともに町[まち]を取[と]り囲[かこ]んでいた。従者[じゅうしゃ]は彼[かれ]に言[い]った。「ああ、ご主人[しゅじん]さま。どうしたらよいのか。」"
  16: "エリシャは言[い]った。「恐[おそ]れるな。わたしたちとともにいる者[もの]は、彼[かれ]らとともにいる者[もの]よりも多[おお]いのだ。」"
  17: "エリシャは祈[いの]って言[い]った。「主[しゅ]よ、どうかこの若[わか]い者[もの]の目[め]を開[ひら]いて、見[み]えるようにしてほしい。」主[しゅ]は若[わか]い者[もの]の目[め]を開[ひら]かれた。彼[かれ]が見[み]ると、見[み]よ、山[やま]は馬[うま]と、エリシャの周[まわ]りを囲[かこ]む火[ひ]の戦車[せんしゃ]で満[み]ちていた。"
  18: "彼[かれ]らがエリシャのところへ下[くだ]って来[く]ると、エリシャは主[しゅ]に祈[いの]って言[い]った。「どうか、この民[たみ]の目[め]をくらませてほしい。」主[しゅ]はエリシャの言葉[ことば]のとおりに、彼[かれ]らの目[め]をくらませた。"
  19: "エリシャは彼[かれ]らに言[い]った。「これはあの町[まち]ではない。この道[みち]でもない。わたしについて来[き]なさい。あなたがたが探[さが]している人[ひと]のところへ連[つ]れて行[い]こう。」そして彼[かれ]らをサマリアへ連[つ]れて行[い]った。"
  20: "彼[かれ]らがサマリアに入[はい]ると、エリシャは言[い]った。「主[しゅ]よ、どうかこの者[もの]たちの目[め]を開[ひら]いて、見[み]えるようにしてほしい。」主[しゅ]が彼[かれ]らの目[め]を開[ひら]かれると、彼[かれ]らは見[み]た。見[み]よ、彼[かれ]らはサマリアの真[ま]ん中[なか]にいた。"
  21: "イスラエルの王[おう]は彼[かれ]らを見[み]て、エリシャに言[い]った。「父[ちち]よ、打[う]ち殺[ころ]してしまおうか。」"
  22: "エリシャは言[い]った。「打[う]ってはならない。あなたが剣[つるぎ]と弓[ゆみ]で捕[と]らえた者[もの]でもないのに、あなたは打[う]とうとするのか。彼[かれ]らの前[まえ]にパンと水[みず]を置[お]き、食[た]べさせ、飲[の]ませて、自分[じぶん]たちの主君[しゅくん]のもとへ帰[かえ]らせなさい。」"
  23: "彼[かれ]は彼[かれ]らのために大[おお]きな宴[うたげ]を設[もう]けた。彼[かれ]らは食[た]べ、飲[の]んだ。王[おう]は彼[かれ]らを帰[かえ]らせたので、彼[かれ]らは自分[じぶん]たちの主君[しゅくん]のもとへ帰[かえ]って行[い]った。シリアの略奪隊[りゃくだつたい]は、もう二度[にど]とイスラエルの地[ち]へは来[こ]なかった。"
  24: "その後[あと]、シリアの王[おう]ベン・ハダドは全[ぜん]軍[ぐん]を集[あつ]め、上[のぼ]って来[き]てサマリアを包囲[ほうい]した。"
  25: "サマリアには大[おお]きな飢[う]えが起[こ]った。彼[かれ]らが町[まち]を包囲[ほうい]していたので、ろばの頭[あたま]一[ひと]つが銀[ぎん]五十[ごじゅう]シケル、鳩[はと]の糞[ふん]の四分[しぶん]の一[いち]カブが銀[ぎん]五[ご]シケルで売[う]られるほどになった。"
  26: "イスラエルの王[おう]が城壁[じょうへき]の上[うえ]を通[とお]っていたとき、一人[ひとり]の女[おんな]が彼[かれ]に叫[さけ]んで言[い]った。「助[たす]けてほしい、ご主人[しゅじん]さま、王[おう]よ。」"
  27: "王[おう]は彼女[かのじょ]に言[い]った。「主[しゅ]があなたを救[すく]わないのなら、わたしがどこからあなたを救[すく]えようか。脱穀場[だっこくじょう]からか、それともぶどうの踏[ふ]み場[ば]からか。」"
  28: "王[おう]は彼女[かのじょ]に言[い]った。「どうしたのか。」彼女[かのじょ]は言[い]った。「この女[おんな]がわたしに言[い]った。『あなたの息子[むすこ]をよこしなさい。今日[きょう]はそれを使[つか]いましょう。明日[あした]はわたしの息子[むすこ]を使[つか]いましょう』と。"
  29: "わたしたちはわたしの息子[むすこ]を煮[に]て食[た]べた。わたしは二日目[ふつかめ]に彼女[かのじょ]に言[い]った。『あなたの息子[むすこ]をよこしなさい。それを使[つか]いましょう。』ところが、彼女[かのじょ]は自分[じぶん]の息子[むすこ]を隠[かく]してしまった。」"
  30: "イスラエルの王[おう]は女[おんな]の言葉[ことば]を聞[き]くと、自分[じぶん]の衣[ころも]を引[ひ]き裂[さ]いた。彼[かれ]は城壁[じょうへき]の上[うえ]を歩[ある]いていたので、民[たみ]は、彼[かれ]が衣[ころも]の下[した]に粗布[あらぬの]を身[み]につけているのを見[み]た。"
  31: "王[おう]は言[い]った。「神[かみ]がわたしにそうなさり、さらにもっとひどいことをなさるように。エリシャの頭[あたま]が今日[きょう]のうちに、彼[かれ]の上[うえ]に残[のこ]ることはない。」"
  32: "エリシャは自分[じぶん]の家[いえ]に座[すわ]っていた。長老[ちょうろう]たちも彼[かれ]とともに座っていた。王[おう]は自分[じぶん]の前[まえ]に人[ひと]を一人[ひとり]遣[つか]わした。使者[ししゃ]が彼[かれ]のところへ来[く]る前[まえ]に、エリシャは長老[ちょうろう]たちに言[い]った。「あなたがたは、この人殺[ひとごろ]しの子[こ]がわたしの頭[あたま]を切[き]り落[お]とすために人[ひと]を遣[つか]わしたことを知[し]っているか。見[み]なさい。使者[ししゃ]が来[き]たら、戸[と]を閉[し]めて、戸[と]のところで彼[かれ]を押[お]さえつけなさい。彼[かれ]の主君[しゅくん]の足音[あしおと]が、彼[かれ]の後[うし]ろで聞[き]こえないか。」"
  33: "彼[かれ]がまだ彼[かれ]らと話[はな]していると、見[み]よ、使者[ししゃ]が彼[かれ]のもとへ下[くだ]って来[き]て言[い]った。「見[み]よ、この災[わざわ]いは主[しゅ]からのものだ。これ以上[いじょう]、何[なに]を主[しゅ]に耐[た]え忍[しの]べというのか。」"

notes:
  1: "στενὸς ἀφ᾽ ἡμῶν — «тесно нам» (στενός — узкий). ἐνώπιόν σου — «пред тобою», т. е. где мы живём при тебе."
  2: "δοκόν — бревно, балка (丸太; слав. «бервно»). ἀνὴρ εἷς ... δοκὸν μίαν — «каждый по одному бревну». ποιήσωμεν ἑαυτοῖς ἐκεῖ τοῦ οἰκεῖν ἐκεῖ — «сделаем себе там, чтобы жить там»; повтор ἐκεῖ сохранён."
  3: "Ἐπιεικέως — «снисходительно, будь добр» (ἐπιεικής; слав. «кротце»). δεῦρο μετὰ τῶν δούλων σου — «пойди с рабами твоими»."
  4: "ἔτεμνον τὰ ξύλα — «рубили деревья» (τέμνω)."
  5: "καταβάλλων τὴν δοκόν — «сваливая бревно». τὸ σιδήριον — «железо», т. е. топор (斧); слав. уточняет «спаде с топорища» — в гр просто ἐξέπεσεν «выпало». Ὦ, κύριε — «о, господин». κεχρημένον — «взятое в долг, на подержание» (χράω; слав. «заемное»)."
  6: "ἀπέκνισεν ξύλον — «отрубил [кусок] дерева» (ἀποκνίζω; слав. «отсече древо»). ἐπεπόλασεν — «всплыло» (ἐπιπολάζω)."
  7: "Ὕψωσον σαυτῷ — «подними себе», т. е. возьми (ὑψόω). ἐξέτεινεν τὴν χεῖρα — «протянул руку»."
  8: "ἦν πολεμῶν — «воевал» (перифрастическая конструкция). ἐβουλεύσατο πρὸς τοὺς παῖδας — «совещался со слугами». ελμωνι — тёмное слово (не греч.); слав. «на месте некоем сокровеннем» (тайном), передано «в укромном месте»."
  9: "Φύλαξαι μὴ παρελθεῖν — «берегись пройти». κέκρυπται — перфект «скрылись, залегли» (κρύπτω)."
  10: "ἐφυλάξατο ἐκεῖθεν — «остерегся оттуда», т. е. принял меры предосторожности. οὐ μίαν οὐδὲ δύο — «не раз и не два»."
  11: "ἐξεκινήθη ἡ ψυχή — «встревожилась душа» (ἐκκινέω). τίς προδίδωσίν με — «кто предаёт меня» (προδίδωμι)."
  12: "Οὐχί — «нет». ταμιεῖον τοῦ κοιτῶνος — «хранилище спальни», т. е. потайная внутренняя комната (слав. «сокровище ложницы твоея»)."
  13: "Δεῦτε ἴδετε — «пойдите, посмотрите». Δωθαιμ — Дотан (ドタン; слав. «Дофаим»)."
  14: "ἵππον καὶ ἅρμα καὶ δύναμιν βαρεῖαν — «коней, колесницы и силу тяжкую». περιεκύκλωσαν — «окружили» (κυκλόω)."
  15: "ὤρθρισεν — «встал рано» (ὀρθρίζω). ὁ λειτουργὸς Ελισαιε — «служитель Елисея» (слав. «раб елиссеев»). πῶς ποιήσωμεν — «что нам делать»."
  16: "πλείους οἱ μεθ᾽ ἡμῶν — «больше тех, кто с нами» (πλείους — сравн. степ.)."
  17: "διάνοιξον τοὺς ὀφθαλμούς — «открой глаза» (διανοίγω). τὸ ὄρος πλῆρες ἵππων — «гора, полная коней». ἅρμα πυρός — «колесница огненная» (в гр ед. ч.; в ru мн. ч. «колесницами»)."
  18: "κατέβησαν πρὸς αὐτόν — «сошли к нему». Πάταξον ... ἀορασίᾳ — «порази... невидением» (ἀορασία — слепота, невидимость; слав. «невидением», в ru «слепотою»). ἐπάταξεν — «поразил» (πατάσσω)."
  19: "Οὐχ αὕτη ἡ πόλις καὶ αὕτη ἡ ὁδός — «не этот город и не эта дорога». ἀπάξω — «уведу» (ἀπάγω). εἰς Σαμάρειαν — «в Самарию»."
  20: "Ἄνοιξον ... τοὺς ὀφθαλμοὺς αὐτῶν — «открой глаза их». ἦσαν ἐν μέσῳ Σαμαρείας — «были посреди Самарии»."
  21: "Εἰ πατάξας πατάξω — усиленный оборот «поразить ли поражая», т. е. «не избить ли». πάτερ — «отец», обращение к пророку."
  22: "Οὐ πατάξεις — «не поразишь». εἰ μὴ οὓς ᾐχμαλώτευσας — «разве только тех, кого ты пленил» (αἰχμαλωτεύω). παράθες ἄρτους καὶ ὕδωρ — «предложи хлебы и воду» (παρατίθημι)."
  23: "παρέθηκεν αὐτοῖς παράθεσιν μεγάλην — «предложил им большое угощение» (παράθεσις — стол, трапеза). οὐ προσέθεντο ἔτι — «не продолжали более» (προστίθημι). μονόζωνοι Συρίας — «отряды Сирии» (см. 5:2)."
  24: "υἱὸς Αδερ — «сын Адера», т. е. Венадад (ベン・ハダド; ср. 3 Цар 20:1). ἤθροισεν — «собрал» (ἀθροίζω). περιεκάθισεν — «обложил, осадил» (περικαθίζω)."
  25: "κεφαλὴ ὄνου πεντήκοντα σίκλων — «ослиная голова за пятьдесят сиклей». τέταρτον τοῦ κάβου κόπρου περιστερῶν — «четверть каба голубиного помёта» (κάβος — мера объёма, カブ). κόπρος περιστερῶν — букв. «помёт голубей»; некоторые понимают как вид гороха или бобов. В ru «по восьмидесяти сиклей» — по МТ, в LXX пятьдесят."
  26: "διαπορευόμενος ἐπὶ τοῦ τείχους — «проходя по стене». Σῶσον, κύριε βασιλεῦ — «спаси, господин царь» (σῴζω)."
  27: "Μή σε σώσαι κύριος — «пусть не спасёт тебя Господь»; оборот с μή в значении условия: «если Господь не спасёт». ἅλων — гумно (脱穀場); ληνός — давильня, точило (ぶどうの踏み場)."
  28: "Τί ἐστίν σοι — «что с тобою». Δὸς τὸν υἱόν σου — «отдай сына твоего»."
  29: "ἡψήσαμεν — «сварили» (ἕψω). ἔκρυψεν τὸν υἱὸν αὐτῆς — «скрыла сына своего» (κρύπτω)."
  30: "διέρρηξεν τὰ ἱμάτια — «разодрал одежды». σάκκος — вретище, дерюга (粗布). ἐπὶ τῆς σαρκὸς αὐτοῦ ἔσωθεν — «на теле его, внутри», т. е. под одеждой."
  31: "Τάδε ποιήσαι μοι ὁ θεὸς καὶ τάδε προσθείη — клятвенная формула «то и то пусть сделает мне Бог и ещё приложит». εἰ στήσεται ἡ κεφαλὴ Ελισαιε ἐπ᾽ αὐτῷ — «если останется голова Елисея на нём» (на его теле). В ru добавлено «сына Сафатова» — по МТ, в гр нет."
  32: "ὁ υἱὸς τοῦ φονευτοῦ — «сын убийцы» (Иорам, сын Ахава; ср. 3 Цар 21). πρὶν ἐλθεῖν τὸν ἄγγελον — «прежде чем придёт посланный» (ἄγγελος здесь «посланник»). παραθλίψατε αὐτὸν ἐν τῇ θύρᾳ — «прижмите его дверью» (παραθλίβω). οὐχὶ φωνὴ τῶν ποδῶν — «не голос ли ног», т. е. не слышно ли шагов."
  33: "ἔτι αὐτοῦ λαλοῦντος — «ещё когда он говорил» (родительный самостоятельный). ἄγγελος — «посланник» (слав. «вестник»), не ангел. τί ὑπομείνω τῷ κυρίῳ ἔτι — «что ещё претерплю от Господа» (ὑπομένω; слав. «что потерплю Господеви ксему»); передано как ропот: «чего ещё ждать»."
