verses:
  1: "ヤコブ、神[かみ]と主[しゅ]イエス・キリストの僕[しもべ]から、離散[りさん]のうちにある十二[じゅうに]の部族[ぶぞく]へ。挨拶[あいさつ]を送[おく]る。"
  2: "わたしの兄弟[きょうだい]たちよ、いろいろな試練[しれん]に陥[おちい]るときには、それを大[おお]いなる喜[よろこ]びと考[かんが]えなさい。"
  3: "それは、あなたがたの信仰[しんこう]の試[こころ]みが忍耐[にんたい]を生[う]み出[だ]すことを、知[し]っているからである。"
  4: "忍耐[にんたい]が完全[かんぜん]な行[おこな]いを果[は]たすようにしなさい。あなたがたが完全[かんぜん]で、何[なに]も欠[か]くところのない、全[まった]き者[もの]となるためである。"
  5: "あなたがたのうちに、知恵[ちえ]の足[た]りない者[もの]があれば、すべての人[ひと]に惜[お]しみなく与[あた]え、とがめることのない神[かみ]に求[もと]めなさい。そうすれば、与[あた]えられる。"
  6: "ただ、少[すこ]しも疑[うたが]わず、信仰[しんこう]をもって求[もと]めなさい。疑[うたが]う者[もの]は、風[かぜ]に吹[ふ]かれ、かき回[まわ]される海[うみ]の波[なみ]に似[に]ているからである。"
  7: "そういう人[ひと]は、主[しゅ]から何[なに]かを受[う]け取[と]れるとは思[おも]ってはならない。"
  8: "心[こころ]が二[ふた]つに分[わ]かれた人[ひと]は、そのすべての道[みち]で定[さだ]まらない者[もの]である。"
  9: "低[ひく]い身[み]にある兄弟[きょうだい]は、自分[じぶん]の高[たか]さを誇[ほこ]りとしなさい。"
  10: "富[とみ]む者[もの]は、自分[じぶん]の低[ひく]さを誇[ほこ]りとしなさい。草[くさ]の花[はな]のように過[す]ぎ去[さ]るからである。"
  11: "日[ひ]が上[のぼ]り、焼[や]けつく熱[ねつ]が加[くわ]わると、草[くさ]は枯[か]れ、その花[はな]は落[お]ち、その姿[すがた]の美[うつく]しさも失[うしな]われる。富[とみ]む者[もの]も、その歩[あゆ]みのうちに、このようにしぼんでいく。"
  12: "試練[しれん]に耐[た]える人[ひと]は幸[さいわ]いである。その人[ひと]は試[こころ]みを受[う]けて通[とお]った後[のち]、命[いのち]の冠[かんむり]を受[う]けるからである。それは、〔主[しゅ]が〕ご自身[じしん]を愛[あい]する者[もの]たちに約束[やくそく]されたものである。"
  13: "誘惑[ゆうわく]に遭[あ]うとき、だれも「神[かみ]から誘惑[ゆうわく]を受[う]けている」と言[い]ってはならない。神[かみ]は悪[あく]に誘[さそ]われることのない方[かた]であり、ご自身[じしん]がだれかを誘惑[ゆうわく]することもないからである。"
  14: "むしろ、それぞれが自分[じぶん]の欲[よく]に引[ひ]かれ、おびき寄[よ]せられて、誘惑[ゆうわく]に落[お]ちいるのである。"
  15: "次[つぎ]に、欲[よく]がはらんで罪[つみ]を産[う]み、罪[つみ]が熟[じゅく]して死[し]を産[う]むのである。"
  16: "わたしの愛[あい]する兄弟[きょうだい]たちよ、思[おも]い違[ちが]ってはならない。"
  17: "すべての良[よ]い贈[おく]り物[もの]と、すべての完全[かんぜん]な賜[たま]え物[もの]は、上[うえ]から、光[ひかり]の父[ちち]から下[くだ]ってくる。その方[かた]には変[か]わりがなく、移[うつ]り変[か]わる影[かげ]もない。"
  18: "その方[かた]は、ご自身[じしん]の御心[みこころ]のままに、真理[しんり]の言葉[ことば]によってわたしたちを生[う]み出[だ]し、わたしたちをご自身[じしん]の造[つく]られたものの初[はつ]穂[ほ]のような者[もの]とされたのである。"
  19: "わたしの愛[あい]する兄弟[きょうだい]たちよ、知[し]っておきなさい。すべての人[ひと]は、聞[き]くことに早[はや]く、語[かた]ることに遅[おそ]く、怒[いか]ることに遅[おそ]い者[もの]でありなさい。"
  20: "人[ひと]の怒[いか]りは、神[かみ]の義[ぎ]を成[な]し遂[と]げないからである。"
  21: "だから、すべての汚[けが]れと、余[あま]っている悪[あく]とを捨[す]て去[さ]り、柔和[にゅうわ]さをもって、あなたがたの魂[たましい]を救[すく]うことのできる、植[う]え付[つ]けられた言葉[ことば]を受[う]け入[い]れなさい。"
  22: "言葉[ことば]を行[おこな]う者[もの]となりなさい。ただ聞[き]くだけで、自分[じぶん]を欺[あざむ]く者[もの]となってはならない。"
  23: "言葉[ことば]を聞[き]いても行[おこな]わない者[もの]は、鏡[かがみ]に映[うつ]る自分[じぶん]の生[う]まれつきの顔[かお]をじっと見[み]る人[ひと]に似[に]ている。"
  24: "というのは、その人[ひと]は自分[じぶん]をじっくり見[み]てから去[さ]ってしまい、自分[じぶん]がどんな者[もの]であったかをすぐに忘[わす]れてしまうからである。"
  25: "しかし、自由[じゆう]の完全[かんぜん]な律法[りっぽう]をのぞき込[こ]んで、そこにとどまる者[もの]は、聞[き]いて忘[わす]れる者[もの]ではなく、行[おこな]いを成[な]す者[もの]となって、その行[おこな]いのうちに幸[さいわ]いである。"
  26: "自分[じぶん]は敬虔[けいけん]であると思[おも]っていても、舌[した]を制[せい]さず、自分[じぶん]の心[こころ]を欺[あざむ]いているなら、その人[ひと]の敬虔[けいけん]はむなしい。"
  27: "父[ちち]である神[かみ]の前[まえ]に清[きよ]く、汚[けが]れのない敬虔[けいけん]とは、みなしごとやもめをその苦難[くなん]のうちに見舞[みま]い、自分[じぶん]を世[よ]の汚[けが]れから守[まも]ることである。"

notes:
  1: "Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος — ヤコブ、神と主イエス・キリストの僕. δοῦλος — 僕[しもべ] (как в Флп 2:7). ταῖς δώδεκα φυλαῖς — 十二の部族; φυλή — род, колено. ταῖς ἐν τῇ διασπορᾷ — 離散のうちにある: διασπορά — рассеяние, устойчивый термин; 地 не добавлено. χαίρειν — эпистолярное приветствие, 挨拶を送る (как Деян 15:23; 23:26)."
  2: "Πᾶσαν χαρὰν ἡγήσασθε — 大いなる喜びと考えなさい (πᾶσαν — «всякую», т.е. полную, без изъятия; ἡγέομαι — считать; jp-joc 大なる喜と爲せ). πειρασμοῖς περιπέσητε ποικίλοις — いろいろな試練に陥る; περιπίπτω — ввергаться, попадать. πειρασμός в 1:2–4, 12 — 試練 (испытание), в 1:13–14 — 誘惑 (влечение ко злу): различие держится по контексту."
  3: "τὸ δοκίμιον ὑμῶν τῆς πίστεως — 信仰の試み (δοκίμιον — проба, проверка подлинности, ср. 1 Пет 1:7). κατεργάζεται — 生み出す (совершает, производит; ср. 1:20)."
  4: "ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω — 忍耐が完全な行いを果たすようにしなさい (букв. «пусть имеет совершенное дело»; императив 3-го лица передан оборотом ようにしなさい). τέλειοι καὶ ὁλόκληροι — 完全で、全き者; ἐν μηδενὶ λειπόμενοι — 何も欠くところのない: ὁλόκληρος и λειπόμενος сближены, чтобы не дробить ряд из трёх почти синонимов."
  5: "λείπεται σοφίας — 知恵の足りない (gen. недостатка). τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς — すべての人に惜しみなく与え; ἁπλῶς — «просто, без задней мысли, щедро». μὴ ὀνειδίζοντος — とがめることのない (ὀνειδίζω — укорять, поносить)."
  6: "ἐν πίστει, μηδὲν διακρινόμενος — 少しも疑わず、信仰をもって; διακρίνομαι — колебаться, раздваиваться (ср. 1:8; 2:4). κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ — 風に吹かれ、かき回される海の波 (ἀνεμίζω — поднимать ветром; ῥιπίζω — вздымать, бросать)."
  7: "μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος — そういう人は…思ってはならない. λήμψεταί τι παρὰ τοῦ κυρίου — 主から何かを受け取る; в базе κυρίου без дополнений, «что-либо» не расширено."
  8: "ἀνὴρ δίψυχος — 心が二つに分かれた人 (δίψυχος, букв. «двоящийся душой»; тот же корень в 4:8). ἀκατάστατος ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ — すべての道で定まらない (ἀκατάστατος — неустойчивый, ср. 3:8)."
  9: "Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινός — 低い身にある兄弟 (ταπεινός здесь о социальном унижении, не о смирении). ἐν τῷ ὕψει αὐτοῦ — 自分の高さ (ὕψος — высота, возвышение); ст. 9–10 построены параллельно: 高さ / 低さ."
  10: "ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ — 富む者は自分の低さを; ταπείνωσις — унижение, низкое положение. ὡς ἄνθος χόρτου παρελεύσεται — 草の花のように過ぎ去る (образ Ис 40:6–8, но без формулы цитаты, поэтому 「」 не ставятся)."
  11: "ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι — 日が上り、焼けつく熱が加わると (καύσων — палящий зной, знойный ветер). ἐξήρανεν τὸν χόρτον — 草は枯れ. ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ — その姿の美しさ (πρόσωπον — лицо, вид; 姿, чтобы не сказать «лицо цветка»). ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται — その歩みのうちにしぼんでいく (πορεία — путь, ход; μαραίνω — увядать)."
  12: "Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν — 試練に耐える人は幸い. δόκιμος γενόμενος — 試みを受けて通った後 (δόκιμος — испытанный, прошедший пробу). στέφανος τῆς ζωῆς — 命の冠. ὃν ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν — подлежащего в базе нет, оно подразумевается (Бог); jp-joc называет 主, и слово 主 в базе отсутствует, поэтому 〔主[しゅ]が〕."
  13: "μηδεὶς πειραζόμενος λεγέτω — 誘惑に遭うとき、だれも…と言ってはならない; речь человека — в 「」, не красная. ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν — 神は悪に誘われることのない方 (ἀπείραστος — неискушаемый). πειράζει δὲ αὐτὸς οὐδένα — ご自身がだれかを誘惑することもない."
  14: "ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας — それぞれが自分の欲に; ἐπιθυμία — 欲. ἐξελκόμενος καὶ δελεαζόμενος — 引かれ、おびき寄せられて (ἐξέλκω — вытаскивать, увлекать; δελεάζω — приманивать приманкой, ср. 2 Пет 2:14.18)."
  15: "εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν — 欲がはらんで罪を産み (συλλαμβάνω — зачинать). ἀποτελεσθεῖσα — 熟して (доведённая до конца, ср. 1:4 τέλειος). ἀποκύει θάνατον — 死を産む (ἀποκυέω — рождать)."
  16: "Μὴ πλανᾶσθε — 思い違ってはならない (πλανάω — вводить в заблуждение, ср. 5:19). ἀδελφοί μου ἀγαπητοί — わたしの愛する兄弟たち."
  17: "πᾶσα δόσις ἀγαθή… πᾶν δώρημα τέλειον — すべての良い贈り物と…すべての完全な賜え物 (два близких слова: δόσις — даяние, δώρημα — дар). πατρὸς τῶν φώτων — 光の父 (светила, ср. Быт 1:14–16). παρ' ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα — その方には変わりがなく、移り変わる影もない (παραλλαγή — изменение; ἀποσκίασμα — отбрасываемый тенью отблеск, «тень поворота»)."
  18: "βουληθεὶς ἀπεκύησεν ἡμᾶς — 御心のままに…生み出し (βούλομαι — желать, определять). λόγῳ ἀληθείας — 真理の言葉. ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων — ご自身の造られたものの初穂のような者 (ἀπαρχή — начаток, первый плод; τινα — «некий», поэтому のような者)."
  19: "Ἴστε — 知っておきなさい (императив; jp-joc передаёт 故に, но форма повелительная). ἔστω δὲ πᾶς ἄνθρωπος — すべての人は…でありなさい. ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν — 聞くことに早く、語ることに遅く、怒ることに遅い (εἰς с инфинитивом — «к тому, чтобы»)."
  20: "ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ οὐκ ἐργάζεται — 人の怒りは神の義を成し遂げない (ἐργάζομαι — совершать, делать; ср. 1:3)."
  21: "ἀποθέμενοι πᾶσαν ῥυπαρίαν — すべての汚れを捨て去り (ῥυπαρία — грязь, ср. 2:2 ῥυπαρᾷ ἐσθῆτι). περισσείαν κακίας — 余っている悪 (περισσεία — избыток, остаток; jp-joc 餘れる惡). ἐν πραΰτητι — 柔和さをもって. ἔμφυτον λόγον — 植え付けられた言葉 (ἔμφυτος — врождённый, насаждённый)."
  22: "ποιηταὶ λόγου — 言葉を行う者. μὴ ἀκροαταὶ μόνον — ただ聞くだけで. παραλογιζόμενοι ἑαυτούς — 自分を欺く者 (παραλογίζομαι — обманывать, обольщать, ср. Кол 2:4)."
  23: "ἀκροατὴς λόγου — 言葉を聞く者. τὸ πρόσωπον τῆς γενέσεως αὐτοῦ — 生まれつきの顔 (букв. «лицо рождения»; γένεσις — рождение, происхождение). ἐν ἐσόπτρῳ — 鏡に (ἔσοπτρον — зеркало, ср. 1 Кор 13:12)."
  24: "κατενόησεν γὰρ ἑαυτόν — というのは、その人は自分をじっくり見て (κατανοέω — всматриваться, ср. Лк 12:24). ἀπελήλυθεν — 去ってしまい. ἐπελάθετο ὁποῖος ἦν — 自分がどんな者であったかをすぐに忘れる."
  25: "ὁ δὲ παρακύψας — のぞき込んで (παρακύπτω — наклоняться, заглядывать, ср. 1 Пет 1:12). νόμον τέλειον τὸν τῆς ἐλευθερίας — 自由の完全な律法 (род. качества). παραμείνας — そこにとどまる者. ἀκροατὴς ἐπιλησμονῆς — 聞いて忘れる者 (букв. «слушатель забвения»). ποιητὴς ἔργου — 行いを成す者. μακάριος ἐν τῇ ποιήσει αὐτοῦ — その行いのうちに幸い."
  26: "δοκεῖ θρησκὸς εἶναι — 自分は敬虔であると思う (θρησκός — благочестивый, набожный). μὴ χαλιναγωγῶν γλῶσσαν — 舌を制さず (χαλιναγωγέω — обуздывать уздой, ср. 3:2). ἀπατῶν καρδίαν — 心を欺く. μάταιος ἡ θρησκεία — 敬虔はむなしい."
  27: "θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ τῷ θεῷ καὶ πατρί — 父である神の前に清く、汚れのない敬虔 (ἀμίαντος — неосквернённый, ср. Евр 13:4). ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας — みなしごとやもめを見舞い (ἐπισκέπτομαι — посещать, навещать, ср. Мф 25:36). ἐν τῇ θλίψει αὐτῶν — その苦難のうちに. ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου — 自分を世の汚れから守る (ἄσπιλος — непорочный, ср. 1 Пет 1:19)."
