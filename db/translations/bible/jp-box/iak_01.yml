# jp-box, Соборное послание Иакова, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1), смысл испытаний (2–4), молитва о мудрости
# и вера без колебания (5–8), низкий и богатый (9–11), блаженство претерпевшего
# и источник искушения (12–18), «будьте исполнителями слова» (19–25),
# истинное благочестие (26–27).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 одно — 1:12 〔主[しゅ]が〕: в базе gr-lxx-byz подлежащего при ἐπηγγείλατο нет,
# оно восстанавливается только из контекста (Бог); слово 主 в базе отсутствует, поэтому в скобках.
# Цитат Писания в главе нет. Сносок ⟨…⟩ нет: неочевидных для нехристианина слов в главе нет.
# jp-ni не использовался.

