verses:
  1: "バビロンの王[おう]によってバビロンへ捕囚[ほしゅう]として連[つ]れて行[い]かれる者[もの]たちに、エレミヤが送[おく]った手紙[てがみ]の写[うつ]し。神[かみ]から命[めい]じられたとおりのことを、彼らに告[つ]げ知[し]らせるためである。"
  2: "あなたがたは、神[かみ]の前[まえ]に犯[おか]した罪[つみ]のゆえに、バビロンの王[おう]ネブカドネツァルによって捕囚[ほしゅう]となり、バビロンへ連[つ]れて行[い]かれる。"
  3: "そこで、バビロンに入[はい]ると、あなたがたはそこに多[おお]くの年[とし]と長[なが]い時[とき]を過[す]ごすことになる。七代[ななだい]にわたるまでである。その後[のち]、わたしはあなたがたをそこから平和[へいわ]のうちに連[つ]れ出[だ]す。"
  4: "しかるに今[いま]、あなたがたはバビロンで、銀[ぎん]と金[きん]と木[き]の神々[かみがみ]が肩[かた]に担[かつ]がれて運[はこ]ばれ、諸国[しょこく]の民[たみ]に恐[おそ]れを抱[いだ]かせているのを見[み]る。"
  5: "だから、気[き]をつけなさい。あなたがたも異邦人[いほうじん]に似[に]た者[もの]となり、彼らのゆえに恐[おそ]れがあなたがたを捕[と]らえることのないように。そして、彼らの前[まえ]にも後[うし]ろにも群衆[ぐんしゅう]が彼らにひれ伏して礼拝[れいはい]しているのを見[み]たら、心[こころ]のうちで言[い]いなさい。「あなたこそ礼拝[れいはい]を受[う]けるべき方[かた]です、主[しゅ]よ。」"
  6: "わたしの天使[てんし]があなたがたと共[とも]にいるからである。彼はあなたがたの魂[たましい]を尋[たず]ね求[もと]める者[もの]である。"
  7: "彼らの舌[した]は工人[こうじん]によって削[けず]り出[だ]されたものであり、彼ら自身[じしん]は金[きん]と銀[ぎん]をかぶせられている。しかし彼らは偽[いつわ]りのものであって、語[かた]ることができない。"
  8: "また、装[よそお]いを好[この]む処女[おとめ]にそうするかのように、彼らは金[きん]を取[と]って、自分[じぶん]たちの神々[かみがみ]の頭[あたま]に冠[かんむり]を造[つく]る。"
  9: "また、祭司[さいし]たちが自分[じぶん]たちの神々[かみがみ]から金[きん]や銀[ぎん]を盗[ぬす]み出[だ]して自分[じぶん]たちのために使[つか]い果[は]たし、その一部[いちぶ]を屋根[やね]の上[うえ]の娼婦[しょうふ]たちに与[あた]えることもある。"
  10: "また、彼らは神々[かみがみ]を人間[にんげん]のように衣服[いふく]で飾[かざ]る。銀[ぎん]の神々[かみがみ]、金[きん]の神々[かみがみ]、木[き]の神々[かみがみ]である。しかし彼らは錆[さび]や虫[むし]から守[まも]られることはない。"
  11: "彼らが紫[むらさき]の衣[ころも]をまとっていても、家[いえ]のうちのほこりが彼らの上[うえ]に多[おお]く積[つ]もるため、その顔[かお]は拭[ふ]き取[と]られる。"
  12: "また、それは国[くに]を裁[さば]く人間[にんげん]のように王杖[おうじょう]を持[も]っているが、それに罪[つみ]を犯[おか]す者[もの]を殺[ころ]すことはない。"
  13: "また、それは右[みぎ]の手[て]に短剣[たんけん]と斧[おの]を持[も]っているが、戦[いくさ]や盗賊[とうぞく]から自分[じぶん]自身[じしん]を救[すく]い出[だ]すことはない。"
  14: "それゆえ、彼らが神[かみ]でないことは明[あき]らかである。だから、彼らを恐[おそ]れてはならない。"
  15: "というのは、人間[にんげん]の器[うつわ]も砕[くだ]ければ役[やく]に立[た]たなくなるからである。彼らの神々[かみがみ]も、家[いえ]のうちに据[す]えられると、そのようになる。"
  16: "その目[め]は、入[はい]って来[く]る者[もの]たちの足[あし]もとからのほこりで満[み]ちている。"
  17: "また、死[し]に引[ひ]かれて行[ゆ]く者[もの]のために庭[にわ]を囲[かこ]うように、王[おう]を辱[はずかし]めた者[もの]の庭[にわ]も囲[かこ]いを巡[めぐ]らされる。そのように祭司[さいし]たちは、盗賊[とうぞく]に荒[あ]らされないように、その家[いえ]を扉[とびら]と錠[じょう]と貫[かん]の木[き]で固[かた]める。"
  18: "彼らのために灯[あか]しをともす。自分[じぶん]たちのためよりも多[おお]くともすのに、その灯[あか]しのどれ一[ひと]つとして見[み]ることはできない。"
  19: "彼らは家[いえ]のうちの梁[はり]のようなものである。人[ひと]は、その心[こころ]がなめ尽[つ]くされると言[い]う。地[ち]をはう虫[むし]たちが彼ら自身[じしん]とその衣[ころも]を食[く]い尽[つ]くしても、彼らは感[かん]じない。"
  20: "その顔[かお]は家[いえ]のうちの煙[けむり]で黒[くろ]くなっている。"
  21: "その体[からだ]の上[うえ]にも頭[あたま]の上[うえ]にも、こうもり、つばめ、鳥[とり]たちが飛[と]びかかり、同[おな]じように、ねこたちも飛[と]びかかってくる。"
  22: "それゆえ、彼らが神[かみ]でないことを知[し]るであろう。だから、彼らを恐[おそ]れてはならない。"
  23: "というのは、彼らが美[うつく]しさのために身[み]にまとっている金[きん]も、だれかが錆[さび]を拭[ふ]き取[と]らなければ輝[かがや]かないからである。彼らが鋳[い]られていたときでさえ、彼らは感[かん]じなかった。"
  24: "彼らはどんな値[あたい]を払[はら]っても買[か]われたが、その中[なか]に霊[れい]はない。"
  25: "彼らは足[あし]がないので、肩[かた]に担[かつ]がれて運[はこ]ばれ、人間[にんげん]たちに自分[じぶん]たちの恥[はじ]をさらしている。彼らに仕[つか]える者[もの]たちも恥[はずかし]められる。地[ち]に落[お]ちはしないか、と。落[お]ちれば、仕[つか]える者[もの]たちの手[て]で起[お]こさなければならないからである。"
  26: "地[ち]に倒[たお]れても、自分[じぶん]たちで起[お]き上[あ]がることはできない。だれかがそれをまっすぐに立[た]てても、それ自身[じしん]では動[うご]かない。傾[かたむ]いても、まっすぐにならない。むしろ、死者[ししゃ]にするのと同[おな]じように、それらに贈[おく]り物[もの]が供[そな]えられる。"
  27: "また、彼らのいけにえを祭司[さいし]たちが売[う]り、自分[じぶん]たちの思[おも]いのままに使[つか]っている。同[おな]じように、その妻[つま]たちもそれで塩漬[しおづ]けを作[つく]るが、貧[まず]しい者[もの]にも弱[よわ]い者[もの]にも分[わ]け与[あ]えない。また、汚[けが]れにある女[おんな]も産後[さんご]の女[おんな]も、彼らのいけにえに触[ふ]れる。"
  28: "だから、これらのことから、彼らが神[かみ]でないと知[し]ったうえで、彼らを恐[おそ]れてはならない。"
  29: "どうして彼らが神[かみ]と呼ばれようか。女[おんな]たちが銀[ぎん]の神々[かみがみ]、金[きん]の神々[かみがみ]、木[き]の神々[かみがみ]に供[そな]え物[もの]を供[そな]えているというのに。"
  30: "また、彼らの家[いえ]のうちでは、祭司[さいし]たちが裂[さ]けた衣[ころも]を着[き]て座[すわ]り、頭[あたま]もひげも剃[そ]られ、頭[あたま]を覆[おお]ってもいない。"
  31: "また、彼らは自分[じぶん]たちの神々[かみがみ]の前[まえ]で、死者[ししゃ]のための宴[うたげ]にいる者[もの]たちのように、叫[さけ]び声[ごえ]を上[あ]げてほえている。"
  32: "また、祭司[さいし]たちは彼らの衣[ころも]を脱[は]がして、自分[じぶん]たちの妻[つま]や子[こ]どもに着[き]せる。"
  33: "彼らは、だれかから悪[わる]いことをされても、良[よ]いことをされても、報[むく]いることができない。また、王[おう]を立[た]てることも、退[しりぞ]けることもできない。"
  34: "同[おな]じように、富[とみ]も青銅[せいどう]も彼らは与[あた]えることができない。もしだれかが彼らに誓[ちか]いを立てて、その誓[ちか]いを果[は]たさなくても、彼らはそれを求[もと]めない。"
  35: "彼らは人[ひと]を死[し]から救[すく]い出[だ]すことも、強[つよ]い者[もの]から弱[よわ]い者[もの]を奪[うば]い返[かえ]すこともない。"
  36: "また、彼らは盲人[もうじん]に視力[しりょく]を返[かえ]すことも、困[こま]っている人[ひと]を救[すく]い出[だ]すこともない。"
  37: "彼らはやもめをあわれむことも、みなしごに良[よ]いことをすることもない。"
  38: "木[き]の神々[かみがみ]、金[きん]をかぶせた神々[かみがみ]、銀[ぎん]をかぶせた神々[かみがみ]は、山[やま]の石[いし]に似[に]ている。彼らに仕[つか]える者[もの]たちは恥[はずかし]められる。"
  39: "それなら、どうして彼らを神[かみ]とみなし、神[かみ]と呼[よ]ぶことができようか。"
  40: "さらに、カルデア人[じん]自身[じしん]が彼らを軽[かろ]んじている。彼らは、口[くち]のきけない者[もの]を見[み]ると、それをベルのもとへ持[も]って行[い]き、ベルが感[かん]じ取[と]ることができるかのように、語[かた]れと要求[ようきゅう]する。"
  41: "しかし彼ら自身[じしん]は、それを悟[さと]っても、なお捨[す]てることができない。彼らには感覚[かんかく]がないからである。"
  42: "また、女[おんな]たちは縄[なわ]を身[み]に巻[ま]きつけて道[みち]に座[すわ]り、ぬかを焼[や]いて香[こう]を立[た]てている。"
  43: "また、そのうちのだれかが、通[とお]りかかる者[もの]の一人[ひとり]に引[ひ]き寄[よ]せられて共[とも]に寝[ね]ると、隣[となり]の女[おんな]を責[せ]める。自分[じぶん]のように遇[あつか]われず、その縄[なわ]も切[き]れなかった、と。"
  44: "彼らのもとで起[お]こることのすべては偽[いつわ]りである。それなら、どうして彼らが神[かみ]であると考[かんが]えたり、言[い]ったりできようか。"
  45: "彼らは工匠[こうしょう]や金細工師[きんざいくし]によって造[つく]られたものである。彼らは、その職人[しょくにん]たちが望[のぞ]んだもの以外[いがい]の何[なに]かになることはない。"
  46: "また、彼らを造[つく]る者[もの]たち自身[じしん]も長生[ながい]きはしない。では、彼らによって造[つく]られたものが神[かみ]でありうるだろうか。"
  47: "というのは、彼らは後[のち]に来[く]る者[もの]たちに偽[いつわ]りと恥[はじ]を残[のこ]したからである。"
  48: "というのは、彼らに戦[いくさ]や災[わざわ]いが降[ふ]りかかると、祭司[さいし]たちは、どこで彼らと共[とも]に身[み]を隠[かく]そうかと、互[たが]いに相談[そうだん]するからである。"
  49: "それなのに、どうして彼らが神[かみ]でないことを感[かん]じ取[と]れないのか。彼らは自分[じぶん]たちを戦[いくさ]からも災[わざわ]いからも救[すく]わない。"
  50: "というのは、木[き]の神々[かみがみ]、金[きん]をかぶせた神々[かみがみ]、銀[ぎん]をかぶせた神々[かみがみ]は、後[のち]になって、偽[いつわ]りであることが知[し]られるからである。すべての民[たみ]と王[おう]たちに、彼らが神[かみ]ではなく、人間[にんげん]の手[て]のわざであり、彼らの中[なか]に神[かみ]のわざが何[なに]一[ひと]つないことが明[あき]らかになる。"
  51: "では、彼らが神[かみ]でないことを、だれが知[し]らずにいられようか。"
  52: "というのは、彼らは国[くに]の王[おう]を立[た]てることも、人[ひと]々[びと]に雨[あめ]を降[ふ]らせることもないからである。"
  53: "また、彼らは裁[さば]きを行[おこな]うことも、虐[しいた]げられている者[もの]を救[すく]い出[だ]すこともない。彼らは無力[むりょく]なのである。彼らは天[てん]と地[ち]の間[あいだ]にいるからすのようなものである。"
  54: "というのは、木[き]の神々[かみがみ]、金[きん]をかぶせた神々[かみがみ]、銀[ぎん]をかぶせた神々[かみがみ]の家[いえ]に火[ひ]が入[はい]ると、祭司[さいし]たちは逃[に]げて助[たす]かるが、彼ら自身[じしん]は梁[はり]のように真[ま]ん中[なか]で焼[や]けてしまうからである。"
  55: "また、彼らは王[おう]にも敵[てき]にも立[た]ち向[む]かうことができない。"
  56: "それなら、どうして彼らが神[かみ]であると認[みと]めたり、思[おも]ったりできようか。"
  57: "木[き]の神々[かみがみ]、銀[ぎん]をかぶせた神々[かみがみ]、金[きん]をかぶせた神々[かみがみ]は、盗人[ぬすびと]からも強盗[ごうとう]からも救[すく]われない。力[ちから]ある者[もの]たちが彼らから金[きん]と銀[ぎん]、彼らが身[み]にまとっている衣[ころも]をはぎ取[と]って持[も]ち去[さ]っても、彼らは自分[じぶん]たちを助[たす]けることさえしない。"
  58: "だから、自分[じぶん]の勇[ゆう]気[き]を示[しめ]す王[おう]や、家[いえ]の中で役[やく]に立[た]ち、持[も]ち主[ぬし]が使[つか]う器[うつわ]のほうが、偽[いつわ]りの神々[かみがみ]よりましである。また、家[いえ]のうちにあるものを守[まも]る扉[とびら]も、偽[いつわ]りの神々[かみがみ]よりましであり、王宮[おうきゅう]にある木[き]の柱[はしら]も、偽[いつわ]りの神々[かみがみ]よりましである。"
  59: "というのは、太陽[たいよう]も月[つき]も星[ほし]も、輝[かがや]いていて用[もち]いのために遣[つか]わされるとき、よく従[したが]うからである。"
  60: "同[おな]じように、稲妻[いなずま]も現[あらわ]れるときには美[うつく]しく見[み]える。また、風[かぜ]もあらゆる国[くに]で吹[ふ]いている。"
  61: "また、雲[くも]は、神[かみ]から全世界[ぜんせかい]の上[うえ]を進[すす]むように命[めい]じられると、命[めい]じられたことを成[な]し遂[と]げる。また、上[うえ]から送[おく]られて山[やま]や森[もり]を焼[や]き尽[つ]くす火[ひ]も、命[めい]じられたことを行[おこな]う。"
  62: "しかし、これらの神々[かみがみ]は、その姿[すがた]にも力[ちから]にも彼らに似[に]ていない。"
  63: "だから、彼らを神[かみ]と考[かんが]えたり、神[かみ]と呼[よ]んだりしてはならない。彼らは裁[さば]きを行[おこな]うことも、人[ひと]々[びと]に良[よ]いことをすることもできないからである。"
  64: "だから、彼らが神[かみ]でないと知[し]って、彼らを恐[おそ]れてはならない。"
  65: "というのは、彼らは王[おう]たちを呪[のろ]うことも、祝福[しゅくふく]することもないからである。"
  66: "また、彼らは天[てん]に、諸国[しょこく]の民[たみ]のためのしるしを示[しめ]すことも、太陽[たいよう]のように輝[かがや]くことも、月[つき]のように照[て]らすこともない。"
  67: "獣[けもの]たちのほうが彼らよりましである。獣[けもの]たちは、逃[に]げて身[み]を隠[かく]す所[ところ]に入[はい]れば、自分[じぶん]を助[たす]けることができるからである。"
  68: "だから、彼らが神[かみ]であることは、どのような意味[いみ]でも、わたしたちには明[あき]らかでない。それゆえ、彼らを恐[おそ]れてはならない。"
  69: "というのは、畑[はたけ]のかかしが何[なに]も守[まも]らないのと同[おな]じように、木[き]の神々[かみがみ]、金[きん]をかぶせた神々[かみがみ]、銀[ぎん]をかぶせた神々[かみがみ]も、何[なに]も守[まも]らないからである。"
  70: "同[おな]じように、彼らの神々[かみがみ]、すなわち木[き]の神々[かみがみ]、金[きん]をかぶせた神々[かみがみ]、銀[ぎん]をかぶせた神々[かみがみ]は、園[その]のいばらにすべての鳥[とり]がとまるのと同[おな]じであり、暗[くら]やみの中[なか]に投[な]げ捨[す]てられたしかばねと同[おな]じである。"
  71: "彼らを覆[おお]っている紫[むらさき]の布[ぬの]や大理石[だいりせき]が腐[くさ]っていくことから、あなたがたは彼らが神[かみ]でないことを知[し]るであろう。また、彼ら自身[じしん]も後[のち]には食[く]い尽[つ]くされ、国[くに]のうちで恥[はじ]となる。"
  72: "それゆえ、偶像[ぐうぞう]を持[も]たない正[ただ]しい人[ひと]のほうがましである。その人[ひと]は恥[はじ]から遠[とお]く離[はな]れているからである。"

notes:
  1: "Слав. 1 (МТ: надписание): «Списание послания ко отводимым пленником в вавилон…» — надписание послания; в гр. модуле соединено с началом стиха 2 (Διὰ τὰς ἁμαρτίας…). По славяно-синодальной нумерации надписание — отдельный стих 1."
  2: "Слав. 2: «Грех ради, имиже согрешисте пред Богом…» — «ради грехов, которыми вы согрешили пред Богом, отведены в Вавилон». В гр. модуле эта фраза стоит в конце стиха 1 (Διὰ τὰς ἁμαρτίας ὑμῶν…)."
  3: "εἰσελθόντες οὖν εἰς Βαβυλῶνα ἔσεσθε ἐκεῖ ἔτη πλείονα καὶ χρόνον μακρόν, ἕως γενεῶν ἑπτά — «войдя в Вавилон, будете там лет больше и время долгое, до семи родов» (γενεαί — роды; 七代). μετὰ τοῦτο δὲ ἐξάξω ὑμᾶς ἐκεῖθεν μετ᾿ εἰρήνης — «после же сего изведу вас оттуда с миром»: первое лицо Бога внутри речи послания, без вводки. Слав. «до седми родов» — то же."
  4: "νυνὶ δὲ ὄψεσθε ἐν Βαβυλῶνι θεοὺς ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους — «ныне же увидите в Вавилоне богов серебряных, золотых и деревянных» (ἀργυροῦς, χρυσοῦς, ξυλίνους — из серебра, золота, дерева); слав. порядок «златы… и древяны» и добавка «и каменны» (о формуле см. 38). ἐπ᾿ ὤμοις αἰρομένους — «носимых на плечах» (αἴρω). δεικνύντας φόβον τοῖς ἔθνεσιν — «показывающих страх язычникам» (δεικνύω — показывать), т. е. внушающих страх, 恐れを抱かせる; слав. «показующыя страх языком»."
  5: "εὐλαβήθητε οὖν μὴ καὶ ὑμεῖς ἀφομοιωθέντες τοῖς ἀλλοφύλοις ἀφομοιωθῆτε — «берегитесь, чтобы и вы, уподобившись иноплеменникам, не были уподоблены» (εὐλαβέομαι — беречься; ἀφομοιόω — уподоблять): повтор ἀφομοιόω в двух формах, в японском повтор ослаблен. καὶ φόβος ὑμᾶς λάβῃ ἐπ᾿ αὐτοῖς — «и чтобы страх не овладел вами из-за них» (λαμβάνω — схватывать). В csl-ru и ru этот стих слит со ст. 5 (слав. 5), поэтому слав. счёт = наш +1 до ст. 5. ἰδόντας ὄχλον ἔμπροσθεν καὶ ὄπισθεν αὐτῶν προσκυνοῦντας αὐτά — «видя толпу спереди и сзади их, поклоняющуюся им» (ὄχλος — толпа; προσκυνέω — поклоняться). εἴπατε δὲ τῇ διανοίᾳ — «скажите же в уме» (διάνοια — ум, 心): единственная в главе вводка прямой речи, поэтому слова людей в 「…」. Σοὶ δεῖ προσκυνεῖν, δέσποτα — «Тебе подобает поклоняться, Владыко» (δεῖ — должно; δέσποτα — звательный от δεσπότης, 主); слав. «тебе лепо есть кланятися, Владыко». В csl/ru этот стих слит со ст. 4."
  6: "ὁ γὰρ ἄγγελός μου μεθ᾿ ὑμῶν ἐστιν — «ибо Ангел Мой с вами»; αὐτός τε ἐκζητῶν τὰς ψυχὰς ὑμῶν — «он сам взыскует души ваши» (ἐκζητέω — разыскивать, требовать). Слав. «Ангел бо мой с вами есть, сей взыскует душ ваших»; в ru (с масоретского) «он защитник душ ваших» — перифраз, в текст не внесён."
  7: "Γλῶσσα γὰρ αὐτῶν ἐστιν κατεξυσμένη ὑπὸ τέκτονος — «язык их выстроган художником» (καταξύω — выскабливать, строгать; τέκτων — плотник, мастер). αὐτά τε περίχρυσα καὶ περιάργυρα — «сами они обложены золотом и серебром» (περίχρυσος, περιάργυρος — золочёный, посеребрённый). ψευδῆ δ᾿ ἐστὶν καὶ οὐ δύνανται λαλεῖν — «но они ложны и не могут говорить»."
  8: "καὶ ὥσπερ παρθένῳ φιλοκόσμῳ λαμβάνοντες χρυσίον κατασκευάζουσιν στεφάνους ἐπὶ τὰς κεφαλὰς τῶν θεῶν αὐτῶν — «и как девице, любящей украшения, взяв золото, делают венцы на головы богов своих» (φιλόκοσμος — любящая наряды, 装いを好む; στέφανος — венец)."
  9: "ἔστι δὲ καὶ ὅτε ὑφαιρούμενοι οἱ ἱερεῖς ἀπὸ τῶν θεῶν αὐτῶν χρυσίον καὶ ἀργύριον εἰς ἑαυτοὺς καταναλώσουσιν — «бывает же и то, что жрецы, похищая у богов своих золото и серебро, издерживают на себя» (ὑφαιρέομαι — красть; καταναλίσκω — расходовать). δώσουσιν δὲ ἀπ᾿ αὐτῶν καὶ ταῖς ἐπὶ τοῦ τέγους πόρναις — «дают из того и блудницам на кровле» (τέγος — кровля; πόρνη — блудница); слав. «блудницам сущым в дому» — иное чтение («в доме»), держим LXX."
  10: "κοσμοῦσί τε αὐτοὺς ὡς ἀνθρώπους τοῖς ἐνδύμασιν — «и украшают их, как людей, одеждами» (κοσμέω — украшать). θεοὺς ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους — «богов серебряных, золотых и деревянных»; слав. порядок «златыя и сребряныя и древяныя». οὗτοι δὲ οὐ διασῴζονται ἀπὸ ἰοῦ καὶ βρωμάτων — «но они не спасаются от ржавчины и поедания» (ἰός — ржавчина, яд; βρώματα — снедь, здесь поедание червями); слав. «от ржи и молия»."
  11: "περιβεβλημένων αὐτῶν ἱματισμὸν πορφυροῦν — «хотя они облечены в пурпурную одежду» (περιβάλλω — облекать; πορφυροῦς — пурпурный). ἐκμάσσονται τὸ πρόσωπον αὐτῶν διὰ τὸν ἐκ τῆς οἰκίας κονιορτόν, ὅς ἐστιν πλείων ἐπ᾿ αὐτοῖς — «им обтирают лицо из-за пыли из дома, которой много на них» (ἐκμάσσω — обтирать; κονιορτός — пыль). Слав. ставит «одеют же я в багряницу» здесь, а обтирание относит к ст. 12 — держим LXX."
  12: "καὶ σκῆπτρον ἔχει ὡς ἄνθρωπος κριτὴς χώρας — «и имеет скипетр, как человек — судья страны» (σκῆπτρον — жезл, 王杖). ὃς τὸν εἰς αὐτὸν ἁμαρτάνοντα οὐκ ἀνελεῖ — «который согрешающего против него не убьёт» (ἀναιρέω — убивать); слав. «иже согрешающаго к себе не убиет»."
  13: "ἔχει δὲ ἐγχειρίδιον ἐν δεξιᾷ καὶ πέλεκυν — «имеет же и меч в правой руке и секиру» (ἐγχειρίδιον — кинжал, меч; πέλεκυς — секира, 斧). ἑαυτὸν δὲ ἐκ πολέμου καὶ λῃστῶν οὐκ ἐξελεῖται — «но себя самого от войны и разбойников не избавит» (ἐξαιρέω)."
  14: "ὅθεν γνώριμοί εἰσιν οὐκ ὄντες θεοί — «отсюда явно, что они не боги» (γνώριμος — известный, явный). μὴ οὖν φοβηθῆτε αὐτούς — «итак, не бойтесь их»: первый из пяти рефренов (14, 22, 28, 64, 68), везде 彼らを恐れてはならない."
  15: "Ὥσπερ γὰρ σκεῦος ἀνθρώπου συντριβὲν ἀχρεῖον γίνεται — «ибо как разбитый сосуд человека делается негодным» (συντρίβω — сокрушать; ἀχρεῖος — негодный). τοιοῦτοι ὑπάρχουσιν οἱ θεοὶ αὐτῶν, καθιδρυμένων αὐτῶν ἐν τοῖς οἴκοις — «таковы и боги их, когда поставлены в домах» (καθιδρύω — ставить, усаживать); слав. относит «тацы суть бози их» к ст. 16 — держим LXX."
  16: "οἱ ὀφθαλμοὶ αὐτῶν πλήρεις εἰσὶν κονιορτοῦ ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων — «глаза их полны пыли от ног входящих» (εἰσπορεύομαι — входить)."
  17: "καὶ ὥσπερ τινὶ ἠδικηκότι βασιλέα περιπεφραγμέναι εἰσὶν αἱ αὐλαί — «и как у оскорбившего царя ограждены дворы» (ἀδικέω — обижать, оскорблять; περιφράσσω — ограждать; αὐλή — двор). ὡς ἐπὶ θανάτῳ ἀπηγμένῳ — «как у ведомого на смерть» (ἀπάγω — уводить). τοὺς οἴκους αὐτῶν ὀχυροῦσιν οἱ ἱερεῖς θυρώμασίν τε καὶ κλείθροις καὶ μοχλοῖς — «дома их укрепляют жрецы дверями, запорами и засовами» (ὀχυρόω — укреплять; θύρωμα — дверь; κλεῖθρον — запор; μοχλός — засов). ὅπως ὑπὸ τῶν λῃστῶν μὴ συληθῶσι — «чтобы не были разграблены разбойниками» (συλάω — грабить). Слав. «или яко на смерть отводиму» — вариант ὡς/ἤ, смысл тот же."
  18: "λύχνους καίουσιν καὶ πλείους ἢ ἑαυτοῖς — «зажигают светильники и больше, чем себе» (λύχνος — светильник, 灯; καίω — жечь). ὧν οὐδένα δύνανται ἰδεῖν — «но ни одного из них не могут увидеть»."
  19: "ἔστιν μὲν ὥσπερ δοκὸς τῶν ἐκ τῆς οἰκίας — «он как бревно из того, что в доме» (δοκός — бревно, балка, 梁). τὰς δὲ καρδίας αὐτῶν φασιν ἐκλείχεσθαι — «сердца их, говорят, вылизываются» (ἐκλείχω — вылизывать; φασιν — говорят), т. е. их точат черви; слав. «сердца же их точат черви, иже от земли». τῶν ἀπὸ τῆς γῆς ἑρπετῶν κατεσθόντων αὐτούς τε καὶ τὸν ἱματισμὸν αὐτῶν οὐκ αἰσθάνονται — «земные гады, поедая их самих и одежду их, а они не чувствуют» (ἑρπετόν — ползающее; κατεσθίω — съедать)."
  20: "μεμελανωμένοι τὸ πρόσωπον αὐτῶν ἀπὸ τοῦ καπνοῦ τοῦ ἐκ τῆς οἰκίας — «почернели лица их от дыма из дома» (μελαίνω — чернить; καπνός — дым)."
  21: "ἐπὶ τὸ σῶμα αὐτῶν καὶ ἐπὶ τὴν κεφαλὴν ἐφίπτανται νυκτερίδες, χελιδόνες καὶ τὰ ὄρνεα, ὡσαύτως δὲ καὶ οἱ αἴλουροι — «на тело их и на голову налетают летучие мыши, ласточки и птицы, так же и кошки» (νυκτερίς — летучая мышь; χελιδών — ласточка; αἴλουρος — кошка). こうもり, つばめ, ねこ — каной, как в корпусе (не 常用漢字)."
  22: "ὅθεν γνώσεσθε ὅτι οὔκ εἰσιν θεοί — «отсюда узнаете, что они не боги» (γνώσεσθε — будущее от γινώσκω). μὴ οὖν φοβεῖσθε αὐτά — «итак, не бойтесь их»: рефрен, как в 14 (здесь форма φοβεῖσθε, средний род αὐτά)."
  23: "Τὸ γὰρ χρυσίον, ὃ περίκεινται εἰς κάλλος — «ибо золото, которым они обложены для красоты» (περίκειμαι — быть обложенным; κάλλος — красота). ἐὰν μή τις ἐκμάξῃ τὸν ἰόν, οὐ μὴ στίλψωσιν — «если кто не оботрёт ржавчину, они не заблестят» (στίλβω — блестеть). οὐδὲ γάρ, ὅτε ἐχωνεύοντο, ᾐσθάνοντο — «ибо и когда их отливали, они не чувствовали» (χωνεύω — отливать)."
  24: "ἐκ πάσης τιμῆς ἠγορασμένα ἐστίν — «за всякую цену они куплены» (τιμή — цена). ἐν οἷς οὐκ ἔστιν πνεῦμα — «в них нет духа». Слав. «За всяку цену куплени суть, в нихже несть духа»; ru «за большую цену» — иное."
  25: "ἄνευ ποδῶν ἐπ᾿ ὤμοις φέρονται — «без ног на плечах носятся». ἐνδεικνύμενοι τὴν ἑαυτῶν ἀτιμίαν τοῖς ἀνθρώποις — «показывая людям своё бесчестие» (ἀτιμία — бесчестие). αἰσχύνονταί τε καὶ οἱ θεραπεύοντες αὐτὰ — «стыдятся и служащие им» (θεραπεύω — служить, ухаживать). διὰ τό, μήποτε ἐπὶ τὴν γῆν πέσῃ, δι᾿ αὐτῶν ἀνίστασθαι — «из-за того, что, как бы не упал он на землю, через них его поднимать»; слав. «занеже, егда когда падутся на землю, и не могут сами востати» переносит это в ст. 26 (см.)."
  26: "μήτε ἐὰν τις αὐτὸ ὀρθὸν στήσῃ, δι᾿ ἑαυτοῦ κινηθήσεται — «и если кто поставит его прямо, сам собой не двинется» (κινέω). μήτε ἐὰν κλιθῇ, οὐ μὴ ὀρθωθῇ — «и если наклонится, не выпрямится» (κλίνω; ὀρθόω). ἀλλ᾿ ὥσπερ νεκροῖς τὰ δῶρα αὐτοῖς παρατίθεται — «но, как мёртвым, ставятся им дары» (παρατίθημι). Слав. добавление, которого нет в LXX: «егда когда падутся на землю, и не могут сами востати» — внесено в текст без 〔…〕 (паритет, п. 2), первым предложением."
  27: "τὰς δὲ θυσίας αὐτῶν ἀποδόμενοι οἱ ἱερεῖς αὐτῶν καταχρῶνται — «жертвы их жрецы, продавая, употребляют на себя» (ἀποδίδωμι — продавать; καταχράομαι — пользоваться). ὡσαύτως δὲ καὶ αἱ γυναῖκες αὐτῶν ἀπ᾿ αὐτῶν ταριχεύουσαι — «так же и жёны их, из них приготавливая впрок» (ταριχεύω — засаливать, коптить); слав. «варят» — иное чтение, держим LXX. οὔτε πτωχῷ οὔτε ἀδυνάτῳ μεταδιδόασιν — «ни нищему, ни немощному не подают» (μεταδίδωμι — уделять). τῶν θυσιῶν αὐτῶν ἀποκαθημένη καὶ λεχὼ ἅπτονται — «к жертвам их прикасаются и сидящая в очищении, и родильница» (ἀποκάθημαι — сидеть отдельно, о женщине в очищении; λεχώ — родильница). Слав. отрывает эту клаузу в ст. 28 — держим LXX."
  28: "γνόντες οὖν ἀπὸ τούτων ὅτι οὔκ εἰσιν θεοί — «итак, узнав из этого, что они не боги» (аористное причастие γνόντες). μὴ φοβηθῆτε αὐτούς — рефрен (см. 14). Слав. 28 начинается хвостом нашего 27 («треб их нечистыя… жены прикасаются»), затем тот же вывод."
  29: "Πόθεν γὰρ κληθείησαν θεοί; — «откуда же они названы богами?» (πόθεν — откуда; κληθείησαν — оптатив от καλέω). ὅτι γυναῖκες παρατιθέασιν θεοῖς ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις — «ибо женщины ставят яства перед богами серебряными, золотыми и деревянными» (παρατίθημι); слав. «служат» — иное чтение."
  30: "καὶ ἐν τοῖς οἴκοις αὐτῶν οἱ ἱερεῖς διφρεύουσιν — «и в домах их жрецы сидят на седалищах» (διφρεύω — восседать, от δίφρος — седалище); слав. «во храмех» — иное (храм вместо дом). ἔχοντες τοὺς χιτῶνας διερρωγότας — «имея хитоны разодранные» (διαρρήγνυμι — разрывать; χιτών — хитон). καὶ τὰς κεφαλὰς καὶ τοὺς πώγωνας ἐξυρημένους — «и головы и бороды обритыми» (ξυράω — брить; πώγων — борода). ὧν αἱ κεφαλαὶ ἀκάλυπτοί εἰσιν — «у которых головы непокрыты» (ἀκάλυπτος)."
  31: "ὠρύονται δὲ βοῶντες ἐναντίον τῶν θεῶν αὐτῶν — «ревут же, вопия пред богами своими» (ὠρύομαι — реветь; βοάω — вопить). ὥσπερ τινὲς ἐν περιδείπνῳ νεκροῦ — «как иные на поминальной трапезе по умершем» (περίδειπνον — поминальный обед)."
  32: "ἀπὸ τοῦ ἱματισμοῦ αὐτῶν ἀφελόμενοι οἱ ἱερεῖς ἐνδύουσιν τὰς γυναῖκας αὐτῶν καὶ τὰ παιδία — «из одежд их, сняв, жрецы одевают своих жён и детей» (ἀφαιρέομαι — снимать; ἐνδύω — одевать)."
  33: "οὔτε ἐὰν κακὸν πάθωσιν ὑπό τινος οὔτε ἐὰν ἀγαθόν, δυνήσονται ἀνταποδοῦναι — «ни если потерпят от кого зло, ни если добро, не смогут воздать» (ἀνταποδίδωμι — воздавать). οὔτε καταστῆσαι βασιλέα δύνανται οὔτε ἀφελέσθαι — «ни поставить царя не могут, ни низложить» (καθίστημι; ἀφαιρέομαι — отнять)."
  34: "ὡσαύτως οὔτε πλοῦτον οὔτε χαλκὸν οὐ μὴ δύνωνται διδόναι — «так же ни богатства, ни меди не могут дать» (χαλκός — медь, медная монета). ἐάν τις αὐτοῖς εὐχὴν εὐξάμενος μὴ ἀποδῷ, οὐ μὴ ἐπιζητήσωσιν — «если кто, дав им обет, не исполнит, они не взыщут» (εὐχή — обет; ἐπιζητέω — требовать)."
  35: "ἐκ θανάτου ἄνθρωπον οὐ μὴ ῥύσωνται — «от смерти человека не избавят» (ῥύομαι — избавлять). οὔτε ἥττονα ἀπὸ ἰσχυροῦ οὐ μὴ ἐξέλωνται — «ни слабейшего у сильного не отнимут» (ἥττων — слабейший; ἐξαιρέομαι)."
  36: "ἄνθρωπον τυφλὸν εἰς ὅρασιν οὐ μὴ περιστήσωσιν — «слепого человека к зрению не приведут» (περιΐστημι — ставить вокруг, возвращать; ὅρασις — зрение). ἐν ἀνάγκῃ ἄνθρωπον ὄντα οὐ μὴ ἐξέλωνται — «человека, в нужде находящегося, не избавят» (ἀνάγκη — нужда)."
  37: "χήραν οὐ μὴ ἐλεήσωσιν οὔτε ὀρφανὸν εὖ ποιήσουσιν — «вдову не помилуют и сироте добра не сделают» (ἐλεέω — миловать; εὖ ποιέω — благодетельствовать)."
  38: "τοῖς ἀπὸ τοῦ ὄρους λίθοις ὡμοιωμένοι εἰσὶν τὰ ξύλινα καὶ τὰ περίχρυσα καὶ τὰ περιάργυρα — «камням с горы подобны деревянные, золочёные и серебрёные» (ὁμοιόω — уподоблять). οἱ δὲ θεραπεύοντες αὐτὰ καταισχυνθήσονται — «служащие же им посрамятся» (καταισχύνω). Слав. прибавляет в формулу «и каменни» (38, 50, 54, 57, 69) — расширение, в текст не внесено ради единого рефрена дерево–золото–серебро; отмечено здесь и в 50, 54, 57, 69."
  39: "πῶς οὖν νομιστέον ἢ κλητέον αὐτοὺς ὑπάρχειν θεούς; — «как же должно думать или называть их богами?» (νομιστέον, κλητέον — отглагольные прилагательные долженствования). Формула-рефрен, ср. 44, 56, 63; переводится одинаково."
  40: "Ἔτι δὲ καὶ αὐτῶν τῶν Χαλδαίων ἀτιμαζόντων αὐτά — «к тому же и сами халдеи, бесчестя их» (ἀτιμάζω — бесчестить). ὅταν ἴδωσιν ἐνεὸν οὐ δυνάμενον λαλῆσαι — «когда увидят немого, не могущего говорить» (ἐνεός — немой). προσενεγκάμενοι τὸν Βῆλον ἀξιοῦσιν φωνῆσαι — «принеся его к Белу, требуют, чтобы он заговорил» (Βῆλος — Бел, вавилонский бог; ベル, как в Иер 50:2; слав. «вил», в ru ошибочно «Ваал»). ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι — «как будто он может чувствовать». Слав. прибавляет «емуже молятся» — в текст не внесено."
  41: "καὶ οὐ δύνανται αὐτοὶ νοήσαντες καταλιπεῖν αὐτά — «и не могут они, поняв, оставить их» (νοέω — понимать; καταλείπω — оставлять). αἴσθησιν γὰρ οὐκ ἔχουσιν — «ибо не имеют чувства» (αἴσθησις — чувство, ощущение)."
  42: "αἱ δὲ γυναῖκες περιθέμεναι σχοινία ἐν ταῖς ὁδοῖς ἐγκάθηνται — «жёны же, обвязавшись верёвками, сидят на дорогах» (περίθεμαι — обвязывать; σχοινίον — верёвка; ἐγκάθημαι — сидеть). θυμιῶσαι τὰ πίτυρα — «воскуряя отруби» (θυμιάω — курить фимиам; πίτυρα — отруби, ぬか); слав. «кадящя отребы»; ru «оливковые зерна» — неверно."
  43: "ὅταν δέ τις αὐτῶν ἐφελκυσθεῖσα ὑπό τινος τῶν παραπορευομένων κοιμηθῇ — «когда же какая из них, увлечённая кем-либо из проходящих, ляжет с ним» (ἐφέλκω — привлекать; κοιμάομαι — спать). τὴν πλησίον ὀνειδίζει — «укоряет соседку» (ὀνειδίζω). ὅτι οὐκ ἠξίωται ὥσπερ καὶ αὐτὴ — «что не удостоена, как и она» (ἀξιόω — удостаивать). οὔτε τὸ σχοινίον αὐτῆς διερράγη — «и верёвка её не разорвалась» (διαρρήγνυμι) — знак, что её не увели."
  44: "πάντα τὰ γινόμενα αὐτοῖς ἐστιν ψευδῆ — «всё, происходящее у них, ложно». πῶς οὖν νομιστέον ἢ κλητέον ὥστε θεοὺς αὐτοὺς ὑπάρχειν; — «как же думать или называть, так чтобы они были богами?» — тот же рефрен, что в 39, с добавлением ὥστε…ὑπάρχειν."
  45: "Ὑπὸ τεκτόνων καὶ χρυσοχόων κατεσκευασμένα εἰσίν — «плотниками и золотых дел мастерами сделаны они» (τέκτων — плотник; χρυσοχόος — золотарь). οὐθὲν ἄλλο μὴ γένωνται ἢ ὃ βούλονται οἱ τεχνῖται αὐτὰ γενέσθαι — «ничем иным не станут, кроме того, чем хотят их сделать мастера» (τεχνίτης — художник, мастер)."
  46: "αὐτοί τε οἱ κατασκευάζοντες αὐτὰ οὐ μὴ γένωνται πολυχρόνιοι — «и сами делающие их не будут долговечны» (πολυχρόνιος — долговечный). πῶς τε δὴ μέλλει τὰ ὑπ᾿ αὐτῶν κατασκευασθέντα εἶναι θεοί; — «как же будет то, что сделанное ими — боги?» Слав. 46 обрывается на первой половине, вопрос перенесён в начало слав. 47 («Како убо сотворенная ими могут быти бози?») — держим LXX."
  47: "κατέλιπον γὰρ ψεύδη καὶ ὄνειδος τοῖς ἐπιγινομένοις — «ибо они оставили ложь и позор тем, кто будет после» (καταλείπω — оставлять; ὄνειδος — позор, поношение; ἐπιγινόμενοι — последующие)."
  48: "ὅταν γὰρ ἐπέλθῃ ἐπ᾿ αὐτὰ πόλεμος καὶ κακά — «когда на них придёт война и беды» (ἐπέρχομαι — приходить). βουλεύονται πρὸς ἑαυτοὺς οἱ ἱερεῖς ποῦ συναποκρυβῶσι μετ᾿ αὐτῶν — «совещаются между собой жрецы, где бы скрыться вместе с ними» (συναποκρύπτω — скрываться вместе)."
  49: "πῶς οὖν οὐκ ἔστιν αἰσθὲσθαι ὅτι οὔκ εἰσιν θεοί — «как же не почувствовать, что они не боги» (αἰσθάνομαι — чувствовать). οἳ οὔτε σῴζουσιν ἑαυτοὺς ἐκ πολέμου οὔτε ἐκ κακῶν — «которые не спасают себя ни от войны, ни от бед»."
  50: "ὑπάρχοντα γὰρ ξύλινα καὶ περίχρυσα καὶ περιάργυρα γνωσθήσεται μετὰ ταῦτα ὅτι ἐστὶν ψευδῆ — «ибо они, будучи деревянными, золочёными и серебрёными, будут познаны после сего как ложные». τοῖς ἔθνεσι πᾶσι τοῖς τε βασιλεῦσι φανερὸν ἔσται — «всем народам и царям будет явно». ὅτι οὔκ εἰσι θεοὶ ἀλλὰ ἔργα χειρῶν ἀνθρώπων — «что они не боги, но дела рук человеческих». καὶ οὐδὲν θεοῦ ἔργον ἐν αὐτοῖς ἐστιν — «и нет в них никакого дела Божия». Слав. снова прибавляет «и каменни» (не внесено, см. 38)."
  51: "τίνι οὖν γνωστέον ἐστὶν ὅτι οὔκ εἰσιν θεοί; — «кому же надлежит знать, что они не боги?», т. е. кто может не знать; слав. «кому убо несть разумно»."
  52: "Βασιλέα γὰρ χώρας οὐ μὴ ἀναστήσωσιν — «ибо царя стране они не поставят» (ἀνίστημι — ставить, воздвигать). οὔτε ὑετὸν ἀνθρώποις οὐ μὴ δῶσιν — «и дождя людям не дадут» (ὑετός — дождь)."
  53: "κρίσιν τε οὐ μὴ διακρίνωσιν αὐτῶν — «и суда их не рассудят» (διακρίνω — разбирать). οὐδὲ μὴ ῥύσωνται ἀδικούμενον ἀδύνατοι ὄντες — «и не избавят обижаемого, будучи бессильны» (ἀδύνατος). ὥσπερ γὰρ κορῶναι ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς — «ибо как вороны между небом и землёй» (κορώνη — ворона); слав. переносит сравнение в начало ст. 54 («якоже бо враны между небом и землею суть») — держим LXX."
  54: "καὶ γὰρ ὅταν ἐμπέσῃ εἰς οἰκίαν θεῶν ξυλίνων ἢ περιχρύσων ἢ περιαργύρων πῦρ — «ибо даже когда в дом богов деревянных, золочёных или серебрёных попадёт огонь» (ἐμπίπτω — падать, попадать). οἱ μὲν ἱερεῖς αὐτῶν φεύξονται καὶ διασωθήσονται — «жрецы их убегут и спасутся». αὐτοὶ δὲ ὥσπερ δοκοὶ μέσοι κατακαυθήσονται — «они же, как брёвна, посреди сгорят» (κατακαίω — сжигать). Слав. «на храме» вместо «в дом» и с «каменных» — варианты, держим LXX."
  55: "βασιλεῖ δὲ καὶ πολεμίοις οὐ μὴ ἀντιστῶσιν — «царю же и врагам они не противостанут» (ἀνθίστημι — противостоять). Слав. сливает этот стих со следующим: «Царю же и ратным не станут противу: убо како мощно мнети…»"
  56: "πῶς οὖν ἐκδεκτέον ἢ νομιστέον ὅτι εἰσὶν θεοί; — «как же принять или подумать, что они боги?» (ἐκδεκτέον — должно принимать; ср. рефрен 39, 44, 63, здесь ἐκδεκτέον вместо κλητέον). В csl-ru отдельного стиха нет: слав. 55 сливает 55–56, а слав. 56 = начало нашего 57 («Ни от разбойник, ни от татей…»)."
  57: "Οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ λῃστῶν οὐ μὴ διασωθῶσιν — «ни от воров, ни от разбойников не спасутся» (διασῴζω). θεοὶ ξύλινοι καὶ περιάργυροι καὶ περίχρυσοι — «боги деревянные, посеребрённые и позолоченные» (порядок LXX: дерево–серебро–золото; слав. иначе). ὧν οἱ ἰσχύοντες περιελοῦνται τὸ χρυσίον καὶ τὸ ἀργύριον — «у которых сильные снимут золото и серебро» (περιαιρέομαι — снимать). καὶ τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς ἀπελεύσονται ἔχοντες — «и одежду, на них надетую, уйдут, унеся». οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν — «и себе самим не помогут». Слав. делит наш 57 на два стиха (56–57)."
  58: "ὥστε κρεῖσσον εἶναι βασιλέα ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν — «так что лучше царь, показывающий своё мужество» (κρείσσων — лучше; ἀνδρεία — мужество). ἢ σκεῦος ἐν οἰκίᾳ χρήσιμον, ἐφ᾿ ᾧ χρήσεται ὁ κεκτημένος — «или полезный в доме сосуд, который употребит владеющий им» (κεκτημένος — владелец). ἢ οἱ ψευδεῖς θεοί — «нежели ложные боги»: рефрен трижды в стихе, везде 偽りの神々. ἢ καὶ θύρα ἐν οἰκίᾳ διασῴζουσα τὰ ἐν αὐτῇ ὄντα — «или дверь в доме, сохраняющая то, что в нём». καὶ ξύλινος στῦλος ἐν βασιλείοις — «и деревянный столп в царских чертогах» (στῦλος — столп, 柱)."
  59: "ἥλιος μὲν γὰρ καὶ σελήνη καὶ ἄστρα ὄντα λαμπρὰ — «ибо солнце, луна и звёзды, будучи светлы». ἀποστελλόμενα ἐπὶ χρείας εὐήκοά εἰσιν — «посылаемые на службу, они послушны» (εὐήκοος — послушный, внимающий); слав. «благопослушливы суть»."
  60: "ὡσαύτως καὶ ἀστραπή, ὅταν ἐπιφανῇ, εὔοπτός ἐστιν — «так же и молния, когда явится, прекрасна на вид» (εὔοπτος — благовидный). τὸ δ᾿ αὐτὸ καὶ πνεῦμα ἐν πάσῃ χώρᾳ πνεῖ — «то же и ветер во всякой стране веет» (πνεῦμα здесь — ветер, 風)."
  61: "καὶ νεφέλαις ὅταν ἐπιταγῇ ὑπὸ τοῦ θεοῦ ἐπιπορεύεσθαι ἐφ᾿ ὅλην τὴν οἰκουμένην — «и облакам, когда повелено Богом идти по всей вселенной» (ἐπιτάσσω — повелевать; οἰκουμένη — вселенная). συντελοῦσι τὸ ταχθέν — «исполняют повеленное» (συντελέω; τάσσω). τό τε πῦρ ἐξαποσταλὲν ἄνωθεν ἐξαναλῶσαι ὄρη καὶ δρυμούς — «и огонь, посланный свыше истребить горы и дубравы» (ἐξαναλίσκω — истреблять; δρυμός — дубрава). ποιεῖ τὸ συνταχθέν — «делает назначенное». Слав. 61 обрывается на «совершают повеленное», огненная клауза — в слав. 62."
  62: "ταῦτα δὲ οὔτε ταῖς ἰδέαις οὔτε ταῖς δυνάμεσιν αὐτῶν ἀφωμοιωμένα ἐστίν — «а эти не подобны им ни видами, ни силами» (ἰδέα — вид; ἀφομοιόω — уподоблять). Слав. 62 начинается с огненной клаузы нашего 61 — держим LXX."
  63: "ὅθεν οὔτε νομιστέον οὔτε κλητέον ὑπάρχειν αὐτοὺς θεούς — «поэтому не должно ни думать, ни называть их богами» (отрицательная форма рефрена 39/44). οὐ δυνατῶν ὄντων αὐτῶν οὔτε κρίσιν κρῖναι οὔτε εὖ ποιεῖν ἀνθρώποις — «когда они не в силах ни суд рассудить, ни благодетельствовать людям»."
  64: "γνόντες οὖν ὅτι οὔκ εἰσιν θεοί, μὴ φοβηθῆτε αὐτούς — «итак, зная, что они не боги, не бойтесь их»: рефрен (см. 14); повторяет 28 без ἀπὸ τούτων."
  65: "Οὔτε γὰρ βασιλεῦσιν οὐ μὴ καταράσωνται οὔτε μὴ εὐλογήσωσι — «ибо они ни царей не проклянут, ни не благословят» (καταράομαι — проклинать; εὐλογέω — благословлять): двойное отрицание сохранено — 呪うことも、祝福することもない."
  66: "σημεῖά τε ἐν ἔθνεσιν ἐν οὐρανῷ οὐ μὴ δείξωσιν — «и знамений народам на небе не покажут» (σημεῖον — знамение). οὐδὲ ὡς ὁ ἥλιος λάμψουσιν οὐδὲ φωτίσουσιν ὡς σελήνη — «и не воссияют, как солнце, и не просветят, как луна» (λάμπω; φωτίζω)."
  67: "τὰ θηρία ἐστὶν κρείττω αὐτῶν — «звери лучше их» (κρείττων). ἃ δύνανται ἐκφυγόντα εἰς σκέπην ἑαυτὰ ὠφελῆσαι — «которые могут, убежав под кров, себе помочь» (σκέπη — кров, защита; ὠφελέω — помогать)."
  68: "κατ᾿ οὐδένα οὖν τρόπον ἐστὶν ἡμῖν φανερὸν ὅτι εἰσὶν θεοί — «итак, никоим образом не явно нам, что они боги» (τρόπος — образ, способ). διὸ μὴ φοβηθῆτε αὐτούς — рефрен (см. 14); единственное место, где формула стоит после «итак» с διό."
  69: "Ὥσπερ γὰρ ἐν σικυηράτῳ προβασκάνιον οὐδὲν φυλάσσον — «ибо как в огороде пугало, ничего не охраняющее» (σικυήρατον — огород, бахча; προβασκάνιον — пугало, оберег; φυλάσσω — охранять). οὕτως οἱ θεοὶ αὐτῶν εἰσιν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι — «таковы и боги их — деревянные, золочёные и серебрёные». Слав. прибавляет «и каменни» (не внесено, см. 38)."
  70: "τὸν αὐτὸν τρόπον καὶ τῇ ἐν κήπῳ ῥάμνῳ, ἐφ᾿ ἧς πᾶν ὄρνεον ἐπικάθηται — «тем же образом и терновому кусту в саду, на котором сидит всякая птица» (ῥάμνος — терновник, крушина; ἐπικάθημαι — сидеть на). ὡσαύτως δὲ καὶ νεκρῷ ἐρριμμένῳ ἐν σκότει — «так же и трупу, брошенному во тьме» (ῥίπτω — бросать). ἀφωμοίωνται οἱ θεοὶ αὐτῶν — «подобны боги их»."
  71: "ἀπό τε τῆς πορφύρας καὶ τῆς μαρμάρου τῆς ἐπ᾿ αὐτοῖς σηπομένης — «по пурпуру и мрамору, истлевающему на них» (πορφύρα — пурпур; μάρμαρος — мрамор; σήπομαι — гнить). γνώσεσθε ὅτι οὔκ εἰσιν θεοί — «познаете, что они не боги». αὐτά τε ἐξ ὑστέρου βρωθήσονται — «и сами они после будут съедены» (βιβρώσκω); слав. добавляет «от червия» — в текст не внесено. καὶ ἔσται ὄνειδος ἐν τῇ χώρᾳ — «и будут позором в стране». Слав. редакторская скобка «(в нюже одеяни)» не переносилась."
  72: "κρείσσων οὖν ἄνθρωπος δίκαιος οὐκ ἔχων εἴδωλα — «итак, лучше человек праведный, не имеющий идолов» (εἴδωλον — идол, 偶像). ἔσται γὰρ μακρὰν ἀπὸ ὀνειδισμοῦ — «ибо он будет далеко от позора» (ὀνειδισμός — поношение)."
