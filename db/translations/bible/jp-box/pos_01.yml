# jp-box, Послание Иеремии, глава 1. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии: ст. 1 — надписание,
# ст. 2 — «ради грехов ваших», ст. 5 объединяет два греческих стиха (4–5).
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# План главы: 1 надписание послания и причина плена («ради грехов ваших вы
# отведены в Вавилон»); 2–7 семь родов плена, обещание вывода с миром,
# увещание не уподобляться язычникам, «скажите в уме: Тебе подобает
# поклоняться, Владыко», Ангел, выстроганный язык идолов; 8–72 обличение
# идолослужения: венцы и одежды, кража золота жрецами, скипетр и меч без силы,
# пыль, моль и ржавчина, ношение на плечах, падение и дары как мёртвым,
# продажа жертв, обритые жрецы и вой, беспомощность (не дают царя, дождя,
# суда, не спасают вдов и сирот), немощь халдеев перед Белом, женщины с
# верёвками, мастера и долговечность, война и пожар, сравнение с царём,
# дверью, столпом, солнцем, луной, звёздами, молнией, ветром, облаками,
# огнём; в конце — «как пугало в огороде», терновый куст и труп во тьме,
# истлевающий пурпур; 72 — «лучше человек праведный, не имеющий идолов».
#
# Нумерация: 72 стиха — по церковнославянской/Синодальной (решение автора
# проекта), здесь она совпадает с греческим модулем. Особенность gr-lxx-byz:
# в стихе 1 склеены надписание («Ἀντίγραφον ἐπιστολῆς…») и начало стиха
# («1 Διὰ τὰς ἁμαρτίας…»), поэтому стих 1 перевода содержит и надписание, и
# слова о плене. В csl-ru и ru надписание — отдельный стих 1, от него счёт
# сдвинут на +1: csl 2–4 = наши 1–3, csl 5 = наши 4–5 (слав. сливает их),
# с нашего 6-го стиха (= слав. 6) номера совпадают. Дальше слав. местами делит иначе: слав. 27/28
# = наш 27 (хвост «к жертвам прикасаются» отнесён в слав. 28), слав. 46 без
# вопроса (вопрос перенесён в начало слав. 47), слав. 55 сливает наши 55–56,
# слав. 56–57 делят наш 57, слав. 61/62 делят наш 61 (огненная клауза — в
# слав. 62). Держим деление gr.
#
# Паритет LXX и слав. (docs/japanese-bible.md, «Паритет LXX и
# церковнославянского»): база — Септуагинта (gr-lxx-byz), слав. — второй
# свидетель церковного текста; ru (Синодальный, с масоретского) — не источник.
# Слав. фраза, которой нет в LXX (1:26 «егда когда падутся на землю, и не
# могут сами востати»), внесена в основной текст без 〔…〕 (паритет, п. 2),
# в notes отмечено «нет в LXX». Лексические варианты слав. (1:9 «в дому» вм.
# «на кровле», 1:11 «от храма» вм. «из дома», 1:27 «варят» вм. «засаливают»,
# 1:30 «во храмех» вм. «в домах», 1:40 «емуже молятся», 1:71 «от червия»,
# формула «и каменни» в 1:38, 50, 54, 57, 69) в текст не внесены — держим
# LXX, чтобы рефрен «дерево–золото–серебро» оставался единым; всё отмечено
# в notes. 〔…〕 нет: все 72 стиха есть в gr-lxx-byz.
#
# Голоса: это речь послания (пророка) к отводимым в плен, поэтому основной
# текст — без кавычек. Прямая речь с вводкой в главе одна: 1:5 «скажите в
# уме» (εἴπατε τῇ διανοίᾳ) — слова людей в 「…」, вводка вне кавычек. Первое
# лицо Бога (1:2 ἐξάξω, 1:6 ὁ ἄγγελός μου) идёт внутри речи послания без
# кавычек: вводной формулы «так говорит Господь» в главе нет. Риторические
# вопросы (1:29, 39, 44, 46, 49, 51, 56, 63) — не речь, кавычек не получают.
# Вложенной речи нет, 『…』 нет. Красного и синего в Ветхом Завете нет.
#
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Числа — кандзи. Не-常用漢字 пишутся каной, как в корпусе (こうもり, つばめ,
# ねこ, からす, かかし, いばら, しかばね, ぬか, ひげ, やもめ, みなしご).
# Повторяющиеся формулы переведены одинаково:
# μὴ φοβηθῆτε αὐτούς → 彼らを恐れてはならない (1:14, 22, 28, 64, 68);
# πῶς οὖν νομιστέον ἢ κλητέον… → どうして…できようか (1:39, 44, 56, 63);
# οἱ ψευδεῖς θεοί → 偽りの神々 (1:58, трижды); …よりましである (1:58);
# ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι → 木の神々、金をかぶせた神々、
# 銀をかぶせた神々 (1:38, 54, 57, 69; в 1:57 и 70 порядок по греческому).
# Имена: エレミヤ, バビロン, ネブカドネツァル (по корпусу Иер), カルデア人,
# ベル (Βῆλος; как в Иер 50:2; слав. «Вил», в ru ошибочно «Ваал»).
# Сносок ⟨…⟩ нет: 偶像, 祭司, 天使, 捕囚, 娼婦 уже в корпусе.

