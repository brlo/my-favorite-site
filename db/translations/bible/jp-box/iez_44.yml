# jp-box, Иезекииль, глава 44. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 44 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: князь, левиты и священники, правила служения. 1–3 закрытые восточные
# ворота и князь, который ест хлеб пред Господом; 4–9 слава наполняет дом, слово
# о чужих необрезанных; 10–14 левиты, отступившие, несут наказание и служат при
# доме; 15–16 сыны Садока — священники; 17–27 одежды, вино, брак, обучение народа,
# суд, прикосновение к мёртвому, очищение; 28–31 наследие Господа, жертвы и начатки.
# Голоса: 1 — описание; 2–3 — слово Господа в 「…」; 4 — описание; 5–31 — слово
# Господа в 「…」 (одна цитата; формула «так говорит Господь Бог» в 6 и 9 внутри
# речи; в 6 повеление «скажи дому» — внутри той же речи). Речь продолжается в гл. 45.
# «Точка»: в этой главе нет.
# Имена и термины: 君[きみ] (ἡγούμενος), レビ人[びと] (Λευίτης), 祭司[さいし] (ἱερεύς),
# サドク (Σαδδουκ), 異国人[いこくじん] (ἀλλογενής), 割礼[かつれい] (ἀπερίτμητος),
# 至聖[しせい] (ἅγια τῶν ἁγίων), 嗣業[しぎょう] (κληρονομία), 所有[しょゆう] (κατάσχεσις),
# 初穂[はつほ] (ἀπαρχή), 安息日[あんそくび] (σάββατον), 律法[りっぽう] (νόμιμα),
# 祭[まつ]り (ἑορτή), 贖[あがな]いの供[そな]え物[もの] (ἱλασμός).
#
