verses:
  1: "彼[かれ]はわたしを、東[ひがし]に面[めん]した外[そと]の聖[せい]なる門[もん]の道[みち]へ連[つ]れ戻[もど]した。その門は閉[と]ざされていた。"
  2: "主[しゅ]はわたしに言[い]われた。「この門[もん]は閉[と]ざされたままで、開[ひら]かれない。だれもこれを通[とお]ってはならない。イスラエルの神[かみ]である主[しゅ]がこれを通って入[はい]られるからである。それゆえ、これは閉ざされたままである。"
  3: "君[きみ]はそこに座[すわ]って、主[しゅ]の前[まえ]でパンを食[た]べる。彼は門[もん]の玄関[げんかん]の間[ま]の道[みち]から入[はい]り、その道から出[で]る。」"
  4: "彼[かれ]はわたしを、北[きた]に面[めん]した門[もん]の道[みち]から、神殿[しんでん]の正面[しょうめん]へ連[つ]れて行[い]った。わたしが見[み]ると、見[み]よ、主[しゅ]の家[いえ]は栄光[えいこう]で満[み]ちていた。わたしは顔[かお]を地[ち]に付[つ]けて倒[たお]れた。"
  5: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、わたしがあなたと語[かた]るすべてのこと、主[しゅ]の家[いえ]のすべての規定[きてい]とそのすべての掟[おきて]について、心[こころ]に納[おさ]め、目[め]で見[み]、耳[みみ]で聞[き]け。あなたは心を神殿[しんでん]の入口[いりぐち]に、そのすべての出口[でぐち]に、すべての聖[せい]なるものの中[なか]に置[お]け。"
  6: "あなたは、わたしを憤[いきどお]らせる家[いえ]、イスラエルの家[いえ]に言[い]え。主[しゅ]なる神[かみ]はこう言[い]われる。イスラエルの家[いえ]よ、あなたがたのすべての不法[ふほう]で、もう十分[じゅうぶん]である。"
  7: "あなたがたが、心[こころ]に割礼[かつれい]を受[う]けていない異国人[いこくじん]の子[こ]らを連[つ]れ込[こ]み、わたしの聖[せい]なる所[ところ]に置[お]いたこと、また、あなたがたがパンと脂肪[しぼう]と肉[にく]と血[ち]をささげるときに、それを汚[けが]したことである。あなたがたは、自分のすべての不法によって、わたしの契約[けいやく]を踏[ふ]み越[こ]えていた。"
  8: "あなたがたは、わたしの聖[せい]なる所[ところ]の務[つと]めを守[まも]らなかった。かえって、自分[じぶん]たちのために、わたしの聖なる所の務めを守る見張[みは]りを立[た]てた。"
  9: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。心[こころ]に割礼[かつれい]を受[う]けていない異国人[いこくじん]の子[こ]は、だれもわたしの聖[せい]なる所[ところ]に入[はい]らない。イスラエルの家[いえ]の真[ま]ん中[なか]にいる異国人の子[こ]らのうちの、だれもである。"
  10: "しかし、レビ人[びと]たちも、イスラエルがわたしから迷[まよ]い出[で]たとき、自分[じぶん]たちの思[おも]いのままに従[したが]ってわたしから離[はな]れた者は、自分[じぶん]の不正[ふせい]を受[う]け持[も]つ。"
  11: "彼らはわたしの聖[せい]なる所[ところ]で仕[つか]え、神殿[しんでん]の門[もん]の門番[もんばん]となり、神殿に仕える。彼らは民[たみ]のために犠牲[ぎせい]と燔祭[はんさい]を屠[ほふ]り、民の前[まえ]に立って民に仕える。"
  12: "彼らが自分[じぶん]の偶像[ぐうぞう]の前[まえ]で民に仕[つか]え、イスラエルの家[いえ]にとって不正[ふせい]の苦[くる]しみとなったからである。それゆえ、わたしは彼らに対して手[て]を上[あ]げた、と主[しゅ]なる神[かみ]は言[い]われる。彼らは自分[じぶん]の不法[ふほう]を受[う]け持[も]つ。"
  13: "彼らはわたしに近[ちか]づいて祭司[さいし]としてわたしに仕[つか]えることはない。またイスラエルの子[こ]らの聖[せい]なるものに近づくことも、わたしの至聖[しせい]のものに近づくこともない。彼らは自分[じぶん]が迷[まよ]い込[こ]んだ迷[まよ]いの中[なか]で、自分[じぶん]の恥[はじ]を受[う]け持[も]つ。"
  14: "彼らは、神殿[しんでん]のすべての務[つと]めと、そこでなされるすべてのことを守[まも]るために置[お]かれる。"
  15: "レビ人[びと]の祭司[さいし]たち、すなわちサドクの子[こ]らは、イスラエルの家[いえ]がわたしから迷[まよ]い出[た]とき、わたしの聖[せい]なる所[ところ]の務[つと]めを守[まも]った。この者[もの]たちがわたしに近[ちか]づいてわたしに仕[つか]え、わたしの前[まえ]に立[た]って、わたしに犠牲[ぎせい]、すなわち脂肪[しぼう]と血[ち]をささげる、と主[しゅ]なる神[かみ]は言[い]われる。"
  16: "この者[もの]たちがわたしの聖[せい]なる所[ところ]に入[はい]り、わたしの食卓[しょくたく]に近[ちか]づいてわたしに仕[つか]え、わたしの務[つと]めを守[まも]る。"
  17: "彼らが内庭[ないてい]の門[もん]に入[はい]るとき、亜麻[あま]の衣[ころも]を着[き]る。内庭の門[もん]から仕[つか]えるとき、羊毛[ようもう]の衣を着てはならない。"
  18: "彼らは頭[あたま]に亜麻[あま]の頭巾[ずきん]をかぶり、腰[こし]に亜麻の下帯[したおび]を締[し]める。きつく締[し]めてはならない。"
  19: "彼らが民[たみ]のもとへ外庭[がいてい]へ出[で]るとき、自分[じぶん]がその中で仕[つか]える衣[ころも]を脱[ぬ]ぎ、それを聖[せい]なる所[ところ]の部屋[へや]に置[お]き、別[べつ]の衣を着[き]る。自分たちの衣によって民を聖[せい]なるものとしてはならないからである。"
  20: "彼らは頭[あたま]を剃[そ]ってはならない。髪[かみ]を伸[の]ばしてはならない。必[かなら]ず頭を覆[おお]う。"
  21: "祭司[さいし]はだれも、内庭[ないてい]に入[はい]るとき、ぶどう酒[しゅ]を飲[の]んではならない。"
  22: "彼らはやもめや離縁[りえん]された女[おんな]を妻[つま]にしてはならない。ただイスラエルの血筋[ちすじ]の処女[おとめ]を娶[めと]る。祭司[さいし]のやもめであるなら、それを娶ることができる。"
  23: "彼らはわたしの民[たみ]に、聖[せい]なるものと俗[ぞく]なるものとの間[あいだ]、汚[けが]れたものと清[きよ]いものとの間を教[おし]え、それを彼らに知[し]らせる。"
  24: "彼らは血[ち]の裁[さば]きのとき、裁きを下[くだ]すために立[た]つ。彼らはわたしの定[さだ]めによって裁き、わたしのさばきを行[おこな]い、わたしの律法[りっぽう]とわたしの規定[きてい]をわたしのすべての祭[まつ]りで守[まも]り、わたしの安息日[あんそくび]を聖[せい]とする。"
  25: "彼らは死[し]んだ人[ひと]のそばに近[ちか]づいて汚[けが]れてはならない。ただ父[ちち]、母[はは]、息子[むすこ]、娘[むすめ]、兄弟[きょうだい]、また夫[おっと]のない妹[いもうと]のためには、汚れることができる。"
  26: "彼が清[きよ]められた後[あと]、七[なな]日[か]を自分[じぶん]のために数[かぞ]える。"
  27: "彼らが聖[せい]なる所[ところ]で仕[つか]えるために内庭[ないてい]に入[はい]る日[ひ]には、贖[あがな]いの供[そな]え物[もの]をささげる、と主[しゅ]なる神[かみ]は言[い]われる。"
  28: "彼らには嗣業[しぎょう]がある。わたしが彼らの嗣業[しぎょう]である。イスラエルの子[こ]らの間[あいだ]で彼らに所有[しょゆう]は与[あた]えられない。わたしが彼らの所有[しょゆう]だからである。"
  29: "彼らは犠牲[ぎせい]と、罪[つみ]のため、また無知[むち]のためのものを食[た]べる。イスラエルで聖別[せいべつ]されたものは、すべて彼らのものとなる。"
  30: "すべての初穂[はつほ]、すべての初子[ういご]、あなたがたのすべての初穂[はつほ]からのすべての供[そな]え物[もの]は祭司[さいし]たちのものとなる。あなたがたの作物[さくもつ]の初穂[はつほ]を祭司に与[あた]えよ。そうすれば、あなたがたの家[いえ]に祝福[しゅくふく]が置[お]かれる。"
  31: "祭司[さいし]たちは、鳥[とり]でも家畜[かちく]でも、死[し]んだものや獣[けもの]に裂[さ]かれたものを食[た]べてはならない。」"

notes:
  1: "ἐπέστρεψέν με κατὰ τὴν ὁδὸν τῆς πύλης τῶν ἁγίων τῆς ἐξωτέρας — «обратил меня на путь ворот святых, внешних» (ἡ πύλη ἡ ἁγία — святые ворота); τῆς βλεπούσης κατ᾽ ἀνατολάς — «смотрящих на восток»; κεκλεισμένη — «заперта» (κλείω; слав. «затворенна»)."
  2: "Ἡ πύλη αὕτη κεκλεισμένη ἔσται — «ворота сии будут заперты»; οὐκ ἀνοιχθήσεται — «не откроются»; οὐδεὶς μὴ διέλθῃ — «никто не пройдёт» (усиленное отрицание); κύριος ὁ θεὸς τοῦ Ισραηλ εἰσελεύσεται δι᾽ αὐτῆς — «Господь Бог Израилев войдёт ими»; ἔσται κεκλεισμένη — «будут заперты»."
  3: "ὁ ἡγούμενος — «вождь, князь» (君; слав. «старейшина»); καθῆται ἐν αὐτῇ — «сядет в них (в воротах)»; τοῦ φαγεῖν ἄρτον ἐναντίον κυρίου — «чтобы есть хлеб пред Господом»; κατὰ τὴν ὁδὸν αιλαμ τῆς πύλης — «по пути притвора ворот» (αιλαμ — 玄関の間, слав. «елам»); εἰσελεύσεται … ἐξελεύσεται — «войдёт… выйдет»."
  4: "κατὰ τὴν ὁδὸν τῆς πύλης τῆς πρὸς βορρᾶν — «по пути ворот, что к северу»; κατέναντι τοῦ οἴκου — «напротив дома»; πλήρης δόξης ὁ οἶκος κυρίου — «полон славы дом Господень» (主の栄光); πίπτω ἐπὶ πρόσωπόν μου — «падаю на лицо моё»."
  5: "τάξον εἰς τὴν καρδίαν σου — «положи в сердце твоё» (τάσσω — ставить); ἰδὲ τοῖς ὀφθαλμοῖς — «смотри глазами»; ἄκουε πάντα ὅσα ἐγὼ λαλῶ μετὰ σοῦ — «слушай всё, что Я говорю с тобою»; κατὰ πάντα τὰ προστάγματα οἴκου κυρίου — «по всем повелениям дома Господня» (規定); νόμιμα — «уставы» (掟); εἰς τὴν εἴσοδον τοῦ οἴκου — «ко входу дома»; κατὰ πάσας τὰς ἐξόδους — «по всем выходам»; ἐν πᾶσι τοῖς ἁγίοις — «во всех святынях»."
  6: "τὸν οἶκον τὸν παραπικραίνοντα — «дом, огорчающий (прогневляющий) [Меня]» (παραπικραίνω); Ἱκανούσθω ὑμῖν — «довольно вам» (ἱκανόω); ἀπὸ πασῶν τῶν ἀνομιῶν — «от всех беззаконий» (不法)."
  7: "υἱοὺς ἀλλογενεῖς — «сынов чужих (иноплеменников)» (ἀλλογενής; 異国人); ἀπεριτμήτους καρδίᾳ καὶ σαρκί — «необрезанных сердцем и плотью» (割礼); εἰσαγαγεῖν ὑμᾶς — «вводить вам»; ἐβεβήλουν — «оскверняли»; ἄρτους, στέαρ καὶ αἷμα — «хлебы, тук и кровь» (パンと脂肪と血); слав. добавляет «мяса» (肉) — нет в LXX, внесено; παρεβαίνετε τὴν διαθήκην — «преступали завет» (契約)."
  8: "διετάξατε τοῦ φυλάσσειν φυλακάς — «поставили хранить стражи» (LXX положительно); слав. и МТ: «не снабдесте хранити стражбы… и постависте стражей… себе» — отрицание, взято как церковное чтение; φυλακή — «стража, служение» (務め)."
  9: "Πᾶς υἱὸς ἀλλογενὴς ἀπερίτμητος καρδίᾳ — «всякий сын чужой, необрезанный сердцем»; οὐκ εἰσελεύσεται εἰς τὰ ἁγιά μου — «не войдёт во святыни Мои»; ἐν πᾶσιν υἱοῖς ἀλλογενῶν — «среди всех сынов чужих»."
  10: "ἀλλ᾽ ἢ οἱ Λευῖται — «но [и] левиты» (слав. «но и левити»); ἀφήλαντο ἀπ᾽ ἐμοῦ — «отступили от Меня» (ἀφαιρέω, здесь — удалились); ἐν τῷ πλανᾶσθαι τὸν Ισραηλ — «когда Израиль блуждал» (πλανάω); κατόπισθεν τῶν ἐνθυμημάτων — «вслед за помыслами» (ἐνθύμημα); λήμψονται ἀδικίαν — «понесут неправду» (不正)."
  11: "λειτουργοῦντες θυρωροί — «служащие привратниками» (θυρωρός; 門番); ἐπὶ τῶν πυλῶν τοῦ οἴκου — «у ворот дома»; σφάξουσιν — «заколют» (屠る); τὰ ὁλοκαυτώματα καὶ τὰς θυσίας — «всесожжения и жертвы»; στήσονται ἐναντίον τοῦ λαοῦ — «станут пред народом»; λειτουργεῖν αὐτοῖς — «служить им»."
  12: "ἀνθ᾽ ὧν — «за то, что»; ἐλειτούργουν αὐτοῖς — «служили им»; πρὸ προσώπου τῶν εἰδώλων — «пред лицом идолов» (偶像); εἰς κόλασιν ἀδικίας — «в наказание (соблазн) неправды» (κόλασις; слав. «в мучение неправды»); ἦρα τὴν χεῖρά μου ἐπ᾽ αὐτούς — «поднял руку Мою на них»; λήμψονται ἀνομίαν — «понесут беззаконие» (слав. добавляет «и возмут беззаконие свое» — повтор, внесено)."
  13: "οὐκ ἐγγιοῦσι πρός με — «не приблизятся ко Мне»; ἱερατεύειν μοι — «священнодействовать Мне» (祭司として仕える); προσάγειν πρὸς τὰ ἅγια — «приступать к святыням»; ἅγια τῶν ἁγίων — «святое святых» (至聖); ἀτιμία — «бесчестие» (恥); πλάνη — «заблуждение» (迷い)."
  14: "κατατάξουσιν αὐτούς — «поставят их» (κατατάσσω); φυλάσσειν φυλακὰς τοῦ οἴκου — «хранить стражи дома» (務め); εἰς πάντα τὰ ἔργα αὐτοῦ — «на все дела его»; εἰς πάντα ὅσα ἂν ποιήσωσιν — «на всё, что они делают». Слав. обрывает стих на «на вся дела его» — клауза LXX добавлена."
  15: "οἱ ἱερεῖς οἱ Λευῖται οἱ υἱοὶ τοῦ Σαδδουκ — «священники-левиты, сыны Садока» (サドク); ἐφυλάξαντο τὰς φυλακάς — «сохранили стражи»; ἐν τῷ πλανᾶσθαι οἶκον Ισραηλ — «когда дом Израилев блуждал»; προσάξουσιν πρός με — «приступят ко Мне»; προφέρειν θυσίαν, στέαρ καὶ αἷμα — «приносить жертву, тук и кровь» (脂肪と血). Слав. в скобках «(и пути моя)» — редакционная скобка, не перенесена."
  16: "οὗτοι εἰσελεύσονται εἰς τὰ ἁγιά μου — «сии войдут во святыни Мои»; προσελεύσονται πρὸς τὴν τράπεζάν μου — «приступят к трапезе Моей» (食卓); λειτουργεῖν μοι — «служить Мне»; φυλάξουσιν τὰς φυλακάς μου — «сохранят стражи Мои»."
  17: "εἰσπορεύεσθαι τὰς πύλας τῆς αὐλῆς τῆς ἐσωτέρας — «входить в ворота внутреннего двора»; στολὰς λινᾶς — «одежды льняные» (亜麻の衣); ἐρεᾶ — «шерстяное» (ἔριον — шерсть; 羊毛); ἀπὸ τῆς πύλης — «от ворот»."
  18: "κιδάρεις λινᾶς — «кидары (головные повязки) льняные» (κίδαρις; 頭巾); περισκελῆ λινᾶ — «льняные исподние одежды» (περισκελής — вокруг ног; 下帯); ἐπὶ τὰς ὀσφύας — «на чресла» (腰); οὐ περιζώσονται βίᾳ — «не опояшутся силою (туго)» (βία; слав. «крепко»)."
  19: "ἐκπορεύεσθαι εἰς τὴν αὐλὴν τὴν ἐξωτέραν πρὸς τὸν λαόν — «выходить во внешний двор к народу»; ἐκδύσονται τὰς στολάς — «снимут одежды»; θήσουσιν ἐν ταῖς ἐξέδραις τῶν ἁγίων — «положат в покоях святых» (部屋); ἐνδύσονται στολὰς ἑτέρας — «оденутся в другие одежды»; οὐ μὴ ἁγιάσωσιν τὸν λαόν — «чтобы не освятить народ»."
  20: "τὰς κεφαλὰς οὐ ξυρήσονται — «голов не обреют» (ξυράω); τὰς κόμας οὐ ψιλώσουσιν — «волос не обнажат (не выбреют)» (ψιλόω); слав. «влас своих да не растят» — следует МТ («не отпускать волос»); καλύπτοντες καλύψουσιν — «покрывая покроют» (усиление; 必ず頭を覆う)."
  21: "οἶνον οὐ μὴ πίωσιν — «вина отнюдь не будут пить»; πᾶς ἱερεύς — «всякий священник»; ἐν τῷ εἰσπορεύεσθαι — «когда входят»."
  22: "χήραν καὶ ἐκβεβλημένην — «вдову и отверженную (разведённую)» (ἐκβάλλω); οὐ λήμψονται εἰς γυναῖκα — «не возьмут в жёны»; παρθένον ἐκ τοῦ σπέρματος Ισραηλ — «деву из семени Израиля» (処女); χήρα ἐὰν γένηται ἐξ ἱερέως — «если будет вдова от священника»."
  23: "διδάξουσιν — «научат»; ἀνὰ μέσον ἁγίου καὶ βεβήλου — «между святым и мирским (нечестивым)» (βέβηλος; 俗); ἀκαθάρτου καὶ καθαροῦ — «нечистого и чистого» (汚れた/清い); γνωριοῦσιν — «дадут знать»."
  24: "ἐπὶ κρίσιν αἵματος — «на суд крови» (血の裁き); ἐπιστήσονται τοῦ διακρίνειν — «станут, чтобы различать»; δικαιώματα — «оправдания» (定め); κρίματα — «суды» (さばき); νόμιμα — «уставы» (律法); προστάγματα — «повеления» (規定); ἑορταί — «праздники» (祭り); σάββατα — «субботы» (安息日); ἁγιάσουσιν — «освятят» (聖とする)."
  25: "ἐπὶ ψυχὴν ἀνθρώπου — «к душе человека», т. е. к умершему (ψυχή — здесь покойник; слав. «над душу человека»); μιανθῆναι — «оскверниться» (汚れる); ἐπὶ πατρὶ καὶ μητρί — «об отце и матери»; ἣ οὐ γέγονεν ἀνδρί — «которая не была за мужем» (夫のない妹); μιανθήσεται — «осквернится» (дозволено)."
  26: "μετὰ τὸ καθαρισθῆναι αὐτόν — «после очищения его»; ἑπτὰ ἡμέρας — «семь дней»; ἐξαριθμήσει αὐτῷ — «отсчитает себе» (ἐξαριθμέω)."
  27: "ᾗ ἂν ἡμέρᾳ — «в какой бы день»; εἰσπορεύωνται εἰς τὴν αὐλὴν τὴν ἐσωτέραν — «входят во внутренний двор»; λειτουργεῖν ἐν τῷ ἁγίῳ — «служить во святом»; προσοίσουσιν ἱλασμόν — «принесут очищение (жертву очищения)» (ἱλασμός; 贖いの供え物)."
  28: "κληρονομία — «наследие» (嗣業); ἐγὼ κληρονομία αὐτοῖς — «Я — наследие им»; κατάσχεσις — «владение» (所有); οὐ δοθήσεται — «не будет дано»; ἐγὼ κατάσχεσις αὐτῶν — «Я — владение их»."
  29: "τὰς θυσίας — «жертвы»; τὰ ὑπὲρ ἁμαρτίας — «[жертвы] за грех»; τὰ ὑπὲρ ἀγνοίας — «[жертвы] за неведение» (無知); φάγονται — «съедят» (食べる); ἀφόρισμα — «отделённое, посвящённое» (聖別されたもの)."
  30: "ἀπαρχαὶ πάντων — «начатки всего» (初穂); πρωτότοκα — «первородное» (初子); ἀφαιρέματα — «отделения, приношения» (供え物); πρωτογενήματα — «первины (первые плоды)» (作物の初穂); τοῦ θεῖναι εὐλογίας ὑμῶν ἐπὶ τοὺς οἴκους ὑμῶν — «чтобы положить благословения ваши на дома ваши» (家に祝福が置かれる)."
  31: "θνησιμαῖον — «мёртвое (падаль)» (死んだもの); θηριάλωτον — «растерзанное зверем» (獣に裂かれたもの); ἐκ τῶν πετεινῶν καὶ ἐκ τῶν κτηνῶν — «из птиц и из скотов» (鳥/家畜); οὐ φάγονται οἱ ἱερεῖς — «не будут есть священники»."
