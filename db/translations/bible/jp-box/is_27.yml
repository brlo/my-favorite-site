# jp-box, Исаия, глава 27. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Исаии есть фрагментами (гл. 25–29), использован только для
# сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 27: 1 поражение морского дракона (левиафана) в тот день; 2–5 песнь о
# винограднике и городе — здесь говорит Господь (「…»), слова жителей — 『…』;
# 6–11 обетование Иакову и суд над ним; 12–13 сбор изгнанных из Ассирии и Египта.
# Нумерация по gr: 13 стихов, у csl/ru тоже 13. Границы иные: gr 27:4a («нет того,
# кто не взял бы его») у csl стоит в конце 27:3; gr 27:4b («я сожжён») у csl — в начале
# 27:5; держимся gr, содержание то же (в notes).
# 〔…〕 нет: все 13 стихов есть в gr-lxx-byz. csl-добавление 27:1 «сущаго в мори»
# (находящегося в море) внесено в основной текст без скобок, в notes отмечено.
# Сносок ⟨…⟩ нет: 剣, 蛇, ぶどう畑, 角笛, 礼拝 уже в корпусе.
# Имена — транслитерация греческого (LXX); レビヤタン — по корпусу (Иов 40–41).

