verses:
  1: "その日[ひ]、神[かみ]は聖[せい]なる大[おお]きな強[つよ]い剣[つるぎ]を、逃[に]げる蛇[へび]であるレビヤタンの上[うえ]に、曲[ま]がりくねる蛇[へび]であるレビヤタンの上に下[くだ]し、海[うみ]にいるレビヤタンを殺[ころ]す。"
  2: "その日[ひ]、美[うつく]しいぶどう畑[ばたけ]がある。そのことについて歌[うた]い始[はじ]めることは、望[のぞ]ましいことである。"
  3: "「わたしは堅[かた]い都[みやこ]、包囲[ほうい]された都[みやこ]である。わたしはそれにむだに水[みず]を注[そそ]ぐ。それは夜[よる]に取[と]られ、昼[ひる]にはその城壁[じょうへき]が倒[たお]れるからだ。"
  4: "その都[みやこ]を取[と]らない者[もの]はひとりもいない。だれがわたしを、畑[はたけ]の茎[くき]を守[まも]る者[もの]とするのか。この敵意[てきい]のゆえに、わたしはその都を退[しりぞ]けた。それゆえ、これがために主[しゅ]なる神[かみ]は、命[めい]じられたすべてのことを行[おこな]われた。わたしは焼[や]かれた。"
  5: "そのうちに住[す]む者[もの]たちは叫[さけ]ぶ。『わたしたちは彼[かれ]と平和[へいわ]を結[むす]ぼう。平和を結ぼう。』」"
  6: "来[く]る者[もの]たち、ヤコブの子[こ]らよ。イスラエルは芽[め]を出[だ]し、花[はな]を咲[さ]かせ、全世界[ぜんせかい]はその実[み]で満[み]ちる。"
  7: "彼[かれ]が打[う]ったように、彼[かれ]もまた打[う]たれるのか。彼[かれ]が殺[ころ]したように、彼[かれ]もまた殺[ころ]されるのか。"
  8: "争[あらそ]い、辱[はずかし]めながら、彼[かれ]は彼[かれ]らを送[おく]り出[だ]す。あなたは、かたくなな霊[れい]と怒[いか]りの霊[れい]によって、彼[かれ]らを滅[ほろ]ぼすことを考[かんが]えておられたのではないか。"
  9: "それゆえ、ヤコブの不法[ふほう]は取[と]り除[のぞ]かれる。これが彼[かれ]の祝福[しゅくふく]である。わたしが彼[かれ]の罪[つみ]を取[と]り除[のぞ]くとき、彼[かれ]らが祭壇[さいだん]の石[いし]をことごとく細[こま]かな灰[はい]のように砕[くだ]くとき、彼[かれ]らの木々[きぎ]は残[のこ]らず、その偶像[ぐうぞう]は遠[とお]くの森[もり]のように切[き]り倒[たお]される。"
  10: "住[す]んでいた群[む]れは、捨[す]てられた群[む]れのように、そのままにされる。長[なが]い間[あいだ]、それは牧[まき]の場[ば]となり、そこで休[やす]む。"
  11: "しばらくして、そこにはもう緑[みどり]のものは何[なに]もなくなる。乾[かわ]き果[は]てるからだ。見物[けんぶつ]から帰[かえ]る女[おんな]たちよ、来[き]なさい。彼[かれ]らは悟[さと]りのない民[たみ]であるからだ。それゆえ、彼[かれ]らを造[つく]られた方[かた]は彼[かれ]らをあわれまず、彼[かれ]らを形[かたち]づくられた方[かた]も彼[かれ]らを憐[あわ]れまない。"
  12: "その日[ひ]、主[しゅ]は川[かわ]の水路[すいろ]からリノコロラまでを閉[と]ざされる。あなたがたはイスラエルの子[こ]らを一人[ひとり]ずつ集[あつ]めよ。"
  13: "その日[ひ]、大[おお]きな角笛[つのぶえ]が鳴[な]らされる。アッシリアの地[ち]で滅[ほろ]びた者[もの]たちと、エジプトで滅[ほろ]びた者[もの]たちが来[き]て、エルサレムの聖[せい]なる山[やま]で主[しゅ]を礼拝[れいはい]する。"

notes:
  1: "ἐπάξει … τὴν μάχαιραν τὴν ἁγίαν καὶ τὴν μεγάλην καὶ τὴν ἰσχυράν — «наведёт… меч святой, великий и крепкий»: тройное определение сохранено. δράκων — «дракон, змей»; в LXX так передан евр. לִוְיָתָן (Левиафан), в Син. «левиафан», в слав. «драконт»; в корпусе (Иов 40–41) δράκων уже передан レビヤタン. ὄφιν φεύγοντα — «змея убегающего», σκολιόν — «изгибающегося, лукавого» (слав. «лукаваго»). Слав. добавляет «сущаго в мори» (находящегося в море), чего нет в LXX; по паритету внесено в основной текст без 〔…〕."
  2: "ἀμπελὼν καλός — «виноградник прекрасный» (ἀμπελών — виноградник, слав. «виноград»). ἐπιθύμημα ἐξάρχειν κατ᾿ αὐτῆς — тёмное место: букв. «желание запевать о нём» (ἐξάρχω — запевать, начинать; ἐπιθύμημα — желаемое); слав. «желание пети над ним». В Син. «воспойте о нём» — МТ; перевод остаётся при буквальном смысле LXX, многозначность не сглажена."
  3: "ἐγὼ πόλις ἰσχυρά — «Я — город крепкий»: в LXX это речь Господа о Себе, поэтому цитата. πόλις πολιορκουμένη — «город осаждаемый» (πολιορκέω). μάτην ποτιῶ αὐτήν — «напрасно буду поить его» (ποτίζω — поить). ἁλώσεται γὰρ νυκτός — «ибо будет взят ночью» (ἁλίσκομαι — быть взятым), ἡμέρας δὲ πεσεῖται τὸ τεῖχος — «днём же падёт стена». Слав. в конце добавляет «несть того, иже не возмет его» — это перевод начала gr 27:4, а не добавка; в нашем 27:4 фраза стоит на своём месте по gr."
  4: "οὐκ ἔστιν ἣ οὐκ ἐπελάβετο αὐτῆς — «нет [места], которого он не охватил бы» (ἐπιλαμβάνομαι); у csl эта фраза помещена в конце 27:3, держимся gr. τίς με θήσει φυλάσσειν καλάμην ἐν ἀγρῷ — «кто поставит меня стеречь стебель в поле» (κάλαμος — тростник, стебель; слав. «стеблие на ниве»). κατακέκαυμαι — «я сожжён» (перфект от κατακαίω); csl «сгорех» открывает 27:5."
  5: "βοήσονται οἱ ἐνοικοῦντες ἐν αὐτῇ — «возопиют живущие в нём»; их слова внутри речи Господа — 『…』. ποιήσωμεν εἰρήνην αὐτῷ — «сотворим мир Ему» (ποιέω εἰρήνην), повтор сохранён; слав. «сотворим мир ему, сотворим мир»."
  6: "οἱ ἐρχόμενοι, τέκνα Ιακωβ — «грядущие, дети Иакова»: номинатив-обращение, тёмный оборот; слав. «приходящая чада иаковля». βλαστήσει καὶ ἐξανθήσει Ισραηλ — «прорастёт и расцветёт Израиль» (βλαστάνω, ἐξανθέω). ἐμπλησθήσεται ἡ οἰκουμένη τοῦ καρποῦ αὐτοῦ — «наполнится вселенная плодом его» (οἰκουμένη — вселенная)."
  7: "μὴ ὡς αὐτὸς ἐπάταξεν … — «разве, как Он поразил, и Сам будет поражён?»: риторический вопрос с μή сохранён. ἀνεῖλεν — «убил» (αἱρέω); ἀναιρεθήσεται — «будет убит». Слав. «Еда якоже той порази, и сам сице уязвится?»."
  8: "μαχόμενος καὶ ὀνειδίζων — «воюя и понося» (ὀνειδίζω — укорять, слав. «укоряя»). ἐξαποστελεῖ αὐτούς — «отошлёт их». τῷ πνεύματι τῷ σκληρῷ — «духом жестоким» (σκληρός, слав. «жестоким»); πνεύματι θυμοῦ — «духом ярости». У Син. иное («мерою… как бы в день восточного ветра») — МТ, не вносится."
  9: "ἀφαιρεθήσεται ἡ ἀνομία Ιακωβ — «отнимется беззаконие Иакова» (ἀνομία, слав. «беззаконие»); τοῦτό ἐστιν ἡ εὐλογία αὐτοῦ — «это благословение его». ὅταν θῶσιν πάντας τοὺς λίθους τῶν βωμῶν κατακεκομμμένους ὡς κονίαν λεπτήν — «когда положат все камни жертвенников раздробленными, как тонкую пыль» (κονία — пыль, известь; βωμός — жертвенник). τὰ εἴδωλα αὐτῶν ἐκκεκομμένα ὥσπερ δρυμὸς μακράν — «идолы их изсечены, как дальняя дубрава»."
  10: "τὸ κατοικούμενον ποίμνιον — «обитаемое стадо»: в LXX ποίμνιον (стадо; слав. «стадо»), отсюда 群れ; у Син. «укреплённый город опустеет» — это МТ, в текст не вносится. ἀνειμένον ἔσται ὡς ποίμνιον καταλελειμμένον — «будет оставлено, как покинутое стадо» (ἀνίημι — отпускать). εἰς βόσκημα — «в пастбище» (βόσκημα)."
  11: "μετὰ χρόνον οὐκ ἔσται ἐν αὐτῇ πᾶν χλωρόν — «через время не будет в нём ничего зелёного» (χλωρός). γυναῖκες ἐρχόμεναι ἀπὸ θέας, δεῦτε — «женщины, идущие со зрелища, придите» (θέα — зрелище, слав. «с позорища»). οὐ γὰρ λαός ἐστιν ἔχων σύνεσιν — «ибо это народ, не имеющий разума». У Син. «женщины придут и сожгут их» — МТ; LXX читает «придите», это сохранено."
  12: "συμφράξει κύριος ἀπὸ τῆς διώρυγος τοῦ ποταμοῦ ἕως Ῥινοκορούρων — «заградит Господь от канала реки до Ринокоруры» (διῶρυξ — канал, ров; слав. «от ровенника речнаго»). Ῥινοκόρουρα — город и поток на границе Египта, отсюда リノコロラ; у Син. «до потока Египетского». συναγάγετε … κατὰ ἕνα ἕνα — «соберите… по одному»."
  13: "σαλπιοῦσιν τῇ σάλπιγγι τῇ μεγάλῃ — «вострубят трубою великой» (σάλπιγξ — труба; передана 角笛). οἱ ἀπολόμενοι ἐν τῇ χώρᾳ τῶν Ἀσσυρίων — «погибшие в стране Ассирийской» (ἀπόλλυμαι — погибать; слав. «погубляемии»). προσκυνήσουσιν … ἐπὶ τὸ ὄρος τὸ ἅγιον ἐν Ιερουσαλημ — «поклонятся… на горе святой в Иерусалиме»."
