# jp-box, Осия, глава 9. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–3 «не радуйся, Израиль»: блуд, гумна и точила не познают их, не будут
# жить на земле Господней, Ефрем в Египте и Ассирии; 4–6 хлеб плача, праздник Господень,
# Мемфис и Махмас, тернии в шатрах; 7–9 дни возмездия, пророк как безумный, сеть
# на путях, «как во дни холма»; 10–13 гроздь в пустыне, Ваал-Фегор, слава отлетела,
# «плоть Моя от них», дети на заклание; 14 молитва пророка о неплодной утробе;
# 15–17 Галгал, изгнание из дома, иссохший корень, отринуты и скитальцы.
# Голоса: 1–13 — слово Господа в 「…」 (закрывается в 13); 14 — молитва пророка,
# отдельная речь в 「…」; 15–17 — снова слово Господа в 「…」.
# 9:8: «σκοπὸς Εφραιμ» — «страж Ефрем» (слав. «страж ефрем»), не «Ефрем — соглядатай».
# 9:10: «σκοπὸν ἐν συκῇ πρόιμον» — букв. «сторожа (ранний) на смоковнице»; по смыслу
# ранняя смоква (слав. «яко стража на смоковнице ранняго»), передано 「初なりの実」.
# 9:13: LXX «εἰς θήραν» — «в добычу (на лов)»; в ru/МТ «до Тира» — иное чтение.
#
