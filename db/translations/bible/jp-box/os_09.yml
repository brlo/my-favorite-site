verses:
  1: "「イスラエルよ、喜[よろこ]んではならない。諸国民[しょこくみん]のように楽[たの]しんではならない。あなたは自分[じぶん]の神[かみ]から離[はな]れて淫行[いんこう]をし、すべての麦打[むぎう]ち場[ば]で報[むく]いを愛[あい]したからである。"
  2: "麦打[むぎう]ち場[ば]も酒[さか]ぶねも彼らを知[し]らず、ぶどう酒[しゅ]は彼らを欺[あざむ]く。"
  3: "彼らは主[しゅ]の地[ち]に住[す]まない。エフライムはエジプトに住[す]み、アッシリアの中[なか]で汚[けが]れたものを食[た]べる。"
  4: "彼らは主[しゅ]にぶどう酒[しゅ]を注[そそ]がず、主[しゅ]を喜[よろこ]ばせない。彼らのいけにえは彼らにとって喪[も]のパンのようであり、それを食[た]べる者[もの]はみな汚[けが]れる。彼らのパンは自分[じぶん]の魂[たましい]のためであって、主[しゅ]の家[いえ]には入[はい]らないからである。"
  5: "主[しゅ]の祭[まつ]りの日[ひ]、祝[いわ]いの日[ひ]に、あなたがたは何[なに]をするのか。"
  6: "それゆえ、見[み]よ、彼らはエジプトの惨[みじ]めさから出[で]て行[い]き、メンフィスが彼らを受[う]け入[い]れ、マクマスが彼らを葬[ほうむ]る。彼らの銀[ぎん]は滅[ほろ]びに奪[うば]われ、彼らの天幕[てんまく]には茨[いばら]が生[は]える。"
  7: "罰[ばつ]の日[ひ]が来[き]た。報[むく]いの日[ひ]が来[き]た。イスラエルは、気[き]の狂[くる]った預言者[よげんしゃ]、霊[れい]に駆[か]られた人[ひと]のように苦[くる]しめられる。あなたの不法[ふほう]が多[おお]いので、あなたの狂[くる]いは増[ふ]えた。"
  8: "エフライムはわたしの神[かみ]のもとで見張[みは]りである。預言者[よげんしゃ]は彼のすべての道[みち]にかかる曲[まが]った罠[わな]であり、人[ひと]々[びと]は主[しゅ]の家[いえ]に狂[くる]いを据[す]えた。"
  9: "彼らはかの丘[おか]の日[ひ]々[び]のように腐[くさ]り果[は]てた。主[しゅ]は彼の不法[ふほう]を思[おも]い起[おこ]し、その罪[つみ]を罰[さば]かれる。"
  10: "わたしは荒野[こうや]でぶどうの房[ふさ]を見[み]つけるようにイスラエルを見[み]つけ、いちじくの木[き]の初[はつ]なりの実[み]を見[み]るように、あなたがたの父[ちち]たちを見[み]た。しかし、彼らはベエル・フェゴルへ行[い]き、恥[は]ずかしめに身[み]をゆだね、愛[あい]された者[もの]たちは忌[い]むべき者[もの]たちのようになった。"
  11: "エフライムは鳥[とり]のように飛[と]び去[さ]り、その栄光[えいこう]は、生[う]まれることも、産[う]みの苦[くる]しみも、宿[やど]すこともなくなる。"
  12: "たとえ彼らが子[こ]どもを育[そだ]てても、わたしは彼らを人[ひと]の間[あいだ]から絶[た]やし、子[こ]どものない者[もの]とする。彼らには災[わざわ]いがある。わたしの肉[にく]が彼らから離[はな]れるからである。"
  13: "エフライムは、わたしが見[み]たとおり、その子[こ]どもを獲物[えもの]として差[さ]し出[だ]した。エフライムはその子[こ]どもを屠[ほふ]り場[ば]へ連[つ]れ出[だ]す」。"
  14: "「主[しゅ]よ、彼らにお与[あた]えください。何[なに]をお与[あた]えになるのですか。子[こ]を産[う]まない胎[たい]と、乾[かわ]いた乳房[ちぶさ]をお与[あた]えください」。"
  15: "「彼らの悪[あく]はすべてギルガルにある。そこでわたしは彼らを憎[にく]んだ。彼らの行[おこな]いの悪[あく]のゆえに、わたしは彼らをわたしの家[いえ]から追[お]い出[だ]す。もはや彼らを愛[あい]することはしない。彼らの君[きみ]たちはみな背[そむ]く者[もの]である。"
  16: "エフライムは打[う]たれ、その根[ね]は枯[か]れた。もはや実[み]を結[むす]ぶことはない。たとえ子[こ]を産[う]んでも、わたしはその胎[たい]の望[のぞ]みを殺[ころ]す。"
  17: "わたしの神[かみ]は彼らを退[しりぞ]ける。彼らが神[かみ]の声[こえ]を聞[き]かなかったからである。彼らは諸国民[しょこくみん]の間[あいだ]をさすらう者[もの]となる」。"

notes:
  1: "Μὴ χαῖρε, Ισραηλ, μηδὲ εὐφραίνου καθὼς οἱ λαοί — «не радуйся, Израиль, и не веселись, как народы» (χαίρω, εὐφραίνομαι); ἐπόρνευσας ἀπὸ τοῦ θεοῦ σου — «отступил блудом от Бога твоего»; ἠγάπησας δόματα ἐπὶ πάντα ἅλωνα σίτου — «возлюбил даяния (плату) на всех гумнах пшеницы» (δόμα — дар, плата; ἅλων — гумно, 麦打ち場)."
  2: "ἅλων καὶ ληνὸς οὐκ ἔγνω αὐτούς — «гумно и точило не познали их» (ληνός — давильня, точило, 酒ぶね); ὁ οἶνος ἐψεύσατο αὐτούς — «вино солгало им» (ψεύδομαι — лгать)."
  3: "οὐ κατῴκησαν ἐν τῇ γῇ τοῦ κυρίου — «не вселились в земле Господней» (κατοικέω); κατῴκησεν Εφραιμ εἰς Αἴγυπτον — «вселился Ефрем в Египет»; ἐν Ἀσσυρίοις ἀκάθαρτα φάγονται — «в Ассирии нечистое съедят»."
  4: "οὐκ ἔσπεισαν τῷ κυρίῳ οἶνον — «не возливали Господу вина» (σπένδω — совершать возлияние; слав. «не возлияша»); οὐχ ἥδυναν αὐτῷ — «не услаждали Ему» (ἡδύνω — делать приятным); αἱ θυσίαι αὐτῶν ὡς ἄρτος πένθους αὐτοῖς — «жертвы их как хлеб плача (погребальный) им» (πένθος — плач, траур, 喪); οἱ ἔσθοντες αὐτὰ μιανθήσονται — «все, кто ест их, осквернятся»; οἱ ἄρτοι αὐτῶν ταῖς ψυχαῖς αὐτῶν οὐκ εἰσελεύσονται εἰς τὸν οἶκον κυρίου — «хлебы их для душ их не войдут в дом Господень»."
  5: "τί ποιήσετε ἐν ἡμέρᾳ πανηγύρεως — «что сделаете в день всеобщего праздника» (πανήγυρις — всенародное торжество); ἐν ἡμέρᾳ ἑορτῆς τοῦ κυρίου — «и в день праздника Господня» (ἑορτή)."
  6: "πορεύσονται ἐκ ταλαιπωρίας Αἰγύπτου — «пойдут от бедствия Египта» (ταλαιπωρία — бедствие; слав. «от труда египетска»); ἐκδέξεται αὐτοὺς Μέμφις — «примет их Мемфис» (メンフィス); θάψει αὐτοὺς Μαχμας — «похоронит их Махмас» (マクマス — тёмное место, возможно искажение); τὸ ἀργύριον αὐτῶν ὄλεθρος κληρονομήσει — «серебро их гибель наследует» (ὄλεθρος — погибель); ἄκανθαι ἐν τοῖς σκηνώμασιν αὐτῶν — «тернии в жилищах (шатрах) их» (σκήνωμα — шатёр, 天幕)."
  7: "ἥκασιν αἱ ἡμέραι τῆς ἐκδικήσεως — «пришли дни возмездия» (ἐκδίκησις); ἥκασιν αἱ ἡμέραι τῆς ἀνταποδόσεώς σου — «пришли дни воздаяния твоего» (ἀνταπόδοσις); κακωθήσεται Ισραηλ ὥσπερ ὁ προφήτης ὁ παρεξεστηκώς — «будет мучим Израиль, как пророк, вышедший из себя» (παρεξίστημι — быть вне себя); ἄνθρωπος ὁ πνευματοφόρος — «человек, носимый духом» (πνευματοφόρος); ὑπὸ τοῦ πλήθους τῶν ἀδικιῶν σου ἐπληθύνθη μανία σου — «от множества беззаконий твоих умножилось безумие твоё» (μανία — безумие, 狂い)."
  8: "σκοπὸς Εφραιμ μετὰ θεοῦ — «страж Ефрем с Богом» (σκοπός — страж, 見張り; слав. «страж ефрем с Богом»); προφήτης, παγὶς σκολιὰ ἐπὶ πάσας τὰς ὁδοὺς αὐτοῦ — «пророк — сеть кривая на всех путях его» (σκολιός — кривой; παγίς — петля, сеть); μανίαν ἐν οἴκῳ κυρίου κατέπηξαν — «безумие в доме Господнем водрузили» (καταπήγνυμι — втыкать, ставить)."
  9: "ἐφθάρησαν κατὰ τὰς ἡμέρας τοῦ βουνοῦ — «развратились, как во дни холма» (φθείρω — развращать; «холм» — Гива, Суд 19; слав. «по днем холма»); μνησθήσεται ἀδικίας αὐτοῦ — «вспомнит беззаконие его»; ἐκδικήσει ἁμαρτίας αὐτοῦ — «взыщет грехи его»."
  10: "Ὡς σταφυλὴν ἐν ἐρήμῳ εὗρον τὸν Ισραηλ — «как виноградную гроздь в пустыне нашёл Я Израиля» (σταφυλή — гроздь); ὡς σκοπὸν ἐν συκῇ πρόιμον εἶδον πατέρας αὐτῶν — «как ранний (плод) на смоковнице увидел Я отцов их» (σκοπός здесь — ранняя смоква; слав. «яко стража на смоковнице ранняго»); εἰσῆλθον πρὸς τὸν Βεελφεγωρ — «пошли к Ваал-Фегору» (ベエル・フェゴル); ἀπηλλοτριώθησαν εἰς αἰσχύνην — «отчуждились в срам» (αἰσχύνη — стыд); ἐγένοντο οἱ ἠγαπημένοι ὡς οἱ ἐβδελυγμένοι — «возлюбленные стали как мерзкие» (βδελύσσομαι — гнушаться; слав. переставил: «быша мерзостнии якоже возлюбленнии»)."
  11: "ὡς ὄρνεον ἐξεπετάσθη — «как птица улетел» (ἐκπετάννυμι — распускать крылья); αἱ δόξαι αὐτῶν ἐκ τόκων καὶ ὠδίνων καὶ συλλήμψεων — «славы их — от рождений, болей и зачатий» (τόκος — рождение; ὠδίν — родовые боли; σύλληψις — зачатие)."
  12: "καὶ ἐὰν ἐκθρέψωσιν τὰ τέκνα αὐτῶν — «если и вскормят детей своих» (ἐκτρέφω); ἀτεκνωθήσονται ἐξ ἀνθρώπων — «будут бездетны среди людей» (ἀτεκνόω — лишать детей); οὐαὶ αὐτοῖς ἐστιν — «горе им»; σάρξ μου ἐξ αὐτῶν — «плоть Моя от них» (тёмное место; слав. добавляет «зане оставих я» — «ибо Я оставил их»)."
  13: "Εφραιμ, ὃν τρόπον εἶδον — «Ефрем, как Я видел»; εἰς θήραν παρέστησαν τὰ τέκνα αὐτῶν — «на лов (в добычу) представили детей своих» (θήρα — охота, добыча); τοῦ ἐξαγαγεῖν εἰς ἀποκέντησιν τὰ τέκνα αὐτοῦ — «чтобы вывести на заклание детей его» (ἀποκέντησις — пронзение, заклание; слав. «на заколение»); в ru/МТ «до Тира» — иное чтение, в текст не внесено."
  14: "δὸς αὐτοῖς, κύριε — «дай им, Господи»; τί δώσεις αὐτοῖς — «что дашь им?»; δὸς αὐτοῖς μήτραν ἀτεκνοῦσαν καὶ μαστοὺς ξηρούς — «дай им утробу нерождающую и сосцы сухие» (μήτρα — утроба, 胎; ξηρός — сухой). Молитва пророка — отдельная речь, не слово Господа."
  15: "πᾶσαι αἱ κακίαι αὐτῶν εἰς Γαλγαλ — «все злобы их в Галгале» (ギルガル); ἐκεῖ αὐτοὺς ἐμίσησα — «там Я возненавидел их»; διὰ τὰς κακίας τῶν ἐπιτηδευμάτων αὐτῶν — «за злобы начинаний их» (ἐπιτήδευμα — занятие, дело); ἐκ τοῦ οἴκου μου ἐκβαλῶ αὐτούς — «из дома Моего изгоню их»; οὐ μὴ προσθήσω τοῦ ἀγαπῆσαι αὐτούς — «не буду более любить их»; πάντες οἱ ἄρχοντες αὐτῶν ἀπειθοῦντες — «все князья их — непокорные» (ἀπειθέω — не повиноваться)."
  16: "ἐπόνεσεν Εφραιμ — «поражён (изнемог) Ефрем» (πονέω — страдать; слав. «поболе»); τὰς ῥίζας αὐτοῦ ἐξηράνθη — «корни его иссохли» (ξηραίνω); καρπὸν οὐκέτι μὴ ἐνέγκῃ — «плода более не принесёт» (ἐκφέρω); ἐὰν γεννήσωσιν, ἀποκτενῶ τὰ ἐπιθυμήματα κοιλίας αὐτῶν — «если и родят, умерщвлю вожделенное чрева их» (ἐπιθύμημα — предмет желания)."
  17: "ἀπώσεται αὐτοὺς ὁ θεός — «отринет их Бог» (ἀπωθέω; слав. «отринет я Бог»); ὅτι οὐκ εἰσήκουσαν αὐτοῦ — «ибо не послушали Его» (εἰσακούω); ἔσονται πλανῆται ἐν τοῖς ἔθνεσιν — «будут скитальцами среди народов» (πλανήτης — блуждающий, さすらう者)."
