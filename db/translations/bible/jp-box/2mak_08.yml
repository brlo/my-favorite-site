verses:
  1: "さて、マッカバイオスと呼ばれるユダとその仲間[なかま]たちは、ひそかに村[むら]々[むら]に入[はい]って同族[どうぞく]を呼[よ]び集[あつ]め、ユダヤの信仰[しんこう]にとどまっている者[もの]たちを加[くわ]えて、六千[ろくせん]人[にん]ほどになった。"
  2: "彼らは主[しゅ]に、すべての人[ひと]に踏[ふ]みにじられている民[たみ]に目[め]を留[と]め、悪[あく]ある人[ひと]々[びと]に汚[けが]された神殿[しんでん]をあわれみ、"
  3: "滅[ほろ]ぼされ、地[ち]と同[おな]じになろうとしている都[みやこ]をあわれみ、自分[じぶん]に向[む]かって叫[さけ]ぶ血[ち]の声[こえ]を聞[き]き入[い]れ、"
  4: "罪[つみ]なき幼[おさな]い者[もの]たちの不法[ふほう]な滅[ほろ]びと、御名[みな]に対してなされた冒瀆[ぼうとく]を思[おも]い起[おこ]し、悪[あく]を憎[にく]んでくださるようにと願[ねが]った。"
  5: "マッカバイオスは一団[いちだん]を率[ひき]いる者[もの]となると、もはや異邦人[いほうじん]にとって手[て]のつけられない者[もの]となった。主[しゅ]の怒[いか]りが憐[あわ]れみに変[か]わったからである。"
  6: "彼[かれ]は思[おも]いがけないときに町[まち]や村[むら]を襲[おそ]って焼[や]き払[はら]い、好都合[こうつごう]な場所[ばしょ]を占領[せんりょう]して、少[すこ]しならぬ敵[てき]を敗走[はいそう]させた。"
  7: "夜[よる]を、そうした襲撃[しゅうげき]の格好[かっこう]の味方[みかた]としたのである。そして、彼[かれ]の勇気[ゆうき]のうわさはあらゆる所[ところ]に広[ひろ]まった。"
  8: "フィリッポスは、この人[ひと]がしだいに力[ちから]を得[え]、ますます成功[せいこう]を重[かさ]ねているのを見[み]て、ケレ・シリアとフェニキアの将軍[しょうぐん]プトレマイオスに、王[おう]の事[こと]を助[たす]けるようにと書[しょ]き送[おく]った。"
  9: "彼[かれ]はすぐに、第一[だいいち]の友人[ゆうじん]の一人[ひとり]であるパトロクロスの子[こ]ニカノルを選[えら]び、あらゆる民[たみ]から集[あつ]めた二万[にまん]人[にん]を下[くだ]らない軍[ぐん]を従[したが]わせて遣[つか]わし、ユダヤの種族[しゅぞく]をことごとく根絶[こんぜつ]するように命[めい]じた。また、戦[いくさ]の事[こと]に経験[けいけん]のある将軍[しょうぐん]ゴルギアスを、彼[かれ]に付[つ]け加[くわ]えた。"
  10: "ニカノルは、王[おう]がローマ人[じん]に払[はら]うべき二千[にせん]タラントの税[ぜい]を、ユダヤ人[じん]の捕虜[ほりょ]の売却[ばいきゃく]で満[み]たそうと決[き]めた。"
  11: "そしてすぐに、海辺[うみべ]の町[まち]々[まち]へ、ユダヤ人[じん]の体[からだ]を買[か]い取[と]るようにと触[ふ]れを出[だ]し、一[ひと]タラントにつき九十[きゅうじゅう]の体[からだ]を渡[わた]すと約束[やくそく]した。自分[じぶん]の上[うえ]に全能[ぜんのう]者の裁[さば]きが迫[せま]っていることには、まったく気[き]づかなかった。"
  12: "ユダのもとには、ニカノルの進撃[しんげき]の知[し]らせが届[とど]いた。彼[かれ]がともにいる者[もの]たちに軍[ぐん]の到来[とうらい]を告[つ]げると、"
  13: "臆病[おくびょう]な者[もの]たちや、神[かみ]の裁[さば]きを信[しん]じない者[もの]たちは逃[に]げ出[だ]し、自分[じぶん]の場所[ばしょ]を離[はな]れた。"
  14: "ほかの者[もの]たちは、残[のこ]っているものをすべて売[う]り払[はら]い、ともに主[しゅ]に、悪[あく]しき者ニカノルによって売[う]られる前[まえ]に、と願[ねが]った。"
  15: "たとえ彼らのゆえでなくとも、父[ちち]たちとの契約[けいやく]のゆえに、また、彼らの上[うえ]に唱[とな]えられた主[しゅ]の尊[とうと]く大[おお]いなる御名[みな]のゆえに、そうしてくださるようにと。"
  16: "マッカバイオスは、自分[じぶん]の周[まわ]りにいる者[もの]たち六千[ろくせん]人[にん]を集[あつ]め、敵[てき]を恐[おそ]れず、不法[ふほう]に迫[せま]って来[く]る異邦人[いほうじん]の大群[たいぐん]をも恐[おそ]れず、雄々[おお]しく戦[たたか]うように勧[すす]めた。"
  17: "彼らは、異邦人[いほうじん]が聖[せい]なる場所[ばしょ]に不法[ふほう]にもたらした侮辱[ぶじょく]、辱[はずかし]められた都[みやこ]の苦[くる]しみ、さらに父祖[ふそ]たちの暮[く]らしの制度[せいど]が打[う]ち壊[こわ]されたことを、目の前[まえ]のこととして見[み]るべきであった。"
  18: "彼[かれ]は言[い]った。「彼らは武器[ぶき]と勇[いさ]みに頼[たよ]っている。しかし、わたしたちは全能[ぜんのう]の神[かみ]に頼[たよ]っている。神[かみ]はひとつのうなずきで、わたしたちに迫[せま]る者[もの]たちも、全世界[ぜんせかい]も倒[たお]すことができる。」"
  19: "また、彼[かれ]は彼らに、昔[むかし]の先祖[せんぞ]たちのときにあった救[すく]いを語[かた]って聞[き]かせた。すなわち、センナヘリブのとき、十八万五千[じゅうはちまんごせん]の者[もの]がどう滅[ほろ]びたか、"
  20: "また、バビロニアでガラテヤ人[じん]との間[あいだ]に戦[いくさ]があったとき、すべての者[もの]が戦[いくさ]に出[で]て行[い]ったのは八千人[はっせんにん]で、マケドニア人[じん]四千[よんせん]人[にん]とともにあったこと、マケドニア人[じん]が窮地[きゅうち]に陥[おちい]ったとき、この八千[はっせん]人[にん]が十二万[じゅうにまん]の者[もの]を滅[ほろ]ぼし、天[てん]から与[あた]えられた助[たす]けによって甚大[じんだい]な利[り]を得[え]たことを。"
  21: "こうした話[はなし]で彼らを勇[いさ]ませ、律法[りっぽう]と父[ちち]の国[くに]のために死[し]ぬ覚悟[かくご]をさせたうえで、彼[かれ]は軍[ぐん]を四つに分[わ]けた。"
  22: "そして、自分[じぶん]の兄弟[きょうだい]たちをそれぞれの隊[たい]の先頭[せんとう]に立[た]てた。すなわち、シモン、ヨセフ、ヨナタンであり、それぞれに千五百[せんごひゃく]人[にん]を付[つ]けた。"
  23: "さらに、エレアザルには聖[せい]なる書[しょ]を読[よ]ませ、神[かみ]の助[たす]けのしるしを与[あた]えた。彼[かれ]自身[じしん]は第一[だいいち]の隊[たい]を率[ひき]いて、ニカノルと戦[たたか]った。"
  24: "全能[ぜんのう]の神[かみ]が彼らの味方[みかた]となったので、彼らは敵[てき]の九千[きゅうせん]人[にん]あまりを殺[ころ]し、ニカノルの軍[ぐん]の大[だい]半[はん]を傷[きず]つき、手足[てあし]を失[うしな]った者[もの]とした。そして、すべての者[もの]を逃[に]げ散[ち]らせた。"
  25: "また、彼らを買[か]おうとして来[き]ていた者[もの]たちの金[かね]を奪[うば]い取[と]った。かなりの距離[きょり]まで追[お]いかけたが、時[とき]の制約[せいやく]を受[う]けて引[ひ]き返[かえ]した。"
  26: "その日[ひ]は安息日[あんそくび]の前[まえ]の日[ひ]であった。それゆえ、彼らを追[お]うことを長[なが]く続[つづ]けなかったのである。"
  27: "彼らは敵[てき]の武器[ぶき]を集[あつ]め、武具[ぶぐ]をはぎ取[と]ってから安息日[あんそくび]を過[す]ごし、この日[ひ]彼らを救[すく]い、憐[あわ]れみの始[はじ]めを彼らのために定[さだ]められた主[しゅ]を、限[かぎ]りなくほめたたえ、告白[こくはく]した。"
  28: "安息日[あんそくび]の後[のち]、彼らは分[ぶん]け前[まえ]から傷[きず]ついた者[もの]たち、やもめ、孤児[こじ]に分[わ]け与[あた]え、残[のこ]りは自分[じぶん]たちと子[こ]どもたちとで分[わ]けた。"
  29: "こうして事[こと]を成[な]し遂[と]げ、共[とも]に祈[いの]りをささげてから、彼らは憐[あわ]れみ深[ふか]い主[しゅ]に、ご自分[じぶん]の僕[しもべ]たちとついに和[やわ]らんでくださるようにと願[ねが]った。"
  30: "また、ティモテオスとバッキデスの一味[いちみ]と戦[いくさ]になり、彼らの二万[にまん]人[にん]あまりを殺[ころ]し、高[たか]い砦[とりで]をいくつも手[て]に入[い]れ、多[おお]くの戦利品[せんりひん]を分[わ]けた。それらは自分[じぶん]たちと、傷[きず]ついた者[もの]たち、孤児[こじ]、やもめ、さらに長老[ちょうろう]たちにも均等[きんとう]に分[わ]け与[あた]えられた。"
  31: "彼らは敵[てき]の武器[ぶき]を入[い]念[ねん]に集[あつ]めてすっかりまとめ、好都合[こうつごう]な場所[ばしょ]に置[お]き、残[のこ]りの戦利品[せんりひん]はエルサレムへ運[はこ]んだ。"
  32: "また、ティモテオスの部下[ぶか]の族長[ぞくちょう]を殺[ころ]した。彼はきわめて不敬[ふけい]な男[おとこ]で、ユダヤ人[じん]に多[おお]くの苦[くる]しみを与[あた]えていた。"
  33: "そして、父[ちち]の国[くに]で勝利[しょうり]の祝[いわ]いをしているとき、聖[せい]なる門[もん]を焼[や]いた者[もの]たちとカリストスを、一[ひと]つの家[いえ]に逃[に]げ込[こ]んだところで焼[や]き、彼[かれ]は不敬[ふけい]にふさわしい報[むく]いを受[う]けた。"
  34: "また、あの三度[さんど]も忌[い]まわしいニカノルは、ユダヤ人[じん]を売[う]るために千人[せんにん]の商人[しょうにん]を連[つ]れて来[き]たが、"
  35: "自分[じぶん]が取[と]るに足[た]りないと見[み]なしていた者[もの]たちに、主[しゅ]の助[たす]けによって辱[はずかし]められた。彼[かれ]は輝[かがや]かしい衣[ころも]を脱[ぬ]ぎ捨[す]て、逃亡者[とうぼうしゃ]のように内陸[ないりく]を独[ひと]りで通[とお]り、アンティオキアへ着[つ]いたが、軍[ぐん]の滅亡[めつぼう]のゆえに、すっかり失敗[しっぱい]した者[もの]となっていた。"
  36: "そして、ローマ人[じん]に、エルサレムの捕虜[ほりょ]から税[ぜい]を納[おさ]めようと引[ひ]き受[う]けた者[もの]が、ユダヤ人[じん]には守[まも]り手[て]があること、それゆえユダヤ人[じん]は神[かみ]が定[さだ]められた律法[りっぽう]に従[したが]っているために傷[きず]つけられないのだと、告[つ]げ知[し]らせたのである。"

notes:
  1: "παρεισπορευόμενοι λεληθότως εἰς τὰς κώμας — «тайно входя в селения» (παρεισπορεύομαι); προσεκαλοῦντο τοὺς συγγενεῖς — «созывали родных»; τοὺς μεμενηκότας ἐν τῷ Ιουδαισμῷ προσλαμβανόμενοι — «принимая оставшихся в иудействе»; εἰς ἑξακισχιλίους — «до шести тысяч»."
  2: "ἐπεκαλοῦντο τὸν κύριον ἐπιδεῖν — «призывали Господа призреть»; τὸν ὑπὸ πάντων καταπατούμενον λαόν — «народ, всеми попираемый»; οἰκτῖραι — «пожалеть» (οἰκτίρω); τὸν ναὸν τὸν ὑπὸ τῶν ἀσεβῶν… βεβηλωθέντα — «храм, нечестивыми осквернённый»."
  3: "τὴν καταφθειρομένην πόλιν — «разрушаемый город»; μέλλουσαν ἰσόπεδον γίνεσθαι — «готовый сравняться с землёй» (ἰσόπεδος); τῶν καταβοώντων πρὸς αὐτὸν αἱμάτων εἰσακοῦσαι — «услышать вопиющую к Нему кровь» (καταβοάω)."
  4: "τῆς τῶν ἀναμαρτήτων νηπίων παρανόμου ἀπωλείας — «беззаконной погибели безгрешных младенцев»; τῶν γενομένων εἰς τὸ ὄνομα αὐτοῦ βλασφημιῶν — «бывших на имя Его хулений»; μισοπονηρῆσαι — «возненавидеть зло» (μισοπονηρέω)."
  5: "ἐν συστέματι — «в отряде (сомкнутом строю)» (σύστεμα); ἀνυπόστατος — «неодолимый»; τῆς ὀργῆς τοῦ κυρίου εἰς ἔλεον τραπείσης — «когда гнев Господень обратился в милость»."
  6: "ἀπροσδοκήτως ἐρχόμενος ἐνεπίμπρα — «приходя неожиданно, сжигал» (ἐμπίπρημι); τοὺς ἐπικαίρους τόπους ἀπολαμβάνων — «занимая удобные места» (ἐπίκαιρος); οὐκ ὀλίγους τῶν πολεμίων τροπούμενος — «немало врагов обращая в бегство» (τροπόω)."
  7: "τὰς νύκτας… συνεργοὺς ἐλάμβανεν — «ночи брал в сотрудницы»; λαλιὰ τῆς εὐανδρίας αὐτοῦ διηχεῖτο πανταχῆ — «молва о его мужестве разносилась повсюду» (εὐανδρία)."
  8: "κατὰ μικρὸν εἰς προκοπὴν ἐρχόμενον — «мало-помалу приходящего в преуспеяние» (προκοπή); πυκνότερον… ἐν ταῖς εὐημερίαις προβαίνοντα — «чаще преуспевающего в удачах»; ἐπιβοηθεῖν τοῖς τοῦ βασιλέως πράγμασιν — «помогать делам царя»."
  9: "Νικάνορα τὸν τοῦ Πατρόκλου τῶν πρώτων φίλων — «Никанора, сына Патрокла, из первых друзей» (ニカノル, パトロクロス); ὑποτάξας παμφύλων ἔθνη — «подчинив народы из всех племён» (πάμφυλος — из всех племён); τὸ σύμπαν τῆς Ιουδαίας ἐξᾶραι γένος — «весь род Иудеи истребить»; Γοργίαν ἄνδρα στρατηγόν — «Горгия, мужа-военачальника» (ゴルギアス)."
  10: "διεστήσατο — «постановил» (διαστέλλομαι); τὸν φόρον… ὄντα ταλάντων δισχιλίων — «дань в две тысячи талантов»; ἐκ τῆς τῶν Ιουδαίων αἰχμαλωσίας ἐκπληρώσειν — «из плена иудейского пополнить»."
  11: "εἰς τὰς παραθαλασσίους πόλεις — «в приморские города»; προκαλούμενος ἐπ᾽ ἀγορασμὸν Ιουδαίων σωμάτων — «призывая на покупку иудейских тел»; ἐνενήκοντα σώματα ταλάντου παραχωρήσειν — «девяносто тел за талант уступить»; οὐ προσδεχόμενος τὴν… δίκην — «не ожидая суда»."
  12: "προσέπεσεν… περὶ τῆς τοῦ Νικάνορος ἐφόδου — «пришло известие о нашествии Никанора» (ἔφοδος); μεταδόντος τοῖς σὺν αὐτῷ — «когда он сообщил бывшим с ним»; τὴν παρουσίαν τοῦ στρατοπέδου — «прибытие войска»."
  13: "οἱ δειλανδροῦντες — «малодушные» (δειλανδρέω); ἀπιστοῦντες τὴν τοῦ θεοῦ δίκην — «не верящие Божию суду»; διεδίδρασκον ἑαυτοὺς καὶ ἐξετόπιζον — «убегали и уходили с места» (ἐκτοπίζω)."
  14: "τὰ περιλελειμμένα πάντα ἐπώλουν — «всё оставшееся продавали»; ῥύσασθαι — «избавить» (ῥύομαι); πρὶν συντυχεῖν πεπραμένους — «прежде чем встретиться проданными»."
  15: "εἰ μὴ δι᾽ αὐτούς, ἀλλὰ διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας — «если не ради них, то ради заветов с отцами их»; ἕνεκα τῆς ἐπ᾽ αὐτοὺς ἐπικλήσεως — «ради наречения на них» (ἐπίκλησις); τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος — «честного и великолепного имени»."
  16: "ἀριθμὸν ἑξακισχιλίους — «числом шесть тысяч»; μὴ καταπλαγῆναι — «не ужаснуться» (καταπλήσσομαι); τὴν… πολυπλήθειαν — «множество»; ἀγωνίσασθαι γενναίως — «мужественно подвизаться»."
  17: "πρὸ ὀφθαλμῶν λαβόντας — «взяв пред глаза»; τὴν ἀνόμως… ὕβριν — «беззаконное поругание»; τὸν τῆς ἐμπεπαιγμένης πόλεως αἰκισμόν — «мучение поруганного города» (αἰκισμός); τὴν τῆς προγονικῆς πολιτείας κατάλυσιν — «разрушение праотеческого устройства»."
  18: "οἱ μὲν… ὅπλοις πεποίθασιν ἅμα καὶ τόλμαις — «они надеются на оружие и вместе на дерзость» (τόλμα); ἑνὶ νεύματι καταβαλεῖν — «одним мановением низложить» (νεῦμα); речь Иуды в 「…」."
  19: "προσαναλεξάμενος — «перечислив (присоединив)»; τὰς ἐπὶ τῶν προγόνων… ἀντιλήμψεις — «заступления при предках» (ἀντίλημψις); τὴν ἐπὶ Σενναχηριμ — «бывшее при Сеннахириме» (センナヘリブ); ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες — «сто восемьдесят пять тысяч»."
  20: "τὴν ἐν τῇ Βαβυλωνίᾳ τὴν πρὸς τοὺς Γαλάτας παράταξιν — «сражение в Вавилонии против галатов» (παράταξις); ὀκτακισχίλιοι σὺν Μακεδόσιν τετρακισχιλίοις — «восемь тысяч с четырьмя тысячами македонян»; τὰς δώδεκα μυριάδας — «сто двадцать тысяч» (двенадцать мириад); ἀπ᾽ οὐρανοῦ βοήθειαν — «с неба помощь»."
  21: "εὐθαρσεῖς αὐτοὺς παραστήσας — «сделав их мужественными» (εὔθαρσυς); τετραμερές τι τὸ στράτευμα ἐποίησεν — «разделил войско на четыре части» (τετραμερής)."
  22: "τάξας… τοὺς ἀδελφοὺς αὐτοῦ προηγουμένους ἑκατέρας τάξεως — «поставив братьев своих предводителями каждой части»; ὑποτάξας ἑκάστῳ χιλίους πρὸς τοῖς πεντακοσίοις — «подчинив каждому тысячу пятьсот»."
  23: "παραναγνοὺς τὴν ἱερὰν βίβλον — «прочитав вслух священную книгу» (παραναγινώσκω); δοὺς σύνθημα θεοῦ βοηθείας — «дав знамение (пароль) Божией помощи» (σύνθημα); τῆς πρώτης σπείρας αὐτὸς προηγούμενος — «сам предводительствуя первой когортой» (σπεῖρα)."
  24: "τοῦ παντοκράτορος συμμάχου — «при Вседержителе союзнике»; ὑπὲρ τοὺς ἐνακισχιλίους — «более девяти тысяч»; τραυματίας… καὶ τοῖς μέλεσιν ἀναπείρους — «ранеными и лишёнными членов» (ἀνάπειρος); φυγεῖν ἠνάγκασαν — «в бегство принудили»."
  25: "τὰ χρήματα τῶν παραγεγονότων ἐπὶ τὸν ἀγορασμόν — «деньги пришедших на покупку»; συνδιώξαντες… ἐφ᾽ ἱκανόν — «преследовав немалое расстояние»; ὑπὸ τῆς ὥρας συγκλειόμενοι — «временем будучи стеснены» (συγκλείω)."
  26: "τὸ πρὸ τοῦ σαββάτου — «день перед субботой» (παρασκευή); οὐκ ἐμακροτόνησαν κατατρέχοντες — «не продолжали долго гнаться» (μακροτονέω)."
  27: "ὁπλολογήσαντες — «собрав (сняв) оружие» (ὁπλολογέω); τὰ σκῦλα ἐκδύσαντες — «сняв доспехи» (σκῦλον); περισσῶς εὐλογοῦντες — «чрезмерно благословляя»; ἀρχὴν ἐλέους τάξαντος αὐτοῖς — «положившего им начало милости»."
  28: "τοῖς ᾐκισμένοις καὶ ταῖς χήραις καὶ ὀρφανοῖς — «изувеченным, вдовам и сиротам» (αἰκίζομαι); τὰ λοιπὰ αὐτοὶ καὶ τὰ παιδία διεμερίσαντο — «остальное сами и дети разделили»."
  29: "κοινὴν ἱκετείαν ποιησάμενοι — «совершив общее моление»; εἰς τέλος καταλλαγῆναι — «до конца примириться»."
  30: "τοῖς περὶ Τιμόθεον καὶ Βακχίδην συνερίααντες — «сойдясь с людьми Тимофея и Вакхида» (συνεράω? — сойтись); ὑπὲρ τοὺς δισμυρίους — «более двадцати тысяч»; ὀχυρωμάτων ὑψηλῶν ἐγκρατεῖς — «овладев высокими крепостями» (ὀχύρωμα); λάφυρα πλείωνα — «большую добычу»; ἰσομοίρους — «равными частями» (ἰσόμοιρος)."
  31: "ὁπλολογήσαντες… ἐπιμελῶς — «собрав оружие тщательно»; εἰς τοὺς ἐπικαίρους τόπους — «в удобные места»; τὰ λοιπὰ τῶν σκύλων — «остальную добычу»."
  32: "τὸν φυλάρχην τῶν περὶ Τιμόθεον — «филарха (племенного князя) из людей Тимофея» (φύλαρχος, 族長[ぞくちょう]); ἀνοσιώτατον ἄνδρα — «нечестивейшего мужа»; ἐπιλελυπηκότα — «досадившего» (ἐπιλυπέω)."
  33: "ἐπινίκια ἄγοντες — «празднуя победные торжества» (ἐπινίκια); τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας — «сжёгших священные ворота» (ἐμπίπρημι); Καλλισθένην — «Каллисфена» (カリストス); ὑφῆψαν — «сожгли» (ὑφάπτω); τὸν ἄξιον τῆς δυσσεβείας ἐκομίσατο μισθόν — «достойную нечестия получил награду»."
  34: "ὁ τρισαλιτήριος — «трижды нечестивый» (τρισαλιτήριος); τοὺς χιλίους ἐμπόρους — «тысячу торговцев»; ἐπὶ τὴν πρᾶσιν τῶν Ιουδαίων — «на продажу иудеев»."
  35: "ταπεινωθεὶς ὑπὸ τῶν… νομιζομένων ἐλαχίστων εἶναι — «унижен теми, кого считали ничтожнейшими»; τὴν δοξικὴν ἀποθέμενος ἐσθῆτα — «сняв славную (парадную) одежду» (δοξικός); δραπέτου τρόπον — «образом беглеца» (δραπέτης); διὰ τῆς μεσογείου — «по внутренней (срединной) земле»; ὑπὲρ ἅπαν εὐημερηκὼς ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ — «крайне злосчастный из-за погибели войска»."
  36: "ὁ τοῖς Ῥωμαίοις ἀναδεξάμενος φόρον — «взявшийся [доставить] римлянам дань»; κατορθώσασθαι — «исполнить»; ὑπέρμαχον ἔχειν τοὺς Ιουδαίους — «иудеи имеют защитника» (ὑπέρμαχος); ἀτρώτους εἶναι — «быть невредимыми» (ἄτρωτος); τοῖς ὑπ᾽ αὐτοῦ προτεταγμένοις νόμοις — «установленным Им законам»."
