# ночные набеги; 8–11 Филипп пишет Птолемею, послан Никанор с Горгием,
# Никанор торгует иудеями; 12–20 страх одних и вера других, речь Иуды о помощи
# Божией (Сеннахирим, Вавилония), деление войска; 21–26 сражение с Никанором,
# более девяти тысяч убито, добыча; 27–29 суббота, доля увечным, вдовам, сиротам;
# 30–33 победа над Тимофеем и Вакхидом, казнь поджигателей; 34–36 посрамление
# Никанора и его свидетельство о защите иудеев.
# Голоса: 8:18 — речь Иуды в 「…」 (закрывается в стихе). Остальное — повествование.
# Имена: ニカノル, ゴルギアス, ティモテオス, バッキデス, パトロクロス, フィリッポス,
# プトレマイオス, アポロニオス, センナヘリブ, ガラテヤ人, マケドニア人, カリストス
# — новое; ユダ, シモン, ヨセフ, ヨナタン, エレアザル, アンティオキア, エルサレム.
# Числа: шесть тысяч, двадцать тысяч, две тысячи талантов, девяносто тел за талант,
# сто восемьдесят пять тысяч, восемь тысяч с четырьмя тысячами, сто двадцать тысяч,
# более девяти тысяч, более двадцати тысяч.
# Термины: 神殿[しんでん], 祭壇[さいだん] (нет), 安息日[あんそくび], 律法[りっぽう],
# 異邦人[いほうじん], 契約[けいやく], 包囲[ほうい] (нет).

