verses:
  1: "「あなたの神[かみ]である主[しゅ]があなたに嗣業[しぎょう]として与[あた]える地[ち]に入[はい]り、それを嗣業として受[う]け継[つ]ぎ、そこに住[す]むようになるとき、"
  2: "あなたの地[ち]の実[み]の初穂[はつほ]を取[と]って籠[かご]に入[い]れ、あなたの神[かみ]である主[しゅ]が御名[みな]を置[お]くために選[えら]ばれる所[ところ]へ行[い]きなさい。"
  3: "その日々[ひび]にいる祭司[さいし]のところへ行[い]き、彼[かれ]に言[い]いなさい。『わたしは今日[きょう]、わたしの神[かみ]である主[しゅ]に告[つ]げます。わたしは、主がわたしたちの父[ちち]たちに誓[ちか]って与[あた]えると約束[やくそく]された地[ち]に入[はい]りました』と。"
  4: "祭司[さいし]はあなたの手[て]から籠[かご]を受[う]け取[と]り、あなたの神[かみ]である主[しゅ]の祭壇[さいだん]の前[まえ]に置[お]く。"
  5: "あなたはあなたの神[かみ]である主[しゅ]の前[まえ]で答[こた]えて言[い]いなさい。『わたしの父[ちち]はシリアを離[はな]れ、エジプトへ下[くだ]って、そこに少[すく]ない人数[にんずう]で寄留[きりゅう]し、そこで大[おお]きな国民[こくみん]、多[おお]くて大きな群[む]れとなった。"
  6: "エジプト人[じん]はわたしたちを虐[しいた]げ、苦[くる]しめ、過酷[かこく]な仕事[しごと]を負[お]わせた。"
  7: "わたしたちがわたしたちの父[ちち]たちの神[かみ]である主[しゅ]に叫[さけ]ぶと、主はわたしたちの声[こえ]を聞[き]き、わたしたちの卑[いや]しめられた姿[すがた]、労苦[ろうく]、圧迫[あっぱく]をご覧[らん]になった。"
  8: "主[しゅ]はご自身[じしん]の大[おお]きな力[ちから]と強[つよ]い手[て]と高[たか]く掲[かか]げられた御腕[みうで]、また大きな現[あらわ]れとしるしと奇跡[きせき]によって、わたしたちをエジプトから導[みちび]き出[だ]された。"
  9: "主はわたしたちをこの場所[ばしょ]に導[みちび]き入[い]れ、この地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地をわたしたちに与[あた]えられた。"
  10: "そして今[いま]、見[み]よ、わたしは、あなたがわたしに与[あた]えてくださった地[ち]の実[み]の初穂[はつほ]、すなわち乳[ちち]と蜜[みつ]の流[なが]れる地の初穂を携[たずさ]えて来[き]ました、主[しゅ]よ。』あなたはそれをあなたの神[かみ]である主の前[まえ]に置[お]き、そこであなたの神である主の前で拝[おが]みなさい。"
  11: "あなたは、あなたの神[かみ]である主[しゅ]があなたとあなたの家[いえ]に与[あた]えたすべての良[よ]いものによって、あなたも、あなたのうちにいるレビ人[びと]も寄留者[きりゅうしゃ]もともに、喜[よろこ]びなさい。"
  12: "あなたが三年目[さんねんめ]に、地[ち]の実[み]の十分[じゅうぶん]の一[いち]をことごとく取り分[わ]け終[お]えたなら、第二[だいに]の十分の一をレビ人[びと]、寄留者[きりゅうしゃ]、孤児[こじ]、寡婦[かふ]に与[あた]えなさい。彼[かれ]らはあなたの町々[まちまち]で食[た]べて満[み]ち足[た]りる。"
  13: "あなたはあなたの神[かみ]である主[しゅ]の前[まえ]で言[い]いなさい。『わたしは聖[せい]なるものをわたしの家[いえ]から取[と]り除[のぞ]き、レビ人[びと]、寄留者[きりゅうしゃ]、孤児[こじ]、寡婦[かふ]に与[あた]えました。あなたがわたしに命[めい]じられたすべての戒[いまし]めに従[したが]ってそうしました。わたしはあなたの戒めを踏[ふ]み越[こ]えず、忘[わす]れもしませんでした。"
  14: "わたしは悲[かな]しみのうちにそれらを食[た]べず、汚[けが]れたもののためにそれらを取り分けず、死[し]んだ者[もの]にそれらを与[あた]えませんでした。わたしはわたしの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]い、あなたがわたしに命[めい]じられたとおりに行[おこな]いました。』"
  15: "『どうか、あなたの聖[せい]なる住[す]まいである天[てん]から見下[みおろ]して、あなたの民[たみ]イスラエルと、あなたが彼[かれ]らに与[あた]えた地[ち]を祝福[しゅくふく]してください。あなたがわたしたちの父[ちち]たちに誓[ちか]って、乳[ちち]と蜜[みつ]の流[なが]れる地をわたしたちに与えると約束[やくそく]されたとおりに。』"
  16: "この日[ひ]、あなたの神[かみ]である主[しゅ]は、これらの定[さだ]めと裁[さば]きをすべて行[おこな]うようあなたに命[めい]じられた。あなたがたは心[こころ]を尽[つ]くし、魂[たましい]を尽くして、それらを守[まも]り行わなければならない。"
  17: "あなたは今日[きょう]、主[しゅ]をあなたの神[かみ]とし、その道[みち]を歩[あゆ]み、その定[さだ]めと裁[さば]きを守[まも]り、その声[こえ]に聞[き]き従[したが]うことを選[えら]んだ。"
  18: "主[しゅ]もまた今日[きょう]、あなたをご自身[じしん]の特別[とくべつ]な民[たみ]とすることを選[えら]ばれた。主があなたに言[い]われたとおりである。あなたは主のすべての戒[いまし]めを守[まも]らなければならない。"
  19: "また主はあなたを、すべての国民[こくみん]の上[うえ]に立[た]たせ、あなたを名高[なだか]く、誉[ほま]れあるもの、栄[えい]えあるものとし、あなたをあなたの神[かみ]である主[しゅ]の聖[せい]なる民[たみ]とされた。主が語[かた]られたとおりである。」"

notes:
  1: "ἐν κλήρῳ — в удел (жребий); κατακληρονομήσῃς — наследуешь, овладеешь (κατακληρονομέω); κατοικήσῃς ἐπ᾽ αὐτῆς — поселишься на ней."
  2: "ἀπαρχή — начатки, первые плоды (в корпусе 初穂); κάρταλλος — плетёная корзина; ἐμβαλεῖς — положишь, бросишь внутрь; ἐπικληθῆναι τὸ ὄνομα αὐτοῦ — букв. «чтобы там было призвано имя Его» (слав. «призывати имя его»); передано идиоматически 御名を置く; ἐκλέξηται — изберёт."
  3: "Ἀναγγέλλω — возвещаю, объявляю (ἀναγγέλλω); ὤμοσεν … δοῦναι — клялся дать; εἰσελήλυθα — вошёл (перфект, «я уже вошёл»). В LXX «Богу моему» (τῷ θεῷ μου), в слав. «Богу твоему» — переведено по греческому."
  4: "λήμψεται — возьмёт; ἀπέναντι τοῦ θυσιαστηρίου — пред жертвенником (ἀπέναντι — напротив, перед лицом)."
  5: "Συρίαν ἀπέβαλεν ὁ πατήρ μου — «Сирию оставил отец мой» (LXX; в масоретском тексте «арамеянин странствующий», отсюда Синодальный); παρῴκησεν — поселился как пришелец (παροικέω); ἐν ἀριθμῷ βραχεῖ — в числе малом; εἰς ἔθνος μέγα — в народ великий."
  6: "ἐκάκωσαν — озлобили, притеснили (κακόω); ἐταπείνωσαν — смирили (ταπεινόω); ἐπέθηκαν … ἔργα σκληρά — возложили работы жестокие (σκληρός — жёсткий, тяжкий)."
  7: "ἀνεβοήσαμεν — возопили (ἀναβοάω); εἰσήκουσεν — услышал; ταπείνωσις — уничижение, угнетение; μόχθος — тяжкий труд; θλιμμός — притеснение (θλίβω)."
  8: "αὐτὸς ἐν ἰσχύι μεγάλῃ — Сам великой крепостью (ἐμφατικόν); χεὶρ κραταιά — рука сильная; βραχίων ὑψηλός — мышца высокая; ὁράματα μεγάλα — великие видения, явления (ὅραμα); σημεῖα καὶ τέρατα — знамения и чудеса."
  9: "εἰσήγαγεν — ввёл; ῥέουσαν γάλα καὶ μέλι — текущую молоком и мёдом (формула; γάλα — молоко, μέλι — мёд); ἔδωκεν ἡμῖν — дал нам."
  10: "ἐνήνοχα — принёс (перфект, «вот, я принёс»); ἀπαρχή — начатки; γῆν ῥέουσαν … — приложение к «земле», в LXX стоит после «которую Ты дал мне, Господи»; ἀφήσεις — оставишь (ἀφίημι); προσκυνήσεις — поклонишься. После исповедания снова идёт наставление (2-е л. ед. ч.)."
  11: "εὐφρανθήσῃ — возвеселишься; ἐν πᾶσιν τοῖς ἀγαθοῖς — о всех благах; τῇ οἰκίᾳ σου — дому твоему; Λευίτης — левит; προσήλυτος ὁ ἐν σοί — пришелец, который у тебя."
  12: "συντελέσῃς ἀποδεκατῶσαι — завершишь отделение десятины (ἀποδεκατόω); ἐπιδέκατον — десятина; τὸ δεύτερον ἐπιδέκατον — вторая десятина (в третий год); ὀρφανός — сирота; χήρα — вдова; ἐμπλησθήσονται — насытятся."
  13: "ἐξεκάθαρα (в базе с разрывом «Ἐξεκ άθαρα»; ἐκκαθαίρω) — очистил, вычистил; ἅγια — святыни; κατὰ πάσας τὰς ἐντολάς — по всем заповедям; οὐ παρῆλθον — не преступил (παρέρχομαι); οὐκ ἐπελαθόμην — не забыл."
  14: "ἐν ὀδύνῃ μου — в печали, скорби моей (ὀδύνη; слав. «в болезни моей»): десятину не ели в трауре; εἰς ἀκάθαρτον — на нечистое употребление; τῷ τεθνηκότι — умершему (жертва мёртвым); ὑπήκουσα — послушал (ὑπακούω); καθὰ ἐνετείλω — как Ты заповедал."
  15: "κάτιδε (καὶ ἐπίδε) — призри, воззри; ἐκ τοῦ οἴκου τοῦ ἁγίου σου ἐκ τοῦ οὐρανοῦ — из святого дома Твоего, с неба; εὐλόγησον — благослови; καθὰ ὤμοσας — как Ты клялся; формула «земля, текущая молоком и мёдом»."
  16: "δικαιώματα — оправдания, уставы (в корпусе 定め); κρίματα — суды (裁き); φυλάξεσθε καὶ ποιήσετε — соблюдите и исполните (повеление во мн. ч.); ἐξ ὅλης τῆς καρδίας … ψυχῆς — от всего сердца и всей души."
  17: "εἵλου — избрал (αἱρέομαι); τὸν θεὸν … εἶναί σου θεόν — Бога быть твоим Богом (в LXX «Бога», в слав. «Господа»); πορεύεσθαι ἐν ταῖς ὁδοῖς — ходить путями; ὑπακούειν τῆς φωνῆς — слушать голоса."
  18: "εἵλατό σε — избрал тебя (αἱρέομαι); λαὸν περιούσιον — народ особый, избранный (περιούσιος; слав. «люди избраннии»); καθάπερ εἶπέν σοι — как Он сказал тебе; φυλάσσειν — хранить (инфинитив цели)."
  19: "ὑπεράνω πάντων τῶν ἐθνῶν — выше всех народов; ὀνομαστόν — именитый; καύχημα — похвала, предмет славы; δόξαστόν — славный; λαὸν ἅγιον — народ святой; καθὼς ἐλάλησεν — как Он говорил."
