# jp-box, Второзаконие, глава 26. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26 продолжает речь Моисея: первины и исповедание при входе в землю (1–11),
# десятина третьего года и молитва десятины (12–15), обязательство хранить
# заповеди и избрание народа (16–19).
# Вся глава — речь Моисея: 「…」 открывается в 1-м стихе и закрывается в конце 19-го.
# Внутри неё исповедание и молитва, которые произносит израильтянин, — 『…』
# (3, 5–10, 13–15). В 10-м стихе исповедание кончается на «Господи», дальше снова
# наставление Моисея (2-е л. ед. ч., как в LXX).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по выгрузке).
# Сносок ⟨…⟩ нет: 初穂, 十分の一, レビ人, 寄留者, 孤児, 寡婦, 嗣業 уже в корпусе.
# LXX-особенности: 26:3 «Богу моему» (τῷ θεῷ μου; в слав. «твоему»); 26:5 «Сирию
# оставил отец мой» (в масоретском тексте «арамеянин странствующий» — отсюда
# Синодальный); 26:12 «вторая десятина»; 26:17 в LXX «Бога избрал» (τὸν θεόν),
# в слав. «Господа избрал». jp-ni не использовался.

