verses:
  1: "律法[りっぽう]と預言者[よげんしゃ]とによって、わたしたちに数多[かずかず]の大[おお]いなるものが、またそれらに続[つづ]いたほかの者[もの]たちによっても与[あた]えられているので、それらのゆえに、イスラエルをその教[おし]えと知恵[ちえ]のゆえにほめたたえるのがふさわしい。また、読[よ]む者[もの]たち自身[じしん]が学識[がくしき]ある者となるべきだけでなく、外[そと]の者[もの]たちにとっても、学[まな]びを愛[あい]する者たちが役[やく]に立[た]つ者となれるように、語[かた]るにせよ書[か]くにせよ、わたしの祖父[そふ]イエスは、さらに深[ふか]く自[みずか]らをささげ、律法[りっぽう]と預言者[よげんしゃ]たちと、ほかの父祖[ふそ]たちの書物[しょもつ]との朗読[ろうどく]へと、またこれらのことにおいて十分[じゅうぶん]な習熟[しゅうじゅく]を得[え]て、教[おし]えと知恵[ちえ]に属[ぞく]することのいくばくかを、自[みずか]らも書き記[しる]すよう促[うなが]され、学[まな]びを愛[あい]する者[もの]たちが、これらのことにも親[した]しんで、さらに、律法[りっぽう]にかなった生[い]き方[かた]によって、いっそう前進[ぜんしん]するためであった。そこで、あなたがたに勧[すす]める。好意[こうい]と注意[ちゅうい]とをもって朗読[ろうどく]をなすように。また、わたしたちが翻訳[ほんやく]において力[ちから]を尽[つ]くしたいくつかの語[ご]について、及[およ]ばないと思[おも]われるところがあっても、寛容[かんよう]であってほしい。というのも、同じ事柄[ことがら]でも、ヘブライ語[ご]で語[かた]られる場合[ばあい]と、別[べつ]の言語[げんご]に移[うつ]される場合とでは、同じ力[ちから]を持[も]つのではないからである。それはこれらのことに限[かぎ]らない。律法[りっぽう]そのものも、預言[よげん]の書[しょ]も、また残[のこ]りの書物[しょもつ]も、元[もと]の言語[げんご]で語られる場合には、少[すこ]しながらぬ違[ちが]いがある。なぜなら、エウエルゲテス王[おう]の治世[ちせい]の第三十八年[だいさんじゅうはちねん]に、わたしはエジプトに渡[わた]り、しばらくそこに滞在[たいざい]して、少[すこ]しながらぬ教[おし]えを受[う]ける機会[きかい]を見[み]いだし、この書[しょ]を翻訳[ほんやく]するために、わたし自身[じしん]も相応[そうおう]の熱意[ねつい]と労苦[ろうく]を注[そそ]ぐことが、きわめて必要[ひつよう]だと考えた。多[おお]くの不眠[ふみん]と知識[ちしき]とを注[そそ]ぎ、その間[あいだ]の時[とき]を費[つい]やして、この書[しょ]を最後[さいご]まで仕上[しあ]げて世[よ]に出[だ]すためであった。また、寄留[きりゅう]の地[ち]で学[まな]びを愛[あい]する者[もの]たちが、その品性[ひんせい]をあらかじめ整[ととの]えて、律法[りっぽう]にかなって生[い]きるためでもあった。<br><br>すべての知恵[ちえ]は主[しゅ]から出[で]て、主とともに永遠[えいえん]にある。"
  2: "海[うみ]の砂[すな]と雨[あめ]の滴[しずく]と、永遠[えいえん]の日々[ひび]とを、だれが数[かぞ]え尽[つ]くすことができるだろうか。"
  3: "天[てん]の高[たか]さと地[ち]の広[ひろ]さと深淵[しんえん]と知恵[ちえ]とを、だれが探[さぐ]り尽[つ]くすことができるだろうか。"
  4: "知恵[ちえ]はすべてのものに先立[さきだ]って造[つく]られ、悟[さと]りの分別[ふんべつ]も永遠[えいえん]からある。"
  5: "知恵[ちえ]の源[みなもと]は、いと高[たか]き所[ところ]にある神[かみ]の言葉[ことば]であり、その流[なが]れ出[で]る道[みち]は永遠[えいえん]の戒[いまし]めである。"
  6: "知恵[ちえ]の根[ね]はだれに明[あ]かされ、その巧妙[こうみょう]なわざをだれが知[し]ったか。"
  7: "賢[かしこ]い者[もの]はひとり、非常[ひじょう]に畏[おそ]るべき方[かた]であり、その王座[おうざ]に座[すわ]しておられる。"
  8: "主[しゅ]ご自身が知恵[ちえ]を造[つく]り、見[み]て、数[かぞ]え、"
  9: "ご自分のすべてのわざの上[うえ]にこれを注[そそ]ぎ出[だ]した。"
  10: "すべての肉[にく]の上[うえ]に、ご自分の与[あた]える分[ぶん]に応[おう]じて。そして、ご自分を愛[あい]する者[もの]たちにこれを豊[ゆた]かに与えた。"
  11: "主[しゅ]を恐[おそ]れることは、栄光[えいこう]であり、誇[ほこ]りであり、喜[よろこ]びであり、歓喜[かんき]の冠[かんむり]である。"
  12: "主[しゅ]を恐[おそ]れることは心[こころ]を喜[よろこ]ばせ、喜びと楽しみと長命[ちょうめい]とを与[あた]える。"
  13: "主[しゅ]を恐[おそ]れる者[もの]には、終[お]わりに良[よ]いことがある。その死[し]の日[ひ]には恵[めぐ]みを見[み]いだす。主を恐れることは主からの賜物[たまもの]であり、愛[あい]の道[みち]に人[ひと]を立[た]たせる。"
  14: "主[しゅ]を愛[あい]することは栄光[えいこう]に満[み]ちた知恵[ちえ]である。知恵は、自分を現[あらわ]される者[もの]たちに、その人[ひと]に知[し]られるために自分を分[わ]け与[あた]える。"
  15: "知恵[ちえ]の始[はじ]まりは主[しゅ]を恐[おそ]れることである。知恵は信仰[しんこう]ある者[もの]たちとともに、母[はは]の胎[たい]のうちで彼らと一緒に造[つく]られた。知恵は人々[ひとびと]の間[あいだ]に永遠[えいえん]の礎[いしずえ]を据[す]え、彼らの子孫[ししそん]にも託[たく]される。"
  16: "知恵[ちえ]の満[み]ち足[た]りは主[しゅ]を恐[おそ]れることである。知恵はその実[み]によって彼らを酔[よ]わせる。"
  17: "知恵[ちえ]は彼らの家[いえ]をすべての願[ねが]いで満[み]たし、蔵[くら]をその産物[さんぶつ]で満たす。"
  18: "知恵[ちえ]の冠[かんむり]は主[しゅ]を恐[おそ]れることであり、平和[へいわ]と癒[いや]しによる健[すこ]やかさとを芽生[めば]えさせる。この二[ふた]つは神[かみ]の賜物[たまもの]であり、主はご自分を愛[あい]する者[もの]たちに喜[よろこ]びを増[ま]し加[くわ]えられる。"
  19: "主[しゅ]は知恵[ちえ]を見[み]、これを数[かぞ]えた。悟[さと]りの知識[ちしき]と理解[りかい]とを雨[あめ]のように降[ふ]らせ、知恵を保[たも]つ者[もの]たちの栄光[えいこう]を高[たか]く挙[あ]げた。"
  20: "知恵[ちえ]の根[ね]は主[しゅ]を恐[おそ]れることであり、その枝[えだ]は長命[ちょうめい]である。"
  21: "主[しゅ]を恐[おそ]れることは罪[つみ]を追[お]い払[はら]う。その恐れのうちにとどまる者[もの]は怒[いか]りを遠[とお]ざける。"
  22: "不正[ふせい]な怒[いか]りが正[ただ]しいとされることはない。その怒りの傾[かたむ]きそのものが、その人[ひと]の転落[てんらく]となるからである。"
  23: "寛[かん]え忍[しの]ぶ者[もの]は時[とき]の来[く]るまでこらえ、後[のち]に喜[よろこ]びがその人[ひと]に返[かえ]ってくる。"
  24: "その人[ひと]は時[とき]が来[く]るまで自分の言葉[ことば]を隠[かく]し、信仰[しんこう]ある者[もの]たちの唇[くちびる]がその悟[さと]りを語[かた]り明[あ]かす。"
  25: "知恵[ちえ]の宝[たから]のうちには知識[ちしき]の格言[かくげん]があり、罪[つみ]ある者[もの]には神[かみ]を敬[うやま]うことが忌[い]まわしい。"
  26: "知恵[ちえ]を望[のぞ]むなら、戒[いまし]めを守[まも]りなさい。そうすれば主[しゅ]が知恵を与[あた]えてくださる。"
  27: "知恵[ちえ]と教[おし]えは主[しゅ]を恐[おそ]れることであり、主の御心[みこころ]は信仰[しんこう]と柔和[にゅうわ]にある。"
  28: "主[しゅ]を恐[おそ]れることに疑[うたが]いを抱[いだ]いてはならない。心[こころ]が二[ふた]つに分[わ]かれたまま、主に近[ちか]づいてはならない。"
  29: "人々[ひとびと]の口[くち]の前[まえ]で偽[いつわ]ってはならない。自分[じぶん]の唇[くちびる]に気をつけなさい。"
  30: "自[みずか]らを高[たか]くしてはならない。倒[たお]れて、自分の魂[たましい]に辱[はずかし]めをもたらすことのないように。主[しゅ]はあなたの隠[かく]しことを明[あき]らかにし、集会[しゅうかい]のただ中[なか]であなたを倒される。あなたが主を恐[おそ]れて近[ちか]づかなかったからであり、あなたの心[こころ]が欺[あざむ]きに満[み]ちていたからである。"

notes:
  1: "1:1 — это не стих главы, а пролог переводчика (в gr-lxx-byz он разбит на 35 строк-стихов 1:1–35: «Πολλῶν καὶ μεγάλων ἡμῖν διὰ τοῦ νόμου…», непрерывная проза) вместе с главой 1:1 (Πᾶσα σοφία παρὰ κυρίου…). Как в csl-pnm, пролог и 1:1 главы стоят в одном стихе и разделены одним абзацным отступом `<br><br>`; других отступов в прологе нет. Слав. 1:1 тоже соединяет пролог с «Всяка премудрость от Господа…». Пролог: Πολλῶν καὶ μεγάλων ἡμῖν… δεδομένων — «многое и великое дано нам…» (gen. abs.); παιδεία — «наставление», σοφία — «премудрость»; ἐπιστήμονας — «сведущими»; τοῖς ἐκτός — «внешним»; φιλομαθεῖς — «любящие учиться»; ἑρμηνεία — «перевод»; ἰσοδυναμεῖ — «имеет равную силу»; Εὐεργέτης — «Благодетель» (Птолемей VIII); παροικία — «пришельничество, рассеяние». Тёмное место пролога: ἀφόμοιον (вм. ожидаемого ἀφορμήν) понято как «нашёл возможность немалого научения». Хвост пролога ἐννόμως βιοτεύειν — «жить по закону» — стоит в конце пролога, перед отступом. Глава 1:1: πᾶσα σοφία παρὰ κυρίου — «всякая премудрость от Господа»; καὶ μετ᾽ αὐτοῦ ἐστιν εἰς τὸν αἰῶνα — «и с Ним пребывает вовек»."
  2: "ἄμμον θαλασσῶν καὶ σταγόνας ὑετοῦ καὶ ἡμέρας αἰῶνος τίς ἐξαριθμήσει; — «песок морей, и капли дождя, и дни века кто исчислит?» (ἄμμος — песок, σταγών — капля, ὑετός — дождь, ἐξαριθμέω — исчислять). Три меры неисчислимого; слав. «Песка морскаго, и капли дождевныя, и дни века кто изочтет?» — совпадает."
  3: "ὕψος οὐρανοῦ καὶ πλάτος γῆς καὶ ἄβυσσον καὶ σοφίαν τίς ἐξιχνιάσει; — «высоту неба, и широту земли, и бездну, и премудрость кто исследует?» (ἐξιχνιάζω — выслеживать, исследовать; ἄβυσσος — бездна). Четыре неизмеримых; порядок и бессоюзие сохранены."
  4: "προτέρα πάντων ἔκτισται σοφία — «прежде всех создана премудрость» (πρότερος — первый, более ранний; κτίζω — создавать); καὶ σύνεσις φρονήσεως ἐξ αἰῶνος — «и разумение разумности от века» (σύνεσις — понимание, φρόνησις — рассудительность; слав. «разум мудрости»). Мысль: премудрость — древнейшее творение."
  5: "Слав. 1:5: πηγὴ σοφίας λόγος θεοῦ ἐν ὑψίστοις, καὶ αἱ διέξοδοι αὐτῆς ἐντολαὶ αἰώνιοι — «источник премудрости — слово Божие в вышних, и исходы её — заповеди вечные» (πηγή — источник, διέξοδος — выход, шествие). Этого стиха нет в gr-lxx-byz (модуль пропускает номер 5); внесён в основной текст без 〔…〕 по паритету — он есть в csl-pnm и csl-ru."
  6: "ῥίζα σοφίας τίνι ἀπεκαλύφθη; καὶ τὰ πανουργεύματα αὐτῆς τίς ἔγνω; — «корень премудрости кому открылся? и ухищрения её кто познал?» (ἀποκαλύπτω — открывать; πανουργεύματα — хитрости, ухищрения, слав. «коварства»; γινώσκω — знать). Риторические вопросы без ответа."
  7: "εἷς ἐστιν σοφός, φοβερὸς σφόδρα, καθήμενος ἐπὶ τοῦ θρόνου αὐτοῦ — «один есть премудрый, весьма страшный, сидящий на престоле своём» (φοβερός — внушающий страх, σφόδρα — весьма). В gr-lxx-byz номер 7 пропущен, и этот текст стоит под номером 8; в слав. 1:7 в конце добавлено «Господь», а в gr κύριος открывает следующий стих, поэтому 主 появляется в начале 8-го. «Премудрый» здесь — о Боге."
  8: "κύριος αὐτὸς ἔκτισεν αὐτὴν καὶ εἶδεν καὶ ἐξηρίθμησεν αὐτήν — «Господь Сам создал её, и увидел, и исчислил её» (ἐξαριθμέω — пересчитывать). В слав. 1:8 «Сам созда ю, и виде, и сочте ю»; κύριος из этого стиха в слав. перенесён в конец 7-го. В gr стих 9 — один; в слав. (и у нас) он разделён на 8-й и 9-й."
  9: "καὶ ἐξέχεεν αὐτὴν ἐπὶ πάντα τὰ ἔργα αὐτοῦ — «и излил её на все дела Свои» (ἐκχέω — выливать, изливать). Слав. «и излия ю на вся дела своя»; продолжение греческого стиха 9, в слав. — отдельный стих 9."
  10: "μετὰ πάσης σαρκὸς κατὰ τὴν δόσιν αὐτοῦ, καὶ ἐχορήγησεν αὐτὴν τοῖς ἀγαπῶσιν αὐτόν — «со всякой плотью по дару Своему, и оделил её любящих Его» (δόσις — дар, даяние; χορηγέω — снабжать, подавать). Слав. «со всякою плотию по даянию своему, и дарова ю любящым его»."
  11: "Φόβος κυρίου δόξα καὶ καύχημα καὶ εὐφροσύνη καὶ στέφανος ἀγαλλιάματος — «страх Господень — слава и похвала, и веселие, и венец радости» (καύχημα — похвала, предмет гордости; ἀγαλλίαμα — ликование). Четыре именных сказуемых без глагола; 主を恐れること — термин брифа."
  12: "φόβος κυρίου τέρψει καρδίαν καὶ δώσει εὐφροσύνην καὶ χαρὰν καὶ μακροημέρευσιν — «страх Господень усладит сердце и даст веселие, и радость, и долгоденствие» (τέρπω — услаждать; μακροημέρευσις — долголетие). Слав. «возвеселит сердце»."
  13: "τῷ φοβουμένῳ τὸν κύριον εὖ ἔσται ἐπ᾽ ἐσχάτων, καὶ ἐν ἡμέρᾳ τελευτῆς αὐτοῦ εὐλογηθήσεται — «боящемуся Господа благо будет в последние [дни], и в день кончины его благословится» (ἐπ᾽ ἐσχάτων — напоследок; τελευτή — кончина). LXX εὐλογηθήσεται — «будет благословлён»; взято слав. «обрящет благодать» → 恵みを見いだす (по паритету; вариант LXX — здесь). Слав. 1:13 добавляет вторую фразу: «страх Господень — дар от Господа и на стезях любления поставляет»; в gr её нет, внесена без 〔…〕."
  14: "Слав. 1:14: «Любление Господа преславная премудрость, и имже является, разделяет себе в ведение его» — «любовь Господа — преславная премудрость, и кому является, разделяет себя в познание его». В gr-lxx-byz этого стиха нет; он есть в csl-pnm и csl-ru и внесён без 〔…〕. Место тёмное: «в ведение его» понято как «чтобы тот познал её»; ru понимает иначе — «кому благоволит, разделяет по Своему усмотрению». Перевод буквальный, при приёмке требует сверки."
  15: "Ἀρχὴ σοφίας φοβεῖσθαι τὸν κύριον — «начало премудрости — бояться Господа»; καὶ μετὰ πιστῶν ἐν μήτρᾳ συνεκτίσθη αὐτοῖς — «и с верными во чреве создана вместе с ними» (συγκτίζω — создавать вместе); μετὰ ἀνθρώπων θεμέλιον αἰῶνος ἐνόσσευσεν — «с людьми основание века угнездила» (νοσσεύω — вить гнездо, слав. «угнезди»); ἐμπιστευθήσεται — «будет вверена» (слав. «уверится»). В gr это стихи 14–15, в слав. — один 15-й."
  16: "πλησμονὴ σοφίας φοβεῖσθαι τὸν κύριον — «полнота премудрости — бояться Господа» (πλησμονή — полнота, изобилие); καὶ μεθύσκει αὐτοὺς ἀπὸ τῶν καρπῶν αὐτῆς — «и упояет их от плодов её» (μεθύσκω — поить допьяна). Слав. «исполнение премудрости… и упоит их от плодов ея»."
  17: "πάντα τὸν οἶκον αὐτῶν ἐμπλήσει ἐπιθυμημάτων — «весь дом их наполнит желаний» (ἐμπίπλημι — наполнять, ἐπιθύμημα — желаемое); καὶ τὰ ἀποδοχεῖα ἀπὸ τῶν γενημάτων αὐτῆς — «и хранилища — от произведений её» (ἀποδοχεῖον — вместилище, слав. «сосуды»; γένημα — произведение, плод). Слав. «от жит ея» — житница."
  18: "στέφανος σοφίας φόβος κυρίου — «венец премудрости — страх Господень»; ἀναθάλλων εἰρήνην καὶ ὑγίειαν ἰάσεως — «процветающий мир и здравие исцеления» (ἀναθάλλω — расцветать, слав. «возцветаяй»; ἴασις — исцеление). Слав. 1:18 добавляет «оба же суть дары Божии, и разширяет веселие любящым его» — в gr нет, внесено без 〔…〕."
  19: "καὶ εἶδεν καὶ ἐξηρίθμησεν αὐτήν — «и увидел, и исчислил её»; ἐπιστήμην καὶ γνῶσιν συνέσεως ἐξώμβρησεν — «знание и ведение разума излил дождём» (ἐξομβρέω — проливать дождём, слав. «одожди»); δόξαν κρατούντων αὐτῆς ἀνύψωσεν — «славу держащих её вознёс». Почти дословный повтор 8–9-го (ἔκτισεν / εἶδεν / ἐξηρίθμησεν) сохранён, как в греческом."
  20: "ῥίζα σοφίας φοβεῖσθαι τὸν κύριον — «корень премудрости — бояться Господа»; οἱ κλάδοι αὐτῆς μακροημέρευσις — «ветви её — долгоденствие» (κλάδος — ветвь). Ср. 1:6 (корень) и 1:12 (долгоденствие); слав. «Корень премудрости еже боятися Господа, и ветви ея долгоденствие»."
  21: "Слав. 1:21: «Страх Господень отреяет грехи: пребываяй же в нем отвращает гнев» — «страх Господень отгоняет грехи, пребывающий же в нём отвращает гнев» (ἀποσοβέω — отгонять; в модуле gr номер 21 пропущен). Стих есть в csl-pnm и csl-ru, внесён без 〔…〕."
  22: "Οὐ δυνήσεται θυμὸς ἄδικος δικαιωθῆναι — «не может гнев неправедный оправдаться» (δικαιόω — оправдывать); ἡ γὰρ ῥοπὴ τοῦ θυμοῦ αὐτοῦ πτῶσις αὐτῷ — «ибо наклон гнева его — падение ему» (ῥοπή — наклон, тяжесть; πτῶσις — падение). Слав. «устремление бо ярости его падение ему»."
  23: "ἕως καιροῦ ἀνθέξεται μακρόθυμος — «до времени выдержит долготерпеливый» (ἀντέχω — держаться, выдерживать; μακρόθυμος — долготерпеливый); ὕστερον αὐτῷ ἀναδώσει εὐφροσύνη — «после же воздаст ему веселие» (ἀναδίδωμι — отдавать назад). Слав. «до времене стерпит долготерпеливый, и последи воздаст ему веселие»."
  24: "ἕως καιροῦ κρύψει τοὺς λόγους αὐτοῦ — «до времени скроет слова свои»; χείλη πολλῶν ἐκδιηγήσεται σύνεσιν αὐτοῦ — «уста многих расскажут разумение его» (ἐκδιηγέομαι — рассказывать подробно). LXX χείλη πολλῶν — «уста многих»; взято слав. «устне верных» → 信仰ある者たちの唇 (по паритету; вариант LXX — здесь)."
  25: "Ἐν θησαυροῖς σοφίας παραβολαὶ ἐπιστήμης — «в сокровищницах премудрости — притчи знания» (θησαυρός — сокровище, παραβολή — притча, изречение); βδέλυγμα δὲ ἁμαρτωλῷ θεοσέβεια — «мерзость же грешнику — благочестие» (βδέλυγμα — мерзость, θεοσέβεια — богопочитание). Слав. «В сокровищих премудрости притча ведения: мерзость же грешнику Богочестие»."
  26: "ἐπιθυμήσας σοφίαν διατήρησον ἐντολάς — «возжелав премудрости, соблюди заповеди» (ἐπιθυμέω — желать, διατηρέω — соблюдать); καὶ κύριος χορηγήσει σοι αὐτήν — «и Господь подаст её тебе» (χορηγέω — снабжать). Слав. «Возжелев премудрости, соблюди заповеди, и Господь подаст ю тебе»."
  27: "σοφία γὰρ καὶ παιδεία φόβος κυρίου — «ибо премудрость и наставление — страх Господень» (παιδεία — наставление, слав. «наказание»); ἡ εὐδοκία αὐτοῦ πίστις καὶ πραότης — «благоволение Его — вера и кротость» (εὐδοκία — благоволение; πραότης — кротость)."
  28: "μὴ ἀπειθῇς φόβῳ κυρίου — «не противься страху Господню» (ἀπειθέω — не повиноваться, противиться); взято слав. «не сумневайся о страсе Господни» → 疑いを抱いてはならない (по паритету; вариант LXX — здесь). καὶ μὴ προσέλθῃς αὐτῷ ἐν καρδίᾳ δισσῇ — «и не приступи к Нему с сердцем двояким» (δισσός — двойной, слав. «раздвоенным»)."
  29: "μὴ ὑποκριθῇς ἐν στόμασιν ἀνθρώπων — «не лицемерь в устах людей» (ὑποκρίνομαι — лицемерить, притворяться); καὶ ἐν τοῖς χείλεσίν σου πρόσεχε — «и устам твоим внимай» (προσέχω — внимать, беречься). Слав. «Не лицемерствуй пред усты человеческими и устнам твоим вонми»."
  30: "μὴ ἐξύψου σεαυτόν — «не возвышай себя»; ἵνα μὴ πέσῃς καὶ ἐπαγάγῃς τῇ ψυχῇ σου ἀτιμίαν — «чтобы не упасть и не навлечь на душу свою бесчестие» (ἐπάγω — наводить, ἀτιμία — бесчестие); ἀποκαλύψει κύριος τὰ κρυπτά σου — «откроет Господь тайное твоё»; ἐν μέσῳ συναγωγῆς καταβαλεῖ σε — «посреди собрания низложит тебя» (καταβάλλω — сбрасывать, низлагать); ὅτι οὐ προσῆλθες φόβῳ κυρίου — «ибо ты не приступил в страхе Господнем»; ἡ καρδία σου πλήρης δόλου — «сердце твоё полно лукавства» (δόλος — коварство)."
