# jp-box, Сирах, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-pnm / csl-ru)
# по паритету (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
#
# СТРУКТУРА: 30 стихов по церковному образцу (csl-pnm; ср. ru/csl-pnm/prsir/1),
# а не 36 по модулю gr-lxx-byz. Дефект модуля: в gr-lxx-byz 1:1–35 — пролог
# переводчика («Πολλῶν καὶ μεγάλων ἡμῖν διὰ τοῦ νόμου…», непрерывная проза,
# разбитая на 35 строк), а вся глава 1 стоит в 1:36 со встроенными номерами
# 1, 2, 3, 4, 6, 8 … 30 (5, 7, 21 в модуле пропущены). Как в csl-pnm, пролог
# и глава 1:1 стоят в одном стихе 1:1 и разделены одним абзацным отступом
# `<br><br>`; глава 1:2–30 — в стихах 2–30. Слав. (csl-pnm / csl-ru) отдельной
# нумерации пролога не даёт: в csl-pnm он входит в 1:1 вместе с «Всяка
# премудрость от Господа…».
# Слав. чтения, которых нет в gr-lxx-byz (1:5, 13b, 14, 18b, 21), внесены в
# текст без 〔…〕 по паритету; расхождения csl/LXX отмечены в notes.
# Прямой речи в прологе и главе 1 нет: кавычек нет. Красного и синего нет.
# Нумерация: 30 стихов (церковная); в notes указаны греческие номера при
# расхождении с модулем.
# 〔…〕 нет; сносок ⟨…⟩ нет: 知恵, 主を恐れること, 律法, 罪, 賜物 уже в корпусе.
# Имена — транслитерация греческого (LXX).

