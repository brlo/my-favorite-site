verses:
  1: "ヒゼキヤの治世[ちせい]の第十四年[だいじゅうよねん]、アッシリアの王[おう]センナケリブが上[のぼ]って来[き]て、ユダヤの堅固[けんご]な町[まち]々[まち]を攻[せ]め、これを取[と]った。"
  2: "アッシリアの王[おう]は、ラキシュからエルサレムへ、ヒゼキヤ王[おう]のもとへ、大[おお]きな軍勢[ぐんぜい]とともにラブシャケを遣[つか]わした。彼[かれ]は上[うえ]の池[いけ]の水道[すいどう]のそば、布[ぬの]さらしの野[の]へ行[ゆ]く道[みち]に立[た]った。"
  3: "彼[かれ]のもとへ、家令[かれい]エリアキム、書記[しょき]ソムナス、記録官[きろくかん]ヨアハが出[で]て来[き]た。エリアキムはヒルキヤの子[こ]、ヨアハはアサフの子[こ]である。"
  4: "ラブシャケは彼[かれ]らに言[い]った。「ヒゼキヤにこう言[い]いなさい。『大[おお]きな王[おう]、アッシリアの王[おう]がこう言[い]う。あなたは何[なに]を頼[たよ]りにしているのか。"
  5: "策[さく]と唇[くちびる]の言葉[ことば]だけで、戦[たたか]いが成[な]り立[た]つのだろうか。今[いま]、あなたは何[なに]を頼[たよ]りにして、わたしに背[そむ]いているのか。"
  6: "見[み]よ、あなたはこの折[お]れた葦[あし]の杖[つえ]、エジプトに頼[たよ]っている。これに寄[よ]りかかる者[もの]は、その手[て]に突[つ]き刺[さ]さり、手[て]を刺[さ]し貫[つらぬ]かれる。エジプトの王[おう]ファラオは、彼[かれ]に頼[たよ]るすべての者[もの]にとって、そのようなものだ。"
  7: "しかし、あなたがたが『わたしたちは主[しゅ]である神[かみ]に頼[たよ]っている』と言[い]うのなら、その方[かた]とは、ヒゼキヤがその高[たか]い所[ところ]と祭壇[さいだん]を取[と]り除[りのぞ]き、ユダとエルサレムに『この祭壇[さいだん]の前[まえ]で礼拝[れいはい]せよ』と命[めい]じた方[かた]ではないのか。"
  8: "さあ、わたしの主人[しゅじん]であるアッシリアの王[おう]と手[て]を組[く]みなさい。わたしはあなたがたに二千[にせん]の馬[うま]を与[あた]えよう。あなたがたはその上[うえ]に乗[の]る者[もの]たちをそろえることができるか。"
  9: "あなたがたはどうして、ただ一人[ひとり]の太守[たいしゅ]の顔[かお]さえ、そむけさせられようか。エジプトに、馬[うま]と騎兵[きへい]を頼[たよ]りにする者[もの]たちは、奴隷[どれい]にすぎない。"
  10: "また今[いま]、わたしが主[しゅ]によらずにこの地[ち]に上[のぼ]って来[き]て、これと戦[たたか]おうとしたのだろうか。主[しゅ]はわたしに「この地[ち]に上[のぼ]って、これを滅[ほろ]ぼせ」と言[い]われたのだ。』」"
  11: "エリアキムとソムナスとヨアハは彼[かれ]に言[い]った。「しもべたちにはアラム語[ご]で話[はな]してください。わたしたちには分[わ]かりますから。わたしたちにユダの言葉[ことば]で話[はな]さないでください。なぜ、城壁[じょうへき]の上[うえ]にいる人[ひと]々[びと]の耳[みみ]に話[はな]すのですか。」"
  12: "ラブシャケは彼[かれ]らに言[い]った。「わたしの主人[しゅじん]は、これらの言葉[ことば]をあなたがたの主人[しゅじん]やあなたがたに語[かた]らせるために、わたしを遣[つか]わしたのだろうか。むしろ、城壁[じょうへき]の上[うえ]に座[すわ]っている者[もの]たちに、あなたがたと一緒[いっしょ]に自分[じぶん]の糞[ふん]を食[た]べ、自分[じぶん]の尿[にょう]を飲[の]ませるためではないか。」"
  13: "ラブシャケは立[た]ち、ユダの言葉[ことば]で大[おお]きな声[こえ]をあげて言[い]った。「大[おお]きな王[おう]、アッシリアの王[おう]の言葉[ことば]を聞[き]け。"
  14: "『王[おう]がこう言[い]う。ヒゼキヤに言葉[ことば]でだまされてはならない。彼[かれ]はあなたがたを救[すく]い出[だ]すことはできない。"
  15: "また、ヒゼキヤがあなたがたに「神[かみ]があなたがたを救[すく]い出[だ]し、この町[まち]はアッシリアの王[おう]の手[て]に渡[わた]されることはない」と言[い]ってはならない。"
  16: "ヒゼキヤの言[い]うことを聞[き]いてはならない。アッシリアの王[おう]がこう言[い]う。あなたがたが祝福[しゅくふく]されたいと願[ねが]うなら、わたしのもとへ出[で]て来[き]なさい。そうすれば、おのおの自分[じぶん]のぶどうの木[き]のもの[もの]と、自分[じぶん]のいちじくの木[き]のもの[もの]を食[た]べ、自分[じぶん]の井戸[いど]の水[みず]を飲[の]むことができる。"
  17: "わたしが来[き]て、あなたがたを、あなたがたの地[ち]のような地[ち]、すなわち麦[むぎ]とぶどう酒[しゅ]とパンとぶどう畑[ばたけ]の地[ち]へ連[つ]れて行[い]くまで。"
  18: "ヒゼキヤにだまされてはならない。彼[かれ]は「あなたがたの神[かみ]があなたがたを救[すく]い出[だ]す」と言[い]っている。国[くに]々[ぐに]の神[かみ]々[がみ]は、それぞれ自分[じぶん]の地[ち]をアッシリアの王[おう]の手[て]から救[すく]い出[だ]したことがあるか。"
  19: "ハマトの神[かみ]、アルパドの神[かみ]はどこにいるのか。セプファリムの町[まち]の神[かみ]はどこにいるのか。彼[かれ]らはサマリアをわたしの手[て]から救[すく]い出[だ]すことができたか。"
  20: "これらの国[くに]々[ぐに]のすべての神[かみ]々[がみ]のうち、だれがその地[ち]をわたしの手[て]から救[すく]い出[だ]したというのか。エルサレムの神[かみ]がどうして、わたしの手[て]からエルサレムを救[すく]い出[だ]せるというのか。』」"
  21: "しかし、彼[かれ]らは黙[だま]り込[こ]み、だれも彼[かれ]にひと言[こと]も答[こた]えなかった。王[おう]が、だれも彼[かれ]に答[こた]えてはならないと命[めい]じていたからである。"
  22: "家令[かれい]エリアキム、軍[ぐん]の書記官[しょきかん]ソムナス、記録官[きろくかん]ヨアハは、衣[ころも]を裂[さ]いたままヒゼキヤのもとへ入[はい]って行[い]き、ラブシャケの言葉[ことば]を彼[かれ]に告[つ]げた。"

notes:
  1: "τοῦ τεσσαρεσκαιδεκάτου ἔτους βασιλεύοντος Εζεκιου — «в четырнадцатый год царствующего Езекии»: родительный времени, сказуемое — в ст. 2–3. ἀνέβη — «поднялся», т. е. пошёл войной; τὰς πόλεις τῆς Ιουδαίας τὰς ὀχυράς — «города Иудеи укреплённые»; ἔλαβεν αὐτάς — «взял их». У ru добавлено «всех» — по МТ, в LXX и csl его нет."
  2: "ἀπέστειλεν … Ραψακην ἐκ Λαχις εἰς Ιερουσαλημ — «послал Рабсака из Лахиса в Иерусалим» (Λαχις — ラキシュ, Ραψακης — ラブシャケ, как в 4 Цар 19); μετὰ δυνάμεως πολλῆς — «с силою многою». ἐν τῷ ὑδραγωγῷ τῆς κολυμβήθρας τῆς ἄνω — «у водопровода верхней купели»; ἐν τῇ ὁδῷ τοῦ ἀγροῦ τοῦ γναφέως — «на дороге поля валяльщика» (γναφεύς — белильщик, 布さらし)."
  3: "Ελιακιμ ὁ τοῦ Χελκιου ὁ οἰκονόμος — Елиаким, сын Хелкии, домоправитель (家令); Σομνας ὁ γραμματεύς — Сомнас, писец (в 4 Цар 18:18 и у ru — Севна, евр. שֶׁבְנָא; в LXX здесь Σομνας); Ιωαχ ὁ τοῦ Ασαφ ὁ ὑπομνηματογράφος — Иоах, сын Асафа, дееписатель (ὑπομνηματογράφος, 記録官; в 4 Цар 18:18 — Ιωας)."
  4: "Τάδε λέγει ὁ βασιλεὺς ὁ μέγας — «так говорит царь великий»; Τί πεποιθὼς εἶ — «на что ты уповаешь?» (πείθω, перфект). Слова Рабшака — в 「…」, слова ассирийского царя внутри — в 『…』; цитата не закрывается до ст. 10, потому что речь царя непрерывна."
  5: "μὴ ἐν βουλῇ ἢ λόγοις χειλέων παράταξις γίνεται — «разве советом и словами уст бывает сражение?» (παράταξις — построение, битва); ἐπὶ τίνι πέποιθας — «на кого ты понадеялся»; ὅτι ἀπειθεῖς μοι — «что ты не покоряешься мне» (ἀπειθέω)."
  6: "ῥάβδον καλαμίνην τεθλασμένην — «трость камышовую надломленную» (κάλαμος, θλάω); ὃς ἂν ἐπ᾽ αὐτὴν ἐπιστηρισθῇ — «кто ни опрётся на неё» (ἐπιστηρίζω); εἰσελεύσεται εἰς τὴν χεῖρα αὐτοῦ — «войдёт ему в руку». Csl добавляет «и прободет ю» — «и проколет её»; в LXX этого нет, внесено в текст."
  7: "εἰ δὲ λέγετε Ἐπὶ κύριον τὸν θεὸν ἡμῶν πεποίθαμεν — «если же говорите: на Господа Бога нашего мы уповаем». В gr-lxx-byz стих на этом обрывается (дефект модуля); продолжение по csl: «не сей ли есть, егоже разори езекиа высокая и требища его…» (τὰ ὑψηλά — высоты, θυσιαστήρια — жертвенники), внесено в основной текст без 〔…〕. Слова народа — 「…」, повеление Езекии — 『…』."
  8: "μείχθητε τῷ κυρίῳ μου τῷ βασιλεῖ Ἀσσυρίων — «смешайтесь с господином моим, царём Ассирийским» (μίγνυμι), т. е. вступите в соглашение; δισχιλίαν ἵππον — «две тысячи коней»; ἀναβάτας ἐπ᾽ αὐτούς — «всадников на них»."
  9: "ἀποστρέψαι εἰς πρόσωπον τοπάρχου ἑνός — «повернуть вспять лицо одного топарха» (τοπάρχης — областеначальник, 太守); οἰκέται εἰσίν — «они рабы»; οἱ πεποιθότες ἐπ᾽ Αἰγυπτίοις εἰς ἵππον καὶ ἀναβάτην — «уповающие на египтян ради коня и всадника». В 4 Цар 18:24 при топархе добавлено «из малейших рабов господина моего» — в LXX Исаии этого нет."
  10: "μὴ ἄνευ κυρίου ἀνέβημεν — «разве без Господа мы поднялись»; πολεμῆσαι αὐτήν — «воевать против неё». В gr-lxx-byz стих обрывается на вопросе; вторая половина по csl: «Господь рече ко мне: взыди на землю сию и погуби ю», внесена в основной текст. Слова Господа внутри речи царя — 『…』."
  11: "Λάλησον … Συριστί — «говори по-сирийски» (по-арамейски, アラム語); ἀκούομεν γὰρ ἡμεῖς — «ибо мы слышим»; μὴ λάλει … Ιουδαιστί — «не говори с нами по-иудейски» (ユダの言葉); εἰς τὰ ὦτα τῶν ἀνθρώπων — «в уши людей»."
  12: "Μὴ πρὸς τὸν κύριον ὑμῶν ἢ πρὸς ὑμᾶς — «разве к господину вашему или к вам»; κόπρον — помёт (糞); οὖρον — моча (尿); μεθ᾽ ὑμῶν ἅμα — «с вами вместе»."
  13: "ἔστη — «встал»; ἐβόησεν φωνῇ μεγάλῃ Ιουδαιστί — «воззвал громким голосом по-иудейски»; Ἀκούσατε τοὺς λόγους τοῦ μεγάλου βασιλέως — «слушайте слова великого царя». Стих не имеет точки: речь продолжается в 14–20."
  14: "Μὴ ἀπατάτω ὑμᾶς Εζεκιας λόγοις — «пусть не обманывает вас Езекия словами» (ἀπατάω); οἳ οὐ δυνήσονται ῥύσασθαι ὑμᾶς — «которые не смогут избавить вас». Здесь открываются слова ассирийского царя (『…』), они идут до ст. 20."
  15: "μὴ λεγέτω ὑμῖν Εζεκιας — «пусть не говорит вам Езекия»; Ῥύσεται ὑμᾶς ὁ θεός — «избавит вас Бог»; οὐ μὴ παραδοθῇ ἡ πόλις αὕτη — усиленное отрицание: «город этот не будет предан». Слова Езекии — 「…」."
  16: "μὴ ἀκούετε Εζεκιου — «не слушайте Езекию»; Εἰ βούλεσθε εὐλογηθῆναι — «если хотите быть благословенными» (εὐλογέω; формула покорности, ср. 4 Цар 18:31); φάγεσθε ἕκαστος τὴν ἄμπελον αὐτοῦ καὶ τὰς συκᾶς — «ешьте каждый свою лозу и смоковницы»; ὕδωρ τοῦ λάκκου ὑμῶν — «воду из вашего колодца»."
  17: "ἕως ἂν ἔλθω — «доколе не приду» (ἕως ἄν): придаточное времени к обещанию ст. 16, поэтому стих кончается на «まで», без сказуемого; γῆ σίτου καὶ οἴνου καὶ ἄρτων καὶ ἀμπελώνων — «земля пшеницы, вина, хлебов и виноградников». В LXX Исаии нет «маслины и мёда» (в 4 Цар 18:32 они есть); csl тоже без них."
  18: "μὴ ὑμᾶς ἀπατάτω Εζεκιας λέγων — «пусть не обманывает вас Езекия, говоря»; Ὁ θεὸς ὑμῶν ῥύσεται ὑμᾶς — «Бог ваш избавит вас» (слова Езекии — 「…」); μὴ ἐρρύσαντο οἱ θεοὶ τῶν ἐθνῶν — «разве избавили боги народов»."
  19: "ποῦ ἐστιν ὁ θεὸς Αιμαθ καὶ Αρφαθ — «где бог Емафа и Арфада» (Αιμαθ — ハマト, Αρφαθ — アルパド); τῆς πόλεως Σεπφαριμ — «города Сеффарима» (в 4 Цар — Σεπφαρουαιν, セパルワイム); μὴ ἐδύναντο ῥύσασθαι Σαμάρειαν — «разве могли избавить Самарию»."
  20: "τίς τῶν θεῶν πάντων τῶν ἐθνῶν τούτων — «кто из всех богов народов этих»; ἐρρύσατο τὴν γῆν αὐτοῦ — «избавил землю свою»; ὅτι ῥύσεται ὁ θεὸς Ιερουσαλημ — «что избавит Бог Иерусалим». Здесь закрываются слова царя и речь Рабшака."
  21: "ἐσιώπησαν — «умолкли» (σιωπάω); οὐδεὶς ἀπεκρίθη αὐτῷ λόγον — «никто не ответил ему ни слова»; διὰ τὸ προστάξαι τὸν βασιλέα — «потому что царь приказал»."
  22: "εἰσῆλθεν … πρὸς Εζεκιαν — «вошёл к Езекии»; ὁ γραμματεὺς τῆς δυνάμεως — «писец силы», т. е. войсковой писец (в 36:3 просто γραμματεύς); ἐσχισμένοι τοὺς χιτῶνας — «разодрав хитоны»; ἀπήγγειλαν — «возвестили»."
