# jp-box, Исаия, глава 36. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в главах 36–40 отсутствует (в 38 есть только 1–6), поэтому
# сверка структуры — по 4 Цар 18–20; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 36: нашествие Сеннахирима (1), посольство Рабшака к стенам (2–3), речь
# Рабшака со слов ассирийского царя (4–10), просьба послов (11), ответ Рабшака (12),
# возглас к народу и слова царя (13–20), молчание народа (21), донесение Езекии (22).
# Речи: Рабшак — 「…」 (4–10; 12; 13–20); слова ассирийского царя внутри — 『…』
# (4–10; 14–20); слова народа (7), Езекии (15, 18) и Господа (10) внутри них —
# 「…」/『…』 по чередованию уровней. Вводные формулы — вне кавычек.
# Нумерация по gr: 22 стиха; у csl и ru тоже 22, деление совпадает.
# Паритет: в gr-lxx-byz 36:7 и 36:10 оборваны на середине фразы (дефект модуля);
# продолжение взято из csl и внесено в основной текст без 〔…〕, оговорено в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 家令, 書記, 記録官, 粗布, 祭壇, 城壁, 糞, 尿, 宦官 уже
# в корпусе. Имена — транслитерация греческого (LXX); сверены с 4 Цар 18–19.

