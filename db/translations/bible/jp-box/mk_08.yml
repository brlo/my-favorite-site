verses:
  1: "そのころ、また大[おお]ぜいの群衆[ぐんしゅう]が集[あつ]まっていたが、食[た]べる物[もの]がなかった。そこでイエスは弟子[でし]たちを呼[よ]び寄[よ]せて言[い]われた。"
  2: "「<j>わたしはこの群衆[ぐんしゅう]がかわいそうでならない。もう三日[みっか]もわたしのそばにいて、食[た]べる物[もの]がないのだ。</j>"
  3: "<j>飢[う]えたまま家[いえ]へ帰[かえ]らせたら、途中[とちゅう]で倒[たお]れてしまう。遠[とお]くから来[き]た者[もの]もいるのだ。</j>」"
  4: "弟子[でし]たちは答[こた]えた。「こんな人気[ひとけ]のない所[ところ]で、この人[ひと]たちを満腹[まんぷく]にさせるパンを、いったいどこから手[て]に入[い]れるのですか。」"
  5: "イエスはお尋[たず]ねになった。「<j>パンはいくつあるか。</j>」弟子[でし]たちは「七[なな]つです」と答[こた]えた。"
  6: "イエスは群衆[ぐんしゅう]に地面[じめん]に座[すわ]るように命[めい]じた。そして、七[なな]つのパンを取[と]り、感謝[かんしゃ]してから裂[さ]き、弟子[でし]たちに渡[わた]して、群衆[ぐんしゅう]に配[くば]らせた。弟子[でし]たちはそれを群衆[ぐんしゅう]の前[まえ]に置[お]いた。"
  7: "また、小[ちい]さな魚[さかな]が少[すこ]しあったので、イエスはそれも祝福[しゅくふく]して、配[くば]るように言[い]われた。"
  8: "人々[ひとびと]は食[た]べて満腹[まんぷく]し、余[あま]ったパンの屑[くず]を集[あつ]めると、籠[かご]七[なな]つになった。"
  9: "食[た]べた人[ひと]はおよそ四千人[よんせんにん]であった。イエスは彼[かれ]らを帰[かえ]らせた。"
  10: "イエスはすぐに弟子[でし]たちと一緒[いっしょ]に舟[ふね]に乗[の]り、ダルマヌタの地方[ちほう]へ行[い]かれた。"
  11: "ファリサイ派[は]の人々[ひとびと]がやって来[き]て、イエスと論[ろん]じ始[はじ]めた。イエスを試[こころ]みようとして、天[てん]からのしるしを求[もと]めたのである。"
  12: "イエスは心[こころ]の底[そこ]から深[ふか]い息[いき]をつき、言[い]われた。「<j>なぜ、この時代[じだい]の人々[ひとびと]はしるしを求[もと]めるのか。はっきり言[い]っておく。この時代[じだい]にしるしが与[あた]えられることは決[けっ]してない。</j>」"
  13: "そして、彼[かれ]らを離[はな]れて、再[ふたた]び舟[ふね]に乗[の]り、対岸[たいがん]へ行[い]かれた。"
  14: "弟子[でし]たちはパンを持[も]って来[く]るのを忘[わす]れ、舟[ふね]の中[なか]にはパンが一[ひと]つしかなかった。"
  15: "イエスは彼[かれ]らに戒[いまし]めて言[い]われた。「<j>ファリサイ派[は]のパン種[だね]⟨パンをふくらませるために生地[きじ]に加[くわ]える、発酵[はっこう]したもの。⟩とヘロデのパン種[だね]に気[き]をつけなさい。よく注意[ちゅうい]するように。</j>」"
  16: "弟子[でし]たちは、「パンがないからだ」と互[たが]いに論[ろん]じ合[あ]った。"
  17: "イエスはそれと気[き]づいて言[い]われた。「<j>パンがないことで、なぜ論[ろん]じ合[あ]うのか。まだ分[わ]からないのか。まだ悟[さと]らないのか。あなたがたの心[こころ]が頑[かたくな]になっているのか。</j>"
  18: "<j>目[め]があって見[み]えず、耳[みみ]があって聞[き]こえないのか。覚[おぼ]えていないのか。</j>"
  19: "<j>わたしが五[いつ]つのパンを五千人[ごせんにん]のために裂[さ]いたとき、パンの屑[くず]を集[あつ]めて籠[かご]がいくつになったか。</j>」弟子[でし]たちは「十二[じゅうに]です」と答[こた]えた。"
  20: "「<j>七[なな]つのパンを四千人[よんせんにん]のために裂[さ]いたときは、パンの屑[くず]の籠[かご]がいくつになったか。</j>」弟子[でし]たちは「七[なな]つです」と答[こた]えた。"
  21: "イエスは言[い]われた。「<j>まだ悟[さと]らないのか。</j>」"
  22: "一行[いっこう]はベツサイダに着[つ]いた。人々[ひとびと]は盲人[もうじん]をイエスのところへ連[つ]れて来[き]て、触[ふ]れてやってくださいと願[ねが]った。"
  23: "イエスは盲人[もうじん]の手[て]を取[と]って村[むら]の外[そと]へ連[つ]れ出[だ]し、その目[め]に唾[つば]をぬり、手[て]を置[お]いて、「<j>何[なに]か見[み]えるか</j>」とお尋[たず]ねになった。"
  24: "その人[ひと]は目[め]を上[あ]げて言[い]った。「人[ひと]が歩[ある]いているのが見[み]えます。木[き]のように見[み]えます。」"
  25: "そこでイエスは再[ふたた]びその人[ひと]の目[め]に手[て]を置[お]かれた。すると、その人[ひと]は目[め]がよく見[み]えるようになり、何[なに]もかもはっきりと見[み]えるようになった。"
  26: "イエスはその人[ひと]を家[いえ]へ帰[かえ]らせ、「<j>村[むら]には入[はい]らないように。〔村[むら]の人[ひと]にはだれにも話[はな]してはならない。〕</j>」と言[い]われた。"
  27: "イエスは弟子[でし]たちと一緒[いっしょ]に、フィリポ・カイサリアの村々[むらむら]へ出[で]かけた。途中[とちゅう]、イエスは弟子[でし]たちに尋[たず]ねられた。「<j>人々[ひとびと]は、わたしをだれだと言[い]っているか。</j>」"
  28: "弟子[でし]たちは答[こた]えた。「洗礼者[せんれいしゃ]ヨハネだと言[い]う人[ひと]もあれば、エリヤだと言[い]う人[ひと]もあり、また、預言者[よげんしゃ]の一人[ひとり]だと言[い]う人[ひと]もいます。」"
  29: "イエスは彼[かれ]らに尋[たず]ねられた。「<j>では、あなたがたはわたしをだれだと言[い]うのか。</j>」ペトロが答[こた]えて言[い]った。「あなたはキリストです。」"
  30: "イエスは、自分[じぶん]のことをだれにも話[はな]さないようにと、彼[かれ]らを厳[きび]しく戒[いまし]められた。"
  31: "そして、人[ひと]の子[こ]は多[おお]くの苦[くる]しみを受[う]け、長老[ちょうろう]たち、祭司長[さいしちょう]たち、律法学者[りっぽうがくしゃ]たちから拒[こば]まれ、殺[ころ]され、三日[みっか]の後[のち]に復活[ふっかつ]する必要[ひつよう]がある、と教[おし]え始[はじ]められた。"
  32: "イエスはこのことを明[あき]らかに話[はな]された。すると、ペトロはイエスをわきへ引[ひ]っ張[ぱ]って、たしなめ始[はじ]めた。"
  33: "イエスは振[ふ]り向[む]いて弟子[でし]たちをご覧[らん]になり、ペトロをお叱[しか]りになって言[い]われた。「<j>サタン、わたしの後[うし]ろへ退[しりぞ]け。あなたは神[かみ]のことを思[おも]わず、人[ひと]のことを思[おも]っている。</j>」"
  34: "イエスは群衆[ぐんしゅう]を弟子[でし]たちと一緒[いっしょ]に呼[よ]び寄[よ]せて言[い]われた。「<j>だれでも、わたしの後[あと]について来[き]たいと願[ねが]う者[もの]は、自分[じぶん]を捨[す]て、自分[じぶん]の十字架[じゅうじか]を負[お]って、わたしに従[したが]いなさい。</j>"
  35: "<j>自分[じぶん]の命[いのち]を救[すく]おうとする者[もの]は、それを失[うしな]う。〔わたしと〕福音[ふくいん]のために命[いのち]を失[うしな]う者[もの]は、それを救[すく]うのである。</j>"
  36: "<j>人[ひと]が全世界[ぜんせかい]を手[て]に入[い]れても、自分[じぶん]の命[いのち]を失[うしな]ったなら、何[なん]の益[えき]があるだろうか。</j>"
  37: "<j>自分[じぶん]の命[いのち]の代[か]わりに、人[ひと]は何[なに]を差[さ]し出[だ]すことができるだろうか。</j>"
  38: "<j>この姦淫[かんいん]と罪[つみ]に満[み]ちた時代[じだい]にあって、わたしとわたしの言葉[ことば]を恥[は]じる者[もの]を、人[ひと]の子[こ]も、父[ちち]の栄光[えいこう]を帯[お]び、聖[せい]なる天使[てんし]たちとともに来[く]るとき、その者[もの]を恥[は]じるであろう。</j>」"

notes:
  12: "εἰ δοθήσεται — еврейская клятвенная формула «не будет дано»; передал 決してない."
  15: "ζύμη — закваска; パン種, сноска при первом упоминании в книге (ср. Мф 13:33)."
  17: "πεπωρωμένην ἔχετε τὴν καρδίαν — «сердце одебелевшее»; 心は頑くなになっている."
  19: "κοφίνοι — корзины; 籠."
  20: "σπυρίδες — большие корзины; тоже 籠, различие с κοφίνοι (ст. 19) не передаётся."
  26: "В критическом тексте только «не входи в селение»; Церковь добавляет «и никому в селении не говори» — в 〔…〕."
  29: "ὁ Χριστός — キリスト (не メシア), чтобы работал переключатель ハリストス."
  31: "Речь передана косвенно (ὅτι), поэтому не красным; μετὰ τρεῖς ἡμέρας — 三日の後に."
  33: "Ὕπαγε ὀπίσω μου — «иди за мной» / «отойди от меня»; передал わたしの後ろへ退け."
  35: "ἐμοῦ καί в критическом тексте в квадратных скобках; церковное чтение — 〔わたしと〕福音のために."
  38: "μοιχαλίδι — «прелюбодейный»; 姦淫と罪に満ちた時代."
