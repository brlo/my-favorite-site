# jp-box, 3-я Ездры, глава 16. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте книги нет; ru — для понимания.
# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
# Глава 16 — продолжение христианского добавления: горе Вавилону, Асии, Египту
# и Сирии, неотвратимость суда, гонения на боящихся Господа, утешение избранным.
# 1–16 горе и неотвратимость бедствий; 17–19 плач (голос самого Ездры/народа);
# 20–35 бичи для исправления и запустение; 36–53 слово к рабам Господним;
# 54–66 Бог знает дела и обличит; 67–79 суд, гонения, испытание избранных,
# утешение и горе нераскаянным.
# Вавилон в 15–16 — Рим (церковная традиция чтения; ср. Откр 17–18); в тексте
# оставлено バビロン, отождествление — только в notes.
# Голоса: 1–16 — слово Господа в 「…」; 17–19 — плач в 「…」 (не речь Бога);
# 20–79 — снова слово Господа в 「…」, внутри 54 и 56 — вложенные 『…』.
# Слав. «Восхощет бо человек человека видети» (16:28) при ru «трудно будет…» — см. notes.
# Слав. «вдовицы» (16:45) при ru «вдовцы» — см. notes.

