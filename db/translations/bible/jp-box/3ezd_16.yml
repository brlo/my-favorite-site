verses:
  1: "「災[わざわ]いだ、バビロンとアシアよ。災[わざわ]いだ、エジプトとシリアよ。"
  2: "粗布[あらぬの]と毛[け]の衣[ころも]を身[み]に帯[お]びて、あなたがたの息子[むすこ]たちのために泣[な]き、苦[くる]しめ。あなたがたの滅[ほろ]びが近[ちか]づいたからである。"
  3: "あなたがたに剣[つるぎ]が送[おく]られた。だれがそれを退[しりぞ]けることができるか。"
  4: "あなたがたに火[ひ]が送[おく]られた。だれがそれを消[け]すことができるか。"
  5: "あなたがたに災[わざわ]いが送[おく]られた。だれがそれを追[お]い払[はら]うことができるか。"
  6: "飢[う]えた獅子[しし]を森[もり]へ追[お]い返[かえ]せる者[もの]があるか。柴[しば]の中[なか]で燃[も]え始[はじ]めた火[ひ]を、たちまち消[け]せる者[もの]があるか。"
  7: "強[つよ]い弓[ゆみ]の射手[しゃしゅ]が放[はな]った矢[や]を、だれがはね返[かえ]せるか。"
  8: "強[つよ]き主[しゅ]が災[わざわ]いを送[おく]られる。だれがそれを追[お]い払[はら]うことができるか。"
  9: "その怒[いか]りから火[ひ]が出[で]た。だれがそれを消[け]すことができるか。"
  10: "主[しゅ]が稲妻[いなずま]を光[ひか]らせれば、だれが恐[おそ]れないか。雷[かみなり]を鳴[な]らせば、だれが震[ふる]えないか。"
  11: "主[しゅ]がお叱[しか]りになれば、だれがその御前[みまえ]で根[ね]こそぎ砕[くだ]かれないか。"
  12: "地[ち]は震[ふる]え、その基[もと]も震[ふる]えた。海[うみ]は深[ふか]みから波立[なみだ]ち、その波[なみ]は騒[さわ]ぎ、その魚[さかな]も、主[しゅ]の御前[みまえ]とその力[ちから]の栄光[えいこう]のゆえに騒[さわ]ぐ。"
  13: "その右[みぎ]の手[て]は強[つよ]く、弓[ゆみ]を張[は]る。その矢[や]は鋭[するど]く、主から放[はな]たれる矢は、地[ち]の果[は]てに放[はな]たれ始[はじ]めても、尽[つ]きることはない。"
  14: "見[み]よ、災[わざわ]いが送[おく]られ、地[ち]に来[く]るまでは戻[もど]らない。"
  15: "火[ひ]が燃[も]え上[あ]がり、地[ち]の基[もと]を焼[や]き尽[つ]くすまでは消[き]えない。"
  16: "強[つよ]い射手[しゃしゅ]が放[はな]った矢[や]が戻[もど]らないように、地[ち]に送[おく]られる災[わざわ]いも戻[もど]らない。」"
  17: "「ああ、わたしは災[わざわ]いだ、災[わざわ]いだ。その日[ひ]々[び]に、だれがわたしを救[すく]い出[だ]すのか。"
  18: "病[やまい]の始[はじ]まりと多[おお]くの嘆[なげ]き。飢[う]えの始[はじ]まりと多[おお]くの滅[ほろ]び。戦[たたか]いの始[はじ]まりと、権力[けんりょく]への恐[おそ]れ。災[わざわ]いの始[はじ]まりと、すべての者[もの]の震[ふる]え。"
  19: "その時[とき]、災[わざわ]いが来[き]たら、わたしは何[なに]をしようか。」"
  20: "「見[み]よ、飢[う]えと災[わざわ]いと苦[くる]しみと狭[せま]さが、矯正[きょうせい]のための鞭[むち]として送[おく]られた。"
  21: "しかし、これらすべてのことの中[なか]でも、彼らは自分[じぶん]の不法[ふほう]から立[た]ち返[かえ]らず、鞭[むち]打[う]たれたことをいつも覚[おぼ]えているわけでもない。"
  22: "見[み]よ、地[ち]の上[うえ]に何[なに]の値打[ねう]ちもないほどの豊[ゆた]かさが来[く]る。人[ひと]々[びと]は世[よ]が治[おさ]まったと思[おも]うだろう。そのとき、地[ち]の上[うえ]に災[わざわ]いが、剣[つるぎ]と飢[う]えと大[おお]きな混乱[こんらん]が育[そだ]つ。"
  23: "地[ち]に住[す]む多[おお]くの者[もの]が飢[う]えで死[し]に、飢[う]えを免[まぬか]れて残[のこ]った者[もの]たちを剣[つるぎ]が滅[ほろ]ぼすからである。"
  24: "死[し]んだ者[もの]たちは糞[ふん]のように投[な]げ捨[す]てられ、彼らを慰[なぐさ]める者[もの]はいない。地[ち]は荒[あ]れ果[は]て、その町々[まちまち]は壊[こわ]されるからである。"
  25: "地[ち]を耕[たがや]す者[もの]も、そこに種[たね]を蒔[ま]く者[もの]も残[のこ]らない。"
  26: "木[き]々[ぎ]は実[み]を結[むす]ぶが、だれがそれを取[と]り入[い]れるのか。"
  27: "ぶどうの房[ふさ]は熟[じゅく]すが、だれがそれを踏[ふ]むのか。至[いた]るところに大[おお]きな荒廃[こうはい]があるからである。"
  28: "人[ひと]は人[ひと]を見[み]、その声[こえ]を聞[き]くことを望[のぞ]む。"
  29: "町[まち]からは十[じゅう]人[にん]、野[の]からは二[ふた]人[り]が残[のこ]り、彼らは深[ふか]い森[もり]と岩[いわ]の裂[さ]け目[め]に隠[かく]れるからである。"
  30: "オリーブ畑[ばたけ]でも、どの木[き]にも三[みっ]つか四[よっ]つの実[み]が残[のこ]されるように、"
  31: "また、ぶどう畑[ばたけ]でも、念入[ねんい]りにぶどうを摘[つ]み取[と]る者[もの]たちによって房[ふさ]が残[のこ]されるように、"
  32: "その日[ひ]々[び]にも、剣[つるぎ]をもって彼らの家[いえ]を探[さが]し回[まわ]る者[もの]たちのうち、三[さん]人[にん]か四[よ]人[にん]が残[のこ]される。"
  33: "地[ち]は荒[あ]れ果[は]てて残[のこ]され、その畑[はたけ]は古[ふる]び、その道[みち]もすべての小径[こみち]も茨[いばら]で覆[おお]われる。人[ひと]がそこを通[とお]らなくなるからである。"
  34: "婚約者[こんやくしゃ]のいない娘[むすめ]たちは泣[な]き、夫[おっと]のいない女[おんな]たちは泣[な]き、助[たす]けのない娘[むすめ]たちも泣[な]く。"
  35: "彼女[かのじょ]たちの婚約者[こんやくしゃ]は戦[たたか]いで死[し]に、夫[おっと]たちは飢[う]えで滅[ほろ]びる。"
  36: "主[しゅ]の僕[しもべ]たちよ、これを聞[き]き、これを悟[さと]れ。"
  37: "見[み]よ、これは主[しゅ]の言葉[ことば]である。これを受[う]け入[い]れよ。主[しゅ]が語[かた]られたあの神[かみ]々[がみ]を信[しん]じるな。"
  38: "見[み]よ、災[わざわ]いが近[ちか]づき、ためらわない。"
  39: "身[み]ごもりの女[おんな]が九[ここの]か月[げつ]目[め]に子[こ]を産[う]むとき、産[う]みの時[とき]が近[ちか]づくと、二[に]、三[さん]時間[じかん]の前[まえ]から苦[くる]しみがその胎[たい]を捕[と]らえ、子[こ]が胎[たい]から出[で]るときには、少[すこ]しも遅[おく]れない。"
  40: "同じように、災[わざわ]いは地[ち]の上[うえ]に現[あらわ]れるのに遅[おく]れず、この世[よ]は嘆[なげ]き、苦[くる]しみがそれを捕[と]らえる。"
  41: "わたしの民[たみ]よ、この言葉[ことば]を聞[き]け。戦[たたか]いの備[そな]えをせよ。災[わざわ]いの中[なか]では、地[ち]の寄留者[きりゅうしゃ]のようにあれ。"
  42: "売[う]る者[もの]は逃[に]げる者[もの]のように、買[か]う者[もの]は滅[ほろ]びる者[もの]のようにあれ。"
  43: "商[あきな]う者[もの]は利[り]を得[え]ない者[もの]のように、建[た]てる者[もの]はそこに住[す]めない者[もの]のようにあれ。"
  44: "種[たね]を蒔[ま]く者[もの]は刈[か]り取[と]らない者[もの]のように、ぶどうを摘[つ]む者[もの]はそれを集[あつ]めない者[もの]のようにあれ。"
  45: "結婚[けっこん]する者[もの]は子[こ]をもうけない者[もの]のように、結婚[けっこん]しない者[もの]は寡婦[かふ]のようにあれ。"
  46: "それゆえ、労[ろう]する者[もの]はむなしく労[ろう]する。"
  47: "他国[たこく]の者[もの]たちが彼らの実[み]を刈[か]り取り、財産[ざいさん]を奪[うば]い、家[いえ]を壊[こわ]し、息子[むすこ]たちを捕[と]らえるからである。彼らは捕[と]らわれと飢[う]えのうちに子[こ]を産[う]むのだ。"
  48: "また、奪[うば]い取[と]ることによって商[あきな]いをする者[もの]たちは、どれほど長[なが]く町々[まちまち]と自分[じぶん]の家[いえ]、財産[ざいさん]と顔[かお]を飾[かざ]ろうとも、"
  49: "それだけいっそう、わたしは彼らの罪[つみ]のゆえに彼らを憎[にく]む、と主[しゅ]は言[い]われる。"
  50: "淫[いん]らな女[おんな]が、賢[かしこ]く非常に良[よ]い女[おんな]を憎[にく]むように、"
  51: "正[ただ]しさも、飾[かざ]り立[た]てる不義[ふぎ]を憎[にく]み、その顔[かお]を向[む]けてそれを責[せ]める。地[ち]の上[うえ]ですべての罪[つみ]を追[お]い求[もと]める者[もの]を弁護[べんご]する方[かた]が来[こ]られるとき、"
  52: "それゆえ、それに似[に]るな。そのわざにも似[に]るな。"
  53: "まもなく、不法[ふほう]は地[ち]から取[と]り去[さ]られ、正[ただ]しさがあなたがたの上[うえ]に王[おう]として君臨[くんりん]するからである。"
  54: "罪[つみ]ある者[もの]は『わたしは罪[つみ]を犯[おか]していない』と言[い]ってはならない。『わたしは主[しゅ]なる神[かみ]とその栄光[えいこう]の前[まえ]に罪[つみ]を犯[おか]していない』と言[い]う者[もの]の頭[あたま]には、燃[も]える炭火[すみび]が降[ふ]りかかるからである。"
  55: "見[み]よ、主[しゅ]は人[ひと]のすべてのわざとその企[くわだ]て、その思[おも]いと心[こころ]をすべて知[し]っておられる。"
  56: "神[かみ]は言[い]われた。『地[ち]よ、現[あらわ]れよ』と。すると地[ち]は現[あらわ]れた。『天[てん]よ、現[あらわ]れよ』と。すると天[てん]は現[あらわ]れた。"
  57: "その言葉[ことば]によって星[ほし]が造[つく]られ、神は星[ほし]の数[かず]を知[し]っておられる。"
  58: "神は深[ふか]い淵[ふち]とその宝[たから]を探[さぐ]り、海[うみ]とその中[なか]にあるものを量[はか]られた。"
  59: "神は水[みず]の中[なか]に海[うみ]を閉[と]じ込[こ]め、その言葉[ことば]によって地[ち]を水[みず]の上[うえ]に懸[か]けられた。"
  60: "神は天[てん]を幕屋[まくや]のように広[ひろ]げ、水[みず]の上[うえ]にその基[もと]を据[す]えられた。"
  61: "神は荒野[こうや]に水[みず]の泉[いずみ]を、山[やま]の頂[いただき]に湖[みずうみ]を置[お]き、高[たか]い岩[いわ]から川[かわ]を流[なが]して地[ち]を潤[うるお]われる。"
  62: "神は人[ひと]を造[つく]り、その心[こころ]を体[からだ]の真[ま]ん中[なか]に置[お]き、その人[ひと]に霊[れい]と命[いのち]と悟[さと]りを、"
  63: "全能[ぜんのう]の神[かみ]の息[いき]をも注[そそ]ぎ入[い]れられた。この方[かた]はすべてを造[つく]り、地[ち]の奥[おく]深[ふか]く隠[かく]されたすべてのものを探[さぐ]られる。"
  64: "神はあなたがたの企[くわだ]てと、罪[つみ]を犯[おか]しながら、自分[じぶん]の罪[つみ]を隠[かく]そうとして心[こころ]のうちに思[おも]っていることを知[し]っておられる。"
  65: "それゆえ、主[しゅ]はあなたがたのすべてのわざを詳[くわ]しく調[しら]べ、あなたがたをことごとく責[せ]める。"
  66: "あなたがたは、自分[じぶん]の罪[つみ]が人[ひと]々[びと]の前[まえ]に現[あらわ]れ、不法[ふほう]がその日[ひ]に訴[うった]えるために立[た]つとき、恥[は]ずかしめを受[う]ける。"
  67: "あなたがたは何[なに]をし、どうやって神[かみ]とその天使[てんし]たちの前[まえ]に罪[つみ]を隠[かく]すのか。"
  68: "見[み]よ、神[かみ]は裁[さば]き主[ぬし]である。神を恐[おそ]れ、罪[つみ]から離[はな]れ、もはや決[けっ]して不法[ふほう]を行[おこな]わないようにせよ。そうすれば、神はあなたがたを導[みちび]き出[だ]し、すべての苦[くる]しみから救[すく]われる。"
  69: "見[み]よ、多[おお]くの民[たみ]があなたがたに敵[てき]して燃[も]え上[あ]がり、あなたがたのうちのある者[もの]たちを捕[と]らえて、偶像[ぐうぞう]へのいけにえとして屠[ほふ]る。"
  70: "彼らに同[どう]じ心[こころ]を寄[よ]せる者[もの]たちは、彼らに嘲[あざけ]りと辱[はずかし]めと踏[ふ]みつけの的[まと]にされる。"
  71: "場所[ばしょ]は場所[ばしょ]に敵[てき]し、また隣[となり]の町々[まちまち]から、主[しゅ]を恐[おそ]れる者[もの]たちに逆[さか]らって多[おお]くの者[もの]が立[た]ち上[あ]がるからである。"
  72: "彼らは狂[くる]い人[びと]のようになり、主[しゅ]を恐[おそ]れる者[もの]たちを、だれも容赦[ようしゃ]せずに奪[うば]い、荒[あ]らす。"
  73: "彼らは彼らの財産[ざいさん]を荒[あ]らし奪[うば]って、家[いえ]から追[お]い出[だ]すからである。"
  74: "そのとき、わたしの選[えら]ばれた者[もの]たちの試[こころ]みが、火[ひ]で試[ため]される金[きん]のように現[あらわ]れる。"
  75: "わたしの愛[あい]する者[もの]たちよ、聞[き]け、と主[しゅ]は言[い]われる。見[み]よ、あなたがたの前[まえ]に苦[くる]しみの日[ひ]々[び]がある。わたしはその日[ひ]々[び]からあなたがたを救[すく]い出[だ]す。"
  76: "恐[おそ]れるな。疑[うたが]うな。あなたがたの先導[せんどう]する者[もの]は神[かみ]である。"
  77: "わたしの戒[いまし]めと命令[めいれい]を守[まも]る者[もの]には、と主[しゅ]なる神[かみ]は言[い]われる、あなたがたの罪[つみ]があなたがたを圧[お]しつぶすことはなく、あなたがたの不法[ふほう]があなたがたに打[う]ち勝[か]つことはない。"
  78: "災[わざわ]いだ、自分[じぶん]の罪[つみ]に押[お]しつぶされ、自分[じぶん]の不法[ふほう]で覆[おお]われている者[もの]は。"
  79: "すなわち、畑[はたけ]が森[もり]に押[お]しつぶされ、人[ひと]の通[とお]らないその小径[こみち]が茨[いばら]で覆[おお]われ、引[ひ]き抜[ぬ]かれて火[ひ]に焼[や]かれるために送[おく]られるようなものである。」"

notes:
  1: "Горе тебе, вавилоне и асиа! горе тебе, египте и сириа! — обращение к Вавилону, Асии, Египту, Сирии; в 15–16 Вавилон — Рим (ср. Откр 17–18), в тексте оставлено バビロン."
  2: "Препояшитеся вретищем и власяницами — «препояшьтесь вретищем и власяницей»."
  5: "Послана суть на вас злая — «посланы на вас бедствия»; отметнет я — «отвратит их»."
  6: "Льва алчуща в лес — «голодного льва в лес»; огнь во хврастии — «огонь в хворосте»."
  11: "Воспретит — «воззрит грозно (запретит)»; ru «воззрит грозно» — оттенок иной, в тексте «お叱りになれば»."
  17: "Горе мне, горе мне! — плач, голос самого Ездры (или народа), не речь Бога; поэтому отдельные кавычки (17–19)."
  20: "Послани суть бичи во исправление — «посланы как бичи для исправления»."
  22: "Обилие ни во чтоже — «изобилие ни во что» (всё подешевеет); возмнят себе быти управлен мир — «подумают, что мир устроен (настал)»."
  28: "Слав. «Восхощет бо человек человека видети, или глас его слышати» — «возжелает человек увидеть человека и услышать голос его»; ru «Трудно будет человеку увидеть человека…» — иное чтение, в тексте по слав."
  29: "Останут от града десять, и два от нивы — «останется от города десять, и от поля два»."
  32: "От изследующих домы их мечем — «из обыскивающих дома их с мечом»."
  37: "Не веруйте богом, о нихже рече Господь — «не верьте богам, о которых говорил Господь» (ложным богам)."
  39: "Прежде часов двух или триех — «за два или три часа»; не закоснят ни на едину черту — «не замедлят ни на одну черту»."
  45: "Слав. «иже не посягают, тако яко вдовицы» — «не вступающие в брак — как вдовицы» (ж. р.); ru «как вдовцы» — по смыслу о мужчинах, отмечено."
  48: "Иже куплю деют хищением — «кто торговлю ведёт хищением»; одержания и лица своя — «владения и лица свои»."
  51: "Тёмное: защищает изыскующаго всяк грех на земли — «защищает взыскующего всякий грех на земле». ru «будет защищать преследующего всякий грех» — передано по ru-смыслу с слав. основой."
  54: "Углие огненное возгорится на главе его — «уголья огненные возгорятся на голове его» (ср. Пс 139:11); слова грешника — вложенные 『…』."
  56: "Да будет земля, и бысть: да будет небо, и бысть — «да будет земля, и стало; да будет небо, и стало»; слова Бога при творении — вложенные 『…』."
  58: "Слав. «зачатие его» — тёмное: «зачатие (глубина) моря»; передано «海とその中にあるもの» по смыслу ru."
  59: "Заключи море посреде вод — «заключил море среди вод»; повеси землю на водах — «повесил землю на водах» (ср. Пс 23:2)."
  60: "Яко камару — «как камору (шатёр, свод)»."
  62: "Положи сердце его посреде тела — «положил сердце его посреди тела»; вложи ему дух и живот и разум — «вложил в него дух, жизнь и разум»; 63 продолжает: «и дыхание Бога Вседержителя»."
  69: "Возгарается огнь на вас, языцы мнози — «возгорается огонь на вас, многие народы»; заколют на жертву идолом — «заколют в жертву идолам»."
  78: "Стисняются от грех своих — «теснимы (угнетаемы) грехами своими»; нива стисняется от дубравы — «поле теснимо (заглушается) рощей»; ru 16:78 пространнее (поле, заросшее кустарником, обрекается огню) — в слав. это в 16:79."
