# jp-box, Левит, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: «святы будьте» (2) и свод заповедей — родители и субботы (3), идолы (4),
# мирная жертва (5–8), край поля и виноградника (9–10), кража, ложь, клевета,
# клятва (11–12), плата наёмника (13), глухой и слепой (14), суд (15), кровь
# ближнего (16), обличение брата (17), любовь к ближнему (18), смешение пород,
# семян и тканей (19), рабыня (20–22), плоды молодого дерева (23–25), гадания (26),
# стрижка и нарезы (27–28), блуд дочери (29), субботы и святыни (30), вызывающие
# мёртвых (31), седина (32), пришелец (33–34), меры и весы (35–36), заключение (37).
# Речь Бога — 「…」 (2–37), по абзацам-законам (как в Исх 20); красного и синего нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе). В 19:18 слав. добавляет
# «Бог ваш» к «Я Господь» — это колебание закрывающей формулы, а не новое чтение,
# поэтому скобки не ставятся (см. notes).
# Сносок ⟨…⟩ нет: 酬恩祭 (3:1), 愆祭 (5:15), 祭司, 幕屋, 安息日 уже пояснены
# в предыдущих главах; остальное понятно по контексту.
# Отличия LXX от масоретского: 19:26 «на горах» вместо «с кровью»; 19:23
# «очистите нечистоту его» (περικαθαρίζω) вместо «почитайте необрезанными»;
# 19:18 у LXX «Я Господь» без «Бог ваш».
# jp-ni не использовался.

