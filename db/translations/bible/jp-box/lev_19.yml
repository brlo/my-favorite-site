verses:
  1: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らの会衆[かいしゅう]に語[かた]り、彼[かれ]らに言[い]いなさい。あなたがたは聖[せい]なる者[もの]となりなさい。わたしは聖なる者、あなたがたの神[かみ]、主[しゅ]だからである。"
  3: "あなたがたは、それぞれ父[ちち]と母[はは]を恐[おそ]れなさい。わたしの安息日[あんそくび]を守[まも]りなさい。わたしはあなたがたの神[かみ]、主[しゅ]である。"
  4: "あなたがたは偶像[ぐうぞう]に従[したが]ってはならない。あなたがたのために鋳物[いもの]の神[かみ]々[がみ]を造[つく]ってはならない。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  5: "「あなたがたが主[しゅ]に酬恩祭[しゅうおんさい]を献[ささ]げるときは、あなたがたが受[う]け入[い]れられるように献げなさい。"
  6: "それが献[ささ]げられた日[ひ]とその翌日[よくじつ]に、それは食[た]べられなければならない。三日[みっか]目[め]まで残[のこ]るなら、それは火[ひ]で焼[や]き尽[つ]くされなければならない。"
  7: "もし三日[みっか]目[め]にそれが食[た]べられるなら、それはもはや犠牲[ぎせい]ではなくなり、受[う]け入[い]れられない。"
  8: "それを食[た]べる者[もの]は罪[つみ]を負[お]う。その者は主[しゅ]の聖[せい]なるものを汚[けが]したからである。それを食べる者は、自分[じぶん]の民[たみ]のうちから断[た]たれる。」"
  9: "「あなたがたが自分[じぶん]の土地[とち]の収穫[しゅうかく]を刈[か]り入[い]れるとき、畑[はたけ]の隅[すみ]まで刈り尽[つ]くしてはならない。あなたの収穫の落[お]ち穂[ぼ]を集[あつ]めてはならない。"
  10: "あなたのぶどう畑[ばたけ]を二度[にど]摘[つ]みしてはならない。ぶどう畑に落[お]ちた実[み]を集[あつ]めてはならない。それを貧[まず]しい者[もの]と寄留者[きりゅうしゃ]に残[のこ]しておきなさい。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  11: "「あなたがたは盗[ぬす]んではならない。偽[いつわ]ってはならない。それぞれ隣人[りんじん]を中傷[ちゅうしょう]してはならない。"
  12: "あなたがたはわたしの名[な]によって偽[いつわ]って誓[ちか]ってはならない。あなたがたの神[かみ]の名を汚[けが]してはならない。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  13: "「あなたは隣人[りんじん]を虐[しいた]げてはならない。奪[うば]ってはならない。雇[やと]い人[びと]の賃金[ちんぎん]が、あなたのもとで朝[あさ]まで夜[よ]を越[こ]してはならない。」"
  14: "「あなたは耳[みみ]の聞[き]こえない者[もの]を呪[のろ]ってはならない。目[め]の見[み]えない者の前[まえ]に、つまずきとなるものを置[お]いてはならない。あなたの神[かみ]、主[しゅ]を恐[おそ]れなさい。わたしはあなたがたの神、主である。」"
  15: "「あなたがたは裁[さば]きにおいて不正[ふせい]を行[おこな]ってはならない。貧[まず]しい者[もの]だからといって顔[かお]を立[た]ててはならない。力[ちから]ある者だからといって、その顔を重[おも]んじてはならない。あなたは正[ただ]しさをもって隣人[りんじん]を裁かなければならない。」"
  16: "「あなたの民[たみ]のうちで偽[いつわ]りをもって歩[ある]いてはならない。あなたの隣人[りんじん]の血[ち]を流[なが]すために立[た]ち向[む]かってはならない。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  17: "「あなたは心[こころ]のうちで兄弟[きょうだい]を憎[にく]んではならない。あなたの隣人[りんじん]を必[かなら]ず戒[いまし]めなさい。そうすれば、その者[もの]のために罪[つみ]を負[お]うことはない。」"
  18: "「あなたの手[て]が復讐[ふくしゅう]してはならない。あなたの民[たみ]の子[こ]らに恨[うら]みを抱[いだ]いてはならない。あなたの隣人[りんじん]をあなた自身[じしん]のように愛[あい]しなさい。わたしは主[しゅ]である。」"
  19: "「あなたがたはわたしの律法[りっぽう]を守[まも]らなければならない。あなたの家畜[かちく]を異[こと]なる種類[しゅるい]のものと交配[こうはい]させてはならない。あなたのぶどう畑[ばたけ]に二種[にしゅ]の種[たね]を蒔[ま]いてはならない。二種の糸[いと]で織[お]った混[ま]ざり物[もの]の衣[ころも]を身[み]に着[つ]けてはならない。」"
  20: "「もし男[おとこ]が女[おんな]と寝[ね]て種[たね]を注[そそ]ぎ、その女が、ある男のために取[と]り分[わ]けられた女奴隷[おんなどれい]であって、まだ贖[あがな]われておらず、自由[じゆう]も与[あた]えられていないなら、彼[かれ]らは罰[ばつ]せられる。しかし、死[し]には処[しょ]せられない。その女が自由にされていなかったからである。"
  21: "その者[もの]は、自分[じぶん]の愆[けん]のために、証[あかし]の幕屋[まくや]の入口[いりぐち]のところで、主[しゅ]に愆祭[けんさい]の雄羊[おすひつじ]を献[ささ]げなければならない。"
  22: "祭司[さいし]は、その者[もの]が犯[おか]した罪[つみ]について、愆祭[けんさい]の雄羊[おすひつじ]によって、主[しゅ]の前[まえ]でその者のために贖[あがな]いをしなければならない。そうすれば、その者の犯した罪は赦[ゆる]される。」"
  23: "「あなたがたが、あなたがたの神[かみ]である主[しゅ]が与[あた]える土地[とち]に入[はい]り、食[た]べられる木[き]をすべて植[う]えるときは、その実[み]の汚[けが]れを取[と]り除[のぞ]かなければならない。その実は三年[さんねん]の間[あいだ]、あなたがたにとって清[きよ]められないままとなり、食[た]べてはならない。"
  24: "四年[よねん]目[め]には、その実[み]はすべて、主[しゅ]への賛美[さんび]として聖[せい]なるものとなる。"
  25: "五年[ごねん]目[め]には、あなたがたはその実[み]を食[た]べることができる。その産物[さんぶつ]があなたがたに増[ふ]し加[くわ]えられるためである。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  26: "「あなたがたは山[やま]の上[うえ]で食[た]べてはならない。占[うらな]いをしてはならない。鳥[とり]によって吉凶[きっきょう]を占ってはならない。」"
  27: "「あなたがたは頭[あたま]の髪[かみ]の周[まわ]りを切[き]り込[こ]んではならない。ひげの端[はし]を損[そこ]なってはならない。"
  28: "あなたがたは死[し]んだ者[もの]のために、からだに切[き]り傷[きず]をつけてはならない。身[み]に入[い]れ墨[ずみ]をしてはならない。わたしは主[しゅ]である。」"
  29: "「あなたは娘[むすめ]を汚[けが]して、彼女[かのじょ]を淫行[いんこう]に陥[おとしい]れてはならない。そうすれば、地[ち]は淫行を犯[おか]さず、地は不法[ふほう]で満[み]ちることもない。」"
  30: "「あなたがたはわたしの安息日[あんそくび]を守[まも]らなければならない。わたしの聖[せい]なるものの前[まえ]で恐[おそ]れなければならない。わたしは主[しゅ]である。」"
  31: "「あなたがたは霊媒[れいばい]に従[したが]ってはならない。呪術師[じゅじゅつし]にすがって、彼[かれ]らによって身[み]を汚[けが]してはならない。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  32: "「白髪[しらが]の者[もの]の前[まえ]に立[た]ち上[あ]がりなさい。老[お]いた者の顔[かお]を敬[うやま]いなさい。あなたの神[かみ]を恐[おそ]れなさい。わたしはあなたがたの神、主[しゅ]である。」"
  33: "「もし寄留者[きりゅうしゃ]があなたがたの土地[とち]に住[す]むために来[き]たなら、彼[かれ]を虐[しいた]げてはならない。"
  34: "あなたがたのもとに来[き]た寄留者[きりゅうしゃ]は、あなたがたのうちの土着[どちゃく]の者[もの]と同[おな]じでなければならない。あなたは彼[かれ]をあなた自身[じしん]のように愛[あい]しなさい。あなたがたもエジプトの地[ち]で寄留者であったからである。わたしはあなたがたの神[かみ]、主[しゅ]である。」"
  35: "「あなたがたは、裁[さば]きにおいても、量[はか]りにおいても、重[おも]さにおいても、秤[はかり]においても、不正[ふせい]を行[おこな]ってはならない。"
  36: "正[ただ]しい秤[はかり]、正しい分銅[ぶんどう]、正しい升[ます]をあなたがたは持[も]たなければならない。わたしはあなたがたの神[かみ]、主[しゅ]、あなたがたをエジプトの地[ち]から導[みちび]き出[だ]した者[もの]である。」"
  37: "「あなたがたはわたしの律法[りっぽう]をすべて守[まも]り、わたしの定[さだ]めをすべて行[おこな]わなければならない。わたしはあなたがたの神[かみ]、主[しゅ]である。」"

notes:
  1: "Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — обычная формула введения: и сказал Господь Моисею, говоря (λέγων — «говоря»; слав. «глаголя»)."
  2: "Λάλησον τῇ συναγωγῇ — скажи собранию (συναγωγή — «собрание, община»; 会衆). Ἅγιοι ἔσεσθε — святы будете (буд. вр. в значении повеления; слав. «святи будите»). ἐγὼ ἅγιος, κύριος ὁ θεὸς ὑμῶν — Я свят, Господь Бог ваш: требование обосновано святостью Самого Бога, порядок греческий сохранён."
  3: "ἕκαστος — каждый (ед. ч.), далее φυλάξεσθε — сохраните (мн. ч.): лица смешаны, как и в слав. «Вийждо… да боится, и субботы моя сохраните». φοβείσθω — да боится (повеление 3 л.). У LXX сначала отец, потом мать (в Синодальном наоборот). σάββατα — мн. форма евр. שַׁבָּת."
  4: "οὐκ ἐπακολουθήσετε — не последуете (ἐπακολουθέω — «идти вслед, прилепляться»; слав. «не последуйте»). εἰδώλοις — идолам (εἴδωλον). θεοὺς χωνευτούς — богов литых (χωνευτός — «отлитый»; слав. «богов слияных»)."
  5: "θυσίαν σωτηρίου — жертва спасения, т. е. мирная (酬恩祭). δεκτὴν ὑμῶν θύσετε — приятную вам заколите: цель в том, чтобы жертва была принята (δεκτός — «приемлемый»; слав. «приятну вам пожрите»)."
  6: "ᾗ ἂν ἡμέρᾳ θύσητε — в какой бы день ни закололи (ᾗ — относит. с дат.). βρωθήσεται — будет съедено (буд. страд.). καὶ τῇ αὔριον — и на утро (наречие без предлога). κατακαυθήσεται — будет сожжено (κατακαίω)."
  7: "ἐὰν βρώσει βρωθῇ — если будет съедено (усиление через однокоренной дат.). ἄθυτόν ἐστιν — «нежертвенное», т. е. уже не жертва; слав. «не жертвенно есть». οὐ δεχθήσεται — не будет принято."
  8: "ὁ ἔσθων — тот, кто ест (прич. наст.). ἁμαρτίαν λήμψεται — грех понесёт (λαμβάνω). τὰ ἅγια κυρίου — святыни Господни (τὰ ἅγια — «святое, святыни»). ἐξολεθρευθήσονται αἱ ψυχαί — истребятся души (ἐξολεθρεύω; ψυχή здесь — живой человек, поэтому 者, а не 魂)."
  9: "ἐκθεριζόντων ὑμῶν — когда будете жать (gen. abs.). οὐ συντελέσετε … ἐκθερῖσαι — не доведёте жатву до конца (συντελέω «завершать»). τὰ ἀποπίπτοντα τοῦ θερισμοῦ — опадающее от жатвы, т. е. оставшиеся колосья (落ち穂)."
  10: "ἐπανατρυγήσεις — не оберёшь во второй раз (ἐπανατρυγάω; слав. «вторицею да не обереши»). ῥώξ (род. ῥωγός) — виноградная ягода, гроздь. τῷ πτωχῷ καὶ τῷ προσηλύτῳ — нищему и пришельцу (προσήλυτος; 寄留者)."
  11: "οὐ κλέψετε, οὐ ψεύσεσθε — краткие запреты (буд. вр. в значении повеления). συκοφαντήσει ἕκαστος τὸν πλησίον — каждый оклеветает ближнего (συκοφαντέω — «клеветать, обманывать, вымогать»; слав. «да не оклеветает»)."
  12: "ὀμεῖσθε — будете клясться (ὄμνυμι). ἐπ᾽ ἀδίκῳ — «неправдою», т. е. ложно (слав. «в неправде»). βεβηλώσετε — оскверните (βεβηλόω; 汚す)."
  13: "οὐκ ἀδικήσεις — не обидишь (ἀδικέω). οὐχ ἁρπάσεις — не похитишь (ἁρπάζω). οὐ μὴ κοιμηθήσεται ὁ μισθὸς τοῦ μισθωτοῦ παρὰ σοί ἕως πρωί — плата наёмника не переночует у тебя до утра (двойное отрицание с μή; слав. «да не прележит мзда наемника твоего у тебе до утрия»)."
  14: "οὐ κακῶς ἐρεῖς κωφόν — не скажешь худо глухому (κωφός — «глухой», иногда «немой»; слав. «зла да не речеши глухому»). οὐ προσθήσεις σκάνδαλον — не положишь претыкания (σκάνδαλον). φοβηθήσῃ κύριον — убоишься Господа."
  15: "οὐ λήμψῃ πρόσωπον πτωχοῦ — не примешь лица нищего (евр. оборот; слав. «да не приимеши лица нищаго»). θαυμάσεις πρόσωπον δυνάστου — не подивишься лицу сильного, т. е. не угодишь ему (θαυμάζω «дивиться»; слав. «ниже почудишися лицу могущаго»). ἐν δικαιοσύνῃ κρινεῖς — по правде суди."
  16: "πορεύσῃ δόλῳ — будешь ходить с коварством (δόλος; слав. «лестию»); иудейское предание читает это как запрет сплетен. ἐπισυστήσῃ ἐφ᾽ αἷμα — восстанешь на кровь, т. е. на жизнь ближнего (ἐπισυνίσταμαι; слав. «не востанеши на кровь ближняго твоего»)."
  17: "μισήσεις — возненавидишь. τῇ διανοίᾳ σου — в мысли твоей (διάνοια). ἐλεγμῷ ἐλέγξεις — обличением обличишь (усиление через однокоренной дат.; 戒める). οὐ λήμψῃ δι᾽ αὐτὸν ἁμαρτίαν — не примешь из-за него греха."
  18: "οὐκ ἐκδικᾶταί σου ἡ χείρ — не мстит рука твоя (ἐκδικέω; подлежащее χείρ, редкая конструкция). οὐ μηνιεῖς — не будешь питать гнева (μηνίω). ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν — возлюби ближнего твоего, как самого себя: главное место главы, переведено без смягчения. ἐγὼ κύριος — Я Господь; слав. добавляет «Бог ваш», в gr-lxx-byz этого нет — скобки не ставим, это колебание формулы."
  19: "τὸν νόμον μου φυλάξεσθε — закон Мой сохраните (νόμος; 律法). κατοχεύσεις ἑτεροζύγῳ — случишь с инородным (κατοχεύω — «случать»; ἑτερόζυγος — «иного ярма, иной породы»). κατασπερεῖς διάφορον — засеешь разным (διάφορος «различный»). ἱμάτιον ἐκ δύο ὑφασμένον κίβδηλον — одежда из двух сотканная, смешанная (κίβδηλος «поддельный»; слав. «гнусныя»)."
  20: "κοίτην σπέρματος — ложе семени, т. е. соитие с излиянием. οἰκέτις διαπεφυλαγμένη ἀνθρώπῳ — рабыня, сберегаемая (предназначенная) человеку (διαφυλάσσω «оберегать»; слав. «раба хранима мужу»). λύτροις οὐ λελύτρωται — не выкуплена выкупом (λύτρον «выкуп»). ἐπισκοπὴ ἔσται αὐτοῖς — «посещение» им будет, т. е. взыскание, наказание (ἐπισκοπή; слав. «наказаны да будут»). οὐκ ἀποθανοῦνται — не умрут."
  21: "προσάξει — приведёт (προσάγω). τῆς πλημμελείας αὐτοῦ — за преступление своё (πλημμέλεια — и «преступление», и «жертва повинности»; отсюда игра слов: 愆 и 愆祭). κριὸν πλημμελείας — овна преступления (愆祭の雄羊)."
  22: "ἐξιλάσεται περὶ αὐτοῦ — умилостивит за него (ἐξιλάσκομαι; 贖う). ἧς ἥμαρτεν — которым согрешил (повтор в греческом сохранён). ἀφεθήσεται — будет оставлен, прощён (ἀφίημι)."
  23: "καταφυτεύσετε πᾶν ξύλον βρώσιμον — насадите всякое дерево съедобное. περικαθαριεῖτε τὴν ἀκαθαρσίαν αὐτοῦ — «очистите нечистоту его» (περικαθαρίζω — «обрезать вокруг», передаёт евр. «обрежете»; слав. «очистите нечистоту его»); Синодальный — «почитайте за необрезанные». ἀπερικάθαρτος — неочищенный, «необрезанный»: три года плод нельзя есть."
  24: "τῷ ἔτει τῷ τετάρτῳ — в год четвёртый. ἅγιος αἰνετός — свят, хвален (αἰνετός «достойный хвалы»; слав. «свят, похвален»); Синодальный передаёт масоретское «для празднеств Господних»."
  25: "πρόσθεμα ὑμῖν τὰ γενήματα αὐτοῦ — прибавление вам произведения его (πρόσθεμα «придача, прибыток»; слав. «прибыток вам плоды его»)."
  26: "Μὴ ἔσθετε ἐπὶ τῶν ὀρέων — не ешьте на горах: LXX читает евр. עַל־הַדָּם («с кровью») как עַל־הֶהָרִים («на горах»); Синодальный — «не ешьте с кровью». Держимся греческого. οἰωνιεῖσθε — будете гадать по приметам (οἰωνίζομαι). ὀρνιθοσκοπήσεσθε — будете гадать по птицам (ὀρνιθοσκοπέομαι)."
  27: "σισόη — особая стрижка в кружок (гапакс, из евр.; слав. «обстрижения»). φθερεῖτε τὴν ὄψιν τοῦ πώγωνος — повредите вид бороды, т. е. подстрижёте края."
  28: "ἐντομίδας ἐπὶ ψυχῇ — нарезы ради (умершей) души (ἐντομίς «нарез»; ἐπὶ ψυχῇ — «по умершем»). γράμματα στικτά — наколотые письмена, татуировка (στικτός «наколотый»)."
  29: "ἐκπορνεῦσαι αὐτήν — дать ей блудодействовать (ἐκπορνεύω). οὐκ ἐκπορνεύσει ἡ γῆ — и не будет блудодействовать земля; повтор «земля» в греческом сохранён (в Синодальном он снят)."
  30: "ἀπὸ τῶν ἁγίων μου φοβηθήσεσθε — от святынь Моих убоитесь (ἀπό + род. вместо винительного; слав. «от святых моих убойтеся»; Синодальный — «святилище Мое чтите»)."
  31: "ἐγγαστρίμυθοι — чревовещатели, вызывающие мёртвых (букв. «говорящие из чрева»; 霊媒). ἐπαοιδοί — заклинатели, волхвы (呪術師). οὐ προσκολληθήσεσθε ἐκμιανθῆναι — не прилепитесь, чтобы оскверниться (προσκολλάω, ἐκμιαίνω)."
  32: "ἀπὸ προσώπου πολιοῦ ἐξαναστήσῃ — пред лицом седого встанешь (πολιός «седой»; ἐξανίστημι «вставать»). τιμήσεις πρόσωπον πρεσβυτέρου — почтишь лицо старца (πρεσβύτερος)."
  33: "προσέλθῃ προσήλυτος — придёт пришелец (προσέρχομαι). οὐ θλίψετε — не стесните, не притесните (θλίβω; слав. «не стужите»)."
  34: "ὡς ὁ αὐτόχθων — как туземец (αὐτόχθων «рождённый на земле»; 土着の者). ἀγαπήσεις αὐτὸν ὡς σεαυτόν — возлюби его, как себя: та же формула, что в 18. ὅτι προσήλυτοι ἐγενήθητε ἐν γῇ Αἰγύπτῳ — ибо пришельцами были вы в земле Египетской."
  35: "ἐν μέτροις — в мерах (μέτρον — мера длины или объёма), ἐν σταθμίοις — в гирях (στάθμιον), ἐν ζυγοῖς — на весах (ζυγόν)."
  36: "ζυγὰ δίκαια — весы верные. στάθμια δίκαια — гири верные (στάθμιον). χοῦς δίκαιος — мера верная (χοῦς — мера сыпучих, евр. ефа; Синодальный — «ефа верная»). ὁ ἐξαγαγὼν ὑμᾶς — выведший вас."
  37: "φυλάξεσθε πάντα τὸν νόμον — сохраните весь закон. προστάγματα — повеления (定め)."
