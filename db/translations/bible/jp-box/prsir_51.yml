verses:
  1: "「王[おう]である主[しゅ]よ、わたしはあなたに感謝[かんしゃ]し、あなたを、わたしの救[すく]い主[ぬし]である神[かみ]としてほめたたえる。わたしはあなたの名[な]をほめたたえる。"
  2: "あなたはわたしの守[まも]り手[て]、助[たす]け手[て]となって、わたしの体[からだ]を滅[ほろ]びから、中傷[ちゅうしょう]する舌[した]の罠[わな]から、偽[いつわ]りを働[はたら]く唇[くちびる]から救[すく]い出[だ]してくださった。わたしの前[まえ]に立[た]つ者[もの]たちの前で、あなたは助け手となってわたしを救い出してくださった。"
  3: "あなたのあわれみと名[な]の豊[ゆた]かさにしたがって、わたしを食[く]い物[もの]にしようと構[かま]える者[もの]たちの歯[は]ぎしりから、わたしの命[いのち]を求[もと]める者[もの]の手[て]から、わたしが受[う]けた多[おお]くの苦[くる]しみから、"
  4: "四方[しほう]から迫[せま]る火[ひ]の煙[けむり]の中[なか]から、わたしが焼[や]かれなかった火のただ中[なか]から、"
  5: "よみの胎[たい]の深[ふか]みから、汚[けが]れた舌[した]から、偽[いつわ]りの言葉[ことば]から、"
  6: "王[おう]に対する、不正[ふせい]な舌[した]の中傷[ちゅうしょう]から。わたしの魂[たましい]は死[し]に近[ちか]づき、わたしの命[いのち]は下[した]のよみに近づいていた。"
  7: "彼らは四方[しほう]からわたしを取り囲[かこ]み、助[たす]ける者[もの]はなかった。わたしは人[ひと]の助けを求[もと]めて見[み]回[まわ]したが、だれもいなかった。"
  8: "主[しゅ]よ、わたしはあなたのあわれみと、昔[むかし]からのあなたのわざを思[おも]い起[おこ]した。あなたは自分[じぶん]を待[ま]ち望[のぞ]む者[もの]を救[すく]い出[だ]し、敵[てき]の手[て]から彼らを救[すく]われるからである。"
  9: "わたしは地[ち]からわたしの願[ねが]いを上[あ]げ、死[し]からの救[すく]いを求[もと]めた。"
  10: "わたしは主[しゅ]を、わたしの主[しゅ]の父[ちち]を呼[よ]び求[もと]めた。苦[くる]しみの日々[ひび]に、助[たす]けのない高[たか]ぶりの時[とき]に、わたしを捨[す]てないでください、と。わたしはあなたの名[な]を絶[た]えずほめたたえ、感謝[かんしゃ]のうちに歌[うた]う。"
  11: "わたしの願[ねが]いは聞[き]き届[とど]けられた。あなたはわたしを滅[ほろ]びから救[すく]い、悪[あく]い時[とき]から引[ひ]き出[だ]してくださったからである。"
  12: "それゆえ、わたしはあなたに感謝[かんしゃ]し、あなたをほめたたえ、主[しゅ]の名[な]をほめたたえる。」"
  13: "わたしはまだ若[わか]く、迷[まよ]い出[で]る前[まえ]に、自分[じぶん]の祈[いの]りの中[なか]で、明[あき]らかに知恵[ちえ]を求[もと]めた。"
  14: "神殿[しんでん]の前[まえ]でわたしは知恵[ちえ]を願[ねが]い、最後[さいご]までそれを求[もと]め続[つづ]けようとした。"
  15: "ぶどうが熟[じゅく]し始[はじ]めるころの花[はな]のように、わたしの心[こころ]は知恵[ちえ]によって喜[よろこ]んだ。わたしの足[あし]はまっすぐな道[みち]を踏[ふ]み、若[わか]いころから知恵の跡[あと]を追[お]った。"
  16: "わたしは少[すこ]し耳[みみ]を傾[かたむ]けてそれを受[う]け入[い]れ、自分[じぶん]のために多[おお]くの教[おし]えを得[え]た。"
  17: "知恵[ちえ]によってわたしは進[すす]み、わたしに知恵を与[あた]える方[かた]に栄光[えいこう]をささげる。"
  18: "わたしは知恵[ちえ]を行[おこな]おうと心[こころ]に決[き]め、善[よ]いことを熱心[ねっしん]に求[もと]めた。だから恥[は]じることはない。"
  19: "わたしの魂[たましい]は知恵[ちえ]のために戦[たたか]い、律法[りっぽう]を行[おこな]うことに努[つと]めて細[こま]かく考[かんが]えた。わたしは両手[りょうて]を高[たか]みに向[む]けて広[ひろ]げ、知恵についての無知[むち]を嘆[なげ]いた。"
  20: "わたしは自分[じぶん]の魂[たましい]をそこへ向[む]けてまっすぐにし、清[きよ]めのうちに知恵[ちえ]を見[み]いだした。初[はじ]めから知恵とともに心[こころ]を得[え]た。それゆえ、わたしが見捨[みす]てられることはない。"
  21: "わたしの内[うち]は知恵[ちえ]を求[もと]めて揺[ゆ]れ動[うご]いた。それゆえ、わたしは良[よ]い財産[ざいさん]を得[え]た。"
  22: "主[しゅ]はわたしの報[むく]いとしてわたしに舌[した]を与[あた]え、わたしはその舌で主をほめたたえる。"
  23: "無学[むがく]な者[もの]たちよ、わたしのところに近[ちか]づき、教[おし]えの家[いえ]に宿[やど]りなさい。"
  24: "なぜ、あなたがたはこれらのことで自分[じぶん]が欠[か]けていると言[い]い、自分[じぶん]の魂[たましい]がひどく渇[かわ]いていると言うのか。"
  25: "わたしは口[くち]を開[ひら]いて言[い]った。「銀[ぎん]を払[はら]わないで、自分[じぶん]たちのためにこれを手[て]に入[い]れなさい。」"
  26: "あなたがたの首[くび]を軛[くびき]の下[した]に置[お]き、あなたがたの魂[たましい]が教[おし]えを受[う]け入[い]れるように。それはすぐに見[み]いだせる。"
  27: "あなたがた自身[じしん]の目[め]で見[み]なさい。わたしは少[すこ]し労[ろう]しただけで、自分[じぶん]に大[おお]きな安[やす]らぎを見[み]いだした。"
  28: "多[おお]くの銀[ぎん]を払[はら]って教[おし]えに与[あずか]り、それによって多[おお]くの金[きん]を得[え]なさい。"
  29: "あなたがたの魂[たましい]が主[しゅ]のあわれみによって喜[よろこ]ぶように。主をほめたたえることを恥[は]じてはならない。"
  30: "あなたがたのわざを時[とき]の来[く]る前[まえ]に行[おこな]いなさい。そうすれば、主[しゅ]はその時[とき]にあなたがたの報[むく]いを与[あた]える。"

notes:
  1: "Ἐξομολογήσομαί σοι, κύριε βασιλεῦ — «буду исповедовать (славить) Тебя, Господи Царю» (ἐξομολογέομαι — исповедовать, благодарить; звательный βασιλεῦ). αἰνέσω σε θεὸν τὸν σωτῆρά μου — «восхвалю Тебя, Бога, Спасителя моего» (αἰνέω — хвалить; σωτήρ — спаситель). ἐξομολογοῦμαι τῷ ὀνόματί σου — «исповедую имя Твоё» (дательный при ἐξομολογέομαι). Слав. 1 включает надписание «Молитва Иисуса, сына Сирахова» — оно вне текста стиха и не переведено. Здесь открывается молитва: 「…」 до ст. 12."
  2: "σκεπαστὴς καὶ βοηθὸς ἐγένου μοι — «Ты стал мне покровителем и помощником» (σκεπαστής — покрывающий, защитник; βοηθός — помощник). ἐλυτρώσω τὸ σῶμά μου ἐξ ἀπωλείας — «Ты избавил тело моё от погибели» (λυτρόω — избавлять, выкупать). ἐκ παγίδος διαβολῆς γλώσσης — «от сети клеветы языка» (παγίς — сеть, западня; διαβολή — клевета, наговор): родительный качества. ἀπὸ χειλέων ἐργαζομένων ψεῦδος — «от уст, делающих ложь» (χεῖλος — уста; ἐργάζομαι — делать). ἔναντι τῶν παρεστηκότων — «пред стоящими» (παρίστημι — предстоять): перед свидетелями."
  3: "κατὰ τὸ πλῆθος ἐλέους καὶ ὀνόματός σου — «по множеству милости и имени Твоего». ἐκ βρυγμῶν ἕτοιμον εἰς βρῶμα — «от скрежета [зубов] готового в пищу» (βρυγμός — скрежет; ἕτοιμος — готовый; βρῶμα — пища): образ врагов, готовых пожрать. ἐκ χειρὸς ζητούντων τὴν ψυχήν μου — «от руки ищущих души моей». ἐκ πλειόνων θλίψεων, ὧν ἔσχον — «от многих скорбей, которые я имел» (θλῖψις — скорбь, теснота)."
  4: "ἀπὸ πνιγμοῦ πυρᾶς κυκλόθεν — «от удушения костра (пламени) отовсюду» (πνιγμός — удушение; πυρά — костёр, пламя). ἐκ μέσου πυρός, οὗ οὐκ ἐξέκαυσα — «из среды огня, в котором я не сгорел» (ἐκκαίω — выжигать, сгорать); слав. «идеже не сожегохся»."
  5: "ἐκ βάθους κοιλίας ᾅδου — «из глубины чрева ада» (βάθος — глубина; κοιλία — чрево; ᾅδης — преисподняя, よみ). ἀπὸ γλώσσης ἀκαθάρτου — «от языка нечистого» (ἀκάθαρτος — нечистый). λόγου ψευδοῦς — «от слова ложного» (ψευδής — ложный). Слав. «от языка нечиста и словесе ложна»."
  6: "βασιλεῖ διαβολὴ γλώσσης ἀδίκου — «царю — клевета языка неправедного»: родительный при διαβολή; греч. фраза продолжает перечень ст. 5 (клевета у царя). ἤγγισεν ἕως θανάτου ἡ ψυχή μου — «душа моя приблизилась к смерти» (ἐγγίζω — приближаться). ἡ ζωή μου ἦν σύνεγγυς ᾅδου κάτω — «жизнь моя была близ ада преисподнего» (σύνεγγυς — близко; κάτω — внизу). Слав. выносит эту часть в ст. 8–9."
  7: "περιέσχον με πάντοθεν — «окружили меня отовсюду» (περιέχω — окружать; πάντοθεν — со всех сторон). οὐκ ἦν ὁ βοηθῶν — «не было помогающего» (βοηθέω — помогать). ἐνέβλεπον εἰς ἀντίλημψιν ἀνθρώπων — «я взирал на заступление людей» (ἐμβλέπω — смотреть; ἀντίλημψις — заступление, помощь)."
  8: "ἐμνήσθην τοῦ ἐλέους σου, κύριε — «я вспомнил милость Твою, Господи». τῆς ἐργασίας σου τῆς ἀπ᾿ αἰῶνος — «и дела Твои от века» (ἐργασία — дело, действие). ὅτι ἐξαιρῇ τοὺς ὑπομένοντάς σε — «что Ты избавляешь терпящих (ожидающих) Тебя» (ἐξαιρέω — изымать; ὑπομένω — терпеть, ждать). σῴζεις αὐτοὺς ἐκ χειρὸς ἐχθρῶν — «спасаешь их от руки врагов» (σῴζω — спасать)."
  9: "ἀνύψωσα ἀπὸ γῆς ἱκετείαν μου — «я вознёс от земли моление моё» (ἀνυψόω — возносить; ἱκετεία — моление, прошение). ὑπὲρ θανάτου ῥύσεως ἐδεήθην — «об избавлении от смерти я помолился» (ῥύσις — избавление; δέομαι — просить)."
  10: "ἐπεκαλεσάμην κύριον πατέρα κυρίου μου — «я призвал Господа, Отца Господа моего»: выражение передано буквально (わたしの主の父), без догматического истолкования. μή με ἐγκαταλιπεῖν ἐν ἡμέραις θλίψεως — «не оставить меня во дни скорби» (ἐγκαταλείπω — оставлять). ἐν καιρῷ ὑπερηφανιῶν ἀβοηθησίας — «во время надменных, когда нет помощи» (ὑπερηφανία — гордость, надменность; ἀβοηθησία — отсутствие помощи). αἰνέσω τὸ ὄνομά σου ἐνδελεχῶς — «буду хвалить имя Твоё непрестанно» (ἐνδελεχῶς — постоянно)."
  11: "εἰσηκούσθη ἡ δέησίς μου — «услышано было моление моё» (εἰσακούω — выслушивать; δέησις — моление). ἔσωσας γάρ με ἐξ ἀπωλείας — «ибо Ты спас меня от погибели». ἐξεῖλου με ἐκ καιροῦ πονηροῦ — «изъял меня из времени злого» (ἐξαιρέω; καιρός — время)."
  12: "διὰ τοῦτο ἐξομολογήσομαί σοι — «потому буду славить Тебя». αἰνέσω σε καὶ εὐλογήσω τῷ ὀνόματι κυρίου — «восхвалю Тебя и благословлю имя Господне» (εὐλογέω — благословлять; дательный τῷ ὀνόματι). Здесь закрывается молитва (「…」, открытая в ст. 1)."
  13: "Ἔτι ὢν νεώτερος — «ещё будучи юным» (νεώτερος — младший, юный). πρὶν ἢ πλανηθῆναί με — «прежде нежели я заблудился» (πλανάομαι — блуждать, заблуждаться). ἐζήτησα σοφίαν προφανῶς ἐν προσευχῇ μου — «я искал премудрости явно, в молитве моей» (προφανῶς — открыто, явно). С этого стиха — авторское свидетельство, без кавычек."
  14: "ἔναντι ναοῦ ἠξίουν περὶ αὐτῆς — «пред храмом я просил о ней» (ἀξιόω — просить, считать достойным; ἔναντι — перед). ἕως ἐσχάτων ἐκζητήσω αὐτήν — «до последних [дней] буду искать её» (ἔσχατα — последнее; ἐκζητέω — разыскивать)."
  15: "ἐξ ἄνθους ὡς περκαζούσης σταφυλῆς — «от цвета, как зреющей (темнеющей) виноградной грозди» (ἄνθος — цвет; περκάζω — темнеть, зреть; σταφυλή — гроздь). εὐφράνθη ἡ καρδία μου ἐν αὐτῇ — «возрадовалось сердце моё в ней» (εὐφραίνομαι — радоваться). ἐπέβη ὁ πούς μου ἐν εὐθύτητι — «ступила нога моя в правоте» (ἐπιβαίνω — вступать; εὐθύτης — прямота). ἐκ νεότητός μου ἴχνευον αὐτήν — «от юности моей я шёл по следам её» (ἴχνεύω — выслеживать, идти по следу)."
  16: "ἔκλινα ὀλίγον τὸ οὖς μου — «я немного преклонил ухо моё» (κλίνω — наклонять). ἐδεξάμην — «я принял» (δέχομαι). πολλὴν εὗρον ἐμαυτῷ παιδείαν — «много обрёл себе наставления» (παιδεία — наставление, учение)."
  17: "προκοπὴ ἐγένετό μοι ἐν αὐτῇ — «преуспеяние было мне в ней» (προκοπή — успех, продвижение). τῷ διδόντι μοι σοφίαν δώσω δόξαν — «дающему мне премудрость воздам славу» (δίδωμι — давать; δόξα — слава)."
  18: "διενοήθην γὰρ τοῦ ποιῆσαι αὐτήν — «ибо я помыслил исполнить её» (διανοέομαι — замышлять, разуметь; ποιέω — делать). ἐζήλωσα τὸ ἀγαθόν — «я возревновал о добром» (ζηλόω — ревновать, стремиться). οὐ μὴ αἰσχυνθῶ — «не постыжусь» (αἰσχύνομαι — стыдиться; οὐ μή — решительное отрицание)."
  19: "διαμεμάχισται ἡ ψυχή μου ἐν αὐτῇ — «душа моя подвизалась (сражалась) в ней» (διαμάχομαι — бороться, сражаться). ἐν ποιήσει νόμου διηκριβασάμην — «в исполнении закона я был точен (тщательно испытывал)» (ποίησις — исполнение; νόμος — закон; διακριβόω — тщательно исследовать). τὰς χεῖράς μου ἐξεπέτασα πρὸς ὕψος — «я простёр руки мои к высоте» (ἐκπετάννυμι — распростирать). τὰ ἀγνοήματα αὐτῆς ἐπένθησα — «о неведениях её я восплакал» (ἀγνόημα — неведение, ошибка; πενθέω — оплакивать)."
  20: "τὴν ψυχήν μου κατεύθυνα εἰς αὐτήν — «душу мою я направил к ней» (κατευθύνω — направлять). ἐν καθαρισμῷ εὗρον αὐτήν — «в очищении я обрёл её» (καθαρισμός — очищение). καρδίαν ἐκτησάμην μετ᾿ αὐτῆς ἀπ᾿ ἀρχῆς — «сердце я приобрёл с нею от начала» (κτάομαι — приобретать). διὰ τοῦτο οὐ μὴ ἐγκαταλειφθῶ — «потому не буду оставлен» (ἐγκαταλείπω — оставлять)."
  21: "ἡ κοιλία μου ἐταράχθη τοῦ ἐκζητῆσαι αὐτήν — «внутренность моя взволновалась, чтобы искать её» (κοιλία — чрево, внутренность; ταράσσω — волновать). διὰ τοῦτο ἐκτησάμην ἀγαθὸν κτῆμα — «потому приобрёл я доброе приобретение» (κτῆμα — стяжание, имущество): плеоназм сохранён."
  22: "ἔδωκεν κύριος γλῶσσάν μοι μισθόν μου — «Господь дал мне язык — награду мою» (γλῶσσα — язык; μισθός — награда, плата). ἐν αὐτῇ αἰνέσω αὐτόν — «в нём (языке) буду хвалить Его» (αἰνέω — хвалить)."
  23: "ἐγγίσατε πρός με, ἀπαίδευτοι — «приблизьтесь ко мне, неучёные» (ἐγγίζω — приближаться; ἀπαίδευτος — необученный, невежда). αὐλίσθητε ἐν οἴκῳ παιδείας — «поселитесь в доме наставления» (αὐλίζομαι — располагаться, ночевать; παιδεία — наставление). С этого стиха — приглашение к премудрости, авторский текст."
  24: "τί ὅτι ὑστερεῖσθαι λέγετε ἐν τούτοις — «что вы говорите, что терпите недостаток в этом» (ὑστερέω — недоставать, лишаться). αἱ ψυχαὶ ὑμῶν διψῶσι σφόδρα — «души ваши очень жаждут» (διψάω — жаждать)."
  25: "ἤνοιξα τὸ στόμα μου καὶ ἐλάλησα — «я открыл уста мои и сказал» (ἀνοίγω — открывать; λαλέω — говорить). Κτήσασθε ἑαυτοῖς ἄνευ ἀργυρίου — «приобретите себе без серебра» (κτάομαι — приобретать; ἄνευ — без; ἀργύριον — серебро): прямая речь внутри авторского текста, поэтому 「…」."
  26: "τὸν τράχηλον ὑμῶν ὑπόθετε ὑπὸ ζυγόν — «подложите выю вашу под иго» (τράχηλος — шея, выя; ὑποτίθημι — подкладывать; ζυγός — иго, ярмо). ἐπιδεξάσθω ἡ ψυχὴ ὑμῶν παιδείαν — «да примет душа ваша наставление» (ἐπιδέχομαι — принимать). ἐγγύς ἐστιν εὑρεῖν αὐτήν — «близко найти её» (ἐγγύς — близко)."
  27: "ἴδετε ἐν ὀφθαλμοῖς ὑμῶν — «увидьте своими глазами» (εἶδον; ὀφθαλμός — глаз). ὀλίγον ἐκοπίασα — «я немного потрудился» (κοπιάω — трудиться, утруждаться). εὗρον ἐμαυτῷ πολλὴν ἀνάπαυσιν — «обрёл себе великое успокоение» (ἀνάπαυσις — покой, отдохновение)."
  28: "μετάσχετε παιδείας ἐν πολλῷ ἀριθμῷ ἀργυρίου — «приобщитесь наставления за многое число серебра» (μετέχω — участвовать, приобщаться; ἀριθμός — число). πολὺν χρυσὸν κτήσασθε ἐν αὐτῇ — «много золота приобретите в ней» (κτάομαι)."
  29: "εὐφρανθείη ἡ ψυχὴ ὑμῶν ἐν τῷ ἐλέει αὐτοῦ — «да возрадуется душа ваша в милости Его» (εὐφραίνομαι — радоваться; ἔλεος — милость; оптатив). μὴ αἰσχυνθείητε ἐν αἰνέσει αὐτοῦ — «не постыдитесь в хвалении Его» (αἴνεσις — хваление)."
  30: "ἐργάζεσθε τὸ ἔργον ὑμῶν πρὸ καιροῦ — «делайте дело ваше прежде времени» (ἐργάζομαι — работать, делать; πρὸ καιροῦ — до срока, заранее). δώσει τὸν μισθὸν ὑμῶν ἐν καιρῷ αὐτοῦ — «Он даст награду вашу в своё время» (μισθός — награда)."
