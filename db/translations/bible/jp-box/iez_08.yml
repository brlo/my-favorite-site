# jp-box, Иезекииль, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 8 (совпадает), 18 стихов.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Глава 8: 1 дата и рука Господа; 2–4 видение мужа-огня и славы; 5–6 идол ревности
# у северных ворот; 7–13 пролом в стене, изображения, семьдесят старейшин и Иезония;
# 14–15 женщины, плачущие по Таммузу; 16–18 поклонение солнцу и ярость Господа.
# Голоса: 8:1–4, 7, 10–11, 14, 16 — авторское повествование без кавычек; 8:5, 6, 8, 9,
# 12, 13, 15 и 17–18 — 「…» (речь Господа; в 12 слова старейшин — 『…』). Вводные
# формулы «и сказал мне» — вне кавычек.
# Разные чтения: 8:1 месяц — по слав. шестой (LXX пятый); 8:16 — по слав. двадцать
# пять мужей (LXX «около двадцати»).
# csl-добавления (нет в LXX): 8:2 «видение зари», 8:3 «и образ ревности», 8:5 вторая
# половина стиха, 8:6 «дом израилев» и «обратився», 8:7 «и видех… скважня едина»,
# 8:9 «злая», 8:10 «всякое подобие гада и скота», 8:17 «обратишася разгневати мя»
# и «простирают лозу», 8:18 «воззовут… не услышу их» — в основном тексте без 〔…〕.
# Новые имена: タンムズ (Θαμμουζ), イエゾニア (Ιεζονιας), シャファン (Σαφαν).
# αιλαμ передано 玄関の間 (притвор), чтобы не смешивать с Еламом; αἴθριον — 家の開けた所.

