verses:
  1: "第六[だいろく]年[ねん]の第六[だいろく]の月[つき]、その月[つき]の五日[いつか]、わたしは自分[じぶん]の家[いえ]に座[すわ]っていた。ユダの長老[ちょうろう]たちがわたしの前[まえ]に座っていた。そのとき、主[しゅ]なる神[かみ]の御手[みて]がわたしの上[うえ]に臨[のぞ]んだ。"
  2: "わたしは見[み]た。見[み]よ、人[ひと]の姿[すがた]のようなものがあった。その腰[こし]から下[した]は火[ひ]であり、腰[こし]から上[うえ]は暁[あかつき]の光[ひかり]のようであり、琥珀[こはく]の輝[かがや]きのようであった。"
  3: "主[しゅ]は御手[みて]のようなものを伸[の]ばして、わたしの頭[あたま]の毛[け]をつかんだ。霊[れい]がわたしを地[ち]と天[てん]の間[あいだ]に持[も]ち上[あ]げ、神[かみ]の幻[まぼろし]のうちにエルサレムへ連[つ]れて行[い]き、北[きた]に面[めん]した内[うち]なる門[もん]の入口[いりぐち]に置[お]いた。そこには、ねたみを起[お]こさせる者[もの]の柱[はしら]と像[ぞう]があった。"
  4: "見[み]よ、そこにイスラエルの神[かみ]である主[しゅ]の栄光[えいこう]があった。わたしが平野[へいや]で見[み]た幻[まぼろし]と同[おな]じであった。"
  5: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、目[め]を北[きた]へ上[あ]げよ。」わたしが目[め]を北[きた]へ上[あ]げると、見[み]よ、北[きた]の方[ほう]、東[ひがし]に面[めん]した祭壇[さいだん]の門[もん]のところに、あのねたみの像[ぞう]が入口[いりぐち]にあった。"
  6: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、これらの者[もの]が何[なに]をしているか、見[み]たか。イスラエルの家[いえ]はここで大[おお]きな不法[ふほう]を行[おこな]い、わたしの聖[せい]なるものから遠[とお]ざかっている。さらに向[む]きを変[か]えれば、もっと大[おお]きな不法[ふほう]を見[み]るだろう。」"
  7: "主[しゅ]はわたしを庭[にわ]の入口[いりぐち]へ連[つ]れて行[い]った。わたしが見[み]ると、見[み]よ、壁[かべ]に一[ひと]つの穴[あな]があった。"
  8: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、壁[かべ]を掘[ほ]れ。」わたしが掘[ほ]ると、見[み]よ、一[ひと]つの戸[と]があった。"
  9: "主[しゅ]はわたしに言[い]われた。「入[はい]って、これらの者[もの]がここで行[おこな]っている悪[わる]い不法[ふほう]を見[み]よ。」"
  10: "わたしは入[はい]って見[み]た。見[み]よ、すべての這[は]うものと獣[けもの]の形[かたち]、空[むな]しい忌[い]まわしいもの、イスラエルの家[いえ]のすべての偶像[ぐうぞう]が、壁[かべ]の周[まわ]り一面[いちめん]に描[えが]かれていた。"
  11: "七十人[ななじゅうにん]の者[もの]が、イスラエルの家[いえ]の長老[ちょうろう]たちのうちからいた。その中[なか]に、シャファンの子[こ]イエゾニアが、彼[かれ]らの前[まえ]に立[た]っていた。おのおのの手[て]に香炉[こうろ]があり、香[こう]の煙[けむり]が立[た]ち上[のぼ]っていた。"
  12: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、イスラエルの家[いえ]の長老[ちょうろう]たちが、それぞれ自分[じぶん]の秘密[ひみつ]の寝室[しんしつ]で何[なに]をしているか、見[み]たか。彼[かれ]らは言[い]った。『主[しゅ]は見[み]ない。主[しゅ]は地[ち]を捨[す]てた』と。」"
  13: "主[しゅ]はわたしに言[い]われた。「さらに向[む]きを変[か]えれば、これらの者[もの]が行[おこな]っているもっと大[おお]きな不法[ふほう]を見[み]るだろう。」"
  14: "主[しゅ]はわたしを、主[しゅ]の家[いえ]の北[きた]に面[めん]した門[もん]の入口[いりぐち]へ連[つ]れて行[い]った。見[み]よ、そこに女[おんな]たちが座[すわ]ってタンムズのために泣[な]いていた。"
  15: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、見[み]たか。さらに、これらよりも大[おお]きな行[おこな]いを見[み]るだろう。」"
  16: "主[しゅ]はわたしを主[しゅ]の家[いえ]の内庭[ないてい]へ連[つ]れて行[い]った。見[み]よ、主[しゅ]の神殿[しんでん]の入口[いりぐち]、すなわち玄関[げんかん]の間[ま]と祭壇[さいだん]の間[あいだ]に、二十五人[にじゅうごにん]ほどの者[もの]がいた。彼[かれ]らは主[しゅ]の神殿[しんでん]に背[せ]を向[む]け、顔[かお]を東[ひがし]に向[む]けていた。彼[かれ]らは東[ひがし]の太陽[たいよう]を拝[おが]んでいた。"
  17: "主[しゅ]はわたしに言[い]われた。「人[ひと]の子[こ]よ、見[み]たか。ユダの家[いえ]にとって、ここで行[おこな]っている不法[ふほう]は小[ちい]さなことか。彼[かれ]らは地[ち]を不法[ふほう]で満[み]たし、わたしを怒[いか]らせるために向[む]きを変[か]えた。見[み]よ、彼[かれ]らはわたしを嘲[あざけ]るように枝[えだ]を差[さ]し伸[の]べている。"
  18: "わたしは怒[いか]りをもって彼[かれ]らに行[おこな]う。わたしの目[め]は惜[お]しまず、あわれまない。彼[かれ]らが大[おお]きな声[こえ]でわたしの耳[みみ]に呼[よ]ばわっても、わたしは聞[き]かない。」"

notes:
  1: "Καὶ ἐγένετο ἐν τῷ ἕκτῳ ἔτει — «и было в шестой год»; ἐν τῷ πέμπτῳ μηνὶ πέμπτῃ τοῦ μηνός — «в пятый месяц, в пятый день месяца»; слав. «в шестый месяц, в пятый день месяца» — шестой месяц по МТ; в тексте по слав., LXX-вариант (пятый месяц) отмечен. ἐγὼ ἐκαθήμην ἐν τῷ οἴκῳ — «я сидел в доме моём»; οἱ πρεσβύτεροι Ιουδα ἐκάθηντο ἐνώπιόν μου — «старейшины Иудейские сидели предо мною»; ἐγένετο ἐπ' ἐμὲ χεὶρ κυρίου — «была на мне рука Господа» (слав. «рука адоная Господа» — 主なる神の御手)."
  2: "ὁμοίωμα ἀνδρός — «подобие мужа» (ὁμοίωμα — подобие, вид); ἀπὸ τῆς ὀσφύος αὐτοῦ καὶ ἕως κάτω πῦρ — «от чресл его и донизу огонь» (ὀσφύς — чресла, 腰); ὡς ὅρασις ἠλέκτρου — «как видение электрона» (ἤλεκτρον — электрон, янтарь; слав. «илектр», 琥珀). Слав. добавляет «якоже видение зари» — нет в LXX; внесено (暁の光)."
  3: "καὶ ἐξέτεινεν ὁμοίωμα χειρὸς — «и простёр подобие руки»; ἀνέλαβέν με τῆς κορυφῆς μου — «взял меня за верх головы моей» (κορυφή — темя, 頭); ἀνέλαβέν με πνεῦμα ἀνὰ μέσον τῆς γῆς καὶ ἀνὰ μέσον τοῦ οὐρανοῦ — «поднял меня дух между землёй и небом»; ἐν ὁράσει θεοῦ — «в видении Божием» (神の幻). ἐπὶ τὰ πρόθυρα τῆς πύλης τῆς ἐσωτέρας τῆς βλεπούσης πρὸς βορρᾶν — «к преддверию внутренних ворот, обращённых к северу». ἡ στήλη τοῦ κτωμένου — «столп Приобретающего (Владеющего)»: тёмное место, вероятно, идол; слав. добавляет «и образ ревности» — нет в LXX (МТ), отсюда 像."
  4: "δόξα κυρίου θεοῦ Ισραηλ — «слава Господа Бога Израилева»; κατὰ τὴν ὅρασιν, ἣν εἶδον ἐν τῷ πεδίῳ — «по видению, которое я видел на поле» (πεδίον — равнина; ср. 1:1–3; 3:22–23)."
  5: "ἀνάβλεψον τοῖς ὀφθαλμοῖς σου πρὸς βορρᾶν — «подними глаза твои к северу» (ἀναβλέπω); ἀπὸ βορρᾶ ἐπὶ τὴν πύλην τὴν πρὸς ἀνατολάς — «с севера у ворот, обращённых к востоку». Слав. продолжает: «ко вратом зрящым на восток требника, идеже образ рвения сего во входе» — «у ворот, смотрящих на восток, жертвенника, где образ ревности сей при входе»; этой части в LXX нет (МТ), внесена без 〔…〕."
  6: "ἑώρακας τί οὗτοι ποιοῦσιν — «видел ли ты, что делают эти»; ἀνομίας μεγάλας ποιοῦσιν ὧδε — «великие беззакония делают здесь»; τοῦ ἀπέχεσθαι ἀπὸ τῶν ἁγίων μου — «чтобы удаляться от святынь Моих» (ἀπέχω — держаться вдали; смысл тёмен: они делают так, что Бог удаляется от святилища). Слав. добавляет «дом израилев» и «обратився» (イスラエルの家は…さらに向きを変えれば) — нет в LXX."
  7: "εἰσήγαγέν με ἐπὶ τὰ πρόθυρα τῆς αὐλῆς — «ввёл меня к преддверию двора» (αὐλή — двор). Слав. добавляет «и видех, и се, скважня едина в стене» — «и увидел: вот, одно отверстие в стене»; в LXX этого нет (стих обрывается), внесено без 〔…〕."
  8: "ὄρυξον — «прокопай» (ὀρύσσω — копать); ὤρυξα — «я прокопал»; θύρα μία — «одна дверь». Слав. «раскопай стену» добавляет «стену» — в LXX только «прокопай»."
  9: "Εἴσελθε καὶ ἰδὲ τὰς ἀνομίας — «войди и увидь беззакония»; ἃς οὗτοι ποιοῦσιν ὧδε — «которые они делают здесь». Слав. добавляет «злая» («беззакония злая») — нет в LXX (悪い不法)."
  10: "μάταια βδελύγματα — «пустые (суетные) мерзости» (μάταιος — пустой, суетный); πάντα τὰ εἴδωλα οἴκου Ισραηλ — «все идолы дома Израилева»; διαγεγραμμένα ἐπ' αὐτοῦ κύκλῳ — «начертанные на нём (на стене) кругом» (διαγράφω — рисовать, чертить). Слав. добавляет «всякое подобие гада и скота» — нет в LXX (МТ); внесено без 〔…〕."
  11: "ἑβδομήκοντα ἄνδρες ἐκ τῶν πρεσβυτέρων οἴκου Ισραηλ — «семьдесят мужей из старейшин дома Израилева»; Ιεζονιας ὁ τοῦ Σαφαν — «Иезония, сын Сафана» (евр. Яазания, сын Шафана; イエゾニア, シャファン); εἱστήκει πρὸ προσώπου αὐτῶν — «стоял перед лицом их»; θυμιατήριον — «кадильница, кадило» (香炉); ἡ ἀτμὶς τοῦ θυμιάματος — «пар (дым) курения» (ἀτμίς)."
  12: "ἐν τῷ κοιτῶνι τῷ κρυπτῷ αὐτῶν — «в спальне их тайной» (κοιτών — спальня, 寝室; κρυπτός — скрытый); διότι εἶπαν Οὐχ ὁρᾷ ὁ κύριος, ἐγκαταλέλοιπεν κύριος τὴν γῆν — «ибо сказали: не видит Господь, оставил Господь землю». Слова старейшин — вложенная речь 『…』."
  13: "Ἔτι ὄψει ἀνομίας μείζονας — «ещё увидишь беззакония большие»; слав. добавляет «обратися» («обратись») — нет в LXX; внесено (さらに向きを変えれば)."
  14: "γυναῖκες καθήμεναι θρηνοῦσαι τὸν Θαμμουζ — «женщины, сидящие и плачущие по Таммузу» (θρηνέω — оплакивать; Θαμμουζ — Таммуз, месопотамский бог растительности; слав. «фаммуз», タンムズ). Ворота дома Господня, обращённые к северу."
  15: "ἑώρακας; — «видел ли ты?»; ἔτι ὄψει ἐπιτηδεύματα μείζονα τούτων — «ещё увидишь дела большие этих» (ἐπιτήδευμα — занятие, дело; слав. «мерзости их»)."
  16: "εἰς τὴν αὐλὴν τὴν ἐσωτέραν — «во двор внутренний»; ἐπὶ τῶν προθύρων τοῦ ναοῦ — «у преддверия храма» (ναός — храм, 神殿); ἀνὰ μέσον τῶν αιλαμ καὶ ἀνὰ μέσον τοῦ θυσιαστηρίου — «между притвором (αιλαμ) и жертвенником»; αιλαμ — евр. אוּלָם, притвор, слав. «елам»; передано 玄関の間, чтобы не смешивать с Еламом. ὡς εἴκοσι ἄνδρες — «около двадцати мужей»; слав. «яко двадесять и пять мужей» — двадцать пять (МТ); в тексте по слав., LXX-вариант отмечен. τὰ ὀπίσθια αὐτῶν πρὸς τὸν ναόν — «спинами к храму»; προσκυνοῦσιν τῷ ἡλίῳ — «поклоняются солнцу»."
  17: "μὴ μικρὰ τῷ οἴκῳ Ιουδα — «разве мало дому Иудину»; ἔπλησαν τὴν γῆν ἀνομίας — «наполнили землю беззаконием». Слав. добавляет «и обратишася разгневати мя» («и обратились прогневлять Меня») — нет в LXX (МТ). ὡς μυκτηρίζοντες — «как бы насмехаясь» (μυκτηρίζω — издеваться, поднимать нос); слав. «простирают лозу аки ругающеся мне» — «протягивают ветвь, как бы глумясь надо Мной», добавление МТ; внесено без 〔…〕 (枝を差し伸べている)."
  18: "ποιήσω αὐτοῖς μετὰ θυμοῦ — «сделаю им с яростью»; οὐ φείσεται ὁ ὀφθαλμός μου, οὐδὲ μὴ ἐλεήσω — «не пощадит око Моё, и не помилую». Слав. добавляет «и воззовут во ушы мои гласом великим, и не услышу их» — нет в LXX (МТ); внесено без 〔…〕. Стих продолжает речь 8:17 (одна цитата)."
