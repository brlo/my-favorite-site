# jp-box, 3-я Маккавейская, глава 5. Черновик для приёмки.
#
# Нумерация — по Синодальному (ru, 36 стихов); текст — с греческого (gr-lxx-byz,
# 51 стих); карта книги — в шапке гл. 1. В этой главе соединены:
# 5:1 (gr 1+2), 5:2 (gr 3+4), 5:4 (gr 6+7+8), 5:5 (gr 9+10),
# 5:9 (gr 14+15+16), 5:14 (gr 21+22), 5:15 (gr 23+24), 5:18 (gr 27+28),
# 5:21 (gr 31+32), 5:22 (gr 33+34), 5:24 (gr 36+37+38), 5:25 (gr 39+40),
# 5:30 (gr 45+46). Кроме того gr 42 разделён между 5:27 и 5:28,
# а gr 49 — между 5:33 и 5:34. Остальные — один к одному.
#
# Содержание: царь велит напоить и разъярить пятьсот слонов (1–2); ночью
# служители вяжут иудеев (3), те молятся (4); молитва восходит на небо,
# Гермон доносит царю (5); Бог посылает царю сон (6–7); иудеи славят Бога (8);
# царь просыпается к пиру (9–10), спрашивает, почему иудеи живы (11–12),
# приказывает готовить слонов на завтра (13); все расходятся (14); утром
# слонов выводят (15), иудеи молятся (16), Гермон зовёт царя (17), но тот
# всё забыл (18–19), гневается и грозит Гермону (20–22); иудеи славят Бога
# (23); новый приказ (24), укор родственников (25–26), клятва царя (27–28);
# приготовления (29–30), выход (31–32), плач и молитва у врат ада (33–36).
# Прямая речь: 5:13 — царь в 「…」; 5:21 — его угроза Гермону в 「…」;
# 5:24 — приказ в 「…」; 5:25–26 — речь родственников в 「…」.
# 〔…〕 нет; сносок ⟨…⟩ нет. ru — только нумерация и понимание, его чтения
# в текст не вносятся (расхождения отмечены в notes).

