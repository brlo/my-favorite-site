verses:
  1: "そのとき王[おう]は、激[はげ]しい怒[いか]りと憤[いきどお]りに満[み]ち、いかなることであっても心[こころ]を変[か]えないまま、象[ぞう]の世話[せわ]を任[まか]されているヘルモンを呼[よ]び寄[よ]せ、明[あ]くる日[ひ]、五百頭[ごひゃくとう]の象[ぞう]すべてに、たっぷりの乳香[にゅうこう]の塊[かたまり]と多[おお]くの濃[こ]いぶどう酒[さけ]を飲[の]ませ、飲[の]み物[もの]の豊[ゆた]かさで荒[あ]れ狂[くる]わせたうえで、死[し]に定[さだ]められたユダヤ人[じん]たちに会[あ]わせるため連[つ]れて来[く]るよう命[めい]じた。"
  2: "そう命[めい]じると、王[おう]はユダヤ人[じん]に激[はげ]しく敵意[てきい]を抱[いだ]く友人[ゆうじん]たちと軍[ぐん]の者[もの]たちを集[あつ]めて、宴[うたげ]の席[せき]に向[む]かった。象[ぞう]の長[ちょう]であるヘルモンは、命[めい]じられたとおりにきちんとそれを実行[じっこう]した。"
  3: "その役[やく]の者[もの]たちは夕[ゆう]べに出[で]て行[い]き、苦[くる]しむ者[もの]たちの手[て]を縛[しば]り、彼[かれ]らに対[たい]するそのほかの安全[あんぜん]策[さく]を講[こう]じた。一晩[ひとばん]のうちにこの民[たみ]の滅[ほろ]びが決着[けっちゃく]すると考[かんが]えたからである。"
  4: "異邦人[いほうじん]たちには、ユダヤ人[じん]はあらゆる守[まも]りを失[うしな]った者[もの]に見[み]えた。四方[しほう]から鎖[くさり]で脅[おど]かされ、身動[みうご]きもできなかったからである。彼[かれ]らは全[すべ]て、涙[なみだ]とともにやむことのない叫[さけ]びをもって全能[ぜんのう]の主[しゅ]、すべての力[ちから]を治[おさ]める方[かた]、彼[かれ]らの憐[あわ]れみ深[ぶか]い神[かみ]、父[ちち]を呼[よ]び求[もと]めた。彼[かれ]らに逆[さから]う不敬[ふけい]な企[くわだ]てをそらし、大[おお]いなる顕現[けんげん]をもって、足[あし]もとに迫[せま]る死[し]から救[すく]い出[だ]してくださるよう願[ねが]ったのである。"
  5: "こうして彼[かれ]らの熱[ねつ]のこもった願[ねが]いは天[てん]に上[のぼ]った。一方[いっぽう]、ヘルモンは情[なさ]け容赦[ようしゃ]のない象[ぞう]たちに多[おお]くのぶどう酒[さけ]を飲[の]ませ、乳香[にゅうこう]を腹[はら]いっぱいに食[た]べさせると、夜明[よあ]けに宮廷[きゅうてい]へ来[き]て、そのことを王[おう]に報告[ほうこく]した。"
  6: "しかし、世[よ]の初[はじ]めからの善[よ]き被造物[ひぞうぶつ]、すなわち、夜[よる]も昼[ひる]も、与[あた]え主[ぬし]が望[のぞ]むすべての者[もの]に与[あた]えられる眠[ねむ]りの一部[いちぶ]が、王[おう]にも送[おく]られた。"
  7: "王[おう]は主[しゅ]の働[はたら]きによって、快[こころよ]く深[ふか]い眠[ねむ]りに捕[と]らわれた。彼[かれ]は不法[ふほう]な企[くわだ]てからはるかに外[はず]れ、変[か]わることのないと思[おも]っていた考[かんが]えからも大[おお]いに外[はず]れていたのである。"
  8: "ユダヤ人[じん]たちは、告[つ]げられていた時[とき]を逃[のが]れると、彼[かれ]らの聖[せい]なる神[かみ]を賛美[さんび]し、再[ふたた]び、和解[わかい]しやすい方[かた]が、その大[おお]いなる御手[みて]の力[ちから]を高慢[こうまん]な異邦人[いほうじん]たちに示[しめ]してくださるよう願[ねが]った。"
  9: "すでに十時[じゅうじ]の半[なか]ばごろ、招[まね]きの任[にん]にあたっていた者[もの]は、招[まね]かれた者[もの]たちがすでに集[あつ]まっているのを見[み]て、王[おう]のもとへ行[い]き、彼[かれ]を起[お]こした。ようやく目[め]を覚[さ]ました王[おう]に、宴[うたげ]の時[とき]がすでに過[す]ぎ去[さ]ろうとしていることを告[つ]げ、そのことを話[はな]した。王[おう]はそれを聞[き]き、酒宴[しゅえん]の席[せき]に移[うつ]り、宴[うたげ]に来[き]ていた者[もの]たちに、自分[じぶん]の真向[まむ]かいに横[よこ]たわるよう命[めい]じた。"
  10: "それがすむと、彼[かれ]は、自分[じぶん]たちを宴[うたげ]に委[ゆだ]ね、宴[うたげ]の今[いま]のひとときを大[おお]いに楽[たの]しんで喜[よろこ]びの中[なか]に過[す]ごすよう勧[すす]めた。"
  11: "話[はなし]がさらに進[すす]むと、王[おう]はヘルモンを呼[よ]び寄[よ]せ、激[はげ]しい脅[おど]しとともに、なぜユダヤ人[じん]たちが今日[きょう]という日[ひ]を生[い]き延[の]びるままにされたのか、その理由[りゆう]を問[と]いただした。"
  12: "ヘルモンは、まだ夜[よる]のうちに命[めい]じられたことを成[な]し遂[と]げたと申[もう]し、友人[ゆうじん]たちも彼[かれ]に証言[しょうげん]した。"
  13: "王[おう]はファラリスよりも残酷[ざんこく]な性[しょう]であった。彼[かれ]は言[い]った。「彼[かれ]らは今日[きょう]の眠[ねむ]りに感謝[かんしゃ]すべきである。明[あす]も同[おな]じように、無法[むほう]なユダヤ人[じん]たちを滅[ほろ]ぼすために象[ぞう]を用意[ようい]せよ。」"
  14: "王[おう]がこう言[い]うと、そこにいた者[もの]たちは皆[みな]、喜[よろこ]んで同意[どうい]し、それぞれ自分[じぶん]の家[いえ]へ帰[かえ]った。夜[よる]の時間[じかん]は眠[ねむ]りのためよりも、惨[みじ]めに見[み]える者[もの]たちに、あらゆる侮辱[ぶじょく]を考[かんが]え出[だ]すために費[つい]やされた。"
  15: "まだ夜明[よあ]けに鶏[にわとり]が鳴[な]くと、ヘルモンは獣[けもの]たちを武装[ぶそう]させ、大[おお]きな列柱[れっちゅう]の間[あいだ]を歩[ある]かせた。都[みやこ]の群衆[ぐんしゅう]は、その痛[いた]ましい光景[こうけい]を見[み]ようと、夜明[よあ]けを待[ま]ちわびながら急[いそ]いで集[あつ]まってきた。"
  16: "一方[いっぽう]、ユダヤ人[じん]たちは時[とき]を追[お]うごとに魂[たましい]を引[ひ]き裂[さ]かれながら、涙[なみだ]にむせぶ願[ねが]いを声[こえ]にのせ、天[てん]へ両手[りょうて]を伸[の]べて、大[おお]いなる神[かみ]が再[ふたた]び速[すみ]やかに彼[かれ]らを助[たす]けてくださるよう祈[いの]った。"
  17: "まだ日[ひ]の光[ひかり]が差[さ]し始[はじ]めないうちに、王[おう]が友人[ゆうじん]たちを待[ま]っていると、ヘルモンが進[すす]み出[で]て出発[しゅっぱつ]を促[うなが]し、王[おう]が望[のぞ]んでいることがすでに整[ととの]っていると告[つ]げた。"
  18: "王[おう]はその不法[ふほう]な出発[しゅっぱつ]を聞[き]いて驚[おどろ]き、すっかりわけが分[わ]からなくなって、いったい何事[なにごと]か、なぜそんなことが急[いそ]いで行[おこな]われたのかと尋[たず]ねた。これは、すべてを支配[しはい]する神[かみ]の働[はたら]きであった。神[かみ]は、以前[いぜん]に彼[かれ]自身[じしん]が企[くわだ]てたことを、心[こころ]から忘[わす]れさせておられたのである。"
  19: "ヘルモンと友人[ゆうじん]たちは皆[みな]、王[おう]よ、獣[けもの]たちも軍[ぐん]も、あなたの切実[せつじつ]な望[のぞ]みに従[したが]って準備[じゅんび]ができております、と答[こた]えた。"
  20: "王[おう]はその言葉[ことば]に激[はげ]しい怒[いか]りを満[み]たされた。神[かみ]の摂理[せつり]によって彼[かれ]の思[おも]いがすべて打[う]ち消[け]されていたからである。彼[かれ]は鋭[するど]い目[め]つきで脅[おど]しながら言[い]った。"
  21: "「おまえに父母[ふぼ]や子[こ]どもがあったなら、わたしは彼[かれ]らを野[の]の獣[けもの]たちの豊[ゆた]かな餌[えさ]にしてやっただろう。ユダヤ人[じん]たちは、わたしとわたしの祖先[そせん]たちに対して、申[もう]し分[ぶん]のない、完全[かんぜん]で確[たし]かな忠実[ちゅうじつ]を示[しめ]してきたというのに。わたしがおまえを幼[おさな]いころから育てた情[じょう]と、おまえの務[つと]めがなければ、おまえは彼[かれ]らの代[か]わりに命[いのち]を奪[うば]われていただろう。」"
  22: "こうしてヘルモンは、思[おも]いがけない危[あや]うい脅[おど]しを受[う]け、その目[め]つきも顔[かお]も縮[ちぢ]み上[あ]がった。友人[ゆうじん]たちはそれぞれ不機嫌[ふきげん]そうに退出[たいしゅつ]し、集[あつ]まっていた者[もの]たちをそれぞれの務[つと]めに帰[かえ]らせた。"
  23: "ユダヤ人[じん]たちは王[おう]の言葉[ことば]を聞[き]くと、輝[かがや]かしい神[かみ]、主[しゅ]、王[おう]の王[おう]を賛美[さんび]した。彼[かれ]らはこの助[たす]けをすでに得[え]ていたのである。"
  24: "王[おう]は同[おな]じ慣[なら]わしに従[したが]って、宴[うたげ]の一同[いちどう]を整[ととの]え、喜[よろこ]びにふけるよう勧[すす]めた。そしてヘルモンを呼[よ]び寄[よ]せ、脅[おど]しながら言[い]った。「この同[おな]じことを、あと何度[なんど]おまえに命[めい]じねばならないのか、この惨[みじ]めな者[もの]め。今[いま]すぐ象[ぞう]たちを武装[ぶそう]させ、明日[あす]のユダヤ人[じん]の滅[ほろ]びに備[そな]えよ。」"
  25: "ともに食卓[しょくたく]を囲[かこ]んでいた親族[しんぞく]たちは、彼[かれ]の心[こころ]の変[か]わりやすさに驚[おどろ]き、こう言[い]った。「王[おう]よ、いつまでわたしたちを分別[ふんべつ]のない者[もの]のように試[ため]すのですか。すでに三度[さんど]も彼[かれ]らを滅[ほろ]ぼせと命[めい]じながら、また実際[じっさい]になると、あなたが決[き]めたことを変[か]えて取[と]り消[け]すのですか。」"
  26: "そのために都[みやこ]は期待[きたい]にざわめき、群衆[ぐんしゅう]が集[あつ]まっては、しばしば略奪[りゃくだつ]の危険[きけん]にさえさらされているのです。"
  27: "それゆえ、あらゆる点[てん]でファラリスである王[おう]は、愚[おろ]かさを増[ふ]し加[くわ]え、ユダヤ人[じん]を顧[かえり]みようとして心[こころ]に生[しょう]じる変[か]わりを何[なに]とも思[おも]わず、"
  28: "きわめて不完全[ふかんぜん]な誓[ちか]いを固[かた]く立[た]てた。すなわち、彼[かれ]らをただちに黄泉[よみ]へ送[おく]り、獣[けもの]の膝[ひざ]と足[あし]で踏[ふ]みにじませ、ユダヤに攻[せ]め上[のぼ]って火[ひ]と槍[やり]ですっかり更地[さらち]にし、わたしたちには近[ちか]づくことのできない彼[かれ]らの聖所[せいしょ]を火[ひ]で焼[や]き払[はら]い、そこにいけにえを捧[ささ]げる者[もの]のない、永遠[えいえん]に荒[あ]れ果[は]てた所[ところ]とすると。"
  29: "そこで友人[ゆうじん]たちと親族[しんぞく]たちは大[おお]いに喜[よろこ]び、信頼[しんらい]し合[あ]って退出[たいしゅつ]し、都[みやこ]の最[もっと]も適切[てきせつ]な場所[ばしょ]に警護[けいご]の軍[ぐん]を配置[はいち]した。"
  30: "象[ぞう]の長[ちょう]は、獣[けもの]たちをいわば狂気[きょうき]の状態[じょうたい]にし、乳香[にゅうこう]を混[ま]ぜた香[かお]り高いぶどう酒[さけ]を飲[の]ませて、恐[おそ]ろしい装[よそお]いを整[ととの]えさせた。夜明[よあ]けごろ、都[みやこ]の競馬場[けいばじょう]が数[かぞ]え切[き]れない群衆[ぐんしゅう]で満[み]ちていると、彼[かれ]は宮廷[きゅうてい]に入[はい]り、王[おう]を促[うなが]して予定[よてい]のことを行[おこな]わせようとした。"
  31: "王[おう]は不敬[ふけい]な心[こころ]に激[はげ]しい怒[いか]りを満[み]たし、獣[けもの]たちとともに全[すべ]ての軍勢[ぐんぜい]を率[ひき]いて出[で]て行[い]った。傷[きず]つくことのない心[こころ]と目[め]で、名[な]を記[しる]された者[もの]たちの苦[くる]しく惨[みじ]めな滅[ほろ]びを眺[なが]めようと望[のぞ]んだのである。"
  32: "象[ぞう]たちが門[もん]のあたりから出[で]て来[き]、そのあとに武装[ぶそう]した軍[ぐん]と大[おお]きな群衆[ぐんしゅう]が続[つづ]いているのを見[み]、重[おも]く響[ひび]く騒[さわ]ぎを聞[き]いたユダヤ人[じん]たちは、"
  33: "それが自分[じぶん]たちの命[いのち]の最後[さいご]の瞬間[しゅんかん]であり、惨[みじ]めな期待[きたい]の終[お]わりだと考[かんが]え、嘆[なげ]きと泣[な]き声[ごえ]に変[か]わった。彼[かれ]らは互[たが]いに口[くち]づけし、親族[しんぞく]と抱[だ]き合[あ]い、首[くび]にすがりついた。父[ちち]は子[こ]に、母[はは]は娘[むすめ]に。"
  34: "ほかには、乳[ちち]を飲[の]む幼[おさな]い子[こ]を胸[むね]に抱[だ]き、その子[こ]が最後[さいご]の乳[ちち]を吸[す]う者[もの]もいた。"
  35: "それでも彼[かれ]らは、かつて天[てん]から受[う]けた助[たす]けを思[おも]い起[おこ]し、一斉[いっせい]に地[ち]に伏[ふ]し、幼[おさな]い子[こ]どもを胸[むね]から離[はな]して、"
  36: "非常[ひじょう]に大[おお]きな声[こえ]で叫[さけ]んだ。すべての力[ちから]の支配者[しはいしゃ]に、すでに黄泉[よみ]の門[もん]の前に立[た]っている彼[かれ]らを、顕現[けんげん]をもって憐[あわ]れんでくださるよう願[ねが]ったのである。"

notes:
  1: "СТИХ СОЕДИНЁН: gr 5:1+2. Царь призывает Гермона (1) и велит напоить пятьсот слонов (2). Ἕρμων — Гермон (ヘルモン), начальник слонов; δράκες λιβανωτοῦ — комки ладана; ἄκρατος οἶνος — неразбавленное вино; μόρος — смерть, гибель."
  2: "СТИХ СОЕДИНЁН: gr 5:3+4. Царь идёт на пир с друзьями (3), Гермон исполняет приказ (4). εὐωχία — пир; ἀραρότως — «точно, непреложно»; ἐλεφαντάρχης — слоновый начальник."
  3: "gr 5:5. λειτουργοί — служители; ἐδέσμευον — «связывали»; ἀσφάλεια — охрана; ἔννυχος — ночной."
  4: "СТИХ СОЕДИНЁН: gr 5:6+7+8. Иудеи кажутся лишёнными защиты (6), взывают к Богу (7), просят отвратить злой замысел (8). δυσκατάπαυστος βοή — «неумолкающий вопль»; μεγαλομερὴς ἐπιφάνεια — «великое явление»."
  5: "СТИХ СОЕДИНЁН: gr 5:9+10. Молитва восходит на небо (9), Гермон утром доносит царю (10). ἐκτενῶς — «усердно»; ἀνηλεεῖς ἐλέφαντες — «безжалостные слоны»."
  6: "gr 5:11. ἀπ᾽ αἰῶνος χρόνου κτίσμα καλόν — «доброе создание от начала времён» (о сне); χαριζόμενος — «дарующий»; ὕπνου μέρος — «часть сна»."
  7: "gr 5:12. ἡδύς — сладкий; βαθύς — глубокий; ἀθέσμως πρόθεσις — «беззаконное намерение»; ἀμετάθετος λογισμός — «непреложная мысль»."
  8: "gr 5:13. προσημασθεῖσα ὥρα — «предуказанный час»; εὐκατάλλακτος — «легко примиряющийся»; μεγαλοσθενής — «великой силы»."
  9: "СТИХ СОЕДИНЁН: gr 5:14+15+16. Десятый час, служитель будит царя (14), тот едва проснулся (15), велит возлечь (16). κλῆσις — приглашение; ἀθρόοι — «все вместе»; νύσσω — колоть, будить; ἀνακλῖναι — возлечь."
  10: "gr 5:17. γεραιρόμενοι — «радуясь, торжествуя»; εὐφροσύνη — веселье."
  11: "gr 5:18. μετὰ πικρᾶς ἀπειλῆς — «с горькой угрозой»; εἰάθησαν — «были оставлены (в живых)»; περιβεβιωκότες — «пережившие»."
  12: "gr 5:19. ὑποδείξαντος — «показавшего»; ἐπὶ τέλος ἀγειοχέναι — «довёл до конца»; προσμαρτυρησάντων — «засвидетельствовавших»."
  13: "gr 5:20. ὠμότης χείρων Φαλάριδος — «жестокость хуже Фаларида» (Фаларис — тиран Акраганта); χάριν ἔχειν — «быть благодарными»; ἀνυπερθέτως — «безотлагательно»."
  14: "СТИХ СОЕДИНЁН: gr 5:21+22. Все соглашаются и расходятся (21); ночь проходит в замыслах поруганий (22). ἐμπαιγμοί — издевательства, поругания."
  15: "СТИХ СОЕДИНЁН: gr 5:23+24. Крик петуха, Гермон выводит зверей (23); городские толпы собираются на зрелище (24). περίστυλος — колоннада; οἰκτροτάτη θεωρία — «жалостнейшее зрелище»."
  16: "gr 5:25. ἀμερὴς χρόνος — «неделимый (краткий) миг»; ψυχουλκούμενοι — «терзаемые душой»; πολύδακρυς ἱκετεία — «многоплачевная мольба»."
  17: "gr 5:26. ἡλίου βολαί — «лучи солнца»; ἐκδεχομένου — «ожидающего»; πρόθυμον — готовность, рвение."
  18: "СТИХ СОЕДИНЁН: gr 5:27+28. Царь изумлён и спрашивает (27); это Бог навёл на него забвение (28). ἄγνοια — неведение; λήθη — забвение; ἐντεθεικότος — «вложившего»."
  19: "gr 5:29. ὑπεδείκνυεν — «показывал, объяснял»; ἐκτενὴς πρόθεσις — «усердное намерение»."
  20: "gr 5:30. πληρωθεὶς βαρεῖ χόλῳ — «исполнившись тяжкой желчи (гнева)»; ἐνατενίσας — «уставившись»; ἀπειλή — угроза. Прямая речь начинается в 31."
  21: "СТИХ СОЕДИНЁН: gr 5:31+32. Угроза Гермону: родители и дети как пища зверям (31), жизнь его спасена лишь воспитанием и службой (32). θοίνη — пиршество, корм; ἀνέγκλητος — безупречный; συντροφία — совместное воспитание; χρεία — служба, нужда."
  22: "СТИХ СОЕДИНЁН: gr 5:33+34. Гермон в страхе съёживается (33); друзья расходятся (34). συστέλλω — сжимать; σκυθρωπῶς — мрачно; ἀσχολία — занятие."
  23: "gr 5:35. ἐπιφανής — «явленный, славный»; βασιλεὺς τῶν βασιλέων — Царь царей."
  24: "СТИХ СОЕДИНЁН: gr 5:36+37+38. Новый пир (36), вызов Гермону и брань (37), приказ готовить слонов (38). ποσάκις — сколько раз; ἀθλιώτατος — жалчайший; καθόπλισον — вооружи, приготовь."
  25: "СТИХ СОЕДИНЁН: gr 5:39+40. Родственники удивляются непостоянству (39) и говорят: «доколе… в третий раз» (40). ἄστατος διάνοια — «неустойчивый ум»; ἄλογοι — бессмысленные; διαπειράζεις — «искушаешь»; ἐκ μεταβολῆς ἀναλύων — «отменяя по перемене»."
  26: "gr 5:41. ὀχλεῖ — «волнуется, теснится»; συστροφαί — сборища; διαρπασθῆναι — «быть разграбленным»."
  27: "gr 5:42 (начало). κατὰ πάντα Φάλαρις — «во всём Фаларис»; ἐμπλησθεὶς ἀλογιστίας — «исполнившись безрассудства»; ἀτελέστατος ὅρκος — «самая несовершенная клятва»; ὁρισάμενος — «определив»."
  28: "gr 5:42 (конец)+43. Продолжение клятвы: послать в ад, изувеченных зверями (42), опустошить Иудею и сжечь святилище (43). ἐπιστρατεύσαντα — «пойдя войной»; ἰσόπεδον — «вровень с землёй»; πρηνής — «ниспровергнутый»; ἔρημος — пустой."
  29: "gr 5:44. περιχαρεῖς — «весьма радостные»; μετὰ πίστεως — «с уверенностью»; τήρησις — охрана."
  30: "СТИХ СОЕДИНЁН: gr 5:45+46. Гермон приводит слонов в бешенство (45) и утром зовёт царя (46). κατάστεμα μανιῶδες — «безумное состояние»; λελιβανωμένος — «умащённый ладаном»; ὤτρυνε — «побуждал»."
  31: "gr 5:47. δυσσεβὴς φρήν — «нечестивый ум»; ἀτρώτῳ καρδίᾳ — «с неранимым (бесчувственным) сердцем»; ἐπίπονος — тяжкий; καταστροφή — погибель."
  32: "gr 5:48. κονιορτός — пыль; βαρυηχὴς θόρυβος — «тяжко звучащий шум»; συνεπομένη ἔνοπλος δύναμις — «сопровождающее вооружённое войско»."
  33: "gr 5:49 (начало). ὑστάτη ῥοπὴ βίου — «последний предел жизни»; οἶκτος — плач, сетование; περιπλεκόμενοι — «обвиваясь»; ἐπιπίπτοντες ἐπὶ τοὺς τραχήλους — «бросаясь на шеи»."
  34: "gr 5:49 (конец). νεογνά — новорождённые; βρέφη τελευταῖον ἕλκοντα γάλα — «младенцы, сосущие последнее молоко»."
  35: "gr 5:50. ἀντιλήμψεις ἐξ οὐρανοῦ — «заступления с неба»; πρηνεῖς ῥίψαντες ἑαυτούς — «повергшись ниц»; χωρίσαντες τῶν μαστῶν — «отняв от груди»."
  36: "gr 5:51. δυνάστης ἁπάσης δυνάμεως — «Владыка всякой силы»; ἱκετεύοντες οἰκτῖραι — «умоляя помиловать»; πύλαι ᾅδου — врата ада."
