verses:
  1: "エフライムの山[やま]の者[もの]で、名[な]をミカという人[ひと]がいた。"
  2: "彼[かれ]は母[はは]に言[い]った。「あなたから取[と]られ、あなたがわたしの耳[みみ]もとで呪[のろ]って言った、あの千百[せんひゃく]の銀[ぎん]は、見[み]よ、わたしのところにあります。わたしが取ったのです。」母は言った。「わが子[こ]よ、主[しゅ]に祝福[しゅくふく]されますように。」"
  3: "彼[かれ]はその千百[せんひゃく]の銀[ぎん]を母[はは]に返[かえ]した。母は言[い]った。「わたしはこの銀を、わたしの手[て]から、もっぱら彫[ほ]り物[もの]と鋳物[いもの]を造[つく]るために、主[しゅ]に聖別[せいべつ]した。今[いま]、それをあなたに返し、あなたに渡[わた]そう。」"
  4: "彼[かれ]は銀[ぎん]を母[はは]に渡[わた]した。母はその銀の二百[にひゃく]を取[と]り、鋳物師[いものし]に与[あた]えた。彼はそれで彫[ほ]り物[もの]と鋳物[いもの]を造[つく]り、それはミカの家[いえ]に置[お]かれた。"
  5: "この人[ひと]ミカには神[かみ]の家[いえ]があった。彼[かれ]はエフォドとテラフィム⟨家[いえ]の神々[かみがみ]として祀[まつ]られた像[ぞう]。⟩を造[つく]り、息子[むすこ]の一人[ひとり]の手[て]を満[み]たして、祭司[さいし]とした。"
  6: "そのころ、イスラエルには王がなかった。おのおの自分[じぶん]が見[み]て正[ただ]しいと思[おも]うことを行[おこな]っていた。"
  7: "ユダの氏族[しぞく]に属[ぞく]する、ベツレヘム・ユダの町[まち]の若者[わかもの]がいた。彼[かれ]はレビ人[びと]であり、その地[ち]に寄留[きりゅう]していた。"
  8: "この人[ひと]は、寄留[きりゅう]する所[ところ]を求[もと]めて、ユダの町[まち]、ベツレヘムから旅立[たびだ]った。彼[かれ]は道[みち]を行[い]くうちに、エフライムの山[やま]のミカの家[いえ]まで来[き]た。"
  9: "ミカは彼[かれ]に言[い]った。「あなたはどこから来[き]たのか。」彼は言った。「わたしはユダのベツレヘムから来たレビ人[びと]で、寄留[きりゅう]する所[ところ]を求[もと]めて行[い]くところです。」"
  10: "ミカは彼[かれ]に言[い]った。「わたしのもとに住[す]んで、わたしの父[ちち]となり、祭司[さいし]となってほしい。わたしはあなたに一年[いちねん]につき十[じゅう]シケルの銀[ぎん]と、ひとそろいの衣服[いふく]と、あなたの暮[く]らしに必要[ひつよう]なものを与[あた]えよう。」レビ人[びと]は行[い]った。"
  11: "そして彼[かれ]のところに寄留[きりゅう]し始[はじ]めた。若者[わかもの]は彼の息子[むすこ]の一人[ひとり]のようになった。"
  12: "ミカはレビ人[びと]の手[て]を満[み]たし、若者[わかもの]は彼[かれ]の祭司[さいし]となって、ミカの家[いえ]にいた。"
  13: "ミカは言[い]った。「今[いま]、レビ人[びと]がわたしの祭司[さいし]になったのだから、主[しゅ]がわたしに善[よ]いことをしてくださったことを知[し]った。」"

notes:
  1: "ἐγένετο — «был» (обычное начало рассказа, ср. 17:7). ἐξ ὄρους Εφραιμ — «с горы Ефремовой», т. е. родом оттуда. ὄνομα αὐτῷ Μιχα — «имя ему Миха» (датив possessivus)."
  2: "Χιλίους καὶ ἑκατὸν ἀργυρίου — «тысячу сто серебра» (ἀργύριον — серебро, деньги; сикли не названы, в масор. и ru — «сикли»). τοὺς λημφθέντας σοι — «взятые у тебя». ἐξώρκισας — «закляла, произнесла заклятие (проклятие)» (ἐξορκίζω; слав. «заклинала мя еси»), не просто «сказала». ἐν τοῖς ὠσίν μου — «в ушах моих», т. е. в его присутствии. Εὐλογημένος ὁ υἱός μου τῷ κυρίῳ — «благословен сын мой Господу» (датив отношения; слав. «благословен сын мой Господеви»)."
  3: "Ἁγιασμῷ ἡγίασα — букв. «освящением освятила», гебраизм (inf. absolutus): твёрдо посвятила. κατὰ μόνας — «особо, исключительно» (слав. понял иначе: «тебе, сынови моему, сотворити»). γλυπτὸν καὶ χωνευτόν — «изваянное и литое»: резной идол и литой кумир. ἐπιστρέψω … ἀποδώσω — «возвращу… отдам»."
  4: "Ст. 4 в LXX повторяет начало ст. 3 (ἀπέδωκεν τὸ ἀργύριον): возврат серебра описан дважды — не сглаживаем. διακοσίους — двести (из тысячи ста). χωνευτής — плавильщик, литейщик. ἐγένετο ἐν τῷ οἴκῳ Μιχα — «было в доме Михи»."
  5: "αὐτῷ οἶκος θεοῦ — «у него дом Божий», т. е. домашнее святилище. ἐφουδ καὶ θεραφιν — エフォド и テラフィム: ефод (жреческое облачение/орудие) и терафимы — домашние идолы; テラフィム — первый раз в корпусе, отсюда сноска. ἐνέπλησεν τὴν χεῖρα — букв. «наполнил руку» — посвятил в сан (ср. Исх 29:9; в корпусе 手を満たす). εἰς ἱερέα — «в священника»; ἱερεύς здесь о незаконном частном жреце — 祭司, как в корпусе."
  6: "ἐν ταῖς ἡμέραις ἐκείναις οὐκ ἦν βασιλεὺς ἐν Ισραηλ — «в те дни не было царя в Израиле» (формула книги, ср. 18:1; 19:1; 21:25). ἀνὴρ τὸ ἀγαθὸν ἐν ὀφθαλμοῖς αὐτοῦ ἐποίει — «каждый делал доброе в глазах своих»; передано по формуле брифа."
  7: "παιδάριον — «юноша» (не дитя); здесь о левите. ἐκ Βηθλεεμ δήμου Ιουδα ἐκ τῆς συγγενείας Ιουδα — двойное «Иуда»: «из Вифлеема, [города] племени Иуды, из рода Иудина»; левит жил в иудейском городе, потому что левиты не имели своего удела. παρῴκει — «жил пришельцем» (寄留). καὶ αὐτὸς Λευίτης — «и сам он левит»."
  8: "παροικεῖν οὗ ἐὰν εὕρῃ — «жить пришельцем, где найдёт (место)». ἕως οἴκου Μιχα — «до дома Михи». τοῦ ποιῆσαι τὴν ὁδὸν αὐτοῦ — «чтобы совершить путь свой», т. е. в пути."
  9: "Πόθεν ἔρχῃ — «откуда идёшь?» (вопрос Михи). Λευίτης ἐγώ εἰμι — «я левит»; ἐκ Βηθλεεμ Ιουδα — из Вифлеема Иудина. πορεύομαι παροικεῖν — «иду жить пришельцем»."
  10: "Κάθου μετ᾿ ἐμοῦ — «сядь (останься) со мною». εἰς πατέρα καὶ εἰς ἱερέα — «в отца и в священника»: «отец» — почётный титул покровителя/наставника (ср. 18:19). δέκα ἀργυρίου εἰς ἡμέρας — «десять серебра на дни», т. е. в год (слав. «в год»). ζεῦγος ἱματίων — «пара одежд»,ひとそろい. τὰ πρὸς τὸ ζῆν — «на прожитие». καὶ ἐπορεύθη ὁ Λευίτης в греч. относится к ст. 10 (в csl — начало ст. 11), поэтому стих кончается «Левит пошёл»."
  11: "ἤρξατο παροικεῖν παρὰ τῷ ἀνδρί — «начал жить у мужа» (в csl это начало ст. 11, после «и пойде левит»). ὡς εἷς τῶν υἱῶν αὐτοῦ — «как один из сыновей его»."
  12: "ἐνέπλησεν Μιχα τὴν χεῖρα τοῦ Λευίτου — «наполнил руку левита», т. е. посвятил его (ср. ст. 5). ἦν ἐν τῷ οἴκῳ Μιχα — «был в доме Михи»."
  13: "Νῦν ἔγνων — «теперь я узнал» (аорист; слав. «ныне уведех»). ἠγαθοποίησέν με κύριος — «Господь облагодетельствовал меня»; в ru «будет благотворить» — сглаживание аориста. ὅτι ἐγενήθη μοι ὁ Λευίτης εἰς ἱερέα — «потому что левит стал мне священником»."
