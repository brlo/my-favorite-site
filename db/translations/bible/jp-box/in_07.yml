# jp-box, Евангелие от Иоанна, глава 7.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 7: братья зовут Иисуса в Иудею (1–9), Он тайно идёт на праздник (10–13),
# учит в храме в середине праздника (14–24), споры о том, Христос ли Он (25–31),
# попытка схватить Его (32–36), последний день праздника и живая вода (37–39),
# разделение в народе (40–44), Никодим (45–52), начало отрывка о жене (53).
