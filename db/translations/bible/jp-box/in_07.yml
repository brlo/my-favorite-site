verses:
  1: "その後[のち]、イエスはガリラヤを巡[めぐ]っておられた。ユダヤ人[じん]たちがイエスの命[いのち]を狙[ねら]っていたので、ユダヤを巡[めぐ]ることをお望[のぞ]みにならなかったからである。"
  2: "ユダヤ人[じん]の祭[まつ]りである仮庵祭[かりいおのまつり]⟨野[の]で仮[かり]の小屋[こや]に住[す]み、荒[あ]れ野[の]の旅[たび]を思[おも]い起[こ]こすユダヤの祭[まつ]り。⟩が近[ちか]づいていた。"
  3: "そこで、イエスの兄弟[きょうだい]たちが言[い]った。「ここを去[さ]ってユダヤへ行[い]き、あなたの弟子[でし]たちにも、あなたがなさっている業[わざ]を見[み]させなさい。"
  4: "自分[じぶん]を公[おおやけ]に現[あらわ]そうと思[おも]う者[もの]は、隠[かく]れて事[こと]を行[おこな]わない。もしこれらのことをなさるなら、ご自身[じしん]を世[よ]に現[あらわ]しなさい。」"
  5: "兄弟[きょうだい]たちもまた、イエスを信[しん]じていなかったからである。"
  6: "イエスは彼[かれ]らに言[い]われた。「<j>わたしの時[とき]はまだ来[き]ていない。しかし、あなたがたの時[とき]はいつでも備[そな]わっている。</j>"
  7: "<j>世[よ]はあなたがたを憎[にく]むことはできないが、わたしを憎[にく]む。わたしが、世[よ]の業[わざ]が悪[わ]いと証[あかし]しているからである。</j>"
  8: "<j>あなたがたはこの祭[まつ]りに上[のぼ]りなさい。わたしはこの祭[まつ]りには上[のぼ]らない。わたしの時[とき]がまだ満[み]ちていないからである。</j>」"
  9: "こうしたことを語[かた]り終[お]えてから、イエスはガリラヤにとどまられた。"
  10: "兄弟[きょうだい]たちが祭[まつ]りに上[のぼ]った後[のち]、イエスも上[のぼ]られた。公[おおやけ]にではなく、隠[かく]れてであった。"
  11: "祭[まつ]りの間[あいだ]、ユダヤ人[じん]たちはイエスを捜[さが]して、「あの人[ひと]はどこにいるのか」と言[い]っていた。"
  12: "群衆[ぐんしゅう]の間[あいだ]には、イエスのことで多[おお]くのつぶやきがあった。ある者[もの]は「よい人[ひと]だ」と言[い]い、ほかの者[もの]は「いや、群衆[ぐんしゅう]を惑[まど]わしているのだ」と言[い]った。"
  13: "しかし、ユダヤ人[じん]たちを恐[おそ]れて、イエスのことを公然[こうぜん]と語[かた]る者[もの]はだれもいなかった。"
  14: "祭[まつ]りも半[なか]ばになったころ、イエスは神殿[しんでん]に上[のぼ]って教[おし]え始[はじ]められた。"
  15: "ユダヤ人[じん]たちは驚[おどろ]いて言[い]った。「この人[ひと]は学[まな]んだことがないのに、どうして書[しょ]に通[つう]じているのか。」"
  16: "イエスは答[こた]えて言[い]われた。「<j>わたしの教[おし]えはわたしのものではなく、わたしを遣[つか]わした方[かた]のものである。</j>"
  17: "<j>だれでも、その方[かた]の御心[みこころ]を行[おこな]おうと望[のぞ]む者[もの]は、この教[おし]えが神[かみ]から出[で]たものか、それともわたしが自分[じぶん]から語[かた]っているのかを知[し]る。</j>"
  18: "<j>自分[じぶん]から語[かた]る者[もの]は自分[じぶん]の栄光[えいこう]を求[もと]める。しかし、自分[じぶん]を遣[つか]わした方[かた]の栄光[えいこう]を求[もと]める者[もの]は真実[しんじつ]であり、その人[ひと]のうちに不義[ふぎ]はない。</j>"
  19: "<j>モーセはあなたがたに律法[りっぽう]を与[あた]えたではないか。それなのに、あなたがたのうちだれも律法[りっぽう]を守[まも]っていない。なぜ、わたしを殺[ころ]そうとするのか。</j>」"
  20: "群衆[ぐんしゅう]は答[こた]えて言[い]った。「あなたには悪霊[あくりょう]が憑[つ]いている。だれがあなたを殺[ころ]そうとするのか。」"
  21: "イエスは答[こた]えて言[い]われた。「<j>わたしは一[ひと]つの業[わざ]を行[おこな]った。あなたがたは皆[みな]、それを不思議[ふしぎ]に思[おも]っている。</j>"
  22: "<j>それゆえ、モーセはあなたがたに割礼[かつれい]を授[さず]けた（それはモーセから出[で]たのではなく、先祖[せんぞ]たちから出[で]たものである）。そして、あなたがたは安息日[あんそくび]にも人[ひと]に割礼[かつれい]を施[ほどこ]している。</j>"
  23: "<j>モーセの律法[りっぽう]が破[やぶ]られないように、安息日[あんそくび]にも人[ひと]が割礼[かつれい]を受[う]けるのなら、わたしが安息日[あんそくび]に人[ひと]を全身[ぜんしん]健[すこ]やかにしたからといって、なぜわたしに怒[いか]るのか。</j>"
  24: "<j>うわべで裁[さば]いてはならない。正[ただ]しい裁[さば]きで裁[さば]きなさい。</j>」"
  25: "すると、エルサレムの人[ひと]たちのうちのある者[もの]たちが言[い]った。「これは、あの人[ひと]たちが殺[ころ]そうとしている者[もの]ではないか。"
  26: "見[み]なさい。公然[こうぜん]と語[かた]っているのに、だれも何[なに]も言[い]わない。もしかすると、指導者[しどうしゃ]たちは、この人[ひと]がキリストであると本当[ほんとう]に認[みと]めたのだろうか。"
  27: "だが、この人[ひと]がどこから来[き]たかは、わたしたちが知[し]っている。キリストが来[く]る時[とき]は、だれもそのどこから来[く]るかを知[し]らないはずだ。」"
  28: "そこでイエスは、神殿[しんでん]で教[おし]えながら、大声[おおごえ]で言[い]われた。「<j>あなたがたはわたしを知[し]っており、わたしがどこから来[き]たかも知[し]っている。しかし、わたしは自分[じぶん]から来[き]たのではない。わたしを遣[つか]わした方[かた]は真実[しんじつ]であり、あなたがたはその方[かた]を知[し]らない。</j>"
  29: "<j>わたしはその方[かた]を知[し]っている。わたしはその方[かた]から出[で]ており、その方[かた]がわたしを遣[つか]わしたからである。</j>」"
  30: "そこで人々[ひとびと]はイエスを捕[と]らえようとしたが、だれも手[て]をかける者[もの]はいなかった。イエスの時[とき]がまだ来[き]ていなかったからである。"
  31: "群衆[ぐんしゅう]のうちの多[おお]くの者[もの]がイエスを信[しん]じて言[い]った。「キリストが来[く]る時[とき]、この人[ひと]が行[おこな]ったより多[おお]くのしるしを行[おこな]うだろうか。」"
  32: "ファリサイ派[は]の人々[ひとびと]は、群衆[ぐんしゅう]がイエスのことでこのようにつぶやいているのを聞[き]いた。そこで祭司長[さいしちょう]たちとファリサイ派[は]の人々[ひとびと]は、イエスを捕[と]らえようと下役[したやく]たちを遣[つか]わした。"
  33: "イエスは言[い]われた。「<j>わたしはまだしばらく、あなたがたと一緒[いっしょ]にいて、わたしを遣[つか]わした方[かた]のもとへ行[い]く。</j>"
  34: "<j>あなたがたはわたしを捜[さが]すが見[み]つからず、わたしがいる所[ところ]へは来[く]ることができない。</j>」"
  35: "ユダヤ人[じん]たちは互[たが]いに言[い]った。「わたしたちが見[み]つけられないとは、この人[ひと]はどこへ行[い]こうとしているのか。ギリシア人[じん]の間[あいだ]に散[ち]っている者[もの]たちのもとへ行[い]って、ギリシア人[じん]を教[おし]えるつもりなのだろうか。"
  36: "『あなたがたはわたしを捜[さが]すが見[み]つからず、わたしがいる所[ところ]へは来[く]ることができない』とは、どういう言葉[ことば]なのか。」"
  37: "祭[まつ]りの末[すえ]の大[おお]いなる日[ひ]に、イエスは立[た]って、大声[おおごえ]で言[い]われた。「<j>だれでも渇[かわ]いている者[もの]は、わたしのもとへ来[き]て飲[の]みなさい。</j>"
  38: "<j>わたしを信[しん]じる者[もの]は、聖書[せいしょ]に言[い]われているとおり、その腹[はら]から生[い]ける水[みず]の川[かわ]が流[なが]れ出[で]る。</j>」"
  39: "これは、イエスを信[しん]じた者[もの]たちが受[う]けようとしていた{聖霊[せいれい]|聖神[せいしん]}について言[い]われたのである。まだ{聖霊[せいれい]|聖神[せいしん]}がなく、イエスがまだ栄光[えいこう]を受[う]けておられなかったからである。"
  40: "群衆[ぐんしゅう]のうちのある者[もの]たちは、この言葉[ことば]を聞[き]いて言[い]った。「この人[ひと]は本当[ほんとう]に、あの預言者[よげんしゃ]だ。」"
  41: "ほかの者[もの]たちは「この人[ひと]こそキリストだ」と言[い]った。またある者[もの]たちは言[い]った。「キリストがガリラヤから来[く]るはずがあるだろうか。"
  42: "聖書[せいしょ]は、キリストがダビデの子孫[しそん]から、ダビデがいたベツレヘムという村[むら]から来[く]ると言[い]っているではないか。」"
  43: "こうして、群衆[ぐんしゅう]の間[あいだ]にイエスのことで分裂[ぶんれつ]が起[お]こった。"
  44: "ある者[もの]たちはイエスを捕[と]らえようと思[おも]ったが、だれも手[て]をかける者[もの]はいなかった。"
  45: "下役[したやく]たちが祭司長[さいしちょう]たちとファリサイ派[は]の人々[ひとびと]のもとへ戻[もど]ると、彼[かれ]らは言[い]った。「なぜ、あの人[ひと]を連[つ]れて来[こ]なかったのか。」"
  46: "下役[したやく]たちは答[こた]えた。「あのように語[かた]った人[ひと]は、かつてない。」"
  47: "そこでファリサイ派[は]の人々[ひとびと]が答[こた]えた。「あなたがたも惑[まど]わされたのか。"
  48: "指導者[しどうしゃ]たちやファリサイ派[は]の人々[ひとびと]のうち、あの人[ひと]を信[しん]じた者[もの]が一人[ひとり]でもいるか。"
  49: "この群衆[ぐんしゅう]は律法[りっぽう]を知[し]らない者[もの]ばかりで、呪[のろ]われているのだ。」"
  50: "彼[かれ]らの一人[ひとり]で、以前[いぜん]にイエスのもとへ来[き]たニコデモが言[い]った。"
  51: "「わたしたちの律法[りっぽう]は、まずその人[ひと]の言[い]い分[ぶん]を聞[き]き、何[なに]をしているかを知[し]ったうえでなければ、その人[ひと]を裁[さば]かないではないか。」"
  52: "彼[かれ]らは答[こた]えて言[い]った。「あなたもガリラヤから来[き]たのか。調[しら]べて見[み]るがよい。預言者[よげんしゃ]はガリラヤからは起[こ]らない。」"
  53: "そこで、それぞれ自分[じぶん]の家[いえ]へ帰[かえ]った。"

notes:
  1: "περιεπάτει — имперфект «ходил»; 巡っておられた. ὅτι ἐζήτουν ἀποκτεῖναι — «ибо искали убить Его»; 命を狙っていた."
  2: "Сноска на 仮庵祭: первое упоминание в корпусе, реалия неочевидна. σκηνοπηγία — «поставление кущей»."
  6: "καιρός — «срок, время» (не χρόνος); 時. Противопоставление «Мой срок — ваш срок» сохранено."
  8: "В критической базе οὐκ ἀναβαίνω; часть рукописей (в том числе Textus Receptus) читает οὔπω — «ещё не». Оставлено чтение базы: 上らない. Дальше, в 10-м стихе, Он всё же идёт."
  15: "γράμματα — «буквы», то есть книги, Писание, учёность; 書. Не «грамота» в бытовом смысле: речь о знании Писания."
  22: "В скобках — пояснение евангелиста, что обрезание установлено не Моисеем, а патриархами. По-японски 全角括弧, как в Мк 7:3."
  39: "οὔπω γὰρ ἦν πνεῦμα — буквально «ибо ещё не было Духа»; передано без сглаживания (у jp-joc «聖神未だ降らざりき» — уже толкование). Единственное место с калькой {聖霊|聖神} в главах 7–9."
  37: "Последний, великий день праздника — восьмой день Кущей; в эти дни совершали возлияние воды, что стоит за словами о живой воде. В текст ничего не добавлено."
  38: "καθὼς εἶπεν ἡ γραφή может относиться и к вере, и к рекам; порядок греческого сохранён: 聖書に言われているとおり стоит при «верующем»."
  40: "ὁ προφήτης с артиклем — ожидаемый Пророк (Втор 18:15); あの預言者."
  50: "В греческом стих 50 заканчивается запятой, речь Никодима начинается в 51-м; так же и по-японски."
  53: "Начало отрывка 7:53–8:11. В критическом издании он стоит под скобками, но в базе сайта (gr-lxx-byz) присутствует, поэтому целиком в 〔…〕 не оборачивается; в NA отрывок под скобками — отмечено для ревью."
