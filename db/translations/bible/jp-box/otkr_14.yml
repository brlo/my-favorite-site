# jp-box, Откровение Иоанна, глава 14. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 14: 144 000 на Сионе и новая песнь (1–5); три ангела и суд (6–13);
# жатва и сбор винограда (14–20).
# Красного нет: прямых слов Христа в главе нет. Голос с неба в 14:13 — не Христос,
# поэтому 「」 без <j> (отмечено в notes). Речи ангелов — 「」, не красные.
# 〔…〕: 14:5 — церковное ἐνώπιον τοῦ θρόνου τοῦ θεοῦ (проверено: θρονου в базе НЕТ).
# 14:12 — TR добавляет второе ὧδε, но Елизаветинская, Синодальный и jp-joc его не читают,
# поэтому не добавлено; 〔〕 нет.
# Сносок ⟨…⟩ нет: シオン, バビロン, 鎌, 初穂 — обычные слова или уже в корпусе.
# jp-ni не использовался.

