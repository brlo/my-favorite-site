verses:
  1: "また、わたしは見[み]た。すると、小羊[こひつじ]がシオンの山[やま]に立[た]っていて、彼[かれ]とともに十四万四千[じゅうよんまんよんせん]人[にん]がいて、その額[ひたい]に小羊[こひつじ]の名[な]と、その父[ちち]の名[な]とが記[しる]されていた。"
  2: "また、わたしは天[てん]から声[こえ]を聞[き]いた。多[おお]くの水[みず]の声[こえ]のようであり、大[おお]きな雷[かみなり]の声[こえ]のようであった。わたしが聞[き]いたその声[こえ]は、琴[こと]を弾[ひ]く者[もの]たちが自分[じぶん]の琴[こと]を弾[ひ]く音[おと]のようであった。"
  3: "彼[かれ]らは、御座[みくら]の前[まえ]、四[よっ]つの生[い]き物[もの]と長老[ちょうろう]たちの前[まえ]で、新[あたら]しい歌[うた]ともいうべき歌[うた]を歌[うた]っている。その歌[うた]を覚[おぼ]えることができた者[もの]は、地[ち]から贖[あがな]われた十四万四千[じゅうよんまんよんせん]人[にん]のほかには、だれもいなかった。"
  4: "彼[かれ]らは、女[おんな]たちと交[まじ]わって汚[けが]れたことのない者[もの]たちである。彼[かれ]らは童貞[どうてい]であるからだ。彼[かれ]らは、小羊[こひつじ]がどこへ行[い]っても従[したが]って行[い]く者[もの]たちである。彼[かれ]らは、人[ひと]々[びと]の中[なか]から、神[かみ]と小羊[こひつじ]への初穂[はつほ]として贖[あがな]われたのである。"
  5: "彼[かれ]らの口[くち]には偽[いつわ]りが見[み]いだされなかった。彼[かれ]らは〔神[かみ]の御座[みくら]の前[まえ]に〕傷[きず]のない者[もの]である。"
  6: "また、わたしは、もう一人[ひとり]の天使[てんし]が中天[ちゅうてん]を飛[と]んでいるのを見[み]た。その天使[てんし]は、地[ち]に住[す]む者[もの]たち、すなわち、あらゆる国民[こくみん]、部族[ぶぞく]、言語[げんご]、民[たみ]に告[つ]げ知[し]らせるための永遠[えいえん]の福音[ふくいん]を持[も]っていた。"
  7: "大[おお]きな声[こえ]で言[い]った。「神[かみ]を畏[おそ]れ、神[かみ]に栄光[えいこう]を帰[き]しなさい。神[かみ]の裁[さば]きの時[とき]が来[き]たからである。天[てん]と地[ち]と海[うみ]と水[みず]の泉[いずみ]とを造[つく]られた方[かた]を拝[はい]みなさい。」"
  8: "また、第二[だいに]の天使[てんし]がそれに続[つづ]いて言[い]った。「大[おお]きなバビロンが倒[たお]れた、倒[たお]れた。彼女[かのじょ]は、自分[じぶん]の淫行[いんこう]の怒[いか]りの酒[さけ]を、すべての国民[こくみん]に飲[の]ませたからである。」"
  9: "また、第三[だいさん]の天使[てんし]が彼[かれ]らに続[つづ]いて、大[おお]きな声[こえ]で言[い]った。「もしだれかが獣[けもの]とその像[ぞう]を拝[はい]み、自分[じぶん]の額[ひたい]か手[て]に刻印[こくいん]を受[う]けるなら、"
  10: "その者[もの]もまた、神[かみ]の怒[いか]りの酒[さけ]を飲[の]む。その怒[いか]りの杯[さかずき]に混[ま]じり物[もの]なく注[そそ]がれた酒[さけ]である。その者[もの]は、聖[せい]なる天使[てんし]たちの前[まえ]で、また小羊[こひつじ]の前[まえ]で、火[ひ]と硫黄[いおう]とによって苦[くる]しめられる。"
  11: "彼[かれ]らの苦[くる]しみの煙[けむり]は世々[よよ]限[かぎ]りなく上[のぼ]り続[つづ]け、獣[けもの]とその像[ぞう]を拝[はい]む者[もの]たち、またその名[な]の刻印[こくいん]を受[う]ける者[もの]たちは、昼[ひる]も夜[よる]も安[やす]らぎを得[え]ることがない。」"
  12: "ここに、聖[せい]なる者[もの]たちの忍耐[にんたい]がある。神[かみ]の戒[いまし]めとイエスへの信仰[しんこう]を守[まも]る者[もの]たちの忍耐[にんたい]である。"
  13: "また、わたしは天[てん]からの声[こえ]が「書[か]き記[しる]せ。今[いま]から後[のち]、主[しゅ]にあって死[し]ぬ者[もの]たちは幸[さいわ]いである。然[しか]り、霊[れい]が言[い]う。彼[かれ]らは自分[じぶん]の労苦[ろうく]から休[やす]み、その業[わざ]は彼[かれ]らに従[したが]って行[い]くからである」と言[い]うのを聞[き]いた。"
  14: "また、わたしは見[み]た。すると、白[しろ]い雲[くも]があり、その雲[くも]の上[うえ]に、人[ひと]の子[こ]のような方[かた]が座[すわ]っていた。頭[あたま]には金[きん]の冠[かんむり]があり、手[て]には鋭[するど]い鎌[かま]があった。"
  15: "また、もう一人[ひとり]の天使[てんし]が神殿[しんでん]から出[で]て来[き]て、雲[くも]の上[うえ]に座[すわ]っている方[かた]に大[おお]きな声[こえ]で叫[さけ]んだ。「あなたの鎌[かま]を送[おく]り出[だ]して、刈[か]り取[と]りなさい。刈[か]り取[と]る時[とき]が来[き]たからである。地[ち]の刈[か]り入[い]れは熟[じゅく]している。」"
  16: "すると、雲[くも]の上[うえ]に座[すわ]っていた方[かた]が、その鎌[かま]を地[ち]に投[な]げ入[い]れられた。こうして、地[ち]は刈[か]り取[と]られた。"
  17: "また、もう一人[ひとり]の天使[てんし]が、天[てん]にある神殿[しんでん]から出[で]て来[き]た。その天使[てんし]もまた、鋭[するど]い鎌[かま]を持[も]っていた。"
  18: "また、火[ひ]を支配[しはい]する権[けん]を持[も]つもう一人[ひとり]の天使[てんし]が祭壇[さいだん]から出[で]て来[き]て、鋭[するど]い鎌[かま]を持[も]つ者[もの]に大[おお]きな声[こえ]で呼[よ]びかけた。「あなたの鋭[するど]い鎌[かま]を送[おく]り出[だ]して、地[ち]のぶどうの房[ふさ]を摘[つ]み取[と]りなさい。ぶどうの実[み]が熟[じゅく]したからである。」"
  19: "そこで、その天使[てんし]は鎌[かま]を地[ち]に投[な]げ入[い]れ、地[ち]のぶどうを摘[つ]み取[と]って、神[かみ]の怒[いか]りの大[おお]きなぶどう搾[しぼ]り場[ば]に投[な]げ入[い]れた。"
  20: "そのぶどう搾[しぼ]り場[ば]は都[みやこ]の外[そと]で踏[ふ]まれた。すると、ぶどう搾[しぼ]り場[ば]から血[ち]が出[で]て、馬[うま]のくつわにまで達[たっ]し、千六百[せんろっぴゃく]スタディオンに及[およ]んだ。"

notes:
  1: "Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ἑστὸς ἐπὶ τὸ ὄρος Σιών — 小羊がシオンの山に立っている. ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες — 十四万四千人 (число оставлено как 144 000, без символического пересчёта). ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ — 小羊の名と、その父の名; в Елизаветинской и jp-joc только имя Отца, но в gr-lxx-byz оба имени есть, поэтому без 〔〕."
  2: "φωνὴν ἐκ τοῦ οὐρανοῦ — 天からの声. ὡς φωνὴν ὑδάτων πολλῶν … ὡς φωνὴν βροντῆς μεγάλης — 多くの水の声のよう…大きな雷の声のよう. ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν — 琴を弾く者たちが自分の琴を弾く音のよう."
  3: "ᾄδουσιν [ὡς] ᾠδὴν καινὴν — 新しい歌ともいうべき歌を歌っている; [ὡς] в базе в квадратных скобках, поэтому 〔〕 не ставятся. ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων — 御座と四つの生き物と長老たちの前. οἱ ἠγορασμένοι ἀπὸ τῆς γῆς — 地から贖われた者たち."
  4: "οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν — 女たちと交わって汚れたことのない者たち. παρθένοι γάρ εἰσιν — 彼らは童貞であるからだ. ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ὑπάγῃ — 小羊がどこへ行っても従って行く者たち. ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ — 神と小羊への初穂."
  5: "ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη ψεῦδος — 口には偽りが見いだされなかった. ἄμωμοι — 傷のない者. В критической базе только ἄμωμοί εἰσιν; церковный текст (Елизаветинская «без порока бо суть пред престолом Божиим», jp-joc 神の宝座の前に責むべきなし) добавляет ἐνώπιον τοῦ θρόνου τοῦ θεοῦ — 〔神の御座の前に〕 (проверено: θρονου в 14:5 НЕТ)."
  6: "ἄγγελον πετόμενον ἐν μεσουρανήματι — 中天を飛ぶ天使. εὐαγγέλιον αἰώνιον — 永遠の福音. ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς — 地に住む者たち. ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν — あらゆる国民、部族、言語、民."
  7: "ἐν φωνῇ μεγάλῃ — 大きな声で. Φοβήθητε τὸν θεὸν καὶ δότε αὐτῷ δόξαν — 神を畏れ、神に栄光を帰しなさい. ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ — 神の裁きの時が来た. τῷ ποιήσαντι τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων — 天と地と海と水の泉とを造られた方. Речь ангела — 「」, не красная."
  8: "ἄλλος δεύτερος [ἄγγελος] — 第二の天使; [ἄγγελος] в базе в квадратных скобках. Ἔπεσεν, ἔπεσεν Βαβυλὼν ἡ μεγάλη — 倒れた、倒れた、大きなバビロン. ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς — 自分の淫行の怒りの酒. πεπότικεν πάντα τὰ ἔθνη — すべての国民に飲ませた."
  9: "τρίτος — 第三の天使. Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ — 獣とその像を拝み. λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ — 自分の額か手に刻印を受ける. Условное предложение продолжается в ст. 10."
  10: "αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ — その者も神の怒りの酒を飲む. τοῦ κεκερασμένου ἀκράτου — 混じり物なく注がれた (ἄκρατος — «несмешанный»). ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ — その怒りの杯. βασανισθήσεται ἐν πυρὶ καὶ θείῳ — 火と硫黄とで苦しめられる. ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου — 聖なる天使たちと小羊の前."
  11: "ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν — 苦しみの煙. εἰς αἰῶνας αἰώνων ἀναβαίνει — 世々限りなく上り続ける. οὐκ ἔχουσιν ἀνάπαυσιν — 安らぎを得ない. τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ — その名の刻印."
  12: "Ὧδε ἡ ὑπομονὴ τῶν ἁγίων — ここに聖なる者たちの忍耐. οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ — 神の戒めを守る者たち. τὴν πίστιν Ἰησοῦ — イエスへの信仰. TR добавляет второе ὧδε, но Елизаветинская, Синодальный и jp-joc его не читают, поэтому не добавлено."
  13: "φωνῆς ἐκ τοῦ οὐρανοῦ — 天からの声; это не голос Христа, поэтому 「」 без <j> (у jp-joc тоже). Γράψον — 書き記せ. ἀπ᾽ ἄρτι — 今から後. ναί, λέγει τὸ πνεῦμα — 然り、霊が言う (πνεῦμα без ἅγιον — 霊[れい]). ἵνα ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν — 労苦から休む. τὰ γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ᾽ αὐτῶν — その業は彼らに従って行く."
  14: "νεφέλη λευκή — 白い雲. ὅμοιον υἱὸν ἀνθρώπου — 人の子のような方. στέφανον χρυσοῦν — 金の冠. δρέπανον ὀξύ — 鋭い鎌. Личность Сидящего не названа; в 14:16 действие передано с гонорификом, но без отождествления."
  15: "ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ — もう一人の天使が神殿から出て来た. Πέμψον τὸ δρέπανόν σου καὶ θέρισον — 鎌を送り出して刈り取りなさい. ἦλθεν ἡ ὥρα θερίσαι — 刈り取る時が来た. ἐξηράνθη ὁ θερισμὸς τῆς γῆς — 地の刈り入れは熟している (букв. «высохла»; ср. jp-joc 熟した, Синодальный «созрела»)."
  16: "ἔβαλεν … τὸ δρέπανον … ἐπὶ τὴν γῆν — 鎌を地に投げ入れた. ἐθερίσθη ἡ γῆ — 地は刈り取られた."
  17: "ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ — 天にある神殿から出て来たもう一人の天使. ἔχων καὶ αὐτὸς δρέπανον ὀξύ — その天使も鋭い鎌を持っていた."
  18: "ἐκ τοῦ θυσιαστηρίου — 祭壇から. ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός — 火を支配する権を持つ. τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς — 地のぶどうの房を摘み取りなさい. ἤκμασαν αἱ σταφυλαὶ αὐτῆς — ぶどうの実が熟した."
  19: "ἐτρύγησεν τὴν ἄμπελον τῆς γῆς — 地のぶどうを摘み取った. ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν — 神の怒りの大きなぶどう搾り場. ληνός — ぶどう搾り場."
  20: "ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως — ぶどう搾り場は都の外で踏まれた. ἄχρι τῶν χαλινῶν τῶν ἵππων — 馬のくつわにまで. ἀπὸ σταδίων χιλίων ἑξακοσίων — 千六百スタディオン (мера уже пояснена в Мф 14:24)."
