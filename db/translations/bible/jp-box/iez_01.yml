# jp-box, Иезекииль, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть (выгружен), сверен для церковных чтений и
# порядка членов, в текст не копировался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: 1–3 дата, место и слово Господне (тридцатый год, четвёртый месяц, пятый
# день, река Ховар, Иезекииль, сын Вузия, рука Господня); 4–14 видение: буря от
# севера, облако и блистающий огонь, электр, четыре животных, лица человека, льва,
# тельца и орла, руки под крыльями, ход прямо, угли и светильники, молния;
# 15–21 колёса: одно колесо при четырёх животных, «колесо в колесе», ободья с
# глазами, совместное движение, дух жизни в колёсах; 22–28 твердь над головами,
# крылья под твердью, глас вод многих, престол из сапфира, подобие человека,
# электр и огонь, радуга, видение подобия славы Господней.
# Нумерация по gr: 28 стихов, совпадает с csl и ru. Деление внутри главы у слав.
# иное: слова об электре (гр 1:4б) слав. относит к 1:5, «и каждый шёл прямо лица
# своего» (гр 1:12а) — к концу 1:11, а конец гр 1:28 («таково видение подобия славы
# Господней…») открывает у слав. 2:1. Держим слав. деление, карта в notes.
# Голоса: речи Бога в главе нет, всё — авторское повествование; кавычек нет.
# «Точка» 1:14: в gr-lxx-byz на месте стиха «.» (лакуна), перевод по слав. без 〔…〕,
# отмечено в notes.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 1:9 «и крыла их четырех держащаяся друг друга», 1:24 «яко глас Бога саддаи» и
# «глас слова яко глас полка», 1:25 «внегда стояти им, низпускахуся крила их».
# Редакционные скобки слав. («(и лица их)», «(и колеса)», «(и колеса с ними)»)
# не переводились, содержание внесено.
# Сносок ⟨…⟩ нет: 霊, 幻, 大空, 車輪, 王座, サファイア, 水晶, 獅子, 鷲 уже в корпусе;
# 琥珀 (ἤλεκτρον) — новое слово, оговорено в notes.
# Имена — транслитерация греческого (LXX): エゼキエル, ブジ (Βουζι, слав. «Вузий»),
# ヨヤキム (Ιωακιμ), ケバル川 (Χοβαρ), カルデア (Χαλδαιοι), イスラエル, タルシス
# (Θαρσις, камень).
# Повторяющиеся формулы: καὶ ἰδού — 見[み]よ; ὅρασις — 幻[まぼろし]; ὁμοίωμα —
# 似[に]たもの; πνεῦμα — 霊[れい]; ἐν μέσῳ — ただ中[なか].

