verses:
  1: "第三十年[だいさんじゅうねん]の第四[だいよん]の月[つき]、その月の五日[いつか]に、わたしは捕囚[ほしゅう]の民[たみ]のただ中[なか]にいて、ケバル川[がわ]のほとりにいた。そのとき、天[てん]が開[ひら]け、わたしは神[かみ]の幻[まぼろし]を見[み]た。"
  2: "その月の五日[いつか]、すなわち、ヨヤキム王[おう]が捕囚[ほしゅう]された第五年[だいごねん]にあたる。"
  3: "カルデアの地[ち]、ケバル川[がわ]のほとりで、主[しゅ]の言葉[ことば]が祭司[さいし]ブジの子[こ]エゼキエルに臨[のぞ]んだ。主[しゅ]の手[て]がわたしの上[うえ]にあった。"
  4: "わたしは見[み]た。見[み]よ、北[きた]から上[のぼ]り行[ゆ]く霊[れい]が来[き]ていた。その中[なか]に大[おお]きな雲[くも]があり、その周[まわ]りに光[ひかり]があり、火[ひ]が燃[も]え立[た]って閃[ひらめ]いていた。"
  5: "そのただ中[なか]には、火[ひ]のただ中[なか]にある琥珀[こはく]の幻[まぼろし]のようなものがあり、そこに光[ひかり]があった。また、そのただ中[なか]には、四[よっ]つの生[い]き物[もの]に似[に]たものがあった。その姿[すがた]はこうであった。人間[にんげん]に似[に]た姿[すがた]が彼[かれ]らの上[うえ]にあった。"
  6: "それぞれ四[よっ]つの顔[かお]があり、四[よっ]つの翼[つばさ]があった。"
  7: "そのすねはまっすぐで、その足[あし]には羽[はね]があり、きらめく青銅[せいどう]の火花[ひばな]のようであった。その翼[つばさ]は軽[かろ]やかであった。"
  8: "人間[にんげん]の手[て]が、その翼[つばさ]の下[した]、四[よっ]つの側[がわ]にあった。"
  9: "四[よっ]つの者[もの]の顔[かお]と翼[つばさ]は、互[たが]いに連[つら]なっていた。四[よっ]つとも、歩[あゆ]むときに向[む]きを変[か]えず、それぞれ顔[かお]の向[む]く方[ほう]へ進[すす]んだ。"
  10: "その顔[かお]の形[かたち]はこうであった。四[よっ]つとも右[みぎ]に人間[にんげん]の顔[かお]と獅子[しし]の顔[かお]、四[よっ]つとも左[ひだり]に牛[うし]の顔[かお]、また四[よっ]つとも鷲[わし]の顔[かお]があった。"
  11: "その翼[つばさ]は四[よっ]つとも上[うえ]へ広[ひろ]げられていた。それぞれ二[ふた]つの翼[つばさ]が互[たが]いにつながり、二[ふた]つの翼[つばさ]がその体[からだ]の上[うえ]をおおっていた。彼[かれ]らはそれぞれ、顔[かお]の向[む]く方[ほう]へ進[すす]んだ。"
  12: "霊[れい]が進[すす]むところへ、彼[かれ]らは進[すす]み、引[ひ]き返[かえ]さなかった。"
  13: "生[い]き物[もの]たちのただ中[なか]には、燃[も]える炭火[すみび]のような幻[まぼろし]、互[たが]いに動[うご]き回[まわ]るともしびのような幻[まぼろし]があった。火[ひ]の光[ひかり]があり、その火[ひ]からいなずまが放[はな]たれていた。"
  14: "また、生[い]き物[もの]たちは走[はし]っては行[ゆ]き来[き]した。それは、いなずまの幻[まぼろし]のようであった。"
  15: "わたしは見[み]た。見[み]よ、四[よっ]つの生[い]き物[もの]のそばに、地[ち]の上[うえ]に一[ひと]つの車輪[しゃりん]があった。"
  16: "車輪[しゃりん]の見[み]た目[め]とその造[つく]りは、タルシスの石[いし]の輝[かがや]きのようであった。四[よっ]つとも同[おな]じ姿[すがた]で、その造[つく]りは、車輪[しゃりん]の中[なか]に車輪[しゃりん]があるかのようであった。"
  17: "四[よっ]つの方[ほう]へ進[すす]み、進[すす]むときには向[む]きを変[か]えなかった。"
  18: "その縁[ふち]は高[たか]かった。わたしが見[み]ると、四[よっ]つの者[もの]の縁[ふち]は、周[まわ]り中[じゅう]に目[め]が満[み]ちていた。"
  19: "生[い]き物[もの]たちが進[すす]むとき、車輪[しゃりん]もそれに沿[そ]って進[すす]んだ。生[い]き物[もの]たちが地[ち]から上[あ]がるとき、車輪[しゃりん]も上[あ]がった。"
  20: "雲[くも]のあるところには、進[すす]むべき霊[れい]もあった。生[い]き物[もの]たちは進[すす]み、車輪[しゃりん]も彼[かれ]らと共[とも]に上[あ]がった。いのちの霊[れい]が車輪[しゃりん]の中[なか]にあったからである。"
  21: "これらが進[すす]むとき、車輪[しゃりん]も進[すす]み、止[と]まるとき、車輪[しゃりん]も一緒[いっしょ]に止[と]まり、地[ち]から上[あ]がるとき、車輪[しゃりん]も一緒[いっしょ]に上[あ]がった。いのちの霊[れい]が車輪[しゃりん]の中[なか]にあったからである。"
  22: "生[い]き物[もの]たちの頭[あたま]の上[うえ]には、大空[おおぞら]のようなものがあった。それは水晶[すいしょう]の幻[まぼろし]のように、その翼[つばさ]の上[うえ]に高[たか]く広[ひろ]がっていた。"
  23: "大空[おおぞら]の下[した]では、その翼[つばさ]が広[ひろ]げられ、互[たが]いに羽[はね]を打[う]ち合[あ]っていた。それぞれ二[ふた]つの翼[つばさ]がつながり、その体[からだ]をおおっていた。"
  24: "彼[かれ]らが羽[はね]を打[う]つとき、その翼[つばさ]の音[おと]を聞[き]いた。多[おお]くの水[みず]の音[おと]のようであり、全能者[ぜんのうしゃ]である神[かみ]の声[こえ]のようであった。彼[かれ]らが歩[あゆ]むときには、軍営[ぐんえい]の音[おと]のような言葉[ことば]の声[こえ]があった。彼[かれ]らが止[と]まるときには、翼[つばさ]を休[やす]めた。"
  25: "また、彼[かれ]らの頭[あたま]の上[うえ]にある大空[おおぞら]の上[うえ]から声[こえ]があった。彼[かれ]らが止[と]まるときには、翼[つばさ]を下[お]ろした。"
  26: "彼[かれ]らの頭[あたま]の上[うえ]の大空[おおぞら]の上[うえ]には、サファイアの石[いし]の幻[まぼろし]のようなものが見[み]えた。その上[うえ]に王座[おうざ]に似[に]たものがあり、その王座[おうざ]に似[に]たものの上[うえ]には、上[うえ]の方[ほう]に、人間[にんげん]の姿[すがた]のようなものがあった。"
  27: "わたしは見[み]た。その内[うち]にも周[まわ]りにも、琥珀[こはく]の幻[まぼろし]のようなもの、火[ひ]の幻[まぼろし]があった。腰[こし]のあたりから上[うえ]も、腰[こし]のあたりから下[した]も、わたしは火[ひ]の幻[まぼろし]を見[み]た。その光[ひかり]は周[まわ]りにあった。"
  28: "雨[あめ]の日[ひ]に雲[くも]にかかる虹[にじ]の幻[まぼろし]のようであった。その周[まわ]りにあった光[ひかり]は、そのようであった。"

notes:
  1: "Καὶ ἐγένετο ἐν τῷ τριακοστῷ ἔτει — «и было в тридцатый год» (счёт лет от начала плена); ἐν τῷ τετάρτῳ μηνὶ πέμπτῃ τοῦ μηνός — «в четвёртый месяц, в пятый день месяца»; ἐν μέσῳ τῆς αἰχμαλωσίας — «среди пленения» (αἰχμαλωσία — плен, переселение); ἐπὶ τοῦ ποταμοῦ τοῦ Χοβαρ — «при реке Ховар» (ケバル川); ἠνοίχθησαν οἱ οὐρανοί — «отверзлись небеса»; εἶδον ὁράσεις θεοῦ — «я увидел видения Божии» (ὅρασις — видение, 幻)."
  2: "πέμπτῃ τοῦ μηνός — «в пятый день месяца» (повтор даты из 1:1); τοῦτο τὸ ἔτος τὸ πέμπτον τῆς αἰχμαλωσίας τοῦ βασιλέως Ιωακιμ — «это пятый год плена царя Иоакима»: в gr-lxx-byz стоит в квадратных скобках как уточнение, в слав. без скобок, поэтому внесено в текст (ヨヤキム — форма корпуса, 4 Цар 23–24, 2 Пар 36)."
  3: "λόγος κυρίου πρὸς Ιεζεκιηλ υἱὸν Βουζι τὸν ἱερέα — «слово Господне к Иезекиилю, сыну Вузия, священнику» (Βουζι — ブジ, слав. «Вузий»); ἐν γῇ Χαλδαίων ἐπὶ τοῦ ποταμοῦ τοῦ Χοβαρ — «в земле Халдейской при реке Ховар»; ἐγένετο ἐπ᾽ ἐμὲ χεὶρ κυρίου — «была на мне рука Господня»: в греч. и слав. смена лица (3-е → 1-е), сохранена."
  4: "πνεῦμα ἐξαῖρον ἤρχετο ἀπὸ βορρᾶ — «дух воздвизающийся шёл от севера» (ἐξαίρω — поднимать; πνεῦμα — дух, 霊; ru «бурный ветер» — иное понимание, в текст не внесено); νεφέλη μεγάλη ἐν αὐτῷ — «облако великое в нём»; φέγγος κύκλῳ αὐτοῦ — «свет окрест него»; πῦρ ἐξαστράπτον — «огонь блистающий» (ἐξαστράπτω — сверкать). Слав. кончает стих на «огнь блистаяйся», а слова об электре относит к 1:5 — деление иное, чем в гр."
  5: "Слав. начинает 1:5 тем, что в гр. стоит в конце 1:4: ὡς ὅρασις ἠλέκτρου ἐν μέσῳ τοῦ πυρός — «как видение электра посреди огня» (ἤλεκτρον — янтарь, светящийся сплав, 琥珀); καὶ φέγγος ἐν αὐτῷ — «и свет в нём»; ἐν τῷ μέσῳ ὡς ὁμοίωμα τεσσάρων ζῴων — «посреди как подобие четырёх животных»; ὁμοίωμα ἀνθρώπου ἐπ᾽ αὐτοῖς — «подобие человека на них». Деление стиха держим по слав."
  6: "τέσσαρα πρόσωπα τῷ ἑνί, καὶ τέσσαρες πτέρυγες τῷ ἑνί — «четыре лица одному и четыре крыла одному» (τῷ ἑνί — каждому; слав. «единому»). Краткость двух членов сохранена."
  7: "τὰ σκέλη αὐτῶν ὀρθά — «голени их прямы»; πτερωτοὶ οἱ πόδες αὐτῶν — «пернатые (крылатые) ноги их» (πτερόω — оперять; слав. «пернаты ноги их»); σπινθῆρες ὡς ἐξαστράπτων χαλκός — «искры как блистающая медь» (σπινθήρ — искра); ἐλαφραὶ αἱ πτέρυγες — «легки крылья их». ru добавляет «ступни как у тельца» — масоретское чтение, в LXX и слав. нет, не внесено."
  8: "χεὶρ ἀνθρώπου ὑποκάτωθεν τῶν πτερύγων — «рука человека под крыльями»; ἐπὶ τὰ τέσσαρα μέρη αὐτῶν — «на четыре стороны (части) их». Слав. здесь обрывается на «на четырех странах их», а «и лица их» (гр. καὶ τὰ πρόσωπα αὐτῶν) переносит в 1:9."
  9: "Слав. добавляет «и лица их, и крила их четырех держащаяся друг друга» — «крылья четырёх соприкасались друг с другом»: в gr-lxx-byz этого нет (есть в МТ и ru), по паритету внесено в основной текст без 〔…〕; οὐκ ἐπεστρέφοντο ἐν τῷ βαδίζειν — «не обращались при хождении»; ἕκαστον κατέναντι τοῦ προσώπου αὐτῶν ἐπορεύοντο — «каждый прямо лица своего шёл»."
  10: "ὁμοίωσις τῶν προσώπων — «подобие лиц»; πρόσωπον ἀνθρώπου καὶ λέοντος ἐκ δεξιῶν — «лицо человека и льва справа»; πρόσωπον μόσχου ἐξ ἀριστερῶν — «лицо тельца слева» (μόσχος — телёнок); πρόσωπον ἀετοῦ — «лицо орла». Порядок лиц — по гр. и слав."
  11: "αἱ πτέρυγες ἐκτεταμέναι ἄνωθεν — «крылья простёрты свыше»; ἑκατέρῳ δύο συνεζευγμέναι πρὸς ἀλλήλας — «каждому два сопряжены друг с другом» (συζεύγνυμι — сопрягать); δύο ἐπεκάλυπτον ἐπάνω τοῦ σώματος — «два покрывали верх тела». В начале слав. стоит редакционное «(и лица их)» — не переводилось; в конце слав. добавляет «и коеждо прямо лицу своему идяше»: в гр. это начало 1:12, поэтому клауза оставлена при 1:11."
  12: "καὶ ἑκάτερον κατὰ πρόσωπον αὐτοῦ ἐπορεύετο — «и каждый по лицу своему шёл»: в слав. эта клауза стоит в конце 1:11, поэтому здесь стих начинается с «куда дух шёл» (οὗ ἂν ἦν τὸ πνεῦμα πορευόμενον); ἐπορεύοντο καὶ οὐκ ἐπέστρεφον — «шли и не обращались»."
  13: "ὅρασις ὡς ἀνθράκων πυρὸς καιομένων — «видение как углей огня горящих» (ἄνθραξ — уголь); ὄψις λαμπάδων συστρεφομένων — «вид светильников обращающихся» (λαμπάς — светильник, факел; συστρέφω — кружить); φέγγος τοῦ πυρός — «свет огня»; ἐκ τοῦ πυρὸς ἐξεπορεύετο ἀστραπή — «из огня исходила молния»."
  14: "«В модуле лакуна»: в gr-lxx-byz на месте стиха стоит «.». Перевод по слав.: «и животная течаху и обращахуся, яко видение везеково». Слав. «везеково» передаёт непереведённое βεζεκ — транслитерацию евр. בָּזָק «молния» (ru: «как сверкает молния»); jp-joc 1:14: «生物は馳せて往來す、電の閃くが如し». Переведено «いなずまの幻[まぼろし]»: слово «видение» сохранено, транслитерация не вводилась, чтобы не читать ベゼク как название места (Суд 1:4–5)."
  15: "τροχὸς εἷς ἐπὶ τῆς γῆς — «одно колесо на земле» (τροχός — колесо, 車輪); ἐχόμενος τῶν ζῴων τοῖς τέσσαρσιν — «принадлежащее (соприкасающееся) четырём животным» (ἔχομαι — держаться). ru: «по одному колесу перед четырьмя лицами их» — масоретское уточнение, в LXX и слав. нет, не внесено."
  16: "εἶδος θαρσις — «вид фарсиса» (θαρσις — камень, вероятно хризолит или берилл, «тарсийский»; слав. транслитерация «фарсис»; в корпусе Θαρσις — タルシス; ru «топаз» — иное отождествление); ὁμοίωμα ἓν τοῖς τέσσαρσιν — «подобие одно четырём»; τροχὸς ἐν τροχῷ — «колесо в колесе»."
  17: "ἐπὶ τὰ τέσσαρα μέρη αὐτῶν ἐπορεύοντο — «на четыре стороны их шли»; οὐκ ἐπέστρεφον ἐν τῷ πορεύεσθαι — «не обращались при шествии»."
  18: "οἱ νῶτοι αὐτῶν — «хребты (ободья) их» (νῶτον — спина, обод колеса; слав. «плеща»); ὕψος ἦν αὐτοῖς — «высота была им»; πλήρεις ὀφθαλμῶν κυκλόθεν — «полны глаз вокруг». Греч. «οὐδ᾽ οἱ νῶτοι αὐτῶν» — испорченное место с отрицанием при «хребты» (слав. «ниже хребты их»); отрицание не передано, смысл по контексту (ободья высоки). ru/МТ: «ободья высоки и страшны»."
  19: "ἐν τῷ πορεύεσθαι τὰ ζῷα ἐπορεύοντο οἱ τροχοὶ ἐχόμενοι αὐτῶν — «когда шли животные, шли и колёса, держась их»; ἐν τῷ ἐξαίρειν τὰ ζῷα ἀπὸ τῆς γῆς ἐξῄροντο οἱ τροχοί — «когда животные поднимались от земли, поднимались и колёса»."
  20: "οὗ ἂν ἦν ἡ νεφέλη — «где была облако»; ἐκεῖ τὸ πνεῦμα τοῦ πορεύεσθαι — «там дух, чтобы идти»; ἐξῄροντο σὺν αὐτοῖς — «поднимались с ними»; πνεῦμα ζωῆς ἦν ἐν τοῖς τροχοῖς — «дух жизни был в колёсах» (いのちの霊[れい])."
  21: "Слав. ставит в скобках пояснения «(и колеса)», «(и колеса с ними)» — редакционные, в текст внесены без скобок; ἐν τῷ ἑστάναι αὐτὰ εἱστήκεισαν — «когда стояли они, стояли»; ὅτι πνεῦμα ζωῆς ἦν ἐν τοῖς τροχοῖς — «ибо дух жизни был в колёсах» (повтор 1:20)."
  22: "ὁμοίωμα ὑπὲρ κεφαλῆς — «подобие над головою»; ὡσεὶ στερέωμα — «как твердь» (στερέωμα — твердь, 大空); ὡς ὅρασις κρυστάλλου — «как видение кристалла» (κρύσταλλος — лёд, хрусталь, 水晶); ἐκτεταμένον ἐπὶ τῶν πτερύγων ἐπάνωθεν — «простёртое над крыльями свыше»."
  23: "ὑποκάτω τοῦ στερεώματος αἱ πτέρυγες ἐκτεταμέναι — «под твердью крылья простёрты»; πτερυσσόμεναι ἑτέρα τῇ ἑτέρᾳ — «вея (паря) друг к другу» (πτερύσσομαι — махать крыльями); ἑκάστῳ δύο συνεζευγμέναι ἐπικαλύπτουσαι τὰ σώματα — «каждому два сопряжены, покрывающие тела»."
  24: "φωνὴ ὕδατος πολλοῦ — «голос вод многих»; ἐν τῷ ἑστάναι αὐτὰ κατέπαυον αἱ πτέρυγες — «когда стояли, успокаивались крылья». Слав. добавляет «яко глас Бога саддаи» (Σαδδαι — Вседержитель, 全能者) и «глас слова яко глас полка» («голос слова, как голос полка»): в gr-lxx-byz этих слов нет (полный церковный текст, ср. МТ), внесены в основной текст без 〔…〕."
  25: "καὶ ἰδοὺ φωνὴ ὑπεράνωθεν τοῦ στερεώματος — «и вот, голос свыше тверди»; τοῦ ὄντος ὑπὲρ κεφαλῆς αὐτῶν — «сущей над головою их». Слав. добавляет «внегда стояти им, низпускахуся крила их» — в LXX нет (повтор 1:24), внесено без скобок."
  26: "ὡς ὅρασις λίθου σαπφείρου — «как видение камня сапфира» (σάπφειρος — сапфир, サファイア); ὁμοίωμα θρόνου ἐπ᾽ αὐτοῦ — «подобие престола на нём» (θρόνος — престол, 王座); ὁμοίωμα ὡς εἶδος ἀνθρώπου ἄνωθεν — «подобие как вид человека сверху»."
  27: "ὡς ὄψιν ἠλέκτρου ἀπὸ ὁράσεως ὀσφύος καὶ ἐπάνω — «как вид электра от видения чресл и выше» (ὀσφύς — поясница, чресла, 腰); ὡς ὅρασιν πυρὸς καὶ τὸ φέγγος αὐτοῦ κύκλῳ — «как видение огня и свет его окрест»."
  28: "ὡς ὅρασις τόξου, ὅταν ᾖ ἐν τῇ νεφέλῃ ἐν ἡμέρᾳ ὑετοῦ — «как видение дуги, когда она в облаке в день дождя» (τόξον — лук, радуга); οὕτως ἡ στάσις τοῦ φέγγους κυκλόθεν — «таково стояние света окрест». Слав. на этом кончает стих; следующие слова гр. («αὕτη ἡ ὅρασις ὁμοιώματος δόξης κυρίου…») у слав. открывают 2:1, см. notes к 2:1."
