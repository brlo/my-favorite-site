# jp-box, Исход, глава 27. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru)
# и русский Синодальный (ru). jp-joc для Исхода в базе нет.
# Язык — современный 常体; порядок членов — по греческому.
# Глава 27: жертвенник всесожжения (1–8), двор скинии (9–19), елей для светильника (20–21).
# 〔…〕: 27:11 и 27:13 — у LXX в 27:11 «восток» (ἀπηλιώτην), в 27:13 «юг» (νότον),
# а церковное чтение (csl, Синодальный) даёт «север» и «восток»; слова βορρᾶς и ἀπηλιώτης
# в этих стихах gr-lxx-byz нет (проверено bracket_check.rb: НЕТ), поэтому 〔北〕 и 〔東〕.
# Красного и синего нет: речь Бога — 「…」. Сносок ⟨…⟩ нет.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 27
draft: true

verses:
  1: "「あなたはアカシアの木[き]で祭壇[さいだん]を造[つく]れ。長[なが]さ五[ご]キュビト、幅[はば]五[ご]キュビト。祭壇[さいだん]は四角[しかく]とし、高[たか]さは三[さん]キュビトとする。"
  2: "あなたはその四[よっ]つの隅[すみ]に角[つの]を造[つく]れ。角[つの]は祭壇[さいだん]から出[で]るようにする。あなたは祭壇[さいだん]を青銅[せいどう]で覆[おお]え。"
  3: "あなたは祭壇[さいだん]のために縁[ふち]と、覆[おお]いと、鉢[はち]と、肉[にく]を取[と]る鉤[かぎ]と、火[ひ]皿[ざら]を造[つく]れ。祭壇[さいだん]のすべての器[うつわ]を青銅[せいどう]で造[つく]れ。"
  4: "あなたは祭壇[さいだん]のために、青銅[せいどう]の網[あみ]細工[ざいく]の火[ひ]床[どこ]を造[つく]り、その網[あみ]の四[よっ]つの隅[すみ]に青銅[せいどう]の環[かん]を四[よっ]つ造[つく]れ。"
  5: "あなたはそれを祭壇[さいだん]の火[ひ]床[どこ]の下[した]、下[した]の方[ほう]に据[す]えよ。火[ひ]床[どこ]は祭壇[さいだん]の半[なか]ばまでとする。"
  6: "あなたは祭壇[さいだん]のためにアカシアの木[き]で担[かつ]ぎ棒[ぼう]を造[つく]り、青銅[せいどう]で覆[おお]え。"
  7: "あなたはその担[かつ]ぎ棒[ぼう]を環[かん]に通[とお]せ。祭壇[さいだん]を運[はこ]ぶとき、担[かつ]ぎ棒[ぼう]は祭壇[さいだん]の両側[りょうがわ]にある。"
  8: "あなたは祭壇[さいだん]を板[いた]で造[つく]った空[うつ]ろなものとせよ。山[やま]であなたに示[しめ]されたとおりに、そのとおり造[つく]れ。」"
  9: "「あなたは幕屋[まくや]の庭[にわ]を造[つく]れ。南[みなみ]の側[がわ]には、撚[よ]った亜麻布[あまぬの]の幕[まく]を。一方[いっぽう]の側[がわ]の長[なが]さは百[ひゃく]キュビト。"
  10: "その柱[はしら]は二十[にじゅう]本[ほん]、その台座[だいざ]は二十[にじゅう]の青銅[せいどう]。柱[はしら]の鉤[かぎ]と、柱[はしら]をつなぐ金具[かなぐ]は銀[ぎん]である。"
  11: "同[おな]じように、〔北[きた]〕の側[がわ]にも幕[まく]を。長[なが]さは百[ひゃく]キュビト。その柱[はしら]は二十[にじゅう]本[ほん]、その台座[だいざ]は二十[にじゅう]の青銅[せいどう]。柱[はしら]の鉤[かぎ]と、柱[はしら]をつなぐ金具[かなぐ]、その台座[だいざ]は銀[ぎん]で覆[おお]われている。"
  12: "庭[にわ]の幅[はば]は、海[うみ]の側[がわ]では幕[まく]が五十[ごじゅう]キュビト。その柱[はしら]は十本[じゅっぽん]、その台座[だいざ]は十[とお]。"
  13: "庭[にわ]の幅[はば]は、〔東[ひがし]〕の側[がわ]では幕[まく]が五十[ごじゅう]キュビト。その柱[はしら]は十本[じゅっぽん]、その台座[だいざ]は十[とお]。"
  14: "一方[いっぽう]の側[がわ]の幕[まく]の高[たか]さは十五[じゅうご]キュビト。その柱[はしら]は三本[さんぼん]、その台座[だいざ]は三[みっ]つ。"
  15: "もう一方[いっぽう]の側[がわ]も、幕[まく]の高[たか]さは十五[じゅうご]キュビト。その柱[はしら]は三本[さんぼん]、その台座[だいざ]は三[みっ]つ。"
  16: "庭[にわ]の門[もん]には覆[おお]いを。高[たか]さは二十[にじゅう]キュビトで、青[あお]、紫[むらさき]、撚[よ]った緋[ひ]の糸、撚[よ]った亜麻布[あまぬの]による、縫[ぬ]い手[て]の刺繍[ししゅう]である。その柱[はしら]は四本[よんほん]、その台座[だいざ]は四[よっ]つ。"
  17: "庭[にわ]のすべての柱[はしら]は、周[まわ]りに銀[ぎん]で覆[おお]われ、頭[かしら]は銀[ぎん]、台座[だいざ]は青銅[せいどう]である。"
  18: "庭[にわ]の長[なが]さは百[ひゃく]キュビトに百[ひゃく]キュビト、幅[はば]は五十[ごじゅう]に五十[ごじゅう]、高[たか]さは五[ご]キュビトで、撚[よ]った亜麻布[あまぬの]による。その台座[だいざ]は青銅[せいどう]である。"
  19: "幕屋[まくや]のすべての造[つく]りと、そのすべての道具[どうぐ]、庭[にわ]の杭[くい]は青銅[せいどう]である。」"
  20: "「あなたはイスラエルの子[こ]らに命[めい]じて、ともし火[び]を上[あ]げるために、打[う]ち砕[くだ]いたオリーブから取[と]った純粋[じゅんすい]な油[あぶら]をあなたのところに持[も]って来[こ]させよ。ともし火[び]はいつも燃[も]えているようにする。"
  21: "アロンとその子[こ]らは、証[あかし]の幕屋[まくや]で、契約[けいやく]の上[うえ]にある垂[た]れ幕[まく]の外[そと]で、夕[ゆう]べから朝[あさ]まで主[しゅ]の前[まえ]にともし火[び]を上[あ]げる。これはあなたがたの代[よ]々[よ]にわたる、イスラエルの子[こ]らによる永遠[えいえん]の定[さだ]めである。」"

notes:
  1: "θυσιαστήριον — 祭壇 (жертвенник всесожжения). πέντε πήχεων τὸ μῆκος καὶ πέντε τὸ εὖρος — 5×5 локтей; τετράγωνον — четырёхугольный; τριῶν πήχεων τὸ ὕψος — три локтя в высоту."
  2: "τὰ κέρατα ἐπὶ τῶν τεσσάρων γωνιῶν — роги (角) на четырёх углах (隅); ἐξ αὐτοῦ ἔσται — роги выходят из самого жертвенника; καλύψεις … χαλκῷ — обложишь медью (青銅)."
  3: "στεφάνη — венец, обод по верху (縁); καλυπτήρ — покрышка; φιάλαι — чаши (鉢); κρεάγραι — мясные крюки (вилицы); πυρεῖον — угольница (火皿)."
  4: "ἐσχάρα ἔργῳ δικτυωτῷ — решётка-сеть (網細工の火床); δακτύλιοι χαλκοῖ — медные кольца на четырёх сторонах."
  5: "ὑποθήσεις αὐτοὺς ὑπὸ τὴν ἐσχάραν — подложишь их под решётку снизу; ἕως τοῦ ἡμίσους — до половины жертвенника."
  6: "φορεῖς — шесты для ношения (担い棒); περιχαλκώσεις — обложишь медью."
  7: "εἰσάξεις … εἰς τοὺς δακτυλίους — вложишь шесты в кольца; ἐν τῷ αἴρειν αὐτό — когда поднимают его."
  8: "κοῖλον σανιδωτόν — пустой внутри, дощатый; κατὰ τὸ παραδειχθέν σοι ἐν τῷ ὄρει — по показанному на горе."
  9: "αὐλή — двор (庭); ἱστία — полотнища-завесы двора (幕), из кручёного виссона; ἑκατὸν πηχῶν — сто локтей."
  10: "εἴκοσι στῦλοι, εἴκοσι βάσεις χαλκαῖ — двадцать столпов и двадцать медных подножий; κρίκοι καὶ ψαλίδες ἀργυραῖ — серебряные крючки и связи (金具)."
  11: "У LXX ἀπηλιώτην — «восток»; слав. и Синодальный читают «север». Церковное чтение поставлено в 〔…〕 (βορρᾶς в стихе нет). βάσεις περιηργυρωμέναι — подножия посеребрены (у LXX это сказано только здесь, ср. 27:10)."
  12: "τὸ εὖρος … τὸ κατὰ θάλασσαν — ширина со стороны моря, т.е. запада; десять столпов и десять подножий."
  13: "У LXX νότον — «юг» (второй раз, после 27:9); слав. и Синодальный — «восток». Церковное чтение в 〔…〕, чтобы стороны двора не совпадали."
  14: "πεντεκαίδεκα πηχέων τὸ ὕψος — пятнадцать локтей высоты; три столпа и три подножия (это половина восточной стороны у ворот)."
  15: "То же для второй половины: пятнадцать локтей, три столпа, три подножия."
  16: "κάλυμμα — завеса ворот (覆い); εἴκοσι πηχῶν τὸ ὕψος — у LXX «высота» двадцать локтей (это ширина ворот, при высоте двора в пять); ποικιλία τοῦ ῥαφιδευτοῦ — узорчатая работа вышивальщика (縫い手の刺繍)."
  17: "πάντες οἱ στῦλοι … κατηργυρωμένοι ἀργυρίῳ — все столпы окованы серебром; κεφαλίδες серебряные, βάσεις медные."
  18: "ἑκατὸν ἐφ᾽ ἑκατόν — «сто на сто», εὖρος πεντήκοντα ἐπὶ πεντήκοντα — «пятьдесят на пятьдесят» (так у LXX и слав.; Синодальный даёт просто 100 и 50); высота пять локтей."
  19: "κατασκευή — устройство, ἐργαλεῖα — орудия, πάσσαλοι — колья (杭); всё медное."
  20: "σὺ σύνταξον — «ты повели»; ἔλαιον ἐξ ἐλαίων ἄτρυγον καθαρὸν κεκομμένον — чистое масло из толчёных (битых) маслин, без осадка (ἄτρυγον); εἰς φῶς καῦσαι — чтобы горел светильник; διὰ παντός — постоянно."
  21: "σκηνὴ τοῦ μαρτυρίου — скиния свидетельства; ἔξωθεν τοῦ καταπετάσματος τοῦ ἐπὶ τῆς διαθήκης — вне завесы, которая над заветом; νόμιμον αἰώνιον — устав вечный."
