# jp-box, Иисус Навин, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: взятие Гая (1–29), жертвенник на Евале и чтение закона (30–35).
# Речь Бога — 「…」 (1–2, 18); речь Иисуса — 「…」 (4–8); вложенная речь — 『…』
# (8:6, слова, которые скажут жители Гая). Красного нет.
# Нумерация по gr: 35 стихов. В gr 8:30 помечен «30a» — деление LXX, в текст не вынесено.
# 〔…〕 два: 8:13 и 8:26 — в gr на месте стихов стоит «.», оба стиха целиком по csl.
# Сносок ⟨…⟩ нет: 燔祭, 酬恩祭, 契約の箱, 祭司, レビ人, 寄留者 уже пояснены в корпусе.

