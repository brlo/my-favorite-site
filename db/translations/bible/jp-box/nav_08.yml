verses:
  1: "主[しゅ]はヨシュアに言[い]われた。「恐[おそ]れてはならない。おののいてはならない。戦[たたか]う者[もの]をすべて連[つ]れて、立[た]ってアイへ上[のぼ]りなさい。見[み]よ、わたしはアイの王[おう]とその地[ち]をあなたの手[て]に与[あた]えた。"
  2: "あなたはエリコとその王[おう]にしたのと同[おな]じように、アイにもしなさい。ただ、家畜[かちく]は戦利品[せんりひん]として自分[じぶん]のために取[と]ってよい。町[まち]の後[うし]ろに、あなたのために伏兵[ふくへい]を置[お]きなさい。」"
  3: "ヨシュアは、戦[たたか]う民[たみ]すべてとともに立[た]ち、アイへ上[のぼ]ろうとした。ヨシュアは力[ちから]ある者[もの]三万人[にん]を選[えら]び、夜[よる]のうちに彼[かれ]らを遣[つか]わした。"
  4: "彼[かれ]らに命[めい]じて言[い]った。「あなたがたは町[まち]の後[うし]ろに伏[ふ]せなさい。町[まち]から遠[とお]く離[はな]れてはならない。みな、備[そな]えを整[ととの]えておきなさい。"
  5: "わたしと、わたしとともにいるすべての者[もの]は町[まち]に近[ちか]づく。アイの住[す]む者[もの]たちが、前[まえ]のときと同[おな]じようにわたしたちを迎[むか]えに出[で]て来[き]たら、わたしたちは彼[かれ]らの前[まえ]から逃[に]げる。"
  6: "彼[かれ]らがわたしたちを追[お]って出[で]て来[き]たら、わたしたちは彼[かれ]らを町[まち]から引[ひ]き離[はな]す。彼[かれ]らは言[い]うだろう。『この者[もの]たちは、前[まえ]と同[おな]じようにわたしたちの前[まえ]から逃[に]げている』と。"
  7: "あなたがたは伏兵[ふくへい]のところから立[た]ち上[あ]がって、町[まち]へ行[い]きなさい。"
  8: "この言葉[ことば]のとおりに行[おこな]いなさい。見[み]よ、わたしはあなたがたに命[めい]じた。」"
  9: "ヨシュアは彼[かれ]らを遣[つか]わした。彼[かれ]らは伏兵[ふくへい]の場所[ばしょ]へ行[い]き、ベテルとアイの間[あいだ]、アイの西[にし]側[がわ]に伏[ふ]せた。"
  10: "ヨシュアは朝早[あさはや]く起[お]きて民[たみ]を点検[てんけん]し、彼[かれ]とイスラエルの長老[ちょうろう]たちは民[たみ]の前[まえ]を進[すす]んでアイへ上[のぼ]った。"
  11: "彼[かれ]とともにいる戦[たたか]う民[たみ]はみな上[のぼ]り、進[すす]んで町[まち]の東[ひがし]側[がわ]の前[まえ]に来[き]た。"
  12: "町[まち]の伏兵[ふくへい]は西[にし]側[がわ]にいた。"
  13: "〔民[たみ]は全[ぜん]軍[ぐん]を町[まち]の北[きた]側[がわ]に置[お]き、残[のこ]りの者[もの]たちを町[まち]の西[にし]側[がわ]に置[お]いた。ヨシュアはその夜[よる]、谷[たに]の中[なか]へ進[すす]んだ。〕"
  14: "アイの王[おう]はそれを見[み]ると、急[いそ]いで、彼[かれ]とともにいる民[たみ]すべてとともに、まっすぐに戦[たたか]いのために彼[かれ]らを迎[むか]えに出[で]た。彼[かれ]は、町[まち]の後[うし]ろに自分[じぶん]に対[たい]する伏兵[ふくへい]がいることを知[し]らなかった。"
  15: "ヨシュアとイスラエルはそれを見[み]て、彼[かれ]らの前[まえ]から退[しりぞ]いた。"
  16: "彼[かれ]らはイスラエルの子[こ]らを追[お]いかけた。こうして彼[かれ]らは町[まち]から離[はな]れた。"
  17: "アイには、イスラエルを追[お]いかけなかった者[もの]は一人[ひとり]も残[のこ]らなかった。彼[かれ]らは町[まち]を開[あ]けたままにして、イスラエルを追[お]いかけた。"
  18: "主[しゅ]はヨシュアに言[い]われた。「あなたの手[て]にある槍[やり]を町[まち]に向[む]けて伸[の]べなさい。わたしはその町[まち]をあなたの手[て]に渡[わた]した。伏兵[ふくへい]は自分[じぶん]たちの場所[ばしょ]から直[ただ]ちに立[た]ち上[あ]がる。」ヨシュアは手[て]の槍を町[まち]に向[む]けて伸[の]べた。"
  19: "伏兵[ふくへい]は自分[じぶん]たちの場所[ばしょ]から直[ただ]ちに立[た]ち上[あ]がり、彼[かれ]が手[て]を伸[の]べたときに出[で]て、町[まち]へ行[い]ってこれを取[と]り、急[いそ]いで町[まち]に火[ひ]を放[はな]った。"
  20: "アイの住[す]む者[もの]たちは後[うし]ろを振[ふ]り向[む]いて、町[まち]から天[てん]へ上[のぼ]る煙[けむり]を見[み]た。彼[かれ]らにはもはや、あちらへもこちらへも逃[に]げる場所[ばしょ]がなかった。"
  21: "ヨシュアとイスラエルはみな、伏兵[ふくへい]が町[まち]を取[と]ったこと、町[まち]の煙[けむり]が天[てん]へ上[のぼ]ることを見[み]て、向[む]きを変[か]え、アイの人[ひと]々[びと]を打[う]ち殺[ころ]した。"
  22: "町[まち]から出[で]て来[き]た者[もの]たちも彼[かれ]らに立[た]ち向[む]かった。こうして彼[かれ]らは、一方[いっぽう]はこちらから、他方[たほう]はあちらからというように、陣[じん]の真[ま]ん中[なか]に挟[はさ]まれた。そして、逃[に]げ延[の]びた者[もの]も助[たす]かった者[もの]も一人[ひとり]も残[のこ]らないほどに、打[う]ち殺[ころ]した。"
  23: "アイの王[おう]は生[い]けどりにされ、ヨシュアのところへ連[つ]れて来[こ]られた。"
  24: "イスラエルの子[こ]らが、アイにいるすべての者[もの]、すなわち野[の]や山[やま]の、彼[かれ]らを追[お]いかけて下[くだ]った坂[さか]にいる者[もの]たちを殺[ころ]し終[お]えると、ヨシュアはアイへ戻[もど]って、これを剣[つるぎ]の刃[は]にかけて打[う]った。"
  25: "その日[ひ]、男[おとこ]も女[おんな]も合わせて一万二千人[にん]が倒[たお]れた。アイに住[す]む者[もの]すべてであった。"
  26: "〔ヨシュアは、アイの住[す]む者[もの]すべてを聖絶[せいぜつ]するまで、槍[やり]を構[かま]えて伸[の]べた手[て]を引[ひ]き戻[もど]さなかった。〕"
  27: "ただ、町[まち]にあった家畜[かちく]と戦利品[せんりひん]だけは、主[しゅ]の命[めい]のとおり、主[しゅ]がヨシュアに命[めい]じられたように、イスラエルの子[こ]らが自分[じぶん]たちのために取[と]った。"
  28: "ヨシュアは町[まち]を火[ひ]で焼[や]き、今日[きょう]に至[いた]るまで、それを人[ひと]の住[す]まない永遠[えいえん]の廃墟[はいきょ]とした。"
  29: "アイの王[おう]を彼[かれ]は二[ふた]つの木[き]の上[うえ]に吊[つ]るした。彼[かれ]は夕[ゆう]べまでその木[き]の上[うえ]にあった。日[ひ]が沈[しず]むころ、ヨシュアは命[めい]じて、その体[からだ]を木[き]から下[おろ]させ、穴[あな]に投[な]げ込[こ]ませ、その上[うえ]に今日[きょう]まで大[おお]きな石塚[いしづか]を積[つ]み上[あ]げさせた。"
  30: "そのとき、ヨシュアはイスラエルの神[かみ]、主[しゅ]のために、エバル山[やま]に祭壇[さいだん]を築[きず]いた。"
  31: "主[しゅ]の僕[しもべ]モーセがイスラエルの子[こ]らに命[めい]じたとおり、モーセの律法[りっぽう]の書[しょ]に書[か]かれているとおりである。すなわち、鉄[てつ]を当[あ]てていない完全[かんぜん]な石[いし]で造[つく]った祭壇[さいだん]の上[うえ]で、主[しゅ]に燔祭[はんさい]をささげ、酬恩祭[しゅうおんさい]をささげた。"
  32: "ヨシュアは石[いし]の上[うえ]に、第二[だい]の律法[りっぽう]、すなわちモーセの律法[りっぽう]を書[か]き記[しる]した。それはイスラエルの子[こ]らの前[まえ]に書[か]かれたものである。"
  33: "イスラエルはみな、その長老[ちょうろう]たち、裁[さば]き人[びと]たち、書記[しょき]たちとともに、契約[けいやく]の箱[はこ]の前[まえ]を、こちら側[がわ]とあちら側[がわ]に分[わ]かれて進[すす]んだ。祭司[さいし]たちとレビ人[びと]は契約[けいやく]の箱[はこ]を担[かつ]いでいた。寄留者[きりゅうしゃ]も土着[どちゃく]の者[もの]も、半[はん]ばはゲリジム山[やま]のそばに、半[はん]ばはエバル山[やま]のそばに立[た]った。主[しゅ]の僕[しもべ]モーセが命[めい]じたとおり、まず民[たみ]を祝福[しゅくふく]するためであった。"
  34: "その後[あと]、ヨシュアはこの律法[りっぽう]のすべての言葉[ことば]、すなわち祝福[しゅくふく]と呪[のろ]いを、モーセの律法[りっぽう]の書[しょ]に書[か]かれているすべてに従[したが]って読[よ]み上[あ]げた。"
  35: "モーセがヨシュアに命[めい]じたすべての言葉[ことば]のうち、ヨシュアがイスラエルの子[こ]らの集会[しゅうかい]すべての耳[みみ]に読[よ]まなかったものは、一[ひと]つもなかった。男[おとこ]にも女[おんな]にも、子[こ]どもにも、イスラエルに加[くわ]わって来[き]た寄留者[きりゅうしゃ]にも。"

notes:
  1: "Μὴ φοβηθῇς μηδὲ δειλιάσῃς — не бойся и не устрашайся (δειλιάω). τοὺς ἄνδρας πάντας τοὺς πολεμιστάς — всех мужей воинственных. ἀναστὰς ἀνάβηθι εἰς Γαι — встав, взойди в Гай. δέδωκα εἰς τὰς χεῖράς σου — дал в руки твои (перфект). Слав. добавляет «и люди его и град его» — в gr нет."
  2: "ποιήσεις τὴν Γαι ὃν τρόπον ἐποίησας τὴν Ιεριχω — сделаешь Гаю так, как сделал Иерихону. τὴν προνομὴν τῶν κτηνῶν προνομεύσεις σεαυτῷ — добычу скота возьмёшь себе (προνομεύω). κατάστησον ... ἔνεδρα τῇ πόλει εἰς τὰ ὀπίσω — поставь засаду городу позади (ἔνεδρα — засада)."
  3: "ὥστε ἀναβῆναι εἰς Γαι — чтобы взойти в Гай. ἐπέλεξεν ... τριάκοντα χιλιάδας ἀνδρῶν δυνατοὺς ἐν ἰσχύι — избрал тридцать тысяч мужей, сильных крепостью. ἀπέστειλεν αὐτοὺς νυκτός — послал их ночью."
  4: "ἐνεδρεύσατε ὀπίσω τῆς πόλεως — устройте засаду позади города (ἐνεδρεύω). μὴ μακρὰν γίνεσθε — не будьте далеко. ἔσεσθε πάντες ἕτοιμοι — будьте все готовы."
  5: "προσάξομεν πρὸς τὴν πόλιν — подойдём к городу. ὡς ἂν ἐξέλθωσιν ... εἰς συνάντησιν ἡμῖν — когда выйдут навстречу нам. καθάπερ καὶ πρῴην — как и прежде. φευξόμεθα ἀπὸ προσώπου αὐτῶν — побежим от лица их."
  6: "ἀποσπάσομεν αὐτοὺς ἀπὸ τῆς πόλεως — оторвём, отвлечём их от города (ἀποσπάω). Φεύγουσιν οὗτοι ἀπὸ προσώπου ἡμῶν — «бегут эти от лица нашего»; вложенная речь 『…』."
  7: "ἐξαναστήσεσθε ἐκ τῆς ἐνέδρας — встанете из засады. πορεύσεσθε εἰς τὴν πόλιν — пойдёте в город. Слав. добавляет «и предаст его Господь Бог наш в руце ваши» — в gr нет."
  8: "κατὰ τὸ ῥῆμα τοῦτο ποιήσετε — по слову этому сделаете. ἰδοὺ ἐντέταλμαι ὑμῖν — вот, Я заповедал вам (ἐντέλλομαι, перфект). Здесь закрывается речь Иисуса."
  9: "ἀπέστειλεν αὐτοὺς Ἰησοῦς — послал их Иисус. ἐνεκάθισαν ἀνὰ μέσον Βαιθηλ καὶ ἀνὰ μέσον Γαι — сели между Вефилем и Гаем. ἀπὸ θαλάσσης τῆς Γαι — «от моря Гая», т. е. с запада (θάλασσα — запад в семитском словоупотреблении)."
  10: "ὀρθρίσας ... ἐπεσκέψατο τὸν λαόν — встав рано, осмотрел, проверил народ (ἐπισκέπτομαι). ἀνέβησαν αὐτὸς καὶ οἱ πρεσβύτεροι ... ἐπὶ Γαι — взошли он и старейшины к Гаю."
  11: "πᾶς ὁ λαὸς ὁ πολεμιστὴς μετ᾽ αὐτοῦ — весь народ воинственный с ним. ἦλθον ἐξ ἐναντίας τῆς πόλεως ἀπ᾽ ἀνατολῶν — пришли напротив города с востока."
  12: "τὰ ἔνεδρα τῆς πόλεως ἀπὸ θαλάσσης — засада города со стороны моря, т. е. с запада. Стих — продолжение описания, начатого в 11."
  13: "В gr-lxx-byz (и в gr-ru) на месте стиха стоит «.» — текст в модуле утрачен. Стих целиком по csl 8:13: стан с севера города, остальные с запада, Иисус ночью в долине. Слав. 8:12 при этом содержит и «пять тысяч мужей» (МТ 8:12) — в gr этого нет."
  14: "ὡς εἶδεν βασιλεὺς Γαι — когда увидел царь Гая. ἐξῆλθεν εἰς συνάντησιν ... ἐπ᾽ εὐθείας εἰς τὸν πόλεμον — вышел навстречу прямо на войну. οὐκ ᾔδει ὅτι ἔνεδρα αὐτῷ ἐστιν ὀπίσω τῆς πόλεως — не знал, что засада ему позади города."
  15: "καὶ εἶδεν καὶ ἀνεχώρησεν Ἰησοῦς καὶ Ισραηλ ἀπὸ προσώπου αὐτῶν — и увидел, и отступил Иисус и Израиль от лица их. Слав. добавляет «путем пустыни» — в gr нет."
  16: "κατεδίωξαν ὀπίσω τῶν υἱῶν Ισραηλ — погнались за сынами Израиля. αὐτοὶ ἀπέστησαν ἀπὸ τῆς πόλεως — сами отступили от города (ἀφίστημι)."
  17: "οὐ κατελείφθη οὐθεὶς ἐν τῇ Γαι — не остался никто в Гае. κατέλιπον τὴν πόλιν ἀνεῳγμένην — оставили город открытым (ἀνοίγω). Слав. добавляет «и вефили» — в gr нет."
  18: "Ἔκτεινον τὴν χεῖρά σου ἐν τῷ γαίσῳ — простри руку твою с копьём (γαῖσος — копьё, дротик; слав. «с копием»). εἰς γὰρ τὰς χεῖράς σου παραδέδωκα αὐτήν — ибо в руки твои предал её. τὰ ἔνεδρα ἐξαναστήσονται ἐν τάχει — засада встанет быстро."
  19: "ἐξανέστησαν ἐν τάχει — встали быстро. ὅτε ἐξέτεινεν τὴν χεῖρα — когда он простёр руку. κατελάβοντο αὐτὴν — овладели ею (καταλαμβάνω). σπεύσαντες ἐνέπρησαν — поспешив, зажгли (ἐμπίμπρημι)."
  20: "περιβλέψαντες ... εἰς τὰ ὀπίσω αὐτῶν — оглянувшись назад. ἐθεώρουν καπνὸν ἀναβαίνοντα εἰς τὸν οὐρανόν — видели дым, восходящий к небу. οὐκέτι εἶχον ποῦ φύγωσιν ὧδε ἢ ὧδε — уже не имели куда бежать, туда или сюда."
  21: "εἶδον ὅτι ἔλαβον τὰ ἔνεδρα τὴν πόλιν — увидели, что засада взяла город. μεταβαλόμενοι ἐπάταξαν — повернувшись, поразили (μεταβάλλομαι)."
  22: "οὗτοι ἐξήλθοσαν ἐκ τῆς πόλεως εἰς συνάντησιν — эти вышли из города навстречу. ἐγενήθησαν ἀνὰ μέσον τῆς παρεμβολῆς — оказались посреди стана. ἐπάταξαν ἕως τοῦ μὴ καταλειφθῆναι ... σεσωσμένον καὶ διαπεφευγότα — поражали, доколе не осталось спасённого и убежавшего."
  23: "συνέλαβον ζῶντα — взяли живым (συλλαμβάνω). προσήγαγον αὐτὸν πρὸς Ἰησοῦν — привели его к Иисусу."
  24: "ὡς ἐπαύσαντο ... ἀποκτέννοντες — когда перестали убивать. τοὺς ἐν τοῖς πεδίοις καὶ ἐν τῷ ὄρει ἐπὶ τῆς καταβάσεως — тех, кто на полях и на горе, на спуске (κατάβασις). εἰς τέλος — до конца. ἐπάταξεν αὐτὴν ἐν στόματι ῥομφαίας — поразил её устами меча."
  25: "οἱ πεσόντες ... δώδεκα χιλιάδες — падших двенадцать тысяч. ἀπὸ ἀνδρὸς καὶ ἕως γυναικός — от мужа и до жены. πάντας τοὺς κατοικοῦντας Γαι — всех жителей Гая."
  26: "В gr-lxx-byz (и в gr-ru) на месте стиха стоит «.» — текст в модуле утрачен. Стих целиком по csl 8:26: Иисус не опускал руки с копьём, доколе не предал заклятию всех жителей Гая. В МТ этот стих — 8:26."
  27: "πλὴν τῶν κτηνῶν καὶ τῶν σκύλων — кроме скота и добычи (σκῦλα — добыча, вещи). κατὰ πρόσταγμα κυρίου — по повелению Господню. ὃν τρόπον συνέταξεν κύριος τῷ Ἰησοῖ — как заповедал Господь Иисусу."
  28: "ἐνεπύρισεν ... ἐν πυρί — сжёг огнём (ἐμπυρίζω). χῶμα ἀοίκητον εἰς τὸν αἰῶνα — необитаемый холм навек (χῶμα — насыпь, холм). ἕως τῆς ἡμέρας ταύτης — до сего дня."
  29: "ἐκρέμασεν ἐπὶ ξύλου διδύμου — повесил на дереве двойном (ξύλον δίδυμον; слав. «на древе сугубем»). ἐπιδύνοντος τοῦ ἡλίου — при заходящем солнце (ἐπιδύνω). καθείλοσαν ... ἀπὸ τοῦ ξύλου — сняли с дерева (καθαιρέω). εἰς τὸν βόθρον — в яму (βόθρος). σωρὸν λίθων — груду камней."
  30: "В gr стих помечен «30a» — так в LXX делится этот отдел. ᾠκοδόμησεν ... θυσιαστήριον κυρίῳ τῷ θεῷ Ισραηλ — построил жертвенник Господу Богу Израиля. ἐν ὄρει Γαιβαλ — на горе Гевал (LXX Γαιβαλ; в корпусе エバル山, ср. Втор 27:4)."
  31: "καθότι ἐνετείλατο Μωϋσῆς ὁ θεράπων κυρίου — как заповедал Моисей, раб Господень. καθὰ γέγραπται ἐν τῷ νόμῳ Μωυσῆ — как написано в законе Моисея. θυσιαστήριον λίθων ὁλοκλήρων — жертвенник из камней цельных (ὁλόκληρος). ἐφ᾽ οὓς οὐκ ἐπεβλήθη σίδηρος — на которые не возложено железо. ἀνεβίβασεν ὁλοκαυτώματα καὶ θυσίαν σωτηρίου — вознёс всесожжения и жертву спасения (酬恩祭)."
  32: "ἐπὶ τῶν λίθων — на камнях. τὸ δευτερονόμιον, νόμον Μωυσῆ — «второзаконие, закон Моисея» (δευτερονόμιον; так LXX называет книгу Второзакония). ὃν ἔγραψεν ἐνώπιον υἱῶν Ισραηλ — который написал пред сынами Израиля."
  33: "οἱ πρεσβύτεροι ... οἱ δικασταὶ καὶ οἱ γραμματεῖς — старейшины, судьи и книжники. παρεπορεύοντο ἔνθεν καὶ ἔνθεν τῆς κιβωτοῦ ἀπέναντι — проходили с той и другой стороны ковчега напротив. ὁ προσήλυτος καὶ ὁ αὐτόχθων — пришелец и туземец. ἥμισυ πλησίον ὄρους Γαριζιν ... Γαιβαλ — половина близ горы Гаризим, половина близ Гевала (в корпусе ゲリジム山, エバル山). εὐλογῆσαι τὸν λαὸν ἐν πρώτοις — благословить народ в начале."
  34: "μετὰ ταῦτα ... ἀνέγνω — после этого прочитал (ἀναγινώσκω). τὰς εὐλογίας καὶ τὰς κατάρας — благословения и проклятия. κατὰ πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωυσῆ — по всему написанному в законе Моисея."
  35: "οὐκ ἦν ῥῆμα ... ὃ οὐκ ἀνέγνω — не было слова, которого не прочитал. εἰς τὰ ὦτα πάσης ἐκκλησίας — в уши всего собрания (ἐκκλησία). τοῖς ἀνδράσιν καὶ ταῖς γυναιξὶν καὶ τοῖς παιδίοις — мужьям, жёнам и детям. τοῖς προσηλύτοις τοῖς προσπορευομένοις τῷ Ισραηλ — пришельцам, приступающим к Израилю."
