verses:
  1: "ホロフェルネスは彼女[かのじょ]に言[い]った。「女[おんな]よ、勇気[ゆうき]を出[だ]せ。心[こころ]で恐[おそ]れるな。わたしは、全[ぜん]地[ち]の王[おう]ネブカドネツァルに仕[つか]えることを選[えら]んだ者[もの]には、だれにも害[がい]を加[くわ]えなかったからである。"
  2: "今[いま]、山地[さんち]に住[す]むあなたの民[たみ]がわたしを蔑[さげず]まなかったなら、わたしは彼らに槍[やり]を向[む]けはしなかっただろう。しかし彼らは自分[じぶん]たち自身[じしん]にこれを行[おこな]ったのだ。"
  3: "さあ、なぜ彼らのもとから逃[に]げてわたしたちのところへ来[き]たのか、わたしに言[い]え。あなたは救[すく]いのために来[き]たのだ。勇気[ゆうき]を出[だ]せ。この夜[よる]も、その後[あと]も、あなたは生[い]きる。"
  4: "あなたを害[がい]する者[もの]はなく、わたしの主人[しゅじん]である王[おう]ネブカドネツァルの僕[しもべ]たちにするように、あなたにもよくしてくれる。」"
  5: "ユディトは彼に言[い]った。「あなたの女奴隷[おんなどれい]の言葉[ことば]を受[う]け入[い]れてください。この女中[じょちゅう]にあなたの前[まえ]で語[かた]らせてください。わたしはこの夜[よる]、わが主人[しゅじん]に偽[いつわ]りを告[つ]げない。"
  6: "あなたがこの女中[じょちゅう]の言葉[ことば]に従[したが]うなら、神[かみ]はあなたとともに事[こと]を完全[かんぜん]に行[おこな]われる。わが主人[しゅじん]も、その企[くわだ]てから外[はず]れることはない。"
  7: "全[ぜん]地[ち]の王[おう]ネブカドネツァルは生[い]きておられ、その支配[しはい]も生[い]きているからである。彼はあなたを、すべての魂[たましい]を正[ただ]しく導[みちび]くために遣[つか]わした。人[ひと]々[びと]があなたによって彼に仕[つか]えるだけでなく、野[の]の獣[けもの]も家畜[かちく]も天[てん]の鳥[とり]も、あなたの力[ちから]によって、ネブカドネツァルとその家[いえ]のすべてのために生[い]きることになるからである。"
  8: "わたしたちはあなたの知恵[ちえ]と、あなたの魂[たましい]の巧[たく]みを聞[き]いた。あなただけがすべての王国[おうこく]のうちで善[よ]く、知識[ちしき]に強[つよ]く、戦[いくさ]の軍[ぐん]で驚[おどろ]くべき者[もの]であることが、全[ぜん]地[ち]に告[つ]げ知[し]らされている。"
  9: "今[いま]、アヒオルがあなたの評議[ひょうぎ]で語[かた]った言葉[ことば]、その言葉をわたしたちは聞[き]いた。ベトリアの人[ひと]々[びと]が彼を生[い]かしておき、彼があなたのもとで語[かた]ったすべてのことを彼らに告[つ]げたからである。"
  10: "それゆえ、わが主人[しゅじん]よ、彼の言葉[ことば]を聞[き]き過[す]ごしてはならない。それをあなたの心[こころ]に置[お]いてください。それは真実[しんじつ]である。わたしたちの民[たみ]は罰[ばつ]せられず、彼らが自分[じぶん]たちの神[かみ]に罪[つみ]を犯[おか]さないかぎり、剣[つるぎ]は彼らに打[う]ち勝[か]たないからである。"
  11: "今[いま]、わが主人[しゅじん]が退[しりぞ]けられ、何[なに]も成[な]し遂[と]げられないままにならないように、また死[し]が彼らの顔[かお]に降[ふ]りかからないように。彼らがよからぬことを行[おこな]うとき、それによって自分[じぶん]たちの神[かみ]を怒[いか]らせる罪[つみ]が、すでに彼らを捕[と]らえている。"
  12: "彼らに食物[しょくもつ]が尽[つ]き、水[みず]がすべて乏[とぼ]しくなったので、彼らは自分[じぶん]たちの家畜[かちく]に手[て]をつけようと企[くわだ]て、神[かみ]がその律[りつ]法[ほう]によって食べてはならないと彼らに命[めい]じたすべてのものまでも、費[つい]やそうと決[けっ]心[しん]した。"
  13: "また、彼らが聖[せい]別[べつ]して、エルサレムでわたしたちの神[かみ]の前[まえ]に仕[つか]える祭司[さいし]たちのために取[と]っておいた、麦[むぎ]の初[はつ]穂[ほ]と、ぶどう酒[しゅ]と油[あぶら]の十分[じゅうぶん]の一[いち]を、使[つか]い果[は]たそうと決[き]めた。それらは民[たみ]のうちのだれも手[て]を触[ふ]れることさえふさわしくなかったものである。"
  14: "そして彼らはエルサレムへ、長老会[ちょうろうかい]から自分[じぶん]たちへの許[ゆる]しを持[も]ち帰[かえ]る者[もの]たちを遣[つか]わした。そこに住[す]む者[もの]たちもこれを行[おこな]ったからである。"
  15: "そして、彼らに告[つ]げられて彼らがそれを行[おこな]うとすぐに、その日[ひ]、彼らはあなたに滅[ほろ]ぼされるために引[ひ]き渡[わた]される。"
  16: "それゆえ、わたし女奴隷[おんなどれい]はこれらのすべてを知[し]って彼らのもとから逃[に]げた。神[かみ]はわたしをあなたのもとへ遣[つか]わし、あなたとともに、それを聞[き]く者[もの]すべてが驚[おどろ]くような事[こと]を行[おこな]うようにされた。"
  17: "わたし女奴隷[おんなどれい]は神[かみ]を敬[うやま]い、夜[よる]も昼[ひる]も天[てん]の神に仕[つか]えているからである。今[いま]、わが主人[しゅじん]よ、わたしはあなたのそばにとどまる。この女奴隷[おんなどれい]は夜[よる]ごとに谷[たに]へ出[で]て、神に祈[いの]る。すると神は、彼らがいつ罪[つみ]を犯[おか]したかをわたしに告[つ]げてくださる。"
  18: "わたしは来[き]てあなたに告[つ]げる。あなたはあなたのすべての軍[ぐん]とともに出[で]て行[い]く。彼らのうち、あなたに逆[さか]らう者[もの]はひとりもいない。"
  19: "わたしはあなたをユダヤのただ中[なか]を通[とお]って、エルサレムの前[まえ]に来[く]るまで導[みちび]く。わたしはあなたの座[ざ]をそのただ中[なか]に置[お]く。あなたは彼らを、羊飼[ひつじか]いのいない羊[ひつじ]のように追[お]いやる。犬[いぬ]もあなたに向[む]かって一声[ひとこえ]も鳴[な]かない。これらはわたしの予知[よち]によってわたしに語[かた]られ、わたしに告[つ]げられたことである。わたしはあなたに告[つ]げるために遣[つか]わされたのである。」"
  20: "彼女[かのじょ]の言葉[ことば]はホロフェルネスとそのすべての僕[しもべ]たちの前[まえ]で気[き]に入[い]った。彼らは彼女[かのじょ]の知恵[ちえ]に驚[おどろ]いて言[い]った。"
  21: "「地[ち]の果[は]てから果てまで、顔[かお]の美[うつく]しさと、言葉[ことば]の賢[かしこ]さにおいて、このような女[おんな]はひとりもいない。」"
  22: "ホロフェルネスは彼女[かのじょ]に言[い]った。「神[かみ]はあなたをこの民[たみ]の前[まえ]に遣[つか]わして、よくしてくださった。わたしたちの手[て]に力[ちから]が得[え]られ、わたしの主人[しゅじん]を蔑[さげず]んだ者[もの]たちには滅[ほろ]びが来[く]るためである。"
  23: "今[いま]、あなたはその姿[すがた]において美[うつく]しく、その言葉[ことば]においてすぐれている。あなたが語[かた]ったとおりに行[おこな]うなら、あなたの神[かみ]はわたしの神となる。あなたはネブカドネツァル王[おう]の家[いえ]に座[すわ]り、全[ぜん]地[ち]にわたって名[な]高[だか]い者[もの]となる。」"

notes:
  1: "Θάρσησον, γύναι — «дерзай, жена» (θαρσέω — быть смелым). μὴ φοβηθῇς τῇ καρδίᾳ σου — «не устрашись сердцем». ἐγὼ οὐκ ἐκάκωσα ἄνθρωπον — «я не сделал зла человеку» (κακόω). ὅστις ᾑρέτικεν δουλεύειν — «который предпочёл служить» (αἱρέω — выбирать; perfect со значением настоящего). βασιλεῖ Ναβουχοδονοσορ πάσης τῆς γῆς — «царю Навуходоносору всей земли»."
  2: "εἰ μὴ ἐφαύλισάν με — «если бы не презрели меня» (φαυλίζω — считать ничтожным). οὐκ ἂν ἦρα τὸ δόρυ μου ἐπ᾿ αὐτούς — «не поднял бы копья моего на них» (αἴρω; δόρυ — копьё), ирреальное условие передано だろう. αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα — «они сами себе сделали это»."
  3: "τίνος ἕνεκεν ἀπέδρας ἀπ᾿ αὐτῶν — «ради чего ты убежала от них» (ἀποδιδράσκω). ἥκεις γὰρ εἰς σωτηρίαν — «ибо ты пришла ко спасению» (ἥκω, σωτηρία). θάρσει — импер. наст. от θαρσέω. ἐν τῇ νυκτὶ ταύτῃ ζήσῃ καὶ εἰς τὸ λοιπόν — «в эту ночь будешь жива и в остальное [время]» (ζάω, λοιπόν)."
  4: "οὐ γάρ ἐστιν ὃς ἀδικήσει σε — «нет того, кто обидит тебя» (ἀδικέω). εὖ σε ποιήσει — «благо тебе сделает». καθὰ γίνεται τοῖς δούλοις — «как бывает рабам» (καθά — сообразно). τοῦ κυρίου μου βασιλέως — «господина моего царя»."
  5: "Δέξαι τὰ ῥήματα τῆς δούλης σου — «прими слова рабы твоей» (δέχομαι; δούλη — 女奴隷). λαλησάτω ἡ παιδίσκη σου — импер. 3 л. «пусть рабыня твоя говорит» (λαλέω; παιδίσκη — 女中). κατὰ πρόσωπόν σου — «пред лицом твоим». οὐκ ἀναγγελῶ ψεῦδος — «не возвещу лжи» (ἀναγγέλλω): Иудифь начинает с заверения в правдивости, что усиливает последующий обман."
  6: "κατακολουθήσῃς τοῖς λόγοις — «последуешь словам» (κατακολουθέω). τελείως πρᾶγμα ποιήσει μετὰ σοῦ ὁ θεός — «совершенно дело сотворит с тобою Бог» (τελείως — совершенно; πρᾶγμα — дело). οὐκ ἀποπεσεῖται ὁ κύριός μου τῶν ἐπιτηδευμάτων αὐτοῦ — «не отпадёт господин мой от начинаний своих» (ἀποπίπτω — отпадать; ἐπιτήδευμα — замысел)."
  7: "ζῇ γὰρ βασιλεὺς … καὶ ζῇ τὸ κράτος αὐτοῦ — клятвенная формула «жив царь… и жива держава его» (ζάω); сходные клятвы «жив Господь» часты в книгах Царств. ὃς ἀπέστειλέν σε εἰς κατόρθωσιν πάσης ψυχῆς — «который послал тебя для исправления [устроения] всякой души» (κατόρθωσις). τὰ θηρία τοῦ ἀγροῦ καὶ τὰ κτήνη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ — звери полевые, скот и птицы небесные. διὰ τῆς ἰσχύος σου ζήσονται ἐπὶ Ναβουχοδονοσορ — «силою твоею будут жить о Навуходоносоре», т. е. ради него и его дома (ἐπί с дат.); тёмный оборот передан буквально."
  8: "ἠκούσαμεν τὴν σοφίαν σου — «мы слышали о мудрости твоей» (σοφία). πανουργεύματα τῆς ψυχῆς σου — «хитрости души твоей» (παννούργευμα — лукавство, 巧み). ἀνηγγέλη πάσῃ τῇ γῇ — «возвещено всей земле» (ἀναγγέλλω). ἀγαθὸς ἐν πάσῃ βασιλείᾳ — «добрый во всяком царстве». δυνατὸς ἐν ἐπιστήμῃ — «сильный в знании» (ἐπιστήμη). θαυμαστὸς ἐν στρατεύμασιν πολέμου — «дивный в войсках [ратях] войны» (στράτευμα)."
  9: "ὁ λόγος, ὃν ἐλάλησεν Αχιωρ — «слово, которое изрёк Ахиор» (λαλέω). ἐν τῇ συνεδρίᾳ σου — «в совете [заседании] твоём» (συνέδριον — собрание, совет; в тексте 評議). περιεποιήσαντο αὐτὸν οἱ ἄνδρες Βαιτυλουα — «сохранили его мужи Ветилуи» (περιποιέομαι — сберегать). ὅσα ἐξελάλησεν παρὰ σοί — «что он изрёк у тебя» (ἐκλαλέω)."
  10: "διό, δέσποτα κύριε — «посему, владыко господине»: двойное обращение (δεσπότης — владыка, κύριος — господин). μὴ παρέλθῃς τὸν λόγον αὐτοῦ — «не пройди мимо слова его» (παρέρχομαι): не оставь без внимания. κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου — «положи его в сердце твоём» (κατατίθημι). οὐ γὰρ ἐκδικᾶται τὸ γένος ἡμῶν — «ибо род наш не наказывается [не мстится]» (ἐκδικέω, pass.): смена лица («наш род» — «их Бог») сохранена, как в греческом. οὐ κατισχύει ῥομφαία ἐπ᾿ αὐτούς — «не одолевает меч их» (κατισχύω). ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν — «если не согрешат пред Богом своим»."
  11: "ἵνα μὴ γένηται ὁ κύριός μου ἔκβολος καὶ ἄπρακτος — «чтобы господин мой не оказался отверженным и безуспешным» (ἔκβολος — выброшенный; ἄπρακτος — не достигший дела). ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν — «падёт смерть на лицо их» (ἐπιπίπτω). κατελάβετο αὐτοὺς ἁμάρτημα — «постиг их грех» (καταλαμβάνω). ὁπηνίκα ἂν ποιήσωσιν ἀτοπίαν — «когда бы ни сделали недолжное» (ἀτοπία — неуместное, неподобающее)."
  12: "παρεξέλιπεν αὐτοὺς τὰ βρώματα — «оскудела у них пища» (παρεκλείπω — иссякать; βρῶμα — пища). ἐσπανίσθη πᾶν ὕδωρ — «вся вода истощилась» (σπανίζω — быть скудным). ἐπιβαλεῖν τοῖς κτήνεσιν — «броситься на скот» (ἐπιβάλλω — наложить руку). ὅσα διεστείλατο … μὴ φαγεῖν — «что заповедал … не есть» (διαστέλλω — строго заповедовать). διέγνωσαν δαπανῆσαι — «решили истратить» (δαπανάω)."
  13: "ἀπαρχαὶ τοῦ σίτου — «начатки пшеницы» (ἀπαρχή — 初穂). δεκάται τοῦ οἴνου καὶ τοῦ ἐλαίου — «десятины вина и елея» (δεκάτη). ἃ διεφύλαξαν ἁγιάσαντες τοῖς ἱερεῦσιν — «которые сохранили, освятив для священников» (διαφυλάσσω, ἁγιάζω). τοῖς παρεστηκόσιν ἐν Ιερουσαλημ ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν — «предстоящим в Иерусалиме пред лицом Бога нашего» (παρίστημι). ὧν οὐδὲ ταῖς χερσὶν καθῆκεν ἅψασθαι — «которых даже руками не подобало касаться» (καθήκω — подобать; ἅπτομαι)."
  14: "ἀπεστάλκασιν εἰς Ιερουσαλημ — perfect: «послали в Иерусалим» (ἀποστέλλω). οἱ ἐκεῖ κατοικοῦντες ἐποίησαν ταῦτα — «и тамошние жители делали это». τοὺς μετακομίσοντας αὐτοῖς τὴν ἄφεσιν παρὰ τῆς γερουσίας — «тех, кто принесёт им разрешение от герусии» (μετακομίζω — доставлять; ἄφεσις — отпущение, разрешение; γερουσία — 長老会): в греческом винительный падеж без сказуемого, анаколуф; в тексте соединён с предыдущим «послали»."
  15: "ἔσται ὡς ἂν ἀναγγείλῃ αὐτοῖς καὶ ποιήσωσιν — «будет, как только возвестят им и они сделают» (ἀναγγέλλω). δοθήσονταί σοι εἰς ὄλεθρον — «преданы будут тебе на погибель» (δίδωμι, ὄλεθρος). ἐν τῇ ἡμέρᾳ ἐκείνῃ — «в тот день»."
  16: "ὅθεν … ἐπιγνοῦσα ταῦτα πάντα — «посему, узнав всё это» (ἐπιγινώσκω). ἀπέδρων ἀπὸ προσώπου αὐτῶν — «убежала от лица их» (имперфект, как и в 10:12). ἀπέστειλέν με ὁ θεὸς ποιῆσαι μετὰ σοῦ πράγματα — «послал меня Бог сделать с тобою дела». ἐφ᾿ οἷς ἐκστήσεται πᾶσα ἡ γῆ — «которым изумится вся земля» (ἐξίστημι — изумляться). ὅσοι ἐὰν ἀκούσωσιν αὐτά — «все, кто услышит их». Речь Иудифи продолжается до ст. 19, поэтому кавычки не закрываются."
  17: "θεοσεβής — «благочестивая» (θεοσεβής; 神を敬う). θεραπεύουσα νυκτὸς καὶ ἡμέρας — «служащая ночью и днём» (θεραπεύω). μενῶ παρὰ σοί — «пребуду у тебя» (μένω). κατὰ νύκτα εἰς τὴν φάραγγα — «по ночам в долину [ущелье]» (φάραγξ — 谷). ἐρεῖ μοι πότε ἐποίησαν τὰ ἁμαρτήματα αὐτῶν — «скажет мне, когда они совершили грехи свои» (ἁμάρτημα)."
  18: "ἐλθοῦσα προσανοίσω σοι — «придя, принесу тебе [весть]» (προσφέρω, буд. προσανοίσω). ἐξελεύσῃ σὺν πάσῃ τῇ δυνάμει σου — «выйдешь со всею силою твоею» (δύναμις — войско). οὐκ ἔστιν ὃς ἀντιστήσεταί σοι ἐξ αὐτῶν — «нет из них, кто противостанет тебе» (ἀνθίστημι)."
  19: "ἄξω σε διὰ μέσου τῆς Ιουδαίας — «поведу тебя через середину Иудеи» (ἄγω). ἕως τοῦ ἐλθεῖν ἀπέναντι Ιερουσαλημ — «до того, как прийти напротив Иерусалима». θήσω τὸν δίφρον σου ἐν μέσῳ αὐτῆς — «поставлю престол [седалище] твой среди него» (δίφρος — седалище, трон). ἄξεις αὐτοὺς ὡς πρόβατα, οἷς οὐκ ἔστιν ποιμήν — «погонишь их, как овец, у которых нет пастуха» (ποιμήν). οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ — «не заворчит пёс языком своим» (γρύζω — ворчать, рычать): образ полной покорности. κατὰ πρόγνωσίν μου — «по предведению моему» (πρόγνωσις)."
  20: "ἤρεσαν οἱ λόγοι αὐτῆς — «понравились слова её» (ἀρέσκω). ἐθαύμασαν ἐπὶ τῇ σοφίᾳ αὐτῆς — «дивились мудрости её» (θαυμάζω). καὶ εἶπαν — «и сказали»: вводит речь следующего стиха."
  21: "Οὐκ ἔστιν τοιαύτη γυνὴ ἀπ᾿ ἄκρου ἕως ἄκρου τῆς γῆς — «нет такой жены от края до края земли» (ἄκρον — край). ἐν καλῷ προσώπῳ καὶ συνέσει λόγων — «по красоте лица и по разуму слов» (σύνεσις — понимание, разумность)."
  22: "Εὖ ἐποίησεν ὁ θεὸς ἀποστείλας σε — «хорошо сделал Бог, послав тебя» (εὖ ποιέω; прич. аор.). ἔμπροσθεν τοῦ λαοῦ — «пред народом», т. е. прежде народа. τοῦ γενηθῆναι ἐν χερσὶν ἡμῶν κράτος — «чтобы в руках наших была держава» (κράτος). ἐν δὲ τοῖς φαυλίσασι τὸν κύριόν μου ἀπώλειαν — «а на презревших господина моего — погибель» (φαυλίζω, ἀπώλεια): эллипсис, сказуемое подразумевается."
  23: "ἀστεία … ἐν τῷ εἴδει σου — «прекрасна видом твоим» (ἀστεῖος — изящный; εἶδος — вид). ἀγαθὴ ἐν τοῖς λόγοις σου — «добра в словах твоих». ἐὰν ποιήσῃς καθὰ ἐλάλησας — «если сделаешь, как сказала». ὁ θεός σου ἔσται μου θεός — «Бог твой будет мне Богом»: формула обращения, здесь — лесть. ἐν οἴκῳ βασιλέως … καθήσῃ — «сядешь в доме царя» (καθίζω). ἔσῃ ὀνομαστὴ παρὰ πᾶσαν τὴν γῆν — «будешь именита по всей земле» (ὀνομαστός)."
