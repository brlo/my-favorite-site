notes:
  1: "Ἐγὼ ἀνὴρ ὁ βλέπων πτωχείαν ἐν ῥάβδῳ θυμοῦ αὐτοῦ ἐπ᾿ ἐμέ — «я человек, видящий нищету под жезлом ярости Его на мне» (ῥάβδος — 杖; πτωχεία — 苦しみ, нищета). Глава — речь самого пророка, поэтому внешних кавычек нет. Акростих: Алеф (1–3; в слав. — разметка, не слово текста; в японском не воспроизводится)."
  2: "παρέλαβέν με καὶ ἀπήγαγεν εἰς σκότος καὶ οὐ φῶς — «взял меня и отвёл во тьму, а не в свет» (ἀπάγω — уводить). Повтор 闇 сохранён: светではなく闇へ."
  3: "πλὴν ἐν ἐμοὶ ἐπέστρεψεν χεῖρα αὐτοῦ ὅλην τὴν ἡμέραν — «но на меня обратил руку Свою весь день» (πλήν — но, только): ただ…一日中. ὅλην τὴν ἡμέραν — постоянный оборот главы (3, 14, 62)."
  4: "Ἐπαλαίωσεν σάρκας μου καὶ δέρμα μου — «обветшил (износил) плоть мою и кожу мою» (παλαιόω — изнашивать; слав. «обетши»): すり減らせ. ὀστέα μου συνέτριψεν — «кости мои сокрушил». Акростих: Беф (4–6)."
  5: "ἀνῳκοδόμησεν κατ᾿ ἐμοῦ — «соорудил против меня» (ἀνοικοδομέω — возводить стену): 石垣を築き, ср. 3:7, 9. ἐκύκλωσεν κεφαλήν μου — «обложил голову мою» (κυκλόω). ἐμόχθησεν — «утрудил» (μοχθέω; в модуле ἐμόχθησεν)."
  6: "ἐν σκοτεινοῖς ἐκάθισέν με ὡς νεκροὺς αἰῶνος — «в тёмных местах посадил меня, как вековых (давно) мёртвых» (σκοτεινός; αἰών — век): 遠い昔に死んだ者のように."
  7: "Ἀνῳκοδόμησεν κατ᾿ ἐμοῦ, καὶ οὐκ ἐξελεύσομαι — «соорудил против меня, и я не выйду». ἐβάρυνεν χαλκόν μου — «отяготил медь мою», т. е. оковы (χαλκός — медь; слав. «оковы»): 足かせ. Акростих: Гимель (7–9)."
  8: "καί γε κεκράξομαι καὶ βοήσω, ἀπέφραξεν προσευχήν μου — «и когда я воззову и возопию, Он заградил молитву мою» (ἀποφράσσω — заграждать): 祈りを閉ざされた."
  9: "ἀνῳκοδόμησεν ὁδούς μου — «соорудил пути мои» (дороги завалены). ἐνέφραξεν τρίβους μου — «заградил стези мои» (τρίβος — 小径). ἐτάραξεν — «привёл в смятение»: かき乱された."
  10: "Ἄρκος ἐνεδρεύουσα αὐτός μοι — «медведь, подстерегающий меня» (ἄρκος — медведь; ἐνεδρεύω — подстерегать). λέων ἐν κρυφαίοις — «лев в скрытых местах» (κρυφαῖος — тайный): 隠れ場に潜む獅子. Акростих: Далеф (10–12)."
  11: "κατεδίωξεν ἀφεστηκότα — «погнал отступившего (сбившегося с пути)» (ἀφίστημι). κατέπαυσέν με — «успокоил (остановил) меня» (καταπαύω; слав. «упокои мя»): 歩みを止め. ἔθετό με ἠφανισμένην — «положил меня опустошённой»."
  12: "ἐνέτεινεν τόξον αὐτοῦ καὶ ἐστήλωσέν με ὡς σκοπὸν εἰς βέλος — «натянул лук Свой и поставил меня, как цель для стрелы» (στηλόω — ставить; σκοπός — 的; βέλος — 矢): 弓を引き、的として立てられた."
  13: "Εἰσήγαγεν τοῖς νεφροῖς μου ἰοὺς φαρέτρας αὐτοῦ — «ввёл в почки мои стрелы колчана Своего» (νεφρός — почка, сокровенное; φαρέτρα — колчан): 内深く射込まれた. Акростих: Ге (13–15)."
  14: "ἐγενήθην γέλως παντὶ λαῷ μου — «стал я посмешищем для всего народа моего» (γέλως — смех). ψαλμὸς αὐτῶν ὅλην τὴν ἡμέραν — «песнь их весь день»: 一日中の歌."
  15: "ἐχόρτασέν με πικρίας — «насытил меня горечью» (πικρία; слав. «насыти мя горести»). ἐμέθυσέν με χολῆς — «напоил меня желчью до опьянения» (χολή — жёлчь, 苦い汁; μεθύσκω — поить допьяна)."
  16: "ἐξέβαλεν ψήφῳ ὀδόντας μου — «выбил камнем зубы мои» (ψῆφος — камень, галька; слав. «изя каменем зубы моя»). ἐψώμισέν με σποδόν — «накормил меня пеплом» (ψωμίζω — кормить кусками; σποδός — 灰). Акростих: Вав (16–18)."
  17: "ἀπώσατο ἐξ εἰρήνης ψυχήν μου — «отринул от мира душу мою» (ἀπωθέω — отталкивать; εἰρήνη — 平安). ἐπελαθόμην ἀγαθά — «я забыл блага» (ἐπιλανθάνομαι)."
  18: "καὶ εἶπα· Ἀπώλετο νεῖκός μου καὶ ἡ ἐλπίς μου ἀπὸ κυρίου — «и сказал я: погибла сила (победа) моя и надежда моя от Господа» (νεῖκος — победа, сила; ἀπόλλυμι): свои слова — 「…」."
  19: "Ἐμνήσθην ἀπὸ πτωχείας μου καὶ ἐκ διωγμοῦ μου — «вспомнил я о нищете моей и о гонении моём» (διωγμός). πικρίας καὶ χολῆς μου — «горечи и жёлчи моей». Греч. имеет изъявительное ἐμνήσθην; слав. читает императив «Помяни» (по МТ זְכָר): по паритету здесь держим LXX, потому что слав. следует масоретскому тексту и разрывает связь со ст. 21, слав. вариант отмечен. Акростих: Заин (19–21)."
  20: "μνησθήσεται καὶ καταδολεσχήσει ἐπ᾿ ἐμὲ ἡ ψυχή μου — «будет помнить и изнемогать (размышлять) надо мной душа моя» (καταδολεσχέω — размышлять, изнемогать; слав. «стужит во мне душа моя»): うなだれる. Стих продолжает ст. 19."
  21: "ταύτην τάξω εἰς τὴν καρδίαν μου — «это положу в сердце моё» (τάσσω — полагать). διὰ τοῦτο ὑπομενῶ — «потому буду терпеть (уповать)» (ὑπομένω): 耐え忍ぶ; в ru «уповаю» — по МТ."
  22: "В греческом модуле на месте стиха стоит «.» — лакуна, стих переведён по csl. Слав. текст здесь — конфляция двух чтений: «Милость Господня, яко не остави мене, не скончашася бо щедроты его» (ἔλεος κυρίου, ὅτι οὐκ ἐγκατέλιπές με, οὐκ ἐξέλιπον οἱ οἰκτιρμοί αὐτοῦ) и «пребываяй во утриих, помилуй, Господи, яко не погибохом, не скончашася бо щедроты твоя» (ὁ ἐπιμένων τὸ πρωί, ἐλέησον, κύριε, ὅτι οὐκ ἀπωλόμεθα…). Оба чтения переведены подряд, повтор 慈しみは尽きない сохранён; слав. «мене» (ед. ч.) и «погибохом» (мн. ч.) переданы как в слав. Акростих: Иф (22–24)."
  23: "В греческом модуле «.» — лакуна, стих переведён по csl: «Новая во утриих, многа есть вера твоя» (καινοὶ εἰς τὸ πρωί, πολλὴ ἡ πίστις σου). πίστις здесь — «верность» (真実), как в ru «велика верность Твоя»."
  24: "В греческом модуле «.» — лакуна, стих переведён по csl: «Часть моя Господь, рече душа моя: сего ради пожду его» (μερίς μου κύριος, εἶπεν ἡ ψυχή μου· διὰ τοῦτο ὑπομενῶ αὐτῷ). Слова души — 「…」. 分け前 = μερίς (слав. «часть»), не 嗣業 (κληρονομία)."
  25: "Ἀγαθὸς κύριος τοῖς ὑπομένουσιν αὐτὸν — «благ Господь надеющимся (терпящим) на Него» (ὑπομένω). ψυχῇ ἣ ζητήσει αὐτὸν ἀγαθόν — «душе, которая ищет Его, — благо» (ζητέω — 求める): 良い方…良い, ср. 26–27. Акростих: Теф (25–27)."
  26: "καὶ ὑπομενεῖ καὶ ἡσυχάσει εἰς τὸ σωτήριον κυρίου — «и будет ждать и молчать в ожидании спасения Господня» (ἡσυχάζω — молчать, покоиться). Слав. присоединяет «благо (есть)» из ст. 25 (3:26 начинается «души ищущей его благо есть, и надеющейся с молчанием спасения Божия»), поэтому 良い добавлено и здесь."
  27: "ἀγαθὸν ἀνδρὶ ὅταν ἄρῃ ζυγὸν ἐν νεότητι αὐτοῦ — «благо человеку, когда он понесёт ярмо в юности своей» (ζυγός — 軛; νεότης — 若いとき). Третья формула 良い подряд (25, 26, 27)."
  28: "Καθήσεται κατὰ μόνας καὶ σιωπήσεται — «сядет уединённо и умолкнет» (κατὰ μόνας — ひとり). ὅτι ἦρεν ἐφ᾿ ἑαυτῷ — «ибо возложил на себя (на него)»: греч. ἑαυτῷ допускает оба понимания, в тексте 彼の上に負わせられた; слав. «яко воздвигну на ся» тёмен. Акростих: Иод (28–30)."
  29: "В греческом модуле «.» — лакуна, стих переведён по csl: «положит во прахе уста своя, негли како будет надежда» (θήσει ἐν χοΐ (χῶ) τὸ στόμα αὐτοῦ, εἴ πως ἐστὶν ἐλπίς). 塵 = прах (χοῦς); негли — «может быть» (もしかすると)."
  30: "δώσει τῷ παίοντι αὐτὸν σιαγόνα — «подставит биющему его ланиту» (σιαγών — 頬; παίω — бить; ср. Мф 5:39). χορτασθήσεται ὀνειδισμῶν — «насытится поношениями» (ὀνειδισμός — ののしり): 満ち足りる."
  31: "Ὅτι οὐκ εἰς τὸν αἰῶνα ἀπώσεται κύριος — «ибо не навек отринет Господь» (ἀπωθέω): とこしえに捨ててはおかれない. Акростих: Каф (31–33)."
  32: "ὅτι ὁ ταπεινώσας οἰκτιρήσει κατὰ τὸ πλῆθος τοῦ ἐλέους αὐτοῦ — «ибо смиривший помилует по множеству милости Своей» (οἰκτιρέω — миловать; ἔλεος): 豊かなあわれみ."
  33: "ὅτι οὐκ ἀπεκρίθη ἀπὸ καρδίας αὐτοῦ καὶ ἐταπείνωσεν υἱοὺς ἀνδρός — «ибо не ответил (не изрёк) от сердца Своего, чтобы смирить сынов человеческих» (ἀποκρίνομαι здесь передаёт евр. ענה «смирять, угнетать», буквально «отвечать»): тёмное место; слав. «не отрину от сердца своего и смири сыны мужеския» понял как «не отверг». В тексте — по слав.: 退け…卑しくされたのではない."
  34: "Τοῦ ταπεινῶσαι ὑπὸ τοὺς πόδας αὐτοῦ πάντας δεσμίους γῆς — «смирить под ногами Своими всех узников земли» (δεσμώτης — связанный, пленник): 囚われ人. Начало ряда из трёх инфинитивов (34–36), завершаемого в 36. Акростих: Ламед (34–36)."
  35: "τοῦ ἐκκλῖναι κρίσιν ἀνδρὸς κατέναντι προσώπου ὑψίστου — «покривить суд человека пред лицом Всевышнего» (ἐκκλίνω — уклонять; ὕψιστος — 至高の者, как в Ис 14:14). 裁き = κρίσις."
  36: "καταδικᾶσαι ἄνθρωπον ἐν τῷ κρίνεσθαι αὐτὸν — «осудить человека, когда он судится» (καταδικάζω). κύριος οὐκ εἶπεν — «Господь не сказал (не повелел)»: тёмное место; слав. «Господь не рече», в ru по МТ «разве не видит Господь?». Ряд 34–36 завершается これらのことを…言われなかった."
  37: "Τίς οὕτως εἶπεν, καὶ ἐγενήθη; — «кто так сказал, и это было?» κύριος οὐκ ἐνετείλατο — «Господь не повелел» (ἐντέλλομαι): 命じられなかったのに. Акростих: Мем (37–39)."
  38: "ἐκ στόματος ὑψίστου οὐκ ἐξελεύσεται τὰ κακὰ καὶ τὸ ἀγαθόν — «из уст Всевышнего не исходит ли злое и доброе» (вопрос сохранён): 災いも良いことも…出るのではないか."
  39: "τί γογγύσει ἄνθρωπος ζῶν — «что ропщет человек живущий» (γογγύζω — роптать; слав. «что возропщет»). ἀνὴρ περὶ τῆς ἁμαρτίας αὐτοῦ — «муж о грехе своём»: 自分の罪についてつぶやくのか."
  40: "Ἐξηρευνήθη ἡ ὁδὸς ἡμῶν καὶ ἠτάσθη — «исследован путь наш и испытан» (ἐξερευνάω, ἐτάζω). καὶ ἐπιστρέψωμεν ἕως κυρίου — «и обратимся к Господу» (ἐπιστρέφω — 立ち返る): когортатив 立ち返ろう. Акростих: Нун (40–42)."
  41: "ἀναλάβωμεν καρδίας ἡμῶν ἐπὶ χειρῶν πρὸς ὑψηλὸν ἐν οὐρανῷ — «воздвигнем сердца наши с руками к Высокому на небе» (ἀναλαμβάνω — поднимать; ἐπὶ χειρῶν — с руками): 心を両手とともに上げよう."
  42: "Ἡμαρτήσαμεν, ἠσεβήσαμεν — «мы согрешили, мы нечествовали» (ἀσεβέω — 不敬を行う). καὶ οὐχ ἱλάσθης — «и Ты не умилостивился» (ἱλάσκομαι — умилостивлять, миловать): あわれんでくださらなかった."
  43: "Ἐπεσκέπασας ἐν θυμῷ — «Ты покрыл (Себя) яростью» (ἐπισκέπω — покрывать; ср. 44). ἀπεδίωξας ἡμᾶς — «прогнал нас» (ἀποδιώκω). ἀπέκτεινας, οὐκ ἐφείσω — «убивал, не пощадил» (φείδομαι). Акростих: Самех (43–45)."
  44: "ἐπεσκέπασας νεφέλην σεαυτῷ εἵνεκεν προσευχῆς — «Ты покрыл Себя облаком, чтобы (не доходила) молитва» (νεφέλη — 雲; εἵνεκεν — ради): 祈りが届かないように. Тёмное место: εἵνεκεν προσευχῆς — «ради молитвы»."
  45: "καμμύσαι με καὶ ἀπωσθῆναι ἔθηκας ἡμᾶς ἐν μέσῳ τῶν λαῶν — «Ты поставил нас, чтобы смыкать (глаза) мне и быть отверженными, среди народов» (καμμύω — смыкать очи; ἀπωθέω — отвергать): слав. «сомжити очи мои и отринути, положил еси нас посреде людий»; тёмное место, сохранено буквально."
  46: "Διήνοιξαν ἐφ᾿ ἡμᾶς τὸ στόμα αὐτῶν πάντες οἱ ἐχθροὶ ἡμῶν — «разинули на нас уста свои все враги наши»: та же формула, что 2:16 и 3:46; 口を開いた. Акростих: Аин (46–48)."
  47: "φόβος καὶ θυμὸς ἐγενήθη ἡμῖν — «страх и ярость стали нам» (θυμός — 憤り; слав. «страх и ужас»). ἔπαρσις καὶ συντριβή — «надмение и сокрушение» (ἔπαρσις — поднятие, гордыня; συντριβή — 打ち砕き): 高ぶりと打ち砕き."
  48: "ἀφέσεις ὑδάτων κατάξει ὁ ὀφθαλμός μου — «потоки вод низведёт око моё» (ἄφεσις — отпущение, поток; κατάγω — низводить): формула слёз, ср. 1:16. ἐπὶ τὸ σύντριμμα τῆς θυγατρὸς τοῦ λαοῦ μου — «о сокрушении дщери народа моего»."
  49: "Ὁ ὀφθαλμός μου κατεπόθη — «око моё поглощено (погрязло)» (καταπίνω). καὶ οὐ σιγήσομαι — «и не умолкну» (σιγάω). τοῦ μὴ εἶναι ἔκνηψιν — «так что нет облегчения (отрезвления)» (ἔκνηψις, ср. 2:18): 休むことがない. Акростих: Фи (49–51)."
  50: "ἕως οὗ διακύψῃ καὶ ἴδῃ κύριος ἐξ οὐρανοῦ — «доколе не приникнет и не увидит Господь с неба» (διακύπτω — выглядывать): 身を乗り出して見てくださるまで. Продолжает ст. 49."
  51: "ὁ ὀφθαλμός μου ἐπιφυλλιεῖ ἐπὶ τὴν ψυχήν μου — «око моё обирает душу мою» (ἐπιφυλλίζω — обирать, 摘み尽くす, как 1:22; 2:20). παρὰ πάσας θυγατέρας πόλεως — «более всех дочерей города»: 都の娘たちすべてのゆえに."
  52: "Θηρεύοντες ἐθηρεύσαντό με ὡς στρουθίον οἱ ἐχθροί μου δωρεάν — «ловя, уловили меня, как птичку, враги мои без причины» (θηρεύω — ловить; στρουθίον — 雀; δωρεάν — 理由もなく). Cognatus сохранён: 狩り立てて捕らえようとした. Акростих: Цади (52–54)."
  53: "ἐθανάτωσαν ἐν λάκκῳ ζωήν μου — «умертвили в яме жизнь мою» (λάκκος — 穴; слав. «умориша в рове»). ἐπέθηκαν λίθον ἐπ᾿ ἐμοί — «положили камень на меня» (ἐπιτίθημι)."
  54: "ὑπερεχύθη ὕδωρ ἐπὶ κεφαλήν μου — «перелилась вода через голову мою» (ὑπερχέω). εἶπα· Ἀπώσμαι — «сказал я: я отринут (погиб)» (ἀπωθέω, страд.): свои слова — 「…」."
  55: "Ἐπεκαλεσάμην τὸ ὄνομά σου, κύριε, ἐκ λάκκου κατωτάτου — «призвал я имя Твоё, Господи, из ямы глубочайшей» (κατώτατος — самый нижний): 最も深い穴. Акростих: Коф (55–57)."
  56: "φωνήν μου ἤκουσας — «голос мой Ты услышал». μὴ κρύψῃς τὰ ὦτά σου εἰς τὴν δέησίν μου — «не скрой ушей Твоих от моления моего» (κρύπτω — скрывать; δέησις — 願い): 願いのために…閉ざさないでください."
  57: "εἰς τὴν βοήθειάν μου ἤγγισας — «на помощь мою Ты приблизился» (ἐγγίζω). ἐν ᾗ σε ἡμέρᾳ ἐπεκαλεσάμην — «в день, когда я призвал Тебя». εἶπάς μοι· Μὴ φοβοῦ — «Ты сказал мне: не бойся»: слова Господа — 「…」."
  58: "Ἐδίκασας, κύριε, τὰς δίκας τῆς ψυχῆς μου — «Ты рассудил, Господи, тяжбы души моей» (δικάζω — судить; δίκη — 訴え, тяжба). ἐλυτρώσω τὴν ζωήν μου — «Ты искупил жизнь мою» (λυτρόω — 贖う). Акростих: Реш (58–60)."
  59: "εἶδες, κύριε, τὰς ταραχάς μου — «Ты видел, Господи, смятения мои» (ταραχή — 騒ぎ). ἔκρινας τὴν κρίσιν μου — «Ты рассудил дело моё» (κρίνω): 裁きを裁かれました."
  60: "εἶδες πᾶσαν τὴν ἐκδίκησιν αὐτῶν — «Ты видел всё мщение их» (ἐκδίκησις — 復讐). πάντας τοὺς διαλογισμοὺς αὐτῶν ἐν ἐμοί — «все помышления их обо мне» (διαλογισμός — 思い)."
  61: "Ἤκουσας τὸν ὀνειδισμὸν αὐτῶν — «Ты услышал поношение их» (ὀνειδισμός). πάντας τοὺς διαλογισμοὺς αὐτῶν κατ᾿ ἐμοῦ — «все помышления их против меня». Акростих: Шин (61–63)."
  62: "χεῖλη ἐπανιστανομένων μοι — «уста восстающих на меня» (ἐπανίστημι — восставать; χεῖλος — 唇). μελέτας αὐτῶν κατ᾿ ἐμοῦ ὅλην τὴν ἡμέραν — «умышления их против меня весь день» (μελέτη — 思い, замысел; ср. 3:3, 14)."
  63: "καθέδραν αὐτῶν καὶ ἀνάστασιν αὐτῶν — «сидение их и вставание их» (καθέδρα — 座ること; ἀνάστασις — вставание): пристальное наблюдение за каждым движением. ἐπίβλεψον ἐπὶ τοὺς ὀφθαλμοὺς αὐτῶν — «воззри на глаза их» (ἐπιβλέπω). Стих есть в gr — вопреки ожиданию, что глава обрывается на 62: строки 3:63–66 в базе присутствуют (слав. совпадает)."
  64: "Ἀποδώσεις αὐτοῖς ἀνταπόδομα, κύριε — «воздашь им воздаяние, Господи» (ἀνταπόδομα — 報い). κατὰ τὰ ἔργα τῶν χειρῶν αὐτῶν — «по делам рук их». Акростих: Фав (64–66)."
  65: "ἀποδώσεις αὐτοῖς ὑπερασπισμὸν καρδίας — «воздашь им защиту (покров) сердца» (ὑπερασπισμός — заступление, покров): тёмное место, в ru по МТ «помрачение сердца»; сохранено буквально 心を覆うもの. μόχθον σου αὐτοῖς — «труд Твой им» (μόχθος — 労苦; слав. «сердца моего труд»): тёмное место."
  66: "καταδιώξεις ἐν ὀργῇ καὶ ἐξαναλώσεις αὐτοὺς ὑποκάτω τοῦ οὐρανοῦ, κύριε — «погонишь в гневе и истребишь их под небом, Господи» (καταδιώκω; ἐξαναλίσκω — истреблять; ὑποκάτω — 天の下). Заключительный стих главы; гр. текст наличествует."
