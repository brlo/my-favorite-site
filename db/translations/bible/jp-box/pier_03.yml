# jp-box, Плач Иеремии, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Плача нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3 — личный плач и молитва самого пророка: 1–20 скорбь под жезлом гнева
# (тьма, ограда, медведь и лев, лук и стрелы, горечь и пепел, «погибла сила моя»);
# 21–24 поворот к надежде (22–24 в греческом модуле стоят как «.» — переведены по
# слав.); 25–42 «благ Господь надеющимся», благо нести ярмо в юности, подставить ланиту,
# не навек оставляет, не от сердца смиряет, кто сказал — и было, испытаем пути,
# воздвигнем сердца; 43–54 Ты покрыл Себя гневом и облаком, мы стали посмешищем,
# потоки слёз, око не умолкает, «уловили меня, как птичку», воды до головы;
# 55–66 молитва из рва: Ты услышал, приблизился, судил дело моё, воздай им.
# Акростих: 22 группы по 3 стиха (1–3, 4–6, … 64–66); в слав. перед первым стихом
# каждой группы стоит название евр. буквы (Алеф 1, Беф 4, Гимель 7, Далеф 10, Ге 13,
# Вав 16, Заин 19, Иф 22, Теф 25, Иод 28, Каф 31, Ламед 34, Мем 37, Нун 40, Самех 43,
# Аин 46, Фи 49, Цади 52, Коф 55, Реш 58, Шин 61, Фав 64). Это разметка акростиха,
# а не слова текста: в перевод не включена, отмечена в notes первого стиха каждой
# группы; в японском акростих не воспроизводится. В gr-lxx-byz названий букв нет.
# Нумерация по gr и по слав. совпадает: 66 стихов. Лакуны модуля — «.» в 3:22, 3:23,
# 3:24, 3:29 (4 стиха); они переведены по csl без 〔…〕, в notes отмечено, что в
# греческом модуле стиха нет. В книге 154 стиха по слав./Синодальному; в gr-lxx-byz
# 154 строки, из них 150 с текстом и 4 «.» (отсюда «150 стихов» в брифе).
# ВНИМАНИЕ: по брифу ожидалось, что глава 3 в gr обрывается на ст. 62; в базе
# проверено (tmp/pier_dump_123.txt) — строки 3:63–66 в gr есть (καθέδραν αὐτῶν…
# ἀποδώσεις αὐτοῖς ἀνταπόδομα…), слав. совпадает, поэтому 63–66 переведены по греч.
# с контролем csl, а не по одному слав. Отмечено в notes 63–66.
# 〔…〕 нет. Слав. «(мою)», «(приседяй ми)» и подобные пометы в скобках — редакционные.
# Кавычки: внешних кавычек нет — вся глава речь пророка; вложенная прямая речь —
# 3:18 (свои слова), 3:24 (слова души), 3:54 («погиб»), 3:57 («не бойся» — слова
# Господа) — первого уровня 「…», каждая пара внутри стиха.
# Сносок ⟨…⟩ нет: 軛, 灰, 塵, 贖う, 至高の者, 的 уже в корпусе.
# Имена нет; 至高の者 = ὕψιστος (как в Ис 14).

