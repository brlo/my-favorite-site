# jp-box, Осия, глава 1. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (см. шапку ниже).
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni): славяно-синодальная расходится только границей
# глав (наш 2:1–2 = слав. 1:10–11, наш 12:1 = слав. 11:12); всего в книге 197 стихов.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 надписание; 2 повеление взять жену блуда и детей блуда; 3 Гомерь,
# рождение сына; 4–5 имя Изреель: кровь Иегу на доме, конец царства Израиля, лук
# сокрушён в долине Изреель; 6 дочь Ло-Рухама («непомилованная»); 7 помилование
# Иуды; 8–9 сын Ло-Амми («не мой народ»).
# Голоса: 1 — надписание вне кавычек; 2 — формула «И сказал Господь» + 「…」;
# 3 — повествование; 4–5 — 「…» (одно слово, закрывается в 5); 6–7 — 「…» (одно слово,
# закрывается в 7); 8 — повествование; 9 — 「…».
# 1:4: LXX «οἶκον Ιου» = дом Иегу (евр. יהוא); слав. «на дому иудове» понял как Иуду,
# в тексте LXX.
# 1:9: слав. добавляет «Бог» («аз несмь Бог ваш»); в LXX «ἐγὼ οὐκ εἰμὶ ὑμῶν» —
# «Я не ваш», принято слав. (в notes).
#
