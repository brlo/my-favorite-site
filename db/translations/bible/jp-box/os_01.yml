verses:
  1: "主[しゅ]の言葉[ことば]が、ベエリの子[こ]ホセアに臨[のぞ]んだ。ユダの王[おう]ウジヤ、ヨタム、アハズ、ヒゼキヤの時代[じだい]、イスラエルの王[おう]ヨアシュの子[こ]ヤロブアムの時代[じだい]であった。"
  2: "主[しゅ]がホセアに語[かた]られた言葉[ことば]の始[はじ]まり。主[しゅ]はホセアに言[い]われた。「行[い]って、淫行[いんこう]の女[おんな]を妻[つま]に迎[むか]え、淫行[いんこう]の子[こ]どもをもうけよ。この地[ち]が主[しゅ]から離[はな]れて、淫行[いんこう]を重[かさ]ねているからである」。"
  3: "彼は行[い]って、デブライムの娘[むすめ]ゴメルを娶[めと]った。彼女[かのじょ]は身[み]ごもり、男[おとこ]の子[こ]を産[う]んだ。"
  4: "主[しゅ]は彼に言[い]われた。「その名[な]をイズレエルと呼[よ]べ。まもなく、わたしはイエフの家[いえ]にイズレエルの血[ち]の報[むく]いを求[もと]め、イスラエルの家[いえ]の王国[おうこく]を絶[た]つからである。"
  5: "その日[ひ]、わたしはイズレエルの谷[たに]でイスラエルの弓[ゆみ]を砕[くだ]く」。"
  6: "彼女[かのじょ]はまた身[み]ごもり、娘[むすめ]を産[う]んだ。主[しゅ]は彼に言[い]われた。「その名[な]をロ・ルハマと呼[よ]べ。わたしはもはやイスラエルの家[いえ]をあわれむことをせず、彼らに敵[てき]して立[た]つからである。"
  7: "しかし、ユダの子[こ]らをわたしはあわれみ、彼らの神[かみ]である主[しゅ]によって彼らを救[すく]う。弓[ゆみ]によっても、剣[つるぎ]によっても、戦[たたか]いによっても、戦車[せんしゃ]によっても、馬[うま]によっても、騎兵[きへい]によっても救[すく]わない」。"
  8: "彼女[かのじょ]はロ・ルハマを乳離[ちばな]れさせ、また身[み]ごもり、男[おとこ]の子[こ]を産[う]んだ。"
  9: "主[しゅ]は言[い]われた。「その名[な]をロ・アミと呼[よ]べ。あなたがたはわたしの民[たみ]ではなく、わたしもあなたがたの神[かみ]ではないからである」。"
  10: "「イスラエルの子[こ]らの数[かず]は海[うみ]の砂[すな]のようになり、量[はか]ることも数[かぞ]えることもできない。かつて『あなたがたはわたしの民[たみ]ではない』と言[い]われたその所[ところ]で、彼らは生[い]ける神[かみ]の子[こ]らと呼[よ]ばれる。"
  11: "ユダの子[こ]らとイスラエルの子[こ]らは共[とも]に集[あつ]められ、自分[じぶん]たちのために一[ひと]つの頭[かしら]を立[た]て、この地[ち]から上[のぼ]って来[く]る。イズレエルの日[ひ]は大[おお]きいからである。"

notes:
  1: "Λόγος κυρίου, ὃς ἐγενήθη πρὸς Ωσηε τὸν τοῦ Βεηρι — «слово Господне, которое было к Осии, сыну Беериину»; ἐν ἡμέραις Οζιου καὶ Ιωαθαμ καὶ Αχαζ καὶ Εζεκιου βασιλέων Ιουδα — «во дни Озии, Иоафама, Ахаза, Езекии, царей Иудиных» (ウジヤ, ヨタム, アハズ, ヒゼキヤ); Ιεροβοαμ υἱοῦ Ιωας — «Иеровоама, сына Иоасова» (ヤロブアム, ヨアシュ). Прозаическое надписание, не поэзия."
  2: "Ἀρχὴ λόγου κυρίου πρὸς Ωσηε — «начало слова Господня к Осии» (слав. «Начало словесе Господня ко Осии»); Βάδιζε λαβὲ σεαυτῷ γυναῖκα πορνείας — «иди, возьми себе жену блуда» (πορνεία — блуд, 淫行); τέκνα πορνείας — «детей блуда»; ἐκπορνεύουσα ἐκπορνεύσει — усиление «блудя соблудит» (слав. «блудящи соблудит»), передано «淫行を重ねている»; ἀπὸ ὄπισθεν τοῦ κυρίου — «отступив от Господа» (букв. «из-за спины»)."
  3: "Γομερ θυγατέρα Δεβηλαιμ — «Гомерь, дочь Дивлаима» (ゴメル, デブライム — по LXX); συνέλαβεν καὶ ἔτεκεν αὐτῷ υἱόν — «зачала и родила ему сына»."
  4: "Κάλεσον τὸ ὄνομα αὐτοῦ Ιεζραελ — «нареки имя ему Изреель» (イズレエル); ἐκδικήσω τὸ αἷμα τοῦ Ιεζραελ ἐπὶ τὸν οἶκον Ιου — «взыщу кровь Изрееля с дома Иу(я)»: LXX Ιου — Иегу (евр. יהוא), слав. «на дому иудове» понял как Иуду; принято LXX — イエフ (в notes слав. чтение); καταπαύσω βασιλείαν οἴκου Ισραηλ — «положу конец царству дома Израилева»."
  5: "συντρίψω τὸ τόξον τοῦ Ισραηλ ἐν τῇ κοιλάδι τοῦ Ιεζραελ — «сокрушу лук Израилев в долине Изреель». Военная сила (лук) — не «войско»; долина Изреель — место гибели дома Ахава. Здесь слово Господа закрывается."
  6: "Οὐκ ἠλεημένη — «Непомилованная» (ロ・ルハマ — транслитерация евр. имени, ср. 2:25); οὐ μὴ προσθήσω ἔτι ἐλεῆσαι τὸν οἶκον τοῦ Ισραηλ — «не буду более миловать дом Израилев»; ἀλλ᾿ ἢ ἀντιτασσόμενος ἀντιτάξομαι αὐτοῖς — «но, противясь, воспротивлюсь им» (слав. «противляяся возсопротивлюся»), передано «彼らに敵して立つ»."
  7: "τοὺς δὲ υἱοὺς Ιουδα ἐλεήσω — «сынов же Иудиных помилую»; ἐν κυρίῳ θεῷ αὐτῶν — «в Господе Боге их» (слав. «о Господе Бозе их»); οὐ σώσω αὐτοὺς ἐν τόξῳ οὐδὲ ἐν ῥομφαίᾳ οὐδὲ ἐν πολέμῳ οὐδὲ ἐν ἅρμασιν οὐδὲ ἐν ἵπποις οὐδὲ ἐν ἱππεῦσιν — «не спасу их ни луком, ни мечом, ни войною, ни колесницами, ни конями, ни всадниками» (шестикратное «ни»)."
  8: "ἀπεγαλάκτισεν τὴν Οὐκ ἠλεημένην — «отняла от груди Непомилованную» (ἀπογαλακτίζω — отнимать от груди; слав. «отдои»); συνέλαβεν ἔτι καὶ ἔτεκεν υἱόν — «зачала ещё и родила сына»."
  9: "Οὐ λαός μου — «Не мой народ» (ロ・アミ); ὑμεῖς οὐ λαός μου — «вы не Мой народ»; ἐγὼ οὐκ εἰμὶ ὑμῶν — «Я не ваш»; слав. «аз несмь Бог ваш» добавляет «Бог» — нет в LXX, принято слав. (церковное чтение), отмечено."
  10: "Καὶ ἦν ὁ ἀριθμὸς τῶν υἱῶν Ισραηλ ὡς ἡ ἄμμος τῆς θαλάσσης — «и будет число сынов Израилевых как песок морской» (слав. 1:10); ἣ οὐκ ἐκμετρηθήσεται οὐδὲ ἐξαριθμηθήσεται — «которого нельзя ни измерить, ни исчислить»; ἐν τῷ τόπῳ, οὗ ἐρρέθη αὐτοῖς Οὐ λαός μου ὑμεῖς — «на месте, где сказано им: вы не Мой народ»; κληθήσονται υἱοὶ θεοῦ ζῶντος — «нарекутся сыны Бога живого». Начало нового речения без формулы; в слав. это 1:10."
  11: "συναχθήσονται οἱ υἱοὶ Ιουδα καὶ οἱ υἱοὶ Ισραηλ ἐπὶ τὸ αὐτό — «соберутся сыны Иудины и сыны Израилевы вместе»; θήσονται ἑαυτοῖς ἀρχὴν μίαν — «поставят себе одного начальника» (ἀρχή — начало, власть; слав. «власть едину»); ἀναβήσονται ἐκ τῆς γῆς — «выйдут из земли» (слав. «изыдут от земли»); μεγάλη ἡ ἡμέρα τοῦ Ιεζραελ — «велик день Изрееля». В слав. это 1:11."
