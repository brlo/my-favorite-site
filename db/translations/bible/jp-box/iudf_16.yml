# jp-box, Иудифь, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: песнь Иудифи (1–17) — поэзия с параллелизмами; затем эпилог от третьего
# лица (18–25): приход в Иерусалим и жертвы (18–20), три месяца радости (20),
# возвращение в Ветилую (21), жизнь и смерть Иудифи, 105 лет (22–23), семидневный
# плач и раздел имущества (24), мир после неё (25). Вся песнь 1–17 — одна прямая
# речь 「…」, вложенных цитат в ней нет; красного и синего нет.
# Нумерация по gr: 25 стихов; деление совпадает с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: タンバリン, シンバル, 燔祭, 垂れ幕, 女中 и пр. уже в корпусе.
