verses:
  1: "ユディトは言[い]った。「わたしの神[かみ]にタンバリンで歌[うた]い始[はじ]めよ。主[しゅ]にシンバルで歌え。新[あたら]しい歌を美[うつく]しく調[ととの]えて彼[かれ]に歌い、その名[な]を高[たか]く挙[あ]げて呼[よ]び求[もと]めよ。"
  2: "戦[いくさ]を砕[くだ]く神[かみ]は主[しゅ]であるからである。主は民[たみ]のただ中[なか]にあるご自分[じぶん]の陣営[じんえい]で、わたしを追[お]う者[もの]の手[て]からわたしを引[ひ]き出[だ]されたからである。"
  3: "アッシリアは北[きた]の山々[やまやま]から来[き]た。数万[すうまん]の軍勢[ぐんぜい]をもって来た。その多[おお]くは谷川[たにがわ]をせき止[と]め、彼[かれ]らの騎兵[きへい]は丘[おか]を覆[おお]った。"
  4: "彼[かれ]は、わたしの領土[りょうど]を焼[や]き払[はら]い、わたしの若者[わかもの]たちを剣[つるぎ]で殺[ころ]し、乳[ちち]を飲[の]む者[もの]たちを地[ち]に打[う]ち伏[ふ]せ、幼[おさな]い子[こ]どもたちを略奪[りゃくだつ]に与[あた]え、わたしの処女[しょじょ]たちをかすめ取[と]ると言[い]った。"
  5: "全能者[ぜんのうしゃ]である主[しゅ]は、女[おんな]の手[て]によって彼[かれ]らを倒[たお]された。"
  6: "彼[かれ]らの強[つよ]い者[もの]は若者[わかもの]たちによって倒[たお]れたのではなく、ティタンの子[こ]らが彼[かれ]を打[う]ったのでもなく、背[せ]の高[たか]い巨人[きょじん]たちが彼に襲[おそ]いかかったのでもない。しかし、メラリの娘[むすめ]ユディトが、その顔[かお]の美[うつく]しさによって彼[かれ]の力[ちから]を奪[うば]ったのである。"
  7: "彼女[かのじょ]は、イスラエルで苦[くる]しむ者[もの]たちを高[たか]く挙[あ]げるために、自分のやもめの衣[ころも]を脱[ぬ]ぎ、香油[こうゆ]を顔[かお]に塗[ぬ]ったからである。"
  8: "また、髪[かみ]を頭[あたま]の飾[かざ]りで結[むす]び、彼[かれ]を欺[あざむ]くために亜麻[あま]の衣[ころも]をまとった。"
  9: "彼女[かのじょ]のサンダルは彼[かれ]の目[め]を奪[うば]い、彼女の美[うつく]しさは彼の魂[たましい]を捕[と]らえた。短剣[たんけん]は彼の首[くび]を貫[つらぬ]いた。"
  10: "ペルシア人[じん]は彼女[かのじょ]の大胆[だいたん]さに恐[おそ]れおののき、メディア人[じん]は彼女の豪胆[ごうたん]さに心[こころ]を乱[みだ]した。"
  11: "そのとき、わたしのへりくだる者[もの]たちは叫[さけ]び、わたしの弱[よわ]い者たちも叫んだ。その声[こえ]に敵[てき]は恐[おそ]れおののき、声を上[あ]げて、打[う]ち負[ま]かされた。"
  12: "若[わか]い女[おんな]たちの子[こ]らが彼[かれ]らを刺[さ]し貫[つらぬ]き、逃亡者[とうぼうしゃ]の子[こ]どものように彼らを傷[きず]つけた。彼らはわたしの主[しゅ]の軍勢[ぐんぜい]によって滅[ほろ]びた。"
  13: "わたしの神[かみ]に新[あたら]しい歌[うた]を歌おう。主[しゅ]よ、あなたは大[おお]いなる方[かた]、栄光[えいこう]ある方、力[ちから]において驚[おどろ]くべき方、比[くら]べるもののない方である。"
  14: "あなたが造[つく]られたものはすべて、あなたに仕[つか]えよ。あなたが語[かた]られると、それらは成[な]った。あなたがあなたの霊[れい]を送[おく]られると、それは造[つく]り上[あ]げた。あなたの声[こえ]に逆[さか]らう者[もの]はない。"
  15: "山[やま]は水[みず]とともに基[もと]から揺[ゆ]れ動[うご]き、岩[いわ]はあなたの前[まえ]でろうのように溶[と]ける。しかし、あなたを恐[おそ]れる者[もの]たちには、あなたは憐[あわ]れみを示[しめ]される。"
  16: "あなたに芳[かんば]しい香[かおり]となるすべてのいけにえは小[ちい]さく、燔祭[はんさい]のためのすべての脂肪[しぼう]もわずかである。しかし、主[しゅ]を恐[おそ]れる者[もの]はいつも大[おお]きい者[もの]である。"
  17: "わざわいなるかな、わたしの一族[いちぞく]に立[た]ち向[む]かう諸国民[しょこくみん]は。全能者[ぜんのうしゃ]である主[しゅ]は、裁[さば]きの日[ひ]に彼[かれ]らに報[むく]いて、彼らの肉[にく]に火[ひ]と虫[むし]を与[あた]えられる。彼らは感[かん]じながら永遠[えいえん]に泣[な]くであろう。」"
  18: "彼[かれ]らはエルサレムに来[く]ると、神[かみ]に礼拝[れいはい]した。民[たみ]が清[きよ]められると、彼らは自分[じぶん]たちの燔祭[はんさい]、自発[じはつ]の捧[ささ]げ物[もの]、および贈[おく]り物[もの]をささげた。"
  19: "ユディトは、民[たみ]が彼女[かのじょ]に与[あた]えたホロフェルネスのすべての器[うつわ]と、彼[かれ]の寝室[しんしつ]から自分[じぶん]のために取[と]った垂[た]れ幕[まく]を、神[かみ]への奉納物[ほうのうもの]としてささげた。"
  20: "民[たみ]はエルサレムで、聖所[せいしょ]の前[まえ]で三[みっ]か月[げつ]の間[あいだ]喜[よろこ]び楽[たの]しみ、ユディトも彼[かれ]らとともにそこにとどまった。"
  21: "これらの日[ひ]々[び]の後[のち]、それぞれが自分[じぶん]の嗣業[しぎょう]へ帰[かえ]った。ユディトはベトリアへ行[い]って自分の財産[ざいさん]のところにとどまり、時[とき]が来[く]ると全[ぜん]地[ち]で名高[なだか]くなった。"
  22: "多[おお]くの人[ひと]が彼女[かのじょ]を望[のぞ]んだが、夫[おっと]であるマナセが死[し]んで自分[じぶん]の民[たみ]に加[くわ]えられた日[ひ]から、彼女の生涯[しょうがい]のすべていのちの日の間[あいだ]、男[おとこ]が彼女を知[し]ることはなかった。"
  23: "彼女[かのじょ]はますます大[おお]きくなり、夫[おっと]の家[いえ]で百五歳[ひゃくごさい]まで生[い]きて老[お]いた。そして女中[じょちゅう]を自由[じゆう]の身[み]にして去[さ]らせた。彼女はベトリアで死[し]に、夫マナセの洞窟[どうくつ]に葬[ほうむ]られた。"
  24: "イスラエルの家[いえ]は彼女[かのじょ]を七[なな]日[にち]の間[あいだ]嘆[なげ]き悲[かな]しんだ。彼女は死[し]ぬ前[まえ]に、自分の財産[ざいさん]を、夫[おっと]マナセのすべていた近[ちか]しい者[もの]たちと、自分[じぶん]の一族[いちぞく]の近しい者たちに分[わ]け与[あた]えた。"
  25: "ユディトの日[ひ]々[び]にも、また彼女[かのじょ]が死[し]んだ後[のち]も多[おお]くの日の間[あいだ]、イスラエルの子[こ]らを恐[おそ]れさせた者[もの]はもはやいなかった。"

notes:
  1: "καὶ εἶπεν Ιουδιθ — «и сказала Иудифь»: слова рассказчика вводят песнь, которая до ст. 17 идёт как её прямая речь. Ἐξάρχετε — «начинайте, запевайте» (ἐξάρχω). ἐν τυμπάνοις — «с тимпанами» (τύμπανον — タンバリン); ἐν κυμβάλοις — «с кимвалами» (κύμβαλον — シンバル). ἐναρμόσασθε αὐτῷ ψαλμὸν καὶ αἶνον — «сложите Ему стройно псалом и хвалу» (ἐναρμόζομαι — слаживать, настраивать; ψαλμός, αἶνος); слав. читает «красно воспойте ему песнь нову» — церковное чтение взято в текст; вариант LXX — ψαλμὸν καὶ αἶνον, «псалом и хвалу». ὑψοῦτε καὶ ἐπικαλεῖσθε τὸ ὄνομα αὐτοῦ — «возносите и призывайте имя Его»."
  2: "θεὸς συντρίβων πολέμους κύριος — «Бог, сокрушающий войны, — Господь» (συντρίβω — сокрушать, ломать; πόλεμος — война). εἰς παρεμβολὰς αὐτοῦ ἐν μέσῳ λαοῦ ἐξεῖλατό με — тёмное место: «в станы Свои среди народа изъял меня» (ἐξαιρέω — изымать, спасать); слав. «во ополчениих его посреде людий изят мя», ru «Он ополчился за меня среди народа». ἐκ χειρὸς καταδιωκόντων με — «из руки гонящих меня» (καταδιώκω — преследовать)."
  3: "ἦλθεν Ασσουρ ἐξ ὀρέων ἀπὸ βορρᾶ — «пришёл Ассур с гор от севера» (βορρᾶς — север). ἐν μυριάσι δυνάμεως αὐτοῦ — «с мириадами силы своей» (μυριάς — 10 000, 数万; δύναμις — сила, войско). ὧν τὸ πλῆθος αὐτῶν ἐνέφραξεν χειμάρρους — «которых множество запрудило потоки» (φράσσω — заграждать; χείμαρρος — поток, зимний ручей). ἡ ἵππος αὐτῶν ἐκάλυψεν βουνούς — «конница их покрыла холмы» (ἵππος — конница; βουνός — холм)."
  4: "εἶπεν ἐμπρήσειν — «сказал, что сожжёт» (ἐμπίμπρημι, буд. ἐμπρήσω). νεανίσκους — «юношей» (νεανίσκος). ἀνελεῖν ἐν ῥομφαίᾳ — «убить мечом» (ἀναιρέω; ῥομφαία — 剣). τὰ θηλάζοντα — «грудных младенцев» (θηλάζω — сосать грудь); θήσειν εἰς ἔδαφος — «положить на землю, повергнуть» (ἔδαφος — основание, пол; слав. «в помост»). νήπια — «малые дети»; εἰς προνομήν — «на разграбление» (προνομή). παρθένους σκυλεῦσαι — «дев обобрать, взять как добычу» (σκυλεύω — снимать доспехи, грабить)."
  5: "κύριος παντοκράτωρ — «Господь Вседержитель» (παντοκράτωρ — 全能者). ἠθέτησεν — «низложил, отверг, обесценил» (ἀθετέω — отменять, отметать; слав. «опроверже»); ἐν χειρὶ θηλείας — «рукою женщины» (θῆλυς — женский). Сжатая формула, отвечающая молитве 9:10 («сокруши гордыню их рукою женскою», ἐν χειρὶ θηλείας); ср. Суд 4:9."
  6: "οὐχ ὑπέπεσεν — «не пал» (ὑποπίπτω — подпадать). ὁ δυνατὸς αὐτῶν — «сильный их» (о Олоферне). υἱοὶ τιτάνων — «сыны титанов» (Τιτάνες — ティタン, древние исполины); ἐπάταξαν — «поразили» (πατάσσω). ὑψηλοὶ γίγαντες — «высокие исполины» (γίγας; слав. «высоцы исполини»). ἐν κάλλει προσώπου αὐτῆς — «красотой лица её» (κάλλος). παρέλυσεν — «расслабила, лишила силы» (παραλύω; слав. «разслаби»)."
  7: "ἐξεδύσατο στολὴν χηρεύσεως — «сняла с себя одежду вдовства» (ἐκδύω; χήρευσις — вдовство). εἰς ὕψος τῶν πονούντων ἐν Ισραηλ — «ради возвышения страждущих в Израиле» (ὕψος — высота; πονέω — трудиться, страдать). ἠλείψατο τὸ πρόσωπον ἐν μυρισμῷ — «помазала лицо благовонием» (ἀλείφω; μυρισμός — умащение, от μύρον; слав. «умащением»)."
  8: "ἐδήσατο τὰς τρίχας ἐν μίτρᾳ — «связала волосы повязкой» (δέω — вязать; θρίξ — волос; μίτρα — головная повязка, 頭の飾り; слав. «увяслом»). ἔλαβεν στολὴν λινῆν — «взяла льняную одежду» (λινῆν от λίνον — лён, 亜麻). εἰς ἀπάτην αὐτοῦ — «для обмана его» (ἀπάτη — обман, прельщение; слав. «в прельщение его»)."
  9: "τὸ σανδάλιον αὐτῆς ἥρπασεν ὀφθαλμὸν αὐτοῦ — «сандалия её похитила око его» (ἁρπάζω — хватать, похищать; σανδάλιον — サンダル). τὸ κάλλος αὐτῆς ᾐχμαλώτευσεν ψυχὴν αὐτοῦ — «красота её пленила душу его» (αἰχμαλωτεύω — брать в плен). διῆλθεν ὁ ἀκινάκης τὸν τράχηλον αὐτοῦ — «прошёл акинак (короткий меч) через шею его» (ἀκινάκης — персидский короткий меч, 短剣; τράχηλος — шея)."
  10: "ἔφριξαν — «содрогнулись» (φρίσσω). τὴν τόλμαν αὐτῆς — «дерзновению, отваге её» (τόλμα). Μῆδοι τὸ θράσος αὐτῆς ἐταράχθησαν — «мидяне смелостью её смутились» (θράσος — дерзость, отвага; ταράσσω — волновать); слав. «разседошася» — «расторглись, расселись». Речь о страхе врагов перед её мужеством."
  11: "ἠλάλαξαν — «воскликнули, возгласили» (ἀλαλάζω — боевой клич). οἱ ταπεινοί μου — «смиренные мои» (ταπεινός; слав. «смиреннии мои»). ἐφοβήθησαν οἱ ἀσθενοῦντές μου — в LXX «устрашились немощные мои», но слав. читает «возопиша немощнии мои» — церковное чтение взято в текст. ἐπτοήθησαν — «пришли в смятение» (πτοέω). ὕψωσαν τὴν φωνήν — «возвысили голос»; ἀνετράπησαν — «обратились в бегство, были опрокинуты» (ἀνατρέπω; слав. «побеждени быша»). Подлежащее в греч. меняется: страх и поражение относятся к врагам (так же понимают слав. и Син.), поэтому в тексте добавлено 敵 для ясности."
  12: "υἱοὶ κορασίων — «сыны девиц» (κοράσιον — девушка, молодая женщина; слав. «сынове отроковиц»), т. е. молодые воины. κατεκέντησαν — «пронзили» (κατακεντέω). ὡς παῖδας αὐτομολούντων — «как детей перебежчиков» (αὐτομολέω — перебегать; слав. «яко рабов беглецов»). ἐτίτρωσκον — «ранили» (τιτρώσκω). ἀπώλοντο ἐκ παρατάξεως κυρίου μου — «погибли от ополчения Господа моего» (παράταξις — строй, войско)."
  13: "ὑμνήσω τῷ θεῷ μου ὕμνον καινόν — «воспою Богу моему песнь новую» (ὑμνέω, ὕμνος; слав. читает «Господеви моему», в тексте — θεῷ по LXX). μέγας εἶ καὶ ἔνδοξος — «велик Ты и славен» (ἔνδοξος). θαυμαστὸς ἐν ἰσχύι — «дивен в силе» (θαυμαστός; ἰσχύς). ἀνυπέρβλητος — «непревзойдённый, несравненный» (слав. «непреборимый»)."
  14: "δουλευσάτω — «да служит» (δουλεύω). πᾶσα ἡ κτίσις σου — «всякое создание Твоё» (κτίσις — творение). εἶπας, καὶ ἐγενήθησαν — «сказал, и они стали» (γίνομαι). ἀπέστειλας τὸ πνεῦμά σου, καὶ ᾠκοδόμησεν — «послал Духа Твоего, и Он создал» (ἀποστέλλω; οἰκοδομέω — строить, созидать; слав. «созда»). οὐκ ἔστιν ὃς ἀντιστήσεται τῇ φωνῇ σου — «нет того, кто противостанет гласу Твоему» (ἀνθίστημι; φωνή)."
  15: "ὄρη ἐκ θεμελίων σὺν ὕδασιν σαλευθήσεται — «горы от оснований с водами подвигнутся» (θεμέλιος — основание; σαλεύω — колебать; при ср. мн. ὄρη сказуемое в ед. ч.). πέτραι … ὡς κηρὸς τακήσονται — «камни, как воск, растают» (πέτρα; κηρός — воск; τήκω — плавить). εὐιλατεύσεις — «будешь милостив, умилостивишься» (εὐιλατεύω, редкий глагол; слав. «умилостивляешися»)."
  16: "μικρὸν πᾶσα θυσία εἰς ὀσμὴν εὐωδίας — «мала всякая жертва в запах благоухания» (θυσία; ὀσμὴ εὐωδίας — 芳しい香, как в Лев). ἐλάχιστον πᾶν στέαρ εἰς ὁλοκαύτωμα — «самый малый всякий тук для всесожжения» (ἐλάχιστον; στέαρ — тук, жир; ὁλοκαύτωμα — 燔祭). ὁ φοβούμενος τὸν κύριον μέγας διὰ παντός — «боящийся Господа велик всегда» (διά παντός — всегда; слав. «выну»)."
  17: "οὐαὶ ἔθνεσιν ἐπανιστανομένοις τῷ γένει μου — «горе народам, восстающим на род мой» (οὐαί — わざわいなるかな; ἐπανίστημι — восставать). ἐκδικήσει — «отмстит» (ἐκδικέω). δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν — «дать огонь и червей в плоть их» (σκώληξ — червь; σάρξ — плоть); слав. «огнь и червие на плоти их». κλαύσονται ἐν αἰσθήσει ἕως αἰῶνος — «будут плакать в ощущении до века» (αἴσθησις — ощущение, чувство; слав. «в чувстве»)."
  18: "Ὡς δὲ ἤλθοσαν εἰς Ιερουσαλημ — «когда пришли в Иерусалим» (ἔρχομαι, поэт. форма ἤλθοσαν). προσεκύνησαν τῷ θεῷ — «поклонились Богу» (προσκυνέω). ἡνίκα ἐκαθαρίσθη ὁ λαός — «когда народ очистился» (καθαρίζω — очищать; слав. «егда очистишася людие»). ἀνήνεγκαν τὰ ὁλοκαυτώματα … καὶ τὰ ἑκούσια … καὶ τὰ δόματα — «вознесли всесожжения, добровольные приношения и дары» (ἀναφέρω; ἑκούσιος — добровольный; δόμα — дар)."
  19: "ἀνέθηκεν — «посвятила, принесла в дар» (ἀνατίθημι). σκεύη Ολοφέρνου — «сосуды Олоферна» (σκεῦος). κωνώπιον — «завеса, полог» (κωνώπιον — занавес от комаров; слав. «завесу»; в тексте 垂れ幕). εἰς ἀνάθημα τῷ θεῷ — «в приношение Богу» (ἀνάθημα — 奉納物); слав. читает «в дар Господу», в тексте — θεῷ по LXX. ἐκ τοῦ κοιτῶνος αὐτοῦ — «из спальни его» (κοιτών — 寝室)."
  20: "ἦν ὁ λαὸς εὐφραινόμενος — «народ веселился» (εὐφραίνω). κατὰ πρόσωπον τῶν ἁγίων — «пред лицом святых», т. е. святилища (ἅγια — 聖所; слав. «пред лицем святых»). ἐπὶ μῆνας τρεῖς — «три месяца». κατέμεινεν — «пребывала» (καταμένω)."
  21: "ἀνέζευξεν ἕκαστος — «отправился каждый» (ἀναζεύγνυμι — сниматься со стоянки). εἰς τὴν κληρονομίαν αὐτοῦ — «в наследие своё» (κληρονομία — 嗣業). ἐπὶ τῆς ὑπάρξεως αὐτῆς — «при имуществе своём» (ὕπαρξις — имение, собственность; слав. «над стяжанием своим»). κατὰ τὸν καιρὸν αὐτῆς ἔνδοξος ἐν πάσῃ τῇ γῇ — «в своё время славна во всей земле» (ἔνδοξος; καιρός)."
  22: "πολλοὶ ἐπεθύμησαν αὐτήν — «многие возжелали её» (ἐπιθυμέω). οὐκ ἔγνω ἀνὴρ αὐτήν — «не познал её мужчина», библейский эвфемизм супружеского общения (γινώσκω). ἀφ᾿ ἧς ἡμέρας ἀπέθανεν Μανασσης — «с того дня, как умер Манассия». προσετέθη πρὸς τὸν λαὸν αὐτοῦ — «приложился к народу своему», формула смерти (προστίθημι; ср. Быт 25:8)."
  23: "ἦν προβαίνουσα μεγάλη σφόδρα — «преуспевала, становясь весьма великой» (προβαίνω — продвигаться; слав. «произыде велика зело»). ἐγήρασεν ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς ἔτη ἑκατὸν πέντε — «состарилась в доме мужа своего, [прожив] сто пять лет» (γηράσκω; 百五歳). ἀφῆκεν τὴν ἅβραν ἐλευθέραν — «отпустила служанку на свободу» (ἀφίημι; ἅβρα — 女中; ἐλεύθερος — свободный). ἔθαψαν ἐν τῷ σπηλαίῳ — «погребли в пещере» (θάπτω; σπήλαιον — 洞窟)."
  24: "ἐπένθησεν αὐτὴν οἶκος Ισραηλ ἡμέρας ἑπτά — «оплакал её дом Израиля семь дней» (πενθέω — оплакивать). διεῖλεν τὰ ὑπάρχοντα αὐτῆς — «разделила имущество своё» (διαιρέω; ὕπαρξις). πρὸ τοῦ ἀποθανεῖν αὐτὴν — «прежде смерти своей». τοῖς ἔγγιστα Μανασση … καὶ τοῖς ἔγγιστα τοῦ γένους αὐτῆς — «близким Манассии, мужа её, и близким рода её» (ἔγγιστα — ближайшие; γένος — род)."
  25: "οὐκ ἦν ἔτι ὁ ἐκφοβῶν — «не было более устрашающего» (ἐκφοβέω — устрашать). τοὺς υἱοὺς Ισραηλ — «сынов Израиля». ἐν ταῖς ἡμέραις Ιουδιθ — «во дни Иудифи». μετὰ τὸ ἀποθανεῖν αὐτὴν ἡμέρας πολλάς — «после смерти её многие дни» (винительный времени)."
