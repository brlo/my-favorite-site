# Паритет: 16:1 «песнь нову» и 16:11 «возопиша» — церковные чтения csl (варианты LXX
# в notes); 16:13 и 16:19 θεῷ — чтение LXX (слав. «Господеви»/«Господу»), отмечено
# в notes.

