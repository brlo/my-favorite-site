# jp-box, 1-я Паралипоменон, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Пар нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 25: певцы — сыны Асафа (1–2), Едотона (3), Емана (4–5), их служение и число
# (6–7), жребии 24 чред по 12 человек (8–31).
# Инструменты по корпусу: κινύρα — 竪琴, νάβλα — 琴, κύμβαλον — シンバル
# (ср. 1 Цар 10:5; 2 Цар 6:5).
# Паритет LXX/csl: 25:6 — слав. прибавляет «в служение дому Божия», чтение внесено
# в основной текст без 〔…〕 (по книге 〔…〕 не ставим).
# Сносок ⟨…⟩ нет: 歌い手, 竪琴, 琴, シンバル, 組, くじ уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 25
draft: true

verses:
  1: "王[おう]ダビデと軍[ぐん]の長[かしら]たちは、アサフ、エマン、エドトンの子[こ]らを、竪琴[たてごと]と琴[こと]とシンバルで預言[よげん]する者[もの]として、務[つと]めに任[にん]じた。彼[かれ]らの数[かず]は、その務めに働[はたら]く者[もの]を頭[かしら]ごとに数[かぞ]えたものである。"
  2: "アサフの子[こ]らはザクル、ヨセフ、ネタンヤ、エラエル。彼[かれ]らは預言者[よげんしゃ]アサフに従[したが]い、王[おう]のそばにいた。"
  3: "エドトンにはエドトンの子[こ]ら、すなわちゴドリヤ、スリ、イシヤ、シメイ、アシャブヤ、マタテヤの六人[ろくにん]で、父[ちち]エドトンに従[したが]い、竪琴[たてごと]を奏[かな]でて、主[しゅ]に告白[こくはく]と賛美[さんび]をささげた。"
  4: "エマンにはエマンの子[こ]ら、すなわちブキヤ、マタンヤ、アザラエル、シュバエル、エリモト、ハナニヤ、ハナニ、エリアタ、ゴドラティ、ロマムティ・エゼル、ヨシュベカシャ、マロティ、オティル、マアジオト。"
  5: "これらはみな、王[おう]のために神[かみ]の言葉[ことば]によって奏[かな]で、角[つの]を高[たか]くするエマンの子[こ]らである。神はエマンに十四人[じゅうよにん]の子[こ]らと三人[さんにん]の娘[むすめ]たちを与[あた]えられた。"
  6: "これらはみな、父[ちち]とともに主[しゅ]の家[いえ]で、シンバルと琴[こと]と竪琴[たてごと]をもって歌[うた]う者[もの]であり、主の家の務[つと]めのために王[おう]のそばにいた。すなわち、アサフ、エドトン、エマンである。"
  7: "彼[かれ]らの数[かず]は、その兄弟[きょうだい]たちとともに主[しゅ]に歌[うた]うことを教[おし]えられた者[もの]、すなわちすべて悟[さと]りのある者[もの]で、二百八十八人[にひゃくはちじゅうはちにん]であった。"
  8: "彼[かれ]らもまた、小[ちい]さい者[もの]も大[おお]きい者[もの]も、熟達[じゅくたつ]した者[もの]も学[まな]ぶ者[もの]も、務[つと]めの組[くみ]のくじを投[な]げた。"
  9: "第一[だいいち]のくじは、アサフの子[こ]らとその兄弟[きょうだい]のうちのヨセフに、またゴドリヤに当[あ]たった。第二[だいに]はエニヤで、その子[こ]らと兄弟たちは十二人[じゅうににん]であった。"
  10: "第三[だいさん]はザクルで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  11: "第四[だいし]はエスドリで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  12: "第五[だいご]はネタンヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  13: "第六[だいろく]はブキヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  14: "第七[だいしち]はイセリエルで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  15: "第八[だいはち]はヨシヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  16: "第九[だいきゅう]はマタンヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  17: "第十[だいじゅう]はシメイで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  18: "第十一[だいじゅういち]はアザルヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  19: "第十二[だいじゅうに]はアシャブヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  20: "第十三[だいじゅうさん]はシュバエルで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  21: "第十四[だいじゅうよん]はマタテヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  22: "第十五[だいじゅうご]はエリモトで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  23: "第十六[だいじゅうろく]はハナニヤで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  24: "第十七[だいじゅうしち]はヨシュベカシャで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  25: "第十八[だいじゅうはち]はハナニで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  26: "第十九[だいじゅうきゅう]はマロティで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  27: "第二十[だいにじゅう]はエリアタで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  28: "第二十一[だいにじゅういち]はエティルで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  29: "第二十二[だいにじゅうに]はゴドラティで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  30: "第二十三[だいにじゅうさん]はマアジオトで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"
  31: "第二十四[だいにじゅうよん]はロマムティ・エゼルで、その子[こ]らと兄弟[きょうだい]たちは十二人[じゅうににん]であった。"

notes:
  1: "ἔστησεν … εἰς τὰ ἔργα — поставил на дела (службу); οἱ ἄρχοντες τῆς δυνάμεως — начальники войска; ἀποφθεγγόμενοι — изрекающие, пророчествующие (слав. «провещаваху»); κινύρα — 竪琴, νάβλα — 琴, κύμβαλον — シンバル (по корпусу); κατὰ κεφαλήν — по главам, поголовно."
  2: "Ζακχουρ, Ιωσηφ, Ναθανιας, Εραηλ — Закхур, Иосиф, Нафания, Ераил (слав. «асиил»); ἐχόμενοι Ασαφ τοῦ προφήτου — держащиеся Асафа пророка (под его руководством; Асаф назван пророком); ἐχόμενοι τοῦ βασιλέως — при царе (слав. «близ царя»)."
  3: "ἕξ — шестеро; μετὰ τὸν πατέρα αὐτῶν Ιδιθων — при отце их Идифуне (под его руководством; слав. «по отце своем идифуме»); ἐν κινύρᾳ ἀνακρουόμενοι — играя на кинире; ἐξομολόγησιν καὶ αἴνεσιν τῷ κυρίῳ — исповедание и хвалу Господу (слав. «исповедание и хваление Господеви»)."
  4: "14 имён; в LXX при десятом стоит помета «— ωδ», слав. соединяет «ромамфиезер» (Ромамти-Езер, ロマムティ・エゼル); всего 14 сыновей, ср. ст. 5. Формы: Βουκιας — Буккия, Μανθανιας — Матфания, Αζαραηλ — Азариил, Σουβαηλ — Шуваил, Ιεριμωθ — Иеримоф, Ανανιας — Анания, Ανανι — Анани, Ηλιαθα — Елиафа, Γοδολλαθι — Гиддалти, Ιεσβακασα — Иошбекаша, Μαλληθι — Маллофи, Ωθηρι — Гофир, Μεαζωθ — Махазиоф."
  5: "ἀνακρουομένῳ τῷ βασιλεῖ — играющему царю (слав. «бряцающаго царю»); ἐν λόγοις θεοῦ — в словах Божиих; ὑψῶσαι κέρας — возвысить рог (символ силы; слав. «да вознесется рог»); δέκα τέσσαρας υἱούς — 14 сыновей, τρεῖς θυγατέρας — 3 дочери; ср. 25:4 (14 имён)."
  6: "ὑμνῳδοῦντες — поющие (ὑμνῳδέω); слав. прибавляет «в служение дому Божия» (εἰς λειτουργίαν οἴκου θεοῦ) — в LXX этих слов нет, чтение внесено в текст; ἐχόμενα τοῦ βασιλέως — при царе (под его началом); καὶ Ασαφ καὶ Ιδιθων καὶ Αιμαν — отцы-руководители."
  7: "μετὰ τοὺς ἀδελφοὺς αὐτῶν — с братьями их; δεδιδαγμένοι ᾄδειν κυρίῳ — обученные петь Господу; πᾶς συνίων — всякий разумеющий (слав. «всех разумеющих (пения)»); διακόσιοι ὀγδοήκοντα ὀκτώ — 288."
  8: "ἐφημερίαι — чреды (слав. «чреды дневныя»; 務めの組); κατὰ τὸν μικρὸν καὶ κατὰ τὸν μέγαν — малый наравне с большим; τελείων καὶ μανθανόντων — совершенных и учащихся (опытных и учеников)."
  9: "LXX: «Асафу, Иосифу, Годолии» — тёмное место; слав. «асафу иосифову, годолиа»; вторым назван Ηνια (слав. «иниа»), у Синодального с евр. вторым стоит Гедалия (ゴドリヤ). Оставлено по LXX; ср. список имён в 25:2–4."
  10: "τρίτος — третий; Ζακχουρ — Закхур (слав. «закхур»); формула «сыны его и братья его, двенадцать» повторяется в 10–31."
  11: "Ιεσδρι — Иезрий (слав. «иезрий»; у Синодального Ицрий)."
  12: "Ναθανιας — Нафания (слав. «нафан»); ср. 25:2."
  13: "Βουκιας — Буккия (слав. «вукиа»); ср. 25:4."
  14: "Ισεριηλ — Иесариил (слав. «иериил»; у Синодального Иесарела); ср. 25:4."
  15: "Ιωσια — Иосия (слав. «иосиа»; у Синодального Исаия)."
  16: "Μανθανιας — Матфания (слав. «матфаниа»)."
  17: "Σεμει — Семей (слав. «семеиа»); ср. 25:3."
  18: "Αζαρια — Азария (слав. «езриил»; у Синодального Азариил)."
  19: "Ασαβια — Хашавия (слав. «асавиа»); ср. 25:3."
  20: "Σουβαηλ — Шуваил (слав. «суваил»); ср. 25:4."
  21: "Ματταθιας — Маттафия (слав. «матфафиа»); ср. 25:3."
  22: "Ιεριμωθ — Иеримоф (слав. «иеримуф»); ср. 25:4."
  23: "Ανανιας — Анания (слав. «ананиа»); ср. 25:4."
  24: "Ιεσβακασα — Иошбекаша (слав. «иесвак»); ср. 25:4."
  25: "Ανανι — Анани (слав. «ананиа»); ср. 25:4."
  26: "Μελληθι — Маллофи (слав. «меллифий»); ср. 25:4."
  27: "Ελιαθα — Елиафа (слав. «елиафа»); ср. 25:4."
  28: "Ηθιρ — Гофир (слав. «иефир»; у Синодального Гофир); ср. 25:4."
  29: "Γοδολλαθι — Гиддалти (слав. «годоллафий»); ср. 25:4."
  30: "Μεαζωθ — Махазиоф (слав. «меазоф»); ср. 25:4."
  31: "Ρωμεμθι — ωδ — Ромамти-Езер (слав. «рометфиезер»); в LXX имя разорвано пометой; ср. 25:4. Итог: 24 чреды по 12 человек."
