# jp-box, Деяния святых апостолов, глава 28. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; расхождения — в 〔…〕 и notes.
# jp-ni не использовался.
#
# Глава 28: Мелит и ехидна (1–10), путь в Рим (11–16), проповедь в Риме
# (17–31) и цитата Исаии (26–27).
# Красного нет: речи Павла (17–20, 25–28), иудеев (21–22), варваров (4, 6) —
# вне тегов. 28:16 — 〔…〕 о передаче узников: этой фразы нет в критическом
# тексте. 28:29 в критическом тексте отсутствует (`.`), поэтому целиком в 〔…〕.
# 聖霊 дано калькой {聖霊[せいれい]|聖神[せいしん]}, чтобы работал переключатель.

