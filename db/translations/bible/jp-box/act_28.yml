verses:
  1: "わたしたちは皆[みな]無事[ぶじ]に助[たす]かり、そのとき、この島[しま]がメリタと呼[よ]ばれていることを知[し]った。"
  2: "島[しま]の住民[じゅうみん]たちは、わたしたちに並[なみ]ならぬ親切[しんせつ]をしてくれた。雨[あめ]が降[ふ]り、寒[さむ]かったので、彼[かれ]らはたき火[び]を起[おこ]して、わたしたち一同[いちどう]を迎[むか]え入[い]れた。"
  3: "パウロが柴[しば]を一[ひと]束[たば]集[あつ]めて火[ひ]にくべると、熱[ねつ]のため毒蛇[どくじゃ]が這[は]い出[で]てきて、彼[かれ]の手[て]にからみついた。"
  4: "島[しま]の住民[じゅうみん]たちは、毒蛇[どくじゃ]がパウロの手[て]に垂[た]れ下[さ]がっているのを見[み]て、互[たが]いに言[い]った。「この人[ひと]はきっと人殺[ひとごろ]しだ。海[うみ]から助[たす]かったが、正義[せいぎ]の女神[めがみ]がこの者[もの]を生[い]かしておかなかったのだ。」"
  5: "しかし、パウロは毒蛇[どくじゃ]を火[ひ]の中[なか]に振[ふ]り払[はら]い、何[なん]の害[がい]も受[う]けなかった。"
  6: "人々[ひとびと]は、彼[かれ]が腫[は]れ上[あ]がるか、あるいは突然[とつぜん]倒[たお]れて死[し]ぬだろうと待[ま]っていた。しかし、長[なが]いこと待[ま]っても、彼[かれ]に何[なん]の異変[いへん]も起[お]こらないのを見[み]て、考[かんが]えを変[か]え、彼[かれ]は神[かみ]だと言[い]い始[はじ]めた。"
  7: "その場所[ばしょ]の近[ちか]くに、島[しま]の首長[しゅちょう]ポプリオの土地[とち]があった。彼[かれ]はわたしたちを迎[むか]え入[い]れ、三[みっ]日[か]の間[あいだ]、手厚[てあつ]くもてなしてくれた。"
  8: "ポプリオの父[ちち]が、熱病[ねつびょう]と下痢[げり]に苦[くる]しんで寝[ね]ていた。パウロはその人[ひと]のところへ行[い]き、祈[いの]ってから手[て]を置[お]いて、彼[かれ]を癒[いや]した。"
  9: "このことがあってから、島[しま]にいたほかの病人[びょうにん]たちも来[き]て、癒[いや]された。"
  10: "彼[かれ]らは多[おお]くの敬意[けいい]を表[あらわ]してわたしたちを敬[うやま]い、船出[ふなで]するときには、必要[ひつよう]な物[もの]を積[つ]んでくれた。"
  11: "三[みっ]か月[げつ]の後[のち]、わたしたちは、この島[しま]で冬[ふゆ]を越[こ]した、船首[せんしゅ]にディオスクロイ⟨ギリシア神話[しんわ]の双子[ふたご]の神[かみ]で、航海[こうかい]の守[まも]り神[がみ]とされた。⟩の像[ぞう]があるアレクサンドリアの船[ふね]に乗[の]って出航[しゅっこう]した。"
  12: "シラクサに寄[よ]って、三[みっ]日[か]そこに滞在[たいざい]した。"
  13: "そこから船出[ふなで]してレギオンに着[つ]き、一日[いちにち]たつと南風[みなみかぜ]が吹[ふ]いたので、二日[ふつか]目[め]にプテオリへ着[つ]いた。"
  14: "そこに兄弟[きょうだい]たちがいたので、わたしたちは七[なな]日[か]彼[かれ]らのところに滞在[たいざい]するよう勧[すす]められ、それからローマへ向[む]かった。"
  15: "ローマの兄弟[きょうだい]たちは、わたしたちのことを聞[き]いて、アッピア街道[がいどう]と三軒宿[さんけんやど]まで迎[むか]えに来[き]た。パウロは彼[かれ]らを見[み]、神[かみ]に感謝[かんしゃ]して元気[げんき]づいた。"
  16: "ローマに着[つ]くと、〔百人隊長[ひゃくにんたいちょう]は囚人[しゅうじん]たちを近衛隊長[このえたいちょう]に引[ひ]き渡[わた]した。〕パウロは、自分[じぶん]を守[まも]る兵士[へいし]一人[ひとり]とともに、別[べつ]に住[す]むことを許[ゆる]された。"
  17: "三[みっ]日[か]の後[のち]、パウロはユダヤ人[じん]の有力者[ゆうりょくしゃ]たちを呼[よ]び集[あつ]めた。彼[かれ]らが集[あつ]まると、パウロは言[い]った。「兄弟[きょうだい]の皆[みな]さん、わたしは民[たみ]にも先祖[せんぞ]の慣習[かんしゅう]にも何[なに]一[ひと]つ背[そむ]くことをせずに、エルサレムから囚人[しゅうじん]としてローマ人[じん]の手[て]に引[ひ]き渡[わた]された。"
  18: "彼[かれ]らはわたしを取[と]り調[しら]べて、死[し]に値[あたい]する罪[つみ]が何[なに]もないので、わたしを釈放[しゃくほう]しようとした。"
  19: "しかし、ユダヤ人[じん]たちが反対[はんたい]したので、わたしはやむを得[え]ずカエサルに上訴[じょうそ]した。決[けっ]して、自分[じぶん]の民[たみ]を訴[うった]えようとしたのではない。"
  20: "こういうわけで、わたしはあなたがたに会[あ]って話[はな]したいと願[ねが]い、呼[よ]び寄[よ]せてもらったのである。イスラエルの希望[きぼう]のため、わたしはこの鎖[くさり]につながれているのだ。」"
  21: "彼[かれ]らはパウロに言[い]った。「わたしたちは、あなたについてユダヤから手紙[てがみ]を受[う]け取[と]ってもいないし、兄弟[きょうだい]たちのうち、だれかが来[き]てあなたのことを告[つ]げたり、悪[わる]いことを話[はな]したりした者[もの]もいない。"
  22: "ただ、あなたの考[かんが]えを聞[き]かせてほしい。この宗派[しゅうは]については、どこでも反対[はんたい]があると聞[き]いているからだ。」"
  23: "彼[かれ]らはパウロと日[ひ]を定[さだ]め、さらに多[おお]くの者[もの]が宿[やど]に来[き]た。パウロは朝[あさ]から夕[ゆう]べまで、神[かみ]の国[くに]について証[あかし]し、モーセの律法[りっぽう]と預言者[よげんしゃ]たちの言葉[ことば]から、イエスのことを説[と]き明[あ]かして納得[なっとく]させようとした。"
  24: "ある者[もの]たちは語[かた]られることを信[しん]じたが、ほかの者[もの]たちは信[しん]じなかった。"
  25: "彼[かれ]らは互[たが]いに一致[いっち]せず、そのまま帰[かえ]ろうとしていた。そのとき、パウロが一言[ひとこと]言[い]った。「{聖霊[せいれい]|聖神[せいしん]}は、預言者[よげんしゃ]イザヤを通[とお]して、あなたがたの先祖[せんぞ]に、正[ただ]しくこう言[い]われた。"
  26: "『この民[たみ]のところへ行[い]って言[い]え。あなたがたは聞[き]くには聞[き]くが、決[けっ]して理解[りかい]せず、見[み]るには見[み]るが、決[けっ]して見[み]ない。"
  27: "この民[たみ]の心[こころ]は鈍[にぶ]くなり、耳[みみ]は遠[とお]くなり、目[め]は閉[と]ざされてしまった。こうして、彼[かれ]らが目[め]で見[み]、耳[みみ]で聞[き]、心[こころ]で理解[りかい]し、立[た]ち帰[かえ]って、わたしが彼[かれ]らを癒[いや]すことのないように。』"
  28: "だから、あなたがたは知[し]っておくがよい。この神[かみ]の救[すく]いは異邦人[いほうじん]に送[おく]られた。彼[かれ]らこそ、それを聞[き]くのである。」"
  29: "〔パウロがこう言[い]うと、ユダヤ人[じん]たちは多[おお]くの議論[ぎろん]を交[かわ]しながら帰[かえ]って行[い]った。〕"
  30: "パウロは、丸[まる]二[に]年[ねん]の間[あいだ]、自分[じぶん]の借家[しゃくや]に住[す]み、自分[じぶん]のところへ来[く]る者[もの]をすべて迎[むか]え入[い]れた。"
  31: "そして、何事[なにごと]も妨[さまた]げられることなく、すべての大胆[だいたん]さをもって、神[かみ]の国[くに]を宣[の]べ伝[つた]え、主[しゅ]イエス・キリストのことを教[おし]え続[つづ]けた。"

notes:
  1: "Μελίτη — Мелит (ныне Мальта); メリタ. «мы узнали» — διασωθέντες τότε; 無事に助かってから."
  2: "βάρβαροι — «варвары», т.е. местные жители, не говорившие ни по-гречески, ни по-латыни; передал 島の住民."
  4: "δίκη — Дике, богиня правосудия, карающая убийц; 正義の女神. У jp-joc — 義."
  7: "πρῶτος τῆς νήσου — «первый человек острова», местный начальник; 島の首長. Ποπλίῳ — ポプリオ (у jp-joc プブリイ)."
  8: "πυρετοῖς καὶ δυσεντερίῳ — «горячкой и дизентерией»; 熱病と下痢."
  11: "Διόσκοροι — Диоскуры, близнецы Кастор и Полидевк, покровители мореплавателей; ディオスクロイ. παράσημον — носовая фигура корабля; 船首の像."
  13: "Ῥήγιον — レギオン. δευτεραῖοι — «на второй день»; 二日目に."
  15: "Ἀππίου Φόρου — «Аппиев торг»; アッピア街道. Τριῶν Ταβερνῶν — «Три таверны»; 三軒宿."
  16: "В критическом тексте нет ὁ ἑκατόνταρχος παρέδωκεν τοὺς δεσμίους τῷ στρατοπεδάρχῳ; церковный текст (Елизаветинская, jp-joc) читает эту фразу — 〔…〕."
  23: "βασιλεία τοῦ θεοῦ — 神の国. διαμαρτυρόμενος — «свидетельствуя, убеждая»; 証し."
  25: "τὸ πνεῦμα τὸ ἅγιον — {聖霊[せいれい]|聖神[せいしん]}, как в Лк 1:15."
  26: "Цитата Ис 6:9–10; вводится как слово Святого Духа через Исаию, поэтому не красная. Внутри речи Павла — 『…』."
  27: "ἐπαχύνθη — «огрубело»; 頑になった. μήποτε … ἰάσομαι — «как бы не… и Я не исцелил их»; 癒やされることのないように."
  29: "В критическом тексте на месте стиха стоит `.`: стиха нет, поэтому целиком в 〔…〕 (есть в Елизаветинской и jp-joc)."
  30: "μίσθωμα — «наёмное жильё»; 借家. διετίαν ὅλην — «целых два года»; 丸二年."
