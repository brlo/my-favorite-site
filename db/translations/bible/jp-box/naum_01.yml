# jp-box, Наум, глава 1. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной. В gr-lxx-byz граница глав 1/2 иная:
# gr 1 — 14 стихов, gr 2:1–14 = слав. 1:15–2:13 (слав. 1 — 15 стихов, слав. 2 — 13).
# Карта: наш 1:1–14 = gr 1:1–14; наш 1:15 = gr 2:1; наш 2:1–13 = gr 2:2–2:14;
# наш 3:1–19 = gr 3:1–19. Всего в книге 47 стихов (15 + 13 + 19), как в csl и gr;
# стих не дублируется: gr 2:1 (ноги благовестника) стоит у нас один раз, в 1:15.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1:1 надписание; 1:2–6 Господь ревнитель, долготерпелив и велик силой,
# гнев Его плавит начала; 1:7–8 благ в день скорби, потоп на восстающих; 1:9–11
# замыслы против Господа, из Ниневии выйдет злой помысл; 1:12–13 «сокрушу жезл его»;
# 1:14 суд над Ассуром, гроб вместо семени; 1:15 (= gr 2:1) ноги благовестника,
# «празднуй, Иуда».
# Голоса: 1:2–11 — речь пророка (описание Господа и суда); 1:12–13 — слово Господа
# в 「…」 (формула «так говорит Господь» вне кавычек); 1:14 — формула «Господь
# заповедует о тебе» вне кавычек, слово Господа в 「…」; 1:15 — речь пророка.
# 1:3: слав. «очищаяй не очистит» (= ἀθῳῶν οὐκ ἀθῳώσει) — «не оставит без наказания»,
# в ru это передано свободно; держим греч./слав.
# 1:4: Βασανῖτις — «Васан» (слав. «васанитида»), カルメル, レバノン.
# 1:10: в ru добавлено «упившиеся как пьяницы» — этого нет ни в LXX, ни в слав.,
# в текст не внесено (МТ).
# 1:14: ταχεῖς — «быстрые» (слав. «яко скори (есте)»); в ru «в презрении» — по МТ קַל.
# 1:15: цит. Рим 10:15; «Иуда» здесь — Иудея (слав. «иудо»).
#
tr_code: jp-box
book: naum
chapter: 1
draft: true

verses:
  1: "ニネベについての託宣[たくせん]、エルコシの子[こ]ナホムが見[み]た幻[まぼろし]の書[しょ]。"
  2: "主[しゅ]は妬[ねた]み深[ぶか]い神[かみ]、復讐[ふくしゅう]する主[しゅ]である。主[しゅ]は怒[いか]りをもって復讐[ふくしゅう]し、主[しゅ]はご自分[じぶん]に逆[さから]う者[もの]に復讐[ふくしゅう]し、ご自分[じぶん]の敵[てき]を取[と]り除[のぞ]かれる。"
  3: "主[しゅ]は怒[おこ]りを遅[おそ]くし、力[ちから]は大[おお]きい。主[しゅ]は罰[ばつ]を免[まぬか]れさせることをなさらない。その道[みち]は滅[ほろ]びと震撼[しんかん]のうちにあり、雲[くも]はその足[あし]の塵[ちり]である。"
  4: "主[しゅ]は海[うみ]を叱[しか]ってこれを乾[かわ]かせ、すべての川[かわ]を干[ひ]上がらせる。バシャンとカルメルは衰[おとろ]え、レバノンの花[はな]はしぼむ。"
  5: "山[やま]々[やま]は主[しゅ]の前[まえ]に震[ふる]え、丘[おか]は揺[ゆ]れ動[うご]く。地[ち]は主[しゅ]の前[まえ]に恐[おそ]れおののき、世界[せかい]とそこに住[す]むすべてのものも恐[おそ]れおののく。"
  6: "その怒[いか]りの前[まえ]にだれが立[た]ち得[え]ようか。その激[はげ]しい怒[いか]りのうちにだれが耐[た]え得[え]ようか。その怒[いか]りは支配[しはい]者[しゃ]たちを溶[と]かし、岩[いわ]は主[しゅ]の前[まえ]に砕[くだ]ける。"
  7: "主[しゅ]は苦[くる]しみの日[ひ]に主[しゅ]を耐[た]え忍[しの]ぶ者[もの]に恵[めぐ]み深[ぶか]く、主[しゅ]を畏[おそ]れる者[もの]をよく知[し]っておられる。"
  8: "主[しゅ]は洪水[こうずい]をもって、立[た]ち起[お]こる者[もの]に終[お]わりをもたらし、その敵[てき]は闇[やみ]が追[お]い払[はら]う。"
  9: "あなたがたは主[しゅ]に何[なに]を企[くわだ]てるのか。主[しゅ]は終[お]わりを成[な]し遂[と]げられる。苦[くる]しみのとき、同じことのために二度[にど]復讐[ふくしゅう]されることはない。"
  10: "彼らはその基[もとい]まで枯[か]れ果[は]て、絡[から]み合[あ]う草[くさ]のように食[く]い尽[つ]くされ、乾[かわ]き切[き]った葦[あし]のようになる。"
  11: "あなたから、主[しゅ]に逆[さから]って悪[わる]いことを企[くわだ]てる者[もの]が出[で]る。"
  12: "主[しゅ]はこう言[い]われる。「多[おお]くの水[みず]を支配[しはい]する者[もの]も、こうして裂[さ]かれ分[わ]けられ、あなたのうわさはもはや聞[き]かれなくなる。"
  13: "今[いま]、わたしは彼の杖[つえ]をあなたの上[うえ]から砕[くだ]き、あなたの縄[なわ]目[め]を断[た]ち切[き]る」。"
  14: "主[しゅ]はあなたについて命[めい]じられる。「あなたの名[な]からはもはや種[たね]は残[のこ]らない。あなたの神[かみ]の家[いえ]から、刻[きざ]んだ像[ぞう]と鋳[い]た像[ぞう]を取[と]り除[のぞ]こう。あなたの墓[はか]を設[もう]ける。あなたがたは速[すみ]やかだからである」。"
  15: "見[み]よ、山[やま]の上[うえ]に、平和[へいわ]を告[つ]げ知[ら]らせる者[もの]の足[あし]がある。ユダよ、あなたの祭[まつ]りを祝[いわ]い、あなたの誓[ちか]いを果[は]たせ。悪[わる]い者[もの]はもはやあなたを通[とお]り過[す]ぎない。彼は全[まった]く滅[ほろ]ぼされたからである。"

notes:
  1: "Λῆμμα Νινευη — «Пророчество о Ниневии» (λῆμμα — «бремя», 託宣; слав. «пророчество»); βιβλίον ὁράσεως Ναουμ τοῦ Ελκεσαίου — «книга видения Наума Елкесеянина» (слав. «сына елкесеева»; エルコシ, ナホム). Надписание вне кавычек."
  2: "Θεὸς ζηλωτὴς καὶ ἐκδικῶν κύριος — «Бог ревнив и мстящий Господь» (ζηλωτής — ревнитель, 妬み深い; ἐκδικέω — мстить, 復讐する); ἐκδικῶν κύριος μετὰ θυμοῦ — «мстящий Господь с яростью» (θυμός — ярость, 怒り); τοὺς ὑπεναντίους αὐτοῦ — «противников Его»; ἐξαίρων αὐτὸς τοὺς ἐχθροὺς αὐτοῦ — «истребляющий Сам врагов Своих» (ἐξαίρω — убирать, 取り除く)."
  3: "κύριος μακρόθυμος — «Господь долготерпелив» (μακρόθυμος — долготерпеливый, 怒りを遅くする); μεγάλη ἡ ἰσχὺς αὐτοῦ — «велика крепость Его»; ἀθῳῶν οὐκ ἀθῳώσει — «оправдывая, не оправдает», т.е. не оставит без наказания (слав. «очищаяй не очистит»); ἐν συντελείᾳ καὶ ἐν συσσεισμῷ ἡ ὁδὸς αὐτοῦ — «в совершении (конце) и в потрясении путь Его» (συσσεισμός — потрясение, 震撼); νεφέλαι κονιορτὸς ποδῶν αὐτοῦ — «облака — пыль ног Его» (κονιορτός — пыль, 塵)."
  4: "ἀπειλῶν θαλάσσῃ καὶ ξηραίνων αὐτήν — «запрещающий морю и иссушающий его»; πάντας τοὺς ποταμοὺς ἐξερημῶν — «все реки опустошающий»; ὠλιγώθη ἡ Βασανῖτις καὶ ὁ Κάρμηλος — «умалился Васан и Кармил» (слав. «васанитида»); τὰ ἐξανθοῦντα τοῦ Λιβάνου ἐξέλιπεν — «цветущее Ливана исчезло» (ἐξανθέω — расцветать, 花が咲く)."
  5: "τὰ ὄρη ἐσείσθησαν ἀπ᾿ αὐτοῦ — «горы потряслись от Него»; οἱ βουνοὶ ἐσαλεύθησαν — «холмы поколебались»; ἀνεστάλη ἡ γῆ — «ужаснулась (отступила) земля» (слав. «ужасеся земля»); ἡ σύμπασα καὶ πάντες οἱ κατοικοῦντες ἐν αὐτῇ — «вся вселенная и все живущие в ней»."
  6: "ἀπὸ προσώπου ὀργῆς αὐτοῦ τίς ὑποστήσεται — «от лица гнева Его кто устоит» (ὑφίστημι — выдерживать, 立ち得る); ὁ θυμὸς αὐτοῦ τήκει ἀρχάς — «ярость Его расплавляет начала (власти)» (τήκω — плавить, 溶かす); αἱ πέτραι διεθρύβησαν ἀπ᾿ αὐτοῦ — «камни сокрушились от Него»."
  7: "χρηστὸς κύριος τοῖς ὑπομένουσιν αὐτὸν ἐν ἡμέρᾳ θλίψεως — «благ Господь терпящим Его в день скорби» (ὑπομένω — терпеть, 耐え忍ぶ); γινώσκων τοὺς εὐλαβουμένους αὐτόν — «знающий благоговеющих пред Ним» (εὐλαβέομαι — благоговеть, 畏れる). В ru «убежище в день скорби» — по МТ, в LXX и слав. этого нет."
  8: "ἐν κατακλυσμῷ πορείας συντέλειαν ποιήσεται τοὺς ἐπεγειρομένους — «в потопе пути совершит истребление восстающим» (κατακλυσμός — потоп, 洪水; ἐπεγείρω — воздвигать, 立ち起こる); τοὺς ἐχθροὺς αὐτοῦ διώξεται σκότος — «врагов Его будет гнать тьма»: подлежащее — «тьма» (слав. «враги его поженет тма»)."
  9: "τί λογίζεσθε ἐπὶ τὸν κύριον — «что вы замышляете против Господа» (λογίζομαι — замышлять, 企てる); συντέλειαν αὐτὸς ποιήσεται — «истребление Сам совершит»; οὐκ ἐκδικήσει δὶς ἐπὶ τὸ αὐτό ἐν θλίψει — «не отмстит дважды за одно и то же в скорби»."
  10: "ἕως θεμελίου αὐτῶν χερσωθήσεται — «до основания своего иссохнет (станет бесплодной)» (χερσόω — делать сухим, 枯れ果てる; θεμέλιος — 基); ὡς σμῖλαξ περιπλεκομένη βρωθήσεται — «как плющ обвивающийся будет съеден» (σμῖλαξ — плющ/вьюнок; 絡み合う草); ὡς καλάμη ξηρασίας μεστή — «как тростник, полный сухости». В ru добавлено «упившиеся как пьяницы» — нет в LXX/слав. (МТ), в текст не внесено."
  11: "ἐκ σοῦ ἐξελεύσεται λογισμὸς κατὰ τοῦ κυρίου — «из тебя выйдет помысл против Господа»; πονηρὰ λογιζόμενος ἐναντία — «замышляющий злое противное» (ἐναντία — напротив, 逆らって)."
  12: "τάδε λέγει κύριος — «так говорит Господь»; κατάρχων ὑδάτων πολλῶν — «начальствующий над многими водами» (об Ассуре; κατάρχω — начальствовать); καὶ οὕτως διασταλήσονται — «и так разделятся» (διαστέλλω — разделять, 裂かれ分けられる); ἡ ἀκοή σου οὐκ ἐνακουσθήσεται ἔτι — «слух твой не будет более слышен» (ἐνακούω — слышать). В ru «хотя они безопасны и многочисленны…» — по МТ, не внесено."
  13: "συντρίψω τὴν ῥάβδον αὐτοῦ ἀπὸ σοῦ — «сокрушу жезл его с тебя» (ῥάβδος — жезл, 杖); τοὺς δεσμούς σου διαρρήξω — «узы твои разорву» (δεσμός — узы, 縄目). Здесь слово Господа закрывается."
  14: "ἐντελεῖται ὑπὲρ σοῦ κύριος — «заповедует о тебе Господь» (ἐντέλλομαι — заповедовать, 命じる); οὐ σπαρήσεται ἐκ τοῦ ὀνόματός σου ἔτι — «не будет сеяться от имени твоего более», т.е. не останется потомства; ἐξολεθρεύσω τὰ γλυπτὰ καὶ χωνευτά — «истреблю изваянное и литое» (γλυπτόν — изваяние, 刻んだ像; χωνευτόν — литое, 鋳た像); θήσομαι ταφήν σου, ὅτι ταχεῖς — «положу гроб твой, ибо (вы) быстры»: тёмное место, слав. «яко скори (есте)»; в ru «в презрении» — по МТ קַל («лёгкий, презренный»)."
  15: "Это gr 2:1 (слав. 1:15). ἰδοὺ ἐπὶ τὰ ὄρη οἱ πόδες εὐαγγελιζομένου — «вот, на горах ноги благовествующего» (цит. Рим 10:15); ἀπαγγέλλοντος εἰρήνην — «возвещающего мир»; ἑόρταζε, Ιουδα, τὰς ἑορτάς σου — «празднуй, Иуда, праздники твои» (Иуда = Иудея); ἀπόδος τὰς εὐχάς σου — «воздай обеты твои»; οὐ μὴ προσθήσωσιν ἔτι τοῦ διελθεῖν διὰ σοῦ εἰς παλαίωσιν — «не будут более проходить через тебя в обветшание» (παλαίωσις — обветшание, 老い朽ちること); συντετέλεσται, ἐξῆρται — «совершилось, извергнут (он)»."
