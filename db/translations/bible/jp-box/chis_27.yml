verses:
  1: "サルパアデの娘[むすめ]たちが近[ちか]づいた。サルパアデはオフェルの子[こ]、ギレアデの子、マキルの子で、マナセの氏族[しぞく]に属[ぞく]し、ヨセフの子らの一人[ひとり]であった。娘たちの名[な]は、マフラ、ノア、ホグラ、ミルカ、ティルツァ。"
  2: "彼女[かのじょ]たちは、モーセの前[まえ]、祭司[さいし]エレアザルの前、指導者[しどうしゃ]たちの前、会衆[かいしゅう]すべての前、証[あかし]の幕屋[まくや]の戸口[とぐち]に立[た]って言[い]った。"
  3: "「わたしたちの父[ちち]は荒野[こうや]で死[し]にました。彼[かれ]は、主[しゅ]に逆[さから]って集[あつ]まったコラの集まりの中[なか]にいた者[もの]ではありません。彼は自分[じぶん]の罪[つみ]のために死んだのであり、息子[むすこ]はいませんでした。"
  4: "わたしたちの父[ちち]の名[な]が、その氏族[しぞく]の中[なか]から消[き]え去[さ]らないようにしてください。彼[かれ]には息子[むすこ]がいないからです。父の兄弟[きょうだい]たちの間[あいだ]で、わたしたちに所有[しょゆう]の地[ち]を与[あた]えてください。」"
  5: "モーセは彼[かれ]らの訴[うった]えを主[しゅ]の前[まえ]に持[も]って行[い]った。"
  6: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  7: "「サルパアデの娘[むすめ]たちは正[ただ]しく語[かた]った。彼女[かのじょ]たちに、父[ちち]の兄弟[きょうだい]たちの間[あいだ]で嗣業[しぎょう]としての所有[しょゆう]を与[あた]え、父のくじを彼女たちに移[うつ]しなさい。"
  8: "イスラエルの子[こ]らには、こう言[い]いなさい。人[ひと]が死[し]んで、息子[むすこ]がなければ、その嗣業[しぎょう]をその娘[むすめ]に移しなさい。"
  9: "もし娘[むすめ]がなければ、その嗣業[しぎょう]をその兄弟[きょうだい]たちに与[あた]えなさい。"
  10: "もし兄弟[きょうだい]たちがいなければ、その嗣業[しぎょう]を父[ちち]の兄弟たちに与えなさい。"
  11: "もし父[ちち]の兄弟[きょうだい]たちがいなければ、その嗣業[しぎょう]を、その部族[ぶぞく]のうちで彼[かれ]に最も近[ちか]しい親族[しんぞく]に与えなさい。その者[もの]が彼のものを受[う]け継[つ]ぐ。これがイスラエルの子[こ]らへの裁[さば]きの定[さだ]めとなるであろう。主[しゅ]がモーセに命[めい]じられたとおりである。」"
  12: "主[しゅ]はモーセに言[い]われた。「向[む]こう側[がわ]の山[やま]、すなわちネボの山に上[のぼ]り、わたしがイスラエルの子[こ]らに所有[しょゆう]として与[あた]えるカナンの地[ち]を眺[なが]めなさい。"
  13: "あなたはそれを見[み]たら、あなたもまた、あなたの兄弟[きょうだい]アロンがホルの山[やま]で加[くわ]わったように、あなたの民[たみ]に加わるであろう。"
  14: "あなたがたが、シナの荒野[こうや]でわたしの言葉[ことば]に背[そむ]き、会衆[かいしゅう]が逆[さから]ったとき、彼[かれ]らの前[まえ]でわたしを聖[せい]なる者[もの]として示[しめ]さなかったからである。それは、シナの荒野[こうや]のカデスにある、メリバの水[みず]のことである。」"
  15: "モーセは主[しゅ]に言[い]った。"
  16: "「すべての肉[にく]の霊[れい]の神[かみ]である主[しゅ]が、この会衆[かいしゅう]の上[うえ]に一人[ひとり]の人[ひと]を立[た]ててくださいますように。"
  17: "その人[ひと]が彼[かれ]らの前[まえ]を出[で]て行[い]き、彼らの前に入[はい]り、彼らを導[みちび]き出[だ]し、彼らを導き入[い]れるように。そうすれば、主の会衆[かいしゅう]は、羊飼[ひつじかい]のいない羊[ひつじ]のようにはならないであろう。」"
  18: "主[しゅ]はモーセに語[かた]って言[い]われた。「あなたのところに、ヌンの子[こ]ヨシュア、すなわち霊[れい]をその内[うち]に持[も]つ人[ひと]を連[つ]れて来[き]て、彼[かれ]の上[うえ]にあなたの手[て]を置[お]きなさい。"
  19: "そして、祭司[さいし]エレアザルの前[まえ]、会衆[かいしゅう]すべての前[まえ]に彼[かれ]を立[た]たせ、彼らが見[み]ている前で彼に命[めい]じ、また彼について彼らの前で命じなさい。"
  20: "あなたの栄光[えいこう]の一部[いちぶ]を彼[かれ]の上[うえ]に与[あた]えなさい。そうすれば、イスラエルの子[こ]らは彼に聞[き]き従[したが]うであろう。"
  21: "彼[かれ]は祭司[さいし]エレアザルの前[まえ]に立[た]つ。彼[かれ]らは、主[しゅ]の前[まえ]でウリムによって彼に裁[さば]きを問[と]い求[もと]めるであろう。彼の言葉[ことば]によって、彼も、イスラエルの子[こ]らも、心[こころ]を一[ひと]つにした会衆[かいしゅう]すべての者[もの]も、出[で]て行[い]き、入[はい]る。」"
  22: "モーセは、主[しゅ]が命[めい]じられたとおりに行[おこな]った。彼[かれ]はヨシュアを連[つ]れて来[き]て、祭司[さいし]エレアザルの前[まえ]と会衆[かいしゅう]すべての前[まえ]に立[た]たせ、"
  23: "彼[かれ]の上[うえ]に手[て]を置[お]き、主[しゅ]がモーセに命[めい]じられたとおりに、彼[かれ]を任[にん]命[めい]した。"

notes:
  1: "προσελθοῦσαι — приступив (προσέρχομαι). υἱοῦ Οφερ υἱοῦ Γαλααδ υἱοῦ Μαχιρ — сына Офера, сына Галаада, сына Махира (родительный при имени). τοῦ δήμου Μανασση τῶν υἱῶν Ιωσηφ — из рода Манассии, из сынов Иосифа. В LXX имена дочерей даны в квадратных скобках: Μαλα, Νουα, Εγλα, Μελχα, Θερσα."
  2: "στᾶσαι ἔναντι — став пред (ἵστημι, aor. part.). ἐπὶ τῆς θύρας τῆς σκηνῆς τοῦ μαρτυρίου — у двери скинии свидетельства (証の幕屋). λέγουσιν — «говорят» (praesens historicum), речь — с 3-го стиха."
  3: "Ὁ πατὴρ ἡμῶν ἀπέθανεν ἐν τῇ ἐρήμῳ — отец наш умер в пустыне. οὐκ ἦν ἐν μέσῳ τῆς συναγωγῆς τῆς ἐπισυστάσης ἔναντι κυρίου — не был в среде собрания, восставшего пред Господом. ἐν τῇ συναγωγῇ Κορε — в собрании Корея. διὰ ἁμαρτίαν αὐτοῦ — из-за своего греха (διά + винительный). υἱοὶ οὐκ ἐγένοντο αὐτῷ — сыновей у него не было."
  4: "μὴ ἐξαλειφθήτω — «да не изгладится» (запретительное 3-е лицо аориста, ἐξαλείφω); в японском передано просьбой. ἐκ μέσου τοῦ δήμου αὐτοῦ — из среды рода его. δότε ἡμῖν κατάσχεσιν — дайте нам владение (κατάσχεσις, 所有). ἐν μέσῳ ἀδελφῶν πατρὸς ἡμῶν — среди братьев отца нашего."
  5: "προσήγαγεν τὴν κρίσιν αὐτῶν ἔναντι κυρίου — «представил суд (дело) их пред Господом» (κρίσις, 訴え)."
  6: "Формула ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; речь — с 7-го стиха."
  7: "Ὀρθῶς … λελαλήκασιν — «правильно сказали» (perfect от λαλέω). δόμα δώσεις αὐταῖς κατάσχεσιν κληρονομίας — «дар дай им — владение наследства» (δόμα, κληρονομία). περιθήσεις τὸν κλῆρον τοῦ πατρὸς αὐτῶν αὐταῖς — «возложишь на них жребий отца их» (περιτίθημι, 移す)."
  8: "Ἄνθρωπος ἐὰν ἀποθάνῃ καὶ υἱὸς μὴ ᾖ αὐτῷ — если человек умрёт и не будет у него сына. περιθήσετε τὴν κληρονομίαν αὐτοῦ τῇ θυγατρὶ αὐτοῦ — передадите удел его дочери его (тот же глагол περιτίθημι)."
  9: "ἐὰν δὲ μὴ ᾖ θυγάτηρ αὐτῷ — если же не будет у него дочери. δώσετε τῷ ἀδελφῷ αὐτοῦ — дадите брату его."
  10: "ἐὰν δὲ μὴ ὦσιν αὐτῷ ἀδελφοί — если же не будет у него братьев. τῷ ἀδελφῷ τοῦ πατρὸς αὐτοῦ — брату отца его."
  11: "ἐὰν δὲ μὴ ὦσιν ἀδελφοὶ τοῦ πατρὸς αὐτοῦ — если же не будет братьев отца его. τῷ οἰκείῳ τῷ ἔγγιστα αὐτοῦ ἐκ τῆς φυλῆς αὐτοῦ — ближайшему родственнику из племени его (οἰκεῖος, ἔγγιστα). κληρονομήσει τὰ αὐτοῦ — наследует его. δικαίωμα κρίσεως — постановление суда (δικαίωμα). καθὰ συνέταξεν κύριος — как заповедал Господь."
  12: "Ἀνάβηθι εἰς τὸ ὄρος τὸ ἐν τῷ πέραν — взойди на гору, что за Иорданом. В квадратных скобках LXX: τοῦτο ὄρος Ναβαυ — «это гора Навав» (ネボ); в масоретском тексте и ru — Аварим. ἰδὲ τὴν γῆν Χανααν — посмотри на землю Ханаан. ἐν κατασχέσει — во владение."
  13: "ὄψει αὐτὴν — увидишь её. προστεθήσῃ πρὸς τὸν λαόν σου — «приложишься к народу твоему», т. е. умрёшь (προστίθημι, ср. 20:24). καθὰ προσετέθη Ααρων ὁ ἀδελφός σου ἐν Ωρ τῷ ὄρει — как приложился Аарон, брат твой, на горе Ор."
  14: "διότι παρέβητε τὸ ῥῆμά μου — ибо преступили слово Моё (παραβαίνω). ἐν τῷ ἀντιπίπτειν τὴν συναγωγὴν — когда общество противилось (ἀντιπίπτω). ἁγιᾶσαι με — освятить Меня (ἁγιάζω). οὐχ ἡγιάσατέ με ἐπὶ τῷ ὕδατι — не освятили Меня у воды. В скобках LXX: τοῦτό ἐστιν ὕδωρ ἀντιλογίας Καδης ἐν τῇ ἐρήμῳ Σιν — «это вода пререкания Кадеса в пустыне Син» (メリバ, ср. 20:13)."
  15: "καὶ εἶπεν Μωϋσῆς πρὸς κύριον — и сказал Моисей Господу; в LXX без λέγων, молитва — с 16-го стиха."
  16: "Ἐπισκεψάσθω κύριος — «да призрит (поставит) Господь» (ἐπισκέπτομαι, 3-е лицо повелительного). ὁ θεὸς τῶν πνευμάτων καὶ πάσης σαρκός — Бог духов и всякой плоти. ἄνθρωπον ἐπὶ τῆς συναγωγῆς ταύτης — человека над этим обществом."
  17: "ὅστις ἐξελεύσεται πρὸ προσώπου αὐτῶν — кто будет выходить пред лицом их. ἐξάξει … εἰσάξει — выведет … введёт. οὐκ ἔσται ἡ συναγωγὴ κυρίου ὡσεὶ πρόβατα, οἷς οὐκ ἔστιν ποιμήν — не будет общество Господне как овцы, у которых нет пастуха (ποιμήν, 羊飼い)."
  18: "Λαβὲ πρὸς σεαυτὸν τὸν Ἰησοῦν υἱὸν Ναυη — возьми к себе Иисуса, сына Навина. ἄνθρωπον, ὃς ἔχει πνεῦμα ἐν ἑαυτῷ — человека, который имеет дух в себе (πνεῦμα без артикля). ἐπιθήσεις τὰς χεῖράς σου ἐπ᾿ αὐτὸν — возложишь руки твои на него."
  19: "στήσεις αὐτὸν ἔναντι Ελεαζαρ — поставишь его пред Елеазаром. ἐντελῇ αὐτῷ ἔναντι πάσης συναγωγῆς — дай ему наставление (ἐντέλλομαι) пред всем обществом. ἐντελῇ περὶ αὐτοῦ ἐναντίον αὐτῶν — дай наставление о нём пред ними, т. е. объяви народу о его служении."
  20: "δώσεις τῆς δόξης σου ἐπ᾿ αὐτὸν — «дай от славы твоей на него» (частичный генитив). ὅπως ἂν εἰσακούσωσιν αὐτοῦ — чтобы послушали его (εἰσακούω + род.)."
  21: "καὶ ἔναντι Ελεαζαρ … στήσεται — и пред Елеазаром станет. ἐπερωτήσουσιν αὐτὸν τὴν κρίσιν τῶν δήλων — «спросят его о суде явлений» (ἐπερωτάω); δῆλοι — техническое обозначение урима, отсюда ウリム. ἐπὶ τῷ στόματι αὐτοῦ ἐξελεύσονται … εἰσελεύσονται — по слову его выйдут и войдут (στόμα, «уста» = слово). ὁμοθυμαδόν — единодушно."
  22: "ἐποίησεν Μωϋσῆς καθὰ ἐνετείλατο αὐτῷ κύριος — сделал Моисей, как заповедал ему Господь. λαβὼν τὸν Ἰησοῦν ἔστησεν αὐτὸν ἐναντίον Ελεαζαρ — взяв Иисуса, поставил его пред Елеазаром."
  23: "ἐπέθηκεν τὰς χεῖρας αὐτοῦ ἐπ᾿ αὐτὸν — возложил руки свои на него. συνέστησεν αὐτὸν — «поставил его», т. е. утвердил, поручил (συνίστημι, 任命). καθάπερ συνέταξεν κύριος τῷ Μωυσῇ — как заповедал Господь Моисею."
