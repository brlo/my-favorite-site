verses:
  1: "ベルは倒[たお]れ、ダゴンは砕[くだ]かれた。彼[かれ]らの刻[きざ]んだ像[ぞう]は獣[けもの]と家畜[かちく]の荷[に]となった。それを縛[しば]ったまま、疲[つか]れた者[もの]の重荷[おもに]のように運[はこ]べ。"
  2: "飢[う]えた者[もの]、力[ちから]尽[つ]きた者[もの]、ともに力のない者[もの]のためである。彼[かれ]らは戦[いくさ]から救[すく]われることができない。彼ら自身[じしん]が捕虜[ほりょ]として連[つ]れて行[い]かれた。"
  3: "「ヤコブの家[いえ]、イスラエルのもろもろの残[のこ]りよ、わたしの言[ことば]を聞[き]け。胎[たい]から抱[かか]えられ、幼[おさな]いときから教[おし]えられてきた者[もの]たちよ。"
  4: "わたしは老[お]いまで同じであり、あなたがたが年[とし]を取[と]るまで、わたしは同じである。わたしはあなたがたを耐[た]え忍[しの]ぶ。わたしが造[つく]ったのだから、わたしが運[はこ]ぶ。わたしは抱[かか]え上[あ]げて救[すく]う。"
  5: "あなたがたはわたしをだれに似[に]せるというのか。見[み]よ、よく見[み]て考[かんが]え出[だ]せ、迷[まよ]う者[もの]たちよ。"
  6: "袋[ふくろ]から金[きん]を出[だ]し、秤[はかり]で銀[ぎん]を量[はか]る。金細工師[きんざいくし]を雇[やと]って手作[てづく]りのものを造[つく]らせ、かがんでそれを拝[おが]む。"
  7: "それを肩[かた]に載[の]せて運[はこ]び、置[お]けばその場[ば]所[しょ]に立[た]ったまま、動[うご]くことはない。それに向[む]かって叫[さけ]んでも聞[き]くことはなく、災[わざわ]いから救[すく]うこともない。"
  8: "これを覚[おぼ]えて嘆[なげ]け。悔[く]い改[あらた]めよ、迷[まよ]う者[もの]たちよ。心[こころ]を帰[かえ]せ。"
  9: "昔[むかし]の初[はじ]めのことを覚[おぼ]えよ。わたしが神[かみ]であることを。わたしのほかに、まだ神[かみ]はいない。"
  10: "わたしは初[はじ]めから終[お]わりのことを、まだ起[お]こらぬうちに告[つ]げる。そして、それは直[ただ]ちに成[な]し遂[と]げられた。わたしは言[い]った。『わたしの計画[けいかく]はすべても立[た]ち、定[さだ]めたことはすべて成[な]る』と。"
  11: "わたしは東[ひがし]から鳥[とり]を、遠[とお]い国[くに]から、わたしが定[さだ]めたことを成[な]す者[もの]を呼[よ]ぶ。わたしは語[かた]り、彼[かれ]を連[つ]れて来[き]た。わたしは造[つく]り、成[な]し遂[と]げた。彼を連[つ]れて来て、その道[みち]を栄[さか]えさせた。"
  12: "心[こころ]を失[うしな]った者[もの]たち、義[ぎ]から遠[とお]い者たちよ、わたしの言[ことば]を聞[き]け。"
  13: "わたしはわたしの義[ぎ]を近[ちか]づけ、わたしからの救[すく]いを遅[おく]らせない。わたしはシオンでイスラエルに救[すく]いを、栄光[えいこう]として与[あた]える。」"

notes:
  1: "Ἔπεσε Βηλ, συνετρίβη Δαγων — «пал Бел, сокрушился Дагон»: LXX и слав. («дагон») читают здесь Дагона, в ru/МТ — «Нево» (ネボ); держим LXX и слав. Ирония в том, что идолы валятся сами. τὰ γλυπτὰ αὐτῶν — «изваяния их» (刻んだ像); ἐγένετο εἰς θηρία καὶ κτήνη — «стали [ношей] для зверей и скотов» (слав. «быша ваяния их во звери и скоты»), т. е. их навьючили на скот. αἴρετε αὐτὰ καταδεδεμένα ὡς φορτίον κοπιῶντι — «несите их связанными, как бремя усталому»: καταδέω — связывать (о вьюке). Слав. относит сюда же «и разслабевшу» (ἐκλελυμένῳ), которое по gr открывает 46:2."
  2: "καὶ πεινῶντι καὶ ἐκλελυμένῳ οὐκ ἰσχύοντι ἅμα — «и голодающему, и изнемогшему, не имеющему силы вместе»: продолжение дативного ряда из 46:1 (бремя для кого), слав. «и алчущу и не могущу вкупе». οἳ οὐ δυνήσονται σωθῆναι ἀπὸ πολέμου — «которые не смогут спастись от войны» (об идолах; слав. «не возмогут спастися от рати»). αὐτοὶ δὲ αἰχμάλωτοι ἤχθησαν — «они же сами уведены пленными» (ἄγω, aor. pass.; слав. «пленени приведошася»)."
  3: "Ἀκούσατέ μου, οἶκος τοῦ Ιακωβ — «послушайте Меня, дом Иакова»; πᾶν τὸ κατάλοιπον τοῦ Ισραηλ — «всё остаточное Израиля» (残りのすべて); οἱ αἰρόμενοι ἐκ κοιλίας — «носимые от чрева», т. е. которых Я ношу с рождения; παιδευόμενοι ἐκ παιδίου — «наставляемые с детства» (παιδεύω — воспитывать, наставлять; слав. «наказуемии от детска»). Слав. добавляет в конце «даже до старости» — по gr это начало 46:4 (ἕως γήρους). С 46:3 по 46:13 — слова Господа в 「…」."
  4: "ἕως γήρους ἐγώ εἰμι — «до старости Я есмь»; ἕως ἂν καταγηράσητε — «доколе не состаритесь»; ἐγὼ ἀνέχομαι ὑμῶν — «Я терплю вас» (ἀνέχομαι; слав. «аз терплю вам»); в ru/МТ «Я тот же буду… буду носить» — держим LXX. ἐγὼ ἐποίησα καὶ ἐγὼ ἀνήσω — «Я создал и Я понесу» (ἀνίημι — здесь «поднимать, нести»); ἀναλήμψομαι — «возьму на Себя, подниму»; σώσω ὑμᾶς — «спасу вас»."
  5: "τίνι με ὡμοιώσατε — «кому вы уподобили Меня»; ἴδετε τεχνάσασθε, οἱ πλανώμενοι — «смотрите, ухищряйтесь, заблуждающиеся» (τεχνάζομαι — замышлять, изобретать; слав. «видите, ухитрите»): ироничный вызов — придумайте, с кем Меня сравнить. В ru/МТ стих длиннее («и с кем сличите, чтобы мы были сходны») — по МТ, не внесено."
  6: "οἱ συμβαλλόμενοι χρυσίον ἐκ μαρσιππίου — «ссыпающие золото из мешочка» (μαρσίππιον — кошель, мешочек; συμβάλλομαι — ссыпать, скидываться); ἀργύριον ἐν ζυγῷ στήσουσιν ἐν σταθμῷ — «серебро на весах поставят на вес» (ζυγόν, σταθμός). μισθωσάμενοι χρυσοχόον — «наняв золотых дел мастера» (χρυσοχόος, 金細工師); ἐποίησαν χειροποίητα — «сделали рукотворённое» (χειροποίητα — 手作りのもの); κύψαντες προσκυνοῦσιν αὐτοῖς — «склонившись, поклоняются им»."
  7: "αἴρουσιν αὐτὸ ἐπὶ τῶν ὤμων — «поднимают его на плечи»; ἐὰν δὲ θῶσιν αὐτό, ἐπὶ τοῦ τόπου αὐτοῦ μένει — «а если положат его, на месте своём стоит»; οὐ μὴ κινηθῇ — «не сдвинется» (двойное отрицание). ὃς ἂν βοήσῃ πρὸς αὐτόν — «кто ни возопит к нему»; οὐ μὴ εἰσακούσῃ — «не услышит»; ἀπὸ κακῶν οὐ μὴ σώσῃ αὐτόν — «от бед не спасёт его». Ирония достигает предела: носимое не может спасти носящего."
  8: "μνήσθητε ταῦτα καὶ στενάξατε — «вспомните это и воздохните» (στενάζω — стенать; слав. «возстените»); μετανοήσατε, οἱ πεπλανημένοι — «покайтесь, заблудшие» (слав. «покайтеся, прельстившиися»); ἐπιστρέψατε τῇ καρδίᾳ — «обратитесь сердцем». В ru/МТ «покажите себя мужами» — по МТ, в LXX этого нет."
  9: "καὶ μνήσθητε τὰ πρότερα ἀπὸ τοῦ αἰῶνος — «и вспомните прежнее от века»; ὅτι ἐγώ εἰμι ὁ θεός — «что Я — Бог»; καὶ οὐκ ἔστιν ἔτι πλὴν ἐμοῦ — «и нет ещё кроме Меня» (слав. «несть еще разве мене»). В ru/МТ добавлено «и нет подобного Мне» — по МТ, не внесено."
  10: "ἀναγγέλλων πρότερον τὰ ἔσχατα πρὶν αὐτὰ γενέσθαι — «возвещающий прежде последнее, прежде чем оно сбылось»; καὶ ἅμα συνετελέσθη — «и вместе [тотчас] совершилось». καὶ εἶπα· Πᾶσά μου ἡ βουλὴ στήσεται — «и Я сказал: весь совет Мой состоится»: слова Господа внутри Его же речи, поэтому 『…』. ὅσα βεβούλευμαι — «что Я определил» (βουλεύομαι, perfect)."
  11: "καλῶν ἀπ᾿ ἀνατολῶν πετεινὸν — «призывающий с востока птицу» (πετεινόν — птица; в МТ/ru «орёл», в LXX и слав. «птица»); ἀπὸ γῆς πόρρωθεν — «из земли издалека»; περὶ ὧν βεβούλευμαι — «о которых Я определил». ἐλάλησα καὶ ἤγαγον — «сказал и привёл»; ἔκτισα καὶ ἐποίησα — «создал и сделал»; ἤγαγον αὐτὸν καὶ εὐόδωσα τὴν ὁδὸν αὐτοῦ — «привёл его и благоустроил путь его» (εὐοδόω — давать успех). В ru/МТ последние глаголы переданы иначе («предначертал, и сделаю») — держим LXX."
  12: "ἀκούσατέ μου, οἱ ἀπολωλεκότες τὴν καρδίαν — «послушайте Меня, погубившие сердце» (ἀπόλλυμι; слав. «погубльшии сердце»), т. е. потерявшие разум; οἱ μακρὰν ἀπὸ τῆς δικαιοσύνης — «далёкие от правды» (義)."
  13: "ἤγγισα τὴν δικαιοσύνην μου — «приблизил правду Мою»; τὴν σωτηρίαν τὴν παρ᾽ ἐμοῦ οὐ βραδυνῶ — «спасение, которое от Меня, не замедлю» (βραδύνω; слав. «не умедлю»). δέδωκα ἐν Σιων σωτηρίαν τῷ Ισραηλ εἰς δόξασμα — «дал в Сионе спасение Израилю в прославление» (δόξασμα — слава, хвала); в тексте 栄光. В ru/МТ «дам Сиону спасение, Израилю славу Мою» — по МТ. Стих закрывает речь 「…」."
