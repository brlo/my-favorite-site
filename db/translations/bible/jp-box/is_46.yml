# jp-box, Исаия, глава 46. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 46 отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 46: 1–2 падение Бела и Дагона — идолов носят как кладь (ирония);
# 3–4 Господь носит Свой народ от чрева до старости; 5–7 «кому уподобите Меня»
# и ремесло идолоделов; 8–11 «вспомните прежнее», «Я Бог, и нет иного»,
# призвание «птицы с востока»; 12–13 спасение Сиона близко.
# Речи: 1–2 — пророческое описание без кавычек; 3–13 — слова Господа от первого лица
# в 「…」 (внутри 46:10 — Его же слова о Своём определении, 『…』).
# Нумерация по gr: 13 стихов; у csl и ru тоже 13. Внутри главы слав. делит иначе:
# «и разслабевшу» (ἐκλελυμένῳ) слав. относит к 46:1, по gr это начало 46:2; в 46:3
# слав. добавляет «даже до старости» (по gr — начало 46:4). Номера стихов не сдвигаются.
# Паритет: 46:1 — LXX и слав. читают Δαγων / «дагон» (ダゴン), в ru/МТ «Нево»;
# 46:4 — LXX ἀνέχομαι ὑμῶν («терплю вас»), в ru/МТ «Я тот же… буду носить»;
# 46:8 — LXX «покайтесь», в ru/МТ «покажите себя мужами»; 46:11 — LXX πετεινόν
# («птица»), в МТ/ru «орёл». Держим LXX и слав.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 偶像, 刻んだ像, 鋳た像, 軛, 残り, 栄光, 秤, 炉, 青銅
# уже в корпусе; ベル и ダゴン — имена, пояснений не требуют.
# Имена — транслитерация греческого (LXX): ベル (Βηλ), ダゴン (Δαγων), ヤコブ,
# イスラエル, シオン.

