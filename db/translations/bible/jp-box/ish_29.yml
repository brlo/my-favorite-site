verses:
  1: "「あなたが彼[かれ]らを聖[せい]なる者[もの]とし、わたしに祭司[さいし]として仕[つか]えさせるために、彼[かれ]らに行[おこな]うことは次[つぎ]のとおりである。若[わか]い雄牛[おうし]一頭[いっとう]と、傷[きず]のない雄羊[おひつじ]二頭[にとう]を取[と]れ。"
  2: "あなたは油[あぶら]で練[ね]った種[たね]なしパンと、油[あぶら]を塗[ぬ]った種[たね]なしの薄焼[うすや]きパンを、小麦粉[こむぎこ]で造[つく]れ。"
  3: "あなたはそれらを一[ひと]つのかごに入[い]れ、かごとともに、若[わか]い雄牛[おうし]と二頭[にとう]の雄羊[おひつじ]を携[たずさ]えて来[こ]よ。"
  4: "あなたはアロンとその子[こ]らを証[あかし]の幕屋[まくや]の入口[いりぐち]に連[つ]れて来[き]て、水[みず]で彼[かれ]らを洗[あら]え。"
  5: "あなたは衣服[いふく]を取[と]り、アロンに足[あし]まで届[とど]く衣[ころも]、エフォド、胸当[むねあて]を着[き]せ、胸当[むねあて]をエフォドに結[むす]び合[あ]わせよ。"
  6: "あなたは冠[かんむり]を彼[かれ]の頭[あたま]に載[の]せ、冠[かんむり]の上[うえ]に聖[せい]なるものの金[きん]の板[いた]を載[の]せよ。"
  7: "あなたは聖[せい]なる油[あぶら]を取[と]り、彼[かれ]の頭[あたま]に注[そそ]いで、彼[かれ]に油[あぶら]を塗[ぬ]れ。"
  8: "あなたはその子[こ]らを連[つ]れて来[き]て、彼[かれ]らに衣[ころも]を着[き]せよ。"
  9: "あなたは彼[かれ]らに帯[おび]を締[し]め、頭[あたま]の被[かぶ]り物[もの]を載[の]せる。祭司[さいし]の務[つと]めは彼[かれ]らのものとなり、わたしに対して永遠[えいえん]に続[つづ]く。こうしてあなたはアロンとその子[こ]らの手[て]を満[み]たす。」"
  10: "「あなたは若[わか]い雄牛[おうし]を証[あかし]の幕屋[まくや]の入口[いりぐち]に連[つ]れて来[こ]よ。アロンとその子[こ]らは、証[あかし]の幕屋[まくや]の入口[いりぐち]で、主[しゅ]の前[まえ]に、その雄牛[おうし]の頭[あたま]に手[て]を置[お]く。"
  11: "あなたは証[あかし]の幕屋[まくや]の入口[いりぐち]で、主[しゅ]の前[まえ]にその雄牛[おうし]を屠[ほふ]れ。"
  12: "あなたはその雄牛[おうし]の血[ち]を取[と]り、指[ゆび]で祭壇[さいだん]の角[つの]に塗[ぬ]れ。残[のこ]りの血[ち]はすべて祭壇[さいだん]の台座[だいざ]のそばに注[そそ]げ。"
  13: "あなたは腹[はら]の内[うち]を覆[おお]う脂肪[しぼう]、肝臓[かんぞう]の上[うえ]の部分[ぶぶん]、二[ふた]つの腎臓[じんぞう]とその上[うえ]の脂肪[しぼう]を取[と]り、祭壇[さいだん]の上[うえ]で焼[や]け。"
  14: "あなたは若[わか]い雄牛[おうし]の肉[にく]と皮[かわ]と汚物[おぶつ]を、宿営[しゅくえい]の外[そと]で火[ひ]で焼[や]き払[はら]え。これは罪[つみ]のための捧[ささ]げ物[もの]である。」"
  15: "「あなたは一頭[いっとう]の雄羊[おひつじ]を取[と]れ。アロンとその子[こ]らは、その雄羊[おひつじ]の頭[あたま]に手[て]を置[お]く。"
  16: "あなたはその雄羊[おひつじ]を屠[ほふ]り、血[ち]を取[と]って祭壇[さいだん]の周[まわ]りに注[そそ]げ。"
  17: "あなたはその雄羊[おひつじ]を肢[えだ]ごとに切[き]り分[わ]け、内臓[ないぞう]と足[あし]を水[みず]で洗[あら]い、切[き]り分[わ]けた肢[えだ]と頭[あたま]の上[うえ]に置[お]け。"
  18: "あなたはその雄羊[おひつじ]をすべて祭壇[さいだん]の上[うえ]で焼[や]き、主[しゅ]への全[ぜん]焼[しょう]の捧[ささ]げ物[もの]とせよ。香[かお]りよい匂[にお]いの捧[ささ]げ物[もの]、主[しゅ]への捧[ささ]げ物[もの]である。」"
  19: "「あなたは二頭目[にとうめ]の雄羊[おひつじ]を取[と]れ。アロンとその子[こ]らは、その雄羊[おひつじ]の頭[あたま]に手[て]を置[お]く。"
  20: "あなたはその雄羊[おひつじ]を屠[ほふ]り、その血[ち]を取[と]って、アロンの右[みぎ]の耳[みみ]たぶと、右[みぎ]の手[て]の親指[おやゆび]と、右[みぎ]の足[あし]の親指[おやゆび]に塗[ぬ]れ。その子[こ]らにも同[おな]じように、右[みぎ]の耳[みみ]たぶ、右[みぎ]の手[て]の親指[おやゆび]、右[みぎ]の足[あし]の親指[おやゆび]に塗[ぬ]れ。"
  21: "あなたは祭壇[さいだん]の上[うえ]の血[ち]と聖[せい]なる油[あぶら]を取[と]り、アロンとその衣服[いふく]、その子[こ]らとその衣服[いふく]に振[ふ]りかける。そうして彼[かれ]もその衣服[いふく]も、その子[こ]らもその衣服[いふく]も聖[せい]なる者[もの]となる。雄羊[おひつじ]の血[ち]は祭壇[さいだん]の周[まわ]りに注[そそ]げ。"
  22: "あなたはその雄羊[おひつじ]から脂肪[しぼう]と、腹[はら]を覆[おお]う脂肪[しぼう]と、肝臓[かんぞう]の上[うえ]の部分[ぶぶん]と、二[ふた]つの腎臓[じんぞう]とその上[うえ]の脂肪[しぼう]と、右[みぎ]の腿[もも]を取[と]れ。これがその奉献[ほうけん]である。"
  23: "あなたは油[あぶら]を混[ま]ぜたパン一[ひと]つと、薄焼[うすや]きパン一[ひと]つを、主[しゅ]の前[まえ]に供[そな]えられた種[たね]なしパンのかごから取[と]れ。"
  24: "あなたはそのすべてをアロンとその子[こ]らの手[て]に置[お]き、主[しゅ]の前[まえ]に分[わ]け取[と]った捧[ささ]げ物[もの]としてささげよ。"
  25: "あなたはそれを彼[かれ]らの手[て]から取[と]り、祭壇[さいだん]の上[うえ]で、全[ぜん]焼[しょう]の捧[ささ]げ物[もの]とともに焼[や]いて、香[かお]りよい匂[にお]いの献[ささ]げ物[もの]として主[しゅ]にささげよ。"
  26: "あなたはアロンのための奉献[ほうけん]の雄羊[おひつじ]から胸[むね]を取[と]り、それを主[しゅ]の前[まえ]に分[わ]け取[と]った捧[ささ]げ物[もの]としてささげよ。それはあなたの受[う]け持[も]ちとなる。"
  27: "あなたは分[わ]け取[と]った捧[ささ]げ物[もの]の胸[むね]と、取[と]り分[わ]けの腿[もも]を聖[せい]なるものとせよ。奉献[ほうけん]の雄羊[おひつじ]から、アロンとその子[こ]らから分[わ]け取[と]られ、取[と]り分[わ]けられたものである。"
  28: "それはアロンとその子[こ]らのものとなり、イスラエルの子[こ]らから受[う]ける永遠[えいえん]の定[さだ]めとなる。これが取[と]り分[わ]けであるからである。イスラエルの子[こ]らの救[すく]いの捧[ささ]げ物[もの]から、主[しゅ]への取[と]り分[わ]けとして取[と]られる。」"
  29: "「聖[せい]なる衣服[いふく]、すなわちアロンのものは、彼[かれ]の後[のち]の子[こ]らのものとなる。彼[かれ]らはそれを着[き]て油[あぶら]を注[そそ]がれ、手[て]を満[み]たされる。"
  30: "彼[かれ]の子[こ]らのうち、彼[かれ]に代[か]わって祭司[さいし]となり、聖所[せいしょ]で仕[つと]めるために証[あかし]の幕屋[まくや]に入[はい]る者[もの]は、七[なな]日[にち]の間[あいだ]、それを着[き]る。"
  31: "あなたは奉献[ほうけん]の雄羊[おひつじ]を取[と]り、その肉[にく]を聖[せい]なる場所[ばしょ]で煮[に]よ。"
  32: "アロンとその子[こ]らは、証[あかし]の幕屋[まくや]の入口[いりぐち]で、その雄羊[おひつじ]の肉[にく]と、かごの中[なか]のパンを食[た]べる。"
  33: "彼[かれ]らは、自分[じぶん]たちが聖[せい]なる者[もの]とされ、手[て]を満[み]たされ、聖[せい]なる者[もの]とされるために用[もち]いたもの、すなわちそれらを食[た]べる。他[ほか]の民[たみ]の者[もの]はそれを食[た]べてはならない。それらは聖[せい]なるものだからである。"
  34: "もし奉献[ほうけん]の捧[ささ]げ物[もの]の肉[にく]とパンが朝[あさ]まで残[のこ]るなら、残[のこ]りを火[ひ]で焼[や]き払[はら]え。それらは食[た]べてはならない。聖[せい]なるものであるからである。"
  35: "あなたはわたしが命[めい]じたすべてのとおりに、アロンとその子[こ]らに行[おこな]え。七[なな]日[にち]の間[あいだ]、彼[かれ]らの手[て]を満[み]たす。"
  36: "あなたは罪[つみ]のための若[わか]い雄牛[おうし]を、清[きよ]めの日[ひ]にささげよ。祭壇[さいだん]の上[うえ]で聖[せい]なる者[もの]とするとき、祭壇[さいだん]を清[きよ]め、それを油[あぶら]で塗[ぬ]って聖[せい]なる者[もの]とせよ。"
  37: "七[なな]日[にち]の間[あいだ]、祭壇[さいだん]を清[きよ]め、それを聖[せい]なる者[もの]とせよ。祭壇[さいだん]は聖[せい]なるもののうちの聖[せい]なるものとなる。祭壇[さいだん]に触[ふ]れる者[もの]はすべて聖[せい]なる者[もの]となる。」"
  38: "「祭壇[さいだん]の上[うえ]に行[おこな]うことは次[つぎ]のとおりである。一歳[いっさい]の傷[きず]のない小羊[こひつじ]二匹[にひき]を、毎日[まいにち]、絶[た]え間[ま]なく祭壇[さいだん]の上[うえ]に供[そな]える。これが絶[た]え間[ま]ない献[ささ]げ物[もの]である。"
  39: "一匹[いっぴき]の小羊[こひつじ]は朝[あさ]に、もう一匹[いっぴき]は夕[ゆう]べに供[そな]える。"
  40: "上等[じょうとう]の小麦粉[こむぎこ]十分[じゅうぶん]の一[いち]を、搾[しぼ]った油[あぶら]四分[しぶん]の一[いち]ヒン⟨液[えき]を量[はか]る単位[たんい]。約[やく]四[よん]リットル。⟩で練[ね]り、ぶどう酒[ぶどうしゅ]四分[しぶん]の一[いち]ヒンを注[そそ]ぎ物[もの]として、一匹[いっぴき]の小羊[こひつじ]に添[そ]えよ。"
  41: "もう一匹[いっぴき]の小羊[こひつじ]は夕[ゆう]べに供[そな]えよ。朝[あさ]の捧[ささ]げ物[もの]と同[おな]じように、その注[そそ]ぎ物[もの]も添[そ]えて、香[かお]りよい匂[にお]いの献[ささ]げ物[もの]として主[しゅ]にささげよ。"
  42: "これはあなたがたの代[よ]々[よ]にわたる、証[あかし]の幕屋[まくや]の入口[いりぐち]での、主[しゅ]の前[まえ]の絶[たえ]間[ま]ない捧[ささ]げ物[もの]である。わたしはそこであなたに現[あらわ]れ、あなたと語[かた]る。」"
  43: "「わたしはそこでイスラエルの子[こ]らに定[さだ]めを与[あた]え、わたしはわたしの栄光[えいこう]によって聖[せい]なる者[もの]とされる。"
  44: "わたしは証[あかし]の幕屋[まくや]と祭壇[さいだん]を聖[せい]なる者[もの]とし、アロンとその子[こ]らを聖[せい]なる者[もの]として、わたしに祭司[さいし]として仕[つか]えさせる。"
  45: "わたしはイスラエルの子[こ]らの間[あいだ]で呼[よ]ばれ、彼[かれ]らの神[かみ]となる。"
  46: "彼[かれ]らは、わたしが主[しゅ]、彼[かれ]らの神[かみ]、エジプトの地[ち]から彼[かれ]らを導[みちび]き出[だ]し、彼[かれ]らの上[うえ]に呼[よ]ばれて彼[かれ]らの神[かみ]となる者[もの]であることを知[し]る。」"

notes:
  1: "ἁγιάσαι αὐτούς — освятить их; λήμψῃ μοσχάριον ἐκ βοῶν ἓν καὶ κριοὺς δύο ἀμώμους — один телёнок из крупного скота и два овна без порока."
  2: "ἄρτοι ἄζυμοι πεφυραμένοι ἐν ἐλαίῳ — пресные хлебы, замешанные на масле (練った種なしパン); λάγανα ἄζυμα κεχρισμένα ἐν ἐλαίῳ — пресные лепёшки, помазанные маслом (薄焼きパン); σεμίδαλις — пшеничная мука тонкого помола."
  3: "κανόν — корзина (かご); προσοίσεις — принесёшь."
  4: "προσάξεις ἐπὶ τὰς θύρας τῆς σκηνῆς τοῦ μαρτυρίου — приведёшь к дверям скинии свидетельства; λούσεις — омоешь."
  5: "У LXX: χιτὼν ποδήρης, ἐπωμίς, λογεῖον — длинный хитон, ефод, наперсник; συνάψεις τὸ λογεῖον πρὸς τὴν ἐπωμίδα — соединишь наперсник с ефодом (у Синодального «опояшь его по ефоду»)."
  6: "μίτρα — головной убор (冠, ср. κίδαρις в 28:4); τὸ πέταλον τὸ Ἁγίασμα — дощечка «Святыня» (聖なるものの金の板)."
  7: "τοῦ ἐλαίου τοῦ χρίσματος — елей помазания (聖なる油); ἐπιχεεῖς — возольёшь; χρίσεις — помажешь."
  8: "Повеление о сыновьях: облечь их в хитоны."
  9: "ζώσεις — опояшешь; κιδάρεις — кидары; ἱερατεία … εἰς τὸν αἰῶνα — священство навек; τελειώσεις τὰς χεῖρας — совершишь руки (то же, что «наполнишь руки»)."
  10: "ἐπιθήσουσιν τὰς χεῖρας ἐπὶ τὴν κεφαλὴν τοῦ μόσχου — возложат руки на голову тельца (знак перенесения греха)."
  11: "σφάξεις — заколешь; παρὰ τὰς θύρας — у дверей скинии."
  12: "θήσεις ἐπὶ τῶν κεράτων τῷ δακτύλῳ σου — возложишь на роги перстом; τὸ λοιπὸν πᾶν αἷμα ἐκχεεῖς παρὰ τὴν βάσιν — остальную кровь выльешь у подножия."
  13: "τὸ στέαρ τὸ ἐπὶ τῆς κοιλίας — тук на утробе; ὁ λοβὸς τοῦ ἥπατος — доля печени (肝臓の上の部分); νεφροί — почки."
  14: "τὰ κρέα … τὸ δέρμα … τὴν κόπρον — мясо, кожу и нечистоты; ἔξω τῆς παρεμβολῆς — вне стана; ἁμαρτίας γάρ ἐστιν — это жертва за грех (罪のための捧げ物)."
  15: "κριὸς εἷς — один овен; возложение рук."
  16: "προσχεεῖς πρὸς τὸ θυσιαστήριον κύκλῳ — возольёшь к жертвеннику кругом."
  17: "διχοτομήσεις κατὰ μέλη — рассечёшь на части; πλυνεῖς τὰ ἐνδόσθια καὶ τοὺς πόδας — омоешь внутренности и ноги."
  18: "ὁλοκαύτωμα — всесожжение (全焼の捧げ物); εἰς ὀσμὴν εὐωδίας — в запах благоухания (香りよい匂い); θυσίασμα — жертва (捧げ物)."
  19: "Второй овен — «овен посвящения» (κριὸς τῆς τελειώσεως)."
  20: "λοβὸς τοῦ ὠτός — мочка уха (耳たぶ); ἄκρον τῆς χειρός — «конец руки», т.е. большой палец (親指); ἄκρον τοῦ ποδός — большой палец ноги."
  21: "ἀπὸ τοῦ αἵματος τοῦ ἀπὸ τοῦ θυσιαστηρίου καὶ ἀπὸ τοῦ ἐλαίου τῆς χρίσεως — кровь с жертвенника и елей помазания; ῥανεῖς — окропишь; ἁγιασθήσεται — освятится."
  22: "στέαρ, λοβός, νεφροί, βραχίων ὁ δεξιός — тук, доля печени, почки, правое плечо (右の腿); τελείωσις — посвящение (奉献)."
  23: "ἄρτος ἐξ ἐλαίου — хлеб на масле; λάγανον — лепёшка; κανὸν τῶν ἀζύμων τῶν προτεθειμένων ἔναντι κυρίου — корзина опресноков, предложенных пред Господом."
  24: "ἐπιθήσεις … ἐπὶ τὰς χεῖρας — возложишь на руки; ἀφοριεῖς ἀφόρισμα — отделишь как отделяемое (分け取った捧げ物)."
  25: "λήμψῃ αὐτὰ ἐκ τῶν χειρῶν — возьмёшь с рук их; κάρπωμα — приношение (献げ物)."
  26: "στηθύνιον — грудь (胸); ἔσται σοι ἐν μερίδι — будет тебе в часть (受け持ち)."
  27: "ἀφόρισμα καὶ ἀφαίρεμα — отделяемое и отнятое (分け取った捧げ物 / 取り分け); ὃς ἀφώρισται καὶ ὃς ἀφῄρηται — что отделено и что отнято."
  28: "νόμιμον αἰώνιον — устав вечный; θύματα σωτηρίων — спасительные (мирные) жертвы (救いの捧げ物); ἀφαίρεμα κυρίῳ — отнятое Господу."
  29: "ἡ στολὴ τοῦ ἁγίου — священная одежда; χρισθῆναι … καὶ τελειῶσαι τὰς χεῖρας — чтобы помазать их и совершить руки."
  30: "ὁ ἱερεὺς ὁ ἀντ᾽ αὐτοῦ τῶν υἱῶν αὐτοῦ — священник из сынов его, заступающий его место; ἑπτὰ ἡμέρας — семь дней."
  31: "κριὸς τῆς τελειώσεως — овен посвящения; ἑψήσεις — сваришь (испечёшь)."
  32: "ἔδονται … παρὰ τὰς θύρας — будут есть у дверей скинии свидетельства."
  33: "ἐν οἷς ἡγιάσθησαν — чем они освящены; ἀλλογενὴς οὐκ ἔδεται — посторонний (他国の者) не будет есть; ἅγιά ἐστιν — это святыни."
  34: "κατακαύσεις τὰ λοιπὰ πυρί — сожжёшь остатки огнём; οὐ βρωθήσεται, ἁγίασμα γάρ ἐστιν — не будет съедено, ибо это освящение."
  35: "κατὰ πάντα, ὅσα ἐνετειλάμην σοι — по всему, что Я заповедал тебе; ἑπτὰ ἡμέρας τελειώσεις αὐτῶν τὰς χεῖρας — семь дней будешь совершать руки их."
  36: "τὸ μοσχάριον τῆς ἁμαρτίας — телец за грех; τῇ ἡμέρᾳ τοῦ καθαρισμοῦ — в день очищения; ἐν τῷ ἁγιάζειν σε ἐπ᾽ αὐτῷ — когда будешь освящать на нём."
  37: "ἅγιον τοῦ ἁγίου — «святое святых» (о жертвеннике, не о месте: 聖なるもののうちの聖なるもの); πᾶς ὁ ἁπτόμενος … ἁγιασθήσεται — всякий прикасающийся освятится."
  38: "ἀμνοὺς ἐνιαυσίους ἀμώμους δύο — двух однолетних агнцев без порока; ἐνδελεχῶς — постоянно; κάρπωμα ἐνδελεχισμοῦ — приношение постоянное (絶え間ない献げ物)."
  39: "τὸ πρωΐ … τὸ δειλινόν — утром и вечером (в девятый час)."
  40: "δέκατον σεμιδάλεως — десятая часть (ефы) пшеничной муки; τετάρτῳ τοῦ ιν — четверть гина (ヒン); σπονδή — возлияние (注ぎ物)."
  41: "κατὰ τὴν θυσίαν τὴν πρωινήν — как утренняя жертва; εἰς ὀσμὴν εὐωδίας κάρπωμα κυρίῳ — в благоухание, приношение Господу."
  42: "θυσία ἐνδελεχισμοῦ — жертва постоянная; ἐν οἷς γνωσθήσομαί σοι ἐκεῖθεν ὥστε λαλῆσαί σοι — «в которых Я буду познан тобою оттуда, чтобы говорить с тобою» (現れる, 語る)."
  43: "τάξομαι ἐκεῖ — «поставлю там» (слав. «завещаю»); ἁγιασθήσομαι ἐν δόξῃ μου — буду освящён в славе Моей."
  44: "ἁγιάσω — освящу скинию и жертвенник и поставлю священниками Аарона и сыновей."
  45: "ἐπικληθήσομαι ἐν τοῖς υἱοῖς Ισραηλ — «нарекусь в сынах Израилевых», буду призван среди них (у LXX не «обитать», как в Синодальном); ἔσομαι αὐτῶν θεός — буду им Богом."
  46: "ἐξαγαγών — выведший; ἐπικληθῆναι αὐτοῖς καὶ θεὸς εἶναι αὐτῶν — чтобы быть призванным над ними и быть им Богом; у LXX нет заключительного «Я Господь, Бог их» (это добавка масоретского текста)."
