# jp-box, Послание к Римлянам, глава 16. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 16: приветствия (1–16), предостережение о разделяющих (17–20),
# приветствия от сотрудников (21–23), заключительное славословие (25–27).
# 16:24 в базе стоит «.» (стиха нет) — целиком в 〔…〕; 16:25–27 в базе есть.
# Сноска одна: 16:16 (святое целование). Красного и синего нет. jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 16
draft: true

verses:
  1: "あなたがたに、わたしたちの姉妹[しまい]フィベを推薦[すいせん]する。彼女[かのじょ]はケンクレアイの教会[きょうかい]の奉仕者[ほうししゃ]である。"
  2: "どうか、聖徒[せいと]にふさわしく、主[しゅ]にあって彼女[かのじょ]を受け入[い]れ、彼女[かのじょ]があなたがたの助[たす]けを必要[ひつよう]とするときは、どんなことでも助[たす]けてほしい。彼女[かのじょ]自身[じしん]も、多[おお]くの人[ひと]の、またわたし自身[じしん]の助[たす]け手[て]となったからである。"
  3: "キリスト・イエスにあってわたしの同労者[どうろうしゃ]であるプリスキラとアクラによろしく伝[つた]えなさい。"
  4: "彼[かれ]らは、わたしの命[いのち]のために自分[じぶん]の首[くび]を差[さ]し出[だ]した。彼[かれ]らに感謝[かんしゃ]しているのは、わたしだけでなく、異邦人[いほうじん]のすべての教会[きょうかい]である。"
  5: "また、彼[かれ]らの家[いえ]にある教会[きょうかい]にも、よろしく伝[つた]えなさい。わたしの愛[あい]するエパイネトによろしく伝[つた]えなさい。彼[かれ]は、アジアの初穂[はつほ]としてキリストにささげられた者[もの]である。"
  6: "マリアによろしく伝[つた]えなさい。彼女[かのじょ]はあなたがたのために多[おお]く労苦[ろうく]した。"
  7: "わたしの親族[しんぞく]で、ともに捕[とら]われの身[み]となったアンドロニコとユニアによろしく伝[つた]えなさい。彼[かれ]らは使徒[しと]たちの間[あいだ]で名[な]の知[し]られた者[もの]であり、わたしより先[さき]にキリストにある者[もの]となった。"
  8: "主[しゅ]にあってわたしの愛[あい]するアンブリアによろしく伝[つた]えなさい。"
  9: "キリストにあってわたしたちの同労者[どうろうしゃ]であるウルバノと、わたしの愛[あい]するスタキスによろしく伝[つた]えなさい。"
  10: "キリストにあって認[みと]められた者[もの]であるアペレによろしく伝[つた]えなさい。アリストブロに属[ぞく]する人々[ひとびと]によろしく伝[つた]えなさい。"
  11: "わたしの親族[しんぞく]ヘロディオンによろしく伝[つた]えなさい。ナルキソに属[ぞく]し、主[しゅ]にある人々[ひとびと]によろしく伝[つた]えなさい。"
  12: "主[しゅ]のために労苦[ろうく]しているトリュファイナとトリュフォサによろしく伝[つた]えなさい。わたしの愛[あい]するペルシスによろしく伝[つた]えなさい。彼女[かのじょ]は主[しゅ]のために多[おお]く労苦[ろうく]した。"
  13: "主[しゅ]にあって選[えら]ばれたルフォと、彼[かれ]の母[はは]、すなわちわたしの母[はは]でもある人[ひと]によろしく伝[つた]えなさい。"
  14: "アシンクリト、フレゴン、ヘルメス、パトロバ、ヘルマ、また彼[かれ]らとともにいる兄弟[きょうだい]たちによろしく伝[つた]えなさい。"
  15: "フィロロゴとユリア、ニレウとその姉妹[しまい]、またオリンパ、そして彼[かれ]らとともにいるすべての聖徒[せいと]たちによろしく伝[つた]えなさい。"
  16: "聖[せい]なる接吻[せっぷん]⟨互[たが]いの挨拶[あいさつ]として交[かわ]す口[くち]づけ。⟩をもって互[たが]いに挨拶[あいさつ]しなさい。キリストのすべての教会[きょうかい]が、あなたがたによろしくと言[い]っている。"
  17: "兄弟[きょうだい]たちよ、わたしはあなたがたに勧[すす]める。あなたがたが学[まな]んだ教[おし]えに反[はん]して、分裂[ぶんれつ]とつまずきを生[しょう]じさせる者[もの]たちに目[め]を注[そそ]ぎ、彼[かれ]らから離[はな]れなさい。"
  18: "というのは、そのような者[もの]たちは、わたしたちの主[しゅ]キリストに仕[つか]えず、むしろ自分[じぶん]の腹[はら]に仕[つか]えているからである。また、巧[たく]みな言葉[ことば]と褒[ほ]め言葉[ことば]で、純朴[じゅんぼく]な人々[ひとびと]の心[こころ]を欺[あざむ]いている。"
  19: "というのは、あなたがたの従順[じゅうじゅん]はすべての人[ひと]に知[し]れ渡[わた]っているからである。だから、わたしはあなたがたのことを喜[よろこ]んでいる。しかし、あなたがたが善[ぜん]に対して賢[かしこ]く、悪[あく]に対して無垢[むく]であることを願[ねが]っている。"
  20: "平和[へいわ]の神[かみ]が、間[ま]もなくサタンをあなたがたの足[あし]の下[した]に砕[くだ]いてくださる。わたしたちの主[しゅ]イエスの{恵[めぐ]み|恩寵[おんちょう]}が、あなたがたとともにありますように。"
  21: "わたしの同労者[どうろうしゃ]ティモテ、またわたしの親族[しんぞく]であるルキオ、イアソン、ソシパテルが、あなたがたによろしくと言[い]っている。"
  22: "この手紙[てがみ]を書[か]いたわたしテルティオが、主[しゅ]にあってあなたがたによろしくと言[い]う。"
  23: "わたしの、また全[ぜん]教会[きょうかい]の客[きゃく]となっているガイオが、あなたがたによろしくと言[い]う。この町[まち]の財務官[ざいむかん]エラストと、兄弟[きょうだい]クァルトが、あなたがたによろしくと言[い]う。"
  24: "〔わたしたちの主[しゅ]イエス・キリストの恵[めぐ]みが、あなたがたすべてとともにありますように。アーメン。〕"
  25: "わたしの福音[ふくいん]とイエス・キリストの宣[せん]教[きょう]に従[したが]い、永遠[えいえん]の昔[むかし]から隠[かく]されてきた奥義[おうぎ]の啓示[けいじ]に従[したが]って、あなたがたを強[つよ]く立[た]たせることができる方[かた]に、"
  26: "今[いま]明[あき]らかにされたその奥義[おうぎ]は、預言者[よげんしゃ]たちの書[しょ]によって、永遠[えいえん]の神[かみ]の命[めい]に従[したが]って、すべての異邦人[いほうじん]に知[し]らされ、彼[かれ]らを信仰[しんこう]の従順[じゅうじゅん]に導[みちび]くのであるが、"
  27: "ただひとりの賢[けん]い神[かみ]に、イエス・キリストによって、栄光[えいこう]がとこしえにありますように。アーメン。"

notes:
  1: "Συνίστημι — «представляю, рекомендую»; 推薦する. διάκονος — «служительница»; 奉仕者 (не «диаконисса»). Кенхреи — ケンクレアイ (порт Коринфа)."
  2: "ἀξίως τῶν ἁγίων — «достойно святых»; 聖徒にふさわしく. προστάτις — «покровительница, помощница»; 助け手."
  3: "Πρίσκα — プリスキラ (греч. форма Πρίσκα, но имя выровнено по корпусу с Деян 18: プリスキラ). Ἀκύλας — アクラ."
  4: "τράχηλον ὑπέθηκαν — «подложили свою шею»; 首を差し出した. ἐκκλησίαι τῶν ἐθνῶν — «церкви язычников»; 異邦人のすべての教会."
  5: "ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν — «начаток Асии для Христа»; アジアの初穂としてキリストにささげられた者. У jp-joc здесь ошибочно アハイヤ (Ахаия); в базе Ἀσίας — アジア."
  6: "εἰς ὑμᾶς — «для вас»; в византийском тексте и у jp-joc εἰς ἡμᾶς («для нас»); переведено по базе."
  7: "συγγενεῖς — родственники, 親族; συναιχμαλώτους — «соузники»; ともにとらわれの身となった. ἐπίσημοι ἐν τοῖς ἀποστόλοις — «прославленные между апостолами»; 使徒たちの間で名の知られた者. Ἰουνιᾶν — ユニア."
  8: "Ἀμπλιᾶτον — アンブリア."
  9: "Οὐρβανόν — ウルバノ; Στάχυν — スタキス."
  10: "Ἀπελλῆν — アペレ; δόκιμον — «испытанного, одобренного»; 認められた者. τοὺς ἐκ τῶν Ἀριστοβούλου — «из дома Аристобула»; アリストブロに属する人々."
  11: "Ἡρῳδίωνα — ヘロディオン; Ναρκίσσου — ナルキソ."
  12: "Τρύφαιναν — トリュファイナ; Τρυφῶσαν — トリュフォサ; Περσίδα — ペルシス. κοπιώσας — «трудившихся»; 労苦している."
  13: "Ῥοῦφον — ルフォ; ἐκλεκτόν — «избранного»; 選ばれた."
  14: "Ἀσύγκριτον — アシンクリト; Φλέγοντα — フレゴン; Ἑρμῆν — ヘルメス; Πατροβᾶν — パトロバ; Ἑρμᾶν — ヘルマ."
  15: "Φιλόλογον — フィロロゴ; Ἰουλίαν — ユリア; Νηρέα — ニレウ; Ὀλυμπᾶν — オリンパ."
  16: "ἐν φιλήματι ἁγίῳ — «с целованием святым»; 聖なる接吻. Сноска объясняет обычай, неочевидный нехристианину."
  17: "σκοπεῖν — «наблюдать, замечать»; 目を注ぐ. διχοστασίας — «разделения»; 分裂. ἐκκλίνετε — «уклоняйтесь»; 離れなさい."
  18: "τῇ ἑαυτῶν κοιλίᾳ — «своему чреву»; 自分の腹. χρηστολογία — «хорошие слова, лесть»; 巧みな言葉; εὐλογία — «благословение, льстивая речь»; 褒め言葉. ἄκακοι — «простые, незлобивые»; 純朴な人々."
  19: "ὑπακοή — послушание, 従順. ἀκεραίους — «невинных, цельных»; 無垢."
  20: "συντρίψει — «сокрушит»; 砕く. ἐν τάχει — «вскоре»; 間もなく. В базе ὁ κύριος ἡμῶν Ἰησοῦς без Χριστός; у jp-joc с ハリストス и «アミン» — переведено по базе."
  21: "Τιμόθεος — ティモテ (в корпусе принято ティモテ, Деян 16:1); Λούκιος — ルキオ (не ルカ); Ἰάσων — イアソン (как в Деян 17:5); Σωσίπατρος — ソシパテル."
  22: "Τέρτιος — テルティオ, писец, записавший послание; 筆記者."
  23: "Γάϊος — ガイオ; ξένος — «странноприимец»; 客. Ἔραστος — エラスト; οἰκονόμος τῆς πόλεως — «городской казнохранитель»; 町の財務官. Κούαρτος — クァルト."
  24: "В базе gr-lxx-byz на месте стиха стоит «.»: в критическом тексте стиха нет. Церковный текст (jp-joc) читает его — весь стих в 〔…〕, по правилу о стихах, отсутствующих в базе."
  25: "Славословие 25–27 в базе gr-lxx-byz стоит здесь; у jp-joc оно помещено в 14:24–26. Переведено по базе, без скобок. κατὰ τὸ εὐαγγέλιόν μου — «по благовествованию моему»; わたしの福音に従い."
  26: "διὰ τε γραφῶν προφητικῶν — «через писания пророческие»; 預言者たちの書によって. εἰς ὑπακοὴν πίστεως — «в покорность вере»; 信仰の従順に導く. γνωρισθέντος — «став известным»; 知らされ."
  27: "μόνῳ σοφῷ θεῷ — «единому премудрому Богу»; ただひとりの賢い神. В базе [ᾧ] при δόξα — переведено «栄光が»."
