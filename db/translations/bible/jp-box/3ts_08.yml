  56: "「今日[きょう]、イスラエルの神[かみ]、主[しゅ]はほめたたえられるように。主[しゅ]はご自分[じぶん]の民[たみ]イスラエルに、約束[やくそく]されたとおりの安[やす]らぎを与[あた]えられた。しもべモーセの手[て]によって語[かた]られた良[よ]い言葉[ことば]は、一[ひと]つも欠[か]けなかった。"
  57: "わたしたちの神[かみ]、主[しゅ]がわたしたちとともにおられるように。主[しゅ]がわたしたちの父祖[ふそ]たちとともにおられたように。どうか主[しゅ]がわたしたちを離[はな]れず、見捨[みす]てられないように。"
  58: "主[しゅ]がわたしたちの心[こころ]を主[しゅ]に向[む]けて、主[しゅ]のすべての道[みち]を歩[あゆ]ませ、主[しゅ]がわたしたちの父祖[ふそ]たちに命[めい]じられたすべての戒[いまし]めと定[さだ]めと法[のり]を守[まも]らせてくださるように。"
  59: "これらのわたしの言葉[ことば]が、わたしが主[しゅ]、わたしたちの神[かみ]の前[まえ]で祈[いの]ったことばが、昼[ひる]も夜[よる]もわたしたちの神[かみ]、主[しゅ]に近[ちか]くあり、しもべのため、民[たみ]イスラエルのために、その日[ひ]その日[ひ]にふさわしい裁[さば]きを行[おこな]わせてくださるように。"
  60: "それは、地[ち]のすべての民[たみ]が、主[しゅ]こそ神[かみ]であり、ほかに神[かみ]はいないことを知[し]るためである。"
  61: "わたしたちの心[こころ]が、わたしたちの神[かみ]、主[しゅ]に対して全[まった]きものであり、主[しゅ]の定[さだ]めに従[したが]って聖[せい]なる歩[あゆ]みをし、今日[きょう]のように主[しゅ]の戒[いまし]めを守[まも]るように。」"
  62: "王[おう]とイスラエルの子[こ]らはすべて、主[しゅ]の前[まえ]で犠牲[ぎせい]をささげた。"
  63: "ソロモン王[おう]は主[しゅ]にささげる酬恩祭[しゅうおんさい]の犠牲[ぎせい]として、牛[うし]二万二千[にまんにせん]頭[とう]、羊[ひつじ]十二万[じゅうにまん]頭[とう]を屠[ほふ]った。こうして王[おう]とイスラエルの子[こ]らはすべて、主[しゅ]の神殿[しんでん]を奉献[ほうけん]した。"
  64: "その日[ひ]、王[おう]は主[しゅ]の神殿[しんでん]の前[まえ]にある庭[にわ]の中央[ちゅうおう]を聖別[せいべつ]した。そこに燔祭[はんさい]と捧[ささ]げ物[もの]と犠牲[ぎせい]と酬恩祭[しゅうおんさい]の脂肪[しぼう]をささげたからである。主[しゅ]の前[まえ]にある青銅[せいどう]の祭壇[さいだん]は、燔祭[はんさい]と犠牲[ぎせい]と酬恩祭[しゅうおんさい]の脂肪[しぼう]を受[う]け入[い]れるには小[ちい]さすぎたのである。"
  65: "そのときソロモンは祭[まつ]りを行[おこな]い、イスラエルはすべて彼[かれ]とともに、ハマトの入口[いりぐち]からエジプトの川[かわ]までという大[おお]きな会衆[かいしゅう]が、彼[かれ]が建[た]てた神殿[しんでん]で、わたしたちの神[かみ]、主[しゅ]の前[まえ]に集[あつ]まり、七日間[なのかかん]、食[た]べ、飲[の]み、喜[よろこ]んだ。"
  66: "八日目[ようかめ]にソロモンは民[たみ]を帰[かえ]らせ、民[たみ]は王[おう]を祝福[しゅくふく]した。そして彼[かれ]らはそれぞれ自分[じぶん]の天幕[てんまく]へ、主[しゅ]がしもべダビデとその民[たみ]イスラエルに与[あた]えたすべての良[よ]いことのゆえに、喜[よろこ]び、心[こころ]を明[あか]るくして帰[かえ]って行[い]った。"

notes:
  1: "μετὰ εἴκοσι ἔτη — через двадцать лет; ἐξεκκλησίασεν — созвал собрание (ἐκκλησιάζω); τοὺς πρεσβυτέρους Ισραηλ — старейшин Израиля; ἀνενεγκεῖν — вознести; κιβωτὸν διαθήκης — ковчег завета. Слав. 8:1 начинается сразу с «И собра царь соломон...», без «по двадцати летах» — это в слав. 9:10; в тексте по LXX. Слав. добавляет «вся начала колен, старейшины отечеств сынов израилевых» (по МТ 8:1) — внесено."
  2: "ἐν μηνὶ Αθανιν — в месяце Афаним (Афаним — седьмой месяц, тишри). Слав. 8:2 добавляет «в праздник: сей есть месяц седмый» (по МТ 8:2) — внесено как пояснение."
  3: "ἦραν οἱ ἱερεῖς τὴν κιβωτόν — подняли священники ковчег. Слав. 8:3 добавляет «пришли все старейшины Израилевы» (по МТ 8:3) — внесено в основной текст."
  4: "σκήνωμα τοῦ μαρτυρίου — скиния свидетельства (証の幕屋); σκεύη τὰ ἅγια — священные сосуды; ἱερεῖς καὶ λευῖται — священники и левиты. Слав. 8:4 добавляет «вознесоша кивот Господень» и «иерее и левити» (подняли ковчег; священники и левиты) — в gr ковчег поднят в 8:3, левиты не упомянуты; внесено."
  5: "ἔμπροσθεν τῆς κιβωτοῦ — пред ковчегом; θύοντες — принося жертвы; πρόβατα καὶ βόας ἀναρίθμητα — овцы и волы неисчислимые. Слав. 8:5."
  6: "εἰς τὸ δαβιρ τοῦ οἴκου — в давир дома (至聖所); ὑπὸ τὰς πτέρυγας τῶν χερουβιν — под крылья херувимов. Слав. 8:6."
  7: "διαπεπετασμένα ταῖς πτέρυξιν — распростёршие крылья; περιεκάλυπτον — покрывали; ἐπὶ τὰ ἅγια αὐτῆς — над святынями его (содержимым ковчега). Слав. 8:7."
  8: "ὑπερεῖχον τὰ ἡγιασμένα — выдавались освящённые шесты; ἐνεβλέποντο αἱ κεφαλαί — видны были концы; οὐκ ὠπτάνοντο ἔξω — не показывались снаружи. В LXX нет «до сего дня» (это МТ; в слав. тоже нет)."
  9: "πλὴν δύο πλάκες λίθιναι — кроме двух каменных скрижалей; πλάκες τῆς διαθήκης — скрижали завета; ἐν Χωρηβ — на Хориве; διέθετο — заключил завет. Слав. 8:9."
  10: "νεφέλη — облако; ἔπλησεν τὸν οἶκον — наполнило дом. Слав. 8:10."
  11: "λειτουργεῖν — совершать служение; ἀπὸ προσώπου τῆς νεφέλης — от лица облака; δόξα κυρίου — слава Господня. Слав. 8:11."
  12: "В gr-lxx-byz на месте стиха стоит «.»; текст по csl 8:12 «Тогда рече соломон: Господь рече еже обитати во мгле». γνόφος — мрак, тьма. Ср. 8:53a, где LXX помещает тот же отдел."
  13: "По csl 8:13 «аз же создах дом имени твоему свят тебе и готов, и престолу твоему, еже обитати тебе в нем во веки». В gr «.»; ср. 8:53a. Здесь закрывается речь 12–13."
  14: "ἀπέστρεψεν τὸ πρόσωπον — обратил лицо; εὐλόγησεν — благословил; ἐκκλησία — собрание (会衆); εἱστήκει — стояла. Слав. 8:14."
  15: "Εὐλογητὸς κύριος — благословен Господь; ὃς ἐλάλησεν ἐν τῷ στόματι αὐτοῦ — который сказал устами Своими; ἐν ταῖς χερσὶν αὐτοῦ ἐπλήρωσεν — руками Своими исполнил. Слав. 8:15."
  16: "ἐν ἑνὶ σκήπτρῳ Ισραηλ — «в одном жезле Израиля», то есть в одном колене; слав. 8:16 «от всех племен израилевых» — внесено по csl. ἐξελεξάμην ... εἶναι τὸ ὄνομά μου ἐκεῖ — избрал, чтобы имя Моё было там."
  17: "ἐγένετο ἐπὶ τῆς καρδίας — было на сердце; οἰκοδομῆσαι οἶκον τῷ ὀνόματι — построить дом имени. Слав. 8:17."
  18: "Ἀνθ' ὧν — за то что, понеже; καλῶς ἐποίησας — хорошо сделал; ἐγενήθη ἐπὶ τὴν καρδίαν σου — было на сердце твоём. Слав. 8:18."
  19: "πλὴν σὺ οὐκ οἰκοδομήσεις — однако не ты построишь; ὁ ἐξελθὼν ἐκ τῶν πλευρῶν σου — вышедший из чресл твоих. Слав. 8:19."
  20: "ἀνέστησεν κύριος τὸ ῥῆμα — Господь исполнил слово; ἀνέστην ἀντὶ Δαυιδ — я встал вместо Давида; ἐκάθισα ἐπὶ τοῦ θρόνου — сел на престоле. Слав. 8:20."
  21: "ἐθέμην ἐκεῖ τόπον τῇ κιβωτῷ — поставил там место ковчегу; ἐν ᾗ ἐστιν διαθήκη κυρίου — в котором завет Господень. Слав. 8:21. Здесь закрывается речь Соломона (15–21)."
  22: "κατὰ πρόσωπον τοῦ θυσιαστηρίου — пред жертвенником; διεπέτασεν τὰς χεῖρας — распростёр руки; εἰς τὸν οὐρανόν — к небу. Слав. 8:22."
  23: "οὐκ ἔστιν ὡς σὺ θεός — нет подобного Тебе Бога; φυλάσσων διαθήκην καὶ ἔλεος — хранящий завет и милость; τῷ πορευομένῳ ἐνώπιόν σου ἐν ὅλῃ τῇ καρδίᾳ — ходящему пред Тобою всем сердцем. Слав. 8:23."
  24: "ἃ ἐφύλαξας — что сохранил; ἐλάλησας ἐν τῷ στόματί σου — сказал устами Твоими; ἐν χερσίν σου ἐπλήρωσας — руками Твоими исполнил; ὡς ἡ ἡμέρα αὕτη — как день сей. Слав. 8:24."
  25: "φύλαξον — сохрани, исполни; Οὐκ ἐξαρθήσεταί σου ἀνήρ — не отнимется у тебя муж; καθὼς ἐπορεύθης — как ты ходил. Слав. 8:25."
  26: "πιστωθήτω δὴ τὸ ῥῆμά σου — да будет верно, подтверждено слово Твоё (πιστόω); τῷ Δαυιδ τῷ πατρί μου — Давиду, отцу моему. Слав. 8:26."
  27: "εἰ ἀληθῶς κατοικήσει ὁ θεὸς μετὰ ἀνθρώπων ἐπὶ τῆς γῆς; — вопрос; οὐρανὸς τοῦ οὐρανοῦ — небо небес; οὐκ ἀρκέσουσίν σοι — не вместят Тебя; πλὴν καὶ ὁ οἶκος οὗτος — тем более дом сей. Слав. 8:27."
  28: "ἐπιβλέψῃς — призри; δέησις — прошение; ἀκούειν τῆς τέρψεως — «услышать услаждение» (τέρψις — редкое чтение LXX); слав. 8:28 «послушати молитвы» — в тексте 祈り по csl, вариант LXX в notes."
  29: "ὀφθαλμοὺς ἠνεῳγμένους — очи отверсты; ἡμέρας καὶ νυκτός — день и ночь; Ἔσται τὸ ὄνομά μου ἐκεῖ — будет имя Моё там; εἰσακούειν — услышать. Слав. 8:29."
  30: "εἰσακούσῃ — услышишь; ἃ ἂν προσεύξωνται — о чём бы ни молились; ἐν τῷ τόπῳ τῆς κατοικήσεώς σου ἐν οὐρανῷ — на месте обитания Твоего на небе; ποιήσεις καὶ ἵλεως ἔσῃ — сделаешь и будешь милостив. Слав. 8:30."
  31: "ἁμάρτῃ τῷ πλησίον — согрешит против ближнего; λάβῃ ἐπ' αὐτὸν ἀρὰν τοῦ ἀρᾶσθαι — примет на себя проклятие, чтобы клясть его; ἐξαγορεύσῃ — исповедает, объявит; κατὰ πρόσωπον τοῦ θυσιαστηρίου — пред жертвенником. Слав. 8:31."
  32: "ἀνομηθῆναι ἄνομον — признать беззаконного беззаконным; δοῦναι τὴν ὁδὸν αὐτοῦ εἰς κεφαλὴν αὐτοῦ — обратить путь его на голову его; δικαιῶσαι δίκαιον — оправдать праведного; κατὰ τὴν δικαιοσύνην αὐτοῦ — по правде его. Слав. 8:32."
  33: "ἐν τῷ πταῖσαι — когда преткнётся, будет поражён; ἐπιστρέψουσιν — обратятся; ἐξομολογήσονται τῷ ὀνόματί σου — исповедают имя Твоё; δεηθῶσιν — умолят. Слав. 8:33."
  34: "ἵλεως ἔσῃ ταῖς ἁμαρτίαις — будешь милостив к грехам; ἀποστρέψεις — возвратишь; ἣν ἔδωκας τοῖς πατράσιν — которую дал отцам их. Слав. 8:34."
  35: "συσχεθῆναι τὸν οὐρανὸν — небо заключится; ὑετός — дождь; ἀπὸ τῶν ἁμαρτιῶν ... ἀποστρέψουσιν — обратятся от грехов; ὅταν ταπεινώσῃς αὐτούς — когда Ты смиришь их. Слав. 8:35."
  36: "δηλώσεις αὐτοῖς τὴν ὁδὸν τὴν ἀγαθήν — укажешь им добрый путь; ἐν κληρονομίᾳ — в наследие (嗣業). Слав. 8:36."
  37: "λιμός, θάνατος, ἐμπυρισμός, βροῦχος, ἐρυσίβη — голод, смерть, воспламенение, саранча, ржа (слав. «глад... смерть... возжжение, гусеницы, ржа»); ἐν μιᾷ τῶν πόλεων — в одном из городов; πᾶν συνάντημα — всякая напасть; πᾶν πόνον — всякая боль. Слав. 8:37."
  38: "ἁφὴν καρδίας — «прикосновение», язву сердца (слав. «болезнь сердца»); διαπετάσῃ τὰς χεῖρας — распрострёт руки; εἰς τὸν οἶκον τοῦτον — к дому сему. Слав. 8:38."
  39: "ἐξ ἑτοίμου κατοικητηρίου σου — из готового жилища Твоего; δώσεις ἀνδρὶ κατὰ τὰς ὁδοὺς αὐτοῦ — дашь мужу по путям его; μονώτατος — единственный; οἶδας τὴν καρδίαν — знаешь сердце. Слав. 8:39."
  40: "ὅπως φοβῶνταί σε — чтобы боялись Тебя; ἃς αὐτοὶ ζῶσιν — которые они живут; ἧς ἔδωκας — которую дал. Слав. 8:40."
  41: "ἀλλοτρίῳ — чужеземцу (異国人); слав. 8:41 добавляет «той аще приидет от земли издалеча ради имене твоего, зане услышат имя твое велико, и руку твою крепкую, и мышцу твою высокую» (по МТ 8:41–42) — внесено в основной текст."
  42: "ἥξουσιν — придут; προσεύξονται εἰς τὸν τόπον τοῦτον — помолятся на месте сем. Слав. 8:42 «и приидет, и помолится на месте сем»."
  43: "κατὰ πάντα, ὅσα ἂν ἐπικαλέσηταί σε — по всему, что призовёт Тебя; ὅπως γνῶσιν πάντες οἱ λαοὶ — чтобы познали все народы; ἐπικέκληται ἐπὶ τὸν οἶκον — имя Твоё наречено на доме сем. Слав. 8:43."
  44: "ἐν ὁδῷ, ᾗ ἐπιστρέψεις αὐτούς — путём, которым Ты пошлёшь их; ὁδὸν τῆς πόλεως — к городу; οὗ ᾠκοδόμησα τῷ ὀνόματί σου — который я построил имени Твоему. Слав. 8:44."
  45: "ποιήσεις τὸ δικαίωμα αὐτοῖς — сделаешь им правду, суд (слав. «оправдание»). Слав. 8:45."
  46: "ἐπάξεις ἐπ' αὐτούς — наведёшь на них (LXX); слав. 8:46 «и разгневаешися на ня» — в тексте 怒り по csl, вариант LXX в notes; παραδώσεις — предашь; αἰχμαλωτιοῦσιν — уведут в плен; εἰς γῆν μακρὰν καὶ ἐγγύς — в землю далёкую и близкую."
  47: "ἐπιστρέψουσιν καρδίας αὐτῶν — обратят сердца свои; μετήχθησαν — были переселены; ἐν γῇ μετοικίας — в земле переселения; Ἡμάρτομεν ἠνομήσαμεν ἠδικήσαμεν — согрешили, беззаконновали, неправдовали. Слав. 8:47."
  48: "ἐν ὅλῃ καρδίᾳ καὶ ἐν ὅλῃ ψυχῇ — всем сердцем и всею душою; μετήγαγες — переселил; ὁδὸν γῆς αὐτῶν — к земле их; οὗ ᾠκοδόμηκα — который я построил. Слав. 8:48."
  49: "В gr 8:49 стих обрывается на καὶ εἰσακούσῃ ἐκ τοῦ οὐρανοῦ ἐξ ἑτοίμου κατοικητηρίου σου; слав. 8:49 продолжает «молитву их и моление их, и сотвориши оправдание им» (повтор 8:45) — внесено в основной текст."
  50: "ἵλεως ἔσῃ ταῖς ἀδικίαις — будешь милостив к неправдам; ἀθετήματα — преступления, отвержения; δώσεις αὐτοὺς εἰς οἰκτιρμούς — предашь их в милость; οἰκτιρήσουσιν — помилуют. Слав. 8:50."
  51: "κληρονομία σου — удел Твой (嗣業); ἐκ μέσου χωνευτηρίου σιδήρου — из среды плавильной печи железной (слав. «от среды пещи железныя»). Слав. 8:51."
  52: "ἔστωσαν οἱ ὀφθαλμοί ... ἠνεῳγμένα — да будут очи... отверсты; εἰσακούειν αὐτῶν — слышать их; ἐν πᾶσιν οἷς ἂν ἐπικαλέσωνταί σε — во всём, в чём призовут Тебя. Слав. 8:52."
  53: "διέστειλας — отделил; ἐν χειρὶ δούλου σου Μωυσῆ — рукою раба Твоего Моисея; κύριε κύριε — Господи Господи. В gr после стиха стоит «53a» (Τότε ἐλάλησεν Σαλωμων ὑπὲρ τοῦ οἴκου... Ἥλιον ἐγνώρισεν... Οἰκοδόμησον οἶκόν μου... οὐκ ἰδοὺ αὕτη γέγραπται ἐν βιβλίῳ τῆς ᾠδῆς;) — тот же отдел, что в 8:12–13 и в слав. 8:53b; в основной текст не внесён, чтобы не дублировать 8:12–13."
  54: "ὀκλακὼς ἐπὶ τὰ γόνατα — преклонив колени; αἱ χεῖρες διαπεπετασμέναι — руки распростёрты; ἀνέστη ἀπὸ προσώπου τοῦ θυσιαστηρίου — встал от жертвенника. Слав. 8:54."
  55: "φωνῇ μεγάλῃ — громким голосом. Слав. 8:55."
  56: "κατάπαυσις — покой; οὐ διεφώνησεν λόγος εἷς — ни одно слово не оказалось неисполненным (διαφωνέω); ἐν χειρὶ Μωυσῆ — рукою Моисея. Слав. 8:56."
  57: "γένοιτο — да будет; μὴ ἐγκαταλίποιτο — да не оставит; μηδὲ ἀποστρέψοιτο — и да не отвратится. Слав. 8:57."
  58: "ἐπικλῖναι καρδίας — преклонить сердца; φυλάσσειν ἐντολὰς καὶ προστάγματα — хранить заповеди и повеления; ἃ ἐνετείλατο — которые заповедал. Слав. 8:58 добавляет «оправдания» — передано 法."
  59: "οὓς δεδέημαι — которыми я молился (δέω); ἐγγίζοντες — приближающиеся; ῥῆμα ἡμέρας ἐν ἡμέρᾳ αὐτοῦ — слово дня в день его. Слав. 8:59."
  60: "κύριος ὁ θεός, αὐτὸς θεὸς καὶ οὐκ ἔστιν ἔτι — Господь есть Бог, и нет иного. Слав. 8:60."
  61: "τέλειαι — совершенные, всецелые; ὁσίως πορεύεσθαι — преподобно ходить; ὡς ἡ ἡμέρα αὕτη — как день сей. Слав. 8:61."
  62: "ἔθυσαν θυσίαν — принесли жертву. Слав. 8:62."
  63: "θυσίας τῶν εἰρηνικῶν — мирные жертвы (酬恩祭); βοῶν 22 000 и προβάτων 120 000; ἐνεκαίνισεν — освятил, обновил (奉献). Слав. 8:63."
  64: "ἡγίασεν τὸ μέσον τῆς αὐλῆς — освятил середину двора; ὁλοκαύτωσιν καὶ τὰς θυσίας καὶ τὰ στέατα — всесожжение, жертвы и тук; слав. 8:64 добавляет «дары» — внесено как 捧げ物; μικρὸν τοῦ μὴ δύνασθαι — мал, чтобы вместить."
  65: "ἑορτήν — праздник; ἀπὸ τῆς εἰσόδου Ημαθ ἕως ποταμοῦ Αἰγύπτου — от входа Емафа до реки Египетской; ἑπτὰ ἡμέρας — семь дней. В МТ/ru добавлено «и ещё семь дней, четырнадцать дней» — в LXX и csl этого нет, не внесено. Слав. 8:65."
  66: "ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ — в восьмой день; ἐξαπέστειλεν — отпустил; εὐλόγησεν αὐτόν — «он благословил его» (LXX); слав. 8:66 «благословиша царя» — в тексте по csl «民は王を祝福した», вариант LXX в notes; σκηνώματα — шатры; ἀγαθῇ καρδίᾳ — с добрым сердцем."
