  8: "その担[かつ]ぎ棒[ぼう]は長[なが]く、その先[さき]が聖所[せいしょ]から至[し]聖所[せいしょ]の前[まえ]にまではみ出[だ]していたが、外[そと]からは見[み]えなかった。"
  9: "箱[はこ]の中[なか]には、二[ふた]つの石[いし]の板[いた]、すなわち契約[けいやく]の板[いた]のほか何[なに]もなかった。それはモーセがホレブで置[お]いたもので、主[しゅ]がイスラエルの子[こ]らをエジプトの地[ち]から導[みちび]き出[だ]したとき、彼[かれ]らと結[むす]んだ契約[けいやく]の板[いた]である。"
  10: "祭司[さいし]たちが聖所[せいしょ]から出[で]て来[き]たとき、雲[くも]が神殿[しんでん]を満[み]たした。"
  11: "祭司[さいし]たちはその雲[くも]のゆえに、務[つと]めを行[おこな]うために立[た]っていることができなかった。主[しゅ]の栄光[えいこう]が神殿[しんでん]を満[み]たしたからである。"
