  1: "ソロモンが主[しゅ]の神殿[しんでん]と自分[じぶん]の家[いえ]を建[た]て終[お]え、二十[にじゅう]年[ねん]がたったとき、ソロモン王[おう]はイスラエルのすべての長老[ちょうろう]、すなわち部族[ぶぞく]の長[おさ]たち、イスラエルの子[こ]らの父祖[ふそ]の家[いえ]の長[おさ]たちをシオンに集[あつ]めた。主[しゅ]の契約[けいやく]の箱[はこ]をダビデの町[まち]、すなわちシオンから運[はこ]び上[のぼ]らせるためであった。"
