  25: "今[いま]、イスラエルの神[かみ]、主[しゅ]よ。あなたがしもべダビデ、わたしの父[ちち]に語[かた]られたことを、彼[かれ]のために守[まも]ってください。あなたは言[い]われた。『わたしの前[まえ]でイスラエルの王座[おうざ]に座[すわ]る者[もの]が、あなたから断[た]たれることはない。ただし、あなたの子[こ]たちが自分[じぶん]の道[みち]を守[まも]り、あなたがわたしの前[まえ]を歩[あゆ]んだように、わたしの前[まえ]を歩[あゆ]むならば。』"
