verses:
  1: "ハレルヤ。主[しゅ]に感謝[かんしゃ]せよ。その名[な]を呼[よ]べ。諸国[しょこく]の民[たみ]の中[なか]にそのわざを告[つ]げ知[し]らせよ。"
  2: "主[しゅ]に歌[うた]い、ほめ歌[うた]を歌[うた]え。そのすべての奇[き]跡[せき]を語[かた]り伝[つた]えよ。"
  3: "その聖[せい]なる名[な]を誇[ほこ]れ。主[しゅ]を尋[たず]ね求[もと]める者[もの]の心[こころ]は喜[よろこ]べ。"
  4: "主[しゅ]を尋[たず]ねて強[つよ]くなれ。いつも主[しゅ]の顔[かお]を尋[たず]ねよ。"
  5: "主[しゅ]が行[おこな]われた奇[き]跡[せき]を、そのしるしと、その口[くち]の裁[さば]きとを思[おも]い出[だ]せ。"
  6: "その僕[しもべ]であるアブラハムの子孫[しそん]よ、その選[えら]ばれた者[もの]であるヤコブの子[こ]らよ。"
  7: "主[しゅ]はわたしたちの神[かみ]である。その裁[さば]きは全[ぜん]地[ち]に及[およ]ぶ。"
  8: "主[しゅ]はとこしえにその契約[けいやく]を、千[せん]代[だい]に及[およ]ぶまでに命[めい]じられた言葉[ことば]を覚[おぼ]えておられる。"
  9: "それはアブラハムと結[むす]ばれた契約[けいやく]、イサクに対する誓[ちか]いであり、"
  10: "主[しゅ]はそれをヤコブに対する定[さだ]めとし、イスラエルに対する永遠[えいえん]の契約[けいやく]とされた。"
  11: "そして言[い]われた。「わたしはあなたにカナンの地[ち]を、あなたがたの嗣業[しぎょう]の測[はか]り縄[なわ]として与[あた]える」と。"
  12: "そのとき、彼[かれ]らは数[かず]が少[すく]なく、ごくわずかで、その地[ち]に寄留[きりゅう]していた。"
  13: "彼[かれ]らは民[たみ]から民[たみ]へ、王国[おうこく]からほかの民[たみ]へと渡[わた]って行[ゆ]った。"
  14: "主[しゅ]はだれにも彼[かれ]らを害[がい]することを許[ゆる]さず、彼[かれ]らのために王[おう]たちを戒[いまし]めて、"
  15: "「わたしの油[あぶら]を注[そそ]がれた者[もの]たちに触[ふ]れるな。わたしの預言者[よげんしゃ]たちに悪[わる]をなすな」と言[い]われた。"
  16: "主[しゅ]は地[ち]に飢[き]饉[きん]を呼[よ]び寄[よ]せ、パンを支[ささ]えるものすべてを砕[くだ]かれた。"
  17: "主[しゅ]は彼[かれ]らの前[まえ]に一人[ひとり]の人[ひと]を遣[つか]わされた。ヨセフは奴隷[どれい]として売[う]られた。"
  18: "彼[かれ]の足[あし]は枷[かせ]で苦[くる]しめられ、鉄[てつ]がその魂[たましい]を貫[つらぬ]いた。"
  19: "主[しゅ]の言葉[ことば]が実現[じつげん]するまで、主[しゅ]の告[つ]げは彼[かれ]を火[ひ]のように試[こころ]みた。"
  20: "王[おう]は人[ひと]を遣[つか]わして彼[かれ]を解[と]き放[はな]ち、民[たみ]の支配者[しはいしゃ]は彼[かれ]を自由[じゆう]にした。"
  21: "王[おう]は彼[かれ]を自分[じぶん]の家[いえ]の主人[しゅじん]とし、自分の全[すべ]ての財産[ざいさん]を治[おさ]める者[もの]とした。"
  22: "それは、王[おう]の家来[けらい]たちを彼[かれ]自身[じしん]のように導[みちび]き、その長老[ちょうろう]たちに知恵[ちえ]を授[さず]けるためであった。"
  23: "こうしてイスラエルはエジプトに入[はい]り、ヤコブはハムの地[ち]に寄留[きりゅう]した。"
  24: "主[しゅ]はその民[たみ]を大[おお]いに増[ふ]やし、その敵[てき]たちよりも強[つよ]くされた。"
  25: "主[しゅ]は彼[かれ]らの心[こころ]を変[か]えてご自分[じぶん]の民[たみ]を憎[にく]ませ、その僕[しもべ]たちを欺[あざむ]くようにされた。"
  26: "主[しゅ]はその僕[しもべ]モーセと、選[えら]ばれたアロンとを遣[つか]わされた。"
  27: "主[しゅ]はハムの地[ち]で、ご自分[じぶん]のしるしと奇[き]跡[せき]の言葉[ことば]を彼[かれ]らのうちに置[お]かれた。"
  28: "主[しゅ]は暗[くら]やみを送[おく]って暗[くら]くされた。彼[かれ]らは主[しゅ]の言葉[ことば]を怒[いか]らせた。"
  29: "主[しゅ]は彼[かれ]らの水[みず]を血[ち]に変[か]え、その魚[さかな]を殺[ころ]された。"
  30: "彼[かれ]らの地[ち]はかえるを生[は]え出[で]させ、王[おう]たちの寝室[しんしつ]にまで及[およ]んだ。"
  31: "主[しゅ]が言[い]われると、あぶと蚊[か]が来[き]て、彼[かれ]らのすべての境[さかい]に満[み]ちた。"
  32: "主[しゅ]は彼[かれ]らの雨[あめ]を雹[ひょう]に変[か]え、燃[も]えさかる火[ひ]をその地[ち]に降[ふ]らせた。"
  33: "主[しゅ]は彼[かれ]らのぶどうの木[き]といちじくの木[き]を打[う]ち、その境[さかい]の木[き]をすべて砕[くだ]かれた。"
  34: "主[しゅ]が言[い]われると、いなごと青虫[あおむし]が、数[かぞ]えきれないほど来[き]て、"
  35: "彼[かれ]らの地[ち]の草[くさ]をすべて食[く]い尽[つ]くし、その地[ち]の実[み]を食[く]い尽[つ]くした。"
  36: "主[しゅ]は彼[かれ]らの地[ち]のすべての初[うい]子[ご]を、その労苦[ろうく]の初[はじ]めを打[う]たれた。"
  37: "主[しゅ]は彼[かれ]らを銀[ぎん]と金[きん]を携[たずさ]えて導[みちび]き出[だ]し、その部族[ぶぞく]の中[なか]に病[や]む者[もの]は一人[ひとり]もいなかった。"
  38: "エジプトは彼[かれ]らの出[で]て行[ゆ]くのを喜[よろこ]んだ。彼[かれ]らへの恐[おそ]れがエジプトに落[お]ちたからである。"
  39: "主[しゅ]は雲[くも]を広[ひろ]げて彼[かれ]らの覆[おお]いとし、火[ひ]を送[おく]って夜[よる]を照[て]らされた。"
  40: "彼[かれ]らが求[もと]めると、うずらが来[き]て、主[しゅ]は天[てん]のパンで彼[かれ]らを満[み]たされた。"
  41: "主[しゅ]が岩[いわ]を裂[さ]かれると水[みず]が流[なが]れ出[で]、水[みず]のない所[ところ]に川[かわ]のように流[なが]れた。"
  42: "主[しゅ]はその僕[しもべ]アブラハムに語[かた]られた聖[せい]なる言葉[ことば]を覚[おぼ]えておられたからである。"
  43: "主[しゅ]はその民[たみ]を喜[よろこ]び躍[おど]らせて、その選[えら]ばれた者[もの]たちを喜[よろこ]びのうちに導[みちび]き出[だ]された。"
  44: "主[しゅ]は彼[かれ]らに諸国[しょこく]の民[たみ]の地[ち]を与[あた]え、彼[かれ]らはもろもろの民[たみ]の労苦[ろうく]を嗣業[しぎょう]として受[う]け継[つ]いだ。"
  45: "それは、彼[かれ]らが主[しゅ]の定[さだ]めを守[まも]り、その律法[りっぽう]を求[もと]めて行[おこな]うためであった。"

notes:
  1: "Αλληλουια — ハレルヤ («хвалите Господа»). В gr-lxx-byz и gr-ru это отдельная строка 0, поэтому стоит как стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1) (в ru, csl-ру и jp-joc строки 0 нет, их нумерация 1–45 совпадает с греческой). Надписание не маркируется 〔…〕. Ἐξομολογεῖσθε τῷ κυρίῳ — 主に感謝せよ (ἐξομολογέομαι — «исповедовать, благодарить, славить»). ἐπικαλεῖσθε τὸ ὄνομα αὐτοῦ — その名を呼べ (ἐπικαλέομαι — «призывать»). ἀπαγγείλατε ἐν τοῖς ἔθνεσιν τὰ ἔργα αὐτοῦ — 諸国の民の中にそのわざを告げ知らせよ (ἀπαγγέλλω — «возвещать»)."
  2: "ᾄσατε αὐτῷ καὶ ψάλατε αὐτῷ — 主に歌い、ほめ歌を歌え (ψάλλω — «петь под струны»). διηγήσασθε πάντα τὰ θαυμάσια αὐτοῦ — そのすべての奇跡を語り伝えよ (διηγέομαι — «рассказывать»; θαυμάσιον — «дивное»)."
  3: "ἐπαινεῖσθε ἐν τῷ ὀνόματι τῷ ἁγίῳ αὐτοῦ — その聖なる名を誇れ (ἐπαινέομαι — «хвалиться»; в слав. «хвалитеся о имени»). εὐφρανθήτω καρδία ζητούντων τὸν κύριον — 主を尋ね求める者の心は喜べ (ζητέω — «искать»)."
  4: "ζητήσατε τὸν κύριον καὶ κραταιώθητε — 主を尋ねて強くなれ (κραταιόω в страд. — «укрепляться»). ζητήσατε τὸ πρόσωπον αὐτοῦ διὰ παντός — いつも主の顔を尋ねよ (διὰ παντός — «всегда»); повтор ζητέω сохранён."
  5: "μνήσθητε τῶν θαυμασίων αὐτοῦ, ὧν ἐποίησεν — 主が行われた奇跡を思い出せ (μιμνήσκομαι — «помнить»). τὰ τέρατα αὐτοῦ — そのしるし (τέρας — «знамение»). τὰ κρίματα τοῦ στόματος αὐτοῦ — その口の裁き (κρίμα — «суд, определение»); т. е. изречённые приговоры."
  6: "σπέρμα Αβρααμ δοῦλοι αὐτοῦ — その僕であるアブラハムの子孫よ (σπέρμα — «семя, потомство»). υἱοὶ Ιακωβ ἐκλεκτοὶ αὐτοῦ — その選ばれた者であるヤコブの子らよ (ἐκλεκτός — «избранный»); обращение, а не утверждение."
  7: "αὐτὸς κύριος ὁ θεὸς ἡμῶν — 主はわたしたちの神である (αὐτός — усиление). ἐν πάσῃ τῇ γῇ τὰ κρίματα αὐτοῦ — その裁きは全地に及ぶ."
  8: "ἐμνήσθη εἰς τὸν αἰῶνα διαθήκης αὐτοῦ — 主はとこしえにその契約を覚えておられる (διαθήκη — 契約). λόγου, οὗ ἐνετείλατο εἰς χιλίας γενεάς — 千代に及ぶまでに命じられた言葉を (ἐντέλλομαι — «заповедать»; γενεά — «род»)."
  9: "ὃν διέθετο τῷ Αβρααμ — アブラハムと結ばれた契約 (διατίθεμαι — «заключать завет»). τοῦ ὅρκου αὐτοῦ τῷ Ισαακ — イサクに対する誓い (ὅρκος — «клятва»); стих продолжает ст. 8, поэтому оставлен придаточным."
  10: "καὶ ἔστησεν αὐτὴν τῷ Ιακωβ εἰς πρόσταγμα — 主はそれをヤコブに対する定めとし (ἵστημι — «ставить, утверждать»; πρόσταγμα — «повеление»). τῷ Ισραηλ διαθήκην αἰώνιον — イスラエルに対する永遠の契約 (αἰώνιος — «вечный»)."
  11: "λέγων· Σοὶ δώσω τὴν γῆν Χανααν — そして言われた。「わたしはあなたにカナンの地を…与える」 (Χανααν — Ханаан). σχοίνισμα κληρονομίας ὑμῶν — あなたがたの嗣業の測り縄として (σχοίνισμα — «вервь, участок, отмеренный вервью»; κληρονομία — 嗣業); слова Бога — 「」, красного нет."
  12: "ἐν τῷ εἶναι αὐτοὺς ἀριθμῷ βραχεῖς — そのとき、彼らは数が少なく (βραχύς — «малый»). ὀλιγοστοὺς — ごくわずかで (ὀλιγοστός — «немногочисленный»). παροίκους ἐν αὐτῇ — その地に寄留していた (πάροικος — «пришелец, поселенец»; ср. Евр 11:9)."
  13: "διῆλθον ἐξ ἔθνους εἰς ἔθνος — 民から民へと渡って行った (διέρχομαι — «проходить»). ἐκ βασιλείας εἰς λαὸν ἕτερον — 王国からほかの民へ (βασιλεία — «царство»)."
  14: "οὐκ ἀφῆκεν ἄνθρωπον ἀδικῆσαι αὐτούς — 主はだれにも彼らを害することを許さず (ἀφίημι — «попускать»; ἀδικέω — «обижать»). ἤλεγξεν ὑπὲρ αὐτῶν βασιλεῖς — 彼らのために王たちを戒めて (ἐλέγχω — «обличать, запрещать»)."
  15: "Μὴ ἅπτεσθε τῶν χριστῶν μου — 「わたしの油を注がれた者たちに触れるな」 (χριστός здесь — «помазанник», не имя; ἄπτομαι — «касаться»). ἐν τοῖς προφήταις μου μὴ πονηρεύεσθε — わたしの預言者たちに悪をなすな (πονηρεύομαι — «делать зло»; слав. «во пророцех Моих не лукавнуйте»); слова Бога — 「」."
  16: "ἐκάλεσεν λιμὸν ἐπὶ τὴν γῆν — 主は地に飢饉を呼び寄せ (λιμός — «голод»). πᾶν στήριγμα ἄρτου συνέτριψεν — パンを支えるものすべてを砕かれた (στήριγμα — «опора, подкрепление», т. е. хлебные запасы; συντρίβω — «сокрушать»)."
  17: "ἀπέστειλεν ἔμπροσθεν αὐτῶν ἄνθρωπον — 主は彼らの前に一人の人を遣わされた (ἔμπροσθεν — «впереди»). εἰς δοῦλον ἐπράθη Ιωσηφ — ヨセフは奴隷として売られた (πιπράσκω — «продавать»; δοῦλος — 奴隷)."
  18: "ἐταπείνωσαν ἐν πέδαις τοὺς πόδας αὐτοῦ — 彼の足は枷で苦しめられ (ταπεινόω — «смирять»; πέδη — «оковы, колодка»). σίδηρον διῆλθεν ἡ ψυχὴ αὐτοῦ — 鉄がその魂を貫いた (σίδηρος — «железо»; слав. «железо пройде душа его»); образ страдания, а не буквальное оружие."
  19: "μέχρι τοῦ ἐλθεῖν τὸν λόγον αὐτοῦ — 主の言葉が実現するまで (μέχρι — «до»; λόγος — «слово, дело»). τὸ λόγιον κυρίου ἐπύρωσεν αὐτόν — 主の告げは彼を火のように試みた (λόγιον — «изречение»; πυρόω — «испытывать огнём, очищать»); ср. Пс 104:19 и Быт 39–41."
  20: "ἀπέστειλεν βασιλεὺς καὶ ἔλυσεν αὐτόν — 王は人を遣わして彼を解き放ち (λύω — «разрешать, освобождать»). ἄρχων λαῶν ἀφῆκεν αὐτόν — 民の支配者は彼を自由にした (ἄρχων — «начальник, князь»; ἀφίημι — «отпускать»)."
  21: "κατέστησεν αὐτὸν κύριον τοῦ οἴκου αὐτοῦ — 王は彼を自分の家の主人とし (καθίστημι — «ставить, назначать»; κύριος τοῦ οἴκου — «господин дома», ср. Быт 41:40). ἄρχοντα πάσης τῆς κτήσεως αὐτοῦ — 自分のすべての財産を治める者とした (κτῆσις — «имущество, владение»)."
  22: "τοῦ παιδεῦσαι τοὺς ἄρχοντας αὐτοῦ ὡς ἑαυτὸν — 王の家来たちを彼自身のように導き (παιδεύω — «наставлять, учить»; ὡς ἑαυτόν — «как себя», т. е. по своему образу). τοὺς πρεσβυτέρους αὐτοῦ σοφίσαι — その長老たちに知恵を授けるため (πρεσβύτερος — «старейшина»; σοφίζω — «умудрять»)."
  23: "εἰσῆλθεν Ισραηλ εἰς Αἴγυπτον — イスラエルはエジプトに入り. Ιακωβ παρῴκησεν ἐν γῇ Χαμ — ヤコブはハムの地に寄留した (παροικέω — «жить пришельцем»; Χαμ — Хам, ср. Пс 77:51)."
  24: "ηὔξησεν τὸν λαὸν αὐτοῦ σφόδρα — 主はその民を大いに増やし (αὐξάνω — «умножать, растить»). ἐκραταίωσεν αὐτὸν ὑπὲρ τοὺς ἐχθροὺς αὐτοῦ — その敵たちよりも強くされた (κραταιόω — «укреплять»)."
  25: "μετέστρεψεν τὴν καρδίαν αὐτῶν τοῦ μισῆσαι τὸν λαὸν αὐτοῦ — 主は彼らの心を変えてご自分の民を憎ませ (μεταστρέφω — «изменять, обращать»; μισέω — «ненавидеть»). τοῦ δολιοῦσθαι ἐν τοῖς δούλοις αὐτοῦ — その僕たちを欺くようにされた (δολιόω — «лукавить, обманывать»)."
  26: "ἐξαπέστειλεν Μωυσῆν τὸν δοῦλον αὐτοῦ — 主はその僕モーセを遣わされた (ἐξαποστέλλω — «посылать»). Ααρων, ὃν ἐξελέξατο αὐτόν — 選ばれたアロンと (ἐκλέγομαι — «избирать»); οἱ два — по Исх 4:14–16."
  27: "ἔθετο ἐν αὐτοῖς τοὺς λόγους τῶν σημείων αὐτοῦ — 主はご自分のしるしの言葉を彼らのうちに置かれた (τίθημι — «полагать»; σημεῖον — «знамение»). τῶν τεράτων ἐν γῇ Χαμ — ハムの地でその奇跡を (τέρας — «чудо»)."
  28: "ἐξαπέστειλεν σκότος, καὶ ἐσκότασεν — 主は暗やみを送って暗くされた (σκοτάζω — «делать тёмным»; тьма — первая казнь, Исх 10:21–23). καὶ παρεπίκραναν τοὺς λόγους αὐτοῦ — 彼らは主の言葉を怒らせた (παραπικραίνω — «огорчать, прогневлять»; слав. «яко преогорчиша словеса Его», в евр. и в ru — «не воспротивились»; переведено по gr)."
  29: "μετέστρεψεν τὰ ὕδατα αὐτῶν εἰς αἷμα — 主は彼らの水を血に変え (μεταστρέφω — «превращать»; Исх 7:20). ἀπέκτεινεν τοὺς ἰχθύας αὐτῶν — その魚を殺された (ἰχθύς — «рыба»)."
  30: "ἐξῆρψεν ἡ γῆ αὐτῶν βατράχους — 彼らの地はかえるを生え出させ (ἐξέρπω, редкое — «изводить, выпускать ползком»; βάτραχος — かえる, как в Пс 77:45). ἐν τοῖς ταμιείοις τῶν βασιλέων αὐτῶν — 王たちの寝室にまで及んだ (ταμιεῖον — «внутренний покой, хранилище»)."
  31: "εἶπεν, καὶ ἦλθεν κυνόμυια — 主が言われると、あぶが来て (κυνόμυια — «песья муха», как в Пс 77:45). σκνῖπες ἐν πᾶσι τοῖς ὁρίοις αὐτῶν — 蚊が彼らのすべての境に (σκνίψ — «мошка, комар»; ὅριον — «предел»)."
  32: "ἔθετο τὰς βροχὰς αὐτῶν χάλαζαν — 主は彼らの雨を雹に変え (βροχή — «дождь»; χάλαζα — 雹, как в Пс 77:47). πῦρ καταφλέγον ἐν τῇ γῇ αὐτῶν — 燃えさかる火をその地に (καταφλέγω — «сожигать»)."
  33: "ἐπάταξεν τὰς ἀμπέλους αὐτῶν — 主は彼らのぶどうの木を打ち (ἄμπελος — «виноград»). τὰς συκᾶς αὐτῶν — いちじくの木を (συκῆ — いちじく). συνέτριψεν πᾶν ξύλον ὁρίου αὐτῶν — その境の木をすべて砕かれた (ξύλον — «дерево»)."
  34: "εἶπεν, καὶ ἦλθεν ἀκρὶς — 主が言われると、いなごが来て (ἀκρίς — いなご, как в Пс 77:46). βροῦχος, οὗ οὐκ ἦν ἀριθμός — 青虫が、数えきれないほど (βροῦχος — «гусеница, саранча»); стих продолжается в 35."
  35: "κατέφαγεν πάντα τὸν χόρτον ἐν τῇ γῇ αὐτῶν — 彼らの地の草をすべて食い尽くし (κατεσθίω — «съедать»). τὸν καρπὸν τῆς γῆς αὐτῶν — その地の実を (καρπός — «плод»); повтор κατέφαγεν сохранён."
  36: "ἐπάταξεν πᾶν πρωτότοκον ἐν τῇ γῇ αὐτῶν — 主は彼らの地のすべての初子を打たれた (πρωτότοκος — «первенец»). ἀπαρχὴν παντὸς πόνου αὐτῶν — その労苦の初めを (ἀπαρχή — «начаток»; πόνος — «труд, мука»; ср. Пс 77:51)."
  37: "ἐξήγαγεν αὐτοὺς ἐν ἀργυρίῳ καὶ χρυσίῳ — 主は彼らを銀と金を携えて導き出し (ἀργύριον, χρυσίον — «серебро, золото»; Исх 12:35–36). οὐκ ἦν ἐν ταῖς φυλαῖς αὐτῶν ἀσθενῶν — その部族の中に病む者は一人もいなかった (φυλή — «племя, колено»; ἀσθενέω — «болеть, изнемогать»)."
  38: "εὐφράνθη Αἴγυπτος ἐν τῇ ἐξόδῳ αὐτῶν — エジプトは彼らの出て行くのを喜んだ (ἔξοδος — «исход»). ἐπέπεσεν ὁ φόβος αὐτῶν ἐπ᾿ αὐτούς — 彼らへの恐れがエジプトに落ちた (ἐπιπίπτω — «падать на»; ὁ φόβος αὐτῶν — «страх перед ними»)."
  39: "διεπέτασεν νεφέλην εἰς σκέπην αὐτοῖς — 主は雲を広げて彼らの覆いとし (διαπετάννυμι — «распростирать»; σκέπη — «покров, сень»). πῦρ τοῦ φωτίσαι αὐτοῖς τὴν νύκτα — 火を送って夜を照らされた (φωτίζω — «освещать»); ср. Исх 13:21."
  40: "ᾔτησαν, καὶ ἦλθεν ὀρτυγομήτρα — 彼らが求めると、うずらが来て (αἰτέω — «просить»; ὀρτυγομήτρα — «перепел», собир.). ἄρτον οὐρανοῦ ἐνέπλησεν αὐτούς — 主は天のパンで彼らを満たされた (ἐμπίμπλημι — «насыщать»); ср. Пс 77:24–25."
  41: "διέρρηξεν πέτραν, καὶ ἐρρύησαν ὕδατα — 主が岩を裂かれると水が流れ出で (διαρρήγνυμι — «разрывать»; ῥέω — «течь»). ἐπορεύθησαν ἐν ἀνύδροις ποταμοί — 水のない所に川のように流れた (ἄνυδρος — «безводный»); ср. Пс 104:41 и Числ 20:11."
  42: "ὅτι ἐμνήσθη τοῦ λόγου τοῦ ἁγίου αὐτοῦ — 主はその聖なる言葉を覚えておられたからである (μιμνήσκομαι — «помнить»). τοῦ πρὸς Αβρααμ τὸν δοῦλον αὐτοῦ — その僕アブラハムに語られた (πρός — «к»); ср. Быт 15:13–16."
  43: "ἐξήγαγεν τὸν λαὸν αὐτοῦ ἐν ἀγαλλιάσει — 主はその民を喜び躍らせて導き出し (ἀγαλλίασις — «ликование»). τοὺς ἐκλεκτοὺς αὐτοῦ ἐν εὐφροσύνῃ — その選ばれた者たちを喜びのうちに (εὐφροσύνη — «веселие»); два разных слова сохранены."
  44: "ἔδωκεν αὐτοῖς χώρας ἐθνῶν — 主は彼らに諸国の民の地を与え (χώρα — «страна, область»). πόνους λαῶν ἐκληρονόμησαν — 彼らはもろもろの民の労苦を嗣業として受け継いだ (κληρονομέω — «наследовать»; πόνος — «труд»: возделанное чужими руками)."
  45: "ὅπως ἂν φυλάξωσιν τὰ δικαιώματα αὐτοῦ — それは、彼らが主の定めを守るためであった (ὅπως ἄν — «чтобы»; δικαίωμα — «оправдание, устав»). τὸν νόμον αὐτοῦ ἐκζητήσωσιν — その律法を求めて行う (ἐκζητέω — «ревностно искать, исполнять»; νόμος — 律法)."
