# jp-box, Псалтирь, псалом 104. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..45.
# Псалом 104: призыв славить Господа и помнить чудеса (1–7), завет с Авраамом,
# Исааком и Иаковом (8–11), странствие патриархов под защитой Божией (12–15),
# голод и Иосиф в Египте (16–22), умножение народа и рабство (23–25),
# Моисей и казни египетские (26–36), исход с серебром и золотом (37–41),
# исполнение обетования Аврааму и дарование земли (42–45).
# Красного и синего нет: слова Божии в 11 и 15 — пророчество и история,
# а не евангельская речь Христа.
# Кавычки: слова Бога в ст. 11 и 15 — 「…」 (первый уровень).
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: いなご, 青虫, 雹, あぶ, かえる, うずら, 嗣業 уже в корпусе или понятны.
