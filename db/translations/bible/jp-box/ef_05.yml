chapter: 5
draft: true

verses:
  1: "だから、あなたがたは、愛[あい]する子[こ]として、神[かみ]に倣[なら]う者[もの]となりなさい。"
  2: "そして、キリストがわたしたちを愛[あい]し、わたしたちのためにご自分[じぶん]を、神[かみ]への供[そな]え物[もの]、いけにえとして、香[こう]ばしい香[かお]りとしてお与[あた]えになったように、愛[あい]のうちに歩[あゆ]みなさい。"
  3: "淫[いん]らな行[おこな]い、すべての汚[けが]れ、貪欲[どんよく]は、あなたがたの間[あいだ]では、口[くち]にすることさえしてはならない。聖徒[せいと]たちにふさわしいことだからである。"
  4: "また、みだらな言葉[ことば]、愚[おろ]かな話[はなし]、悪[わる]ふざけも、ふさわしくない。むしろ、感謝[かんしゃ]を述[の]べなさい。"
  5: "というのは、あなたがたは、淫[いん]らな者[もの]、汚[けが]れた者[もの]、貪欲[どんよく]な者[もの]、すなわち偶像[ぐうぞう]崇拝[すうはい]者[しゃ]は、だれも、キリストと神[かみ]の国[くに]において嗣業[しぎょう]を受[う]けないことを、知[し]っているからである。"
  6: "人[ひと]に、空[むな]しい言葉[ことば]でだまされてはならない。これらのことのゆえに、神[かみ]の怒[いか]りは不従順[ふじゅうじゅん]の子[こ]たちの上[うえ]に来[く]るからである。"
  7: "だから、彼[かれ]らの仲間[なかま]となってはならない。"
  8: "というのは、あなたがたは、かつては闇[やみ]であったが、今[いま]は主[しゅ]にあって光[ひかり]だからである。光[ひかり]の子[こ]として歩[あゆ]みなさい。"
  9: "というのは、光[ひかり]の実[み]は、すべての善[ぜん]と義[ぎ]と真理[しんり]のうちにあるからである。"
  10: "主[しゅ]に喜[よろこ]ばれることが何[なに]であるかを見分[みわ]けなさい。"
  11: "また、実[み]を結[むす]ばない闇[やみ]の業[わざ]に加[くわ]わってはならない。むしろ、それを責[せ]めなさい。"
  12: "彼[かれ]らがひそかに行[おこな]っていることは、口[くち]にするのも恥[は]ずべきことだからである。"
  13: "しかし、責[せ]められて明[あき]らかにされるものはすべて、光[ひかり]によって現[あらわ]れになる。"
  14: "というのは、現[あらわ]れになるものはすべて光[ひかり]だからである。それだから、こう言われている。「眠[ねむ]っている者[もの]よ、目[め]を覚[さ]ませ。死者[ししゃ]の中[なか]から起[お]き上[あ]がれ。そうすれば、キリストがあなたを照[て]らしてくださる。」"
  15: "だから、あなたがたは、どのように歩[あゆ]むかを、よくよく見[み]きわめて、愚[おろ]かな者[もの]のようにではなく、知恵[ちえ]ある者[もの]のように歩[あゆ]みなさい。"
  16: "時[とき]を買[か]い取[と]りなさい。日[ひ]が悪[あ]しいからである。"
  17: "だから、愚[おろ]かになってはならない。むしろ、主[しゅ]の御心[みこころ]が何[なに]であるかを悟[さと]りなさい。"
  18: "また、酒[さけ]に酔[よ]ってはならない。そこには放蕩[ほうとう]があるからである。むしろ、霊[れい]に満[み]たされなさい。"
  19: "詩篇[しへん]と賛歌[さんか]と霊[れい]の歌[うた]とをもって互[たが]いに語[かた]り合[あ]い、あなたがたの心[こころ]で主[しゅ]に歌[うた]い、ほめたたえなさい。"
  20: "いつも、すべてのことについて、わたしたちの主[しゅ]イエス・キリストの名[な]によって、神[かみ]であり父[ちち]である方[かた]に感謝[かんしゃ]しなさい。"
  21: "神[かみ]を恐[おそ]れる心[こころ]をもって、互[たが]いに従[したが]いなさい。"
  22: "妻[つま]たちよ、主[しゅ]に対するように、自分[じぶん]の夫[おっと]に従[したが]いなさい。"
  23: "というのは、キリストが教会[きょうかい]の頭[かしら]であるように、夫[おっと]は妻[つま]の頭[かしら]だからである。キリストご自身[じしん]が、体[からだ]の救[すく]い主[ぬし]なのである。"
  24: "しかし、教会[きょうかい]がキリストに従[したが]うように、妻[つま]たちも、すべてのことにおいて夫[おっと]に従[したが]いなさい。"
  25: "夫[おっと]たちよ、キリストが教会[きょうかい]を愛[あい]して教会[きょうかい]のためにご自身[じしん]を渡[わた]されたように、妻[つま]を愛[あい]しなさい。"
  26: "それは、言葉[ことば]によって、水[みず]の洗[あら]いで教会[きょうかい]を清[きよ]め、聖[せい]なるものとするためであり、"
  27: "ご自身[じしん]の前[まえ]に、しみも、しわも、そのようなものも何[なに]もない、栄光[えいこう]ある教会[きょうかい]として立[た]たせるためである。むしろ、教会[きょうかい]が聖[せい]く、傷[きず]のない者[もの]となるためである。"
  28: "そのように、夫[おっと]たちも、自分[じぶん]の体[からだ]を愛[あい]するように、自分[じぶん]の妻[つま]を愛[あい]すべきである。妻[つま]を愛[あい]する者[もの]は、自分[じぶん]自身[じしん]を愛[あい]しているのである。"
  29: "というのは、だれも自分[じぶん]の肉[にく]を憎[にく]んだ者[もの]はいないからである。むしろ、キリストが教会[きょうかい]を養[やしな]い、温[あたた]かくしておられるように、自分[じぶん]の肉[にく]を養[やしな]い、温[あたた]かくするのである。"
  30: "というのは、わたしたちは彼[かれ]の体[からだ]の肢体[したい]だからである。〔それは、彼[かれ]の肉[にく]から、また彼[かれ]の骨[ほね]からである。〕"
  31: "「それゆえに、人[ひと]は父[ちち]と母[はは]を離[はな]れて妻[つま]に結[むす]びつき、二人[ふたり]は一[ひと]つの肉[にく]となる。」"
  32: "この奥義[おうぎ]は大[おお]きい。しかし、わたしはキリストと教会[きょうかい]について言[い]っているのである。"
  33: "しかし、あなたがた一人[ひとり]一人[ひとり]も、自分[じぶん]の妻[つま]を自分[じぶん]自身[じしん]のように愛[あい]しなさい。妻[つま]は夫[おっと]を恐[おそ]れなさい。"

notes:
  1: "γίνεσθε οὖν μιμηταί — だから…倣う者となりなさい. τέκνα ἀγαπητά — 愛する子."
  2: "περιπατεῖτε ἐν ἀγάπῃ — 愛のうちに歩む. παρέδωκεν ἑαυτόν — ご自身をお与えになった. ὀσμὴ εὐωδίας — 香ばしい香り."
  3: "πορνεία, ἀκαθαρσία, πλεονεξία — 淫らな行い・汚れ・貪欲. μηδὲ ὀνομαζέσθω — 口にすることさえしてはならない. πρέπει ἁγίοις — 聖徒にふさわしい."
  4: "αἰσχρότης, μωρολογία, εὐτραπελία — みだらな言葉・愚かな話・悪ふざけ. ἃ οὐκ ἀνῆκεν — ふさわしくない. ἀλλὰ μᾶλλον εὐχαριστία — むしろ感謝."
  5: "τοῦτο γὰρ ἴστε γινώσκοντες — 知っているからである. εἰδωλολάτρης — 偶像崇拝者: 貪欲 назван идолослужением. κληρονομία — 嗣業."
  6: "κενοῖς λόγοις — 空しい言葉. υἱοὶ τῆς ἀπειθείας — 不従順の子."
  7: "συμμέτοχοι — 仲間."
  8: "ἦτε γάρ ποτε σκότος — かつては闇. νῦν δὲ φῶς ἐν κυρίῳ — 今は主にあって光. τέκνα φωτός — 光の子."
  9: "ὁ καρπὸς τοῦ φωτός — 光の実 (по базе; слав., Синод. и TR читают πνεύματος — «плод Духа», jp-joc「神の實」; оставлено по базе ради образа света, ср. 5:8,13–14). ἀγαθωσύνη, δικαιοσύνη, ἀλήθεια — 善・義・真理."
  10: "δοκιμάζοντες — 見分ける. εὐάρεστον τῷ κυρίῳ — 主に喜ばれること."
  11: "ἄκαρπα ἔργα τοῦ σκότους — 実を結ばない闇の業. ἐλέγχετε — 責める."
  12: "κρυφῇ γινόμενα — ひそかに行われること. αἰσχρόν ἐστιν καὶ λέγειν — 口にするのも恥ずべき."
  13: "ἐλεγχόμενα ὑπὸ τοῦ φωτός — 光によって責められて. φανεροῦται — 現れになる."
  14: "πᾶν τὸ φανερούμενον φῶς ἐστιν — 現れになるものはすべて光 (в слав. отнесено к 5:13; деление по базе). Цитата — 「…」 (ср. Ис 60:1). Ἔγειρε ὁ καθεύδων — 眠っている者よ、目を覚ませ."
  15: "βλέπετε οὖν ἀκριβῶς — だから、よくよく見きわめて. ἄσοφοι / σοφοί — 愚かな者 / 知恵ある者."
  16: "ἐξαγοραζόμενοι τὸν καιρόν — 時を買い取る. αἱ ἡμέραι πονηραί — 日が悪い."
  17: "διὰ τοῦτο — だから. ἄφρονες — 愚か. θέλημα τοῦ κυρίου — 主の御心."
  18: "μεθύσκεσθε οἴνῳ — 酒に酔う. ἀσωτία — 放蕩. πληροῦσθε ἐν πνεύματι — 霊に満たされる."
  19: "ψαλμοί, ὕμνοι, ᾠδαὶ πνευματικαί — 詩篇・賛歌・霊の歌. ψάλλοντες — ほめたたえる."
  20: "εὐχαριστοῦντες πάντοτε — いつも感謝. ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ — 主イエス・キリストの名によって. τῷ θεῷ καὶ πατρί — 神であり父である方."
  21: "ὑποτασσόμενοι ἀλλήλοις ἐν φόβῳ Χριστοῦ — 互いに従い合う. В базе Χριστοῦ; церковный текст (слав., Синод., jp-joc「神を畏るゝ心」) читает θεοῦ — 神を恐れる心; замена, без 〔〕."
  22: "αἱ γυναῖκες τοῖς ἰδίοις ἀνδράσιν ὡς τῷ κυρίῳ — 妻たちよ、主に対するように夫に従う (глагол из 5:21)."
  23: "ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας — 夫は妻の頭、キリストが教会の頭であるように. αὐτὸς σωτὴρ τοῦ σώματος — キリストご自身が体の救い主 (отдельное утверждение о Христе, не часть сравнения)."
  24: "ἀλλὰ ὡς ἡ ἐκκλησία — しかし、教会が…ように. ἐν παντί — すべてのことにおいて."
  25: "ἀγαπᾶτε τὰς γυναῖκας — 妻を愛する. ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς — 教会のためにご自身を渡された."
  26: "ἁγιάσῃ καθαρίσας — 清めて聖なるものとする. λουτρὸν τοῦ ὕδατος — 水の洗い. ἐν ῥήματι — 言葉によって."
  27: "παραστήσῃ ἑαυτῷ ἔνδοξον — ご自身の前に栄光ある…として立たせる. σπίλος, ῥυτίς — しみ・しわ. ἀλλ᾽ ἵνα ᾖ ἁγία καὶ ἄμωμος — むしろ、聖く、傷のない者となるため."
  28: "ὀφείλουσιν — すべきである. ὡς τὰ ἑαυτῶν σώματα — 自分の体のように."
  29: "οὐδεὶς γάρ ποτε — というのは、だれも…ないからである. ἐκτρέφει καὶ θάλπει — 養い、温める."
  30: "В базе только μέλη ἐσμὲν τοῦ σώματος αὐτοῦ; церковное ἐκ τῆς σαρκὸς αὐτοῦ καὶ ἐκ τῶν ὀστέων αὐτοῦ (Елизаветинская «от плоти Его и от костей Его», jp-joc「彼の肉よりし、彼の骨よりす」) — в 〔…〕. Проверено по базе: σαρκ- и ὀστέ- — 0."
  31: "Быт 2:24 — 「…」. ἀντὶ τούτου — それゆえに. εἰς σάρκα μίαν — 一つの肉."
  32: "μυστήριον μέγα — 大きな奥義. εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν — キリストと教会について."
  33: "πλήν — しかし. καθ᾽ ἕνα ἕκαστος — 一人一人. φοβῆται τὸν ἄνδρα — 夫を恐れる; требование оставлено без смягчения."
