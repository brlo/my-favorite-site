# jp-box, Послание к Ефесянам, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный 常体, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: подражание Богу и хождение в любви (1–2), тьма и свет (3–14),
# бодрствование и исполнение Духом (15–21), мужья и жёны (22–33).
# Красного и синего нет: прямой речи Христа в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 5:30 — церковное ἐκ τῆς σαρκὸς αὐτοῦ καὶ ἐκ τῶν ὀστέων αὐτοῦ.
# Проверено по базе: σαρκ- и ὀστέ- в 5:30 — 0 вхождений.
# Замены без 〔〕: 5:9 (в базе φωτός, церковный текст πνεύματος) и 5:21
# (в базе Χριστοῦ, церковный текст θεοῦ) — см. notes.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
