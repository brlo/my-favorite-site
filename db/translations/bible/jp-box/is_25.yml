# jp-box, Исаия, глава 25. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы есть (9 стихов), но он следует МТ
# и использован только для сверки церковного словоупотребления; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 25: 1–5 песнь хвалы: древний истинный совет, смиренные города, покров жаждущим;
# 6–8 радость и вино для народов на горе, смерть и слёзы, снятие поношения; 9–12 «вот Бог наш»,
# покой на горе, попрание Моава.
# Прямая речь: песнь/молитва 25:1–5 (одна цитата) и слова народа 25:9.
# Нумерация по gr: 12 стихов; слав. 25:6/7 иначе делит «помажутся миром» (по gr — конец 25:6).
# Слав. 25:9 добавляет «и спасет нас» и «сей Господь, потерпехом его» (в LXX их нет);
# внесено в основной текст без 〔…〕 по паритету.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

tr_code: jp-box
book: is
chapter: 25
draft: true

verses:
  1: "「主[しゅ]よ、わたしの神[かみ]よ。わたしはあなたをほめたたえ、あなたの名[な]を歌[うた]う。あなたは驚[おどろ]くべきことを行[おこな]い、昔[むかし]からの真実[しんじつ]の計画[けいかく]を果[は]たされたからである。そのとおりになるように、主よ。」"
  2: "あなたは町[まち]々を土[つち]の山[やま]とし、堅[かた]い町々を倒[たお]して、その基[もとい]をなくされた。不敬虔[ふけいけん]な者[もの]の町は、永遠[えいえん]に建[た]てられることはない。"
  3: "それゆえ、貧[まず]しい民[たみ]があなたをほめたたえ、虐[しいた]げられた人々[ひとびと]の町[まち]々があなたをほめたたえる。"
  4: "あなたはすべての低[ひく]い町の助[たす]け手[て]となり、乏[とぼ]しさのゆえに気[き]を失[うしな]った者[もの]たちの覆[おお]いとなられた。あなたは彼[かれ]らを悪[わる]い人々から救[すく]い出[だ]す。渇[かわ]く者[もの]の覆い、虐げられた人々の霊[れい]である。"
  5: "彼らは、シオンで渇[かわ]く気[き]弱[よわ]な人々のように、あなたをほめたたえる。あなたが彼らを、わたしを渡[わた]されたあの不敬虔[ふけいけん]な人々から救い出すからである。"
  6: "万軍[ばんぐん]の主[しゅ]はこの山[やま]で、すべての国民[こくみん]に喜[よろこ]びを飲[の]ませ、ぶどう酒[しゅ]を飲ませ、香油[こうゆ]を塗[ぬ]らせる。"
  7: "この山[やま]で、これらすべてを諸国民[しょこくみん]に渡[わた]せ。この計画[けいかく]はすべての国民に対するものだからである。"
  8: "死[し]は力[ちから]を得[え]て呑[の]み込[こ]んだ。主[しゅ]なる神[かみ]はまた、すべての顔[かお]からすべての涙[なみだ]を取[と]り去[さ]り、地[ち]のすべてから民[たみ]の辱[はずかし]めを取り去った。主[しゅ]の口[くち]が語[かた]ったからである。"
  9: "その日[ひ]、人々[ひとびと]は言[い]う。「見[み]よ、わたしたちの神[かみ]はこの方[かた]である。わたしたちはこの方に望[のぞ]みを置[お]き、喜[よろこ]び躍[おど]った。この方はわたしたちを救[すく]われる。この方こそ主[しゅ]であり、わたしたちはこの方を待[ま]ち望[のぞ]んだ。わたしたちはこの方の救[すく]いによって喜び、楽[たの]しむ。」"
  10: "神[かみ]はこの山[やま]で安息[あんそく]を与[あた]える。モアブの地[ち]は踏[ふ]みにじられ、車[くるま]で脱穀場[だっこくじょう]を踏[ふ]むように踏みにじられる。"
  11: "彼[かれ]は手[て]を上[あ]げる。それは、彼が滅[ほろ]ぼすために自[みずか]らを低[ひく]くしたときと同じである。神[かみ]は彼の高[たか]ぶりを、彼が手を置[お]いたものの上[うえ]で低くされる。"
  12: "あなたの城壁[じょうへき]の避[ひ]け所[ところ]の高[たか]さを低[ひく]くし、それは地面[じめん]まで下[くだ]る。"

notes:
  1: "Κύριε ὁ θεός μου, δοξάσω σε, ὑμνήσω τὸ ὄνομά σου — «Господи Боже мой, прославлю Тебя, воспою имя Твоё»; слав. «Господи Боже мой, прославлю тя, воспою имя твое». ὅτι ἐποίησας θαυμαστὰ πράγματα — «ибо Ты сотворил дивные дела» (θαυμαστός — дивный); βουλὴν ἀρχαίαν ἀληθινήν — «совет древний истинный» (βουλή — совет, замысел). γένοιτο, κύριε — оптатив «да будет, Господи»; ru/МТ передают «аминь», слав. «да будет, Господи». Песнь открывается здесь и длится до конца 25:5."
  2: "ἔθηκας πόλεις εἰς χῶμα — «Ты обратил города в прах/насыпь» (χῶμα — земляная насыпь); πόλεις ὀχυρὰς τοῦ πεσεῖν αὐτῶν τὰ θεμέλια — «города крепкие, так что пали основания их» (θεμέλια — основания). τῶν ἀσεβῶν πόλις εἰς τὸν αἰῶνα οὐ μὴ οἰκοδομηθῇ — «город нечестивых в век не будет построен» (οἰκοδομέω)."
  3: "εὐλογήσει σε ὁ λαὸς ὁ πτωχός — «благословит Тебя народ нищий» (πτωχός — нищий, бедный); πόλεις ἀνθρώπων ἀδικουμένων — «города людей обижаемых» (ἀδικέω — обижать, поступать несправедливо). Это чтение LXX и слав. («людие нищии… гради человеков обидимых»); ru/МТ дают противоположное — «народы сильные, города страшных племён», — в текст не внесено."
  4: "ἐγένου πάσῃ πόλει ταπεινῇ βοηθός — «Ты был всякому городу смиренному помощник» (ταπεινός — низкий, смиренный; βοηθός — помощник); τοῖς ἀθυμήσασιν διὰ ἔνδειαν σκέπη — «упавшим духом из-за нужды покров» (ἀθυμέω — падать духом; ἔνδεια — нужда, недостаток; σκέπη — покров, защита). ἀπὸ ἀνθρώπων πονηρῶν ῥύσῃ αὐτούς — «от людей злых избавишь их» (ῥύομαι — избавлять); σκέπη διψώντων καὶ πνεῦμα ἀνθρώπων ἀδικουμένων — «покров жаждущих и дух людей обижаемых». ru/МТ дают совсем иной образ (буря, зной, тень облака), это чтение МТ."
  5: "εὐλογήσουσίν σε ὡς ἄνθρωποι ὀλιγόψυχοι — «благословят Тебя, как малодушные люди» (ὀλιγόψυχος — малодушный, слабый духом); διψῶντες ἐν Σιων — «жаждущие в Сионе»; ἀπὸ ἀνθρώπων ἀσεβῶν, οἷς ἡμᾶς παρέδωκας — «от людей нечестивых, которым Ты предал нас» (παραδίδωμι). Слав. добавляет «яко избавиши их» («ибо Ты избавишь их»), чего в LXX нет; внесено в текст без 〔…〕."
  6: "ποιήσει κύριος σαβαωθ πᾶσι τοῖς ἔθνεσιν ἐπὶ τὸ ὄρος τοῦτο — «сделает Господь Саваоф всем народам на горе сей»; πίονται εὐφροσύνην — «будут пить радость» (πίνω — пить); πίονται οἶνον — «будут пить вино»; χρίσονται μύρον — «помажутся миром» (μύρον — благовонное масло, миро). LXX не говорит о «трапезе из тучных яств» (это МТ и ru); образ «пить радость» сохранён."
  7: "ἐν τῷ ὄρει τούτῳ παράδος ταῦτα πάντα τοῖς ἔθνεσιν — «на этой горе предай всё это народам» (παραδίδωμι — передавать); ἡ γὰρ βουλὴ αὕτη ἐπὶ πάντα τὰ ἔθνη — «ибо этот совет на все народы». Слав. 25:6/7 иначе делит стих: «помажутся миром на горе сей» у него начинает 25:7, по gr это конец 25:6."
  8: "κατέπιεν ὁ θάνατος ἰσχύσας — «смерть, одолев, поглотила» (καταπίνω — поглощать, проглатывать; ἰσχύω — быть сильным, одолевать): в LXX и слав. («пожре смерть возмогши») подлежащее — смерть, и это чтение держим, хотя оно звучит резко. καὶ πάλιν ἀφεῖλεν ὁ θεὸς πᾶν δάκρυον ἀπὸ παντὸς προσώπου — «и снова отнял Бог всякую слезу от всякого лица» (ἀφαιρέω — отнимать). τὸ ὄνειδος τοῦ λαοῦ ἀφεῖλεν ἀπὸ πάσης τῆς γῆς — «поношение народа отнял от всей земли»; слав. называет действующего «Господь Бог» (в LXX ὁ θεός — «Бог»), взято csl; τὸ γὰρ στόμα κυρίου ἐλάλησεν — «ибо уста Господни сказали». МТ/Син. читают пассивно «поглощена смерть навеки», а 1 Кор 15:54 цитирует «κατεπόθη ὁ θάνατος εἰς νῖκος» («смерть поглощена в победу»); jp-joc следует МТ. Здесь сознательно держим LXX/слав., расхождение важное."
  9: "Ἰδοὺ ὁ θεὸς ἡμῶν, ἐφ᾽ ᾧ ἠλπίζομεν καὶ ἠγαλλιώμεθα — «вот Бог наш, на Кого мы надеялись и радовались» (ἐλπίζω, ἀγαλλιάω); καὶ εὐφρανθησόμεθα ἐπὶ τῇ σωτηρίᾳ ἡμῶν — «и возрадуемся о спасении нашем» (σωτηρία). Слав. добавляет «и спасет нас» и «сей Господь, потерпехом его» («Он — Господь, Его мы терпели/ждали»), чего в LXX нет; по паритету внесено в текст без 〔…〕. Слова народа в 「…」."
  10: "ἀνάπαυσιν δώσει ὁ θεὸς ἐπὶ τὸ ὄρος τοῦτο — «покой даст Бог на горе сей» (ἀνάπαυσις); καταπατηθήσεται ἡ Μωαβῖτις — «будет попрана Моавитида», т. е. земля Моава (Μωαβῖτις); ὃν τρόπον πατοῦσιν ἅλωνα ἐν ἁμάξαις — «как топчут гумно колесницами» (ἅλων — ток, гумно; ἅμαξα — повозка). ru/МТ говорят «рука Господа почиет», в LXX — «покой даст»."
  11: "ἀνήσει τὰς χεῖρας αὐτοῦ — «поднимет руки свои» (ἀνίημι — поднимать, отпускать); ὃν τρόπον καὶ αὐτὸς ἐταπείνωσεν τοῦ ἀπολέσαι — «как и сам он смирил, чтобы погубить»: оборот тёмный, возможно «как сам он был смирен»; слав. «якоже и той смири, еже погубити». ταπεινώσει τὴν ὕβριν αὐτοῦ ἐφ᾽ ἃ τὰς χεῖρας ἐπέβαλεν — «смирит гордость его на то, на что он наложил руки» (ἐπιβάλλω — налагать); «ἐφ᾽ ἅ» — «на что». Подлежащее «он» — Моав, подлежащее «смирит» — Бог (в тексте назван)."
  12: "τὸ ὕψος τῆς καταφυγῆς τοῦ τοίχου σου — «высоту убежища стены твоей» (καταφυγή — убежище, прибежище); ταπεινώσει — «смирит, низложит»; καταβήσεται ἕως τοῦ ἐδάφους — «сойдёт до земли, до пола» (ἔδαφος — основание, пол, земля). Слав. «и высоту убежища ограды твоея смирит, и обнизится даже до земли»."
