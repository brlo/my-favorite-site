verses:
  1: "これが人[ひと]の系図[けいず]の書[しょ]である。神[かみ]がアダムを造[つく]られた日[ひ]、神[かみ]は彼[かれ]をご自分[じぶん]の像[かたち]に造[つく]られた。"
  2: "男[おとこ]と女[おんな]に造[つく]り、彼[かれ]らを祝福[しゅくふく]された。彼[かれ]らを造[つく]られた日[ひ]に、彼[かれ]らの名[な]をアダムと名[な]づけられた。"
  3: "アダムは二百三十歳[さい]まで生[い]き、その姿[すがた]とその像[かたち]に似[に]せて子[こ]を生[う]み、その名[な]をセツと名[な]づけた。"
  4: "セツを生[う]んだ後[のち]、アダムの日々[ひび]は七百年[ねん]あった。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  5: "アダムの一生[いっしょう]は九百三十年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  6: "セツは二百五歳[さい]まで生[い]き、エノシュを生[う]んだ。"
  7: "エノシュを生[う]んだ後[のち]、セツは七百七年[ねん]生[い]きた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  8: "セツの一生[いっしょう]は九百十二年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  9: "エノシュは百九十歳[さい]まで生[い]き、ケナンを生[う]んだ。"
  10: "ケナンを生[う]んだ後[のち]、エノシュは七百十五年[ねん]生[い]きた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  11: "エノシュの一生[いっしょう]は九百五年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  12: "ケナンは百七十歳[さい]まで生[い]き、マハラレルを生[う]んだ。"
  13: "マハラレルを生[う]んだ後[のち]、ケナンは七百四十年[ねん]生[い]きた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  14: "ケナンの一生[いっしょう]は九百十年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  15: "マハラレルは百六十五歳[さい]まで生[い]き、イエレドを生[う]んだ。"
  16: "イエレドを生[う]んだ後[のち]、マハラレルは七百三十年[ねん]生[い]きた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  17: "マハラレルの一生[いっしょう]は八百九十五年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  18: "イエレドは百六十二歳[さい]まで生[い]き、エノクを生[う]んだ。"
  19: "エノクを生[う]んだ後[のち]、イエレドは八百年[ねん]生[い]きた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  20: "イエレドの一生[いっしょう]は九百六十二年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  21: "エノクは百六十五歳[さい]まで生[い]き、メトシェラを生[う]んだ。"
  22: "メトシェラを生[う]んだ後[のち]、エノクは二百年[ねん]の間[あいだ]、神[かみ]に喜[よろこ]ばれた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  23: "エノクの一生[いっしょう]は三百六十五年[ねん]であった。"
  24: "エノクは神[かみ]に喜[よろこ]ばれ、見[み]えなくなった。神[かみ]が彼[かれ]を移[うつ]されたからである。"
  25: "メトシェラは百六十七歳[さい]まで生[い]き、レメクを生[う]んだ。"
  26: "レメクを生[う]んだ後[のち]、メトシェラは八百二年[ねん]生[い]きた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  27: "メトシェラの一生[いっしょう]は九百六十九年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  28: "レメクは百八十八歳[さい]まで生[い]き、子[こ]を生[う]んだ。"
  29: "その名[な]をノアと名[な]づけて言[い]った。「この者[もの]は、わたしたちの業[わざ]と、わたしたちの手[て]の苦[くる]しみと、主[しゅ]なる神[かみ]が呪[のろ]われた地[ち]とから、わたしたちを休[やす]ませてくれるだろう。」"
  30: "ノアを生[う]んだ後[のち]、レメクは五百六十五年[ねん]生[い]きた。彼[かれ]は息子[むすこ]たちと娘[むすめ]たちを生[う]んだ。"
  31: "レメクの一生[いっしょう]は七百五十三年[ねん]であった。そして、彼[かれ]は死[し]んだ。"
  32: "ノアは五百歳[さい]であった。ノアは三人[さんにん]の息子[むすこ]、セム、ハム、ヤフェトを生[う]んだ。"

notes:
  1: "βίβλος γενέσεως ἀνθρώπων — 人の系図の書 (γένεσις — «происхождение, родословие»). κατ᾿ εἰκόνα θεοῦ — 神の像に."
  2: "ἄρσεν καὶ θῆλυ — 男と女. ἐπωνόμασεν τὸ ὄνομα αὐτῶν Αδαμ — 彼らの名をアダムと名づけられた (LXX мн. ч.; слав. ед. ч. «ему»)."
  3: "ἔζησεν… διακόσια καὶ τριάκοντα ἔτη — 二百三十歳まで生きた (LXX; масоретский/Син. — 130). κατὰ τὴν ἰδέαν αὐτοῦ καὶ κατὰ τὴν εἰκόνα αὐτοῦ — その姿とその像に似せて (ἰδέα — «вид»). Σηθ — セツ."
  4: "αἱ ἡμέραι Αδαμ μετὰ τὸ γεννῆσαι… ἑπτακόσια ἔτη — セツを生んだ後のアダムの日々は七百年 (LXX; Син. — 800). υἱοὺς καὶ θυγατέρας — 息子たちと娘たち."
  5: "ἐννακόσια καὶ τριάκοντα ἔτη — 九百三十年 (LXX и масоретский совпадают). ἀπέθανεν — 死んだ."
  6: "Ἔζησεν δὲ Σηθ διακόσια καὶ πέντε ἔτη — セツは二百五歳 (LXX; Син. — 105). Ενως — エノシュ."
  7: "ἑπτακόσια καὶ ἑπτὰ ἔτη — 七百年と七年, т. е. 707 (LXX; Син. — 807). μετὰ τὸ γεννῆσαι — 生んだ後."
  8: "ἐννακόσια καὶ δώδεκα ἔτη — 九百十二年."
  9: "ἑκατὸν ἐνενήκοντα ἔτη — 百九十歳 (LXX; Син. — 90). Καιναν — ケナン."
  10: "ἑπτακόσια καὶ δέκα πέντε ἔτη — 七百十五年 (LXX; Син. — 815)."
  11: "ἐννακόσια καὶ πέντε ἔτη — 九百五年."
  12: "ἑκατὸν ἑβδομήκοντα ἔτη — 百七十歳 (LXX; Син. — 70). Μαλελεηλ — マハラレル."
  13: "ἑπτακόσια καὶ τεσσαράκοντα ἔτη — 七百四十年 (LXX; Син. — 840)."
  14: "ἐννακόσια καὶ δέκα ἔτη — 九百十年."
  15: "ἑκατὸν καὶ ἑξήκοντα πέντε ἔτη — 百六十五歳 (LXX; Син. — 65). Ιαρεδ — イエレド."
  16: "ἑπτακόσια καὶ τριάκοντα ἔτη — 七百三十年 (LXX; Син. — 830)."
  17: "ὀκτακόσια καὶ ἐνενήκοντα πέντε ἔτη — 八百九十五年."
  18: "ἑκατὸν καὶ ἑξήκοντα δύο ἔτη — 百六十二歳 (LXX и масоретский совпадают). Ενωχ — エノク."
  19: "ὀκτακόσια ἔτη — 八百年."
  20: "ἐννακόσια καὶ ἑξήκοντα δύο ἔτη — 九百六十二年."
  21: "ἑκατὸν καὶ ἑξήκοντα πέντε ἔτη — 百六十五歳 (LXX; Син. — 65). Μαθουσαλα — メトシェラ."
  22: "εὐηρέστησεν δὲ Ενωχ τῷ θεῷ — エノクは神に喜ばれた (LXX вместо «жил»; слав. «угоди», Син. «ходил пред Богом» — с евр.). διακόσια ἔτη — 二百年 (LXX; Син. — 300)."
  23: "τριακόσια ἑξήκοντα πέντε ἔτη — 三百六十五年."
  24: "οὐχ ηὑρίσκετο — 見えなくなった (εὑρίσκω). μετέθηκεν αὐτὸν ὁ θεός — 神が彼を移された (μετατίθημι; слав. «преложи»)."
  25: "ἑκατὸν καὶ ἑξήκοντα ἑπτὰ ἔτη — 百六十七歳 (LXX; слав. и Син. — 187). Λαμεχ — レメク. jp-joc для 5:25–31 отсутствует."
  26: "ὀκτακόσια δύο ἔτη — 八百二年 (LXX; слав. и Син. — 782)."
  27: "ἐννακόσια καὶ ἑξήκοντα ἐννέα ἔτη — 九百六十九年."
  28: "ἑκατὸν ὀγδοήκοντα ὀκτὼ ἔτη — 百八十八歳 (LXX; Син. — 182). υἱόν — 子."
  29: "Νωε — ノア (jp-joc ノイ). διαναπαύσει ἡμᾶς — わたしたちを休ませてくれる (διαναπαύω). ἀπὸ τῶν λυπῶν τῶν χειρῶν ἡμῶν — 手の苦しみから (λύπη — «печаль, труд»). ἧς κατηράσατο κύριος ὁ θεός — 主なる神が呪われた地."
  30: "πεντακόσια καὶ ἑξήκοντα πέντε ἔτη — 五百六十五年 (LXX; Син. — 595)."
  31: "ἑπτακόσια καὶ πεντήκοντα τρία ἔτη — 七百五十三年 (LXX; Син. — 777)."
  32: "ἦν Νωε ἐτῶν πεντακοσίων — ノアは五百歳. Σημ, Χαμ, Ιαφεθ — セム、ハム、ヤフェト."
