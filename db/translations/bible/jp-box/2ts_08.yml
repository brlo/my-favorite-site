# jp-box, 2-я Царств, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); по новому паритету церковнославянский (csl-ru) —
# второй свидетель церковного текста: его чтения и добавления входят в основной
# текст без 〔…〕, отличия LXX — в notes. ru (Синодальный) — только для понимания.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: победы Давида: филистимляне (1), Моав (2), Адраазар и Сирия (3–8),
# Фой и посвящение добычи (9–12), имя Давида и Едом (13–14), чиновники (15–18).
# Прямой речи нет, всё повествование. Красного нет.
# 〔…〕 нет: csl-чтения и добавления (8:2 «два ужа на оживление», 8:7 вторая
# половина о Сусакиме) в основном тексте; 8:8 — греч. Μασβακ, в csl «Метевак»
# (см. notes).
# Сносок ⟨…⟩ нет: ペリシテ人, シリア人, エドム人, モアブ人, アンモン人, 戦車,
# 騎兵, 青銅, 祭司 уже в корпусе.
# Отличия LXX/csl: 8:1 ἀφωρισμένην — «отлучённое» (в ru «Мефег-Гаамма» по МТ);
# 8:4 в LXX/csl 1000 колесниц и 7000 всадников, в ru 1700 всадников (МТ);
# 8:8 Μασβακ, в csl «Метевак»; 8:13 Γαιμελε, в csl «Гевелем», в ru «долина
# Соленая» (МТ); 8:13 в ru «Сирийцев», в LXX/csl — Едом. jp-ni не использовался.

tr_code: jp-box
book: 2ts
chapter: 8
draft: true

verses:
  1: "その後[のち]、ダビデはペリシテ人[じん]を撃[う]って従[したが]え、ペリシテ人の手[て]から、取[と]り分[わ]けられたもの[もの]を取った。"
  2: "ダビデはモアブを撃[う]ち、彼[かれ]らを地面[じめん]に寝[ね]かせて縄[なわ]で測[はか]った。二本[にほん]の縄は殺[ころ]すため、二本の縄は生[い]かすためであった。モアブはダビデのしもべとなり、貢[みつ]ぎ物[もの]を納[おさ]めた。"
  3: "ダビデは、ユーフラテス川[がわ]に手[て]を及[およ]ぼそうと出[で]て行[い]くロオブの子[こ]、スバの王[おう]アドラアザルを撃[う]った。"
  4: "ダビデは彼[かれ]から戦車[せんしゃ]一千[いっせん]、騎兵[きへい]七千[ななせん]、歩兵[ほへい]二万[にまん]を取[と]り、すべての戦車を壊[こわ]して、そのうち百[ひゃく]の戦車だけを残[のこ]した。"
  5: "ダマスコのシリア人[じん]が、スバの王[おう]アドラアザルを助[たす]けに来[き]た。ダビデはシリア人の二万二千人[にまんにせんにん]を撃[う]った。"
  6: "ダビデはダマスコ方面[ほうめん]のシリアに守備隊[しゅびたい]を置[お]き、シリア人[じん]はダビデのしもべとなって貢[みつ]ぎ物[もの]を納[おさ]めた。主[しゅ]はダビデが行[い]くすべての所[ところ]で彼[かれ]を救[すく]われた。"
  7: "ダビデは、スバの王[おう]アドラアザルの若者[わかもの]たちが着[き]けていた金[きん]の腕輪[うでわ]を取[と]ってエルサレムに持[も]って来[き]た。のちに、エジプトの王シシャクが、ソロモンの子[こ]レハブアムの時代[じだい]にエルサレムへ上[のぼ]ったとき、それらを取った。"
  8: "ダビデ王[おう]はまた、アドラアザルの選[えら]ばれた町々[まちまち]のうち、マスバクから、非常[ひじょう]に多[おお]くの青銅[せいどう]を取[と]った。ソロモンはそれで青銅の海[うみ]、柱[はしら]、洗[あら]い盤[ばん]、およびすべての器[うつわ]を作[つく]った。"
  9: "ハマトの王[おう]トイは、ダビデがアドラアザルのすべての軍勢[ぐんぜい]を撃[う]ったことを聞[き]いた。"
  10: "トイは息子[むすこ]イェドゥランをダビデ王[おう]のもとへ遣[つか]わし、彼[かれ]の安否[あんぴ]を問[と]わせ、アドラアザルと戦[たたか]って彼を撃[う]ったことを祝[いわ]わせた。アドラアザルはトイと敵対[てきたい]していたからである。イェドゥランの手[て]には銀[ぎん]の器[うつわ]、金[きん]の器、青銅[せいどう]の器があった。"
  11: "ダビデ王[おう]はこれらを、彼[かれ]が征服[せいふく]したすべての町々[まちまち]から取[と]って聖別[せいべつ]した銀[ぎん]や金[きん]とともに、主[しゅ]に聖別した。"
  12: "これらは、エドムから、モアブの地[ち]から、アンモン人[じん]から、ペリシテ人[じん]から、アマレクから、またスバの王[おう]ロオブの子[こ]アドラアザルの戦利品[せんりひん]から取[と]ったものである。"
  13: "ダビデは名[な]を上[あ]げた。彼[かれ]が帰[かえ]って来[き]たとき、ガイメレでエドム人[じん]一万八千人[いちまんはっせんにん]を撃[う]って倒[たお]した。"
  14: "彼[かれ]はエドムに、エドム全土[ぜんど]に守備隊[しゅびたい]を置[お]き、エドム人[じん]はすべて王[おう]のしもべとなった。主[しゅ]はダビデが行[い]くすべての所[ところ]で彼を救[すく]われた。"
  15: "ダビデはイスラエルを治[おさ]め、民[たみ]すべてに対して裁[さば]きと正義[せいぎ]を行[おこな]った。"
  16: "サルヤの子[こ]ヨアブは軍勢[ぐんぜい]の長[ちょう]、アヒルドの子ヨシャファトは記録係[きろくがかり]、"
  17: "アヒトブの子[こ]サドクとアビアタルの子アヒメレクは祭司[さいし]、アサは書記[しょき]、"
  18: "ヨヤダの子[こ]ベナヤは顧問[こもん]、ケレテ人[じん]とペレテ人[じん]もいた。ダビデの子たちは廷臣[ていしん]であった。"

notes:
  1: "μετὰ ταῦτα — после сего. ἐπάταξεν — поразил. ἐτροπώσατο — обратил в бегство, победил (τροπόω). τὴν ἀφωρισμένην — «отлучённое, отделённое» (ἀφορίζω); в csl «отлученное», в ru «Мефег-Гаамма» — топоним по МТ, в LXX и csl он передан нарицательным словом; вероятно, речь о городе (ср. 1 Пар 18:1, где назван Геф). ἐκ χειρὸς τῶν ἀλλοφύλων — из руки иноплеменников (ペリシテ人)."
  2: "διεμέτρησεν αὐτοὺς ἐν σχοινίοις — размерял их верёвками. κοιμίσας … ἐπὶ τὴν γῆν — положив их на землю. τὰ δύο σχοινίσματα τοῦ θανατῶσαι — две верёвки на умерщвление. τὰ δύο σχοινίσματα ἐζώγρησεν — две верёвки оставил живыми (ζωγρέω — брать живым); в LXX и csl «два и два», в ru и МТ «две на смерть и одну на жизнь». φέροντας ξένια — приносящих дары, дань (ξένια; слав. «дающа дань»)."
  3: "Αδρααζαρ υἱὸν Ρααβ βασιλέα Σουβα — Адраазар, сын Раава, царь Сувский (アドラアザル, ロオブ, スバ). πορευομένου αὐτοῦ — когда он шёл. ἐπιστῆσαι τὴν χεῖρα αὐτοῦ ἐπὶ τὸν ποταμὸν Εὐφράτην — «поставить руку свою на реку Евфрат», т. е. утвердить власть."
  4: "προκατελάβετο — «предвзял», захватил (προκαταλαμβάνω). χίλια ἅρματα — тысяча колесниц. ἑπτὰ χιλιάδας ἱππέων — семь тысяч всадников. εἴκοσι χιλιάδας ἀνδρῶν πεζῶν — двадцать тысяч пеших. παρέλυσεν — «расслабил, парализовал» (παραλύω); слав. «разруши», в ru «подрезал жилы» — по МТ. ὑπελίπετο — оставил (ὑπολείπω). В ru «тысячу семьсот всадников» — по МТ, в LXX и csl 1000 колесниц и 7000 всадников."
  5: "Συρία Δαμασκοῦ — Сирия Дамасская (ダマスコのシリア). βοηθῆσαι — помочь. ἐπάταξεν ἐν τῷ Σύρῳ — поразил Сирийца (собирательно). εἴκοσι δύο χιλιάδας — двадцать две тысячи."
  6: "ἔθετο φρουράν — поставил стражу, гарнизон (φρουρά). κατὰ Δαμασκόν — что при Дамаске. εἰς δούλους φέροντας ξένια — в рабов, приносящих дары. ἔσωσεν — спас, сохранил."
  7: "χλιδῶνας τοὺς χρυσοῦς — золотые обручи, украшения (χλιδών; слав. «гривны»). ἐπὶ τῶν παίδων — на отроках, слугах. ἤνεγκεν αὐτὰ εἰς Ιερουσαλημ — принёс их в Иерусалим. καὶ ἔλαβεν αὐτὰ Σουσακιμ — и взял их Сусаким (シシャク). ἐν ἡμέραις Ροβοαμ — во дни Ровоама (レハブアム). Вторая половина стиха есть в LXX и csl; в ru она опущена."
  8: "ἐκ τῆς Μασβακ — из Машбака (マスバク); в csl «Метевак» — иное написание. ἐκ τῶν ἐκλεκτῶν πόλεων — из избранных городов. χαλκὸν πολὺν σφόδρα — меди весьма много. θάλασσαν τὴν χαλκῆν — медное море, большой водоём (青銅の海). στύλους — столпы. λουτῆρας — умывальницы (洗い盤). σκεύη — сосуды, утварь."
  9: "Θοου ὁ βασιλεὺς Ημαθ — Фой, царь Имафа (トイ, ハマト; в csl «Фоа»). πᾶσαν τὴν δύναμιν — всё войско, силу."
  10: "ἀπέστειλεν … Ιεδδουραν τὸν υἱὸν αὐτοῦ — послал Иеддурана, сына своего (イェドゥラン; в csl «Иеддурам», в ru «Иорам»). ἐρωτῆσαι τὰ εἰς εἰρήνην — спросить о мире, приветствовать. εὐλογῆσαι — благословить, здесь поздравить, поблагодарить. ἀντικείμενος ἦν — был противником, воевал. σκεύη ἀργυρᾶ … χρυσᾶ … χαλκᾶ — сосуды серебряные, золотые, медные."
  11: "ἡγίασεν — освятил, посвятил (ἁγιάζω). μετὰ τοῦ ἀργυρίου καὶ μετὰ τοῦ χρυσίου — вместе с серебром и золотом. ἐκ πασῶν τῶν πόλεων, ὧν κατεδυνάστευσεν — из всех городов, которыми овладел (καταδυναστεύω)."
  12: "ἐκ τῆς Ιδουμαίας — из Идумеи (エドム). ἐκ τῶν υἱῶν Αμμων — из сынов Аммона (アンモン人). ἐξ Αμαληκ — из Амалика. ἐκ τῶν σκύλων — из добычи, трофеев (σκῦλα). υἱοῦ Ρααβ βασιλέως Σουβα — сына Раава, царя Сувского."
  13: "ἐποίησεν … ὄνομα — сделал себе имя, прославился. ἐν τῷ ἀνακάμπτειν αὐτόν — когда он возвращался. ἐν Γαιμελε — в Гаимеле (ガイメレ; в csl «в Гевелеме» — иное написание, в ru «в долине Соленой» — по МТ). εἰς ὀκτωκαίδεκα χιλιάδας — до восемнадцати тысяч. В ru «Сирийцев» — по МТ; в LXX и csl речь об Эдоме."
  14: "ἔθετο … φρουράν — поставил гарнизон. ἐν πάσῃ τῇ Ιδουμαίᾳ — во всей Идумее. ἐγένοντο … δοῦλοι τῷ βασιλεῖ — стали рабами царю. ἔσωσεν κύριος — спас Господь."
  15: "ἐβασίλευσεν — царствовал. ποιῶν κρίμα καὶ δικαιοσύνην — творя суд и правду. ἐπὶ πάντα τὸν λαὸν αὐτοῦ — над всем народом своим."
  16: "Ιωαβ υἱὸς Σαρουιας — Иоав, сын Саруи (サルヤ). ἐπὶ τῆς στρατιᾶς — над войском. Ιωσαφατ υἱὸς Αχια — Иосафат, сын Ахии; в csl «сын Ахилудов» (アヒルド) — по МТ. ἐπὶ τῶν ὑπομνημάτων — над памятописаниями, т. е. дееписатель, 記録係."
  17: "Σαδδουκ υἱὸς Αχιτωβ — Садок, сын Ахитова. Αχιμελεχ υἱὸς Αβιαθαρ — Ахимелех, сын Авиафара. ἱερεῖς — священники. Ασα ὁ γραμματεύς — Аса, книжник (アサ); в csl «Саса», в ru «Сераия» — по МТ."
  18: "Βαναιας υἱὸς Ιωδαε — Ванея, сын Иодая (ベナヤ, ヨヤダ). σύμβουλος — советник. ὁ χελεθθι καὶ ὁ φελεττι — Хелефей и Фелефей, т. е. керетеи и пелетеи (ケレテ人とペレテ人). υἱοὶ Δαυιδ αὐλάρχαι — сыны Давида, начальники двора (αὐλάρχης; слав. «началницы двора»), 廷臣."
