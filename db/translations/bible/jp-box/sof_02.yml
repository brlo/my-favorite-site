# jp-box, Софония, глава 2. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной: наш 2:1–15 = gr 2:1–15 и csl 2:1–15, стих в стих.
# В книге 53 стиха (1: 18, 2: 15, 3: 20).
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 «соберитесь», прежде чем наступит определение; 3 «взыщите
# Господа, все смиренные земли»; 4–7 филистимляне: Газа, Аскалон, Азот, Аккарон,
# «Крит — пажить стад», остаток дома Иуды; 8–10 Моав и Аммон, «живу Я»;
# 11–12 все боги народов падут, Ефиопляне; 13–15 Ассур и Ниневия, город
# «я, и нет иного кроме меня».
# Голоса: 1–3 — речь пророка; 4–8 — речь пророка; 9–15 — слово Господа в 「…»
# (в 9 формула «живу Я, говорит Господь сил, Бог Израилев» внутри речи);
# 15 слова города — 『…』 внутри слова Господа.
# 2:2: слав. добавляет «в день» («якоже цвету мимоходящу в день») — внесено.
# 2:3: слав. в скобках «взыщите кротости» — нет в LXX, включено как церковное
# чтение (柔和を求め), оговорено.
# 2:5: σχοίνισμα — «землемерная верёвка, участок», отсюда 海辺の地; ἀλλόφυλοι —
# ペリシテ人 по корпусу.
# 2:9: LXX/слав. добавляют Дамаск («оставлен как стог гумна»), в МТ его нет;
# держим церковное чтение.
# 2:10: LXX «на Господа Вседержителя», слав. «на люди Господа Вседержителя»;
# в тексте по слав. (全能者である主の民).
# 2:14: χαμαιλέοντες καὶ ἐχῖνοι — «хамелеоны и ежи»; в ru/МТ «пеликан и еж» —
# иное чтение, не внесено; κόρακες — «вороны» (в ru «разрушение» — по МТ).
#
