verses:
  1: "集[あつ]まれ、結[むす]ばれよ、恥[は]じを知[し]らない民[たみ]よ。"
  2: "定[さだ]めが来[く]る前[まえ]に、あなたがたが日[ひ]のうちに過[す]ぎ去[さ]る花[はな]のようになる前[まえ]に、主[しゅ]の怒[いか]りがあなたがたに臨[のぞ]む前[まえ]に、主[しゅ]の激[はげ]しい怒[いか]りの日[ひ]があなたがたに臨[のぞ]む前[まえ]に。"
  3: "主[しゅ]を求[もと]めよ。地[ち]のすべてのへりくだる者[もの]たちよ、裁[さば]きを行[おこな]い、義[ぎ]を求[もと]め、柔和[にゅうわ]を求[もと]め、それに応[こた]えよ。そうすれば、主[しゅ]の怒[いか]りの日[ひ]にあなたがたは覆[おお]われる。"
  4: "ガザは荒[あ]らされ、アシュケロンは滅[ほろ]びに帰[き]し、アシュドドは真昼[まひる]に追[お]い払[はら]われ、エクロンは根[ね]こそぎにされる。"
  5: "海辺[うみべ]の地[ち]に住[す]む者[もの]たち、クレタ人[じん]の移[い]住[じゅう]者[しゃ]たちよ、わざわいだ。主[しゅ]の言葉[ことば]はあなたがたに臨[のぞ]む。カナン、ペリシテ人[じん]の地[ち]よ、わたしはあなたがたをその住[す]みかから滅[ほろ]ぼす。"
  6: "クレタは牧[まき]場[ば]となり、羊[ひつじ]の囲[かこ]いとなる。"
  7: "海辺[うみべ]の地[ち]はユダの家[いえ]の残[のこ]りの者[もの]のものとなる。彼らはそこに住[す]み、夕[ゆう]べにはアシュケロンの家[いえ]々[いえ]で休[やす]む。彼らの神[かみ]である主[しゅ]が彼らを顧[かえり]み、その捕囚[ほしゅう]を返[かえ]されるからである。"
  8: "わたしはモアブのあざけりと、アンモンの子[こ]らの中傷[ちゅうしょう]を聞[き]いた。彼らはわたしの民[たみ]をあざけり、わたしの境[さかい]を誇[ほこ]った。"
  9: "それゆえ、イスラエルの神[かみ]である万軍[ばんぐん]の主[しゅ]は言[い]われる。「わたしは生[い]きている。モアブはソドムのようになり、アンモンの子[こ]らはゴモラのようになる。ダマスコは打[う]ち場[ば]の藁[わら]の山[やま]のように捨[す]てられ、永遠[えいえん]に滅[ほろ]ぼされる。わたしの民[たみ]の残[のこ]りは彼らを奪[うば]い、わたしの国[くに]の残[のこ]りは彼らを嗣業[しぎょう]とする。"
  10: "これは彼らの傲慢[ごうまん]への報[むく]いである。彼らは全能者[ぜんのうしゃ]である主[しゅ]の民[たみ]をあざけり、これに対して誇[ほこ]ったからである。"
  11: "主[しゅ]は彼らに現[あらわ]れ、地[ち]の国[くに]々[ぐに]のすべての神[かみ]々[がみ]を滅[ほろ]ぼされる。国[くに]々[ぐに]のすべての島[しま]は、それぞれ自分[じぶん]の場所[ばしょ]から主[しゅ]を拝[はい]する。"
  12: "エチオピア人[じん]よ、あなたがたもわたしの剣[つるぎ]によって傷[きず]つけられる者[もの]である。"
  13: "主[しゅ]は手[て]を北[きた]に伸[の]ばし、アッシリア人[じん]を滅[ほろ]ぼし、ニネベを荒[あ]れ果[は]てた水[みず]のない所[ところ]、荒[あ]れ野[の]のような所[ところ]とされる。"
  14: "その中[なか]では群[む]れが住[す]み、地[ち]のすべての獣[けもの]が住[す]む。カメレオンとハリネズミがその巣[す]のうちに伏[ふ]し、獣[けもの]がその割[わ]れ目[め]でほえ、烏[からす]がその門[もん]にいる。その高[たか]ぶりは杉[すぎ]であるからである。"
  15: "これが、侮[あなど]り高[たか]ぶる都[みやこ]、安[やす]んじて住[す]み、『わたしは存在[そんざい]し、わたしのほかにはだれもいない』と心[こころ]のうちで言[い]う都[みやこ]である。どうしてそれが荒[あ]れ果[は]て、獣[けもの]の牧[まき]場[ば]となったのか。そこを通[とお]り過[す]ぎる者[もの]はすべて、口笛[くちぶえ]を吹[ふ]き、手[て]を振[ふ]る」。"

notes:
  1: "Συνάχθητε καὶ συνδέθητε — «соберитесь и свяжитесь» (συνδέω — связывать, 結ばれる); τὸ ἔθνος τὸ ἀπαίδευτον — «народ необученный (необузданный)» (ἀπαίδευτος — невежественный, 恥じを知らない)."
  2: "πρὸ τοῦ γενέσθαι ὑμᾶς ὡς ἄνθος παραπορευόμενον — «прежде неже быть вам как цвету мимоходящему» (ἄνθος — цветок, 花; παραπορεύομαι — проходить мимо, 過ぎ去る); πρὸ τοῦ ἐπελθεῖν ἐφ᾿ ὑμᾶς ὀργὴν κυρίου — «прежде чем придёт на вас гнев Господень» (ἐπέρχομαι — приходить на, 臨む); ἡμέραν θυμοῦ κυρίου — «день ярости Господней». Слав. добавляет «в день» («в день» при «цвету мимоходящу») — внесено (日のうちに)."
  3: "ζητήσατε τὸν κύριον, πάντες ταπεινοὶ γῆς — «взыщите Господа, все смиренные земли» (ταπεινός — смиренный, へりくだる); κρίμα ἐργάζεσθε — «суд делайте»; δικαιοσύνην ζητήσατε — «правды ищите»; ἀποκρίνεσθε αὐτά — «отвечайте им» (т.е. держитесь их, 応える); слав. в скобках «взыщите кротости» — нет в LXX, включено как церковное чтение (柔和を求め), оговорено; ὅπως σκεπασθῆτε ἐν ἡμέρᾳ ὀργῆς — «чтобы покрылись в день гнева» (σκεπάζω — покрывать, 覆う)."
  4: "Γάζα διηρπασμένη ἔσται — «Газа расхищена будет» (διαρπάζω — расхищать, 荒らす); Ἀσκαλὼν ἔσται εἰς ἀφανισμόν — «Аскалон будет в уничтожение»; Ἄζωτος μεσημβρίας ἐκριφήσεται — «Азот в полдень извержен будет» (μεσημβρία — полдень, 真昼; ἐκρίπτω — выбрасывать, 追い払う); Ακκαρων ἐκριζωθήσεται — «Аккарон искоренится» (ἐκριζόω — искоренять, 根こそぎ)."
  5: "οὐαὶ οἱ κατοικοῦντες τὸ σχοίνισμα τῆς θαλάσσης — «горе живущим на участке морском» (σχοίνισμα — землемерная верёвка, участок, 海辺の地); πάροικοι Κρητῶν — «пришельцы Критян» (πάροικος — переселенец, 移住者); Χανααν γῆ ἀλλοφύλων — «Ханаан, земля иноплеменников» (ἀλλόφυλοι — ペリシテ人); ἀπολῶ ὑμᾶς ἐκ κατοικίας — «погублю вас от жилища» (κατοικία — жилище, 住みか)."
  6: "ἔσται Κρήτη νομὴ ποιμνίων — «будет Крит пажитью стад» (νομή — пажить, 牧場); μάνδρα προβάτων — «загон овец» (μάνδρα — загон, 囲い)."
  7: "ἔσται τὸ σχοίνισμα τῆς θαλάσσης τοῖς καταλοίποις οἴκου Ιουδα — «будет участок морской остатку дома Иуды»; ἐπ᾿ αὐτοὺς νεμήσονται ἐν τοῖς οἴκοις Ἀσκαλῶνος — «на них будут пасти в домах Аскалона» (νέμω — пасти, 住む); δείλης καταλύσουσιν — «к вечеру водворятся» (δείλη — вечер, 夕べ; καταλύω — останавливаться, 休む); ἐπέσκεπται αὐτοὺς κύριος — «посетил их Господь» (ἐπισκέπτομαι — посещать, 顧みる); ἀπέστρεψε τὴν αἰχμαλωσίαν αὐτῶν — «возвратил плен их»."
  8: "Ἤκουσα ὀνειδισμοὺς Μωαβ — «услышал поношения Моава» (ὀνειδισμός — поношение, あざけり); κονδυλισμοὺς υἱῶν Αμμων — «ругательства сынов Аммона» (κονδυλισμός — удар кулаком, 中傷); ἐμεγαλύνοντο ἐπὶ τὰ ὅριά μου — «величались на пределы Мои» (ὅριον — предел, 境)."
  9: "ζῶ ἐγώ, λέγει κύριος τῶν δυνάμεων ὁ θεὸς Ισραηλ — «живу Я, говорит Господь сил, Бог Израилев» (κύριος τῶν δυνάμεων — 万軍の主); Μωαβ ὡς Σοδομα ἔσται — «Моав как Содом будет»; οἱ υἱοὶ Αμμων ὡς Γομορρα — «сыны Аммона как Гоморра»; Δαμασκὸς ἐκλελειμμένη ὡς θιμωνιὰ ἅλωνος — «Дамаск оставлен как стог гумна» (θιμωνιά — стог, 山; ἅλων — гумно, 打ち場): в МТ Дамаска здесь нет, держим LXX/слав.; ἠφανισμένη εἰς τὸν αἰῶνα — «уничтожен навек»; οἱ κατάλοιποι λαοῦ μου διαρπῶνται αὐτούς — «остатки народа Моего расхитят их»; οἱ κατάλοιποι ἔθνους μου κληρονομήσουσιν αὐτούς — «остатки народа Моего наследуют их» (κληρονομέω — наследовать, 嗣業とする)."
  10: "αὕτη αὐτοῖς ἀντὶ τῆς ὕβρεως αὐτῶν — «это им вместо надменности их» (ὕβρις — надменность, 傲慢); ὠνείδισαν καὶ ἐμεγαλύνθησαν — «поносили и величались»; ἐπὶ τὸν κύριον τὸν παντοκράτορα — «на Господа Вседержителя» (LXX); слав. «на люди Господа вседержителя» — добавлено «люди», в тексте по слав. (全能者である主の民)."
  11: "ἐπιφανήσεται κύριος ἐπ᾿ αὐτούς — «явится Господь на них» (ἐπιφαίνω — являться, 現れる); ἐξολεθρεύσει πάντας τοὺς θεοὺς τῶν ἐθνῶν — «истребит всех богов народов»; προσκυνήσουσιν αὐτῷ ἕκαστος ἐκ τοῦ τόπου αὐτοῦ — «поклонятся Ему каждый с места своего»; πᾶσαι αἱ νῆσοι τῶν ἐθνῶν — «все острова народов» (νῆσος — остров, 島)."
  12: "Καὶ ὑμεῖς, Αἰθίοπες — «и вы, Ефиопляне» (Αἰθίοψ — エチオピア人); τραυματίαι ῥομφαίας μού ἐστε — «раненые мечом Моим вы» (τραυματίας — раненый, 傷つけられる者)."
  13: "ἐκτενεῖ τὴν χεῖρα αὐτοῦ ἐπὶ βορρᾶν — «прострет руку Свою на север» (βορρᾶς — север, 北); ἀπολεῖ τὸν Ἀσσύριον — «погубит Ассириянина»; θήσει τὴν Νινευη εἰς ἀφανισμὸν ἄνυδρον ὡς ἔρημον — «положит Ниневию в уничтожение безводное, как пустыню» (ἄνυδρος — безводный, 水のない)."
  14: "νεμήσονται ἐν μέσῳ αὐτῆς ποίμνια — «будут пастись среди неё стада»; πάντα τὰ θηρία τῆς γῆς — «все звери земные»; χαμαιλέοντες καὶ ἐχῖνοι ἐν τοῖς φατνώμασιν αὐτῆς κοιτασθήσονται — «хамелеоны и ежи в яслях её будут лежать» (χαμαιλέων — カメレオン; ἐχῖνος — ёж, ハリネズミ; φάτνωμα — ясли/гнездо, 巣); θηρία φωνήσει ἐν τοῖς διορύγμασιν αὐτῆς — «звери воззовут в расселинах её» (διόρυγμα — расселина, 割れ目); κόρακες ἐν τοῖς πυλῶσιν αὐτῆς — «вороны во вратах её» (κόραξ — ворон, 烏; πυλών — врата, 門); κέδρος τὸ ἀνάστημα αὐτῆς — «кедр — возвышение (вышина) её» (κέδρος — кедр, 杉). В ru/МТ «пеликан и еж», «разрушение на дверных столбах» — иное чтение, не внесено."
  15: "ἡ πόλις ἡ φαυλίστρια — «город презорливый» (φαυλίστρια — ж. р. от «презирающий», 侮り高ぶる); ἡ κατοικοῦσα ἐπ᾿ ἐλπίδι — «живущий на уповании» (ἐλπίς — надежда, 安んじて); Ἐγώ εἰμι, καὶ οὐκ ἔστιν μετ᾿ ἐμὲ ἔτι — «Я есмь, и нет после меня ещё»: слова города в 『…』; πῶς ἐγενήθη εἰς ἀφανισμόν — «как стал он уничтожением»; νομὴ θηρίων — «пажить зверей»; πᾶς ὁ διαπορευόμενος δι᾿ αὐτῆς συριεῖ — «всяк проходящий через него посвищет» (συρίζω — свистеть, 口笛を吹く); κινήσει τὰς χεῖρας αὐτοῦ — «подвигнет руками своими» (手を振る). Здесь слово Господа закрывается."
