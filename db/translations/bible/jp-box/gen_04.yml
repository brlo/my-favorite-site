verses:
  1: "アダムはその妻[つま]エバを知[し]った。彼女[かのじょ]は身[み]ごもってカインを産[う]み、言[い]った。「わたしは神[かみ]によって人[ひと]を得[え]た。」"
  2: "彼女[かのじょ]はさらに、その弟[おとうと]アベルを産[う]んだ。アベルは羊[ひつじ]を飼[か]う者[もの]となり、カインは地[ち]を耕[たがや]す者[もの]となった。"
  3: "日[ひ]がたって、カインは地[ち]の実[み]から主[しゅ]に供[そな]え物[もの]を捧[ささ]げた。"
  4: "アベルもまた、その羊[ひつじ]の初[はつ]子[ご]と、その脂[あぶら]から捧[ささ]げた。神[かみ]はアベルとその供[そな]え物[もの]に目[め]を留[と]められた。"
  5: "しかし、カインとその供[そな]え物[もの]には目[め]を留[と]められなかった。カインはひどく悲[かな]しみ、顔[かお]を伏[ふ]せた。"
  6: "主[しゅ]なる神[かみ]はカインに言[い]われた。「なぜ悲[かな]しむのか。なぜ顔[かお]を伏[ふ]せるのか。"
  7: "正[ただ]しく捧[ささ]げても、正[ただ]しく分[わ]けなければ、あなたは罪[つみ]を犯[おか]したのではないか。静[しず]まれ。彼[かれ]の向[む]かうところはあなたにあり、あなたは彼[かれ]を治[おさ]める。」"
  8: "カインは弟[おとうと]アベルに言[い]った。「野[の]へ行[い]こう。」二人[ふたり]が野[の]にいたとき、カインは弟[おとうと]アベルに立[た]ち向[む]かい、彼[かれ]を殺[ころ]した。"
  9: "〔主[しゅ]なる〕神[かみ]はカインに言[い]われた。「あなたの弟[おとうと]アベルはどこにいるのか。」彼[かれ]は言[い]った。「知[し]らない。わたしが弟[おとうと]の見張[みは]りをする者[もの]なのか。」"
  10: "〔主[しゅ]なる〕神[かみ]は言[い]われた。「何[なに]をしたのか。あなたの弟[おとうと]の血[ち]の声[こえ]が、地[ち]からわたしに向[む]かって叫[さけ]んでいる。"
  11: "今[いま]、あなたは地[ち]から呪[のろ]われる。地[ち]は口[くち]を開[ひら]いて、あなたの手[て]から弟[おとうと]の血[ち]を受[う]け入[い]れた。"
  12: "あなたが地[ち]を耕[たがや]しても、地[ち]はもはやその力[ちから]をあなたに与[あた]えない。あなたは地[ち]の上[うえ]で嘆[なげ]き、震[ふる]えていなければならない。」"
  13: "カインは主[しゅ]に言[い]った。「わたしの罪[つみ]は大[おお]きすぎて、赦[ゆる]されない。"
  14: "あなたが今日[きょう]、わたしを地[ち]の面[おもて]から追[お]い出[だ]されるので、わたしはあなたの顔[かお]から隠[かく]れ、地[ち]の上[うえ]で嘆[なげ]き、震[ふる]える者[もの]となる。わたしを見[み]つける者[もの]はだれでも、わたしを殺[ころ]すだろう。」"
  15: "主[しゅ]なる神[かみ]は彼[かれ]に言[い]われた。「そうではない。カインを殺[ころ]す者[もの]には、七[なな]倍[ばい]の復讐[ふくしゅう]が下[くだ]る。」主[しゅ]なる神[かみ]はカインにしるしを付[つ]け、彼[かれ]を見[み]つける者[もの]がだれも彼[かれ]を殺[ころ]さないようにされた。"
  16: "カインは神[かみ]の顔[かお]から出[で]て行[い]き、エデンと向[む]かい合[あ]うナイドの地[ち]に住[す]んだ。"
  17: "カインはその妻[つま]を知[し]り、彼女[かのじょ]は身[み]ごもってエノクを産[う]んだ。カインは町[まち]を建[た]て、その町[まち]を子[こ]の名[な]にちなんでエノクと名[な]づけた。"
  18: "エノクにはガイダドが生[う]まれた。ガイダドはマイエルを生[う]み、マイエルはマトゥサラを生[う]み、マトゥサラはレメクを生[う]んだ。"
  19: "レメクは自分[じぶん]に二人[ふたり]の妻[つま]を娶[めと]った。一[ひと]人[り]の名[な]はアダ、もう一[ひと]人[り]の名[な]はツィラといった。"
  20: "アダはヤバルを産[う]んだ。彼[かれ]は天幕[てんまく]に住[す]み、家畜[かちく]を飼[か]う者[もの]たちの父[ちち]となった。"
  21: "その弟[おとうと]の名[な]はユバルといった。彼[かれ]は竪琴[たてごと]と琴[こと]を奏[かな]でる者[もの]たちの父[ちち]となった。"
  22: "ツィラもまた、トバルカインを産[う]んだ。彼[かれ]は青銅[せいどう]と鉄[てつ]を打[う]つ鍛冶[かじ]であった。トバルカインの妹[いもうと]はナアマである。"
  23: "レメクはその妻[つま]たちに言[い]った。「アダとツィラよ、わたしの声[こえ]を聞[き]け。レメクの妻[つま]たちよ、わたしの言葉[ことば]に耳[みみ]を傾[かたむ]けよ。わたしは自分[じぶん]の傷[きず]のために男[おとこ]を殺[ころ]し、自分[じぶん]の打[う]ち傷[きず]のために若者[わかもの]を殺[ころ]した。"
  24: "カインのためには七[なな]倍[ばい]の復讐[ふくしゅう]があるとすれば、レメクのためには七[なな]十[じゅう]七[なな]倍[ばい]の復讐[ふくしゅう]がある。」"
  25: "アダムはまた、その妻[つま]エバを知[し]った。彼女[かのじょ]は身[み]ごもって子[こ]を産[う]み、その名[な]をセツと名[な]づけて言[い]った。「神[かみ]は、カインが殺[ころ]したアベルの代[か]わりに、わたしに別[べつ]の子孫[しそん]を起[おこ]してくださった。」"
  26: "セツにも子[こ]が生[う]まれた。彼[かれ]はその名[な]をエノシュと名[な]づけた。この者[もの]は、主[しゅ]なる神[かみ]の名[な]を呼[よ]び求[もと]めることを望[のぞ]んだ。"

notes:
  1: "ἔγνω — 知った (библ. «познал»). συλλαβοῦσα ἔτεκεν — 身ごもって産んだ. Ἐκτησάμην ἄνθρωπον διὰ τοῦ θεοῦ — 神によって人を得た (κτάομαι — «приобретать»)."
  2: "προσέθηκεν τεκεῖν — さらに産んだ (букв. «приложила родить»). ποιμὴν προβάτων — 羊を飼う者. ἐργαζόμενος τὴν γῆν — 地を耕す者."
  3: "μεθ᾿ ἡμέρας — 日がたって. θυσίαν τῷ κυρίῳ — 主に供え物 (LXX κύριος; слав. «Богу» — разночтение). ἀπὸ τῶν καρπῶν τῆς γῆς — 地の実から."
  4: "ἀπὸ τῶν πρωτοτόκων… καὶ ἀπὸ τῶν στεάτων — 初子とその脂から (στέαρ — «тук, жир»). ἐπεῖδεν ὁ θεός — 神は目を留められた (ἐφοράω, «призреть»)."
  5: "οὐ προσέσχεν — 目を留められなかった (προσέχω). ἐλύπησεν τὸν Καιν λίαν — カインはひどく悲しんだ (букв. «опечалил Каина весьма»). συνέπεσεν τῷ προσώπῳ — 顔を伏せた (букв. «пал лицом»)."
  6: "Ἵνα τί περίλυπος ἐγένου — なぜ悲しむのか (περίλυπος — «очень печальный»). συνέπεσεν τὸ πρόσωπόν σου — 顔を伏せる."
  7: "οὐκ, ἐὰν ὀρθῶς προσενέγκῃς… — 正しく捧げても… (вопрос). ὀρθῶς μὴ διέλῃς — 正しく分けない (διαιρέω; слав. «не разделил еси» — тёмное место). ἥμαρτες — 罪を犯した. ἡσύχασον — 静まれ (ἡσυχάζω). πρὸς σὲ ἡ ἀποστροφὴ αὐτοῦ — 彼の向かうところはあなたにあり (слав. «к тебе обращение его»; евр. «к тебе влечение его»). σὺ ἄρξεις αὐτοῦ — あなたは彼を治める. Первое место со словом 罪[つみ] в Библии (по порядку книг)."
  8: "Διέλθωμεν εἰς τὸ πεδίον — 野へ行こう (эти слова есть в gr-lxx-byz, поэтому 〔…〕 не нужны; в критических изданиях их нет). ἀνέστη ἐπὶ — 立ち向かった. ἀπέκτεινεν — 殺した."
  9: "Ποῦ ἐστιν Αβελ… — 弟はどこか. μὴ φύλαξ τοῦ ἀδελφοῦ μού εἰμι ἐγώ; — わたしが弟の見張りをする者なのか (вопрос с μή, ответ «нет»). κύριος в LXX нет — 〔主なる〕 по церковному чтению."
  10: "φωνὴ αἵματος… βοᾷ πρός με — 血の声がわたしに向かって叫んでいる (βοάω). κύριος в LXX нет — 〔主なる〕."
  11: "ἐπικατάρατος σὺ ἀπὸ τῆς γῆς — あなたは地から呪われる. ἣ ἔχανεν τὸ στόμα — 地は口を開いた (χάσκω, «зевать, разверзать»). δέξασθαι τὸ αἷμα… ἐκ τῆς χειρός σου — あなたの手から血を受ける."
  12: "ἐργᾷ τὴν γῆν — 地を耕しても. οὐ προσθήσει τὴν ἰσχὺν αὐτῆς δοῦναί σοι — もはやその力を与えない (προστίθημι — «прибавлять»). στένων καὶ τρέμων — 嘆き、震え (слав. «стеня и трясыйся»)."
  13: "Μείζων ἡ αἰτία μου τοῦ ἀφεθῆναί με — わたしの罪は大きすぎて赦されない (αἰτία — «вина, причина»; τοῦ ἀφεθῆναι — «быть прощённым»; Син. «наказание моё больше, нежели снести можно» — с евр.)."
  14: "εἰ ἐκβάλλεις με σήμερον — あなたが今日追い出すので. ἀπὸ τοῦ προσώπου σου κρυβήσομαι — あなたの顔から隠れる. πᾶς ὁ εὑρίσκων με — わたしを見つける者はだれでも."
  15: "Οὐχ οὕτως — そうではない. ἑπτὰ ἐκδικούμενα παραλύσει — 七倍の復讐が下る (παραλύω букв. «разрешать, ослаблять» — тёмное место; слав. «седмижды отмстится»). σημεῖον — しるし."
  16: "Ναιδ — ナイド (Син. «Нод» — с евр.). κατέναντι Εδεμ — エデンと向かい合う (LXX; Син. «на восток от Едема»)."
  17: "ᾤκησεν… ἦν οἰκοδομῶν πόλιν — 町を建て. ἐπωνόμασεν… ἐπὶ τῷ ὀνόματι τοῦ υἱοῦ — 子の名にちなんで名づけた."
  18: "Γαιδαδ, Μαιηλ, Μαθουσαλα — ガイダド、マイエル、マトゥサラ (LXX даёт иные имена каинитов, чем масоретский текст: Ирад, Мехиаель, Метушаэль; переведено с греческого. Μαθουσαλα здесь — другой человек, не メトシェラ из гл. 5, поэтому マトゥサラ)."
  19: "Σελλα — ツィラ (LXX; jp-joc セッラ; дано принятое в японских переводах имя). ἔλαβεν ἑαυτῷ δύο γυναῖκας — 二人の妻を娶った."
  20: "Ιωβελ — ヤバル (LXX; jp-joc イヲワィル; Син. «Иавал»). πατὴρ οἰκούντων ἐν σκηναῖς κτηνοτρόφων — 天幕に住み家畜を飼う者たちの父 (κτηνοτρόφος — «скотовод»)."
  21: "Ιουβαλ — ユバル (LXX; jp-joc イウワル; Син. «Иувал»). «Каин» в 4:22 относится к другому лицу (Θοβελ), поэтому здесь его нет. καταδείξας — 示した, т. е. изобретатель (καταδείκνυμι). ψαλτήριον καὶ κιθάραν — 竪琴と琴 (оба струнные; jp-joc «琴と笛» — неточно, 笛 — флейта)."
  22: "Θοβελ — トバルカイン (LXX без «Каин»; принятая в японских переводах форма, jp-joc フォワェル, Син. «Тувалкаин»). σφυροκόπος χαλκεὺς χαλκοῦ καὶ σιδήρου — 青銅と鉄を打つ鍛冶. Νοεμα — ナアマ."
  23: "ἀκούσατέ μου τῆς φωνῆς — わたしの声を聞け. ἐνωτίσασθέ μου τοὺς λόγους — わたしの言葉に耳を傾けよ (ἐνωτίζομαι). ἄνδρα ἀπέκτεινα εἰς τραῦμα ἐμοὶ — 自分の傷のために男を殺した (εἰς τραῦμα — «в язву»). νεανίσκον εἰς μώλωπα — 若者を打ち傷のために (μώλωψ — «рубец, рана»)."
  24: "ἑπτάκις ἐκδεδίκηται ἐκ Καιν — カインのために七倍の復讐がある (perfect). ἑβδομηκοντάκις ἑπτά — 七十七倍."
  25: "Ἐξανέστησεν γάρ μοι ὁ θεὸς σπέρμα ἕτερον — 神はわたしに別の子孫を起こした (ἐξανίστημι). ἀντὶ Αβελ — アベルの代わりに."
  26: "Ενως — エノシュ. οὗτος ἤλπισεν ἐπικαλεῖσθαι τὸ ὄνομα κυρίου τοῦ θεοῦ — この者は主なる神の名を呼び求めることを望んだ (ἐλπίζω — «надеяться»; слав. «сей упова призывати»; Син. «тогда начали призывать» — с евр., в текст не внесено)."
