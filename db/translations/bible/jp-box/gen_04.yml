# jp-box, Бытие, глава 4. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и jp-joc (1901, public domain).
# Язык — современный 常体, без 文語; порядок членов и деление на клаузы — по греческому.
# Глава 4: Каин и Авель (1–8), суд над Каином и знамение (9–16), род каинитов (17–24),
# Сиф и Енос (25–26).
# Красного и синего нет; речь Бога и людей — 「…」.
# 〔…〕: 4:9 и 4:10 — «Господь» есть в церковном чтении (csl, jp-joc), но отсутствует
# в gr-lxx-byz (там ὁ θεός); проверено bracket_check.rb (κυριοσ — НЕТ).
# Имена каинитов у LXX иные, чем в масоретском тексте (4:18 Γαιδαδ, Μαιηλ, Μαθουσαλα;
# 4:20 Ιωβελ, 4:21 Ιουβαλ, 4:22 Θοβελ) — перевод с греческого, отличия в notes.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

