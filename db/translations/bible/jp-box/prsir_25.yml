verses:
  1: "三[みっ]つのことによってわたしは美[うつく]しくされ、主[しゅ]と人[ひと]の前[まえ]に美しく立[た]った。"
  2: "兄弟[きょうだい]の一致[いっち]と、隣人[りんじん]への友情[ゆうじょう]と、夫婦[ふうふ]が互[たが]いに和[わ]を保[たも]つことである。"
  3: "しかるに、わたしの魂[たましい]は三[みっ]つの種類[しゅるい]を憎[にく]み、その生[い]き方[かた]に激[はげ]しく腹[はら]を立[た]てた。"
  4: "貧[まず]しいのに高慢[こうまん]な者[もの]、富[とみ]みながら偽[いつわ]りを言[い]う者、年[とし]を取[と]って分別[ふんべつ]が衰[おとろ]えた姦淫[かんいん]の者である。"
  5: "若[わか]いときに蓄[たくわ]えなかったなら、どうして年老[としお]いて見[み]いだせようか。"
  6: "白髪[しらが]に裁[さば]きがあるのはなんと美[うつく]しいことか。長老[ちょうろう]たちが助言[じょげん]に通[つう]じているのは、なんと美しいことか。"
  7: "長老[ちょうろう]たちの知恵[ちえ]はなんと美しいことか。尊[たっと]ばれた者[もの]たちの思[おも]いと助言[じょげん]も、なんと美しいことか。"
  8: "長老[ちょうろう]たちの冠[かんむり]は多[おお]くの経験[けいけん]であり、彼[かれ]らの誇[ほこ]りは主[しゅ]を恐[おそ]れることである。"
  9: "わたしは心[こころ]のうちで九[ここの]つの思[おも]いを幸[しあわ]せだと言[い]い、そしていま口[くち]で第十[だいじゅう]のことを言おう。"
  10: "子[こ]どもたちのゆえに喜[よろこ]ぶ人[ひと]、生[い]きながら敵[てき]の倒[たお]れるのを見[み]る人である。"
  11: "分別[ふんべつ]ある女[おんな]とともに住[す]む者[もの]は幸[しあわ]せであり、舌[した]でつまずかなかった者[もの]、自分[じぶん]にふさわしくない者[もの]に仕[つか]えなかった者も幸いである。"
  12: "悟[さと]りを見[み]いだした者[もの]は幸[しあわ]せであり、聞[き]く者[もの]の耳[みみ]にそれを語[かた]る者も幸いである。"
  13: "知恵[ちえ]を見[み]いだした者[もの]はなんと大[おお]きいことか。しかし、主[しゅ]を恐[おそ]れる者[もの]にまさる者[もの]はいない。"
  14: "主[しゅ]を恐[おそ]れることはすべてにまさっており、これを持つ者[もの]はだれに似[に]るだろうか。主[しゅ]を恐[おそ]れることは主[しゅ]への愛[あい]の始[はじ]まりであり、信仰[しんこう]は主に寄[よ]り添[そ]うことの始まりである。"
  15: "どんな傷[きず]も、心[こころ]の傷[きず]でないなら耐[た]えられる。どんな悪[あく]も、女[おんな]の悪[あく]でないなら耐えられる。"
  16: "どんな襲撃[しゅうげき]も、憎[にく]む者[もの]からの襲撃でないなら耐えられる。どんな復讐[ふくしゅう]も、敵[てき]からの復讐でないなら耐えられる。"
  17: "蛇[へび]の頭[あたま]にまさる頭はなく、敵[てき]の怒[いか]りにまさる怒りはない。"
  18: "悪[わる]い女[おんな]とともに住[す]むよりは、獅子[しし]や龍[りゅう]とともに住むほうがよい。"
  19: "女[おんな]の悪[あく]はその顔[かお]つきを変[か]え、その顔[かお]を粗布[あらぬの]のように暗[くら]くする。"
  20: "彼女[かのじょ]の夫[おっと]は隣人[りんじん]たちの間[あいだ]に座[すわ]り、その話[はなし]を聞[き]いて思[おも]わず苦[にが]くため息[いき]をつく。"
  21: "女[おんな]の悪[あく]に比[くら]べれば、どんな悪[あく]も小[ちい]さい。罪人[つみびと]のくじが彼女[かのじょ]に降[ふ]りかかるように。"
  22: "砂[すな]の上[うえ]を登[のぼ]ることは老人[ろうじん]の足[あし]にとってのようであり、おしゃべりな女[おんな]は静[しず]かな夫[おっと]にとってそのようなものである。"
  23: "女[おんな]の美[うつく]しさに心[こころ]を奪[うば]われてはならない。女[おんな]をむやみに慕[した]ってはならない。"
  24: "怒[いか]りと恥[はじ]知[し]らずと大[おお]きな辱[はずかし]め、それは女[おんな]が自分[じぶん]の夫[おっと]を支配[しはい]するときのことである。"
  25: "心[こころ]の沈[しず]んだ女[おんな]、暗[くら]い顔[かお]、心[こころ]の傷[きず]、これらは悪[わる]い女である。"
  26: "弱[よわ]った手[て]と麻痺[まひ]した膝[ひざ]、それは自分[じぶん]の夫[おっと]を幸[しあわ]せにしない女である。"
  27: "女[おんな]から罪[つみ]の始[はじ]まりがあり、彼女[かのじょ]によってわたしたちはすべて死[し]ぬ。"
  28: "水[みず]に出口[でぐち]を与[あた]えてはならない。悪[わる]い女[おんな]に大胆[だいたん]さを与えてもならない。"
  29: "もし彼女[かのじょ]があなたの手[て]に従[したが]って歩[ある]まないなら、あなたの肉[にく]から彼女を切[き]り離[はな]せ。"

notes:
  1: "Ἐν τρισὶν ὡραίσθην — «тремя я украсилась» (ὡραίζω). ὁμόνοια ἀδελφῶν — «единомыслие братьев» (ὁμόνοια); φιλία τῶν πλησίον — «дружба ближних» (φιλία); γυνὴ καὶ ἀνὴρ ἑαυτοῖς συμπεριφερόμενοι — «жена и муж, согласно обходящиеся друг с другом» (συμπεριφέρομαι). Слав. 25:1–2."
  2: "Продолжение ст. 1 (тот же стих по-гречески)."
  3: "τρία εἴδη ἐμίσησεν ἡ ψυχή μου — «три вида возненавидела душа моя» (εἶδος; μισέω). προσώχθισα σφόδρα τῇ ζωῇ αὐτῶν — «сильно вознегодовал на жизнь их» (προσοχθίζω). πτωχὸν ὑπερήφανον — «нищего надменного»; πλούσιον ψεῦστην — «богатого лживого»; γέροντα μοιχὸν ἐλαττούμενον συνέσει — «старца прелюбодея, умалённого разумом» (μοιχός; ἐλαττόω). Слав. 25:3–4."
  4: "Продолжение ст. 3 (тот же стих по-гречески)."
  5: "Ἐν νεότητι οὐ συναγείοχας — «в юности не собрал» (συναγείρω — собирать); πῶς ἂν εὕροις ἐν τῷ γήρᾳ σου — «как найдёшь в старости твоей» (γῆρας)."
  6: "ὡς ὡραῖον πολιαῖς κρίσις — «как прекрасен сединам суд» (πολιά — седина; κρίσις). πρεσβυτέροις ἐπιγνῶναι βουλήν — «старцам — знать совет» (ἐπιγινώσκω; βουλή). Слав. 25:6."
  7: "ὡς ὡραία γερόντων σοφία — «как прекрасна старцев премудрость» (γέρων). δεδοξασμένοις διανόημα καὶ βουλή — «прославленным — мысль и совет» (διανόημα). Слав. 25:7."
  8: "στέφανος γερόντων πολυπειρία — «венец старцев — многоопытность» (στέφανος; πολυπειρία). τὸ καύχημα αὐτῶν φόβος κυρίου — «похвала их — страх Господень» (καύχημα)."
  9: "Ἐννέα ὑπονοήματα ἐμακάρισα — «девять помышлений ублажил» (ὑπονόημα; μακαρίζω). τὸ δέκατον ἐρῶ ἐπὶ γλώσσης — «десятое скажу языком». ἄνθρωπος εὐφραινόμενος ἐπὶ τέκνοις — «человек, радующийся о детях» (εὐφραίνω). ζῶν καὶ βλέπων ἐπὶ πτώσει ἐχθρῶν — «живой и видящий падение врагов» (πτῶσις). Слав. 25:9–10."
  10: "Продолжение ст. 9 (тот же стих по-гречески)."
  11: "μακάριος ὁ συνοικῶν γυναικὶ συνετῇ — «блажен, живущий с женой разумной» (συνοικέω; συνετός). ὃς ἐν γλώσσῃ οὐκ ὠλίσθησεν — «кто языком не поскользнулся» (ὀλισθάνω). ὃς οὐκ ἐδούλευσεν ἀναξίῳ ἑαυτοῦ — «кто не служил недостойному себя» (δουλεύω; ἀνάξιος)."
  12: "μακάριος ὃς εὗρεν φρόνησιν — «блажен, кто нашёл разумение» (φρόνησις). ὁ διηγούμενος εἰς ὦτα ἀκουόντων — «рассказывающий в уши слушающих» (διηγέομαι)."
  13: "ὡς μέγας ὁ εὑρὼν σοφίαν — «как велик нашедший премудрость». ἀλλ᾽ οὐκ ἔστιν ὑπὲρ τὸν φοβούμενον τὸν κύριον — «но нет (никого) выше боящегося Господа»."
  14: "φόβος κυρίου ὑπὲρ πᾶν ὑπερέβαλεν — «страх Господень всё превзошёл» (ὑπερβάλλω). ὁ κρατῶν αὐτοῦ τίνι ὁμοιωθήσεται — «держащий его кому уподобится» (κρατέω; ὁμοιόω). В gr-lxx-byz «.» (дефект модуля); в csl и ru стиха нет (краткая редакция). Переведено по пространной редакции LXX: φόβος κυρίου ἀρχὴ ἀγαπήσεως αὐτοῦ, πίστις δὲ ἀρχὴ κολλήσεως αὐτοῦ — «страх Господень — начало любви Его, а вера — начало прилепления к Нему» (ἀγάπησις; πίστις; κόλλησις). Слав. 25:15 начинается уже со следующего стиха. Слав. краткая редакция не содержит ст. 25:12 (страх Господень — начало любви); стих полного LXX сохранён здесь, при csl 25:14."
  15: "Πᾶσαν πληγὴν καὶ μὴ πληγὴν καρδίας — «всякую рану, но не рану сердца»: оборот «всё, кроме». πᾶσαν πονηρίαν καὶ μὴ πονηρίαν γυναικὸς — «всякое зло, но не зло жены» (πονηρία). Слав. 25:15."
  16: "πᾶσαν ἐπαγωγὴν καὶ μὴ ἐπαγωγὴν μισούντων — «всякое нападение, но не нападение ненавидящих» (ἐπαγωγή; μισέω). πᾶσαν ἐκδίκησιν καὶ μὴ ἐκδίκησιν ἐχθρῶν — «всякое мщение, но не мщение врагов» (ἐκδίκησις). Слав. 25:16."
  17: "οὐκ ἔστιν κεφαλὴ ὑπὲρ κεφαλὴν ὄφεως — «нет головы выше головы змея» (ὄφις). οὐκ ἔστιν θυμὸς ὑπὲρ θυμὸν ἐχθροῦ — «нет ярости выше ярости врага» (θυμός)."
  18: "συνοικῆσαι λέοντι καὶ δράκοντι εὐδοκήσω — «соглашусь жить со львом и драконом» (εὐδοκέω; δράκων — 龍). ἢ συνοικῆσαι μετὰ γυναικὸς πονηρᾶς — «нежели жить со злою женою»."
  19: "πονηρία γυναικὸς ἀλλοιοῖ τὴν ὅρασιν αὐτῆς — «злость жены изменяет вид её» (ἀλλοιόω; ὅρασις). σκοτοῖ τὸ πρόσωπον αὐτῆς ὡς ἄρκος — «омрачает лицо её, как медведь» (σκοτόω; ἄρκος); слав. читает «яко вретище» (как рубище) — принято слав. чтение, вариант LXX отмечен здесь."
  20: "ἀνὰ μέσον τῶν πλησίον αὐτοῦ ἀναπεσεῖται ὁ ἀνὴρ αὐτῆς — «среди ближних своих возляжет муж её» (ἀναπίπτω). ἀκουσίως ἀνεστέναξεν πικρά — «невольно горько вздохнёт» (ἀκουσίως; στενάζω; πικρός)."
  21: "μικρὰ πᾶσα κακία πρὸς κακίαν γυναικὸς — «мала всякая злоба против злобы жены» (κακία). κλῆρος ἁμαρτωλοῦ ἐπιπέσοι αὐτῇ — «жребий грешника да падёт на неё» (κλῆρος; ἐπιπίπτω), оптатив."
  22: "ἀνάβασις ἀμμώδης — «восхождение по песку» (ἀνάβασις; ἀμμώδης). ἐν ποσὶν πρεσβυτέρου — «для ног старца» (πρεσβύτερος). γυνὴ γλωσσώδης — «жена языкастая, болтливая» (γλωσσώδης); ἀνδρὶ ἡσύχῳ — «мужу тихому» (ἥσυχος)."
  23: "μὴ προσπέσῃς ἐπὶ κάλλος γυναικὸς — «не пади (не увлекись) на красоту жены» (προσπίπτω; κάλλος). γυναῖκα μὴ ἐπιποθήσῃς — «жены не возжелай» (ἐπιποθέω)."
  24: "ὀργὴ καὶ ἀναίδεια καὶ αἰσχύνη μεγάλη — «гнев, бесстыдство и великий срам» (ἀναίδεια; αἰσχύνη). γυνὴ ἐὰν ἐπιχορηγῇ τῷ ἀνδρὶ αὐτῆς — «жена, если снабжает (содержит) мужа своего» (ἐπιχορηγέω); слав. читает «аще обладает мужем своим» — по паритету принято слав. (支配する), вариант LXX отмечен здесь."
  25: "καρδία ταπεινὴ — «сердце удручённое» (ταπεινός); πρόσωπον σκυθρωπόν — «лицо мрачное» (σκυθρωπός); πληγὴ καρδίας — «рана сердца»; γυνὴ πονηρά — «жена злая». χεῖρες παρειμέναι — «руки ослабленные» (παρειμένος); γόνατα παραλελυμένα — «колени расслабленные» (παραλέλυμαι); ἥτις οὐ μακαριεῖ τὸν ἄνδρα αὐτῆς — «которая не ублажит (не осчастливит) мужа своего» (μακαρίζω). Греч. 23 — csl 25–26."
  26: "Продолжение ст. 25 (тот же стих по-гречески)."
  27: "ἀπὸ γυναικὸς ἀρχὴ ἁμαρτίας — «от жены начало греха» (ἀρχή). δι᾽ αὐτὴν ἀποθνῄσκομεν πάντες — «через неё умираем все» (ἀποθνῄσκω): отсылка к Быт 3, без сглаживания."
  28: "μὴ δῷς ὕδατι διέξοδον — «не дай воде выхода» (διέξοδος). γυναικὶ πονηρᾷ παρρησίαν — «жене злой дерзновения (свободы)» (παρρησία)."
  29: "εἰ μὴ πορεύεται κατὰ χεῖράς σου — «если не ходит по рукам твоим (по воле твоей)». ἀπὸ τῶν σαρκῶν σου ἀπότεμε αὐτήν — «от плоти твоей отсеки её» (ἀποτέμνω); слав. «отсецы ю от плоти твоея»."
