# jp-box, Захария, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной (совпадает с gr: 15 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–8 восьмое видение: четыре колесницы из среды двух медных гор, кони
# рыжие, вороные, белые, пегие; «четыре ветра небесных»; обход земли; север успокоил
# дух Господа; 9–15 венцы из серебра и золота на Иисуса (イエシュア), «Муж, имя Ему
# Восток», Он созиждет храм, сядет и будет священником, совет мира; венец — на память;
# издалека придут и примут участие в построении.
# Голоса: 1–8 рассказ, вопросы и ответы в 「…»; 9 формула; 10–15 слово Господа
# в 「…» с поручением Иисусу в 『…』 (12–13) и продолжением 14–15.
# Термины: 戦車[せんしゃ] — ἅρμα; 青銅[せいどう]の山[やま] — ὄρη χαλκᾶ; 冠[かんむり] —
# στέφανος; 東[ひがし] — Ἀνατολή; 大祭司[だいさいし] — ἱερεὺς μέγας.
#
tr_code: jp-box
book: zah
chapter: 6
draft: true

verses:
  1: "わたしは再[ふたた]び目[め]を上[あ]げて見[み]た。見[み]よ、四[よっ]つの戦車[せんしゃ]が、二[ふた]つの山[やま]の間[あいだ]から出[で]て来[き]た。その山[やま]は青銅[せいどう]の山[やま]であった。"
  2: "第一[だいいち]の戦車[せんしゃ]には赤[あか]い馬[うま]、第二[だいに]の戦車[せんしゃ]には黒[くろ]い馬[うま]がいた。"
  3: "第三[だいさん]の戦車[せんしゃ]には白[しろ]い馬[うま]、第四[だいし]の戦車[せんしゃ]にはまだらで足[あし]の速[はや]い馬[うま]がいた。"
  4: "わたしは、わたしと語[かた]る天使[てんし]に答[こた]えて言[い]った。「主[しゅ]よ、これらは何[なん]ですか。」"
  5: "天使[てんし]は答[こた]えて言[い]った。「これらは天[てん]の四[よっ]つの風[かぜ]であり、全[ぜん]地[ち]の主[しゅ]の前[まえ]に立[た]つために出[で]て行[い]く者[もの]たちである。」"
  6: "黒[くろ]い馬[うま]がいる戦車[せんしゃ]は北[きた]の地[ち]へ出[で]て行[い]き、白[しろ]い馬[うま]はそのあとにつき、まだらの馬[うま]は南[みなみ]の地[ち]へ出[で]て行[い]く。"
  7: "まだらの馬[うま]たちは出[で]て行[い]き、地[ち]を行[い]き巡[めぐ]ろうとしていた。彼は言[い]った。「行[い]け、地[ち]を行[い]き巡[めぐ]れ。」そこで彼らは地[ち]を行[い]き巡[めぐ]った。"
  8: "彼はわたしを呼[よ]んで言[い]った。「見[み]よ、北[きた]の地[ち]へ出[で]て行[い]く者[もの]たちは、北[きた]の地[ち]でわたしの怒[いか]りを鎮[しず]めた。」"
  9: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  10: "「捕囚[ほしゅう]から来[き]た者[もの]たちのうち、長[おさ]たちから、そのすぐれた者[もの]たちから、またそれを知[し]る者[もの]たちから受[う]け取[と]れ。その日[ひ]、あなたはバビロンから来[き]たソフォニヤの子[こ]ヨシヤの家[いえ]に入[はい]れ。"
  11: "銀[ぎん]と金[きん]を取[と]り、冠[かんむり]を造[つく]って、大祭司[だいさいし]、ヨセデクの子[こ]イエシュアの頭[あたま]に載[の]せよ。"
  12: "そして彼に言[い]え。『万軍[ばんぐん]の主[しゅ]はこう言[い]われる。見[み]よ、一人[ひとり]の男[ひと]、その名[な]は東[ひがし]という。彼の下[した]から萌[も]え出[で]て、主[しゅ]の家[いえ]を建[た]てる。"
  13: "彼は主[しゅ]の家[いえ]を建[た]て、栄光[えいこう]を受[う]け、その王座[おうざ]に座[すわ]って支配[しはい]する。彼はその王座[おうざ]の上[うえ]で祭司[さいし]となり、両者[りょうしゃ]の間[あいだ]には平和[へいわ]の議[ぎ]がある。』"
  14: "その冠[かんむり]は、耐[た]え忍[しの]ぶ者[もの]たちと、そのすぐれた者[もの]たちと、それを知[し]る者[もの]たちのためにあり、ソフォニヤの子[こ]への恵[めぐ]みとなり、主[しゅ]の家[いえ]の賛歌[さんか]となる。"
  15: "遠[とお]くから来[く]る者[もの]たちも、主[しゅ]の家[いえ]を建[た]てる工事[こうじ]に加[くわ]わる。あなたがたは、万軍[ばんぐん]の主[しゅ]がわたしをあなたがたに遣[つか]わしたことを知[し]るであろう。あなたがたが、あなたがたの神[かみ]である主[しゅ]の声[こえ]に聴[き]き従[したが]うなら、そのとおりになる。」"

notes:
  1: "τέσσαρα ἅρματα — «четыре колесницы»; ἐκ μέσου δύο ὀρέων — «из среды двух гор»; ὄρη χαλκᾶ — «горы медные» (青銅)."
  2: "ἵπποι πυρροί — «кони рыжие»; μέλανες — «вороные» (黒)."
  3: "ἵπποι ποικίλοι ψαροί — «кони пёстрые, серые (?)»; слав. «пестри скори» — «пёстрые, скорые», отсюда 足の速い; в ru «пегие, сильные» — иное чтение."
  4: "κύριε — «господин мой», 主よ (обращение к Ангелу)."
  5: "οἱ τέσσαρες ἄνεμοι τοῦ οὐρανοῦ — «четыре ветра неба» (слав. «ветри небеснии»); παραστῆναι τῷ κυρίῳ — «предстать Господу»."
  6: "ἐν ᾧ ἦσαν οἱ ἵπποι οἱ μέλανες — «в которой были кони вороные»; ἐπὶ γῆν βορρᾶ — «в землю северную»; νότου — «южную»."
  7: "οἱ ψαροί — «пёстрые (серые)»; ἐπέβλεπον τοῦ πορεύεσθαι — «стремились идти»; περιοδεύσατε — «обойдите»."
  8: "ἀνεβόησεν — «воззвал»; ἀνέπαυσαν τὸν θυμόν μου — «успокоили ярость (дух) Мою»."
  9: "ἐγένετο λόγος κυρίου — «было слово Господне»."
  10: "τὰ ἐκ τῆς αἰχμαλωσίας — «[взятое] из плена»; ἀρχόντων… χρησίμων… ἐπεγνωκότων — «начальников… полезных… познавших» (слав. «князей… ключимых… разумевших»); имён Хелдай, Товия, Иедай в LXX/слав. нет (они в евр./ru) — не внесены."
  11: "στεφάνους — «венцы» (мн. ч.); ἐπιθήσεις τῇ κεφαλῇ — «возложишь на голову»."
  12: "Ἀνατολὴ ὄνομα αὐτῷ — «имя Ему — Восток» (слав. «Восток»; евр./ru «ОТРАСЛЬ» — не внесено); ὑποκάτωθεν αὐτοῦ ἀνατελεῖ — «из-под Него произрастёт (взойдёт)»."
  13: "λήμψεται ἀρετήν — «приимет добродетель (славу)»; καθίεται καὶ κατάρξει — «сядет и будет владычествовать»; βουλὴ εἰρηνική — «совет мирный»."
  14: "ὁ στέφανος ἔσται τοῖς ὑπομένουσιν… — «венец будет терпящим…»; εἰς χάριτα υἱοῦ Σοφονιου — «в благодать сыну Софонии»; εἰς ψαλμόν — «в псалом»; в ru имена (Хелем, Товия, Иедай, Хен) — МТ, не внесены."
  15: "οἱ μακρὰν ἀπ' αὐτῶν ἥξουσιν — «дальние от них придут»; οἰκοδομήσουσιν ἐν τῷ οἴκῳ — «будут строить в доме»; ἐὰν εἰσακούοντες εἰσακούσητε — «если слушанием послушаете» (усиление)."
