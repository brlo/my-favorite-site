# jp-box, 2-я Ездры, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге нет; jp-ni (под авторским правом) не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: пир Дария (1–3), трое телохранителей и их уговор (4–9), что написал
# каждый (10–12), чтение написанного при царе (13–17), речь первого о вине (18–24).
# Речи: 3:5–7 (условие спора), 3:9 (объяснение), 3:10–12 (написанное), 3:15 и 3:16
# (приказы), 3:18–24 (речь первого) — 「…」; красного и синего нет.
# Нумерация по gr: 24 стиха. У csl тоже 24, но в середине деление иное:
# csl 3:14–15 делят gr 3:14, csl 3:16 = gr 3:15, csl 3:17 вбирает gr 3:16–17;
# с gr 3:18 деление снова совпадает.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 太守, 将軍, 貴族, 宴, 真理 уже в корпусе; 議場 и 高官 понятны без пояснения.

