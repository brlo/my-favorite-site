verses:
  1: "ダリウス王[おう]は、自分[じぶん]の支配[しはい]下[か]にあるすべての者[もの]、自分の家[いえ]に生[う]まれたすべての者[もの]、メディアとペルシアのすべての貴族[きぞく]のために、大[おお]きな宴[うたげ]を催[もよお]し、"
  2: "自分のもとにあるすべての太守[たいしゅ]、将軍[しょうぐん]、地方[ちほう]の長[おさ]たち、すなわちインドからエチオピアに至[いた]る百二十七の太守領[たいしゅりょう]の者[もの]たちのためにも催[もよお]した。"
  3: "彼らは食[た]べ、飲[の]み、満[み]ち足[た]りてから退[しりぞ]いた。ダリウス王[おう]も寝室[しんしつ]へ下[さ]がって眠[ねむ]り、目[め]を覚[さ]ました。"
  4: "そのとき、王[おう]の体[からだ]を守[まも]る三人[さんにん]の若者[わかもの]、すなわち護衛[ごえい]たちが、互[たが]いに言[い]った。"
  5: "「わたしたちはそれぞれ、勝[まさ]る一[ひと]つの言葉[ことば]を言[い]おう。そして、その人[ひと]の言葉[ことば]がもう一方[いっぽう]より知恵[ちえ]があると見[み]えれば、ダリウス王[おう]はその人[ひと]に大[おお]きな贈[おく]り物[もの]と大[おお]きな勝利[しょうり]の誉[ほま]れを与[あた]える。"
  6: "また、紫[むらさき]の衣[ころも]を着[き]せ、金[きん]の器[うつわ]で飲[の]ませ、金[きん]の上[うえ]で眠[ねむ]らせ、金[きん]のくつわをつけた車[くるま]に乗[の]らせ、亜麻布[あまぬの]の冠[かんむり]をかぶらせ、首[くび]に首飾[くびかざ]りをつけさせる。"
  7: "また、その知恵[ちえ]のゆえにダリウスの次[つぎ]の席[せき]に座[すわ]り、ダリウスの親族[しんぞく]と呼ばれる。」"
  8: "そこで彼らは、それぞれ自分[じぶん]の言葉[ことば]を書[か]いて封[ふう]をし、ダリウス王[おう]の枕[まくら]の下[した]に置[お]いて、こう言[い]った。"
  9: "「王[おう]が目[め]を覚[さ]ましたなら、この書[しょ]を王に差[さ]し出[だ]す。王とペルシアの三人[さんにん]の貴族[きぞく]が、その人[ひと]の言葉[ことば]がより知恵[ちえ]があると裁[さば]いたなら、書[か]かれているとおり、その人[ひと]に勝利[しょうり]が与[あた]えられる。」"
  10: "一人[ひとり]は書[か]いた。「ぶどう酒は強[つよ]い。」"
  11: "もう一人[ひとり]は書[か]いた。「王[おう]は強[つよ]い。」"
  12: "三人目[さんにんめ]は書[か]いた。「女[おんな]たちは強[つよ]い。しかし、すべてに勝[まさ]るのは真理[しんり]である。」"
  13: "王[おう]が目[め]を覚[さ]ますと、彼らは書[しょ]を取[と]って王に渡[わた]し、王はそれを読[よ]んだ。"
  14: "王[おう]は人[ひと]を遣[つか]わして、ペルシアとメディアのすべての貴族[きぞく]、太守[たいしゅ]、将軍[しょうぐん]、地方[ちほう]の長[おさ]、および高官[こうかん]たちを呼[よ]び集[あつ]め、議場[ぎじょう]に座[すわ]った。そして、その書[しょ]が彼[かれ]らの前[まえ]で読[よ]まれた。"
  15: "王は言[い]った。「若者[わかもの]たちを呼[よ]べ。彼らが自分[じぶん]の言葉[ことば]を明[あき]らかにするであろう。」そこで、彼らは呼[よ]ばれて入[はい]って来[き]た。"
  16: "彼らは若者[わかもの]たちに言[い]った。「わたしたちに、書[か]かれていることについて告[つ]げよ。」"
  17: "ぶどう酒の強[つよ]さについて語[かた]った最初[さいしょ]の者[もの]が、こう言[い]い始[はじ]めた。"
  18: "「人[ひと]々[びと]よ、ぶどう酒はどれほど強[つよ]いことか。それは、飲[の]むすべての人[ひと]の思[おも]いを迷[まよ]わせる。"
  19: "それは、王[おう]と孤児[みなしご]の思[おも]いを一[ひと]つにし、奴隷[どれい]と自由人[じゆうびと]、貧[まず]しい者[もの]と富[とみ]める者[もの]の思[おも]いも一[ひと]つにする。"
  20: "また、すべての思[おも]いを恐[おそ]れのなさと喜[よろこ]びに変[か]え、もはやどの悲[かな]しみも、どの借金[しゃっきん]も覚[おぼ]えていないようにする。"
  21: "また、すべての心[こころ]を富[とみ]ませ、王[おう]のことも太守[たいしゅ]のことも覚[おぼ]えず、すべての人[ひと]に財産[ざいさん]の話[はなし]をさせる。"
  22: "また、彼らが飲[の]むときには、友[とも]や兄弟[きょうだい]に親[した]しむことを覚[おぼ]えておらず、しばらくすると剣[つるぎ]を抜[ぬ]く。"
  23: "そして、ぶどう酒から覚[さ]めると、自分[じぶん]がしたことを覚[おぼ]えていない。"
  24: "人[ひと]々[びと]よ、このように行[おこな]わせるのだから、ぶどう酒は強[つよ]いではないか。」こう言[い]って、彼は黙[だま]った。"

notes:
  1: "δοχὴν μεγάλην — большой пир (δοχή). πᾶσιν τοῖς ὑπ᾿ αὐτὸν — всем подвластным ему (ὑπό + acc.). οἰκογενέσιν — домочадцам, рождённым в доме (οἰκογενής); слав. «иже от дому рода его». μεγιστᾶσιν τῆς Μηδίας καὶ τῆς Περσίδος — вельможам Мидии и Персии (μεγιστάν)."
  2: "σατράπαι, στρατηγοί, τοπάρχαι — сатрапы, военачальники, областеначальники (σατράπης — 太守, στρατηγός — 将軍, τοπάρχης — 地方の長). ἀπὸ τῆς Ἰνδικῆς μέχρι τῆς Αἰθιοπίας — от Индии до Эфиопии. ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις — в 127 сатрапиях (σατραπεία, 太守領)."
  3: "ἐφάγοσαν καὶ ἐπίοσαν — ели и пили (ἐσθίω, πίνω). ἐμπλησθέντες ἀνέλυσαν — насытившись, разошлись (ἐμπίπλημι, ἀναλύω). εἰς τὸν κοιτῶνα — в спальню (κοιτών). ἔξυπνος ἐγένετο — пробудился (ἔξυπνος)."
  4: "οἱ τρεῖς νεανίσκοι οἱ σωματοφύλακες — трое юношей-телохранителей (νεανίσκος, σωματοφύλαξ). οἱ φυλάσσοντες τὸ σῶμα τοῦ βασιλέως — охраняющие тело царя (φυλάσσω). εἶπαν ἕτερος πρὸς τὸν ἕτερον — сказали друг другу."
  5: "Εἴπωμεν ἕκαστος ἡμῶν ἕνα λόγον — скажем каждый из нас одно слово (λόγος). ὃς ὑπερισχύσει — которое пересилит (ὑπερισχύω). οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ σοφώτερον — чьё слово окажется мудрее (φαίνω, ῥῆμα, σοφός). δωρεὰς μεγάλας καὶ ἐπινίκια μεγάλα — великие дары и великие победные награды (δωρεά, ἐπινίκιον); слав. «почести великия». Здесь начинается прямая речь трёх (5–7)."
  6: "πορφύραν περιβαλέσθαι — облачиться в порфиру (πορφύρα). ἐν χρυσώμασιν πίνειν — пить из золотых сосудов (χρύσωμα). ἐπὶ χρυσῷ καθεύδειν — спать на золоте. ἅρμα χρυσοχάλινον — колесница с золотой уздой (χρυσοχάλινος). κίδαριν βυσσίνην — кидар из виссона (κίδαρις, βύσσινος). μανιάκην περὶ τὸν τράχηλον — ожерелье на шее (μανιάκης); слав. «гривну окрест выи». Сказуемое — δώσει из ст. 5, поэтому в тексте причинение (着せ…)."
  7: "δεύτερος καθιεῖται Δαρείου — сядет вторым после Дария (καθίζω). διὰ τὴν σοφίαν αὐτοῦ — за мудрость его. συγγενὴς Δαρείου κληθήσεται — будет назван родственником Дария (συγγενής); здесь уже будущее время, поэтому без причинения, как в греческом. Прямая речь 5–7 кончается."
  8: "γράψαντες ἕκαστος τὸν ἑαυτοῦ λόγον — написав каждый своё слово. ἐσφραγίσαντο — запечатали (σφραγίζω). ἔθηκαν ὑπὸ τὸ προσκεφάλαιον — положили под изголовье (προσκεφάλαιον). καὶ εἶπαν — и сказали: в csl этих слов нет, но в LXX есть."
  9: "Ὅταν ἐγερθῇ ὁ βασιλεύς — когда царь встанет (ἐγείρω). δώσουσιν αὐτῷ τὸ γράμμα — дадут ему письмо (γράμμα). ὃν ἂν κρίνῃ — кого признает (κρίνω). οἱ τρεῖς μεγιστᾶνες τῆς Περσίδος — трое вельмож Персии. αὐτῷ δοθήσεται τὸ νῖκος — ему будет дана победа (νῖκος); слав. «победа». καθὼς γέγραπται — как написано."
  10: "ὁ εἷς ἔγραψεν — один написал. Ὑπερισχύει ὁ οἶνος — «вино пересиливает» (ὑπερισχύω, οἶνος); прямая речь — содержание написанного. csl 3:10 совпадает."
  11: "ὁ ἕτερος ἔγραψεν — другой написал. Ὑπερισχύει ὁ βασιλεύς — «царь пересиливает»."
  12: "ὁ τρίτος ἔγραψεν — третий написал. Ὑπερισχύουσιν αἱ γυναῖκες — «женщины пересиливают». ὑπὲρ δὲ πάντα νικᾷ ἡ ἀλήθεια — «а над всем побеждает истина» (νικάω, ἀλήθεια); слав. «паче же всех побеждает истина»."
  13: "ὅτε ἐξηγέρθη ὁ βασιλεύς — когда царь пробудился (ἐξεγείρω). λαβόντες τὸ γράμμα ἔδωκαν αὐτῷ — взяв письмо, дали ему. ἀνέγνω — он прочитал (ἀναγινώσκω)."
  14: "ἐξαποστείλας ἐκάλεσεν — послав, созвал (ἐξαποστέλλω, καλέω). μεγιστᾶνας … σατράπας καὶ στρατηγοὺς καὶ τοπάρχας καὶ ὑπάτους — вельмож, сатрапов, военачальников, областеначальников и сановников (ὕπατος; слав. «ипатов»). ἐκάθισεν ἐν τῷ χρηματιστηρίῳ — сел в совещательной палате (χρηματιστήριον). ἀνεγνώσθη τὸ γράμμα ἐνώπιον αὐτῶν — письмо было прочитано перед ними. csl 3:14–15 делят этот стих."
  15: "Καλέσατε τοὺς νεανίσκους — позовите юношей. δηλώσουσιν τοὺς λόγους αὐτῶν — они объявят слова свои (δηλόω). ἐκλήθησαν καὶ εἰσήλθοσαν — были позваны и вошли. csl 3:16 = gr 3:15."
  16: "Ἀπαγγείλατε ἡμῖν περὶ τῶν γεγραμμένων — возвестите нам о написанном (ἀπαγγέλλω). csl 3:17a = gr 3:16; в csl далее сразу начинается речь первого."
  17: "ἤρξατο ὁ πρῶτος ὁ εἴπας περὶ τῆς ἰσχύος τοῦ οἴνου — начал первый, сказавший о силе вина (ἰσχύς). ἔφη οὕτως — сказал так. csl 3:17b = gr 3:17; здесь начинается речь первого (18–24)."
  18: "Ἄνδρες — мужи (обращение). πῶς ὑπερισχύει ὁ οἶνος — как пересиливает вино. πλανᾷ τὴν διάνοιαν — вводит в заблуждение ум (πλανάω, διάνοια); слав. «прельщает»."
  19: "τοῦ βασιλέως καὶ τοῦ ὀρφανοῦ ποιεῖ τὴν διάνοιαν μίαν — делает ум царя и сироты одним (ὀρφανός). οἰκέτου καὶ ἐλευθέρου — раба и свободного (οἰκέτης, ἐλεύθερος). πένητος καὶ πλουσίου — бедного и богатого (πένης, πλούσιος)."
  20: "μεταστρέφει εἰς εὐωχίαν καὶ εὐφροσύνην — превращает в пиршество и веселье (μεταστρέφω, εὐωχία, εὐφροσύνη); слав. «в безстрашие и веселие» — в тексте церковное 恐れのなさ; LXX εὐωχία «пиршество» — вариант, отмечен здесь. οὐ μέμνηται πᾶσαν λύπην καὶ πᾶν ὀφείλημα — не помнит никакой печали и никакого долга (μέμνημαι, λύπη, ὀφείλημα)."
  21: "πάσας καρδίας ποιεῖ πλουσίας — делает все сердца богатыми. οὐ μέμνηται βασιλέα οὐδὲ σατράπην — не помнит ни царя, ни сатрапа. πάντα διὰ ταλάντων ποιεῖ λαλεῖν — «заставляет всех говорить через таланты» (τάλαντον — денежная единица; слав. «по талантом»); в тексте 財産, понимание «о своих дарованиях» — в ru, не в тексте."
  22: "φιλιάζειν φίλοις καὶ ἀδελφοῖς — дружить с друзьями и братьями (φιλιάζω). μετ᾿ οὐ πολὺ σπῶνται μαχαίρας — вскоре обнажают мечи (σπάω, μάχαιρα)."
  23: "ὅταν ἀπὸ τοῦ οἴνου γενηθῶσιν — когда отрезвеют от вина (γίνομαι ἀπό). οὐ μέμνηται ἃ ἔπραξαν — не помнят, что сделали (πράσσω)."
  24: "οὐχ ὑπερισχύει ὁ οἶνος, ὅτι οὕτως ἀναγκάζει ποιεῖν — не пересиливает ли вино, если так принуждает делать (ἀναγκάζω). ἐσίγησεν οὕτως εἴπας — замолчал, сказав так (σιγάω). Здесь речь первого кончается; речи второго и третьего — в гл. 4."
