# jp-box, Второзаконие, глава 32. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc (32:1–43) — свидетель
# церковного чтения старого языка, в текст не вносился.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 32: песнь Моисея (1–43) и последние повеления (44–52).
# Песнь — поэзия: параллелизмы сохранены (4, 5, 6, 11, 13, 21, 24, 30, 39, 43), полустишия
# не сглажены, антропоморфизмы не смягчены (22 — огонь до ада, 41–42 — меч и кровь).
# Кавычки: вся песнь — речь Моисея, 「…」 с 1 по 43 (открывается в 1 после повествовательного
# ввода, закрывается в 43). Голос Бога внутри песни (20, 26, 37–42) вторыми кавычками не
# отбивается: вся песнь — пророческая речь, в которой говорит и Сам Господь. 『…』 — только
# прямая речь врагов (27), как речь врага в Исх 15:9. 44–52 — повествование и речь;
# слова Господа Моисею (49–52) — 「…」.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по выгрузке). Красного нет.
# LXX: 32:4 — начинается θεός, а не «твердыня» (масоретское צור); 32:8 — «по числу ангелов
# Божиих» (не сынов Израилевых); 32:13 — мёд из скалы, κηρίον в стихе нет; 32:15 — «возлюбленный»
# (Израиль); 32:43 — порядок «сыны Божии» — «ангелы Божии» (в csl наоборот); 32:44 — в gr
# повторяет 31:22 и добавляет вход Моисея с Иисусом (в csl только вторая часть).
# Сносок ⟨…⟩ нет: 鷲, 蝮, 竜, 陰府 уже в корпусе. jp-ni не использовался.

