verses:
  1: "モーセはイスラエルの全会衆[ぜんかいしゅう]の耳[みみ]に、この歌[うた]の言葉[ことば]を最後[さいご]まで語[かた]った。「天[てん]よ、聞[き]け。わたしは語ろう。地[ち]よ、わたしの口[くち]の言葉を聞け。"
  2: "わたしの語[かた]りは雨[あめ]のように降[ふ]り注[そそ]ぎ、わたしの言葉[ことば]は露[つゆ]のように滴[したた]るように。若草[わかくさ]の上[うえ]の小雨[こさめ]のように、草[くさ]の上の夕立[ゆうだち]のように。"
  3: "主[しゅ]の名[な]をわたしは唱[とな]えた。わたしたちの神[かみ]に威厳[いげん]を帰[き]せよ。"
  4: "神[かみ]の業[わざ]は真実[しんじつ]であり、そのすべての道[みち]は裁[さば]きである。神は信[しん]実[じつ]で、不義[ふぎ]はない。主[しゅ]は正[ただ]しく、聖[せい]である。"
  5: "彼[かれ]らは罪[つみ]を犯[おか]した。彼の子[こ]らではなく、傷[きず]ある子ら、曲[ま]がり、ゆがんだ世代[せだい]である。"
  6: "愚[おろ]かな、知恵[ちえ]のない民[たみ]よ。あなたがたは主[しゅ]にこのように報[むく]いるのか。あなたを御自身[ごじしん]のものとして得[え]、造[つく]り、建[た]てたのは、あなたの父[ちち]ではないか。"
  7: "昔[むかし]の日[ひ]を思[おも]い起[お]こし、代々[だいだい]の年[とし]を悟[さと]れ。あなたの父[ちち]に問[と]え。そうすれば、彼[かれ]はあなたに告[つ]げる。あなたの長老[ちょうろう]たちに問え。そうすれば、彼らはあなたに言[い]う。"
  8: "いと高[たか]き方[かた]が諸国[しょこく]を分[わ]け、アダムの子[こ]らを散[ち]らされたとき、神[かみ]の使[つか]いたちの数[かず]に従[したが]って、諸国の境[さかい]を定[さだ]められた。"
  9: "主[しゅ]の分[ぶん]はその民[たみ]ヤコブ、その嗣業[しぎょう]の測[はか]り縄[なわ]はイスラエルである。"
  10: "主[しゅ]は彼[かれ]を荒野[こうや]の地[ち]、渇[かわ]きと熱[あつ]さの水[みず]なき地で満[み]たし、これを囲[かこ]み、教[おし]え、目の瞳[ひとみ]のように守[まも]られた。"
  11: "鷲[わし]がその巣[す]を覆[おお]い、雛[ひな]の上[うえ]に慕[した]い寄[よ]り、翼[つばさ]を広[ひろ]げて彼[かれ]らを受[う]け、その背[せ]に載[の]せて運[はこ]ぶように、"
  12: "主[しゅ]はただ一人[ひとり]で彼[かれ]らを導[みちび]き、彼らとともには他[ほか]の神[かみ]はいなかった。"
  13: "主[しゅ]は彼[かれ]らを地[ち]の高[たか]い所[ところ]に上[のぼ]らせ、畑[はたけ]の産物[さんぶつ]を食[た]べさせ、岩[いわ]から蜜[みつ]を、固[かた]い岩から油[あぶら]を吸[す]わせ、"
  14: "牛[うし]の凝乳[ぎょうにゅう]、羊[ひつじ]の乳[ちち]、子羊[こひつじ]と雄羊[おひつじ]の脂肪[しぼう]、雄牛[おうし]の子[こ]らと雄山羊[おやぎ]、小麦[こむぎ]の腎臓[じんぞう]の脂肪とともに、ぶどうの血[ち]であるぶどう酒[しゅ]を、彼[かれ]らは飲[の]んだ。"
  15: "ヤコブは食[た]べて満[み]ち足[た]り、愛[あい]された者[もの]は蹴[け]り上[あ]げた。肥[こ]え、太[ふと]り、広[ひろ]がった。そして彼[かれ]を造[つく]った神[かみ]を捨[す]て、その救[すく]いの神から遠[とお]ざかった。"
  16: "彼[かれ]らは他[ほか]の神々[かみがみ]によってわたしを怒[いか]らせ、その憎[にく]むべきものによってわたしを苦[くる]しめた。"
  17: "彼[かれ]らは神[かみ]にではなく悪霊[あくりょう]に犠牲[ぎせい]を捧[ささ]げ、知[し]らなかった神々[かみがみ]、新[あたら]しく、近[ちか]ごろ来[き]た者[もの]たち、彼らの父祖[ふそ]たちが知らなかった者たちに犠牲を捧げた。"
  18: "あなたを生[う]んだ神[かみ]をあなたは捨[す]て、あなたを養[やしな]う神を忘[わす]れた。"
  19: "主[しゅ]は見[み]て嫉[ねた]み、その息子[むすこ]たちと娘[むすめ]たちの怒[いか]りのゆえに激[はげ]しく怒られた。"
  20: "そして言[い]われた。わたしは彼[かれ]らから顔[かお]を隠[かく]し、彼らの終[お]わりがどうなるかを見[み]よう。彼らは曲[ま]がった世代[せだい]、信[しん]実[じつ]のない子[こ]らであるからだ。"
  21: "彼[かれ]らは神[かみ]ではない者[もの]によってわたしを妬[ねた]ませ、むなしい偶像[ぐうぞう]によってわたしを怒[いか]らせた。わたしもまた、民[たみ]ではない者によって彼らを妬ませ、愚[おろ]かな民によって彼らを怒らせる。"
  22: "わたしの怒[いか]りから火[ひ]が燃[も]え上[あ]がり、陰府[よみ]の底[そこ]まで焼[や]き、地[ち]とその産物[さんぶつ]を食[く]い尽[つ]くし、山々[やまやま]の基[もとい]を焼く。"
  23: "わたしは彼[かれ]らの上[うえ]に災[わざわ]いを集[あつ]め、わたしの矢[や]を彼らに射[い]尽[つ]くす。"
  24: "彼[かれ]らは飢[う]えに溶[と]け、鳥[とり]の食[た]い物[もの]となり、癒[いや]しがたい背[せ]の引[ひ]きつりに倒[たお]れる。わたしは獣[けもの]の歯[は]を、地[ち]を這[は]う者[もの]の怒[いか]りとともに彼らに送[おく]る。"
  25: "外[そと]では剣[つるぎ]が、内[うち]では恐[おそ]れが、彼[かれ]らから子[こ]を奪[うば]う。若者[わかもの]も処女[おとめ]も、乳飲[ちのみ]み子[ご]も、老[お]いた者[もの]も。"
  26: "わたしは、彼[かれ]らを散[ち]らし、人[ひと]々[びと]の間[あいだ]から彼らの記憶[きおく]を絶[た]やそうと言[い]った。"
  27: "しかし、敵[てき]の怒[いか]りのゆえに、彼[かれ]らが長[なが]く栄[さか]えず、敵対[てきたい]する者[もの]たちが『わたしたちの手[て]は高[たか]い。これはすべて主[しゅ]がなさったのではない』と言[い]わないために、わたしはそうしなかった。"
  28: "彼[かれ]らは思[おも]んぱかりを失[うしな]った民[たみ]であり、彼らの中[なか]に悟[さと]りはない。"
  29: "彼[かれ]らはこれを悟[さと]らなかった。来[きた]るべき時[とき]に、これを受[う]け入[い]れるがよい。"
  30: "どうして一人[ひとり]が千[せん]を追[お]い、二人[ふたり]が一万[いちまん]を追い払[はら]うのか。彼[かれ]らの神[かみ]が彼らを売[う]り渡[わた]すことも、主[しゅ]が彼らを引[ひ]き渡[わた]すこともなかったなら。"
  31: "彼[かれ]らの神々[かみがみ]はわたしたちの神[かみ]のようではない。それゆえ、わたしたちの敵[てき]は愚[おろ]かである。"
  32: "彼[かれ]らのぶどうの木[き]はソドムのぶどうの木から、ゴモラの枝[えだ]から出[で]ている。彼らのぶどうは胆汁[たんじゅう]のぶどう、その房[ふさ]は苦[にが]い。"
  33: "彼[かれ]らのぶどう酒[しゅ]は竜[りゅう]の怒[いか]り、蝮[まむし]の癒[いや]しがたい怒りである。"
  34: "見[み]よ、これはわたしのもとに集[あつ]められ、わたしの宝庫[ほうこ]に封[ふう]じられているではないか。"
  35: "復讐[ふくしゅう]の日[ひ]、すなわち彼[かれ]らの足[あし]が滑[すべ]る時[とき]に、わたしは報[むく]いる。彼らの滅[ほろ]びの日は近[ちか]く、備[そな]えられたことがあなたがたに迫[せま]っているからである。"
  36: "主[しゅ]はその民[たみ]を裁[さば]き、その僕[しもべ]たちのために惜[お]しまれる。彼[かれ]らが力[ちから]を失[うしな]い、襲[おそ]いの中[なか]で尽[つ]き果[は]て、弱[よわ]り果てているのを見[み]られるからである。"
  37: "そして主[しゅ]は言[い]われた。彼[かれ]らの神々[かみがみ]はどこにいるのか。彼らが依[よ]り頼[たの]んだ者[もの]たち、"
  38: "その犠牲[ぎせい]の脂肪[しぼう]を食[た]べ、その灌祭[かんさい]のぶどう酒[しゅ]を飲[の]んだ者[もの]たちは、どこにいるのか。彼[かれ]らは起[た]ち上[あ]がって、あなたがたを助[たす]け、あなたがたの覆[おお]いとなればよい。"
  39: "見[み]よ、見よ。わたしこそがそれである。わたしのほかに神[かみ]はない。わたしは殺[ころ]し、また生[い]かす。わたしは打[う]ち、また癒[いや]す。わたしの手[て]から救[すく]い出[だ]す者[もの]はいない。"
  40: "わたしは天[てん]に向[むか]って手[て]を上[あ]げ、わたしの右[みぎ]の手によって誓[ちか]って言[い]う。わたしは永遠[えいえん]に生[い]きる。"
  41: "わたしは稲妻[いなずま]のように剣[つるぎ]を研[と]ぎ、わたしの手[て]が裁[さば]きを執[と]る。わたしは敵[てき]に復讐[ふくしゅう]し、わたしを憎[にく]む者[もの]に報[むく]いる。"
  42: "わたしはわたしの矢[や]を血[ち]に酔[よ]わせ、わたしの剣[つるぎ]は肉[にく]を食[た]べる。傷[きず]ついた者[もの]と捕囚[ほしゅう]の者の血、敵[てき]の長[おさ]たちの頭[あたま]の血によって。"
  43: "天[てん]よ、彼[かれ]とともに喜[よろこ]べ。神[かみ]の子[こ]らはすべて彼にひれ伏[ふ]せよ。諸国[しょこく]の民[たみ]よ、彼の民とともに喜べ。神の使[つか]いたちはすべて彼にあって強[つよ]くあれ。彼はその子らたちの血[ち]のために復讐[ふくしゅう]し、その敵[てき]に報[むく]い、憎[にく]む者[もの]に報い、主[しゅ]はその民の地[ち]を清[きよ]められるからである。」"
  44: "モーセはその日[ひ]、この歌[うた]を書[か]き、イスラエルの子[こ]らに教[おし]えた。モーセは入[はい]って行[い]き、民[たみ]の耳[みみ]に、自分[じぶん]とヌンの子ヨシュアとで、この律法[りっぽう]のすべての言葉[ことば]を語[かた]った。"
  45: "モーセはすべてのイスラエルに語[かた]り終[お]え、"
  46: "彼[かれ]らに言[い]った。「今日[きょう]、わたしがあなたがたに証[あかし]するこれらすべての言葉[ことば]に、心[こころ]を向[む]けなさい。それをあなたがたの子[こ]らに命[めい]じ、この律法[りっぽう]のすべての言葉を守[まも]って行[おこな]わせなさい。"
  47: "これはあなたがたにとって空[むな]しい言葉[ことば]ではない。これはあなたがたの命[いのち]である。この言葉によって、あなたがたは、ヨルダン川[がわ]を渡[わた]って入[はい]り、嗣業[しぎょう]として受[う]け継[つ]ごうとしている地[ち]で、長[なが]く生[い]きるであろう。」"
  48: "その日[ひ]、主[しゅ]はモーセに言[い]われた。"
  49: "「このアバリムの山[やま]、すなわちネボ山に上[のぼ]れ。それはモアブの地[ち]にあって、エリコの向[む]かいにある。あなたは、わたしがイスラエルの子[こ]らに所有[しょゆう]として与[あた]えるカナンの地を見[み]よ。"
  50: "そして、あなたが上[のぼ]って行[い]くその山[やま]で死[し]んで、あなたの民[たみ]に加[くわ]えられなさい。あなたの兄弟[きょうだい]アロンがホル山で死んで、その民に加えられたように。"
  51: "あなたがたは、カデシュの争[あらそ]いの水[みず]のほとりで、イスラエルの子[こ]らの間[あいだ]でわたしの言葉[ことば]に背[そむ]き、イスラエルの子らの間でわたしを聖[せい]なる者[もの]として認[みと]めなかったからである。"
  52: "あなたは向[む]こうの地[ち]を見[み]るが、そこへは入[はい]らない。」"

notes:
  1: "Πρόσεχε, οὐρανέ — внимай, небо (προσέχω). λαλήσω — буду говорить. ἀκουέτω γῆ — да слышит земля (императив 3 л.). ῥήματα ἐκ στόματός μου — слова из уст моих. Перед песнью — повествовательный ввод: Моисей говорит в уши всей церкви (ἐκκλησία)."
  2: "προσδοκάσθω — да будет ожидаемо, да снизойдёт (προσδοκάω). ἀπόφθεγμα — изречение. ὑετός — дождь. δρόσος — роса. ὄμβρος — ливень. ἄγρωστις — пырей, зелень (若草). νιφετός — снегопад, ливень (夕立)."
  3: "ὄνομα κυρίου ἐκάλεσα — имя Господне призвал, возгласил. δότε μεγαλωσύνην — воздайте величие (μεγαλωσύνη). τῷ θεῷ ἡμῶν — Богу нашему."
  4: "ἀληθινά — истинны. κρίσεις — суды. πιστός — верен. οὐκ ἔστιν ἀδικία — нет неправды. δίκαιος καὶ ὅσιος — праведен и преподобен (ὅσιος — святой, благочестивый). В LXX стих начинается θεός, а не «твердыня» (масоретское צור); слав. «Бог, истинна дела его»."
  5: "ἡμάρτοσαν — согрешили. οὐκ αὐτῷ τέκνα μωμητά — не Ему дети порочные (μωμητός — «с пороком, порицаемый»); синтаксис сжатый, слав. «не того чада порочная». σκολιός — кривой. διεστραμμένος — извращённый."
  6: "ταῦτα … ἀνταποδίδoτε — так воздаёте (ἀνταποδίδωμι). λαὸς μωρός — народ глупый. ἐκτήσατό σε — приобрёл тебя (κτάομαι). ἐποίησέν σε — сотворил. ἔκτισέν σε — основал, создал (κτίζω)."
  7: "μνήσθητε ἡμέρας αἰῶνος — вспомните дни вечности, древние. σύνετε ἔτη γενεᾶς γενεῶν — уразумейте годы рода родов. ἐπερώτησον — спроси. ἀναγγελεῖ σοι — возвестит тебе. πρεσβύτεροι — старейшины."
  8: "διεμέριζεν ὁ ὕψιστος ἔθνη — разделял Всевышний народы. διέσπειρεν υἱοὺς Αδαμ — рассеял сынов Адама. ὅρια ἐθνῶν — пределы народов. κατὰ ἀριθμὸν ἀγγέλων θεοῦ — по числу ангелов Божиих (в масоретском — «сынов Израилевых», в LXX — ангелы)."
  9: "μερὶς κυρίου — часть Господня. λαὸς αὐτοῦ Ιακωβ — народ Его Иаков. σχοίνισμα κληρονομίας — вервь, мерительный шнур наследия (嗣業の測り縄)."
  10: "αὐτάρκησεν αὐτὸν — удовлетворил, насытил его (αὐταρκέω; слав. «удовли»). ἐν δίψει καύματος ἐν ἀνύδρῳ — в жажде зноя, в безводной. ἐκύκλωσεν — окружил. ἐπαίδευσεν — наставил, воспитал (παιδεύω). διεφύλαξεν — сохранил. ὡς κόραν ὀφθαλμοῦ — как зеницу ока (κόρη — «зрачок»)."
  11: "σκεπάσαι νοσσιάν — покрыть гнездо (σκεπάζω). ἐπεπόθησεν ἐπὶ τοῖς νεοσσοῖς — возжелал к птенцам (ἐπιποθέω). διεὶς τὰς πτέρυγας — распростёрши крылья (διΐημι). ἀνέλαβεν ἐπὶ τῶν μεταφρένων — поднял на хребет, на плечи (μετάφρενον — «спина»)."
  12: "μόνος ἦγεν — один вёл. οὐκ ἦν μετ᾽ αὐτῶν θεὸς ἀλλότριος — не было с ними чужого бога."
  13: "ἀνεβίβασεν ἐπὶ τὴν ἰσχὺν τῆς γῆς — возвёл на силу земли, т. е. на высоту (ἰσχύς — «крепость»). ἐψώμισεν — накормил (ψωμίζω). ἐθήλασαν — сосали (θηλάζω). μέλι ἐκ πέτρας — мёд из скалы. ἔλαιον ἐκ στερεᾶς πέτρας — елей из твёрдой скалы."
  14: "βούτυρον βοῶν — масло, творог коров (βούτυρον). γάλα προβάτων — молоко овец. στέαρ ἀρνῶν καὶ κριῶν — тук агнцев и овнов. υἱοὶ ταύρων — сыны быков, молодые быки. στέαρ νεφρῶν πυροῦ — тук почек пшеницы, т. е. лучшая пшеница (сакральная формула); оставлено буквально. αἷμα σταφυλῆς — кровь грозди, вино."
  15: "ἀπελάκτισεν — лягнул (ἀπολακτίζω). ὁ ἠγαπημένος — возлюбленный (Израиль). ἐλιπάνθη — утучнел (λιπαίνω). ἐπαχύνθη — отолстел (παχύνω). ἐπλατύνθη — разжирел, расширился (πλατύνω). θεὸν τὸν ποιήσαντα — Бога, создавшего его. ἀπέστη ἀπὸ θεοῦ σωτῆρος — отступил от Бога, спасающего его."
  16: "παρώξυνάν με ἐπ᾽ ἀλλοτρίοις — раздражили Меня чужими (богами). βδελύγματα — мерзости. ἐξεπίκρανάν με — огорчили Меня (ἐκπικραίνω)."
  17: "ἔθυσαν δαιμονίοις καὶ οὐ θεῷ — принесли жертвы демонам, а не Богу. καινοὶ πρόσφατοι ἥκασιν — новые, недавно пришедшие пришли. οὓς οὐκ ᾔδεισαν οἱ πατέρες — которых не знали отцы."
  18: "τὸν γεννήσαντά σε — родившего тебя (γεννάω). ἐγκατέλιπες — оставил. ἐπελάθου — забыл. τοῦ τρέφοντός σε — питающего тебя (τρέφω)."
  19: "ἐζήλωσεν — возревновал (ζηλόω). παρωξύνθη — раздражился. δι᾽ ὀργὴν υἱῶν καὶ θυγατέρων — из-за гнева сыновей и дочерей (т. е. их гнева против Него)."
  20: "ἀποστρέψω τὸ πρόσωπόν μου — отвращу лицо Моё. ἐπ᾽ ἐσχάτων — в конце. γενεὰ ἐξεστραμμένη — род извращённый. οἷς οὐκ ἔστιν πίστις — в которых нет верности (πίστις — «верность»)."
  21: "παρεζήλωσάν με ἐπ᾽ οὐ θεῷ — раздражили Меня не-Богом. εἴδωλα — идолы. κἀγὼ παραζηλώσω — и Я раздражу. ἐπ᾽ οὐκ ἔθνει — не-народом. ἔθνος ἀσύνετον — народ неразумный. παροργιῶ — огорчу, прогневаю."
  22: "πῦρ ἐκκέκαυται ἐκ τοῦ θυμοῦ μου — огонь возжжён от гнева Моего. ἕως ᾅδου κάτω — до ада внизу (陰府の底). καταφάγεται — пожрёт. φλέξει θεμέλια ὀρέων — сожжёт основания гор."
  23: "συνάξω εἰς αὐτοὺς κακά — соберу на них беды. τὰ βέλη μου συντελέσω — стрелы Мои истощу, пошлю до конца."
  24: "τηκόμενοι λιμῷ — истаивая от голода (τήκω). βρῶσις ὀρνέων — снедь птиц. ὀπισθότονος ἀνίατος — неисцелимый столбняк (букв. «натяжение назад»; слав. «горб неисцелен»). ὀδόντας θηρίων — зубы зверей. μετὰ θυμοῦ συρόντων ἐπὶ γῆς — с яростью ползающих по земле."
  25: "ἔξωθεν ἀτεκνώσει μάχαιρα — извне лишит детей меч (ἀτεκνόω). ἐκ τῶν ταμιείων φόβος — из хранилищ, т. е. из домов, страх. νεανίσκος σὺν παρθένῳ — юноша с девицей. θηλάζων — грудной. καθεστηκὼς πρεσβύτης — зрелый старец."
  26: "εἶπα — я сказал. διασπερῶ — рассею. παύσω … τὸ μνημόσυνον — прекращу память (παύω). ἐξ ἀνθρώπων — из среды людей. Речь Господа в песни не отбивается кавычками, см. заголовок."
  27: "εἰ μὴ δι᾽ ὀργὴν ἐχθρῶν — если не ради гнева врагов, т. е. «но не сделал этого». ἵνα μὴ μακροχρονίσωσιν — чтобы не долголетствовали (μακροχρονίζω). συνεπιθῶνται — не напали вместе (συνεπιτίθημι). ἡ χεὶρ ἡμῶν ἡ ὑψηλή — рука наша высока. Слова врагов — 『…』."
  28: "ἔθνος ἀπολωλεκὸς βουλήν — народ, погубивший совет, разум (βουλή). ἐπιστήμη — знание, разумение."
  29: "οὐκ ἐφρόνησαν συνιέναι — не уразумели понять (φρονέω). καταδεξάσθωσαν — да примут (императив 3 л., καταδέχομαι). εἰς τὸν ἐπιόντα χρόνον — в грядущее время. В ru по масоретскому — пожелание «о, если бы»."
  30: "πῶς διώξεται εἷς χιλίους — как один погонит тысячу. δύο μετακινήσουσιν μυριάδας — двое сдвинут мириады, тьмы. εἰ μὴ ὁ θεὸς ἀπέδοτο — если не Бог предал, продал (ἀποδίδωμι). παρέδωκεν — передал."
  31: "οὐκ ἔστιν ὡς ὁ θεὸς ἡμῶν οἱ θεοὶ αὐτῶν — не как Бог наш боги их. ἀνόητοι — неразумны. В ru по масоретскому: «сами враги наши судьи в том»."
  32: "ἄμπελος — виноградная лоза. κληματίς — ветвь, лоза (слав. «розга»). σταφυλὴ χολῆς — гроздь желчи. βότρυς πικρίας — кисть горечи."
  33: "θυμὸς δρακόντων — ярость драконов. ἀσπίδων — аспидов (蝮). ἀνίατος — неисцелимая."
  34: "συνῆκται παρ᾽ ἐμοί — собрано у Меня. ἐσφράγισται — запечатано (σφραγίζω). θησαυροί — сокровищницы."
  35: "ἐν ἡμέρᾳ ἐκδικήσεως — в день отмщения. ἀνταποδώσω — воздам. ὅταν σφαλῇ ὁ ποὺς αὐτῶν — когда поколеблется нога их (σφάλλω). πάρεστιν ἕτοιμα ὑμῖν — предстоит готовое вам (мн. ч.; слав. «предстоят готовая вам»)."
  36: "κρινεῖ κύριος τὸν λαὸν αὐτοῦ — будет судить Господь народ Свой. ἐπὶ τοῖς δούλοις παρακληθήσεται — о рабах Своих умилосердится (παρακαλέω). παραλελυμένους — расслабленных (παραλύω). ἐκλελοιπότας ἐν ἐπαγωγῇ — оскудевших в нашествии (ἐκλείπω). παρειμένους — ослабевших, брошенных (παρίημι)."
  37: "Ποῦ εἰσιν οἱ θεοὶ αὐτῶν — где боги их. ἐφ᾽ οἷς ἐπεποίθεισαν — на которых уповали (πείθω, perfect). Стих переходит в 38."
  38: "τὸ στέαρ τῶν θυσιῶν — тук жертв. οἶνος τῶν σπονδῶν — вино возлияний. ἀναστήτωσαν — да восстанут. βοηθησάτωσαν — да помогут. σκεπασταί — покровители, покров (σκεπαστής)."
  39: "ἴδετε ἴδετε — смотрите, смотрите. ἐγώ εἰμι — Я есмь. οὐκ ἔστιν θεὸς πλὴν ἐμοῦ — нет Бога кроме Меня. ἀποκτενῶ καὶ ζῆν ποιήσω — умерщвляю и жить творю. πατάξω κἀγὼ ἰάσομαι — поражу и Я исцелю. ἐξελεῖται ἐκ τῶν χειρῶν — избавит от рук."
  40: "ἀρῶ εἰς τὸν οὐρανὸν τὴν χεῖρά μου — подниму на небо руку Мою. ὀμοῦμαι τῇ δεξιᾷ — буду клясться десницей. Ζῶ ἐγὼ εἰς τὸν αἰῶνα — живу Я во век."
  41: "παροξυνῶ ὡς ἀστραπὴν τὴν μάχαιραν — изострю, как молнию, меч (παροξύνω). ἀνθέξεται κρίματος ἡ χείρ — приимет суд рука (ἀντέχω). ἀνταποδώσω δίκην — воздам мзду, отмщу."
  42: "μεθύσω τὰ βέλη — упою стрелы (μεθύσκω). καταφάγεται κρέα — пожрёт плоть. ἀφ᾽ αἵματος τραυματιῶν καὶ αἰχμαλωσίας — от крови раненых и плена. ἀπὸ κεφαλῆς ἀρχόντων ἐχθρῶν — от головы князей врагов."
  43: "εὐφράνθητε, οὐρανοί — веселитесь, небеса. ἅμα αὐτῷ — вместе с Ним. προσκυνησάτωσαν — да поклонятся. υἱοὶ θεοῦ — сыны Божии. ἐνισχυσάτωσαν — да укрепятся (ἐνισχύω). ἄγγελοι θεοῦ — ангелы Божии. В LXX порядок: сначала «сыны Божии», затем «ангелы Божии»; в csl наоборот. ἐκδικᾶται — отмщается. ἐκκαθαριεῖ — очистит."
  44: "В gr 32:44 повторяет 31:22 («написал… научил») и добавляет вход Моисея с Иисусом; в csl 32:44 только вторая часть. εἰς τὰ ὦτα τοῦ λαοῦ — в уши народа. αὐτὸς καὶ Ἰησοῦς ὁ τοῦ Ναυη — он и Иисус, сын Навин."
  45: "συνετέλεσεν … λαλῶν — окончил говорить. παντὶ Ισραηλ — всему Израилю. Стих переходит в 46."
  46: "προσέχετε τῇ καρδίᾳ — приложите сердце (προσέχω). διαμαρτύρομαι — свидетельствую, заповедую. ἃ ἐντελεῖσθε — которые заповедаете (буд. вр.). φυλάσσειν καὶ ποιεῖν — хранить и исполнять."
  47: "λόγος κενός — слово пустое. αὕτη ἡ ζωὴ ὑμῶν — это жизнь ваша. ἕνεκεν τοῦ λόγου τούτου — ради слова сего. μακροημερεύσετε — долгоденствовать будете (μακροημερεύω)."
  48: "ἐλάλησεν κύριος πρὸς Μωυσῆν … λέγων — сказал Господь Моисею… говоря; речь начинается в 49."
  49: "Ἀνάβηθι εἰς τὸ ὄρος τὸ Αβαριν — взойди на гору Аварим. ὄρος Ναβαυ — гора Нево. κατὰ πρόσωπον Ιεριχω — против Иерихона. εἰς κατάσχεσιν — во владение, в держание."
  50: "τελεύτα — скончайся, умри (τελευτάω). προστέθητι πρὸς τὸν λαόν σου — приложись к народу твоему (ср. Быт 25:8). ὃν τρόπον ἀπέθανεν Ααρων — как умер Аарон. ἐν Ωρ τῷ ὄρει — на горе Ор."
  51: "ἠπειθήσατε τῷ ῥήματί μου — вы не покорились слову Моему (ἀπειθέω). ἐπὶ τοῦ ὕδατος ἀντιλογίας — у воды пререкания (ἀντιλογία — «пререкание»; ср. Исх 17:7). Καδης ἐν τῇ ἐρήμῳ Σιν — Кадес в пустыне Син. οὐχ ἡγιάσατέ με — не освятили Меня (ἁγιάζω)."
  52: "ἀπέναντι ὄψῃ τὴν γῆν — напротив увидишь землю. ἐκεῖ οὐκ εἰσελεύσῃ — туда не войдёшь."
