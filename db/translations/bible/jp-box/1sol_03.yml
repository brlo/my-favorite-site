# jp-box, 1-е Послание к Солунянам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: решение остаться в Афинах и послать Тимофея (1–2), предназначение к скорбям (3–4),
# забота о вере (5), добрая весть от Тимофея (6), утешение в нужде (7–8),
# благодарение и ночная молитва (9–10), молитва о пути и возрастании любви (11–12),
# утверждение сердец в святости к пришествию Господа со всеми святыми (13).
