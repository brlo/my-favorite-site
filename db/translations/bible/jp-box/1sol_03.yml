verses:
  1: "それゆえ、わたしたちはもはや耐[た]えられず、アテネにわたしたちだけが残[のこ]ることに決[き]めた。"
  2: "そして、わたしたちの兄弟[きょうだい]であり、キリストの福音[ふくいん]における神[かみ]の同労者[どうろうしゃ]であるテモテを遣[つか]わした。それは、あなたがたを強[し]め、あなたがたの信仰[しんこう]のために慰[なぐさ]めるためであり、"
  3: "だれも、このような患難[かんなん]にあって揺[ゆ]るがないためである。なぜなら、あなたがた自身[じしん]が知[し]っているとおり、わたしたちはこのために定[さだ]められているからである。"
  4: "というのは、わたしたちはあなたがたのところにいたとき、わたしたちが患難[かんなん]を受[う]けることになると、あらかじめ告[つ]げていたからである。そして、あなたがたが知[し]っているとおり、そのとおりになった。"
  5: "それゆえ、わたしもまた、もはや耐[た]えられず、あなたがたの信仰[しんこう]を知[し]ろうとして、テモテを遣[つか]わした。ひょっとすると、試[ため]す者[もの]があなたがたを試[ため]して、わたしたちの労苦[ろうく]がむだになってしまったのではないか、と思[おも]ったからである。"
  6: "しかし今、テモテがあなたがたのもとからわたしたちのところへ来[き]て、あなたがたの信仰[しんこう]と愛[あい]を告[つ]げ知[し]らせ、また、あなたがたがいつもわたしたちをよく思[おも]い、わたしたちがあなたがたに会[あ]いたいと願[ねが]っているように、あなたがたもわたしたちに会いたいと願っていることを知[し]らせてくれた。"
  7: "それゆえ、兄弟[きょうだい]たちよ、わたしたちは、すべての苦難[くなん]と患難[かんなん]のうちにありながら、あなたがたのゆえに、あなたがたの信仰[しんこう]によって慰[なぐさ]められた。"
  8: "というのは、あなたがたが主[しゅ]に堅[かた]く立[た]っているなら、わたしたちは今[いま]、生[い]きているからである。"
  9: "というのは、わたしたちは、あなたがたのゆえに、わたしたちの神[かみ]の御前[みまえ]で喜[よろこ]んでいる。あなたがたについて、そのすべての喜[よろこ]びに報[むく]いるために、どんな感謝[かんしゃ]を神[かみ]に返[かえ]すことができようか。"
  10: "わたしたちは、あなたがたの顔[かお]を見[み]ることと、あなたがたの信仰[しんこう]に足[た]りないところを整[ととの]えることができるようにと、夜[よる]も昼[ひる]も、ひたすら願[ねが]っている。"
  11: "どうか、わたしたちの神[かみ]であり父[ちち]である方[かた]と、わたしたちの主[しゅ]イエスが、わたしたちの道[みち]をあなたがたへ向[む]けてまっすぐに導[みちび]いてくださいますように。"
  12: "また、主[しゅ]が、わたしたちがあなたがたに対[たい]してそうしているように、あなたがたの互[たが]いの間[あいだ]の、またすべての人[ひと]に対[たい]する愛[あい]を、増[ま]し豊[ゆた]かにしてくださいますように。"
  13: "それは、わたしたちの主[しゅ]イエスが、そのすべての聖[せい]なる者[もの]たちとともに来臨[らいりん]されるとき、わたしたちの父[ちち]である神[かみ]の御前[みまえ]で、あなたがたの心[こころ]を聖[せい]さのうちに責[せ]められるところのないものとして、確[かた]かなものとするためである。"

notes:
  1: "Διό — それゆえ. μηκέτι στέγοντες — もはや耐えられず. εὐδοκήσαμεν — 決めた. ἐν Ἀθήναις μόνοι — アテネにわたしたちだけが."
  2: "συνεργὸν τοῦ θεοῦ — 神の同労者. ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ — キリストの福音における. στηρῖξαι — 強める. παρακαλέσαι ὑπὲρ τῆς πίστεως — 信仰のために慰める."
  3: "σαίνεσθαι — 揺るがない. εἰς τοῦτο κείμεθα — このために定められている. γάρ передан なぜなら…からである."
  4: "προελέγομεν — あらかじめ告げていた. μέλλομεν θλίβεσθαι — 患難を受けることになる. καὶ γάρ — というのは…からである."
  5: "κἀγώ — わたしもまた. μή πως…ὁ πειράζων — ひょっとすると、試す者が. εἰς κενὸν γένηται ὁ κόπος — 労苦がむだになる."
  6: "ἄρτι — しかし今. εὐαγγελισαμένου — 告げ知らせ. μνείαν ἡμῶν ἀγαθήν — よく思い. ἐπιποθοῦντες — 会いたいと願っている."
  7: "παρεκλήθημεν — 慰められた. ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει — すべての苦難と患難のうちにありながら. διὰ τῆς ὑμῶν πίστεως — あなたがたの信仰によって."
  8: "νῦν ζῶμεν — 今、生きている. ἐὰν ὑμεῖς στήκετε ἐν κυρίῳ — 主に堅く立っているなら."
  9: "τίνα…εὐχαριστίαν δυνάμεθα…ἀνταποδοῦναι — どんな感謝を…返すことができようか; вопрос сохранён. ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν — 喜んでいるそのすべての喜びに報いるために."
  10: "ὑπερεκπερισσοῦ δεόμενοι — ひたすら願っている. καταρτίσαι τὰ ὑστερήματα τῆς πίστεως — 信仰に足りないところを整える. В греч. стоит «;», но это содержание молитвы, не вопрос — переведено утверждением."
  11: "Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν Ἰησοῦς — わたしたちの神であり父である方と主イエス; в базе нет Χριστός. κατευθύναι — まっすぐに導いてくださいますように (optative)."
  12: "πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ — 愛を増し豊かに. εἰς ἀλλήλους καὶ εἰς πάντας — 互いの間の、またすべての人に対する."
  13: "στηρίξαι…τὰς καρδίας — 心を確かなものとする. ἀμέμπτους ἐν ἁγιωσύνῃ — 聖さのうちに責められるところのない. ἐν τῇ παρουσίᾳ…μετὰ πάντων τῶν ἁγίων αὐτοῦ — 来臨のときに、そのすべての聖なる者たちとともに. ἀμήν в базе нет, не добавлено."
