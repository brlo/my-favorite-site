# jp-box, Исаия, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами, но в этой
# главе он не привлекался; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: 1–4 горе законодателям, день посещения, пленение; 5–11 горе Ассирии:
# жезл гнева, слово Господа и самонадеянная речь ассирийца; 12–19 суд над Ассирией,
# топор и пила, свет Израиля — огонь; 20–23 остаток и «слово сокращённое»;
# 24–27 не бойся Ассура, язва Мадиама, снятое ярмо; 28–32 путь ассирийца к Иерусалиму;
# 33–34 падение высоких и Ливана — переход к 11:1 (отрасль от Иессея).
# Голоса: 1–4, 12, 15–23, 28–34 авторская/пророческая речь, без кавычек;
# 5–11 слово Господа — 「…」, речь ассирийца внутри — 『…』 (10:8 и 10:9–11);
# 13–14 речь ассирийца — 「…」; 24–27 слово Господа — 「…」.
# Нумерация по gr: 34 стиха; у csl тоже 34, но слав. 10:4 добавляет «и под убиеными
# падут», а слав. 10:14 — «и сотрясу грады населеныя» (в LXX это конец 10:13);
# расхождения отмечены в notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 斧, のこぎり, 巣, 卵, 武具 и пр. понятны.

