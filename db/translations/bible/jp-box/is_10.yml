verses:
  1: "災[わざわい]だ、不正[ふせい]を書[か]き記[しる]す者[もの]たちに。彼[かれ]らは不正を書き記[しる]している。"
  2: "彼[かれ]らは貧[まず]しい者[もの]の裁[さば]きを曲[ま]げ、わたしの民[たみ]の乏[とぼ]しい者[もの]の権利[けんり]を奪[うば]い、やもめを獲物[えもの]とし、孤児[みなしご]を分捕[ぶんど]り物[もの]とするためである。"
  3: "あなたがたは、訪[おとず]れの日[ひ]、遠[とお]くから滅[ほろ]びが来[く]るとき、何[なに]をするのか。だれのもとへ逃[に]げて助[たす]けを求[もと]めるのか。どこにあなたがたの栄光[えいこう]を残[のこ]すのか。"
  4: "捕[と]らわれの身[み]とならないために。あなたがたは殺[ころ]された者[もの]たちの間[あいだ]に倒[たお]れる。それでもなお、主[しゅ]の怒[いか]りは収[おさ]まらず、その手[て]はまだ上[あ]げられたままである。"
  5: "「アッシリア人[じん]よ、災[わざわい]だ。わたしの怒[いか]りの杖[つえ]と憤[いきどお]りは、彼[かれ]らの手[て]にある。"
  6: "わたしは怒[いか]りを不法[ふほう]な国民[こくみん]に遣[つか]わし、わたしの民[たみ]に命[めい]じて、獲物[えもの]を奪[うば]わせ、分捕[ぶんど]りをさせ、彼[かれ]らを道[みち]の泥[どろ]のように踏[ふ]みつけさせ、その町[まち]を塵[ちり]とする。"
  7: "しかし、彼[かれ]はそのようには思[おも]わない。その心[こころ]もそうは考[かんが]えない。彼の心[こころ]は、多[おお]くの国民[こくみん]を断[た]ち滅[ほろ]ぼすことに向[む]かう。"
  8: "たとえ彼[かれ]に『おまえ一人[ひとり]が君主[くんしゅ]だ』と言[い]う者[もの]があっても、"
  9: "彼[かれ]は言[い]う。『わたしはバビロンの上[うえ]の国[くに]とハランネを取[と]ったではないか。そこに塔[とう]が建[た]てられていた。アラビアとダマスコとサマリアを取[と]ったのだ。"
  10: "これらの国[くに]々[ぐに]をこの手[て]で取[と]ったのだから、すべての支配[しはい]の座[ざ]も取[と]る。エルサレムとサマリアの刻[きざ]んだ像[ぞう]どもよ、泣[な]きわめけ。"
  11: "サマリアと、その手[て]で造[つく]ったものにしたように、エルサレムとその偶像[ぐうぞう]にも同じことをしよう。』」"
  12: "主[しゅ]がシオンの山[やま]とエルサレムで、すべてのわざを終[お]えられるそのとき、主はアッシリアの王[おう]、その大[おお]きな心[こころ]と高[たか]ぶる目[め]の栄光[えいこう]に臨[のぞ]まれる。"
  13: "彼[かれ]は言[い]った。「わたしは手[て]の力[ちから]と、悟[さと]りの知恵[ちえ]によってこれをした。わたしは賢[かしこ]いからだ。わたしは国[くに]々[ぐに]の境[さかい]を移[うつ]し、その力[ちから]を奪[うば]い、住[す]みかたる町[まち]々[まち]を震[ふる]え動[うご]かす。"
  14: "わたしは世界[せかい]を手[て]で巣[す]のように取[と]り、捨[す]てられた卵[たまご]を拾[ひろ]うように、これを集[あつ]めた。翼[つばさ]を動[うご]かす者[もの]も、口[くち]を開[ひら]く者[もの]も、さえずる者[もの]もいない。」"
  15: "斧[おの]が、それを振[ふ]るう者[もの]なしに誇[ほこ]ることがあろうか。のこぎりが、それを引[ひ]く者[もの]なしに高[たか]ぶることがあろうか。ただの杖[つえ]や木[き]の棒[ぼう]を手[て]に持[も]ち上[あ]げるのと同じことである。"
  16: "しかし、そうではない。万軍[ばんぐん]の主[しゅ]は、あなたの誉[ほま]れに恥[はじ]を送[おく]り、あなたの栄光[えいこう]に燃[も]える火[ひ]を放[はな]つ。"
  17: "イスラエルの光[ひかり]は火[ひ]となり、燃[も]える火[ひ]によって彼[かれ]を聖[せい]なる者[もの]とし、草[くさ]のようにその茂[しげ]みを焼[や]き尽[つ]くす———その日[ひ]に。"
  18: "山[やま]々[やま]と丘[おか]と森[もり]は消[き]え失[う]せ、それは魂[たましい]から肉[にく]に至[いた]るまで焼[や]き尽[つ]くされる。逃[に]げる者[もの]は、燃[も]える炎[ほのお]から逃[に]げる者のようになる。"
  19: "残[のこ]された者[もの]は数[かず]少[すく]なくなり、子[こ]どもがそれを数[かぞ]え記[しる]すほどになる。"
  20: "その日[ひ]、イスラエルの残[のこ]りの者[もの]と、ヤコブの家[いえ]から逃[のが]れた者[もの]たちは、もはや自分[じぶん]たちを打[う]った者[もの]に頼[たよ]らず、真理[しんり]をもってイスラエルの聖[せい]なる方[かた]に信頼[しんらい]する。"
  21: "ヤコブの残[のこ]りの者[もの]は、強[つよ]い神[かみ]に立[た]ち帰[かえ]る。"
  22: "イスラエルの民[たみ]が海[うみ]の砂[すな]のように多[おお]くなっても、その残[のこ]りの者[もの]だけが救[すく]われる。義[ぎ]をもって、みことばを成[な]し遂[と]げ、これを断[た]ち切[き]られるからである。"
  23: "主[しゅ]は、全[ぜん]世界[せかい]に、断[た]ち切[き]られたみことばを成[な]し遂[と]げられる。"
  24: "それゆえ、万軍[ばんぐん]の主[しゅ]はこう言[い]われる。「わたしの民[たみ]、シオンに住[す]む者[もの]よ、アッシリア人[じん]を恐[おそ]れるな。彼[かれ]は杖[つえ]でおまえを打[う]つ。わたしはおまえに、エジプトの道[みち]を見[み]るために災[わざわい]を下[くだ]す。"
  25: "もう少[すこ]しで、わたしの怒[いか]りは終[お]わる。しかし、わたしの憤[いきどお]りは彼[かれ]らの計画[けいかく]の上[うえ]に注[そそ]がれる。"
  26: "万軍[ばんぐん]の神[かみ]は、苦[くる]しみの場[ば]でミディアンを打[う]ったときのように、彼[かれ]らの上[うえ]に災[わざわい]を起[お]こされる。その憤[いきどお]りは海[うみ]への道[みち]、エジプトへの道[みち]に向[む]かう。"
  27: "その日[ひ]、彼[かれ]への恐[おそ]れとその軛[くびき]は、おまえの肩[かた]から取[と]り除[のぞ]かれる。軛[くびき]はあなたがたの肩[かた]から崩[くず]れ落[お]ちる。」"
  28: "彼[かれ]はアッガイの町[まち]に来[き]、マゲドを通[とお]り、マクマスにその武具[ぶぐ]を置[お]く。"
  29: "彼[かれ]は谷[たに]を過[す]ぎ、アッガイに来[く]る。ラマは恐[おそ]れに捕[と]らわれ、"
  30: "ガリムの娘[むすめ]は逃[に]げる。ライサは聞[き]、アナトトも聞[く]。"
  31: "マデミナは驚[おどろ]き、ギビムに住[す]む者[もの]たちも驚く。"
  32: "今日[きょう]、彼[かれ]は留[とど]まるために道[みち]にとどまり、手[て]をもって慰[なぐさ]めよ———山[やま]を、シオンの娘[むすめ]を、エルサレムにある丘[おか]を。"
  33: "見[み]よ、支配者[しはいしゃ]である主[しゅ]、万軍[ばんぐん]の主[しゅ]は、力[ちから]をもって高[たか]ぶる者[もの]たちを震[ふる]え上[あ]がらせ、傲慢[ごうまん]な高[たか]い者[もの]は砕[くだ]かれ、高[たか]い者[もの]は低[ひく]くされる。"
  34: "高[たか]い者[もの]たちは剣[つるぎ]で倒[たお]れ、レバノンはその高[たか]い木々[きぎ]とともに倒[たお]れる。"

notes:
  1: "οὐαὶ τοῖς γράφουσιν πονηρίαν — «горе пишущим лукавство» (οὐαί — горе; γράφω — писать; πονηρία — лукавство, неправда). γράφοντες γὰρ πονηρίαν γράφουσιν — «ибо, пиша лукавство, пишут»: фигура повторения (cognate), сохранена. Начало «горя» — пророческий возглас, без кавычек."
  2: "ἐκκλίνοντες κρίσιν πτωχῶν — «уклоняющие суд бедных» (ἐκκλίνω — отклонять, извращать; πτωχός — нищий, 貧しい者). ἁρπάζοντες κρίμα πενήτων τοῦ λαοῦ μου — «похищающие право нищих народа Моего» (ἁρπάζω — похищать; κρίμα — суд, право; πένης — неимущий). χήραν εἰς ἁρπαγὴν καὶ ὀρφανὸν εἰς προνομήν — «вдову в добычу и сироту в разграбление» (χήρα — вдова; ὀρφανός — сирота; προνομή — добыча)."
  3: "ἐν τῇ ἡμέρᾳ τῆς ἐπισκοπῆς — «в день посещения» (ἐπισκοπή — посещение, посещение с судом). ἡ θλῖψις ὑμῖν πόρρωθεν ἥξει — «скорбь к вам издалека придёт» (πόρρωθεν — издалека; θλῖψις — скорбь). πρὸς τίνα καταφεύξεσθε τοῦ βοηθηθῆναι — «к кому прибегнете, чтобы получить помощь» (καταφεύγω — прибегать; βοηθέω — помогать). ποῦ καταλείψετε τὴν δόξαν ὑμῶν — «где оставите славу (богатство) вашу» (καταλείπω — оставлять)."
  4: "τοῦ μὴ ἐμπεσεῖν εἰς ἐπαγωγήν — «чтобы не впасть в пленение» (ἐπαγωγή — наведение, нашествие, плен; слав. «пленение»). Слав. добавляет «и под убиеными падут» — этой фразы нет в LXX (чтение МТ); по паритету внесена в основной текст без 〔…〕 (殺された者たちの間に倒れる). Рефрен: «при всём этом не отвратился гнев…» (см. 9:11)."
  5: "Οὐαὶ Ἀσσυρίοις — «горе Ассирии» (Ἀσσύριοι — アッシリア人). ἡ ῥάβδος τοῦ θυμοῦ μου καὶ ὀργῆς ἐστιν ἐν ταῖς χερσὶν αὐτῶν — «жезл гнева Моего и ярости — в руках их» (ῥάβδος — жезл; θυμός — гнев; ὀργή — ярость). Начало речи Господа — 「…」 до конца 10:11."
  6: "τὴν ὀργήν μου εἰς ἔθνος ἄνομον ἀποστελῶ — «гнев Мой пошлю на народ беззаконный» (ἄνομος — беззаконный). τῷ ἐμῷ λαῷ συντάξω ποιῆσαι σκῦλα καὶ προνομήν — «народу Моему повелю сделать добычу и разграбление» (συντάσσω — приказывать; σκῦλα — добыча). καταπατεῖν τὰς πόλεις καὶ θεῖναι αὐτὰς εἰς κονιορτόν — «попирать города и обратить их в прах» (καταπατέω — попирать; κονιορτός — пыль, прах)."
  7: "αὐτὸς δὲ οὐχ οὕτως ἐνεθυμήθη — «но он не так помыслил» (ἐνθυμέομαι — замышлять). τῇ ψυχῇ οὐχ οὕτως λελόγισται — «в душе не так рассчитал» (λογίζομαι — считать; слав. «возмне»). ἀλλὰ ἀπαλλάξει ὁ νοῦς αὐτοῦ καὶ τοῦ ἔθνη ἐξολεθρεῦσαι οὐκ ὀλίγα — «но отступит ум его, [чтобы] истребить народы немалые» (ἀπαλλάσσω — удалять, отступать; ἐξολεθρεύω — истреблять)."
  8: "καὶ ἐὰν εἴπωσιν αὐτῷ Σὺ μόνος εἶ ἄρχων — «и если скажут ему: ты один князь» (ἄρχων — князь, правитель; в тексте 君主). Слова ассирийца — 『…』; здесь первая, короткая цитата внутри слова Господа."
  9: "Οὐκ ἔλαβον τὴν χώραν τὴν ἐπάνω Βαβυλῶνος καὶ Χαλαννη — «не взял ли я страну выше Вавилона и Халани» (Χαλαννη — Халне, ハランネ, как в Быт 10:10). οὗ ὁ πύργος ᾠκοδομήθη — «где башня была построена» (πύργος — башня). Ἀραβίαν καὶ Δαμασκὸν καὶ Σαμάρειαν — «Аравию, и Дамаск, и Самарию». Речь ассирийца — 『…』, продолжается до конца 10:11."
  10: "ὃν τρόπον ταύτας ἔλαβον ἐν τῇ χειρί μου, καὶ πάσας τὰς ἀρχὰς λήμψομαι — «как эти взял я рукою моею, так и все власти (царства) возьму» (ἀρχή — начало, власть, царство). ὀλολύξατε, τὰ γλυπτὰ ἐν Ιερουσαλημ καὶ ἐν Σαμαρείᾳ — «возрыдайте, изваяния в Иерусалиме и в Самарии» (ὀλολύζω — вопить, рыдать; γλυπτόν — изваяние); издевательский призыв к идолам сохранён."
  11: "ὃν τρόπον γὰρ ἐποίησα Σαμαρείᾳ καὶ τοῖς χειροποιήτοις αὐτῆς — «как сделал я Самарии и рукотворенным её» (χειροποίητος — сделанный руками; слав. «рукотворенным»). οὕτως ποιήσω καὶ Ιερουσαλημ καὶ τοῖς εἰδώλοις αὐτῆς — «так сделаю и Иерусалиму и идолам его» (εἴδωλον — идол, 偶像). Здесь закрываются речь ассирийца 『…』 и слово Господа 「…」."
  12: "ὅταν συντελέσῃ κύριος πάντα ποιῶν ἐν τῷ ὄρει Σιων — «когда совершит Господь всё, делая на горе Сион» (συντελέω — завершать; πάντα ποιῶν — «всё делая», слав. «вся творя»). ἐπάξει ἐπὶ τὸν νοῦν τὸν μέγαν, τὸν ἄρχοντα τῶν Ἀσσυρίων — «наведёт на великий ум, на князя Ассирийского» (ἐπάγω — наводить); в тексте アッシリアの王…大きな心. ἐπὶ τὸ ὕψος τῆς δόξης τῶν ὀφθαλμῶν αὐτοῦ — «на высоту славы очей его» (ὕψος — высота)."
  13: "Τῇ ἰσχύι ποιήσω καὶ τῇ σοφίᾳ τῆς συνέσεως — «силою сделаю и мудростью разума» (ἰσχύς — сила; σύνεσις — разумение; слав. «крепостию руки моея… премудростию разума»). ἀφελῶ ὅρια ἐθνῶν — «отниму пределы народов» (ὅριον — предел, граница). τὴν ἰσχὺν αὐτῶν προνομεύσω — «силу их разграблю» (προνομεύω — грабить). καὶ σείσω πόλεις κατοικουμένας — «и потрясу города населённые» (σείω — трясти). Слав. переносит «потрясу города» в 10:14 — деление иное. Речь ассирийца — 「…」."
  14: "καὶ τὴν οἰκουμένην ὅλην καταλήμψομαι τῇ χειρὶ ὡς νοσσιάν — «и всю вселенную возьму рукою, как гнездо» (καταλαμβάνω — захватывать; νοσσιά — гнездо). ὡς καταλελειμμένα ᾠὰ ἀρῶ — «как оставленные яйца, подниму» (ᾠόν — яйцо; αἴρω — поднимать, брать). οὐκ ἔστιν ὃς διαφεύξεταί με ἢ ἀντείπῃ μοι — «нет никого, кто убежал бы от меня или возразил бы мне» (διαφεύγω — убегать; ἀντιλέγω — прекословить). Слав. добавляет «и отверзет уста и глумит» — нет в LXX; по паритету внесено (口を開く者、あざける者). Здесь закрывается речь 「…」."
  15: "μὴ δοξασθήσεται ἀξίνη ἄνευ τοῦ κόπτοντος ἐν αὐτῇ — «разве прославится топор без рубящего им?» (ἀξίνη — топор, 斧; κόπτω — рубить). ἢ ὑψωθήσεται πρίων ἄνευ τοῦ ἕλκοντος αὐτόν — «или возвысится пила без влекущего её?» (πρίων — пила, のこぎり; ἕλκω — тянуть, влечь). ὡσαύτως ἐάν τις ἄρῃ ῥάβδον ἢ ξύλον — «так же, [как] если кто поднимет жезл или дерево» (ὥσαύτως — так же). Риторические вопросы, без кавычек."
  16: "ἀποστελεῖ κύριος σαβαωθ εἰς τὴν σὴν τιμὴν ἀτιμίαν — «пошлёт Господь Саваоф на честь твою бесчестие» (τιμή — честь; ἀτιμία — бесчестие). εἰς τὴν σὴν δόξαν πῦρ καιόμενον καυθήσεται — «на славу твою огонь горящий возгорится» (καίω — жечь). καὶ οὐχ οὕτως — «и не так»: поправка к предыдущему, с топором и пилой этого не будет."
  17: "τὸ φῶς τοῦ Ισραηλ εἰς πῦρ — «свет Израиля — в огонь». ἁγιάσει αὐτὸν ἐν πυρὶ καιομένῳ — «освятит его огнём горящим» (ἁγιάζω — освящать; слав. «освятит»). φάγεται ὡσεὶ χόρτον τὴν ὕλην — «пожрёт, как траву, вещество (лес)» (ὕλη — лес, вещество; слав. «вещество»). τῇ ἡμέρᾳ ἐκείνῃ — «в тот день»: в gr стоит в конце 10:17, у слав. и ru — в начале 10:18; держимся gr."
  18: "ἀποσβεσθήσεται τὰ ὄρη καὶ οἱ βουνοὶ καὶ οἱ δρυμοί — «угаснут горы, и холмы, и дубравы» (ἀποσβέννυμι — гасить; δρυμός — дубрава). καταφάγεται ἀπὸ ψυχῆς ἕως σαρκῶν — «пожрёт от души до плоти» (ψυχή — душа; σάρξ — плоть; слав. «от души даже до плотей»). ὁ φεύγων ὡς ὁ φεύγων ἀπὸ φλογὸς καιομένης — «бегущий, как бегущий от пламени горящего» (φλόξ — пламя). МТ/ru: «славный лес его и сад его» — иное чтение, в текст не вносим."
  19: "οἱ καταλειφθέντες ἀπ᾿ αὐτῶν ἔσονται ἀριθμός — «оставшиеся от них будут числом» (ἀριθμός — число; слав. «в число»), т. е. их будет немного. παιδίον γράψει αὐτούς — «дитя напишет их» (γράφω — писать): ребёнок сможет их пересчитать и записать."
  20: "οὐκέτι προστεθήσεται τὸ καταλειφθὲν Ισραηλ — «не приложится (не будет более) остаток Израиля» (προστίθημι — прибавлять). οἱ σωθέντες τοῦ Ιακωβ — «спасшиеся Иакова» (σῴζω — спасать). τοὺς ἀδικήσαντας αὐτούς — «обидевших их» (ἀδικέω — обижать, поступать несправедливо). ἐπὶ τὸν θεὸν τὸν ἅγιον τοῦ Ισραηλ τῇ ἀληθείᾳ — «на Бога, Святого Израилева, в истине» (ἀλήθεια — истина, 真理); в тексте イスラエルの聖なる方, 真理をもって."
  21: "καὶ ἔσται τὸ καταλειφθὲν τοῦ Ιακωβ ἐπὶ θεὸν ἰσχύοντα — «и будет остаток Иакова к Богу сильному» (ἰσχύων — сильный; в тексте 強い神). В LXX нет глагола; слав. добавляет «обратится» (внесено: 立ち帰る). Имя сына Исаии (Шеар-ясув) обыгрывается: остаток возвращается."
  22: "ὡς ἡ ἄμμος τῆς θαλάσσης — «как песок морской» (ἄμμος — песок). τὸ κατάλειμμα αὐτῶν σωθήσεται — «остаток их спасётся» (κατάλειμμα — остаток). λόγον γὰρ συντελῶν καὶ συντέμνων ἐν δικαιοσύνῃ — «ибо слово совершая и сокращая в правде» (συντελέω — завершать; συντέμνω — сокращать, обрезать; слав. «совершая и сокращая правдою»). Подлежащее в LXX не названо (оно появляется в 10:23, ὁ θεός), поэтому и в тексте без подлежащего. Цит. Рим 9:27–28."
  23: "λόγον συντετμημένον ποιήσει ὁ θεὸς ἐν τῇ οἰκουμένῃ ὅλῃ — «слово сокращённое сотворит Бог во всей вселенной» (συντέμνω — сокращать; οἰκουμένη — вселенная). Слав. «Господь» вместо ὁ θεός; в тексте 主. Ср. Рим 9:28."
  24: "Μὴ φοβοῦ, ὁ λαός μου οἱ κατοικοῦντες ἐν Σιων — «не бойся, народ Мой, живущие в Сионе» (обращение во мн. ч., как в слав.). ἀπὸ Ἀσσυρίων — «от ассириян». ἐν ῥάβδῳ πατάξει σε — «жезлом поразит тебя» (πατάσσω — поражать). πληγὴν γὰρ ἐγὼ ἐπάγω ἐπὶ σὲ τοῦ ἰδεῖν ὁδὸν Αἰγύπτου — «ибо язву Я навожу на тебя, чтобы видеть путь Египта» (πληγή — удар, язва): место тёмное (слав. «еже видети путь египта»; ср. МТ/ru «как Египет»). Начало речи Господа — 「…」 до конца 10:27."
  25: "ἔτι γὰρ μικρὸν καὶ παύσεται ἡ ὀργή — «ибо ещё немного, и прекратится гнев» (παύω — прекращать). ὁ δὲ θυμός μου ἐπὶ τὴν βουλὴν αὐτῶν — «а ярость Моя — на совет их» (βουλή — совет, замысел)."
  26: "ἐπεγερεῖ ὁ θεὸς ἐπ᾿ αὐτοὺς κατὰ τὴν πληγὴν τὴν Μαδιαμ — «воздвигнет Бог на них [язву] по язве Мадиама» (ἐπεγείρω — воздвигать; πληγή — язва; Μαδιαμ — Мидиан, ミディアン); слав. добавляет «сил» («Бог сил») — в LXX только ὁ θεός, внесено как 万軍の神. ἐν τόπῳ θλίψεως — «на месте скорби» (θλῖψις — скорбь). ὁ θυμὸς αὐτοῦ τῇ ὁδῷ τῇ κατὰ θάλασσαν εἰς τὴν ὁδὸν τὴν κατ᾿ Αἴγυπτον — «ярость Его — на путь к морю, на путь к Египту»."
  27: "ἀφαιρεθήσεται ὁ φόβος αὐτοῦ ἀπὸ σοῦ καὶ ὁ ζυγὸς αὐτοῦ ἀπὸ τοῦ ὤμου σου — «снимется страх его с тебя и ярмо его с плеча твоего» (ἀφαιρέω; ζυγός — ярмо; ὦμος — плечо). καταφθαρήσεται ὁ ζυγὸς ἀπὸ τῶν ὤμων ὑμῶν — «истлеет ярмо с плеч ваших» (καταφθείρω — губить, истлевать; слав. «согниет»). Здесь закрывается речь 「…」."
  28: "ἥξει γὰρ εἰς τὴν πόλιν Αγγαι — «ибо придёт в город Аггай» (Αγγαι — Ай/Гай; в тексте アッガイ). παρελεύσεται εἰς Μαγεδω — «пройдёт в Магеддо» (Μαγεδω — マゲド). ἐν Μαχμας θήσει τὰ σκεύη αὐτοῦ — «в Махмасе положит сосуды (снаряжение) свои» (σκεῦος — сосуд, вещь, снаряжение; в тексте 武具)."
  29: "παρελεύσεται φάραγγα καὶ ἥξει εἰς Αγγαι — «пройдёт ущелье и придёт в Аггай» (φάραγξ — ущелье). φόβος λήμψεται Ραμα πόλιν Σαουλ — «страх охватит Раму, город Саула» (Ραμα — ラマ; слав. «раму град саулов»). φεύξεται — «побежит»: в гр. стоит в конце 10:29, а подлежащее (ἡ θυγάτηρ Γαλλιμ) — в начале 10:30; в японском сказуемое перенесено к подлежащему."
  30: "ἡ θυγάτηρ Γαλλιμ — «дочь Галлима» (Γαλλιμ — ガリム; слав. «дщерь галимля»). ἐπακούσεται Λαισα, ἐπακούσεται Αναθωθ — «услышит Лаис, услышит Анафоф» (ἐπακούω — слышать, внимать; Λαισα — ライサ; Αναθωθ — アナトト). Повтор глагола сохранён."
  31: "ἐξέστη Μαδεβηνα — «пришла в смятение Мадемина» (ἐξίστημι — ужасаться, выходить из себя; Μαδεβηνα — マデミナ; слав. «мадемина»). οἱ κατοικοῦντες Γιββιρ — «живущие в Гивиме» (Γιββιρ — ギビム; слав. «гивим»)."
  32: "σήμερον ἐν ὁδῷ τοῦ μεῖναι — «сегодня на пути, чтобы остаться» (μένω — оставаться): место тёмное, слав. «днесь еже на пути пребыти». τῇ χειρὶ παρακαλεῖτε — «рукою увещевайте (утешайте)» (παρακαλέω — призывать, утешать); в МТ и ru «грозит рукою», в LXX/слав. «утешайте», держимся LXX. τὸ ὄρος, τὴν θυγατέρα Σιων, καὶ οἱ βουνοὶ οἱ ἐν Ιερουσαλημ — «гора, дочь Сиона, и холмы в Иерусалиме» (βουνός — холм)."
  33: "ἰδοὺ γὰρ ὁ δεσπότης κύριος σαβαωθ — «вот, Владыка Господь Саваоф» (δεσπότης — владыка, 支配者). συνταράσσει τοὺς ἐνδόξους μετὰ ἰσχύος — «потрясает славных с силою» (συνταράσσω — потрясать; ἔνδοξος — славный). οἱ ὑψηλοὶ τῇ ὕβρει συντριβήσονται — «высокие надменностью сокрушатся» (ὕβρις — надменность; συντρίβω — сокрушать). οἱ ὑψηλοὶ ταπεινωθήσονται — «высокие смирятся» (ταπεινόω). Переход к 11:1."
  34: "πεσοῦνται οἱ ὑψηλοὶ μαχαίρᾳ — «падут высокие мечом» (μάχαιρα — меч). ὁ δὲ Λίβανος σὺν τοῖς ὑψηλοῖς πεσεῖται — «и Ливан с высокими падёт» (Λίβανος — レバノン; «высокие» — кедры Ливана). МТ/ru «посечет чащу леса железом, и Ливан падёт от Всемогущего» — иное; держимся LXX/слав. Конец главы; 11:1 продолжает образ срубленного дерева."
