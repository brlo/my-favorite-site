# jp-box, Откровение Иоанна, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий (gr-lxx-byz) — свидетель; чего в нём нет, то в 〔…〕.
# Глава 3: письма Сардисской (1–6), Филадельфийской (7–13) и Лаодикийской (14–22) церквам.
# Красное <j> — вся речь Христа к трём церквам, 3:1–22, включая «имеющий ухо да слышит»
# (3:6, 13, 22). Внутри речи Христа цитата Писания — в 『…』 (3:7 — Ис 22:22).
# 〔…〕: 3:11 — 〔見よ、〕: ἰδού в базе нет, это церковное чтение (проверено запросом).
# Прочее ([τὰ] в 3:2) в базе есть — без скобок. πνεῦμα без ἅγιον — 霊[れい], не 聖霊.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

