verses:
  1: "「<j>サルディスにある教会[きょうかい]の天使[てんし]に書[か]きなさい。神[かみ]の七[なな]つの霊[れい]と七[なな]つの星[ほし]を持[も]つ者[もの]が、こう言[い]われる。わたしはあなたの行[おこな]いを知[し]っている。あなたは生[い]きているという名[な]を持[も]っているが、実[じつ]は死[し]んでいる。</j>"
  2: "<j>目[め]を覚[さ]まして、死[し]にかかっている残[のこ]りのものを強[し]めなさい。わたしは、あなたの行[おこな]いが、わたしの神[かみ]の前[まえ]に満[み]ちているのを見[み]いださなかった。</j>"
  3: "<j>だから、あなたがどのように受[う]け取[と]り、何[なに]を聞[き]いたかを思[おも]い起[おこ]し、それを守[まも]って、悔[く]い改[あらた]めなさい。もし目[め]を覚[さ]ましていないなら、わたしは盗人[ぬすびと]のように来[く]る。あなたは、わたしがどの時[とき]に来[く]るかを知[し]らない。</j>"
  4: "<j>しかし、サルディスには、自分[じぶん]の衣[ころも]を汚[けが]さなかった名[な]が、少[すこ]しばかりある。彼[かれ]らは白[しろ]い衣[ころも]を着[き]て、わたしと共[とも]に歩[あゆ]む。ふさわしい者[もの]たちだからである。</j>"
  5: "<j>勝[か]つ者[もの]は、このように白[しろ]い衣[ころも]を着[き]せられる。わたしは、その名[な]を命[いのち]の書[しょ]から消[け]し去[さ]らない。その名[な]を、わたしの父[ちち]の前[まえ]と、父[ちち]の天使[てんし]たちの前[まえ]で言[い]い表[あらわ]す。</j>」"
  6: "「<j>耳[みみ]のある者[もの]は、霊[れい]が教会[きょうかい]たちに言[い]うことを聞[き]くがよい。</j>」"
  7: "「<j>フィラデルフィアにある教会[きょうかい]の天使[てんし]に書[か]きなさい。聖[せい]なる方[かた]、真[しん]実[じつ]なる方[かた]、ダビデの鍵[かぎ]を持[も]つ方[かた]、開[ひら]くときには閉[と]ざす者[もの]がなく、閉[と]ざすときには開[ひら]く者[もの]がない方[かた]が、こう言[い]われる。</j>"
  8: "<j>わたしは、あなたの行[おこな]いを知[し]っている。見[み]よ、わたしはあなたの前[まえ]に、だれも閉[と]ざすことのできない開[ひら]いた門[もん]を置[お]いた。あなたの力[ちから]はわずかである。それでも、あなたはわたしの言葉[ことば]を守[まも]り、わたしの名[な]を否[いな]まなかった。</j>"
  9: "<j>見[み]よ、わたしは、サタンの会堂[かいどう]に属[ぞく]する者[もの]たちを、あなたの足[あし]の前[まえ]に来[き]て伏[ふく]し拝[はい]させる。彼[かれ]らは、自分[じぶん]たちをユダヤ人[じん]だと言[い]いながら、そうではなく、偽[いつわ]りを言[い]う者[もの]たちである。そして、わたしがあなたを愛[あい]したことを知[し]る。</j>"
  10: "<j>あなたが、わたしの忍耐[にんたい]の言葉[ことば]を守[まも]ったので、わたしも、地[ち]に住[す]む者[もの]たちを試[こころ]みるために全世界[ぜんせかい]に来[きた]らんとする試練[しれん]の時[とき]から、あなたを守[まも]る。</j>"
  11: "<j>〔見[み]よ、〕わたしは速[すみ]やかに来[く]る。あなたが持[も]っているものを固[かた]く握[にぎ]っていなさい。だれもあなたの冠[かんむり]を奪[うば]わないためである。</j>"
  12: "<j>勝[か]つ者[もの]を、わたしはわたしの神[かみ]の神殿[しんでん]の柱[はしら]とする。彼[かれ]はもう外[そと]へ出[で]ることはない。わたしは、わたしの神[かみ]の名[な]と、わたしの神[かみ]のもとから天[てん]から降[くだ]る新[あたら]しいエルサレムという、わたしの神[かみ]の都[みやこ]の名[な]と、わたしの新[あたら]しい名[な]を、彼[かれ]の上[うえ]に書[か]き記[しる]す。</j>」"
  13: "「<j>耳[みみ]のある者[もの]は、霊[れい]が教会[きょうかい]たちに言[い]うことを聞[き]くがよい。</j>」"
  14: "「<j>ラオディキアにある教会[きょうかい]の天使[てんし]に書[か]きなさい。アーメンである方[かた]、忠[ちゅう]実[じつ]で真[しん]実[じつ]な証人[しょうにん]、神[かみ]の創造[そうぞう]の初[はじ]めである方[かた]が、こう言[い]われる。</j>"
  15: "<j>わたしはあなたの行[おこな]いを知[し]っている。あなたは冷[つめ]たくも熱[あつ]くもない。冷[つめ]たいか、熱[あつ]いか、どちらかであればよかったのに。</j>"
  16: "<j>ところが、あなたは熱[あつ]くも冷[つめ]たくもない。生[なま]ぬるいので、わたしはあなたを口[くち]から吐[は]き出[だ]すことにしよう。</j>"
  17: "<j>あなたは、『わたしは富[と]んでいる。財[ざい]を積[つ]んだ。何[なに]も足[た]りない』と言[い]っている。しかし、自分[じぶん]が惨[みじ]めで、哀[あわ]れで、貧[まず]しく、目[め]が見[み]えず、裸[はだか]であることを知[し]らない。</j>"
  18: "<j>わたしはあなたに勧[すす]める。火[ひ]で鍛[きた]えた金[きん]をわたしから買[か]って富[と]みなさい。白[しろ]い衣[ころも]を買[か]って着[き]、裸[はだか]の恥[はじ]が現[あらわ]れないようにしなさい。目薬[めぐすり]を買[か]って目[め]に塗[ぬ]れば、見[み]えるようになる。</j>"
  19: "<j>わたしは、愛[あい]する者[もの]をこそ責[せ]め、懲[こら]しめる。だから、熱心[ねっしん]になって、悔[く]い改[あらた]めなさい。</j>"
  20: "<j>見[み]よ、わたしは戸口[とぐち]に立[た]って、たたいている。だれでも、わたしの声[こえ]を聞[き]いて戸[と]を開[あ]けるなら、わたしはその人[ひと]のところに入[はい]って、その人[ひと]と共[とも]に食事[しょくじ]をし、その人[ひと]もわたしと共[とも]に食事[しょくじ]をする。</j>"
  21: "<j>勝[か]つ者[もの]には、わたしと共[とも]にわたしの御座[みくら]に座[すわ]ることを許[ゆる]そう。わたしもまた勝[か]ちを得[え]て、父[ちち]と共[とも]に父[ちち]の御座[みくら]に座[すわ]ったとおりである。</j>」"
  22: "「<j>耳[みみ]のある者[もの]は、霊[れい]が教会[きょうかい]たちに言[い]うことを聞[き]くがよい。</j>」"

notes:
  1: "Τάδε λέγει — こう言う, пророческая формула. τὰ ἑπτὰ πνεύματα τοῦ θεοῦ — 七つの霊; πνεῦμα без ἅγιον, поэтому не 聖霊, а 霊[れい]. ὄνομα ἔχεις ὅτι ζῇς — 生きているという名を持つ. νεκρὸς εἶ — 死んでいる."
  2: "γίνου γρηγορῶν — 目を覚まして. στήρισον — 強める. τὰ λοιπὰ ἃ ἔμελλον ἀποθανεῖν — «остальное, что готово было умереть»; τὰ λοιπά ср. рода, поэтому 残りのもの, без «люди». [τὰ] ἔργα в базе есть — 〔…〕 не ставятся."
  3: "μνημόνευε πῶς εἴληφας καὶ ἤκουσας — どう受け取り、何を聞いたか. τήρει — 守る. ἥξω ὡς κλέπτης — 盗人のように来る; сравнение не смягчено."
  4: "ὀλίγα ὀνόματα — «немного имён», то есть немного людей: 少しばかりの名 (образность базы сохранена). οὐκ ἐμόλυναν τὰ ἱμάτια — 衣を汚さなかった. ἐν λευκοῖς — 白い衣を着て."
  5: "ὁ νικῶν — 勝つ者, формула Откровения (как в 2:7 и далее у otkr_02). βίβλος τῆς ζωῆς — 命の書 (しょ). ἐξαλείψω — 消し去る. ὁμολογήσω — 言い表す. οὕτως относится к ст. 4."
  6: "Формула «Дух говорит церквам»; τὸ πνεῦμα без ἅγιον — 霊[れい]. Это слова Христа (ср. 2:7), поэтому красное. Та же формула дословно в 3:13 и 3:22."
  7: "ὁ ἅγιος, ὁ ἀληθινός — 聖なる方、真実なる方. κλεὶς Δαυίδ — ダビデの鍵; аллюзия Ис 22:22 в речи Христа, без кавычек (как 1:17). ἀνοίγων… κλείων — причастия настоящего времени, переданы условно-временными оборотами."
  8: "Тире в базе — не добавка переводчика. θύραν ἠνεῳγμένην — 開いた門. μικρὰν ἔχεις δύναμιν — 力はわずか. ἐτήρησάς μου τὸν λόγον — わたしの言葉を守る."
  9: "συναγωγὴ τοῦ Σατανᾶ — サタンの会堂. λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι — 自分たちをユダヤ人だと言いながら. γνῶσιν — 知る (буд. вр.). προσκυνήσουσιν ἐνώπιον τῶν ποδῶν σου — 足の前に来て伏し拝させる."
  10: "τὸν λόγον τῆς ὑπομονῆς μου — わたしの忍耐の言葉. τηρήσω ἐκ τῆς ὥρας — 時から守る (ἐκ — «от», а не «в»). οἰκουμένη ὅλη — 全世界. πειράσαι τοὺς κατοικοῦντας — 地に住む者たちを試みる."
  11: "ἰδού в базе нет — это церковное чтение, поэтому 〔見よ、〕 (проверено: ιδου — НЕТ). κράτει ὃ ἔχεις — 持っているものを固く握る. στέφανος — 冠."
  12: "στῦλος — 柱. ναός — 神殿. καινὴ Ἰερουσαλήμ — 新しいエルサレム. τὸ ὄνομά μου τὸ καινόν — わたしの新しい名."
  13: "См. 3:6; текст стиха в базе совпадает со ст. 6."
  14: "ὁ Ἀμήν — титул «Аминь» (не восклицание), поэтому без кавычек: アーメンである方. ὁ μάρτυς ὁ πιστὸς καὶ ἀληθινός — 忠実で真実な証人. ἀρχή — 初め; слово означает и «начало», и «начальник», двусмысленность сохранена."
  15: "ψυχρός / ζεστός — 冷たい / 熱い. ὄφελον… ἦς — であればよかったのに (сожаление, не «хотел бы»)."
  16: "χλιαρός — 生ぬるい. μέλλω σε ἐμέσαι — 吐き出すことにしよう. ἑμέσαι не смягчено."
  17: "Слова церкви переданы как 『…』 внутри речи Христа. ταλαίπωρος — 惨め. ἐλεεινός — 哀れ. οὐκ οἶδας — 知らない (не «не понимаешь»)."
  18: "συμβουλεύω — 勧める. χρυσίον πεπυρωμένον ἐκ πυρός — 火で鍛えた金. κολλούριον — 目薬; ἐγχρῖσαι — 塗る. ἵνα βλέπῃς — 見えるようになる."
  19: "ἐγὼ ὅσους ἐὰν φιλῶ — 愛する者はだれでも. ἐλέγχω καὶ παιδεύω — 責め、懲らしめる. ζήλευε — 熱心になる."
  20: "ἕστηκα ἐπὶ τὴν θύραν — 戸口に立って. κρούω — たたいている. δειπνήσω — 食事をする; взаимность («он со Мной») сохранена."
  21: "καθίσαι μετ᾽ ἐμοῦ ἐν τῷ θρόνῳ μου — 共に御座に座る. ὡς κἀγώ — わたしもまた…とおりである."
  22: "См. 3:6."
