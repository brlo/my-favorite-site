verses:
  1: "エジプトの地[ち]を出[で]てから二年目[にねんめ]、第二[だいに]の月[つき]の一日[ついたち]に、主[しゅ]はシナの荒野[こうや]で、証[あかし]の幕屋[まくや]でモーセに語[かた]って言[い]われた。"
  2: "「イスラエルの子[こ]らの会衆[かいしゅう]すべてを数[かぞ]え上[あ]げなさい。その一族[いちぞく]に従[したが]って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]について。"
  3: "あなたとアロンは、二十歳[さい]以上[いじょう]で、イスラエルの軍勢[ぐんせい]として出[で]て行[い]く者[もの]をみな、その軍勢ごとに数[かぞ]えなさい。"
  4: "あなたがたとともに、おのおのの部族[ぶぞく]ごとに、その長[かしら]が一人[ひとり]ずついる。彼[かれ]らはその父[ちち]の家[いえ]に従[したが]う者[もの]たちである。"
  5: "あなたがたとともに立[た]つ者[もの]たちの名[な]は次[つぎ]のとおりである。ルベンの部族[ぶぞく]からはエリツル、セデウルの子[こ]。"
  6: "シメオンからはサラミエル、スリサダイの子[こ]。"
  7: "ユダからはナアソン、アミナダブの子[こ]。"
  8: "イッサカルからはナタナエル、ソガルの子[こ]。"
  9: "ゼブルンからはエリアブ、ヘロンの子[こ]。"
  10: "ヨセフの子[こ]らからは、エフライムからエリシャマ、アミフドの子[こ]、マナセからガマリエル、ペダツルの子[こ]。"
  11: "ベニヤミンからはアビダン、ギデオニの子[こ]。"
  12: "ダンからはアヒエゼル、アミシャダイの子[こ]。"
  13: "アシェルからはパギエル、オフランの子[こ]。"
  14: "ガドからはエリサフ、レグエルの子[こ]。"
  15: "ナフタリからはアヒラ、エナンの子[こ]。"
  16: "これらは会衆[かいしゅう]から名[な]を呼[よ]ばれた者[もの]たち、その氏族[しぞく]に従[したが]った部族[ぶぞく]の長[かしら]たち、イスラエルの千[せん]人[にん]の長[ちょう]である。」"
  17: "モーセとアロンは、名[な]によって呼[よ]ばれたこれらの者[もの]たちを伴[ともな]った。"
  18: "第二[だいに]の月[つき]の一日[ついたち]に、会衆[かいしゅう]すべてを集[あつ]めた。彼[かれ]らはその家系[かけい]に従[したが]って、その氏族[しぞく]に従って、その名[な]の数[かず]に従って、二十歳[さい]以上[いじょう]のすべての男子[だんし]を、一人[ひとり]ずつ数[かぞ]え上[あ]げた。"
  19: "主[しゅ]がモーセに命[めい]じられたとおりである。こうして彼[かれ]らはシナの荒野[こうや]で数[かぞ]え上[あ]げられた。"
  20: "ルベン、すなわちイスラエルの長子[ちょうし]の子[こ]らは、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  21: "ルベンの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、四万六千五百人[にん]であった。"
  22: "シメオンの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  23: "シメオンの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、五万九千三百人[にん]であった。"
  24: "ユダの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  25: "ユダの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、七万四千六百人[にん]であった。"
  26: "イッサカルの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  27: "イッサカルの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、五万四千四百人[にん]であった。"
  28: "ゼブルンの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  29: "ゼブルンの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、五万七千四百人[にん]であった。"
  30: "エフライムの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  31: "エフライムの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、四万五百人[にん]であった。"
  32: "マナセの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  33: "マナセの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、三万二千二百人[にん]であった。"
  34: "ベニヤミンの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  35: "ベニヤミンの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、三万五千四百人[にん]であった。"
  36: "ガドの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  37: "ガドの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、四万五千六百五十人[にん]であった。"
  38: "ダンの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  39: "ダンの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、六万二千七百人[にん]であった。"
  40: "アシェルの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  41: "アシェルの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、四万一千五百人[にん]であった。"
  42: "ナフタリの子[こ]らも、その一族[いちぞく]に従[したが]って、その氏族[しぞく]に従って、その父[ちち]の家[いえ]に従って、その名[な]の数[かず]に従って、一人[ひとり]ずつ、すべての男子[だんし]、二十歳[さい]以上[いじょう]で軍勢[ぐんせい]として出[で]て行[い]く者[もの]はみな、"
  43: "ナフタリの部族[ぶぞく]から数[かぞ]え上[あ]げられた者[もの]は、五万三千四百人[にん]であった。"
  44: "これが、モーセとアロン、およびイスラエルの長[かしら]たちが行[おこな]った数[かぞ]え上[あ]げである。十二人[にん]、部族[ぶぞく]ごとに一人[ひとり]ずつ、父[ちち]の家[いえ]の部族ごとに一人ずつであった。"
  45: "イスラエルの子[こ]らの数[かぞ]え上[あ]げはすべて、その軍勢[ぐんせい]とともに、二十歳[さい]以上[いじょう]で、イスラエルで陣[じん]を組[く]むために出[で]て行[い]く者[もの]はみな、"
  46: "六十万三千五百五十人[にん]であった。"
  47: "しかしレビ人[びと]は、その父[ちち]の部族からは、イスラエルの子[こ]らの中[なか]に数[かぞ]えられなかった。"
  48: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  49: "「レビの部族[ぶぞく]を数[かぞ]え上[あ]げてはならない。その数[かず]をイスラエルの子[こ]らの中[なか]に取[と]ってはならない。"
  50: "あなたはレビ人[びと]を、証[あかし]の幕屋[まくや]とそのすべての器[うつわ]、その中[なか]にあるすべてのものの上[うえ]に立[た]たせなさい。彼[かれ]らが幕屋とそのすべての器を運[はこ]び、彼らがその中で務[つと]めをし、幕屋の周[まわ]りに宿営[しゅくえい]しなさい。"
  51: "幕屋[まくや]を移[うつ]すときは、レビ人[びと]がそれを下[おろ]し、幕屋を張[は]るときは、彼[かれ]らがそれを立[た]てなさい。他[ほか]の者[もの]が近[ちか]づくなら、死[し]ななければならない。"
  52: "イスラエルの子[こ]らは、おのおの自分[じぶん]の場所[ばしょ]に、おのおの自分の隊[たい]に従[したが]って、その軍勢[ぐんせい]とともに宿営[しゅくえい]しなさい。"
  53: "レビ人[びと]は、証[あかし]の幕屋[まくや]の周[まわ]りに、主[しゅ]の前[まえ]に宿営[しゅくえい]しなさい。そうすれば、イスラエルの子[こ]らに罪[つみ]はない。レビ人は証の幕屋の見張[みは]りを守[まも]りなさい。」"
  54: "イスラエルの子[こ]らは、主[しゅ]がモーセとアロンに命[めい]じられたすべてのとおりに行[おこな]った。そのとおりに行った。"

notes:
  1: "ἐλάλησεν κύριος πρὸς Μωυσῆν — 主はモーセに語って言われた (λέγων — «говоря», отдельно по-японски не передаётся). ἐν τῇ ἐρήμῳ τῇ Σινα — в пустыне Синайской; ἐν τῇ σκηνῇ τοῦ μαρτυρίου — в скинии свидетельства (証の幕屋). ἐν μιᾷ τοῦ μηνὸς τοῦ δευτέρου — в первый день второго месяца; ἔτους δευτέρου — второго года по выходе из Египта (LXX ставит «ἔτους δευτέρου» после месяца)."
  2: "Λάβετε ἀρχήν — букв. «возьмите начало», т. е. «произведите исчисление» (слав. «возьмите сочтение»). κατὰ συγγενείας — 一族 (родство, род), κατ᾿ οἴκους πατριῶν — 父の家, κατὰ ἀριθμὸν ἐξ ὀνόματος — по числу имён, κατὰ κεφαλήν — 一人ずつ (букв. «по голове»). πᾶς ἄρσην — すべての男子; стих обрывается на этом слове, ограничение по возрасту — в ст. 3."
  3: "ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — от двадцати лет и выше. πᾶς ὁ ἐκπορευόμενος ἐν δυνάμει Ισραηλ — всякий выступающий в силе Израиля, т. е. годный в войско (軍勢として出て行く者). ἐπισκέψασθε — 数えなさい (ἐπισκέπτομαι — «исчислять»); повтор в конце стиха, как в LXX."
  4: "μεθ᾿ ὑμῶν ἔσονται — будут с вами. ἕκαστος κατὰ φυλὴν ἑκάστου ἀρχόντων — по племени, начальники (род. падеж при ἕκαστος). κατ᾿ οἴκους πατριῶν ἔσονται — по домам отцов будут; повтор ἔσονται сохранён."
  5: "ταῦτα τὰ ὀνόματα τῶν ἀνδρῶν, οἵτινες παραστήσονται — имена мужей, которые предстанут (παρίστημι). τῶν Ρουβην Ελισουρ υἱὸς Σεδιουρ — «от Рувима Елицур, сын Седеура»: родительный падеж племени при имени вождя. LXX Σεδιουρ (МТ Шедеур; Синодальный — Шедеур)."
  6: "τῶν Συμεων Σαλαμιηλ υἱὸς Σουρισαδαι — от Симеона Саламиил, сын Сурисадая (LXX; МТ Шелумиил, сын Цуришаддая)."
  7: "τῶν Ιουδα Ναασσων υἱὸς Αμιναδαβ — от Иуды Наассон, сын Аминадава; имя уже в корпусе (Исх 6:23)."
  8: "τῶν Ισσαχαρ Ναθαναηλ υἱὸς Σωγαρ — от Иссахара Нафанаил, сын Согаров (LXX Σωγαρ; МТ Цуар)."
  9: "τῶν Ζαβουλων Ελιαβ υἱὸς Χαιλων — от Завулона Елиав, сын Хелона (LXX Χαιλων)."
  10: "τῶν υἱῶν Ιωσηφ — от сынов Иосифа, т. е. два племени от одного родоначальника; τῶν Εφραιμ Ελισαμα υἱὸς Εμιουδ — от Ефрема Елишама, сын Амиуда; τῶν Μανασση Γαμαλιηλ υἱὸς Φαδασσουρ — от Манассии Гамалиил, сын Педацура (LXX Φαδασσουρ)."
  11: "τῶν Βενιαμιν Αβιδαν υἱὸς Γαδεωνι — от Вениамина Авидан, сын Гидеония (LXX Γαδεωνι)."
  12: "τῶν Δαν Αχιεζερ υἱὸς Αμισαδαι — от Дана Ахиезер, сын Амишадая."
  13: "τῶν Ασηρ Φαγαιηλ υἱὸς Εχραν — от Асира Пагиил, сын Охрана (LXX Φαγαιηλ, Εχραν; слав. «Фагаиил, сын Ехранов»)."
  14: "τῶν Γαδ Ελισαφ υἱὸς Ραγουηλ — от Гада Елиасаф, сын Регуила (LXX Ραγουηλ)."
  15: "τῶν Νεφθαλι Αχιρε υἱὸς Αιναν — от Неффалима Ахира, сын Енана; точка в конце стиха в LXX."
  16: "οὗτοι ἐπίκλητοι τῆς συναγωγῆς — это призванные (наречённые) собрания; ἄρχοντες τῶν φυλῶν κατὰ πατριάς — начальники племён по родам; χιλίαρχοι Ισραηλ — тысяченачальники Израиля (千人長). Конец речи Бога."
  17: "ἔλαβεν Μωϋσῆς καὶ Ααρων τοὺς ἄνδρας τούτους τοὺς ἀνακληθέντας ἐξ ὀνόματος — взял Моисей и Аарон мужей сих, названных по имени (ἀνακαλέω — «вызывать по имени»)."
  18: "συνήγαγον — собрали; ἐν μιᾷ τοῦ μηνὸς τοῦ δευτέρου ἔτους — в первый день второго месяца (ἔτος прибавлено к дате, как в слав.). ἐπηξονοῦσαν — редкий глагол, «перечисляли по списку, поименно»; κατὰ γενέσεις — 家系 (по рождениям/родам), κατὰ πατριάς — 氏族."
  19: "ὃν τρόπον συνέταξεν κύριος τῷ Μωυσῇ — как повелел Господь Моисею (συντάσσω — «предписывать»). ἐπεσκέπησαν ἐν τῇ ἐρήμῳ τῇ Σινα — были исчислены в пустыне Синайской."
  20: "καὶ ἐγένοντο οἱ υἱοὶ Ρουβην πρωτοτόκου Ισραηλ — «и были сыны Рувима, первенца Израиля»; формула перечисления: κατὰ συγγενείας — 一族, κατὰ δήμους — 氏族, κατ᾿ οἴκους πατριῶν — 父の家, κατὰ ἀριθμὸν ὀνομάτων — по числу имён, κατὰ κεφαλήν — 一人ずつ. Стих обрывается перед числом (см. 21)."
  21: "ἡ ἐπίσκεψις αὐτῶν ἐκ τῆς φυλῆς Ρουβην — исчисление их из племени Рувима; ἓξ καὶ τεσσαράκοντα χιλιάδες καὶ πεντακόσιοι — 46 500 (LXX, слав. «четыредесять шесть тысящ и пять сот»)."
  22: "τοῖς υἱοῖς Συμεων — дательный падеж: перечисление продолжается без глагола (эллипсис, ср. ст. 20). κατὰ δήμους — 氏族 (δῆμος — «род, клан»; в LXX так же в гл. 3)."
  23: "ἐννέα καὶ πεντήκοντα χιλιάδες καὶ τριακόσιοι — 59 300."
  24: "τοῖς υἱοῖς Ιουδα — дательный падеж, как в ст. 22. У Синодального в этом месте стоит Гад (масоретский порядок) — в LXX здесь Иуда."
  25: "τέσσαρες καὶ ἑβδομήκοντα χιλιάδες καὶ ἑξακόσιοι — 74 600. Слав. «седмьдесят четыри тысящы и шесть сот»; у Синодального в ст. 25 — число Гада (45 650), т. к. он следует другому порядку."
  26: "τοῖς υἱοῖς Ισσαχαρ — дательный падеж. κατὰ ἀριθμὸν ὀνομάτων αὐτῶν — по числу имён их."
  27: "τέσσαρες καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι — 54 400."
  28: "τοῖς υἱοῖς Ζαβουλων — дательный падеж; слав. «от сынов завулоних»."
  29: "ἑπτὰ καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι — 57 400."
  30: "τοῖς υἱοῖς Ιωσηφ υἱοῖς Εφραιμ — «сынам Иосифа, сынам Ефрема»: двойной датив, как в LXX и слав."
  31: "τεσσαράκοντα χιλιάδες καὶ πεντακόσιοι — 40 500 (四万五百人)."
  32: "τοῖς υἱοῖς Μανασση — дательный падеж; слав. добавляет «их» (мужеск пол их) — в греч. нет."
  33: "δύο καὶ τριάκοντα χιλιάδες καὶ διακόσιοι — 32 200."
  34: "τοῖς υἱοῖς Βενιαμιν — дательный падеж; слав. «от сынов вениаминовых»."
  35: "πέντε καὶ τριάκοντα χιλιάδες καὶ τετρακόσιοι — 35 400."
  36: "τοῖς υἱοῖς Γαδ — дательный падеж. У Синодального ст. 36 стоит на месте Вениамина: порядок масоретского текста иной."
  37: "πέντε καὶ τεσσαράκοντα χιλιάδες καὶ ἑξακόσιοι καὶ πεντήκοντα — 45 650 (единственное число с десятками до единиц)."
  38: "τοῖς υἱοῖς Δαν — дательный падеж."
  39: "δύο καὶ ἑξήκοντα χιλιάδες καὶ ἑπτακόσιοι — 62 700."
  40: "τοῖς υἱοῖς Ασηρ — дательный падеж; слав. «от сынов асировых»."
  41: "μία καὶ τεσσαράκοντα χιλιάδες καὶ πεντακόσιοι — 41 500 (四万千五百人)."
  42: "τοῖς υἱοῖς Νεφθαλι — дательный падеж; слав. «от сынов неффалимлих»."
  43: "τρεῖς καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι — 53 400."
  44: "αὕτη ἡ ἐπίσκεψις, ἣν ἐπεσκέψαντο — вот исчисление, которое исчислили; δώδεκα ἄνδρες — двенадцать мужей; ἀνὴρ εἷς κατὰ φυλὴν μίαν κατὰ φυλὴν οἴκων πατριᾶς ἦσαν — по одному на племя, по племени домов отчества (повтор κατὰ φυλήν, как в LXX)."
  45: "σὺν δυνάμει αὐτῶν — с силою их (т. е. по ополчениям); πᾶς ὁ ἐκπορευόμενος παρατάξασθαι ἐν Ισραηλ — всякий выступающий, чтобы строиться в Израиле (παρατάσσω — «выстраивать в боевой порядок»); стих обрывается перед итогом."
  46: "ἑξακόσιαι χιλιάδες καὶ τρισχίλιοι καὶ πεντακόσιοι καὶ πεντήκοντα — 603 550; порядок числительных LXX («шестьсот тысяч, три тысячи, пятьсот и пятьдесят») сохранён в кандзи."
  47: "Οἱ δὲ Λευῖται ἐκ τῆς φυλῆς πατριᾶς αὐτῶν οὐκ ἐπεσκέπησαν — левиты по племени отчества своего не были исчислены; первое упоминание レビ人 в Числах, но в корпусе он уже пояснён (Лк 10:32), поэтому без сноски."
  48: "καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων — новое введение речи Бога; λέγων относится к ст. 49."
  49: "Ὅρα — «смотри, берегись» (imperativus от ὁράω); οὐ συνεπισκέψῃ — не исчислишь вместе (συναπογράφω/συνεπισκέπτομαι — «сопричислять»); οὐ λήμψῃ — не возьмёшь числа их."
  50: "ἐπίστησον — поставь, приставь (ἐφίστημι); ἐπὶ πάντα τὰ σκεύη αὐτῆς — над всею утварью её; ἀροῦσιν — будут носить (αἴρω); λειτουργήσουσιν — будут служить (λειτουργέω); κύκλῳ τῆς σκηνῆς παρεμβαλοῦσιν — вокруг скинии будут становиться станом (παρεμβάλλω)."
  51: "ἐν τῷ ἐξαίρειν τὴν σκηνὴν — при поднятии скинии (ἐξαίρω — «сниматься со стоянки»); καθελοῦσιν — разберут (καθαιρέω); ἀναστήσουσιν — поставят; ὁ ἀλλογενὴς ὁ προσπορευόμενος — посторонний, приступающий (ἀλλογενής — «иноплеменник»); ἀποθανέτω — да умрёт (повеление)."
  52: "ἀνὴρ ἐν τῇ ἑαυτοῦ τάξει — каждый в своём порядке (τάξις — «строй, чин»); κατὰ τὴν ἑαυτοῦ ἡγεμονίαν — по своему начальству (ἡγεμονία — «предводительство»); σὺν δυνάμει αὐτῶν — с силою их."
  53: "παρεμβαλέτωσαν ἐναντίον κυρίου κύκλῳ — пусть становятся станом пред Господом вокруг (ἐναντίον κυρίου — «напротив Господа»); οὐκ ἔσται ἁμάρτημα ἐν υἱοῖς Ισραηλ — не будет греха (вины) у сынов Израиля; φυλακὴ τῆς σκηνῆς — стража скинии."
  54: "καθὰ ἐνετείλατο κύριος — как заповедал Господь; οὕτως ἐποίησαν — так и сделали (повтор, как в LXX и слав.)."
