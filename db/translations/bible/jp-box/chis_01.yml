# jp-box, Числа, глава 1. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этих главах нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: повеление о переписи и вожди племён (1–16), исполнение и перепись по племенам
# (17–43), итог 603 550 (44–46), левиты не исчисляются (47–53), исполнение (54).
# Речь Бога — 「…」: 2–16 и 49–53; 17–48 и 54 — рассказ. Красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе, bracket_check.rb).
# Сносок ⟨…⟩ нет: レビ人 уже пояснён в Лк 10:32 (первое место в корпусе).
# Порядок племён и числа — по LXX: Рувим 46 500, Симеон 59 300, Иуда 74 600, Иссахар 54 400,
# Завулон 57 400, Ефрем 40 500, Манассия 32 200, Вениамин 35 400, Гад 45 650, Дан 62 700,
# Асир 41 500, Неффалим 53 400; всего 603 550. В csl-ru и ru стихи 24–43 идут в масоретском
# порядке (Гад третьим) и с другими числами — это не источник.
# Имена вождей и отцов — строго по таблице брифа. jp-ni не использовался.

