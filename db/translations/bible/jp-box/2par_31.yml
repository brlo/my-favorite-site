book: 2par
chapter: 31
draft: true

verses:
  1: "これらのことがすべて終[お]わると、ユダの町々[まちまち]にいたイスラエルは皆[みな]出[で]て行[い]き、石柱[せきちゅう]を打[う]ち砕[くだ]き、木立[こだち]を切[き]り倒[たお]し、ユダとベニヤミンの全土[ぜんど]、またエフライムとマナセに至[いた]るまで、高[たか]い所[ところ]と祭壇[さいだん]をことごとく取[と]り壊[こわ]した。それからイスラエルは皆[みな]、それぞれ自分[じぶん]の嗣業[しぎょう]の地[ち]、自分[じぶん]の町[まち]へ帰[かえ]った。"
  2: "ヒゼキヤは祭司[さいし]とレビ人[びと]の組[くみ]分[わ]けを定[さだ]め、それぞれの務[つと]めに従[したが]って、燔祭[はんさい]と酬恩祭[しゅうおんさい]のため、また主[しゅ]の家[いえ]の庭[にわ]の門[もん]でほめたたえ、感謝[かんしゃ]し、仕[つか]えるために、祭司[さいし]とレビ人[びと]を配置[はいち]した。"
  3: "また、王[おう]は自分[じぶん]の財産[ざいさん]から、朝[あさ]と夕[ゆう]べの燔祭[はんさい]、および安息日[あんそくび]、新月祭[しんげつさい]、主[しゅ]の律法[りっぽう]に書[か]かれた祭[まつ]りごとの燔祭[はんさい]のために、その分[ぶん]を定[さだ]めた。"
  4: "そして、エルサレムに住[す]む民[たみ]に、祭司[さいし]とレビ人[びと]にその分[ぶん]を与[あた]えるよう命[めい]じた。彼[かれ]らが主[しゅ]の家[いえ]の務[つと]めに専念[せんねん]できるようにするためであった。"
  5: "この言葉[ことば]が広[ひろ]まると、イスラエルの子[こ]らは、穀物[こくもつ]、ぶどう酒[しゅ]、油[あぶら]、蜂蜜[はちみつ]、および野[の]のすべての産物[さんぶつ]の初穂[はつほ]を多[おお]くささげ、十分[じゅうぶん]の一[いち]をすべて大量[たいりょう]に持[も]って来[き]た。"
  6: "イスラエルとユダの子[こ]ら、すなわちユダの町々[まちまち]に住[す]む者[もの]たちも、雄牛[おうし]と羊[ひつじ]の十分[じゅうぶん]の一[いち]、および彼[かれ]らの神[かみ]である主[しゅ]に聖別[せいべつ]されたものの十分[じゅうぶん]の一[いち]を持[も]って来[き]て、山[やま]のように積[つ]み上[あ]げた。"
  7: "第三[だいさん]の月[つき]に彼[かれ]らはその山[やま]を積[つ]み始[はじ]め、第七[だいしち]の月[つき]に終[お]えた。"
  8: "ヒゼキヤと長[かしら]たちが来[き]てその山[やま]を見[み]ると、主[しゅ]とその民[たみ]イスラエルを祝福[しゅくふく]した。"
  9: "ヒゼキヤは祭司[さいし]たちとレビ人[びと]たちに、その山[やま]について尋[たず]ねた。"
  10: "サドクの家[いえ]の祭司[さいし]の長[かしら]アザルヤが彼[かれ]に答[こた]えて言[い]った。「主[しゅ]の家[いえ]に初穂[はつほ]を運[はこ]び始[はじ]めてから、私たちは食[た]べて満[み]ち足[た]り、なお多[おお]くを残[のこ]した。主[しゅ]がご自分[じぶん]の民[たみ]を祝福[しゅくふく]されたからである。残[のこ]ったものはこのとおりの量[りょう]になった。」"
  11: "ヒゼキヤは、主[しゅ]の家[いえ]に部屋[へや]を用意[ようい]するよう命[めい]じた。彼[かれ]らはそれを用意[ようい]した。"
  12: "そして、初穂[はつほ]と十分[じゅうぶん]の一[いち]を忠実[ちゅうじつ]に運[はこ]び入[い]れた。その上[うえ]に、監督[かんとく]としてレビ人[びと]ホナニヤが、次席[じせき]としてその兄弟[きょうだい]シメイが置[お]かれた。"
  13: "また、エヒエル、アザルヤ、ナハト、アサエル、イェリモト、ヨザバド、エリエル、イスマキヤ、マハト、ベナヤは、王[おう]ヒゼキヤと主[しゅ]の家[いえ]の長[かしら]アザルヤの命[めい]に従[したが]い、ホナニヤとその兄弟[きょうだい]シメイの下[もと]で務[つと]めを任[まか]されていた。"
  14: "レビ人[びと]コレ、イムナの子[こ]、東[ひがし]の門衛[もんえい]は、主[しゅ]への自発[じはつ]の捧[ささ]げ物[もの]を扱[あつか]う者[もの]とされ、主[しゅ]にささげられたものと至聖[しせい]のものを配[くば]る務[つと]めについた。"
  15: "オドム、ベニヤミン、エシュア、シェマヤ、アマルヤ、シェカニヤは、祭司[さいし]たちの手[て]によって忠実[ちゅうじつ]に、その兄弟[きょうだい]たちに、大[おお]いなる者[もの]にも小[ちい]さい者[もの]にも、組[くみ]ごとに分[わ]け与[あた]えた。"
  16: "また、三歳[さんさい]以上[いじょう]の男子[だんし]の登録[とうろく]とは別[べつ]に、日[ひ]ごとの務[つと]めのために主[しゅ]の家[いえ]に入[はい]るすべての者[もの]、その組[くみ]の定[さだ]めに従[したが]ってその日[ひ]の務[つと]めにつく者[もの]たちにも分[わ]け与[あた]えた。"
  17: "祭司[さいし]たちは父祖[ふそ]の家[いえ]ごとに登録[とうろく]され、レビ人[びと]たちは二十歳[にじゅうさい]以上[いじょう]で、その組[くみ]に従[したが]い、その務[つと]めの順序[じゅんじょ]に従[したが]って登録[とうろく]された。"
  18: "また、その子[こ]ら、妻[つま]たち、息子[むすこ]たち、娘[むすめ]たち、全会衆[ぜんかいしゅう]とともに登録[とうろく]されたすべての者[もの]にも分[わ]け与[あた]えた。彼[かれ]らは忠実[ちゅうじつ]に聖[せい]なるものを聖別[せいべつ]していたからである。"
  19: "また、祭司[さいし]であるアロンの子[こ]らのために、彼[かれ]らの町々[まちまち]のすべての町[まち]に、名[な]を記[しる]された者[もの]たちが置[お]かれ、祭司[さいし]のうちのすべての男子[だんし]と、レビ人[びと]のうちに数[かぞ]えられるすべての者[もの]に分[わ]け与[あた]えた。"
  20: "ヒゼキヤはユダのすべてでこのように行[おこな]い、主[しゅ]の目[め]に良[よ]いこと、正[ただ]しいこと、真実[しんじつ]なことを行[おこな]った。"
  21: "また、主[しゅ]の家[いえ]の務[つと]めのために始[はじ]めたすべての仕事[しごと]、律法[りっぽう]と戒[いまし]めを求[もと]めることにおいて、彼[かれ]は心[こころ]を尽[つ]くして自分[じぶん]の神[かみ]を求[もと]め、それを成[な]し遂[と]げたので、栄[さか]えた。"

notes:
  1: "ἐξῆλθεν πᾶς Ισραηλ — вышел весь Израиль; συνέτριψαν τὰς στήλας — сокрушили столпы (στήλη, 石柱); ἐξέκοψαν τὰ ἄλση — срубили рощи (ἄλσος, 木立); κατέσπασαν τὰ ὑψηλὰ καὶ τοὺς βωμούς — разрушили высоты и жертвенники (βωμός); ἕως εἰς τέλος — до конца; εἰς τὴν κληρονομίαν αὐτοῦ — в наследие своё (嗣業)."
  2: "ἔταξεν τὰς ἐφημερίας — установил чреды (ἐφημερία, 組); κατὰ τὴν ἑαυτοῦ λειτουργίαν — по своему служению; εἰς τὴν ὁλοκαύτωσιν καὶ εἰς τὴν θυσίαν τοῦ σωτηρίου — на всесожжение и на жертву спасения; αἰνεῖν καὶ ἐξομολογεῖσθαι — хвалить и исповедовать; ἐν ταῖς πύλαις ἐν ταῖς αὐλαῖς — во вратах, во дворах."
  3: "μερὶς τοῦ βασιλέως ἐκ τῶν ὑπαρχόντων αὐτοῦ — часть царя из имущества его; τὴν πρωινὴν καὶ τὴν δειλινήν — утреннее и вечернее; νουμηνίαι — новомесячия (新月祭); τὰς ἑορτὰς τὰς γεγραμμένας ἐν τῷ νόμῳ — праздники, написанные в законе."
  4: "τὴν μερίδα — часть, содержание; ὅπως κατισχύσωσιν ἐν τῇ λειτουργίᾳ — чтобы укрепились, были ревностны в служении (κατισχύω); οἴκου κυρίου — дома Господня."
  5: "ὡς προσέταξεν τὸν λόγον — как только обнародовал слово (προστάσσω); ἐπλεόνασαν — умножили (πλεονάζω); ἀπαρχή — начаток (初穂); γένημα ἀγροῦ — произведение поля; ἐπιδέκατα — десятины (十分の一)."
  6: "ἐπιδέκατα μόσχων καὶ προβάτων καὶ ἐπιδέκατα αἰγῶν — десятины тельцов, овец и козлов; ἡγίασαν τῷ κυρίῳ — освятили Господу; ἔθηκαν σωροὺς σωρούς — положили груды груд (усилительный повтор)."
  7: "ἐν τῷ μηνὶ τῷ τρίτῳ … ἐν τῷ ἑβδόμῳ — в третий месяц … в седьмой; οἱ σωροὶ θεμελιοῦσθαι — груды полагать основание (θεμελιόω); συνετελέσθησαν — были завершены."
  8: "ηὐλόγησαν τὸν κύριον καὶ τὸν λαὸν αὐτοῦ — благословили Господа и народ Его."
  9: "ἐπυνθάνετο — расспрашивал (πυνθάνομαι); ὑπὲρ τῶν σωρῶν — о грудах."
  10: "Αζαριας ὁ ἱερεὺς ὁ ἄρχων εἰς οἶκον Σαδωκ — Азария, священник, начальствующий в доме Садока (первосвященник); ἐξ οὗ ἦρκται — с тех пор как начато; ἐφάγομεν καὶ ἐπίομεν — ели и пили; κατελίπομεν — оставили (καταλείπω); τὸ πλῆθος τοῦτο — это множество."
  11: "παστοφόρια — камеры, кладовые при храме (παστοφόριον; слав. «житницы»); ἑτοιμάσαι — приготовить."
  12: "ἐν πίστει — верно, с доверием; ἐπιστάτης — надзиратель (監督); Χωνενιας — Хонания; διαδεχόμενος — преемствующий, второй (διαδέχομαι)."
  13: "καθεσταμένοι — поставленные (καθίστημι); διὰ Χωνενιου — через Хонанию (под его началом); ἡγούμενος οἴκου κυρίου — начальствующий дома Господня; Ιιηλ, Οζαζιας, Ναεθ, Ασαηλ, Ιεριμωθ, Ιωζαβαθ, Ελιηλ, Σαμαχια, Μααθ, Βαναιας — имена; слав. «озиа» при Οζαζιας."
  14: "πυλωρὸς κατὰ ἀνατολάς — привратник на восток; ἐπὶ τῶν δομάτων — при добровольных дарах (δόμα); τὰ ἅγια τῶν ἁγίων — святое святых, т. е. великие святыни."
  15: "διὰ χειρὸς Οδομ — через руку Одома (слав. «одома»; в тексте — перечисление имён); Ιησους, Σεμει, Αμαριας, Σεχονιας — Иисус, Семей, Амария, Сехония; ἐν πίστει — верно; κατὰ τὰς ἐφημερίας — по чредам; κατὰ τὸν μέγαν καὶ τὸν μικρόν — по большому и малому."
  16: "ἐκτὸς τῆς ἐπιγονῆς τῶν ἀρσενικῶν — сверх списка потомства мужского пола (ἐπιγονή — потомство); ἀπὸ τριετοῦς καὶ ἐπάνω — от трёх лет и выше; εἰς λόγον ἡμερῶν εἰς ἡμέραν — в счёт дней, день за днём; ἐφημερίαις διατάξεως αὐτῶν — чредами устроения их."
  17: "καταλοχισμός — распределение, список (καταλοχίζω); κατ᾽ οἴκους πατριῶν — по домам отцов; ἀπὸ εἰκοσαετοῦς — от двадцатилетнего; ἐν διατάξει — в устроении, по чину."
  18: "καταλοχίαι — списки; ἐπιγονή — потомство; εἰς πᾶν τὸ πλῆθος — во всё множество; ἐν πίστει ἥγνισαν τὸ ἅγιον — верно освятили святое."
  19: "ἱερατεύουσιν — священствующим (ἱερατεύω); ὠνομάσθησαν ἐν ὀνόματι — названы по имени; μερίδα — часть; καταριθμουμένῳ — причисленному (καταριθμέω)."
  20: "τὸ καλὸν καὶ τὸ εὐθές — доброе и правое; слав. добавляет «и истинное» («благое и правое и истинное») — внесено в текст (真実)."
  21: "ἐν παντὶ ἔργῳ … ἤρξατο — во всяком деле, которое начал; ἐξεζήτησεν τὸν θεὸν αὐτοῦ ἐξ ὅλης ψυχῆς — взыскал Бога своего всей душой; εὐοδώθη — был успешен (εὐοδόω)."
