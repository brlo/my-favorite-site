# jp-box, 2-я Паралипоменон, глава 31. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru), по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni (под авторским правом)
# не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 31: истребление идолослужения (1), чреды и содержание служащих (2–4),
# десятины и груды (5–10), кладовые и распределение (11–19), итог царствования (20–21).
# Речь: Азария — 「…」 (10). Красного нет.
# Нумерация по gr: 21 стих, совпадает с csl.
# 〔…〕 нет: csl-чтение 31:20 («и истинное») внесено в основной текст без скобок;
# расхождения с LXX оговорены в notes.
# Сносок ⟨…⟩ нет: 祭壇, 高い所, 祭司, レビ人, 燔祭, 酬恩祭, 会衆, 嗣業 уже в корпусе.
# jp-ni не использовался.

