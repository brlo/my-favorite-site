# jp-box, Исаия, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для гл. 19 есть фрагментарно (стихи 1,
# 3–5, 12, 16, 19–21): использован для сверки церковного чтения, не как источник;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: 1–4 Господь грядёт в Египет, междоусобие, дух изнеможения, жестокий
# властелин; 5–10 иссякание Нила, стон рыбаков и ткачей; 11–15 обезумевшие князья
# Таниса и Мемфиса, дух помрачения; 16–17 страх Иудеи; 18 пять городов и «город
# правды»; 19–22 жертвенник и стела, знамение, познание Господа, исцеление;
# 23–25 путь Египет — Ассирия, Израиль третий, благословение.
# Прямая речь — 19:11 (слова к фараону) и 19:25 (благословение Господа после
# формулы «говоря» вне кавычек); остальное — пророческая речь и авторский текст.
# Нумерация по gr: 25 стихов, как в csl и ru. Слав. 19:9 вбирает начало 19:10
# (οἱ διαζόμενοι αὐτὰ ἐν ὀδύνῃ), а в 19:21 добавляет «и дары»; деление держим по gr.
# 19:18: LXX πόλις ασεδεκ — 義の都 (у МТ «город разрушения» — в notes, разночтение
# важное). 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

