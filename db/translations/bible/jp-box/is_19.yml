verses:
  1: "エジプトについての幻[まぼろし]。見[み]よ、主[しゅ]は軽[かろ]やかな雲[くも]の上[うえ]に座[すわ]ってエジプトへ来[く]る。エジプトの手[て]で造[つく]ったものは主の前[まえ]から震[ふる]え動[うご]き、彼らの心[こころ]は彼らの中[なか]で打[う]ち負[ま]かされる。"
  2: "エジプト人[じん]はエジプト人[じん]に向[む]かって立[た]ち上[あ]がる。人[ひと]は兄弟[きょうだい]に、人[ひと]はそれぞれ隣人[りんじん]に戦[たたか]いを仕[し]かける。町[まち]は町[まち]に、州[しゅう]は州[しゅう]に立[た]ち向[む]かう。"
  3: "エジプト人[じん]の霊[れい]は彼らの中[なか]で乱[みだ]れ、わたしは彼らの計[はかり]ごとを散[ち]らす。彼らは自分[じぶん]の神々[かみがみ]とその像[ぞう]に問[と]い、地[ち]から声[こえ]を発[はっ]する者[もの]たちと、腹[はら]の内[うち]で語[かた]る者[もの]たちに問[と]う。"
  4: "わたしはエジプトを、厳[きび]しい主人[しゅじん]である人[ひと]びとの手[て]に渡[わた]す。厳[きび]しい王[おう]たちが彼らを治[おさ]める。万軍[ばんぐん]の主[しゅ]はこう言[い]われる。"
  5: "エジプト人[じん]は海[うみ]のほとりの水[みず]を飲[の]む。しかし、川[かわ]は尽[つ]きて乾[かわ]き上[あ]がる。"
  6: "川々[かわがわ]と川[かわ]の水路[すいろ]は尽[つ]き、水[みず]の集[あつ]まりはすっかり乾[かわ]き上[あ]がる。葦[あし]とパピルスのすべての沼[ぬま]でも。"
  7: "川[かわ]の周[まわ]りのすべての青[あお]い草[くさ]、川[かわ]に沿[そ]ってまかれたすべてのものは、乾[かわ]き上[あ]がり、風[かぜ]に吹[ふ]かれて滅[ほろ]びる。"
  8: "漁[りょう]師[し]たちは嘆[なげ]き、川[かわ]に釣[つ]り針[ばり]を投[なげ]げる者[もの]は皆[みな]嘆[なげ]く。網[あみ]を投[なげ]げる者[もの]たち、打[う]ち網[あみ]をかける者[もの]たちは悲[かな]しむ。"
  9: "細[こま]かく裂[さ]いた亜麻[あま]を扱[あつか]う者[もの]たちと、上等[じょうとう]な布[ぬの]を織[お]る者[もの]たちは恥[は]じる。"
  10: "それらを織[お]る者[もの]たちは苦[くる]しみの中[なか]にあり、麦[むぎ]の酒[さけ]を造[つく]る者[もの]は皆[みな]悲[かな]しみ、魂[たましい]を痛[いた]める。"
  11: "タニスの支配者[しはいしゃ]たちは愚[おろ]かになり、王[おう]の賢[かしこ]い顧問[こもん]たちの計[はかり]ごとは愚かになる。どうしてあなたがたは王に「わたしたちは賢[かしこ]い者[もの]の子[こ]、昔[むかし]からの王[おう]たちの子[こ]だ」と言[い]えるのか。"
  12: "今[いま]、あなたの賢[かしこ]い者[もの]たちはどこにいるのか。彼らにあなたに告[つ]げさせ、万軍[ばんぐん]の主[しゅ]がエジプトについて何[なに]を定[さだ]めたかを言[い]わせよ。"
  13: "タニスの支配者[しはいしゃ]たちは尽[つ]き果[は]て、メンフィスの支配者[しはいしゃ]たちは高[たか]ぶり、彼らはエジプトを部族[ぶぞく]ごとに迷[まよ]わせる。"
  14: "主[しゅ]が彼らに迷[まよ]いの霊[れい]を混[ま]ぜ合[あ]わせたからである。彼らはすべての業[わざ]によってエジプトを迷[まよ]わせ、酔[よ]った者[もの]と吐[は]く者[もの]がともに、よろめくようにした。"
  15: "エジプト人[じん]には、頭[あたま]とも尾[お]とも、始[はじ]めとも終[お]わりともなる業[わざ]はない。"
  16: "その日[ひ]、エジプト人[じん]は女[おんな]のようになる。万軍[ばんぐん]の主[しゅ]が彼らの上[うえ]に下[くだ]す手[て]の前[まえ]で、恐怖[きょうふ]と震[ふる]えのうちにある。"
  17: "ユダヤの地[ち]はエジプト人[じん]にとって恐怖[きょうふ]となる。だれでもそれを彼らに口[くち]にする者[もの]があれば、彼らは恐[おそ]れる。万軍[ばんぐん]の主[しゅ]がその地[ち]について定[さだ]めた計[はかり]ごとのゆえである。"
  18: "その日[ひ]、エジプトには五[いつ]つの都[みやこ]があり、カナン語[ご]を話[はな]し、万軍[ばんぐん]の主[しゅ]の名[な]によって誓[ちか]う。その一[ひと]つの都[みやこ]は「義[ぎ]の都[みやこ]」と呼[よ]ばれる。"
  19: "その日[ひ]、エジプトの地[ち]に主[しゅ]のための祭壇[さいだん]があり、その境[さかい]のそばに主のための石柱[せきちゅう]がある。"
  20: "それはエジプトの地[ち]で、永遠[えいえん]に主[しゅ]へのしるしとなる。彼らが自分[じぶん]たちを苦[くる]しめる者[もの]のゆえに主に叫[さけ]ぶと、主は彼らに人[ひと]を遣[つか]わし、その者[もの]が彼らを救[すく]う。裁[さば]いて救[すく]うのである。"
  21: "主[しゅ]はエジプト人[じん]に知[し]られ、その日[ひ]、エジプト人[じん]は主[しゅ]を知[し]る。彼らは犠牲[ぎせい]と供[そな]え物[もの]をささげ、主に誓[ちか]いをかけ、それを果[は]たす。"
  22: "主[しゅ]はエジプト人[じん]を大[おお]きな打撃[だげき]で撃[う]ち、癒[いや]しをもって癒[いや]す。彼らは主に帰[かえ]り、主は彼らの声[こえ]を聞[き]いて、彼らを癒[いや]す。"
  23: "その日[ひ]、エジプトからアッシリア人[じん]へと通[かよ]う道[みち]ができる。アッシリア人[じん]はエジプトに入[はい]り、エジプト人[じん]はアッシリア人[じん]のもとへ行[い]き、エジプト人[じん]はアッシリア人[じん]に仕[つか]える。"
  24: "その日[ひ]、イスラエルはアッシリア人[じん]とエジプト人[じん]の間[あいだ]の三番目[さんばんめ]の者[もの]となり、地[ち]の上[うえ]で祝福[しゅくふく]される。"
  25: "万軍[ばんぐん]の主[しゅ]がこれを祝福[しゅくふく]して言[い]われた。「祝福[しゅくふく]されるのは、エジプトにいるわたしの民[たみ]、アッシリアにいる者[もの]、そしてわたしの嗣業[しぎょう]であるイスラエルである。」"

notes:
  1: "Ὅρασις Αἰγύπτου — «Видение Египта»: заголовок; слав. его опускает (начинает с «се, Господь»), в тексте дан по LXX. κάθηται ἐπὶ νεφέλης κούφης — «сидит на облаке лёгком» (κοῦφος — «лёгкий, быстрый»; слав. «седит на облаце легце»). τὰ χειροποίητα — «рукотворённое», т. е. идолы (слав. «рукотворенная»), оставлено без уточнения, как в jp-joc. ἡ καρδία αὐτῶν ἡττηθήσεται ἐν αὐτοῖς — «сердце их будет побеждено в них» (ἡττάομαι — «быть побеждённым»); слав. «разслабнут»."
  2: "ἐπεγερθήσονται — «восстанут, поднимутся» (ἐπεγείρω; слав. «востанут»). πολεμήσει ἄνθρωπος τὸν ἀδελφὸν αὐτοῦ — «человек будет воевать против брата своего» (πολεμέω с винитивом). Слав. добавляет «всяк» («и всяк на ближняго своего»), чего в LXX нет; по паритету оно передано それぞれ, греческая парность «человек… человек» сохранена. νομὸς ἐπὶ νομόν — «ном на ном»: νομός — «область, ном» (египетская административная единица); слав. прочитала как νόμος и дала «закон на закон»."
  3: "ταραχθήσεται τὸ πνεῦμα — «смутится дух» (ταράσσω; слав. «возмятется»). διασκεδάσω — «рассею» (διασκεδάννυμι). ἀγάλματα — «изваяния, кумиры» (слав. «кумиры»). τοὺς ἐκ τῆς γῆς φωνοῦντας — «говорящих из земли», т. е. вызываемых мёртвых (слав. «гласящих от земли»). ἐγγαστρίμυθοι — «чревовещатели», здесь вызыватели мёртвых; передано описательно."
  4: "ἀνθρώπων κυρίων σκληρῶν — «людей, владык жестоких» (κύριος — «господин, владыка»; σκληρός — «жёсткий, жестокий»; слав. «человеков властелей жестоких»). βασιλεῖς σκληροί — «цари жестокие». τάδε λέγει κύριος σαβαωθ — формула вне кавычек. У МТ «в руки властелина жестокого», единственное число; LXX и слав. — множественное."
  5: "πίονται οἱ Αἰγύπτιοι ὕδωρ τὸ παρὰ θάλασσαν — «будут пить египтяне воду, что при море»: необычное чтение LXX (слав. «воду, яже при мори»; jp-joc «海の旁にある水を飲まん»); в МТ «иссякнут воды из моря». ὁ ποταμός — Нил; ἐκλείψει καὶ ξηρανθήσεται — «оскудеет и иссохнет»."
  6: "αἱ διώρυγες τοῦ ποταμοῦ — «каналы реки» (διῶρυξ — «прокоп, канал»; слав. «ровенницы речнии»). συναγωγὴ ὕδατος — «собрание воды», т. е. всякий водоём (слав. «сонм водный»). ἕλος — «болото, заводь» (слав. «луг»). Стих обрывается на предложном обороте: сказуемое 19:7 (ξηρανθήσεται) относится и к нему, обрыв сохранён."
  7: "τὸ ἄχι τὸ χλωρόν — «зелёный злак» (ἄχι — растение у воды, тростник или осока; слав. «злак зеленый»). τὸ σπειρόμενον διὰ τοῦ ποταμοῦ — «сеемое по реке», т. е. посевы по её берегам. ἀνεμόφθορον — «ветром погубляемое» (ἄνεμος + φθείρω; слав. «ветром растленно»)."
  8: "οἱ ἁλεεῖς — «рыбаки» (ἁλιεύς; слав. «рыбарие»). οἱ βάλλοντες ἄγκιστρον — «бросающие крючок»; σαγήνη — «большой невод», ἀμφιβολεύς — «бросающий сеть» (обычно круглую накидную). Слав. «мещущии удицу… неводы… сети»."
  9: "αἰσχύνη λήμψεται — «стыд охватит» (λαμβάνω — «брать, охватывать»). τὸ λίνον τὸ σχιστόν — «лён расщеплённый», т. е. тонко обработанное волокно (σχιστός — «расщеплённый»; слав. «лен разчесаный»). βύσσος — «виссон, тонкое полотно» (слав. «виссон»). Слав. добавляет в конец стиха «и будут делающии я в болезни» — это начало 19:10 по gr; деление держим по gr."
  10: "οἱ διαζόμενοι αὐτὰ — «ткущие их» (διάζομαι — «ткать»); слав. отнесла это к 19:9. ἐν ὀδύνῃ — «в боли» (ὀδύνη). ζῦθος — «пиво, ячменный напиток»; слав. «сикера» (хмельной напиток); передано 麦の酒. τὰς ψυχὰς πονέσουσιν — «душами будут болеть» (πονέω)."
  11: "μωροὶ ἔσονται οἱ ἄρχοντες Τάνεως — «обезумеют князья Таниса» (μωρός — «глупый»; Τάνις — египетский Цоан, слав. «танес»). ἡ βουλὴ αὐτῶν μωρανθήσεται — «совет их обезумеет» (μωραίνω). πῶς ἐρεῖτε τῷ βασιλεῖ — «как скажете царю»: далее прямая речь в кавычках. Υἱοὶ συνετῶν ἡμεῖς, υἱοὶ βασιλέων τῶν ἐξ ἀρχῆς — «мы сыны разумных, сыны царей издревле» (συνετός — «разумный»; слав. «сынове смысленых… сынове царей древних»)."
  12: "ποῦ εἰσιν νῦν οἱ σοφοί σου — «где ныне мудрецы твои»: обращение к Египту и фараону (в jp-joc вводная формула «主はかくの如く言ふ» добавлена — в LXX её нет). ἀναγγειλάτωσάν σοι — «пусть возвестят тебе» (ἀναγγέλλω). τί βεβούλευται κύριος σαβαωθ ἐπ᾿ Αἴγυπτον — «что определил Господь Саваоф о Египте» (βουλεύομαι — «совещаться, определять»)."
  13: "ἐξέλιπον — «иссякли, исчезли» (ἐκλείπω; слав. «оскудеша»). ὑψώθησαν — «возвысились, возгордились» (ὑψόω; слав. «вознесошася»); возможен и смысл «поднялись» в чине, двусмысленность сохранена. Μέμφις — Мемфис (слав. «мемфитстии»). κατὰ φυλάς — «по племенам» (φυλή; слав. «по племеном»)."
  14: "ἐκέρασεν αὐτοῖς πνεῦμα πλανήσεως — «растворил им дух заблуждения» (κεράννυμι — «смешивать»; слав. «раствори… дух прельщения»). ὡς πλανᾶται ὁ μεθύων καὶ ὁ ἐμῶν ἅμα — «как блуждает пьяный и вместе с ним блюющий» (ἐμέω — «извергать»; слав. «якоже прельщается пияный и купно блюющь»). Образ сохранён без смягчения."
  15: "οὐκ ἔσται … ἔργον, ὃ ποιήσει κεφαλὴν καὶ οὐράν — «не будет дела, которое сделает голову и хвост», т. е. никакого дела, годного в начало и конец (слав. «главу и ошиб»). ἀρχὴν καὶ τέλος — «начало и конец»; парность «голова — хвост» и «начало — конец» сохранена."
  16: "ἔσονται … ὡς γυναῖκες — «будут как женщины», т. е. обессилеют от страха (слав. «аки жены»; jp-joc «恐れ慄かん»). ἐν φόβῳ καὶ ἐν τρόμῳ — «в страхе и трепете» (τρόμος). ἀπὸ προσώπου τῆς χειρὸς κυρίου σαβαωθ — «от лица руки Господа Саваофа», т. е. от поднятой руки; ἣν αὐτὸς ἐπιβαλεῖ αὐτοῖς — «которую Он наложит на них» (ἐπιβάλλω)."
  17: "χώρα τῶν Ιουδαίων — «страна иудеев» (χώρα — «земля, область»; слав. «страиа иудейска» — опечатка модуля). εἰς φόβητρον — «в ужас, в пугало» (φόβητρον). πᾶς ὃς ἂν ὀνομάσῃ αὐτὴν αὐτοῖς — «всякий, кто назовёт её им», т. е. при них вспомнит о ней. διὰ τὴν βουλήν, ἣν βεβούλευται κύριος ἐπ᾿ αὐτήν — «из-за совета, который определил Господь о ней»; слав. «нань» (о нём, Египте) вместо «о ней». Слав. добавляет к κύριος «саваоф» — по паритету в тексте 万軍の主."
  18: "πέντε πόλεις … λαλοῦσαι τῇ γλώσσῃ τῇ Χανανίτιδι — «пять городов, говорящих ханаанским языком» (Χανανῖτις; слав. «языком ханаанитским»). ὀμνύουσαι τῷ ὀνόματι κυρίου — «клянущиеся именем Господа»; слав. добавляет «саваофа». Πόλις ασεδεκ — LXX передаёт евр. как «город правды» (ασεδεκ — транслитерация «ха-цедек», «правда»), отсюда 義の都. Слав. «град аседек» (транслитерация), и он же добавляет к «имени Господа» «саваофа» — в тексте 万軍の主. У МТ «Кир-Харес» — «город разрушения» (при ином огласовании «город солнца», как в Синодальном); чтение LXX важное, поэтому взято в текст, МТ — только здесь."
  19: "θυσιαστήριον τῷ κυρίῳ ἐν χώρᾳ Αἰγυπτίων — «жертвенник Господу в земле египтян» (θυσιαστήριον — 祭壇). στήλη πρὸς τὸ ὅριον αὐτῆς — «стела у предела её» (στήλη — «столп, стела»; слав. «столп в пределех его»); это пограничный памятник, а не идол (jp-joc «主に献る柱»). Смена рода αὐτῆς (LXX, «её» — земли) и «его» (слав.) отмечена."
  20: "εἰς σημεῖον εἰς τὸν αἰῶνα — «в знамение навек» (слав. «в знамение во век»). κεκράξονται πρὸς κύριον διὰ τοὺς θλίβοντας αὐτούς — «возопиют ко Господу из-за притесняющих их» (θλίβω — «теснить»; слав. «на оскорбляющыя их»). ἀποστελεῖ αὐτοῖς κύριος ἄνθρωπον, ὃς σώσει αὐτούς — «пошлёт им Господь человека, который спасёт их» (jp-joc «救ふ人を遣さん»). κρίνων σώσει αὐτούς — «судя, спасёт их» (слав. «судяй спасет я»); оборот тёмный, возможен смысл «как судия спасёт», в тексте буквально."
  21: "γνωστὸς ἔσται κύριος τοῖς Αἰγυπτίοις — «Господь будет познан египтянами» (γνωστός — «известный, познаваемый»; слав. «познан будет»). ποιήσουσιν θυσίας καὶ εὔξονται εὐχὰς τῷ κυρίῳ καὶ ἀποδώσουσιν — «принесут жертвы, дадут обеты Господу и исполнят» (εὔχομαι — «давать обет»; ἀποδίδωμι — «воздавать»). Слав. добавляет «и дары», чего в LXX нет; по паритету внесено в текст (供え物), отмечено здесь."
  22: "πατάξει … πληγῇ μεγάλῃ — «поразит язвою великою» (πληγή — «удар, язва»). ἰάσεται αὐτοὺς ἰάσει — «исцелит их исцелением»: figura etymologica, сохранена. ἐπιστραφήσονται πρὸς κύριον — «обратятся к Господу». Слав. во второй раз добавляет «цельбою» («исцелит их цельбою»); в LXX второй раз без ἰάσει."
  23: "ὁδὸς Αἰγύπτου πρὸς Ἀσσυρίους — «дорога Египта к Ассирии» (слав. «путь от египта ко ассирианом»). εἰσελεύσονται Ἀσσύριοι εἰς Αἴγυπτον … Αἰγύπτιοι πορεύσονται πρὸς Ἀσσυρίους — взаимное движение сохранено, «Ассур» и «Египет» не сглажены. δουλεύσουσιν οἱ Αἰγύπτιοι τοῖς Ἀσσυρίοις — «будут служить египтяне ассирийцам» (δουλεύω — «служить, быть рабом»); в Синодальном «будут служить Господу», в LXX и слав. — «ассирийцам»; держим LXX и слав."
  24: "τρίτος ἐν τοῖς Ἀσσυρίοις καὶ ἐν τοῖς Αἰγυπτίοις — «третий среди ассирийцев и египтян», т. е. третий участник союза (слав. «третий во египтянех и во ассирианех» — обратный порядок). εὐλογημένος ἐν τῇ γῇ — «благословенный на земле»."
  25: "ἣν εὐλόγησεν κύριος σαβαωθ λέγων — «которую благословил Господь Саваоф, говоря»: формула вне кавычек. Εὐλογημένος ὁ λαός μου ὁ ἐν Αἰγύπτῳ καὶ ὁ ἐν Ἀσσυρίοις καὶ ἡ κληρονομία μου Ισραηλ — «благословен народ Мой в Египте, и [народ] в Ассирии, и наследие Моё — Израиль». В МТ на месте Ассирии «дело рук Моих»; LXX и слав. дают «наследие Моё — Израиль», держим их."
