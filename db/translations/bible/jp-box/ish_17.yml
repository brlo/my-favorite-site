verses:
  1: "イスラエルの子[こ]らの会衆[かいしゅう]はすべて、主[しゅ]の言葉[ことば]によってシンの荒[あ]れ野[の]を発[た]ち、自分[じぶん]たちの宿営[しゅくえい]に従[したが]って進[すす]み、レフィディンに宿営[しゅくえい]した。しかし、民[たみ]が飲[の]む水[みず]がなかった。"
  2: "民[たみ]はモーセをののしって言[い]った。「わたしたちに飲[の]む水[みず]を与[あた]えよ。」モーセは彼[かれ]らに言[い]った。「なぜ、あなたがたはわたしをののしるのか。なぜ、主[しゅ]を試[こころ]みるのか。」"
  3: "民[たみ]はそこで水[みず]に渇[かわ]き、民[たみ]はそこでモーセにつぶやいて言[い]った。「なぜ、あなたはわたしたちをエジプトから上[のぼ]らせたのか。わたしたちと、子[こ]どもたちと、家畜[かちく]を渇[かわ]きで殺[ころ]すためか。」"
  4: "モーセは主[しゅ]に叫[さけ]んで言[い]った。「この民[たみ]に、わたしはどうすればよいのでしょうか。もう少[すこ]しで、彼[かれ]らはわたしを石[いし]で打[う]ち殺[ころ]そうとしています。」"
  5: "主[しゅ]はモーセに言[い]われた。「民[たみ]の前[まえ]を進[すす]みなさい。民[たみ]の長老[ちょうろう]たちの中[なか]から、いく人[にん]かをあなたとともに連[つ]れて行[い]きなさい。あなたがナイル川[がわ]を打[う]った、あの杖[つえ]を手[て]に取[と]って行[い]きなさい。"
  6: "見[み]よ、わたしは、あなたが来[く]る前[まえ]に、ホレブの岩[いわ]の上[うえ]に立[た]っている。あなたがその岩[いわ]を打[う]てば、そこから水[みず]が出[で]て、わたしの民[たみ]は飲[の]む。」モーセはイスラエルの子[こ]らの前[まえ]でそのとおりに行[おこな]った。"
  7: "彼[かれ]はその場所[ばしょ]の名[な]を「試[こころ]み」と「ののしり」と名[な]づけた。イスラエルの子[こ]らがののしったからであり、彼[かれ]らが主[しゅ]を試[こころ]みて、「主[しゅ]はわたしたちのうちにいるのか、いないのか」と言[い]ったからである。"
  8: "アマレクが来[き]て、レフィディンでイスラエルと戦[たたか]った。"
  9: "モーセはヨシュアに言[い]った。「強[つよ]い男[おとこ]たちを選[えら]んで、出[で]て行[い]き、明日[あす]、アマレクと戦[たたか]いなさい。見[み]よ、わたしは丘[おか]の頂[いただき]に立[た]ち、神[かみ]の杖[つえ]を手[て]に持[も]っている。」"
  10: "ヨシュアはモーセが言[い]ったとおりに行[おこな]い、出[で]て行[い]ってアマレクと戦[たたか]った。モーセとアロンとオルは、丘[おか]の頂[いただき]に上[のぼ]った。"
  11: "モーセが手[て]を上[あ]げている間[あいだ]はイスラエルが勝[か]ち、手[て]を下[お]ろすとアマレクが勝[か]った。"
  12: "しかし、モーセの手[て]は重[おも]くなった。そこで彼[かれ]らは石[いし]を取[と]って来[き]て彼[かれ]の下[した]に置[お]き、彼[かれ]はその上[うえ]に座[すわ]った。アロンとオルは、一[ひと]人[り]はこちら側[がわ]から、一[ひと]人[り]はあちら側[がわ]から彼[かれ]の手[て]を支[ささ]え、その手[て]は日[ひ]の入[い]りまで上[あ]げられたままになった。"
  13: "ヨシュアはアマレクとその民[たみ]すべてを、剣[つるぎ]で打[う]ち破[やぶ]った。"
  14: "主[しゅ]はモーセに言[い]われた。「これを書[かき]物[もの]に記[しる]して記念[きねん]とし、ヨシュアの耳[みみ]に入[い]れよ。『わたしはアマレクの記憶[きおく]を、天[てん]の下[した]から完全[かんぜん]に消[け]し去[さ]る。』」"
  15: "モーセは主[しゅ]のために祭壇[さいだん]を築[きず]き、その名[な]を「主[しゅ]はわたしの逃[のが]れ場[ば]」と名[な]づけた。"
  16: "主[しゅ]は隠[かく]れた手[て]によって、代々[よよ]アマレクと戦[たたか]われるからである。"

notes:
  1: "ἀπῆρεν … κατὰ παρεμβολὰς αὐτῶν — двинулось по станам своим (παρεμβολή — стан). διὰ ῥήματος κυρίου — по слову Господню. Ραφιδιν — Рефидим. οὐκ ἦν ὕδωρ τῷ λαῷ πιεῖν — не было воды народу пить (дат. + инф.)."
  2: "ἐλοιδορεῖτο — бранился, укорял (λοιδορέω). Δὸς ἡμῖν ὕδωρ — дай нам воду. Τί λοιδορεῖσθέ μοι — что вы укоряете меня. πειράζετε κύριον — искушаете Господа."
  3: "ἐδίψησεν ὁ λαὸς ὕδατι — жаждал народ воды (дат. при διψάω). Ἵνα τί τοῦτο ἀνεβίβασας — «к чему это ты вывел» (ἀναβιβάζω — вести вверх, выводить). τὰ κτήνη τῷ δίψει — скот жаждою (дат. причины)."
  4: "ἐβόησεν — возопил (βοάω). ἔτι μικρὸν καὶ καταλιθοβολήσουσίν με — ещё немного, и побьют меня камнями (καταλιθοβολέω)."
  5: "Προπορεύου τοῦ λαοῦ — иди пред народом (προπορεύομαι + род.). ἀπὸ τῶν πρεσβυτέρων — из старейшин. τὴν ῥάβδον, ἐν ᾗ ἐπάταξας τὸν ποταμόν — жезл, которым ты ударил реку (ὁ ποταμός — Нил; слав. «море» — иное чтение, в скобки не берём)."
  6: "ὅδε ἐγὼ ἕστηκα πρὸ τοῦ σὲ ἐκεῖ — «вот, Я стою там прежде тебя» (ἕστηκα, perfect). ἐπὶ τῆς πέτρας ἐν Χωρηβ — на скале в Хориве. πατάξεις τὴν πέτραν — ударишь в скалу. ἐναντίον τῶν υἱῶν Ισραηλ — пред сынами Израиля (в масоретском — «в глазах старейшин»)."
  7: "Πειρασμὸς καὶ Λοιδόρησις — «Искушение и Поношение» (LXX; в масоретском — Масса и Мерива, так в Синодальном). διὰ τὴν λοιδορίαν — из-за укорения. Εἰ ἔστιν κύριος ἐν ἡμῖν ἢ οὔ — есть ли Господь среди нас или нет."
  8: "Ἦλθεν δὲ Αμαληκ — пришёл Амалик (в LXX имя племени в ед. ч.). ἐπολέμει — воевал (имперфект)."
  9: "Ἐπίλεξον σεαυτῷ ἄνδρας δυνατούς — избери себе мужей сильных. παράταξαι — выстройся для боя (παρατάσσομαι). ἐπὶ τῆς κορυφῆς τοῦ βουνοῦ — на вершине холма (βουνός). ἡ ῥάβδος τοῦ θεοῦ — жезл Божий."
  10: "παρετάξατο τῷ Αμαληκ — построился против Амалика. Ωρ — Ор (спутник Моисея и Аарона). ἀνέβησαν ἐπὶ τὴν κορυφήν — взошли на вершину."
  11: "ὅταν ἐπῆρεν … κατίσχυεν — когда поднимал, одолевал (κατισχύω — брать верх). ὅταν καθῆκεν — когда опускал (καθίημι)."
  12: "βαρεῖαι — отяжелели. ὑπέθηκαν ὑπ᾽ αὐτόν — подложили под него. ἐστήριζον — поддерживали (στηρίζω). ἐντεῦθεν εἷς καὶ ἐντεῦθεν εἷς — один с одной, другой с другой стороны. ἕως δυσμῶν ἡλίου — до захода солнца."
  13: "ἐτρέψατο — обратил в бегство, низложил (τρέπω). ἐν φόνῳ μαχαίρας — убийством меча (φόνος — убийство)."
  14: "Κατάγραψον … ἐν βιβλίῳ — запиши в книгу. δὸς εἰς τὰ ὦτα Ἰησοῖ — вложи в уши Иошуе (Ἰησοῦς здесь — ヨシュア). Ἀλοιφῇ ἐξαλείψω — «изглаждением изглажу», совершенно изглажу (ἀλοιφή — усилительное удвоение). τὸ μνημόσυνον Αμαληκ — память Амалика."
  15: "ᾠκοδόμησεν … θυσιαστήριον — построил жертвенник. ἐπωνόμασεν τὸ ὄνομα αὐτοῦ — нарёк имя ему. Κύριός μου καταφυγή — «Господь — прибежище моё» (в масоретском — Иегова Нисси, «Господь — знамя моё»; Синодальный)."
  16: "ἐν χειρὶ κρυφαίᾳ — тайною рукою (κρυφαῖος — скрытый). πολεμεῖ κύριος ἐπὶ Αμαληκ — воюет Господь против Амалика. ἀπὸ γενεῶν εἰς γενεάς — из рода в род. Стих продолжает объяснение имени жертвенника, поэтому без кавычек."
