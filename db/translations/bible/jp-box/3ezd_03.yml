# jp-box, 3-я Ездры, глава 3. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте (gr-lxx-byz) книги нет;
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет;
# jp-ni не использовался. Нумерация — славянская.
# Язык — современный 常体; порядок членов и клаузы — по славянскому.
# 〔…〕 нет (слав. — церковное чтение); сносок ⟨…⟩ нет.
#
# Содержание главы 3: начало диалога о страдании праведных. 1–3 Ездра в Вавилоне,
# в тридцатый год по разорении города, смущается, видя запустение Сиона и изобилие
# Вавилона; 4–36 его молитва ко Всевышнему: творение и падение Адама, потоп,
# Ной, Авраам и завет, Иаков и Египет, Синай и закон, «сердце лукавое» как корень
# зла, Давид и город, пленение города, «неужели Вавилон лучше Сиона?», «нигде
# не найдётся имя Твоё, только у Израиля».
# Голоса: 1–3 — повествование Ездры без кавычек; 4–36 — его молитва в 「…」
# (в 18 «и прошла слава Твоя…» — продолжение той же молитвы; прямой речи других
# лиц нет, поэтому 『…』 в главе не встречается).
# Слав. 3:4 «и повелел еси людем» расходится с ru «повелел персти» — чтение тёмное,
# переведено по смыслу ru; см. notes.
#
