verses:
  1: "都[みやこ]が荒[あ]らされてから三十[さんじゅう]年目[ねんめ]、わたしはバビロンにいて、床[とこ]に横[よこ]たわったまま心[こころ]が乱[みだ]れ、思[おも]いが次々[つぎつぎ]と心[こころ]に上[のぼ]ってきた。"
  2: "わたしはシオンの荒廃[こうはい]と、バビロンに住[す]む者[もの]たちの大[おお]きな繁栄[はんえい]を見[み]たからである。"
  3: "それゆえ、わたしの霊[れい]は大[おお]いに乱[みだ]れ、わたしは切[せつ]なる言葉[ことば]をもって、いと高[たか]き方[かた]に語[かた]り始[はじ]めた。"
  4: "「ああ、主[しゅ]なる主[あるじ]よ。あなたは初[はじ]めに、ただひとりで地[ち]を基[きづ]き、塵[ちり]に命[めい]じられた。"
  5: "アダムに死[し]ぬべき肉[にく]を与[あた]えられた。しかしこれもあなたの手[て]の業[わざ]であった。あなたは彼のうちに命[いのち]の息[いき]を吹[ふ]き入[い]れ、彼はあなたの前[まえ]に生[い]きた者[もの]となった。"
  6: "あなたは彼を、地[ち]が芽[め]を出[だ]す前[まえ]に、あなたの右[みぎ]の手[て]が植[う]えた楽園[らくえん]に導[みちび]き入[い]れた。"
  7: "あなたは彼に、あなたの戒[いまし]めを守[まも]るよう命[めい]じられた。しかし彼はそれを破[やぶ]り、あなたはただちに彼とその一族[いちぞく]を死[し]に渡[わた]された。そして諸国[しょこく]の民[たみ]と部族[ぶぞく]、もろもろの民[たみ]と国民[こくみん]が生[う]まれ、その数[かず]は数[かぞ]えきれない。"
  8: "諸民[しょみん]はそれぞれ自分[じぶん]の欲[よく]するままに歩[あゆ]み、あなたの前[まえ]で怪[あや]しむべきことを行[おこな]い、あなたの戒[いまし]めを蔑[さげす]んだ。"
  9: "それから時[とき]が来[き]て、あなたは彼らの上[うえ]に洪水[こうずい]を臨[のぞ]ませ、地[ち]に住[す]む者[もの]たちを滅[ほろ]ぼされた。"
  10: "彼らの一人[ひとり]ひとりに、アダムに死[し]が来[き]たように、洪水[こうずい]が来[き]た。"
  11: "しかしあなたは彼らのうちから、その家[いえ]の者[もの]たちとともにノアひとりを残[のこ]された。すべての正[ただ]しい者[もの]たちは彼から生[う]まれた。"
  12: "地[ち]に住[す]む者[もの]たちが増[ふ]え始[はじ]め、子[こ]らも民[たみ]も諸国[しょこく]の民[たみ]も多[おお]く増[ふ]えたとき、彼らは再[ふたた]び、前[まえ]よりも多[おお]く不敬[ふけい]を行[おこな]い始[はじ]めた。"
  13: "彼らがあなたの前[まえ]で不法[ふほう]を行[おこな]っているとき、あなたは彼らの中[なか]から一人[ひとり]の男[おとこ]を選[えら]ばれた。その名[な]はアブラハムといった。"
  14: "あなたは彼を愛[あい]し、彼ひとりにあなたの御心[みこころ]を示[しめ]された。"
  15: "あなたは彼と永遠[えいえん]の契約[けいやく]を結[むす]び、彼に、その子孫[しそん]を決[けっ]して見捨[みす]てないと言[い]われた。あなたは彼にイサクを与[あた]え、イサクにはヤコブとエサウを与[あた]えられた。"
  16: "あなたはヤコブを選[えら]び、エサウを退[しりぞ]けられた。ヤコブは大[おお]きな群[む]れへと増[ふ]え広[ひろ]がった。"
  17: "あなたが彼の子孫[しそん]をエジプトから導[みちび]き出[だ]したとき、彼らをシナイの山[やま]へ連[つ]れて来[こ]られた。"
  18: "あなたは天[てん]を傾[かたむ]け、地[ち]を据[す]え、世界[せかい]を揺[ゆ]るがし、深淵[しんえん]を震[ふる]えさせ、世[よ]をかき乱[みだ]された。"
  19: "あなたの栄光[えいこう]は四[よっ]つの門[もん]を通[とお]って進[すす]んだ。火[ひ]と地震[じしん]と風[かぜ]と霜[しも]である。あなたがヤコブの子孫[しそん]に律法[りっぽう]を与[あた]え、イスラエルの一族[いちぞく]に熱心[ねっしん]を与[あた]えるためであった。"
  20: "しかしあなたは、あなたの律法[りっぽう]が彼らのうちに実[み]を結[むす]ぶために、彼らから悪[あ]しき心[こころ]を取[と]り去[さ]らなかった。"
  21: "悪[あ]しき心[こころ]を抱[いだ]いた最初[さいしょ]のアダムは背[そむ]き、打[う]ち負[ま]かされた。彼から生[う]まれたすべての者[もの]も同[おな]じである。"
  22: "弱[よわ]さと律法[りっぽう]は、悪[あく]の根[ね]とともに人[ひと]の心[こころ]のうちにとどまった。善[ぜん]は消[き]え、悪[あく]が始[はじ]まった。"
  23: "時[とき]は過[す]ぎ、年[とし]は終[お]わり、あなたはダビデという名[な]のしもべを起[おこ]された。"
  24: "あなたは彼に、あなたの名[な]の都[みやこ]を建[た]て、その中[なか]であなたに香[こう]と犠牲[ぎせい]をささげるよう命[めい]じられた。"
  25: "これが多[おお]くの年[とし]の間[あいだ]続[つづ]いたが、その都[みやこ]に住[す]む者[もの]たちは罪[つみ]を犯[おか]した。"
  26: "彼らはすべてにおいて、アダムとそのすべての子孫[しそん]が行[おこな]ったように行[おこな]った。彼ら自身[じしん]も悪[あ]しき心[こころ]を抱[いだ]いていたからである。"
  27: "それゆえ、あなたはあなたの都[みやこ]をあなたの敵[てき]の手[て]に渡[わた]された。"
  28: "バビロンに住[す]む者[もの]たちは、それよりも良[よ]いことを行[おこな]っているから、シオンを支配[しはい]しているのか。"
  29: "わたしがここに来[き]て、数[かぞ]えきれない不敬[ふけい]を見[み]、この三十[さんじゅう]年目[ねんめ]に多[おお]くの罪[つみ]を犯[おか]す者[もの]たちをわたしの魂[たましい]が見[み]て、わたしの心[こころ]は恐[おそ]れに捕[と]らわれた。"
  30: "あなたが罪[つみ]を犯[おか]す者[もの]たちをいかに耐[た]え忍[しの]び、不敬[ふけい]な者[もの]たちを惜[お]しみ、あなたの民[たみ]を滅[ほろ]ぼし、あなたの敵[てき]を保[たも]ち、誰[だれ]にもそれを告[つ]げなかったのを、わたしは見[み]たからである。"
  31: "まことに、わたしはこれをどう理解[りかい]すべきか知[し]らない。バビロンの行[おこな]いがシオンの行[おこな]いよりも良[よ]いのか。"
  32: "イスラエルのほかに、あなたを知[し]った民[たみ]があるのか。どの部族[ぶぞく]が、ヤコブのようにあなたの証[あかし]を信[しん]じたのか。"
  33: "彼らには報[むく]いが現[あらわ]れず、その労[ろう]も実[み]を結[むす]ばない。わたしは諸国[しょこく]の民[たみ]の間[あいだ]を通[とお]り過[す]ぎて、彼らが栄[さか]え、あなたの戒[いまし]めを思[おも]い出[だ]さないのを見[み]たからである。"
  34: "それゆえ今[いま]、わたしたちの不義[ふぎ]と、地[ち]に住[す]む者[もの]たちの不義[ふぎ]を秤[はかり]にかけて量[はか]ってください。そうすれば、あなたの名[な]がイスラエルのほかにはどこにも見[み]つからないことが分[わ]かるでしょう。"
  35: "地[ち]に住[す]む者[もの]たちが、いつあなたの前[まえ]に罪[つみ]を犯[おか]さなかったことがあるのか。どの民[たみ]が、このようにあなたの戒[いまし]めを守[まも]ったのか。"
  36: "あなたはこれらの者[もの]のうちに、名[な]を挙[あ]げてあなたの戒[いまし]めを守[まも]った者[もの]たちを見[み]つけるが、ほかの民[たみ]のうちには見[み]つけない。」"
notes:
  1: "слав. «Лета тридесятаго от разорения града, бех въ вавилоне и смятохся на одре моем лежащь, и помышления моя восхождаху на сердце мое» — «от разорения града» — от разрушения города (счёт от падения Иерусалима, как в ru); «смятохся» — пришёл в смятение (смястися); «на одре» — на ложе, постели."
  2: "слав. «понеже видех опустение сиона и изобилие велие живущих в вавилоне» — «опустение» — опустошение, запустение; «изобилие велие» — великое изобилие. Противопоставление запустения Сиона и богатства Вавилона — завязка всей книги."
  3: "слав. «(Того ради) смутися дух мой зело, и начах умиленными словесы глаголати к вышнему» — скобки «(Того ради)» в слав. редакционные, в текст не переносились; «умиленными словесы» — умилёнными, сокрушёнными словами (умиление — сокрушение); в ru «со страхом говорить ко Всевышнему». «Вышний» — いと高[たか]き方[かた]."
  4: "слав. «о, владыко Господи! ты (самъ) рекл еси от начала, егда создал еси землю, и сие един, и повелел еси людем» — «владыко Господи» — звательный падеж; скобки «(самъ)» редакционные; «и сие един» — «и это (было) Ты один». Конец стиха в слав. «повелел еси людем» (людям), тогда как ru читает «повелел персти» (прах, Быт 2:7). Слав. чтение тёмное и, вероятно, повреждённое; переведено по смыслу ru — 塵[ちり]に命[めい]じて."
  5: "слав. «и дал еси адаму плоть мертвену, но и сия бяше дело рук твоих, и вдохнул еси в него дух жизни, и бысть жив пред тобою» — «плоть мертвену» — смертную плоть; «сия» — это (о плоти); «бысть жив» — стал живым. Ср. Быт 2:7."
  6: "слав. «и ввел еси его в рай, егоже насади десница твоя, прежде неже прозябе земля» — «прозябе» — произросла, дала побег; «рай» — 楽園[らくえん] (сад). В ru «прежде нежели земля произрастила плоды»."
  7: "слав. «и завещал еси ему сохранити заповедь твою, и преступи ю, и абие предал еси его смерти и род его» — «ю» — её (вин. ж. р.); «абие» — тотчас; «род его» — род, поколение. Далее «родишася языцы и племена, и людие и народи, имже несть числа» — «языцы» — народы."
  8: "слав. «и хождаше кийждо народ по похотем своим, и дивная делаша пред тобою, и презираша заповеди твоя» — «по похотем» — по похотям, вожделениям; «дивная» — дивное, странное (в ru «дела неразумные» — иное понимание слова); «презираша» — презирали."
  9: "слав. «паки же во время навел еси на них потоп и потребил еси живущих на земли» — «паки» — снова, затем; «потоп» — потоп (не «потопление»); «потребил» — истребил."
  10: "слав. «и бысть коемуждо их, якоже адаму умрети, тако сим потоп» — «коемуждо» — каждому; «сим» — им (дат. мн.). Смысл: как Адаму смерть, так им потоп. В ru «как на Адаме смерть, так на сих потоп»."
  11: "слав. «оставил же еси единаго от них ноя с домом его, из негоже (родишася) вси праведнии» — скобки «(родишася)» редакционные; «праведнии» — праведные (мн.). В ru «и от него произошли все праведные»."
  12: "слав. «егда начаша множитися живущии на земли, и умножиша сыны и люди и языки многи, и начаша паки нечестие творити множае прежних» — «языки многи» — многие народы; «множае прежних» — более прежних."
  13: "слав. «и бысть, егда беззаконие творяху пред тобою, избрал еси себе мужа от сих, емуже имя бе авраам» — «творяху» — делали (имперфект 3 л. мн.); «емуже» — которому. В ru «когда начали делать пред Тобою беззаконие»."
  14: "слав. «и возлюбил еси его, и показал еси ему единому хотение твое» — «хотение» — волю, желание; «единому» — одному (только ему). В ru «открыл ему одному волю Твою»."
  15: "слав. «и положил еси ему завет вечный, и рекл еси ему, яко никогда оставиши семене его, и дал еси ему исаака, исааку же дал еси иакова и исава» — «положил» — поставил, заключил; «семене» — семени (род. ед.); «оставиши» — оставишь (2 л.)."
  16: "слав. «и избрал еси себе иакова, исава же отринул еси, и размножися иаков во множество велие» — «множество велие» — великое множество. В ru «И умножился Иаков чрезвычайно»."
  17: "слав. «и бысть, егда извел еси из египта семя его, привел еси к горе синайстей» — «семя его» — потомство; в слав. части соединены без союза «и», в японском — временной связкой. В ru «Когда Ты вывел из Египта семя его и привел к горе Синайской»."
  18: "слав. «и преклонил еси небеса, и уставил еси землю, и поколебал еси вселенную, и трепетати сотворил еси бездны, и возмутил еси мир» — «уставил» — утвердил, установил; «бездны» — бездны; «возмутил» — привёл в смятение. Богоявление на Синае."
  19: "слав. «и пройде слава твоя враты четырьми, огнем и земным трясением, и ветром и мразом, да даси закон семени иаковлю и роду израилеву прилежание» — «враты» — вратами (твор. мн.); «четырьми» — четырьмя; «мраз» — мороз; «прилежание» — усердие, радение. Четыре явления — огонь, землетрясение, ветер, мороз (ср. 3 Цар 19:11–12)."
  20: "слав. «и не отял еси от них сердца лукаваго, да закон твой сотворит в них плод» — «отял» — отнял; «да» — чтобы. В ru «но не отнял у них сердца лукавого, чтобы закон Твой принес в них плод». Смысл: закон не принёс плода, потому что сердце осталось злым."
  21: "слав. «сердце бо лукаво нося первый адам, преступи и побежден бысть, и тако вси, иже от него родишася» — «нося» — нося, имея при себе (прич.); «побежден бысть» — был побеждён. В ru «С сердцем лукавым первый Адам преступил заповедь»."
  22: "слав. «и пребываше немощь и закон с сердцем человеческим, с лукавстом корене, и преста благое, и наста злое» — «лукавстом» — лукавством (твор. падеж); «преста» — прекратилось; «наста» — настало. В ru «Осталась немощь и закон в сердце народа с корнем зла»."
  23: "слав. «и преидоша времена, и скончашася лета, и воздвигл еси себе раба именем давида» — «воздвигл» — воздвиг, поставил. В ru «Прошли времена и окончились лета»."
  24: "слав. «и повелел еси ему создати град имени твоему и приносити в нем тебе фимиам и жертвы» — «фимиам» — фимиам, ладан (香[こう]); «жертвы» — жертвы. В ru «приносить Тебе фимиам и жертвы»."
  25: "слав. «и бысть сие чрез многа лета, и согрешиша живущии в том граде» — «чрез многа лета» — в течение многих лет; в ru «Много лет это исполнялось, и потом согрешили населяющие город»."
  26: "слав. «во всех творяще, якоже сотвори адам и вси родове его, понеже и сами быша сердцем лукави» — «творяще» — делая (прич.); «родове» — роды, поколения. В ru «ибо и у них было сердце лукавое»."
  27: "слав. «и того ради град твой предал еси в руки врагов твоих» — «того ради» — поэтому. В ru то же."
  28: "слав. «еда лучшая творят, иже обитают в вавилоне, и того ради владеют сионом?» — «еда» — ли (вопросительная частица); «лучшая» — лучшее; «владеют» — владеют, господствуют. В ru «Неужели лучше живут обитатели Вавилона»."
  29: "слав. «и бысть егда приидох семо и видех нечестия, имже несть числа, и многих согрешающих виде душа моя в сие тридесятое лето» — «семо» — сюда; «в сие тридесятое лето» — в этот тридцатый год (в ru добавлено «пленения», в слав. этого слова нет)."
  30: "слав. «понеже видех, како терпиши согрешающим и пощадил еси нечествующих и погубил еси люди твоя, сохранил же еси враги твоя и не возвестил еси (ни комуже)» — «терпиши» — терпишь (2 л. ед.); «нечествующих» — нечестивых; скобки «(ни комуже)» редакционные, в текст не переносились."
  31: "слав. «воистинну не вем, како сия уразумети имам? еда суть дела лучшая вавилонская, нежели сионская?» — «не вем» — не знаю; «имам» — должен (имати с инф.). В ru перед этим добавлено «Не понимаю, как этот путь мог измениться» — в слав. этой фразы нет."
  32: "слав. «еда познаша тебе инии языцы кроме израиля? или кая племена вероваша свидением твоим, якоже иаков?» — «инии» — иные; «свидением» — свидетельствам (дат. мн.); «кая» — какие. В ru «веровали заветам Твоим»."
  33: "слав. «ихже мзда не явися, ниже труд их творит плода, понеже прохождая проидох посреде язык и видех я процветающя и не помнящия повелений твоих» — «мзда» — награда, воздаяние; «ниже» — и не; «процветающя» — цветущие, в изобилии. В ru «Ни воздаяние им не равномерно, ни труд их не принес плода»."
  34: "слав. «ныне убо измери на мерилех неправды наша и живущих на земли, и нигде обрящется имя твое, токмо во израили» — «на мерилех» — на весах, мерилах; «измери» — измерь, взвесь (повелит.); «токмо» — только. В ru «взвесь на весах и наши беззакония»."
  35: "слав. «и когда не согрешиша пред тобою живущии на земли? или кий язык тако сохранил заповеди твоя?» — «кий» — какой; «язык» — народ. Двойное отрицание в первом вопросе: «когда не грешили?» = «когда было так, чтобы не грешили?»"
  36: "слав. «сих убо по именом обрящеши сохранивших повеления твоя, языков же не обрящеши» — «по именом» — по именам, поименно; «языков» — народов (род. мн.). В ru «Между сими хотя по именам найдешь хранящих заповеди Твои»."
