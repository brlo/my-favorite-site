chapter: 3
draft: true

verses:
  1: "ヨシュアは朝早[あさはや]く起[お]きた。彼[かれ]らはサティンを発[た]ってヨルダン川[がわ]まで来[き]て、渡[わた]る前[まえ]にそこに宿営[しゅくえい]した。"
  2: "三日[みっか]の後[のち]、書記[しょき]たちが陣営[じんえい]の中[なか]を通[とお]り過[す]ぎた。"
  3: "彼[かれ]らは民[たみ]に命[めい]じて言[い]った。「あなたがたの神[かみ]である主[しゅ]の契約[けいやく]の箱[はこ]、およびそれを担[かつ]ぐわたしたちの祭司[さいし]たちとレビ人[びと]を見[み]たなら、あなたがたは自分[じぶん]の場所[ばしょ]から立[た]ち上[あ]がり、その後[あと]について行[ゆ]きなさい。"
  4: "ただし、あなたがたとそれとの間[あいだ]には、二千[にせん]キュビトほどの距離[きょり]を置[お]きなさい。あなたがたは立[た]って、それに近[ちか]づいてはならない。あなたがたが行[ゆ]く道[みち]を知[し]るためである。あなたがたは、昨日[きのう]も一昨日[おととい]も、この道を通[とお]ったことがないからである。」"
  5: "ヨシュアは民[たみ]に言[い]った。「身[み]を清[きよ]めなさい。明日[あした]、主[しゅ]はあなたがたの間[あいだ]に驚[おどろ]くべきことを行[おこな]われるからである。」"
  6: "ヨシュアは祭司[さいし]たちに言[い]った。「主[しゅ]の契約[けいやく]の箱[はこ]を担[かつ]ぎ上[あ]げ、民[たみ]に先立[さきだ]って進[すす]みなさい。」祭司たちは主の契約の箱を担ぎ上げ、民の前[まえ]を進んだ。"
  7: "主[しゅ]はヨシュアに言[い]われた。「この日[ひ]、わたしはすべてのイスラエルの子[こ]らの前[まえ]であなたを高[たか]くしようと始[はじ]める。わたしがモーセとともにいたように、あなたとともにあることを、彼[かれ]らが知[し]るためである。"
  8: "今[いま]、あなたは契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちに命[めい]じて言[い]いなさい。『あなたがたがヨルダン川[がわ]の水[みず]のほとりに入[はい]ったら、ヨルダン川の中[なか]に立[た]ちなさい。』」"
  9: "ヨシュアはイスラエルの子[こ]らに言[い]った。「ここに近[ちか]づいて、あなたがたの神[かみ]である主[しゅ]の言葉[ことば]を聞[き]きなさい。"
  10: "これによって、生[い]ける神[かみ]があなたがたの間[あいだ]におられ、わたしたちの前[まえ]からカナン人[じん]、ヘテ人[じん]、ペリジ人[じん]、ヒビ人[じん]、アモリ人[じん]、ゲルガシ人[じん]、エブス人[じん]を必[かなら]ず滅[ほろ]ぼされることを知[し]るであろう。"
  11: "見[み]よ、全[ぜん]地[ち]の主[しゅ]の契約[けいやく]の箱[はこ]が、ヨルダン川[がわ]を渡[わた]る。"
  12: "今[いま]、イスラエルの子[こ]らから十二人[にん]の者[もの]を、部族[ぶぞく]ごとに一人[ひとり]ずつ選[えら]びなさい。"
  13: "全[ぜん]地[ち]の主[しゅ]の契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちの足[あし]がヨルダン川[がわ]の水[みず]に踏[ふ]み入[はい]ると、ヨルダン川の水は尽[つ]き、上[かみ]から流[なが]れ下[くだ]る水は立[た]ち止[と]まる。」"
  14: "民[たみ]が自分[じぶん]たちの天幕[てんまく]からヨルダン川[がわ]を渡[わた]るために立[た]ち上[あ]がったとき、祭司[さいし]たちは主[しゅ]の契約[けいやく]の箱[はこ]を担[かつ]いで、民に先立[さきだ]って進[すす]んだ。"
  15: "契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちがヨルダン川[がわ]に入[はい]り、主[しゅ]の契約の箱を担ぐ祭司たちの足[あし]が水[みず]のほとりに浸[ひた]った。ヨルダン川は、小麦[こむぎ]の刈[か]り入[い]れのころには、いつもその岸[きし]いっぱいに溢[あふ]れていた。"
  16: "上[かみ]から流[なが]れ下[くだ]る水[みず]は立[た]ち止[と]まり、カリアティアリムのあたりまで、はるか遠[とお]くに一[ひと]つの堤[つつみ]となって立ちはだかった。下[しも]へ流れる水はアラバの海[うみ]、すなわち塩[しお]の海に流れ下り、ついに尽[つ]きた。民[たみ]はエリコの前[まえ]に立っていた。"
  17: "主[しゅ]の契約[けいやく]の箱[はこ]を担[かつ]ぐ祭司[さいし]たちは、ヨルダン川[がわ]の中[なか]の乾[かわ]いた地[ち]に立[た]った。イスラエルの子[こ]らはみな乾いた地を渡[わた]り、民[たみ]がすべてヨルダン川を渡り終[お]えるまで、そうしていた。"

notes:
  1: "ὤρθρισεν — «встал на рассвете» (ὀρθρίζω). ἀπῆραν ἐκ Σαττιν — «снялись из Саттина» (ἀπαίρω — сниматься со стоянки); в слав. добавлено «и вси сынове израилевы», в греч. нет. κατέλυσαν — «заночевали, стали станом» (καταλύω). πρὸ τοῦ διαβῆναι — «прежде нежели перейти»."
  2: "μετὰ τρεῖς ἡμέρας — «через три дня» (слав. «по триех днех»). οἱ γραμματεῖς — 書記 (γραμματεύς; слав. «книгочия», у Синодального «надзиратели»), ср. 1:10. διὰ τῆς παρεμβολῆς — «через стан» (παρεμβολή)."
  3: "κιβωτὸς τῆς διαθήκης κυρίου τοῦ θεοῦ ἡμῶν — «ковчег завета Господа Бога нашего»; 契約の箱. αἴροντας — «несущих» (αἴρω). ἀπαρεῖτε ἀπὸ τῶν τόπων ὑμῶν — «сниметесь с мест ваших» (тот же глагол ἀπαίρω, что в ст. 1). πορεύεσθε ὀπίσω αὐτῆς — «идите за ним»."
  4: "ὅσον δισχιλίους πήχεις — «до двух тысяч локтей» (πῆχυς — локоть, キュビト). στήσεσθε, μὴ προσεγγίσητε αὐτῇ — «станете, не приблизьтесь к нему» (προσεγγίζω). ἵνα ἐπίστησθε τὴν ὁδόν — «чтобы вы знали путь». ἀπ᾿ ἐχθὲς καὶ τρίτης ἡμέρας — «от вчера и третьего дня» (слав. «ни вчера, ни третияго дне»)."
  5: "ἁγνίσασθε — «освятитесь» (ἁγνίζω — очищать). εἰς αὔριον — «к завтрашнему дню». θαυμαστά — «дивное» (θαυμαστός)."
  6: "Ἄρατε — «поднимите» (αἴρω). προπορεύεσθε τοῦ λαοῦ — «идите впереди народа» (προπορεύομαι). ἔμπροσθεν τοῦ λαοῦ — «пред народом». Первая половина стиха — речь Иисуса, вторая — исполнение."
  7: "ἄρχομαι ὑψῶσαί σε — «начинаю возвышать тебя» (ὑψόω). κατενώπιον πάντων υἱῶν Ισραηλ — «пред всеми сынами Израиля». ἵνα γνῶσιν — «чтобы узнали». καθότι ἤμην μετὰ Μωυσῆ — ср. 1:5. Речь Бога продолжается в ст. 8 (καὶ νῦν — «и ныне»), поэтому стих не закрывает кавычек."
  8: "ἔντειλαι — повелительное от ἐντέλλομαι: «повели». Ὡς ἂν εἰσέλθητε ἐπὶ μέρους τοῦ ὕδατος — «как только войдёте в часть воды» (слав. «на часть воды»). ἐν τῷ Ιορδάνῃ στήσεσθε — «в Иордане станете». Слова, которые Бог велит передать священникам, — 『…』."
  9: "Προσαγάγετε ὧδε — «подойдите сюда» (προσάγω). τὸ ῥῆμα κυρίου τοῦ θεοῦ ἡμῶν — «слово Господа Бога нашего» (слав. «Бога вашего»)."
  10: "ἐν τούτῳ γνώσεσθε — «по сему узнаете». θεὸς ζῶν — «Бог живой». ὀλεθρεύων ὀλεθρεύσει — усилительная конструкция «истребляя истребит» (ἐξολεθρεύω). ἀπὸ προσώπου ἡμῶν — «от лица нашего»: в LXX ἡμῶν, в слав. «от лица вашего»; разночтение сохранено. Порядок народов (Хананей, Хеттей, Ферезей, Евей, Аморрей, Гергесей, Иевусей) — по LXX."
  11: "κιβωτὸς διαθήκης κυρίου πάσης τῆς γῆς — «ковчег завета Господа всей земли» (род. падеж при κιβωτός). διαβαίνει τὸν Ιορδάνην — «переходит Иордан»."
  12: "προχειρίσασθε — «изберите, поставьте заранее» (προχειρίζω). ἕνα ἀφ᾿ ἑκάστης φυλῆς — «по одному от каждого племени»."
  13: "καταπαύσωσιν οἱ πόδες — «успокоятся, остановятся ноги» (καταπαύω). ἐκλείψει — «иссякнет» (ἐκλείπω). τὸ ὕδωρ τὸ καταβαῖνον στήσεται — «нисходящая вода станет»; «стеною» — добавка ст. 16 и Синодального, в этом стихе LXX её нет."
  14: "ἀπῆρεν ὁ λαὸς ἐκ τῶν σκηνωμάτων — «снялся народ из шатров своих» (σκήνωμα — шатёр, 天幕). ἤροσαν — «понесли» (αἴρω, аорист). πρότεροι τοῦ λαοῦ — «прежде народа»."
  15: "ἐβάφησαν εἰς μέρος τοῦ ὕδατος — «погрузились в часть воды» (βάπτω — погружать). ἐπλήρου καθ᾿ ὅλην τὴν κρηπῖδα αὐτοῦ — «наполнялся по всему основанию своему» (κρηπίς — основание, берег; слав. «во вся краи своя»). ὡσεὶ ἡμέραι θερισμοῦ πυρῶν — «как дни жатвы пшеницы». В LXX стих кончается тире, предложение продолжается в ст. 16; jp-joc передаёт то же содержание старым языком."
  16: "ἔστη πῆγμα ἕν — «стала одна плотина, стена» (πῆγμα — сколоченное, плот). ἀφεστηκὸς μακρὰν σφόδρα σφοδρῶς — «отстоящая очень и очень далеко». ἕως μέρους Καριαθιαριμ — «до части Кариафиарима» (евр. Кириаф-Иарим; у Синодального «Кариафиарим»); カリアティアリム. В слав. добавлено «от Адами града» (масоретский текст), в LXX нет; jp-joc тоже называет Адами — как свидетельство, не как источник. θάλασσα Αραβα, θάλασσα ἁλός — «море Арава, море соли», т. е. Мёртвое (塩の海). ὁ λαὸς εἱστήκει ἀπέναντι Ιεριχω — «народ стоял напротив Иерихона»."
  17: "ἐπὶ ξηρᾶς — «на суше» (ξηρᾶ). ἐν μέσῳ τοῦ Ιορδάνου — «среди Иордана». διέβαινον διὰ ξηρᾶς — «переходили по суше». ἕως συνετέλεσεν πᾶς ὁ λαός — «доколе не окончил весь народ». В слав. слова «людие стояху прямо иерихону» стоят в начале ст. 17, в LXX — в конце ст. 16."
