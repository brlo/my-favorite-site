# jp-box, Иисус Навин, глава 3. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc есть в 3:7–8 и 3:15–17
# (старый язык, свидетель церковного чтения — не источник; из него ничего не взято).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: стан у Иордана (1), распоряжение писцов (2–4), освящение и слова Иисуса
# священникам (5–6), обетование Иисусу (7–8), речь Иисуса народу (9–13),
# ковчег впереди и остановка воды (14–17).
# Речь людей — 「…」: 3–4, 5, 6, 9–13; речь Бога — 「…」: 7–8, слова к священникам
# внутри неё — 『…』 (8).
# Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе). 3:15–16 в LXX
# соединены тире и в синодальном делении расходятся — см. notes.
# Сносок ⟨…⟩ нет: 契約の箱, 祭司, レビ人 уже пояснены в корпусе; новых терминов нет.
# jp-ni не использовался.

