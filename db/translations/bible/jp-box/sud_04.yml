verses:
  1: "イスラエルの子[こ]らは再[ふたた]び主[しゅ]の目[め]に悪[あく]を行[おこな]った。"
  2: "主[しゅ]は彼[かれ]らをカナンの王[おう]ヤビンの手[て]に売[う]り渡[わた]された。ヤビンはアソルで王[おう]として治[おさ]めていた。その軍[ぐん]の長[ちょう]はシセラであり、彼[かれ]は諸国民[しょこくみん]のアリソトに住[す]んでいた。"
  3: "イスラエルの子[こ]らは主[しゅ]に向[む]かって叫[さけ]んだ。彼[かれ]には九百[きゅうひゃく]の鉄[てつ]の戦車[せんしゃ]があり、彼[かれ]はイスラエルを二十[にじゅう]年[ねん]の間[あいだ]、力[ちから]ずくで苦[くる]しめたからである。"
  4: "そのころ、ラピドトの妻[つま]である女預言者[おんなよげんしゃ]デボラがイスラエルを裁[さば]いていた。"
  5: "彼女[かのじょ]はエフライムの山地[さんち]の、ラマとベテルの間[あいだ]にあるデボラのなつめやしの木[き]の下[した]に座[すわ]っていた。イスラエルの子[こ]らは裁[さば]きを受[う]けるために、そこへ彼女[かのじょ]のところへ上[のぼ]って来[き]た。"
  6: "デボラは人[ひと]を遣[つか]わして、ナフタリのケデシュからアビノアムの子[こ]バラクを呼[よ]び寄[よ]せた。そして彼[かれ]に言[い]った。「イスラエルの神[かみ]である主[しゅ]は、あなたに命[めい]じられたではないか。『タボル山[やま]へ行[い]き、ナフタリの子[こ]らとゼブルンの子[こ]らから一万人[いちまんにん]の者[もの]を率[ひき]いて来[き]なさい。"
  7: "わたしは、ヤビンの軍[ぐん]の長[ちょう]シセラと、その戦車[せんしゃ]とその大軍[たいぐん]を、キション川[がわ]のほとりのあなたのところへ引[ひ]き寄[よ]せ、彼[かれ]をあなたの手[て]に渡[わた]す。』」"
  8: "バラクは彼女[かのじょ]に言[い]った。「あなたがわたしとともに来[く]るなら、わたしは行[い]きます。あなたがわたしとともに来[こ]ないなら、わたしは行[い]きません。主[しゅ]が、わたしとともにいる御使[みつかい]に、いつ成功[せいこう]をお与[あた]えになるか、わたしには分[わ]からないからです。」"
  9: "デボラは彼[かれ]に言[い]った。「行[い]くなら、わたしはあなたとともに行[い]きます。ただ、あなたが行[い]く道[みち]では、あなたが先[さき]に立[た]つことはない、と知[し]っておきなさい。主[しゅ]はシセラを女[おんな]の手[て]に渡[わた]されるからです。」デボラは立[た]ち上[あ]がり、バラクとともにケデシュへ行[い]った。"
  10: "バラクはゼブルンとナフタリをケデシュへ呼[よ]び集[あつ]めた。一万人[いちまんにん]の者[もの]たちが彼[かれ]の足[あし]もとについて上[のぼ]り、デボラも彼[かれ]とともに上[のぼ]った。"
  11: "ケニ人[じん]に近[ちか]い者[もの]たちは、モーセの親族[しんぞく]であるホバブの子[こ]らから分[わ]かれ、彼[かれ]はケデシュのそばにある憩[いこ]いの樫[かし]の木[き]のところに天幕[てんまく]を張[は]った。"
  12: "シセラに、アビノアムの子[こ]バラクがタボル山[やま]に上[のぼ]ったことが告[つ]げられた。"
  13: "シセラは、自分[じぶん]のすべての戦車[せんしゃ]、すなわち九百[きゅうひゃく]の鉄[てつ]の戦車[せんしゃ]と、自分[じぶん]とともにいるすべての民[たみ]を、諸国民[しょこくみん]のアリソトからキション川[がわ]へ集[あつ]めた。"
  14: "デボラはバラクに言[い]った。「立[た]ち上[あ]がりなさい。主[しゅ]がシセラをあなたの手[て]に渡[わた]された日[ひ]が、今日[きょう]なのです。見[み]よ、主[しゅ]はあなたの前[まえ]を進[すす]まれるではありませんか。」バラクはタボル山[やま]から下[くだ]り、一万人[いちまんにん]の者[もの]たちが彼[かれ]の後[あと]に従[したが]った。"
  15: "主[しゅ]はバラクの前[まえ]で、シセラとそのすべての戦車[せんしゃ]、そのすべての陣営[じんえい]を混乱[こんらん]させ、剣[つるぎ]の刃[は]にかけて打[う]ち倒[たお]された。シセラは戦車[せんしゃ]から降[お]りて、足[あし]で逃[に]げた。"
  16: "バラクは戦車[せんしゃ]と陣営[じんえい]の後[あと]を、諸国民[しょこくみん]の森[もり]まで追[お]った。シセラの陣営[じんえい]はすべて剣[つるぎ]の刃[は]にかけて倒[たお]れ、ひとりも残[のこ]らなかった。"
  17: "シセラは足[あし]で、ケニ人[じん]ヘベルの妻[つま]ヤエルの天幕[てんまく]へ逃[に]げ込[こ]んだ。アソルの王[おう]ヤビンとケニ人[じん]ヘベルの家[いえ]との間[あいだ]には平和[へいわ]があったからである。"
  18: "ヤエルはシセラを迎[むか]えに出[で]て言[い]った。「ご主人[しゅじん]さま、こちらへお入[はい]りください。わたしのところへお入りください。怖[こわ]がらないでください。」彼[かれ]は彼女[かのじょ]のところの天幕[てんまく]へ入[はい]った。彼女[かのじょ]は毛布[もうふ]で彼[かれ]を覆[おお]った。"
  19: "シセラは彼女[かのじょ]に言[い]った。「わたしに少[すこ]し水[みず]を飲[の]ませてくれ。渇[かわ]いたのだ。」彼女[かのじょ]は乳[ちち]の皮袋[かわぶくろ]を開[あ]けて彼[かれ]に飲[の]ませ、彼[かれ]の顔[かお]を覆[おお]った。"
  20: "彼[かれ]は彼女[かのじょ]に言[い]った。「天幕[てんまく]の戸口[とぐち]に立[た]っていなさい。だれかがあなたのところへ来[き]て、『ここに男[おとこ]はいるか』と尋[たず]ねたら、『いない』と言[い]いなさい。」彼女[かのじょ]は毛布[もうふ]で彼[かれ]を覆[おお]った。"
  21: "ヘベルの妻[つま]ヤエルは天幕[てんまく]の杭[くい]を取り、手[て]に槌[つち]を持[も]って、彼[かれ]のそばへ静[しず]かに近[ちか]づき、その杭[くい]を彼[かれ]のこめかみに打[う]ち込[こ]んで地[ち]に突[つ]き抜[ぬ]いた。彼[かれ]は彼女[かのじょ]の両膝[りょうひざ]の間[あいだ]で身[み]もだえし、息[いき]を引[ひ]き取[と]って死[し]んだ。"
  22: "見[み]よ、バラクがシセラを追[お]って来[き]た。ヤエルは彼[かれ]を迎[むか]えに出[で]て言[い]った。「こちらへ来[き]てください。あなたが探[さが]している男[おとこ]をお見[み]せします。」彼[かれ]が彼女[かのじょ]のところへ入[はい]ると、シセラは倒[たお]れて死[し]んでおり、杭[くい]は彼[かれ]のこめかみにあった。"
  23: "その日[ひ]、主[しゅ]なる神[かみ]はカナンの王[おう]ヤビンをイスラエルの子[こ]らの前[まえ]に低[ひく]くされた。"
  24: "イスラエルの子[こ]らの手[て]は、カナンの王[おう]ヤビンに対[たい]してますます強[つよ]くなり、ついに彼[かれ]を滅[ほろ]ぼし尽[つ]くした。"

notes:
  1: "προσέθεντο... ποιῆσαι — «снова стали делать». Слав. добавляет «и аод умре» (в греч. нет); ru — «Когда умер Аод»."
  2: "ἀπέδοτο — «продал». Ιαβιν βασιλέως Χανααν — «Иавина, царя Ханаанского». Ασωρ — Асор. ἄρχων τῆς δυνάμεως — «начальник силы (войска)». Αρισωθ τῶν ἐθνῶν — Арисоф народов (Харошеф-Гоим, ru «Харошеф-Гоиме»)."
  3: "ἐννακόσια ἅρματα σιδηρᾶ — «девятьсот железных колесниц». κατὰ κράτος — «всей силой, жестоко». εἴκοσι ἔτη — «двадцать лет»."
  4: "γυνὴ προφῆτις — «женщина-пророчица», 女預言者. Λαφιδωθ — Лапидоф. αὐτὴ ἔκρινεν — «она судила»."
  5: "φοῖνιξ Δεββωρα — «пальма Деборы». ἀνὰ μέσον — «между». ἐκρίνεσθαι — «судиться» (пассив), 裁きを受ける."
  6: "Οὐχὶ σοὶ ἐνετείλατο — «не тебе ли повелел». ἀπελεύσῃ — «пойдёшь». λήμψῃ — «возьмёшь». Κεδες Νεφθαλι — Кедес Неффалимов."
  7: "ἀπάξω — «приведу, увлеку» (ἀπάγω). χειμάρρους Κισων — «поток Киссон». πλῆθος — «множество». παραδώσω ἐν τῇ χειρί σου — «предам в руку твою»."
  8: "Ἐὰν πορευθῇς — «если пойдёшь». οὐκ οἶδα τὴν ἡμέραν — «не знаю дня». εὐοδοῖ κύριος τὸν ἄγγελον μετ' ἐμοῦ — «Господь даёт успех ангелу (посланнику) со мною»; тёмное место, слав. «благоустроит Господь ангела со мною», в ru этой оговорки нет."
  9: "Πορευομένη πορεύσομαι — усилительное «идя пойду», т. е. непременно пойду. προτέρημα — «первенство, преимущество» (слав. «слава»). ἐν χειρὶ γυναικὸς — «в руку женщины»."
  10: "παρήγγειλεν — «приказал, созвал» (παραγγέλλω). κατὰ πόδας αὐτοῦ — «по следам его»."
  11: "οἱ πλησίον τοῦ Κιναίου — «близкие Кенея» (слав. называет Хавера). γαμβρός — «зять, свойственник» (слав. «ужик»); ср. πενθερός в 1:16. δρῦς ἀναπαυομένων — «дуб отдыхающих» (слав. «дуб почивающих»)."
  12: "ἀνήγγειλαν — «донесли, возвестили»."
  13: "В квадратных скобках критического издания стоит пояснение «ибо девятьсот железных колесниц было у него», в базе оно есть, поэтому 〔…〕 не ставится. παρεμβολή — «стан, ополчение»."
  14: "Ἀνάστηθι — «встань». οὐκ ἰδοὺ κύριος ἐλεύσεται ἔμπροσθέν σου — «не вот ли Господь пойдёт пред тобою». κατέβη — «сошёл»."
  15: "ἐξέστησεν — «привёл в смятение, изумил» (ἐξίστημι); слав. «сотре». ἐν στόματι ῥομφαίας — «устами меча», т. е. под меч. ἔφυγεν τοῖς ποσὶν αὐτοῦ — «побежал ногами своими»."
  16: "διώκων — «преследуя». ἕως δρυμοῦ τῶν ἐθνῶν — «до рощи народов». οὐ κατελείφθη ἕως ἑνός — «не осталось ни одного»."
  17: "ἀνεχώρησεν — «ушёл, удалился». ὅτι εἰρήνη ἦν — «ибо мир был»."
  18: "Ἔκνευσον — «зайди, сверни» (ἐκνεύω). κύριέ μου — «господин мой». δέρρις — «покрывало, ковёр» (слав. «одежда»), 毛布."
  19: "Πότισόν με... μικρὸν ὕδωρ — «напои меня немного водою». ἀσκός — «мех». ἐπότισεν — «напоила»."
  20: "Στῆθι ἐν τῇ θύρᾳ — «стань у двери». В конце стиха в греч. повторено «и покрыла его покрывалом своим» (слав. этого повтора нет)."
  21: "πάσσαλος — «кол». σφῦρα — «молот». ἐνέκρουσεν — «вбила». γνάθος — «челюсть»; слав. «скрания» (висок), отсюда こめかみ. διήλασεν ἐν τῇ γῇ — «пронзила до земли». ἀπεσκάρισεν — «задёргался, бился в судорогах»; ru «спал от усталости» (МТ). ἐξέψυξεν — «испустил дух»."
  22: "εἰς ἀπαντὴν αὐτοῦ — «навстречу ему». Δεῦρο — «иди сюда». ὁ πάσσαλος ἐν τῇ γνάθῳ αὐτοῦ — «кол в челюсти его»."
  23: "ἐταπείνωσεν — «смирил, унизил»."
  24: "ἐπορεύθη... πορευομένη καὶ σκληρυνομένη — «шла, идя и ожесточаясь», т. е. усиливалась всё больше (гебраизм). ἕως ἐξωλέθρευσαν αὐτόν — «доколе не истребили его»."
