# (10–11), донесение Сисаре (12), колесницы у Киссона (13), победа (14–16),
# Иаиль и смерть Сисары (17–22), смирение Иавина (23–24).
# Речь Деворы — 「…」: 6–7, 9, 14; слово Господа в её речи — 『…』: 6–7.
# Речь Варака — 「…」: 8; речь Иаили — 「…」: 18, 22; речь Сисары — 「…」: 19, 20;
# слова, которые он велел передать, — 『…』: 20.
