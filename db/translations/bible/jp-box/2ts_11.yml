draft: true

verses:
  1: "年[とし]が巡[めぐ]って、王[おう]たちが戦[いくさ]に出[で]るころになると、ダビデはヨアブと、彼[かれ]とともにいる家来[けらい]たち、およびイスラエルのすべてを遣[つか]わした。彼らはアンモン人[じん]を荒[あ]らし、ラバを包囲[ほうい]した。ダビデはエルサレムに座[すわ]っていた。"
  2: "夕方[ゆうがた]になって、ダビデは寝床[ねどこ]から起[お]き、王[おう]の家[いえ]の屋上[おくじょう]を歩[あ]いていた。屋上から、水[みず]を浴[あ]びている女[おんな]を見[み]た。その女は非常[ひじょう]に美[うつく]しかった。"
  3: "ダビデは人[ひと]を遣[つか]わして、その女[おんな]のことを尋[たず]ねさせ、言[い]った。「これはエリアブの娘[むすめ]バテシバ、ヘテ人[じん]ウリヤの妻[つま]ではないか。」"
  4: "ダビデは使者[ししゃ]たちを遣[つか]わして彼女[かのじょ]を連[つ]れて来[こ]させた。彼女は彼[かれ]のところへ入[はい]り、彼は彼女と寝[ね]た。彼女は自分[じぶん]の汚[けが]れから身[み]を清[きよ]めていた。そして彼女は自分の家[いえ]へ帰[かえ]った。"
  5: "女[おんな]は身[み]ごもった。彼女[かのじょ]は人[ひと]を遣[つか]わしてダビデに告[つ]げ、言[い]った。「わたしは身ごもっています。」"
  6: "ダビデはヨアブに人[ひと]を遣[つか]わして言[い]った。「ヘテ人[じん]ウリヤをわたしのところへ送[おく]れ。」ヨアブはウリヤをダビデのもとへ送った。"
  7: "ウリヤが来[き]て彼[かれ]のところへ入[はい]ると、ダビデはヨアブの安否[あんぴ]、民[たみ]の安否、戦[いくさ]の様子[ようす]を尋[たず]ねた。"
  8: "ダビデはウリヤに言[い]った。「家[いえ]に下[くだ]って、足[あし]を洗[あら]いなさい。」ウリヤが王[おう]の家から出[で]ると、王のごちそうが彼[かれ]の後[あと]から運[はこ]ばれた。"
  9: "しかしウリヤは、王[おう]の家[いえ]の戸口[とぐち]で、自分[じぶん]の主[あるじ]のしもべたちとともに寝[ね]て、自分の家へ下[くだ]らなかった。"
  10: "人々[ひとびと]がダビデに告[つ]げて言[い]った。「ウリヤは自分[じぶん]の家[いえ]へ下[くだ]りませんでした。」ダビデはウリヤに言った。「あなたは旅[たび]から帰[かえ]って来[き]たのではないか。なぜ家へ下らなかったのか。」"
  11: "ウリヤはダビデに言[い]った。「神[かみ]の箱[はこ]と、イスラエルとユダは天幕[てんまく]に住[す]んでいます。わたしの主[あるじ]ヨアブと、わたしの主のしもべたちは野[の]に陣[じん]を敷[し]いています。それなのに、わたしが自分[じぶん]の家[いえ]へ入[はい]って食[た]べ、飲[の]み、妻[つま]と寝[ね]ることができるでしょうか。あなたの魂[たましい]が生[い]きているように、わたしはこのようなことはしません。」"
  12: "ダビデはウリヤに言[い]った。「今日[きょう]もここに座[すわ]っていなさい。明日[あす]、わたしはあなたを帰[かえ]す。」ウリヤはその日[ひ]とその翌日[よくじつ]、エルサレムにとどまった。"
  13: "ダビデは彼[かれ]を呼[よ]んだ。ウリヤは彼の前[まえ]で食[た]べ、飲[の]み、ダビデは彼を酔[よ]わせた。しかし夕方[ゆうがた]になると、彼は自分[じぶん]の寝床[ねどこ]で、自分の主[あるじ]のしもべたちとともに寝[ね]て、自分の家[いえ]へは下[くだ]らなかった。"
  14: "朝[あさ]になると、ダビデはヨアブに手紙[てがみ]を書[か]き、ウリヤの手[て]によって送[おく]った。"
  15: "手紙[てがみ]にはこう書[か]いた。「ウリヤを、戦[いくさ]の激[はげ]しい最前線[さいぜんせん]に送[おく]り込[こ]め。そして、あなたがたは彼[かれ]の後[うし]ろから引[ひ]き返[かえ]せ。彼が打[う]たれて死[し]ぬように。」"
  16: "ヨアブは町[まち]を監視[かんし]する間[あいだ]、ウリヤを、自分[じぶん]が勇士[ゆうし]たちのいるのを知[し]っている場所[ばしょ]に置[お]いた。"
  17: "町[まち]の人々[ひとびと]は出[で]て来[き]てヨアブと戦[たたか]った。ダビデのしもべたちのうち、民[たみ]の幾人[いくにん]かが倒[たお]れ、ヘテ人[じん]ウリヤもまた死[し]んだ。"
  18: "ヨアブは人[ひと]を遣[つか]わして、戦[いくさ]の次第[しだい]をすべて王[おう]に告[つ]げさせた。"
  19: "彼[かれ]は使者[ししゃ]に命[めい]じて言[い]った。「王[おう]に戦[いくさ]の次第[しだい]をすべて語[かた]り終[お]えたなら、"
  20: "もし王[おう]が怒[いか]りを発[はっ]してあなたに言[い]ったら、『なぜあなたがたは町[まち]に近[ちか]づいて戦[たたか]おうとしたのか。城壁[じょうへき]の上[うえ]から矢[や]が射[い]られることを知[し]らなかったのか。"
  21: "イエロバアルの子[こ]アビメレクを打[う]ったのはだれか。女[おんな]が城壁[じょうへき]の上[うえ]から石臼[いしうす]の欠[かけ]を彼[かれ]に投[な]げつけ、彼はタマシで死[し]んだのではなかったか。なぜあなたがたは城壁に近づいたのか』と言[い]いなさい。そして、『あなたのしもべ、ヘテ人[じん]ウリヤもまた死にました』と言いなさい。」"
  22: "使者[ししゃ]はエルサレムの王[おう]のもとへ行[い]き、ヨアブが彼[かれ]に告[つ]げたとおりのことを、すなわち戦[いくさ]の次第[しだい]をすべてダビデに告げた。するとダビデはヨアブに怒[いか]り、使者に言[い]った。「なぜあなたがたは町[まち]に近[ちか]づいて戦[たたか]おうとしたのか。城壁[じょうへき]の上[うえ]から打[う]たれることを知[し]らなかったのか。イエロバアルの子[こ]アビメレクを打ったのはだれか。女[おんな]が城壁の上から石臼[いしうす]の欠[かけ]を彼に投[な]げつけて、彼はタマシで死[し]んだのではなかったか。なぜあなたがたは城壁に近づいたのか。」"
  23: "使者[ししゃ]はダビデに言[い]った。「あの人[ひと]たちはわたしたちに対[たい]して強[つよ]く立[た]ち、野[の]へ出[で]て来[き]ました。そこでわたしたちは彼[かれ]らを門[もん]の入口[いりぐち]まで追[お]い返[かえ]しました。"
  24: "すると、矢[や]を射[い]る者[もの]たちが城壁[じょうへき]の上[うえ]からあなたのしもべたちに射かけ、王[おう]のしもべたちのうち幾人[いくにん]かが死[し]にました。あなたのしもべ、ヘテ人[じん]ウリヤもまた死にました。」"
  25: "ダビデは使者[ししゃ]に言[い]った。「ヨアブにこう言いなさい。『このことで心[こころ]を痛[いた]めるな。剣[つるぎ]はあるときはこう、あるときはああと人[ひと]を食[く]らうものだ。町[まち]への戦[いくさ]を強[つよ]めて、それを攻[せ]め落[お]とし、彼[かれ]を力[ちから]づけなさい。』」"
  26: "ウリヤの妻[つま]は、自分[じぶん]の夫[おっと]ウリヤが死[し]んだことを聞[き]いて、夫のために泣[な]いた。"
  27: "喪[も]が明[あ]けると、ダビデは人[ひと]を遣[つか]わして彼女[かのじょ]を自分[じぶん]の家[いえ]に迎[むか]え入[い]れ、彼女は彼の妻[つま]となって男[おとこ]の子[こ]を産[う]んだ。しかし、ダビデがしたこのことは、主[しゅ]の目[め]に悪[わる]いこととして映[うつ]った。"

notes:
  1: "ἐπιστρέψαντος τοῦ ἐνιαυτοῦ — «по возвращении года», т. е. через год, весной. ἐν τῷ καιρῷ τῆς ἐξοδίας τῶν βασιλέων — во время исхода царей (на войну). διέφθειραν — разоряли, губили (διαφθείρω). διεκάθισαν ἐπὶ Ραββαθ — обсели Равву (ラバ). ἐκάθισεν ἐν Ιερουσαλημ — оставался в Иерусалиме (κάθημαι — сидеть)."
  2: "πρὸς ἑσπέραν — к вечеру. ἀνέστη ἀπὸ τῆς κοίτης — встал с ложа. περιεπάτει ἐπὶ τοῦ δώματος — ходил по кровле (δῶμα — 屋上). γυναῖκα λουομένην — женщину моющуюся (λούω). καλὴ τῷ εἴδει σφόδρα — весьма красива видом."
  3: "ἐζήτησεν τὴν γυναῖκα — разыскал (расспросил о) женщину. Βηρσαβεε θυγάτηρ Ελιαβ — Вирсавия, дочь Елиава (バテシバ). Ουριου τοῦ Χετταίου — Урии Хеттеянина (ヘテ人). В LXX и csl «и сказал» (ед. ч.) — говорит Давид; в ru «сказали ему» (по МТ)."
  4: "ἀπέστειλεν ἀγγέλους — послал вестников. ἔλαβεν αὐτήν — взял её. εἰσῆλθεν πρὸς αὐτόν — вошла к нему. ἐκοιμήθη μετ᾿ αὐτῆς — спал с нею. ἁγιαζομένη ἀπὸ ἀκαθαρσίας αὐτῆς — очищающаяся от нечистоты своей (о месячном очищении; не сглаживаем). ἀπέστρεψεν εἰς τὸν οἶκον αὐτῆς — возвратилась в дом свой."
  5: "ἐν γαστρὶ ἔλαβεν — зачала во чреве. ἀποστείλασα ἀπήγγειλεν — послав, возвестила. Ἐγώ εἰμι ἐν γαστρὶ ἔχω — «я есмь во чреве имущая», буквально и без смягчения."
  6: "Ἀπόστειλον πρός με τὸν Ουριαν — пришли ко мне Урию."
  7: "ἐπηρώτησεν … εἰς εἰρήνην — спросил о мире (благополучии); εἰρήνη здесь — «мир, благополучие». εἰς εἰρήνην τοῦ πολέμου — о положении войны."
  8: "Κατάβηθι — сойди. νίψαι τοὺς πόδας σου — омой ноги твои (намёк: пойди к жене). ἄρσις τοῦ βασιλέως — «подъятие (ноша) царя», т. е. царское угощение, дары (слав. «снедь царева»)."
  9: "παρὰ τῇ θύρᾳ τοῦ βασιλέως — у двери царского дома. μετὰ τῶν δούλων τοῦ κυρίου αὐτοῦ — с рабами господина своего. οὐ κατέβη — не сошёл."
  10: "Οὐχὶ ἐξ ὁδοῦ σὺ ἔρχῃ — «не с дороги ли ты идёшь». τί ὅτι — почему же."
  11: "Ἡ κιβωτὸς καὶ Ισραηλ — «ковчег и Израиль»; в csl «кивот Божий» — добавление «Божий» внесено в текст (нет в LXX). ἐν σκηναῖς — в шатрах (天幕). ἐπὶ πρόσωπον τοῦ ἀγροῦ παρεμβάλλουσιν — «стоят станом на лице поля», т. е. в открытом поле (передано «野に陣を敷く»). πῶς; — «как?», выражение решительного отказа. ζῇ ἡ ψυχή σου, εἰ ποιήσω — «жива душа твоя, если сделаю» — клятва."
  12: "Κάθισον ἐνταῦθα καί γε σήμερον — посиди здесь и сегодня. ἐξαποστελῶ σε — отошлю тебя. ἐκάθισεν — остался (κάθημαι)."
  13: "ἐκάλεσεν — позвал. ἐμέθυσεν αὐτόν — напоил его допьяна (μεθύω). ἐξῆλθεν ἑσπέρας — вышел вечером."
  14: "βιβλίον — письмо, грамота (не «книга»). ἐν χειρὶ Ουριου — рукою Урии."
  15: "Εἰσάγαγε — введи. ἐξ ἐναντίας τοῦ πολέμου τοῦ κραταιοῦ — против крепкой (сильной) брани. ἀποστραφήσεσθε ἀπὸ ὄπισθεν αὐτοῦ — отступите сзади него. πληγήσεται — будет поражён."
  16: "ἐν τῷ φυλάσσειν — при охране (осаде). ἔθηκεν — поставил. ἄνδρες δυνάμεως — мужи силы, храбрые (勇士)."
  17: "ἐξῆλθον οἱ ἄνδρες τῆς πόλεως — вышли мужи города. ἔπεσαν ἐκ τοῦ λαοῦ — пали из народа. καί γε — «и также»."
  18: "πάντας τοὺς λόγους τοῦ πολέμου — все слова (обстоятельства) войны. В csl добавлено «глаголати к царю» — в LXX нет, повтор/порча, в текст не внесено."
  19: "ἐνετείλατο — приказал (ἐντέλλομαι). ἐν τῷ συντελέσαι σε — когда завершишь. λαλῆσαι πρὸς τὸν βασιλέα — говорить царю."
  20: "ἀναβῇ ὁ θυμός — поднимется гнев. ἠγγίσατε — приблизились. τοξεύσουσιν ἀπάνωθεν τοῦ τείχους — будут стрелять сверху стены (τοξεύω; τεῖχος — 城壁)."
  21: "Αβιμελεχ υἱὸν Ιεροβααλ — Авимелех, сын Иероваала (ср. Суд 9:50–54). В csl добавлено «сына нирова» — в LXX нет, в текст не внесено. κλάσμα μύλου — обломок жернова (石臼の欠け). ἐν Θαμασι — в Фамасе (タマシ; в ru «в Тевеце» — по МТ). ἵνα τί — почему. καὶ ἐρεῖς — и скажешь (ответ посланного)."
  22: "ἀπήγγειλεν τῷ Δαυιδ πάντα ὅσα ἀπήγγειλεν αὐτῷ Ιωαβ — возвестил Давиду всё, что возвестил ему Иоав. ἐθυμώθη Δαυιδ πρὸς Ιωαβ — разгневался Давид на Иоава. Далее LXX повторяет речь из ст. 20–21 уже как ответ Давида посланному (в МТ этого повтора нет) — переводим как есть."
  23: "ἐκραταίωσαν ἐφ᾿ ἡμᾶς οἱ ἄνδρες — укрепились на нас мужи, т. е. одолевали. ἐξῆλθαν … εἰς τὸν ἀγρόν — вышли в поле. ἐγενήθημεν ἐπ᾿ αὐτοὺς ἕως τῆς θύρας τῆς πύλης — мы стали на них (погнали) до двери ворот."
  24: "οἱ τοξεύοντες — стреляющие (лучники). ἀπάνωθεν τοῦ τείχους — сверху стены. καί γε — также."
  25: "Μὴ πονηρὸν ἔστω ἐν ὀφθαλμοῖς σου — пусть не будет худым в очах твоих. ποτὲ μὲν οὕτως καὶ ποτὲ οὕτως φάγεται ἡ μάχαιρα — «иногда так, иногда этак поедает меч» (поговорка). κραταίωσον τὸν πόλεμον — усиль войну. κατάσπασον αὐτήν — разрушь (низвергни) его. κραταίωσον αὐτόν — укрепи (ободри) его, т. е. Иоава."
  26: "ἐκόψατο τὸν ἄνδρα αὐτῆς — оплакала мужа своего (κόπτομαι — бить себя в плач)."
  27: "διῆλθεν τὸ πένθος — прошёл плач, траур (πένθος). συνήγαγεν αὐτὴν εἰς τὸν οἶκον αὐτοῦ — собрал (принял) её в дом свой, т. е. взял к себе. ἐγενήθη αὐτῷ εἰς γυναῖκα — стала ему женой. πονηρὸν ἐφάνη τὸ ῥῆμα … ἐν ὀφθαλμοῖς κυρίου — злым явилось это дело в очах Господа."
