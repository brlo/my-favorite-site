# jp-box, 2-я Царств, глава 11. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в книге нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 11: поход на Равву и Давид в Иерусалиме (1), Вирсавия (2–5), Урия и письмо
# (6–15), смерть Урии (16–17), донесение Иоава (18–25), плач и брак (26–27).
# Переводить точно, без эвфемизмов и без грубости: ἐκοιμήθη — 寝る (то же слово, что
# в 2 Цар 12:24), ἁγιαζομένη ἀπὸ ἀκαθαρσίας — 汚れから身を清める.
# Речи — 「…」: Давид (3, 6, 8, 10, 12, 15, 25), Урия (11), посланный (23–24);
# наказ Иоава посланному (19–21) и слова Давида к Иоаву (25) — внутри 『…』. Красного нет.
# Паритет: csl-чтения в основном тексте без 〔…〕. В пользу csl взято 11:11 «кивот Божий»
# (в LXX только «ковчег»). Порча/повтор csl (11:18 «глаголати к царю», 11:21 «сына нирова»)
# в текст не внесена — см. notes.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 契約の箱, ヘテ人, 天幕, 城壁 уже в корпусе.
# jp-ni не использовался.

