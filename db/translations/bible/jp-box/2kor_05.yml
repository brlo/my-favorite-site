# jp-box, Второе послание к Коринфянам, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# Глава 5: дом и хижина, «мы имеем» (1–5), хождение верой и судилище Христово (6–10),
# страх Господень и служение примирения (11–21).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: весь текст стихов в gr-lxx-byz на месте. 5:14 — база, Синодальный
# и jp-joc читают τοῦ Χριστοῦ (слав. «любы Божия» не принято); 5:18 — в базе διὰ Χριστοῦ,
# церковный текст полнее (Иисусом Христом), оставлено по базе (ср. 1 Кор 16:24), см. notes.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 5
draft: true

verses:
  1: "なぜなら、わたしたちは、地上[ちじょう]の家[いえ]である幕屋[まくや]が壊[こわ]されても、神[かみ]から与[あた]えられる建物[たてもの]、すなわち、手[て]で造[つく]られていない、天[てん]にある永遠[えいえん]の家[いえ]を持[も]っていることを知[し]っているからである。"
  2: "なぜなら、わたしたちはこの幕屋[まくや]のうちにあって嘆息[たんそく]し、天[てん]から来[く]るわたしたちの住[す]まいを着[き]たいと切[せつ]に願[ねが]っているからである。"
  3: "もっとも、着[き]ている者[もの]として、裸[はだか]で見[み]いだされることがないのであれば。"
  4: "なぜなら、わたしたちはこの幕屋[まくや]のうちに住[す]む者[もの]として、重[おも]荷[に]を負[お]って嘆息[たんそく]しているからである。それは、脱[ぬ]ぎ去[さ]りたいからではなく、上[うわ]に着[き]たいからであり、死[し]すべきものが命[いのち]に飲[の]み込[こ]まれるためである。"
  5: "わたしたちをこの同[おな]じことのために整[ととの]えてくださった方[かた]は神[かみ]であり、その方[かた]はわたしたちに霊[れい]の保証[ほしょう]をお与[あた]えになった。"
  6: "それゆえ、わたしたちはいつも勇気[ゆうき]をもち、体[からだ]のうちに住[す]んでいる間[あいだ]は、主[しゅ]から離[はな]れていることを知[し]っている。"
  7: "なぜなら、わたしたちは信仰[しんこう]によって歩[あゆ]んでおり、見[み]るものによってではないからである。"
  8: "そして、わたしたちは勇気[ゆうき]をもち、むしろ体[からだ]を離[はな]れて主[しゅ]のもとに住[す]むことを望[のぞ]んでいる。"
  9: "それゆえ、わたしたちは、体[からだ]のうちに住[す]んでいても、離[はな]れていても、主[しゅ]に喜[よろこ]ばれる者[もの]であろうと努[つと]めている。"
  10: "なぜなら、わたしたちは皆[みな]、キリストの裁[さば]きの座[ざ]の前[まえ]に立[た]たなければならないからである。それは、一人[ひとり]一人[ひとり]が、体[からだ]を通[とお]して行[おこな]ったことに応[おう]じて、善[よ]いことであれ悪[わる]いことであれ、報[むく]いを受[う]けるためである。"
  11: "それゆえ、わたしたちは主[しゅ]への恐[おそ]れを知[し]っているので、人々[ひとびと]を説[と]き勧[すす]める。わたしたちは神[かみ]に明[あき]らかにされており、あなたがたの良心[りょうしん]にも明らかにされていると、わたしは願[ねが]っている。"
  12: "わたしたちは再[ふたた]び自分[じぶん]をあなたがたに勧[すす]めているのではない。むしろ、わたしたちについてあなたがたが誇[ほこ]る機会[きかい]を与[あた]えているのであり、それは、あなたがたが、顔[かお]によって誇り、心[こころ]によって誇らない者[もの]たちに答[こた]えるためである。"
  13: "なぜなら、わたしたちが我[われ]を失[うしな]っているのなら、それは神[かみ]のためであり、正気[しょうき]を保[たも]っているのなら、それはあなたがたのためであるからである。"
  14: "なぜなら、キリストの愛[あい]がわたしたちを捕[と]らえて離[はな]さないからである。わたしたちは、一人[ひとり]がすべての者[もの]のために死[し]んだのだから、それゆえ、すべての者[もの]は死[し]んだのだ、と判断[はんだん]している。"
  15: "そして、キリストはすべての者[もの]のために死[し]んだ。それは、生[い]きる者[もの]たちがもはや自分[じぶん]のために生[い]きるのではなく、彼[かれ]らのために死[し]んで復活[ふっかつ]された方[かた]のために生[い]きるためである。"
  16: "だから、わたしたちは今[いま]から後[のち]、だれをも肉[にく]に従[したが]って知[し]らない。たとえかつて肉に従ってキリストを知[し]ったとしても、今[いま]はもうそのように知[し]らないのである。"
  17: "だから、もしだれかがキリストのうちにあれば、その人[ひと]は新[あたら]しい被造物[ひぞうぶつ]である。古[ふる]いものは過[す]ぎ去[さ]り、見[み]よ、新[あたら]しいものが生[しょう]じたのである。"
  18: "そして、すべてのことは神[かみ]から出[で]ている。神はキリストによってわたしたちをご自分[じぶん]と和解[わかい]させ、わたしたちに和解[わかい]の務[つと]めをお与[あた]えになった。"
  19: "すなわち、神はキリストのうちにあって世[よ]をご自分[じぶん]と和解[わかい]させ、彼[かれ]らにその罪[つみ]を負[お]わせることなく、和解[わかい]の言葉[ことば]をわたしたちに託[たく]されたのである。"
  20: "だから、わたしたちはキリストの使節[しせつ]として務[つと]めている。神[かみ]がわたしたちを通[とお]して勧[すす]めておられるかのようである。わたしたちはキリストに代[か]わって願[ねが]う。神[かみ]と和解[わかい]しなさい。"
  21: "神[かみ]は、罪[つみ]を知[し]らない方[かた]を、わたしたちのために罪[つみ]とされた。それは、わたしたちがこの方[かた]のうちにあって、神[かみ]の義[ぎ]となるためである。"

notes:
  1: "Οἴδαμεν γάρ — «знаем»; γάρ передан «なぜなら…からである». ἐπίγειος οἰκία τοῦ σκήνους — 地上の家である幕屋 (σκῆνος — шатёр, хижина; ср. 5:4). οἰκοδομή — 建物. ἀχειροποίητος — 手で造られていない."
  2: "ἐν τούτῳ — «в этом» (в шатре); この幕屋のうちにあって. οἰκητήριον — 住まい. ἐπενδύσασθαι — «надеть сверху»; 着たい."
  3: "εἴ γε καί — «если только и»; условная клауза сохранена. ἐνδυσάμενοι — «одевшись»; 着ている者として."
  4: "βαρούμενοι — «отягчённые»; 重荷を負って. ἐφ' ᾧ — «потому что»; それは…からであり. καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς — 死すべきものが命に飲み込まれる."
  5: "ὁ κατεργασάμενος — «уготовивший»; 整えてくださった. ἀρραβών — «залог»; 保証. τοῦ πνεύματος — «Духа» (без ἅγιον, поэтому 霊, не 聖霊; ср. 1 Кор 12:3 примеч.)."
  6: "θαρροῦντες — «дерзая»; 勇気をもち. ἐνδημοῦντες… ἐκδημοῦμεν — «находясь в теле, мы вне Господа»; 体のうちに住んでいる間は主から離れている."
  7: "διὰ πίστεως… οὐ διὰ εἴδους — «верою, а не видением»; 信仰によって歩み、見るものによってではない."
  8: "εὐδοκοῦμεν μᾶλλον — «благоволим лучше»; むしろ…望んでいる. ἐκδημῆσαι… ἐνδημῆσαι πρὸς τὸν κύριον — 体を離れて主のもとに住む."
  9: "φιλοτιμούμεθα — «ревнуем, поставляем себе в честь»; 努めている. εὐάρεστοι αὐτῷ — 主に喜ばれる者."
  10: "βῆμα τοῦ Χριστοῦ — «судилище Христово»; キリストの裁きの座. κομίσηται — «получил»; 報いを受ける. τὰ διὰ τοῦ σώματος — «соделанное в теле»; 体を通して行ったこと."
  11: "τὸν φόβον τοῦ κυρίου — 主への恐れ. πείθομεν — 説き勧める. πεφανερώμεθα — 明らかにされている. ἐλπίζω — 願っている."
  12: "ἀφορμὴ καυχήματος — 誇る機会. ἐν προσώπῳ… καὶ μὴ ἐν καρδίᾳ — «лицом, а не сердцем»; 顔によって誇り、心によって誇らない."
  13: "ἐξέστημεν — «вышли из себя»; 我を失っている. σωφρονοῦμεν — 正気を保っている."
  14: "συνέχει — «объемлет, сдерживает»; 捕らえて離さない. κρίναντας — 判断している. εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον — 一人がすべての者のために死んだのだから、すべての者は死んだ. Слав. читает «любы Божия», но база, Синодальный и jp-joc — τοῦ Χριστοῦ."
  15: "ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν — 生きる者たちがもはや自分のために生きるのではなく."
  16: "ὥστε — だから. κατὰ σάρκα — 肉に従って. εἰ καὶ ἐγνώκαμεν — «если и знали»; たとえ…知ったとしても."
  17: "καινὴ κτίσις — 新しい被造物. τὰ ἀρχαῖα παρῆλθεν — 古いものは過ぎ去り. γέγονεν καινά — 新しいものが生じた (Синодальный «все новое», в базе πάντα нет)."
  18: "τὰ δὲ πάντα ἐκ τοῦ θεοῦ — すべてのことは神から出ている. καταλλάξαντος — 和解させ. διακονία τῆς καταλλαγῆς — 和解の務め. В базе διὰ Χριστοῦ; слав., Синодальный и jp-joc читают διὰ Ἰησοῦ Χριστοῦ — оставлено по базе (ср. 1 Кор 16:24)."
  19: "ὡς ὅτι — すなわち. μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα — 彼らにその罪を負わせることなく. θέμενος ἐν ἡμῖν τὸν λόγον — 和解の言葉をわたしたちに託された."
  20: "πρεσβεύομεν — «исполняем посольство»; 使節として務めている. ὑπὲρ Χριστοῦ — キリストに代わって. καταλλάγητε τῷ θεῷ — 神と和解しなさい."
  21: "τὸν μὴ γνόντα ἁμαρτίαν — 罪を知らない方. ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν — わたしたちのために罪とされた. δικαιοσύνη θεοῦ — 神の義."
