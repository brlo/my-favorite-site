# jp-box, Псалтирь, псалом 84. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 84: возвращение из плена и прощение (1–3), молитва о восстановлении (4–7),
# «послушаю, что скажет Господь» (8), ответ Бога (9), милость и истина встречаются (10–13).
# Красного и синего нет: ответ Бога в псалме — не евангельская речь Христа.
# Кавычки: ответ Бога в 9 — 「…」 (первый уровень; по решению пользователя 84:9 —
# ответ Бога, поэтому передан прямой речью от первого лица; в греч. стоит третье лицо
# αὐτοῦ, см. notes).
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα, в конце ст. 2) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 真実, 義, 平和 уже в корпусе. jp-ni не использовался.

