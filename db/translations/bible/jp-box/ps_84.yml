verses:
  0: "指揮者[しきしゃ]に。コラの子[こ]らの詩[うた]。"
  1: "主[しゅ]よ、あなたはご自分[じぶん]の地[ち]を喜[よろこ]ばれ、ヤコブの捕[とら]われの身[み]を帰[かえ]された。"
  2: "あなたはご自分[じぶん]の民[たみ]の不法[ふほう]を赦[ゆる]し、彼[かれ]らのすべての罪[つみ]を覆[おお]われた。"
  3: "あなたはすべての怒[いか]りを鎮[しず]め、激[はげ]しい憤[いきどお]りから退[しりぞ]かれた。"
  4: "わたしたちの救[すく]いである神[かみ]よ、わたしたちを立[た]ち返[かえ]らせ、わたしたちからあなたの憤[いきどお]りを退[しりぞ]けてください。"
  5: "あなたはとこしえにわたしたちに怒[いか]り、代[よ]から代[よ]へと怒[いか]りを続[つづ]けられるのでしょうか。"
  6: "神[かみ]よ、あなたが立[た]ち返[かえ]らせてくだされば、わたしたちは生[い]き返[かえ]ります。あなたの民[たみ]はあなたによって喜[よろこ]びます。"
  7: "主[しゅ]よ、あなたのあわれみをわたしたちに示[しめ]し、あなたの救[すく]いをわたしたちに与[あた]えてください。"
  8: "わたしは、主[しゅ]である神[かみ]がわたしの内[うち]に何[なに]を語[かた]られるかを聞[き]こう。主[しゅ]はご自分[じぶん]の民[たみ]に、その聖[せい]なる者[もの]たちに、心[こころ]を主[しゅ]に返[かえ]す者[もの]たちに、平和[へいわ]を語[かた]られるからである。"
  9: "「まことに、わたしの救[すく]いは、わたしを恐[おそ]れる者[もの]に近[ちか]い。わたしの栄光[えいこう]があなたがたの地[ち]に住[す]むために。」"
  10: "あわれみと真[しん]実[じつ]は出会[であ]い、義[ぎ]と平和[へいわ]は口[くち]づけをした。"
  11: "真[しん]実[じつ]は地[ち]から芽[め]を出[だ]し、義[ぎ]は天[てん]からのぞき込[こ]んだ。"
  12: "主[しゅ]は善[よ]いものを与[あた]え、わたしたちの地[ち]はその実[み]を結[むす]ぶ。"
  13: "義[ぎ]はその前[まえ]を先[さき]だって歩[あゆ]み、その足[あし]を道[みち]に置[お]く。"

notes:
  0: "Εἰς τὸ τέλος· τοῖς υἱοῖς Κορε ψαλμός — 指揮者に。コラの子らの詩 (υἱοὶ Κορε — コラの子ら, как в Пс 83). Надписание — стих 0."
  1: "Εὐδόκησας, κύριε, τὴν γῆν σου — 主よ、あなたはご自分の地を喜ばれ (εὐδοκέω — «благоволить»). ἀπέστρεψας τὴν αἰχμαλωσίαν Ιακωβ — ヤコブの捕われの身を帰された (ἀποστρέφω — «возвращать»; αἰχμαλωσία — «плен»)."
  2: "ἀφῆκας τὰς ἀνομίας τῷ λαῷ σου — あなたはご自分の民の不法を赦し (ἀφίημι — «отпускать, прощать»; ἀνομία — 不法). ἐκάλυψας πάσας τὰς ἁμαρτίας αὐτῶν — 彼らのすべての罪を覆われた (καλύπτω — «покрывать», как в Пс 31:1). διάψαλμα в конце стиха не передаётся."
  3: "κατέπαυσας πᾶσαν τὴν ὀργήν σου — あなたはすべての怒りを鎮め (καταπαύω — «успокаивать»). ἀπέστρεψας ἀπὸ ὀργῆς θυμοῦ σου — 激しい憤りから退かれた (θυμός — «ярость»; повтор «гнев/ярость» сохранён)."
  4: "ἐπίστρεψον ἡμᾶς, ὁ θεὸς τῶν σωτηρίων ἡμῶν — わたしたちの救いである神よ、わたしたちを立ち返らせ (τὰ σωτήρια — «спасения»; множественное «спасений наших» передано 救い). ἀπόστρεψον τὸν θυμόν σου ἀφ᾽ ἡμῶν — わたしたちからあなたの憤りを退けてください."
  5: "μὴ εἰς τὸν αἰῶνα ὀργισθήσῃ ἡμῖν — あなたはとこしえにわたしたちに怒り. ἢ διατενεῖς τὴν ὀργήν σου ἀπὸ γενεᾶς εἰς γενεάν — 代から代へと怒りを続けられるのでしょうか (διατείνω — «простирать, продлевать»)."
  6: "ὁ θεός, σὺ ἐπιστρέψας ζωώσεις ἡμᾶς — 神よ、あなたが立ち返らせてくだされば、わたしたちは生き返ります (ζωόω — «оживлять»). ὁ λαός σου εὐφρανθήσεται ἐπὶ σοί — あなたの民はあなたによって喜びます (εὐφραίνομαι — «радоваться»)."
  7: "δεῖξον ἡμῖν, κύριε, τὸ ἔλεός σου — 主よ、あなたのあわれみをわたしたちに示し. τὸ σωτήριόν σου δῴης ἡμῖν — あなたの救いをわたしたちに与えてください (δῴης — оптатив «да даруешь»)."
  8: "ἀκούσομαι τί λαλήσει ἐν ἐμοὶ κύριος ὁ θεός — わたしは、主である神がわたしの内に何を語られるかを聞こう (ἀκούσομαι — «услышу», будущее; ἐν ἐμοί — «во мне»). ὅτι λαλήσει εἰρήνην ἐπὶ τὸν λαὸν αὐτοῦ — 主はご自分の民に平和を語られるからである (εἰρήνη — 平和). ἐπὶ τοὺς ἐπιστρέφοντας πρὸς αὐτὸν καρδίαν — 心を主に返す者たちに (ἐπιστρέφω — «обращать»)."
  9: "πλὴν ἐγγὺς τῶν φοβουμένων αὐτὸν τὸ σωτήριον αὐτοῦ — まことに、わたしの救いは、わたしを恐れる者に近い (ἐγγύς — «близко»; φοβούμενοι — «боящиеся»). τοῦ κατασκηνῶσαι δόξαν ἐν τῇ γῇ ἡμῶν — わたしの栄光があなたがたの地に住むために (κατασκηνόω — «обитать в шатре»). По решению пользователя это ответ Бога, поэтому — прямая речь 「」; в греч. и в ru-базе стоит третье лицо (αὐτοῦ, «Его»), у jp-joc тоже третье лицо; передано от первого лица, иначе ответ Бога по-японски не читается (ср. Пс 49:5, где так же снято третье лицо в речи Бога)."
  10: "ἔλεος καὶ ἀλήθεια συνήντησαν — あわれみと真実は出会い (συναντάω — «встречаться»). δικαιοσύνη καὶ εἰρήνη κατεφίλησαν — 義と平和は口づけをした (καταφιλέω — «лобзать»)."
  11: "ἀλήθεια ἐκ τῆς γῆς ἀνέτειλεν — 真実は地から芽を出し (ἀνατέλλω — «произрастать»). δικαιοσύνη ἐκ τοῦ οὐρανοῦ διέκυψεν — 義は天からのぞき込んだ (διακύπτω — «выглядывать»)."
  12: "καὶ γὰρ ὁ κύριος δώσει χρηστότητα — 主は善いものを与え (χρηστότης — «благость»). ἡ γῆ ἡμῶν δώσει τὸν καρπὸν αὐτῆς — わたしたちの地はその実を結ぶ (καρπός — 実)."
  13: "δικαιοσύνη ἐναντίον αὐτοῦ προπορεύσεται — 義はその前を先だって歩み (προπορεύομαι — «идти впереди»). θήσει εἰς ὁδὸν τὰ διαβήματα αὐτοῦ — その足を道に置く (διαβήματα — «шаги»; τίθημι — «ставить»)."
