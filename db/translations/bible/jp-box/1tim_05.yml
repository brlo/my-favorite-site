# jp-box, 1-е Послание к Тимофею, глава 5. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 5: обращение со старшими и младшими (1–2), вдовы (3–16),
# пресвитеры и их содержание (17–18), обвинение против пресвитера (19–21),
# последние наставления Тимофею (22–25).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 одно — 5:16 〔信じる男や〕: в базе только πιστή, церковный текст читает πιστὸς ἢ πιστή,
# мужской случай — добавление Церкви (проверено по базе: πιστός — 0, πιστή — 1).
# 5:1–2 πρεσβύτερος/πρεσβυτέρα — о возрасте, 年長者[ねんちょうしゃ]/年長[ねんちょう]の女[おんな];
# сан 長老[ちょうろう] — только 5:17, 5:19.
# 5:18–19 — цитаты Писания в 「…」, без красного.
# Сносок ⟨…⟩ в главе нет: 手[て]を置[お]くこと, やもめ, 長老, 奴隷 — слова, уже встречавшиеся в корпусе.
