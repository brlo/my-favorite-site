verses:
  1: "年長者[ねんちょうしゃ]を叱[しか]りつけてはならない。むしろ、父[ちち]に対[たい]するように勧[すす]めなさい。若[わか]い者[もの]たちには兄弟[きょうだい]に対[たい]するように。"
  2: "年長[ねんちょう]の女[おんな]たちには母[はは]に対[たい]するように、若[わか]い女[おんな]たちには姉妹[しまい]に対[たい]するように、すべての純潔[じゅんけつ]をもって接[せっ]しなさい。"
  3: "やもめたちを、すなわちまことのやもめを敬[うやま]いなさい。"
  4: "しかし、やもめに子[こ]や孫[まご]がいるなら、彼[かれ]らはまず自分[じぶん]の家[いえ]に敬虔[けいけん]を示[しめ]し、親[おや]たちに恩返[おんがえ]しすることを学[まな]びなさい。これこそ、神[かみ]の前[まえ]に受[う]け入[い]れられることだからである。"
  5: "まことのやもめで、ただひとりになった者[もの]は、神[かみ]に望[のぞ]みを置[お]き、夜[よる]も昼[ひる]も祈[いの]りと願[ねが]いに励[はげ]んでいる。"
  6: "しかし、快楽[かいらく]にふける者[もの]は、生[い]きていても死[し]んでいる。"
  7: "これらのことを命[めい]じなさい。彼[かれ]らが非難[ひなん]されるところのない者[もの]となるためである。"
  8: "しかし、自分[じぶん]の身内[みうち]、特[とく]に家族[かぞく]の世話[せわ]をしない者[もの]は、信仰[しんこう]を否[いな]んだことになり、信[しん]じない者[もの]よりも悪[わる]い。"
  9: "やもめを名簿[めいぼ]に載[の]せるのは、六十歳[ろくじゅっさい]より若[わか]くない者[もの]、すなわち、ひとりの夫[おっと]の妻[つま]であった者[もの]としなさい。"
  10: "その者[もの]は、良[よ]いわざによって証[あかし]され、子[こ]を育[そだ]て、旅人[たびびと]を宿[やど]し、聖徒[せいと]たちの足[あし]を洗[あら]い、苦[くる]しむ者[もの]たちを助[たす]け、すべての良[よ]いわざに従[したが]ってきた者[もの]である。"
  11: "しかし、若[わか]いやもめは断[ことわ]りなさい。彼女[かのじょ]たちは、キリストに背[そむ]き、心[こころ]を乱[みだ]すようになると、結婚[けっこん]したくなるからである。"
  12: "そうなれば、最初[さいしょ]の信仰[しんこう]を捨[す]てたという理由[りゆう]で、裁[さば]きを受[う]けることになる。"
  13: "また、彼女[かのじょ]たちは家[いえ]から家[いえ]へと巡[めぐ]り歩[ある]いて怠惰[たいだ]を学[まな]ぶ。怠惰[たいだ]なだけでなく、おしゃべりで、他人[たにん]の事[こと]に首[くび]を突[つ]っ込[こ]み、語[かた]るべきでないことを語[かた]るようになる。"
  14: "そこで、わたしは、若[わか]いやもめたちが結婚[けっこん]し、子[こ]を生[う]み、家[いえ]を治[おさ]め、敵[てき]に非難[ひなん]の口実[こうじつ]を何[なに]ひとつ与[あた]えないようにしてほしいと願[ねが]っている。"
  15: "すでに、ある者[もの]たちはサタンの後[うし]ろにそれて行[い]ったからである。"
  16: "もし〔信[しん]じる男[おとこ]や〕信[しん]じる女[おんな]に、やもめがいるなら、その人[ひと]は彼女[かのじょ]たちを助[たす]け、教会[きょうかい]に負担[ふたん]をかけないようにしなさい。そうしてこそ、まことのやもめたちを助[たす]けることができるのである。"
  17: "よく治[おさ]める長老[ちょうろう]たちは、二重[にじゅう]の敬[うやま]いを受[う]けるに値[あた]いする者[もの]として扱[あつか]いなさい。特[とく]に、言葉[ことば]と教[おし]えとに労[ろう]する者[もの]たちを。"
  18: "というのは、聖書[せいしょ]に言[い]われているからである。「穀物[こくもつ]を脱穀[だっこく]する牛[うし]に口[くち]をつけてはならない。」また、「働[はたら]く者[もの]はその報酬[ほうしゅう]を受[う]けるに値[あた]いする。」"
  19: "長老[ちょうろう]に対[たい]する訴[うった]えは、「二人[ふたり]、また三人[さんにん]の証人[しょうにん]による」のでなければ、受[う]け入[い]れてはならない。"
  20: "罪[つみ]を犯[おか]す者[もの]たちを皆[みな]の前[まえ]で戒[いまし]めなさい。ほかの者[もの]たちも恐[おそ]れを抱[いだ]くようになるためである。"
  21: "神[かみ]とキリスト・イエスと、選[えら]ばれた天使[てんし]たちの前[まえ]で、わたしはあなたに厳[おごそ]かに命[いいつ]ける。これらのことを、先入観[せんにゅうかん]なしに、偏[かたよ]りなく行[おこな]いなさい。"
  22: "だれにもすぐに手[て]を置[お]いてはならない。また、他人[たにん]の罪[つみ]に関[かか]わってはならない。自分[じぶん]を純潔[じゅんけつ]に保[たも]ちなさい。"
  23: "これからは水[みず]だけを飲[の]まず、胃[い]と、しばしばあなたを襲[おそ]う病[やまい]のために、少[すこ]しのぶどう酒[さけ]を用[もち]いなさい。"
  24: "ある人[ひと]たちの罪[つみ]は、前[まえ]もって明[あき]らかであり、裁[さば]きに先立[さきだ]つ。また、ある人[ひと]たちの罪[つみ]は、後[あと]からついてくる。"
  25: "同[おな]じように、良[よ]いわざも前[まえ]もって明[あき]らかであり、そうでないものも隠[かく]れることはできない。"

notes:
  1: "Πρεσβυτέρῳ μὴ ἐπιπλήξῃς — 年長者を叱りつけてはならない (ἐπιπλήσσω — «ударять, бранить»). πρεσβύτερος здесь о возрасте, в паре с νεωτέρους; сан — только ст. 17 и 19, поэтому 年長者[ねんちょうしゃ], а не 長老. παρακάλει — 勧めなさい (παρακαλέω — «просить, увещевать»). ὡς πατέρα — 父に対するように."
  2: "πρεσβυτέρας ὡς μητέρας — 年長の女たちには母に対するように. νεωτέρας ὡς ἀδελφάς — 若い女たちには姉妹に対するように. ἐν πάσῃ ἁγνείᾳ — すべての純潔をもって; ῾чистота᾽ относится к обращению с молодыми женщинами, не сглажено и не переставлено. Сказуемое греческого стиха то же, что в ст. 1 (παρακάλει); по-японски дан глагол 接しなさい."
  3: "Χήρας τίμα τὰς ὄντως χήρας — やもめたちを、すなわちまことのやもめを敬いなさい; ὄντως — «действительно»; повтор «вдовы… вдовы» сохранён, как у jp-joc「嫠を敬へ、即ち眞の嫠なる者を」. τίμα — не только «почитай», но и «содержи» (ср. ст. 17)."
  4: "εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει — やもめに子や孫がいるなら (ἔκγονος — «внук, потомок»). μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν — まず自分の家に敬虔を示すことを学びなさい. ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις — 親たちに恩返しする (ἀμοιβή — «воздаяние»; πρόγονοι — родители, предки). ἀπόδεκτον ἐνώπιον τοῦ θεοῦ — 神の前に受け入れられる."
  5: "ἡ δὲ ὄντως χήρα καὶ μεμονωμένη — まことのやもめで、ただひとりになった者 (μονόω — «оставаться одним»). ἤλπικεν ἐπὶ θεόν — 神に望みを置き. προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς — 祈りと願いに励んでいる; два слова сохранены (δέησις — «прошение», προσευχή — «молитва»). νυκτὸς καὶ ἡμέρας — 夜も昼も."
  6: "ἡ δὲ σπαταλῶσα — «живущая в роскоши, предающаяся наслаждениям»; 快楽にふける. ζῶσα τέθνηκεν — 生きていても死んでいる; парадокс сохранён без пояснения."
  7: "καὶ ταῦτα παράγγελλε — これらのことを命じなさい. ἵνα ἀνεπίλημπτοι ὦσιν — 非難されるところのない者となるため (ἀνεπίλημπτος — «неукоризненный», ср. 6:14)."
  8: "τῶν ἰδίων — 身内. οἰκείων — 家族 (усиление: «о своих, и особенно о домашних»). οὐ προνοεῖται — 世話をしない (προνοέω — «заботиться»). τὴν πίστιν ἤρνηται — 信仰を否んだ. ἀπίστου χείρων — 信じない者よりも悪い."
  9: "Χήρα καταλεγέσθω — やもめを名簿に載せる; καταλέγω — «вносить в список» (речь о списке вдов, которых содержала церковь). μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα — 六十歳より若くない. ἑνὸς ἀνδρὸς γυνή — ひとりの夫の妻 (о единственности брака, ср. 3:2,12)."
  10: "ἐν ἔργοις καλοῖς μαρτυρουμένη — 良いわざによって証され. Пять εἰ сохранены как перечисление дел: ἐτεκνοτρόφησεν — 子を育て, ἐξενοδόχησεν — 旅人を宿し, ἁγίων πόδας ἔνιψεν — 聖徒たちの足を洗い, θλιβομένοις ἐπήρκεσεν — 苦しむ者たちを助け, παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν — すべての良いわざに従った."
  11: "νεωτέρας δὲ χήρας παραιτοῦ — 若いやもめは断りなさい. καταστρηνιάσωσιν τοῦ Χριστοῦ — «почувствуют вожделение вопреки Христу» (καταστρηνιάω, ср. jp-joc「ハリストスに背きて心を亂す」); キリストに背き、心を乱す. γαμεῖν θέλουσιν — 結婚したくなる."
  12: "ἔχουσαι κρίμα — 裁きを受けることになる (κρίμα — «осуждение»). τὴν πρώτην πίστιν ἠθέτησαν — 最初の信仰を捨てた (ἀθετέω — «отвергать, нарушать», ср. 1:6); «первую веру» не понято как «обет при вдовстве» — двусмысленность сохранена."
  13: "ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας — 家から家へと巡り歩いて怠惰を学ぶ. φλύαροι — おしゃべり. περίεργοι — 他人の事に首を突っ込む (περίεργος — «сующийся не в своё дело»); передано описательно, без редкого 詮索. λαλοῦσαι τὰ μὴ δέοντα — 語るべきでないことを語る."
  14: "βούλομαι οὖν — そこで、わたしは…願っている (βούλομαι — «желать, хотеть»). νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν — 結婚し、子を生み、家を治める: три инфинитива сохранены. τῷ ἀντικειμένῳ — 敵 (противник; ср. 2 Сол 2:4). μηδεμίαν ἀφορμὴν διδόναι λοιδορίας χάριν — 非難の口実を何ひとつ与えない (ἀφορμή — «повод»)."
  15: "ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ — すでに、ある者たちはサタンの後ろにそれて行った (ἐκτρέπω — «совращаться», ὀπίσω — «вслед»); образ пути сохранён."
  16: "εἴ τις πιστὴ ἔχει χήρας — в базе только πιστή («если какая верующая женщина имеет вдов»); церковный текст (Елизаветинская, Синодальный «если какой верующий или верующая», jp-joc「若し信男或は信女に嫠あらば」) читает πιστὸς ἢ πιστή — мужской случай в базе отсутствует, это добавление Церкви, поэтому 〔信じる男や〕. Проверено по базе: πιστός — 0, πιστή — 1. ἐπαρκείτω αὐταῖς — 助けなさい. μὴ βαρείσθω ἡ ἐκκλησία — 教会に負担をかけない (βαρέω — «отягощать»). ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ — まことのやもめたちを助けることができる."
  17: "οἱ καλῶς προεστῶτες πρεσβύτεροι — よく治める長老たち (προΐστημι — «предстоятельствовать, руководить»). διπλῆς τιμῆς ἀξιούσθωσαν — 二重の敬いを受けるに値する者として扱いなさい (τιμή здесь — и честь, и содержание, ср. ст. 3 и 18); ἀξιόω — «считать достойным». μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ — 特に、言葉と教えとに労する者たち (конструкция греч. эллиптическая, сохранена)."
  18: "Втор 25:4 и Лк 10:7 — сплошная цитата Писания, поэтому 「…」, без красного. λέγει γὰρ ἡ γραφή — 聖書に言われている. Βοῦν ἀλοῶντα οὐ φιμώσεις — 穀物を脱穀する牛に口をつけてはならない (ἀλοάω — «молотить»; φιμόνω — «заграждать рот»). ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ — 働く者はその報酬を受けるに値する."
  19: "Втор 19:15. κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου — 長老に対する訴えは…受け入れてはならない. ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων — 二人、また三人の証人によるのでなければ; цитата в 「…」, без красного."
  20: "τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε — 罪を犯す者たちを皆の前で戒めなさい (ἐλέγχω — «обличать»). ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν — ほかの者たちも恐れを抱くため; καί сохранено."
  21: "Διαμαρτύρομαι — 厳かに命じる (διαμαρτύρομαι — «торжественно свидетельствовать, заклинать»). ἐνώπιον τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ καὶ τῶν ἐκλεκτῶν ἀγγέλων — 神とキリスト・イエスと、選ばれた天使たちの前で; три свидетеля сохранены. χωρὶς προκρίματος — 先入観なしに (πρόκριμα — «предрешение»). μηδὲν ποιῶν κατὰ πρόσκλισιν — 偏りなく行う (πρόσκλισις — «пристрастие»)."
  22: "Χεῖρας ταχέως μηδενὶ ἐπιτίθει — だれにもすぐに手を置いてはならない (речь о рукоположении и принятии в клир, ср. 4:14). μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις — 他人の罪に関わってはならない (κοινωνέω — «быть причастным»). σεαυτὸν ἁγνὸν τήρει — 自分を純潔に保ちなさい."
  23: "Μηκέτι ὑδροπότει — これからは水だけを飲まず (ὑδροποτέω — «пить воду»). οἴνῳ ὀλίγῳ χρῶ — 少しのぶどう酒[さけ]を用いなさい (чтение さけ — конвенция корпуса, ср. 3:3,8). διὰ τὸν στόμαχον — 胃のために. τὰς πυκνάς σου ἀσθενείας — しばしばあなたを襲う病 (πυκνός — «частый»)."
  24: "Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοι — ある人たちの罪は前もって明らか (πρόδηλος — «заранее явный»). προάγουσαι εἰς κρίσιν — 裁きに先立つ. τισὶν δὲ καὶ ἐπακολουθοῦσιν — ある人たちの罪は後からついてくる (смысл: одни грехи видны сразу, другие открываются после)."
  25: "ὡσαύτως — 同じように. τὰ ἔργα τὰ καλὰ πρόδηλα — 良いわざも前もって明らか. τὰ ἄλλως ἔχοντα — そうでないもの (букв. «имеющееся иначе»). κρυβῆναι οὐ δύνανται — 隠れることはできない."
