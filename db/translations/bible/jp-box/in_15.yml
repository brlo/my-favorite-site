verses:
  1: "「<j>わたしはまことのぶどうの木[き]であり、わたしの父[ちち]は農夫[のうふ]である。</j>"
  2: "<j>わたしにつながっていながら実[み]を結[むす]ばない枝[えだ]は、父[ちち]がすべて取[と]り除[のぞ]かれる。実[み]を結[むす]ぶ枝[えだ]は、さらに多[おお]くの実[み]を結[むす]ぶように、きれいに手入[てい]れをなさる。</j>"
  3: "<j>あなたがたは、わたしが語[かた]った言葉[ことば]によって、すでにきよめられている。</j>"
  4: "<j>わたしにとどまりなさい。わたしもあなたがたのうちにとどまる。枝[えだ]がぶどうの木[き]につながっていなければ、自分[じぶん]だけでは実[み]を結[むす]ぶことができない。あなたがたも、わたしにとどまっていなければ、同[おな]じである。</j>"
  5: "<j>わたしはぶどうの木[き]、あなたがたはその枝[えだ]である。わたしにとどまり、わたしもその人[ひと]のうちにとどまる者[もの]は、多[おお]くの実[み]を結[むす]ぶ。わたしを離[はな]れては、あなたがたは何[なに]もすることができない。</j>"
  6: "<j>わたしにとどまらない者[もの]は、枝[えだ]のように外[そと]に投[な]げ出[だ]されて枯[か]れてしまう。そのような枝[えだ]は集[あつ]められ、火[ひ]に投[な]げ入[い]れられて焼[や]かれる。</j>"
  7: "<j>あなたがたがわたしにとどまり、わたしの言葉[ことば]があなたがたのうちにとどまっているなら、望[のぞ]むことを何[なん]でも求[もと]めなさい。そうすれば、それはあなたがたにかなえられる。</j>"
  8: "<j>わたしの父[ちち]が栄光[えいこう]をお受[う]けになったのは、あなたがたが多[おお]くの実[み]を結[むす]んで、わたしの弟子[でし]となることによってである。</j>"
  9: "<j>父[ちち]がわたしを愛[あい]したように、わたしもあなたがたを愛[あい]した。わたしの愛[あい]にとどまりなさい。</j>"
  10: "<j>あなたがたがわたしの掟[おきて]を守[まも]るなら、わたしの愛[あい]にとどまる。わたしも父[ちち]の掟[おきて]を守[まも]って、父[ちち]の愛[あい]にとどまっている。</j>"
  11: "<j>わたしがこれらのことをあなたがたに語[かた]ったのは、わたしの喜[よろこ]びがあなたがたのうちにあり、あなたがたの喜[よろこ]びが満[み]たされるためである。</j>"
  12: "<j>これがわたしの掟[おきて]である。わたしがあなたがたを愛[あい]したように、互[たが]いに愛[あい]し合[あ]いなさい。</j>"
  13: "<j>自分[じぶん]の友[とも]のために命[いのち]を捨[す]てること、これにまさる愛[あい]はない。</j>"
  14: "<j>わたしが命[めい]じることを行[おこな]うなら、あなたがたはわたしの友[とも]である。</j>"
  15: "<j>あなたがたを、わたしはもう僕[しもべ]とは呼[よ]ばない。僕[しもべ]は主人[しゅじん]が何[なに]をするのか知[し]らないからである。わたしはあなたがたを友[とも]と呼[よ]んだ。わたしの父[ちち]から聞[き]いたことをすべて、あなたがたに知[し]らせたからである。</j>"
  16: "<j>あなたがたがわたしを選[えら]んだのではなく、わたしがあなたがたを選[えら]び、あなたがたを立[た]てた。あなたがたが行[い]って実[み]を結[むす]び、その実[み]が残[のこ]るためである。それは、あなたがたがわたしの名[な]によって父[ちち]に求[もと]めることを、何[なん]でも父[ちち]があなたがたに与[あた]えてくださるためである。</j>"
  17: "<j>あなたがたが互[たが]いに愛[あい]し合[あ]うように、わたしはあなたがたに命[めい]じる。</j>"
  18: "<j>この世[よ]があなたがたを憎[にく]むなら、あなたがたより先[さき]にわたしを憎[にく]んだことを知[し]りなさい。</j>"
  19: "<j>もしあなたがたがこの世[よ]のものであったなら、この世[よ]は自分[じぶん]のものとしてあなたがたを愛[あい]したであろう。しかし、あなたがたはこの世[よ]のものではなく、わたしがあなたがたをこの世[よ]から選[えら]び出[だ]した。だから、この世[よ]はあなたがたを憎[にく]む。</j>"
  20: "<j>わたしがあなたがたに言[い]った言葉[ことば]を思[おも]い出[だ]しなさい。『僕[しもべ]はその主人[しゅじん]より偉[えら]くない。』わたしを迫害[はくがい]した者[もの]は、あなたがたをも迫害[はくがい]する。わたしの言葉[ことば]を守[まも]った者[もの]は、あなたがたの言葉[ことば]をも守[まも]る。</j>"
  21: "<j>しかし、彼[かれ]らはこれらのことをすべて、わたしの名[な]のゆえにあなたがたにする。わたしを遣[つか]わした方[かた]を知[し]らないからである。</j>"
  22: "<j>もしわたしが来[き]て彼[かれ]らに語[かた]らなかったなら、彼[かれ]らに罪[つみ]はなかったであろう。しかし、今[いま]は、自分[じぶん]の罪[つみ]について何[なに]も弁解[べんかい]できない。</j>"
  23: "<j>わたしを憎[にく]む者[もの]は、わたしの父[ちち]をも憎[にく]む。</j>"
  24: "<j>もしわたしが彼[かれ]らの間[あいだ]で、ほかのだれも行[おこな]ったことのないわざを行[おこな]わなかったなら、彼[かれ]らに罪[つみ]はなかったであろう。しかし、今[いま]は彼[かれ]らはそれを見[み]て、わたしも父[ちち]も憎[にく]んだのである。</j>"
  25: "<j>しかし、彼[かれ]らの律法[りっぽう]に『彼[かれ]らは理由[りゆう]なくしてわたしを憎[にく]んだ』と書[か]かれている言葉[ことば]が成就[じょうじゅ]するためである。</j>"
  26: "<j>わたしが父[ちち]のもとからあなたがたに遣[つか]わす助[たす]け主[ぬし]、すなわち父[ちち]から出[で]る真理[しんり]の霊[れい]が来[く]ると、その方[かた]がわたしについて証[あかし]される。</j>"
  27: "<j>あなたがたもまた証[あかし]する。初[はじ]めからわたしと一緒[いっしょ]にいたからである。</j>」"

notes:
  1: "ἄμπελος ἀληθινή — «виноградная лоза истинная»; まことのぶどうの木 (по заданию). γεωργός — «земледелец, виноградарь»; 農夫. У jp-joc 園師."
  2: "αἴρει αὐτό — «берёт, убирает»; 取り除かれる. καθαίρει αὐτό — «очищает»; きれいに手入れをなさる (обрезка лозы), игра αἴρει/καθαίρει на «убрать/очистить» в переводе не сглажена добавлением пояснений. ἵνα καρπὸν πλείονα φέρῃ — «чтобы приносила больше плода»."
  3: "ἤδη ὑμεῖς καθαροί ἐστε — «вы уже чисты»; すでにきよめられている. διὰ τὸν λόγον ὃν λελάληκα ὑμῖν — «через слово, которое Я сказал вам»; perfect — 語った言葉によって."
  4: "μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν — «пребудьте во Мне, и Я в вас»; とどまる — ключевое слово главы (4–10). καθὼς τὸ κλῆμα οὐ δύναται… ἐὰν μὴ μένῃ ἐν τῇ ἀμπέλῳ — 枝がぶどうの木につながっていなければ…; отрицание условия сохранено."
  5: "ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα — «Я лоза, вы ветви»; わたしはぶどうの木、あなたがたはその枝である. χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν — «без Меня не можете делать ничего»; わたしを離れては…何もすることができない."
  6: "ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη — «выброшен вон, как ветвь, и засох»; аористы переданы настоящим описанием. συνάγουσιν αὐτὰ… καὶ καίεται — «собирают их… и сгорают»; множественное τὰ κλήματα — そのような枝は集められ…焼かれる."
  7: "ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ — «если пребудете во Мне и слова Мои в вас пребудут»; ὃ ἐὰν θέλητε αἰτήσασθε — «чего ни пожелаете, просите»."
  8: "ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου, ἵνα καρπὸν πολὺν φέρητε καὶ γένησθε ἐμοὶ μαθηταί — аорист ἐδοξάσθη («прославился») и ἵνα-придаточное сохранены: 栄光をお受けになったのは…ことによってである. Не сглажено в «прославится»."
  9: "καθὼς ἠγάπησέν με ὁ πατὴρ κἀγὼ ὑμᾶς ἠγάπησα — «как возлюбил Меня Отец, и Я возлюбил вас»; аорист — 愛した. μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ — わたしの愛にとどまりなさい."
  10: "ἐὰν τὰς ἐντολάς μου τηρήσητε — «если заповеди Мои соблюдёте»; μενεῖτε ἐν τῇ ἀγάπῃ μου — わたしの愛にとどまる. καθὼς ἐγὼ… τετήρηκα — perfect «Я соблюл»; 守って…とどまっている. Порядок «как Я соблюл заповеди Отца Моего и пребываю в Его любви» сохранён."
  11: "ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ — «чтобы радость Моя в вас была и радость ваша исполнилась»; 喜びが満たされる (πληρόω — наполнять)."
  12: "αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμή — «сия есть заповедь Моя»; порядок греческого (сначала «заповедь», потом «любите») сохранён, в отличие от 13:34, где заповедь стоит после. καθὼς ἠγάπησα ὑμᾶς — «как Я возлюбил вас»."
  13: "μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει — «больше сей любви никто не имеет»; ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ — «чтобы кто положил душу свою за друзей своих»; ψυχή — 命[いのち]."
  14: "ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ἃ ἐγὼ ἐντέλλομαι ὑμῖν — «вы друзья Мои, если исполняете то, что Я заповедую вам»; あなたがたはわたしの友である."
  15: "οὐκέτι λέγω ὑμᾶς δούλους — «уже не называю вас рабами»; 僕[しもべ]. В греческом здесь нет ἀμήν (в задании стоял вопрос — двойного «аминь» в 15:15 нет). πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν — «всё, что слышал от Отца Моего, объявил вам»."
  16: "οὐχ ὑμεῖς με ἐξελέξασθε — «не вы Меня избрали»; ἔθηκα ὑμᾶς — «поставил вас»; 立てた. ἵνα… καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ — «чтобы вы шли и приносили плод и плод ваш пребывал»; 実が残る."
  17: "ταῦτα ἐντέλλομαι ὑμῖν — «сие заповедую вам»; 命じる. Повтор 12, как в греческом."
  18: "εἰ ὁ κόσμος ὑμᾶς μισεῖ — «если мир вас ненавидит»; γινώσκετε ὅτι ἐμὲ πρῶτον ὑμῶν μεμίσηκεν — «знайте, что Меня прежде вас возненавидел»; あなたがたより先に."
  19: "εἰ ἐκ τοῦ κόσμου ἦτε — «если бы вы были от мира»; τὸ ἴδιον ἐφίλει — «своё любил бы»; 自分のものとして…愛したであろう. ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου — わたしが…この世から選び出した. διὰ τοῦτο μισεῖ — «потому ненавидит»."
  20: "μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν — «помните слово, которое Я сказал вам»; цитата из 13:16 — в 『』. εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν — «если Меня гнали, и вас будут гнать»; 迫害した/迫害する."
  21: "ἀλλὰ ταῦτα πάντα ποιήσουσιν εἰς ὑμᾶς διὰ τὸ ὄνομά μου — «но всё это сделают вам за имя Моё»; ὅτι οὐκ οἴδασιν τὸν πέμψαντά με — «ибо не знают Пославшего Меня»."
  22: "εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς — «если бы Я не пришёл и не говорил им»; ἁμαρτίαν οὐκ εἴχοσαν — «не имели бы греха»; νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν — «ныне же не имеют извинения о грехе своём»; 弁解できない (πρόφασις — предлог, отговорка)."
  23: "ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ — «ненавидящий Меня ненавидит и Отца Моего»; порядок сохранён."
  24: "εἰ τὰ ἔργα μὴ ἐποίησα… ἃ οὐδεὶς ἄλλος ἐποίησεν — «если бы Я не сотворил дел, которых никто другой не сотворил»; νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν — perfect; 見て、憎んだ. «И Меня и Отца Моего» — わたしも父も."
  25: "Пс 34:19 (35:19); ὁ λόγος ὁ ἐν τῷ νόμῳ αὐτῶν γεγραμμένος — «слово, в законе их написанное»; ἐμίσησάν με δωρεάν — «возненавидели Меня напрасно»; 理由なくして. Цитата — в 『』."
  26: "παράκλητος — 助け主[たすけぬし], то же слово, что в 14:16,26 (聖霊の称号; пояснение при 14:16). ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός — «Которого Я пошлю вам от Отца»; τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται — «Дух истины, Который от Отца исходит»; 父から出る. ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ — その方が…証しされる."
  27: "καὶ ὑμεῖς δὲ μαρτυρεῖτε — «и вы свидетельствуете»; ἀπ᾽ ἀρχῆς μετ᾽ ἐμοῦ ἐστε — «от начала со Мною вы»; 初めからわたしと一緒にいたからである."
