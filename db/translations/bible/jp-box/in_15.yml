# jp-box, Евангелие от Иоанна, глава 15.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# jp-ni не использовался.
#
# Виноградная лоза и ветви (1–11), заповедь любви и дружба (12–17),
# ненависть мира (18–25), обетование Утешителя и свидетельство учеников (26–27).
# Вся глава — речь Христа, поэтому красное в каждом стихе со своей парой тегов.
# Ключевое слово μένω — とどまる, проведено через 4–10.

