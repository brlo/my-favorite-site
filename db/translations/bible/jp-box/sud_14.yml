verses:
  1: "サムソンはティムナに下[くだ]って行[ゆ]き、ティムナでペリシテ人[じん]の娘[むすめ]たちのうちに一人[ひとり]の女[おんな]を見[み]た。彼女[かのじょ]は彼[かれ]の目[め]にかなった。"
  2: "彼[かれ]は上[のぼ]って行[ゆ]き、父[ちち]と母[はは]に告[つ]げて言[い]った。「ティムナでペリシテ人[じん]の娘[むすめ]たちのうちに女[おんな]を見[み]ました。今[いま]、わたしの妻[つま]として彼女[かのじょ]を迎[むか]えてください。」"
  3: "父[ちち]と母[はは]は彼[かれ]に言[い]った。「あなたの兄弟[きょうだい]の娘[むすめ]たちのうちにも、わたしの民[たみ]のすべてのうちにも、女[おんな]はいないのか。なぜあなたは、割礼[かつれい]を受[う]けていないペリシテ人[じん]の娘[むすめ]のうちから妻[つま]を迎[むか]えようとするのか。」サムソンは父[ちち]に言[い]った。「彼女[かのじょ]をわたしに迎[むか]えてください。彼女[かのじょ]はわたしの目[め]にかなっているからです。」"
  4: "父[ちち]と母[はは]は、これが主[しゅ]によるものであることを知[し]らなかった。主[しゅ]はペリシテ人[じん]から報[むく]いを求[もと]めておられたのである。そのころ、ペリシテ人[じん]はイスラエルの子[こ]らを支配[しはい]していた。"
  5: "サムソンは父[ちち]と母[はは]とともにティムナへ下[くだ]って行[ゆ]き、ティムナのぶどう畑[ばたけ]へ曲[ま]がった。見[み]ると、獅子[しし]の子[こ]がほえながら彼[かれ]に向[む]かって来[き]た。"
  6: "主[しゅ]の霊[れい]が彼[かれ]の上[うえ]に下[くだ]り、彼[かれ]は獅子[しし]を、まるで山羊[やぎ]の子[こ]でも裂[さ]くように裂[さ]いた。しかも、彼[かれ]の手[て]には何[なに]もなかった。彼[かれ]は自分[じぶん]がしたことを父[ちち]にも母[はは]にも告[つ]げなかった。"
  7: "彼[かれ]らは下[くだ]って行[ゆ]き、女[おんな]と語[かた]った。彼女[かのじょ]はサムソンの目[め]にかなった。"
  8: "幾日[いくにち]かして、彼[かれ]は彼女[かのじょ]を迎[むか]えに戻[もど]って来[き]た。獅子[しし]の死骸[しがい]を見[み]ようと立[た]ち寄[よ]ると、見[み]よ、獅子[しし]の口[くち]の中[なか]に蜂[はち]の群[む]れがいて、蜜[みつ]があった。"
  9: "彼[かれ]はそれを手[て]に取[と]って歩[ある]きながら食[た]べた。父[ちち]と母[はは]のところへ行[ゆ]って彼[かれ]らにも与[あた]え、彼[かれ]らは食[た]べた。しかし、蜜[みつ]を獅子[しし]の死骸[しがい]から取[と]ったことは告[つ]げなかった。"
  10: "父[ちち]は女[おんな]のところへ下[くだ]って行[ゆ]き、サムソンはそこで七日[なのか]の間[あいだ]の酒宴[しゅえん]を設[もう]けた。若者[わかもの]たちはそうするものだったからである。"
  11: "彼[かれ]らは彼[かれ]を恐[おそ]れて、三十人[さんじゅうにん]の友[とも]を彼[かれ]のそばに付[つ]け、彼[かれ]とともにいた。"
  12: "サムソンは彼[かれ]らに言[い]った。「あなたがたに謎[なぞ]を出[だ]そう。酒宴[しゅえん]の七日の間[あいだ]に、あなたがたがそれを解[と]いてわたしに告[つ]げたら、わたしはあなたがたに亜麻布[あまぬの]の衣[ころも]を三十[さんじゅう]枚[まい]、着替[きが]えの衣[ころも]を三十[さんじゅう]枚[まい]与[あた]えよう。"
  13: "もし解[と]けなければ、あなたがたがわたしに亜麻布[あまぬの]の衣[ころも]を三十[さんじゅう]枚[まい]、着替[きが]えの衣[ころも]を三十[さんじゅう]枚[まい]渡[わた]すのだ。」彼[かれ]らは言[い]った。「謎[なぞ]を出[だ]してください。聞[き]きましょう。」"
  14: "彼[かれ]は彼[かれ]らに言[い]った。「食[く]らう者[もの]から食[た]べ物[もの]が出[で]、強[つよ]い者[もの]から甘[あま]いものが出[で]た。」彼[かれ]らは三日[みっか]の間[あいだ]、謎[なぞ]を解[と]くことができなかった。"
  15: "四日目[よっかめ]に、彼[かれ]らはサムソンの妻[つま]に言[い]った。「あなたの夫[おっと]をだまして、謎[なぞ]を解[と]かせなさい。さもないと、あなたとあなたの父[ちち]の家[いえ]を火[ひ]で焼[や]き払[はら]うぞ。わたしたちを呼[よ]んだのは、わたしたちを貧[まず]しくするためか。」"
  16: "サムソンの妻[つま]は彼[かれ]の前[まえ]で泣[な]いて言[い]った。「あなたはわたしを憎[にく]んで、愛[あい]していないのですね。あなたはわたしの民[たみ]の子[こ]らに謎[なぞ]を出[だ]したのに、わたしには解[と]いてくれませんでした。」サムソンは彼女[かのじょ]に言[い]った。「見[み]よ、父[ちち]にも母[はは]にも告[つ]げなかったのだ。あなたに告[つ]げるだろうか。」"
  17: "彼女[かのじょ]は、酒宴[しゅえん]が続[つづ]いた七日[なのか]の間[あいだ]、彼[かれ]の前[まえ]で泣[な]いた。七日目[なのかめ]になって、彼[かれ]は彼女[かのじょ]に告[つ]げた。彼女[かのじょ]が彼[かれ]を悩[なや]ませたからである。彼女[かのじょ]はその謎[なぞ]を自分[じぶん]の民[たみ]の子[こ]らに告[つ]げた。"
  18: "七日目[なのかめ]に、日[ひ]が沈[しず]む前[まえ]に、町[まち]の人々[ひとびと]は彼[かれ]に言[い]った。「蜜[みつ]より甘[あま]いものがあろうか。獅子[しし]より強[つよ]いものがあろうか。」サムソンは彼[かれ]らに言[い]った。「もしあなたがたがわたしの雌牛[めうし]で耕[たがや]さなかったなら、わたしの謎[なぞ]を解[と]けなかっただろうに。」"
  19: "主[しゅ]の霊[れい]が彼[かれ]の上[うえ]に下[くだ]った。彼[かれ]はアスカロンに下[くだ]って行[ゆ]き、そこで三十人[さんじゅうにん]の者[もの]を打[う]ち殺[ころ]し、彼[かれ]らの衣[ころも]を取[と]って、謎[なぞ]を解[と]いた者[もの]たちに与[あた]えた。サムソンは激[はげ]しく怒[いか]って、父[ちち]の家[いえ]へ上[のぼ]って行[ゆ]った。"
  20: "サムソンの妻[つま]は、彼[かれ]の友[とも]の一人[ひとり]であった婚礼[こんれい]の介添[なかだち]の者[もの]とともに住[す]むようになった。"

notes:
  1: "κατέβη ... εἰς Θαμναθα — «сошёл в Фимнафу» (Θαμναθα; по брифу партии передано как ティムナ). ἐκ τῶν θυγατέρων τῶν ἀλλοφύλων — «из дочерей филистимских». ἤρεσεν ἐνώπιον αὐτοῦ — «понравилась ему» (букв. «была угодна пред ним»; слав. «угодна бысть пред ним»)."
  2: "ἀπήγγειλεν τῷ πατρὶ ... καὶ τῇ μητρί — «объявил отцу и матери». λάβετέ μοι αὐτὴν εἰς γυναῖκα — «возьмите её мне в жену»: множественное число — к родителям, которые устраивают брак."
  3: "Μὴ οὐκ ἔστιν ... γυνή — вопрос с μή, ожидающий ответа «да, есть»: «разве нет…». τῶν ἀδελφῶν σου — «братьев твоих» (слав. «от братии твоея»). ἀπεριτμήτων — «необрезанных» (передано описательно: 割礼を受けていない). ἤρεσεν ἐν ὀφθαλμοῖς μου — «понравилась в очах моих» (слав. «угодна есть пред очима моима»)."
  4: "οὐκ ἔγνωσαν ὅτι παρὰ κυρίου ἐστίν — «не знали, что это от Господа». ἀνταπόδομα αὐτὸς ἐκζητεῖ — «воздаяние Он взыскует» (ἀνταπόδομα — «воздаяние, расплата»; слав. «отмщения он ищет»); у Синодального «ищет случая отмстить». ἐκυρίευον — «господствовали» (κυριεύω)."
  5: "ἐξέκλινεν εἰς ἀμπελῶνα — «свернул в виноградник»: единственное число, хотя перед тем названы трое (Самсон с родителями). σκύμνος λεόντων ὠρυόμενος — «львёнок, рыкая» (σκύμνος — детёныш; ὀρύομαι — рычать)."
  6: "κατηύθυνεν ἐπ᾿ αὐτὸν πνεῦμα κυρίου — «устремился на него Дух Господень» (κατευθύνω — направлять; слав. «сниде на него»); по-японски — формула 主の霊が彼の上に下った, как в 14:19 и 15:14. διέσπασεν — «растерзал» (διασπάω). ὡσεὶ διασπάσαι ἔριφον αἰγῶν — «как растерзать козлёнка». οὐδὲν ἦν ἐν τῇ χειρὶ αὐτοῦ — «ничего не было в руке его»."
  7: "κατέβησαν καὶ ἐλάλησαν — множественное число: «сошли и говорили с женщиной» (слав. «поидоша и рекоша жене»); кто именно — не сказано. ἤρεσεν ἐνώπιον Σαμψων — «понравилась Самсону»."
  8: "μεθ᾿ ἡμέρας — «через несколько дней» (幾日かして). λαβεῖν αὐτήν — «чтобы взять её». συστροφὴ μελισσῶν — «рой пчёл» (συστροφή — «сборище, кучка»; слав. «рой пчел»). ἐπέστρεψεν — «возвратился»."
  9: "ἐξεῖλεν αὐτὸ εἰς τὸ στόμα αὐτοῦ — «извлёк его в уста свои», т.е. взял и ел; слав. «изя его от уст его в руце свои» передаёт иначе. ἐκ τῆς ἕξεως τοῦ λέοντος — «из того, что осталось от льва», из туши; слав. «от уст львовых»."
  10: "πότον ἡμέρας ἑπτά — «пир (попойку) на семь дней» (πότος — пиршество; 酒宴). οὕτως ἐποίουν οἱ νεανίσκοι — «так делали юноши», т.е. таков был обычай женихов."
  11: "ἐν τῷ φοβεῖσθαι αὐτοὺς αὐτόν — «когда они устрашились его» (слав. «внегда боятися им его»); у Синодального «как там увидели его» — масоретское чтение. ἑταίρους τριάκοντα — «тридцать товарищей» (ἑταῖρος), т.е. брачные друзья."
  12: "πρόβλημα — «загадка» (謎). ἀπαγγείλητε — «возвестите, отгадаете». ἐν ταῖς ἑπτὰ ἡμέραις τοῦ πότου — «в семь дней пира». σινδόνας — «синдон», тонкое полотно (передано как 亜麻布の衣; слав. «понявы»). στολάς — «одежды» (着替えの衣)."
  13: "ἀπαγγεῖλαι — «возвестить отгадку». στολὰς ἱματίων — «одежды одежд», т.е. перемены платья. Προβαλοῦ — «предложи» (προβάλλω). ἀκουσόμεθα — «послушаем»."
  14: "Загадка стоит в 「…」 как прямая речь первого уровня. Ἐκ τοῦ ἔσθοντος ἐξῆλθεν βρῶσις — «из ядущего вышло ядомое» (ἐσθίω). ἐξ ἰσχυροῦ ... γλυκύ — «из сильного — сладкое». ἐπὶ τρεῖς ἡμέρας — «три дня» (слав. «до трех дний»)."
  15: "ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ — «в день четвёртый» (LXX; у Синодального «в седьмой» — масоретское чтение); отсюда 四日目. Ἀπάτησον — «обмани» (ἀπατάω). μήποτε ἐμπυρίσωμέν σε — «как бы нам не сжечь тебя» (ἐμπυρίζω). ἦ πτωχεῦσαι ἐκαλέσατε ἡμᾶς — «разве обеднеть вы позвали нас» (πτωχεύω — нищать; слав. «или оубожити призвасте ны»)."
  16: "Μεμίσηκάς με καὶ οὐκ ἠγάπηκάς με — «возненавидел ты меня и не возлюбил» (perfect с настоящим значением). κἀμοὶ οὐκ ἀπήγγειλας — «и мне не возвестил». Ἰδοὺ τῷ πατρί ... οὐκ ἀπήγγειλα — «вот, отцу не возвестил»."
  17: "ἐπὶ τὰς ἑπτὰ ἡμέρας, ἐν αἷς ἦν ὁ πότος — «семь дней, пока был пир». ὅτι παρηνώχλησεν αὐτόν — «потому что она докучала ему» (παρενοχλέω; слав. «яко стужи ему»); у Синодального «усиленно просила»."
  18: "πρὶν δῦναι τὸν ἥλιον — «прежде захода солнца» (δύω). Τί γλυκύτερον μέλιτος — «что слаще мёда» (сравнительная степень). κατεδαμάσατέ μου τὴν δάμαλιν — «вы пахали на моей телице» (καταδαμάζω — укрощать, пахать; δάμαλις — молодая корова); поговорка, у Синодального «орали на моей телице»."
  19: "κατεύθυνεν ἐπ᾿ αὐτὸν πνεῦμα κυρίου — см. ст. 6. Ἀσκαλῶνα — Аскалон, один из пяти филистимских городов. ἔπαισεν ... τριάκοντα ἄνδρας — «поразил тридцать мужей» (παίω). ἐθυμώθη ὀργῇ — «воспылал гневом» (θυμόω и ὀργή — плеоназм)."
  20: "συνῴκησεν — «стала сожительствовать, вышла за него» (συνοικέω); слав. «иде за инаго мужа». νυμφαγωγός — «брачный друг, шафер» (тот, кто приводит невесту; 婚礼の介添); ὃς ἦν ἑταῖρος αὐτοῦ — «который был товарищем его»."
