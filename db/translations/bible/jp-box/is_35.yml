# jp-box, Исаия, глава 35. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами (гл. 3, 5–10,
# 13–14, 19, 25–29, 37–38, 40–43, 45, 48–50, 52, 54, 58, 60, 62–66) — главы 35 нет;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 35: 1–2 пустыня цветёт, слава Ливана и Кармила, народ увидит славу Господню;
# 3–4 укрепите руки и колени, «вот Бог наш»; 5–6 отверзутся глаза слепых, уши глухих,
# хромой вскочит как олень, язык косноязычных будет ясен, воды в пустыне;
# 7 безводная станет болотами; 8–9 путь чистый и святой, нечистый не пройдёт,
# рассеянные не заблудятся, льва там нет; 10 возвращение собранных Господом на Сион
# с вечной радостью, бежала печаль и стенание.
# Голоса: прямой речи нет; 3–4 пророческое обращение без кавычек.
# Нумерация по gr: 10 стихов; деление совпадает с csl и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. добавлений в главе нет.
# 35:5–6 (цит. Мф 11:5; Лк 7:22) переведено буквально по LXX.
# Сносок ⟨…⟩ нет: 鹿, 葦, 泉, 贖われる уже в корпусе.
# Имена — транслитерация греческого (LXX): ヨルダン, レバノン, カルメル, シオン.

