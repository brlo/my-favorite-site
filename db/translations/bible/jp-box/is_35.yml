verses:
  1: "渇[かわ]いた荒野[こうや]よ、喜[よろこ]べ。荒野[こうや]よ、喜[よろこ]び躍[おど]れ、百合[ゆり]のように咲[さ]け。"
  2: "ヨルダンの荒野[こうや]は花[はな]咲[さ]き、喜[よろこ]び躍[おど]る。レバノンの栄光[えいこう]とカルメルの誉[ほま]れがそれに与[あた]えられ、わたしの民[たみ]は主[しゅ]の栄光と、神[かみ]の高[たか]さを見[み]る。"
  3: "弱[よわ]った手[て]よ、くずおれた膝[ひざ]よ、強[つよ]くなれ。"
  4: "心[こころ]の弱[よわ]い者[もの]たちよ、元気[げんき]を出[だ]せ。強くなれ、恐[おそ]れるな。見[み]よ、わたしたちの神[かみ]は裁[さば]きを報[むく]い、報いを与[あた]えられる。この方[かた]が来[き]て、わたしたちを救[すく]う。"
  5: "そのとき、目[め]の見[み]えない者[もの]たちの目が開[ひら]かれ、耳[みみ]の聞[き]こえない者たちの耳が聞[き]く。"
  6: "そのとき、足[あし]の不自由[ふじゆう]な者[もの]は鹿[しか]のように跳[は]ね、うまく話[はな]せない者[もの]の舌[した]は明[あき]らかになる。荒野[こうや]に水[みず]が湧[わ]き、渇[かわ]いた地[ち]に谷川[たにがわ]が流[なが]れ出[で]るからである。"
  7: "水[みず]のない所[ところ]は池[いけ]となり、渇[かわ]いた地[ち]には水の泉[いずみ]がある。そこには鳥[とり]たちの喜[よろこ]び、葦[あし]の茂[しげ]みと沼[ぬま]がある。"
  8: "そこに清[きよ]い道[みち]があり、聖[せい]なる道と呼[よ]ばれる。汚[けが]れた者[もの]はそこを通[とお]らず、汚れた道もそこにはない。散[ち]らされた者[もの]たちはその道を歩[あゆ]み、迷[まよ]うことがない。"
  9: "そこには獅子[しし]はいない。悪[わる]い獣[けもの]もそこに上[のぼ]って来[こ]ず、見[み]つかることもない。ただ贖[あがな]われた者[もの]たちがそこを歩[あゆ]む。"
  10: "主[しゅ]によって集[あつ]められた者[もの]たちは帰[かえ]って来[き]て、喜[よろこ]びとともにシオンに来[く]る。永遠[えいえん]の喜びが彼[かれ]らの頭[あたま]の上[うえ]にあり、彼らの頭の上には賛美[さんび]と喜び躍[おど]りがある。喜びが彼らを捕[と]らえ、苦[くる]しみも悲[かな]しみも嘆[なげ]きも逃[に]げ去[さ]った。"

notes:
  1: "Εὐφράνθητι, ἔρημος διψῶσα — «возвеселись, пустыня жаждущая» (εὐφραίνομαι — радоваться; διψάω — жаждать); слав. «Радуйся, пустыня жаждущая». ἀγαλλιάσθω — «да ликует» (ἀγαλλιάομαι — ликовать, торжествовать). ἀνθείτω ὡς κρίνον — «да цветёт, как лилия» (ἀνθέω — цвести; κρίνον — лилия, слав. «крин»). Три императива подряд сохранены."
  2: "ἐξανθήσει καὶ ἀγαλλιάσεται τὰ ἔρημα τοῦ Ιορδάνου — «процветёт и возликует пустыня Иордана» (τὰ ἔρημα — пустынные места; ἐξανθέω — расцветать); слав. «процветет и возвеселится пустыня иорданова». ἡ δόξα τοῦ Λιβάνου ἐδόθη αὐτῇ — «слава Ливана дана ей» (ἐδόθη — aor. pass. от δίδωμι); ἡ τιμὴ τοῦ Καρμήλου — «честь Кармила»; слав. «честь кармилова». ὁ λαός μου ὄψεται τὴν δόξαν κυρίου — «народ Мой увидит славу Господню»; τὸ ὕψος τοῦ θεοῦ — «высоту Божию». Син. добавляет «Сарон» (МТ) — в LXX/слав. его нет, в текст не внесено."
  3: "ἰσχύσατε — «укрепитесь» (ἰσχύω — быть сильным); χεῖρες ἀνειμέναι — «руки ослабленные, опущенные» (ἀνίημι — ослаблять, опускать); γόνατα παραλελυμένα — «колени расслабленные» (παραλύω — расслаблять, ср. «паралич»). Слав. «Укрепитеся, руце ослабленыя и колена разслабленая»; в тексте обращение к рукам и коленям (…よ)."
  4: "παρακαλέσατε — «утешьте, ободрите» (παρακαλέω); слав. «утешитеся» — возвр. форма, иное понимание того же места. οἱ ὀλιγόψυχοι τῇ διανοίᾳ — «малодушные умом» (ὀλιγόψυχος — малодушный; διάνοια — ум, помысел); ἰσχύσατε, μὴ φοβεῖσθε — «укрепитесь, не бойтесь». ἰδοὺ ὁ θεὸς ἡμῶν κρίσιν ἀνταποδίδωσιν καὶ ἀνταποδώσει — «вот Бог наш: суд воздаёт и воздаст» (ἀνταποδίδωμι — воздавать); αὐτὸς ἥξει καὶ σώσει ἡμᾶς — «Он придёт и спасёт нас»."
  5: "τότε ἀνοιχθήσονται ὀφθαλμοὶ τυφλῶν — «тогда отверзутся глаза слепых» (ἀνοίγω — открывать; τυφλός — слепой); ὦτα κωφῶν ἀκούσονται — «уши глухих услышат» (κωφός — глухой); слав. «Тогда отверзутся очи слепых, и уши глухих услышат». Место цитируется в Мф 11:5 и Лк 7:22 — переведено буквально, без сглаживания."
  6: "τότε ἁλεῖται ὡς ἔλαφος ὁ χωλός — «тогда вскочит, как олень, хромой» (ἅλλομαι — прыгать, скакать; χωλός — хромой; ἔλαφος — олень); слав. «скочит хромый яко елень». τρανὴ ἔσται γλῶσσα μογιλάλων — «ясным будет язык косноязычных» (τρανός — ясный, отчётливый; μογιλάλος — говорящий с трудом, косноязычный); слав. «ясен будет язык гугнивых». ἐρράγη ἐν τῇ ἐρήμῳ ὕδωρ — «прорвалась в пустыне вода» (ῥήγνυμι — разрывать, прорывать); φάραγξ — ущелье, поток; слав. «дебрь»."
  7: "ἡ ἄνυδρος ἔσται εἰς ἕλη — «безводная [земля] станет болотами» (ἄνυδρος — безводный; ἕλος — болото, слав. «лузи»); εἰς τὴν διψῶσαν γῆν πηγὴ ὕδατος ἔσται — «на земле жаждущей источник воды будет» (πηγή — источник); слав. «источник водный». εὐφροσύνη ὀρνέων — «радость птиц»; ἔπαυλις καλάμου καὶ ἕλη — «жилище тростника и болота» (κάλαμος — тростник, слав. «трость»)."
  8: "ἐκεῖ ἔσται ὁδὸς καθαρά — «там будет дорога чистая» (καθαρός — чистый); ὁδὸς ἁγία κληθήσεται — «путём святым наречётся» (ἁγία — святая; в тексте 聖なる道). οὐ μὴ παρέλθῃ ἐκεῖ ἀκάθαρτος — «не пройдёт там нечистый» (ἀκάθαρτος — нечистый); οὐδὲ ἔσται ἐκεῖ ὁδὸς ἀκάθαρτος — «и не будет там дороги нечистой»; слав. «ниже будет тамо путь нечист». οἱ διεσπαρμένοι πορεύσονται ἐπ᾿ αὐτῆς — «рассеянные пойдут по ней» (διασπείρω — рассеивать); καὶ οὐ μὴ πλανηθῶσιν — «и не заблудятся» (πλανάω — вводить в заблуждение); слав. «разсеяннии же пойдут по нему и не заблудят»."
  9: "οὐκ ἔσται ἐκεῖ λέων — «не будет там льва»; οὐδὲ τῶν θηρίων τῶν πονηρῶν οὐ μὴ ἀναβῇ ἐπ᾿ αὐτὴν — «и из зверей злых не взойдёт на неё» (θηρίον — зверь; ἀναβαίνω — восходить); слав. «ни от зверей злых не взыдет нань». ἀλλὰ πορεύσονται ἐν αὐτῇ λελυτρωμένοι — «но пойдут по ней искупленные» (λυτρόω — искупать, освобождать; слав. «избавленнии»)."
  10: "συνηγμένοι διὰ κύριον — «собранные Господом» (συνάγω — собирать; διά с винитивом — ради, через); слав. «собраннии Господем». ἀποστραφήσονται καὶ ἥξουσιν εἰς Σιων μετ᾿ εὐφροσύνης — «обратятся и придут в Сион с радостью». εὐφροσύνη αἰώνιος ὑπὲρ κεφαλῆς αὐτῶν — «радость вечная над головою их» (ὑπέρ с род. — над); ἐπὶ γὰρ κεφαλῆς αὐτῶν αἴνεσις καὶ ἀγαλλίαμα — «ибо на голове их хвала и ликование» (αἴνεσις — хвала; ἀγαλλίαμα — ликование). εὐφροσύνη καταλήμψεται αὐτούς — «радость охватит их» (καταλαμβάνω — охватывать, постигать). ἀπέδρα ὀδύνη καὶ λύπη καὶ στεναγμός — «убежала боль, и печаль, и стенание» (ἀποδιδράσκω — убегать; στεναγμός — стенание)."
