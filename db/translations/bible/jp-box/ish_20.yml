# jp-box, Исход, глава 20. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru и jp-joc (1901, PD;
# ст. 2–12 выборочно). Русский Синодальный — только для понимания.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 20 по LXX — 26 стихов (в масоретском тексте и Синодальном 17): заповеди занимают
# 2–17, страх народа и запрет приближаться — 18–21, жертвенник из земли и камня — 22–26.
# Нумерация и порядок заповедей — греческие: 13 прелюбодеяние, 14 кража, 15 убийство
# (в Синодальном наоборот), в 17 сначала жена, потом дом.
# Красного и синего нет: слова Бога — в 「…」, «<j>» не ставится; вложенная речь — 『…』.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 安息日 пояснена в 16:23, マナ — в 16:31, ゴモル — в 16:16;
# 偶像, 祭壇, 契約 уже в корпусе или понятны.
# «Десять слов» (十戒, δέκα λόγοι) — выражение Исх 34:28; здесь LXX говорит «все слова сии»
# (πάντας τοὺς λόγους τούτους), поэтому 十戒 в тексте не стоит — только в notes.
# jp-ni не использовался.

