verses:
  1: "主[しゅ]はこれらの言葉[ことば]をすべて語[かた]って言[い]われた。"
  2: "「わたしは主[しゅ]、あなたの神[かみ]である。あなたをエジプトの地[ち]から、奴隷[どれい]の家[いえ]から導[みちび]き出[だ]した者[もの]である。"
  3: "あなたには、わたしのほかに神[かみ]々[がみ]があってはならない。"
  4: "あなたは自分[じぶん]のために偶像[ぐうぞう]を造[つく]ってはならない。上[うえ]の天[てん]にあるもの、下[した]の地[ち]にあるもの、地[ち]の下[した]の水[みず]の中[なか]にあるもの、そのすべていかなる形[かたち]も造[つく]ってはならない。"
  5: "それらを拝[おが]んではならない。それらに仕[つか]えてはならない。わたしは主[しゅ]、あなたの神[かみ]、妬[ねた]む神[かみ]であり、わたしを憎[にく]む者[もの]には、父[ちち]の罪[つみ]を子[こ]どもに、三代[さんだい]また四代[よんだい]の子孫[ししそん]にまで報[むく]いる者[もの]である。"
  6: "しかし、わたしを愛[あい]し、わたしの定[さだ]めを守[まも]る者[もの]には、千代[せんだい]に至[いた]るまで慈[いつく]しみを施[ほどこ]す。」"
  7: "「あなたは主[しゅ]の名[な]をいたずらに唱[とな]えてはならない。主[しゅ]は、ご自分[じぶん]の名[な]をいたずらに唱[とな]える者[もの]を罰[ばっ]せずにはおかれないからである。」"
  8: "「安息日[あんそくび]を覚[おぼ]えて、これを聖[せい]とせよ。"
  9: "六日[むいか]の間[あいだ]は働[はたら]き、あなたのすべての業[わざ]を行[おこな]え。"
  10: "しかし、第七[だいしち]の日[ひ]は、あなたの神[かみ]である主[しゅ]の安息日[あんそくび]である。あなたはその日[ひ]、あなたも、あなたの息子[むすこ]も娘[むすめ]も、男[おとこ]の奴隷[どれい]も女[おんな]の奴隷[どれい]も、あなたの牛[うし]も、荷[に]を負[お]う獣[けもの]も、あなたのすべての家畜[かちく]も、あなたの中[なか]に住[す]む寄留[きりゅう]の者[もの]も、いかなる業[わざ]も行[おこな]ってはならない。"
  11: "六日[むいか]の間[あいだ]に、主[しゅ]は天[てん]と地[ち]と海[うみ]と、その中[なか]のすべてのものを造[つく]り、第七[だいしち]の日[ひ]に休[やす]まれた。それゆえ、主[しゅ]は第七[だいしち]の日[ひ]を祝福[しゅくふく]し、それを聖[せい]とされた。」"
  12: "「あなたの父[ちち]と母[はは]を敬[うやま]え。そうすれば、あなたは幸[しあわ]せになり、あなたの神[かみ]である主[しゅ]があなたに与[あた]える良[よ]い地[ち]の上[うえ]で、長[なが]く生[い]きることができる。」"
  13: "「姦淫[かんいん]してはならない。」"
  14: "「盗[ぬす]んではならない。」"
  15: "「人[ひと]を殺[ころ]してはならない。」"
  16: "「あなたの隣人[となり]に反[はん]して、偽[いつわ]りの証[あかし]を立[た]ててはならない。」"
  17: "「あなたの隣人[となり]の妻[つま]を欲[ほ]しがってはならない。あなたの隣人[となり]の家[いえ]も、その畑[はたけ]も、その男[おとこ]の奴隷[どれい]も、その女[おんな]の奴隷[どれい]も、その牛[うし]も、その荷[に]を負[お]う獣[けもの]も、その家畜[かちく]も、あなたの隣人[となり]のすべてのものを欲[ほ]しがってはならない。」"
  18: "民[たみ]はみな、雷[かみなり]の声[こえ]と稲妻[いなずま]、角笛[つのぶえ]の音[ね]、煙[けむり]の立[た]つ山[やま]を見[み]た。民[たみ]は恐[おそ]れて震[ふる]え、遠[とお]くに立[た]った。"
  19: "彼[かれ]らはモーセに言[い]った。「あなたがわたしたちに語[かた]ってくれ。わたしたちは聞[き]く。だが、神[かみ]がわたしたちに語[かた]ってはならない。わたしたちは死[し]んでしまうからだ。」"
  20: "モーセは彼[かれ]らに言[い]った。「恐[おそ]れてはならない。神[かみ]が来[こ]られたのは、あなたがたを試[こころ]みるため、あなたがたの間[あいだ]に神[かみ]への恐[おそ]れを置[お]き、あなたがたが罪[つみ]を犯[おか]さないようにするためである。」"
  21: "民[たみ]は遠[とお]くに立[た]っていた。モーセは、神[かみ]がおられる暗[くら]やみの中[なか]へ入[はい]って行[い]った。"
  22: "主[しゅ]はモーセに言[い]われた。「ヤコブの家[いえ]にこう言[い]い、イスラエルの子[こ]らに告[つ]げなさい。『あなたがたは、わたしが天[てん]からあなたがたに語[かた]ったのを見[み]た。』」"
  23: "「あなたがたは、自分[じぶん]のために銀[ぎん]の神[かみ]々[がみ]や金[きん]の神[かみ]々[がみ]を造[つく]ってはならない。あなたがたは自分[じぶん]のために造[つく]ってはならない。」"
  24: "「あなたがたは、わたしのために土[つち]で祭壇[さいだん]を造[つく]り、その上[うえ]で、燔祭[はんさい]と救[すく]いの犠牲[ぎせい]であるあなたがたの羊[ひつじ]と雄牛[おうし]を献[ささ]げよ。わたしの名[な]を置[お]くどの場所[ばしょ]でも、わたしはあなたのところへ来[き]て、あなたを祝福[しゅくふく]する。」"
  25: "「もし、あなたがわたしのために石[いし]で祭壇[さいだん]を造[つく]るなら、切[き]り石[いし]で造[つく]ってはならない。あなたがそれに手[て]斧[おの]を当[あ]てると、その石[いし]は汚[けが]れるからである。」"
  26: "「また、あなたは階段[かいだん]を上[のぼ]って、わたしの祭壇[さいだん]に上[のぼ]ってはならない。その上[うえ]であなたの恥[は]ずかしいところが露[あら]わにならないためである。」"

notes:
  1: "Καὶ ἐλάλησεν κύριος πάντας τοὺς λόγους τούτους λέγων — и изрек Господь все слова сии (в масоретском и Синодальном — «Бог»: евр. אֱלֹהִים; держимся греческого). δέκα λόγοι, «десять слов» (十戒), — выражение Исх 34:28; здесь LXX говорит просто «все слова сии»."
  2: "Ἐγώ εἰμι κύριος ὁ θεός σου — Я Господь, Бог твой (ἐγώ εἰμι — усиленное «Я есмь»). ὅστις ἐξήγαγόν σε — который вывел тебя (в LXX смешаны лица: ὅστις + 1 л.). ἐξ οἴκου δουλείας — из дома рабства (δουλεία)."
  3: "οὐκ ἔσονταί σοι θεοὶ ἕτεροι — да не будут тебе боги иные (ἕτερος — другой, иной). πλὴν ἐμοῦ — кроме Меня (πλήν + род.)."
  4: "εἴδωλον — 偶像 (изваяние, кумир). ὁμοίωμα — подобие, изображение. Три сферы: ἐν τῷ οὐρανῷ ἄνω — на небе вверху, ἐν τῇ γῇ κάτω — на земле внизу, ἐν τοῖς ὕδασιν ὑποκάτω τῆς γῆς — в водах под землёй."
  5: "οὐ προσκυνήσεις … οὐδὲ μὴ λατρεύσῃς — не поклонишься и не послужишь (προσκυνέω — поклоняться; λατρεύω — служить, совершать служение). θεὸς ζηλωτής — Бог ревнитель (ζηλωτής — ревнующий). ἀποδιδοὺς ἁμαρτίας πατέρων ἐπὶ τέκνα — воздающий грехи отцов детям (ἀποδίδωμι). ἕως τρίτης καὶ τετάρτης γενεᾶς — до третьего и четвёртого рода."
  6: "ποιῶν ἔλεος εἰς χιλιάδας — творящий милость в тысячи (родов). τοῖς ἀγαπῶσίν με — любящим Меня. φυλάσσουσιν τὰ προστάγματά μου — хранящим повеления Мои."
  7: "οὐ λήμψῃ τὸ ὄνομα κυρίου … ἐπὶ ματαίῳ — не возьмёшь имя Господа всуе (ἐπὶ ματαίῳ — «на пустое», напрасно; いたずらに). οὐ γὰρ μὴ καθαρίσῃ — не очистит, т. е. не оставит без наказания (двойное отрицание с μή)."
  8: "μνήσθητι τὴν ἡμέραν τῶν σαββάτων ἁγιάζειν αὐτήν — помни день суббот, чтобы святить его (ἁγιάζω — святить; инф. цели). σάββατα — мн. форма евр. שַׁבָּת."
  9: "ἓξ ἡμέρας ἐργᾷ — шесть дней работай (ἐργάζομαι, буд. в значении повеления). ποιήσεις πάντα τὰ ἔργα σου — сделаешь все дела твои."
  10: "σάββατα κυρίῳ τῷ θεῷ σου — суббота Господу Богу твоему. ὁ παῖς σου καὶ ἡ παιδίσκη σου — раб твой и рабыня твоя. τὸ ὑποζύγιόν σου — вьючное животное, осёл (ὑποζύγιον, букв. «подъяремное»). ὁ προσήλυτος ὁ παροικῶν ἐν σοί — пришелец, живущий у тебя."
  11: "ἐν ἓξ ἡμέραις ἐποίησεν κύριος τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν — в шесть дней создал Господь небо, землю и море (ср. Быт 1). κατέπαυσεν — почил (καταπαύω). διὰ τοῦτο εὐλόγησεν … καὶ ἡγίασεν — посему благословил и освятил."
  12: "τίμα τὸν πατέρα σου καὶ τὴν μητέρα — почитай отца твоего и мать (τιμάω). ἵνα εὖ σοι γένηται — чтобы благо тебе было. μακροχρόνιος γένῃ — долголетен будешь. ἐπὶ τῆς γῆς τῆς ἀγαθῆς — на земле благой."
  13: "οὐ μοιχεύσεις — не прелюбодействуй (μοιχεύω). У LXX порядок заповедей иной, чем в масоретском: 13 — прелюбодеяние, 14 — кража, 15 — убийство (в Синодальном 13 — «не убивай»). Держимся греческого."
  14: "οὐ κλέψεις — не кради (κλέπτω)."
  15: "οὐ φονεύσεις — не убивай (φονεύω)."
  16: "οὐ ψευδομαρτυρήσεις κατὰ τοῦ πλησίον σου μαρτυρίαν ψευδῆ — не засвидетельствуешь против ближнего твоего свидетельства ложного (ψευδομαρτυρέω; повтор «ложное» сохранён)."
  17: "οὐκ ἐπιθυμήσεις τὴν γυναῖκα … οὐκ ἐπιθυμήσεις τὴν οἰκίαν — не пожелай жену… не пожелай дом… (ἐπιθυμέω; у LXX сначала жена, потом дом — в масоретском наоборот). ἀγρός — поле. ὑποζύγιον — вьючное животное. ὅσα τῷ πλησίον σού ἐστιν — всё, что у ближнего твоего."
  18: "ἑώρα τὴν φωνήν — «видел голос» (еврейский оборот: видели громы; φωνή здесь — раскат, гром). τὰς λαμπάδας — светильники, т. е. молнии (λαμπάς). τὸ ὄρος τὸ καπνίζον — гора дымящаяся. ἔστησαν μακρόθεν — стали вдали."
  19: "Λάλησον σὺ ἡμῖν — говори ты нам. μὴ λαλείτω πρὸς ἡμᾶς ὁ θεός — да не говорит к нам Бог. μήποτε ἀποθάνωμεν — как бы нам не умереть."
  20: "Θαρσεῖτε — дерзайте, не бойтесь (θαρσέω). ἕνεκεν τοῦ πειράσαι ὑμᾶς — ради испытания вас. ὅπως ἂν γένηται ὁ φόβος αὐτοῦ ἐν ὑμῖν — чтобы страх Его был в вас. ἵνα μὴ ἁμαρτάνητε — чтобы не грешили."
  21: "εἱστήκει ὁ λαὸς μακρόθεν — народ стоял вдали (pluperf.). εἰς τὸν γνόφον — во мрак (γνόφος — густая тьма). οὗ ἦν ὁ θεός — где был Бог."
  22: "Τάδε ἐρεῖς τῷ οἴκῳ Ιακωβ καὶ ἀναγγελεῖς τοῖς υἱοῖς Ισραηλ — так скажи дому Иаковлеву и возвести сынам Израилевым (LXX дословно повторяет 19:3). Ὑμεῖς ἑωράκατε ὅτι ἐκ τοῦ οὐρανοῦ λελάληκα πρὸς ὑμᾶς — вы видели, что с неба говорил Я вам."
  23: "θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς — богов серебряных и богов золотых. οὐ ποιήσετε ὑμῖν αὐτοῖς — не сделайте себе самим (повтор повеления сохранён, как в греческом)."
  24: "θυσιαστήριον ἐκ γῆς — жертвенник из земли (γῆ — земля, прах). τὰ σωτήρια ὑμῶν — «спасительные ваши», т. е. мирные жертвы (σωτήριον; евр. שְׁלָמִים). ἐν παντὶ τόπῳ, οὗ ἐὰν ἐπονομάσω τὸ ὄνομά μου — на всяком месте, где Я назову имя Моё. ἥξω πρὸς σὲ καὶ εὐλογήσω σε — приду к тебе и благословлю тебя (ед. ч. после мн. ч. повелений — как в греческом)."
  25: "οὐκ οἰκοδομήσεις αὐτοὺς τμητούς — не сооружай их тесаными (τμητός — обтёсанный). ἐγχειρίδιον — тесло, резец (手斧). ἐπιβέβληκας ἐπ᾿ αὐτούς — наложил на них. μεμίανται — осквернились (μιαίνω)."
  26: "οὐκ ἀναβήσῃ ἐν ἀναβαθμίσιν — не взойдёшь по ступеням (ἀναβαθμός). ἀποκαλύψῃς τὴν ἀσχημοσύνην σου — не откроешь срамоты твоей (ἀσχημοσύνη — нагота, срам)."
