# jp-box, Псалтирь, псалом 125. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..6.
# Псалом 125: возвращение из плена как сон (1–3), молитва о новом возвращении (4),
# сеяние в слезах и жатва в радости (5–6).
# Красного и синего нет. Кавычки: слова народов в 2 — 「…」.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 捕われ人, 涙, 種をまく者, 束ねる者 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 125
draft: true

verses:
  1: "登[とう]上[じょう]の歌[うた]。主[しゅ]がシオンの捕[とら]われ人[びと]を連[つ]れ戻[もど]されたとき、わたしたちは慰[なぐさ]められた者[もの]のようだった。"
  2: "そのとき、わたしたちの口[くち]は喜[よろこ]びで満[み]ち、舌[した]は喜[よろこ]びの歌[うた]で満[み]ちた。そのとき、諸国[しょこく]の民[たみ]の間[あいだ]で人[ひと]々[びと]は言[い]った。「主[しゅ]は彼[かれ]らに大[おお]きなことをされた」と。"
  3: "主[しゅ]はわたしたちに大[おお]きなことをされた。わたしたちは喜[よろこ]びにあふれた。"
  4: "主[しゅ]よ、わたしたちの捕[とら]われ人[びと]を、南[みなみ]の地[ち]の流[なが]れのように連[つ]れ戻[もど]してください。"
  5: "涙[なみだ]のうちに種[たね]をまく者[もの]は、喜[よろこ]びのうちに刈[か]り入[い]れる。"
  6: "種[たね]を携[たずさ]えて泣[な]きながら行[ゆ]く者[もの]は、束[たば]を携[たずさ]えて喜[よろこ]びながら帰[かえ]って来[く]る。"

notes:
  1: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. Стих 0; в gr-lxx-byz и в ru-базе одинаково. В csl-ru отдельного стиха 0 нет — надписание влито в ст. 1. Ἐν τῷ ἐπιστρέψαι κύριον τὴν αἰχμαλωσίαν Σιων — 主がシオンの捕われ人を連れ戻されたとき (ἐπιστρέφω — «возвращать»; αἰχμαλωσία — «плен», собирательно «пленные», отсюда 捕われ人). ἐγενήθημεν ὡς παρακεκλημένοι — わたしたちは慰められた者のようだった (παρακαλέω — «утешать»; perfect-pass. причастие). LXX здесь передаёт евр. «как сновидцы», но по-гречески стоит «как утешенные», и церковное чтение (Елизаветинская «яко утешени», jp-joc «夢みるが如く») расходится; взято греческое чтение базы, евр. вариант отмечен в этом примечании."
  2: "τότε ἐπλήσθη χαρᾶς τὸ στόμα ἡμῶν — そのとき、わたしたちの口は喜びで満ち (πίμπλημι + gen. — «наполниться»; χαρά — 喜び). καὶ ἡ γλῶσσα ἡμῶν ἀγαλλιάσεως — 舌は喜びの歌で満ちた (ἀγαλλίασις — «ликование»; второй член параллелизма усилен 歌, чтобы не повторять одно слово дважды). τότε ἐροῦσιν ἐν τοῖς ἔθνεσιν — そのとき、諸国の民の間で人々は言った (ἔθνη — 諸国の民; ἐροῦσιν — «скажут», в церковном чтении прошедшее). Ἐμεγάλυνεν κύριος τοῦ ποιῆσαι μετ' αὐτῶν — 「主は彼らに大きなことをされた」 (μεγαλύνω — «величить»; τοῦ ποιῆσαι — инфинитив цели). Слова народов — 「…」."
  3: "ἐμεγάλυνεν κύριος τοῦ ποιῆσαι μεθ' ἡμῶν — 主はわたしたちに大きなことをされた (повтор формулы ст. 2, но с ἡμῶν: народы говорят «с ними», мы — «с нами»). ἐγενήθημεν εὐφραινόμενοι — わたしたちは喜びにあふれた (εὐφραίνομαι — «веселиться», причастие при γίνομαι — «стали радующимися»)."
  4: "ἐπίστρεψον, κύριε, τὴν αἰχμαλωσίαν ἡμῶν — 主よ、わたしたちの捕われ人を…連れ戻してください (тот же глагол, что в ст. 1; императив). ὡς χειμάρρους ἐν τῷ νότῳ — 南の地の流れのように (χείμαρρους — «поток»; νότος — «юг», т. е. пустыня Негев, где сухие русла наполняются водой)."
  5: "οἱ σπείροντες ἐν δάκρυσιν — 涙のうちに種をまく者 (σπείρω — «сеять»; δάκρυον — 涙). ἐν ἀγαλλιάσει θεριοῦσιν — 喜びのうちに刈り入れる (θερίζω — «жать»; та же пара 種/刈り入れ, что в ст. 6, повтор сохранён)."
  6: "πορευόμενοι ἐπορεύοντο καὶ ἔκλαιον — 泣きながら行く者 (πορεύομαι — «идти»; ἔκλαιον — «плакали»; евр. усилительная конструкция «шли и плакали» передана деепричастием). αἴροντες τὰ σπέρματα αὐτῶν — 種を携えて (αἴρω — «нести, поднимать»; σπέρμα — 種). ἐρχόμενοι δὲ ἥξουσιν ἐν ἀγαλλιάσει — 喜びながら帰って来る (ἥκω — «приходить»). αἴροντες τὰ δράγματα αὐτῶν — 束を携えて (δράγμα — «сноп», отсюда 束; ср. 128:7, где тот же образ)."
