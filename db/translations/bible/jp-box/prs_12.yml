# jp-box, Премудрость Соломона, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 12: милосердие Бога к хананеям (1–11), уроки суда и идолопоклонства (12–27).
# Прямая речь одна: риторический вопрос «что Ты сделал?» в 12:12 — 「…」; вложенной нет.
# Нумерация по gr: 27 стихов. У csl 28: csl 12:27 вбирает первую половину гр. 12:27,
# а csl 12:28 — вторую («Бога истиннаго познаша: темже и конец осуждения прииде на ня»);
# содержание csl 12:28 влито в наш 12:27, отдельного стиха не добавлено.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

