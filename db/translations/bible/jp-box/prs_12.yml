verses:
  1: "あなたの不滅[ふめつ]の霊[れい]は、すべてのもののうちにあるからである。"
  2: "それゆえ、あなたはつまずき倒[たお]れる者[もの]たちを少[すこ]しずつ戒[いまし]め、彼らが罪[つみ]を犯[おか]すそのことにおいて思[おも]い起[おこ]させて教[おし]え導[みちび]かれる。それは、彼らが悪[あく]から離[はな]れて、あなたを信[しん]じるようになるためである、主[しゅ]よ。"
  3: "あなたは、あなたの聖[せい]なる地[ち]の昔[むかし]の住[す]み手[びと]を、"
  4: "憎[にく]むべきことを行[おこな]っていたゆえに憎[にく]まれた。すなわち、魔術[まじゅつ]のわざと、不敬[ふけい]な儀式[ぎしき]と、"
  5: "子[こ]を無[む]慈悲[じひ]に殺[ころ]すこと、人[ひと]の肉[にく]と血[ち]の内臓[ないぞう]を食[た]べる宴[うたげ]、秘儀[ひぎ]の群[む]れのただ中[なか]にいる信者[しんじゃ]たちを、"
  6: "また、助[たす]けのない魂[たましい]の親[おや]たち自身[じしん]が殺[ころ]し手[て]であった者[もの]たちを、あなたはわたしたちの父[ちち]たちの手によって滅[ほろ]ぼすことを望[のぞ]まれた。"
  7: "それは、あなたのもとで何[なに]より尊[とうと]い地[ち]が、神[かみ]の子[こ]らにふさわしい居住[きょじゅう]を受[う]け入[い]れるためであった。"
  8: "しかし、あなたはこの者[もの]たちをも人間[にんげん]として惜[お]しみ、あなたの軍勢[ぐんぜい]の先駆[さきが]けとして蜂[はち]を送[おく]られた。彼らがこれらの者を少[すこ]しずつ滅[ほろ]ぼすためであった。"
  9: "あなたは、戦[いくさ]の陣[じん]において不敬虔[ふけいけん]な者[もの]たちを正[ただ]しい者たちに服従[ふくじゅう]させることも、恐[おそ]ろしい獣[けもの]たちに渡[わた]すことも、厳[きび]しい一言[ひとこと]で彼らを一[いち]度[ど]に滅ぼすことも、できないことではなかった。"
  10: "しかし、あなたは少[すこ]しずつ裁[さば]きながら、悔[く]い改[あらた]めの余地[よち]を与[あた]えられた。彼らの生[う]まれつきが悪[あく]であり、その悪が生来[せいらい]のものであり、彼らの思[おも]いが永遠[えいえん]に変[か]わらないことを、知[し]らないわけではなかったのである。"
  11: "彼らの子孫[しそん]は初[はじ]めから呪[のろ]われた者[もの]であった。また、あなたはだれかを恐[おそ]れて、彼らが罪[つみ]を犯[おか]したことを見逃[みのが]していたのではなかった。"
  12: "「あなたは何[なに]をしたのか」と言[い]う者[もの]が、だれかいるだろうか。だれがあなたの裁[さば]きに立[た]ち向[む]かうだろうか。滅[ほろ]びた諸国民[しょこくみん]について、すなわちあなたが造[つく]った者[もの]たちについて、だれがあなたを責[せ]めるだろうか。また、だれが不正[ふせい]な人間[にんげん]に対して、復讐[ふくしゅう]する者[もの]としてあなたの前に出[で]て来[く]るだろうか。"
  13: "あなたのほかに、すべてのものについて心[こころ]を配[くば]る神[かみ]はない。それは、あなたが不正[ふせい]に裁[さば]いたのではないことを示[しめ]すためである。"
  14: "また、王[おう]も暴君[ぼうくん]も、あなたが罰[ばつ]したことについて、あなたの顔[かお]をまともに見[み]ることはできない。"
  15: "あなたは正[ただ]しい方[かた]であり、すべてのものを正しく治[おさ]められる。罰[ばつ]を受[う]けるべきでない者[もの]を罪[つみ]に定[さだ]めることは、あなたの力[ちから]にふさわしくないとお考[かんが]えになる。"
  16: "あなたの強[つよ]さは正義[せいぎ]の始[はじ]まりである。そして、すべてのものを支配[しはい]することが、あなたにすべてのものを惜[お]しませる。"
  17: "あなたは、力[ちから]の完全[かんぜん]さについて信[しん]じられないとき、その強[つよ]さを示[しめ]される。また、それを知[し]っている者[もの]たちの大胆[だいたん]さを、明[あき]らかにしてとがめられる。"
  18: "しかし、あなたは強[つよ]さを支配[しはい]しながら、寛容[かんよう]さをもって裁[さば]き、多[おお]くの惜[お]しみをもってわたしたちを治[おさ]められる。あなたは、望[のぞ]むときにはいつでも、力[ちから]を振[ふ]るうことができるからである。"
  19: "あなたは、このようなわざによって、あなたの民[たみ]に、正[ただ]しい者[もの]は人間[にんげん]への愛[あい]を持[も]つべきであることを教[おし]えた。また、あなたの子[こ]らに、罪[つみ]に対して悔[く]い改[あらた]めを与[あた]えるという良[よ]い望[のぞ]みを抱[かか]かせた。"
  20: "もしあなたが、あなたの子[こ]らの敵[てき]、すなわち死[し]すべき者[もの]たちを、これほど大[おお]きな配慮[はいりょ]と寛容[かんよう]をもって罰[ばつ]し、彼らが悪[あく]から離[はな]れるための時[とき]と場所[ばしょ]をお与[あた]えになったのなら、"
  21: "あなたの子[こ]らを、どれほど細[こま]やかに裁[さば]かれたことか。あなたは彼らの父[ちち]たちに、良[よ]い約束[やくそく]の誓[ちか]いと契約[けいやく]をお与[あた]えになった。"
  22: "それゆえ、あなたはわたしたちを戒[いまし]めながら、わたしたちの敵[てき]を幾万倍[いくまんばい]にも打[う]たれる。それは、わたしたちが裁[さば]くときにはあなたの善[ぜん]を思[おも]い、裁[さば]かれるときにはあわれみを待[ま]ち望[のぞ]むためである。"
  23: "それゆえ、あなたは、愚[おろ]かさのうちに不正[ふせい]に生[い]きてきた者[もの]たちを、彼ら自身[じしん]の忌[い]むべきものによって苦[くる]しめられた。"
  24: "彼[かれ]らは迷[まよ]いの道[みち]をはるかにさまよい、愚[おろ]かな幼[おさな]子[ご]のように欺[あざむ]かれて、獣[けもの]の間[あいだ]でも卑[いや]しまれる恥[は]ずべきものさえ神[かみ]と見[み]なした。"
  25: "それゆえ、あなたは思慮[しりょ]のない幼[おさな]子[ご]たちに対するように、裁[さば]きを嘲[あざけ]りとして彼らに送[おく]られた。"
  26: "しかし、その罰[ばつ]の戯[たわむ]れによって戒[いまし]められなかった者[もの]たちは、神[かみ]にふさわしい裁[さば]きを味[あじ]わうことになる。"
  27: "彼[かれ]らは、自分[じぶん]たちが苦[くる]しみながらも不満[ふまん]に思[おも]っていたそのことにおいて、すなわち彼らが神々[かみがみ]と思っていた者[もの]たちのうちで罰[ばつ]を受けながら、目[め]の当[あ]たりに見[み]て、昔[むかし]は知[し]ることを拒[こば]んでいたまことの神[かみ]を知[し]った。それゆえ、断罪[だんざい]の終[お]わりが彼らの上[うえ]に来[き]たのである。"

notes:
  1: "τὸ ἄφθαρτόν σου πνεῦμα — «нетленный Твой дух» (ἄφθαρτος); ἐν πᾶσιν — «во всех» (вещах или людях). Слав. «Нетленный бо дух твой есть во всех»; стих служит основанием для 12:2."
  2: "παραπίπτοντας — «спотыкающихся, отпадающих» (παραπίπτω); κατ᾽ ὀλίγον — «понемногу»; ἐλέγχεις — «обличаешь»; ὑπομιμνῄσκων νουθετεῖς — «напоминая, вразумляешь»; ἀπαλλαγέντες τῆς κακίας — «освободившись от зла»; πιστεύσωσιν ἐπὶ σέ — «уверуют в Тебя»."
  3: "πάλαι οἰκήτορας — «древних обитателей» (πάλαι — давно); τῆς ἁγίας σου γῆς — «святой земли Твоей». Стих — дополнение к сказуемому μισήσας в 12:4, фраза продолжается."
  4: "μισήσας ἐπὶ τῷ ἔχθιστα πράσσειν — «возненавидев за то, что делали ненавистнейшее» (ἔχθιστος — превосходная степень от ἐχθρός); ἔργα φαρμακειῶν — «дела колдовства» (φαρμακεία); τελετὰς ἀνοσίους — «нечестивые обряды» (τελετή — посвящение, обряд)."
  5: "τέκνων φονὰς ἀνελεήμονας — «безжалостные убийства детей»; σπλαγχνοφάγον θοῖναν — «пир, поедающий внутренности» (σπλάγχνα, θοῖνα — пир); ἐκ μέσου μύστας θιάσου — «посвящённых из среды фиаса» (θίασος — вакхическая община, μύστης — посвящённый); тёмное место, оставлено буквально; слав. «кровопийцев от среды святыни твоея» — иное чтение."
  6: "αὐθέντας γονεῖς — «самих родителей-убийц» (αὐθέντης — убийца, совершитель); ψυχῶν ἀβοηθήτων — «душ беспомощных» (ἀβοήθητος); διὰ χειρῶν πατέρων ἡμῶν — «руками отцов наших» (Иисус Навин)."
  7: "ἀξίαν ἀποικίαν — «достойное поселение, колонию» (ἀποικία); θεοῦ παίδων — «чад Божиих»; ἡ παρὰ σοὶ πασῶν τιμιωτάτη γῆ — «земля, дражайшая из всех у Тебя» (τίμιος)."
  8: "ὡς ἀνθρώπων ἐφείσω — «пощадил как людей»; προδρόμους τοῦ στρατοπέδου σου σφῆκας — «ос, шершней — предтеч войска Твоего» (σφήξ — оса, шершень); κατὰ βραχὺ ἐξολεθρεύσωσιν — «мало-помалу истребили» (ἐξολεθρεύω)."
  9: "οὐκ ἀδυνατῶν — «не будучи не в силах»; ἐν παρατάξει — «в сражении, строю» (παράταξις); ὑποχειρίους δοῦναι — «отдать под руку, покорить»; λόγῳ ἀποτόμῳ — «словом строгим»; ὑφ᾽ ἓν ἐκτρῖψαι — «сокрушить разом» (ἐκτρίβω). Фраза связана с 12:10 («но…»)."
  10: "κρίνων κατὰ βραχύ — «судя понемногу»; ἐδίδους τόπον μετανοίας — «давал место покаянию»; οὐκ ἀγνοῶν — «не не зная» (литота); πονηρὰ ἡ γένεσις αὐτῶν — «зло их рождения, племени» (γένεσις); ἔμφυτος — «врождённая» (ἔμφυτος); οὐ μὴ ἀλλαγῇ — «не изменится» (усиленное отрицание)."
  11: "σπέρμα κατηραμένον — «семя проклятое» (καταράομαι); ἀπ᾽ ἀρχῆς — «от начала»; οὐδὲ εὐλαβούμενός τινα — «и не убоявшись никого» (εὐλαβέομαι); ἄδειαν ἐδίδους — «давал безнаказанность, позволение» (ἄδεια); ἐφ᾽ οἷς ἡμάρτανον — «за то, в чём согрешали»."
  12: "τίς ἐρεῖ — «кто скажет»; Τί ἐποίησας — «что Ты сделал?» — единственная прямая речь в главе, 「…」. ἀντιστήσεται τῷ κρίματί σου — «противостанет суду Твоему»; ἐγκαλέσει — «обвинит» (ἐγκαλέω); κατὰ ἐθνῶν ἀπολωλότων — «за погибшие народы»; εἰς κατάστασίν σοι ἐλεύσεται ἔκδικος — «выступит пред Тобой мстителем» (κατάστασις — положение, предстояние; ἔκδικος — мститель); слав. «в предстателство тебе приидет, отмститель»."
  13: "οὔτε γὰρ θεός ἐστιν πλὴν σοῦ — «ибо нет Бога кроме Тебя»; ᾧ μέλει περὶ πάντων — «Которому есть попечение обо всех» (μέλει — безлично); ἵνα δείξῃς — «чтобы показать»; οὐκ ἀδίκως ἔκρινας — «Ты судил не неправедно» (литота). У ru здесь сбой смысла («чтобы доказывать Тебе, что Ты несправедливо судил») — не источник."
  14: "ἀντοφθαλμῆσαι — «смотреть в глаза, противостоять» (ἀντοφθαλμέω); τύραννος — «тиран, властитель»; περὶ ὧν ἐκόλασας — «за тех, кого Ты наказал»."
  15: "δίκαιος ὢν δικαίως … διέπεις — «будучи праведен, праведно всем управляешь» (διέπω — управлять); τὸν μὴ ὀφείλοντα κολασθῆναι — «того, кто не должен быть наказан» (ὀφείλω — быть должным); ἀλλότριον … τῆς σῆς δυνάμεως — «чуждое силе Твоей» (ἀλλότριος)."
  16: "ἡ ἰσχύς σου δικαιοσύνης ἀρχή — «сила Твоя — начало правды»; τὸ πάντων σε δεσπόζειν — «владычество над всеми» (δεσπόζω); φείδεσθαι — «щадить»."
  17: "ἐνδείκνυσαι — «показываешь» (ἐνδείκνυμι); ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι — «когда не верят в совершенство силы» (τελειότης); ἐν τοῖς εἰδόσι — «в знающих, среди знающих»; θράσος — «дерзость»; ἐξελέγχεις — «обличаешь, изобличаешь» (ἐξελέγχω)."
  18: "δεσπόζων ἰσχύος — «владычествующий над силой»; ἐν ἐπιεικείᾳ — «в кротости, снисходительности» (ἐπιείκεια); μετὰ πολλῆς φειδοῦς — «с великим щадением» (φειδώ); διοικεῖς — «управляешь» (διοικέω); πάρεστίν σοι … τὸ δύνασθαι — «у Тебя есть возможность явить силу, когда хочешь»."
  19: "Ἐδίδαξας — «научил»; διὰ τῶν τοιούτων ἔργων — «через такие дела»; δεῖ τὸν δίκαιον εἶναι φιλάνθρωπον — «праведному должно быть человеколюбивым» (φιλάνθρωπος); εὐέλπιδας — «благонадежными» (εὐέλπις); διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν — «даёшь за грехи покаяние»."
  20: "ὀφειλομένους θανάτῳ — «повинных смерти» (ὀφείλω); ἐτιμωρήσω — «наказал» (τιμωρέω); μετὰ τοσαύτης προσοχῆς καὶ διέσεως — «с таким вниманием и щадением» (προσοχή — внимание; δίεσις — ослабление, послабление; слав. «внятием и щадением»); δοὺς χρόνους καὶ τόπον — «дав времена и место»."
  21: "μετὰ πόσης ἀκριβείας — «с каким тщанием» (ἀκρίβεια); ἔκρινας — «судил»; ὅρκους καὶ συνθήκας — «клятвы и заветы» (συνθήκη); ἀγαθῶν ὑποσχέσεων — «благих обещаний» (ὑπόσχεσις)."
  22: "παιδεύων — «наставляя, наказуя»; ἐν μυριότητι μαστιγοῖς — «в тысячекратности бичуешь» (μυριότης — десятитысячность; μαστιγόω); μεριμνῶμεν — «помышляем, заботимся» (μεριμνάω); κρινόμενοι — «будучи судимы»; προσδοκῶμεν ἔλεος — «ожидаем милости»."
  23: "ὅθεν — «откуда, посему»; τοὺς ἐν ἀφροσύνῃ ζωῆς βιώσαντας — «проживших жизнь в неразумии» (βιόω); ἀδίκως — «неправедно»; διὰ τῶν ἰδίων … βδελυγμάτων — «через собственные мерзости» (βδέλυγμα); ἐβασάνισας — «замучил»."
  24: "τῶν πλάνης ὁδῶν — «путей заблуждения» (πλάνη); μακρότερον ἐπλανήθησαν — «блуждали дальше»; θεοὺς ὑπολαμβάνοντες — «почитая за богов» (ὑπολαμβάνω); τὰ καὶ ἐν ζῴοις τῶν αἰσχρῶν ἄτιμα — «то, что и среди животных позорно и бесчестно»; νηπίων δίκην ἀφρόνων — «подобно неразумным младенцам»; ψευσθέντες — «обманувшись» (ψεύδομαι)."
  25: "ὡς παισὶν ἀλογίστοις — «как детям неразумным» (ἀλόγιστος); τὴν κρίσιν εἰς ἐμπαιγμὸν ἔπεμψας — «послал суд в поругание» (ἐμπαιγμός — насмешка)."
  26: "παιγνίοις ἐπιτιμήσεως — «игрушками обличения» (παίγνιον — игра, забава; ἐπιτίμησις — обличение, наказание); μὴ νουθετηθέντες — «не вразумлённые»; ἀξίαν θεοῦ κρίσιν — «суд, достойный Бога»; πειράσουσιν — «испытают» (πειράζω)."
  27: "ἐφ᾽ οἷς … ἐπὶ τούτοις — «в том… в этом»; ἠγανάκτουν — «негодовали» (ἀγανακτέω); οὓς ἐδόκουν θεούς — «тех, кого считали богами»; ἐν αὐτοῖς κολαζόμενοι — «наказываемые в них, в своих же богах»; ὃν πάλαι ἠρνοῦντο εἰδέναι — «Которого прежде отрекались знать» (ἀρνέομαι); θεὸν ἐπέγνωσαν ἀληθῆ — «познали Бога истинного»; τὸ τέρμα τῆς καταδίκης — «конец осуждения» (κατάδικη). Слав. 12:28 («Бога истиннаго познаша: темже и конец осуждения прииде на ня») — вторая половина этого стиха; влита сюда, стих не добавлен."
