# jp-box, Второе послание к Коринфянам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: письмо на сердцах (1–3), служение Нового Завета (4–11),
# покрывало Моисея и покрывало на сердцах (12–16), «Господь есть Дух» (17),
# «от славы в славу» (18). Покрывало (κάλυμμα) везде — 覆い, не сглажено.
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: расхождений с базой, требующих скобок, нет.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 3
draft: true

verses:
  1: "わたしたちは、また自分自身[じぶんじしん]を推薦[すいせん]し始[はじ]めているのだろうか。それとも、ある人[ひと]々[びと]のように、あなたがたへの、あるいはあなたがたからの推薦状[すいせんじょう]が必要[ひつよう]なのだろうか。"
  2: "あなたがたこそ、わたしたちの手紙[てがみ]である。それはわたしたちの心[こころ]に書[か]かれ、すべての人[ひと]に知[し]られ、読[よ]まれている。"
  3: "あなたがたは、わたしたちの務[つと]めによって記[しる]されたキリストの手紙[てがみ]であって、墨[すみ]ではなく生[い]ける神[かみ]の霊[れい]によって、石[いし]の板[いた]ではなく、肉[にく]の板[いた]、すなわち心[こころ]の板[いた]に書[か]かれた者[もの]であることが、明[あき]らかに示[しめ]されているのである。"
  4: "わたしたちは、キリストを通[とお]して、神[かみ]に対してこのような確信[かくしん]を抱[いだ]いている。"
  5: "わたしたちが何[なに]かを自分自身[じぶんじしん]から出[で]たものとして考[かんが]える能力[のうりょく]を、自分自身[じぶんじしん]に持[も]っているのではない。わたしたちの能力[のうりょく]は神[かみ]から出[で]ているのである。"
  6: "神[かみ]はわたしたちを、新[あたら]しい契約[けいやく]の務[つと]めに携[たずさ]わる者[もの]として十分[じゅうぶん]な者[もの]とされた。文字[もじ]の務[つと]めではなく、霊[れい]の務[つと]めである。文字[もじ]は殺[ころ]し、霊[れい]は生[い]かすからである。"
  7: "しかし、死[し]の務[つと]め、すなわち文字[もじ]によって石[いし]に刻[きざ]まれた務[つと]めが栄光[えいこう]のうちにあったために、イスラエルの子[こ]らが、モーセの顔[かお]の、過[す]ぎ去[さ]りゆく栄光[えいこう]のゆえに、その顔[かお]をじっと見[み]つめることができなかったのなら、"
  8: "霊[れい]の務[つと]めがなおさら栄光[えいこう]のうちにあることは、どうしてないと言[い]えようか。"
  9: "なぜなら、罪[つみ]を定[さだ]める務[つと]めに栄光[えいこう]があるのなら、義[ぎ]の務[つと]めは、なおさら栄光[えいこう]に満[み]ちあふれているからである。"
  10: "実際[じっさい]、かつて栄光[えいこう]を受[う]けたものも、この点[てん]では、はるかに勝[まさ]る栄光[えいこう]のゆえに、もはや栄光[えいこう]を受[う]けたとは言[い]えないのである。"
  11: "なぜなら、過[す]ぎ去[さ]りゆくものが栄光[えいこう]を通[とお]して与[あた]えられたのなら、長[なが]くとどまるものは、なおさら栄光[えいこう]のうちにあるからである。"
  12: "こういうわけで、わたしたちはこのような希望[きぼう]を持[も]ち、大[おお]いなる大胆[だいたん]さをもって語[かた]っているのである。"
  13: "わたしたちは、モーセが、イスラエルの子[こ]らに、過[す]ぎ去[さ]りゆくものの終[お]わりを見[み]つめさせないために、自分[じぶん]の顔[かお]に覆[おお]いを掛[か]けたのとは違[ちが]う。"
  14: "しかし、彼[かれ]らの思[おも]いは鈍[にぶ]くなったのである。なぜなら、今[いま]日[ひ]に至[いた]るまで、古[ふる]い契約[けいやく]を読[よ]むとき、その同[おな]じ覆[おお]いが掛[か]かったままで、取[と]り除[のぞ]かれていない。それはキリストにあって取[と]り除[のぞ]かれるからである。"
  15: "しかし、今[いま]日に至[いた]るまで、モーセが読[よ]まれるとき、覆[おお]いは彼[かれ]らの心[こころ]の上[うえ]に掛[か]かったままである。"
  16: "しかし、主[しゅ]に立[た]ち返[かえ]るとき、覆[おお]いは取[と]り除[のぞ]かれる。"
  17: "主[しゅ]は霊[れい]である。そして、主[しゅ]の霊[れい]のあるところには、自由[じゆう]がある。"
  18: "わたしたちは皆[みな]、覆[おお]いの取[と]り除[のぞ]かれた顔[かお]で、鏡[かがみ]に映[うつ]るように主[しゅ]の栄光[えいこう]を見[み]つめながら、同[おな]じ像[ぞう]へと変[か]えられて、栄光[えいこう]から栄光[えいこう]へと進[すす]んでいく。それは、主[しゅ]である霊[れい]によるのである。"

notes:
  1: "συνιστάνειν — 推薦する; συστατικαὶ ἐπιστολαί — 推薦状. Оба вопроса сохранены."
  2: "ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν — わたしたちの心に書かれ; γινωσκομένη καὶ ἀναγινωσκομένη — 知られ、読まれている."
  3: "διακονηθεῖσα ὑφ᾽ ἡμῶν — わたしたちの務めによって記された; πλαξὶν καρδίαις σαρκίναις — 肉の板、すなわち心の板."
  4: "πεποίθησις — 確信; πρὸς τὸν θεόν — 神に対して."
  5: "ἱκανότης — 能力; λογίσασθαι — 考える."
  6: "καινὴ διαθήκη — 新しい契約; γράμμα / πνεῦμα — 文字 / 霊; ζῳοποιεῖ — 生かす."
  7: "διακονία τοῦ θανάτου — 死の務め; ἐν γράμμασιν ἐντετυπωμένη λίθοις — 文字によって石に刻まれた; καταργουμένη — 過ぎ去りゆく."
  8: "πῶς οὐχὶ μᾶλλον — どうしてなおさら…ないと言えようか; риторический вопрос сохранён."
  9: "κατάκρισις — 罪を定めること; δικαιοσύνη — 義; περισσεύει — 満ちあふれる."
  10: "ἐν τούτῳ τῷ μέρει — この点では; ὑπερβάλλουσα δόξα — はるかに勝る栄光."
  11: "τὸ καταργούμενον / τὸ μένον — 過ぎ去りゆくもの / 長くとどまるもの."
  12: "παρρησία — 大胆さ; ἐλπίς — 希望."
  13: "κάλυμμα — 覆い; εἰς τὸ τέλος τοῦ καταργουμένου — 過ぎ去りゆくものの終わり."
  14: "ἐπωρώθη τὰ νοήματα — 思いは鈍くなった; τὸ αὐτὸ κάλυμμα — 同じ覆い; ἐν Χριστῷ καταργεῖται — キリストにあって取り除かれる."
  15: "ἡνίκα ἂν ἀναγινώσκηται Μωϋσῆς — モーセが読まれるとき; κάλυμμα ἐπὶ τὴν καρδίαν — 心の上の覆い."
  16: "ἐπιστρέψῃ πρὸς κύριον — 主に立ち返るとき; περιαιρεῖται — 取り除かれる."
  17: "ὁ κύριος τὸ πνεῦμά ἐστιν — 主は霊である; ἐλευθερία — 自由."
  18: "ἀνακεκαλυμμένῳ προσώπῳ — 覆いの取り除かれた顔で; κατοπτριζόμενοι — 鏡に映るように見つめ; ἀπὸ δόξης εἰς δόξαν — 栄光から栄光へ; εἰκών — 像."
