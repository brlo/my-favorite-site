verses:
  1: "子[こ]たちよ、主[しゅ]にあって自分[じぶん]の父[ちち]母[はは]に従[したが]いなさい。これが正[ただ]しいことだからである。"
  2: "「父[ちち]と母[はは]を敬[うやま]え」。これが、約束[やくそく]を伴[ともな]った第一[だいいち]の戒[いまし]めである。"
  3: "「それは、あなたが幸[しあわ]せになり、地上[ちじょう]で長[なが]生[い]きするためである。」"
  4: "父[ちち]たちよ、自分[じぶん]の子[こ]どもを怒[いか]らせてはならない。むしろ、主[しゅ]のしつけと教訓[きょうくん]によって彼[かれ]らを養[やしな]い育[そだ]てなさい。"
  5: "奴隷[どれい]たちよ、キリストに従[したが]うように、恐[おそ]れとおののきをもって、心[こころ]の誠実[せいじつ]さをもって、肉[にく]に属[ぞく]する自分[じぶん]の主人[しゅじん]たちに従[したが]いなさい。"
  6: "人[ひと]の目[め]にだけ見えるように仕[つか]える者[もの]、人[ひと]に喜[よろこ]ばれようとする者[もの]としてではなく、キリストの奴隷[どれい]として、心[こころ]から神[かみ]の御心[みこころ]を行[おこな]いなさい。"
  7: "人[ひと]にではなく、主[しゅ]に仕[つか]える心[こころ]で、喜[よろこ]んで仕[つか]えなさい。"
  8: "あなたがたが知[し]っているとおり、奴隷[どれい]であれ自由[じゆう]な者[もの]であれ、それぞれ善[よ]いことを行[おこな]えば、その善[ぜん]に対して主[しゅ]から報[むく]いを受[う]けるのである。"
  9: "主人[しゅじん]たちよ、同[おな]じように彼[かれ]らに対して行[おこな]い、脅[おど]しをやめなさい。天[てん]には、彼[かれ]らとあなたがたの主人[しゅじん]がおられ、その方[かた]には偏[かたよ]りがないことを知[し]っているからである。"
  10: "最後[さいご]に、〔兄弟[きょうだい]たち、〕主[しゅ]にあって、その力[ちから]の強[つよ]さによって強[つよ]くならびなさい。"
  11: "神[かみ]の武具[ぶぐ]をすべて身[み]に着[つ]けなさい。悪魔[あくま]の策略[さくりゃく]に立[た]ち向[む]かうことができるようになるためである。"
  12: "というのは、わたしたちの戦[たたか]いは血肉[けつにく]に対するものではなく、支配[しはい]たち、権威[けんい]たち、この世[よ]の闇[やみ]の支配者[しはいしゃ]たち、天[てん]にある悪[あく]の霊[れい]どもに対するものだからである。"
  13: "だから、神[かみ]の武具[ぶぐ]をすべて取[と]りなさい。悪[あ]しき日[ひ]に立[た]ち向[む]かい、すべてを成[な]し遂[と]げて、それでも立[た]っていることができるためである。"
  14: "だから、立[た]ちなさい。腰[こし]を真理[しんり]で帯[おび]に締[し]め、義[ぎ]の鎧[よろい]を着[き]て、"
  15: "足[あし]には、平和[へいわ]の福音[ふくいん]を告[つ]げる備[そな]えを履[は]いて、"
  16: "その上[うえ]に、悪[あく]しき者[もの]のすべての燃[も]え上[あ]がる矢[や]を消[け]すことができる信仰[しんこう]の盾[たて]を取[と]り、"
  17: "救[すく]いの兜[かぶと]をかぶり、御霊[みたま]の剣[つるぎ]、すなわち神[かみ]の言葉[ことば]を取りなさい。"
  18: "すべての祈[いの]りと願[ねが]いとをもって、いつも霊[れい]のうちに祈[いの]り、そのために目[め]を覚[さ]まして、すべての聖徒[せいと]たちのために絶[た]えず願[ねが]いなさい。"
  19: "また、わたしのためにも、わたしが口[くち]を開[ひら]くとき、福音[ふくいん]の奥義[おうぎ]を大胆[だいたん]に知[し]らせる言葉[ことば]が与[あた]えられるように、願[ねが]いなさい。"
  20: "わたしはこの福音[ふくいん]のために、鎖[くさり]につながれて使節[しせつ]を務[つと]めているのである。この福音[ふくいん]について、語[かた]るべきとおりに大胆[だいたん]に語[かた]れるよう、願[ねが]いなさい。"
  21: "さて、あなたがたも、わたしの状況[じょうきょう]、わたしが何[なに]をしているかを知[し]ることができるように、愛[あい]する兄弟[きょうだい]であり、主[しゅ]にあって忠実[ちゅうじつ]な奉仕者[ほうししゃ]であるティキコが、すべてのことをあなたがたに知[し]らせるであろう。"
  22: "わたしは、あなたがたがわたしたちのことを知[し]り、ティキコがあなたがたの心[こころ]を慰[なぐさ]めるために、彼[かれ]をあなたがたのところへ遣[つか]わしたのである。"
  23: "平和[へいわ]が、兄弟[きょうだい]たちに、また愛[あい]が、信仰[しんこう]とともに、神[かみ]である父[ちち]と主[しゅ]イエス・キリストからありますように。"
  24: "{恵[めぐ]み|恩寵[おんちょう]}が、朽[く]ちない愛[あい]をもってわたしたちの主[しゅ]イエス・キリストを愛[あい]するすべての者[もの]とともにありますように。"

notes:
  1: "τὰ τέκνα — 子たち. ἐν κυρίῳ — 主にあって. δίκαιον — 正しい."
  2: "Исх 20:12 — 「…」. ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ — 約束を伴った第一の戒め."
  3: "Продолжение Исх 20:12 — 「…」. εὖ σοι γένηται — あなたがよくあって. μακροχρόνιος ἐπὶ τῆς γῆς — 地上で長生き."
  4: "μὴ παροργίζετε — 怒らせてはならない. παιδεία καὶ νουθεσία — しつけと教訓. ἐκτρέφετε — 養い育てる."
  5: "κατὰ σάρκα κύριοι — 肉に属する主人. φόβος καὶ τρόμος — 恐れとおののき. ἁπλότης τῆς καρδίας — 心の誠実."
  6: "ὀφθαλμοδουλία — 人の目にだけ見える仕え方. ἀνθρωπάρεσκοι — 人に喜ばれようとする者. ἐκ ψυχῆς — 心から."
  7: "μετ᾽ εὐνοίας — 喜んで. ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις — 人にではなく、主に."
  8: "κομίσεται παρὰ κυρίου — 主から報いを受ける. εἴτε δοῦλος εἴτε ἐλεύθερος — 奴隷であれ自由な者であれ."
  9: "ἀνιέντες τὴν ἀπειλήν — 脅しをやめる. προσωπολημψία οὐκ ἔστιν παρ᾽ αὐτῷ — その方には偏りがない."
  10: "В базе нет ἀδελφοί μου; церковный текст (Елизаветинская «братие моя», слав. «братіе моя», jp-joc「我が兄弟よ」) читает с ним — 〔兄弟たち、〕. ἐνδυναμοῦσθε — 強くなる. κράτος τῆς ἰσχύος — 力の強さ."
  11: "πανοπλία τοῦ θεοῦ — 神の武具. μεθοδείαι τοῦ διαβόλου — 悪魔の策略."
  12: "πάλη — 戦い. αἷμα καὶ σάρξ — 血肉. ἀρχαί, ἐξουσίαι — 支配・権威. κοσμοκράτορες τοῦ σκότους τούτου — この世の闇の支配者. πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις — 天にある悪の霊 (ср. 1:3, 2:6)."
  13: "ἀναλάβετε — 取る. ἡμέρα πονηρά — 悪しき日. ἅπαντα κατεργασάμενοι στῆναι — すべてを成し遂げて立つ."
  14: "περιζωσάμενοι τὴν ὀσφύν — 腰を帯に締める. θώραξ τῆς δικαιοσύνης — 義の鎧."
  15: "ὑποδησάμενοι τοὺς πόδας — 足に履く. ἑτοιμασία τοῦ εὐαγγελίου τῆς εἰρήνης — 平和の福音の備え."
  16: "θυρεός — 盾. βέλη τοῦ πονηροῦ τὰ πεπυρωμένα — 悪しき者の燃え上がる矢. σβέσαι — 消す."
  17: "περικεφαλαία τοῦ σωτηρίου — 救いの兜. μάχαιρα τοῦ πνεύματος — 御霊の剣. ῥῆμα θεοῦ — 神の言葉."
  18: "διὰ πάσης προσευχῆς καὶ δεήσεως — すべての祈りと願い. ἀγρυπνοῦντες — 目を覚まして. ἐν πάσῃ προσκαρτερήσει — 絶えず続けること."
  19: "ἵνα μοι δοθῇ λόγος — 言葉が与えられる. ἐν ἀνοίξει τοῦ στόματός μου — 口を開くとき. παρρησία — 大胆."
  20: "πρεσβεύω ἐν ἁλύσει — 鎖につながれて使節を務める. ὡς δεῖ με λαλῆσαι — 語るべきとおりに."
  21: "Τυχικός — ティキコ (не ティヒク, как у jp-joc). πιστὸς διάκονος — 忠実な奉仕者. τὰ κατ᾽ ἐμέ — わたしの状況."
  22: "εἰς αὐτὸ τοῦτο — まさにそのために. παρακαλέσῃ τὰς καρδίας ὑμῶν — 心を慰める."
  23: "εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως — 平和と愛が信仰とともに. ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ — 神である父と主イエス・キリストから."
  24: "ἐν ἀφθαρσίᾳ — 朽ちない愛をもって (букв. «в нетлении»)."
