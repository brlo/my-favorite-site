# jp-box, Даниил, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 9 (совпадает, 27 стихов).
# Язык — современный 常体; молитва 9:4–19 — です・ます (как молитвы в корпусе:
# 1 Пар 17, Тов 3); 〔…〕 нет; сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX), формы — по корпусу (ダニエル, ダリウス,
# エレミヤ, ガブリエル, モーセ, シオン, エルサレム, イスラエル, ユダ).
#
# Содержание: 1–2 первый год Дария Мидянина, Даниил разумеет по книгам семьдесят
# лет Иеремии; 3–19 молитва-исповедание: пост, вретище и пепел, «Тебе, Господи,
# правда, нам же стыдение лица», «не на правды наши», «услыши, Господи, очисти»;
# 20–23 Гавриил приходит в час вечерней жертвы и возвещает о начале моления;
# 24–27 семьдесят седмин (ἑβδομάς передана 週[しゅう], см. notes): завершение
# греха, вечная правда, запечатание видения и пророка, помазание святых святых,
# «до Христа старейшины седмин седьмь и седмин
# шестьдесят две», «потребится помазание», «утвердит завет мнозем седмина едина»,
# «мерзость запустения». Ключевое место (24–27) переведено по слав., без сглаживания.
# Голоса: 1–3 рассказ; 4–19 молитва в 「…」 (до конца 19); 20–21 рассказ; 22–27
# слово Гавриила в 「…」 (вводка «彼は…言った» вне кавычек).
# Важное: в LXX-модуле 9:25 короче слав. (нет клаузы о седминах и о «стогнах
# и забралах»), а 9:27 пространнее; держим слав. как церковное чтение, всё
# отмечено в notes.
#
