verses:
  1: "メディアの一族[いちぞく]から出[で]たクセルクセスの子[こ]ダリウスが、カルデア人[じん]の王国[おうこく]の上[うえ]に王[おう]として立[た]った第一年[だいいちねん]、"
  2: "その治世[ちせい]の第一年[だいいちねん]、わたしダニエルは書物[しょもつ]によって年[とし]の数[かず]を悟[さと]った。すなわち、主[しゅ]の言葉[ことば]が預言者[よげんしゃ]エレミヤに臨[のぞ]んで、エルサレムの荒廃[こうはい]が終[お]わるまでに七十[ななじゅう]年[ねん]が満[み]ちると告[つ]げられた、その年数[としすう]である。"
  3: "わたしは顔[かお]を主[しゅ]である神[かみ]に向[む]け、断食[だんじき]と粗布[あらぬの]と灰[はい]をもって、祈[いの]りと願[ねが]いを求[もと]めようとした。"
  4: "わたしは主[しゅ]である神[かみ]に祈[いの]って告白[こくはく]し、言[い]った。「ああ、主[しゅ]よ。あなたは大[おお]いなる神[かみ]、強[つよ]い神[かみ]、恐[おそ]るべき神[かみ]であり、あなたを愛[あい]し、あなたの戒[いまし]めを守[まも]る者[もの]に契約[けいやく]と慈[いつく]しみを保[たも]たれる方[かた]です。"
  5: "わたしたちは罪[つみ]を犯[おか]し、不法[ふほう]を行[おこな]い、不敬[ふけい]を行[おこな]って背[そむ]き、あなたの戒[いまし]めとあなたの定[さだ]めから離[はな]れ去[さ]りました。"
  6: "また、あなたのしもべである預言者[よげんしゃ]たちが、あなたの名[な]によって、わたしたちの王[おう]たち、君[きみ]たち、父[ちち]たち、そして地[ち]のすべての民[たみ]に語[かた]ったことに、わたしたちは聞[き]き従[したが]いませんでした。"
  7: "主[しゅ]よ、正[ただ]しさはあなたにあります。しかし、わたしたちには顔[かお]の恥[はじ]があります。今日[きょう]この日[ひ]のように、ユダの人[ひと]にも、エルサレムに住[す]む者[もの]にも、近[ちか]い者[もの]も遠[とお]い者[もの]もすべてのイスラエルにも、あなたが彼[かれ]らを散[ち]らしたすべての国[くに]々[ぐに]で、あなたに背[そむ]いたその背[そむ]きのゆえに、恥[はじ]があります。"
  8: "主[しゅ]よ、正[ただ]しさはあなたにあり、恥[はじ]はわたしたちにあります。わたしたちの王[おう]たち、君[きみ]たち、父[ちち]たちにも。わたしたちがあなたに対して罪[つみ]を犯[おか]したからです。"
  9: "主[しゅ]であるわたしたちの神[かみ]には慈[いつく]しみと赦[ゆる]しがあります。わたしたちが主[しゅ]から離[はな]れたからです。"
  10: "わたしたちは、主[しゅ]であるわたしたちの神[かみ]の声[こえ]に聞[き]き従[したが]わず、あなたがしもべである預言者[よげんしゃ]たちの手[て]によってわたしたちの前[まえ]に置[お]かれたあなたの律法[りっぽう]に従[したが]って歩[あゆ]みませんでした。"
  11: "イスラエルはすべて、あなたの律法[りっぽう]を捨[す]てて、あなたの声[こえ]に聞[き]き従[したが]いませんでした。それゆえ、神[かみ]のしもべモーセの律法[りっぽう]に書[か]かれている呪[のろ]いと誓[ちか]いが、わたしたちの上[うえ]に降[ふ]りかかりました。わたしたちが神[かみ]に対して罪[つみ]を犯[おか]したからです。"
  12: "神[かみ]は、わたしたちについて、またわたしたちを裁[さば]いた裁[さば]き手[て]たちについて語[かた]られたご自身[じしん]の言葉[ことば]を成[な]し遂[と]げ、わたしたちに大[おお]きな災[わざわ]いを下[くだ]されました。天[てん]の下[した]に、エルサレムに起[お]こったようなことはなかったほどです。"
  13: "モーセの律法[りっぽう]に書[か]かれているとおり、このすべての災[わざわ]いがわたしたちに降[ふ]りかかりました。しかし、わたしたちは主[しゅ]であるわたしたちの神[かみ]の顔[かお]を求[もと]めて、自分[じぶん]の罪[つみ]から離[はな]れ、あなたの真理[しんり]を悟[さと]ろうともしませんでした。"
  14: "主[しゅ]であるわたしたちの神[かみ]は、この災[わざわ]いのために目[め]を覚[さ]まし、それをわたしたちに下[くだ]されました。主[しゅ]であるわたしたちの神[かみ]は、なさるすべてのことにおいて正[ただ]しく、わたしたちはその声[こえ]に聞[き]き従[したが]わなかったからです。"
  15: "主[しゅ]よ、わたしたちの神[かみ]よ。あなたは強[つよ]い手[て]をもってあなたの民[たみ]をエジプトの地[ち]から導[みちび]き出[だ]し、今日[きょう]に至[いた]るまで、ご自身[じしん]のために名[な]を造[つく]られました。わたしたちは罪[つみ]を犯[おか]し、不敬[ふけい]を行[おこな]いました。"
  16: "主[しゅ]よ、あなたのすべての憐[あわ]れみによって、あなたの怒[いか]りと憤[いきどお]りを、あなたの都[みやこ]エルサレム、あなたの聖[せい]なる山[やま]から遠[とお]ざけてください。わたしたちの罪[つみ]と父[ちち]たちの不法[ふほう]のゆえに、エルサレムとあなたの民[たみ]は、周[まわ]りのすべての者[もの]の嘲[あざけ]りとなっています。"
  17: "わたしたちの神[かみ]よ、しもべの祈[いの]りと願[ねが]いを聞[き]き、荒[あ]れ果[は]てたあなたの聖所[せいしょ]に、あなたの顔[かお]を向[む]けてください。主[しゅ]よ、あなたご自身[じしん]のゆえに。"
  18: "わたしの神[かみ]よ、耳[みみ]を傾[かたむ]けて聞[き]き、目[め]を開[ひら]いて、わたしたちの荒廃[こうはい]と、あなたの名[な]が呼[よ]ばれているあなたの都[みやこ]をご覧[らん]ください。わたしたちがあなたの前[まえ]に祈[いの]りをささげるのは、自分[じぶん]の正[ただ]しさによるのではなく、あなたの大[おお]いなる憐[あわ]れみによるのです。"
  19: "主[しゅ]よ、聞[き]いてください。主[しゅ]よ、赦[ゆる]してください。主[しゅ]よ、耳[みみ]を傾[かたむ]けて、行[おこな]ってください。あなたご自身[じしん]のゆえに遅[おく]れないでください、わたしの神[かみ]よ。あなたの都[みやこ]シオンの上[うえ]に、あなたの民[たみ]イスラエルの上[うえ]に、あなたの名[な]が呼[よ]ばれているからです。」"
  20: "わたしがまだ語[かた]り、祈[いの]って、自分[じぶん]の罪[つみ]とわたしの民[たみ]イスラエルの罪[つみ]を告白[こくはく]し、わたしの神[かみ]の聖[せい]なる山[やま]のために、主[しゅ]であるわたしの神[かみ]の前[まえ]に願[ねが]いをささげているとき、"
  21: "すなわち、わたしがまだ祈[いの]りの中[なか]で語[かた]っているとき、先[さき]に幻[まぼろし]の中[なか]で見[み]たあの人[ひと]、ガブリエルが、夕[ゆう]べの犠牲[ぎせい]の時[とき]ごろ、速[はや]く飛[と]んできて、わたしに触[ふ]れた。"
  22: "彼はわたしを悟[さと]らせ、わたしに語[かた]って言[い]った。「ダニエル、今[いま]、あなたに悟[さと]りを与[あた]えるために出[で]てきた。"
  23: "あなたの願[ねが]いの初[はじ]めに、御言葉[みことば]が出[で]た。わたしはそれをあなたに告[つ]げるために来[き]た。あなたは望[のぞ]みの人[ひと]だからである。この言葉[ことば]を思[おも]い、この幻[まぼろし]を悟[さと]りなさい。"
  24: "あなたの民[たみ]とあなたの聖[せい]なる都[みやこ]のために、七十[ななじゅう]週[しゅう]が定[さだ]められた。それは、背[そむ]きが終[お]わり、罪[つみ]が尽[つ]き、罪[つみ]が封[ふう]じられ、不法[ふほう]が消[け]し去[さ]られ、不敬[ふけい]が清[きよ]められ、永遠[えいえん]の正[ただ]しさがもたらされ、幻[まぼろし]と預言者[よげんしゃ]が封[ふう]じられ、聖[せい]なる者[もの]の聖[せい]なる所[ところ]に油[あぶら]が注[そそ]がれるためである。"
  25: "あなたは知[し]り、悟[さと]り、喜[よろこ]ぶであろう。エルサレムを再[ふたた]び建[た]てるという言葉[ことば]が出[で]てから、キリストである君[きみ]までに、七[なな]週[しゅう]と六十二[ろくじゅうに]週[しゅう]がある。そして、それは再[ふたた]び建[た]てられ、通[とお]りと城壁[じょうへき]も備[そな]わる。しかし、その年[とし]々[どし]は尽[つ]き果[は]てる。"
  26: "その六十二[ろくじゅうに]週[しゅう]の後[あと]、油[あぶら]を注[そそ]がれた者[もの]は断[た]たれ、もはやいなくなる。また、来[く]るべき君[きみ]とともに都[みやこ]と聖所[せいしょ]は破[やぶ]られ、その終[お]わりは洪水[こうずい]のように、怒[いか]りとともに来[く]る。戦[たたか]いは終[お]わりまで続[つづ]き、そこには定[さだ]められた滅[ほろ]びがある。"
  27: "彼は一[ひと]つの週[しゅう]の間[あいだ]、多[おお]くの者[もの]のために契約[けいやく]を強[つよ]くする。そして、その週[しゅう]の半[なか]ばで、犠牲[ぎせい]と灌祭[かんさい]が取[と]り去[さ]られ、聖所[せいしょ]には荒廃[こうはい]の憎[にく]むべきものが置[お]かれる。それは時[とき]の終[お]わりまで続[つづ]き、荒[あ]れ果[て]た所[ところ]に定[さだ]められた終[お]わりが下[くだ]される。」"

notes:
  1: "Ἔτους πρώτου ἐπὶ Δαρείου τοῦ Ξέρξου — «в первый год при Дарии, сыне Ксеркса» (Ξέρξης), クセルクセス; слав. «дариа сына ассуирова» — Ассуир (אחשורוש) и есть Ксеркс, имя передано по LXX, слав. форма отмечена; ἀπὸ τῆς γενεᾶς τῆς Μηδικῆς — «из рода Мидийского», メディアの一族[いちぞく]; οἳ ἐβασίλευσαν ἐπὶ τὴν βασιλείαν τῶν Χαλδαίων — «которые царствовали над царством Халдеев» (мн. ч.)."
  2: "διενοήθην ἐν ταῖς βίβλοις — «я уразумел по книгам» (βίβλος — книга, 書物[しょもつ]); τὸν ἀριθμὸν τῶν ἐτῶν — «число лет»; ὅτε ἐγένετο πρόσταγμα τῇ γῇ ἐπὶ Ιερεμιαν — «когда было повеление (слово) земле через Иеремию» (πρόσταγμα — повеление); слав. «слово Господне ко иеремии пророку» — 主[しゅ]の言葉[ことば]が…臨[のぞ]んで, держим слав.; ἐγεῖραι εἰς ἀναπλήρωσιν ὀνειδισμοῦ Ιερουσαλημ ἑβδομήκοντα ἔτη — «исполнить в опустошении Иерусалима семьдесят лет» (ὀνειδισμός — поношение, опустошение), エルサレムの荒廃[こうはい]が終[お]わるまでに七十[ななじゅう]年[ねん]."
  3: "ἔδωκα τὸ πρόσωπόν μου ἐπὶ κύριον — «обратил лицо моё к Господу» (букв. «дал лицо»); εὑρεῖν προσευχὴν καὶ ἔλεος — «найти молитву и милость» (εὑρίσκω — находить), 祈[いの]りと願[ねが]い; ἐν νηστείαις καὶ σάκκῳ καὶ σποδῷ — «в постах, вретище и пепле» (σάκκος — 粗布[あらぬの], σποδός — пепел, 灰[はい])."
  4: "ὁ θεὸς ὁ μέγας καὶ ὁ ἰσχυρὸς καὶ ὁ φοβερός — «Бог великий, сильный и страшный»; слав. «Боже великий и чудный» — два определения (по МТ); держим LXX с тремя, расхождение отмечено. τηρῶν τὴν διαθήκην καὶ τὸ ἔλεος — «хранящий завет и милость» (τηρέω — хранить); τοῖς ἀγαπῶσί σε καὶ τοῖς φυλάσσουσι τὰ προστάγματά σου — «любящим Тебя и хранящим повеления Твои» (πρόσταγμα — 戒[いまし]め). Начало молитвы: речь — 「…」 до конца 19, регистр です・ます, как в молитвах корпуса."
  5: "ἡμάρτομεν, ἠδικήσαμεν, ἠσεβήσαμεν — «согрешили, беззаконили, нечествовали»; слав. «согрешихом, беззаконновахом, нечествовахом»; ἀπέστημεν — «отступили»; παρέβημεν — «преступили» (παραβαίνω); τὰ κρίματά σου — «суды Твои», 定[さだ]め."
  6: "τῶν παίδων σου τῶν προφητῶν — «рабов Твоих пророков» (παῖς — раб, отрок), しもべ; ἃ ἐλάλησαν ἐπὶ τῷ ὀνόματί σου — «что говорили именем Твоим»; ἐπὶ τοὺς βασιλεῖς ἡμῶν καὶ δυνάστας ἡμῶν — «царям нашим и владыкам нашим» (δυνάστης), 君[きみ]たち; παντὶ ἔθνει ἐπὶ τῆς γῆς — «всему народу на земле»."
  7: "σοί, κύριε, ἡ δικαιοσύνη — «Тебе, Господи, правда»; ἡμῖν ἡ αἰσχύνη τοῦ προσώπου — «нам стыд лица» (αἰσχύνη — стыд), 顔[かお]の恥[はじ]; κατὰ τὴν ἡμέραν ταύτην — «по дню сему», т. е. как и сегодня; ἀνθρώποις Ιουδα — «людям Иуды»; τοῖς ἔγγιστα καὶ τοῖς ἀπωτέρω — «ближним и дальним»; εἰς ἃς διεσκόρπισας αὐτοὺς ἐκεῖ — «куда рассеял их там» (διασκορπίζω); ἐν τῇ πλημμελείᾳ, ᾗ ἐπλημμέλησαν — «в преступлении, которым преступили» (πλημμέλεια), 背[そむ]き."
  8: "δέσποτα — «Владыко» (δέσποτης); в LXX стих начинается только этим обращением; слав. повторяет «Тебе, Господи, есть правда» — внесено (正[ただ]しさはあなたにあり), отмечено; ἡμῖν … καὶ τοῖς βασιλεῦσιν ἡμῶν καὶ δυνάσταις καὶ τοῖς πατράσιν ἡμῶν — «нам, и царям нашим, и владыкам, и отцам нашим»; ὅτι ἡμάρτομέν σοι — «ибо согрешили Тебе»."
  9: "τῷ κυρίῳ ἡ δικαιοσύνη καὶ τὸ ἔλεος — «Господу правда и милость»; слав. «Господу же Богу нашему щедроты и очищения» — 慈[いつく]しみと赦[ゆる]し (очищение — очищение, прощение), иное чтение, держим слав.; ὅτι ἀπέστημεν ἀπὸ σοῦ — «ибо отступили от Тебя»."
  10: "οὐκ ἠκούσαμεν τῆς φωνῆς κυρίου — «не послушали гласа Господа»; κατακολουθῆσαι τῷ νόμῳ σου — «следовать закону Твоему» (κατακολουθέω), 従[したが]って歩[あゆ]む; ᾧ ἔδωκας ἐνώπιον Μωσῆ καὶ ἡμῶν — «который Ты дал пред Моисеем и нами» (тёмное); слав. «ихже даде пред лицем нашим рукою раб своих пророков» — Моисея нет, держим слав., расхождение отмечено; διὰ τῶν παίδων σου τῶν προφητῶν — «через рабов Твоих пророков»."
  11: "πᾶς Ισραηλ ἐγκατέλιπε τὸν νόμον σου — «весь Израиль оставил закон Твой» (ἐγκαταλείπω); ἀπέστησαν τοῦ μὴ ἀκοῦσαι — «отступили, чтобы не слушать»; ἐπῆλθεν ἐφ' ἡμᾶς ἡ κατάρα καὶ ὁ ὅρκος — «пришли на нас проклятие и клятва» (κατάρα — 呪[のろ]い, ὅρκος — 誓[ちか]い); ὁ γεγραμμένος ἐν τῷ νόμῳ Μωσῆ παιδὸς τοῦ θεοῦ — «написанные в законе Моисея, раба Божия»."
  12: "ἔστησεν ἡμῖν τὰ προστάγματα αὐτοῦ — «поставил (исполнил) нам повеления Свои» (ἵστημι — ставить, утверждать); ὅσα ἐλάλησεν ἐφ' ἡμᾶς καὶ ἐπὶ τοὺς κριτὰς ἡμῶν — «что изрёк на нас и на судей наших» (κριτής), 裁[さば]き手[て]たち; ἐπαγαγεῖν ἐφ' ἡμᾶς κακὰ μεγάλα — «навести на нас бедствия великие»; οἷα οὐκ ἐγενήθη ὑπὸ τὸν οὐρανόν — «каких не было под небом»."
  13: "κατὰ τὰ γεγραμμένα ἐν διαθήκῃ Μωσῆ — «по написанному в завете Моисея» (διαθήκη — завет); слав. «в законе моисеове» — モーセの律法[りっぽう], держим слав.; οὐκ ἐξεζητήσαμεν τὸ πρόσωπον κυρίου — «не взыскали лица Господа» (ἐκζητέω); ἀποστῆναι ἀπὸ τῶν ἁμαρτιῶν ἡμῶν — «отступить от грехов наших»; διανοηθῆναι τὴν δικαιοσύνην σου — «уразуметь правду Твою»; слав. «смыслити во всей истине твоей» — 真理[しんり], держим слав."
  14: "ἠγρύπνησε κύριος ἐπὶ τὰ κακά — «бодрствовал Господь над бедствием» (ἀγρυπνέω — бодрствовать), 目[め]を覚[さ]まし; καὶ ἐπήγαγεν ἐφ' ἡμᾶς — «и навёл его на нас»; ὅτι δίκαιος κύριος ὁ θεὸς ἡμῶν ἐπὶ πάντα, ὅσα ἂν ποιήσῃ — «ибо праведен Господь Бог наш во всём, что ни сделает»; слав. «убудися Господь Бог на злобу нашу»."
  15: "ὁ ἐξαγαγὼν τὸν λαόν σου ἐξ Αἰγύπτου τῷ βραχίονί σου τῷ ὑψηλῷ — «изведший народ Твой из Египта мышцею высокою» (βραχίων — мышца, рука); слав. «рукою крепкою» — 強[つよ]い手[て], держим слав.; ἐποίησας σεαυτῷ ὄνομα — «сделал Себе имя»; ἡμάρτομεν, ἠγνοήκαμεν — «согрешили, не познали»; слав. «согрешихом, беззаконновахом»."
  16: "κατὰ τὴν δικαιοσύνην σου — «по правде Твоей»; слав. «всем помилованием твоим» — すべての憐[あわ]れみ, иное чтение, держим слав.; ἀποστραφήτω ὁ θυμός σου καὶ ἡ ὀργή σου — «да отвратится ярость Твоя и гнев Твой» (θυμός — ярость, ὀργή — гнев); ἀπὸ τῆς πόλεώς σου Ιερουσαλημ ὄρους τοῦ ἁγίου σου — «от города Твоего Иерусалима, горы святой Твоей»; εἰς ὀνειδισμὸν ἐν πᾶσι τοῖς περικύκλῳ ἡμῶν — «в поношение у всех окрест нас», 嘲[あざけ]り."
  17: "ἐπάκουσον … τῆς προσευχῆς τοῦ παιδός σου — «услышь молитву раба Твоего»; ἐπὶ τὰς δεήσεις μου — «на моления мои» (δέησις — 願[ねが]い); ἐπιβλεψάτω τὸ πρόσωπόν σου ἐπὶ τὸ ὄρος τὸ ἅγιον — «да призрит лицо Твоё на гору святую» (ἐπιβλέπω); τὸ ἔρημον — «опустевшую», 荒[あ]れ果[は]てた; ἕνεκεν τῶν δούλων σου — «ради рабов Твоих»; слав. «тебе ради, Господи» — あなたご自身[じしん]のゆえに, держим слав., вариант LXX отмечен."
  18: "πρόσχες, κύριε, τὸ οὖς σου — «приклони, Господи, ухо Твоё» (προσέχω — внимать); ἄνοιξον τοὺς ὀφθαλμούς σου καὶ ἰδέ — «открой очи Твои и увидь»; τὴν ἐρήμωσιν ἡμῶν — «опустошение наше», 荒廃[こうはい]; ἐφ' ἧς ἐπεκλήθη τὸ ὄνομά σου — «на котором наречено имя Твоё» (ἐπικαλέω); οὐ γὰρ ἐπὶ ταῖς δικαιοσύναις ἡμῶν … δεόμεθα — «не на правды наши … мы просим»; ἀλλὰ διὰ τὸ σὸν ἔλεος — «но ради милости Твоей»; слав. добавляет «многия» (大[おお]いなる) — нет в LXX, внесено."
  19: "κύριε, σὺ ἱλάτευσον — «Господи, умилостивись» (ἱλατεύω); κύριε, ἐπάκουσον καὶ ποίησον — «Господи, услышь и сделай»; μὴ χρονίσῃς — «не замедли» (χρονίζω); ἕνεκα σεαυτοῦ — «ради Себя Самого»; ἐπεκλήθη ἐπὶ τὴν πόλιν σου Σιων καὶ ἐπὶ τὸν λαόν σου Ισραηλ — «наречено на городе Твоём Сионе и на народе Твоём Израиле»; слав. порядок иной (услышь, очисти, внемли) и «Сион» нет — держим слав. порядок, シオン внесён по LXX."
  20: "ἕως ἐγὼ ἐλάλουν προσευχόμενος — «пока я ещё говорил, молясь»; ἐξομολογούμενος τὰς ἁμαρτίας — «исповедуя грехи» (ἐξομολογέομαι), 告白[こくはく]; δεόμενος … ὑπὲρ τοῦ ὄρους τοῦ ἁγίου — «прося … о горе святой»; слав. «припадающу с молением моим», 願[ねが]いをささげている. Стих обрывается, продолжение — в 21."
  21: "ὁ ἀνήρ, ὃν εἶδον ἐν τῷ ὕπνῳ μου τὴν ἀρχήν — «муж, которого я видел в начале в сне моём» (τὴν ἀρχήν — вначале), 先[さき]に幻[まぼろし]の中[なか]で見[み]た; Γαβριηλ τάχει φερόμενος — «Гавриил, быстро несомый» (τάχος — скорость), 速[はや]く飛[と]んできて; προσήγγισέ μοι — «приблизился ко мне»; слав. «прикоснуся мне» — 触[ふ]れた, держим слав.; ἐν ὥρᾳ θυσίας ἑσπερινῆς — «в час жертвы вечерней», 夕[ゆう]べの犠牲[ぎせい]の時[とき]."
  22: "καὶ προσῆλθε καὶ ἐλάλησε μετ' ἐμοῦ — «и подошёл, и говорил со мною»; слав. добавляет «и вразуми мя» — 悟[さと]らせ, внесено; ἄρτι ἐξῆλθον ὑποδεῖξαί σοι διάνοιαν — «ныне вышел показать тебе разумение» (ὑποδείκνυμι — показывать), 悟[さと]りを与[あた]えるために出[で]てきた. С этих слов говорит Гавриил — 「…」 до конца 27."
  23: "ἐν ἀρχῇ τῆς δεήσεώς σου — «в начале моления твоего»; ἐξῆλθε πρόσταγμα παρὰ κυρίου — «вышло повеление от Господа»; слав. «изыде слово» — 御言葉[みことば], держим слав.; ὅτι ἐλεεινὸς εἶ — «ибо ты помилованный» (ἐλεεινός); слав. «яко муж желаний еси ты» — 望[のぞ]みの人[ひと] (по МТ), держим слав., вариант LXX отмечен; διανοήθητι τὸ πρόσταγμα — «уразумей повеление»; слав. «разумей во явлении» — この幻[まぼろし]を悟[さと]りなさい, держим слав."
  24: "ἑβδομήκοντα ἑβδομάδες ἐκρίθησαν — «семьдесят седмин определены (отрезаны)» (κρίνω — судить, определять); ἑβδομάς («седмина», семёрка, неделя) передана 週[しゅう], как в корпусе (七週, 三週間); слав. «сократишася» — 定[さだ]められた. συντελεσθῆναι τὴν ἁμαρτίαν — «чтобы завершился грех»; τὰς ἀδικίας σπανίσαι — «чтобы оскудели неправды» (σπανίζω — оскудевать); ἀπαλεῖψαι τὰς ἀδικίας — «изгладить неправды»; слав. даёт пять членов о грехе (обетшает согрешение, скончается грех, запечатаются греси, загладятся неправды, очистятся беззакония) — держим слав.; διανοηθῆναι τὸ ὅραμα — «уразуметь видение»; δοθῆναι δικαιοσύνην αἰώνιον — «дать правду вечную»; εὐφρᾶναι ἅγιον ἁγίων (тёмное, букв. «возвеселить святое святых») — в слав. «помажется святый святых», 油[あぶら]が注[そそ]がれる, держим слав.; «святый святых» может значить и Святое Святых, и Помазанника — двусмысленность сохранена (聖[せい]なる者[もの]の聖[せい]なる所[ところ])."
  25: "γνώσῃ καὶ διανοηθήσῃ καὶ εὐφρανθῇς — «узнаешь, уразумеешь и возрадуешься» (εὐφραίνομαι — радоваться); слав. «увеси и уразумееши» (без «возрадуешься») — 喜[よろこ]ぶ внесено по LXX; ἀπὸ ἐξόδου λόγου ἀποκριθῆναι — «от исхода слова ответить (повелеть)»; слав. «от исхода словесе, еже отвещати и еже соградити Иерусалим»; «даже до Христа старейшины седмин седмь и седмин шестьдесят две» — キリストである君[きみ]までに七[なな]週[しゅう]と六十二[ろくじゅうに]週[しゅう], в LXX-модуле этой клаузы нет (стих короче: обрывается на «οἰκοδομήσεις Ιερουσαλημ πόλιν κυρίῳ»), держим слав. — это ключевое место главы; στεγαναὶ καὶ τεῖχος — слав. «стогна и забрала», 通[とお]りと城壁[じょうへき]; καὶ ἐκθλίψουσιν οἱ καιροί — слав. «истощатся лета», 年[とし]々[どし]は尽[つ]き果[は]てる."
  26: "μετὰ ἑπτὰ καὶ ἑβδομήκοντα καὶ ἑξήκοντα δύο — в LXX-модуле тёмное «после семи и семидесяти и шестидесяти двух»; слав. «по седминах шестидесяти двух» — 六十二[ろくじゅうに]週[しゅう]の後[あと], держим слав.; ἀποσταθήσεται χρῖσμα καὶ οὐκ ἔσται — «отнимется помазание, и не будет» (χρῖσμα — помазание); слав. «потребится помазание, и суд не будет в нем» — 断[た]たれ、もはやいなくなる (слав. клауза о суде не переведена буквально, отмечено); βασιλεία ἐθνῶν φθερεῖ τὴν πόλιν καὶ τὸ ἅγιον μετὰ τοῦ χριστοῦ — «царство народов погубит город и святое с помазанником»; слав. «со старейшиною грядущим» — 来[く]るべき君[きみ]とともに, держим слав.; ἥξει ἡ συντέλεια αὐτοῦ μετ' ὀργῆς — «придёт конец его с гневом»; ἕως καιροῦ συντελείας ἀπὸ πολέμου πολεμηθήσεται — «до времени конца от войны будет воевать»; слав. «аки в потопе … до конца рати сокращенныя», 洪水[こうずい]のように, 戦[たたか]いは終[お]わりまで."
  27: "δυναστεύσει ἡ διαθήκη εἰς πολλούς — «возобладает завет для многих» (δυναστεύω — господствовать); слав. «утвердит завет мнозем седмина едина» — 一[ひと]つの週[しゅう]の間[あいだ]、多[おお]くの者[もの]のために契約[けいやく]を強[つよ]くする; ἐν τῷ τέλει τῆς ἑβδομάδος, слав. «в пол же седмины» — 週[しゅう]の半[なか]ば; ἀρθήσεται ἡ θυσία καὶ ἡ σπονδή — «отнимется жертва и возлияние» (σπονδή — 灌祭[かんさい]); ἐπὶ τὸ ἱερὸν βδέλυγμα τῶν ἐρημώσεων — «на святилище мерзость опустошения» (βδέλυγμα — 憎[にく]むべきもの, ἐρήμωσις — опустошение), 荒廃[こうはい]の憎[にく]むべきもの, как в 11:31 и 12:11 (и Мк 13:14); слав. «во святилищи», в ru «на крыле святилища» (МТ) — держим слав.; ἕως συντελείας … συντέλεια δοθήσεται ἐπὶ τὴν ἐρήμωσιν — «до конца … конец дан будет на опустошение». В LXX-модуле стих пространнее (повтор о седминах, «πάλιν ἐπιστρέψει καὶ ἀνοικοδομηθήσεται εἰς πλάτος καὶ μῆκος»); переведено по слав."
