verses:
  0: "指揮者[しきしゃ]に。「滅[ほろ]ぼすな」の調[しら]べで。ダビデの詩[うた]、碑[ひ]文[ぶん]として。"
  1: "あなたがたは、まことに義[ぎ]を語[かた]るのか。人[ひと]の子[こ]らよ、あなたがたは正[ただ]しく裁[さば]くのか。"
  2: "いいえ、あなたがたは心[こころ]のうちに不[ふ]法[ほう]を抱[いだ]き、その手[て]は地[ち]の上[うえ]で不[ふ]正[せい]を織[お]り成[な]す。"
  3: "悪[わる]い者[もの]は母[はは]の胎[たい]から遠[とお]ざかり、腹[はら]から迷[まよ]い出[で]て、偽[いつわ]りを語[かた]った。"
  4: "彼[かれ]らの毒[どく]は蛇[へび]のようで、耳[みみ]をふさぐ蝮[まむし]のようである。"
  5: "その蛇[へび]は、巧[たく]みな呪[じゅ]文[もん]を唱[とな]える者[もの]の声[こえ]を聞[き]かない。"
  6: "神[かみ]は彼[かれ]らの口[くち]のうちでその歯[は]を砕[くだ]き、主[しゅ]は獅子[しし]のあごを折[お]られた。"
  7: "彼[かれ]らは流[なが]れ去[さ]る水[みず]のように消[き]えうせる。神[かみ]は弓[ゆみ]を張[は]り、彼[かれ]らは弱[よわ]り果[は]てる。"
  8: "彼[かれ]らは溶[と]けた蝋[ろう]のように消[き]え失[う]せる。火[ひ]が降[ふ]りかかり、彼[かれ]らは太陽[たいよう]を見[み]ない。"
  9: "あなたがたのいばらが、まだとげにならないうちに、生[い]きたまま、怒[いか]りのうちに、あなたがたはのみ込[こ]まれる。"
  10: "正[ただ]しい者[もの]は、悪[わる]い者[もの]の報[むく]いを見[み]て喜[よろこ]ぶ。彼[かれ]は罪[つみ]人[びと]の血[ち]で自分[じぶん]の手[て]を洗[あら]う。"
  11: "人[ひと]は言[い]う。「まことに、正[ただ]しい者[もの]には実[み]がある。まことに、この地[ち]で彼[かれ]らを裁[さば]く神[かみ]がおられる」と。"

notes:
  0: "Εἰς τὸ τέλος· μὴ διαφθείρῃς· τῷ Δαυιδ εἰς στηλογραφίαν — 指揮者に。「滅ぼすな」の調べで。ダビデの詩、碑文として. μὴ διαφθείρῃς — название напева (евр. al-tashheth), как в Пс 56:0; στηλογραφία — 碑文."
  1: "Εἰ ἀληθῶς ἄρα δικαιοσύνην λαλεῖτε — まことに義を語るのか (ἀληθῶς — «поистине»; δικαιοσύνη — 義, как по всему корпусу). εὐθεῖα κρίνετε, οἱ υἱοὶ τῶν ἀνθρώπων — 人々の子らよ、正しく裁くのか (εὐθύς — «прямой, правый»)."
  2: "ἐν καρδίᾳ ἀνομίας ἐργάζεσθε ἐν τῇ γῇ — 心のうちに不法を抱き、地の上で (ἐργάζομαι — «делать, совершать»). ἀδικίαν αἱ χεῖρες ὑμῶν συμπλέκουσιν — その手は不正を織り成す (συμπλέκω — «сплетать»; слав. «неправду руки ваши сплетают»)."
  3: "ἀπηλλοτριώθησαν οἱ ἁμαρτωλοὶ ἀπὸ μήτρας — 悪い者は母の胎から遠ざかり (ἀπαλλοτριόω — «отчуждать»). ἐπλανήθησαν ἀπὸ γαστρός — 腹から迷い出て. ἐλάλησαν ψεύδη — 偽りを語った."
  4: "θυμὸς αὐτοῖς κατὰ τὴν ὁμοίωσιν τοῦ ὄφεως — 彼らの毒は蛇のようで (θυμός здесь — «яд», как евр. חֵמָה). ὡσεὶ ἀσπίδος κωφῆς καὶ βυούσης τὰ ὦτα αὐτῆς — 耳をふさぐ蝮のように (ἀσπίς — «аспид»; βύω — «затыкать»); ἀσπίς — 蝮[まむし], как в Мф 3:7 и по корпусу."
  5: "ἥτις οὐκ εἰσακούσεται φωνὴν ἐπᾳδόντων — 呪文を唱える者の声を聞かない (ἐπᾳδός — «заклинатель»). φαρμάκου τε φαρμακευομένου παρὰ σοφοῦ — 巧みな… (φάρμακον — «зелье, заклятие»; φαρμακεύω — «врачевать, заговаривать»; παρὰ σοφοῦ — «у мудрого», т. е. составленное мудрецом)."
  6: "ὁ θεὸς συνέτριψεν τοὺς ὀδόντας αὐτῶν ἐν τῷ στόματι αὐτῶν — 神は彼らの口のうちで歯を砕き (συντρίβω — «сокрушать»). τὰς μύλας τῶν λεόντων συνέθλασεν κύριος — 主は獅子のあごを折られた (μύλη — «коренные зубы, челюсть»; θλάω — «разбивать»). Подлежащее меняется: ὁ θεός, затем κύριος."
  7: "ἐξουδενωθήσονται ὡς ὕδωρ διαπορευόμενον — 流れ去る水のように消えうせる (ἐξουδενόω — «обращать в ничто»). ἐντενεῖ τὸ τόξον αὐτοῦ — 弓を張り (ἐντείνω — «натягивать»). ἕως οὗ ἀσθενήσουσιν — 彼らは弱り果てる."
  8: "ὡσεὶ κηρὸς ὁ τακεὶς ἀνταναιρεθήσονται — 溶けた蝋のように消え失せる (κηρός — «воск»; ἀνταναιρέω — «уничтожать»). ἐπέπεσε πῦρ, καὶ οὐκ εἶδον τὸν ἥλιον — 火が降りかかり、太陽を見ない."
  9: "πρὸ τοῦ συνιέναι τὰς ἀκάνθας ὑμῶν τὴν ῥάμνον — いばらが、まだとげにならないうちに (ἄκανθα — «терние»; ῥάμνος — «колючий куст»; место тёмное, у jp-joc иначе). ὡσεὶ ζῶντας ὡσεὶ ἐν ὀργῇ καταπίεται ὑμᾶς — 生きながら、怒りのうちにのみ込まれる (καταπίνω — «поглощать»)."
  10: "εὐφρανθήσεται δίκαιος, ὅταν ἴδῃ ἐκδίκησιν ἀσεβῶν — 正しい者は悪い者の報いを見て喜ぶ (ἐκδίκησις — «отмщение»). τὰς χεῖρας αὐτοῦ νίψεται ἐν τῷ αἵματι τοῦ ἁμαρτωλοῦ — 罪人の血で自分の手を洗う (νίπτω — «омывать»; в греч. χεῖρας — руки, не ноги)."
  11: "καὶ ἐρεῖ ἄνθρωπος — 人は言う. Εἰ ἄρα ἔστιν καρπὸς τῷ δικαίῳ — まことに、正しい者には実がある (καρπός — «плод, награда»). ἄρα ἐστὶν ὁ θεὸς κρίνων αὐτοὺς ἐν τῇ γῇ — この地で彼らを裁く神がおられる. Слова людей — 「」."
