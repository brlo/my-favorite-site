verses:
  1: "主[しゅ]よ、だれがわたしたちの告[つ]げたことを信[しん]じたのか。主[しゅ]の腕[うで]はだれに現[あらわ]されたのか。"
  2: "わたしたちは彼[かれ]の前[まえ]で、幼子[おさなご]のように、乾[かわ]いた地[ち]の根[ね]のように告[つ]げた。彼[かれ]には姿[すがた]も栄光[えいこう]もない。わたしたちは彼を見[み]たが、彼には姿も美[うつく]しさもなかった。"
  3: "彼[かれ]の姿[すがた]は辱[はずかし]められ、人[ひと]の子[こ]らすべてよりも衰[おとろ]えていた。彼は打[う]ち傷[きず]の中[なか]にある者[もの]、病[やまい]を耐[た]え忍[しの]ぶことを知[し]る者であった。彼の顔[かお]は背[そむ]けられ、彼は辱められ、顧[かえり]みられなかった。"
  4: "この方[かた]はわたしたちの罪[つみ]を負[お]い、わたしたちのために苦[くる]しむ。わたしたちは、この方が苦[くる]しみの中にあり、神[かみ]に打[う]たれ、打[う]ち傷[きず]を受け、虐[しいた]げられていると考[かんが]えた。"
  5: "しかし、彼[かれ]はわたしたちの罪[つみ]のゆえに傷[きず]つき、わたしたちの不法[ふほう]のゆえに弱[よわ]められた。わたしたちの平和[へいわ]のための懲[こ]らしめが彼の上[うえ]にあり、彼の打[う]ち傷[きず]によってわたしたちは癒[いや]された。"
  6: "わたしたちはみな、羊[ひつじ]のように迷[まよ]った。人[ひと]はそれぞれ自分[じぶん]の道[みち]に迷った。主[しゅ]は彼[かれ]をわたしたちの罪[つみ]に引[ひ]き渡[わた]された。"
  7: "彼[かれ]は虐[しいた]げられたため、口[くち]を開[ひら]かない。羊[ひつじ]が屠[ほふ]り場へ引[ひ]かれて行[い]くように、毛[け]を刈[か]る者[もの]の前[まえ]で黙[だま]っている子羊[こひつじ]のように、彼は口を開かない。"
  8: "彼[かれ]が卑[ひく]くされたとき、その裁[さば]きは取[と]り去[さ]られた。だれが彼の代[よ]を語[かた]り明[あ]かすのか。彼の命[いのち]は地[ち]から取[と]り去られ、わたしの民[たみ]の不法[ふほう]のために、彼は死[し]に引[ひ]き渡[わた]された。"
  9: "わたしは、彼の葬[ほうむ]りの代[か]わりに悪[わる]い者[もの]たちを、彼の死[し]の代わりに富[とみ]ある者[もの]たちを与[あた]える。彼は不法[ふほう]を行[おこな]わず、その口[くち]に偽[いつわ]りもなかったからである。"
  10: "主[しゅ]は、打[う]ち傷[きず]から彼[かれ]を清[きよ]めることを望[のぞ]まれる。あなたがたが罪[つみ]のために献[ささ]げ物[もの]をするなら、あなたがたの魂[たましい]は長[なが]く生[い]きる子孫[しそん]を見[み]る。主[しゅ]は取[と]り除[のぞ]こうと望[のぞ]まれる。"
  11: "主[しゅ]は御手[みて]をもって、彼[かれ]の魂[たましい]の病[やまい]を取[と]り除[のぞ]こうと望[のぞ]まれる。彼に光[ひかり]を示[しめ]し、悟[さと]りによって彼を形[かたち]づくり、多[おお]くの者[もの]によく仕[つか]える正[ただ]しい者[もの]を義[ぎ]とされる。彼[かれ]は彼らの罪[つみ]を負[お]う。"
  12: "それゆえ、彼[かれ]は多[おお]くの者[もの]を嗣業[しぎょう]として受[う]け、強[つよ]い者[もの]たちの分捕[ぶんど]り物[もの]を分[わ]け与[あた]える。彼の魂[たましい]が死[し]に引[ひ]き渡[わた]され、彼が不法[ふほう]な者[もの]たちの間[あいだ]に数[かぞ]えられたからである。彼は多[おお]くの者[もの]の罪[つみ]を負[お]い、彼らの罪のために引[ひ]き渡された。"

notes:
  1: "κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν — «Господи, кто поверил слуху нашему» (ἀκοή — «слух, весть»); цитируется в Ин 12:38 и Рим 10:16. ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη — «мышца Господня кому открылась» (ἀποκαλύπτω). Обращение «Господи» в начале песни сохранено."
  2: "ἀνηγγείλαμεν ἐναντίον αὐτοῦ ὡς παιδίον — «мы возвестили пред Ним как младенец» (ἀναγγέλλω; παιδίον — 幼子). LXX здесь резко расходится с МТ («взошёл, как росток»): держим греческий, вариант МТ/Синодального — только в этой заметке. ὡς ῥίζα ἐν γῇ διψώσῃ — «как корень в земле жаждущей». οὐκ ἔστιν εἶδος αὐτῷ οὐδὲ δόξα — «нет вида ему ни славы» (εἶδος — «вид, образ»); двойное отрицание вида (εἶδος … εἶδος) сохранено."
  3: "τὸ εἶδος αὐτοῦ ἄτιμον ἐκλεῖπον παρὰ πάντας ἀνθρώπους — «вид его бесчестен, умаляющийся пред всеми людьми» (ἐκλείπω); слав. «умален паче всех сынов человеческих» — добавка «сынов человеческих» внесена в текст по паритету (人の子ら), в LXX её нет. ἄνθρωπος ἐν πληγῇ ὤν — «человек в язве сущий» (πληγή — 打ち傷). ἀπέστραπται τὸ πρόσωπον αὐτοῦ — «отвратилось лицо его»: пассив LXX, в МТ «мы отвращали от Него лице» — держим LXX. ἠτιμάσθη καὶ οὐκ ἐλογίσθη — «обесчещен и не вменён» (ἀτιμάζω, λογίζομαι)."
  4: "οὗτος τὰς ἁμαρτίας ἡμῶν φέρει — «Он грехи наши несёт»; в МТ «наши немощи и болезни» — LXX иначе, держим греческий. περὶ ἡμῶν ὀδυνᾶται — «о нас болеет» (ὀδυνάω). ἐν πόνῳ καὶ ἐν πληγῇ καὶ ἐν κακώσει — «в труде, в язве и в озлоблении» (πόνος, πληγή, κάκωσις). Слав. добавляет «от Бога» («в язве от Бога») — добавка внесена в текст без 〔…〕 (神に打たれ), в LXX её нет."
  5: "ἐτραυματίσθη — «изъязвлен» (τραυματίζω); μεμαλάκισται — «ослаблен, измучен» (μαλακίζω). В gr-lxx-byz порядок: «за беззакония… за грехи», в слав. и у Свита наоборот — «язвен за грехи, мучен за беззакония»; по паритету взят порядок слав. (罪のゆえに傷つき、不法のゆえに弱められた). παιδεία εἰρήνης ἡμῶν ἐπ᾿ αὐτόν — «наказание мира нашего на Нём» (παιδεία; у Свита παιδία «дети» — иное чтение). τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν — «его раной мы исцелились» (μώλωψ); цитируется в 1 Пет 2:24."
  6: "πάντες ὡς πρόβατα ἐπλανήθημεν — «все, как овцы, заблудились» (πλανάω). ἄνθρωπος τῇ ὁδῷ αὐτοῦ ἐπλανήθη — «человек путём своим заблудился» (датив). κύριος παρέδωκεν αὐτὸν ταῖς ἁμαρτίαις ἡμῶν — «Господь предал его грехам нашим» (датив; слав. «грех ради наших»); в МТ «возложил на Него грехи всех нас» — держим LXX, датив сохранён."
  7: "διὰ τὸ κεκακῶσθαι — «за то, что был озлоблен» (κακόω); в Синодальном «страдал добровольно» — по МТ, не внесено. οὐκ ἀνοίγει τὸ στόμα — «не открывает уст»; повтор во второй половине стиха (οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ) сохранён. ὡς πρόβατον ἐπὶ σφαγήν — «как овца на заклание» (σφαγή); ἀμνός — «агнец»; κείρων — «стригущий» (κείρω)."
  8: "ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη — «в унижении его суд его взят» (ταπείνωσις, αἴρω). τὴν γενεὰν αὐτοῦ τίς διηγήσεται — «род его кто изъяснит» (διηγέομαι); цитируется в Деян 8:33. αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ — «берётся от земли жизнь его». ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου ἤχθη εἰς θάνατον — «за беззакония народа Моего предан на смерть» (ἄγω)."
  9: "καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ — «и дам лукавых вместо погребения его» (ἀντί — «вместо»); первое лицо (Господь) внутри исповеди сохранено, кавычки не разрывают текст (см. шапку). LXX резко расходится с МТ («назначали гроб со злодеями, но Он погребён у богатого») — держим греческий, вариант МТ только здесь. οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ — «и не нашлось лжи в устах его» (δόλος); цитируется в 1 Пет 2:22."
  10: "καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς — «и Господь хочет очистить его от язвы» (βούλομαι, καθαρίζω). ἐὰν δῶτε περὶ ἁμαρτίας — «если дадите за грех», т. е. жертву за грех (περὶ ἁμαρτίας — Lv 5:7); слав. «аще дастся о гресе». ἡ ψυχὴ ὑμῶν ὄψεται σπέρμα μακρόβιον — «душа ваша увидит семя долгоживущее» (μακρόβιος); у Свита ἡμῶν («наша»). Стих в модуле обрывается на καὶ βούλεται κύριος ἀφελεῖν («и хочет Господь отнять»), продолжение — в 53:11; обрыв сохранён, слав. восполняет его в начале 53:11 («и хощет Господь рукою своею отяти болезнь от души его»)."
  11: "ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ — «от труда души его» (πόνος; у Свита этот оборот стоит в конце 53:10). δεῖξαι αὐτῷ φῶς — «явить ему свет». πλάσαι τῇ συνέσει — «создать разумом» (πλάσσω, σύνεσις). δικαιῶσαι δίκαιον εὖ δουλεύοντα πολλοῖς — «оправдать праведного, хорошо служащего многим» (δικαιόω, δουλεύω). Слав. в начале стиха добавляет «И хощет Господь рукою своею» и «болезнь» — внесено в текст по паритету (御手をもって…病を), в gr-lxx-byz этого нет: так слав. восполняет обрыв 53:10."
  12: "διὰ τοῦτο αὐτὸς κληρονομήσει πολλούς — «потому он наследует многих» (κληρονομέω); в Синодальном «дам Ему часть между великими» — по МТ, не внесено. τῶν ἰσχυρῶν μεριεῖ σκῦλα — «крепких разделит добычу» (μερίζω, σκῦλον). ἐν τοῖς ἀνόμοις ἐλογίσθη — «к беззаконным причтён» (λογίζομαι); цитируется в Лк 22:37. διὰ τὰς ἁμαρτίας αὐτῶν παρεδόθη — «за грехи их предан» (у Свита ἀνομίας); в МТ «за преступников сделался ходатаем» — иное чтение, не внесено."
