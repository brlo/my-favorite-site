# jp-box, Исаия, глава 53. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 53 нет; jp-ni не использовался. Разночтения сверены по
# gr-lxx-swete (Свит) — в notes.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 53: четвёртая песнь Раба (52:13–53:12), продолжение предыдущей главы: 1–3
# исповедь — кто поверил, младенец и корень в жаждущей земле, нет вида; 4–6 Он несёт
# грехи, язва и мир, все как овцы; 7–9 агнец, суд и смерть, погребение и богатые;
# 10–12 воля Господня, свет и оправдание, «Он понёс грехи многих».
# Голоса: в LXX нет вводных формул, и голоса не размечены («мы» 1–6, «народ Мой»
# в 8, «Я дам» в 9, «Господь» в 3-м лице в 10–11). Поэтому, в отличие от 26:1–21
# и 52:13–15, вся глава дана без кавычек: это единая исповедь/пророчество, и смена
# лица (Он/мы/Я) сохранена как в греческом, без навязанных границ.
# Нумерация по gr: 12 стихов, как у csl и ru. Слав. 53:10 обрывает фразу на «и хощет
# Господь отъяти» и восполняет её в начале 53:11 («И хощет Господь рукою своею отяти
# болезнь от души его»); деление держим по gr, слав. добавка внесена в 53:11 по
# паритету. У Свита «ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ» стоит в конце 53:10.
# Паритет LXX и МТ: LXX расходится с МТ заметно (53:2 «как младенец», 53:9 «дам
# лукавых вместо погребения», 53:10–11, 53:12), переведено буквально с греческого
# и слав.; варианты МТ — только в notes, ни один стих не сглажен.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 幼子, 屠り場, 子羊 — понятны и есть в корпусе.
# Имена — транслитерация греческого (LXX).

