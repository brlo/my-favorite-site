# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: притчи о глупости и мудрости (1–15), о царе, лени и пире (16–20).
# Красного и синего нет: это не речь Христа. Речь Екклесиаста — от первого лица, без кавычек.
# 〔…〕: 10:19 — церковное «и елей» (слав.), которого в греч. нет (ἔλαιον в 10:19 — НЕТ,
# проверено bracket_check). Остальное — в notes.
# Сносок ⟨…⟩ нет: все слова понятны или уже в корпусе (銀, 香油).
