tr_code: jp-box
book: ekl
chapter: 10
draft: true

verses:
  1: "死[し]をもたらすハエは、香[かお]り高[たか]い油[あぶら]の調[ちょう]合[ごう]物[ぶつ]を腐[くさ]らせる。わずかな知恵[ちえ]は、大[おお]きな愚[おろ]かさの栄光[えいこう]よりも尊[とうと]い。"
  2: "知恵[ちえ]ある者[もの]の心[こころ]は彼[かれ]の右[みぎ]にあり、愚[おろ]かな者[もの]の心[こころ]は彼[かれ]の左[ひだり]にある。"
  3: "愚[おろ]かな者[もの]が道[みち]を行[ゆ]くときも、その心[こころ]は欠[か]け、彼[かれ]が考[かんが]えることはすべて愚[おろ]かさである。"
  4: "支配[しはい]する者[もの]の霊[れい]があなたの上[うえ]に上[のぼ]るなら、あなたの場所[ばしょ]を離[はな]れてはならない。癒[いや]しが大[おお]きな罪[つみ]を鎮[しず]めるからである。"
  5: "日[ひ]の下[もと]で見[み]た悪[わる]がある。支配[しはい]する者[もの]の顔[かお]から出[で]た、あたかも不本意[ふほんい]なもののようなものである。"
  6: "愚[おろ]かな者[もの]が大[おお]きな高[たか]みに置[お]かれ、富[とみ]ある者[もの]が低[ひく]い所[ところ]に座[すわ]る。"
  7: "わたしは、奴隷[どれい]たちが馬[うま]に乗[の]り、君[きみ]たちが奴隷[どれい]のように地[ち]を歩[ある]くのを見[み]た。"
  8: "穴[あな]を掘[ほ]る者[もの]は自[みずか]らその穴[あな]に落[お]ち、垣[かき]を壊[こわ]す者[もの]は蛇[へび]に噛[か]まれる。"
  9: "石[いし]を取[と]り除[のぞ]く者[もの]は石[いし]によって痛[いた]みを負[お]い、木[き]を割[わ]る者[もの]は木[き]によって危[あや]うくなる。"
  10: "鉄[てつ]が落[お]ちるなら、その者[もの]は顔色[かおいろ]を変[か]える。そして力[ちから]を強[つよ]める。勇[いさ]ましい者[もの]の益[えき]は知恵[ちえ]である。"
  11: "蛇[へび]がささやきなしに噛[か]みつくなら、呪文[じゅもん]を唱[とな]える者[もの]に益[えき]はない。"
  12: "知恵[ちえ]ある者[もの]の口[くち]の言葉[ことば]は{恵[めぐ]み|恩寵[おんちょう]}である。しかし愚[おろ]かな者[もの]の唇[くちびる]は、彼[かれ]自身[じしん]を沈[しず]める。"
  13: "その口[くち]の言葉[ことば]の始[はじ]めは愚[おろ]かさであり、その口[くち]の終[お]わりは悪[わる]い迷[まよ]いである。"
  14: "愚[おろ]かな者[もの]は言葉[ことば]を多[おお]くする。人[ひと]は、起[お]こったこと、また自分[じぶん]の後[あと]に起[お]こることを知[し]らない。誰[だれ]が彼[かれ]に告[つ]げるだろうか。"
  15: "愚[おろ]かな者[もの]たちの労苦[ろうく]は彼[かれ]らを疲[つか]れさせる。彼[かれ]は町[まち]へ行[ゆ]くことさえ知[し]らないからである。"
  16: "わざわいだ、あなたの王[おう]が若[わか]く、君[きみ]たちが朝[あさ]から食[た]べている町[まち]よ。"
  17: "幸[さいわ]いだ、あなたの王[おう]が自由[じゆう]な者[もの]の子[こ]であり、君[きみ]たちが時[とき]にかなって、力[ちから]をもって食[た]べ、恥[は]じない地[ち]よ。"
  18: "怠惰[たいだ]のうちに梁[はり]は低[ひく]くなり、手[て]の怠[なま]けのうちに家[いえ]は雨漏[あまも]りする。"
  19: "人々は笑[わら]いのためにパンを作[つく]り、ぶどう酒[さけ]と〔香油[こうゆ]〕は生[い]ける者[もの]を喜[よろこ]ばせ、すべては銀[ぎん]に従[したが]う。"
  20: "あなたの良心[りょうしん]のうちでも王[おう]を呪[のろ]ってはならない。寝室[しんしつ]の奥[おく]でも富[とみ]ある者[もの]を呪[のろ]ってはならない。空[そら]の鳥[とり]がその声[こえ]を運[はこ]び、翼[つばさ]のある者[もの]がその言葉[ことば]を告[つ]げるからである。"

notes:
  1: "Μυῖαι θανατοῦσαι — букв. «умерщвляющие мухи» (θανατόω — «умерщвлять»); слав. и Син. «мёртвые, умершие». σαπριοῦσιν σκευασίαν ἐλαίου ἡδύσματος — «сгноят состав благовонного масла». τίμιον ὀλίγον σοφίας ὑπὲρ δόξαν ἀφροσύνης μεγάλης — «драгоценна малость мудрости больше славы великой глупости»."
  2: "καρδία σοφοῦ εἰς δεξιὸν αὐτοῦ — «сердце мудрого — направо у него»; правая сторона — сторона мудрости, левая — глупости."
  3: "καρδία αὐτοῦ ὑστερήσει — «сердце его оскудеет». ἃ λογιεῖται πάντα ἀφροσύνη ἐστίν — «что ни замыслит, всё глупость». В Син. добавлено «всякому он выскажет, что он глуп» — масоретское чтение."
  4: "πνεῦμα τοῦ ἐξουσιάζοντος — букв. «дух властвующего», т.е. гнев начальника (Син. «гнев»). τόπον σου μὴ ἀφῇς — «места твоего не оставляй». ἴαμα καταπαύσει ἁμαρτίας μεγάλας — «исцеление успокоит великие грехи»; Син. «кротость покрывает» — по масоретскому."
  5: "ὡς ἀκούσιον — «как бы невольное, неумышленное» (Син. «как бы погрешность»). ὃ ἐξῆλθεν ἀπὸ προσώπου τοῦ ἐξουσιάζοντος — «которое вышло от лица властвующего»."
  6: "ἐδόθη ὁ ἄφρων ἐν ὕψεσι μεγάλοις — «дан глупый на великие высоты». πλούσιοι ἐν ταπεινῷ καθήσονται — «богатые сядут на низком»."
  7: "ἐφ᾽ ἵππους — «на конях». ἄρχοντας πορευομένους ὡς δούλους — «князей, идущих как рабы»."
  8: "ὁ ὀρύσσων βόθρον ἐν αὐτῷ ἐμπεσεῖται — «копающий яму упадёт в неё». καθαιροῦντα φραγμόν — «разрушающего ограду» (винительный в роли подлежащего придаточного). δήξεται — «укусит»."
  9: "ἐξαίρων λίθους διαπονηθήσεται ἐν αὐτοῖς — «поднимающий камни будет болеть от них». σχίζων ξύλα κινδυνεύσει ἐν αὐτοῖς — «раскалывающий дерево подвергнется опасности от них»."
  10: "ἐὰν ἐκπέσῃ τὸ σιδήριον — «если выпадет железо» (железная часть орудия). καὶ αὐτὸς πρόσωπον ἐτάραξεν — «и он смутил лицо», т.е. изменился в лице. δυνάμεις δυναμώσει — «укрепит силы». περισσεία τοῦ ἀνδρείου σοφία — тёмное место: «преимущество мужественного — мудрость» (слав. «изобилие мужу мудрость»); Син. по масоретскому «мудрость умеет это исправить»."
  11: "ἐὰν δάκῃ ὁ ὄφις ἐν οὐ ψιθυρισμῷ — «если укусит змей не в шёпоте», т.е. без заклинания. ἐπᾴδων — «заклинатель, поющий заговор». В Син. иначе (о злоязычном) — масоретское чтение."
  12: "λόγοι στόματος σοφοῦ χάρις — «слова уст мудрого — благодать». καταποντιοῦσιν αὐτόν — «потопят его самого»."
  13: "ἀρχὴ λόγων στόματος αὐτοῦ ἀφροσύνη — «начало слов уст его — глупость». ἐσχάτη... περιφέρεια πονηρά — «конец… злое блуждание, заблуждение» (слав. «прелесть лукава»)."
  14: "πληθύνει λόγους — «умножает слова». οὐκ ἔγνω... τί τὸ γενόμενον καὶ τί τὸ ἐσόμενον ὀπίσω αὐτοῦ — «не знает, что было и что будет после него»."
  15: "μόχθος τῶν ἀφρόνων κοπώσει αὐτούς — «труд глупых утомит их». ὃς οὐκ ἔγνω τοῦ πορευθῆναι εἰς πόλιν — «который не знает, как идти в город» (Син. «дороги в город»)."
  16: "οὐαί σοι, πόλις — «горе тебе, город» (в Син. «земля»; в LXX именно πόλις). νεώτερος — «моложе». ἐν πρωίᾳ ἐσθίουσιν — «с утра едят»."
  17: "μακαρία σύ, γῆ — «блаженна ты, земля» (в 16 — πόλις, здесь γῆ: LXX сам меняет слово). υἱὸς ἐλευθέρων — «сын свободных». πρὸς καιρὸν φάγονται ἐν δυνάμει — «вовремя едят в силе». Син. «для подкрепления, а не для пресыщения» — масоретское."
  18: "ἐν ὀκνηρίαις — «в лености». δόκωσις — «балка, потолок» (слав. «строп»). στάξει ἡ οἰκία — «протечёт дом»."
  19: "εἰς γέλωτα ποιοῦσιν ἄρτον — «для смеха делают хлеб». οἶνος εὐφραίνει ζῶντας — «вино веселит живых». τοῦ ἀργυρίου ἐπακούσεται σὺν τὰ πάντα — «серебру послушно всё» (σὺν — особенность LXX). В слав. добавлено «и елей» (〔香油〕), которого в греч. нет; «со смирением» в слав. не имеет соответствия в LXX и остаётся тёмным."
  20: "ἐν συνειδήσει σου — «в совести твоей». ταμιεῖα κοιτώνων — «хранилища спален», т.е. спальня. πετεινὸν τοῦ οὐρανοῦ ἀποίσει τὴν φωνήν — «птица небесная унесёт голос твой» (ἀποίσει — «унесёт»); ὁ ἔχων τὰς πτέρυγας — «имеющий крылья»."
