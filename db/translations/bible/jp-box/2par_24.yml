# jp-box, 2-я Паралипоменон, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Нумерация по gr: 27 стихов, совпадает с csl/ru.
# Глава 24: лета Иоаса (1), его благочестие при Иодае (2–3), ремонт храма и
# ящик для серебра (4–14), смерть Иодая (15–16), отступление после его смерти
# (17–19), убийство Захарии (20–22), нашествие сириян (23–24), заговор и смерть
# Иоаса (25–27).
# Паритет: слав. чтения внесены в основной текст без скобок (5 «поспешно
# сотворите»); варианты LXX и МТ — в notes.
# Речь — 「…」 (5, 6, 8, 20, 22). Красного нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 神殿, 祭壇, 大祭司, 燔祭, 幕屋 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2par
chapter: 24
draft: true

verses:
  1: "ヨアシュは王[おう]となったとき七歳[ななさい]であった。彼[かれ]はエルサレムで四十年[よんじゅうねん]治[おさ]めた。母[はは]の名[な]はサビヤといい、ベエル・シェバの出[で]であった。"
  2: "ヨアシュは、祭司[さいし]ヨヤダが生[い]きている間[あいだ]、ずっと主[しゅ]の前[まえ]に正[ただ]しいことを行[おこな]った。"
  3: "ヨヤダは彼[かれ]のために二人[ふたり]の妻[つま]を迎[むか]え、彼[かれ]は息子[むすこ]たちと娘[むすめ]たちをもうけた。"
  4: "その後[あと]、ヨアシュの心[こころ]に、主[しゅ]の家[いえ]を修復[しゅうふく]しようという思[おも]いが起[お]こった。"
  5: "彼[かれ]は祭司[さいし]たちとレビ人[びと]たちを集[あつ]めて言[い]った。「ユダの町々[まちまち]へ出[で]て行[い]き、イスラエル中[じゅう]から、主[しゅ]の家[いえ]を強[つよ]くするための銀[ぎん]を年[とし]ごとに集[あつ]めなさい。急[いそ]いで実行[じっこう]しなさい。」しかしレビ人[びと]たちは急[いそ]がなかった。"
  6: "王[おう]は首長[しゅちょう]ヨヤダを呼[よ]んで言[い]った。「なぜ、あなたはレビ人[びと]たちに、ユダとエルサレムから、神[かみ]の人[ひと]モーセがイスラエルを証[あかし]の幕屋[まくや]に集[あつ]めたときに定[さだ]めた税[みつぎ]を納[おさ]めさせないのか。」"
  7: "というのは、アタリヤは不法[ふほう]な女[おんな]であり、その子[こ]らは神[かみ]の家[いえ]を打[う]ち壊[こわ]したからである。彼[かれ]らは主[しゅ]の家[いえ]の聖[せい]なるものまでバアル神[がみ]たちに与[あた]えた。"
  8: "王[おう]は命[めい]じて言[い]った。「箱[はこ]を造[つく]らせ、主[しゅ]の家[いえ]の門[もん]の外[そと]に置[お]かせなさい。」"
  9: "そして、ユダとエルサレムに、神[かみ]のしもべモーセが荒野[こうや]でイスラエルについて語[かた]ったとおりに、主[しゅ]に捧[ささ]げ物[もの]を持[も]って来[く]るよう布告[ふこく]させた。"
  10: "首長[しゅちょう]たちと民[たみ]はすべて、持[も]って来[き]ては箱[はこ]に投[とう]じ入[い]れ、それが満[み]ちるまで続[つづ]けた。"
  11: "レビ人[びと]たちの手[て]で箱[はこ]が王[おう]の監督[かんとく]たちのもとへ運[はこ]ばれ、銀[ぎん]が多[おお]くなったのを見[み]るたびに、王[おう]の書記[しょき]と大祭司[だいさいし]の監督[かんとく]が来[き]て箱[はこ]を空[あ]け、元[もと]の場所[ばしょ]に戻[もど]した。このようにして彼[かれ]らは日[ひ]ごとに事[こと]を行[おこな]い、多[おお]くの銀[ぎん]を集[あつ]めた。"
  12: "王[おう]と祭司[さいし]ヨヤダはそれを、主[しゅ]の家[いえ]の工事[こうじ]をする者[もの]たちに渡[わた]した。彼[かれ]らは石切[いしき]りたちと大工[だいく]たちを雇[やと]って主[しゅ]の家[いえ]を修復[しゅうふく]させ、鉄[てつ]と青銅[せいどう]の鍛冶[かじ]たちを雇[やと]って主[しゅ]の家[いえ]を補強[ほきょう]させた。"
  13: "工事[こうじ]をする者[もの]たちは働[はたら]き、工事[こうじ]は彼[かれ]らの手[て]によって進[すす]んだ。彼[かれ]らは主[しゅ]の家[いえ]を元[もと]の状態[じょうたい]に戻[もど]し、これを強固[きょうこ]にした。"
  14: "工事[こうじ]が終[お]わると、彼[かれ]らは残[のこ]りの銀[ぎん]を王[おう]とヨヤダのもとへ持[も]って来[き]た。それで主[しゅ]の家[いえ]のための器[うつわ]、すなわち燔祭[はんさい]のための務[つと]めの器[うつわ]、金[きん]と銀[ぎん]の香炉[こうろ]が造[つく]られた。そしてヨヤダのすべての日[ひ]の間[あいだ]、主[しゅ]の家[いえ]で絶[た]え間[ま]なく燔祭[はんさい]がささげられた。"
  15: "ヨヤダは老[お]いて、長[なが]い生涯[しょうがい]を終[お]えて死[し]んだ。彼[かれ]は死[し]ぬとき百三十歳[ひゃくさんじゅうさい]であった。"
  16: "人々[ひとびと]は彼[かれ]をダビデの町[まち]に、王[おう]たちとともに葬[ほうむ]った。彼[かれ]がイスラエルと神[かみ]、およびその家[いえ]のために良[よ]いことを行[おこな]ったからである。"
  17: "ヨヤダが死[し]ぬと、ユダの首長[しゅちょう]たちが来[き]て王[おう]の前[まえ]にひれ伏[ふ]した。そこで王[おう]は彼[かれ]らの言[い]うことを聞[き]き入[い]れた。"
  18: "彼[かれ]らは父[ちち]たちの神[かみ]である主[しゅ]を捨[す]て、アスタルテと偶像[ぐうぞう]に仕[つか]えた。そのため、この日[ひ]、ユダとエルサレムに怒[いか]りが下[くだ]った。"
  19: "主[しゅ]は彼[かれ]らを主[しゅ]のもとへ連[つ]れ戻[もど]すために預言者[よげんしゃ]たちを遣[つか]わしたが、彼[かれ]らは聞[き]かなかった。預言者[よげんしゃ]たちは彼[かれ]らに警告[けいこく]したが、彼[かれ]らは聞[き]かなかった。"
  20: "神[かみ]の霊[れい]が祭司[さいし]アザリヤ、すなわちヨヤダの子[こ]に臨[のぞ]み、彼[かれ]は民[たみ]の上[うえ]に立[た]って言[い]った。「主[しゅ]はこう言[い]われる。なぜ、あなたがたは主[しゅ]の戒[いまし]めを犯[おか]すのか。あなたがたは栄[さか]えることがない。あなたがたが主[しゅ]を捨[す]てたので、主[しゅ]もあなたがたを捨[す]てられる。」"
  21: "彼[かれ]らは彼[かれ]に襲[おそ]いかかって石[いし]を投[な]げ、王[おう]ヨアシュの命令[めいれい]によって、主[しゅ]の家[いえ]の庭[にわ]で彼[かれ]を殺[ころ]した。"
  22: "王[おう]ヨアシュは、父[ちち]ヨヤダが自分[じぶん]に示[しめ]した慈[いつく]しみを覚[おぼ]えておらず、その子[こ]を殺[ころ]した。その子[こ]は死[し]ぬ間際[まぎわ]に言[い]った。「主[しゅ]がご覧[らん]になり、裁[さば]いてくださるように。」"
  23: "年[とし]が終[お]わると、シリアの軍勢[ぐんぜい]が彼[かれ]に上[のぼ]って来[き]、ユダとエルサレムに攻[せ]め入[はい]り、民[たみ]の中[なか]の首長[しゅちょう]たちをすべて滅[ほろ]ぼし、そのすべての戦利品[せんりひん]をダマスコの王[おう]のもとへ送[おく]った。"
  24: "シリアの軍勢[ぐんぜい]は少[すく]ない人数[にんずう]で来[き]たが、神[かみ]は彼[かれ]らの手[て]に非常[ひじょう]に多[おお]きな軍勢[ぐんぜい]を渡[わた]された。彼[かれ]らが父[ちち]たちの神[かみ]である主[しゅ]を捨[す]てたからである。こうして彼[かれ]らはヨアシュに対して裁[さば]きを行[おこな]った。"
  25: "彼[かれ]らが彼[かれ]のもとを去[さ]り、彼[かれ]を大[おお]きな病[やまい]のうちに残[のこ]していったとき、彼[かれ]のしもべたちは、祭司[さいし]ヨヤダの子[こ]の血[ち]のゆえに彼[かれ]に逆[さか]らって謀[はか]り、彼[かれ]を寝床[ねどこ]の上[うえ]で殺[ころ]した。こうして彼[かれ]は死[し]に、ダビデの町[まち]に葬[ほうむ]られたが、王[おう]たちの墓[はか]には葬[ほうむ]られなかった。"
  26: "彼[かれ]に逆[さか]らって謀[はか]った者[もの]は、アンモン人[じん]であるサマトの子[こ]ザベドと、モアブ人[じん]であるソマロトの子[こ]ヨザバドであった。"
  27: "彼[かれ]の子[こ]らすべてのこと、および彼[かれ]のもとに来[き]た五人[ごにん]のことは、見[み]よ、王[おう]たちの書[しょ]に記[しる]されている。そしてその子[こ]アマツヤが彼[かれ]に代[か]わって王[おう]となった。"

notes:
  1: "ὢν ἑπτὰ ἐτῶν — «будучи 7 лет». Σαβια — Савия (サビヤ; слав. «савиа», в ru «Цивья»). Βηρσαβεε — Вирсавия (ベエル・シェバ). τεσσαράκοντα ἔτη — сорок лет."
  2: "τὸ εὐθές — правое, угодное. πάσας τὰς ἡμέρας Ιωδαε — «во все дни Иодая»."
  3: "ἔλαβεν αὐτῷ γυναῖκας δύο — «взял ему двух жён» (Иодай устроил брак). ἐγέννησεν — родил."
  4: "ἐγένετο ἐπὶ καρδίαν — «пришло на сердце». ἐπισκευάσαι — починить, обновить (ἐπισκευάζω)."
  5: "συναγάγετε — соберите. κατισχῦσαι — укрепить, поддержать (κατισχύω). ἐνιαυτὸν κατ᾽ ἐνιαυτόν — «год за годом». σπεύσατε λαλῆσαι — «поспешите сказать» (слав. «поспешно сотворите» — внесено в текст). οὐκ ἔσπευσαν — не поспешили."
  6: "τὸν ἄρχοντα — начальника (слав. «началника»; в ru «главу их»). ἐπεσκέψω — «посетил, взыскал» (ἐπισκέπτομαι), т. е. потребовал. τὸ κεκριμένον — установленное (κρίνω), налог. σκηνὴ τοῦ μαρτυρίου — скиния свидетельства (証の幕屋)."
  7: "ἡ ἄνομος — беззаконная. κατέσπασαν — разорили. τὰ ἅγια — святыни. ταῖς Βααλιμ — Ваалам (мн. ч.; слав. «ваалиму»)."
  8: "γλωσσόκομον — ящик для денег (слав. «ковчежец»). ἐν πύλῃ … ἔξω — «у ворот … снаружи»."
  9: "κηρυξάτωσαν — пусть провозгласят (κηρύσσω). εἰσενέγκαι κυρίῳ — принести Господу. παῖς τοῦ θεοῦ — раб Божий (しもべ). ἐν τῇ ἐρήμῳ — в пустыне (荒野)."
  10: "ἐνέβαλλον — бросали (ἐμβάλλω). ἕως οὗ ἐπληρώθη — пока не наполнился. В ru добавлено «обрадовались» — по МТ, в гр этого нет."
  11: "προστάται τοῦ βασιλέως — надзиратели царя (監督). γραμματεύς — писец (書記). ὁ προστάτης τοῦ ἱερέως τοῦ μεγάλου — «предстоятель великого священника» (слав. «настоятель великаго жерца»). ἐξεκένωσαν — опорожнили (ἐκκενόω)."
  12: "λατόμοι — каменотёсы (石切り). τέκτονες — плотники (大工). χαλκεῖς σιδήρου καὶ χαλκοῦ — кузнецы железа и меди (鍛冶)."
  13: "ἀνέβη μῆκος — «поднялась длина», работа продвинулась. ἐπὶ τὴν στάσιν αὐτοῦ — в прежнее состояние. ἐνίσχυσαν — укрепили."
  14: "τὸ κατάλοιπον — остаток. σκεύη λειτουργικά — служебные сосуды. θυίσκαι — кадильницы (香炉). διὰ παντός — непрестанно."
  15: "ἐγήρασεν — состарился. πλήρης ἡμερῶν — исполненный дней. ἐτελεύτησεν — скончался. ἑκατὸν καὶ τριάκοντα ἐτῶν — 130 лет."
  16: "μετὰ τῶν βασιλέων — с царями (честь, которой удостоен не царь). ἀγαθωσύνη — благость, доброе дело."
  17: "μετὰ τὴν τελευτήν — по смерти. προσεκύνησαν — поклонились. ἐπήκουσεν — послушал (ἐπακούω)."
  18: "ἐγκατέλιπον — оставили. Ἀστάρται — Астарты (アスタルテ; слав. «астарте»; в ru «деревам посвященным» — по МТ). εἴδωλα — идолы. ἐν τῇ ἡμέρᾳ ταύτῃ — «в день тот»."
  19: "ἀπέστειλεν — послал. ἐπιστρέψαι — обратить (ἐπιστρέφω). διεμαρτύραντο — засвидетельствовали (διαμαρτύρομαι). οὐκ ἤκουσαν — не послушали (дважды)."
  20: "ἐνέδυσεν — облёк (ἐνδύω). ἀνέστη ἐπάνω — встал над. Τί παραπορεύεσθε — «почему преступаете» (παραπορεύομαι). οὐκ εὐοδωθήσεσθε — «не будет успеха» (εὐοδόω). ἐγκαταλείψει — оставит. Αζαριαν τὸν τοῦ Ιωδαε — Азария, сын Иодая (アザリヤ); в МТ и ru — Захария."
  21: "ἐπέθεντο — напали, сговорились. ἐλιθοβόλησαν — побили камнями (λιθοβολέω). δι᾽ ἐντολῆς — по повелению. αὐλή — двор."
  22: "οὐκ ἐμνήσθη — не вспомнил. ἔλεος — милость (慈しみ). Ἴδοι κύριος καὶ κρινάτω — «да увидит Господь и да судит» (оптатив)."
  23: "μετὰ τὴν συντέλειαν τοῦ ἐνιαυτοῦ — «по завершении года». δύναμις Συρίας — сила Сирии. κατέφθειραν — истребили (καταφθείρω). σκῦλα — добыча (戦利品). Δαμασκός — Дамаск. Слав. «в церкви» соответствует гр ἐν τῷ λαῷ («в народе»)."
  24: "ἐν ὀλίγοις ἀνδράσιν — «с немногими людьми». παρέδωκεν — предал. σφόδρα — весьма. ἐποίησαν κρίματα — «совершили суды», т. е. суд."
  25: "ἐν μαλακίαις μεγάλαις — в великих болезнях. ἐν αἵμασιν — «за крови» (мн. ч.). ἐπὶ τῆς κλίνης — на постели. τάφος τῶν βασιλέων — гробница царей."
  26: "Ζαβεδ — Завад (ザベド). ὁ τοῦ Σαμαθ — «сын Самафа» (サマト); в МТ — Шимеафа, мать-аммонитянка. Ιωζαβεδ — Иегозавад (ヨザバド). ὁ τοῦ Σομαρωθ — сын Сомарофа (ソマロト); в МТ — Шимрифа, мать-моавитянка. Гр и слав. дают мужской род: «аммонитянин», «моавитянин»."
  27: "οἱ πέντε — «пять» (тёмное место; слав. «приступиша к нему пять»). γραφὴ τῶν βασιλέων — книга царей. Αμασιας — Амасия (アマツヤ)."
