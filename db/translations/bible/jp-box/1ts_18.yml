# jp-box, 1-я Царств, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: дружба Ионафана (1–5), женский хор и «Саул поразил тысячи» (6–7),
# зависть Саула и копьё (8–11), Давид вдали от двора (12–16), Мерова (17–19),
# Мелхола и сто краеобрезаний (20–29).
# Речь — 「…」: Саул (17, 21, 22, 25), Давид (18, 23), слуги и хор (7, 22).
# Вложенная речь — 『…』: слова Саула слугам (22) и слова, которые скажут Давиду (25).
# Красного нет: <j>/<mo> не ставятся.
# Нумерация по gr: 29 стихов; у csl 30 (слав. 18:30 о князьях филистимских в gr
# отсутствует целиком и не добавлен). На месте 18:1–5, 10, 11, 17–19 в gr стоит «.» —
# это лакуна LXX; десять стихов переведены по csl-ru и целиком в 〔…〕.
# Слав. добавления внутри стихов с греческим текстом (18:8 — «чего ему несть, точию
# царства?», 18:12 — «ибо Господь был с ним, а от Саула отступил», 18:21 — «в силах
# будеши ми зять днесь», 18:29 — «и бысть Саул враждуя») в текст не внесены, отмечены
# в notes: держимся gr.
# Сносок ⟨…⟩ нет: ペリシテ人, 契約, 王, 婿, 割礼 уже пояснены в корпусе.
# jp-ni не использовался.

