chapter: 18
draft: true

verses:
  1: "ダビデがサウルに語[かた]り終[お]えると、ヨナタンの魂[たましい]はダビデの魂[たましい]と結[むす]び合[あ]い、ヨナタンは彼[かれ]を自分[じぶん]の魂[たましい]のように愛[あい]した。"
  2: "サウルはその日[ひ]、彼[かれ]を自分[じぶん]のそばに置[お]き、父[ちち]の家[いえ]へ帰[かえ]ることを許[ゆる]さなかった。"
  3: "ヨナタンはダビデと契約[けいやく]を結[むす]んだ。彼[かれ]を自分[じぶん]の魂[たましい]のように愛[あい]していたからである。"
  4: "ヨナタンは自分[じぶん]の上着[うわぎ]を脱[ぬ]いでダビデに与[あた]え、さらに自分[じぶん]の衣[ころも]、剣[つるぎ]、弓[ゆみ]、帯[おび]まで与[あた]えた。"
  5: "ダビデは、サウルが遣[つか]わすところどこへでも、賢[かしこ]く歩[あゆ]んだ。サウルは彼[かれ]を戦[いくさ]の者[もの]たちの上[うえ]に立[た]てた。彼[かれ]は民[たみ]すべての目[め]にも、サウルの家来[けらい]の目[め]にもかなう者[もの]であった。"
  6: "ダビデを迎[むか]えに、イスラエルのすべての町[まち]から踊[おど]る女[おんな]たちが出[で]て来[き]た。太鼓[たいこ]と喜[よろこ]びの声[こえ]、シンバルをもって。"
  7: "女[おんな]たちは歌[うた]いながら答[こた]えて言[い]った。「サウルは千[せん]を討[う]ち、ダビデは万[まん]を討[う]った。」"
  8: "この言葉[ことば]はサウルの目[め]に悪[わる]しく映[うつ]り、彼[かれ]は言[い]った。「ダビデには万[まん]を与[あた]え、わたしには千[せん]を与[あた]えた。」"
  9: "サウルはその日[ひ]から後[のち]、ダビデを横目[よこめ]で見[み]るようになった。"
  10: "その翌日[よくじつ]、神[かみ]からの悪[わる]い霊[れい]がサウルに臨[のぞ]み、彼[かれ]は自分[じぶん]の家[いえ]の中[なか]で狂[くる]ったように振[ふ]る舞[ま]った。ダビデはいつものように手[て]で竪琴[たてごと]を奏[かな]でていた。サウルの手[て]には槍[やり]があった。"
  11: "サウルは槍[やり]を取[と]って言[い]った。「ダビデを壁[かべ]に突[つ]き刺[さ]してやる。」ダビデは二度[にど]、彼[かれ]の前[まえ]から身[み]をかわした。"
  12: "サウルはダビデの前[まえ]から恐[おそ]れた。"
  13: "サウルは彼[かれ]を自分[じぶん]から離[はな]し、自分[じぶん]の千人[せんにん]の長[ちょう]とした。彼[かれ]は民[たみ]の前[まえ]を出[で]て行[い]き、また入[はい]って来[き]た。"
  14: "ダビデはそのすべての道[みち]において思慮[しりょ]深[ぶか]く歩[あゆ]み、主[しゅ]が彼[かれ]とともにいた。"
  15: "サウルは彼[かれ]がひどく思慮[しりょ]深[ぶか]いのを見[み]て、彼[かれ]の前[まえ]を恐[おそ]れた。"
  16: "イスラエルとユダのすべての者[もの]はダビデを愛[あい]した。彼[かれ]が民[たみ]の前[まえ]を出[で]て行[い]き、また入[はい]って来[き]たからである。"
  17: "サウルはダビデに言[い]った。「見[み]よ、わたしの長女[ちょうじょ]メロブを、おまえに妻[つま]として与[あた]えよう。ただ、わたしのために力[ちから]ある者[もの]となり、主[しゅ]の戦[いくさ]を戦[たたか]え。」サウルは自分[じぶん]に言[い]った。「わたしの手[て]が彼[かれ]の上[うえ]に下[くだ]るのではなく、ペリシテ人[じん]の手[て]が彼[かれ]の上[うえ]に下[くだ]るように。」"
  18: "ダビデはサウルに言[い]った。「わたしは何者[なにもの]か。わたしの家柄[いえがら]、イスラエルにおける父[ちち]の一族[いちぞく]とは何[なん]なのか。どうして王[おう]の婿[むこ]になれようか。」"
  19: "サウルの娘[むすめ]メロブをダビデに与[あた]える時[とき]が来[き]たとき、彼女[かのじょ]はメホラ人[じん]アドリエルに妻[つま]として与[あた]えられた。"
  20: "サウルの娘[むすめ]ミカルはダビデを愛[あい]した。それがサウルに告[つ]げられると、彼[かれ]の目[め]にかなった。"
  21: "サウルは言[い]った。「彼女[かのじょ]を彼[かれ]に与[あた]えよう。そうすれば彼女[かのじょ]は彼[かれ]の罠[わな]となる。」ペリシテ人[じん]の手[て]がサウルに及[およ]んでいた。"
  22: "サウルは自分[じぶん]の家来[けらい]に命[めい]じて言[い]った。「ダビデにひそかに語[かた]り、こう言[い]え。『見[み]よ、王[おう]はあなたを望[のぞ]み、その家来[けらい]はみなあなたを愛[あい]している。だから、王[おう]の婿[むこ]になりなさい。』」"
  23: "サウルの家来[けらい]たちはこの言葉[ことば]をダビデの耳[みみ]に語[かた]った。ダビデは言[い]った。「あなたがたの目[め]に、王[おう]の婿[むこ]になることは軽[かろ]いことと映[うつ]るのか。わたしは身分[みぶん]の低[ひく]い者[もの]で、名[な]もない者[もの]であるのに。」"
  24: "サウルの家来[けらい]たちは、ダビデが語[かた]ったとおりの言葉[ことば]を彼[かれ]に告[つ]げた。"
  25: "サウルは言[い]った。「ダビデにこう言[い]え。『王[おう]は結納[ゆいのう]を望[のぞ]まず、ただペリシテ人[じん]の百[ひゃく]の包皮[ほうひ]を、王[おう]の敵[てき]への復讐[ふくしゅう]として望[のぞ]む。』」サウルはダビデをペリシテ人[じん]の手[て]に陥[おとしい]れようと考え[かんが]ていた。"
  26: "サウルの家来[けらい]たちがこの言葉[ことば]をダビデに告[つ]げると、王[おう]の婿[むこ]になることはダビデの目[め]にかなった。"
  27: "ダビデは立[た]ち上[あ]がり、自分[じぶん]とその人[ひと]々[びと]はペリシテ人[じん]のうちで百人[ひゃくにん]を打[う]ち、その包皮[ほうひ]を王[おう]に携[たずさ]えて来[き]て、王[おう]の婿[むこ]となった。そこでサウルは自分[じぶん]の娘[むすめ]ミカルを彼[かれ]に妻[つま]として与[あた]えた。"
  28: "サウルは、主[しゅ]がダビデとともにいること、そしてイスラエルすべての者[もの]が彼[かれ]を愛[あい]していることを見[み]た。"
  29: "サウルはますますダビデを恐[おそ]れるようになった。"

notes:
  1: "На месте стиха в gr-lxx-byz стоит «.» — в LXX отдела нет; перевод по csl-ru, целиком в …. συνάπτω — душа Ионафана прилепилась, срослась с душой Давида (слав. «спряжеся»). ἠγάπησεν ... ὡς τὴν ψυχὴν αὐτοῦ — полюбил его, как свою душу."
  2: "На месте стиха «.» — в LXX нет. ἔλαβεν αὐτὸν Σαουλ — взял его Саул к себе; οὐκ ἀφῆκεν αὐτὸν ἀποστρέψαι — не позволил возвратиться в дом отца."
  3: "На месте стиха «.» — в LXX нет. διέθετο ... διαθήκην — заключил завет (διαθήκη, 契約); ὅτι ἠγάπησεν αὐτὸν — ибо полюбил его."
  4: "На месте стиха «.» — в LXX нет. ἐξέδυσεν ... τὴν στολήν — снял верхнюю одежду; далее меч, лук и пояс — знаки дружбы и передачи достоинства."
  5: "На месте стиха «.» — в LXX нет. συνίει, хождаше разумно — действовал благоразумно (συνίημι). κατέστησεν αὐτὸν ... ἐπὶ τοὺς ἄνδρας τοὺς πολεμιστάς — поставил над воинами. ἦν ἀρεστὸν ἐνώπιον τοῦ λαοῦ — был угоден народу."
  6: "ἐξῆλθον αἱ χορεύουσαι εἰς συνάντησιν Δαυιδ — вышли пляшущие навстречу Давиду; слав. и ru читают «навстречу Саулу» — иное чтение, держимся gr. ἐν τυμπάνοις — с тимпанами (太鼓, ср. Исх 15:20), ἐν χαρμοσύνῃ — с радостью, ἐν κυμβάλοις — с кимвалами (シンバル)."
  7: "ἐξῆρχον — запевали, начинали (ἐξάρχω). Ἐπάταξεν Σαουλ ἐν χιλιάσιν αὐτοῦ — «поразил Саул тысячами своими»; отсюда 千を討ち, 万を討った. Слав. «победи» — передача того же."
  8: "πονηρὸν ἐφάνη τὸ ῥῆμα ἐν ὀφθαλμοῖς Σαουλ — слово показалось злым в глазах Саула. ἔδωκαν τὰς μυριάδας — дали десятки тысяч (μυριάς). Слав. добавляет вопрос «чего ему несть, точию царства?» (МТ 18:8b) — в gr его нет, в текст не внесено."
  9: "ὑποβλεπόμενος — смотрящий исподлобья, подозрительно (ὑποβλέπω). ἀπὸ τῆς ἡμέρας ἐκείνης καὶ ἐπέκεινα — с того дня и далее."
  10: "На месте стиха «.» — в LXX нет. πνεῦμα πονηρόν — 悪い霊. προεφήτευσεν / прорицаше — бесновался, выкрикивал (в тексте 狂ったように振る舞った). ἔψαλλεν ἐν ταῖς χερσὶν αὐτοῦ — играл руками на струнах (竪琴)."
  11: "На месте стиха «.» — в LXX нет. «Поражу Давида к стене» (πατάξω ... εἰς τὸν τοῖχον). ἀνεχώρησεν / уклонися — уклонился; дважды."
  12: "καὶ ἐφοβήθη Σαουλ ἀπὸ προσώπου Δαυιδ — убоялся Саул Давида. Слав. продолжает: «ибо Господь был с ним, а от Саула отступил»; в gr этого нет (B короче), в текст не внесено — смысл раскрыт в 14 («Господь был с ним») и 15."
  13: "ἀπέστησεν αὐτὸν ἀπ᾿ αὐτοῦ — удалил его от себя (ἀφίστημι). χιλίαρχος — тысяченачальник (千人の長). ἐξεπορεύετο καὶ εἰσεπορεύετο — выходил и входил, то есть нёс службу (обычная формула)."
  14: "ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ συνίων — во всех путях своих разумеющий (συνίημι). κύριος μετ᾿ αὐτοῦ — Господь с ним."
  15: "ὡς αὐτὸς συνίει σφόδρα — что он весьма разумен. εὐλαβεῖτο ἀπὸ προσώπου αὐτοῦ — остерегался, боялся его (εὐλαβέομαι)."
  16: "ἠγάπα τὸν Δαυιδ — любил Давида. ἐξεπορεύετο καὶ εἰσεπορεύετο πρὸ προσώπου τοῦ λαοῦ — выходил и входил перед народом."
  17: "На месте стиха «.» — в LXX нет. Μεροβ — Мерова (メロブ). «Буди ми в сына силы» (в тексте 力ある者) — будь мне мужественным; поборай брани Господни. Вторая половина — замысел Саула, переданный его словами (ru: «думал»)."
  18: "На месте стиха «.» — в LXX нет. «Кто аз есмь, и кое житие сродства отца моего» — кто я и какова жизнь рода отца моего; γαμβρός — зять (婿)."
  19: "На месте стиха «.» — в LXX нет. Мерова отдана Адриэлу «молафитскому», то есть мехолатянину (メホラ人)."
  20: "ἠγάπησεν Μελχολ — полюбила Мелхола (ミカル). ἀπηγγέλη τῷ Σαουλ — было возвещено Саулу. ηὐθύνθη ἐν ὀφθαλμοῖς αὐτοῦ — было угодно в его глазах."
  21: "Δώσω αὐτὴν αὐτῷ, καὶ ἔσται αὐτῷ εἰς σκάνδαλον — отдам её ему, и будет она ему в сеть, в соблазн (σκάνδαλον, 罠). ἦν ἐπὶ Σαουλ χεὶρ ἀλλοφύλων — рука филистимлян была на Сауле; выражение тёмное (возможно, нападения филистимлян или их власть), передано буквально. Слав. добавляет «в силах будеши ми зять днесь» — в gr нет."
  22: "ἐνετείλατο τοῖς παισὶν αὐτοῦ — приказал слугам, домочадцам (家来). λάθρᾳ — тайно. ἐπιγιάμβρευσον τῷ βασιλεῖ — породнись с царём, стань зятем. Речь вложена: 『…』."
  23: "εἰ κοῦφον ἐν ὀφθαλμοῖς ὑμῶν — разве легко в глазах ваших. ἀνὴρ ταπεινὸς καὶ οὐχὶ ἔνδοξος — человек низкий и не славный."
  24: "κατὰ τὰ ῥήματα ταῦτα, ἃ ἐλάλησεν Δαυιδ — по словам этим, которые говорил Давид."
  25: "ἐν δόματι — за дар, вено, выкуп за невесту (結納). ἐν ἑκατὸν ἀκροβυστίαις ἀλλοφύλων — ста краеобрезаниями филистимлян (ἀκροβυστία — крайняя плоть, 包皮). ἐκδικῆσαι εἰς ἐχθροὺς τοῦ βασιλέως — отмстить врагам царя. ἐλογίσατο ... ἐμβαλεῖν εἰς χεῖρας τῶν ἀλλοφύλων — замыслил ввергнуть в руки филистимлян."
  26: "εὐθύνθη ὁ λόγος ἐν ὀφθαλμοῖς Δαυιδ — слово было угодно в глазах Давида. ἐπιγαμβρεῦσαι τῷ βασιλεῖ — породниться с царём."
  27: "ἐπάταξεν ἐν τοῖς ἀλλοφύλοις ἑκατὸν ἄνδρας — поразил у филистимлян сто мужей; у слав. и ru «двести» (по МТ) — держимся gr. ἀνήνεγκεν τὰς ἀκροβυστίας αὐτῶν τῷ βασιλεῖ — принёс краеобрезания их царю. δίδωσιν αὐτῷ τὴν Μελχολ — отдаёт ему Мелхолу."
  28: "κύριος μετὰ Δαυιδ — Господь с Давидом; πᾶς Ισραηλ ἠγάπα αὐτόν — весь Израиль любил его. Слав. и ru добавляют «и что Мелхола любила его» — в gr стих на этом обрывается."
  29: "προσέθετο εὐλαβεῖσθαι ἀπὸ Δαυιδ ἔτι — продолжал бояться Давида ещё более (προστίθημι). Слав. добавляет «и бысть Саул враждуя на Давида во вся дни» — в gr нет. Слав. 18:30 («И исхождаху князи иноплеменничи…», МТ 18:30) в gr отсутствует целиком и не добавлен — отсюда 29 стихов против 30."
