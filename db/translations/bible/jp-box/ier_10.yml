verses:
  1: "主[しゅ]があなたがた、イスラエルの家[いえ]に語[かた]られた言葉[ことば]を聞[き]け。"
  2: "主[しゅ]はこう言[い]われる。「もろもろの民[たみ]の道[みち]を学[まな]んではならない。天[てん]のしるしを恐[おそ]れてはならない。もろもろの民[たみ]がそれらを恐[おそ]れているからである。"
  3: "もろもろの民[たみ]のならわしはむなしい。それは森[もり]から切[き]り出[だ]された木[き]、職人[しょくにん]の手[て]が作[つく]ったもの、鋳物[いもの]である。"
  4: "人々は銀[ぎん]と金[きん]でそれを飾[かざ]り、槌[つち]と釘[くぎ]でそれを固[かた]く打[う]ちつけ、それが動[うご]かないようにする。"
  5: "それらは打[う]ち延[の]ばされた銀[ぎん]で、語[かた]らない。持[も]ち上[あ]げて運[はこ]ばれるが、歩[ある]くことができない。それらを恐[おそ]れてはならない。悪[あく]を行[おこな]うこともできず、善[よ]きものもそれらの中[なか]にないからである。"
  6: "主[しゅ]よ、あなたに似[に]た者[もの]はいない。あなたは大[おお]きく、あなたの名[な]は力[ちから]のうちに大[おお]きい。"
  7: "もろもろの民[たみ]の王[おう]よ、あなたを恐[おそ]れない者[もの]がいるだろうか。あなたこそ恐[おそ]るべき方[かた]である。もろもろの民[たみ]の知者[ちしゃ]のすべてのうちにも、すべての王国[おうこく]のうちにも、あなたに似[に]た者[もの]はひとりもいない。"
  8: "彼らは共[とも]に愚[おろ]かで、思[おも]いが浅[あさ]い。むなしいものの教[おし]えは木[き]にすぎない。"
  9: "銀[ぎん]はタルシスから打[う]ち延[の]ばされて来[く]る。金[きん]はモファズから、金細工[きんざいく]師[し]の手[て]、すべて工匠[こうしょう]の業[わざ]である。彼らは青[あお]と紫[むらさき]をそれらに着[き]せる。"
  10: "しかし、主[しゅ]なる神[かみ]は真実[しんじつ]であり、生[い]ける神[かみ]、永遠[えいえん]の王[おう]である。その怒[いか]りによって地[ち]は震[ふる]え、もろもろの民[たみ]はその叱責[しっせき]に耐[た]えられない。」"
  11: "あなたがたは彼らにこう言[い]え。『天[てん]と地[ち]を造[つく]らなかった神々[かみがみ]は、この地[ち]から、またこの天[てん]の下[した]から滅[ほろ]び去[さ]れ。』"
  12: "地[ち]をその力[ちから]で造[つく]り、世界[せかい]をその知恵[ちえ]で整[ととの]え、その英知[えいち]で天[てん]を広[ひろ]げた方[かた]である。"
  13: "その声[こえ]によって天[てん]に水[みず]の多[おお]くがあり、地[ち]の果[は]てから雲[くも]を上[あ]げ、雨[あめ]の中[なか]に稲妻[いなずま]を造[つく]り、その倉[くら]から光[ひかり]を出[だ]す。"
  14: "すべての人[ひと]は知[し]ることにおいて愚[おろ]かになり、すべての金細工師[きんざいこうし]は自分[じぶん]の彫[ほ]り物[もの]によって恥[はじ]を見[み]る。その鋳物[いもの]は偽[いつわ]りであり、そこに霊[れい]はないからである。"
  15: "それらはむなしいもの、あざけりの業[わざ]である。罰[ばっ]する時[とき]に、それらは滅[ほろ]びる。"
  16: "ヤコブの分[ぶん]はそのようではない。すべてを造[つく]られた方[かた]が彼の嗣業[しぎょう]であり、イスラエルはその嗣業[しぎょう]の杖[つえ]である。その名[な]は万軍[ばんぐん]の主[しゅ]と呼ばれる。"
  17: "選[えら]ばれた者[もの]たちの中[なか]に住[す]む者[もの]よ、外[そと]からあなたの財[ざい]を集[あつ]めよ。"
  18: "まことに、主[しゅ]はこう言[い]われる。「見[み]よ、わたしはこの地[ち]に住[す]む者[もの]を今[いま]、苦[くる]しみのうちに投[な]げ捨[す]て、彼らを惑[まど]わす。あなたの傷[きず]が見[み]つかるために。」"
  19: "「ああ、あなたの破[やぶ]れのゆえに。あなたの傷[きず]は痛[いた]い。しかし、わたしは言[い]った。『まことに、これはわたしの病[やまい]であり、わたしはこれを負[お]う』と。"
  20: "わたしの天幕[てんまく]は荒[あ]らされ、滅[ほろ]びた。すべての幕[まく]は引[ひ]き裂[さ]かれた。わたしの子[こ]らもわたしの羊[ひつじ]もいない。もはや、わたしの天幕の場所[ばしょ]、わたしの幕の場所もない。"
  21: "牧者[ぼくしゃ]たちは愚[おろ]かになり、主[しゅ]を尋[たず]ね求めなかった。それゆえ、すべての群[む]れは悟[さと]らず、散[ち]らされた。"
  22: "聞[き]こえてくる。見[み]よ、大[おお]きな響[ひび]きが北[きた]の地[ち]から来[く]る。ユダの町々[まちまち]を荒[あ]れ地[ち]とし、鳥[とり]の住[す]みかとするために。」"
  23: "「主[しゅ]よ、わたしは知[し]っています。人[ひと]の道[みち]はその人[ひと]のものではなく、歩[あゆ]む者[もの]が自分[じぶん]の歩[あゆ]みを定[さだ]めることはできないということを。"
  24: "主[しゅ]よ、わたしたちを懲[こ]らしめてください。ただし、裁[さば]きによって。怒[いか]りによってではなく、わたしたちを少[すく]なくしないために。"
  25: "あなたの怒[いか]りを、あなたを知[し]らない民[たみ]の上[うえ]に、あなたの名[な]を呼[よ]ばない族[やから]の上[うえ]に注[そそ]いでください。彼らはヤコブを食[く]い尽[つく]し、彼を滅[ほろ]ぼし尽[く]して、その牧[まき]の場[ば]を荒[あ]らしたからです。」"

notes:
  1: "Ἀκούσατε τὸν λόγον κυρίου — «слушайте слово Господне»; ὃν ἐλάλησεν ἐφ᾽ ὑμᾶς — «которое Он изрёк на вас» (ἐπί с винитивом — «на, против»); οἶκος Ισραηλ — обращение «дом Израилев». Воззвание, кавычек нет."
  2: "Вводная формула вне кавычек: τάδε λέγει κύριος. κατὰ τὰς ὁδοὺς τῶν ἐθνῶν μὴ μανθάνετε — «по путям народов не учитесь» (μανθάνω); ἀπὸ τῶν σημείων τοῦ οὐρανοῦ μὴ φοβεῖσθε — «знамений небесных не бойтесь» (σημεῖον — знак, しるし); ὅτι φοβοῦνται αὐτὰ τοῖς προσώποις αὐτῶν — «ибо боятся их лицами своими» (греч. тёмно; слав. «яко их боятся языцы»), в тексте «もろもろの民がそれらを恐れている»."
  3: "ὅτι τὰ νόμιμα τῶν ἐθνῶν μάταια — «ибо уставы народов — пустота» (νόμιμον — установление, ならわし; μάταιος — пустой, むなしい); ξύλον ἐστὶν ἐκ τοῦ δρυμοῦ ἐκκεκομμένον — «дерево, из леса срубленное» (δρυμός — лес, 森; ἐκκόπτω — срубать); ἔργον τέκτονος — «дело плотника» (τέκτων — плотник, 職人); χώνευμα — «литьё, литое изображение» (χωνεύω — плавить, отливать, 鋳物)."
  4: "ἀργυρίῳ καὶ χρυσίῳ κεκαλλωπισμένα — «серебром и золотом украшены» (καλλωπίζω — украшать); ἐν σφύραις καὶ ἥλοις ἐστερέωσαν — «молотами и гвоздями укрепили» (σφῦρα — молот, 槌; ἧλος — гвоздь; στερεόω — укреплять); καὶ οὐ κινηθήσονται — «и не двинутся» (κινέω)."
  5: "В модуле стих — точка (лакуна); переведено по слав. 10:5: «сребро изваяно есть, не глаголют, носими носятся, понеже ходити не возмогут: не убойтеся их, яко не сотворят зла, и блага несть в них». В LXX стих есть: ἀργύριον τορευτόν ἐστιν, οὐ πορεύσονται (τορεύω — чеканить, 打ち延ばす), его текст в модуле попал ещё и в 10:9 (см. notes к 10:9). αἰρόμενα ἀρθήσονται — «поднимаемые будут подняты», т. е. их носят (αἴρω); οὐ μὴ κακοποιήσωσιν — «не сделают зла»; ἀγαθὸν οὐκ ἔστιν ἐν αὐτοῖς — «блага нет в них»."
  6: "В модуле стих — точка (лакуна); по слав. 10:6: «Несть подобен тебе, Господи: велик еси ты и велико имя твое в крепости» = LXX 10:6 (οὐκ ἔστιν ὅμοιός σοι, κύριε… μέγα τὸ ὄνομά σου ἐν κράτει). ὅμοιος — подобный, 似た者; κράτος — сила, мощь, 力."
  7: "В модуле стих — точка (лакуна); по слав. 10:7: «Кто не убоится тебе, о, Царю языков! твоя бо честь между всеми премудрыми языков, и во всех царствах их ни един есть подобен тебе» = LXX 10:7 (τίς οὐ φοβηθήσεταί σε, βασιλεῦ τῶν ἐθνῶν…). βασιλεῦ τῶν ἐθνῶν — «Царь народов» (о Боге); σοφοί — мудрецы, 知者; «твоя бо честь» понято как «Тебе принадлежит честь (страх)», в тексте «あなたこそ恐るべき方である»."
  8: "В модуле стих — точка (лакуна); по слав. 10:8: «Купно буии и безумнии суть, учение суетных их древо есть» = LXX 10:8 (ὁμοῦ μωρὸς καὶ ἄφρων, ἡ παίδευσις ματαίων αὐτῶν· ξύλον ἐστίν). μωρός — глупый (愚か); ἄφρων — неразумный (思いが浅い); παίδευσις — наставление, учение (教え); ματαίων — суетных (идолов); ξύλον — дерево."
  9: "ἀργύριον προσβλητὸν ἀπὸ Θαρσις ἥξει — «серебро кованое из Тарсиса придёт» (προσβλητός — накладной, кованый; Θαρσις — タルシス); χρυσίον Μωφαζ — «золото Мофаза» (Μωφαζ — モファズ; евр. Уфаз, слав. «Офаз»); χεὶρ χρυσοχόων — «рука золотых дел мастеров» (χρυσοχόος — 金細工師); ἔργα τεχνιτῶν πάντα — «дела художников всех» (τεχνίτης — мастер, 工匠); ὑάκινθον καὶ πορφύραν ἐνδύσουσιν αὐτά — «в гиацинт и пурпур оденут их» (ὑάκινθος — гиацинт, синий цвет, 青; πορφύρα — пурпур, 紫). В модуле gr 10:9 после «ἐνδύσουσιν αὐτά» стоит строчная цифра 5 и повтор LXX 10:5 (αἰρόμενα ἀρθήσονται… μὴ φοβηθῆτε αὐτά…) — дубль, в тексте не повторён (см. notes к 10:5)."
  10: "В модуле стих — точка (лакуна); по слав. 10:10: «Господь же Бог истинен есть, той Бог живый и Царь вечный, от гнева его подвигнется земля, и не стерпят языцы прещения его» = LXX 10:10 (κύριος ὁ θεὸς ἀληθινός ἐστιν…). ἀληθινός — истинный, 真実; ζῶν — живой (生ける); βασιλεὺς αἰώνιος — Царь вечный (永遠の王); σεισθήσεται ἡ γῆ — «потрясётся земля» (σείω, 震える); οὐχ ὑποίσουσιν τὰ ἔθνη ἀπειλὴν αὐτοῦ — «не понесут народы угрозы Его» (ὑποφέρω — выносить; ἀπειλή — угроза, 叱責)."
  11: "οὕτως ἐρεῖτε αὐτοῖς — «так скажите им» (повеление пророку, вне кавычек); Θεοί, οἳ τὸν οὐρανὸν καὶ τὴν γῆν οὐκ ἐποίησαν — «боги, которые неба и земли не сотворили»; ἀπολέσθωσαν ἀπὸ τῆς γῆς καὶ ὑποκάτωθεν τοῦ οὐρανοῦ τούτου — «да погибнут с земли и из-под неба сего» (ἀπόλλυμι, императив 3-го л.). В МТ стих по-арамейски (единственный такой), в LXX — по-гречески. Слав. «да погибнут от земли и от сих, иже под небесем суть» — «сих» передаёт «из-под неба сего». Вложенная цитата 『…』."
  12: "κύριος ὁ ποιήσας τὴν γῆν ἐν τῇ ἰσχύι αὐτοῦ — «Господь, сотворивший землю в силе Своей» (ἰσχύς — сила, 力); ὁ ἀνορθώσας τὴν οἰκουμένην — «утвердивший вселенную» (ἀνορθόω — выпрямлять, утверждать; οἰκουμένη — обитаемый мир, 世界); ἐν τῇ σοφίᾳ αὐτοῦ καὶ τῇ φρονήσει αὐτοῦ — «в премудрости и разуме Своём» (σοφία — 知恵; φρόνησις — 英知); ἐξέτεινεν τὸν οὐρανόν — «распростёр небо» (ἐκτείνω). Гимн о Господе в 3-м лице, без кавычек."
  13: "καὶ πλῆθος ὕδατος ἐν οὐρανῷ — «и множество воды на небе» (πλῆθος — множество); слав. добавляет «ко гласу своему» («Ко гласу своему дает множество вод») — в гр. нет, внесено без скобок (その声によって), отмечено. ἀνήγαγεν νεφέλας ἐξ ἐσχάτου τῆς γῆς — «возвёл облака от конца земли» (ἀνάγω; νεφέλη — облако, 雲); ἀστραπὰς εἰς ὑετὸν ἐποίησεν — «молнии в дождь сотворил» (ἀστραπή — молния, 稲妻; ὑετός — дождь); ἐξήγαγεν φῶς ἐκ θησαυρῶν αὐτοῦ — «извёл свет из сокровищниц Своих» (θησαυρός — сокровищница, 倉); у слав. «изведе ветр» (ветер) — иное чтение (МТ), держим LXX (光)."
  14: "ἐμωράνθη πᾶς ἄνθρωπος ἀπὸ γνώσεως — «обезумел всякий человек от знания» (μωραίνω — делать глупым; γνῶσις — знание), т. е. обезумел в своём знании; κατῃσχύνθη πᾶς χρυσοχόος ἐπὶ τοῖς γλυπτοῖς αὐτοῦ — «постыдился всякий золотых дел мастер об изваяниях своих» (γλυπτόν — изваяние, 彫り物); ὅτι ψευδῆ ἐχώνευσαν — «ибо ложное отлили» (χωνεύω — отливать); οὐκ ἔστιν πνεῦμα ἐν αὐτοῖς — «нет духа в них» (πνεῦμα — дух, 霊)."
  15: "μάταιά ἐστιν — «суетны они» (μάταιος, мн. ср.); ἔργα ἐμπεπαιγμένα — «дела осмеянные» (ἐμπαίζω — осмеивать, あざける); ἐν καιρῷ ἐπισκοπῆς αὐτῶν — «во время посещения их» (ἐπισκοπή, 罰する時); ἀπολοῦνται — «погибнут» (ἀπόλλυμι)."
  16: "οὐκ ἔστιν τοιαύτη μερὶς τῷ Ιακωβ — «не такова доля Иакова» (μερίς — часть, доля, 分); ὁ πλάσας τὰ πάντα — «образовавший всё» (πλάσσω — лепить, создавать); αὐτὸς κληρονομία αὐτοῦ — «Он наследие его» (κληρονομία — наследие, 嗣業); κύριος ὄνομα αὐτῷ — «Господь имя Ему». Слав. добавляет «и израиль жезл достояния его» (Израиль — жезл наследия Его) и «сил» (万軍) — нет в LXX (чтения МТ), внесено без скобок, отмечено."
  17: "Συνήγαγεν ἔξωθεν τὴν ὑπόστασίν σου — «собрал извне имущество твоё» (συνάγω; ἔξωθεν — извне; ὑπόστασις — имущество, состояние, 財; слав. «имение»); κατοικοῦσα ἐν ἐκλεκτοῖς — «живущая в избранных» (ἐκλεκτός — избранный); греч. тёмен, в тексте буквально «選ばれた者たちの中に住む者よ» (ru «имеющая сидеть в осаде» — понимание по МТ, в текст не внесено), отмечено."
  18: "Вводная формула вне кавычек: τάδε λέγει κύριος. Ἰδοὺ ἐγὼ σκελίζω τοὺς κατοικοῦντας τὴν γῆν ταύτην ἐν θλίψει — «вот, Я подсекаю (калечу) жителей земли сей в скорби» (σκελίζω — подсекать жилы, калечить; θλῖψις — скорбь, 苦しみ); слав. «се, аз отвергу обитатели земли сея в скорби и смущу их» — по слав. в тексте 投げ捨て…惑わす. ὅπως εὑρεθῇ ἡ πληγή σου — «чтобы нашлась язва твоя» (εὑρίσκω — находить; πληγή — язва, 傷)."
  19: "οὐαὶ ἐπὶ συντρίμματί σου — «горе о сокрушении твоём» (σύντριμμα — сокрушение, 破れ); ἀλγηρὰ ἡ πληγή σου — «болезненна язва твоя» (ἀλγηρός — болезненный); κἀγὼ εἶπα — «и я сказал»; Ὄντως τοῦτο τὸ τραῦμά μου — «подлинно это рана моя» (τραῦμα — рана, 傷), вложенная цитата 『…』; κατέλαβέν με — «и постигла меня» (καταλαμβάνω). Плач города — 「…» до 10:22."
  20: "ἡ σκηνή μου ἐταλαιπώρησεν — «шатёр мой опустошён» (ταλαιπωρέω — бедствовать); ὤλετο — «погиб» (ὄλλυμι); πᾶσαι αἱ δέρρεις μου διεσπάσθησαν — «все кожи (покровы) мои разодраны» (δέρρις — кожаный покров шатра, 幕; διασπάω — раздирать); οἱ υἱοί μου καὶ τὰ πρόβατά μου οὐκ εἰσίν — «сыновей моих и овец моих нет»; οὐκ ἔστιν ἔτι τόπος τῆς σκηνῆς μου — «нет уже места шатра моего». Слав. в начале 10:19 добавляет «жилище мое опусте, погибе» — это начало 10:20, деление иное, держим гр."
  21: "οἱ ποιμένες ἠφρονεύσαντο — «пастыри обезумели» (ἀφρονεύομαι — безуметь, 愚かになる); τὸν κύριον οὐκ ἐξεζήτησαν — «Господа не взыскали» (ἐκζητέω — искать, взыскивать); οὐκ ἐνόησεν πᾶσα ἡ νομή — «не уразумела вся пажить (стадо)» (νοέω — понимать; νομή — пастбище, стадо, 群れ); διεσκορπίσθησαν — «рассеялись» (διασκορπίζω)."
  22: "φωνὴ ἀκοῆς — «голос слуха (молва)» (ἀκοή — слух, весть); σεισμὸς μέγας — «сотрясение великое» (σεισμός — землетрясение, шум, 響き); ἐκ γῆς βορρᾶ — «из земли северной» (βορρᾶς — север); τοῦ τάξαι — «чтобы поставить» (τάσσω); εἰς ἀφανισμόν — «в уничтожение» (ἀφανισμός); κοίτην στρουθῶν — «ложе воробьёв» (κοίτη — ложе; στρουθός — воробей, птица), т. е. пустое место, где гнездятся птицы; слав. «во обитание змием», ru «жилищем шакалов» — иные чтения (ср. 9:10), в тексте 鳥の住みか. Кавычки закрываются."
  23: "Молитва пророка — 「…» до конца главы. οἶδα, κύριε — «знаю, Господи»; οὐχὶ τοῦ ἀνθρώπου ἡ ὁδὸς αὐτοῦ — «не человеку [принадлежит] путь его» (родительный принадлежности); οὐδὲ ἀνὴρ πορεύσεται καὶ κατορθώσει πορείαν αὐτοῦ — «и не муж пойдёт и исправит шествие своё» (κατορθόω — выпрямлять, направлять, 定める). Мысль: путь человека не в его власти."
  24: "παίδευσον ἡμᾶς, κύριε — «накажи нас, Господи» (παιδεύω — наставлять, наказывать; в гр. 1-е л. мн. ч.); πλὴν ἐν κρίσει — «но в суде (по правде)» (πλήν — но, однако; κρίσις — суд, 裁き); μὴ ἐν θυμῷ — «не в ярости» (θυμός); ἵνα μὴ ὀλίγους ἡμᾶς ποιήσῃς — «чтобы не сделать нас немногими» (ὀλίγος — немногий, 少ない). У ru «меня» (ед. ч.) — в тексте мн. ч. по LXX и слав."
  25: "ἔκχεον τὸν θυμόν σου ἐπὶ ἔθνη τὰ μὴ εἰδότα σε — «излей ярость Твою на народы, не знающие Тебя» (ἐκχέω); ἐπὶ γενεὰς αἳ τὸ ὄνομά σου οὐκ ἐπεκαλέσαντο — «на поколения, которые имени Твоего не призвали» (ἐπικαλέομαι — призывать; γενεά — род, 族); ὅτι κατέφαγον τὸν Ιακωβ — «ибо съели Иакова» (κατεσθίω); ἐξανήλωσαν αὐτὸν — «истребили его» (ἐξαναλίσκω); τὴν νομὴν αὐτοῦ ἠρήμωσαν — «пажить его опустошили» (νομή — пастбище, 牧の場; ἐρημόω — опустошать). Кавычки закрываются в конце главы."
