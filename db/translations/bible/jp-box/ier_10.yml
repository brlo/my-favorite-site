# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31); в гл. 10 его нет.
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: 1 воззвание; 2–10 слово Господа против идолов и о едином Боге; 11 «боги,
# которые не сотворили неба и земли»; 12–16 гимн Творцу и «доля Иакова»; 17–18 осада
# и суд; 19–22 плач города; 23–25 молитва пророка.
# Точки модуля: 10:5, 10:6, 10:7, 10:8, 10:10 — лакуны модуля; в LXX эти стихи есть и
# совпадают со слав. 10:5–8, 10, поэтому переведены по слав. того же стиха, без 〔…〕.
# В 10:5–8 слав. делит так же, как LXX (слав. 10:5 = LXX 10:5, слав. 10:9 = LXX 10:9);
# в gr 10:9 после «ἐνδύσουσιν αὐτά» стоит строчная цифра 5 и повтор LXX 10:5
# («αἰρόμενα ἀρθήσονται… μὴ φοβηθῆτε αὐτά…») — дубль, в 10:9 не повторён, оговорено
# в notes к 10:5 и 10:9.
# Голоса: 10:1 — воззвание, без кавычек; 10:2–10 — одна цитата 「…» (слово Господа;
# вводная формула в 10:2 вне кавычек); 10:11 — повеление пророку, без внешних кавычек,
# с вложенной 『…』; 10:12–16 — гимн, без кавычек (славословие о Господе в 3-м лице);
# 10:17 — воззвание, без кавычек; 10:18 — 「…» (слово Господа); 10:19–22 — 「…» (плач
# города; вложенная 『…』 в 10:19); 10:23–25 — 「…» (молитва пророка).
# Нумерация по gr: 25 стихов, совпадает с csl и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz, включая точки 5–8, 10 (там лакуна модуля, а не
# LXX). Сносок ⟨…⟩ нет: タルシス, モファズ, 青銅, ふいご, 嗣業 уже в корпусе или
# пояснены в notes.
# Имена — транслитерация греческого (LXX): イスラエル, ヤコブ, ユダ, タルシス (Θαρσις),
# モファズ (Μωφαζ; слав. «Офаз», ru «Уфаз»), エルサレム.
# 
