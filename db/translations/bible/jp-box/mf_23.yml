verses:
  1: "そのとき、イエスは群衆[ぐんしゅう]と弟子[でし]たちに語[かた]って、こう言[い]われた。"
  2: "「<j>モーセの座[ざ]には、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の人々[ひとびと]が腰[こし]を下[お]ろしている。</j>"
  3: "<j>だから、彼[かれ]らがあなたがたに言[い]うことは何[なん]でも、すべて行[おこな]い、守[まも]りなさい。しかし、彼[かれ]らの行[おこな]いのようには行[おこな]ってはならない。彼[かれ]らは言[い]うだけで、行[おこな]わないからである。</j>"
  4: "<j>彼[かれ]らは重[おも]くて〔負[お]い難[がた]い〕荷[に]を縛[しば]って人[ひと]の肩[かた]に負[お]わせるが、自分[じぶん]たちは指[ゆび]でさえ、それを動[うご]かそうとはしない。</j>"
  5: "<j>彼[かれ]らの行[おこな]うことはすべて、人[ひと]に見[み]せびらかすためである。彼[かれ]らは護符[ごふ]⟨聖書[せいしょ]の言葉[ことば]を入[い]れた小[ちい]さな革[かわ]の箱[はこ]。祈[いの]りのとき、腕[うで]や額[ひたい]につける。⟩を広[ひろ]くし、衣[ころも]の房[ふさ]を長[なが]くする。</j>"
  6: "<j>また、宴会[えんかい]では上座[じょうざ]を、会堂[かいどう]では上席[じょうせき]を好[この]み、</j>"
  7: "<j>広場[ひろば]での挨拶[あいさつ]や、人[ひと]から『ラビ⟨「先生[せんせい]」の意[い]のヘブライ語[ご]の尊称[そんしょう]。⟩』と呼[よ]ばれることを好[この]む。</j>」"
  8: "「<j>しかし、あなたがたは『ラビ』と呼[よ]ばれてはならない。あなたがたの師[し]は一人[ひとり]だけである〔、すなわちキリストである〕。あなたがたは皆[みな]、兄弟[きょうだい]である。</j>"
  9: "<j>また、地[ち]の上[うえ]のだれも父[ちち]と呼[よ]んではならない。あなたがたの父[ちち]は一人[ひとり]、天[てん]におられる方[かた]だけである。</j>"
  10: "<j>また、導師[どうし]と呼[よ]ばれてもならない。あなたがたの導師[どうし]は一人[ひとり]、キリストだけである。</j>"
  11: "<j>あなたがたの中[なか]で大[おお]きい者[もの]は、あなたがたの僕[しもべ]となる。</j>"
  12: "<j>自分[じぶん]を高[たか]くする者[もの]は低[ひく]くされ、自分[じぶん]を低[ひく]くする者[もの]は高[たか]くされる。</j>」"
  13: "「<j>不幸[ふこう]である、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。あなたがたは天[てん]の国[くに]を人[ひと]の前[まえ]で閉[と]ざし、自分[じぶん]は入[はい]らず、入[はい]ろうとする者[もの]たちを入[はい]らせもしないからである。</j>"
  14: "<j>〔不幸[ふこう]である、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。あなたがたはやもめの家[いえ]を食[く]い尽[つ]くし、見[み]せかけのために長[なが]い祈[いの]りをする。だから、あなたがたは一層[いっそう]重[おも]い裁[さば]きを受[う]ける。〕</j>"
  15: "<j>不幸[ふこう]である、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。あなたがたは一人[ひとり]の改宗者[かいしゅうしゃ]を作[つく]るために海[うみ]と陸[りく]を巡[めぐ]り歩[ある]き、それができると、その人[ひと]を自分[じぶん]たちの二倍[にばい]も地獄[じごく]の子[こ]にするからである。</j>」"
  16: "「<j>不幸[ふこう]である、盲目[もうもく]の道案内[みちあんない]をする者[もの]たちよ。あなたがたは言[い]う。『神殿[しんでん]にかけて誓[ちか]う者[もの]は何[なに]も義務[ぎむ]を負[お]わないが、神殿[しんでん]の金[きん]にかけて誓[ちか]う者[もの]は義務[ぎむ]を負[お]う』と。</j>"
  17: "<j>愚[おろ]かな者[もの]たち、盲目[もうもく]の者[もの]たちよ。金[きん]と、金[きん]を聖[せい]なるものとする神殿[しんでん]と、どちらが大[おお]きいのか。</j>"
  18: "<j>また、あなたがたは言[い]う。『祭壇[さいだん]にかけて誓[ちか]う者[もの]は何[なに]も義務[ぎむ]を負[お]わないが、祭壇[さいだん]の上[うえ]の供[そな]え物[もの]にかけて誓[ちか]う者[もの]は義務[ぎむ]を負[お]う』と。</j>"
  19: "<j>盲目[もうもく]の者[もの]たちよ。供[そな]え物[もの]と、供[そな]え物[もの]を聖[せい]なるものとする祭壇[さいだん]と、どちらが大[おお]きいのか。</j>"
  20: "<j>だから、祭壇[さいだん]にかけて誓[ちか]う者[もの]は、祭壇[さいだん]と、その上[うえ]にあるすべてのものにかけて誓[ちか]うのである。</j>"
  21: "<j>神殿[しんでん]にかけて誓[ちか]うなら、神殿[しんでん]と、そこに住[す]まわれる方[かた]とにかけて誓[ちか]うことになる。</j>"
  22: "<j>天[てん]にかけて誓[ちか]うなら、神[かみ]の王座[おうざ]と、その上[うえ]に座[すわ]っておられる方[かた]とにかけて誓[ちか]うことになる。</j>」"
  23: "「<j>不幸[ふこう]である、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。あなたがたは薄荷[はっか]、茴香[ういきょう]、馬芹[うまぜり]の十分[じゅうぶん]の一[いち]を納[おさ]めながら、律法[りっぽう]の重[おも]いほうの事柄[ことがら]、すなわち裁[さば]きと憐[あわ]れみと信仰[しんこう]をないがしろにしている。これこそ行[おこな]うべきことであり、あれもなおざりにしてはならない。</j>"
  24: "<j>盲目[もうもく]の道案内[みちあんない]をする者[もの]たちよ。あなたがたは蚊[か]を漉[こ]し分[わ]けながら、ラクダを飲[の]み込[こ]む者[もの]である。</j>」"
  25: "「<j>不幸[ふこう]である、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。あなたがたは杯[さかずき]と皿[さら]の外側[そとがわ]を清[きよ]めるが、内側[うちがわ]は強奪[ごうだつ]と放縦[ほうじゅう]で満[み]ちている。</j>"
  26: "<j>盲目[もうもく]のファリサイ派[は]の人[ひと]よ。まず杯[さかずき]〔と皿[さら]〕の内側[うちがわ]を清[きよ]めよ。そうすれば、外側[そとがわ]も清[きよ]くなる。</j>」"
  27: "「<j>不幸[ふこう]である、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。あなたがたは白[しろ]く塗[ぬ]った墓[はか]に似[に]ている。外側[そとがわ]は美[うつく]しく見[み]えるが、内側[うちがわ]は死[し]んだ者[もの]の骨[ほね]とあらゆる汚[けが]れで満[み]ちている。</j>"
  28: "<j>同[おな]じように、あなたがたも外側[そとがわ]は人[ひと]に正[ただ]しい者[もの]と見[み]えるが、内側[うちがわ]は偽善[ぎぜん]と不法[ふほう]で満[み]ちている。</j>」"
  29: "「<j>不幸[ふこう]である、律法学者[りっぽうがくしゃ]たちとファリサイ派[は]の偽善者[ぎぜんしゃ]たちよ。あなたがたは預言者[よげんしゃ]たちの墓[はか]を建[た]て、正[ただ]しい人々[ひとびと]の墓所[ぼしょ]を飾[かざ]り、</j>"
  30: "<j>そして言[い]う。『もしわたしたちが先祖[せんぞ]の時代[じだい]に生[い]きていたなら、預言者[よげんしゃ]たちの血[ち]を流[なが]すことに加[くわ]わらなかっただろうに』と。</j>"
  31: "<j>こうして、あなたがたは、預言者[よげんしゃ]たちを殺[ころ]した者[もの]たちの子[こ]であることを、自分[じぶん]で証[しょう]しているのである。</j>"
  32: "<j>あなたがたは、先祖[せんぞ]たちの量[ます]目[め]を満[み]たしなさい。</j>」"
  33: "「<j>蛇[へび]よ、蝮[まむし]の子[こ]らよ。どうして、地獄[じごく]の裁[さば]きを逃[のが]れられるだろうか。</j>"
  34: "<j>だから、見[み]よ、わたしは預言者[よげんしゃ]たちと知恵[ちえ]ある者[もの]たちと律法学者[りっぽうがくしゃ]たちを、あなたがたのもとへ遣[つか]わす。あなたがたはそのうちのある者[もの]を殺[ころ]し、十字架[じゅうじか]につけ、ある者[もの]を会堂[かいどう]で鞭打[むちう]ち、町[まち]から町[まち]へと追[お]い回[まわ]すであろう。</j>"
  35: "<j>そのために、地[ち]の上[うえ]に流[なが]された正[ただ]しい血[ち]が、すべてあなたがたに降[ふ]りかかる。正[ただ]しい人[ひと]アベルの血[ち]から、あなたがたが神殿[しんでん]と祭壇[さいだん]の間[あいだ]で殺[ころ]した、バラキヤの子[こ]ザカリヤの血[ち]まで。</j>"
  36: "<j>はっきり言[い]っておく。これらのことはすべて、この時代[じだい]に降[ふ]りかかる。</j>」"
  37: "「<j>エルサレム、エルサレム。預言者[よげんしゃ]たちを殺[ころ]し、自分[じぶん]に遣[つか]わされた者[もの]たちを石[いし]で打[う]ち殺[ころ]す者[もの]よ。鶏[にわとり]がその雛[ひな]を翼[つばさ]の下[した]に集[あつ]めるように、わたしは何度[なんど]、あなたの子[こ]らを集[あつ]めようとしたことか。しかし、あなたがたは望[のぞ]まなかった。</j>"
  38: "<j>見[み]よ、あなたがたの家[いえ]は荒[あ]れ果[は]てたまま、あなたがたに残[のこ]される。</j>"
  39: "<j>言[い]っておく。今[いま]から後[のち]、『主[しゅ]の名[な]によって来[く]る者[もの]は祝福[しゅくふく]される』とあなたがたが言[い]うようになるまで、あなたがたは決[けっ]してわたしを見[み]ることはない。</j>」"

notes:
  1: "ἐλάλησεν… λέγων — вводная фраза, речь Христа начинается со 2-го стиха."
  2: "καθέδρα Μωϋσέως — «седалище Моисея»; モーセの座."
  3: "κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε — «по делам их не поступайте»; 彼らの行いのようには行ってはならない."
  4: "В критической базе φορτία βαρέα; Церковь (Елизаветинская «тяжкие», jp-joc 重く且つ負ひ難き) читает καὶ δυσβάστακτα — 〔負い難い〕. τῷ δακτύλῳ αὐτῶν — «пальцем своим», без добавления 一本."
  5: "φυλακτήρια — филактерии (тефиллин), сноска при первом упоминании. κράσπεδα — кисти по краю одежды, 房."
  6: "πρωτοκλισία — первое место на пиру (上座), πρωτοκαθεδρία — в синагоге (上席), как в Мк 12:38–39."
  7: "Ῥαββί — «учитель»; сноска при первом упоминании в книге."
  8: "В критической базе εἷς γὰρ ὑμῶν ὁ διδάσκαλος; Церковь (Елизаветинская, jp-joc 即ちハリストス) читает ὁ Χριστός — 〔すなわちキリストである〕."
  10: "ὁ καθηγητής — 導師; здесь ὁ Χριστός есть и в критической базе, поэтому без 〔〕."
  13: "οὐαί передаю 不幸 (как Мк 13:17), без архаичного 禍なる哉."
  14: "Стих целиком отсутствует в критической базе (в выгрузке — точка); церковное чтение есть у Елизаветинской и jp-joc — весь стих в 〔〕."
  15: "προσήλυτος — прозелит, 改宗者. γέεννα — 地獄, как в Мф 5:22."
  16: "ὀφείλει — «должен, связан»; передал 義務を負う."
  19: "В критической базе τυφλοί без μωροί; не добавлял."
  21: "ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ κατοικοῦντι αὐτόν — «клянётся им и Живущим в нём»; для естественности передал условной конструкцией (誓うなら…ことになる), смысл тот же. Так же в 22."
  23: "ἡδύοσμον, ἄνηθον, κύμινον — мята, укроп, тмин; 薄荷・茴香・馬芹 (как jp-joc). κρίσις, ἔλεος, πίστις — 裁き・憐れみ・信仰, порядок сохранён."
  24: "διϋλίζοντες τὸν κώνωπα — «процеживающие комара»; 蚊を漉し分ける."
  26: "В критической базе только τὸ ἐντὸς τοῦ ποτηρίου; Церковь (jp-joc «杯と皿») читает καὶ τῆς παροψίδος — 〔と皿〕."
  33: "γεννήματα ἐχιδνῶν — как в Мф 3:7, 蝮の子ら."
  35: "Ἅβελ, Ζαχαρίας υἱὸς Βαραχίου — Авель, Захария сын Варахии; バラキヤ."
  38: "ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ἔρημος — «оставляется вам дом ваш пуст»; 荒れ果てたまま、あなたがたに残される."
  39: "Пс 117:26 — слова, которые народ скажет при пришествии; внутри речи Христа в 『』."
