# jp-box, Числа, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: ропот всего общества (1–4), падение Моисея и Аарона (5),
# речь Иисуса и Халева (6–9), угроза побить камнями и явление славы (10),
# ходатайство Моисея (11–19), прощение и клятва о сорока годах (20–35),
# смерть разведчиков (36–38), позднее раскаяние и поражение (39–45).
# Нумерация совпадает с csl-ru и ru: 45 стихов.
# Красного и синего нет. Речи: народа — 「…」 (2–4); Иисуса и Халева — 「…」 (7–9);
# Бога — 「…」 (11–12, 20–35); Моисея — 「…」 (13–19, 41–43). Внутри речи Моисея
# слова Бога (Исх 34:6–7) — 『…』 (18); слова народов — 『…』 (16).
# В 28–35 слова, которые Бог велит передать народу, — 『…』 внутри речи Бога;
# закрыты после клятвенной формулы «わたしは生きている» (28), как в церковном чтении.
# 〔…〕 нет: все слова есть в gr-lxx-byz. Отличия от Синодального (14:34 «что значит
# быть оставленным Мною» — от евр.; 14:45 «Хорма» вместо греч. Ερμαν) в текст
# не внесены, см. notes.
# Сносок ⟨…⟩ нет: 陰府, 嗣業, 契約の箱, 巨人 уже в корпусе, остальное понятно.
