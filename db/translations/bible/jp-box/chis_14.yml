verses:
  1: "会衆[かいしゅう]は全体[ぜんたい]が声[こえ]を上[あ]げ、民[たみ]はその夜[よる]、一晩中[ひとばんじゅう]泣[な]いた。"
  2: "イスラエルの子[こ]らはみな、モーセとアロンにつぶやいた。会衆[かいしゅう]は全体[ぜんたい]が彼[かれ]らに言[い]った。「エジプトの地[ち]で死[し]んでいればよかった。あるいは、この荒野[こうや]で死[し]んでいればよかったのだ。"
  3: "なぜ主[しゅ]はわたしたちをこの地[ち]に導[みちび]き入[い]れ、戦[たたか]いで倒[たお]れさせようとされるのか。妻[つま]や子[こ]どもは奪[うば]い取[と]られるであろう。今[いま]こそ、エジプトへ帰[かえ]るほうがわたしたちにはよい。」"
  4: "彼[かれ]らは互[たが]いに言[い]った。「わたしたちのために長[かしら]を立[た]て、エジプトへ帰[かえ]ろう。」"
  5: "モーセとアロンは、イスラエルの子[こ]らの会衆[かいしゅう]全体[ぜんたい]の前[まえ]で、顔[かお]を地[ち]につけて伏[ふ]した。"
  6: "地[ち]を探[さぐ]った者[もの]のうち、ヌンの子[こ]ヨシュアとイェフォンネの子[こ]カレブは、自分[じぶん]たちの衣[ころも]を引[ひ]き裂[さ]いた。"
  7: "そして、イスラエルの子[こ]らの会衆[かいしゅう]全体[ぜんたい]に言[い]った。「わたしたちが探[さぐ]った地[ち]は、非常[ひじょう]に、非常[ひじょう]によい地[ち]です。"
  8: "主[しゅ]がわたしたちを愛[あい]してくださるなら、わたしたちをこの地[ち]に導[みちび]き入[い]れ、これをわたしたちに与[あた]えてくださるでしょう。そこは乳[ちち]と蜜[みつ]の流[なが]れる地[ち]です。"
  9: "ただ、主[しゅ]から離[はな]れて背[そむ]いてはなりません。その地[ち]の民[たみ]を恐[おそ]れてはなりません。彼[かれ]らはわたしたちの餌食[えじき]となるのです。彼[かれ]らを守[まも]る時[とき]は過[す]ぎ去[さ]り、主[しゅ]がわたしたちと共[とも]におられます。彼[かれ]らを恐[おそ]れてはなりません。」"
  10: "会衆[かいしゅう]は全体[ぜんたい]が、彼[かれ]らを石[いし]で打[う]ち殺[ころ]そうと言[い]った。すると、主[しゅ]の栄光[えいこう]が、証[あかし]の幕屋[まくや]の上[うえ]の雲[くも]の中[なか]に、イスラエルの子[こ]らすべての前[まえ]に現[あらわ]れた。"
  11: "主[しゅ]はモーセに言[い]われた。「この民[たみ]はいつまでわたしを怒[いか]らせるのか。わたしが彼[かれ]らの間[あいだ]で行[おこな]ったすべてのしるしを、彼[かれ]らはいつまで信[しん]じないのか。"
  12: "わたしは彼[かれ]らを災[わざわ]いで打[う]ち、滅[ほろ]ぼす。そして、あなたとあなたの父[ちち]の家[いえ]を、これよりも大[おお]きく多[おお]い民[たみ]とする。」"
  13: "モーセは主[しゅ]に言[い]った。「エジプト人[じん]が聞[き]くでしょう。あなたは力[ちから]をもってこの民[たみ]を彼[かれ]らの間[あいだ]から導[みちび]き上[あ]げられたのですから。"
  14: "また、この地[ち]に住[す]むすべての者[もの]も、あなたが主[しゅ]としてこの民[たみ]の間[あいだ]におられること、あなたが顔[かお]と顔[かお]を合[あ]わせて現[あらわ]れること、あなたの雲[くも]が彼[かれ]らの上[うえ]に立[た]ち、昼[ひる]は雲[くも]の柱[はしら]、夜[よる]は火[ひ]の柱[はしら]となって彼[かれ]らの前[まえ]を進[すす]まれることを聞[き]いています。"
  15: "もしあなたがこの民[たみ]を一[ひと]人[り]の人のように滅[ほろ]ぼされるなら、あなたの名[な]を聞[き]いたすべての民[たみ]々[びと]は言[い]うでしょう。"
  16: "『主[しゅ]はこの民[たみ]を、誓[ちか]われた地[ち]に導[みちび]き入[い]れることができなかったので、彼[かれ]らを荒野[こうや]で滅[ほろ]ぼされたのだ』と。"
  17: "どうか今[いま]、あなたが言[い]われたとおり、あなたの力[ちから]が高[たか]く上[あ]げられますように、主[しゅ]よ。"
  18: "『主[しゅ]は怒[おこ]りに遅[おそ]く、憐[あわ]れみ深[ふか]く、真実[しんじつ]であって、不法[ふほう]と不正[ふせい]と罪[つみ]を取[と]り除[のぞ]かれる。しかし、清[きよ]めによって罪[つみ]ある者[もの]を清[きよ]めることはなく、父[ちち]の罪[つみ]を子[こ]どもに、三[さん]代[だい]四[よん]代[だい]まで報[むく]いられる。』"
  19: "どうか、あなたの大[おお]きな憐[あわ]れみによって、この民[たみ]の罪[つみ]をお赦[ゆる]しください。あなたはエジプトから今[いま]に至[いた]るまで、彼[かれ]らに憐[あわ]れみ深[ふか]くあられました。」"
  20: "主[しゅ]はモーセに言[い]われた。「あなたの言葉[ことば]のとおり、わたしは彼[かれ]らを赦[ゆる]す。"
  21: "しかし、わたしは生[い]きている。わたしの名[な]も生[い]きている。主[しゅ]の栄光[えいこう]は全[ぜん]地[ち]に満[み]ちる。"
  22: "わたしの栄光[えいこう]と、わたしがエジプトとこの荒野[こうや]で行[おこな]ったしるしを見[み]ながら、なお十[じゅう]度[ど]もわたしを試[ため]み、わたしの声[こえ]に聞[き]き従[したが]わなかった者[もの]たちはみな、"
  23: "わたしが彼[かれ]らの父[ちち]たちに誓[ちか]った地[ち]を見[み]ることはない。しかし、わたしと共[とも]にここにいる彼[かれ]らの子[こ]ども、善[よ]いことも悪[わる]いことも知[し]らない者[もの]、すなわちまだ若[わか]く経験[けいけん]のない者[もの]には、わたしはこの地[ち]を与[あた]える。わたしを怒[いか]らせた者[もの]はみな、その地[ち]を見[み]ることはない。"
  24: "しかし、わたしの僕[しもべ]カレブには、彼[かれ]のうちに別[べつ]の霊[れい]があり、わたしに従[したが]ったので、わたしは彼[かれ]を、彼[かれ]が入[はい]った地[ち]に導[みちび]き入[い]れる。彼[かれ]の子孫[しそん]がその地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐであろう。"
  25: "アマレク人[じん]とカナン人[じん]は谷[たに]に住[す]んでいる。明日[あす]、あなたがたは引[ひ]き返[かえ]し、紅海[こうかい]への道[みち]を荒野[こうや]へ向[む]かって進[すす]みなさい。」"
  26: "主[しゅ]はモーセとアロンに語[かた]って言[い]われた。"
  27: "「この悪[わる]い会衆[かいしゅう]を、いつまで放[はな]っておけばよいのか。彼[かれ]らがわたしに逆[さか]らってつぶやく、そのつぶやきを、わたしは聞[き]いた。"
  28: "彼[かれ]らに言[い]いなさい。『わたしは生[い]きている』と主[しゅ]は言[い]われる。あなたがたがわたしの耳[みみ]に語[かた]ったとおりに、わたしはあなたがたに行[おこな]う。"
  29: "この荒野[こうや]で、あなたがたのしかばねは倒[たお]れる。あなたがたの数[かず]え上[あ]げられた者[もの]、あなたがたのうち数[かず]に入[はい]れられた者[もの]、すなわち二十歳[はたち]以上[いじょう]で、わたしにつぶやいた者[もの]はみな、倒[たお]れるのである。"
  30: "わたしが手[て]を伸[の]べて、あなたがたをそこに住[す]まわせようとした地[ち]に、あなたがたは入[はい]らない。ただ、イェフォンネの子[こ]カレブとヌンの子[こ]ヨシュアだけは別[べつ]である。"
  31: "あなたがたが『奪[うば]い取[と]られる』と言[い]ったあなたがたの子[こ]どもを、わたしはあの地[ち]に導[みちび]き入[い]れる。彼[かれ]らは、あなたがたが見捨[みす]てた地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐ。"
  32: "あなたがたのしかばねはこの荒野[こうや]に倒[たお]れる。"
  33: "あなたがたの子[こ]らは四十[よんじゅう]年[ねん]の間[あいだ]、荒野[こうや]をさまよう。あなたがたのしかばねが荒野[こうや]で滅[ほろ]びるまで、彼[かれ]らはあなたがたの淫[いん]行[こう]の責[せき]を負[お]う。"
  34: "あなたがたが地[ち]を探[さぐ]った日[ひ]の数[かず]、すなわち四十日[よんじゅうにち]に従[したが]って、一日[いちにち]を一年[いちねん]として、あなたがたは四十[よんじゅう]年[ねん]の間[あいだ]、自分[じぶん]の罪[つみ]を負[お]う。そして、わたしの激[はげ]しい怒[いか]りを知[し]るであろう。"
  35: "わたしは主[しゅ]である。わたしは語[かた]った。わたしに逆[さか]らって立[た]ったこの悪[わる]い会衆[かいしゅう]に、まさにこのとおりに行[おこな]う。この荒野[こうや]で彼[かれ]らは滅[ほろ]び尽[つ]き、そこで死[し]ぬ。」"
  36: "モーセが地[ち]を探[さぐ]らせるために遣[つか]わした人[ひと]々[びと]は、帰[かえ]って来[き]て、その地[ち]について会衆[かいしゅう]の前[まえ]でつぶやき、地[ち]について悪[わる]い言葉[ことば]を広[ひろ]めた。"
  37: "地[ち]について悪[わる]いことを語[かた]ったこれらの人[ひと]々[びと]は、主[しゅ]の前[まえ]で災[わざわ]いによって死[し]んだ。"
  38: "ただ、ヌンの子[こ]ヨシュアとイェフォンネの子[こ]カレブは、地[ち]を探[さぐ]りに行[い]った者[もの]たちのうちで生[い]き残[のこ]った。"
  39: "モーセはこれらの言葉[ことば]をすべてのイスラエルの子[こ]らに語[かた]った。民[たみ]は深[ふか]く悲[かな]しんだ。"
  40: "彼[かれ]らは朝早[あさはや]く起[お]きて、山[やま]の頂[いただき]に上[のぼ]って行[い]き、言[い]った。「さあ、わたしたちは、主[しゅ]が言[い]われた所[ところ]へ上[のぼ]って行[い]こう。わたしたちは罪[つみ]を犯[おか]したのだ。」"
  41: "モーセは言[い]った。「なぜ、あなたがたは主[しゅ]の言葉[ことば]に背[そむ]くのか。それは成功[せいこう]しない。"
  42: "上[のぼ]って行[い]ってはならない。主[しゅ]はあなたがたと共[とも]におられない。あなたがたは敵[てき]の前[まえ]で倒[たお]れるであろう。"
  43: "アマレク人[じん]とカナン人[じん]がそこであなたがたの前[まえ]にいるからだ。あなたがたは剣[つるぎ]で倒[たお]れる。あなたがたは主[しゅ]に従[したが]わずに背[そむ]いたので、主[しゅ]はあなたがたと共[とも]におられない。」"
  44: "しかし、彼[かれ]らは強[し]いて山[やま]の頂[いただき]に上[のぼ]った。主[しゅ]の契約[けいやく]の箱[はこ]とモーセは、宿営[しゅくえい]から動[うご]かなかった。"
  45: "アマレク人[じん]と、その山[やま]に住[す]むカナン人[じん]が下[お]りて来[き]て、彼[かれ]らを打[う]ち破[やぶ]り、エルマンまで切[き]り倒[たお]した。そして、宿営[しゅくえい]に戻[もど]った。"

notes:
  1: "ἀναλαβοῦσα … ἔδωκεν φωνήν — «подняв, дало голос», т. е. подняло вопль (ἀναλαμβάνω). ἔκλαιεν ὁ λαὸς ὅλην τὴν νύκτα ἐκείνην — плакал народ всю ту ночь."
  2: "διεγόγγυζον — роптали (διαγογγύζω, imperfect). Ὄφελον ἀπεθάνομεν — «о, если бы мы умерли» (ὄφελον с аористом выражает неисполнимое желание). εἰ ἀπεθάνομεν — «если бы умерли» (повтор того же пожелания)."
  3: "ἵνα τί — «для чего». πεσεῖν ἐν πολέμῳ — пасть на войне. εἰς διαρπαγήν — в разграбление, 奪い取られる (διαρπαγή). βέλτιον ἡμῖν ἐστιν — лучше нам (βελτίων)."
  4: "ἕτερος τῷ ἑτέρῳ — друг другу (ἕτερος … ἑτέρῳ). Δῶμεν ἀρχηγόν — поставим начальника (δίδομι, конъюнктив)."
  5: "ἔπεσεν … ἐπὶ πρόσωπον — пали на лицо (ἐπὶ πρόσωπον, без «своего»). ἐναντίον πάσης συναγωγῆς — пред всем обществом."
  6: "Ἰησοῦς δὲ ὁ τοῦ Ναυη — Иисус, [сын] Навин (артикль с родительным отца). διέρρηξαν τὰ ἱμάτια — разодрали одежды (знак скорби)."
  7: "κατεσκεψάμεθα — мы осмотрели (κατασκέπτομαι). ἀγαθὴ σφόδρα σφόδρα — хороша весьма, весьма (удвоение наречия)."
  8: "εἰ αἱρετίζει ἡμᾶς κύριος — «если Господь благоволит к нам» (αἱρετίζω — избирать, любить; слав. «любит»). γῆ ῥέουσα γάλα καὶ μέλι — земля, текущая молоком и мёдом."
  9: "ἀπὸ τοῦ κυρίου μὴ ἀποστάται γίνεσθε — не будьте отступниками от Господа (ἀποστάτης). κατάβρωμα ἡμῖν ἐστιν — «пища для нас», т. е. мы их одолеем (κατάβρωμα). ἀφέστηκεν ὁ καιρὸς ἀπ᾽ αὐτῶν — «отошло время от них» (καιρός здесь — пора защиты, покровительства; Син. «защиты у них не стало»). ὁ κύριος ἐν ἡμῖν — Господь с нами."
  10: "καταλιθοβολῆσαι — побить камнями (καταλιθοβολέω, инфинитив цели при εἶπεν). ἡ δόξα κυρίου ὤφθη ἐν νεφέλῃ — слава Господня явилась в облаке."
  11: "παροξύνει — раздражает (παροξύνω, present). ἕως τίνος — доколе (дважды). ἐν πᾶσιν τοῖς σημείοις, οἷς ἐποίησα — при всех знамениях, которые Я сделал."
  12: "πατάξω αὐτοὺς θανάτῳ — поражу их смертью (πατάσσω + θανάτῳ, гебраизм). ἀπολῶ — истреблю (ἀπόλλυμι). εἰς ἔθνος μέγα — в народ великий."
  13: "ἀνήγαγες τῇ ἰσχύι σου — вывел силою Твоею (ἀνάγω). ἐξ αὐτῶν — из среды их, т. е. из Египта."
  14: "ὀφθαλμοῖς κατ᾽ ὀφθαλμοὺς ὀπτάζῃ — «очами с очами являешься», т. е. лицом к лицу (ὀπτάζομαι — редкий глагол «являться»). ἐν στύλῳ νεφέλης … ἐν στύλῳ πυρός — в столпе облачном и огненном (στῦλος)."
  15: "ἐκτρίψεις ὡσεὶ ἄνθρωπον ἕνα — истребишь, как одного человека (ἐκτρίβω). ὅσοι ἀκηκόασιν τὸ ὄνομά σου — все, кто слышал имя Твоё (perfect ἀκούω)."
  16: "Παρὰ τὸ μὴ δύνασθαι — «из-за того, что не мог» (παρά с винительным + инфинитив). κατέστρωσεν — «поверг» (καταστρώννυμι), т. е. погубил. Слова народов — 『…』 внутри речи Моисея."
  17: "ὑψωθήτω ἡ ἰσχύς σου — да возвысится сила Твоя (слав. «да вознесется рука твоя»). ὃν τρόπον εἶπας — как Ты сказал."
  18: "Цитата Исх 34:6–7 (слова Бога внутри речи Моисея — 『…』). μακρόθυμος — долготерпеливый; πολυέλεος — многомилостивый; ἀληθινός — истинный. καθαρισμῷ οὐ καθαριεῖ τὸν ἔνοχον — «очищением не очистит виновного» (удвоение, гебраизм). ἀποδιδοὺς ἁμαρτίας πατέρων ἐπὶ τέκνα — воздающий грехи отцов детям; ἕως τρίτης καὶ τετάρτης — до третьего и четвёртого [рода]."
  19: "ἄφες — прости (ἀφίημι, императив). κατὰ τὸ μέγα ἔλεός σου — по великой милости Твоей. ἵλεως … ἐγένου — был милостив (ἵλεως)."
  20: "Ἵλεως αὐτοῖς εἰμι — «милостив им есмь», т. е. прощаю (ἵλεως εἰμί). κατὰ τὸ ῥῆμά σου — по слову твоему."
  21: "ζῶ ἐγὼ — «жив Я» (клятвенная формула). ζῶν τὸ ὄνομά μου — живо имя Моё. ἐμπλήσει ἡ δόξα κυρίου πᾶσαν τὴν γῆν — наполнит слава Господня всю землю."
  22: "τοῦτο δέκατον — «это десятое», т. е. уже десятый раз (ἐπείρασαν — искушали). οὐκ εἰσήκουσάν μου τῆς φωνῆς — не послушали голоса Моего (εἰσακούω с родительным)."
  23: "ἦ μὴν οὐκ ὄψονται — истинно не увидят (ἦ μήν — клятвенное утверждение). πᾶς νεώτερος ἄπειρος — всякий юный, неопытный (ἄπειρος). τούτοις δώσω — им дам."
  24: "ὁ παῖς μου — раб Мой (παῖς). πνεῦμα ἕτερον — иной дух. ἐπηκολούθησέν μοι — последовал за Мною (ἐπακολουθέω). τὸ σπέρμα αὐτοῦ κληρονομήσει — семя его наследует."
  25: "κοιλάς — долина, 谷. ἐπιστράφητε … καὶ ἀπάρατε — обратитесь и откочуйте (ἀπάρω — сниматься со стоянки). ὁδὸν θάλασσαν ἐρυθράν — «путём к Чермному морю» (двойной винительный)."
  26: "εἶπεν κύριος πρὸς Μωυσῆν καὶ Ααρων λέγων — 主はモーセとアロンに語って言われた (обращение к обоим)."
  27: "Ἕως τίνος τὴν συναγωγὴν τὴν πονηρὰν ταύτην; — эллипсис: «доколе [терпеть] это злое общество?». ἃ αὐτοὶ γογγύζουσιν — то, что они ропщут (относительное с аттракцией). γόγγυσιν … ἀκήκοα — ропот Я услышал (perfect)."
  28: "Ζῶ ἐγώ, λέγει κύριος — «жив Я, говорит Господь» (пророческая формула). ἦ μὴν ὃν τρόπον λελαλήκατε εἰς τὰ ὦτά μου — истинно, как вы говорили в уши Мои. Слова, которые Бог велит передать народу, — 『…』, закрыты после клятвенной формулы (как в церковном чтении)."
  29: "τὰ κῶλα ὑμῶν — «члены ваши», т. е. трупы (κῶλον; слав. «телеса»). πᾶσα ἡ ἐπισκοπή — всё исчисленное (ἐπισκοπή — «перепись, смотр»; слав. «соглядание»). κατηριθμημένοι — сочтённые (καταριθμέω). ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — от двадцати лет и выше."
  30: "εἰ ὑμεῖς εἰσελεύσεσθε — «если вы войдёте» в клятвенном обороте, т. е. не войдёте (εἰ с будущим = отрицание). ἐξέτεινα τὴν χεῖρά μου — простёр руку Мою (клятва). ἀλλ᾽ ἢ — «кроме»."
  31: "ἐν διαρπαγῇ ἔσεσθαι — «будут в разграбление». ἀπέστητε ἀπ᾽ αὐτῆς — отступили от неё, т. е. презрели (ἀφίστημι)."
  32: "τὰ κῶλα ὑμῶν πεσεῖται — трупы ваши падут (ср. ст. 29)."
  33: "νεμόμενοι — «пасомые», т. е. кочующие (νέμω, медиопассив). ἀνοίσουσιν τὴν πορνείαν ὑμῶν — понесут ваше блудодеяние (ἀναφέρω; πορνεία — измена Богу). ἕως ἂν ἀναλωθῇ — доколе не истребятся (ἀναλίσκω)."
  34: "κατὰ τὸν ἀριθμὸν τῶν ἡμερῶν — по числу дней. ἡμέραν τοῦ ἐνιαυτοῦ — «день года», т. е. день за год. λήμψεσθε τὰς ἁμαρτίας — понесёте грехи (λαμβάνω). γνώσεσθε τὸν θυμὸν τῆς ὀργῆς μου — узнаете ярость гнева Моего (удвоение θυμός/ὀργή; Син. добавляет «быть оставленным Мною» — от евр., в LXX нет)."
  35: "ἐγὼ κύριος ἐλάλησα — Я, Господь, сказал. τῇ ἐπισυνεσταμένῃ ἐπ᾽ ἐμέ — восставшему на Меня (ἐπισυνίστημι). ἐξαναλωθήσονται — будут истреблены (ἐξαναλίσκω)."
  36: "παραγενηθέντες — придя (παραγίνομαι). διεγόγγυσαν κατ᾽ αὐτῆς — возроптали на неё. ἐξενέγκαι ῥήματα πονηρά — вынести злые слова (ἐκφέρω); в LXX оборот шероховат, Синодальный его сглаживает."
  37: "ἐν τῇ πληγῇ ἔναντι κυρίου — язвою пред Господом (πληγή — 災い; ср. 14:12 πατάξω θανάτῳ)."
  38: "ἔζησαν ἀπὸ τῶν ἀνθρώπων ἐκείνων — остались живы из тех людей (ζάω). τῶν πεπορευμένων κατασκέψασθαι — ходивших осматривать (perfect)."
  39: "ἐπένθησεν ὁ λαὸς σφόδρα — народ сильно восскорбел (πενθέω)."
  40: "ὀρθρίσαντες τὸ πρωί — встав рано поутру (ὀρθρίζω). Ἰδοὺ οἵδε ἡμεῖς ἀναβησόμεθα — «вот, мы взойдём» (эмфатическое οἵδε ἡμεῖς). ὅτι ἡμάρτομεν — ибо мы согрешили."
  41: "Ἵνα τί … παραβαίνετε — для чего преступаете (παραβαίνω). οὐκ εὔοδα ἔσται ὑμῖν — не будет успеха (εὔοδος — «благополучный»)."
  42: "μὴ ἀναβαίνετε — не восходите. οὐ γάρ ἐστιν κύριος μεθ᾽ ὑμῶν — ибо нет Господа с вами. πεσεῖσθε πρὸ προσώπου τῶν ἐχθρῶν — падёте пред лицом врагов."
  43: "ἔμπροσθεν ὑμῶν — пред вами. πεσεῖσθε μαχαίρᾳ — падёте от меча (μαχαίρᾳ — датив орудия). οὗ εἵνεκεν ἀπεστράφητε ἀπειθοῦντες κυρίῳ — ибо вы отвратились, не покоряясь Господу (ἀπειθέω)."
  44: "διαβιασάμενοι — «принудив себя», дерзнув (διαβιάζομαι). κιβωτὸς τῆς διαθήκης — ковчег завета. οὐκ ἐκινήθησαν ἐκ τῆς παρεμβολῆς — не двинулись из стана."
  45: "κατέβη … ὁ ἐγκαθήμενος ἐν τῷ ὄρει — сошёл живущий на горе той. ἐτρέψαντο — обратили в бегство (τρέπω). κατέκοψαν — изрубили (κατακόπτω). ἕως Ερμαν — до Ермана (Син. «Хорма»; евр. Хорма). ἀπεστράφησαν εἰς τὴν παρεμβολήν — возвратились в стан; подлежащее неясно (Син. опускает)."
