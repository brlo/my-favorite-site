# jp-box, Исход, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — csl-ru и jp-joc (1901, PD; в этой главе
# фрагментами). ru (с масоретского) — только для понимания, его чтения не вносим.
# Язык — современный 常体, порядок членов — по греческому.
# Глава 2: рождение Моисея и корзина в реке (1–4), дочь фараона (5–10),
# убийство египтянина и бегство в Мадиам (11–15), колодец, дочери Иофора (16–22),
# стенание народа и память Бога о завете (23–25).
# Красного и синего нет: прямая речь — людей (в 2:24–25 Бог не говорит).
# 〔…〕: 2:22 — вторая половина стиха (рождение Елиезера) есть в csl-ru и jp-joc,
# но отсутствует в gr-lxx-byz (проверено по базе: «ελιεζερ» — НЕТ), поэтому целиком в скобках.
# Сносок ⟨…⟩ нет: 葦, 井戸, 寄留 уже в корпусе; 乳母 понятно по контексту.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 2
draft: true

verses:
  1: "レビの部族[ぶぞく]の者[もの]が一人[ひとり]、レビの娘[むすめ]たちのうちから妻[つま]を迎[むか]えた。"
  2: "女[おんな]は身[み]ごもり、男[おとこ]の子[こ]を産[う]んだ。その子[こ]が美[うつく]しいのを見[み]て、三[さん]か月[げつ]の間[あいだ]、隠[かく]していた。"
  3: "しかし、もはや隠[かく]しきれなくなったので、葦[あし]の箱[はこ]を用意[ようい]し、それにアスファルトと瀝青[れきせい]を塗[ぬ]って、子[こ]をその中[なか]に入[い]れ、川[かわ]べの葦[あし]の茂[しげ]みの中[なか]に置[お]いた。"
  4: "その姉[あね]は、彼[かれ]に何[なに]が起[お]こるかを見[み]ようとして、遠[とお]くから見張[みは]っていた。"
  5: "ファラオの娘[むすめ]が、ナイル川[がわ]で身[み]を洗[あら]おうとして下[お]りて来[き]た。侍女[じじょ]たちは川[かわ]べを歩[ある]いていた。娘[むすめ]は葦[あし]の茂[しげ]みの中[なか]の箱[はこ]を見[み]つけると、侍女[じじょ]を遣[つか]わしてそれを取[と]り寄[よ]せた。"
  6: "蓋[ふた]を開[あ]けると、中[なか]には泣[な]いている子[こ]がいた。ファラオの娘[むすめ]はその子[こ]を気[き]の毒[どく]に思[おも]って言[い]った。「これはヘブライ人[じん]の子[こ]どもの一人[ひとり]だ。」"
  7: "そのとき、姉[あね]がファラオの娘[むすめ]に言[い]った。「わたしが行[い]って、ヘブライ人[じん]の女[おんな]の中[なか]から、あなたのためにその子[こ]に乳[ちち]を飲[の]ませる乳母[うば]を呼[よ]んで参[まい]りましょうか。」"
  8: "ファラオの娘[むすめ]は言[い]った。「ぜひ、そうして。」少女[しょうじょ]は行[い]って、その子[こ]の母[はは]を呼[よ]んだ。"
  9: "ファラオの娘[むすめ]は母[はは]に言[い]った。「この子[こ]を連[つ]れて行[い]き、わたしのために乳[ちち]を飲[の]ませてください。わたしがあなたに報酬[ほうしゅう]を払[はら]います。」女[おんな]は子[こ]を連[つ]れて行[い]き、乳[ちち]を飲[の]ませた。"
  10: "子[こ]が育[そだ]つと、母[はは]はその子[こ]をファラオの娘[むすめ]のところへ連[つ]れて行[い]った。子[こ]は娘[むすめ]の息子[むすこ]となった。娘[むすめ]はその名[な]をモーセと名[な]づけて言[い]った。「わたしが水[みず]から引[ひ]き上[あ]げた者[もの]だからである。」"
  11: "そのころ、モーセはすでに大[おお]きくなっていた。彼[かれ]は兄弟[きょうだい]であるイスラエルの子[こ]らのところへ出[で]て行[い]き、彼[かれ]らの苦[くる]しみを見[み]た。すると、エジプト人[じん]が、自分[じぶん]の兄弟[きょうだい]であるイスラエルの子[こ]らの一人[ひとり]を打[う]っているのが見[み]えた。"
  12: "モーセはあちこち見回[みまわ]して、だれもいないのを確[たし]かめると、そのエジプト人[じん]を打[う]ち殺[ころ]し、砂[すな]の中[なか]に隠[かく]した。"
  13: "翌日[よくじつ]また出[で]て行[い]くと、二人[ふたり]のヘブライ人[じん]が争[あらそ]っていた。モーセは悪[わる]いことをしている方[ほう]に言[い]った。「なぜあなたは仲間[なかま]を打[う]つのか。」"
  14: "その人[ひと]は言[い]った。「だれがあなたを立[た]てて、わたしたちの支配者[しはいしゃ]や裁[さば]き手[て]にしたのか。あなたは、あのエジプト人[じん]を殺[ころ]したように、わたしも殺[ころ]そうというのか。」モーセは恐[おそ]れて言[い]った。「このことが、まさか知[し]られてしまったのか。」"
  15: "ファラオはこのことを聞[き]いて、モーセを殺[ころ]そうと求[もと]めた。そこでモーセはファラオの前[まえ]から逃[に]げ出[だ]し、ミディアンの地[ち]に住[す]んだ。彼[かれ]はミディアンの地[ち]に来[き]て、井戸[いど]のそばに座[すわ]った。"
  16: "ミディアンの祭司[さいし]には七人[しちにん]の娘[むすめ]がいて、父[ちち]エテロの羊[ひつじ]を飼[か]っていた。彼女[かのじょ]らは来[き]て水[みず]を汲[く]み、水槽[すいそう]を満[み]たして、父[ちち]エテロの羊[ひつじ]に飲[の]ませようとしていた。"
  17: "牧[ぼく]者[しゃ]たちが来[き]て彼女[かのじょ]らを追[お]い払[はら]ったので、モーセは立[た]ち上[あ]がって助[たす]け、水[みず]を汲[く]んで彼女[かのじょ]らの羊[ひつじ]に飲[の]ませた。"
  18: "彼女[かのじょ]らは父[ちち]ラグエルのところへ帰[かえ]った。父[ちち]は言[い]った。「どうして今日[きょう]はこんなに早[はや]く帰[かえ]って来[き]たのか。」"
  19: "彼女[かのじょ]らは言[い]った。「エジプト人[じん]が一人[ひとり]、牧[ぼく]者[しゃ]たちからわたしたちを助[たす]けてくれました。その人[ひと]はわたしたちのために水[みず]を汲[く]んで、羊[ひつじ]に飲[の]ませてくれました。」"
  20: "父[ちち]は娘[むすめ]たちに言[い]った。「その人[ひと]はどこにいるのか。なぜ置[お]き去[ざ]りにしてきたのか。呼[よ]んで来[き]て、パンを食[た]べさせなさい。」"
  21: "モーセはその人[ひと]のところに住[す]んだ。その人[ひと]は娘[むすめ]ツィポラをモーセに与[あた]えて妻[つま]とした。"
  22: "女[おんな]は身[み]ごもって男[おとこ]の子[こ]を産[う]んだ。モーセはその名[な]をゲルサムと名[な]づけて言[い]った。「わたしは異国[いこく]の地[ち]に寄[き]留[りゅう]する者[もの]だからである。」〔また身[み]ごもって次[つぎ]の子[こ]を産[う]み、その名[な]をエリエゼルと名[な]づけて言[い]った。「わたしの父[ちち]の神[かみ]はわたしの助[たす]けとなり、わたしをファラオの手[て]から救[すく]い出[だ]されたからである。」〕"
  23: "それから長[なが]い年月[としつき]が過[す]ぎて、エジプトの王[おう]は死[し]んだ。イスラエルの子[こ]らは労働[ろうどう]のゆえに呻[うめ]き、叫[さけ]んだ。彼[かれ]らの叫[さけ]びは労働[ろうどう]のゆえに神[かみ]に届[とど]いた。"
  24: "神[かみ]は彼[かれ]らの呻[うめ]きを聞[き]かれ、神[かみ]はアブラハム、イサク、ヤコブとの契約[けいやく]を思[おも]い起[お]こされた。"
  25: "神[かみ]はイスラエルの子[こ]らを顧[かえり]みられた。こうして、神[かみ]は彼[かれ]らに知[し]られる者[もの]となった。"

notes:
  1: "Ἦν δέ τις ἐκ τῆς φυλῆς Λευι — レビの部族の者が一人. ὃς ἔλαβεν τῶν θυγατέρων Λευι — レビの娘たちのうちから妻を迎えた (букв. «взял из дочерей Леви»)."
  2: "ἐν γαστρὶ ἔλαβεν — 身ごもり. ἀστεῖον — 美しい (букв. «видный, статный»). ἐσκέπασαν αὐτὸ μῆνας τρεῖς — 三か月の間隠していた (σκέπω — «покрывать, скрывать»; мн. ч. — оба родителя)."
  3: "θῖβιν — 葦の箱 (θῖβις — «корзинка»; слав. «ковчежец»). ἀσφαλτοπίσσῃ — アスファルトと瀝青 (ἀσφαλτόπισσα — смолистая замазка). εἰς τὸ ἕλος παρὰ τὸν ποταμόν — 川べの葦の茂みの中 (ἕλος — «заводь, болотистое место»; ὁ ποταμός — Нил)."
  4: "κατεσκόπευεν — 見張っていた (κατασκοπεύω — «наблюдать»). τί τὸ ἀποβησόμενον αὐτῷ — 彼に何が起こるか."
  5: "αἱ ἅβραι αὐτῆς — 侍女たち (ἅβρα — «прислужница»). ἀνεῖλατο — 取り寄せた (ἀναιρέω — «поднять, взять»)."
  6: "ἐφείσατο αὐτοῦ — 気の毒に思って (φείδομαι — «щадить, жалеть»). Ἀπὸ τῶν παιδίων τῶν Εβραίων τοῦτο — これはヘブライ人の子どもの一人だ."
  7: "Θέλεις καλέσω σοι γυναῖκα τροφεύουσαν — 乳母を呼んで参りましょうか (τροφεύω — «кормить, вскармливать»)."
  8: "ἡ νεᾶνις — 少女 (νεᾶνις — «девушка»)."
  9: "Διατήρησόν μοι τὸ παιδίον — この子を連れて行き… (διατηρέω — «сберечь»). τὸν μισθόν — 報酬 (μισθός — «плата»)."
  10: "ἁδρυνθέντος δὲ τοῦ παιδίου — 子が育つと (ἁδρύνω — «возмужать»). Ἐκ τοῦ ὕδατος αὐτὸν ἀνειλόμην — 水から引き上げた者 (народная этимология имени מֹשֶׁה, «вынутый»)."
  11: "μέγας γενόμενος Μωϋσῆς — モーセはすでに大きくなっていた. τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ισραηλ — 兄弟であるイスラエルの子ら. κατανοήσας τὸν πόνον αὐτῶν — 彼らの苦しみを見た (πόνος — «труд, страдание»)."
  12: "περιβλεψάμενος ὧδε καὶ ὧδε — あちこち見回して. πατάξας — 打ち殺し (πατάσσω — «поражать»). ἐν τῇ ἄμμῳ — 砂の中に."
  13: "διαπληκτιζομένους — 争っていた (διαπληκτίζομαι — «ссориться, драться»). τῷ ἀδικοῦντι — 悪いことをしている方に (ἀδικέω — «обижать»)."
  14: "μὴ ἀνελεῖν με σὺ θέλεις… — わたしも殺そうというのか. ἐφοβήθη δὲ Μωϋσῆς — モーセは恐れて. Εἰ οὕτως ἐμφανὲς γέγονεν τὸ ῥῆμα τοῦτο; — このことが、まさか知られてしまったのか (ἐμφανής — «явный»)."
  15: "ἐζήτει ἀνελεῖν Μωυσῆν — モーセを殺そうと求めた. ἀνεχώρησεν — 逃げ出し (ἀναχωρέω — «удаляться»). ἐπὶ τοῦ φρέατος — 井戸のそばに (φρέαρ — «колодец»)."
  16: "τῷ δὲ ἱερεῖ Μαδιαμ — ミディアンの祭司には (ἱερεύς — «священник»). Ιοθορ — エテロ (греч. Ἰοθόρ; слав. «Иофор»). παραγενόμεναι δὲ ἤντλουν — 来て水を汲み (ἀντλέω). τὰς δεξαμενάς — 水槽 (δεξαμενή — «водоём»)."
  17: "ἐξέβαλον αὐτάς — 追い払った. ἐρρύσατο — 助け (ῥύομαι — «избавлять»)."
  18: "πρὸς Ραγουηλ τὸν πατέρα αὐτῶν — 父ラグエルのところへ (греч. Ραγουηλ; то же лицо, что Ιοθορ/エテロ в 2:16 и 3:1, но LXX называет его иначе — оба имени сохранены). ἐταχύνατε — 早く帰って来た (ταχύνω — «спешить»)."
  19: "Ἄνθρωπος Αἰγύπτιος — エジプト人が一人 (без имени: дочери не знают, кто он)."
  20: "καὶ ποῦ ἐστι; — その人はどこにいるのか. ἵνα τί οὕτως καταλελοίπατε τὸν ἄνθρωπον; — なぜ置き去りにしてきたのか. ὅπως φάγῃ ἄρτον — パンを食べさせなさい (букв. «чтобы он поел хлеба»)."
  21: "κατῳκίσθη δὲ Μωϋσῆς παρὰ τῷ ἀνθρώπῳ — モーセはその人のところに住んだ (каузатив-пассив; в масоретском тексте «Моисею понравилось жить», это чтение не берём). ἐξέδοτο Σεπφωραν τὴν θυγατέρα αὐτοῦ Μωϋσῇ γυναῖκα — 娘ツィポラをモーセに与えて妻とした (Σεπφωρα — ツィポラ, современная форма; в LXX так же пишется имя повивальной бабки в 1:15, там — シフラ)."
  22: "Γηρσαμ — ゲルサム (греч.; евр. Гирсам). Πάροικος εἰμι ἐν γῇ ἀλλοτρίᾳ — 異国の地に寄留する者 (πάροικος — «пришелец»). Вторая половина стиха (Ελιεζερ и слова о Боге отца) есть в csl-ru и jp-joc, но в gr-lxx-byz её нет — поэтому 〔…〕."
  23: "κατεστέναξαν — 呻き (καταστενάζω — «стонать»). ἀνεβόησαν — 叫んだ (ἀναβοάω). ἀνέβη ἡ βοὴ αὐτῶν πρὸς τὸν θεόν — 叫びは…神に届いた."
  24: "εἰσήκουσεν ὁ θεὸς τὸν στεναγμόν — 呻きを聞かれ (στεναγμός — «стон»). ἐμνήσθη… τῆς διαθήκης — 契約を思い起こされた (διαθήκη — «завет»)."
  25: "ἐπεῖδεν ὁ θεὸς τοὺς υἱοὺς Ισραηλ — 神は…顧みられた (ἐφοράω — «призреть»). ἐγνώσθη αὐτοῖς — 彼らに知られる者となった (пассив; слав. «познан бысть ими»; в масоретском тексте «призрел их Бог»)."
