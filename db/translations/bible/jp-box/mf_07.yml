verses:
  1: "「<j>裁[さば]いてはならない。あなたがたが裁[さば]かれないためである。</j>"
  2: "<j>あなたがたが裁[さば]くその裁[さば]きで、あなたがたは裁[さば]かれ、あなたがたが量[はか]るその秤[はかり]で、あなたがたは量[はか]り与[あた]えられる。</j>"
  3: "<j>兄弟[きょうだい]の目[め]にある小[ちい]さな木[き]くずには気[き]づくのに、なぜ自分[じぶん]の目[め]の梁[はり]は見[み]えないのか。</j>"
  4: "<j>どうして兄弟[きょうだい]に『目[め]の木[き]くずを取[と]らせてくれ』と言[い]えるのか。自分[じぶん]の目[め]には梁[はり]が入[はい]っているというのに。</j>"
  5: "<j>偽善者[ぎぜんしゃ]よ。まず、自分[じぶん]の目[め]から梁[はり]を抜[ぬ]き取[と]れ。そうしてこそ、兄弟[きょうだい]の目[め]の木[き]くずを取[と]り除[のぞ]けるようになる。</j>」"
  6: "「<j>聖[せい]なるものを犬[いぬ]に与[あた]えるな。真珠[しんじゅ]を豚[ぶた]の前[まえ]に放[ほう]るな。足[あし]で踏[ふ]みにじったうえ、振[ふ]り向[む]いてあなたがたを引[ひ]き裂[さ]きかねないからだ。</j>」"
  7: "「<j>求[もと]めよ。そうすれば与[あた]えられる。探[さが]せよ。そうすれば見[み]いだす。戸[と]を叩[たた]けよ。そうすれば開[ひら]かれよう。</j>"
  8: "<j>求[もと]める者[もの]はだれでも受[う]け取[と]り、探[さが]す者[もの]は必[かなら]ず見[み]いだし、戸[と]を叩[たた]く者[もの]には開[ひら]かれる。</j>"
  9: "<j>あなたがたのうち、だれが、自分[じぶん]の子[こ]がパンを求[もと]めるのに、その子[こ]に石[いし]を与[あた]えるだろうか。</j>"
  10: "<j>また、魚[さかな]を求[もと]めるのに、蛇[へび]を与[あた]えるだろうか。</j>"
  11: "<j>あなたがたは悪[わる]い者[もの]でも、子[こ]どもには良[よ]い物[もの]を与[あた]える術[すべ]を知[し]っている。まして、天[てん]におられるあなたがたの父[ちち]が、願[ねが]い求[もと]める者[もの]に良[よ]い物[もの]を下[くだ]さらないことがあろうか。</j>」"
  12: "「<j>だから、人[ひと]にしてほしいとあなたがたが思[おも]うことは、そのまま人[ひと]にもしてやりなさい。律法[りっぽう]と預言者[よげんしゃ]とは、これに尽[つ]きる。</j>」"
  13: "「<j>狭[せま]い門[もん]を通[とお]って入[はい]りなさい。滅[ほろ]びに至[いた]る門[もん]は幅[はば]が広[ひろ]く、道[みち]もゆったりしていて、そこから入[はい]る者[もの]は多[おお]い。</j>"
  14: "<j>命[いのち]に至[いた]る門[もん]は、なんと狭[せま]いことか。そこへ続[つづ]く道[みち]は、なんと細[ほそ]いことか。しかも、それを見[み]つける者[もの]は少[すく]ない。</j>」"
  15: "「<j>偽預言者[ぎよげんしゃ]には用心[ようじん]しなさい。羊[ひつじ]の衣[ころも]を着[き]て近[ちか]づいてくるが、内[うち]は欲[よく]深[ぶか]い狼[おおかみ]である。</j>"
  16: "<j>彼[かれ]らがどんな者[もの]かは、結[むす]ぶ実[み]を見[み]れば分[わ]かる。茨[いばら]にぶどうが、あざみにいちじくがなろうか。</j>"
  17: "<j>良[よ]い木[き]は良[よ]い実[み]をつけ、腐[くさ]った木[き]は悪[わる]い実[み]をつける。</j>"
  18: "<j>良[よ]い木[き]が悪[わる]い実[み]をつけることはありえず、腐[くさ]った木[き]が良[よ]い実[み]をつけることもありえない。</j>"
  19: "<j>良[よ]い実[み]をつけない木[き]はどれも、切[き]り倒[たお]されて火[ひ]の中[なか]に投[な]げ込[こ]まれる。</j>"
  20: "<j>だから、彼[かれ]らを見分[みわ]けるよりどころは、その実[み]である。</j>」"
  21: "「<j>『主[しゅ]よ、主[しゅ]よ』とわたしを呼[よ]ぶ者[もの]が、みな天[てん]の国[くに]に入[はい]るのではない。天[てん]におられるわたしの父[ちち]の御心[みこころ]を行[おこな]う者[もの]こそ、入[はい]るのである。</j>"
  22: "<j>かの日[ひ]には、多[おお]くの者[もの]がわたしに『主[しゅ]よ、主[しゅ]よ。わたしたちはあなたの名[な]によって預言[よげん]し、あなたの名[な]によって悪霊[あくりょう]を追[お]い出[だ]し、あなたの名[な]によって多[おお]くの奇跡[きせき]を行[おこな]ったではないか』と言[い]うであろう。</j>"
  23: "<j>そのとき、わたしは彼[かれ]らにはっきり告[つ]げる。『あなたがたのことは、これまで一度[いちど]も知[し]ったことがない。不法[ふほう]を働[はたら]く者[もの]よ、わたしから遠[とお]ざかれ。』</j>」"
  24: "「<j>だから、わたしのこれらの言葉[ことば]を聞[き]いて行[おこな]う者[もの]は、岩[いわ]の上[うえ]に家[いえ]を構[かま]えた思慮[しりょ]深[ぶか]い人[ひと]のようなものである。</j>"
  25: "<j>雨[あめ]が降[ふ]り、川[かわ]が溢[あふ]れ、風[かぜ]が吹[ふ]いても、その家[いえ]は倒[たお]れなかった。土台[どだい]が岩[いわ]の上[うえ]に据[す]えられていたからだ。</j>"
  26: "<j>わたしのこれらの言葉[ことば]を聞[き]いても実行[じっこう]しない者[もの]は、砂[すな]の上[うえ]に家[いえ]を構[かま]えた愚[おろ]かな人[ひと]のようなものである。</j>"
  27: "<j>雨[あめ]が降[ふ]り、川[かわ]が増水[ぞうすい]し、風[かぜ]が吹[ふ]きつけてその家[いえ]を打[う]った。家[いえ]は倒[たお]れ、その崩[くず]れ方[かた]はひどいものだった。</j>」"
  28: "イエスがこの話[はなし]を語[かた]り終[お]えると、群衆[ぐんしゅう]はその教[おし]えに息[いき]を呑[の]んだ。"
  29: "というのも、イエスの教[おし]えには、律法学者[りっぽうがくしゃ]たちのそれとは違[ちが]う権威[けんい]が備[そな]わっていたからである。"

notes:
  6: "τὸ ἅγιον — средний род, «святыня»; μαργαρίτας — жемчуг. У jp-ni «神聖なもの», оставил 聖なるもの."
  14: "В критической базе τί («как») вместо церковного ὅτι («ибо»); разница не в содержании, перевёл как восклицание, как jp-ni."
  17: "σαπρόν — «гнилое»; передано 腐った木, чтобы не сглаживать."
