verses:
  0: "指揮者[しきしゃ]に。ダビデの教[おし]え。エドム人[じん]ドエグが来[き]てサウルに告[つ]げ、「ダビデはアヒメレクの家[いえ]に来[き]た」と言[い]ったときのこと。"
  1: "力[ちから]ある者[もの]よ、なぜ悪[あく]を誇[ほこ]るのか。あなたは一日中[いちにちじゅう]、不法[ふほう]を働[はたら]いている。"
  2: "あなたの舌[した]は不正[ふせい]を考[かんが]え、研[と]ぎ澄[す]ましたかみそりのように、欺[あざむ]きを仕組[しく]む。"
  3: "あなたは善[ぜん]よりも悪[あく]を、正[ただ]しく語[かた]ることよりも不正[ふせい]を愛[あい]した。"
  4: "あなたは滅[ほろ]ぼしの言葉[ことば]を、欺[あざむ]きの舌[した]を、すべて愛[あい]した。"
  5: "それゆえ、神[かみ]はあなたをとこしえに打[う]ち倒[たお]される。あなたを引[ひ]き抜[ぬ]き、その住[す]まいから移[うつ]し、生[い]ける者[もの]の地[ち]からあなたの根[ね]を抜[ぬ]き去[さ]られる。"
  6: "正[ただ]しい者[もの]たちはこれを見[み]て恐[おそ]れ、彼[かれ]を笑[わら]って言[い]う。"
  7: "「見[み]よ、神[かみ]を自分[じぶん]の助[たす]けとせず、財[ざい]の多[おお]さに寄[よ]り頼[たの]み、自分[じぶん]のむなしい悪[あく]に力[ちから]を得[え]ていた者[もの]を。」"
  8: "しかし、わたしは神[かみ]の家[いえ]に植[う]えられた、実[み]を結[むす]ぶオリーブの木[き]のようだ。わたしは世々[よよ]に、とこしえに神[かみ]の恵[めぐ]みに寄[よ]り頼[たの]む。"
  9: "あなたがなさったことを、わたしはとこしえにほめたたえる。あなたの名[な]に望[のぞ]みを置[お]く。それは、あなたの聖[せい]なる者[もの]たちの前[まえ]に良[よ]いことだからである。"

notes:
  0: "Εἰς τὸ τέλος· συνέσεως τῷ Δαυιδ, ἐν τῷ ἐλθεῖν Δωηκ τὸν Ιδουμαῖον καὶ ἀναγγεῖλαι τῷ Σαουλ καὶ εἰπεῖν αὐτῷ Ἦλθεν Δαυιδ εἰς τὸν οἶκον Αβιμελεχ — 指揮者に。ダビデの教え。エドム人ドエグが来てサウルに告げ、「ダビデはアヒメレクの家に来た」と言ったときのこと (Δωηκ — ドエグ, слав. Доик; Ιδουμαῖος — エドム人, слав. Идумейский; Αβιμελεχ — アヒメレク, слав. Ахимелех; ср. 1 Цар 21–22. Речь Доега — 「」, это первый уровень, так как надписание не в кавычках. Надписание — стих 0.)"
  1: "Τί ἐγκαυχᾷ ἐν κακίᾳ, ὁ δυνατός — 力ある者よ、なぜ悪を誇るのか (ἐγκαυχάομαι — «хвалиться»; ὁ δυνατός — «сильный», с иронией). ἀνομίαν ὅλην τὴν ἡμέραν — 一日中、不法を働いている (вин. как продолжение обвинения)."
  2: "ἀδικίαν ἐλογίσατο ἡ γλῶσσά σου — あなたの舌は不正を考え (λογίζομαι — «замышлять»). ὡσεὶ ξυρὸν ἠκονημένον — 研ぎ澄ましたかみそりのように (ξυρόν — «бритва»; ἀκονάω — «точить»). ἐποίησας δόλον — 欺きを仕組む (δόλος — «коварство»)."
  3: "ἠγάπησας κακίαν ὑπὲρ ἀγαθωσύνην — あなたは善よりも悪を愛した (ὑπέρ + вин. при ἀγαπάω — «более чем»). ἀδικίαν ὑπὲρ τὸ λαλῆσαι δικαιοσύνην — 正しく語ることよりも不正を (параллелизм сохранён). διάψαλμα не передаётся."
  4: "ἠγάπησας πάντα τὰ ῥήματα καταποντισμοῦ — あなたは滅ぼしの言葉をすべて愛した (καταποντισμός — «потопление, погибель», слав. «словеса погубления»). γλῶσσαν δολίαν — 欺きの舌を (δολία — «коварная»)."
  5: "διὰ τοῦτο ὁ θεὸς καθελεῖ σε εἰς τέλος — それゆえ、神はあなたをとこしえに打ち倒される (καθαιρέω — «низвергать»; εἰς τέλος — «до конца»). ἐκτίλαι σε — あなたを引き抜き (ἐκτίλλω — «вырывать»). μεταναστεύσαι σε ἀπὸ σκηνώματος — その住まいから移し (μεταναστεύω — «переселять»; σκήνωμα — 住まい). τὸ ῥίζωμά σου ἐκ γῆς ζώντων — 生ける者の地からあなたの根を抜き去られる (ῥίζωμα — «корень»; γῆ ζώντων — «земля живых», ср. Пс 26:13). διάψαλμα не передаётся."
  6: "ὄψονται δίκαιοι καὶ φοβηθήσονται — 正しい者たちはこれを見て恐れ (φοβέομαι — «бояться», здесь страх суда Божия). ἐπ᾽ αὐτὸν γελάσονται — 彼を笑って (γελάω — «смеяться»). ἐροῦσιν — 言う (вводит речь ст. 7)."
  7: "Ἰδοὺ ἄνθρωπος — 見よ、…者を (ἰδού при указании на человека; по-японски 見よ управляет винительным). ὃς οὐκ ἔθετο τὸν θεὸν βοηθὸν αὐτοῦ — 神を自分の助けとせず (τίθημι — «полагать»). ἐπήλπισεν ἐπὶ τὸ πλῆθος τοῦ πλούτου αὐτοῦ — 財の多さに寄り頼み (ἐλπίζω ἐπί). ἐδυναμώθη ἐπὶ τῇ ματαιότητι αὐτοῦ — 自分のむなしい悪に力を得ていた (δυναμόω — «укрепляться»; ματαιότης — «суета», передано むなしい悪, ср. jp-joc «惡業»). Речь праведников — 「」."
  8: "ἐγὼ δὲ ὡσεὶ ἐλαία κατάκαρπος ἐν τῷ οἴκῳ τοῦ θεοῦ — しかし、わたしは神の家に植えられた、実を結ぶオリーブの木のようだ (ἐλαία — オリーブ; κατάκαρπος — «обильный плодами»). ἤλπισα ἐπὶ τὸ ἔλεος τοῦ θεοῦ — 神の恵みに寄り頼む (ἐλεος — 恵み). εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — 世々に、とこしえに."
  9: "ἐξομολογήσομαί σοι εἰς τὸν αἰῶνα, ὅτι ἐποίησας — あなたがなさったことを、わたしはとこしえにほめたたえる (ἐξομολογέομαι — «славить»). ὑπομενῶ τὸ ὄνομά σου — あなたの名に望みを置く (ὑπομένω — «ждать, уповать»). ὅτι χρηστὸν ἐναντίον τῶν ὁσίων σου — あなたの聖なる者たちの前に良いことだからである (χρηστός — «благой»; ὅσιοι — 聖なる者, как в Пс 49:5)."
