# jp-box, 1-я Паралипоменон, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc и jp-ni в 1 Пар нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: родословие Рувима (1–10), Гада (11–17), война с агарянами (18–22),
# половина Манассии (23–26) и родословие Левия от Левия до Иоседека (27–41).
# Нумерация — строго по gr-lxx-byz. В LXX в гл. 5 — 41 стих, в csl — 26: стихи
# 5:27–41 (родословие Левия) в csl и в евр. нумерации отнесены к началу гл. 6
# (csl 6:1–15), поэтому в этой главе после ст. 26 csl-параллели нет.
# Родословия транслитерированы с греческого; где лицо есть в корпусе (Быт 46, Исх 6,
# Числ 26, 1–4 Цар), взята корпусная форма: ルベン, エノク, ファルス, アスロン, ハルミ,
# ヨエル, セメイ, ベナヤ, ミカ, バアル, ガド, レビ, ゲルション, カアト, メラリ,
# アムラム, イサアル, ヘブロン, オジエル, アロン, モーセ, マリアム, ナダブ, アビウド,
# エレアザル, イタマル, ピネハス, サドク, アヒマアス, アザリヤ, ヒルキヤ, セラヤ.
# Паритет LXX/csl: где csl даёт чтение, отличное от греческого (5:10, 5:21), в тексте
# стоит csl-чтение без 〔…〕, а греческий вариант назван в notes.
# 〔…〕 нет. Красного и синего нет. Прямой речи в главе нет; кавычек нет.
# Сносок ⟨…⟩ нет: 長子, 氏族, 家畜, 祭司, 幕屋, 嗣業 уже пояснены в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 1par
chapter: 5
draft: true

verses:
  1: "ルベンはイスラエルの長子[ちょうし]である。彼[かれ]が長子であるからである。しかし、彼[かれ]が父[ちち]の寝床[ねどこ]に上[のぼ]ったとき、彼[かれ]は自分[じぶん]の祝福[しゅくふく]を、自分[じぶん]の子[こ]ヨセフ、イスラエルの子[こ]に与[あた]えた。それゆえ、彼[かれ]は長子として数[かぞ]えられなかった。"
  2: "ユダは力[ちから]において強[つよ]く、兄弟[きょうだい]たちの間[あいだ]でも強[つよ]かった。そして、指導者[しどうしゃ]は彼[かれ]から出[で]た。しかし、祝福[しゅくふく]はヨセフのものであった。"
  3: "ルベン、イスラエルの長子[ちょうし]の子[こ]らは、エノク、ファルス、アスロン、ハルミ。"
  4: "ヨエルの子[こ]らは、セメイと、その子[こ]バナヤ。また、セメイの子[こ]ゴグの子[こ]らは、"
  5: "その子[こ]はミカ、その子[こ]はレカ、その子[こ]はバアル、"
  6: "その子[こ]はベエラ。彼[かれ]をアッシリアの王[おう]ティグラト・ピレセルが移[うつ]した。彼[かれ]はルベン人[びと]の長[かしら]であった。"
  7: "彼[かれ]の兄弟[きょうだい]たちは、その氏族[しぞく]ごとに、その系図[けいず]の記録[きろく]に従[したが]って、次[つぎ]のとおりである。長[かしら]はヨエル、またゼカリヤ、"
  8: "またバレク、オズズの子[こ]、サマの子、ヨエルの子。彼[かれ]はアロエルに、またナバウとベエルメオンに住[す]んだ。"
  9: "また東[ひがし]の方[ほう]では、ユーフラテス川[がわ]から来[く]る荒野[こうや]の入口[いりぐち]まで住[す]んだ。彼[かれ]らの家畜[かちく]がギレアデの地[ち]で多[おお]かったからである。"
  10: "サウルの時代[じだい]に、彼[かれ]らはハガル人[びと]と戦[たたか]いをした。そして、天幕[てんまく]に住[す]む者[もの]たちが皆[みな]、ギレアデの東[ひがし]で彼[かれ]らの手[て]に倒[たお]れた。"
  11: "ガドの子[こ]らは、彼[かれ]らの向[む]かいに、バシャンの地[ち]でセルカまで住[す]んだ。"
  12: "ヨエルが長子[ちょうし]、サファムが次[つぎ]の者[もの]、ヤニがバシャンで書記[しょき]であった。"
  13: "彼[かれ]らの兄弟[きょうだい]たちは、その父[ちち]の家[いえ]ごとに、ミカエル、モソラム、セベエ、ヨレエ、ヤハン、ズエ、オベドの七人[しちにん]。"
  14: "これらはアビハイルの子[こ]らである。アビハイルはウリの子、ウリはイダイの子、イダイはギレアデの子、ギレアデはミカエルの子、ミカエルはイサイの子、イサイはユリの子、ユリはザブハムの子[こ]であった。"
  15: "また、アブディエルの子、グニの子[こ]である。彼[かれ]は父[ちち]の家[いえ]の長[かしら]であった。"
  16: "彼[かれ]らはギレアデに、バシャンとその村[むら]々[むら]に、またシャロンのすべての周辺[しゅうへん]の地[ち]に、その果[は]てまで住[す]んだ。"
  17: "これらすべての系図[けいず]の記録[きろく]は、ユダの王[おう]ヨタムの時代[じだい]に、またイスラエルの王[おう]ヤロブアムの時代[じだい]に行[おこな]われた。"
  18: "ルベン、ガド、およびマナセの部族[ぶぞく]の半[はん]分[ぶん]の子[こ]らのうち、力[ちから]ある者[もの]たち、すなわち盾[たて]と剣[つるぎ]を取[と]り、弓[ゆみ]を張[は]り、戦[たたか]いに鍛[きた]えられた者[もの]は、戦列[せんれつ]に出[で]て行[い]く者[もの]が四万四千七百六十人[にん]であった。"
  19: "彼[かれ]らはハガル人[びと]、イトゥル人[びと]、ナフィシュ人[びと]、ナダブ人[びと]と戦[たたか]った。"
  20: "そして、彼[かれ]らは相手[あいて]に勝[か]った。ハガル人[びと]とその天幕[てんまく]のすべてが彼[かれ]らの手[て]に渡[わた]された。彼[かれ]らが戦[たたか]いのときに神[かみ]に叫[さけ]んだからである。神は彼[かれ]らに聞[き]き入[い]れられた。彼[かれ]らが神に望[のぞ]みを置[お]いたからである。"
  21: "彼[かれ]らは敵[てき]の財産[ざいさん]を奪[うば]い去[さ]った。すなわち、らくだ五万[ごまん]、羊[ひつじ]二十五万[にじゅうごまん]、ろば二千[にせん]、人[ひと]の命[いのち]十万[じゅうまん]である。"
  22: "多[おお]くの者[もの]が傷[きず]ついて倒[たお]れたからである。この戦[たたか]いは神[かみ]から出[で]たものであった。彼[かれ]らは倒[たお]れた者[もの]たちの代[か]わりに、移[うつ]される時[とき]まで住[す]んだ。"
  23: "マナセの部族[ぶぞく]の半[はん]分[ぶん]は、バシャンからバアル・エルモン、サニル、およびエルモン山[やま]までの地[ち]に住[す]んだ。彼[かれ]らはレバノンで多[おお]く増[ふ]えた。"
  24: "次[つぎ]の者[もの]たちは、彼[かれ]らの父[ちち]の家[いえ]の長[かしら]たちである。オフェル、イシ、エリエル、エズリエル、エレミヤ、オドヤ、エディエル。彼[かれ]らは力[ちから]に強[つよ]い者[もの]たち、名[な]の知[し]られた者[もの]たちであり、その父[ちち]の家[いえ]の長[かしら]たちであった。"
  25: "しかし、彼[かれ]らはその父[ちち]たちの神[かみ]に背[そむ]き、その地[ち]の民[たみ]の神々[かみがみ]の後[あと]を追[お]って淫[いん]行[こう]をした。神[かみ]が彼[かれ]らの前[まえ]から追[お]い出[だ]した民[たみ]の神々である。"
  26: "そこで、イスラエルの神[かみ]は、アッシリアの王[おう]プルの霊[れい]と、アッシリアの王[おう]ティグラト・ピレセルの霊[れい]を立[た]てた。そして、ルベン人[びと]、ガド人[びと]、マナセの部族[ぶぞく]の半[はん]分[ぶん]を移[うつ]し、彼[かれ]らをハラフ、ハボル、およびゴザン川[がわ]へ連[つ]れて行[い]った。彼[かれ]らはこの日[ひ]までそこにいる。"
  27: "レビの子[こ]らは、ゲルション、カアト、メラリ。"
  28: "カアトの子[こ]らは、アムラム、イサアル、ヘブロン、オジエル。"
  29: "アムラムの子[こ]らは、アロン、モーセ、マリアム。アロンの子[こ]らは、ナダブ、アビウド、エレアザル、イタマル。"
  30: "エレアザルはピネハスを生[う]み、ピネハスはアビスを生[う]み、"
  31: "アビスはボカイを生[う]み、ボカイはオジを生[う]み、"
  32: "オジはザラヤを生[う]み、ザラヤはマリエルを生[う]み、"
  33: "マリエルはアマルヤを生[う]み、アマルヤはアヒトブを生[う]み、"
  34: "アヒトブはサドクを生[う]み、サドクはアヒマアスを生[う]み、"
  35: "アヒマアスはアザリヤを生[う]み、アザリヤはヨハナンを生[う]み、"
  36: "ヨハナンはアザリヤを生[う]んだ。この者[もの]は、ソロモンがエルサレムに建[た]てた家[いえ]で祭司[さいし]の務[つと]めをした。"
  37: "アザリヤはアマルヤを生[う]み、アマルヤはアヒトブを生[う]み、"
  38: "アヒトブはサドクを生[う]み、サドクはサルムを生[う]み、"
  39: "サルムはヒルキヤを生[う]み、ヒルキヤはアザリヤを生[う]み、"
  40: "アザリヤはセラヤを生[う]み、セラヤはヨサダクを生[う]んだ。"
  41: "ヨサダクは、ユダとエルサレムがネブカドネツァルの手[て]によって移[うつ]されるとき、その移[うつ]りの中[なか]へ行[い]った。"

notes:
  1: "Καὶ υἱοὶ Ρουβην πρωτοτόκου Ισραηλ — «и сыны Рувима, первенца Израилева»; ὅτι οὗτος ὁ πρωτότοκος — ибо он первенец. ἐν τῷ ἀναβῆναι ἐπὶ τὴν κοίτην τοῦ πατρὸς αὐτοῦ — «когда он взошёл на ложе отца своего» (Быт 35:22; 49:4); ἔδωκεν εὐλογίαν αὐτοῦ — «отдал благословение своё» (подлежащее — Рувим, так же в csl «даде благословение его»). οὐκ ἐγενεαλογήθη εἰς πρωτοτόκια — «не был причислен к первородству», csl «не бысть вменен в первенство»."
  2: "δυνατὸς ἰσχύι — «сильный силой» (дат. при δυνατός); καὶ ἐν τοῖς ἀδελφοῖς αὐτοῦ — и между братьями его; εἰς ἡγούμενον ἐξ αὐτοῦ — «в вождя из него» (слав. «в вожда из него»), т. е. вождь происходит от него; καὶ ἡ εὐλογία τοῦ Ιωσηφ — «а благословение — Иосифу»."
  3: "υἱοὶ Ρουβην πρωτοτόκου Ισραηλ повторяет начало ст. 1. Ενωχ — エノク, Φαλλους — ファルス, Αρσων — アスロン, Χαρμι — ハルミ: формы корпуса (Быт 46:9; Числ 26:5–6), хотя в евр. иначе (חֶצְרוֹן)."
  4: "υἱοὶ Ιωηλ — «сыны Иоиля»; Σεμει καὶ Βαναια υἱὸς αὐτοῦ — «Шимей и Бенаия, сын его». καὶ υἱοὶ Γουγ υἱοῦ Σεμει — «и сыны Гога, сына Шимея»: цепь продолжается в ст. 5 (в евр. это линейное родословие). Γουγ — ゴグ."
  5: "υἱὸς αὐτοῦ Μιχα, υἱὸς αὐτοῦ Ρηχα, υἱὸς αὐτοῦ Βααλ — «сын его Миха, сын его Реха, сын его Ваал»: формула «сын его» продолжает ст. 4. Ρηχα — レカ (евр. רְאָיָה)."
  6: "Βεηρα — ベエラ (евр. בְּאֵרָה); ὃν μετῴκισεν — которого переселил (μετοικίζω); Θαγλαθφαλνασαρ βασιλεὺς Ασσουρ — Тиглатпаласар, царь Ассирийский (в корпусе ティグラト・ピレセル, 4 Цар 15:29); ἄρχων τῶν Ρουβην — «князь Рувима»; csl добавляет «колена рувимова»."
  7: "τῇ πατριᾷ αὐτοῦ — «по отечеству его»; ἐν τοῖς καταλοχισμοῖς αὐτῶν — в родословных списках (καταλοχισμός); κατὰ γενέσεις αὐτῶν — по поколениям их; ὁ ἄρχων Ιωηλ καὶ Ζαχαρια — «вождь Иоиль и Захария»; перечисление продолжается в ст. 8."
  8: "Βαλεκ υἱὸς Οζουζ υἱὸς Σαμα υἱὸς Ιωηλ — «Балек, сын Азаза, сына Шемы, сына Иоиля» (в евр. בֶּלַע; ср. ベラ); οὗτος κατῴκησεν — он обитал; Αροηρ, Ναβαυ, Βεελμαων — アロエル, ナバウ, ベエルメオン (формы корпуса, Числ 32:3)."
  9: "πρὸς ἀνατολάς — к востоку; ἕως ἐρχομένων τῆς ἐρήμου — «до прихода пустыни», т. е. до начала пустыни (слав. «до входа пустыни»); ἀπὸ τοῦ ποταμοῦ Εὐφράτου — от реки Евфрата; κτήνη — скот, стада."
  10: "ἐν ἡμέραις Σαουλ — во дни Саула; πρὸς τοὺς παροίκους — «против пришельцев» (πάροικος); csl и ru уточняют: «противу агарян» (евр. הַהַגְרִאים), поэтому в тексте ハガル人. ἔπεσον ἐν χερσὶν αὐτῶν — пали от рук их; κατοικοῦντες ἐν σκηναῖς — живущие в шатрах; ἕως ... κατ᾽ ἀνατολὰς τῆς Γαλααδ — до [всех пределов] на восток Галаада."
  11: "Υἱοὶ Γαδ — сыны Гада; κατέναντι αὐτῶν — напротив них; ἐν τῇ Βασαν — в Васане; ἕως Σελχα — до Салхи (Σελχα — セルカ)."
  12: "ὁ πρωτότοκος — первенец; ὁ δεύτερος — второй; Ιανι ὁ γραμματεύς — Ианий писец (слав. «ианин книжник васанский»). В евр. 5:12 иначе: «Иоиль главный, Шафан второй, Иаанай и Шафат»."
  13: "κατ᾽ οἴκους πατριῶν — по домам отцов; семь имён: Μιχαηλ, Μοσολλαμ, Σεβεε, Ιωρεε, Ιαχαν, Ζουε, Ωβηδ — ミカエル, モソラム, セベエ, ヨレエ, ヤハン, ズエ, オベド. Csl для Ζουε даёт «иовиа» (Иовия), в тексте — греческая форма ズエ."
  14: "Цепь родительных падежей: υἱοῦ Ουρι ... υἱοῦ Ζαβουχαμ — «сына Урии ... сына Завухама»; по-японски цепь раскрыта повторением имени. Csl читает иначе: «сына рувиина, и адди, сына галаадова, сына михаилова, сына иессеина, сына иедаина, сына вузова» (Рувим вм. Урии, Адди вм. Идая, Иедай вм. Иурия, Вуза вм. Завухама); в тексте — греческие формы."
  15: "υἱοῦ Αβδιηλ υἱοῦ Γουνι — «сына Авдиила, сына Гуния»: цепь ст. 14 продолжается; ἄρχων οἴκου πατριῶν — «вождь дома отцов» (слав. «князь дому отечеств их»)."
  16: "κῶμαι — селения; περίχωρα — окрестности; Σαρων — シャロン; ἕως ἐξόδου — «до исхода» (до конца области); csl «даже до исхода»."
  17: "πάντων ὁ καταλοχισμός — «всех перепись (родословная запись)»; ἐν ἡμέραις Ιωαθαμ βασιλέως Ιουδα — во дни Иоафама, царя Иудейского (ヨタム, в корпусе); Ιεροβοαμ βασιλέως Ισραηλ — Иеровоам II (ср. 4 Цар 14:23–29), в корпусе ヤロブアム."
  18: "ἐξ υἱῶν δυνάμεως — «из сынов силы», т. е. из воинов; αἴροντες ἀσπίδας καὶ μάχαιραν — носящие щиты и меч; τείνοντες τόξον — натягивающие лук; δεδιδαγμένοι πόλεμον — обученные войне (perfect от διδάσκω); ἐκπορευόμενοι εἰς παράταξιν — выходящие в строй; 44 760."
  19: "ἐποίουν πόλεμον μετὰ τῶν Αγαρηνῶν — вели войну с агарянами; Ιτουραιοι — イトゥル人 (евр. יְטוּר, ср. Быт 25:15); Ναφισαιοι — ナフィシュ人 (נָפִישׁ); Ναδαβαιοι — ナダブ人 (נֹדָב; греч. форма сближает с Надавом)."
  20: "κατίσχυσαν ἐπ᾽ αὐτῶν — одолели их (κατισχύω); ἐδόθησαν εἰς χεῖρας αὐτῶν — преданы в руки их; σκηνώματα — шатры, жилища (слав. «обитания»); ἐβόησαν — воззвали (βοάω); ἐπήκουσεν αὐτοῖς — услышал их (ἐπακούω); ἤλπισαν ἐπ᾽ αὐτόν — уповали на Него."
  21: "ᾐχμαλώτευσαν τὴν ἀποσκευήν — взяли в добычу имущество (αἰχμαλωτεύω, ἀποσκευή); ψυχὰς ἀνδρῶν — души (люди) мужского пола. LXX: καμήλους πεντακισχιλίας — 5 000 верблюдов; в csl и ru (и евр.) — 50 000; по паритету в тексте csl-чтение 五万, LXX-вариант назван здесь."
  22: "τραυματίαι — поражённые, раненые; παρὰ τοῦ θεοῦ ὁ πόλεμος — «от Бога война»; ἀντ᾽ αὐτῶν — вместо них; ἕως τῆς μετοικεσίας — до переселения (μετοικεσία — плен, ср. ст. 26 и 4 Цар 15:29)."
  23: "οἱ ἡμίσεις φυλῆς Μανασση — половина племени Манассии; Βααλερμων — バアル・エルモン (בַּעַל חֶרְמוֹן); Σανιρ — サニル (Сенир, ср. Втор 3:9); ὄρος Αερμων — гора Ермон (в корпусе ヘルモン); ἐν τῷ Λιβάνῳ — в Ливане; ἐπλεονάσθησαν — умножились."
  24: "ἀρχηγοὶ οἴκου πατριῶν — вожди дома отцов; семь имён: Οφερ, Ισει, Ελιηλ, Εσδριηλ, Ιερμια, Ωδουια, Ιεδιηλ — オフェル, イシ, エリエル, エズリエル, エレミヤ, オドヤ, エディエル; ἄνδρες ὀνομαστοί — мужи именитые. Csl даёт шесть имён (без Езриила): «гофер и иеси, и елиил и иеремиа, и иодуиа и иедиил»."
  25: "ἠθέτησαν ἐν θεῷ — «отвергли Бога» (ἀθετέω); ἐπόρνευσαν ὀπίσω — «блудодействовали вслед» (об идолослужении); ἐξῆρεν — изгнал (ἐξαίρω); ἀπὸ προσώπου αὐτῶν — от лица их."
  26: "ἐπήγειρεν ... τὸ πνεῦμα — «воздвиг дух» (возбудил расположение); Φαλωχ — Пул/Фул (4 Цар 15:19), в корпусе プル; Χαλαχ καὶ Χαβωρ — Халах и Хавор (ср. 4 Цар 17:6, где греч. Αλαε, Αβωρ — アラエ, アボル); Γωζαν — ゴザン (в корпусе); ἕως τῆς ἡμέρας ταύτης — до сего дня."
  27: "С этого стиха LXX начинает родословие Левия, которое в csl (и в евр. нумерации) стоит в начале гл. 6: 5:27–41 = csl 6:1–15 (отсюда 41 стих у LXX против 26 у csl). Γεδσων, Κααθ, Μεραρι — ゲルション, カアト, メラリ (формы корпуса, Исх 6:16)."
  28: "Αμβραμ καὶ Ισσααρ, Χεβρων καὶ Οζιηλ — Амрам, Исаар, Хеврон, Озиил; формы корпуса: アムラム, イサアル, ヘブロン, オジエル (Исх 6:18; Числ 3:19)."
  29: "Ααρων καὶ Μωϋσῆς καὶ Μαριαμ — Аарон, Моисей и Мариам (в корпусе マリアム, Исх 6:20); Ναδαβ καὶ Αβιουδ, Ελεαζαρ καὶ Ιθαμαρ — Надав, Авиуд, Елеазар, Ифамар (ナダブ, アビウド, エレアザル, イタマル)."
  30: "ἐγέννησεν — родил (формула родословия); Φινεες — ピネハス (в корпусе); Αβισου — Авис(у) (евр. אֲבִישׁוּעַ), в корпусе нет, передано с греческого アビス."
  31: "Βωκαι — ボカイ (евр. בֻּקִּי); Οζι — オジ (Уззий, עֻזִּי). Имена переданы с греческого; csl: «вокхий», «озий»."
  32: "Ζαραια — ザラヤ (Зерахия, זְרַחְיָה); Μαριηλ — マリエル (Мераиоф, מְרָיוֹת; LXX Μαριηλ)."
  33: "Αμαρια — アマルヤ (Амария); Αχιτωβ — アヒトブ (Ахитув; в корпусе, 2 Цар 8:17)."
  34: "Σαδωκ — サドク; Αχιμαας — アヒマアス (формы корпуса, 2 Цар 8:17; 15:27)."
  35: "Αζαρια — アザリヤ (в корпусе アザリヤ); Ιωαναν — ヨハナン (Иоанан); ср. 6:35–38, где та же цепь дана вторично."
  36: "ἱεράτευσεν — священствовал (ἱερατεύω); ἐν τῷ οἴκῳ, ᾧ ᾠκοδόμησεν Σαλωμων — «в доме, который построил Соломон» (слав. «в дому, егоже созда соломон»); это Азария, сын Иоанана (ср. 6:10)."
  37: "Второй круг родословия (от Азарии до Иоседека); имена те же, что в ст. 33. Греч. ἐγέννησεν Αζαρια — без артикля при подлежащем."
  38: "Σαλωμ — サルム (Шаллум, שַׁלּוּם); в корпусе для царя Шаллума — シャルム, здесь по греческому サルム."
  39: "Χελκιας — ヒルキヤ (в корпусе, 4 Цар 18:18); Αζαρια — アザリヤ."
  40: "Σαραια — セラヤ (Сераия, в корпусе セラヤ); Ιωσαδακ — ヨサダク (Иоседек, יְהוֹצָדָק)."
  41: "ἐπορεύθη ἐν τῇ μετοικίᾳ — «пошёл в переселение» (μετοικία — плен); μετὰ Ιουδα καὶ Ιερουσαλημ — с Иудой и Иерусалимом; ἐν χειρὶ Ναβουχοδονοσορ — рукою Навуходоносора (в корпусе ネブカドネツァル). Csl добавляет «Господь пресели» и «в вавилон» — в греч. этого нет."
