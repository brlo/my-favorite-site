# jp-box, Левит, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Фуригана — при первом появлении слова в стихе.
# Глава 6: закон об обмане ближнего (1–6), закон всесожжения (7–13),
# хлебный дар священников (14–23), закон жертвы за грех (24–30).
# Речь Бога — 「…」 (2–6, 7–23, 25–30); речение 7–23 продолжается в 7:1–21,
# но на границе главы кавычки закрыты. Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 素祭 (2:1), 贖罪祭 (4:3), 燔祭 (Быт 8:20) уже пояснены.
# LXX/масоретские отличия: gr 6:1–6 дословно повторяют 5:20–26. По решению
# пользователя держимся csl-ru: закон об обмане стоит один раз — здесь, а 5:20–26
# опущены (исключение в jp_box_check.rb). 6:4 объединяет 5:23–24; в csl
# нумерация внутри главы сдвинута: их 6:1–7 — обман, их 6:8 = наш 6:7,
# дальше сдвиг гасится на 6:9 (gr 6:8 и 6:9 csl объединяет в 6:9).
# 6:12: ἀπ᾿ αὐτοῦ при καυθήσεται — вероятно, «на нём» (слав. «на нем»).
# jp-ni не использовался.

tr_code: jp-box
book: lev
chapter: 6
draft: true

verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「もし人[ひと]が罪[つみ]を犯[おか]し、主[しゅ]の戒[いまし]めを蔑[ないがし]ろにして、隣人[りんじん]に対[たい]して、預[あず]け物[もの]のこと、あるいは共[とも]にする財[ざい]のこと、あるいは奪[うば]い取[と]った物のことについて偽[いつわ]りを言[い]い、あるいは隣人に何[なに]か不正[ふせい]を働[はたら]き、"
  3: "または、見[み]つけた落[お]とし物[もの]について偽[いつわ]りを言[い]い、人[ひと]が罪[つみ]を犯[おか]すために行[おこな]うすべてのことの一[ひと]つについて、不正[ふせい]にも誓[ちか]うなら、"
  4: "そして、彼[かれ]が罪[つみ]を犯[おか]し、過[あやま]ちを犯したとき、奪[うば]い取[と]った物[もの]、すなわち自分[じぶん]が奪い取ったもの、あるいは不正[ふせい]に得[え]たもの、あるいは自分に預[あず]けられた物、あるいは自分が見[み]つけた落[お]とし物、すなわち自分が不正にも誓[ちか]ったすべての事[こと]について、その元金[もときん]を償[つぐな]い、その上[うえ]に五分[ごぶ]の一[いち]を加[くわ]えなさい。それが誰[だれ]のものであっても、その人[ひと]に、そのことが明[あき]らかになった日[ひ]に返[かえ]しなさい。"
  5: "そして、自分の愆祭[けんさい]として、主[しゅ]に、羊[ひつじ]の群[む]れから傷[きず]のない雄羊[おすひつじ]を、自分[じぶん]が過[あやま]ちを犯[おか]したことに応[おう]じた評価[ひょうか]の額[がく]で携[たずさ]えて来[き]なさい。"
  6: "祭司[さいし]は主[しゅ]の前[まえ]で彼[かれ]のために贖[あがな]い、彼が行[おこな]って過[あやま]ちを犯[おか]したすべてのことの一[ひと]つについて、彼の罪[つみ]は赦[ゆる]される。」"
  7: "主[しゅ]はモーセに言[い]われた。"
  8: "「アロンとその子[こ]らに命[めい]じて言[い]いなさい。"
  9: "燔祭[はんさい]の法[ほう]はこうである。燔祭は、祭壇[さいだん]の上[うえ]の焼[や]かれる所[ところ]で、夜[よる]通[とお]し朝[あさ]まで燃[も]え続[つづ]け、祭壇の火[ひ]はその上で燃え続け、消[き]えてはならない。"
  10: "祭司[さいし]は亜麻[あま]の衣[ころも]を着[き]て、亜麻の下着[したぎ]を体[からだ]にまとわなければならない。そして、火[ひ]が燔祭[はんさい]を焼[や]き尽[つ]くして祭壇[さいだん]の上[うえ]に残[のこ]した灰[はい]を取[と]り除[のぞ]き、祭壇のそばに置[お]きなさい。"
  11: "そして、自分[じぶん]の衣[ころも]を脱[ぬ]ぎ、ほかの衣を着[き]て、その灰[はい]を宿営[しゅくえい]の外[そと]の清[きよ]い場所[ばしょ]に運[はこ]び出[だ]しなさい。"
  12: "祭壇[さいだん]の火[ひ]は燃[も]え続[つづ]け、消[き]えてはならない。祭司[さいし]は毎朝[まいあさ]、その上[うえ]に薪[たきぎ]をくべ、その上に燔祭[はんさい]を並[なら]べ、その上で酬恩祭[しゅうおんさい]の脂肪[しぼう]を焼[や]きなさい。"
  13: "火[ひ]は祭壇[さいだん]の上[うえ]で絶[た]えず燃[も]え続[つづ]け、消[き]えてはならない。"
  14: "素祭[そさい]の法[ほう]はこうである。アロンの子[こ]らは、それを主[しゅ]の前[まえ]、祭壇[さいだん]の前に携[たずさ]えて来[き]なさい。"
  15: "祭司[さいし]はその中[なか]から、素祭[そさい]の小麦粉[こむぎこ]とその油[あぶら]とその乳香[にゅうこう]すべてを、すなわち素祭の上[うえ]にあるものを一握[ひとにぎ]り取[と]り、それを記念[きねん]として祭壇[さいだん]の上で焼[や]きなさい。それは主[しゅ]に芳[かんば]しい香[かおり]となる焼き尽[つ]くす捧[ささ]げ物[もの]である。"
  16: "残[のこ]ったものは、アロンとその子[こ]らが食[た]べなさい。それは種[たね]なしパンとして、聖[せい]なる場所[ばしょ]で、すなわち証[あかし]の幕屋[まくや]の庭[にわ]で食べなければならない。"
  17: "それはパン種[ぱんだね]を入[い]れて焼[や]いてはならない。わたしはそれを、わたしへの焼き尽[つ]くす捧[ささ]げ物[もの]のうちから、彼[かれ]らへの分[ぶん]として与[あた]えた。それは、贖罪祭[しょくざいさい]や愆祭[けんさい]と同[おな]じく、最[もっと]も聖[せい]なるものである。"
  18: "祭司[さいし]たちのうちの男[おとこ]はすべて、それを食[た]べることができる。それはあなたがたの代々[よよ]にわたる永遠[えいえん]の定[さだ]めであり、主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]のうちからのものである。それらに触[ふ]れる者[もの]はすべて聖[せい]なる者となる。」"
  19: "主[しゅ]はモーセに言[い]われた。"
  20: "「あなたが彼[かれ]に油[あぶら]を注[そそ]ぐ日[ひ]に、アロンとその子[こ]らが主[しゅ]に献[ささ]げる捧[ささ]げ物[もの]はこうである。すなわち、エファの十分[じゅうぶん]の一[いち]の小麦粉[こむぎこ]を、絶[た]えず献げる素祭[そさい]として、その半[はん]を朝[あさ]に、その半を夕[ゆう]べに献げなさい。"
  21: "それは油[あぶら]を入[い]れた平鍋[ひらなべ]の上[うえ]で作[つく]らなければならない。よく練[ね]って巻[ま]いたものを携[たずさ]えて来[き]て、割[わ]った素祭[そさい]、すなわち主[しゅ]に芳[かんば]しい香[かおり]となる犠牲[ぎせい]として献[ささ]げなさい。"
  22: "アロンの子[こ]らのうち、彼[かれ]の代[か]わりに油[あぶら]を注[そそ]がれた祭司[さいし]が、それを献[ささ]げなければならない。それは永遠[えいえん]の法[ほう]である。すべては焼[や]き尽[つ]くされなければならない。"
  23: "祭司[さいし]の素祭[そさい]はすべて燔祭[はんさい]となり、食[た]べてはならない。」"
  24: "主[しゅ]はモーセに言[い]われた。"
  25: "「アロンとその子[こ]らに語[かた]って言[い]いなさい。贖罪祭[しょくざいさい]の法[ほう]はこうである。贖罪祭は、燔祭[はんさい]を屠[ほふ]る場所[ばしょ]で、主[しゅ]の前[まえ]で屠らなければならない。それは最[もっと]も聖[せい]なるものである。"
  26: "贖罪祭[しょくざいさい]を献[ささ]げる祭司[さいし]が、それを食[た]べなさい。それは聖[せい]なる場所[ばしょ]で、すなわち証[あかし]の幕屋[まくや]の庭[にわ]で食べなければならない。"
  27: "その肉[にく]に触[ふ]れる者[もの]はすべて聖[せい]なる者となる。その血[ち]が衣[ころも]に振[ふ]りかかられたなら、その振りかかられたものを聖なる場所[ばしょ]で洗[あら]わなければならない。"
  28: "それを煮[に]た土[つち]の器[うつわ]は壊[こわ]さなければならない。銅[どう]の器で煮たなら、それを磨[みが]き、水[みず]で洗[あら]わなければならない。"
  29: "祭司[さいし]たちのうちの男[おとこ]はすべて、それを食[た]べることができる。それは主[しゅ]の最[もっと]も聖[せい]なるものである。"
  30: "しかし、その血[ち]が聖[せい]なる場所[ばしょ]で贖[あがな]うために証[あかし]の幕屋[まくや]に持[も]ち込[こ]まれる贖罪祭[しょくざいさい]は、すべて食[た]べてはならない。火[ひ]で焼[や]き尽[つ]くさなければならない。」"

notes:
  1: "Новое речение: ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων. В gr 6:1–6 повторяют 5:20–26 (дублет); по решению пользователя держимся csl — закон стоит здесь, а 5:20–26 опущены. 6:4 объединяет 5:23–24, поэтому русская нумерация внутри главы иная."
  2: "ψυχὴ ἣ ἂν ἁμάρτῃ — «душа, если согрешит»; παριδὼν παρίδῃ — «презрев презрит»; παραθήκη — «вверенное»; κοινωνία — «общее дело, товарищество»; ἁρπαγή — «похищение»; ср. 5:21."
  3: "ἀπώλεια — «пропажа»; ἀδίκως — «неправедно»; ὥστε ἁμαρτεῖν — «так что согрешит»; ср. 5:22."
  4: "ἀποδῷ — «возвратит»; ἀποτίσει τὸ κεφάλαιον — «заплатит основную сумму»; τὸ ἐπίπεμπτον — «пятая часть»; ᾗ ἡμέρᾳ ἐλεγχθῇ — «в день, когда будет обличён». В gr 6:4 объединяет 5:23–24; в csl это 6:4–5."
  5: "οἴσει … κριὸν ἄμωμον — «принесёт овна без порока»; τιμῆς εἰς ὃ ἐπλημμέλησε — «по оценке, соответственно проступку»; ср. 5:25."
  6: "ἐξιλάσεται … ἔναντι κυρίου — «совершит умилостивление пред Господом»; ἐν αὐτῷ — «в нём» (в жертве); ср. 5:26."
  7: "Новое речение; в csl это 6:8."
  8: "Ἔντειλαι — «заповедай» (imperative от ἐντέλλομαι); λέγων — «говоря», отдельно не передаётся. Стих — вводный, содержание идёт с 6:9."
  9: "ὁλοκαύτωσις — «всесожжение» (здесь дважды: закон и сама жертва); ἐπὶ τῆς καύσεως αὐτῆς — «на месте сожжения её»; οὐ σβεσθήσεται — «не угаснет». В csl 6:9 объединяет gr 6:8–9."
  10: "χιτὼν λινοῦς — льняной хитон; περισκελές — нижняя льняная одежда (слав. «надраги»); κατακάρπωσις — «сожигаемое», здесь пепел; ἐχόμενον τοῦ θυσιαστηρίου — «возле жертвенника»."
  11: "ἐκδύσεται τὴν στολήν — «снимет одежду»; στολὴ ἄλλη — «другая одежда»; ἔξω τῆς παρεμβολῆς — «вне стана»; τόπος καθαρός — «чистое место»."
  12: "στοιβάσει — «разложит» (στοιβάζω); ἀπ᾿ αὐτοῦ — вероятно, «на нём» (слав. «на нем»); τὸ στέαρ τοῦ σωτηρίου — «тук мирной жертвы» (酬恩祭)."
  13: "διὰ παντός — «непрестанно»; οὐ σβεσθήσεται — «не угаснет»; повтор 6:9."
  14: "θυσία — здесь хлебная жертва (素祭); ἀπέναντι τοῦ θυσιαστηρίου — «пред жертвенником»; αὐτὴν — избыточное местоимение при ἥν."
  15: "τῇ δρακί — «горстью»; τὰ ὄντα ἐπὶ τῆς θυσίας — «то, что на жертве»; κάρπωμα — «сожигаемое»; μνημόσυνον — «память»."
  16: "ἄζυμα βρωθήσεται — «пресным должно быть съедено»; ἐν αὐλῇ — «во дворе»; ἔδονται αὐτήν — «съедят её»."
  17: "οὐ πεφθήσεται ἐζυμωμένη — «не будет испечено квасным»; μερίς — «доля»; ἅγια ἁγίων — «святая святых»."
  18: "νόμιμον αἰώνιον — «вечное установление»; πᾶς ὃς ἐὰν ἅψηται — «всякий, кто прикоснётся»; ἁγιασθήσεται — «освятится»."
  19: "Новое речение."
  20: "τὸ δέκατον τοῦ οιφι — «десятая часть ефы»; εἰς θυσίαν διὰ παντός — «в жертву постоянную»; τὸ ἥμισυ … τὸ δειλινόν — «половина … вечерняя»; χρίσῃς — 2-е л. ед. ч., Бог обращается к Моисею."
  21: "τηγάνου — «сковорода»; πεφυραμένην — «замешанное»; ἑλικτά — «витое, скрученное» (слав. «витую»); θυσία ἐκ κλασμάτων — «жертва из разломанного»."
  22: "ὁ χριστός — «помазанный» (не имя Христа); ἀντ αὐτοῦ — «вместо него»; ἅπαν ἐπιτελεσθήσεται — «всё будет совершено», т. е. сожжено."
  23: "θυσία ἱερέως — «жертва священника»; ὁλόκαυτος — «всесожжённая»; οὐ βρωθήσεται — «не будет съедена»."
  24: "Новое речение."
  25: "ἐν τόπῳ οὗ σφάζουσιν τὸ ὁλοκαύτωμα — «на месте, где закалают всесожжение»; ἅγια ἁγίων — «святая святых»."
  26: "ὁ ἀναφέρων αὐτήν — «приносящий её» (ἀναφέρω); ἐν αὐλῇ — «во дворе»; βρωθήσεται — «должно быть съедено»."
  27: "ἐπιρραντισθῇ … ῥαντισθῇ — «будет окроплено»; πλυθήσεται — «будет вымыто»; ἁγιασθήσεται — «освятится»."
  28: "σκεῦος ὀστράκινον — «глиняный сосуд»; συντριβήσεται — «будет разбит»; σκεῦος χαλκοῦν — «медный сосуд»; ἐκτρίψει — «вычистит»; ἐκκλύσει — «вымоет»."
  29: "πᾶς ἄρσην ἐν τοῖς ἱερεῦσιν — «весь мужской пол среди священников»; ἅγια ἁγίων κυρίου — «святая святых Господа»."
  30: "εἰσενεχθῇ ἀπὸ τοῦ αἵματος — «внесена будет кровь»; ἐξιλάσασθαι ἐν τῷ ἁγίῳ — «умилостивить во святилище»; ἐν πυρὶ κατακαυθήσεται — «будет сожжено огнём»."
