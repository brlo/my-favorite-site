# jp-box, Иов, глава 15. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге Иов есть только для глав 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: вторая речь Елифаза. Формула 15:1 — повествование вне кавычек; речь 15:2–35 —
# одна цитата 「…」 до конца главы.
# Поэзия: параллелизмы сохранены; тёмные места не сглажены (15:2 «ветреное разумение»,
# 15:7 «прежде холмов сгущён», 15:23 коршуны и «тёмный день», 15:26–27 образы ожирения,
# 15:29 «не бросит на землю тени»).
# Нумерация по gr: 35 стихов; деление совпадает с csl-ru и ru, кроме 15:8, где слав.
# добавляет «или в советника тя употреби Бог?» — этих слов в LXX нет; по паритету они
# внесены в основной текст без 〔…〕.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX): エリファズ, テマン人.
# Голоса: 1 — повествование, 2–35 — Елифаз (одна цитата, закрывается в конце главы).

