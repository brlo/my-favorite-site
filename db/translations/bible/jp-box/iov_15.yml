verses:
  1: "テマン人[じん]エリファズは答[こた]えて言[い]った。"
  2: "「知恵[ちえ]ある者[もの]が、風[かぜ]のような悟[さと]りの答[こた]えを返[かえ]し、苦[くる]しみで腹[はら]を満[み]たすだろうか。"
  3: "ふさわしくない言葉[ことば]で責[せ]め、何[なに]の益[やく]もない言葉[ことば]で論[ろん]じるのか。"
  4: "あなたこそ恐[おそ]れを捨[す]て去[さ]り、このような言葉[ことば]を主[しゅ]の前[まえ]で語[かた]り終[お]えたではないか。"
  5: "あなたは自分[じぶん]の口[くち]の言葉[ことば]のゆえに責[せき]めを負[お]い、力[ちから]ある者[もの]たちの言葉[ことば]をわきまえなかった。"
  6: "あなたを責[せ]めるのは、わたしではなく、あなたの口[くち]である。あなたの唇[くちびる]があなたに対して証[あか]しをする。"
  7: "何[なん]だ。あなたは人[ひと]のうちで最初[さいしょ]に生[う]まれた者[もの]なのか。丘[おか]よりも先[さき]に固[かた]められたのか。"
  8: "あなたは主[しゅ]の定[さだ]めを聞[き]いたのか。神[かみ]があなたを相談役[そうだんやく]に用[もち]いたのか。知恵[ちえ]があなたのところにだけ届[とど]いたのか。"
  9: "あなたは、わたしたちが知[し]らない何[なに]を知[し]っているのか。わたしたちも悟[さと]らない何を、あなたは悟っているのか。"
  10: "わたしたちの間[あいだ]には、老[お]いた者[もの]も古[ふる]い者もいて、その日[ひ]の数[かず]はあなたの父[ちち]よりも多[おお]い。"
  11: "あなたは、自分[じぶん]の罪[つみ]のゆえに、わずかしか打[う]たれていないのに、あまりにも度[ど]を越[こ]えて大[おお]げさに語[かた]った。"
  12: "あなたの心[こころ]は何[なに]を敢[あ]えてしたのか。あなたの目[め]は何を高[たか]ぶらせたのか。"
  13: "主[しゅ]の前[まえ]で怒[いか]りを噴[ふ]き出[だ]し、口[くち]からこのような言葉[ことば]を出[だ]したからだ。"
  14: "人[ひと]とは何者[なにもの]か、非[とが]めのない者[もの]になれるというのか。女[おんな]から生[う]まれた者[もの]が、どうして正[ただ]しい者[もの]になれるというのか。"
  15: "見[み]よ、神[かみ]は聖[せい]なる者[もの]たちさえ信[しん]じない。天[てん]も神の前[まえ]には清[きよ]くない。"
  16: "忌[い]まわしい者[もの]、汚[けが]れた者[もの]、不義[ふぎ]を水[みず]のように飲[の]む人[ひと]は、なおさらだ。"
  17: "わたしはあなたに告[つ]げる。わたしの言[い]うことを聞[き]け。わたしが見[み]たことを、わたしはあなたに告げる。"
  18: "それは知恵[ちえ]ある者[もの]たちが語[かた]り、その父[ちち]たちが隠[かく]さなかったことである。"
  19: "彼[かれ]らにだけ、地[ち]が与[あた]えられ、ほかの種族[しゅぞく]の者[もの]は彼らのところに来[こ]なかった。"
  20: "不[ふ]敬[けい]な者[もの]の一生[いっしょう]は思[おも]い煩[わずら]いの中[なか]にあり、力[ちから]ある者[もの]には、数[かぞ]えられた年[とし]が与[あた]えられている。"
  21: "彼[かれ]の恐[おそ]れは彼の耳[みみ]にある。もう平和[へいわ]になったと思[おも]うとき、その滅[ほろ]びが来[く]る。"
  22: "彼[かれ]は闇[やみ]から逃[のが]れられると信[しん]じてはならない。すでに鉄[てつ]の手[て]に渡[わた]されているからだ。"
  23: "彼[かれ]は禿鷲[はげわし]の餌[えさ]として定[さだ]められている。自分[じぶん]が滅[ほろ]びに落[お]ちることを、彼は身[み]に知[し]っている。暗[くら]い日[ひ]が彼をかき乱[みだ]す。"
  24: "迫[せま]りと苦[くる]しみが彼を捕[と]らえる。先陣[せんじん]で倒[たお]れる将軍[しょうぐん]のように。"
  25: "主[しゅ]に逆[さか]らって手を上げ、全能者[ぜんのうしゃ]の前[まえ]でうなじを固[かた]くしたからである。"
  26: "自分[じぶん]の盾[たて]の背の厚[あつ]さに頼[たよ]り、傲慢[ごうまん]に神[かみ]へ向[む]かって走[はし]った。"
  27: "自分[じぶん]の顔[かお]を脂[あぶら]で覆[おお]い、ももの上[うえ]に肉[にく]の張り出しを造[つく]ったからである。"
  28: "彼[かれ]は荒廃[こうはい]した町々[まちまち]に住み、人[ひと]の住[す]まない家[いえ]に入[はい]る。彼らが備[そな]えたものを、ほかの者[もの]たちが奪[うば]う。"
  29: "彼[かれ]は富[とみ]むことはなく、その財産[ざいさん]も残[のこ]らない。地[ち]に影[かげ]を投[な]げることもない。"
  30: "彼[かれ]は闇[やみ]から逃[のが]れることがない。風[かぜ]が新芽[しんめ]を枯らし、その花[はな]が落[お]ちる。"
  31: "彼[かれ]は耐え忍[しの]べると信[しん]じてはならない。空[むな]しいことが彼に降[ふ]りかかるからである。"
  32: "彼[かれ]は時[とき]より早[はや]く切り倒[たお]され、その若枝[わかえだ]は茂[しげ]らない。"
  33: "彼[かれ]は熟[じゅく]さない葡萄[ぶどう]のように摘まれ、オリーブの花[はな]のように落[お]ちる。"
  34: "不[ふ]敬[けい]な者[もの]の証[あか]しは死[し]である。火[ひ]が賄賂[わいろ]を受[う]け取[と]る者[もの]の家[いえ]を焼く。"
  35: "彼[かれ]は腹[はら]に苦[くる]しみを宿[やど]し、空[むな]しいことを身に負[お]う。その腹は欺[あざむ]きを運[はこ]ぶ。」"

notes:
  1: "Повествование: формула вводит речь Елифаза, вне кавычек. Ὑπολαβὼν δὲ Ελιφας ὁ Θαιμανίτης λέγει — «и отвечал Елифаз Феманитянин и говорит» (ὑπολαμβάνω — «подхватывать, отвечать»); Θαιμανίτης — テマン人, по LXX. Слав. «Отвещав же Елифаз Феманитин, рече»."
  2: "Елифаз: Πότερον σοφὸς ἀπόκρισιν δώσει συνέσεως πνεύματος — «разве мудрый даст ответ разумения ветра»; πνεῦμα здесь «ветер» (слав. «на ветр»), т. е. пустое, ветреное знание. Родительный συνέσεως πνεύματος оставлен тёмным (風のような悟りの答え), без домысла. καὶ ἐνέπλησεν πόνον γαστρός — «и наполнил болезнью чрево»."
  3: "Елифаз: продолжение вопроса. ἐλέγχων — «обличая» (ἐλέγχω); ῥήματα и λόγοι переданы оба как 言葉, повтор намеренный. οἷς οὐ δεῖ — «какими не должно»; οἷς οὐδὲν ὄφελος — «от которых никакой пользы» (ὄφελος)."
  4: "Елифаз: οὐ καὶ σὺ ἀπεποιήσω φόβον — «не ты ли отверг страх» (ἀποποιέω — «отвергать»; φόβος — страх Божий, слав. «страх»); συνετέλεσας ῥήματα τοιαῦτα ἔναντι τοῦ κυρίου — «и совершил такие слова пред Господом». Син. здесь следует евр. («за малость считаешь речь к Богу»), в текст не внесён."
  5: "Елифаз: ἔνοχος εἶ ῥήμασιν στόματός σου — «виновен словами уст твоих» (ἔνοχος — «подлежащий суду»); οὐδὲ διέκρινας ῥήματα δυναστῶν — «и не различил слов сильных» (διακρίνω — «различать, рассудить»). Тёмное: чьи «сильные» — Бога или владык; оставлено 力ある者たち."
  6: "Елифаз: ἐλέγξαι σε τὸ σὸν στόμα καὶ μὴ ἐγώ — «да обличит тебя твои уста, а не я»; τὰ χείλη σου καταμαρτυρήσουσίν σου — «губы твои засвидетельствуют против тебя» (καταμαρτυρέω). Слав. «да обличат тя уста твоя, а не аз»."
  7: "Елифаз: τί γάρ; μὴ πρῶτος ἀνθρώπων ἐγενήθης — «что? разве ты первым из людей рождён»; ἢ πρὸ θινῶν ἐπάγης — «или прежде холмов ты был утверждён (сгущён)»: θίς — «песчаный холм», ἐπάγης — тёмная форма (от πήγνυμι, «уплотнять, утверждать»); слав. «прежде холмов сгустился еси». Передано 固められた, без сглаживания."
  8: "Елифаз: ἦ σύνταγμα κυρίου ἀκήκοας — «разве ты слышал устроение (совет) Господне» (σύνταγμα — «устроение, определение»); εἰς δὲ σὲ ἀφίκετο σοφία — «и к тебе пришла премудрость?» (εἰς σὲ подчёркнуто, отсюда だけ). Слав. добавляет «или в советника тя употреби Бог?» — этих слов в LXX нет, по паритету внесены в основной текст без 〔…〕."
  9: "Елифаз: τί οἶδας, ὃ οὐκ οἴδαμεν — «что ты знаешь, чего мы не знаем»; τί συνίεις, ὃ οὐχὶ καὶ ἡμεῖς — «что разумеешь, чего и мы [не разумеем]»; сказуемое во второй половине опущено, как в греч."
  10: "Елифаз: καί γε πρεσβύτης καί γε παλαιὸς ἐν ἡμῖν — «и старец, и древний есть среди нас»; βαρύτερος τοῦ πατρός σου ἡμέραις — «днями тяжелее (старше) отца твоего» (βαρύς — «тяжёлый», о возрасте). Слав. «старший отца твоего деньми»."
  11: "Елифаз: ὀλίγα ὧν ἡμάρτηκας μεμαστίγωσαι — «мало [за то], в чём согрешил, ты бичеван» (μαστιγόω — «бичевать»); μεγάλως ὑπερβαλλόντως λελάληκας — «весьма чрезмерно ты говорил». Син. здесь иной по евр. («разве малость для тебя утешения Божии»), в текст не внесён."
  12: "Елифаз: τί ἐτόλμησεν ἡ καρδία σου — «что дерзнуло сердце твоё» (τολμάω — «дерзать»); τί ἐπήνεγκαν οἱ ὀφθαλμοί σου — «что подняли глаза твои»; слав. «что вознесостеся очи твои»."
  13: "Елифаз: ὅτι θυμὸν ἔρρηξας ἔναντι κυρίου — «ибо ярость изрыгнул ты пред Господом» (ῥήγνυμι — «разрывать, извергать»); ἐξήγαγες ἐκ στόματος ῥήματα τοιαῦτα — «изнёс из уст такие слова»."
  14: "Елифаз: τίς ὢν βροτός, ὅτι ἔσται ἄμεμπτος — «кто, будучи человеком, будет непорочен» (βροτός — «смертный»; ἄμεμπτος — «безупречный»); γεννητὸς γυναικός — «рождённый от жены». Слав. «рожден от жены»."
  15: "Елифаз: εἰ κατὰ ἁγίων οὐ πιστεύει — «если он и святым не доверяет» (κατά с род. — «в отношении»); οὐρανὸς δὲ οὐ καθαρὸς ἐναντίον αὐτοῦ — «и небо не чисто пред Ним». Подлежащее — Бог, в японском назван 神 для ясности."
  16: "Елифаз: ἔα δὲ ἐβδελυγμένος καὶ ἀκάθαρτος — «тем более мерзкий и нечистый» (ἔα — усилительное «тем более»; βδελύσσομαι — «гнушаться»); ἀνὴρ πίνων ἀδικίας ἴσα ποτῷ — «человек, пьющий беззаконие, как питьё». Сравнение сохранено (水のように飲む)."
  17: "Елифаз: ἀναγγελῶ δέ σοι, ἄκουέ μου — «возвещу тебе, послушай меня»; ἃ δὴ ἑώρακα — «что я воистину видел» (ὁράω); повтор ἀναγγελῶ сохранён (告げる…告げる)."
  18: "Елифаз: ἃ σοφοὶ ἐροῦσιν — «что скажут мудрые»; οὐκ ἔκρυψαν πατέρας αὐτῶν — «не утаили от отцов своих» (κρύπτω). Слав. «не утаиша отцы их»."
  19: "Елифаз: αὐτοῖς μόνοις ἐδόθη ἡ γῆ — «им одним дана была земля»; οὐκ ἐπῆλθεν ἀλλογενὴς ἐπ᾽ αὐτούς — «и не пришёл иноплеменник на них» (ἀλλογενής — «чужеземец»). Речь о древних, которым принадлежала земля."
  20: "Елифаз: πᾶς ὁ βίος ἀσεβοῦς ἐν φροντίδι — «вся жизнь нечестивого в заботе (тревоге)» (φροντίς); ἔτη ἀριθμητὰ δεδομένα δυνάστῃ — «годы исчисленные даны сильному» (δυνάστης — «властелин, сильный»). Тёмное: «сильный» — сам нечестивец-притеснитель; Син. «число лет закрыто от притеснителя» (по евр.)."
  21: "Елифаз: ὁ φόβος αὐτοῦ ἐν ὠσὶν αὐτοῦ — «страх его в ушах его»; ὅταν δοκῇ ἤδη εἰρηνεύειν — «когда покажется, что уже в мире» (εἰρηνεύω); ἥξει αὐτοῦ ἡ καταστροφή — «придёт его низвержение» (καταστροφή)."
  22: "Елифаз: μὴ πιστευέτω ἀποστραφῆναι ἀπὸ σκότους — «да не думает, что отвратится от тьмы»; ἐντέταλται ἤδη εἰς χεῖρας σιδήρου — «ибо уже предан в руки железа» (σίδηρος — «железо», т. е. меча). Слав. «осужден бо уже в руки железа»."
  23: "Елифаз: κατατέτακται εἰς σῖτα γυψίν — «он назначен в пищу коршунам» (γύψ — «коршун, стервятник»; слав. «неясытем»); οἶδεν ἐν ἑαυτῷ ὅτι μένει εἰς πτῶμα — «знает в себе, что остаётся до падения»; ἡμέρα σκοτεινὴ στροβήσει — «тёмный день приведёт его в смятение» (στροβέω)."
  24: "Елифаз: ἀνάγκη καὶ θλῖψις αὐτὸν καθέξει — «нужда и скорбь овладеют им» (κατέχω); ὥσπερ στρατηγὸς πρωτοστάτης πίπτων — «как военачальник, падающий в первом ряду» (πρωτοστάτης — «стоящий впереди»). Слав. «якоже военачалник напреди стояй падает»."
  25: "Елифаз: ὅτι ἦρκεν χεῖρας ἐναντίον τοῦ κυρίου — «ибо поднял руки против Господа» (αἴρω); ἔναντι κυρίου παντοκράτορος ἐτραχηλίασεν — «пред Господом Вседержителем ожесточил выю» (τραχηλιάω — «упорствовать»); παντοκράτωρ — 全能者."
  26: "Елифаз: ἔδραμεν ἐναντίον αὐτοῦ ὕβρει — «побежал против Него с дерзостью» (ὕβρις — «наглость»); ἐν πάχει νώτου ἀσπίδος αὐτοῦ — тёмное: «в толщине хребта щита его», т. е. полагаясь на толстый щит (или на собственную толстокожесть); передано 盾の背の厚さに頼り, без домысла. Слав. «в толщи хребта щита своего»."
  27: "Елифаз: ἐκάλυψεν τὸ πρόσωπον αὐτοῦ ἐν στέατι αὐτοῦ — «покрыл лицо своё жиром своим» (στέαρ — «тук, жир»); ἐποίησεν περιστόμιον ἐπὶ τῶν μηρίων — «сделал опоясание (нарост) на бёдрах» (περιστόμιον — «ободок, кайма»), образ ожирения; слав. «сотвори омет на стегнах»."
  28: "Елифаз: αὐλισθεῖη πόλεις ἐρήμους — «да вселится он в города опустевшие» (αὐλίζομαι — «жить, стоять станом»); εἰσέλθοι εἰς οἴκους ἀοικήτους — «да войдёт в дома необитаемые»; ἃ ἐκεῖνοι ἡτοίμασαν, ἄλλοι ἀποίσονται — «что те приготовили, другие унесут». Оптативы переданы настоящим/будущим."
  29: "Елифаз: οὔτε μὴ πλουτισθῇ — «и не обогатится»; οὔτε μὴ μείνῃ αὐτοῦ τὰ ὑπάρχοντα — «и не останется имущество его»; οὐ μὴ βάλῃ ἐπὶ τὴν γῆν σκιάν — «не бросит на землю тени»: тёмный образ, возможно «не оставит и тени»; сохранено буквально."
  30: "Елифаз: οὐδὲ μὴ ἐκφύγῃ τὸ σκότος — «и не избежит тьмы»; τὸν βλαστὸν αὐτοῦ μαράναι ἄνεμος — «росток его да иссушит ветер» (βλαστός — «побег»; μαραίνω — «сушить»); ἐκπέσοι αὐτοῦ τὸ ἄνθος — «да отпадёт цвет его»."
  31: "Елифаз: μὴ πιστευέτω ὅτι ὑπομενεῖ — «да не верит, что устоит» (ὑπομένω — «выдерживать»); κενὰ γὰρ ἀποβήσεται αὐτῷ — «ибо пустое будет ему» (κενά — «тщетное»)."
  32: "Елифаз: ἡ τομὴ αὐτοῦ πρὸ ὥρας φθαρήσεται — «срезание его прежде времени погибнет» (τομή — «срезание, отсечение»); ὁ ῥάδαμνος αὐτοῦ οὐ μὴ πυκάσῃ — «и ветвь его не покроется листвой» (ῥάδαμνος — «ветвь, побег»; πυκάζω — «густо покрывать»). Слав. «посечение… леторасль… не облиственеет»."
  33: "Елифаз: τρυγηθείη ὥσπερ ὄμφαξ πρὸ ὥρας — «да будет он снят, как незрелая гроздь, прежде времени» (τρυγάω — «собирать виноград»; ὄμφαξ — «незрелая ягода»); ἐκπέσοι ὡς ἄνθος ἐλαίας — «да отпадёт, как цвет оливы»."
  34: "Елифаз: μαρτύριον ἀσεβοῦς θάνατος — «свидетельство нечестивого — смерть» (μαρτύριον); πῦρ καύσει οἴκους δωροδεκτῶν — «огонь сожжёт дома принимающих дары» (δωροδέκτης — «мздоимец»). Слав. «послушество… мздоимцев»."
  35: "Елифаз: ἐν γαστρὶ λήμψεται ὀδύνας — «во чреве зачнёт болезни» (ὀδύνη — «боль»); ἀποβήσεται αὐτῷ κενά — «и выйдет ему пустое»; ἡ κοιλία αὐτοῦ ὑποίσει δόλον — «чрево его понесёт обман» (δόλος). Здесь речь Елифаза заканчивается."
