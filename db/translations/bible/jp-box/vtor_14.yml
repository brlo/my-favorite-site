# jp-box, Второзаконие, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: запрет языческих траурных обрядов (1–2), чистая и нечистая пища (3–21),
# десятины и трапеза пред Господом (22–27), десятина третьего года (28–29).
# Нумерация совпадает с csl-ru и ru: 29 стихов. Речь Моисея — 「…」 (вся глава).
# Красного и синего нет. Вложенных цитат в главе нет.
# 〔…〕 одно: 14:27 — в gr-lxx-byz стих без глагола («и левит… ибо нет ему части…»),
# слав. добавляет «не оставивши его», Син. «не оставь»; это восполнение церковного
# чтения, поэтому 見捨ててはならない стоит в 〔…〕 (проверено bracket_check: глаголов
# ἐγκαταλείπω/ἀφίημι/ἐάω в ст. 14:27 нет).
# Сносок ⟨…⟩ нет: животные переданы по Лев 11, 寄留者, 嗣業, 初子 уже в корпусе.
# LXX 14:5: семь названий животных расходятся с масоретским списком и с csl;
# 14:27 слав. «не оставивши его» — добавка к греческому.
# jp-ni не использовался.

