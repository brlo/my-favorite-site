verses:
  1: "「あなたがたは、あなたがたの神[かみ]である主[しゅ]の子[こ]らである。死[し]んだ者[もの]のために、体[からだ]に傷[きず]を付[つ]けたり、目の間[あいだ]の髪[かみ]をそり上[あ]げたりしてはならない。"
  2: "あなたはあなたの神[かみ]である主[しゅ]にとって聖[せい]なる民[たみ]であり、あなたの神である主は、地[ち]の面[おもて]にあるすべての民[たみ]のうちから、あなたをご自分[じぶん]の宝[たから]の民とするために選[えら]ばれたからである。"
  3: "あなたがたは、いかなる忌[いま]むべきものも食[た]べてはならない。"
  4: "食[た]べてよい家畜[かちく]は次[つぎ]のとおりである。牛[うし]の群[む]れからの子牛[こうし]、羊[ひつじ]の群れからの小羊[こひつじ]、山羊[やぎ]の群れからの子山羊[こやぎ]、"
  5: "鹿[しか]、かもしか、野牛[やぎゅう]、アイベックス、アンテロープ、オリックス、キリン。"
  6: "ひづめが分[わ]かれ、ひづめに割[わ]れ目[め]があり、反芻[はんすう]する家畜[かちく]は、すべて食[た]べてよい。"
  7: "ただし、反芻[はんすう]するもの、またひづめが分[わ]かれ割[わ]れ目[め]のあるもののうち、次[つぎ]のものは食[た]べてはならない。ラクダ、毛深[けぶか]い足[あし]を持[も]つ獣[けもの]、野兎[のうさぎ]である。これらは反芻するが、ひづめが分かれていない。あなたがたには汚[けが]れたものである。"
  8: "また豚[ぶた]である。豚はひづめが分[わ]かれ、ひづめに割[わ]れ目[め]があるが、反芻[はんすう]しない。これはあなたがたには汚[けが]れたものである。それらの肉[にく]を食[た]べてはならず、その死骸[しがい]に触[ふ]れてはならない。"
  9: "水[みず]の中[なか]のすべてのもののうち、次[つぎ]のものは食[た]べてよい。水の中にいて、ひれと鱗[うろこ]のあるものは、すべて食[た]べてよい。"
  10: "ひれも鱗[うろこ]もないものは、すべて食[た]べてはならない。それらはあなたがたには汚[けが]れたものである。"
  11: "清[きよ]い鳥[とり]は、すべて食[た]べてよい。"
  12: "ただし、次[つぎ]のものは食[た]べてはならない。鷲[わし]、禿[はげ]鷲[わし]、海[うみ]鷲[わし]、"
  13: "禿[はげ]鷹[たか]と鳶[とび]、およびその類[るい]、"
  14: "からすとその類[るい]、"
  15: "ダチョウ、ふくろう、かもめ、"
  16: "鷺[さぎ]、白鳥[はくちょう]、イビス、"
  17: "隼[はやぶさ]、鷹[たか]とその類[るい]、ヤツガシラ、みみずく、"
  18: "ペリカン、千鳥[ちどり]とその類[るい]、水鶏[くいな]、こうもり。"
  19: "羽[はね]のある這[は]うものは、すべてあなたがたには汚[けが]れたものであり、それらを食[た]べてはならない。"
  20: "清[きよ]い鳥[とり]は、すべて食[た]べてよい。"
  21: "あなたがたは、いかなる死骸[しがい]も食[た]べてはならない。あなたの町[まち]にいる寄留者[きりゅうしゃ]に与[あた]えなさい。その者[もの]はそれを食[た]べることができる。あるいは外国人[がいこくじん]に売[う]りなさい。あなたはあなたの神[かみ]である主[しゅ]にとって聖[せい]なる民[たみ]だからである。あなたは小羊[こひつじ]をその母[はは]の乳[ちち]で煮[に]てはならない。"
  22: "あなたは、あなたの種[たね]のすべての実[みの]り、すなわちあなたの畑[はたけ]の実りの十分[じゅうぶん]の一[いち]を、年[とし]ごとに取[と]り分[わ]けなさい。"
  23: "あなたは、あなたの神[かみ]である主[しゅ]が、そこに御名[みな]が呼[よ]ばれるために選[えら]ばれる所[ところ]で、あなたの神である主の前[まえ]にそれを食[た]べなさい。すなわち、あなたの小麦[こむぎ]とぶどう酒[ぶどうしゅ]と油[あぶら]の十分[じゅうぶん]の一[いち]、あなたの牛[うし]と羊[ひつじ]の初[うい]子[ご]を携[たずさ]えて来[き]て、あなたの神である主を恐[おそ]れることを、あなたの一生[いっしょう]の間[あいだ]、学[まな]びなさい。"
  24: "もしあなたからの道[みち]が遠[とお]く、あなたの神[かみ]である主[しゅ]が、そこに御名[みな]が呼[よ]ばれるために選[えら]ばれる所[ところ]があなたから遠く離[はな]れていて、それらを運[はこ]ぶことができないなら、あなたの神である主があなたを祝福[しゅくふく]してくださるので、"
  25: "それらを銀[ぎん]で売[う]り、その銀を手[て]に持[も]って、あなたの神[かみ]である主[しゅ]が選[えら]ばれる所[ところ]へ行[い]き、"
  26: "その銀を、あなたの魂[たましい]が望[のぞ]むすべてのもの、すなわち牛[うし]や羊[ひつじ]、ぶどう酒[ぶどうしゅ]や強[つよ]い酒[さけ]、あなたの魂が望むすべてのものに使[つか]いなさい。そして、あなたの神[かみ]である主[しゅ]の前[まえ]でそこで食[た]べ、あなたもあなたの家[いえ]も喜[よろこ]びなさい。"
  27: "あなたの町[まち]にいるレビ人[びと]を〔見捨[みす]ててはならない〕。彼にはあなたとともに受[う]ける分[ぶん]も嗣業[しぎょう]もないからである。"
  28: "三[さん]年[ねん]が過[す]ぎるごとに、あなたの実[みの]りの十分[じゅうぶん]の一[いち]をすべて持[も]ち出[だ]し、その年[とし]はそれをあなたの町々[まちまち]に置[お]きなさい。"
  29: "そして、あなたの町々[まちまち]にいるレビ人[びと]も来[き]なさい。彼にはあなたとともに受[う]ける分[ぶん]も嗣業[しぎょう]もないからである。寄留者[きりゅうしゃ]、孤児[みなしご]、寡婦[やもめ]も来なさい。彼らは食[た]べて満[み]ち足[た]りる。それは、あなたの神[かみ]である主[しゅ]が、あなたの行[おこな]うすべてのわざにおいてあなたを祝福[しゅくふく]してくださるためである。」"

notes:
  1: "Υἱοί ἐστε — вы сыны (мн.). οὐ φοιβήσετε — не нарежете тело; φαλάκρωμα — плешь, выстриженное место. ἀνὰ μέσον τῶν ὀφθαλμῶν — между глазами. ἐπὶ νεκρῷ — над умершим (запрет языческого траура)."
  2: "λαὸς ἅγιος — народ святой. ἐξελέξατο — избрал. λαὸν περιούσιον — народ особый, приобретённый (περιούσιος; слав. «люди избраннии»); передано 宝の民 (как в 7:6)."
  3: "βδέλυγμα — мерзость; οὐ φάγεσθε πᾶν βδέλυγμα — никакой мерзости не ешьте."
  4: "μόσχον ἐκ βοῶν — телёнка из крупного скота; ἀμνὸν ἐκ προβάτων — агнца из овец; χίμαρον ἐξ αἰγῶν — козлёнка из коз."
  5: "ἔλαφος — олень (鹿); δορκάς — серна, косуля (かもしか); βούβαλος — буйвол (野牛); τραγέλαφος — букв. «козлоолень», горный козёл, ибекс (アイベックス); πύγαργος — букв. «белозадый», антилопа (アンテロープ); ὄρυξ — орикс (オリックス); καμηλοπάρδαλις — жираф (キリン; слав. «сайгак», Син. «камелопард»). Отождествления спорны."
  6: "διχηλοῦν ὁπλήν — раздвояющее копыто; ὀνυχιστῆρας ὀνυχίζον δύο χηλῶν — имеющее двойные копыта (двойное выражение LXX); ἀνάγον μηρυκισμόν — жующее жвачку."
  7: "ἀναγόντων μηρυκισμόν — жующих жвачку; διχηλούντων τὰς ὁπλάς — раздвояющих копыта. κάμηλος — верблюд; δασύπους — «мохноногий», вид неясен (毛深い足を持つ獣, ср. Лев 11:5); χοιρογρύλλιος — заяц (野兎, ср. Лев 11:6). ἀκάθαρτα — нечисты."
  8: "ὗς — свинья (豚). μηρυκισμὸν οὐ μαρυκᾶται — жвачки не жуёт. θνησιμαῖα — трупы, мертвечина; οὐχ ἅψεσθε — не прикасайтесь."
  9: "πτερύγια — плавники (букв. «перья»); λεπίδες — чешуя. В воде — всё с плавниками и чешуёй."
  10: "ὅσα οὐκ ἔστιν αὐτοῖς πτερύγια καὶ λεπίδες — у которых нет плавников и чешуи."
  11: "πᾶν ὄρνεον καθαρόν — всякая птица чистая."
  12: "ἀετός — орёл (鷲); γρύψ — гриф (禿鷲); ἁλιάετος — морской орёл, скопа (海鷲); ср. Лев 11:13."
  13: "γύψ — сип, гриф (禿鷹); ἰκτῖνος — коршун (鳶); τὰ ὅμοια αὐτῷ — подобные ему."
  14: "κόραξ — ворон (からす); τὰ ὅμοια — подобные."
  15: "στρουθός — здесь страус (ダチョウ); γλαῦξ — сова (ふくろう); λάρος — чайка (かもめ)."
  16: "ἐρωδιός — цапля (鷺); κύκνος — лебедь (白鳥); ἶβις — ибис (イビス)."
  17: "καταράκτης — сокол, ныряющая хищная птица (隼); ἱέραξ — ястреб (鷹); ἔποψ — удод (ヤツガシラ); νυκτικόραξ — филин, ночная сова (みみずく)."
  18: "πελεκάν — пеликан; χαραδριός — ржанка, зуй (千鳥); πορφυρίων — султанка, водяная курочка (水鶏); νυκτερίς — летучая мышь (こうもり)."
  19: "ἑρπετὰ τῶν πετεινῶν — пресмыкающиеся из птиц, т.е. крылатые насекомые и мелкие твари; ἀκάθαρτα — нечисты."
  20: "πᾶν πετεινὸν καθαρόν — всякая птица чистая. Повтор ст. 11 в конце раздела."
  21: "θνησιμαῖον — мертвечина, труп. παροίκῳ — пришельцу, живущему у тебя (寄留者); ἀλλοτρίῳ — иноземцу (外国人). λαὸς ἅγιος — народ святой. οὐχ ἑψήσεις ἄρνα ἐν γάλακτι μητρός — не вари агнца в молоке матери (запрет языческого обряда)."
  22: "Δεκάτην ἀποδεκατώσεις — десятину отделишь (ἀποδεκατόω). γένημα — произведение, плод. σπέρμα — семя. ἐνιαυτὸν κατ᾽ ἐνιαυτόν — год за годом."
  23: "ἐπικληθῆναι τὸ ὄνομα αὐτοῦ — чтобы имя Его было призвано (御名が呼ばれる); ср. 12:5, 11. ἐπιδέκατα — десятины. πρωτότοκα — первенцы (初子). ἵνα μάθῃς φοβεῖσθαι — чтобы научился бояться."
  24: "μακρὰν γένηται ἡ ὁδός — далёк будет путь. μὴ δύνῃ ἀναφέρειν — не сможешь нести. εὐλογήσει σε — благословит тебя."
  25: "ἀποδώσῃ ἀργυρίου — продашь за серебро. λήμψῃ τὸ ἀργύριον ἐν ταῖς χερσίν — возьмёшь серебро в руки."
  26: "ἐπὶ παντός, οὗ ἐὰν ἐπιθυμῇ ἡ ψυχή σου — на всё, чего пожелает душа твоя. σίκερα — сикер, крепкий напиток (強い酒; ср. Лев 10:9). εὐφρανθήσῃ — возвеселишься."
  27: "В gr-lxx-byz стих без глагола: καὶ ὁ Λευίτης… ὅτι οὐκ ἔστιν αὐτῷ μερίς… — «и левит… ибо нет ему части…». Слав. добавляет «не оставивши его», Син. «не оставь»; это восполнение церковного чтения, поэтому 見捨ててはならない в 〔…〕. Проверено: ἐγκαταλείπω, ἀφίημι, ἐάω в ст. 14:27 отсутствуют."
  28: "μετὰ τρία ἔτη — по прошествии трёх лет (каждый третий год). ἐξοίσεις — вынесешь. ἐπιδέκατον — десятина. θήσεις ἐν ταῖς πόλεσίν σου — положишь в городах твоих."
  29: "ἐλεύσεται ὁ Λευίτης — придёт левит. προσήλυτος, ὀρφανός, χήρα — пришелец, сирота, вдова (寄留者、孤児、寡婦). ἐμπλησθήσονται — насытятся. ἵνα εὐλογήσῃ σε — чтобы благословил тебя."
