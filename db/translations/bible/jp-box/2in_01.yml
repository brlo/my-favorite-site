# jp-box, Второе послание Иоанна, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–3), радость о детях, ходящих в истине (4),
# заповедь любви (5–6), предостережение против обманщиков (7–9),
# запрет принимать лжеучителей (10–11), заключение (12–13).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕: 1:13 — церковное ἀμήν; в базе стих кончается на ἐκλεκτῆς, ἀμήν нет
# (проверено запросом к gr-lxx-byz).
# Кавычки 「…」: 1:10–11 — приветствие «平安あれ» (χαίρειν) как чужая речь;
# 1:5 — просьба, а не цитата, поэтому без кавычек.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: 2in
chapter: 1
draft: true

verses:
  1: "長老[ちょうろう]から、選[えら]ばれた婦人[ふじん]とその子[こ]どもたちへ。わたしが真理[しんり]のうちに愛[あい]している者[もの]たちであり、わたしだけでなく、真理[しんり]を知[し]ったすべての人[ひと]も愛[あい]している。"
  2: "それは、わたしたちのうちにとどまり、いつまでもわたしたちとともにある真理[しんり]のゆえである。"
  3: "{恵[めぐ]み|恩寵[おんちょう]}と慈[じ]しみと平和[へいわ]が、父[ちち]である神[かみ]と、父[ちち]の子[こ]であるイエス・キリストから、真理[しんり]と愛[あい]のうちに、わたしたちとともにありますように。"
  4: "あなたの子[こ]どもたちのうちに、わたしたちが父[ちち]から受[う]けた戒[いまし]めに従[したが]って真理[しんり]のうちを歩[あゆ]んでいる者[もの]がいることを知[し]って、わたしは大変[たいへん]に喜[よろこ]んだ。"
  5: "婦人[ふじん]よ、今[いま]、わたしはあなたに願[ねが]う。新しい戒[いまし]めを書[か]いているのではない。わたしたちが初[はじ]めから持[も]っていた戒[いまし]め、すなわち、わたしたちが互[たがい]に愛[あい]し合[あ]うことである。"
  6: "愛[あい]とは、わたしたちがその戒[いまし]めに従[したが]って歩[あゆ]むことである。これがその戒[いまし]めであり、あなたがたが初[はじ]めから聞[き]いたとおり、そのうちを歩[あゆ]むことである。"
  7: "というのは、多[おお]くの惑[まど]わし者[もの]が世[よ]に出[で]て行[い]ったからである。彼[かれ]らは、イエス・キリストが肉[にく]となって来[こ]られたことを告白[こくはく]しない者[もの]たちである。このような者[もの]こそ惑[まど]わし者[もの]であり、反[はん]キリストである。"
  8: "自分[じぶん]自身[じしん]に気[き]をつけなさい。あなたがたが成[な]し遂[と]げたものを失[うしな]わず、十分[じゅうぶん]な報[むく]いを受[う]け取[と]るためである。"
  9: "キリストの教[おし]えにとどまらず、それを通[とお]り越[こ]えて進[すす]む者[もの]は、神[かみ]を持[も]たない。その教[おし]えにとどまる者[もの]こそ、父[ちち]と子[こ]の両方[りょうほう]を持[も]つのである。"
  10: "だれかがあなたがたのところに来[き]て、この教[おし]えを持[も]って来[こ]ないなら、その人[ひと]を家[いえ]に迎[むか]え入[い]れてはならない。また、その人[ひと]に「平安[へいわ]あれ」と言[い]ってもならない。"
  11: "その人[ひと]に「平安[へいわ]あれ」と言[い]う者[もの]は、その人[ひと]の悪[わる]い行[おこな]いに関[かか]わるのである。"
  12: "あなたがたに書[か]くべきことが多[おお]くあるが、紙[かみ]と墨[すみ]で書[か]くことは望[のぞ]まない。むしろ、あなたがたのところへ行[い]って、顔[かお]と顔[かお]を合[あ]わせて語[かた]り、わたしたちの喜[よろこ]びが満[み]ちあふれることを望[のぞ]んでいる。"
  13: "選[えら]ばれたあなたの姉妹[しまい]の子[こ]どもたちが、あなたによろしくと言[い]っている。〔アーメン。〕"

notes:
  1: "Ὁ πρεσβύτερος — 長老 (титул автора, а не возраст; ср. 1 Пет 5:1). ἐκλεκτῇ κυρίᾳ — 選ばれた婦人; κυρία может значить и «госпожа», и (в церковном толковании) поместную церковь — двусмысленность не разрешена. ἐν ἀληθείᾳ — 真理のうちに. οὐκ ἐγὼ μόνος — わたしだけでなく."
  2: "Стих продолжает период 1 ст.: διὰ τὴν ἀλήθειαν — 真理のゆえ. τὴν μένουσαν ἐν ἡμῖν — わたしたちのうちにとどまり. ἔσται — будущее время: いつまでも…ともにある. μεθ᾽ ἡμῶν — «с нами», не «с вами»."
  3: "ἔσται μεθ᾽ ἡμῶν χάρις ἔλεος εἰρήνη — 恵みと慈しみと平和; порядок и «с нами» сохранены. παρὰ θεοῦ πατρός — 父である神から. τοῦ υἱοῦ τοῦ πατρός — 父の子 (родительный отношения, не «Сын Отца» как титул). ἐν ἀληθείᾳ καὶ ἀγάπῃ — 真理と愛のうちに."
  4: "ἐχάρην λίαν — 大変に喜んだ. ἐκ τῶν τέκνων σου — あなたの子どもたちのうちに (не все, а некоторые). περιπατοῦντας ἐν ἀληθείᾳ — 真理のうちを歩んでいる. καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός — 父から受けた戒めに従って."
  5: "ἐρωτῶ σε — 願う (просьба, поэтому без кавычек). οὐχ ὡς ἐντολὴν γράφων σοι καινήν — 新しい戒めを書いているのではない. ἣν εἴχομεν ἀπ᾽ ἀρχῆς — 初めから持っていた. ἵνα ἀγαπῶμεν ἀλλήλους — 互いに愛し合うこと."
  6: "αὕτη ἐστὶν ἡ ἀγάπη — 愛とは. ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ — その戒めに従って歩むこと. Вторая половина: αὕτη ἡ ἐντολή ἐστιν… ἵνα ἐν αὐτῇ περιπατῆτε — そのうちを歩むこと; повтор не сглажен."
  7: "πολλοὶ πλάνοι ἐξῆλθον εἰς τὸν κόσμον — 多くの惑わし者が世に出て行った. μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί — 肉となって来られたことを告白しない (причастие настоящего времени). οὗτος ὁ πλάνος καὶ ὁ ἀντίχριστος — この者こそ…反キリスト (определение, не имя собственное)."
  8: "βλέπετε ἑαυτούς — 自分自身に気をつけなさい. ἃ εἰργάσθε — あなたがたが成し遂げたもの (в базе 2 л. мн. ч.; у jp-joc «мы»). μισθὸν πλήρη — 十分な報い."
  9: "ὁ προάγων — «идущий впереди, выходящий за пределы»; не «преступающий» (у jp-joc «罪を犯して» — слав. «преступаяй»). θεὸν οὐκ ἔχει — 神を持たない. ὁ μένων ἐν τῇ διδαχῇ — 教えにとどまる者; игра 進む/とどまる сохранена."
  10: "εἴ τις ἔρχεται… καὶ ταύτην τὴν διδαχὴν οὐ φέρει — この教えを持って来ない. μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν — 家に迎え入れてはならない. χαίρειν αὐτῷ μὴ λέγετε — 「平安あれ」と言ってはならない; χαίρειν — формула приветствия, поэтому в 「」."
  11: "ὁ λέγων γὰρ αὐτῷ χαίρειν — 「平安あれ」と言う者. κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς — その人の悪い行いに関わる (κοινωνέω — иметь общение, быть соучастником)."
  12: "πολλὰ ἔχων ὑμῖν γράφειν — 書くべきことが多くある. διὰ χάρτου καὶ μέλανος — 紙と墨で. στόμα πρὸς στόμα λαλῆσαι — 顔と顔を合わせて語る (букв. «уста к устам»). ἵνα ἡ χαρὰ ἡμῶν πεπληρωμένη ᾖ — わたしたちの喜びが満ちあふれるように; в базе ἡμῶν, у jp-joc «ваша»."
  13: "ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ἐκλεκτῆς — 選ばれたあなたの姉妹の子どもたちが…よろしくと言っている. В базе ἀμήν нет; церковный текст (Синодальный «Аминь», jp-joc 「アミン」) добавляет — 〔アーメン〕. Проверено по базе: ἀμήν в стихе — 0."
