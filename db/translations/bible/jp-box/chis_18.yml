# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: грех святилища и священства (1), левиты в помощь священникам (2–7),
# начатки и дары священникам (8–19), удел Левия — Сам Господь (20),
# десятины левитам (21–24), десятина от десятины Аарону (25–29),
# левитам позволено есть её на всяком месте (30–32).
# Речь Бога — 「…」; в 18:24 вложенная речь — 『…』.
