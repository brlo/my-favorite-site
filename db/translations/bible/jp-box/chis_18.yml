verses:
  1: "「あなたとあなたの子[こ]ら、およびあなたの父[ちち]の家[いえ]は、聖所[せいしょ]の罪[つみ]を負[お]う。あなたとあなたの子[こ]らは、あなたがたの祭司[さいし]職[しょく]の罪[つみ]を負[お]う。"
  2: "また、あなたの兄弟[きょうだい]たち、すなわちレビの部族[ぶぞく]、あなたの父[ちち]の氏族[しぞく]を、あなたのそばに連[つ]れて来[き]なさい。彼[かれ]らはあなたに加[くわ]えられ、あなたに仕[つか]えるであろう。あなたとあなたの子[こ]らは、彼[かれ]らとともに証[あかし]の幕屋[まくや]の前[まえ]にいる。"
  3: "彼[かれ]らはあなたの務[つと]めと幕屋[まくや]の務[つと]めを守[まも]る。ただし、聖[せい]なる器[うつわ]と祭壇[さいだん]には近[ちか]づいてはならない。彼[かれ]らもあなたがたも死[し]なないためである。"
  4: "彼[かれ]らはあなたに加[くわ]えられ、幕屋[まくや]のすべての務[つと]めに従[したが]って証[あかし]の幕屋[まくや]の務[つと]めを守[まも]る。他国人[たこくじん]はあなたに近[ちか]づいてはならない。"
  5: "あなたがたは聖所[せいしょ]の務[つと]めと祭壇[さいだん]の務[つと]めを守[まも]りなさい。そうすれば、イスラエルの子[こ]らの間[あいだ]に怒[いか]りは起[お]こらない。"
  6: "見[み]よ、わたしはあなたがたの兄弟[きょうだい]であるレビ人[びと]を、イスラエルの子[こ]らの間[あいだ]から取[と]って、証[あかし]の幕屋[まくや]の務[つと]めをするために、主[しゅ]に献[ささ]げられた贈[おくり]物[もの]として与[あた]えた。"
  7: "あなたとあなたの子[こ]らは、祭壇[さいだん]に関[かん]するすべてのことと、垂[た]れ幕[まく]の内側[うちがわ]のことについて、あなたがたの祭司[さいし]職[しょく]を守[まも]り、務[つと]めを果[は]たしなさい。あなたがたの祭司職[しょく]は贈[おくり]物[もの]として与[あた]えられている。近[ちか]づく他国人[たこくじん]は死[し]ぬ。」"
  8: "「見[み]よ、わたしはあなたがたに初穂[はつほ]を守[まも]る務[つと]めを与[あた]えた。イスラエルの子[こ]らがわたしに聖別[せいべつ]するすべてのもののうちから、わたしはそれらを、誉[ほま]れとしてあなたに、あなたの後[あと]の子[こ]らに与[あた]えた。これは永遠[えいえん]の定[さだ]めである。"
  9: "聖別[せいべつ]された聖[せい]なる捧[ささ]げ物[もの]のうちから、次[つぎ]のものがあなたがたのものとなる。すなわち、彼[かれ]らのすべての贈[おくり]物[もの]、すべての犠牲[ぎせい]、すべての過[あやま]ち、および彼[かれ]らがわたしに償[つぐな]うすべての罪[つみ]のうちから、すべての聖[せい]なるものは、あなたとあなたの子[こ]らのものとなる。"
  10: "あなたがたはそれを最も聖[せい]なる場所[ばしょ]で食[た]べなさい。男子[だんし]はすべてそれを食[た]べることができる。あなたとあなたの子[こ]らである。それはあなたにとって聖[せい]なるものである。"
  11: "また、これは彼[かれ]らの贈[おくり]物[もの]の初穂[はつほ]としてあなたがたのものとなる。イスラエルの子[こ]らのすべての差[さ]し上[あ]げ物[もの]のうちから、わたしはそれらを、あなたに、あなたの子[こ]らと娘[むすめ]たちに、あなたとともに与[あた]えた。これは永遠[えいえん]の定[さだ]めである。あなたの家[いえ]の清[きよ]い者[もの]はだれでもそれを食[た]べることができる。"
  12: "油[あぶら]の初穂[はつほ]、ぶどう酒[さけ]の初穂[はつほ]、麦[むぎ]の初穂[はつほ]、すなわち彼[かれ]らが主[しゅ]に与[あた]えるその初穂[はつほ]を、わたしはあなたに与[あた]えた。"
  13: "彼[かれ]らの地[ち]にあるすべての初[はつ]生[せい]の実[み]、すなわち彼[かれ]らが主[しゅ]に持[も]って来[く]るものは、あなたのものとなる。あなたの家[いえ]の清[きよ]い者[もの]はだれでもそれを食[た]べることができる。"
  14: "イスラエルの子[こ]らのうちで、聖別[せいべつ]してささげられたものは、すべてあなたのものとなる。"
  15: "すべての肉[にく]のうちで胎[たい]を開[ひら]くもの、すなわち人[ひと]から家畜[かちく]に至[いた]るまで、人々[ひとびと]が主[しゅ]に献[ささ]げるものは、あなたのものとなる。ただし、人[ひと]の初[うい]子[ご]は贖[あがな]いによって贖[あがな]われ、不[ふ]潔[けつ]な家畜[かちく]の初[うい]子[ご]もあなたが贖[あがな]わなければならない。"
  16: "その贖[あがな]い金[きん]は、生後[せいご]一[ひと]か月[つき]から、聖[せい]なるシケルに従[したが]って五[いつ]シケルと見積[みつ]もられる。すなわち二十[にじゅう]オボロスである。"
  17: "ただし、牛[うし]の初[うい]子[ご]、羊[ひつじ]の初[うい]子[ご]、山羊[やぎ]の初[うい]子[ご]は贖[あがな]ってはならない。それらは聖[せい]なるものである。あなたはその血[ち]を祭壇[さいだん]に注[そそ]ぎかけ、その脂肪[しぼう]を、主[しゅ]に芳[かんば]しい香[かおり]となる捧[ささ]げ物[もの]として献[ささ]げなさい。"
  18: "その肉[にく]はあなたのものとなる。差[さ]し上[あ]げの胸[むね]と右[みぎ]の肩[かた]と同[おな]じく、あなたのものとなる。"
  19: "イスラエルの子[こ]らが主[しゅ]に取[と]り分[わ]けるすべての聖[せい]なる取[と]り分[ぶん]を、わたしはあなたに、あなたの子[こ]らと娘[むすめ]たちに、あなたとともに与[あた]えた。これは永遠[えいえん]の定[さだ]めである。これは主[しゅ]の前[まえ]における、あなたとあなたの後[あと]の子孫[しそん]のための、永遠[えいえん]の塩[しお]の契約[けいやく]である。」"
  20: "「あなたは彼[かれ]らの地[ち]で嗣業[しぎょう]を受[う]けず、彼[かれ]らの間[あいだ]に分[わ]け前[まえ]もない。わたしがイスラエルの子[こ]らの間[あいだ]であなたの分[わ]け前[まえ]、あなたの嗣業[しぎょう]である。"
  21: "見[み]よ、わたしはレビの子[こ]らに、イスラエルにおける十分[じゅうぶん]の一[いち]をすべて、証[あかし]の幕屋[まくや]で彼[かれ]らが果[は]たす務[つと]めの代[か]わりに、嗣業[しぎょう]として与[あた]えた。"
  22: "イスラエルの子[こ]らはもはや、死[し]に至[いた]る罪[つみ]を負[お]うために証[あかし]の幕屋[まくや]に近[ちか]づいてはならない。"
  23: "レビ人[びと]自身[じしん]が証[あかし]の幕屋[まくや]の務[つと]めを果[は]たし、彼[かれ]らがその罪[つみ]を負[お]う。これは彼[かれ]らの世代[せだい]に至[いた]るまでの永遠[えいえん]の定[さだ]めである。彼[かれ]らはイスラエルの子[こ]らの間[あいだ]に嗣業[しぎょう]を受[う]けない。"
  24: "イスラエルの子[こ]らが主[しゅ]に取[と]り分[わ]けとして聖別[せいべつ]する十分[じゅうぶん]の一[いち]を、わたしはレビ人[びと]に嗣業[しぎょう]として与[あた]えたからである。それゆえ、わたしは彼[かれ]らに言[い]った。『彼[かれ]らはイスラエルの子[こ]らの間[あいだ]に嗣業[しぎょう]を受[う]けない』と。」"
  25: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  26: "「レビ人[びと]に語[かた]って言[い]いなさい。あなたがたがイスラエルの子[こ]らから、わたしが彼[かれ]らから嗣業[しぎょう]としてあなたがたに与[あた]えた十分[じゅうぶん]の一[いち]を受[う]けるとき、あなたがたはそのうちから、主[しゅ]への取[と]り分[わ]けとして、十分[じゅうぶん]の一[いち]の十分[じゅうぶん]の一[いち]を取[と]り分[わ]けなさい。"
  27: "あなたがたの取[と]り分[ぶん]は、脱穀場[だっこくじょう]からの麦[むぎ]と、ぶどう搾[しぼ]り場からの取[と]り分[ぶん]のように、あなたがたのものと見[み]なされる。"
  28: "同[おな]じように、あなたがたも、イスラエルの子[こ]らから受[う]けるすべての十分[じゅうぶん]の一[いち]のうちから、主[しゅ]への取[と]り分[ぶん]を取[と]り分[わ]けなさい。そしてそのうちから、主[しゅ]への取[と]り分[ぶん]を祭司[さいし]アロンに与[あた]えなさい。"
  29: "あなたがたのすべての贈[おくり]物[もの]のうちから、主[しゅ]への取[と]り分[ぶん]を取[と]り分[わ]けなさい。すべての初穂[はつほ]のうちから、その聖別[せいべつ]された部分[ぶぶん]を取[と]り分[わ]けなさい。"
  30: "また彼[かれ]らに言[い]いなさい。あなたがたがその初穂[はつほ]を取[と]り分[わ]けるとき、それはレビ人[びと]にとって、脱穀場[だっこくじょう]からの産物[さんぶつ]、ぶどう搾[しぼ]り場からの産物[さんぶつ]のように見[み]なされる。"
  31: "あなたがたとあなたがたの家[いえ]の者[もの]たちは、それをどこでも食[た]べることができる。それは、証[あかし]の幕屋[まくや]でのあなたがたの務[つと]めに対[たい]する報[むく]いだからである。"
  32: "あなたがたはその初穂[はつほ]を取[と]り分[わ]けるとき、それによって罪[つみ]を負[お]うことはない。イスラエルの子[こ]らの聖[せい]なるものを汚[けが]してはならない。死[し]なないためである。」"

notes:
  1: "ἁμαρτίας τῶν ἁγίων — «грехи святынь»: вина за небрежность о святилище (Синодальный: «грех за небрежность во святилище»). λήμψεσθε — возьмёте, т. е. понесёте на себе (λαμβάνω). ἱερατεία — священство, 祭司職."
  2: "δῆμος τοῦ πατρός σου — «народ/племя отца твоего» (δῆμος — народ, род; слав. «сонм отца твоего»). προσαγάγου πρὸς σεαυτόν — приведи к себе (προσάγω). προστεθήτωσάν σοι — да приложатся к тебе. λειτουργεῖν — служить (λειτουργέω, «литургия»)."
  3: "φυλακάς — стражи, т. е. обязанности (φυλακή — стража, караул). σκεύη τὰ ἅγια — священные сосуды. οὐ προσελεύσονται — не приступят (προσέρχομαι). οὐκ ἀποθανοῦνται καὶ οὗτοι καὶ ὑμεῖς — «не умрут и они, и вы»."
  4: "λειτουργίας — службы (λειτουργία). ἀλλογενής — иноплеменник, посторонний (ἀλλογενής — «иного рода»; слав. «иноплеменник»)."
  5: "θυμός — гнев, ярость. οὐκ ἔσται θυμὸς ἐν τοῖς υἱοῖς Ισραηλ — «не будет гнева на сынах Израиля» (слав. «не будет ктому гнева»)."
  6: "δόμα δεδομένον κυρίῳ — «дар, данный Господу» (δόμα — дар; perfect δεδομένον). εἴληφα — взял (λαμβάνω, perfect)."
  7: "διατηρήσετε — соблюдёте (διατηρέω). κατὰ πάντα τρόπον τοῦ θυσιαστηρίου — «по всякому образу жертвенника», т. е. всё, что относится к жертвеннику. τὸ ἔνδοθεν τοῦ καταπετάσματος — «внутреннее завесы» (καταπέτασμα — завеса). ὁ προσπορευόμενος — приступающий; ἀποθανεῖται — умрёт."
  8: "διατήρησιν τῶν ἀπαρχῶν — «хранение начатков», т. е. право и обязанность принимать их (ἀπαρχή — 初穂). γέρας — почётный дар (слав. «в честь»). νόμιμον αἰώνιον — вечный устав (永遠の定め)."
  9: "καρπώματα — приношения (κάρπωμα, «сожигаемое»). θυσιάσματα — жертвы. πλημμελεία — проступок, вина (слав. «преступление»). ἀποδιδόασίν μοι — отдают, воздают Мне (ἀποδίδωμι)."
  10: "ἐν τῷ ἁγίῳ τῶν ἁγίων — «в святом святых» (слав. «во святем святых»); передано 最も聖なる場所. ἀρσενικόν — мужского пола; πᾶν ἀρσενικόν — «всякий мужского пола», т. е. все мужчины рода Аарона."
  11: "ἀπαρχὴ δομάτων — начаток даров. ἐπιθέματα — «возложения», возношения (ἐπίθεμα; ср. Лев 7:34 στηθύνιον τοῦ ἐπιθέματος — 差し上げの胸). πᾶς καθαρός — всякий ритуально чистый."
  12: "ἀπαρχὴ ἐλαίου, οἴνου, σίτου — начатки елея, вина, пшеницы; ἀπαρχὴ αὐτῶν — начаток их."
  13: "πρωτογενήματα — первые произведения земли (πρωτογένημα). ὅσα ἂν ἐνέγκωσιν — что принесут (φέρω)."
  14: "ἀνατεθεματισμένον — «посвящённое», преданное Богу без возврата (ἀναθεματίζω; слав. «освященное», Синодальный «заклятое»)."
  15: "διανοῖγον μήτραν — «разверзающее ложесна», т. е. первенец (μήτρα — утроба). ἀπὸ πάσης σαρκός — от всякой плоти. λύτροις λυτρωθήσεται — выкупом будет выкуплен (λύτρον — выкуп). ἀκάθαρτα κτήνη — нечистые животные."
  16: "ἀπὸ μηνιαίου — «от месячного», с месячного возраста. συντίμησις — оценка (συντίμησις). σίκλος ἅγιος — священный сикль. В базе пояснение стоит в квадратных скобках: [εἴκοσι ὄβολοί εἰσιν] — «двадцать оболов» (ὀβολός — мелкая монета); передано отдельным предложением."
  17: "μόσχων — тельцов, προβάτων — овец, αἰγῶν — коз. προσχεεῖς — возольёшь (προσχέω, ср. Лев 1:5). στέαρ — тук, жир. ἀνοίσεις κάρπωμα — вознесёшь как приношение."
  18: "στηθύνιον τοῦ ἐπιθέματος — грудь возношения (差し上げの胸). βραχίων δεξιός — правое плечо."
  19: "ἀφαίρεμα — «отнимаемое», возношение (слав. «участие»); передано 取り分け (ср. Лев 7:34 «取り分けの肩»). διαθήκη ἁλός — завет соли: соль как знак нерушимости (ср. Лев 2:13). σπέρμα — потомство."
  20: "κληρονομήσεις — наследуешь (κληρονομέω). μερίς — часть, доля. ἐγὼ μερίς σου — «Я часть твоя» (слав. так же)."
  21: "ἐπιδέκατον — десятина («десятая часть»; слав. «десятина»). ἐν κλήρῳ — в удел (κλῆρος — жребий, удел). ἀντὶ τῶν λειτουργιῶν — взамен служб."
  22: "ἁμαρτίαν θανατηφόρον — «грех смертоносный» (θανατηφόρος — смертельный)."
  23: "λήμψονται τὰ ἁμαρτήματα — понесут вину (λαμβάνω). εἰς τὰς γενεὰς αὐτῶν — в роды их. οὐ κληρονομήσουσιν κληρονομίαν — не наследуют наследия (внутренний объект)."
  24: "ἀφορώσιν κυρίῳ ἀφαίρεμα — отделят Господу в возношение (ἀφορίζω). ἐν κλήρῳ — в удел. Вложенная речь — 『…』."
  25: "Обычная формула введения речи: λέγων отдельно не передаётся."
  26: "ἐὰν λάβητε — если возьмёте. ἀφελεῖτε — отделите (ἀφαιρέω). ἐπιδέκατον ἀπὸ τοῦ ἐπιδεκάτου — десятина от десятины."
  27: "λογισθήσεται — вменится (λογίζομαι). ἅλων — гумно (脱穀場). ληνός — точило, давильня (ぶどう搾り場)."
  28: "οὕτως — так же. δώσετε … Ααρων τῷ ἱερεῖ — дадите Аарону священнику."
  29: "ἀπὸ πάντων τῶν δομάτων — из всех даров. ἢ ἀπὸ πασῶν τῶν ἀπαρχῶν — «или из всех начатков»: ἤ здесь в пояснительном значении («то есть»); в греческом второй член без глагола, в переводе глагол добавлен. τὸ ἡγιασμένον ἀπ᾿ αὐτοῦ — освящённое из него."
  30: "ὅταν ἀφαιρῆτε τὴν ἀπαρχήν — когда отделите начаток. γένημα — произведение, урожай (γένημα ἀπὸ ἅλω — «жито от гумна»)."
  31: "μισθός — плата, награда. ἀντὶ τῶν λειτουργιῶν ὑμῶν — за службы ваши."
  32: "οὐ λήμψεσθε δι᾿ αὐτὸ ἁμαρτίαν — не понесёте за это греха. βεβηλόω — осквернять (βέβηλος — нечестивый, профанный). ἵνα μὴ ἀποθάνητε — чтобы не умереть."
