# jp-box, Премудрость Соломона, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы есть только в 1:8, и чтение там иное (фрагмент не
# совпадает с греческим) — не опора; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: призыв любить правду и искать Господа (1), условие обретения (2),
# лукавые помыслы отлучают от Бога (3), премудрость не входит в злую душу (4),
# дух наставления бежит коварства (5), человеколюбивый дух премудрости и всеведение
# Божие (6–7), неотвратимость суда (8–10), предостережение от ропота и клеветы (11),
# не искать смерти (12–14), бессмертие правды и стяжание смерти неправдой (15),
# нечестивые призывают смерть и заключают с ней союз (16).
# Прямой речи нет: всё — авторский текст; 1:1 и 1:11 — учительное обращение.
# Красного и синего нет.
# Нумерация по gr: 16 стихов; деление совпадает с csl-ru и ru, сдвигов нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавление в 1:15
# («неправда же смерти снабдение») внесено в основной текст без скобок, как положено
# по паритету; в notes отмечено «нет в LXX».
# Сносок ⟨…⟩ нет: 知恵, 霊, よみ, 魂, 律法 и пр. уже в корпусе.
# Имён в главе нет; κύριος — 主, θεός — 神, ᾅδης — よみ.

tr_code: jp-box
book: prs
chapter: 1
draft: true

verses:
  1: "正[ただ]しさを愛[あい]せよ、地[ち]を裁[さば]く者[もの]たちよ。善[ぜん]をもって主[しゅ]を思[おも]い、心[こころ]の単純[たんじゅん]さのうちに主を求[もと]めよ。"
  2: "主[しゅ]は、主を試[ため]みない者[もの]たちによって見[み]出[いだ]され、主を信[しん]じない者[もの]たちには現[あらわ]れない。"
  3: "曲[まが]った思[おも]いは神[かみ]から引[ひ]き離[はな]すからである。試[ため]される力[ちから]は、愚[おろ]かな者[もの]たちを責[せ]める。"
  4: "悪[あく]を巧[たくみ]みに企[たくら]む魂[たましい]には知恵[ちえ]は入[はい]らず、罪[つみ]の負[お]いを負[お]わされた体[からだ]にも住[す]まない。"
  5: "教[きょう]えの聖[せい]なる霊[れい]は欺[あざむ]きを避[さ]けて逃[に]げ、無[む]分別[ふんべつ]な思[おも]いから離[はな]れ去[さ]る。不正[ふせい]が迫[せま]ると、霊は責[せ]められる。"
  6: "知恵[ちえ]の霊[れい]は人間[にんげん]への愛[あい]に富[と]み、唇[くちびる]をもって冒涜[ぼうとく]する者[もの]を無罪[むざい]とはしない。神[かみ]はその者の内[うち]なるものの証人[しょうにん]、その心[こころ]を真実[しんじつ]に見[み]通[とお]される方[かた]、その舌[した]の聞[き]き手[て]であるからである。"
  7: "主[しゅ]の霊[れい]は世界[せかい]を満[み]たした。すべてを保[たも]つ方[かた]は、声[こえ]を知[し]っておられる。"
  8: "それゆえ、不正[ふせい]なことを語[かた]る者[もの]は、だれも隠[かく]れおおせない。裁[さば]きは、その者を責[せ]めずに過[す]ぎ去[さ]ることはない。"
  9: "不敬虔[ふけいけん]な者[もの]の企[くわだ]てには吟味[ぎんみ]がある。彼[かれ]の語[かた]ることは主[しゅ]のもとへ届[とど]き、彼[かれ]の不法[ふほう]を責[せ]めるための証[しょう]となる。"
  10: "妬[ねた]みの耳[みみ]はすべてを聞[き]き、つぶやきのざわめきも隠[かく]されることがない。"
  11: "だから、無益[むえき]なつぶやきを避[さ]け、中傷[ちゅうしょう]から舌[した]を守[まも]れ。人[ひと]に知[し]れずに語[かた]ることばも空[むな]しく過[す]ぎ去[さ]ることはなく、偽[いつわ]りを語[かた]る口[くち]は魂[たましい]を滅[ほろ]ぼすからである。"
  12: "あなたがたの生[いのち]の迷[まよ]いのうちに死[し]を求[もと]めてはならない。あなたがたの手[て]のわざによって滅[ほろ]びを引[ひ]き寄[よ]せてもならない。"
  13: "神[かみ]は死[し]をお造[つく]りにならず、生[い]きる者[もの]の滅[ほろ]びをも喜[よろこ]ばれない。"
  14: "神[かみ]はすべてを存在[そんざい]するために造[つく]られた。世界[せかい]に生[う]まれ出[で]るものは救[すく]いをもたらし、そのうちに滅[ほろ]びをもたらす薬[くすり]はなく、地[ち]の上[うえ]によみの王国[おうこく]もない。"
  15: "正[ただ]しさは不死[ふし]である。しかし不義[ふぎ]は死[し]を手[て]に入[い]れる。"
  16: "不敬虔[ふけいけん]な者[もの]たちは手[て]とことばで死[し]を呼[よ]び寄[よ]せ、これを友[とも]と見[み]なして衰[おとろ]え果[は]て、これと契約[けいやく]を結[むす]んだ。彼らは死[し]の分[ぶん]に属[ぞく]するにふさわしい者[もの]だからである。"

notes:
  1: "Ἀγαπήσατε δικαιοσύνην — 正しさを愛せよ: импер. аор. от ἀγαπάω, призыв к судьям, ср. Пс 2:10–12. οἱ κρίνοντες τὴν γῆν — 地を裁く者たちよ: звательный оборот, «судящие землю». φρονήσατε περὶ τοῦ κυρίου ἐν ἀγαθότητι — 善をもって主を思い: φρονέω περί — «помышлять о, держать в уме» (слав. «мудрствуйте о Господе в благостыни»). καὶ ἐν ἁπλότητι καρδίας ζητήσατε αὐτόν — 心の単純さのうちに主を求めよ: ἁπλότης — «простота, недвоякость» (слав. «в простоте сердца»); ζητέω — «искать»."
  2: "εὑρίσκεται τοῖς μὴ πειράζουσιν αὐτόν — 主を試みない者たちによって見出され: εὑρίσκομαι — «быть находимым», датив деятеля; πειράζω — «испытывать, искушать». ἐμφανίζεται δὲ τοῖς μὴ ἀπιστοῦσιν αὐτῷ — 主を信じない者たちには現れない: ἐμφανίζω — «являть, показывать себя»; ἀπιστέω с дат. — «не верить кому». Слав. «обретается не искушающым его, является же не неверующым ему» — та же конструкция; подлежащее 主 повторено, чтобы антитеза не сгладилась."
  3: "σκολιοὶ λογισμοὶ χωρίζουσιν ἀπὸ θεοῦ — 曲った思いは神から引き離す: σκολιός — «кривой, лукавый» (слав. «строптивая»); χωρίζω — «отделять». δοκιμαζομένη τε ἡ δύναμις ἐλέγχει τοὺς ἄφρονας — 試される力は愚かな者たちを責める: δοκιμάζω — «испытывать, проверять»; ἐλέγχω — «обличать, изобличать»; ἄφρων — «безумный». τε связывает обе клаузы; связь сохранена точкой и вторым предложением, а не сглажена."
  4: "εἰς κακότεχνον ψυχήν — 悪を巧みに企む魂に: κακότεχνος — «искусный в зле» (слав. «злохудожну»). οὐκ εἰσελεύσεται σοφία — 知恵は入らず: будущее как категорическое отрицание. ἐν σώματι κατάχρεῳ ἁμαρτίας — 罪の負いを負わされた体にも: κατάχρεως — «обременённый долгом, задолжавший» (слав. «повиннем греху»); род. ἁμαρτίας — «должник греха». Отрицание οὐδέ связывает оба члена."
  5: "ἅγιον πνεῦμα παιδείας — 教えの聖なる霊: παιδεία — «наставление, воспитание» (слав. «наказания»), не кара. φεύξεται δόλον — 欺きを避けて逃げ: φεύγω с вин. — «бежать от»; δόλος — «коварство, обман». ἀπαναστήσεται ἀπὸ λογισμῶν ἀσυνέτων — 無分別な思いから離れ去る: ἀπανίστημι — «отступать, удаляться»; ἀσύνετος — «непонимающий». ἐλεγχθήσεται ἐπελθούσης ἀδικίας — 不正が迫ると霊は責められる: ἐπέρχομαι — «наступать, приходить на»; ἐλεγχθήσεται — пассив от ἐλέγχω (слав. «обличится от находящия неправды»)."
  6: "φιλάνθρωπον πνεῦμα σοφία — 知恵の霊は人間への愛に富む: φιλάνθρωπος — «человеколюбивый»; по смыслу «премудрость есть человеколюбивый дух» (слав. «человеколюбив бо дух премудрости»). οὐκ ἀθῳώσει βλάσφημον ἀπὸ χειλέων αὐτοῦ — 唇をもって冒涜する者を無罪とはしない: ἀθῳόω — «признавать невиновным, оправдывать»; ἀπό — «от», т. е. по устам его. τῶν νεφρῶν αὐτοῦ μάρτυς ὁ θεός — その者の内なるものの証人: νεφροί — «почки», в LXX — «внутреннее, совесть» (слав. «внутренних»). ἐπίσκοπος ἀληθής — 真実に見通される方: ἐπίσκοπος — «блюститель, надзиратель»; ἀκουστής — «слушатель»."
  7: "πνεῦμα κυρίου πεπλήρωκεν τὴν οἰκουμένην — 主の霊は世界を満たした: οἰκουμένη — «обитаемая земля, вселенная»; перфект πεπλήρωκεν — состояние наполненности. τὸ συνέχον τὰ πάντα — すべてを保つ方: субстантивированное причастие от συνέχω — «содержать, скреплять» (слав. «содержай вся»); средний род, в переводе — 方. γνῶσιν ἔχει φωνῆς — 声を知っている: род. объекта, «знание голоса», т. е. всякого звука и слова (слав. «разум имать гласа»)."
  8: "φθεγγόμενος ἄδικα — 不正なことを語る者: φθέγγομαι — «издавать голос, говорить»; ἄδικα — наречие «неправедно». οὐδεὶς μὴ λάθῃ — だれも隠れおおせない: усиленное οὐ μή с аор. конъюнктивом, «никак не утаится» (слав. «никтоже утаится»). οὐδὲ μὴ παροδεύσῃ αὐτὸν ἐλέγχουσα ἡ δίκη — 裁きはその者を責めずに過ぎ去ることはない: παροδεύω — «проходить мимо»; δίκη — «правда, суд, возмездие» (слав. «суд»)."
  9: "ἐν διαβουλίοις ἀσεβοῦς ἐξέτασις ἔσται — 不敬虔な者の企てには吟味がある: διαβούλια — «замыслы, совещания» (слав. «советех»); ἐξέτασις — «исследование, дознание». λόγων δὲ αὐτοῦ ἀκοὴ πρὸς κύριον ἥξει — 彼の語ることが主のもとへ届き: ἀκοή — «слух, слушание», буквально «слух слов его дойдёт до Господа». εἰς ἔλεγχον ἀνομημάτων αὐτοῦ — 彼の不法を責めるための証となる: ἀνόμημα — «беззаконие» (слав. «беззаконий его»)."
  10: "οὖς ζηλώσεως — 妬みの耳: ζῆλος — «ревность, жгучая забота» (о Боге; ср. Исх 20:5, 妬む神), слав. «ухо рвения». ἀκροᾶται τὰ πάντα — すべてを聞き: ἀκροάομαι — «слушать, внимать». θροῦς γογγυσμῶν — つぶやきのざわめき: θροῦς — «шум, ропот»; γογγυσμός — «ропот» (слав. «молва роптаний»). οὐκ ἀποκρύπτεται — 隠されることがない: пассив, «не укрывается»."
  11: "Φυλάξασθε τοίνυν — だから…避けよ: φυλάσσω в среднем залоге — «беречься, остерегаться»; τοίνυν — «итак, поэтому». γογγυσμὸν ἀνωφελῆ — 無益なつぶやき: ἀνωφελής — «бесполезный» (слав. «неполезна»). ἀπὸ καταλαλιᾶς φείσασθε γλώσσης — 中傷から舌を守れ: καταλαλιά — «злоречие, клевета»; φείδομαι — «щадить, удерживать». φθέγμα λαθραῖον κενὸν οὐ πορεύσεται — 人に知れずに語ることばも空しく過ぎ去ることはない: φθέγμα — «изречение, звук»; λαθραῖος — «тайный»; κενόν — «пустым», т. е. без последствий (слав. «тще не прейдет»). στόμα καταψευδόμενον ἀναιρεῖ ψυχήν — 偽りを語る口は魂を滅ぼす: καταψεύδομαι — «лгать на, лжесвидетельствовать»; ἀναιρέω — «уничтожать»."
  12: "μὴ ζηλοῦτε θάνατον — 死を求めてはならない: ζηλόω — «ревновать, домогаться, желать» (слав. «не вожделейте»). ἐν πλάνῃ ζωῆς ὑμῶν — 生の迷いのうちに: πλάνη — «заблуждение, блуждание». μηδὲ ἐπισπᾶσθε ὄλεθρον — 滅びを引き寄せてもならない: ἐπισπάομαι — «привлекать к себе»; ὄλεθρος — «погибель». ἐν ἔργοις χειρῶν ὑμῶν — 手のわざによって."
  13: "ὁ θεὸς θάνατον οὐκ ἐποίησεν — 神は死をお造りにならなかった: ποιέω — «делать, творить»; в книге смерть — не творение Бога, а плод греха. οὐδὲ τέρπεται ἐπ᾽ ἀπωλείᾳ ζώντων — 生きる者の滅びを喜ばれない: τέρπομαι ἐπί — «радоваться чему»; ἀπώλεια — «погибель» (слав. «о погибели живых»)."
  14: "ἔκτισεν γὰρ εἰς τὸ εἶναι τὰ πάντα — 神はすべてを存在するために造られた: κτίζω — «создавать»; εἰς τὸ εἶναι — «для бытия» (слав. «во еже быти всем»). σωτήριοι αἱ γενέσεις τοῦ κόσμου — 世界に生まれ出るものは救いをもたらす: γένεσις — «рождение, происхождение»; прилагательное σωτήριος — «спасительный». φάρμακον ὀλέθρου — 滅びをもたらす薬: φάρμακον — и «лекарство», и «яд»; слав. «врачевания губительнаго», Син. «пагубного яда»; в тексте 薬, двусмысленность сохранена. ᾅδου βασίλειον ἐπὶ γῆς — 地の上によみの王国もない: βασίλειον — «царский дворец, царство»; ᾅδης — よみ, как в Псалтири."
  15: "δικαιοσύνη ἀθάνατός ἐστιν — 正しさは不死である: ἀθάνατος — «бессмертный»; ἀθανασία — 不死 (ср. 1 Кор 15:53). Слав. добавляет вторую половину «(неправда же смерти снабдение:)» — её нет в gr-lxx-byz (ср. Вульгату: iniustitia autem mortis est acquisitio); по паритету внесена в основной текст без 〔…〕, отмечено «нет в LXX». 手に入れる передаёт снабдение — «стяжание, приобретение»."
  16: "Ἀσεβεῖς δέ — 不敬虔な者たちは: противопоставление правде ст. 15. ταῖς χερσὶν καὶ τοῖς λόγοις προσεκαλέσαντο αὐτόν — 手とことばで死を呼び寄せ: προσκαλέομαι — «призывать к себе»; αὐτόν — муж. род, относится к θάνατος («смерть»); слав. «призваша ю» — жен. род по слав. «смерть». φίλον ἡγησάμενοι αὐτὸν ἐτάκησαν — これを友と見なして衰え果て: ἐτάκησαν — «растаяли, истаяли» (τήκω). συνθήκην ἔθεντο πρὸς αὐτόν — これと契約を結んだ: συνθήκη — «союз, договор» (ср. Ис 28:15). ἄξιοι τῆς ἐκείνου μερίδος εἶναι — 死の分に属するにふさわしい: μερίς — «часть, удел» (слав. «части»)."
