verses:
  1: "「サマリアは滅[ほろ]ぼされる。自分[じぶん]の神[かみ]に逆[さから]ったからである。彼らは剣[つるぎ]で倒[たお]れ、その乳飲[ちの]み子[ご]は打[う]ち砕[くだ]かれ、妊[にん]婦[ぷ]は裂[さ]かれる」。"
  2: "イスラエルよ、あなたの神[かみ]である主[しゅ]に帰[かえ]れ。あなたは自分[じぶん]の不法[ふほう]によって力[ちから]を失[うしな]ったからである。"
  3: "言葉[ことば]を携[たずさ]えて主[しゅ]に帰[かえ]り、主[しゅ]に言[い]え。『わたしたちが不法[ふほう]を受[う]けず、良[よ]いものを受[う]けるようにしてください。わたしたちは唇[くちびる]の実[み]をささげます。"
  4: "アッシリアはわたしたちを救[すく]いません。わたしたちは馬[うま]に乗[の]りません。もはや自分[じぶん]の手[て]の業[わざ]に『わたしたちの神[かみ]』とは言[い]いません。あなたによって、みなしごはあわれみを受[う]けるのですから』。"
  5: "「わたしは彼らの住[す]まいを癒[いや]し、彼らを惜[お]しみなく愛[あい]する。わたしの怒[いか]りは彼らから離[はな]れたからである。"
  6: "わたしはイスラエルにとって露[つゆ]となる。彼はゆりのように花[はな]咲[さ]き、その根[ね]をレバノンのように張[は]る。"
  7: "その枝[えだ]は伸[の]び、実[み]多[おお]いオリーブの木[き]のようになり、その香[かおり]はレバノンのようになる。"
  8: "彼らは帰[かえ]って来[き]て、その陰[かげ]の下[した]に住[す]む。彼らは生[い]き、穀物[こくもつ]に酔[よ]う。その記念[きねん]はぶどうの木[き]のように花[はな]咲[さ]き、レバノンのぶどう酒[しゅ]のようになる。"
  9: "エフライムよ、もはや偶像[ぐうぞう]と何[なに]の関[かか]わりがあろうか。わたしは彼を低[ひく]くし、また彼を強[つよ]くする。わたしは茂[しげ]ったビャクシンのようであり、あなたの実[み]はわたしから見[み]いだされる」。"
  10: "だれが知恵[ちえ]ある者[もの]で、これらのことを悟[さと]るのか。だれが悟[さと]りのある者[もの]で、これらを知[し]るのか。主[しゅ]の道[みち]はまっすぐであり、正[ただ]しい者[もの]たちはその中[なか]を歩[あゆ]み、不敬[ふけい]な者[もの]たちはその中[なか]で力[ちから]を失[うしな]う。"

notes:
  1: "ἀφανισθήσεται Σαμάρεια — «опустошена будет Самария» (ἀφανίζω — истреблять, 滅ぼす); ὅτι ἀντέστη πρὸς τὸν θεὸν αὐτῆς — «ибо восстала против Бога своего» (ἀνθίστημι); ἐν ῥομφαίᾳ πεσοῦνται αὐτοί — «от меча падут они»; τὰ ὑποτίτθια αὐτῶν ἐδαφισθήσονται — «грудные дети их разбиты будут» (ὑποτίτθιος — грудной младенец, 乳飲み子; ἐδαφίζω — повергать на землю); αἱ ἐν γαστρὶ ἔχουσαι αὐτῶν διαρραγήσονται — «беременные их расторгнутся» (διαρρήγνυμι; слав. «разсядутся»)."
  2: "Ἐπιστράφητι, Ισραηλ, πρὸς κύριον τὸν θεόν σου — «обратись, Израиль, к Господу Богу твоему» (ἐπιστρέφω); ἠσθέννησας ἐν ταῖς ἀδικίαις σου — «ибо ты изнемог в беззакониях твоих» (ἀσθενέω — терять силу)."
  3: "λάβετε μεθ᾿ ἑαυτῶν λόγους — «возьмите с собою слова»; ἐπιστράφητε πρὸς κύριον τὸν θεὸν ὑμῶν — «обратитесь к Господу Богу вашему»; εἴπατε αὐτῷ ὅπως μὴ λάβητε ἀδικίαν καὶ λάβητε ἀγαθά — «скажите Ему: чтобы не принять вам неправды, но принять благое» (слав. «яко да не приимете неправды, но да приимете благая»); ἀνταποδώσομεν καρπὸν χειλέων ἡμῶν — «воздадим плод уст наших» (καρπός — плод; χεῖλος — уста, 唇; ср. Евр 13:15). 2-е лицо мн. ч. «λάβητε» сохранено; в ru/МТ «отними всякое беззаконие и прими во благо» — иное чтение, в текст не внесено."
  4: "Ασσουρ οὐ μὴ σώσῃ ἡμᾶς — «Ассур не спасёт нас»; ἐφ᾿ ἵππον οὐκ ἀναβησόμεθα — «на коня не сядем»; οὐκέτι μὴ εἴπωμεν Θεοὶ ἡμῶν, τοῖς ἔργοις τῶν χειρῶν ἡμῶν — «не скажем более: боги наши — дела рук наших»; ὁ ἐν σοὶ ἐλεήσει ὀρφανόν — «Сущий в Тебе помилует сироту» (ὀρφανός — сирота, みなしご; слав. «яко в тебе помилуется сирота»). Здесь слова народа закрываются."
  5: "ἰάσομαι τὰς κατοικίας αὐτῶν — «уврачую жилища их» (κατοικία — жилище; слав. «селения их»; в ru «отпадение их» — иное чтение); ἀγαπήσω αὐτοὺς ὁμολόγως — «возлюблю их явно (охотно)» (ὁμολόγως — открыто, единодушно; слав. «возлюблю я явленно»); ὅτι ἀπέστρεψεν ἡ ὀργή μου ἀπ᾿ αὐτῶν — «ибо отвратился гнев Мой от них»."
  6: "ἔσομαι ὡς δρόσος τῷ Ισραηλ — «буду как роса Израилю» (δρόσος — роса, 露); ἀνθήσει ὡς κρίνον — «расцветёт как лилия» (κρίνον — лилия, ゆり; ἀνθέω — цвести); βαλεῖ τὰς ῥίζας αὐτοῦ ὡς ὁ Λίβανος — «пустит корни свои как Ливан» (ῥίζα — корень; βάλλω — бросать, пускать)."
  7: "πορεύσονται οἱ κλάδοι αὐτοῦ — «пойдут (распространятся) ветви его» (κλάδος — ветвь); ἔσται ὡς ἐλαία κατάκαρπος — «будет как маслина плодоносная» (ἐλαία — маслина; κατάκαρπος — обильный плодами; слав. «якоже маслина плодовита»); ἡ ὀσφρασία αὐτοῦ ὡς Λιβάνου — «благоухание его как Ливана» (ὀσφρασία — запах, 香り)."
  8: "ἐπιστρέψουσιν καὶ καθιοῦνται ὑπὸ τὴν σκέπην αὐτοῦ — «возвратятся и сядут под сень его» (σκέπη — покров, сень; κάθημαι — сидеть); ζήσονται καὶ μεθυσθήσονται σίτῳ — «оживут и упьются хлебом» (μεθύσκω — опьянять); ἐξανθήσει ὡς ἄμπελος τὸ μνημόσυνον αὐτοῦ — «расцветёт как виноград память его» (ἐξανθέω); ὡς οἶνος Λιβάνου — «как вино Ливана»."
  9: "τῷ Εφραιμ, τί αὐτῷ ἔτι καὶ εἰδώλοις — «Ефрему что ещё и до идолов?» (т.е. «что мне до идолов»); ἐγὼ ἐταπείνωσα αὐτόν — «Я смирил его» (ταπεινόω); ἐγὼ κατισχύσω αὐτόν — «Я и укреплю его» (κατισχύω); ὡς ἄρκευθος πυκάζουσα — «как можжевельник густой» (ἄρκευθος — можжевельник, ビャクシン; πυκάζω — делать густым; слав. «аки смерчие учащеное»; в ru «кипарис»); ἐξ ἐμοῦ ὁ καρπός σου εὕρηται — «от Меня плод твой обретается» (εὑρίσκω)."
  10: "τίς σοφὸς καὶ συνήσει ταῦτα — «кто мудр и уразумеет это?» (σοφός, συνίημι); ἢ συνετὸς καὶ ἐπιγνώσεται αὐτά — «или разумен и познает их?» (συνετός); εὐθεῖαι αἱ ὁδοὶ τοῦ κυρίου — «правы пути Господни» (εὐθύς — прямой, まっすぐ); δίκαιοι πορεύσονται ἐν αὐταῖς — «праведники ходят по ним»; οἱ ἀσεβεῖς ἀσθενήσουσιν ἐν αὐταῖς — «нечестивые изнемогут в них» (ἀσθενέω)."
