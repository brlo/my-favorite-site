# jp-box, Осия, глава 14. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной (решение автора): главы 1–2 и 11–12
# переразбиты относительно гр. модуля (слав. 1:10–11 = прежние 2:1–2;
# слав. 11:12 = прежний 12:1). Текст — с Септуагинты, слав. контроль.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (нумерация по гр.) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по gr-lxx-byz (= jp-ni); в этой главе совпадает со славяно-синодальной
# (в csl 14:5 соединены конец нашего 14:4 и наш 14:5; сверка в notes).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1 опустошение Самарии, меч, грудные дети, беременные; 2 «обратись,
# Израиль»; 3–4 слова возвращения: «возьмите с собою слова», «Ассур не спасёт нас»,
# «у Тебя милость для сирот»; 5–8 ответ Господа: исцеление, «буду как роса», лилия,
# Ливан, маслина, «сядут под сенью Его»; 9 «что мне ещё до идолов?», можжевельник,
# «от Меня плод твой»; 10 заключение: кто мудр, пути Господни правы.
# Голоса: 1 — слово Господа в 「…」 (закрывается в 1); 2 — призыв пророка вне кавычек;
# 3–4 — призыв + слова народа в 『…』 (закрываются в 4); 5–9 — слово Господа в 「…」;
# 10 — заключение премудрости вне кавычек.
# 14:5: LXX «τὰς κατοικίας αὐτῶν» — «жилища их» (слав. «селения их»; в ru «отпадение»).
# 14:9: «ἄρκευθος» — можжевельник (слав. «смерчие»; в ru «кипарис»).
#
