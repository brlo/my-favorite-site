verses:
  0: "指揮者[しきしゃ]に。弦[げん]楽[がく]器[き]に合わせて。ダビデの歌[うた]。"
  1: "わたしが呼[よ]び求[もと]めるとき、わたしの義[ぎ]の神[かみ]はわたしに答[こた]えてくださった。苦[くる]しみのうちで、あなたはわたしを広[ひろ]くしてくださった。わたしをあわれみ、わたしの祈[いの]りを聞[き]いてください。"
  2: "人[ひと]の子[こ]らよ、いつまで心[こころ]は重[おも]いのか。なぜ、むなしいものを愛[あい]し、偽[いつわ]りを求[もと]めるのか。"
  3: "知[し]るがよい。主[しゅ]はご自分の聖[せい]なる者[もの]を驚[おどろ]くべきものとして示[しめ]された。主[しゅ]は、わたしが呼[よ]び求[もと]めるとき、わたしの声[こえ]を聞[き]いてくださる。"
  4: "怒[いか]っても、罪[つみ]を犯[おか]してはならない。床[とこ]の上[うえ]で、心[こころ]のうちに語[かた]り、心[こころ]を砕[くだ]かれて静[しず]まれ。"
  5: "義[ぎ]のいけにえをささげ、主[しゅ]に寄[よ]り頼[たの]め。"
  6: "多[おお]くの者[もの]が言[い]う。「だれがわたしたちに善[ぜん]いものを見[み]せてくれるのか」と。主[しゅ]よ、わたしたちの上[うえ]に、あなたの顔[かお]の光[ひかり]がしるしとして置[お]かれている。"
  7: "あなたがわたしの心[こころ]に満[み]たしてくださる喜[よろこ]びは、彼[かれ]らに穀物[こくもつ]と酒[さけ]と油[あぶら]が豊[ゆた]かになったときよりも大[おお]きい。"
  8: "わたしは平安[へいわ]のうちに横[よこ]たわり、そのまま眠[ねむ]ろう。主[しゅ]よ、あなただけが、わたしを希望[きぼう]のうちに安[やす]らかに住[す]まわせてくださるからである。"

notes:
  0: "Εἰς τὸ τέλος, ἐν ψαλμοῖς· ᾠδὴ τῷ Δαυιδ — 指揮者に。弦楽器に合わせて。ダビデの歌 (εἰς τὸ τέλος — «в конец», т. е. для исполнения в собрании; в церковнослав. «В конец»; 指揮者 — современная передача, вместо 伶長 у jp-joc). ἐν ψαλμοῖς — «на псалтири», т. е. под струнные. Надписание — стих 0, скобками не маркируется."
  1: "Ἐν τῷ ἐπικαλεῖσθαί με εἰσήκουσέν μου ὁ θεὸς τῆς δικαιοσύνης μου — わたしが呼び求めるとき、わたしの義の神はわたしに答えてくださった (ἐπικαλέομαι — «призывать»; ὁ θεὸς τῆς δικαιοσύνης μου — «Бог правды моей», род. качества). ἐν θλίψει ἐπλάτυνάς μοι — 苦しみのうちで、あなたはわたしを広くしてくださった (πλατύνω — «расширять, давать простор»). οἰκτίρησόν με — あわれみ; εἰσάκουσον τῆς προσευχῆς μου — 祈りを聞いてください (ἐπακούω + род.)."
  2: "Υἱοὶ ἀνθρώπων — 人の子ら (обращение). ἕως πότε βαρυκάρδιοι — いつまで心は重いのか (βαρυκάρδιος — «тяжелосердый», т. е. невосприимчивый). ἵνα τί ἀγαπᾶτε ματαιότητα καὶ ζητεῖτε ψεῦδος — なぜ、むなしいものを愛し、偽りを求めるのか (ματαιότης — «суета, пустое»; ψεῦδος — «ложь»). διάψαλμα в конце стиха не передаётся."
  3: "καὶ γνῶτε — 知るがよい (императив γινώσκω). ὅτι ἐθαυμάστωσεν κύριος τὸν ὅσιον αὐτοῦ — 主はご自分の聖なる者を驚くべきものとして示された (θαυμαστόω — «делать дивным, прославлять»; ὅσιος — «преподобный, святой»; ср. Синодальный «дивно прославил»). κύριος εἰσακούσεταί μου ἐν τῷ κεκραγέναι με πρὸς αὐτόν — 主は、わたしが呼び求めるとき、わたしの声を聞いてくださる (κράζω — «взывать»)."
  4: "ὀργίζεσθε καὶ μὴ ἁμαρτάνετε — 怒っても、罪を犯してはならない (императивы; в церковном чтении понято как «гневайтесь, но не грешите»). λέγετε ἐν ταῖς καρδίαις ὑμῶν — 心のうちに語り. ἐπὶ ταῖς κοίταις ὑμῶν κατανύγητε — 床の上で…心を砕かれて静まれ (κατανύσσομαι — «быть уязвлённым, сокрушённым»; jp-joc «己を鎮めよ»). διάψαλμα не передаётся."
  5: "θύσατε θυσίαν δικαιοσύνης — 義のいけにえをささげ (θυσία δικαιοσύνης — жертва правды, т. е. жертва с правдой в сердце). ἐλπίσατε ἐπὶ κύριον — 主に寄り頼め (ἐλπίζω ἐπί τινα — «полагать надежду на»)."
  6: "πολλοὶ λέγουσιν Τίς δείξει ἡμῖν τὰ ἀγαθά — 多くの者が言う、「だれがわたしたちに善いものを見せてくれるのか」 (δεικνύω — «показывать»). Слова многих — 「」. ἐσημειώθη ἐφ᾽ ἡμᾶς τὸ φῶς τοῦ προσώπου σου — わたしたちの上に、あなたの顔の光がしるしとして置かれている (σημειόω — «полагать знамение»; образ благословения из Числ 6:25)."
  7: "ἔδωκας εὐφροσύνην εἰς τὴν καρδίαν μου — あなたがわたしの心に満たしてくださる喜び (εὐφροσύνη — «веселие»). ἀπὸ καιροῦ σίτου καὶ οἴνου καὶ ἐλαίου αὐτῶν ἐπληθύνθησαν — 彼らに穀物と酒と油が豊かになったときよりも大きい (букв. «от времени пшеницы и вина и елея их умножились»; ср. jp-joc «勝れり», Синодальный «с того времени, как у них умножились хлеб и вино»)."
  8: "ἐν εἰρήνῃ ἐπὶ τὸ αὐτὸ κοιμηθήσομαι καὶ ὑπνώσω — わたしは平安のうちに横たわり、そのまま眠ろう (ἐπὶ τὸ αὐτό — «вместе, разом»; передано そのまま, чтобы не добавлять «вместе с кем»). ὅτι σύ, κύριε, κατὰ μόνας ἐπ᾽ ἐλπίδι κατῴκισάς με — あなただけが、わたしを希望のうちに安らかに住まわせてくださる (κατὰ μόνας — «один, отдельно»; κατοικίζω — «поселять»)."
