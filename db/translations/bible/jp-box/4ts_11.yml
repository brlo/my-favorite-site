chapter: 11
draft: true

verses:
  1: "アハズヤの母[はは]アタリヤは、自分[じぶん]の息子[むすこ]たちが死[し]んだのを見[み]て、王[おう]の一族[いちぞく]をすべて滅[ほろ]ぼした。"
  2: "しかし、ヨラム王[おう]の娘[むすめ]でアハズヤの妹[いもうと]であるヨサベアは、アハズヤの子[こ]ヨアシュを連[つ]れて行[い]き、殺[ころ]されようとしていた王[おう]の息子[むすこ]たちの中[なか]から、彼[かれ]とその乳母[うば]を盗[ぬす]み出[だ]して寝台[しんだい]の部屋[へや]に隠[かく]し、アタリヤの顔[かお]から隠[かく]したので、彼[かれ]は殺[ころ]されなかった。"
  3: "彼[かれ]は六年間[ろくねんかん]、彼女[かのじょ]とともに主[しゅ]の神殿[しんでん]に隠[かく]れていた。その間[あいだ]、アタリヤがその国[くに]を治[おさ]めていた。"
  4: "第七年[だいななねん]に、祭司[さいし]ヨヤダは人[ひと]を遣[つか]わして百人隊長[ひゃくにんたいちょう]たち、すなわちホルリとラシムを呼[よ]び、彼[かれ]らを主[しゅ]の神殿[しんでん]、自分[じぶん]のもとへ連[つ]れて来[こ]させ、主[しゅ]の契約[けいやく]を彼[かれ]らと結[むす]び、主[しゅ]の前[まえ]で彼[かれ]らに誓[ちか]わせ、王[おう]の子[こ]を彼[かれ]らに見[み]せた。"
  5: "彼[かれ]らに命[めい]じて言[い]った。「あなたがたが行[おこな]うべきことはこうだ。安息日[あんそくび]に務[つと]めに入[はい]る者[もの]の三分[さんぶん]の一[いち]は王[おう]の家[いえ]の門[もん]で見張[みは]りをせよ。"
  6: "また三分[さんぶん]の一[いち]は『道[みち]の門[もん]』に、三分[さんぶん]の一[いち]は近衛[このえ]の者[もの]たちの後[うし]ろの門[もん]にあって、家[いえ]の見張[みは]りをせよ。"
  7: "あなたがたのうちの二組[ふたくみ]、すなわち安息日[あんそくび]に務[つと]めを終[お]えて出[で]る者[もの]すべては、王[おう]のために主[しゅ]の神殿[しんでん]の見張[みは]りをする。"
  8: "あなたがたは王[おう]の周[まわ]りを取[と]り囲[かこ]み、それぞれ武器[ぶき]を手[て]に持[も]て。列[れつ]の内[うち]に入[はい]る者[もの]は殺[ころ]される。あなたがたは王[おう]が出入[でい]りするとき、いつも王[おう]とともにいなさい。」"
  9: "百人隊長[ひゃくにんたいちょう]たちは、思慮[しりょ]深[ぶか]いヨヤダが命[めい]じたことをすべて行[おこな]った。彼[かれ]らはそれぞれ、安息日[あんそくび]に務[つと]めに入[はい]る者[もの]たちを、務[つと]めを終[お]えて出[で]る者[もの]たちとともに連[つ]れて、祭司[さいし]ヨヤダのもとへ来[き]た。"
  10: "祭司[さいし]は百人隊長[ひゃくにんたいちょう]たちに、主[しゅ]の神殿[しんでん]にあったダビデ王[おう]の槍[やり]と盾[たて]を渡[わた]した。"
  11: "近衛[このえ]の者[もの]たちは、それぞれ武器[ぶき]を手[て]に持[も]って、神殿[しんでん]の右側[みぎがわ]から神殿[しんでん]の左側[ひだりがわ]まで、祭壇[さいだん]と神殿[しんでん]のところで、王[おう]の周[まわ]りに立[た]った。"
  12: "彼[かれ]は王[おう]の子[こ]を連[つ]れ出[だ]し、彼[かれ]に王冠[おうかん]と証[あかし]とを授[さず]け、彼[かれ]を王[おう]として立[た]て、油[あぶら]を注[そそ]いだ。人々[ひとびと]は手[て]を打[う]ち鳴[な]らして言[い]った。「王[おう]よ、生[い]きよ。」"
  13: "アタリヤは民[たみ]が走[はし]る声[こえ]を聞[き]いて、民[たみ]のところへ主[しゅ]の神殿[しんでん]に入[はい]って来[き]た。"
  14: "見[み]ると、王[おう]は柱[はしら]のところ、定[さだ]められた場所[ばしょ]に立[た]っていた。歌[うた]い手[て]たちとラッパが王[おう]のそばにあり、国[くに]の民[たみ]はすべて喜[よろこ]んでラッパを吹[ふ]いていた。アタリヤは自分[じぶん]の衣[ころも]を裂[さ]いて叫[さけ]んだ。「謀反[むほん]だ、謀反[むほん]だ。」"
  15: "祭司[さいし]ヨヤダは、軍[ぐん]の監督[かんとく]である百人隊長[ひゃくにんたいちょう]たちに命[めい]じて言[い]った。「彼女[かのじょ]を列[れつ]の外[そと]へ連[つ]れ出[だ]せ。彼女[かのじょ]の後[あと]について来[く]る者[もの]は剣[つるぎ]で殺[ころ]せ。」祭司[さいし]は『主[しゅ]の神殿[しんでん]で彼女[かのじょ]を殺[ころ]してはならない』と言[い]ったからである。"
  16: "彼[かれ]らは彼女[かのじょ]に手[て]をかけて、王[おう]の家[いえ]の馬[うま]の入口[いりぐち]の道[みち]へ連[つ]れて行[い]き、そこで彼女[かのじょ]を殺[ころ]した。"
  17: "ヨヤダは主[しゅ]と王[おう]と民[たみ]との間[あいだ]に契約[けいやく]を結[むす]び、彼[かれ]らが主[しゅ]の民[たみ]となるようにした。また王[おう]と民[たみ]との間[あいだ]にも結[むす]んだ。"
  18: "国[くに]の民[たみ]はすべてバアルの神殿[しんでん]へ行[い]き、神殿[しんでん]を打[う]ち壊[こわ]し、その祭壇[さいだん]と像[ぞう]を残[のこ]らず砕[くだ]き、バアルの祭司[さいし]であるマタンを祭壇[さいだん]の前[まえ]で殺[ころ]した。祭司[さいし]は主[しゅ]の神殿[しんでん]に監督[かんとく]たちを置[お]いた。"
  19: "彼[かれ]は百人隊長[ひゃくにんたいちょう]たち、ホルリとラシム、国[くに]の民[たみ]すべてを連[つ]れて、王[おう]を主[しゅ]の神殿[しんでん]から連[つ]れ下[お]ろし、近衛[このえ]の者[もの]たちの門[もん]の道[みち]から王[おう]の家[いえ]に入[はい]り、彼[かれ]を王[おう]たちの王座[おうざ]に座[すわ]らせた。"
  20: "国[くに]の民[たみ]はすべて喜[よろこ]び、町[まち]は静[しず]かになった。アタリヤは王[おう]の家[いえ]で剣[つるぎ]で殺[ころ]された。"
  21: "ヨアシュは王[おう]となったとき、七歳[ななさい]であった。"

notes:
  1: "Γοθολια — Гофолия (アタリヤ), дочь Ахава и Иезавели, жена Иорама. οἱ υἱοὶ αὐτῆς — мн. ч. «сыновья её» (в слав. ед. ч. «сын ея»). σπέρμα τῆς βασιλείας — «семя царства», царский род."
  2: "Ιωσαβεε — Иосавеф (ヨサベア), дочь царя Иорама, сестра Охозии (в евр. Иехошева). τῶν θανατουμένων — «умерщвляемых» (θανατόω). ταμιεῖον τῶν κλινῶν — «кладовая постелей», спальня (слав. «клеть постельная»). ἀπὸ προσώπου — «от лица»."
  3: "κρυβόμενος — «скрываясь» (κρύπτω). ἓξ ἔτη — шесть лет. βασιλεύουσα ἐπὶ τῆς γῆς — «царствуя над землёй»."
  4: "Ιωδαε — Иодай (ヨヤダ). ἑκατοντάρχους — сотники (百人隊長). τὸν Χορρι καὶ τὸν Ρασιμ — Хорри и Расим (в евр. «Карии и Расии», т. е. отряды карийцев и скороходов; слав. «хорримски и расимски»). διέθετο διαθήκην — «заключил завет» (διατίθημι). ὥρκισεν — «заклял» (ὁρκίζω)."
  5: "τὸ τρίτον ἐξ ὑμῶν — «третья часть из вас». τὸ σάββατον — «в субботу», т. е. в субботнюю смену. φυλάξετε φυλακήν — «будете нести стражу» (внутренний объект). πυλών — ворота, притвор."
  6: "πύλη τῶν ὁδῶν — «ворота дорог» (слав. «двери пути»; в ru «ворота Сур» — по МТ). ὀπίσω τῶν παρατρεχόντων — «позади скороходов» (παρατρέχω). φυλακὴ τοῦ οἴκου — стража дома; в ru добавлено «чтобы не было повреждения» — в гр нет."
  7: "δύο χεῖρες — «две руки», т. е. два отряда (слав. «две части»). ἐκπορευόμενος τὸ σάββατον — «выходящий в субботу», сменяющаяся стража. πρὸς τὸν βασιλέα — «при царе»: царь — предмет охраны."
  8: "κυκλώσατε — «окружите» (κυκλόω). σκεῦος — оружие, доспех (слав. «оружие»). σαδηρωθ — передача евр. שְׂדֵרוֹת («ряды»); слав. «садироф», ru «ряды»; принято 列. ἐγένετο μετὰ τοῦ βασιλέως — «будьте с царём» (по смыслу императив)."
  9: "ὁ συνετός — «разумный» (приложение к Иодаю; слав. «смысленый»). ἀνήρ — «каждый». Входящие и исходящие в субботу — смены стражи."
  10: "σειρομάσται — «копья» (σειρομάστης, длинное копьё; слав. «копия»). τοὺς τρισσοὺς — букв. «тройные [доспехи]», вероятно щиты (слав. «щиты»); принято 盾."
  11: "ὠμία — «плечо», здесь «сторона, бок» здания (слав. «страна»). δεξιά… εὐώνυμος — правая… левая. ἐπὶ τὸν βασιλέα κύκλῳ — «вокруг царя». В слав. в ст. 11 вставлены «и сотвориша сотницы…» и «собра жрец… вся люди земли» — в гр этого нет."
  12: "νεζερ — передача евр. נֶזֶר («венец, посвящение»); слав. «венец». μαρτύριον — «свидетельство», знаки царского достоинства (слав. «свидение»). ἔχρισεν — помазал (χρίω). ἐκρότησαν τῇ χειρί — «ударили рукой», рукоплескали. Ζήτω — «да живёт»."
  13: "τῶν τρεχόντων τοῦ λαοῦ — «бегущих из народа», т. е. бегущей толпы (τρέχω). πρὸς τὸν λαόν — «к народу»."
  14: "ἐπὶ τοῦ στύλου — «на столпе», у колонны (στῦλος); слав. «на столпе». κατὰ τὸ κρίμα — «по уставу, обычаю» (κρίμα — установление). ᾠδοί — певцы. σάλπιγξ — труба. διέρρηξεν τὰ ἱμάτια — разодрала одежды. Σύνδεσμος — «заговор» (слав. «измена»)."
  15: "τοῖς ἐπισκόποις τῆς δυνάμεως — «надзирателям войска» (ἐπίσκοπος; слав. «властелем силы»). ἔσωθεν τῶν σαδηρωθ — «изнутри рядов», вон из оцепления. θανάτῳ θανατωθήσεται — усилительно «смертью умрёт». ῥομφαίᾳ — мечом."
  16: "ἐπέθηκαν αὐτῇ χεῖρας — «возложили на неё руки», т. е. схватили. ὁδὸν εἰσόδου τῶν ἵππων — «дорогой входа коней», конский въезд. ἀπέθανεν — умерла (в слав. «умре»)."
  17: "διέθετο διαθήκην — «заключил завет» (διατίθημι). ἀνὰ μέσον — «между» (повтор). τοῦ εἶναι εἰς λαὸν τῷ κυρίῳ — «чтобы быть народом Господу». Вторая часть — завет царя с народом."
  18: "κατέσπασαν — разрушили (κατασπάω). εἰκόνας — изображения (εἰκών). συνέτριψαν ἀγαθῶς — «сокрушили хорошо», т. е. основательно (слав. «сокрушиша добре»). Ματθαν — Матфан (マタン). ἐπισκόπους — надзирателей, смотрителей (слав. «властели»)."
  19: "κατήγαγον — «свели» (κατάγω). ὁδὸν πύλης τῶν παρατρεχόντων — «дорогой ворот скороходов» (слав. «путем врат предтекущих»). ἐκάθισαν — «посадили» (καθίζω)."
  20: "ἡσύχασεν — «успокоился, затих» (ἡσυχάζω). ἐθανάτωσαν ἐν ῥομφαίᾳ — «умертвили мечом». ἐν οἴκῳ τοῦ βασιλέως — в доме царя. Слав. 11:21 («Сын седми лет иоас…») в гр относится к 12:1 — см. главу 12."
  21: "Υἱὸς ἐτῶν ἑπτά — «сын семи лет», т. е. семи лет от роду. В слав. это 11:21 (в гр — начало гл. 12). ἐν τῷ βασιλεύειν αὐτόν — «когда он воцарился»."
