# jp-box, Послание к Римлянам, глава 7. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 7: закон и смерть для закона (1–6), закон свят, а грех оживает (7–13),
# борьба в человеке — от первого лица (14–25).
# Красного (<j>) и синего (<mo>) нет: прямой речи Христа и Богородицы в главе нет.
# 〔…〕 в главе нет: все стихи в gr-lxx-byz есть, [ἐγώ] в 7:20 стоит в базе.
# 7:14–25 — «わたし» (не «人間», не «人」): речь от первого лица единственного числа,
# как в греческом, у jp-joc и в церковном чтении; обобщение снимает исповедный строг
# и делает стихи описанием природы человека, чего в тексте нет.
# jp-ni не использовался.

tr_code: jp-box
book: rim
chapter: 7
draft: true

verses:
  1: "兄弟[きょうだい]たちよ。あなたがたは知[し]らないのか。わたしは律法[りっぽう]を知[し]る者[もの]に話[はな]している。律法[りっぽう]は、人[ひと]が生[い]きている間[あいだ]だけ、その人[ひと]を支配[しはい]するのである。"
  2: "夫[おっと]のある女[おんな]は、夫[おっと]が生[い]きている間[あいだ]は、律法[りっぽう]によって夫[おっと]に結[むす]びつけられている。しかし、夫[おっと]が死[し]ねば、夫[おっと]に関する律法[りっぽう]から解[と]き放[はな]たれる。"
  3: "したがって、夫[おっと]が生[い]きているうちに他[ほか]の男[おとこ]のもとへ行[ゆ]けば、姦淫[かんいん]の女[おんな]と呼[よ]ばれる。しかし、夫[おっと]が死[し]ねば、その律法[りっぽう]から自由[じゆう]になるので、ほかの男[おとこ]のもとへ行[ゆ]っても、姦淫[かんいん]の女[おんな]ではない。"
  4: "わたしの兄弟[きょうだい]たちよ。あなたがたもまた、キリストの体[からだ]によって律法[りっぽう]に対して死[し]んだのである。それは、死者[ししゃ]の中[なか]から復活[ふっかつ]された別[べつ]の方[かた]に属[ぞく]するためであり、わたしたちが神[かみ]のために実[み]を結[むす]ぶためである。"
  5: "というのは、わたしたちが肉[にく]にあったとき、律法[りっぽう]によって引[ひ]き起[お]こされる罪[つみ]の欲[よく]情[じょう]が、わたしたちの手足[てあし]のうちに働[はたら]いて、死[し]のために実[み]を結[むす]ばせていたからである。"
  6: "しかし今[いま]、わたしたちは、自分[じぶん]を縛[しば]っていたものに対して死[し]んで、律法[りっぽう]から解[と]き放[はな]たれた。それは、文字[もじ]の古[ふる]いあり方ではなく、霊[れい]の新[あたら]しいあり方によって、神[かみ]に仕[つか]えるためである。"
  7: "それでは、何と言[い]おうか。律法[りっぽう]は罪[つみ]なのか。決[けっ]してそうではない。かえって、わたしは律法[りっぽう]によらなければ罪[つみ]を知[し]らなかったであろう。律法[りっぽう]が「欲[ほっ]してはならない」と言[い]わなければ、わたしは欲[よく]というものを知[し]らなかったであろう。"
  8: "しかし、罪[つみ]は戒[いまし]めを機[き]会[かい]として、わたしのうちにありとあらゆる欲[よく]を働[はたら]かせた。律法[りっぽう]がなければ、罪[つみ]は死[し]んだも同然[どうぜん]だからである。"
  9: "わたしはかつて、律法[りっぽう]なしに生[い]きていた。しかし、戒[いまし]めが来[き]たとき、罪[つみ]は生[い]き返[かえ]り、"
  10: "わたしは死[し]んだ。そして、命[いのち]へと導[みちび]くはずのその戒[いまし]めが、わたしにとっては死[し]へと導[みちび]くものとなったのである。"
  11: "罪[つみ]は戒[いまし]めを機[き]会[かい]として、わたしを欺[あざむ]き、それによってわたしを殺[ころ]したのである。"
  12: "したがって、律法[りっぽう]は聖[せい]であり、戒[いまし]めも聖[せい]で、正[ただ]しく、善[よ]いものである。"
  13: "それでは、善[よ]いものがわたしにとって死[し]となったのか。決[けっ]してそうではない。むしろ、罪[つみ]が罪[つみ]として現[あらわ]れるために、善[よ]いものを用[もち]いてわたしに死[し]をもたらしたのである。それは、戒[いまし]めによって、罪[つみ]が極[きわ]めて罪[つみ]深[ぶか]いものとなるためである。"
  14: "わたしたちは知[し]っている。律法[りっぽう]は霊[れい]に属[ぞく]するものである。しかし、わたしは肉[にく]に属[ぞく]し、罪[つみ]の下[もと]に売[う]られている者[もの]である。"
  15: "というのは、わたしは、自分[じぶん]がしていることを知[し]らないからである。わたしが望[のぞ]むことを行[おこな]わず、むしろ憎[にく]むことをしているのである。"
  16: "もし、望[のぞ]まないことをしているのなら、律法[りっぽう]が善[よ]いものであることを、わたしは認[みと]めていることになる。"
  17: "そうであれば、それを行[おこな]っているのはもはやわたしではなく、わたしのうちに住[す]んでいる罪[つみ]である。"
  18: "わたしは知[し]っている。すなわち、わたしのうちに、つまりわたしの肉[にく]のうちに、善[よ]いものは住[す]んでいない。善[よ]いことを望[のぞ]むことはわたしにあっても、それを実行[じっこう]することはないのである。"
  19: "わたしは、望[のぞ]む善[よ]いことを行[おこな]わず、望[のぞ]まない悪[あく]を行[おこな]っている。"
  20: "もし、望[のぞ]まないことをしているのなら、それを行[おこな]っているのはもはやわたしではなく、わたしのうちに住[す]んでいる罪[つみ]である。"
  21: "そこで、わたしは、善[よ]いことを行[おこな]おうとするわたしには、悪[あく]がつきまとっている、という法[ほう]則[そく]を見[み]いだすのである。"
  22: "というのは、わたしは内[うち]なる人[ひと]としては、神[かみ]の律法[りっぽう]を喜[よろこ]んでいるからである。"
  23: "しかし、わたしの手足[てあし]のうちには別[べつ]の法[ほう]則[そく]があって、わたしの心[こころ]の律法[りっぽう]と戦[たたか]い、わたしを、手足[てあし]のうちにある罪[つみ]の法[ほう]則[そく]の捕虜[ほりょ]にしているのを、わたしは見[み]る。"
  24: "ああ、わたしはなんと惨[みじ]めな人間[にんげん]だろう。この死[し]の体[からだ]から、だれがわたしを救[すく]い出[だ]してくれるのか。"
  25: "わたしたちの主[しゅ]イエス・キリストによって、神[かみ]に感[かん]謝[しゃ]する。そうであるから、このわたしは、心[こころ]では神[かみ]の律法[りっぽう]に仕[つか]え、肉[にく]では罪[つみ]の律法[りっぽう]に仕[つか]えているのである。"

notes:
  1: "ἀγνοεῖτε… γινώσκουσιν γὰρ νόμον λαλῶ — 知らないのか…律法を知る者に話している. Вводное γάρ внутри обращения передано придаточным «律法を知る者に»."
  2: "ὕπανδρος — «замужняя»; 夫のある女. δέδεται νόμῳ — 律法によって結びつけられている."
  3: "χρηματίσει — «будет названа»; 呼ばれる. μοιχαλίς — 姦淫の女 (у jp-joc 淫婦)."
  4: "θανατωθῆτε τῷ νόμῳ — 律法に対して死んだ; датив отношения. εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ — 別の方に属するため. καρποφορήσωμεν — 実を結ぶ."
  5: "παθήματα τῶν ἁμαρτιῶν — 罪の欲情. ἐνηργεῖτο — 働いて. καρποφορῆσαι τῷ θανάτῳ — 死のために実を結ばせていた."
  6: "κατηργήθημεν ἀπὸ τοῦ νόμου — 律法から解き放たれた. γράμμα/πνεῦμα — 文字/霊; καινότης — 新しい在り方."
  7: "Цитата Исх 20:17 (οὐκ ἐπιθυμήσεις) — 「欲してはならない」. μὴ γένοιτο — 決してそうではない. Двойное γάρ: かえって… / 〜と言わなければ…であろう."
  8: "ἀφορμή — «повод, отправная точка»; 機会. χωρὶς γὰρ νόμου ἁμαρτία νεκρά — 律法がなければ罪は死んだも同然."
  9: "ἀνέζησεν — 生き返り; стих обрывается запятой, как в греческом: продолжение в 7:10."
  10: "εὑρέθη μοι… εἰς θάνατον — わたしにとっては死へと導くものとなった."
  11: "ἐξηπάτησέν με — 欺き; ἀπέκτεινεν — 殺した. Речь по-прежнему от первого лица."
  12: "ὥστε — したがって. ἅγιος… δικαία… ἀγαθή — 聖・正しい・善い."
  13: "ἵνα φανῇ ἁμαρτία — 罪が罪として現れるために. καθ' ὑπερβολὴν ἁμαρτωλός — 極めて罪深い."
  14: "πνευματικός — 霊に属する. σάρκινος — 肉に属する. πεπραμένος ὑπὸ τὴν ἁμαρτίαν — 罪の下に売られている."
  15: "ὃ γὰρ κατεργάζομαι οὐ γινώσκω — 自分がしていることを知らない. οὐ γὰρ ὃ θέλω… ἀλλ' ὃ μισῶ — 望むことを行わず、憎むことをしている."
  16: "σύμφημι τῷ νόμῳ — 律法が善いものであることを認めている."
  17: "νυνὶ δέ — そうであれば (не «ныне»: противопоставления во времени здесь нет). οἰκοῦσα ἐν ἐμοὶ ἁμαρτία — わたしのうちに住んでいる罪."
  18: "οὐκ οἰκεῖ… ἀγαθόν — 善いは住んでいない. παράκειταί μοι — わたしにある. κατεργάζεσθαι — 実行する."
  19: "οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν — 望む善いことを行わず."
  20: "В базе [ἐγώ] — есть, не обёрнуто; повтор 7:17 почти дословно, как у Павла."
  21: "τὸν νόμον — здесь «закон, правило», не Моисеев закон: 法則 (律法 — νόμος Моисея)."
  22: "συνήδομαι — 喜んでいる. ὁ ἔσω ἄνθρωπος — 内なる人."
  23: "ἀντιστρατευόμενον — 戦い. αἰχμαλωτίζοντά με — 捕虜にしている. νοῦς — 心 (не «ум» как отвлечённость)."
  24: "ταλαίπωρος — 惨めな. ῥύσεται — 救い出してくれる. Вопрос оставлен вопросом."
  25: "χάρις δὲ τῷ θεῷ — 神に感謝する. ἀνακόλουθον сохранён: «сам я» служу двумя законами, без примирительного вывода — так и в тексте, и у jp-joc."
