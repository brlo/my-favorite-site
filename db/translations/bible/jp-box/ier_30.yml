verses:
  1: "主[しゅ]からエレミヤに臨[のぞ]んだ言葉[ことば]は、次[つぎ]のとおりである。"
  2: "イスラエルの神[かみ]である主[しゅ]は、こう言[い]われる。「わたしがあなたに語[かた]ったすべての言葉[ことば]を、書[しょ]に記[しる]せ。"
  3: "見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。わたしはわたしの民[たみ]イスラエルとユダの捕囚[ほしゅう]を帰[かえ]らせ、彼らを、その父祖[ふそ]に与[あた]えた地[ち]に帰らせる。彼らはそれを治[おさ]める。」"
  4: "これが、主[しゅ]がイスラエルとユダについて語[かた]られた言葉[ことば]である。"
  5: "主[しゅ]はこう言[い]われた。「恐[おそ]れの声[こえ]を、あなたがたは聞[き]く。恐れであって、平和[へいわ]ではない。"
  6: "尋[たず]ねて見[み]よ。男[おとこ]が子[こ]を産[う]むことがあるか。なぜ、わたしはすべての男の手[て]が腰[こし]にあり、産[さん]に苦[くる]しむ女[おんな]のようになっているのを見[み]るのか。顔[かお]はみな、黄疸[おうだん]のように黄[き]ばんでいる。"
  7: "ああ、なんと痛[いた]ましいことか。その日[ひ]は大[おお]きく、これに似[に]た日はない。ヤコブにとって苦[くる]しみの時[とき]であるが、彼はそこから救[すく]われる。」"
  8: "主[しゅ]はこう言[い]われる。「その日[ひ]には、わたしは彼[かれ]らの首[くび]から軛[くびき]を砕[くだ]き、その束縛[そくばく]を断[た]ち切[き]る。彼らはもはや異邦人[いほうじん]に仕[つか]えない。"
  9: "彼らは、その神[かみ]である主[しゅ]に仕[つか]え、わたしが彼らのために立[た]てるダビデ王[おう]に仕える。」"
  10: "「それゆえ、わたしのしもべヤコブよ、恐[おそ]れるな、と主[しゅ]は言[い]われる。イスラエルよ、おじけるな。見[み]よ、わたしはあなたを遠[とお]い国[くに]から、あなたの子孫[しそん]をその捕囚[ほしゅう]の地[ち]から救[すく]う。ヤコブは帰[かえ]ってきて安[やす]らかに住[す]み、だれも彼を恐[おびや]かさない。"
  11: "わたしはあなたとともにいて、あなたを救[すく]うからである、と主[しゅ]は言[い]われる。わたしはあなたを散[ち]らしたすべての民[たみ]に終[おわ]りをもたらす。しかし、あなたには終わりをもたらさない。わたしはあなたを裁[さば]きによって懲[こ]らしめ、罰[ばつ]せずにはおかない。」"
  12: "主[しゅ]はこう言[い]われる。「わたしはあなたの砕[くだ]かれたものを起[おこ]した。あなたの傷[きず]はひどく痛[いた]む。"
  13: "あなたの訴[うった]えを裁[さば]く者[もの]はいない。痛[いた]みのため手当[てあて]を受[う]けても、あなたには何[なん]の益[えき]もない。"
  14: "あなたの友[とも]はみな、あなたを忘[わす]れ、あなたを尋[たず]ねない。わたしが敵[てき]の打[う]ち傷[きず]で、厳[きび]しい懲[こ]らしめで、あなたを打[う]ったからである。あなたの不法[ふほう]が多[おお]く、あなたの罪[つみ]が重[おも]かったからである。"
  15: "なぜ、あなたは自分の砕[くだ]かれたことを叫[さけ]ぶのか。あなたの病[やまい]は癒[い]しがたい。あなたの不法[ふほう]が多[おお]く、あなたの罪[つみ]が頑[かた]いからである。わたしはあなたにこれらのことを行[おこな]った。"
  16: "それゆえ、あなたを食[く]らう者[もの]はみな食らわれ、あなたの敵[てき]はみな、その肉[にく]を食[た]べる。あなたの不法[ふほう]が多[おお]く、あなたの罪[つみ]が重[おも]いために、彼らはあなたにこれらのことをしたのである。あなたを奪[うば]う者[もの]は奪われ、あなたを略奪[りゃくだつ]する者[もの]はみな、わたしが略奪に渡[わた]す。"
  17: "わたしはあなたの癒[いや]しをもたらし、あなたの痛[いた]い傷[きず]を癒[いや]やす、と主[しゅ]は言[い]われる。人々[ひとびと]があなたを『追[お]い散[ち]らされた者[もの]』と呼[よ]び、『シオンはわれわれの獲物[えもの]だ。尋[たず]ねる者[もの]がないからだ』と言[い]ったからである。」"
  18: "主[しゅ]はこう言[い]われる。「見[み]よ、わたしはヤコブの捕囚[ほしゅう]を帰[かえ]らせ、その住[す]まいをあわれむ。都[みやこ]はその丘[おか]の上[うえ]に建[た]て直[なお]され、神殿[しんでん]は定[さだ]められた所[ところ]に据[す]えられる。"
  19: "そこから感謝[かんしゃ]の声[こえ]と、喜[よろこ]ぶ者[もの]の声[こえ]が出[で]る。わたしは彼らを増[ふ]やし、減[へ]らさない。"
  20: "彼らの息子[むすこ]たちは、昔[むかし]のようにそこに住[す]み、その会衆[かいしゅう]はわたしの前[まえ]に立[た]つ。わたしは彼らを苦[くる]しめる者[もの]たちを罰[ばつ]する。"
  21: "その支配者[しはいしゃ]は彼らの中[なか]から出[で]て、その君[きみ]は彼らの間[あいだ]から出[で]る。わたしは彼を近[ちか]づけ、彼はわたしに近づく。だれが、自分[じぶん]の心[こころ]を定[さだ]めてわたしに近づこうとするのか、と主[しゅ]は言[い]われる。」"
  22: "「あなたがたはわたしの民[たみ]となり、わたしはあなたがたの神[かみ]となる。」"
  23: "見[み]よ、主[しゅ]の怒[いか]りが出[で]て激[はげ]しく燃[も]え、回[まわ]りながら進[すす]む怒りが、悪[あく]をなす者[もの]の上[うえ]に降[ふ]りかかる。"
  24: "主[しゅ]の激[はげ]しい怒[いか]りは、主[しゅ]がその心[こころ]の企[くわだ]てを成[な]し遂[と]げるまで、決[けっ]して引[ひ]き返[かえ]らない。末[すえ]の日[ひ]々[び]に、あなたがたはこれを悟[さと]る。"

notes:
  1: "Ὁ λόγος ὁ γενόμενος πρὸς Ιερεμιαν παρὰ κυρίου εἰπεῖν — «слово, бывшее к Иеремии от Господа, сказать» (εἰπεῖν — «говоря», вводящее слово Господа). Вводная формула вне кавычек; слав. «Слово бывшее ко иеремии от Господа глаголя». Открывается книга утешения (слав. 30)."
  2: "Οὕτως εἶπεν κύριος ὁ θεὸς Ισραηλ λέγων — «так говорит Господь Бог Израилев, говоря»; Γράψον πάντας τοὺς λόγους, οὓς ἐχρημάτισα πρὸς σέ, ἐπὶ βιβλίου — «напиши все слова, которые Я возвестил тебе, в книгу» (χρηματίζω — возвещать, говорить как оракул; βιβλίον — книга, свиток; в тексте 書). Слав. «впиши вся словеса в книги, яже глаголах к тебе». Цитата открывается и продолжается в 37:3."
  3: "ἰδοὺ ἡμέραι ἔρχονται, φησὶν κύριος — «вот, наступают дни, говорит Господь»; ἀποστρέψω τὴν ἀποικίαν λαοῦ μου Ισραηλ καὶ Ιουδα — «возвращу переселение народа Моего, Израиля и Иуды» (ἀποικία — переселение, плен; в тексте 捕囚); ἀποστρέψω αὐτοὺς εἰς τὴν γῆν, ἣν ἔδωκα τοῖς πατράσιν αὐτῶν — «возвращу их в землю, которую дал отцам их»; κυριεύσουσιν αὐτῆς — «они будут владеть ею» (κυριεύω — господствовать, владеть). Слав. «возвращу преселение людий моих израиля и иуды»; в 3 добавляет «рече Господь вседержитель» — «вседержитель» в LXX нет. Цитата закрывается."
  4: "Καὶ οὗτοι οἱ λόγοι, οὓς ἐλάλησεν κύριος ἐπὶ Ισραηλ καὶ Ιουδα — «и вот слова, которые сказал Господь об Израиле и Иуде»: авторская формула-заголовок, без кавычек; ею начинается новый отдел (37:5–24). Слав. «И сия словеса, яже глагола Господь о израили и о иуде»."
  5: "Φωνὴν φόβου ἀκούσεσθε — «голос страха услышите» (φόβος — страх); φόβος, καὶ οὐκ ἔστιν εἰρήνη — «страх, и нет мира» (εἰρήνη — мир; в тексте 平和). Слав. «глас страха услышите: страх, и несть мира». ru (МТ) «голос смятения и ужаса» — уточнение перевода. Открывается слово Господа (37:5–7)."
  6: "ἐρωτήσατε καὶ ἴδετε εἰ ἔτεκεν ἄρσεν — «спросите и увидьте: родил ли мужчина?» (ἔτεκεν — аорист от τίκτω, рождать; ἄρσεν — мужской пол). καὶ περὶ φόβου, ἐν ᾧ καθέξουσιν ὀσφὺν καὶ σωτηρίαν — тёмное место: «и о страхе, в котором будут держать чресла и спасение»; передано по смыслу «от страха держатся за бёдра и теряют спасение», в слав. буквально «и о страсе, в немже имети будут чресла и спасение». ἐστράφησαν πρόσωπα εἰς ἴκτερον — «лица обратились в желтуху» (ἴκτερος — желтуха; слав. «в желтую болезнь»), в тексте 黄疸のように変わっている. ru (МТ) «лица у всех бледные»."
  7: "ἐγενήθη — обрывок, по смыслу относится к концу 37:6 («сделалось»); далее ὅτι μεγάλη ἡ ἡμέρα ἐκείνη καὶ οὐκ ἔστιν τοιαύτη — «ибо велик тот день, и нет подобного ему»; χρόνος στενός ἐστιν τῷ Ιακωβ — «время тесное для Иакова» (στενός — тесный, стеснённый); ἀπὸ τούτου σωθήσεται — «от него спасётся». Слав. добавляет в начале «о, люте!» («о, горе!») — нет в LXX, внесено без скобок (ああ、なんと痛ましいことか). Цитата закрывается."
  8: "συντρίψω τὸν ζυγὸν ἀπὸ τοῦ τραχήλου αὐτῶν — «сокрушу ярмо с шеи их» (ζυγός — ярмо, 軛; τράχηλος — шея); τοὺς δεσμοὺς αὐτῶν διαρρήξω — «узы их разорву» (δεσμός — узы, оковы; в тексте 束縛); οὐκ ἐργῶνται αὐτοὶ ἔτι ἀλλοτρίοις — «не будут они более работать на чужих» (ἐργάζομαι — работать, служить; ἀλλότριος — чужой). Слав. «сокрушу ярем со выи их и узы их расторгну: и не послужат тии ктому чуждим». Открывается второе слово Господа (37:8–9)."
  9: "καὶ ἐργῶνται τῷ κυρίῳ θεῷ αὐτῶν — «и будут служить Господу Богу своему»; τὸν Δαυιδ βασιλέα αὐτῶν ἀναστήσω αὐτοῖς — «и Давида, царя их, воздвигну им» (ἀνίστημι — воздвигать, восстанавливать). Слав. «и давида царя их возставлю им». Мессианское чтение (ср. Ос 3:5; Иез 34:23); в ru (МТ) «Давиду, царю своему» — то же. Цитата закрывается."
  10: "В модуле лакуна: в gr-lxx-byz на месте стиха «.», стих переведён по слав. 30:10 (в LXX стих есть, ср. Rahlfs 37:10): «Сего ради ты не бойся, рабе мой иакове, глаголет Господь, ни устрашайся, израилю: яко се, аз спасу тя из земли дальния и семя твое из земли пленения их: и возвратится паки иаков и почиет и всякаго добра исполнен будет, и не будет устрашаяй тя» — «посему ты не бойся, раб Мой Иаков… ибо вот, Я спасу тебя из земли далёкой и семя твоё из земли пленения их; и возвратится Иаков и почиет, и всякого добра исполнен будет, и не будет устрашающего тебя». 〔…〕 не ставим (решение для книги)."
  11: "В модуле лакуна (в gr-lxx-byz «.»); перевод по слав. 30:11: «Яко аз с тобою есмь, глаголет Господь, спасаяй тя: яко сотворю скончание во всех языцех, в няже разсеях тя: тебе же не сотворю во скончание, но накажу тя в суде и очищая не очищу тя» — «ибо Я с тобою, говорит Господь, спасающий тебя; ибо Я сделаю конец всем народам, среди которых рассеял тебя; тебе же не сделаю конца, но накажу тебя в суде и, очищая, не очищу тебя» (συντέλεια — конец, истребление; παιδεύω — наставлять, наказывать; καθαρίζω — очищать). Слав. «очищая не очищу тя» — усиленное отрицание: «не оставлю без наказания»; передано 罰せずにはおかない."
  12: "Ἀνέστησα σύντριμμα — «Я воздвиг сокрушение» (ἀνίστημι, σύντριμμα — сокрушение, перелом; в тексте 砕かれたもの); ἀλγηρὰ ἡ πληγή σου — «болезненна рана твоя» (ἀλγηρός — болезненный; πληγή — удар, рана). Слав. «возставих сокрушение твое, болезненна есть язва твоя». ru (МТ) «рана твоя неисцельна» — масоретское чтение, в текст не внесено. Открывается слово Господа (37:12–17)."
  13: "οὐκ ἔστιν κρίνων κρίσιν σου — «нет судящего суд твой» (κρίνω — судить; κρίσις — суд, тяжба; в тексте 訴え); εἰς ἀλγηρὸν ἰατρεύθης — «на болезненное [место] ты лечился» (ἰατρεύω — лечить); ὠφέλεια οὐκ ἔστιν σοι — «пользы нет тебе» (ὠφέλεια — польза). Слав. «несть судяй суда твоего, на болезнь врачевался еси, пользы несть тебе»."
  14: "πάντες οἱ φίλοι σου ἐπελάθοντό σου — «все друзья твои забыли тебя» (ἐπιλανθάνομαι); οὐ μὴ ἐπερωτήσουσιν — «не спросят [о тебе]»; πληγὴν ἐχθροῦ ἔπαισά σε — «раной врага поразил Я тебя» (παίω — ударять); παιδείαν στερεάν — «наказание твёрдое» (παιδεία — наказание, научение; στερεός — твёрдый); ἐπὶ πᾶσαν ἀδικίαν σου ἐπλήθυναν αἱ ἁμαρτίαι σου — «за всякую неправду твою умножились грехи твои» (πληθύνω)."
  15: "В модуле лакуна (в gr-lxx-byz «.»); перевод по слав. 30:15: «Что вопиеши о сокрушении твоем? неизцельна есть болезнь твоя множества ради неправды твоея, и твердых ради грехов твоих сотворих ти сия (вся)» — «что вопиешь о сокрушении твоём? неисцельна болезнь твоя ради множества неправды твоей и ради тяжких грехов твоих Я сделал тебе это». Слав. «(вся)» — редакционная помета в скобках, не внесена. 〔…〕 не ставим."
  16: "διὰ τοῦτο πάντες οἱ ἔσθοντές σε βρωθήσονται — «посему все поедающие тебя будут съедены» (ἐσθίω, βιβρώσκω); κρέας αὐτῶν πᾶν ἔδονται — «плоть их всю съедят» (κρέας — мясо, плоть; ἐσθίω в буд. — ἔδομαι); ἐπὶ πλῆθος ἀδικιῶν σου ἐπληθύνθησαν αἱ ἁμαρτίαι σου, ἐποίησαν ταῦτά σοι — «за множество неправд твоих умножились грехи твои, они сделали тебе это»; ἔσονται οἱ διαφοροῦντές σε εἰς διαφόρημα — «расхищающие тебя будут расхищены» (διαφορέω — расхищать; διαφόρημα — добыча); πάντας τοὺς προνομεύοντάς σε δώσω εἰς προνομήν — «всех опустошающих тебя отдам в добычу» (προνομεύω, προνομή)."
  17: "ἀνάξω τὸ ἴαμά σου — «возведу (приведу) исцеление твоё» (ἴαμα — исцеление, 癒し); ἀπὸ πληγῆς ὀδυνηρᾶς ἰατρεύσω σε — «от раны болезненной исцелю тебя» (ὀδυνηρός — болезненный); ἐσπαρμένη ἐκλήθης — «рассеянной ты названа» (σπείρω — сеять, рассеивать); θήρευμα ὑμῶν ἐστιν — «она — добыча ваша» (θήρευμα — добыча, ловля; в тексте 獲物); ζητῶν οὐκ ἔστιν αὐτήν — «нет ищущего её». Слав. «яко расточенным называху тя, сионе ловитва наша есть, яко несть взыскающаго его». Здесь речь врагов-насмешников, передана косвенно-прямой речью в 『…』."
  18: "ἀποστρέψω τὴν ἀποικίαν Ιακωβ — «возвращу переселение Иакова» (ἀποικία; в тексте 捕囚); αἰχμαλωσίαν αὐτοῦ ἐλεήσω — «пленение его помилую» (αἰχμαλωσία — плен; ἐλεέω — миловать); οἰκοδομηθήσεται πόλις ἐπὶ τὸ ὕψος αὐτῆς — «построится город на высоте своей» (ὕψος — высота; в тексте 丘の上); ὁ ναὸς κατὰ τὸ κρίμα αὐτοῦ καθεδεῖται — «храм по чину своему утвердится» (κρίμα — устав, чин; καθέζομαι — сидеть, быть поставленным; в тексте 神殿). Слав. «возградится град в высоту свою, и храм по чину своему утвердится». Открывается слово Господа (37:18–21)."
  19: "ἐξελεύσονται ἀπ᾽ αὐτῶν ᾄδοντες — «выйдут из них поющие» (ᾄδω — петь); φωνὴ παιζόντων — «голос играющих» (παίζω — играть, веселиться); πλεονάσω αὐτούς — «умножу их» (πλεονάζω); οὐ μὴ ἐλαττωθῶσιν — «не умалятся» (ἐλαττόω — уменьшать). Слав. «изыдут из него поющии и глас играющих, и умножу я, и не умалятся». В ru (МТ) «благодарение» — уточнение."
  20: "εἰσελεύσονται οἱ υἱοὶ αὐτῶν ὡς τὸ πρότερον — «войдут сыновья их, как прежде»; τὰ μαρτύρια αὐτῶν κατὰ πρόσωπόν μου ὀρθωθήσεται — «свидетельства их пред лицом Моим утвердятся» (μαρτύριον — свидетельство, скиния свидетельства; ὀρθόω — ставить прямо; в тексте 会衆); ἐπισκέψομαι τοὺς θλίβοντας αὐτούς — «посещу притесняющих их», т. е. накажу (θλίβω — теснить, притеснять). Слав. «и внидут сынове их якоже и прежде, и свидения их пред лицем моим исправятся: и посещу на вся стужающыя им»."
  21: "ἔσονται ἰσχυρότεροι αὐτοῦ ἐπ᾽ αὐτούς — «будут сильнейшие его над ними» (ἰσχυρός — сильный; сравнительная степень); ὁ ἄρχων αὐτοῦ ἐξ αὐτοῦ ἐξελεύσεται — «правитель его из него выйдет» (ἄρχων — правитель, 支配者); συνάξω αὐτούς — «соберу их»; τίς ἐστιν οὗτος, ὃς ἔδωκεν τὴν καρδίαν αὐτοῦ ἀποστρέψαι πρός με — «кто это, кто дал сердце своё обратиться ко Мне?» (τίθημι/δίδωμι καρδίαν — решиться). Слав. «и будут крепльшии его на ня, и князь его из него изыдет: и соберу я, и обратятся ко мне: кто бо есть той, иже приложит сердце свое обратитися ко мне?». Цитата закрывается."
  22: "В модуле лакуна (в gr-lxx-byz «.»); перевод по слав. 30:22: «И будете ми в люди, и аз вам буду в Бога» — «и вы будете Мне народом, и Я буду вам Богом»: заключительная формула завета (ср. 38:1, 38:33; Лев 26:12; Ос 2:23; Откр 21:3). В LXX стих есть (Rahlfs 37:22), но в модуле его текст отсутствует. 〔…〕 не ставим."
  23: "ὀργὴ κυρίου ἐξῆλθεν θυμώδης — «гнев Господень вышел яростный» (θυμώδης — полный ярости); ἐξῆλθεν ὀργὴ στρεφομένη — «вышел гнев обращающийся», т. е. вихрь (στρέφω — вращать; слав. «гнев обращаемь»); ἐπ᾽ ἀσεβεῖς ἥξει — «на нечестивых придёт» (ἀσεβής — нечестивый). Слав. «Яко гнев Господень изыде яр, изыде гнев обращаемь, на нечестивыя приидет». Авторско-пророческое слово без кавычек: гнев Господа в 3-м лице."
  24: "οὐ μὴ ἀποστραφῇ ὀργὴ θυμοῦ κυρίου — «не обратится гнев ярости Господней», т. е. не отступит; ἕως ποιήσῃ καὶ ἕως καταστήσῃ ἐγχείρημα καρδίας αὐτοῦ — «доколе не сделает и не утвердит начинание сердца Своего» (ἐγχείρημα — предприятие, замысел; καθίστημι — ставить, утверждать); ἐπ᾽ ἐσχάτων τῶν ἡμερῶν γνώσεσθε αὐτά — «в последние дни познаете это» (ἔσχατος — последний; γινώσκω). Слав. «в последния дни познаете я»."
