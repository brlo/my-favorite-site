# jp-box, Иеремия, глава 30. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 37.
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге почти нет (фрагменты гл. 11, 12, 31),
# для этой главы нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30 составная — это не порядок слав. 49, поэтому каждый стих сопоставлен по
# содержанию, а не по номеру. Карта gr → слав./ru 49:
#   gr 30:1–16  = слав. 49:7–22   Едом (Феман, Дедан, «не оставлю сироты», чаша,
#                                 весть к народам, орёл над Сеиром)
#   gr 30:17–21 = слав. 49:1–5    Аммон (Мельхом, Равва, Есевон, «кто придёт на меня?»)
#   gr 30:22    = слав. 49:6      «точка» модуля — «возвращу пленников Аммона»
#   gr 30:23–28 = слав. 49:28–33  Кедар («царица двора», шатры и вельблюды, двор)
#   gr 30:29–33 = слав. 49:23–27  Дамаск (Емаф и Арфад, бегство, огонь в стене)
# Голоса: 30:1–16 и 17–21 и 23–28 и 29–33 — четыре оракула, каждый открывается
# заголовком вне кавычек («エドムについて。主はこう言われる。」) и одной цитатой 「…»
# до конца своего отдела (цитата Едома закрывается в конце 30:16, Аммона — в конце
# 30:21, Кедара — в конце 30:28, Дамаска — в конце 30:33). Вложенная речь — 『…』:
# 30:8 (весть к народам), 30:20 (слова «кто придёт на меня?»), 30:24 («погибель
# отовсюду»). 30:22 — «точка», закрыта по слав. 49:6.
# Нумерация по gr: 33 стиха; у слав. 49 — 39 (включая Елам 34–39, это наша гл. 25).
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 30:4 «(погибель исавлю)» — в скобках у слав., отдельно не переводилось; 30:5
# «и несть остатися» — отрицание слав. не внесено, см. notes; 30:7 «в посмех»,
# 30:10 «глаголет Господь», 30:15 «чермнем», 30:30 «скорбь и болезнь одержаша
# его яко раждающую». 30:9 «мала дах тя» (LXX) против «ибо вот, Я сделаю тебя
# малым» (ru/МТ). 30:13 «τοὺς νεανίσκους ἐπιστήσατε» (LXX) против «кто будет
# избран, егоже поставлю» (слав./МТ) — держим LXX.
# Сносок ⟨…⟩ нет: 天幕, 杯, 祭壇, 粗布, 嗣業, 鷲, らくだ, 城壁 уже в корпусе.
# Имена — транслитерация греческого (LXX): エドム, テマン, デダン, エサウ, アンモン,
# メルコム, ガド, ラバ, ヘスボン, ガイ, エナキム, ケダル, ケデム, ダマスコ, ハマテ,
# アルパド, アデル, ヨルダン, アイタム, ネブカドネツァル.
