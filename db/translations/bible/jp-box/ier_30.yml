verses:
  1: "エドムについて。主[しゅ]はこう言[い]われる。「テマンにはもはや知恵[ちえ]がない。悟[さと]りある者[もの]たちから計[はかりごと]が失[うしな]われ、彼らの知恵は去[さ]った。"
  2: "彼らの住[す]みかは欺[あざむ]かれた。デダンに住[す]む者[もの]たちよ、深[ふか]く沈[しず]んで座[すわ]れ。災[わざわ]いを為[な]したからである。わたしが彼を顧[かえり]みた時[とき]に、災いを彼の上[うえ]に臨[のぞ]ませた。"
  3: "ぶどうの摘[つ]み取[と]り人[びと]たちがあなたのもとに来[き]た。彼らは残[のこ]りを残[のこ]さない。盗人[ぬすびと]たちが夜[よる]に来たように、彼らは手[て]をかける。"
  4: "わたしはエサウを引[ひ]きずり下[お]ろし、彼らの隠[かく]れた所[ところ]をあらわにした。彼らは身[み]を隠[かく]すことができない。彼らは滅[ほろ]びた。兄弟[きょうだい]の手[て]と隣人[りんじん]の手[て]によって。残[のこ]る者[もの]はない。"
  5: "あなたの孤児[みなしご]は、生[い]きるために残[のこ]される。わたしもまた生[い]きる。やもめたちはわたしに信頼[しんらい]した。"
  6: "主[しゅ]はこう言[い]われた。杯[さかずき]を飲[の]むべきでなかった者[もの]たちさえ、それを飲[の]んだ。あなたは罰[ばつ]を免[まぬが]れておかれようか。あなたは免れない。必[かなら]ず飲む。"
  7: "わたしは自分[じぶん]にかけて誓[ちか]った、と主[しゅ]は言[い]われる。あなたは荒[あ]れた所[ところ]となり、ののしりとなり、嘲笑[ちょうしょう]となり、呪[のろ]いとなって、その中[なか]に置[お]かれる。そのすべとの町々[まちまち]は永久[えいきゅう]に荒[あ]れ果[は]てる。"
  8: "わたしは主[しゅ]から聞[き]いた。使者[ししゃ]が諸国民[しょこくみん]に遣[つか]わされた。『集[あつ]まれ。彼に向かって来[こ]い。立[た]って、戦[たたか]いのために起[た]て。』"
  9: "わたしはあなたを諸国民[しょこくみん]の間[あいだ]で小[ちい]さくし、人[ひと]の間で軽[かろ]んじられる者[もの]とした。"
  10: "あなたの遊[あそ]びはあなたを惑[まど]わせ、あなたの心[こころ]の傲慢[ごうまん]は岩[いわ]の裂[さ]け目[め]に住[す]みつき、高[たか]い丘[おか]の力[ちから]を奪[うば]った。あなたが鷲[わし]のように自分の巣[す]を高[たか]くしても、わたしはそこからあなたを引[ひ]き下[お]ろす、と主[しゅ]は言[い]われる。"
  11: "エドムは荒[あ]れた所[ところ]となり、そこを通[とお]り過[す]ぎる者[もの]はみな、これを見[み]て口笛[くちぶえ]を吹[ふ]く。"
  12: "ソドムとゴモラとその周辺[しゅうへん]の町々[まちまち]が覆[くつがえ]されたように、と全能者[ぜんのうしゃ]である主[しゅ]は言[い]われる。そこには人[ひと]も住[す]まず、人[ひと]の子[こ]もそこに住[す]みつかない。"
  13: "見[み]よ、彼[かれ]は獅子[しし]のようにヨルダン[がわ]の中[なか]から、アイタムの地[ち]へ上[のぼ]って来[く]る。わたしは彼らをその地[ち]から速[すみ]やかに追[お]い払[はら]い、若者[わかもの]たちをその上[うえ]に立[た]たせる。だれがわたしに似[に]ているのか。だれがわたしと争[あらそ]えるのか。だれが、わたしの前[まえ]に立[た]てる牧者[ぼくしゃ]なのか。"
  14: "それゆえ、主[しゅ]がエドムについて定[さだ]めた計[はか]りと、テマンに住[す]む者[もの]について思[おも]い巡[めぐ]らした考[かんが]えを聞[き]け。群[む]れの小[ちい]さな羊[ひつじ]たちが彼らを引[ひ]きずり出[だ]す。彼らの住[す]みかは彼らと共[とも]に荒[あ]らされる。"
  15: "彼らの倒[たお]れる声[こえ]によって地[ち]は震[ふる]え、あなたの叫[さけ]びは紅[あか]い海[うみ]で聞[き]こえた。"
  16: "見[み]よ、鷲[わし]のように彼は飛[と]び、その翼[つばさ]をそのとりでの上[うえ]に広[ひろ]げる。その日[ひ]、エドムの強[つよ]い者[もの]たちの心[こころ]は、子[こ]を産[う]む女[おんな]の心のようになる。」"
  17: "アンモンの子[こ]らについて。主[しゅ]はこう言[い]われる。「イスラエルには子[こ]らがいないのか。相続[そうぞく]する者[もの]がいないのか。なぜ、メルコムがガドを取[と]り、その民[たみ]がその町々[まちまち]に住[す]むのか。"
  18: "それゆえ、見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。わたしはラバに戦[いくさ]の騒[さわ]ぎを響[ひび]かせ、ラバを荒[あ]れた所[ところ]と滅[ほろ]びとし、その祭壇[さいだん]を火[ひ]で焼[や]き尽[つ]くす。イスラエルはその支配[しはい]を取[と]り戻[もど]す。"
  19: "エセボンよ、叫[さけ]べ。ガイは滅[ほろ]びたからである。ラバの娘[むすめ]たちよ、呼[よ]ばわれ。粗布[あらぬの]をまとって泣[な]き、メルコムのために嘆[なげ]け。彼は祭司[さいし]たちやその長[おさ]たちと共[とも]に捕囚[ほしゅう]に流[なが]されるからである。"
  20: "エナキムの野[の]で喜[よろこ]ぶ者[もの]よ。傲慢[ごうまん]な娘[むすめ]よ。自分の宝[たから]に信頼[しんらい]し、『だれがわたしに迫[せま]るだろうか』と言[い]う者[もの]よ。"
  21: "見[み]よ、わたしはあなたの上[うえ]に恐[おそ]れを、と主[しゅ]は言[い]われる。四方[しほう]のすべとの隣[となり]から恐れを臨[のぞ]ませる。あなたがたは散[ち]り散[ぢ]らされ、それぞれ前[まえ]へ逃[に]げる。それを集[あつ]める者[もの]はない。」"
  22: "その後[のち]、わたしはアンモンの子[こ]らの捕囚[ほしゅう]を帰[かえ]す、と主[しゅ]は言[い]われる。"
  23: "ケダル、庭[にわ]の女王[じょおう]について。バビロンの王[おう]ネブカドネツァルがこれを撃[う]った。主[しゅ]はこう言[い]われる。「立[た]って、ケダルに上[のぼ]れ。東[ひがし]の民[たみ]を満[み]たせ。"
  24: "彼らはその天幕[てんまく]とその羊[ひつじ]を取[と]り、その衣[ころも]とそのすべとの器[うつわ]とそのらくだを奪[うば]い、彼らに向[む]かって『四方[しほう]に滅[ほろ]びあれ』と呼[よ]ぶ。"
  25: "逃[に]げよ、大[おお]いに逃[に]げよ。深[ふか]く沈[しず]んで座[すわ]れ、庭[にわ]に住[す]む者[もの]たちよ。バビロンの王[おう]はあなたがたに対して計[はか]りを定[さだ]め、あなたがたに対して考[かんが]えを巡[めぐ]らしたからである。"
  26: "立[た]って、安[やす]らかに住[す]み、憩[いこ]いの中[なか]に座[すわ]る民[たみ]に上[のぼ]れ。戸[と]も、錠[じょう]も、かんぬきもない者[もの]たちに。彼らはひとりで住[す]んでいる。"
  27: "彼らのらくだは奪[うば]われ、その家畜[かちく]の群[む]れは獲物[えもの]となる。わたしは彼らを、風[かぜ]のすべてもとに散[ち]らし、四方[しほう]から彼らに災[わざわ]いをもたらす、と主[しゅ]は言[い]われる。"
  28: "庭[にわ]はすずめの住[す]みかとなり、永久[えいきゅう]に荒[あ]れた所[ところ]となる。そこには人[ひと]も住[す]まず、人[ひと]の子[こ]もそこに住[す]みつかない。」"
  29: "ダマスコについて。「ハマテとアルパドは辱[はずかし]められた。彼らは悪[わる]い知[し]らせを聞[き]いて、うろたえ、怒[いか]り、安[やす]らうことができない。"
  30: "ダマスコは弱[よわ]まり、逃[に]げ去[さ]り、震[ふる]えがこれを捕[と]らえた。苦[くる]しみと産[さん]みの苦しみが、子[こ]を産[う]む女[おんな]のように、これを捕らえた。"
  31: "どうして、わたしの町[まち]が捨[す]てられないのか。彼らは村[むら]を愛[あい]した。"
  32: "それゆえ、その若者[わかもの]たちはあなたの広場[ひろば]で倒[たお]れ、そのすべとの戦士[せんし]たちはその日[ひ]に倒れる、と主[しゅ]は言[い]われる。"
  33: "わたしはダマスコの城壁[じょうへき]に火[ひ]を点[つ]け、それはアデルの子[こ]の館[やかた]を焼[や]き食[く]らう。」"

notes:
  1: "Τῇ Ιδουμαίᾳ — «К Идумее»: заголовок вне кавычек (エドム по корпусу; евр. אֱדוֹם). Τάδε λέγει κύριος — «так говорит Господь»: с него открывается цитата отдела о Едоме (30:1–16; = слав. 49:7–22). Οὐκ ἔστιν ἔτι σοφία ἐν Θαιμαν — «нет уже мудрости в Фемане» (テマン); ἀπώλετο βουλὴ ἐκ συνετῶν — «погиб совет от разумных» (悟りある者たち); ὤχετο σοφία αὐτῶν — «ушла мудрость их»."
  2: "ἠπατήθη ὁ τόπος αὐτῶν — «обмануто (обольщено) место их» (слав. «попрано бысть место их» — иное понимание). βαθύνατε εἰς κάθισιν — «углубитесь в сидении», т. е. уйдите в глубь, в пещеры (深く沈んで座れ); οἱ κατοικοῦντες ἐν Δαιδαν — «живущие в Дедане» (デダン). ὅτι δύσκολα ἐποίησεν — «ибо тяжкое сделал»; ἤγαγον ἐπ᾿ αὐτὸν ἐν χρόνῳ, ᾧ ἐπεσκεψάμην ἐπ᾿ αὐτόν — «навёл на него во время, [когда] Я посетил его» (顧みた時に)."
  3: "τρυγηταὶ ἦλθόν σοι — «собиратели [винограда] пришли к тебе» (摘み取り人); οὐ καταλείψουσίν σοι καταλείμματα — «не оставят тебе остатков» (残り); ὡς κλέπται ἐν νυκτὶ ἐπιθήσουσιν χεῖρα αὐτῶν — «как воры в ночи наложат руки свои» (手をかける)."
  4: "ἐγὼ κατέσυρα τὸν Ησαυ — «Я сволок (содрал) Исава» (引きずり下ろす; ἐπικάσυρω); ἀνεκάλυψα τὰ κρυπτὰ αὐτῶν — «открыл сокровенное их» (隠れた所); κρυβῆναι οὐ μὴ δύνωνται — «укрыться не смогут». ὤλοντο διὰ χεῖρα ἀδελφοῦ αὐτοῦ καὶ γείτονος αὐτοῦ — «погибли от руки брата его и соседа его»; καὶ οὐκ ἔστιν — «и нет [его]» (残る者はない). Слав. в скобках добавляет «(погибель исавлю)» — пояснение, отдельно не переводилось."
  5: "ὑπολείπεσθαι ὀρφανόν σου, ἵνα ζήσηται — «оставаться сироте твоему, чтобы жил» (孤児は残されて生きる); καὶ ἐγὼ ζήσομαι — «и Я буду жить»; χῆραι ἐπ᾿ ἐμὲ πεποίθασιν — «вдовы на Меня уповали» (やもめたちは信頼した). Слав. читает отрицательно: «и несть остатися сироте твоей, да живет» — отрицание не внесено: оно противоречит следующей клаузе («аз же сотворю жити»), держим LXX."
  6: "Οἷς οὐκ ἦν νόμος πιεῖν τὸ ποτήριον, ἔπιον — «те, кому не было закона пить чашу, пили» (杯); καὶ σὺ ἀθῳωμένη οὐ μὴ ἀθῳωθῇς — «и ты, оправданная, не будешь оправдана» (罰を免れない); ὅτι πίνων πίεσαι — «ибо пьющий [её] будешь пить» (必ず飲む). Говорит Господь (внутри цитаты), формула «так говорит Господь» в 3-м лице."
  7: "κατ᾿ ἐμαυτοῦ ὤμοσα — «Собою поклялся Я» (自分にかけて誓った); εἰς ἄβατον καὶ εἰς ὀνειδισμὸν καὶ εἰς κατάρασιν ἔσῃ — «в непроходимое, в поношение и в проклятие будешь» (荒れた所, ののしり, 呪い); ἐν μέσῳ αὐτῆς — «среди неё»; πᾶσαι αἱ πόλεις αὐτῆς ἔρημοι εἰς αἰῶνα — «все города её пусты вовеки». Слав. добавляет «в посмех» (嘲笑) — нет в LXX, внесено без 〔…〕."
  8: "ἀκοὴν ἤκουσα παρὰ κυρίου — «слух услышал я от Господа» (主から聞いた); ἀγγέλους εἰς ἔθνη ἀπέστειλεν — «послов (ангелов) к народам послал» (使者). Συνάχθητε καὶ παραγένεσθε εἰς αὐτήν — «соберитесь и придите на неё»: весть к народам, внутри цитаты поэтому 『…』; ἀνάστητε εἰς πόλεμον — «встаньте на войну» (戦いのために起て)."
  9: "μικρὸν ἔδωκά σε ἐν ἔθνεσιν — «малым дал Я тебя среди народов» (小さくし); εὐκαταφρόνητον ἐν ἀνθρώποις — «презренным среди людей» (軽んじられる者). ru (МТ) читает «вот, Я сделаю тебя малым» — иное чтение, не внесено."
  10: "ἡ παιγνία σου ἐνεχείρησέν σοι — «игра твоя увлекла тебя» (遊びはあなたを惑わせ); ἰταμία καρδίας σου — «дерзость сердца твоего» (心の傲慢); κατέλυσεν τρυμαλιὰς πετρῶν — «поселилась (καταλύω — располагаться) в расселинах скал» (岩の裂け目に住みつき; слав. «обиташе в разселинах каменных»). συνέλαβεν ἰσχὺν βουνοῦ ὑψηλοῦ — «захватила крепость высокого холма» (高い丘の力を奪った); ὕψωσεν ὥσπερ ἀετὸς νοσσιὰν αὐτοῦ — «вознёс, как орёл, гнездо своё» (鷲); ἐκεῖθεν καθελῶ σε — «оттуда низрину тебя». Слав. добавляет «глаголет Господь» — нет в LXX, внесено без 〔…〕."
  11: "ἔσται ἡ Ιδουμαία εἰς ἄβατον — «будет Идумея в непроходимое» (荒れた所); πᾶς ὁ παραπορευόμενος ἐπ᾿ αὐτὴν συριεῖ — «всякий проходящий мимо неё посвищет» (口笛を吹く)."
  12: "ὥσπερ κατεστράφη Σοδομα καὶ Γομορρα καὶ αἱ πάροικοι αὐτῆς — «как ниспровергнуты Содом и Гоморра и соседние с ними» (周辺の町々); εἶπεν κύριος παντοκράτωρ — «сказал Господь Вседержитель» (全能者である主). οὐ μὴ καθίσῃ ἐκεῖ ἄνθρωπος — «не сядет там человек»; οὐ μὴ ἐνοικήσῃ ἐκεῖ υἱὸς ἀνθρώπου — «не поселится там сын человеческий»."
  13: "ὥσπερ λέων ἀναβήσεται ἐκ μέσου τοῦ Ιορδάνου εἰς τόπον Αιθαμ — «как лев поднимется из среды Иордана к месту Аифам» (獅子, アイタム; ср. 27:44); ὅτι ταχὺ ἐκδιώξω αὐτοὺς ἀπ᾿ αὐτῆς — «ибо быстро изгоню их от неё». τοὺς νεανίσκους ἐπ᾿ αὐτὴν ἐπιστήσατε — «юношей поставьте над ней»: в LXX императив 2 мн. ч., в тексте понят как действие Господа (立てる); слав. и МТ читают «кто будет избран, егоже поставлю над ним» — в notes, держим LXX. τίς ὥσπερ ἐγώ; καὶ τίς ἀντιστήσεταί μοι; — «кто как Я? кто противостанет Мне?»; τίς οὗτος ποιμήν, ὃς στήσεται κατὰ πρόσωπόν μου — «кто этот пастырь, который станет перед лицом Моим?» (牧者)."
  14: "ἀκούσατε βουλὴν κυρίου — «услышьте совет Господень» (計り); ἣν ἐβουλεύσατο ἐπὶ τὴν Ιδουμαίαν — «который Он совещал на Идумею»; λογισμὸν αὐτοῦ... ἐπὶ τοὺς κατοικοῦντας Θαιμαν — «помышление Его о живущих в Фемане» (思い巡らした考え). ἐὰν μὴ συμψησθῶσιν τὰ ἐλάχιστα τῶν προβάτων — «если не будут смелены (истреблены) малейшие из овец» (小さな羊たち; συμψήχω — соскребать); ἐὰν μὴ ἀβατωθῇ ἐπ᾿ αὐτὴν κατάλυσις αὐτῶν — «если не будет опустошено на ней жилище их»."
  15: "ἀπὸ φωνῆς πτώσεως αὐτῶν ἐσείσθη ἡ γῆ — «от голоса падения их потряслась земля»; κραυγή σου ἐν θαλάσσῃ ἠκούσθη — «вопль твой в море был слышен» (叫び). Слав. добавляет «чермнем» при море (紅い海) — нет в LXX, внесено без 〔…〕."
  16: "ὥσπερ ἀετὸς ὄψεται — «как орёл, [полетит и] увидит» (鷲); ἐκτενεῖ τὰς πτέρυγας ἐπ᾿ ὀχυρώματα αὐτῆς — «прострёт крылья над твердынями её» (翼, とりで). ἔσται ἡ καρδία τῶν ἰσχυρῶν τῆς Ιδουμαίας — «будет сердце сильных Идумеи»; ὡς καρδία γυναικὸς ὠδινούσης — «как сердце женщины рождающей» (子を産む女). Цитата отдела о Едоме закрывается в конце стиха."
  17: "Τοῖς υἱοῖς Αμμων — «Сынам Аммона»: заголовок вне кавычек; здесь начинается отдел об Амоне (= слав. 49:1–5). Οὕτως εἶπεν κύριος — «так сказал Господь». Μὴ υἱοὶ οὔκ εἰσιν ἐν Ισραηλ — «разве нет сынов в Израиле?»; ἢ παραλημψόμενος οὐκ ἔστιν αὐτοῖς — «или восприемлющего (наследника) нет у них?» (相続する者). διὰ τί παρέλαβεν Μελχομ τὸν Γαδ — «почему принял Мельхом Гада?» (メルコム, ガド; слав. «мелхом гада»); ὁ λαὸς αὐτῶν ἐν πόλεσιν αὐτῶν ἐνοικήσει — «и народ их в городах их живёт»."
  18: "ἀκουτιῶ ἐπὶ Ραββαθ θόρυβον πολέμων — «возвещу на Равву шум войн» (戦の騒ぎを響かせる; Ραββαθ — Равва Аммонова, ラバ); ἔσονται εἰς ἄβατον καὶ εἰς ἀπώλειαν — «будут в непроходимое и в погибель» (荒れた所と滅び). βωμοὶ αὐτῆς ἐν πυρὶ κατακαυθήσονται — «жертвенники её огнём сожжены будут» (祭壇); παραλήμψεται Ισραηλ τὴν ἀρχὴν αὐτοῦ — «восприимет Израиль начальство (власть) своё» (支配を取り戻す; слав. «власть свою»)."
  19: "ἀλάλαξον, Εσεβων — «возопий, Есевон» (エセボン, как в корпусе, ср. Ис 15:4); ὅτι ὤλετο Γαι — «ибо погиб Гай» (ガイ). κεκράξατε, θυγατέρες Ραββαθ — «возопийте, дщери Раввы» (ラバの娘たち); περιζώσασθε σάκκους — «препояшьтесь вретищами» (粗布). ἐπιληπτεύσασθε — «впадите в исступление (безумие)» (泣き乱れよ; редкое слово, слав. «рыдайте»); κόψασθε ἐπὶ Μελχομ — «бейте себя (плачьте) о Мельхоме»; ἐν ἀποικίᾳ βαδιεῖται — «в переселение пойдёт» (捕囚に流される); οἱ ἱερεῖς αὐτοῦ καὶ οἱ ἄρχοντες αὐτοῦ ἅμα — «священники его и начальники его вместе» (祭司, 長たち)."
  20: "τί ἀγαλλιάσῃ ἐν τοῖς πεδίοις Ενακιμ — «что радуешься на полях Енаким?» (エナキムの野; слав. «во удолиих» — в долинах); θύγατερ ἰταμίας — «дочь дерзости» (傲慢な娘). ἡ πεποιθυῖα ἐπὶ θησαυροῖς αὐτῆς — «уповающая на сокровища свои» (宝に信頼); ἡ λέγουσα Τίς εἰσελεύσεται ἐπ᾿ ἐμέ — «говорящая: кто войдёт в меня (нападёт на меня)?»: слова города, поэтому 『…』."
  21: "ἰδοὺ ἐγὼ φέρω φόβον ἐπὶ σέ — «вот, Я наведу страх на тебя» (恐れを臨ませる); εἶπεν κύριος. ἀπὸ πάσης τῆς περιοίκου σου — «от всех окрестностей твоих» (四方のすべとの隣); διασπαρήσεσθε ἕκαστος εἰς πρόσωπον αὐτοῦ — «рассеетесь каждый прямо перед собой» (それぞれ前へ逃げる); οὐκ ἔσται ὁ συνάγων — «не будет собирающего». Цитата отдела об Амоне закрывается в конце стиха."
  22: "В модуле лакуна («.»). Слав. 49:6: «И посем возвращу пленники сынов аммоних, глаголет Господь» — переведено по слав. без 〔…〕. Стих замыкает отдел об Амоне и стоит между отделами, как в слав. 49:6; такое же обетование о возвращении плена — в 25:19 (Елам, слав. 49:39)."
  23: "Τῇ Κηδαρ βασιλίσσῃ τῆς αὐλῆς — «К Кедару, царице двора»: заголовок вне кавычек. LXX передаёт евр. «Кедар и царства Хацора» как «царица двора» (חצור «Хацор» понято как חצר «двор»); ru «о царствах Асорских». В тексте держим LXX/csl: ケダル、庭の女王 (庭 = αὐλή, ср. 30:25, 28). ἣν ἐπάταξεν Ναβουχοδονοσορ — «которого поразил Навуходоносор» (ネブカドネツァル). Ἀνάστητε καὶ ἀνάβητε ἐπὶ Κηδαρ — «встаньте и взойдите на Кедар»; πλήσατε τοὺς υἱοὺς Κεδεμ — «наполните (разорите) сынов Кедема» (東の民)."
  24: "σκηνὰς αὐτῶν καὶ πρόβατα αὐτῶν λήμψονται — «шатры их и овец их возьмут» (天幕, 羊); ἱμάτια αὐτῶν καὶ πάντα τὰ σκεύη αὐτῶν — «одежды их и все сосуды их» (衣, 器); καμήλους αὐτῶν — «верблюдов их» (らくだ). καλέσατε ἐπ᾿ αὐτοὺς ἀπώλειαν κυκλόθεν — «призовите на них погибель отовсюду»: возглас, поэтому 『…』 (四方に滅びあれ)."
  25: "φεύγετε λίαν — «бегите весьма» (大いに逃げよ); βαθύνατε εἰς κάθισιν — «углубитесь в сидении» (深く沈んで座れ, ср. 30:2); καθήμενοι ἐν τῇ αὐλῇ — «сидящие во дворе» (庭に住む者たち). ἐβουλεύσατο ἐφ᾿ ὑμᾶς βασιλεὺς Βαβυλῶνος βουλὴν — «совещал на вас царь Вавилонский совет» (計りを定め); ἐλογίσατο ἐφ᾿ ὑμᾶς λογισμόν — «помыслил на вас помышление» (考えを巡らした)."
  26: "ἀνάστηθι καὶ ἀνάβηθι ἐπ᾿ ἔθνος εὐσταθοῦν — «встань и взойди на народ благоденствующий» (安らかに住む民; εὐσταθέω — быть спокойным, крепким). καθήμενον εἰς ἀναψυχήν — «сидящий в покое (прохладе)» (憩いの中に座る); οἷς οὔκ εἰσιν θύραι, οὐ βάλανοι, οὐ μοχλοί — «у которых нет ни дверей, ни засовов, ни затворов» (戸, 錠, かんぬき); μόνοι καταλύουσιν — «одни живут» (ひとりで住んでいる)."
  27: "ἔσονται κάμηλοι αὐτῶν εἰς προνομήν — «будут верблюды их в добычу» (らくだは奪われ); πλῆθος κτηνῶν αὐτῶν εἰς ἀπώλειαν — «множество скотов их в погибель» (家畜の群れは獲物). λικμήσω αὐτοὺς παντὶ πνεύματι — «развею их всяким ветром» (風のすべてもとに散らし); κεκαρμμένους — «остриженных» (с выбритыми висками — об арабах, ср. 25:23; слав. «остриженых»); ἐκ παντὸς πέραν αὐτῶν οἴσω τὴν τροπήν αὐτῶν — «со всех пределов их приведу поражение их» (τροπή — обращение в бегство, 災い)."
  28: "ἔσται ἡ αὐλὴ διατριβὴ στρουθῶν — «будет двор жилищем воробьёв» (すずめの住みか; διατριβή — пребывание); ἄβατος ἕως αἰῶνος — «непроходим вовеки» (永久に荒れた所). οὐ μὴ καθίσῃ ἐκεῖ ἄνθρωπος — «не сядет там человек»; οὐ μὴ κατοικήσῃ ἐκεῖ υἱὸς ἀνθρώπου — «не поселится там сын человеческий». Цитата отдела о Кедаре закрывается в конце стиха."
  29: "Τῇ Δαμασκῷ — «К Дамаску»: заголовок вне кавычек, за ним сразу открывается цитата (в LXX и слав. формулы «так говорит Господь» здесь нет); здесь начинается отдел о Дамаске (= слав. 49:23–27, в слав. он стоит перед Кедаром). Κατῃσχύνθη Ημαθ καὶ Αρφαδ — «посрамлён Емаф и Арфад» (ハマテ, アルパド); ὅτι ἤκουσαν ἀκοὴν πονηράν — «ибо услышали весть злую» (悪い知らせ); ἐξέστησαν — «изумились» (うろたえ); ἐθυμώθησαν — «разгневались»; ἀναπαύσασθαι οὐ μὴ δύνωνται — «успокоиться не смогут»."
  30: "ἐξελύθη Δαμασκός — «расслаблен (разрушен) Дамаск» (弱まり; ἐκλύω — расслаблять); ἀπεστράφη εἰς φυγήν — «обратился в бегство» (逃げ去り); τρόμος ἐπελάβετο αὐτῆς — «трепет объял его» (震えが捕らえた). Слав. добавляет «скорбь и болезнь одержаша его яко раждающую» (苦しみと産みの苦しみ) — нет в LXX (по МТ), внесено без 〔…〕."
  31: "πῶς οὐχὶ ἐγκατέλιπεν πόλιν ἐμήν; — «как не оставил город Мой?» (わたしの町が捨てられないのか); κώμην ἠγάπησαν — «селение возлюбили» (村を愛した). Слав. читает иначе: «како не оставиша града славнаго, крепости любезныя?» (славного града, крепости любезной) — по МТ; держим LXX."
  32: "πεσοῦνται νεανίσκοι ἐν πλατείαις σου — «падут юноши на площадях твоих» (広場); πάντες οἱ ἄνδρες οἱ πολεμισταί σου πεσοῦνται — «все мужи воинские твои падут» (戦士たち); φησὶν κύριος."
  33: "καύσω πῦρ ἐν τείχει Δαμασκοῦ — «зажгу огонь в стене Дамаска» (城壁に火を点ける); καταφάγεται ἄμφοδα υἱοῦ Αδερ — «пожрёт предместья (кварталы) сына Адера» (館; ἄμφοδον — квартал, окружённое улицами место; слав. «стены сына адерова»). Цитата отдела о Дамаске закрывается в конце стиха; глава кончается, как и слав. 49:27."
