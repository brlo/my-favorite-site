# jp-box, Третье послание Иоанна, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание (1), молитва о здравии и успехе (2), радость о свидетельстве
# истины (3–4), странноприимство и поддержка миссионеров (5–8), своеволие Диотрефа
# (9–10), пример Димитрия (11–12), заключение и приветствия (13–15).
# Красного и синего нет: прямой речи Христа и Богородицы нет.
# 〔…〕: 1:15 — церковное ἀμήν; в базе стих кончается на κατ᾽ ὄνομα, ἀμήν нет.
# Кавычек 「…」 в главе нет: прямая речь не приводится, слова Диотрефа переданы косвенно.
# Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: 3in
chapter: 1
draft: true

verses:
  1: "長老[ちょうろう]から、愛[あい]するガイオへ。わたしが真理[しんり]のうちに愛[あい]している者[もの]である。"
  2: "愛[あい]する者[もの]よ。あなたの魂[たましい]が栄[さか]えているように、あなたもすべてのことにおいて栄[さか]え、健[すこ]やかであるように、わたしは祈[いの]っている。"
  3: "兄弟[きょうだい]たちが来[き]て、あなたの真理[しんり]を証言[しょうげん]してくれた。すなわち、あなたが真理[しんり]のうちを歩[あゆ]んでいることである。わたしは大変[たいへん]に喜[よろこ]んだ。"
  4: "わたしの子[こ]たちが真理[しんり]のうちを歩[あゆ]んでいることを聞[き]くこと、これより大[おお]きな喜[よろこ]びをわたしは持[も]たない。"
  5: "愛[あい]する者[もの]よ。あなたが兄弟[きょうだい]たちのために、しかも旅[たび]の者[もの]たちのためにしていることは、忠実[ちゅうじつ]な行[おこな]いである。"
  6: "彼[かれ]らは教会[きょうかい]の前[まえ]であなたの愛[あい]を証[あか]しした。あなたが神[かみ]にふさわしく、彼[かれ]らを旅[たび]の途[みち]に送[おく]り出[だ]すなら、それはよいことである。"
  7: "というのは、彼[かれ]らは御名[みな]のために出[で]て行[い]った者[もの]たちであり、異邦人[いほうじん]からは何[なに]も受[う]け取[と]っていないからである。"
  8: "だから、わたしたちはこのような者[もの]たちを迎[むか]え入[い]れ、真理[しんり]のために共[とも]に働[はたら]く者[もの]となるべきである。"
  9: "わたしは教会[きょうかい]に何[なに]か書[か]いた。しかし、彼[かれ]らの間[あいだ]で先[さき]に立[た]つことを好[この]むディオトレフェスは、わたしたちを受[う]け入[い]れない。"
  10: "だから、わたしが行[い]くなら、彼[かれ]がしている行[おこな]い、すなわち、悪[わる]い言葉[ことば]でわたしたちを中傷[ちゅうしょう]していることを思[おも]い起[おこ]させる。また、それだけで満足[まんぞく]せず、自分[じぶん]でも兄弟[きょうだい]たちを迎[むか]え入[い]れず、迎[むか]え入れようとする者[もの]たちを妨[さまた]げ、教会[きょうかい]から追[お]い出[だ]している。"
  11: "愛[あい]する者[もの]よ。悪[あく]に倣[なら]わず、善[ぜん]に倣[なら]いなさい。善[ぜん]を行[おこな]う者[もの]は神[かみ]に属[ぞく]している。悪[あく]を行[おこな]う者[もの]は神[かみ]を見[み]たことがない。"
  12: "デメトリオについては、すべての人[ひと]が、また真理[しんり]そのものも証[あか]ししている。わたしたちもまた証[あか]ししており、あなたは、わたしたちの証[あか]しが真実[しんじつ]であることを知[し]っている。"
  13: "あなたに書[か]くべきことが多[おお]くあるが、墨[すみ]と筆[ふで]で書[か]くことは望[のぞ]まない。"
  14: "すぐにあなたに会[あ]い、顔[かお]と顔[かお]を合[あ]わせて語[かた]ることを望[のぞ]んでいる。"
  15: "平安[へいわ]があなたにあるように。友[とも]たちがあなたによろしくと言[い]っている。友[とも]たち一人[ひとり]一人[ひとり]に、名[な]を挙[あ]げてよろしくと言[い]いなさい。〔アーメン。〕"

notes:
  1: "Ὁ πρεσβύτερος — 長老 (титул автора). Γαΐῳ τῷ ἀγαπητῷ — 愛するガイオへ (имя в дательном падеже; ср. Деян 19:29). ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ — わたしが真理のうちに愛している者."
  2: "περὶ πάντων εὔχομαί σε εὐοδοῦσθαι — すべてのことにおいて栄えるように祈っている. ὑγιαίνειν — 健やかである. καθὼς εὐοδοῦταί σου ἡ ψυχή — あなたの魂が栄えているように; ψυχή — 魂[たましい], не 霊[れい]. Порядок греческого сохранён."
  3: "ἐχάρην γὰρ λίαν — 大変に喜んだ. ἐρχομένων ἀδελφῶν — 兄弟たちが来て. μαρτυρούντων σου τῇ ἀληθείᾳ — あなたの真理を証言してくれた (σου — родительный объекта); раскрыто через すなわち. καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς — あなたが真理のうちを歩んでいる."
  4: "μειζοτέραν τούτων οὐκ ἔχω χαράν — これより大きな喜びを持たない. ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν τῇ ἀληθείᾳ περιπατοῦντα — わたしの子たちが真理のうちを歩んでいることを聞くこと; τὰ ἐμὰ τέκνα — わたしの子たち (духовные чада)."
  5: "πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ — 忠実な行いである. εἰς τοὺς ἀδελφοὺς καὶ τοῦτο ξένους — 兄弟たちのために、しかも旅の者たちのために; ξένος —  странник, чужеземец."
  6: "οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας — 教会の前であなたの愛を証しした. οὓς καλῶς ποιήσεις προπέμψας — 彼らを旅の途に送り出すなら、それはよいことである (προπέμπω — снаряжать в путь, провожать). ἀξίως τοῦ θεοῦ — 神にふさわしく."
  7: "ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον — 御名のために出て行った (τοῦ ὀνόματος — имя Христа, без уточнения). μηδὲν λαμβάνοντες ἀπὸ τῶν ἐθνικῶν — 異邦人からは何も受け取っていない."
  8: "ἡμεῖς οὖν ὀφείλομεν ὑπολαμβάνειν τοὺς τοιούτους — わたしたちはこのような者たちを迎え入れるべきである (ὑπολαμβάνω — принимать, поддерживать). ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ — 真理のために共に働く者となる."
  9: "Ἔγραψά τι τῇ ἐκκλησίᾳ — 教会に何か書いた. ὁ φιλοπρωτεύων αὐτῶν — 彼らの間で先に立つことを好む者 (φιλοπρωτεύω — любить первенство). Διοτρέφης — ディオトレフェス. οὐκ ἐπιδέχεται ἡμᾶς — わたしたちを受け入れない."
  10: "ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ — 彼がしている行いを思い起こさせる. λόγοις πονηροῖς φλυαρῶν ἡμᾶς — 悪い言葉でわたしたちを中傷している (φλυαρέω — пустословить, злословить). μὴ ἀρκούμενος ἐπὶ τούτοις — それだけで満足せず. τοὺς βουλομένους κωλύει — 迎え入れようとする者たちを妨げる. ἐκ τῆς ἐκκλησίας ἐκβάλλει — 教会から追い出す."
  11: "μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν — 悪に倣わず、善に倣いなさい. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν — 善を行う者は神に属している. ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν — 悪を行う者は神を見たことがない (perfect с отрицанием)."
  12: "Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων — デメトリオについては、すべての人が証ししている. ὑπὸ αὐτῆς τῆς ἀληθείας — 真理そのものも. ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν — わたしたちの証しが真実である."
  13: "Πολλὰ εἶχον γράψαι σοι — 書くべきことが多くある. διὰ μέλανος καὶ καλάμου — 墨と筆で (κάλαμος — тростниковое перо). οὐ θέλω — 望まない."
  14: "ἐλπίζω δὲ εὐθέως σε ἰδεῖν — すぐにあなたに会いたいと望んでいる. στόμα πρὸς στόμα λαλήσομεν — 顔と顔を合わせて語る (букв. «уста к устам»; ср. 2 Ин 12)."
  15: "εἰρήνη σοι — 平安があなたにあるように. ἀσπάζονταί σε οἱ φίλοι — 友たちが…よろしくと言っている. ἀσπάζου τοὺς φίλους κατ᾽ ὄνομα — 友たち一人一人に、名を挙げてよろしくと言いなさい. В базе ἀμήν нет; церковный текст (Синодальный «Аминь», jp-joc 「アミン」) добавляет — 〔アーメン〕. Проверено по базе: ἀμήν в стихе — 0."
