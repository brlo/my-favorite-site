# jp-box, Исаия, глава 26. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Исаии есть фрагментами (гл. 25–29), использован только для
# сверки; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 26: песнь о городе крепком (1–21) — одна цитата 「…」, открывается в 1 после
# вводной формулы «в тот день воспоют… говоря», закрывается в конце 21. Внутри неё
# слова Господа к народу (20) — 『…』.
# Нумерация по gr: 21 стих, у csl/ru тоже 21. Границы стихов местами иные:
# «ибо на Тебя уповали» (gr 26:3b) у csl открывает 26:4; относительное «которой
# желает душа наша» (gr 26:9a) у csl стоит в конце 26:8 — в этих двух местах держимся
# деления csl (содержание то же); в 26:17/18, наоборот, держимся gr (у csl «Страха
# ради твоего, Господи» перенесено в 26:18).
# 〔…〕 нет: все 21 стих есть в gr-lxx-byz; csl-добавление 26:18 «не падемся» внесено
# в основной текст без скобок.
# Сносок ⟨…⟩ нет: 都, 城壁, 救い, よみ, 露 уже в корпусе.
# Имена — транслитерация греческого (LXX).

