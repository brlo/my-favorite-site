verses:
  1: "その日[ひ]、ユダヤの地[ち]でこの歌[うた]を歌[うた]って言[い]う。「見[み]よ、堅[かた]い都[みやこ]がある。わたしたちの救[すく]いが城壁[じょうへき]と外郭[がいかく]を設[もう]ける。"
  2: "門[もん]を開[あ]けよ。義[ぎ]を守[まも]り、真理[しんり]を守る民[たみ]が入[はい]るように。"
  3: "真理[しんり]を受[う]け入[い]れ、平和[へいわ]を守[まも]る者[もの]である。"
  4: "主[しゅ]よ、彼[かれ]らは永遠[えいえん]にあなたに望[のぞ]みを置[お]いた。大[おお]いなる永遠の神[かみ]よ。"
  5: "あなたは高[たか]い所[ところ]に住[す]む者[もの]たちを低[ひく]くし、下[くだ]された。堅[かた]い都[みやこ]を倒[たお]して、基[もと]まで下[くだ]す。"
  6: "柔和[にゅうわ]な者[もの]、へりくだった者[もの]の足[あし]がそれを踏[ふ]みにじる。"
  7: "敬虔[けいけん]な者[もの]の道[みち]はまっすぐになり、敬虔な者[もの]の道[みち]は整[ととの]えられた。"
  8: "主[しゅ]の道[みち]は裁[さば]きであるからだ。わたしたちはあなたの名[な]と、わたしたちの魂[たましい]が慕[した]う記念[きおく]とに望[のぞ]みを置[お]いた。"
  9: "夜[よる]のうちから、わたしの霊[れい]はあなたに向[む]かって早[はや]くから目[め]を覚[さ]ます。神[かみ]よ。あなたの定[さだ]めは地[ち]の上[うえ]の光[ひかり]であるからだ。地に住[す]む者[もの]たちよ、義[ぎ]を学[まな]べ。"
  10: "不敬虔[ふけいけん]な者[もの]は滅[ほろ]びた。義[ぎ]を学[まな]ばない者[もの]は皆[みな]、真理[しんり]を行[おこな]わない。不敬虔な者[もの]は取[と]り去[さ]られよ。主[しゅ]の栄光[えいこう]を見[み]ないために。"
  11: "主[しゅ]よ、あなたの腕[うで]は高[たか]く上[あ]げられた。しかし彼[かれ]らは知[し]らなかった。知[し]ってからは、恥[は]じるだろう。熱意[ねつい]が無知[むち]な民[たみ]を捕[と]らえ、今[いま]、火[ひ]が敵[てき]を食[く]らう。"
  12: "主[しゅ]、わたしたちの神[かみ]よ、わたしたちに平和[へいわ]を与[あた]えてください。あなたはわたしたちにすべてを報[むく]いられたからです。"
  13: "主[しゅ]、わたしたちの神[かみ]よ、わたしたちをあなたのものとしてください。主よ、あなたのほかにわたしたちはだれも知[し]らない。わたしたちはあなたの名[な]を呼[よ]ぶ。"
  14: "しかし死[し]んだ者[もの]たちは命[いのち]を見[み]ることはない。医師[いし]たちも彼[かれ]らを起[お]こすことはない。それゆえ、あなたは彼[かれ]らに災[わざわ]いを下[くだ]し、彼[かれ]らを滅[ほろ]ぼし、彼[かれ]らのすべての男[おとこ]を取[と]り去[さ]られた。"
  15: "彼[かれ]らに災[わざわ]いを加[くわ]えてください。主[しゅ]よ、地[ち]のすべての輝[かがや]かしい者[もの]たちに災[わざわ]いを加えてください。"
  16: "主[しゅ]よ、苦[くる]しみのうちでわたしはあなたを思[おも]い起[お]こした。小[ちい]さな苦[くる]しみのうちに、あなたの懲[こ]らしめがわたしたちにあった。"
  17: "妊婦[にんぷ]が子[こ]を産[う]むときに近[ちか]づき、その産みの苦[くる]しみのゆえに叫[さけ]ぶように、わたしたちはあなたの恐[おそ]れのゆえに、あなたの愛[あい]する者[もの]となった。主[しゅ]よ。"
  18: "わたしたちは身[み]ごもり、苦[くる]しみもだえ、そして産[う]んだ。わたしたちは地[ち]の上[うえ]で、あなたの救[すく]いの霊[れい]を造[つく]った。わたしたちは倒[たお]れない。しかし、地[ち]に住[す]む者[もの]はすべて倒[たお]れる。"
  19: "死[し]んだ者[もの]たちは起[お]き上[あ]がる。墓[はか]のうちにいる者[もの]たちは目[め]を覚[さ]ます。地[ち]のうちにいる者[もの]たちは喜[よろこ]ぶ。あなたから出[で]る露[つゆ]が彼[かれ]らの癒[いや]しとなるからだ。しかし、不敬虔[ふけいけん]な者[もの]の地[ち]は倒[たお]れる。"
  20: "『行[い]け、わたしの民[たみ]よ。あなたの部屋[へや]に入[はい]り、あなたの戸[と]を閉[と]ざし、主[しゅ]の怒[いか]りが過[す]ぎ去[さ]るまで、ほんの少[すこ]しの間[あいだ]、身[み]を隠[かく]せ。』"
  21: "見[み]よ、主[しゅ]は聖[せい]なる所[ところ]から、地[ち]に住[す]む者[もの]たちの上[うえ]に怒[いか]りを下[くだ]される。地[ち]はその血[ち]を現[あらわ]し、殺[ころ]された者[もの]たちを覆[おお]い隠[かく]さない。」"

notes:
  1: "ᾄσονται τὸ ᾆσμα τοῦτο ἐπὶ γῆς Ιουδα λέγοντες — «будут петь песнь сию в земле Иудиной, говоря»: вводная формула вне кавычек, далее до конца главы одна цитата (песнь). ὀχυρά — «крепкий, укреплённый» (слав. «крепок»); σωτήριον — «спасение» (слав. «спасение»); θήσει — будущее, «положит». У МТ и Син. «спасение дал Он вместо стены и вала» — иное чтение, в текст не вносится."
  2: "ἀνοίξατε πύλας — «отворите врата» (императив мн. ч.). φυλάσσων δικαιοσύνην καὶ φυλάσσων ἀλήθειαν — «хранящий правду и хранящий истину»: причастия относятся к λαός, «народ»; повтор φυλάσσων сохранён. Слав. «да внидут людие хранящии правду и хранящии истину»."
  3: "ἀντιλαμβανόμενος ἀληθείας καὶ φυλάσσων εἰρήνην — «принимающий истину и хранящий мир»: продолжение характеристики народа из ст. 2, сказуемого нет. Слав. «приемлющии истину и хранящии мир». По gr «ибо на Тебя уповали» (ὅτι ἐπὶ σοὶ ἤλπισαν) уже начинает ст. 4; у csl эта фраза открывает 26:4 — держимся деления csl."
  4: "ἤλπισαν, κύριε, ἕως τοῦ αἰῶνος — «уповали, Господи, вовеки» (ἐλπίζω); слав. «Яко на тя надеянием надеяшася, Господи, во век» — усилительный оборот передан простым «望みを置いた». ὁ θεὸς ὁ μέγας ὁ αἰώνιος — «Бог великий, вечный», звательная форма в конце стиха. У МТ «Господь Бог есть твердыня вечная» — иное чтение, не вносится."
  5: "ὃς ταπεινώσας κατήγαγες — «Ты, смирив, низвёл»: относительное ὃς при глаголе 2-го лица, по-японски передано личным «あなたは». τοὺς ἐνοικοῦντας ἐν ὑψηλοῖς — «живущих в высоких [местах]» (слав. «живущыя в высоких»). καταβαλεῖς καὶ κατάξεις ἕως ἐδάφους — «низвергнешь и низведёшь до основания» (ἔδαφος — основание, пол)."
  6: "πατήσουσιν αὐτούς — «поперут их»: αὐτούς относится к городам и живущим на высоте. πραέων καὶ ταπεινῶν — «кротких и смиренных» (πραΰς, ταπεινός); слав. «И поперут я ноги кротких и смиренных». У Син. «ноги бедного, стопы нищих» (МТ) — не вносится."
  7: "ὁδὸς εὐσεβῶν εὐθεῖα ἐγένετο — «путь благочестивых стал прямым» (εὐσεβής — благочестивый, слав. «благочестивых»); παρεσκευασμένη — «приготовлен, устроен» (παρασκευάζω). Повтор «путь благочестивых» в LXX сохранён, хотя выглядит как дублет."
  8: "ἡ γὰρ ὁδὸς κυρίου κρίσις — «ибо путь Господень — суд» (κρίσις, слав. «суд»). ἠλπίσαμεν ἐπὶ τῷ ὀνόματί σου καὶ ἐπὶ τῇ μνείᾳ — «мы уповали на имя Твоё и на память [о Тебе]»; относительное ᾗ ἐπιθυμεῖ ἡ ψυχὴ ἡμῶν («которой желает душа наша») по gr открывает ст. 9, у csl стоит в конце 26:8 — держимся csl."
  9: "ἐκ νυκτὸς ὀρθρίζει τὸ πνεῦμά μου πρὸς σέ — «от ночи дух мой встаёт к Тебе» (ὀρθρίζω — вставать рано). φῶς τὰ προστάγματά σου ἐπὶ τῆς γῆς — «свет — повеления Твои на земле» (πρόσταγμα, слав. «повеления»). δικαιοσύνην μάθετε — «правде научитесь», императив мн. ч. к живущим на земле."
  10: "πέπαυται γὰρ ὁ ἀσεβής — «ибо прекратился нечестивый» (παύω; слав. «Преста бо нечестивый»). οὐ μὴ μάθῃ δικαιοσύνην — «не научится правде» (двойное отрицание с μή); ἀλήθειαν οὐ μὴ ποιήσῃ — «истины не сотворит». Слав. сглаживает в общее изречение: «всяк, иже не научится правде на земли, истины не сотворит» — это слав. оборот, передан «義を学ばない者は皆». ἀρθήτω — «да будет взят» (αἴρω), ἵνα μὴ ἴδῃ τὴν δόξαν κυρίου — «чтобы не увидел славы Господней»."
  11: "ὑψηλός σου ὁ βραχίων — «высока мышца Твоя» (βραχίων — рука, мышца; слав. «мышца»). ζῆλος λήμψεται λαὸν ἀπαίδευτον — «ревность охватит народ необученный» (ἀπαίδευτος — невоспитанный, слав. «люди ненаказанныя»); в тексте 熱意. πῦρ τοὺς ὑπεναντίους ἔδεται — «огонь пожрёт противников» (ὑπεναντίος). У Син. иначе («ненавидящие народ Твой») — МТ, держим LXX."
  12: "εἰρήνην δὸς ἡμῖν — «мир дай нам» (δίδωμι, императив). πάντα γὰρ ἀπέδωκας ἡμῖν — «ибо всё Ты воздал нам» (ἀποδίδωμι, слав. «воздал еси»). У Син. «все дела наши Ты устрояешь для нас» (МТ) — не вносится."
  13: "κτῆσαι ἡμᾶς — «приобрети нас» (κτάομαι, слав. «стяжи ны»). ἐκτὸς σοῦ ἄλλον οὐκ οἴδαμεν — «кроме Тебя иного не знаем»; τὸ ὄνομά σου ὀνομάζομεν — «имя Твоё именуем», тавтология сохранена. У Син. «другие владыки кроме Тебя господствовали над нами» (МТ) — иное чтение, в текст не вносится."
  14: "οἱ δὲ νεκροὶ ζωὴν οὐ μὴ ἴδωσιν — «мёртвые жизни не увидят». οὐδὲ ἰατροὶ οὐ μὴ ἀναστήσωσιν — «и врачи не воскресят»: в LXX ἰατροί, вероятно передача евр. רְפָאִים («рефаимы»), отсюда в Син. «рефаимы не встанут»; в тексте 医師 по греческому. ἦρας πᾶν ἄρσεν αὐτῶν — «ты взял всякий мужской пол их» (слав. «взял еси всяк мужеск пол их»)."
  15: "πρόσθες αὐτοῖς κακά — «приложи им зла» (προστίθημι), повтор во второй половине стиха сохранён. τοῖς ἐνδόξοις τῆς γῆς — «славным земли» (ἔνδοξος). У Син. совершенно иное («умножил народ…») — это чтение МТ, в текст не вносится; LXX и слав. здесь совпадают."
  16: "ἐν θλίψει ἐμνήσθην σου — «в скорби я вспомнил Тебя»: 1-е лицо ед. ч. (слав. «помянухом тя» — 1-е лицо мн. ч.; разница отмечена). παιδεία — «наказание, научение» (слав. «наказание»), передано 懲らしめ. У Син. «в бедствии он искал Тебя» (МТ) — не вносится."
  17: "ὡς ἡ ὠδίνουσα ἐγγίζει τοῦ τεκεῖν — «как рождающая приближается родить» (ὠδίνω — мучиться родами). ἐπὶ τῇ ὠδῖνι αὐτῆς ἐκέκραξεν — «в муках своих возопила». οὕτως ἐγενήθημεν τῷ ἀγαπητῷ σου διὰ τὸν φόβον σου — «так мы стали Твоим возлюбленным из страха Твоего» (ἀγαπητός — возлюбленный); слав. «тако быхом возлюбленному твоему» переносит «страха ради твоего» в 26:18, держимся gr."
  18: "ἐν γαστρὶ ἐλάβομεν — «мы зачали»; ὠδινήσαμεν καὶ ἐτέκομεν — «мучились и родили». πνεῦμα σωτηρίας σου ἐποιήσαμεν ἐπὶ τῆς γῆς — «дух спасения Твоего мы сделали на земле»: тёмный оборот, передан буквально. Слав. добавляет «не падемся» (мы не падём), чего в LXX нет; по паритету внесено в основной текст без 〔…〕. У Син. «рождали как бы ветер» — МТ."
  19: "ἀναστήσονται οἱ νεκροί — «восстанут мёртвые»; ἐγερθήσονται οἱ ἐν τοῖς μνημείοις — «пробудятся сущие в гробах» (μνημεῖον, слав. «во гробех»). ἡ γὰρ δρόσος ἡ παρὰ σοῦ ἴαμα αὐτοῖς ἐστιν — «ибо роса от Тебя — исцеление им» (δρόσος — роса, ἴαμα — исцеление). ἡ δὲ γῆ τῶν ἀσεβῶν πεσεῖται — «земля нечестивых падёт»."
  20: "βάδιζε, λαός μου — «иди, народ Мой»: слова Господа внутри песни, поэтому 『…』. εἰς τὰ ταμίειά σου — «во внутренние покои твои» (ταμίειον, слав. «храмину»); слав. «вашу» — мн. ч., в греч. ед. ч. ἀποκρύβηθι μικρὸν ὅσον ὅσον — «укройся на самое малое время» (слав. «мало елико елико»), передано ほんの少しの間."
  21: "ἀπὸ τοῦ ἁγίου — «от святого [места]» (слав. «от святаго (места)»), передано 聖なる所から. ἀνακαλύψει ἡ γῆ τὸ αἷμα αὐτῆς — «земля откроет кровь свою» (ἀνακαλύπτω, слав. «открыет»). οὐ κατακαλύψει τοὺς ἀνῃρημένους — «не покроет убитых» (ἀναιρέω). Конец стиха закрывает цитату всей главы."
