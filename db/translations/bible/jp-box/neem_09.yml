# jp-box, Неемия, глава 9. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz): ezd 19 = Неем 9; контроль — церковнославянский
# (csl-ru), по паритету (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes);
# ru (Синодальный) — только для понимания, не источник. jp-ni в Неемии есть,
# но источником не был.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 9: пост и отделение от иноплеменных (1–3), воззвание левитов (4–5),
# молитва Ездры (6–37): творение, Авраам, Египет и исход, Синай, пустыня,
# дар земли и отступничество, судьи и пророки, нынешнее рабство.
# Речь в 「…」: слова левитов (5) и молитва Ездры (6–37, кавычки открываются
# в 6 и закрываются в 37). Красного нет: говорит человек.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 安息日, 契約, 嗣業 уже в корпусе.
# Паритет: ст. 1 «прах на головах», ст. 3 «четверть дня», ст. 36 «и благая ея»
# (слав.) — в тексте; вариант LXX — в notes.

