verses:
  1: "この月[つき]の第[だい]二十四[にじゅうよ]日[にち]に、イスラエルの子[こ]らは断食[だんじき]をし、粗布[あらぬの]を着[き]て集[あつ]まり、頭[あたま]に土[つち]をかぶっていた。"
  2: "イスラエルの子[こ]らは、すべての異民族[いみんぞく]から身[み]を分[わ]かち、立[た]って、自分[じぶん]の罪[つみ]と父[ちち]たちの不法[ふほう]を告白[こくはく]した。"
  3: "彼[かれ]らは自分[じぶん]の場所[ばしょ]に立[た]ち、一日[いちにち]の四分[しぶん]の一[いち]は、自分[じぶん]の神[かみ]である主[しゅ]の律法[りっぽう]の書[しょ]を読[よ]み、また四分[しぶん]の一[いち]は主[しゅ]に告白[こくはく]し、自分[じぶん]の神[かみ]である主[しゅ]を礼拝[れいはい]した。"
  4: "レビ人[びと]の高台[たかだい]の上[うえ]に、イエシュアとカドミエルの子[こ]ら、サラビヤの子[こ]サハニヤ、ハナニの子[こ]らが立[た]ち、大[おお]きな声[こえ]で自分[じぶん]の神[かみ]である主[しゅ]に叫[さけ]んだ。"
  5: "レビ人[びと]イエシュアとカドミエルは言[い]った。「立[た]ち上[あ]がって、あなたがたの神[かみ]である主[しゅ]を、とこしえからとこしえまでほめたたえよ。あなたの栄光[えいこう]の名[な]はほめたたえられ、すべての賛美[さんび]と称賛[しょうさん]の上[うえ]に高[たか]められる。」"
  6: "エズラは言[い]った。「あなたこそ、ただ独[ひと]りの主[しゅ]である。あなたは天[てん]と、もろもろの天[てん]の天[てん]と、そのすべての軍勢[ぐんぜい]、地[ち]とその上[うえ]のすべてのもの、海[うみ]とその中[なか]のすべてのものを作[つく]られた。あなたはすべてのものに命[いのち]を与[あた]え、もろもろの天[てん]の軍勢[ぐんぜい]もあなたを拝[はい]している。"
  7: "あなたは主[しゅ]なる神[かみ]である。あなたはアブラムを選[えら]び、彼[かれ]をカルデア人[じん]の地[ち]から連[つ]れ出[だ]し、その名[な]をアブラハムとされた。"
  8: "あなたは彼[かれ]の心[こころ]があなたの前[まえ]で誠実[せいじつ]であるのを見[み]て、彼[かれ]と契約[けいやく]を結[むす]び、カナン人[じん]、ヘト人[じん]、アモリ人[じん]、ペリジ人[じん]、エブス人[じん]、ギルガシ人[じん]の地[ち]を彼[かれ]とその子孫[しそん]に与[あた]えると約束[やくそく]された。あなたは義[ただ]しい方[かた]であるので、その言葉[ことば]を果[は]たされた。"
  9: "あなたはエジプトで私たちの父[ちち]たちの苦[くる]しみを見[み]、紅海[こうかい]のほとりで彼[かれ]らの叫[さけ]びを聞[き]かれた。"
  10: "あなたはファラオとそのすべての僕[しもべ]、またその地[ち]のすべての民[たみ]の上[うえ]に、しるしと奇跡[きせき]を行[おこな]われた。エジプト人[じん]たちが彼[かれ]らに対して高[たか]ぶっていることを、あなたは知[し]っておられたからである。そして、あなたは今日[きょう]に至[いた]るまで、ご自分[じぶん]のために名[な]を立[た]てられた。"
  11: "あなたは彼[かれ]らの前[まえ]で海[うみ]を裂[さ]き、彼[かれ]らは海[うみ]の中[なか]を乾[かわ]いた地[ち]のように通[とお]った。あなたは彼[かれ]らを追[お]った者[もの]たちを、激[はげ]しい水[みず]の中[なか]の石[いし]のように深[ふか]みに投[な]げ込[こ]まれた。"
  12: "あなたは昼[ひる]は雲[くも]の柱[はしら]で、夜[よる]は火[ひ]の柱[はしら]で彼[かれ]らを導[みちび]き、彼[かれ]らが歩[あゆ]むべき道[みち]を照[て]らされた。"
  13: "あなたはシナイ山[やま]に下[くだ]り、天[てん]から彼[かれ]らに語[かた]り、正[ただ]しい裁[さば]きと真理[しんり]の律法[りっぽう]、良[よ]い掟[おきて]と戒[いまし]めを与[あた]えられた。"
  14: "あなたはご自分[じぶん]の聖[せい]なる安息日[あんそくび]を彼[かれ]らに知[し]らせ、しもべモーセの手[て]によって、戒[いまし]めと掟[おきて]と律法[りっぽう]を彼[かれ]らに命[めい]じられた。"
  15: "あなたは飢[う]えに応[こた]えて天[てん]からパンを与[あた]え、渇[かわ]きに応[こた]えて岩[いわ]から水[みず]を出[だ]して彼[かれ]らに与[あた]えられた。また、あなたが手[て]を伸[の]べて彼[かれ]らに与[あた]えようとされた地[ち]に入[はい]って、それを嗣業[しぎょう]として受[う]け継[つ]ぐように、彼[かれ]らに言[い]われた。"
  16: "しかし、彼[かれ]らも私たちの父[ちち]たちも高[たか]ぶり、うなじを固[かた]くして、あなたの戒[いまし]めに聞[き]き従[したが]わなかった。"
  17: "彼[かれ]らは聞[き]くことを拒[こば]み、あなたが彼[かれ]らの間[あいだ]で行[おこな]われた不思議[ふしぎ]を忘[わす]れ、うなじを固[かた]くして、エジプトでの自分[じぶん]たちの奴隷[どれい]の状態[じょうたい]に戻[もど]ろうとする者[もの]を自分[じぶん]たちの上[うえ]に立[た]てた。しかし、あなたはあわれみに満[み]ちた神[かみ]、あわれみ深[ふか]く、怒[いか]りをおそくし、いつくしみに富[と]み、彼[かれ]らを見捨[みす]てられなかった。"
  18: "それでも彼[かれ]らは自分[じぶん]たちのために鋳物[いもの]の子牛[こうし]を作[つく]り、『これがあなたをエジプトから連[つ]れ上[のぼ]った神々[かみがみ]だ』と言[い]って、大[おお]きな怒[いか]りを引[ひ]き起[お]こした。"
  19: "しかし、あなたは多[おお]くのあわれみのうちに、彼[かれ]らを荒野[こうや]に見捨[みす]てられなかった。昼[ひる]は道[みち]を導[みちび]く雲[くも]の柱[はしら]を、夜[よる]は道[みち]を照[て]らす火[ひ]の柱[はしら]を、彼[かれ]らから遠[とお]ざけられなかった。"
  20: "あなたは彼[かれ]らを教[おし]えるために、ご自分[じぶん]の良[よ]い霊[れい]を与[あた]え、マナを彼[かれ]らの口[くち]から取[と]り去[さ]らず、渇[かわ]きに水[みず]を与[あた]えられた。"
  21: "あなたは荒野[こうや]で四十[よんじゅう]年[ねん]の間[あいだ]彼[かれ]らを養[やしな]い、彼[かれ]らには何[なに]も欠[か]けるものがなかった。着物[きもの]は古[ふる]びず、足[あし]は腫[は]れなかった。"
  22: "あなたは彼[かれ]らに王国[おうこく]ともろもろの民[たみ]を与[あた]えて分[わ]け与[あた]え、彼[かれ]らはヘシュボンの王[おう]シホンの地[ち]と、バシャンの王[おう]オグの地[ち]を嗣業[しぎょう]として受[う]け継[つ]いだ。"
  23: "あなたは彼[かれ]らの子[こ]らを天[てん]の星[ほし]のように増[ふ]やし、彼[かれ]らに約束[やくそく]された地[ち]に彼[かれ]らを導[みちび]き入[い]れ、彼[かれ]らはそれを嗣業[しぎょう]として受[う]け継[つ]いだ。"
  24: "あなたは彼[かれ]らの前[まえ]で、その地[ち]に住[す]むカナン人[じん]を打[う]ち滅[ほろ]ぼし、彼[かれ]らとその王[おう]たち、その地[ち]のもろもろの民[たみ]を彼[かれ]らの手[て]に渡[わた]して、彼[かれ]らの意[い]のままに彼[かれ]らを扱[あつか]わせた。"
  25: "彼[かれ]らは堅固[けんご]な町[まち]々[まち]と肥[こ]えた地[ち]を取[と]り、すべていいもので満[み]ちた家[いえ]々[いえ]、掘[ほ]り抜[ぬ]かれた貯[た]め池[いけ]、ぶどう畑[ばたけ]、オリーブ畑[ばたけ]、食[た]べ物[もの]のなる木[き]を多[おお]く受[う]け継[つ]いだ。彼[かれ]らは食[た]べ、満[み]ち足[た]り、肥[こ]え、あなたの大[おお]きな恵[めぐ]みによって楽[たの]しんだ。"
  26: "しかし彼[かれ]らは背[そむ]き、あなたから離[はな]れて、あなたの律法[りっぽう]を自分[じぶん]たちの背中[せなか]の後[うし]ろに投[な]げ捨[す]て、あなたの預言者[よげんしゃ]たちを殺[ころ]した。預言者[よげんしゃ]たちは、彼[かれ]らをあなたのもとへ連[つ]れ戻[もど]そうと彼[かれ]らを戒[いまし]めていたのである。そして、彼[かれ]らは大[おお]きな怒[いか]りを引[ひ]き起[お]こした。"
  27: "あなたは彼[かれ]らを、彼[かれ]らを苦[くる]しめる者[もの]たちの手[て]に渡[わた]された。彼[かれ]らは彼[かれ]らを苦[くる]しめた。そこで彼[かれ]らは苦難[くなん]の時[とき]にあなたに叫[さけ]び、あなたは天[てん]から聞[き]いて、大[おお]きなあわれみのうちに彼[かれ]らに救[すく]い主[ぬし]たちを与[あた]え、彼[かれ]らを苦[くる]しめる者[もの]たちの手[て]から救[すく]われた。"
  28: "しかし、彼[かれ]らは安[やす]らかになると、またあなたの前[まえ]で悪[あく]を行[おこな]うことに戻[もど]った。そこで、あなたは彼[かれ]らを敵[てき]の手[て]に残[のこ]し、敵[てき]が彼[かれ]らを支配[しはい]した。彼[かれ]らが再[ふたた]びあなたに叫[さけ]ぶと、あなたは天[てん]から聞[き]いて、多[おお]くのあわれみによって彼[かれ]らを救[すく]い出[だ]された。"
  29: "あなたは彼[かれ]らに、あなたの律法[りっぽう]に戻[もど]るようにと戒[いまし]めたが、彼[かれ]らは聞[き]かなかった。確[たし]かに、これを行[おこな]う人[ひと]はそれによって生[い]きる、というあなたの戒[いまし]めと裁[さば]きに、彼[かれ]らは罪[つみ]を犯[おか]した。彼[かれ]らは反抗[はんこう]する背中[せなか]を向[む]け、うなじを固[かた]くして聞[き]かなかった。"
  30: "あなたは多[おお]くの年[とし]の間[あいだ]彼[かれ]らを忍[しの]び、あなたの霊[れい]によって、あなたの預言者[よげんしゃ]たちの手[て]を通[とお]して彼[かれ]らを戒[いまし]めたが、彼[かれ]らは耳[みみ]を傾[かたむ]けなかった。あなたは彼[かれ]らをその地[ち]のもろもろの民[たみ]の手[て]に渡[わた]された。"
  31: "しかし、あなたは多[おお]くのあわれみのうちに、彼[かれ]らを絶[た]ち滅[ほろ]ぼし尽[つ]くすことをされず、見捨[みす]てられなかった。あなたは強[つよ]く、あわれみ深[ふか]く、情[なさ]け深[ぶか]い方[かた]だからである。"
  32: "今[いま]、私たちの神[かみ]、強[つよ]く、大[おお]いなる、力[ちから]ある、畏[おそ]るべき神[かみ]、あなたの契約[けいやく]とあわれみを守[まも]る方[かた]よ。アッシリアの王[おう]たちの日[ひ]からこの日[ひ]まで、私たちと私たちの王[おう]たち、長[かしら]たち、祭司[さいし]たち、預言者[よげんしゃ]たち、父[ちち]たち、あなたの民[たみ]すべてに及[およ]んだすべての苦労[くろう]を、あなたの前[まえ]で小[ちい]さく思[おも]われないでください。"
  33: "あなたは、私たちに降[ふ]りかかったすべてのことにおいて義[ただ]しくあられました。あなたは真実[しんじつ]を行[おこな]われ、私たちは罪[つみ]を犯[おか]したのです。"
  34: "私たちの王[おう]たち、長[かしら]たち、祭司[さいし]たち、父[ちち]たちは、あなたの律法[りっぽう]を行[おこな]わず、あなたの戒[いまし]めと、あなたが彼[かれ]らに戒[いまし]めた証[あかし]とに心[こころ]を留[と]めなかった。"
  35: "彼[かれ]らは、あなたの王国[おうこく]のうちで、あなたが彼[かれ]らに与[あた]えた多[おお]くの恵[めぐ]みのうちで、またあなたが彼[かれ]らの前[まえ]に与[あた]えた広[ひろ]く肥[こ]えた地[ち]の上[うえ]で、あなたに仕[つか]えず、悪[あく]い行[おこな]いから離[はな]れなかった。"
  36: "見[み]よ、私たちは今日[きょう]、奴隷[どれい]です。あなたが私たちの父[ちち]たちに、その実[み]と良[よ]いものとを食[た]べるために与[あた]えた地[ち]の上[うえ]で、見[み]よ、私たちは奴隷[どれい]となっています。"
  37: "その地[ち]は、あなたが私たちの罪[つみ]のゆえに私たちの上[うえ]に立[た]てられた王[おう]たちに、多[おお]くの産物[さんぶつ]をもたらしています。彼[かれ]らは私たちの体[からだ]と家畜[かちく]を意[い]のままに支配[しはい]し、私たちは大[おお]きな苦[くる]しみの中[なか]にいる。」"

notes:
  1: "ἐν νηστείᾳ καὶ ἐν σάκκοις — в посте и вретищах (σάκκος, 粗布). Слав. добавляет «и персть на главах их» (прах на головах) — в гр. нет, по паритету в тексте 頭に土. ἐν ἡμέρᾳ εἰκοστῇ καὶ τετάρτῃ τοῦ μηνὸς τούτου — в двадцать четвёртый день этого месяца."
  2: "ἐχωρίσθησαν … ἀπὸ παντὸς υἱοῦ ἀλλοτρίου — отделились от всякого чужого сына, т.е. от иноплеменных (ἀλλότριος). ἐξηγόρευσαν τὰς ἁμαρτίας αὐτῶν — исповедали, «выговорили» грехи свои (ἐξαγορεύω). ἀνομίαι τῶν πατέρων — беззакония отцов."
  3: "ἀνέγνωσαν ἐν βιβλίῳ νόμου — читали в книге закона. ἦσαν ἐξαγορεύοντες τῷ κυρίῳ — исповедовались Господу. Слав. добавляет «четверицею в день» (по МТ: четверть дня) — в гр. этого нет, по паритету в тексте 一日の四分の一; отсюда двойное «四分の一» в переводе."
  4: "ἐπὶ ἀναβάσει τῶν Λευιτῶν — на возвышении (ступенях) левитов (ἀνάβασις); 高台. Ἰησοῦς καὶ υἱοὶ Καδμιηλ — Иешуа и сыны Кадмиила; Σαχανια υἱὸς Σαραβια — Захания, сын Шеревии (サハニヤ, サラビヤ); υἱοὶ Χανανι — сыны Ханани. В ru список полнее (Вания, Вунний, Шеревия и др.) — это масоретское чтение, в гр. его нет."
  5: "Ἀνάστητε εὐλογεῖτε — встаньте, благословляйте. ἀπὸ τοῦ αἰῶνος καὶ ἕως τοῦ αἰῶνος — от века и до века. Гр. меняет лицо: εὐλογήσουσιν … ὑψώσουσιν (3-е л. мн., «будут благословлять»), слав. «благословят… вознесут»; в переводе — страдательная конструкция, чтобы сохранить смысл и избежать сбоя лица. ὄνομα δόξης σου — имя славы Твоей."
  6: "Σὺ εἶ αὐτὸς κύριος μόνος — Ты еси Сам Господь един. τὸν οὐρανὸν τοῦ οὐρανοῦ — небо небес. πᾶσαν τὴν στάσιν αὐτῶν — весь строй (воинство) их (στάσις). ζωοποιεῖς τὰ πάντα — животворишь всё. αἱ στρατιαὶ τῶν οὐρανῶν — воинства небесные."
  7: "σὺ ἐξελέξω ἐν Αβραμ — «Ты избрал в Авраме» (ἐν с дат. при ἐκλέγομαι); слав. «избрал еси аврама». ἐκ τῆς χώρας τῶν Χαλδαίων — из земли Халдейской; カルデア人の地. ἐπέθηκας αὐτῷ ὄνομα Αβρααμ — положил ему имя Авраам."
  8: "εὗρες τὴν καρδίαν αὐτοῦ πιστήν — нашёл сердце его верным. διέθου πρὸς αὐτὸν διαθήκην — заключил с ним завет. Перечень народов: Χαναναῖοι, Χετταῖοι, Αμορραῖοι, Φερεζαῖοι, Ιεβουσαῖοι, Γεργεσαῖοι — カナン人, ヘト人, アモリ人, ペリジ人, エブス人, ギルガシ人. ἔστησας τοὺς λόγους σου — поставил, исполнил слова Свои. ὅτι δίκαιος σὺ — ибо Ты праведен."
  9: "τὴν ταπείνωσιν — уничижение, бедствие (ταπείνωσις). τὴν κραυγὴν αὐτῶν — вопль их. ἐπὶ θάλασσαν ἐρυθράν — у моря Чермного; 紅海."
  10: "σημεῖα καὶ τέρατα — знамения и чудеса. ἐν Φαραω καὶ ἐν πᾶσιν τοῖς παισὶν αὐτοῦ — на фараоне и на всех рабах его. ὅτι ἔγνως ὅτι ὑπερηφάνησαν ἐπ᾽ αὐτούς — ибо Ты знал, что они надменно поступили с ними (ὑπερηφανέω). ἐποίησας σεαυτῷ ὄνομα — сделал Себе имя."
  11: "ἔρρηξας — рассек (ῥήγνυμι). ἐν ξηρασίᾳ — по суше (ξηρασία). εἰς βυθὸν ὡσεὶ λίθον ἐν ὕδατι σφοδρῷ — в глубину, как камень в воде сильной (βυθός, σφοδρός)."
  12: "ἐν στύλῳ νεφέλης — в столпе облачном (στῦλος, νεφέλη). ἐν στύλῳ πυρός — в столпе огненном. τοῦ φωτίσαι αὐτοῖς τὴν ὁδόν — чтобы освещать им путь."
  13: "κατέβης — сошёл. ἐλάλησας … ἐξ οὐρανοῦ — говорил с неба. κρίματα εὐθέα — суды прямые (εὐθύς). νόμους ἀληθείας — законы истины. προστάγματα καὶ ἐντολὰς ἀγαθάς — повеления и заповеди добрые."
  14: "τὸ σάββατόν σου τὸ ἅγιον ἐγνώρισας — святую субботу Твою дал знать (γνωρίζω). ἐν χειρὶ Μωυσῆ δούλου σου — рукою Моисея, раба Твоего."
  15: "ἄρτον ἐξ οὐρανοῦ … εἰς σιτοδείαν αὐτῶν — хлеб с неба в голод их (σιτοδεία). ὕδωρ ἐκ πέτρας … εἰς δίψαν αὐτῶν — воду из камня в жажду их. ἐφ᾽ ἣν ἐξέτεινας τὴν χεῖρά σου — на которую Ты простёр руку Твою, т.е. клялся дать."
  16: "ὑπερηφανεύσαντο — возгордились. ἐσκλήρυναν τὸν τράχηλον — ожесточили шею (σκληρύνω, τράχηλος); うなじを固くする. οὐκ ἤκουσαν τῶν ἐντολῶν — не послушали заповедей."
  17: "ἀνένευσαν τοῦ εἰσακοῦσαι — отказались слушать (ἀνανεύω). οὐκ ἐμνήσθησαν τῶν θαυμασίων — не вспомнили чудес. ἔδωκαν ἀρχὴν ἐπιστρέψαι — дали начало (вождя) возвратиться (ἀρχή здесь «начальник»); слав. «даша начало возвратитися». μακρόθυμος καὶ πολυέλεος — долготерпеливый и многомилостивый."
  18: "μόσχον χωνευτόν — тельца литого (χωνευτός). Οὗτοι οἱ θεοὶ οἱ ἐξαγαγόντες ἡμᾶς — «вот боги, выведшие нас». παροργισμοὺς μεγάλους — великие раздражения (παροργισμός), т.е. поводы к гневу."
  19: "ἐν οἰκτιρμοῖς σου τοῖς πολλοῖς — по множеству щедрот Твоих. τὸν στῦλον τῆς νεφέλης οὐκ ἐξέκλινας — столпа облачного не уклонил (ἐκκλίνω). τοῦ φωτίζειν — освещать."
  20: "τὸ πνεῦμά σου τὸ ἀγαθὸν ἔδωκας συνετίσαι αὐτούς — Духа Твоего благого дал, чтобы вразумить их. τὸ μαννα — манна. οὐκ ἀφυστέρησας ἀπὸ στόματος αὐτῶν — не лишил уст их (ἀφυστερέω)."
  21: "διέθρεψας — питал, кормил (διατρέφω). οὐχ ὑστέρησαν — не имели недостатка (ὑστερέω). ἱμάτια οὐκ ἐπαλαιώθησαν — одежды не обветшали (παλαιόω). πόδες οὐ διερράγησαν — ноги не распухли, не растёрлись (διαρρήγνυμι); слав. «не раздрашася», ru «не пухли»."
  22: "ἔδωκας αὐτοῖς βασιλείας καὶ λαούς — дал им царства и народы. τὴν γῆν Σηων βασιλέως Εσεβων — землю Сигона, царя Есевонского (Σηων, シホン; слав. «сиона» — иное чтение). τὴν γῆν Ωγ βασιλέως τοῦ Βασαν — землю Ога, царя Васанского (バシャン)."
  23: "ἐπλήθυνας ὡς τοὺς ἀστέρας τοῦ οὐρανοῦ — умножил, как звёзды небесные. εἰσήγαγες — ввёл. ἣν εἶπας τοῖς πατράσιν αὐτῶν — которую обещал отцам их."
  24: "ἐξέτριψας — истребил, сокрушил (ἐκτρίβω). τοὺς κατοικοῦντας τὴν γῆν τῶν Χαναναίων — жителей земли Ханаанской. ποιῆσαι αὐτοῖς ὡς ἀρεστὸν ἐνώπιον αὐτῶν — поступить с ними, как угодно пред ними. В слав. перед стихом стоит в скобках «(и внидоша сынове их)» — редакторская вставка, не переведена."
  25: "κατελάβοσαν πόλεις ὑψηλάς — овладели высокими (укреплёнными) городами. λάκκους λελατομημένους — водоёмы, иссечённые в камне (λατομέω). ἐνεπλήσθησαν — насытились. ἐλιπάνθησαν — утучнели (λιπαίνω). ἐτρύφησαν — наслаждались (τρυφάω)."
  26: "ἤλλαξαν — изменились. ἔρριψαν τὸν νόμον σου ὀπίσω σώματος αὐτῶν — бросили закон Твой за спину свою (ὀπίσω σώματος). ἀπέκτειναν τοὺς προφήτας — убили пророков. διεμαρτύραντο — свидетельствовали, увещевали (διαμαρτύρομαι)."
  27: "ἐν χειρὶ θλιβόντων — в руку теснящих (θλίβω). ἀνεβόησαν — возопили. ἐν οἰκτιρμοῖς τοῖς μεγάλοις — по великой милости. σωτῆρας — спасителей, т.е. судей (σωτήρ); 救い主たち. ἐκ χειρὸς θλιβόντων — из руки теснящих."
  28: "ὡς ἀνεπαύσαντο — когда успокоились (ἀναπαύω). ἐπέστρεψαν ποιῆσαι τὸ πονηρόν — возвратились делать злое. ἐγκατέλιπες — оставил. κατῆρξαν ἐν αὐτοῖς — начальствовали над ними (κατάρχω). ἐρρύσω — избавил (ῥύομαι)."
  29: "ἐπεμαρτύρω — свидетельствовал, увещевал (ἐπιμαρτύρομαι). ἃ ποιήσας αὐτὰ ἄνθρωπος ζήσεται ἐν αὐτοῖς — которые исполняя, человек жив будет в них (ср. Лев 18:5). ἔδωκαν νῶτον ἀπειθοῦντα — дали спину непокорную (νῶτον). ἐσκλήρυναν τράχηλον — ожесточили шею."
  30: "εἵλκυσας ἐπ᾽ αὐτοὺς ἔτη πολλά — «тянул на них многие годы», т.е. долготерпел (ἕλκω). ἐπεμαρτύρω ἐν πνεύματί σου ἐν χειρὶ προφητῶν — увещевал Духом Твоим через пророков. οὐκ ἠνωτίασαντο — не вняли (ἐνωτίζομαι, «склонить ухо»). ἐν χειρὶ λαῶν τῆς γῆς — в руку народов земли."
  31: "οὐκ ἐποίησας αὐτοὺς συντέλειαν — не сделал их концом, не истребил до конца (συντέλεια). ἰσχυρὸς … ἐλεήμων καὶ οἰκτίρμων — сильный, милостивый и щедрый."
  32: "ὁ ἰσχυρὸς ὁ μέγας ὁ κραταιὸς καὶ ὁ φοβερός — сильный, великий, державный и страшный. φυλάσσων τὴν διαθήκην σου καὶ τὸ ἔλεός σου — хранящий завет Твой и милость Твою. μὴ ὀλιγωθήτω ἐνώπιόν σου πᾶς ὁ μόχθος — да не будет малым пред Тобою всякий труд (ὀλιγωθέω, μόχθος). ὃς εὗρεν ἡμᾶς — который постиг нас. ἀπὸ ἡμερῶν βασιλέων Ασσουρ — от дней царей Ассирийских."
  33: "δίκαιος ἐπὶ πᾶσι τοῖς ἐρχομένοις ἐφ᾽ ἡμᾶς — праведен во всём, что приходит на нас. ἀλήθειαν ἐποίησας — истину сотворил. ἐξημάρτομεν — мы согрешили."
  34: "οὐ προσέσχον τῶν ἐντολῶν — не внимали заповедям (προσέχω). τὰ μαρτύριά σου — свидетельства Твои. ἃ διεμαρτύρω αὐτοῖς — которыми Ты увещевал их."
  35: "ἐν βασιλείᾳ σου — в царстве Твоём (или «в своём царстве» — гр. двусмысленно). ἀγαθωσύνη — благость. γῆ πλατεῖα καὶ λιπαρά — земля обширная и тучная. οὐκ ἀπέστρεψαν ἀπὸ ἐπιτηδευμάτων — не обратились от занятий (ἐπιτήδευμα)."
  36: "ἰδού ἐσμεν σήμερον δοῦλοι — вот, мы сегодня рабы. Слав. добавляет «и благая ея» (и благая её) — в гр. только «есть плод её»; по паритету в тексте 良いもの. Стих обрывается на полуслове, продолжение — в 37."
  37: "τοῖς βασιλεῦσιν, οἷς ἔδωκας ἐφ᾽ ἡμᾶς ἐν ἁμαρτίαις ἡμῶν — царям, которых Ты дал над нами за грехи наши. ἐπὶ τὰ σώματα ἡμῶν ἐξουσιάζουσιν — властвуют над телами нашими (ἐξουσιάζω). ὡς ἀρεστὸν αὐτοῖς — как угодно им. ἐν θλίψει μεγάλῃ ἐσμέν — в скорби великой мы. Здесь закрываются кавычки молитвы."
