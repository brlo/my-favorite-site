chapter: 5
draft: true

verses:
  1: "イスラエルのすべての部族[ぶぞく]がヘブロンのダビデのもとへ来[き]て言[い]った。「ごらんなさい。わたしたちはあなたの骨[ほね]と肉[にく]です。"
  2: "昨日[きのう]も一昨日[おととい]も、サウルがわたしたちの王[おう]であったとき、イスラエルを導[みちび]き出[だ]し、導き入[い]れていたのはあなたでした。主[しゅ]はあなたに『あなたはわたしの民[たみ]イスラエルを牧[まき]し、わたしの民イスラエルの指導者[しどうしゃ]となる』と言[い]われました。」"
  3: "イスラエルの長老[ちょうろう]たちはみな、ヘブロンの王[おう]のもとへ来[き]た。王[おう]ダビデはヘブロンで、主[しゅ]の前[まえ]で彼らと契約[けいやく]を結[むす]んだ。彼らはダビデに油[あぶら]を注[そそ]いで、イスラエルすべての王とした。"
  4: "ダビデは三十歳[さんじゅっさい]で王[おう]となり、四十年[よんじゅうねん]の間[あいだ]王であった。"
  5: "ヘブロンで七年[ななねん]六[ろく]か月[げつ]、ユダの王[おう]として、エルサレムで三十三年[さんじゅうさんねん]、イスラエルとユダのすべての王として治[おさ]めた。"
  6: "ダビデとその人[ひと]々[びと]は、その地[ち]に住[す]むエブス人[じん]のもとへ、エルサレムへ向[む]かった。するとダビデに告[つ]げられた。「ここには入[はい]るな。盲人[もうじん]と足[あし]の不自由[ふじゅう]な者[もの]が『ダビデはここへは入らない』と言[い]って立[た]ちはだかっているのだ。」"
  7: "しかしダビデはシオンの砦[とりで]を取[と]った。これがダビデの町[まち]である。"
  8: "その日[ひ]、ダビデは言[い]った。「エブス人を討[う]つ者[もの]は、剣[つるぎ]をもって、足[あし]の不自由な者と盲人[もうじん]、ダビデの命[いのち]を憎[にく]む者[もの]たちに触[ふ]れよ。」それゆえ、「盲人と足の不自由な者は主[しゅ]の家[いえ]に入[はい]らない」と言[い]われる。"
  9: "ダビデはその砦[とりで]に住[す]み、そこはダビデの町[まち]と呼[よ]ばれた。彼は町をぐるりと、すなわち町の端[はし]から建[た]て、また自分[じぶん]の家[いえ]も建てた。"
  10: "ダビデはますます進[すす]み、大[おお]きくなっていった。全能者[ぜんのうしゃ]である主[しゅ]が彼とともにあった。"
  11: "ティルスの王[おう]ヒラムは、ダビデに使者[ししゃ]たちと杉[すぎ]の木[き]と、木工[もくこう]たちと石工[せっこう]たちを遣[つか]わした。彼らはダビデのために家[いえ]を建[た]てた。"
  12: "ダビデは、主[しゅ]が自分[じぶん]をイスラエルの王[おう]として備[そな]えられたこと、またご自分の民[たみ]イスラエルのためにその王国[おうこく]を高[たか]められたことを悟[さと]った。"
  13: "ダビデはヘブロンから来[き]た後[あと]、エルサレムでさらに妻[つま]たちと側女[そばめ]たちを迎[むか]え、さらに息子[むすこ]たちと娘[むすめ]たちが生[う]まれた。"
  14: "エルサレムで彼に生[う]まれた者[もの]たちの名[な]は次[つぎ]のとおりである。サムス、ソバブ、ナタン、ソロモン、"
  15: "エベア、エリシュス、ナフェク、イフィエス、"
  16: "エリサマ、エリダエ、エリファラト、サマエ、イェシバト、ナタン、ガラマアン、イエバアル、テエスス、エルファラト、ナゲド、ナフェク、ヤナタ、レアサミス、バアリマト、エリファラト。"
  17: "ペリシテ人[じん]は、ダビデがイスラエルの王[おう]として油[あぶら]を注[そそ]がれたと聞[き]いて、ダビデを求[もと]めて上[のぼ]って来[き]た。ダビデはそれを聞いて、砦[とりで]へ下[お]りた。"
  18: "ペリシテ人は来[き]て、巨人[きょじん]たちの谷[たに]に集[あつ]まった。"
  19: "ダビデは主[しゅ]に問[と]いかけて言[い]った。「ペリシテ人[じん]のところへ上[のぼ]るべきでしょうか。あなたは彼らをわたしの手[て]に渡[わた]してくださいますか。」主[しゅ]はダビデに言[い]われた。「上[のぼ]れ。わたしは必[かなら]ずペリシテ人をあなたの手に渡す。」"
  20: "ダビデは上[うえ]の破[やぶ]れから来[き]て、そこでペリシテ人を討[う]った。ダビデは言[い]った。「主[しゅ]は水[みず]が破[やぶ]れるように、わたしの前[まえ]でわたしの敵[てき]であるペリシテ人を破[やぶ]られた。」それゆえ、その場所[ばしょ]の名[な]は上の破れと呼[よ]ばれた。"
  21: "ペリシテ人はそこに自分[じぶん]たちの神々[かみがみ]を捨[す]てておいた。ダビデと、彼とともにいた人[ひと]々[びと]はそれらを取[と]った。"
  22: "ペリシテ人は再[ふたた]び上[のぼ]って来[き]て、巨人[きょじん]たちの谷[たに]に集[あつ]まった。"
  23: "ダビデは主[しゅ]に問[と]って言[い]った。「ペリシテ人[じん]のところへ上[のぼ]るべきでしょうか。あなたは彼らをわたしの手[て]に渡[わた]してくださいますか。」主[しゅ]は彼に言[い]われた。「彼らに会[あ]いに出[で]てはならない。彼らから離[はな]れて回[まわ]り込[こ]み、泣[な]きの森[もり]のそばで彼らに迫[せま]れ。"
  24: "泣[な]きの森[もり]の梢[こずえ]で、行[ゆ]く軍[ぐん]の音[おと]を聞[き]いたなら、そのとき彼らに向[む]かって下[お]りよ。主[しゅ]があなたの前[まえ]に出[で]て、ペリシテ人[じん]の軍を討[う]たれるからである。」"
  25: "ダビデは主[しゅ]が命[めい]じたとおりに行[おこな]い、ガバオンからガゼルの地[ち]に至[いた]るまでペリシテ人を討[う]った。"

notes:
  1: "φυλαί — племена, колена (部族). παραγίνονται — приходят (настоящее историческое). ὀστᾶ σου καὶ σάρκες σου — кости твои и плоть твоя: формула родства (ср. Быт 2:23; 29:14)."
  2: "ἐχθὲς καὶ τρίτην — «вчера и третьего дня», т.е. прежде, до сих пор. ὁ ἐξάγων καὶ εἰσάγων — выводящий и вводящий, т.е. вождь на войне и в мире. ποιμανεῖς — будешь пасти (ποιμαίνω). ἡγούμενος — вождь, предводитель. Слав. добавляет «моим» во второй половине («людем моим израилю») — в гр. ἐπὶ τὸν Ισραηλ; внесено. Слова Господа внутри речи — 『…』."
  3: "πρεσβύτεροι — старейшины. διέθετο … διαθήκην — заключил завет (διατίθημι с διαθήκη). χρίουσιν εἰς βασιλέα — помазали в царя (χρίω); слав. «на царство»."
  4: "υἱὸς τριάκοντα ἐτῶν — «сын тридцати лет», т.е. тридцатилетний (семитский оборот). ἐν τῷ βασιλεῦσαι αὐτόν — когда воцарился. ἐβασίλευσεν — царствовал."
  5: "ἑπτὰ ἔτη καὶ ἓξ μῆνας — семь лет и шесть месяцев. ἐπὶ τὸν Ιουδαν — над Иудой. τριάκοντα τρία ἔτη — тридцать три года."
  6: "ἀπῆλθεν … πρὸς τὸν Ιεβουσαῖον — пошёл к иевусею, т.е. против жителей Иевуса (エブス人, как в корпусе). ἐρρέθη τῷ Δαυιδ — «было сказано Давиду» (пассив). ἀντέστησαν — восстали, встали навстречу (ἀνθίστημι). τυφλοὶ καὶ χωλοί — слепые и хромые: насмешка, будто даже калеки отгонят Давида."
  7: "κατελάβετο — взял, овладел (καταλαμβάνω). περιοχή — укреплённое место, крепость (слав. «крепость»); в квадратных скобках издания стоит пояснение «это город Давида», в базе оно есть и переведено."
  8: "ἁπτέσθω ἐν παραξιφίδι — «пусть коснётся кинжалом» (παραξιφίς — кинжал у бедра), слав. «да касается мечем» (剣). Место тёмное: в МТ צִנּוֹר (водосток, жёлоб), отсюда расхождения переводов. μισοῦντας τὴν ψυχήν — ненавидящих душу Давида. Поговорка о слепых и хромых — без кавычек, это не речь."
  9: "ἐκάθισεν — сел, поселился. ἄκρα — акрополь, кремль; слав. «краеградие» (букв. «край города»); в МТ מִלּוֹא (Милло). Держимся слав.: «от края города»."
  10: "πορευόμενος καὶ μεγαλυνόμενος — шествуя и возвышаясь (μεγαλύνω), т.е. возрастал. κύριος παντοκράτωρ — Господь Вседержитель (全能者, как в корпусе)."
  11: "Χιραμ βασιλεὺς Τύρου — Хирам, царь Тирский (ヒラム, ティルス). ξύλα κέδρινα — кедровые деревья (杉). τέκτονες ξύλων / λίθων — плотники и каменщики (木工, 石工)."
  12: "ἡτοίμασεν — приготовил, утвердил (ἑτοιμάζω). ἐπήρθη — был возвышен (ἐπαίρω). διὰ τὸν λαὸν αὐτοῦ Ισραηλ — ради народа Его, Израиля."
  13: "παλλακαί — наложницы (側女). μετὰ τὸ ἐλθεῖν αὐτὸν ἐκ Χεβρων — после прихода его из Хеврона. ἐγένοντο … υἱοὶ καὶ θυγατέρες — родились сыновья и дочери."
  14: "Σαμμους, Σωβαβ, Ναθαν, Σαλωμων — Самус, Совав, Нафан, Соломон. ナタン и ソロモン — по корпусу, サムス и ソバブ — транслитерация с гр. (слав. самус, совав)."
  15: "Εβεαρ, Ελισους, Ναφεκ, Ιεφιες — Евеар, Елисус, Нафек, Иефий; слав. евеар, елисуе, нафек, иефие — та же четвёрка имён."
  16: "Список рождённых в Иерусалиме: Ελισαμα, Ελιδαε, Ελιφαλαθ, Σαμαε, Ιεσσιβαθ, Ναθαν, Γαλαμααν, Ιεβααρ, Θεησους, Ελφαλατ, Ναγεδ, Ναφεκ, Ιαναθα, Λεασαμυς, Βααλιμαθ, Ελιφαλαθ. В гр. и слав. 16 имён, в МТ — 11: список расширен, Ελιφαλαθ повторяется дважды (у слав. «елифалаф» и «елифааф»). Транслитерация с гр.; слав. разночтения — феисус (Θεησους), ианафан (Ιαναθα)."
  17: "ἀλλόφυλοι — иноплеменники, т.е. филистимляне (ペリシテ人 по всему корпусу). κέχρισται — помазан (перфект χρίω). περιοχή — крепость."
  18: "κοιλὰς τῶν τιτάνων — долина титанов, т.е. рефаимов (в МТ עֵמֶק רְפָאִים); слав. «юдоль титанская», Синод. «долина Рефаим». συνέπεσαν — сошлись, расположились (συμπίπτω)."
  19: "διὰ κυρίου — через Господа, т.е. вопросив Господа. παραδιδοὺς παραδώσω — «предавая предам»: усиленная форма (слав. «предая предам»). εἰς τὰς χεῖράς μου — в руки мои."
  20: "ἐκ τῶν ἐπάνω διακοπῶν — «из верхних прорывов» (διακοπή); слав. «с вышних сечей». Это перевод евр. בַּעַל־פְּרָצִים (Ваал-Перацим, Синод.), поэтому имя места оставлено переводным: 上の破れ. διακόπτω — прорывать; ὡς διακόπτεται ὕδατα — как прорываются воды (нарушенное согласование сохранено)."
  21: "καταλιμπάνουσιν — оставляют (καταλιμπάνω). τοὺς θεοὺς αὐτῶν — богов своих, т.е. идолов. Слав. в скобках добавляет «и рече давид сожещи их во огни» (ср. 1 Пар 14:12) — в гр. нет, в текст не внесено."
  22: "προσέθεντο … τοῦ ἀναβῆναι — «приложили взойти», т.е. снова пошли (προστίθημι). Слав. «приложиша паки приити»."
  23: "Слав. передаёт здесь вопрос Давида («взыду ли ко иноплеменником? и предаси ли их в руце мои?»), которого в гр. нет (в МТ есть); по паритету он внесён в текст без 〔〕. ἀποστρέφου ἀπ᾽ αὐτῶν — уклонись от них. κλαυθμών — плач; слав. «дубрава плача» (в МТ בָּכָא) — 泣きの森. Кавычки речи открываются в 23 и закрываются в 24."
  24: "συγκλεισμός — «замыкание», шум движения (слав. «глас шума»). ἄλσος τοῦ κλαυθμῶνος — роща плача. καταβήσει — сойдёшь (καταβαίνω). ἐξελεύσεται … ἔμπροσθέν σου — выйдет пред тобою. κόπτειν ἐν τῷ πολέμῳ — поражать в войне (слав. «сещи на брани»)."
  25: "ἐπάταξεν — поразил (πατάσσω). ἀπὸ Γαβαων ἕως τῆς γῆς Γαζηρα — от Гаваона до земли Газера (ガバオン, ガゼル — как в Нав 9–12); слав. «от гаваона даже до земли газира»."
