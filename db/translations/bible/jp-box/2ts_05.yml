# jp-box, 2-я Царств, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 2 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: помазание Давида над всем Израилем и годы царствования (1–5);
# взятие Сиона и строительство города (6–10); Хирам Тирский (11–12);
# сыновья, рождённые в Иерусалиме (13–16); две победы над филистимлянами (17–25).
# Речь — 「…」: 5:1–2 (старейшины; слова Господа внутри — 『…』), 5:6 (жители
# Иевуса), 5:8 (Давид; поговорка без кавычек), 5:19 и 5:23 (Давид и Господь).
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕 нет: слав. добавления и иночтения внесены в основной текст без скобок —
# «моим» 5:2, вопрос Давида 5:23 (его нет в гр., есть в МТ); всё в notes.
# Слав. пометы в скобках 5:21 («и рече давид сожещи их во огни») в текст не внесены.
# Имена: エブス人, ガバオン, ガゼル, ベエル・シェバ — как в корпусе (Нав, Суд, 1 Цар).
# Сносок ⟨…⟩ нет: новых терминов в главе нет.
# jp-ni не использовался.

