# jp-box, 1 Маккавейская, глава 12. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: у слав. 54 стиха, у gr 53. Лишний стих —
# 12:54 по слав.: в gr речь народов (ст. 53а) стоит внутри 53, у слав. вынесена
# в 54. Поэтому 53 = повествование до «…сказали», 54 = сама речь (「…」).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–4 посольство в Рим и Спарту; 5–18 письмо Ионатана спартанцам
# (братство с ними, память в жертвах и молитвах, войны окрестных царей,
# посольство Нуминия и Антипатра); 19–23 письмо Арея к Онии (Авраамов род);
# 24–34 поход Амафитис, ночное нападение, Ионатан у арабов Заведеев,
# Симон в Иоппии; 35–38 укрепление Иерусалима и Адиды; 39–53 Трифон,
# Вефсан, пленение Ионатана в Птолемаиде и его гибель, плач Израиля.
# Голоса: 3 (послы), 6–18 и 20–23 (письма) — 「…»; 54 — речь народов 「…」.
#
tr_code: jp-box
book: 1mak
chapter: 12
draft: true

verses:
  1: "ヨナタンは、時[とき]が自分[じぶん]に味方[みかた]しているのを見[み]て、者[もの]たちを選[えら]び出[だ]し、ローマへ送[おく]って、彼[かれ]らとの友情[ゆうじょう]を確立[かくりつ]し、新[あら]たにしようとした。"
  2: "またスパルタ人[じん]と他[ほか]の場所[ばしょ]へも、同[おな]じ趣旨[しゅし]の手紙[てがみ]を送[おく]った。"
  3: "彼[かれ]らはローマへ行[い]き、元老院[げんろういん]に入[はい]って言[い]った。「大祭司[だいさいし]ヨナタンとユダヤ人[じん]の民族[みんぞく]は、以前[いぜん]のように、あなたがたとの友情[ゆうじょう]と同盟[どうめい]を新[あら]たにするためにわれわれを送[おく]った。」"
  4: "ローマ人[じん]たちは、ユダヤの地[ち]へ平和[へいわ]のうちに彼[かれ]らを送[おく]り届[とど]けるよう、各地[かくち]の者[もの]たちへの手紙[てがみ]を彼[かれ]らに与[あた]えた。"
  5: "これは、ヨナタンがスパルタ人[じん]に書[か]いた手紙[てがみ]の写[うつ]しである。"
  6: "「大祭司[だいさいし]ヨナタンと、民族[みんぞく]の長老会[ちょうろうかい]と祭司[さいし]たちと、ユダヤ人[じん]の残[のこ]りの民[たみ]は、兄弟[きょうだい]であるスパルタ人[じん]に挨拶[あいさつ]を送[おく]る。"
  7: "以前[いぜん]に、あなたがたの間[あいだ]で王[おう]であったアレイオスから、大祭司[だいさいし]オニアスに手紙[てがみ]が送[おく]られた。あなたがたはわれわれの兄弟[きょうだい]である、と。その写[うつ]しは下[した]に記[しる]されている。"
  8: "オニアスは送[おく]られた人[ひと]を栄誉[えいよ]をもって受[う]け入[い]れ、同盟[どうめい]と友情[ゆうじょう]について明[あき]らかに述[の]べられた手紙[てがみ]を受[う]け取[と]った。"
  9: "そこでわれわれは、これらのことを必要[ひつよう]としない者[もの]ではあるが、手[て]もとにある聖[せい]なる書物[しょもつ]を慰[なぐさ]めとして、"
  10: "あなたがたへの兄弟愛[きょうだいあい]と友情[ゆうじょう]を新[あら]たにするために送[おく]ろうと試[こころ]みた。あなたがたからわれわれに送[おく]られてから、長[なが]い年月[としつき]が過[す]ぎているからである。"
  11: "われわれはいつでも絶[た]えず、祭[まつ]りにもその他[ほか]の定[さだ]められた日々[ひび]にも、捧[ささ]げる犠牲[ぎせい]と祈[いの]りの中[なか]で、あなたがたを覚[おぼ]えている。兄弟[きょうだい]を覚[おぼ]えるのは当然[とうぜん]であり、ふさわしいことだからである。"
  12: "われわれはあなたがたの栄光[えいこう]を喜[よろこ]んでいる。"
  13: "しかし、われわれには多[おお]くの苦難[くなん]と多[おお]くの戦[たたか]いが降[ふ]りかかり、周[まわ]りの王[おう]たちがわれわれと戦[たたか]った。"
  14: "そこでわれわれは、これらの戦[たたか]いの中[なか]で、あなたがたや、他[ほか]の同盟者[どうめいしゃ]、友[とも]たちを煩[わずら]わそうとは思[おも]わなかった。"
  15: "われわれには天[てん]からの助[たす]けがあって助[たす]けてくれるので、われわれは敵[てき]から救[すく]い出[だ]され、敵[てき]は低[ひく]くされた。"
  16: "そこでわれわれは、アンティオコスの子[こ]ヌメニオスとヤソンの子[こ]アンティパトロスを選[えら]び、ローマ人[じん]に送[おく]って、彼[かれ]らとの友情[ゆうじょう]と以前[いぜん]の同盟[どうめい]を新[あら]たにした。"
  17: "われわれは彼[かれ]らに、あなたがたのところへも行[い]き、あなたがたに挨拶[あいさつ]し、われわれの更新[こうしん]と兄弟愛[きょうだいあい]についての手紙[てがみ]をあなたがたに渡[わた]すよう命[めい]じた。"
  18: "今[いま]、あなたがたはこれらに答[こた]えて、よくしてくださるだろう。」"
  19: "これは、オニアスに宛[あ]てて送[おく]られた手紙[てがみ]の写[うつ]しである。"
  20: "「スパルタ人[じん]の王[おう]アレイオス、大祭司[だいさいし]オニアスに挨拶[あいさつ]を送[おく]る。"
  21: "スパルタ人[じん]とユダヤ人[じん]について、彼[かれ]らは兄弟[きょうだい]であり、アブラハムの子孫[しそん]であることが、書物[しょもつ]の中[なか]に見[み]いだされた。"
  22: "そこで今[いま]、われわれはこれらのことを知[し]ったので、あなたがたはわれわれにあなたがたの平和[へいわ]について書[か]いてくださるとよい。"
  23: "またわれわれもあなたがたに書[か]き送[おく]る。あなたがたの家畜[かちく]と財産[ざいさん]はわれわれのものであり、われわれのものはあなたがたのものである。われわれはこれらのことをあなたがたに告[つ]げるよう命[めい]じた。」"
  24: "ヨナタンは、デメトリオスの将軍[しょうぐん]たちが以前[いぜん]よりも大[おお]きな軍勢[ぐんぜい]とともに戻[もど]って来[き]て、自分[じぶん]と戦[たたか]おうとしていると聞[き]いた。"
  25: "彼[かれ]はエルサレムを発[た]ち、アマティスの地方[ちほう]で彼[かれ]らに会[あ]した。彼[かれ]らに自分[じぶん]の地方[ちほう]へ入[はい]る時[とき]を与[あた]えなかったからである。"
  26: "彼[かれ]は斥候[せっこう]を彼[かれ]らの陣営[じんえい]に送[おく]り、彼[かれ]らは戻[もど]って、彼[かれ]らが夜[よる]に襲[おそ]いかかろうと、そのように陣[じん]を整[ととの]えていると告[つ]げた。"
  27: "日[ひ]が沈[しず]むと、ヨナタンは自分[じぶん]の者[もの]たちに、夜通[よどお]し見張[みは]り、武器[ぶき]を取[と]って戦[たたか]いの備[そな]えをし、陣営[じんえい]の周[まわ]りに前哨[ぜんしょう]を置[お]くよう命[めい]じた。"
  28: "敵[てき]は、ヨナタンとその者[もの]たちが戦[たたか]いの備[そな]えをしたと聞[き]いて、恐[おそ]れ、心[こころ]に震[ふる]え、自分[じぶん]の陣営[じんえい]に火[ひ]を焚[た]いて去[さ]った。"
  29: "しかしヨナタンとその者[もの]たちは朝[あさ]まで知[し]らなかった。燃[も]えている火[ひ]を見[み]ていたからである。"
  30: "ヨナタンは彼[かれ]らの後[あと]を追[お]ったが、追[お]いつかなかった。彼[かれ]らはエレウテロス川[がわ]を渡[わた]ったからである。"
  31: "ヨナタンはザバダイオスと呼[よ]ばれるアラビア人[じん]たちのほうへ向[む]きを変[か]え、彼[かれ]らを打[う]ち、彼[かれ]らの分捕[ぶんど]り物[もの]を取[と]った。"
  32: "彼[かれ]はそこを発[た]ってダマスコへ行[い]き、その地方[ちほう]全体[ぜんたい]を通[とお]った。"
  33: "シモンは出[で]て、アスカロンと近[ちか]くの要塞[ようさい]まで行[い]き、ヤッファへ向[む]きを変[か]えて、これを先[さき]に占領[せんりょう]した。"
  34: "彼[かれ]は、彼[かれ]らが要塞[ようさい]をデメトリオスの側[がわ]の者[もの]たちに渡[わた]そうとしていると聞[き]いたからである。彼[かれ]はそこに、それを守[まも]るために守備隊[しゅびたい]を置[お]いた。"
  35: "ヨナタンは戻[もど]り、民[たみ]の長老[ちょうろう]たちを集[あつ]め、彼[かれ]らとともにユダヤに要塞[ようさい]を建[た]てることを相談[そうだん]した。"
  36: "すなわち、エルサレムの城壁[じょうへき]を高[たか]くし、アクラと町[まち]の間[あいだ]に高[たか]い壁[かべ]を築[きず]いて、アクラを町[まち]から切[き]り離[はな]し、アクラだけが孤立[こりつ]して、そこで売買[ばいばい]もできないようにするためであった。"
  37: "彼[かれ]らは町[まち]を建[た]てるために集[あつ]まり、東[ひがし]側[がわ]の谷[たに]の城壁[じょうへき]が崩[くず]れたので、ハフェナタと呼[よ]ばれる所[ところ]を修理[しゅうり]した。"
  38: "シモンはセフェラにあるアディダを建[た]て、これを堅固[けんご]にして、門[もん]と貫[つらぬ]き棒[ぼう]を設[もう]けた。"
  39: "トリュフォンはアジアの王[おう]となって冠[かんむり]を置[お]き、王[おう]アンティオコスに手[て]を伸[の]ばそうと求[もと]めた。"
  40: "しかし、ヨナタンが自分[じぶん]を許[ゆる]さず、自分[じぶん]と戦[たたか]うのではないかと恐[おそ]れ、彼[かれ]を捕[と]らえて殺[ころ]そうと求[もと]めた。彼[かれ]は発[た]ってベトサンへ来[き]た。"
  41: "ヨナタンは、戦[たたか]いのために選[えら]ばれた四万人[よんまんにん]の者[もの]とともに彼[かれ]を迎[むか]えに出[で]て、ベトサンへ来[き]た。"
  42: "トリュフォンは、ヨナタンが多[おお]くの軍勢[ぐんぜい]とともに来[き]たのを見[み]て、彼[かれ]に手[て]を伸[の]ばすことを恐[おそ]れた。"
  43: "トリュフォンは彼[かれ]を栄誉[えいよ]をもって受[う]け入[い]れ、自分[じぶん]のすべての友[とも]たちの前[まえ]に彼[かれ]を立[た]たせ、贈[おく]り物[もの]を与[あた]え、自分[じぶん]の友[とも]たちと軍勢[ぐんぜい]に、自分[じぶん]に対[たい]するように彼[かれ]に従[したが]うよう命[めい]じた。"
  44: "そしてヨナタンに言[い]った。「なぜあなたは、われわれに戦[たたか]いが迫[せま]っていないのに、このすべての民[たみ]を煩[わずら]わせたのか。"
  45: "今[いま]、彼[かれ]らを自分[じぶん]の家[いえ]へ帰[かえ]し、あなたのために少数[しょうすう]の者[もの]を選[えら]べ。彼[かれ]らはあなたとともにいる。そして、わたしとともにプトレマイスへ来[き]なさい。わたしはそれをあなたに渡[わた]し、他[ほか]の要塞[ようさい]と残[のこ]りの軍勢[ぐんぜい]、およびすべての務[つと]めにある者[もの]たちを渡[わた]す。そして帰[かえ]って行[い]こう。わたしが来[き]たのはこのためである。」"
  46: "ヨナタンは彼[かれ]を信[しん]じ、彼[かれ]が言[い]ったとおりに行[おこな]い、軍勢[ぐんぜい]を送[おく]り出[だ]すと、彼[かれ]らはユダヤの地[ち]へ去[さ]った。"
  47: "彼[かれ]は自分[じぶん]のもとに三千人[さんぜんにん]の者[もの]を残[のこ]し、そのうち二千人[にせんにん]をガリラヤに残[のこ]し、千人[せんにん]だけが彼[かれ]とともに進[すす]んだ。"
  48: "ヨナタンがプトレマイスに入[はい]ると、プトレマイスの者[もの]たちは門[もん]を閉[と]ざし、彼[かれ]を捕[と]らえ、彼[かれ]とともに入[はい]ったすべての者[もの]を剣[つるぎ]で殺[ころ]した。"
  49: "トリュフォンは軍勢[ぐんぜい]と騎兵[きへい]をガリラヤと大[おお]きな平地[へいち]へ送[おく]り、ヨナタンの側[がわ]の者[もの]たちを皆[みな]滅[ほろ]ぼそうとした。"
  50: "彼[かれ]らは、ヨナタンが捕[と]らえられ、彼[かれ]とともにいた者[もの]たちも滅[ほろ]びたと知[し]り、互[たが]いに励[はげ]まし合[あ]って、戦[たたか]いの備[そな]えの整[ととの]った隊列[たいれつ]を組[く]んで進[すす]んだ。"
  51: "追跡[ついせき]する者[もの]たちは、彼[かれ]らにとって命[いのち]がかかっているのを見[み]て、引[ひ]き返[かえ]した。"
  52: "彼[かれ]らは皆[みな]、平和[へいわ]のうちにユダヤの地[ち]へ来[き]て、ヨナタンとその仲間[なかま]たちのために泣[な]き、非常[ひじょう]に恐[おそ]れた。イスラエルは皆[みな]、大[おお]きな嘆[なげ]きをもって泣[な]いた。"
  53: "周[まわ]りのすべての民族[みんぞく]は彼[かれ]らを滅[ほろ]ぼそうと求[もと]めた。彼[かれ]らは言[い]ったからである。"
  54: "「彼[かれ]らには指導者[しどうしゃ]も助[たす]ける者[もの]もいない。今[いま]こそ、彼[かれ]らと戦[たたか]い、人[ひと]々[びと]の間[あいだ]から彼[かれ]らの記憶[きおく]を消[け]し去[さ]ろう。」"

notes:
  1: "στῆσαι καὶ ἀνανεώσασθαι τὴν πρὸς αὐτοὺς φιλίαν — «поставить и обновить дружбу с ними»; слав. «составити и обновити»."
  3: "τὸ βουλευτήριον — «совет» (сенат), 元老院; κατὰ τὸ πρότερον — «как прежде»."
  6: "ἡ γερουσία τοῦ ἔθνους — «старейшины (герусия) народа», 長老会; ὁ λοιπὸς δῆμος — «остальной народ»."
  7: "παρὰ Ἀρείου τοῦ βασιλεύοντος ἐν ὑμῖν — «от Арея, царствовавшего у вас»; слав. «от дариа» — порча имени (Дарий вместо Арей), в тексте держим греч. アレイオス. ὡς τὸ ἀντίγραφον ὑπόκειται — «как список ниже лежит»."
  9: "ἀπροσδεεῖς τούτων — «не имеющие нужды в этом»; παράκλησιν — «утешение»."
  11: "μιμνῃσκόμεθα ὑμῶν ἐφ᾽ ὧν προσφέρομεν θυσιῶν καὶ ἐν ταῖς προσευχαῖς — «воспоминаем вас при приносимых нами жертвах и в молитвах»."
  13: "οἱ βασιλεῖς οἱ κύκλῳ ἡμῶν — «цари, что вокруг нас»."
  16: "Νουμήνιον Ἀντιόχου καὶ Ἀντίπατρον Ἰάσονος — ヌメニオス (сын Антиоха) и アンティパトロス (сын Ясона)."
  19: "В LXX и у слав. текст испорчен: «список писем, которые послал Ония» (ὧν ἀπέστειλαν Ονια); по содержанию 12:20 письмо послано Ареем Онии — переведено «オニアスに宛てて送られた»."
  21: "ἐκ γένους Αβρααμ — «от рода Авраамова»; アブラハム."
  25: "εἰς τὴν Αμαθῖτιν χώραν — «в страну Амафитскую»; οὐ γὰρ ἔδωκεν αὐτοῖς ἀνοχήν — «не дал им времени (промедления)»."
  26: "κατασκόπους — 斥候; τὴν νύκτα — «в эту ночь»."
  27: "γρηγορεῖν — «бодрствовать»; ἐξέβαλεν προφύλακας κύκλῳ — «выставил передовые стражи вокруг»."
  28: "ἔπτηξαν τῇ καρδίᾳ — «устрашились (затрепетали) сердцем»; ἀνέκαυσαν πυράς — «зажгли огни» (слав. «возжгоша огни»)."
  31: "τοὺς Ἄραβας τοὺς καλουμένους Ζαβαδαίους — ザバダイオスと呼ばれるアラビア人."
  34: "βούλονται τὸ ὀχύρωμα παραδοῦναι — «хотят сдать крепость»; слав. «твердыню предати стране димитриеве»."
  36: "εἰς τὸ διαχωρίζειν αὐτὴν τῆς πόλεως — «чтобы отделить её от города»; ὅπως μήτε ἀγοράζωσιν μήτε πωλῶσιν — «чтобы не покупали и не продавали»."
  37: "Χαφεναθα — ハフェナタ (слав. «хафенафа»); τοῦ χειμάρρου τοῦ ἐξ ἀπηλιώτου — «потока с востока»."
  38: "Αδιδα ἐν τῇ Σεφηλα — セフェラのアディダ; μοχλοί — 貫き棒."
  40: "Βαιθσαν — ベトサン; ἐζήτει συλλαβεῖν αὐτὸν τοῦ ἀπολέσαι — «искал схватить его, чтобы погубить»."
  41: "ἐν τεσσαράκοντα χιλιάσιν ἀνδρῶν ἐπιλελεγμέναις εἰς παράταξιν — «с сорока тысячами мужей, избранных к ополчению»."
  44: "Ἵνα τί ἐκόπωσας πάντα τὸν λαὸν τοῦτον — «для чего ты утрудил весь этот народ»."
  45: "ἐπιστρέψας ἀπελεύσομαι — «обратившись, уйду»; τούτου γὰρ χάριν πάρειμι — «ибо ради этого я здесь»."
  47: "две тысячи в Галилее, тысяча с ним — слав. то же, кроме «идоша с ним»."
  48: "ἀπέκλεισαν οἱ Πτολεμαεῖς τὰς πύλας — «заключили Птолемаидяне ворота»; ἐν ῥομφαίᾳ — «мечом»."
  49: "τὸ πεδίον τὸ μέγα — «равнину великую»; τοὺς παρὰ Ιωναθου — «бывших с Ионатаном»."
  50: "συνεστραμμένοι — «собравшись (сомкнутым строем)»; ἕτοιμοι εἰς πόλεμον — «готовые к войне»."
  51: "περὶ ψυχῆς αὐτοῖς ἐστιν — «дело идёт о жизни их»."
  52: "πένθος μέγα — «плач великий»; слав. «плакаше весь израиль плачем велиим»."
  53: "ἐζήτησαν πάντα τὰ ἔθνη ... ἐκτρῖψαι αὐτούς — «искали все народы ... истребить их»; слав. обрывает стих на «реша бо:». Держим слав. деление: речь — в 54."
  54: "Слав. добавочный стих (в gr его нет: речь народов стоит в конце 53): «не имеют началника и помогающаго: ныне убо поратуем их и отимем от человек память их». Переведено по слав.; в LXX эта речь — конец 53."
