# jp-box, Судьи, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 21: клятва в Массифе и плач (1–6), вопрос о жёнах (7–9),
# поражение Явеша Галаадского (10–14), сожаление и договор (15–18),
# праздник в Силоме и похищение девиц (19–23), возвращение по домам (24),
# «в те дни не было царя» (25).
# Речь Бога в главе не звучит; речи людей — 「…」 (1, 3, 5, 6–7, 8, 10–11,
# 16, 17–18, 19, 20–22); вложенная речь — 『…』 (18, слова клятвы;
# 22, слова, которые скажут отцам и братьям). В 5 клятва «必ず死ぬ» дана
# цитатой внутри повествования.
# Нумерация по gr: 25 стихов. В csl 24: слав. 21:24 соединяет gr 21:24 и 21:25.
# 21:2 в gr — «в Массифу и Вефиль», в csl только «в вефиль»; держимся gr.
# 〔…〕 нет: на месте всех стихов в gr-lxx-byz стоит текст, а не «.».
# Сносок ⟨…⟩ нет: 嗣業, 聖絶, 祭壇, 燔祭, 酬恩祭, 会衆, 集会, 契約の箱 уже пояснены.
# jp-ni не использовался.

