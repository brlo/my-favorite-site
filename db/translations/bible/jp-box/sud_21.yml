chapter: 21
draft: true

verses:
  1: "イスラエルの男[おとこ]たちはマスファで誓[ちか]って言[い]った。「わたしたちのうち、だれも自分[じぶん]の娘[むすめ]をベニヤミンに妻[つま]として与[あた]えない。」"
  2: "民[たみ]はみなマスファとベテルに来[き]、そこに夕[ゆう]べまで神[かみ]の前[まえ]に座[すわ]り、声[こえ]を上[あ]げて大[おお]きく泣[な]いた。"
  3: "そして言[い]った。「主[しゅ]、イスラエルの神[かみ]よ、なぜイスラエルにこのようなことが起[お]こり、今日[きょう]、イスラエルから一[ひと]つの部族[ぶぞく]が欠[か]けてしまったのですか。」"
  4: "その翌日[よくじつ]、民[たみ]は朝[あさ]早[はや]く起[お]き、そこに祭壇[さいだん]を築[きず]いて、燔祭[はんさい]と酬恩祭[しゅうおんさい]をささげた。"
  5: "イスラエルの子[こ]らは言[い]った。「イスラエルの全部族[ぶぞく]のうち、主[しゅ]のもとへ、集会[しゅうかい]に上[のぼ]らなかった者[もの]はだれか。」マスファで主のもとへ上らなかった者には、大[おお]きな誓[ちか]いがあって、「必[かなら]ず死[し]ぬ」と言[い]われていたからである。"
  6: "イスラエルの子[こ]らは、兄弟[きょうだい]ベニヤミンのことで心[こころ]を痛[い]め、言[い]った。「今日[きょう]、イスラエルから一[ひと]つの部族[ぶぞく]が断[た]たれた。"
  7: "わたしたちは残[のこ]った者[もの]たちに、どうして妻[つま]を用意[ようい]すればよいのか。わたしたちは主[しゅ]によって、自分[じぶん]たちの娘[むすめ]から彼[かれ]らに妻[つま]として与[あた]えないと誓[ちか]ったのだから。」"
  8: "また、彼[かれ]らは言[い]った。「イスラエルの部族[ぶぞく]のうち、主[しゅ]のもとへマスファに上[のぼ]らなかったのはどの部族[ぶぞく]か。」すると、見[み]よ、ヤベシュ・ギレアデからは、誰[だれ]も陣[じん]へ、集会[しゅうかい]へと来[こ]なかった。"
  9: "民[たみ]が数[かぞ]えられると、見[み]よ、ヤベシュ・ギレアデの住[す]む者[もの]のうち、そこには一人[ひとり]もいなかった。"
  10: "集会[しゅうかい]はそこへ、力[ちから]ある者[もの]の子[こ]らから一万二千人[にん]を遣[つか]わし、彼[かれ]らに命[めい]じて言[い]った。「行[い]って、ヤベシュ・ギレアデの住[す]む者[もの]を、女[おんな]も民[たみ]も剣[つるぎ]の刃[は]にかけて打[う]て。"
  11: "あなたがたがすべきことはこれである。すなわち、男[おとこ]のすべてと、男[おとこ]を知[し]ったことのある女[おんな]をすべて聖絶[せいぜつ]せよ。」"
  12: "彼[かれ]らはヤベシュ・ギレアデの住[す]む者[もの]のうち、まだ男[おとこ]を知[し]らない処女[しょじょ]四百人[にん]を見[み]つけ、彼女[かのじょ]たちをカナンの地[ち]にあるシロの陣[じん]に連[つ]れて来[こ]た。"
  13: "集会[しゅうかい]はみな、リンモンの岩[いわ]にいるベニヤミンに人[ひと]を遣[つか]わして語[かた]り、彼[かれ]らに平和[へいわ]を呼[よ]びかけた。"
  14: "ベニヤミンはそのとき、イスラエルの子[こ]らのもとへ戻[もど]った。イスラエルは、ヤベシュ・ギレアデの女[おんな]たちを彼[かれ]らに与[あた]えた。そして、そのことは彼らに良[よ]いと思[おも]われた。"
  15: "民[たみ]はベニヤミンのことで心[こころ]を痛[い]めた。主[しゅ]がイスラエルの部族[ぶぞく]の間[あいだ]に裂[さ]け目[め]を造[つく]られたからである。"
  16: "集会[しゅうかい]の長老[ちょうろう]たちは言[い]った。「残[のこ]った者[もの]たちに、どうして妻[つま]を用意[ようい]すればよいのか。ベニヤミンから女[おんな]が消[き]え去[さ]ったからである。」"
  17: "また、彼[かれ]らは言[い]った。「ベニヤミンには嗣業[しぎょう]が残[のこ]される。イスラエルから部族[ぶぞく]が消[け]し去[さ]ることはない。"
  18: "しかし、わたしたちは自分[じぶん]たちの娘[むすめ]から彼[かれ]らに妻[つま]を与[あた]えることはできない。イスラエルの子[こ]らは、『ベニヤミンに妻[つま]を与[あた]える者[もの]は呪[のろ]われる』と言[い]って誓[ちか]ったからである。」"
  19: "また、彼[かれ]らは言[い]った。「見[み]よ、シロで年[とし]ごとに主[しゅ]の祭[まつ]りがある。」それはベテルの北[きた]、ベテルからシェケムへ上[のぼ]る道[みち]の日[ひ]の昇[のぼ]る東[ひがし]、レボナの南[みなみ]にある。"
  20: "そして、彼[かれ]らはベニヤミンの子[こ]らに命[めい]じて言[い]った。「行[い]って、ぶどう畑[ばたけ]に伏[ふ]せなさい。"
  21: "そして、見[み]なさい。シロに住[す]む者[もの]の娘[むすめ]たちが、踊[おど]りの中[なか]で踊[おど]るために出[で]て来[く]る。そのとき、あなたがたはぶどう畑[ばたけ]から出[で]て、それぞれシロの娘[むすめ]たちのうちから自分[じぶん]の妻[つま]を奪[うば]い取り、ベニヤミンの地[ち]へ行[い]きなさい。"
  22: "そして、彼[かれ]らの父[ちち]たちや兄弟[きょうだい]たちが、あなたがたと争[あらそ]うために来[き]たとき、わたしたちは彼[かれ]らに言[い]おう。『どうか、彼[かれ]らをあわれんでください。彼[かれ]らは戦[いくさ]のとき、それぞれ自分[じぶん]の妻[つま]を迎[むか]えなかったのです。あなたがたが彼[かれ]らに与[あた]えたのではありません。あなたがたはその時[とき]、罪[つみ]を犯[おか]したのです。』」"
  23: "ベニヤミンの子[こ]らはそのとおりにして、踊[おど]る者[もの]たちのうちから、自分[じぶん]たちの数[かず]に応[おう]じて妻[つま]を奪[うば]い取[と]った。彼[かれ]らは行[い]って自分[じぶん]たちの嗣業[しぎょう]に戻[もど]り、町々[まちまち]を建[た]ててそこに住[す]んだ。"
  24: "イスラエルの子[こ]らはそのとき、そこから各自[かくじ]、自分[じぶん]の部族[ぶぞく]へ、自分[じぶん]の氏族[しぞく]へと去[さ]り、そこから出[で]て、それぞれ自分[じぶん]の嗣業[しぎょう]へ行[い]った。"
  25: "そのころ、イスラエルには王[おう]がなかった。おのおの自分[じぶん]が見[み]て正[ただ]しいと思[おも]うことを行[おこな]っていた。"

notes:
  1: "ὤμοσεν ... λέγων — поклялись, говоря; ἀνὴρ ἐξ ἡμῶν — «человек из нас», т. е. никто из нас; οὐ δώσει τὴν θυγατέρα αὐτοῦ τῷ Βενιαμιν εἰς γυναῖκα — не даст дочери своей Вениамину в жёны."
  2: "παρεγένοντο — пришли; εἰς Μασσηφα καὶ Βαιθηλ — в Массифу и Вефиль (в gr оба города; слав. только «в вефиль»); ἐκάθισαν ἕως ἑσπέρας — сидели до вечера; ἐνώπιον τοῦ θεοῦ — пред Богом; ἐπῆραν τὴν φωνήν — подняли голос; κλαυθμὸν μέγαν — плач великий."
  3: "Ἵνα τί — «к чему, для чего»; κύριε ὁ θεὸς Ισραηλ — Господи, Боже Израилев; ἐγενήθη αὕτη ἐν τῷ Ισραηλ — произошло это в Израиле; τοῦ ἐπισκεπῆναι — «чтобы недостало» (ἐπισκέπτομαι здесь «недосчитаться»); φυλὴν μίαν — одного колена."
  4: "ἐγένετο ἐν τῇ ἐπαύριον — было на другой день; ὤρθρισεν — встал рано (ὀρθρίζω); ᾠκοδόμησαν θυσιαστήριον — построили жертвенник; ἀνήνεγκαν ὁλοκαυτώματα σωτηρίου — вознесли всесожжения спасения, т. е. мирные жертвы (酬恩祭). Слав. добавляет «и рекоша сынове израилевы» — в gr нет, это начало ст. 5."
  5: "Τίς ὁ μὴ ἀναβάς — кто не взошёл; ἐν τῇ ἐκκλησίᾳ — в собрании; ὅρκος μέγας — великая клятва; Θανάτῳ ἀποθανεῖται — «смертью умрёт» (в тексте 必ず死ぬ)."
  6: "παρεκλήθησαν περὶ Βενιαμιν — «умилились, сжалились о Вениамине» (παρακαλέω, страд.); Ἀφῄρηται — «отнято» (ἀφαιρέω, перфект); φυλὴ μία ἐξ Ισραηλ — одно колено из Израиля. Речь продолжается в ст. 7, кавычки не закрываются."
  7: "τί ποιήσωμεν — что сделаем (сослагательное); τοῖς ὑπολειφθεῖσιν — оставшимся (ὑπολείπω); εἰς γυναῖκας — «в жёны»; ὠμόσαμεν ἐν κυρίῳ — поклялись Господом; τοῦ μὴ δοῦναι — не дать."
  8: "Τίς μία τῶν φυλῶν — «кто один из колен» (слав. «кто един от племен»); ἥτις οὐκ ἀνέβη — которое не взошло; εἰς τὴν παρεμβολήν — в стан (παρεμβολή); εἰς τὴν ἐκκλησίαν — в собрание."
  9: "ἐπεσκέπη ὁ λαός — народ был пересчитан (ἐπισκέπτομαι); οὐκ ἔστιν ἐκεῖ ἀνήρ — нет там человека; ἀπὸ τῶν κατοικούντων Ιαβις Γαλααδ — из жителей Иависа Галаадского (Явеш-Гилеад)."
  10: "ἀπέστειλαν ... δώδεκα χιλιάδας — послали 12 000; ἀπὸ τῶν υἱῶν τῆς δυνάμεως — из сынов силы, т. е. храбрых; ἐνετείλαντο — заповедали; ἐν στόματι ῥομφαίας — устами меча."
  11: "ἀρσενικόν — мужского пола; γυναῖκα γινώσκουσαν κοίτην ἄρσενος — жену, познавшую ложе мужское; ἀναθεματιεῖτε — предайте заклятию (ἀναθεματίζω; в корпусе 聖絶). Слав. добавляет «девицы же снабдите. И сотвориша тако» — в gr нет."
  12: "νεάνιδας παρθένους — девиц-девственниц; οὐκ ἔγνωσαν ἄνδρα — не познали мужа; ἦγον εἰς τὴν παρεμβολὴν εἰς Σηλω — привели в стан в Силом; ἐν γῇ Χανααν — в земле Ханаанской."
  13: "ἀπέστειλεν πᾶσα ἡ συναγωγή — послало всё собрание (ед. ч.; далее мн. ч. ἐλάλησαν); τὸν ἐν τῇ πέτρᾳ Ρεμμων — того, что в скале Риммон; ἐκάλεσαν αὐτοὺς εἰς εἰρήνην — призвали их к миру."
  14: "ἀπέστρεψεν Βενιαμιν — возвратился Вениамин; ἔδωκαν αὐτοῖς τὰς γυναῖκας — дали им жён, которые были из женщин Иависа Галаадского (слав. добавляет «яже живо сохраниша» — в gr нет); ἤρεσεν αὐτοῖς οὕτως — «так было угодно им» (в МТ и ru иначе: «оказалось, что этого было недостаточно»; держимся gr)."
  15: "παρεκλήθη τῷ Βενιαμιν — сжалился над Вениамином; διακοπὴν ἐν ταῖς φυλαῖς Ισραηλ — «разрыв, рассечение в коленах Израиля» (διακοπή; слав. «истребление»)."
  16: "οἱ πρεσβύτεροι τῆς συναγωγῆς — старейшины собрания; τοῖς ἐπιλοίποις — оставшимся (ἐπίλοιπος); ἠφάνισται — исчезла (ἀφανίζω, перфект); γυνή — жена, женщина."
  17: "Κληρονομία διασεσῳσμένη τῷ Βενιαμιν — «наследие сохранённое Вениамину» (διασῴζω, прич. перфекта); οὐ μὴ ἐξαλειφθῇ — «да не изгладится» (ἐξαλείφω). Слав. передаёт как вопрос («како будет...»), в gr — утверждение/решение."
  18: "οὐ δυνησόμεθα — не сможем; ὠμόσαμεν ... λέγοντες — поклялись, говоря; Ἐπικατάρατος ὁ διδούς — «проклят дающий» (ἐπικατάρατος). Вложенная клятва — 『…』."
  19: "Ἑορτὴ τῷ κυρίῳ — праздник Господу; ἀφ᾽ ἡμερῶν εἰς ἡμέρας — «от дней в дни», т. е. ежегодно; ἀπὸ βορρᾶ τῆς Βαιθηλ — к северу от Вефиля; κατ᾽ ἀνατολὰς ἡλίου — к восходу солнца, т. е. на восток; ὁδὸς ... ἐκ Βαιθηλ εἰς Σικιμα — дорога из Вефиля в Сихем; ἀπὸ νότου τοῦ Λιβάνου τῆς Λεβωνα — к югу от Левоны (Λιβάνου — вероятно, вариант или глосса к Λεβωνα)."
  20: "ἐνετείλαντο — заповедали; Διέλθατε — пройдите; ἐνεδρεύσατε ἐν τοῖς ἀμπελῶσιν — устройте засаду в виноградниках (ἀμπελών)."
  21: "ὄψεσθε — увидите; χορεῦσαι ἐν χοροῖς — плясать в хорах (χορός); ἁρπάσετε ἀνὴρ ἑαυτῷ γυναῖκα — похитит каждый себе жену (ἁρπάζω); ἀπελεύσεσθε εἰς γῆν Βενιαμιν — пойдёте в землю Вениамина."
  22: "κρίνεσθαι πρὸς ὑμᾶς — судиться с вами; Ἐλεήσατε αὐτούς — «помилуйте их» (слав. «помилуйте нас ими»); οὐκ ἔλαβον ἀνὴρ γυναῖκα αὐτοῦ ἐν τῷ πολέμῳ — не взял каждый жены своей на войне; οὐ γὰρ ὑμεῖς δεδώκατε — ибо не вы дали; κατὰ τὸν καιρὸν ἐπλημμελήσατε — «в то время вы согрешили» (πλημμελέω)."
  23: "ἐποίησαν οὕτως — сделали так; κατὰ τὸν ἀριθμὸν αὐτῶν — по числу их; ἀπὸ τῶν χορευουσῶν — из пляшущих; διήρπασαν — похитили (διαρπάζω); ᾠκοδόμησαν ἑαυτοῖς πόλεις — построили себе города."
  24: "περιεπάτησαν ἐκεῖθεν — пошли оттуда; εἰς τὴν φυλὴν ... εἰς τὴν συγγένειαν — в колено и в род (συγγένεια); ἀνὴρ εἰς τὴν κληρονομίαν — каждый в наследие своё. Слав. 24 включает и ст. 25 (о царе) — отсюда 24 стиха в csl."
  25: "ἐν ταῖς ἡμέραις ἐκείναις — в те дни; οὐκ ἦν βασιλεὺς ἐν Ισραηλ — не было царя в Израиле; τὸ εὐθὲς ἐν ὀφθαλμοῖς αὐτοῦ — «правое в очах его» (семитизм); ἐποίει — делал. Формула та же, что в 17:6."
