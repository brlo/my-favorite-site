verses:
  1: "ユダの王[おう]、アハズヤの子[こ]ヨアシュの第二十三[だいにじゅうさん]年[ねん]に、イエフの子ヨアハズがイスラエルの王となり、サマリアで十七年[じゅうななねん]治[おさ]めた。"
  2: "彼[かれ]は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させた罪[つみ]の後[あと]を歩[あゆ]んで、それらから離[はな]れなかった。"
  3: "主[しゅ]の怒[いか]りはイスラエルに対[たい]して燃[も]え上[あ]がり、主は彼らをシリアの王ハザエルの手[て]に、またハザエルの子ベン・ハダドの手に、すべての日[ひ]々[び]の間[あいだ]渡[わた]された。"
  4: "ヨアハズは主[しゅ]の顔[かお]を求[もと]めて願[ねが]った。主は彼の願[ねが]いを聞[き]き入[い]れられた。イスラエルの苦[くる]しみをご覧[らん]になったからである。シリアの王が彼らを苦しめていたからである。"
  5: "主[しゅ]はイスラエルに救[すく]いを与[あた]え、彼らはシリアの手[て]の下[した]から出[で]て、イスラエルの子[こ]らは昔[むかし]のように自分[じぶん]の天幕[てんまく]に住[す]んだ。"
  6: "しかし、彼らはネバトの子[こ]ヤロブアムの家[いえ]の罪[つみ]から離[はな]れず、その中[なか]を歩[あゆ]んだ。そして、アシェラの木立[こだち]はサマリアに立[た]ったままであった。"
  7: "ヨアハズに残[のこ]された民[たみ]は、騎兵[きへい]五十人[ごじゅうにん]、戦車[せんしゃ]十[じゅう]、歩兵[ほへい]一万人[いちまんにん]のほかはなかった。シリアの王が彼らを滅[ほろ]ぼし、踏[ふ]みつける土[つち]のようにしたからである。"
  8: "ヨアハズの残[のこ]りの言葉[ことば]、彼が行[おこな]ったすべてのこと、および彼の武勇[ぶゆう]は、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されているではないか。"
  9: "ヨアハズは父[ちち]たちとともに眠[ねむ]り、サマリアで父たちとともに葬[ほうむ]られた。代[か]わってその子[こ]ヨアシュが王[おう]となった。"
  10: "ユダの王ヨアシュの第三十七[だいさんじゅうなな]年[ねん]に、ヨアハズの子ヨアシュがサマリアでイスラエルの王となり、十六年[じゅうろくねん]治[おさ]めた。"
  11: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させたすべての罪[つみ]から離[はな]れず、その中[なか]を歩[あゆ]んだ。"
  12: "ヨアシュの残[のこ]りの言葉、彼が行ったすべてのこと、および彼がユダの王アマツヤとともに行った武勇[ぶゆう]は、イスラエルの王[おう]たちの日[ひ]々[び]の言葉の書[しょ]に記[しる]されているではないか。"
  13: "ヨアシュは父[ちち]たちとともに眠[ねむ]り、ヤロブアムはサマリアでイスラエルの子[こ]らとともに彼の王座[おうざ]に就[つ]いた。ヨアシュはサマリアでイスラエルの王たちとともに葬[ほうむ]られた。"
  14: "エリシャは死[し]に至[いた]る病[やまい]にかかった。イスラエルの王ヨアシュが彼のところに下[くだ]って来[き]て、彼の顔[かお]の上[うえ]で泣[な]き、言[い]った。「父[ちち]よ、父よ、イスラエルの戦車[せんしゃ]とその騎兵[きへい]よ。」"
  15: "エリシャは彼に言[い]った。「弓[ゆみ]と矢[や]を取[と]れ。」彼は弓と矢を取った。"
  16: "そして王に言った。「あなたの手[て]を弓の上[うえ]に置[お]け。」ヨアシュが手を弓の上に置[お]くと、エリシャは両手[りょうて]を王の手の上に置いた。"
  17: "そして言った。「東[ひがし]に向[む]かう窓[まど]を開[あ]けよ。」彼が開[あ]けると、エリシャは言った。「射[い]よ。」彼が射[い]ると、エリシャは言った。「主[しゅ]の救[すく]いの矢[や]、シリアへの救いの矢だ。あなたはアフェクでシリアを打[う]ち、徹底的[てっていてき]に滅[ほろ]ぼし尽[つ]くすであろう。」"
  18: "エリシャは彼に言った。「弓[ゆみ]を取[と]れ。」彼が取ると、イスラエルの王に言った。「地[ち]を打[う]て。」王は三度[さんど]打[う]って、止[や]めた。"
  19: "神[かみ]の人[ひと]は彼に対して深[ふか]く悲[かな]しみ、言った。「五度[ごど]か六度[ろくど]打[う]つべきだった。そうすれば、あなたはシリアを徹底的[てっていてき]に打[う]ち滅[ほろ]ぼしたであろう。しかし今[いま]、あなたはシリアを三度[さんど]打つだけである。」"
  20: "エリシャは死[し]に、そして葬[ほうむ]られた。年[とし]が巡[めぐ]って来[き]たとき、モアブの略奪隊[りゃくだつたい]がその地[ち]に来た。"
  21: "人[ひと]を葬[ほうむ]っているとき、見[み]よ、彼らはその略奪隊を見[み]つけ、その人をエリシャの墓[はか]に投[な]げ込[こ]んだ。投げ込まれた人はエリシャの骨[ほね]に触[ふ]れ、生[い]き返[かえ]って自分[じぶん]の足[あし]で立[た]った。"
  22: "ハザエルはヨアハズのすべての日[ひ]々[び]の間[あいだ]、イスラエルを苦[くる]しめた。"
  23: "しかし主[しゅ]は彼らを憐[あわ]れみ、彼らを深[ふか]く慈[いつく]しみ、アブラハム、イサク、ヤコブとのご自分[じぶん]の契約[けいやく]のゆえに、彼らに目[め]を留[と]められた。主は彼らを滅[ほろ]ぼすことを望[のぞ]まず、ご自分[じぶん]の顔[かお]から彼らを退[しりぞ]けられなかった。"
  24: "ハザエル、シリアの王[おう]が死[し]に、代[か]わってその子[こ]ベン・ハダドが王となった。"
  25: "ヨアハズの子[こ]ヨアシュは帰[かえ]って、ハザエルの子ベン・ハダドの手[て]から町[まち]々[まち]を取[と]り戻[もど]した。それらは彼の父ヨアハズが戦[たたか]いで取[と]られていたものである。ヨアシュは彼を三度[さんど]打[う]ち、イスラエルの町々を取[と]り戻した。"

notes:
  1: "Ἐν ἔτει εἰκοστῷ καὶ τρίτῳ τῷ Ιωας υἱῷ Οχοζιου — в двадцать третий год Иоаса, сына Охозии (это Иоас, царь иудейский). ἐβασίλευσεν Ιωαχας υἱὸς Ιου ἐν Σαμαρείᾳ ἑπτακαίδεκα ἔτη — воцарился Иоахаз, сын Ииуя, в Самарии на семнадцать лет. Слав. добавляет «над израилем»; в гр. только «в Самарии» — в тексте イスラエルの王 по смыслу."
  2: "ἐποίησεν τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου — делал злое в очах Господа. ἐπορεύθη ὀπίσω ἁμαρτιῶν Ιεροβοαμ υἱοῦ Ναβατ — пошёл вслед грехов Иеровоама, сына Навата. ὃς ἐξήμαρτεν τὸν Ισραηλ — который ввёл Израиля в грех. οὐκ ἀπέστη ἀπ᾽ αὐτῶν — не отступил от них."
  3: "ὠργίσθη θυμῷ κύριος ἐν τῷ Ισραηλ — воспылал гневом Господь на Израиля. ἔδωκεν αὐτοὺς ἐν χειρὶ Αζαηλ βασιλέως Συρίας — предал их в руку Азаила, царя Сирии. ἐν χειρὶ υἱοῦ Αδερ υἱοῦ Αζαηλ — в руку сына Адера, сына Азаила, т. е. Венадада (ベン・ハダド). πάσας τὰς ἡμέρας — во все дни."
  4: "ἐδεήθη Ιωαχας τοῦ προσώπου κυρίου — помолился Иоахаз лицу Господа (δέομαι с род.). ἐπήκουσεν αὐτοῦ κύριος — услышал его Господь. εἶδεν τὴν θλῖψιν Ισραηλ — увидел стеснение Израиля (θλῖψις). ὅτι ἔθλιψεν αὐτοὺς βασιλεὺς Συρίας — ибо теснил их царь Сирии."
  5: "ἔδωκεν κύριος σωτηρίαν τῷ Ισραηλ — дал Господь спасение Израилю (σωτηρία; в ru «избавителя»). ἐξῆλθεν ὑποκάτωθεν χειρὸς Συρίας — вышли из-под руки Сирии. ἐκάθισαν οἱ υἱοὶ Ισραηλ ἐν τοῖς σκηνώμασιν αὐτῶν — сели сыны Израиля в шатрах своих. καθὼς ἐχθὲς καὶ τρίτης — «как вчера и третьего дня», т. е. как прежде."
  6: "πλὴν οὐκ ἀπέστησαν ἀπὸ ἁμαρτιῶν οἴκου Ιεροβοαμ — однако не отступили от грехов дома Иеровоама. ἐν αὐταῖς ἐπορεύθησαν — в них ходили. καί γε τὸ ἄλσος ἐστάθη ἐν Σαμαρείᾳ — и роща (ἄλσος, священная роща Ашеры) стояла в Самарии."
  7: "οὐχ ὑπελείφθη τῷ Ιωαχας λαὸς ἀλλ᾽ ἢ — не осталось у Иоахаза народа, кроме. πεντήκοντα ἱππεῖς καὶ δέκα ἅρματα καὶ δέκα χιλιάδες πεζῶν — пятьдесят всадников, десять колесниц и десять тысяч пеших. ἔθεντο αὐτοὺς ὡς χοῦν εἰς καταπάτησιν — обратил их в прах для попрания (χοῦς, καταπάτησις)."
  8: "τὰ λοιπὰ τῶν λόγων Ιωαχας — прочее слов Иоахаза. αἱ δυναστεῖαι αὐτοῦ — силы, деяния его (δυναστεία). ἐπὶ βιβλίῳ λόγων τῶν ἡμερῶν τοῖς βασιλεῦσιν Ισραηλ — в книге слов дней царей Израильских."
  9: "ἐκοιμήθη Ιωαχας μετὰ τῶν πατέρων αὐτοῦ — почил Иоахаз с отцами своими. ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ ἐν Σαμαρείᾳ — погребли его с отцами его в Самарии. ἐβασίλευσεν Ιωας υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Иоас, сын его, вместо него."
  10: "Ἐν ἔτει τριακοστῷ καὶ ἑβδόμῳ τῷ Ιωας βασιλεῖ Ιουδα — в тридцать седьмой год Иоаса, царя Иудейского. ἑκκαίδεκα ἔτη — шестнадцать лет."
  11: "οὐκ ἀπέστη ἀπὸ πάσης ἁμαρτίας Ιεροβοαμ — не отступил от всякого греха Иеровоама. В слав. «и отступи от всех грехов» — порча: пропущено отрицание (ср. ru «не отставал»); в тексте отрицание по гр. ἐν αὐταῖς ἐπορεύθη — в них ходил."
  12: "αἱ δυναστεῖαι αὐτοῦ, ἃς ἐποίησεν μετὰ Αμεσσιου βασιλέως Ιουδα — силы его, которые он явил с Амасией, царём Иудейским, т. е. в войне с ним."
  13: "ἐκοιμήθη Ιωας μετὰ τῶν πατέρων αὐτοῦ — почил Иоас с отцами своими. Ιεροβοαμ ἐκάθισεν ἐπὶ τοῦ θρόνου αὐτοῦ ἐν Σαμαρείᾳ μετὰ τῶν υἱῶν Ισραηλ — Иеровоам сел на престоле его в Самарии с сынами Израиля. Слав. добавляет «и погребён бысть иоас в самарии с царми израилевыми» — внесено в текст (паритет); в гр. этого нет."
  14: "ἠρρώστησεν τὴν ἀρρωστίαν αὐτοῦ, δι᾽ ἣν ἀπέθανεν — заболел своей болезнью, от которой умер. κατέβη πρὸς αὐτὸν Ιωας — пришёл к нему Иоас. ἔκλαυσεν ἐπὶ προσώπου αὐτοῦ — плакал над лицом его. Πάτερ πάτερ, ἅρμα Ισραηλ καὶ ἱππεὺς αὐτοῦ — «отче, отче, колесница Израиля и всадник его» (те же слова сказал Елисей Илии, 2:12)."
  15: "Λαβὲ τόξον καὶ βέλη — возьми лук и стрелы. ἔλαβεν πρὸς αὐτὸν τόξον καὶ βέλη — взял к себе лук и стрелы."
  16: "Ἐπιβίβασον τὴν χεῖρά σου ἐπὶ τὸ τόξον — положи, возложи руку твою на лук (ἐπιβιβάζω). ἐπέθηκεν Ελισαιε τὰς χεῖρας αὐτοῦ ἐπὶ τὰς χεῖρας τοῦ βασιλέως — возложил Елисей руки свои на руки царя."
  17: "Ἄνοιξον τὴν θυρίδα κατ᾽ ἀνατολάς — открой оконце к востоку (θυρίς). Τόξευσον — выстрели (τοξεύω). Βέλος σωτηρίας τῷ κυρίῳ καὶ βέλος σωτηρίας ἐν Συρίᾳ — стрела спасения Господу и стрела спасения в Сирии. πατάξεις τὴν Συρίαν ἐν Αφεκ ἕως συντελείας — поразишь Сирию в Афеке до конца (συντέλεια). Слав. добавляет «(царь)» — пояснительная вставка."
  18: "Λαβὲ τόξα — возьми луки (мн. ч.; слав. «возми лук»). Πάταξον εἰς τὴν γῆν — ударь по земле. ἐπάταξεν ὁ βασιλεὺς τρὶς καὶ ἔστη — ударил царь трижды и остановился."
  19: "ἐλυπήθη ἐπ᾽ αὐτῷ ὁ ἄνθρωπος τοῦ θεοῦ — опечалился о нём человек Божий (λυπέω; в ru «разгневался»). Εἰ ἐπάταξας πεντάκις ἢ ἑξάκις — если бы ты ударил пять или шесть раз. ἕως συντελείας — до полного истребления. τρὶς πατάξεις τὴν Συρίαν — трижды поразишь Сирию."
  20: "ἀπέθανεν Ελισαιε, καὶ ἔθαψαν αὐτόν — умер Елисей, и погребли его. μονόζωνοι Μωαβ — «одноопоясанные» моавитяне, т. е. лёгкие отряды (μονόζωνος; слав. «воини», ru «полчища»). ἐλθόντος τοῦ ἐνιαυτοῦ — при наступлении года, т. е. весной."
  21: "θαπτόντων τὸν ἄνδρα — когда погребали мужа. εἶδον τὸν μονόζωνον — увидели отряд. ἔρριψαν τὸν ἄνδρα ἐν τῷ τάφῳ Ελισαιε — бросили человека в гроб Елисея. ἥψατο τῶν ὀστέων Ελισαιε — коснулся костей Елисея. ἔζησεν καὶ ἀνέστη ἐπὶ τοὺς πόδας αὐτοῦ — ожил и встал на ноги свои. Слав. вставка «(и впаде тело человека мертва)» — пояснение, в гр. нет."
  22: "Αζαηλ ἐξέθλιψεν τὸν Ισραηλ πάσας τὰς ἡμέρας Ιωαχας — Азаил теснил Израиля во все дни Иоахаза."
  23: "ἠλέησεν κύριος αὐτοὺς καὶ οἰκτίρησεν — помиловал и ущедрил их Господь (ἐλεέω, οἰκτίρω). ἐπέβλεψεν πρὸς αὐτούς — призрел на них. διὰ τὴν διαθήκην αὐτοῦ τὴν μετὰ Αβρααμ καὶ Ισαακ καὶ Ιακωβ — ради завета Его с Авраамом, Исааком и Иаковом. οὐκ ἠθέλησεν κύριος διαφθεῖραι αὐτούς — не восхотел Господь погубить их. οὐκ ἀπέρριψεν αὐτοὺς ἀπὸ τοῦ προσώπου αὐτοῦ — не отверг их от лица Своего."
  24: "ἀπέθανεν Αζαηλ βασιλεὺς Συρίας — умер Азаил, царь Сирии. ἐβασίλευσεν υἱὸς Αδερ υἱὸς αὐτοῦ ἀντ αὐτοῦ — воцарился Адер, сын его, вместо него; в гр. «Адер» (אֲדַד), в тексте яп. форма ベン・ハダド по традиции."
  25: "ἐπέστρεψεν Ιωας καὶ ἔλαβεν τὰς πόλεις ἐκ χειρὸς υἱοῦ Αδερ — возвратился Иоас и взял города из руки сына Адера. ἃς ἔλαβεν ἐκ χειρὸς Ιωαχας τοῦ πατρὸς αὐτοῦ ἐν τῷ πολέμῳ — которые тот взял из руки Иоахаза, отца его, войной. τρὶς ἐπάταξεν αὐτὸν Ιωας — трижды поразил его Иоас."
