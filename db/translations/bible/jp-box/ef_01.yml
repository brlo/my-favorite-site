# jp-box, Послание к Ефесянам, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), благословение Бога за избрание,
# усыновление и искупление — один период 3–14; затем молитва о просвещении (15–23).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: [ἐν Ἐφέσῳ] (1:1) и [ὑμῶν] (1:18) стоят в базе в квадратных
# скобках, слова есть, поэтому не оборачиваются.
# Сноска ⟨…⟩ одна — 1:10 経綸 (οἰκονομία, «домостроительство»), первое место в корпусе.
# Период 3–14 не дробится: «во Христе», «в Нём», «через Него» сохранены.
# jp-ni не использовался.

