verses:
  1: "パウロ、神[かみ]の御心[みこころ]によるキリスト・イエスの使徒[しと]である。エフェソにいる聖[せい]なる者[もの]たち、すなわち、キリスト・イエスにあって信[しん]実[じつ]な者[もの]たちへ。"
  2: "{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]が、わたしたちの父[ちち]である神[かみ]と主[しゅ]イエス・キリストから、あなたがたにありますように。"
  3: "キリストにあって、天[てん]にあるすべての霊的[れいてき]な祝福[しゅくふく]をもって、わたしたちを祝福[しゅくふく]してくださった、わたしたちの主[しゅ]イエス・キリストの父[ちち]である神[かみ]が、ほめたたえられますように。"
  4: "神[かみ]は、世[よ]の創[はじ]めの前[まえ]から、キリストにあってわたしたちを選[えら]び、わたしたちが、その方[かた]の御前[みまえ]に、愛[あい]のうちに、聖[せい]く、傷[きず]のない者[もの]となるようにしてくださり、"
  5: "ご自身[じしん]の御心[みこころ]の喜[よろこ]びに従[したが]って、イエス・キリストによって、わたしたちをご自身[じしん]のもとへ子[こ]としての身分[みぶん]に迎[むか]え入[い]れるため、あらかじめ予定[よてい]しておられたのである。"
  6: "それは、愛[あい]された者[もの]のうちにわたしたちに豊[ゆた]かに与[あた]えられた、その方[かた]の{恵[めぐ]み|恩寵[おんちょう]}の栄光[えいこう]が、ほめたたえられるためである。"
  7: "この方[かた]にあって、わたしたちは、その血[ち]によって贖[あがな]い、すなわち、背[そむ]きの赦[ゆる]しを得[え]ている。それは、その{恵[めぐ]み|恩寵[おんちょう]}の豊[ゆた]かさに従[したが]ってのことであり、"
  8: "神[かみ]は、あらゆる知恵[ちえ]と悟[さと]りとをもって、この恵[めぐ]みをわたしたちに満[み]ちあふれさせ、"
  9: "御心[みこころ]の奥義[おうぎ]をわたしたちに知[し]らせてくださったのである。それは、キリストにあってあらかじめ定[さだ]めておられた御心[みこころ]の喜[よろこ]びに従[したが]ったものであり、"
  10: "時[とき]の満[み]ちるに及[およ]んでの経綸[けいりん]⟨神[かみ]が、キリストにあって、ご自身[じしん]の救[すく]いのご計画[けいかく]を世[よ]に実現[じつげん]していく取[と]り計[はか]らい。⟩、すなわち、天[てん]にあるものも地[ち]にあるものも、すべてをキリストにあって一つに集[あつ]めることである。"
  11: "この方[かた]にあって、わたしたちも、すべてをご自身[じしん]の御心[みこころ]のままに行[おこな]われる方[かた]のご計画[けいかく]に従[したが]って、あらかじめ予定[よてい]された者[もの]として、嗣業[しぎょう]を受[う]ける者[もの]とされたのである。"
  12: "それは、キリストにあって先[さき]に希望[きぼう]を置[お]いたわたしたちが、その方[かた]の栄光[えいこう]をほめたたえる者[もの]となるためである。"
  13: "この方[かた]にあって、あなたがたもまた、真理[しんり]の言葉[ことば]、すなわち、あなたがたの救[すく]いの福音[ふくいん]を聞[き]き、この方[かた]にあって信[しん]じたとき、約束[やくそく]の{聖霊[せいれい]|聖神[せいしん]}によって印[いん]を押[お]されたのである。"
  14: "この霊[れい]は、ご自身[じしん]の所有[しょゆう]の贖[あがな]いが成[な]し遂[と]げられ、その方[かた]の栄光[えいこう]がほめたたえられるために、わたしたちの嗣業[しぎょう]の保証[ほしょう]として与[あた]えられているのである。"
  15: "そこで、わたしも、あなたがたの間[あいだ]にある、主[しゅ]イエスに対する信仰[しんこう]と、すべての聖[せい]なる者[もの]たちに対する愛[あい]とを聞[き]いて、"
  16: "あなたがたのために感謝[かんしゃ]することをやめず、わたしの祈[いの]りの中[なか]であなたがたを覚[おぼ]えている。"
  17: "どうか、わたしたちの主[しゅ]イエス・キリストの神[かみ]、栄光[えいこう]の父[ちち]が、あなたがたに、ご自身[じしん]を知[し]るための知恵[ちえ]と啓示[けいじ]との霊[れい]をお与[あた]えになり、"
  18: "あなたがたの心[こころ]の目[め]が明[あき]らかにされて、あなたがたが、その召[め]しの希望[きぼう]とは何[なに]か、聖[せい]なる者[もの]たちの間[あいだ]にある、その嗣業[しぎょう]の栄光[えいこう]の富[とみ]とは何[なに]か、"
  19: "また、信[しん]じるわたしたちに対して働[はたら]く、その力[ちから]の比類[ひるい]のない偉大[いだい]さとは何[なに]かを、知[し]るようになるためである。それは、その力強[ちからづよ]い権能[けんのう]の働[はたら]きに従[したが]ったものであり、"
  20: "神[かみ]は、この力[ちから]をキリストのうちに働[はたら]かせ、キリストを死者[ししゃ]の中[なか]から復活[ふっかつ]させ、天[てん]において、ご自身[じしん]の右[みぎ]に座[すわ]らせられた。"
  21: "すべての支配[しはい]、権威[けんい]、力[ちから]、主権[しゅけん]の上[うえ]に、また、この世[よ]においてだけでなく、来[きた]るべき世[よ]においても唱[とな]えられるすべての名[な]の上[うえ]に、キリストを置[お]かれたのである。"
  22: "そして、すべてのものをキリストの足[あし]の下[した]に従[したが]わせ、キリストを、すべてのものの上[うえ]に立[た]つ頭[かしら]として、教会[きょうかい]にお与[あた]えになったのである。"
  23: "教会[きょうかい]はキリストの体[からだ]であり、すべてのものをすべてのうちに満[み]たしておられる方[かた]の満[み]ちあふれである。"

notes:
  1: "Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ — без глагола, порядок «Христос Иисус»: キリスト・イエス (ср. 2 Кор 1:1). διὰ θελήματος θεοῦ — 神の御心による. В базе [ἐν Ἐφέσῳ] в квадратных скобках — слово есть, 〔〕 не ставятся: エフェソにいる. πιστοῖς ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにあって信実な者たち."
  2: "χάρις ὑμῖν καὶ εἰρήνη — 恵みと平和, формула приветствия (Рим 1:7; 1 Кор 1:3)."
  3: "εὐλογητός — ほめたたえられますように (благословение, а не «благословен» как титул). Относительное придаточное ὁ εὐλογήσας вынесено вперёд: по-японски определение стоит перед 神が. ἐν τοῖς ἐπουρανίοις — 天にある; ἐν Χριστῷ — キリストにあって. Начало периода 3–14."
  4: "καθὼς ἐξελέξατο — 神は…選び (καθώς как продолжение благословения, не «подобно»). πρὸ καταβολῆς κόσμου — 世の創めの前. εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους — 聖く、傷のない者. ἐν ἀγάπῃ оставлено при «なる»; в греч. может относиться и к 5 ст. — двусмысленность не разрешена."
  5: "προορίσας — あらかじめ予定しておられた. υἱοθεσία — 子としての身分. εἰς αὐτόν — ご自身のもとへ. κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ — 御心の喜びに従って."
  6: "εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ — その恵みの栄光がほめたたえられるため. ἧς ἐχαρίτωσεν ἡμᾶς — 豊かに与えられた. ὁ ἠγαπημένος — 愛された者 (титул Христа; «Сын» не добавлен)."
  7: "ἀπολύτρωσις — 贖い. ἄφεσις τῶν παραπτωμάτων — 背きの赦し (παράπτωμα — 背き, ср. 2:1). κατὰ τὸ πλοῦτος τῆς χάριτος — 恵みの豊かさに従って."
  8: "ἐπερίσσευσεν εἰς ἡμᾶς — 満ちあふれさせ. σοφία καὶ φρόνησις — 知恵と悟り."
  9: "γνωρίσας ἡμῖν — 知らせてくださった. ὃ προέθετο ἐν αὐτῷ — キリストにあってあらかじめ定めておられた (προτίθεμαι — полагать, определять)."
  10: "οἰκονομία — 経綸 («домостроительство»), сноска при первом месте в корпусе. ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ — すべてをキリストにあって一つに集める (ἀνακεφαλαιόω — возглавить, собрать воедино). τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς — 天にあるものも地にあるものも."
  11: "ἐκληρώθημεν — 嗣業を受ける者とされた. προορισθέντες — あらかじめ予定された者として. κατὰ πρόθεσιν — ご計画に従って; βουλὴ τοῦ θελήματος αὐτοῦ — 御心のまま (два разных слова: πρόθεσις и βουλή)."
  12: "τοὺς προηλπικότας ἐν τῷ Χριστῷ — キリストにあって先に希望を置いた者たち. εἰς ἔπαινον δόξης — 栄光をほめたたえる者となるため."
  13: "τὸν λόγον τῆς ἀληθείας — 真理の言葉. τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν — あなたがたの救いの福音. Два ἐν ᾧ сохранены: この方にあって…この方にあって. ἐσφραγίσθητε — 印を押された. πνεῦμα τῆς ἐπαγγελίας τὸ ἅγιον — 約束の聖霊: {聖霊|聖神} (калька)."
  14: "ἀρραβών — 保証 (залог, ср. 2 Кор 1:22). περιποίησις — 所有 (приобретённое владение); ご自身の所有の贖い. εἰς ἔπαινον τῆς δόξης αὐτοῦ — その方の栄光がほめたたえられるため. Конец периода 3–14."
  15: "Διὰ τοῦτο κἀγώ — そこで、わたしも. τὴν καθ᾿ ὑμᾶς πίστιν — あなたがたの間にある信仰. τὴν ἀγάπην τὴν εἰς πάντας τοὺς ἁγίους — すべての聖なる者たちに対する愛. Стих обрывается на причастии — сказуемое в 16 ст."
  16: "οὐ παύομαι εὐχαριστῶν — 感謝することをやめず. μνείαν ποιούμενος ἐπὶ τῶν προσευχῶν μου — 祈りの中で覚えている. ἐπὶ τῶν προσευχῶν — «в молитвах моих»."
  17: "ἵνα δώῃ — どうか…お与えになり. ὁ πατὴρ τῆς δόξης — 栄光の父. πνεῦμα σοφίας καὶ ἀποκαλύψεως — 知恵と啓示との霊. ἐν ἐπιγνώσει αὐτοῦ — ご自身を知るための (ἐπίγνωσις — полное знание)."
  18: "πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας — 心の目が明らかにされて. В базе [ὑμῶν] — слово есть, 〔〕 не ставятся. τίς ἡ ἐλπὶς τῆς κλήσεως — 召しの希望とは何か. ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας — 嗣業の栄光の富. ἐν τοῖς ἁγίοις — 聖なる者たちの間にある."
  19: "τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως — 比類のない偉大さ. εἰς ἡμᾶς τοὺς πιστεύοντας — 信じるわたしたちに対して. κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος — 力強い権能の働きに従って."
  20: "ἐνήργησεν ἐν τῷ Χριστῷ — キリストのうちに働かせ. ἐγείρας ἐκ νεκρῶν — 死者の中から復活させ. καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις — 天において、ご自身の右に座らせ."
  21: "ἀρχή, ἐξουσία, δύναμις, κυριότης — 支配、権威、力、主権 (четыре чина сохранены). ὀνόματος ὀνομαζομένου — 唱えられる名. οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι — この世においてだけでなく、来るべき世においても."
  22: "ὑπέταξεν ὑπὸ τοὺς πόδας — 足の下に従わせ (Пс 8:7; вводится без формулы цитаты, поэтому 「」 нет). κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ — すべてのものの上に立つ頭として、教会にお与えになった."
  23: "πλήρωμα — 満ちあふれ. τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου — すべてのものをすべてのうちに満たしておられる方 (средний залог; не сглажено в «исполняемый»)."
