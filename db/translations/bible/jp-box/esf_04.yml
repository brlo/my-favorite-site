# jp-box, Есфирь, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: Мардохей в вретище и плач Иудеев (1–3), Есфирь и евнух Афратайос:
# расспросы, ответ Мардохея, одежды (4–9), обмен речами о входе к царю (10–14),
# «если погибну, погибну» (15–16), молитвы Мардохея и Есфири — Добавление C (17).
# Прямая речь — 「…」 (8, 10–11, 13–14, 15–16); в ст. 17 две молитвы в 「…」,
# вложенной речи в них нет, поэтому 『…』 не ставится. Красного и синего нет.
# Нумерация по gr: 17 стихов. Особенность модуля: в ст. 17 влито Добавление C
# (подстихи 17a–17z, ~3695 знаков греч.); переведено внутри ст. 17, стиха 18 нет.
# csl делит иначе: csl 4:17 = молитва Мардохея, csl 4:18 = вопль Израиля, Есфирь
# в одеждах скорби и её молитва; наш 4:17 = csl 4:17 + csl 4:18.
# Дефект модуля: 4:6 в gr-lxx-byz стоит как «.» (текст потерян); переведён по LXX
# и ru, в слав. этот стих — только окончание ст. 5.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX):
# Афратайос (Αχραθαῖος; слав. «ахрафей», Син. «Гафах» — с масоретского).

