verses:
  1: "モルデカイは、起[お]こっていることを知[し]って、自分[じぶん]の衣[ころも]を裂[さ]き、粗布[あらぬの]をまとって灰[はい]をかぶり、町[まち]の広場[ひろば]へ跳[と]び出[だ]し、大[おお]きな苦[にが]い声[こえ]で叫[さけ]んだ。「何[なん]の不正[ふせい]も犯[おか]していない民[たみ]が、奪[うば]い去[さ]られようとしている。」"
  2: "そして王[おう]の門[もん]まで来[き]て立[た]ち止[ど]まった。粗布を身[み]につけ、灰をかぶったままでは、王の庭[にわ]に入[はい]ることは許[ゆる]されていなかったからである。"
  3: "また、その文書[ぶんしょ]が掲[かか]げられたすべての地方[ちほう]で、ユダヤ人[じん]たちには叫[さけ]びと泣[な]き声[ごえ]と大[おお]きな悲[かな]しみがあった。彼らは自分[じぶん]のために粗布と灰を敷[し]いた。"
  4: "王妃[おうひ]の女中[じょちゅう]たちと宦官[かんがん]たちが来[き]て彼女[かのじょ]に告[つ]げた。彼女は起[お]こったことを聞[き]いて心[こころ]を乱[みだ]し、モルデカイに衣を着[き]せて粗布を脱[ぬ]がせようと人[ひと]を遣[つか]わしたが、彼は応[おう]じなかった。"
  5: "エステルは、自分[じぶん]に仕[つか]えている宦官[かんがん]アフラタイオスを呼[よ]び寄[よ]せ、モルデカイのもとから事[こと]の次第[しだい]を確[たし]かめさせるために彼[かれ]を遣[つか]わした。"
  6: "アフラタイオスは出[で]て行[い]き、王[おう]の門[もん]の前[まえ]にある町[まち]の広場[ひろば]でモルデカイに会[あ]った。"
  7: "モルデカイは彼に、自分[じぶん]の身[み]に起[お]こったことと、アマンがユダヤ人[じん]を滅[ほろ]ぼすために王[おう]に約束[やくそく]した、銀[ぎん]一万[いちまん]タラントを宝物庫[ほうもつこ]に納[おさ]めるという約束とを告[つ]げた。"
  8: "また、彼らを滅ぼすためにスサで掲[かか]げられた布告[ふこく]の写[うつ]しを彼に渡[わた]してエステルに見[み]せさせ、彼女[かのじょ]にこう命[めい]じるように言[い]いつけた。「王[おう]のところへ入[はい]り、王に嘆願[たんがん]して民[たみ]のことを願[ねが]い出[で]よ。自分[じぶん]の低[ひく]められた日々[ひび]を、わたしの手[て]で養[やしな]われたことを思[おも]い起[お]こして。アマンは王に次[つ]ぐ者[もの]として、わたしたちに反[はん]して死[し]を語[かた]ったからである。主[しゅ]を呼[よ]び求[もと]め、王にわたしたちのことを語り、わたしたちを死から救[すく]い出[だ]せ。」"
  9: "アフラタイオスは入[はい]って行[い]き、これらの言葉[ことば]をすべて彼女[かのじょ]に告[つ]げた。"
  10: "エステルはアフラタイオスに言[い]った。「モルデカイのもとへ行[い]って、こう言[い]いなさい。"
  11: "王国[おうこく]のすべての民[たみ]は、男[おとこ]でも女[おんな]でも、召[め]されずに王[おう]のところの内庭[うちにわ]に入[はい]る者[もの]には救[すく]いがないことを知[し]っている。ただ、王が金[きん]の王笏[おうしゃく]を差[さ]し伸[の]べる者だけが救われる。わたしは王のところへ入るよう召されていない。すでに三十日[さんじゅうにち]になる。」"
  12: "アフラタイオスはエステルの言葉[ことば]をすべてモルデカイに告[つ]げた。"
  13: "モルデカイはアフラタイオスに言[い]った。「行[い]って、彼女[かのじょ]にこう言いなさい。エステルよ、王国[おうこく]の中[なか]にいても、すべてのユダヤ人[じん]と違[ちが]って自分[じぶん]だけが助[たす]かるなどと、自分に言[い]ってはならない。"
  14: "この時[とき]に聞[き]き従[したが]わないなら、ユダヤ人[じん]にはほかのところから助[たす]けと覆[おお]いが起[お]こるが、あなたとあなたの父[ちち]の家[いえ]は滅[ほろ]びる。あなたがこの時のために王位[おうい]に就[つ]いたのかどうか、だれが知[し]っているだろうか。」"
  15: "エステルは、自分[じぶん]のもとへ来[き]た者[もの]をモルデカイのもとへ遣[つか]わして言[い]った。"
  16: "「行[い]って、スサにいるユダヤ人[じん]たちを集[あつ]め、わたしのために断食[だんじき]しなさい。三日[みっか]の間[あいだ]、夜[よる]も昼[ひる]も食[た]べることも飲[の]むこともしてはならない。わたしも女中[じょちゅう]たちも同[おな]じように食[しょく]を断[た]つ。そしてそののち、法[ほう]に反[はん]してでも王[おう]のところへ入[はい]る。もし滅[ほろ]びるなら、滅びよう。」"
  17: "モルデカイは行[い]って、エステルが自分[じぶん]に命[めい]じたすべてのことを行[おこな]った。そして主[しゅ]に祈[いの]り、主のわざをすべて思[おも]い起[お]こして言[い]った。「主よ、主よ、すべてを支配[しはい]される王[おう]よ。すべてはあなたの権威[けんい]のうちにあり、あなたがイスラエルを救[すく]おうと望[のぞ]まれるとき、あなたに逆[さか]らって思[おも]い計[はか]る者[もの]はいない。あなたは天[てん]と地[ち]、また天の下[した]で驚[おどろ]くべきものすべてを造[つく]り、すべての主であられる。主であるあなたに立[た]ち向[む]かう者はいない。あなたはすべてを知[し]っておられる。主よ、あなたはご存[ぞん]じである。わたしが高[たか]ぶるアマンを拝[おが]まなかったのは、傲慢[ごうまん]からでも、誇[ほこ]りからでも、虚栄[きょえい]からでもない。わたしはイスラエルの救[すく]いのためなら、喜[よろこ]んで彼[かれ]の足[あし]の裏[うら]に口[くち]づけしようと願[ねが]っていたからである。しかし、わたしがこれをしたのは、人[ひと]の栄光[えいこう]を神[かみ]の栄光より上[うえ]に置[お]かず、わが主であるあなた以外[いがい]にだれをも拝まず、高[たか]ぶってこれらのことを行[おこな]わないためであった。そして今[いま]、主よ、神よ、王よ、アブラハムの神よ、あなたの民[たみ]を惜[お]しんでください。彼らはわたしたちに滅びを目論[もくろ]んで見張[みは]り、初[はじ]めからのあなたの嗣業[しぎょう]を滅ぼすことを望[のぞ]んでいるからである。あなたがご自分[じぶん]のためにエジプトの地から贖[あがな]い出[だ]された、あなたの分[わ]け前[まえ]を見捨[みす]てないでください。わたしの願[ねが]いを聞[き]き、あなたのくじをあわれみ、わたしたちの悲[かな]しみを酒宴[しゅえん]に変[か]えてください。そうすれば、わたしたちは生[い]きて、主よ、あなたの名[な]をほめ歌[うた]う。あなたを賛美[さんび]する者[もの]の口[くち]を、滅ぼさないでください。」イスラエルは皆[みな]、自分[じぶん]の力[ちから]の限[かぎ]りを尽[つ]くして叫[さけ]んだ。彼らの死[し]が目[め]の前[まえ]にあったからである。王妃[おうひ]エステルは死の苦[くる]しみに捕[と]らえられて主に逃[に]れ、自分の栄光の衣[ころも]を脱[ぬ]いで、狭[せま]くるしさと悲しみの衣をまとい、高[たか]ぶった香料[こうりょう]に代[か]えて灰[はい]と汚物[おぶつ]で自分の頭[あたま]を満[み]たし、自分の体[からだ]をひどく低[ひく]くし、自分の喜[よろこ]びの飾[かざ]りであったすべての場所[ばしょ]を、自分の引[ひ]きちぎった髪[かみ]で満たした。そして、イスラエルの神である主に祈って言った。「わが主よ、われらの王よ、あなただけがおられる。助[たす]け手[て]がなく、あなたのほかに助けのない、ただひとりのわたしを助[たす]けてください。わたしの危険[きけん]はわたしの手[て]のうちにあるからである。わたしは生[う]まれたときから、自分の父[ちち]の一族[いちぞく]のうちで、主よ、あなたがすべての民[たみ]の中からイスラエルを、すべての先祖[せんぞ]の中からわたしたちの父たちを選[えら]んで永遠[えいえん]の嗣業とされたこと、また、あなたが彼らに語[かた]られたことをすべて行[おこな]われたことを聞[き]いてきた。そして今、わたしたちはあなたの前[まえ]に罪[つみ]を犯[おか]した。あなたはわたしたちを敵[てき]の手に渡[わた]された。わたしたちが彼らの神々[かみがみ]に栄光を帰[き]したからである。主よ、あなたは正[ただ]しい。そして今、彼らはわたしたちの奴隷[どれい]の苦しみをもってしても足[た]りず、あなたの口の定[さだ]めを取[と]り除[のぞ]き、あなたの嗣業を滅ぼし、あなたを賛美する者の口をふさぎ、あなたの家[いえ]の栄光とあなたの祭壇[さいだん]の栄光を消[け]し、諸国[しょこく]の口を開[ひら]いてむなしい者たちの徳[とく]を語[かた]らせ、肉[にく]なる王を永遠にたたえさせようとして、自分たちの偶像[ぐうぞう]の手の上[うえ]に自分たちの手を置[お]いた。主よ、あなたの王笏[おうしゃく]を、存在[そんざい]しない者たちに渡[わた]さないでください。わたしたちが倒[たお]れるのを彼らに嘲笑[あざわら]わせないでください。むしろ、彼らの計略[けいりゃく]を彼ら自身[じしん]の上に返[かえ]し、わたしたちに事[こと]を始[はじ]めた者を見[み]せしめにしてください。主よ、思[おも]い起[お]こしてください。わたしたちの苦難[くなん]の時[とき]に、あなたご自身を知[し]らせてください。そして、わたしに勇気[ゆうき]を与[あた]えてください。神々の王、すべての支配[しはい]を治[おさ]めておられる方[かた]よ。獅子[しし]の前[まえ]で、わたしの口によく整[ととの]った言葉[ことば]を与え、わたしたちと戦[たたか]う者への憎[にく]しみへと彼[かれ]の心[こころ]を変[か]え、彼と、彼に同調[どうちょう]する者たちを滅ぼし尽[つ]くしてください。そして、わたしたちをあなたの手で救い出し、あなたのほかに助けのない、ただひとりのわたしを助けてください、主よ。あなたはすべてのことを知っておられ、わたしが不法[ふほう]な者たちの栄光を憎[にく]み、無割礼[むかつれい]の者たちの床[とこ]、またすべての他国人[たこくじん]の床を忌[い]み嫌[きら]っていることをご存じである。あなたはわたしの苦しみを知っておられる。わたしは自分の高ぶりのしるし、すなわち、わたしが現[あらわ]れる日々[ひび]に頭にあるものを忌み嫌っている。わたしはそれを月経[げっけい]の布[ぬの]のように忌み嫌い、自分の静[しず]かな日々にはそれを身[み]につけていない。あなたのはしためはアマンの食卓[しょくたく]のものを食[た]べず、王の宴[うたげ]を尊[とうと]ばず、注[そそ]ぎ物[もの]の酒[さけ]も飲[の]まなかった。あなたのはしためは、自分の身に変[か]わりが生[しょう]じた日から今に至[いた]るまで、あなたによって以外には喜[よろこ]んだことがない。主よ、アブラハムの神よ。すべての者に対して力[ちから]をお持ちの神よ、望[のぞ]みを失[うしな]った者たちの声[こえ]を聞き、悪[あく]を行[おこな]う者たちの手からわたしたちを救い出してください。そして、わたしをわたしの恐[おそ]れから救い出してください。」"

notes:
  1: "ἐπιγνοὺς τὸ συντελούμενον — «узнав о совершающемся» (ἐπιγινώσκω, συντελέω). διέρρηξεν τὰ ἱμάτια αὐτοῦ — «разодрал одежды свои». σάκκος — 粗布, σποδός — 灰. ἐκπηδήσας διὰ τῆς πλατείας τῆς πόλεως — «выскочив через широкую улицу города» (πλατεῖα — 広場, как в Иудифи; слав. «в пространную улицу града»). Αἴρεται ἔθνος μηδὲν ἠδικηκός — «уносится народ, ничего не обидевший» (αἴρω — «уносить, уничтожать»; слав. «взимается род ничтоже преступивый»). Слав. добавляет «и горьким» к воплю — в LXX этого нет, по паритету оставлено в основном тексте (苦い声)."
  2: "πύλη τοῦ βασιλέως — ворота царя. οὐ γὰρ ἦν ἐξὸν αὐτῷ — «ибо нельзя было ему» (ἔξεστι — «позволено»). αὐλή — 庭, двор (слав. «двор»). σάκκον ἔχοντι καὶ σποδόν — «имеющему на себе вретище и пепел»: дательный причастный оборот при εἰσελθεῖν, передан придаточным с ままでは."
  3: "ἐν πάσῃ χώρᾳ, οὗ ἐξετίθετο τὰ γράμματα — «во всякой области, где выставлялись письмена», т. е. список царского указа (γράμματα, 文書; слав. «писания»). κραυγὴ καὶ κοπετὸς καὶ πένθος μέγα — «крик, и плач, и печаль великая». σάκκον καὶ σποδὸν ἔστρωσαν ἑαυτοῖς — «постлали себе вретище и пепел» (στρώννυμι — «стелить»). Синодальный добавляет «пост» — этого нет ни в LXX, ни в слав., в текст не внесено."
  4: "αἱ ἅβραι καὶ οἱ εὐνοῦχοι τῆς βασιλίσσης — служанки и евнухи царицы (ἅβρα — 女中, ср. в корпусе 女中[おんなちゅう]). ἐταράχθη — «смутилась» (ταράσσω). ἀπέστειλεν στολίσαι — «послала одеть» (στολίζω — «облачать»; слав. «посла ризы облещи»). ὁ δὲ οὐκ ἐπείσθη — «он же не послушался» (πείθω)."
  5: "Αχραθαῖος — アフラタイオス (греч. форма; слав. «ахрафей», Синодальный «Гафах» — с масоретского אֲתָךְ, у нас не используется). ὃς παρειστήκει αὐτῇ — «который предстоял ей» (παρίστημι). ἀπέστειλεν μαθεῖν αὐτῇ παρὰ τοῦ Μαρδοχαίου τὸ ἀκριβές — «послал узнать для неё от Мардохея точное» (τὸ ἀκριβές — «достоверное»)."
  6: "Дефект модуля: в gr-lxx-byz на месте стиха стоит «.» (текст потерян), как 9:5 и 9:30. Переведено по LXX (ὁ δὲ Ἀχραθαῖος ἐξῆλθεν πρὸς Μαρδοχαῖον εἰς τὴν πλατεῖαν τῆς πόλεως τὴν ἀπέναντι τῆς πύλης τοῦ βασιλέως) и ru. В слав. этот стих — лишь окончание ст. 5 («и посла его уведати от мардохеа истину»), поэтому в текст не внесён повторно. 〔…〕 не ставится: стих входит в церковную нумерацию, а сам текст — LXX."
  7: "ὑπέδειξεν αὐτῷ τὸ γεγονός — «показал ему происшедшее» (ὑποδείκνυμι — «показывать, излагать»). τὴν ἐπαγγελίαν ἣν ἐπηγγείλατο Αμαν τῷ βασιλεῖ — «обещание, которое обещал Аман царю» (ἐπαγγελία/ἐπαγγέλλομαι; тавтология греч. сохранена). εἰς τὴν γάζαν ταλάντων μυρίων — «в казну [внести] десять тысяч талантов» (γάζα — «сокровищница»; слав. «в сокровищный дом десять тысящ талант сребра»)."
  8: "τὸ ἀντίγραφον τὸ ἐν Σούσοις ἐκτεθέν — «список, выставленный в Сузах» (ἀντίγραφον — 写し, ἐκτίθημι — «выставлять»). ἐντείλασθαι αὐτῇ — «повелеть ей» (ἐντέλλομαι). εἰσελθούσῃ παραιτήσασθαι τὸν βασιλέα — «войдя, умолить царя» (παραιτέομαι). μνησθεῖσα ἡμερῶν ταπεινώσεώς σου ὡς ἐτράφης ἐν χειρί μου — «вспомнив дни уничижения твоего, как ты была вскормлена в руке моей»: в греч. внутри косвенной речи стоит обращение к Есфири во 2-м лице (μνησθεῖσα, ἐτράφης), так же в слав. («поминаюши дни смирения твоего, како воспитана еси в руце моей»), поэтому передано прямой речью в 「…」. ἐπικάλεσαι τὸν κύριον … ῥῦσαι ἡμᾶς ἐκ θανάτου — «призови Господа… избавь нас от смерти» (императивы 2 л. ед. ч.)."
  9: "εἰσελθὼν δὲ ὁ Αχραθαῖος ἐλάλησεν αὐτῇ — «войдя же, Афратайос сказал ей». πάντας τοὺς λόγους τούτους — «все слова эти»."
  10: "εἶπεν δὲ Εσθηρ πρὸς Αχραθαῖον — «сказала же Есфирь Афратайосу». Πορεύθητι πρὸς Μαρδοχαῖον καὶ εἰπὸν ὅτι — «пойди к Мардохею и скажи, что»: в греч. при ὅτι косвенная речь, но содержание (ст. 11) — от 1-го лица, поэтому в тексте прямая речь 「…」, открытая здесь и закрытая в конце ст. 11."
  11: "τὰ ἔθνη πάντα τῆς βασιλείας γινώσκει — «все народы царства знают» (γινώσκει ед. ч. при ср. мн. подлежащем). αὐλὴ ἡ ἐσωτέρα — внутренний двор (内庭). ἄκλητος — «незваный». οὐκ ἔστιν αὐτῷ σωτηρία — «нет ему спасения». ῥάβδος χρυσῆ — 金の王笏 (ῥάβδος; σκῆπτρον стоит в 5:2 и 8:4). κἀγὼ οὐ κέκλημαι — «и я не звана». εἰσὶν αὗται ἡμέραι τριάκοντα — «вот уже тридцать дней» (букв. «эти [суть] дни тридцать»; слав. «се уже тридесять дний»)."
  12: "ἀπήγγειλεν — «возвестил» (ἀπαγγέλλω). πάντας τοὺς λόγους Εσθηρ — «все слова Есфири»."
  13: "μὴ εἴπῃς σεαυτῇ ὅτι σωθήσῃ — «не скажи в себе, что спасёшься»: в греч. и слав. («да не речеши в себе, яко ты едина спасешися») это косвенная речь, поэтому без 『…』. μόνη ἐν τῇ βασιλείᾳ παρὰ πάντας τοὺς Ιουδαίους — «одна в царстве сверх всех Иудеев» (παρά с вин. — «в сравнении с»)."
  14: "ὡς ὅτι ἐὰν παρακούσῃς ἐν τούτῳ τῷ καιρῷ — «ибо если не послушаешь в это время» (παρακούω — «ослушаться»; слав. «аще преслушаеши»). ἄλλοθεν βοήθεια καὶ σκέπη — «от иного места помощь и покров» (σκέπη — 覆い). ἀπολεῖσθε — «погибнете» (2 л. мн., хотя подлежащее «ты и дом отца твоего»; в переводе — 滅びる). τίς οἶδεν εἰ εἰς τὸν καιρὸν τοῦτον ἐβασίλευσας — «кто знает, не для этого ли времени ты воцарилась» (βασιλεύω)."
  15: "ἐξαπέστειλεν Εσθηρ τὸν ἥκοντα πρὸς αὐτήν — «послала Есфирь пришедшего к ней» (ἥκω — «приходить»), т. е. Афратайоса. λέγουσα — «говоря»: речь открывается здесь и продолжается в ст. 16 (одна цитата на два стиха)."
  16: "Βαδίσας ἐκκλησίασον — «пойдя, созови собрание» (ἐκκλησιάζω; слав. «шед собери»). νηστεύσατε ἐπ᾽ ἐμοί — «поститесь обо мне». ἐπὶ ἡμέρας τρεῖς νύκτα καὶ ἡμέραν — «три дня, ночь и день». ἀσιτήσομεν — «будем не есть» (ἀσιτέω; слав. «не имамы ясти»). παρὰ τὸν νόμον — «вопреки закону». ἐὰν καὶ ἀπολέσθαι με ᾖ — «если и погибнуть мне»; слав. «аще и погибнути ми приключится» — もし滅びるなら、滅びよう."
  17: "Ст. 17 = основной ст. 17 («И пошёл Мардохей и сделал, что заповедала ему Есфирь») + Добавление C целиком; подстихи 17a–17z в текст не выводятся. Состав: 17a — вступление («помолился Господу, вспоминая все дела Господни»), 17b–17h — молитва Мардохея, 17i — вопль всего Израиля, 17k — Есфирь в одеждах скорби, 17l–17z — молитва Есфири. Слав. делит иначе: csl 4:17 = молитва Мардохея (до «…уст восхваляющих Тя, Господи»), csl 4:18 = вопль Израиля, Есфирь и её молитва; наш 4:17 = csl 4:17 + csl 4:18, отдельного ст. 18 нет. В молитвах назван только Авраам (17f, 17y: ὁ θεὸς Αβρααμ); Исаак, Иаков, Иосиф и Моисей в этом греческом тексте не упоминаются. κληρονομία — 嗣業 (17f, 17m, 17o), μερίς — 分け前 (17g), κλῆρος — くじ (17h, о народе, данном Богу в удел). εὐωχία — 酒宴 (17h). σποδοῦ καὶ κοπριῶν (17k) — 灰と汚物 (κοπρία — «навоз, сор»; слав. «пепелом и гноем»). ῥάκος καταμηνίων (17w) — 月経の布 (слав. «рубища осквернена», Син. «одежды, осквернённой кровью»); στρεπτῶν τριχῶν (17k) — 引きちぎった髪 (στρεπτός — «скрученный, витой»; слав. «растерзанными»). λόγον εὔρυθμον (17s) — よく整った言葉 (εὔρυθμος, «складный»; слав. «слово благоугодно»). В 17o δόξαν οἴκου σου καὶ θυσιαστήριόν σου — при втором члене подразумеваются σβέσαι и δόξα, в переводе 栄光 повторено. Кавычки: обе молитвы — 「…」 первого уровня, вложенной речи в них нет, поэтому 『…』 не ставится. Красного и синего нет."
