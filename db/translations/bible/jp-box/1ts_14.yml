verses:
  1: "ある日[ひ]、サウルの子[こ]ヨナタンは、自分[じぶん]の武具[ぶぐ]を運[はこ]ぶ若[わか]い者[もの]に言[い]った。「さあ、向[む]こう側[がわ]にいるペリシテ人[じん]の陣[じん]へ渡[わた]ろう。」しかし、父[ちち]には知[し]らせなかった。"
  2: "サウルはマグドンのざくろの木[き]の下[した]、丘[おか]の端[はし]に座[すわ]っていた。彼[かれ]とともにいた者[もの]は六百人[にん]ほどであった。"
  3: "アヒヤは、イカボドの兄弟[きょうだい]であるアヒトブの子[こ]で、ピネハスの子[こ]、エリの子[こ]であった。彼[かれ]はシロで神[かみ]の祭司[さいし]を務[つと]めてエフォドを着[き]ていた。民[たみ]はヨナタンが行[い]ったことを知[し]らなかった。"
  4: "ヨナタンがペリシテ人[じん]の陣[じん]へ渡[わた]ろうとした渡[わた]り口[ぐち]の間[あいだ]には、こちら側[がわ]にとがった岩[いわ]、あちら側[がわ]にもとがった岩[いわ]があった。一[ひと]つの名[な]はバゼス、もう一[ひと]つの名はセンナといった。"
  5: "一方[いっぽう]の道[みち]は北[きた]からマヘマスへ、もう一方[いっぽう]の道は南[みなみ]からギベアへ通[かよ]っていた。"
  6: "ヨナタンは自分[じぶん]の武具[ぶぐ]を運[はこ]ぶ若[わか]い者[もの]に言[い]った。「さあ、この無割礼[むかつれい]の者[もの]たちの陣[じん]へ渡[わた]ろう。主[しゅ]がわたしたちのために何[なに]かをしてくださるかもしれない。主[しゅ]にとって、多[おお]くの者[もの]でも少[すく]ない者[もの]でも救[すく]うことは難[むずか]しいことではないからだ。」"
  7: "武具[ぶぐ]を運[はこ]ぶ者[もの]は彼[かれ]に言[い]った。「あなたの心[こころ]が向[む]かうことは何[なん]でもしてください。見[み]よ、わたしはあなたとともにいる。あなたの心[こころ]がわたしの心[こころ]だ。」"
  8: "ヨナタンは言[い]った。「見[み]よ、わたしたちはあの人[ひと]たちのところへ渡[わた]り、彼[かれ]らの前[まえ]に現[あらわ]れる。"
  9: "もし彼[かれ]らがわたしたちに『そこに立[た]って、わたしたちが知[し]らせるまで待[ま]て』と言[い]うなら、わたしたちはその場[ば]に立[た]ったまま、彼[かれ]らのところへ上[のぼ]らない。"
  10: "しかし、もし『わたしたちのところへ上[のぼ]って来[こ]い』と言うなら、わたしたちは上[のぼ]る。主[しゅ]が彼[かれ]らをわたしたちの手[て]に渡[わた]されたからだ。これがわたしたちへのしるしとなる。」"
  11: "二人[ふたり]はともにペリシテ人[じん]の陣[じん]へ入[はい]った。ペリシテ人[じん]は言[い]った。「見[み]よ、ヘブライ人[じん]が、身[み]を隠[かく]していた穴[あな]から出[で]て来[く]る。」"
  12: "その陣[じん]の者[もの]たちがヨナタンと武具[ぶぐ]を運[はこ]ぶ者[もの]に答[こた]えて言[い]った。「わたしたちのところへ上[のぼ]って来[こ]い。ひとつことを知[し]らせてやる。」ヨナタンは武具[ぶぐ]を運[はこ]ぶ者[もの]に言[い]った。「わたしの後[あと]に上[のぼ]って来[こ]い。主[しゅ]が彼[かれ]らをイスラエルの手[て]に渡[わた]されたからだ。」"
  13: "ヨナタンは手[て]と足[あし]で上[のぼ]り、武具[ぶぐ]を運[はこ]ぶ者[もの]も彼[かれ]とともに上[のぼ]った。ペリシテ人[じん]はヨナタンの顔[かお]を見[み]た。ヨナタンは彼[かれ]らを打[う]ち、武具[ぶぐ]を運[はこ]ぶ者[もの]は彼[かれ]の後[あと]で彼[かれ]らを打[う]ち倒[たお]した。"
  14: "ヨナタンと武具[ぶぐ]を運[はこ]ぶ者[もの]が与[あた]えた最初[さいしょ]の打撃[だげき]は、野[の]の矢[や]、投[な]げ石[いし]、小石[こいし]の飛[と]ぶほどの間[あいだ]で、二十人[にん]ほどであった。"
  15: "陣[じん]の中[なか]にも野[の]にも恐怖[きょうふ]が起[お]こった。陣[じん]にいる民[たみ]も、土地[とち]を荒[あ]らす者[もの]たちもみな震[ふる]え上[あ]がり、自分[じぶん]たちは戦[たたか]おうともしなかった。地[ち]は震[ふる]え動[うご]き、主[しゅ]からの恐怖[きょうふ]が起[お]こった。"
  16: "ベニヤミンのギベアにいたサウルの見張[みは]りたちが見[み]ると、見[み]よ、陣[じん]はあちこちでかき乱[みだ]されていた。"
  17: "サウルは自分[じぶん]とともにいる民[たみ]に言[い]った。「さあ、数[かぞ]えて見[み]よ。だれがわたしたちのところから去[さ]ったのか。」彼[かれ]らが数[かぞ]えると、見[み]よ、ヨナタンと武具[ぶぐ]を運[はこ]ぶ者[もの]は見[み]つからなかった。"
  18: "サウルはアヒヤに言[い]った。「エフォドを持[も]って来[き]なさい。その日[ひ]、彼[かれ]はイスラエルの前[まえ]でエフォドを着[き]ていたからだ。」"
  19: "サウルが祭司[さいし]に語[かた]っているとき、ペリシテ人[じん]の陣[じん]の騒[さわ]ぎはますます大[おお]きくなっていた。そこでサウルは祭司[さいし]に言[い]った。「手[て]を引[ひ]っ込[こ]めなさい。」"
  20: "サウルと彼[かれ]とともにいた民[たみ]はみな叫[さけ]び、戦[たたか]いの場[ば]へ来[き]た。すると見[み]よ、それぞれの剣[つるぎ]が隣[となり]の者[もの]に向[む]けられ、非常[ひじょう]に大[おお]きな混乱[こんらん]が起[お]こっていた。"
  21: "昨日[きのう]も一昨日[おととい]もペリシテ人[じん]とともにいて陣[じん]に上[のぼ]っていた者[もの]たちも、向[む]きを変[か]えて、サウルとヨナタンとともにいるイスラエル人[じん]とともになった。"
  22: "エフライムの山[やま]に隠[かく]れていたイスラエル人[じん]はみな、ペリシテ人[じん]が逃[に]げたと聞[き]いて、彼[かれ]らもまた戦[たたか]いのため彼[かれ]らの後[あと]を追[お]って加[くわ]わった。"
  23: "主[しゅ]はその日[ひ]、イスラエルを救[すく]われた。戦[たたか]いはベトンを通[とお]って進[すす]み、サウルとともにいた民[たみ]は一万人[にん]ほどであった。また戦[たたか]いはエフライムの山[やま]の町[まち]全体[ぜんたい]に散[ち]らばった。"
  24: "その日[ひ]、サウルは大[おお]きな過[あやま]ちを犯[おか]した。彼[かれ]は民[たみ]に誓[ちか]わせて言[い]った。「夕方[ゆうがた]までパンを食[た]べる者[もの]は呪[のろ]われる。わたしが敵[てき]に復讐[ふくしゅう]するまでは。」こうして民[たみ]はだれもパンを味[あじ]わわなかった。"
  25: "地[ち]の人[ひと]々[びと]はみな食事[しょくじ]をしていた。そして野[の]の前[まえ]に蜜[みつ]の森[もり]があった。"
  26: "民[たみ]がその蜜[みつ]の森[もり]へ入[はい]ると、見[み]よ、蜜[みつ]が流[なが]れ出[で]ていた。しかし、だれも手[て]を口[くち]に持[も]って行[い]かなかった。民[たみ]が主[しゅ]の誓[ちか]いを恐[おそ]れたからである。"
  27: "ヨナタンは、父[ちち]が民[たみ]に誓[ちか]わせたことを聞[き]いていなかった。彼[かれ]は手[て]に持[も]っていた杖[つえ]の端[はし]を伸[の]ばして蜜[みつ]の巣[す]に浸[ひた]し、手[て]を口[くち]に戻[もど]すと、目[め]が輝[かがや]き出[だ]した。"
  28: "民[たみ]の一人[ひとり]が答[こた]えて言[い]った。「あなたの父[ちち]は民[たみ]に誓[ちか]わせて、『今日[きょう]、パンを食[た]べる者[もの]は呪[のろ]われる』と言[い]った。それで民[たみ]は衰[よわ]っているのだ。」"
  29: "ヨナタンはそれを知[し]って言[い]った。「父[ちち]はこの地[ち]をかき乱[みだ]した。見[み]てくれ。わたしがこの蜜[みつ]を少[すこ]し味[あじ]わっただけで、わたしの目[め]が輝[かがや]いたのだ。"
  30: "ああ、もし今日[きょう]、民[たみ]が敵[てき]から得[え]た獲物[えもの]を食[た]べていたなら、今[いま]ごろペリシテ人[じん]への打撃[だげき]はもっと大[おお]きかっただろうに。」"
  31: "その日[ひ]、彼[かれ]らはマヘマスでペリシテ人[じん]を打[う]ち、民[たみ]は非常[ひじょう]に疲[つか]れ果[は]てた。"
  32: "民[たみ]は獲物[えもの]に殺到[さっとう]し、羊[ひつじ]の群[む]れや牛[うし]の群[む]れ、子牛[こうし]を取[と]って地[ち]の上[うえ]で屠[ほふ]り、血[ち]のままで食[た]べた。"
  33: "サウルに告[つ]げる者[もの]があって言[い]った。「民[たみ]が血[ち]のままで食[た]べて、主[しゅ]に対して罪[つみ]を犯[おか]している。」サウルは言[い]った。「ゲテムで、わたしのために大[おお]きな石[いし]をここへ転[ころ]がして来[こ]い。」"
  34: "サウルは言[い]った。「民[たみ]の間[あいだ]に散[ち]らばって告[つ]げなさい。『それぞれ自分[じぶん]の子牛[こうし]と羊[ひつじ]を持[も]って来[き]て、この石[いし]の上[うえ]で屠[ほふ]りなさい。血[ち]のままで食[た]べて主[しゅ]に罪[つみ]を犯[おか]してはならない』と。」民[たみ]はみな、それぞれ手[て]にあるものを携[たずさ]えて来[き]、そこで屠[ほふ]った。"
  35: "サウルはそこで主[しゅ]に祭壇[さいだん]を築[きず]いた。これが、サウルが主[しゅ]に祭壇[さいだん]を築[きず]き始[はじ]めた最初[さいしょ]であった。"
  36: "サウルは言[い]った。「夜[よる]のうちにペリシテ人[じん]の後[あと]を追[お]って下[くだ]り、日[ひ]が明[あ]けるまで彼[かれ]らを略奪[りゃくだつ]し、一人[ひとり]の男[おとこ]も残[のこ]さないようにしよう。」彼[かれ]らは言[い]った。「あなたの目[め]に良[よ]いと思[おも]われることは何[なん]でもしてください。」祭司[さいし]は言[い]った。「ここで神[かみ]の前[まえ]に進[すす]み出[で]よう。」"
  37: "サウルは神[かみ]に問[と]うた。「ペリシテ人[じん]の後[あと]を追[お]って下[くだ]るべきだろうか。あなたは彼[かれ]らをイスラエルの手[て]に渡[わた]してくださるだろうか。」しかし、その日[ひ]、神[かみ]は彼[かれ]に答[こた]えられなかった。"
  38: "サウルは言[い]った。「イスラエルのすべての隅々[すみずみ]の者[もの]をここへ連[つ]れて来[き]て、今日[きょう]のこの罪[つみ]がだれにあるのかを知[し]って見[み]よ。"
  39: "イスラエルを救[すく]った主[しゅ]は生[い]きておられる。たとえそれがわたしの子[こ]ヨナタンに及[およ]んでも、彼[かれ]は必[かなら]ず死[し]ぬ。」しかし、民[たみ]のうちにはだれも彼[かれ]に答[こた]える者[もの]がいなかった。"
  40: "サウルはイスラエル全[ぜん]体[たい]に言[い]った。「あなたがたは奴隷[どれい]の身[み]になり、わたしとわたしの子[こ]ヨナタンも奴隷の身[み]になる。」民[たみ]はサウルに言[い]った。「あなたの目[め]に良[よ]いと思[おも]われることをしてください。」"
  41: "サウルは言[い]った。「主[しゅ]、イスラエルの神[かみ]よ、なぜ今日[きょう]、あなたのしもべにお答[こた]えにならないのか。もし不義[ふぎ]がわたしにあるのか、わたしの子[こ]ヨナタンにあるのか、主[しゅ]、イスラエルの神[かみ]よ、明[あき]らかにしてください。もし『あなたの民[たみ]イスラエルにある』と言[い]われるなら、聖[せい]なるものをお与[あた]えください。」そして、ヨナタンとサウルに籤[くじ]が当[あ]たり、民[たみ]は外[はず]れた。"
  42: "サウルは言[い]った。「わたしとわたしの子[こ]ヨナタンの間[あいだ]で籤[くじ]を引[ひ]け。主[しゅ]が選[えら]び示[しめ]す者[もの]は死[し]ぬ。」民[たみ]はサウルに言[い]った。「そのようなことはできない。」しかしサウルは民[たみ]を押[お]し切[き]った。そこで彼[かれ]とその子[こ]ヨナタンの間[あいだ]で籤[くじ]を引[ひ]くと、ヨナタンに当[あ]たった。"
  43: "サウルはヨナタンに言[い]った。「何[なに]をしたのか、わたしに告[つ]げなさい。」ヨナタンは彼[かれ]に告[つ]げて言[い]った。「わたしは手[て]に持[も]っていた杖[つえ]の端[はし]で、ほんの少[すこ]し蜜[みつ]を味[あじ]わった。見[み]よ、わたしは死[し]ぬ。」"
  44: "サウルは彼[かれ]に言[い]った。「神[かみ]がわたしにそうし、またその上[うえ]にもそうなさるように。あなたは今日[きょう]、必[かなら]ず死[し]ぬ。」"
  45: "民[たみ]はサウルに言[い]った。「イスラエルにこの大[おお]きな救[すく]いをもたらした者[もの]が、今日[きょう]、死[し]ぬべきだろうか。主[しゅ]は生[い]きておられる。彼[かれ]の頭[あたま]の毛[け]が一[ひと]筋[すじ]でも地[ち]に落[お]ちることはない。彼[かれ]は今日[きょう]、神[かみ]とともに働[はたら]いたのだ。」民[たみ]はその日[ひ]、ヨナタンのために祈[いの]り、彼[かれ]は死[し]ななかった。"
  46: "サウルはペリシテ人[じん]を追[お]うのをやめて上[あ]がり、ペリシテ人[じん]は自分[じぶん]たちの場所[ばしょ]へ帰[かえ]った。"
  47: "サウルはイスラエルの上[うえ]に王[おう]としての務[つと]めを確立[かくりつ]し、周[まわ]りのすべての敵[てき]、すなわちモアブ、アンモンの子[こ]ら、エドムの子[こ]ら、ベテオル、スバの王[おう]、ペリシテ人[じん]と戦[たたか]った。彼[かれ]が向[む]きを変[か]えるところ、どこでも勝利[しょうり]を得[え]た。"
  48: "彼[かれ]は軍[ぐん]を組織[そしき]し、アマレクを打[う]って、イスラエルを踏[ふ]みにじる者[もの]たちの手[て]から救[すく]い出[だ]した。"
  49: "サウルの子[こ]たちはヨナタン、イェシュイ、メルキシュアであった。二人[ふたり]の娘[むすめ]の名[な]は、長女[ちょうじょ]がメロブ、次女[じにょ]がミカルといった。"
  50: "妻[つま]の名[な]はアヒノアムといい、アヒマアツの娘[むすめ]であった。軍[ぐん]の長[ちょう]の名[な]はアベネルといい、ニルの子[こ]で、サウルのおじの子[こ]であった。"
  51: "サウルの父[ちち]キシュと、アベネルの父[ちち]ニルは、アビエルの子[こ]であった。"
  52: "サウルのすべての日[ひ]々[びと]、ペリシテ人[じん]との戦[たたか]いは激[はげ]しかった。サウルは力[ちから]ある男[おとこ]、勇[いさ]みある者[もの]を見[み]るたびに、彼[かれ]を自分[じぶん]のところへ集[あつ]めた。"

notes:
  1: "Καὶ γίνεται ἡμέρα — «и бывает день», т. е. в один день. παιδάριον — отрок, слуга; αἴρων τὰ σκεύη — носящий оружие (оруженосец). μεσσαβ — стан, отряд (слав. «мессава»). ἀπήγγειλεν — возвестил."
  2: "ἐπ᾽ ἄκρου τοῦ βουνοῦ — на краю холма; ὑπὸ τὴν ῥόαν — под гранатовым деревом (ῥοά); ἐν Μαγδων — в Магдоне (Син. «в Мигроне» — по МТ). ἑξακόσιοι — шестьсот."
  3: "Αχια υἱὸς Αχιτωβ ἀδελφοῦ Ιωχαβηδ — Ахия, сын Ахитува, брата Иохаведа (Ихавода); ἱερεὺς τοῦ θεοῦ ἐν Σηλωμ — священник Бога в Силоме; αἴρων εφουδ — носящий ефод."
  4: "ἀνὰ μέσον τῆς διαβάσεως — между переходами; ἀκρωτήριον πέτρας — скалистый выступ; Βαζες и Σεννα — Васес и Сенна (слав. «васес», «сенна»)."
  5: "ἡ ὁδὸς ἡ μία ἀπὸ βορρᾶ — одна дорога с севера; ἀπὸ νότου — с юга; ἐρχομένῳ — идущему (дательный)."
  6: "ἀπερίτμητοι — необрезанные; εἴ τι ποιήσαι — не сделает ли (оптатив); οὐκ ἔστιν τῷ κυρίῳ συνεχόμενον σῴζειν — «не затруднительно Господу спасать»; ἐν πολλοῖς ἢ ἐν ὀλίγοις — во многих или в немногих."
  7: "Ποίει πᾶν, ὃ ἐὰν ἡ καρδία σου ἐκκλίνῃ — делай всё, к чему склонится сердце твоё; ὡς ἡ καρδία σού καρδία μοῦ — как сердце твоё — сердце моё."
  8: "κατακυλισθησόμεθα — «покатимся, явимся» (κατακυλίω); слав. «явимся»."
  9: "Ἀπόστητε — отступите, остановитесь; στησόμεθα ἐφ᾽ ἑαυτοῖς — останемся на своём месте; οὐ μὴ ἀναβῶμεν — не взойдём (усиленное отрицание)."
  10: "παραδέδωκεν — предал (перфект); τοῦτο ἡμῖν τὸ σημεῖον — это нам знамение."
  11: "εἰσῆλθον ἀμφότεροι — вошли оба; τρωγλῶν — нор, пещер (τρώγλη); ἐκπορεύονται — выходят."
  12: "ῥῆμα — слово, нечто; γνωριοῦμεν ὑμῖν — возвестим вам; Ἀνάβηθι ὀπίσω μου — взойди за мною."
  13: "ἐπὶ τὰς χεῖρας καὶ ἐπὶ τοὺς πόδας — на руках и на ногах; ἐπέβλεψαν κατὰ πρόσωπον — «посмотрели в лицо»; ἐπεδίδου ὀπίσω αὐτοῦ — «подавал за ним», т. е. добивал."
  14: "ἡ πληγὴ ἡ πρώτη — первое поражение; ἐν βολίσι — в бросках (βολίς — метательный снаряд); πετροβόλοις — камнемётами; κόχλαξιν — голышами, кремнями; τοῦ πεδίου — поля. Син. «на половине поля» — по МТ."
  15: "ἔκστασις — исступление, ужас; οἱ διαφθείροντες — опустошающие; ἐξέστησαν — пришли в смятение; ἐθάμβησεν ἡ γῆ — «ужаснулась земля»; παρὰ κυρίου — от Господа."
  16: "σκοποί — стражи, наблюдатели; τεταραγμένη — приведённая в смятение; ἔνθεν καὶ ἔνθεν — туда и сюда."
  17: "Ἐπισκέψασθε — пересмотрите (ἐπισκέπτομαι); οὐχ εὑρίσκετο — не находился."
  18: "Προσάγαγε τὸ εφουδ — принеси ефод (в гр; слав. и Син. «кивот» — по МТ). αὐτὸς ἦρεν — он носил."
  19: "ὁ ἦχος — шум; ἐπορεύετο πορευόμενος — шёл, продвигаясь (усилительная конструкция); ἐπλήθυνεν — умножался; Συνάγαγε τὰς χεῖρας σου — «собери руки твои», т. е. кончай молитву (слав. «пригни руки твоя»)."
  20: "ἀνεβόησεν — возопил; ἕως τοῦ πολέμου — до места сражения; ῥομφαία ἀνδρὸς ἐπὶ τὸν πλησίον — меч каждого на ближнего; σύγχυσις — смятение."
  21: "οἱ δοῦλοι οἱ ὄντες ἐχθὲς καὶ τρίτην ἡμέραν — рабы, бывшие вчера и третьего дня; ἐπεστράφησαν — обратились; εἶναι μετὰ Ισραηλ — быть с Израилем."
  22: "οἱ κρυπτόμενοι ἐν τῷ ὄρει Εφραιμ — скрывавшиеся на горе Ефремовой; συνάπτουσιν — присоединились; ὀπίσω αὐτῶν — за ними."
  23: "ἔσωσεν κύριος — спас Господь; διῆλθεν τὴν Βαιθων — прошла через Бефон (Син. «до Беф-Авена»); δέκα χιλιάδες — десять тысяч; διεσπαρμένος — рассеяна."
  24: "ἠγνόησεν ἄγνοιαν μεγάλην — «совершил великое неведение» (слав. «сотвори безумие велие»); ἀρᾶται — заклинает (ἀράομαι); ἐπικατάρατος — проклят; ἕως ἑσπέρας — до вечера; ἐκδικήσω — отомщу; οὐκ ἐγεγεύσατο — не вкусил."
  25: "πᾶσα ἡ γῆ ἠρῖστα — вся земля завтракала (ἀριστάω); μελισσῶνος — пчелиный (медовый) лес; κατὰ πρόσωπον τοῦ ἀγροῦ — на виду у поля."
  26: "εἰσῆλθεν ὁ λαὸς εἰς τὸν μελισσῶνα — вошёл народ в медовый лес; ἐπορεύετο λαλῶν — «шёл, говоря» (тёмное место, возможно порча; слав. вставляет «яко истече мед»); οὐκ ἦν ἐπιστρέφων τὴν χεῖρα — не было возвращающего руку; ὅρκος — клятва."
  27: "οὐκ ἀκηκόει — не слышал (плюсквамперфект); σκῆπτρον — жезл, посох; κηρίον — соты; ἀνέβλεψαν οἱ ὀφθαλμοί — «прозрели глаза», т. е. просветлели."
  28: "Ὁρκίσας ὥρκισεν — «клятвою заклял»; ἐξελλύθη — ослаб, изнемог (ἐκλύω)."
  29: "Ἀπήλλαχεν — «смутил, оттолкнул» (ἀπαλλάσσω); ἰδὲ δή — смотри же; ἐγευσάμην βραχύ — вкусил немного."
  30: "ἀλλ᾽ ὅτι εἰ — «но что, если бы» (эллипсис); ἔφαγεν ἔσθων — «ел, поедая»; σκῦλα — добыча; μείζων ἂν ἦν ἡ πληγή — больше было бы поражение."
  31: "ἐκοπίωσεν ὁ λαός — народ утомился; в гр нет «от Михмаса до Аиалона» (это МТ/Син.), есть только ἐν Μαχεμας."
  32: "ἐκλίθη — устремился, наклонился (κλίνω); ποίμνια καὶ βουκόλια — отары и стада; τέκνα βοῶν — телята; ἔσφαξεν ἐπὶ τὴν γῆν — заколол на земле; σὺν τῷ αἵματι — с кровью."
  33: "ἀπηγγέλη — возвещено; Ἡμάρτηκεν — согрешил; ἐν Γεθθεμ — в Гефеме (слав. «от гефема»); κυλίσατε λίθον μέγαν — привалите большой камень."
  34: "Διασπάρητε ἐν τῷ λαῷ — разойдитесь по народу (διασπείρω); σφαζέτω ἐπὶ τούτου — пусть заколет на этом; οὐ μὴ ἁμάρτητε — не согрешите; τὸ ἐν τῇ χειρὶ αὐτοῦ — что в руке его."
  35: "ᾠκοδόμησεν θυσιαστήριον — построил жертвенник; τοῦτο ἤρξατο — это начал (первый жертвенник Саула)."
  36: "καταβῶμεν — сойдём; διαρπάσωμεν — разграбим; ἕως διαφαύσῃ ἡ ἡμέρα — пока не рассветёт; μὴ ὑπολίπωμεν ἄνδρα — не оставим мужа; Προσέλθωμεν — приступим."
  37: "ἐπηρώτησεν — вопросил; εἰ καταβῶ — идти ли; οὐκ ἀπεκρίθη — не ответил (в гр θεός, не κύριος)."
  38: "τὰς γωνίας τοῦ Ισραηλ — «углы Израиля», т. е. начальников (γωνία — угол); ἐν τίνι γέγονεν — на ком был."
  39: "ζῇ κύριος — жив Господь (формула клятвы); ἐὰν ἀποκριθῇ κατὰ Ιωναθαν — если окажется на Ионафане; θανάτῳ ἀποθανεῖται — смертью умрёт; οὐκ ἦν ὁ ἀποκρινόμενος — не было отвечающего."
  40: "Υμεῖς ἔσεσθε εἰς δουλείαν — «вы будете в рабство»; в слав. и Син. «на одну сторону» — по МТ; в гр δουλεία, перевод буквальный."
  41: "δὸς δήλους — «дай явное» (Урим); δὸς ὁσιότητα — «дай святыню» (Туммим); слав. «даждь знамение… даждь ныне преподобие». κληροῦται — выпадает по жребию; ὁ λαὸς ἐξῆλθεν — народ вышел (свободным)."
  42: "Βάλετε ἀνὰ μέσον — бросьте между; ὃν ἂν κατακληρώσηται — кого изберёт по жребию; κατεκράτησεν τοῦ λαοῦ — настоял на народе."
  43: "Ἀπάγγειλον — возвести; Γευσάμενος ἐγευσάμην — «вкушая вкусил» (усиление); ἄκρῳ τῷ σκήπτρῳ — концом жезла; ἰδοὺ ἐγὼ ἀποθνῄσκω — вот, я умираю."
  44: "Τάδε ποιήσαι μοι ὁ θεὸς καὶ τάδε προσθείη — «то и то да сделает мне Бог и приложит» (формула клятвы)."
  45: "ὁ ποιήσας τὴν σωτηρίαν τὴν μεγάλην — сделавший великое спасение; εἰ πεσεῖται τῆς τριχός — «если упадёт волос» (клятва); ὁ λαὸς τοῦ θεοῦ ἐποίησεν — «народ Божий сделал», т. е. с Богом действовал; προσηύξατο — помолился."
  46: "ἀνέβη ἀπὸ ὄπισθεν — поднялся от преследования; ἀπῆλθον εἰς τὸν τόπον αὐτῶν — ушли в место своё."
  47: "κατακληροῦται ἔργον — «получает в удел дело» (тёмное место; Син. «утвердил царствование»); κύκλῳ — вокруг; εἰς τὸν Βαιθεωρ — на Бефеор; βασιλέα Σουβα — царя Сува; οὗ ἂν ἐστράφη, ἐσῴζετο — куда ни обращался, спасался (имел успех)."
  48: "ἐποίησεν δύναμιν — «сделал силу», т. е. войско; ἐξείλατο — избавил (ἐξαιρέω); καταπατούντων — попирающих."
  49: "Ιεσσιου — Иессуи; Μελχισα — Мелхисуа; Μεροβ — Мерова; Μελχολ — Мелхола (в корпусе ミカル)."
  50: "Αχινοομ — Ахиноам; Αχιμαας — Ахимаас; ἀρχιστράτηγος — начальник войска; Αβεννηρ — Авенир; υἱὸς Νηρ υἱοῦ οἰκείου Σαουλ — сын Нира, сына родственника Саула (Син. «дяди Саулова»)."
  51: "Κις — Кис; Νηρ — Нир; υἱὸς Ιαμιν υἱοῦ Αβιηλ — «сын Иамина, сына Авиила»; Син. «были сыновьями Авиила» — по МТ, в гр родство передано иначе."
  52: "πόλεμος κραταιός — война упорная; υἱὸν δυνάμεως — «сын силы», т. е. воин; συνήγαγεν — собирал."
