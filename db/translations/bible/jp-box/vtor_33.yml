# jp-box, Второзаконие, глава 33. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в гл. 33–34 отсутствует
# (выгрузка пустая).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 33: благословение Моисея (1–29): ввод (1), явление Господа (2–3), закон и царство
# (4–5), благословения колен — Рувим (6), Иуда (7), Левий (8–11), Вениамин (12), Иосиф
# (13–17), Завулон и Иссахар (18–19), Гад (20–21), Дан (22), Неффалим (23), Асир (24–25),
# величие Бога и спасение Израиля (26–29).
# Поэзия: параллелизмы и полустишия сохранены (2–3, 6, 8–11, 13–17, 19–21, 26–29),
# порядок членов не сглажен, антропоморфизмы не смягчены (11 — чресла врагов,
# 27 — мышцы вечные, 29 — выя врагов).
# Кавычки: 33:1 — повествование; 33:2–29 — речь Моисея, 「…」 (открывается после «он сказал»
# в ст. 2, закрывается в конце ст. 29). Вложенные слова: слова левита в 33:9 — 『…』,
# слова Господа врагу в 33:27 — 『…』. Красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по выгрузке). Славянские добавления —
# «со тмами святых» (2) и «и Симеон да будет мног числом» (6) — в gr отсутствуют,
# в текст не внесены, см. notes.
# НУМЕРАЦИЯ: в csl 33:3 кончается на «суть», а «И прия от словес его» стоит в начале csl 33:4;
# в gr 33:3 кончается ἐδέξατο ἀπὸ τῶν λόγων αὐτοῦ, а 33:4 — νόμον… Держимся gr.
# LXX: 33:17 — μονόκερως передан 野牛, как в Чис 23:22 (передаёт евр. рээм); 33:16 — «Явившийся
# в купине»; 33:19 — «богатство моря» и «торговля приморских»; 33:5 — «в Возлюбленном князь»;
# 33:10 — «фимиам в гневе Твоём» (в ru «пред лице Твое» — масоретское).
# 33:1 — ἄνθρωπος τοῦ θεοῦ: 神[かみ]の人[ひと] (как в корпусе, ср. 1 Тим 6:11; Пс 89:0);
# порядок «人[ひと]の神[かみ]の人[ひと]» японскому не соответствует и не используется.
# Сносок ⟨…⟩ нет: ウリム уже пояснён (Исх 28:30), 野牛, 初穂, 嗣業, 祭壇 в корпусе.
# jp-ni не использовался.

