verses:
  1: "これが、神[かみ]の人[ひと]モーセが、その死[し]の前[まえ]にイスラエルの子[こ]らを祝福[しゅくふく]した祝福である。"
  2: "彼[かれ]は言[い]った。「主[しゅ]はシナイから来[こ]られ、セイルからわたしたちに現[あらわ]れ、パランの山[やま]から急[いそ]ぎ来[こ]られた。カデシュの幾万[いくまん]とともに。その右[みぎ]には天使[てんし]たちが彼とともにいる。"
  3: "そして、ご自身[じしん]の民[たみ]を惜[お]しまれた。聖別[せいべつ]された者[もの]はすべてあなたの手[て]の下[した]にあり、彼らはあなたの下にある。そして、その言葉[ことば]から受[う]け取[と]った。"
  4: "モーセがわたしたちに命[めい]じた律法[りっぽう]、ヤコブの会衆[かいしゅう]への嗣業[しぎょう]である。"
  5: "そして、愛[あい]された者[もの]のうちに支配者[しはいしゃ]が立[た]つ。民[たみ]の長[おさ]たちが、イスラエルの部族[ぶぞく]とともに集[あつ]まったときに。"
  6: "ルベンは生[い]きよ、死[し]ぬことがないように。その数[かず]が多[おお]くなるように。"
  7: "これはユダについてである。主[しゅ]よ、ユダの声[こえ]を聞[き]き入[い]れてください。彼[かれ]の民[たみ]のところへ入[はい]って行[い]けますように。彼[かれ]の手[て]が彼のために裁[さば]きを行[おこな]いますように。あなたが彼[かれ]の敵[てき]からの助[たす]け手[て]となってくださいますように。"
  8: "レビについて彼は言[い]った。レビに、そのウリムとその真理[しんり]を、聖[せい]なる人[ひと]に与[あた]えよ。すなわち、彼らが試[ため]み、争[あらそ]いの水[みず]のほとりで彼をののしった、あの人に。"
  9: "彼[かれ]は父[ちち]と母[はは]に『わたしはあなたを見[み]たことがない』と言[い]い、自分[じぶん]の兄弟[きょうだい]たちを認[みと]めず、自分の子[こ]らたちをも知[し]らなかった。彼[かれ]はあなたの言葉[ことば]を守[まも]り、あなたの契約[けいやく]を保[たも]った。"
  10: "彼[かれ]らはあなたの定[さだ]めをヤコブに、あなたの律法[りっぽう]をイスラエルに示[しめ]す。彼らはあなたの怒[いか]りのうちに、絶[た]えず香[こう]をあなたの祭壇[さいだん]の上[うえ]に置[お]く。"
  11: "主[しゅ]よ、彼[かれ]の力[ちから]を祝福[しゅくふく]し、その手[て]の業[わざ]を受[う]け入[い]れてください。彼[かれ]に逆[さか]らって立[た]つ敵[てき]の腰[こし]を砕[くだ]き、彼を憎[にく]む者[もの]たちが立[た]ち上[あ]がらないようにしてください。"
  12: "ベニヤミンについて彼は言[い]った。主[しゅ]に愛[あい]された者[もの]は、信頼[しんらい]して住[す]む。神[かみ]はすべての日[ひ]々[び]、彼[かれ]の上[うえ]に影[かげ]を落[お]とされる。彼[かれ]はその両肩[りょうかた]の間[あいだ]に憩[いこ]う。"
  13: "ヨセフについて彼は言[い]った。彼[かれ]の地[ち]は主[しゅ]の祝福[しゅくふく]による。天[てん]の時[とき]の巡[めぐ]りと露[つゆ]から、下[した]の淵[ふち]の泉[いずみ]から、"
  14: "太陽[たいよう]の巡[めぐ]りの季節[きせつ]ごとの実[み]から、月[つき]の巡り合[あ]いから、"
  15: "初[はじ]めの山々[やまやま]の頂[いただき]から、永遠[えいえん]の丘[おか]の頂から、"
  16: "また、地[ち]が満[み]ちる季節[きせつ]ごとのものから。柴[しば]の中[なか]で現[あらわ]れた方[かた]に受[う]け入[い]れられるものが、ヨセフの頭[かしら]に、兄弟[きょうだい]たちの間[あいだ]で誉[ほま]れを受[う]けた者[もの]の頭の上[うえ]に、来[き]ますように。"
  17: "その美[うつく]しさは初子[ういご]の雄牛[おうし]のようであり、その角[つの]は野牛[やぎゅう]の角である。それらによって彼[かれ]は諸国[しょこく]の民[たみ]を、地[ち]の果[は]てまで一斉[いっせい]に突[つ]き倒[たお]す。これらはエフライムの幾万[いくまん]、これらはマナセの幾千[いくせん]である。"
  18: "ゼブルンについて彼は言[い]った。ゼブルンよ、あなたの出[で]て行[い]く道[みち]で喜[よろこ]べ。イッサカルよ、その天幕[てんまく]のうちで。"
  19: "彼[かれ]らは諸国[しょこく]の民[たみ]を滅[ほろ]ぼし尽[つ]くす。あなたがたはそこで呼[よ]び求[もと]め、義[ぎ]の犠牲[ぎせい]を献[ささ]げる。海[うみ]の富[とみ]と、海辺[うみべ]に住[す]む者[もの]の交易[こうえき]が、あなたを養[やしな]うからである。"
  20: "ガドについて彼は言[い]った。ガドを広[ひろ]くする方[かた]は祝福[しゅくふく]される。彼[かれ]は獅子[しし]のように、腕[うで]と支配者[しはいしゃ]を砕[くだ]いて憩[いこ]った。"
  21: "彼[かれ]は自分[じぶん]の初穂[はつほ]を見[み]た。そこでは、民[たみ]の長[おさ]たちとともに集[あつ]められた支配者[しはいしゃ]たちの地[ち]が分[わ]けられたからである。主[しゅ]は義[ぎ]を行[おこな]い、イスラエルとともにその裁[さば]きをなされた。"
  22: "ダンについて彼は言[い]った。ダンは若[わか]い獅子[しし]であり、バシャンから跳[は]ね出[で]る。"
  23: "ナフタリについて彼は言[い]った。ナフタリは受[う]け入[い]れられるものの満[み]ち足[た]りであり、主[しゅ]からの祝福[しゅくふく]に満たされるように。彼[かれ]は海[うみ]と南[みなみ]を嗣業[しぎょう]として受[う]け継[つ]ぐ。"
  24: "アシェルについて彼は言[い]った。アシェルは子[こ]らの中[なか]で祝福[しゅくふく]され、兄弟[きょうだい]たちに受[う]け入[い]れられる者[もの]となる。彼[かれ]はその足[あし]を油[あぶら]に浸[ひた]す。"
  25: "彼[かれ]の履[は]き物[もの]は鉄[てつ]と青銅[せいどう]であり、あなたの力[ちから]はあなたの日[ひ]々[び]のようである。"
  26: "愛[あい]された者[もの]の神[かみ]のような方[かた]は、ほかにはいない。天[てん]に上[のぼ]って行[ゆ]かれるあなたの助[たす]け手[て]、大空[おおぞら]の威厳[いげん]ある方である。"
  27: "初[はじ]めの神[かみ]が覆[おお]いとなり、あなたは永遠[えいえん]の腕[うで]の下[した]にいる。神はあなたの顔[かお]の前[まえ]から敵[てき]を追[お]い出[だ]し、『滅[ほろ]びよ』と言[い]われる。"
  28: "イスラエルは、ヤコブの地[ち]に、小麦[こむぎ]とぶどう酒[しゅ]のもとで、ただ一[ひと]り、安心[あんしん]して住[す]む。その天[てん]は露[つゆ]で曇[くも]っている。"
  29: "イスラエルよ、あなたは幸[しあわ]せである。主[しゅ]に救[すく]われる民[たみ]、あなたのような民がほかにあるだろうか。あなたの助[たす]け手[て]は盾[たて]となってあなたを守[まも]り、あなたの剣[つるぎ]はあなたの誇[ほこ]りである。あなたの敵[てき]はあなたに偽[いつわ]りを言[い]い、あなたは彼[かれ]らの首[くび]を踏[ふ]みつける。」"

notes:
  1: "αὕτη ἡ εὐλογία, ἣν εὐλόγησεν — вот благословение, которым благословил; тавтология εὐλογία/εὐλογέω сохранена (祝福…祝福). ἄνθρωπος τοῦ θεοῦ — человек Божий: в корпусе 神の人 (ср. 1 Тим 6:11; Пс 89:0). πρὸ τῆς τελευτῆς αὐτοῦ — прежде кончины его (τελευτή)."
  2: "ἥκει — пришёл, явился (ἥκω). ἐπέφανεν — воссиял, явился (ἐπιφαίνω). κατέσπευσεν — поспешил (κατασπεύδω; слав. «приспе»). σὺν μυριάσιν Καδης — с мириадами Кадеса; в слав. «со тмами святых», в ru «со тьмами святых» — добавление, которого в gr нет, потому в тексте カデシュ. ἐκ δεξιῶν αὐτοῦ — одесную Его. ἄγγελοι — ангелы (天使)."
  3: "ἐφείσατο τοῦ λαοῦ αὐτοῦ — пощадил народ Свой (φείδομαι). οἱ ἡγιασμένοι ὑπὸ τὰς χεῖράς σου — освящённые под руками Твоими (ἁγιάζω). ὑπὸ σέ εἰσιν — под Тобою, в Твоей власти. ἐδέξατο ἀπὸ τῶν λόγων αὐτοῦ — принял от слов Его; подлежащее не выражено, по-гречески клауза переходит в ст. 4 (слав. «И прия от словес его» стоит в начале 33:4)."
  4: "νόμον, ὃν ἐνετείλατο ἡμῖν Μωϋσῆς — закон, который заповедал нам Моисей (ἐντέλλομαι). κληρονομίαν συναγωγαῖς Ιακωβ — наследие сонмам Иакова (συναγωγή — собрание; 会衆, как в корпусе). В gr 33:4 — именное предложение, продолжение ст. 3; в csl 33:4 начинается с «И прия от словес его»."
  5: "ἔσται ἐν τῷ ἠγαπημένῳ ἄρχων — будет в Возлюбленном князь (ἠγαπημένος — Возлюбленный, т. е. Израиль). συναχθέντων ἀρχόντων λαῶν — когда собрались князья народов (gen. absolutus). ἅμα φυλαῖς Ισραηλ — вместе с племенами Израиля (φυλή — колено)."
  6: "Ζήτω Ρουβην — да живёт Рувим (ζάω, императив 3 л.). μὴ ἀποθανέτω — да не умрёт. ἔστω πολὺς ἐν ἀριθμῷ — да будет многочислен (ἀριθμός). В слав. добавлено «и Симеон да будет мног числом» — в gr этого нет, потому не внесено; см. заголовок."
  7: "Εἰσάκουσον, κύριε, φωνῆς Ιουδα — услышь, Господи, голос Иуды (εἰσακούω + gen.). εἰς τὸν λαὸν αὐτοῦ εἰσέλθοισαν — да войдут к народу его: оптатив 3 мн. без выраженного подлежащего; слав. «вниди» (2 ед.) — иное чтение. αἱ χεῖρες αὐτοῦ διακρινοῦσιν αὐτῷ — руки его будут вести тяжбу за него (διακρίνω — судить, разбирать; слав. «поборют по нем»). βοηθὸς ἐκ τῶν ἐχθρῶν αὐτοῦ ἔσῃ — будешь помощником от врагов его."
  8: "Δότε Λευι δήλους αὐτοῦ καὶ ἀλήθειαν αὐτοῦ — дайте Левию его урим и его истину: δῆλοι — «явления», техническое обозначение урима (ср. Чис 27:21, где δῆλοι передано ウリム); ἀλήθεια — «истина», т. е. туммим. τῷ ἀνδρὶ τῷ ὁσίῳ — мужу святому (ὅσιος). ὃν ἐπείρασαν αὐτὸν ἐν πείρᾳ — которого искусили в искушении (πεῖρα — Масса, Исх 17:7); ἐλοιδόρησαν — поносили. Подлежащее 3 мн. — народ; в ru «Ты искусил» — иное согласование."
  9: "ὁ λέγων τῷ πατρὶ καὶ τῇ μητρί — говорящий отцу и матери. Οὐχ ἑόρακά σε — не видел тебя; слова левита — 『…』. τοὺς ἀδελφοὺς αὐτοῦ οὐκ ἐπέγνω — братьев своих не признал. τοὺς υἱοὺς αὐτοῦ ἀπέγνω — сыновей своих отверг (ἀπογινώσκω). ἐφύλαξεν τὰ λόγιά σου — сохранил слова Твои (λόγιον). τὴν διαθήκην σου διετήρησεν — завет Твой соблюл (διατηρέω)."
  10: "δηλώσουσιν τὰ δικαιώματά σου — возвестят определения Твои (δικαίωμα). ἐπιθήσουσιν θυμίαμα ἐν ὀργῇ σου — положат фимиам в гневе Твоём: буквально по gr (θυμίαμα — курение); слав. так же; в ru «пред лице Твое» — по масоретскому (בְּאַפְּךָ, «в ноздри»). διὰ παντὸς — всегда. ἐπὶ τὸ θυσιαστήριόν σου — на жертвенник Твой."
  11: "εὐλόγησον … τὴν ἰσχὺν αὐτοῦ — благослови крепость его. τὰ ἔργα τῶν χειρῶν αὐτοῦ δέξαι — дела рук его прими. κάταξον ὀσφὺν ἐχθρῶν — сокруши чресла врагов (κατάγνυμι; ὀσφύς — поясница, чресла). ἐπανεστηκότων αὐτῷ — восставших на него. μὴ ἀναστήτωσαν — да не встанут."
  12: "Ἠγαπημένος ὑπὸ κυρίου — возлюбленный Господом. κατασκηνώσει πεποιθώς — поселится уповая, т. е. безопасно (πείθω, perf.). σκιάζει ἐπ᾽ αὐτῷ — осеняет его (σκιάζω). ἀνὰ μέσον τῶν ὤμων αὐτοῦ κατέπαυσεν — почил между раменами его: αὐτοῦ двусмысленно (Бога или Вениамина); в тексте сохранено その両肩, в ru «Его»."
  13: "Ἀπ εὐλογίας κυρίου ἡ γῆ αὐτοῦ — от благословения Господня земля его (ἀπό + gen.; слав. так же). ἀπὸ ὡρῶν οὐρανοῦ καὶ δρόσου — от времён небесных и росы (ὥρα — время, пора). ἀπὸ ἀβύσσων πηγῶν κάτωθεν — от бездн источников внизу (ἄβυσσος)."
  14: "καθ᾽ ὥραν γενημάτων ἡλίου τροπῶν — по времени плодов солнечных поворотов (γένημα — плод; τροπή — поворот, солнцестояние). ἀπὸ συνόδων μηνῶν — от соединений месяцев, т. е. новолуний (σύνοδος)."
  15: "ἀπὸ κορυφῆς ὀρέων ἀρχῆς — от вершины гор начала, т. е. древних (ἀρχή). ἀπὸ κορυφῆς βουνῶν ἀενάων — от вершины холмов вечных (ἀέναος)."
  16: "καθ᾽ ὥραν γῆς πληρώσεως — по времени земли полноты (πλήρωσις). τὰ δεκτὰ τῷ ὀφθέντι ἐν τῷ βάτῳ — приятное Явившемуся в купине (βάτος — терновый куст; Исх 3:2). ἔλθοισαν ἐπὶ κεφαλὴν Ιωσηφ — да приидут на голову Иосифа (оптатив 3 мн.). ἐπὶ κορυφῆς δοξασθεὶς ἐν ἀδελφοῖς — на темя прославленного между братьями (δοξάζω; относится к Иосифу)."
  17: "πρωτότοκος ταύρου τὸ κάλλος αὐτοῦ — первородного тельца красота его (ταῦρος — бык). κέρατα μονοκέρωτος — рога единорога (μονόκερως передаёт евр. рээм; в корпусе 野牛, как Чис 23:22). ἐπὶ ἄκρου γῆς — до края земли. κερατιεῖ — забодает (κερατίζω). μυριάδες / χιλιάδες — тьмы / тысячи."
  18: "Εὐφράνθητι — возрадуйся (εὐφραίνω, аорист императив). ἐν ἐξοδίᾳ σου — в исходе твоём, т. е. в путях. ἐν τοῖς σκηνώμασιν αὐτοῦ — в селениях его (σκήνωμα); αὐτοῦ можно отнести и к Завулону, слав. «в селениих твоих»."
  19: "ἔθνη ἐξολεθρεύσουσιν — народы истребят (ἐξολεθρεύω, 3 мн.). ἐπικαλέσεσθε ἐκεῖ — призовёте там (2 мн.). θύσετε θυσίαν δικαιοσύνης — принесёте жертву правды. πλοῦτος θαλάσσης θηλάσει σε — богатство моря напитает тебя (θηλάζω — кормить грудью). ἐμπόρια παρὰλιον κατοικούντων — торговля приморских жителей (ἐμπόριον; слав. «купли от язык при мори живущих» — добавлено «от язык»)."
  20: "Εὐλογημένος ἐμπλατύνων Γαδ — благословен расширяющий Гада (ἐμπλατύνω). ὡς λέων ἀνεπαύσατο — как лев почил. συντρίψας βραχίονα καὶ ἄρχοντα — сокрушив мышцу и князя (в ru «и голову» — масоретское чтение)."
  21: "εἶδεν ἀπαρχὴν αὐτοῦ — увидел начаток свой (ἀπαρχή). ἐκεῖ ἐμερίσθη γῆ ἀρχόντων συνηγμένων ἅμα ἀρχηγοῖς λαῶν — там разделилась земля князей, собранных вместе с начальниками народов (μερίζω; ἀρχηγός). δικαιοσύνην κύριος ἐποίησεν — правду Господь сотворил. κρίσιν αὐτοῦ μετὰ Ισραηλ — суд Свой с Израилем."
  22: "σκύμνος λέοντος — львёнок (σκύμνος; в Быт 49:9 — 若い獅子). ἐκπηδήσεται ἐκ τοῦ Βασαν — выпрыгнет из Васана (ἐκπηδάω)."
  23: "πλησμονὴ δεκτῶν — полнота приятного (πλησμονή; δεκτός — приемлемый). ἐμπλησθήτω εὐλογίαν παρὰ κυρίου — да исполнится благословением от Господа. θάλασσαν καὶ λίβα κληρονομήσει — море и юг наследует (λίψ — юг, юго-запад)."
  24: "Εὐλογητὸς ἀπὸ τέκνων Ασηρ — благословен от детей Асир, т. е. среди сынов. ἔσται δεκτὸς τοῖς ἀδελφοῖς αὐτοῦ — будет приятен братьям своим (δεκτός). βάψει ἐν ἐλαίῳ τὸν πόδα αὐτοῦ — омочит в елей ногу свою (βάπτω)."
  25: "σίδηρος καὶ χαλκὸς τὸ ὑπόδημα αὐτοῦ — железо и медь обувь его (ὑπόδημα — сандалия); 3 л. «его» при 2 л. далее сохранено, как в gr и слав. ὡς αἱ ἡμέραι σου ἡ ἰσχύς σου — как дни твои крепость твоя."
  26: "Οὐκ ἔστιν ὥσπερ ὁ θεὸς τοῦ ἠγαπημένου — нет подобного Богу Возлюбленного (Израиля). ὁ ἐπιβαίνων ἐπὶ τὸν οὐρανὸν βοηθός σου — шествующий по небу помощник твой. ὁ μεγαλοπρεπὴς τοῦ στερεώματος — великолепный в тверди (στερέωμα)."
  27: "σκέπασις θεοῦ ἀρχῆς — покров Бога древнего (σκέπασις; ἀρχή — начало). ὑπὸ ἰσχὺν βραχιόνων ἀενάων — под крепостью мышц вечных. ἐκβαλεῖ ἀπὸ προσώπου σου ἐχθρόν — изгонит от лица твоего врага. λέγων Ἀπόλοιο — говоря: погибни (ἀπόλοιο, оптатив от ἀπόλλυμι; слова Бога врагу — 『…』)."
  28: "κατασκηνώσει Ισραηλ πεποιθὼς μόνος — поселится Израиль уповая, один. ἐπὶ γῆς Ιακωβ — на земле Иакова. ἐπὶ σίτῳ καὶ οἴνῳ — при хлебе и вине (σίτος — хлеб, пшеница). ὁ οὐρανὸς αὐτῷ συννεφὴς δρόσῳ — небо ему облачно росою (συννεφής)."
  29: "μακάριος σύ, Ισραηλ — блажен ты, Израиль. τίς ὅμοιός σοι λαὸς σῳζόμενος ὑπὸ κυρίου — кто подобен тебе, народ, спасаемый Господом. ὑπερασπιεῖ ὁ βοηθός σου — защитит помощник твой (ὑπερασπίζω — покрывать щитом). ἡ μάχαιρα καύχημά σου — меч — похвала твоя. ψεύσονταί σε οἱ ἐχθροί σου — солгут тебе враги твои, т. е. притворно покорятся. ἐπὶ τὸν τράχηλον αὐτῶν ἐπιβήσῃ — на выю их наступишь."
