# jp-box, Второзаконие, глава 30. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в гл. 30 отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 30: возвращение и помилование (1–6), проклятия на врагов (7), обращение и благословение
# (8–10), «слово это близко» (11–14), жизнь и смерть, призыв избрать жизнь (15–20).
# Кавычки: вся глава — продолжение речи Моисея (29:2–29), поэтому одна цитата 「…」 с 1 по 20:
# глава начинается открытой и кончается закрытой кавычкой. Слова людей внутри — 『…』 (12–13).
# 〔…〕: 30:2 — «ты и сын твой» есть в csl-ru, в gr-lxx-byz нет (bracket_check «υιου» — НЕТ,
# «υιος» — НЕТ). Поставлено внутри стиха, порядок слов японский.
# LXX: 30:3 — ἰάσεται τὰς ἁμαρτίας, «исцелит грехи твои» (в ru по масоретскому «возвратит
# пленных»); 30:6 — περικαθαριεῖ, «очистит сердце» (в ru «обрежет»; образ обрезания сердца
# передан глаголом очищения, ср. 10:16); 30:14 — «в устах, в сердце и в руках твоих» (ru без «рук»).
# Сносок ⟨…⟩ нет: 心の包皮 уже в 10:16, остальное прозрачно. jp-ni не использовался.

tr_code: jp-box
book: vtor
chapter: 30
draft: true

verses:
  1: "「これらすべての言葉[ことば]、すなわち主[しゅ]があなたの前[まえ]に置[お]かれた祝福[しゅくふく]と呪[のろ]いが、あなたに臨[のぞ]み、あなたが、主があなたを追[お]い散[ちら]したすべての民[たみ]の中[なか]で、それを心[こころ]に受[う]け入[い]れるなら、"
  2: "あなたが、〔あなたもあなたの子[こ]も、〕心[こころ]を尽[つ]くし、魂[たましい]を尽くして、あなたの神[かみ]であられる主[しゅ]のもとへ帰[かえ]り、今日[きょう]、わたしがあなたに命[めい]じるすべてに従[したが]ってその声[こえ]に聞[き]き従うなら、"
  3: "そのとき、主[しゅ]はあなたの罪[つみ]を癒[いや]し、あなたをあわれみ、あなたの神[かみ]である主があなたを散[ちら]したすべての民[たみ]の中[なか]から、再[ふたた]びあなたを集[あつ]められる。"
  4: "たとえ、あなたの散[ち]らされた者[もの]が天[てん]の果[は]てから天の果てに及[およ]んでいても、そこからあなたの神[かみ]である主[しゅ]があなたを集[あつ]め、そこからあなたの神である主があなたを連[つ]れて来[こ]られる。"
  5: "あなたの神[かみ]である主[しゅ]はあなたを、あなたの父祖[ふそ]たちが嗣業[しぎょう]として受[う]け継[つ]いだ地[ち]へ導[みちび]き入[い]れ、あなたはそれを嗣業として受け継ぐ。主はあなたを良[よ]く遇[あしら]い、あなたの父祖たちよりも多[おお]く増[ふ]やされる。"
  6: "主[しゅ]はあなたの心[こころ]とあなたの子孫[ししそん]の心を清[きよ]め、あなたが心を尽[つ]くし、魂[たましい]を尽くして、あなたの神[かみ]であられる主を愛[あい]するようにされる。それは、あなたが生[い]きるためである。"
  7: "あなたの神[かみ]である主[しゅ]は、これらすべての呪[のろ]いを、あなたを憎[にく]み、あなたを迫害[はくがい]したあなたの敵[てき]たちの上[うえ]に下[くだ]される。"
  8: "あなたは再[ふたた]び立[た]ち帰[かえ]り、あなたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]い、今日[きょう]わたしがあなたに命[めい]じるそのすべての戒[いまし]めを行[おこな]う。"
  9: "あなたの神[かみ]である主[しゅ]は、あなたの手[て]のすべでの業[わざ]、あなたの胎[たい]の実[み]、あなたの地[ち]の産物[さんぶつ]、あなたの家畜[かちく]の子[こ]らを豊[ゆた]かにされる。主は再[ふたた]びあなたを良[よ]いことで喜[よろこ]ばれ、あなたの父祖[ふそ]たちを喜ばれたように、あなたをも喜ばれるからである。"
  10: "もしあなたが、あなたの神[かみ]である主[しゅ]の声[こえ]に聞[き]き従[したが]い、この律法[りっぽう]の書[しょ]に書[か]かれているそのすべての戒[いまし]めと定[さだ]めと裁[さば]きを守[まも]って行[おこな]い、心[こころ]を尽[つ]くし、魂[たましい]を尽くして、あなたの神であられる主のもとへ帰[かえ]るなら。"
  11: "まことに、今日[きょう]わたしがあなたに命[めい]じるこの戒[いまし]めは、あなたにとって重[おも]すぎるものでも、遠[とお]くにあるものでもない。"
  12: "それは天[てん]にあるのでもなく、『だれがわたしたちのために天に上[のぼ]って、それを取[と]って来[き]て、わたしたちに聞[き]かせてくれるのか。そうすれば、わたしたちはそれを聞いて行[おこな]うのに』と言[い]うようなものではない。"
  13: "また海[うみ]の向[む]こうにあるのでもなく、『だれがわたしたちのために海を渡[わた]って、それを取[と]って来[き]て、わたしたちに聞[き]かせてくれるのか。そうすれば、わたしたちはそれを聞いて行[おこな]うのに』と言[い]うようなものではない。"
  14: "かえって、この言葉[ことば]はあなたに非常に近[ちか]く、あなたの口[くち]に、あなたの心[こころ]に、あなたの手[て]にある。それを行[おこな]うためである。"
  15: "見[み]よ、わたしは今日[きょう]、あなたの前[まえ]に命[いのち]と死[し]とを、善[ぜん]と悪[あく]とを置[お]いた。"
  16: "もしあなたが、あなたの神[かみ]であられる主[しゅ]の戒[いまし]めに聞[き]き従[したが]い、主を愛[あい]し、そのすべての道[みち]を歩[ある]み、その定[さだ]めと裁[さば]きを守[まも]るなら、あなたがたは生[い]き、多[おお]くの者[もの]となり、あなたの神である主は、あなたが入[はい]って行[い]って嗣業[しぎょう]として受[う]け継[つ]ぐ地[ち]で、あなたを祝福[しゅくふく]される。"
  17: "しかし、もしあなたの心[こころ]が背[そむ]き、聞[き]き従[したが]わず、迷[まよ]わされて他[ほか]の神々[かみがみ]にひれ伏[ふ]し、それらに仕[つか]えるなら、"
  18: "わたしは今日[きょう]、あなたがたに告[つ]げる。あなたがたは必[かなら]ず滅[ほろ]び、あなたの神[かみ]である主[しゅ]があなたに与[あた]え、あなたがたがヨルダン川[がわ]を渡[わた]って入[はい]り、嗣業[しぎょう]として受[う]け継[つ]ごうとしているその地[ち]で、長[なが]く生[い]きることはない。"
  19: "わたしは今日[きょう]、あなたがたに対して天[てん]と地[ち]を証人[しょうにん]として呼[よ]ぶ。わたしはあなたがたの前[まえ]に命[いのち]と死[し]を、祝福[しゅくふく]と呪[のろ]いを置[お]いた。あなたもあなたの子孫[ししそん]も生[い]きるために、命を選[えら]びなさい。"
  20: "すなわち、あなたの神[かみ]であられる主[しゅ]を愛[あい]し、その声[こえ]に聞[き]き従[したが]い、主に寄[よ]り添[そ]うためである。主はあなたの命[いのち]、あなたの日々[ひび]の長[なが]さである。あなたが、主があなたの父祖[ふそ]アブラハム、イサク、ヤコブに誓[ちか]って彼[かれ]らに与[あた]えようと言[い]われた地[ち]に住[す]むために。」"

notes:
  1: "ἔσται ὡς ἂν ἔλθωσιν ἐπὶ σὲ πάντα τὰ ῥήματα — будет, когда придут на тебя все слова сии. ἡ εὐλογία καὶ ἡ κατάρα — благословение и проклятие. δέξῃ εἰς τὴν καρδίαν σου — примешь в сердце твоё. οὗ ἐάν σε διασκορπίσῃ — куда рассеет тебя."
  2: "ἐπιστραφήσῃ ἐπὶ κύριον — обратишься к Господу. ὑπακούσῃ τῆς φωνῆς αὐτοῦ — послушаешь гласа Его. ἐξ ὅλης τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου — всем сердцем и всею душою. В csl добавлено «ты и сын твой»; в gr этого нет — отсюда 〔…〕."
  3: "ἰάσεται κύριος τὰς ἁμαρτίας σου — исцелит Господь грехи твои (ἰάομαι); в ru по масоретскому «возвратит пленных твоих». ἐλεήσει σε — помилует тебя. συνάξει ἐκ πάντων τῶν ἐθνῶν — соберёт из всех народов. εἰς οὓς διεσκόρπισέν σε — куда рассеял тебя."
  4: "διασπορά — рассеяние. ἀπ᾽ ἄκρου τοῦ οὐρανοῦ ἕως ἄκρου τοῦ οὐρανοῦ — от края неба до края неба. ἐκεῖθεν συνάξει … καὶ ἐκεῖθεν λήμψεταί σε — оттуда соберёт … и оттуда возьмёт тебя."
  5: "εἰσάξει εἰς τὴν γῆν ἣν ἐκληρονόμησαν οἱ πατέρες σου — введёт в землю, которую наследовали отцы твои. κληρονομήσεις αὐτήν — наследуешь её. εὖ σε ποιήσει — облагодетельствует тебя. πλεοναστόν σε ποιήσει ὑπὲρ τοὺς πατέρας σου — умножит тебя более отцов твоих."
  6: "περικαθαριεῖ κύριος τὴν καρδίαν σου — очистит Господь сердце твоё (περικαθαρίζω — очищать кругом); в ru «обрежет», по масоретскому образу обрезания сердца (ср. 10:16). ἀγαπᾶν — любить (инфинитив цели). ἵνα ζῇς σύ — чтобы ты жил."
  7: "δώσει τὰς ἀρὰς ταύτας ἐπὶ τοὺς ἐχθρούς σου — даст проклятия сии на врагов твоих. τοὺς μισοῦντάς σε — ненавидящих тебя. οἳ ἐδίωξάν σε — которые гнали тебя."
  8: "ἐπιστραφήσῃ — обратишься. εἰσακούσῃ — послушаешь. ποιήσεις τὰς ἐντολάς — исполнишь заповеди. ὅσας ἐγὼ ἐντέλλομαί σοι — какие я заповедую тебе."
  9: "πολυωρήσει σε — обильно одарит (πολυωρέω). ἐν παντὶ ἔργῳ τῶν χειρῶν σου — во всяком деле рук твоих. ἔκγονα τῆς κοιλίας — плод чрева. γενήματα τῆς γῆς — произведения земли. ἐπιστρέψει … εὐφρανθῆναι ἐπὶ σὲ εἰς ἀγαθά — обратится радоваться о тебе во благо."
  10: "εἰσακούσῃς τῆς φωνῆς — послушаешь гласа. φυλάσσεσθαι καὶ ποιεῖν — соблюдать и исполнять. δικαιώματα καὶ κρίσεις — уставы и суды. ἐπιστραφῇς ἐξ ὅλης τῆς καρδίας — обратишься всем сердцем."
  11: "ἐντολὴ αὕτη — заповедь сия. οὐχ ὑπέρογκος — не чрезмерна, не непосильна (ὑπέρογκος — «выступающий за меру»). οὐδὲ μακρὰν ἀπὸ σοῦ — и не далека от тебя."
  12: "οὐκ ἐν τῷ οὐρανῷ ἄνω — не на небе вверху. λέγων — говоря. Τίς ἀναβήσεται ἡμῖν — кто взойдёт для нас. λήμψεται αὐτὴν ἡμῖν — возьмёт её нам. ἀκούσαντες ποιήσομεν — услышав, исполним."
  13: "οὐδὲ πέραν τῆς θαλάσσης — и не за морем. διαπερᾷ — перейдёт. ἀκουστὴν ἡμῖν ποιήσει — сделает её слышимой для нас; в 12 было ἀκούσαντες — «услышав»."
  14: "ἐγγὺς τὸ ῥῆμα σφόδρα — весьма близко слово. ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου καὶ ἐν ταῖς χερσίν σου — в устах твоих, в сердце твоём и в руках твоих (в ru без «рук»). αὐτὸ ποιεῖν — исполнять его."
  15: "δέδωκα πρὸ προσώπου σου — дал пред лицом твоим. τὴν ζωὴν καὶ τὸν θάνατον — жизнь и смерть. τὸ ἀγαθὸν καὶ τὸ κακόν — добро и зло."
  16: "εἰσακούσῃς τὰς ἐντολάς — послушаешь заповеди. ἀγαπᾶν … πορεύεσθαι … φυλάσσεσθαι — любить, ходить, соблюдать (инфинитивы). ζήσεσθε καὶ πολλοὶ ἔσεσθε — будете жить и будете многи (мн. ч.), далее εὐλογήσει σε — благословит тебя (ед. ч.); смешение чисел сохранено."
  17: "μεταστῇ ἡ καρδία σου — отвратится сердце твоё. πλανηθεὶς προσκυνήσῃς — заблудившись, поклонишься. λατρεύσῃς — послужишь."
  18: "ἀναγγέλλω σοι — возвещаю тебе. ἀπωλείᾳ ἀπολεῖσθε — погибелью погибнете (гебраизм, усиление). οὐ μὴ πολυήμεροι γένησθε — не будете долгодневны. διαβαίνετε τὸν Ιορδάνην — переходите Иордан."
  19: "διαμαρτύρομαι … τὸν οὐρανὸν καὶ τὴν γῆν — призываю в свидетели небо и землю. τὴν ζωὴν καὶ τὸν θάνατον δέδωκα — жизнь и смерть дал. ἔκλεξαι τὴν ζωήν — избери жизнь. ἵνα ζῇς σὺ καὶ τὸ σπέρμα σου — чтобы жил ты и семя твоё."
  20: "ἀγαπᾶν … εἰσακούειν … ἔχεσθαι — любить, слушать, держаться (продолжение инфинитивов 19). τοῦτο ἡ ζωή σου — это жизнь твоя. μακρότης τῶν ἡμερῶν σου — долгота дней твоих. κατοικεῖν σε ἐπὶ τῆς γῆς — жить тебе на земле. ἣν ὤμοσεν … δοῦναι αὐτοῖς — которую клялся дать им."
