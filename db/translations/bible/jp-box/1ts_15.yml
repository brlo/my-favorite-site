# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 15: повеление истребить Амалика (1–3), поход и пощада Агага (4–9),
# слово Господа Самуилу (10–11), встреча в Галгале (12–16), обличение (17–23),
# раскаяние Саула и разодранная одежда (24–31), казнь Агага (32–33),
# разлука Самуила и Саула (34–35).
# Речь Самуила — 「…」 (1, 14, 16, 17–23, 26, 28–29, 32–33); слово Господа
