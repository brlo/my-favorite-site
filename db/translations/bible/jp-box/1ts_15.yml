verses:
  1: "サムエルはサウルに言[い]った。「主[しゅ]は、あなたをイスラエルの王[おう]として油[あぶら]を注[そそ]ぐために、わたしを遣[つか]わされた。今[いま]、主[しゅ]の声[こえ]を聞[き]きなさい。"
  2: "万軍[ばんぐん]の主[しゅ]はこう言[い]われる。『わたしは、アマレクがイスラエルにしたこと、すなわち、イスラエルがエジプトから上[のぼ]って来[く]る途中[とちゅう]の道[みち]で彼[かれ]に立[た]ちふさがったことを、今[いま]罰[ばっ]する。"
  3: "今[いま]、行[い]ってアマレクとイエリム、およびそのすべてを打[う]ち、その中[なか]から何[なに]ひとつ取[と]って残[のこ]してはならない。彼[かれ]を、またそのすべてを根[ね]絶[だ]やし、聖絶[せいぜつ]せよ。彼[かれ]を憐[あわ]れんではならない。男[おとこ]から女[おんな]まで、幼[おさな]い者[もの]から乳[ちち]を飲[の]む者[もの]まで、子牛[こうし]から羊[ひつじ]まで、らくだからろばまで殺[ころ]せ。』」"
  4: "サウルは民[たみ]に命[めい]じてギルガルで彼[かれ]らを数[かぞ]えさせた。四十万[よんじゅうまん]の隊[たい]と、ユダの三万人[にん]であった。"
  5: "サウルはアマレクの町[まち]々[まち]まで来[き]て、川[かわ]のほとりに伏[ふ]せ兵[びょう]を置[お]いた。"
  6: "サウルはケニ人[じん]に言[い]った。「去[さ]って、アマレク人[じん]の中[なか]から離[はな]れよ。彼[かれ]とともにあなたを滅[ほろ]ぼしてしまわないためだ。あなたはイスラエルの子[こ]らがエジプトから上[のぼ]ったとき、彼[かれ]らに慈[いつく]しみを示[しめ]したからである。」ケニ人[じん]はアマレク人[じん]の中[なか]から離[はな]れた。"
  7: "サウルはアマレクを、エビラトからエジプトの手前[てまえ]のスルに至[いた]るまで打[う]った。"
  8: "アマレクの王[おう]アガグを生[い]けどりにし、民[たみ]をすべて剣[つるぎ]の刃[は]にかけて殺[ころ]した。"
  9: "しかしサウルと民[たみ]は、アガグを生[い]かしておき、羊[ひつじ]の群[む]れや牛[うし]の群[む]れの良[よ]いもの、食物[しょくもつ]、ぶどう畑[ばたけ]、すべて良[よ]いものを惜[お]しんで、それらを根[ね]絶[だ]やそうとはしなかった。ただ、つまらない蔑[さげす]まれたものはすべて根[ね]絶[だ]やした。"
  10: "主[しゅ]の言葉[ことば]がサムエルに臨[のぞ]んで言[い]った。"
  11: "「わたしはサウルを王[おう]としたことを悔[く]いる。彼[かれ]はわたしから離[はな]れ、わたしの言葉[ことば]を守[まも]らなかったからだ。」サムエルは悲[かな]しみ、夜[よる]通[どお]し主[しゅ]に叫[さけ]んだ。"
  12: "サムエルは朝早[あさはや]く起[お]き、イスラエルに会[あ]いに出[で]た。サムエルに告[つ]げる者[もの]があって言[い]った。「サウルはカルメルに来[き]て、自分のために記念[きねん]の碑[ひ]を立[た]て、向[む]きを変[か]えてギルガルへ下[くだ]った。」サムエルがサウルのところへ来[く]ると、見[み]よ、彼[かれ]はアマレクから持[も]ち帰[かえ]った獲物[えもの]の初[はつ]物[もの]を、主[しゅ]への燔祭[はんさい]としてささげていた。"
  13: "サムエルがサウルのところへ来[く]ると、サウルは彼[かれ]に言[い]った。「主[しゅ]があなたを祝福[しゅくふく]してくださるように。主[しゅ]が語[かた]られたことはすべて、わたしは実行[じっこう]した。」"
  14: "サムエルは言[い]った。「では、わたしの耳[みみ]に聞[き]こえるこの羊[ひつじ]の群[む]れの声[こえ]、この牛[うし]の声[こえ]は何[なん]だ。」"
  15: "サウルは言[い]った。「それらはアマレクから連[つ]れて来[き]た。民[たみ]が、あなたの神[かみ]であられる主[しゅ]に犠牲[ぎせい]をささげるために、羊[ひつじ]の群[む]れと牛[うし]のうちの最[もっと]も良[よ]いものを残[のこ]したのだ。残[のこ]りは根[ね]絶[だ]やした。」"
  16: "サムエルはサウルに言[い]った。「ちょっと待[ま]ってくれ。昨夜[ゆうべ]主[しゅ]がわたしに語[かた]られたことを告[つ]げよう。」サウルは彼[かれ]に言[い]った。「話[はな]してくれ。」"
  17: "サムエルはサウルに言[い]った。「あなたはイスラエルの部族[ぶぞく]の杖[つえ]を執[と]る者[もの]とされたとき、神[かみ]の前[まえ]で小[ちい]さい者[もの]ではなかったか。主[しゅ]はあなたに油[あぶら]を注[そそ]いで、イスラエルの王[おう]とされた。"
  18: "主[しゅ]はあなたを道[みち]に遣[つか]わして言[い]われた。『行[い]って、わたしに罪[つみ]を犯[おか]したアマレクを根[ね]絶[だ]やし、彼[かれ]らを滅[ほろ]ぼし尽[つ]くすまで戦[たたか]え』と。"
  19: "なぜ、あなたは主[しゅ]の声[こえ]を聞[き]かず、獲物[えもの]に飛[と]びついて、主[しゅ]の目[め]に悪[わる]いことをしたのか。」"
  20: "サウルはサムエルに言[い]った。「わたしは民[たみ]の声[こえ]を聞[き]いたのだ。そして主[しゅ]がわたしを遣[つか]わした道[みち]を行[い]き、アマレクの王[おう]アガグを連[つ]れて来[き]、アマレクは根[ね]絶[だ]やした。"
  21: "民[たみ]は獲物[えもの]のうちから、羊[ひつじ]の群[む]れと牛[うし]の群[む]れ、すなわち聖絶[せいぜつ]されたものの初[はつ]物[もの]を取[と]り、ギルガルでわたしたちの神[かみ]であられる主[しゅ]の前[まえ]に犠牲[ぎせい]をささげようとしたのだ。」"
  22: "サムエルは言[い]った。「主[しゅ]は燔祭[はんさい]や犠牲[ぎせい]を、主[しゅ]の声[こえ]を聞[き]くことと同じほどに喜[よろこ]ばれるだろうか。見[み]よ、聞[き]き従[したが]うことは犠牲[ぎせい]にまさり、耳[みみ]を傾[かたむ]けることは雄羊[おひつじ]の脂肪[しぼう]にまさる。"
  23: "なぜなら、罪[つみ]は占[うらな]いであり、苦[くる]しみと労苦[ろうく]はテラフィムがもたらすからだ。あなたは主[しゅ]の言葉[ことば]を蔑[さげす]んだので、主[しゅ]もあなたを蔑[さげす]み、イスラエルの王[おう]でなくされる。」"
  24: "サウルはサムエルに言[い]った。「わたしは罪[つみ]を犯[おか]した。主[しゅ]の言葉[ことば]とあなたの言葉[ことば]に背[そむ]いたからだ。民[たみ]を恐[おそ]れて、彼[かれ]らの声[こえ]を聞[き]いたのだ。"
  25: "今[いま]、どうかわたしの罪[つみ]を赦[ゆる]して、わたしとともに帰[かえ]ってくれ。わたしはあなたの神[かみ]であられる主[しゅ]を拝[おが]む。」"
  26: "サムエルはサウルに言[い]った。「わたしはあなたとともに帰[かえ]らない。あなたは主[しゅ]の言葉[ことば]を蔑[さげす]んだので、主[しゅ]もあなたを蔑[さげす]み、イスラエルの王[おう]でなくされるからだ。」"
  27: "サムエルが去[さ]ろうとして顔[かお]を向[む]けると、サウルは彼[かれ]の上着[うわぎ]の端[はし]をつかみ、それは裂[さ]けた。"
  28: "サムエルは彼[かれ]に言[い]った。「主[しゅ]は今日[きょう]、イスラエルの王国[おうこく]をあなたの手[て]から裂[さ]き取[と]り、あなたよりも良[よ]いあなたの隣人[りんじん]に与[あた]えられる。"
  29: "イスラエルは二[ふた]つに分[わ]かれる。主[しゅ]は心[こころ]を変[か]えず、また思[おも]い直[なお]されない。人[ひと]のように悔[く]いる方[かた]ではないからだ。」"
  30: "サウルは言[い]った。「わたしは罪[つみ]を犯[おか]した。どうか今[いま]、イスラエルの長老[ちょうろう]たちとわたしの民[たみ]の前[まえ]で、わたしを敬[うやま]ってくれ。そしてわたしとともに帰[かえ]り、あなたの神[かみ]であられる主[しゅ]を拝[おが]ませてくれ。」"
  31: "サムエルはサウルの後[あと]に帰[かえ]り、サウルは主[しゅ]を拝[おが]んだ。"
  32: "サムエルは言[い]った。「アマレクの王[おう]アガグをわたしのところへ連[つ]れて来[こ]い。」アガグは震[ふる]えながら彼[かれ]のところへ来[き]て言[い]った。「死[し]はこんなにも苦[にが]いのか。」"
  33: "サムエルはアガグに言[い]った。「あなたの剣[つるぎ]が女[おんな]たちから子[こ]どもを奪[うば]ったように、あなたの母[はは]も女[おんな]たちの間[あいだ]で子[こ]を奪[うば]われる。」サムエルはギルガルで、主[しゅ]の前[まえ]にアガグを屠[ほふ]った。"
  34: "サムエルはアルマテムへ去[さ]り、サウルはギベアの自分[じぶん]の家[いえ]へ上[のぼ]った。"
  35: "サムエルは死[し]ぬ日[ひ]まで、もはやサウルに会[あ]おうとしなかった。サムエルはサウルのことを悲[かな]しんだからである。主[しゅ]はサウルをイスラエルの王[おう]としたことを悔[く]いられた。"

notes:
  1: "χρῖσαί σε εἰς βασιλέα — помазать тебя в царя (χρίω); ἄκουε τῆς φωνῆς κυρίου — послушай гласа Господа."
  2: "κύριος σαβαωθ — Господь Саваоф (צבאות); ἐκδικήσω — взыщу, отомщу; ἀπήντησεν — встретил, противостал; ἀναβαίνοντος ἐξ Αἰγύπτου — когда он шёл из Египта."
  3: "πατάξεις — поразишь; Ιεριμ — Иерим (слав. «иерима»; возможно, «город» или искажённое имя); περιποιήσῃ — пощадишь, оставишь (περιποιέω); ἐξολεθρεύσεις — истребишь; ἀναθεματιεῖς — предашь заклятию (ἀναθεματίζω), 聖絶; οὐ φείσῃ — не пощадишь; ἀπὸ ἀνδρὸς ἕως γυναικὸς — от мужа до жены."
  4: "παρήγγειλεν — повелел; ἐπισκέπτεται — пересчитывает (ἐπισκέπτομαι); ἐν Γαλγαλοις — в Галгале; τετρακοσίας χιλιάδας ταγμάτων — четыреста тысяч строёв, отрядов (слав. «двесте тысящ» — иное чтение); τὸν Ιουδαν τριάκοντα χιλιάδας — Иуду тридцать тысяч."
  5: "ἕως τῶν πόλεων Αμαληκ — до городов Амалика; ἐνήδρευσεν — устроил засаду (ἐνεδρεύω); χειμάρρῳ — в потоке, в долине."
  6: "Κιναῖος — Кинеянин (קֵינִי); ἔκκλινον ἐκ μέσου — уклонись из среды; μὴ προσθῶ σε — чтобы не приложить, т. е. не погубить тебя; ἐποίησας ἔλεος — оказал милость."
  7: "ἀπὸ Ευιλατ ἕως Σουρ — от Евилата до Сура (Син. «от Хавилы»); ἐπὶ προσώπου Αἰγύπτου — пред лицом Египта."
  8: "συνέλαβεν — взял, захватил; ζῶντα — живым; ἐν στόματι ῥομφαίας — остриём меча."
  9: "περιεποιήσατο — пощадил (περιποιέω); τὰ ἀγαθὰ τῶν ποιμνίων — лучшее из отар; ἐδεσμάτων — яств (ἔδεσμα); ἀμπελώνων — виноградников; ἠτιμωμένον καὶ ἐξουδενωμένον — униженное и презренное."
  10: "ῥῆμα κυρίου — слово Господне; λέγων — говоря."
  11: "Παρακέκλημαι — «сожалею» (παρακαλέω; слав. «раскаяхся»); ἐβασίλευσα — поставил царём; ἀπέστρεψεν ἀπὸ ὄπισθέν μου — отвратился от Меня; ἠθύμησεν — опечалился (ἀθυμέω); ἐβόησεν — взывал."
  12: "ὤρθρισεν — встал рано; εἰς ἀπάντησιν Ισραηλ — навстречу Израилю; Ἥκει — пришёл; ἀνέστακεν αὐτῷ χεῖρα — «воздвиг себе руку», т. е. памятник; ἐπέστρεψεν τὸ ἅρμα — обратил колесницу; τὰ πρῶτα τῶν σκύλων — начатки добычи."
  13: "Εὐλογητὸς σὺ τῷ κυρίῳ — благословен ты у Господа; ἔστησα πάντα — исполнил всё (ἵστημι); ὅσα ἐλάλησεν κύριος — что говорил Господь."
  14: "φωνὴ τοῦ ποιμνίου — голос отары; φωνὴ τῶν βοῶν — голос волов; ὧν ἐγὼ ἀκούω — который я слышу."
  15: "Ἐξ Αμαληκ ἤνεγκα — из Амалика привёл; περιεποιήσατο — пощадил; τὰ κράτιστα — лучшее (κράτιστος); ὅπως τυθῇ — чтобы принесено было в жертву (θύω); τὰ λοιπὰ ἐξωλέθρευσα — остальное истребил."
  16: "Ἄνες — постой, умолкни (ἀνίημι); ἀπαγγελῶ — возвещу; τὴν νύκτα — ночью (винительный времени)."
  17: "Οὐχὶ μικρὸς σὺ εἶ ἐνώπιον αὐτοῦ — не мал ли ты пред Ним; ἡγούμενος σκήπτρου φυλῆς Ισραηλ — вождь скипетра колена Израиля; ἔχρισέν σε — помазал тебя."
  18: "ἐν ὁδῷ — в путь; ἐξολέθρευσον — истреби; τοὺς ἁμαρτάνοντας εἰς ἐμέ — согрешающих против Меня; ἕως συντελέσῃς — пока не истребишь."
  19: "ἵνα τί — почему; ὥρμησας τοῦ θέσθαι ἐπὶ τὰ σκῦλα — устремился на добычу; τὸ πονηρὸν ἐνώπιον κυρίου — злое пред Господом."
  20: "Διὰ τὸ ἀκοῦσαί με τῆς φωνῆς τοῦ λαοῦ — из-за того, что я послушал голос народа (в Син. «гласа Господа» — по МТ); ᾗ ἀπέστειλέν με — которым послал меня; ἤγαγον — привёл."
  21: "τὰ πρῶτα τοῦ ἐξολεθρεύματος — начатки истребляемого (ἐξολέθρευμα); θῦσαι — принести в жертву; ἐν Γαλγαλοις — в Галгале."
  22: "θελητὸν τῷ κυρίῳ — угодно Господу (θελητός); ἀκοὴ ὑπὲρ θυσίαν ἀγαθή — послушание лучше жертвы; ἐπακρόασις — внимание, покорность; στέαρ κριῶν — тук овнов."
  23: "ἁμαρτία οἰώνισμά ἐστιν — «грех есть гадание» (οἰώνισμα — птицегадание, знамение); ὀδύνην καὶ πόνους θεραφιν ἐπάγουσιν — «боль и труды приносят терафимы» — место тёмное; слав. и Син. передают иначе («противление — как идолопоклонство»); ἐξουδένωσας — презрел; ἐξουδενώσει σε — презрит тебя; μὴ εἶναι βασιλέα — чтобы не быть царём."
  24: "παρέβην τὸν λόγον — преступил слово; ἐφοβήθην τὸν λαόν — убоялся народа."
  25: "ἆρον δὴ τὸ ἁμάρτημά μου — сними же грех мой (αἴρω); ἀνάστρεψον μετ᾽ ἐμοῦ — возвратись со мною; προσκυνήσω — поклонюсь."
  26: "Οὐκ ἀναστρέφω — не возвращусь; ἐξουδένωσας — презрел; τοῦ μὴ εἶναι — чтобы не быть."
  27: "τὸ πτερύγιον τῆς διπλοίδος — край двойной одежды (πτερύγιον — крылышко, край; διπλοΐς — плащ); διέρρηξεν — разодрал."
  28: "Διέρρηξεν κύριος τὴν βασιλείαν — разодрал Господь царство; ἐκ χειρός σου — из руки твоей; τῷ πλησίον σου τῷ ἀγαθῷ ὑπὲρ σέ — ближнему твоему, лучшему тебя."
  29: "διαιρεθήσεται Ισραηλ εἰς δύο — разделится Израиль на два; οὐκ ἀποστρέψει οὐδὲ μετανοήσει — не отвратится и не раскается; οὐχ ὡς ἄνθρωπός ἐστιν — не как человек Он. Слав. добавляет «святый израилев», в гр этого нет — не вносим."
  30: "δόξασόν με — прославь, почти меня; ἐνώπιον πρεσβυτέρων — пред старейшинами; ἀνάστρεψον — возвратись."
  31: "ἀνέστρεψεν — возвратился; προσεκύνησεν τῷ κυρίῳ — поклонился Господу (подлежащее — Саул, слав. «поклонися саул»)."
  32: "τρέμων — дрожа; Εἰ οὕτως πικρὸς ὁ θάνατος; — так ли горька смерть? (Син. «конечно, горечь смерти миновалась?» — иное понимание)."
  33: "καθότι ἠτέκνωσεν γυναῖκας — как лишил детей жён (τεκνόω); ἀτεκνωθήσεται — будет лишена детей; ἔσφαξεν — заколол."
  34: "ἀπῆλθεν εἰς Αρμαθαιμ — отошёл в Армафем (Рама); ἀνέβη εἰς τὸν οἶκον αὐτοῦ εἰς Γαβαα — поднялся в дом свой в Гиву."
  35: "οὐ προσέθετο — не приложил, более не; ἐπένθει — печалился (πενθέω); μετεμελήθη — раскаялся (μεταμέλομαι)."
