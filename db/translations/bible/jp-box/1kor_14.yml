verses:
  1: "愛[あい]を追[お]い求[もと]め、霊[れい]の賜物[たまもの]を熱心[ねっしん]に求[もと]めなさい。とりわけ、預言[よげん]することを求[もと]めなさい。"
  2: "なぜなら、異言[いげん]で語[かた]る者[もの]は、人[ひと]にではなく神[かみ]に語[かた]るからである。だれも聞[き]き取[と]れないからである。その人[ひと]は霊[れい]によって奥義[おうぎ]を語[かた]っているのである。"
  3: "これに対[たい]し、預言[よげん]する者[もの]は、人[ひと]を建[た]て上[あ]げ、励[はげ]まし、慰[なぐさ]めるために語[かた]るのである。"
  4: "異言[いげん]で語[かた]る者[もの]は自分[じぶん]を建[た]て上[あ]げ、預言[よげん]する者[もの]は教会[きょうかい]を建[た]て上[あ]げる。"
  5: "わたしは、あなたがたが皆[みな]異言[いげん]で語[かた]ることを願[ねが]っている。しかし、それ以上[いじょう]に、あなたがたが預言[よげん]することを願[ねが]っている。異言[いげん]で語[かた]る者[もの]より、預言[よげん]する者[もの]の方[ほう]がまさっている。ただし、異言[いげん]を解[と]き明[あ]かして、教会[きょうかい]が建[た]て上[あ]げられるようにしない限[かぎ]りは、そうではない。"
  6: "そこで、兄弟[きょうだい]たちよ。わたしがあなたがたのもとへ行[い]って異言[いげん]で語[かた]っても、あなたがたに何[なに]の益[えき]になるだろうか。啓示[けいじ]、知識[ちしき]、預言[よげん]、教[おし]えのいずれかによって、あなたがたに語[かた]るのでなければ、何[なに]の益[えき]もない。"
  7: "同[おな]じように、命[いのち]のないもの、たとえば笛[ふえ]や琴[こと]でも、音[おと]に区別[くべつ]がなければ、何[なに]が吹[ふ]かれ、何[なに]が弾[ひ]かれているのか、どうして分[わ]かるだろうか。"
  8: "また、もしラッパが定[さだ]まらない音[ね]を出[だ]したら、だれが戦[いくさ]の用[よう]意[い]をするだろうか。"
  9: "同[おな]じように、あなたがたも、舌[した]で分[わ]かりやすい言葉[ことば]を語[かた]らなければ、何[なに]を語[かた]っているのか、どうして分[わ]かるだろうか。あなたがたは空[くう]気[き]に向[む]かって語[かた]っていることになるからである。"
  10: "この世[よ]には、おそらくこれほど多[おお]くの種類[しゅるい]の音[おと]があるが、そのどれも無意味[むいみ]ではない。"
  11: "それゆえ、もしわたしがその音[おと]の意味[いみ]を知[し]らなければ、わたしは語[かた]る者[もの]にとって異国[いこく]人[じん]となり、語[かた]る者[もの]もわたしにとって異国[いこく]人[じん]となる。"
  12: "同[おな]じように、あなたがたも、霊[れい]の賜物[たまもの]を熱心[ねっしん]に求[もと]めているのだから、教会[きょうかい]を建[た]て上[あ]げるために、ますます豊[ゆた]かに受[う]けられるように求[もと]めなさい。"
  13: "それゆえ、異言[いげん]で語[かた]る者[もの]は、それを解[と]き明[あ]かすことができるように祈[いの]りなさい。"
  14: "なぜなら、わたしが異言[いげん]で祈[いの]るとき、わたしの霊[れい]は祈[いの]っているが、わたしの知性[ちせい]は実[み]を結[むす]ばないからである。"
  15: "では、どうすべきか。わたしは霊[れい]で祈[いの]り、知性[ちせい]でも祈[いの]ろう。霊[れい]で歌[うた]い、知性[ちせい]でも歌[うた]おう。"
  16: "そうでなければ、あなたが霊[れい]で祝福[しゅくふく]の祈[いの]りをしても、その場[ば]に居合[いあ]わせた部外者[ぶがいしゃ]が、あなたの感謝[かんしゃ]の祈[いの]りにどうして「アーメン」と言[い]えるだろうか。あなたが何[なに]を言[い]っているのか、分[わ]からないからである。"
  17: "確[たし]かに、あなたはよく感謝[かんしゃ]している。しかし、ほかの人[ひと]は建[た]て上[あ]げられないのである。"
  18: "わたしは神[かみ]に感謝[かんしゃ]している。あなたがたの誰[だれ]よりも多[おお]く異言[いげん]で語[かた]っている。"
  19: "しかし、教会[きょうかい]の中[なか]では、異言[いげん]で一万[いちまん]の言葉[ことば]を語[かた]るより、ほかの人[ひと]たちをも教[おし]え導[みちび]くために、わたしの知性[ちせい]で五[いつ]つの言葉[ことば]を語[かた]ることを望[のぞ]んでいる。"
  20: "兄弟[きょうだい]たちよ、考[かんが]え方[かた]において子[こ]どもになってはならない。むしろ、悪[あく]においては幼[おさな]い者[もの]でありなさい。考[かんが]え方[かた]においては大人[おとな]になりなさい。"
  21: "律法[りっぽう]にこう書[か]かれている。「異[こと]なる言葉[ことば]を語[かた]る者[もの]たちと、異[こと]なる唇[くちびる]によって、わたしはこの民[たみ]に語[かた]る。それでも、彼[かれ]らはわたしに聞[き]き従[したが]わない」と主[しゅ]は言[い]われる。"
  22: "それゆえ、異言[いげん]は信[しん]じる者[もの]のためではなく、信[しん]じない者[もの]のためのしるしであり、預言[よげん]は信[しん]じない者[もの]のためではなく、信[しん]じる者[もの]のためのものである。"
  23: "そこで、もし教会[きょうかい]全体[ぜんたい]が一[ひと]つの所[ところ]に集[あつ]まって、皆[みな]が異言[いげん]で語[かた]っているところへ、部外者[ぶがいしゃ]や信[しん]じない者[もの]が入[はい]って来[き]たら、彼[かれ]らは、あなたがたは気[き]が狂[くる]っていると言[い]うではないか。"
  24: "しかし、もし皆[みな]が預言[よげん]しているところへ、信[しん]じない者[もの]や部外者[ぶがいしゃ]が入[はい]って来[き]たら、その人[ひと]は皆[みな]から責[せ]められ、皆[みな]から吟味[ぎんみ]される。"
  25: "その心[こころ]の隠[かく]れたことが明[あき]らかになり、こうして、その人[ひと]はひれ伏[ふ]して神[かみ]を拝[おが]み、「まことに、神[かみ]はあなたがたの中[なか]におられる」と告[つ]げる。"
  26: "それでは、兄弟[きょうだい]たちよ、どうすべきか。あなたがたが集[あつ]まるとき、それぞれが、賛美[さんび]の歌[うた]を持[も]ち、教[おし]えを持[も]ち、啓示[けいじ]を持[も]ち、異言[いげん]を持[も]ち、解[と]き明[あ]かしを持[も]っている。すべては建[た]て上[あ]げのために行[おこな]われなければならない。"
  27: "異言[いげん]で語[かた]る者[もの]がいるなら、二人[ふたり]、または多[おお]くとも三人[さんにん]までとし、順[じゅん]を追[お]って語[かた]り、一人[ひとり]が解[と]き明[あ]かしなさい。"
  28: "しかし、解[と]き明[あ]かす者[もの]がいないなら、教会[きょうかい]の中[なか]では黙[だま]り、自分[じぶん]と神[かみ]にだけ語[かた]りなさい。"
  29: "預言[よげん]する者[もの]は二人[ふたり]か三人[さんにん]が語[かた]り、ほかの者[もの]たちはそれをよく見分[みわ]けなさい。"
  30: "しかし、座[すわ]っているほかの者[もの]に啓示[けいじ]が与[あた]えられたなら、先[さき]に語[かた]っていた者[もの]は黙[だま]りなさい。"
  31: "なぜなら、あなたがたは皆[みな]、一人[ひとり]ずつ預言[よげん]することができるからである。それは、皆[みな]が学[まな]び、皆[みな]が励[はげ]まされるためである。"
  32: "預言[よげん]者[しゃ]たちの霊[れい]は、預言[よげん]者[しゃ]たちに従[したが]う。"
  33: "なぜなら、神[かみ]は無秩序[むちつじょ]の神[かみ]ではなく、平和[へいわ]の神[かみ]だからである。すべての聖[せい]なる者[もの]たちの教会[きょうかい]でそうであるように、"
  34: "婦人[ふじん]たちは教会[きょうかい]の中[なか]で黙[だま]っていなさい。彼女[かのじょ]たちに語[かた]ることは許[ゆる]されていないからである。むしろ、律法[りっぽう]も言[い]っているように、従[したが]いなさい。"
  35: "何[なに]か学[まな]びたいことがあるなら、家[いえ]で自分[じぶん]の夫[おっと]に尋[たず]ねなさい。婦人[ふじん]が教会[きょうかい]の中[なか]で語[かた]るのは恥[は]ずべきことだからである。"
  36: "それとも、神[かみ]の言葉[ことば]はあなたがたから出[で]たのか。あなたがただけに届[とど]いたのか。"
  37: "自分[じぶん]を預言[よげん]者[しゃ]または霊[れい]の人[ひと]と思[おも]う者[もの]は、わたしがあなたがたに書[か]いていることが主[しゅ]の戒[いまし]めであることを認[みと]めなさい。"
  38: "もしだれかがこれを認[みと]めないなら、その人[ひと]は認[みと]められないままであろう。"
  39: "それゆえ、わたしの兄弟[きょうだい]たちよ、預言[よげん]することを熱心[ねっしん]に求[もと]めなさい。また、異言[いげん]で語[かた]ることを禁[きん]じてはならない。"
  40: "ただ、すべてのことを品位[ひんい]をもって、秩序[ちつじょ]に従[したが]って行[おこな]いなさい。"

notes:
  1: "διώκετε — «гонитесь»; 追い求める. πνευματικά — 霊の賜物. μᾶλλον δέ — «тем более»; とりわけ."
  2: "γλώσσῃ (дат.) — 異言で. οὐδεὶς ἀκούει — «никто не слышит»; 聞き取れない. μυστήρια — 奥義."
  3: "οἰκοδομή, παράκλησις, παραμυθία — 建て上げ, 励まし, 慰め."
  4: "ἑαυτόν / ἐκκλησίαν οἰκοδομεῖ — 自分を / 教会を建て上げる."
  5: "ἐκτὸς εἰ μὴ διερμηνεύῃ — «если только не истолкует»; 解き明かす. μείζων — まさっている."
  6: "ἀποκάλυψις, γνῶσις, προφητεία, διδαχή — 啓示, 知識, 預言, 教え."
  7: "αὐλός, κιθάρα — 笛, 琴. διαστολή — «различение»; 区別."
  8: "σάλπιγξ — ラッパ. παρασκευάσεται εἰς πόλεμον — 戦いの用意をする."
  10: "γένη φωνῶν — «роды звуков»; 種類の音. εἰ τύχοι — おそらく. ἄφωνον — 無意味なもの."
  11: "βάρβαρος — 異国人."
  12: "ζηλωταί ἐστε πνευμάτων — «ревнуете о духовных»; 霊の賜物を熱心に求める. περισσεύητε — 豊かに受ける."
  14: "νοῦς — 知性. ἄκαρπος — 実を結ばない."
  16: "ἰδιώτης — «непосвящённый, посторонний»; 部外者. εὐλογῇς — 祝福の祈り. εὐχαριστία — 感謝."
  17: "ὁ ἕτερος — «другой»; ほかの人."
  18: "πάντων ὑμῶν μᾶλλον — «более всех вас»; 誰よりも多く."
  19: "κατηχήσω — «наставлю»; 教え導く. μυρίους — 一万."
  20: "φρένες — 考え方; νηπιάζετε — 幼い者でありなさい; τέλειοι — 大人."
  21: "Цитата Ис 28:11–12. λέγει κύριος стоит в конце, вне цитаты, поэтому вложенная речь не выделяется 『』."
  22: "εἰς σημεῖον — しるし."
  23: "μαίνεσθε — 気が狂っている."
  25: "ἐλέγχεται, ἀνακρίνεται — 責められ, 吟味される. πεσὼν ἐπὶ πρόσωπον — ひれ伏して."
  26: "ψαλμός — 賛美の歌. ἑρμηνεία — 解き明かし."
  27: "κατὰ δύο ἢ τὸ πλεῖστον τρεῖς — 二人か、多くとも三人."
  29: "διακρινέτωσαν — 見分ける."
  32: "πνεύματα προφητῶν — 預言者たちの霊."
  33: "ἀκαταστασία — 無秩序. οὐ γάρ — なぜなら…からである. Ὡς … τῶν ἁγίων — фраза начинается здесь и продолжается в 14:34; поэтому стих кончается на 「…ように、」."
  34: "ὑποτασσέσθωσαν — 従いなさい."
  37: "πνευματικός — 霊の人."
  38: "ἀγνοεῖται — «остаётся неузнанным»; 認められないまま. Игра слов с ἐπιγινωσκέτω в 14:37 сохранена: 認める / 認められる."
  39: "[μου] в базе в квадратных скобках — 〔…〕 не ставится."
  40: "εὐσχημόνως — 品位をもって; κατὰ τάξιν — 秩序に従って."
