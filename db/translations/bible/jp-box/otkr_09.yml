# jp-box, Откровение Иоанна, глава 9. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Греческий сайта (критический) — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 9: пятая труба — падшая звезда и саранча из бездны (1–12);
# шестая труба — четыре ангела при Евфрате и конное войско (13–21).
# Красного и синего нет: прямой речи Христа и Богородицы в главе нет; голос от жертвенника
# (9:14) и слова ангела — не красные, <j>/<mo> не ставятся.
# 〔…〕 одно: 9:13 «四つ» (τεσσάρων) в gr-lxx-byz отсутствует (проверено запросом к базе),
# а у jp-joc и в церковном тексте «четыре рога» есть, поэтому взято в 〔…〕.
# Сноска одна: 9:11 アバドン/アポリオン — первое место в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: otkr
chapter: 9
draft: true

verses:
  1: "第五[だいご]の天使[てんし]がラッパを吹[ふ]いた。すると、わたしは、天[てん]から地[ち]に落[お]ちた星[ほし]を見[み]た。その星[ほし]には、底知[そこし]れない穴[あな]の鍵[かぎ]が与[あた]えられた。"
  2: "そして、底知[そこし]れない穴[あな]を開[あ]けると、その穴[あな]から大[おお]きな炉[ろ]の煙[けむり]のような煙[けむり]が立[た]ち上[のぼ]り、太陽[たいよう]と空気[くうき]がその穴[あな]の煙[けむり]で暗[くら]くなった。"
  3: "その煙[けむり]の中[なか]から、いなごが地[ち]に飛[と]び出[だ]してきた。そして、地[ち]の蠍[さそり]が持[も]つのと同[おな]じ力[ちから]が、彼[かれ]らに与[あた]えられた。"
  4: "彼[かれ]らは、地[ち]の草[くさ]や、すべての緑[みどり]のもの、すべての木[き]を害[そこな]ってはならない、ただ、額[ひたい]に神[かみ]の印[いん]を持[も]たない人[ひと]たちだけを害[そこな]うようにと命[めい]じられた。"
  5: "そして、彼[かれ]らは人[ひと]々[びと]を殺[ころ]すのではなく、五[ご]か月[げつ]の間[あいだ]苦[くる]しめることが許[ゆる]された。その苦[くる]しみは、蠍[さそり]が人[ひと]を刺[さ]すときの苦[くる]しみのようであった。"
  6: "その日々[ひび]には、人[ひと]々[びと]は死[し]を求[もと]めるが、見[み]つけることはできず、死[し]ぬことを望[のぞ]むが、死[し]は彼[かれ]らから逃[に]げ去[さ]る。"
  7: "いなごの姿[すがた]は、戦[たたか]いのために備[そな]えられた馬[うま]のようで、その頭[あたま]には金[きん]に似[に]た冠[かんむり]があり、顔[かお]は人[ひと]の顔[かお]のようであった。"
  8: "その髪[かみ]は女[おんな]の髪[かみ]のようで、歯[は]はライオンの歯[は]のようであった。"
  9: "その胸[むね]には鉄[てつ]の胸当[むねあ]てのようなものがあり、その翼[つばさ]の音[おと]は、多[おお]くの馬[うま]が戦[たたか]いへと駆[か]けていく戦車[せんしゃ]の音[おと]のようであった。"
  10: "彼[かれ]らには蠍[さそり]のような尾[お]と針[はり]があり、その尾[お]によって五[ご]か月[げつ]の間[あいだ]、人[ひと]々[びと]を害[そこな]う力[ちから]があった。"
  11: "彼[かれ]らには王[おう]があった。底知[そこし]れない穴[あな]の天使[てんし]である。その名[な]は、ヘブライ語[ご]ではアバドン⟨ヘブライ語[ご]で「滅[ほろ]び」の意[い]。ギリシア語[ご]のアポリオンは「滅[ほろ]ぼす者[もの]」の意[い]。⟩、ギリシア語[ご]ではアポリオンといった。"
  12: "第一[だいいち]の災[わざわ]いは過[す]ぎ去[さ]った。見[み]よ、この後[のち]、なお二[ふた]つの災[わざわ]いが来[く]る。"
  13: "第六[だいろく]の天使[てんし]がラッパを鳴[な]らすと、神[かみ]の御前[みまえ]にある金[きん]の祭壇[さいだん]の〔四[よっ]つの〕角[つの]から、一[ひと]つの声[こえ]が響[ひび]いた。"
  14: "その声[こえ]は、ラッパを持[も]つ第六[だいろく]の天使[てんし]に言[い]った。「大[おお]きな川[かわ]ユーフラテスのほとりに縛[しば]られている四人[よにん]の天使[てんし]を解[と]き放[はな]て。」"
  15: "その時[とき]、その日[ひ]、その月[つき]、その年[とし]に、人[ひと]々[びと]の三分[さんぶん]の一[いち]を殺[ころ]すために備[そな]えられていた四人[よにん]の天使[てんし]が解[と]き放[はな]たれた。"
  16: "騎兵[きへい]の軍[ぐん]の数[かず]は二万[にまん]の万[まん]、すなわち二億[におく]であった。わたしはその数[かず]を聞[き]いた。"
  17: "わたしは幻[まぼろし]の中[なか]で、馬[うま]と、それに乗[の]っている者[もの]たちを見[み]た。彼[かれ]らは火[ひ]と紫[むらさき]と硫黄[いおう]の色[いろ]をした胸当[むねあ]てを着[き]けており、馬[うま]の頭[あたま]はライオンの頭[あたま]のようで、その口[くち]から火[ひ]と煙[けむり]と硫黄[いおう]が出[で]ていた。"
  18: "この三[みっ]つの災[わざわ]いによって、すなわち、彼[かれ]らの口[くち]から出[で]る火[ひ]と煙[けむり]と硫黄[いおう]によって、人[ひと]々[びと]の三分[さんぶん]の一[いち]が殺[ころ]された。"
  19: "馬[うま]の力[ちから]は口[くち]と尾[お]にあり、その尾[お]は蛇[へび]のようで、頭[あたま]があって、それによって人[ひと]を害[そこな]うのである。"
  20: "残[のこ]りの人[ひと]々[びと]、すなわち、これらの災[わざわ]いで殺[ころ]されなかった者[もの]たちは、自分[じぶん]の手[て]のわざを悔[く]い改[あらた]めず、悪霊[あくりょう]や、金[きん]、銀[ぎん]、銅[どう]、石[いし]、木[き]で造[つく]られた、見[み]ることも聞[き]くことも歩[あゆ]むこともできない偶像[ぐうぞう]を拝[はい]むのをやめなかった。"
  21: "また、自分[じぶん]の殺人[さつじん]、魔術[まじゅつ]、淫行[いんこう]、盗[ぬす]みを悔[く]い改[あらた]めなかった。"

notes:
  1: "ὁ πέμπτος ἄγγελος — 第五の天使. ἀστέρα … πεπτωκότα — 落ちた星 (perf. part., уже упавшая). τὸ φρέαρ τῆς ἀβύσσου — 底知れない穴 (ἄβυσσος — «бездна»); κλείς — 鍵."
  2: "τὸ φρέαρ τῆς ἀβύσσου — 底知れない穴, как в ст. 1. καπνὸς καμίνου μεγάλης — 大きな炉の煙. ἐσκοτώθη — 暗くなった (о солнце и воздухе)."
  3: "ἀκρίδες — いなご; сноска не нужна: слово уже в Мф 3:4 и Мк 1:6. σκορπίοι — 蠍, тоже уже в Лк 10:19; 11:12."
  4: "χόρτος — 草; χλωρόν — 緑のもの; δένδρον — 木. σφραγῖδα τοῦ θεοῦ — 神の印 (печать). ἐρρέθη — 命じられた (букв. «сказано»)."
  5: "μῆνας πέντε — 五か月. βασανισμός — 苦しみ; σκορπίου … παίσῃ — 蠍が刺す. ἵνα μὴ ἀποκτείνωσιν — 殺すのではなく."
  6: "ζητήσουσιν … οὐ μὴ εὑρήσουσιν — 求めても見つからない (οὐ μή — сильное отрицание). φεύγει ὁ θάνατος — 死は逃げ去る."
  7: "ὁμοιώματα — 姿. ἵπποις ἡτοιμασμένοις εἰς πόλεμον — 戦いに備えられた馬. στέφανοι ὅμοιοι χρυσῷ — 金に似た冠; дословно, не «золотые венцы»."
  8: "τρῖχες γυναικῶν — 女の髪; ὀδόντες λεόντων — ライオンの歯. Женский образ и львиные зубы оставлены без сглаживания."
  9: "θώρακες σιδηροῦς — 鉄の胸当て. φωνὴ ἁρμάτων — 戦車の音; ἵππων πολλῶν τρεχόντων εἰς πόλεμον — 多くの馬が戦いに駆ける."
  10: "οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα — 蠍のような尾と針. ἐξουσία — 力; в ст. 3, 10, 19 передано 力, в гл. 13 — 権威."
  11: "Ἀβαδδών (евр. «погибель») и Ἀπολλύων (греч. «губитель») — アバドン, アポリオン; сноска при первом месте в корпусе. τὸν ἄγγελον τῆς ἀβύσσου — 底知れない穴の天使."
  12: "ἡ οὐαὶ ἡ μία — 第一の災い (в греч. «одно горе»). ἔτι δύο οὐαί — なお二つの災い."
  13: "τεσσάρων в gr-lxx-byz нет: там «ἐκ τῶν κεράτων» — 祭壇の角. У jp-joc и в церковном тексте (Елизаветинская, Синодальный) — «четырёх рогов», поэтому 〔四つの〕. Слово κεράτων в базе есть."
  14: "φωνὴν μίαν — 一つの声. τοὺς δεδεμένους — 縛られている. Εὐφράτης — ユーフラテス. Слова от жертвенника — не красные."
  15: "εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν — その時、その日、その月、その年 (четырёхчастная формула; без добавления «определённый»). ἵνα ἀποκτείνωσιν τὸ τρίτον — 三分の一を殺すため."
  16: "δισμυριάδες μυριάδων — 二万の万 = 二億 (20 000 × 10 000). ἤκουσα τὸν ἀριθμόν — 数を聞いた."
  17: "θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις — 火と紫と硫黄の色の胸当て (цвета, не вещества). κεφαλαὶ λεόντων — ライオンの頭. ἐκ τῶν στομάτων — 口から."
  18: "ἀπὸ τῶν τριῶν πληγῶν — 三つの災いによって. τὸ τρίτον τῶν ἀνθρώπων — 人類の三分の一."
  19: "ἡ ἐξουσία … ἐν τῷ στόματι … καὶ ἐν ταῖς οὐραῖς — 力は口と尾に. οὐραὶ ὅμοιαι ὄφεσιν, ἔχουσαι κεφαλάς — 蛇のような尾に頭がある."
  20: "οἱ λοιποί — 残りの者たち. μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν — 手のわざを悔い改めず. δαιμόνια — 悪霊; εἴδωλα — 偶像. ἵνα μὴ προσκυνήσουσιν — чтобы не поклоняться (в базе fut. ind., смысл тот же)."
  21: "φόνοι, φάρμακα, πορνεία, κλέμματα — 殺人、魔術、淫行、盗み. φάρμακα здесь — «колдовство, яды»."
