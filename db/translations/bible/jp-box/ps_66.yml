# jp-box, Псалтирь, псалом 66. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 66: благословение и свет лица Божия (1–2), хвала народов (3, 5),
# радость народов о праведном суде (4), плод земли и страх Божий до концов земли (6–7).
# Красного и синего нет. Прямой речи в псалме нет; кавычек в главе нет.
# Это благодарение и молитва, а не пророчество от лица Христа.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα, в конце ст. 1 и 4) не передаётся — по решению пользователя, как у jp-joc.
# Сносок ⟨…⟩ нет: 祝福, 救い, 民 уже в корпусе. jp-ni не использовался.

