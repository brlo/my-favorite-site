verses:
  0: "指揮者[しきしゃ]に。賛美[さんび]のうちに。詩[うた]の歌[うた]。"
  1: "神[かみ]よ、わたしたちをあわれみ、祝福[しゅくふく]してください。あなたの顔[かお]をわたしたちの上[うえ]に照[て]らしてください。"
  2: "それは、地[ち]の上[うえ]であなたの道[みち]が、すべての民[たみ]の中[なか]であなたの救[すく]いが知[し]られるためである。"
  3: "諸[しょ]国[こく]の民[たみ]よ、あなたをほめたたえよ。すべての民[たみ]よ、あなたをほめたたえよ。"
  4: "国[くに]々[ぐに]の民[たみ]は喜[よろこ]び、楽[たの]しむように。あなたは民[たみ]を正[ただ]しく裁[さば]き、地[ち]の国[くに]々[ぐに]の民[たみ]を導[みちび]かれるからである。"
  5: "諸[しょ]国[こく]の民[たみ]よ、あなたをほめたたえよ。すべての民[たみ]よ、あなたをほめたたえよ。"
  6: "地[ち]はその実[み]を結[むす]んだ。神[かみ]が、わたしたちの神[かみ]が、わたしたちを祝福[しゅくふく]してくださるように。"
  7: "神[かみ]がわたしたちを祝福[しゅくふく]してくださるように。地[ち]の果[は]てのすべての者[もの]が、神[かみ]を畏[おそ]れるように。"

notes:
  0: "Εἰς τὸ τέλος, ἐν ὕμνοις — «в конец, в гимнах» (指揮者に。賛美のうちに) — так же передано в Пс 8. ψαλμὸς ᾠδῆς — 詩の歌 («псалом песни»). В ru-базе «На струнных орудиях» — по евр. надписанию, в греч. ἐν ὕμνοις; переведено с греческого. Надписание — стих 0; скобками не маркируется."
  1: "Ὁ θεὸς οἰκτιρήσαι ἡμᾶς καὶ εὐλογήσαι ἡμᾶς — 神よ、わたしたちをあわれみ、祝福してください (οἰκτίρω — «миловать»; оптатив, как в священническом благословении Числ 6:24–26; слав. «ущедри ны и благослови ны»). ἐπιφάναι τὸ πρόσωπον αὐτοῦ ἐφ᾽ ἡμᾶς — あなたの顔をわたしたちの上に照らしてください (ἐπιφαίνω — «осиять»; слав. «просвети лице Свое на ны»). В конце стиха в базе διάψαλμα — не передаётся."
  2: "τοῦ γνῶναι ἐν τῇ γῇ τὴν ὁδόν σου — 地の上であなたの道が知られるために (γνῶναι — инфинитив цели). ἐν πᾶσιν ἔθνεσιν τὸ σωτήριόν σου — すべての民の中で、あなたの救いが (σωτήριον — 救い)."
  3: "ἐξομολογησάσθωσάν σοι λαοί — 諸国の民よ、あなたをほめたたえよ (ἐξομολογέομαι в псалмах — «славить, исповедовать хвалой», не «каяться»; слав. «да исповедятся Тебе людие»). λαοὶ πάντες — すべての民よ; повтор строки в ст. 5 дословный — параллелизм сохранён."
  4: "εὐφρανθήτωσαν καὶ ἀγαλλιάσθωσαν ἔθνη — 国々の民は喜び、楽しむように (ἔθνη — 国々の民, в отличие от λαοί — 民 в ст. 3 и 5) (ἀγαλλιάομαι — «ликовать»). ὅτι κρινεῖς λαοὺς ἐν εὐθύτητι — あなたは民を正しく裁き (εὐθύτης — «прямота, правота»). ἔθνη ἐν τῇ γῇ ὁδηγήσεις — 地の民を導かれる (ὁδηγέω — «вести по дороге»). διάψαλμα в конце стиха не передаётся."
  5: "Повтор ст. 3 дословно — так в греч. и слав.; параллелизм не сглажен и не заменён местоимением."
  6: "γῆ ἔδωκεν τὸν καρπὸν αὐτῆς — 地はその実を結んだ (καρπός — «плод»; perfect, «уже дала»; слав. «земля даде плод свой»). εὐλογήσαι ἡμᾶς ὁ θεὸς ὁ θεὸς ἡμῶν — 神が、わたしたちの神が、祝福してくださるように (повтор θεός передан повтором 神, как в слав. «Бог, Бог наш»)."
  7: "εὐλογήσαι ἡμᾶς ὁ θεός — 神がわたしたちを祝福してくださるように (третье благословение подряд, ст. 1, 6, 7 — сохранено). καὶ φοβηθήτωσαν αὐτὸν πάντα τὰ πέρατα τῆς γῆς — 地の果てのすべての者が神を畏れるように (πέρατα — «пределы»; слав. «вси концы земли»)."
