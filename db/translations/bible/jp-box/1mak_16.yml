# jp-box, 1 Маккавейская, глава 16. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; совпадает с gr (24 стиха).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: 1–10 Иоанн разбивает Кендевея при Кедроне (ранен Иуда, брат Иоанна);
# 11–22 Птолемей, сын Авува, и гибель Симона с двумя сыновьями в Доке;
# 23–24 заключительная формула книги (дела Иоанна, книга дней его первосвященства).
# Голоса: 2–3 (речь Симона к сыновьям) — 「…».
# Слав. в 21 добавляет «и слышав ужасеся зело», в LXX эта клауза — начало 22;
# держим LXX (22).
