tr_code: jp-box
book: 1mak
chapter: 16
draft: true

verses:
  1: "ヨハネはガザラから上[のぼ]って来[き]て、ケンデバイオスが行[おこな]ったことを父[ちち]シモンに告[つ]げた。"
  2: "シモンは自分[じぶん]の二人[ふたり]の年上[としうえ]の子[こ]、ユダとヨハネを呼[よ]んで言[い]った。「わたしとわたしの兄弟[きょうだい]たち、わたしの父[ちち]の家[いえ]は、若[わか]い時[とき]から今日[きょう]までイスラエルの戦[たたか]いを戦[たたか]い、われわれの手[て]によってしばしばイスラエルを救[すく]うことが成[な]し遂[と]げられた。"
  3: "今[いま]、わたしは老[お]いた。あなたがたは神[かみ]のあわれみにより、年[とし]も十分[じゅうぶん]である。わたしとわたしの兄弟[きょうだい]の代[か]わりとなれ。出[で]て行[い]って、われわれの民族[みんぞく]のために戦[たたか]え。天[てん]からの助[たす]けがあなたがたとともにありますように。」"
  4: "彼[かれ]はその地方[ちほう]から二万人[にまんにん]の戦[たたか]う者[もの]と騎兵[きへい]を選[えら]び、ケンデバイオスに向[む]かって進[すす]み、モディンで夜[よる]を過[す]ごした。"
  5: "朝[あさ]早[はや]く起[お]きて平地[へいち]へ出[で]ると、見[み]よ、歩兵[ほへい]と騎兵[きへい]の大[おお]きな軍勢[ぐんぜい]が彼[かれ]らを迎[むか]えた。彼[かれ]らの中間[ちゅうかん]には谷川[たにがわ]があった。"
  6: "彼[かれ]は自分[じぶん]とその民[たみ]を彼[かれ]らの前[まえ]に陣取[じんと]らせた。民[たみ]が谷川[たにがわ]を渡[わた]るのを恐[おそ]れているのを見[み]て、彼[かれ]は先[さき]に渡[わた]り、兵[へい]たちはそれを見[み]て彼[かれ]の後[あと]を渡[わた]った。"
  7: "彼[かれ]は民[たみ]と騎兵[きへい]を分[わ]け、騎兵[きへい]を歩兵[ほへい]の中間[ちゅうかん]に置[お]いた。敵[てき]の騎兵[きへい]は非常[ひじょう]に多[おお]かった。"
  8: "彼[かれ]らはラッパを吹[ふ]き鳴[な]らし、ケンデバイオスとその陣営[じんえい]は打[う]ち破[やぶ]られ、彼[かれ]らのうち多[おお]くの者[もの]が傷[きず]ついて倒[たお]れた。残[のこ]った者[もの]は要塞[ようさい]へ逃[に]げた。"
  9: "その時[とき]、ヨハネの兄弟[きょうだい]ユダが傷[きず]つけられた。ヨハネは彼[かれ]らを、自分[じぶん]が建[た]てたケドロンまで追[お]った。"
  10: "彼[かれ]らはアゾトの野[の]にある塔[とう]へ逃[に]げ、彼[かれ]はそれを火[ひ]で焼[や]き、彼[かれ]らのうち二千人[にせんにん]ほどの者[もの]が倒[たお]れた。彼[かれ]は平和[へいわ]のうちにユダヤの地[ち]へ帰[かえ]った。"
  11: "アブブの子[こ]プトレマイオスはエリコの平地[へいち]の将軍[しょうぐん]に任[にん]じられており、多[おお]くの銀[ぎん]と金[きん]を持[も]っていた。"
  12: "彼[かれ]は大祭司[だいさいし]の婿[むこ]であった。"
  13: "彼[かれ]の心[こころ]は高[たか]ぶり、その地方[ちほう]を掌握[しょうあく]しようと望[のぞ]み、シモンとその子[こ]らに対[たい]して、彼[かれ]らを滅[ほろ]ぼそうと欺[あざむ]きをもって企[たくら]んだ。"
  14: "シモンはその地方[ちほう]の町々[まちまち]を巡[めぐ]り、その必要[ひつよう]を顧[かえり]みていた。彼[かれ]は自分[じぶん]の子[こ]マタティアとユダとともに、百七十七年[ひゃくななじゅうしちねん]の第十一[だいじゅういち]の月[つき]、すなわちサバトの月[つき]にエリコへ下[お]った。"
  15: "アブブの子[こ]は、自分[じぶん]が建[た]てたドクと呼[よ]ばれる小[ちい]さな要塞[ようさい]に、欺[あざむ]きをもって彼[かれ]らを迎[むか]え入[い]れ、彼[かれ]らのために大[おお]きな酒宴[しゅえん]を設[もう]け、そこに手[て]の者[もの]たちを隠[かく]した。"
  16: "シモンとその子[こ]らが酔[よ]ったとき、プトレマイオスとその手[て]の者[もの]たちは立[た]ち上[あ]がり、武器[ぶき]を取[と]ってシモンの酒宴[しゅえん]に押[お]し入[い]り、彼[かれ]とその二人[ふたり]の子[こ]、およびその従者[じゅうしゃ]のうちのある者[もの]たちを殺[ころ]した。"
  17: "彼[かれ]は大[おお]きな不義[ふぎ]を行[おこな]い、善[ぜん]に悪[あく]をもって報[むく]いた。"
  18: "プトレマイオスはこれらのことを書[か]き、自分[じぶん]に助[たす]けとして軍勢[ぐんぜい]を送[おく]り、彼[かれ]らの地方[ちほう]と町々[まちまち]を渡[わた]すよう王[おう]に送[おく]った。"
  19: "彼[かれ]はまた他[ほか]の者[もの]たちをガザラへ送[おく]ってヨハネを滅[ほろ]ぼそうとし、千人隊長[せんにんたいちょう]たちには、自分[じぶん]のもとへ来[く]るよう手紙[てがみ]を送[おく]った。彼[かれ]らに銀[ぎん]と金[きん]、贈[おく]り物[もの]を与[あた]えるためであった。"
  20: "また他[ほか]の者[もの]たちを、エルサレムと神殿[しんでん]の山[やま]を占領[せんりょう]するために送[おく]った。"
  21: "しかし、ある者[もの]が先[さき]に走[はし]ってガザラのヨハネに、父[ちち]と兄弟[きょうだい]たちが滅[ほろ]ぼされたこと、また彼[かれ]も殺[ころ]すために送[おく]ったことを告[つ]げた。"
  22: "これを聞[き]くと彼[かれ]は非常[ひじょう]に驚[おどろ]き、自分[じぶん]を滅[ほろ]ぼすために来[き]た者[もの]たちを捕[と]らえて殺[ころ]した。彼[かれ]らが自分[じぶん]を殺[ころ]そうと求[もと]めていることを知[し]ったからである。"
  23: "ヨハネの残[のこ]りの言葉[ことば]、彼[かれ]の戦[たたか]いと、彼[かれ]が雄々[おお]しく行[おこな]った武勇[ぶゆう]、彼[かれ]が建[た]てた城壁[じょうへき]の建造[けんぞう]、彼[かれ]の行[おこな]い、"
  24: "見[み]よ、これらは彼[かれ]の大祭司職[だいさいししょく]の日々[ひび]の書[しょ]に記[しる]されている。彼[かれ]が父[ちち]の後[あと]に大祭司[だいさいし]となった時[とき]からのことである。"

notes:
  1: "ἐκ Γαζαρων — «из Газары» (ガザラ); ἃ συνετέλεσεν Κενδεβαῖος — «что совершил Кендевей»."
  2: "ἀπὸ νεότητος ἕως τῆς σήμερον ἡμέρας — «от юности до сего дня»; εὐοδώθη ἐν ταῖς χερσὶν ἡμῶν — «благоуспешно было в руках наших»."
  3: "ἐν τῷ ἐλέει ἱκανοί ἐστε ἐν τοῖς ἔτεσιν — «по милости (Божией) достаточны в летах»; ὑπερμαχεῖτε ὑπὲρ τοῦ ἔθνους — «защищайте народ»."
  4: "ἐκοιμήθησαν ἐν Μωδειν — «ночевали в Модине»."
  5: "χειμάρρους — «поток (зимний ручей)»; ἀνὰ μέσον αὐτῶν — «между ними»."
  6: "δειλούμενον διαπερᾶσαι — «боящихся перейти»; διεπέρασεν πρῶτος — «перешёл первый»."
  7: "ἵππος τῶν ὑπεναντίων πολλὴ σφόδρα — «конницы противников весьма много»."
  8: "ἐσάλπισαν ταῖς σάλπιγξιν — «затрубили трубами»; εἰς τὸ ὀχύρωμα — «в крепость» (要塞)."
  9: "ἐτραυματίσθη Ιουδας ὁ ἀδελφὸς Ιωαννου — «ранен был Иуда, брат Иоанна»; ἕως ἦλθεν εἰς Κεδρων — «доколе не пришёл в Кедрон»."
  10: "εἰς τοὺς πύργους τοὺς ἐν τοῖς ἀγροῖς Ἀζώτου — «в башни, что в полях Азота»; ἐνεπύρισεν αὐτὴν ἐν πυρί — «сжёг его огнём»."
  11: "Πτολεμαῖος ὁ τοῦ Ἀβούβου — アブブの子プトレマイオス; καθεσταμένος στρατηγός — «поставлен военачальником»."
  12: "γαμβρὸς τοῦ ἀρχιερέως — «зять первосвященника»."
  13: "ὑψώθη ἡ καρδία αὐτοῦ — «вознеслось сердце его»; ἆραι αὐτούς — «убить (поднять руку на) их»."
  14: "ἐφοδεύων τὰς πόλεις — «обходя (посещая) города»; φροντίζων τῆς ἐπιμελείας αὐτῶν — «заботясь о попечении их»; μὴν Σαβατ — サバトの月 (11-й)."
  15: "Δωκ — ドク (небольшая крепость); μετὰ δόλου — «с хитростью»; ἐνέκρυψεν ἄνδρας — «скрыл людей»."
  16: "ἐμεθύσθη — «упился»; ἐπεισῆλθον τῷ Σιμωνι εἰς τὸ συμπόσιον — «вошли к Симону на пир»; παιδάρια — «отроки, служители»."
  17: "ἀθεσίαν μεγάλην — «великое беззаконие (вероломство)»; ἀπέδωκεν κακὰ ἀντὶ ἀγαθῶν — «воздал злое за благое»."
  18: "ὅπως ἀποστείλῃ αὐτῷ δυνάμεις εἰς βοήθειαν — «чтобы послал ему войска в помощь»; παραδῷ τὴν χώραν — «передал страну»."
  19: "ἆραι τὸν Ιωαννην — «убить Иоанна»; χιλιάρχοις — 千人隊長; δόματα — «дары»."
  21: "προδραμών τις — «некто, прибежав вперёд»; слав. добавляет «и слышав ужасеся зело» — в LXX эта клауза открывает 22."
  22: "ἐξέστη σφόδρα — «изумился (ужаснулся) весьма»; ἐπέγνω — «узнал»."
  23: "ἀνδραγαθίαι — «мужественные подвиги»; οἰκοδομὴ τῶν τειχῶν — «строение стен»."
  24: "βιβλίον ἡμερῶν ἀρχιερωσύνης αὐτοῦ — «книга дней первосвященства его» — заключительная формула книги (ср. 9:22)."
