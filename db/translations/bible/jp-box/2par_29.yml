verses:
  1: "ヒゼキヤは二十五歳[にじゅうごさい]で王[おう]となり、エルサレムで二十九年[にじゅうきゅうねん]治[おさ]めた。母[はは]の名[な]はアビヤといい、ザカリヤの娘[むすめ]であった。"
  2: "彼[かれ]は、父[ちち]ダビデが行[おこな]ったすべてのとおりに、主[しゅ]の目[め]に正[ただ]しいことを行[おこな]った。"
  3: "彼[かれ]は王[おう]となると、第一[だいいち]の月[つき]に主[しゅ]の家[いえ]の扉[とびら]を開[ひら]き、これを修理[しゅうり]した。"
  4: "彼[かれ]は祭司[さいし]たちとレビ人[びと]を連[つ]れて来[き]て、東側[ひがしがわ]の場所[ばしょ]に立[た]たせた。"
  5: "「レビ人[びと]よ、わたしの声[こえ]を聞[き]きなさい。今[いま]、あなたがたは身[み]を清[きよ]め、あなたがたの父祖[ふそ]の神[かみ]である主[しゅ]の家[いえ]を清[きよ]め、聖所[せいしょ]から汚[けが]れを投[な]げ出[だ]しなさい。"
  6: "父[ちち]たちは主[しゅ]から離[はな]れ、私たちの神[かみ]である主[しゅ]の目[め]の前[まえ]に悪[あく]を行[おこな]い、主[しゅ]を捨[す]て去[さ]り、主[しゅ]の幕屋[まくや]から顔[かお]を背[そむ]け、うなじを向[む]けたからである。"
  7: "また、神殿[しんでん]の扉[とびら]を閉[と]ざし、ともしびを消[け]し、香[こう]をたかず、聖所[せいしょ]でイスラエルの神[かみ]に燔祭[はんさい]をささげなかったからである。"
  8: "それゆえ、主[しゅ]の怒[いか]りがユダとエルサレムに下[くだ]り、主[しゅ]は彼[かれ]らを恐[おそ]れと荒廃[こうはい]と嘲[あざけ]りの的[まと]とされた。それはあなたがたが自分[じぶん]の目[め]で見[み]ているとおりである。"
  9: "見[み]よ、私たちの父[ちち]たちは剣[つるぎ]に倒[たお]れ、私たちの息子[むすこ]や娘[むすめ]や妻[つま]たちは、自分[じぶん]たちのものでない地[ち]で捕[と]らわれの身[み]となっている。それは今日[きょう]も同[おな]じである。"
  10: "今[いま]、私[わたし]はイスラエルの神[かみ]である主[しゅ]と契約[けいやく]を結[むす]ぶことを心[こころ]に定[さだ]めている。そうすれば、主[しゅ]はその激[はげ]しい怒[いか]りを私たちから遠[とお]ざけてくださる。"
  11: "今[いま]、怠[なま]けてはならない。主[しゅ]があなたがたを選[えら]び、御前[みまえ]に立[た]って仕[つか]え、御前[みまえ]に仕[つか]える者[もの]、香[こう]をたく者[もの]とされたからである。」"
  12: "レビ人[びと]たちが立[た]ち上[あ]がった。カアトの子[こ]らからは、アマシヤの子[こ]マハトと、ザカリヤの子[こ]ヨエル。メラリの子[こ]らからは、アブディの子[こ]キシュと、イエハレレルの子[こ]アザルヤ。ゲルションの子[こ]らからは、ジンマの子[こ]ヨアダドと、ヨアハの子[こ]ヨアダムである。"
  13: "エリツァファンの子[こ]らからはサムリとイエイエル、アサフの子[こ]らからはザカリヤとマタニヤ。"
  14: "エマンの子[こ]らからはイエイエルとシメイ、エドトンの子[こ]らからはシマヤとウジエル。"
  15: "彼[かれ]らは兄弟[きょうだい]たちを集[あつ]め、身[み]を清[きよ]めてから、王[おう]の命[めい]と主[しゅ]の言葉[ことば]に従[したが]って主[しゅ]の家[いえ]を清[きよ]めるために行[おこな]った。"
  16: "祭司[さいし]たちは主[しゅ]の家[いえ]の内側[うちがわ]に入[はい]ってこれを清[きよ]め、家[いえ]の中[なか]で見[み]つかったすべての汚[けが]れを主[しゅ]の家[いえ]の庭[にわ]に運[はこ]び出[だ]した。レビ人[びと]たちはそれを引[ひ]き取[と]って、ケドロン川[がわ]の外[そと]へ運[はこ]び出[だ]した。"
  17: "彼[かれ]らは第一[だいいち]の月[つき]の一日[ついたち]に清[きよ]めを始[はじ]め、その月[つき]の八日[ようか]に主[しゅ]の神殿[しんでん]に入[はい]り、主[しゅ]の家[いえ]を八日間[ようかかん]清[きよ]めて、第一[だいいち]の月[つき]の十六日[じゅうろくにち]に終[お]えた。"
  18: "彼[かれ]らは内側[うちがわ]に入[はい]ってヒゼキヤ王[おう]のもとへ行[い]き、言[い]った。「私たちは主[しゅ]の家[いえ]にあるすべてのもの、すなわち燔祭[はんさい]の祭壇[さいだん]とそのすべての器[うつわ]、供[そな]えのパンの机[つくえ]とそのすべての器[うつわ]を清[きよ]めた。"
  19: "また、王[おう]アハズがその治世[ちせい]に、その背[そむ]きのうちに汚[けが]したすべての器[うつわ]も、私たちは整[ととの]えて清[きよ]めた。見[み]よ、それらは主[しゅ]の祭壇[さいだん]の前[まえ]にある。」"
  20: "ヒゼキヤ王[おう]は朝早[あさはや]く起[お]き、町[まち]の長[かしら]たちを集[あつ]めて、主[しゅ]の家[いえ]に上[のぼ]った。"
  21: "そして、七頭[ななとう]の雄牛[おうし]、七頭[ななとう]の雄羊[おひつじ]、七頭[ななとう]の子羊[こひつじ]、七頭[ななとう]の雄山羊[おやぎ]を、王国[おうこく]と聖所[せいしょ]とユダのために、罪[つみ]のためのいけにえとしてささげた。そしてアロンの子[こ]らである祭司[さいし]たちに、主[しゅ]の祭壇[さいだん]に上[のぼ]ってささげるよう命[めい]じた。"
  22: "彼[かれ]らは雄牛[おうし]を屠[ほふ]り、祭司[さいし]たちはその血[ち]を受[う]けて祭壇[さいだん]に注[そそ]ぎかけた。雄羊[おひつじ]を屠[ほふ]り、その血[ち]を祭壇[さいだん]に注[そそ]ぎかけた。子羊[こひつじ]を屠[ほふ]り、その血[ち]を祭壇[さいだん]に注[そそ]ぎかけた。"
  23: "そして、罪[つみ]のための雄山羊[おやぎ]を王[おう]と会衆[かいしゅう]の前[まえ]に連[つ]れて来[き]た。彼[かれ]らはそれらの上[うえ]に手[て]を置[お]いた。"
  24: "祭司[さいし]たちはそれらを屠[ほふ]り、その血[ち]をもって祭壇[さいだん]のために贖[あがな]いをなし、すべてのイスラエルのために贖[あがな]った。王[おう]が言[い]ったように、燔祭[はんさい]と罪[つみ]のためのいけにえは、すべてのイスラエルのためのものだからである。"
  25: "彼[かれ]はレビ人[びと]を主[しゅ]の家[いえ]に置[お]き、シンバルと竪琴[たてごと]と琴[こと]を用[もち]いさせた。これはダビデ王[おう]と、王[おう]に幻[まぼろし]を見[み]る者[もの]ガドと、預言者[よげんしゃ]ナタンによる命令[めいれい]のとおりであった。主[しゅ]の命令[めいれい]が預言者[よげんしゃ]たちの手[て]によって下[くだ]されたからである。"
  26: "レビ人[びと]たちはダビデの楽器[がっき]を、祭司[さいし]たちはラッパを手[て]にした。"
  27: "ヒゼキヤは祭壇[さいだん]の上[うえ]に燔祭[はんさい]をささげるよう命[めい]じた。燔祭[はんさい]をささげ始[はじ]めると、主[しゅ]への歌[うた]が始[はじ]まり、ラッパが鳴[な]り響[ひび]いて、イスラエルの王[おう]ダビデの楽器[がっき]に合[あ]わせた。"
  28: "全会衆[ぜんかいしゅう]はひれ伏[ふ]し、歌[うた]い手[て]たちは歌[うた]い、ラッパは鳴[な]り響[ひび]いて、燔祭[はんさい]が終[お]わるまで続[つづ]いた。"
  29: "ささげ終[お]えると、王[おう]と、そこにいたすべての者[もの]は身[み]をかがめ、主[しゅ]を礼拝[れいはい]した。"
  30: "ヒゼキヤ王[おう]と長[かしら]たちは、ダビデと預言者[よげんしゃ]アサフの言葉[ことば]を用[もち]いて主[しゅ]をほめたたえるようレビ人[びと]に命[めい]じた。彼[かれ]らは喜[よろこ]びのうちにほめたたえ、身[み]を伏[ふ]せて礼拝[れいはい]した。"
  31: "「今[いま]、あなたがたは主[しゅ]に手[て]を満[み]たした。近[ちか]づいて、主[しゅ]の家[いえ]に感謝[かんしゃ]のいけにえをささげなさい。」会衆[かいしゅう]は感謝[かんしゃ]のいけにえを主[しゅ]の家[いえ]にささげ、心[こころ]の進[すす]んでする者[もの]は皆[みな]、燔祭[はんさい]をささげた。"
  32: "会衆[かいしゅう]がささげた燔祭[はんさい]の数[かず]は、雄牛[おうし]七十頭[ななじゅうとう]、雄羊[おひつじ]百頭[ひゃくとう]、子羊[こひつじ]二百頭[にひゃくとう]であった。これらはすべて主[しゅ]への燔祭[はんさい]である。"
  33: "また、聖別[せいべつ]された雄牛[おうし]は六百頭[ろっぴゃくとう]、羊[ひつじ]は三千頭[さんぜんとう]であった。"
  34: "しかし、祭司[さいし]が少[すく]なくて燔祭[はんさい]の皮[かわ]をはぐことができなかったので、兄弟[きょうだい]であるレビ人[びと]たちが、仕事[しごと]が終[お]わり、祭司[さいし]たちが身[み]を清[きよ]めるまで彼[かれ]らを助[たす]けた。レビ人[びと]たちは祭司[さいし]たちよりも熱心[ねっしん]に身[み]を清[きよ]めていたからである。"
  35: "燔祭[はんさい]は多[おお]く、酬恩祭[しゅうおんさい]の脂肪[しぼう]と燔祭[はんさい]の注[そそ]ぎのぶどう酒[しゅ]も多[おお]かった。こうして主[しゅ]の家[いえ]の務[つと]めは整[ととの]えられた。"
  36: "ヒゼキヤとすべての民[たみ]は、神[かみ]が民[たみ]のために備[そな]えてくださったことを喜[よろこ]んだ。事[こと]が突然[とつぜん]に起[お]こったからである。"

notes:
  1: "ἐβασίλευσεν ὢν εἴκοσι καὶ πέντε ἐτῶν — воцарился, будучи двадцати пяти лет; εἴκοσι καὶ ἐννέα ἔτη — двадцать девять лет; ὄνομα τῇ μητρὶ αὐτοῦ Αββα θυγάτηρ Ζαχαρια — имя матери его Авва, дочь Захарии (гр. Αββα; слав. «авиа» — Авия, ср. 4 Цар 18:2; в тексте アビヤ по слав.)."
  2: "ἐποίησεν τὸ εὐθὲς ἐνώπιον κυρίου — делал правое пред Господом; κατὰ πάντα, ὅσα ἐποίησεν Δαυιδ ὁ πατὴρ αὐτοῦ — по всему, что сделал Давид, отец его. Ср. 4 Цар 18:3."
  3: "ἐγένετο ὡς ἔστη ἐπὶ τῆς βασιλείας αὐτοῦ — «было, когда он стал на царство своё»; ἐν τῷ πρώτῳ μηνί — в первый месяц; ἀνέῳξεν — открыл (ἀνοίγω); ἐπεσκεύασεν — исправил, обновил (ἐπισκευάζω; слав. «обнови»). Ru добавляет «в первый год царствования» — в гр. только «в первый месяц»."
  4: "εἰσήγαγεν — ввёл (εἰσάγω); κατέστησεν αὐτοὺς εἰς τὸ κλίτος τὸ πρὸς ἀνατολάς — поставил их на стороне, обращённой к востоку (κλίτος — бок, сторона; слав. «на стране яже к востоку»). Ru «на площади восточной» — площади в гр. нет."
  5: "ἁγνίσθητε καὶ ἁγνίσατε — освятитесь и освятите (ἁγνίζω: сначала себя, потом дом); ἐκβάλετε τὴν ἀκαθαρσίαν ἐκ τῶν ἁγίων — выбросьте нечистоту из святынь (τὰ ἅγια — святилище, 聖所)."
  6: "ἀπέστησαν — отступили (ἀφίστημι); ἐγκατέλιπαν — оставили (ἐγκαταλείπω); ἀπέστρεψαν τὸ πρόσωπον ἀπὸ τῆς σκηνῆς — отвратили лицо от скинии (幕屋); ἔδωκαν αὐχένα — «дали шею», т. е. повернулись спиной (αὐχήν — шея, затылок). Слав. добавляет «Богом нашим» при «пред Господем» — в гр. только κυρίου; внесено в текст (私たちの神)."
  7: "ἀπέκλεισαν τὰς θύρας τοῦ ναοῦ — заперли двери храма (ναός — 神殿); ἔσβεσαν τοὺς λύχνους — погасили светильники; θυμίαμα οὐκ ἐθυμίασαν — фимиама не воскурили; ὁλοκαυτώματα οὐ προσήνεγκαν — всесожжений не принесли; ἐν τῷ ἁγίῳ θεῷ Ισραηλ — «в святом Богу Израилеву» (дат. при «святом»)."
  8: "ὠργίσθη ὀργῇ — воспылал гневом (усилительный оборот); ἔδωκεν αὐτοὺς εἰς ἔκστασιν καὶ εἰς ἀφανισμὸν καὶ εἰς συρισμόν — отдал их в ужас, в истребление и в посвист (συρισμός — свист, знак изумления; слав. «на звиздание»; передано 嘲り); ὡς ὑμεῖς ὁρᾶτε τοῖς ὀφθαλμοῖς ὑμῶν — как вы видите очами вашими."
  9: "πεπλήγασιν — поражены (πλήσσω, перфект); μαχαίρᾳ — мечом; ἐν αἰχμαλωσίᾳ ἐν γῇ οὐκ αὐτῶν — в плену в земле не своей; ὃ καὶ νῦν ἐστιν — что и ныне есть (слав. «якоже и ныне суть» — мн. ч.)."
  10: "ἐπὶ τούτοις — «на этом»; ἐπὶ καρδίας — «на сердце» (в гр. ед. ч.: у меня на сердце); διαθέσθαι διαθήκην — заключить завет (διατίθεμαι); ἀποστρέψει τὴν ὀργὴν θυμοῦ αὐτοῦ — отвратит ярость гнева Своего. Слав. «положите на сердца ваша» — мн. ч."
  11: "μὴ διαλίπητε — не оставляйте, не будьте небрежны (διαλείπω); ἐν ὑμῖν ᾑρέτικεν κύριος — «в вас избрал Господь» (αἱρέω, перфект); στῆναι ἐναντίον αὐτοῦ λειτουργεῖν — стоять пред Ним, чтобы служить (λειτουργέω); εἶναι αὐτῷ λειτουργοῦντας καὶ θυμιῶντας — быть Ему служащими и кадящими. Ru добавляет «Дети мои!» — в гр. и слав. этого нет."
  12: "ἀνέστησαν οἱ Λευῖται — встали левиты; Μααθ ὁ τοῦ Αμασι — Мааф, сын Амасия (マハト); Ιωηλ ὁ τοῦ Αζαριου — Иоиль, сын Азарии (слав. «иоиль сын захариев» — в тексте ザカリヤ по слав.); ἐκ τῶν υἱῶν Κααθ — из сынов Каафа (カアト); Μεραρι — Мерари; Κις ὁ τοῦ Αβδι — Кис, сын Авдия; Αζαριας ὁ τοῦ Ιαλλεληλ — Азария, сын Иегаллела (イエハレレル); Γεδσωνι — Гирсон (ゲルション); Ιωα ὁ τοῦ Ζεμμαθ — Иоах, сын Зиммы (слав. «иоадад» — ヨアダド); Ιωδαν ὁ τοῦ Ιωαχα — Иодан, сын Иоаха (слав. «иоадам … сии сынове иоахаини» — в тексте ヨアダム)."
  13: "τῶν υἱῶν Ελισαφαν — из сынов Елисафана (エリツァファン); Σαμβρι — Замврий (слав. «самарий» — サムリ); Ιιηλ — Иеиил (イエイエル); τῶν υἱῶν Ασαφ — из сынов Асафа; Ζαχαριας καὶ Μαθθανιας — Захария и Матфания."
  14: "τῶν υἱῶν Αιμαν — из сынов Емана (エマン); Ιιηλ καὶ Σεμει — Иеиил и Семей (シメイ); τῶν υἱῶν Ιδιθων — из сынов Идифуна (в корпусе エドトン, ср. 1 Пар 25:1); Σαμαιας καὶ Οζιηλ — Самаия и Озиил (シマヤ, ウジエル; слав. «самафиа и озиил»)."
  15: "συνήγαγον τοὺς ἀδελφοὺς αὐτῶν — собрали братьев своих; ἡγνίσθησαν — освятились; κατὰ τὴν ἐντολὴν τοῦ βασιλέως διὰ προστάγματος κυρίου — по заповеди царя, через повеление Господне; καθαρίσαι τὸν οἶκον κυρίου — очистить дом Господень."
  16: "εἰσῆλθον … ἔσω — вошли внутрь; ἐξέβαλον πᾶσαν τὴν ἀκαθαρσίαν — выбросили всю нечистоту; εἰς τὴν αὐλὴν οἴκου κυρίου — во двор дома Господня (αὐλή — 庭); ἐδέξαντο οἱ Λευῖται ἐκβαλεῖν — «приняли левиты вынести» (δέχομαι — принять, взять на себя; слав. «вземше»); εἰς τὸν χειμάρρουν Κεδρων ἔξω — в поток Кедрон, вон (χειμάρρους — зимний поток, ケドロン川)."
  17: "νουμηνία τοῦ μηνὸς τοῦ πρώτου — новомесячие первого месяца (νουμηνία — новолуние, начало месяца); τῇ ἡμέρᾳ τῇ ὀγδόῃ — в восьмой день; εἰσῆλθαν εἰς τὸν ναόν — вошли в храм (ναός); ἐν ἡμέραις ὀκτὼ — в восемь дней; τῇ ἑκκαιδεκάτῃ — в шестнадцатый; συνετέλεσαν — завершили."
  18: "εἰσῆλθαν ἔσω πρὸς Εζεκιαν — вошли внутрь к Езекии; Ἡγνίσαμεν πάντα — «мы освятили всё»; θυσιαστήριον τῆς ὁλοκαυτώσεως — жертвенник всесожжения; σκεύη — сосуды, утварь (器); τράπεζα τῆς προθέσεως — стол предложения (供えのパン, ср. 1 Пар 9:32)."
  19: "ἐμίανεν — осквернил (μιαίνω); ἐν τῇ ἀποστασίᾳ αὐτοῦ — в отступничестве его (ἀποστασία); ἡτοιμάκαμεν καὶ ἡγνίκαμεν — приготовили и освятили (перфект); ἐναντίον τοῦ θυσιαστηρίου — пред жертвенником."
  20: "ὤρθρισεν — встал рано (ὀρθρίζω); συνήγαγεν τοὺς ἄρχοντας τῆς πόλεως — собрал начальников города (長たち); ἀνέβη εἰς οἶκον κυρίου — взошёл в дом Господень."
  21: "ἀνήνεγκεν — вознёс, принёс (ἀναφέρω); μόσχους ἑπτά, κριοὺς ἑπτά, ἀμνοὺς ἑπτά, χιμάρους αἰγῶν ἑπτά — семь тельцов, семь овнов, семь агнцев, семь козлов; περὶ ἁμαρτίας — за грех; περὶ τῆς βασιλείας καὶ περὶ τῶν ἁγίων καὶ περὶ Ισραηλ — за царство, за святилище и за Израиль (ru «за Иудею» — по МТ); ἀναβαίνειν ἐπὶ τὸ θυσιαστήριον — восходить на жертвенник. Слав. добавляет «жрети телцев» — не внесено."
  22: "ἔθυσαν — заклали (θύω); ἐδέξαντο τὸ αἷμα — приняли кровь; προσέχεον ἐπὶ τὸ θυσιαστήριον — возливали на жертвенник (προσχέω; третий раз περιέχεον — обливали кругом). Ru «окропили» — по МТ; в гр. и слав. возлияние."
  23: "προσήγαγον τοὺς χιμάρους τοὺς περὶ ἁμαρτίας — привели козлов за грех; ἐναντίον τοῦ βασιλέως καὶ τῆς ἐκκλησίας — пред царём и собранием (ἐκκλησία — 会衆); ἐπέθηκαν τὰς χεῖρας αὐτῶν ἐπ᾽ αὐτούς — возложили руки свои на них."
  24: "ἔθυσαν αὐτοὺς οἱ ἱερεῖς — заклали их священники; ἐξιλάσαντο τὸ αἷμα αὐτῶν πρὸς τὸ θυσιαστήριον — очистили кровью их жертвенник (ἐξιλάσκομαι — умилостивлять, искупать); περὶ παντὸς Ισραηλ — за весь Израиль; ἡ ὁλοκαύτωσις καὶ τὰ περὶ ἁμαρτίας — всесожжение и жертвы за грех. Слав. «покропиша» — окропили; в гр. возлияние."
  25: "ἔστησεν τοὺς Λευίτας — поставил левитов; κυμβάλοις, νάβλαις, κινύραις — кимвалы, псалтири, киниры (シンバル, 竪琴, 琴); κατὰ τὴν ἐντολὴν Δαυιδ — по заповеди Давида; Γαδ τοῦ ὁρῶντος τῷ βασιλεῖ — Гада, прозорливца царёва (ὁρῶν — видящий, 幻を見る者); Ναθαν τοῦ προφήτου — Нафана пророка; δι᾽ ἐντολῆς κυρίου τὸ πρόσταγμα ἐν χειρὶ τῶν προφητῶν — по заповеди Господней повеление через руку пророков."
  26: "ἐν ὀργάνοις Δαυιδ — с музыкальными орудиями Давида (ὄργανον); ταῖς σάλπιγξιν — трубами (σάλπιγξ, ラッパ)."
  27: "ἀνενέγκαι τὴν ὁλοκαύτωσιν — вознести всесожжение; ἐν τῷ ἄρξασθαι ἀναφέρειν — когда начали возносить; ἤρξαντο ᾄδειν κυρίῳ — начали петь Господу; αἱ σάλπιγγες πρὸς τὰ ὄργανα Δαυιδ — трубы при орудиях Давида (πρός — «вместе с», «под»)."
  28: "πᾶσα ἡ ἐκκλησία προσεκύνει — всё собрание поклонялось; ψαλτῳδοί — певцы (歌い手); ᾄδοντες — поющие; σαλπίζουσαι — трубящие; ἕως οὗ συνετελέσθη — доколе не завершилось."
  29: "ὡς συνετέλεσαν ἀναφέροντες — когда окончили приносить; ἔκαμψεν ὁ βασιλεύς — преклонился царь (κάμπτω); πάντες οἱ εὑρεθέντες — все, находившиеся там; προσεκύνησαν — поклонились."
  30: "εἶπεν Εζεκιας ὁ βασιλεὺς καὶ οἱ ἄρχοντες — сказал царь Езекия и начальники; ὑμνεῖν τὸν κύριον ἐν λόγοις Δαυιδ καὶ Ασαφ τοῦ προφήτου — восхвалять Господа словами Давида и Асафа пророка; ὕμνουν ἐν εὐφροσύνῃ — восхваляли в веселии; ἔπεσον — пали."
  31: "ἀπεκρίθη … καὶ εἶπεν — отвечал и сказал; ἐπληρώσατε τὰς χεῖρας ὑμῶν κυρίῳ — «наполнили руки ваши Господу», формула посвящения (слав. так же); προσαγάγετε — приступите; θυσίας καὶ αἰνέσεως — жертвы и хваления (αἴνεσις); πᾶς πρόθυμος τῇ καρδίᾳ — всякий усердный сердцем; ὁλοκαυτώσεις — всесожжения."
  32: "ὁ ἀριθμὸς τῆς ὁλοκαυτώσεως — число всесожжения; μόσχοι ἑβδομήκοντα, κριοὶ ἑκατόν, ἀμνοὶ διακόσιοι — тельцов 70, овнов 100, агнцев 200; εἰς ὁλοκαύτωσιν κυρίῳ πάντα ταῦτα — всё это во всесожжение Господу."
  33: "οἱ ἡγιασμένοι μόσχοι ἑξακόσιοι — освящённых тельцов 600; πρόβατα τρισχίλια — овец 3000. Речь об освящённых животных (слав. «освященных»)."
  34: "ἀλλ᾽ ἢ — «но только»; ὀλίγοι ἦσαν — были немногочисленны; δεῖραι — содрать кожу (δείρω); ἀντελάβοντο αὐτῶν — поддержали их (ἀντιλαμβάνομαι); ἕως οὗ συνετελέσθη τὸ ἔργον — доколе не завершилось дело; προθύμως ἡγνίσθησαν παρὰ τοὺς ἱερεῖς — ревностнее освятились, нежели священники (παρά + вин. — в сравнении)."
  35: "ἡ ὁλοκαύτωσις πολλὴ ἐν τοῖς στέασιν — всесожжение великое с туками (στέαρ — жир); τελείωσις τοῦ σωτηρίου — совершение мирной жертвы спасения (σωτήριον — 酬恩祭); σπονδαί — возлияния (σπονδή); κατωρθώθη τὸ ἔργον — устроено дело (κατορθόω)."
  36: "ηὐφράνθη — обрадовался (εὐφραίνω); διὰ τὸ ἡτοιμακέναι τὸν θεὸν τῷ λαῷ — потому что Бог приготовил народу (ἑτοιμάζω, перфект); ἐξάπινα ἐγένετο ὁ λόγος — внезапно было слово (λόγος — и «слово», и «дело»; слав. «внезапу бысть слово»)."
