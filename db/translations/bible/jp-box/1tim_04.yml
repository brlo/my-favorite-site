# jp-box, 1-е Послание к Тимофею, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: отступление в последние времена и лжеучители (1–5), добрый служитель
# и упражнение в благочестии (6–10), наставления Тимофею о чтении, даре и учении (11–16).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 4:1 τὸ πνεῦμα — 霊[れい], без кальки 聖霊: говорит Дух, а не Христос, поэтому не красное.
# 〔…〕 в главе нет. 4:5 — замена (в базе ἐντεύξεως, у Церкви προσευχῆς), 4:10 — замена
# (в базе ἀγωνιζόμεθα, церковный текст читает ὀνειδιζόμεθα); замены даны церковной формой
# без 〔〕, как принято в корпусе (ср. Рим 10:17, 1 Кор 15:3).
# Сносок ⟨…⟩ в главе нет: 手[て]を置[お]くこと уже встречалось в Деян 6:6; 8:17 без пояснения,
# а 敬虔, 賜物, 執事, 禁令 — слова корпуса. jp-ni не использовался.

tr_code: jp-box
book: 1tim
chapter: 4
draft: true

verses:
  1: "しかし、霊[れい]は明白[めいはく]に言[い]っている。後[のち]の時代[じだい]に、ある者[もの]たちが信仰[しんこう]から離[はな]れ、惑[まど]わす霊[れい]たちと悪霊[あくりょう]たちの教[おし]えとに心[こころ]を向[む]けるようになる、と。"
  2: "それは、偽[いつわ]りを語[かた]る者[もの]たちの偽善[ぎぜん]によるものであり、その者[もの]たちの良心[りょうしん]には焼[や]き印[いん]が押[お]されている。"
  3: "彼[かれ]らは、結婚[けっこん]を禁[きん]じ、食物[しょくもつ]を避[さ]けるという禁令[きんれい]を出[だ]している。食物[しょくもつ]は、神[かみ]が、信[しん]じて真理[しんり]を知[し]った者[もの]たちが感謝[かんしゃ]して受[う]けるために造[つく]られたものである。"
  4: "というのは、神[かみ]の造[つく]られたものはすべて良[よ]いものであり、感謝[かんしゃ]して受[う]けるなら、捨[す]てるべきものは何[なに]ひとつないからである。"
  5: "それは、神[かみ]の言葉[ことば]と祈[いの]りとによって聖[せい]とされるからである。"
  6: "これらのことを兄弟[きょうだい]たちに示[しめ]すなら、信仰[しんこう]の言葉[ことば]と、あなたが従[したが]ってきた良[よ]い教[おし]えとによって養[やしな]われつつ、あなたはキリスト・イエスの良[よ]い執事[しつじ]となる。"
  7: "俗悪[ぞくあく]な、老婆[ろうば]じみた作[つく]り話[ばなし]は避[さ]けなさい。むしろ、敬虔[けいけん]の訓練[くんれん]に自分[じぶん]を励[はげ]みなさい。"
  8: "肉体[にくたい]の訓練[くんれん]は少[すこ]しの間[あいだ]だけ役[やく]に立[た]つが、敬虔[けいけん]はすべてのことに役[やく]に立[た]ち、今[いま]の命[いのち]と来[きた]るべき命[いのち]の約束[やくそく]を持[も]っている。"
  9: "この言葉[ことば]は真実[しんじつ]である。また、まったく受[う]け入[い]れるに値[あた]いする。"
  10: "というのは、わたしたちはこのために労[ろう]し、謗[そし]りを受[う]けているからである。わたしたちは、生[い]ける神[かみ]に望[のぞ]みを置[お]いている。この方[かた]はすべての人[ひと]の救[すく]い主[ぬし]、特[とく]に信[しん]じる者[もの]たちの救[すく]い主[ぬし]である。"
  11: "これらのことを命[めい]じ、教[おし]えなさい。"
  12: "だれもあなたの若[わか]さを軽[かろ]んじてはならない。むしろ、言葉[ことば]において、行[おこな]いにおいて、愛[あい]において、信仰[しんこう]において、純潔[じゅんけつ]において、信[しん]じる者[もの]たちの模範[もはん]となりなさい。"
  13: "わたしが行[い]くまで、読[よ]み聞[き]かせと勧[すす]めと教[おし]えとに心[こころ]を配[くば]りなさい。"
  14: "あなたのうちにある賜物[たまもの]をおろそかにしてはならない。それは、預言[よげん]によって、長老団[ちょうろうだん]が手[て]を置[お]くこととともに、あなたに与[あた]えられたものである。"
  15: "これらのことを思[おも]い、それに打[う]ち込[こ]みなさい。あなたの進歩[しんぽ]がすべての人[ひと]に明[あき]らかになるためである。"
  16: "自分[じぶん]自身[じしん]と教[おし]えとに気[き]を配[くば]り、それらに留[とど]まりなさい。そうすることによって、あなたは自分[じぶん]自身[じしん]も、あなたに聞[き]く者[もの]たちも救[すく]うのである。"

notes:
  1: "Τὸ δὲ πνεῦμα ῥητῶς λέγει — しかし、霊は明白に言っている. πνεῦμα без ἅγιον — 霊[れい], не 聖霊; говорит Дух, а не Христос, поэтому не красное. ῥητῶς — «прямо, открыто»; 明白に. ἐν ὑστέροις καιροῖς — 後の時代に (ср. 2 Тим 3:1). ἀποστήσονταί τινες τῆς πίστεως — 信仰から離れ (ἀφίστημι — «отступать»). προσέχοντες — 心を向ける. πνεύμασιν πλάνοις — 惑わす霊たち (πλάνος — «вводящий в заблуждение»). διδασκαλίαις δαιμονίων — 悪霊たちの教え."
  2: "ἐν ὑποκρίσει ψευδολόγων — 偽りを語る者たちの偽善 (род. субъекта: лицемерие самих лжецов). κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν — 良心に焼き印を押され (perfect от καυστηριάζω — «выжигать клеймо»); образ сохранён, не сглажен в «нечувствительную совесть»."
  3: "κωλυόντων γαμεῖν — 結婚を禁じる; κώλυσις и есть 禁令. ἀπέχεσθαι βρωμάτων — 食物を避ける. ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν — 神が…受けるために造られた (μετάλημψις — «принятие в пищу»). μετὰ εὐχαριστίας — 感謝して. τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν — 信じて真理を知った者たち (два причастия сохранены)."
  4: "πᾶν κτίσμα θεοῦ καλόν — 神の造られたものはすべて良い. ἀπόβλητον — «отвергаемое»; 捨てるべきもの. μετὰ εὐχαριστίας λαμβανόμενον — 感謝して受けるなら: причастие передано условием, как в jp-joc「感謝して之を受くべし»."
  5: "ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως — 神の言葉と祈りとによって聖とされる. В базе ἐντεύξεως («прошение, молитва»); церковный текст (Елизаветинская «молитвою», jp-joc「祈祷」) читает προσευχῆς. Это замена, а не добавка, поэтому 〔〕 не ставятся; по-японски оба слова передаются как 祈り (проверено по базе: ἐντεύξεως — есть, προσευχή — нет)."
  6: "Ταῦτα ὑποτιθέμενος — これらのことを示す (ὑποτίθημι — «предлагать, ставить перед»); причастие передано условием, как у jp-joc「勸めば」. καλὸς ἔσῃ διάκονος — 良い執事 (διάκονος здесь в широком смысле, ср. 3:8–13; термин 執事[しつじ] выровнен по Флп 1:1). ἐντρεφόμενος — «питаемый, вскармливаемый»; 養われつつ. τοῖς λόγοις τῆς πίστεως — 信仰の言葉. ᾗ παρηκολούθηκας — あなたが従ってきた (παρακολουθέω — «следовать за»)."
  7: "βεβήλους καὶ γραώδεις μύθους — 俗悪な、老婆じみた作り話 (γραώδης — «бабий»; μῦθος — «сказание»). παραιτοῦ — 避けなさい. γύμναζε σεαυτὸν πρὸς εὐσέβειαν — 敬虔の訓練に自分を励みなさい (γυμνάζω — «упражнять», ср. ст. 8 γυμνασία); 敬虔[けいけん]、訓練[くんれん] — термины корпуса."
  8: "σωματικὴ γυμνασία — 肉体の訓練. πρὸς ὀλίγον — 少しの間だけ. πρὸς πάντα — すべてのことに. ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης — 今の命と来るべき命の約束 (два члена сохранены)."
  9: "πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος — この言葉は真実である.また、まったく受け入れるに値する; формула, ср. 1:15; 3:1; 2 Тим 2:11. ἀποδοχή — «принятие»."
  10: "εἰς τοῦτο γὰρ κοπιῶμεν — このために労し. В базе ἀγωνιζόμεθα («подвизаемся»); церковный текст (Елизаветинская «поношаеми есмы», Синодальный «поношения терпим», jp-joc「謗を受く」) читает ὀνειδιζόμεθα — 謗りを受けている. Это замена, а не добавка, поэтому 〔〕 не ставятся (проверено по базе: ἀγωνιζόμεθα — есть, ὀνειδιζόμεθα — нет). ἠλπίκαμεν ἐπὶ θεῷ ζῶντι — 生ける神に望みを置いている. σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν — すべての人の救い主、特に信じる者たちの; σωτήρ — 救[すく]い主[ぬし]."
  11: "Παράγγελλε ταῦτα καὶ δίδασκε — 命じ、教えなさい: два глагола не сведены в один."
  12: "μηδείς σου τῆς νεότητος καταφρονείτω — だれもあなたの若さを軽んじてはならない. τύπος γίνου τῶν πιστῶν — 信じる者たちの模範となりなさい. Пять членов сохранены: 言葉、行い、愛、信仰、純潔 (ἐν ἁγνείᾳ — не только «чистота тела»); порядок греческий."
  13: "ἕως ἔρχομαι — わたしが行くまで. πρόσεχε — 心を配りなさい (с дательным). ἀνάγνωσις — публичное чтение Писания; 読み聞かせ. παράκλησις — 勧め. διδασκαλία — 教え. Три члена сохранены."
  14: "μὴ ἀμέλει — 疎かにしてはならない. χάρισμα — 賜物. διὰ προφητείας — 預言によって (ср. 1:18). μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου — 長老団が手を置くこととともに; πρεσβυτέριον — собрание пресвитеров, 長老団. ἐπίθεσις χειρῶν передано глаголом 手[て]を置[お]く, как во всём корпусе (Деян 6:6; 8:17; 2 Тим 1:6), без редкого 按手 (ср. Деян 6:6; 8:17)."
  15: "ταῦτα μελέτα — これらのことを思い (μελετάω — «размышлять, упражняться»). ἐν τούτοις ἴσθι — それに打ち込みなさい (букв. «пребывай в этом»). ἵνα σου ἡ προκοπὴ φανερὰ ᾖ πᾶσιν — あなたの進歩がすべての人に明らかになるため; προκοπή — 進歩, не «успех» в мирском смысле."
  16: "ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ — 自分自身と教えとに気を配り. ἐπίμενε αὐτοῖς — それらに留まりなさい (ἐπιμένω — «пребывать»). τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου — そうすることによって…自分自身も、聞く者たちも救う; будущее σώσεις передано настоящим с оттенком результата, «себя» не сглажено."
