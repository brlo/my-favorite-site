# jp-box, Аввакум, глава 2. Черновик для приёмки.
#
# Нумерация — по славяно-синодальной: наш 2:1–20 = gr 2:1–20 и csl 2:1–20, стих в стих.
# В книге 56 стихов (1: 17, 2: 20, 3: 19).
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 пророк на страже; 2–3 повеление записать видение, «если замедлит —
# жди»; 4 **ключевое место**: «праведный верою жив будет»; 5 надменный ненасытен;
# 6–11 первое горе: обогащение не своим, разграбление, «камни из стен возопиют»;
# 12–14 второе горе: город на крови, «земля наполнится познанием славы»;
# 15–17 третье горе: чаша десницы Господней, Ливан; 18–20 идолы немы,
# «Господь во святом храме Своём».
# Голоса: 1 — речь пророка; 2–20 — ответ Господа в 「…» (в 2 вводка «ответил мне
# Господь и сказал» вне кавычек); в 6 «они скажут» — притча-насмешка народов
# в 『…』 до конца 19; 20 — заключение Господа, кавычки закрываются.
# 2:4: ἐκ πίστεώς μου — «от веры Моей»; в Рим 1:17, Гал 3:11, Евр 10:38 цитата без
# «Моей»; возможно понимание «верою в Меня» и «Моей верностью» — не сглажено,
# греческое чтение сохранено в тексте.
# 2:5: κατοινωμένος — «опьяневший/наглый», слав. «презорливый» (в тексте по слав.
# три определения: 侮る者、虐げる者、誇り高い男).
# 2:20: εὐλαβείσθω — «да благоговеет (убоится)»; в ru/МТ «да молчит» — не внесено.
#
