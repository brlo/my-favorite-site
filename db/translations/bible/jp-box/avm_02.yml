verses:
  1: "わたしは自分[じぶん]の見張[みは]り所[じょ]に立[た]ち、岩[いわ]の上[うえ]に立[た]って見張[みは]り、わたしのうちに何[なに]が語[かた]られるか、わたしの訴[うった]えに何[なに]と答[こた]えられるかを見[み]ようとした。"
  2: "主[しゅ]はわたしに答[こた]えて言[い]われた。「幻[まぼろし]を書[か]き、板[いた]の上[うえ]に明[あき]らかに記[しる]せ。読[よ]む者[もの]が走[はし]りながらでも読[よ]み取[と]れるように。"
  3: "幻[まぼろし]はなお定[さだ]められた時[とき]のためであり、終[お]わりに向[む]かって進[すす]み、むなしくはならない。たとえ遅[おく]れても、それを待[ま]て。それは必[かなら]ず来[き]て、遅[おく]れることはないからである。"
  4: "もし彼が退[しりぞ]けば、わたしの魂[たましい]は彼のうちに喜[よろこ]びを見[み]いださない。しかし、正[ただ]しい者[もの]はわたしの信仰[しんこう]によって生[い]きる。"
  5: "侮[あなど]る者[もの]、虐[しいた]げる者[もの]、誇[ほこ]り高[ぶ]い男[おとこ]は、何[なに]も成[な]し遂[と]げない。彼は陰府[よみ]のようにその魂[たましい]を広[ひろ]げ、死[し]のように飽[あ]き足[た]りない。彼はすべての国[くに]々[ぐに]を自分[じぶん]に集[あつ]め、すべての民[たみ]を自分[じぶん]に迎[むか]え入[い]れる。"
  6: "これらのすべての者[もの]は、彼についてのたとえ話[ばなし]と、彼のことを語[かた]る謎[なぞ]とを受[う]け取[と]らないのか。彼らは言[い]う。『わざわいだ、自分[じぶん]のものでない物[もの]を増[ふ]やす者[もの]よ。いつまでそうしているのか。重[おも]い軛[くびき]を自分[じぶん]に負[お]わせる者[もの]よ。"
  7: "あなたをかむ者[もの]たちが突然[とつぜん]に起[お]こり、あなたを狙[ねら]う者[もの]たちが目[め]を覚[さ]まし、あなたは彼らの餌食[えじき]となるのではないか。"
  8: "あなたは多[おお]くの国[くに]々[ぐに]を奪[うば]ったので、残[のこ]ったすべてもろもろの民[たみ]があなたを奪[うば]う。人[ひと]の血[ち]のため、地[ち]の不法[ふほう]のため、都[みやこ]とそこに住[す]むすべての者[もの]のためである。"
  9: "わざわいだ、自分[じぶん]の家[いえ]のために悪[わる]い欲[よく]をむさぼり、自分[じぶん]の巣[す]を高[たか]い所[ところ]に置[お]いて、災[わざわ]いの手[て]から逃[のが]れようとする者[もの]よ。"
  10: "あなたは自分[じぶん]の家[いえ]に恥[は]ずかしめを企[くわだ]て、多[おお]くの民[たみ]を断[た]ち、自分[じぶん]の魂[たましい]を罪[つみ]に陥[おとしい]れた。"
  11: "石[いし]は壁[かべ]から叫[さけ]び、木[き]くい虫[むし]は木[き]からこれに答[こた]えて語[かた]る。"
  12: "わざわいだ、血[ち]によって都[みやこ]を築[きず]き、不法[ふほう]によって町[まち]を備[そな]える者[もの]よ。"
  13: "これは万軍[ばんぐん]の主[しゅ]から出[で]たことではないのか。民[たみ]々[みんみん]は火[ひ]のために労[ろう]し、国[くに]々[ぐに]はむなしく疲[つか]れる。"
  14: "地[ち]は主[しゅ]の栄光[えいこう]を知[し]ることで満[み]ち、水[みず]が海[うみ]を覆[おお]うように満[み]ちる。"
  15: "わざわいだ、自分[じぶん]の隣人[りんじん]に濁[にご]った混乱[こんらん]の飲[の]み物[もの]を飲[の]ませ、酔[よ]わせて、その裸[はだか]を見[み]ようとする者[もの]よ。"
  16: "あなたは栄光[えいこう]の代[か]わりに恥[は]ずかしめで満[み]ちる。あなたも飲[の]んで、心[こころ]よ、揺[ゆ]れ動[うご]け。主[しゅ]の右[みぎ]の手[て]の杯[さかずき]があなたを囲[かこ]み、恥[は]ずかしめがあなたの栄光[えいこう]の上[うえ]に集[あつ]まる。"
  17: "レバノンへの不法[ふほう]があなたを覆[おお]い、獣[けもの]たちの苦[くる]しみがあなたを脅[おど]かす。人[ひと]の血[ち]のため、地[ち]の不法[ふほう]のため、都[みやこ]とそこに住[す]むすべての者[もの]のためである。"
  18: "刻[きざ]んだ像[ぞう]は何[なに]の役[やく]に立[た]つのか。それを刻[きざ]んだ者[もの]が刻[きざ]んだのである。鋳[い]た像[ぞう]と偽[いつわ]りの幻[まぼろし]は何[なに]の役に立つのか。造[つく]った者[もの]が自分の造[つく]った物[もの]に頼[たよ]り、口[くち]のきけない偶像[ぐうぞう]を造[つく]ったのである。"
  19: "わざわいだ、木[き]に向[む]かって目[め]を覚[さ]ませ、起[お]きよと言[い]い、石[いし]に向[む]かって立[た]ち上[あ]がれと言[い]う者[もの]よ。それは幻[まぼろし]であり、金[きん]と銀[ぎん]を打[う]ち延[の]ばしたもので、その中[なか]には少[すこ]しの息[いき]もない。』"
  20: "しかし、主[しゅ]はその聖[せい]なる宮[みや]におられる。全[ぜん]地[ち]は主[しゅ]の前[まえ]で恐[おそ]れよ」。"

notes:
  1: "Ἐπὶ τῆς φυλακῆς μου στήσομαι — «на страже моей стану» (φυλακή — стража, 見張り所); ἐπιβήσομαι ἐπὶ πέτραν — «взойду на камень (скалу)» (слав. «на камень»; в ru «на башню» — по МТ); ἀποσκοπεύσω τοῦ ἰδεῖν — «буду смотреть, чтобы увидеть» (ἀποσκοπεύω — наблюдать, 見張る); τί λαλήσει ἐν ἐμοί — «что скажет во мне»; τί ἀποκριθῶ ἐπὶ τὸν ἔλεγχόν μου — «что отвечу на обличение моё» (ἔλεγχος — обличение, 訴え)."
  2: "ἀπεκρίθη πρός με κύριος καὶ εἶπεν — «ответил мне Господь и сказал» (вводка вне кавычек); Γράψον ὅρασιν — «напиши видение»; σαφῶς ἐπὶ πυξίον — «ясно на дощечке» (πυξίον — дощечка, 板); ὅπως διώκῃ ὁ ἀναγινώσκων αὐτά — «чтобы постигал (догнал) читающий» (διώκω — гнать, 走りながら読む): т.е. чтобы можно было прочесть на бегу."
  3: "ἔτι ὅρασις εἰς καιρόν — «ещё видение к сроку»; ἀνατελεῖ εἰς πέρας — «взойдёт к концу» (ἀνατέλλω — восходить, 進む); οὐκ εἰς κενόν — «не в пустое»; ἐὰν ὑστερήσῃ, ὑπόμεινον αὐτόν — «если замедлит, подожди его» (ὑστερέω — опаздывать, 遅れる; ὑπομένω — ждать, 待つ); ἐρχόμενος ἥξει καὶ οὐ μὴ χρονίσῃ — «приходя придёт и не замедлит» (χρονίζω — медлить, 遅れる)."
  4: "**Ключевое место.** ἐὰν ὑποστείληται — «если он уклонится (устрашится)» (ὑποστέλλω — уклоняться, 退く; слав. «усумнится»); οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ — «не благоволит душа Моя в нём»; ὁ δὲ δίκαιος ἐκ πίστεώς μου ζήσεται — «праведный же от веры Моей жив будет». Цитируется в Рим 1:17, Гал 3:11, Евр 10:38 — там без «Моей». «Моей» допускает понимание «верою в Меня» и «Моей верностью (верой)»; многозначность не сглажена. В ru/МТ «душа надменная не успокоится» — иное чтение, не внесено."
  5: "κατοινωμένος — «опьяневший/наглый» (κατοινόομαι — быть пьяным; слав. «презорливый», в тексте по слав.); καταφρονητής — «презритель» (侮る者); ἀλάζων — «хвастливый» (誇り高い); οὐδὲν μὴ περάνῃ — «ничего не совершит» (περαίνω — доводить до конца, 成し遂げる); ἐπλάτυνεν ὡς ὁ ᾅδης τὴν ψυχὴν αὐτοῦ — «расширил как ад душу свою» (ᾅδης — 陰府); ὡς θάνατος οὐκ ἐμπιπλάμενος — «как смерть не насыщается» (ἐμπίπλημι — наполнять, 飽き足りる); ἐπισυνάξει πάντα τὰ ἔθνη — «соберёт все народы»; εἰσδέξεται πάντας τοὺς λαούς — «примет всех людей»."
  6: "παραβολὴν κατ᾿ αὐτοῦ λήμψονται — «притчу о нём примут» (παραβολή — притча, たとえ話); πρόβλημα εἰς διήγησιν αὐτοῦ — «загадку в повествование его» (πρόβλημα — загадка, 謎); Οὐαὶ ὁ πληθύνων ἑαυτῷ τὰ οὐκ ὄντα αὐτοῦ — «горе умножающему себе не своё»; ἕως τίνος — «доколе»; βαρύνων τὸν κλοιὸν αὐτοῦ στιβαρῶς — «отягчающему ошейник (ярмо) свой тяжело» (κλοιός — ошейник, 軛). С этих слов народы говорят 『…』."
  7: "ἐξαίφνης ἀναστήσονται δάκνοντες αὐτόν — «внезапно восстанут кусающие его» (δάκνω — кусать, かむ); ἐκνήψουσιν οἱ ἐπίβουλοί σου — «воспрянут (отрезвеют) замышляющие против тебя» (ἐκνήφω — пробуждаться, 目を覚ます; ἐπίβουλος — коварный, 狙う者); ἔσῃ εἰς διαρπαγὴν αὐτοῖς — «будешь на расхищение им» (διαρπαγή — расхищение, 餌食)."
  8: "ἐσκύλευσας ἔθνη πολλά — «ограбил народы многие» (σκυλεύω — грабить, 奪う); σκυλεύσουσίν σε πάντες οἱ ὑπολελειμμένοι λαοί — «ограбят тебя все оставшиеся народы»; δι᾿ αἵματα ἀνθρώπων — «за кровь людей»; ἀσεβείας γῆς καὶ πόλεως — «за нечестие земли и города»."
  9: "ὁ πλεονεκτῶν πλεονεξίαν κακὴν τῷ οἴκῳ αὐτοῦ — «жаждущий злого приобретения дому своему» (πλεονεξία — корысть, 欲); τοῦ τάξαι εἰς ὕψος νοσσιὰν αὐτοῦ — «чтобы поставить высоко гнездо своё» (νοσσιά — гнездо, 巣); τοῦ ἐκσπασθῆναι ἐκ χειρὸς κακῶν — «чтобы избавиться от руки злых» (ἐκσπάω — вырывать, 逃れる)."
  10: "ἐβουλεύσω αἰσχύνην τῷ οἴκῳ σου — «замыслил позор дому твоему» (αἰσχύνη — позор, 恥ずかしめ); συνεπέρανας λαοὺς πολλούς — «погубил народы многие» (συμπεραίνω — завершать, 断つ); ἐξήμαρτεν ἡ ψυχή σου — «согрешила душа твоя»."
  11: "λίθος ἐκ τοίχου βοήσεται — «камень из стены возопиет» (τοῖχος — стена, 壁); κάνθαρος ἐκ ξύλου φθέγξεται αὐτά — «жук из дерева возгласит это» (κάνθαρος — жук, 木くい虫; слав. «хрущь»)."
  12: "ὁ οἰκοδομῶν πόλιν ἐν αἵμασιν — «строящий город на кровях» (οἰκοδομέω — строить, 築く); ἑτοιμάζων πόλιν ἐν ἀδικίαις — «готовящий город в неправдах» (ἀδικία — неправда, 不法)."
  13: "οὐ ταῦτά ἐστιν παρὰ κυρίου παντοκράτορος — «не от Господа ли Вседержителя это» (παντοκράτωρ — 万軍の主); ἐξέλιπον λαοὶ ἱκανοὶ ἐν πυρί — «изнемогли народы многие в огне» (ἐκλείπω — исчезать, 労する); ἔθνη πολλὰ ὠλιγοψύχησαν — «народы многие умалились духом» (ὀλιγοψυχέω — изнемогать, 疲れる)."
  14: "πλησθήσεται ἡ γῆ τοῦ γνῶναι τὴν δόξαν κυρίου — «наполнится земля познанием славы Господней»; ὡς ὕδωρ κατακαλύψει αὐτούς — «как вода покроет их» (κατακαλύπτω — покрывать, 覆う)."
  15: "ὁ ποτίζων τὸν πλησίον αὐτοῦ ἀνατροπῇ θολερᾷ — «поящий ближнего своего превращением мутным» (ἀνατροπή — переворот/погибель, 混乱; θολερός — мутный, 濁った); μεθύσκων — «напаивающий допьяна» (μεθύσκω — поить, 酔わせる); ὅπως ἐπιβλέπῃ ἐπὶ τὰ σπήλαια αὐτῶν — «чтобы смотреть на пещеры (наготу) их» (σπήλαιον — пещера, 裸)."
  16: "πλησμονὴν ἀτιμίας ἐκ δόξης πίε καὶ σύ — «пресыщение бесчестия вместо славы пей и ты» (πλησμονή — пресыщение, 満ちる); διασαλεύθητι καὶ σείσθητι — «поколеблись и потрясись» (слав. вставляет «сердце»: «сердце, поколеблися и сотряснися» — внесено, 心よ); ἐκύκλωσεν ἐπὶ σὲ ποτήριον δεξιᾶς κυρίου — «обошла вокруг тебя чаша десницы Господней» (ποτήριον — чаша, 杯); συνήχθη ἀτιμία ἐπὶ τὴν δόξαν σου — «собралось бесчестие на славу твою»."
  17: "ἀσέβεια τοῦ Λιβάνου καλύψει σε — «нечестие Ливана покроет тебя»; ταλαιπωρία θηρίων πτοήσει σε — «страдание зверей устрашит тебя» (πτοέω — пугать, 脅かす); δι᾿ αἵματα ἀνθρώπων — «за кровь людей»."
  18: "τί ὠφελεῖ γλυπτόν, ὅτι ἔγλυψαν αὐτό — «что пользы в изваянии, что вырезали его» (ὠφελέω — помогать, 役に立つ); ἔπλασαν αὐτὸ χώνευμα, φαντασίαν ψευδῆ — «слепили его литьём, видение ложное» (χώνευμα — литьё, 鋳物; φαντασία — призрак, 幻); πέποιθεν ὁ πλάσας ἐπὶ τὸ πλάσμα αὐτοῦ — «положился создавший на создание своё»; ποιῆσαι εἴδωλα κωφά — «сделать идолов немых» (κωφός — немой, 口のきけない)."
  19: "ὁ λέγων τῷ ξύλῳ Ἔκνηψον ἐξεγέρθητι — «говорящий дереву: воспряни, пробудись» (ἐκνήφω — пробуждаться, 目を覚ます); τῷ λίθῳ Ὑψώθητι — «камню: возвысься»; φαντασία — «призрак» (幻); ἔλασμα χρυσίου καὶ ἀργυρίου — «кованое золото и серебро» (ἔλασμα — ковань, 打ち延ばしたもの); πᾶν πνεῦμα οὐκ ἔστιν ἐν αὐτῷ — «всякого духа (дыхания) нет в нём» (πνεῦμα — дыхание, 息)."
  20: "ὁ κύριος ἐν ναῷ ἁγίῳ αὐτοῦ — «Господь во святом храме Своём»; εὐλαβείσθω ἀπὸ προσώπου αὐτοῦ πᾶσα ἡ γῆ — «да благоговеет пред лицом Его вся земля» (εὐλαβέομαι — благоговеть, 恐れる). В ru/МТ «да молчит вся земля» — иное чтение, в текст не внесено. Здесь слово Господа закрывается."
