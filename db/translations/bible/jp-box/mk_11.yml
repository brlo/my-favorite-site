# jp-box, Евангелие от Марка, глава 11. Переписано заново с греческого.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# 11:26 в критическом издании отсутствует — весь стих в 〔…〕.
# jp-ni не использовался.

tr_code: jp-box
book: mk
chapter: 11
draft: true

verses:
  1: "一行[いっこう]がエルサレムに近[ちか]づき、ベツファゲとベタニアにさしかかったときのこと。オリーブ山[やま]のふもとで、イエスは弟子[でし]を二人[ふたり]遣[つか]わされた。"
  2: "言[い]われた。「<j>向[む]こうの村[むら]へ行[い]きなさい。村[むら]に入[はい]るとすぐ、まだ誰[だれ]も乗[の]ったことのない子[こ]ろばが、つないであるのが見[み]つかる。それを解[と]いて、ここへ連[つ]れて来[き]なさい。</j>"
  3: "<j>もし誰[だれ]かが『なぜ、そんなことをするのか』と言[い]ったら、『主[しゅ]がお入[い]り用[よう]です。すぐにここへ返[かえ]します』と言[い]いなさい。</j>」"
  4: "二人[ふたり]は行[い]って、戸口[とぐち]の外[そと]、通[とお]りに面[めん]した所[ところ]につないである子[こ]ろばを見[み]つけ、解[と]いた。"
  5: "そこに立[た]っていた人[ひと]たちが、「子[こ]ろばを解[と]いて、どうするのか」と言[い]った。"
  6: "二人[ふたり]はイエスの言[い]われたとおりに答[こた]えたので、人[ひと]たちは許[ゆる]してくれた。"
  7: "二人[ふたり]は子[こ]ろばをイエスのもとへ引[ひ]いて来[き]て、自分[じぶん]たちの上着[うわぎ]をその上[うえ]にかけた。イエスはそれに乗[の]られた。"
  8: "多[おお]くの人[ひと]が自分[じぶん]の上着[うわぎ]を道[みち]に敷[し]き、ほかの者[もの]たちは野[の]から切[き]って来[き]た枝[えだ]を敷[し]いた。"
  9: "前[まえ]を行[ゆ]く者[もの]も後[あと]に従[したが]う者[もの]も、こう叫[さけ]んだ。「ホサナ⟨「救[すく]ってください」の意[い]。⟩。主[しゅ]の名[な]によって来[こ]られる方[かた]は、ほめたたえられる。」"
  10: "「ほめたたえられる。来[きた]るべき、わたしたちの父[ちち]ダビデの国[くに]は。いと高[たか]き所[ところ]にホサナ。」"
  11: "イエスはエルサレムに入[はい]り、神殿[しんでん]へ行[い]かれた。あたりを一通り[ひととおり]見[み]て回[まわ]られたが、すでに夕方[ゆうがた]になっていたので、十二人[じゅうににん]とともにベタニアへ出[で]て行[い]かれた。"
  12: "翌日[よくじつ]、ベタニアを出[で]たとき、イエスは空腹[くうふく]を覚[おぼ]えられた。"
  13: "遠[とお]くに葉[は]の茂[しげ]ったいちじくの木[き]を見[み]つけて、何[なに]か実[み]がなっているかと近[ちか]づかれた。ところが、その木[き]には葉[は]のほか何[なに]もなかった。いちじくの季節[きせつ]ではなかったからである。"
  14: "イエスはその木[き]に向[む]かって言[い]われた。「<j>これから先[さき]、いつまでも、誰[だれ]もおまえの実[み]を食[た]べることがないように。</j>」弟子[でし]たちはこれを聞[き]いていた。"
  15: "一行[いっこう]はエルサレムに着[つ]いた。イエスは神殿[しんでん]に入[はい]り、境内[けいだい]で売[う]り買[か]いする者[もの]たちを追[お]い出[だ]し始[はじ]め、両替人[りょうがえにん]の台[だい]と鳩[はと]を売[う]る者[もの]の腰掛[こしか]けを引[ひ]っくり返[かえ]された。"
  16: "また、神殿[しんでん]の中[なか]を物[もの]を運[はこ]んで通[とお]ることを、誰[だれ]にもお許[ゆる]しにならなかった。"
  17: "イエスは教[おし]えて言[い]われた。「<j>『わたしの家[いえ]は、すべての民[たみ]のための祈[いの]りの家[いえ]と呼ばれる』と書[か]いてあるではないか。ところが、あなたがたはそれを盗賊[とうぞく]の巣[す]にしてしまった。</j>」"
  18: "祭司長[さいしちょう]たちと律法学者[りっぽうがくしゃ]たちはこれを聞[き]いて、どうにかしてイエスを殺[ころ]そうとねらっていた。イエスを恐[おそ]れたのである。群衆[ぐんしゅう]が皆[みな]、その教[おし]えに打[う]たれていたからだ。"
  19: "夕方[ゆうがた]になると、一行[いっこう]は町[まち]の外[そと]へ出[で]た。"
  20: "翌朝[よくあさ]、そこを通[とお]りかかると、いちじくの木[き]が根[ね]もとから枯[か]れていた。"
  21: "ペトロは思[おも]い出[だ]して言[い]った。「ラビ、ご覧[らん]ください。あなたが呪[のろ]われたあのいちじくの木[き]が、枯[か]れてしまいました。」"
  22: "イエスはお答[こた]えになった。「<j>神[かみ]を信[しん]じなさい。</j>"
  23: "<j>はっきり言[い]っておく。この山[やま]に向[む]かって『持[も]ち上[あ]げられて、海[うみ]に投[な]げ込[こ]まれ』と言[い]い、心[こころ]の中で疑[うたが]わず、自分[じぶん]の言[い]うとおりになると信[しん]じる者[もの]には、そのとおりになる。</j>"
  24: "<j>だから、言[い]っておく。祈[いの]り求[もと]めることは何[なん]でも、すでに受[う]け取[と]ったと信[しん]じなさい。そうすれば、あなたがたのものになる。</j>"
  25: "<j>立[た]って祈[いの]るとき、誰[だれ]かに対[たい]して恨[うら]みごとがあれば、それを赦[ゆる]しなさい。そうすれば、天[てん]におられるあなたがたの父[ちち]も、あなたがたの罪[つみ]をお赦[ゆる]しになる。</j>」"
  26: "〔<j>しかし、あなたがたが赦[ゆる]さなければ、天[てん]におられるあなたがたの父[ちち]も、あなたがたの罪[つみ]をお赦[ゆる]しにならない。</j>〕"
  27: "一行[いっこう]は再[ふたた]びエルサレムに来[き]た。イエスが神殿[しんでん]の境内[けいだい]を歩[ある]いておられると、祭司長[さいしちょう]たち、律法学者[りっぽうがくしゃ]たち、長老[ちょうろう]たちが近[ちか]づいて来[き]て、"
  28: "言[い]った。「何[なん]の権[けんい]があって、こんなことをしているのか。誰[だれ]が、そんなことをする権威[けんい]をあなたに与[あた]えたのか。」"
  29: "イエスは言[い]われた。「<j>わたしも一[ひと]つ尋[たず]ねよう。答[こた]えてほしい。そうしたら、わたしが何[なん]の権[けん]でこうしているかを話[はな]そう。</j>"
  30: "<j>ヨハネの洗礼[せんれい]は、天[てん]から出[で]たものか、それとも人[ひと]から出[で]たものか。答[こた]えなさい。</j>」"
  31: "彼[かれ]らは互[たが]いに論[ろん]じ合[あ]った。「もし『天[てん]から』と言[い]えば、『では、なぜ彼[かれ]を信[しん]じなかったのか』と言[い]われるだろう。"
  32: "だが、『人[ひと]から』と言[い]おうか。」しかし、群衆[ぐんしゅう]を恐[おそ]れた。皆[みな]、ヨハネを本当[ほんとう]に預言者[よげんしゃ]だと思[おも]っていたからである。"
  33: "彼[かれ]らはイエスに答[こた]えた。「知[し]りません。」イエスは言[い]われた。「<j>わたしも、何[なん]の権[けん]でこうしているかを、あなたがたには話[はな]さない。</j>」"

notes:
  1: "Βηθφαγή — ベツファゲ, Βηθανία — ベタニア; Ὄρος τῶν Ἐλαιῶν — オリーブ山 (как в Мф 21:1)."
  2: "πῶλος — молодой осёл; 子ろば, как в Мф 21:2."
  9: "Ὡσαννά — еврейское «спаси же»; сноска, первое упоминание в Марке. У jp-joc транслитерация «オサンナ»."
  10: "В критической базе Εὐλογημένη ἡ ἐρχομένη βασιλεία τοῦ πατρὸς ἡμῶν Δαυίδ. У jp-joc здесь сглажено в «王の名に因りて來る者» (перенос из 9-го стиха); оставлено «来るべき、わたしたちの父ダビデの国は»."
  15: "κολλυβισταί — менялы; 両替人, как в Мф 21:12."
  16: "σκεῦος — «сосуд, утварь»; передал 物を運んで通ることを…お許しにならなかった, чтобы не вводить непонятное 器."
  17: "πᾶσιν τοῖς ἔθνεσιν — «всем народам»; здесь すべての民, а не 異邦人, потому что это цитата Ис 56:7."
  23: "ἄρθητι καὶ βλήθητι — «поднимись и бросься»; 持ち上げられて、海に投げ込まれ, с сохранением страдательного залога."
  25: "παραπτώματα — «преступления, падения»; 罪."
  26: "Стиха нет в критическом издании (западное чтение, параллель Мф 6:15); Церковь читает — весь стих в 〔…〕."
  32: "ἐφοβοῦντο τὸν ὄχλον — «боялись толпы»; 群衆を恐れた."
