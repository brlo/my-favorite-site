verses:
  1: "セナアルの王[おう]アマルファルの治世[ちせい]に、エラサルの王[おう]アリオク、エラムの王[おう]ホドロゴモル、諸国民[しょこくみん]の王[おう]タルガルが、"
  2: "ソドムの王[おう]バラ、ゴモラの王[おう]バルサ、アダマの王[おう]セナアル、セボイムの王[おう]シェモボル、およびバラクの王[おう]と戦[たたか]った。バラクはツォアルである。"
  3: "これらすべての者[もの]は、塩[しお]の谷[たに]、すなわち塩[しお]の海[うみ]に集[あつ]まった。"
  4: "十二年[じゅうにねん]の間[あいだ]、彼[かれ]らはホドロゴモルに仕[つか]え、十三年目[じゅうさんねんめ]に背[そむ]いた。"
  5: "十四年目[じゅうよねんめ]に、ホドロゴモルと彼[かれ]とともにいる王[おう]たちが来[き]て、アスタロト・カルナインにいる巨人[きょじん]たちを、また彼[かれ]らとともにいる強[つよ]い民[たみ]を、またサウエの町[まち]にいるオンマイ人[じん]を切[き]り倒[たお]した。"
  6: "また、セイルの山[やま]にいるホル人[じん]を、荒野[こうや]にあるファランの樫[かし]の木[き]のところまで切[き]り倒[たお]した。"
  7: "彼[かれ]らは引[ひ]き返[かえ]して裁[さば]きの泉[いずみ]に来[き]た。これはカデスである。そして、アマレクのすべての支配者[しはいしゃ]たちと、アササンタマルに住[す]むアモル人[じん]を切[き]り倒[たお]した。"
  8: "ソドムの王[おう]、ゴモラの王[おう]、アダマの王[おう]、セボイムの王[おう]、およびバラクの王[おう]、すなわちツォアルの王[おう]が出[で]て、塩[しお]の谷[たに]で彼[かれ]らと戦[たたか]うために陣[じん]を敷[し]いた。"
  9: "すなわち、エラムの王[おう]ホドロゴモル、諸国民[しょこくみん]の王[おう]タルガル、セナアルの王[おう]アマルファル、エラサルの王[おう]アリオクと。四[よっ]つの王[おう]が五[いつ]つの王[おう]と戦[たたか]った。"
  10: "塩[しお]の谷[たに]にはアスファルトの井戸[いど]がいくつもあった。ソドムの王[おう]とゴモラの王[おう]は逃[に]げ、そこに落[お]ちた。残[のこ]った者[もの]たちは山地[さんち]へ逃[に]げた。"
  11: "彼[かれ]らはソドムとゴモラのすべての馬[うま]と、彼[かれ]らのすべての食物[しょくもつ]を取[と]って、去[さ]った。"
  12: "彼[かれ]らはアブラムの兄弟[きょうだい]の子[こ]ロトとその家財[かざい]を取[と]って、去[さ]った。ロトはソドムに住[す]んでいたからである。"
  13: "逃[に]げ延[の]びた者[もの]の一人[ひとり]が来[き]て、アブラムに告[つ]げた。アブラムはヘブロンにいるマムレの樫[かし]の木[き]のそばに住[す]んでいた。マムレはアモル人[じん]で、エシュコルの兄弟[きょうだい]、またアウナンの兄弟[きょうだい]であり、彼[かれ]らはアブラムの同盟者[どうめいしゃ]であった。"
  14: "アブラムは、自分[じぶん]の兄弟[きょうだい]ロトが捕[とりこ]にされたことを聞[き]いて、家[いえ]で生[う]まれた者[もの]たち三百十八人[さんびゃくじゅうはちにん]を集[あつ]め、彼[かれ]らの後[あと]を追[お]ってダンまで行[ゆ]った。"
  15: "彼[かれ]は夜[よる]のうちに、自分[じぶん]とその僕[しもべ]たちで彼[かれ]らに襲[おそ]いかかり、彼[かれ]らを打[う]ち破[やぶ]って、ダマスコの左[ひだり]にあるホバまで追[お]った。"
  16: "彼[かれ]はソドムのすべての馬[うま]を取[と]り戻[もど]し、自分[じぶん]の兄弟[きょうだい]ロトとその家財[かざい]、女[おんな]たちと民[たみ]をも取[と]り戻[もど]した。"
  17: "彼[かれ]がホドロゴモルと彼[かれ]とともにいた王[おう]たちを打[う]ち破[やぶ]って帰[かえ]ったとき、ソドムの王[おう]は彼[かれ]を迎[むか]えるために、サウエの谷[たに]、すなわち王[おう]の野[の]へ出[で]て来[き]た。"
  18: "サレムの王[おう]メルキセデクは、パンとぶどう酒[しゅ]を持[も]って来[き]た。彼[かれ]はいと高[たか]き神[かみ]の祭司[さいし]であった。"
  19: "彼[かれ]はアブラムを祝福[しゅくふく]して言[い]った。「アブラムは、天[てん]と地[ち]を造[つく]られた、いと高[たか]き神[かみ]によって祝福[しゅくふく]された者[もの]である。"
  20: "あなたの敵[てき]をあなたの手[て]に渡[わた]された、いと高[たか]き神[かみ]は、ほめたたえられる。」そして、アブラムは彼[かれ]に、すべてのものから十分[じゅうぶん]の一[いち]を与[あた]えた。"
  21: "ソドムの王[おう]はアブラムに言[い]った。「わたしに人々[ひとびと]を返[かえ]し、馬[うま]はあなたが取[と]れ。」"
  22: "アブラムはソドムの王[おう]に言[い]った。「わたしは、天[てん]と地[ち]を造[つく]られた、いと高[たか]き神[かみ]に向[む]かって、わたしの手[て]を挙[あ]げる。"
  23: "あなたのすべてのものから、糸[いと]一本[いっぽん]から靴[くつ]のひもに至[いた]るまで、わたしは何[なに]も取[と]らない。『わたしがアブラムを富[とみ]ませた』と、あなたが言[い]わないためである。"
  24: "ただ、若者[わかもの]たちが食[た]べたもの、またわたしとともに歩[あゆ]んだ者[もの]たち、エシュコル、アウナン、マムレの分[ぶん]は別[べつ]である。彼[かれ]らは自分[じぶん]たちの分[ぶん]を取[と]るがよい。」"

notes:
  1: "Ἐγένετο ἐν τῇ βασιλείᾳ τῇ Αμαρφαλ — アマルファルの治世に (βασιλεία — «царство, правление»). Σεννααρ, Ελλασαρ, Αιλαμ — セナアル、エラサル、エラム. Предложение продолжается в ст. 2 («пошли войной»)."
  2: "ἐποίησαν πόλεμον — 戦った (букв. «сделали войну»). Βαλλα, Βαρσα, Σεννααρ, Συμοβορ, Βαλακ — バラ、バルサ、セナアル、シェモボル、バラク. αὕτη ἐστὶν Σηγωρ — バラクはツォアルである (в критическом издании в квадратных скобках, но в базе есть — без 〔〕)."
  3: "συνεφώνησαν ἐπὶ τὴν φάραγγα τὴν ἁλυκήν — 塩の谷に集まった (φάραγξ — «ущелье, долина»; ἁλυκός — «солёный»). αὕτη ἡ θάλασσα τῶν ἁλῶν — 塩の海."
  4: "δώδεκα ἔτη ἐδούλευον — 十二年の間仕えた (δουλεύω). τῷ τρισκαιδεκάτῳ ἔτει ἀπέστησαν — 十三年目に背いた (ἀφίστημι)."
  5: "ἐν τῷ τεσσαρεσκαιδεκάτῳ ἔτει — 十四年目に. κατέκοψαν — 切り倒した (κατακόπτω). Ασταρωθ Καρναιν, Ομμαίους, Σαυη — アスタロト・カルナイン、オンマイ人、サウエ."
  6: "Χορραίους τοὺς ἐν τοῖς ὄρεσιν Σηιρ — セイルの山にいるホル人. ἕως τῆς τερεμίνθου τῆς Φαραν — ファランの樫の木のところまで (τερέμινθος — «теревинф»)."
  7: "πηγὴν τῆς κρίσεως — 裁きの泉. αὕτη ἐστὶν Καδης — これはカデスである. ἄρχοντας Αμαληκ — アマレクの支配者たち. Ασασανθαμαρ — アササンタマル."
  8: "παρετάξαντο — 陣を敷いた (παρατάσσω). βασιλεὺς Βαλακ, αὕτη ἐστὶν Σηγωρ — バラクの王、すなわちツォアルの王."
  9: "οἱ τέσσαρες βασιλεῖς πρὸς τοὺς πέντε — 四つの王が五つの王と (в LXX нет глагола; «воевали» взято из ст. 8 по смыслу)."
  10: "φρέατα φρέατα ἀσφάλτου — アスファルトの井戸がいくつも (повтор в LXX: «ямы, ямы»). ἐνέπεσαν ἐκεῖ — そこに落ちた. εἰς τὴν ὀρεινὴν ἔφυγον — 山地へ逃げた."
  11: "τὴν ἵππον πᾶσαν — すべての馬 (ἵππος — «конь, конница»; слав. «конныя»). τὰ βρώματα αὐτῶν — 彼らの食物 (βρῶμα)."
  12: "τὸν Λωτ υἱὸν τοῦ ἀδελφοῦ Αβραμ — アブラムの兄弟の子ロト. τὴν ἀποσκευὴν αὐτοῦ — その家財 (ἀποσκευή — «пожитки»)."
  13: "τῶν ἀνασωθέντων τις — 逃げ延びた者の一人 (ἀνασῴζω). τῷ πέρατῃ — アブラムに (πέρατης — «пришелец с той стороны»). ὁ Αμορις τοῦ ἀδελφοῦ Εσχωλ καὶ ἀδελφοῦ Αυναν — アモル人で、エシュコルの兄弟、アウナンの兄弟 (LXX: Αυναν; в масор. Анер). συνωμότες — 同盟者 (συνωμότης)."
  14: "ᾐχμαλώτευται — 捕虜にされた (αἰχμαλωτεύω). τοὺς ἰδίους οἰκογενεῖς — 家で生まれた者たち (οἰκογενής). τριακοσίους δέκα καὶ ὀκτώ — 三百十八人. ἕως Δαν — ダンまで."
  15: "ἐπέπεσεν ἐπ᾽ αὐτοὺς τὴν νύκτα — 夜のうちに彼らに襲いかかった (ἐπιπίπτω). ἐπάταξεν — 打ち破った (πατάσσω). ἕως Χωβα — ホバまで. ἐν ἀριστερᾷ Δαμασκοῦ — ダマスコの左に."
  16: "ἀπέστρεψεν — 取り戻した (ἀποστρέφω). πᾶσαν τὴν ἵππον — すべての馬. τὰ ὑπάρχοντα αὐτοῦ — その家財. τὰς γυναῖκας καὶ τὸν λαόν — 女たちと民."
  17: "μετὰ τὸ ἀναστρέψαι αὐτὸν ἀπὸ τῆς κοπῆς τοῦ Χοδολλογομορ — ホドロゴモルを打ち破って帰ったとき (κοπή — «поражение, сеча»). εἰς τὴν κοιλάδα τὴν Σαυη — サウエの谷に. τοῦτο ἦν τὸ πεδίον βασιλέως — すなわち王の野."
  18: "Μελχισεδεκ βασιλεὺς Σαλημ — サレムの王メルキセデク. ἐξήνεγκεν ἄρτους καὶ οἶνον — パンとぶどう酒を持って来た. ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου — いと高き神の祭司 (ὕψιστος — いと高き; ср. Евр 7:1)."
  19: "ηὐλόγησεν τὸν Αβραμ — アブラムを祝福して. Εὐλογημένος Αβραμ τῷ θεῷ τῷ ὑψίστῳ — アブラムは…神によって祝福された者である. ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὴν γῆν — 天と地を造られた (κτίζω)."
  20: "ὃς παρέδωκεν τοὺς ἐχθρούς σου ὑποχειρίους σοι — あなたの敵をあなたの手に渡された (ὑποχείριος — «под рукой»). ἔδωκεν αὐτῷ δεκάτην ἀπὸ πάντων — すべてのものから十分の一を与えた (δεκάτη — «десятина»)."
  21: "Δός μοι τοὺς ἄνδρας — わたしに人々を返せ. τὴν δὲ ἵππον λαβὲ σεαυτῷ — 馬はあなたが取れ."
  22: "Ἐκτενῶ τὴν χεῖρά μου — わたしの手を挙げる (ἐκτείνω). πρὸς τὸν θεὸν τὸν ὕψιστον — いと高き神に向かって: в LXX нет κύριος (слав. «Господу Богу вышнему»), поэтому 主 не добавлено."
  23: "εἰ ἀπὸ σπαρτίου ἕως σφαιρωτῆρος ὑποδήματος λήμψομαι — 糸一本から靴のひもに至るまで取らない (σπαρτίον — «нить»; σφαιρωτήρ — «завязка, ремень»). ἵνα μὴ εἴπῃς ὅτι Ἐγὼ ἐπλούτισα τὸν Αβραμ — 『わたしがアブラムを富ませた』と言わないため (вложенная речь — 『』)."
  24: "πλὴν ὧν ἔφαγον οἱ νεανίσκοι — ただ若者たちが食べたもののほか. τῆς μερίδος τῶν ἀνδρῶν τῶν συμπορευθέντων μετ᾽ ἐμοῦ — わたしとともに歩んだ者たちの分 (μερίς). Εσχωλ, Αυναν, Μαμβρη — エシュコル、アウナン、マムレ. οὗτοι λήμψονται μερίδα — 彼らは自分の分を取るがよい."
