# jp-box, Бытие, глава 14. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru),
# русский Синодальный (ru) и, где есть, jp-joc (1901, public domain); jp-joc здесь
# есть только в 14:14–20, остальное в модуле пусто.
# Язык — современный 常体, без 文語; порядок членов — по греческому.
# Глава 14: война четырёх царей против пяти (1–12), освобождение Лота (13–16),
# Мелхиседек и десятина (17–20), отказ Аврама от добычи (21–24).
# Красного и синего нет: речь Мелхиседека (19–20), царя Содомского (21) и Аврама (22–24) — 「…」.
# Вложенная речь в 14:23 («я обогатил Аврама») — 『…』.
# 〔…〕 нет: все слова, включая пояснения в квадратных скобках критического издания
# (αὕτη ἐστὶν Σηγωρ, τοῦτο ἦν τὸ πεδίον βασιλέως), есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 十分の一 уже встречается в корпусе (Мф 23:23, Лк 11:42, Евр 7) и пояснения не требует.
