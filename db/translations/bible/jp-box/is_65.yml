# jp-box, Исаия, глава 65. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 65 — 9 стихов из 25, в выгрузку не входил;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 65: 1–2 «Я открылся не искавшим Меня»: народ, не призывавший имени,
# руки, простёртые к непокорным (цит. Рим 10:20–21); 3–5 жертвы в садах, курение
# на кирпичах, гробы и пещеры, свиное мясо, «я чист для тебя», дым ярости;
# 6–7 написанное пред Господом, воздаяние в недро; 8–12 гроздь и благословение,
# семя от Иакова, дубрава и долина Ахор, трапеза бесу, меч; 13–16 рабы едят,
# вы голодаете; новое имя; забвение прежней скорби; 17–25 новое небо и новая
# земля, радость Иерусалима, сто лет, домы и виноградники, «прежде нежели
# воззовут», волк и агнец, лев и солома, змей и прах.
# Голоса: 1–7 речь Господа — одна цитата 「…»; начинается без вводной формулы
# (это ответ на молитву 63:7–64:11), внутри 65:7 формула «говорит Господь»
# передана в конце стиха (ср. Деян 7:49). 65:8 «так говорит Господь» — вне
# кавычек, новая цитата до 65:12; 65:13 «посему так говорит Господь» — вне
# кавычек, цитата до 65:25, в конце формула «говорит Господь» вне кавычек.
# Слова людей внутри речи Господа (65:5, 65:8) и «что?» (65:24) — 『…』.
# Нумерация по gr: 25 стихов; у csl и ru тоже 25.
# Паритет: 65:15 «εἰς πλησμονήν» (насыщение) — LXX, у Син. «для проклятия»
# (МТ) — в notes. 65:22 «παλαιώσουσιν» — в тексте «長く保つ». 65:13/14 слав.
# делит иначе (третья пара «возрадуются… посрамитеся» у него в начале 65:14) —
# держим gr. 〔…〕 нет.
# Сносок ⟨…⟩ нет: 嗣業, 食卓, 剣, 狼, 獅子, 蛇 уже в корпусе.
# Имена — транслитерация греческого (LXX): ヤコブ, ユダ, エルサレム, アコル (Αχωρ).

