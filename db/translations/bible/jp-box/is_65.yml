verses:
  1: "「わたしは、わたしを求[もと]めなかった者[もの]たちに現[あらわ]れ、わたしを問[と]わなかった者たちに見[み]いだされた。わたしは、わたしの名[な]を呼[よ]ばなかった国民[こくみん]に言[い]った。『見[み]よ、わたしはここにいる』と。"
  2: "わたしは終日[しゅうじつ]、従[したが]わず、逆[さか]らう民[たみ]に向[む]かって手[て]を広[ひろ]げていた。彼らは真理[しんり]の道[みち]を歩[あゆ]まず、自分[じぶん]の罪[つみ]の後[あと]を追[お]いかけた。"
  3: "この民[たみ]は、わたしの前[まえ]で絶[た]えずわたしを怒[いか]らせ、園[その]で犠牲[ぎせい]をささげ、れんがの上[うえ]で、実在[じつざい]しない悪霊[あくりょう]たちに香[こう]をたいた。"
  4: "彼らは墓[はか]の中[なか]や洞窟[どうくつ]で、夢[ゆめ]のゆえに寝[ね]むり、豚[ぶた]の肉[にく]を食[た]べ、犠牲[ぎせい]の汁[しる]を飲[の]み、その器[うつわ]はすべて汚[けが]れている。"
  5: "そして、『わたしから離[はな]れよ。わたしに近[ちか]づくな。わたしはあなたより清[きよ]いのだ』と言[い]う者[もの]たち。この者たちはわたしの憤[いきどお]りの煙[けむり]であり、火[ひ]は彼[かれ]らのうちで日[ひ]々[び]燃[も]えている。"
  6: "見[み]よ、それはわたしの前[まえ]に書[か]き記[しる]されている。わたしは黙[だま]らない。彼[かれ]らのふところに返[かえ]すまでは。"
  7: "その罪[つみ]を——山[やま]の上[うえ]で香[こう]をたき、丘[おか]の上でわたしをそしった者[もの]たちの罪を——わたしは彼らのわざとともに彼らのふところに返す、と主[しゅ]は言[い]われる。」"
  8: "主[しゅ]はこう言[い]われる。「ぶどうの房[ふさ]に実[み]が見[み]つかると、人[ひと]々[びと]は『それを損[そこ]なうな。主の祝福[しゅくふく]がその中にあるからだ』と言う。わたしは、わたしに仕[つか]える者[もの]のゆえに、そのようにする。彼のゆえに、わたしはすべてを滅[ほろ]ぼしはしない。"
  9: "わたしはヤコブから子孫[しそん]を、ユダからわたしの山[やま]を嗣[つ]ぐ者[もの]を導[みちび]き出[だ]す。わたしの選[えら]ばれた者たちと、わたしのしもべたちがそれを嗣業[しぎょう]として受[う]け、そこに住[す]む。"
  10: "わたしを求[もと]めた民[たみ]のために、森[もり]には羊[ひつじ]の群[む]れの囲[かこ]いが、アコルの谷[たに]には牛[うし]の群れの憩[いこ]いの場[ば]がある。"
  11: "しかし、あなたがたはわたしを捨[す]て、わたしの聖[せい]なる山[やま]を忘[わす]れ、悪霊[あくりょう]に食卓[しょくたく]を整[ととの]え、幸運[こううん]の神[かみ]に混[ま]ぜ合[あ]わせた飲み物[のみもの]を満[み]たす。"
  12: "わたしはあなたがたを剣[つるぎ]に渡[わた]す。あなたがたは皆[みな]、屠[ほふ]られるために倒[たお]れる。わたしが呼[よ]んだのに、あなたがたは答[こた]えず、語[かた]ったのに、聞[き]かず、わたしの目[め]に悪[わる]いことを行[おこな]い、わたしが望[のぞ]まないものを選[えら]んだからである。」"
  13: "それゆえ、主[しゅ]はこう言[い]われる。「見[み]よ、わたしに仕[つか]える者[もの]たちは食[た]べるが、あなたがたは飢[う]える。見よ、わたしに仕える者たちは飲[の]むが、あなたがたは渇[かわ]く。見よ、わたしに仕える者たちは喜[よろこ]ぶが、あなたがたは恥[は]じる。"
  14: "見[み]よ、わたしに仕える者たちは心[こころ]の喜[よろこ]びにあふれて喜[よろこ]び躍[おど]り、あなたがたは心の苦[くる]しみのゆえに叫[さけ]び、心の砕[くだ]けるゆえに泣[な]き叫[さけ]ぶ。"
  15: "あなたがたは自分[じぶん]の名[な]を、わたしの選[えら]ばれた者[もの]たちの満[み]ち足[た]りとして残[のこ]す。主[しゅ]はあなたがたを滅[ほろ]ぼされる。しかし、主に仕[つか]える者たちには新[あたら]しい名[な]が呼[よ]ばれる。"
  16: "地[ち]の上[うえ]で祝福[しゅくふく]を受[う]ける者は、真[しん]の神[かみ]によって祝福を受ける。地で誓[ちか]う者は、真の神によって誓う。先[さき]の苦[くる]しみは忘れられ、わたしの心[こころ]に上[のぼ]ることもないからである。"
  17: "新しい天[てん]と新しい地[ち]が現[あらわ]れる。昔[むかし]のことは思[おも]い起[おこ]されず、だれの心[こころ]にも上[のぼ]らない。"
  18: "彼らはそこに喜[よろこ]びと喜[よろこ]び躍[おど]りを見[み]いだす。見よ、わたしはエルサレムを喜び躍りとし、わたしの民[たみ]を喜びとする。"
  19: "わたしはエルサレムを喜[よろこ]び、わたしの民[たみ]を喜ぶ。そこではもはや、泣[な]き声[ごえ]も叫[さけ]び声も聞[き]かれない。"
  20: "そこにはもはや、時[とき]を満[み]たさぬまま死[し]ぬ幼[おさな]い者[もの]も、自分[じぶん]の年[とし]を満たさない老[お]いた者もいない。百歳[ひゃくさい]になる者は若者[わかもの]とされ、百歳で死ぬ罪[つみ]ある者は呪[のろ]われる。"
  21: "彼らは家[いえ]を建[きず]いて住[す]み、ぶどう畑[ばたけ]を植[う]えてその実[み]を食[た]べる。"
  22: "彼らが建てて他人[たにん]が住むことはなく、彼らが植えて他人が食べることもない。わたしの民[たみ]の日[ひ]々[び]は命[いのち]の木[き]の日々のようであり、彼らは自分[じぶん]の労苦[ろうく]のわざを長[なが]く保[たも]つ。"
  23: "わたしの選[えら]ばれた者[もの]たちはむだに労[ろう]することも、呪[のろ]いのために子[こ]を生[う]むこともない。彼らは主[しゅ]に祝福[しゅくふく]された子孫[しそん]であり、その子[こ]らも彼らとともにいるからである。"
  24: "彼らが呼[よ]ぶ前[まえ]に、わたしは答[こた]える。彼らがまだ語[かた]っているうちに、わたしは『何[なに]か』と言[い]う。"
  25: "そのとき、狼[おおかみ]と子羊[こひつじ]はともに草[くさ]を食[た]べ、獅子[しし]は牛[うし]のようにわらを食べ、蛇[へび]は土[つち]をパンのように食べる。わたしの聖[せい]なる山[やま]では、だれも害[がい]することも、滅[ほろ]ぼすこともない。」と主[しゅ]は言[い]われる。"

notes:
  1: "Ἐμφανὴς ἐγενόμην — «явным Я стал» (ἐμφανής — явный, видимый); τοῖς ἐμὲ μὴ ζητοῦσιν — «тем, кто не ищет Меня» (ζητέω); εὑρέθην — «Я был найден» (εὑρίσκω); τοῖς ἐμὲ μὴ ἐπερωτῶσιν — «тем, кто не спрашивает Меня» (ἐπερωτάω). εἶπα Ἰδού εἰμι — «Я сказал: вот Я» — слова Господа внутри Его речи, в 『…』. τῷ ἔθνει οἳ οὐκ ἐκάλεσάν μου τὸ ὄνομα — «народу, который не призвал имени Моего» (ἐπικαλέω). Стих цитируется в Рим 10:20 (там порядок обратный: «найден… явился»); здесь сохранён порядок LXX. Речь Господа начинается без вводной формулы — это ответ на молитву 63:7–64:11."
  2: "ἐξεπέτασα τὰς χεῖράς μου — «Я простёр руки Мои» (ἐκπετάννυμι — распростирать); ὅλην τὴν ἡμέραν — «весь день»; πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα — «к народу непокорному и прекословящему» (ἀπειθέω — не покоряться; ἀντιλέγω — противоречить); οἳ οὐκ ἐπορεύθησαν ὁδῷ ἀληθινῇ — «которые не пошли путём истинным» (ἀληθινός — истинный); ἀλλ᾽ ὀπίσω τῶν ἁμαρτιῶν αὐτῶν — «но вслед грехов своих» (ὀπίσω — вслед). Цит. Рим 10:21."
  3: "παροξύνων με ἐναντίον ἐμοῦ διὰ παντός — «раздражающий Меня предо Мною всегда» (παροξύνω — раздражать); θυσιάζουσιν ἐν τοῖς κήποις — «приносят жертвы в садах» (κῆπος — сад); θυμιῶσιν ἐπὶ ταῖς πλίνθοις — «кажут на кирпичах» (πλίνθος — кирпич; слав. «во чрепех» — на черепках, иное слово); τοῖς δαιμονίοις, ἃ οὐκ ἔστιν — «бесам, которых нет» (δαιμόνιον; в тексте 悪霊)."
  4: "ἐν τοῖς μνήμασιν καὶ ἐν τοῖς σπηλαίοις — «в гробах и в пещерах» (μνῆμα — гробница; σπήλαιον — пещера); κοιμῶνται δι᾽ ἐνύπνια — «спят ради сновидений» (ἐνύπνιον — сновидение; речь об incubationes, сне при святилищах); κρέα ὕεια — «мясо свиное» (ὕειος — свиной); ζωμὸν θυσιῶν — «похлёбку жертв» (ζωμός — варево); μεμολυμμένα πάντα τὰ σκεύη αὐτῶν — «осквернены все сосуды их» (μολύνω — осквернять)."
  5: "οἱ λέγοντες — «говорящие»; Πόρρω ἀπ᾽ ἐμοῦ — «прочь от меня» (πόρρω — далеко); μὴ ἐγγίσῃς μου — «не приближайся ко мне» (ἐγγίζω); ὅτι καθαρός εἰμι — «ибо я чист»; οὗτος καπνὸς τοῦ θυμοῦ μου — «это дым ярости Моей» (καπνός — дым); πῦρ καίεται ἐν αὐτῷ πάσας τὰς ἡμέρας — «огонь горит в нём во все дни». Слова людей внутри речи Господа — 『…』."
  6: "γέγραπται ἐνώπιόν μου — «написано предо Мною» (γράφω); οὐ σιωπήσω — «не умолкну» (σιωπάω); ἕως ἂν ἀποδῶ εἰς τὸν κόλπον αὐτῶν — «доколе не воздам в недро их» (κόλπος — недро, грудь). Стих обрывается на «их»: объект (грехи) стоит в 65:7; в тексте конец стиха «彼らのふところに返すまでは。」."
  7: "τὰς ἁμαρτίας αὐτῶν καὶ τῶν πατέρων αὐτῶν — «грехи их и отцов их»; λέγει κύριος — «говорит Господь»: в гр. формула стоит в середине стиха, в тексте — в конце, после всего содержания (ср. Деян 7:49, где формула внутри цитаты); οἳ ἐθυμίασαν ἐπὶ τῶν ὀρέων — «которые кадили на горах» (θυμιάω); ἐπὶ τῶν βουνῶν ὠνείδισάν με — «на холмах поносили Меня» (ὀνειδίζω); ἀποδώσω τὰ ἔργα αὐτῶν εἰς τὸν κόλπον αὐτῶν — «воздам дела их в недро их»."
  8: "Οὕτως λέγει κύριος — «так говорит Господь»: формула вне кавычек, начинается новая речь. Ὃν τρόπον εὑρεθήσεται ὁ ῥὼξ ἐν τῷ βότρυι — «как находится сок [ягода] в грозди» (ῥώξ — ягода, сок; βότρυς — гроздь); Μὴ λυμήνῃ αὐτόν — «не погуби его» (λυμαίνω — портить, губить), слова людей — 『…』; ὅτι εὐλογία κυρίου ἐστὶν ἐν αὐτῷ — «ибо благословение Господне в нём». ἕνεκεν τοῦ δουλεύοντός μοι — «ради служащего Мне» (δουλεύω); οὐ μὴ ἀπολέσω πάντας — «не погублю всех» (ἀπόλλυμι)."
  9: "ἐξάξω τὸ ἐξ Ιακωβ σπέρμα — «изведу от Иакова семя» (ἐξάγω — выводить); τὸ ἐξ Ιουδα — «и от Иуды» (в гр. без существительного, «наследника» подразумевается); κληρονομήσει τὸ ὄρος τὸ ἅγιόν μου — «наследует гору святую Мою»; οἱ ἐκλεκτοί μου καὶ οἱ δοῦλοί μου — «избранные Мои и рабы Мои»; κατοικήσουσιν ἐκεῖ — «поселятся там» (κατοικέω)."
  10: "ἐν τῷ δρυμῷ ἐπαύλεις ποιμνίων — «в дубраве дворы [загоны] паств» (δρυμός — дубрава, лес; в тексте 森; ἔπαυλις — двор, загон); φάραγξ Αχωρ — «долина Ахор» (в тексте アコル, форма корпуса, ср. Нав 7:24); εἰς ἀνάπαυσιν βουκολίων — «в покой стад волов» (βουκόλιον — стадо волов); οἳ ἐζήτησάν με — «которые взыскали Меня». У Син. в начале «Сарон» — по МТ, в LXX этого нет, в текст не внесено."
  11: "οἱ ἐγκαταλιπόντες με — «оставившие Меня» (ἐγκαταλείπω); ἐπιλανθανόμενοι τὸ ὄρος τὸ ἅγιόν μου — «забывающие гору святую Мою» (ἐπιλανθάνομαι); ἑτοιμάζοντες τῷ δαίμονι τράπεζαν — «готовящие бесу трапезу» (δαίμων — бес, в тексте 悪霊; τράπεζα — стол, трапеза); πληροῦντες τῇ τύχῃ κέρασμα — «наполняющие счастию [богине судьбы] смешение» (τύχη — счастье, судьба, здесь — божество; κέρασμα — смешанный напиток)."
  12: "παραδώσω ὑμᾶς εἰς μάχαιραν — «предам вас мечу» (μάχαιρα — меч); ἐν σφαγῇ πεσεῖσθε — «в заклание падёте» (σφαγή — заклание); ἐκάλεσα ὑμᾶς καὶ οὐχ ὑπηκούσατε — «Я звал вас, и вы не послушались» (ὑπακούω); ἐλάλησα καὶ παρηκούσατε — «говорил, и вы не вняли» (παρακούω); ἐποιήσατε τὸ πονηρὸν ἐναντίον ἐμοῦ — «делали злое предо Мною»; ἃ οὐκ ἐβουλόμην ἐξελέξασθε — «чего Я не хотел, избрали» (βούλομαι)."
  13: "Διὰ τοῦτο τάδε λέγει κύριος — «посему так говорит Господь»: новая формула вне кавычек. οἱ δουλεύοντές μοι φάγονται — «служащие Мне будут есть»; πεινάσετε — «будете голодать» (πεινάω); πίονται — «будут пить»; διψήσετε — «будете жаждать» (διψάω); εὐφρανθήσονται — «возвеселятся»; αἰσχυνθήσεσθε — «постыдитесь» (αἰσχύνω). У слав. третья пара («возрадуются… посрамитеся») отнесена к началу своего 65:14 — деление иное, держим gr."
  14: "ἀγαλλιάσονται ἐν εὐφροσύνῃ — «возрадуются в веселии»; κεκράξεσθε διὰ τὸν πόνον τῆς καρδίας ὑμῶν — «возопите от боли сердца вашего» (κράζω — кричать; πόνος — боль); ἀπὸ συντριβῆς πνεύματος ὀλολύξετε — «от сокрушения духа восплачете» (συντριβή — сокрушение; ὀλολύζω — вопить, рыдать). Слав. добавляет «сердца» к «веселию» («возвеселятся в веселии сердца») — внесено в основной текст без 〔…〕 (心の喜び)."
  15: "καταλείψετε τὸ ὄνομα ὑμῶν — «оставите имя ваше» (καταλείπω); εἰς πλησμονὴν τοῖς ἐκλεκτοῖς μου — «в насыщение избранным Моим» (πλησμονή — полнота, пресыщение; так LXX передаёт евр. «в проклятие», ср. Син. «для проклятия»; в тексте 満ち足り); ὑμᾶς δὲ ἀνελεῖ κύριος — «вас же избиет Господь» (ἀναιρέω); τοῖς δὲ δουλεύουσιν αὐτῷ κληθήσεται ὄνομα καινόν — «служащим же Ему наречётся имя новое»."
  16: "ὃ εὐλογηθήσεται ἐπὶ τῆς γῆς — «который благословится на земле» (относится к «новому имени» 65:15); εὐλογήσουσιν τὸν θεὸν τὸν ἀληθινόν — «благословят Бога истинного» (ἀληθινός); οἱ ὀμνύοντες ἐπὶ τῆς γῆς ὀμοῦνται — «клянущиеся на земле будут клясться» (ὄμνυμι); ἐπιλήσονται τὴν θλῖψιν αὐτῶν τὴν πρώτην — «забудут скорбь свою первую» (ἐπιλανθάνομαι; θλῖψις); οὐκ ἀναβήσεται αὐτῶν ἐπὶ τὴν καρδίαν — «не взойдёт им на сердце». В конце стиха в гр. знак «—» (редакторская помета), в текст не перенесён."
  17: "ἔσται γὰρ ὁ οὐρανὸς καινὸς καὶ ἡ γῆ καινή — «ибо будет небо новое и земля новая» (καινός — новый); οὐ μὴ μνησθῶσιν τῶν προτέρων — «не вспомнят прежнего» (μιμνῄσκομαι; πρότερος — прежний); οὐδ᾽ οὐ μὴ ἐπέλθῃ αὐτῶν ἐπὶ τὴν καρδίαν — «и не взойдёт им на сердце» (ἐπέρχομαι). Син. «Я творю новое небо и новую землю» — по МТ (בורא), в LXX «будет»; в текст не внесено."
  18: "ἀλλ᾽ εὐφροσύνην καὶ ἀγαλλίαμα εὑρήσουσιν ἐν αὐτῇ — «но радость и веселие найдут в ней» (εὑρίσκω); ἰδοὺ ἐγὼ ποιῶ Ιερουσαλημ ἀγαλλίαμα — «вот, Я творю Иерусалим веселием»; τὸν λαόν μου εὐφροσύνην — «народ Мой — радостью». Син. «А вы будете веселиться» — 2 л. по МТ, в LXX 3 л. мн. ч."
  19: "ἀγαλλιάσομαι ἐπὶ Ιερουσαλημ — «возвеселюсь об Иерусалиме» (ἀγαλλιάομαι); οὐκέτι μὴ ἀκουσθῇ ἐν αὐτῇ φωνὴ κλαυθμοῦ — «уже не услышится в ней голос плача» (κλαυθμός); οὐδὲ φωνὴ κραυγῆς — «ни голос вопля» (κραυγή)."
  20: "οὐ μὴ γένηται ἐκεῖ ἄωρος καὶ πρεσβύτης — «не будет там преждевременно умершего и старца» (ἄωρος — безвременный, умерший рано; πρεσβύτης — старец); ὃς οὐκ ἐμπλήσει τὸν χρόνον αὐτοῦ — «который не исполнит времени своего» (ἐμπίμπλημι); ἔσται ὁ νέος ἑκατὸν ἐτῶν — «будет юный ста лет»; ὁ ἀποθνῄσκων ἁμαρτωλὸς ἑκατὸν ἐτῶν — «умирающий грешник ста лет»; ἐπικατάρατος ἔσται — «проклят будет» (ἐπικατάρατος)."
  21: "οἰκοδομήσουσιν οἰκίας καὶ αὐτοὶ ἐνοικήσουσιν — «построят домы и сами поселятся» (ἐνοικέω); καταφυτεύσουσιν ἀμπελῶνας — «насадят виноградники» (καταφυτεύω); φάγονται τὰ γενήματα αὐτῶν — «съедят произведения их» (γένημα — плод, произведение)."
  22: "οὐ μὴ οἰκοδομήσουσιν καὶ ἄλλοι ἐνοικήσουσιν — «не построят, и другие поселятся»; κατὰ τὰς ἡμέρας τοῦ ξύλου τῆς ζωῆς — «по дням древа жизни» (ξύλον — дерево; в тексте 命の木); τὰ ἔργα τῶν πόνων αὐτῶν παλαιώσουσιν — «дела трудов их обветшают», т. е. долго будут пользоваться (παλαιόω — делать старым, ветшать; в тексте 長く保つ). Син. «избранные Мои долго будут пользоваться» — «избранные» добавлены по МТ, в LXX нет."
  23: "οἱ ἐκλεκτοί μου οὐ κοπιάσουσιν εἰς κενόν — «избранные Мои не будут трудиться вотще» (κοπιάω; εἰς κενόν — напрасно); τεκνοποιήσουσιν εἰς κατάραν — «рождать детей в проклятие» (τεκνοποιέω); σπέρμα ηὐλογημένον ὑπὸ θεοῦ — «семя, благословенное Богом»; τὰ ἔκγονα αὐτῶν μετ᾽ αὐτῶν — «потомство их с ними» (ἔκγονος)."
  24: "πρὶν κεκράξαι αὐτοὺς ἐγὼ ἐπακούσομαι αὐτῶν — «прежде нежели воззовут они, Я услышу их» (ἐπακούω); ἔτι λαλούντων αὐτῶν ἐρῶ Τί ἐστιν — «ещё говорящим им скажу: что [есть]?»; слова Господа внутри Его речи — 『…』. Слав. «реку: что есть?»."
  25: "λύκοι καὶ ἄρνες βοσκηθήσονται ἅμα — «волки и агнцы будут пастись вместе» (βόσκω — пасти; ἅμα — вместе); λέων ὡς βοῦς φάγεται ἄχυρα — «лев, как вол, будет есть солому» (ἄχυρον — солома, мякина); ὄφις δὲ γῆν ὡς ἄρτον — «змея же землю, как хлеб»; οὐκ ἀδικήσουσιν — «не будут делать зла» (ἀδικέω); οὐδὲ μὴ λυμανοῦνται — «и не будут губить» (λυμαίνω); ἐπὶ τῷ ὄρει τῷ ἁγίῳ μου — «на горе святой Моей». λέγει κύριος — «говорит Господь»: формула в конце стиха, в тексте — вне кавычек после закрытия."
