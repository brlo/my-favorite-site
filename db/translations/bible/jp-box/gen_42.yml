verses:
  1: "ヤコブは、エジプトに穀物[こくもつ]が売[う]られているのを見[み]て、息子[むすこ]たちに言[い]った。「なぜ、あなたがたはぼんやりしているのか。"
  2: "見[み]よ、エジプトに穀物[こくもつ]があると聞[き]いた。そこへ下[くだ]って行[い]って、わたしたちに少[すこ]しの食物[しょくもつ]を買[か]ってきなさい。そうすれば、わたしたちは生[い]きて、死[し]なずにすむ。」"
  3: "ヨセフの兄弟[きょうだい]十人[じゅうにん]は、エジプトから穀物[こくもつ]を買[か]うために下[くだ]って行[い]った。"
  4: "しかし、ヤコブはヨセフの弟[おとうと]ベニヤミンを兄弟[きょうだい]たちと一緒[いっしょ]に送[おく]らなかった。「彼[かれ]に災[わざわ]いが起[お]こるといけない」と言[い]ったからである。"
  5: "イスラエルの子[こ]らは、来[き]ていた人々[ひとびと]と一緒[いっしょ]に買[か]いに行[い]った。カナンの地[ち]にも飢饉[ききん]があったからである。"
  6: "ヨセフはエジプトの総督[そうとく]であり、その国[くに]の民[たみ]すべてに売[う]っていた。ヨセフの兄弟[きょうだい]たちは来[き]て、顔[かお]を地[ち]につけて彼[かれ]にひれ伏[ふ]した。"
  7: "ヨセフは兄弟[きょうだい]たちを見[み]て、それと気[き]づいたが、他人[たにん]のように装[よそお]い、激[はげ]しく語[かた]りかけて言[い]った。「あなたがたはどこから来[き]たのか。」彼[かれ]らは言[い]った。「カナンの地[ち]から、食物[しょくもつ]を買[か]いに来[き]ました。」"
  8: "ヨセフは兄弟[きょうだい]たちを見分[みわ]けたが、彼[かれ]らはヨセフを見分[みわ]けなかった。"
  9: "ヨセフは、自分[じぶん]が見[み]た夢[ゆめ]を思[おも]い起[おこ]して言[い]った。「あなたがたは斥候[せっこう]だ。この国[くに]の抜[ぬ]け道[みち]を探[さぐ]りに来[き]たのだ。」"
  10: "彼[かれ]らは言[い]った。「いいえ、ご主人[しゅじん]さま。僕[しもべ]どもは食物[しょくもつ]を買[か]いに来[き]ました。"
  11: "わたしたちはみな、一人[ひとり]の人[ひと]の子[こ]です。わたしたちは穏[おだ]やかな者[もの]です。僕[しもべ]どもは斥候[せっこう]ではありません。」"
  12: "しかし、彼[かれ]は言[い]った。「いいや、あなたがたはこの国[くに]の抜[ぬ]け道[みち]を見[み]に来[き]たのだ。」"
  13: "彼[かれ]らは言[い]った。「僕[しもべ]どもは、カナンの地[ち]にいる兄弟[きょうだい]十二人[じゅうににん]です。末[すえ]の弟[おとうと]は今日[きょう]も父[ちち]と一緒[いっしょ]におり、もう一人[ひとり]はおりません。」"
  14: "ヨセフは彼[かれ]らに言[い]った。「わたしが言[い]ったとおりだ。あなたがたは斥候[せっこう]だ。"
  15: "こうすれば分[わ]かる。ファラオの命[いのち]にかけて、あなたがたの末[すえ]の弟[おとうと]がここへ来[こ]ないかぎり、あなたがたはここから出[で]られない。"
  16: "あなたがたのうち一人[ひとり]を送[おく]って弟[おとうと]を連[つ]れて来[こ]させ、あなたがたは拘束[こうそく]されるがよい。そうして、あなたがたの言葉[ことば]が真実[しんじつ]かどうか、明[あき]らかになる。もしそうでなければ、ファラオの命[いのち]にかけて、あなたがたは斥候[せっこう]だ。」"
  17: "そして、彼[かれ]らを三日間[みっかかん]、牢[ろう]に入[い]れた。"
  18: "三日目[みっかめ]にヨセフは彼[かれ]らに言[い]った。「こうしなさい。そうすれば生[い]きる。わたしは神[かみ]を恐[おそ]れているからだ。"
  19: "もしあなたがたが穏[おだ]やかな者[もの]なら、兄弟[きょうだい]の一人[ひとり]をこの牢[ろう]につないでおき、あなたがたは行[い]って、自分[じぶん]たちの穀物[こくもつ]の買[か]い物[もの]を持[も]ち帰[かえ]り、"
  20: "末[すえ]の弟[おとうと]をわたしのところへ連[つ]れて来[こ]させなさい。そうすれば、あなたがたの言葉[ことば]は信[しん]じられ、あなたがたは死[し]なずにすむ。」彼[かれ]らはそのとおりにした。"
  21: "彼[かれ]らは互[たが]いに言[い]った。「確[たし]かに、わたしたちは兄弟[きょうだい]のことで罰[ばつ]を受[う]けている。彼[かれ]がわたしたちに哀[あわ]れみを求[もと]めたとき、その心[こころ]の苦[くる]しみを見[み]ながら、聞[き]き入[い]れなかったからだ。だから、この苦[くる]しみがわたしたちに降[ふ]りかかったのだ。」"
  22: "ルベンは彼[かれ]らに答[こた]えて言[い]った。「わたしはあなたがたに『あの子[こ]に悪[わる]いことをするな』と言[い]ったではないか。しかし、あなたがたは聞[き]かなかった。だから、彼[かれ]の血[ち]が求[もと]められているのだ。」"
  23: "彼[かれ]らは、ヨセフが聞[き]き取[と]っているとは知[し]らなかった。彼[かれ]らとの間[あいだ]に通訳[つうやく]がいたからである。"
  24: "ヨセフは彼[かれ]らから離[はな]れて泣[な]いた。そして、また彼[かれ]らのところへ戻[もど]って来[き]て話[はな]し、彼[かれ]らのうちからシメオンを取[と]って、彼[かれ]らの目の前[まえ]で縛[しば]った。"
  25: "ヨセフは、彼[かれ]らの袋[ふくろ]を穀物[こくもつ]で満[み]たし、それぞれの銀[ぎん]をその袋[ふくろ]に返[かえ]し、道中[どうちゅう]の食[た]べ物[もの]を与[あた]えるように命[めい]じた。そして、そのとおりになった。"
  26: "彼[かれ]らは穀物[こくもつ]をロバに載[の]せて、そこを出発[しゅっぱつ]した。"
  27: "一人[ひとり]が、宿[やど]でロバに飼[か]い葉[ば]を与[あた]えようとして袋[ふくろ]を開[あ]けると、自分[じぶん]の銀[ぎん]の包[つつ]みが袋[ふくろ]の口[くち]の上[うえ]にあるのを見[み]た。"
  28: "彼[かれ]は兄弟[きょうだい]たちに言[い]った。「わたしの銀[ぎん]が返[かえ]されている。見[み]てくれ、わたしの袋[ふくろ]の中[なか]に。」彼[かれ]らの心[こころ]は驚[おどろ]き、彼[かれ]らは震[ふる]えながら互[たが]いに言[い]った。「神[かみ]がわたしたちに何[なん]ということをなさったのか。」"
  29: "彼[かれ]らはカナンの地[ち]にいる父[ちち]ヤコブのところへ来[き]て、自分[じぶん]たちに起[お]こったすべてのことを告[つ]げて言[い]った。"
  30: "「あの国[くに]の主人[しゅじん]である人[ひと]は、わたしたちに激[はげ]しく語[かた]り、この国[くに]を探[さぐ]る斥候[せっこう]のように扱[あつか]いました。"
  31: "わたしたちは彼[かれ]に『わたしたちは穏[おだ]やかな者[もの]で、斥候[せっこう]ではありません。"
  32: "わたしたちは父[ちち]の子[こ]である兄弟[きょうだい]十二人[じゅうににん]です。一人[ひとり]はおりません。末[すえ]の弟[おとうと]は今日[きょう]、カナンの地[ち]にいる父[ちち]と一緒[いっしょ]におります』と言[い]いました。"
  33: "すると、あの国[くに]の主人[しゅじん]はわたしたちに言[い]いました。『こうすれば、あなたがたが穏[おだ]やかな者[もの]であることが分[わ]かる。兄弟[きょうだい]の一人[ひとり]をわたしのもとに残[のこ]し、自分[じぶん]たちの家[いえ]の穀物[こくもつ]の買[か]い物[もの]を持[も]って行[い]け。"
  34: "そして、あなたがたの末[すえ]の弟[おとうと]をわたしのところへ連[つ]れて来[こ]い。そうすれば、あなたがたが斥候[せっこう]ではなく、穏[おだ]やかな者[もの]であることが分[わ]かり、わたしはあなたがたの兄弟[きょうだい]を返[かえ]す。あなたがたはこの国[くに]で商[あきな]いをしてよい。』」"
  35: "彼[かれ]らが袋[ふくろ]を空[あ]けると、それぞれの銀[ぎん]の包[つつ]みがその袋[ふくろ]の中[なか]にあった。彼[かれ]らも父[ちち]もその銀[ぎん]の包[つつ]みを見[み]て、恐[おそ]れた。"
  36: "父[ちち]ヤコブは彼[かれ]らに言[い]った。「あなたがたはわたしから子[こ]どもを奪[うば]った。ヨセフはいなくなり、シメオンもいなくなり、今[いま]はベニヤミンまで連[つ]れて行[い]こうとしている。すべてがわたしに降[ふ]りかかっている。」"
  37: "ルベンは父[ちち]に言[い]った。「もしわたしが彼[かれ]をあなたのところへ連[つ]れて帰[かえ]らなかったら、わたしの二人[ふたり]の息子[むすこ]を殺[ころ]してください。彼[かれ]をわたしの手[て]に任[まか]せてください。わたしが彼[かれ]をあなたのところへ連[つ]れ帰[かえ]ります。」"
  38: "しかし、父[ちち]は言[い]った。「わたしの息子[むすこ]はあなたがたと一緒[いっしょ]に下[くだ]って行[い]かない。彼[かれ]の兄弟[きょうだい]は死[し]に、彼[かれ]だけが残[のこ]っている。もしあなたがたの行[ゆ]く道[みち]で彼[かれ]に災[わざわ]いが起[おこ]れば、あなたがたは、わたしの白髪[しらが]を悲[かな]しみとともに陰府[よみ]へ下[くだ]らせることになるのだ。」"

notes:
  1: "πρᾶσις — 売り物 (продажа; слав. «купля», с пояснением «пшеницы»). Ἵνα τί ῥᾳθυμεῖτε — なぜぼんやりしているのか (ῥᾳθυμέω — «медлить, быть беспечным»)."
  2: "ἀκήκοα — 聞いた (perfect). μικρὰ βρώματα — 少しの食物. ἵνα ζῶμεν καὶ μὴ ἀποθάνωμεν — 生きて死なずにすむ. Речь Иакова продолжается из 1-го стиха — кавычки сквозные, как в LXX."
  3: "οἱ δέκα — 十人 (Вениамин остался, 42:4)."
  4: "Μήποτε συμβῇ αὐτῷ μαλακία — 災いが起きないように (μαλακία — «слабость, беда»; слав. «да не когда случится ему зло»). В греч. εἶπεν γάρ («сказал ведь»), прямая речь передана в 「…」."
  5: "οἱ υἱοὶ Ισραηλ — イスラエルの子ら (здесь Израиль = Иаков). μετὰ τῶν ἐρχομένων — 来ていた人々と一緒に."
  6: "ἄρχων τῆς γῆς — エジプトの総督 (букв. «начальник земли»; слав. «князь земли»). ἐπώλει παντὶ τῷ λαῷ — 民すべてに売っていた. προσεκύνησαν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν — 顔を地につけてひれ伏した."
  7: "ἐπέγνω — 気づいた (узнал; ἐπιγινώσκω). ἠλλοτριοῦτο ἀπ᾽ αὐτῶν — 他人のように振る舞った (ἀλλοτριόω — «делать чужим»). σκληρὰ ἐλάλησεν — 激しく語った (σκληρός — «жёсткий»)."
  8: "ἐπέγνωσαν — 見分けた. αὐτοὶ δὲ οὐκ ἐπέγνωσαν αὐτόν — 彼らは見分けなかった (повтор глагола, как в греч.)."
  9: "ἐμνήσθη τῶν ἐνυπνίων — 夢を思い起した. κατάσκοποι — 斥候 (соглядатаи; ср. Евр 11:31). τὰ ἴχνη τῆς χώρας — この国の抜け道 (ἴχνος — «след»; слав. «пути страны»)."
  10: "Οὐχί, κύριε — いいえ、ご主人さま (οὐχί — усиленное «нет»). οἱ παῖδές σου — 僕ども."
  11: "υἱοὶ ἑνὸς ἀνθρώπου — 一人の人の子. εἰρηνικοί — 穏やかな者 (букв. «мирные»; слав. «мирницы», Синод. «люди честные»); то же слово в 19, 31, 33, 34."
  12: "Повтор отказа (ср. 9) сохранён, как в LXX."
  13: "δώδεκα ἀδελφοί — 兄弟十二人. ὁ νεώτερος — 末の弟. ὁ ἕτερος οὐχ ὑπάρχει — もう一人はおりません."
  14: "Τοῦτό ἐστιν ὃ εἴρηκα — わたしが言ったとおりだ."
  15: "νὴ τὴν ὑγίειαν Φαραω — ファラオの命にかけて (клятва здоровьем фараона). οὐ μὴ ἐξέλθητε — 出られない (усиленное отрицание, ἐξέρχομαι)."
  16: "ἀποστείλατε ἐξ ὑμῶν ἕνα — 一人を送れ. ἀπάχθητε — 拘束される (ἀπάγω). εἰ ἀληθεύετε ἢ οὔ — 真実かどうか (ἀληθεύω)."
  17: "ἡμέρας τρεῖς — 三日間 (вин. времени)."
  18: "τοῦτο ποιήσατε καὶ ζήσεσθε — こうしなさい、そうすれば生きる. τὸν θεὸν γὰρ ἐγὼ φοβοῦμαι — わたしは神を恐れているからだ (в греч. вставка в тире; порядок сохранён, без сглаживания)."
  19: "εἷς κατασχεθήτω — 一人をつないでおけ (κατέχω). ἀπαγάγετε τὸν ἀγορασμὸν τῆς σιτοδοσίας ὑμῶν — 穀物の買い物を持ち帰れ (ἀγορασμός — «покупка», σιτοδοσία — «снабжение хлебом»)."
  20: "πιστευθήσονται τὰ ῥήματα ὑμῶν — 言葉は信じられる. ἐποίησαν δὲ οὕτως — そのとおりにした."
  21: "ἐν ἁμαρτίᾳ γάρ ἐσμεν περὶ τοῦ ἀδελφοῦ — 兄弟のことで罰を受けている (букв. «мы в грехе»). ὑπερείδομεν — 見ながら (ὑπεροράω — «не замечать, презирать»). κατεδέετο ἡμῶν — 哀れみを求めた (καταδέομαι). οὐκ εἰσηκούσαμεν — 聞き入れなかった."
  22: "Μὴ ἀδικήσητε τὸ παιδάριον — あの子に悪いことをするな (παιδάριον). τὸ αἷμα αὐτοῦ ἐκζητεῖται — 彼の血が求められている (ἐκζητέω — «взыскивать кровь», ср. Быт 9:5)."
  23: "ἑρμηνευτής — 通訳. ἀνὰ μέσον αὐτῶν ἦν — 彼らの間にいた. Иосиф понимал, но говорил через переводчика."
  24: "ἀποστραφεὶς ἀπ᾽ αὐτῶν ἔκλαυσεν — 離れて泣いた. ἔδησεν αὐτὸν ἐναντίον αὐτῶν — 彼らの目の前で縛った (δὲ — «и»)."
  25: "ἐνετείλατο — 命じた (ἐντέλλομαι). ἀγγεῖα — 袋 (сосуды). ἀποδοῦναι τὸ ἀργύριον ἑκάστου εἰς τὸν σάκκον αὐτοῦ — それぞれの銀を袋に返す. ἐπισιτισμὸν εἰς τὴν ὁδόν — 道中の食べ物 (провизия)."
  26: "ἐπιθέντες τὸν σῖτον ἐπὶ τοὺς ὄνους — 穀物をロバに載せて. ἀπῆλθον ἐκεῖθεν — そこを出発した."
  27: "λύσας τὸν μάρσιππον — 袋を開けた (букв. «развязал»). χορτάσματα — 飼い葉 (корм). ὁ δεσμὸς τοῦ ἀργυρίου — 銀の包み (δεσμός — «связка»)."
  28: "Ἀπεδόθη μοι τὸ ἀργύριον — 銀が返されている. ἐξέστη ἡ καρδία αὐτῶν — 心は驚いた (ἐξίστημι — «изумляться»). ἐταράχθησαν — 震えた (смутились, ταράσσω). τί τοῦτο ἐποίησεν ὁ θεὸς ἡμῖν — 神がわたしたちに何ということをなさったのか."
  29: "ἀπήγγειλαν αὐτῷ πάντα τὰ συμβάντα αὐτοῖς — 自分たちに起こったすべてのことを告げた."
  30: "Λελάληκεν… σκληρά — 激しく語った (perfect). ἔθετο ἡμᾶς ἐν φυλακῇ ὡς κατασκοπεύοντας τὴν γῆν — 斥候のように扱った (κατασκοπεύω)."
  31: "εἴπαμεν — 言った. εἰρηνικοί ἐσμεν — 穏やかな者 (см. 11)."
  32: "ὁ εἷς οὐχ ὑπάρχει — 一人はおりません. ὁ μικρότερος — 末の弟."
  33: "Ἐν τούτῳ γνώσομαι — こうすれば分かる. ἀδελφὸν ἕνα ἄφετε ὧδε μετ᾽ ἐμοῦ — 一人をわたしのもとに残せ."
  34: "ἀποδώσω ὑμῖν — 返す. τῇ γῇ ἐμπορεύεσθε — この国で商いをしてよい (ἐμπορεύομαι — «торговать»)."
  35: "κατακενοῦν τοὺς σάκκους — 袋を空ける (κατακενόω). ἐφοβήθησαν — 恐れた."
  36: "Ἐμὲ ἠτεκνώσατε — わたしから子どもたちを奪った (τεκνόω — «лишать детей»). ἐπ᾽ ἐμὲ ἐγένετο πάντα ταῦτα — すべてがわたしに降りかかっている (слав. «на мя быша сия вся»)."
  37: "ἀπόκτεινον — 殺せ (императив). δὸς αὐτὸν εἰς τὴν χεῖρά μου — わたしの手に任せよ. ἀνάξω αὐτὸν πρὸς σέ — 連れ帰る (ἀνάγω)."
  38: "οὐ καταβήσεται — 下って行かない. αὐτὸς μόνος καταλέλειπται — 彼だけが残っている (perfect καταλείπω). μαλακισθῆναι — 災いが起きる (μαλακίζομαι). κατάξετέ μου τὸ γῆρας μετὰ λύπης εἰς ᾅδου — 白髪を悲しみとともに陰府へ下らせる (γῆρας — «старость»; ᾅδης — 陰府, как везде в корпусе)."
