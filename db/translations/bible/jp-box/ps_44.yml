verses:
  0: "指揮者[しきしゃ]に。変[か]えられる者[もの]について。コラの子[こ]らのための教[おし]えの歌[うた]。愛[あい]する者[もの]についての歌[うた]。"
  1: "わたしの心[こころ]は良[よ]い言葉[ことば]をあふれ出[だ]させる。わたしは自分[じぶん]の歌[うた]を王[おう]に語[かた]る。わたしの舌[した]は、速[はや]く書[か]く者[もの]の筆[ふで]のようだ。"
  2: "あなたは人[ひと]の子[こ]らよりも美[うつく]しい。あなたの唇[くちびる]には{恵[めぐ]み|恩寵[おんちょう]}があふれている。それゆえ、神[かみ]はあなたをとこしえに祝福[しゅくふく]された。"
  3: "力[ちから]ある者[もの]よ、あなたの剣[つるぎ]を腰[こし]に帯[お]びよ。あなたの輝[かがや]きと美[うつく]しさとをもって。"
  4: "弓[ゆみ]を引[ひ]き、進[すす]み、真理[しんり]と柔和[にゅうわ]と義[ぎ]のために王[おう]として治[おさ]めよ。あなたの右[みぎ]の手[て]が、驚[おどろ]くべきことをあなたに示[しめ]す。"
  5: "力[ちから]ある者[もの]よ、あなたの矢[や]は研[と]ぎ澄[す]まされている。諸国[しょこく]の民[たみ]はあなたの足[あし]もとに倒[たお]れる。矢[や]は王[おう]の敵[てき]の心[こころ]に突[つ]き刺[さ]さる。"
  6: "神[かみ]よ、あなたの御座[みくら]は世々[よよ]に限[かぎ]りなく続[つづ]く。正[ただ]しさの杖[つえ]は、あなたの国[くに]の杖[つえ]である。"
  7: "あなたは義[ぎ]を愛[あい]し、不法[ふほう]を憎[にく]んだ。それゆえ、神[かみ]、あなたの神[かみ]は、あなたの仲間[なかま]たちにまさって、あなたに喜[よろこ]びの油[あぶら]を注[そそ]がれた。"
  8: "あなたの衣[ころも]は、没薬[もつやく]、スタクテー⟨ミルラ（没薬[もつやく]）の一種[いっしゅ]で、樹[き]からしたたり落[お]ちる香[こう]の樹脂[じゅし]。⟩、桂皮[けいひ]の香[かおり]を放[はな]つ。象牙[ぞうげ]の館[やかた]から、あなたは喜[よろこ]びに満[み]たされる。"
  9: "王[おう]たちの娘[むすめ]たちはあなたの栄[さか]えの中[なか]にあり、王妃[おうひ]はあなたの右[みぎ]に立[た]って、金[きん]を織[お]り込[こ]んだ衣[ころも]をまとい、色[いろ]とりどりに飾[かざ]られている。"
  10: "娘[むすめ]よ、聞[き]け、見[み]よ、耳[みみ]を傾[かたむ]けよ。あなたの民[たみ]と、あなたの父[ちち]の家[いえ]とを忘[わす]れよ。"
  11: "王[おう]はあなたの美[うつく]しさを慕[した]っておられる。この方[かた]こそ、あなたの主[しゅ]である。"
  12: "ティルスの娘[むすめ]たちは贈[おく]り物[もの]を持[も]ってあなたにひれ伏[ふ]し、民[たみ]の富[とみ]ある者[もの]たちがあなたの顔[かお]を伏[ふ]して願[ねが]い求[もと]める。"
  13: "王[おう]の娘[むすめ]の栄[さか]えはすべて内[うち]にあり、金[きん]の房飾[ふさかざ]りの衣[ころも]をまとっている。"
  14: "娘[むすめ]たちは彼女[かのじょ]の後[あと]に従[したが]って王[おう]のもとへ連[つ]れて行[ゆ]かれ、あなたのそば近[ちか]くにいる者[もの]たちもあなたのもとへ連[つ]れて行[ゆ]かれる。"
  15: "彼女[かのじょ]たちは喜[よろこ]びと歓喜[かんき]のうちに連[つ]れて行[ゆ]かれ、王[おう]の宮殿[きゅうでん]へと入[はい]って行[ゆ]く。"
  16: "あなたの父[ちち]たちに代[か]わって、あなたには子[こ]らが生[う]まれる。あなたは彼[かれ]らを全[ぜん]地[ち]の支配者[しはいしゃ]とする。"
  17: "人[ひと]々[びと]はあなたの名[な]を代々[だいだい]に覚[おぼ]えている。それゆえ、もろもろの民[たみ]はあなたを世々[よよ]に限[かぎ]りなくほめたたえる。"

notes:
  0: "Εἰς τὸ τέλος, ὑπὲρ τῶν ἀλλοιωθησομένων· τοῖς υἱοῖς Κορε εἰς σύνεσιν· ᾠδὴ ὑπὲρ τοῦ ἀγαπητοῦ — 指揮者に。変えられる者について。コラの子らのための教えの歌。愛する者についての歌 (ὑπὲρ τῶν ἀλλοιωθησομένων — «об изменяемых»; в церковнослав. «о изменяемых»; по евр. это название напева, в переводе оставлено буквально, без домысла. εἰς σύνεσιν — «в разум». ᾠδὴ ὑπὲρ τοῦ ἀγαπητοῦ — «песнь о возлюбленнем»; в евр. «песнь любви», поэтому 愛する者についての歌, а не «о Возлюбленном» с большой буквы: в надписании нет мессианского указания. Надписание — стих 0.)"
  1: "Ἐξηρεύξατο ἡ καρδία μου λόγον ἀγαθόν — わたしの心は良い言葉をあふれ出させる (ἐξερεύγομαι — «изрыгать, изливать», образ потока). λέγω ἐγὼ τὰ ἔργα μου τῷ βασιλεῖ — わたしは自分の歌を王に語る (ἔργα — «дела», здесь «произведение», т. е. песнь). ἡ γλῶσσά μου κάλαμος γραμματέως ὀξυγράφου — わたしの舌は、速く書く者の筆のようだ (κάλαμος — «трость, перо»; ὀξύγραφος — «скорописец»)."
  2: "ὡραῖος κάλλει παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων — あなたは人の子らよりも美しい (ὡραῖος κάλλει — «прекрасный красотою», гебраизм). ἐξεχύθη χάρις ἐν χείλεσίν σου — あなたの唇には恵みがあふれている (χάρις — 恵み; ἐκχέω — «изливать»). εὐλόγησέν σε ὁ θεὸς εἰς τὸν αἰῶνα — 神はあなたをとこしえに祝福された."
  3: "περίζωσαι τὴν ῥομφαίαν σου ἐπὶ τὸν μηρόν σου, δυνατέ — 力ある者よ、あなたの剣を腰に帯びよ (περιζώννυμι — «опоясывать»; μηρός — «бедро»). τῇ ὡραιότητί σου καὶ τῷ κάλλει σου — あなたの輝きと美しさとをもって (предлог без глагола, относится к следующему стиху, как в греч.)."
  4: "καὶ ἔντεινον καὶ κατευοδοῦ καὶ βασίλευε — 弓を引き、進み、王として治めよ (ἐντεινω — «натягивать лук», ср. ст. 5; κατευοδόω — «успешно идти»). ἕνεκεν ἀληθείας καὶ πραύτητος καὶ δικαιοσύνης — 真理と柔和と義のために (πραΰτης — 柔和). ὁδηγήσει σε θαυμαστῶς ἡ δεξιά σου — あなたの右の手が、驚くべきことをあなたに示す (ὁδηγέω — «вести»; θαυμαστῶς — «дивно»)."
  5: "τὰ βέλη σου ἠκονημένα, δυνατέ — 力ある者よ、あなたの矢は研ぎ澄まされている (βέλος — 矢; ἀκονάω — «точить»). λαοὶ ὑποκάτω σου πεσοῦνται — 諸国の民はあなたの足もとに倒れる. ἐν καρδίᾳ τῶν ἐχθρῶν τοῦ βασιλέως — 矢は王の敵の心に突き刺さる (дополнено подлежащим 矢 для ясности, в греч. продолжение предыдущей клаузы)."
  6: "ὁ θρόνος σου, ὁ θεός, εἰς τὸν αἰῶνα τοῦ αἰῶνος — 神よ、あなたの御座は世々に限りなく続く (звательный ὁ θεός обращён к Сыну, так в Евр 1:8; поэтому 神よ, а не «престол Твой, Боже» как обращение к Отцу). ῥάβδος εὐθύτητος ἡ ῥάβδος τῆς βασιλείας σου — 正しさの杖は、あなたの国の杖である (εὐθύτης — «прямота, правота»). Формулировка выровнена с evr_01:8."
  7: "ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν — あなたは義を愛し、不法を憎んだ. ἔχρισέν σε ὁ θεὸς ὁ θεός σου ἔλαιον ἀγαλλιάσεως — 神、あなたの神は…喜びの油を注がれた (χρίω — «помазывать»; ἔλαιον ἀγαλλιάσεως — «елей радости»). παρὰ τοὺς μετόχους σου — あなたの仲間たちにまさって (μέτοχοι — «участники, соучастники»). Выровнено с evr_01:9."
  8: "σμύρνα καὶ στακτὴ καὶ κασία ἀπὸ τῶν ἱματίων σου — あなたの衣は、没薬、スタクテー、桂皮の香を放つ (σμύρνα — 没薬; στακτή — «стакти», жидкая мирра, отсюда сноска; κασία — 桂皮). ἀπὸ βάρεων ἐλεφαντίνων — 象牙の館から (βάρις — «чертог, башня»; ἐλεφάντινος — «из слоновой кости»). ἐξ ὧν ηὔφρανάν σε — あなたは喜びに満たされる (εὐφραίνω — «веселить»)."
  9: "θυγατέρες βασιλέων ἐν τῇ τιμῇ σου — 王たちの娘たちはあなたの栄えの中にあり (τιμή — «честь, слава»). παρέστη ἡ βασίλισσα ἐκ δεξιῶν σου — 王妃はあなたの右に立って (βασίλισσα — 王妃; παρίστημι — «предстоять»). ἐν ἱματισμῷ διαχρύσῳ περιβεβλημένη πεποικιλμένη — 金を織り込んだ衣をまとい、色とりどりに飾られている (διάχρυσος — «златотканый»; ποικίλλω — «расцвечивать»)."
  10: "ἄκουσον, θύγατερ, καὶ ἰδὲ καὶ κλῖνον τὸ οὖς σου — 娘よ、聞け、見よ、耳を傾けよ (три императива, как в греч.). ἐπιλάθου τοῦ λαοῦ σου καὶ τοῦ οἴκου τοῦ πατρός σου — あなたの民と、あなたの父の家とを忘れよ (ἐπιλανθάνομαι — «забывать»; образ отречения от прежнего ради брака)."
  11: "ὅτι ἐπεθύμησεν ὁ βασιλεὺς τοῦ κάλλους σου — 王はあなたの美しさを慕っておられる (ἐπιθυμέω — «возжелать»). ὅτι αὐτός ἐστιν ὁ κύριός σου — この方こそ、あなたの主である (κύριος — 主; в церковном чтении относится к жениху-Христу)."
  12: "καὶ προσκυνήσουσιν αὐτῷ θυγατέρες Τύρου ἐν δώροις — ティルスの娘たちは贈り物を持ってあなたにひれ伏し (προσκυνέω — «поклоняться»; Τύρος — ティルス; αὐτῷ — жениху, поэтому あなたに). τὸ πρόσωπόν σου λιτανεύσουσιν οἱ πλούσιοι τοῦ λαοῦ — 民の富ある者たちがあなたの顔を伏して願い求める (λιτανεύω — «умолять»; букв. «будут умолять лицо твоё»)."
  13: "πᾶσα ἡ δόξα αὐτῆς θυγατρὸς βασιλέως ἔσωθεν — 王の娘の栄えはすべて内にあり (ἔσωθεν — «внутри»; смысл — внутренняя красота, ср. jp-joc «光榮は皆内にあり»; двусмысленность не разрешена). ἐν κροσσωτοῖς χρυσοῖς περιβεβλημένη πεποικιλμένη — 金の房飾りの衣をまとっている (κρόσσωμα — «бахрома, кисть»)."
  14: "ἀπενεχθήσονται τῷ βασιλεῖ παρθένοι ὀπίσω αὐτῆς — 娘たちは彼女の後に従って王のもとへ連れて行かれ (ἀποφέρω — «уводить»; παρθένοι — «девы»). αἱ πλησίον αὐτῆς ἀπενεχθήσονταί σοι — あなたのそば近くにいる者たちもあなたのもとへ連れて行かれる (πλησίον — «близкие»)."
  15: "ἀπενεχθήσονται ἐν εὐφροσύνῃ καὶ ἀγαλλιάσει — 彼女たちは喜びと歓喜のうちに連れて行かれ (εὐφροσύνη / ἀγαλλίασις — два слова радости, оба сохранены). ἀχθήσονται εἰς ναὸν βασιλέως — 王の宮殿へと入って行く (ναός здесь — «чертог, дворец», не храм)."
  16: "ἀντὶ τῶν πατέρων σου ἐγενήθησάν σοι υἱοί — あなたの父たちに代わって、あなたには子らが生まれる (ἀντί — «вместо»). καταστήσεις αὐτοὺς ἄρχοντας ἐπὶ πᾶσαν τὴν γῆν — あなたは彼らを全地の支配者とする (καθίστημι — «поставлять»; ἄρχων — 支配者)."
  17: "μνησθήσονται τοῦ ὀνόματός σου ἐν πάσῃ γενεᾷ καὶ γενεᾷ — 人々はあなたの名を代々に覚えている (μιμνῄσκομαι — «помнить, упоминать»; ср. jp-joc «我爾の名を萬世に誌さしめん» — там причинное понимание; здесь оставлено среднее «будут вспоминать»). λαοὶ ἐξομολογήσονταί σοι εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — もろもろの民はあなたを世々に限りなくほめたたえる (ἐξομολογέομαι — «славить»)."
