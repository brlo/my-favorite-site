# jp-box, Товит, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: молитва Товита (1–6, первое лицо); с 3:7 повествование переходит
# в третье лицо — Сарра и её молитва у окна (7–15); обе молитвы услышаны
# и послан Рафаил (16–17).
# Речь: молитва Товита — 「…」 (2–6), укоризны служанок — 「…」 (8–9), слова Сарры —
# 「…」 (10), её молитва — 「…」 (11–15). Вложенной речи нет. Красного нет.
# Нумерация по gr: 17 стихов; номера совпадают с csl.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 施し, 悪霊, よみ, 捕囚 уже в корпусе.
# Имена — транслитерация греческого (LXX): ラグエル, サラ, エクバタナ, アスモダイ,
# ラファエル.

tr_code: jp-box
book: tov
chapter: 3
draft: true

verses:
  1: "わたしは悲[かな]しんで泣[な]き、苦[くる]しみとともに祈[いの]って言[い]った。"
  2: "「主[しゅ]よ、あなたは正[ただ]しく、あなたのすべての業[わざ]、あなたのすべての道[みち]はあわれみと真理[しんり]である。あなたは真実[しんじつ]で正[ただ]しい裁[さば]きを、とこしえに裁[さば]かれる。"
  3: "わたしを覚[おぼ]え、わたしに目[め]を留[と]めてください。わたしの罪[つみ]と、わたしが知[し]らずに犯[おか]した罪[つみ]、また父[ちち]たちがあなたの前[まえ]で犯[おか]した罪[つみ]を、わたしに報[むく]い返[かえ]さないでください。"
  4: "彼[かれ]らはあなたの戒[いまし]めに聞[き]き従[したが]わなかったからである。あなたはわたしたちを略奪[りゃくだつ]と捕囚[ほしゅう]と死[し]に、また、わたしたちが散[ち]らされたすべての異邦[いほう]の民[たみ]に、そしりの的[まと]とされた。"
  5: "今[いま]、あなたの多[おお]くの裁[さば]きは真実[しんじつ]であって、わたしの罪[つみ]と父[ちち]たちの罪[つみ]について、わたしを扱[あつか]われる。わたしたちはあなたの戒[いまし]めを行[おこな]わず、あなたの前[まえ]を真理[しんり]によって歩[あゆ]まなかったからである。"
  6: "今[いま]、あなたの前[まえ]に喜[よろこ]ばしいとおりに、わたしを扱[あつか]ってください。わたしの霊[れい]を取[と]り去[さ]るよう命[めい]じ、わたしが解[と]き放[はな]たれて土[つち]となるようにしてください。死[し]ぬことが生[い]きることに勝[まさ]っているからである。わたしは偽[いつわ]りのそしりを聞[き]き、わたしのうちには大[おお]きな悲[かな]しみがある。わたしをこの束縛[そくばく]から解[と]き放[はな]ち、ただちに永遠[えいえん]の場所[ばしょ]へ行[い]かせてください。あなたの顔[かお]をわたしからそむけないでください。」"
  7: "その日[ひ]、メディアのエクバタナで、ラグエルの娘[むすめ]サラにも、父[ちち]の女[おんな]奴隷[どれい]たちからそしりを受[う]けることが起[おこ]った。"
  8: "彼女[かのじょ]は七人[ななにん]の男[おとこ]たちに嫁[とつ]がされたが、邪[よこしま]な悪霊[あくりょう]アスモダイが、彼[かれ]らが彼女[かのじょ]と女[おんな]として交[まじ]わる前[まえ]に、彼[かれ]らを殺[ころ]してしまったからである。女[おんな]たちは彼女[かのじょ]に言[い]った。「あなたは自分[じぶん]の夫[おっと]たちを絞[し]め殺[ころ]しているのが分[わ]からないのか。すでに七人[ななにん]も持[も]ちながら、そのうちのだれの妻[つま]とも呼[よ]ばれなかった。"
  9: "なぜわたしたちを打[う]つのか。彼[かれ]らが死[し]んだのなら、彼[かれ]らとともに去[さ]れ。わたしたちがあなたの息子[むすこ]や娘[むすめ]を永遠[えいえん]に見[み]ることがないように。」"
  10: "これを聞[き]いて、彼女[かのじょ]はひどく悲[かな]しみ、首[くび]を吊[つ]ろうとした。そして、彼女[かのじょ]は言[い]った。「わたしは父[ちち]のただ一人[ひとり]の娘[むすめ]である。もしこれをすれば、父[ちち]にとって恥[はじ]となり、わたしは父[ちち]の老[お]いを悲[かな]しみとともによみに下[くだ]すことになる。」"
  11: "彼女[かのじょ]は窓[まど]のそばで祈[いの]って言[い]った。「わたしの主[しゅ]なる神[かみ]よ、あなたはほむべき方[かた]であり、あなたの聖[せい]なる御名[みな]は、とこしえにほむべき尊[とうと]い御名[みな]である。あなたのすべての業[わざ]があなたをとこしえにほめたたえますように。"
  12: "今[いま]、主[しゅ]よ、わたしの目[め]とわたしの顔[かお]をあなたに差[さ]し上[あ]げた。"
  13: "どうか、わたしをこの地[ち]から解[と]き放[はな]ち、もはやそしりを聞[き]かせないでください。"
  14: "主[しゅ]よ、あなたは、わたしが男[おとこ]とのすべての罪[つみ]から清[きよ]い者[もの]であることを知[し]っておられる。"
  15: "わたしは捕囚[ほしゅう]の地[ち]で、自分[じぶん]の名[な]も父[ちち]の名[な]も汚[けが]さなかった。わたしは父[ちち]のただ一人[ひとり]の娘[むすめ]であり、父[ちち]には、父[ちち]を継[つ]ぐ子[こ]もなく、近[ちか]い兄弟[きょうだい]もなく、わたしが自分[じぶん]を保[たも]ってその妻[つま]となるべき者[もの]もいない。わたしはすでに七人[ななにん]を失[うしな]った。どうしてわたしは生[い]きていられるのか。もしあなたがわたしを殺[ころ]すことをよしとされないなら、わたしに目[め]を留[と]めてあわれみ、もはやそしりを聞[き]かせないように命[めい]じてください。」"
  16: "主[しゅ]は二人[ふたり]の祈[いの]りを、大[おお]いなるラファエルの栄光[えいこう]の前[まえ]で聞[き]き入[い]れられた。"
  17: "そして、その二人[ふたり]を癒[いや]すために遣[つか]わされた。すなわち、トビトの白[しろ]い膜[まく]をはぎ取[と]り、ラグエルの娘[むすめ]サラをトビトの子[こ]トビアの妻[つま]として与[あた]え、邪[よこしま]な悪霊[あくりょう]アスモダイを縛[しば]るためである。トビアが彼女[かのじょ]を継[つ]ぐことが定[さだ]まっているからである。ちょうどそのとき、トビトは帰[かえ]って自分[じぶん]の家[いえ]に入[はい]り、ラグエルの娘[むすめ]サラは自分[じぶん]の階上[かいじょう]の部屋[へや]から下[お]りて来[き]た。"

notes:
  1: "λυπηθείς — «опечалившись» (λυπέω). προσευξάμην μετ᾽ ὀδύνης — «помолился с болью» (ὀδύνη; слав. «с болезнию»). λέγων вводит молитву, которая идёт в 3:2–6; по-японски речь открывается в 3:2."
  2: "Δίκαιος εἶ, κύριε — «праведен Ты, Господи». αἱ ὁδοί σου ἐλεημοσύναι καὶ ἀλήθεια — «пути Твои — милость и истина»: ἐλεημοσύνη здесь «милость» (слав. «милость»), а не «милостыня», поэтому あわれみ. κρίσιν ἀληθινὴν καὶ δικαίαν — «суд истинный и праведный»; слав. «суд истинен и праведен»."
  3: "μνήσθητί μου καὶ ἐπίβλεψον ἐπ᾽ ἐμέ — «вспомни меня и призри на меня» (ἐπιβλέπω). μή με ἐκδικήσῃς — «не взыщи с меня» (ἐκδικέω — мстить, наказывать). ἀγνοήματα — «неведения», грехи по незнанию (ἀγνόημα; слав. «неведения»). τῶν πατέρων μου, ἃ ἥμαρτον — «отцов моих, которыми они согрешили»."
  4: "παρήκουσαν τῶν ἐντολῶν σου — «они не послушали заповедей Твоих» (παρακούω с родительным). ἔδωκας ἡμᾶς εἰς διαρπαγὴν καὶ αἰχμαλωσίαν καὶ θάνατον — «предал нас на расхищение, плен и смерть». παραβολὴν ὀνειδισμοῦ — «притчу поношения», т.е. посмешище (παραβολή). ἐσκορπίσμεθα — «мы рассеяны» (σκορπίζω)."
  5: "αἱ κρίσεις σού εἰσιν ἀληθιναί — «суды Твои истинны» (κρίσις). ἐξ ἐμοῦ ποιῆσαι περὶ τῶν ἁμαρτιῶν μου — «сделать со мною по грехам моим» (слав. «творите со мною»). οὐκ ἐποιήσαμεν τὰς ἐντολάς σου — «мы не исполнили заповедей Твоих» (ποιέω — исполнять)."
  6: "κατὰ τὸ ἀρεστὸν ἐνώπιόν σου — «по угодному пред Тобою» (ἀρεστός). ἐπίταξον ἀναλαβεῖν τὸ πνεῦμά μου — «повели взять дух мой» (ἐπιτάσσω, ἀναλαμβάνω). ὅπως ἀπολυθῶ καὶ γένωμαι γῆ — «чтобы я разрешился и стал землёю». λυσιτελεῖ μοι ἀποθανεῖν ἢ ζῆν — «лучше мне умереть, нежели жить» (λυσιτελέω). τῆς ἀνάγκης — «от нужды, принуждения», отсюда 束縛. εἰς τὸν αἰώνιον τόπον — «в вечное место»."
  7: "Ἐν τῇ αὐτῇ ἡμέρᾳ — «в тот же день»: с этого стиха повествование переходит в третье лицо. συνέβη τῇ θυγατρὶ Ραγουηλ Σαρρα — «случилось с дочерью Рагуила Саррой» (συμβαίνω). ἐν Ἐκβατάνοις τῆς Μηδίας — в Екбатанах Мидийских. ὀνειδισθῆναι ὑπὸ παιδισκῶν — «быть поносимой служанками» (ὀνειδίζω, παιδίσκη); причину объясняет ὅτι в 3:8."
  8: "ἦν δεδομένη ἀνδρὰσιν ἑπτά — «была отдана семи мужьям» (перфект пассива δίδωμι). Ασμοδαυς τὸ πονηρὸν δαιμόνιον — Асмодей, «лукавый демон» (邪な悪霊アスモダイ; слав. «асмодей лукавый демон»). ἀπέκτεινεν αὐτοὺς πρὶν ἢ γενέσθαι αὐτοὺς μετ᾽ αὐτῆς ὡς ἐν γυναιξίν — «убивал их прежде, нежели они были с нею, как с женами». ἑνὸς αὐτῶν οὐκ ὠνάσθης — «ни одним из них не воспользовалась» (ὀνίνημι); слав. «ни единаго их нареклася еси» (ὠνομάσθης) — это чтение и взято в текст; передано «だれの妻とも呼ばれなかった» (смысл: не стала ничьей женой)."
  9: "τί ἡμᾶς μαστιγοῖς — «что ты бьёшь нас» (μαστιγόω; слав. «что нас биеши»). εἰ ἀπέθαναν, βάδιζε μετ᾽ αὐτῶν — «если они умерли, иди за ними»: грубая насмешка. μὴ ἴδοιμέν σου υἱὸν ἢ θυγατέρα — оптатив «да не увидим мы сына или дочери твоей»."
  10: "ἐλυπήθη σφόδρα ὥστε ἀπάγξασθαι — «опечалилась весьма так, что [решила] удавиться» (ἀπάγχομαι). Μία μέν εἰμι τῷ πατρί μου — «я одна у отца моего» (слав. «едина убо есмь отцу моему»). ὄνειδος — поношение, позор. τὸ γῆρας αὐτοῦ κατάξω μετ᾽ ὀδύνης εἰς ᾅδου — «старость его сведу с печалью в ад» (κατάγω; ᾅδης — よみ, как в Псалтири)."
  11: "ἐδεήθη πρὸς τῇ θυρίδι — «помолилась у оконца» (δέομαι; θυρίς, слав. «при оконцы»). Εὐλογητὸς εἶ — «благословен Ты». ἔντιμον — «честное, досточтимое». εὐλογήσαισάν σε πάντα τὰ ἔργα σου — оптатив «да благословят Тебя все дела Твои»."
  12: "τοὺς ὀφθαλμούς μου καὶ τὸ πρόσωπόν μου εἰς σὲ δέδωκα — «очи мои и лицо моё к Тебе я отдала» (перфект δίδωμι); слав. «очи мои и лице мое ко тебе дах»."
  13: "εἰπὸν ἀπολῦσαί με ἀπὸ τῆς γῆς — «скажи отпустить меня от земли» (εἰπόν = εἰπέ, императив; слав. «рех» — первое лицо, иное понимание). μὴ ἀκοῦσαί με μηκέτι ὀνειδισμόν — «чтобы не слышать мне более поношения». Передано как просьба."
  14: "σὺ γινώσκεις ὅτι καθαρά εἰμι ἀπὸ πάσης ἁμαρτίας ἀνδρὸς — «Ты знаешь, что я чиста от всякого греха с мужем» (ἁμαρτία ἀνδρός; слав. «греха мужня»). Стих продолжает молитву, начатую в 3:11."
  15: "οὐκ ἐμόλυνα τὸ ὄνομά μου — «не осквернила имени моего» (μολύνω). μονογενής — «единородная», единственная дочь (слав. «единородна»). οὐδὲ ἀδελφὸς ἐγγὺς οὐδὲ ὑπάρχων αὐτῷ υἱός, ἵνα συντηρήσω ἐμαυτὴν αὐτῷ γυναῖκα — «ни брата близкого, ни сына у него, чтобы я сохранила себя ему в жену» (право левирата). ἤδη ἀπώλοντό μοι ἑπτά — «уже погибли у меня семеро». εἰ μὴ δοκεῖ σοι ἀποκτεῖναί με — «если не угодно Тебе убить меня»."
  16: "εἰσηκούσθη ἡ προσευχὴ ἀμφοτέρων — «услышана была молитва обоих» (εἰσακούω, пассив). ἐνώπιον τῆς δόξης τοῦ μεγάλου Ραφαηλ — «пред славою великого Рафаила»: так в LXX (Ватиканский кодекс) и в слав.; в ru «великого Бога» — разночтение, а не ошибка LXX. Слав. добавляет подлежащее «услыша Господь» (в LXX пассив), оно передано в тексте."
  17: "ἀπεστάλη ἰάσασθαι τοὺς δύο — «послан был исцелить обоих» (ἀποστέλλω, ἰάομαι). λεπίσαι τὰ λευκώματα — «соскоблить бельма» (λεπίζω — снимать кору, скоблить; 白い膜). δοῦναι Τωβια τῷ υἱῷ Τωβιτ γυναῖκα — «дать [её] в жену Товии, сыну Товита». δῆσαι Ασμοδαυν τὸ πονηρὸν δαιμόνιον — «связать Асмодея, лукавого демона» (δέω). ἐπιβάλλει κληρονομῆσαι αὐτήν — «Товии подобает наследовать её» (ἐπιβάλλω). κατέβη ἐκ τοῦ ὑπερῴου αὐτῆς — «сошла с горницы своей» (ὑπερῷον)."
