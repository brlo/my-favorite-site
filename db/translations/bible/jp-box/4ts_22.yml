# jp-box, 4-я Царств, глава 22. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник.
# Глава 22: Иосия (1–2), ремонт храма и находка книги закона (3–11),
# посольство к пророчице Хулде (12–20).
# Речь — 常体; слова людей и Бога — 「…」.
# Особенности паритета: 3 — «седьмой месяц» по csl (LXX — восьмой, в notes);
# 8 — «(Божия)» в csl — скобочная вставка, не переведена; 10 — «книгу закона»
# добавлено в csl; 20 — «сего ради» в csl (LXX οὐχ οὕτως), конец стиха
# «и принесли царю ответ» есть в LXX, но в csl перенесён в 23:1.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 神殿, 契約の箱, 預言者, 祭壇 уже в корпусе.
# jp-ni не использовался.

