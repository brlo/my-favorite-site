verses:
  1: "ヨシヤは八歳[さい]で王[おう]となり、エルサレムで三十一年[さんじゅういちねん]治[おさ]めた。母[はは]の名[な]はエディダといい、バスロトのエデヤの娘[むすめ]であった。"
  2: "彼は主[しゅ]の目[め]に正[ただ]しいことを行[おこな]い、父[ちち]ダビデのすべての道[みち]を歩[あゆ]み、右[みぎ]にも左[ひだり]にもそれなかった。"
  3: "ヨシヤ王[おう]の治世[ちせい]の第十八年目[だいじゅうはちねんめ]、第七[だいしち]の月[つき]に、王は主[しゅ]の家[いえ]の書記[しょき]シャファン、すなわちエセリヤの子[こ]、メショラムの孫[まご]を遣[つか]わして言[い]った。"
  4: "「大祭司[だいさいし]ヒルキヤのもとへ上[のぼ]って行[い]き、主[しゅ]の家[いえ]に持[も]ち込[こ]まれた銀[ぎん]を封印[ふういん]せよ。それは門[もん]を守[まも]る者[もの]たちが民[たみ]から集[あつ]めたものである。"
  5: "それを、主[しゅ]の家[いえ]に任[まか]された工事[こうじ]をする者[もの]たちの手[て]に渡[わた]せ。それは主の家で働[はたら]く者[もの]たちに渡[わた]され、家の破損[はそん]した所[ところ]の補強[ほきょう]に当[あ]てられた。"
  6: "すなわち、大工[だいく]と建築[けんちく]する者[もの]と壁[かべ]を築[きず]く者[もの]に、家の破損[はそん]を直[なお]すための木材[もくざい]と切[き]り出[だ]した石[いし]を買[か]わせるためであった。"
  7: "ただし、彼らに渡[わた]された銀[ぎん]について、彼らから会計[かいけい]を求[もと]めてはならない。彼らは誠実[せいじつ]に働[はたら]いているからである。」"
  8: "大祭司[だいさいし]ヒルキヤは書記[しょき]シャファンに言[い]った。「主[しゅ]の家[いえ]で律法[りっぽう]の書[しょ]を見[み]つけた。」ヒルキヤはその書をシャファンに渡[わた]し、シャファンはそれを読[よ]み上[あ]げた。"
  9: "書記[しょき]シャファンは王[おう]のもとへ行[い]き、王に報告[ほうこく]して言[い]った。「しもべたちは主[しゅ]の家[いえ]で見[み]つかった銀[ぎん]をまとめ、主の家に任[まか]された工事[こうじ]をする者[もの]たちの手[て]に渡[わた]しました。」"
  10: "書記[しょき]シャファンは王[おう]に告[つ]げて言[い]った。「祭司[さいし]ヒルキヤがわたしに律法[りっぽう]の書[しょ]を渡[わた]しました。」そしてシャファンは王の前[まえ]でそれを読[よ]み上[あ]げた。"
  11: "王[おう]は律法[りっぽう]の書[しょ]の言葉[ことば]を聞[き]くと、自分[じぶん]の衣[ころも]を裂[さ]いた。"
  12: "王[おう]は祭司[さいし]ヒルキヤ、シャファンの子[こ]アヒカム、ミカヤの子アクボル、書記[しょき]シャファン、王のしもべアサヤに命[めい]じて言[い]った。"
  13: "「行[い]って、わたしのため、民[たみ]すべてのため、ユダすべてのために、見[み]つかったこの書[しょ]の言葉[ことば]について主[しゅ]に尋[たず]ねなさい。主の怒[いか]りがわたしたちに対[たい]して大[おお]きく燃[も]え上[あ]がっているからである。父[ちち]たちがこの書の言葉に聞[き]き従[したが]わず、わたしたちについて書[か]かれているすべてを行[おこな]わなかったからである。」"
  14: "祭司[さいし]ヒルキヤ、アヒカム、アクボル、シャファン、アサヤは、預言者[よげんしゃ]フルダのもとへ行[い]った。彼女[かのじょ]は衣[ころも]を守[まも]る者[もの]シャルムの妻[つま]で、シャルムはティクワの子[こ]、ハルハスの孫[まご]である。フルダはエルサレムのマセナに住[す]んでいた。彼らはこのことについて彼女に語[かた]りかけた。"
  15: "彼女は彼らに言[い]った。「イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。わたしを遣[つか]わした人[ひと]に言いなさい。"
  16: "『主[しゅ]はこう言[い]われる。見[み]よ、わたしはこの場所[ばしょ]とそこに住[す]む者[もの]たちに災[わざわ]いをもたらす。すなわち、ユダの王[おう]が読[よ]んだ書[しょ]のすべての言葉[ことば]である。"
  17: "彼らがわたしを捨[す]てて、ほかの神々[かみがみ]に香[こう]をたき、自分[じぶん]の手[て]の業[わざ]でわたしを怒[いか]らせたからである。わたしの怒[いか]りはこの場所[ばしょ]に燃[も]え上[あ]がり、消[き]えることはない。』"
  18: "また、あなたがたを遣[つか]わして主[しゅ]に尋[たず]ねさせたユダの王[おう]には、こう言[い]いなさい。『イスラエルの神[かみ]である主はこう言われる。あなたが聞[き]いた言葉[ことば]について、"
  19: "あなたの心[こころ]が柔[やわ]らかになり、あなたが主[しゅ]の前[まえ]で身[み]を低[ひく]くしたからである。あなたは、わたしがこの場所[ばしょ]とそこに住[す]む者[もの]たちについて語[かた]ったこと、すなわち彼らが滅[ほろ]びと呪[のろ]いの的[まと]となることを聞[き]き、わたしの前[まえ]で衣[ころも]を裂[さ]き、泣[な]いた。それゆえ、わたしもまた聞[き]いた、と主[しゅ]は言[い]われる。"
  20: "それゆえ、見[み]よ、わたしはあなたをあなたの父[ちち]たちに加[くわ]えよう。あなたは平和[へいわ]のうちに墓[はか]に集[あつ]められ、わたしがこの場所[ばしょ]とそこに住[す]む者[もの]たちにもたらすすべての災[わざわ]いを、あなたの目[め]は見[み]ることがない。』」そして彼らは王[おう]にこの言葉[ことば]を伝[つた]えた。"

notes:
  1: "Υἱὸς ὀκτὼ ἐτῶν — «сын восьми лет», т.е. восьми лет от роду. τριάκοντα καὶ ἓν ἔτος — тридцать один год. ὄνομα τῇ μητρὶ αὐτοῦ — имя матери его. Ιεδιδα θυγάτηρ Εδεια ἐκ Βασουρωθ — Едида, дочь Едеи, из Васурофа (слав. «иедида, дщи едеева, от васурофа»); в Синодальном — Иедида, дочь Адаии, из Боцкафы."
  2: "τὸ εὐθὲς ἐν ὀφθαλμοῖς κυρίου — правое в очах Господних. ἐπορεύθη ἐν πάσῃ ὁδῷ Δαυιδ — ходил всем путём Давида. οὐκ ἀπέστη δεξιὰ ἢ ἀριστερά — не уклонялся ни направо, ни налево (слав. «ни на десно, ни на шуее»)."
  3: "ὀκτωκαιδεκάτῳ ἔτει — в восемнадцатый год; τῷ μηνὶ τῷ ὀγδόῳ — в восьмой месяц, но в csl «в седмый месяц»; по паритету в тексте седьмой месяц, LXX-чтение (восьмой) — здесь. Σαφφαν υἱὸν Εσελιου υἱοῦ Μεσολλαμ — Шафан, сын Еселии, сын Мешуллама. τὸν γραμματέα οἴκου κυρίου — писца дома Господня. λέγων — «говоря»."
  4: "Ἀνάβηθι — взойди. σφράγισον τὸ ἀργύριον — запечатай серебро (слав. «запечатлей»). τὸ εἰσενεχθὲν ἐν οἴκῳ κυρίου — внесённое в дом Господень. οἱ φυλάσσοντες τὸν σταθμόν — стражи порога (σταθμός — порог; слав. «стрегущии врат»)."
  5: "ἐπὶ χεῖρα ποιούντων τὰ ἔργα — в руки делающих работы. τῶν καθεσταμένων ἐν οἴκῳ κυρίου — приставленных в доме Господнем. κατισχῦσαι τὸ βεδεκ — укрепить повреждение; βεδεκ — транслитерация евр. בֶּדֶק «пролом, трещина» (слав. «разселины»). LXX меняет конструкцию: повеление (δότωσαν) переходит в рассказ (ἔδωκεν); в тексте передано пассивно, так как субъект не назван."
  6: "τέκτονες — плотники; οἰκοδόμοι — строители; τειχισταί — возводящие стены. λατομητοὺς λίθους — тёсаные камни. κραταιῶσαι τὸ βεδεκ — укрепить повреждение дома."
  7: "πλὴν οὐκ ἐξελογίζοντο — «впрочем не взыскивали отчёта» (ἐκλογίζομαι); слав. «не сочисляху». ἐν πίστει — «в верности», т.е. честно (слав. «яко верно тии творяху»)."
  8: "Βιβλίον τοῦ νόμου εὗρον — «книгу закона нашёл». В csl в скобках добавлено «(Божия)» — вставка, в LXX её нет, не переведена. ἀνέγνω — прочитал."
  9: "Ἐχώνευσαν — «расплавили, слили» (χωνεύω); в тексте передано «собрали в одно»; слав. «слияша», в Синодальном «взяли». ῥῆμα — слово, ответ, отчёт. В csl «вниде в дом Господень» — иное чтение при LXX εἰσήνεγκεν («внёс», к царю); передано нейтрально «пошёл к царю»."
  10: "Βιβλίον ἔδωκέν μοι — «книгу дал мне»; в csl «книгу закона даде ми» — добавлено «закона», по паритету в тексте. ἀνέγνω ἐνώπιον τοῦ βασιλέως — читал пред царём."
  11: "ὡς ἤκουσεν — когда услышал. διέρρηξεν τὰ ἱμάτια ἑαυτοῦ — разодрал одежды свои (знак скорби и ужаса)."
  12: "Χελκια τῷ ἱερεῖ — Хелкии священнику (здесь без «великого»). Αχικαμ υἱῷ Σαφφαν — Ахикаму, сыну Шафана. Αχοβωρ υἱῷ Μιχαιου — Ахбору, сыну Михея. Ασαια δούλῳ τοῦ βασιλέως — Асаии, рабу царя."
  13: "ἐκζητήσατε τὸν κύριον — вопросите Господа (ἐκζητέω). μεγάλη ἡ ὀργὴ κυρίου ἡ ἐκκεκαυμένη ἐν ἡμῖν — велик гнев Господень, возжжённый на нас. ὑπὲρ οὗ οὐκ ἤκουσαν — за то, что не послушали. κατὰ πάντα τὰ γεγραμμένα καθ᾿ ἡμῶν — по всему написанному против нас (слав. «на ны»)."
  14: "τὴν προφῆτιν — пророчицу. Σελλημ υἱοῦ Θεκουε υἱοῦ Αραας τοῦ ἱματιοφύλακος — Шаллума, сына Тиквы, сына Хархаса, хранителя одежд. ἐν τῇ μασενα — «во второй части» города (евр. מִשְׁנֶה; слав. «в масене»). В csl добавлено «по сему» («об этом») — в LXX нет; по паритету в тексте."
  15: "Τάδε λέγει κύριος ὁ θεὸς Ισραηλ — так говорит Господь Бог Израилев. Εἴπατε τῷ ἀνδρὶ τῷ ἀποστείλαντι ὑμᾶς — скажите человеку, пославшему вас."
  16: "ἐπάγω κακὰ ἐπὶ τὸν τόπον τοῦτον — навожу зло на место сие. πάντας τοὺς λόγους τοῦ βιβλίου — все слова книги."
  17: "ἀνθ᾿ ὧν — за то, что. ἐθυμίων θεοῖς ἑτέροις — кадили иным богам. παροργίσωσιν — прогневать. ἐκκαυθήσεται ὁ θυμός μου — возгорится гнев Мой. οὐ σβεσθήσεται — не угаснет."
  18: "πρὸς βασιλέα Ιουδα τὸν ἀποστείλαντα ὑμᾶς ἐπιζητῆσαι τὸν κύριον — к царю Иуде, пославшему вас вопросить Господа. Οἱ λόγοι, οὓς ἤκουσας — слова, которые ты слышал; стих обрывается, продолжение в 19."
  19: "ἡπαλύνθη ἡ καρδία σου — умягчилось сердце твоё (ἁπαλύνω). ἐνετράπης — устыдился, смирился. εἰς ἀφανισμὸν καὶ εἰς κατάραν — в уничтожение и проклятие (слав. «в погубление и в проклятие»). καί γε ἐγὼ ἤκουσα — «и Я услышал»."
  20: "οὐχ οὕτως — «не так» в LXX; в csl «сего ради» (потому) — по паритету в тексте それゆえ. προστίθημί σε πρὸς τοὺς πατέρας σου — приложу тебя к отцам твоим. συναχθήσῃ εἰς τὸν τάφον σου ἐν εἰρήνῃ — соберёшься в гроб твой с миром. καὶ ἐπέστρεψαν τῷ βασιλεῖ τὸ ῥῆμα — «и принесли царю ответ»: в csl этого нет (там фраза открывает 23:1), в LXX есть — оставлено в тексте."
