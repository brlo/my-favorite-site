# jp-box, Иезекииль, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава тоже 19. Стихов 14,
# деление совпадает.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: плач о князьях Израиля. 1–9 образ львицы и двух львят (один отведён
# в Египет, другой — в Вавилон); 10–14 образ виноградной лозы: сильная ветвь-скипетр,
# сокрушённая гневом и сожжённая, пересаженная в пустыню.
# Речь: 19:1 — повеление пророку, 19:2–14 — самый плач, одна непрерывная речь в 「…»
# (вложенной речи нет; «И скажи» не разрывает цитату, как в Иер 13:1).
# Паритет: 19:1 LXX «о князе» (ед. ч.), csl «на князи израилевы» (мн. ч.) — держим csl;
# 19:2 LXX «львёнок» (σκύμνος), csl «львица» — держим csl; 19:4 LXX «в растлении их»,
# ru/МТ «в яму их»; 19:10 LXX «цветок на гранате» (ἐν ῥόᾳ), csl «цвет шипчан»;
# 19:12 LXX «наказан (ἐξεδικήθη)», csl «увядоша».

