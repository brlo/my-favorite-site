verses:
  1: "「人[ひと]の子[こ]よ、あなたは、イスラエルの君[きみ]たちのために泣[な]き歌[うた]を取[と]り上[あ]げよ。"
  2: "そして言[い]え。あなたの母[はは]は何[なに]か。雌[めす]の獅子[しし]である。それは獅子[しし]たちの間[あいだ]に伏[ふ]し、若[わか]い獅子[しし]たちの間[あいだ]で子[こ]どもを育[そだ]てた。"
  3: "その子[こ]どもの一[ひと]つが飛[と]び出[だ]し、若[わか]い獅子[しし]となって、獲物[えもの]を捕[つか]まえることを学[まな]び、人[ひと]を食[く]らった。"
  4: "諸国[しょこく]はそのうわさを聞[き]いて、彼を捕[と]らえた。彼らは彼を捕[つか]まえ、鉤[かぎ]をかけてエジプトの地[ち]に連[つ]れて行[い]った。"
  5: "雌[めす]の獅子[しし]は、その子[こ]が自分[じぶん]から引[ひ]き離[はな]され、自分の頼[たよ]りが滅[ほろ]びたのを見[み]て、その子[こ]どものもう一[ひと]つを取[と]って、それを若[わか]い獅子[しし]とした。"
  6: "それは獅子[しし]たちの間[あいだ]を歩[あゆ]み、若[わか]い獅子[しし]となって、獲物[えもの]を捕[つか]まえることを学[まな]び、人[ひと]を食[く]らった。"
  7: "それはその激[はげ]しさのままに食[く]い荒[あ]らし、その町々[まちまち]を荒[あ]れ果[は]てさせた。そのほえ声[ごえ]によって、その地[ち]とそこに満[み]ちるものとを滅[ほろ]ぼした。"
  8: "国々[くにぐに]は四方[しほう]の地[ち]から彼に敵[てき]して集[あつ]まり、その網[あみ]を彼の上[うえ]に広[ひろ]げ、彼らは彼をその罠[わな]にかけて捕[つか]まえた。"
  9: "彼らは彼を鉤[かぎ]と檻[おり]の中[なか]に入[い]れ、バビロンの王[おう]のもとへ連[つ]れて行[い]き、彼を牢[ろう]に入[い]れて、もはやその声[こえ]がイスラエルの山々[やまやま]に聞[き]こえないようにした。"
  10: "あなたの母[はは]はぶどうの木[き]のようで、水[みず]のほとりに植[う]えられたざくろの花[はな]のようだった。その実[み]もその枝[えだ]も、多[おお]くの水[みず]から出[で]た。"
  11: "それには、支[し]配[はい]する者[もの]たちの杖[つえ]となる強[つよ]い枝[えだ]があった。それはその高[たか]さによって、幹[みき]の間[あいだ]にそびえ立[た]った。それは多[おお]くの枝[えだ]のうちに、自分の大[おお]きさを見[み]た。"
  12: "しかし、それは怒[いか]りによって折[お]られ、地[ち]に投[な]げ捨[す]てられ、焼[や]けつく風[かぜ]がその実[み]を枯[か]らした。その強[つよ]い杖[つえ]は罰[ばっ]せられて枯[か]れ、火[ひ]がそれを焼[や]き尽[つ]くした。"
  13: "そして今[いま]、それは荒[あ]れ野[の]に、水[みず]のない地[ち]に植[う]えられている。"
  14: "火[ひ]がその杖[つえ]から出[で]て、それを焼[や]き尽[つ]くした。それゆえ、そこには支[し]配[はい]する者[もの]の杖[つえ]となる強[つよ]い枝[えだ]はない。これは嘆[なげ]きの歌[うた]であり、嘆[なげ]きとなる」。"

notes:
  1: "Καὶ σὺ λαβὲ θρῆνον ἐπὶ τὸν ἄρχοντα τοῦ Ισραηλ — «и ты возьми плач о князе Израилевом» (θρῆνος — плач, погребальная песнь; ἄρχων — 君); csl «на князи израилевы» — множественное число, держим csl; csl добавляет обращение «сыне человечь» — нет в LXX, внесено."
  2: "Τί ἡ μήτηρ σου; σκύμνος — «что мать твоя? львёнок» (σκύμνος — львёнок); csl «мати твоя львица» — держим csl (雌の獅子); ἐν μέσῳ λεόντων ἐγενήθη — «среди львов стала»; ἐπλήθυνεν σκύμνους αὐτῆς — «умножила львят своих»."
  3: "ἀπεπήδησεν εἷς τῶν σκύμνων αὐτῆς — «выпрыгнул (вышел) один из львят её» (ἀποπηδάω); λέων ἐγένετο — «львом стал»; ἔμαθεν τοῦ ἁρπάζειν ἁρπάγματα — «научился похищать похищенное» (cognatus accusativus); ἀνθρώπους ἔφαγεν — «людей ел»."
  4: "ἤκουσαν κατ᾽ αὐτοῦ ἔθνη — «услышали о нём народы»; ἐν τῇ διαφθορᾷ αὐτῶν συνελήμφθη — «в растлении (погибели) их пойман был» (διαφθορά; в ru «в яму их» — иное понимание, не внесено); ἤγαγον αὐτὸν ἐν κημῷ — «привели его в наморднике (кольце)» (κημός — намордник, 鉤), в землю Египта."
  5: "εἶδεν ὅτι ἀπῶσται ἀπ᾽ αὐτῆς — «увидела, что отогнан (отнят) от неё» (ἀπωθέω — отталкивать); ἀπώλετο ἡ ὑπόστασις αὐτῆς — «погибло упование (основание) её» (ὑπόστασις; csl «чаяние»); ἔλαβεν ἄλλον ἐκ τῶν σκύμνων αὐτῆς."
  6: "ἀνεστρέφετο ἐν μέσῳ λεόντων — «обращался (ходил) среди львов» (ἀναστρέφω); λέων ἐγένετο; ἔμαθεν ἁρπάζειν ἁρπάγματα; ἀνθρώπους ἔφαγεν."
  7: "ἐνέμετο τῷ θράσει αὐτοῦ — «пасся (хозяйничал) в дерзости своей» (νέμω — пасти; θράσος — дерзость, 猛々しさ); τὰς πόλεις αὐτῶν ἐξηρήμωσεν — «города их опустошил» (ἐρημόω); ἠφάνισεν γῆν καὶ τὸ πλήρωμα αὐτῆς — «истребил землю и полноту её» (ἀφανίζω, πλήρωμα); ἀπὸ φωνῆς ὠρύματος αὐτοῦ — «от голоса рыкания его» (ὠρύομαι — рычать)."
  8: "ἔδωκαν ἐπ᾽ αὐτὸν ἔθνη — «пошли на него народы» (δίδωμι ἐπί — выступать против); ἐξεπέτασαν ἐπ᾽ αὐτὸν δίκτυα αὐτῶν — «распростёрли на него сети свои» (ἐκπετάννυμι, δίκτυον); ἐν διαφθορᾷ αὐτῶν συνελήμφθη — «в погибели их пойман был»."
  9: "ἔθεντο αὐτὸν ἐν κημῷ καὶ ἐν γαλεάγρᾳ — «положили его в кольце и в клетке» (γαλεάγρα — клетка, 檻); ἦλθεν πρὸς βασιλέα Βαβυλῶνος — «пришёл к царю Вавилонскому»; εἰσήγαγεν αὐτὸν εἰς φυλακήν — «ввёл его в темницу» (φυλακή); ὅπως μὴ ἀκουσθῇ ἡ φωνὴ αὐτοῦ ἐπὶ τὰ ὄρη τοῦ Ισραηλ — «чтобы не слышался голос его на горах Израиля»."
  10: "ἡ μήτηρ σου ὡς ἄμπελος — «мать твоя как виноград»; ὡς ἄνθος ἐν ῥόᾳ — «как цветок на гранатовом дереве» (ῥόα — гранат; csl «цвет шипчан»); ἐν ὕδατι πεφυτευμένη — «при воде посаженная» (φυτεύω); ὁ καρπὸς αὐτῆς καὶ ὁ βλαστὸς αὐτῆς ἐγένετο ἐξ ὕδατος πολλοῦ — «плод её и побег её от воды многой»."
  11: "ῥάβδος ἰσχύος ἐπὶ φυλὴν ἡγουμένων — «жезл силы над племенем вождей» (ῥάβδος — жезл, 杖); ὑψώθη τῷ μεγέθει αὐτῆς ἐν μέσῳ στελεχῶν — «возвысилась величием среди стволов» (στέλεχος — ствол); εἶδεν τὸ μέγεθος αὐτῆς ἐν πλήθει κλημάτων — «увидела величие своё во множестве ветвей» (κλῆμα)."
  12: "κατεκλάσθη ἐν θυμῷ — «сокрушена в гневе» (κατακλάω — переламывать); ἐπὶ γῆν ἐρρίφη — «на землю брошена»; ἄνεμος ὁ καύσων ἐξήρανεν τὰ ἐκλεκτὰ αὐτῆς — «ветер знойный иссушил избранное её» (καύσων); ἐξεδικήθη καὶ ἐξηράνθη ἡ ῥάβδος ἰσχύος — «наказан (отмщён) и иссох жезл силы» (ἐκδικέω — отмщать; csl «увядоша»); πῦρ ἀνήλωσεν αὐτήν — «огонь пожрал её» (ἀναλίσκω)."
  13: "καὶ νῦν πεφύτευκαν αὐτὴν ἐν τῇ ἐρήμῳ — «и ныне посадили её в пустыне» (φυτεύω); ἐν γῇ ἀνύδρῳ — «в земле безводной» (ἄνυδρος)."
  14: "ἐξῆλθεν πῦρ ἐκ ῥάβδου ἐκλεκτῶν αὐτῆς — «вышел огонь из жезла избранных её»; κατέφαγεν αὐτήν — «пожрал её»; οὐκ ἦν ἐν αὐτῇ ῥάβδος ἰσχύος — «не было в ней жезла силы»; φυλὴ εἰς παραβολὴν θρῆνου ἐστὶν καὶ ἔσται εἰς θρῆνον — «племя в притчу плача есть и будет в плач» (παραβολή, θρῆνος), 嘆きの歌. Плач закрывается."