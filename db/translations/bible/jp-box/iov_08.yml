# jp-box, Иов, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге только главы 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: первая речь Вилдада. Формула (1), укор за многословие (2),
# Бог не извращает суда (3), судьба сыновей Иова (4), призыв взыскать Бога (5–7),
# урок прежних родов (8–10), образ тростника без воды (11–13), гибель нечестивого
# и его дома (14–19), Бог не отвергает непорочного (20–22).
# Голоса: 8:1 — повествование (формула вне кавычек); 8:2–22 — Вилдад, одна цитата.
# Поэтому в 8:2 открывается 「 и закрывается в конце 8:22.
# Нумерация по gr: 22 стиха, у csl тоже 22, но граница 1/2 иная: csl 8:1 вбирает
# начало gr 8:2 («доколе глаголати будеши сия?»), дальше стихи совпадают (отмечено в notes).
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Сносок ⟨…⟩ нет.
# Имена: ビルダド (シュヒ人).

tr_code: jp-box
book: iov
chapter: 8
draft: true

verses:
  1: "シュヒ人[じん]ビルダドは答[こた]えて言[い]った。"
  2: "「いつまで、あなたはそんなことを言[い]い続[つづ]けるのか。あなたの口[くち]から出[で]るのは、言葉数[ことばかず]の多[おお]い風[かぜ]にすぎない。"
  3: "主[しゅ]は裁[さば]くとき不[ふ]正[せい]をなさるだろうか。すべてを造[つく]られた方が正義[せいぎ]を乱[みだ]されるだろうか。"
  4: "あなたの息子[むすこ]たちが彼[かれ]の前[まえ]で罪[つみ]を犯[おか]したのなら、彼は彼らをその不法[ふほう]の手[て]に渡[わた]された。"
  5: "あなたは朝[あさ]早[はや]く起[お]きて主[しゅ]、全能者[ぜんのうしゃ]に祈[いの]り、"
  6: "もしあなたが清[きよ]く真実[しんじつ]であるなら、主はあなたの祈りを聞[き]き、あなたに正義[せいぎ]の住[す]まいを回復[かいふく]してくださる。"
  7: "そうすれば、あなたの初[はじ]めのものは少[すく]なく、あなたの末[すえ]のものは数[かぞ]えきれないほど多[おお]くなる。"
  8: "どうか、昔[むかし]の代[よ]に問[と]い、父[ちち]たちの代々[よよ]のことを探[さぐ]り出[だ]せ。"
  9: "わたしたちは昨日[きのう]の者[もの]にすぎず、何[なに]も知[し]らない。地[ち]の上[うえ]のわたしたちの命[いのち]は影[かげ]にすぎないからである。"
  10: "彼[かれ]らはあなたに教[おし]え、告[つ]げ、心[こころ]から言葉[ことば]を引[ひ]き出[だ]してくれるではないか。"
  11: "水[みず]がなければ葦[あし]は茂[しげ]るだろうか。飲[の]み水がなければ藺草[いぐさ]は育[そだ]つだろうか。"
  12: "まだ根[ね]についていて、まだ刈[か]られていないうちに、水[みず]を吸[す]う前[まえ]に、どの草[くさ]も枯[か]れてしまうではないか。"
  13: "主[しゅ]を忘[わす]れる者[もの]すべての末[すえ]は、このとおりである。不[ふ]敬[けい]な者[もの]の望[のぞ]みは滅[ほろ]びるからである。"
  14: "その家[いえ]は住[す]む者[もの]のないものとなり、その天幕[てんまく]は蜘蛛[くも]の巣[す]となるからである。"
  15: "その家[いえ]を支[ささ]えても立[た]ちはせず、それにすがりついても保[た]たない。"
  16: "その者[もの]は日[ひ]の下[した]で潤[うるお]い、その腐[くさ]りから若枝[わかえだ]が伸[の]び出[で]る。"
  17: "石[いし]の集[あつ]まりの上[うえ]に眠[ねむ]り、石[いし]くれの間[あいだ]に生[い]きる。"
  18: "もしその場所[ばしょ]が彼を飲[の]み込[こ]めば、その場所は彼を否[いな]む。あなたはこのようなことを見[み]たことがないのか。"
  19: "見[み]よ、不敬[ふけい]な者[もの]の滅[ほろ]びはこのとおりであり、地[ち]からは別[べつ]の者[もの]が芽生[めば]える。"
  20: "主[しゅ]は無[む]垢[く]な者[もの]を退[しりぞ]けず、不敬[ふけい]な者[もの]の贈[おく]り物[もの]を決[けっ]して受[う]け入[い]れない。"
  21: "主は真実[しんじつ]な者[もの]たちの口[くち]を笑[わら]いで満[み]たし、その唇[くちびる]を賛美[さんび]で満たされる。"
  22: "彼[かれ]らの敵[てき]は恥[はじ]を着[き]せられ、不敬[ふけい]な者[もの]の住[す]まいはなくなる。」"

notes:
  1: "Повествование. Ὑπολαβὼν δὲ Βαλδαδ ὁ Σαυχίτης λέγει — «И отвечал Вилдад Савхеянин и сказал» (Σαυχίτης — シュヒ人). Формула вне кавычек; речь начинается в ст. 2. Слав. 8:1 включает и начало gr 8:2 («доколе глаголати будеши сия?»), поэтому граница 1/2 в слав. иная."
  2: "Вилдад. Μέχρι τίνος — «доколе». πνεῦμα πολυρῆμον τοῦ στόματός σου — «дух многоглаголивый уст твоих» (πολυρῆμος — «многословный», гапакс); передано как 言葉数の多い風. Здесь открывается 「 (закрывается в 8:22)."
  3: "Вилдад. μὴ ὁ κύριος ἀδικήσει κρίνων — «разве Господь обидит, судя» (ἀδικέω). ὁ τὰ πάντα ποιήσας — «всё сотворивший»; ταράξει τὸ δίκαιον — «поколеблет правду» (ταράσσω). LXX читает κύριος, слав. «Господь»."
  4: "Вилдад. εἰ οἱ υἱοί σου ἥμαρτον — «если сыновья твои согрешили». ἀπέστειλεν ἐν χειρὶ ἀνομίας αὐτῶν — «послал [их] в руку беззакония их»; слав. «посла руку на беззакония их» — иной оборот, в тексте по LXX."
  5: "Вилдад. ὄρθριζε — импер. «вставай рано» (ὀρθρίζω); παντοκράτωρ — 全能者. Придаточное продолжается в ст. 6, поэтому стих кончается запятой."
  6: "Вилдад. εἰ καθαρὸς εἶ καὶ ἀληθινός — «если чист и истинен». δεήσεως ἐπακούσεταί σου — «услышит прошение твоё». ἀποκαταστήσει δίαιταν δικαιοσύνης — «восстановит жилище правды» (ἀποκαθίστημι, δίαιτα)."
  7: "Вилдад. τὰ πρῶτά σου ὀλίγα — «первое твоё мало»; τὰ ἔσχατά σου ἀμύθητα — «последнее твоё несказанно много» (ἀμύθητος — «несказанный, бесчисленный»)."
  8: "Вилдад. ἐπερώτησον — импер. «спроси» (ἐπερωτάω); γενεὰν πρώτην — «род первый». ἐξιχνίασον κατὰ γένος πατέρων — «исследуй по роду отцов» (ἐξιχνιάζω)."
  9: "Вилдад. χθιζοί — «вчерашние» (χθιζός, гапакс); σκιά — «тень» (影). ἡμῶν ἐπὶ τῆς γῆς ὁ βίος — «жизнь наша на земле»."
  10: "Вилдад. ἦ οὐχ οὗτοί σε διδάξουσιν — «не они ли научат тебя». ἐκ καρδίας ἐξάξουσιν ῥήματα — «из сердца изнесут слова» (ἐξάγω)."
  11: "Вилдад. πάπυρος — «папирус, тростник» (葦); θάλλει — «цветёт, зеленеет» (θάλλω). βούτομον — «ситник, камыш» (藺草); ἄνευ πότου — «без питья»."
  12: "Вилдад. ἔτι ὂν ἐπὶ ῥίζης — «ещё будучи на корне». οὐ μὴ θερισθῇ — «не будет срезан». πρὸ τοῦ πιεῖν — «прежде чем напиться». ξηραίνεται — «исыхает» (ξηραίνω). Смысл: нечестивый вянет раньше времени."
  13: "Вилдад. τὰ ἔσχατα πάντων τῶν ἐπιλανθανομένων τοῦ κυρίου — «последнее всех забывающих Господа» (ἐπιλανθάνομαι). ἐλπὶς ἀσεβοῦς ἀπολεῖται — «надежда нечестивого погибнет»; ἀσεβής — 不敬な者."
  14: "Вилдад. ἀοίκητος — «необитаемый» (οἰκέω); ἀράχνη — «паук, паутина»; ἀποβήσεται ἡ σκηνή — «сделается шатёр его» (ἀποβαίνω). Образ дома паука."
  15: "Вилдад. ἐὰν ὑπερείσῃ τὴν οἰκίαν — «если подопрёт дом свой» (ὑπερείδω). οὐ μὴ στῇ — «не устоит» (ἵστημι). ἐπιλαβομένου δὲ αὐτοῦ — «а если он ухватится за него»; οὐ μὴ ὑπομείνῃ — «не выдержит» (ὑπομένω)."
  16: "Вилдад. ὑγρὸς ὑπὸ ἡλίου — «влажный под солнцем», т. е. свежий, сочный. ἐκ σαπρίας αὐτοῦ — «из гниения его»; ῥάδαμνος — «побег, ветвь» (гапакс)."
  17: "Вилдад. ἐπὶ συναγωγὴν λίθων κοιμᾶται — «на собрании камней спит»; ἐν μέσῳ χαλίκων ζήσεται — «среди голышей живёт» (χάλιξ — «галька»). Речь о корнях, пробивающихся между камнями."
  18: "Вилдад. ἐὰν καταπίῃ — «если поглотит»; ὁ τόπος ψεύσεται αὐτόν — «место солжёт ему», т. е. откажется от него. οὐχ ἑόρακας τοιαῦτα — «ты не видел такого»; форма допускает и вопрос, передано вопросом."
  19: "Вилдад. καταστροφὴ ἀσεβοῦς τοιαύτη — «таково ниспровержение нечестивого» (καταστροφή). ἐκ δὲ γῆς ἄλλον ἀναβλαστήσει — «из земли другого произрастит» (ἀναβλαστάνω)."
  20: "Вилдад. οὐ μὴ ἀποποιήσηται τὸν ἄκακον — «не отвергнет незлобивого, невинного» (ἀποποιέομαι; ἄκακος). πᾶν δῶρον ἀσεβοῦς οὐ δέξεται — «всякий дар нечестивого не примет»."
  21: "Вилдад. ἀληθινῶν στόμα ἐμπλήσει γέλωτος — «уста истинных наполнит смехом» (ἐμπίπλημι). χείλη ἐξομολογήσεως — «уста исповедания, хвалы» (ἐξομολόγησις); передано 賛美."
  22: "Вилдад. οἱ ἐχθροὶ αὐτῶν ἐνδύσονται αἰσχύνην — «враги их облекутся в стыд» (ἐνδύω). δίαιτα ἀσεβοῦς οὐκ ἔσται — «жилища нечестивого не будет». Здесь закрывается цитата."
