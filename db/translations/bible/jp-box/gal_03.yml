verses:
  1: "ああ、愚[おろ]かなガラテヤ人[じん]たち。あなたがたの目[め]の前[まえ]に、イエス・キリストが十字架[じゅうじか]につけられた方[かた]として〔あなたがたの間[あいだ]で〕描[えが]き出[だ]されたのに、だれがあなたがたを惑[まど]わして、〔真理[しんり]に従[したが]わせないようにしたのか〕。"
  2: "ただ一つ、あなたがたから聞[き]きたいことがある。あなたがたが霊[れい]を受[う]けたのは、律法[りっぽう]の行[おこな]いによってか、それとも、聞[き]いて信[しん]じたことによってか。"
  3: "あなたがたはそんなにも愚[おろ]かなのか。霊[れい]によって始[はじ]めたのに、今[いま]は肉[にく]によって終[お]えようとしているのか。"
  4: "あなたがたは、あれほど多[おお]くの苦[くる]しみをむだに受[う]けたのか。——もし、それが本当[ほんとう]にむだであったのなら。"
  5: "それでは、あなたがたに霊[れい]を与[あた]え、あなたがたの間[あいだ]に力[ちから]ある業[わざ]を行[おこな]われる方[かた]は、律法[りっぽう]の行[おこな]いによってそうされるのか、それとも、聞[き]いて信[しん]じたことによってか。"
  6: "ちょうど、「アブラハムは神[かみ]を信[しん]じ、それが彼[かれ]の義[ぎ]と認[みと]められた」というとおりである。"
  7: "だから、信仰[しんこう]による者[もの]たちこそ、アブラハムの子[こ]であることを知[し]りなさい。"
  8: "聖書[せいしょ]は、神[かみ]が信仰[しんこう]によって異邦人[いほうじん]を義[ぎ]とされることを前[まえ]もって見[み]て、アブラハムに前[まえ]もって福音[ふくいん]を宣[の]べ伝[つた]えて、「あなたによって、すべての異邦人[いほうじん]は祝福[しゅくふく]される」と言[い]った。"
  9: "したがって、信仰[しんこう]による者[もの]たちは、信仰[しんこう]深[ぶか]いアブラハムとともに祝福[しゅくふく]されるのである。"
  10: "というのは、律法[りっぽう]の行[おこな]いによる者[もの]は、すべて呪[のろ]いの下[もと]にあるからである。「律法[りっぽう]の書[しょ]に書[か]かれているすべてのことを行[おこな]い続[つづ]けない者[もの]は、すべて呪[のろ]われる」と書[か]かれているからである。"
  11: "しかし、律法[りっぽう]によっては、だれも神[かみ]の前[まえ]で義[ぎ]とされないことは明[あき]らかである。「義[ぎ]なる者[もの]は信仰[しんこう]によって生[い]きる」とあるからである。"
  12: "しかし、律法[りっぽう]は信仰[しんこう]によるものではない。むしろ、「それを行[おこな]う者[もの]は、それによって生[い]きる」とあるのである。"
  13: "キリストは、わたしたちのために呪[のろ]いとなって、わたしたちを律法[りっぽう]の呪[のろ]いから贖[あがな]い出[だ]してくださった。「木[き]にかけられる者[もの]は、すべて呪[のろ]われる」と書[か]かれているからである。"
  14: "それは、アブラハムの祝福[しゅくふく]がキリスト・イエスにあって異邦人[いほうじん]に及[およ]び、わたしたちが信仰[しんこう]によって霊[れい]の約束[やくそく]を受[う]けるためである。"
  15: "兄弟[きょうだい]たちよ、わたしは人[ひと]の世[よ]の例[たとえ]で言[い]う。人[ひと]の契約[けいやく]でさえ、いったん成[な]り立[た]ったものは、だれも無効[むこう]にしたり、それに付[つ]け加[くわ]えたりしない。"
  16: "さて、約束[やくそく]はアブラハムとその子孫[しそん]に語[かた]られた。「そして、あなたの子孫[しそん]たちに」と、多[おお]くの者[もの]について言[い]うようには言[い]わず、「そして、あなたの子孫[しそん]に」と、一人[ひとり]の者[もの]について言[い]っている。その子孫[しそん]とはキリストである。"
  17: "わたしはこう言[い]う。神[かみ]によってあらかじめ成[な]り立[た]てられた契約[けいやく]を、四[よん]百[ひゃく]三十[さんじゅう]年[ねん]の後[のち]に生[しょう]じた律法[りっぽう]が、無効[むこう]にして、約束[やくそく]を空[むな]しくすることはできない、と。"
  18: "なぜなら、もし嗣業[しぎょう]が律法[りっぽう]によるのであれば、もはや約束[やくそく]によるのではないからである。しかし、神[かみ]は約束[やくそく]によってアブラハムに嗣業[しぎょう]を賜[たまわ]ったのである。"
  19: "それでは、律法[りっぽう]は何[なん]なのか。それは違反[いはん]のゆえに加[くわ]えられたものであり、約束[やくそく]を受[う]けた子孫[しそん]が来[く]るまで続[つづ]くものである。それは天使[てんし]たちによって、仲介者[ちゅうかいしゃ]の手[て]によって定[さだ]められた。"
  20: "仲介者[ちゅうかいしゃ]は、一方[いっぽう]だけのための者[もの]ではない。しかし、神[かみ]は一人[ひとり]である。"
  21: "それでは、律法[りっぽう]は神[かみ]の約束[やくそく]に反[はん]するのか。決[けっ]してそうではない。なぜなら、もし生[い]かすことのできる律法[りっぽう]が与[あた]えられていたなら、義[ぎ]は本当[ほんとう]に律法[りっぽう]によるものであっただろうからである。"
  22: "しかし、聖書[せいしょ]はすべての者[もの]を罪[つみ]の下[もと]に閉[と]じ込[こ]めた。それは、イエス・キリストへの信仰[しんこう]によって、約束[やくそく]が信[しん]じる者[もの]たちに与[あた]えられるためである。"
  23: "しかし、信仰[しんこう]が来[く]る前[まえ]には、わたしたちは律法[りっぽう]の下[もと]に監視[かんし]され、閉[と]じ込[こ]められて、やがて現[あらわ]れる信仰[しんこう]を待[ま]っていた。"
  24: "こうして、律法[りっぽう]は、わたしたちが信仰[しんこう]によって義[ぎ]とされるために、キリストのもとへと導[みちび]く養育係[よういくがかり]となったのである。"
  25: "しかし、信仰[しんこう]が来[き]た今[いま]は、もはや養育係[よういくがかり]の下[もと]にはいない。"
  26: "なぜなら、あなたがたはみな、キリスト・イエスにある信仰[しんこう]によって神[かみ]の子[こ]なのである。"
  27: "あなたがたのうち、キリストに洗礼[せんれい]を受[う]けた者[もの]はみな、キリストを着[き]ているからである。"
  28: "ユダヤ人[じん]もギリシア人[じん]もなく、奴隷[どれい]も自由[じゆう]な者[もの]もなく、男[おとこ]も女[おんな]もない。なぜなら、あなたがたはみな、キリスト・イエスにあって一人[ひとり]だからである。"
  29: "そして、もしあなたがたがキリストのものであるなら、あなたがたはアブラハムの子孫[しそん]であり、約束[やくそく]による相続人[そうぞくにん]である。"

notes:
  1: "Ὦ ἀνόητοι Γαλάται — ああ、愚かなガラテヤ人たち (звательный). В базе нет ἐν ὑμῖν и τῇ ἀληθείᾳ μὴ πείθεσθαι; церковный текст (Елизаветинская, Синодальный, jp-joc) читает с ними — 〔あなたがたの間で〕 и 〔真理に従わせないようにしたのか〕 (проверено: ἐν ὑμῖν — 0, ἀλήθεια — 0). προεγράφη ἐσταυρωμένος — «предначертан распятым»; 十字架につけられた方として描き出された."
  2: "ἐξ ἔργων νόμου… ἢ ἐξ ἀκοῆς πίστεως — 律法の行いによってか、聞いて信じたことによってか. τὸ πνεῦμα — 霊: в греч. нет ἅγιον, поэтому не 聖霊 (ср. Рим 8, 2 Кор 1:22)."
  3: "ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε — 霊によって始めたのに、今は肉によって終えようとしている."
  4: "τοσαῦτα ἐπάθετε εἰκῇ — あれほど多くの苦しみをむだに受けた. εἴ γε καὶ εἰκῇ — «если действительно напрасно»; もし、それが本当にむだであったのなら."
  5: "ἐπιχορηγῶν — 与える. ἐνεργῶν δυνάμεις — 力ある業を行う. οὖν — それでは."
  6: "Цитата Быт 15:6 — 「…」. ἐλογίσθη αὐτῷ εἰς δικαιοσύνην — 彼の義と認められた. καθώς — ちょうど…とおり."
  7: "οἱ ἐκ πίστεως — 信仰による者たち. υἱοὶ Ἀβραάμ — アブラハムの子."
  8: "Цитата Быт 12:3 — 「…」. προϊδοῦσα — 前もって見て. προευηγγελίσατο — 前もって福音を宣べ伝えて."
  9: "σὺν τῷ πιστῷ Ἀβραάμ — 信仰深いアブラハムとともに. ὥστε — したがって."
  10: "Цитата Втор 27:26 — 「…」. ὑπὸ κατάραν — 呪いの下. ἐμμένει — 行い続ける. Двойное γάρ сохранено."
  11: "Цитата Авв 2:4 — 「…」. δῆλον — 明らか."
  12: "Цитата Лев 18:5 — 「…」. ἀλλά — むしろ. ὁ ποιήσας αὐτὰ ζήσεται ἐν αὐτοῖς — それを行う者は、それによって生きる."
  13: "Цитата Втор 21:23 — 「…」. ἐξηγόρασεν — 贖い出した. γενόμενος ὑπὲρ ἡμῶν κατάρα — わたしたちのために呪いとなって. ξύλον — 木 (крест)."
  14: "εἰς τὰ ἔθνη — 異邦人に. ἡ ἐπαγγελία τοῦ πνεύματος — 霊の約束 (обещанный Дух)."
  15: "κατὰ ἄνθρωπον λέγω — 人の世の例で言う. κεκυρωμένην — 成り立った. ἀθετεῖ ἢ ἐπιδιατάσσεται — 無効にしたり付け加えたりする."
  16: "Цитаты Быт 13:15 / 17:7 — 「…」. σπέρμα — 子孫 (единственное число). οὐ λέγει… ἀλλ᾽ ὡς ἐφ᾽ ἑνός — 多くの者について言うようには言わず、一人の者について言っている. ὅς ἐστιν Χριστός — その子孫とはキリスト."
  17: "διαθήκη — 契約 (не 約束; 約束 — ἐπαγγελία). προκεκυρωμένην — あらかじめ成り立たてられた. μετὰ τετρακόσια καὶ τριάκοντα ἔτη — 四百三十年の後に. ἀκυροῖ — 無効にする. καταργῆσαι — 空しくする."
  18: "κληρονομία — 嗣業. κεχάρισται — 賜った (перфект). εἰ γάρ — なぜなら."
  19: "Τί οὖν — それでは. τῶν παραβάσεων χάριν — 違反のゆえに. ἄχρις οὗ ἔλθῃ — 来るまで. διαταγείς — 定められた. μεσίτης — 仲介者."
  20: "μεσίτης ἑνὸς οὐκ ἔστιν — 仲介者は一方だけのための者ではない. ὁ δὲ θεὸς εἷς — 神は一人."
  21: "В базе [τοῦ θεοῦ] — слово есть, 〔〕 не ставятся. μὴ γένοιτο — 決してそうではない. ζῳοποιῆσαι — 生かす."
  22: "συνέκλεισεν — 閉じ込めた. τὰ πάντα — すべての者. ἵνα ἡ ἐπαγγελία… δοθῇ — 約束が与えられるため."
  23: "ἐφρουρούμεθα — 監視されていた. συγκλειόμενοι — 閉じ込められて. εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι — やがて現れる信仰を待って."
  24: "παιδαγωγός — 養育係 (раб, водивший ребёнка в школу; ср. 1 Кор 4:15). ὥστε — こうして. εἰς Χριστόν — キリストのもとへ."
  25: "ἐλθούσης τῆς πίστεως — 信仰が来た今."
  26: "γάρ — なぜなら. διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある信仰によって."
  27: "ὅσοι εἰς Χριστὸν ἐβαπτίσθητε — キリストに洗礼を受けた者. Χριστὸν ἐνεδύσασθε — キリストを着た."
  28: "οὐκ ἔνι — ない. ἄρσεν καὶ θῆλυ — 男も女も (ср. Быт 1:27). εἷς ἐστε — 一人である."
  29: "εἰ δὲ ὑμεῖς Χριστοῦ — もしあなたがたがキリストのものであるなら. σπέρμα Ἀβραάμ — アブラハムの子孫. κατ᾽ ἐπαγγελίαν κληρονόμοι — 約束による相続人."
