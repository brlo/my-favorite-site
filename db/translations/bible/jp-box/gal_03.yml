# jp-box, Послание к Галатам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: несмысленные галаты и Дух через веру (1–5), Авраам и вера (6–9),
# закон и клятва, Христос стал за нас клятвою (10–14), закон и обетование,
# детоводитель (15–25), сыны Божии во Христе (26–29).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕: 3:1 — церковные ἐν ὑμῖν и τῇ ἀληθείᾳ μὴ πείθεσθαι: в gr-lxx-byz их нет
# (проверено SQL: ἐν ὑμῖν — 0, ἀλήθεια — 0), поэтому в скобках.
# В 3:21 [τοῦ θεοῦ] в базе в квадратных скобках — слово есть, 〔〕 не ставятся.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

