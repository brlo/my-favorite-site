# jp-box, Второе послание к Коринфянам, глава 13. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; все слова базы сохранены, 〔…〕 не понадобились.
# Глава 13: предупреждения перед третьим приходом (1–4), призыв испытывать себя
# (5–10), заключительные увещания и приветствия (11–12), тринитарная формула (13).
# В базе и в jp-joc 13 стихов; нумерация KJV/Елизаветинской, где «все святые»
# отделены в ст. 13, а благодать — в ст. 14, здесь не используется (сверено по базе:
# gr-lxx-byz, jp-joc, jp-ni — по 13 стихов).
# Красного и синего нет: прямой речи Христа и Богородицы нет, <j>/<mo> не ставятся.
# 〔…〕 нет: все слова, включая 13:2 εἰς τὸ πάλιν, 13:4 εἰς ὑμᾶς и 13:12 ἐν ἁγίῳ
# φιλήματι, в gr-lxx-byz есть (проверено по базе). Сносок ⟨…⟩ нет. jp-ni не использовался.

tr_code: jp-box
book: 2kor
chapter: 13
draft: true

verses:
  1: "これで三度目[さんどめ]に、わたしはあなたがたのもとへ行[い]く。「二[ふた]人[り]また三[さん]人[にん]の証人[しょうにん]の口[くち]によって、すべての言葉[ことば]は確[たし]かめられる」。"
  2: "わたしは前[まえ]に言[い]っておいた。二度目[にどめ]にあなたがたのところにいた時[とき]と同じように、あなたがたから離[はな]れている今[いま]、前[まえ]に罪[つみ]を犯[おか]した者[もの]たちにも、そのほかのすべての者[もの]にも、あらかじめ告[つ]げておく。もし、わたしが再[ふたた]び行[い]くなら、あなたがたを容赦[ようしゃ]しない。"
  3: "あなたがたは、わたしの内[うち]で語[かた]るキリストの証[あかし]を求[もと]めているからである。キリストはあなたがたに対して弱[よわ]い方[かた]ではなく、あなたがたの内[うち]に力[ちから]ある方[かた]である。"
  4: "なぜなら、キリストは弱[よわ]さのうちに十字架[じゅうじか]につけられたが、神[かみ]の力[ちから]によって生[い]きておられるからである。わたしたちもまた、キリストにあって弱[よわ]い者[もの]であるが、あなたがたに対しては、神[かみ]の力[ちから]によってキリストとともに生[い]きるであろう。"
  5: "あなたがたは信仰[しんこう]の内[うち]にいるかどうか、自分[じぶん]自身[じしん]を試[ため]しなさい。自分[じぶん]自身[じしん]を吟味[ぎんみ]しなさい。それとも、あなたがたの内[うち]にキリスト・イエスがおられることを、あなたがたは自分[じぶん]自身[じしん]で知[し]らないのか。ただし、あなたがたが失格者[しっかくしゃ]でないならである。"
  6: "しかし、わたしたちが失格者[しっかくしゃ]でないことを、あなたがたが知[し]るようになるのを、わたしは望[のぞ]んでいる。"
  7: "わたしたちは、あなたがたが何[なに]も悪[わる]いことをしないようにと、神[かみ]に祈[いの]っている。それは、わたしたちが認[みと]められた者[もの]として見[み]えるためではなく、あなたがたが善[よ]いことを行[おこな]うためである。わたしたちは、失格者[しっかくしゃ]のようであってもかまわない。"
  8: "なぜなら、わたしたちは真理[しんり]に逆[さか]らう力[ちから]を持[も]たないからである。真理[しんり]のためにこそ、力[ちから]を持[も]つのである。"
  9: "わたしたちは、自分[じぶん]たちが弱[よわ]く、あなたがたが強[つよ]い時[とき]に喜[よろこ]ぶからである。わたしたちが祈[いの]っているのも、まさにこのこと、あなたがたが整[ととの]えられることである。"
  10: "だから、わたしは離[はな]れている今[いま]、このことを書[か]いている。あなたがたのもとに行[い]く時[とき]に、主[しゅ]がわたしに与[あた]えられた権威[けんい]を、厳[きび]しく用[もち]いることのないためである。その権威[けんい]は、建[た]て上[あ]げるためのものであって、壊[こわ]すためのものではない。"
  11: "最後[さいご]に、兄弟[きょうだい]たちよ、喜[よろこ]びなさい。整[ととの]えられなさい。慰[なぐさ]められなさい。同[おな]じ思[おも]いを抱[いだ]きなさい。平和[へいわ]のうちに生[い]きなさい。そして、愛[あい]と平和[へいわ]の神[かみ]が、あなたがたとともにおられるであろう。"
  12: "聖[せい]なる接吻[せっぷん]をもって、互[たが]いに挨拶[あいさつ]しなさい。すべての聖[せい]なる者[もの]たちが、あなたがたによろしくと言[い]っている。"
  13: "主[しゅ]イエス・キリストの恵[めぐ]み、神[かみ]の愛[あい]、{聖霊[せいれい]|聖神[せいしん]}の交[まじ]わりが、あなたがたすべてとともにありますように。"

notes:
  1: "Τρίτον τοῦτο — «это третий раз»; これで三度目に. Цитата Втор 19:15 (ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν); Писание — в 「…」. σταθήσεται — «будет твёрдо, подтвердится»; 確かめられる (ср. Мф 18:16)."
  2: "προείρηκα καὶ προλέγω — «предупреждал и предупреждаю»; 前に言っておいた…あらかじめ告げておく. ὡς παρὼν τὸ δεύτερον — «как присутствуя во второй раз» (ср. 2:1–3). εἰς τὸ πάλιν — «снова»; в критическом издании в квадратных скобках, но в gr-lxx-byz есть — 〔…〕 не ставится. οὐ φείσομαι — «не пощажу»; 容赦しない."
  3: "ἐπεί — «поскольку»; からである. δοκιμή — «испытание, доказательство»; 証. ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν — «Он не бессилен для вас, но силён в вас»; ἀλλά передано противопоставлением ではなく…である."
  4: "ἐξ ἀσθενείας — «в немощи»; 弱さのうちに (не «по причине слабости»). ἐκ δυνάμεως θεοῦ — 神の力によって. εἰς ὑμᾶς — «по отношению к вам»; в gr-lxx-byz есть, 〔…〕 не ставится. Двойное γάρ: первое — なぜなら…からである, второе — параллельной конструкцией."
  5: "Ἑαυτοὺς πειράζετε… ἑαυτοὺς δοκιμάζετε — два близких глагола: 試す и 吟味する. ἐπιγινώσκετε ἑαυτούς — 知る. εἰ μήτι ἀδόκιμοί ἐστε — эллипсис сохранён: ただし…でないならである (ср. 1 Кор 15:2). ἀδόκιμος — 失格者, как в 1 Кор 9:27. Χριστὸς Ἰησοῦς — порядок греч., キリスト・イエス."
  6: "ἐλπίζω δέ — しかし…望んでいる (δέ явно). γνώσεσθε ὅτι… — «узнаете, что…»; двойное ὅτι передано оборотом ことを…のを."
  7: "εὐχόμεθα δέ — 祈っている. οὐχ ἵνα… ἀλλ᾿ ἵνα — ためではなく…ためである. δόκιμοι — 認められた者 (ср. Рим 14:18). ὡς ἀδόκιμοι ὦμεν — «хотя бы нам быть как негодные»; 失格者のようであってもかまわない."
  8: "οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας — «не сильны против истины, но за истину»; 力を持たない…力を持つ. γάρ — なぜなら…からである; ἀλλά — こそ."
  9: "χαίρομεν γάρ — …からである. τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν — аппозиция сохранена: まさにこのこと、…整えられること. κατάρτισις — 整えられること (ср. 13:11 καταρτίζεσθε)."
  10: "διὰ τοῦτο — だから. ἀποτόμως χρήσωμαι — «поступить резко, сурово»; 厳しく用いる. ἐξουσία — 権威. εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν — 建て上げるためであって、壊すためではない (ср. 10:8)."
  11: "Λοιπόν — 最後に. Пять императивов: χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε — 喜びなさい, 整えられなさい, 慰められなさい, 同じ思いを抱きなさい, 平和のうちに生きなさい. ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης — 愛と平和の神. ἔσται — おられるであろう."
  12: "ἅγιον φίλημα — 聖なる接吻; сноска уже при первом упоминании (Рим 16:16), поэтому здесь ⟨…⟩ нет. ἐν ἁγίῳ φιλήματι в gr-lxx-byz есть — 〔…〕 не ставится. οἱ ἅγιοι πάντες — すべての聖なる者たち."
  13: "χάρις — 恵み, ἀγάπη — 愛, κοινωνία — 交わり. Формула по заданию; {聖霊|聖神} — калька. В базе нет ἀμήν (у jp-joc 「アミン」), по заданию формула без アーメン. τοῦ κυρίου Ἰησοῦ Χριστοῦ — 主イエス・キリスト."
