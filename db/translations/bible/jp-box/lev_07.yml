# jp-box, Левит, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Фуригана — при первом появлении слова в стихе.
# Глава 7: закон о жертве повинности и доля священников (1–10), закон о мирной
# жертве — 酬恩祭 (11–21), запрет крови и тука (22–27), доля священников (28–36),
# сводка законов (37–38).
# Речь Бога — 「…」 (1–21, 23–27, 29–36); 1–21 — продолжение речи из 6:24–30,
# поэтому глава начинается кавычками без нового вводного речения. Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 愆祭 (5:15), 酬恩祭 (3:1), 素祭 (2:1), 贖罪祭 (4:3) уже пояснены.
# LXX/масоретские отличия: 7:3 LXX в конце добавляет «и весь тук на внутренностях»
# (повтор, ср. 7:4); 7:4 в квадратных скобках греч. [σὺν τοῖς νεφροῖς περιελεῖ αὐτά] —
# «с почками отделит их», в csl есть; 7:30 δόμα — «дар» (евр. tenufa, возношение);
# 7:35 χρῖσις — «помазание», Синодальный — «участок».
# jp-ni не использовался.

