verses:
  1: "「愆祭[けんさい]の雄羊[おすひつじ]の法[ほう]はこうである。それは最[もっと]も聖[せい]なるものである。"
  2: "愆祭[けんさい]の雄羊[おすひつじ]は、燔祭[はんさい]を屠[ほふ]る場所[ばしょ]で、主[しゅ]の前[まえ]で屠り、その血[ち]は祭壇[さいだん]の基[もとい]の周[まわ]りに注[そそ]ぎかけなさい。"
  3: "そして、その脂肪[しぼう]すべてを、すなわち尾[お]の脂肪、内臓[ないぞう]を覆[おお]う脂肪すべて、内臓の上[うえ]にある脂肪すべてを、その中[なか]から献[ささ]げなさい。"
  4: "また、二[ふた]つの腎臓[じんぞう]と、その上[うえ]、すなわち腿[もも]の上にある脂肪[しぼう]、肝臓[かんぞう]の小葉[しょうよう]を、腎臓とともに取[と]り分[わ]けなさい。"
  5: "祭司[さいし]はそれらを祭壇[さいだん]の上[うえ]で、主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]として焼きなさい。それは愆祭[けんさい]である。"
  6: "祭司[さいし]たちのうちの男[おとこ]はすべて、それを食[た]べることができる。それは聖[せい]なる場所[ばしょ]で食べなければならない。それは最[もっと]も聖なるものである。"
  7: "贖罪祭[しょくざいさい]についても愆祭[けんさい]についても、法[ほう]は同[おな]じ一[ひと]つである。すなわち、その祭[まつ]りによって贖[あがな]いをする祭司[さいし]のものとなる。"
  8: "ある人[ひと]の燔祭[はんさい]を献[ささ]げる祭司[さいし]は、自分[じぶん]が献げる燔祭の皮[かわ]を自分のものとする。"
  9: "炉[ろ]で焼[や]いた素祭[そさい]、あるいは鉄板[てつばん]の上[うえ]で、または平鍋[ひらなべ]で作[つく]った素祭はすべて、それを献[ささ]げる祭司[さいし]のものとなる。"
  10: "油[あぶら]を混[ま]ぜた素祭[そさい]も、混ぜていない素祭も、アロンの子[こ]らすべてのものとなり、おのおの等[ひと]しく分[わ]ける。"
  11: "酬恩祭[しゅうおんさい]の法[ほう]はこうである。それは主[しゅ]に献[ささ]げるものである。"
  12: "もし彼[かれ]がそれを感謝[かんしゃ]のために献[ささ]げるなら、その感謝の犠牲[ぎせい]とともに、油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]のパン、油を塗[ぬ]った種[たね]なしの薄焼[うすや]きパン、油を混ぜた小麦粉を献げなさい。"
  13: "彼[かれ]は感謝[かんしゃ]の酬恩祭[しゅうおんさい]の捧[ささ]げ物[もの]とともに、パン種[ぱんだね]を入[い]れたパンを献[ささ]げなさい。"
  14: "彼[かれ]はすべての捧[ささ]げ物[もの]のうちから一[ひと]つを、主[しゅ]への献[ささ]げ物として取[と]り分[わ]けなさい。それは酬恩祭[しゅうおんさい]の血[ち]を注[そそ]ぎかける祭司[さいし]のものとなる。"
  15: "感謝[かんしゃ]の酬恩祭[しゅうおんさい]の肉[にく]は彼[かれ]のものとなり、それを献[ささ]げる日[ひ]に食[た]べなければならない。朝[あさ]までその一部[いちぶ]も残[のこ]してはならない。"
  16: "もし彼[かれ]が誓願[せいがん]のため、あるいは自[みずか]ら進[すす]んで献[ささ]げる捧[ささ]げ物[もの]であるなら、それを献げる日[ひ]に食[た]べなければならない。その翌日[よくじつ]も、残[のこ]ったものを食べることができる。"
  17: "しかし、その犠牲[ぎせい]の肉[にく]のうち三日目[みっかめ]まで残[のこ]ったものは、火[ひ]で焼[や]き尽[つ]くさなければならない。"
  18: "もし三日目[みっかめ]にその肉[にく]を食[た]べるなら、それを献[ささ]げる者[もの]には受[う]け入[い]れられず、その捧[ささ]げ物[もの]は彼[かれ]に認[みと]められない。それは汚[けが]れとなる。それを食べる者は自分[じぶん]の罪[つみ]を負[お]う。"
  19: "汚[けが]れたものに触[ふ]れた肉[にく]は食[た]べてはならない。火[ひ]で焼[や]き尽[つ]くさなければならない。清[きよ]い者[もの]は、だれでもその肉を食べることができる。"
  20: "しかし、その汚[けが]れが自分[じぶん]の上[うえ]にあるのに、主[しゅ]の酬恩祭[しゅうおんさい]の肉[にく]を食[た]べる者[もの]は、その魂[たましい]が自分の民[たみ]から断[た]たれる。"
  21: "また、人[ひと]が何[なに]か汚[けが]れたもの、すなわち人の汚れ、汚れた四[よ]つ足[あし]の獣[けもの]、汚れた忌[いま]むべきもののいずれかに触[ふ]れ、そのうえで主[しゅ]の酬恩祭[しゅうおんさい]の肉[にく]を食[た]べるなら、その魂[たましい]は自分[じぶん]の民[たみ]から断[た]たれる。」"
  22: "主[しゅ]はモーセに言[い]われた。"
  23: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。牛[うし]の脂肪[しぼう]、羊[ひつじ]の脂肪、山羊[やぎ]の脂肪を、あなたがたは食[た]べてはならない。"
  24: "死[し]んだ獣[けもの]の脂肪[しぼう]も、野獣[やじゅう]に裂[さ]かれた獣の脂肪も、あらゆる仕事[しごと]に用[もち]いることはできるが、食[た]べてはならない。"
  25: "主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]として献[ささ]げる家畜[かちく]の脂肪[しぼう]を食[た]べる者[もの]は、その魂[たましい]が自分[じぶん]の民[たみ]から断[た]たれる。"
  26: "あなたがたは、その住[す]むすべての場所[ばしょ]で、鳥[とり]の血[ち]も家畜[かちく]の血も、どんな血も食[た]べてはならない。"
  27: "どんな血[ち]でも食[た]べる者[もの]は、その魂[たましい]が自分[じぶん]の民[たみ]から断[た]たれる。」"
  28: "主[しゅ]はモーセに言[い]われた。"
  29: "「イスラエルの子[こ]らにこう言[い]いなさい。主[しゅ]に酬恩祭[しゅうおんさい]を献[ささ]げる者[もの]は、その酬恩祭のうちから、自分[じぶん]の捧[ささ]げ物[もの]を主に携[たずさ]えて来[き]なさい。"
  30: "彼[かれ]は自分[じぶん]の手[て]で、主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]を携[たずさ]えて来[き]なさい。すなわち、胸[むね]の上[うえ]の脂肪[しぼう]と肝臓[かんぞう]の小葉[しょうよう]を、主の前[まえ]に献[ささ]げ物として差[さ]し上[あ]げるために携えて来なさい。"
  31: "祭司[さいし]はその脂肪[しぼう]を祭壇[さいだん]の上[うえ]で焼[や]きなさい。その胸[むね]はアロンとその子[こ]らのものとなる。"
  32: "あなたがたは酬恩祭[しゅうおんさい]のうちから、右[みぎ]の肩[かた]を、祭司[さいし]への献[ささ]げ物[もの]として与[あた]えなさい。"
  33: "アロンの子[こ]らのうち、酬恩祭[しゅうおんさい]の血[ち]と脂肪[しぼう]を献[ささ]げる者[もの]が、右[みぎ]の肩[かた]を分[ぶん]として受[う]け取[と]る。"
  34: "わたしはイスラエルの子[こ]らから、その酬恩祭[しゅうおんさい]のうちに、差[さ]し上[あ]げの胸[むね]と取[と]り分[わ]けの肩[かた]を受[う]け取り、それを祭司[さいし]アロンとその子らに与[あた]えた。これはイスラエルの子らからの永遠[えいえん]の定[さだ]めである。"
  35: "これは、アロンとその子[こ]らに注[そそ]がれた油[あぶら]の分[ぶん]であり、主[しゅ]への焼[や]き尽[つ]くす捧[ささ]げ物[もの]のうちからのものである。すなわち、彼[かれ]らが主に仕[つか]える祭司[さいし]として近[ちか]づけられた日[ひ]のものである。"
  36: "これは、主[しゅ]が彼[かれ]らに油[あぶら]を注[そそ]いだ日[ひ]に、イスラエルの子[こ]らから彼らに与[あた]えるよう命[めい]じられたものであり、彼らの代々[よよ]にわたる永遠[えいえん]の定[さだ]めである。」"
  37: "これは、燔祭[はんさい]と素祭[そさい]と贖罪祭[しょくざいさい]と愆祭[けんさい]と任職[にんしょく]の献[ささ]げ物[もの]と酬恩祭[しゅうおんさい]の法[ほう]である。"
  38: "これは、主[しゅ]がシナイの山[やま]でモーセに命[めい]じられたとおりであり、シナイの荒野[こうや]でイスラエルの子[こ]らに、主の前[まえ]に捧[ささ]げ物[もの]を献[ささ]げるよう命じられた日[ひ]のものである。"

notes:
  1: "κριὸς ὁ περὶ τῆς πλημμελείας — «овен жертвы повинности»; ἅγια ἁγίων — «святая святых». Стих продолжает речь из 6:24–30, поэтому начинается с 「 без нового вводного речения."
  2: "σφάξουσιν — «заколют»; προσχεεῖ — «прольёт» (кровь возливается вокруг основания, не кропится); βάσις — «основание»."
  3: "ὀσφύς — здесь «курдюк» (жирный хвост), слав. «чресла»; κατακαλύπτον τὰ ἐνδόσθια — «покрывающий внутренности». LXX в конце стиха добавляет «и весь тук на внутренностях» — повтор, ср. 7:4."
  4: "νεφροί — «почки»; τὸ ἐπὶ τῶν μηρίων — «на стёгнах»; λοβὸς τοῦ ἥπατος — «лопасть печени» (小葉). В квадратных скобках греч. [σὺν τοῖς νεφροῖς περιελεῖ αὐτά] — «с почками отделит их»; в csl есть, в переводе передано."
  5: "ἀνοίσει — «вознесёт»; κάρπωμα — «сожигаемое»; περὶ πλημμελείας — «жертва повинности»."
  6: "πᾶς ἄρσην ἐκ τῶν ἱερέων — «весь мужской пол из священников»; ἐν τόπῳ ἁγίῳ — «на святом месте»."
  7: "νόμος εἷς αὐτῶν — «закон один для них»; ὁ ἱερεύς, ὅστις ἐξιλάσεται ἐν αὐτῷ — «священник, который очистит в нём»; αὐτῷ ἔσται — «ему будет»."
  8: "δέρμα — «кожа»; ὁλοκαύτωμα ἀνθρώπου — «всесожжение человека», т. е. чьё-либо всесожжение."
  9: "κλίβανος — «печь»; ἐσχάρα — «очаг, жаровня»; τηγάνον — «сковорода»; τοῦ ἱερέως τοῦ προσφέροντος — «священника, приносящего»."
  10: "ἀναπεποιημένη ἐν ἐλαίῳ — «смешанное с елеем»; ἑκάστῳ τὸ ἴσον — «каждому равное»."
  11: "θυσία σωτηρίου — 酬恩祭; νόμος — «закон, устав»."
  12: "περὶ αἰνέσεως — «в благодарение» (αἴνεσις — хвала); ἄρτοι ἐκ σεμιδάλεως — «хлебы из пшеничной муки»; λάγανα — «лепёшки»; διακεχρισμένα — «помазанные»."
  13: "ἄρτοι ζυμῖται — «квасные хлебы»; ἐπὶ θυσίᾳ αἰνέσεως σωτηρίου — «при жертве хвалы спасения»."
  14: "ἀφαίρεμα — «возношение, отделяемое» (献げ物); τῷ προσχέοντι τὸ αἷμα — «возливающему кровь»."
  15: "δωρεῖται — «приносится в дар»; οὐ καταλείψουσιν — «не оставят»; εἰς τὸ πρωί — «до утра»."
  16: "κἂν εὐχή — «если по обету»; ἑκούσιον — «добровольное»; τῇ αὔριον — «на другой день»."
  17: "καταλειφθέν — «оставшееся»; ἕως ἡμέρας τρίτης — «до третьего дня»; κατακαυθήσεται — «будет сожжено»."
  18: "φαγὼν φάγῃ — «если будет есть» (усиление); οὐ δεχθήσεται — «не будет принято»; οὐ λογισθήσεται — «не вменится»; μίασμα — «осквернение»."
  19: "ἅψηται παντὸς ἀκαθάρτου — «прикоснётся к чему-либо нечистому»; πᾶς καθαρός — «всякий чистый»."
  20: "ἡ ἀκαθαρσία αὐτοῦ ἐπ᾿ αὐτοῦ — «нечистота его на нём»; ἀπολεῖται ἐκ τοῦ λαοῦ — «истребится из народа»."
  21: "τετράποδα — «четвероногие»; βδέλυγμα — «мерзость»; ἀπολεῖται — «погибнет»."
  22: "Новое речение."
  23: "στέαρ βοῶν καὶ προβάτων καὶ αἰγῶν — «тук волов, овец и коз»."
  24: "θνησιμαῖος — «падаль»; θηριάλωτος — «растерзанное зверем»; εἰς πᾶν ἔργον — «на всякое дело»."
  25: "ὧν προσάξει αὐτῶν κάρπωμα — «из которых принесёт их сожигаемое»; ἀπολεῖται — «истребится»."
  26: "κατοικία — «жилище, поселение»; ἀπό τε τῶν πετεινῶν — «из птиц»; πᾶν αἷμα — «всякая кровь»."
  27: "πᾶσα ψυχή — «всякая душа», т. е. человек; ἀπολεῖται — «истребится»."
  28: "Новое речение."
  29: "ὁ προσφέρων θυσίαν σωτηρίου — «приносящий мирную жертву»; οἴσει τὸ δῶρον — «принесёт дар»."
  30: "αἱ χεῖρες αὐτοῦ — «руки его»; στηθύνιον — «грудь»; λοβὸς τοῦ ἥπατος — «лопасть печени»; δόμα — «дар» (возношение); ἐπιθεῖναι — «возложить»; ὥστε — «чтобы»."
  31: "ἀνοίσει τὸ στέαρ — «вознесёт тук»; στηθύνιον — грудь остаётся Аарону и сынам."
  32: "βραχίων δεξιός — «правое плечо»; ἀφαίρεμα — «возношение, отделяемое»."
  33: "ὁ προσφέρων τὸ αἷμα … καὶ τὸ στέαρ — «приносящий кровь и тук»; ἐν μερίδι — «в долю»."
  34: "στηθύνιον τοῦ ἐπιθέματος — «грудь возложения»; βραχίων τοῦ ἀφαιρέματος — «плечо возношения»; νόμιμον αἰώνιον — «вечное установление»."
  35: "χρῖσις — «помазание» (здесь — доля, причитающаяся по помазанию; Синодальный — «участок»); προσηγάγετο — «привёл»; ἱερατεύειν — «священнодействовать»."
  36: "ᾗ ἡμέρᾳ ἔχρισεν — «в день, когда помазал»; παρὰ τῶν υἱῶν Ισραηλ — «от сынов Израилевых»."
  37: "τελείωσις — «посвящение, поставление» (任職); перечень шести видов жертв: всесожжение, хлебная, за грех, повинности, посвящения, мирная. 7:37–38 — итоговая формула книги, речь заканчивается в 7:36; в 7:38 Господь назван в третьем лице, поэтому это слова повествователя."
  38: "ἐν τῷ ὄρει Σινα — «на горе Синай»; ἐν τῇ ἐρήμῳ Σινα — «в пустыне Синайской»; προσφέρειν τὰ δῶρα — «приносить дары»."
