verses:
  1: "見[み]よ、正[ただ]しい者[もの]が滅[ほろ]びても、だれも心[こころ]に受[う]け止[と]めず、正[ただ]しい人々[ひとびと]が取[と]り去[さ]られても、だれも悟[さと]らない。正しい者[もの]は不正[ふせい]の前[まえ]から取[と]り去[さ]られたのである。"
  2: "彼[かれ]の埋葬[まいそう]は平和[へいわ]のうちにある。彼[かれ]は中[なか]から取[と]り去[さ]られたのである。"
  3: "「しかし、あなたがたはここに近[ちか]づけ。不法[ふほう]の子[こ]ら、姦淫[かんいん]する者[もの]たちと遊女[ゆうじょ]の種[たね]よ。"
  4: "あなたがたは何[なに]を楽[たの]しみ、だれに向[む]かって口[くち]を開[ひら]き、だれに向[む]かって舌[した]を伸[の]ばしたのか。あなたがたは滅[ほろ]びの子[こ]ら、不法[ふほう]の種[たね]ではないか。"
  5: "木[き]の茂[しげ]みの下[した]で偶像[ぐうぞう]に願[ねが]い求[もと]め、谷間[たにま]や岩[いわ]の間[あいだ]で自分[じぶん]の子[こ]どもを屠[ほふ]る者[もの]たちよ。"
  6: "それがあなたの分[わ]け前[まえ]、それがあなたの嗣業[しぎょう]である。あなたはそれらに注[そそ]ぎの献[ささ]げ物[もの]を注[そそ]ぎ、それらに犠牲[ぎせい]をささげた。これらのことで、わたしは怒[いか]らないのか。"
  7: "高[たか]くそびえる山[やま]の上[うえ]に、あなたの寝床[ねどこ]があり、そこへあなたは犠牲[ぎせい]を携[たずさ]えて上[のぼ]った。"
  8: "あなたは戸口[とぐち]の柱[はしら]のうしろに自分[じぶん]の記念[きねん]のしるしを置[お]いた。あなたは、わたしから離[はな]れれば何[なに]かもっと得[え]られると考[かんが]えた。あなたは自分[じぶん]とともに寝[ね]る者[もの]たちを愛[あい]し、"
  9: "彼[かれ]らとともにあなたの淫行[いんこう]を増[ふ]やし、あなたから遠[とお]い者[もの]を多[おお]くし、使[つか]いたちをあなたの国境[こっきょう]の向[む]こうへ送[おく]った。あなたは身[み]を翻[ひるがえ]して、よみに至[いた]るまで低[ひく]くされた。"
  10: "あなたは多[おお]くの道[みち]を歩[ある]いて疲[つか]れても、『やめよう』と言[い]わなかった。あなたはこれをしたのだから、わたしに祈[いの]り求[もと]めることをしなかった。"
  11: "あなたはだれを畏[おそ]れて恐[おそ]れ、わたしに偽[いつわ]りを言[い]い、わたしを覚[おぼ]えず、わたしを心[こころ]にも思[おも]いにも入[い]れなかったのか。わたしはあなたを見[み]ても軽[かろ]んじ、あなたはわたしを恐[おそ]れなかった。"
  12: "わたしはあなたの義[ぎ]を告[つ]げ、あなたの悪[あく]を告げる。それらはあなたの役[やく]に立[た]たない。"
  13: "あなたが叫[さけ]ぶとき、あなたの苦難[くなん]の中[なか]で、彼[かれ]らにあなたを救[すく]わせよ。風[かぜ]が彼らをみな取[と]り、嵐[あらし]が運[はこ]び去[さ]るからである。しかし、わたしに堅[かた]く結[むす]びつく者[もの]は地[ち]を所有[しょゆう]し、わたしの聖[せい]なる山[やま]を嗣業[しぎょう]として受[う]け継[つ]ぐ。」"
  14: "そして人々[ひとびと]は言[い]う。「彼[かれ]の前[まえ]から道[みち]を清[きよ]め、わたしの民[たみ]の道[みち]からつまずきを取[と]り除[のぞ]け。」"
  15: "いと高[たか]き方[かた]、永遠[えいえん]に高[たか]き所[ところ]に住[す]む主[しゅ]はこう言[い]われる。「その名[な]は聖[せい]なる者[もの]である。いと高[たか]き主[しゅ]は聖[せい]なる者たちの間[あいだ]に住[す]まい、気[き]の弱[よわ]い者[もの]に寛容[かんよう]を与[あた]え、心[こころ]の砕[く]けた者[もの]に命[いのち]を与[あた]える。"
  16: "わたしは永遠[えいえん]にあなたがたを罰[ばっ]せず、いつまでもあなたがたに怒[いか]らない。霊[れい]はわたしから出[で]、わたしはすべての息[いき]を造[つく]ったからである。"
  17: "わたしはその罪[つみ]のゆえに彼[かれ]を少[すこ]しばかり悲[かな]しませ、彼[かれ]を打[う]ち、彼から顔[かお]を背[そむ]けた。すると彼は悲しみ、暗[くら]い顔[かお]をして自分[じぶん]の道[みち]を歩[あゆ]んだ。"
  18: "わたしは彼[かれ]の道[みち]を見[み]て、彼をいやし、彼を慰[なぐさ]め、彼にまことの慰めを与[あた]えた。"
  19: "遠[とお]い者[もの]にも近[ちか]い者[もの]にも、平和[へいわ]の上[うえ]に平和があるように」と主[しゅ]は言[い]われる。「わたしは彼らをいやす。」"
  20: "しかし、悪[あく]しき者[もの]たちはそうして波[なみ]に揺[ゆ]られ、安[やす]らぐことができない。"
  21: "悪[あく]しき者[もの]たちには喜[よろこ]びがない、と主[しゅ]なる神[かみ]は言[い]われる。"

notes:
  1: "Ἴδετε ὡς ὁ δίκαιος ἀπώλετο — «видите, как праведник погиб» (ἀπόλλυμι); ἐκδέχεται τῇ καρδίᾳ — «принимает сердцем» (ἐκδέχομαι); ἄνδρες δίκαιοι αἴρονται — «мужи праведные берутся» (αἴρω — уносить, брать); κατανοεῖ — «уразумевает» (κατανοέω); ἀπὸ προσώπου ἀδικίας ἦρται ὁ δίκαιος — «от лица неправды взят праведник» (передано «不正の前から»). В ru/МТ «восхищается от зла» — иное, по евр."
  2: "ἔσται ἐν εἰρήνῃ ἡ ταφὴ αὐτοῦ — «будет в мире погребение его» (ταφή); ἦρται ἐκ τοῦ μέσου — «взят из среды». В ru/МТ: «Он отходит к миру; ходящие прямым путём будут покоиться на ложах своих» — в LXX и слав. этого нет; слав. «будет с миром погребение его, взяся от среды»."
  3: "ὑμεῖς δὲ προσαγάγετε ὧδε — «вы же приступите сюда» (προσάγω); υἱοὶ ἄνομοι — «сыны беззаконные»; σπέρμα μοιχῶν καὶ πόρνης — «семя прелюбодеев и блудницы» (μοιχός, πόρνη). В ru/МТ «сыновья чародейки» — иное чтение (МТ)."
  4: "ἐν τίνι ἐνετρυφήσατε — «в чём услаждались» (ἐντρυφάω); ἠνοίξατε τὸ στόμα — «отверзли уста»; ἐχαλάσατε τὴν γλῶσσαν — «распустили язык» (χαλάω — опускать, высовывать); τέκνα ἀπωλείας — «чада погибели» (ἀπώλεια); σπέρμα ἄνομον — «семя беззаконное». Риторические вопросы сохранены."
  5: "οἱ παρακαλοῦντες ἐπὶ τὰ εἴδωλα — «призывающие идолов» (παρακαλέω — призывать, умолять); ὑπὸ δένδρα δασέα — «под деревьями густыми» (δασύς); σφάζοντες τὰ τέκνα — «закалающие детей» (σφάζω); φάραγξ — ущелье, дебрь; ἀνὰ μέσον τῶν πετρῶν — «между камнями». В ru «под каждым ветвистым деревом» — иное."
  6: "ἐκείνη σου ἡ μερίς — «та твоя часть» (μερίς); οὗτός σου ὁ κλῆρος — «сей твой жребий» (κλῆρος); ἐξέχεας σπονδάς — «излил возлияния» (σπονδή); ἀνήνεγκας θυσίας — «принёс жертвы» (ἀναφέρω); οὐκ ὀργισθήσομαι — «не разгневаюсь ли» (будущее в вопросе). В ru/МТ «в гладких камнях ручьёв» — иное; в LXX «та твоя часть»."
  7: "ἐπ᾽ ὄρος ὑψηλὸν καὶ μετέωρον — «на гору высокую и превознесённую» (μετέωρος — высокий, парящий); ἐκεῖ σου ἡ κοίτη — «там ложе твоё» (κοίτη); ἀνεβίβασας θυσίας — «вознёс жертвы» (ἀναβιβάζω — поднимать, возносить)."
  8: "ὀπίσω τῶν σταθμῶν τῆς θύρας — «за косяками двери» (σταθμός — столб, косяк); ἔθηκας μνημόσυνά σου — «положила памятные знаки твои» (μνημόσυνον); ᾤου — «думала» (οἴομαι); πλεῖόν τι ἕξεις — «больше нечто будешь иметь»; ἠγάπησας τοὺς κοιμωμένους μετὰ σοῦ — «возлюбила спящих с тобою». Стих продолжается в 57:9 (в гр. нет точки)."
  9: "ἐπλήθυνας τὴν πορνείαν — «умножила блужение» (πορνεία); πολλοὺς ἐποίησας τοὺς μακρὰν ἀπὸ σοῦ — «многих сделала далёкими от себя»; πρέσβεις — «послы»; ὑπὲρ τὰ ὅρια — «за пределы»; ἐταπεινώθης ἕως ᾅδου — «смирилась до ада» (ᾅδης — よみ). В ru/МТ «ходила к царю с благовонною мастью» — по евр., в LXX иного нет."
  10: "ταῖς πολυοδίαις σου ἐκοπίασας — «многими путями утрудилась» (πολυοδία — многопутие); Παύσομαι ἐνισχύουσα — «перестану укрепляться» (ἐνισχύω; слав. «престану крепящься»); οὐ κατεδεήθης μου — «не умолила Меня» (καταδέομαι). В ru/МТ «надежда потеряна… живость в руке» — иное."
  11: "τίνα εὐλαβηθεῖσα ἐφοβήθης — «кого убоявшись устрашилась» (εὐλαβέομαι); ἐψεύσω με — «солгала Мне» (ψεύδομαι); οὐκ ἐμνήσθης μου — «не вспомнила Меня»; ἔλαβές με εἰς τὴν διάνοιαν — «не приняла Меня в ум» (διάνοια); παρορῶ — «презираю, оставляю без внимания» (παροράω). В ru/МТ «Я молчал… перестала бояться» — иное."
  12: "ἀπαγγελῶ — «возвещу» (ἀπαγγέλλω); τὴν δικαιοσύνην μου — в LXX «правду Мою», в слав. «правду твою»; по паритету взято слав. («あなたの義[ぎ]»), вариант LXX — здесь. ἃ οὐκ ὠφελήσουσίν σε — «которые не помогут тебе» (ὠφελέω)."
  13: "ὅταν ἀναβοήσῃς — «когда возопиешь» (ἀναβοάω); ἐξελέσθωσάν σε — «пусть избавят тебя» (ἐξαιρέω, 3-е л. повелительного); ἄνεμος λήμψεται — «ветер возьмёт» (λαμβάνω); καταιγίς — «буря»; ἀποίσει — «унесёт» (ἀποφέρω); οἱ ἀντεχόμενοί μου κτήσονται γῆν — «держащиеся Меня приобретут землю» (κτάομαι); κληρονομήσουσιν τὸ ὄρος τὸ ἅγιόν μου — «наследуют гору святую Мою». Ирония к идолам сохранена."
  14: "καὶ ἐροῦσιν — «и скажут»; Καθαρίσατε ἀπὸ προσώπου αὐτοῦ ὁδοὺς — «очистите пред лицом Его пути» (καθαρίζω); ἄρατε σκῶλα ἀπὸ τῆς ὁδοῦ — «поднимите преткновения с пути» (σκῶλον — преткновение, колода); τοῦ λαοῦ μου — «народа Моего». В ru/МТ «поднимайте, поднимайте, ровняйте» — иное."
  15: "ὁ ὕψιστος ὁ ἐν ὑψηλοῖς κατοικῶν τὸν αἰῶνα — «Вышний, живущий на высотах в век» (ὕψιστος, κατοικέω); ἅγιος ἐν ἁγίοις ὄνομα αὐτῷ — «святой в святых имя Ему» (слав. «святый во святых имя ему»; передано «その名[な]は聖[せい]なる者[もの]である»); κύριος ὕψιστος ἐν ἁγίοις ἀναπαυόμενος — «Господь Вышний, в святых почивающий» (ἀναπαύομαι — почивать, покоиться; передано 住[す]まう); ὀλιγόψυχος — «малодушный» (気[き]の弱[よわ]い者[もの]); μακροθυμία — «долготерпение»; συντετριμμένοι τὴν καρδίαν — «сокрушённые сердцем» (συντρίβω). В LXX нет «Я живу на высоте» (это МТ/ru): речь начинается с описания в 3-м лице, с 57:16 — 1-е лицо."
  16: "Οὐκ εἰς τὸν αἰῶνα ἐκδικήσω — «не в век отмщу» (ἐκδικέω); οὐδὲ διὰ παντὸς ὀργισθήσομαι — «и не всегда буду гневаться» (διά + род.); πνεῦμα παρ᾽ ἐμοῦ ἐξελεύσεται — «дух от Меня изыдет»; πνοὴν πᾶσαν ἐγὼ ἐποίησα — «всякое дыхание Я сотворил» (πνοή). В ru/МТ иначе («иначе изнеможет предо Мною дух»)."
  17: "δι᾽ ἁμαρτίαν βραχύ τι ἐλύπησα αὐτόν — «за грех немного опечалил его» (λυπέω; βραχύ τι — немного); ἐπάταξα — «поразил» (πατάσσω); ἀπέστρεψα τὸ πρόσωπόν μου — «отвратил лицо Моё»; στυγνός — «мрачный, унылый» (слав. «дряхл»); ἐπορεύθη — «пошёл». В ru/МТ «за грех корыстолюбия» — по евр.; в LXX просто «за грех»."
  18: "τὰς ὁδοὺς αὐτοῦ ἑώρακα — «пути его Я видел» (ὁράω); ἰασάμην — «исцелил» (ἰάομαι); παρεκάλεσα — «утешил» (παρακαλέω); ἔδωκα αὐτῷ παράκλησιν ἀληθινήν — «дал ему утешение истинное» (παράκλησις). Стих продолжается в 57:19."
  19: "εἰρήνην ἐπ᾽ εἰρήνην — «мир на мир» (двойной винительный); τοῖς μακρὰν καὶ τοῖς ἐγγὺς οὖσιν — «дальним и близким» (ср. Еф 2:17); εἶπεν κύριος — «сказал Господь»; Ἰάσομαι αὐτούς — «исцелю их». Формула вынесена из кавычек: речь закрывается перед «と主[しゅ]は言[い]われる» и открывается кратким словом «わたしは彼らをいやす」."
  20: "οἱ ἄδικοι — «неправедные»; κλυδωνισθήσονται — «будут волноваться» (κλυδωνίζομαι — быть качаему волнами); ἀναπαύσασθαι οὐ δυνήσονται — «успокоиться не возмогут» (ἀναπαύω). В ru/МТ добавлено «как море взволнованное… ил и грязь» — в LXX и слав. нет."
  21: "οὐκ ἔστιν χαίρειν τοῖς ἀσεβέσιν — «нет радости нечестивым» (χαίρειν — радоваться; слав. «несть радоватися нечестивым»); εἶπεν κύριος ὁ θεός — «сказал Господь Бог». В МТ и ru — «нет мира нечестивым» (שלום); LXX и слав. читают «радоваться», поэтому в тексте 「喜[よろこ]び」, а не 「平和[へいわ]」."
