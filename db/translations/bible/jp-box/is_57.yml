# jp-box, Исаия, глава 57. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc для главы отсутствует; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 57: 1–2 смерть праведника и мир его; 3–13 обличение идолослужения и блуда,
# «Я возвещу правду твою»; 14 призыв очистить путь; 15–19 «Высокий и Превознесённый»,
# «мир на мир», исцеление; 20–21 «нет радости нечестивым».
# Голоса: 1–2 авторский текст; 3–13 речь Господа — 「…」; 14 авторский текст и слова
# глашатаев в 「…」; 15–19 речь Господа — 「…», формула «сказал Господь» вынесена
# из кавычек, слово «исцелю их» — отдельной краткой цитатой; 20–21 авторский текст
# с формулой «сказал Господь Бог» вне кавычек.
# Нумерация по gr: 21 стих; у csl и ru тоже 21, сдвигов нет.
# Слав. добавлений, которых нет в LXX, в главе нет; расхождения чтений — в notes
# (57:12 «правду твою» — слав. по МТ, 57:21 «радоватися» — LXX и слав.).
# 〔…〕 нет; сносок ⟨…⟩ нет: よみ, 嗣業, 粗布, 灰, 偶像 уже в корпусе.
# Имена — транслитерация греческого (LXX).

