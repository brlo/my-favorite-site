verses:
  1: "ヨシャファトは父[ちち]たちとともに眠[ねむ]りにつき、父[ちち]たちとともに、ダビデの町[まち]に葬[ほうむ]られた。そしてその子[こ]ヨラムが彼[かれ]に代[か]わって王[おう]となった。"
  2: "彼[かれ]には、ヨシャファトの子[こ]である兄弟[きょうだい]が六人[ろくにん]いた。アザリヤ、イエヒエル、ゼカリヤ、アザリヤ、ミカエル、シャファトヤである。これらはみな、ユダの王[おう]ヨシャファトの子[こ]たちであった。"
  3: "彼[かれ]らの父[ちち]は彼[かれ]らに、銀[ぎん]と金[きん]、武具[ぶぐ]、ユダにある城壁[じょうへき]の町々[まちまち]など、多[おお]くの贈[おく]り物[もの]を与[あた]えた。しかし王国[おうこく]はヨラムに与[あた]えた。彼[かれ]が長子[ちょうし]であったからである。"
  4: "ヨラムは自分[じぶん]の王位[おうい]に就[つ]いて力[ちから]を強[つよ]め、自分[じぶん]の兄弟[きょうだい]すべてを剣[つるぎ]で殺[ころ]し、イスラエルの首長[しゅちょう]たちのうちの何人[なんにん]かも殺[ころ]した。"
  5: "ヨラムは王[おう]となったとき三十二歳[さんじゅうにさい]で、エルサレムで八年[はちねん]治[おさ]めた。"
  6: "彼[かれ]はイスラエルの王[おう]たちの道[みち]を歩[あゆ]み、アハブの家[いえ]がしたとおりに行[おこな]った。アハブの娘[むすめ]が彼[かれ]の妻[つま]であったからである。そして彼[かれ]は主[しゅ]の前[まえ]に悪[わる]を行[おこな]った。"
  7: "しかし主[しゅ]はダビデの家[いえ]を滅[ほろ]ぼすことを望[のぞ]まれなかった。ダビデと結[むす]んだ契約[けいやく]のゆえであり、また、彼[かれ]とその子[こ]たちにすべての日[ひ]にわたって灯[あかり]を与[あた]えると約束[やくそく]されたからである。"
  8: "そのころ、エドムはユダから離反[りはん]し、自分[じぶん]たちの上[うえ]に王[おう]を立[た]てた。"
  9: "ヨラムは首長[しゅちょう]たちと、彼[かれ]とともにいたすべての騎兵[きへい]を連[つ]れて出[で]陣[じん]した。そして夜[よる]に起[お]き上[あ]がり、彼[かれ]を取[と]り囲[かこ]んでいたエドムと戦車[せんしゃ]の首長[しゅちょう]たちを打[う]ち破[やぶ]った。民[たみ]は自分[じぶん]たちの天幕[てんまく]へ逃[に]げた。"
  10: "エドムは今日[こんにち]までユダから離反[りはん]したままである。そのころ、リブナもまた彼[かれ]の手[て]から離反[りはん]した。彼[かれ]が父[ちち]たちの神[かみ]である主[しゅ]を捨[す]てたからである。"
  11: "彼[かれ]はまた、ユダの町々[まちまち]に高[たか]い所[ところ]を造[つく]り、エルサレムの住民[じゅうみん]を淫行[いんこう]に走[はし]らせ、ユダを迷[まよ]わせた。"
  12: "預言者[よげんしゃ]エリヤから彼[かれ]のもとに手紙[てがみ]が届[とど]いた。こう書[か]いてあった。「あなたの父[ちち]ダビデの神[かみ]である主[しゅ]はこう言[い]われる。あなたは父[ちち]ヨシャファトの道[みち]を歩[あゆ]まず、ユダの王[おう]アサの道[みち]からも外[はず]れた。"
  13: "あなたはイスラエルの王[おう]たちの道[みち]を歩[あゆ]み、アハブの家[いえ]が淫行[いんこう]をしたように、ユダとエルサレムの住民[じゅうみん]を淫行[いんこう]に走[はし]らせ、また、あなたよりも良[よ]い、あなたの父[ちち]の子[こ]らである兄弟[きょうだい]たちを殺[ころ]した。"
  14: "見[み]よ、主[しゅ]はあなたの民[たみ]、あなたの子[こ]ら、あなたの妻[つま]たち、およびあなたのすべての財産[ざいさん]に、大[おお]きな災[わざわ]いを下[くだ]す。"
  15: "あなた自身[じしん]は重[おも]い病[やまい]、すなわち腹[はら]の病[やまい]にかかり、ついにあなたの内臓[ないぞう]が病[やまい]とともに、日[ひ]から日[ひ]へと出[で]てくるであろう。」"
  16: "主[しゅ]はヨラムに対[たい]して、ペリシテ人[じん]、アラビア人[じん]、およびエチオピア人[じん]に隣接[りんせつ]する者[もの]たちを奮[ふる]い立[た]たせた。"
  17: "彼[かれ]らはユダに上[のぼ]って来[き]て、これに打[う]ち勝[か]ち、王[おう]の家[いえ]で見[み]つけたすべての財産[ざいさん]、および彼[かれ]の子[こ]ら、娘[むすめ]たち、妻[つま]たちを奪[うば]い去[さ]った。彼[かれ]には、末[すえ]の子[こ]であるアハズヤのほか、子[こ]は一人[ひとり]も残[のこ]らなかった。"
  18: "このすべての後[あと]、主[しゅ]は彼[かれ]を打[う]って、腹[はら]に癒[い]えない病[やまい]を負[お]わせた。"
  19: "そして日[ひ]が過[す]ぎて、二日[ふつか]という時[とき]が来[く]ると、彼[かれ]の内臓[ないぞう]が病[やまい]とともに出[で]てきて、彼[かれ]は重[おも]い病[やまい]のうちに死[し]んだ。しかし民[たみ]は彼[かれ]のために、父[ちち]たちの葬儀[そうぎ]に等[ひと]しい葬儀[そうぎ]を行[おこな]わなかった。"
  20: "彼[かれ]は王[おう]となったとき三十二歳[さんじゅうにさい]で、エルサレムで八年[はちねん]治[おさ]めた。彼[かれ]はほめたたえられないまま歩[あゆ]み、ダビデの町[まち]に葬[ほうむ]られたが、王[おう]たちの墓[はか]には葬[ほうむ]られなかった。"

notes:
  1: "ἐκοιμήθη — «почил» (κοιμάω в значении смерти); ἐτάφη παρὰ τοῖς πατράσιν — «погребён у отцов» (слав. «погребен бысть с ними»). ἀντ᾽ αὐτοῦ — «вместо него»."
  2: "ἕξ — шесть братьев (слав. «шесть»). Имена: Αζαριας — Азария (アザリヤ), Ιιηλ — Иехиил (イエヒエル; слав. «иеил»), Ζαχαριας — Захария (ゼカリヤ), Μιχαηλ — Михаил (ミカエル), Σαφατιας — Сафатия (シャファトヤ). Азария назван дважды — так в гр."
  3: "δόματα πολλά — многие дары; ὅπλα — оружие (слав. «оружие»; в ru «драгоценности» — по МТ). μετὰ πόλεων τετειχισμένων — «с укреплёнными городами» (τειχίζω — обносить стеной). πρωτότοκος — первенец."
  4: "ἐκραταιώθη — «укрепился» (κραταιόω). ἐν ῥομφαίᾳ — мечом (ῥομφαία, большой меч). ἀπὸ τῶν ἀρχόντων Ισραηλ — «из начальников Израиля», т. е. некоторых из них."
  5: "ὄντος αὐτοῦ τριάκοντα καὶ δύο ἐτῶν — «когда ему было 32 года». κατέστη ἐπὶ τὴν βασιλείαν — «встал на царство»."
  6: "ἐν ὁδῷ βασιλέων Ισραηλ — путём царей Израиля. ὡς ἐποίησεν οἶκος Αχααβ — «как сделал дом Ахава». θυγάτηρ Αχααβ — дочь Ахава (Аталия; в 4Цар 8:18 тоже «дочь Ахава», хотя по МТ она дочь Амврия, ср. 22:2). ἐναντίον κυρίου — пред Господом."
  7: "οὐκ ἐβούλετο — «не хотел». ἐξολεθρεῦσαι — истребить (ἐξολεθρεύω). διὰ τὴν διαθήκην — ради завета. λύχνον — светильник (слав. «светилник»): образ непрерывного царства (ср. 3Цар 11:36)."
  8: "ἐν ταῖς ἡμέραις ἐκεῖναις — «в те дни». ἀπέστη — отложился (ἀφίστημι). ἐβασίλευσαν ἐφ᾽ ἑαυτούς — «поставили над собою царя»."
  9: "ᾤχετο — «пошёл» (οἴχομαι). ἡ ἵππος — конница (собир.). ἠγέρθη νυκτός — «встал ночью». τὸν κυκλοῦντα αὐτόν — «окружавшего его». ἅρματα — колесницы (戦車). σκηνώματα — шатры, селения."
  10: "ἕως τῆς ἡμέρας ταύτης — до сего дня. Λομνα — Ловна, она же Ливна (リブナ; слав. «ловна»). ἀπὸ χειρὸς αὐτοῦ — «из-под руки его», из-под власти. ἐγκατέλιπεν — оставил (ἐγκαταλείπω)."
  11: "ὑψηλά — высоты (高い所). ἐξεπόρνευσεν — «ввёл в блуд» (ἐκπορνεύω; слав. «блудити сотвори»). ἀπεπλάνησεν — совратил (ἀποπλανάω)."
  12: "ἐγγραφή — «письмо, запись» (слав. «писание»). Ἡλιου — Илии (エリヤ; в евр. и ru — Илия). Ἀνθ᾽ ὧν — «за то, что» (слав. «понеже»). ὁ θεὸς Δαυιδ τοῦ πατρός σου — Бог Давида, отца твоего. ἐν ὁδῷ Ιωσαφατ — путём Иосафата; ἐν ὁδοῖς Ασα — путями Асы (слав. добавляет «царя иудина» — внесено в текст)."
  13: "ἐν ὁδοῖς βασιλέων Ισραηλ — путями царей Израиля. ὡς ἐξεπόρνευσεν οἶκος Αχααβ — как блудил дом Ахава. τοὺς ἀγαθοὺς ὑπὲρ σέ — «лучших, чем ты». ἀπέκτεινας — убил."
  14: "πατάξει σε πληγὴν μεγάλην — «поразит тебя ударом великим» (внутренний объект). ἀποσκευή — имущество, достояние (слав. «имение»)."
  15: "ἐν μαλακίᾳ πονηρᾷ — «в болезни злой» (μαλακία — слабость, болезнь). νόσος κοιλίας — болезнь чрева (κοιλία — чрево, внутренности). ἐξ ἡμερῶν εἰς ἡμέρας — «от дней в дни», день за днём."
  16: "ἐπήγειρεν — воздвиг (ἐπεγείρω). ἀλλόφυλοι — иноплеменники, филистимляне (ペリシテ人). ὁμόρους τῶν Αἰθιόπων — «соседних с эфиопами» (ὅμορος — сопредельный)."
  17: "κατεδυνάστευον — «одолевали» (καταδυναστεύω). ἀποσκευή — имущество. οὐ κατελείφθη — не остался. μικρότατος — младший (превосх. степень). Слав. добавляет «и жены его» — в гр только сыновья и дочери; внесено в текст по паритету."
  18: "εἰς τὴν κοιλίαν — «в чрево». ἐν ᾗ οὐκ ἔστιν ἰατρεία — «при которой нет исцеления» (ἰατρεία)."
  19: "ἐξ ἡμερῶν εἰς ἡμέρας — день за днём. καιρὸς τῶν ἡμερῶν ἡμέρας δύο — тёмное место: «время дней — два дня» (слав. «время дний два дни»); в ru «к концу второго года» — по МТ. ἐκφορά — вынос, погребальное шествие (слав. «погребение»); в ru «не сожег благовоний» — по МТ."
  20: "ἐν οὐκ ἐπαίνῳ — «не в похвале» (слав. «не хвально»; в ru «неоплаканный» — по МТ). ἐτάφη ἐν πόλει Δαυιδ — погребён в городе Давида. οὐκ ἐν τάφοις τῶν βασιλέων — не в гробницах царей."
