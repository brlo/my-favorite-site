# jp-box, 2-я Паралипоменон, глава 21. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Нумерация по gr: 20 стихов, совпадает с csl/ru.
# Глава 21: воцарение Иорама и убийство братьев (1–4), его лета и нечестие
# (5–7), отпадение Едома и Ливны (8–10), высоты (11), письмо Илии (12–15),
# нашествие филистимлян и арабов (16–17), болезнь и смерть (18–20).
# Паритет: слав. чтения внесены в основной текст без скобок (12 «царя иудина»
# при Асе, 17 «и жены его», 19 «два дни»); варианты LXX — в notes.
# Речь — 「…」 (12–15), открывается в 12 и закрывается в 15. Красного нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: 契約, 預言者, 高い所, 灯 уже в корпусе.
# jp-ni не использовался.

