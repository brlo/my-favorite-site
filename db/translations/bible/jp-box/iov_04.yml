# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: 4:1 — формула Елифаза (повествование, вне кавычек); 4:2–21 — речь Елифаза,
# одна цитата, которая продолжается в главе 5 (5:1–27). В конце 4:21 стоит 「」
# только для баланса главы; в 5:1 цитата открывается снова (в notes 4:21 отмечено).
# Внутри речи Елифаза 4:17–21 — слова духа в ночном видении, поэтому 『…』.
# Поэзия: 4:7–11, 4:17–21; параллелизмы не сглажены.
# Голос: 4:1 повествование; 4:2–16 Елифаз — 「…」; 4:17–21 слова духа — 『…』
# внутри речи Елифаза.
# Нумерация по gr: 21 стих; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все 21 стих есть в gr-lxx-byz. Сносок ⟨…⟩ нет: テマン人, 天使, 粘土, 竜
