chapter: 4
draft: true

verses:
  1: "テマン人[じん]エリファズは答[こた]えて言[い]った。"
  2: "「あなたにはこれまで、何度[なんど]も、苦労[くろう]のうちに語[かた]られてきたのではないか。だが、あなたの言葉[ことば]の力[ちから]には、だれが耐[た]えられようか。"
  3: "見[み]よ、あなたは多[おお]くの者[もの]を教[おし]え、弱[よわ]い手[て]を励[はげ]ましてきた。"
  4: "弱[よわ]い者[もの]たちをあなたの言葉[ことば]は起[おこ]し、弱[よわ]った膝[ひざ]に力[ちから]を与[あた]えた。"
  5: "しかし今[いま]、苦[くる]しみがあなたに臨[のぞ]むと、あなたは耐[た]えられず、あなたに触[ふ]れると、あなたは動揺[どうよう]した。"
  6: "あなたの恐[おそ]れも、あなたの望[のぞ]みも、あなたの道[みち]の無垢[むく]さも、愚[おろ]かさのうちにあるのではないか。"
  7: "思[おも]い起[おこ]せ。だれが清[きよ]い者[もの]であって滅[ほろ]びたか。また、真実[しんじつ]な者[もの]たちが根[ね]こそぎ滅[ほろ]ぼされたことがあったか。"
  8: "不法[ふほう]を耕[たがや]す者[もの]たちを見[み]てきたとおり、それを蒔[ま]く者[もの]は自分[じぶん]のために苦[くる]しみを刈[か]り取[と]る。"
  9: "彼[かれ]らは主[しゅ]の命令[めいれい]によって滅[ほろ]び、その怒[いか]りの息[いき]によって消[き]え去[さ]る。"
  10: "獅子[しし]の力[ちから]も、雌獅子[めじし]の声[こえ]も、竜[りゅう]たちの誇[ほこ]りも消[き]え去[さ]った。"
  11: "蟻獅子[ありじし]は獲物[えもの]がなくて滅[ほろ]び、獅子[しし]の子[こ]らは互[たが]いに離[はな]れ去[さ]った。"
  12: "もしあなたの言葉[ことば]のうちに真実[しんじつ]の言葉[ことば]が一[ひと]つでもあったなら、これらの災[わざわ]いのどれもあなたに臨[のぞ]まなかっただろう。わたしの耳[みみ]は、神[かみ]から出[で]る驚[おどろ]くべきことを聞[き]き取[と]ったのではないか。"
  13: "恐[おそ]れと夜[よる]の響[ひび]き、人[ひと]々[びと]の上[うえ]に恐[おそ]れが降[ふ]りかかるとき、"
  14: "戦慄[せんりつ]と震[ふる]えがわたしを襲[おそ]い、わたしの骨[ほね]を激[はげ]しく震[ふる]わせた。"
  15: "霊[れい]がわたしの顔[かお]の上[うえ]を過[す]ぎた。わたしの毛[け]も肉[にく]も震[ふる]えた。"
  16: "わたしは立[た]ったが、見分[みわ]けられなかった。見[み]たが、わたしの目[め]の前[まえ]に形[かたち]はなかった。ただ、静[しず]かな息[いき]と声[こえ]を聞[き]いた。"
  17: "『いったい、人[ひと]は主[しゅ]の前[まえ]で清[きよ]い者[もの]でありえようか。男[おとこ]は自分[じぶん]の業[わざ]によって無垢[むく]でありえようか。"
  18: "見[み]よ、神[かみ]はご自分[じぶん]の僕[しもべ]たちをも信頼[しんらい]しない。ご自分の天使[てんし]たちのうちにも曲[ま]がったものを見出[みいだ]された。"
  19: "まして、粘土[ねんど]の家[いえ]に住[す]み、その基[もとい]が土[つち]の塵[ちり]である者[もの]たちは、虫[むし]のように打[う]たれた。"
  20: "朝[あさ]から夕[ゆうべ]までの間[あいだ]に、彼[かれ]らはもはやいない。自分[じぶん]たちを助[たす]けられないので、滅[ほろ]びる。"
  21: "神[かみ]が彼[かれ]らに息[いき]を吹[ふ]きかけると、彼[かれ]らは乾[かわ]き、知恵[ちえ]がなかったために滅[ほろ]びる。』」"

notes:
  1: "Повествование. Ὑπολαβὼν δὲ Ελιφας ὁ Θαιμανίτης λέγει — «и отвечал Елифаз Феманитин и говорит» (ὑπολαμβάνω — подхватывать, отвечать; λέγει — историческое настоящее). Вводная формула вне кавычек."
  2: "Елифаз — 「…」, речь продолжается в главе 5 (см. 4:21). Μὴ πολλάκις σοι λελάληται ἐν κόπῳ; — «не часто ли тебе было говорено в труде?» (безличный пассив; ἐν κόπῳ — с трудом, утомительно). ἰσχὺν δὲ ῥημάτων σου τίς ὑποίσει; — «но силу слов твоих кто вынесет?» Тёмное место; возможный смысл: тебе не раз говорили тяжёлое, но кто вынесет твои слова."
  3: "Елифаз. εἰ γὰρ σὺ ἐνουθέτησας πολλούς — «ибо вот, ты наставил многих» (νουθετέω — вразумлять). χεῖρας ἀσθενοῦς παρεκάλεσας — «руки слабого укрепил, утешил» (παρακαλέω)."
  4: "Елифаз. ἀσθενοῦντάς τε ἐξανέστησας ῥήμασιν — «немощных воздвиг словами» (ἐξανίστημι). γόνασίν τε ἀδυνατοῦσιν θάρσος περιέθηκας — «коленам бессильным бодрость возложил» (θάρσος — мужество, бодрость; περιτίθημι — возлагать)."
  5: "Елифаз. νῦν δὲ ἥκει ἐπὶ σὲ πόνος — «ныне пришла на тебя болезнь, страдание». ἥψατό σου — «коснулось тебя». σὺ δὲ ἐσπούδασας — «ты же поспешил, смутился» (σπουδάζω — спешить, тревожиться); csl «возмутился еси»."
  6: "Елифаз. πότερον οὐχ ὁ φόβος σού ἐστιν ἐν ἀφροσύνῃ — «разве страх твой не в безумии?» καὶ ἡ ἐλπίς σου καὶ ἡ ἀκακία τῆς ὁδοῦ σου — «и надежда твоя, и незлобие пути твоего». Тёмное место LXX; csl: «еда страх твой есть не в безумии, и надежда твоя и злоба пути твоего» (ἀκακία — «незлобие», csl «злоба» — иное чтение; в тексте LXX 無垢)."
  7: "Елифаз. μνήσθητι οὖν — «вспомни же». τίς καθαρὸς ὢν ἀπώλετο — «кто, будучи чистым, погиб?» ἢ πότε ἀληθινοὶ ὁλόρριζοι ἀπώλοντο — «или когда истинные все с корнем погибли?» (ὁλόρριζος — исторгнутый с корнем)."
  8: "Елифаз. καθ᾽ ὃν τρόπον εἶδον τοὺς ἀροτριῶντας τὰ ἄτοπα — «как я видел пашущих непотребное» (ἄτοπα — нелепое, беззаконное). οἱ σπείροντες αὐτὰ ὀδύνας θεριοῦσιν ἑαυτοῖς — «сеющие их пожнут себе страдания» (θερίζω — жать)."
  9: "Елифаз. ἀπὸ προστάγματος κυρίου ἀπολοῦνται — «от повеления Господня погибнут» (πρόσταγμα — повеление). ἀπὸ δὲ πνεύματος ὀργῆς αὐτοῦ ἀφανισθήσονται — «от духа гнева Его исчезнут» (ἀφανίζω — уничтожать)."
  10: "Елифаз. σθένος λέοντος, φωνὴ δὲ λεαίνης — «сила льва, голос львицы» (σθένος — сила; λέαινα — львица). γαυρίαμα δὲ δρακόντων ἐσβέσθη — «гордость драконов угасла» (γαυρίαμα — величание; δράκων); в тексте 竜, в 40–41 δράκων — レビヤタン. csl: «веселие же змиев угасе»."
  11: "Елифаз. μυρμηκολέων ὤλετο παρὰ τὸ μὴ ἔχειν βοράν — «муравьиный лев погиб, потому что не имел пищи» (μυρμηκολέων, букв. «муравьиный лев»; слав. «мраволев»). σκύμνοι δὲ λεόντων ἔλιπον ἀλλήλους — «а скимны львов оставили друг друга» (σκύμνος — львёнок)."
  12: "Елифаз. εἰ δέ τι ῥῆμα ἀληθινὸν ἐγεγόνει ἐν λόγοις σου — «если же какое истинное слово было в словах твоих». οὐθὲν ἄν σοι τούτων κακὸν ἀπήντησεν — «никакое из этих зол не постигло бы тебя». πότερον οὐ δέξεταί μου τὸ οὖς ἐξαίσια παρ᾽ αὐτοῦ; — «разве не примет ухо моё необычайное от Него?» (ἐξαίσιος — необычайный; αὐτοῦ — Бога, не названного прямо)."
  13: "Елифаз. φόβοι δὲ καὶ ἠχὼ νυκτερινή — «страхи и ночной шум, отзвук» (ἠχώ — звук, отзвук). ἐπιπίπτων φόβος ἐπ᾽ ἀνθρώπους — «когда страх нападает на людей»; синтаксис обрывочен, как в греч."
  14: "Елифаз. φρίκη δέ μοι συνήντησεν καὶ τρόμος — «ужас и трепет встретили меня» (φρίκη — дрожь, ужас). μεγάλως μου τὰ ὀστᾶ συνέσεισεν — «сильно потряс кости мои» (σείω — трясти)."
  15: "Елифаз. πνεῦμα ἐπὶ πρόσωπόν μου ἐπῆλθεν — «дух нашёл на лицо моё» (πνεῦμα — дыхание, дух). ἔφριξαν δέ μου τρίχες καὶ σάρκες — «волосы и плоть моя вострепетали»."
  16: "Елифаз. ἀνέστην, καὶ οὐκ ἐπέγνων — «я встал и не узнал». οὐκ ἦν μορφὴ πρὸ ὀφθαλμῶν μου — «не было образа пред очами моими» (μορφή). ἀλλ᾽ ἢ αὔραν καὶ φωνὴν ἤκουον — «но только веяние и голос я слышал» (αὔρα — дуновение, ветерок); с этого места начинается речь духа, 4:17–21 — 『…』."
  17: "Слова духа внутри речи Елифаза — 『…』, до конца главы. Τί γάρ; — «что же?» μὴ καθαρὸς ἔσται βροτὸς ἐναντίον κυρίου — «разве будет чист смертный пред Господом?» (βροτός — смертный). ἢ ἀπὸ τῶν ἔργων αὐτοῦ ἄμεμπτος ἀνήρ — «или от дел своих непорочен муж?»"
  18: "Слова духа. εἰ κατὰ παίδων αὐτοῦ οὐ πιστεύει — «если Он слугам Своим не доверяет» (κατά с род. — в отношении). κατὰ δὲ ἀγγέλων αὐτοῦ σκολιόν τι ἐπενόησεν — «и в ангелах Своих усмотрел нечто кривое» (σκολιός — кривой, лукавый)."
  19: "Слова духа. τοὺς κατοικοῦντας οἰκίας πηλίνας — «живущих в домах глиняных» (πήλινος). ἐξ ὧν καὶ αὐτοὶ ἐκ τοῦ αὐτοῦ πηλοῦ ἐσμεν — «из которых и мы сами из той же глины». ἔπαισεν αὐτοὺς σητὸς τρόπον — «поразил их подобно моли» (σής — моль)."
  20: "Слова духа. ἀπὸ πρωίθεν ἕως ἑσπέρας οὐκέτι εἰσίν — «от утра до вечера их уже нет». παρὰ τὸ μὴ δύνασθαι αὐτοὺς ἑαυτοῖς βοηθῆσαι ἀπώλοντο — «потому что не могут себе помочь, погибли» (παρά с вин. — по причине)."
  21: "Слова духа; здесь закрываются 『』 речи духа и 「」 речи Елифаза, но сама речь Елифаза продолжается в главе 5 (5:1–27) — в 5:1 цитата открывается снова. ἐνεφύσησεν γὰρ αὐτοῖς καὶ ἐξηράνθησαν — «ибо Он дунул на них, и они иссохли» (ἐμφυσάω — дунуть; ξηραίνω — сушить). ἀπώλοντο παρὰ τὸ μὴ ἔχειν αὐτοὺς σοφίαν — «погибли, потому что не имели мудрости»."
