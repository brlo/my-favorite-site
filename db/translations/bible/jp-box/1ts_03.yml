# jp-box, 1-я Царств, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: слово Господне редко (1), Илий и лампада (2–3), троекратный зов и ответ
# Самуила (4–9), призвание и пророчество о доме Илия (10–14), утро и настояние
# Илия (15–18), Самуил — пророк всего Израиля (19–21).
# Речь Бога — 「…」: 4, 10–14; речь людей — 「…」: 5, 6, 8, 9, 16, 17, 18; слова,
# которые Самуил должен сказать, — 『…』: 9. Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе). Славянский
# в ст. 6 и 10 добавляет слова, которых в греческом нет; они не переведены.
# Сносок ⟨…⟩ нет: глава не вводит новых терминов корпуса.
# jp-ni не использовался.

tr_code: jp-box
book: 1ts
chapter: 3
draft: true

verses:
  1: "幼[おさな]いサムエルは祭司[さいし]エリの前[まえ]で、主[しゅ]に仕[つか]えていた。そのころ、主の言葉[ことば]は貴[とうと]く、幻[まぼろし]が示[しめ]されることはなかった。"
  2: "ある日[ひ]、エリは自分[じぶん]の場所[ばしょ]で眠[ねむ]っていた。彼の目[め]は重[おも]くなり始[はじ]め、見[み]ることができなくなっていた。"
  3: "神[かみ]のともしびがまだ消[き]えていないうちに、サムエルは神の契約[けいやく]の箱[はこ]のある神殿[しんでん]で眠っていた。"
  4: "主[しゅ]はサムエル、サムエルと呼[よ]ばれた。彼は言[い]った。「はい、わたしだ。」"
  5: "彼はエリのもとへ走[はし]って行[い]き、言った。「はい、わたしだ。お呼[よ]びになったのではないか。」エリは言った。「わたしは呼んでいない。戻[もど]って眠りなさい。」彼は戻って眠った。"
  6: "主[しゅ]は再[ふたた]びサムエル、サムエルと呼[よ]ばれた。サムエルは起[お]きてエリのもとへ行[い]き、言った。「はい、わたしだ。お呼びになったのではないか。」エリは言った。「わたしは呼んでいない、わが子[こ]よ。戻って眠りなさい。」"
  7: "サムエルはまだ神[かみ]を知[し]らず、主[しゅ]の言葉[ことば]もまだ彼に現[あらわ]されていなかった。"
  8: "主[しゅ]は三度目[さんどめ]にもサムエルを呼[よ]ばれた。彼は立[た]ってエリのもとへ行き、言った。「はい、わたしだ。お呼びになったのではないか。」そこでエリは、主が子[こ]どもを呼んでおられることを悟[さと]った。"
  9: "エリは言った。「戻って眠りなさい、わが子[こ]よ。もし呼ばれたら、こう言いなさい。『話[はな]してください、主[しゅ]よ。しもべは聞[き]いております。』」サムエルは行[い]って、自分[じぶん]の場所[ばしょ]で眠った。"
  10: "主[しゅ]は来[こ]られ、立[た]って、前[まえ]と同[おな]じように彼を呼[よ]ばれた。サムエルは言った。「話[はな]してください。しもべは聞[き]いております。」"
  11: "主[しゅ]はサムエルに言[い]われた。「見[み]よ、わたしはイスラエルでわたしの言葉[ことば]を行[おこな]う。それを聞[き]く者[もの]はだれでも、両方[りょうほう]の耳[みみ]が鳴[な]り響[ひび]く。"
  12: "その日[ひ]、わたしはエリの家[いえ]について語[かた]ったことをすべて、彼に対して起[お]こす。始[はじ]め、また終[お]える。"
  13: "わたしは彼に告[つ]げた。わたしが彼の家[いえ]を永遠[えいえん]に裁[さば]くのは、その息子[むすこ]たちの悪[わる]のゆえである。息子たちが神[かみ]を罵[ののし]っているのに、彼はそれでも彼らを戒[いまし]めなかったからである。"
  14: "だから、わたしはエリの家[いえ]に誓[ちか]った。エリの家の悪[あく]が、香[こう]によっていけにえによっていつまでも贖[あがな]われることはない、と。」"
  15: "サムエルは朝[あさ]まで眠り、朝早く起[お]きて主[しゅ]の家[いえ]の戸[と]を開[あ]けた。しかしサムエルは、その幻[まぼろし]をエリに告[つ]げるのを恐[おそ]れた。"
  16: "エリはサムエルに言った。「サムエル、わが子[こ]よ。」彼は言った。「はい、わたしだ。」"
  17: "エリは言った。「あなたに語[かた]られた言葉[ことば]は何[なん]か。わたしに隠[かく]してはならない。もしあなたが、あなたに語られたすべての言葉のうち、一[ひと]つでもわたしに隠すなら、神[かみ]があなたにこうし、さらにこう重[かさ]ねてくださるように。」"
  18: "サムエルはすべての言葉を告[つ]げ、何[なに]一[ひと]つ隠[かく]さなかった。エリは言った。「主[しゅ]はご自身[じしん]である。主の前[まえ]に良[よ]いと思[おも]われることをなさる。」"
  19: "サムエルは育[そだ]って行[い]き、主[しゅ]は彼とともにおられた。主の言葉[ことば]は、一[ひと]つとして地[ち]に落[お]ちなかった。"
  20: "ダンからベエル・シェバに至[いた]るまで、イスラエルすべての者[もの]は、サムエルが主[しゅ]に忠実[ちゅうじつ]な預言者[よげんしゃ]であることを知[し]った。"
  21: "主[しゅ]は再びシロで自[みずか]らを示[しめ]された。主がサムエルに自らを現[あらわ]されたからである。サムエルが、地[ち]の果[は]てから果てまで、すべてのイスラエルに対して主の預言者[よげんしゃ]であることが認[みと]められた。エリは非常[ひじょう]に年[とし]を取っていた。彼の息子[むすこ]たちは歩[ある]み続[つづ]け、その道[みち]は主の前[まえ]で悪[わる]かった。"

notes:
  1: "ῥῆμα κυρίου ἦν τίμιον — слово Господне было драгоценно, т. е. редко (τίμιος — ценный). οὐκ ἦν ὅρασις διαστέλλουσα — не было видения различающего, являющего (διαστέλλω — разделять, различать); слав. «не бе видение посылаемо». 幻 — ὅρασις."
  2: "ἐκάθευδεν ἐν τῷ τόπῳ αὐτοῦ — спал на своём месте. οἱ ὀφθαλμοὶ αὐτοῦ ἤρξαντο βαρύνεσθαι — глаза начали отяжелевать (βαρύνω). οὐκ ἠδύνατο βλέπειν — не мог видеть."
  3: "ὁ λύχνος τοῦ θεοῦ — светильник Божий. πρὶν ἐπισκευασθῆναι — прежде чем его заправят, поправят (ἐπισκευάζω): до утреннего угасания. ἐν τῷ ναῷ — в храме, здесь о скинии. κιβωτὸς τοῦ θεοῦ — ковчег Божий, без διαθήκη; по корпусу передано 契約の箱."
  4: "ἐκάλεσεν κύριος Σαμουηλ Σαμουηλ — воззвал Господь: «Самуил, Самуил». Ἰδοὺ ἐγώ — вот я, ответ на зов; передано はい、わたしだ."
  5: "ἔδραμεν — побежал (τρέχω). κέκληκάς με — ты позвал меня (perfect с настоящим значением). ἀνάστρεφε κάθευδε — возвратись и спи (ἀναστρέφω — поворачивать назад)."
  6: "προσέθετο κύριος καλέσαι — Господь приложил, т. е. снова позвал (προστίθημι). τὸ δεύτερον — во второй раз. Слав. добавляет «чадо мое» — в греческом этого нет, поэтому не переведено."
  7: "πρὶν ἢ γνῶναι θεὸν καὶ ἀποκαλυφθῆναι αὐτῷ ῥῆμα κυρίου — прежде чем Самуил познал Бога и открылось ему слово Господне. Незавершённость фразы и порядок слов сохранены."
  8: "προσέθετο… καλέσαι… ἐν τρίτῳ — снова позвал, в третий раз. ἐσοφίσατο Ηλι — Илий уразумел, понял (σοφίζω — делать мудрым): понял, что зовёт Господь."
  9: "Ἀνάστρεφε κάθευδε, τέκνον — возвратись и спи, чадо. Λάλει, κύριε, ὅτι ἀκούει ὁ δοῦλός σου — говори, Господи, ибо слышит раб Твой; по решению партии 話してください。しもべは聞いております. Слова, которые Самуил должен сказать, — 『…』."
  10: "ἦλθεν κύριος καὶ κατέστη — пришёл Господь и стал (καθίστημι — встать, предстать). ὡς ἅπαξ καὶ ἅπαξ — как раз и раз, т. е. как прежде, тем же образом. Слав. добавляет «самуиле, самуиле», в греческом имени здесь нет."
  11: "ἃ ἐγὼ ποιῶ τὰ ῥήματά μου — Я делаю слова Мои, т. е. исполняю сказанное. ἠχήσει ἀμφότερα τὰ ὦτα αὐτοῦ — зазвенят оба уха его: образ потрясения."
  12: "ἐπεγερῶ ἐπὶ Ηλι — воздвигну на Илия (ἐπεγείρω). ἄρξομαι καὶ ἐπιτελέσω — начну и окончу: исполню всё до конца."
  13: "ἀνήγγελκα — я возвестил (perfect). ἐκδικῶ — взыскиваю, мщу (ἐκδικέω). ἐν ἀδικίαις υἱῶν αὐτοῦ — за беззакония сыновей его. κακολογοῦντες θεὸν — злословящие Бога (κακολογέω). οὐκ ἐνουθέτει αὐτοὺς καὶ οὐδ᾽ οὕτως — не вразумлял их и так (ἐνουθετέω — вразумлять, увещевать)."
  14: "ὤμοσα τῷ οἴκῳ Ηλι — поклялся дому Илия. Εἰ ἐξιλασθήσεται — «если умилостивится»: еврейская формула клятвы-отрицания, т. е. «не умилостивится» (ἐξιλάσκομαι — умилостивлять, искупать). ἐν θυμιάματι καὶ ἐν θυσίαις — фимиамом и жертвами."
  15: "κοιμᾶται ἕως πρωΐ — спал до утра. ὤρθρισεν — встал рано (ὀρθρίζω). ἤνοιξεν τὰς θύρας οἴκου κυρίου — открыл двери дома Господня. ἐφοβήθη ἀπαγγεῖλαι — побоялся возвестить."
  16: "Σαμουηλ τέκνον — «Самуил, чадо». Ἰδοὺ ἐγώ — вот я."
  17: "Τί τὸ ῥῆμα τὸ λαληθέν — что за слово сказанное. μὴ δὴ κρύψῃς ἀπ᾽ ἐμοῦ — не скрой же от меня. τάδε ποιήσαι σοι ὁ θεὸς καὶ τάδε προσθείη — так да сотворит тебе Бог и так да приложит: формула заклятия (ср. 20:13). ἐὰν κρύψῃς… ῥῆμα ἐκ πάντων τῶν λόγων — если скроешь слово из всех слов."
  18: "ἀπήγγειλεν… πάντας τοὺς λόγους — возвестил все слова. οὐκ ἔκρυψεν — не скрыл. Κύριος αὐτός — «Господь Сам» (слав. «Господь сам»). τὸ ἀγαθὸν ἐνώπιον αὐτοῦ ποιήσει — благое пред Ним сотворит; по решению партии 主は良いと思われることをされる."
  19: "ἐμεγαλύνθη Σαμουηλ — Самуил возрастал. οὐκ ἔπεσεν ἀπὸ πάντων τῶν λόγων αὐτοῦ ἐπὶ τὴν γῆν — не пало ни одно из слов его на землю: всё исполнялось."
  20: "ἀπὸ Δαν καὶ ἕως Βηρσαβεε — от Дана до Вирсавии: весь Израиль, от севера до юга. πιστὸς Σαμουηλ εἰς προφήτην τῷ κυρίῳ — Самуил верен как пророк Господу."
  21: "προσέθετο κύριος δηλωθῆναι — Господь продолжал являть Себя (δηλόω — показывать). ἀπεκαλύφθη κύριος πρὸς Σαμουηλ — открылся Господь Самуилу. ἐπιστεύθη Σαμουηλ προφήτης γενέσθαι — Самуил был признан пророком (πιστεύω в пассиве — быть признанным верным). ἀπ᾿ ἄκρων τῆς γῆς καὶ ἕως ἄκρων — от краёв земли и до краёв. πορευόμενοι ἐπορεύοντο — ходя ходили (усиление): продолжали ходить своими путями."
