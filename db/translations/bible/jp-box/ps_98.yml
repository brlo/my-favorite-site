# Псалом 98: 9 стихов (было 10; надписание у нас — ст. 0).
# Надписание влито в ст. 1; далее наш k = csl k.
# Текст сохранён: надписание влито в ст. 1 без потери слов; notes приведены к новым номерам (note 0 влит в note 1).
# Ниже — прежняя шапка: номера в ней — прежние (по LXX/gr), notes — по прежним номерам.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 98: Господь воцарился над херувимами (1–3), правда суда Его (4–5),
# ответ Бога Моисею, Аарону и Самуилу (6–9).
# Красного и синего нет: псалом — пророчество и хвала, а не евангельская речь Христа.
# Прямой речи нет, кавычки не ставятся.
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: ケルビム уже пояснено в корпусе (Евр 9:5), 足台, 雲の柱 понятны.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 98
draft: true

verses:
  1: "ダビデの詩[うた]。主[しゅ]は王[おう]となられた。諸[しょ]民[みん]は怒[いか]れ。ケルビムの上[うえ]に座[すわ]る方[かた]である。地[ち]は震[ふる]えよ。"
  2: "主[しゅ]はシオンにおられて大[おお]きく、すべての民[たみ]の上[うえ]に高[たか]くおられる。"
  3: "彼[かれ]らがあなたの大[おお]きな名[な]をほめたたえますように。それは恐[おそ]るべき、聖[せい]なる名[な]である。"
  4: "王[おう]の誉[ほま]れは裁[さば]きを愛[あい]する。あなたは正[ただ]しさを備[そな]え、ヤコブの中[なか]に裁[さば]きと義[ぎ]とを行[おこな]われた。"
  5: "わたしたちの神[かみ]である主[しゅ]を高[たか]くほめたたえ、その足[あし]の足台[あしだい]にひれ伏[ふ]せよ。主[しゅ]は聖[せい]である。"
  6: "モーセとアロンはその祭司[さいし]たちの間[あいだ]に、サムエルはその名[な]を呼[よ]ぶ者[もの]たちの間[あいだ]にいた。彼[かれ]らが主[しゅ]を呼[よ]ぶと、主[しゅ]は彼[かれ]らに答[こた]えられた。"
  7: "主[しゅ]は雲[くも]の柱[はしら]のうちで彼[かれ]らに語[かた]られた。彼[かれ]らは主[しゅ]の証[あかし]と、主[しゅ]が彼[かれ]らに与[あた]えられた定[さだ]めとを守[まも]った。"
  8: "主[しゅ]よ、わたしたちの神[かみ]よ、あなたは彼[かれ]らに答[こた]えられた。神[かみ]よ、あなたは彼[かれ]らを赦[ゆる]す方[かた]であり、また彼[かれ]らのすべての行[おこな]いを罰[ばっ]する方[かた]であった。"
  9: "わたしたちの神[かみ]である主[しゅ]を高[たか]くほめたたえ、その聖[せい]なる山[やま]でひれ伏[ふ]せよ。わたしたちの神[かみ]である主[しゅ]は聖[せい]である。"

notes:
  1: "Надписание (прежний ст. 0, влит в этот стих): Ψαλμὸς τῷ Δαυιδ — ダビデの詩; в gr-lxx-byz строка 0 есть, поэтому взято оттуда. Надписание влито в ст. 1, скобками не маркируется. Стих: Ὁ κύριος ἐβασίλευσεν — 主は王となられた (βασιλεύω — «царствовать»; прошедшее в значении совершившегося воцарения). ὀργιζέσθωσαν λαοί — 諸民は怒れ (повелительное 3 л. мн.: «да гневаются»; у jp-joc 戰くべし). ὁ καθήμενος ἐπὶ τῶν χερουβιν — ケルビムの上に座る方 (χερουβιν — ケルビム, как по корпусу). σαλευθήτω ἡ γῆ — 地は震えよ (σαλεύω — «колебать, потрясать»)."
  2: "κύριος ἐν Σιων μέγας — 主はシオンにおられて大きく (μέγας — «велик»). ὑψηλός ἐστιν ἐπὶ πάντας τοὺς λαούς — すべての民の上に高くおられる (ὑψηλός — «высокий»); обе части — о величии и высоте."
  3: "ἐξομολογησάσθωσαν τῷ ὀνόματί σου τῷ μεγάλῳ — 彼らがあなたの大きな名をほめたたえますように (ἐξομολογέομαι — «исповедовать, славить», передано ほめたたえる, как по корпусу). ὅτι φοβερὸν καὶ ἅγιόν ἐστιν — それは恐るべき、聖なる名である (подлежащее — имя, ср. слав. «яко страшно и свято есть»)."
  4: "καὶ τιμὴ βασιλέως κρίσιν ἀγαπᾷ — 王の誉れは裁きを愛する (τιμή — «честь, достоинство»; слав. «честь царева суд любит»). σὺ ἡτοίμασας εὐθύτητας — あなたは正しさを備え (εὐθύτης — «прямота, правота»). κρίσιν καὶ δικαιοσύνην ἐν Ιακωβ σὺ ἐποίησας — ヤコブの中に裁きと義とを行われた."
  5: "ὑψοῦτε κύριον τὸν θεὸν ἡμῶν — わたしたちの神である主を高くほめたたえ (ὑψόω — «возвышать»). προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ — その足の足台にひれ伏せ (ὑποπόδιον — «подножие»). ὅτι ἅγιός ἐστιν — 主は聖である; стих повторяется почти дословно в ст. 9, повтор сохранён."
  6: "Μωϋσῆς καὶ Ααρων ἐν τοῖς ἱερεῦσιν αὐτοῦ — モーセとアロンはその祭司たちの間に (ἐν — «среди»). Σαμουηλ ἐν τοῖς ἐπικαλουμένοις τὸ ὄνομα αὐτοῦ — サムエルはその名を呼ぶ者たちの間に (ἐπικαλέομαι — «призывать»). ἐπεκαλοῦντο τὸν κύριον, καὶ αὐτὸς ἐπήκουσεν αὐτῶν — 彼らが主を呼ぶと、主は彼らに答えられた (ἐπακούω — «услышать, ответить»)."
  7: "ἐν στύλῳ νεφέλης ἐλάλει πρὸς αὐτούς — 主は雲の柱のうちで彼らに語られた (στῦλος νεφέλης — столп облачный, Исх 13:21; ἐλάλει — imperfect, «говорил обычно»). ἐφύλασσον τὰ μαρτύρια αὐτοῦ — 主の証を守った (μαρτύριον — «свидетельство»). τὰ προστάγματα, ἃ ἔδωκεν αὐτοῖς — 主が彼らに与えられた定め (πρόσταγμα — «повеление»)."
  8: "κύριε ὁ θεὸς ἡμῶν, σὺ ἐπήκουες αὐτῶν — 主よ、あなたは彼らに答えられた (imperfect). σὺ εὐίλατος ἐγίνου αὐτοῖς — あなたは彼らを赦す方であり (εὐίλατος — «легко умилостивляемый, прощающий»). ἐκδικῶν ἐπὶ πάντα τὰ ἐπιτηδεύματα αὐτῶν — また彼らのすべての行いを罰する方であった (ἐκδικέω — «взыскивать, карать»; ἐπιτήδευμα — «дело, занятие»); двойственность «прощал и взыскивал» сохранена."
  9: "ὑψοῦτε κύριον τὸν θεὸν ἡμῶν — повтор ст. 5, сохранён. προσκυνεῖτε εἰς ὄρος ἅγιον αὐτοῦ — その聖なる山でひれ伏せ (εἰς ὄρος — «к горе, на горе»; в ст. 5 было «подножие»). ὅτι ἅγιος κύριος ὁ θεὸς ἡμῶν — わたしたちの神である主は聖である."
