# jp-box, 2-я Паралипоменон, глава 10. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); второй свидетель — церковнославянский
# (csl-ru); ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni не источник (только проверка tmp/sim_jp.rb).
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 10: Ровоам в Сихеме (1–5), совет старцев и юношей (6–11), ответ и отпадение
# десяти колен (12–19); параллель — 3 Цар 12:1–19.
# Речи — 「…」: народ (4), Ровоам (5, 6, 9, 14), старцы (7), юноши (10–11), народ (16);
# слова народа в речах Ровоама и юношей и ответ юношей — 『…』 (9–11). Красного нет.
# Паритет: csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes.
# Нумерация — по gr-lxx-byz, 19 стихов; совпадает с csl.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 天幕, 嗣業, 戦車, くびき уже в корпусе или пояснены в notes.
# jp-ni не использовался.

