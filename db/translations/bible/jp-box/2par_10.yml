chapter: 10
draft: true

verses:
  1: "レハブアムはシケムへ行[い]った。イスラエルはすべて、彼[かれ]を王[おう]とするためにシケムに集[あつ]まっていたからである。"
  2: "ナバトの子[こ]ヤロブアムは、まだエジプトにいたとき——ソロモン王[おう]の前[まえ]から逃[に]げて、エジプトに住[す]んでいたのである——それを聞[き]き、エジプトから帰[かえ]って来[き]た。"
  3: "そして彼[かれ]らは人[ひと]を遣[つか]わして彼を呼[よ]んだ。ヤロブアムとイスラエルの全会衆[ぜんかいしゅう]が来[き]て、レハブアム王[おう]に言[い]った。"
  4: "「あなたの父[ちち]はわたしたちのくびきを重[おも]くしました。どうか今[いま]、あなたの父のきびしい労役[ろうえき]と、わたしたちに負[お]わせたその重[おも]いくびきを軽[かる]くしてください。そうすれば、わたしたちはあなたに仕[つか]えます。」"
  5: "彼[かれ]は彼らに言[い]った。「三日[みっか]の間[あいだ]、去[さ]って、またわたしのところへ来[き]なさい。」民[たみ]は去った。"
  6: "レハブアム王[おう]は、父[ちち]ソロモンが生[い]きていたとき彼の前[まえ]に立[た]っていた長老[ちょうろう]たちを集[あつ]めて言[い]った。「この民[たみ]に何と答[こた]えたらよいか、あなたがたはどう勧[すす]めるか。」"
  7: "彼[かれ]らは彼に言[い]った。「もし今日[きょう]、あなたがこの民[たみ]に良[よ]いことをし、彼らを喜[よろこ]ばせ、彼らに良い言葉[ことば]を語[かた]るなら、彼らはすべていつまでもあなたの僕[しもべ]となるでしょう。」"
  8: "しかし彼[かれ]は、長老[ちょうろう]たちが自分[じぶん]に勧[すす]めたその相談[そうだん]を捨[す]て、自分とともに育[そだ]ち、自分の前[まえ]に立[た]っている若者[わかもの]たちと相談した。"
  9: "彼は彼らに言[い]った。「あなたがたは何[なに]を勧[すす]めるか。『あなたの父[ちち]がわたしたちに負[お]わせたそのくびきを軽[かる]くしてくれ』とわたしに語[かた]ったこの民[たみ]に、何と答[こた]えたらよいか。」"
  10: "自分[じぶん]とともに育[そだ]った若者[わかもの]たちは彼[かれ]にこう言[い]った。「『あなたの父[ちち]はわたしたちのくびきを重[おも]くした。あなたはそれをわたしたちから軽[かる]くしてくれ』とあなたに語[かた]ったこの民[たみ]には、こう語りなさい。『わたしの小指[こゆび]は父の腰[こし]よりも太[ふと]い。"
  11: "今[いま]、わたしの父[ちち]はあなたがたに重[おも]いくびきを負[お]わせたが、わたしはあなたがたのくびきにさらに加[くわ]える。わたしの父はむちであなたがたを懲[こら]らしたが、わたしはさそりで懲らす。』」"
  12: "イスラエルはすべて、王[おう]が言[い]ったとおり、三日目[みっかめ]にレハブアムのもとへ来[き]た。王が「三日目にわたしのところへ戻[もど]って来なさい」と言っていたからである。"
  13: "王[おう]は民[たみ]にきびしく答[こた]え、長老[ちょうろう]たちが自分[じぶん]に勧[すす]めたその相談[そうだん]を捨[す]てた。"
  14: "そして若者[わかもの]たちの相談[そうだん]に従[したが]って、彼[かれ]らにこう語[かた]った。「わたしの父[ちち]はあなたがたのくびきを重[おも]くしたが、わたしはそれにさらに加[くわ]える。わたしの父はむちであなたがたを懲[こら]らしたが、わたしはさそりで懲らす。」"
  15: "王[おう]は民[たみ]の言[こと]を聞[き]かなかった。主[しゅ]からの変[か]わりが起[おこ]って、主がシロ人[じん]アヒヤによってナバトの子[こ]ヤロブアムについて語[かた]られたその言葉[ことば]が成[な]り立[た]つためであった。"
  16: "イスラエルはすべて、王[おう]が自分[じぶん]たちの言[こと]を聞[き]かなかったのを見[み]て、民[たみ]は王に答[こた]えて言[い]った。「ダビデにわたしたちの分[ぶん]は何[なに]があるのか。エッサイの子[こ]にわたしたちの嗣業[しぎょう]はない。イスラエルよ、自分の天幕[てんまく]へ帰[かえ]れ。ダビデよ、今[いま]は自分の家[いえ]を見よ。」そしてイスラエルは皆[みな]、自分の天幕へ去[さ]った。"
  17: "ユダの町[まち]々[まち]に住[す]むイスラエルの子[こ]らに対しては、レハブアムが彼[かれ]らの上[うえ]に王[おう]となった。"
  18: "レハブアム王[おう]は労役[ろうえき]の監督[かんとく]アドニラムを遣[つか]わしたが、イスラエルはすべて彼[かれ]を石[いし]で打[う]ち殺[ころ]した。王はこれを聞[き]くと、エルサレムへ逃[に]げるために急[いそ]いで戦車[せんしゃ]に上[のぼ]った。"
  19: "イスラエルはダビデの家[いえ]から離反[りはん]し、今日[こんにち]に至[いた]っている。"

notes:
  1: "ἦλθεν εἰς Συχεμ — пришёл в Сихем (シケム, форма корпуса); ἤρχετο — приходил (имперфект); πᾶς Ισραηλ — весь Израиль; βασιλεῦσαι αὐτόν — воцарить его. Слав. «снидеся» — собрался, сошёлся."
  2: "υἱὸς Ναβατ — сын Наватов; καὶ αὐτὸς ἐν Αἰγύπτῳ — и он был в Египте (греч. вставка, передана тире); ὡς ἔφυγεν ἀπὸ προσώπου Σαλωμων τοῦ βασιλέως — так как убежал от лица царя Соломона; κατῴκησεν ἐν Αἰγύπτῳ — поселился в Египте; ἀπέστρεψεν ἐξ Αἰγύπτου — возвратился из Египта."
  3: "ἀπέστειλαν καὶ ἐκάλεσαν — послали и позвали; ἐκκλησία Ισραηλ — собрание Израиля (全会衆); λέγοντες — говоря; речь — в ст. 4. Ср. 3 Цар 12:3."
  4: "ἐσκλήρυνεν — сделал жёстким, отяготил (σκληρύνω); ζυγός — ярмо (くびき); ἄφες ἀπὸ τῆς δουλείας — отпусти, облегчи работу (δουλεία); σκληρά — жестокая; βαρύς — тяжёлое; δουλεύσομέν σοι — будем служить тебе."
  5: "Πορεύεσθε ἕως τριῶν ἡμερῶν — идите до трёх дней; ἔρχεσθε πρός με — приходите ко мне; ἀπῆλθεν ὁ λαός — ушёл народ. Ср. 3 Цар 12:5."
  6: "συνήγαγεν — собрал; πρεσβύτεροι οἱ ἑστηκότες ἐναντίον Σαλωμων — старейшины, предстоявшие Соломону; ἐν τῷ ζῆν αὐτόν — при жизни его; Πῶς ὑμεῖς βουλεύεσθε τοῦ ἀποκριθῆναι — как вы советуете ответить (βουλεύομαι)."
  7: "ἐὰν ἐν τῇ σήμερον γένῃ εἰς ἀγαθὸν τῷ λαῷ — если в сей день будешь во благо народу; εὐδοκήσῃς — благоугодишь; λόγους ἀγαθούς — добрые слова; ἔσονταί σοι παῖδες — будут тебе рабами; πάσας τὰς ἡμέρας — во все дни."
  8: "κατέλιπεν — оставил; βουλή — совет; παιδάρια τὰ συνεκτραφέντα — юноши, вскормленные вместе (παιδάριον, ἐκτρέφω); τῶν ἑστηκότων ἐναντίον αὐτοῦ — предстоящие пред ним."
  9: "Τί ὑμεῖς βουλεύεσθε — что вы советуете; ἀποκριθύσομαι λόγον — отвечу слово; οἳ ἐλάλησαν πρός με λέγοντες — говорившие мне, говоря; Ἄνες ἀπὸ τοῦ ζυγοῦ — облегчи от ярма (ἀνίημι)."
  10: "τὰ παιδάρια τὰ ἐκτραφέντα — юноши, вскормленные; λαλήσεις — скажешь; ὁ μικρὸς δάκτυλός μου — мизинец мой (小指); παχύτερος — толще; ὀσφύς — чресла, поясница (腰)."
  11: "ἐπαίδευσεν — наказал (παιδεύω); ζυγῷ βαρεῖ — тяжёлым ярмом; προσθήσω ἐπὶ τὸν ζυγόν — прибавлю к ярму; ἐν μάστιγξιν — бичами (μάστιξ); ἐν σκορπίοις — скорпионами (σκορπίος): бич с металлическими шипами, さそり."
  12: "τῇ ἡμέρᾳ τῇ τρίτῃ — в третий день; ὡς ἐλάλησεν ὁ βασιλεύς — как сказал царь; Ἐπιστρέψατε πρός με — возвратитесь ко мне."
  13: "ἀπεκρίθη σκληρά — ответил жестоко (σκληρός в роли наречия); ἐγκατέλιπεν τὴν βουλήν — оставил совет. В csl в конце добавлено «и рече к ним по совету юнош, глаголя» — и сказал им по совету юношей, говоря; в LXX эта часть открывает ст. 14, поэтому здесь не повторена."
  14: "κατὰ τὴν βουλὴν τῶν νεωτέρων — по совету младших (νεώτεροι); тот же текст, что в ст. 11: формула повторена в LXX и csl."
  15: "μεταστροφή — перемена, поворот (слав. «превращение»); παρὰ τοῦ θεοῦ — от Бога; λέγων — говоря (смещение конструкции); Ἀνέστησεν κύριος τὸν λόγον αὐτοῦ — возставил, исполнил Господь слово Своё (ἀνίστημι); ἐν χειρὶ Αχια τοῦ Σηλωνίτου — рукою Ахии Силомлянина; περὶ Ιεροβοαμ υἱοῦ Ναβατ — об Иеровоаме, сыне Наватовом."
  16: "Τίς ἡμῖν μερὶς ἐν Δαυιδ — какая нам часть в Давиде (μερίς); κληρονομία ἐν υἱῷ Ιεσσαι — наследие в сыне Иессеевом (κληρονομία, 嗣業); εἰς τὰ σκηνώματά σου — по шатрам твоим (σκήνωμα, 天幕); νῦν βλέπε τὸν οἶκόν σου, Δαυιδ — теперь смотри дом твой, Давид; ἐπορεύθη πᾶς Ισραηλ — пошёл весь Израиль. Греч. стих начинается обрывом: καὶ παντὸς Ισραηλ, ὅτι οὐκ ἤκουσεν ὁ βασιλεὺς αὐτῶν — «и всего Израиля, что не послушал царь их»; слав. «и о всем израили»; в тексте по смыслу."
  17: "ἄνδρες Ισραηλ οἱ κατοικοῦντες ἐν πόλεσιν Ιουδα — мужи Израилевы, живущие в городах Иуды; ἐβασίλευσεν ἐπ᾿ αὐτῶν — воцарился над ними. В csl «воцариша над собою ровоама» — поставили над собою Ровоама (иное согласование); в ru «остался царём Ровоам»."
  18: "τὸν ἐπὶ τοῦ φόρου — начальника над податью (φόρος); ἐλιθοβόλησαν λίθοις — побили камнями (λιθοβολέω); ἀπέθανεν — умер; ἔσπευσεν τοῦ ἀναβῆναι εἰς τὸ ἅρμα — поспешил взойти на колесницу. В csl добавлено «и услыша царь ровоам» — и услышал царь Ровоам (в LXX нет), внесено в текст (王はこれを聞くと)."
  19: "ἠθέτησεν — отложился, изменил (ἀθετέω; слав. «отвержеся»); ἐν τῷ οἴκῳ Δαυιδ — от дома Давидова; ἕως τῆς ἡμέρας ταύτης — до сего дня."
