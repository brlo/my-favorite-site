verses:
  1: "わたしたち強[つよ]い者[もの]は、弱[よわ]い者[もの]の弱[よわ]さを担[にな]うべきであり、自分[じぶん]を喜[よろこ]ばせるべきではない。"
  2: "わたしたちはそれぞれ、隣人[りんじん]を喜[よろこ]ばせ、善[ぜん]をもってその人[ひと]を建[た]て上[あ]げるようにすべきである。"
  3: "というのは、キリストも、自分[じぶん]を喜[よろこ]ばせることはなさらなかったからである。むしろ、書[か]いてあるとおりである。「あなたをそしる者[もの]たちのそしりは、わたしの上[うえ]に降[ふ]りかかった。」"
  4: "というのは、以前[いぜん]に書[か]かれたものはすべて、わたしたちの教[おし]えのために書[か]かれたのである。それは、聖書[せいしょ]から来[く]る忍耐[にんたい]と慰[なぐさ]めによって、わたしたちが希望[きぼう]を持[も]つためである。"
  5: "忍耐[にんたい]と慰[なぐさ]めの神[かみ]が、あなたがたに、キリスト・イエスに従[したが]って互[たが]いに同[おな]じ思[おも]いを持[も]たせてくださいますように。"
  6: "それは、あなたがたが心[こころ]を一[ひと]つにし、一[ひと]つの口[くち]で、わたしたちの主[しゅ]イエス・キリストの父[ちち]である神[かみ]をほめたたえるためである。"
  7: "だから、キリストが神[かみ]の栄光[えいこう]のためにあなたがたを受け入[い]れられたように、あなたがたも互[たが]いに受け入[い]れなさい。"
  8: "というのは、わたしは言[い]う。キリストは、父祖[ふそ]たちへの約束[やくそく]を確[かく]かなものとするために、神[かみ]の真実[しんじつ]のゆえに、割礼[かつれい]の者[もの]たちの僕[しもべ]となられたのである。"
  9: "また、異邦人[いほうじん]が、神[かみ]のあわれみのゆえに神[かみ]をほめたたえるためでもある。書[か]いてあるとおりである。「だから、わたしは異邦人[いほうじん]の中[なか]であなたをほめたたえ、あなたの名[な]を歌[うた]おう。」"
  10: "また、言[い]われている。「異邦人[いほうじん]よ、主[しゅ]の民[たみ]とともに喜[よろこ]べ。」"
  11: "また、「すべての異邦人[いほうじん]よ、主[しゅ]をほめたたえよ。すべての民[たみ]よ、主[しゅ]を賛美[さんび]せよ。」"
  12: "また、イザヤが言[い]う。「エッサイの根[ね]が現[あらわ]れ、異邦人[いほうじん]を治[おさ]めるために立[た]ち上[あ]がる。異邦人[いほうじん]はその人[ひと]に希望[きぼう]をかける。」"
  13: "希望[きぼう]の神[かみ]が、あなたがたが信[しん]じるに際[さい]して、すべての喜[よろこ]びと平和[へいわ]で満[み]たしてくださいますように。それは、{聖霊[せいれい]|聖神[せいしん]}の力[ちから]によって、あなたがたが希望[きぼう]に満[み]ちあふれるためである。"
  14: "わたし自身[じしん]も、兄弟[きょうだい]たちよ、あなたがたについて確[たし]かに信[しん]じている。あなたがた自身[じしん]が善[ぜん]に満[み]ち、すべての知識[ちしき]に満[み]たされ、互[たが]いに教[おし]え戒[いまし]めることができるということである。"
  15: "しかし、兄弟[きょうだい]たちよ、わたしは、神[かみ]からわたしに与[あた]えられた恵[めぐ]みによって、あなたがたに思[おも]い起[お]こしていただくために、少[すこ]し大胆[だいたん]に書[か]いたのである。"
  16: "それは、わたしが異邦人[いほうじん]のためにキリスト・イエスの奉仕者[ほうししゃ]となり、神[かみ]の福音[ふくいん]を祭司[さいし]として仕[つか]えるためである。異邦人[いほうじん]のささげ物[もの]が、{聖霊[せいれい]|聖神[せいしん]}によって聖[せい]とされ、神[かみ]に喜[よろこ]んで受け入れられるためである。"
  17: "だから、わたしはキリスト・イエスにあって、神[かみ]に関[かん]することを誇[ほこ]りとしている。"
  18: "というのは、わたしは、キリストが異邦人[いほうじん]を従順[じゅうじゅん]に導[みちび]くために、言葉[ことば]と行[おこな]いによって、わたしを通[とお]して成[な]し遂[と]げられたこと以外[いがい]は、あえて語[かた]らない。"
  19: "しるしと奇跡[きせき]の力[ちから]、霊[れい]の力[ちから]によってである。こうして、わたしはエルサレムからその周[まわ]りを巡[めぐ]ってイルリコに至[いた]るまで、キリストの福音[ふくいん]を隅々[すみずみ]まで宣[の]べ伝[つた]え尽[つ]くした。"
  20: "こうして、わたしは、キリストの名[な]がすでに唱[とな]えられている所[ところ]ではなく、福音[ふくいん]を宣[の]べ伝[つた]えることを誇[ほこ]りとしてきた。他人[たにん]の土台[どだい]の上[うえ]に建[た]てることのないためである。"
  21: "むしろ、書[か]いてあるとおりである。「彼[かれ]について告[つ]げられたことのない者[もの]たちが、見[み]るであろう。聞[き]いたことのない者[もの]たちが、悟[さと]るであろう。」"
  22: "だから、わたしはあなたがたのところへ行[い]こうと、何度[なんど]も妨[さまた]げられてきた。"
  23: "しかし今[いま]は、この地方[ちほう]にはもはや働[はたら]く余地[よち]がなく、また、何年[なんねん]も前[まえ]からあなたがたのところへ行[い]くことを願[ねが]ってきたので、"
  24: "スペインへ行[い]くとき、あなたがたのところを通[とお]りたい。というのは、途中[とちゅう]であなたがたに会[あ]い、まずあなたがたとしばらく過[す]ごして心[こころ]が満[み]たされたなら、そこへ送[おく]り出[だ]してもらうことを望[のぞ]んでいるからである。"
  25: "しかし、今[いま]は聖徒[せいと]たちに仕[つか]えるために、エルサレムへ行[い]こうとしている。"
  26: "というのは、マケドニアとアカイアの人々[ひとびと]が、エルサレムの聖徒[せいと]たちのうちの貧[まず]しい者[もの]たちに、ある援助[えんじょ]をすることに賛成[さんせい]したからである。"
  27: "彼[かれ]らは賛成[さんせい]したのであり、また、彼[かれ]らに対して負[お]いがある。というのは、異邦人[いほうじん]が彼[かれ]らの霊[れい]のものに与[あずか]ったのなら、肉[にく]のものによっても彼[かれ]らに仕[つか]えるべきだからである。"
  28: "だから、わたしはこのことを果[は]たし、この実[みの]りを確[たし]かに彼[かれ]らに手渡[てわた]してから、あなたがたのところを経[へ]てスペインへ行[い]く。"
  29: "あなたがたのところへ行[い]くとき、キリストの祝福[しゅくふく]の満[み]ちあふれるものをもって行[い]くことを知[し]っている。"
  30: "兄弟[きょうだい]たちよ、わたしは、わたしたちの主[しゅ]イエス・キリストによって、また、霊[れい]の愛[あい]によって、あなたがたに勧[すす]める。わたしのために、わたしとともに神[かみ]への祈[いの]りに励[はげ]んでほしい。"
  31: "それは、わたしがユダヤにいる不従順[ふじゅうじゅん]な者[もの]たちから救[すく]い出[だ]され、また、エルサレムへのわたしの奉仕[ほうし]が聖徒[せいと]たちに喜[よろこ]んで受け入れられるためである。"
  32: "そうして、神[かみ]の御心[みこころ]によって喜[よろこ]びをもってあなたがたのところへ行[い]き、あなたがたとともに憩[いこ]うことができるように。"
  33: "平和[へいわ]の神[かみ]が、あなたがたすべてとともにいてくださいますように。アーメン。"

notes:
  1: "ὀφείλομεν — «должны»; べきである. ἀσθενήματα — «немощи»; 弱さ. βαστάζειν — «нести»; 担う."
  2: "ἀρεσκέτω — «пусть угождает»; 喜ばせる. πρὸς οἰκοδομήν — «к назиданию»; 建て上げるため."
  3: "οὐχ ἑαυτῷ ἤρεσεν — «не себе угодил»; 自分を喜ばせることはなさらなかった. Цитата из Пс 68:10."
  4: "προεγράφη — «написано прежде»; 以前に書かれた. παράκλησις — «утешение»; 慰め."
  5: "δῴη — «да даст»; 持たせてくださいますように. τὸ αὐτὸ φρονεῖν — «мыслить одинаково»; 同じ思い."
  6: "ὁμοθυμαδόν — «единодушно»; 心を一つにし. ἑνὶ στόματι — «одними устами»; 一つの口で."
  7: "προσλαμβάνεσθε — «принимайте»; 受け入れなさい. εἰς δόξαν τοῦ θεοῦ — «в славу Божию»; 神の栄光のために."
  8: "διάκονον περιτομῆς — «служитель обрезания»; 割礼の者たちの僕. βεβαιῶσαι — «утвердить»; 確かなものとする."
  9: "ἐξομολογήσομαι — «исповедаю, восхвалю»; ほめたたえ. Цитата из Пс 17:50."
  10: "Цитата из Втор 32:43."
  11: "Цитата из Пс 116:1."
  12: "Цитата из Ис 11:10. ῥίζα τοῦ Ἰεσσαί — «корень Иессеев»; エッサイの根. Имя пророка — イザヤ."
  13: "ὁ θεὸς τῆς ἐλπίδος — «Бог надежды»; 希望の神. περισσεύειν — «изобиловать»; 満ちあふれる."
  14: "ἀγαθωσύνη — «благость»; 善. νουθετεῖν — «вразумлять»; 教え戒める."
  15: "τολμηρότερον — «смелее»; 大胆に. ἀπὸ μέρους — «отчасти»; 少し. ἐπαναμιμνῄσκων — «напоминая»; 思い起こしていただく."
  16: "ἱερουργοῦντα — «священнодействуя»; 祭司として仕える. προσφορά — «приношение»; ささげ物. εὐπρόσδεκτος — «благоприятное»; 喜んで受け入れられる."
  17: "καύχησις — «похвала»; 誇り. τὰ πρὸς τὸν θεόν — «в том, что относится к Богу»; 神に関すること."
  18: "κατειργάσατο — «совершил»; 成し遂げられた. εἰς ὑπακοὴν ἐθνῶν — «в покорность язычников»; 異邦人を従順に導く."
  19: "σημεῖα καὶ τέρατα — «знамения и чудеса»; しるしと奇跡. В критической базе ἐν δυνάμει πνεύματος; византийский текст и jp-joc читают πνεύματος ἁγίου; переведено 霊 по базе (ср. 15:13, 15:16, где в базе ἁγίου — 聖霊). Ἰλλυρικόν — イルリコ."
  20: "φιλοτιμούμενον — «почитая честью, стараясь»; 誇りとしてきた. ἀλλότριον θεμέλιον — «чужое основание»; 他人の土台."
  21: "Цитата из Ис 52:15."
  22: "ἐνεκοπτόμην — «я был удерживаем»; 妨げられてきた."
  23: "κλίματα — «области, страны»; 地方. τόπον ἔχων — «имея место», то есть простор для труда; 働く余地."
  24: "ὡς ἂν πορεύωμαι — «когда пойду»; 行くとき. προπεμφθῆναι — «быть отправленным»; 送り出してもらう. ἀπὸ μέρους ἐμπλησθῶ — «отчасти насытиться»; しばらく過ごして心を満たされる."
  25: "διακονῶν τοῖς ἁγίοις — «служа святым»; 聖徒たちに仕える."
  26: "κοινωνίαν ποιήσασθαι — «сделать общение», то есть сбор; ある援助をすること. πτωχοί — «нищие»; 貧しい者."
  27: "ὀφειλέται — «должники»; 負いがある. πνευματικά — духовное, 霊のもの; σαρκικά — плотское, 肉のもの. λειτουργῆσαι — «послужить»; 仕える."
  28: "σφραγισάμενος — «запечатлев, вручив»; 確かに手渡して. ἀπελεύσομαι — «пойду»; 行く."
  29: "ἐν πληρώματι εὐλογίας Χριστοῦ — «в полноте благословения Христова»; キリストの祝福の満ちあふれるもの."
  30: "συναγωνίσασθαι — «подвизаться вместе»; ともに祈りに励む. τῆς ἀγάπης τοῦ πνεύματος — «любовью Духа»; 霊の愛 (в базе πνεύματος без ἁγίου)."
  31: "ἀπειθούντων — «непокорных»; 不従順な者. εὐπρόσδεκτος — «благоприятна»; 喜んで受け入れられる."
  32: "συναναπαύσωμαι — «успокоиться вместе»; ともに憩う. διὰ θελήματος θεοῦ — «по воле Божией»; 神の御心によって."
  33: "ὁ θεὸς τῆς εἰρήνης — «Бог мира»; 平和の神. ἀμήν — アーメン."
