# jp-box, Деяния апостолов, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: исцеление хромого у Красных врат (1–10), речь Петра в притворе
# Соломоновом (11–26).
# Красного (<j>) в главе нет: Христос здесь не говорит. Слова Петра — не красные.
# Синего (<mo>) нет.
# 〔…〕: 3:22 — церковное πρὸς τοὺς πατέρας «отцам»; 3:26 — имя Иисуса.
# Места базы в квадратных скобках (3:3, 3:13) не обёрнуты. jp-ni не использовался.

tr_code: jp-box
book: act
chapter: 3
draft: true

verses:
  1: "ペトロとヨハネは、第九時[だいきゅうじ]の祈[いの]りのために、神殿[しんでん]へ上[のぼ]って行[い]った。"
  2: "生[う]まれつき足[あし]の不自由[ふじゆう]な男[おとこ]が運[はこ]ばれて来[き]た。彼[かれ]は、神殿[しんでん]に入[はい]る人[ひと]たちから施[ほどこ]しを乞[こ]うために、毎日[まいにち]、美[び]門[もん]と呼[よ]ばれる神殿[しんでん]の門[もん]のそばに置[お]かれていた。"
  3: "この人[ひと]は、ペトロとヨハネが神殿[しんでん]に入[はい]ろうとするのを見[み]て、施[ほどこ]しを乞[こ]うた。"
  4: "ペトロはヨハネとともに彼[かれ]をじっと見[み]つめて言[い]った。「わたしたちを見[み]なさい。」"
  5: "彼[かれ]は何[なに]かもらえると思[おも]って、二人[ふたり]をじっと見[み]つめていた。"
  6: "ペトロは言[い]った。「金[きん]銀[ぎん]はわたしにはない。しかし、わたしが持[も]っているもの、それをあなたに与[あた]える。ナザレのイエス・キリストの名[な]によって、歩[ある]きなさい。」"
  7: "そして、右[みぎ]の手[て]を取[と]って彼[かれ]を起[お]こすと、たちまち、足[あし]と踝[くるぶし]が強[つよ]くなった。"
  8: "彼[かれ]は躍[おど]り上[あ]がって立[た]ち、歩[ある]き始[はじ]めた。そして、彼[かれ]らとともに神殿[しんでん]に入[はい]り、歩[ある]き、躍[おど]りながら、神[かみ]をほめたたえていた。"
  9: "民[たみ]は皆[みな]、彼[かれ]が歩[ある]き、神[かみ]をほめたたえているのを見[み]た。"
  10: "そして、この人[ひと]が、いつも神殿[しんでん]の美[び]門[もん]のそばに座[すわ]って施[ほどこ]しを乞[こ]っていた者[もの]だと分[わ]かると、彼[かれ]に起[お]こったことで、驚[おどろ]きと、我[われ]を忘[わす]れるほどの思[おも]いに包[つつ]まれた。"
  11: "その人[ひと]がペトロとヨハネにすがりついていると、民[たみ]は皆[みな]、驚[おどろ]いて、ソロモンの回廊[かいろう]と呼[よ]ばれる所[ところ]にいる二人[ふたり]のところへ駆[か]け寄[よ]って来[き]た。"
  12: "ペトロはこれを見[み]て、民[たみ]に答[こた]えて言[い]った。「イスラエルの人[ひと]たちよ、なぜこのことを不思議[ふしぎ]に思[おも]うのか。また、なぜわたしたちを見[み]つめるのか。わたしたちが自分[じぶん]の力[ちから]や敬虔[けいけん]によって、この人[ひと]を歩[ある]かせたとでも思[おも]うのか。"
  13: "アブラハムの神[かみ]、イサクの神[かみ]、ヤコブの神[かみ]、わたしたちの先祖[せんぞ]の神[かみ]は、その僕[しもべ]イエスを栄光[えいこう]で輝[かがや]かせた。あなたがたはこのイエスを引[ひ]き渡[わた]し、ピラトが釈放[しゃくほう]しようと決[き]めたとき、その前[まえ]で拒[こば]んだのである。"
  14: "あなたがたは、聖[せい]なる正[ただ]しい方[かた]を拒[こば]み、人殺[ひとごろ]しをあなたがたに与[あた]えてくれるように求[もと]めた。"
  15: "そして、命[いのち]の導[みちび]き手[て]を殺[ころ]したのである。神[かみ]はこの方[かた]を死者[ししゃ]の中[なか]から復活[ふっかつ]させたが、わたしたちはその証人[しょうにん]である。"
  16: "この方[かた]の名[な]を信[しん]じる信仰[しんこう]によって、この方[かた]の名[な]が、あなたがたが見[み]て知[し]っているこの人[ひと]を強[つよ]めたのである。この方[かた]による信仰[しんこう]が、あなたがた一同[いちどう]の前[まえ]で、この人[ひと]にこの完全[かんぜん]な癒[いや]しを与[あた]えたのである。"
  17: "さて、兄弟[きょうだい]たちよ、あなたがたが知[し]らずに行[おこな]ったこと、またあなたがたの指導者[しどうしゃ]たちも同[おな]じであったことは、わたしには分[わ]かっている。"
  18: "神[かみ]は、すべての預言者[よげんしゃ]の口[くち]を通[とお]して、ご自分[じぶん]のキリストが苦[くる]しみを受[う]けるとあらかじめ告[つ]げられたことを、このように成就[じょうじゅ]されたのである。"
  19: "だから、悔[く]い改[あらた]めて神[かみ]に立[た]ち返[かえ]りなさい。そうすれば、あなたがたの罪[つみ]が消[け]し去[さ]られる。"
  20: "そして、主[しゅ]の御前[みまえ]から慰[なぐさ]めの時[とき]が来[く]るため、また、あなたがたのために定[さだ]められたキリスト、すなわちイエスを遣[つか]わしてくださるためである。"
  21: "この方[かた]は、神[かみ]が昔[むかし]からその聖[せい]なる預言者[よげんしゃ]たちの口[くち]を通[とお]して語[かた]られたすべてのことが回復[かいふく]される時[とき]まで、天[てん]に迎[むか]えられていなければならない。"
  22: "モーセは〔先祖[せんぞ]たちに〕言[い]った。『あなたがたの神[かみ]である主[しゅ]は、あなたがたの兄弟[きょうだい]の中[なか]から、わたしのような預言者[よげんしゃ]をあなたがたのために立[た]てる。彼[かれ]があなたがたに語[かた]るすべてのことに、あなたがたは聞[き]き従[したが]わなければならない。"
  23: "この預言者[よげんしゃ]に聞[き]き従[したが]わない者[もの]は、すべて民[たみ]の中[なか]から根[ね]こそぎ除[のぞ]かれるであろう。』"
  24: "サムエル以来[いらい]、語[かた]った預言者[よげんしゃ]たちは皆[みな]、この日[ひ]々[び]のことを告[つ]げている。"
  25: "あなたがたは預言者[よげんしゃ]たちの子[こ]らであり、神[かみ]があなたがたの先祖[せんぞ]たちと結[むす]ばれた契約[けいやく]の子[こ]らである。神[かみ]はアブラハムにこう言[い]われた。『あなたの子孫[しそん]によって、地[ち]のすべての民族[みんぞく]が祝福[しゅくふく]を受[う]ける。』"
  26: "神[かみ]は、ご自分[じぶん]の僕[しもべ]〔イエスを〕復活[ふっかつ]させて、まずあなたがたに遣[つか]わした。あなたがたの一人[ひとり]一人[ひとり]をその悪[あく]から離[はな]れさせ、あなたがたを祝福[しゅくふく]するためである。」"

notes:
  1: "ὥρα ἐνάτη — девятый час, около трёх часов дня; 第九時."
  2: "ἐκ κοιλίας μητρὸς αὐτοῦ — «от чрева матери»; 生まれつき. Ὡραία — 美門. ἐλεημοσύνη — 施し."
  3: "[λαβεῖν] в базе есть (в квадратных скобках) — 〔…〕 не ставится."
  6: "ἀργύριον καὶ χρυσίον — 金銀 (у jp-joc「金銀」). ὃ δὲ ἔχω — わたしが持っているもの."
  7: "σφυδρά — 踝 (голени, лодыжки)."
  10: "θάμβος καὶ ἔκστασις — «изумление и исступление»; 驚きと、我を忘れるほどの思い."
  11: "στοὰ Σολομῶντος — ソロモンの回廊, как 5:12."
  12: "ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ — «своей силой или благочестием»; 自分の力や敬虔によって. ὡς — 〜とでも思うのか."
  13: "ὁ θεὸς Ἀβραὰμ καὶ [ὁ θεὸς] Ἰσαὰκ καὶ [ὁ θεὸς] Ἰακώβ — в базе в квадратных скобках, 〔…〕 не оборачивал. παῖς — 僕."
  14: "φονέα — 人殺し."
  15: "ἀρχηγὸς τῆς ζωῆς — 命の導き手."
  16: "ὁλοκληρία — 完全な癒し."
  17: "κατὰ ἄγνοιαν — 知らずに."
  19: "ἐπιστρέψατε — 立ち返りなさい; εἰς τὸ ἐξαλειφθῆναι — 罪が消し去られるために."
  20: "καιροὶ ἀναψύξεως — 慰めの時."
  21: "ἀποκατάστασις πάντων — すべてのものの回復."
  22: "πρὸς τοὺς πατέρας — чтение Церкви (Синодальный «сказал отцам», jp-joc「先祖に謂へり」); в базе нет — 〔先祖たちに〕. Втор 18:15."
  23: "ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ — 民の中から根こそぎ除かれる."
  24: "ἀπὸ Σαμουὴλ καὶ τῶν καθεξῆς — サムエル以来."
  25: "Быт 22:18. διαθήκη — 契約; πατριαί — 民族."
  26: "Ἰησοῦν — чтение Церкви (Синодальный «Сына Своего Иисуса», jp-joc「其の子イイスス」); в базе τὸν παῖδα αὐτοῦ без имени — 〔イエスを〕."
