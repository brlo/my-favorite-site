verses:
  1: "権力者[けんりょくしゃ]の食卓[しょくたく]に座[すわ]って食[た]べるなら、あなたの前[まえ]に置[お]かれるものを、心[こころ]して悟[さと]れ。"
  2: "そして、あなたがそのようなものを備[そな]えなければならないと知[し]って、あなたの手[て]を置[お]け。"
  3: "しかし、あなたが大[おお]く食[た]べる者[もの]なら、その食物[しょくもつ]を欲[ほっ]してはならない。それは偽[いつわ]りの命[いのち]に属[ぞく]しているからである。"
  4: "貧[まず]しい者[もの]でありながら、富[とみ]める者[もの]のほうへ手[て]を伸[の]ばしてはならない。あなたの思[おも]いによって、退[しりぞ]け。"
  5: "あなたがそのほうに目[め]を向[む]けると、それはどこにも見[み]えなくなる。鷲[わし]のように翼[つばさ]が備[そな]えられ、持[も]ち主[ぬし]の家[いえ]へ帰[かえ]って行[ゆ]くからである。"
  6: "妬[ねた]み深[ぶか]い人[ひと]と食事[しょくじ]をともにしてはならない。その食物[しょくもつ]を欲[ほっ]してもならない。"
  7: "人[ひと]が髪[かみ]の毛[け]を飲[の]み込[こ]んだようなものである。その人[ひと]はそのように食[た]べ、飲[の]む。"
  8: "その人[ひと]を自分[じぶん]のところへ招[まね]き入[い]れて、その人[ひと]とパンを食[た]べてはならない。その人[ひと]はそれを吐[は]き出[だ]し、あなたの良[よ]い言葉[ことば]を汚[けが]すからである。"
  9: "愚[おろ]かな者[もの]の耳[みみ]には何[なに]も語[かた]るな。その者[もの]があなたの思慮[しりょ]ある言葉[ことば]をあざ笑[わら]うことのないためである。"
  10: "永遠[えいえん]の境[さかい]を移[うつ]してはならない。孤児[こじ]たちの所有地[しょゆうち]に入[はい]ってはならない。"
  11: "彼[かれ]らを贖[あがな]う主[しゅ]は強[つよ]く、あなたとともに彼[かれ]らの訴[うった]えを裁[さば]かれるからである。"
  12: "あなたの心[こころ]を戒[いまし]めに与[あた]え、あなたの耳[みみ]を悟[さと]りの言葉[ことば]に備[そな]えよ。"
  13: "幼[おさな]い者[もの]を戒[いまし]めることをやめてはならない。むちで打[う]っても、その者[もの]は死[し]なないからである。"
  14: "あなたがむちでその者[もの]を打[う]つなら、その者[もの]の魂[たましい]を死[し]から救[すく]い出[だ]すことになる。"
  15: "わが子[こ]よ、あなたの心[こころ]が知恵[ちえ]あるものとなるなら、あなたはわたしの心[こころ]をも喜[よろこ]ばせる。"
  16: "あなたの唇[くちびる]が正[ただ]しいものであるなら、あなたの唇[くちびる]はわたしの唇[くちびる]に向[む]かって、言葉[ことば]のうちに留[とど]まる。"
  17: "あなたの心[こころ]が罪人[つみびと]たちを妬[ねた]んではならない。むしろ、日[ひ]の全[すべ]てを、主[しゅ]を恐[おそ]れることのうちに過[す]ごせ。"
  18: "あなたがそれらを守[まも]るなら、あなたには子孫[しそん]が与[あた]えられ、あなたの希望[きぼう]は取[と]り去[さ]られないからである。"
  19: "わが子[こ]よ、聞[き]け。そして知恵[ちえ]ある者[もの]となり、あなたの心[こころ]の思[おも]いをまっすぐにせよ。"
  20: "ぶどう酒[しゅ]にふける者[もの]となってはならない。肉[にく]の買[か]い込[こ]みや宴会[えんかい]に身[み]を入[い]れてはならない。"
  21: "酔[よ]う者[もの]も、みだらな者[もの]も、だれでも貧[まず]しくなり、眠[ねむ]りを好[この]む者[もの]はだれでも、破[やぶ]れたぼろをまとう。"
  22: "わが子[こ]よ、あなたを生[う]んだ父[ちち]の言葉[ことば]を聞[き]け。母[はは]が老[お]いても、侮[あなど]ってはならない。"
  23: "真理[しんり]を手[て]に入[い]れよ。知恵[ちえ]と戒[いまし]めと悟[さと]りを退[しりぞ]けてはならない。"
  24: "正[ただ]しい父[ちち]はよく子[こ]を育[はぐく]む。知恵[ちえ]ある子[こ]のゆえに、その魂[たましい]は喜[よろこ]ぶ。"
  25: "あなたのゆえに父[ちち]と母[はは]は喜[よろこ]び、あなたを生[う]んだ母[はは]は心[こころ]を楽[たの]しませるように。"
  26: "わが子[こ]よ、あなたの心[こころ]をわたしに与[あた]えよ。あなたの目[め]はわたしの道[みち]を守[まも]るように。"
  27: "他人[たにん]の家[いえ]は底[そこ]の抜[ぬ]けた樽[たる]、他人[たにん]のものは狭[せま]い井戸[いど]である。"
  28: "その者[もの]はたちまち滅[ほろ]び、不[ふ]法[ほう]な者[もの]はだれでも消[き]え去[さ]るからである。"
  29: "災[わざわ]いがあるのはだれか。騒[さわ]ぎがあるのはだれか。裁[さば]きがあるのはだれか。苦[くる]しみと争[あらそ]いがあるのはだれか。むだに打[う]ち砕[くだ]かれるのはだれか。鳩[はと]のような目[め]になるのはだれか。"
  30: "長[なが]くぶどう酒[しゅ]の席[せき]に留[とど]まる者[もの]ではないか。どこで酒宴[しゅえん]が開[ひら]かれるかを探[さが]し求[もと]める者[もの]ではないか。"
  31: "ぶどう酒[しゅ]に酔[よ]ってはならない。むしろ、正[ただ]しい人[ひと]たちと語[かた]らい、歩[あゆ]みながら語[かた]らえ。あなたが鉢[はち]と杯[さかずき]に目[め]を向[む]けるなら、後[のち]には、より裸[はだか]な者[もの]として歩[あゆ]むことになる。"
  32: "しかし、終[お]わりには、蛇[へび]に噛[か]まれた者[もの]のように身[み]を伸[の]べ、角[つの]ある蛇[へび]に刺[さ]されて、毒[どく]が体[からだ]に広[ひろ]がる。"
  33: "あなたの目[め]が他人[たにん]の女[おんな]を見[み]るとき、あなたの口[くち]は曲[ま]がったことを語[かた]る。"
  34: "あなたは海[うみ]の心[こころ]に横[よこ]たわる者のように、大[おお]きな波[なみ]のうちにいる船頭[せんどう]のようになる。"
  35: "そして、あなたは言[い]う。「人[ひと]はわたしを打[う]ったが、わたしは痛[いた]くなかった。わたしを嘲[あざけ]ったが、わたしは知[し]らなかった。いつ朝[あさ]になるのか。そうしたら出[で]かけて、わたしが集[つど]う者[もの]たちを訪[おとず]れよう。」"

notes:
  1: "ἐὰν καθίσῃς δειπνεῖν ἐπὶ τραπέζης δυναστῶν — «если сядешь есть за столом властелинов» (δειπνέω — «ужинать, есть»; δυνάστης — «властелин»). νοητῶς νόει τὰ παρατιθέμενά σοι — «разумно разумей предлагаемое тебе» (νοητῶς — «умно, разумно»; παρατίθημι — «предлагать, ставить на стол»); повтор корня сохранён в 悟れ."
  2: "καὶ ἐπίβαλλε τὴν χεῖρά σου — «и наложи руку твою»: жест воздержания, но образ тёмен. εἰδὼς ὅτι τοιαῦτά σε δεῖ παρασκευάσαι — «зная, что такое тебе нужно приготовить» (παρασκευάζω — «приготовлять»). Слав. повторяет буквально; Синодальный (МТ) говорит о преграде в гортани — иное чтение, не внесено."
  3: "εἰ δὲ ἀπληστότερος εἶ — «если же ты более ненасытен» (ἄπληστος — «ненасытный»); слав. «аще несытнейший еси». μὴ ἐπιθύμει τῶν ἐδεσμάτων αὐτοῦ — «не желай яств его» (ἔδεσμα — «яство, кушанье»). ταῦτα γὰρ ἔχεται ζωῆς ψευδοῦς — «ибо они держатся жизни ложной» (ἔχομαι — «держаться, принадлежать»)."
  4: "μὴ παρεκτείνου πένης ὢν πλουσίῳ — «не простирайся, будучи бедным, к богатому» (παρεκτείνομαι — «простираться, тянуться»); слав. «Не распростирайся убог сый с богатым». τῇ δὲ σῇ ἐννοίᾳ ἀπόσχου — «и мыслью твоей удались» (ἔννοια — «мысль»; ἀπέχω — «держаться вдали»)."
  5: "ἐὰν ἐπιστήσῃς τὸ σὸν ὄμμα πρὸς αὐτόν — «если обратишь око твоё на него» (ἐφίστημι — «обращать»; ὄμμα — «око»). οὐδαμοῦ φανεῖται — «нигде не явится». κατεσκεύασται γὰρ αὐτῷ πτέρυγες ὥσπερ ἀετοῦ — «ибо сделаны ему крылья, как у орла» (κατασκευάζω — «изготовлять»; πτέρυξ — 翼). ὑποστρέφει εἰς τὸν οἶκον τοῦ προεστηκότος αὐτοῦ — «возвращается в дом господина его» (προέστηκα — «стоять во главе»)."
  6: "μὴ συνδείπνει ἀνδρὶ βασκάνῳ — «не ужинай с мужем завистливым» (συνδειπνέω — «есть вместе»; βάσκανος — «завистливый, сглазливый»). μηδὲ ἐπιθύμει τῶν βρωμάτων αὐτοῦ — «и не желай пищи его» (βρῶμα — «пища»)."
  7: "ὃν τρόπον γὰρ εἴ τις καταπίοι τρίχα — «ибо как если кто проглотит волос» (καταπίνω — «проглатывать»; θρίξ, τρίχα — «волос»). οὕτως ἐσθίει καὶ πίνει — «так он ест и пьёт»: сравнение тёмное, передано буквально. Слав. к этому стиху добавляет начало гр. 8 («ниже к себе да введеши его…»); по делению gr эти слова — в ст. 8."
  8: "μηδὲ πρὸς σὲ εἰσαγάγῃς αὐτὸν καὶ φάγῃς τὸν ψωμόν σου μετ᾽ αὐτοῦ — «и не вводи его к себе, и не ешь с ним куска твоего» (εἰσάγω — «вводить»; ψωμός — «кусок»). ἐξεμέσει γὰρ αὐτὸν — «ибо он изблюёт его» (ἐξεμέω — «извергать»). καὶ λυμανεῖται τοὺς λόγους σου τοὺς καλούς — «и осквернит слова твои добрые» (λυμαίνομαι — «портить, осквернять»)."
  9: "εἰς ὦτα ἄφρονος μηδὲν λέγε — «в уши глупого ничего не говори». μήποτε μυκτηρίσῃ τοὺς συνετοὺς λόγους σου — «как бы он не осмеял разумные слова твои» (μυκτηρίζω — «насмехаться, издеваться»; συνετός — «разумный»)."
  10: "μὴ μεταθῇς ὅρια αἰώνια — «не передвигай пределов вечных»; ср. 22:28. εἰς δὲ κτῆμα ὀρφανῶν μὴ εἰσέλθῃς — «и в имение сирот не входи» (κτῆμα — «имение, владение»; ὀρφανός — 孤児)."
  11: "ὁ γὰρ λυτρούμενος αὐτοὺς κύριος κραταιός ἐστιν — «ибо избавляющий их Господь силён» (λυτρόω — «выкупать, избавлять»; κραταιός — «крепкий»). καὶ κρινεῖ τὴν κρίσιν αὐτῶν μετὰ σοῦ — «и будет судить их суд с тобою»."
  12: "δὸς εἰς παιδείαν τὴν καρδίαν σου — «дай в научение сердце твоё» (παιδεία — 戒め); слав. «Даждь в наказание сердце твое». τὰ δὲ ὦτά σου ἑτοίμασον λόγοις αἰσθήσεως — «и уши твои приготовь к словам чувства/ведения» (αἴσθησις — «чувство, восприятие»; слав. «словесем чувственным»); передано 悟りの言葉."
  13: "μὴ ἀπόσχῃ νήπιον παιδεύειν — «не удерживайся наставлять младенца» (ἀπέχω — «удерживаться»; νήπιος — «младенец, дитя»). ὅτι ἐὰν πατάξῃς αὐτὸν ῥάβδῳ, οὐ μὴ ἀποθάνῃ — «ибо если ударишь его жезлом, он не умрёт» (πατάσσω — «ударять»; ῥάβδος — «жезл, розга»)."
  14: "σὺ μὲν γὰρ πατάξεις αὐτὸν ῥάβδῳ — «ты ведь ударишь его жезлом». τὴν δὲ ψυχὴν αὐτοῦ ἐκ θανάτου ῥύσῃ — «и душу его от смерти избавишь» (ῥύομαι — «избавлять»)."
  15: "υἱέ, ἐὰν σοφὴ γένηταί σου ἡ καρδία — «сын, если сердце твоё станет мудрым». εὐφρανεῖς καὶ τὴν ἐμὴν καρδίαν — «возвеселишь и моё сердце» (εὐφραίνω — «веселить»). Обращение учителя, не чужая речь — без кавычек."
  16: "καὶ ἐνδιατρίψει λόγοις τὰ σὰ χείλη πρὸς τὰ ἐμὰ χείλη — «и будут пребывать в словах уста твои к устам моим» (ἐνδιατρίβω — «пребывать, проводить время»): вторая половина в гр. тёмная, передана буквально; jp-joc и Синодальный (МТ) читают иначе («внутренности мои возрадуются»). ἐὰν ὀρθὰ ὦσιν — «если они прямы»."
  17: "μὴ ζηλούτω ἡ καρδία σου ἁμαρτωλούς — «да не ревнует сердце твоё грешникам» (ζηλόω — «ревновать, завидовать»); слав. «Да не ревнует сердце твое грешником». ἀλλὰ ἐν φόβῳ κυρίου ἴσθι ὅλην τὴν ἡμέραν — «но в страхе Господнем будь весь день»."
  18: "ἐὰν γὰρ τηρήσῃς αὐτά — «ибо если соблюдёшь их» (τηρέω — «соблюдать»). ἔσται σοι ἔκγονα — «будут тебе потомки» (ἔκγονος — «потомок»; слав. «внуцы»). ἡ δὲ ἐλπίς σου οὐκ ἀποστήσεται — «и надежда твоя не отступит» (ἀφίστημι — «отступать»)."
  19: "ἄκουε, υἱέ, καὶ σοφὸς γίνου — «слушай, сын, и будь мудр». κατεύθυνε ἐννοίας σῆς καρδίας — «направляй мысли сердца твоего» (κατευθύνω — «выпрямлять»; ἔννοια — «мысль»)."
  20: "μὴ ἴσθι οἰνοπότης — «не будь пьяницей» (οἰνοπότης — «пьющий вино»). μηδὲ ἐκτείνου συμβολαῖς κρεῶν τε ἀγορασμοῖς — «и не тянись к складчинам и покупкам мяса» (συμβολή — «складчина, пирушка»; ἀγορασμός — «покупка»)."
  21: "πᾶς γὰρ μέθυσος καὶ πορνοκόπος πτωχεύσει — «ибо всякий пьяница и блудник обеднеет» (μέθυσος — «пьяница»; πορνοκόπος — «предающийся блуду»; πτωχεύω — «беднеть»); πορνοκόπος передано みだらな者. καὶ ἐνδύσεται διερρηγμένα καὶ ῥακώδη πᾶς ὑπνώδης — «и оденется в разодранное и рубища всякий сонливый» (ῥακώδης — «рубищный»; ὑπνώδης — «сонливый»)."
  22: "ἄκουε, υἱέ, πατρὸς τοῦ γεννήσαντός σε — «слушай, сын, отца, родившего тебя» (γεννάω — «рождать»). καὶ μὴ καταφρόνει ὅτι γεγήρακέν σου ἡ μήτηρ — «и не презирай, что состарилась мать твоя» (καταφρονέω — «презирать»; γηράσκω — «стареть»)."
  23: "В gr-lxx-byz на месте стиха «.» — дефект модуля; переведено по csl-ru: «Истину стяжи и не отрини мудрости и учения и разума». κτάομαι — «приобретать» (стяжи); ἀθετέω — «отвергать» (отрини). jp-joc и Синодальный (МТ) читают иначе: «купи истину и не продавай…» — это чтение МТ, в основной текст не внесено. 〔…〕 не ставятся: это пробел модуля."
  24: "καλῶς ἐκτρέφει πατὴρ δίκαιος — «хорошо воспитывает отец праведный» (ἐκτρέφω — «вскармливать, воспитывать»). ἐπὶ δὲ υἱῷ σοφῷ εὐφραίνεται ἡ ψυχὴ αὐτοῦ — «и о сыне мудром веселится душа его»."
  25: "εὐφραινέσθω ὁ πατὴρ καὶ ἡ μήτηρ ἐπὶ σοί — «да веселится отец и мать о тебе» (импер. 3 л.). καὶ χαιρέτω ἡ τεκοῦσά σε — «и да радуется родившая тебя» (χαίρω — «радоваться»; τίκτω — «рождать»)."
  26: "δός μοι, υἱέ, σὴν καρδίαν — «дай мне, сын, сердце твоё»: говорит Премудрость (или учитель), но это продолжение наставления, а не вложенная цитата, поэтому без кавычек. οἱ δὲ σοὶ ὀφθαλμοὶ ἐμὰς ὁδοὺς τηρείτωσαν — «и очи твои пусть хранят пути мои» (τηρέω — «хранить»)."
  27: "πίθος γὰρ τετρημένος ἐστὶν ἀλλότριος οἶκος — «ибо пробитый пифос — чужой дом» (πίθος — «пифос, большой сосуд»; τετρημένος — «пробитый»); слав. «Сосуд бо сокрушен чуждий дом». καὶ φρέαρ στενὸν ἀλλότριον — «и колодец тесный — чужой» (φρέαρ — 井戸); слав. «студенец тесен чуждий». Речь о доме чужой жены (см. ст. 33); в LXX имя не названо, поэтому 他人の家 / 他人のもの."
  28: "οὗτος γὰρ συντόμως ἀπολεῖται — «ибо он вскоре погибнет» (συντόμως — «быстро, скоро»; ἀπόλλυμαι — «погибать»). καὶ πᾶς παράνομος ἀναλωθήσεται — «и всякий беззаконник истреблён будет» (ἀναλίσκω — «истреблять»). Синодальный (МТ) и jp-joc иначе: «как разбойник, сидит в засаде…» — иное чтение, не внесено."
  29: "τίνι οὐαί; τίνι θόρυβος; τίνι κρίσις; — «кому горе? кому смятение? кому суд?» (οὐαί — «горе»; θόρυβος — «шум, смятение»; κρίσις — «суд»). τίνι ἀηδίαι καὶ λέσχαι; — в LXX «кому тошнота и беседы?» (ἀηδία — «отвращение, тошнота»; λέσχη — «беседа, пересуды»); слав. читает иначе — «горести и свары», по паритету взято слав. чтение (苦しみと争い), вариант LXX отмечен здесь. τίνι συντρίμματα διὰ κενῆς; — «кому сокрушения без причины?» τίνος πέλειοι οἱ ὀφθαλμοί; — «у кого глаза голубиные?» (πέλεια — «голубь»); слав. «кому сини очи», jp-joc «赤き目» — о глазах пьяницы."
  30: "οὐ τῶν ἐγχρονιζόντων ἐν οἴνοις; — «не у тех ли, кто засиживается за вином?» (ἐγχρονίζω — «задерживаться, проводить время»). οὐ τῶν ἰχνευόντων ποῦ πότοι γίνονται; — «не у тех ли, кто выслеживает, где бывают попойки?» (ἰχνεύω — «выслеживать»; πότος — «попойка»). Продолжение вопроса ст. 29."
  31: "μὴ μεθύσκεσθε οἴνῳ — «не упивайтесь вином» (μεθύσκω — «опьянять»); слав. «Не упивайтеся вином». ἀλλὰ ὁμιλεῖτε ἀνθρώποις δικαίοις καὶ ὁμιλεῖτε ἐν περιπάτοις — «но беседуйте с людьми праведными и беседуйте на прогулках» (ὁμιλέω — «беседовать»; περίπατος — «прогулка, переход»); этого чтения нет в МТ, но оно есть у csl. ἐὰν γὰρ εἰς τὰς φιάλας καὶ τὰ ποτήρια δῷς τοὺς ὀφθαλμούς σου — «ибо если на фиалы и кубки дашь очи твои» (φιάλη — «фиал, чаша», в корпусе 鉢; ποτήριον — 杯). ὕστερον περιπατήσεις γυμνότερος ὑπέρου — «после будешь ходить наглее [песта]»: ὑπέρου — тёмное слово (ὕπερος — «пест, колотушка»); слав. «нажайший белилнаго древа»; передано より裸な者, без домысла."
  32: "τὸ δὲ ἔσχατον ὥσπερ ὑπὸ ὄφεως πεπληγὼς ἐκτείνεται — «а в конце, как ужаленный змеёй, простирается» (ἔσχατον — «конец»; πλήσσω — «поражать»; ἐκτείνω — «простирать»). ὥσπερ ὑπὸ κεράστου διαχεῖται αὐτῷ ὁ ἰός — «и как от кераста разливается в нём яд» (κέραστης — «рогатая змея, кераст»; διαχέω — «разливать»; ἰός — «яд»); κέραστης передан как 角のある蛇."
  33: "οἱ ὀφθαλμοί σου ὅταν ἴδωσιν ἀλλοτρίαν — «очи твои, когда увидят чужую жену» (ἀλλοτρία — «чужая»); слав. добавляет в скобках «(жену)». τὸ στόμα σου τότε λαλήσει σκολιά — «уста твои тогда скажут кривое» (σκολιός — «кривой, лукавый»)."
  34: "καὶ κατακείσῃ ὥσπερ ἐν καρδίᾳ θαλάσσης — «и возляжешь, как в сердце моря» (κατάκειμαι — «лежать»; καρδία θαλάσσης — «сердце моря», т. е. глубина). ὥσπερ κυβερνήτης ἐν πολλῷ κλύδωνι — «как кормчий в большом волнении» (κυβερνήτης — 船頭; κλύδων — «волнение»)."
  35: "ἐρεῖς δέ — «и скажешь»: слова пьяницы, прямая речь, 「…」. Τύπτουσίν με, καὶ οὐκ ἐπόνεσα — «бьют меня, и не было больно» (τύπτω — «бить»; πονέω — «болеть»). ἐνέπαιξάν μοι, ἐγὼ δὲ οὐκ ᾔδειν — «издевались надо мной, а я не знал» (ἐμπαίζω — «издеваться»). πότε ὄρθρος ἔσται, ἵνα ἐλθὼν ζητήσω μεθ᾽ ὧν συνελεύσομαι; — «когда будет утро, чтобы, придя, поискать тех, с кем я соберусь?» (ὄρθρος — «рассвет»; συνέρχομαι — «собираться»)."
