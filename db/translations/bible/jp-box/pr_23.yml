# jp-box, Притчи, глава 23. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для
# понимания, не источник. jp-joc есть для 23:15–35 (контроль церковного чтения);
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 23: трапеза у правителя (1–3), богатство (4–5), завистливый (6–8),
# глупец (9), межа сирот (10–11), ухо и сердце (12), наказание юного (13–14),
# радость отца (15–16), страх Господень (17–18), вино и мясо (19–21),
# отец и мать (22), истина (23), праведный отец (24–25), сердце сына (26),
# чужая жена (27–28), пьяница (29–35).
# Речь: слова пьяницы в 35 — 「…」; 15–28 — наставление учителя, прямые обращения
# (わが子よ) без внешних кавычек; прочее — авторские изречения.
# Нумерация по gr: 35 стихов.
# ВНИМАНИЕ (дефект модуля): 23:23 в gr-lxx-byz стоит как «.», переведён по csl-ru —
# единственному свидетелю (jp-joc и Синодальный дают иное чтение по МТ).
# 〔…〕 нет: пропуск модуля — не церковное добавление; сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX).

