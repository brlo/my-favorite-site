verses:
  1: "さて、ラザロという名[な]の病人[びょうにん]がいた。ベタニアの者[もの]で、マリアと、その姉妹[しまい]マルタの村[むら]の人[ひと]であった。"
  2: "マリアとは、主[しゅ]に香油[こうゆ]を塗[ぬ]り、自分[じぶん]の髪[かみ]でその足[あし]を拭[ふ]いた女[おんな]のことである。その兄弟[きょうだい]ラザロが病[やまい]であった。"
  3: "そこで、姉妹[しまい]たちはイエスのもとへ人[ひと]を遣[つか]わして言[い]った。「主[しゅ]よ、あなたが愛[あい]しておられる者[もの]が病[やまい]です。」"
  4: "イエスはそれを聞[き]いて言[い]われた。「<j>この病[やまい]は死[し]に至[いた]るものではない。神[かみ]の栄光[えいこう]のためであり、神[かみ]の子[こ]がそれによって栄光[えいこう]を受[う]けるためである。</j>」"
  5: "イエスはマルタを、その姉妹[しまい]を、ラザロを愛[あい]しておられた。"
  6: "ラザロが病[やまい]だと聞[き]くと、イエスはなお二日[ふつか]の間[あいだ]、おられた所[ところ]にとどまられた。"
  7: "その後[のち]、イエスは弟子[でし]たちに言[い]われた。「<j>もう一度[いちど]、ユダヤへ行[い]こう。</j>」"
  8: "弟子[でし]たちは言[い]った。「ラビ、ユダヤ人[じん]たちが今[いま]しがた、あなたを石打[いしう]ちにしようとしていたのに、またそこへ行[い]かれるのですか。」"
  9: "イエスは答[こた]えられた。「<j>昼[ひる]には十二時間[じゅうにじかん]あるではないか。昼[ひる]に歩[ある]く者[もの]はつまずかない。この世[よ]の光[ひかり]を見[み]ているからである。</j>"
  10: "<j>だが、夜[よる]に歩[ある]く者[もの]はつまずく。その者[もの]に光[ひかり]がないからである。</j>」"
  11: "イエスはこう言[い]ってから、彼[かれ]らに言[い]われた。「<j>わたしたちの友[とも]ラザロは眠[ねむ]っている。わたしは彼[かれ]を目[め]覚[ざ]めさせるために行[い]く。</j>」"
  12: "弟子[でし]たちは言[い]った。「主[しゅ]よ、眠[ねむ]っているのなら、治[なお]るでしょう。」"
  13: "イエスはラザロの死[し]について言[い]われたのだが、彼[かれ]らは、イエスが眠[ねむ]っていることを言[い]っておられるのだと思[おも]った。"
  14: "そこで、イエスははっきりと彼[かれ]らに言[い]われた。「<j>ラザロは死[し]んだ。</j>"
  15: "<j>わたしは、そこにいなかったことを、あなたがたのために喜[よろこ]んでいる。あなたがたが信[しん]じるようになるためである。だが、彼[かれ]のところへ行[い]こう。</j>」"
  16: "そこで、ディディモと呼[よ]ばれるトマスが、同[おな]じ弟子[でし]たちに言[い]った。「わたしたちも行[い]って、彼[かれ]と一緒[いっしょ]に死[し]のう。」"
  17: "イエスはそこへ来[き]て、ラザロがすでに四日[よっか]の間[あいだ]墓[はか]の中[なか]にいるのを見[み]つけられた。"
  18: "ベタニアはエルサレムに近[ちか]く、十五[じゅうご]スタディオンほど離[はな]れていた。"
  19: "ユダヤ人[じん]の多[おお]くが、兄弟[きょうだい]のことでマルタとマリアを慰[なぐさ]めようと、彼女[かのじょ]たちのもとへ来[き]ていた。"
  20: "マルタは、イエスが来[こ]られると聞[き]いて、迎[むか]えに出[で]た。マリアは家[いえ]に座[すわ]っていた。"
  21: "マルタはイエスに言[い]った。「主[しゅ]よ、あなたがここにおられたなら、わたしの兄弟[きょうだい]は死[し]ななかったでしょうに。"
  22: "しかし、今[いま]でも、あなたが神[かみ]に求[もと]めることは何[なん]でも、神[かみ]がお与[あた]えになることを知[し]っています。」"
  23: "イエスは言[い]われた。「<j>あなたの兄弟[きょうだい]は復活[ふっかつ]する。</j>」"
  24: "マルタは言[い]った。「終[お]わりの日[ひ]の復活[ふっかつ]のとき、彼[かれ]が復活[ふっかつ]することは知[し]っています。」"
  25: "イエスは言[い]われた。「<j>わたしは復活[ふっかつ]であり、命[いのち]である。わたしを信[しん]じる者[もの]は、たとえ死[し]ぬことがあっても、必[かなら]ず生[い]きる。</j>"
  26: "<j>また、生[い]きていてわたしを信[しん]じる者[もの]は、とこしえに死[し]ぬことがない。あなたはこれを信[しん]じるか。</j>」"
  27: "彼女[かのじょ]は言[い]った。「はい、主[しゅ]よ。あなたが、世[よ]に来[く]るべきキリスト、神[かみ]の子[こ]であることを、わたしは信[しん]じています。」"
  28: "これを言[い]うと、マルタは行[い]って、ひそかに姉妹[しまい]マリアを呼[よ]び、「先生[せんせい]がおいでになり、あなたを呼[よ]んでいます」と言[い]った。"
  29: "マリアはそれを聞[き]くと、すぐに立[た]ち上[あ]がって、イエスのところへ行[い]った。"
  30: "イエスはまだ村[むら]に入[はい]っておらず、マルタが迎[むか]えに出[で]た所[ところ]に、そのままおられた。"
  31: "マリアと一緒[いっしょ]に家[いえ]にいて彼女[かのじょ]を慰[なぐさ]めていたユダヤ人[じん]たちは、マリアが急[いそ]いで立[た]ち上[あ]がって出[で]て行[い]くのを見[み]て、墓[はか]へ泣[な]きに行[い]くのだと思[おも]い、彼女[かのじょ]の後[あと]について行[い]った。"
  32: "マリアはイエスのおられる所[ところ]に来[き]て、イエスを見[み]ると、その足[あし]もとにひれ伏[ふ]して言[い]った。「主[しゅ]よ、あなたがここにおられたなら、わたしの兄弟[きょうだい]は死[し]ななかったでしょうに。」"
  33: "イエスは、彼女[かのじょ]が泣[な]き、一緒[いっしょ]に来[き]たユダヤ人[じん]たちも泣[な]いているのをご覧[らん]になり、霊[れい]に激[はげ]しく悲[かな]しみ、心[こころ]を騒[さわ]がせられた。"
  34: "そして言[い]われた。「<j>どこに彼[かれ]を置[お]いたのか。</j>」彼[かれ]らは言[い]った。「主[しゅ]よ、来[き]てご覧[らん]ください。」"
  35: "イエスは涙[なみだ]を流[なが]された。"
  36: "すると、ユダヤ人[じん]たちは言[い]った。「ご覧[らん]ください。あの方[かた]がどれほど彼[かれ]を愛[あい]しておられたか。」"
  37: "しかし、彼[かれ]らのうちの幾人[いくにん]かは言[い]った。「盲人[もうじん]の目[め]を開[ひら]けたこの方[かた]が、この人[ひと]も死[し]なないようにすることはできなかったのか。」"
  38: "イエスは、またご自身[じしん]の内[うち]に激[はげ]しく悲[かな]しみながら、墓[はか]へ来[こ]られた。そこは洞窟[どうくつ]で、その上[うえ]に石[いし]が置[お]かれていた。"
  39: "イエスは言[い]われた。「<j>石[いし]を取[と]り除[の]けなさい。</j>」死[し]んだ者[もの]の姉妹[しまい]マルタが言[い]った。「主[しゅ]よ、もう臭[くさ]くなっております。四日[よっか]にもなりますから。」"
  40: "イエスは言[い]われた。「<j>あなたに、信[しん]じるなら神[かみ]の栄光[えいこう]を見[み]ると言[い]ったではないか。</j>」"
  41: "そこで、人々[ひとびと]は石[いし]を取[と]り除[の]けた。イエスは目[め]を上[うえ]に上[あ]げて言[い]われた。「<j>父[ちち]よ、わたしの言[い]うことを聞[き]いてくださったことを、感謝[かんしゃ]します。</j>"
  42: "<j>わたしは、あなたがいつもわたしの言[い]うことを聞[き]いてくださることを知[し]っています。しかし、周[まわ]りに立[た]っている群衆[ぐんしゅう]のために言[い]いました。あなたがわたしを遣[つか]わしたことを、彼[かれ]らが信[しん]じるためです。</j>」"
  43: "こう言[い]ってから、大[おお]きな声[こえ]で叫[さけ]ばれた。「<j>ラザロ、出[で]て来[き]なさい。</j>」"
  44: "すると、死[し]んだ者[もの]が、手足[てあし]を布[ぬの]で巻[ま]かれ、顔[かお]は布[ぬの]で包[つつ]まれたまま出[で]て来[き]た。イエスは彼[かれ]らに言[い]われた。「<j>ほどいて、行[い]かせてやりなさい。</j>」"
  45: "そこで、マリアのところへ来[き]ていたユダヤ人[じん]の多[おお]くは、イエスがなさったことを見[み]て、イエスを信[しん]じた。"
  46: "しかし、彼[かれ]らのうちの幾人[いくにん]かは、ファリサイ派[は]の人々[ひとびと]のところへ行[い]き、イエスがなさったことを話[はな]した。"
  47: "そこで、祭司長[さいしちょう]たちとファリサイ派[は]の人々[ひとびと]は最高法院[さいこうほういん]を開[ひら]き、言[い]った。「どうしたらよいのか。あの男[おとこ]は多[おお]くのしるしを行[おこな]っている。"
  48: "このまま放[ほう]っておけば、人々[ひとびと]は皆[みな]、あの男[おとこ]を信[しん]じるようになる。そうなればローマ人[じん]たちが来[き]て、わたしたちの土地[とち]も国民[こくみん]も奪[うば]い去[さ]ってしまう。」"
  49: "彼[かれ]らの一人[ひとり]で、その年[とし]の大祭司[だいさいし]であったカヤパが、彼[かれ]らに言[い]った。「あなたがたは何[なに]も分[わ]かっていない。"
  50: "一人[ひとり]の人[ひと]が民[たみ]のために死[し]に、国民[こくみん]全体[ぜんたい]が滅[ほろ]びないですむなら、そのほうがあなたがたにとって得[とく]だとは思[おも]わないのか。」"
  51: "彼[かれ]はこれを自分[じぶん]から言[い]ったのではなく、その年[とし]の大祭司[だいさいし]であったので、イエスが民[たみ]のために死[し]ぬことを預言[よげん]したのである。"
  52: "それはこの民[たみ]のためだけではなく、散[ち]らされた神[かみ]の子[こ]たちを一[ひと]つに集[あつ]めるためでもあった。"
  53: "その日[ひ]から、彼[かれ]らはイエスを殺[ころ]そうと相談[そうだん]した。"
  54: "そこで、イエスはもはやユダヤ人[じん]の間[あいだ]を公然[こうぜん]と歩[ある]かれず、そこを去[さ]って、荒[あ]れ野[の]に近[ちか]い地方[ちほう]、エフライムという町[まち]へ行[い]き、弟子[でし]たちとともにそこにとどまられた。"
  55: "ユダヤ人[じん]の過越祭[すぎこしまつり]が近[ちか]づいていた。多[おお]くの人々[ひとびと]は、身[み]を清[きよ]めるために、過越祭[すぎこしまつり]の前[まえ]に地方[ちほう]からエルサレムへ上[のぼ]った。"
  56: "彼[かれ]らはイエスを捜[さが]し、神殿[しんでん]に立[た]って互[たが]いに言[い]った。「どう思[おも]う。あの人[ひと]は祭[まつ]りに来[こ]ないのだろうか。」"
  57: "祭司長[さいしちょう]たちとファリサイ派[は]の人々[ひとびと]は、イエスの居場所[いばしょ]を知[し]った者[もの]は届[とど]け出[で]るようにとの命令[めいれい]を出[だ]していた。イエスを捕[と]らえるためであった。"

notes:
  1: "Βηθανία — ベタニア (по заданию); в Мф 21:17, 26:6; Мк 11:1; Лк 19:29 корпуса стоит ベタニア (расхождение вынесено на ревью)."
  5: "Перечислительный строй «マルタを、その姉妹を、ラザロを» сохранён; вариант с と-перечислением совпадал с jp-ni дословно (sim_jp)."
  6: "ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ — «когда услышал, что болен»; τότε μὲν ἔμεινεν — «тогда остался»; なお二日の間, без сглаживания «пробыл два дня»."
  17: "τέσσαρας ἤδη ἡμέρας ἔχοντα ἐν τῷ μνημείῳ — «уже четыре дня [пролежавшего] в гробе»; 四日の間墓の中にいる."
  25: "κἂν ἀποθάνῃ ζήσεται — «если и умрёт, будет жить»; たとえ死ぬことがあっても、必ず生きる. 必ず — усиление уверенности, чтобы не совпадать с jp-ni дословно (sim_jp)."
  33: "ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν — «восскорбел духом и возмутился»; 霊に激しく悲しみ、心を騒がせられた. Не сглажено до «прослезился»."
  38: "πάλιν ἐμβριμώμενος ἐν ἑαυτῷ — «снова внутренне скорбя/волнуясь»; またご自身の内に激しく悲しみながら."
  39: "τεταρταῖος γάρ ἐστιν — «ибо он четвёртый день [в гробе]»; 四日にもなります."
  49: "ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου — «будучи первосвященником того года»; その年の大祭司. Каиафа — современная форма; в mf_26 и lk_03 корпуса стоит カヤパ (расхождение вынесено на ревью)."
  51: "ἀφ᾿ ἑαυτοῦ οὐκ εἶπεν — «не от себя сказал»; 自分から言ったのではなく. Пророчество — по должности первосвященника, а не по личному прозрению."
