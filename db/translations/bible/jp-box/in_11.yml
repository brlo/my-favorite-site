# jp-box, Евангелие от Иоанна, глава 11. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в notes.
# jp-ni не использовался.
#
# Глава 11: болезнь и смерть Лазаря (1–16), приход в Вифанию (17–32),
# слёзы Иисуса и воскрешение Лазаря (33–44), решение синедриона (45–53),
# уход в Ефраим (54), приближение Пасхи (55–57).
# Слова Христа — красным (<j>); слова Марфы, Марии, Фомы, иудеев, Каиафы,
# синедриона и толпы — вне тегов. Слова Марфы о Господе (11:28) тоже не красные.
# Синего (<mo>) в главе нет: Мария из Вифании — не Богородица.
# 11:33 и 38: ἐνεβριμήσατο τῷ πνεύματι — «восскорбел духом», не сглажено.
# 11:35 — по заданию: 涙を流された.

