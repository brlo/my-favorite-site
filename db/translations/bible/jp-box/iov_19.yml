# jp-box, Иов, глава 19. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc в книге Иов есть только для глав 1–2; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 19: ответ Иова. Формула 19:1 — повествование вне кавычек; речь 19:2–29 — одна
# цитата. Слова, которые Иов вкладывает в уста друзьям (19:28), — 『…』 внутри речи.
# 19:23–24 — одно пожелание, разрезанное границей стихов (23 кончается запятой).
# 19:25–27 — «я знаю, Искупитель мой»: по LXX ἀέναός ἐστιν («вечен/присносущен») и
# ἀναστήσαι («воскресить») — торжественность сохранена; слав. «присносущен», Син. «жив» — в notes.
# Поэзия: тёмные места сохранены (19:7 «смеюсь над поношением» против Син. «насилие»,
# 19:20 «кости в зубах», 19:27 «в недре», 19:29 «покрывало»/«вещество»).
# Нумерация по gr: 29 стихов; в 19:4 стоит подметка «4a» — стих не делим, переведён целиком.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
# Голоса: 1 — повествование, 2–29 — Иов (одна цитата, закрывается в конце главы).

