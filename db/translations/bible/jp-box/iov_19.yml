verses:
  1: "ヨブは答[こた]えて言[い]った。"
  2: "「いつまで、あなたがたはわたしの魂[たましい]を疲[つか]れさせ、言葉[ことば]でわたしを打ち倒[たお]すのか。"
  3: "ただ、主[しゅ]がわたしをこのように造[つく]ったことを知[し]れ。あなたがたはわたしを中傷[ちゅうしょう]し、恥[は]じもなくわたしに迫[せま]っている。"
  4: "確[たし]かに、わたしは迷[まよ]った。わたしのうちには迷[まよ]いが宿[やど]っている。ふさわしくない言葉[ことば]を語[かた]り、わたしの言葉は時[とき]を得ずに迷う。"
  5: "あなたがたがわたしに対して大[おお]きくなり、わたしを辱[はずか]しめていどみかかるのなら。"
  6: "ならば、知[し]れ。わたしをかき乱[みだ]したのは主[しゅ]である。主はご自分[じぶん]の砦[とりで]をわたしに対して高[たか]く築[きず]かれた。"
  7: "見[み]よ、わたしは辱[はずかし]めを笑[わら]い、語[かた]らない。わたしが叫[さけ]んでも、どこにも裁[さば]きはない。"
  8: "わたしは周[まわ]りを囲[かこ]まれ、通[とお]り抜[ぬ]けられない。主[しゅ]はわたしの顔[かお]の前[まえ]に闇[やみ]を置かれた。"
  9: "主[しゅ]はわたしから栄光[えいこう]を剥ぎ取り、わたしの頭[あたま]から冠[かんむり]を取り去られた。"
  10: "主[しゅ]は四方[しほう]からわたしを引き裂[さ]き、わたしは去って行った。主は木のように、わたしの望[のぞ]みを切り倒[たお]された。"
  11: "主[しゅ]は激[はげ]しくわたしに怒[いか]り、わたしを敵[てき]のように見なされた。"
  12: "主[しゅ]の略奪隊[りゃくだつたい]は一斉[いっせい]にわたしの道[みち]に来て、わたしを囲[かこ]んだ。待[ま]ち伏せの者[もの]たちが。"
  13: "わたしの兄弟[きょうだい]たちはわたしから離[はな]れ、知[し]る者[もの]たちはわたしよりも他人[たにん]を選[えら]んだ。わたしの友[とも]たちは無情[むじょう]になった。"
  14: "わたしの近[ちか]しい者[もの]たちはわたしを顧[かえり]みず、わたしの名を知[し]る者[もの]たちもわたしを忘[わす]れた。"
  15: "家[いえ]の隣人[りんじん]たちも、わたしのはしためたちも、わたしをよそ者[もの]のように思[おも]った。"
  16: "わたしは自分のしもべを呼んだが、答[こた]えなかった。わたしの口[くち]は彼に願[ねが]った。"
  17: "わたしは妻[つま]に願[ねが]い、自分の側女[そばめ]たちの子らに媚びて呼びかけた。"
  18: "彼[かれ]らはわたしを永久[えいきゅう]に退[しりぞ]けた。わたしが立ち上がると、彼らはわたしに逆[さか]らって語[かた]る。"
  19: "わたしを知[し]る者[もの]たちはわたしを忌み嫌[きら]った。わたしが愛[あい]した者[もの]たちが、わたしに立ち向[む]かった。"
  20: "わたしの皮[かわ]の中で肉[にく]は腐[くさ]り、わたしの骨[ほね]は歯だけで支[ささ]えられている。"
  21: "わたしをあわれんでくれ、わたしをあわれんでくれ、友[とも]たちよ。主[しゅ]の手がわたしに触れたのだから。"
  22: "なぜ、あなたがたも主[しゅ]のようにわたしを追い求[もと]めるのか。なぜ、わたしの肉[にく]で満[み]ち足りないのか。"
  23: "だれか、わたしの言葉[ことば]が書[か]き記[しる]され、永遠[えいえん]に至[いた]るまで書物[しょもつ]に記[しる]されるようにしてくれればよいのに、"
  24: "鉄[てつ]の筆[ふで]と鉛[なまり]で、岩[いわ]に刻[きざ]み込[こ]まれて。"
  25: "わたしは知っている。わたしを地上[ちじょう]で解き放[はな]つ方[かた]は、永遠[えいえん]に生[い]きておられる、と。"
  26: "わたしのこの皮[かわ]を、これらを耐[た]え忍[しの]んだこの皮を、主[しゅ]は起こしてくださる。これらのことは主によってわたしに成し遂[と]げられたからである。"
  27: "わたし自身[じしん]が知[し]り、わたしの目が見たこと、ほかの者の目ではない。すべてはわたしの胸[むね]のうちで成し遂げられた。"
  28: "あなたがたが『わたしたちは彼に対して何[なに]を言おうか。言葉[ことば]の根を彼のうちに見いだした』と言うなら。"
  29: "あなたがたもまた剣[つるぎ]を恐[おそ]れよ。怒[いか]りが不法[ふほう]な者[もの]たちに臨[のぞ]むからである。そのとき、彼らは自分[じぶん]たちの材料[ざいりょう]がどこにあるかを知るだろう。」"

notes:
  1: "Повествование: формула вводит речь Иова, вне кавычек. Ὑπολαβὼν δὲ Ιωβ λέγει — «и отвечал Иов и говорит». Слав. «Отвещав же иов, рече»."
  2: "Иов: Ἕως τίνος ἔγκοπον ποιήσετε ψυχήν μου — «доколе будете делать душу мою изнурённой» (ἔγκοπος — «изнурённый, утруждённый»); καθαιρεῖτε με λόγοις — «низлагаете меня словами» (καθαιρέω — «сносить, разрушать»)."
  3: "Иов: γνῶτε μόνον ὅτι ὁ κύριος ἐποίησέ με οὕτως — «знайте только, что Господь сделал меня так»; καταλαλεῖτέ μου — «клевещете на меня» (καταλαλέω); οὐκ αἰσχυνόμενοι ἐπίκεισθέ μοι — «не стыдясь, тесните меня» (ἐπίκειμαι — «налегать»). Слав. 19:2 вбирает начало этого стиха («уразумейте токмо…»), держимся деления gr."
  4: "Иов: ναὶ δὴ ἐπ᾿ ἀληθείας ἐγὼ ἐπλανήθην — «да, поистине я заблудился» (πλανάω); παρ᾿ ἐμοὶ αὐλίζεται πλάνος — «у меня живёт заблуждение» (πλάνος — «обман, заблуждение»); λαλῆσαι ῥῆμα ὃ οὐκ ἔδει — «сказать слово, которого не должно было»; τὰ ῥήματά μου πλανᾶται καὶ οὐκ ἐπὶ καιροῦ — «слова мои блуждают и не вовремя». В греч. внутри стиха стоит подметка «4a»; стих не делим."
  5: "Иов: ἔα ὅτι ἐπ᾿ ἐμοὶ μεγαλύνεσθε — «если вы надо мной величаетесь» (μεγαλύνω); ἐνάλλεσθε δέ μοι ὀνείδει — «наскакиваете на меня с поношением» (ὄνειδος — «позор, поношение»). Слав. «на мя величаетеся… поношением»."
  6: "Иов: γνῶτε οὖν ὅτι ὁ κύριός ἐστιν ὁ ταράξας — «итак знайте, что Господь — Тот, кто привёл в смятение» (ταράσσω); ὀχύρωμα δὲ αὐτοῦ ἐπ᾽ ἐμὲ ὕψωσεν — «и крепость (оплот) Свою на меня возвысил» (ὀχύρωμα). Слав. «ограду свою на мя вознесе»."
  7: "Иов: ἰδοὺ γελῶ ὀνείδει καὶ οὐ λαλήσω — «вот, я смеюсь над поношением и не буду говорить» (γέλως/γελάω); κεκράξομαι, καὶ οὐδαμοῦ κρίμα — «воззову, и нигде нет суда» (κρίμα). Син. по евр.: «вот, я кричу: обида! и никто не слушает» — это масоретское чтение, в текст не внесено."
  8: "Иов: κύκλῳ περιῳκοδόμημαι — «я обстроен кругом» (περιοικοδομέω — «обносить стеной»); ἐπὶ πρόσωπόν μου σκότος ἔθετο — «на лицо моё положил тьму». Слав. «огражден есмь… тму положи»."
  9: "Иов: τὴν δόξαν ἀπ᾽ ἐμοῦ ἐξέδυσεν — «славу с меня совлёк» (ἐκδύω — «снимать одежду»); ἀφεῖλεν στέφανον ἀπὸ κεφαλῆς μου — «снял венец с головы моей» (ἀφαιρέω)."
  10: "Иов: διέσπασέν με κύκλῳ — «разорвал меня кругом» (διασπάω); ἐξέκοψεν ὥσπερ δένδρον τὴν ἐλπίδα μου — «вырубил, как дерево, надежду мою» (ἐκκόπτω). Слав. «посече яко древо надежду мою»."
  11: "Иов: δεινῶς μοι ὀργῇ ἐχρήσατο — «жестоко употребил на меня гнев» (δεινῶς — «страшно, жестоко»); ἡγήσατό με ὥσπερ ἐχθρόν — «счёл меня как врага» (ἡγέομαι)."
  12: "Иов: ὁμοθυμαδὸν ἦλθον τὰ πειρατήρια αὐτοῦ ἐπ᾽ ἐμοὶ ταῖς ὁδοῖς μου — «единодушно пришли его разбойничьи отряды на меня, на пути мои» (πειρατήριον — «разбойничий отряд»); ἐκύκλωσάν με ἐγκάθετοι — «окружили меня засадники» (ἐγκάθετος — «подосланный, сидящий в засаде»); отсюда отдельное 待ち伏せの者たちが."
  13: "Иов: ἀπ᾽ ἐμοῦ ἀδελφοί μου ἀπέστησαν — «отошли от меня братья мои» (ἀφίστημι); ἔγνωσαν ἀλλοτρίους ἢ ἐμέ — «познали чужих больше, чем меня» (ἀλλότριος); φίλοι μου ἀνελεήμονες γεγόνασιν — «друзья мои стали немилосердны» (ἀνελεήμων)."
  14: "Иов: οὐ προσεποιήσαντό με οἱ ἐγγύτατοί μου — «не приняли меня ближайшие мои» (προσποιέω — «принимать, усваивать»); οἱ εἰδότες μου τὸ ὄνομα ἐπελάθοντό μου — «знающие имя моё забыли меня» (ἐπιλανθάνομαι)."
  15: "Иов: γείτονες οἰκίας — «соседи дома» (γείτων); θεράπαιναί μου — «служанки мои»; ἀλλογενὴς ἤμην ἐναντίον αὐτῶν — «я был чужим в глазах их» (ἀλλογενής)."
  16: "Иов: θεράποντά μου ἐκάλεσα, καὶ οὐχ ὑπήκουσεν — «раба моего позвал, и не отозвался» (θεράπων — «слуга»; ὑπακούω — «слушаться, отзываться»); στόμα δέ μου ἐδεῖτο — «уста мои умоляли» (δέομαι)."
  17: "Иов: ἱκέτευον τὴν γυναῖκά μου — «умолял жену мою» (ἱκετεύω); προσεκαλούμην κολακεύων υἱοὺς παλλακίδων μου — «призывал, лаская, сыновей наложниц моих» (κολακεύω — «льстить, ласкать»; παλλακίς — «наложница»)."
  18: "Иов: οἱ δὲ εἰς τὸν αἰῶνά με ἀπεποιήσαντο — «они же навсегда отвергли меня» (ἀποποιέω); ὅταν ἀναστῶ, κατ᾿ ἐμοῦ λαλοῦσιν — «когда я встаю, они говорят против меня» (ἀνίστημι)."
  19: "Иов: ἐβδελύξαντό με οἱ εἰδότες με — «возгнушались мною знающие меня» (βδελύσσομαι); οὓς ἠγαπήκειν, ἐπανέστησάν μοι — «те, кого я любил, восстали на меня» (ἐπανίστημι)."
  20: "Иов: ἐν δέρματί μου ἐσάπησαν αἱ σάρκες μου — «в коже моей сгнили плоти мои» (σήπω); τὰ ὀστᾶ μου ἐν ὀδοῦσιν ἔχεται — «кости мои в зубах держатся»: тёмное, буквально передано 歯だけで支えられている; Син. «остался только с кожею около зубов моих»."
  21: "Иов: ἐλεήσατέ με, ἐλεήσατέ με, ὦ φίλοι — «помилуйте меня, помилуйте меня, о друзья», повтор сохранён (ἐλεάω); χεὶρ κυρίου ἡ ἁψαμένη μού ἐστιν — «рука Господня коснувшаяся меня есть» (ἅπτω)."
  22: "Иов: διὰ τί με διώκετε ὥσπερ καὶ ὁ κύριος — «зачем вы гоните меня, как и Господь» (διώκω); ἀπὸ σαρκῶν μου οὐκ ἐμπίπλασθε — «плотью моею не насыщаетесь» (ἐμπίπλημι)."
  23: "Иов: τίς ἂν δῴη γραφῆναι τὰ ῥήματά μου — «кто бы дал, чтобы написаны были слова мои» (δίδωμι в оптативе; γράφω); τεθῆναι αὐτὰ ἐν βιβλίῳ εἰς τὸν αἰῶνα — «и положены были в книгу навек» (βιβλίον). Пожелание продолжается в ст. 24, поэтому стих кончается запятой."
  24: "Иов: ἐν γραφείῳ σιδηρῷ καὶ μολίβῳ — «железным резцом и свинцом» (γραφεῖον — «резец, стило»; μόλιβος — «свинец»); ἢ ἐν πέτραις ἐγγλυφῆναι — «или на камнях вырезаны быть» (ἐγγλύφω — «вырезать»). Конец пожелания."
  25: "Иов: οἶδα ὅτι ἀέναός ἐστιν ὁ ἐκλύειν με μέλλων ἐπὶ γῆς — «знаю, что вечен (присносущен) Тот, кто имеет освободить меня на земле» (ἀέναος — «вечный, присносущный»; ἐκλύω — «разрешать, освобождать»; ἐπὶ γῆς — «на земле»). Слав. «присносущен есть, иже имать искупити мя»; Син. «Искупитель мой жив» (по евр. חַי). Торжественность сохранена: 永遠に生きておられる."
  26: "Иов: ἀναστήσαι τὸ δέρμα μου τὸ ἀνατλῶν ταῦτα — «да воскресит кожу мою, претерпевшую это» (ἀνίστημι — «поднимать, воскрешать»; ἀνατλάω — «претерпевать»); παρὰ κυρίου ταῦτά μοι συνετελέσθη — «от Господа это мне совершилось» (συντελέω). Слав. «воскресити кожу мою терпящую сия»."
  27: "Иов: ἃ ἐγὼ ἐμαυτῷ συνεπίσταμαι — «что я сам про себя знаю» (συνεπίσταμαι); ἃ ὁ ὀφθαλμός μου ἑόρακεν καὶ οὐκ ἄλλος — «что видел глаз мой, и не другой»; πάντα δέ μοι συντετέλεσται ἐν κόλπῳ — «всё же совершилось мне в недре (в груди)» (κόλπος), тёмное; Син. «истаевает сердце моё в груди моей»."
  28: "Иов: εἰ δὲ καὶ ἐρεῖτε· Τί ἐροῦμεν ἔναντι αὐτοῦ — «если же скажете: что скажем против Него»; καὶ ῥίζαν λόγου εὑρήσομεν ἐν αὐτῷ — «и корень слова найдём в нём». Слова друзей — 『…』 внутри речи Иова; граница цитаты тёмная (вторая половина может быть продолжением речи Иова), обе части оставлены в 『』."
  29: "Иов: εὐλαβήθητε ἀπὸ ἐπικαλύμματος — «убоитесь покрывала» (ἐπικάλυμμα — «покров, покрывало»); θυμὸς ἐπ᾽ ἀνόμους ἐπελεύσεται — «гнев на беззаконных придёт»; τότε γνώσονται ποῦ ἐστιν αὐτῶν ἡ ὕλη — «тогда узнают, где вещество их» (ὕλη — «материал, вещество»), тёмное. Слав. вместо «покрывала» читает «меча» (по евр.), это церковное чтение и внесено в основной текст; в LXX слова «меч» нет."
