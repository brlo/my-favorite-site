# jp-box, Второе соборное послание Петра, глава 1. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 1: надписание и приветствие (1–2), призвание к жизни и благочестию,
# лествица 信仰—徳—知識—自制—忍耐—敬虔—兄弟愛—愛 (3–11), память об исходе и «幕屋» (12–15),
# свидетельство на святой горе: голос Отца (16–18), пророческое слово как светильник (19–21).
# Красного и синего нет: голос Отца (1:17) — не слова Христа, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть (проверено запросами к ней:
# συμεων, σιραισ, ταρταρωσασ, αγαπητοσ, φωσφοροσ — ЕСТЬ).
# Сносок ⟨…⟩ в главе нет: 信仰, 徳, 敬虔, 幕屋 уже встречались в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2pet
chapter: 1
draft: true

verses:
  1: "イエス・キリストの僕[しもべ]であり使徒[しと]であるシモン・ペトロから、わたしたちの神[かみ]と救[すく]い主[ぬし]イエス・キリストの義[ぎ]によって、わたしたちと同[おな]じように貴[とうと]い信仰[しんこう]を授[さず]かった人[ひと]々[びと]へ。"
  2: "神[かみ]と、わたしたちの主[しゅ]イエスとを知[し]ることにおいて、{恵[めぐ]み|恩寵[おんちょう]}と平和[へいわ]が、あなたがたに豊[ゆた]かに増[ま]し加[くわ]えられますように。"
  3: "ご自身[じしん]の栄光[えいこう]と徳[とく]とによってわたしたちを召[め]された方[かた]を知[し]ることにより、その神[かみ]の力[ちから]は、命[いのち]と敬虔[けいけん]とに必要[ひつよう]なすべてのものを、わたしたちに与[あた]えてくださったのである。"
  4: "それによって、尊[とうと]く、またこの上[うえ]なく大[おお]きな約束[やくそく]が、わたしたちに与[あた]えられた。それは、あなたがたが、世[よ]にある欲[よく]による滅[ほろ]びを逃[のが]れて、神[かみ]の性質[せいしつ]にあずかる者[もの]となるためである。"
  5: "だから、あなたがたは、あらゆる努[つと]めを払[はら]って、信仰[しんこう]に徳[とく]を、徳[とく]に知識[ちしき]を、"
  6: "知識[ちしき]に自制[じせい]を、自制[じせい]に忍耐[にんたい]を、忍耐[にんたい]に敬虔[けいけん]を、"
  7: "敬虔[けいけん]に兄弟愛[きょうだいあい]を、兄弟愛[きょうだいあい]に愛[あい]を加[くわ]えなさい。"
  8: "これらがあなたがたのうちにあって増[ま]していくなら、あなたがたは、わたしたちの主[しゅ]イエス・キリストを知[し]ることにおいて、怠[なま]ける者[もの]にも、実[み]を結[むす]ばない者[もの]にもならない。"
  9: "これらを持[も]たない者[もの]は、目[め]が見[み]えず、近[ちか]くのものしか見[み]えない者[もの]であって、自分[じぶん]の昔[むかし]の罪[つみ]が清[きよ]められたことを忘[わす]れているのである。"
  10: "だから、兄弟[きょうだい]たちよ、ますます努[つと]めて、あなたがたの召[め]しと選[えら]びとを確[たし]かなものとしなさい。これらのことを行[おこな]うなら、あなたがたは決[けっ]してつまずくことはない。"
  11: "こうして、あなたがたの主[しゅ]であり救[すく]い主[ぬし]であるイエス・キリストの永遠[えいえん]の王国[おうこく]へ入[はい]る道[みち]が、豊[ゆた]かに備[そな]えられるのである。"
  12: "だから、あなたがたがこれらのことを知[し]っており、今[いま]ある真理[しんり]に堅[かた]く立[た]っているにしても、わたしはいつもこれらのことを、あなたがたに思[おも]い起[おこ]こさせようとしている。"
  13: "わたしがこの幕屋[まくや]に住[す]んでいる間[あいだ]は、思[おも]い起[おこ]こさせることによってあなたがたを目覚[めざ]めさせるのが、正[ただ]しいことだと考[かんが]えている。"
  14: "わたしの幕屋[まくや]を脱[ぬ]ぎ捨[す]てる時[とき]が近[ちか]いことを知[し]っているからである。わたしたちの主[しゅ]イエス・キリストが、わたしに示[しめ]してくださったとおりである。"
  15: "また、わたしが世[よ]を去[さ]った後[のち]にも、あなたがたがいつでもこれらのことを思[おも]い起[おこ]こせるように、わたしは努[つと]めるつもりである。"
  16: "わたしたちがあなたがたに知[し]らせた、わたしたちの主[しゅ]イエス・キリストの力[ちから]と来臨[らいりん]とは、巧[たく]みに作[つく]られた作[つく]り話[ばなし]に従[したが]ったものではない。わたしたちは、この方[かた]の威光[いこう]を目[め]の当[あ]たりにした者[もの]だからである。"
  17: "この方[かた]は、父[ちち]である神[かみ]から尊[とうと]さと栄光[えいこう]を受[う]けられた。そのとき、大[おお]いなる栄光[えいこう]から次[つぎ]のような声[こえ]が、この方[かた]に届[とど]いた。「これはわたしの愛[あい]する子[こ]。わたしの心[こころ]にかなう者[もの]である。」"
  18: "わたしたちは、この方[かた]とともに聖[せい]なる山[やま]にいたとき、この声[こえ]が天[てん]から届[とど]くのを聞[き]いたのである。"
  19: "また、わたしたちにはさらに確[たし]かな預言[よげん]の言葉[ことば]がある。あなたがたが、乾[かわ]いた所[ところ]に輝[かがや]く灯[あかり]のように、夜[よ]が明[あ]けて、明[あ]けの星[ほし]があなたがたの心[こころ]に昇[のぼ]るまで、これに心[こころ]を留[と]めるのは、よくしていることである。"
  20: "まず、知[し]っておくべきことは、聖書[せいしょ]の預言[よげん]はどれも、自分[じぶん]勝手[かって]な解釈[かいしゃく]から出[で]るものではない、ということである。"
  21: "預言[よげん]は、かつて人[ひと]の意志[いし]によってもたらされたことはなく、人[ひと]々[びと]が{聖霊[せいれい]|聖神[せいしん]}に動[うご]かされて、神[かみ]から語[かた]ったものだからである。"

notes:
  1: "Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ — イエス・キリストの僕であり使徒であるシモン・ペトロ (Συμεών — семитская форма имени Симона; у jp-joc シモンペトル). τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν — わたしたちと同じように貴い信仰を授かった人々 (ἰσότιμον — acc. наречия, «равночестную»; λαγχάνω — «получать в удел»). ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ — 神と救い主イエス・キリストの義によって (род. падеж относится к обоим, как в греч.)."
  2: "χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη — 恵みと平和が…豊かに増し加えられますように (optative; πληθύνω — «умножать»). ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν — 神と、わたしたちの主イエスとを知ることにおいて (ἐπίγνωσις — «полное, действительное знание», ср. 1:3.8). Порядок «Бог — Иисус» сохранён, как в базе."
  3: "Ὡς πάντα ἡμῖν…δεδωρημένης — gen. absolutus, «даровав…»; по-японски — 与えてくださったのである. τῆς θείας δυνάμεως αὐτοῦ — その神の力 (θεῖος — «божественный»). τὰ πρὸς ζωὴν καὶ εὐσέβειαν — 命と敬虔とに必要なすべてのもの. διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς — 召された方を知ることにより. ἰδίᾳ δόξῃ καὶ ἀρετῇ — ご自身の栄光と徳とによって (ἀρετή — 徳, как в ст. 5)."
  4: "δι᾿ ὧν — «через что» (т. е. через славу и добродетель). ἐπαγγέλματα — 約束 (мн. ч.; τίμια καὶ μέγιστα — 尊く、またこの上なく大きな). θείας κοινωνοὶ φύσεως — 神の性質にあずかる者 (κοινωνός — «причастник, общник»). ἀποφυγόντες τῆς ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς — 世にある欲による滅びを逃れて (φθορά — «тление, растление»)."
  5: "καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες — あらゆる努めを払って (παρεισφέρω — «прилагать сверх»). ἐπιχορηγήσατε — 加えなさい («щедро снабдите»; ἐπιχορηγέω — церковное слово, ср. ст. 11). Начало лествицы: πίστις — 信仰, ἀρετή — 徳. Цепь ст. 5–7 не дробится: глагол стоит в ст. 7."
  6: "ἐγκράτεια — 自制 (не 節制; выравнено по корпусу). ὑπομονή — 忍耐. εὐσέβεια — 敬虔. Каждое звено — «в …» (ἐν δέ), т. е. добродетель существует не рядом, а внутри предыдущей; предлог передан через に…を加える."
  7: "φιλαδελφία — 兄弟愛. ἀγάπη — 愛 (вершина лествицы, как в 2 Пет 1:7; ср. 1 Кор 13). Здесь глагол ἐπιχορηγήσατε — 加えなさい."
  8: "ταῦτα…ὑπάρχοντα καὶ πλεονάζοντα — これらが…あって増していくなら (πλεονάζω — «изобиловать»). οὐκ ἀργοὺς οὐδὲ ἀκάρπους — 怠ける者にも、実を結ばない者にも (ἀργός — «праздный»). εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν — 主イエス・キリストを知ることにおいて."
  9: "ᾧ γὰρ μὴ πάρεστιν — これらを持たない者. τυφλός ἐστιν μυωπάζων — 目が見えず、近くのものしか見えない («слеп, близоруко щурясь»; μυωπάζω — «быть близоруким»). λήθην λαβών — 忘れて (букв. «взяв забвение»). τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτιῶν — 昔の罪の清め (καθαρισμός — «очищение»)."
  10: "σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι — ますます努めて、召しと選びとを確かなものとしなさい (κλῆσις — 召し, ἐκλογή — 選び). οὐ μὴ πταίσητέ ποτε — 決してつまずくことはない (двойное отрицание с усилением; πταίω — «спотыкаться, падать»)."
  11: "πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος — 豊かに備えられる (πλουσίως — «богато»; εἴσοδος — «вход»). εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ — 主であり救い主であるイエス・キリストの永遠の王国へ. Один член с двумя титулами, как в 1:1."
  12: "μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν — いつも…思い起こさせようとしている (μέλλω — «иметь в виду, собираться»). καίπερ εἰδότας καὶ ἐστηριγμένους — 知っており、…堅く立っているにしても (καίπερ с причастиями — уступительное). ἐν τῇ παρούσῃ ἀληθεία — 今ある真理に."
  13: "δίκαιον…ἡγοῦμαι — 正しいことだと考えている. ἐφ᾿ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι — この幕屋に住んでいる間は (σκήνωμα — «шатёр, телесное жилище», ср. 2 Кор 5:1.4). διεγείρειν ὑμᾶς ἐν ὑπομνήσει — 思い起こさせることによって目覚めさせる."
  14: "ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου — 幕屋を脱ぎ捨てる時が近い (ἀπόθεσις — «снятие одежды», ср. 2 Пет 1:14; 2 Тим 4:6). καθὼς…ἐδήλωσέν μοι — 示してくださったとおり (δηλόω — «являть»; ср. Ин 21:18–19)."
  15: "σπουδάσω…ἔχειν ὑμᾶς…μνήμην ποιεῖσθαι — いつでも思い起こせるように努める. μετὰ τὴν ἐμὴν ἔξοδον — 世を去った後 (ἔξοδος — «исход», как в Лк 9:31)."
  16: "σεσοφισμένοις μύθοις — 巧みに作られた作り話 (μῦθος — «выдумка», ср. 1 Тим 4:7). ἐπόπται γενηθέντες — 目撃者となった (ἐπόπτης — «очевидец, посвящённый в таинства»). μεγαλειότης — 威光. Речь о Преображении — 変貌[へんぼう] (1:16–18)."
  17: "λαβὼν…τιμὴν καὶ δόξαν — 尊さと栄光を受けた. φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης — 大いなる栄光から…声が届いた (μεγαλοπρεπής — «великолепный»). Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν, εἰς ὃν ἐγὼ εὐδόκησα — これはわたしの愛する子、わたしの心にかなう者である (Мф 17:5; Мк 9:7; Лк 9:35). Слова Отца — не красные: красное только у Христа (ср. Мф 17:5)."
  18: "ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν — この声を聞いた. σὺν αὐτῷ ὄντες ἐν τῷ ἁγίῳ ὄρει — この方とともに聖なる山にいたとき (ἅγιον ὄρος — гора Преображения)."
  19: "βεβαιότερον τὸν προφητικόν λόγον — さらに確かな預言の言葉. ᾧ καλῶς ποιεῖτε προσέχοντες — これに心を留めるのはよくしていること. λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ — 乾いた所に輝く灯のように (αὐχμηρός — «сухой, пустынный»; у jp-joc 暗き處). ἕως οὗ ἡμέρα διαυγάσῃ — 夜が明けて. φωσφόρος — 明けの星 («светоносец», денница)."
  20: "τοῦτο πρῶτον γινώσκοντες — まず知っておくべきこと. πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται — 聖書の預言はどれも、自分勝手な解釈から出るものではない (ἐπίλυσις — «разрешение, разъяснение»; ἰδία — «своя, частная»). Не «пророчество не поддаётся толкованию», а «не бывает от частного истолкования»; мысль продолжается в ст. 21."
  21: "οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη προφητεία ποτέ — かつて人の意志によってもたらされたことはなく (φέρω — «нести, быть движимым»). ὑπὸ πνεύματος ἁγίου φερόμενοι — 聖霊に動かされて (πνεῦμα ἅγιον — пара {聖霊|聖神}). ἐλάλησαν ἀπὸ θεοῦ ἄνθρωποι — 人々が神から語った. В базе только ἄνθρωποι, без ἅγιοι («святии Божии человецы» слав., jp-joc「神の諸聖人」) — добавление не внесено, 〔〕 не ставятся."
