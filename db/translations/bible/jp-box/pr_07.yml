# jp-box, Притчи, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для главы 7 есть только в ст. 1;
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 7: наставление хранить заповеди (1–5); рассказ о юноше и чужой жене (6–23);
# речь соблазнительницы — 「…」 14–20; авторское заключение (24–27).
# Нумерация по gr: 27 стихов. Слав. сдвиги: csl 7:1 вбирает первую половину гр. 7:2
# («Сыне, чти Господа…»), csl 7:2 = вторая половина гр. 7:2; csl 7:10 вбирает начало
# гр. 7:11; csl 7:25 добавляет слова, которых нет в LXX (внесены без скобок).
# Дефектов «.» в главе нет.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
# В ст. 3 принято слав. чтение («скрижали сердца», по МТ), вариант LXX πλάτος — в notes.

