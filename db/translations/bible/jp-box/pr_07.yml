verses:
  1: "子[こ]よ、わたしの言葉[ことば]を守[まも]り、わたしの戒[いまし]めをあなたのうちに隠[かく]せ。"
  2: "子[こ]よ、主[しゅ]を敬[うやま]え、そうすれば強[つよ]くなる。主のほかに、ほかのものを恐[おそ]れるな。わたしの戒めを守[まも]れ、そうすれば生[い]きる。わたしの言葉[ことば]を、目[め]の瞳[ひとみ]のようにせよ。"
  3: "それをあなたの指[ゆび]に結[むす]び、あなたの心[こころ]の板[いた]に書[か]き記[しる]せ。"
  4: "知恵[ちえ]をあなたの姉妹[しまい]と呼[よ]び、分別[ふんべつ]をあなたの親[した]しい友[とも]とせよ。"
  5: "それは、知恵[ちえ]があなたを、他人[たにん]の女[おんな]、悪[わる]い女から守[まも]るためである。その女が、こびへつらう言葉[ことば]であなたを捕[と]らえようとするときにも。"
  6: "女[おんな]は家[いえ]の窓[まど]から通[とお]りへと身[み]を乗[の]り出[だ]し、"
  7: "愚[おろ]かな子[こ]どもたちのうちで、分別[ふんべつ]の足[た]りない若者[わかもの]を見[み]つけた。"
  8: "その者[もの]は彼女の家[いえ]の角[かど]のそばの路地[ろじ]を歩[ある]き過[す]ぎ、"
  9: "夕[ゆう]やみの暗[くら]がりの中[なか]で語[かた]り、夜[よる]の静[しず]けが訪[おとず]れ、あたりが暗[くら]くなるころに、"
  10: "女[おんな]が彼[かれ]を迎[むか]えた。娼婦[しょうふ]の姿[すがた]をし、若者[わかもの]の心[こころ]を飛[と]び立[た]たせる者[もの]である。"
  11: "彼女は浮[う]き立[た]ち、奔放[ほんぽう]である。その足[あし]は家[いえ]のうちに落[お]ち着[つ]かない。"
  12: "しばらくは外[そと]をさまよい、しばらくは広場[ひろば]で、どの角[かど]でも待[ま]ち伏[ぶ]せしている。"
  13: "彼女は彼[かれ]を捕[つか]まえて口[くち]づけし、恥[は]ずかしげもない顔[かお]で彼に言[い]った。"
  14: "「わたしには酬恩祭[しゅうおんさい]がある。今日[きょう]、わたしは誓[ちか]いを果[は]たした。"
  15: "それだから、あなたに会[あ]おうと外[そと]へ出[で]て、あなたの顔[かお]を慕[した]いながら、あなたを見[み]つけたのだ。"
  16: "わたしは寝床[ねどこ]に紐[ひも]を張[は]り、エジプトの二重[ふたえ]の敷[しき]物[もの]を敷[し]いた。"
  17: "わたしの寝床[ねどこ]にはサフランを振[ふ]りかけ、家[いえ]にはシナモンを香[かお]らせた。"
  18: "さあ、来[き]て、朝[あさ]まで愛[あい]を楽[たの]しもう。さあ、情熱[じょうねつ]に身[み]をゆだねよう。"
  19: "夫[おっと]は家[いえ]にいない。遠[とお]い旅[たび]に出[で]ているのだから。"
  20: "銀[ぎん]の袋[ふくろ]を手[て]にして出[で]かけた。多[おお]くの日[ひ]を経[へ]てから、自分の家[いえ]に帰[かえ]ってくる。」"
  21: "彼女は多[おお]くの語[かた]りで彼[かれ]を迷[まよ]わせ、唇[くちびる]の罠[わな]で彼を引[ひ]きずり込[こ]んだ。"
  22: "彼[かれ]はすぐに彼女に従[したが]った。愚[おろ]かになり、屠[ほふ]り場[ば]へ引[ひ]かれる牛[うし]のように、鎖[くさり]につながれる犬[いぬ]のように。"
  23: "あるいは、肝[きも]を矢[や]で射[い]抜[ぬ]かれた鹿[しか]のように、網[あみ]へ急[いそ]ぐ鳥[とり]のように。自分[じぶん]のいのちをかけて走[はし]っていることを知[し]らない。"
  24: "さて、子[こ]よ、わたしの言[い]うことを聞[き]き、わたしの口[くち]の言葉[ことば]に心[こころ]を向[む]けよ。"
  25: "あなたの心[こころ]を彼女の道[みち]へ傾[かたむ]けてはならない。彼女の小径[こみち]に迷[まよ]い込[こ]んではならない。"
  26: "彼女は多[おお]くの者[もの]を傷[きず]つけて倒[たお]した。その殺[ころ]した者[もの]は数[かぞ]えきれない。"
  27: "彼女の家[いえ]はよみへの道[みち]、死[し]の奥[おく]の間[ま]へ下[くだ]る道である。"

notes:
  1: "Υἱέ, φύλασσε ἐμοὺς λόγους — 子よ、わたしの言葉を守り (φυλάσσω — хранить, соблюдать). τὰς δὲ ἐμὰς ἐντολὰς κρύψον παρὰ σεαυτῷ — わたしの戒めをあなたのうちに隠せ (κρύπτω — скрывать; παρὰ σεαυτῷ — «у себя»). Слав. 7:1 вбирает также начало гр. 7:2 («Сыне, чти Господа…»)."
  2: "υἱέ, τίμα τὸν κύριον, καὶ ἰσχύσεις — 子よ、主を敬え、そうすれば強くなる (τιμάω — чтить; ἰσχύω — быть сильным). πλὴν δὲ αὐτοῦ μὴ φοβοῦ ἄλλον — 主のほかに、ほかのものを恐れるな (πλήν — кроме). 2a φύλαξον ἐμὰς ἐντολάς, καὶ βιώσεις — わたしの戒めを守れ、そうすれば生きる (βιόω — жить). τοὺς δὲ ἐμοὺς λόγους ὥσπερ κόρας ὀμμάτων — わたしの言葉を目の瞳のように (κόρη ὀμμάτων — зеница ока). В слав. первая половина отнесена к 7:1, вторая — к 7:2; держимся деления gr."
  3: "περίθου δὲ αὐτοὺς σοῖς δακτύλοις — それをあなたの指に結び (περιτίθημι — обкладывать, надевать). ἐπίγραψον δὲ ἐπὶ τὸ πλάτος τῆς καρδίας σου — あなたの心の広がりに書き記せ (πλάτος — широта). Слав. читает «на скрижали сердца твоего» (по МТ), это чтение принято в тексте (心の板); вариант LXX πλάτος — здесь."
  4: "εἶπον τὴν σοφίαν σὴν ἀδελφὴν εἶναι — 知恵をあなたの姉妹と呼び (εἶπον с инфинитивом — «скажи… быть»; в Син. прямая речь «Ты сестра моя», в LXX косвенная). τὴν δὲ φρόνησιν γνώριμον περιποίησαι σεαυτῷ — 分別をあなたの親しい友とせよ (γνώριμος — близкий, знакомый; περιποιέω — приобретать)."
  5: "ἵνα σε τηρήσῃ ἀπὸ γυναικὸς ἀλλοτρίας καὶ πονηρᾶς — чтобы она хранила тебя от жены чужой и злой (τηρέω — соблюдать; ἀλλότριος — принадлежащий другому). ἐάν σε λόγοις τοῖς πρὸς χάριν ἐμβάληται — если она уловит тебя льстивыми словами (λόγοι πρὸς χάριν — «слова к угождению»; ἐμβάλλω — вбрасывать, уловлять)."
  6: "ἀπὸ γὰρ θυρίδος ἐκ τοῦ οἴκου αὐτῆς εἰς τὰς πλατείας παρακύπτουσα — ибо из окна своего дома, выглядывая на улицы (θυρίς — оконце; παρακύπτω — высовываться). В LXX и слав. смотрит женщина (причастие ж. р.), в МТ/Син. — сам рассказчик; держимся LXX."
  7: "ὃν ἂν ἴδῃ τῶν ἀφρόνων τέκνων νεανίαν ἐνδεῆ φρενῶν — кого она увидит из глупых детей, юношу, скудного умом (ἐνδεής — нуждающийся; φρένες — ум). Придаточное продолжает ст. 6."
  8: "παραπορευόμενον παρὰ γωνίαν ἐν διόδοις οἴκων αὐτῆς — проходящего мимо угла по проходам дома её (γωνία — угол; δίοδος — проход). Уточнение к νεανίαν из ст. 7."
  9: "καὶ λαλοῦντα ἐν σκότει ἑσπερινῷ — и говорящего в вечерней тьме (σκότος — тьма; ἑσπερινός — вечерний). ἡνίκα ἂν ἡσυχία νυκτερινὴ ᾖ καὶ γνοφώδης — когда наступает тишина ночная и мрак (ἡσυχία — покой; γνοφώδης — сумрачный)."
  10: "ἡ δὲ γυνὴ συναντᾷ αὐτῷ — и вот женщина встречает его (συναντάω — встречать). εἶδος ἔχουσα πορνικόν — имеющая вид блудницы (εἶδος — облик). ἣ ποιεῖ νέων ἐξίπτασθαι καρδίας — которая заставляет сердца юных улетать (ἐξίπταμαι — улетать). Слав. 7:10 вбирает и начало гр. 7:11 («воскрилена же есть и блудна»)."
  11: "ἀνεπτερωμένη δέ ἐστιν καὶ ἄσωτος — она окрылена и распутна (ἀναπτερόω — давать крылья, возбуждать; ἄσωτος — необузданная). ἐν οἴκῳ δὲ οὐχ ἡσυχάζουσιν οἱ πόδες αὐτῆς — а ноги её не отдыхают в доме (ἡσυχάζω — успокаиваться)."
  12: "χρόνον γάρ τινα ἔξω ῥέμβεται — ибо одно время она блуждает вне (ῥέμβομαι — кружить, блуждать). χρόνον δὲ ἐν πλατείαις παρὰ πᾶσαν γωνίαν ἐνεδρεύει — другое время на улицах у всякого угла подстерегает (ἐνεδρεύω — устраивать засаду)."
  13: "εἶτα ἐπιλαβομένη ἐφίλησεν αὐτόν — потом, схватив, поцеловала его (ἐπιλαμβάνομαι — хватать; φιλέω — целовать). ἀναιδεῖ δὲ προσώπῳ προσεῖπεν αὐτῷ — с бесстыдным лицом обратилась к нему (ἀναιδής — бесстыдный; προσεῖπον — обращаться)."
  14: "Θυσία εἰρηνική μοί ἐστιν — у меня мирная жертва (θυσία εἰρηνική — жертва мирная, 酬恩祭, ср. Лев 3). σήμερον ἀποδίδωμι τὰς εὐχάς μου — сегодня воздаю обеты мои (εὐχή — обет; ἀποδίδωμι — исполнять). Здесь начинается речь соблазнительницы — 「…」 до ст. 20."
  15: "ἕνεκα τούτου ἐξῆλθον εἰς συνάντησίν σοι — поэтому я вышла навстречу тебе (συνάντησις — встреча). ποθοῦσα τὸ σὸν πρόσωπον εὕρηκά σε — желая лица твоего, я нашла тебя (ποθέω — желать, тосковать)."
  16: "κειρίαις τέτακα τὴν κλίνην μου — я покрыла ложе моё тесьмами (κειρία — ремень, тесьма; τείνω — натягивать). ἀμφιτάποις δὲ ἔστρωκα τοῖς ἀπ᾽ Αἰγύπτου — разостлала двойные ковры из Египта (ἀμφίταπος — двойной ковёр; στρώννυμι — стлать)."
  17: "διέρραγκα τὴν κοίτην μου κρόκῳ — я окропила ложе моё шафраном (διαρραίνω — окроплять; κρόκος — шафран). τὸν δὲ οἶκόν μου κινναμώμῳ — и дом мой корицею (κιννάμωμον — корица). Син. здесь даёт смирну, алоэ и корицу (по МТ) — не вносим."
  18: "ἐλθὲ καὶ ἀπολαύσωμεν φιλίας ἕως ὄρθρου — приди, и будем наслаждаться любовью до утра (ἀπολαύω — наслаждаться; φιλία — любовь; ὄρθρος — рассвет). δεῦρο καὶ ἐγκυλισθῶμεν ἔρωτι — идём, поваляемся в страсти (ἐγκυλίομαι — валяться; ἔρως — любовное желание)."
  19: "οὐ γὰρ πάρεστιν ὁ ἀνήρ μου ἐν οἴκῳ — ведь мужа моего нет в доме (πάρειμι — присутствовать). πεπόρευται δὲ ὁδὸν μακράν — он ушёл в дальний путь (πορεύομαι — отправляться)."
  20: "ἔνδεσμον ἀργυρίου λαβὼν ἐν χειρὶ αὐτοῦ — взяв в руку узел серебра (ἔνδεσμος — связка, узел; ἀργύριον — серебро). δι᾽ ἡμερῶν πολλῶν ἐπανήξει εἰς τὸν οἶκον αὐτοῦ — через много дней вернётся в дом свой (ἐπανήκω — возвращаться). Речь кончается; далее авторское заключение."
  21: "ἀπεπλάνησεν δὲ αὐτὸν πολλῇ ὁμιλίᾳ — она сбила его многим обхождением (ὁμιλία — беседа, обхождение; ἀποπλανάω — сбивать с пути). βρόχοις τε τοῖς ἀπὸ χειλέων ἐξώκειλεν αὐτόν — и тенетами с губ увлекла его (βρόχος — петля; ἐξοκέλλω — выбрасывать на берег, увлекать). Слав. добавляет пояснение «(в блуд)» — редакторская глосса, не переводится."
  22: "ὁ δὲ ἐπηκολούθησεν αὐτῇ κεπφωθείς — он последовал за нею, обманутый (ἐπακολουθέω — следовать; κεπφόομαι — быть одураченным). ὥσπερ δὲ βοῦς ἐπὶ σφαγὴν ἄγεται — как вол, ведомый на заклание. ὥσπερ κύων ἐπὶ δεσμούς — как пёс на узы (δεσμός — узы); тёмное место, Син. даёт иное («как олень на выстрел», по МТ)."
  23: "ἢ ὡς ἔλαφος τοξεύματι πεπληγὼς εἰς τὸ ἧπαρ — или как олень, поражённый стрелой в печень (τοξεύμα — стрела; ἧπαρ — печень). σπεύδει δὲ ὥσπερ ὄρνεον εἰς παγίδα — он спешит, как птица в сеть (παγίς — силок). οὐκ εἰδὼς ὅτι περὶ ψυχῆς τρέχει — не зная, что бежит за жизнь свою (περί с род. — «за»)."
  24: "νῦν οὖν, υἱέ, ἄκουέ μου — итак, сын, послушай меня. πρόσεχε ῥήμασιν στόματός μου — внимай словам уст моих (προσέχω — обращать внимание). В LXX обращение в ед. ч.; Син. «дети» — по МТ."
  25: "μὴ ἐκκλινάτω εἰς τὰς ὁδοὺς αὐτῆς ἡ καρδία σου — да не уклонится в пути её сердце твоё (ἐκκλίνω — уклоняться). Слав. добавляет «и да не прельстишися в стезях ея» — этого нет в LXX; по паритету внесено в основной текст без скобок."
  26: "πολλοὺς γὰρ τρώσασα καταβέβληκεν — многих она, ранив, повергла (τιτρώσκω — ранить; καταβάλλω — низвергать). ἀναρίθμητοί εἰσιν οὓς πεφόνευκεν — неисчислимы те, кого она убила (φονεύω — убивать)."
  27: "ὁδοὶ ᾅδου ὁ οἶκος αὐτῆς — пути ада — дом её (ᾅδης — преисподняя, よみ). κατάγουσαι εἰς τὰ ταμεῖα τοῦ θανάτου — низводящие в хранилища смерти (ταμεῖον — сокровищница, внутренний покой)."
