verses:
  1: "「あなたは香[こう]の祭壇[さいだん]をアカシアの木[き]で造[つく]れ。すなわち、それを造[つく]る。"
  2: "長[なが]さ一[いっ]キュビト、幅[はば]一[いっ]キュビト、四角[しかく]とし、高[たか]さ二[に]キュビトとする。その角[つの]は祭壇[さいだん]から出[で]るようにする。"
  3: "あなたはそれを純[じゅん]な金[きん]で覆[おお]え。すなわち、その火[ひ]床[どこ]、周[まわ]りの壁[かべ]、その角[つの]を。あなたはまた、その周[まわ]りに金[きん]の撚[よ]り縁[ふち]飾[かざ]りを造[つく]れ。"
  4: "あなたはその撚[よ]り縁[ふち]飾[かざ]りの下[した]、両側[りょうがわ]の二[ふた]つの隅[すみ]に、純[じゅん]な金[きん]の環[かん]を二[ふた]つ造[つく]れ。それらは担[かつ]ぎ棒[ぼう]を入[い]れて、それで運[はこ]ぶためのものである。"
  5: "あなたはアカシアの木[き]で担[かつ]ぎ棒[ぼう]を造[つく]り、金[きん]で覆[おお]え。"
  6: "あなたはそれを、証[あかし]の箱[はこ]の上[うえ]にある垂[た]れ幕[まく]の前[まえ]に置[お]け。そこから、わたしはあなたに現[あらわ]れる。"
  7: "アロンはその上[うえ]で、細[こま]かく混[ま]ぜ合[あ]わせた香[こう]をたく。毎朝[まいあさ]、ともし火[び]を整[ととの]えるときに、その上[うえ]で香[こう]をたく。"
  8: "アロンが夕[ゆう]べにともし火[び]を上[あ]げるときにも、その上[うえ]で香[こう]をたく。これはあなたがたの代[よ]々[よ]にわたって、主[しゅ]の前[まえ]に絶[た]え間[ま]なく続[つづ]く香[こう]である。"
  9: "あなたはその上[うえ]でほかの香[こう]をたいてはならない。献[ささ]げ物[もの]も、捧[ささ]げ物[もの]も。その上[うえ]に注[そそ]ぎ物[もの]を注[そそ]いではならない。"
  10: "アロンはその角[つの]の上[うえ]で、年[とし]に一[いち]度[ど]、贖[あがな]いをなす。罪[つみ]の清[きよ]めの血[ち]、すなわち贖[あがな]いの血[ち]で、年[とし]に一[いち]度[ど]、それを清[きよ]める。あなたがたの代[よ]々[よ]にわたって。それは主[しゅ]にとって聖[せい]なるもののうちの聖[せい]なるものである。」"
  11: "主[しゅ]はモーセに言[い]われた。"
  12: "「あなたがイスラエルの子[こ]らの数[かず]えを、その数[かず]えに従[したが]って行[おこな]うとき、彼[かれ]らはそれぞれ、自分[じぶん]の命[いのち]の贖[あがな]いを主[しゅ]に納[おさ]めよ。数[かず]えのときに彼[かれ]らの間[あいだ]に災[わざわ]いが起[お]こらないためである。"
  13: "数[かず]えに加[くわ]わる者[もの]はすべてこれを納[おさ]める。半[はん]シケル⟨銀[ぎん]の重[おも]さの単位[たんい]。⟩、すなわち聖所[せいしょ]のシケルによる半[はん]シケルである。一[いっ]シケルは二十[にじゅう]オボロス。半[はん]シケルが主[しゅ]への納[おさ]め物[もの]である。"
  14: "二十歳[にじゅっさい]以上[いじょう]で数[かず]えに加[くわ]わる者[もの]はすべて、主[しゅ]への納[おさ]め物[もの]を納[おさ]める。"
  15: "富[とみ]ある者[もの]も多[おお]く納[おさ]めず、貧[まず]しい者[もの]も半[はん]シケルより少[すく]なく納[おさ]めない。主[しゅ]への納[おさ]め物[もの]として、あなたがたの命[いのち]の贖[あがな]いのために納[おさ]めるのである。"
  16: "あなたはイスラエルの子[こ]らからその納[おさ]め物[もの]の銀[ぎん]を取[と]り、それを証[あかし]の幕屋[まくや]の仕事[しごと]に充[あ]てよ。それはイスラエルの子[こ]らのために、主[しゅ]の前[まえ]で記念[きねん]となり、あなたがたの命[いのち]の贖[あがな]いとなる。」"
  17: "主[しゅ]はモーセに言[い]われた。"
  18: "「あなたは青銅[せいどう]の洗[あら]い盤[ばん]と、その青銅[せいどう]の台座[だいざ]を造[つく]り、洗[あら]うために用[もち]いよ。それを証[あかし]の幕屋[まくや]と祭壇[さいだん]の間[あいだ]に置[お]き、それに水[みず]を満[み]たせ。"
  19: "アロンとその子[こ]らは、それから手[て]と足[あし]を水[みず]で洗[あら]う。"
  20: "彼[かれ]らが証[あかし]の幕屋[まくや]に入[はい]るときには、水[みず]で洗[あら]う。死[し]なないためである。また、祭壇[さいだん]に近[ちか]づいて仕[つと]め、主[しゅ]に全[ぜん]焼[しょう]の捧[ささ]げ物[もの]をささげるときにも。"
  21: "手[て]と足[あし]を水[みず]で洗[あら]う。証[あかし]の幕屋[まくや]に入[はい]るときに水[みず]で洗[あら]い、死[し]なないためである。これは彼[かれ]と、彼[かれ]の後[のち]の子孫[しそん]にとって永遠[えいえん]の定[さだ]めである。」"
  22: "主[しゅ]はモーセに言[い]われた。"
  23: "「あなたは香料[こうりょう]を取[と]れ。選[え]り抜[ぬ]きの没薬[もつやく]の花[はな]五百[ごひゃく]シケル、香[かお]りのよい桂皮[けいひ]はその半分[はんぶん]の二百五十[にひゃくごじゅう]シケル、香[かお]りのよい菖蒲[しょうぶ]二百五十[にひゃくごじゅう]シケル、"
  24: "カシア五百[ごひゃく]シケルを、聖所[せいしょ]のシケルで。それにオリーブ油[あぶら]一[いっ]ヒンを。"
  25: "あなたはそれらで聖[せい]なる油[あぶら]を造[つく]れ。香料[こうりょう]を調[ととの]える者[もの]の技[わざ]による、混[ま]ぜ合[あ]わせた香油[こうゆ]である。それは聖[せい]なる油[あぶら]となる。"
  26: "あなたはそれで証[あかし]の幕屋[まくや]と証[あかし]の箱[はこ]に油[あぶら]を塗[ぬ]れ。"
  27: "燭台[しょくだい]とそのすべての器[うつわ]、香[こう]の祭壇[さいだん]にも油[あぶら]を塗[ぬ]れ。"
  28: "全[ぜん]焼[しょう]の祭壇[さいだん]とそのすべての器[うつわ]、机[つくえ]とそのすべての器[うつわ]、洗[あら]い盤[ばん]とその台座[だいざ]にも油[あぶら]を塗[ぬ]れ。"
  29: "あなたはそれらを聖[せい]なるものとせよ。そうすれば、聖[せい]なるもののうちの聖[せい]なるものとなる。それらに触[ふ]れる者[もの]はすべて聖[せい]なる者[もの]となる。"
  30: "あなたはアロンとその子[こ]らに油[あぶら]を塗[ぬ]り、彼[かれ]らを聖[せい]なる者[もの]として、わたしに祭司[さいし]として仕[つか]えさせる。"
  31: "あなたはイスラエルの子[こ]らに語[かた]って言[い]え。『これはあなたがたの代[よ]々[よ]にわたって、あなたがたのための聖[せい]なる油[あぶら]である。"
  32: "それは人[ひと]の肉[にく]に塗[ぬ]ってはならず、この配合[はいごう]で同[おな]じものを作[つく]ってもならない。それは聖[せい]なるものであり、あなたがたにとって聖[せい]なるものとなる。"
  33: "その同[おな]じものを作[つく]る者[もの]、またそれを他[ほか]の民[たみ]の者[もの]に与[あた]える者[もの]は、その民[たみ]から断[た]たれる。』」"
  34: "主[しゅ]はモーセに言[い]われた。「あなたは香料[こうりょう]、すなわちスタクテ、オニキス、香[かお]りのよいガルバヌム、それに透明[とうめい]な乳香[にゅうこう]を取[と]れ。それらは等[ひと]しい量[りょう]とする。"
  35: "それで香[こう]を造[つく]る。香料[こうりょう]を調[ととの]える者[もの]の技[わざ]による、よく混[ま]ぜ合[あ]わせた純[じゅん]なもの、聖[せい]なるものとして造[つく]る。"
  36: "あなたはそれを細[こま]かく砕[くだ]き、証[あかし]の幕屋[まくや]で、証[あかし]の前[まえ]に置[お]け。わたしはそこからあなたに現[あらわ]れる。それはあなたがたにとって聖[せい]なるもののうちの聖[せい]なるものとなる。"
  37: "あなたがたはこの配合[はいごう]で同[おな]じ香[こう]を自分[じぶん]たちのために造[つく]ってはならない。それはあなたがたにとって、主[しゅ]への聖[せい]なるものとなる。"
  38: "その同[おな]じものを作[つく]って、その香[かお]りをかいで楽[たの]しもうとする者[もの]は、その民[たみ]から断[たた]れる。」"

notes:
  1: "θυσιαστήριον θυμιάματος — жертвенник курения (香の祭壇); ἐκ ξύλων ἀσήπτων — из «негниющих» деревьев (アカシアの木). У LXX фраза обрывается на «и сделаешь его» и продолжается в ст. 2 — деление стихов сохранено."
  2: "πήχεος τὸ μῆκος … δύο πήχεων τὸ ὕψος — локоть на локоть, два в высоту; ἐξ αὐτοῦ ἔσται τὰ κέρατα — роги из него самого."
  3: "καταχρυσώσεις — обложишь золотом; ἐσχάρα — верх (огнище, 火床); τοίχους κύκλῳ — стены кругом; στρεπτὴ στεφάνη χρυσῆ — витой венец, обод (撚り縁飾り)."
  4: "δακτύλιοι — кольца под ободом; εἰς τὰ δύο κλῖτη — на двух сторонах; ψαλίδες — гнёзда для шестов; σκυτάλαι — шесты (担い棒)."
  5: "Шесты из акации, обложенные золотом."
  6: "ἀπέναντι τοῦ καταπετάσματος τοῦ ὄντος ἐπὶ τῆς κιβωτοῦ τῶν μαρτυρίων — напротив завесы, которая у ковчега свидетельств; ἐν οἷς γνωσθήσομαί σοι ἐκεῖθεν — «где Я буду познан тобою оттуда» (現れる)."
  7: "θυμίαμα σύνθετον λεπτόν — составное мелкое курение; τὸ πρωῒ πρωΐ — «утром рано» (каждое утро); ἐπισκευάζῃ τοὺς λύχνους — приводит в порядок лампады."
  8: "ἐξάπτῃ — зажигает; θυμίαμα ἐνδελεχισμοῦ — курение постоянное; εἰς γενεὰς αὐτῶν — в роды их."
  9: "ἀνοίσεις — вознесёшь; θυμίαμα ἕτερον — иное курение; κάρπωμα, θυσία — приношение и жертва; σπονδή — возлияние."
  10: "ἐξιλάσεται — совершит очищение (искупление); ἅπαξ τοῦ ἐνιαυτοῦ — раз в году; ἀπὸ τοῦ αἵματος τοῦ καθαρισμοῦ τῶν ἁμαρτιῶν τοῦ ἐξιλασμοῦ — кровью очищения грехов искупления; ἅγιον τῶν ἁγίων — святое святых (聖なるもののうちの聖なるもの)."
  11: "Формула введения речи: καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων."
  12: "συλλογισμός — исчисление, ἐπίσκεψις — перепись (数え); λύτρα τῆς ψυχῆς — выкуп за душу; πτῶσις — падение, поражение (災い); οὐκ ἔσται ἐν αὐτοῖς πτῶσις — не будет между ними поражения."
  13: "У LXX τὸ ἥμισυ τοῦ διδράχμου — половина дидрахмы (слав. полдидрахмы), т.е. полусикль; τὸ δίδραχμον τὸ ἅγιον — священная драхма; εἴκοσι ὀβολοί — двадцать оболов (в масоретском тексте «геры»); εἰσφορά — приношение (納め物)."
  14: "ἀπὸ εἰκοσαετοῦς καὶ ἐπάνω — от двадцати лет и выше; παραπορευόμενος εἰς τὴν ἐπίσκεψιν — вступающий в перепись."
  15: "ὁ πλουτῶν οὐ προσθήσει — богатый не прибавит; ὁ πενόμενος οὐκ ἐλαττονήσει — бедный не умалит; ἐξιλάσασθαι περὶ τῶν ψυχῶν ὑμῶν — чтобы искупить души ваши."
  16: "εἰς κάτεργον τῆς σκηνῆς — на дело (работу) скинии (仕事); μνημόσυνον — память; так же ἐξιλάσασθαι."
  17: "Формула введения речи."
  18: "λουτὴρ χαλκοῦς — медный умывальник (洗い盤); βάσις — подножие (台座); ἀνὰ μέσον σκηνῆς καὶ θυσιαστηρίου — между скинией и жертвенником."
  19: "νίψεται … τὰς χεῖρας καὶ τοὺς πόδας — омоет руки и ноги."
  20: "ὅταν εἰσπορεύωνται … οὐ μὴ ἀποθάνωσιν — когда входят, чтобы не умереть; ἀναφέρειν τὰ ὁλοκαυτώματα — приносить всесожжения."
  21: "νόμιμον αἰώνιον αὐτῷ καὶ ταῖς γενεαῖς αὐτοῦ — устав вечный ему и родам его."
  22: "Формула введения речи."
  23: "ἡδύσματα — благовония (香料); τὸ ἄνθος σμύρνης ἐκλεκτῆς — цвет избранной смирны (選り抜きの没薬の花); κιννάμωμον εὐῶδες — благовонная корица (桂皮), половина — 250; κάλαμος εὐώδης — благовонный тростник (菖蒲), 250."
  24: "ἶρις — ирис (カシア; отождествляется с касией, слав. и Синодальный — «касия»), 500 сиклей «святого» (聖所のシケル); ἔλαιον ἐξ ἐλαίων ιν — оливкового масла гин (ヒン)."
  25: "ἔλαιον χρῖσμα ἅγιον — елей священного помазания (聖なる油); μύρον μυρεψικὸν τέχνῃ μυρεψοῦ — масть, изготовленная искусством составителя мастей."
  26: "χρίσεις — помажешь; κιβωτὸς τοῦ μαρτυρίου — ковчег свидетельства (не «завета»)."
  27: "У LXX порядок: светильник и все принадлежности его, затем жертвенник курения; стол появляется в ст. 28 (в масоретском тексте — здесь)."
  28: "θυσιαστήριον τῶν ὁλοκαυτωμάτων — жертвенник всесожжении; λουτήρ — умывальник; βάσις — подножие."
  29: "ἁγιάσεις — освятишь; ἅγια τῶν ἁγίων — святое святых (聖なるもののうちの聖なるもの); πᾶς ὁ ἁπτόμενος ἁγιασθήσεται — всякий прикасающийся освятится."
  30: "χρίσεις καὶ ἁγιάσεις — помажешь и освятишь Аарона и сыновей."
  31: "Начало вложенной речи (『…』): λαλήσεις λέγων — скажешь, говоря; εἰς τὰς γενεὰς ὑμῶν — в роды ваши."
  32: "ἐπὶ σάρκα ἀνθρώπου οὐ χρισθήσεται — на тело человека не будет помазано; κατὰ τὴν σύνθεσιν ταύτην — по этому составу; ἁγίασμα — освящение (聖なるもの)."
  33: "ὃς ἂν ποιήσῃ ὡσαύτως — кто сделает подобное; δῷ ἀλλογενεῖ — даст иноплеменнику (他の民の者); ἐξολεθρευθήσεται — истребится. Здесь закрывается 『…』."
  34: "στακτή — стакти (капля смирны), ὄνυξ — оних (благовонная смола, не камень ὀνύχιον из 28:20), χαλβάνη — галбан (ガルバヌム), λίβανος διαφανής — прозрачный ливан (ладан, 乳香); ἴσον ἴσῳ — равной мерой."
  35: "Греч. ποιήσουσιν — 3-е лицо мн. ч. («сделают»), поэтому без подлежащего; μεμιγμένον, καθαρόν, ἔργον ἅγιον — смешанное, чистое, дело святое."
  36: "συγκόψεις λεπτόν — истолчёшь мелко; ἀπέναντι τῶν μαρτυρίων — пред свидетельствами; γνωσθήσομαί σοι ἐκεῖθεν — буду познан тобою оттуда."
  37: "κατὰ τὴν σύνθεσιν ταύτην — по этому составу; ἁγίασμα … κυρίῳ — освящение Господу (主への聖なるもの)."
  38: "ὥστε ὀσφραίνεσθαι ἐν αὐτῷ — чтобы обонять его; ἀπολεῖται ἐκ τοῦ λαοῦ αὐτοῦ — погибнет из народа своего."
