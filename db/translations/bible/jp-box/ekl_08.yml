chapter: 8
draft: true

verses:
  1: "誰[だれ]が知恵[ちえ]ある者[もの]を知[し]っているだろうか。誰[だれ]が言葉[ことば]の解[と]き明[あ]かしを知[し]っているだろうか。人[ひと]の知恵[ちえ]はその顔[かお]を照[て]らし、厚顔[こうがん]な者[もの]はその顔[かお]のゆえに憎[にく]まれる。"
  2: "王[おう]の口[くち]の言葉[ことば]を守[まも]れ。また、神[かみ]への誓[ちか]いの言葉[ことば]について、急[いそ]いではならない。"
  3: "その顔[かお]から去[さ]って行[ゆ]け。悪[わる]い言葉[ことば]のうちに立[た]ち止[ど]まってはならない。彼[かれ]は望[のぞ]むことをすべて行[おこな]うからである。"
  4: "支配[しはい]する王[おう]が語[かた]るのだから、誰[だれ]が彼[かれ]に「何[なに]をするのか」と言[い]えようか。"
  5: "戒[いまし]めを守[まも]る者[もの]は悪[わる]い言葉[ことば]を知[し]らない。知恵[ちえ]ある者[もの]の心[こころ]は裁[さば]きの時[とき]を知[し]っている。"
  6: "すべての事[こと]には時[とき]と裁[さば]きがあるからである。人[ひと]の知識[ちしき]は彼[かれ]の上[うえ]に多[おお]い。"
  7: "起[お]こることを知[し]っている者[もの]はいないからである。それがどうなるかを、誰[だれ]が彼[かれ]に告[つ]げるだろうか。"
  8: "人[ひと]には、息[いき]を支配[しはい]してその息[いき]を引[ひ]き止[と]める力[ちから]はない。死[し]の日[ひ]に権[けん]はなく、戦[いくさ]のときにも解[と]き放[はな]たれることはなく、不敬虔[ふけいけん]はそれに属[ぞく]する者[もの]を救[すく]わない。"
  9: "また、これらすべてを見[み]て、わたしは心[こころ]を、日[ひ]の下[もと]で行[おこな]われるすべての業[わざ]に向[む]けた。人[ひと]が人[ひと]の上[うえ]に、その人[ひと]を苦[くる]しめるために振[ふ]るう支配[しはい]のすべてである。"
  10: "また、そのときわたしは、不敬虔[ふけいけん]な者[もの]たちが墓[はか]へ運[はこ]び込[こ]まれるのを見[み]た。そして彼[かれ]らは聖[せい]なる場所[ばしょ]から去[さ]り、そのように行[おこな]ったということで、町[まち]でほめられた。これもまた空[むな]しい。"
  11: "悪[わる]を行[おこな]う者[もの]たちへの反論[はんろん]が、すぐには起[お]こらないからである。それゆえ、人[ひと]の子[こ]らは、悪[わる]を行[おこな]うことを確[かく]信[しん]する。"
  12: "罪[つみ]を犯[おか]した者[もの]は、その時[とき]から悪[わる]を行[おこな]い、長[なが]きにわたってそうしている。しかし、わたしは知[し]っている。神[かみ]を畏[おそ]れる者[もの]には善[よ]いことがあり、彼[かれ]らは神[かみ]の御顔[みかお]を畏[おそ]れるからである。"
  13: "不敬虔[ふけいけん]な者[もの]に善[よ]いはなく、神[かみ]の御顔[みかお]を畏[おそ]れない者[もの]は、影[かげ]のうちに日[ひ]を長[なが]くすることもない。"
  14: "地[ち]の上[うえ]に起[お]こる空[むな]しさがある。正[ただ]しい者[もの]がいても、不敬虔[ふけいけん]な者[もの]の業[わざ]のようなものが彼[かれ]らに及[およ]び、不敬虔[ふけいけん]な者[もの]がいても、正[ただ]しい者[もの]の業[わざ]のようなものが彼[かれ]らに及[およ]ぶ。わたしは言[い]った。これもまた空[むな]しい、と。"
  15: "そこでわたしは喜[よろこ]びをほめたたえた。日[ひ]の下[もと]で人[ひと]にとって善[よ]いことは、食[た]べ、飲[の]み、喜[よろこ]ぶことのほかになく、それが、神[かみ]が日[ひ]の下[もと]で人[ひと]に与[あた]えられた生涯[しょうがい]の日々[ひび]、その労苦[ろうく]のうちでその人[ひと]とともにあるからである。"
  16: "わたしが知恵[ちえ]を知[し]り、地[ち]の上[うえ]で行[おこな]われる務[つと]めを見[み]ようと心[こころ]を向[む]けたとき、人[ひと]は昼[ひる]も夜[よる]も、その目[め]で眠[ねむ]りを見[み]ることがないほどであった。"
  17: "そしてわたしは神[かみ]のすべての業[わざ]を見[み]た。人[ひと]は、日[ひ]の下[もと]でなされた業[わざ]を見[み]いだすことができない。人[ひと]が探[さが]し求めようと労苦[ろうく]しても見[み]いだせず、知恵[ちえ]ある者[もの]が知[し]ろうと言[い]っても、見[み]いだすことはできない。"

notes:
  1: "Τίς οἶδεν σοφούς; καὶ τίς οἶδεν λύσιν ῥήματος; — «Кто знает мудрых? И кто знает решение слова?». В слав. эти два вопроса опущены, текст начинается с «Мудрость человека просветит лице его»; в Син. по масоретскому вопрос один («Кто — как мудрый?»). λύσις — «разрешение, истолкование». ἀναιδής — «бесстыдный, дерзкий»; Син. «суровость лица его изменяется» — масоретское чтение."
  2: "στόμα βασιλέως φύλαξον — «уста царя сохрани» (в греч. именно στόμα, не λόγος). περὶ λόγου ὅρκου θεοῦ — «о слове клятвы Божией». μὴ σπουδάσῃς — «не спеши». Син. «это ради клятвы пред Богом» — масоретское чтение."
  3: "ἀπὸ προσώπου αὐτοῦ πορεύσῃ — «от лица его пойдёшь». μὴ στῇς ἐν λόγῳ πονηρῷ — букв. «не стой в слове злом», т.е. не упорствуй в худом деле (так в Син.). ὅτι πᾶν ὃ ἐὰν θελήσῃ ποιήσει — «ибо всё, что захочет, сделает»."
  4: "καθὼς λαλεῖ βασιλεὺς ἐξουσιάζων — «как говорит царь властвующий». Вопрос «что делаешь?» — чужая гипотетическая речь, поэтому в 「」."
  5: "ὁ φυλάσσων ἐντολήν — «хранящий заповедь». οὐ γνώσεται ῥῆμα πονηρόν — «не познает слова злого». καιρὸν κρίσεως — «время суда»."
  6: "παντὶ πράγματι ἔστιν καιρὸς καὶ κρίσις — «всякой вещи есть время и суд». γνῶσις τοῦ ἀνθρώπου πολλὴ ἐπ᾽ αὐτόν — тёмное место: букв. «познание человека много на нём»; Син. по масоретскому «человеку великое зло от того»."
  7: "οὐκ ἔστιν γινώσκων τί τὸ ἐσόμενον — «нет знающего, что будет». καθὼς ἔσται τίς ἀναγγελεῖ αὐτῷ; — «как будет, кто возвестит ему?»."
  8: "ἐξουσιάζων ἐν πνεύματι τοῦ κωλῦσαι... τὸ πνεῦμα — «властвующий над дыханием, чтобы удержать дыхание». πνεῦμα здесь — дыхание жизни, а не Святой Дух и не «дух» в богословском смысле; поэтому 息[いき], а не 霊 (слав. «дух»). ἀποστολή — «отпущение, отправление» (слав. «посол»); Син. по масоретскому «нет избавления в этой борьбе». οὐ διασώσει ἀσέβεια τὸν παρ᾽ αὐτῆς — «не спасёт нечестие того, кто от него»."
  9: "σὺν πᾶν τοῦτο — «и всё это». εἰς πᾶν ποίημα — «во всякое дело». τὰ ὅσα ἐξουσιάσατο ὁ ἄνθρωπος ἐν ἀνθρώπῳ τοῦ κακῶσαι αὐτόν — «всё, над чем человек властвует над человеком, чтобы озлобить его». Син. вводит сюда «бывает время» — по масоретскому слову עֵת (время)."
  10: "εἰς τάφους εἰσαχθέντας — «внесённых в могилы». ἐκ τόπου ἁγίου ἐπορεύθησαν — «от святого места пошли». ἐπῃνέθησαν ἐν τῇ πόλει ὅτι οὕτως ἐποίησαν — «были хвалимы в городе, что так делали». Син. «они забываемы были» — масоретское чтение."
  11: "ἀντίρρησις — «возражение, прекословие» (слав. «пререкание»). ἐπληροφορήθη καρδία υἱῶν τοῦ ἀνθρώπου ἐν αὐτοῖς — «уверилось сердце сынов человеческих в них», т.е. в своих делах."
  12: "ὃς ἥμαρτεν, ἐποίησεν τὸ πονηρὸν ἀπὸ τότε καὶ ἀπὸ μακρότητος αὐτῷ — тёмное место LXX, букв. «кто согрешил, сделал зло от того времени и от долготы ему»; вероятно, «и продлевается ему» (масоретский: «сто раз делает зло и продлевает дни свои», Син.). ὅπως φοβῶνται ἀπὸ προσώπου αὐτοῦ — «чтобы боялись лица Его»."
  13: "οὐ μακρυνεῖ ἡμέρας ἐν σκιᾷ — «не продлит дней в тени». ὃς οὐκ ἔστιν φοβούμενος ἀπὸ προσώπου τοῦ θεοῦ — «кто не боится лица Божия»."
  14: "εἰσὶ δίκαιοι ὅτι φθάνει πρὸς αὐτοὺς ὡς ποίημα τῶν ἀσεβῶν — «есть праведные, что постигает их как дело нечестивых» (ὅτι при εἰσί — особенность LXX). εἶπα ὅτι καί γε τοῦτο ματαιότης — «сказал, что и это суета»."
  15: "ἐπῄνεσα τὴν εὐφροσύνην — «похвалил веселье». οὐκ ἔστιν ἀγαθὸν... ὅτι εἰ μὴ τοῦ φαγεῖν καὶ τοῦ πιεῖν καὶ τοῦ εὐφρανθῆναι — «нет блага, кроме как есть, пить и веселиться». συμπροσέσται αὐτῷ — «будет сопутствовать ему»."
  16: "Ἐν οἷς ἔδωκα τὴν καρδίαν μου... — «в том, что я отдал сердце моё познать мудрость…»; придаточное продолжается в 17. ὕπνον ἐν ὀφθαλμοῖς αὐτοῦ οὐκ ἔστιν βλέπων — букв. «сна в очах его нет видящий», т.е. человек не видит сна."
  17: "οὐ δυνήσεται ἄνθρωπος τοῦ εὑρεῖν — «не сможет человек найти». ὅσα ἂν μοχθήσῃ... καὶ οὐχ εὑρήσει — «сколько бы ни трудился, не найдёт». В слав. в конце 8:17 стоит «темже все сие вдах в сердце мое…» — это начало 9:1 по LXX: деление стихов в слав. иное, поэтому 〔…〕 не ставим."
