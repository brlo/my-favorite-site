# jp-box, Екклесиаст, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru); ru (Синодальный)
# только для понимания. jp-joc в Екклесиасте отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 8: мудрость и лицо (1), слово царя (2–9), страх Божий и суета (10–15),
# непостижимость дел Божиих (16–17).
# Красного и синего нет: это не речь Христа. Речь Екклесиаста — от первого лица, без кавычек;
# чужая (гипотетическая) речь в 4 — в 「…」.
# 〔…〕 нет: все слова в gr-lxx-byz есть. Слав. в конце 8:17 добавляет начало 9:1
# («темже все сие вдах в сердце мое…») — это разница деления стихов, а не добавление Церкви,
# поэтому скобки не ставятся; отмечено в notes к 8:17.
# Сносок ⟨…⟩ нет: все слова понятны.
# jp-ni не использовался.

