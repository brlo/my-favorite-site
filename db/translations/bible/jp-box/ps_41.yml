verses:
  0: "合唱[がっしょう]の長[ちょう]に歌[うた]わせる。コラの子[こ]らへの教訓[きょうくん]。"
  1: "鹿[しか]が水[みず]の流[なが]れを慕[した]うように、わたしの魂[たましい]は、神[かみ]よ、あなたを慕[した]う。"
  2: "わたしの魂[たましい]は、生[い]ける神[かみ]を渇[かわ]き求[もと]めている。いつ、わたしは行[ゆ]って、神[かみ]の御顔[みかお]の前[まえ]に立[た]つことができるのか。"
  3: "わたしの涙[なみだ]は、昼[ひる]も夜[よる]も、わたしのパンとなった。人[ひと]が毎日[まいにち]、わたしに「あなたの神[かみ]はどこにいるのか」と言[い]うからである。"
  4: "わたしはこれらのことを思[おも]い起[おこ]し、わたしの魂[たましい]を注[そそ]ぎ出[だ]した。かつてわたしは、喜[よろこ]びと讃[さん]美[び]の声[こえ]、祭[まつ]りのにぎわいの声[こえ]を上[あ]げて、驚[おどろ]くべき幕屋[まくや]のところを通[とお]り、神[かみ]の家[いえ]へと進[すす]んだ。"
  5: "なぜ、わたしの魂[たましい]よ、悲[かな]しみに沈[しず]むのか。なぜ、わたしをかき乱[みだ]すのか。神[かみ]に寄[よ]り頼[たの]め。わたしはなお、わたしの救[すく]いである神[かみ]をほめたたえる。"
  6: "わたしの魂[たましい]は、わたしの内[うち]で騒[さわ]いでいる。それゆえ、わたしはヨルダンの地[ち]から、ヘルモンから、小[ちい]さな山[やま]から、あなたを思[おも]い起[おこ]す。"
  7: "あなたの滝[たき]の轟[とどろ]きによって、深[ふか]い淵[ふち]が深[ふか]い淵[ふち]を呼[よ]び交[か]わす。あなたの水[みず]のうねりも、あなたの波[なみ]も、ことごとくわたしの上[うえ]を越[こ]えて行[い]った。"
  8: "昼[ひる]には、主[しゅ]がそのあわれみを命[めい]じ、夜[よる]には、わたしの口[くち]に歌[うた]がある。わたしの命[いのち]の神[かみ]への祈[いの]りがある。"
  9: "わたしは神[かみ]に言[い]う。「あなたはわたしの盾[たて]である。なぜ、わたしを忘[わす]れたのか。なぜ、わたしは敵[てき]に苦[くる]しめられて、暗[くら]い顔[かお]をして歩[ある]くのか」と。"
  10: "わたしの骨[ほね]が砕[くだ]けるほどに、わたしを苦[くる]しめる者[もの]たちがわたしを嘲[あざけ]り、毎日[まいにち]、わたしに「あなたの神[かみ]はどこにいるのか」と言[い]うからである。"
  11: "なぜ、わたしの魂[たましい]よ、悲[かな]しみに沈[しず]むのか。なぜ、わたしをかき乱[みだ]すのか。神[かみ]に寄[よ]り頼[たの]め。わたしはなお、わたしの救[すく]いである神[かみ]をほめたたえる。"

notes:
  0: "Εἰς τὸ τέλος· εἰς σύνεσιν τοῖς υἱοῖς Κορε — 合唱の長に歌わせる、コラの子らへの教訓. εἰς σύνεσιν «в разум, в наставление» (Синодальный «Учение»; jp-joc 敎訓). Κορε — コラ, как по корпусу. Надписание — стих 0, скобками не маркируется."
  1: "Ὃν τρόπον ἐπιποθεῖ ἡ ἔλαφος ἐπὶ τὰς πηγὰς τῶν ὑδάτων — имже образом желает елень на источники водныя (ἔλαφος «лань, олень»; πηγή «источник»). οὕτως ἐπιποθεῖ ἡ ψυχή μου πρὸς σέ, ὁ θεός — сице желает душа моя к Тебе, Боже; повтор ἐπιποθεῖ сохранён — 慕う."
  2: "ἐδίψησεν ἡ ψυχή μου πρὸς τὸν θεὸν τὸν ζῶντα — возжада душа моя к Богу крепкому, живому (διψάω «жаждать»). πότε ἥξω καὶ ὀφθήσομαι τῷ προσώπῳ τοῦ θεοῦ; — когда прииду и явлюся лицу Божию? (ὀφθήσομαι «явлюсь, предстану»)."
  3: "ἐγενήθη μοι τὰ δάκρυά μου ἄρτος ἡμέρας καὶ νυκτός — быша слезы моя мне хлеб день и нощь. ἐν τῷ λέγεσθαί μοι καθ᾽ ἑκάστην ἡμέραν Ποῦ ἐστιν ὁ θεός σου; — внегда глаголатися мне на всяк день: где есть Бог твой? Слова насмешников — 「」."
  4: "ταῦτα ἐμνήσθην καὶ ἐξέχεα ἐπ᾽ ἐμὲ τὴν ψυχήν μου — сия помянух и излиях на мя душу мою (ἐκχέω «изливать»). διελεύσομαι ἐν τόπῳ σκηνῆς θαυμαστῆς ἕως τοῦ οἴκου τοῦ θεοῦ — пройду в место селения дивна даже до дому Божия (σκηνή «шатёр, скиния»; θαυμαστός «дивный»). ἐν φωνῇ ἀγαλλιάσεως καὶ ἐξομολογήσεως ἤχου ἑορτάζοντος — гласом радования и исповедания, шума празднующих (ἑορτάζω «праздновать»); греч. синтаксис тёмен, порядок членов сохранён."
  5: "ἵνα τί περίλυπος εἶ, ψυχή — вскую прискорбна еси, душе моя (περίλυπος «очень печальный»). ἵνα τί συνταράσσεις με; — вскую смущаеши мя? (συνταράσσω «сильно смущать»). ἔλπισον ἐπὶ τὸν θεόν — уповай на Бога. ἐξομολογήσομαι αὐτῷ — исповемся Ему, т. е. буду славить; なお — будущее. σωτήριον τοῦ προσώπου μου ὁ θεός μου — спасение лица моего, Бог мой; по-японски わたしの救いである神. Рефрен повторяется в 41:5, 41:11 и 42:5 — сохранён дословно."
  6: "πρὸς ἐμαυτὸν ἡ ψυχή μου ἐταράχθη — к себе самой душа моя смятеся. διὰ τοῦτο μνησθήσομαί σου — сего ради помяну Тя. ἐκ γῆς Ιορδάνου καὶ Ερμωνιιμ, ἀπὸ ὄρους μικροῦ — от земли Иордански и Ермониимски, от горы малыя; ヘルモン — Ερμωνιιμ, 小さな山 — ὄρος μικρόν."
  7: "ἄβυσσος ἄβυσσον ἐπικαλεῖται — бездна бездну призывает (ἐπικαλέομαι «взывать»). εἰς φωνὴν τῶν καταρρακτῶν σου — во гласе хлябий Твоих (καταρράκτης «водопад, поток»); 滝の轟き. πάντες οἱ μετεωρισμοί σου καὶ τὰ κύματά σου — вся высоты Твоя и волны Твоя (μετεωρισμός «поднятие, вал»; κῦμα «волна»); 水のうねり. ἐπ᾽ ἐμὲ διῆλθον — на мне преидоша."
  8: "ἡμέρας ἐντελεῖται κύριος τὸ ἔλεος αὐτοῦ — в день заповесть Господь милость Свою (ἐντέλλομαι «заповедать, повелевать»). νυκτὸς ᾠδὴ παρ᾽ ἐμοί — и нощию песнь от мене; わたしの口に歌がある. προσευχὴ τῷ θεῷ τῆς ζωῆς μου — молитва Богу живота моего."
  9: "ἐρῶ τῷ θεῷ Ἀντιλήμπτωρ μου εἶ — реку Богу: заступник мой еси (ἀντιλήμπτωρ «заступник, защитник»); 盾[たて] — по корпусу. διὰ τί μου ἐπελάθου; — вскую мя забыл еси? ἵνα τί σκυθρωπάζων πορεύομαι — вскую сетуя хожду. ἐν τῷ ἐκθλίβειν τὸν ἐχθρόν μου — внегда оскорбляет враг (ἐκθλίβω «теснить»). Прямая речь — 「」."
  10: "ἐν τῷ καταθλάσαι τὰ ὀστᾶ μου — внегда сокрушатися костем моим (καταθλάω «сокрушать»). ὠνείδισάν με οἱ θλίβοντές με — поношаху ми теснящие меня. ἐν τῷ λέγειν αὐτούς μοι καθ᾽ ἑκάστην ἡμέραν Ποῦ ἐστιν ὁ θεός σου; — внегда глаголати им мне на всяк день: где есть Бог твой? Слова врагов — 「」."
  11: "Тот же рефрен, что в ст. 5; в гр. разница только ἡ σωτηρία вместо σωτήριον — по-японски не передаётся, рефрен сохранён дословно."
