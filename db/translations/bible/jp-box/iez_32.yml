verses:
  1: "第十一年[だいじゅういちねん]、第十二[だいじゅうに]の月[つき]の一日[ついたち]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、エジプトの王[おう]ファラオについて泣[な]き歌[うた]を取[と]り、彼に言[い]え。あなたは国[くに]々[ぐに]の獅子[しし]に似[に]ていた。また、海[うみ]の中[なか]の竜[りゅう]のようであった。あなたはその川[かわ]々[がわ]で角[つの]を突[つ]き、その足[あし]で水[みず]を濁[にご]らし、その川[かわ]を踏[ふ]みにじった。"
  3: "主[しゅ]である神[かみ]はこう言[い]われる。わたしは多[おお]くの民[たみ]の網[あみ]をあなたの上[うえ]に掛[か]け、わたしの釣[つ]り針[ばり]であなたを引[ひ]き上[あ]げる。"
  4: "わたしはあなたを地[ち]の上[うえ]に投[な]げ広[ひろ]げる。野[の]はあなたで満[み]ちる。わたしは天[てん]のすべての鳥[とり]をあなたの上[うえ]に止[と]まらせ、地[ち]のすべての獣[けもの]をあなたで満[み]たす。"
  5: "わたしはあなたの肉[にく]を山[やま]々[やま]に置[お]き、あなたの血[ち]で全[ぜん]地[ち]を満[み]たす。"
  6: "地[ち]はあなたの流[なが]れ出[で]るものによって、あなたの多[おお]さによって、山[やま]々[やま]の上[うえ]で潤[うるお]う。わたしは谷[たに]々[たに]をあなたで満[み]たす。"
  7: "あなたが消[き]え去[さ]るとき、わたしは天[てん]を覆[おお]い、その星[ほし]々[ぼし]を暗[くら]くする。雲[くも]で太陽[たいよう]を覆[おお]い、月[つき]はその光[ひかり]を照[て]らさない。"
  8: "天[てん]で光[ひかり]を放[はな]つすべてのものは、あなたの上[うえ]で暗[くら]くなる。わたしはあなたの地[ち]に闇[やみ]を置[お]く、と主[しゅ]である神[かみ]は言[い]われる。"
  9: "わたしは多[おお]くの民[たみ]の心[こころ]を怒[いか]らせる。あなたの捕囚[ほしゅう]を国[くに]々[ぐに]へ、あなたが知[し]らなかった地[ち]へ引[ひ]いて行[い]くときである。"
  10: "多[おお]くの国[くに]々[ぐに]はあなたのゆえに悲[かな]しむ。その王[おう]たちは、わたしの剣[つるぎ]がその顔[かお]の上[うえ]を飛[と]ぶとき、驚[おどろ]きに驚[おどろ]く。彼らはあなたの倒[たお]れる日[ひ]から、自分[じぶん]の倒[たお]れるのを待[ま]ち受[う]ける。"
  11: "主[しゅ]である神[かみ]はこう言[い]われる。バビロンの王[おう]の剣[つるぎ]があなたに来[く]る。"
  12: "巨人[きょじん]たちの剣[つるぎ]によって、わたしはあなたの力[ちから]を倒[たお]す。彼らはみな国[くに]々[ぐに]からの滅[ほろ]ぼす者[もの]である。彼らはエジプトの誇[ほこ]りを滅[ほろ]ぼし、そのすべての力[ちから]は砕[くだ]かれる。"
  13: "わたしはそのすべての家畜[かちく]を多[おお]くの水[みず]から滅[ほろ]ぼす。もはや人[ひと]の足[あし]はこれを濁[にご]らさず、家畜[かちく]の足[あし]跡[あと]もこれを踏[ふ]まない。"
  14: "こうして、そのとき、その水[みず]は静[しず]まり、その川[かわ]は油[あぶら]のように流[なが]れる、と主[しゅ]は言[い]われる。"
  15: "わたしがエジプトを滅[ほろ]びに渡[わた]し、その地[ち]がその満[み]ちているものとともに荒[あ]れ果[は]てるとき、わたしがそこに住[す]むすべての者[もの]を散[ち]らすとき、彼らはわたしが主[しゅ]であることを知[し]る。"
  16: "これは泣[な]き歌[うた]である。あなたはこれを弔[とむら]う。国[くに]々[ぐに]の娘[むすめ]たちもこれを弔[とむら]う。彼らはエジプトとそのすべての力[ちから]について、これを弔[とむら]う、と主[しゅ]である神[かみ]は言[い]われる」。"
  17: "第十二年[だいじゅうにねん]、第一[だいいち]の月[つき]の十五日[じゅうごにち]に、主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  18: "「人[ひと]の子[こ]よ、エジプトの力[ちから]を弔[とむら]え。国[くに]々[ぐに]はその娘[むすめ]たちを、死[し]んだ者[もの]として地[ち]の深[ふか]みへ、穴[あな]に下[くだ]る者[もの]たちのもとへ下[くだ]らせる。"
  19: "水[みず]のうちから麗[うるわ]しく下[くだ]り、無割礼[むかつれい]の者[もの]たちとともに眠[ねむ]れ。"
  20: "彼らは剣[つるぎ]で傷[きず]ついた者[もの]たちのただ中[なか]で、彼とともに倒[たお]れる。そのすべての力[ちから]は眠[ねむ]る。"
  21: "巨人[きょじん]たちはあなたに言[い]う。『穴[あな]の深[ふか]みのうちにとどまれ。あなたはだれよりも優[すぐ]れているのか。下[くだ]りて、無割礼[むかつれい]の者[もの]たちとともに、剣[つるぎ]で傷[きず]ついた者[もの]たちのただ中[なか]で眠[ねむ]れ』と。"
  22: "そこにはアッスルとそのすべての集[あつ]まりがある。彼らはみな剣[つるぎ]で傷[きず]ついた者[もの]であり、そこに置[お]かれた。その墓[はか]は穴[あな]の深[ふか]みにある。その集[あつ]まりはその墓[はか]の周[まわ]りにあり、彼らはみな剣[つるぎ]で倒[たお]れた傷[きず]ついた者[もの]である。"
  23: "彼らはその恐[おそ]れを生[い]ける者[もの]の地[ち]に与[あた]えた者[もの]たちである。"
  24: "そこにはエラムとそのすべての力[ちから]がある。その墓[はか]の周[まわ]りには、剣[つるぎ]で倒[たお]れた傷[きず]ついた者[もの]たちがみな、すなわち無割礼[むかつれい]のまま地[ち]の深[ふか]みへ下[くだ]った者[もの]たちがいる。彼らはその恐[おそ]れを生[い]ける者[もの]の地[ち]に与[あた]え、穴[あな]に下[くだ]る者[もの]たちとともにその苦[くる]しみを受[う]けた。"
  25: "彼らは穴[あな]に下[くだ]る者[もの]たちとともに自分[じぶん]の苦[くる]しみを受[う]け、傷[きず]ついた者[もの]たちのただ中[なか]にいる。"
  26: "そこにはモソクとトベルとそのすべての力[ちから]が置[お]かれた。その墓[はか]の周[まわ]りには、その傷[きず]ついた者[もの]たちがみな、剣[つるぎ]による無割礼[むかつれい]の傷[きず]ついた者[もの]たちである。彼らはその恐[おそ]れを生[い]ける者[もの]の地[ち]に与[あた]えた者[もの]たちである。"
  27: "彼らは世[よ]の初[はじ]めから倒[たお]れた巨人[きょじん]たちとともに眠[ねむ]った。その者[もの]たちは武[ぶ]器[き]を携[たずさ]えて陰府[よみ]に下[くだ]り、その剣[つるぎ]をその頭[あたま]の下[した]に置[お]いた。その不法[ふほう]はその骨[ほね]の上[うえ]に残[のこ]った。彼らは生[い]きている間[あいだ]、すべての者[もの]を恐[おそ]れさせ、生[い]ける者[もの]の地[ち]で強[つよ]い者[もの]たちの恐[おそ]れとなったからである。"
  28: "あなたも無割礼[むかつれい]の者[もの]たちのただ中[なか]で、剣[つるぎ]で傷[きず]つけられた者[もの]たちとともに眠[ねむ]る。"
  29: "そこにはエドムとその王[おう]たち、およびアッスルのすべての君[きみ]たちが置[お]かれた。彼らはその力[ちから]を剣[つるぎ]の傷[きず]に与[あた]えた者[もの]たちである。彼らは傷[きず]ついた者[もの]たちとともに、穴[あな]に下[くだ]る者[もの]たちとともに眠[ねむ]った。"
  30: "そこには北[きた]の君[きみ]たち、アッスルのすべての将[しょう]軍[ぐん]たちがみな、いる。彼らはその恐[おそ]れとその力[ちから]とともに恥[は]じながら傷[きず]ついた者[もの]として下[くだ]り、無割礼[むかつれい]のまま剣[つるぎ]で傷[きず]ついた者[もの]たちとともに眠[ねむ]り、穴[あな]に下[くだ]る者[もの]たちとともにその苦[くる]しみを負[お]った。"
  31: "ファラオ王[おう]はこれらを見[み]、そのすべての力[ちから]について慰[なぐさ]められる。ファラオと剣[つるぎ]で傷[きず]ついた者[もの]たち、そのすべての力[ちから]も同[おな]じである、と主[しゅ]である神[かみ]は言[い]われる。"
  32: "わたしがその恐[おそ]れを生[い]ける者[もの]の地[ち]に与[あた]えたからである。彼は無割礼[むかつれい]の者[もの]たちのただ中[なか]で、剣[つるぎ]で傷[きず]ついた者[もの]たちとともに眠[ねむ]る。ファラオとそのすべての群[ぐん]衆[しゅう]である、と主[しゅ]である神[かみ]は言[い]われる」。"

notes:
  1: "Καὶ ἐγένετο ἐν τῷ ἑνδεκάτῳ ἔτει ἐν τῷ δωδεκάτῳ μηνὶ μιᾷ τοῦ μηνός — «и было в одиннадцатый год, в двенадцатый месяц, в первый день месяца»: дата с точностью до дня, ср. 31:1. Слав. стих обрывается на дате («…во един день месяца,»), формула «бысть слово Господне» в слав. стоит в начале 2-го стиха; в LXX дата и формула вместе в 1-м. Держим LXX, отмечено."
  2: "λαβὲ θρῆνον ἐπὶ Φαραω — «возьми плач о фараоне» (θρῆνος — 泣[な]き歌[うた]); Λέοντι ἐθνῶν ὡμοιώθης — «льву народов ты уподобился» (λέων — 獅子[しし]); ὡς δράκων ὁ ἐν τῇ θαλάσσῃ — «как дракон в море» (δράκων — 竜[りゅう]; слав. «змий великий»); ἐκεράτιζες τοῖς ποταμοῖς σου — «бодал рогами реки твои» (κερατίζω — бодать); ἐτάρασσες ὕδωρ τοῖς ποσίν σου — «мутил воду ногами твоими» (ταράσσω — 濁[にご]らす); κατεπάτεις τοὺς ποταμούς σου — «попирал реки твои»."
  3: "τάδε λέγει κύριος — «так говорит Господь» (без второго κύριος; слав. «адонаи Господь»); περιβαλῶ ἐπὶ σὲ δίκτυα λαῶν πολλῶν — «накину на тебя сети народов многих» (δίκτυον — 網[あみ]); ἀνάξω σε ἐν τῷ ἀγκίστρῳ μου — «извлеку тебя крючком (удою) Моей» (ἄγκιστρον — крючок, 釣[つ]り針[ばり])."
  4: "ἐκτενῶ σε ἐπὶ τὴν γῆν — «повергну тебя на землю» (ἐκτείνω — простирать); πεδία πλησθήσεταί σου — «поля наполнятся тобою»; ἐπικαθιῶ ἐπὶ σὲ πάντα τὰ πετεινὰ τοῦ οὐρανοῦ — «посажу на тебя всех птиц небесных» (ἐπικαθίζω — сажать сверху), передано 止[と]まらせる; ἐμπλήσω ἐκ σοῦ πάντα τὰ θηρία πάσης τῆς γῆς — «насыщу от тебя всех зверей всей земли»."
  5: "δώσω τὰς σάρκας σου ἐπὶ τὰ ὄρη — «отдам плоть твою на горы»; καὶ ἐμπλήσω ἀπὸ τοῦ αἵματός σου — «и наполню от крови твоей»: в LXX стих обрывается без дополнения, слав. добавляет «всю землю» — нет в LXX, внесено."
  6: "ποτισθήσεται ἡ γῆ ἀπὸ τῶν προχωρημάτων σου — «напоится земля от выступлений (излияний) твоих» (προχώρημα — излияние, нечистота); ἀπὸ τοῦ πλήθους σου ἐπὶ τῶν ὀρέων — «от множества твоего на горах»; φάραγγας ἐμπλήσω ἀπὸ σοῦ — «ущелья наполню тобою». Слав. читает «от гноя твоего» — иное понимание тёмного слова; держим LXX (流[なが]れ出[で]るもの)."
  7: "κατακαλύψω ἐν τῷ σβεσθῆναί σε οὐρανόν — «покрою, когда ты угаснешь, небо» (σβέννυμι — гасить); συσκοτάσω τὰ ἄστρα αὐτοῦ — «помрачу звёзды его»; ἥλιον ἐν νεφέλῃ καλύψω — «солнце облаком покрою»; σελήνη οὐ μὴ φάνῃ τὸ φῶς αὐτῆς — «луна не явит света своего». Образ космического мрака, ср. Ис 13:10; Иоил 2:10."
  8: "πάντα τὰ φαίνοντα φῶς ἐν τῷ οὐρανῷ — «всё, светящее светом на небе»; δώσω σκότος ἐπὶ τὴν γῆν σου — «дам тьму на землю твою». Слав. «вся светила небесная помрачу на тя и дам тму на землю твою»."
  9: "παροργιῶ καρδίαν λαῶν πολλῶν — «разгневаю сердце народов многих» (παροργίζω); ἡνίκα ἂν ἄγω αἰχμαλωσίαν σου εἰς τὰ ἔθνη — «когда поведу плен твой к народам» (αἰχμαλωσία — 捕囚[ほしゅう]); εἰς γῆν, ἣν οὐκ ἔγνως — «в землю, которой ты не знал»."
  10: "καὶ στυγνάσουσιν ἐπὶ σὲ ἔθνη πολλά — «и омрачатся о тебе народы многие» (στυγνάζω — быть мрачным), передано 悲[かな]しむ; ἐκστάσει ἐκστήσονται — «изумлением изумятся» (cognatus accusativus, 驚[おどろ]きに驚[おどろ]く); ἐν τῷ πέτασθαι τὴν ῥομφαίαν μου ἐπὶ πρόσωπα αὐτῶν — «когда полетит меч Мой на лица их»; προσδεχόμενοι τὴν πτῶσιν αὐτῶν ἀφ' ἡμέρας πτώσεώς σου — «ожидая падения своего со дня падения твоего»."
  11: "Ῥομφαία βασιλέως Βαβυλῶνος ἥξει σοι — «меч царя Вавилонского придёт тебе». Слав. продолжает уже в 11-м «мечьми исполинов, и поражу крепость твою»; в LXX это стоит в 12-м («мечами гигантов»), отмечено."
  12: "ἐν μαχαίραις γιγάντων — «мечами гигантов» (γίγας — 巨人[きょじん]); καταβαλῶ τὴν ἰσχύν σου — «повергну силу твою»; λοιμοὶ ἀπὸ ἐθνῶν πάντες — «губители из народов все» (λοιμός); ἀπολοῦσι τὴν ὕβριν Αἰγύπτου — «погубят гордость Египта» (ὕβρις — 誇[ほこ]り); συντριβήσεται πᾶσα ἡ ἰσχὺς αὐτῆς — «сокрушится вся сила его»."
  13: "ἀπολῶ πάντα τὰ κτήνη αὐτῆς ἀφ' ὕδατος πολλοῦ — «погублю весь скот её от воды многой»; οὐ μὴ ταράξῃ αὐτὸ ἔτι ποὺς ἀνθρώπου — «не возмутит её более нога человека»; ἴχνος κτηνῶν οὐ μὴ καταπατήσῃ αὐτό — «след скотов не попирает её»."
  14: "οὕτως τότε ἡσυχάσει τὰ ὕδατα αὐτῶν — «так тогда успокоятся воды их» (ἡσυχάζω); οἱ ποταμοὶ αὐτῶν ὡς ἔλαιον πορεύσονται — «реки их как елей пойдут». Слав. добавляет «адонаи» при «глаголет Господь» — в LXX только κύριος."
  15: "ὅταν δῶ Αἴγυπτον εἰς ἀπώλειαν — «когда предам Египет в погибель»; ἐρημωθῇ ἡ γῆ σὺν τῇ πληρώσει αὐτῆς — «опустеет земля с полнотою её» (πλήρωσις); διασπείρω πάντας τοὺς κατοικοῦντας ἐν αὐτῇ — «рассею всех живущих в ней»; γνώσονται ὅτι ἐγώ εἰμι κύριος — формула знания. Слав. «егда дам египта в пагубу…»."
  16: "θρῆνός ἐστιν καὶ θρηνήσεις αὐτόν — «плач это, и оплачешь его» (θρηνέω — оплакивать, 弔[とむら]う); αἱ θυγατέρες τῶν ἐθνῶν θρηνήσουσιν αὐτόν — «дочери народов оплачут его»; ἐπ' Αἴγυπτον καὶ ἐπὶ πᾶσαν τὴν ἰσχὺν αὐτῆς — «о Египте и о всей силе его». Здесь слово Господа (2–16) закрывается."
  17: "Καὶ ἐγενήθη ἐν τῷ δωδεκάτῳ ἔτει τοῦ πρώτου μηνὸς πεντεκαιδεκάτῃ τοῦ μηνός — «и было в двенадцатый год, в первый месяц, в пятнадцатый день месяца»: в LXX назван первый месяц, в МТ и Синодальном — «того же месяца» (без названия). Держим LXX/csl («перваго месяца»), отмечено."
  18: "θρήνησον ἐπὶ τὴν ἰσχὺν Αἰγύπτου — «оплачь силу Египта»; καταβιβάσουσιν αὐτῆς τὰς θυγατέρας τὰ ἔθνη νεκρὰς εἰς τὸ βάθος τῆς γῆς — «низведут дочерей его народы мёртвыми в глубину земли»; πρὸς τοὺς καταβαίνοντας εἰς βόθρον — «к сходящим в яму». Слав. содержит редакционную помету в скобках «(прекланяя преведи его)» — не перенесена."
  19: "В gr-lxx-byz на месте стиха стоит «.» — в модуле лакуна; стих переведён по церковнославянскому (csl-ru) без 〔…〕 (решение брифа): «От вод благолепно сниди и поспи с необрезаными» — тёмное место, букв. «от вод прекрасно сойди». В ru (МТ) иначе: «Кого ты превосходишь? сойди, и лежи с необрезанными». Передано по слав., многозначность не сглажена."
  20: "ἐν μέσῳ τραυματιῶν μαχαίρας πεσοῦνται μετ' αὐτοῦ — «среди поражённых мечом падут с ним»; κοιμηθήσεται πᾶσα ἡ ἰσχὺς αὐτοῦ — «почиет вся сила его». Слав. «среде язвеных мечем падут с ним, и успнет вся крепость его»."
  21: "ἐροῦσίν σοι οἱ γίγαντες — «скажут тебе гиганты»: их речь в 『…』. Ἐν βάθει βόθρου γίνου — «в глубине ямы будь»; τίνος κρεῖττων εἶ — «кого ты лучше (превосходишь)?»; κατάβηθι καὶ κοιμήθητι μετὰ ἀπεριτμήτων — «сойди и почий с необрезанными»."
  22: "ἐκεῖ Ασσουρ καὶ πᾶσα ἡ συναγωγὴ αὐτοῦ — «там Ассур и весь сонм его» (συναγωγή — собрание, 集[あつ]まり); πάντες τραυματίαι ἐκεῖ ἐδόθησαν — «все поражённые там преданы»; ἡ ταφὴ αὐτῶν ἐν βάθει βόθρου — «погребение их в глубине ямы» (ταφή); περικύκλῳ τοῦ μνήματος αὐτοῦ — «вокруг гробницы его» (μνῆμα — 墓[はか])."
  23: "οἱ δόντες τὸν φόβον αὐτῶν ἐπὶ γῆς ζωῆς — «давние страх свой на земле живых»: в LXX стих — только этот оборот; слав. повторяет из 22-го «гробы его во стегнех рва…» — дублет, в текст не внесён."
  24: "ἐκεῖ Αιλαμ καὶ πᾶσα ἡ δύναμις αὐτοῦ — «там Елам и вся сила его» (Αιλαμ — エラム); οἱ καταβαίνοντες ἀπερίτμητοι εἰς γῆς βάθος — «сходящие необрезанными в глубину земли»; ἐλάβοσαν τὴν βάσανον αὐτῶν — «приняли мучение (казнь) своё» (βάσανος — 苦[くる]しみ)."
  25: "ἐν μέσῳ τραυματιῶν — «среди поражённых»: в LXX стих — обрывок из трёх слов, слав. даёт полный текст («и прияша мучение свое с нисходящими в пропасть, среде язвеных»), переведено по слав. Это не «точка»: в модуле стих есть, но короткий."
  26: "ἐκεῖ ἐδόθησαν Μοσοχ καὶ Θοβελ — «там преданы Мосох и Фовел» (Μοσοχ, Θοβελ — モソク, トベル; в Синодальном Мешех и Фувал, по МТ); πάντες ἀπερίτμητοι τραυματίαι ἀπὸ μαχαίρας — «все необрезанные, поражённые мечом»; οἱ δεδωκότες τὸν φόβον αὐτῶν ἐπὶ γῆς ζωῆς — «давние страх свой на земле живых»."
  27: "ἐκοιμήθησαν μετὰ τῶν γιγάντων τῶν πεπτωκότων ἀπὸ αἰῶνος — «почили с гигантами, павшими от века»; οἳ κατέβησαν εἰς ᾅδου ἐν ὅπλοις πολεμικοῖς — «которые сошли в ад с оружием воинским» (ὅπλον); ἔθηκαν τὰς μαχαίρας αὐτῶν ὑπὸ τὰς κεφαλὰς αὐτῶν — «положили мечи свои под головы свои»; αἱ ἀνομίαι αὐτῶν ἐπὶ τῶν ὀστῶν αὐτῶν — «беззакония их на костях их». ὅτι ἐξεφόβησαν γίγαντας ἐν γῇ ζωῆς — «ибо устрашили гигантов на земле живых»; слав. иначе: «яко устрашиша всех во житии своем, и страх сильным быша на земли живущым» — по паритету взято слав. чтение."
  28: "καὶ σὺ ἐν μέσῳ ἀπεριτμήτων κοιμηθήσῃ — «и ты среди необрезанных почиешь»; μετὰ τετραυματισμένων μαχαίρᾳ — «с поражёнными мечом». Слав. добавляет «сокрушишися» («сокрушён будешь») — нет в LXX, отмечено, в текст не внесено."
  29: "ἐκεῖ ἐδόθησαν οἱ ἄρχοντες Ασσουρ — «там преданы князья Ассура»; οἱ δόντες τὴν ἰσχὺν αὐτοῦ εἰς τραῦμα μαχαίρας — «отдавшие силу его на рану меча»; οὗτοι μετὰ τραυματιῶν ἐκοιμήθησαν — «они с поражёнными почили». Слав. добавляет «Едом и цари его» — нет в LXX (из МТ), внесено."
  30: "οἱ ἄρχοντες τοῦ βορρᾶ — «князья севера»; πάντες στρατηγοὶ Ασσουρ — «все воеводы Ассура» (στρατηγός — 将[しょう]軍[ぐん]); οἱ καταβαίνοντες τραυματίαι σὺν τῷ φόβῳ αὐτῶν καὶ τῇ ἰσχύι αὐτῶν — «сходящие поражёнными со страхом своим и силою своею»; ἀπήνεγκαν τὴν βάσανον αὐτῶν — «понесли мучение своё». Слав. добавляет «стыдящеся» (посрамлены) — нет в LXX, внесено."
  31: "ἐκείνους ὄψεται βασιλεὺς Φαραω — «их увидит царь фараон»; παρακληθήσεται ἐπὶ πᾶσαν τὴν ἰσχὺν αὐτῶν — «утешится о всей силе их» (παρακαλέω). Слав. добавляет «фараон и язвении мечем и вся сила его» — нет в LXX, внесено."
  32: "δέδωκα τὸν φόβον αὐτοῦ ἐπὶ γῆς ζωῆς — «Я дал страх его на земле живых»: в LXX αὐτοῦ («его»), слав. «страх мой» — разночтение отмечено, держим LXX. κοιμηθήσεται ἐν μέσῳ ἀπεριτμήτων — «почиет среди необрезанных»; Φαραω καὶ πᾶν τὸ πλῆθος αὐτοῦ — «фараон и всё множество его»."
