# jp-box, Иезекииль, глава 32. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 32 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: плач о фараоне и Египте. 1 дата (одиннадцатый год, двенадцатый месяц);
# 2–10 плач: лев народов и дракон в море, сети и удочка, поле, полное трупов,
# тьма на небе, ужас народов; 11–16 меч царя Вавилонского, гиганты, истребление
# скота, тихие воды, «узнают, что Я Господь»; 17–32 второй плач: сведение Египта
# в преисподнюю, шеол как общий удел — Ассур, Елам, Мосох и Фовел, Едом, князья
# севера; фараон утешается, видя всех там.
# Голоса: 1 — дата и формула вне кавычек; 2–16 — слово Господа в 「…» (плач
# и обращение к фараону внутри цитаты); 17 — дата; 18–32 — второе слово Господа
# в 「…». Вложенная речь: 21 — слова гигантов в 『…』.
# «Точка»: 32:19 — в gr-lxx-byz на месте стиха «.», переведено по слав. (csl-ru)
# без 〔…〕; в notes отмечено «в модуле лакуна».
# Имена и термины: ファラオ, エジプト, バビロン, アッスル, エラム, モソク, トベル, エドム;
# 巨人[きょじん] — γίγας; 陰府[よみ] — ᾅδης; 穴[あな] — βόθρος/λάκκος; 生[い]ける者[もの]の地[ち] —
# γῆ ζωῆς (32:23, 24, 26, 27, 30, 32); 無割礼[むかつれい] — ἀπερίτμητος; 剣[つるぎ]で
# 傷[きず]ついた者[もの] — τραυματίας.
