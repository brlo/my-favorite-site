chapter: 7
draft: true

verses:
  1: "主[しゅ]である神[かみ]はわたしにこう示[しめ]された。見[み]よ、いなごの群[む]れが朝[あさ]早[はや]く涌[わ]いて来[く]る。見[み]よ、一匹[いっぴき]の芋虫[いもむし]、王[おう]であるゴグがいる。それは王[おう]の刈[か]り入[い]れの後[あと]の草[くさ]であった。"
  2: "その群[む]れが地[ち]の草[くさ]を食[く]い尽[つ]くすと、わたしは言[い]った。「主[しゅ]よ、主よ、あわれんでください。だれがヤコブを起[お]こせるでしょう。彼はあまりに小[ちい]さいのです。」"
  3: "「主[しゅ]よ、このことについて悔[く]い改[あらた]めてください。」すると主[しゅ]は言[い]われた。「それは起[お]こらない。」"
  4: "主[しゅ]である神[かみ]はわたしにこう示[しめ]された。見[み]よ、主[しゅ]である神[かみ]は裁[さば]きのために火[ひ]を呼[よ]ばれ、それは大[おお]いなる深[ふか]みを食[く]い尽[つ]くし、さらに地[ち]の一部[いちぶ]を食[く]い尽[つ]くした。"
  5: "わたしは言[い]った。「主[しゅ]よ、主よ、どうかやめてください。だれがヤコブを起[お]こせるでしょう。彼はあまりに小[ちい]さいのです。」"
  6: "「主[しゅ]よ、このことについて悔[く]い改[あらた]めてください。」すると主[しゅ]は言[い]われた。「それも起[お]こらない。」"
  7: "主[しゅ]はわたしにこう示[しめ]された。見[み]よ、主[しゅ]が堅[かた]い城壁[じょうへき]の上[うえ]に立[た]ち、その手[て]に測[はか]り縄[なわ]を持[も]っておられた。"
  8: "主[しゅ]はわたしに言[い]われた。「アモスよ、何[なに]を見[み]るか。」わたしは答[こた]えた。「測[はか]り縄[なわ]です。」主[しゅ]は言[い]われた。「見[み]よ、わたしはわたしの民[たみ]イスラエルのただ中[なか]に測[はか]り縄を置[お]く。もはや彼らを見過[みす]ごさない。」"
  9: "笑[わら]いの祭壇[さいだん]は滅[ほろ]び、イスラエルの聖[せい]なる祭儀[さいぎ]は荒[あ]れ果[は]てる。わたしは剣[つるぎ]をもってヤロブアムの家[いえ]に立[た]ち向[む]かう。"
  10: "ベテルの祭司[さいし]アマツヤは、イスラエルの王[おう]ヤロブアムに人[ひと]を遣[つか]わして言[い]った。「アモスはイスラエルの家[いえ]のただ中[なか]で、あなたに対して謀反[むほん]を企[くわだ]てています。この地[ち]は彼のすべての言葉[ことば]に耐[た]えられません。"
  11: "アモスはこう言[い]っています。『ヤロブアムは剣[つるぎ]で死[し]に、イスラエルは捕囚[ほしゅう]となって自分[じぶん]の地[ち]から連[つ]れ去[さ]られる』と。」"
  12: "アマツヤはアモスに言[い]った。「先見[せんけん]者[しゃ]よ、行[い]ってユダの地[ち]へ逃[に]げ、そこで暮[く]らし、そこで預言[よげん]せよ。"
  13: "しかし、ベテルではもはや預言[よげん]してはならない。そこは王[おう]の聖所[せいしょ]であり、王国[おうこく]の家[いえ]だからである。」"
  14: "アモスはアマツヤに答[こた]えて言[い]った。「わたしは預言者[よげんしゃ]でも、預言者の子[こ]でもない。わたしは羊飼[ひつじか]いで、いちじく桑[ぐわ]の実[み]を摘[つ]む者[もの]であった。"
  15: "しかし、主[しゅ]は羊[ひつじ]の群[む]れからわたしを取[と]り、わたしに言[い]われた。『行[い]って、わたしの民[たみ]イスラエルに預言[よげん]せよ。』"
  16: "そこで、主[しゅ]の言葉[ことば]を聞[き]け。あなたは言[い]う。『イスラエルに対して預言[よげん]するな。ヤコブの家[いえ]に向[む]かって民[たみ]を騒[さわ]がせるな』と。"
  17: "それゆえ、主[しゅ]はこう言[い]われる。『あなたの妻[つま]は町[まち]で娼婦[しょうふ]となり、あなたの息子[むすこ]たちと娘[むすめ]たちは剣[つるぎ]で倒[たお]れ、あなたの地[ち]は測[はか]り縄[なわ]で分[わ]けられ、あなた自身[じしん]は汚[けが]れた地[ち]で死[し]ぬ。イスラエルは捕囚[ほしゅう]となって自分[じぶん]の地[ち]から連[つ]れ去[さ]られる。』」"

notes:
  1: "Οὕτως ἔδειξέν μοι κύριος — «так показал мне Господь» (δείκνυμι — показывать, 示す); ἐπιγονὴ ἀκρίδων ἐρχομένη ἑωθινή — «приплод саранчи, идущий утренний» (ἐπιγονή — приплод/поколение, 群れ; ἀκρίς — いなご; ἑωθινός — утренний, 朝早く); βροῦχος εἷς Γωγ ὁ βασιλεύς — «червь один, Гог царь» (βροῦχος — 芋虫; Γωγ — ゴグ; место тёмное: возможно, «рой» или имя); χόρτος — 草; βασιλικός — царский (刈り入れ)."
  2: "Κύριε κύριε, ἵλεως γενοῦ — «Господи, Господи, будь милостив» (ἵλεως — милостивый, あわれんでください); τίς ἀναστήσει τὸν Ιακωβ — «кто восставит Иакова» (ἀνίστημι — 起こす); ὅτι ὀλιγοστός ἐστιν — «ибо он мал (немногочислен)» (ὀλιγοστός — 小さい). Молитва пророка — 「…」."
  3: "μετανόησον, κύριε, ἐπὶ τούτῳ — «раскайся, Господи, об этом» (μετανοέω — изменять решение, 思い直す; императив, как csl «раскайся»; ru «пожалел Господь» — МТ); Καὶ τοῦτο οὐκ ἔσται — «и это не будет» (οὐκ ἔσται — 起こらない), слова Господа — 「…」."
  4: "Οὕτως ἔδειξέν μοι κύριος — «так показал мне Господь»; ἐκάλεσεν τὴν δίκην ἐν πυρὶ κύριος — «призвал суд в огне Господь» (δίκη — суд/распря, 裁き; πῦρ — 火); κατέφαγε τὴν ἄβυσσον τὴν πολλήν — «поел бездну великую» (ἄβυσσος — 深み); κατέφαγεν τὴν μερίδα — «поел часть» (μερίς — 一部)."
  5: "Κύριε κύριε, κόπασον δή — «Господи, Господи, останови же» (κοπάζω — прекращать, やめる; δή — усиление); τίς ἀναστήσει τὸν Ιακωβ… — повтор молитвы 2-го стиха (рефрен)."
  6: "μετανόησον, κύριε, ἐπὶ τούτῳ — «раскайся, Господи, об этом»; Καὶ τοῦτο οὐ μὴ γένηται — «и это не случится» (усиленное отрицание οὐ μή, それも起こらない); λέγει κύριος — «говорит Господь»."
  7: "Οὕτως ἔδειξέν μοι κύριος — «так показал мне Господь»; ἀνὴρ ἑστηκὼς ἐπὶ τείχους ἀδαμαντίνου — «муж, стоящий на стене адамантовой» (ἀδαμάντινος — адамантовый/несокрушимый, 堅い; τεῖχος — 城壁); ἐν τῇ χειρὶ αὐτοῦ ἀδάμας — «в руке его адамант» (ἀδάμας — алмаз/адамант; в контексте — отвес, ср. 8; передано 測り縄/下げ振り)."
  8: "Τί σὺ ὁρᾷς, Αμως — «что ты видишь, Амос» (ὁράω — 見る); Ἀδάμαντα — «адамант» (в ответе пророка; в контексте — отвес, 測り縄; csl «адамант», ru «отвес»); ἐντάσσω ἀδάμαντα ἐν μέσῳ λαοῦ μου Ισραηλ — «поставлю адамант (отвес) среди народа Моего Израиля» (ἐντάσσω — ставить, 置く); οὐκέτι μὴ προσθῶ τοῦ παρελθεῖν αὐτόν — «более не приложу пройти его» (προστίθημι — прибавлять; παρέρχομαι — проходить мимо, 見過ごす)."
  9: "ἀφανισθήσονται βωμοὶ τοῦ γέλωτος — «истребятся жертвенники смеха» (βωμός — жертвенник, 祭壇; γέλως — смех, 笑い; место тёмное, возможно, игра слов; csl «требища смеха»); αἱ τελεταὶ τοῦ Ισραηλ ἐξερημωθήσονται — «священнодействия Израиля опустеют» (τελετή — священнодействие/празднество, 祭儀; ἐξερημόω — опустошать); ἀναστήσομαι ἐπὶ τὸν οἶκον Ιεροβοαμ ἐν ῥομφαίᾳ — «восстану на дом Иеровоама с мечом» (ἀνίστημι — 立ち向かう; ῥομφαία — 剣). В ru (МТ) «высоты Исааковы» — иное чтение, не внесено."
  10: "Αμασιας ὁ ἱερεὺς Βαιθηλ — «Амасия, священник Вефильский» (アマツヤ; Βαιθηλ — ベテル); Συστροφὰς ποιεῖται κατὰ σοῦ Αμως — «скопища (заговоры) делает против тебя Амос» (συστροφή — сборище/заговор, 謀反); οὐ μὴ δύνηται ἡ γῆ ὑπενεγκεῖν ἅπαντας τοὺς λόγους αὐτοῦ — «не сможет земля понести всех слов его» (ὑποφέρω — выносить, 耐える). Речь Амасии — 「…», продолжается в 11."
  11: "διότι τάδε λέγει Αμως — «ибо так говорит Амос»; Ἐν ῥομφαίᾳ τελευτήσει Ιεροβοαμ — «мечом умрёт Иеровоам» (τελευτάω — умирать, 死ぬ; ῥομφαία — 剣); ὁ δὲ Ισραηλ αἰχμάλωτος ἀχθήσεται ἀπὸ τῆς γῆς αὐτοῦ — «а Израиль пленником отведён будет из земли своей» (αἰχμάλωτος — 捕囚; ἄγω — вести, 連れ去る). Слова Амоса — 『…』 внутри донесения Амасии."
  12: "Ὁ ὁρῶν — «видящий», т.е. пророк/провидец (ὁράω — 見る; 先見者; ср. 1 Цар 9:9); βάδιζε ἐκχώρησον εἰς γῆν Ιουδα — «иди, удались в землю Иудину» (ἐκχωρέω — уходить, 逃げる); ἐκεῖ καταβίου — «там живи (проживай)» (καταβιόω — 暮らす; в МТ/ru «ешь хлеб» — иное чтение); ἐκεῖ προφητεύσεις — «там будешь пророчествовать» (預言する)."
  13: "εἰς δὲ Βαιθηλ οὐκέτι μὴ προσθῇς τοῦ προφητεῦσαι — «а в Вефиль более не приложи пророчествовать» (προστίθημι — прибавлять, «более»; Βαιθηλ — ベテル); ὅτι ἁγίασμα βασιλέως ἐστὶν — «ибо это освящение царя» (ἁγίασμα — святыня/освящение, 聖所); οἶκος βασιλείας ἐστίν — «дом царства есть» (βασιλεία — 王国)."
  14: "Οὐκ ἤμην προφήτης ἐγὼ οὐδὲ υἱὸς προφήτου — «я не был пророком, ни сыном пророка» (ἤμην — имперфект, «был»); ἀλλ' ἢ αἰπόλος ἤμην — «но был пастухом (козоводом)» (αἰπόλος — пастух коз, 羊飼い); κνίζων συκάμινα — «надрезающий (собирающий) сикоморы» (κνίζω — надрезать/собирать; συκάμινον — сикомор, いちじく桑の実; слав. «ягодичия обирая»)."
  15: "ἀνέλαβέν με κύριος ἐκ τῶν προβάτων — «взял меня Господь от овец» (ἀναλαμβάνω — брать, 取り; πρόβατον — 羊); Βάδιζε προφήτευσον ἐπὶ τὸν λαόν μου Ισραηλ — «иди, пророчествуй на народ Мой Израиля» (βαδίζω — идти; προφητεύω — 預言する). Слова Бога — 『…』 внутри ответа Амоса."
  16: "Σὺ λέγεις — «ты говоришь»; Μὴ προφήτευε ἐπὶ τὸν Ισραηλ — «не пророчествуй на Израиля»; οὐ μὴ ὀχλαγωγήσῃς ἐπὶ τὸν οἶκον Ιακωβ — «не возмущай (не волнуй толпу) на дом Иакова» (ὀχλαγωγέω — волновать народ, 民を騒がせる; οἶκος Ιακωβ — ヤコブの家). Слова народа — 『…』."
  17: "ἡ γυνή σου ἐν τῇ πόλει πορνεύσει — «жена твоя в городе будет блудить» (πορνεύω — 娼婦となる; в ru «будет обесчещена» — МТ); οἱ υἱοί σου καὶ αἱ θυγατέρες σου ἐν ῥομφαίᾳ πεσοῦνται — «сыны твои и дочери твои падут от меча»; ἡ γῆ σου ἐν σχοινίῳ καταμετρηθήσεται — «земля твоя вервью измерена будет» (σχοινίον — вервь, 測り縄; καταμετρέω — измерять, 分ける); σὺ ἐν γῇ ἀκαθάρτῳ τελευτήσεις — «ты в земле нечистой умрёшь» (ἀκάθαρτος — 汚れた); ὁ δὲ Ισραηλ αἰχμάλωτος ἀχθήσεται ἀπὸ τῆς γῆς αὐτοῦ — «а Израиль пленником отведён будет из земли своей». Слова Господа — 『…』."
