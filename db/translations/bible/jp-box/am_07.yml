# jp-box, Амос, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 7 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: три видения и спор с Амасией. 1–3 саранча; 4–6 огонь; 7–9 отвес:
# «положу отвес среди народа Моего», жертвенники смеха, дом Иеровоама;
# 10–17 Амасия, священник Вефильский, доносит царю, гонит Амоса в Иуду; ответ
# Амоса: «я не пророк и не сын пророка, а пастух и собиратель сикомор», Господь
# взял его от овец; пророчество о жене, детях, земле и плене.
# Голоса: 1, 4, 7 — повествование о видениях; 2, 5 — молитва пророка в 「…»;
# 3, 6 — ответ Господа в 「…»; 8 — вопрос Господа, ответ пророка, слово Господа
# (три цитаты); 10–11 — донесение Амасии в 「…», слова Амоса внутри — 『…』;
# 12–13 — речь Амасии в 「…»; 14–17 — ответ Амоса в 「…», слова Бога в 15
# и 17, слова народа в 16 — 『…』.
# Трудные места: 1 «βροῦχος εἷς Γωγ ὁ βασιλεύς»; 7–8 ἀδάμας — «адамант»,
# в контексте отвес (下げ振り); 9 «жертвенники смеха».
# Термины: いなご (ἀκρίς), 芋虫/毛虫 (βροῦχος), 主である神 (κύριος ὁ θεός),
# 測り縄/下げ振り (ἀδάμας, στάθμιον), 先見者 (ὁ ὁρῶν), 預言者 (προφήτης).
# Имена: アモス, ヤコブ, イスラエル, ヤロブアム, アマツヤ, ベテル, ユダ,
# ダマスコ, ゴグ.
#
