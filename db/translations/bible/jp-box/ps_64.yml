verses:
  0: "指揮者[しきしゃ]に。ダビデの詩[うた]、歌[うた]。エレミヤとエゼキエルの、移住[いじゅう]についての言葉[ことば]から。彼[かれ]らがそこを出[で]て行[ゆ]こうとしていたとき。"
  1: "神[かみ]よ、シオンであなたに賛美[さんび]をささげるのはふさわしい。エルサレムであなたに誓[ちか]いが果[は]たされる。"
  2: "わたしの祈[いの]りを聞[き]いてください。すべての肉[にく]はあなたのもとに来[く]る。"
  3: "不[ふ]法[ほう]の言葉[ことば]がわたしたちに打[う]ち勝[か]った。あなたはわたしたちの不[ふ]敬[けい]を償[つぐな]ってくださる。"
  4: "幸[さいわ]いなのは、あなたが選[えら]び、近[ちか]づけてくださった人[ひと]である。その人[ひと]はあなたの庭[にわ]に住[す]む。わたしたちはあなたの家[いえ]の善[よ]いもので満[み]ち足[た]りる。あなたの神殿[しんでん]は聖[せい]であり、義[ぎ]において驚[おどろ]くべきである。"
  5: "わたしたちの救[すく]い主[ぬし]である神[かみ]、地[ち]の果[は]てのすべての者[もの]の望[のぞ]み、遠[とお]い海[うみ]の者[もの]の望[のぞ]みよ、わたしたちの声[こえ]を聞[き]いてください。"
  6: "あなたは力[ちから]をもって山[やま]を備[そな]え、権能[けんのう]を帯[お]びておられる。"
  7: "あなたは海[うみ]の深[ふか]みを騒[さわ]がせ、その波[なみ]のとどろきを起[お]こされる。もろもろの民[たみ]は騒[さわ]ぎ立[た]つ。"
  8: "地[ち]の果[は]てに住[す]む者[もの]は、あなたのしるしを恐[おそ]れる。あなたは朝[あさ]と夕[ゆう]べの移[うつ]り変[か]わりに喜[よろこ]びを与[あた]えられる。"
  9: "あなたは地[ち]を顧[かえり]みて水[みず]を注[そそ]ぎ、それを豊[ゆた]かにした。神[かみ]の川[かわ]は水[みず]で満[み]ちる。あなたは人[ひと]の食[た]べ物[もの]を備[そな]えられた。あなたの備[そな]えはこうして整[ととの]うからである。"
  10: "あなたはそのうねを潤[うるお]し、その実[みの]りを多[おお]くし、その滴[しずく]で芽[め]を喜[よろこ]ばせられる。"
  11: "あなたはその恵[めぐ]みの年[とし]の冠[かんむり]を祝福[しゅくふく]し、あなたの野[の]は豊[ゆた]かさで満[み]ちる。"
  12: "荒野[あらの]の牧場[まきば]は草[くさ]に満[み]ち、丘[おか]は喜[よろこ]びをまとう。"
  13: "雄羊[おひつじ]は衣[ころも]をまとい、谷[たに]は穀物[こくもつ]に覆[おお]われる。彼[かれ]らは叫[さけ]び、歌[うた]う。"

notes:
  0: "Εἰς τὸ τέλος· ψαλμὸς τῷ Δαυιδ, ᾠδή· Ιερεμιου καὶ Ιεζεκιηλ ἐκ τοῦ λόγου τῆς παροικίας, ὅτε ἔμελλον ἐκπορεύεσθαι — 指揮者に。ダビデの詩、歌。エレミヤとエゼキエルの、移住についての言葉から。彼らがそこを出て行こうとしていたとき. ᾠδή — 歌; παροικία — «переселение, плен» (в LXX надписание о вавилонском пленении добавлено к имени Давида)."
  1: "Σοὶ πρέπει ὕμνος, ὁ θεός, ἐν Σιων — 神よ、シオンであなたに賛美をささげるのはふさわしい (πρέπει — «подобает»; ὕμνος — 賛美). σοὶ ἀποδοθήσεται εὐχὴ ἐν Ιερουσαλημ — エルサレムであなたに誓いが果たされる (εὐχή — «обет»; ἀποδίδωμι — «воздавать»)."
  2: "εἰσάκουσον προσευχῆς μου — わたしの祈りを聞いてください (εἰσακούω + род.). πρὸς σὲ πᾶσα σὰρξ ἥξει — すべての肉はあなたのもとに来る (σάρξ — 肉, как 55:4; ἥκω — «приходить»)."
  3: "λόγοι ἀνομιῶν ὑπερεδυνάμωσαν ἡμᾶς — 不法の言葉がわたしたちに打ち勝った (ὑπερδυναμόω — «превозмогать»; слав. «словеса беззаконий превзыдоша нас»). τὰς ἀσεβείας ἡμῶν σὺ ἱλάσῃ — わたしたちの不敬を償ってくださる (ἀσέβεια — «нечестие»; ἱλάσκομαι — «умилостивлять, очищать»)."
  4: "μακάριος ὃν ἐξελέξω καὶ προσελάβου — 幸いなのは、あなたが選び、近づけてくださった人 (μακάριος — 幸い, как Пс 1:1; προσλαμβάνω — «принимать к себе»). κατασκηνώσει ἐν ταῖς αὐλαῖς σου — あなたの庭に住む (αὐλή — «двор»). πλησθησόμεθα ἐν τοῖς ἀγαθοῖς τοῦ οἴκου σου — あなたの家の善いもので満ち足りる (ἀγαθά — «блага»). ἅγιος ὁ ναός σου, θαυμαστὸς ἐν δικαιοσύνῃ — 神殿は聖であり、義において驚くべきである (ναός — 神殿, как по корпусу)."
  5: "ὁ θεὸς ὁ σωτὴρ ἡμῶν — わたしたちの救いの神 (σωτήρ — 救い主). ἡ ἐλπὶς πάντων τῶν περάτων τῆς γῆς — 地の果てのすべての者の望み (πέρατα — «пределы»). καὶ ἐν θαλάσσῃ μακράν — 遠い海の者たちの望み (μακράν — «вдали»)."
  6: "ἑτοιμάζων ὄρη ἐν τῇ ἰσχύι αὐτοῦ — 力をもって山を備え (ἑτοιμάζω — «уготовлять»). περιεζωσμένος ἐν δυναστείᾳ — 権能を帯びておられる (περιζώννυμι — «опоясывать»; δυναστεία — «могущество»)."
  7: "ὁ συνταράσσων τὸ κύτος τῆς θαλάσσης — 海の深みを騒がせ (κύτος — «глубина, пучина»). ἤχους κυμάτων αὐτῆς — その波のとどろき (ἦχος — «звук»; κῦμα — «волна»). ταραχθήσονται τὰ ἔθνη — もろもろの民は騒ぎ立つ (ταράσσω — «возмущать»)."
  8: "οἱ κατοικοῦντες τὰ πέρατα ἀπὸ τῶν σημείων σου — 地の果てに住む者は、あなたのしるしを恐れる (σημεῖον — «знамение»). ἐξόδους πρωΐας καὶ ἑσπέρας τέρψεις — 朝と夕べの移り変わりに喜びを与えられる (ἔξοδος — «исход, восход»; τέρπω — «услаждать»)."
  9: "ἐπεσκέψω τὴν γῆν καὶ ἐμέθυσας αὐτήν — 地を顧みて水を注ぎ (ἐπισκέπτομαι — «посещать»; μεθύσκω — «напоять»). ἐπλήθυνας τοῦ πλουτίσαι αὐτήν — それを豊かにした (πλουτίζω — «обогащать»). ὁ ποταμὸς τοῦ θεοῦ ἐπληρώθη ὑδάτων — 神の川は水で満ちる. ἡτοίμασας τὴν τροφὴν αὐτῶν — 人の食べ物を備えられた (τροφή — «пища»). ὅτι οὕτως ἡ ἑτοιμασία σου — あなたの備えはこうして整う (ἑτοιμασία — «уготовление»)."
  10: "τοὺς αὔλακας αὐτῆς μέθυσον — そのうねを潤し (αὖλαξ — «борозда»). πλήθυνον τὰ γενήματα αὐτῆς — その実りを多くし (γένημα — «произведение, урожай»). ἐν ταῖς σταγόσιν αὐτῆς εὐφρανθήσεται ἀνατέλλουσα — その滴で芽を喜ばせられる (σταγών — «капля»; ἀνατέλλω — «прорастать»)."
  11: "εὐλογήσεις τὸν στέφανον τοῦ ἐνιαυτοῦ τῆς χρηστότητός σου — その恵みの年の冠を祝福し (στέφανος — «венец»; χρηστότης — «благость»). τὰ πεδία σου πλησθήσονται πιότητος — あなたの野は豊かさで満ちる (πεδίον — «поле, равнина»; πιότης — «тучность»)."
  12: "πιανθήσονται τὰ ὡραῖα τῆς ἐρήμου — 荒野の牧場は草に満ち (πιαίνω — «утучнять»; ὡραῖα — «красоты», т. е. пастбища). ἀγαλλιάσει οἱ βουνοὶ περιζώσονται — 丘は喜びをまとう (βουνός — «холм»; ἀγαλλίασις — «ликование»)."
  13: "ἐνεδύσαντο οἱ κριοὶ τῶν προβάτων — 羊の群れは草をまとい (κριός — «овен»; ἐνδύω — «одевать»). αἱ κοιλάδες πληθυνοῦσι σῖτον — 谷は穀物に覆われる (κοιλάς — «долина»; σῖτος — «хлеб»). κεκράξονται, καὶ γὰρ ὑμνήσουσιν — 彼らは叫び、歌う (κράζω, ὑμνέω)."
