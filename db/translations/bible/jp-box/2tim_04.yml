# jp-box, 2-е Послание к Тимофею, глава 4. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 4: заклинание пред Богом и Христом (1), проповедуй слово (2),
# время зудящих ушей (3–4), трезвись и соверши служение (5),
# «я уже изливаюсь», доброе исповедание, венец правды (6–8),
# последние распоряжения (9–13), Александр-медник (14–15),
# первая защита и помощь Господа (16–17), славословие (18),
# приветствия и последнее благословение (19–22).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: все слова в базе gr-lxx-byz есть; 4:22 в базе без Ἰησοῦς Χριστός
# и без ἀμήν — не добавлено (проверено: «ιησουσ», «χριστοσ» — НЕТ; «αμην» в 4:22 — НЕТ).
# 4:22 πνεῦμα без ἅγιον → 霊[れい] (не 聖霊): речь о духе Тимофея.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

