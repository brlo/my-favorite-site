verses:
  1: "神[かみ]の前[まえ]、また、生[い]ける者[もの]と死[し]んだ者[もの]とを裁[さば]かれる方[かた]、キリスト・イエスの前[まえ]で、その現[あらわ]れとその王国[おうこく]とによって、わたしはあなたに厳[おごそ]かに命[いの]じる。"
  2: "御言葉[みことば]を宣[の]べ伝[つた]えなさい。時[とき]が良[よ]くても悪[わる]くても、備[そな]えをして、戒[いまし]め、叱[しか]り、勧[すす]めなさい。すべての寛容[かんよう]と教[おし]えとをもって。"
  3: "というのは、人[ひと]々[びと]が健全[けんぜん]な教[おし]えに耐[た]えられなくなる時[とき]が来[く]るからである。その時[とき]、彼[かれ]らは自分[じぶん]の欲[よく]に従[したが]って、耳[みみ]をくすぐる話[はなし]をする教師[きょうし]たちを、自分[じぶん]たちのために寄[よ]せ集[あつ]め、"
  4: "そして、真理[しんり]から耳[みみ]を背[そむ]け、作[つく]り話[ばなし]のほうへと向[む]きを変[か]える。"
  5: "しかし、あなたはすべてのことに目[め]を覚[さ]まし、苦[くる]しみを忍[しの]び、福音[ふくいん]を告[つ]げ知[し]らせる者[もの]の働[はたら]きをし、あなたの務[つと]めを全[まっと]うしなさい。"
  6: "というのは、わたしはすでに注[そそ]ぎの酒[さけ]として注[そそ]がれており、世[よ]を去[さ]る時[とき]が近[ちか]づいているからである。"
  7: "わたしは良[よ]い戦[たたか]いを戦[たたか]い切[き]った。走[はし]るべき道[みち]を走[はし]り終[お]え、信仰[しんこう]を守[まも]り通[とお]した。"
  8: "これからは、義[ぎ]の冠[かんむり]がわたしのために備[そな]えられている。義[ぎ]なる審判者[しんぱんしゃ]である主[しゅ]が、かの日[ひ]に、それをわたしに授[さず]けてくださる。わたしだけにではなく、その現[あらわ]れを愛[あい]して待[ま]ち望[のぞ]んだ者[もの]すべてにも。"
  9: "あなたは、急[いそ]いでわたしのところへ来[き]なさい。"
  10: "というのは、デマスはこの世[よ]を愛[あい]してわたしを捨[す]て、テサロニケへ行[い]ってしまったからである。クレスケンスはガラテヤへ、テトスはダルマティアへ行[い]った。"
  11: "ルカだけがわたしとともにいる。マルコを連[つ]れて来[き]なさい。彼[かれ]は奉仕[ほうし]のためにわたしに役立[やくだ]つからである。"
  12: "わたしはテキコをエフェソへ遣[つか]わした。"
  13: "あなたが来[く]るとき、わたしがトロアスでカルポのところに置[お]いてきた外套[がいとう]を持[も]って来[き]なさい。また、書物[しょもつ]、とくに羊皮紙[ようひし]の書物[しょもつ]も持[も]って来[き]なさい。"
  14: "鍛冶屋[かじや]のアレクサンドロは、わたしにひどい害[がい]を与[あた]えた。主[しゅ]は彼[かれ]の行[おこな]いに応[おう]じて報[むく]いてくださる。"
  15: "あなたも彼[かれ]に気[き]をつけなさい。彼[かれ]はわたしたちの言葉[ことば]に激[はげ]しく逆[さか]らったからである。"
  16: "わたしの最初[さいしょ]の弁明[べんめい]のとき、そばに立[た]ってくれた者[もの]は一人[ひとり]もなく、すべての人[ひと]がわたしを見捨[みす]てた。どうか、このことが彼[かれ]らに負[お]わされませんように。"
  17: "しかし、主[しゅ]はわたしのそばに立[た]って、わたしを強[つよ]めてくださった。それは、わたしによって宣教[せんきょう]が全[まっと]うされ、すべての異邦人[いほうじん]がそれを聞[き]くためである。こうして、わたしは獅子[しし]の口[くち]から救[すく]い出[だ]された。"
  18: "主[しゅ]はわたしをすべての悪[わる]い働[はたら]きから救[すく]い出[だ]し、天[てん]の王国[おうこく]へと救[すく]い入[い]れてくださる。栄光[えいこう]が世[よ]々[よ]限[かぎ]りなく、この方[かた]にありますように。アーメン。"
  19: "プリスキラとアクラ、そしてオネシポロの家[いえ]によろしく伝[つた]えなさい。"
  20: "エラストはコリントに残[のこ]り、トロフィモは病気[びょうき]だったので、わたしは彼[かれ]をミレトに残[のこ]してきた。"
  21: "冬[ふゆ]になる前[まえ]に、急[いそ]いで来[き]なさい。エウブロ、プデス、リノス、クラウディア、そして兄弟[きょうだい]たちすべてが、あなたによろしくと言[い]っている。"
  22: "主[しゅ]があなたの霊[れい]とともにいてくださるように。{恵[めぐ]み|恩寵[おんちょう]}があなたがたとともにありますように。"

notes:
  1: "Διαμαρτύρομαι — 厳かに命じる («заклинаю»). ἐνώπιον τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ — 神の前、また…キリスト・イエスの前で (два свидетеля). τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς — 生ける者と死んだ者とを裁かれる方. καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ — その現れとその王国とによって (винительные при διαμαρτύρομαι, как в греч.)."
  2: "κήρυξον τὸν λόγον — 御言葉を宣べ伝えなさい. ἐπίστηθι εὐκαίρως ἀκαίρως — 時が良くても悪くても、備えをして (ἐφίστημι — «быть наготове, настоять»). ἔλεγξον, ἐπιτίμησον, παρακάλεσον — 戒め、叱り、勧め (три императива сохранены). ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ — すべての寛容と教えとをもって."
  3: "ἔσται γὰρ καιρὸς ὅτε — 時が来るからである. τῆς ὑγιαινούσης διδασκαλίας — 健全な教え (ср. 1:13 健全な言葉). οὐκ ἀνέξονται — 耐えられなくなる. κατὰ τὰς ἰδίας ἐπιθυμίας — 自分の欲に従って. ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους — 自分たちのために教師たちを寄せ集め. κνηθόμενοι τὴν ἀκοήν — 耳をくすぐる話をする (κνήθω — «чесать, зудеть»)."
  4: "ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν — 真理から耳を背け. ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται — 作り話のほうへと向きを変える (μῦθος — не «миф» в учёном смысле, а «выдумка»)."
  5: "σὺ δὲ νῆφε ἐν πᾶσιν — あなたはすべてのことに目を覚まし (νήφω — «трезвиться»). κακοπάθησον — 苦しみを忍び. ἔργον ποίησον εὐαγγελιστοῦ — 福音を告げ知らせる者の働きをし. τὴν διακονίαν σου πληροφόρησον — あなたの務めを全うしなさい (πληροφορέω — «исполнить до полноты»)."
  6: "Ἐγὼ γὰρ ἤδη σπένδομαι — わたしはすでに注ぎの酒として注がれており (σπένδομαι — «приноситься в возлияние», ср. Флп 2:17). ὁ καιρὸς τῆς ἀναλύσεώς μου ἐφέστηκεν — 世を去る時が近づいている (ἀνάλυσις — «отход, снятие шатра»)."
  7: "τὸν καλὸν ἀγῶνα ἠγώνισμαι — 良い戦いを戦い切った (perfect: дело завершено). τὸν δρόμον τετέλεκα — 走るべき道を走り終え. τὴν πίστιν τετήρηκα — 信仰を守り通した (три perfect’а, все сохранены)."
  8: "λοιπὸν ἀπόκειταί μοι — これからは…備えられている. ὁ τῆς δικαιοσύνης στέφανος — 義の冠. ὁ δίκαιος κριτής — 義なる審判者. ἐν ἐκείνῃ τῇ ἡμέρᾳ — かの日に. τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ — その現れを愛して待ち望んだ者すべて (не «возлюбившим», а «полюбившим явление»)."
  9: "Σπούδασον ἐλθεῖν πρός με ταχέως — 急いでわたしのところへ来なさい."
  10: "Δημᾶς — デマス (ср. Кол 4:14; Флм 24). ἀγαπήσας τὸν νῦν αἰῶνα — この世を愛して. ἐγκατέλιπεν — 捨てた. Θεσσαλονίκη — テサロニケ. Κρήσκης — クレスケンス. Γαλατία — ガラテヤ. Τίτος — テトス. Δαλματία — ダルマティア."
  11: "Λουκᾶς ἐστιν μόνος μετ᾿ ἐμοῦ — ルカだけがわたしとともにいる. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ — マルコを連れて来なさい. εὔχρηστος εἰς διακονίαν — 奉仕のために役立つ (ср. 2:21 εὔχρηστον)."
  12: "Τυχικὸν δὲ ἀπέστειλα εἰς Ἔφεσον — わたしはテキコをエフェソへ遣わした (ср. Деян 20:4; Еф 6:21; Кол 4:7)."
  13: "φαιλόνης — 外套 («плащ, пенула»). ἐν Τρῳάδι παρὰ Κάρπῳ — トロアスでカルポのところに. τὰ βιβλία, μάλιστα τὰς μεμβράνας — 書物、とくに羊皮紙の書物 (μεμβράνα — пергамент; μάλιστα — とくに)."
  14: "Ἀλέξανδρος ὁ χαλκεύς — 鍛冶屋のアレクサンドロ (χαλκεύς — «медник»). πολλὰ μοι κακὰ ἐνεδείξατο — わたしにひどい害を与えた. ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ — 主は彼の行いに応じて報いてくださる (Пс 61:13; 2 Тим 4:14 — не пожелание мести, а предание суду Божию)."
  15: "φυλάσσου — 気をつけなさい. λίαν γὰρ ἀντέστη τοῖς ἡμετέροις λόγοις — わたしたちの言葉に激しく逆らった."
  16: "ἐν τῇ πρώτῃ μου ἀπολογίᾳ — わたしの最初の弁明のとき (первая защита в Риме). οὐδεὶς μοι παρεγένετο — そばに立ってくれた者は一人もなく. μὴ αὐτοῖς λογισθείη — どうか、それが彼らに負わされませんように (оптатив pass.; не «да не вменится» буквально, но смысл тот же)."
  17: "ὁ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με — 主はわたしのそばに立って、わたしを強めてくださった. ἵνα δι᾿ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ — わたしによって宣教が全うされ. πάντα τὰ ἔθνη — すべての異邦人. ἐρρύσθην ἐκ στόματος λέοντος — 獅子の口から救い出された (Пс 21:22; образ, не отождествлён)."
  18: "ῥύσεταί με…καὶ σώσει — 救い出し…救い入れてくださる. εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον — 天の王国へ. ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων — 栄光が世々限りなく、この方に. ἀμὴν — アーメン (в базе есть, в отличие от 4:22)."
  19: "Ἄσπασαι — よろしく伝えなさい. Πρίσκαν καὶ Ἀκύλαν — プリスキラとアクラ (вин. Πρίσκαν от Πρίσκα; форма имён как в Деян 18:2; у jp-joc プリスキラ、アキラ). τὸν Ὀνησιφόρου οἶκον — オネシポロの家 (ср. 1:16)."
  20: "Ἔραστος ἔμεινεν ἐν Κορίνθῳ — エラストはコリントに残り (ср. Рим 16:23). Τρόφιμον δὲ ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα — トロフィモは病気だったので、ミレトに残してきた (ср. Деян 20:15; 21:29)."
  21: "πρὸ χειμῶνος — 冬になる前に. Εὔβουλος, Πούδης, Λίνος, Κλαυδία — エウブロ、プデス、リノス、クラウディア (у jp-joc エワゥル、プド、リン、クラウディヤ). οἱ ἀδελφοὶ πάντες — 兄弟たちすべて."
  22: "Ὁ κύριος μετὰ τοῦ πνεύματός σου — 主があなたの霊とともにいてくださるように (πνεῦμα без ἅγιον — 霊). ἡ χάρις μεθ᾿ ὑμῶν — 恵みがあなたがたとともに (единственное число сменяется множественным, как в греч.). В базе нет Ἰησοῦς Χριστός при κύριος и нет ἀμήν (у jp-joc «アミン» добавлен) — не добавлено: проверено «ιησουσ», «χριστοσ», «αμην» в 4:22 — НЕТ."
