# jp-box, Исход, глава 19. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru и jp-joc (1901, PD;
# в гл. 19 у jp-joc есть ст. 10–19). Русский Синодальный — только для понимания.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 19: приход к Синаю (1–2), обетование и «царственное священство» (3–6),
# ответ народа (7–8), облако и освящение (9–15), третий день, гора дымится (16–20),
# запрет приближаться (21–25).
# Красного и синего нет: речь Бога — в 「…」, «<j>» не ставится.
# Вложенная речь (слова, которые Бог велит передать народу) — 『…』.
# 〔…〕 нет: все слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 契約, 祭司, 聖, 角笛 уже в корпусе или понятны.
# jp-ni не использовался.

tr_code: jp-box
book: ish
chapter: 19
draft: true

verses:
  1: "イスラエルの子[こ]らがエジプトの地[ち]を出[で]てから、三[みっ]つ目[め]の月[つき]、その日[ひ]に、彼[かれ]らはシナイの荒[あ]れ野[の]へ来[き]た。"
  2: "彼[かれ]らはレフィディンを発[た]って、シナイの荒[あ]れ野[の]へ来[き]た。イスラエルはそこで、山[やま]に向[む]かい合[あ]って宿営[しゅくえい]した。"
  3: "モーセは神[かみ]の山[やま]に上[のぼ]った。神[かみ]は山[やま]から彼[かれ]を呼[よ]んで言[い]われた。「ヤコブの家[いえ]にこう言[い]い、イスラエルの子[こ]らに告[つ]げなさい。"
  4: "あなたがたは、わたしがエジプト人[じん]たちにしたこと、また、あなたがたを鷲[わし]の翼[つばさ]に載[の]せて、わたしのもとへ連[つ]れて来[き]たことを見[み]た。"
  5: "今[いま]、もしあなたがたがわたしの声[こえ]に聞[き]き従[したが]い、わたしの契約[けいやく]を守[まも]るなら、あなたがたは、すべての民[たみ]の中[なか]から選[えら]ばれた、わたしの宝[たから]の民[たみ]となる。地[ち]はすべてわたしのものだからである。"
  6: "あなたがたはわたしにとって、祭司[さいし]の王国[おうこく]、聖[せい]なる民[たみ]となる。これが、あなたがイスラエルの子[こ]らに語[かた]るべき言葉[ことば]である。」"
  7: "モーセは来[き]て、民[たみ]の長老[ちょうろう]たちを呼[よ]び、神[かみ]が自分[じぶん]に命[めい]じられたこれらの言葉[ことば]をすべて、彼[かれ]らの前[まえ]に置[お]いた。"
  8: "民[たみ]はすべて一[いっ]同[どう]に答[こた]えて言[い]った。「神[かみ]が言[い]われたことはすべて、わたしたちは行[おこな]い、聞[き]き従[したが]う。」モーセは民[たみ]の言葉[ことば]を神[かみ]のもとへ携[たずさ]えて行[い]った。"
  9: "主[しゅ]はモーセに言[い]われた。「見[み]よ、わたしは雲[くも]の柱[はしら]の中[なか]であなたのところへ来[く]る。民[たみ]が、わたしがあなたと語[かた]るのを聞[き]き、いつまでもあなたを信[しん]じるためである。」モーセは民[たみ]の言葉[ことば]を主[しゅ]に告[つ]げた。"
  10: "主[しゅ]はモーセに言[い]われた。「民[たみ]のところへ下[お]りて行[い]き、今日[きょう]と明日[あす]、彼[かれ]らを聖[きよ]め、その衣[ころも]を洗[あら]わせなさい。"
  11: "そして、三日目[みっかめ]に備[そな]えさせなさい。三日目[みっかめ]に、主[しゅ]がすべての民[たみ]の前[まえ]でシナイ山[さん]に下[お]りられるからである。」"
  12: "あなたは民[たみ]のために周[まわ]りに境[さかい]を設[もう]けて言[い]いなさい。『気[き]をつけて、山[やま]に上[のぼ]ってはならない。そのふもとに触[ふ]れてもならない。山[やま]に触[ふ]れる者[もの]は、だれでも必[かなら]ず死[し]ぬ。"
  13: "その者[もの]に手[て]を触[ふ]れてはならない。石[いし]で打[う]ち殺[ころ]すか、矢[や]で射[い]殺[ころ]さなければならない。家畜[かちく]でも人[ひと]でも、生[い]きていることはできない。』声[こえ]と角笛[つのぶえ]と雲[くも]が山[やま]から離[はな]れるとき、彼[かれ]らは山[やま]に上[のぼ]ることができる。"
  14: "モーセは山[やま]から民[たみ]のところへ下[お]り、彼[かれ]らを聖[きよ]めた。彼[かれ]らは衣[ころも]を洗[あら]った。"
  15: "彼[かれ]は民[たみ]に言[い]った。「三日[みっか]の間[あいだ]、備[そな]えをして、女[おんな]に近[ちか]づいてはならない。」"
  16: "三日目[みっかめ]の朝[あさ]、夜明[よあ]けになると、雷[かみなり]の音[おと]と稲妻[いなずま]、そしてシナイ山[さん]の上[うえ]に濃[こ]い雲[くも]があった。角笛[つのぶえ]の音[ね]がひときわ強[つよ]く鳴[な]り響[ひび]き、宿営[しゅくえい]にいる民[たみ]はすべて震[ふる]え上[あ]がった。"
  17: "モーセは民[たみ]を宿営[しゅくえい]から連[つ]れ出[だ]して神[かみ]を迎[むか]えさせ、彼[かれ]らは山[やま]のふもとに立[た]った。"
  18: "シナイ山[さん]は、神[かみ]が火[ひ]の中[なか]でその上[うえ]に下[お]りられたために、山[やま]全体[ぜんたい]が煙[けむり]っていた。その煙[けむり]は炉[ろ]の煙[けむり]のように上[のぼ]り、民[たみ]はすべてひどく恐[おそ]れた。"
  19: "角笛[つのぶえ]の音[ね]は、次第[しだい]に強[つよ]くなっていった。モーセが語[かた]ると、神[かみ]は声[こえ]をもって彼[かれ]に答[こた]えられた。"
  20: "主[しゅ]はシナイ山[さん]に、山[やま]の頂[いただき]に下[お]りられた。主[しゅ]はモーセを山[やま]の頂[いただき]へ呼[よ]ばれ、モーセは上[のぼ]った。"
  21: "神[かみ]はモーセに言[い]われた。「下[お]りて行[い]って、民[たみ]に証[あかし]しなさい。彼[かれ]らが主[しゅ]に近[ちか]づいて見極[みきわ]めようとし、その多[おお]くの者[もの]が倒[たお]れてしまわないように。"
  22: "また、主[しゅ]に近[ちか]づく祭司[さいし]たちも、自分[じぶん]を聖[きよ]めなさい。主[しゅ]が彼[かれ]らを滅[ほろ]ぼされないように。」"
  23: "モーセは神[かみ]に言[い]った。「民[たみ]はシナイ山[さん]に上[のぼ]ることはできません。あなたご自身[じしん]が、『山[やま]の周[まわ]りに境[さかい]を設[もう]け、それを聖[きよ]めよ』と言[い]って、わたしたちに証[あかし]されたからです。」"
  24: "主[しゅ]は彼[かれ]に言[い]われた。「行[い]け。下[お]りて、それからあなたとアロンは上[のぼ]りなさい。祭司[さいし]たちと民[たみ]は、主[しゅ]に上[のぼ]ろうと押[お]し迫[せま]ってはならない。主[しゅ]が彼[かれ]らを滅[ほろ]ぼされないように。」"
  25: "モーセは民[たみ]のところへ下[お]りて、彼[かれ]らに語[かた]った。"

notes:
  1: "μηνὸς τοῦ τρίτου — третьего месяца (по выходе из Египта). τῇ ἡμέρᾳ ταύτῃ — в этот день (в масоретском добавлено «новолуния», отсюда «в самый день новолуния» в Синодальном). ἔρημος τοῦ Σινα — 荒れ野 Синая (Σινα — Синай; в гл. 16 была пустыня Син)."
  2: "ἐξῆραν ἐκ Ραφιδιν — двинулись из Рефидима. παρενέβαλεν ἐκεῖ Ισραηλ κατέναντι τοῦ ὄρους — расположился там станом против горы (κατέναντι — напротив)."
  3: "ἀνέβη εἰς τὸ ὄρος τοῦ θεοῦ — взошёл на гору Божию. ἐκάλεσεν αὐτὸν ὁ θεὸς ἐκ τοῦ ὄρους — воззвал его Бог с горы. Τάδε ἐρεῖς — так скажи. ἀναγγελεῖς — возвестишь."
  4: "ἑωράκατε — вы видели (perfect). ἀνέλαβον ὑμᾶς ὡσεὶ ἐπὶ πτερύγων ἀετῶν — поднял вас как на крыльях орлов (ἀετός — орёл; 鷲). προσηγαγόμην — привёл к Себе (προσάγω)."
  5: "ἀκοῇ ἀκούσητε — «слухом услышите», т. е. послушаетесь (удвоение корня). φυλάξητε τὴν διαθήκην — сохраните завет (διαθήκη — 契約). λαὸς περιούσιος — народ избранный, удельный (περιούσιος; слав. «людие избранни»). ἐμὴ γάρ ἐστιν πᾶσα ἡ γῆ — ибо Моя вся земля."
  6: "βασίλειον ἱεράτευμα — царственное священство (βασίλειον — царский; ἱεράτευμα — священство); передано 祭司の王国, ср. 1 Пет 2:9. ἔθνος ἅγιον — народ святой. ταῦτα τὰ ῥήματα ἐρεῖς — эти слова скажешь."
  7: "ἦλθεν … ἐκάλεσεν τοὺς πρεσβυτέρους — пришёл и созвал старейшин. παρέθηκεν αὐτοῖς — предложил им (παρατίθημι). οὓς συνέταξεν αὐτῷ ὁ θεός — которые заповедал ему Бог (συντάσσω)."
  8: "ἀπεκρίθη … ὁμοθυμαδὸν — отвечал единодушно (ὁμοθυμαδόν). Πάντα, ὅσα εἶπεν ὁ θεός, ποιήσομεν καὶ ἀκουσόμεθα — всё, что сказал Бог, исполним и послушаем (два глагола сохранены; ср. Исх 24:7). ἀνήνεγκεν — донёс (ἀναφέρω)."
  9: "παραγίνομαι πρὸς σὲ ἐν στύλῳ νεφέλης — приду к тебе в столпе облачном (στῦλος — столп; νεφέλη — облако). ἵνα ἀκούσῃ ὁ λαὸς λαλοῦντός μου — чтобы услышал народ, как Я говорю. πιστεύσωσιν εἰς τὸν αἰῶνα — поверят навсегда."
  10: "Καταβὰς διαμάρτυραι — сойдя, засвидетельствуй (διαμαρτύρομαι). ἅγνισον αὐτούς — освяти их (ἁγνίζω). πλυνάτωσαν τὰ ἱμάτια — пусть вымоют одежды (ἱμάτιον)."
  11: "ἕτοιμοι εἰς τὴν ἡμέραν τὴν τρίτην — готовы к третьему дню. καταβήσεται κύριος ἐπὶ τὸ ὄρος τὸ Σινα — сойдёт Господь на гору Синай. ἐναντίον παντὸς τοῦ λαοῦ — пред всем народом."
  12: "ἀφοριεῖς — отделишь, проведёшь черту (ἀφορίζω). Προσέχετε ἑαυτοῖς — берегитесь (προσέχω + дат.). θιγεῖν τι αὐτοῦ — прикоснуться к чему-либо на ней (θιγγάνω). θανάτῳ τελευτήσει — смертью умрёт (удвоение)."
  13: "οὐχ ἅψεται αὐτοῦ χείρ — не прикоснётся к нему рука. λίθοις λιθοβοληθήσεται — камнями будет побит. βολίδι κατατοξευθήσεται — стрелой будет застрелен (βολίς — стрела). ἐάν τε κτῆνος ἐάν τε ἄνθρωπος — скот ли, человек ли. ὅταν αἱ φωναὶ καὶ αἱ σάλπιγγες καὶ ἡ νεφέλη ἀπέλθῃ — когда голоса, и трубы, и облако отойдут (LXX: три подлежащих; jp-joc понимает иначе — «когда труба протрубит долго»)."
  14: "κατέβη … καὶ ἡγίασεν — сошёл и освятил (ἁγιάζω). ἔπλυναν τὰ ἱμάτια — вымыли одежды."
  15: "Γίνεσθε ἕτοιμοι τρεῖς ἡμέρας — будьте готовы три дня (LXX; в 19:11 — «к третьему дню», расхождение внутри главы). μὴ προσέλθητε γυναικί — не приближайтесь к жене."
  16: "γενηθέντος πρὸς ὄρθρον — когда наступил рассвет (ὄρθρος). φωναὶ καὶ ἀστραπαὶ — голоса (раскаты) и молнии (ἀστραπή). νεφέλη γνοφώδης — облако мрачное, густое (γνοφώδης). φωνὴ τῆς σάλπιγγος ἤχει μέγα — голос трубы звучал сильно (ἠχέω). ἐπτοήθη — вострепетал (πτοέω)."
  17: "ἐξήγαγεν … εἰς συνάντησιν τοῦ θεοῦ — вывел навстречу Богу. παρέστησαν ὑπὸ τὸ ὄρος — стали у подошвы горы (ὑπό + вин.)."
  18: "ἐκαπνίζετο ὅλον — вся дымилась (καπνίζω). διὰ τὸ καταβεβηκέναι ἐπ᾿ αὐτὸ τὸν θεὸν ἐν πυρί — потому что сошёл на неё Бог в огне. ὡς καπνὸς καμίνου — как дым печи (κάμινος — печь). ἐξέστη … σφόδρα — ужаснулся чрезвычайно (ἐξίστημι); «гора колебалась» — из масоретского текста, у LXX этого нет."
  19: "προβαίνουσαι ἰσχυρότεραι σφόδρα — становясь всё сильнее. Μωϋσῆς ἐλάλει, ὁ δὲ θεὸς ἀπεκρίνατο αὐτῷ φωνῇ — Моисей говорил, а Бог отвечал ему голосом (оба глагола в имперфекте)."
  20: "κατέβη κύριος ἐπὶ τὴν κορυφὴν τοῦ ὄρους — сошёл Господь на вершину горы. ἐκάλεσεν … καὶ ἀνέβη — воззвал, и взошёл."
  21: "μήποτε ἐγγίσωσιν πρὸς τὸν θεὸν κατανοῆσαι — как бы не приблизились к Богу, чтобы рассмотреть (κατανοέω). πέσωσιν ἐξ αὐτῶν πλῆθος — падёт из них множество."
  22: "οἱ ἱερεῖς οἱ ἐγγίζοντες κυρίῳ τῷ θεῷ — священники, приближающиеся к Господу Богу. ἁγιασθήτωσαν — да освятятся. μήποτε ἀπαλλάξῃ ἀπ᾿ αὐτῶν κύριος — как бы не погубил из них Господь (ἀπαλλάσσω — отнять, истребить)."
  23: "Οὐ δυνήσεται ὁ λαὸς προσαναβῆναι — не сможет народ взойти (προσαναβαίνω). διαμεμαρτύρησαι — Ты засвидетельствовал (perfect). Ἀφόρισαι τὸ ὄρος καὶ ἁγίασαι αὐτό — отдели гору и освяти её."
  24: "Βάδιζε κατάβηθι καὶ ἀνάβηθι — иди, сойди и взойди. μὴ βιαζέσθωσαν ἀναβῆναι — да не порываются взойти (βιάζομαι). μήποτε ἀπολέσῃ ἀπ᾿ αὐτῶν — как бы не погубил из них."
  25: "κατέβη … καὶ εἶπεν αὐτοῖς — сошёл и сказал им (LXX обрывает стих без содержания речи; она начинается в 20:1)."
