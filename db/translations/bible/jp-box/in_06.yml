verses:
  1: "その後[のち]、イエスはガリラヤの湖[みずうみ]、別名[べつめい]ティベリアス湖[こ]の向[む]こう岸[ぎし]へ渡[わた]られた。"
  2: "大[おお]ぜいの群衆[ぐんしゅう]がイエスに従[したが]った。イエスが病[やまい]の人[ひと]たちになさったしるしを見[み]たからである。"
  3: "イエスは山[やま]に登[のぼ]り、弟子[でし]たちとともにそこに座[すわ]られた。"
  4: "過越祭[すぎこしまつり]、すなわちユダヤ人[じん]の祭[まつ]りが近[ちか]づいていた。"
  5: "イエスは目[め]を上[あ]げ、大[おお]ぜいの群衆[ぐんしゅう]がご自身[じしん]のほうへ来[く]るのをご覧[らん]になって、ピリポに言[い]われた。「<j>この人[ひと]たちに食[た]べさせるために、どこからパンを買[か]って来[こ]ようか。</j>」"
  6: "こう言[い]われたのは、彼[かれ]を試[こころ]みるためであった。ご自身[じしん]は、これからなさろうとすることを知[し]っておられたからである。"
  7: "ピリポは答[こた]えた。「銀[ぎん]二百[にひゃく]デナリオン分[ぶん]のパンがあっても、一人[ひとり]に少[すこ]しずつでも行[い]き渡[わた]らないでしょう。」"
  8: "弟子[でし]の一人[ひとり]、シモン・ペトロの兄弟[きょうだい]アンデレが言[い]った。"
  9: "「ここに、大麦[おおむぎ]のパン五[いつ]つと小[ちい]さな魚[さかな]二匹[にひき]を持[も]っている子[こ]どもがいます。しかし、こんなに多[おお]くの人[ひと]たちに、それが何[なん]の役[やく]に立[た]つでしょう。」"
  10: "イエスは言[い]われた。「<j>人々[ひとびと]を座[すわ]らせなさい。</j>」その場所[ばしょ]には草[くさ]が多[おお]くあった。人々[ひとびと]は座[すわ]り、男[おとこ]の数[かず]はおよそ五千人[ごせんにん]であった。"
  11: "イエスはパンをお取[と]りになり、感謝[かんしゃ]して、〔弟子[でし]たちにお渡[わた]しになり、弟子[でし]たちが〕座[すわ]っている人[ひと]たちに分[わ]け与[あた]えられた。魚[さかな]も同[おな]じように、みなが望[のぞ]むだけ与[あた]えられた。"
  12: "人々[ひとびと]が満腹[まんぷく]すると、イエスは弟子[でし]たちに言[い]われた。「<j>余[あま]ったパンくずを集[あつ]めなさい。一[ひと]つも無駄[むだ]にならないように。</j>」"
  13: "そこで彼[かれ]らは集[あつ]めた。人々[ひとびと]が食[た]べて余[あま]らした大麦[おおむぎ]のパン五[いつ]つのパンくずで、籠[かご]十二[じゅうに]個[こ]が一杯[いっぱい]になった。"
  14: "人々[ひとびと]は、イエスがなさったしるしを見[み]て言[い]った。「この方[かた]こそ、世[よ]に来[く]べき預言者[よげんしゃ]だ。」"
  15: "イエスは、人々[ひとびと]が来[き]て自分[じぶん]を捕[と]らえ、王[おう]にしようとしているのを知[し]って、また一人[ひとり]で山[やま]へ退[しりぞ]かれた。"
  16: "日[ひ]が暮[く]れると、弟子[でし]たちは湖[みずうみ]へ下[くだ]り、"
  17: "舟[ふね]に乗[の]って、湖[みずうみ]の向[む]こう岸[ぎし]のカファルナウムへ向[む]かった。すでに暗[くら]くなっていたが、イエスはまだ彼[かれ]らのところへ来[こ]ておられなかった。"
  18: "強[つよ]い風[かぜ]が吹[ふ]いて、湖[みずうみ]は荒[あ]れていた。"
  19: "二十五[にじゅうご]、あるいは三十[さんじゅう]スタディオンほど漕[こ]ぎ進[すす]んだとき、彼[かれ]らは、イエスが湖[みずうみ]の上[うえ]を歩[ある]いて舟[ふね]に近[ちか]づいて来[く]るのを見[み]て、恐[おそ]れた。"
  20: "イエスは言[い]われた。「<j>わたしだ。恐[おそ]れるな。</j>」"
  21: "そこで彼[かれ]らは、イエスを舟[ふね]に迎[むか]えようとした。すると舟[ふね]はすぐに、目指[めざ]していた岸[きし]に着[つ]いた。"
  22: "翌日[よくじつ]、湖[みずうみ]の向[む]こう岸[ぎし]に立[た]っていた群衆[ぐんしゅう]は、そこに舟[ふね]が一[いっ]そうしかなく、イエスは弟子[でし]たちと一緒[いっしょ]に舟[ふね]に乗[の]らず、弟子[でし]たちだけが漕[こ]ぎ出[だ]したことに気[き]づいた。"
  23: "ところが、主[しゅ]が感謝[かんしゃ]してからパンを食[た]べた場所[ばしょ]の近[ちか]くへ、ティベリアスからほかの舟[ふね]が来[き]た。"
  24: "群衆[ぐんしゅう]は、イエスも弟子[でし]たちもそこにいないのを知[し]ると、舟[ふね]に乗[の]ってカファルナウムへ行[い]き、イエスを捜[さが]した。"
  25: "そして、湖[みずうみ]の向[む]こう岸[ぎし]でイエスを見[み]つけると、言[い]った。「ラビ、いつ、ここへ来[こ]られたのですか。」"
  26: "イエスは答[こた]えて言[い]われた。「<j>よくよく言[い]っておく。あなたがたがわたしを捜[さが]し求[もと]めるのは、しるしを見[み]たからではない。パンを食[た]べて腹[はら]を満[み]たしたからである。</j>」"
  27: "「<j>朽[く]ちる食[た]べ物[もの]のためではなく、永遠[えいえん]の命[いのち]に至[いた]る食[た]べ物[もの]のために働[はたら]きなさい。それは人[ひと]の子[こ]があなたがたに与[あた]える。父[ちち]である神[かみ]が、その人[ひと]に印[いん]を押[お]されたからである。</j>」"
  28: "そこで彼[かれ]らは言[い]った。「神[かみ]の業[わざ]を行[おこな]うために、わたしたちは何[なに]をすればよいのですか。」"
  29: "イエスは答[こた]えて言[い]われた。「<j>神[かみ]の業[わざ]とは、神[かみ]がお遣[つか]わしになった方[かた]を、あなたがたが信[しん]じることである。</j>」"
  30: "彼[かれ]らは言[い]った。「それでは、わたしたちが見[み]て信[しん]じるために、どんなしるしを行[おこな]ってくださるのですか。何[なに]をなさるのですか。"
  31: "わたしたちの先祖[せんぞ]は荒[あ]れ野[の]でマンナを食[た]べました。『神[かみ]は天[てん]からパンを与[あた]えて、彼[かれ]らに食[た]べさせた』と書[か]いてあるとおりです。」"
  32: "イエスは言[い]われた。「<j>よくよく言[い]っておく。天[てん]からパンを与[あた]えたのはモーセではない。わたしの父[ちち]が、天[てん]から真[しん]のパンをあなたがたに与[あた]えておられる。</j>」"
  33: "「<j>神[かみ]のパンとは、天[てん]から降[くだ]って世[よ]に命[いのち]を与[あた]える者[もの]のことである。</j>」"
  34: "彼[かれ]らは言[い]った。「主[しゅ]よ、そのパンをいつもわたしたちにお与[あた]えください。」"
  35: "イエスは言[い]われた。「<j>わたしは命[いのち]のパンである。わたしのもとへ来[く]る者[もの]は決[けっ]して飢[う]えず、わたしを信[しん]じる者[もの]は決[けっ]して渇[かわ]かない。</j>」"
  36: "「<j>しかし、わたしはあなたがたに言[い]った。あなたがたはわたしを見[み]たのに、信[しん]じていない。</j>」"
  37: "「<j>父[ちち]がわたしに下[くだ]さる者[もの]は、みなわたしのもとへ来[く]る。わたしのもとへ来[く]る者[もの]を、わたしは決[けっ]して追[お]い出[だ]さない。</j>」"
  38: "「<j>わたしが天[てん]から降[くだ]ったのは、自分[じぶん]の望[のぞ]みを行[おこな]うためではなく、わたしをお遣[つか]わしになった方[かた]の望[のぞ]みを行[おこな]うためである。</j>」"
  39: "「<j>わたしをお遣[つか]わしになった方[かた]の望[のぞ]みは、わたしに下[くだ]さった者[もの]を一人[ひとり]も失[うしな]わず、終[お]わりの日[ひ]にその者[もの]を復活[ふっかつ]させることである。</j>」"
  40: "「<j>わたしをお遣[つか]わしになった方[かた]の望[のぞ]みは、子[こ]を見[み]て信[しん]じる者[もの]がみな、永遠[えいえん]の命[いのち]を持[も]ち、わたしが終[お]わりの日[ひ]にその者[もの]を復活[ふっかつ]させることである。</j>」"
  41: "ユダヤ人[じん]たちは、イエスが『わたしは天[てん]から降[くだ]って来[き]たパンである』と言[い]われたので、イエスについてつぶやいた。"
  42: "「この人[ひと]はヨセフの子[こ]イエスではないか。わたしたちはその父[ちち]も母[はは]も知[し]っている。どうして今[いま]、『わたしは天[てん]から降[くだ]って来[き]た』などと言[い]うのか。」"
  43: "イエスは答[こた]えて言[い]われた。「<j>あなたがたは、互[たが]いにつぶやき合[あ]ってはいけない。</j>」"
  44: "「<j>わたしをお遣[つか]わしになった父[ちち]が引[ひ]き寄[よ]せないかぎり、誰[だれ]もわたしのもとへ来[く]ることはできない。わたしは、その者[もの]を終[お]わりの日[ひ]に復活[ふっかつ]させる。</j>」"
  45: "「<j>預言者[よげんしゃ]たちの書[しょ]に『彼[かれ]らはみな、神[かみ]に教[おし]えられる』と書[か]いてある。父[ちち]から聞[き]いて学[まな]んだ者[もの]は、みなわたしのもとへ来[く]る。</j>」"
  46: "「<j>それは、誰[だれ]かが父[ちち]を見[み]たという意味[いみ]ではない。神[かみ]のもとから出[で]た者[もの]だけが、父[ちち]を見[み]たのである。</j>」"
  47: "「<j>よくよく言[い]っておく。〔わたしを〕信[しん]じる者[もの]は永遠[えいえん]の命[いのち]を持[も]っている。</j>」"
  48: "「<j>わたしは命[いのち]のパンである。</j>」"
  49: "「<j>あなたがたの先祖[せんぞ]は荒[あ]れ野[の]でマンナを食[た]べたが、死[し]んだ。</j>」"
  50: "「<j>これこそ、天[てん]から降[くだ]って来[き]たパンである。これを食[た]べる者[もの]は死[し]なない。</j>」"
  51: "「<j>わたしは、天[てん]から降[くだ]って来[き]た生[い]けるパンである。このパンを食[た]べる者[もの]は永遠[えいえん]に生[い]きる。わたしが与[あた]えるパンは、わたしの肉[にく]である。世[よ]の命[いのち]のために与[あた]えるものである。</j>」"
  52: "ユダヤ人[じん]たちは互[たが]いに論[ろん]じ合[あ]って言[い]った。「この人[ひと]が、どうして自分[じぶん]の肉[にく]をわたしたちに食[た]べさせることができるのか。」"
  53: "イエスは言[い]われた。「<j>よくよく言[い]っておく。人[ひと]の子[こ]の肉[にく]を食[た]べ、その血[ち]を飲[の]まなければ、あなたがたの内[うち]に命[いのち]はない。</j>」"
  54: "「<j>わたしの肉[にく]を食[た]べ、わたしの血[ち]を飲[の]む者[もの]は永遠[えいえん]の命[いのち]を持[も]ち、わたしは終[お]わりの日[ひ]にその者[もの]を復活[ふっかつ]させる。</j>」"
  55: "「<j>わたしの肉[にく]は真[しん]に食[た]べ物[もの]、わたしの血[ち]は真[しん]に飲[の]み物[もの]である。</j>」"
  56: "「<j>わたしの肉[にく]を食[た]べ、わたしの血[ち]を飲[の]む者[もの]は、わたしの内[うち]にとどまり、わたしもその者[もの]の内[うち]にとどまる。</j>」"
  57: "「<j>生[い]ける父[ちち]がわたしをお遣[つか]わしになり、わたしが父[ちち]によって生[い]きているように、わたしを食[た]べる者[もの]も、わたしによって生[い]きる。</j>」"
  58: "「<j>これが、天[てん]から降[くだ]って来[き]たパンである。先祖[せんぞ]たちが食[た]べて死[し]んだ、あのマンナとは違[ちが]う。このパンを食[た]べる者[もの]は永遠[えいえん]に生[い]きる。</j>」"
  59: "これらのことを、イエスはカファルナウムの会堂[かいどう]で教[おし]えながら語[かた]られた。"
  60: "弟子[でし]たちの多[おお]くはこれを聞[き]いて言[い]った。「これはかたい言葉[ことば]だ。誰[だれ]が聞[き]いていられるだろうか。」"
  61: "イエスは、弟子[でし]たちがこれについてつぶやいているのを心[こころ]の内[うち]に知[し]って、言[い]われた。「<j>このことが、あなたがたをつまずかせるか。</j>」"
  62: "「<j>それなら、人[ひと]の子[こ]がもと居[い]たところへ上[のぼ]って行[い]くのを見[み]たら、どうであろうか。</j>」"
  63: "「<j>人[ひと]を生[い]かすのは霊[れい]である。肉[にく]は何[なに]の役[やく]にも立[た]たない。わたしがあなたがたに語[かた]った言葉[ことば]は霊[れい]であり、命[いのち]である。</j>」"
  64: "「<j>しかし、あなたがたの中[なか]には信[しん]じない者[もの]がいる。</j>」イエスは初[はじ]めから、信[しん]じない者[もの]が誰[だれ]か、また、ご自身[じしん]を裏切[うらぎ]る者[もの]が誰[だれ]かを知[し]っておられたからである。"
  65: "そして、言[い]われた。「<j>だから、わたしはあなたがたに、〔わたしの〕父[ちち]から与[あた]えられていなければ、誰[だれ]もわたしのもとへ来[く]ることはできないと言[い]ったのである。</j>」"
  66: "このことから、弟子[でし]たちの多[おお]くが離[はな]れて行[い]き、もはやイエスとともに歩[あゆ]まなかった。"
  67: "そこでイエスは十二人[じゅうににん]に言[い]われた。「<j>あなたがたも、去[さ]って行[い]きたいのか。</j>」"
  68: "シモン・ペトロが答[こた]えた。「主[しゅ]よ、わたしたちは誰[だれ]のもとへ行[い]けばよいのでしょうか。あなたは永遠[えいえん]の命[いのち]の言葉[ことば]を持[も]っておられます。"
  69: "わたしたちは、あなたがキリスト、生[い]ける神[かみ]の子[こ]であることを信[しん]じ、また知[し]っています。」"
  70: "イエスは答[こた]えて言[い]われた。「<j>わたしがあなたがた十二人[じゅうににん]を選[えら]んだのではないか。それなのに、あなたがたの一人[ひとり]は悪魔[あくま]である。</j>」"
  71: "これは、シモンの子[こ]イスカリオテのユダを指[さ]して言[い]われたのである。ユダは十二人[じゅうににん]の一人[ひとり]でありながら、イエスを裏切[うらぎ]ろうとしていた。"

notes:
  1: "θάλασσα τῆς Γαλιλαίας τῆς Τιβεριάδος — ガリラヤの湖、すなわちティベリアス湖. В этой главе θάλασσα передаётся 湖 (как в Мк 1:16)."
  4: "τὸ πάσχα — 過越祭 (сноска при первом упоминании в корпусе, Мф 26:2; здесь не повторяется)."
  7: "διακοσίων δηναρίων — 銀二百デナリオン分. Денарий — дневной заработок; сноска при первом упоминании в корпусе (Мф 18:28)."
  9: "κρίθινοι ἄρτοι — ячменные хлебы; 大麦のパン. ὀψάρια — 小さな魚."
  10: "ἀναπεσεῖν — «возлечь»; 座らせる. πεντακισχίλιοι — 五千人, считаются только мужчины (ἄνδρες)."
  11: "В критической базе διέδωκεν τοῖς ἀνακειμένοις («роздал возлежащим»); церковный текст (Елизаветинская «подаде учеником, ученицы же возлежащым», jp-joc) передаёт через учеников — 〔弟子たちにお渡しになり、弟子たちが〕."
  14: "ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον — 世に来るべき預言者 (ср. Втор 18:15)."
  19: "σταδίους — スタディオン; мера уже пояснена сноской в Мф 14:24, здесь без сноски."
  20: "ἐγώ εἰμι без сказуемого — わたしだ (ср. 4:26; 8:24)."
  23: "В критической базе εὐχαριστήσαντος τοῦ κυρίου под скобками; у jp-joc есть. Оставлено без 〔〕: чтение Церкви здесь совпадает с критическим (в скобках), добавки нет."
  26: "ζητεῖτέ με — 捜している. οὐχ ὅτι εἴδετε σημεῖα — «не потому, что видели знамения»."
  27: "σφραγίζω — 印を押す, знак подлинности и печать Отца; 印を押された."
  31: "Цитата Пс 77:24; μάννα — マンナ, без сноски (известно по Исх 16)."
  35: "ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς — わたしは命のパンである."
  39: "В критической базе [ἐν] τῇ ἐσχάτῃ ἡμέρᾳ — 終わりの日に."
  40: "В критической базе τοῦ πατρός μου («Моего Отца»); церковный текст (Елизаветинская, jp-joc「我を遣はしゝ者」) читает τοῦ πέμψαντός με — お遣わしになった方. Взято церковное без 〔〕: замена, а не добавка."
  42: "Упоминание матери (Марии) — не синее: это слова иудеев, а не Её речь."
  44: "ἑλκύσῃ — «привлечёт»; 引き寄せる."
  47: "В критической базе ὁ πιστεύων без εἰς ἐμέ; церковный текст (Елизаветинская «веруяй в мя», jp-joc「我を信ずる者」) читает ὁ πιστεύων εἰς ἐμέ — 〔わたしを〕, как в Мк 9:42."
  45: "Цитата Ис 54:13; διδακτοὶ θεοῦ — 神に教えられる."
  51: "ἡ σάρξ μού ἐστιν — わたしの肉. С 6:51 речь идёт о плоти буквально, без смягчения."
  53: "φάγητε τὴν σάρκα — 肉を食べ; не сглажено в «причащаться»."
  54: "τρώγων — «жующий», усиливает; 食べる. Стихи 53–56 буквальны."
  55: "ἀληθής βρῶσις / ἀληθής πόσις — 真に食べ物 / 真に飲み物."
  60: "σκληρός — «жёсткий, тяжёлый»; かたい言葉."
  62: "ἀναβαίνοντα ὅπου ἦν τὸ πρότερον — もと居たところへ上って行く."
  63: "τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν — 人を生かすのは霊."
  64: "ᾔδει ἐξ ἀρχῆς — 初めから知っておられた. ὁ παραδώσων αὐτόν — 裏切る者."
  65: "δεδομένον — «дано»; 父から与えられていなければ. В критической базе ἐκ τοῦ πατρός; церковный текст (Елизаветинская «от Отца Моего») читает ἐκ τοῦ πατρός μου — 〔わたしの〕."
  66: "ἀπῆλθον εἰς τὰ ὄπίσω — 離れて行き."
  68: "ῥήματα ζωῆς αἰωνίου — 永遠の命の言葉."
  69: "В критической базе ὁ ἅγιος τοῦ θεοῦ («Святой Божий»); церковное чтение (Елизаветинская «Христос, Сын Бога живаго», jp-joc「ハリストス、活ける神の子」) — キリスト、生ける神の子. Взято церковное без 〔〕: это замена, а не добавка."
  70: "εἷς ἐξ ὑμῶν διάβολός ἐστιν — 一人は悪魔; не сглажено."
  71: "Ἰούδαν Σίμωνος Ἰσκαριώτου — シモンの子イスカリオテのユダ."
