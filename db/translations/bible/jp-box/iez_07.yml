# jp-box, Иезекииль, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 7, 27 стихов, как в csl.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Порядок стихов 3–10: в gr-lxx-byz и в csl он разный (слав. следует делению МТ).
# csl 7:3 = LXX 7:3 + 7:7; csl 7:4 = LXX 7:8; csl 7:5 = LXX 7:9 (+ фраза МТ);
# csl 7:6 = МТ (в LXX нет); csl 7:7 = LXX 7:4; csl 7:8 = LXX 7:5; csl 7:9 = LXX 7:6;
# csl 7:10 = LXX 7:10. Держим слав. границы и порядок, LXX-параллели — в notes.
#
# Глава 7: 1–2 конец на четыре края земли; 3–6 конец тебе, ярость и суд; 7–9 день
# смятения, око не пощадит; 10–11 жезл и надменность; 12–13 время, покупающий
# и продающий; 14–16 труба, война, голод, смерть, уцелевшие на горах; 17–19 руки,
# вретище, серебро и золото; 20–22 разграбление святынь; 23–27 смятение, царь и князь.
# Голоса: 7:1 формула вне кавычек; 7:2–27 — одна речь Господа в 「…」.
# csl-добавления (нет в LXX): 7:5–6, 7:11 (начало и конец), 7:12, 7:13, 7:14,
# 7:16, 7:19, 7:24, 7:27 — в основном тексте без 〔…〕. Слав. «плетение» (7:7, 7:10) —
# тёмное слово (πλοκή, «сплетение, козни»), передано 策謀, отмечено в notes.

