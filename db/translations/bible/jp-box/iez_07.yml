verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、あなたは言[い]え。主[しゅ]はこう言[い]われる。イスラエルの地[ち]よ、終[お]わりが来[き]た。終[お]わりが地[ち]の四方[しほう]に来[き]た。"
  3: "終[お]わりが来[き]た。今[いま]、終[お]わりがあなたに来[き]た。わたしはあなたに怒[いか]りを放[はな]ち、あなたの道[みち]に従[したが]ってあなたに報[むく]い、あなたのすべての忌[い]まわしいものをあなたの上[うえ]に置[お]く。"
  4: "わたしの目[め]はあなたを惜[お]しまず、あわれまない。わたしはあなたの道[みち]をあなたの上[うえ]に置[お]き、あなたの忌[い]まわしいものはあなたのただ中[なか]にある。あなたは、わたしが主[しゅ]であることを知[し]る。"
  5: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。災[わざわ]いが一[ひと]つ。見[み]よ、災[わざわ]いが来[き]る。"
  6: "終[お]わりが来[き]た。終[お]わりが来[き]た。それはあなたに向[む]かって立[た]ち上[あ]がった。見[み]よ、来[き]た。"
  7: "地[ち]に住[す]む者[もの]よ、あなたに策謀[さくぼう]が臨[のぞ]んだ。時[とき]が来[き]て、日[ひ]が近[ちか]づいた。騒[さわ]ぎもなく、産[さん]みの苦[くる]しみもない。"
  8: "今[いま]、わたしは近[ちか]くからあなたに怒[いか]りを注[そそ]ぎ、あなたの上[うえ]で憤[いきどお]りを全[まっと]うし、あなたの道[みち]に従[したが]ってあなたを裁[さば]き、あなたのすべての忌[い]まわしいものをあなたの上[うえ]に置[お]く。"
  9: "わたしの目[め]は惜[お]しまず、あわれまない。わたしはあなたの道[みち]をあなたの上[うえ]に置[お]き、あなたの忌[い]まわしいものはあなたのただ中[なか]にある。あなたは、わたしが主[しゅ]、打[う]つ者[もの]であることを知[し]る。"
  10: "見[み]よ、主[しゅ]の日[ひ]が来[き]る。見[み]よ、終[お]わりが来[き]た。策謀[さくぼう]が現[あらわ]れ、杖[つえ]が花[はな]咲[さ]いた。"
  11: "高[たか]ぶりが芽[め]を出[だ]し、不法[ふほう]な者[もの]の支[ささ]えを砕[くだ]く。騒[さわ]ぎもなく、急[いそ]ぎもない。彼[かれ]らから出[で]たものではなく、彼[かれ]らに美[うつく]しさもない。"
  12: "時[とき]が来[き]た。日[ひ]が近[ちか]づいた。買[か]う者[もの]は喜[よろこ]ぶな。売[う]る者[もの]は嘆[なげ]くな。怒[いか]りが彼[かれ]らのすべての群[む]れの上[うえ]にあるからである。"
  13: "買[か]う者[もの]は売[う]る者[もの]に、もはや戻[もど]らない。まだ生[い]きている者[もの]も、彼[かれ]らのすべての群[む]れについての幻[まぼろし]は戻[もど]らない。人[ひと]は自分[じぶん]の命[いのち]のあるうちに、それを保[たも]つことはできない。"
  14: "角[つの]を吹[ふ]き鳴[な]らし、すべてを裁[さば]け。しかし、戦[いくさ]に出[で]る者[もの]は一人[ひとり]もいない。わたしの怒[いか]りが彼[かれ]らのすべての群[む]れの上[うえ]にあるからである。"
  15: "外[そと]には剣[つるぎ]を伴[ともな]う戦[いくさ]があり、内[うち]には飢[う]えと死[し]がある。野[の]にいる者[もの]は剣[つるぎ]で果[は]て、町[まち]にいる者[もの]は飢[う]えと死[し]が滅[ほろ]ぼす。"
  16: "そのうちの生[い]き残[のこ]った者[もの]たちは、山[やま]の上[うえ]で、悲[かな]しむ鳩[はと]のようになる。わたしはすべての者[もの]を、それぞれその不法[ふほう]のゆえに殺[ころ]す。"
  17: "すべての手[て]は力[ちから]を失[うしな]い、すべての腿[もも]は湿[しめ]りで汚[けが]れる。"
  18: "彼[かれ]らは粗布[あらぬの]を腰[こし]にまとう。恐怖[きょうふ]が彼[かれ]らを覆[おお]う。すべての顔[かお]には恥[はじ]があり、すべての頭[かしら]には禿[はげ]がある。"
  19: "彼[かれ]らの銀[ぎん]は街路[がいろ]に投[な]げ捨[す]てられ、金[きん]は侮[あなど]られる。彼[かれ]らの銀[ぎん]と金[きん]は、主[しゅ]の怒[いか]りの日[ひ]に彼[かれ]らを救[すく]うことができない。彼[かれ]らの魂[たましい]は飽[あ]かず、腹[はら]も満[み]たされない。それは彼[かれ]らの不法[ふほう]の罰[ばつ]となったからである。"
  20: "彼[かれ]らは世[よ]の選[えら]ばれた飾[かざ]りを高[たか]ぶりのために用[もち]い、それらから自分[じぶん]たちの忌[い]まわしいものと憎[にく]むべきものの像[かたち]を作[つく]った。それゆえ、わたしはそれらを彼[かれ]らに汚[けが]れとして与[あた]えた。"
  21: "わたしはそれを異国[いこく]の者[もの]の手[て]に渡[わた]して奪[うば]わせ、地[ち]の滅[ほろ]ぼす者[もの]たちに分捕[ぶんど]り物[もの]として渡[わた]す。彼[かれ]らはそれを汚[けが]す。"
  22: "わたしは彼[かれ]らから顔[かお]を背[そむ]ける。彼[かれ]らはわたしの守[まも]りを汚[けが]し、何[なん]の見張[みは]りもなくそこに入[はい]り、それを汚[けが]す。"
  23: "彼[かれ]らは混乱[こんらん]を生[しょう]じる。地[ち]は血[ち]の裁[さば]きに満[み]ち、都[みやこ]は不法[ふほう]に満[み]ちているからである。"
  24: "わたしは悪[わる]い民[たみ]を連[つ]れて来[き]て、彼[かれ]らの家[いえ]を継[つ]がせる。わたしは彼[かれ]らの力[ちから]の高[たか]ぶりを退[しりぞ]け、彼[かれ]らの聖[せい]なるものは汚[けが]される。"
  25: "宥[なだ]めが来[き]て、平和[へいわ]を求[もと]めるが、それはない。"
  26: "災[わざわ]いの上[うえ]に災[わざわ]いがあり、知[し]らせの上[うえ]に知[し]らせがある。幻[まぼろし]は預言者[よげんしゃ]から失[うしな]われ、律法[りっぽう]は祭司[さいし]から、助言[じょげん]は長老[ちょうろう]たちから失[うしな]われる。"
  27: "王[おう]は泣[な]き、君[きみ]は滅[ほろ]びを身[み]にまとう。地[ち]の民[たみ]の手[て]は弱[よわ]くなる。わたしは彼[かれ]らの道[みち]に従[したが]って彼[かれ]らに行[おこな]い、その裁[さば]きに従って彼[かれ]らに報[むく]いる。彼[かれ]らは、わたしが主[しゅ]であることを知[し]る。」"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»; слав. «И бысть слово Господне ко мне глаголя». Вводная формула вне кавычек; слово Господа идёт с 7:2 до конца главы одной цитатой."
  2: "Καὶ σύ, υἱὲ ἀνθρώπου, εἰπὸν — «и ты, сын человеческий, скажи»; Τάδε λέγει κύριος τῇ γῇ τοῦ Ισραηλ — «так говорит Господь земле Израилевой»: датив в роли обращения, поэтому イスラエルの地よ. Πέρας ἥκει — «конец пришёл» (πέρας — конец, предел); ἐπὶ τὰς τέσσαρας πτέρυγας τῆς γῆς — «на четыре крыла земли», т. е. на четыре края (πτέρυξ — крыло; слав. «на четыри краи земли»), передано 地の四方."
  3: "В LXX 7:3 — только ἥκει τὸ πέρας («пришёл конец»); слав. 7:3 продолжает: «ныне конец тебе, и испущу ярость мою на тя…». Это слав. чтение соединяет LXX 7:3 с LXX 7:7 (νῦν τὸ πέρας πρὸς σέ, καὶ ἀποστελῶ ἐγὼ ἐπὶ σὲ καὶ ἐκδικήσω σε ἐν ταῖς ὁδοῖς σου…), который в модуле стоит отдельным стихом. ἀποστέλλω — посылать, насылать; ἐκδικέω — мстить, воздавать (報いる)."
  4: "Слав. 7:4 = LXX 7:8. οὐ φείσεται ὁ ὀφθαλμός μου ἐπὶ σέ — «не пощадит око Моё тебя» (φείδομαι — щадить); τὴν ὁδόν σου ἐπὶ σὲ δώσω — «путь твой на тебя возложу»; τὰ βδελύγματά σου ἐν μέσῳ σου ἔσται — «мерзости твои будут среди тебя»; ἐπιγνώσῃ διότι ἐγὼ κύριος — «узнаешь, что Я Господь»."
  5: "Слав. 7:5 = LXX 7:9: в LXX этот стих — только διότι τάδε λέγει κύριος («ибо так говорит Господь»), а слав. продолжает «Темже сия глаголет адонаи Господь: зло едино зло, се, идет» («посему так говорит Господь Бог: зло, единственное зло, вот, идёт»). Вторая часть — слав./МТ добавление, в LXX его нет; по паритету внесено в основной текст без 〔…〕 (災いが一つ)."
  6: "Слав. 7:6: «Конец пришел есть, прииде конец, воста на тя, се, прииде» — «пришёл конец, пришёл конец, восстал на тебя, вот, пришёл». В LXX такого стиха нет (LXX 7:6 = слав. 7:9), поэтому весь стих — слав./МТ чтение, внесён без 〔…〕. В модуле gr 7:6 — οὐ φείσεται ὁ ὀφθαλμός μου…"
  7: "Слав. 7:7 = LXX 7:4. ἐπὶ σὲ τὸν κατοικοῦντα τὴν γῆν — «на тебя, живущего на земле» (обращение к жителю); ἥκει ὁ καιρός, ἤγγικεν ἡ ἡμέρα — «пришёл час, приблизился день»; οὐ μετὰ θορύβων οὐδὲ μετὰ ὠδίνων — «не с шумами и не с родовыми болями» (θόρυβος — смятение, шум; ὠδίν — родовая мука). Слав. «прииде плетение на тя» — тёмное слово «плетение» (πλοκή — сплетение, козни), передано 策謀; в LXX на этом месте «пришёл час»."
  8: "Слав. 7:8 = LXX 7:5. νῦν ἐγγύθεν ἐκχεῶ τὴν ὀργήν μου ἐπὶ σέ — «теперь вблизи изолью гнев Мой на тебя» (ἐκχέω — изливать); συντελέσω τὸν θυμόν μου ἐν σοί — «совершу ярость Мою в тебе»; κρινῶ σε ἐν ταῖς ὁδοῖς σου — «буду судить тебя по путям твоим»; δώσω ἐπὶ σὲ πάντα τὰ βδελύγματά σου — «возложу на тебя все мерзости твои»."
  9: "Слав. 7:9 = LXX 7:6. οὐ φείσεται ὁ ὀφθαλμός μου, οὐδὲ μὴ ἐλεήσω — «не пощадит око Моё, и не помилую»; τὰς ὁδούς σου ἐπὶ σὲ δώσω — «пути твои на тебя возложу»; ἐπιγνώσῃ διότι ἐγὼ κύριος ὁ τύπτων — «узнаешь, что Я Господь, поражающий» (τύπτω — ударять, поражать; слав. «бияй»)."
  10: "Слав. 7:10 = LXX 7:10, но порядок иной: слав. начинает «се, день Господень приходит» (ἰδοὺ ἡμέρα κυρίου), затем «се, конец пришел есть» (ἰδοὺ τὸ πέρας ἥκει); в тексте по слав. ἡ ῥάβδος ἤνθηκεν — «жезл расцвёл» (ἀνθέω — цвести); в LXX далее ἡ ὕβρις ἐξανέστηκεν — «надменность восстала», у слав. это перенесено в 7:11 («прозябе укоризна»). Слав. «изыде плетение» — добавление, нет в LXX (см. notes к 7:7); передано 策謀が現れ."
  11: "καὶ συντρίψει στήριγμα ἀνόμου — «и сокрушит опору беззаконника» (στήριγμα — опора, утверждение); οὐ μετὰ θορύβου οὐδὲ μετὰ σπουδῆς — «не с шумом и не с поспешностью» (σπουδή). Слав. добавляет в начале «прозябе укоризна» («взошла укоризна») — это LXX ἡ ὕβρις ἐξανέστηκεν из 7:10 («надменность восстала», отсюда 高ぶりが芽を出し), и в конце «и не от них суть, и несть красы в них» — нет в LXX (МТ); внесено без 〔…〕."
  12: "ἥκει ὁ καιρός — «пришёл час»; слав. «приближися день» — «приблизился день» (LXX ἰδοὺ ἡ ἡμέρα — «вот день»); в тексте по слав. ὁ κτώμενος μὴ χαιρέτω — «приобретающий да не радуется»; ὁ πωλῶν μὴ θρηνείτω — «продающий да не плачет» (θρηνέω — оплакивать). Слав. добавляет «яко гнев на все множество их» («ибо гнев на всё множество их») — нет в LXX (МТ); внесено без 〔…〕 (群れ)."
  13: "ὁ κτώμενος πρὸς τὸν πωλοῦντα οὐκέτι μὴ ἐπιστρέψῃ — «приобретающий к продающему уже не возвратится»; ἄνθρωπος ἐν ὀφθαλμῷ ζωῆς αὐτοῦ οὐ κρατήσει — «человек в виду жизни своей не удержится» (ὀφθαλμός — здесь «вид, присутствие»; κρατέω — держать, укрепляться). Слав. вставляет «и еще в жизни живущему, яко видение на все множество их не возвратится» — нет в LXX (МТ); внесено без 〔…〕 (幻は戻らない, т. е. пророчество о них не отменится; ru «не отменится»)."
  14: "σαλπίσατε ἐν σάλπιγγι καὶ κρίνατε τὰ σύμπαντα — «трубите трубою и судите всё» (σάλπιγξ — труба; τὰ σύμπαντα — всё вместе). Слав. добавляет «и не будет грядущаго на рать, яко гнев мой на все множество их» — нет в LXX (МТ); внесено без 〔…〕."
  15: "ὁ πόλεμος ἐν ῥομφαίᾳ ἔξωθεν — «война с мечом снаружи»; ὁ λιμὸς καὶ ὁ θάνατος ἔσωθεν — «голод и смерть внутри»; ὁ ἐν τῷ πεδίῳ — «кто в поле» (πεδίον — равнина, поле); τοὺς ἐν τῇ πόλει — «кто в городе»; συντελέσει — «истребит»."
  16: "ἀνασωθήσονται οἱ ἀνασῳζόμενοι ἐξ αὐτῶν — «спасутся спасаемые из них»; ἔσονται ἐπὶ τῶν ὀρέων — «будут на горах». Слав. добавляет «яко голубицы скорбяще» («как голуби, скорбя») — нет в LXX (МТ); внесено без 〔…〕. πάντας ἀποκτενῶ, ἕκαστον ἐν ταῖς ἀδικίαις αὐτοῦ — «всех убью, каждого в неправдах его»."
  17: "πᾶσαι χεῖρες ἐκλυθήσονται — «все руки ослабеют» (ἐκλύω — расслаблять); πάντες μηροὶ μολυνθήσονται ὑγρασίᾳ — «все бёдра осквернятся влагой» (μηρός — бедро, 腿; ὑγρασία — влажность: от страха, ср. 7:17 и Иез 21:7)."
  18: "περιζώσονται σάκκους — «опояшутся вретищами» (σάκκος — мешковина, 粗布); καλύψει αὐτοὺς θάμβος — «покроет их ужас» (θάμβος — изумление, оцепенение); αἰσχύνη ἐπ' αὐτούς — «стыд на них»; φαλάκρωμα — «плешь» (знак траура, ср. Ис 3:24; 15:2)."
  19: "ῥιφήσεται ἐν ταῖς πλατείαις — «будет брошено на улицах» (ῥίπτω — бросать; πλατεῖα — широкая улица, 街路); ὑπεροφθήσεται — «будет презрено» (ὑπεροράω — презирать); αἱ ψυχαὶ αὐτῶν οὐ μὴ ἐμπλησθῶσιν — «души их не насытятся»; βάσανος τῶν ἀδικιῶν αὐτῶν ἐγένετο — «стало мучением (казнью) неправд их» (βάσανος — испытание, пытка). Слав. добавляет «сребро их и злато не возможет избавити их в день гнева Господня» — нет в LXX (МТ); внесено без 〔…〕."
  20: "ἐκλεκτὰ κόσμου — «избранное мира» (κόσμος — украшение, наряд; слав. «избранныя утвари»); εἰς ὑπερηφανίαν ἔθεντο αὐτά — «в надменность положили их»; εἰκόνας τῶν βδελυγμάτων αὐτῶν ἐποίησαν ἐξ αὐτῶν — «из них сделали образы мерзостей своих» (εἰκών — образ, 像); εἰς ἀκαθαρσίαν — «в нечистоту». Слав. добавляет «и гнусности» — нет в LXX."
  21: "παραδώσω αὐτὰ εἰς χεῖρας ἀλλοτρίων τοῦ διαρπάσαι — «предам их в руки чужих на разграбление» (ἀλλότριος — чужой; διαρπάζω — расхищать); τοῖς λοιμοῖς τῆς γῆς εἰς σκῦλα — «губителям земли в добычу» (λοιμός — мор, погибель; σκῦλον — добыча); βεβηλώσουσιν — «осквернят» (βεβηλόω)."
  22: "ἀποστρέψω τὸ πρόσωπόν μου ἀπ' αὐτῶν — «отвращу лицо Моё от них»; μιανοῦσιν τὴν ἐπισκοπήν μου — «осквернят посещение (попечение) Моё» (ἐπισκοπή — посещение, надзор; слав. «стражбу мою» — 守り); εἰσελεύσονται εἰς αὐτὰ ἀφυλάκτως — «войдут в них без охраны» (ἀφυλάκτως — неохраняемо)."
  23: "ποιήσουσι φυρμόν — «сделают смятение» (φυρμός — смешение, смута); ἡ γῆ πλήρης λαῶν — «земля полна народов» (λαός — народ); слав. «полна суда крове» («полна суда крови») следует МТ (מִשְׁפַּט דָּמִים); в тексте по слав., вариант LXX отмечен. ἡ πόλις πλήρης ἀνομίας — «город полон беззакония»."
  24: "ἀποστρέψω τὸ φρύαγμα τῆς ἰσχύος αὐτῶν — «отвращу (сломлю) надменность силы их» (φρύαγμα — кичливость, наглость); μιανθήσεται τὰ ἅγια αὐτῶν — «осквернятся святыни их». Слав. перед этим добавляет «И приведу злыя языки, и наследят домы их» — нет в LXX (МТ); внесено без 〔…〕."
  25: "ἐξιλασμός — «умилостивление» (слав. «моление», отсюда 宥め); ἥξει καὶ ζητήσει εἰρήνην, καὶ οὐκ ἔσται — «придёт и будет искать мира, и не будет». ru (МТ) «Идет пагуба» — иное чтение, в текст не внесено."
  26: "οὐαὶ ἐπὶ οὐαὶ ἔσται — «горе на горе будет» (οὐαί — горе, 災い); ἀγγελία ἐπ' ἀγγελίαν — «весть на весть» (ἀγγελία); ζητηθήσεται ὅρασις ἐκ προφήτου — «будет взыскано видение от пророка»; слав. «и не будет видение от пророка» (отрицание, вероятно, порча); в тексте по слав., LXX отмечен. νόμος ἀπολεῖται ἐξ ἱερέως — «закон погибнет от священника», т. е. у священника не станет закона; βουλὴ ἐκ πρεσβυτέρων — «совет от старцев»."
  27: "ἄρχων ἐνδύσεται ἀφανισμόν — «правитель облечётся в уничтожение» (ἐνδύω — одеваться; ἀφανισμός — истребление); αἱ χεῖρες τοῦ λαοῦ τῆς γῆς παραλυθήσονται — «руки народа земли расслабнут» (παραλύω); κατὰ τὰς ὁδοὺς αὐτῶν ποιήσω αὐτοῖς — «по путям их сделаю им»; ἐν τοῖς κρίμασιν αὐτῶν ἐκδικήσω αὐτούς — «по судам их отмщу им»; καὶ γνώσονται ὅτι ἐγὼ κύριος — «узнают, что Я Господь». Слав. добавляет «Царь восплачется» — нет в LXX (МТ); внесено без 〔…〕."
