# jp-box, Михей, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 2 (совпадает, 13 стихов).
# Карта книги: гл. 2 совпадает с gr стих в стих; гл. 4 — gr 4:1–13; гл. 5 — слав. 5:1 =
# gr 4:14, слав. 5:N = gr 5:(N−1); гл. 6–7 совпадают (см. шапки гл. 4 и 5).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 замышляющие зло на ложах, захват полей и домов; 3 слово Господа:
# «замышляю на род этот злое», шеи не поднять; 4 притча и плач: «удел народа моего
# отдан», поля разделены; 5 «не будет бросающего вервь в жребий»; 6–7 возражение:
# «не плачьте», «разве умалился Дух Господень», слова Его добры; 8–11 обвинение:
# народ стал врагом, вожди отвергнуты, «встань и иди, здесь не покой»,
# «дух поставил ложь»; 12–13 обетование: собрать Иакова, остаток как стадо,
# пролом и выход, царь впереди, Господь вождь.
# Голоса: 3–5 — слово Господа в 「…」 (в 4 плач народа — 『…』); 6–7 — возражение
# противников (речь пророков/народа) в 「…」, в 7 в кавычках второго уровня стоит
# самое имя «дом Иаковль»; 8–11 — слово Господа в 「…」; 12–13 — обетование Господа
# в 「…」. Вводных формул «так говорит Господь» снаружи кавычек нет: в 3 они внутри
# речи, как в 2:3.
#
tr_code: jp-box
book: mih
chapter: 2
draft: true

verses:
  1: "災[わざわ]いを企[たくら]み、寝床[ねどこ]の上[うえ]で悪[わる]を働[はたら]く者[もの]たちは、こうなった。彼らは日[ひ]の出[で]とともにそれを成[な]し遂[と]げる。神[かみ]に向[む]けて手[て]を上[あ]げないからである。"
  2: "彼らは畑[はたけ]を欲[ほ]しがって奪[うば]い、孤児[こじ]をかすめ取り、家[いえ]を力[ちから]ずくで奪[うば]い、人[ひと]とその家[いえ]、人[ひと]とその嗣業[しぎょう]を奪[うば]う。"
  3: "それゆえ、主[しゅ]はこう言[い]われる。「見[み]よ、わたしはこの部族[ぶぞく]に災[わざわ]いを企[たくら]む。あなたがたはそこから首[くび]を上[あ]げることもできず、にわかにまっすぐに歩[ある]くこともできない。災[わざわ]いの時[とき]だからである。"
  4: "その日[ひ]、あなたがたについてことわざが唱[とな]えられ、悲[かな]しみの歌[うた]をもって歌[うた]われる。『わたしたちはひどく荒[あ]らされた。わたしの民[たみ]の分[ぶん]は縄[なわ]で測[はか]られて他人[たにん]に渡[わた]った。だれもそれを返[かえ]してくれない。わたしたちの畑[はたけ]は分[わ]け取[と]られた』と。"
  5: "それゆえ、主[しゅ]の集[つど]いのうちで、あなたに縄[なわ]を投[な]げてくじを分[わ]ける者[もの]はいなくなる。」"
  6: "「涙[なみだ]を流[なが]して泣[な]くな。これらのことについて泣[な]かせてもならない。嘲[あざけ]りは退[しりぞ]けられないからである。"
  7: "『ヤコブの家[いえ]』と言[い]う者[もの]よ。主[しゅ]の霊[れい]は怒[いか]りを起[お]こされたのか。これが主[しゅ]のなさり方[かた]なのか。主[しゅ]の言葉[ことば]は、主[しゅ]とともに歩[ある]く者[もの]にとって良[よ]いものとなり、その歩[ある]みは正[ただ]しくないのか。」"
  8: "「しかし、先[さき]にはわたしの民[たみ]が敵[てき]となって立[た]ち向[む]かった。彼らは平和[へいわ]に暮[く]らす者[もの]の皮[かわ]をはぎ取[と]り、戦[たたか]いの破[やぶ]れを望[のぞ]みとした。"
  9: "それゆえ、わたしの民[たみ]の指導者[しどうしゃ]たちは、その楽[たの]しみの家[いえ]から追[お]い出[だ]される。彼らはその悪[わる]い行[おこな]いのゆえに追[お]い払[はら]われる。あなたがたは永遠[えいえん]の山[やま]々[やま]に近[ちか]づけ。"
  10: "立[た]って行[い]け。ここはあなたの休[やす]みの場所[ばしょ]ではない。汚[けが]れのゆえである。あなたがたは滅[ほろ]びによって滅[ほろ]ぼされる。"
  11: "だれも追[お]わないのに、あなたがたは追[お]い払[はら]われた。偽[いつわ]りを立[た]てる霊[れい]が、あなたにぶどう酒[しゅ]と酔[よ]い酒[ざけ]をしたたらせた。この民[たみ]のしずくから、そのことが起[お]こる。」"
  12: "「ヤコブよ、わたしはあなたを必[かなら]ずすべて集[あつ]める。わたしはイスラエルの残[のこ]りの者[もの]たちを必ず受[う]け入[い]れる。わたしは彼らの帰[き]還[かん]を一[ひと]つにまとめ、苦[くる]しみの中[なか]の羊[ひつじ]、その寝床[ねどこ]の真[ま]ん中[なか]の群[む]れのようにする。彼らは人[ひと]々[びと]の間[あいだ]から湧[わ]き出[で]る。"
  13: "彼らの前[まえ]に道[みち]を切[き]り開[ひら]く者[もの]が上[のぼ]って行[い]く。彼らは門[もん]を打[う]ち破[やぶ]って進[すす]み、そこを通[とお]って出[で]て行[い]く。彼らの王[おう]は彼らの前[まえ]に進[すす]み、主[しゅ]が彼らの先[さき]に立[た]たれる。」"

notes:
  1: "Ἐγένοντο λογιζόμενοι κόπους — «стали замышляющие труды (беды)»: в LXX нет «горе» (הוֹי) начала стиха, поэтому стих начинается с «こうなった» (слав. «быша помышляюще труды»); ἐργαζόμενοι κακὰ ἐν ταῖς κοίταις αὐτῶν — «делающие злое на ложах своих»; ἅμα τῇ ἡμέρᾳ συνετέλουν αὐτά — «вместе с днём (с рассветом) совершали это»; οὐκ ἦραν πρὸς τὸν θεὸν τὰς χεῖρας αὐτῶν — «не подняли к Богу рук своих»."
  2: "ἐπεθύμουν ἀγροὺς καὶ διήρπαζον ὀρφανούς — «желали полей и расхищали сирот» (ὀρφανός — сирота; слав. «грабляху сирот» — так в LXX, хотя по смыслу МТ «захватывали»; в тексте по LXX); οἴκους κατεδυνάστευον — «домами овладевали силою» (καταδυναστεύω — угнетать, брать силой); διήρπαζον ἄνδρα καὶ τὸν οἶκον αὐτοῦ — «расхищали мужа и дом его»; ἄνδρα καὶ τὴν κληρονομίαν αὐτοῦ — «мужа и наследие его»."
  3: "Ἰδοὺ ἐγὼ λογίζομαι ἐπὶ τὴν φυλὴν ταύτην κακά — «вот, Я замышляю на род этот злое» (φυλή — племя, род; 部族); ἐξ ὧν οὐ μὴ ἄρητε τοὺς τραχήλους ὑμῶν — «из чего не поднимете шеи вашей» (τράχηλος — шея; αἴρω — поднимать); οὐ μὴ πορευθῆτε ὀρθοὶ ἐξαίφνης — «не пойдёте прямо внезапно» (ὀρθός — прямой; ἐξαίφνης — вдруг); καιρὸς πονηρός ἐστιν — «время злое»."
  4: "λημφθήσεται ἐφ᾽ ὑμᾶς παραβολή — «будет принята на вас притча» (παραβολή — притча, поговорка); θρηνηθήσεται θρῆνος ἐν μέλει — «будет оплакан плач в песни» (μέλος — песнь, напев); Ταλαιπωρίᾳ ἐταλαιπωρήσαμεν — «бедствием пострадали мы» (ταλαιπωρία — бедствие; слав. «бедство пострадахом»); μερὶς λαοῦ μου κατεμετρήθη ἐν σχοινίῳ — «часть народа моего измерена вервью» (σχοινίον — вервь, шнур); οὐκ ἦν ὁ κωλύσων αὐτὸν τοῦ ἀποστρέψαι — «не было препятствующего ему возвратить»; οἱ ἀγροὶ ἡμῶν διεμερίσθησαν — «поля наши разделены» (слав. «села ваша разделена быша» — с «ваша»; по смыслу плача держим LXX «наши», слав. отмечено)."
  5: "οὐκ ἔσται σοι βάλλων σχοινίον ἐν κλήρῳ — «не будет у тебя бросающего вервь в жребий» (т. е. наделяющего землёй); ἐν ἐκκλησίᾳ κυρίου — «в собрании Господнем» (ἐκκλησία — собрание; 集会 по корпусу)."
  6: "μὴ κλαίετε δάκρυσιν — «не плачьте слезами»: так LXX передал евр. «не пророчествуйте» (ср. ru); в тексте по LXX/слав. («не плачитеся слезами»), расхождение отмечено; μηδὲ δακρυέτωσαν ἐπὶ τούτοις — «и да не плачут об этом»; οὐ γὰρ ἀπώσεται ὀνείδη — «ибо не отринет поношений» (ὄνειδος — поношение, позор; слав. «не отвержет бо укоризны»): подлежащее в греческом не названо, в тексте без добавления — 「嘲りは退けられない」; тёмное место, сохранено."
  7: "ὁ λέγων Οἶκος Ιακωβ — «говорящий: дом Иаковль» (обращение к тому, кто так говорит; слав. «глаголяй: дом иаковль»); παρώργισεν πνεῦμα κυρίου — «разгневал ли Дух Господень?» (παροργίζω — раздражать, гневить); εἰ ταῦτα τὰ ἐπιτηδεύματα αὐτοῦ ἐστιν — «таковы ли дела (начинания) Его?» (ἐπιτήδευμα — занятие, дело); οὐχ οἱ λόγοι αὐτοῦ εἰσιν καλοὶ μετ᾽ αὐτοῦ — «не слова ли Его добры с ним»; καὶ ὀρθοὶ πεπόρευνται — «и прямо (правым шагом) ходили» — синтаксис тёмный, сохранён."
  8: "ἔμπροσθεν ὁ λαός μου εἰς ἔχθραν ἀντέστη — «прежде народ Мой восстал во вражду» (ἔμπροσθεν — прежде); κατέναντι τῆς εἰρήνης αὐτοῦ — «против мира его»; τὴν δορὰν αὐτοῦ ἐξέδειραν — «кожу его содрали» (δέρω — сдирать кожу; δορά — кожа, шкура); τοῦ ἀφελέσθαι ἐλπίδα — «чтобы отнять надежду» (ἀφαιρέω — отнимать); συντριμμὸν πολέμου — «сокрушение войны» (слав. «сокрушение ратное») — тёмное место, сохранено буквально."
  9: "ἡγούμενοι λαοῦ μου ἀπορριφήσονται — «вожди (начальствующие) народа Моего будут отвергнуты» (в ru/МТ здесь «женщины народа Моего», LXX читает «вожди»; слав. «старейшины» — в тексте по LXX); ἐκ τῶν οἰκιῶν τρυφῆς αὐτῶν — «из домов наслаждения их» (τρυφή — роскошь, нега); διὰ τὰ πονηρὰ ἐπιτηδεύματα αὐτῶν ἐξώσθησαν — «за злые дела их изгнаны»; ἐγγίσατε ὄρεσιν αἰωνίοις — «приблизьтесь к горам вечным» (слав. «приближитеся горам вечным») — повелительное без ясного смысла, сохранено."
  10: "ἀνάστηθι καὶ πορεύου — «встань и иди»; οὐκ ἔστιν σοι αὕτη ἡ ἀνάπαυσις — «не это твой покой» (ἀνάπαυσις — покой, место отдыха); ἕνεκεν ἀκαθαρσίας — «из-за нечистоты»; διεφθάρητε φθορᾷ — «вы растлились тлением» (φθορά — тление, гибель; слав. «истлесте тлением»)."
  11: "κατεδιώχθητε οὐδενὸς διώκοντος — «вы были гонимы, хотя никто не гнал» (слав. «прогнастеся ни кимже гоними»); πνεῦμα ἔστησεν ψεῦδος — «дух поставил ложь» (ἵστημι — ставить); ἐστάλαξέν σοι εἰς οἶνον καὶ μέθυσμα — «искапал тебе в вино и пиянство» (σταλάζω — капать; μέθυσμα — пьянящий напиток; слав. «искапа тебе в вино и пиянство»); καὶ ἔσται ἐκ τῆς σταγόνος τοῦ λαοῦ τούτου — «и будет из капли народа этого»: в LXX клауза оборвана (продолжение иное, чем в МТ), в тексте 「そのことが起こる」, буквальность оговорена здесь."
  12: "συναγόμενος συναχθήσεται Ιακωβ σὺν πᾶσιν — «собираясь, соберётся Иаков со всеми» (усилительный оборот с причастием); ἐκδεχόμενος ἐκδέξομαι τοὺς καταλοίπους τοῦ Ισραηλ — «принимая, приму остатки Израиля» (ἐκδέχομαι — принимать, ждать; слав. «приемяй прииму оставших израилевых»); ἐπὶ τὸ αὐτὸ θήσομαι τὴν ἀποστροφὴν αὐτῶν — «вместе положу возвращение их» (ἀποστροφή — возвращение); ὡς πρόβατα ἐν θλίψει — «как овец в скорби»; ὡς ποίμνιον ἐν μέσῳ κοίτης αὐτῶν — «как стадо среди ложа их» (κοίτη — ложе; здесь загон); ἐξαλοῦνται ἐξ ἀνθρώπων — «выскочат (хлынут) от людей» (ἐξάλλομαι — выпрыгивать; слав. «изскочат от человек»)."
  13: "διὰ τῆς διακοπῆς πρὸ προσώπου αὐτῶν διέκοψαν — «через пролом перед лицом их пробились» (διακοπή — пролом, просека; διακόπτω — пробивать; слав. «просечением»); διῆλθον πύλην καὶ ἐξῆλθον δι᾽ αὐτῆς — «прошли ворота и вышли через них»; ἐξῆλθεν ὁ βασιλεὺς αὐτῶν πρὸ προσώπου αὐτῶν — «вышел царь их пред лицом их»; ὁ δὲ κύριος ἡγήσεται αὐτῶν — «Господь же будет вождём их» (слав. «Господь же вождь их будет»)."
