# jp-box, Михей, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 3 (совпадает, 12 стихов).
# Карта книги: гл. 3 совпадает с gr стих в стих; гл. 4 — gr 4:1–13; гл. 5 — слав. 5:1 =
# gr 4:14, слав. 5:N = gr 5:(N−1); гл. 6–7 совпадают (см. шапки гл. 4 и 5).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1 обвинение властям: «не вам ли знать суд»; 2–3 они сдирают кожу
# и едят плоть народа; 4 тогда возопиют — не будут услышаны; 5–7 пророки,
# проповедующие мир за кусок, ночь вместо видения, тьма вместо гадания;
# 8 пророк исполнен силы Духа; 9–12 главы строят Сион кровью, судят за дары,
# священники учат за плату, пророки гадают за серебро, «не Господь ли среди нас»;
# за это Сион будет вспахан, Иерусалим — грудой, гора дома — лесистым холмом.
# Голоса: 1 — вводка «и скажет» вне кавычек (подлежащее не названо), затем слово
# Господа в 「…」 до конца 4; 5–7 — формула «так говорит Господь» вне кавычек,
# слово Господа в 「…」 (в 5 «мир» — 『…』); 8–12 — речь пророка в 「…»
# (в 11 слова вождей — 『…』).
# 御顔[おんかお] — только о лице Бога (4:10 隠される), ср. 3:4.
#
tr_code: jp-box
book: mih
chapter: 3
draft: true

verses:
  1: "そして、こう言[い]われる。「ヤコブの家[いえ]の支配者[しはいしゃ]たち、イスラエルの家[いえ]の残[のこ]りの者[もの]たちよ、これを聞[き]け。裁[さば]きを知[し]ることは、あなたがたの務[つと]めではないのか。"
  2: "あなたがたは良[よ]いことを憎[にく]み、悪[わる]いことを求[もと]め、民[たみ]からその皮[かわ]を、その骨[ほね]から肉[にく]をはぎ取[と]っている。"
  3: "あなたがたはわたしの民[たみ]の肉[にく]を食[く]らい、その皮[かわ]をはぎ、その骨[ほね]を砕[くだ]き、鍋[なべ]に入[い]れる肉[にく]、釜[かま]に入[い]れる肉のように切[き]り分[わ]ける。"
  4: "そのとき、彼らは主[しゅ]に呼[よ]ばわるが、主[しゅ]は彼らに答[こた]えられない。主[しゅ]はそのとき、彼らから御顔[おんかお]を隠[かく]される。彼らがその行[おこな]いにおいて悪[わる]を働[はたら]いたからである。」"
  5: "主[しゅ]は、わたしの民[たみ]を迷[まよ]わせる預言者[よげんしゃ]たちについてこう言[い]われる。「彼らは歯[は]でかみつき、『平和[へいわ]だ』と宣[の]べ伝[つた]える。しかし、その口[くち]に何[なに]かが入[はい]らないと、その者[もの]に向[む]かって戦[たたか]いを仕掛[しか]ける。"
  6: "それゆえ、あなたがたには幻[まぼろし]の代[かわ]わりに夜[よる]が、占[うらな]いの代[かわ]りにやみが来[く]る。日[ひ]は預言者[よげんしゃ]たちの上[うえ]に沈[しず]み、彼らの上[うえ]で昼[ひる]が暗[くら]くなる。"
  7: "夢[ゆめ]を見[み]る者[もの]たちは恥[は]じ、占[うらな]い師[し]たちは笑[わら]い者[もの]とされ、彼らはみな、その者[もの]たちを非難[ひなん]する。聞[き]く者[もの]がないからである。」"
  8: "「しかし、わたしが主[しゅ]の霊[れい]と裁[さば]きと力[ちから]によって力を満[み]たされるのは、ヤコブにその不敬[ふけい]を、イスラエルにその罪[つみ]を告[つ]げ知[し]らせるためである。"
  9: "ヤコブの家[いえ]の頭[かしら]たち、イスラエルの家[いえ]の残[のこ]りの者[もの]たちよ、これを聞[き]け。あなたがたは裁[さば]きを忌[い]み嫌[きら]い、すべてもろもろの正[ただ]しいことを曲[ま]げる。"
  10: "あなたがたは血[ち]をもってシオンを、不[ふ]正[せい]をもってエルサレムを建[た]てている。"
  11: "その頭[かしら]たちは贈[おくり]物[もの]を取[と]って裁[さば]き、その祭司[さいし]たちは報酬[ほうしゅう]を取[と]って答[こた]え、その預言者[よげんしゃ]たちは銀[ぎん]を取[と]って占[うらな]い、しかも主[しゅ]により頼[たよ]んで言[い]う。『主[しゅ]はわたしたちのうちにいるではないか。災[わざわ]いはわたしたちに及[およ]ばない』と。"
  12: "それゆえ、あなたがたのゆえに、シオンは畑[はたけ]のように耕[たがや]され、エルサレムは果[か]物[もの]の倉[くら]となり、この家[いえ]の山[やま]は森[もり]の丘[おか]となる。」"

notes:
  1: "Καὶ ἐρεῖ — «и скажет» (слав. «И речет»): подлежащее не названо (Господь или пророк), в тексте без добавления, «こう言われる»; Ἀκούσατε δὴ ταῦτα — «услышьте же это»; αἱ ἀρχαὶ οἴκου Ιακωβ — «начальники (власти) дома Иакова» (ἀρχή — начало, власть; слав. «власти дому иаковля»); οἱ κατάλοιποι οἴκου Ισραηλ — «остальные дома Израилева»; οὐχ ὑμῖν ἐστιν τοῦ γνῶναι τὸ κρίμα — «не вам ли знать суд?»."
  2: "οἱ μισοῦντες τὰ καλὰ καὶ ζητοῦντες τὰ πονηρά — «ненавидящие доброе и ищущие злое»; ἁρπάζοντες τὰ δέρματα αὐτῶν ἀπ᾽ αὐτῶν — «срывающие кожи их с них» (δέρμα — кожа; ἁρπάζω — хватать, срывать); τὰς σάρκας αὐτῶν ἀπὸ τῶν ὀστέων αὐτῶν — «плоти их от костей их»."
  3: "ὃν τρόπον κατέφαγον τὰς σάρκας τοῦ λαοῦ μου — «как съели плоть народа Моего» (κατεσθίω — поедать); τὰ δέρματα αὐτῶν ἀπὸ τῶν ὀστέων αὐτῶν ἐξέδειραν — «кожи их с костей их содрали»; τὰ ὀστέα αὐτῶν συνέθλασαν — «кости их сокрушили» (συνθλάω — раздроблять); ἐμέλισαν ὡς σάρκας εἰς λέβητα — «разрубили, как мясо в котёл» (μελίζω — рассекать на части; λέβης — котёл); ὡς κρέα εἰς χύτραν — «как мясо в горшок»."
  4: "οὕτως κεκράξονται πρὸς κύριον — «так возопиют ко Господу»; οὐκ εἰσακούσεται αὐτῶν — «не услышит их»; ἀποστρέψει τὸ πρόσωπον αὐτοῦ ἀπ᾽ αὐτῶν — «отвратит лицо Своё от них»; ἀνθ᾽ ὧν ἐπονηρεύσαντο ἐν τοῖς ἐπιτηδεύμασιν αὐτῶν ἐπ᾽ αὐτούς — «за то, что злодействовали в делах своих против них»."
  5: "τάδε λέγει κύριος ἐπὶ τοὺς προφήτας — «так говорит Господь на (против) пророков» (ἐπί + acc. — против); τοὺς πλανῶντας τὸν λαόν μου — «вводящих в заблуждение народ Мой» (слав. «льстящыя людий моих» — «льстящих», иное понимание; в тексте по LXX); τοὺς δάκνοντας ἐν τοῖς ὀδοῦσιν αὐτῶν — «кусающих зубами своими» (δάκνω — кусать); κηρύσσοντας ἐπ᾽ αὐτὸν εἰρήνην — «проповедующих о нём мир» — тёмное место, в тексте «平和だと宣べ伝える»; καὶ οὐκ ἐδόθη εἰς τὸ στόμα αὐτῶν — «и не дано в уста их»; ἤγειραν ἐπ᾽ αὐτὸν πόλεμον — «подняли на него войну» (ἐγείρω — поднимать)."
  6: "νὺξ ὑμῖν ἔσται ἐξ ὁράσεως — «ночь будет вам вместо видения» (ὅρασις — видение; ἐκ — вместо, от); σκοτία ὑμῖν ἔσται ἐκ μαντείας — «тьма будет вам вместо гадания» (μαντεία — прорицание; слав. «от волхвования»); δύσεται ὁ ἥλιος ἐπὶ τοὺς προφήτας — «зайдёт солнце над пророками» (δύω — заходить); συσκοτάσει ἐπ᾽ αὐτοὺς ἡ ἡμέρα — «потемнеет над ними день»."
  7: "καταισχυνθήσονται οἱ ὁρῶντες τὰ ἐνύπνια — «устыдятся видящие сны» (ἐνύπνιον — сновидение); καταγελασθήσονται οἱ μάντεις — «будут осмеяны прорицатели»; καταλαλήσουσιν κατ᾽ αὐτῶν πάντες αὐτοί — «будут говорить против них все они» (καταλαλέω — говорить против; в ru «закроют уста свои» — иное чтение); οὐκ ἔσται ὁ εἰσακούων αὐτῶν — «не будет слушающего их»."
  8: "ἐὰν μὴ ἐγὼ ἐμπλήσω ἰσχὺν ἐν πνεύματι κυρίου — «если я не исполнюсь силы в Духе Господнем»: LXX сохраняет условный оборот, в ru «я исполнен»; в тексте условность передана оборотом 「…されるのは…ためである」, сглаживания нет; κρίματος καὶ δυναστείας — «суда и могущества» (δυναστεία — власть, сила); τοῦ ἀπαγγεῖλαι τῷ Ιακωβ ἀσεβείας αὐτοῦ — «чтобы возвестить Иакову нечестие его»."
  9: "οἱ ἡγοῦμενοι οἴκου Ιακωβ — «вожди (главы) дома Иакова»; οἱ βδελυσσόμενοι κρίμα — «гнушающиеся суда» (βδελύσσομαι — гнушаться); πάντα τὰ ὀρθὰ διαστρέφοντες — «всё прямое искривляющие» (διαστρέφω — выворачивать, извращать)."
  10: "οἱ οἰκοδομοῦντες Σιων ἐν αἵμασιν — «строящие Сион кровьми»; Ιερουσαλημ ἐν ἀδικίαις — «Иерусалим неправдами»."
  11: "οἱ ἡγούμενοι αὐτῆς μετὰ δώρων ἔκρινον — «вожди его судили за дары» (δῶρον — дар, подарок); οἱ ἱερεῖς αὐτῆς μετὰ μισθοῦ ἀπεκρίνοντο — «священники его отвечали за плату» (μισθός — плата; ἀποκρίνομαι — отвечать, здесь — давать решение, учить); οἱ προφῆται αὐτῆς μετὰ ἀργυρίου ἐμαντεύοντο — «пророки его прорицали за серебро»; ἐπὶ τὸν κύριον ἐπανεπαύοντο — «на Господа опирались» (ἐπαναπαύομαι — опираться, полагаться); Οὐχὶ κύριος ἐν ἡμῖν ἐστιν; οὐ μὴ ἐπέλθῃ ἐφ᾽ ἡμᾶς κακά — «не Господь ли среди нас? не придёт на нас зло» — слова вождей в 『…』."
  12: "δι᾽ ὑμᾶς Σιων ὡς ἀγρὸς ἀροτριαθήσεται — «из-за вас Сион будет вспахан, как поле» (ἀροτριάω — пахать); ὡς ὀπωροφυλάκιον ἔσται — «будет, как плодовая сторожка» (в тексте 「果物の倉」, ср. 1:6); τὸ ὄρος τοῦ οἴκου ὡς ἄλσος δρυμοῦ — «гора дома — как роща дубравы» (ἄλσος — роща; δρυμός — дубрава, чаща; слав. «якоже луг дубравный»)."
