verses:
  1: "ダビデの自筆[じひつ]の詩[うた]。数[かず]の外[そと]にあるもの。ダビデがゴリアトと一騎打[いっきう]ちしたときのもの。わたしは兄弟[きょうだい]たちの中[なか]では小[ちい]さく、父[ちち]の家[いえ]では最[もっと]も若[わか]かった。わたしは父[ちち]の羊[ひつじ]を飼[か]っていた。"
  2: "わたしの手[て]は楽器[がっき]を作[つく]り、わたしの指[ゆび]は竪琴[たてごと]を調[ととの]えた。"
  3: "だれがわたしの主[しゅ]に告[つ]げるのか。主[しゅ]ご自身[じしん]が聞[き]いてくださる。"
  4: "主[しゅ]ご自身[じしん]がその使[つか]いを送[おく]り、わたしを父[ちち]の羊[ひつじ]の中[なか]から取[と]り、その注[そそ]ぎの油[あぶら]によって、わたしに油[あぶら]を注[そそ]がれた。"
  5: "わたしの兄弟[きょうだい]たちは美[うつく]しく、大[おお]きかったが、主[しゅ]は彼[かれ]らを喜[よろこ]ばれなかった。"
  6: "わたしは異[い]国の者[もの]に会[あ]いに出[で]た。彼[かれ]はその偶像[ぐうぞう]によってわたしをのろった。"
  7: "しかし、わたしは彼[かれ]の剣[つるぎ]を奪[うば]い取り、その首[くび]を切[き]り落[お]として、イスラエルの子[こ]らから恥[はじ]を取り除[のぞ]いた。"

notes:
  1: "Οὗτος ὁ ψαλμὸς ἰδιόγραφος εἰς Δαυιδ καὶ ἔξωθεν τοῦ ἀριθμοῦ — ダビデの自筆の詩、数の外にあるもの (ἰδιόγραφος — «собственноручный»; ἔξωθεν τοῦ ἀριθμοῦ — «вне числа»). ὅτε ἐμονομάχησεν τῷ Γολιαδ — ダビデがゴリアトと一騎打ちしたときのもの (μονομαχέω — «сражаться один на один»). Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1), скобками не маркируется. Μικρὸς ἤμην ἐν τοῖς ἀδελφοῖς μου — わたしは兄弟たちの中では小さく (μικρός — «малый»). νεώτερος ἐν τῷ οἴκῳ τοῦ πατρός μου — 父の家では最も若かった (νεώτερος — «младший»). ἐποίμαινον τὰ πρόβατα τοῦ πατρός μου — 父の羊を飼っていた (ποιμαίνω — «пасти»)."
  2: "αἱ χεῖρές μου ἐποίησαν ὄργανον — わたしの手は楽器を作り (ὄργανον — «инструмент»). οἱ δάκτυλοί μου ἥρμοσαν ψαλτήριον — わたしの指は竪琴を調えた (ἁρμόζω — «прилаживать, настраивать»; ψαλτήριον — 竪琴)."
  3: "καὶ τίς ἀναγγελεῖ τῷ κυρίῳ μου — だれがわたしの主に告げるのか (ἀναγγέλλω — «возвещать»). αὐτὸς κύριος, αὐτὸς εἰσακούει — 主ご自身が聞いてくださる (εἰσακούω — «услышать»; повтор αὐτός сохранён)."
  4: "αὐτὸς ἐξαπέστειλεν τὸν ἄγγελον αὐτοῦ — 主ご自身がその使いを送り (ἐξαποστέλλω — «посылать»; ἄγγελος здесь — «посланник», не ангел в собственном смысле). ἦρέν με ἐκ τῶν προβάτων τοῦ πατρός μου — わたしを父の羊の中から取り (αἴρω — «брать, поднимать»). ἔχρισέν με ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ — その注ぎの油によって、わたしに油を注がれた (χρίω — «помазывать»; ἔλαιον χρίσεως — «елей помазания»)."
  5: "οἱ ἀδελφοί μου καλοὶ καὶ μεγάλοι — わたしの兄弟たちは美しく、大きかった (καλός — «красивый, хороший»). οὐκ εὐδόκησεν ἐν αὐτοῖς κύριος — 主は彼らを喜ばれなかった (εὐδοκέω — «благоволить»)."
  6: "ἐξῆλθον εἰς συνάντησιν τῷ ἀλλοφύλῳ — わたしは異国の者に会いに出た (συνάντησις — «встреча»; ἀλλόφυλος — «иноплеменник»). ἐπικατηράσατό με ἐν τοῖς εἰδώλοις αὐτοῦ — 彼はその偶像によってわたしをのろった (ἐπικαταράομαι — «проклинать»; εἴδωλον — «идол»)."
  7: "ἐγὼ δὲ σπασάμενος τὴν παρ᾽ αὐτοῦ μάχαιραν — しかし、わたしは彼の剣を奪い取り (σπάω — «вытаскивать, вырывать»; μάχαιρα — «меч»). ἀπεκεφάλισα αὐτὸν — その首を切り落とした (ἀποκεφαλίζω — «обезглавливать»). ἦρα ὄνειδος ἐξ υἱῶν Ισραηλ — イスラエルの子らから恥を取り除いた (ὄνειδος — «поношение, позор»)."
