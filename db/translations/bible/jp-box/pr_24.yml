# jp-box, Притчи, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для гл. 24 есть только в ст. 1–5 (контроль церковного чтения);
# jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 24: слова мудрых: не завидовать злым (1–2), дом строится премудростью (3–4),
# мудрый сильнее сильного (5–6), премудрость у ворот (7–8), гибель безумного (9–10),
# спасай ведомых на смерть (11–12), мёд и премудрость (13–14), падение праведного
# (15–16), не радуйся падению врага (17–20), страх Господа и царя (21–22),
# суд и лицеприятие (23–26), дела и дом (27), лжесвидетель и месть (28–29),
# поле ленивого (30–34).
# Прямая речь: 12 (слова человека — 「…」), 24 (слова оправдывающего — 「…」),
# 29 (слова мстящего — 「…」), 33 (слова ленивого — 「…」, в LXX без вводящего глагола).
# Нумерация по gr: 34 стиха, деление совпадает с csl. В ст. 22 gr содержит
# пространное добавление (λόγον φυλασσόμενος…), в изданиях LXX стоящее в квадратных
# скобках; оно есть и в csl, поэтому переведено в основном тексте без 〔…〕.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).

