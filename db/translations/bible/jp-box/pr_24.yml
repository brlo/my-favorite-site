verses:
  1: "わが子[こ]よ、悪[わる]い者[もの]たちを羨[うらや]むな。彼[かれ]らとともにいたいと願[ねが]うな。"
  2: "彼[かれ]らの心[こころ]は偽[いつわ]りを考[かんが]え、その唇[くちびる]は苦[くる]しみを語[かた]るからである。"
  3: "家[いえ]は知恵[ちえ]によって建[た]てられ、分別[ふんべつ]によって堅[かた]く据[す]えられる。"
  4: "また、思慮[しりょ]によって蔵[くら]は、すべての貴[とうと]く良[よ]い富[とみ]で満[み]たされる。"
  5: "知恵[ちえ]ある者[もの]は強[つよ]い者[もの]にまさり、思慮[しりょ]を備[そな]えた者[もの]は大[おお]きな畑[はたけ]を耕[たがや]す者[もの]にまさる。"
  6: "戦[いくさ]は舵取[かじと]りによってなされ、助[たす]けは助言[じょげん]する心[こころ]による。"
  7: "知恵[ちえ]と良[よ]い思[おも]いは知恵ある者[もの]たちの門[もん]にある。知恵ある者[もの]たちは主[しゅ]の口[くち]からそれない。"
  8: "しかし、彼[かれ]らは集会[しゅうかい]で思[おも]い巡[めぐ]らす。無[む]教養[きょうよう]な者[もの]には死[し]が訪[おとず]れる。"
  9: "愚[おろ]かな者[もの]は罪[つみ]のうちに死[し]ぬ。不[ふ]潔[けつ]は滅[ほろ]びの者[もの]のものである。"
  10: "その者[もの]は悪[わる]い日[ひ]にも、苦[くる]しみの日[ひ]にも、力[ちから]尽[つ]きるまで汚[けが]れる。"
  11: "死[し]に引[ひ]かれて行[ゆ]く者[もの]たちを救[すく]い出[だ]せ。殺[ころ]されようとする者[もの]たちを買[か]い取[と]れ。惜[お]しむな。"
  12: "しかし、「わたしはこのことを知[し]らない」と言[い]うなら、主[しゅ]がすべての心[こころ]を知[し]っておられることを知[し]れ。すべての者[もの]に息[いき]を与[あた]えた方[かた]はすべてを知[し]っておられ、その方[かた]はそれぞれの行[おこな]いに応[おう]じて報[むく]いを与[あた]えられる。"
  13: "蜜[みつ]を食[た]べよ、わが子[こ]よ。蜂[はち]の巣[す]は良[よ]いものだから、あなたの喉[のど]が甘[あま]くなるように。"
  14: "同[おな]じように、あなたは自分[じぶん]の魂[たましい]で知恵[ちえ]を味[あじ]わう。それを見[み]いだすなら、あなたの終[お]わりは良[よ]いものとなり、希望[きぼう]はあなたを見捨[みす]てない。"
  15: "不敬[ふけい]な者[もの]を正[ただ]しい者[もの]たちの牧[まき]場[ば]へ連[つ]れて行[ゆ]くな。腹[はら]の満[み]ち足[た]りに惑[まど]わされるな。"
  16: "正[ただ]しい者[もの]は七度[ななど]倒[たお]れても起[お]き上[あ]がる。しかし、不敬[ふけい]な者[もの]たちは災[わざわ]いのうちに弱[よわ]り果[は]てる。"
  17: "あなたの敵[てき]が倒[たお]れるとき、喜[よろこ]ぶな。彼[かれ]がつまずくとき、心[こころ]を高[たか]ぶるな。"
  18: "主[しゅ]がそれを見[み]て、御心[みこころ]にかなわず、彼[かれ]への怒[いか]りをそらされるからである。"
  19: "悪[あく]をなす者[もの]たちを喜[よろこ]ぶな。罪[つみ]を犯[おか]す者[もの]たちを羨[うらや]むな。"
  20: "悪[わる]い者[もの]の子孫[しそん]は続[つづ]かないからである。不敬[ふけい]な者[もの]の灯[ともしび]は消[き]える。"
  21: "わが子[こ]よ、主[しゅ]を、また王[おう]を恐[おそ]れよ。そのどちらにも逆[さか]らうな。"
  22: "彼[かれ]らは不敬[ふけい]な者[もの]たちをたちまち罰[ばっ]するからである。その二[ふた]つからの罰[ばち]をだれが知[し]ろうか。言葉[ことば]を守[まも]る子[こ]は滅[ほろ]びから免[まぬか]れる。受[う]け入[い]れる者[もの]はそれを受[う]け入[い]れたのである。王[おう]に舌[した]をもって偽[いつわ]りが語[かた]られてはならない。また、その舌[した]から偽りが出[で]ることもあってはならない。王[おう]の舌[した]は肉[にく]の剣[つるぎ]ではなく、引[ひ]き渡[わた]された者[もの]は砕[くだ]かれる。もし彼[かれ]の怒[いか]りが鋭[するど]くなれば、人[ひと]を筋[すじ]ごと滅[ほろ]ぼし、人[ひと]の骨[ほね]をかみ砕[くだ]き、炎[ほのお]のように焼[や]く。そのため、鷲[わし]のひなにも食[た]べるものがなくなる。わが子[こ]よ、わたしの言葉[ことば]を恐[おそ]れ、それを受[う]け入[い]れて悔[く]い改[あらた]めよ。"
  23: "これらは、わたしが知恵[ちえ]ある者[もの]たちに言[い]うことである。裁[さば]きの座[ざ]で人[ひと]の顔[かお]に遠慮[えんりょ]するのは良[よ]くない。"
  24: "不敬[ふけい]な者[もの]に「正[ただ]しい」と言[い]う者[もの]は、民[たみ]の間[あいだ]で呪[のろ]われ、国[くに]々[ぐに]に憎[にく]まれる。"
  25: "しかし、彼[かれ]らを責[せ]める者[もの]たちは良[よ]い者[もの]として現[あらわ]れ、彼[かれ]らの上[うえ]に良[よ]い祝福[しゅくふく]が来[く]る。"
  26: "良[よ]い言葉[ことば]に答[こた]える唇[くちびる]には、口[くち]づけが与[あた]えられる。"
  27: "あなたの仕事[しごと]を外[そと]へ出[だ]すために整[ととの]え、畑[はたけ]のために備[そな]えよ。そして、わたしの後[あと]に歩[あゆ]んで、あなたの家[いえ]を建[た]てよ。"
  28: "あなたの同胞[どうほう]に逆[さか]らう偽[にせ]の証人[しょうにん]となるな。あなたの唇[くちびる]を大[おお]きく開[ひら]くな。"
  29: "「あの者[もの]がわたしにしたように、わたしもあの者にする。その者[もの]がわたしにした悪[わる]いことに応[おう]じて報[むく]いる」と言[い]うな。"
  30: "愚[おろ]かな者[もの]は畑[はたけ]のようであり、思慮[しりょ]に欠[か]けた者[もの]はぶどう畑[ばたけ]のようである。"
  31: "そのままにしておけば、荒[あ]れ果[は]てて草[くさ]が生[は]え、すべてが捨[す]てられたものとなる。その石[いし]の囲[かこ]いは崩[くず]される。"
  32: "後[のち]になって、わたしは考[かんが]え直[なお]した。戒[いまし]めを選[えら]び取[と]ろうと目[め]を向[む]けたのである。"
  33: "「少[すこ]し眠[ねむ]り、少[すこ]しまどろみ、少[すこ]し手[て]を組[く]んで胸[むね]を抱[だ]いて横[よこ]たわろう。」"
  34: "もしあなたがそうするなら、あなたの貧[まず]しさと乏[とぼ]しさが、足[あし]の速[はや]い走[はし]り手[て]のように先[さき]に立[た]って来[く]る。"

notes:
  1: "υἱέ, μὴ ζηλώσῃς κακοὺς ἄνδρας — «сын, не ревнуй (не завидуй) злым мужам»: ζηλόω здесь в значении «завидовать»; слав. «не ревнуй мужем злым», Син. «не ревнуй злым людям». μηδὲ ἐπιθυμήσῃς εἶναι μετ᾽ αὐτῶν — «и не пожелай быть с ними»; jp-joc: «彼と偕に居らんことを願ふ毋れ»."
  2: "ψεύδη γὰρ μελετᾷ ἡ καρδία αὐτῶν — «ибо ложь замышляет сердце их» (μελετάω — «обдумывать, замышлять»); πόνους τὰ χείλη αὐτῶν λαλεῖ — «и труды (страдания) говорят уста их»: πόνους — винитив содержания при λαλέω; слав. «болезни», т. е. бедствия, которые несут их речи. jp-joc передаёт толковательно: «暴虐 / 殘害»."
  3: "μετὰ σοφίας οἰκοδομεῖται οἶκος — «премудростью созидается дом»: μετά с род. — орудийное, によって. μετὰ συνέσεως ἀνορθοῦται — «разумом исправляется (утверждается)» (ἀνορθόω — «выпрямлять, восстанавливать»); слав. «с разумом исправляется». jp-joc: «家は智慧に因りて建てられ、明哲に因りて堅くせられ»."
  4: "μετὰ αἰσθήσεως — «с чувством (пониманием)»: αἴσθησις — «ощущение, восприятие», здесь практическое понимание; слав. «с чувствием». ταμίεια — «кладовые, сокровищницы»; ἐμπίμπλαται — «наполняется» (ἐμπίπλημι)."
  5: "κρείσσων σοφὸς ἰσχυροῦ — «лучше мудрый сильного»; ἀνὴρ φρόνησιν ἔχων γεωργίου μεγάλου — тёмное место: букв. «муж, имеющий разум, [лучше] великого земледельца (поля)»; слав. «и муж разум имеяй земледелца велика». jp-joc толкует: «человек знания умножает свою силу»; держимся греческого и славянского, без домысла."
  6: "μετὰ κυβερνήσεως γίνεται πόλεμος — «с управлением (кормчим искусством) бывает война»: κυβέρνησις — «управление кораблём», отсюда «распоряжение, стратегия»; слав. «со управлением». βοήθεια δὲ μετὰ καρδίας βουλευτικῆς — «помощь же с сердцем советующим», т. е. с разумным советом. jp-joc этот стих не передаёт."
  7: "σοφία καὶ ἔννοια ἀγαθὴ ἐν πύλαις σοφῶν — «премудрость и мысль благая во вратах премудрых»: πύλαι — городские ворота, место суда. σοφοὶ οὐκ ἐκκλίνουσιν ἐκ στόματος κυρίου — «мудрые не уклоняются от уст Господних»; слав. «от закона Господня». Синодальный здесь следует масоретскому тексту («для глупого слишком высока мудрость») — иное чтение, не вносим."
  8: "ἀλλὰ λογίζονται ἐν συνεδρίοις — «но замышляют в собраниях» (συνέδριον — «совет, собрание»). ἀπαιδεύτοις συναντᾷ θάνατος — «с невоспитанными встречается смерть» (ἀπαίδευτος — «необученный, невежда»); слав. «ненаказанных сретает смерть». В Синодальном ст. 7–9 иные (по масоретскому тексту)."
  9: "ἀποθνῄσκει δὲ ἄφρων ἐν ἁμαρτίαις — «умирает же безумный во грехах»; ἀκαθαρσία δὲ ἀνδρὶ λοιμῷ — «нечистота же мужу-губителю» (λοιμός — «погибельный, зараза»). Слав. переносит сказуемое ἐμμολυνθήσεται в ст. 10 («Нечистота мужу губителю: осквернится в день зол…»); по делению gr сказуемое относится к следующему стиху, поэтому здесь оно не переведено."
  10: "ἐν ἡμέρᾳ κακῇ καὶ ἐν ἡμέρᾳ θλίψεως, ἕως ἂν ἐκλίπῃ — «в день злой и в день скорби, доколе не оскудеет»: ἕως ἄν с конъюнктивом; ἐκλείπω — «оскудевать, исчезать». Сказуемое ἐμμολυνθήσεται («осквернится») из ст. 9 по греческому делению относится сюда — отсюда 汚れる; слав. читает весь стих слитно с «осквернится». Синодальный даёт иное («если ты в день бедствия оказался слабым…»)."
  11: "ῥῦσαι ἀγομένους εἰς θάνατον — «избавь ведомых на смерть» (ῥύομαι — «спасать, избавлять»); ἐκπρίου κτεινομένους — «искупи убиваемых» (ἐκπρίου — импер. от ἐκπρίομαι, «выкупать»); μὴ φείσῃ — «не пощади», т. е. не жалей ни усилий, ни средств. Слав. «избави ведомыя на смерть и искупи убиваемых, не щади»."
  12: "ἐὰν δὲ εἴπῃς Οὐκ οἶδα τοῦτον — «если же скажешь: я не знаю этого»: прямая речь внутри изречения, поэтому 「…」. κύριος καρδίας πάντων γινώσκει — «Господь сердца всех знает»; ὁ πλάσας πνοὴν πᾶσιν — «создавший дыхание всем» (πλάσσω — «лепить, образовывать»). ὃς ἀποδίδωσιν ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ — «Который воздаёт каждому по делам его»."
  13: "φάγε μέλι, υἱέ — «ешь мёд, сын»: импер. аор.; ἀγαθὸν γὰρ κηρίον — «ибо хорош сот (медовый)» (κηρίον — «соты»); ἵνα γλυκανθῇ σου ὁ φάρυγξ — «чтобы усладилась гортань твоя» (φάρυγξ — «горло»)."
  14: "οὕτως αἰσθήσῃ σοφίαν τῇ σῇ ψυχῇ — «так почувствуешь (вкусишь) премудрость душою твоею»: αἰσθάνομαι, ср. αἴσθησις в ст. 4. ἐὰν γὰρ εὕρῃς, ἔσται καλὴ ἡ τελευτή σου — «ибо если найдёшь, будет хорош конец твой»; ἐλπίς σε οὐκ ἐγκαταλείψει — «надежда тебя не оставит»."
  15: "μὴ προσαγάγῃς ἀσεβῆ νομῇ δικαίων — «не приводи нечестивого на пастбище праведных» (νομή — «пастьба, пастбище»); μηδὲ ἀπατηθῇς χορτασίᾳ κοιλίας — «и не обольщайся насыщением чрева» (χορτασία — «насыщение»). Синодальный иной («не злоумышляй против жилища праведника»)."
  16: "ἑπτάκι γὰρ πεσεῖται ὁ δίκαιος καὶ ἀναστήσεται — «ибо семь раз упадёт праведный и встанет»: ἑπτάκι — «семь раз», число полноты. οἱ δὲ ἀσεβεῖς ἀσθενήσουσιν ἐν κακοῖς — «нечестивые же изнемогут в бедах» (ἀσθενέω — «слабеть»)."
  17: "ἐὰν πέσῃ ὁ ἐχθρός σου, μὴ ἐπιχαρῇς αὐτῷ — «если упадёт враг твой, не радуйся о нём» (ἐπιχαίρω — «радоваться чужой беде»); ἐν δὲ τῷ ὑποσκελίσματι αὐτοῦ μὴ ἐπαίρου — «и при преткновении его не превозносись» (ὑποσκελίζω — «подставлять ногу»; ἐπαίρομαι — «возноситься»)."
  18: "ὅτι ὄψεται κύριος, καὶ οὐκ ἀρέσει αὐτῷ — «ибо увидит Господь, и не будет Ему угодно» (ἀρέσκω — «нравиться, быть угодным»). ἀποστρέψει τὸν θυμὸν αὐτοῦ ἀπ᾽ αὐτοῦ — «и отвратит ярость Свою от него», т. е. гнев Божий уйдёт с врага и он не будет наказан."
  19: "μὴ χαῖρε ἐπὶ κακοποιοῖς — «не радуйся о злодеях»; μηδὲ ζήλου ἁμαρτωλούς — «и не ревнуй (не завидуй) грешникам»: ζηλόω, как в ст. 1."
  20: "οὐ γὰρ μὴ γένηται ἔκγονα πονηρῶν — «ибо не будет потомства у злых» (ἔκγονα — «потомки, отпрыски»), усиленное οὐ μή. λαμπτὴρ δὲ ἀσεβῶν σβεσθήσεται — «светильник же нечестивых угаснет» (σβέννυμι — «гасить»)."
  21: "φοβοῦ τὸν θεόν, υἱέ, καὶ βασιλέα — «бойся Бога, сын, и царя»: соединение страха Божия и верности царю. μηθετέρῳ αὐτῶν ἀπειθήσῃς — «ни одному из них не противись» (ἀπειθέω — «не повиноваться»)."
  22: "ἐξαίφνης γὰρ τείσονται τοὺς ἀσεβεῖς — «ибо внезапно взыщет (Он) с нечестивых» (τείσομαι — «подвергаться наказанию», здесь в активном значении «взыскать»); τὰς δὲ τιμωρίας ἀμφοτέρων τίς γνώσεται — «и наказания обоих кто узнает». Далее в gr-lxx-byz и в csl идёт пространное добавление λόγον φυλασσόμενος υἱὸς ἀπωλείας ἐκτὸς ἔσται…, в изданиях LXX стоящее в квадратных скобках; по правилу базы (слово в gr есть) оно переведено в основном тексте, без 〔…〕 и без отдельного стиха. Тёмные места добавления переданы буквально: δεχόμενος δὲ ἐδέξατο αὐτόν — «принимающий же принял его», слав. «приемляй же прият оное»; μάχαιρα γλῶσσα βασιλέως καὶ οὐ σαρκίνη — «меч — язык царя, и не из плоти»."
  23: "Ταῦτα δὲ λέγω ὑμῖν τοῖς σοφοῖς ἐπιγινώσκειν — «это же говорю вам, мудрым, знать»: заглавие «слова мудрых». αἰδεῖσθαι πρόσωπον ἐν κρίσει οὐ καλόν — «стыдиться лица на суде нехорошо», т. е. лицеприятие, угождение лицу (αἰδέομαι — «стыдиться, уважать»); слав. «срамлятися лица на суде»."
  24: "ὁ εἰπὼν τὸν ἀσεβῆ Δίκαιός ἐστιν — «сказавший нечестивому: праведен есть»: оправдание виновного на суде. ἐπικατάρατος λαοῖς ἔσται — «проклят будет народами» (ἐπικατάρατος — усиленное «проклятый»); μισητὸς εἰς ἔθνη — «ненавистен для народов»."
  25: "οἱ δὲ ἐλέγχοντες βελτίους φανοῦνται — «обличающие же окажутся лучше» (ἐλέγχω — «обличать»); ἐπ᾽ αὐτοὺς δὲ ἥξει εὐλογία ἀγαθή — «на них придёт благословение благое»."
  26: "χείλη δὲ φιλήσουσιν ἀποκρινόμενα λόγους ἀγαθούς — «уста же облобызают отвечающие слова благие»: φιλέω — «целовать»; слав. «и устне облобызают отвещающыя словеса блага». Смысл: кто отвечает добрым словом, того приветствуют и любят."
  27: "ἑτοίμαζε εἰς τὴν ἔξοδον τὰ ἔργα σου — «готовь к выходу дела твои»: εἰς ἔξοδον — «для выхода (наружу, в поле)», слав. «на исход». παρασκευάζου εἰς τὸν ἀγρόν — «приготовляйся на поле»; πορεύου κατόπισθέν μου — «иди за мной», тёмное: слав. «ходи вслед мене»; ἀνοικοδομήσεις τὸν οἶκον σου — «и построишь дом твой»."
  28: "μὴ ἴσθι ψευδὴς μάρτυς ἐπὶ σὸν πολίτην — «не будь лжесвидетелем против своего согражданина» (πολίτης — «гражданин, соплеменник»); μηδὲ πλατύνου σοῖς χείλεσιν — «и не расширяй (уста) устами твоими», т. е. не разевай рот для лжи; слав. «ниже пространяйся твоима устнама»."
  29: "μὴ εἴπῃς Ὃν τρόπον ἐχρήσατό μοι χρήσομαι αὐτῷ — «не скажи: каким образом он поступил со мной, так поступлю и я с ним» (χράομαι — «обходиться, поступать»); τείσομαι δὲ αὐτὸν ἅ με ἠδίκησεν — «и отомщу ему за то, чем он меня обидел» (ἀδικέω — «обижать, вредить»). Прямая речь — 「…」."
  30: "ὥσπερ γεώργιον ἀνὴρ ἄφρων — «как поле — муж безумный»: сравнение без второй части; в LXX (и в слав.) нет «проходил я мимо», которое есть в масоретском тексте и в Синодальном. ὥσπερ ἀμπελὼν ἄνθρωπος ἐνδεὴς φρενῶν — «и как виноградник — человек, лишённый ума» (ἐνδεής — «нуждающийся»)."
  31: "ἐὰν ἀφῇς αὐτόν, χερσωθήσεται — «если оставишь его, запустеет» (χερσόω — «делать сухим, пустынным»); χορτομανήσει ὅλος — «весь зарастёт травою» (χορτομανέω, редкое); γίνεται ἐκλελειμμένος — «станет оставленным»; οἱ φραγμοὶ τῶν λίθων αὐτοῦ κατασκάπτονται — «ограды из камней его подкапываются» (κατασκάπτω — «разрушать, подкапывать»)."
  32: "ὕστερον ἐγὼ μετενόησα — «после я раскаялся (образумился)» (μετανοέω); ἐπέβλεψα τοῦ ἐκλέξασθαι παιδείαν — «я посмотрел, чтобы избрать наставление»: παιδεία — 戒め/訓練, как в 1:2; слав. «воззрех избрати наказание»."
  33: "ὀλίγον νυστάζω, ὀλίγον δὲ καθυπνῶ — «немного дремлю, немного же сплю» (νυστάζω — «дремать»; καθυπνόω — «засыпать»); ὀλίγον δὲ ἐναγκαλίζομαι χερσὶν στήθη — «немного обнимаю руками грудь», т. е. складываю руки на груди, чтобы спать. Это слова ленивого, в LXX без вводящего глагола; переданы прямой речью 「…」."
  34: "ἐὰν δὲ τοῦτο ποιῇς — «если же это будешь делать»: вывод из слов ленивого. ἥξει προπορευομένη ἡ πενία σου — «придёт, идя впереди, нищета твоя» (προπορεύομαι — «идти впереди»); ἡ ἔνδειά σου ὥσπερ ἀγαθὸς δρομεύς — «и скудость твоя, как хороший бегун» (ἔνδεια — «недостаток»; δρομεύς — «бегун»)."
