verses:
  1: "彼[かれ]はわたしを外庭[がいてい]へ、東[ひがし]の方[ほう]、北[きた]に面[めん]した門[もん]の正面[しょうめん]へ連[つ]れ出[だ]した。そしてわたしを連[つ]れて行[い]くと、見[み]よ、五[いつ]つの部屋[へや]があり、残[のこ]りの空地[くうち]に接[せっ]し、北[きた]の区切[くぎ]りの建物[たてもの]に接していた。"
  2: "北[きた]へ向[む]かって長[なが]さ百[ひゃく]キュビト、幅[はば]五十[ごじゅう]キュビトであった。"
  3: "それらは内庭[ないてい]の門[もん]のようであり、外庭[がいてい]の柱廊[ちゅうろう]のようであった。三[みっ]つの柱廊[ちゅうろう]が向[む]かい合[あ]って列[れつ]をなしていた。"
  4: "部屋[へや]の前[まえ]には幅[はば]十[じゅう]キュビトの通路[つうろ]があり、内[うち]へは一[いっ]キュビトの道[みち]があった。長[なが]さは百[ひゃく]キュビトで、その戸[と]は北[きた]に面[めん]していた。"
  5: "上[うえ]の階[かい]の通路[つうろ]も同[おな]じであった。柱廊[ちゅうろう]が下[した]の柱廊[ちゅうろう]から張[は]り出[で]ていたからである。区切[くぎ]りも柱廊[ちゅうろう]も、そのようであった。"
  6: "それらは三[みっ]重[え]で、外[そと]の柱[はしら]のような柱[はしら]を持[も]っていなかった。それゆえ、下[した]のものと中[なか]のものから、地面[じめん]から上[うえ]へ張[は]り出[で]ていた。"
  7: "外[そと]の光[ひかり]は、外庭[がいてい]の部屋[へや]が北[きた]の部屋[へや]に向[む]かい合[あ]って見[み]えるのと同[おな]じであった。長[なが]さは五十[ごじゅう]キュビトであった。"
  8: "外庭[がいてい]に面[めん]した部屋[へや]の長[なが]さは五十[ごじゅう]キュビトであり、これらはあれらに向[む]かい合[あ]っていた。全[ぜん]体[たい]は百[ひゃく]キュビトであった。"
  9: "これらの部屋[へや]の戸[と]は、東[ひがし]に面[めん]した入口[いりぐち]のもので、外庭[がいてい]からそれらによって入[はい]るためであった。"
  10: "通路[つうろ]の始[はじ]めの光[ひかり]に沿[そ]って、南[みなみ]に属[ぞく]するものは南[みなみ]の正面[しょうめん]、残[のこ]りの空地[くうち]の正面[しょうめん]、区切[くぎ]りの建物[たてもの]の正面[しょうめん]にあり、部屋[へや]であった。"
  11: "その前[まえ]の通路[つうろ]は、北[きた]の部屋[へや]の寸法[すんぽう]に従[したが]い、その長[なが]さもその幅[はば]も、すべての出口[でぐち]も、すべての曲[ま]がりも、その光[ひかり]も、その戸[と]も同[おな]じであった。"
  12: "南[みなみ]の部屋[へや]についても、戸[と]は通路[つうろ]の始[はじ]めから、葦[あし]の区切[くぎ]りの光[ひかり]の方[ほう]へ向[む]かい、東[ひがし]に面[めん]して、それらによって入[はい]るようになっていた。"
  13: "彼[かれ]はわたしに言[い]った。「北[きた]の部屋[へや]と南[みなみ]の部屋[へや]で、区切[くぎ]りの正面[しょうめん]にあるものは、聖[せい]なる所[ところ]の部屋である。そこでは、主[しゅ]に近[ちか]づく祭司[さいし]たち、サドクの子[こ]らが、至聖[しせい]のものを食[た]べる。またそこに、彼らは至聖のものと、犠牲[ぎせい]と、罪[つみ]のため、また無知[むち]のためのものを置[お]く。そこは聖なる場所[ばしょ]だからである。"
  14: "祭司[さいし]たちのほかは、そこに入[はい]ってはならない。彼らは聖[せい]なる所[ところ]から外庭[がいてい]へ出[で]てはならない。近[ちか]づく者[もの]がいつも聖[せい]であるためであり、自分[じぶん]がその中[なか]で仕[つか]えるときの衣服[いふく]に触[ふ]れてはならないためである。それらは聖なるものだからである。民[たみ]に触[ふ]れるときは、別[べつ]の衣服[いふく]を着[き]なければならない。」"
  15: "こうして神殿[しんでん]の内[うち]の測量[そくりょう]が終[お]わった。彼[かれ]はわたしを東[ひがし]に面[めん]した門[もん]の道[みち]から連[つ]れ出[だ]し、神殿[しんでん]の形[かたち]を周[まわ]りに、その配置[はいち]に従[したが]って測[はか]った。"
  16: "彼[かれ]は東[ひがし]に面[めん]した門[もん]の後[うしろ]に立[た]ち、測[はか]り竿[ざお]で五百[ごひゃく]キュビトを測[はか]った。"
  17: "彼[かれ]は北[きた]へ向[む]きを変[か]え、北[きた]の正面[しょうめん]を測[はか]り竿[ざお]で五百[ごひゃく]キュビトと測った。"
  18: "彼[かれ]は海[うみ]の方[ほう]へ向きを変え、海の方の正面を測り竿で五百キュビトと測った。"
  19: "彼[かれ]は南[みなみ]へ向きを変え、南[みなみ]の正面[しょうめん]を測り竿で五百キュビトと測った。"
  20: "四[よん]つは同[おな]じ測[はか]り竿[ざお]による。彼[かれ]はそれを整[ととの]え、その周[まわ]りに囲[かこ]いを巡[めぐ]らした。東[ひがし]へ五百[ごひゃく]キュビトの長[なが]さ、幅[はば]も五百キュビトで、聖[せい]なるものと、神殿[しんでん]の配置[はいち]にある前[まえ]の壁[かべ]との間[あいだ]を分[わ]けるためであった。"

notes:
  1: "ἐξήγαγέν με εἰς τὴν αὐλὴν τὴν ἐξωτέραν — «вывел меня во внешний двор» (外庭); κατὰ ἀνατολάς — «к востоку»; κατέναντι τῆς πύλης τῆς πρὸς βορρᾶν — «напротив ворот, что к северу»; ἐξέδραι πέντε — «пять покоев» (ἐξέδρα, 部屋; слав. «преграды»); ἐχόμεναι τοῦ ἀπολοίπου — «примыкающие к остатку (свободному месту)»; τοῦ διορίζοντος — «к отделяющему [зданию]» (区切りの建物)."
  2: "ἐπὶ πήχεις ἑκατὸν μῆκος πρὸς βορρᾶν — «в сто локтей длина к северу»; πλάτος πεντήκοντα πήχεων — «ширина пятьдесят локтей»."
  3: "διαγεγραμμέναι ὃν τρόπον αἱ πύλαι τῆς αὐλῆς τῆς ἐσωτέρας — «расписанные наподобие ворот внутреннего двора» (διαγράφω — описывать, располагать); τὰ περίστυλα — «колоннады, окружённые столбами» (περίστυλον, 柱廊); ἐστιχισμέναι — «выстроенные в ряд» (στιχίζω); ἀντιπρόσωποι στοαὶ τρισσαί — «три колоннады, обращённые друг к другу»."
  4: "περίπατος — «проход, галерея» (通路); πλάτος 10, μῆκος 100; «во внутренняя пути единаго лактя» (слав.) — «внутрь путь в один локоть»; в LXX этой клаузы нет, внесена без 〔…〕. τὰ θυρώματα πρὸς βορρᾶν — «входы к северу»."
  5: "οἱ περίπατοι οἱ ὑπερῷοι — «верхние проходы» (ὑπερῷος — верхний); ἐξείχετο τὸ περίστυλον ἐξ αὐτοῦ — «колоннада выступала из него»; ἐκ τοῦ ὑποκάτωθεν περιστύλου — «из нижней колоннады»; τὸ διάστημα — «промежуток». Слав. «проходи горничнии»."
  6: "τριπλαῖ — «тройные, в три яруса» (τριπλοῦς; слав. «трегубы»); στύλους οὐκ εἶχον — «не имели столбов»; ἐξείχοντο τῶν ὑποκάτωθεν — «выступали над нижними»; ἀπὸ τῆς γῆς — «от земли»."
  7: "φῶς ἔξωθεν — «свет снаружи» (φῶς — свет, просвет; слав. «свет внеуду»); αἱ ἐξέδραι τῆς αὐλῆς τῆς ἐξωτέρας — «покои внешнего двора»; αἱ βλέπουσαι ἀπέναντι τῶν ἐξεδρῶν τῶν πρὸς βορρᾶν — «смотрящие напротив покоев, что к северу»; μῆκος 50."
  8: "τὸ μῆκος τῶν ἐξεδρῶν — «длина покоев»; τῶν βλεπουσῶν εἰς τὴν αὐλὴν τὴν ἐξωτέραν — «выходящих во внешний двор»; ἀντιπρόσωποι ταύταις — «обращённые друг к другу»; τὸ πᾶν — «всё вместе», 100 локтей."
  9: "αἱ θύραι τῶν ἐξεδρῶν τούτων — «двери этих покоев»; τῆς εἰσόδου τῆς πρὸς ἀνατολάς — «входа, что к востоку»; εἰσπορεύεσθαι δι᾽ αὐτῶν ἐκ τῆς αὐλῆς τῆς ἐξωτέρας — «входить через них из внешнего двора»."
  10: "κατὰ τὸ φῶς τοῦ ἐν ἀρχῇ περιπάτου — «по свету того, что в начале прохода»; τὰ πρὸς νότον — «то, что к югу»; κατὰ πρόσωπον τοῦ ἀπολοίπου — «напротив свободного места»; κατὰ πρόσωπον τοῦ διορίζοντος — «напротив отделяющего [здания]»; ἐξέδραι — «покои». Синтаксис обрывочен (перечень) — так и передан."
  11: "κατὰ τὰ μέτρα τῶν ἐξεδρῶν τῶν πρὸς βορρᾶν — «по мерам покоев, что к северу»; κατὰ πάσας τὰς ἐξόδους — «по всем выходам»; τὰς ἐπιστροφάς — «повороты» (ἐπιστροφή; слав. «вращения»); τὰ φῶτα — «светы, просветы»; τὰ θυρώματα — «входы»."
  12: "τῶν ἐξεδρῶν τῶν πρὸς νότον — «покоев, что к югу»; κατὰ τὰ θυρώματα ἀπ᾽ ἀρχῆς τοῦ περιπάτου — «по входам от начала прохода»; ὡς ἐπὶ φῶς διαστήματος καλάμου — «как к свету промежутка трости» (κάλαμος — трость, 葦); κατ᾽ ἀνατολὰς τοῦ εἰσπορεύεσθαι — «к востоку для входа»."
  13: "αἱ ἐξέδραι τοῦ ἁγίου — «покои святого»; οἱ ἱερεῖς υἱοὶ Σαδδουκ — «священники, сыны Садока» (サドク); οἱ ἐγγίζοντες πρὸς κύριον — «приближающиеся к Господу»; τὰ ἅγια τῶν ἁγίων — «святое святых» (至聖); τὴν θυσίαν — «жертву» (犠牲); τὰ περὶ ἁμαρτίας — «[жертвы] за грех»; τὰ περὶ ἀγνοίας — «[жертвы] за неведение» (無知); ὁ τόπος ἅγιος — «место свято»."
  14: "οὐκ εἰσελεύσονται ἐκεῖ πάρεξ τῶν ἱερέων — «не войдут туда, кроме священников»; ἐκ τοῦ ἁγίου εἰς τὴν αὐλὴν τὴν ἐξωτέραν — «из святого во внешний двор»; ὅπως διὰ παντὸς ἅγιοι ὦσιν — «чтобы всегда были святы»; μὴ ἅπτωνται τοῦ στολισμοῦ αὐτῶν — «не касались одежд своих» (στολισμός — облачение); ἐν οἷς λειτουργοῦσιν — «в которых служат»; ἱμάτια ἕτερα — «другие одежды»; ὅταν ἅπτωνται τοῦ λαοῦ — «когда касаются народа»."
  15: "συνετελέσθη ἡ διαμέτρησις τοῦ οἴκου ἔσωθεν — «завершилось измерение дома внутри»; ἐξήγαγέν με καθ᾽ ὁδὸν τῆς πύλης — «вывел меня по пути ворот»; τὸ ὑπόδειγμα τοῦ οἴκου — «образец (очертание) дома» (ὑπόδειγμα); ἐν διατάξει — «в порядке, по расположению»."
  16: "ἔστη κατὰ νώτου τῆς πύλης — «стал позади ворот»; διεμέτρησεν πεντακοσίους ἐν τῷ καλάμῳ τοῦ μέτρου — «измерил пятьсот мерной тростью»; в LXX единица не названа, слав. «пять сот тростию мерною»; по ст. 17–20 — локти."
  17: "ἐπέστρεψεν πρὸς βορρᾶν — «обратился к северу»; τὸ κατὰ πρόσωπον τοῦ βορρᾶ — «то, что напротив севера»; πήχεις πεντακοσίους — «пятьсот локтей»."
  18: "ἐπέστρεψεν πρὸς θάλασσαν — «обратился к морю», т. е. к западу (θάλασσα — море, запад; слав. «к морю»); τὸ κατὰ πρόσωπον τῆς θαλάσσης — «то, что напротив моря»; 500 локтей."
  19: "ἐπέστρεψεν πρὸς νότον — «обратился к югу»; κατέναντι τοῦ νότου — «напротив юга»; 500 локтей."
  20: "τὰ τέσσαρα μέρη τοῦ αὐτοῦ καλάμου — «четыре стороны одной и той же трости»; διέταξεν αὐτόν — «расположил его»; περίβολον αὐτῶν κύκλῳ — «ограду вокруг них» (περίβολος); πεντακοσίων πρὸς ἀνατολὰς καὶ πεντακοσίων πηχῶν εὖρος — «пятьсот к востоку и пятьсот локтей ширины»; τοῦ διαστέλλειν ἀνὰ μέσον τῶν ἁγίων — «чтобы отделять между святым»; τοῦ προτειχίσματος — «передней стены» (προτείχισμα — внешняя стена, вал; слав. «предстение»); τοῦ ἐν διατάξει τοῦ οἴκου — «что в расположении дома»."
