# jp-box, Иезекииль, глава 42. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 42 (совпадает; см. карту 20/21).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: священнические комнаты и внешние стены. 1–9 пять покоев у северных
# ворот, их длина и ширина, галереи, три яруса; 10–12 такие же покои к югу;
# 13–14 слова спутника: это святые покои, где едят священники-садокиты; там
# полагают святыни и жертвы; одежды служения оставляют здесь; 15–20 измерение
# всего участка: четыре стороны по пятьсот, ограда, отделение святого от несвятого.
# Голоса: 1–12 авторское описание; 13–14 — слова спутника в 「…」 (одна цитата,
# закрывается в конце 14); 15–20 описание.
# «Точка»: в этой главе нет.
# Имена и термины: 外庭[がいてい] (αὐλὴ ἐξωτέρα), 内庭[ないてい] (αὐλὴ ἐσωτέρα),
# 部屋[へや] (ἐξέδρα), 柱廊[ちゅうろう] (περίστυλον), 通路[つうろ] (περίπατος),
# 区切[くぎ]りの建物[たてもの] (τὸ διορίζον), 残[のこ]りの空地[くうち] (τὸ ἀπόλοιπον),
# 測[はか]り竿[ざお] (κάλαμος), キュビト (πῆχυς), サドク (Σαδδουκ), 至聖[しせい] (ἅγια τῶν ἁγίων).
#
