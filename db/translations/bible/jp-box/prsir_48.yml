verses:
  1: "また、預言者[よげんしゃ]エリヤが火[ひ]のように立[た]ち、彼の言葉[ことば]はともしびのように燃[も]えていた。"
  2: "彼は彼らの上[うえ]に飢[う]えを導[みちび]き入[い]れ、その熱心[ねっしん]によって彼らを少[すく]なくした。"
  3: "主[しゅ]の言葉[ことば]によって天[てん]を閉[と]ざし、こうして三度[さんど]、火[ひ]を降[ふ]らせた。"
  4: "エリヤよ、あなたはその驚[おどろ]くべきわざによって、なんと栄光[えいこう]を受[う]けたことか。あなたのように誇[ほこ]ることのできる者[もの]が、だれかいるだろうか。"
  5: "あなたはいと高[たか]き者[もの]の言葉[ことば]によって、死[し]から、よみから死者[ししゃ]を起[お]こした。"
  6: "王[おう]たちを滅[ほろ]びに落[お]とし、栄光[えいこう]ある者[もの]たちをその寝床[ねどこ]から落とした。"
  7: "あなたはシナイで責[せ]めのことばを、ホレブで報[むく]いの裁[さば]きを聞[き]いた。"
  8: "あなたは王[おう]たちに報[むく]いのために油[あぶら]を注[そそ]ぎ、あなたの後[あと]に続[つづ]く預言者[よげんしゃ]たちを後継者[こうけいしゃ]として立[た]てた。"
  9: "あなたは火[ひ]の旋風[つむじかぜ]の中[なか]で、炎[ほのお]の馬[うま]の戦車[せんしゃ]に乗[の]って取[と]り上[あ]げられた。"
  10: "あなたは責[せめ]めの中[なか]に記[しる]され、時[とき]が来[き]て怒[いか]りを静[しず]め、憤[いきどお]りが燃[も]え上[あ]がる前[まえ]にそれをやわらげ、父[ちち]の心[こころ]を子[こ]に向[む]け直[なお]し、ヤコブの部族[ぶぞく]を立[た]て直[なお]すために。"
  11: "あなたを見[み]た者[もの]たち、愛[あい]によって飾[かざ]られた者たちは、幸[しあわ]せである。"
  12: "わたしたちもまた、命[いのち]によって生[い]きるからである。"
  13: "エリヤは旋風[つむじかぜ]の中[なか]に覆[おお]われ、エリシャは彼の霊[れい]に満[み]たされた。エリシャの日々[ひび]には、彼は支配者[しはいしゃ]によって揺[ゆ]るがされることもなく、だれも彼を力[ちから]ずくで支配[しはい]しなかった。"
  14: "どんな言葉[ことば]も彼に打[う]ち勝[か]たず、眠[ねむ]りのうちに彼の体[からだ]が預言[よげん]した。"
  15: "彼は生[い]きている間[あいだ]にしるしを行[おこな]い、死[し]の後[あと]にもそのわざは驚[おどろ]くべきものであった。"
  16: "このすべてのことの後[あと]でも、民[たみ]は悔[く]い改[あらた]めず、自分[じぶん]たちの罪[つみ]から離[はな]れなかった。ついに彼らは自分たちの地[ち]から奪[うば]い取[と]られ、すべての地[ち]に散[ち]らされた。"
  17: "民[たみ]はわずかだけ残[のこ]され、ダビデの家[いえ]には支配者[しはいしゃ]がいた。"
  18: "彼らのうちのある者[もの]たちは神[かみ]に喜[よろこ]ばれることを行[おこな]い、ある者たちは罪[つみ]を増[ふ]やした。"
  19: "エゼキヤは自分[じぶん]の都[みやこ]を堅[かた]くし、その中[なか]に水[みず]を引[ひ]き入[い]れた。鉄[てつ]で岩[いわ]を掘[ほ]り抜[ぬ]き、水[みず]のために泉[いずみ]を造[つく]った。"
  20: "彼の日々[ひび]に、センナケリブが上[のぼ]って来[き]てラブサケを遣[つか]わし、彼は去[さ]った。そして自分[じぶん]の手[て]をシオンの上[うえ]に上[あ]げ、その高[たか]ぶりによって大[おお]いなることを語[かた]った。"
  21: "そのとき、彼らの心[こころ]と手[て]は震[ふる]え、産[う]みの苦[くる]しみにある女[おんな]たちのように苦しんだ。"
  22: "彼らは自分[じぶん]の手[て]を主[しゅ]に向[む]けて広[ひろ]げ、あわれみ深[ふか]い主を呼[よ]び求[もと]めた。"
  23: "すると聖[せい]なる者[もの]は天[てん]から速[すみ]やかに彼らの声[こえ]を聞[き]き、イザヤの手によって彼らを救[すく]い出[だ]した。"
  24: "主[しゅ]はアッシリアの陣営[じんえい]を打[う]ち、その御使[みつか]いが彼らを滅[ほろ]ぼし尽[つ]くした。"
  25: "エゼキヤは主[しゅ]に喜[よろこ]ばれることを行[おこな]い、父[ちち]ダビデの道[みち]に強[つよ]く立[た]った。それは、預言者[よげんしゃ]イザヤが命[めい]じた道であり、イザヤは大[おお]いなる者[もの]で、その幻[まぼろし]において忠実[ちゅうじつ]であった。"
  26: "彼の日々[ひび]に太陽[たいよう]は後[うし]ろへ退[しりぞ]き、王[おう]に命[いのち]を加[くわ]えた。"
  27: "大[おお]いなる霊[れい]によって彼は終[お]わりの日[ひ]を見[み]、シオンで嘆[なげ]き悲[かな]しむ者[もの]たちを慰[なぐさ]めた。"
  28: "彼は世々[よよ]に至[いた]るまで起[お]こるべきことと、まだ起[お]こる前[まえ]の隠[かく]されたことを示[しめ]した。"

notes:
  1: "Καὶ ἀνέστη Ηλιας προφήτης ὡς πῦρ — «и восстал Илия пророк, как огонь» (ἀνίστημι — восставать; πῦρ — огонь). ὁ λόγος αὐτοῦ ὡς λαμπὰς ἐκαίετο — «слово его, как светильник, горело» (λαμπάς — факел, лампада; καίω — жечь, гореть). Слав. «яко свеща горяше». ὡς πῦρ отнесено к глаголу: 火のように立った."
  2: "ἐπήγαγεν ἐπ᾿ αὐτοὺς λιμόν — «навёл на них голод» (ἐπάγω — наводить; λιμός — голод): засуха при Ахаве (3 Цар 17–18). τῷ ζήλῳ αὐτοῦ ὠλιγοποίησεν αὐτούς — «ревностью своей умалил их» (ζῆλος — ревность; ὀλιγοποιέω — уменьшать); слав. «ревностию своею умали я»."
  3: "ἐν λόγῳ κυρίου ἀνέσχεν οὐρανόν — «словом Господним удержал небо» (ἀνέχω — удерживать), то есть заключил его от дождя. κατήγαγεν οὕτως τρὶς πῦρ — «низвёл так трижды огонь» (κατάγω — низводить; τρίς — трижды): огонь на Кармиле и на посланных за Илией (3 Цар 18:38; 4 Цар 1:10–12). Слав. «сведе тако трижды огнь с небесе»."
  4: "ὡς ἐδοξάσθης, Ηλια, ἐν θαυμασίοις σου — «как ты прославился, Илия, в чудесах твоих» (θαυμάσιον — дивное). τίς ὅμοιός σοι καυχᾶσθαι — «кто подобен тебе в том, чтобы хвалиться» (καυχάομαι — хвалиться; инфинитив цели): риторический вопрос. Слав. «кто подобен тебе похвалитися»."
  5: "ὁ ἐγείρας νεκρὸν ἐκ θανάτου — «воздвигший мёртвого от смерти» (ἐγείρω — поднимать, воскрешать): воскрешение сына вдовы в Сарепте (3 Цар 17:17–24). ἐξ ᾅδου ἐν λόγῳ ὑψίστου — «из ада словом Всевышнего» (ᾅδης — преисподняя, よみ). Слав. «воздвигнув мертвеца от смерти и из ада словом вышняго». Причастия 5–10 относятся к Илии."
  6: "ὁ καταγαγὼν βασιλεῖς εἰς ἀπώλειαν — «низведший царей в погибель» (κατάγω; ἀπώλεια — погибель): огонь на Охозию и его людей (4 Цар 1). δεδοξασμένους ἀπὸ κλίνης αὐτῶν — «прославленных с ложа их» (κλίνη — ложе): о смерти царей. Слав. «сведый цари в пагубу и прославленныя от одра их»."
  7: "ἀκούων ἐν Σινα ἐλεγμόν — «слышащий на Синае обличение» (ἐλεγμός — обличение, укор): явление Бога Илии на Хориве (3 Цар 19:9–18). ἐν Χωρηβ κρίματα ἐκδικήσεως — «на Хориве суды отмщения» (κρίμα — суд; ἐκδίκησις — отмщение); слав. «в хориве судбы отмщения». Синай и Хорив — одно место, названы оба."
  8: "ὁ χρίων βασιλεῖς εἰς ἀνταπόδομα — «помазующий царей на воздаяние» (χρίω — помазывать; ἀνταπόδομα — воздаяние): Илия помазал Азаила и Ииуя (3 Цар 19:15–16). προφήτας διαδόχους μετ᾿ αὐτόν — «пророков, преемников после него» (διάδοχος — преемник): Елисей. Слав. «помазуяй цари на воздаяние и пророки преемники по себе»."
  9: "ὁ ἀναλημφθεὶς ἐν λαίλαπι πυρός — «взятый в вихре огня» (ἀναλαμβάνω — брать вверх; λαῖλαψ — вихрь, буря). ἐν ἅρματι ἵππων πυρίνων — «на колеснице коней огненных» (ἅρμα — колесница); слав. «взявыйся вихром огненным на колеснице коней огненных». Вознесение Илии (4 Цар 2:11)."
  10: "ὁ καταγραφεὶς ἐν ἐλεγμοῖς — «записанный в обличениях» (καταγράφω — записывать; ἐλεγμός — обличение): Илия как обличитель, чьё слово записано у пророков. εἰς καιροὺς κοπάσαι ὀργήν — «на времена, чтобы утишить гнев» (κοπάζω — успокаивать; ὀργή — гнев). πρὸ θυμοῦ — «прежде ярости» (θυμός — ярость). ἐπιστρέψαι καρδίαν πατρὸς πρὸς υἱόν — «обратить сердце отца к сыну» (ср. Мал 4:5–6). καταστῆσαι φυλὰς Ιακωβ — «восстановить колена Иакова» (καθίστημι — ставить, восстанавливать)."
  11: "μακάριοι οἱ ἰδόντες σε — «блаженны видевшие тебя». οἱ ἐν ἀγαπήσει κεκοιμημένοι — «почившие в любви» (κοιμάομαι — почивать, умирать); слав. читает «любовию украшеннии» («украшенные любовью»), поэтому в тексте 愛によって飾られた者たち, а вариант LXX — здесь."
  12: "καὶ γὰρ ἡμεῖς ζωῇ ζησόμεθα — «ибо и мы жизнью поживём» (ζωή — жизнь; ζάω — жить)."
  13: "Ηλιας ὃς ἐν λαίλαπι ἐσκεπάσθη — «Илия, который был сокрыт вихрем» (σκεπάζω — покрывать, скрывать). Ελισαιε ἐνεπλήσθη πνεύματος αὐτοῦ — «Елисей исполнился духа его» (πνεῦμα — дух): преемство пророческого духа (4 Цар 2:9–15). ἐν ἡμέραις αὐτοῦ οὐκ ἐσαλεύθη ὑπὸ ἄρχοντος — «во дни его не поколебался от князя» (σαλεύω — колебать; ἄρχων — начальник). οὐ κατεδυνάστευσεν αὐτὸν οὐδείς — «никто не одолел его» (καταδυναστεύω — господствовать силой). 13."
  14: "πᾶς λόγος οὐχ ὑπερῆρεν αὐτόν — «всякое слово не превзошло его» (ὑπεραίρω — подниматься выше, превосходить): никто не одолел его словом. ἐν κοιμήσει ἐπροφήτευσεν τὸ σῶμα αὐτοῦ — «в успении пророчествовало тело его» (κοίμησις — успение, сон): кости Елисея воскресили мёртвого (4 Цар 13:21). Слав. «во успении пророчествова тело его»."
  15: "ἐν ζωῇ αὐτοῦ ἐποίησεν τέρατα — «при жизни своей он творил знамения» (τέρας — знамение, чудо). ἐν τελευτῇ θαυμάσια τὰ ἔργα αὐτοῦ — «при кончине дивны дела его» (τελευτή — кончина; θαυμάσιος — дивный). Слав. «и в житии своем сотвори чудеса, и во умертвии дивна дела его»."
  16: "Ἐν πᾶσιν τούτοις οὐ μετενόησεν ὁ λαός — «при всём этом не покаялся народ» (μετανοέω — каяться, менять ум). οὐκ ἀπέστησαν ἀπὸ τῶν ἁμαρτιῶν αὐτῶν — «не отступили от грехов своих» (ἀφίστημι — отступать). ἕως ἐπρονομεύθησαν ἀπὸ γῆς αὐτῶν — «доколе не были расхищены из земли своей» (προνομεύω — разорять, брать добычу): пленение. διεσκορπίσθησαν ἐν πάσῃ τῇ γῇ — «рассеяны по всей земле» (διασκορπίζω — рассеивать)."
  17: "κατελείφθη ὁ λαὸς ὀλιγοστός — «остался народ немногочисленный» (ὀλιγοστός — малочисленный). ἄρχων ἐν τῷ οἴκῳ Δαυιδ — «князь в доме Давида»: царский род сохранён."
  18: "τινὲς μὲν αὐτῶν ἐποίησαν τὸ ἀρεστόν — «некоторые из них делали угодное» (ἀρεστός — угодный). τινὲς δὲ ἐπλήθυναν ἁμαρτίας — «некоторые же умножили грехи» (πληθύνω — умножать)."
  19: "Εζεκιας ὠχύρωσεν τὴν πόλιν αὐτοῦ — «Езекия укрепил город свой» (ὀχυρόω — укреплять). εἰσήγαγεν εἰς μέσον αὐτῆς ὕδωρ — «ввёл внутрь его воду» (εἰσάγω — вводить): водовод к Силоаму (4 Цар 20:20). ὤρυξεν σιδήρῳ ἀκρότομον — «пробил железом скалу» (ὀρύσσω — копать; ἀκρότομον — крутая скала, камень). ᾠκοδόμησεν κρήνας εἰς ὕδατα — «устроил источники для вод» (κρήνη — источник). Слав. «ископа железом камень и созда источники водам»."
  20: "ἐν ἡμέραις αὐτοῦ ἀνέβη Σενναχηριμ — «во дни его поднялся Сеннахирим» (ἀναβαίνω — восходить, идти на приступ). ἀπέστειλεν Ραψακην — «послал Рабсака» (в тексте ラブサケ, как в 4 Цар 18); слав. «посла рапсака». ἀπῆρεν — «он ушёл» (ἀπαίρω — отходить), но слово значит и «поднял», поэтому в тексте 去った, а двусмысленность отмечена здесь. ἐπῆρεν χεῖρα αὐτοῦ ἐπὶ Σιων — «поднял руку свою на Сион». ἐμεγαλαύχησεν ἐν ὑπερηφανίᾳ αὐτοῦ — «величался в гордости своей» (μεγαλαυχέω — величаться; ὑπερηφανία — гордость)."
  21: "τότε ἐσαλεύθησαν καρδίαι καὶ χεῖρες αὐτῶν — «тогда поколебались сердца и руки их» (σαλεύω — колебать). ὠδίνησαν ὡς αἱ τίκτουσαι — «они мучились, как рождающие» (ὠδίνω — рожать в муках; τίκτω — рождать): образ страха. Слав. «поболеша яко раждающыя»."
  22: "ἐπεκαλέσαντο τὸν κύριον τὸν ἐλεήμονα — «они призвали Господа милостивого» (ἐλεήμων — милосердный). ἐκπετάσαντες τὰς χεῖρας αὐτῶν πρὸς αὐτόν — «простёрши руки свои к Нему» (ἐκπετάννυμι — распростирать)."
  23: "ὁ ἅγιος ἐξ οὐρανοῦ ταχὺ ἐπήκουσεν αὐτῶν — «Святой с неба скоро услышал их» (ἐπακούω — выслушивать; ταχύ — скоро). ἐλυτρώσατο αὐτοὺς ἐν χειρὶ Ησαιου — «избавил их рукою Исаии» (λυτρόω — выкупать, избавлять)."
  24: "ἐπάταξεν τὴν παρεμβολὴν τῶν Ἀσσυρίων — «поразил стан ассирийцев» (πατάσσω — ударять, поражать; παρεμβολή — стан, лагерь). ἐξέτριψεν αὐτοὺς ὁ ἄγγελος αὐτοῦ — «истребил их Ангел Его» (ἐκτρίβω — стирать, истреблять; ἄγγελος — ангел, посланник). Слав. «порази полки ассирийския, и сокруши я ангел его»."
  25: "ἐποίησεν γὰρ Εζεκιας τὸ ἀρεστὸν κυρίῳ — «ибо Езекия делал угодное Господу». ἐνίσχυσεν ἐν ὁδοῖς Δαυιδ τοῦ πατρὸς αὐτοῦ — «укрепился на путях Давида, отца своего» (ἐνισχύω — укрепляться). ἃς ἐνετείλατο Ησαιας ὁ προφήτης ὁ μέγας — «которые заповедал Исаия, пророк великий» (ἐντέλλομαι — заповедовать). πιστὸς ἐν ὁράσει αὐτοῦ — «верный в видении своём» (ὅρασις — видение)."
  26: "ἐν ταῖς ἡμέραις αὐτοῦ ἀνεπόδισεν ὁ ἥλιος — «во дни его солнце отступило назад» (ἀναποδίζω — идти назад, отступать): знамение Езекии (4 Цар 20:9–11; Ис 38:8). προσέθηκεν ζωὴν βασιλεῖ — «прибавил жизни царю» (προστίθημι — прибавлять). Слав. «воспятися солнце, и приложи жития цареви»."
  27: "πνεύματι μεγάλῳ εἶδεν τὰ ἔσχατα — «великим духом он увидел последнее» (πνεῦμα — дух; ἔσχατα — последнее, концы). παρεκάλεσεν τοὺς πενθοῦντας ἐν Σιων — «утешил сетующих в Сионе» (παρακαλέω — утешать; πενθέω — плакать, сетовать). Слав. «духом велиим виде последняя и утеши сетующыя в сионе»."
  28: "ἕως τοῦ αἰῶνος ὑπέδειξεν τὰ ἐσόμενα — «до века он показал имеющее быть» (ὑποδείκνυμι — показывать; ἐσόμενα — будущее). τὰ ἀπόκρυφα πρὶν ἢ παραγενέσθαι αὐτά — «сокровенное, прежде нежели оно наступило» (ἀπόκρυφος — скрытый; παραγίνομαι — приходить, наступать). Слав. «даже до века показа будущая и сокровеная, прежде неже приити им»."
