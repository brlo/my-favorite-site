# ru (Синодальный) — только для понимания, не источник. jp-joc в главе отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: мятеж Корея, Датана и Авирона (1–3), речь Моисея о святости (4–11),
# отказ Датана и Авирона (12–15), кадильницы и явление славы (16–19),
# гнев Бога и ходатайство Моисея (20–24), увещание народу (25–27),
# знамение: земля поглощает мятежников (28–34), огонь и 250 мужей (35),
# медные кадильницы — покрытие жертвенника (36–40), ропот и поражение (41–50).
# Нумерация — по gr-lxx-byz: 50 стихов (как в csl и ru). В jp-ni 35 стихов,
# поэтому с 36-го сравнение с ним не проводится.
# Красного и синего нет. Речи: мятежников — 「…」 (3, 12–14, 41); Моисея — 「…」
# (5–7, 8–11, 15, 16–17, 26, 28–30, 46); Аарона нет; Бога — 「…」 (21, 24, 37–38, 45).
# Слова народа в 34 — 「…」 (в повествовании).
# 〔…〕 нет: все слова есть в gr-lxx-byz. Слав. добавления (16:24 «и Дафана и Авирона»,
# 16:37 «в душах их») в текст не внесены — см. notes.
# Сносок ⟨…⟩ нет: 香炉, 陰府, 記念, レビ人 уже в корпусе, остальное понятно.
