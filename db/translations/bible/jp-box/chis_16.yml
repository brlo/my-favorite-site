verses:
  1: "コラはイサアルの子[こ]、カアトの孫[まご]、レビの曾孫[ひまご]、ダタンとアビランはエリアブの子[こ]ら、アウナンはルベンの子[こ]ファレトの子[こ]である。彼[かれ]らは語[かた]った。"
  2: "そして、モーセに逆[さか]らって立[た]ち上[あ]がった。イスラエルの子[こ]らのうちの二百五十人[にひゃくごじゅうにん]の者[もの]たち、すなわち会衆[かいしゅう]の長[かしら]で、評議[ひょうぎ]に招[まね]かれる者[もの]、名[な]の知[し]れた人[ひと]々[びと]も共[とも]に立[た]ち上[あ]がった。"
  3: "彼[かれ]らはモーセとアロンに集[あつ]まって言[い]った。「もう十分[じゅうぶん]でしょう。会衆[かいしゅう]はみな、すべて聖[せい]なる者[もの]であり、主[しゅ]は彼[かれ]らの間[あいだ]におられる。なぜ、あなたがたは主[しゅ]の会衆[かいしゅう]の上[うえ]に立[た]とうとするのか。」"
  4: "モーセはこれを聞[き]いて、顔[かお]を地[ち]につけて伏[ふ]した。"
  5: "彼[かれ]はコラとその会衆[かいしゅう]全体[ぜんたい]に言[い]った。「神[かみ]は、ご自分[じぶん]のものと聖[せい]なる者[もの]とを顧[かえり]みて知[し]っておられる。そして、ご自分[じぶん]に近[ちか]づけた。ご自分[じぶん]のために選[えら]ばれた者[もの]を、ご自分[じぶん]に近[ちか]づけられた。"
  6: "こうしなさい。コラよ、あなたとあなたの会衆[かいしゅう]全体[ぜんたい]は、自分[じぶん]たちのために香炉[こうろ]を取[と]りなさい。"
  7: "そして、その中[なか]に火[ひ]を入[い]れ、主[しゅ]の前[まえ]に香[こう]をたきなさい。明日[あす]のことである。主[しゅ]が選[えら]ばれる者[もの]、その者[もの]が聖[せい]である。レビ人[びと]よ、あなたがたはもう十分[じゅうぶん]だ。」"
  8: "モーセはコラに言[い]った。「聞[き]きなさい、レビ人[びと]よ。"
  9: "イスラエルの神[かみ]があなたがたをイスラエルの会衆[かいしゅう]から分[わ]け離[はな]し、ご自分[じぶん]に近[ちか]づけて、主[しゅ]の幕屋[まくや]の務[つと]めを果[は]たさせ、会衆[かいしゅう]の前[まえ]に立[た]って彼[かれ]らに仕[つか]えさせられたことは、あなたがたにとって小[ちい]さなことなのか。"
  10: "神[かみ]はあなたと、あなたと共[とも]にいるあなたの兄弟[きょうだい]、レビの子[こ]らすべてを近[ちか]づけられた。それでも、あなたがたは祭司[さいし]の務[つと]めを求[もと]めるのか。"
  11: "あなたと、あなたに集[あつ]まっている会衆[かいしゅう]全体[ぜんたい]が、神[かみ]に逆[さか]らって集[あつ]まっている。アロンとは何[なん]なのか。あなたがたはなぜ、彼[かれ]についてつぶやくのか。」"
  12: "モーセはエリアブの子[こ]ら、ダタンとアビランを呼[よ]びに人[ひと]を遣[つか]わした。しかし、彼[かれ]らは言[い]った。「わたしたちは上[のぼ]って行[ゆ]かない。"
  13: "あなたがわたしたちを乳[ちち]と蜜[みつ]の流[なが]れる地[ち]から導[みちび]き上[あ]げて、荒野[こうや]で殺[ころ]そうとしたことは、小[ちい]さなことか。あなたはさらに、わたしたちの上[うえ]に立[た]つ支配者[しはいしゃ]だというのか。"
  14: "あなたがわたしたちを乳[ちち]と蜜[みつ]の流[なが]れる地[ち]に導[みちび]き入[い]れ、畑[はたけ]やぶどう畑[ばたけ]を嗣業[しぎょう]として与[あた]えたのなら、あなたはあの人[ひと]々[びと]の目[め]をえぐり出[だ]しただろうに。わたしたちは上[のぼ]って行[ゆ]かない。」"
  15: "モーセは非常[ひじょう]に心[こころ]を痛[いた]めて主[しゅ]に言[い]った。「どうか、彼[かれ]らの供[そな]え物[もの]に目[め]を留[と]めないでください。わたしは彼[かれ]らのうち誰[だれ]からも、欲[ほ]しがられるもの一[ひと]つ取[と]ったことがなく、誰[だれ]も害[がい]したことがありません。」"
  16: "モーセはコラに言[い]った。「明日[あす]、あなたは自分[じぶん]の会衆[かいしゅう]を聖別[せいべつ]し、あなたも彼[かれ]らもアロンも、主[しゅ]の前[まえ]に備[そな]えて立[た]ちなさい。"
  17: "そして、あなたがたはそれぞれ自分[じぶん]の香炉[こうろ]を取[と]り、その中[なか]に香[こう]を入[い]れて、主[しゅ]の前[まえ]に持[も]って来[き]なさい。二百五十[にひゃくごじゅう]の香炉[こうろ]である。あなたもアロンも、それぞれ自分[じぶん]の香炉[こうろ]を取りなさい。」"
  18: "彼[かれ]らはそれぞれ自分[じぶん]の香炉[こうろ]を取[と]り、火[ひ]を入[い]れ、その上[うえ]に香[こう]を置[お]いた。モーセとアロンも、証[あかし]の幕屋[まくや]の入口[いりぐち]に立[た]った。"
  19: "コラはその会衆[かいしゅう]全体[ぜんたい]を彼[かれ]らに逆[さか]らわせて、証[あかし]の幕屋[まくや]の入口[いりぐち]に集[あつ]めた。すると、主[しゅ]の栄光[えいこう]が会衆[かいしゅう]全体[ぜんたい]に現[あらわ]れた。"
  20: "主[しゅ]はモーセとアロンに語[かた]って言[い]われた。"
  21: "「この会衆[かいしゅう]の間[あいだ]から離[はな]れなさい。わたしは彼[かれ]らを一瞬[いっしゅん]のうちに滅[ほろ]ぼす。」"
  22: "彼[かれ]らは顔[かお]を地[ち]につけて伏[ふ]し、言[い]った。「神[かみ]よ、すべての霊[れい]とすべての肉[にく]の神[かみ]よ。一人[ひとり]の人[ひと]が罪[つみ]を犯[おか]したからといって、あなたの怒[いか]りが会衆[かいしゅう]全体[ぜんたい]に及[およ]ぶのですか。」"
  23: "主[しゅ]はモーセに語[かた]って言[い]われた。"
  24: "「会衆[かいしゅう]に語[かた]って言[い]いなさい。コラの会衆[かいしゅう]の周[まわ]りから退[しりぞ]きなさい。」"
  25: "モーセは立[た]って、ダタンとアビランのところへ行[い]った。イスラエルのすべての長老[ちょうろう]たちも彼[かれ]と共[とも]に行[い]った。"
  26: "彼[かれ]は会衆[かいしゅう]に語[かた]って言[い]った。「これらの頑[かた]くなな人[ひと]々[びと]の天幕[てんまく]から離[はな]れなさい。彼[かれ]らのものには何[なに]一[ひと]つ触[ふ]れてはならない。彼[かれ]らのすべての罪[つみ]によって、あなたがたも共[とも]に滅[ほろ]びないためである。」"
  27: "彼[かれ]らはコラの天幕[てんまく]の周[まわ]りから退[しりぞ]いた。ダタンとアビランは出[で]て来[き]て、自分[じぶん]たちの天幕[てんまく]の入口[いりぐち]に立[た]った。彼[かれ]らの妻[つま]たち、子[こ]どもたち、またその荷物[にもつ]も共[とも]にいた。"
  28: "モーセは言[い]った。「これによって、主[しゅ]がこのすべてのわざを行[おこな]うためにわたしを遣[つか]わしたこと、それがわたし自身[じしん]から出[で]たものでないことを、あなたがたは知[し]るであろう。"
  29: "もしこの者[もの]たちが、すべての人[ひと]と同じ[おな]じように死[し]に、すべての人[ひと]が受[う]ける訪[おとず]れを受[う]けるなら、主[しゅ]がわたしを遣[つか]わしたのではない。"
  30: "しかし、主[しゅ]が目[め]に見[み]える不思議[ふしぎ]をもって示[しめ]し、地[ち]が口[くち]を開[ひら]いて彼[かれ]らとその家[いえ]々[いえ]、その天幕[てんまく]と彼[かれ]らのすべてのものを飲[の]み込[こ]み、彼[かれ]らが生[い]きたまま陰府[よみ]に下[くだ]るなら、あなたがたはこれらの人[ひと]々[びと]が主[しゅ]を怒[いか]らせたことを知[し]るであろう。」"
  31: "彼[かれ]がこれらのすべての言葉[ことば]を語[かた]り終[お]えると、彼[かれ]らの足元[あしもと]で地[ち]が裂[さ]けた。"
  32: "地[ち]は口[くち]を開[ひら]いて彼[かれ]らとその家[いえ]々[いえ]、コラと共[とも]にいたすべての人[ひと]々[びと]、およびその家畜[かちく]を飲[の]み込[こ]んだ。"
  33: "彼[かれ]らと彼[かれ]らのすべてのものは生[い]きたまま陰府[よみ]に下[くだ]り、地[ち]が彼[かれ]らを覆[おお]った。彼[かれ]らは会衆[かいしゅう]の間[あいだ]から滅[ほろ]びた。"
  34: "彼[かれ]らの周[まわ]りにいたイスラエルはみな、彼[かれ]らの叫[さけ]び声[ごえ]を聞[き]いて逃[に]げた。「わたしたちまで地[ち]に飲[の]み込[こ]まれないように」と言[い]ってである。"
  35: "また、主[しゅ]のところから火[ひ]が出[で]て、香[こう]をたきに来[き]た二百五十人[にひゃくごじゅうにん]の者[もの]たちを焼[や]き尽[く]くした。"
  36: "主[しゅ]はモーセに言[い]われた。"
  37: "また、祭司[さいし]であるアロンの子[こ]エレアザルにも言[い]われた。「あなたがたは焼[や]かれた者[もの]たちの間[あいだ]から青銅[せいどう]の香炉[こうろ]を取[と]り上[あ]げ、この異[こと]なる火[ひ]をそこにまき散[ち]らしなさい。香炉[こうろ]は聖[せい]となったからである。"
  38: "罪[つみ]を犯[おか]したこれらの者[もの]たちの香炉[こうろ]は、彼[かれ]らの命[いのち]と引[ひ]き換[か]えに聖[せい]となった。それを打[う]ち延[の]ばした板[いた]にして、祭壇[さいだん]の覆[おお]いとしなさい。それらは主[しゅ]の前[まえ]に献[ささ]げられて聖[せい]となったので、イスラエルの子[こ]らへのしるしとなるからである。」"
  39: "祭司[さいし]アロンの子[こ]エレアザルは、焼[や]かれた者[もの]たちが献[ささ]げた青銅[せいどう]の香炉[こうろ]を取[と]り、それを祭壇[さいだん]の覆[おお]いとした。"
  40: "それはイスラエルの子[こ]らへの記念[きねん]であり、アロンの子孫[しそん]でない他[た]の民族[みんぞく]の者[もの]が、だれも主[しゅ]の前[まえ]に香[こう]をたきに近[ちか]づかないためである。そうすれば、コラとその仲間[なかま]に起[おこ]ったようにはならない。主[しゅ]がモーセによって語[かた]られたとおりである。"
  41: "その翌日[よくじつ]、イスラエルの子[こ]らはみな、モーセとアロンにつぶやいて言[い]った。「あなたがたが主[しゅ]の民[たみ]を殺[ころ]したのだ。」"
  42: "会衆[かいしゅう]がモーセとアロンに集[あつ]まって来[き]たとき、その会衆[かいしゅう]は証[あかし]の幕屋[まくや]へ向[む]かって進[すす]んだ。すると、雲[くも]が幕屋[まくや]を覆[おお]い、主[しゅ]の栄光[えいこう]が現[あらわ]れた。"
  43: "モーセとアロンは証[あかし]の幕屋[まくや]の正面[しょうめん]へ進[すす]んだ。"
  44: "主[しゅ]はモーセとアロンに語[かた]って言[い]われた。"
  45: "「この会衆[かいしゅう]の間[あいだ]から退[しりぞ]きなさい。わたしは彼[かれ]らを一瞬[いっしゅん]のうちに滅[ほろ]ぼす。」しかし、モーセとアロンは顔[かお]を地[ち]につけて伏[ふ]した。"
  46: "モーセはアロンに言[い]った。「香炉[こうろ]を取[と]り、祭壇[さいだん]の火[ひ]をその中[なか]に入[い]れ、その上[うえ]に香[こう]を置[お]いて、急[いそ]いで会衆[かいしゅう]のところへ持[も]って行[い]き、彼[かれ]らのために贖[あがな]いをしなさい。主[しゅ]の前[まえ]から怒[いか]りが出[で]て、民[たみ]を打[う]ち滅[ほろ]ぼし始[はじ]めているからである。」"
  47: "アロンはモーセが言[い]ったとおりに香炉[こうろ]を取[と]り、会衆[かいしゅう]の中[なか]へ走[はし]って行[い]った。すでに民[たみ]の間[あいだ]では災[わざわ]いが始[はじ]まっていた。彼[かれ]は香[こう]を置[お]き、民[たみ]のために贖[あがな]いをした。"
  48: "彼[かれ]は死[し]んだ者[もの]と生[い]きている者[もの]の間[あいだ]に立[た]ち、災[わざわ]いは止[や]んだ。"
  49: "災[わざわ]いで死[し]んだ者[もの]は、コラのことで死[し]んだ者[もの]たちを除[のぞ]いて、一万四千七百人[いちまんよんせんななひゃくにん]であった。"
  50: "アロンは証[あかし]の幕屋[まくや]の入口[いりぐち]にいるモーセのところへ戻[もど]った。災[わざわ]いは止[や]んでいた。"

notes:
  1: "ἐλάλησεν Κορε — «говорил Корей» (в масоретском тексте «взял»; в базе ἐλάλησεν, поэтому 語った). υἱὸς Ισσααρ υἱοῦ Κααθ υἱοῦ Λευι — сын Иссаара, сына Каафа, сына Левия (цепочка родительных; イサアル и カアト — как в Исх 6:18,21). Αυν υἱὸς Φαλεθ υἱοῦ Ρουβην — Авнан, сын Фалефа, сына Рувима."
  2: "ἀνέστησαν ἔναντι Μωυσῆ — восстали против Моисея (ἀνίστημι; ἔναντι с родительным). πεντήκοντα καὶ διακόσιοι — двести пятьдесят (порядок чисел как в греч.). ἀρχηγοὶ συναγωγῆς — начальники общества. σύγκλητοι βουλῆς — «созываемые на совет» (σύγκλητος; слав. «сигклитики совета»). ἄνδρες ὀνομαστοί — люди именитые (ὀνομαστός)."
  3: "συνέστησαν ἐπὶ Μωυσῆν — собрались против Моисея (συνίστημι). Ἐχέτω ὑμῖν — «довольно вам» (ἔχω с дативом; слав. «довлеет вам»). πάντες ἅγιοι — все святы. κατανίστασθε — «встаёте над» (κατανίστημι), т. е. ставите себя выше."
  4: "ἀκούσας … ἔπεσεν ἐπὶ πρόσωπον — услышав, пал на лицо своё."
  5: "Ἐπέσκεπται καὶ ἔγνω — «посетил и узнал» (ἐπισκέπτομαι, γινώσκω). τοὺς ὄντας αὐτοῦ — тех, кто Его, своих. προσηγάγετο πρὸς ἑαυτόν — приблизил к Себе (προσάγω). οὓς ἐξελέξατο — кого избрал (ἐκλέγομαι). Слав. во второй половине читает отрицание («ихже не избра себе, не приведе к себе»); в gr-lxx-byz его нет — переводим по греч."
  6: "λάβετε ὑμῖν αὐτοῖς πυρεῖα — возьмите себе кадильницы (πυρεῖον — 香炉; ср. Лев 10:1). Κορε καὶ πᾶσα ἡ συναγωγὴ αὐτοῦ — обращение к Корею и всему его обществу."
  7: "ἐπίθετε ἐπ᾽ αὐτὰ πῦρ … θυμίαμα — положите на них огонь и курение (ἐπιτίθημι). ἔσται ὁ ἀνήρ, ὃν ἂν ἐκλέξηται κύριος, οὗτος ἅγιος — тот, кого изберёт Господь, будет свят. ἱκανούσθω ὑμῖν — «довольно вам» (ἱκανόω; слав. «да довлеют вам»). υἱοὶ Λευι — レビ人."
  8: "Εἰσακούσατέ μου — послушайте меня (εἰσακούω с родительным). υἱοὶ Λευι — сыны Левия, レビ人."
  9: "διέστειλεν — отделил (διαστέλλω). προσηγάγετο ὑμᾶς πρὸς ἑαυτόν — приблизил вас к Себе. λειτουργεῖν τὰς λειτουργίας — совершать служения (λειτουργία). παρίστασθαι ἔναντι τῆς συναγωγῆς — предстоять пред обществом (παρίστημι). λατρεύειν αὐτοῖς — служить им (λατρεύω)."
  10: "προσηγάγετό σε — приблизил тебя (переход к единственному числу). ζητεῖτε ἱερατεύειν — ищете священства (ἱερατεύω; слав. «просите священствовати»)."
  11: "συνηθροισμένη πρὸς τὸν θεόν — собравшееся против Бога (συναθροίζω; πρός с винительным «против»). Ααρων τίς ἐστιν — «что такое Аарон?» (риторический вопрос). διαγογγύζετε κατ᾽ αὐτοῦ — ропщете на него (διαγογγύζω)."
  12: "καλέσαι Δαθαν καὶ Αβιρων — позвать Датана и Авирона (καλέω, инфинитив цели). Οὐκ ἀναβαίνομεν — «не пойдём» (букв. «не восходим»); отказ прийти."
  13: "μὴ μικρὸν τοῦτο — «разве это мало?». ἀνήγαγες … ἐκ γῆς ῥεούσης γάλα καὶ μέλι — вывел из земли, текущей молоком и мёдом (ирония: так они называют Египет). ἀποκτεῖναι — убить (ἀποκτείνω). κατάρχεις ἡμῶν ἄρχων — «ты начальствуешь над нами как начальник» (удвоение корня ἄρχω)."
  14: "εἰ καὶ … εἰσήγαγες … καὶ ἔδωκας — если бы ты и ввёл… и дал (ироническое условие). τοὺς ὀφθαλμοὺς τῶν ἀνθρώπων ἐκείνων ἂν ἐξέκοψας — «ты бы выколол глаза тех людей» (ἐκκόπτω), т. е. ослепил бы их дарами; Син. «хочешь ослепить» — иное понимание."
  15: "ἐβαρυθύμησεν σφόδρα — сильно отяготился духом, огорчился (βαρυθυμέω). Μὴ προσχῇς εἰς τὴν θυσίαν αὐτῶν — не призри на жертву их (προσέχω). ἐπιθύμημα — желаемое (слав. «похотение»; Син. «осла» — от евр.). ἐκάκωσα — обидел, сделал зло (κακόω)."
  16: "Ἁγίασον τὴν συναγωγήν σου — освяти своё общество (ἁγιάζω). γίνεσθε ἕτοιμοι ἔναντι κυρίου — будьте готовы пред Господом. σὺ καὶ αὐτοὶ καὶ Ααρων — ты, они и Аарон."
  17: "λάβετε ἕκαστος τὸ πυρεῖον αὐτοῦ — возьмите каждый свою кадильницу. ἐπιθήσετε ἐπ᾽ αὐτὰ θυμίαμα — положите на них курение. πεντήκοντα καὶ διακόσια πυρεῖα — двести пятьдесят кадильниц."
  18: "ἐπέθηκαν … ἐπέβαλον — положили (ἐπιτίθημι, ἐπιβάλλω). ἔστησαν παρὰ τὰς θύρας — стали у дверей (ἵστημι). Моисей и Аарон стоят у входа отдельно от двухсот пятидесяти."
  19: "ἐπισυνέστησεν ἐπ᾽ αὐτοὺς … τὴν πᾶσαν αὐτοῦ συναγωγήν — собрал против них всё своё общество (ἐπισυνίστημι). ὤφθη ἡ δόξα κυρίου — явилась слава Господня."
  20: "εἶπεν κύριος πρὸς Μωυσῆν καὶ Ααρων λέγων — 主はモーセとアロンに語って言われた."
  21: "Ἀποσχίσθητε ἐκ μέσου — отделитесь из среды (ἀποσχίζομαι). ἐξαναλώσω … εἰς ἅπαξ — истреблю разом, в один миг (ἐξαναλίσκω; εἰς ἅπαξ)."
  22: "ἔπεσαν ἐπὶ πρόσωπον αὐτῶν — пали на лица свои. Θεὸς θεὸς τῶν πνευμάτων καὶ πάσης σαρκός — Боже духов и всякой плоти (обращение). εἰ ἄνθρωπος εἷς ἥμαρτεν — если один человек согрешил (εἰ в вопросе). ἐπὶ πᾶσαν τὴν συναγωγὴν ὀργὴ κυρίου; — на всё общество гнев Господень? (эллипсис)."
  23: "εἶπεν κύριος πρὸς Μωυσῆν λέγων — 主はモーセに語って言われた."
  24: "Ἀναχωρήσατε κύκλῳ ἀπὸ τῆς συναγωγῆς Κορε — отступите кругом от общества Корея (ἀναχωρέω). Слав. добавляет «и Дафана и Авирона»; в gr 16:24 этих имён нет (bracket_check: δαθαν в 16:24 — НЕТ), в текст не внесено."
  25: "ἀνέστη … ἐπορεύθη — встал и пошёл. πρεσβύτεροι Ισραηλ — старейшины Израиля (長老)."
  26: "ἀπὸ τῶν σκηνῶν τῶν ἀνθρώπων τῶν σκληρῶν — от шатров людей жестоких, упорных (σκληρός). μὴ ἅπτεσθε ἀπὸ πάντων — не прикасайтесь ни к чему (ἅπτομαι). μὴ συναπόλησθε — чтобы не погибнуть вместе (συναπόλλυμι)."
  27: "ἀπέστησαν … κύκλῳ — отступили кругом. εἱστήκεισαν — стояли (плюсквамперфект ἵστημι). ἀποσκευή — имущество, обоз (荷物)."
  28: "Ἐν τούτῳ γνώσεσθε — по этому узнаете. ὅτι οὐκ ἀπ᾽ ἐμαυτοῦ — что не от себя (ἀπ᾽ ἐμαυτοῦ)."
  29: "κατὰ θάνατον πάντων ἀνθρώπων — «по смерти всех людей», т. е. обычной смертью. κατ᾽ ἐπίσκεψιν … ἐπισκοπὴ ἔσται αὐτῶν — «по посещению всех людей будет посещение их», т. е. обычный жребий (ἐπισκοπή). οὐχὶ κύριος ἀπέσταλκέν με — не Господь ли послал меня (риторическое)."
  30: "ἐν φάσματι δείξει κύριος — «в явлении покажет Господь» (φάσμα — необычайное зрелище; 目に見える不思議). ἀνοίξασα τὸ στόμα — открыв уста. καταπίεται — поглотит (καταπίνω). καταβήσονται ζῶντες εἰς ᾅδου — сойдут живыми в преисподнюю (ᾅδης — 陰府). παρώξυναν — раздражили (παροξύνω)."
  31: "ἐπαύσατο λαλῶν — перестал говорить (παύομαι). ἐρράγη ἡ γῆ — земля расселась (ῥήγνυμι). ὑποκάτω αὐτῶν — под ними."
  32: "ἠνοίχθη ἡ γῆ — открылась земля (ἀνοίγω). κατέπιεν — поглотила. τοὺς οἴκους — домы. κτήνη — скот (家畜)."
  33: "κατέβησαν … ζῶντα εἰς ᾅδου — сошли живыми в преисподнюю. ἐκάλυψεν — покрыла (καλύπτω). ἀπώλοντο ἐκ μέσου — погибли из среды (ἀπόλλυμι)."
  34: "ἀπὸ τῆς φωνῆς αὐτῶν — от вопля их (φωνή). Μήποτε καταπίῃ ἡμᾶς ἡ γῆ — «как бы не поглотила нас земля» (μήποτε с конъюнктивом)."
  35: "πῦρ ἐξῆλθεν παρὰ κυρίου — огонь вышел от Господа. κατέφαγεν — пожрал (κατεσθίω). τοὺς προσφέροντας τὸ θυμίαμα — приносивших курение (προσφέρω)."
  36: "εἶπεν κύριος πρὸς Μωυσῆν — 主はモーセに言われた (без λέγων; речь продолжается в ст. 37)."
  37: "πρὸς Ελεαζαρ τὸν υἱὸν Ααρων τὸν ἱερέα — [и] к Елеазару, сыну Аарона, священнику (продолжение вводного εἶπεν из ст. 36). Ἀνέλεσθε — возьмите (ἀναιρέω, множественное число: обращение к Моисею и Елеазару). τὰ πυρεῖα τὰ χαλκᾶ — медные кадильницы (χαλκοῦς). ἐκ μέσου τῶν κατακεκαυμένων — из среды сожжённых (κατακαίω, perfect). τὸ πῦρ τὸ ἀλλότριον — чуждый огонь (ἀλλότριος). σπεῖρον ἐκεῖ — рассыпь там (σπείρω). ὅτι ἡγίασαν — ибо они освятились (ἁγιάζω)."
  38: "τὰ πυρεῖα τῶν ἁμαρτωλῶν τούτων ἐν ταῖς ψυχαῖς αὐτῶν — кадильницы этих грешников «в душах их», т. е. добытые их жизнью (ψυχή). λεπίδας ἐλατάς — кованые листы, тонкие пластины (λεπίς, ἔλατος). περίθεμα τῷ θυσιαστηρίῳ — покрытие для жертвенника (περίθεμα). προσηνέχθησαν … ἡγιάσθησαν — были принесены и освятились. εἰς σημεῖον — в знамение (しるし)."
  39: "ἔλαβεν Ελεαζαρ — взял Елеазар. ὅσα προσήνεγκαν οἱ κατακεκαυμένοι — сколько принесли сожжённые. προσέθηκαν αὐτὰ περίθεμα — положили их как покрытие (προστίθημι)."
  40: "μνημόσυνον — память, памятный знак (記念). ἀλλογενής — иноплеменник, чуждый родом (ἀλλογενής; 他の民族の者). ἐπιθεῖναι θυμίαμα — возложить курение. ἡ ἐπισύστασις αὐτοῦ — его скопище, мятеж (ἐπισύστασις). καθὰ ἐλάλησεν κύριος ἐν χειρὶ Μωυσῆ — как говорил Господь рукою Моисея."
  41: "ἐγόγγυσαν … τῇ ἐπαύριον — возроптали на другой день (ἐπαύριον). Ὑμεῖς ἀπεκτάγκατε — вы умертвили (perfect ἀποκτείνω). τὸν λαὸν κυρίου — народ Господень."
  42: "ἐν τῷ ἐπισυστρέφεσθαι — когда собиралось (ἐπισυστρέφω). ὥρμησαν ἐπὶ τὴν σκηνήν — устремились к скинии (ὁρμάω). τήνδε ἐκάλυψεν αὐτὴν ἡ νεφέλη — и вот, покрыло её облако (δεικτική τήνδε). ὤφθη ἡ δόξα — явилась слава."
  43: "εἰσῆλθεν … κατὰ πρόσωπον τῆς σκηνῆς — вошли пред лицо скинии (κατὰ πρόσωπον)."
  44: "εἶπεν κύριος πρὸς Μωυσῆν καὶ Ααρων λέγων — 主はモーセとアロンに語って言われた."
  45: "Ἐκχωρήσατε — отступите (ἐκχωρέω). ἐξαναλώσω … εἰς ἅπαξ — истреблю разом (ср. ст. 21). ἔπεσον ἐπὶ πρόσωπον αὐτῶν — пали на лица свои (здесь — Моисей и Аарон)."
  46: "Λαβὲ τὸ πυρεῖον — возьми кадильницу. ἀπὸ τοῦ θυσιαστηρίου — с жертвенника. ἀπένεγκε τὸ τάχος — отнеси быстро (ἀποφέρω, τάχος). ἐξίλασαι περὶ αὐτῶν — соверши умилостивление за них. ἐξῆλθεν γὰρ ὀργὴ ἀπὸ προσώπου κυρίου — ибо вышел гнев от лица Господня. ἦρκται θραύειν τὸν λαόν — начал поражать народ (θραύω)."
  47: "καθάπερ ἐλάλησεν αὐτῷ Μωϋσῆς — как сказал ему Моисей. ἔδραμεν — побежал (τρέχω). ἤδη ἐνῆρκτο ἡ θραῦσις — уже началось поражение (ἐνάρχομαι, плюсквамперфект). ἐπέβαλεν τὸ θυμίαμα — положил курение. ἐξιλάσατο — совершил умилостивление."
  48: "ἔστη ἀνὰ μέσον τῶν τεθνηκότων καὶ τῶν ζώντων — стал между мёртвыми и живыми. ἐκόπασεν ἡ θραῦσις — прекратилось поражение (κοπάζω)."
  49: "ἐγένοντο οἱ τεθνηκότες … τέσσαρες καὶ δέκα χιλιάδες καὶ ἑπτακόσιοι — умерших было четырнадцать тысяч семьсот (порядок чисел как в греч.). χωρὶς τῶν τεθνηκότων ἕνεκεν Κορε — кроме умерших из-за Корея (ἕνεκεν с родительным)."
  50: "ἐπέστρεψεν Ααρων πρὸς Μωυσῆν — возвратился Аарон к Моисею. ἐπὶ τὴν θύραν — ко входу. ἐκόπασεν ἡ θραῦσις — прекратилось поражение (повтор ст. 48, как в LXX)."
