verses:
  1: "その口[くち]で滑[すべ]ることなく、罪[つみ]の悲[かな]しみに刺[さ]されることのない人[ひと]は幸[さいわ]いである。"
  2: "自分[じぶん]の魂[たましい]が責[せ]めず、自分の望[のぞ]みから落[お]ちることのない人[ひと]は幸[さいわ]いである。"
  3: "けちな者[もの]には富[とみ]は良[よ]くない。ねたむ者に財産[ざいさん]が何[なん]になろうか。"
  4: "自分[じぶん]の魂[たましい]から取[と]って集[あつ]める者[もの]は、他人[たにん]のために集めている。他[ほか]の者たちがその者の善[よ]いものによって贅沢[ぜいたく]をする。"
  5: "自分[じぶん]に悪[わる]い者[もの]が、だれに善[よ]い者となろうか。その者は自分の財産[ざいさん]によって喜[よろこ]ぶことがない。"
  6: "自分[じぶん]自身[じしん]をねたむ者[もの]より悪[わる]い者はない。これがその者の悪[あく]の報[むく]いである。"
  7: "たとえ善[ぜん]を行[おこな]っても、忘[わす]れられたうちに行い、ついには自分[じぶん]の悪[あく]を現[あらわ]す。"
  8: "目[め]でねたむ者[もの]は悪[わる]い。顔[かお]を背[そむ]け、魂[たましい]を軽[かろ]んじる。"
  9: "むさぼる者[もの]の目[め]は分[わ]け前[まえ]で満[み]ちることがない。悪[わる]い不正[ふせい]は魂[たましい]を干[ひ]からびさせる。"
  10: "悪[わる]い目[め]はパンにもねたみ、自分[じぶん]の食卓[しょくたく]の上[うえ]で乏[とぼ]しくなる。"
  11: "子[こ]よ、あなたが持[も]っているに応[おう]じて、自分[じぶん]自身[じしん]に善[ぜん]を行[おこな]え。主[しゅ]への捧[ささ]げ物[もの]をふさわしくささげよ。"
  12: "死[し]は長[なが]く待[ま]たないこと、よみの契約[けいやく]はあなたに示[しめ]されていないことを思[おも]い出[だ]せ。"
  13: "死[し]ぬ前[まえ]に友[とも]に善[ぜん]を行[おこな]え。自分[じぶん]の力[ちから]に応[おう]じて手[て]を伸[の]べ、その者[もの]に与[あた]えよ。"
  14: "善[よ]い日[ひ]を逃[のが]すな。善い願[ねが]いの分[わ]け前[まえ]を過[す]ぎ去[さ]らせるな。"
  15: "あなたは自分[じぶん]の労苦[ろうく]と骨折[ほねお]りを、くじの分[わ]け前[まえ]のために他人[たにん]に残[のこ]すではないか。"
  16: "与[あた]え、受[う]け取[と]り、自分[じぶん]の魂[たましい]を聖別[せいべつ]せよ。よみのうちでは快楽[かいらく]を求[もと]めることはできないからである。"
  17: "すべての肉[にく]は衣[ころも]のように古[ふる]びる。世[よ]の初[はじ]めからの契約[けいやく]は「あなたは死[し]によって死ぬ」である。"
  18: "茂[しげ]った木[き]の上[うえ]で芽吹[めぶ]く葉[は]のように、一方[いっぽう]は落[お]ち、他方[たほう]は生[は]える。肉[にく]と血[ち]の世代[せだい]もそのとおりで、一方は終[お]わり、他方は生[う]まれる。"
  19: "朽[く]ちるすべてのわざは消[き]え、それを行[おこな]う者[もの]もそれとともに去[さ]る。"
  20: "知恵[ちえ]によって思[おも]いめぐらし、自分[じぶん]の悟[さと]りによって語[かた]る人[ひと]は幸[さいわ]いである。"
  21: "その道[みち]を心[こころ]に思[おも]い、その隠[かく]れたことについて考[かんが]える。"
  22: "狩人[かりゅうど]のように知恵[ちえ]の後[あと]について行[い]け。その道[みち]で待[ま]ち伏[ぶ]せよ。"
  23: "その窓[まど]から覗[のぞ]き込[こ]み、その戸口[とぐち]で耳[みみ]を傾[かたむ]ける。"
  24: "その家[いえ]の近[ちか]くに宿[やど]を取[と]り、その壁[かべ]に杭[くい]を打[う]つ。"
  25: "その手[て]のそばに自分[じぶん]の幕屋[まくや]を立[た]て、善[よ]いものの宿[やど]りに宿る。"
  26: "自分[じぶん]の子[こ]らをその覆[おお]いのうちに置[お]き、その枝[えだ]の下[した]に宿る。"
  27: "その者[もの]によって暑[あつ]さから覆[おお]われ、その栄光[えいこう]のうちに宿る。"

notes:
  1: "μακάριος ἀνήρ, ὃς οὐκ ὠλίσθησεν ἐν τῷ στόματι αὐτοῦ — «блажен муж, который не поскользнулся устами своими» (ὀλισθάνω — скользить, согрешать; слав. «не поползнуся устнама»); οὐ κατενύγη ἐν λύπῃ ἁμαρτιῶν — «не уязвлён печалью грехов» (κατανύσσομαι — быть уязвлённым; λύπη — печаль)."
  2: "μακάριος οὗ οὐ κατέγνω ἡ ψυχὴ αὐτοῦ — «блажен, кого не осудила душа его» (καταγινώσκω — осуждать; слав. «емуже не зазре душа его»); οὐκ ἔπεσεν ἀπὸ τῆς ἐλπίδος αὐτοῦ — «не отпал от надежды своей» (ἐλπίς)."
  3: "ἀνδρὶ μικρολόγῳ οὐ καλὸς ὁ πλοῦτος — «мужу скупому не хорошо богатство» (μικρολόγος — мелочный, скупой; слав. «скупому»); ἀνθρώπῳ βασκάνῳ ἵνα τί χρήματα — «человеку завистливому на что имение» (βάσκανος — завистливый, злой; χρῆμα — вещь, имущество)."
  4: "ὁ συνάγων ἀπὸ τῆς ψυχῆς αὐτοῦ — «собирающий от души своей», т. е. отнимая у себя (συνάγω — собирать); συνάγει ἄλλοις — «собирает другим»; ἐν τοῖς ἀγαθοῖς αὐτοῦ τρυφήσουσιν ἕτεροι — «благами его насладятся другие» (τρυφάω — жить в роскоши)."
  5: "ὁ πονηρὸς ἑαυτῷ τίνι ἀγαθὸς ἔσται — «злой для себя кому будет добр» (πονηρός — злой; ἑαυτῷ — себе); οὐ μὴ εὐφρανθήσεται ἐν τοῖς χρήμασιν αὐτοῦ — «не возвеселится имением своим» (εὐφραίνομαι — радоваться)."
  6: "τοῦ βασκαίνοντος ἑαυτὸν οὐκ ἔστιν πονηρότερος — «нет хуже того, кто завидует самому себе» (βασκαίνω — завидовать, сглазить; слав. «завидящаго себе самому»); τοῦτο ἀνταπόδομα τῆς κακίας αὐτοῦ — «это воздаяние злобы его» (ἀνταπόδομα — воздаяние)."
  7: "κἂν εὖ ποιῇ, ἐν λήθῃ ποιεῖ — «если и добро творит, в забытьи творит» (λήθη — забвение); ἐπ᾽ ἐσχάτων ἐκφαίνει τὴν κακίαν αὐτοῦ — «напоследок обнаруживает злобу свою» (ἐκφαίνω — выявлять; κακία — злоба)."
  8: "πονηρὸς ὁ βασκαίνων ὀφθαλμῷ — «зол, кто завидует оком» (ὀφθαλμός — глаз); ἀποστρέφων πρόσωπον — «отвращающий лицо» (ἀποστρέφω); ὑπερορῶν ψυχάς — «презирающий души» (ὑπεροράω — презирать)."
  9: "πλεονέκτου ὀφθαλμὸς οὐκ ἐμπίπλαται μερίδι — «глаз любостяжательного не насыщается частью» (πλεονέκτης — любостяжательный; ἐμπίπλαμαι — насыщаться; μερίς — часть); ἀδικία πονηρὰ ἀναξηραίνει ψυχήν — «неправда злая иссушает душу» (ἀναξηραίνω — высушивать)."
  10: "ὀφθαλμὸς πονηρὸς φθονερὸς ἐπ᾽ ἄρτῳ — «злой глаз завистлив на хлеб» (φθονερός — завистливый; ἄρτος — хлеб); ἐλλιπὴς ἐπὶ τῆς τραπέζης αὐτοῦ — «скуден за трапезой своей» (ἐλλιπής — недостающий, скудный; τράπεζα — стол)."
  11: "Τέκνον — «чадо»; καθὼς ἐὰν ἔχῃς, εὖ ποίει σεαυτόν — «как имеешь, делай добро себе»; προσφορὰς κυρίῳ ἀξίως πρόσαγε — «приношения Господу достойно приноси» (προσφορά — приношение; ἀξίως — достойно; προσάγω — приносить)."
  12: "μνήσθητι ὅτι θάνατος οὐ χρονιεῖ — «помни, что смерть не замедлит» (χρονίζω — медлить); διαθήκη ᾅδου οὐχ ὑπεδείχθη σοι — «завет ада не показан тебе» (ᾅδης — ад, преисподняя; ὑποδείκνυμι — показывать)."
  13: "πρὶν σε τελευτῆσαι εὖ ποίει φίλῳ — «прежде нежели умрёшь, делай добро другу» (τελευτάω — умирать); κατὰ τὴν ἰσχύν σου ἔκτεινον καὶ δὸς αὐτῷ — «по силе твоей простирай и давай ему» (ἐκτείνω — протягивать)."
  14: "μὴ ἀφυστερήσῃς ἀπὸ ἀγαθῆς ἡμέρας — «не лиши себя доброго дня» (ἀφυστερέω — упускать, лишаться); μερὶς ἐπιθυμίας ἀγαθῆς μή σε παρελθάτω — «часть доброго желания да не пройдёт мимо тебя» (ἐπιθυμία — желание; παρέρχομαι — проходить мимо)."
  15: "οὐχὶ ἑτέρῳ καταλείψεις τοὺς πόνους σου — «не другому ли оставишь труды твои» (καταλείπω — оставлять; πόνος — труд); τοὺς κόπους σου εἰς διαίρεσιν κλήρου — «усилия твои в разделение жребия» (κόπος — усилие; διαίρεσις — раздел; κλῆρος — жребий, удел)."
  16: "δὸς καὶ λαβὲ — «дай и возьми»; ἀπάτησον τὴν ψυχήν σου — «услади (букв. обмани) душу твою» (ἀπατάω — обманывать; здесь — доставить себе утешение); слав. читает «освяти душу твою» (ἁγίασον) — по паритету в тексте слав. чтение, вариант LXX в этой заметке. οὐκ ἔστιν ἐν ᾅδου ζητῆσαι τρυφήν — «нельзя в аде искать наслаждения» (ᾅδης; τρυφή). Слав. выносит вторую половину в 14:17."
  17: "πᾶσα σὰρξ ὡς ἱμάτιον παλαιοῦται — «всякая плоть, как одежда, ветшает» (ἱμάτιον — одежда; παλαιόω — делать старым); ἡ γὰρ διαθήκη ἀπ᾽ αἰῶνος — «ибо завет от века» (διαθήκη — завет, определение); Θανάτῳ ἀποθανῇ — «смертью умрёшь» (θάνατος — смерть; слав. «смертию умреши»). Слова определения — 「…」."
  18: "ὡς φύλλον θάλλον ἐπὶ δένδρου δασέος — «как лист зеленеющий на дереве густом» (θάλλω — зеленеть; δασύς — густой); τὰ μὲν καταβάλλει, ἄλλα δὲ φύει — «одни сбрасывает, другие растит» (καταβάλλω — сбрасывать; φύω — растить); γενεὰ σαρκὸς καὶ αἵματος — «род плоти и крови» (γενεά)."
  19: "πᾶν ἔργον σηπόμενον ἐκλείπει — «всякое дело тлеющее исчезает» (σήπομαι — гнить, тлеть; ἐκλείπω — исчезать); ὁ ἐργαζόμενος αὐτὸ μετ᾽ αὐτοῦ ἀπελεύσεται — «делающий его с ним отойдёт» (ἀπέρχομαι)."
  20: "Μακάριος ἀνήρ, ὃς ἐν σοφίᾳ μελετήσει — «блажен муж, который в премудрости будет размышлять» (μελετάω — упражняться, размышлять); ἐν συνέσει αὐτοῦ διαλεχθήσεται — «в разуме своём будет рассуждать» (σύνεσις — разумение; διαλέγομαι — беседовать, рассуждать). Слав. читает «иже во премудрости умрет» (умрёт) — расходится с LXX и с контекстом, поэтому в тексте LXX, слав. чтение отмечено здесь."
  21: "ὁ διανοούμενος τὰς ὁδοὺς αὐτῆς ἐν καρδίᾳ αὐτοῦ — «размышляющий о путях её в сердце своём» (διανοέομαι — обдумывать); ἐν τοῖς ἀποκρύφοις αὐτῆς ἐννοηθήσεται — «в сокровенных её уразумеет» (ἀπόκρυφος — сокровенный; ἐννοέομαι)."
  22: "ἔξελθε ὀπίσω αὐτῆς ὡς ἰχνευτής — «выйди вслед за ней, как ловчий» (ἰχνευτής — следопыт, ловчий; слав. «изследник»); ἐν ταῖς ὁδοῖς αὐτῆς ἐνέδρευε — «на путях её устраивай засаду» (ἐνεδρεύω — подстерегать)."
  23: "ὁ παρακύπτων διὰ τῶν θυρίδων αὐτῆς — «приникающий через окна её» (παρακύπτω — наклоняться, заглядывать; θυρίς — окно); ἐπὶ τῶν θυρωμάτων αὐτῆς ἀκροάσεται — «у дверей её будет слушать» (θύρωμα — дверной проём; ἀκροάομαι — слушать)."
  24: "ὁ καταλύων σύνεγγυς τοῦ οἴκου αὐτῆς — «останавливающийся близ дома её» (καταλύω — останавливаться, ночевать); πήξει πάσσαλον ἐν τοῖς τοίχοις αὐτῆς — «вобьёт кол в стены её» (πήγνυμι — вбивать; πάσσαλος — кол; τοῖχος — стена)."
  25: "στήσει τὴν σκηνὴν αὐτοῦ κατὰ χεῖρας αὐτῆς — «поставит шатёр свой при руках её», т. е. рядом (σκηνή — шатёр, скиния; слав. «скинию»); καταλύσει ἐν καταλύματι ἀγαθῶν — «поселится в жилище благ» (κατάλυμα — жилище, гостиница). Слав. 14:25 соединяет гр. 24–25."
  26: "θήσει τὰ τέκνα αὐτοῦ ἐν τῇ σκέπῃ αὐτῆς — «положит детей своих под кров её» (σκέπη — кров, покров); ὑπὸ τοὺς κλάδους αὐτῆς αὐλισθήσεται — «под ветвями её будет ночевать» (κλάδος — ветвь; αὐλίζομαι — ночевать)."
  27: "σκεπασθήσεται ὑπ᾽ αὐτῆς ἀπὸ καύματος — «будет покрыт ею от зноя» (καῦμα — зной); ἐν τῇ δόξῃ αὐτῆς καταλύσει — «в славе её поселится» (δόξα — слава)."
