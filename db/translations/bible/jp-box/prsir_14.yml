# jp-box, Сирах, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 14: 1–2 блаженство не согрешившего устами; 3–10 скупой и завистливый;
# 11–19 о смерти и пользовании жизнью; 20–27 блаженство ищущего премудрости.
# Прямая речь — определение в 14:17 (「あなたは死によって死ぬ」, цитата Быт 2:17)
# в авторском тексте; остальное — авторский текст.
# Нумерация: 27 стихов по гр. В csl 27 стихов, но деление иное: csl 16–17 делят гр. 16,
# csl 18–24 = гр. 17–23 (сдвиг +1), csl 25 соединяет гр. 24–25; с 26 номера совпадают.
# Весь csl-текст внесён, держимся деления гр.
# 14:16: LXX читает ἀπάτησον («услади, обмани»), csl — «освяти»; по паритету в тексте
# csl-чтение, вариант LXX — в notes.
# 〔…〕 нет: все стихи есть в gr-lxx-byz, текста csl сверх гр. нет.
# Сносок ⟨…⟩ нет: 幸い, 魂, よみ, 知恵, 幕屋 и пр. уже в корпусе.
# Имён и топонимов в главе нет.

