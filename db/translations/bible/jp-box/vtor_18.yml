verses:
  1: "「レビ人[びと]である祭司[さいし]たち、すなわちレビの部族[ぶぞく]すべてには、イスラエルとともに分[わ]け前[まえ]も嗣業[しぎょう]もない。彼[かれ]らの嗣業は主[しゅ]への捧[ささ]げ物[もの]であり、彼らはそれらを食[た]べる。"
  2: "彼[かれ]らの兄弟[きょうだい]の間[あいだ]には嗣業[しぎょう]がない。主[しゅ]ご自身[じしん]が彼[かれ]の嗣業であり、主が彼に言[い]われたとおりである。"
  3: "祭司[さいし]たちの受[う]ける定[さだ]めは次[つぎ]のとおりである。民[たみ]のうちから、牛[うし]であれ羊[ひつじ]であれ犠牲[ぎせい]を屠[ほふ]る者[もの]たちは、祭司に肩[かた]と顎[あご]と胃[い]を渡[わた]さなければならない。"
  4: "あなたはまた、あなたの穀物[こくもつ]とぶどう酒[さけ]と油[あぶら]の初穂[はつほ]、および羊[ひつじ]の毛[け]の初穂を、彼に与[あた]えなければならない。"
  5: "あなたの神[かみ]である主[しゅ]が、あなたのすべての部族[ぶぞく]のうちから彼を選[えら]ばれたからである。彼[かれ]とその子[こ]らは、イスラエルの子らの間[あいだ]で、主[しゅ]の前[まえ]に立って主に仕[つか]え、主の御名[みな]によって祝福[しゅくふく]する。"
  6: "もしレビ人[びと]が、あなたの町々[まちまち]の一[ひと]つ、すなわち彼[かれ]が寄留[きりゅう]しているイスラエルの子[こ]らの町[まち]のどこかからでも、その心[こころ]の望[のぞ]むままに、主[しゅ]が選[えら]ばれる場所[ばしょ]へ来[き]て、"
  7: "彼[かれ]は、そこに主[しゅ]の前[まえ]に立[た]っている彼の兄弟[きょうだい]であるすべてのレビ人[びと]と同[おな]じように、彼の神[かみ]である主の御名[みな]によって仕[つか]える。"
  8: "彼[かれ]は、父[ちち]の家[いえ]の財産[ざいさん]を売[う]った分[ぶん]のほかに、等[ひと]しく分[わ]けられた分を食[た]べることができる。"
  9: "あなたが、あなたの神[かみ]である主[しゅ]があなたに与[あた]える地[ち]に入[はい]るとき、それらの国民[こくみん]の忌[い]むべき行[おこな]いを習[なら]い覚[おぼ]えてはならない。"
  10: "あなたのうちには、自分[じぶん]の息子[むすこ]や娘[むすめ]を火[ひ]の中[なか]に通[とお]して清[きよ]める者[もの]、占[うらな]いをする者、言葉[ことば]の兆[きざ]しを読[よ]む者、鳥[とり]の飛[と]び方[かた]を読む者、呪術[じゅじゅつ]を使[つか]う者[もの]、"
  11: "呪文[じゅもん]を唱[とな]える者[もの]、霊媒[れいばい]、前兆[ぜんちょう]を読む者、死人[しにん]に問[と]い合[あ]わせる者[もの]が見[み]いだされてはならない。"
  12: "これらのことをすべて行[おこな]う者[もの]は、あなたの神[かみ]である主[しゅ]にとって忌[い]むべきものである。これらの忌むべき行いのゆえに、あなたの神である主は、彼[かれ]らをあなたの前[まえ]から滅[ほろ]ぼし尽[つ]くされる。"
  13: "あなたは、あなたの神[かみ]である主[しゅ]の前[まえ]で完全[かんぜん]な者[もの]でなければならない。"
  14: "あなたが嗣業[しぎょう]として受[う]け継[つ]ごうとしているこれらの国民[こくみん]は、兆[きざ]しや占[うらな]いに聞[き]き従[したが]う。しかし、あなたの神[かみ]である主[しゅ]は、あなたにはそういうことをお与[あた]えにならなかった。"
  15: "あなたの神[かみ]である主[しゅ]は、あなたの兄弟[きょうだい]のうちから、私[わたし]のような預言者[よげんしゃ]をあなたのために起[お]こされる。あなたがたは彼[かれ]に聞[き]き従[したが]わなければならない。"
  16: "これは、あなたがあなたの神[かみ]である主[しゅ]にホレブで、集会[しゅうかい]の日[ひ]に求[もと]めたすべてのことのとおりである。あのときあなたがたは言[い]った。『わたしたちの神[かみ]である主[しゅ]の声[こえ]をもう聞[き]きたくはありません。この大[おお]きな火[ひ]も、もう見[み]たくはありません。死[し]にたくはないのです』と。"
  17: "主[しゅ]は私[わたし]に言[い]われた。『彼[かれ]らが語[かた]ったことは、すべて正[ただ]しい。"
  18: "わたしは彼[かれ]らの兄弟[きょうだい]のうちから、あなたのような預言者[よげんしゃ]を彼らのために起[お]こし、わたしの言葉[ことば]を彼[かれ]の口[くち]に置[お]く。彼は、わたしが命[めい]じるすべてのことを彼らに語[かた]る。"
  19: "そして、彼[かれ]がわたしの名[な]によって語[かた]ることを、聞[き]かない者[もの]がだれであれ、わたしがその者[もの]を罰[ばっ]する。』"
  20: "しかし、主[しゅ]が命[めい]じもしない言葉[ことば]を、主の名[な]によって不敬[ふけい]にも語[かた]る預言者[よげんしゃ]、またほかの神々[かみがみ]の名によって語る預言者は、その預言者は死[し]ぬ。"
  21: "もしあなたが心[こころ]のうちで『主[しゅ]が語[かた]らなかった言葉[ことば]を、どうして見分[みわ]けられるのか』と言[い]うなら、"
  22: "預言者[よげんしゃ]が主[しゅ]の名[な]によって語[かた]ったのに、その言葉[ことば]が起[お]こらず、実現[じつげん]しないなら、それは主が語らなかった言葉である。その預言者は不敬[ふけい]にも語ったのであり、あなたは彼[かれ]を恐[おそ]れてはならない。」"

notes:
  1: "οὐκ ἔσται … μερὶς οὐδὲ κλῆρος — не будет части и удела; καρπώματα κυρίου ὁ κλῆρος αὐτῶν — «приношения Господни — удел их» (в греч. сказуемое в конце); φάγονται αὐτά — будут есть их."
  2: "κλῆρος ἐν τοῖς ἀδελφοῖς — удел между братьями; κύριος αὐτὸς κλῆρος αὐτοῦ — Господь Сам удел его (ед. ч., как и в слав.); καθότι εἶπεν αὐτῷ — как сказал ему."
  3: "κρίσις τῶν ἱερέων — «суд священников», т.е. положенная им доля; τὰ παρὰ τοῦ λαοῦ — что от народа; ἐάν τε μόσχον ἐάν τε πρόβατον — телёнка ли, овцу ли; βραχίων — плечо (мышца), σιαγόνια — челюсти, ἔνυστρον — желудок (сычуг)."
  4: "ἀπαρχαί — начатки; σῖτος, οἶνος, ἔλαιον — хлеб, вино, елей; κουρά — стрижка (шерсти); δώσεις αὐτῷ — дашь ему."
  5: "ἐξελέξατο — избрал; παρεστάναι ἔναντι — предстоять пред; λειτουργεῖν — служить; εὐλογεῖν ἐπὶ τῷ ὀνόματι — благословлять именем Его; αὐτὸς καὶ οἱ υἱοὶ αὐτοῦ ἐν τοῖς υἱοῖς Ισραηλ — сам и сыны его среди сынов Израиля (слав. «во вся дни» — иначе)."
  6: "παραγένηται — придёт; ἐκ μιᾶς τῶν πόλεων ὑμῶν — из одного из городов ваших; οὗ αὐτὸς παροικεῖ — где он пришельствует (παροικέω); καθότι ἐπιθυμεῖ ἡ ψυχή — как пожелает душа."
  7: "λειτουργήσει τῷ ὀνόματι — будет служить имени; ὥσπερ πάντες οἱ ἀδελφοὶ αὐτοῦ — как все братья его; οἱ παρεστηκότες ἐκεῖ ἔναντι κυρίου — предстоящие там пред Господом."
  8: "μερὶς μεμερισμένη — доля разделённая, т.е. определённая; πλὴν τῆς πράσεως τῆς κατὰ πατριάν — кроме продажи по отчеству, т.е. сверх вырученного за родовое имущество; φάγεται — будет есть."
  9: "βδελύγματα — мерзости (βδέλυγμα); οὐ μαθήσῃ ποιεῖν — не научишься делать."
  10: "περικαθαίρων ἐν πυρί — «очищающий в огне», т.е. проводящий детей через огонь (обряд Молоха); μαντευόμενος μαντείαν — «гадающий гадание» (внутренний объект); κληδονιζόμενος — гадающий по приметам и словам; οἰωνιζόμενος — птицегадатель; φαρμακός — чародей, зельевар."
  11: "ἐπαείδων ἐπαοιδήν — «заклинающий заклинание» (внутренний объект); ἐγγαστρίμυθος — чревовещатель, вызывающий духов; τερατοσκόπος — наблюдатель знамений; ἐπερωτῶν τοὺς νεκρούς — вопрошающий мёртвых. Глагол «не найдётся» (οὐχ εὑρεθήσεται) стоит в 10 и относится ко всему перечню."
  12: "βδέλυγμα κυρίῳ — мерзость Господу; ἕνεκεν — ради, из-за; ἐξολεθρεύσει — истребит (ἐξολεθρεύω); ἀπὸ σοῦ — от тебя, т.е. от лица твоего."
  13: "τέλειος — совершенный, непорочный (слав. «совершен»); ἔσῃ ἐναντίον — будешь пред."
  14: "κατακληρονομεῖς — наследуешь, изгоняя (κατακληρονομέω); κληδόνων καὶ μαντειῶν ἀκούσονται — гаданий и прорицаний будут слушать; οὐχ οὕτως ἔδωκεν — не так дал."
  15: "προφήτην ἐκ τῶν ἀδελφῶν σου — пророка из братьев твоих; ὡς ἐμέ — как меня, т.е. как Моисея (ср. 18:18 ὥσπερ σέ); ἀναστήσει — воздвигнет (ἀνίστημι); αὐτοῦ ἀκούσεσθε — его слушайте."
  16: "κατὰ πάντα ὅσα ᾐτήσω — по всему, что ты просил; ἐν Χωρηβ — при Хориве; ἡμέρᾳ τῆς ἐκκλησίας — в день собрания (ἐκκλησία); λέγοντες — говоря (мн. ч.: народ); οὐ προσθήσομεν ἀκοῦσαι — «не приложим слышать», т.е. не будем больше слушать; οὐδὲ μὴ ἀποθάνωμεν — чтобы не умереть. Слова народа — 『…』."
  17: "εἶπεν κύριος πρός με — сказал Господь мне; ὀρθῶς πάντα ὅσα ἐλάλησαν — правильно всё, что они сказали. С этого места и до 18:19 — слова Бога 『…』."
  18: "ἀναστήσω — воздвигну; ὥσπερ σέ — как тебя; δώσω τὸ ῥῆμά μου ἐν τῷ στόματι αὐτοῦ — вложу слово Моё в уста его; καθότι ἂν ἐντείλωμαι — что ни заповедаю ему."
  19: "ὃς ἐὰν μὴ ἀκούσῃ — кто не послушает; ἐπὶ τῷ ὀνόματί μου — во имя Моё; ἐκδικήσω ἐξ αὐτοῦ — взыщу с него (ἐκδικέω; слав. «Аз отмщу от него»)."
  20: "πλήν — но, однако; ἀσεβήσῃ λαλῆσαι — дерзнёт, нечестиво скажет; ὃ οὐ προσέταξα — чего Я не повелел; ἐπ᾿ ὀνόματι θεῶν ἑτέρων — именем богов иных; ἀποθανεῖται — умрёт (приговор). ἐπὶ τῷ ὀνόματί μου — «во имя Моё»; так как с 20 снова речь Моисея, местоимение раскрыто как 主の名."
  21: "ἐὰν εἴπῃς ἐν τῇ καρδίᾳ σου — если скажешь в сердце твоём; πῶς γνωσόμεθα — как узнаем. Вопрос народа — 『…』."
  22: "ὅσα ἐὰν λαλήσῃ — что бы ни сказал; μὴ γένηται … μὴ συμβῇ — не сбудется и не случится; ἐν ἀσεβείᾳ — в нечестии; οὐκ ἀφέξεσθε αὐτοῦ — «не удержитесь от него», т.е. не бойтесь и не внимайте ему (ἀπέχομαι — держаться в стороне; слав. «не убойтеся его»)."
