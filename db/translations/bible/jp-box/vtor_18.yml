# jp-box, Второзаконие, глава 18. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru).
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе пуст.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 18: доля священников-левитов (1–8); запрет языческих гаданий (9–14);
# обетование Пророка, как Моисей, и слова Бога о Нём (15–19); лжепророк (20–22).
# Вся глава — речь Моисея к народу: первый уровень 「…」 (1–22).
# Вложенная речь — 『…』: слова народа на Хореве в 16 и слова Бога в 17б–19.
# По заданию 18:15–19 — слова Бога; в греч. тексте 15–16 — ещё речь Моисея
# (ὡς ἐμέ «как меня», т.е. как Моисея; ср. 18:18 ὥσπερ σέ), поэтому 『…』
# открывается на словах Бога в 18:17 и держится до 19. Красного <j> нет.
# Нумерация: 22 стиха — как в gr-lxx-byz (совпадает с csl-ru и ru).
# Отличия: 18:5 слав. добавляет «во вся дни» — в греч. «он и сыны его среди сынов
# Израиля»; 18:20 «во имя Моё» (ἐπὶ τῷ ὀνόματί μου) передано 主の名, так как это речь Моисея.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: レビ人 уже пояснён (Лк 10:32), 嗣業, 初穂, 預言者 в корпусе.
# jp-ni не использовался.

