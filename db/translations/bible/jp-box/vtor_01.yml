verses:
  1: "これらは、モーセがヨルダン川[がわ]の向[む]こう側[がわ]、紅海[こうかい]に近[ちか]い西[にし]の荒野[こうや]で、ファランとトフォル、ロボン、アウロン、カタクリュセアの間[あいだ]で、イスラエルすべてに語[かた]った言葉[ことば]である。"
  2: "ホレブからセイルの山[やま]への道[みち]を行[い]ってカデシュ・バルネアまで、十一日[じゅういちにち]の道程[みちのり]である。"
  3: "第四十[だいよんじゅう]の年[とし]、第十一[だいじゅういち]の月[つき]、その月[つき]の一日[ついたち]に、モーセはイスラエルの子[こ]らすべてに、主[しゅ]が彼[かれ]らについてモーセに命[めい]じられたすべてのことを語[かた]った。"
  4: "それは、エセボンに住[す]んでいたアモリ人[じん]の王[おう]シホンと、アスタロトとエドラインに住[す]んでいたバシャンの王[おう]オグを打[う]った後[のち]のことであった。"
  5: "ヨルダン川[がわ]の向[む]こう側[がわ]、モアブの地[ち]で、モーセはこの律法[りっぽう]を明[あき]らかに説[と]き始[はじ]め、次[つぎ]のように言[い]った。"
  6: "「わたしたちの神[かみ]である主[しゅ]は、ホレブでわたしたちに語[かた]って言[い]われた。『あなたがたがこの山[やま]に住[す]むのは十分[じゅうぶん]である。"
  7: "向[む]きを変[か]えて旅立[たびだ]ち、アモリ人[じん]の山[やま]へ、またアラバの周辺[しゅうへん]に住[す]むすべての民[たみ]のところへ入[はい]って行[い]きなさい。すなわち、山[やま]、平野[へいや]、南[みなみ]の地[ち]、海沿[うみぞ]い、カナン人[じん]の地[ち]、アンティレバノン、そして大[おお]きな川[かわ]であるユーフラテス川[がわ]まで。"
  8: "見[み]なさい、わたしはこの地[ち]をあなたがたの前[まえ]に渡[わた]した。入[はい]って行[い]き、主[しゅ]があなたがたの父[ちち]たち、アブラハム、イサク、ヤコブに、彼[かれ]らとその後[のち]の子孫[しそん]に与[あた]えると誓[ちか]われた地[ち]を、嗣業[しぎょう]として受[う]け継[つ]ぎなさい。』"
  9: "その時[とき]、わたしはあなたがたに言[い]った。わたしは一人[ひとり]であなたがたを負[お]うことはできない。"
  10: "あなたがたの神[かみ]である主[しゅ]はあなたがたを多[おお]くし、見[み]よ、今日[きょう]、あなたがたはその数[かず]において天[てん]の星[ほし]のようになっている。"
  11: "あなたがたの父[ちち]たちの神[かみ]である主[しゅ]が、あなたがたを今[いま]の千倍[せんばい]にも増[ふ]やし、あなたがたに語[かた]られたとおりに、あなたがたを祝福[しゅくふく]してくださいますように。"
  12: "どうして、わたし一人[ひとり]であなたがたの労苦[ろうく]と重荷[おもに]と争[あらそ]いを負[お]うことができるだろうか。"
  13: "あなたがたの部族[ぶぞく]ごとに、知恵[ちえ]があり、知識[ちしき]があり、思慮[しりょ]深[ぶか]い人々[ひとびと]を選[えら]びなさい。わたしは彼[かれ]らを、あなたがたの上[うえ]に立[た]つ長[かしら]とする。"
  14: "あなたがたはわたしに答[こた]えて言[い]った。『あなたが言[い]ったその言葉[ことば]はよい。そうしよう。』"
  15: "わたしはあなたがたのうちから、知恵[ちえ]があり、知識[ちしき]があり、思慮[しりょ]深[ぶか]い人[ひと]たちを取[と]り、彼[かれ]らをあなたがたの上[うえ]に立[た]つ者[もの]とした。すなわち、千[せん]人[にん]の長[ちょう]、百[ひゃく]人[にん]の長[ちょう]、五十[ごじゅう]人[にん]の長[ちょう]、十[じゅう]人[にん]の長[ちょう]、そしてあなたがたの裁[さば]き人[びと]たちの監督[かんとく]である。"
  16: "その時[とき]、わたしはあなたがたの裁[さば]き人[びと]たちに命[めい]じて言[い]った。あなたがたの兄弟[きょうだい]の間[あいだ]の訴[うった]えを聞[き]き、人[ひと]とその兄弟[きょうだい]の間[あいだ]、またその寄留者[きりゅうしゃ]との間[あいだ]を、正[ただ]しく裁[さば]きなさい。"
  17: "裁[さば]きにおいて人[ひと]の顔[かお]を見[み]てはならない。小[ちい]さな者[もの]も大[おお]きな者[もの]も、同[おな]じように裁[さば]きなさい。人[ひと]の顔[かお]を恐[おそ]れてはならない。裁[さば]きは神[かみ]のものだからである。あなたがたにとって難[むずか]しい事柄[ことがら]は、わたしのところに持[も]って来[き]なさい。わたしがそれを聞[き]こう。"
  18: "その時[とき]、わたしはあなたがたに、あなたがたが行[おこな]うべきすべてのことを命[めい]じた。"
  19: "わたしたちはホレブを出[で]て、あなたがたが見[み]たあの大[おお]きく恐[おそ]ろしい荒野[こうや]をすべて通[とお]り、あなたがたの神[かみ]である主[しゅ]がわたしたちに命[めい]じられたとおりに、アモリ人[じん]の山[やま]への道[みち]を進[すす]んで、カデシュ・バルネアまで来[き]た。"
  20: "その時[とき]、わたしはあなたがたに言[い]った。あなたがたはアモリ人[じん]の山[やま]まで来[き]た。わたしたちの神[かみ]である主[しゅ]が、あなたがたに与[あた]えようとしておられる山[やま]である。"
  21: "見[み]なさい、あなたがたの神[かみ]である主[しゅ]は、この地[ち]をあなたがたの前[まえ]に渡[わた]された。上[のぼ]って行[い]って、あなたがたの父[ちち]たちの神[かみ]である主[しゅ]があなたがたに言[い]われたとおりに、それを嗣業[しぎょう]として受[う]け継[つ]ぎなさい。恐[おそ]れてはならない。おじけてはならない。"
  22: "あなたがたはみな、わたしのところに近[ちか]づいて言[い]った。『わたしたちより先[さき]に人[ひと]を遣[つか]わし、彼[かれ]らにこの地[ち]を探[さぐ]らせ、わたしたちが上[のぼ]って行[い]く道[みち]と、どの町[まち]々に入[はい]るべきかを、わたしたちに答[こた]えて知[し]らせてもらいましょう。』"
  23: "その言葉[ことば]はわたしの目[め]に良[よ]く思[おも]われたので、わたしはあなたがたのうちから十二人[じゅうににん]の者[もの]を、部族[ぶぞく]ごとに一人[ひとり]ずつ取[と]った。"
  24: "彼[かれ]らは向[む]きを変[か]えて山[やま]に上[のぼ]り、ぶどうの房[ふさ]の谷[たに]まで来[き]て、その地[ち]を探[さぐ]った。"
  25: "彼[かれ]らはその手[て]に地[ち]の実[み]を持[も]って来[き]て、わたしたちに届[とど]け、言[い]った。『主[しゅ]がわたしたちに与[あた]えられる地[ち]は良[よ]い地[ち]である。』"
  26: "しかし、あなたがたは上[のぼ]って行[い]くことを望[のぞ]まず、あなたがたの神[かみ]である主[しゅ]の言葉[ことば]に背[そむ]いた。"
  27: "あなたがたは天幕[てんまく]の中でつぶやいて言[い]った。『主[しゅ]がわたしたちを憎[にく]んで、エジプトの地[ち]から連[つ]れ出[だ]し、アモリ人[じん]の手[て]に渡[わた]して滅[ほろ]ぼそうとされているのだ。"
  28: "どこへわたしたちは上[のぼ]って行[い]くのか。わたしたちの兄弟[きょうだい]たちは、わたしたちの心[こころ]をくじいた。彼[かれ]らは言[い]った。あの民[たみ]はわたしたちより大[おお]きく、多[おお]く、強[つよ]い。町[まち]々は大[おお]きく、天[てん]まで届[とど]く城壁[じょうへき]で囲[かこ]まれている。そのうえ、わたしたちはそこに巨人[きょじん]の子[こ]らを見[み]た。』"
  29: "しかし、わたしはあなたがたに言[い]った。彼[かれ]らを恐[おそ]れてはならない。おびえてはならない。"
  30: "あなたがたの神[かみ]である主[しゅ]は、あなたがたの前[まえ]を進[すす]んで行[い]き、あなたがたのために戦[たたか]われる。あなたがたの目[め]の前[まえ]でエジプトでなさったすべてのとおりに。"
  31: "また、あなたがたが見[み]たこの荒野[こうや]でも。人[ひと]がその子[こ]を抱[だ]き上[あ]げるように、あなたの神[かみ]である主[しゅ]はあなたを抱[だ]き上[あ]げ、あなたがたがこの場所[ばしょ]に来[く]るまで、歩[あゆ]んだすべての道[みち]であなたを養[やしな]われた。"
  32: "このことにおいても、あなたがたはあなたがたの神[かみ]である主[しゅ]を信[しん]じなかった。"
  33: "主[しゅ]は、あなたがたのために宿営[しゅくえい]の場所[ばしょ]を選[えら]ぶために、道[みち]であなたがたの前[まえ]を先[さき]に進[すす]み、夜[よる]は火[ひ]で、昼[ひる]は雲[くも]で、あなたがたが行[い]くべき道[みち]をあなたがたに示[しめ]された。"
  34: "主[しゅ]はあなたがたの言葉[ことば]の声[こえ]を聞[き]き、怒[いか]って誓[ちか]われた。"
  35: "『この人[ひと]たちのうち、だれも、わたしが彼[かれ]らの父[ちち]たちに誓[ちか]ったあの良[よ]い地[ち]を見[み]ることはない。"
  36: "ただ、イェフォンネの子[こ]カレブだけはそれを見[み]る。わたしは彼[かれ]とその子[こ]らに、彼[かれ]が踏[ふ]んだ地[ち]を与[あた]える。彼[かれ]が主[しゅ]に付[つ]き従[したが]ったからである。』"
  37: "また主[しゅ]はあなたがたのゆえにわたしにも怒[いか]りを発[はっ]し、言[い]われた。『あなたもそこに入[はい]ってはならない。』"
  38: "『ヌンの子[こ]ヨシュアは、あなたの前[まえ]に立[た]っている者[もの]である。彼[かれ]こそそこに入[はい]る。彼[かれ]を強[つよ]くしなさい。彼[かれ]がイスラエルにその地[ち]を嗣業[しぎょう]として分[わ]け与[あた]えるからである。"
  39: "また、今日[きょう]、善[よ]いことも悪[わ]るいことも知[し]らない幼[おさな]い子[こ]どもたち、彼[かれ]らがそこに入[はい]る。わたしは彼[かれ]らにその地[ち]を与[あた]え、彼[かれ]らはそれを嗣業[しぎょう]として受[う]け継[つ]ぐ。"
  40: "あなたがたは向[む]きを変[か]え、紅海[こうかい]への道[みち]にある荒野[こうや]へ向[む]かって宿営[しゅくえい]しなさい。』"
  41: "あなたがたはわたしに答[こた]えて言[い]った。『わたしたちは主[しゅ]の前[まえ]で罪[つみ]を犯[おか]した。わたしたちは上[のぼ]って行[い]って、あなたがたの神[かみ]である主[しゅ]がわたしたちに命[めい]じられたすべてのとおりに戦[たたか]おう。』そして、あなたがたはおのおの武具[ぶぐ]を取[と]り、集[あつ]まって山[やま]に上[のぼ]って行[い]った。"
  42: "しかし、主[しゅ]はわたしに言[い]われた。あなたがたに言[い]いなさい。『上[のぼ]ってはならない。戦[たたか]ってもならない。わたしはあなたがたと共[とも]にいないからである。敵[てき]の前[まえ]で打[う]ち砕[くだ]かれることのないように。』"
  43: "わたしはあなたがたに語[かた]ったが、あなたがたはわたしに聞[き]き従[したが]わず、主[しゅ]の言葉[ことば]に背[そむ]き、押[お]し切[き]って山[やま]に上[のぼ]って行[い]った。"
  44: "その山[やま]に住[す]んでいたアモリ人[じん]が出[で]て来[き]て、あなたがたに向[む]かい、蜂[はち]がするようにあなたがたを追[お]い立[た]て、セイルからエルマに至[いた]るまで、あなたがたを撃[う]ち傷[きず]つけた。"
  45: "あなたがたは戻[もど]って来[き]て、主[しゅ]の前[まえ]で泣[な]いた。しかし、主[しゅ]はあなたがたの声[こえ]を聞[き]かず、あなたがたに耳[みみ]を傾[かたむ]けられなかった。"
  46: "あなたがたはカデシュに長[なが]い間[あいだ]とどまった。かつてとどまったその日数[ひすう]だけ、とどまったのである。」"

notes:
  1: "Οὗτοι οἱ λόγοι — «сии слова» (указательное «вот эти»); слав. «сия словеса». πέραν τοῦ Ιορδάνου — «за Иорданом» (досл. «по ту сторону»). ἐν τῇ ἐρήμῳ πρὸς δυσμαῖς — «в пустыне к западу» (δυσμή — заход солнца). πλησίον τῆς ἐρυθρᾶς — «близ Чермного моря». ἀνὰ μέσον Φαραν, Τοφολ καὶ Λοβον καὶ Αυλων — «между Фараном, Тофелом, Лавоном и Авлоном». Καταχρύσεα — букв. «Златые руды» (καταχρύσεος), слав. «златыми рудами»; оставлено транслитерацией. У Синодального иные имена (Суф, Асироф, Дизагав) — по масоретскому тексту, не внесены."
  2: "ἕνδεκα ἡμερῶν — родительный падеж меры: «одиннадцать дней [пути]»; ἐν Χωρηβ — «в Хориве» (слав. «от Хорива»). ὁδὸς ἐπ᾽ ὄρος Σηιρ — «дорога к горе Сеир» (ἐπί с винитивом). ἕως Καδης Βαρνη — «до Кадес-Варни». Фраза без глагола, как в LXX: она продолжает вводное предложение ст. 1 и задаёт масштаб пути."
  3: "ἐγενήθη — «было» (вводная дата). ἐν τῷ τεσσαρακοστῷ ἔτει — в сороковой год (ср. 2:7: сорок лет странствия). ἑνδεκάτῳ μηνί — одиннадцатый месяц. μιᾷ τοῦ μηνός — в первый день месяца (μιᾷ — «в одну»). κατὰ πάντα, ὅσα ἐνετείλατο κύριος αὐτῷ πρὸς αὐτούς — «по всему, что заповедал ему Господь к ним»; слав. «к ним», Синодальный «о них» — πρός с винитивом допускает оба смысла, оставлено «о них»."
  4: "μετὰ τὸ πατάξαι — «после того как он поразил» (πατάσσω; артикль с инфинитивом, субъект — Моисей). τὸν κατοικήσαντα ἐν Εσεβων — «жившего в Есевоне» (причастие аориста). Ὠγ βασιλέα τῆς Βασαν τὸν κατοικήσαντα ἐν Ασταρωθ καὶ ἐν Εδραιν — «Ога, царя Васанского, жившего в Астароте и в Едреи». В csl-ru и ru ст. 4 отдельный; в LXX это продолжение периода, начатого в ст. 3."
  5: "ἤρξατο … διασαφῆσαι — «начал изъяснять» (διασαφέω — «делать ясным, толковать»; слав. «изясняти»). ἐν τῷ πέραν τοῦ Ιορδάνου ἐν γῇ Μωαβ — «за Иорданом, в земле Моава». λέγων — «говоря»; вводит речь, начинающуюся в ст. 6, поэтому передано 次のように言った."
  6: "Κύριος ὁ θεὸς ἡμῶν — «Господь, Бог наш» (в речи Моисея — «наш»; ср. 4:7). Ἱκανούσθω ὑμῖν — «довольно вам» (ἱκανόω, императив 3 л.; слав. «да довлеет»). Слова Бога, начатые здесь, продолжаются в ст. 7–8; внутри речи Моисея они стоят в 『…』; ἐλάλησεν … λέγων — «говорил, говоря» (плеоназм LXX, по-японски одним глаголом)."
  7: "ἐπιστράφητε καὶ ἀπάρατε — «обратитесь и отправьтесь» (ἐπιστρέφω; ἀπαίρω — «сниматься со стоянки»). εἰσπορεύεσθε — «входите». ὄρος Αμορραίων — «гора Аморреев». πρὸς πάντας τοὺς περιοίκους Αραβα — «ко всем окрестным жителям Аравы» (περίοικος). εἰς ὄρος καὶ πεδίον — «в гору и поле», т. е. нагорье и равнину. πρὸς λίβα καὶ παραλίαν — «к югу и к приморью». Ἀντιλίβανον — Антиливан. ἕως τοῦ ποταμοῦ τοῦ μεγάλου Εὐφράτου — до великой реки Евфрата, предел обетования (Быт 15:18)."
  8: "ἴδετε — «смотрите» (мн. ч.; слав. «видите»). παραδέδωκα — перфект: «предал», дар уже дан. κληρονομήσατε — «наследуйте, примите в удел» (嗣業として受け継ぐ). ὤμοσα τοῖς πατρᾶσιν ὑμῶν — «клялся отцам вашим»; далее Авраам, Исаак, Иаков и τῷ σπέρματι αὐτῶν μετ᾿ αὐτούς — «семени их после них». Конец слов Бога."
  9: "εἶπα — аорист от λέγω, «я сказал» (слав. «рекох»). ἐν τῷ καιρῷ ἐκείνῳ — «в то время». Οὐ δυνήσομαι μόνος φέρειν ὑμᾶς — «не смогу один нести вас» (φέρω — «нести, выдерживать»); слав. «водити», Синодальный «водить» — по смыслу, в греч. «нести»."
  10: "ἐπλήθυνεν — «умножил» (πληθύνω). ὡσεὶ τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει — «как звёзды небесные по множеству» (τῷ πλήθει — датив отношения). καὶ ἰδού — «и вот»."
  11: "προσθείη — оптатив-пожелание «да приложит» (προστίθημι). χιλιοπλασίως — «тысячекратно» (наречие). εὐλογήσαι — «да благословит» (оптатив). καθότι ἐλάλησεν ὑμῖν — «как Он говорил вам»."
  12: "τὸν κόπον ὑμῶν — «труд ваш» (κόπος — утомление, тягота). τὴν ὑπόστασιν ὑμῶν — «бремя ваше» (ὑπόστασις здесь «ноша, груз»; слав. «тяжести»). τὰς ἀντιλογίας ὑμῶν — «распри ваши» (ἀντιλογία). Три дополнения при φέρω, порядок сохранён."
  13: "δότε ἑαυτοῖς — «дайте себе», т. е. изберите (слав. «изберите себе»). ἄνδρας σοφοὺς καὶ ἐπιστήμονας καὶ συνετούς — «мужей мудрых, сведущих и разумных» (ἐπιστήμων — «знающий», συνετός — «понятливый»). εἰς τὰς φυλὰς ὑμῶν — «по племенам вашим». καταστήσω — «поставлю» (καθίστημι). ἡγουμένους ὑμῶν — «вождями вашими»."
  14: "ἀπεκρίθητέ μοι — «вы отвечали мне». Καλὸν τὸ ῥῆμα, ὃ ἐλάλησας ποιῆσαι — «хорошо слово, которое ты сказал сделать» (слав. «добро слово, еже глаголал еси сотворити»). Слова народа — 『…』 как вложенная речь; смысл ответа передан кратко そうしよう."
  15: "ἔλαβον ἐξ ὑμῶν — «взял из вас». κατέστησα αὐτοὺς ἡγεῖσθαι ἐφ᾿ ὑμῶν — «поставил их начальствовать над вами». χιλιάρχους καὶ ἑκατοντάρχους καὶ πεντηκοντάρχους καὶ δεκαδάρχους — тысяченачальники, сотники, пятидесятники, десятники. γραμματοεισαγωγεῖς τοῖς κριταῖς ὑμῶν — «писмоводителями при судьях ваших» (γραμματοεισαγωγεύς, редкое слово LXX; слав. «писмовводители судиям вашым»); передано 監督 при 裁き人, ср. таблицу брифа."
  16: "ἐνετειλάμην — «заповедал» (ἐντέλλομαι). Διακούετε — «выслушивайте» (διακούω; слав. «разслушайте»). ἀνὰ μέσον τῶν ἀδελφῶν ὑμῶν — «между братьями вашими». κρίνατε δικαίως — «судите праведно». ἀνὰ μέσον ἀνδρὸς καὶ ἀνὰ μέσον ἀδελφοῦ καὶ ἀνὰ μέσον προσηλύτου αὐτοῦ — «между мужем и братом его и пришельцем его»; πρόσηλυτος — 寄留者."
  17: "οὐκ ἐπιγνώσῃ πρόσωπον ἐν κρίσει — «не познаешь лица на суде», т. е. не будь лицеприятен (ἐπιγινώσκω; слав. «да не познаете лица»). κατὰ τὸν μικρὸν καὶ κατὰ τὸν μέγαν κρινεῖς — «по малому и по великому судишь», т. е. одинаково. οὐ μὴ ὑποστείλῃ πρόσωπον ἀνθρώπου — «не устыдишься лица человеческого» (ὑποστέλλω — «робеть, убирать»). ὅτι ἡ κρίσις τοῦ θεοῦ ἐστιν — «ибо суд Божий есть». τὸ ῥῆμα, ὃ ἐὰν σκληρὸν ᾖ ἀφ᾿ ὑμῶν — «слово (дело), которое будет тяжко для вас» (σκληρός — «жёсткий»); ἀνοίσετε ἐπ᾿ ἐμέ — «вознесёте ко мне»."
  18: "ἐνετειλάμην ὑμῖν … πάντας τοὺς λόγους, οὓς ποιήσετε — «заповедал вам все слова, которые исполните»; λόγοι здесь — повеления, поэтому 行うべきすべてのこと."
  19: "ἀπάραντες ἐκ Χωρηβ — «отправившись из Хорива». ἐπορεύθημεν — «пошли». τὴν ἔρημον τὴν μεγάλην καὶ τὴν φοβερὰν ἐκείνην, ἣν εἴδετε — «пустыню великую и страшную ту, которую вы видели». ὁδὸν ὄρους τοῦ Αμορραίου — «дорогою горы Аморрея». καθότι ἐνετείλατο κύριος ὁ θεὸς ἡμῶν ἡμῖν — «как заповедал нам Господь, Бог наш». ἤλθομεν ἕως Καδης Βαρνη — «пришли до Кадес-Варни»."
  20: "Ἤλθατε — «вы пришли» (аорист). ὃ ὁ κύριος ὁ θεὸς ἡμῶν δίδωσιν ὑμῖν — «которую Господь, Бог наш, даёт вам» (настоящее время: дар уже в силе)."
  21: "παραδέδωκεν — перфект «предал». πρὸ προσώπου ὑμῶν — «пред лицом вашим». ἀναβάντες κληρονομήσατε — «взойдя, наследуйте». ὃν τρόπον εἶπεν — «как сказал». μὴ φοβεῖσθε μηδὲ δειλιάσητε — «не бойтесь и не малодушествуйте» (δειλιάω — «робеть»); передано おじけてはならない."
  22: "προσήλθατέ μοι πάντες — «приступили ко мне все». Ἀποστείλωμεν — конъюнктив-побуждение «пошлём». ἄνδρας προτέρους ἡμῶν — «мужей, идущих перед нами» (πρότερος). ἐφοδευσάτωσαν — «пусть разведают» (ἐφοδεύω — «обходить, осматривать»). ἀναγγειλάτωσαν … ἀπόκρισιν τὴν ὁδόν — «возвестят ответ о дороге» (ἀπόκρισις). εἰς ἃς εἰσπορευόμεθα εἰς αὐτάς — повтор предлога, как в LXX."
  23: "ἤρεσεν ἐναντίον μου τὸ ῥῆμα — «угодно было пред очами моими слово» (ἀρέσκω). ἄνδρα ἕνα κατὰ φυλήν — «по одному мужу на племя»."
  24: "ἐπιστραφέντες — «повернув». ἤλθοσαν — поздняя форма аориста (вм. ἦλθον). Φάραγξ βότρυος — «долина грозди» (греческая калька евр. Есхол; ср. Числ 13:23–24, где в корпусе ぶどうの房の谷). κατεσκόπευσαν — «высмотрели» (κατασκοπεύω)."
  25: "ἐλάβοσαν — аорист 3 мн. ч. (поздняя форма). ἀπὸ τοῦ καρποῦ τῆς γῆς — «из плодов земли». κατήνεγκαν — «принесли» (καταφέρω). ἔλεγον — имперфект «говорили». Ἀγαθὴ ἡ γῆ — «хороша земля». Слова разведчиков — 『…』."
  26: "οὐκ ἠθελήσατε ἀναβῆναι — «не восхотели взойти». ἠπειθήσατε τῷ ῥήματι — «не покорились слову» (ἀπειθέω с дативом)."
  27: "διεγογγύζετε — «роптали» (διαγογγύζω, имперфект; слав. «возроптасте»). ἐν ταῖς σκηναῖς ὑμῶν — «в шатрах ваших» (σκηνή; 天幕, не 幕屋). Διὰ τὸ μισεῖν κύριον ἡμᾶς — «из-за того, что Господь ненавидит нас» (артикль с инфинитивом). ἐξήγαγεν — «вывел». παραδοῦναι … ἐξολεθρεῦσαι — «чтобы предать … истребить» (ἐξολεθρεύω)."
  28: "ποῦ ἡμεῖς ἀναβαίνομεν — «куда мы взойдём?» ἀπέστησαν ὑμῶν τὴν καρδίαν — «отвели сердце ваше» (ἀφίστημι). Ἔθνος μέγα καὶ πολὺ καὶ δυνατώτερον ἡμῶν — «народ великий, многочисленный и сильнейший нас». τετειχισμέναι ἕως τοῦ οὐρανοῦ — «укреплённые до неба» (τειχίζω). υἱοὺς γιγάντων — «сынов гигантов» (γίγας; 巨人 уже пояснено в Быт 6:4). Слова народа продолжаются с 27-го стиха; речь разведчиков внутри них отдельно не выделена (третий уровень не вводится)."
  29: "Μὴ πτήξητε — «не устрашитесь» (πτήσσω — «приседать от страха»). μηδὲ φοβηθῆτε ἀπ᾿ αὐτῶν — «и не бойтесь их»."
  30: "ὁ προπορευόμενος πρὸ προσώπου ὑμῶν — «идущий пред лицом вашим». συνεκπολεμήσει — «будет вместе воевать», т. е. сразится за вас (συν + ἐκπολεμέω). κατὰ πάντα, ὅσα ἐποίησεν ὑμῖν ἐν γῇ Αἰγύπτῳ — «по всему, что Он сделал вам в земле Египетской». Стих без главного глагола в конце, как в LXX и слав."
  31: "ἐτροφοφόρησέν σε — «носил тебя» (τροφοφορέω — «носить на руках, вскармливая»; слав. «воспита»). ὡς εἴ τις τροφοφορήσει ἄνθρωπος τὸν υἱὸν αὐτοῦ — «как если бы человек нёс сына своего». κατὰ πᾶσαν τὴν ὁδόν, ἣν ἐπορεύθητε — «по всему пути, которым шли». Обращение в ед. ч. (σε) при мн. ч. контекста — как в LXX."
  32: "ἐν τῷ λόγῳ τούτῳ — «в этом слове (деле)». οὐκ ἐνεπιστεύσατε κυρίῳ — «не поверили Господу» (ἐμπιστεύω с дативом)."
  33: "ὃς προπορεύεται — «который идёт впереди» (настоящее время). ἐκλέγεσθαι ὑμῖν τόπον — «чтобы избирать вам место» (ἐκλέγομαι). ὁδηγῶν — «путеводя» (ὁδηγέω). ἐν πυρὶ νυκτός — «в огне ночью»; δεικνύων — «показывая». ἐν νεφέλῃ ἡμέρας — «в облаке днём» (слав. «и облаком во дни»)."
  34: "ἤκουσεν … τὴν φωνὴν τῶν λόγων ὑμῶν — «услышал глас слов ваших» (плеоназм LXX). παροξυνθείς — «раздражившись» (παροξύνω). ὤμοσεν λέγων — «поклялся, говоря»; λέγων вводит клятву ст. 35."
  35: "Εἰ ὄψεταί τις — «если увидит кто»: еврейская клятвенная формула с опущенным проклятием; по-русски передаётся отрицанием, поэтому だれも…見ることはない. ὤμοσα τοῖς πατράσιν αὐτῶν — «клялся отцам их»."
  36: "πλὴν Χαλεβ υἱὸς Ιεφοννη — «кроме Халева, сына Иефонни». ἐφ᾿ ἣν ἐπέβη — «на которую он ступил» (ἐπιβαίνω). διὰ τὸ προσκεῖσθαι αὐτὸν τὰ πρὸς κύριον — «за то, что он прилепился к Господу» (πρόσκειμαι — «быть приверженным»; слав. «прилежит Господеви»). Конец первой части клятвы."
  37: "ἐμοὶ ἐθυμώθη κύριος δι᾿ ὑμᾶς — «на меня разгневался Господь из-за вас» (θυμόω). Οὐδὲ σὺ οὐ μὴ εἰσέλθῃς ἐκεῖ — двойное отрицание: «и ты не войдёшь туда». Слова Господа возобновляются после замечания Моисея, поэтому 『…』 открыты заново."
  38: "ὁ παρεστηκώς σοι — «предстоящий тебе» (παρίστημι; ср. Числ 11:28). κατίσχυσον — «укрепи» (κατισχύω). κατακληρονομήσει αὐτὴν τῷ Ισραηλ — «даст её в удел Израилю» (κατακληρονομέω с дативом)."
  39: "πᾶν παιδίον νέον — «всякий ребёнок юный». ὅστις οὐκ οἶδεν σήμερον ἀγαθὸν ἢ κακόν — «кто не знает сегодня добра или зла» (οἶδεν — 3 л. ед. ч. при ὅστις). Слав. добавляет «о нихже глаголасте, яко в пленении имут быти» — в gr-lxx-byz этого нет, поэтому не внесено и 〔…〕 не ставится."
  40: "ἐπιστραφέντες ἐστρατοπεδεύσατε — «обратившись, расположились станом» (στρατοπεδεύω). εἰς τὴν ἔρημον ὁδὸν τὴν ἐπὶ τῆς ἐρυθρᾶς θαλάσσης — «в пустыню, дорогою к Чермному морю». Конец слов Господа."
  41: "Ἡμάρτομεν — «согрешили мы». ἀναβάντες πολεμήσομεν — «взойдя, будем воевать». ἀναλαβόντες ἕκαστος τὰ σκεύη τὰ πολεμικά — «взяв каждый воинские доспехи свои» (σκεῦος — «снаряжение»). συναθροισθέντες ἀνεβαίνετε — «собравшись, поднимались» (ἀναβαίνω, имперфект; слав. «взыдосте»), оттенок безрассудной решимости."
  42: "Εἰπὸν αὐτοῖς — императив «скажи им» (форма вм. εἰπέ). Οὐκ ἀναβήσεσθε οὐδὲ μὴ πολεμήσετε — «не взойдёте и не будете воевать». οὐ γάρ εἰμι μεθ᾿ ὑμῶν — «ибо Я не с вами». οὐ μὴ συντριβῆτε ἐνώπιον τῶν ἐχθρῶν ὑμῶν — букв. «да не будете сокрушены пред врагами вашими»: отрицание в целевой клаузе передаёт угрожающее следствие (ср. ст. 44), поэтому 打ち砕かれることのないように, как в слав. «да не будете сотрени»."
  43: "οὐκ εἰσηκούσατέ μου — «не послушали меня» (εἰσακούω). παρέβητε τὸ ῥῆμα κυρίου — «преступили слово Господа» (παραβαίνω). παραβιασάμενοι — «принудив себя, настояв» (παραβιάζομαι; слав. «понудившеся»), передано 押し切って."
  44: "ἐξῆλθεν ὁ Αμορραῖος ὁ κατοικῶν ἐν τῷ ὄρει ἐκείνῳ — «вышел Аморрей, живущий на горе той». κατεδίωξαν — «гнали» (καταδιώκω). ὡς εἰ ποιήσαισαν αἱ μέλισσαι — «как сделали бы пчёлы» (ὡς εἰ с оптативом; слав. «аки бы пчелы творили»). ἐτίτρωσκον — «наносили раны» (τιτρώσκω, имперфект). ἀπὸ Σηιρ ἕως Ερμα — «от Сеира до Ермы» (Ερμα — Хорма; у Синодального «Хорма», в LXX Ερμα)."
  45: "καθίσαντες ἐκλαίετε — «сев, плакали» (καθίζω; слав. «седше плакасте»). οὐκ εἰσήκουσεν … οὐδὲ προσέσχεν ὑμῖν — «не услышал и не внял вам» (προσέχω — «обращать внимание»)."
  46: "ἐνεκάθησθε — «сидели, оставались» (ἐγκαθέζομαι, редкий глагол; слав. «седесте»). ὅσας ποτὲ ἡμέρας — «сколько некогда дней». Повтор ἐνεκάθησθε в конце сохранён, как в LXX и слав."
