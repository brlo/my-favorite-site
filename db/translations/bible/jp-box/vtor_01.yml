# jp-box, Второзаконие, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник.
# jp-joc есть в 1:8–17 — только свидетель церковного чтения (старый язык),
# в язык перевода не переносился.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: вводная рамка (1–5); речь Моисея с 6-го стиха: Хорив и повеление
# идти (6–8), судьи (9–18), выступление от Хорива и разведчики (19–28),
# увещание и клятва Господа (29–40), поражение при Хорме (41–46).
# Нумерация совпадает с csl-ru и ru: 46 стихов.
# Кавычки: речь Моисея — 「…」 (от 6-го стиха до конца главы; речь продолжается
# в гл. 2–4, но по обычаю корпуса кавычки в каждой главе открываются заново —
# ср. Ин 14–17). Слова Бога внутри неё — 『…』 (6–8, 35–36, 37, 38–40);
# слова народа и разведчиков — 『…』 как вложенная речь (14, 22, 25, 27–28, 41).
# Собственные слова Моисея, которые он приводит («я сказал вам»: 9–13,
# 16–18, 20–21, 29–33), оставлены в первом уровне, чтобы не появился третий
# уровень вложенности. Красного нет.
# 〔…〕 нет: все слова есть в gr-lxx-byz. Отличия церковного чтения не внесены:
# 1:39 слав. «о нихже глаголасте, яко в пленении имут быти», 1:45 слав.
# «(и возвратистеся)» — в греч. нет, см. notes; проверено bracket_check.rb.
# Сносок ⟨…⟩ нет: 巨人 (Быт 6:4), 嗣業, 契約, ホル人 уже в корпусе,
# остальное понятно по контексту.
# Имена: エセボン (как в Числ 21:26), エドライン (Числ 21:33), カレブ,
# イェフォンネ (Числ 14), ヨシュア (ヌンの子). jp-ni не использовался.

tr_code: jp-box
