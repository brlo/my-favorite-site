verses:
  0: "ダビデの詩[うた]。週[しゅう]の初[はじ]めの日[ひ]のもの。"
  1: "地[ち]とその中[なか]に満[み]ちるもの、世界[せかい]とそこに住[す]む者[もの]はすべて、主[しゅ]のものである。"
  2: "主[しゅ]は海[うみ]の上[うえ]に地[ち]を据[す]え、川[かわ]の上[うえ]に地[ち]を固[かた]められた。"
  3: "だれが主[しゅ]の山[やま]に上[のぼ]り、だれがその聖[せい]なる所[ところ]に立[た]つことができるのか。"
  4: "手[て]が清[きよ]く、心[こころ]が純[じゅん]な者[もの]、むなしいことに自分[じぶん]の魂[たましい]を傾[かたむ]けず、隣人[りんじん]に偽[いつわ]りをもって誓[ちか]わない者[もの]である。"
  5: "その人[ひと]は主[しゅ]から祝福[しゅくふく]を、その救[すく]い主[ぬし]である神[かみ]からあわれみを受[う]ける。"
  6: "これが、主[しゅ]を求[もと]める者[もの]たちの世代[せだい]、ヤコブの神[かみ]の御顔[みかお]を求[もと]める者[もの]たちの世代[せだい]である。"
  7: "門[もん]よ、頭[かしら]を上[あ]げよ。とこしえの戸[と]よ、上[あ]がれ。栄光[えいこう]の王[おう]が入[はい]って来[こ]られる。"
  8: "栄光[えいこう]の王[おう]とは、だれか。強[つよ]く、力[ちから]ある主[しゅ]、戦[たたか]いに強[つよ]い主[しゅ]である。"
  9: "門[もん]よ、頭[かしら]を上[あ]げよ。とこしえの戸[と]よ、上[あ]がれ。栄光[えいこう]の王[おう]が入[はい]って来[こ]られる。"
  10: "栄光[えいこう]の王[おう]とは、だれか。万軍[ばんぐん]の主[しゅ]である。この方[かた]こそ、栄光[えいこう]の王[おう]である。"

notes:
  0: "Ψαλμὸς τῷ Δαυιδ· τῆς μιᾶς σαββάτων — ダビデの詩、週の初めの日のもの (μιᾶς σαββάτων — букв. «первого дня суббот», т. е. воскресенье; jp-joc 七日の首日). Надписание — стих 0."
  1: "τοῦ κυρίου ἡ γῆ — 地は主のもの. πλήρωμα αὐτῆς — その中に満ちるもの. οἰκουμένη — 世界."
  2: "ἐθεμελίωσεν ἐπὶ θαλασσῶν — 海の上に据え. ἡτοίμασεν ἐπὶ ποταμῶν — 川の上に固め."
  3: "τίς ἀναβήσεται — だれが上るか. τόπος ἅγιος — 聖なる所."
  4: "ἀθῷος χερσίν — 手が清い. καθαρὸς τῇ καρδίᾳ — 心が純な. ἐπὶ ματαίῳ — むなしいことに. ἐπὶ δόλῳ — 偽りをもって."
  5: "λήμψεται εὐλογίαν — 祝福を受ける. ἐλεημοσύνην — あわれみ. θεὸς σωτήρ — 救い主である神."
  6: "γενεὰ ζητούντων — 求める者たちの世代. πρόσωπον τοῦ θεοῦ Ιακωβ — ヤコブの神の御顔."
  7: "ἄρατε πύλας — 門よ、頭を上げよ. οἱ ἄρχοντες ὑμῶν — «начальники, князья ваши» (евр. «головы ваши»; отсюда 頭, как у jp-joc). πύλαι αἰώνιοι — とこしえの戸. βασιλεὺς τῆς δόξης — 栄光の王."
  8: "κραταιὸς καὶ δυνατός — 強く力ある. δυνατὸς ἐν πολέμῳ — 戦いに強い."
  9: "Повтор ст. 7 сохранён буквально, как в греч."
  10: "κύριος τῶν δυνάμεων — 万軍の主. αὐτός ἐστιν — この方こそ…である."
