# jp-box, Первое соборное послание Петра, глава 2. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 2: отложить пороки и возрастать как новорождённые (1–3), Христос —
# живой камень, верующие — духовный дом и священство (4–5), цитаты о камне
# (6–8), народ Божий (9–10), призыв к доброй жизни среди язычников (11–12),
# покорность властям (13–17), рабы и страдание невинного (18–25),
# Христос — образец в страдании, цитаты Ис 53 (21–25).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет.
# 〔…〕 в главе нет: в базе нет квадратных скобок со словами, которые пришлось бы
# оборачивать; 2:6, 2:7, 2:8, 2:22, 2:24 — цитаты Писания в 「」, атрибуция в notes.
# Сносок ⟨…⟩ нет: 生ける石, 祭司, 寄留者 уже встречались в корпусе. jp-ni не использовался.

tr_code: jp-box
book: 1pet
chapter: 2
draft: true

verses:
  1: "だから、あなたがたは、すべての悪意[あくい]、すべての欺[あざむ]き、偽善[ぎぜん]、妬[ねた]み、すべての中傷[ちゅうしょう]を捨[す]て去[さ]り、"
  2: "生[う]まれたばかりの幼子[おさなご]のように、混[ま]じり気[け]のない霊[れい]の乳[ちち]を慕[した]い求[もと]めなさい。それによって成長[せいちょう]し、救[すく]いに至[いた]るためである。"
  3: "あなたがたは、主[しゅ]がいつくしみ深[ぶか]い方[かた]であることを味[あじ]わったのである。"
  4: "あなたがたは、人[ひと]には捨[す]てられ、神[かみ]には選[えら]ばれた尊[とうと]い生[い]ける石[いし]であるこの方[かた]のもとに来[き]て、"
  5: "あなたがた自身[じしん]も、生[い]ける石[いし]として、霊[れい]の家[いえ]、聖[せい]なる祭司[さいし]として建[た]て上[あ]げられ、イエス・キリストによって、神[かみ]に喜[よろこ]ばれる霊[れい]のいけにえを献[ささ]げるのである。"
  6: "聖書[せいしょ]にこう書[か]かれているからである。「見[み]よ、わたしはシオンに、選[えら]ばれた尊[とうと]い隅[すみ]の石[いし]を据[す]える。この石[いし]を信[しん]じる者[もの]は、決[けっ]して恥[は]じを受[う]けない。」"
  7: "ですから、信[しん]じているあなたがたにとって、この石[いし]は誉[ほま]れである。しかし、信[しん]じない者[もの]たちにとっては、「家[いえ]を建[た]てる者[もの]たちが捨[す]てた石[いし]、これが隅[すみ]の石[いし]となった」のであり、"
  8: "また、「つまずきの石[いし]、つまずかせる岩[いわ]」となった。彼[かれ]らは御言葉[みことば]に従[したが]わずにつまずくのである。彼[かれ]らは、そのために定[さだ]められていたのである。"
  9: "しかし、あなたがたは選[えら]ばれた民[たみ]、王[おう]なる祭司[さいし]、聖[せい]なる国民[こくみん]、神[かみ]の所有[しょゆう]となる民[たみ]である。それは、あなたがたを暗[やみ]からご自身[じしん]の驚[おどろ]くべき光[ひかり]へと召[め]された方[かた]の御業[みわざ]を宣[の]べ伝[つた]えるためである。"
  10: "あなたがたは、かつては神[かみ]の民[たみ]ではなかったが、今[いま]は神[かみ]の民[たみ]である。かつてはあわれみを受[う]けなかったが、今[いま]はあわれみを受[う]けた者[もの]である。"
  11: "愛[あい]する者[もの]たちよ、わたしはあなたがたに勧[すす]める。寄留者[きりゅうしゃ]、旅人[たびびと]として、肉[にく]の欲[よく]から遠[とお]ざかりなさい。それらの欲[よく]は魂[たましい]に敵[てき]して戦[たたか]うのである。"
  12: "異邦人[いほうじん]の間[あいだ]で立派[りっぱ]な行[おこな]いをしなさい。そうすれば、彼[かれ]らがあなたがたを悪[わる]い者[もの]として中傷[ちゅうしょう]しているそのことについて、あなたがたの善[よ]い行[おこな]いを見[み]て、訪[おとず]れの日[ひ]に神[かみ]を崇[あが]めるようになる。"
  13: "主[しゅ]のために、人[ひと]の定[さだ]めたすべての制度[せいど]に従[したが]いなさい。王[おう]には、最[もっと]も優[すぐ]れた者[もの]として、"
  14: "また、総督[そうとく]たちには、悪[あく]を行[おこな]う者[もの]を罰[ばっ]し、善[ぜん]を行[おこな]う者[もの]をほめるために、王[おう]から遣[つか]わされた者[もの]として従[したが]いなさい。"
  15: "善[ぜん]を行[おこな]って、愚[おろ]かな人[ひと]たちの無知[むち]を封[ふう]じることは、神[かみ]の御心[みこころ]なのである。"
  16: "自由[じゆう]な者[もの]として、しかもその自由[じゆう]を悪[あく]の覆[おお]いとするのではなく、神[かみ]の僕[しもべ]として行[おこな]いなさい。"
  17: "すべての人[ひと]を敬[うやま]い、兄弟[きょうだい]たちを愛[あい]し、神[かみ]を畏[おそ]れ、王[おう]を敬[うやま]いなさい。"
  18: "僕[しもべ]たちよ、すべての畏[おそ]れをもって主人[しゅじん]たちに従[したが]いなさい。善[よ]い主人[しゅじん]にも寛容[かんよう]な主人[しゅじん]にも、また厳[きび]しい主人[しゅじん]にも従[したが]いなさい。"
  19: "神[かみ]を意識[いしき]して、不正[ふせい]に苦[くる]しみを受[う]けながら耐[た]え忍[しの]ぶなら、それは恵[めぐ]みである。"
  20: "罪[つみ]を犯[おか]して打[う]たれながら耐[た]え忍[しの]んでも、何[なん]の誉[ほま]れになろうか。しかし、善[ぜん]を行[おこな]いながら苦[くる]しみを受[う]けて耐[た]え忍[しの]ぶなら、それは神[かみ]の前[まえ]での恵[めぐ]みである。"
  21: "あなたがたは、このために召[め]されたのである。キリストもあなたがたのために苦[くる]しみを受け、あなたがたがその足跡[あしあと]に従[したが]うようにと、模範[もはん]を残[のこ]された。"
  22: "「この方[かた]は罪[つみ]を犯[おか]さず、その口[くち]に偽[いつわ]りが見[み]いだされなかった。」"
  23: "ののしられても、ののしり返[かえ]さず、苦[くる]しみを受けても、脅[おど]さず、正[ただ]しく裁[さば]かれる方[かた]に身[み]を委[ゆだ]ねられた。"
  24: "「この方[かた]はわたしたちの罪[つみ]を、ご自身[じしん]の体[からだ]で木[き]の上[うえ]に負[お]われた。それは、わたしたちが罪[つみ]に死[し]んで義[ぎ]に生[い]きるためである。その打[う]ち傷[きず]によって、あなたがたは癒[いや]された。」"
  25: "あなたがたは、かつては迷[まよ]い出[で]た羊[ひつじ]のようであったが、今[いま]は、あなたがたの魂[たましい]の牧者[ぼくしゃ]、監督[かんとく]のもとへ帰[かえ]ってきたのである。"

notes:
  1: "ἀποθέμενοι — 捨て去り (аористное причастие, продолжает 1:25). Пять пороков сохранены: κακία, δόλος, ὑπόκρισις, φθόνος, καταλαλιά — 悪意、欺き、偽善、妬み、中傷."
  2: "ἀρτιγέννητα βρέφη — 生まれたばかりの幼子. τὸ λογικὸν ἄδολον γάλα — 混じり気のない霊の乳; λογικός — «словесный, разумный» (jp-joc 靈智の乳); переведено 霊の乳 без добавления «слово»; значение λογικός спорно. ἐπιποθήσατε — 慕い求めなさい. αὐξηθῆτε εἰς σωτηρίαν — 成長し、救いに至る."
  3: "εἰ ἐγεύσασθε — 味わった (условное εἰ при аористе: «если вы вкусили»; передано утвердительно, как у jp-joc; Пс 33:9 — отсылка, а не цитата по списку). χρηστός — いつくしみ深い (ср. Рим 2:4)."
  4: "λίθον ζῶντα — 生ける石. ἀποδεδοκιμασμένον ὑπὸ ἀνθρώπων — 人には捨てられ. παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον — 神には選ばれた尊い. Причастие продолжается в 2:5."
  5: "οἶκος πνευματικός — 霊の家. ἱεράτευμα ἅγιον — 聖なる祭司 (собирательное). ἀνενέγκαι — 献げる. πνευματικαὶ θυσίαι εὐπρόσδεκτοι — 神に喜ばれる霊のいけにえ. διὰ Ἰησοῦ Χριστοῦ — イエス・キリストによって."
  6: "περιέχει ἐν γραφῇ — 聖書にこう書かれている (Ис 28:16, ср. Рим 9:33). ἀκρογωνιαῖος — 隅の石 (краеугольный). ἔντιμον — 尊い. οὐ μὴ καταισχυνθῇ — 決して恥じを受けることがない (двойное отрицание)."
  7: "ὑμῖν ἡ τιμή — あなたがたにとって誉れ. ἀπεδοκίμασαν οἱ οἰκοδομοῦντες — 家を建てる者たちが捨てた (Пс 118:22). κεφαλὴ γωνίας — 隅の石 (глава угла); в 2:6 ἀκρογωνιαῖος, здесь κεφαλὴ γωνίας — разные слова, оба переданы 隅の石."
  8: "λίθος προσκόμματος καὶ πέτρα σκανδάλου — つまずきの石、つまずかせる岩 (Ис 8:14). ἀπειθοῦντες τῷ λόγῳ — 御言葉に従わず. εἰς ὃ καὶ ἐτέθησαν — そのために定められていた (εἰς ὅ — «на что»; не сглажено)."
  9: "γένος ἐκλεκτόν — 選ばれた民 (род). βασίλειον ἱεράτευμα — 王なる祭司 (собирательное). ἔθνος ἅγιον — 聖なる国民. λαὸς εἰς περιποίησιν — 神の所有となる民; περιποίησις — «приобретение, удел» (ср. Еф 1:14). ἀρετάς — 御業 (совершенства, ср. 1 Пет 2:9). θαυμαστὸν φῶς — 驚くべき光."
  10: "ποτε οὐ λαὸς … νῦν δὲ λαὸς θεοῦ — かつては神の民ではなかったが、今は神の民 (Ос 1:6,9; 2:23; ср. Рим 9:25–26). οἱ οὐκ ἠλεημένοι … ἐλεηθέντες — あわれみを受けなかった者…あわれみを受けた者."
  11: "παροίκους καὶ παρεπιδήμους — 寄留者、旅人 (пара, ср. 1:1; 2:11). ἀπέχεσθαι — 遠ざかりなさい. σαρκικαὶ ἐπιθυμίαι — 肉の欲. στρατεύονται κατὰ τῆς ψυχῆς — 魂に敵して戦う (военный образ)."
  12: "ἀναστροφὴ καλή — 立派な行い. ἐν τοῖς ἔθνεσιν — 異邦人の間で. καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν — あなたがたを悪い者として中傷している. ἐποπτεύοντες — 見て. ἐν ἡμέρᾳ ἐπισκοπῆς — 訪れの日 (день посещения Божия, ср. Лк 19:44)."
  13: "ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει — 人の定めたすべての制度に従いなさい (κτίσις здесь — «установление»). διὰ τὸν κύριον — 主のために. βασιλεῖ ὡς ὑπερέχοντι — 最も優れた者としての王に."
  14: "ἡγεμόσιν — 総督たち (ср. Лк 3:1; Мф 27:2). δι᾽ αὐτοῦ πεμπομένοις — 王から遣わされた者. εἰς ἐκδίκησιν κακοποιῶν — 悪を行う者を罰し. ἔπαινος ἀγαθοποιῶν — 善を行う者をほめる."
  15: "φιμοῦν — 封じる (заграждать рот, ср. Мф 22:34). ἀγνωσία — 無知. τὸ θέλημα τοῦ θεοῦ — 神の御心."
  16: "ἐλεύθεροι — 自由な者. ἐπικάλυμμα τῆς κακίας — 悪の覆い (предлог для своеволия). θεοῦ δοῦλοι — 神の僕."
  17: "Четыре императива в порядке греч.: τιμήσατε, ἀγαπᾶτε, φοβεῖσθε, τιμᾶτε — 敬い、愛し、畏れ、敬いなさい. ἀδελφότης — 兄弟愛 (собирательно: «братство», поэтому 兄弟たちを愛し)."
  18: "οἰκέται — 僕たち (домочадцы-рабы). δεσπόται — 主人たち. σκολιοί — 厳しい (букв. «кривой, неправый»; смягчено, ср. jp-joc 苛刻). ἐν παντὶ φόβῳ — すべての畏れをもって."
  19: "τοῦτο γὰρ χάρις — それは恵みである (χάρις здесь — «благодать, одобрение»). διὰ συνείδησιν θεοῦ — 神を意識して (по совести перед Богом). ὑποφέρει λύπας πάσχων ἀδίκως — 不正に苦しみを受けながら耐え忍ぶ."
  20: "ποῖον κλέος — 何の誉れ. κολαφιζόμενοι — 打たれ (ср. 2 Кор 12:7). τοῦτο χάρις παρὰ θεῷ — 神の前での恵み."
  21: "εἰς τοῦτο ἐκλήθητε — このために召された. Χριστὸς ἔπαθεν ὑπὲρ ὑμῶν — キリストもあなたがたのために苦しみを受け. ὑπολιμπάνων ὑπογραμμόν — 模範を残し (ὑπογραμμός — «пропись, образец», hapax). ἴχνη — 足跡."
  22: "Цитата Ис 53:9. ἁμαρτίαν οὐκ ἐποίησεν — 罪を犯さず. δόλος ἐν τῷ στόματι — 口に偽り."
  23: "λοιδορούμενος — ののしられ. ἀντελοιδόρει — ののしり返さず. ἠπείλει — 脅さず. παρεδίδου τῷ κρίνοντι δικαίως — 正しく裁く方に委ねられた (имперфект: постоянно предавал)."
  24: "Цитата Ис 53:4–5. ἀνήνεγκεν ἐπὶ τὸ ξύλον — 木の上に負われた (ξύλον — древо креста, ср. Деян 5:30). ἀπογενόμενοι ταῖς ἁμαρτίαις — 罪に死んで. τῇ δικαιοσύνῃ ζήσωμεν — 義に生きる. μώλωψ — 打ち傷. ἰάθητε — 癒された (аорист)."
  25: "πρόβατα πλανώμενοι — 迷い出た羊 (Ис 53:6). ἐπεστράφητε — 帰ってきた (обратились). ποιμένα καὶ ἐπίσκοπον — 牧者、監督 (ср. 5:2–4; Деян 20:28)."
