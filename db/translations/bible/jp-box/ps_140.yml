verses:
  1: "ダビデの詩[うた]。主[しゅ]よ、わたしはあなたに呼[よ]び求[もと]めた。わたしに答[こた]えてください。わたしがあなたに呼[よ]び求[もと]めるとき、わたしの願[ねが]いの声[こえ]に耳[みみ]を傾[かたむ]けてください。"
  2: "わたしの祈[いの]りが、あなたの前[まえ]に香[こう]として立[た]ち上[のぼ]り、わたしが手[て]を上[あ]げることが、夕[ゆう]べのささげ物[もの]となりますように。"
  3: "主[しゅ]よ、わたしの口[くち]に見張[みは]りを置[お]き、わたしの唇[くちびる]の戸[と]を守[まも]ってください。"
  4: "わたしの心[こころ]を、悪[わる]い言葉[ことば]へと傾[かたむ]けないでください。不[ふ]法[ほう]を行[おこな]う人[ひと]たちと共[とも]に、罪[つみ]のための口実[こうじつ]を探[さが]すことがないように。彼[かれ]らの選[えら]ばれた者[もの]たちと、わたしが交[まじ]わることがないように。"
  5: "正[ただ]しい人[ひと]が、あわれみをもってわたしを懲[こ]らし、わたしを責[せ]めるように。罪[つみ]人[びと]の油[あぶら]が、わたしの頭[あたま]を潤[うるお]すことがないように。彼[かれ]らが喜[よろこ]ぶことのただ中[なか]で、わたしの祈[いの]りはなおも彼[かれ]らに逆[さか]らっている。"
  6: "岩[いわ]のそばの彼[かれ]らの裁[さば]き人[びと]たちは、のみ込[こ]まれた。彼[かれ]らは、わたしの言葉[ことば]を聞[き]く。わたしの言葉[ことば]は甘[あま]く響[ひび]いたからである。"
  7: "地[ち]の肥[こ]えた土[つち]が砕[くだ]かれるように、わたしたちの骨[ほね]は陰府[よみ]の口[くち]のそばに散[ち]らばった。"
  8: "主[しゅ]よ、主[しゅ]よ、わたしの目[め]はあなたを仰[あお]ぐ。わたしはあなたに寄[よ]り頼[たの]む。わたしの魂[たましい]を取[と]り去[さ]らないでください。"
  9: "わたしを、わたしのために仕掛[しか]けられた罠[わな]から、不[ふ]法[ほう]を行[おこな]う者[もの]たちの落[お]とし穴[あな]から守[まも]ってください。"
  10: "罪[つみ]人[びと]たちは、自分[じぶん]の網[あみ]に落[お]ちる。ただわたしだけが、通[とお]り過[す]ぎることができる。"

notes:
  1: "Ψαλμὸς τῷ Δαυιδ — ダビデの詩. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1). Κύριε, ἐκέκραξα πρὸς σέ, εἰσάκουσόν μου — 主よ、わたしはあなたに呼び求めた、わたしに答えてください (κράζω — «взывать»; εἰσακούω — «услышать»). πρόσχες τῇ φωνῇ τῆς δεήσεώς μου ἐν τῷ κεκραγέναι με πρὸς σέ — わたしがあなたに呼び求めるとき、わたしの願いの声に耳を傾けてください (повтор κράζω сохранён)."
  2: "κατευθυνθήτω ἡ προσευχή μου ὡς θυμίαμα ἐνώπιόν σου — わたしの祈りが、あなたの前に香として立ち上り (θυμίαμα — «фимиам»; κατευθύνω — «направлять», здесь «да будет вознесена»). ἔπαρσις τῶν χειρῶν μου θυσία ἑσπερινή — 手を上げることが夕べのささげ物 (ἔπαρσις — «воздеяние»; θυσία ἑσπερινή — «жертва вечерняя»)."
  3: "θοῦ, κύριε, φυλακὴν τῷ στόματί μου — 主よ、わたしの口に見張りを置き (τίθημι — «полагать»; φυλακή — «стража»). θύραν περιοχῆς περὶ τὰ χείλη μου — 唇の戸を守ってください (περιοχή — «ограда»; образ двери с запором)."
  4: "μὴ ἐκκλίνῃς τὴν καρδίαν μου εἰς λόγους πονηρίας — わたしの心を悪い言葉へ傾けないでください (ἐκκλίνω — «склонять»). τοῦ προφασίζεσθαι προφάσεις ἐν ἁμαρτίαις — 罪のための口実を探す (προφασίζομαι — «измышлять предлоги»; повтор корня сохранён). καὶ οὐ μὴ συνδυάσω μετὰ τῶν ἐκλεκτῶν αὐτῶν — 彼らの選ばれた者たちと交わることがないように (συνδυάζω — «сочетаться»; ἐκλεκτοί — «избранные»)."
  5: "παιδεύσει με δίκαιος ἐν ἐλέει καὶ ἐλέγξει με — 正しい人が、あわれみをもってわたしを懲らし、責めるように (παιδεύω — «наставлять, наказывать»; ἐλέγχω — «обличать»). ἔλαιον δὲ ἁμαρτωλοῦ μὴ λιπανάτω τὴν κεφαλήν μου — 罪人の油がわたしの頭を潤すことがないように (λιπαίνω — «умащать»). ὅτι ἔτι καὶ ἡ προσευχή μου ἐν ταῖς εὐδοκίαις αὐτῶν — 彼らが喜ぶことのただ中で、わたしの祈りはなおも彼らに逆らっている (тёмное место; передано по смыслу церковного текста, ср. jp-joc «молитва моя против их зла»)."
  6: "κατεπόθησαν ἐχόμενα πέτρας οἱ κριταὶ αὐτῶν — 岩のそばの彼らの裁き人たちは、のみ込まれた (καταπίνω — «проглатывать»). ἀκούσονται τὰ ῥήματά μου ὅτι ἡδύνθησαν — 彼らは、わたしの言葉を聞く、わたしの言葉は甘く響いたからである (ἡδύνω — «делать сладким»)."
  7: "ὡσεὶ πάχος γῆς διερράγη ἐπὶ τῆς γῆς — 地の肥えた土が砕かれるように (πάχος — «тук, жир»; διαρρήγνυμι — «разрывать»). διεσκορπίσθη τὰ ὀστᾶ ἡμῶν παρὰ τὸν ᾅδην — わたしたちの骨は陰府の口のそばに散らばった (διασκορπίζω — «рассеивать»)."
  8: "ὅτι πρὸς σέ, κύριε κύριε, οἱ ὀφθαλμοί μου — 主よ、主よ、わたしの目はあなたを仰ぐ. ἐπὶ σὲ ἤλπισα — わたしはあなたに寄り頼む. μὴ ἀντανέλῃς τὴν ψυχήν μου — わたしの魂を取り去らないでください (ἀνταναιρέω — «отнимать»)."
  9: "φύλαξόν με ἀπὸ παγίδος, ἧς συνεστήσαντό μοι — わたしのために仕掛けられた罠から守ってください (συνιστάω — «устраивать»). ἀπὸ σκανδάλων τῶν ἐργαζομένων τὴν ἀνομίαν — 不法を行う者たちの落とし穴から (σκάνδαλον — «западня»)."
  10: "πεσοῦνται ἐν ἀμφιβλήστρῳ αὐτοῦ ἁμαρτωλοί — 罪人たちは自分の網に落ちる (ἀμφίβληστρον — «сеть, невод»). κατὰ μόνας εἰμὶ ἐγὼ ἕως οὗ ἂν παρέλθω — ただわたしだけが通り過ぎることができる (κατὰ μόνας — «один, особняком»; ἕως οὗ ἂν παρέλθω — «доколе не пройду»)."
