# jp-box, 4-я Царств, глава 24. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); церковнославянский (csl-ru) — второй
# свидетель церковного текста: слав. чтения и добавки входят в основной текст
# без 〔…〕, вариант LXX — в notes.
# ru (Синодальный) — только для понимания, не источник.
# Глава 24: Иоаким и Навуходоносор (1–7), Иехония и первое переселение (8–17),
# Седекия (18–20).
# Речь — 常体; слова людей — 「…」 (в этой главе прямой речи нет).
# Особенности паритета: 4 — «сего ради» в csl; 6, 8, 15 — LXX называет
# Иехонию «Иоакимом», csl — «Иехония» (в тексте ヨヤキン); 17 — «сын его»
# по LXX/csl (Маттания — дядя Иехонии по масоретскому тексту); 18 — «из Ливны»
# добавлено в csl.
# 〔…〕 нет. Сносок ⟨…⟩ нет: 神殿, 契約の箱, 預言者, 宦官 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 4ts
chapter: 24
draft: true

verses:
  1: "彼の日[ひ]に、バビロンの王[おう]ネブカドネツァルが上[のぼ]って来[き]た。ヨヤキムは三[さん]年間[ねんかん]彼のしもべとなったが、やがて向[む]きを変[か]えて彼に背[そむ]いた。"
  2: "主[しゅ]は彼に対[たい]して、カルデアの略奪隊[りゃくだつたい]、シリアの略奪隊、モアブの略奪隊、アンモンの子[こ]らの略奪隊を送[おく]られた。主は彼らをユダの地[ち]に送って、主[しゅ]がそのしもべである預言者[よげんしゃ]たちの手[て]によって語[かた]られた言葉[ことば]のとおりに、彼を滅[ほろ]ぼされた。"
  3: "しかし、これはユダに対[たい]する主[しゅ]の怒[いか]りによるもので、主が彼らを御前[おんまえ]から退[しりぞ]けるためであった。マナセが行[おこな]ったすべてに従[したが]った、その罪[つみ]のゆえである。"
  4: "また、彼は罪[つみ]のない血[ち]を流[なが]し、エルサレムを罪のない血で満[み]たした。それゆえ主[しゅ]は宥[なだ]められることを望[のぞ]まれなかった。"
  5: "ヨヤキムの残[のこ]りの言葉[ことば]、彼が行[おこな]ったすべてのことは、ユダの王[おう]たちの日誌[にっし]の書[しょ]に書[か]かれているではないか。"
  6: "ヨヤキムは父[ちち]たちとともに眠[ねむ]り、その子[こ]ヨヤキンが代[か]わりに王[おう]となった。"
  7: "エジプトの王[おう]は、もはや自分[じぶん]の地[ち]から出[で]て行[い]くことはなかった。バビロンの王が、エジプトの流[なが]れからユーフラテス川[がわ]まで、エジプトの王に属[ぞく]するすべてを奪[うば]ったからである。"
  8: "ヨヤキンは十八歳[さい]で王[おう]となり、エルサレムで三[みっ]か月[げつ]治[おさ]めた。母[はは]の名[な]はネフシュタといい、エルサレムのエルナタンの娘[むすめ]であった。"
  9: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、父[ちち]が行ったすべてに従[したが]った。"
  10: "その時[とき]、バビロンの王[おう]ネブカドネツァルはエルサレムへ上[のぼ]って来[き]た。町[まち]は包囲[ほうい]された。"
  11: "バビロンの王[おう]ネブカドネツァルは町[まち]に入[はい]った。彼のしもべたちは町を包囲[ほうい]していた。"
  12: "ユダの王[おう]ヨヤキンは、自分[じぶん]とそのしもべたち、母[はは]、高官[こうかん]たち、宦官[かんがん]たちとともに、バビロンの王のもとへ出[で]て行[い]った。バビロンの王は彼を捕[と]らえた。それが彼の治世[ちせい]の第八年目[だいはちねんめ]であった。"
  13: "彼はそこから主[しゅ]の家[いえ]のすべての宝[たから]と王[おう]の家の宝を持[も]ち出[だ]し、イスラエルの王ソロモンが主の神殿[しんでん]に造[つく]ったすべての金[きん]の用具[ようぐ]を切[き]り刻[きざ]んだ。主[しゅ]の言葉[ことば]のとおりであった。"
  14: "彼はエルサレム人[じん]を移[うつ]し、すなわちすべての高官[こうかん]たち、力[ちから]ある者[もの]たちを捕[と]らえて移した。捕囚[ほしゅう]は一万人[いちまんにん]であった。また、すべての職人[しょくにん]と錠前[じょうまえ]師[し]も移した。貧[まず]しい地[ち]の人[ひと]たちのほかには、だれも残[のこ]らなかった。"
  15: "彼はヨヤキンをバビロンへ移[うつ]し、王[おう]の母[はは]、王の妻[つま]たち、王の宦官[かんがん]たち、またその地[ち]の力[ちから]ある者[もの]たちを、エルサレムからバビロンへ捕囚[ほしゅう]として連[つ]れて行[い]った。"
  16: "また、軍[ぐん]の男[おとこ]たちすべて七千人[ななせんにん]、職人[しょくにん]と錠前[じょうまえ]師[し]千人、すなわち戦[たたか]いを行[おこな]う力ある者すべてを、バビロンの王[おう]は捕囚[ほしゅう]としてバビロンへ連れて行った。"
  17: "バビロンの王[おう]は、ユダの王[おう]の子[こ]マタニヤを代[か]わりに王とし、その名[な]をセデキヤに変[か]えた。"
  18: "セデキヤは二十一歳[さい]で王[おう]となり、エルサレムで十一年[じゅういちねん]治[おさ]めた。母[はは]の名[な]はハムタルといい、リブナのエレミヤの娘[むすめ]であった。"
  19: "彼は主[しゅ]の目[め]に悪[わる]いことを行[おこな]い、ヨヤキムが行ったすべてに従[したが]った。"
  20: "主[しゅ]の怒[いか]りはエルサレムとユダに対[たい]して激[はげ]しく、ついに主は彼らを御前[おんまえ]から投[な]げ捨[す]てられた。セデキヤはバビロンの王[おう]に背[そむ]いた。"

notes:
  1: "ἐν ταῖς ἡμέραις αὐτοῦ — во дни его. ἀνέβη — поднялся, выступил. ἐγενήθη αὐτῷ δοῦλος τρία ἔτη — стал ему рабом на три года. ἐπέστρεψεν καὶ ἠθέτησεν — отвратился и отложился (слав. «отвратися, и отвержеся»)."
  2: "μονοζώνους — «опоясанных», лёгкие отряды, разбойники (слав. «единопоясники»). ἐξαπέστειλεν — послал. τοῦ κατισχῦσαι — чтобы одолеть. ἐν χειρὶ τῶν δούλων αὐτοῦ τῶν προφητῶν — рукою рабов Своих пророков. В csl «И посла Господь ему» — назван Господь, в LXX субъект не выражен; в csl при перечне пропущен Моав (в LXX он есть) — в тексте по LXX."
  3: "πλὴν ἐπὶ τὸν θυμὸν κυρίου — «впрочем, по гневу Господню». ἀποστῆσαι — удалить. ἐν ἁμαρτίαις Μανασση — за грехи Манассии."
  4: "αἷμα ἀθῷον ἐξέχεεν — пролил невинную кровь. ἔπλησεν τὴν Ιερουσαλημ αἵματος ἀθῴου — наполнил Иерусалим кровью невинною. ἱλασθῆναι — умилостивиться (слав. «умилостивитися»). В csl добавлено «сего ради» — нет в LXX; по паритету в тексте それゆえ."
  5: "τὰ λοιπὰ τῶν λόγων — прочее словес. βιβλίῳ λόγων τῶν ἡμερῶν — книге слов дней, летописи. οὐκ ἰδοὺ ταῦτα γεγραμμένα — не это ли написано."
  6: "ἐκοιμήθη — почил. В LXX «Ιωακιμ υἱὸς αὐτοῦ» — «Иоаким, сын его» (то же имя, что у отца); в csl «воцарися иехониа» — Иехония; в тексте по csl ヨヤキン (ср. 24:8, 15; 25:27)."
  7: "οὐ προσέθετο ἔτι — «не приложил более». ἀπὸ τοῦ χειμάρρου Αἰγύπτου — от потока Египетского. ἕως τοῦ ποταμοῦ Εὐφράτου — до реки Евфрата. ὅσα ἦν τοῦ βασιλέως Αἰγύπτου — что принадлежало царю Египетскому."
  8: "В LXX снова «Ιωακιμ» вместо Иехонии (см. 24:6); в csl «иехониа». Νεσθα θυγάτηρ Ελλαναθαν — Нехушта, дочь Елнафана. τρίμηνον — три месяца."
  9: "τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου — злое в очах Господних. κατὰ πάντα, ὅσα ἐποίησεν ὁ πατὴρ αὐτοῦ — по всему, что делал отец его."
  10: "ἐν τῷ καιρῷ ἐκείνῳ — в то время. ἦλθεν ἡ πόλις ἐν περιοχῇ — город оказался в осаде (περιοχή — обложение)."
  11: "εἰσῆλθεν — вошёл. οἱ παῖδες αὐτοῦ ἐπολιόρκουν — слуги его осаждали (слав. «отроцы его около обседяху»)."
  12: "ἐξῆλθεν — вышел. οἱ παῖδες — слуги; οἱ ἄρχοντες — князья; οἱ εὐνοῦχοι — евнухи. ἐν ἔτει ὀγδόῳ τῆς βασιλείας αὐτοῦ — в восьмой год его царствования (Навуходоносора). В LXX здесь снова «Ιωακιμ», в csl «иехониа» — в тексте ヨヤキン."
  13: "ἐξήνεγκεν — вынес. θησαυρούς — сокровища. συνέκοψεν — изрубил, изломал (слав. «сокруши»). κατὰ τὸ ῥῆμα κυρίου — по слову Господню."
  14: "ἀπῴκισεν — переселил. αἰχμαλωσίας δέκα χιλιάδας — плена десять тысяч. τέκτονα — плотника, ремесленника; τὸν συγκλείοντα — «запирающего», слесаря (слав. «художники»). οἱ πτωχοὶ τῆς γῆς — бедные земли."
  15: "ἀπῴκισεν τὸν Ιωακιμ — LXX снова «Иоаким» (см. 24:6, 8); в csl «иехонию»; в тексте ヨヤキン. τοὺς ἰσχυροὺς τῆς γῆς — сильных земли. ἀποικεσίαν — переселение."
  16: "ἄνδρας τῆς δυνάμεως ἑπτακισχιλίους — мужей силы семь тысяч. τέκτονα καὶ συγκλείοντα χιλίους — ремесленников и слесарей тысячу. δυνατοὶ ποιοῦντες πόλεμον — сильные, творящие войну. μετοικεσίαν — переселение."
  17: "ἐβασίλευσεν… τὸν Μαθθανιαν υἱὸν αὐτοῦ ἀντ αὐτοῦ — LXX «сына его», т.е. сына царя иудейского (в масоретском тексте Маттания — дядя Иехонии; слав. «сына его»); в тексте по LXX/csl. ἐπέθηκεν τὸ ὄνομα — возложил имя, переименовал."
  18: "Υἱὸς εἴκοσι καὶ ἑνὸς ἐνιαυτοῦ — «сын двадцати одного года». В csl добавлено «от ловны» (из Ливны) — в LXX здесь нет; по паритету в тексте."
  19: "κατὰ πάντα, ὅσα ἐποίησεν Ιωακιμ — по всему, что сделал Иоаким (в тексте ヨヤキム)."
  20: "ἐπὶ τὸν θυμὸν κυρίου ἦν — «по гневу Господню было». ἕως ἀπέρριψεν — доколе не отверг. ἠθέτησεν ἐν τῷ βασιλεῖ — отложился от царя (слав. «отвержеся царя вавилонска»)."
