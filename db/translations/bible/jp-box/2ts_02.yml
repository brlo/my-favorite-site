# jp-box, 2-я Царств, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); второй свидетель церковного текста —
# церковнославянский (csl-ru), по новому паритету (docs/japanese-bible.md,
# «Паритет LXX и церковнославянского»); ru (Синодальный) — только для понимания.
# jp-joc в книге нет; jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 2: вопрошание Господа и помазание в Хевроне (1–7), воцарение Иевосфея
# и Авенир (8–11), бой у Гаваонского источника и смерть Асаила (12–23),
# прекращение погони (24–28), возвращение Авенира (29), потери обеих сторон (30–32).
# Речь — 「…」 (1, 4, 5–7, 14, 20, 21, 22, 26, 27). Красного и синего нет.
# Нумерация по gr: 32 стиха, совпадает с csl/ru.
# 〔…〕 нет: стихи есть в gr, слав. добавлений, которые надо было бы внести без
# скобок, в главе нет.
# Сносок ⟨…⟩ нет: ペリシテ人, 契約, 油を注ぐ уже в корпусе.

