verses:
  1: "その後[のち]、ダビデは主[しゅ]に尋[たず]ねて言[い]った。「ユダの町[まち]の一[ひと]つに上[のぼ]るべきか。」主[しゅ]は彼[かれ]に言[い]った。「上[のぼ]れ。」ダビデは言[い]った。「どこへ上[のぼ]るのか。」主は言[い]った。「ヘブロンへ。」"
  2: "ダビデはヘブロンへ上[のぼ]り、二人[ふたり]の妻[つま]、イズレエル人[じん]アヒノアムと、カルメル人[じん]ナバルの妻[つま]だったアビガイルも上[のぼ]った。"
  3: "ダビデは自分[じぶん]とともにいる男[おとこ]たちを、それぞれの家[いえ]とともに連[つ]れて行[い]き、彼[かれ]らはヘブロンの町[まち]々[まち]に住[す]んだ。"
  4: "ユダの男[おとこ]たちが来[き]て、そこでダビデに油[あぶら]を注[そそ]ぎ、ユダの家[いえ]を治[おさ]める王[おう]とした。人[ひと]々[びと]はダビデに告[つ]げて言[い]った。「ギレアデのヤビシュの人[ひと]々[びと]がサウルを葬[ほうむ]った。」"
  5: "ダビデはギレアデのヤビシュの首長[しゅちょう]たちに使者[ししゃ]を送[おく]り、彼[かれ]らに言[い]った。「あなたがたの主人[しゅじん]サウル、主[しゅ]の油[あぶら]を注[そそ]がれた者[もの]にこの慈[いつく]しみを施[ほどこ]し、彼とその息子[むすこ]ヨナタンを葬[ほうむ]ったあなたがたは、主[しゅ]に祝福[しゅくふく]されている。"
  6: "どうか、主[しゅ]があなたがたに慈[いつく]しみと真実[しんじつ]を施[ほどこ]されるように。わたしも、あなたがたがこの事[こと]をしたのだから、あなたがたにこの良[よ]いことをしよう。"
  7: "今[いま]、あなたがたの手[て]を強[つよ]くし、力[ちから]ある者[もの]となりなさい。あなたがたの主人[しゅじん]サウルは死[し]んだ。そして、ユダの家[いえ]はわたしに油[あぶら]を注[そそ]いで、自分[じぶん]たちの王[おう]としたからだ。」"
  8: "しかし、サウルの軍[ぐん]の長[ちょう]だったネルの子[こ]アブネルは、サウルの子[こ]イシュボシェトを陣営[じんえい]から連[つ]れ出[だ]し、マハナイムへ上[のぼ]らせた。"
  9: "そして、彼[かれ]をギレアデとタシリとイズレエルとエフライムとベニヤミン、すなわち全[ぜん]イスラエルの王[おう]とした。"
  10: "サウルの子[こ]イシュボシェトは四十歳[さい]でイスラエルの王[おう]となり、二年[にねん]治[おさ]めた。ただし、ユダの家[いえ]だけはダビデについていた。"
  11: "ダビデがヘブロンでユダの家[いえ]を治[おさ]めた期間[きかん]は、七年[ななねん]と六[ろく]か月[げつ]だった。"
  12: "ネルの子[こ]アブネルと、サウルの子[こ]イシュボシェトの若者[わかもの]たちは、マハナイムからガバオンへ出[で]て行[い]った。"
  13: "ツルヤの子[こ]ヨアブとダビデの若者[わかもの]たちもヘブロンから出[で]て、ガバオンの泉[いずみ]のほとりで彼[かれ]らと顔[かお]を合[あ]わせた。そして、一方[いっぽう]は泉のこちら側[がわ]に、他方[たほう]は泉のあちら側[がわ]に座[すわ]った。"
  14: "アブネルはヨアブに言[い]った。「若者[わかもの]たちを立[た]たせて、わたしたちの前[まえ]で戯[たわむ]れさせよう。」ヨアブは言[い]った。「立[た]たせよ。」"
  15: "彼[かれ]らは立[た]ち、ベニヤミンとサウルの子[こ]イシュボシェトの側[がわ]から十二人[じゅうににん]、ダビデの若者[わかもの]たちから十二人[じゅうににん]、数[かず]を定[さだ]めて進[すす]み出[で]た。"
  16: "それぞれが相手[あいて]の頭[あたま]をつかみ、剣[つるぎ]を相手[あいて]の脇腹[わきばら]に突[つ]き刺[さ]した。彼らはともに倒[たお]れた。そこでその場所[ばしょ]は、ガバオンにある「陰謀[いんぼう]の者[もの]たちの分[ぶん]け前[まえ]」と呼[よ]ばれた。"
  17: "その日[ひ]、戦[いくさ]はひどく激[はげ]しくなり、アブネルとイスラエルの男[おとこ]たちはダビデの若者[わかもの]たちの前[まえ]で打[う]ち負[ま]かされた。"
  18: "そこにはツルヤの三人[さんにん]の子[こ]、ヨアブ、アベシャ、アサエルがいた。アサエルは野[の]の羚羊[かもしか]のように足[あし]が速[はや]かった。"
  19: "アサエルはアブネルを追[お]いかけた。そして右[みぎ]にも左[ひだり]にもそれず、アブネルの後[あと]を追[お]い続[つづ]けた。"
  20: "アブネルは後[うし]ろを振[ふ]り向[む]いて言[い]った。「おまえはアサエルか。」アサエルは言[い]った。「わたしだ。」"
  21: "アブネルは彼[かれ]に言[い]った。「右[みぎ]か左[ひだり]へそれて、若者[わかもの]の一人[ひとり]を捕[つか]まえ、その武具[ぶぐ]を自分[じぶん]のものとせよ。」しかしアサエルは、彼[かれ]の後[あと]からそれようとしなかった。"
  22: "アブネルはさらにアサエルに言[い]った。「わたしから離[はな]れよ。さもないと、わたしはおまえを地[ち]に打[う]ち倒[たお]してしまう。そうすれば、どうしてヨアブに顔[かお]を向[む]けられようか。そんなことがどこにあろうか。兄弟[きょうだい]ヨアブのもとへ戻[もど]れ。」"
  23: "しかし彼[かれ]は離[はな]れようとしなかった。アブネルは槍[やり]の後[うし]ろの端[はし]で彼[かれ]の脇腹[わきばら]を打[う]ち、槍[やり]は彼[かれ]の体[からだ]を貫[つらぬ]いて出[で]た。彼はそこで倒[たお]れて死[し]んだ。アサエルが倒[たお]れて死[し]んだその場所[ばしょ]に来[く]る者[もの]はみな、立[た]ち止[ど]まった。"
  24: "ヨアブとアベシャはアブネルの後[あと]を追[お]った。日[ひ]が沈[しず]むころ、彼[かれ]らは、ガイの前[まえ]にあるアンマの丘[おか]へ、すなわちガバオンの荒野[こうや]へ通[とお]じる道[みち]まで来[き]た。"
  25: "ベニヤミンの子[こ]らはアブネルのもとに集[あつ]まり、一[ひと]つの部[ぶ]隊[たい]となって、一[ひと]つの丘[おか]の頂[いただき]に立[た]った。"
  26: "アブネルはヨアブを呼[よ]んで言[い]った。「剣[つるぎ]はいつまでも食[く]い尽[つ]くすのか。終[お]わりが苦[にが]くなることを知[し]らないのか。いつまで民[たみ]に、兄弟[きょうだい]たちを追[お]うのをやめよと言[い]わないのか。」"
  27: "ヨアブは言[い]った。「主[しゅ]は生[い]きておられる。もしあなたが語らなかったなら、民は朝[あさ]からもう、それぞれ自分[じぶん]の兄弟[きょうだい]を追[お]って上[のぼ]っていただろう。」"
  28: "ヨアブは角笛[つのぶえ]を吹[ふ]き鳴[な]らした。民[たみ]はみな立[た]ち止[ど]まり、二度[にど]とイスラエルを追[お]わず、戦[たたか]いを続[つづ]けなかった。"
  29: "アブネルとその男[おとこ]たちは、その夜[よ]、西[にし]へ向[む]かって行[い]き、ヨルダンを渡[わた]って、長[なが]く続[つづ]く道[みち]をすっかり通[とお]り過[す]ぎ、陣営[じんえい]に着[つ]いた。"
  30: "ヨアブはアブネルを追[お]うのをやめて戻[もど]り、民[たみ]をすべて集[あつ]めた。ダビデの若者[わかもの]たちを数[かぞ]えると、十九人[じゅうきゅうにん]とアサエルがいなかった。"
  31: "しかし、ダビデの若者[わかもの]たちは、ベニヤミンの子[こ]ら、アブネルの男[おとこ]たちのうち三百六十人[さんびゃくろくじゅうにん]を打[う]ち殺[ころ]した。"
  32: "彼[かれ]らはアサエルを運[はこ]び、ベツレヘムにある父[ちち]の墓[はか]に葬[ほうむ]った。ヨアブとその男[おとこ]たちは夜[よ]通[どお]し歩[ある]いて、ヘブロンで彼[かれ]らに夜[よ]が明[あ]けた。"

notes:
  1: "ἐπηρώτησεν ἐν κυρίῳ — вопросил в Господе, т.е. через Господа (слав. «вопроси Господа»). Εἰ ἀναβῶ — взойти ли мне (косвенный вопрос). εἰς μίαν τῶν πόλεων Ιουδα — в один из городов Иудиных. Три пары реплик: вопрос Давида — ответ Господа — уточнение — ответ."
  2: "ἀμφότεραι αἱ γυναῖκες — обе жены (ἀμφότερος). Αχινοομ ἡ Ιεζραηλῖτις — Ахиноама Изреелитянка (в корпусе イズレエル人, アヒノアム). Αβιγαια ἡ γυνὴ Ναβαλ τοῦ Καρμηλίου — Авигея, жена Навала Кармилитянина (ср. 1 Цар 25)."
  3: "ἕκαστος καὶ ὁ οἶκος αὐτοῦ — каждый и дом его. κατῴκουν ἐν ταῖς πόλεσιν Χεβρων — жили в городах Хеврона (LXX мн. ч.); слав. «во градех хевронских», Синод. «в городе Хевроне»."
  4: "ἄνδρες τῆς Ιουδαίας — мужи Иудеи. χρίουσιν — помазывают (χρίω). τοῦ βασιλεύειν ἐπὶ τὸν οἶκον Ιουδα — царствовать над домом Иудиным. Οἱ ἄνδρες Ιαβις τῆς Γαλααδίτιδος — жители Иависа Галаадского (ギレアデのヤビシュ, ср. 1 Цар 31:11–13)."
  5: "τοὺς ἡγουμένους — начальствующих, 首長 (ἡγούμενος); слав. «старейшинам». Εὐλογημένοι ὑμεῖς τῷ κυρίῳ — благословенны вы Господом. τὸ ἔλεος τοῦτο — эта милость. χριστὸν κυρίου — помазанника Господня."
  6: "ποιήσαι κύριος — да сотворит Господь (оптатив). ἔλεος καὶ ἀλήθειαν — милость и истину (парная формула, ср. Быт 24:49). τὰ ἀγαθὰ ταῦτα — эти блага."
  7: "κραταιούσθωσαν αἱ χεῖρες ὑμῶν — да укрепятся руки ваши (κραταιόω). γίνεσθε εἰς υἱοὺς δυνατούς — будьте сынами силы. κέχρικεν — помазал (перф. χρίω). ἐφ᾽ ἑαυτοὺς εἰς βασιλέα — над собою в цари."
  8: "ἀρχιστράτηγος — начальник войска (ἀρχιστράτηγος). ἀνεβίβασεν ἐκ τῆς παρεμβολῆς εἰς Μαναεμ — вывел из стана в Маханаим (Μαναεμ, マハナイム). Иевосфей (Ιεβοσθε) — イシュボシェト, как в 2:10; ср. 3:7, где LXX зовёт его Μεμφιβοσθε."
  9: "ἐπὶ τὴν Γαλααδῖτιν — над Галаадом. Θασιρι — Фасирь (слав. «Фасири»; Синод. «Ашур»), タシリ. Ιεζραελ — Изреель. Εφραιμ — Ефрем. Βενιαμιν — Вениамин."
  10: "τεσσαράκοντα ἐτῶν — сорока лет (Gen. absolutus). πλὴν τοῦ οἴκου Ιουδα — кроме дома Иудина (πλήν). οἳ ἦσαν ὀπίσω Δαυιδ — которые были за Давидом."
  11: "αἱ ἡμέραι, ἃς ἐβασίλευσεν — дни, в которые царствовал. ἑπτὰ ἔτη καὶ ἓξ μῆνας — семь лет и шесть месяцев."
  12: "ἐξῆλθεν ... ἐκ Μαναεμ εἰς Γαβαων — вышел из Маханаима в Гаваон. οἱ παῖδες Ιεβοσθε — слуги Иевосфея."
  13: "Ιωαβ υἱὸς Σαρουιας — Иоав, сын Саруи (ツルヤ, ср. 1 Цар 26:6). συναντῶσιν ἐπὶ τὴν κρήνην τὴν Γαβαων — встречаются у источника Гаваонского (κρήνη — источник; слав. «поток»). ἐπὶ τὸ αὐτό — вместе. ἐντεῦθεν ... ἐντεῦθεν — отсюда и отсюда, по обе стороны."
  14: "Ἀναστήτωσαν δὴ τὰ παιδάρια καὶ παιξάτωσαν — пусть встанут отроки и поиграют (παίζω; здесь — бой перед строем). ἐνώπιον ἡμῶν — пред нами."
  15: "παρῆλθον ἐν ἀριθμῷ — прошли по счёту. τῶν παίδων Βενιαμιν δώδεκα — из слуг Вениамина двенадцать."
  16: "ἐκράτησαν τὴν κεφαλὴν τοῦ πλησίον — схватили за голову ближнего. μάχαιρα εἰς πλευράν — меч в бок (πλευρά). κατὰ τὸ αὐτό — вместе. Μερὶς τῶν ἐπιβούλων — «часть замышляющих» (ἐπίβουλος — коварный); евр. Хелкаф-Хаццурим, Синод. передаёт смыслом."
  17: "πόλεμος σκληρός — жестокая война (σκληρός). ἔπταισεν — споткнулся, потерпел поражение (πταίω); слав. «паде»."
  18: "τρεῖς υἱοὶ Σαρουιας — три сына Саруи (ツルヤ). κοῦφος τοῖς ποσίν — лёгок на ноги (κοῦφος). δορκὰς ἐν ἀγρῷ — серна в поле (δορκάς), 羚羊. Имя Αβεσσα в корпусе — アベシャ (1 Цар 26:6)."
  19: "κατεδίωξεν — погнался (καταδιώκω). οὐκ ἐξέκλινεν — не уклонился (ἐκκλίνω). εἰς δεξιὰ οὐδὲ εἰς ἀριστερά — ни направо, ни налево."
  20: "Εἰ σὺ εἶ αὐτὸς Ασαηλ; — ты ли это, Асаил? Ἐγώ εἰμι — это я."
  21: "Ἔκκλινον ... καὶ κάτασχε σαυτῷ ἓν τῶν παιδαρίων — уклонись и захвати себе одного из отроков. τὴν πανοπλίαν αὐτοῦ — всё вооружение его (πανοπλία). οὐκ ἠθέλησεν ἐκκλῖναι ἐκ τῶν ὄπισθεν αὐτοῦ — не захотел уклониться от [следования] за ним, т.е. отстать."
  22: "Ἀπόστηθι ἀπ᾽ ἐμοῦ — отступи от меня. ἵνα μὴ πατάξω σε εἰς τὴν γῆν — чтобы я не поразил тебя на землю. πῶς ἀρῶ τὸ πρόσωπόν μου πρὸς Ιωαβ; — как подниму лицо моё к Иоаву? καὶ ποῦ ἐστιν ταῦτα; — «и где это?» (слав. и Синод. относят эту фразу к ст. 23; держим LXX, где она в 22). ἐπίστρεφε πρὸς Ιωαβ τὸν ἀδελφόν σου — возвратись к Иоаву, брату твоему."
  23: "ἐν τῷ ὀπίσω τοῦ δόρατος — задним концом копья. ἐπὶ τὴν ψόαν — в чресла/пах (ψόα), 脇腹; слав. «в лядвия». διεξῆλθεν τὸ δόρυ ἐκ τῶν ὄπισθεν αὐτοῦ — копьё прошло насквозь. ἀποθνῄσκει ὑποκάτω αὐτοῦ — умирает под ним (слав. «пред ним»). ὑφίστατο — останавливался (ὑφίστημι)."
  24: "ὁ ἥλιος ἔδυνεν — солнце зашло (δύω). ἕως τοῦ βουνοῦ Αμμαν — до холма Амма. ἐπὶ προσώπου Γαι — против Гая (Γαι). ὁδὸν ἔρημον Γαβαων — дорогою пустыни Гаваонской."
  25: "συναθροίζονται — собираются (συναθροίζω). εἰς συνάντησιν μίαν — в одно собрание, одно ополчение (συνάντησις). ἐπὶ κεφαλὴν βουνοῦ ἑνός — на вершине одного холма (κεφαλή — вершина)."
  26: "Μὴ εἰς νῖκος καταφάγεται ἡ ῥομφαία; — не до победы ли будет пожирать меч? (νῖκος — победа, καταφάγομαι — пожрать). πικρὰ ἔσται εἰς τὰ ἔσχατα — горько будет в конце. ἕως πότε οὐ μὴ εἴπῃς — доколе не скажешь (двойное отрицание)."
  27: "Ζῇ κύριος — жив Господь (клятва). εἰ μὴ ἐλάλησας — если бы ты не сказал. ἐκ πρωίθεν ἀνέβη ὁ λαὸς ἕκαστος — с утра пошёл бы народ каждый (LXX); слав. «тогда от утра бы людие мои престали гоняще» — иное чтение, в тексте держим LXX."
  28: "ἐσάλπισεν τῇ σάλπιγγι — затрубил трубою (σαλπίζω). ἀπέστησαν πᾶς ὁ λαός — остановился весь народ (ἀφίστημι). οὐ προσέθεντο ἔτι τοῦ πολεμεῖν — не продолжали более воевать (προστίθημι)."
  29: "ἀπῆλθον εἰς δυσμάς — пошли на запад (δυσμή). διέβαιναν τὸν Ιορδάνην — переходили Иордан (имперфект). ὅλην τὴν παρατείνουσαν — всю протяжённую [область] (παρατείνω; Синод. «весь Битрон»), 長く続く道. εἰς τὴν παρεμβολήν — в стан."
  30: "ἀνέστρεψεν ὄπισθεν ἀπὸ τοῦ Αβεννηρ — возвратился от [преследования] Авенира. ἐπεσκέπησαν — были пересчитаны, недостало (ἐπισκέπτομαι). ἐννεακαίδεκα ἄνδρες καὶ Ασαηλ — девятнадцать человек и Асаил (слав. добавляет в скобках «падших»)."
  31: "ἐπάταξαν τῶν υἱῶν Βενιαμιν τῶν ἀνδρῶν Αβεννηρ — поразили из сынов Вениамина, мужей Авенировых. τριακοσίους ἑξήκοντα — триста шестьдесят. παρ᾽ αὐτοῦ — из них, при нём."
  32: "τῷ τάφῳ τοῦ πατρὸς αὐτοῦ ἐν Βαιθλεεμ — в гробе отца его в Вифлееме. διέφαυσεν αὐτοῖς ἐν Χεβρων — рассвело им в Хевроне (διαφαύσκω); Синод. «на рассвете прибыл в Хеврон»."
