# jp-box, Песнь Песней, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: женщина ищет возлюбленного по ночам (1–4), заклинание дочерей Иерусалима (5),
# хор — шествие из пустыни, ложе и носилки Соломона, венец (6–11).
# Голоса: 1–5 — женщина, без кавычек; вопрос стражей в ст. 3 — 「…」 (первый уровень,
# потому что сама женщина без кавычек); 6–11 — хор, одной цитатой 「…」 до конца главы.
# Нумерация по gr: 11 стихов, как и в csl (совпадает стих в стих).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет (по брифу главы): ソロモン, 没薬, 乳香, 香料, レバノン, 輿 уже в корпусе;
# ナルド, サフラン, 菖蒲, シナモン, アロエ — кандидаты в словарь, но в этой главе не подписаны.

tr_code: jp-box
book: pp
chapter: 3
draft: true

verses:
  1: "夜[よる]ごとに、寝床[ねどこ]の上[うえ]で、わたしの魂[たましい]が愛[あい]した者[もの]を求[もと]めた。わたしは彼[かれ]を求めたが、見[み]つからなかった。彼を呼[よ]んだが、答[こた]えなかった。"
  2: "わたしは起[お]きて、町[まち]を巡[めぐ]り、市場[いちば]や広場[ひろば]で、わたしの魂[たましい]が愛[あい]した者[もの]を捜[さが]そう。わたしは彼[かれ]を捜したが、見[み]つからなかった。"
  3: "町[まち]を巡[めぐ]る見張[みは]りたちが、わたしを見[み]つけた。「あなたがたは、わたしの魂[たましい]が愛[あい]した者[もの]を見なかったか。」"
  4: "彼[かれ]らから少[すこ]し行[ゆ]き過[す]ぎたころ、わたしは、わたしの魂[たましい]が愛[あい]した者[もの]を見[み]つけた。わたしは彼[かれ]を捕[つか]まえ、母[はは]の家[いえ]、わたしを宿[やど]した者[もの]の奥[おく]の間[ま]へ連[つ]れて行[い]くまで、離[はな]さなかった。"
  5: "エルサレムの娘たち、わたしはあなたがたを、野[の]の力[ちから]と野の強[つよ]さにかけて誓[ちか]わせる。愛[あい]が自[みずか]ら望[のぞ]むまで、あなたがたは愛を起[お]こさず、目覚[めざ]めさせてもならない。"
  6: "「砂漠[さばく]から上[のぼ]って来[く]るこの者[もの]はだれか。煙[けむり]の柱[はしら]のように、没薬[もつやく]と乳香[にゅうこう]、香料[こうりょう]を調[ととの]える者[もの]のあらゆる粉[こな]で薫[くゆ]らされている。"
  7: "見[み]よ、ソロモンの寝台[しんだい]。その周[まわ]りには六十人[ろくじゅうにん]の勇士[ゆうし]がいる。イスラエルの勇士[ゆうし]たちのうちの者[もの]たちである。"
  8: "すべて剣[つるぎ]を手[て]にした者[もの]たち、戦[いくさ]を教[おし]え込[こ]まれた者[もの]たちである。めいめいの剣[つるぎ]は、夜[よる]の恐怖[きょうふ]のゆえに、腿[もも]に帯[お]びられている。"
  9: "ソロモン王[おう]は自分[じぶん]のために、レバノンの木[き]で輿[こし]を作[つく]った。"
  10: "その柱[はしら]は銀[ぎん]、その肘掛[ひじかけ]は金[きん]で作られ、その座[ざ]は紫[むらさき]の布[ぬの]、その内側[うちがわ]は石畳[いしだたみ]で、エルサレムの娘[むすめ]たちからの愛[あい]が込[こ]められている。"
  11: "シオンの娘[むすめ]たちよ、出[で]て来[き]て、冠[かんむり]を戴[いただ]いたソロモン王[おう]を見[み]よ。その冠は、彼[かれ]の婚礼[こんれい]の日[ひ]、心[こころ]の喜[よろこ]びの日[ひ]に、母[はは]が彼に戴かせたものである。」"

notes:
  1: "Говорит женщина, без кавычек (продолжение её речи из 2:16–17). ἐπὶ κοίτην μου ἐν νυξίν — «на ложе моём, в ночах» (мн. ч. νυξίν, отсюда 夜ごとに; слав. «в нощех»). ἐζήτησα… ἐζήτησα — повтор сохранён. ἐκάλεσα αὐτόν, καὶ οὐχ ὑπήκουσέν μου — «позвала его, и не отозвался он» (ὑπακούω — слушаться, откликаться); в ru эта половина стиха опущена, в csl есть («воззвах его, и не послуша мене»)."
  2: "Женщина. ἀναστήσομαι δὴ καὶ κυκλώσω — «встану же и обойду» (κυκλόω — обходить кругом); усилительное δή отдельно не передано. ἀγοραί — торжища, площади; πλατεῖαι — широкие улицы (広場). Слав. в конце добавляет «звах его, и не послуша мене» — это дублет ст. 1, в LXX его нет, поэтому в текст не внесён (ср. Чис 33:49)."
  3: "Женщина; вопрос стражей — 「…」 (первый уровень, потому что сама женщина без кавычек). οἱ τηροῦντες οἱ κυκλοῦντες ἐν τῇ πόλει — «стерегущие, обходящие город». μή в вопросе предполагает отрицательный ответ («не видели ли»), поэтому 見なかったか; слав. «видесте ли» нейтральнее."
  4: "Женщина. ὡς μικρὸν ὅτε παρῆλθον ἀπ᾿ αὐτῶν — «когда немного прошла от них» (ὡς μικρόν — чуть-чуть). ἐκράτησα αὐτὸν καὶ οὐκ ἀφήσω αὐτόν — «схватила его и не отпущу»; ἕως οὗ εἰσήγαγον — «доколе не ввела». οἶκος μητρός — дом матери; ταμίειον — внутренний покой, храмина (слав. «чертог»); ἡ συλλαβοῦσά με — «зачавшая меня» (συλλαμβάνω)."
  5: "Женщина; заклинание, дословно повторяющее формулу 2:7 (в греч. отличие только ἕως ἂν вместо ἕως οὗ, в csl «селных» вместо «села»), поэтому и по-японски оно передано теми же словами. ὥρκισα ὑμᾶς — «закляла вас» (ὁρκίζω, каузатив: «велела вам заклясться»). ἐν ταῖς δυνάμεσιν καὶ ἐν ταῖς ἰσχύσεσιν τοῦ ἀγροῦ — букв. «силами и крепостями поля»: LXX так передаёт евр. «сернами и полевыми ланями», слав. «в силах и в крепостех селных»; по паритету оставлено буквальное чтение LXX/csl, вариант ru («сернами или полевыми ланями») в notes. ἐγείρητε καὶ ἐξεγείρητε — «разбудите и возбудите»; в клятвенной формуле ἐάν значит «не…»; ἕως ἂν θελήσῃ — «доколе не пожелает»."
  6: "Говорит хор, поэтому 「…」 до конца главы. τίς αὕτη ἡ ἀναβαίνουσα ἀπὸ τῆς ἐρήμου — «кто эта, восходящая из пустыни». στελέχη καπνοῦ — «стебли, столбы дыма» (στέλεχος — ствол); τεθυμιαμένη — «окуриваемая» (θυμιάω — кадить). κονιορτοί — порошки, пыльцы; μυρεψός — составитель мазей (слав. «мироварец»), отсюда 香料を調える者."
  7: "Хор. κλίνη — ложе (слав. «одр»); переведено 寝台, а не 輿, потому что носилки в ст. 9 названы другим словом, φορεῖον. ἑξήκοντα δυνατοί — «шестьдесят сильных»; ἀπὸ δυνατῶν Ισραηλ — «из сильных Израилевых», т. е. из отборных воинов (勇士)."
  8: "Хор. πάντες κατέχοντες ῥομφαίαν — «все держащие меч» (ῥομφαία — большой меч, слав. «оружие»). δεδιδαγμένοι πόλεμον — «наученные войне». ἀνὴρ ῥομφαία αὐτοῦ ἐπὶ μηρὸν αὐτοῦ — «у каждого меч его на бедре его» (μηρός — 腿). ἀπὸ θάμβους ἐν νυξίν — «от ужаса в ночах» (θάμβος — оцепенение, страх)."
  9: "Хор. φορεῖον — носилки, паланкин (слав. «одр»); ἀπὸ ξύλων τοῦ Λιβάνου — «из деревьев Ливана» (ξύλον здесь — древесина, а не «дерево» растущее)."
  10: "Хор. στύλοι — столпы; ἀνάκλιτον — ложе с подлокотниками (слав. «восклонение»), отсюда 肘掛け. ἐπίβασις — букв. «наступ, всход»; слав. «восход», понимается как сиденье или настил, отсюда 座. ἐντὸς αὐτοῦ λιθόστρωτον — «внутри его мощено камнем». ἀγάπην ἀπὸ θυγατέρων Ιερουσαλημ — тёмное место: «любовь от дочерей Иерусалимских», т. е. любовный дар или украшение от них; оставлено буквально."
  11: "Хор; обращение «дщери Сиона» есть только в csl («Дщери сиони»), в LXX его нет — по паритету внесено в текст без 〔…〕. ἐξέλθατε καὶ ἴδετε — «выйдите и посмотрите». στεφάνῳ ᾧ ἐστεφάνωσεν αὐτὸν ἡ μήτηρ αὐτοῦ — «венцом, которым увенчала его мать его»; νύμφευσις — бракосочетание, εὐφροσύνη καρδίας — веселие сердца."
