verses:
  1: "その日[ひ]、トビトは、メディアのラゲスでガバエルに預[あず]けた銀[ぎん]のことを思[おも]い出[だ]した。"
  2: "そして心[こころ]のうちで言[い]った。「わたしは死[し]を求[もと]めた。なぜ、死ぬ前[まえ]に、わたしの子[こ]トビアを呼[よ]んで、彼[かれ]に告[つ]げ知[し]らせないのか。」"
  3: "そして彼[かれ]を呼[よ]んで言[い]った。「子[こ]よ、わたしが死[し]んだなら、わたしを葬[ほうむ]れ。母[はは]を蔑[さげす]んではならない。あなたの命[いのち]のすべての日[ひ]、母を敬[うやま]い、母の喜[よろこ]ぶことを行[おこな]い、母を悲[かな]しませてはならない。"
  4: "覚[おぼ]えていなさい、子[こ]よ。母[はは]はあなたのことで、胎内[たいない]で多[おお]くの危険[きけん]を見[み]たのだ。母が死[し]んだなら、わたしのそばの一[ひと]つの墓[はか]に母を葬[ほうむ]れ。"
  5: "子[こ]よ、すべての日[ひ]、わたしたちの神[かみ]である主[しゅ]を覚[おぼ]えていなさい。罪[つみ]を犯[おか]し、その戒[いまし]めを破[やぶ]ろうと願[ねが]ってはならない。あなたの命[いのち]のすべての日、正義[せいぎ]を行[おこな]い、不義[ふぎ]の道[みち]を歩[あゆ]んではならない。"
  6: "というのは、あなたが真理[しんり]を行[おこな]うなら、あなたの業[わざ]に幸[さいわ]いが訪[おとず]れるからである。正義[せいぎ]を行うすべての者[もの]にも幸いがある。"
  7: "正義[せいぎ]を行[おこな]うすべての者[もの]に、あなたの持[も]っているものから施[ほどこ]しをしなさい。施しをするとき、あなたの目[め]が惜[お]しんではならない。貧[まず]しい者からだれからも顔[かお]を背[そむ]けてはならない。そうすれば、神[かみ]の顔も決[けっ]してあなたから背けられることはない。"
  8: "あなたが持[も]っているままに、その多[おお]さに応[おう]じて、それらから施[ほどこ]しをしなさい。あなたに少[すこ]ししかないなら、その少なさに応じて施しをすることを恐[おそ]れてはならない。"
  9: "というのは、あなたは必要[ひつよう]の日[ひ]のために、良[よ]い宝[たから]を自分[じぶん]のために蓄[たくわ]えるからである。"
  10: "施[ほどこ]しは死[し]から救[すく]い出[だ]し、暗[やみ]のうちに入[はい]ることを許[ゆる]さないからである。"
  11: "施[ほどこ]しは、いと高[たか]い神[かみ]の前[まえ]でそれを行[おこな]うすべての者[もの]にとって、良[よ]い贈[おく]り物[もの]である。"
  12: "子[こ]よ、自分[じぶん]に気[き]をつけて、すべての淫[いん]らな行[おこな]いを避[さ]けなさい。妻[つま]はまず、あなたの父[ちち]たちの種[たね]から娶[めと]りなさい。あなたの父の部族[ぶぞく]の者[もの]ではない他[た]の女[おんな]を妻にしてはならない。わたしたちは預言者[よげんしゃ]たちの子らだからである。わたしたちの父たち、ノア、アブラハム、イサク、ヤコブは昔[むかし]からそうであった。子よ、覚[おぼ]えていなさい。この者たちはみな、自分たちの兄弟[きょうだい]たちのうちから妻を娶り、その子どもたちによって祝福[しゅくふく]され、その種は地[ち]を受[う]け継[つ]ぐのである。"
  13: "そして今[いま]、子[こ]よ、あなたの兄弟[きょうだい]たちを愛[あい]しなさい。あなたの兄弟たち、またあなたの民[たみ]の息子[むすこ]たちと娘[むすめ]たちから妻[つま]を娶[めと]ることに当[あ]たって、心[こころ]を高[たか]ぶらせてはならない。高ぶりには滅[ほろ]びと多[おお]くの混乱[こんらん]があり、卑[いや]しさには減[へ]りと大[おお]きな乏[とぼ]しさがあるからである。卑しさは飢[うえ]の母[はは]だからである。"
  14: "あなたのもとで働[はたら]くすべての人[ひと]の賃金[ちんぎん]が、あなたのもとで夜[よ]を越[こ]してはならない。すぐにその人に払[はら]いなさい。あなたが神[かみ]に仕[つか]えるなら、あなたにも報[むく]いられる。子[こ]よ、あなたのすべての業[わざ]に気[き]をつけ、あなたのすべての歩[あゆ]みにおいてよく教[おし]えられた者[もの]でありなさい。"
  15: "あなたが憎[にく]むことを、だれにもしてはならない。ぶどう酒[しゅ]を酔[よ]うほどに飲[の]んではならない。酔いがあなたとともにあなたの道[みち]を歩[あゆ]んではならない。"
  16: "あなたのパンから飢[うえ]えた者[もの]に与[あた]え、あなたの衣[ころも]から裸[はだか]の者に与えなさい。あなたに余[あま]るものはすべて、施[ほどこ]しをしなさい。施しをするとき、あなたの目[め]が惜[お]しんではならない。"
  17: "あなたのパンを正[ただ]しい者[もの]たちの墓[はか]のそばで費[つか]やし、罪人[つみびと]には与[あた]えてはならない。"
  18: "すべて賢[かしこ]い人[ひと]から助言[じょげん]を求[もと]め、すべて役[やく]に立[た]つ助言を侮[あなど]ってはならない。"
  19: "いかなる時[とき]にも、主[しゅ]である神[かみ]をほめたたえ、神に、あなたの道[みち]がまっすぐになり、すべての小道[こみち]と計[はか]らいが順調[じゅんちょう]に進[すす]むようにと求[もと]めなさい。というのは、すべての民[たみ]には計らいがなく、主ご自身[じしん]がすべていいものを与[あた]え、ご自分[じぶん]が望[のぞ]む者[もの]を、望むとおりに低[ひく]くされるからである。そして今[いま]、子[こ]よ、わたしの戒[いまし]めを覚[おぼ]えていなさい。それがあなたの心[こころ]から消[き]え去[さ]ってはならない。"
  20: "そして今[いま]、わたしはあなたに、あの十タラントの銀[ぎん]のことを示[しめ]そう。わたしがメディアのラゲスでガブリの子[こ]ガバエルに預[あず]けたものである。"
  21: "子[こ]よ、わたしたちが貧[まず]しくなったことを恐[おそ]れてはならない。あなたが神[かみ]を恐れ、すべての罪[つみ]から離[はな]れ、神の前[まえ]に喜[よろこ]ばれることを行[おこな]うなら、あなたにはたくさんのものがある。」"

notes:
  1: "ἐν τῇ ἡμέρᾳ ἐκείνῃ — в тот день. ἐμνήσθη — вспомнил (μιμνήσκομαι). παρέθετο — отдал на сохранение (παρατίθημι), слав. «вдаде». Ῥάγοι τῆς Μηδίας — Раги Мидийские, ラゲス. С 3:7 повествование идёт в третьем лице; 4:1–2 — слова рассказчика."
  2: "εἶπεν ἐν ἑαυτῷ — сказал в себе, про себя. ᾐτησάμην θάνατον — я просил смерти (αἰτέω). ἵνα αὐτῷ ὑποδείξω — чтобы ему объявить (ὑποδείκνυμι); слав. «да ему объявлю». πρὶν ἀποθανεῖν με — прежде чем мне умереть. Внутренняя речь Товита — в 「…」."
  3: "Παιδίον — чадо, 子よ: обращение к взрослому сыну, не «ребёнок». θάψον με — погреби меня (θάπτω). μὴ ὑπερίδῃς — не презри (ὑπεροράω); слав. «да не презираеши». τίμα — чти (τιμάω). τὸ ἀρεστόν — угодное. С этого стиха до 4:21 — одна речь Товита."
  4: "μνήσθητι — помни. πολλοὺς κινδύνους ἑόρακεν ἐπὶ σοὶ ἐν τῇ κοιλίᾳ — много опасностей видела из-за тебя во чреве (ἐπὶ σοί — «ради тебя»); слав. «многа бедствия виде о тебе во чреве». ἐν ἑνὶ τάφῳ — в одном гробе."
  5: "μνημόνευε — помни, держи в памяти (μνημονεύω). μὴ θελήσῃς ἁμαρτάνειν καὶ παραβῆναι — не пожелай грешить и преступить (παραβαίνω). δικαιοσύνην ποίει — твори правду. ταῖς ὁδοῖς τῆς ἀδικίας — путями неправды."
  6: "ποιοῦντός σου τὴν ἀλήθειαν — когда ты творишь истину (ἀλήθεια). εὐοδίαι ἔσονται — будут успехи (εὐοδία); слав. «благопоспешества». Слав. добавляет «и всем творящым правду» — в LXX этого нет; по паритету внесено в основной текст без 〔…〕."
  7: "πᾶσι τοῖς ποιοῦσι τὴν δικαιοσύνην — всем, творящим правду; слав. эту фразу опускает, здесь она взята по LXX. ἐκ τῶν ὑπαρχόντων σοι — из того, что у тебя есть. μὴ φθονεσάτω σου ὁ ὀφθαλμός — да не позавидует око твоё, т. е. не жалей (φθονέω). οὐ μὴ ἀποστραφῇ — усиленное отрицание: никогда не отвратится."
  8: "ὡς σοὶ ὑπάρχει — по достатку, как у тебя есть. κατὰ τὸ πλῆθος — по множеству. κατὰ τὸ ὀλίγον — по малому. μὴ φοβοῦ ποιεῖν — не бойся делать."
  9: "θέμα ἀγαθόν — добрый залог, вклад (θέμα); слав. «залог добр». θησαυρίζεις σεαυτῷ — собираешь себе сокровище (θησαυρίζω). εἰς ἡμέραν ἀνάγκης — на день нужды."
  10: "ῥύεται — избавляет (ῥύομαι). οὐκ ἐᾷ εἰσελθεῖν — не позволяет войти (ἐάω). εἰς τὸ σκότος — во тьму, 暗."
  11: "δῶρον ἀγαθόν — добрый дар (δῶρον). ἐνώπιον τοῦ ὑψίστου — пред Всевышним (ὕψιστος), いと高い神. Греч. γάρ связывает с предыдущим стихом."
  12: "πρόσεχε σεαυτῷ — внимай себе (προσέχω). πορνεία — блуд. ἀπὸ τοῦ σπέρματος τῶν πατέρων σου — от семени отцов твоих. ἀλλοτρία — чужая. υἱοὶ προφητῶν ἐσμεν — мы сыны пророков. ἀπὸ τοῦ αἰῶνος — от века, издревле. ἐκ τῶν ἀδελφῶν αὐτῶν — из братьев своих, т. е. из своего рода."
  13: "ἀγάπα τοὺς ἀδελφούς σου — люби братьев твоих. μὴ ὑπερηφανεύου τῇ καρδίᾳ σου … λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα — не превозносись сердцем … [чтобы] взять себе из них жену: конструкция сжатая, смысл — не гнушайся браком внутри рода; слав. «не возносися сердцем твоим паче братий твоих… пояти тебе от них жену». ἀχρειότης — низость, ничтожество (слав. «непотребство»); ἐλάττωσις — умаление; ἔνδεια — нужда; λιμός — голод."
  14: "μισθός — плата. μὴ αὐλισθήτω — да не переночует (αὐλίζομαι). ἀπόδος παραυτίκα — отдай тотчас. ἐὰν δουλεύσῃς τῷ θεῷ — если послужишь Богу. ἴσθι πεπαιδευμένος — будь научен, воспитан (παιδεύω); слав. «буди наказан». ἀναστροφή — поведение, житие."
  15: "ὃ μισεῖς, μηδενὶ ποιήσῃς — чего ненавидишь, никому не делай: отрицательная форма золотого правила. οἶνον εἰς μέθην — вино до опьянения (μέθη). μὴ πορευθήτω μετὰ σοῦ μέθη — да не ходит с тобою опьянение."
  16: "ἐκ τοῦ ἄρτου σου — от хлеба твоего. ἱμάτια — одежды (ἱμάτιον). γυμνοί — нагие. ὃ ἐὰν περισσεύσῃ σοι — что бы у тебя ни было в избытке (περισσεύω). Формула ст. 7 повторена."
  17: "ἔκχεον — изливай (ἐκχέω); слав. «иждивай» (расходуй) — в тексте 費やす, LXX буквально 注ぎ出す. ἐπὶ τὸν τάφον τῶν δικαίων — при гробе праведных: обычай поминальной трапезы. μὴ δῷς τοῖς ἁμαρτωλοῖς — не давай грешникам."
  18: "συμβουλίαν παρὰ παντὸς φρονίμου ζήτησον — совета у всякого разумного ищи (φρόνιμος). μὴ καταφρονήσῃς ἐπὶ πάσης συμβουλίας χρησίμης — не пренебреги всяким полезным советом (καταφρονέω, χρήσιμος); слав. «да не небрежеши»."
  19: "εὐλόγει — благословляй (εὐλογέω). αἴτησον ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται — проси, чтобы пути твои стали прямыми (εὐθύς). τρίβοι — стези; βουλαί — советы, начинания. εὐοδωθῶσιν — были благоуспешны. πᾶν ἔθνος οὐκ ἔχει βουλήν — всякий народ не имеет совета, т. е. не властен в успехе. ὃν ἐὰν θέλῃ, ταπεινοῖ — кого хочет, смиряет (ταπεινόω). ἐξαλειφθήτωσαν — да не изгладятся (ἐξαλείφω)."
  20: "ὑποδεικνύω σοι — показываю тебе (ὑποδείκνυμι). δέκα τάλαντα τοῦ ἀργυρίου — десять талантов серебра (τάλαντον). παρεθέμην — отдал на сохранение (παρατίθημι). Γαβαήλῳ τῷ τοῦ Γαβρια — Гаваилу, [сыну] Гаврии (род. Γαβρια); слав. «гаваилу сыну гавриину»."
  21: "ἐπτωχεύσαμεν — мы обнищали (πτωχεύω). ὑπάρχει σοι πολλά — у тебя есть многое. ἐὰν φοβηθῇς τὸν θεόν — если убоишься Бога. ἀποστῇς ἀπὸ πάσης ἁμαρτίας — отступишь от всякого греха. τὸ ἀρεστὸν ἐνώπιον αὐτοῦ — угодное пред Ним. Конец речи Товита, начатой в 4:3."
