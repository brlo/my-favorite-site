# jp-box, Товит, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc в книге нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: серебро у Гаваила (1–2, третье лицо), затем завещание Товита сыну (3–21) —
# одна длинная прямая речь Товита, 「…」 с 4:3 до конца главы. Красного и синего нет.
# Нумерация по gr: 21 стих; номера csl совпадают с gr.
# Слав. в ст. 6 добавляет «и всем творящым правду» (нет в LXX) — внесено в основной
# текст; в ст. 7 слав. опускает «всем, творящим правду» — взято по LXX.
# 〔…〕 нет: все стихи есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 施し, タラント, 淫ら, 預ける уже в корпусе.
# Имена — транслитерация греческого (LXX).

