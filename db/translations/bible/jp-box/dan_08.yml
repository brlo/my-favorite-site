verses:
  1: "バルタザルが王[おう]として治[おさ]めて第三年[だいさんねん]、わたしダニエルに幻[まぼろし]が現[あらわ]れた。それは、前[まえ]にわたしが見[み]た幻[まぼろし]の後[あと]のことであった。"
  2: "わたしは夢[ゆめ]の幻[まぼろし]の中[なか]で見[み]た。わたしはエラム地方[ちほう]のスサの都[みやこ]にいて、ウライ川[がわ]のほとりにいた。"
  3: "目[め]を上[あ]げて見[み]ると、一頭[いっとう]の大[おお]きな雄羊[おひつじ]が川[かわ]のほとりに立[た]っていた。それには二本[にほん]の角[つの]があり、一方[いっぽう]は他方[たほう]より高[たか]く、高[たか]い方[ほう]は後[あと]から伸[の]びてきた。"
  4: "わたしは、その雄羊[おひつじ]が西[にし]にも北[きた]にも南[みなみ]にも東[ひがし]にも角[つの]を突[つ]き出[だ]しているのを見[み]た。どの獣[けもの]もそれに立[た]ち向[む]かえず、その手[て]から救[すく]い出[だ]す者[もの]もなかった。それは思[おも]うままに行[おこな]い、大[おお]きくなった。"
  5: "わたしが思[おも]い巡[めぐ]らしていると、見[み]よ、一頭[いっとう]の雄山羊[おやぎ]が西[にし]から全[ぜん]地[ち]の面[おもて]を渡[わた]って来[き]た。それは地[ち]に触[ふ]れなかった。その山羊[やぎ]には、両眼[りょうがん]の間[あいだ]に一[ひと]本[ぽん]の目立[めだ]つ角[つの]があった。"
  6: "それは、あの角[つの]を持[も]つ雄羊[おひつじ]、すなわちわたしが川[かわ]のほとりに立[た]っているのを見[み]た雄羊[おひつじ]のところへ来[き]て、自分[じぶん]の強[つよ]さの力[ちから]をもってそれに駆[か]け寄[よ]った。"
  7: "わたしは、それが雄羊[おひつじ]に近[ちか]づくのを見[み]た。山羊[やぎ]はこれに激[はげ]しく怒[いか]り、これを打[う]って二本[にほん]の角[つの]を砕[くだ]いた。雄羊[おひつじ]には、山羊[やぎ]に立[た]ち向[む]かう力[ちから]がもはやなかった。山羊[やぎ]は雄羊[おひつじ]を地[ち]に投[な]げ倒[たお]して踏[ふ]みつけ、これを救[すく]い出[だ]す者[もの]はなかった。"
  8: "雄山羊[おやぎ]は極[きわ]めて大[おお]きくなった。しかし、それが強[つよ]くなったとき、その大[おお]きな角[つの]は砕[くだ]けた。そして、その後[あと]に四本[よんほん]の角[つの]が、天[てん]の四方[しほう]の風[かぜ]に向[む]かって生[は]え出[で]た。"
  9: "その一[ひと]つから、一[ひと]本[ぽん]の強[つよ]い角[つの]が生[は]え出[で]て、南[みなみ]と東[ひがし]と北[きた]に向[む]かって非常[ひじょう]に大[おお]きくなった。"
  10: "それは天[てん]の軍勢[ぐんぜい]にまで高[たか]くなり、その軍勢[ぐんぜい]と星[ほし]のうちのいくつかを地[ち]に落[お]とし、それらを踏[ふ]みつけた。"
  11: "軍[ぐん]の長[ちょう]が捕囚[ほりゅう]の者[もの]たちを救[すく]い出[だ]すまで、それは続[つづ]いた。彼のゆえに、昔[むかし]からの山[やま]々[やま]も投[な]げ落[お]とされ、その場所[ばしょ]は取[と]り去[さ]られた。また、犠牲[ぎせい]も。彼はそれを地[ち]の面[おもて]に投[な]げ捨[す]て、栄[さか]えて事[こと]が成[な]り、聖所[せいしょ]は荒[あ]らされる。"
  12: "そして、罪[つみ]が犠牲[ぎせい]の上[うえ]に置[お]かれ、正[ただ]しさは地[ち]に投[げ]げ捨[す]てられた。彼は行[おこな]い、栄[さか]えた。"
  13: "わたしは、もう一人[ひとり]の聖[せい]なる者[もの]が語[かた]るのを聞[き]いた。その者[もの]は、語[かた]っているもう一人[ひとり]に言[い]った。「この幻[まぼろし]はいつまで続[つづ]くのか。取[と]り去[さ]られた犠牲[ぎせい]と、荒[あ]らす罪[つみ]が与[あた]えられ、聖所[せいしょ]と軍勢[ぐんぜい]が踏[ふ]みにじられるのは、いつまでなのか。」"
  14: "彼はその者[もの]に言[い]った。「夕[ゆう]と朝[あさ]が二千三百[にせんさんびゃく]ある。そして、聖所[せいしょ]は清[きよ]められる。」"
  15: "わたしダニエルは、その幻[まぼろし]を見[み]て、その意味[いみ]を知[し]ろうと求[もと]めていた。見[み]よ、人間[にんげん]の姿[すがた]のようなものが、わたしの前[まえ]に立[た]った。"
  16: "わたしは、ウライ川[がわ]の中[なか]から人間[にんげん]の声[こえ]がして、呼[よ]びかけて言[い]うのを聞[き]いた。「ガブリエル、あの者[もの]にこの幻[まぼろし]を悟[さと]らせよ。」すると、その人[ひと]は声[こえ]を上[あ]げて言[い]った。「あの定[さだ]めの時[とき]に、この幻[まぼろし]はかかわる。」"
  17: "彼はわたしの立[た]っているところのそばに来[き]て立[た]った。彼が来[き]たとき、わたしは恐[おそ]れて顔[かお]を地[ち]につけて伏[ふ]した。彼はわたしに言[い]った。「人[ひと]の子[こ]よ、この幻[まぼろし]が終[お]わりの時[とき]に関[かか]わることを悟[さと]れ。」"
  18: "彼がわたしと語[かた]っているとき、わたしは地[ち]に顔[かお]を伏[ふ]せたまま眠[ねむ]ってしまった。彼はわたしに触[ふ]れて、わたしをその場[ば]に立[た]たせ、言[い]った。"
  19: "「見[み]よ、わたしは、怒[いか]りの終[お]わりに、あなたの民[たみ]の子[こ]らに起[お]こることを、あなたに告[つ]げる。それは、まだ定[さだ]めの時[とき]の終[お]わりまで続[つづ]く。"
  20: "あなたが見[み]た、あの角[つの]を持[も]つ雄羊[おひつじ]は、メディア人[じん]とペルシア人[じん]の王[おう]である。"
  21: "雄山羊[おやぎ]はギリシアの王[おう]である。その両眼[りょうがん]の間[あいだ]にある大[おお]きな角[つの]は、最初[さいしょ]の王[おう]である。"
  22: "その角[つの]が砕[くだ]けて後[あと]に生[は]えた四本[よんほん]の角[つの]は、その民[たみ]から起[お]こる四人[よにん]の王[おう]である。しかし、その力[ちから]によるのではない。"
  23: "彼らの王国[おうこく]の終[お]わりに、その罪[つみ]が満[み]ちるとき、厚顔[こうがん]な王[おう]が起[お]こる。彼は謎[なぞ]を悟[さと]る。"
  24: "その力[ちから]は強[つよ]くなるが、自分[じぶん]の力[ちから]によるのではない。彼は驚[おどろ]くべき仕方[しかた]で滅[ほろ]ぼし、栄[さか]えて事[こと]を成[な]し遂[と]げ、強[つよ]い者[もの]たちと聖[せい]なる民[たみ]を滅[ほろ]ぼす。"
  25: "彼の思[おも]いは聖[せい]なる者[もの]たちに向[む]かい、欺[あざむ]きは彼の手[て]のうちで栄[さか]える。彼は心[こころ]に高[たか]ぶり、その欺[あざむ]きによって多[おお]くの者[もの]を滅[ほろ]ぼす。彼は多[おお]くの者[もの]の滅[ほろ]びのために立[た]ち、手[て]で卵[たまご]を砕[くだ]くように砕[くだ]く。"
  26: "夕[ゆう]べと朝[あさ]についてのこの幻[まぼろし]は真実[しんじつ]である。あなたはこの幻[まぼろし]を封[ふう]じておけ。それはまだ多[おお]くの日[ひ]々[び]の後[あと]のことだから。」"
  27: "わたしダニエルは、長[なが]い日[ひ]々[び]病[や]んで弱[よわ]っていた。しかし、起[お]き上[あ]がって王[おう]の務[つと]めを再[ふたた]び行[おこな]った。わたしはこの幻[まぼろし]に驚[おどろ]き、これを悟[さと]る者[もの]はなかった。"

notes:
  1: "Ἔτους τρίτου βασιλεύοντος Βαλτασαρ — «в третий год царствования Валтасара»; ὅρασις, ἣν εἶδον ἐγὼ Δανιηλ — «видение, которое я, Даниил, увидел»; μετὰ τὸ ἰδεῖν με τὴν πρώτην — «после того, как увидел я первое» (πρώτην — первое видение), 前[まえ]にわたしが見[み]た幻[まぼろし]."
  2: "ἐν τῷ ὁράματι τοῦ ἐνυπνίου μου — «в видении сна моего» (ἐνύπνιον — сон), 夢[ゆめ]の幻[まぼろし]; ἐμοῦ ὄντος ἐν Σούσοις τῇ πόλει — «когда я был в Сузах, городе»; ἥτις ἐστὶν ἐν Ἐλυμαΐδι χώρᾳ — «который в области Еламской», エラム地方[ちほう]; ἔτι ὄντος μου πρὸς τῇ πύλῃ Αιλαμ — «когда я был у ворот Аилам» (πύλη — ворота): в LXX-модуле здесь «ворота», слав. «на увале» — у реки; слав. «увал» = Ουλαι 8:16, держим слав. ウライ川[がわ], расхождение отмечено."
  3: "ἀναβλέψας — «подняв глаза»; κριὸν ἕνα μέγαν — «овна одного великого», 雄羊[おひつじ]; ἑστῶτα ἀπέναντι τῆς πύλης — «стоящего напротив ворот» (слав. «пред увалом», см. 8:2); εἶχε κέρατα — «имел рога»; τὸ ἓν ὑψηλότερον τοῦ ἑτέρου — «один выше другого»; τὸ ὑψηλότερον ἀνέβαινε — «высший поднимался (рос) после», 後[あと]から伸[の]びてきた."
  4: "κερατίζοντα πρὸς ἀνατολὰς καὶ πρὸς βορρᾶν καὶ πρὸς δυσμὰς καὶ μεσημβρίαν — «бодающего к востоку, северу, западу и югу»; слав. порядок иной: запад, север, юг, восток — держим слав.; οὐκ ἦν ὁ ῥυόμενος — «не было избавляющего» (ῥύομαι — избавлять); ἐποίει ὡς ἤθελε — «делал, как хотел»; ὑψώθη — «возвысился»."
  5: "τράγος αἰγῶν — «козёл коз» (τράγος — козёл), 雄山羊[おやぎ]; ἤρχετο ἀπὸ δυσμῶν — «шёл от запада»; ἐπὶ προσώπου τῆς γῆς — «по лицу земли»; οὐχ ἥπτετο τῆς γῆς — «не касался земли»; κέρας ἓν ἀνὰ μέσον τῶν ὀφθαλμῶν — «один рог между глазами»; слав. «рог видимь» — 目立[めだ]つ, внесено."
  6: "ἦλθεν ἐπὶ τὸν κριὸν τὸν τὰ κέρατα ἔχοντα — «пришёл к овну, имеющему рога»; ἔδραμε πρὸς αὐτὸν ἐν θυμῷ ὀργῆς — «побежал к нему в ярости гнева»; слав. «в силе крепости своея» — 自分[じぶん]の強[つよ]さの力[ちから], иное чтение, держим слав., вариант LXX отмечен."
  7: "ἐθυμώθη ἐπ' αὐτόν — «разъярился на него» (θυμόομαι); ἐπάταξε — «поразил»; συνέτριψε τὰ δύο κέρατα — «сокрушил оба рога»; οὐκέτι ἦν ἰσχὺς ἐν τῷ κριῷ — «уже не было силы в овне»; ἐσπάραξεν αὐτὸν ἐπὶ τὴν γῆν — «поверг его на землю» (σπαράσσω — терзать, бросать); συνέτριψεν — «сокрушил, растоптал»."
  8: "κατίσχυσε σφόδρα — «весьма усилился» (κατισχύω); συνετρίβη τὸ κέρας τὸ μέγα — «сокрушился рог великий»; ἀνέβη ἕτερα τέσσαρα κέρατα κατόπισθεν αὐτοῦ — «поднялись четыре других рога позади (после) него» (κατόπισθεν — сзади, после); слав. «под ним» — その後[あと]; εἰς τοὺς τέσσαρας ἀνέμους τοῦ οὐρανοῦ — «к четырём ветрам неба», 天[てん]の四方[しほう]の風[かぜ]."
  9: "ἐξ ἑνὸς αὐτῶν ἀνεφύη κέρας ἰσχυρὸν ἕν — «из одного из них возрос один рог крепкий»; ἐπάταξεν ἐπὶ μεσημβρίαν καὶ ἐπ' ἀνατολὰς καὶ ἐπὶ βορρᾶν — «устремился на юг, восток и север»; слав. «и к силе» — тёмное место, вероятно порча вместо «к северу»; в ru «прекрасная страна» — чтение МТ, в текст не внесено; берём LXX (север), отмечено."
  10: "ὑψώθη ἕως τῶν ἀστέρων τοῦ οὐρανοῦ — «возвысился до звёзд небесных»; ἐρράχθη ἐπὶ τὴν γῆν ἀπὸ τῶν ἀστέρων — «поверг на землю от звёзд» (ῥάσσω — бросать); слав. «даже до силы небесныя … от силы небесныя и от звезд» — 天[てん]の軍勢[ぐんぜい], внесено (сила = воинство); κατεπατήθη — «были попраны»."
  11: "ἕως ὁ ἀρχιστράτηγος ῥύσεται τὴν αἰχμαλωσίαν — «доколе архистратиг (военачальник) не избавит пленение», 軍[ぐん]の長[ちょう]; δι' αὐτὸν τὰ ὄρη τὰ ἀπ' αἰῶνος ἐρράχθη — «через него горы от века повержены»; ἐξήρθη ὁ τόπος αὐτῶν καὶ θυσία — «отнято место их и жертва»; ἔθηκεν αὐτὴν ἕως χαμαὶ ἐπὶ τὴν γῆν — «поверг её до земли»; слав. «жертва смятеся … святое опустеет». Место тёмное в обоих текстах; переведено по LXX с учётом слав., дословность не сглажена."
  12: "ἐγενήθησαν ἐπὶ τῇ θυσίᾳ αἱ ἁμαρτίαι — «были при жертве грехи»; слав. «дадеся на жертву грех» — 罪[つみ]が犠牲[ぎせい]の上[うえ]に置[お]かれ, внесено; ἐρρίφη χαμαὶ ἡ δικαιοσύνη — «повержена на землю правда»; ἐποίησε καὶ εὐωδώθη — «действовал и преуспел» (εὐοδόω — давать успех)."
  13: "ἤκουον ἑτέρου ἁγίου λαλοῦντος — «слышал другого святого говорящего»; τῷ φελμουνι τῷ λαλοῦντι — тёмное слово φελμουνι (возможно, «говорящему» или имя); слав. «другому некоему глаголющему» — もう一人[ひとり]の者[もの]; Ἕως τίνος — «доколе»; ἡ θυσία ἡ ἀρθεῖσα — «жертва отъятая»; ἡ ἁμαρτία ἐρημώσεως — «грех опустошения», 荒[あ]らす罪[つみ]; εἰς καταπάτημα — «на попрание»."
  14: "Ἕως ἑσπέρας καὶ πρωΐ — «до вечера и утра», 夕[ゆう]と朝[あさ]; ἡμέραι δισχίλιαι τριακόσιαι — «дней две тысячи триста»; слав. «дний две тысящы и триста»; καὶ καθαρισθήσεται τὸ ἅγιον — «и очистится святое» (καθαρίζω), 聖所[せいしょ]は清[きよ]められる. Число оставлено при «вечерах и утрах», без пересчёта в годы."
  15: "ἐν τῷ θεωρεῖν με … τὸ ὅραμα ἐζήτουν διανοηθῆναι — «когда я смотрел, искал уразуметь видение» (διανοέομαι — понимать); ἔστη κατεναντίον μου ὡς ὅρασις ἀνθρώπου — «стал напротив меня как видение (образ) человека»; слав. «аки образ мужеск» — 人間[にんげん]の姿[すがた]のようなもの."
  16: "φωνὴν ἀνθρώπου ἀνὰ μέσον τοῦ Ουλαι — «голос человека среди Улая» (река Улай), ウライ川[がわ]の中[なか]から; Γαβριηλ, συνέτισον ἐκεῖνον τὴν ὅρασιν — «Гавриил, уразуми того видение» (συνετίζω — вразумлять); ἀναβοήσας εἶπεν ὁ ἄνθρωπος — «возопив, сказал человек»; Ἐπὶ τὸ πρόσταγμα ἐκεῖνο ἡ ὅρασις — тёмное: «на повеление (срок) то — видение», передано あの定[さだ]めの時[とき]に; этой клаузы в слав. нет, внесена по LXX."
  17: "ἐχόμενός μου τῆς στάσεως — «приблизившись к месту, где я стоял» (στάσις — стояние); ἐθορυβήθην — «смутился, устрашился» (θορυβέω); ἔπεσα ἐπὶ πρόσωπόν μου — «пал на лицо моё»; Διανοήθητι, υἱὲ ἀνθρώπου — «уразумей, сын человеческий», 人[ひと]の子[こ]よ; εἰς ὥραν καιροῦ — «на час времени», т. е. к концу времён; слав. «до скончания времене», отсюда 終[お]わりの時[とき]."
  18: "ἐκοιμήθην ἐπὶ πρόσωπον χαμαί — «я уснул лицом на земле» (κοιμάομαι — спать, засыпать); ἁψάμενός μου ἤγειρέ με ἐπὶ τοῦ τόπου — «коснувшись меня, поднял меня на месте моём» (ἅπτω — касаться), その場[ば]に立[た]たせ; слав. «постави мя на ноги моя»."
  19: "ἀπαγγέλλω σοι ἃ ἔσται ἐπ' ἐσχάτου τῆς ὀργῆς — «возвещаю тебе, что будет при конце гнева» (ἐπ' ἐσχάτου — в конце); τοῖς υἱοῖς τοῦ λαοῦ σου — «сынам народа твоего» (в слав. в скобках); εἰς ὥρας καιροῦ συντελείας μενεῖ — «пребудет до сроков времени завершения» (συντέλεια — завершение)."
  20: "κριὸς … βασιλεὺς Μήδων καὶ Περσῶν — «овен — царь Мидян и Персов» (ед. ч. «царь» на два народа), メディア人[じん]とペルシア人[じん]の王[おう]; слав. «царь мидский и персский»."
  21: "τράγος … βασιλεὺς τῶν Ἑλλήνων — «козёл — царь Еллинов» (Ἕλληνες — греки), ギリシアの王[おう]; τὸ κέρας τὸ μέγα τὸ ἀνὰ μέσον τῶν ὀφθαλμῶν — «рог великий между глазами»; αὐτὸς ὁ βασιλεὺς ὁ πρῶτος — «он — царь первый»."
  22: "τὰ συντριβέντα καὶ ἀναβάντα ὀπίσω αὐτοῦ τέσσαρα κέρατα — «сокрушённые и поднявшиеся после него четыре рога»; τέσσαρες βασιλεῖς τοῦ ἔθνους αὐτοῦ — «четыре царя народа его»; οὐ κατὰ τὴν ἰσχὺν αὐτοῦ — «не по силе его»; слав. «но не в крепости его»."
  23: "ἐπ' ἐσχάτου τῆς βασιλείας αὐτῶν — «при конце царства их»; πληρουμένων τῶν ἁμαρτιῶν αὐτῶν — «когда исполнятся грехи их»; βασιλεὺς ἀναιδὴς προσώπῳ — «царь бесстыдный лицом» (ἀναιδής — бесстыжий), 厚顔[こうがん]な; διανοούμενος αἰνίγματα — «разумеющий загадки» (αἴνιγμα — загадка, 謎[なぞ])."
  24: "στερεωθήσεται ἡ ἰσχὺς αὐτοῦ — «утвердится сила его» (στερεόω); οὐκ ἐν τῇ ἰσχύι αὐτοῦ — «не в силе его», т. е. не своей силой; θαυμαστῶς φθερεῖ — «дивно погубит» (θαυμαστῶς — удивительно); εὐοδωθήσεται — «будет успешен»; δυνάστας καὶ δῆμον ἁγίων — «владык и народ святых» (δυνάστης — властитель), 強[つよ]い者[もの]たちと聖[せい]なる民[たみ]."
  25: "ἐπὶ τοὺς ἁγίους τὸ διανόημα αὐτοῦ — «против святых помышление его»; εὐοδωθήσεται τὸ ψεῦδος ἐν ταῖς χερσὶν αὐτοῦ — «успешна будет ложь в руках его»; δόλῳ ἀφανιεῖ πολλούς — «коварством истребит многих» (δόλος — коварство, 欺[あざむ]き; ἀφανίζω — истреблять); ἐπὶ ἀπωλείας ἀνδρῶν στήσεται — «встанет на погибель мужей»; ποιήσει συναγωγὴν χειρὸς καὶ ἀποδώσεται — тёмное: «сделает собрание руки и воздаст»; слав. «и яко яица рукою сокрушит» — 卵[たまご]を砕[くだ]くように, держим слав. Начало стиха в слав. («и ярем вериг своих исправит») тёмное и в текст не внесено."
  26: "τὸ ὅραμα τὸ ἑσπέρας καὶ πρωΐ — «видение вечера и утра», 夕[ゆう]べと朝[あさ]についての幻[まぼろし]; ηὑρέθη ἐπ' ἀληθείας — «найдено в истине», т. е. истинно (слав. «реченнаго истинно есть»); πεφραγμένον τὸ ὅραμα — «запечатано (ограждено) видение» (φράσσω — заграждать), 封[ふう]じておけ; εἰς ἡμέρας πολλάς — «на дни многие», 多[おお]くの日[ひ]々[び]の後[あと]."
  27: "ἀσθενήσας ἡμέρας πολλὰς — «изнемогши (проболев) дни многие» (ἀσθενέω — быть слабым, болеть); ἀναστὰς ἐπραγματευόμην πάλιν βασιλικά — «встав, занимался опять царскими делами» (πραγματεύομαι — заниматься), 王[おう]の務[つと]め; ἐξελυόμην ἐπὶ τῷ ὁράματι — «изнемогал от видения» (ἐκλύομαι — ослабевать), 驚[おどろ]き; οὐδεὶς ἦν ὁ διανοούμενος — «никого не было понимающего», これを悟[さと]る者[もの]はなかった."
