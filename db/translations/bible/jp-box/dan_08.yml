# jp-box, Даниил, глава 8. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 8 (совпадает, 27 стихов).
# Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
# Имена — транслитерация греческого (LXX), формы — по корпусу (ダニエル, バルタザル,
# ガブリエル, メディア人[じん], ペルシア人[じん]).
#
# Содержание: 1–2 третье год Валтасара, Даниил в Сузах Еламских, у реки Улай;
# 3–4 овен двурогий, бодающий на все стороны; 5–7 козёл с запад, с одним рогом
# между глазами, сокрушает овна; 8–9 большой рог сломан, четыре рога, из одного
# выходит крепкий рог, растущий на юг, восток и север; 10–12 он растёт до воинства
# небесного, попирает звёзды, отнимает жертву, святое опустошается; 13–14 вопрос
# «доколе» и ответ о двух тысячах трёхстах вечерах и утрах; 15–19 Гавриил
# объясняет видение; 20–22 овен — Мидия и Персия, козёл — Греция, четыре рога —
# четыре царя; 23–25 царь наглый, коварный, хулящий; 26–27 повеление запечатать
# видение и немощь Даниила.
# Голоса: 1–12 и 15 — рассказ Даниила; 13–14 — речь святых в 「…」; 16 — голос
# из среды Улая и ответ мужа в 「…」 (две отдельные реплики); 17 — слово Гавриила
# в 「…」 (закрывается в стихе); 18 — рассказ; 19–26 — слово Гавриила в 「…」;
# 27 — рассказ.
# Термины: 雄羊[おひつじ] — κριός; 雄山羊[おやぎ] — τράγος αἰγῶν; 角[つの] — κέρας;
# 聖所[せいしょ] — τὸ ἅγιον; 犠牲[ぎせい] — θυσία; 軍[ぐん]の長[ちょう] — ἀρχιστράτηγος;
# 天[てん]の軍勢[ぐんぜい] — ἡ δύναμις (сила) небесная; 夕[ゆう]と朝[あさ] — ἑσπέρα καὶ πρωΐ.
# «Улай»: в LXX-модуле 8:2, 3, 6 стоит πύλη (ворота), в 8:16 — Ουλαι (река); держим
# слав. «увал», т. е. река Улай, — отмечено в notes к 8:2, 8:3, 8:6.
#
