verses:
  1: "ネブカドネツァル王[おう]は、その治世[ちせい]の十八年[じゅうはちねん]、インドからエチオピアに至[いた]るまで、多[おお]くの町[まち]と地方[ちほう]、地[ち]に住[す]むすべての者[もの]を治[おさ]めていた。彼は金[きん]の像[ぞう]を造[つく]り、その高[たか]さを六十[ろくじゅう]キュビト、幅[はば]を六[ろく]キュビトとした。そしてこれを、バビロニアの地方[ちほう]にあるドラの平野[へいや]に立[た]てた。"
  2: "そこでネブカドネツァル王[おう]は、王[おう]の王[おう]、全[ぜん]世[せ]界[かい]の支配者[しはいしゃ]として、すべての民[たみ]、部族[ぶぞく]、言語[げんご]の者[もの]たち、ならびに太守[たいしゅ]、将軍[しょうぐん]、地方[ちほう]の長[かしら]、総督[そうとく]、財務[ざいむ]の官[かん]、権力[けんりょく]ある者[もの]たち、および地方[ちほう]のすべての支配者[しはいしゃ]を集[あつ]めるために使者[ししゃ]を遣[つか]わした。自分[じぶん]が立[た]てた金[きん]の像[ぞう]の奉献式[ほうけんしき]に彼らが来[く]るためであった。"
  3: "そこで、あらかじめ名[な]を記[しる]された者[もの]たち、すなわち太守[たいしゅ]、将軍[しょうぐん]、地方[ちほう]の長[かしら]、総督[そうとく]、財務[ざいむ]の官[かん]、権力[けんりょく]ある者[もの]たち、大[だい]いなる役人[やくにん]たち、地方[ちほう]のすべての支配者[しはいしゃ]が集[あつ]まり、ネブカドネツァル王[おう]が立[た]てた像[ぞう]の奉献式[ほうけんしき]のために、その像[ぞう]の前[まえ]に立[た]った。"
  4: "そこで、使者[ししゃ]が力[ちから]をこめて叫[さけ]んだ。「諸[しょ]民[みん]、部族[ぶぞく]、言語[げんご]の者[もの]たちよ、あなたがたに命[めい]じる。"
  5: "ラッパ、笛[ふえ]、竪琴[たてごと]、サンビュケ、プサルテリオン、シンフォニア、およびあらゆる種類[しゅるい]の楽器[がっき]の音[ね]を聞[き]いたなら、ひれ伏[ふ]して、ネブカドネツァル王[おう]が立[た]てた金[きん]の像[ぞう]を拝[おが]め。"
  6: "ひれ伏[ふ]して拝[おが]まない者[もの]は、ただちに火[ひ]の燃[も]える炉[ろ]に投[な]げ込[こ]まれる。」"
  7: "そこで、すべての民[たみ]、部族[ぶぞく]、言語[げんご]の者[もの]たちが、ラッパとあらゆる楽器[がっき]の音[ね]を聞[き]くと、彼らはみな、ネブカドネツァル王[おう]が立[た]てた金[きん]の像[ぞう]の前[まえ]にひれ伏[ふ]して拝[おが]んだ。"
  8: "そのとき、カルデア人[じん]たちが進[すす]み出[で]て、ユダヤ人[じん]たちを告[つ]げ口[ぐち]した。"
  9: "彼らは答[こた]えて、ネブカドネツァル王[おう]に言[い]った。「王[おう]よ、生[い]き永[なが]らえ。"
  10: "あなたは、王[おう]よ、すべての人[ひと]が、ラッパ、笛[ふえ]、竪琴[たてごと]、サンビュケ、プサルテリオン、シンフォニア、およびあらゆる種類[しゅるい]の楽器[がっき]の音[ね]を聞[き]いたなら、ひれ伏[ふ]して金[きん]の像[ぞう]を拝[おが]むようにと命[めい]じ、定[さだ]められた。"
  11: "また、ひれ伏[ふ]して拝[おが]まない者[もの]は、火[ひ]の燃[も]える炉[ろ]に投[な]げ込[こ]まれるとも。"
  12: "ところが、あなたがバビロニアの地方[ちほう]の事[こと]柄[がら]を治[おさ]めさせたユダヤ人[じん]の男[おとこ]たち、すなわちシャデラク、メシャク、アベド・ネゴがいる。あの者[もの]たちは、王[おう]よ、あなたの命令[めいれい]を恐[おそ]れず、あなたの神々[かみがみ]に仕[つか]えず、あなたが立[た]てた金[きん]の像[ぞう]にもひれ伏[ふ]して拝[おが]まない。」"
  13: "そこでネブカドネツァルは激[はげ]しく怒[いか]り、シャデラク、メシャク、アベド・ネゴを連[つ]れて来[く]るように命[めい]じた。そして、あの者[もの]たちは王[おう]の前[まえ]に連[つ]れて来[こ]られた。"
  14: "ネブカドネツァル王[おう]は彼らを見[み]て言[い]った。「シャデラク、メシャク、アベド・ネゴよ、まことに、あなたがたはわたしの神々[かみがみ]に仕[つか]えず、わたしが立[た]てた金[きん]の像[ぞう]にひれ伏[ふ]して拝[おが]まないのか。"
  15: "今[いま]、もし用意[ようい]があるなら、ラッパ、笛[ふえ]、竪琴[たてごと]、サンビュケ、プサルテリオン、シンフォニア、およびあらゆる種類[しゅるい]の楽器[がっき]の音[ね]を聞[き]いたとき、ひれ伏[ふ]して、わたしが造[つく]った金[きん]の像[ぞう]を拝[おが]め。もし拝[おが]まないなら、ただちに火[ひ]の燃[も]える炉[ろ]に投[な]げ込[こ]まれることを知[し]るがよい。わたしの手[て]からあなたがたを救[すく]い出[だ]す神[かみ]が、ほかにいるというのか。」"
  16: "シャデラク、メシャク、アベド・ネゴは答[こた]えて、ネブカドネツァル王[おう]に言[い]った。「このことについて、わたしたちがあなたに答[こた]える必要[ひつよう]はない。"
  17: "わたしたちの仕[つか]える神[かみ]は天[てん]におられ、火[ひ]の炉[ろ]からも、王[おう]よ、あなたの手[て]からも、わたしたちを救[すく]い出[だ]すことができる。"
  18: "たとえそうでなくても、王[おう]よ、あなたに知[し]っていただきたい。わたしたちはあなたの神々[かみがみ]に仕[つか]えず、あなたが立[た]てた金[きん]の像[ぞう]にもひれ伏[ふ]して拝[おが]みない。」"
  19: "そこでネブカドネツァルは怒[いか]りに満[み]ち、シャデラク、メシャク、アベド・ネゴに対[たい]する顔[かお]の様子[ようす]が変[か]わった。彼は、炉[ろ]がすっかり焼[や]けるまで、本来[ほんらい]の七倍[しちばい]にも熱[あつ]くするように命[めい]じた。"
  20: "また、軍隊[ぐんたい]のうちで最も強[つよ]い男[おとこ]たちに命[めい]じて、シャデラク、メシャク、アベド・ネゴを縛[しば]り、火[ひ]の燃[も]える炉[ろ]に投[な]げ込[こ]ませた。"
  21: "そこで、あの者[もの]たちは、履物[はきもの]、ズボン、頭[あたま]を覆[おお]うもの、その他[ほか]の衣服[いふく]を着[き]たまま縛[しば]られ、炉[ろ]の中[なか]に投[な]げ込[こ]まれた。"
  22: "王[おう]の命令[めいれい]は厳[きび]しく、炉[ろ]はいつもより七倍[しちばい]も熱[あつ]くされていたので、彼らを縛[しば]って連[つ]れて来[き]た者[もの]たちは、そのまま炉[ろ]に投[な]げ込[こ]んだ。"
  23: "すると、炉[ろ]から出[で]た炎[ほのお]が、アザルヤとその仲間[なかま]たちを縛[しば]った者[もの]たちを焼[や]き、彼らは死[し]んだ。しかし、三人[さんにん]は縛[しば]られたまま炉[ろ]の中[なか]に倒[たお]れ、守[まも]られていた。"
  24: "そこでハナニヤ、アザルヤ、ミシャエルは、王[おう]が三人[さんにん]を炉[ろ]に投[な]げ込[こ]めと命[めい]じたとき、主[しゅ]に祈[いの]り、ほめ歌[うた]った。彼らは炎[ほのお]の中[なか]を歩[あゆ]みながら、神[かみ]をほめ歌い、主[しゅ]をほめたたえていた。"
  25: "カルデア人[じん]が炉[ろ]を激[はげ]しく燃[も]やしていたとき、アザルヤは立[た]って、炎[ほのお]の中[なか]で口[くち]を開[ひら]き、仲間[なかま]たちとともに主[しゅ]にこう祈[いの]った。"
  26: "「わたしたちの父[ちち]たちの神[かみ]である主[しゅ]よ、あなたはほむべきかな。あなたの御名[みな]はほめたたえられ、とこしえに崇[あが]められる。"
  27: "あなたは、わたしたちに対してなさったすべてのことにおいて正[ただ]しく、あなたのわざはすべて真実[しんじつ]であり、あなたの道[みち]はまっすぐで、あなたの裁[さば]きはすべて真実[しんじつ]である。"
  28: "あなたは、わたしたちと、わたしたちの父[ちち]たちの聖[せい]なる都[みやこ]エルサレムに臨[のぞ]ませたすべてのことにおいて、真理[しんり]の裁[さば]きを行[おこな]われた。あなたは、わたしたちの罪[つみ]のゆえに、これらすべてを真実[しんじつ]と裁[さば]きをもって行[おこな]われたからである。"
  29: "わたしたちはすべてのことにおいて罪[つみ]を犯[おか]し、不法[ふほう]を行[おこな]ってあなたから離[はな]れ、すべてのことにおいて罪[つみ]を重[かさ]ねた。わたしたちはあなたの律法[りっぽう]の戒[いまし]めに聞[き]き従[したが]わなかった。"
  30: "わたしたちはそれを守[まも]らず、あなたがわたしたちに命[めい]じられたとおりに行[おこな]わなかった。それは、わたしたちが幸[しあわ]せになるためであった。"
  31: "あなたがわたしたちに下[くだ]されたすべてのこと、わたしたちにされたすべてのことは、真[しん]の裁[さば]きをもってなされた。"
  32: "あなたはわたしたちを、不法[ふほう]な敵[てき]、もっとも忌[い]むべき背[そむ]いた者[もの]たちの手[て]に、また全地[ぜんち]にまさって不[ふ]正[せい]で悪[わる]い王[おう]の手[て]に渡[わた]された。"
  33: "今[いま]、わたしたちには口[くち]を開[ひら]くことができない。わたしたちは、あなたの僕[しもべ]たち、あなたを敬[うやま]う者[もの]たちにとって、恥[はじ]とそしりとなった。"
  34: "どうか、あなたの名[な]のゆえに、わたしたちを最後[さいご]まで渡[わた]さないでください。あなたの契約[けいやく]を破[やぶ]らないでください。"
  35: "あなたに愛[あい]されたアブラハムのゆえに、あなたの僕[しもべ]イサクのゆえに、あなたの聖[せい]なるイスラエルのゆえに、わたしたちからあなたのあわれみを取[と]り去[さ]らないでください。"
  36: "あなたは彼らに語[かた]って、彼らの子孫[しそん]を天[てん]の星[ほし]のように、海[うみ]の岸[きし]の砂[すな]のように増[ふ]やすと言[い]われた。"
  37: "主[しゅ]よ、わたしたちはすべての民[たみ]にまさって小[ちい]さくされ、今日[こんにち]、全[ぜん]地[ち]にあって卑[いや]しくされている。わたしたちの罪[つみ]のゆえに。"
  38: "今[いま]、わたしたちには君[きみ]も預言者[よげんしゃ]も指導者[しどうしゃ]もなく、全焼[ぜんしょう]の供[そな]えも、犠牲[ぎせい]も、ささげ物[もの]も、香[こう]もなく、あなたの前[まえ]に実[み]をささげてあわれみを得[え]る場所[ばしょ]もない。"
  39: "しかし、砕[くだ]かれた魂[たましい]とへりくだった霊[れい]をもって、わたしたちが受[う]け入[い]れられますように。雄羊[おひつじ]や雄牛[おうし]の全焼[ぜんしょう]の供[そな]えによって、幾万[いくまん]の肥[こ]えた子羊[こひつじ]によって受[う]け入[い]れられるように。"
  40: "そのように、今日[こんにち]、わたしたちの犠牲[ぎせい]があなたの前[まえ]にありますように。あなたの後[うし]ろにあって、贖[あがな]いとなりますように。あなたに望[のぞ]みを置[お]く者[もの]には恥[はじ]がないからである。あなたの後[うし]ろにあって、全[まった]うされますように。"
  41: "今[いま]、わたしたちは心[こころ]を尽[つ]くしてあなたに従[したが]い、あなたを恐[おそ]れ、あなたの御顔[みかお]を求[もと]めている。わたしたちを恥[はずか]しめないでください。"
  42: "わたしたちに対して、あなたの寛[かん]容[よう]にしたがって、あなたのあわれみの多[おお]さにしたがって計[はか]らってください。"
  43: "あなたの不思議[ふしぎ]なわざにしたがって、わたしたちを救[すく]い出[だ]し、主[しゅ]よ、あなたの名[な]に栄光[えいこう]をお与[あた]えください。"
  44: "あなたの僕[しもべ]たちに悪[わる]をなす者[もの]はすべて辱[はずかし]められ、あらゆる力[ちから]から恥[はじ]を受[う]け、その力[ちから]が砕[くだ]かれますように。"
  45: "彼らが、あなただけが主[しゅ]なる神[かみ]、全[ぜん]世[せ]界[かい]にわたって栄光[えいこう]ある方[かた]であることを知[し]りますように。」"
  46: "王[おう]の僕[しもべ]たちで、彼らを投[な]げ入[い]れた者[もの]たちは、炉[ろ]をナフタ、麻[あさ]くず、樹脂[じゅし]、柴[しば]で燃[も]やし続[つづ]けてやめなかった。三人[さんにん]を一度[いちど]に炉[ろ]に投[な]げ入[い]れたとき、炉[ろ]は七倍[しちばい]も焼[や]けただれていた。彼らを投[な]げ入[い]れる者[もの]たちは彼らの上[うえ]に立[た]ち、ほかの者[もの]たちは下[した]から彼らを焼[や]いていた。"
  47: "炎[ほのお]は炉[ろ]の上[うえ]に四十九[よんじゅうきゅう]キュビトも広[ひろ]がった。"
  48: "それは炉[ろ]の周[まわ]りにいたカルデア人[じん]たちのところまで進[すす]み、彼らを焼[や]き尽[つ]くした。"
  49: "しかし、主[しゅ]の御使[みつか]いが、アザルヤとその仲間[なかま]たちとともに炉[ろ]の中[なか]へ下[くだ]り、炉[ろ]から炎[ほのお]を追[お]い払[はら]った。"
  50: "そして、炉[ろ]の中[なか]を、露[つゆ]を吹[ふ]き渡[わた]らせる風[かぜ]のようなものにした。火[ひ]は彼らにまったく触[ふ]れず、苦[くる]しめず、悩[なや]まさなかった。"
  51: "そこで三人[さんにん]は、ひとつの口[くち]から語[かた]るかのように、炉[ろ]の中[なか]で神[かみ]をほめ歌[うた]い、栄光[えいこう]を帰[き]し、ほめたたえ、高[たか]くあがめて、言[い]った。"
  52: "「わたしたちの父[ちち]たちの神[かみ]である主[しゅ]よ、あなたはほむべきかな。あなたはとこしえにほめたたえられ、すべてにまさって高[たか]くあがめられる。あなたの栄光[えいこう]の御名[みな]は聖[せい]であり、ほむべきかな。それはとこしえに、すべてにまさってほめたたえられ、高[たか]くあがめられる。"
  53: "あなたは、あなたの聖[せい]なる栄光[えいこう]の神殿[しんでん]においてほむべきかな。あなたはとこしえに、すべてにまさってほめ歌われ、栄光[えいこう]のうちに高[たか]くあがめられる。"
  54: "あなたは、あなたの王国[おうこく]の御座[みくら]においてほむべきかな。あなたはとこしえにほめ歌われ、すべてにまさって高[たか]くあがめられる。"
  55: "あなたは、深[ふか]い淵[ふち]を見[み]渡[わた]し、ケルビムの上[うえ]に座[すわ]る方[かた]としてほむべきかな。あなたはとこしえにほめたたえられ、栄光[えいこう]を受[う]けられる。"
  56: "あなたは、天[てん]の大空[おおぞら]においてほむべきかな。あなたはとこしえにほめ歌われ、栄光[えいこう]を受[う]けられる。"
  57: "主[しゅ]のすべてのわざよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  58: "主[しゅ]の天使[てんし]たちよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  59: "天[てん]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  60: "天[てん]の上[うえ]のすべての水[みず]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  61: "主[しゅ]のすべての力[ちから]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  62: "太陽[たいよう]と月[つき]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  63: "天[てん]の星[ほし]たちよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  64: "すべての雨[あめ]と露[つゆ]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  65: "すべての霊[れい]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  66: "火[ひ]と熱[ねつ]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  67: "寒[さむ]さと冷[ひ]えよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  68: "露[つゆ]と降[ふ]る雪[ゆき]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  69: "霜[しも]と寒[さむ]さよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  70: "霜[しも]と雪[ゆき]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  71: "夜[よる]と昼[ひる]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  72: "光[ひかり]と闇[やみ]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  73: "稲妻[いなずま]と雲[くも]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  74: "地[ち]が主[しゅ]をほめたたえるように。主をほめ歌い、とこしえに主をあがめるように。"
  75: "山[やま]と丘[おか]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  76: "地[ち]に生[は]えるすべてのものよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  77: "泉[いずみ]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  78: "海[うみ]と川[かわ]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  79: "鯨[くじら]と、水[みず]の中[なか]を動[うご]くすべてのものよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  80: "天[てん]のすべての鳥[とり]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  81: "地[ち]の四足[しそく]のものと獣[けもの]たちよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  82: "人[ひと]の子[こ]らよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  83: "イスラエルよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  84: "主[しゅ]の祭司[さいし]たちよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  85: "主[しゅ]の僕[しもべ]たちよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  86: "正[ただ]しい者[もの]の霊[れい]と魂[たましい]よ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  87: "敬虔[けいけん]な者[もの]たち、心[こころ]のへりくだった者[もの]たちよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。"
  88: "ハナニヤ、アザルヤ、ミシャエルよ、主[しゅ]をほめたたえよ。主をほめ歌い、とこしえに主をあがめよ。主はわたしたちをよみから取[と]り出[だ]し、死[し]の手[て]から救[すく]われた。燃[も]え盛[さか]る炎[ほのお]の中[なか]からわたしたちを救[すく]い出[だ]し、火[ほのお]の中[なか]からわたしたちを贖[あがな]い出[だ]されたからである。"
  89: "主[しゅ]に感謝[かんしゃ]せよ。主は善[よ]い方[かた]、そのあわれみはとこしえにある。"
  90: "主[しゅ]を恐[おそ]れるすべての者[もの]たちよ、神々[かみがみ]の神[かみ]である主[しゅ]をほめたたえよ。主をほめ歌い、感謝[かんしゃ]せよ。そのあわれみはとこしえにあり、世[よ]々[よ]限[かぎ]りなく続[つづ]く。」"
  91: "ネブカドネツァル王[おう]は、彼らがほめ歌[うた]うのを聞[き]き、立[た]って彼らが生[い]きているのを見[み]ていた。そこで王[おう]は驚[おどろ]き、急[いそ]いで立[た]ち上[あ]がって、友人[ゆうじん]たちに言[い]った。「わたしたちが火[ひ]の中[なか]に縛[しば]って投[な]げ込[こ]んだのは、三人[さんにん]の男[おとこ]ではなかったか。」彼らは王[おう]に答[こた]えて言[い]った。「まことに、王[おう]よ。」"
  92: "王[おう]は言[い]った。「見[み]よ、わたしは四人[よにん]の男[おとこ]が、縛[しば]りを解[と]かれて火[ひ]の中[なか]を歩[あゆ]んでいるのを見[み]る。彼らには何[なん]の損[そん]傷[しょう]もない。第四[だいし]の者[もの]の姿[すがた]は、神[かみ]の子[こ]のようである。」"
  93: "そこでネブカドネツァルは、火[ひ]の燃[も]える炉[ろ]の口[くち]に近[ちか]づき、彼らを名[な]で呼[よ]んで言[い]った。「シャデラク、メシャク、アベド・ネゴ、いと高[たか]き神[かみ]の僕[しもべ]たちよ、出[で]て来[き]なさい。」そこで、あの者[もの]たちは火[ひ]の中[なか]から出[で]て来[き]た。"
  94: "太守[たいしゅ]、地方[ちほう]の長[かしら]、族長[ぞくちょう]たち、および王[おう]の友人[ゆうじん]たちが集[あつ]まり、あの者[もの]たちを見[み]た。火[ひ]は彼らの体[からだ]に何[なん]の力[ちから]も及[およ]ぼさず、頭[あたま]の髪[かみ]の毛[け]も焦[こ]げず、衣服[いふく]も変[か]わらず、火[ひ]のにおいさえ彼らになかった。"
  95: "そのとき、王[おう]は彼らの前[まえ]で神[かみ]にひれ伏[ふ]し、ネブカドネツァル王[おう]は答[こた]えて言[い]った。「シャデラク、メシャク、アベド・ネゴの神[かみ]はほむべきかな。この方[かた]は御使[みつか]いを遣[つか]わして、ご自分[じぶん]に望[のぞ]みを置[お]いた僕[しもべ]たちを救[すく]われた。彼らは王[おう]の命令[めいれい]を退[しりぞ]け、自分[じぶん]の体[からだ]を火[ひ]に渡[わた]し、ほかの神[かみ]に仕[つか]えず拝[おが]まないために、そうしたのである。ただ自分[じぶん]たちの神[かみ]に仕[つか]えたのである。"
  96: "わたしは命令[めいれい]を下[くだ]す。すべての民[たみ]、部族[ぶぞく]、言語[げんご]の者[もの]のうち、シャデラク、メシャク、アベド・ネゴの神[かみ]を冒瀆[ぼうとく]する者[もの]は滅[ほろ]ぼされ、その家[いえ]は略奪[りゃくだつ]にさらされる。このように救[すく]い出[だ]すことのできる神[かみ]は、ほかにないからである。」"
  97: "こうして王[おう]は、シャデラク、メシャク、アベド・ネゴにバビロニアの全土[ぜんど]にわたる権限[けんげん]を与[あた]え、彼らを支配者[しはいしゃ]とした。王[おう]は彼らを大[おお]きくし、彼の王国[おうこく]にいるすべてのユダヤ人[じん]の長[ちょう]とした。"
  98: "ネブカドネツァル王[おう]は、地[ち]のすべての民[たみ]、部族[ぶぞく]、言語[げんご]の者[もの]たちに告[つ]げる。あなたがたに平安[へいわ]が増[ま]し加[くわ]えられるように。"
  99: "いと高[たか]き神[かみ]がわたしに対してなさったしるしと不思議[ふしぎ]を、あなたがたに告[つ]げ知[し]らせることは、わたしの意[い]にかなった。あなたがたにも、あなたがたの知者[ちしゃ]たちにも、神[かみ]がおられることを示[しめ]すためである。"
  100: "そのしるしはなんと大[おお]きく、力強[ちからづよ]いことか。その国[くに]は永遠[えいえん]の国[くに]、その支配[しはい]は代[よ]々[よ]に及[およ]ぶ。"

notes:
  1: "Ἔτους ὀκτωκαιδεκάτου — «в восемнадцатый год»; διοικῶν πόλεις καὶ χώρας καὶ πάντας τοὺς κατοικοῦντας ἐπὶ τῆς γῆς ἀπὸ Ινδικῆς ἕως Αἰθιοπίας — «управляя городами и странами и всеми живущими на земле от Индии до Эфиопии»: в csl этой части нет, внесена; ἐποίησεν εἰκόνα χρυσῆν — «сделал образ золотой» (金の像); τὸ ὕψος αὐτῆς πηχῶν ἑξήκοντα καὶ τὸ πλάτος πηχῶν ἕξ — «высота её локтей шестьдесят и ширина шесть локтей»; ἐν πεδίῳ τοῦ περιβόλου χώρας Βαβυλωνίας — «на поле ограды (περίβολος) страны Вавилонской»; csl называет место «поле Деире» — отсюда ドラ, у ru «поле Деире» (евр. Дура)."
  2: "βασιλεὺς βασιλέων καὶ κυριεύων τῆς οἰκουμένης ὅλης — «царь царей и владыка всей вселенной»: в csl нет, внесено; ἀπέστειλεν ἐπισυναγαγεῖν — «послал собрать»; σατράπας, στρατηγούς, τοπάρχας καὶ ὑπάτους, διοικητὰς καὶ τοὺς ἐπ᾿ ἐξουσιῶν κατὰ χώραν — «сатрапов, воевод, областеначальников и консулов, управителей и находящихся при власти по стране» (太守、将軍、地方の長、総督、財務の官、権力ある者); ἐγκαινισμός — «обновление, освящение» (奉献式)."
  3: "οἱ προγεγραμμένοι — «прежде написанные (перечисленные выше)»; в LXX стих краток: «и стали пред образом», csl повторяет весь список сановников и добавляет «мучителие велицыи» — список внесён по csl (大いなる役人たち); κατέναντι τῆς εἰκόνος — «пред образом»."
  4: "ὁ κῆρυξ ἐκήρυξε τοῖς ὄχλοις — «глашатай провозгласил толпам» (κῆρυξ, κηρύσσω); csl «проповедник вопияше со крепостию» — «взывал с силой», отсюда 力[ちから]をこめて; Ὑμῖν παραγγέλλεται — «вам повелевается»; ἔθνη καὶ χῶραι, λαοὶ καὶ γλῶσσαι — «народы и страны, люди и языки»; в тексте 諸民、部族、言語 по словоупотреблению главы."
  5: "σάλπιγξ, σῦριγξ, κιθάρα, σαμβύκη, ψαλτήριον, συμφωνία — «труба, свирель, кифара, самбика, псалтирь, симфония» (ラッパ、笛、竪琴、サンビュケ、プサルテリオン、シンフォニア); παντὸς γένους μουσικῶν — «всякого рода музыкантов (инструментов)»; πεσόντες προσκυνήσατε — «пав, поклонитесь»; τῇ εἰκόνι τῇ χρυσῇ — «образу золотому»."
  6: "πᾶς, ὃς ἂν μὴ πεσὼν προσκυνήσῃ — «всякий, кто не пав поклонится»; ἐμβαλοῦσιν αὐτὸν εἰς τὴν κάμινον τοῦ πυρὸς τὴν καιομένην — «бросят его в печь огня горящую»; csl «в той час» — «тотчас», отсюда ただちに."
  7: "ἐν τῷ καιρῷ ἐκείνῳ — «в то время»; πάντα τὰ ἔθνη... φυλαὶ καὶ γλῶσσαι — «все народы... племена и языки»; προσεκύνησαν τῇ εἰκόνι — «поклонились образу»; κατέναντι τούτου — «пред этим (пред ним)», в csl нет, передано 前[まえ]に."
  8: "ἄνδρες Χαλδαῖοι — «мужи Халдейские» (カルデア人[じん]); διέβαλον τοὺς Ιουδαίους — «оклеветали (донесли на) Иудеев» (διαβάλλω — клеветать, доносить); ユダヤ人[じん] — обычная форма корпуса."
  9: "Κύριε βασιλεῦ — «господин царь»; εἰς τὸν αἰῶνα ζῆθι — «в век живи»; csl «царю, во веки живи»; формула «王[おう]よ、生[い]き永[なが]らえ» — как в 1 Цар 10:24."
  10: "σὺ... προσέταξας καὶ ἔκρινας — «ты... повелел и определил» (προστάσσω, κρίνω); πᾶς ἄνθρωπος, ὃς ἂν ἀκούσῃ τῆς φωνῆς... — «всякий человек, который услышит голос...»; πεσὼν προσκυνήσῃ — «пав поклонится»; перечень инструментов — как в 3:5."
  11: "καὶ ὃς ἂν μὴ πεσὼν προσκυνήσῃ — «а кто не пав поклонится»; ἐμβληθήσεται εἰς τὴν κάμινον — «будет брошен в печь» (ἐμβάλλω); csl добавляет «телу златому» — «золотому телу (истукану)»."
  12: "εἰσὶ δέ τινες ἄνδρες Ιουδαῖοι — «есть же некие мужи Иудейские»; οὓς κατέστησας ἐπὶ τῆς χώρας τῆς Βαβυλωνίας — «которых ты поставил над страной Вавилонской» (csl «над делами страны» — 事柄[ことがら]); οὐκ ἐφοβήθησάν σου τὴν ἐντολήν — «не убоялись повеления твоего»; τῷ εἰδώλῳ σου οὐκ ἐλάτρευσαν — «идолам твоим не послужили»; τῇ εἰκόνι... οὐ προσεκύνησαν — «образу... не поклонились»."
  13: "θυμωθεὶς ὀργῇ — «воспылав яростью» (θυμόω, ὀργή); προσέταξεν ἀγαγεῖν — «повелел привести»; τότε οἱ ἄνθρωποι ἤχθησαν — «тогда мужи приведены были» (ἄγω)."
  14: "Διὰ τί — «почему»; csl «аще воистинну» — «если действительно, правда ли, что», по нему и переведено (まことに); τοῖς θεοῖς μου οὐ λατρεύετε — «богам моим не служите»; οὐ προσκυνεῖτε — «не поклоняетесь». У ru (МТ) «с умыслом ли» — иное чтение, в текст не внесено."
  15: "εἰ μὲν ἔχετε ἑτοίμως — «если готовы» (ἑτοίμως); αὐθωρὶ ἐμβληθήσεσθε — «тотчас будете брошены» (αὐθωρί); ποῖος θεὸς ἐξελεῖται ὑμᾶς ἐκ τῶν χειρῶν μου — «какой бог избавит вас из рук моих»."
  16: "οὐ χρείαν ἔχομεν ἡμεῖς... ἀποκριθῆναί σοι — «нет нужды нам отвечать тебе» (χρεία); ἐπὶ τῇ ἐπιταγῇ ταύτῃ — «на это повеление» (ἐπιταγή)."
  17: "ἔστι γὰρ θεὸς ἐν οὐρανοῖς εἷς κύριος ἡμῶν — «есть Бог на небесах, единый Господь наш»; ὃν φοβούμεθα — «которого боимся (чтим)»; δυνατὸς ἐξελέσθαι — «силён избавить»; καὶ ἐκ τῶν χειρῶν σου, βασιλεῦ — «и из рук твоих, царь»."
  18: "καὶ τότε φανερόν σοι ἔσται — «и тогда явно тебе будет»; csl «аще ли ни» — «если же нет», отсюда たとえそうでなくても; οὔτε τῷ εἰδώλῳ σου λατρεύομεν — «ни идолам твоим не служим»; οὔτε τῇ εἰκόνι τῇ χρυσῇ... προσκυνοῦμεν — «ни образу золотому... не поклоняемся»."
  19: "ἐπλήσθη θυμοῦ — «исполнился ярости»; ἡ μορφὴ τοῦ προσώπου αὐτοῦ ἠλλοιώθη — «вид лица его изменился»; csl добавляет «на седраха, мисаха и авденаго» — «на них», внесено (に対する); ἐπέταξε καῆναι τὴν κάμινον ἑπταπλασίως παρ᾿ ὃ ἔδει — «повелел сжечь печь всемеро против того, как надлежало»; csl «дондеже до конца разгорится» — すっかり焼けるまで."
  20: "ἄνδρας ἰσχυροτάτους τῶν ἐν τῇ δυνάμει — «мужей сильнейших из войска»; συμποδίσαντας — «связав по ногам» (συμποδίζω); ἐμβαλεῖν εἰς τὴν κάμινον — «бросить в печь»."
  21: "συνεποδίσθησαν — «были связаны»; ἔχοντες τὰ ὑποδήματα αὐτῶν καὶ τὰς τιάρας αὐτῶν ἐπὶ τῶν κεφαλῶν... σὺν τῷ ἱματισμῷ — «в обуви, с тиарами (головными повязками) на головах и в одеждах»; csl добавляет «с гащами (штанами) и покрывалами» — ズボン、頭を覆うもの; ἐβλήθησαν εἰς τὴν κάμινον — «брошены в печь»."
  22: "τὸ πρόσταγμα τοῦ βασιλέως ἤπειγεν — «повеление царя понуждало (было строгим)»; ἐξεκαύθη ὑπὲρ τὸ πρότερον ἑπταπλασίως — «разожжена была сверх прежнего всемеро»; οἱ ἄνδρες οἱ προχειρισθέντες — «мужи, назначенные (избранные)»; ἐνεβάλοσαν εἰς αὐτήν — «бросили в неё». csl в этом стихе добавляет «уби пламень огненный»; по LXX это содержание 23, там и передано."
  23: "τοὺς ἄνδρας τοὺς συμποδίσαντας τοὺς περὶ τὸν Αζαριαν — «мужей, связавших тех, кто с Азарией»; ἐξελθοῦσα ἡ φλὸξ... ἐνεπύρισε καὶ ἀπέκτεινεν — «вышедшее пламя сожгло и убило»; αὐτοὶ δὲ συνετηρήθησαν — «они же сохранились»; csl добавляет «падоша посреде пещи... оковани» — «пали посреди печи связанными», внесено."
  24: "Οὕτως οὖν προσηύξατο Ανανιας καὶ Αζαριας καὶ Μισαηλ — «так молились Анания, Азария и Мисаил»; ὕμνησαν τῷ κυρίῳ — «воспели Господу»; ὅτε... ὁ βασιλεὺς προσέταξεν ἐμβληθῆναι εἰς τὴν κάμινον — «когда царь повелел бросить их в печь». csl 24 иной: «ходили посреди пламени, поя Бога и благословляя Господа» — внесено."
  25: "στὰς δὲ Αζαριας προσηύξατο — «став, Азария помолился»; ἀνοίξας τὸ στόμα αὐτοῦ ἐξωμολογεῖτο τῷ κυρίῳ — «открыв уста свои, исповедался Господу»; ἅμα τοῖς συνεταίροις αὐτοῦ — «вместе с товарищами»; ὑποκαιομένης τῆς καμίνου ὑπὸ τῶν Χαλδαίων σφόδρα — «при сильно поджигаемой Халдеями печи»; καὶ εἶπαν — «и сказали», вводка к молитве 26–45."
  26: "Εὐλογητὸς εἶ, κύριε ὁ θεὸς τῶν πατέρων ἡμῶν — «благословен Ты, Господи Боже отцов наших»; αἰνετὸν καὶ δεδοξασμένον τὸ ὄνομά σου — «хвально и прославлено имя Твоё»; εἰς τοὺς αἰῶνας — «во веки». Начало молитвы Азарии; в 「…」 до 45."
  27: "δίκαιος εἶ ἐπὶ πᾶσιν, οἷς ἐποίησας ἡμῖν — «праведен Ты во всём, что сделал нам»; πάντα τὰ ἔργα σου ἀληθινά — «все дела Твои истинны»; αἱ ὁδοί σου εὐθεῖαι — «пути Твои прямы»; πᾶσαι αἱ κρίσεις σου ἀληθιναί — «все суды Твои истинны»."
  28: "κρίματα ἀληθείας ἐποίησας — «суды истины сотворил»; κατὰ πάντα, ἃ ἐπήγαγες ἡμῖν — «по всему, что навёл на нас»; ἐπὶ τὴν πόλιν σου τὴν ἁγίαν... Ιερουσαλημ — «на город Твой святой... Иерусалим»; ἐν ἀληθείᾳ καὶ κρίσει — «в истине и суде»; διὰ τὰς ἁμαρτίας ἡμῶν — «за грехи наши»."
  29: "ἡμάρτομεν ἐν πᾶσι — «согрешили во всём»; ἠνομήσαμεν ἀποστῆναι ἀπὸ σοῦ — «беззаконновали, отступив от Тебя»; ἐξημάρτομεν ἐν πᾶσι — «согрешили во всём» (повтор); τῶν ἐντολῶν τοῦ νόμου σου οὐχ ὑπηκούσαμεν — «заповедей закона Твоего не послушали»; csl относит последнее к 30."
  30: "συνετηρήσαμεν — «соблюдали» (συντηρέω); ἐποιήσαμεν καθὼς ἐνετείλω — «сделали, как Ты заповедал»; ἵνα εὖ ἡμῖν γένηται — «чтобы благо нам было»; csl перед этим повторяет «заповедий твоих не послушахом»."
  31: "ἐν ἀληθινῇ κρίσει — «истинным судом»; πάντα, ὅσα... ἐπήγαγες καὶ ἐποίησας — «всё, что навёл и сделал»; csl «И вся, елика сотворил еси нам...»."
  32: "παρέδωκας ἡμᾶς εἰς χεῖρας ἐχθρῶν... ἀνόμων — «предал нас в руки врагов беззаконных»; ἐχθίστων ἀποστατῶν — «ненавистнейших отступников»; βασιλεῖ ἀδίκῳ καὶ πονηροτάτῳ παρὰ πᾶσαν τὴν γῆν — «царю неправедному и злейшему по всей земле»."
  33: "οὐκ ἔστιν ἡμῖν ἀνοῖξαι τὸ στόμα — «нет нам открыть уста»; αἰσχύνη καὶ ὄνειδος ἐγενήθη — «стыд и поношение стали»; τοῖς δούλοις σου καὶ τοῖς σεβομένοις σε — «рабам Твоим и чтущим Тебя»."
  34: "μὴ παραδῷς ἡμᾶς εἰς τέλος — «не предай нас до конца (совсем)»; διὰ τὸ ὄνομά σου — «ради имени Твоего»; μὴ διασκεδάσῃς σου τὴν διαθήκην — «не разрушь (не рассеивай) завет Твой» (διασκεδάννυμι)."
  35: "μὴ ἀποστήσῃς τὸ ἔλεός σου ἀφ᾿ ἡμῶν — «не отставь милости Твоей от нас»; διὰ Αβρααμ τὸν ἠγαπημένον ὑπὸ σοῦ — «ради Авраама, возлюбленного Тобою»; Ισαακ τὸν δοῦλόν σου — «Исаака, раба Твоего»; Ισραηλ τὸν ἅγιόν σου — «Израиля, святого Твоего»."
  36: "ὡς ἐλάλησας πρὸς αὐτοὺς λέγων — «как Ты говорил им, сказав»; πληθῦναι τὸ σπέρμα αὐτῶν — «умножить семя их»; ὡς τὰ ἄστρα τοῦ οὐρανοῦ — «как звёзды неба»; ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης — «как песок у края (берега) моря»."
  37: "δέσποτα — «Владыко»; ἐσμικρύνθημεν παρὰ πάντα τὰ ἔθνη — «умалились более всех народов»; ταπεινοὶ ἐν πάσῃ τῇ γῇ — «смиренные (униженные) по всей земле»; διὰ τὰς ἁμαρτίας ἡμῶν — «за грехи наши»."
  38: "ἄρχων καὶ προφήτης οὐδὲ ἡγούμενος — «ни князя, ни пророка, ни вождя»; ὁλοκαύτωσις, θυσία, προσφορά, θυμίαμα — «всесожжение, жертва, приношение, фимиам»; τόπος τοῦ καρπῶσαι ἐνώπιόν σου — «место, чтобы принести плод (καρπόω) пред Тобою»; csl «еже пожрети» — «чтобы заклать (принести жертву)»."
  39: "ἐν ψυχῇ συντετριμμένῃ καὶ πνεύματι τεταπεινωμένῳ — «душею сокрушенною и духом смиренным»; προσδεχθείημεν — «да будем приняты» (προσδέχομαι); ὡς ἐν ὁλοκαυτώμασι κριῶν καὶ ταύρων — «как при всесожжениях овнов и тельцов»; ἐν μυριάσιν ἀρνῶν πιόνων — «при мириадах тучных агнцев». В csl часть об овнах и тельцах перенесена в 40."
  40: "οὕτω γενέσθω ἡ θυσία ἡμῶν ἐνώπιόν σου σήμερον — «так да будет жертва наша пред Тобою ныне»; ἐξιλάσαι ὄπισθέν σου — «да умилостивит (искупит) позади Тебя» — тёмное место, передано буквально; τελειώσαι ὄπισθέν σου — «да совершит позади Тебя»; οὐκ ἔστιν αἰσχύνη τοῖς πεποιθόσιν ἐπὶ σοί — «нет стыда уповающим на Тебя»."
  41: "ἐξακολουθοῦμεν ἐν ὅλῃ καρδίᾳ — «последуем всем сердцем»; φοβούμεθά σε — «боимся Тебя»; ζητοῦμεν τὸ πρόσωπόν σου — «ищем лица Твоего»; μὴ καταισχύνῃς ἡμᾶς — «не постыди нас»; в csl это конец 41, а 42 начинается с «но»."
  42: "ποίησον μεθ᾿ ἡμῶν — «сотвори с нами»; κατὰ τὴν ἐπιείκειάν σου — «по кротости (снисходительности) Твоей»; κατὰ τὸ πλῆθος τοῦ ἐλέους σου — «по множеству милости Твоей»."
  43: "ἐξελοῦ ἡμᾶς κατὰ τὰ θαυμάσιά σου — «избавь нас по чудесам Твоим»; δὸς δόξαν τῷ ὀνόματί σου — «дай славу имени Твоему»."
  44: "ἐντραπείησαν — «да устыдятся» (ἐντρέπω); οἱ ἐνδεικνύμενοι τοῖς δούλοις σου κακά — «показывающие (делающие) рабам Твоим зло»; καταισχυνθείησαν ἀπὸ πάσης δυναστείας — «да постыдятся от всякой силы (власти)»; ἡ ἰσχὺς αὐτῶν συντριβείη — «сила их да сокрушится»."
  45: "γνώτωσαν — «да познают»; σὺ εἶ μόνος κύριος ὁ θεός — «Ты един Господь Бог»; ἔνδοξος ἐφ᾿ ὅλην τὴν οἰκουμένην — «славен по всей вселенной». Конец молитвы, кавычки закрываются."
  46: "οὐ διέλιπον οἱ ἐμβάλλοντες... καίοντες τὴν κάμινον — «не переставали бросавшие... сжигать печь»; νάφθα, στιππύον, πίσσα, κληματίς — «нефть, пакля, смола, хворост» (ナフタ、麻くず、樹脂、柴); ἡνίκα ἐνεβάλοσαν τοὺς τρεῖς εἰς ἅπαξ — «когда бросили трёх зараз»; διάπυρος... ἑπταπλασίως — «раскалена всемеро»; οἱ μὲν ἐμβάλλοντες ὑπεράνω αὐτῶν, οἱ δὲ ὑπέκαιον ὑποκάτωθεν — «бросавшие были выше их, а другие жгли снизу»."
  47: "διεχεῖτο ἡ φλὸξ ἐπάνω τῆς καμίνου — «разливалось пламя над печью»; ἐπὶ πήχεις τεσσαράκοντα ἐννέα — «на локтей сорок девять» (四十九キュビト)."
  48: "διεξώδευσε — «прошло насквозь» (διεξοδεύω); ἐνεπύρισεν οὓς εὗρε περὶ τὴν κάμινον τῶν Χαλδαίων — «сожгло, кого нашло около печи из Халдеев»."
  49: "ἄγγελος δὲ κυρίου συγκατέβη — «Ангел же Господень сошёл вместе»; ἅμα τοῖς περὶ τὸν Αζαριαν — «с теми, кто с Азарией»; ἐξετίναξε τὴν φλόγα — «стряхнул (изверг) пламя» (ἐκτινάσσω); в csl только «сниде», без второго глагола."
  50: "ἐποίησε τὸ μέσον τῆς καμίνου ὡσεὶ πνεῦμα δρόσου διασυρίζον — «сделал середину печи как дух росы, веющий (шумящий)» (διασυρίζω); οὐχ ἥψατο αὐτῶν καθόλου τὸ πῦρ — «не коснулся их вовсе огонь»; οὐκ ἐλύπησε καὶ οὐ παρηνώχλησεν — «не опечалил и не потревожил»."
  51: "Ἀναλαβόντες — «подняв (приняв)»; ὡς ἐξ ἑνὸς στόματος — «как бы из одних уст»; ὕμνουν καὶ ἐδόξαζον καὶ εὐλόγουν καὶ ἐξύψουν — «воспевали, славили, благословляли и превозносили»; λέγοντες — «говоря», вводка к песни 52–90."
  52: "Εὐλογητὸς εἶ... καὶ αἰνετὸς καὶ ὑπερυψούμενος — «благословен... хвальный и превозносимый»; εὐλογημένον τὸ ὄνομα τῆς δόξης σου τὸ ἅγιον — «благословенно имя славы Твоей, святое»; ὑπεραινετὸν καὶ ὑπερυψωμένον — «прехвальное и превозносимое»; εἰς πάντας τοὺς αἰῶνας — «во все веки»."
  53: "ἐν τῷ ναῷ τῆς ἁγίας δόξης σου — «в храме святой славы Твоей»; ὑπερυμνητός — «препетый (превыше всех воспеваемый)»; ὑπερένδοξος — «преславный»."
  54: "ἐπὶ θρόνου τῆς βασιλείας σου — «на престоле царства Твоего»; ὑμνητὸς καὶ ὑπερυψωμένος — «воспеваемый и превозносимый». В csl-ru этот стих стоит на месте 55, а 55 — на месте 54; держим порядок LXX."
  55: "ὁ βλέπων ἀβύσσους — «видящий бездны»; καθήμενος ἐπὶ χερουβιμ — «сидящий на херувимах»; αἰνετὸς καὶ δεδοξασμένος — «хвальный и прославленный». По csl это стих 54 (там же 深い淵)."
  56: "ἐν τῷ στερεώματι — «в тверди (небесном своде)»; ὑμνητὸς καὶ δεδοξασμένος — «воспеваемый и прославленный»; csl «на тверди небесней»."
  57: "εὐλογεῖτε, πάντα τὰ ἔργα τοῦ κυρίου — «благословите, все дела Господни»; ὑμνεῖτε καὶ ὑπερυψοῦτε — «пойте и превозносите»; εἰς τοὺς αἰῶνας — «во веки». Начало литании; формула одна на 57–90."
  58: "ἄγγελοι κυρίου — «Ангелы Господни» (天使[てんし]); формула та же: εὐλογεῖτε... ὑμνεῖτε καὶ ὑπερυψοῦτε."
  59: "οὐρανοί — «небеса»; формула та же."
  60: "ὕδατα πάντα τὰ ἐπάνω τοῦ οὐρανοῦ — «все воды, что выше неба»; формула та же."
  61: "πᾶσαι αἱ δυνάμεις κυρίου — «все силы Господни»; формула та же."
  62: "ἥλιος καὶ σελήνη — «солнце и луна»; формула та же."
  63: "ἄστρα τοῦ οὐρανοῦ — «звёзды неба»; формула та же."
  64: "πᾶς ὄμβρος καὶ δρόσος — «всякий дождь и роса»; формула та же."
  65: "πάντα τὰ πνεύματα — «все духи (ветры)»; csl «вси дуси», ru «ветры»; формула та же."
  66: "πῦρ καὶ καῦμα — «огонь и жар»; формула та же."
  67: "ῥῖγος καὶ ψῦχος — «холод и стужа»; csl «студь и зной» — «холод и зной» (иное чтение); формула та же."
  68: "δρόσοι καὶ νιφετοί — «росы и снегопады»; csl «росы и иней»; формула та же."
  69: "πάγοι καὶ ψῦχος — «морозы и стужа»; csl «нощи и дние» — «ночи и дни» (в csl порядок 69–72 переставлен); формула та же."
  70: "πάχναι καὶ χιόνες — «иней и снега»; csl «свет и тма» — «свет и тьма» (перестановка); формула та же."
  71: "νύκτες καὶ ἡμέραι — «ночи и дни»; csl «лед и мраз» — «лёд и мороз» (перестановка); формула та же."
  72: "φῶς καὶ σκότος — «свет и тьма»; csl «сланы и снези» — «иней и снега» (перестановка); формула та же."
  73: "ἀστραπαὶ καὶ νεφέλαι — «молнии и облака»; формула та же."
  74: "εὐλογείτω ἡ γῆ τὸν κύριον — «да благословит земля Господа»; здесь 3-е лицо ед. ч. (εὐλογείτω, не εὐλογεῖτε), поэтому 地が…ように, а не обращение; ὑμνείτω καὶ ὑπερυψούτω — «да поёт и превозносит»."
  75: "ὄρη καὶ βουνοί — «горы и холмы»; формула та же."
  76: "πάντα τὰ φυόμενα ἐπὶ τῆς γῆς — «всё произрастающее на земле»; формула та же."
  77: "αἱ πηγαί — «источники»; формула та же."
  78: "θάλασσαι καὶ ποταμοί — «моря и реки»; формула та же."
  79: "κήτη καὶ πάντα τὰ κινούμενα ἐν τοῖς ὕδασι — «киты (морские чудовища) и всё движущееся в водах»; формула та же."
  80: "πάντα τὰ πετεινὰ τοῦ οὐρανοῦ — «все птицы небесные»; формула та же."
  81: "τετράποδα καὶ θηρία τῆς γῆς — «четвероногие и звери земные»; формула та же."
  82: "οἱ υἱοὶ τῶν ἀνθρώπων — «сыны человеческие»; формула та же."
  83: "Ισραηλ — «Израиль»; в LXX εὐλογεῖτε (мн. ч., обращение к народу), в csl «да благословит израиль» (3-е лицо); переведено обращением, как LXX."
  84: "ἱερεῖς — «священники»; csl добавляет «Господни» — 主の祭司; формула та же."
  85: "δοῦλοι — «рабы»; csl «раби Господни» — 主の僕; формула та же."
  86: "πνεύματα καὶ ψυχαὶ δικαίων — «духи и души праведных»; формула та же."
  87: "ὅσιοι καὶ ταπεινοὶ καρδίᾳ — «преподобные и смиренные сердцем»; формула та же."
  88: "Ανανια, Αζαρια, Μισαηλ — «Анания, Азария, Мисаил»; ὅτι ἐξείλετο ἡμᾶς ἐξ ᾅδου — «ибо изъял нас из ада»; ἔσωσεν... ἐκ χειρὸς θανάτου — «спас от руки смерти»; ἐρρύσατο... ἐκ μέσου καιομένης φλογός — «избавил из среды горящего пламени»; ἐκ τοῦ πυρὸς ἐλυτρώσατο — «от огня искупил» (λυτρόω)."
  89: "ἐξομολογεῖσθε τῷ κυρίῳ — «исповедайтесь (благодарите) Господу»; ὅτι χρηστός — «ибо благ»; εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ — «в век милость Его»."
  90: "πάντες οἱ σεβόμενοι τὸν θεὸν τῶν θεῶν — «все чтущие Бога богов»; ὑμνεῖτε καὶ ἐξομολογεῖσθε — «пойте и исповедайтесь»; εἰς τὸν αἰῶνα τῶν αἰώνων — «в век веков» (в csl нет, внесено). Конец песни."
  91: "ἐγένετο ἐν τῷ ἀκοῦσαι τὸν βασιλέα ὑμνούντων αὐτῶν — «было, когда услышал царь поющих их»; ἑστὼς ἐθεώρει αὐτοὺς ζῶντας — «стоя, смотрел на них живых»; ἐθαύμασε... ἀνέστη σπεύσας — «изумился и встал поспешно»; τοῖς φίλοις αὐτοῦ — «друзьям своим». Вопрос царя и ответ вельмож — по csl, в LXX только «сказал друзьям»."
  92: "ἄνδρας τέσσαρας λελυμένους περιπατοῦντας — «четырёх мужей разрешённых (освобождённых), ходящих»; φθορὰ οὐδεμία — «никакого повреждения»; ἡ ὅρασις τοῦ τετάρτου ὁμοίωμα ἀγγέλου θεοῦ — «вид четвёртого — подобие Ангела Божия»; csl «подобен Сыну Божию» — церковное чтение (ср. евр. «как сын богов»), взято в текст без 〔…〕; в LXX-модуле — «подобие Ангела Божия»."
  93: "προσελθὼν... πρὸς τὴν θύραν τῆς καμίνου — «подойдя к дверям (устью) печи»; ἐκάλεσεν αὐτοὺς ἐξ ὀνόματος — «назвал их по имени»; οἱ παῖδες τοῦ θεοῦ τοῦ ὑψίστου — «отроки Бога Вышнего»; ἐξέλθετε ἐκ τοῦ πυρός — «выйдите из огня»; ἐξῆλθον ἐκ μέσου τοῦ πυρός — «вышли из среды огня»."
  94: "συνήχθησαν οἱ ὕπατοι, τοπάρχαι καὶ ἀρχιπατριῶται καὶ οἱ φίλοι τοῦ βασιλέως — «собрались консулы, областеначальники, родоначальники (патриархи) и друзья царя»; οὐχ ἥψατο τὸ πῦρ τοῦ σώματος αὐτῶν — «не коснулся огонь тела их»; αἱ τρίχες οὐ κατεκάησαν — «волосы не сгорели»; τὰ σαράβαρα οὐκ ἠλλοιώθησαν — «одежды не изменились» (σαράβαρα — штаны, одеяние); οὐδὲ ὀσμὴ τοῦ πυρός — «даже запаха огня»."
  95: "ὑπολαβὼν... εἶπεν — «подхватив, сказал»; Εὐλογητὸς κύριος ὁ θεὸς τοῦ Σεδραχ... — «благословен Господь Бог Седраха...»; ἀπέστειλε τὸν ἄγγελον αὐτοῦ — «послал Ангела Своего»; τοὺς ἐλπίσαντας ἐπ᾿ αὐτόν — «надеявшихся на Него»; τὴν προσταγὴν τοῦ βασιλέως ἠθέτησαν — «повеление царя отвергли»; παρέδωκαν τὰ σώματα αὐτῶν εἰς ἐμπυρισμόν — «предали тела свои на сожжение»; csl добавляет «поклонися пред ними царь Богу» — внесено."
  96: "κρίνω ἵνα... — «определяю, чтобы...»; ὃς ἂν βλασφημήσῃ εἰς τὸν κύριον τὸν θεὸν Σεδραχ... — «кто похулит Господа Бога Седраха...»; διαμελισθήσεται — «будет рассечён на части» (LXX), csl «в пагубу будут» — «погибнут», взято в текст; ἡ οἰκία αὐτοῦ δημευθήσεται — «дом его будет конфискован (разграблен)»; οὐκ ἔστιν θεὸς ἕτερος... — «нет иного бога, который мог бы так избавить»."
  97: "ἐξουσίαν δοὺς ἐφ᾿ ὅλης τῆς χώρας — «дав власть над всей страной»; κατέστησεν αὐτοὺς ἄρχοντας — «поставил их начальниками»; csl добавляет «возвеличи их, и сподоби их старейшинства иудеев всех сущих во царстве его» — внесено."
  98: "Слав. 3:98 = gr 4:39 (в гр. модуле указ стоит в конце 4-й главы): Ναβουχοδονοσορ βασιλεὺς πᾶσι τοῖς ἔθνεσι καὶ πάσαις ταῖς χώραις... — «Навуходоносор царь всем народам и всем странам...»; εἰρήνη ὑμῖν πληθυνθείη ἐν παντὶ καιρῷ — «мир вам да умножится во всякое время»; деление на три стиха и «всем людям, племенам и языкам... во всей земле» — по слав. 3:98. gr 4:38 — другое окружное письмо, в слав. его нет, в текст не взято."
  99: "gr 4:39: ὑποδείξω ὑμῖν τὰς πράξεις, ἃς ἐποίησε μετ᾿ ἐμοῦ ὁ θεὸς ὁ μέγας — «покажу вам дела, которые сделал со мною Бог великий»; ἔδοξε δέ μοι ἀποδεῖξαι ὑμῖν καὶ τοῖς σοφισταῖς ὑμῶν ὅτι ἔστι θεός — «угодно мне показать вам и мудрецам вашим, что есть Бог»; слав. 3:99: «Знамения и чудеса, яже сотвори со мною Бог вышний, угодно бысть предо мною возвестити вам» — «знамения и чудеса», «Бог Вышний» и «возвестить» по слав.; «мудрецам вашим» — из LXX."
  100: "gr 4:39: τὰ θαυμάσια αὐτοῦ μεγάλα — «чудеса Его велики»; τὸ βασίλειον αὐτοῦ βασίλειον εἰς τὸν αἰῶνα — «царство Его — царство в век»; ἡ ἐξουσία αὐτοῦ ἀπὸ γενεῶν εἰς γενεάς — «власть Его из рода в род»; слав. 3:100: «коль великая и крепкая: Царство его Царство вечное, и власть его в роды и роды» — «как велики и крепки», «вечное» и «в роды и роды» по слав."
