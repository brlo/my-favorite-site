# jp-box, Даниил, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 3:1–97 = gr 3:1–97 стих в стих; 3:98–100
# (указ Навуходоносора) в гр. модуле стоят в конце 4-й главы как gr 4:38–39,
# деление на три стиха — по слав. 3:98–100. Всего 100 стихов, как в слав.
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — ネブカドネツァル, シャデラク, メシャク,
# アベド・ネゴ; в молитве и песни — ハナニヤ, アザルヤ, ミシャエル.
#
# Содержание: 1–7 золотой истукан и указ; 8–12 донос халдеев; 13–18 отказ отроков;
# 19–23 печь; 24–45 молитва Азарии (24–25 вводка, 26–45 молитва); 46–51 чудесное
# охлаждение печи; 52–90 песнь трёх отроков (52–56 «благословен», 57–90 литания
# «благословите»); 91–97 спасение и указ; 98–100 письмо царя.
# Голоса: 4–6 — указ глашатая в 「…」; 9–12 — речь халдеев в 「…」; 14–15 — речь
# царя в 「…」; 16–18 — ответ отроков в 「…」; 24–25 — вводка вне кавычек, молитва
# 26–45 в 「…» (закрывается в 45); 46–50 повествование; 51 вводка «говоря» вне
# кавычек, песнь 52–90 в 「…» (закрывается в 90); 91–97 повествование, слова царя
# и вельмож — в 「…」; 98–100 — письмо царя, повествование без кавычек.
# Литания 57–90: единая формула «Xよ、主[しゅ]をほめたたえよ。主をほめ歌い、
# とこしえに主をあがめよ。」; 74 — «地[ち]が…ように» (3-е лицо, εὐλογείτω); 88 —
# распространена придаточным «主は…救い出されたからである»; 89 — «主に感謝せよ…»;
# 90 — «主を畏れるすべての者たちよ…».
# csl расходится с gr в порядке 54/55 и 69–72 — держим нумерацию и порядок gr,
# отмечено в notes. 3:98–100 — из gr 4:39 (gr 4:38 — другое письмо, в слав. нет).
#
# Термины: 金[きん]の像[ぞう] — εἰκών; 炉[ろ] — κάμινος; 全焼[ぜんしょう]の供[そな]え —
# ὁλοκαύτωμα; 犠牲[ぎせい] — θυσία; ささげ物[もの] — προσφορά; 香[こう] — θυμίαμα;
# 契約[けいやく] — διαθήκη; 律法[りっぽう] — νόμος; あわれみ — ἔλεος; キュビト — πῆχυς;
# サンビュケ, プサルテリオン, シンフォニア — σαμβύκη, ψαλτήριον, συμφωνία.
#
