# jp-box, Иезекииль, глава 35. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 35 (совпадает).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет. Имена — транслитерация греческого (LXX).
#
# Содержание: Сеир/Едом. 1–4 слово Господа: «вот, Я — на тебя, гора Сеир», рука
# и опустошение городов; 5–9 вечная вражда и кровь: за то, что предавал Израиля
# мечу, кровь погонит тебя, горы и долины полны поражённых, вечное запустение;
# 10–15 притязание на два народа и две земли, «и Господь там есть», хуления
# на горы Израилевы; «пуста будешь, гора Сеир, и вся Идумея».
# Голоса: 1 — формула вне кавычек; 2–15 — одно непрерывное слово Господа в 「…」
# (поручение пророку в 2 — внутри речи, пророчество с 3-го; в 10 и 12 слова
# Едома в 『…』).
# «Точка»: в этой главе нет.
# Имена и термины: セイル (Σηιρ), イドマヤ (Ιδουμαια), エドム, イスラエル; 荒[あ]れ果[は]てる —
# ἐρημόω; 嗣業[しぎょう] — κληρονομία; 冒涜[ぼうとく] — βλασφημία; 敵意[てきい] — ἔχθρα.
#
tr_code: jp-box
book: iez
chapter: 35
draft: true

verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。"
  2: "「人[ひと]の子[こ]よ、顔[かお]をセイルの山[やま]に向[む]け、それに向[む]かって預言[よげん]せよ。"
  3: "そして言[い]え。主[しゅ]である神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに向[む]かう、セイルの山[やま]よ。わたしはあなたの上[うえ]に手[て]を伸[の]べ、あなたを荒[あ]れ果[は]てた所[ところ]とし、あなたは荒[あ]れ果[は]てる。"
  4: "わたしはあなたの町[まち]々[まち]を荒[あ]れ果[は]てさせ、あなたは荒[あ]れ果[は]てる。あなたはわたしが主[しゅ]であることを知[し]る。"
  5: "あなたは永遠[えいえん]の敵[てき]となって、イスラエルの家[いえ]に偽[いつわ]りをもって待[まち]ち伏[ぶ]せし、その苦[くる]しみの時[とき]、不法[ふほう]の時[とき]、終[お]わりの時[とき]に、敵[てき]の手[て]によって彼らを剣[つるぎ]に渡[わた]したからである。"
  6: "それゆえ、わたしは生[い]きている、と主[しゅ]である神[かみ]は言[い]われる。あなたは血[ち]に罪[つみ]を犯[おか]したのだから、血[ち]があなたを追[お]う。あなたは血[ち]を憎[にく]んだのだから、血[ち]があなたを追[お]い出[だ]す。"
  7: "わたしはセイルの山[やま]を荒[あ]れ果[は]てた荒[あ]れ地[ち]とし、そこから人[ひと]と家畜[かちく]を滅[ほろ]ぼす。"
  8: "わたしはあなたの傷[きず]ついた者[もの]で丘[おか]と谷[たに]を満[み]たす。あなたのすべての野[の]で、剣[つるぎ]で傷[きず]つけられた者[もの]たちがあなたの中[なか]に倒[たお]れる。"
  9: "わたしはあなたを永遠[えいえん]の荒[あ]れ地[ち]とし、あなたの町[まち]々[まち]はもはや住[す]まわれない。あなたはわたしが主[しゅ]であることを知[し]る。"
  10: "あなたは言[い]ったからである。『この二[ふた]つの民[たみ]とこの二[ふた]つの国[くに]はわたしのものとなり、わたしはそれを嗣業[しぎょう]として受[う]け継[つ]ぐ』と。そこに主[しゅ]がおられるのに。"
  11: "それゆえ、わたしは生[い]きている、と主[しゅ]である神[かみ]は言[い]われる。わたしはあなたの敵意[てきい]に従[したが]い、彼らへの憎[にく]しみからあなたが抱[い]いた妬[ねた]みに従[したが]って、あなたに行[おこな]う。わたしがあなたを裁[さば]くとき、わたしはあなたに知[し]られる。"
  12: "あなたはわたしが主[しゅ]であることを知[し]る。わたしはあなたのすべての冒涜[ぼうとく]の声[こえ]を聞[き]いた。あなたは言[い]った。『イスラエルの山[やま]々[やま]は荒[あ]れ果[は]て、わたしたちに食[た]べ物[もの]として与[あた]えられた』と。"
  13: "あなたはその口[くち]でわたしに向[む]かって大[おお]いなることを語[かた]り、わたしに向[む]かって言葉[ことば]を増[ふ]やした。わたしはそれを聞[き]いた。"
  14: "主[しゅ]である神[かみ]はこう言[い]われる。全[ぜん]地[ち]が喜[よろこ]ぶとき、わたしはあなたを荒[あ]れ果[は]てた所[ところ]とする。"
  15: "あなたがイスラエルの家[いえ]の嗣業[しぎょう]が滅[ほろ]びたことを喜[よろこ]んだように、わたしもあなたに行[おこな]う。セイルの山[やま]よ、あなたは荒[あ]れ果[は]て、イドマヤはすべて滅[ほろ]びる。彼らは、わたしが彼らの神[かみ]である主[しゅ]であることを知[し]る」。"

notes:
  1: "Καὶ ἐγένετο λόγος κυρίου πρός με λέγων — «и было слово Господне ко мне, говоря»: формула вне кавычек. Слав. «И бысть слово Господне ко мне глаголя»."
  2: "ἐπίστρεψον τὸ πρόσωπόν σου ἐπ' ὄρος Σηιρ — «обрати лице твоё к горе Сеир» (Σηιρ — セイル; гора Сеир = Едом, ср. 35:15); προφήτευσον ἐπ' αὐτό — «прореки на неё». Поручение внутри слова Господа (с 2-го стиха), пророчество — с 3-го."
  3: "Ἰδοὺ ἐγὼ ἐπὶ σέ, ὄρος Σηιρ — «вот, Я — на тебя, гора Сеир» (формула суда, ср. 26:3; 34:10); ἐκτενῶ τὴν χεῖρά μου ἐπὶ σέ — «простру руку Мою на тебя»; δώσω σε ἔρημον — «отдам тебя пустою»; ἐρημωθήσῃ — «опустеешь»."
  4: "ταῖς πόλεσίν σου ἐρημίαν ποιήσω — «городам твоим опустошение сделаю» (ἐρημία); σὺ ἔρημος ἔσῃ — «ты пуста будешь»; γνώσῃ ὅτι ἐγώ εἰμι κύριος — формула знания (2 л. ед. ч.)."
  5: "ἀντὶ τοῦ γενέσθαι σε ἐχθρὰν αἰωνίαν — «за то, что ты стала врагом вечным» (ἐχθρά — враждебная); ἐνεκάθισας τῷ οἴκῳ Ισραηλ δόλῳ — «подстерегала дом Израилев с коварством» (ἐγκαθίζω — сидеть в засаде; δόλος — коварство, 偽[いつわ]り); ἐν χειρὶ ἐχθρῶν μαχαίρᾳ — «в руку врагов мечом»; ἐν καιρῷ ἀδικίας ἐπ' ἐσχάτῳ — «во время неправды, в последнее (время)». Слав. добавляет «во время печали их» — нет в LXX, внесено (苦[くる]しみの時)."
  6: "εἰ μὴν εἰς αἷμα ἥμαρτες — «если не в кровь согрешила» (клятвенное εἰ μήν при ζῶ ἐγώ); αἷμά σε διώξεται — «кровь тебя погонит». Слав. добавляет «кровь возненавидела еси, и кровь ижденет тя» — нет в LXX, внесено; в ru/МТ наоборот («не ненавидела крови»), отмечено."
  7: "δώσω τὸ ὄρος Σηιρ εἰς ἔρημον καὶ ἠρημωμένον — «отдам гору Сеир в пустыню и опустошённою»; ἀπολῶ ἀπ' αὐτοῦ ἀνθρώπους καὶ κτήνη — «погублю от неё людей и скотов». Слав. содержит в скобках «(и приходяща и отходяща:)» — редакционное, не перенесено."
  8: "ἐμπλήσω τῶν τραυματιῶν σου τοὺς βουνοὺς — «наполню поражёнными твоими холмы» (τραυματίας — 傷[きず]ついた者[もの]); τὰς φάραγγάς σου — «ущелья твои» (φάραγξ — 谷[たに]); ἐν πᾶσι τοῖς πεδίοις σου — «на всех полях твоих»; τετραυματισμένοι μαχαίρᾳ πεσοῦνται ἐν σοί — «поражённые мечом падут в тебе»."
  9: "ἐρημίαν αἰώνιον θήσομαί σε — «опустошением вечным сделаю тебя»; αἱ πόλεις σου οὐ μὴ κατοικηθῶσιν ἔτι — «города твои не будут более обитаемы»; γνώσῃ ὅτι ἐγώ εἰμι κύριος — формула знания."
  10: "Τὰ δύο ἔθνη καὶ αἱ δύο χῶραι ἐμαὶ ἔσονται — «эти два народа и эти две земли будут мои»: речь Едома в 『…』 (Израиль и Иуда); κληρονομήσω αὐτάς — «наследую их»; καὶ κύριος ἐκεῖ ἐστιν — «и Господь там есть»: дерзость притязания, передано そこに主[しゅ]がおられるのに."
  11: "ποιήσω σοι κατὰ τὴν ἔχθραν σου — «сделаю тебе по вражде твоей» (ἔχθρα — 敵意[てきい]); γνωσθήσομαί σοι, ἡνίκα ἂν κρίνω σε — «познан буду тобою, когда буду судить тебя». Слав. добавляет «и по ревности твоей, юже сотворила еси от ненавидения к ним» — нет в LXX, внесено; там же слав. ставит «и уразумееши, яко аз есмь Господь», которое в LXX открывает 12-й стих, — держим LXX."
  12: "καὶ γνώσῃ ὅτι ἐγώ εἰμι κύριος — «и узнаешь, что Я Господь» (в слав. это в конце 11-го); ἤκουσα τῆς φωνῆς τῶν βλασφημιῶν σου — «услышал голос хулений твоих» (βλασφημία — 冒涜[ぼうとく]); Τὰ ὄρη Ισραηλ ἔρημα — «горы Израилевы пусты»: речь Едома в 『…』; ἡμῖν δέδοται εἰς κατάβρωμα — «нам даны на снедь»."
  13: "ἐμεγαλορημόνησας ἐπ' ἐμὲ τῷ στόματί σου — «велеречила на Меня устами твоими» (μεγαλορημονέω — говорить великое); ἐγὼ ἤκουσα — «Я услышал». Слав. добавляет «и умножила на мя словеса» — нет в LXX, внесено. В LXX и слав. обращение в ед. ч., в ru — мн. ч. (МТ); держим ед. ч."
  14: "Ἐν τῇ εὐφροσύνῃ πάσης τῆς γῆς — «в радости всей земли» (εὐφροσύνη); ἔρημον ποιήσω σε — «пустою сделаю тебя»: контраст всеобщей радости и опустошения Едома."
  15: "ἔρημον ἔσῃ, ὄρος Σηιρ — «пуста будешь, гора Сеир»; πᾶσα ἡ Ιδουμαία ἐξαναλωθήσεται — «вся Идумея истреблена будет» (ἐξαναλίσκω; Ιδουμαία — イドマヤ); γνώσῃ ὅτι ἐγώ εἰμι κύριος ὁ θεὸς αὐτῶν — «узнаешь, что Я — Господь Бог их». Слав. добавляет начало «якоже порадовалася еси о наследии дому израилева, яко погибе, тако сотворю тебе» — нет в LXX, внесено; слав. читает «уведят» (3 л. мн.) вместо «узнаешь», в тексте по слав. 彼らは…知[し]る."
