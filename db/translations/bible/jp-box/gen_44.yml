verses:
  1: "ヨセフは家[いえ]を預[あず]かる者[もの]に命[めい]じて言[い]った。「この人[ひと]たちの袋[ふくろ]に、運[はこ]べるだけの食物[しょくもつ]を満[み]たし、それぞれの銀[ぎん]をその袋[ふくろ]の口[くち]に入[い]れなさい。"
  2: "そして、わたしの銀[ぎん]の杯[さかずき]と、末[すえ]の者[もの]の穀物[こくもつ]の代金[だいきん]とを、その末[すえ]の者[もの]の袋[ふくろ]に入[い]れなさい。」ヨセフが言[い]ったとおりになった。"
  3: "朝[あさ]が明[あ]けると、この人[ひと]たちはロバとともに送[おく]り出[だ]された。"
  4: "彼[かれ]らが町[まち]を出[で]て、まだ遠[とお]くへ行[い]かないうちに、ヨセフは家[いえ]を預[あず]かる者[もの]に言[い]った。「立[た]って、あの人[ひと]たちの後[あと]を追[お]い、追[お]いついたら言[い]いなさい。『なぜ、あなたがたは悪[わる]をもって善[ぜん]に報[むく]いたのか。"
  5: "なぜ、あなたがたはわたしの銀[ぎん]の杯[さかずき]を盗[ぬす]んだのか。それは、わたしの主人[しゅじん]が飲[の]み、それで占[うらな]いをする杯[さかずき]ではないか。あなたがたは悪[わる]いことをしたものだ。』」"
  6: "彼[かれ]は彼[かれ]らに追[お]いついて、これらの言葉[ことば]を彼[かれ]らに告[つ]げた。"
  7: "彼[かれ]らは彼[かれ]に言[い]った。「ご主人[しゅじん]さまは、なぜこのような言葉[ことば]をおっしゃるのですか。僕[しもべ]どもがそんなことをするはずはありません。"
  8: "見[み]てください。わたしたちが袋[ふくろ]の中[なか]に見[み]つけた銀[ぎん]を、カナンの地[ち]からあなたのところへ返[かえ]して来[き]たではありませんか。どうしてわたしたちが、あなたの主人[しゅじん]の家[いえ]から銀[ぎん]や金[きん]を盗[ぬす]むでしょうか。"
  9: "僕[しもべ]どものうち、だれのところから杯[さかずき]が見[み]つかっても、その者[もの]は死[し]ぬがよい。わたしたちもご主人[しゅじん]さまの奴隷[どれい]になります。」"
  10: "彼[かれ]は言[い]った。「今[いま]、あなたがたが言[い]ったとおりにしよう。だれのところから杯[さかずき]が見[み]つかっても、その者[もの]はわたしの奴隷[どれい]になり、あなたがたは無罪[むざい]となる。」"
  11: "彼[かれ]らは急[いそ]いで、それぞれ袋[ふくろ]を地[ち]に下[お]ろし、それぞれ袋[ふくろ]を開[あ]けた。"
  12: "彼[かれ]は年長[ねんちょう]の者[もの]から始[はじ]めて、末[すえ]の者[もの]に至[いた]るまで調[しら]べ、杯[さかずき]はベニヤミンの袋[ふくろ]の中[なか]から見[み]つかった。"
  13: "彼[かれ]らは衣服[いふく]を裂[さ]き、それぞれ袋[ふくろ]を自分[じぶん]のロバに載[の]せて、町[まち]へ引[ひ]き返[かえ]した。"
  14: "ユダと兄弟[きょうだい]たちはヨセフの家[いえ]に入[はい]った。ヨセフはまだそこにいた。彼[かれ]らは彼[かれ]の前[まえ]に地[ち]に伏[ふ]した。"
  15: "ヨセフは彼[かれ]らに言[い]った。「これはどうしたことか。あなたがたは知[し]らなかったのか。わたしのような者[もの]が占[うらな]いをすることを。」"
  16: "ユダは言[い]った。「ご主人[しゅじん]さまに何[なに]を答[こた]え、何[なに]を語[かた]り、どうして自分[じぶん]を正[ただ]しいとすることができるでしょう。神[かみ]は僕[しもべ]どもの不正[ふせい]を見[み]つけられました。見[み]てください、わたしたちも、杯[さかずき]が見[み]つかった者[もの]も、ご主人[しゅじん]さまの奴隷[どれい]です。」"
  17: "ヨセフは言[い]った。「わたしはそんなことはしない。杯[さかずき]が見[み]つかった者[もの]がわたしの奴隷[どれい]になる。あなたがたは父[ちち]のところへ無事[ぶじ]に上[のぼ]って行[い]きなさい。」"
  18: "ユダは彼[かれ]に近[ちか]づいて言[い]った。「お願[ねが]いです、ご主人[しゅじん]さま。どうか、僕[しもべ]があなたの前[まえ]にひと言[こと]申[もう]し上[あ]げるのをお許[ゆる]しください。僕[しもべ]に怒[いか]らないでください。あなたはファラオに次[つ]ぐ方[かた]なのですから。"
  19: "ご主人[しゅじん]さまは僕[しもべ]どもに『父[ちち]や兄弟[きょうだい]はいるか』とお尋[たず]ねになりました。"
  20: "わたしたちはご主人[しゅじん]さまに『わたしたちには老[お]いた父[ちち]がおり、父[ちち]が老[お]いてから生[う]まれた末[すえ]の子[こ]がおります。その子[こ]の兄弟[きょうだい]は死[し]に、母[はは]のところからは彼[かれ]だけが残[のこ]りました。父[ちち]は彼[かれ]を愛[あい]しております』と申[もう]し上[あげ]ました。"
  21: "すると、あなたは僕[しもべ]どもに『その者[もの]をわたしのところへ連[つ]れて来[こ]い。わたしは彼[かれ]を顧[かえり]みよう』と言[い]われました。"
  22: "わたしたちはご主人[しゅじん]さまに『あの子[こ]は父[ちち]を離[はな]れることはできません。離[はな]れれば、死[し]んでしまいます』と申[もう]し上[あげ]ました。"
  23: "あなたは僕[しもべ]どもに『あなたがたの末[すえ]の弟[おとうと]が一緒[いっしょ]に下[くだ]って来[こ]なければ、あなたがたはもはやわたしの顔[かお]を見[み]ることはできない』と言[い]われました。"
  24: "わたしたちは、あなたの僕[しもべ]である父[ちち]のところへ上[のぼ]ったとき、ご主人[しゅじん]さまの言葉[ことば]を父[ちち]に告[つ]げました。"
  25: "すると、父[ちち]は『また行[い]って、わたしたちに少[すこ]しの食物[しょくもつ]を買[か]ってきなさい』と言[い]いました。"
  26: "わたしたちは『わたしたちは下[くだ]って行[い]くことはできません。もし末[すえ]の弟[おとうと]が一緒[いっしょ]なら、下[くだ]って行[い]きます。あの人[ひと]の顔[かお]は、末[すえ]の弟[おとうと]が一緒[いっしょ]でなければ見[み]られないのですから』と言[い]いました。"
  27: "あなたの僕[しもべ]である父[ちち]はわたしたちに言[い]いました。『あなたがたは、わたしの妻[つま]がわたしに二人[ふたり]の子[こ]を産[う]んだことを知[し]っている。"
  28: "一人[ひとり]はわたしのもとを去[さ]り、あなたがたは、彼[かれ]が獣[けもの]に食[た]べられたと言[い]った。そして今[いま]に至[いた]るまで、わたしは彼[かれ]を見[み]ていない。"
  29: "もしあなたがたがこの者[もの]もわたしの前[まえ]から連[つ]れて行[い]き、道[みち]で彼[かれ]に災[わざわ]いが起[おこ]れば、あなたがたは、この白髪[しらが]のわたしを悲[かな]しみとともに陰府[よみ]へ下[くだ]らせることになる。』"
  30: "ですから今[いま]、わたしがあなたの僕[しもべ]である父[ちち]のところへ帰[かえ]ったとき、あの子[こ]が一緒[いっしょ]にいなければ――父[ちち]の魂[たましい]はあの子[こ]の魂[たましい]に結[むす]びついているのです――"
  31: "父[ちち]はあの子[こ]がいないのを見[み]ると死[し]んでしまいます。そうすれば、僕[しもべ]どもは、あなたの僕[しもべ]である白髪[しらが]の父[ちち]を悲[かな]しみとともに陰府[よみ]へ下[くだ]らせることになるのです。"
  32: "というのは、僕[しもべ]は父[ちち]に『もしわたしが彼[かれ]をあなたのところへ連[つ]れて来[き]て、あなたの前[まえ]に立[た]たせなかったなら、わたしはいつまでも父[ちち]に対して罪[つみ]ある者[もの]となります』と言[い]って、あの子[こ]のことを引[ひ]き受[う]けたのです。"
  33: "ですから今[いま]、あの子[こ]の代[か]わりに、僕[しもべ]がご主人[しゅじん]さまの奴隷[どれい]としてここに残[のこ]ります。あの子[こ]は兄弟[きょうだい]たちと一緒[いっしょ]に上[のぼ]らせてください。"
  34: "あの子[こ]が一緒[いっしょ]でなければ、どうしてわたしは父[ちち]のところへ上[のぼ]れるでしょう。父[ちち]に降[ふ]りかかる災[わざわ]いを、わたしは見[み]たくないのです。」"

notes:
  1: "ἐνετείλατο τῷ ὄντι ἐπὶ τῆς οἰκίας — 家を預かる者に命じた. Πλήσατε τοὺς μαρσίππους βρωμάτων — 袋を食物で満たせ. ἐπὶ τοῦ στόματος τοῦ μαρσίππου — 袋の口に (στόμα — «устье»)."
  2: "κόνδυ — 杯 (ἡ κόνδυ, иноземное слово; слав. «чаша»). τιμὴν τοῦ σίτου — 穀物の代金. κατὰ τὸ ῥῆμα Ιωσηφ — ヨセフが言ったとおり."
  3: "τὸ πρωῒ διέφαυσεν — 朝が明けると (διαυγάζω). ἀπεστάλησαν — 送り出された (ἀποστέλλω)."
  4: "ἐξελθόντων αὐτῶν τὴν πόλιν — 町を出て (gen. abs.). οὐκ ἀπέσχον μακράν — まだ遠くへ行かないうちに (ἀπέχω — «быть вдали»; в критическом издании в квадратных скобках, в базе есть — поэтому без 〔…〕). ἐπιδίωξον ὀπίσω — 後を追え. ἀνταπεδώκατε πονηρὰ ἀντὶ καλῶν — 悪をもって善に報いた (ἀνταποδίδωμι)."
  5: "ἵνα τί ἐκλέψατέ μου τὸ κόνδυ — なぜわたしの杯を盗んだのか. οἰωνισμῷ οἰωνίζεται ἐν αὐτῷ — それで占いをする (букв. «гаданием гадает на нём»; слав. «волхвованием волхвует в ней») — передано как есть, без смягчения. πονηρὰ συντετέλεσθε — 悪いことをした."
  6: "εὑρὼν δὲ αὐτούς — 追いついて. κατὰ τὰ ῥήματα ταῦτα — これらの言葉を (букв.: говорил им эти слова)."
  7: "Ἵνα τί λαλεῖ ὁ κύριος — なぜご主人さまはおっしゃるのか. μὴ γένοιτο — そんなはずはない (букв. «да не будет»)."
  8: "εἰ τὸ μὲν ἀργύριον… ἀπεστρέψαμεν — 銀を返して来た. πῶς ἂν κλέψαιμεν — どうして盗むだろうか (потенциальное)."
  9: "παρ᾽ ᾧ ἂν εὑρεθῇ — だれのところから見つかっても. ἀποθνῃσκέτω — 死に (императив 3 л.)."
  10: "καθὼς λέγετε — あなたがたが言ったとおりに. καθαροί — 無罪 (букв. «чистые»)."
  11: "ἔσπευσαν — 急いで. καθεῖλαν — 下ろした (καθαιρέω). ἤνοιξαν — 開けた."
  12: "ἠρεύνα — 調べた (ἐρευνάω). ἀπὸ τοῦ πρεσβυτέρου ἀρξάμενος — 年長の者から始めて. εὗρεν τὸ κόνδυ ἐν τῷ μαρσίππῳ τῷ Βενιαμιν — 杯はベニヤミンの袋から見つかった."
  13: "διέρρηξαν τὰ ἱμάτια — 衣服を裂いた (διαρρήγνυμι). ἐπέθηκαν… ἐπὶ τὸν ὄνον — ロバに載せた. ἐπέστρεψαν εἰς τὴν πόλιν — 町へ引き返した."
  14: "ἔπεσον ἐναντίον αὐτοῦ ἐπὶ τὴν γῆν — 彼の前に地に伏した."
  15: "Τί τὸ πρᾶγμα τοῦτο — これはどうしたことか. οἰωνισμῷ οἰωνιεῖται ἄνθρωπος οἷος ἐγώ — わたしのような者が占いをする (оставлено как есть; слав. «несть волхвователь человек, якоже аз»)."
  16: "Τί ἀντεροῦμεν — 何を答えよう (ἀντερῶ). τί δικαιωθῶμεν — どうして正しいとされる (δικαιόω). τὴν ἀδικίαν τῶν παίδων σου — 僕どもの不正. οἰκέται — 奴隷 (οἰκέτης)."
  17: "Μή μοι γένοιτο — わたしはそんなことはしない (букв. «да не будет мне»). μετὰ σωτηρίας — 無事に (букв. «со спасением»)."
  18: "Ἐγγίσας — 近づいて. Δέομαι, κύριε — お願いです、ご主人さま. μὴ θυμωθῇς — 怒らないでください. ὅτι σὺ εἶ μετὰ Φαραω — あなたはファラオに次ぐ方 (букв. «ты после фараона»; слав. «ты еси по фараоне»)."
  19: "Εἰ ἔχετε πατέρα ἢ ἀδελφόν — 父や兄弟はいるか. Вложенная цитата — 『…』."
  20: "πατὴρ πρεσβύτερος — 老いた父. παιδίον γήρως νεώτερον αὐτῷ — 父が老いてから生まれた末の子 (букв. «дитя старости его, младшее»). ὁ ἀδελφὸς αὐτοῦ ἀπέθανεν — その子の兄弟は死に. μόνος ὑπελείφθη τῇ μητρί — 母のところからは彼だけが残った."
  21: "Καταγάγετε αὐτὸν πρός με — その者をわたしのところへ連れて来い. ἐπιμελοῦμαι αὐτοῦ — わたしは彼を顧みよう (слав. «да вижду его» — иное чтение, не добавлено)."
  22: "Οὐ δυνήσεται… καταλιπεῖν τὸν πατέρα — 父を離れることはできない. ἐὰν δὲ καταλίπῃ τὸν πατέρα, ἀποθανεῖται — 離れれば死んでしまう; в греч. не назван субъект смерти, двусмысленность сохранена."
  23: "Ἐὰν μὴ καταβῇ… μεθ᾽ ὑμῶν — 一緒に下って来なければ. οὐ προσθήσεσθε ἔτι ἰδεῖν τὸ πρόσωπόν μου — もはや私の顔を見ることはできない (προστίθημι + inf.)."
  24: "ἀνέβημεν πρὸς τὸν παῖδά σου πατέρα δὲ ἡμῶν — 父のところへ上った (двойной винитив: «к рабу твоему, отцу нашему»)."
  25: "Βαδίσατε πάλιν — また行け. ἀγοράσατε ἡμῖν μικρὰ βρώματα — 少しの食物を買ってこい."
  26: "Οὐ δυνησόμεθα καταβῆναι — 下って行くことはできない. τοῦ ἀδελφοῦ τοῦ νεωτέρου μὴ ὄντος μεθ᾽ ἡμῶν — 末の弟が一緒でなければ (gen. abs.)."
  27: "Ὑμεῖς γινώσκετε — あなたがたは知っている. δύο ἔτεκέν μοι ἡ γυνή — 妻が二人の子を産んだ."
  28: "ἐξῆλθεν ὁ εἷς ἀπ᾽ ἐμοῦ — 一人はわたしのもとを去り. εἴπατε ὅτι θηριόβρωτος γέγονεν — あなたがたは獣に食べられたと言った (в LXX «вы сказали», не «я сказал»; передано косвенно, чтобы не строить третий уровень кавычек). οὐκ εἶδον αὐτὸν ἔτι καὶ νῦν — 今に至るまで見ていない."
  29: "ἐὰν… λάβητε καὶ τοῦτον — この者も連れて行き. κατάξετε… μετὰ λύπης εἰς ᾅδου — 悲しみとともに陰府へ下らせる (ср. 42:38)."
  30: "εἰσπορεύωμαι πρὸς τὸν παῖδά σου — 父のところへ帰ったとき. ἡ ψυχὴ αὐτοῦ ἐκκρέμαται ἐκ τῆς τούτου ψυχῆς — 父の魂はあの子の魂に結びついている (ἐκκρέμαμαι — «висеть на»). В греч. вставка в тире — сохранена."
  31: "τελευτήσει — 死んでしまう (τελευτάω). μετ᾽ ὀδύνης — 悲しみとともに (ὀδύνη — «боль, скорбь»)."
  32: "ἐκδέδεκται τὸ παιδίον — あの子のことを引き受けた (ἐκδέχομαι; perfect). ἡμαρτηκὼς ἔσομαι — 罪ある者となる (ср. 43:9)."
  33: "παραμενῶ σοι παῖς — 奴隷として残ります (παραμένω). οἰκέτης τοῦ κυρίου — ご主人さまの奴隷."
  34: "πῶς γὰρ ἀναβήσομαι — どうして上れるだろう. ἵνα μὴ ἴδω τὰ κακά — 災いを見たくない (букв. «чтобы не увидеть бед»)."
