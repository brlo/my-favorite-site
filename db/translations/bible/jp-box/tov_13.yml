verses:
  1: "トビトは喜[よろこ]びのうちに祈[いの]りを書[か]き記[しる]して言[い]った。"
  2: "「ほむべきかな、永遠[とこしえ]に生[い]きる神[かみ]は。その王国[おうこく]もまた、ほむべきかな。神は懲[こ]らしめ、またあわれみ、よみに下[くだ]し、また上[のぼ]らせる。その手[て]から逃[のが]れる者[もの]はない。"
  3: "イスラエルの子[こ]らよ、諸国民[しょこくみん]の前[まえ]で神に告白[こくはく]せよ。神がわたしたちを彼[かれ]らの間[あいだ]に散[ち]らしたからである。"
  4: "そこであなたがたは神の偉大[いだい]さを示[しめ]し、すべていのちある者[もの]の前[まえ]で神を高[たか]く挙[あ]げよ。この方[かた]こそ、わたしたちの主[しゅ]であり神[かみ]であり、永遠[とこしえ]にわたしたちの父[ちち]であるからである。"
  5: "神はわたしたちの不法[ふほう]のゆえにわたしたちを懲[こ]らしめ、また再[ふたた]びあわれんで、あなたがたが彼[かれ]らの間[あいだ]に散[ち]らされているすべての国民[こくみん]の中[なか]から、わたしたちを集[あつ]める。"
  6: "もしあなたがたが、心[こころ]を尽[つ]くし、魂[たましい]を尽くして神に立[た]ち返[かえ]り、神の前[まえ]で真実[しんじつ]を行[おこな]うなら、神もまたあなたがたに立ち返り、あなたがたから御顔[みかお]を隠[かく]されることはない。"
  7: "神があなたがたになさることを見[み]よ。そして、口[くち]を尽[つ]くして神に告白[こくはく]せよ。正義[せいぎ]の主[しゅ]をほめたたえ、世々[よよ]の王[おう]を高[たか]く挙[あ]げよ。"
  8: "わたしは捕囚[ほしゅう]の地[ち]で神に告白[こくはく]し、神の力[ちから]と偉大[いだい]さを罪人[つみびと]の国民[こくみん]に示[しめ]す。罪人たちよ、立[た]ち返[かえ]って、神の前[まえ]で正[ただ]しいことを行[おこな]え。神があなたがたを喜[よろこ]ばれ、あなたがたにあわれみを示[しめ]してくださるかどうか、だれにわかるだろうか。"
  9: "わたしの神[かみ]をわたしは高[たか]く挙[あ]げ、わたしの魂[たましい]は天[てん]の王[おう]を高く挙げ、その偉大[いだい]さを喜[よろこ]び躍[おど]る。"
  10: "すべての者[もの]が言[い]い、エルサレムで神に告白[こくはく]するように。エルサレム、聖[せい]なる都[みやこ]よ。神はあなたの子[こ]らが行[おこな]ったわざのゆえにあなたを懲[こ]らしめ、また正[ただ]しい者[もの]たちの子らをあわれまれる。"
  11: "主[しゅ]によく告白[こくはく]せよ。世々[よよ]の王[おう]をほめたたえよ。神の幕屋[まくや]が喜[よろこ]びとともに、あなたのうちに再[ふたた]び建[た]てられるように。"
  12: "神があなたのうちで捕囚[ほしゅう]の者[もの]たちを喜[よろこ]ばせ、世[よ]のすべての代[よ]にわたって、あなたのうちで不幸[ふこう]な者たちを愛[あい]してくださるように。"
  13: "多[おお]くの国民[こくみん]が遠[とお]くから、主[しゅ]である神[かみ]の名[な]のもとへ、手[て]に贈[おく]り物[もの]を持[も]って来[き]、天[てん]の王[おう]にも贈り物をささげる。代[よ]々[よ]の者たちはあなたに喜[よろこ]びの叫[さけ]びをささげる。"
  14: "あなたを憎[にく]む者[もの]はすべて呪[のろ]われ、あなたを愛[あい]する者[もの]はすべて、とこしえに祝福[しゅくふく]される。"
  15: "正[ただ]しい者[もの]たちの子[こ]らのゆえに喜[よろこ]び躍[おど]れ。彼[かれ]らは集[あつ]められ、正しい者たちの主[しゅ]をほめたたえるからである。ああ、あなたを愛[あい]する者たちは幸[さいわ]いである。彼らはあなたの平和[へいわ]のゆえに喜[よろこ]ぶ。"
  16: "あなたのすべての懲[こ]らしめのゆえに悲[かな]しんだ者[もの]たちは幸[さいわ]いである。彼[かれ]らはあなたのゆえに喜[よろこ]び、あなたの栄光[えいこう]をすべて見[み]て、とこしえに楽[たの]しむからである。わたしの魂[たましい]は、大[だい]いなる王[おう]である神[かみ]をほめたたえるように。"
  17: "エルサレムはサファイアとエメラルドと貴重[きちょう]な石[いし]で建[た]てられ、あなたの城壁[じょうへき]と塔[とう]と防壁[ぼうへき]は純金[じゅんきん]で、エルサレムの広場[ひろば]はベリルとカーバンクルとオフィルの石で敷[し]き詰[つ]められるからである。"
  18: "そのすべての街路[がいろ]は言[い]う。『アレルヤ。』そして、彼[かれ]らはほめたたえて言う。『すべての世[よ]を高[たか]く挙[あ]げられた神[かみ]はほむべきかな。』」"

notes:
  1: "Καὶ Τωβιτ ἔγραψεν προσευχὴν εἰς ἀγαλλίασιν καὶ εἶπεν — «И Товит написал молитву в радость и сказал»: ἀγαλλίασις — ликование, радость; слав. «в радость», Син. «в радости». καὶ εἶπεν вводит молитву, которая начинается в ст. 2. Слав. 13:1 добавляет к этому стиху начало гр. 13:2 («благословен Бог живый во веки и Царство его»), но по делению gr эти слова остаются в ст. 2."
  2: "εὐλογητός — формула благословения, ほむべきかな (ср. Пс 65:20). ὁ ζῶν εἰς τοὺς αἰῶνας — «живущий в веки». καὶ ἡ βασιλεία αὐτοῦ — эллипсис: «[благословенно] и царство Его». μαστιγοῖ — «бичует, наказывает» (μαστιγόω); ἐλεᾷ — «милует» (ἐλεάω). κατάγει εἰς ᾅδην καὶ ἀνάγει — «низводит в ад и возводит»; ᾅδης — よみ, как в Псалтири (ср. 1 Цар 2:6). ἐκφεύξεται — «избежит» (ἐκφεύγω)."
  3: "ἐξομολογεῖσθε — импер. от ἐξομολογέομαι; в этой молитве слово значит «славословить, исповедовать хвалу» (ср. 1 Пар 25:3; 2 Пар 20:21), поэтому по всей главе 告白する. οἱ υἱοὶ Ισραηλ — звательное обращение. ἐνώπιον τῶν ἐθνῶν — «пред народами». διέσπειρεν — «рассеял» (διασπείρω); слав. «разсея нас в них»."
  4: "ἐκεῖ — «там», т. е. в рассеянии. ὑποδείξατε — «покажите, возвещайте» (ὑποδείκνυμι); слав. «являйте». μεγαλωσύνη — «величие». ὑψοῦτε — «превозносите» (ὑψόω). ἐνώπιον παντὸς ζῶντος — «пред всем живущим». καθότι — «ибо, так как»; двойное αὐτός подчёркнуто: この方こそ…であり…である. εἰς πάντας τοὺς αἰῶνας — «во все веки»."
  5: "μαστιγώσει — буд. от μαστιγόω, «накажет»; слав. «наказовати имать». ἐν ταῖς ἀδικίαις ἡμῶν — «за беззакония наши» (ἐν в причинном значении). συνάξει — «соберёт» (συνάγω). οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς — «где бы вы ни были рассеяны между ними» (σκορπίζω с ἄν); смена лица (ἡμᾶς / σκορπισθῆτε) сохранена, как в греческом."
  6: "ἐὰν ἐπιστρέψητε — «если обратитесь» (ἐπιστρέφω, аор. конъюнктив). ἐν ὅλῃ καρδίᾳ … ἐν ὅλῃ τῇ ψυχῇ — «всем сердцем… всею душою». ποιῆσαι ἐνώπιον αὐτοῦ ἀλήθειαν — «творить пред Ним истину» (ἀλήθεια); слав. «творити… истину». οὐ μὴ κρύψῃ — усиленное отрицание, «не скроет». Слав. 13:6 вбирает также гр. 13:7–8 (до «кто весть, аще благоволит о вас…»); по делению gr эти слова — в ст. 7–8."
  7: "θεάσασθε — импер. аор. от θεάομαι, «увидьте, посмотрите». ἃ ποιήσει μεθ᾽ ὑμῶν — «что сделает с вами». ἐξομολογήσασθε — импер. «исповедайте, славьте» (ἐξομολογέομαι). ἐν ὅλῳ τῷ στόματι ὑμῶν — «всем ртом», т. е. всеми устами. κύριος τῆς δικαιοσύνης — «Господь правды»; βασιλεὺς τῶν αἰώνων — «Царь веков» (世々の王). Слав. на этом месте даёт ст. 9 («Бога моего возношу…») — сдвиг на два стиха."
  8: "ἐγὼ ἐν τῇ γῇ τῆς αἰχμαλωσίας μου — «я в земле плена моего»: первое лицо, как в греч. (αἰχμαλωσία — плен). ἐξομολογοῦμαι — наст., «исповедую, славлю». δεικνύω — «показываю». ἔθνει ἁμαρτωλῶν — «народу грешников» (датив). Ἐπιστρέψατε — импер. «обратитесь»; ποιήσατε δικαιοσύνην — «делайте правду». τίς γινώσκει εἰ θελήσει ὑμᾶς — «кто знает, благоволит ли [Он] к вам»: θελήσει («пожелает») передано 喜ばれ, т. е. «будет благоволить» (εἰ в косвенном вопросе); слав. «кто весть, аще благоволит о вас»; ἐλεημοσύνη здесь — «милость», не «милостыня», поэтому あわれみ."
  9: "τὸν θεόν μου ὑψῶ — «Бога моего превозношу» (ὑψόω). ἡ ψυχή μου τὸν βασιλέα τοῦ οὐρανοῦ — эллипсис: «душа моя — Царя небесного [превозносит]»; сказуемое повторено. ἀγαλλιάσεται τὴν μεγαλωσύνην αὐτοῦ — «возрадуется величию Его» (ἀγαλλιάω, винительный отношения). Слав. 13:7 — этот стих."
  10: "λεγέτωσαν … ἐξομολογείσθωσαν — импер. 3 л. мн. ч.: «пусть говорят и исповедают». ἐν Ιεροσολύμοις — «в Иерусалиме» (в греч. мн. ч.). Ιεροσόλυμα πόλις ἁγία — обращение: «Иерусалим, город святой»; это не чужая речь, поэтому 『』 не ставятся. μαστιγώσει ἐπὶ τὰ ἔργα — «накажет за дела» (ἐπί с вин.); υἱοὺς τῶν δικαίων — «сынов праведных». Слав. делит стих на 8-й (λεγέτωσαν…) и 9-й (Иерусалиме, граде святый…)."
  11: "ἐξομολογοῦ — импер. наст. «исповедуй, славь». ἀγαθῶς — «хорошо, как должно»; слав. «благо», Син. «усердно». εὐλόγει — «благословляй». βασιλεὺς τῶν αἰώνων — «Царь веков». ἵνα … οἰκοδομηθῇ σοι — «чтобы была построена тебе» (датив пользы); σκηνή — 幕屋. μετὰ χαρᾶς — «с радостью». Слав. 13:10 объединяет этот стих со ст. 12."
  12: "εὐφρᾶναι — аор. инф. от εὐφραίνω, «возвеселить»; продолжает ἵνα из ст. 11. ἀγαπήσαι — «возлюбить» (ἀγαπάω). ἐν σοί — «в тебе» (Иерусалим). αἰχμάλωτοι — 捕囚の者たち; ταλαίπωροι — «несчастные, бедствующие» (ταλαίπωρος), слав. «бедныя». εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος — «во все роды века». Слав. 13:10 включает и этот стих."
  13: "ἔθνη πολλὰ μακρόθεν — «многие народы издалека». ἥξει — буд. от ἥκω, «придут» (при ср. мн. сказуемое в ед. ч.). πρὸς τὸ ὄνομα κυρίου τοῦ θεοῦ — «к имени Господа Бога». δῶρα … καὶ δῶρα — повтор сохранён. γενεαὶ γενεῶν — «роды родов». δώσουσίν σοι ἀγαλλίαμα — «дадут тебе ликование» (ἀγαλλίαμα — радостный клик)."
  14: "ἐπικατάρατοι — «прокляты» (ἐπικατάρατος, усиленное от κατάρατος). οἱ μισοῦντές σε — «ненавидящие тебя» (μισέω). εὐλογημένοι ἔσονται — «благословенны будут». εἰς τὸν αἰῶνα — «в век». Обращение к Иерусалиму (σε). Слав. 13:12 — этот стих."
  15: "χάρηθι καὶ ἀγαλλίασαι — импер. аор. «возрадуйся и возликуй» (χαίρω, ἀγαλλιάω). ἐπὶ τοῖς υἱοῖς τῶν δικαίων — «о сынах праведных» (ἐπί с дат.). συναχθήσονται — буд. пасс. «соберутся» (συνάγω). κύριος τῶν δικαίων — «Господь праведных». ὦ μακάριοι — восклицание ὦ: «о блаженны» (слав. «о, блажени»). χαρήσονται ἐπὶ τῇ εἰρήνῃ σου — «возрадуются о мире твоём». Слав. 13:13 и 13:14a."
  16: "μακάριοι ὅσοι ἐλυπήθησαν — «блаженны все, кто опечалился» (λυπέω). ἐπὶ πάσαις ταῖς μάστιξίν σου — «о всех наказаниях твоих» (μᾶστιξ — бич, казнь). ἐπὶ σοὶ χαρήσονται — «о тебе возрадуются». θεασάμενοι — прич. аор. «увидев» (θεάομαι). εὐφρανθῆσονται — «возвеселятся» (εὐφραίνω). ἡ ψυχή μου εὐλογείτω — «душа моя да благословляет» (импер. 3 л.). Слав. 13:14b и 13:15."
  17: "οἰκοδομηθήσεται — буд. пасс. «будет построен». σάπφειρος — サファイア; σμάραγδος — エメラルド; λίθος ἔντιμος — «драгоценный камень». τείχη — 城壁; πύργοι — 塔; προμαχῶνες — «передовые укрепления» (προμαχών). χρυσίον καθαρόν — «чистое золото». πλατεῖαι — 広場. βήρυλλος — ベリル; ἄνθραξ — カーバンクル (как Исх 28:18); λίθος ἐκ Σουφιρ — «камень из Суфира» (в евр. и Син. «Офир» — オフィル, то же место, что Офир в 3 Цар/1 Пар). ψηφολογηθήσονται — «будут вымощены» (ψηφολογέω)."
  18: "ἐροῦσιν — буд. «скажут». ῥῦμαι — «улицы, переулки» (ῥύμη), слав. «стогны». Αλληλουια — アレルヤ (как в Псалтири и Откр 19:1). αἰνέσουσιν λέγοντες — «восхвалят, говоря». ὃς ὕψωσεν πάντας τοὺς αἰῶνας — «Который возвысил все века»: тёмное место, слав. «вознесе во вся веки», Син. «превознёс Иерусалим» (по смыслу); держимся греческого. Речь улиц — 『…』 внутри молитвы."
