# jp-box, Товит, глава 13. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Товита нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 13: молитва-гимн Товита, 1–18. Вступление (1), благословение Бога и призыв
# к сынам Израиля (2–6), прославление в плену и обращение грешников (7–11),
# Иерусалим и его будущая слава (12–18). Вся молитва — 「…」 (ВЗ, красного и синего
# нет); речь улиц в 18 — 『…』 внутри молитвы.
# Нумерация по gr: 18 стихов. Слав. сдвинут: csl 13:1 вбирает начало гр. 13:2;
# csl 13:2 = гр. 13:2b; csl 13:6 вбирает гр. 13:6–8; csl 13:7 = гр. 13:9, дальше
# сдвиг на два стиха (csl 13:10 = гр. 13:11–12; csl 13:14 = гр. 13:15b–16a;
# csl 13:15 = гр. 13:16b; csl 13:16–17 делят гр. 13:17). Держимся деления gr.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: サファイア, エメラルド, ベリル, カーバンクル, アレルヤ и пр. уже
# в корпусе (アレルヤ — Псалтирь и Откр 19:1, там сноска при первом месте).
# Имена — транслитерация греческого (LXX).

