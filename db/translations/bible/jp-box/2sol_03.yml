# jp-box, 2-е Послание к Фессалоникийцам, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: просьба о молитве (1–2), верность Господа (3–4), молитва о любви и
# терпении (5), удаление от бесчинных (6), пример апостола (7–9),
# «кто не хочет трудиться, тот и не ест» (10–12), не унывать в добре (13),
# вразумление согрешающего как брата (14–15), пожелание мира (16),
# собственноручное приветствие и благословение (17–18).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: 3:4 [καὶ] стоит в базе в квадратных скобках — слово есть, не оборачивается.
# Сносок ⟨…⟩ в главе нет. jp-ni не использовался.

tr_code: jp-box
book: 2sol
chapter: 3
draft: true

verses:
  1: "終[お]わりに、兄弟[きょうだい]たち、わたしたちのために祈[いの]ってほしい。主[しゅ]の言葉[ことば]が、あなたがたのところでそうであったように、速[すみ]やかに広[ひろ]まり、栄光[えいこう]を受[う]けるように。"
  2: "また、わたしたちが、道理[どうり]に外[はず]れた悪[わる]い人々[ひとびと]から救[すく]い出[だ]されるように。すべての者[もの]に信仰[しんこう]があるわけではないからである。"
  3: "しかし、主[しゅ]は真実[しんじつ]な方[かた]である。主[しゅ]はあなたがたを強[つよ]め、悪[あ]しき者[もの]から守[まも]ってくださる。"
  4: "また、わたしたちは主[しゅ]にあって、あなたがたについて確信[かくしん]している。わたしたちが命[めい]じることを、あなたがたは行[おこな]っており、これからも行[おこな]うであろう。"
  5: "どうか、主[しゅ]があなたがたの心[こころ]を、神[かみ]の愛[あい]とキリストの忍耐[にんたい]とへと向[む]けてくださるように。"
  6: "兄弟[きょうだい]たち、わたしたちは、わたしたちの主[しゅ]イエス・キリストの名[な]によって、あなたがたに命[めい]じる。無秩序[むちつじょ]に歩[あゆ]み、わたしたちから受[う]けた言[い]い伝[つた]えに従[したが]わない兄弟[きょうだい]からは、遠[とお]ざかりなさい。"
  7: "あなたがた自身[じしん]、わたしたちをどのように見習[みなら]うべきかを知[し]っている。わたしたちは、あなたがたの間[あいだ]で落[お]ち着[つ]きなく振[ふ]る舞[ま]ったことはないからである。"
  8: "また、だれからもただでパンを食[た]べたことはなく、あなたがたのうちのだれにも負担[ふたん]をかけまいと、夜[よる]も昼[ひる]も、苦労[くろう]と労苦[ろうく]とをもって働[はたら]いた。"
  9: "これは、わたしたちに権利[けんり]がないからではなく、あなたがたがわたしたちを見習[みなら]うように、自分[じぶん]自身[じしん]を模範[もはん]として与[あた]えるためである。"
  10: "実際[じっさい]、わたしたちがあなたがたのところにいたとき、こう命[めい]じた。働[はたら]くことを望[のぞ]まない者[もの]は、食[た]べてもいけない、と。"
  11: "なぜなら、あなたがたの間[あいだ]に、無秩序[むちつじょ]に歩[あゆ]み、何[なに]も仕事[しごと]をせず、かえって余計[よけい]なことに手[て]を出[だ]す者[もの]たちがいると聞[き]いているからである。"
  12: "このような者[もの]たちには、主[しゅ]イエス・キリストにあって命[めい]じ、また勧[すす]める。落[お]ち着[つ]いて働[はたら]き、自分[じぶん]のパンを食[た]べるように。"
  13: "しかし、兄弟[きょうだい]たち、あなたがたは、善[ぜん]を行[おこな]うことに疲[つか]れてはならない。"
  14: "しかし、だれかが、この手紙[てがみ]によるわたしたちの言葉[ことば]に従[したが]わないなら、その者[もの]をよく心[こころ]に留[と]め、交[まじ]わりを持[も]たないようにしなさい。恥[は]じ入[い]るためである。"
  15: "しかし、その者[もの]を敵[てき]と見[み]なしてはならない。むしろ、兄弟[きょうだい]として訓戒[くんかい]しなさい。"
  16: "平和[へいわ]の主[しゅ]ご自身[じしん]が、いつも、あらゆる仕方[しかた]で、あなたがたに平和[へいわ]を与[あた]えてくださるように。主[しゅ]があなたがたすべてとともにいてくださるように。"
  17: "この挨拶[あいさつ]は、わたしパウロの手[て]によるものであり、すべての手紙[てがみ]におけるしるしである。わたしはこのように書[か]く。"
  18: "わたしたちの主[しゅ]イエス・キリストの{恵[めぐ]み|恩寵[おんちょう]}が、あなたがたすべてとともにありますように。"

notes:
  1: "Τὸ λοιπόν — 終わりに. τρέχῃ — «бежало» (о слове Господнем), 速やかに広まり (у jp-joc 疾く廣まりて). δοξάζηται — 栄光を受ける. καθὼς καὶ πρὸς ὑμᾶς — あなたがたのところでそうであったように."
  2: "ἀτόπων — «неуместных, бесчинных»; 道理に外れた. πονηρῶν ἀνθρώπων — 悪い人々. οὐ γὰρ πάντων ἡ πίστις — すべての者に信仰があるわけではない (γάρ передан からである)."
  3: "πιστός — 真実な («верный»). στηρίξει — 強める. φυλάξει ἀπὸ τοῦ πονηροῦ — 悪しき者から守る; τοῦ πονηροῦ может быть и средним («от зла»), и мужским («от лукавого»); оставлено личным, как у jp-joc 凶惡者. δέ — しかし."
  4: "πεποίθαμεν ἐν κυρίῳ ἐφ᾿ ὑμᾶς — 主にあって、あなたがたについて確信している. ἃ παραγγέλλομεν ποιεῖτε καὶ ποιήσετε — 行っており、これからも行う. В базе [καὶ] в квадратных скобках — слово есть, 〔〕 не ставятся."
  5: "κατευθύναι — 向けてくださるように (оптатив). εἰς τὴν ἀγάπην τοῦ θεοῦ — 神の愛 (род. может быть и субъектным, и объектным — не уточнён). εἰς τὴν ὑπομονὴν τοῦ Χριστοῦ — キリストの忍耐."
  6: "Παραγγέλλομεν δέ — 命じる. στέλλεσθαι ἀπὸ παντὸς ἀδελφοῦ — 兄弟から遠ざかる («сторониться»). ἀτάκτως περιπατοῦντος — 無秩序に歩む (воинский образ: «не в строю»). παρέλαβοσαν — 受けた (3 pl. от παραλαμβάνω)."
  7: "μιμεῖσθαι ἡμᾶς — わたしたちを見習う. οὐκ ἠτακτήσαμεν — 落ち着きなく振る舞ったことはない. γάρ передан からである."
  8: "δωρεὰν ἄρτον — ただでパン. ἐν κόπῳ καὶ μόχθῳ — 苦労と労苦とをもって. ἐπιβαρῆσαι — 負担をかける. νυκτὸς καὶ ἡμέρας — 夜も昼も (порядок греческого)."
  9: "ἐξουσία — 権利 (право на содержание от общины). οὐχ ὅτι… ἀλλ᾿ ἵνα — からではなく…ため; ἀλλά передано явно. τύπον δῶμεν — 模範として与える."
  10: "καὶ γάρ — 実際 (усиление, не «ибо»). εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω — 働くことを望まない者は、食べてもいけない; μηδέ при imper. — «и не». Речение не сглажено."
  11: "περιεργαζομένους — «занимающиеся чужими делами»; 余計なことに手を出す; игра слов ἐργαζομένους / περιεργαζομένους передана противопоставлением 仕事をせず / 余計なことに手を出す. γάρ передан なぜなら."
  12: "μετὰ ἡσυχίας — 落ち着いて («в тишине»). τὸν ἑαυτῶν ἄρτον ἐσθίωσιν — 自分のパンを食べる. παραγγέλλομεν καὶ παρακαλοῦμεν — 命じ、また勧める (оба глагола)."
  13: "ἐγκακέω — 疲れる, «падать духом»; 善を行うことに疲れてはならない (ср. Гал 6:9)."
  14: "σημειοῦσθε — «отмечать, брать на заметку»; よく心に留め (не «клеймить», не анафема). μὴ συναναμίγνυσθαι αὐτῷ — 交わりを持たない. ἵνα ἐντραπῇ — 恥じ入るため."
  15: "μὴ ὡς ἐχθρὸν ἡγεῖσθε — 敵と見なしてはならない. ἀλλά — むしろ. νουθετεῖτε ὡς ἀδελφόν — 兄弟として訓戒する."
  16: "ὁ κύριος τῆς εἰρήνης — 平和の主. δῴη — 与えてくださるように (оптатив). διὰ παντὸς ἐν παντὶ τρόπῳ — いつも、あらゆる仕方で. ὁ κύριος μετὰ πάντων ὑμῶν — 主があなたがたすべてとともに (пожелание, не констатация)."
  17: "ἀσπασμός — 挨拶. τῇ ἐμῇ χειρί — わたしの手によって (автограф в конце письма). σημεῖον ἐν πάσῃ ἐπιστολῇ — すべての手紙におけるしるし. οὕτως γράφω — このように書く."
  18: "ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν — 恵みが…ともにありますように (формула, ср. 1 Фес 5:28)."
