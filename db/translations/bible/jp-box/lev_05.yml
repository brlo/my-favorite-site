# jp-box, Левит, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Фуригана — при первом появлении слова в стихе.
# Глава 5: случаи греха, требующие жертвы (1–6), снисхождение к бедным (7–13),
# жертва повинности — 愆祭 (14–19).
# Речь Бога — 「…」 (15–19), красного нет.
# 〔…〕 одно: 5:2 — слав. «и забыв их осквернится» закрывает оборванный
# греческий перечень; в gr-lxx-byz этих слов нет (bracket_check: ἔλαθεν — НЕТ).
# Сноска ⟨…⟩ одна: 愆祭 (5:15) — первое упоминание термина в корпусе.
# Нумерация: в gr-lxx-byz гл. 5 имеет 26 стихов — 5:20–26 (закон об обмане)
# дословно повторены в 6:1–6. По решению пользователя держимся csl-ru: закон
# стоит один раз, в главе 6; здесь стихи 20–26 опущены (исключение в
# jp_box_check.rb). 5:6: LXX называет жертву περὶ ἁμαρτίας (贖罪祭),
# Синодальный — «жертва повинности».
# jp-ni не использовался.

tr_code: jp-box
book: lev
chapter: 5
draft: true

verses:
  1: "もし人[ひと]が罪[つみ]を犯[おか]し、呪[のろ]いの声[こえ]を聞[き]いて、その証人[しょうにん]であり、見[み]たか、知[し]っているのに、告[つ]げないなら、その人は自分[じぶん]の罪を負[お]う。"
  2: "または、人[ひと]が何[なに]か汚[けが]れたもの、すなわち、死[し]んだもの、野獣[やじゅう]に裂[さ]かれた汚れたもの、死んだもの、汚れた忌[いま]むべきもの、汚れた家畜[かちく]の死んだもののいずれかに触[ふ]れるなら、〔そのことを忘[わす]れて汚れたなら、〕"
  3: "または、人[ひと]の汚[けが]れ、すなわち、それに触[ふ]れて汚れるような、あらゆる人の汚れに触れ、それが彼[かれ]に隠[かく]されていて、その後[あと]でそれと知[し]って過[あやま]ちを犯[おか]すなら、"
  4: "または、人[ひと]が唇[くちびる]で、悪[わる]いことをする、あるいは良[よ]いことをすると誓[ちか]って言[い]い、人が誓いをもって語[かた]るすべてのことについて、それが彼[かれ]の目[め]から隠[かく]されて、その後[あと]で彼がそれを知[し]って、これらの一[ひと]つを犯[おか]すなら、"
  5: "そのとき、彼[かれ]は自分[じぶん]が犯[おか]したその罪[つみ]を告白[こくはく]しなさい。"
  6: "そして、自分[じぶん]が過[あやま]ちを犯[おか]したことについて、主[しゅ]に、自分が犯した罪[つみ]のために、羊[ひつじ]の群[む]れから雌[めす]、すなわち雌の小羊[こひつじ]か、山羊[やぎ]の群れから雌の山羊を、贖罪祭[しょくざいさい]として献[ささ]げなさい。祭司[さいし]は、彼[かれ]が犯した罪のために彼のために贖[あがな]い、彼の罪は赦[ゆる]される。"
  7: "もし彼[かれ]の手[て]が小羊[こひつじ]一匹[いっぴき]に足[た]りなければ、自分[じぶん]が犯[おか]した罪[つみ]のために、主[しゅ]に二羽[にはわ]の山鳩[やまばと]か、二羽の家鳩[いえばと]のひなを携[たずさ]えて来[き]なさい。一羽[わ]は贖罪祭[しょくざいさい]に、一羽は燔祭[はんさい]にである。"
  8: "彼[かれ]はそれらを祭司[さいし]のもとに携[たずさ]えて来[き]なさい。祭司はまず贖罪祭[しょくざいさい]のほうを差[さ]し出[だ]し、その頭[あたま]を首[くび]の付[つ]け根[ね]で摘[つ]み切[き]りなさい。ただし、切り離[はな]してはならない。"
  9: "祭司[さいし]はその贖罪祭[しょくざいさい]の血[ち]を祭壇[さいだん]の側面[そくめん]に振[ふ]りかけ、残[のこ]りの血は祭壇の基[もとい]に絞[しぼ]り出[だ]しなさい。それは贖罪祭だからである。"
  10: "そして、二羽目[にはわめ]を定[さだ]めどおりに燔祭[はんさい]としなさい。祭司[さいし]は、彼[かれ]が犯[おか]した罪[つみ]のために彼のために贖[あがな]い、彼の罪は赦[ゆる]される。"
  11: "もし彼[かれ]の手[て]が一対[いっつい]の山鳩[やまばと]にも、二羽[にはわ]の家鳩[いえばと]のひなにも届[とど]かなければ、自分[じぶん]が罪[つみ]を犯[おか]したことのために、その捧[ささ]げ物[もの]として、エファの十分[じゅうぶん]の一[いち]の小麦粉[こむぎこ]を贖罪祭[しょくざいさい]として携[たずさ]えて来[き]なさい。その上[うえ]に油[あぶら]を注[そそ]いではならず、その上に乳香[にゅうこう]を置[お]いてもならない。それは贖罪祭だからである。"
  12: "彼[かれ]はそれを祭司[さいし]のもとに携[たずさ]えて来[き]なさい。祭司はその中[なか]から一握[ひとにぎ]り、すなわち満[み]ちるほどの一握りを取[と]り、それを記念[きねん]として、主[しゅ]への燔祭[はんさい]の祭壇[さいだん]に載[の]せなさい。それは贖罪祭[しょくざいさい]である。"
  13: "祭司[さいし]は、これらの一[ひと]つのことについて、彼[かれ]が犯[おか]した罪[つみ]のために彼のために贖[あがな]い、彼の罪は赦[ゆる]される。残[のこ]ったものは、素祭[そさい]の場合[ばあい]と同[おな]じように、祭司のものとなる。"
  14: "主[しゅ]はモーセに言[い]われた。"
  15: "「もし人[ひと]が忘[わす]れていて、主[しゅ]の聖[せい]なるものから、すなわち、聖なるものに属[ぞく]するものから、思[おも]わず罪[つみ]を犯[おか]すなら、主に、自分[じぶん]の愆祭[けんさい]⟨犯した過[あやま]ちの償[つぐな]いとして、家畜[かちく]などを献[ささ]げる祭[まつ]り。⟩として、羊[ひつじ]の群[む]れから傷[きず]のない雄羊[おすひつじ]を、銀[ぎん]のシケルによる評価[ひょうか]の額[がく]、すなわち聖なるシケルで献げなさい。それは彼[かれ]が過ちを犯したことについてである。"
  16: "そして、聖[せい]なるものから罪[つみ]を犯[おか]した分[ぶん]を償[つぐな]い、その上[うえ]に五分[ごぶ]の一[いち]を加[くわ]えて祭司[さいし]に渡[わた]しなさい。祭司は愆祭[けんさい]の雄羊[おすひつじ]によって彼[かれ]のために贖[あがな]い、彼の罪は赦[ゆる]される。"
  17: "また、人[ひと]が罪[つみ]を犯[おか]し、主[しゅ]の戒[いまし]めのうち、行[おこな]ってはならないことの一[ひと]つを行い、それを知[し]らなかったために過[あやま]ちを犯し、自分[じぶん]の罪を負[お]うなら、"
  18: "そのとき、彼[かれ]は羊[ひつじ]の群[む]れから、銀[ぎん]で評価[ひょうか]された額[がく]の、傷[きず]のない雄羊[おすひつじ]を愆祭[けんさい]として祭司[さいし]のもとに携[たずさ]えて来[き]なさい。祭司は、彼が知[し]らずに犯[おか]した無知[むち]の罪[つみ]のために彼のために贖[あがな]い、彼の罪は赦[ゆる]される。"
  19: "彼[かれ]は主[しゅ]の前[まえ]で過[あやま]ちを犯[おか]したからである。」"

notes:
  1: "ψυχὴ ἁμάρτῃ — «душа согрешит», т. е. человек; слав. «душа согрешит». φωνὴν ὁρκισμοῦ — «голос заклятия» (ὁρκισμός — клятва-заклятие); слав. «глас клятвы». μάρτυς [ἢ ἑώρακεν ἢ σύνοιδεν] — «свидетель: или видел, или знает»; квадратные скобки — знак критического издания, в переводе не передаются. λήμψεται τὴν ἁμαρτίαν — «понесёт грех»."
  2: "θνησιμαῖος — падаль, мертвечина; θηριαλωτός — растерзанный зверем; βδέλυγμα — мерзость. Греческий перечень обрывается без сказуемого (анаколуф); слав. уточняет βδελύγματα как «гнусности» и «гады», а затем добавляет «и забыв их осквернится» — это чтение Церкви, в gr-lxx-byz его нет (bracket_check: ἔλαθεν — НЕТ), поэтому в 〔…〕."
  3: "ἀπὸ ἀκαθαρσίας ἀνθρώπου — «от нечистоты человеческой»; ἧς ἂν ἁψάμενος μιανθῇ — «к которой прикоснувшись осквернится»; ἔλαθεν αὐτόν — «скрылось от него»; μετὰ τοῦτο δὲ γνῷ — «после же узнает»; πλημμελήσῃ — «провинится» (πλημμελέω)."
  4: "ὀμόσῃ διαστέλλουσα τοῖς χείλεσιν — «поклянётся, произнося устами» (διαστέλλω — различать, выговаривать); слав. «обещает устнама». κακοποιῆσαι ἢ καλῶς ποιῆσαι — «сделать зло или добро». λάθῃ αὐτὸν πρὸ ὀφθαλμῶν — «скроется от его глаз»."
  5: "ἐξαγορεύσει — «исповедует» (ἐξαγορεύω — открыто объявлять); κατ᾿ αὐτῆς — «против неё» (местоимение ж. р., вероятно, при ψυχή); слав. «противу себе»."
  6: "θῆλυ — самка; ἀμνάς — овечка; χίμαιρα ἐξ αἰγῶν — коза из коз. LXX называет жертву περὶ ἁμαρτίας (贖罪祭), Синодальный — «жертва повинности». ἐξιλάσεται — «совершит умилостивление» (ἐξιλάσκομαι)."
  7: "ἡ χεὶρ αὐτοῦ τὸ ἱκανόν — «рука его достаточна» (библейский оборот о средствах); ζεῦγος τρυγόνων — «пара горлиц»; νεοσσοὶ περιστερῶν — «птенцы голубей»; εἰς ὁλοκαύτωμα — «во всесожжение»."
  8: "ἀποκνίσει — «отщипнёт» (κνίζω — щипать); ἀπὸ τοῦ σφονδύλου — «от позвонка» (σφόνδυλος — позвонок), слав. «созади»; οὐ διελεῖ — «не разделит»."
  9: "ῥανεῖ — «покропит» (ῥαίνω); τοῖχος — стена жертвенника; καταστραγγιεῖ — «выцедит» (στραγγίζω); ἁμαρτίας γάρ ἐστιν — «ибо это жертва за грех»."
  10: "ὡς καθήκει — «как подобает» (καθήκω); τὸ δεύτερον — «вторую птицу»; формула очищения та же, что в 5:6."
  11: "εὑρίσκῃ — «найдёт»; δέκατον τοῦ οιφι — «десятая часть ефы» (οιφι — евр. эфа, несклоняемое); σεμίδαλις — пшеничная мука тонкого помола; οὐκ ἐπιχεεῖ … οὐδὲ ἐπιθήσει — «не возольёт … и не положит»; запрет елея и ливана отличает эту жертву от 素祭."
  12: "δραξάμενος … πλήρη τὴν δράκα — «взяв полную горсть» (δράξ — горсть); μνημόσυνον — «память» (часть, сожигаемая в память); θυσιαστήριον τῶν ὁλοκαυτωμάτων — «жертвенник всесожжении»; ἁμαρτία ἐστίν — «это жертва за грех»."
  13: "ἐφ᾿ ἑνὸς τούτων — «за одно из этих»; καταλειφθέν — «оставшееся»; ὡς ἡ θυσία τῆς σεμιδάλεως — «как хлебная жертва» (素祭), т. е. остаток принадлежит священнику."
  14: "Стандартная формула нового речения: ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων; λέγων по-японски отдельно не передаётся."
  15: "λάθῃ αὐτὸν λήθη — «забудется забвением» (усилительный оборот); ἀκουσίως — «невольно»; ἀπὸ τῶν ἁγίων — «от святынь», т. е. от посвящённого Богу; κριὸς ἄμωμος — овен без порока; τιμῆς ἀργυρίου σίκλων, τῷ σίκλῳ τῶν ἁγίων — «ценою серебра сиклей, по сиклю святому»; πλημμέλεια — 愆祭."
  16: "ἀποτείσαι — «пусть заплатит» (ἀποτίνω, optative); τὸ ἐπίπεμπτον — «пятая часть»; ἐν τῷ κριῷ τῆς πλημμελείας — «овном жертвы повинности»."
  17: "ποιήσῃ μίαν ἀπὸ πασῶν τῶν ἐντολῶν — «сделает одну из всех заповедей»; ὧν οὐ δεῖ ποιεῖν — «которых не должно делать»; οὐκ ἔγνω — «не знал»; λάβῃ τὴν ἁμαρτίαν — «примет грех»."
  18: "ἀγνοίας … ἠγνόησεν — «неведения … не знал» (тавтология греч.); εἰς πλημμέλειαν — «в жертву повинности»; καὶ αὐτὸς οὐκ ᾔδει — «и сам не знал»."
  19: "ἐπλημμέλησεν γὰρ πλημμέλησιν — «ибо провинился провинностью» (cognate accusative); по-русски «совершил преступление»."
