# jp-box, Псалтирь, псалом 114. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..8.
# Разбивка — славяно-синодальная (csl-ru): слав. 3 = гр. 3 + первая половина
# гр. 4, слав. 4 = вторая половина гр. 4 + гр. 5; дальше номера сдвинуты на 1
# (наш прежний 5 → 4 и т. д.); см. notes 3–4.
# Псалом 114: любовь и услышанная молитва (1–2), болезни смерти и призывание
# имени Господня (3), милость и защита Господа (3–4), возвращение души
# в покой (5–6), хождение пред Господом на земле живых (7–8).
# Красного и синего нет. Кавычки: молитва в 4 — 「…」 (первый уровень):
# псалмопевец передаёт слова, с которыми призвал имя Господне.
# 〔…〕 нет: все слова в gr-lxx-byz есть.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 陰府, 涙, 魂 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 114
draft: true

verses:
  1: "アレルヤ。わたしは主[しゅ]を愛[あい]する。主[しゅ]がわたしの願[ねが]いの声[こえ]を聞[き]いてくださるからである。"
  2: "主[しゅ]はわたしに耳[みみ]を傾[かたむ]けてくださった。だから、わたしの日[ひ]々[び]のうちに、わたしは主[しゅ]を呼[よ]び求[もと]める。"
  3: "死[し]の苦[くる]しみがわたしを包[つつ]み、陰府[よみ]の脅[おびや]かしがわたしを捉[とら]え、わたしは苦難[くなん]と悲[かな]しみに遭[あ]った。そのとき、わたしは主[しゅ]の名[な]を呼[よ]び求[もと]めて言[い]った。"
  4: "「主[しゅ]よ、わたしの魂[たましい]を救[すく]い出[だ]してください。」主[しゅ]はあわれみ深[ぶか]く、正[ただ]しく、わたしたちの神[かみ]は慈[いつ]しみ深[ぶか]い。"
  5: "主[しゅ]は幼[おさな]い者[もの]たちを守[まも]られる。わたしは弱[よわ]り果[は]てていたが、主[しゅ]はわたしを救[すく]ってくださった。"
  6: "わたしの魂[たましい]よ、あなたの安[やす]らぎのうちに帰[かえ]れ。主[しゅ]はあなたに恵[めぐ]みを施[ほどこ]されたからである。"
  7: "主[しゅ]はわたしの魂[たましい]を死[し]から、わたしの目[め]を涙[なみだ]から、わたしの足[あし]を滑[すべ]りから救[すく]い出[だ]してくださった。"
  8: "わたしは生[い]ける者[もの]の地[ち]で、主[しゅ]の前[まえ]を歩[あゆ]む。"

notes:
  1: "Αλληλουια — アレルヤ (Откр 19:1). В ру-базе и jp-joc надписание — стих 0, в gr-lxx-byz строка 0 тоже есть. В csl-ru строки 0 нет — надписание влито в ст. 1. Ἠγάπησα, ὅτι εἰσακούσεται κύριος τῆς φωνῆς τῆς δεήσεώς μου — わたしは主を愛する。主がわたしの願いの声を聞いてくださるからである (ἀγαπάω — «любить»; в Синодальном и jp-joc «радуюсь», в евр. אָהַבְתִּי «люблю», поэтому 愛する). δέησις — «прошение, моление»."
  2: "ὅτι ἔκλινεν τὸ οὖς αὐτοῦ ἐμοί — 主はわたしに耳を傾けてくださった (κλίνω — «наклонять»). καὶ ἐν ταῖς ἡμέραις μου ἐπικαλέσομαι — だから、わたしの日々のうちに、わたしは主を呼び求める (ἐν ταῖς ἡμέραις μου — «во дни мои», т. е. пока живу)."
  3: "περιέσχον με ὠδῖνες θανάτου — 死の苦しみがわたしを包み (ὠδίν — «родовые муки, боль»; περιέχω — «обхватывать»). κίνδυνοι ᾅδου εὕροσάν με — 陰府の脅かしがわたしを捉え (κίνδυνος — «опасность»; ᾅδης — 陰府[よみ]). θλῖψιν καὶ ὀδύνην εὗρον — わたしは苦難と悲しみに遭った (θλῖψις — «теснота, скорбь»; ὀδύνη — «боль»). καὶ τὸ ὄνομα κυρίου ἐπεκαλεσάμην — そのとき、わたしは主の名を呼び求めて言った. Слав. ст. 3 = гр. 3 + первая половина гр. 4."
  4: "Слав. ст. 4 = вторая половина гр. 4 + гр. 5. Ὦ κύριε, ῥῦσαι τὴν ψυχήν μου — 主よ、わたしの魂を救い出してください (ῥύομαι — «избавлять»; ψυχή — 魂[たましい]). Слова молитвы — 「…」, первый уровень: это переданная речь псалмопевца. ἐλεήμων ὁ κύριος καὶ δίκαιος — 主はあわれみ深く、正しく (ἐλεήμων — «милостивый»). καὶ ὁ θεὸς ἡμῶν ἐλεᾷ — わたしたちの神は慈しみ深い (ἐλεάω — «миловать, щадить»; наст. вр. ἐλεᾷ передано именным сказуемым 慈しみ深い)."
  5: "φυλάσσων τὰ νήπια ὁ κύριος — 主は幼い者たちを守られる (φυλάσσω — «хранить»; νήπιος — «младенец, простодушный»; в Синодальном «простодушных», у jp-joc 朴直なる者). ἐταπεινώθην, καὶ ἔσωσέν με — わたしは弱り果てていたが、主はわたしを救ってくださった (ταπεινόω — «умалять, приводить в низкое состояние»)."
  6: "ἐπίστρεψον, ἡ ψυχή μου, εἰς τὴν ἀνάπαυσίν σου — わたしの魂よ、あなたの安らぎのうちに帰れ (ἀνάπαυσις — «покой»; обращение к своей душе, поэтому あなた). ὅτι κύριος εὐηργέτησέν σε — 主はあなたに恵みを施されたからである (εὐεργετέω — «благодетельствовать»)."
  7: "ὅτι ἐξείλατο τὴν ψυχήν μου ἐκ θανάτου — 主はわたしの魂を死から…救い出してくださった (ἐξαιρέω — «изымать, избавлять»). τοὺς ὀφθαλμούς μου ἀπὸ δακρύων — わたしの目を涙から (δάκρυον — 涙[なみだ]). τοὺς πόδας μου ἀπὸ ὀλισθήματος — わたしの足を滑りから (ὀλίσθημα — «скольжение, падение»). Три члена сохранены."
  8: "εὐαρεστήσω ἐναντίον κυρίου ἐν χώρᾳ ζώντων — わたしは生ける者の地で、主の前を歩む (εὐαρεστέω — «быть угодным»; Синодальный и jp-joc передают «буду ходить», ср. Пс 55:14). В ру-базе, jp-joc и csl-ru этот стих присоединён к ст. 8; в gr-lxx-byz он был отдельным стихом 9."
