  18: "また、この乳[ちち]から作[つく]ったチーズ十個[じゅっこ]を取[と]って、千人[せんにん]の長[ちょう]に渡[わた]しなさい。兄[あに]たちが無事[ぶじ]かどうかを尋[たず]ね、彼[かれ]らに何[なに]が要[い]るかを知[し]って来[き]なさい。"
