# jp-box, 1-я Царств, глава 17. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 17: два стана у Сокхофа (1–3), Голиаф и его вооружение (4–11), Давид приходит
# к братьям (12–31 — этого отдела в LXX нет), Давид перед Саулом (32–37), доспехи
# Саула (38–39), пять камней (40), единоборство и победа (41–54), Саул спрашивает
# Авенира, чей сын Давид (55–58).
# Речь — 「…」: Голиаф (8–10, 43–44), Давид (26, 28–29, 32, 34–37, 45–47, 58),
# Саул (33, 37, 55, 56, 58), Авенир (55), народ (25, 27, 30), Елиав (28). Вложенной
# речи нет. Красного нет.
# Нумерация главы — по славяно-синодальной (решение автора): 58 стихов, как в csl-ru
# и ru. Наш 17:1–54 = csl 17:1–54; стихи 55–58 (Саул спрашивает Авенира, чей сын
# Давид) есть у слав. и в МТ, но в LXX и в гр-модуле отсутствуют — переведены по
# csl (без 〔…〕), см. notes 55–58.
# На месте 17:12–31, 41 и 50 в gr-lxx-byz стоит «.» — это лакуна LXX: там, где у МТ
# рассказ о хлебе для братьев и о том, что Давид одолел без меча. Эти 22 стиха
# переведены по csl-ru и входят в основной текст без 〔…〕.
# Слав. добавления в стихах с греческим текстом (17:48 — «Давид поспешил и побежал»,
# 17:51 — «извлек меч из ножен») в текст не внесены, отмечены в notes.
# Сносок ⟨…⟩ нет: ペリシテ人, ゴリアト, 契約の箱, 竪琴, 王, 巨人 уже в корпусе.
# jp-ni не использовался.

