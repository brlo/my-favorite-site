  20: "ダビデは朝早[あさはや]く起[お]き、羊[ひつじ]を番人[ばんにん]に委[ゆだ]ね、荷[に]を取[と]って、父[ちち]エッサイが命[めい]じたとおりに出[で]かけた。そして、強[つよ]い者[もの]たちが戦[いくさ]に出[で]て行[い]き、陣[じん]の中[なか]で叫[さけ]んでいる場所[ばしょ]に来[き]た。"
  21: "イスラエルはペリシテ人[じん]に向[む]かって武具[ぶぐ]を整[ととの]え、ペリシテ人[じん]もイスラエルに向[む]かって武具[ぶぐ]を整[ととの]えていた。"
  22: "ダビデは自分[じぶん]の荷[に]を荷物[にもつ]の番人[ばんにん]に預[あず]け、陣[じん]へ走[はし]って行[い]き、兄[あに]たちの無事[ぶじ]を尋[たず]ねた。"
  23: "彼[かれ]が兄[あに]たちと話[はな]していると、見[み]よ、名[な]をゴリアトというガトのペリシテ人[じん]が、ペリシテ人[じん]の戦列[せんれつ]から出[で]て来[き]て、この同[おな]じ言葉[ことば]を語[かた]った。ダビデはそれを聞[き]いた。"
  24: "イスラエルの人[ひと]々[びと]はみな、この人[ひと]を見[み]ると、彼[かれ]の前[まえ]から逃[に]げ、ひどく恐[おそ]れた。"
  25: "イスラエルの人[ひと]々[びと]は言[い]った。「この上[のぼ]って来[き]た人[ひと]を見[み]たか。イスラエルを辱[はずかし]めるために来[き]たのだ。もし彼[かれ]を殺[ころ]す者[もの]があれば、王[おう]はその者[もの]を大[おお]きな富[とみ]で富[と]ませ、自分[じぶん]の娘[むすめ]を与[あた]え、その父[ちち]の家[いえ]をイスラエルの中[なか]で自由[じゆう]のものとするであろう。」"
