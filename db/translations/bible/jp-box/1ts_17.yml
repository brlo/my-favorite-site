verses:
  1: "ペリシテ人[じん]は戦[いくさ]のために自分[じぶん]たちの軍[ぐん]を集[あつ]め、ユダのソコホに集[あつ]まって、ソコホとアゼカの間[あいだ]、エフェルメムに陣[じん]を敷[し]いた。"
  2: "サウルとイスラエルの人[ひと]々[びと]も集[あつ]まって谷[たに]に陣[じん]を敷[し]き、ペリシテ人[じん]に向[む]かい合[あ]って戦列[せんれつ]を整[ととの]えた。"
