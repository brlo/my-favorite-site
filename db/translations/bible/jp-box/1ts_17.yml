  4: "ペリシテ人[じん]の戦列[せんれつ]から、力[ちから]ある者[もの]が一人[ひとり]出[で]て来[き]た。名[な]はゴリアト、ガトの出[で]である。その背[せ]の高[たか]さは四[よん]キュビトと一[ひと]スパンであった。"
  5: "頭[あたま]には兜[かぶと]があり、体[からだ]には鎖[くさり]の鎧[よろい]を着[き]ていた。その鎧[よろい]の重[おも]さは青銅[せいどう]と鉄[てつ]の五千シケルであった。"
  6: "脚[あし]には青銅[せいどう]のすね当[あ]てを着[つ]け、肩[かた]の間[あいだ]には青銅[せいどう]の盾[たて]を負[お]っていた。"
  7: "その槍[やり]の柄[え]は織[お]る者[もの]の機[はた]の巻[ま]き棒[ぼう]のようであり、槍[やり]の穂[ほ]は鉄[てつ]の六百シケルであった。武具[ぶぐ]を運[はこ]ぶ者[もの]が彼[かれ]の前[まえ]を進[すす]んだ。"
  8: "彼[かれ]は立[た]って、イスラエルの戦列[せんれつ]に向[む]かって叫[さけ]び、彼[かれ]らに言[い]った。「なぜ戦[いくさ]のために出[で]て来[き]て、わたしたちと向[む]かい合[あ]おうとするのか。わたしはペリシテ人[じん]、おまえたちはサウルのヘブライ人[じん]ではないか。自分[じぶん]たちのために一人[ひとり]の男[おとこ]を選[えら]び、わたしのところへ下[お]りて来[こ]させよ。"
  9: "もし彼[かれ]がわたしと戦[たたか]うことができ、わたしを打[う]ち倒[たお]すなら、わたしたちはおまえたちの奴隷[どれい]になる。しかし、もしわたしが彼[かれ]に勝[か]って彼[かれ]を打[う]ち倒[たお]すなら、おまえたちはわたしたちの奴隷[どれい]となり、わたしたちに仕[つか]えることになる。」"
  10: "ペリシテ人[じん]は言[い]った。「見[み]よ、わたしは今日[きょう]この日[ひ]、イスラエルの戦列[せんれつ]を辱[はずかし]めた。わたしに一人[ひとり]の男[おとこ]を与[あた]えよ。二人[ふたり]で戦[たたか]おう。」"
  11: "サウルとイスラエルすべての者[もの]は、このペリシテ人[じん]の言葉[ことば]を聞[き]いて、驚[おどろ]き、ひどく恐[おそ]れた。"
  12: "ダビデはユダのベツレヘムのエフラテ人[じん]の子[こ]であった。その父[ちち]の名[な]はエッサイといい、八人[はちにん]の息子[むすこ]があった。サウルの時代[じだい]に、この人[ひと]は年老[としお]いて、人[ひと]々[びと]の間[あいだ]で年[とし]を重[かさ]ねた者[もの]となっていた。"
  13: "エッサイの三人[さんにん]の年長[ねんちょう]の息子[むすこ]たちはサウルとともに戦[いくさ]に出[で]た。戦[いくさ]に出[で]た息子[むすこ]たちの名[な]は、長男[ちょうなん]エリアブ、次[つぎ]がアミナダブ、三男[さんなん]がサマであった。"
