  58: "サウルは彼[かれ]に言[い]った。「若者[わかもの]よ、おまえはだれの子[こ]か。」ダビデは言[い]った。「あなたのしもべ、ベツレヘムのエッサイの子[こ]だ。」"

notes:
  1: "συνάγουσιν ... τὰς παρεμβολὰς αὐτῶν εἰς πόλεμον — собирают свои ополчения на войну (παρεμβολή — стан, ополчение). εἰς Σοκχωθ τῆς Ιουδαίας — в Сокхоф Иудейский (ソコホ). ἀνὰ μέσον Σοκχωθ καὶ ἀνὰ μέσον Αζηκα — между Сокхофом и Азеком (アゼカ). ἐν Εφερμεμ — в Ефермеме (エフェルメム; слав. «во Афесдоммине», ru «в Ефес-Даммиме» — иное чтение и транслитерация)."
  2: "ἐν τῇ κοιλάδι — в долине; слав. добавляет «теревинфа» (дуба) — этого слова в gr нет, поэтому просто 谷. παρατάσσονται εἰς πόλεμον ἐξ ἐναντίας ἀλλοφύλων — выстраиваются на войну против филистимлян (παρατάσσω — 戦列を整える)."
  3: "ἵστανται ἐπὶ τοῦ ὄρους ἐνταῦθα ... ἐνταῦθα — стоят на горе здесь... там, то есть по одну и другую сторону. αὐλών — ущелье, долина между станами (в 2 κοιλάς)."
  4: "ἀνὴρ δυνατός — муж сильный (не γίγας; «единоборец» — уже толкование ru). Γολιαθ ἐκ Γεθ — Голиаф из Гефа (ガト). ὕψος αὐτοῦ τεσσάρων πήχεων καὶ σπιθαμῆς — рост четыре локтя и пядь; в МТ и слав. «шесть лакот и пядь», у LXX меньше — держимся gr, отличие отмечено. πῆχυς — キュビト, σπιθαμή — スパン."
  5: "περικεφαλαία — шлем (兜; слав. «медян» — в gr меди при шлеме нет). θώραξ ἁλυσιδωτός — кольчатая, чешуйчатая броня (鎖の鎧, ἅλυσις — цепь). σταθμὸς τοῦ θώρακος — вес брони. πέντε χιλιάδες σίκλων χαλκοῦ καὶ σιδήρου — пять тысяч сиклей меди и железа."
  6: "κνημῖδες χαλκαῖ — медные наколенники, поножи (すね当て). ἀσπὶς χαλκῆ ἀνὰ μέσον τῶν ὤμων αὐτοῦ — медный щит между плечами, то есть за спиной."
  7: "κοντός — древко копья (柄). ὡσεὶ μέσακλον ὑφαινόντων — как навой ткачей (μέσακλον — брус, валик ткацкого станка). λόγχη — наконечник, остриё (穂). ἑξακοσίων σίκλων σιδήρου — шестьсот сиклей железа. ὁ αἴρων τὰ ὅπλα — оруженосец (武具を運ぶ者)."
  8: "ἀνεβόησεν εἰς τὴν παράταξιν — возопил к строю. τί ἐκπορεύεσθε παρατάξασθαι πολέμῳ — зачем вы вышли строиться на войну. οὐκ ἐγώ εἰμι ἀλλόφυλος καὶ ὑμεῖς Εβραῖοι τοῦ Σαουλ — «не я ли филистимлянин, а вы евреи Сауловы»; слав. «еврее сауловы», ru «рабы Сауловы» — в тексте буквально サウルのヘブライ人. ἐκλέξασθε ἑαυτοῖς ἄνδρα — выберите себе мужа."
  9: "ἐὰν δυνηθῇ πρός με πολεμῆσαι — если сможет со мной воевать. πατάξῃ με — поразит меня. ἐσόμεθα ὑμῖν εἰς δούλους — будем вам рабами. δουλεύσετε ἡμῖν — будете служить нам."
  10: "ὠνείδισα τὴν παράταξιν Ισραηλ — я посрамил строй Израиля. δότε μοι ἄνδρα — дайте мне мужа. μονομαχήσομεν ἀμφότεροι — сразимся вдвоём (μονομαχέω — единоборствовать; слав. «поборется со мною един»)."
  11: "ἐξέστησαν — пришли в смятение, изумились (ἐξίστημι, слав. «ужасошася»). ἐφοβήθησαν σφόδρα — устрашились весьма."
  12: "На месте стиха в gr-lxx-byz стоит «.» — в LXX (B) отдела 17:12–31 нет; это масоретский рассказ о том, как Давид принёс братьям хлеб. Стих переведён по csl-ru и целиком стоит в …. ἐφραθαῖος — ефрафянин (エフラテ人); ὀκτὼ υἱοί — восемь сыновей; «состареся в мужех» — состарился среди мужей."
  13: "На месте стиха «.» — в LXX нет. Три старших сына пошли на войну с Саулом: Ελιαβ (エリアブ), Αμιναδαβ (アミナダブ), Σαμμα (サマ). Перевод по csl."
  14: "На месте стиха «.» — в LXX нет. Давид был младшим (νεώτερος); трое старших пошли вслед Саула."
  15: "На месте стиха «.» — в LXX нет. Давид возвратился от Саула пасти овец отца в Вифлееме."
  16: "На месте стиха «.» — в LXX нет. Филистимлянин выходил утром и вечером и показывался сорок дней."
  17: "На месте стиха «.» — в LXX нет. Ἰεσσαι посылает Давида: мера ефы муки (εφι — эфа, エファ), десять хлебов, отнести в стан братьям. Перевод по csl."
  18: "На месте стиха «.» — в LXX нет. Десять сыров от молока — тысяченачальнику (χιλίαρχος, 千人の長). «Посети братию в мире» — справься о благополучии. Завершающее слав. «субботствовати же будеши со мною» тёмное (вероятно, порча текста; ru иначе: «узнай о нуждах их»), в перевод не внесено — в тексте только «узнай, что им нужно»."
  19: "На месте стиха «.» — в LXX нет. Саул и весь народ стояли в долине дуба (удоли дуба, 樫の木の谷) и воевали с филистимлянами."
  20: "На месте стиха «.» — в LXX нет. Давид встал рано, оставил овец со стражей, взял ношу и пошёл, как велел отец; пришёл к месту, где сильные выстраивались на войну и кричали в стане."
  21: "На месте стиха «.» — в LXX нет. Израиль и филистимляне строились друг против друга (вооружахуся)."
  22: "На месте стиха «.» — в LXX нет. Давид оставил ношу у сторожа, побежал в стан и спросил братьев о мире."
  23: "На месте стиха «.» — в LXX нет. Голиаф вышел из строя и говорил те же слова; Давид услышал. Слав. «муж месейский» — тёмное слово, передано описательно (ガトのペリシテ人)."
  24: "На месте стиха «.» — в LXX нет. Все израильтяне, увидев этого человека, побежали от него и сильно испугались."
  25: "На месте стиха «.» — в LXX нет. Обещание царя: обогатить убившего, дать дочь, сделать дом отца «свободным» — то есть свободным от повинностей (в тексте 自由のもの)."
  26: "На месте стиха «.» — в LXX нет. Давид спрашивает, что сделают убившему; «кто этот необрезанный, что поносит строй Бога живого» (ἀπερίτμητος — 割礼を受けていない)."
  27: "На месте стиха «.» — в LXX нет. Народ отвечает теми же словами."
  28: "На месте стиха «.» — в LXX нет. Елиав гневается: зачем пришёл, на кого оставил овец, «знаю гордость твою и злобу сердца твоего»."
  29: "На месте стиха «.» — в LXX нет. «Что я сделал? не слова ли это?»"
  30: "На месте стиха «.» — в LXX нет. Давид повторяет вопрос другим; народ отвечает как прежде."
  31: "На месте стиха «.» — в LXX нет. Слова Давида пересказали Саулу, и его привели к царю."
  32: "Μὴ δὴ συμπεσέτω ἡ καρδία τοῦ κυρίου μου ἐπ᾿ αὐτόν — да не падёт, не упадёт духом сердце господина моего (συμπίπτω; слав. «да не ужасается»). ὁ δοῦλός σου πορεύσεται — раб твой пойдёт."
  33: "Οὐ μὴ δυνήσῃ — не сможешь (усиленное отрицание). παιδάριον εἶ σύ — ты отрок. ἀνὴρ πολεμιστὴς ἐκ νεότητος αὐτοῦ — муж воинственный от юности своей."
  34: "Ποιμαίνων ἦν — пас (перифрастическое прошедшее). λέων καὶ ἄρκος — лев и медведица (ἄρκτος). ἐλάμβανεν πρόβατον ἐκ τῆς ἀγέλης — брал овцу из стада. Стих обрывается на «и когда», продолжение в 35."
  35: "ἐξεπορευόμην ὀπίσω αὐτοῦ — выходил за ним. ἐξέσπασα ἐκ τοῦ στόματος αὐτοῦ — исторгал из пасти его. ἐκράτησα τοῦ φάρυγγος — брал за горло (φάρυγξ). ἐθανάτωσα — умертвил. Слав. вставляет «взятое» — пояснение переводчика."
  36: "ἔτυπτεν — бил (τύπτω). οὐχὶ πορεύσομαι ...; — не пойду ли...? ἀφελῶ ὄνειδος — сниму поношение. ὠνείδισεν παράταξιν θεοῦ ζῶντος — поносил строй Бога живого. Слав. «яко един от сих» — как один из них."
  37: "ἐξείλατό με — избавил меня (ἐξαιρέω). αὐτὸς ἐξελείταί με — Он избавит меня. Πορεύου, καὶ ἔσται κύριος μετὰ σοῦ — иди, и Господь будет с тобой."
  38: "ἐνέδυσεν ... μανδύαν — одел в плащ (μανδύας, 上着). περικεφαλαία χαλκῆ — медный шлем. Слав. и ru добавляют броню («и наложи на него броню»), в gr этого нет — в текст не внесено."
  39: "ἔζωσεν ... τὴν ῥομφαίαν ἐπάνω τοῦ μανδύου — препоясал мечом поверх плаща. ἐκοπίασεν περιπατήσας ἅπαξ καὶ δίς — утомился, походив раз и два. οὐ πεπείραμαι — не испытал, не привык (πειράω). ἀφαιροῦσιν — снимают."
  40: "βακτηρία — посох (杖). λίθους λείους — гладкие камни. χείμαρρος — поток, ручей. κάδιον ποιμενικόν ... εἰς συλλογήν — пастушеская сумка для сбора. σφενδόνη — праща (石投げ)."
  41: "На месте стиха «.» — в LXX нет: выход Голиафа к Давиду и оруженосец впереди него. Перевод по csl, целиком в …."
  42: "ἠτίμασεν — обесчестил, презрел (ἀτιμάζω). παιδάριον — отрок. πυρράκης μετὰ κάλλους ὀφθαλμῶν — рыжеватый, с красивыми глазами (слав. «чермен и леп очима»); πυρράκης — 赤ら顔."
  43: "Ὡσεὶ κύων ἐγώ εἰμι, ὅτι σὺ ἔρχῃ ἐπ᾿ ἐμὲ ἐν ῥάβδῳ καὶ λίθοις — разве я собака, что ты идёшь на меня с палкой и камнями. Οὐχί, ἀλλ᾿ ἢ χείρω κυνός — нет, но хуже собаки. κατηράσατο ... ἐν τοῖς θεοῖς αὐτοῦ — проклял его своими богами."
  44: "Δεῦρο πρός με — иди ко мне. τοῖς πετεινοῖς τοῦ οὐρανοῦ καὶ τοῖς κτήνεσιν τῆς γῆς — птицам небесным и зверям земным (κτῆνος — скот, зверь)."
  45: "ἐν ῥομφαίᾳ καὶ ἐν δόρατι καὶ ἐν ἀσπίδι — мечом, копьём и щитом. ἐν ὀνόματι κυρίου σαβαωθ — именем Господа Саваофа; передано 万軍の主, как в корпусе (транслитерации サバオト нет). θεοῦ παρατάξεως Ισραηλ — Бога строя, воинства Израилева."
  46: "ἀποκλείσει σε κύριος — заключит, предаст тебя Господь (ἀποκλείω). ἀφελῶ τὴν κεφαλήν σου ἀπὸ σοῦ — сниму голову твою с тебя. κῶλα — члены, трупы (κῶλον). παρεμβολῆς ἀλλοφύλων — стана филистимского. γνώσεται πᾶσα ἡ γῆ — узнает вся земля."
  47: "ἐκκλησία — собрание (集い), слав. «сонм». οὐκ ἐν ῥομφαίᾳ καὶ δόρατι σῴζει κύριος — не мечом и копьём спасает Господь. τοῦ κυρίου ὁ πόλεμος — Господня война. παραδώσει ... εἰς χεῖρας ἡμῶν — предаст в руки наши."
  48: "ἀνέστη ... καὶ ἐπορεύθη εἰς συνάντησιν Δαυιδ — встал и пошёл навстречу Давиду. Слав. и ru добавляют вторую половину («Давид поспешил и побежал навстречу»): это МТ, в gr её нет — в текст не внесено."
  49: "ἐξέτεινεν τὴν χεῖρα εἰς τὸ κάδιον — простёр руку к сумке. ἐσφενδόνησεν — бросил из пращи (σφενδονάω). ἐπὶ τὸ μέτωπον — в лоб (μέτωπον). διέδυ διὰ τῆς περικεφαλαίας — прошёл сквозь шлем (διαδύω). Слав. вставляет «и вложи в пращу» и «(Голиаф)» — пояснения переводчика."
  50: "На месте стиха «.» — в LXX нет: Давид одолел пращой и камнем, а меча в руке его не было. Перевод по csl, целиком в …. В МТ это 17:50."
  51: "ἔδραμεν ... ἐπέστη ἐπ᾿ αὐτόν — подбежал и стал над ним. ἔλαβεν τὴν ῥομφαίαν — взял меч его. ἀφεῖλεν τὴν κεφαλήν — снял, отсёк голову. ὁ δυνατὸς αὐτῶν — силач их. Слав. добавляет «извлече его от недр его» (вынул из ножен) — в gr нет."
  52: "ἠλάλαξαν — воскликнули (ἀλαλάζω). ἕως εἰσόδου Γεθ — до входа Гефского (ガト), ἕως τῆς πύλης Ἀσκαλῶνος — до врат Аскалона (アシュケロン); Ακκαρων — Аккарон (エクロン, слав. «аккарон»). τραυματίαι — поражённые, раненые. Слав. вставляет «мнози» — в gr нет."
  53: "ἀνέστρεψαν ... ἐκκλίνοντες ὀπίσω τῶν ἀλλοφύλων — возвратились, уклонившись от погони за филистимлянами. κατεπάτουν τὰς παρεμβολὰς αὐτῶν — попирали, разоряли станы их."
  54: "τὰ σκεύη αὐτοῦ — вещи, доспехи его (σκεῦος; в тексте 武具 по контексту, слав. «оружие»). εἰς Ιερουσαλημ — в Иерусалим. ἐν τῷ σκηνώματι αὐτοῦ — в шатре, скинии его (天幕)."
  55: "Стих есть в слав. и в МТ (17:55), в LXX и в гр-модуле его нет (после 17:54 сразу 18:1) — под славяно-синодальной нумерацией добавлен, переведён по csl. «князю силы» — военачальнику (軍の長, как 14:50; Αβεννηρ — アベネル, как 14:50; 20:25; 26). «чий есть сын юноша сей» — «чей сын этот юноша». «да живет душа твоя, царю» — клятвенная формула, передана あなたの魂にかけて (как 1:26; ср. 25:26). «яко не вем» — «ибо не знаю». В МТ (и в слав.) отдел стоит после победы, хотя Давид уже говорил с Саулом в 17:32–37, — известное затруднение порядка; в LXX отдела нет вовсе."
  56: "В слав. и в МТ (17:56), в LXX нет. «вопроси убо ты» — «спроси же ты»: Саул поручает Авениру узнать род Давида (в слав. нет «сказал» — 王は言った по смыслу)."
  57: "В слав. и в МТ (17:57), в LXX нет. «взя его авенир и приведе его пред саула» — Авенир взял его и привёл к Саулу. «глава же иноплеменнича бе в руце его» — голова филистимлянина была в его руке (ср. 17:54, где Давид несёт её в Иерусалим)."
  58: "В слав. и в МТ (17:58), в LXX нет. «чий еси сын, юноше?» — «чей ты сын, юноша?». Ответ: «сын раба твоего иессеа от вифлеема» — сын раба твоего Иессея из Вифлеема (エッサイ, как 17:12); с этого ответа начинается 18:1 («когда он перестал говорить с Саулом»)."
