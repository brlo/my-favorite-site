  40: "シメイは立[た]ち、自分[じぶん]のロバに鞍[くら]を置[お]いて、しもべたちを捜[さが]しにガトのアンクスのもとへ行[い]った。シメイは行[い]って、ガトからしもべたちを連[つ]れて帰[かえ]った。"
  41: "ソロモンに告[つ]げる者[もの]があり、言[い]った。「シメイはエルサレムからガトへ行[い]き、しもべたちを連[つ]れて帰[かえ]った。」"
  42: "王[おう]は人[ひと]を遣[つか]わしてシメイを呼[よ]び、彼[かれ]に言[い]った。「わたしは主[しゅ]によってあなたに誓[ちか]わせ、あなたに証言[しょうげん]して、『エルサレムから出[で]て、右[みぎ]へでも左[ひだり]へでも行[い]く日[ひ]には、必[かなら]ず死[し]ぬことを知[し]らなければならない』と言[い]ったではないか。あなたはわたしに『その言葉[ことば]は良[よ]い』と言[い]った。"
  43: "それなのに、なぜ、主[しゅ]への誓[ちかい]と、わたしがあなたに命[めい]じた戒[いまし]めを守[まも]らなかったのか。"
  44: "あなたは、自分[じぶん]の心[こころ]が知[し]っているすべての悪[あく]、あなたがわたしの父[ちち]ダビデにしたことを知[し]っている。主[しゅ]はあなたの悪[あく]をあなたの頭[あたま]に返[かえ]された。"
  45: "ソロモン王[おう]はほめたたえられ、ダビデの王座[おうざ]は主[しゅ]の前[まえ]に永遠[えいえん]に固[かた]く据[す]えられる。」"
  46: "ソロモン王[おう]はヨヤダの子[こ]ベナヤに命[めい]じた。彼[かれ]は出[で]て行[い]ってシメイを殺[ころ]し、シメイは死[し]んだ。ソロモン王[おう]はきわめて聡[そう]明[めい]で賢[かしこ]く、ユダとイスラエルは海辺[うみべ]の砂[すな]のように非常[ひじょう]に多[おお]く、食[た]べ、飲[の]み、喜[よろこ]んでいた。ソロモンはすべての王国[おうこく]の上[うえ]に君臨[くんりん]し、彼[かれ]の命[いのち]のすべての日[ひ]の間[あいだ]、人[ひと]々[びと]は贈[おく]り物[もの]を携[たずさ]えて来[き]て、ソロモンに仕[つか]えた。ソロモンはレバノンの領地[りょうち]を開[ひら]き始[はじ]め、荒野[こうや]にテルメルを建[た]てた。ソロモンの食卓[しょくたく]の備[そな]えは次のとおりだった。すなわち、上[じょう]等[とう]の小麦粉[こむぎこ]三十[さんじゅう]コル、ひいた小麦粉[こむぎこ]六十[ろくじゅう]コル、えり抜[ぬ]きの子牛[こうし]十[じゅう]頭[とう]、牧[まき]場[ば]の牛[うし]二十[にじゅう]頭[とう]、羊[ひつじ]百[ひゃく]頭[とう]、そのほかに鹿[しか]、かもしか、えり抜[ぬ]きの鳥[とり]がいた。彼[かれ]は川[かわ]の向[む]こう側[がわ]のすべての地[ち]を、ラフィからガザまで治[おさ]め、川[かわ]の向[む]こう側[がわ]のすべての王[おう]たちの上[うえ]にいたからだ。彼[かれ]の周[まわ]りのすべての方面[ほうめん]に平和[へいわ]があり、ユダとイスラエルは、ダンからベエル・シェバに至[いた]るまで、ソロモンのすべての日[ひ]の間[あいだ]、おのおの自分[じぶん]のぶどうの木[き]と、自分[じぶん]のいちじくの木[き]の下[した]に安[あん]心[しん]して住[す]み、食[た]べ、飲[の]んだ。ソロモンの長[ちょう]たちは次のとおりである。祭司[さいし]サドクの子[こ]アザリヤ、ナタンの子[こ]オルニウ（置[お]かれた者[もの]たちの長[ちょう]）、自分[じぶん]の家[いえ]の上[うえ]にいるエドラム、書記[しょき]スバ、アヒタラムの子[こ]バサ（記[き]録[ろく]する者[もの]）、ヨアブの子[こ]アビ（軍[ぐん]の長[ちょう]）、エドライの子[こ]アヒレ（荷[に]を運[はこ]ぶ者[もの]の上[うえ]にいる者[もの]）、ヨヤダの子[こ]ベナヤ（宮殿[きゅうでん]とれんが作[づく]りの上[うえ]にいる者[もの]）、ナタンの子[こ]ザクル（顧問[こもん]）。ソロモンには戦車[せんしゃ]のための馬[うま]四万[よんまん]頭[とう]と、騎兵[きへい]一万二千[いちまんにせん]人[にん]がいた。彼[かれ]は川[かわ]からペリシテ人[じん]の地[ち]、エジプトの境[さかい]に至[いた]るまでのすべての王[おう]たちの上[うえ]にいた。ソロモン、ダビデの子[こ]は、エルサレムでイスラエルとユダの王[おう]として治[おさ]めた。"

notes:
  1: "ἤγγισαν αἱ ἡμέραι Δαυιδ ἀποθανεῖν αὐτόν — приблизились дни Давида, чтобы умереть ему; ἐνετείλατο — заповедал (ἐντέλλομαι); λέγων — «говоря»: прямая речь начинается со ст. 2."
  2: "Ἐγώ εἰμι πορεύομαι ἐν ὁδῷ πάσης τῆς γῆς — «я иду путём всей земли» (ἐγώ εἰμι + прич.; общий удел смертных); ἰσχύσεις — будешь крепок; ἔσῃ εἰς ἄνδρα — будешь мужем. Слав. «буди муж совершен» — добавление «совершен» (из МТ); внесено в основной текст без скобок."
  3: "φυλακὴν κυρίου — «стражу Господню» (φυλακή — соблюдение); слав. (как и Синод.) «завет», поэтому 契約. ἐντολάς, δικαιώματα, κρίματα — заповеди, оправдания, суды; слав. добавляет «свидения его» (из МТ) — 証. γεγραμμένα ἐν νόμῳ Μωυσέως — написанные в законе Моисея; ἵνα συνῇς — чтобы разумел."
  4: "στήσῃ κύριος τὸν λόγον αὐτοῦ — поставит, исполнит Господь слово Своё (ἵστημι); ἐλάλησεν λέγων — сказал, говоря; ἐὰν φυλάξωσιν οἱ υἱοί σου τὴν ὁδὸν αὐτῶν — если сохранят сыны твои путь свой; ἐν ἀληθείᾳ — в истине; οὐκ ἐξολεθρευθήσεται — не истребится (ἐξολεθρεύω); ἀνὴρ ἐπάνωθεν θρόνου — муж от престола."
  5: "καί γε σύ — «и ты»; ἔγνως — знаешь (аорист γινώσκω); ὅσα ἐποίησέν μοι — что сделал мне; ἀπέκτεινεν — убил; ἔταξεν τὰ αἵματα πολέμου ἐν εἰρήνῃ — «положил крови войны в мире», т. е. пролил бранную кровь в мирное время; ἄθωον — невинную (ἀθῷος); ζώνη — пояс; ὀσφύς — чресла; ὑπόδημα — обувь."
  6: "ποιήσεις κατὰ τὴν σοφίαν σου — поступи по мудрости твоей; οὐ κατάξεις τὴν πολιὰν αὐτοῦ ἐν εἰρήνῃ εἰς ᾅδου — не низведёшь седину его в мире в ад (κατάγω, πολιά, ᾅδης — 陰府)."
  7: "υἱοῖς Βερζελλι τοῦ Γαλααδίτου — сынам Верзеллия Галаадитянина; ποιήσεις ἔλεος — окажи милость; ἔσονται ἐν τοῖς ἐσθίουσιν τὴν τράπεζάν σου — будут среди едящих трапезу твою; ἀποδιδράσκειν — убегать (ἀποδιδράσκω); ἤγγισάν μοι — приблизились ко мне."
  8: "Σεμει υἱὸς Γηρα — Семей, сын Геры; ἐκ Βαουριμ — из Бахурима; κατηράσατό με κατάραν ὀδυνηράν — проклял меня проклятием болезненным; εἰς Παρεμβολάς — в Маханаим («Станы», Παρεμβολαί); κατέβη εἰς ἀπάντησίν μου — вышел навстречу мне; ὤμοσα αὐτῷ ἐν κυρίῳ — поклялся ему Господом; Εἰ θανατώσω σε — «если умерщвлю тебя» (формула клятвы)."
  9: "οὐ μὴ ἀθῳώσῃς αὐτὸν — не оставь его безнаказанным (ἀθῳόω); ἀνὴρ σοφὸς εἶ σύ — муж мудрый ты; γνώσῃ ἃ ποιήσεις αὐτῷ — узнаешь, что сделаешь ему; κατάξεις τὴν πολιὰν αὐτοῦ ἐν αἵματι εἰς ᾅδου — низведёшь седину его в крови в ад."
  10: "ἐκοιμήθη μετὰ τῶν πατέρων αὐτοῦ — почил с отцами своими (κοιμάω, эвфемизм); ἐτάφη ἐν πόλει Δαυιδ — погребён в городе Давида."
  11: "τεσσαράκοντα ἔτη — сорок лет; ἐν Χεβρων ἔτη ἑπτὰ καὶ ἐν Ιερουσαλημ τριάκοντα τρία — в Хевроне семь лет и в Иерусалиме тридцать три года (7 + 33 = 40)."
  12: "ἐκάθισεν ἐπὶ τοῦ θρόνου Δαυιδ — сел на престол Давида; υἱὸς ἐτῶν δώδεκα — сын двенадцати лет (есть в LXX и слав.; в МТ и Синод. этого нет, ср. 3:7 «отрок малый»); ἡτοιμάσθη ἡ βασιλεία — уготовалось царство (ἑτοιμάζω); σφόδρα — весьма."
  13: "προσεκύνησεν αὐτῇ — поклонился ей; Εἰρήνη ἡ εἴσοδός σου — «мир ли вход твой» (вопрос); Εἰρήνη — мир (ответ). 無事 — мирный, благополучный."
  14: "λόγος μοι πρὸς σέ — «слово мне к тебе» (есть дело); Λάλησον — говори (импер. λαλέω)."
  15: "ἐμοὶ ἦν ἡ βασιλεία — мне принадлежало царство; ἐπ᾽ ἐμὲ ἔθετο ... τὸ πρόσωπον αὐτοῦ — на меня положил лицо своё (обращал взоры); ἐστράφη — обратилось (στρέφω); παρὰ κυρίου ἐγένετο αὐτῷ — от Господа было ему."
  16: "αἴτησιν μίαν — прошение одно; μὴ ἀποστρέψῃς τὸ πρόσωπόν σου — не отврати лица твоего; Λάλει — говори."
  17: "εἰπὸν δή — скажи же (импер. + δή); ὅτι οὐκ ἀποστρέψει τὸ πρόσωπον αὐτοῦ ἀπὸ σοῦ — ибо не отвратит лица своего от тебя; δώσει μοι ... εἰς γυναῖκα — даст мне в жену."
  18: "Καλῶς — хорошо; ἐγὼ λαλήσω περὶ σοῦ τῷ βασιλεῖ — я поговорю о тебе царю."
  19: "ἐξανέστη εἰς ἀπάντησίν — встал навстречу (ἐξανίστημι); κατεφίλησεν — поцеловал (LXX); слав. «поклонися» — иное чтение, взято слав. ἐτέθη θρόνος τῇ μητρί — поставлен престол матери; ἐκ δεξιῶν αὐτοῦ — по правую руку его."
  20: "αἴτησιν μίαν μικράν — прошение одно малое; μὴ ἀποστρέψῃς τὸ πρόσωπόν σου — не отврати лица твоего (слав. «лица моего» — разница в лице); Αἴτησαι — проси; οὐκ ἀποστρέψω σε — не откажу тебе."
  21: "Δοθήτω — да будет дана (δίδωμι, импер. pass.); τῷ ἀδελφῷ σου — брату твоему; εἰς γυναῖκα — в жену."
  22: "Καὶ ἵνα τί — «и к чему»; ᾔτησαι — просишь (перф. αἰτέω); αἴτησαι αὐτῷ τὴν βασιλείαν — проси ему и царство; ὁ μέγας ὑπὲρ ἐμέ — больший меня; ἀρχιστράτηγος — военачальник; ἑταῖρος — друг, приближённый."
  23: "ὤμοσεν κατὰ τοῦ κυρίου — поклялся Господом (κατά + род.); Τάδε ποιήσαι μοι ὁ θεός — «то и то да сделает мне Бог» (формула клятвы); κατὰ τῆς ψυχῆς αὐτοῦ ἐλάλησεν — на душу свою сказал, т. е. на свою погибель."
  24: "ζῇ κύριος — жив Господь (клятва); ἡτοίμασέν με — приготовил меня; ἔθετό με ἐπὶ τὸν θρόνον — поставил меня на престол; ἐποίησέν μοι οἶκον — сделал мне дом (династию); θανατωθήσεται — будет умерщвлён."
  25: "ἐξαπέστειλεν ἐν χειρὶ Βαναιου — послал рукою Ванеи; ἀνεῖλεν — убил (ἀναιρέω); ἀπέθανεν — умер."
  26: "Ἀπότρεχε — беги, ступай (ἀποτρέχω); εἰς ἀγρόν σου — на поле твоё; ἀνὴρ θανάτου — муж смерти, достойный смерти; ἦρας τὴν κιβωτόν — носил ковчег (αἴρω); ἐκακουχήθης — был озлоблен, терпел зло (κακουχέω)."
  27: "ἐξέβαλεν — изгнал; τοῦ μὴ εἶναι ἱερέα — чтобы не быть священником; πληρωθῆναι τὸ ῥῆμα — исполниться слову; ἐπὶ τὸν οἶκον Ηλι ἐν Σηλωμ — о доме Илия в Силоме (1 Цар 2:27–36)."
  28: "ἡ ἀκοή — слух, весть; κεκλικὼς ὀπίσω Αδωνιου — склонившийся за Адонией (κλίνω, перф.); ὀπίσω Σαλωμων οὐκ ἔκλινεν — за Соломоном не склонился; σκήνωμα κυρίου — скиния Господня (幕屋); κατέσχεν τῶν κεράτων — ухватился за роги. В гр. пояснение стоит в квадратных скобках — редакторское."
  29: "ἀπηγγέλη — было возвещено; κατέχει τῶν κεράτων — держится за роги; Τί γέγονέν σοι — что с тобою случилось; πέφευγας — убежал (перф. φεύγω); ἄνελε αὐτὸν καὶ θάψον — убей его и погреби."
  30: "Ἔξελθε — выйди; Οὐκ ἐκπορεύομαι — не выйду; ὧδε ἀποθανοῦμαι — здесь умру; ἀποκέκριταί μοι — отвечал мне (перф. ἀποκρίνομαι)."
  31: "ποίησον αὐτῷ καθὼς εἴρηκεν — сделай ему, как он сказал; ἐξαρεῖς — отнимешь, удалишь (ἐξαίρω); δωρεὰν ἐξέχεεν — напрасно пролил (ἐκχέω)."
  32: "ἀπέστρεψεν κύριος τὸ αἷμα τῆς ἀδικίας αὐτοῦ εἰς κεφαλὴν αὐτοῦ — обратил Господь кровь неправды его на голову его; ἀπήντησεν — напал (ἀπαντάω); ὑπὲρ αὐτόν — лучше его; οὐκ ἔγνω τὸ αἷμα αὐτῶν — не знал крови их."
  33: "ἐπεστράφη τὰ αἵματα — обратилась кровь (ἐπιστρέφω); εἰς τὸν αἰῶνα — в век, навеки; τῷ σπέρματι αὐτοῦ — семени его; γένοιτο εἰρήνη — да будет мир (оптатив)."
  34: "ἀπήντησεν τῷ Ιωαβ — напал на Иоава; ἐθανάτωσεν — умертвил; ἔθαψεν ἐν τῷ οἴκῳ αὐτοῦ ἐν τῇ ἐρήμῳ — похоронил в доме его в пустыне."
  35: "Склейка: гр. ст. 35 содержит и первые фразы (Ванея над войском, Садок первым священником вместо Авиафара), и «прибавления» 35a–35k: слава Соломона и песок морской (35a), превосходство над древними и египтянами (35b), брак с дочерью фараона и постройки за семь лет (35c), 70 000 носильщиков и 80 000 каменотёсов (35d), «море», подставки, умывальницы, столпы, источник двора (35e), крепость и зубцы, разделение города Давида (35f), три ежегодных всесожжения и каждение (35g), 3600 надзирателей (35h), города Ассур, Магдон, Газер, Вефорон, Ваалаф (35i), построенные после дома Господня (35k). Слав. держит тот же материал в конце ст. 35 под номерами (1)–(10) и добавляет туда повторённую заповедь о Семее (гр. 36–39). θάλασσα — литое «море» (водоём); ὑποστηρίγματα — подставки; λουτῆρες — умывальницы; κρήνη τῆς αὐλῆς — источник двора; ἄκρα — крепость, акрополь; ἐπάλξεις — зубцы, парапеты; διέκοψεν — «пересёк, разрезал» (смысл тёмный, слав. «разсече»); ἐν πρώτοις — прежде всего."
  36: "Начало LXX-дубля: в гр. 36–39 повторена заповедь о Семее из 2:8–9 (в слав. она стоит в конце ст. 35 под (10)). ἐκ Χεβρων — «из Хеврона» (LXX и слав.; в МТ и Синод. «из Бахурима»). υἱὸς σπέρματος τοῦ Ιεμινι — сын семени Иемина, т. е. вениамитянин."
  37: "οὗτος κατηράσατό με κατάραν ὀδυνηράν — он проклял меня проклятием болезненным; ἐν ᾗ ἡμέρᾳ ἐπορευόμην εἰς Παρεμβολάς — в день, когда я шёл в Маханаим; слав. «клятвою укоризненною»."
  38: "κατέβαινεν εἰς ἀπάντησίν μοι ἐπὶ τὸν Ιορδάνην — выходил навстречу мне к Иордану; ὤμοσα αὐτῷ κατὰ τοῦ κυρίου — поклялся ему Господом; Εἰ θανατωθήσεται ἐν ῥομφαίᾳ — «если будет умерщвлён мечом» (формула клятвы, ср. ст. 8)."
  39: "Склейка: гр. ст. 39 = конец LXX-дубля (οὐ μὴ ἀθῳώσῃς αὐτόν) и далее весь рассказ МТ 36–39 (призыв Семея, запрет выходить, поток Кедрон, ответ Семея, три года, бегство рабов к Анхусу) — в слав. это отдельные стихи 36–39. Нумерация сохранена по гр. (ср. 2:35). χειμάρρους Κεδρων — поток Кедрон; γινώσκων γνώσῃ — «зная узнаешь» (усиление); ὥρκισεν — заклял (ὁρκίζω); Ἀγχους υἱὸς Μααχα — Анхус, сын Маахи."
  40: "ἐπέσαξε τὴν ὄνον — оседлал осла (ἐπισάσσω); ἐκζητῆσαι — разыскать (ἐκζητέω); ἤγαγεν — привёл (ἄγω)."
  41: "ἀπηγγέλη τῷ Σαλωμων — было донесено Соломону; ἐπορεύθη ... καὶ ἀπέστρεψεν — ходил и возвратил."
  42: "ὥρκισά σε κατὰ τοῦ κυρίου — заклял тебя Господом; ἐπεμαρτυράμην σοι — засвидетельствовал тебе (ἐπιμαρτύρομαι); εἰς δεξιὰ ἢ εἰς ἀριστερά — направо или налево; γινώσκων γνώσῃ — зная узнаешь; Ἀγαθὸν τὸ ῥῆμα — хорошо слово."
  43: "οὐκ ἐφύλαξας τὸν ὅρκον κυρίου — не сохранил клятвы Господней; τὴν ἐντολήν, ἣν ἐνετειλάμην κατὰ σοῦ — заповедь, которую я заповедал тебе."
  44: "πᾶσαν τὴν κακίαν σου — всё зло твоё; ἣν ἔγνω ἡ καρδία σου — которое знает сердце твоё; ἃ ἐποίησας τῷ Δαυιδ — что ты сделал Давиду; ἀνταπέδωκεν — воздал (ἀνταποδίδωμι)."
  45: "ηὐλογημένος — благословен (εὐλογέω, pass.); ἕτοιμος — готов, непоколебим (ἕτοιμος); ἐνώπιον κυρίου εἰς τὸν αἰῶνα — пред Господом во веки."
  46: "Склейка: гр. ст. 46 = казнь Семея и «прибавления» 46a–46k (многочисленность народа, дань и служение, кедры Ливана и Фермай, обед Соломона — 30 и 60 коров муки, 10 телят, 20 волов, 100 овец, власть от Рафи до Газы, мир и безопасность под виноградом и смоковницей, список сановников, 40 000 коней и 12 000 всадников, власть до пределов Египта). В слав. этого блока на месте ст. 46 нет: тот же материал слав. относит к гл. 4 по МТ-нумерации; переведено по гр. полностью. κόρος — кор (мера сыпучего); σεμίδαλις — пшеничная мука; ἄριστον — обед; πεποιθότες — в безопасности; ἀναμιμνῄσκων — напоминающий (придворная должность); ἄρσεις — ноши, носилки; πλινθεῖον — кирпичное дело; σύμβουλος — советник; τοκάδες — племенные кобылицы. Σαλωμων υἱὸς Δαυιδ ἐβασίλευσεν ἐπὶ Ισραηλ καὶ Ιουδα ἐν Ιερουσαλημ — Соломон, сын Давида, царствовал над Израилем и Иудой в Иерусалиме. В слав. этого стиха нет (это LXX-стих, соответствующий началу 3:1 по МТ); чтобы счёт совпал с csl, он влит сюда."
