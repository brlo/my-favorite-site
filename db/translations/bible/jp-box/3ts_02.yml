  8: "見[み]よ、あなたとともに、バフリムのベニヤミン人[じん]、ゲラの子[こ]シメイがいる。彼[かれ]はわたしがマハナイムへ行[い]った日[ひ]、わたしを激[はげ]しく呪[のろ]った。しかし、彼[かれ]はヨルダンまでわたしを迎[むか]えに出[で]て来[き]たので、わたしは主[しゅ]によって、『剣[つるぎ]であなたを殺[ころ]さない』と誓[ちか]った。"
