verses:
  1: "「人[ひと]の子[こ]よ、あなたは鋭[するど]い剣[つるぎ]、すなわち理髪師[りはつし]の剃[かみ]そりよりも鋭[するど]いものを取[と]り、それを自分[じぶん]のものとして、あなたの頭[あたま]とひげに当[あ]てよ。そして、秤[はかり]を取[と]って、その毛[け]を分[わ]けよ。"
  2: "その四分[よんぶん]の一[いち]を、都[みやこ]の中[なか]で火[ひ]で焼[や]け。すなわち、包囲[ほうい]の日[ひ]々[び]が満[み]ちるころに。"
  3: "また、四分[よんぶん]の一[いち]を取[と]って、その都[みやこ]の中[なか]で焼[や]け。四分[よんぶん]の一[いち]をその周[まわ]りで剣[つるぎ]で切[き]り裂[さ]き、四分[よんぶん]の一[いち]を風[かぜ]に吹[ふ]き散[ち]らせ。わたしはその後[あと]から剣[つるぎ]を抜[ぬ]く。"
  4: "また、そこから少[すこ]しの者[もの]を数[かぞ]えて取[と]り、あなたの衣[ころも]の端[はし]に包[つつ]め。その中[なか]からさらに少[すこ]しを取[と]って火[ひ]の中[なか]に投[なげ]げ、火[ひ]で焼[や]け。そこから火[ひ]が出[で]て、イスラエルの全家[ぜんか]に及[およ]ぶ。あなたはイスラエルの全家[ぜんか]に言[い]わなければならない。"
  5: "『主[しゅ]なる神[かみ]はこう言[い]われる。これがエルサレムである。わたしはこれを国[くに]々[ぐに]の間[あいだ]、その周[まわ]りの地[ち]々[じ]の間[あいだ]に置[お]いた。"
  6: "この都[みやこ]は、わたしの定[さだ]めを国[くに]々[ぐに]よりもひどく変[か]え、わたしの掟[おきて]をその周[まわ]りの地[ち]々[じ]よりもひどく変[か]えた。わたしの定[さだ]めを退[しりぞ]け、わたしの掟[おきて]に歩[あゆ]まなかったからである。"
  7: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。あなたがたの罪[つみ]は、あなたがたの周[まわ]りの国[くに]々[ぐに]の罪[つみ]よりも大[おお]きい。あなたがたはわたしの掟[おきて]に歩[あゆ]まず、わたしの定[さだ]めを行[おこな]わなかった。いや、あなたがたの周[まわ]りの国[くに]々[ぐに]の定[さだ]めにさえ、したがわなかった。"
  8: "それゆえ、主[しゅ]なる神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたに向[む]かう。わたしは国[くに]々[ぐに]の前[まえ]で、あなたの中[なか]に裁[さば]きを行[おこな]う。"
  9: "わたしはあなたの中[なか]で、これまで行[おこな]わなかったこと、これからも似[に]たことを行[おこな]わないことを行[おこな]う。あなたのすべての忌[い]まわしいもののゆえに。"
  10: "それゆえ、あなたの中[なか]で父[ちち]が子[こ]を食[た]べ、子[こ]が父[ちち]を食[た]べる。わたしはあなたの中[なか]で裁[さば]きを行[おこな]い、あなたの残[のこ]りのすべてを四方[しほう]の風[かぜ]に散[ち]らす。"
  11: "それゆえ、わたしは生[い]きている、と主[しゅ]なる神[かみ]は言[い]われる。あなたがすべての忌[い]まわしいもので、わたしの聖[せい]なるものを汚[けが]したので、わたしはあなたを退[しりぞ]ける。わたしの目[め]は惜[お]しまず、わたしはあわれまない。"
  12: "あなたの四分[よんぶん]の一[いち]は死[し]によって滅[ほろ]び、四分[よんぶん]の一[いち]はあなたの中[なか]で飢[う]えによって絶[た]える。四分[よんぶん]の一[いち]はあなたの周[まわ]りで剣[つるぎ]に倒[たお]れ、四分[よんぶん]の一[いち]はわたしが四方[しほう]の風[かぜ]に吹[ふ]き散[ち]らす。わたしはその後[あと]から剣[つるぎ]を抜[ぬ]く。"
  13: "わたしの憤[いきどお]りと怒[いか]りが彼[かれ]らの上[うえ]に終[お]わる。わたしは慰[なぐさ]められる。彼[かれ]らは、わたしが熱[ねつ]き心[こころ]で語[かた]ったことを知[し]る。わたしは主[しゅ]である。"
  14: "わたしはあなたを荒[あ]れ果[は]てた地[ち]とし、あなたの周[まわ]りの国[くに]々[ぐに]の笑[わら]い物[もの]とし、すれ違[ちが]うすべての者[もの]の前[まえ]にさらす。"
  15: "あなたは、周[まわ]りの国[くに]々[ぐに]の間[あいだ]で、嘆[なげ]きと恐[おそ]れ、懲[こら]しめと滅[ほろ]びとなる。わたしがあなたの中[なか]で、憤[いきどお]りと怒[いか]りと、わたしの憤[いきどお]りの復讐[ふくしゅう]をもって裁[さば]きを行[おこな]うとき。わたしは主[しゅ]である。わたしは語[かた]った。"
  16: "わたしが飢[う]えの矢[や]を彼[かれ]らに放[はな]つとき、その矢[や]は彼[かれ]らを滅[ほろ]ぼし尽[つ]くす。わたしはあなたがたを滅[ほろ]ぼす者[もの]を遣[つか]わし、あなたがたの上[うえ]に飢[う]えを集[あつ]め、あなたのパンの支[ささ]えを打[う]ち砕[くだ]く。"
  17: "わたしはあなたに飢[う]えと悪[わる]い獣[けもの]を放[はな]ち、あなたを苦[くる]しめる。死[し]と血[ち]があなたを通[とお]り過[す]ぎ、わたしはあなたの周[まわ]りに剣[つるぎ]を導[みちび]き入[い]れる。わたしは主[しゅ]である。わたしは語[かた]った。』」"

notes:
  1: "ῥομφαίαν ὀξεῖαν ὑπὲρ ξυρὸν κουρέως — «меч острый, острее бритвы стригущего» (ξυρόν — бритва; κουρεύς — стригущий, цирюльник); ἐπάξεις αὐτὴν ἐπὶ τὴν κεφαλήν σου καὶ ἐπὶ τὸν πώγωνά σου — «возложишь её на голову твою и на бороду твою» (πώγων — борода, ひげ); ζυγὸν σταθμίων — «ярмо (весы) весов» (ζυγός — весы, ярмо; σταθμίον — гиря); διαστήσεις αὐτούς — «разделишь их» (о волосах, 毛)."
  2: "τὸ τέταρτον ἐν πυρὶ ἀνακαύσεις ἐν μέσῃ τῇ πόλει — «четвёртую часть сожжёшь огнём посреди города» (ἀνακαίω — зажигать); κατὰ τὴν πλήρωσιν τῶν ἡμερῶν τοῦ συγκλεισμοῦ — «по исполнении дней осады» (πλήρωσις — исполнение). Слав. 5:2 содержит только эту часть и обрывается на двоеточии, остальные три доли переносит в 5:3 — деление иное, чем в гр."
  3: "Слав. 5:3 продолжает: λήμψῃ τὸ τέταρτον καὶ κατακαύσεις αὐτὸ ἐν μέσῳ αὐτῆς — «возьмёшь четвёртую часть и сожжёшь её посреди него»; τὸ τέταρτον κατακόψεις ἐν ῥομφαίᾳ κύκλῳ αὐτῆς — «четвёртую часть изрубишь мечом вокруг него» (κατακόπτω — разрубать); τὸ τέταρτον διασκορπίσεις τῷ πνεύματι — «четвёртую часть развеешь по ветру»; μάχαιραν ἐκκενώσω ὀπίσω αὐτῶν — «меч извлеку (обнажу) вслед их» (ἐκκενόω — выливать, обнажать). В гр. эти доли стоят в 5:2, а в 5:3 — «возьмёшь оттуда немногих числом», что у слав. попало в 5:4. Держим слав. деление и слав. счёт: четыре четверти (в МТ и ru — три трети)."
  4: "Слав. 5:4 = гр. 5:3 и 5:4: ὀλίγους ἐν ἀριθμῷ — «немногих числом»; συμπεριλήμψῃ αὐτοὺς τῇ ἀναβολῇ σου — «завернёшь их в полу твою» (ἀναβολή — накидка, полу одежды, 衣の端); ἐκ τούτων λήμψῃ ἔτι καὶ ῥίψεις αὐτοὺς εἰς μέσον τοῦ πυρός — «из них возьмёшь ещё и бросишь в огонь»; ἐξ αὐτῆς ἐξελεύσεται πῦρ — «из неё изойдёт огонь»; ἐρεῖς παντὶ οἴκῳ Ισραηλ — «скажешь всему дому Израилеву». Здесь начинается вложенная речь пророка — 『…』."
  5: "Αὕτη ἡ Ιερουσαλημ ἐν μέσῳ τῶν ἐθνῶν τέθεικα αὐτήν — «этот Иерусалим: среди народов Я поставил его»; τὰς κύκλῳ αὐτῆς χώρας — «страны вокруг него» (χώρα — страна, земля)."
  6: "τὰ δικαιώματά μου τῇ ἀνόμῳ ἐκ τῶν ἐθνῶν — тёмное место: «уставы Мои беззаконному [городу] — более, чем у народов»; слав. «измени оправдания моя паче языков» (измени — «изменил»), причём «речеши» повторяет формулу 5:4 — вероятно, текстовая порча (в ru без «скажи»); ἀπώσαντο — «отринули» (ἀπωθέω); οὐκ ἐπορεύθησαν ἐν αὐτοῖς — «не ходили в них». Переведено как утверждение о городе."
  7: "ἀφορμὴ ὑμῶν ἐκ τῶν ἐθνῶν — «повод (вина) ваш — более, чем у народов» (ἀφορμή — повод, основание; слав. «вина ваша»); ἐν τοῖς νομίμοις μου οὐκ ἐπορεύθητε — «по уставам Моим не ходили»; οὐδὲ κατὰ τὰ δικαιώματα τῶν ἐθνῶν πεποιήκατε — «и по уставам народов не поступали». ru «умножили беззакония» — иное понимание (МТ)."
  8: "Ἰδοὺ ἐγὼ ἐπὶ σέ — «вот, Я против тебя» (оборот суда); ποιήσω ἐν μέσῳ σου κρίμα — «произведу среди тебя суд»; ἐνώπιον τῶν ἐθνῶν — «пред народами»."
  9: "ἃ οὐ πεποίηκα καὶ ἃ οὐ ποιήσω ὅμοια αὐτοῖς — «чего Я не делал и чего не сделаю подобного им»; κατὰ πάντα τὰ βδελύγματά σου — «за все мерзости твои» (βδέλυγμα — мерзость, 忌[い]まわしいもの)."
  10: "πατέρες φάγονται τέκνα ἐν μέσῳ σου — «отцы будут есть детей среди тебя»; διασκορπιῶ πάντας τοὺς καταλοίπους σου εἰς πάντα ἄνεμον — «развею всех остатков твоих по всем ветрам» (κατάλοιπος — остаток)."
  11: "Ζῶ ἐγώ, λέγει κύριος — «живу Я, говорит Господь» (клятвенная формула); εἰ μὴ ἀνθ᾽ ὧν… — «если не…», т.е. «непременно» при клятве; τὰ ἅγιά μου ἐμίανας — «святая Мои осквернил»; ἀπώσομαί σε — «отрину тебя»; οὐ φείσεταί μου ὁ ὀφθαλμός — «не пощадит око Моё» (φείδομαι — щадить); οὐκ ἐλεήσω — «не помилую»."
  12: "τὸ τέταρτόν σου ἐν θανάτῳ ἀναλωθήσεται — «четверть твоя в смерти истребится» (ἀναλίσκω — истреблять; слав. «смертию потребится»; ru «от язвы» — МТ); ἐν λιμῷ συντελεσθήσεται — «в голоде скончается»; εἰς πάντα ἄνεμον σκορπιῶ — «по всем ветрам развею»; ἐν ῥομφαίᾳ πεσοῦνται κύκλῳ σου — «мечом падут вокруг тебя»; μάχαιραν ἐκκενώσω ὀπίσω αὐτῶν — «меч извлеку вслед их»."
  13: "συντελεσθήσεται ὁ θυμός μου καὶ ἡ ὀργή μου — «окончится ярость Моя и гнев Мой»: θυμός передан 憤[いきどお]り, ὀργή — 怒[いか]り (то же в 5:15); ἐπιγνώσῃ — «узнаешь»; ἐν ζήλῳ μου — «в ревности (рвении) Моей» (ζῆλος — ревность, 熱き心); ἐν τῷ συντελέσαι με τὴν ὀργήν — «когда совершу ярость». Слав. «утешуся» — «успокоюсь, получу удовлетворение», передано 慰[なぐさ]められる."
  14: "θήσομαί σε εἰς ἔρημον — «поставлю тебя в пустыню (опустошение)»; τὰς θυγατέρας σου κύκλῳ σου — «дочерей твоих вокруг тебя»: в слав. иначе «во укоризну языком» («в поношение народам») — по паритету взято слав. чтение (笑[わら]い物); ἐνώπιον παντὸς διοδεύοντος — «пред всяким проходящим» (διοδεύω — проходить мимо)."
  15: "στενακτή — «стенание» (στενακτός — достойный стенания); δηλαιστή — тёмное слово, вероятно «ужас, позор» (слав. «ужас», ru «поругание»); ἐν ἐκδικεύσει θυμοῦ μου — «в отмщении ярости Моей» (ἐκδίκησις — отмщение); ἐγὼ κύριος λελάληκα — «Я, Господь, изрек»."
  16: "βολίδας τοῦ λιμοῦ — «стрелы голода» (βολίς — стрела, 矢); εἰς ἔκλειψιν — «в исчезновение (скончание)» (ἔκλειψις — оскудение); συντρίψω στήριγμα ἄρτου σου — «сокрушу опору хлеба твоего» (повтор 4:16). Слав. добавляет «и послю растлити вы» («пошлю погубить вас», мн. ч., при «хлеба твоего» в ед. ч.) — в LXX нет, внесено без скобок."
  17: "θηρία πονηρά — «звери злые»; τιμωρήσομαί σε — «накажу (умучу) тебя» (τιμωρέω — карать); θάνατος καὶ αἷμα διελεύσονται ἐπὶ σέ — «смерть и кровь пройдут по тебе»; ῥομφαίαν ἐπάξω ἐπὶ σὲ κυκλόθεν — «меч наведу на тебя окрест»; ἐγὼ κύριος λελάληκα — «Я, Господь, изрек». Здесь закрываются и вложенная речь, и речь Бога."
