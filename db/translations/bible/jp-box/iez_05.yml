# jp-box, Иезекииль, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для главы нет (лакуна в модуле); jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 5: 1–4 меч-бритва, волосы головы и бороды, весы и четыре доли: четвёртая
# часть в огонь посреди города, четвёртая под меч, четвёртая по ветру, немногие —
# в полу одежды и снова в огонь, «оттуда выйдет огонь на весь дом Израилев»;
# 5–6 Иерусалим среди народов и его измена уставам; 7–9 суд за то, что он хуже
# народов, и дело, которого Бог не делал; 10–11 голод и меч, отцы и дети, клятва
# «живу Я»; 12–13 четыре доли: смерть, голод, меч, ветер; ярость совершается;
# 14–17 запустение и поругание у народов, стрелы голода, злые звери, смерть и кровь,
# меч окрест.
# Нумерация по gr: 17 стихов, совпадает с csl и ru. Деление внутри главы у слав.
# иное: слав. 5:2 содержит только первую долю, остальные три и «немногие» переносит
# в 5:3–5:4; держим слав. деление, карта в notes. Счёт долей — по слав. и LXX:
# четыре четверти (в МТ и ru — три трети).
# Голоса: 5:1–5:4 — речь Бога в 「…» (до «скажешь всему дому Израилеву»); с 5:5 до
# конца главы — вложенная речь пророка к народу в 『…』 (открывается в 5:5,
# закрывается в 5:17); формула «так говорит Господь» внутри неё. Вводных «И сказал
# мне» в главе нет — речь идёт непрерывно.
# 〔…〕 нет. Слав. добавления внесены в основной текст без скобок и оговорены:
# 5:16 «и послю растлити вы» (мн. ч., «пошлю погубить вас»).
# Сносок ⟨…⟩ нет: 剣, 秤, 毛, 衣, 飢え, 獣, 矢, 四分の一 уже в корпусе или понятны.
# Имена — транслитерация греческого (LXX): イスラエル, エルサレム; ユダ в главе не
# назван.
# Повторяющиеся формулы: τὸ τέταρτον — 四分[よんぶん]の一[いち]; μάχαιραν ἐκκενώσω
# ὀπίσω αὐτῶν — その後[あと]から剣[つるぎ]を抜[ぬ]く; ἐγὼ κύριος λελάληκα —
# わたしは主[しゅ]である。わたしは語[かた]った; Τάδε λέγει κύριος — 主[しゅ]なる
# 神[かみ]はこう言[い]われる.

