verses:
  1: "「ああ、わたしはなんと不幸[ふこう]な者[もの]か。夏[なつ]の果[くだ]物[もの]を集[あつ]める者[もの]のように、ぶどうを摘[つ]む者[もの]のようになった。食[た]べるべきぶどうの房[ふさ]はなく、わたしの魂[たましい]が慕[した]う初[はつ]なりの果[くだ]物[もの]もない。"
  2: "敬[けい]虔[けん]な者[もの]は地[ち]から滅[ほろ]び、人[ひと]々[びと]の間[あいだ]に正[ただ]しく歩[ある]む者[もの]はいない。彼らはみな血[ち]を流[なが]すために待[ま]ち伏[ぶ]せし、めいめいがその隣人[りんじん]に網[あみ]を仕掛[しか]ける。"
  3: "彼らは悪[わる]を行[おこな]うために手[て]を備[そな]える。支配者[しはいしゃ]は求[もと]め事[ごと]をし、裁[さば]き手[て]は平和[へいわ]な言葉[ことば]を語[かた]り、自分[じぶん]の魂[たましい]の欲[ほっ]することをする。"
  4: "わたしは彼らの良[よ]いものを、食[く]い荒[あ]らす蛾[が]のように取[と]り去[さ]る。彼らは見張[みは]りの日[ひ]に、測[はか]り縄[なわ]の上[うえ]を歩[ある]く。ああ、災[わざわ]いだ。あなたの罰[ばつ]が来[き]た。今[いま]、彼らの泣[な]き声[ごえ]が起[お]こる。"
  5: "友[とも]を信[しん]じるな。指導者[しどうしゃ]に頼[たよ]るな。あなたの床[とこ]を共[とも]にする者[もの]にも、何事[なにごと]も委[ゆだ]ねてはならない。"
  6: "子[こ]は父[ちち]を辱[はずかし]め、娘[むすめ]は母[はは]に逆[さから]い、嫁[よめ]は姑[しゅうとめ]に逆[さから]う。人[ひと]の敵[てき]はその家[いえ]の者[もの]たちである。"
  7: "しかし、わたしは主[しゅ]に目[め]を向[む]け、わたしの救[すく]いの神[かみ]に耐[た]え忍[しの]ぶ。わたしの神[かみ]はわたしの声[こえ]を聞[き]かれる。"
  8: "わたしの敵[てき]よ、わたしのことで喜[よろこ]ぶな。わたしは倒[たお]れたが、起[お]き上[あ]がる。暗[くら]やみに座[すわ]っていても、主[しゅ]はわたしの光[ひかり]となる。"
  9: "わたしは主[しゅ]の怒[いか]りを負[お]う。主[しゅ]に対して罪[つみ]を犯[おか]したからである。主[しゅ]がわたしの訴[うった]えを正[ただ]し、わたしの裁[さば]きを行[おこな]うまで。主[しゅ]はわたしを光[ひかり]のうちに連[つ]れ出[だ]し、わたしは主[しゅ]の正[ただ]しさを見[み]る。"
  10: "わたしの敵[てき]はこれを見[み]て恥[はじ]を負[お]う。『あなたの神[かみ]、主[しゅ]はどこにいるのか』とわたしに言[い]った者[もの]である。わたしの目[め]はその者[もの]を見[み]る。その者[もの]は道[みち]の泥[どろ]のように踏[ふ]みにじられる。"
  11: "煉瓦[れんが]を塗[ぬ]る日[ひ]。その日[ひ]にあなたは消[き]え去[さ]り、その日[ひ]にあなたの掟[おきて]はぬぐい去[さ]られる。"
  12: "あなたの町[まち]々[まち]は平[たい]らにされ、アッシリア人[じん]に分[わ]け与[あた]えられる。あなたの強[つよ]い町[まち]々[まち]はツロからシリアの川[かわ]まで、海[うみ]から海[うみ]へ、山[やま]から山[やま]へと分[わ]けられ、水[みず]と騒[さわ]ぎの日[ひ]となる。"
  13: "地[ち]はそこに住[す]む者[もの]たちとともに、その行[おこな]いの実[み]のゆえに荒[あ]れ果[は]てる。"
  14: "あなたの杖[つえ]をもって、あなたの民[たみ]、あなたの嗣業[しぎょう]の羊[ひつじ]を養[やしな]え。彼らはカルメルの真[ま]ん中[なか]の林[はやし]に、ただ一[ひと]りで住[す]んでいる。彼らは昔[むかし]の日[ひ]々[び]のように、バシャンとギレアデを食[は]む。"
  15: "あなたがエジプトの地[ち]から出[で]た日[ひ]々[び]のように、あなたがたは驚[おどろ]くべきことを見[み]る。"
  16: "国民[こくみん]たちはこれを見[み]て、自分[じぶん]たちのすべてもろもろの力[ちから]のゆえに恥[は]じる。彼らは手[て]を口[くち]に当[あ]て、その耳[みみ]は聞[き]こえなくなる。"
  17: "彼らは蛇[へび]のように、地[ち]を這[は]うもののように土[つち]をなめる。彼らはその閉[と]じ込[こ]められた所[ところ]でうろたえる。彼らはわたしたちの神[かみ]、主[しゅ]を恐[おそ]れ、あなたを畏[おそ]れる。"
  18: "あなたのような神[かみ]がほかにあるだろうか。あなたは不[ふ]法[ほう]を除[のぞ]き、ご自分[じぶん]の嗣業[しぎょう]の残[のこ]りの者[もの]たちの不敬[ふけい]を見過[みす]ごされ、その怒[いか]りを証[あかし]として保[たも]ち続[つづ]けられることはない。あなたはあわれみを喜[よろこ]ばれる方[かた]だからである。"
  19: "主[しゅ]は再[ふたた]びわたしたちをあわれみ、わたしたちの不[ふ]法[ほう]を踏[ふ]みにじり、わたしたちのすべてもろもろの罪[つみ]を海[うみ]の深[ふか]みに投[な]げ込[こ]まれる。"
  20: "あなたはヤコブに真実[しんじつ]を、アブラハムにあわれみを、昔[むかし]の日[ひ]々[び]にわたしたちの父[ちち]たちに誓[ちか]われたとおりに、お与えになる。」"

notes:
  1: "Οἴμμοι ὅτι ἐγενόμην ὡς συνάγων καλάμην ἐν ἀμήτῳ — «горе мне, что я стал как собирающий стерню на жатве» (οἴμμοι — горе мне!; κάλαμη — стерня, солома; слав. «люте мне! понеже бых аки собираяй сламу на жатве»); ὡς ἐπιφυλλίδα ἐν τρυγήτῳ — «как остатки после сбора винограда» (ἐπιφυλλίς — остаток, подбирание); οὐχ ὑπάρχοντος βότρυος τοῦ φαγεῖν τὰ πρωτόγονα — «когда нет грозди, чтобы съесть первые плоды» (βότρυς — гроздь; πρωτόγονος — первородный, первый плод); οἴμμοι, ψυχή — «горе мне, душа» (слав. «люте мне, душе»). В слав. в начале стиха стоит знак «~» — дефект набора, не переносился."
  2: "ἀπόλωλεν εὐλαβὴς ἀπὸ τῆς γῆς — «погиб благочестивый с земли» (εὐλαβής — благочестивый, благоговейный); κατορθῶν ἐν ἀνθρώποις οὐχ ὑπάρχει — «исправляющего (прямо ходящего) между людьми нет» (κατορθόω — выпрямлять, исправлять); πάντες εἰς αἵματα δικάζονται — «все тяжутся к кровям (ради крови)» (δικάζομαι — судиться, вести тяжбу); ἕκαστος τὸν πλησίον αὐτοῦ ἐκθλίβουσιν ἐκθλιβῇ — «каждый ближнего своего теснит теснотою» (ἐκθλίβω — выжимать, теснить; усилительный оборот с однокоренным существительным)."
  3: "ἐπὶ τὸ κακὸν τὰς χεῖρας αὐτῶν ἑτοιμάζουσιν — «ко злу руки свои готовят»; ὁ ἄρχων αἰτεῖ — «начальник просит (требует)» (αἰτέω — просить; в тексте 「求め事をする」, без добавления «взятку»); ὁ κριτὴς εἰρηνικοὺς λόγους ἐλάλησεν — «судья мирные слова говорил»; καταθύμιον ψυχῆς αὐτοῦ ἐστιν — «по желанию души его» (καταθύμιον — угодное, желаемое; слав. «желание души его есть»)."
  4: "τὰ ἀγαθὰ αὐτῶν ὡς σὴς ἐκτρώγων — «блага их, как моль поедающий» (σής — моль; ἐκτρώγω — съедать; слав. «яко моль поядаяй»); βαδίζων ἐπὶ κανόνος — «ходящий по правилу (мерилу)» (κανών — правило, мерило; слав. «ходяй по правилам»); ἐν ἡμέρᾳ σκοπιᾶς — «в день стражи (наблюдения)» (σκοπιά — стража, дозор; слав. «в день стражбы»); οὐαὶ οὐαί, αἱ ἐκδικήσεις σου ἥκασιν — «горе, горе! отмщения твои пришли» (ἐκδίκησις — мщение; ἥκω — приходить); νῦν ἔσονται κλαυθμοὶ αὐτῶν — «ныне будут плачи их» (κλαυθμός — плач). В слав. стоит «~, люте! у, люте!» — дефект набора, не переносился."
  5: "μὴ καταπιστεύετε ἐν φίλοις — «не доверяйте друзьям» (καταπιστεύω — доверять); μὴ ἐλπίζετε ἐπὶ ἡγουμένοις — «не надейтесь на начальствующих» (ἐλπίζω — надеяться); ἀπὸ τῆς συγκοίτου σου φύλαξαι — «от сожительницы твоей храни себя» (σύγκοιτος — спящий вместе, супруг(а); φυλάσσομαι — хранить себя); τοῦ ἀναθέσθαι τι αὐτῇ — «чтобы не возложить (поручить) ей что-либо» (ἀνατίθεμαι — возлагать, поручать)."
  6: "υἱὸς ἀτιμάζει πατέρα — «сын бесчестит отца» (ἀτιμάζω — бесчестить); θυγάτηρ ἐπαναστήσεται ἐπὶ τὴν μητέρα αὐτῆς — «дочь восстанет на мать свою» (ἐπανίστημι — восставать); νύμφη ἐπὶ τὴν πενθερὰν αὐτῆς — «невестка на свекровь свою» (νύμφη — невестка; πενθερά — свекровь); ἐχθροὶ ἀνδρὸς πάντες οἱ ἄνδρες οἱ ἐν τῷ οἴκῳ αὐτοῦ — «враги человека — все мужи в доме его» (слав. «врази вси мужу домашнии его»)."
  7: "Ἐγὼ δὲ ἐπὶ τὸν κύριον ἐπιβλέψομαι — «я же на Господа воззрю» (ἐπιβλέπω — взирать); ὑπομενῶ ἐπὶ τῷ θεῷ τῷ σωτῆρί μου — «буду ждать (терпеть) Бога спасителя моего» (ὑπομένω — выдерживать, ожидать); εἰσακούσεταί μου ὁ θεός μου — «услышит меня Бог мой»."
  8: "μὴ ἐπίχαιρέ μοι, ἡ ἐχθρά μου — «не радуйся обо мне, враждебная моя» (ἐχθρά — ж. р.: враждебная; ἐπιχαίρω — радоваться чужому горю); ὅτι πέπτωκα, καὶ ἀναστήσομαι — «ибо я пал, но восстану»; ἐὰν καθίσω ἐν τῷ σκότει, κύριος φωτιεῖ μοι — «если сяду во тьме, Господь осветит меня» (φωτίζω — освещать)."
  9: "ὀργὴν κυρίου ὑποίσω — «гнев Господень понесу» (ὑποφέρω — нести, терпеть); ὅτι ἥμαρτον αὐτῷ — «ибо согрешил Ему»; ἕως τοῦ δικαιῶσαι αὐτὸν τὴν δίκην μου — «доколе не рассудит Он тяжбу мою» (δικαιόω — оправдывать, судить праведно; δίκη — тяжба, право); ποιήσει τὸ κρίμα μου — «совершит суд мой»; ἐξάξει με εἰς τὸ φῶς — «выведет меня на свет»; ὄψομαι τὴν δικαιοσύνην αὐτοῦ — «увижу правду Его»."
  10: "καὶ ὄψεται ἡ ἐχθρά μου — «и увидит враждебная моя»; περιβαλεῖται αἰσχύνην — «облечётся в стыд» (περιβάλλω — облекать); ἡ λέγουσα πρός με Ποῦ κύριος ὁ θεός σου — «говорящая мне: где Господь Бог твой?» (слова врага в 『…』); οἱ ὀφθαλμοί μου ἐπόψονται αὐτήν — «глаза мои увидят её»; νῦν ἔσται εἰς καταπάτημα ὡς πηλὸς ἐν ταῖς ὁδοῖς — «ныне будет в попрание, как грязь на путях» (καταπάτημα — попирание; πηλός — грязь, глина)."
  11: "ἡμέρας ἀλοιφῆς πλίνθου — «день обмазки кирпича» (ἄλοιψις — обмазывание; πλίνθος — кирпич, плинф; слав. «день глажения плинфа») — тёмное место (в МТ «день строения стен твоих»); ἐξάλειψίς σου ἡ ἡμέρα ἐκείνη — «изглаждение твоё — день тот» (ἐξάλειψις — стирание, изглаживание); ἀποτρίψεται νόμιμά σου — «сотрёт уставы твои» (ἀποτρίβω — стирать, соскабливать)."
  12: "αἱ πόλεις σου ἥξουσιν εἰς ὁμαλισμὸν — «города твои придут в уравнение (сглаживание)» (ὁμαλισμός — выравнивание; слав. «на поравнение»); εἰς διαμερισμὸν Ἀσσυρίων — «в разделение Ассириян» (διαμερισμός — разделение); ἀπὸ Τύρου ἕως τοῦ ποταμοῦ Συρίας — «от Тира до реки Сирии» (слав. «от тира даже до реки сирския»); слав. добавляет «и от моря даже до моря, и от горы даже до горы» — в LXX этих слов нет, по паритету внесены в основной текст без 〔…〕; ἡμέρα ὕδατος καὶ θορύβου — «день воды и шума» (θόρυβος — шум, смятение)."
  13: "ἡ γῆ εἰς ἀφανισμὸν σὺν τοῖς κατοικοῦσιν αὐτὴν — «земля в уничтожение с живущими на ней» (ἀφανισμός — истребление, запустение); ἐκ καρπῶν ἐπιτηδευμάτων αὐτῶν — «от плодов дел их» (καρπός — плод; ἐπιτήδευμα — занятие, дело)."
  14: "Ποίμαινε λαόν σου ἐν ῥάβδῳ σου — «паси народ Твой жезлом Твоим» (ποιμαίνω — пасти; ῥάβδος — жезл); πρόβατα κληρονομίας σου — «овец наследия Твоего»; κατασκηνοῦντας καθ᾿ ἑαυτοὺς δρυμὸν ἐν μέσῳ τοῦ Καρμήλου — «живущих отдельно (уединённо) в лесу среди Кармила» (κατασκηνόω — водворяться; δρυμός — лес, чаща); νεμήσονται τὴν Βασανῖτιν καὶ τὴν Γαλααδῖτιν — «будут пастись на Васанитиде и Галаадитиде» (νέμομαι — пастись; женские формы топонимов); καθὼς αἱ ἡμέραι τοῦ αἰῶνος — «как дни века»."
  15: "κατὰ τὰς ἡμέρας ἐξοδίας σου ἐξ Αἰγύπτου — «по дням исхода твоего из Египта» (ἐξοδία — выход, исход); ὄψεσθε θαυμαστά — «увидите дивное» (θαυμαστός — дивный; слав. «узрите чудесная»)."
  16: "ὄψονται ἔθνη καὶ καταισχυνθήσονται — «увидят народы и устыдятся»; ἐκ πάσης τῆς ἰσχύος αὐτῶν — «от всей крепости их» (ἰσχύς — сила, крепость); ἐπιθήσουσιν χεῖρας ἐπὶ τὸ στόμα αὐτῶν — «возложат руки на уста свои»; τὰ ὦτα αὐτῶν ἀποκωφωθήσονται — «уши их оглохнут» (ἀποκωφόω — делать глухим)."
  17: "λείξουσιν χοῦν ὡς ὄφεις — «полижут прах, как змеи» (λείχω — лизать; χοῦς — прах, пыль); σύροντες γῆν — «влекущиеся по земле» (σύρω — тащить, влечь); συγχυθήσονται ἐν συγκλεισμῷ αὐτῶν — «придут в смятение в своём заключении» (σύγκλεισμα — заключение, заточение; слав. «смятутся во облежении своем»); ἐπὶ τῷ κυρίῳ θεῷ ἡμῶν ἐκστήσονται — «о Господе Боге нашем изумятся» (ἐξίστημι — изумляться); φοβηθήσονται ἀπὸ σοῦ — «убоятся Тебя»."
  18: "τίς θεὸς ὥσπερ σύ — «кто Бог, как Ты?»; ἐξαίρων ἀδικίας — «удаляющий неправды» (ἐξαίρω — удалять); ὑπερβαίνων ἀσεβείας τοῖς καταλοίποις τῆς κληρονομίας αὐτοῦ — «преступающий (прощающий) нечестия остатку наследия Его» (ὑπερβαίνω — переступать, проходить мимо); οὐ συνέσχεν εἰς μαρτύριον ὀργὴν αὐτοῦ — «не удержал в свидетельство гнева Своего» (συνέχω — держать; μαρτύριον — свидетельство) — тёмное место LXX (в МТ «не вечно гневается»), в тексте 「証として保ち続けられることはない」 с оговоркой здесь; ὅτι θελητὴς ἐλέους ἐστίν — «ибо Он любящий милость» (θελητής — желатель, любитель)."
  19: "αὐτὸς ἐπιστρέψει καὶ οἰκτιρήσει ἡμᾶς — «Он обратится и ущедрит нас» (οἰκτίρω — миловать, щадить); καταδύσει τὰς ἀδικίας ἡμῶν — «погрузит неправды наши» (καταδύω — погружать); ἀπορριφήσονται εἰς τὰ βάθη τῆς θαλάσσης — «будут ввергнуты в глубины моря»; πάσας τὰς ἁμαρτίας ἡμῶν — «все грехи наши»."
  20: "δώσεις ἀλήθειαν τῷ Ιακωβ — «дашь истину Иакову» (ἀλήθεια — истина, верность); ἔλεον τῷ Αβρααμ — «милость Аврааму»; καθότι ὤμοσας τοῖς πατράσιν ἡμῶν — «как Ты поклялся отцам нашим» (ὄμνυμι — клясться); κατὰ τὰς ἡμέρας τὰς ἔμπροσθεν — «по дням прежним»."
