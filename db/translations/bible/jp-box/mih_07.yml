# jp-box, Михей, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной; в gr-lxx-byz эта глава — 7 (совпадает, 20 стихов).
# Карта книги: гл. 7 совпадает с gr; расхождение границ только в 4/5 (слав. 5:1 =
# gr 4:14, слав. 5:N = gr 5:(N−1); см. шапки гл. 4 и 5).
# Язык — современный 常体; порядок членов и клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–2 плач: «горе мне», как при сборе плодов, не стало благочестивого;
# 3–4 руки ко злу, начальник просит, судья говорит мирно, «блага их, как моль»,
# день стражи; 5–6 не доверяй другу, «враги человеку — домашние его»;
# 7–10 исповедание: «я пал, но встану», гнев Господень понесу, враг увидит;
# 11–13 день обмазки кирпича, города в разделение, земля в запустение;
# 14 молитва: «паси народ Твой жезлом Твоим», Васан и Галаад;
# 15–17 как во дни исхода — дивное, народы устыдятся, полижут прах, как змеи;
# 18–20 **кто Бог, как Ты**: прощающий беззаконие, «ввергнешь в пучину морскую
# все грехи наши», истина Иакову и милость Аврааму.
# Голоса: 1–20 — одна цитата 「…»: голос пророка/общины (покаянный плач и молитва),
# в 10 слова врага — 『…』; обращения к Богу в 14–20 внутри той же речи.
# В слав. тексте 7:1 и 7:4 стоят знаки «~» — дефект набора, не переносились.
#
