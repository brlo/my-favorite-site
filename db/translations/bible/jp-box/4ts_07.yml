# jp-box, 4-я Царств, глава 7. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 7: пророчество о ценах в Самарии и ответ тристата (1–2); четыре
# прокажённых у ворот (3–5); Господь обращает стан Сирии в бегство (6–7);
# прокажённые грабят стан и несут весть в город (8–11); царь посылает
# разведку (12–15); народ разграбляет стан, исполнение слова и смерть
# тристата (16–20).
# Речь — 「…」, вложенная — 『…』. Красного нет.
# Нумерация по gr: 20 стихов, совпадает с csl/ru.
# 〔…〕 нет: на месте всех стихов есть текст.
# Сносок ⟨…⟩ нет: 預言者, 天幕, 陣営, 戦車 уже в корпусе.
# λεπρός передаётся как 重い皮膚病 (корпусная норма: Лев 13, Мф 8:2), не 癩病.
# jp-ni не использовался.

tr_code: jp-box
book: 4ts
chapter: 7
draft: true

verses:
  1: "エリシャは言[い]った。「主[しゅ]の言葉[ことば]を聞[き]きなさい。主[しゅ]はこう言[い]われる。明日[あした]のこの時刻[じこく]、サマリアの門[もん]で、上等[じょうとう]な小麦粉[こむぎこ]一[いち]セアが一[いち]シェケル、大麦[おおむぎ]二[に]セアが一[いち]シェケルで売[う]られる。」"
  2: "王[おう]が寄[よ]りかかっていた高官[こうかん]はエリシャに答[こた]えて言[い]った。「見[み]よ、たとえ主[しゅ]が天[てん]に窓[まど]を開[ひら]かれても、そんなことがありえようか。」エリシャは言[い]った。「見[み]よ、あなたは自分[じぶん]の目[め]で見[み]るが、そこから何[なに]かを食[た]べることはない。」"
  3: "町[まち]の門[もん]のところに、四人[よにん]の重[おも]い皮膚病[ひふびょう]の者[もの]たちがいた。彼[かれ]らは互[たが]いに言[い]った。「なぜ私[わたし]たちはここに座[すわ]って、死[し]ぬのを待[ま]っているのか。」"
  4: "「もし私[わたし]たちが町[まち]に入[はい]れば、町[まち]には飢饉[ききん]があって、そこで死[し]ぬ。ここに座[すわ]っていても死[し]ぬ。さあ、シリアの陣営[じんえい]に飛[と]び込[こ]もう。彼[かれ]らが私[わたし]たちを生[い]かせば生[い]き、殺[ころ]せば死[し]ぬのだ。」"
  5: "彼[かれ]らは暗[くら]やみの中[なか]で立[た]ち上[あ]がり、シリアの陣営[じんえい]へ向[む]かった。陣営[じんえい]の端[はし]まで来[き]てみると、そこには誰[だれ]もいなかった。"
  6: "主[しゅ]はシリアの陣営[じんえい]に、戦車[せんしゃ]の音[おと]、馬[うま]の音[おと]、大軍[たいぐん]の音[おと]を聞[き]こえさせた。人[ひと]は兄弟[きょうだい]に言[い]った。「見[み]よ、イスラエルの王[おう]は、私[わたし]たちを攻[せ]めるために、ヘト人[じん]の王[おう]たちとエジプトの王[おう]たちを雇[やと]ったのだ。」"
  7: "彼[かれ]らは立[た]ち上[あ]がって暗[くら]やみの中[なか]を逃[に]げ、自分[じぶん]たちの天幕[てんまく]、馬[うま]、ろばを陣営[じんえい]にそのまま残[のこ]して、命[いのち]を救[すく]うために逃[に]げた。"
  8: "これらの重[おも]い皮膚病[ひふびょう]の者[もの]たちは陣営[じんえい]の端[はし]まで入[はい]って行[い]き、一[ひと]つの天幕[てんまく]に入[はい]って食[た]べたり飲[の]んだりした。そして、そこから銀[ぎん]と金[きん]と衣[ころも]を持[も]ち出[だ]して行[い]き、それを隠[かく]した。また戻[もど]って来[き]て別[べつ]の天幕[てんまく]に入[はい]り、そこからも持[も]ち出[だ]しては隠[かく]した。"
  9: "人[ひと]は隣[となり]の人[ひと]に言[い]った。「私[わたし]たちは正[ただ]しいことをしていない。この日[ひ]は良[よ]い知[し]らせの日[ひ]なのに、私[わたし]たちは黙[だま]って夜明[よあ]けまで待[ま]っている。そうすれば、私[わたし]たちは罪[つみ]に問[と]われる。さあ、行[い]って王[おう]の家[いえ]に知[し]らせよう。」"
  10: "彼[かれ]らは行[い]って町[まち]の門[もん]で呼[よ]びかけた。そして告[つ]げて言[い]った。「私[わたし]たちはシリアの陣営[じんえい]に入[はい]ったが、そこには誰[だれ]もいなかった。人[ひと]の声[こえ]もなかった。ただ、つながれた馬[うま]とろば、そしてそのままの天幕[てんまく]があった。」"
  11: "門衛[もんえい]たちは叫[さけ]んで、王[おう]の家[いえ]の奥[おく]まで告[つ]げた。"
  12: "王[おう]は夜[よる]に立[た]ち上[あ]がって召使[めしつか]いたちに言[い]った。「シリアが私[わたし]たちにしたことを話[はな]そう。彼[かれ]らは私[わたし]たちが飢[う]えているのを知[し]って、陣営[じんえい]を出[で]て野[の]に隠[かく]れているのだ。そして言[い]っている。『彼[かれ]らが町[まち]から出[で]て来[き]たら、生[い]けどりにして、町[まち]に入[はい]ろう』と。」"
  13: "王[おう]の召使[めしつか]いの一人[ひとり]が答[こた]えて言[い]った。「ここに残[のこ]っている馬[うま]のうち五頭[ごとう]を取[と]らせてくれ。ご覧[らん]のとおり、ここに残[のこ]っているのは、イスラエルの大軍[たいぐん]のうち、わずかに残[のこ]ったものなのだ。それを送[おく]って、見[み]て来[こ]させよう。」"
  14: "そこで二人[ふたり]の騎手[きしゅ]が連[つ]れて来[こ]られ、イスラエルの王[おう]はシリアの王[おう]の後[あと]へ彼[かれ]らを送[おく]って言[い]った。「行[い]って見[み]て来[き]なさい。」"
  15: "彼[かれ]らは彼[かれ]らの後[あと]を追[お]ってヨルダンまで行[い]った。見[み]ると、道[みち]はすべて、シリアが慌[あわ]てて逃[に]げるときに捨[す]てた衣[ころも]や道具[どうぐ]でいっぱいだった。使者[ししゃ]たちは戻[もど]って来[き]て、王[おう]に告[つ]げた。"
  16: "民[たみ]は出[で]て行[い]って、シリアの陣営[じんえい]を略奪[りゃくだつ]した。すると、上等[じょうとう]な小麦粉[こむぎこ]一[いち]セアが一[いち]シェケル、大麦[おおむぎ]二[に]セアが一[いち]シェケルとなった。主[しゅ]の言葉[ことば]のとおりである。"
  17: "王[おう]は、自分[じぶん]が寄[よ]りかかっていた高官[こうかん]を門[もん]に立[た]たせた。民[たみ]は門[もん]で彼[かれ]を踏[ふ]みつけ、彼[かれ]は死[し]んだ。神[かみ]の人[ひと]が語[かた]ったとおりであった。それは、使者[ししゃ]が彼[かれ]のもとに下[くだ]って来[き]たときに語[かた]ったことであった。"
  18: "エリシャが王[おう]に語[かた]ったとおりになった。「大麦[おおむぎ]二[に]セアが一[いち]シェケル、上等[じょうとう]な小麦粉[こむぎこ]一[いち]セアが一[いち]シェケル、明日[あした]のこの時刻[じこく]、サマリアの門[もん]で。」"
  19: "高官[こうかん]はエリシャに答[こた]えて言[い]った。「見[み]よ、たとえ主[しゅ]が天[てん]に窓[まど]を開[ひら]かれても、そんなことがありえようか。」エリシャは言[い]った。「見[み]よ、あなたは自分[じぶん]の目[め]で見[み]るが、そこから何[なに]かを食[た]べることはない。」"
  20: "そのとおりになった。民[たみ]は門[もん]で彼[かれ]を踏[ふ]みつけ、彼[かれ]は死[し]んだ。"

notes:
  1: "Ἄκουσον λόγον κυρίου — «услышь слово Господне» (императив ед. ч.; слав. «слышите», мн. ч.). Ὡς ἡ ὥρα αὕτη αὔριον — «как этот час, завтра», т. е. завтра в это же время. μέτρον σεμιδάλεως — мера тонкой пшеничной муки (σεμίδαλις), передано セア; σίκλου — «за сикль» (родительный цены); δίμετρον κριθῶν — двойная мера ячменя. ἐν ταῖς πύλαις Σαμαρείας — у ворот Самарии, где шла торговля."
  2: "τριστάτης — тристат, начальник третьей части войска (высокий чин); ἐφ᾽ ὃν ὁ βασιλεὺς ἐπανεπαύετο ἐπὶ τὴν χεῖρα αὐτοῦ — «на руку которого царь опирался», т. е. приближённый, которому царь доверял. καταρράκται — «водопады», небесные решётки/окна (слав. «хляби небесныя»). В LXX здесь нет «если»: Ἰδοὺ ποιήσει κύριος καταρράκτας ἐν οὐρανῷ, μὴ ἔσται τὸ ῥῆμα τοῦτο; — «вот, сотворит Господь хляби на небе; неужели не будет это слово?»; слав. «аще отверзет Господь» — внесено в текст по паритету. ἐκεῖθεν οὐ φάγῃ — «оттуда не будешь есть», т. е. не вкусишь этой пищи."
  3: "λεπροί — «поражённые проказой»; передано 重い皮膚病, как в Лев 13 и Мф 8:2, а не устаревшим 癩病. παρὰ τὴν θύραν τῆς πόλεως — у ворот города (слав. «при вратех града»). Τί ἡμεῖς καθήμεθα ὧδε ἕως ἀποθάνωμεν — «что мы сидим здесь, пока не умрём?»"
  4: "εἰσέλθωμεν εἰς τὴν πόλιν — «войдём в город». ἐμπέσωμεν εἰς τὴν παρεμβολὴν Συρίας — «бросимся в стан Сирии»; παρεμβολή — военный лагерь, 陣営. Ζωογονήσωσιν — «оставят в живых» (ζωογονέω, букв. «оживят»); θανατώσωσιν — «умертвят»."
  5: "ἐν τῷ σκότει — в темноте (слав. «в сумраце», т. е. в сумерках). εἰς μέρος τῆς παρεμβολῆς — «к части (краю) стана». οὐκ ἔστιν ἀνὴρ ἐκεῖ — нет там человека."
  6: "ἀκουστὴν ἐποίησεν — «сделал слышимым». φωνὴ ἅρματος — звук колесницы; ἵππου — коня; δυνάμεως μεγάλης — великой силы (войска). ἐμισθώσατο — «нанял» (μισθόω). τοὺς βασιλέας τῶν Χετταίων — царей хеттейских (ヘト人). ἀνὴρ πρὸς τὸν ἀδελφὸν αὐτοῦ — «муж к брату своему»."
  7: "ἀπέδρασαν — убежали. ἐγκατέλιπαν — оставили (ἐγκαταλείπω). σκηναί — шатры, 天幕. ὡς ἔστιν — «как есть», в том виде, как стояли. ἔφυγον πρὸς τὴν ψυχὴν ἑαυτῶν — «побежали ради души своей», спасая жизнь."
  8: "οἱ λεπροί — прокажённые. ἕως μέρους — до края. ἦραν — взяли; ἀργύριον καὶ χρυσίον — серебро и золото; ἱματισμός — одежда. κατέκρυψαν — скрыли, спрятали."
  9: "ἡμέρα εὐαγγελίας — «день благовестия», радостной вести. σιωπῶμεν — молчим. ἕως φωτὸς τοῦ πρωΐ — до утреннего света. εὑρήσομεν ἀνομίαν — «найдём беззаконие», т. е. навлечём на себя вину (слав. «обрящем беззаконие»). εἰς τὸν οἶκον τοῦ βασιλέως — в дом царя."
  10: "ἐβόησαν πρὸς τὴν πύλην — закричали к воротам. οὐκ ἔστιν ἐκεῖ ἀνὴρ καὶ φωνὴ ἀνθρώπου — нет там ни человека, ни голоса человеческого. εἰ μὴ ἵππος δεδεμένος — «кроме коня привязанного». ὡς εἰσίν — «как они есть», в прежнем виде."
  11: "οἱ θυρωροί — привратники, 門衛. ἀνήγγειλαν εἰς τὸν οἶκον τοῦ βασιλέως ἔσω — возвестили внутрь дома царского (слав. «в дому цареве внутрь»)."
  12: "ἀνέστη νυκτός — встал ночью. Ἀναγγελῶ — «возвещу». ἔγνωσαν ὅτι πεινῶμεν — узнали, что мы голодаем. ἐκρύβησαν ἐν τῷ ἀγρῷ — спрятались в поле. συλλημψόμεθα αὐτοὺς ζῶντας — захватим их живыми."
  13: "Λαβέτωσαν — «пусть возьмут». τῶν ὑπολελειμμένων — из оставшихся. ἰδοὺ εἰσιν πρὸς πᾶν τὸ πλῆθος Ισραηλ τὸ ἐκλεῖπον — «вот, они ко всему множеству Израиля, оскудевающему», т. е. это всё, что осталось от войска (слав. «се, суть у толикаго множества израилева оставшиися»). ἀποστελοῦμεν — пошлём; ὀψόμεθα — увидим."
  14: "ἐπιβάτας ἵππων — «всадников коней»; двусмысленно: два всадника или две упряжки (слав. «два всадника коней», Синод. «две пары коней»). ὀπίσω τοῦ βασιλέως Συρίας — вслед за царём Сирии. Δεῦτε καὶ ἴδετε — «идите и смотрите»."
  15: "ἕως τοῦ Ιορδάνου — до Иордана. πᾶσα ἡ ὁδός — вся дорога. σκεῦος — сосуд, утварь, здесь «оружие/вещи» (слав. «оружия»). ἐν τῷ θαμβεῖσθαι αὐτούς — «когда они ужаснулись» (θαμβέω). οἱ ἄγγελοι — посланные."
  16: "διήρπασεν — разграбил (διαρπάζω). κατὰ τὸ ῥῆμα κυρίου — по слову Господню. Повтор цены из ст. 1 как исполнение пророчества."
  17: "κατέστησεν — поставил. ἐπὶ τῆς πύλης — у ворот. συνεπάτησεν — растоптал. καθὰ ἐλάλησεν — как говорил. ἐν τῷ καταβῆναι τὸν ἄγγελον πρὸς αὐτόν — «когда сходил ангел к нему»; ἄγγελος здесь, вероятно, «посланный», тот самый тристат (слав. «посланный»); Синод. понимает как «царь»."
  18: "καθὰ ἐλάλησεν Ελισαιε πρὸς τὸν βασιλέα — как сказал Елисей царю. Пересказ ст. 1 (порядок величин обратный). ἔσται ὡς ἡ ὥρα αὕτη αὔριον — будет завтра в этот час."
  19: "Повтор ст. 2: ἀπεκρίθη ὁ τριστάτης τῷ Ελισαιε. В LXX снова нет «если» (Ἰδοὺ κύριος ποιεῖ καταρράκτας ἐν τῷ οὐρανῷ); слав. «аще Господь отверзет хляби небесныя» — внесено. ἐκεῖθεν οὐ φάγῃ — оттуда не будешь есть."
  20: "συνεπάτησεν αὐτὸν ὁ λαός — народ растоптал его. Исполнение предсказания 7:2, 19."
