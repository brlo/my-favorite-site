verses:
  0: "ダビデの詩[うた]。油[あぶら]を注[そそ]がれる前[まえ]のもの。"
  1: "主[しゅ]はわたしの光[ひかり]、わたしの救[すく]い。わたしはだれを恐[おそ]れようか。主[しゅ]はわたしの命[いのち]の砦[とりで]。わたしはだれを怖[こわ]がろうか。"
  2: "わたしの肉[にく]を食[く]らおうと、わたしに迫[せま]る悪[わる]い者[もの]ら、わたしを苦[くる]しめる者[もの]、わたしの敵[てき]は、自[みずか]らよろめいて倒[たお]れた。"
  3: "たとえ軍[ぐん]がわたしに向[む]かって陣[じん]を敷[し]いても、わたしの心[こころ]は恐[おそ]れない。たとえ戦[いくさ]がわたしに起[お]こっても、そのときこそ、わたしは望[のぞ]みを置[お]く。"
  4: "わたしは主[しゅ]に一[ひと]つを願[ねが]い、それをこそ求[もと]める。命[いのち]のある限[かぎ]り主[しゅ]の家[いえ]にとどまり、主[しゅ]の美[うつく]しさを仰[あお]ぎ、その神殿[しんでん]を訪[おとず]れることである。"
  5: "災[わざわ]いの日[ひ]に、主[しゅ]はわたしを幕屋[まくや]のうちに隠[かく]し、その幕屋[まくや]の奥[おく]深[ぶか]い所[ところ]にわたしをおおい、岩[いわ]の上[うえ]にわたしを高[たか]く立[た]てられるからである。"
  6: "今[いま]、わたしの頭[あたま]は、わたしを囲[かこ]む敵[てき]の上[うえ]に高[たか]く上[あ]げられた。わたしは幕屋[まくや]を巡[めぐ]り、その中[なか]で喜[よろこ]びの叫[さけ]びの供[そな]え物[もの]をささげ、主[しゅ]に歌[うた]い、ほめ歌[うた]おう。"
  7: "主[しゅ]よ、わたしが呼[よ]び求[もと]める声[こえ]を聞[き]いてください。わたしをあわれみ、わたしの声[こえ]を聞[き]いてください。"
  8: "わたしの心[こころ]はあなたに告[つ]げた。「わたしの顔[かお]はあなたを求[もと]めた」と。主[しゅ]よ、わたしはあなたの顔[かお]を求[もと]める。"
  9: "あなたの顔[かお]をわたしから隠[かく]さないでください。怒[いか]りのうちに、あなたの僕[しもべ]を遠[とお]ざけないでください。わたしの助[たす]けとなってください。わたしを退[しりぞ]けず、見捨[みす]てないでください。わたしの救[すく]いの神[かみ]よ。"
  10: "父[ちち]も母[はは]もわたしを見捨[みす]てた。しかし、主[しゅ]はわたしを受[う]け入[い]れてくださる。"
  11: "主[しゅ]よ、あなたの道[みち]をわたしに教[おし]えてください。わたしの敵[てき]のゆえに、まっすぐな道[みち]にわたしを導[みちび]いてください。"
  12: "わたしを苦[くる]しめる者[もの]らの思[おも]いのままに、わたしを渡[わた]さないでください。偽[いつわ]りの証人[しょうにん]らがわたしに向[む]かって立[た]ち、不正[ふせい]は自[みずか]らに偽[いつわ]りをついたからである。"
  13: "わたしは信[しん]じる。生[い]ける者[もの]の地[ち]で、主[しゅ]の恵[めぐ]みを見[み]ることを。"
  14: "主[しゅ]を待[ま]ち望[のぞ]め。雄々[おお]しくあれ。あなたの心[こころ]が強[つよ]くなるように。主[しゅ]を待[ま]ち望[のぞ]め。"

notes:
  0: "Τοῦ Δαυιδ πρὸ τοῦ χρισθῆναι — ダビデの詩、油を注がれる前のもの (χρίω — «помазывать»; πρὸ τοῦ χρισθῆναι — «прежде помазания»). Надписание — стих 0; по нему псалом относят ко времени до воцарения Давида."
  1: "Κύριος φωτισμός μου καὶ σωτήρ μου — 主はわたしの光、わたしの救い (φωτισμός — «просвещение, свет»; σωτήρ — «спаситель»). τίνα φοβηθήσομαι — わたしはだれを恐れようか; вопрос сохранён. κύριος ὑπερασπιστὴς τῆς ζωῆς μου — 主はわたしの命の砦 (ὑπερασπιστής — «заступник»; 砦[とりで] — термин корпуса, ср. Синодальный «крепость жизни моей»). ἀπὸ τίνος δειλιάσω — わたしはだれを怖がろうか (δειλιάω — «робеть»); два разных греческих глагола страха переданы 恐れる и 怖がる."
  2: "ἐν τῷ ἐγγίζειν ἐπ᾿ ἐμὲ κακοῦντας — когда приближались ко мне делающие зло (ἐγγίζω — «приближаться»; κακόω — «злодействовать»). τοῦ φαγεῖν τὰς σάρκας μου — わたしの肉を食らおうと (образ поглощения врагами). οἱ θλίβοντές με καὶ οἱ ἐχθροί μου — わたしを苦しめる者、わたしの敵. αὐτοὶ ἠσθένησαν καὶ ἔπεσαν — сами изнемогли и пали (аорист; в церковном чтении — совершившийся исход)."
  3: "ἐὰν παρατάξηται ἐπ᾿ ἐμὲ παρεμβολή — たとえ軍がわたしに陣を敷いても (παρεμβολή — «ополчение, лагерь»). οὐ φοβηθήσεται ἡ καρδία μου — わたしの心は恐れない. ἐὰν ἐπαναστῇ ἐπ᾿ ἐμὲ πόλεμος — たとえ戦がわたしに起こっても (ἐπανίστημι — «восставать»). ἐν ταύτῃ ἐγὼ ἐλπίζω — そのときこそ、わたしは望みを置く (ἐν ταύτῃ — «в этом»; Синодальный «и тогда буду надеяться»)."
  4: "μίαν ᾐτησάμην παρὰ κυρίου — わたしは主に一つを願い. ταύτην ἐκζητήσω — それをこそ求める. τοῦ κατοικεῖν με ἐν οἴκῳ κυρίου πάσας τὰς ἡμέρας τῆς ζωῆς μου — 命のある限り主の家にとどまり (κατοικέω — «обитать»; πάσας τὰς ἡμέρας τῆς ζωῆς — «во все дни жизни»). τοῦ θεωρεῖν με τὴν τερπνότητα τοῦ κυρίου — 主の美しさを仰ぎ (τερπνότης — «отрада, красота»). ἐπισκέπτεσθαι τὸν ναὸν αὐτοῦ — その神殿を訪れる (ἐπισκέπτομαι — «посещать, взыскивать»)."
  5: "ἔκρυψέν με ἐν σκηνῇ ἐν ἡμέρᾳ κακῶν μου — 災いの日に、主はわたしを幕屋のうちに隠し (σκηνή — 幕屋, как по корпусу). ἐσκέπασέν με ἐν ἀποκρύφῳ τῆς σκηνῆς αὐτοῦ — その幕屋の奥深い所にわたしをおおい (ἀπόκρυφος — «потаённое место»). ἐν πέτρᾳ ὕψωσέν με — 岩の上にわたしを高く立てられる (岩[いわ] — πέτρα)."
  6: "καὶ νῦν ἰδοὺ ὕψωσεν τὴν κεφαλήν μου ἐπ᾿ ἐχθρούς μου — и ныне вознёс голову мою над врагами; ἰδού передано 今, чтобы не дробить клаузу. ἐκύκλωσα καὶ ἔθυσα ἐν τῇ σκηνῇ αὐτοῦ θυσίαν ἀλαλαγμοῦ — わたしは幕屋を巡り、その中で喜びの叫びの供え物をささげ (κυκλόω — «обходить»; первое лицо сохранено, как в слав. «обыдох»). ᾄσομαι καὶ ψαλῶ τῷ κυρίῳ — 主に歌い、ほめ歌う."
  7: "εἰσάκουσον, κύριε, τῆς φωνῆς μου, ἧς ἐκέκραξα — 主よ、わたしが呼び求める声を聞いてください. ἐλέησόν με καὶ εἰσάκουσόν μου — わたしをあわれみ、わたしの声を聞いてください; повтор εἰσάκουσον сохранён (второй раз — «услышь меня»)."
  8: "σοὶ εἶπεν ἡ καρδία μου — わたしの心はあなたに告げた. Ἐζήτησεν τὸ πρόσωπόν μου — «лицо моё взыскало»; греч. третье лицо, ему следует славянское «взыска Тебе лице мое». Синодальный и jp-joc читают здесь повеление «ищите лица Моего» (по евр.); оставлено чтение славянского и греческого: わたしの顔はあなたを求めた. τὸ πρόσωπόν σου, κύριε, ζητήσω — 主よ、わたしはあなたの顔を求める (ответ псалмопевца)."
  9: "μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπ᾿ ἐμοῦ — あなたの顔をわたしから隠さないでください. μὴ ἐκκλίνῃς ἐν ὀργῇ ἀπὸ τοῦ δούλου σου — 怒りのうちに、あなたの僕を遠ざけないでください (ἐκκλίνω — «уклоняться»). βοηθός μου γενοῦ — わたしの助けとなってください. μὴ ἀποσκορακίσῃς με — わたしを退けず (ἀποσκορακίζω — «отвергать, прогонять»). μὴ ἐγκαταλίπῃς με, ὁ θεὸς ὁ σωτήρ μου — 見捨てないでください、わたしの救いの神よ."
  10: "ὁ πατήρ μου καὶ ἡ μήτηρ μου ἐγκατέλιπόν με — 父も母もわたしを見捨てた. ὁ δὲ κύριος προσελάβετό με — しかし主はわたしを受け入れてくださる (προσλαμβάνω — «принимать к себе»); аорист «оставили» и настоящее-будущее «примет» сохранены."
  11: "νομοθέτησόν με τῇ ὁδῷ σου — あなたの道をわたしに教えてください (νομοθετέω — «наставлять в законе»). ὁδήγησόν με ἐν τρίβῳ εὐθείᾳ — まっすぐな道にわたしを導いてください (τρίβος — «стезя»). ἕνεκα τῶν ἐχθρῶν μου — わたしの敵のゆえに (ради врагов, чтобы не злорадствовали)."
  12: "μὴ παραδῷς με εἰς ψυχὰς θλιβόντων με — не предай меня во власть притесняющих; わたしを苦しめる者らの思いのままに渡さないでください. ἐπανέστησάν μοι μάρτυρες ἄδικοι — 偽りの証人らがわたしに向かって立った. ἐψεύσατο ἡ ἀδικία ἑαυτῇ — 不正は自らに偽りをついた (букв. «солгала неправда себе»; Синодальный по иному чтению: «дышат злобою»)."
  13: "πιστεύω τοῦ ἰδεῖν τὰ ἀγαθὰ κυρίου ἐν γῇ ζώντων — わたしは信じる、生ける者の地で主の恵みを見ることを (τὰ ἀγαθά — «благая»; ἐν γῇ ζώντων — 生ける者の地). Вера выражена настоящим, как в греческом."
  14: "ὑπόμεινον τὸν κύριον — 主を待ち望め (ὑπομένω — «терпеливо ждать»). ἀνδρίζου — 雄々しくあれ (ἀνδρίζομαι — «мужаться»). κραταιούσθω ἡ καρδία σου — あなたの心が強くなるように (пассивное пожелание «да укрепляется»). Повтор ὑπόμεινον сохранён в начале и в конце стиха."
