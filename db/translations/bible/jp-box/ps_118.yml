notes:
  0: "Αλληλουια — アレルヤ. В gr-lxx-byz это стих 0, надписание-славословие (в евр. тексте Пс 118 — без надписания, но в LXX и в русской базе сайта стоит «Аллилуия»). Нумерация церковная: 0 — надписание, 1–176 — стихи. Псалом — акростих: 22 строфы по 8 стихов, каждая начинается с очередной буквы евр. алфавита; в gr-lxx-byz буква стоит в конце последнего стиха строфы (α αλφ, β βηθ, γ γιμαλ … κβ θαυ). Эти названия букв не переводятся — как у jp-joc; членение на строфы сохранено в разбивке стихов (1–8, 9–16 и т. д.) и в notes. Восьмикратный ритм и повтор синонимов (律法, 御言葉, 仰せ, 定め, 戒め, 掟, 証, 道) удержаны: каждый стих переведён отдельно, повторы не сведены в прозу, ключевым терминам дано по одному постоянному соответствию (см. notes 1–16)."
  1: "Μακάριοι οἱ ἄμωμοι ἐν ὁδῷ — 幸いなのは、その道に傷のない者. ἄμωμος — «непорочный, без изъяна» (玷 у jp-joc), передано 傷[きず]のない; ὁδός здесь и далее — 道[みち] (постоянное соответствие). οἱ πορευόμενοι ἐν νόμῳ κυρίου — 主の律法のうちを歩む者; νόμος — 律法[りっぽう], как по всему корпусу. Формула 幸いなのは…者である — как в Пс 1:1."
  2: "μακάριοι οἱ ἐξερευνῶντες τὰ μαρτύρια αὐτοῦ — 幸いなのは、その証を探り求める者. μαρτύριον — 証[あかし] (первое место; постоянное соответствие, чтобы отличать от δικαίωμα — 掟 и κρίμα — 定め). ἐξερευνάω — «исследовать, разыскивать» → 探り求める. ἐν ὅλῃ καρδίᾳ ἐκζητήσουσιν αὐτόν — 心を尽くして主を求める者; греч. будущее время, по-русски и по-японски естественнее настоящее."
  3: "οὐ γὰρ οἱ ἐργαζόμενοι τὴν ἀνομίαν ἐν ταῖς ὁδοῖς αὐτοῦ ἐπορεύθησαν — букв. «ибо не делающие беззакония ходили путями Его»; смысл: делающие беззаконие не ходили Его путями, они не таковы, как блаженные из ст. 1–2. ἀνομία — 不法[ふほう] (постоянное соответствие). Аорист сохранён прошедшим временем."
  4: "σὺ ἐνετείλω τὰς ἐντολάς σου φυλάξασθαι σφόδρα — あなたは、あなたの戒めを固く守るように命じられた. ἐντολή — 戒[いまし]め (первое место; постоянное соответствие ἐντολή = 戒め, тогда как δικαίωμα = 掟, чтобы восемь синонимов не слились). σφόδρα — «крепко, весьма» → 固く."
  5: "ὄφελον κατευθυνθείησαν αἱ ὁδοί μου — どうか、わたしの道が…向けられますように. ὄφελον — «о если бы», оптатив; по-японски どうか…ますように. δικαιώματα — 掟[おきて] (первое место; постоянное соответствие δικαίωμα = 掟). τοῦ φυλάξασθαι — «к соблюдению» → 守るほうへ."
  6: "τότε οὐ μὴ ἐπαισχυνθῶ — そのとき…恥じることはない. Двойное отрицание οὐ μή с аористом сослагательного — усиленное «никак не постыжусь». ἐν τῷ με ἐπιβλέπειν ἐπὶ πάσας τὰς ἐντολάς σου — «когда я взираю на все заповеди Твои» → …に目を留めても."
  7: "ἐξομολογήσομαί σοι, κύριε — 主よ、…あなたに感謝する. ἐξομολογέω в псалмах — «исповедовать, славить, благодарить»; передано 感謝する, чтобы не путать с исповедью греха. ἐν εὐθύτητι καρδίας — 心のまっすぐさをもって. κρίματα — 定[さだ]め (первое место; постоянное соответствие κρίμα = 定め). εὐθύτης — «прямота» → まっすぐさ. ἐν τῷ μεμαθηκέναι με — «когда я научился»; передано деепричастным оборотом 学び…感謝する, временная связь сохранена."
  8: "τὰ δικαιώματά σου φυλάξω — わたしはあなたの掟を守る. μή με ἐγκαταλίπῃς ἕως σφόδρα — «не оставь меня совсем/до конца» → 全く見捨てないでください. В конце стиха в gr-lxx-byz стоит буква строфы β βηθ — не переводится (см. notes 0)."
  9: "Ἐν τίνι κατορθώσει ὁ νεώτερος τὴν ὁδὸν αὐτοῦ — 若い者は、何によって自分の道を清く保つことができるのか. κατορθόω — «направлять, исправлять»; 清く保つ — по церковному пониманию (Синодальный: «содержать в чистоте»). λόγος — 御言葉[みことば] (первое место; постоянное соответствие λόγος = 御言葉, чтобы отличать от λόγιον = 仰せ; обычное 言葉 остаётся для не-терминологических «слово, ответ» в ст. 42–43)."
  10: "ἐν ὅλῃ καρδίᾳ μου ἐξεζήτησά σε — わたしは心を尽くしてあなたを求めた. μὴ ἀπώσῃ με ἀπὸ τῶν ἐντολῶν σου — «не отринь меня от заповедей Твоих» → 戒めからわたしを退けないでください (ἀπωθέω — «отталкивать»)."
  11: "ἐν τῇ καρδίᾳ μου ἔκρυψα τὰ λόγιά σου — わたしはあなたの仰せを心に隠しました. λόγιον — 仰[おお]せ (первое место; постоянное соответствие). Выбор: λόγιον — «изречение, вещание» (в слав. и Синодальном «словеса»); 宣言 было бы калькой и звучало бы как публичное заявление, поэтому взято 仰せ — «слово-изволение Господа», не смешивающееся ни с 御言葉 (λόγος), ни с 戒め (ἐντολή). ὅπως ἂν μὴ ἁμάρτω σοι — あなたに対して罪を犯さないためである."
  12: "εὐλογητὸς εἶ, κύριε — 主よ、あなたはほめたたえられる方である. εὐλογητός — «благословен», в 常体 — ほめたたえられる方. δίδαξόν με τὰ δικαιώματά σου — あなたの掟をわたしに教えてください; δίδαξον на протяжении псалма — 教えてください."
  13: "ἐν τοῖς χείλεσίν μου ἐξήγγειλα — わたしは唇で…告げ知らせました (ἐξαγγέλλω — «возвещать»). πάντα τὰ κρίματα τοῦ στόματός σου — あなたの口のすべての定め; «уста Твои» в евр. параллелизме — источник слова, поэтому 口."
  14: "ἐν τῇ ὁδῷ τῶν μαρτυρίων σου ἐτέρφθην — わたしはあなたの証の道を…楽しんだ (τέρπομαι — «наслаждаться»). ὡς ἐπὶ παντὶ πλούτῳ — «как о всяком богатстве» → どんな富にもまさる喜びとして; сравнение с богатством сохранено."
  15: "ἐν ταῖς ἐντολαῖς σου ἀδολεσχήσω — わたしはあなたの戒めのことを考える. ἀδολεσχέω — «размышлять, беседовать»; постоянное соответствие ἀδολεσχέω = 考[かんが]える (в отличие от μελετάω = 思い巡らす). κατανοήσω τὰς ὁδούς σου — あなたの道をじっと見つめる (κατανοέω — «вникать, всматриваться»)."
  16: "ἐν τοῖς δικαιώμασίν σου μελετήσω — わたしはあなたの掟を思い巡らし. μελετάω/μελέτη — 思[おも]い巡[めぐ]らす (первое место; постоянное соответствие, ср. ст. 24, 47, 77, 92, 143, 174). οὐκ ἐπιλήσομαι τῶν λόγων σου — あなたの御言葉を忘れない; λόγος = 御言葉."
  17: "Ἀνταπόδος τῷ δούλῳ σου — あなたの僕に報いてください. ἀνταποδίδωμι — «воздать»; здесь в хорошем смысле — «награди, яви милость» (ср. ru «Яви милость рабу Твоему»). ζήσομαι καὶ φυλάξω — そうすれば、わたしは生きて…守ります; будущее передано условно-следственной связью, как в евр. поэзии."
  18: "ἀποκάλυψον τοὺς ὀφθαλμούς μου — わたしの目を開いてください (ἀποκαλύπτω — «открыть, снять покров»). κατανοήσω τὰ θαυμάσιά σου ἐκ τοῦ νόμου σου — あなたの律法のうちにある驚くべきわざを見ます; θαυμάσια — 驚くべきわざ (постоянно в псалме)."
  19: "πάροικος ἐγώ εἰμι ἐν τῇ γῇ — わたしはこの地にあって旅人である (πάροικος — «пришелец, поселенец без прав»). μὴ ἀποκρύψῃς ἀπ᾿ ἐμοῦ τὰς ἐντολάς σου — あなたの戒めをわたしから隠さないでください; ср. ст. 54 παροικία — 旅する地."
  20: "ἐπεπόθησεν ἡ ψυχή μου τοῦ ἐπιθυμῆσαι — わたしの魂は…慕い求めて焦がれている; греч. усилительное сочетание «возжелала желанием» сохранено двумя глаголами. τὰ κρίματά σου ἐν παντὶ καιρῷ — いつもあなたの定めを. ψυχή — 魂[たましい]."
  21: "ἐπετίμησας ὑπερηφάνοις — あなたは高慢な者を叱られた (ἐπιτιμάω — «запрещать, укрощать»; ru «укротил»). ἐπικατάρατοι οἱ ἐκκλίνοντες ἀπὸ τῶν ἐντολῶν σου — 戒めからそれる者たちは呪われている. ὑπερήφανοι — 高慢[こうまん]な者 (постоянно в псалме)."
  22: "περίελε ἀπ᾿ ἐμοῦ ὄνειδος καὶ ἐξουδένωσιν — わたしからそしりと軽蔑を取り除いてください (περιαιρέω — «снимать»; ἐξουδένωσις — «уничижение»). ὅτι τὰ μαρτύριά σου ἐξεζήτησα — わたしはあなたの証を求めたからである."
  23: "καὶ γὰρ ἐκάθισαν ἄρχοντες καὶ κατ᾿ ἐμοῦ κατελάλουν — 支配者たちが座ってわたしを悪く言っても (καταλαλέω — «злословить»; ἄρχοντες — 支配者, в Синодальном «князья»). ὁ δὲ δοῦλός σου ἠδολέσχει ἐν τοῖς δικαιώμασίν σου — あなたの僕はあなたの掟を考える; имперфект, отсюда длящееся 考える."
  24: "τὰ μαρτύριά σου μελέτη μού ἐστιν — あなたの証はわたしの思い巡らすところであり (μελέτη — «размышление»; формула 思い巡らすところ повторяется в ст. 77, 92, 143, 174). αἱ συμβουλίαι μου τὰ δικαιώματά σου — «советы мои — оправдания Твои», т. е. они мои советники → 掟はわたしの相談相手である (ср. ru «уставы Твои — советники мои»)."
  25: "ἐκολλήθη τῷ ἐδάφει ἡ ψυχή μου — わたしの魂は塵に貼りついた (κολλάω — «прилепляться»; ἔδαφος — «земля, прах»). ζῆσόν με κατὰ τὸν λόγον σου — あなたの御言葉によって、わたしを生かしてください; ζῆσόν με (каузатив от ζάω) — постоянное 生かしてください."
  26: "τὰς ὁδούς μου ἐξήγγειλα, καὶ ἐπήκουσάς μου — わたしが自分の道を告げると、あなたはわたしに答えてくださった. δίδαξόν με τὰ δικαιώματά σου — あなたの掟をわたしに教えてください."
  27: "ὁδὸν δικαιωμάτων σου συνέτισόν με — あなたの掟の道をわたしに悟らせてください; συνετίζω — 悟[さと]らせる (постоянное соответствие). ἀδολεσχήσω ἐν τοῖς θαυμασίοις σου — あなたの驚くべきわざを考える; ἀδολεσχέω = 考える."
  28: "ἔσταξεν ἡ ψυχή μου ἀπὸ ἀκηδίας — わたしの魂は憂いに沈んで溶けてゆく (στάζω — «капать, истекать»; ἀκηδία — «уныние, изнеможение»). βεβαίωσόν με ἐν τοῖς λόγοις σου — あなたの御言葉によって、わたしを強くしてください (βεβαιόω — «утверждать»)."
  29: "ὁδὸν ἀδικίας ἀπόστησον ἀπ᾿ ἐμοῦ — 不正の道をわたしから遠ざけてください. τῷ νόμῳ σου ἐλέησόν με — «по закону Твоему помилуй меня» (дат. нормы; ср. ru «закон Твой даруй мне» — иное чтение); передано 律法に従って."
  30: "ὁδὸν ἀληθείας ᾑρετισάμην — わたしは真理の道を選んだ (αἱρέομαι — «избирать»). τὰ κρίματά σου οὐκ ἐπελαθόμην — あなたの定めを忘れなかった. ἀλήθεια — 真理[しんり]."
  31: "ἐκολλήθην τοῖς μαρτυρίοις σου — わたしはあなたの証にすがりついた. κύριε, μή με καταισχύνῃς — 主よ、わたしを恥じさせないでください (καταισχύνω — «посрамлять»)."
  32: "ὁδὸν ἐντολῶν σου ἔδραμον — わたしはあなたの戒めの道を走った. ὅταν ἐπλάτυνας τὴν καρδίαν μου — あなたがわたしの心を広くしてくださったとき (πλατύνω — «расширять»); образ простора связан со ст. 45 ἐν πλατυσμῷ."
  33: "Νομοθέτησόν με, κύριε, τὴν ὁδὸν τῶν δικαιωμάτων σου — 主よ、あなたの掟の道をわたしに示して教えてください (νομοθετέω — «давать закон, узаконять»; по-японски 示して教える, потому что 教え定める звучит как несуществующий сложный глагол). ἐκζητήσω αὐτὴν διὰ παντός — いつまでもそれを求めます."
  34: "συνέτισόν με, καὶ ἐξερευνήσω τὸν νόμον σου — わたしに悟らせてください、そうすれば…律法を探り求め. φυλάξω αὐτὸν ἐν ὅλῃ καρδίᾳ μου — 心を尽くしてそれを守ります."
  35: "ὁδήγησόν με ἐν τρίβῳ τῶν ἐντολῶν σου — あなたの戒めの小道にわたしを導いてください (τρίβος — «тропа»; ср. ст. 105 小道). ὅτι αὐτὴν ἠθέλησα — わたしはそれを望んだからである."
  36: "κλῖνον τὴν καρδίαν μου εἰς τὰ μαρτύριά σου — わたしの心をあなたの証へと傾けてください. καὶ μὴ εἰς πλεονεξίαν — むさぼりへは傾けないでください (πλεονεξία — «корыстолюбие, стяжание»)."
  37: "ἀπόστρεψον τοὺς ὀφθαλμούς μου τοῦ μὴ ἰδεῖν ματαιότητα — わたしの目をそらして、むなしいものを見ないようにしてください (ματαιότης — «суета, пустое»). ἐν τῇ ὁδῷ σου ζῆσόν με — あなたの道によって、わたしを生かしてください."
  38: "στῆσον τῷ δούλῳ σου τὸ λόγιόν σου εἰς τὸν φόβον σου — あなたの仰せを…あなたを恐れることのために固く据えてください (ἵστημι — «ставить, утверждать»; ср. ru «Утверди слово Твое рабу Твоему, ради благоговения пред Тобою»)."
  39: "περίελε τὸν ὀνειδισμόν μου, ὃν ὑπώπτευσα — わたしが恐れているそしりを取り除いてください (ὑποπτεύω — «опасаться, подозревать»). τὰ γὰρ κρίματά σου χρηστά — あなたの定めは良いからである (χρηστός — «благой»)."
  40: "ἰδοὺ ἐπεθύμησα τὰς ἐντολάς σου — 見よ、わたしはあなたの戒めを慕い求めた. ἐν τῇ δικαιοσύνῃ σου ζῆσόν με — あなたの義によって、わたしを生かしてください; δικαιοσύνη — 義[ぎ]."
  41: "Καὶ ἔλθοι ἐπ᾿ ἐμὲ τὸ ἔλεός σου — あなたのあわれみが…わたしに来ますように (оптатив). τὸ σωτήριόν σου κατὰ τὸ λόγιόν σου — あなたの仰せに従って、あなたの救いとなって; τὸ σωτήριόν σου стоит в греч. в приложении к τὸ ἔλεός σου («милость Твоя, спасение Твоё»), поэтому 救いとなって. σωτήριον — 救[すく]い (постоянно). ἔλεος — あわれみ (постоянно)."
  42: "καὶ ἀποκριθύσομαι τοῖς ὀνειδίζουσί με λόγον — わたしをそしる者に答える言葉がある (ἀποκρίνομαι — «отвечать»; λόγον здесь — «ответ», не «слово Божие», поэтому 言葉, а не 御言葉). ὅτι ἤλπισα ἐπὶ τοὺς λόγους σου — わたしはあなたの御言葉に望みを置いたからである."
  43: "καὶ μὴ περιέλῃς ἐκ τοῦ στόματός μου λόγον ἀληθείας ἕως σφόδρα — わたしの口から真理の言葉を全く取り去らないでください (λόγος ἀληθείας — «слово истины», не термин, поэтому 言葉). ὅτι ἐπὶ τὰ κρίματά σου ἐπήλπισα — あなたの定めに望みを置いたからである."
  44: "καὶ φυλάξω τὸν νόμον σου διὰ παντός — わたしはあなたの律法をいつまでも…守ります. εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος — 世々限りなく (дословный повтор «в век и в век века» передан устойчивой формулой)."
  45: "καὶ ἐπορευόμην ἐν πλατυσμῷ — わたしは広いところを歩んだ (πλατυσμός — «простор»; имперфект, отсюда прошедшее). ὅτι τὰς ἐντολάς σου ἐξεζήτησα — あなたの戒めを求めたからである; ср. ст. 32 (расширенное сердце) и 96 (широкая заповедь)."
  46: "καὶ ἐλάλουν ἐν τοῖς μαρτυρίοις σου ἐναντίον βασιλέων — わたしは王たちの前で、あなたの証について語り (ἐναντίον — «пред лицом»). καὶ οὐκ ᾐσχυνόμην — 恥じなかった; имперфект, длящееся состояние."
  47: "καὶ ἐμελέτων ἐν ταῖς ἐντολαῖς σου — わたしは…あなたの戒めを思い巡らす (μελετάω — 思い巡らす). αἷς ἠγάπησα σφόδρα — 心から愛した."
  48: "καὶ ἦρα τὰς χεῖράς μου πρὸς τὰς ἐντολάς σου — わたしは…あなたの戒めに手を上げ (αἴρω — «поднимать»; жест молитвы и клятвы). ἃς ἠγάπησα — 愛する. ἠδολέσχουν ἐν τοῖς δικαιώμασίν σου — あなたの掟のことを考える; ἀδολεσχέω = 考える."
  49: "Μνήσθητι τὸν λόγον σου τῷ δούλῳ σου — その御言葉を思い起してください. ᾧ ἐπήλπισάς με — «на которое Ты велел мне уповать»; передано それに望みを置かせられた."
  50: "αὕτη με παρεκάλεσεν ἐν τῇ ταπεινώσει μου — これがわたしの苦しみのうちでわたしを慰めた (ταπείνωσις — «уничижение, бедствие»). ὅτι τὸ λόγιόν σου ἔζησέν με — あなたの仰せがわたしを生かしたからである."
  51: "ὑπερήφανοι παρηνόμουν ἕως σφόδρα — 高慢な者たちはひどく不法を働いた (παρανομέω — «беззаконствовать», имперфект). ἀπὸ δὲ τοῦ νόμου σου οὐκ ἐξέκλινα — しかし、わたしはあなたの律法からそれなかった."
  52: "ἐμνήσθην τῶν κριμάτων σου ἀπ᾿ αἰῶνος, κύριε — 主よ、わたしは昔からのあなたの定めを思い起し. καὶ παρεκλήθην — 慰められた (παρακαλέω — «утешать»)."
  53: "ἀθυμία κατέσχεν με ἀπὸ ἁμαρτωλῶν — 罪人たちのゆえに、わたしは恐れに捕らわれた. ἀθυμία — «уныние, досада»; в церковном чтении (ru, Синодальный) — «ужас», у jp-joc «изумление и страх»; выбран 恐れ, так как речь о потрясении при виде отступников, а не об унынии. τῶν ἐγκαταλιμπανόντων τὸν νόμον σου — 律法を捨てる."
  54: "ψαλτὰ ἦσάν μοι τὰ δικαιώματά σου — あなたの掟は…わたしの歌となった (ψαλτός — «песнь, воспеваемое»). ἐν τόπῳ παροικίας μου — わたしが旅する地で; ср. ст. 19 πάροικος."
  55: "ἐμνήσθην ἐν νυκτὶ τοῦ ὀνόματός σου, κύριε — 主よ、わたしは夜にあなたの名を思い起し. καὶ ἐφύλαξα τὸν νόμον σου — あなたの律法を守った."
  56: "αὕτη ἐγενήθη μοι — これがわたしのものとなった (букв. «это стало мне»). ὅτι τὰ δικαιώματά σου ἐξεζήτησα — あなたの掟を求めたからである; ср. ст. 54, где これ = песни оправданий."
  57: "Μερὶς μου κύριε, εἶπα φυλάξασθαι τὸν νόμον σου — «Удел мой, Господи, сказал я, — хранить закон Твой»; в греч. нет ἐστί, поэтому передано косвенной речью: 守ることがわたしの分だと言った (ср. ru «Удел мой, Господи, сказал я, соблюдать слова Твои»)."
  58: "ἐδεήθην τοῦ προσώπου σου ἐν ὅλῃ καρδίᾳ μου — わたしは心を尽くしてあなたの御顔を求めて願った (δέομαι — «умолять»; «лицо Твое» — 御顔). ἐλέησόν με κατὰ τὸ λόγιόν σου — あなたの仰せに従って、わたしをあわれんでください."
  59: "διελογισάμην τὰς ὁδούς σου — わたしはあなたの道を思い巡らし (διαλογίζομαι — «размышлять, рассуждать»). ἐπέστρεψα τοὺς πόδας μου εἰς τὰ μαρτύριά σου — あなたの証へと足を向けた."
  60: "ἡτοιμάσθην καὶ οὐκ ἐταράχθην τοῦ φυλάξασθαι τὰς ἐντολάς σου — 備えを整え、少しも慌てなかった (ἑτοιμάζω — «готовить»; ταράσσω — «смущать»; ru «Спешил и не медлил» — иная передача)."
  61: "σχοινία ἁμαρτωλῶν περιεπλάκησάν μοι — 罪人たちの綱がわたしに絡みついた (σχοινίον — «верёвка»; περιπλέκω — «опутывать»; в Синодальном «сети», у jp-joc «網» — здесь сохранён образ верёвок). τοῦ νόμου σου οὐκ ἐπελαθόμην — 律法を忘れなかった."
  62: "μεσονύκτιον ἐξηγειρόμην τοῦ ἐξομολογεῖσθαί σοι — 真夜中にわたしは起きて…あなたに感謝した (μεσονύκτιον — «в полночь»; ἐξεγείρω — «пробуждаться, вставать», имперфект — отсюда 起きて). ἐπὶ τὰ κρίματα τῆς δικαιοσύνης σου — あなたの義の定めのゆえに."
  63: "μέτοχος ἐγώ εἰμι πάντων τῶν φοβουμένων σε — わたしは…すべての者の仲間である (μέτοχος — «участник, сообщник»). τῶν φυλασσόντων τὰς ἐντολάς σου — あなたの戒めを守る者たち."
  64: "τοῦ ἐλέους σου, κύριε, πλήρης ἡ γῆ — 主よ、地はあなたのあわれみに満ちている. τὰ δικαιώματά σου δίδαξόν με — あなたの掟をわたしに教えてください; ср. ст. 12, 26, 33, 35."
  65: "Χρηστότητα ἐποίησας μετὰ τοῦ δούλου σου, κύριε, κατὰ τὸν λόγον σου — 主よ、あなたは御言葉に従って、あなたの僕に良いことをしてくださいました (χρηστότης — «благость»; ποιέω μετά — «поступать с кем-либо»)."
  66: "χρηστότητα καὶ παιδείαν καὶ γνῶσιν δίδαξόν με — わたしに善と、教えと、知識とを授けてください. παιδεία — «наставление, научение» → 教[おし]え (постоянное соответствие, однократное слово). В ru «доброму разумению и ведению» — две пары; в греч. три члена, они сохранены. ὅτι ταῖς ἐντολαῖς σου ἐπίστευσα — あなたの戒めを信じたからである."
  67: "πρὸ τοῦ με ταπεινωθῆναι ἐγὼ ἐπλημμέλησα — 苦しめられる前に、わたしは迷い出た (πλημμελέω — «заблуждаться, грешить»; ταπεινόω — «смирять, поражать»). διὰ τοῦτο τὸ λόγιόν σου ἐφύλαξα — それゆえ、あなたの仰せを守った."
  68: "χρηστὸς εἶ σύ, κύριε — 主よ、あなたは良い方であり. ἐν τῇ χρηστότητί σου δίδαξόν με τὰ δικαιώματά σου — あなたの良さによって、あなたの掟をわたしに教えてください; повтор корня χρηστ- сохранён (良い方 — 良さ)."
  69: "ἐπληθύνθη ἐπ᾿ ἐμὲ ἀδικία ὑπερηφάνων — 高慢な者たちの不正がわたしの上に増え広がった (πληθύνω — «умножать»). ἐγὼ δὲ ἐν ὅλῃ καρδίᾳ μου ἐξερευνήσω τὰς ἐντολάς σου — わたしは心を尽くしてあなたの戒めを探り求める (ἐξερευνάω — 探り求める)."
  70: "ἐτυρώθη ὡς γάλα ἡ καρδία αὐτῶν — 彼らの心は乳のように固まった (τυρόω — «сгущать, как сыр»; образ ожиревшего, застывшего сердца, ср. ru «Ожирело сердце их, как тук»). ἐγὼ δὲ τὸν νόμον σου ἐμελέτησα — わたしはあなたの律法を思い巡らした."
  71: "ἀγαθόν μοι ὅτι ἐταπείνωσάς με — あなたがわたしを苦しめられたことは、わたしにとって良かった. ὅπως ἂν μάθω τὰ δικαιώματά σου — あなたの掟を学ぶためである (μανθάνω — 学ぶ)."
  72: "ἀγαθόν μοι ὁ νόμος τοῦ στόματός σου — あなたの口の律法は、わたしにとって…良い. ὑπὲρ χιλιάδας χρυσίου καὶ ἀργυρίου — 幾千の金や銀にもまさって (χιλιάς — «тысяча», мн. «тысячи»)."
  73: "Αἱ χεῖρές σου ἐποίησάν με καὶ ἔπλασάν με — あなたの手がわたしを造り、わたしを形づくった (πλάσσω — «лепить, ваять»). συνέτισόν με, καὶ μαθήσομαι τὰς ἐντολάς σου — わたしに悟らせてください、そうすれば…戒めを学びます."
  74: "οἱ φοβούμενοί σε ὄψονταί με καὶ εὐφρανθήσονται — あなたを恐れる者たちはわたしを見て喜ぶ. ὅτι εἰς τοὺς λόγους σου ἐπήλπισα — わたしがあなたの御言葉に望みを置いたからである."
  75: "ἔγνων, κύριε, ὅτι δικαιοσύνη τὰ κρίματά σου — 主よ、わたしは知った、あなたの定めは義であり. καὶ ἀληθεία ἐταπείνωσάς με — あなたは真実をもってわたしを苦しめられた (дат. образа действия)."
  76: "γενηθήτω δὴ τὸ ἔλεός σου τοῦ παρακαλέσαι με — どうか、あなたのあわれみが…わたしを慰めますように (γενηθήτω — императив 3 л.). κατὰ τὸ λόγιόν σου τῷ δούλῳ σου — あなたの仰せに従って、あなたの僕を."
  77: "ἐλθέτωσάν μοι οἱ οἰκτιρμοί σου, καὶ ζήσομαι — あなたの慈しみがわたしに来ますように、そうすれば、わたしは生きます. οἰκτιρμός — 慈[いつく]しみ (постоянное соответствие, чтобы отличать от ἔλεος = あわれみ). ὅτι ὁ νόμος σου μελέτη μού ἐστιν — あなたの律法はわたしの思い巡らすところだからである."
  78: "αἰσχυνθήτωσαν ὑπερήφανοι — 高慢な者たちが恥じますように (императив 3 л., пожелание). ὅτι ἀδίκως ἠνόμησαν εἰς ἐμέ — 彼らは不当にもわたしに不法を働いたからである. ἐγὼ δὲ ἀδολεσχήσω ἐν ταῖς ἐντολαῖς σου — しかし、わたしはあなたの戒めを考える."
  79: "ἐπιστρεψάτωσάν μοι οἱ φοβούμενοί σε — あなたを恐れる者たちが、わたしのもとへ戻りますように (ἐπιστρέφω — «обращать(ся)»). καὶ οἱ γινώσκοντες τὰ μαρτύριά σου — あなたの証を知る者たち."
  80: "γενηθήτω ἡ καρδία μου ἄμωμος ἐν τοῖς δικαιώμασίν σου — わたしの心が、あなたの掟のうちで傷のないものとなりますように (ἄμωμος — как в ст. 1). ὅπως ἂν μὴ αἰσχυνθῶ — わたしが恥じないためである."
  81: "Ἐκλείπει εἰς τὸ σωτήριόν σου ἡ ψυχή μου — わたしの魂はあなたの救いを待ち望んで衰え (ἐκλείπω — «истаевать, изнемогать»). καὶ εἰς τὸν λόγον σου ἐπήλπισα — あなたの御言葉に望みを置いた."
  82: "ἐξέλιπον οἱ ὀφθαλμοί μου εἰς τὸ λόγιόν σου — あなたの仰せを待つうちに、わたしの目は衰えた. λέγοντες· Πότε παρακαλέσεις με — прямая речь: 「いつ、あなたはわたしを慰めてくださるのか」; кавычки первого уровня, так как псалмопевец передаёт свои же слова, а не вкладывает их в чужую речь."
  83: "ὅτι ἐγενήθην ὡς ἀσκὸς ἐν πάχνῃ — わたしは煙の中の皮袋のようになった. πάχνη — «иней, мороз»; церковное понимание (ru «мех в дыму», jp-joc «革囊の烟の中») — кожаный мех, прокопчённый и сморщенный; образ сохранён, греч. слово указано здесь. τὰ δικαιώματά σου οὐκ ἐπελαθόμην — あなたの掟を忘れなかった."
  84: "πόσαι εἰσὶν αἱ ἡμέραι τοῦ δούλου σου — あなたの僕の日はどれほどなのか. πότε ποιήσεις μοι ἐκ τῶν καταδιωκόντων με κρίσιν — いつ、あなたは、わたしを迫害する者たちに対して裁きを行われるのか (κρίσις — 裁[さば]き; ср. κρίμα = 定め)."
  85: "διηγήσαντό μοι παράνομοι ἀδολεσχίας — 不法な者たちはわたしにむなしい話を語った (ἀδολεσχία — «пустословие»). ἀλλ᾿ οὐχ ὡς ὁ νόμος σου, κύριε — しかし、主よ、それはあなたの律法のようではなかった. В ru и Синодальном здесь иное чтение («яму вырыли мне гордые»); переведён текст gr-lxx-byz."
  86: "πᾶσαι αἱ ἐντολαί σου ἀλήθεια — あなたの戒めはすべて真実である. ἀδίκως κατεδίωξάν με, βοήθησόν μοι — 彼らは不当にもわたしを迫害した、わたしを助けてください."
  87: "παρὰ βραχὺ συνετέλεσάν με ἐν τῇ γῇ — 彼らは地の上でわたしをほとんど滅ぼし尽くした (παρὰ βραχύ — «едва не»; συντελέω — «довершать, истреблять»). ἐγὼ δὲ οὐκ ἐγκατέλιπον τὰς ἐντολάς σου — わたしはあなたの戒めを捨てなかった."
  88: "κατὰ τὸ ἔλεός σου ζῆσόν με — あなたのあわれみによって、わたしを生かしてください. καὶ φυλάξω τὰ μαρτύρια τοῦ στόματός σου — あなたの口の証を守ります (ср. ст. 13: «уста/рот Твой» как источник слова)."
  89: "Εἰς τὸν αἰῶνα, κύριε, ὁ λόγος σου διαμένει ἐν τῷ οὐρανῷ — 主よ、あなたの御言葉はとこしえに天に立っている (διαμένω — «пребывать»; εἰς τὸν αἰῶνα — とこしえに). Начало новой строфы (ламед)."
  90: "εἰς γενεὰν καὶ γενεὰν ἡ ἀλήθειά σου — あなたの真実は代々に及ぶ. ἐθεμελίωσας τὴν γῆν, καὶ διαμένει — あなたが地を据えられたので、地は立っている (θεμελιόω — «основывать»)."
  91: "τῇ διατάξει σου διαμένει ἡ ἡμέρα — あなたの定めによって昼は立っている. διαταγή — «устав, чин, порядок» (однократное слово); передано 定め, как и κρίμα, потому что здесь речь не о суде, а об установленном Богом порядке творения; на постоянное соответствие κρίμα = 定め это не влияет. ὅτι τὰ σύμπαντα δοῦλα σά — すべてのものはあなたの僕だからである."
  92: "εἰ μὴ ὅτι ὁ νόμος σου μελέτη μού ἐστιν — もしあなたの律法がわたしの思い巡らすところでなかったなら. τότε ἂν ἀπωλόμην ἐν τῇ ταπεινώσει μου — わたしは苦しみのうちに滅びていた (ἀπόλλυμι — «погибать»)."
  93: "εἰς τὸν αἰῶνα οὐ μὴ ἐπιλάθωμαι τῶν δικαιωμάτων σου — わたしはあなたの掟をいつまでも忘れない (усиленное οὐ μή). ὅτι ἐν αὐτοῖς ἔζησάς με, κύριε — あなたがそれによってわたしを生かされたからである."
  94: "σός εἰμι ἐγώ, σῶσόν με — わたしはあなたのものである、わたしを救ってください. ὅτι τὰ δικαιώματά σου ἐξεζήτησα — わたしはあなたの掟を求めたからである."
  95: "ἐμὲ ὑπέμειναν ἁμαρτωλοὶ τοῦ ἀπολέσαι με — 罪人たちはわたしを滅ぼそうと待ち構えた (ὑπομένω — «поджидать»). τὰ μαρτύριά σου συνῆκα — わたしはあなたの証を悟った (συνίημι — «уразуметь»)."
  96: "πάσης συντελείας εἶδον πέρας — わたしは、すべての完成の果てを見た (συντέλεια — «завершение, совершенство» → 完成; πέρας — «предел»). πλατεῖα ἡ ἐντολή σου σφόδρα — あなたの戒めは、限りなく広い (πλατύς — «широкий»; ср. ст. 32, 45)."
  97: "Ὡς ἠγάπησα τὸν νόμον σου, κύριε — 主よ、わたしはなんとあなたの律法を愛していることか (ὡς в восклицании). ὅλην τὴν ἡμέραν μελέτη μού ἐστιν — それは一日中、わたしの思い巡らすところである."
  98: "ὑπὲρ τοὺς ἐχθρούς μου ἐσόφισάς με τὴν ἐντολήν σου — あなたの戒めによって、あなたはわたしを敵よりも賢くされた (σοφίζω — «умудрять»). ὅτι εἰς τὸν αἰῶνα μοί ἐστιν — それはとこしえにわたしのものであるからである."
  99: "ὑπὲρ πάντας τοὺς διδάσκοντάς με συνῆκα — わたしは、わたしを教えるすべての者よりも悟った. ὅτι τὰ μαρτύριά σου μελέτη μού ἐστιν — あなたの証がわたしの思い巡らすところだからである."
  100: "ὑπὲρ πρεσβυτέρους συνῆκα — わたしは老人たちよりも悟った (πρεσβύτερος — «старец»). ὅτι τὰς ἐντολάς σου ἐξεζήτησα — あなたの戒めを求めたからである."
  101: "ἐκ πάσης ὁδοῦ πονηρᾶς ἐκώλυσα τοὺς πόδας μου — わたしはすべての悪い道から足を遠ざけた (κωλύω — «удерживать, запрещать»). ὅπως ἂν φυλάξω τοὺς λόγους σου — あなたの御言葉を守るためである."
  102: "ἀπὸ τῶν κριμάτων σου οὐκ ἐξέκλινα — わたしはあなたの定めからそれなかった. ὅτι σὺ ἐνομοθέτησάς μοι — あなたがわたしを教え導かれたからである (νομοθετέω — «давать закон, научать»)."
  103: "ὡς γλυκέα τῷ λάρυγγί μου τὰ λόγιά σου — あなたの仰せは、わたしの喉にどんなに甘いことか (λάρυγξ — «гортань, горло»). ὑπὲρ μέλι καὶ κηρίον τῷ στόματί μου — わたしの口には、蜜や蜜の巣よりも甘い (κηρίον — «медовые соты»)."
  104: "ἀπὸ τῶν ἐντολῶν σου συνῆκα — わたしはあなたの戒めによって悟った. διὰ τοῦτο ἐμίσησα πᾶσαν ὁδὸν ἀδικίας — それゆえ、すべての不正な道を憎んだ. В gr-lxx-byz после этого стоит в квадратных скобках повтор [ὅτι σὺ ἐνομοθέτησάς μοι] (диттография из ст. 102); в церковном тексте (ru, Синодальный, jp-joc) его нет, поэтому он не переводится. Это не добавление Церкви, а повтор в критическом тексте, поэтому 〔…〕 не ставится."
  105: "Λύχνος τοῖς ποσίν μου ὁ λόγος σου — あなたの御言葉はわたしの足のともしび. καὶ φῶς ταῖς τρίβοις μου — わたしの小道の光である (τρίβος — 小道, как в ст. 35)."
  106: "ὀμώμοκα καὶ ἔστησα τοῦ φυλάξασθαι — わたしは誓いを立て、…守ることを固く決めた (ὄμνυμι — «клясться»; ἵστημι — «утверждать»). τὰ κρίματα τῆς δικαιοσύνης σου — あなたの義の定め."
  107: "ἐταπεινώθην ἕως σφόδρα — わたしはひどく苦しめられた (ταπεινόω — «смирять, поражать», ср. ст. 67, 71, 75). κύριε, ζῆσόν με κατὰ τὸν λόγον σου — 主よ、あなたの御言葉によって、わたしを生かしてください."
  108: "τὰ ἑκούσια τοῦ στόματός μου εὐδόκησον δή — わたしの口が進んでささげるものを受け入れ (ἑκούσια — «добровольные дары»; εὐδοκέω — «благоволить»; ср. ru «принять добровольную жертву уст моих»). καὶ τὰ κρίματά σου δίδαξόν με — あなたの定めをわたしに教えてください."
  109: "ἡ ψυχή μου ἐν ταῖς χερσίν μου διὰ παντός — わたしの魂はいつもわたしの手の中にある (образ: жизнь в опасности, на ладони). καὶ τοῦ νόμου σου οὐκ ἐπελαθόμην — それでも、あなたの律法を忘れなかった."
  110: "ἔθεντο ἁμαρτωλοὶ παγίδα μοι — 罪人たちはわたしに罠を仕掛けた (παγίς — «ловушка, сеть»). καὶ ἐκ τῶν ἐντολῶν σου οὐκ ἐπλανήθην — わたしはあなたの戒めから迷い出なかった (πλανάω — «блуждать»)."
  111: "ἐκληρονόμησα τὰ μαρτύριά σου εἰς τὸν αἰῶνα — わたしはあなたの証をとこしえの嗣業として受け取った (κληρονομέω — «получать в наследие»). ὅτι ἀγαλλίαμα τῆς καρδίας μού εἰσιν — それはわたしの心の喜びだからである (ἀγαλλίαμα — «ликование»)."
  112: "ἔκλινα τὴν καρδίαν μου τοῦ ποιῆσαι τὰ δικαιώματά σου — わたしはあなたの掟を行おうと心を傾けた. εἰς τὸν αἰῶνα δι᾿ ἀντάμειψιν — とこしえに、報いを目指して (ἀντάμειψις — «воздаяние»; ср. ru «навек, до конца» — иное понимание)."
  113: "Παρανόμους ἐμίσησα καὶ τὸν νόμον σου ἠγάπησα — わたしは不法な者たちを憎み、あなたの律法を愛した (παράνομοι — «беззаконники»; в ru «вымыслы человеческие» — иное чтение)."
  114: "βοηθός μου καὶ ἀντιλήμπτωρ μου εἶ σύ — あなたはわたしの助け、わたしの守り手である (ἀντιλήμπτωρ — «заступник, покровитель»; ср. Пс 3:4, где ἀντιλήμπτωρ передан 盾). εἰς τὸν λόγον σου ἐπήλπισα — あなたの御言葉に望みを置いた."
  115: "ἐκκλίνατε ἀπ᾿ ἐμοῦ, πονηρευόμενοι — 不法を働く者たちよ、わたしから離れよ (ἐκκλίνω — «уклоняться»). καὶ ἐξερευνήσω τὰς ἐντολὰς τοῦ θεοῦ μου — わたしはわたしの神の戒めを探り求める."
  116: "ἀντιλαβοῦ μου κατὰ τὸ λόγιόν σου, καὶ ζήσομαι — あなたの仰せに従って、わたしを支えてください、そうすれば、わたしは生きます (ἀντιλαμβάνω — «поддерживать»). μὴ καταισχύνῃς με ἀπὸ τῆς προσδοκίας μου — わたしの望みのゆえに、わたしを恥じさせないでください."
  117: "βοήθησόν μοι, καὶ σωθήσομαι — わたしを助けてください、そうすれば、わたしは救われる. καὶ μελετήσω ἐν τοῖς δικαιώμασίν σου διὰ παντός — いつまでもあなたの掟を思い巡らします."
  118: "ἐξουδένωσας πάντας τοὺς ἀποστατοῦντας ἀπὸ τῶν δικαιωμάτων σου — あなたは、あなたの掟から離れる者をすべて退けられた (ἐξουδενόω — «уничижать, отвергать»; ἀφίστημι — «отступать»). ὅτι ἄδικον τὸ ἐνθύμημα αὐτῶν — 彼らの思い図りは不正だからである (ἐνθύμημα — «помысел, замысел»)."
  119: "παραβαίνοντας ἐλογισάμην πάντας τοὺς ἁμαρτωλοὺς τῆς γῆς — わたしは地の罪人をすべて、あなたに背く者と見なした (παραβαίνω — «преступать»; λογίζομαι — «считать»). διὰ τοῦτο ἠγάπησα τὰ μαρτύριά σου διὰ παντός — それゆえ、いつまでもあなたの証を愛した. В ru иное чтение («как изгарь отметаешь»); переведён текст gr-lxx-byz."
  120: "καθήλωσον ἐκ τοῦ φόβου σου τὰς σάρκας μου — あなたへの恐れをもって、わたしの肉を釘づけにしてください (καθηλόω — «пригвождать»). ἀπὸ γὰρ τῶν κριμάτων σου ἐφοβήθην — わたしはあなたの定めを恐れたからである."
  121: "Ἐποίησα κρῖμα καὶ δικαιοσύνην — わたしは裁きと義とを行った (κρῖμα здесь — «суд, правосудие», 裁き; ср. обычное κρίμα = 定め). μὴ παραδῷς με τοῖς ἀδικοῦσίν με — わたしを苦しめる者たちに、わたしを渡さないでください."
  122: "ἔκδεξαι τὸν δοῦλόν σου εἰς ἀγαθόν — あなたの僕を良いことのために受け入れてください (ἐκδέχομαι — «принимать, брать под защиту»; ср. ru «Заступи раба Твоего ко благу его»). μὴ συκοφαντησάτωσάν με ὑπερήφανοι — 高慢な者たちがわたしを中傷しませんように (συκοφαντέω — «клеветать»)."
  123: "οἱ ὀφθαλμοί μου ἐξέλιπον εἰς τὸ σωτήριόν σου — わたしの目は、あなたの救い…を待ち望んで衰えた. καὶ εἰς τὸ λόγιον τῆς δικαιοσύνης σου — あなたの義の仰せを (ср. ст. 81–82)."
  124: "ποίησον μετὰ τοῦ δούλου σου κατὰ τὸ ἔλεός σου — あなたのあわれみに従って、あなたの僕に良くしてください. καὶ τὰ δικαιώματά σου δίδαξόν με — あなたの掟をわたしに教えてください."
  125: "δοῦλός σού εἰμι ἐγώ — わたしはあなたの僕である. συνέτισόν με, καὶ γνώσομαι τὰ μαρτύριά σου — わたしに悟らせてください、そうすれば…証を知ります."
  126: "καιρὸς τοῦ ποιῆσαι τῷ κυρίῳ — 主が事を行われる時が来た (дат. при инфинитиве — дат. действующего лица; ср. ru «Время Господу действовать»). διεσκέδασαν τὸν νόμον σου — 人々はあなたの律法を破った (διασκεδάννυμι — «разрушать, разорять»)."
  127: "διὰ τοῦτο ἠγάπησα τὰς ἐντολάς σου ὑπὲρ χρυσίον καὶ τοπάζιον — それゆえ、わたしはあなたの戒めを、金やトパーズにもまさって愛した (τοπάζιον — «топаз»; в ru «золото чистое» — иное чтение)."
  128: "διὰ τοῦτο πρὸς πάσας τὰς ἐντολάς σου κατωρθούμην — それゆえ、わたしはあなたのすべての戒めによって正しくされ (κατορθόω — «выпрямлять, направлять», имперфект). πᾶσαν ὁδὸν ἄδικον ἐμίσησα — すべての不正な道を憎んだ."
  129: "Θαυμαστὰ τὰ μαρτύριά σου — あなたの証は驚くべきものである. διὰ τοῦτο ἐξηρεύνησεν αὐτὰ ἡ ψυχή μου — それゆえ、わたしの魂はそれを探り求めた."
  130: "ἡ δήλωσις τῶν λόγων σου φωτιεῖ — あなたの御言葉の解き明かしは光を放ち (δήλωσις — «изъяснение, откровение» → 解き明かし). καὶ συνετιεῖ νηπίους — 幼い者を悟らせる (νήπιος — «младенец, простой»)."
  131: "τὸ στόμα μου ἤνοιξα καὶ εἵλκυσα πνεῦμα — わたしは口を開いて息を吸い込んだ (ἕλκω — «тянуть, втягивать»). πνεῦμα здесь — «дыхание», а не Святой Дух (ср. ru «вздыхаю»), поэтому 息[いき], а не 霊. ὅτι τὰς ἐντολάς σου ἐπεπόθουν — あなたの戒めを慕い求めたからである."
  132: "ἐπίβλεψον ἐπ᾿ ἐμὲ καὶ ἐλέησόν με — わたしに目を留め、…わたしをあわれんでください. κατὰ τὸ κρίμα τῶν ἀγαπώντων τὸ ὄνομά σου — あなたの名を愛する者に対する定めに従って."
  133: "τὰ διαβήματά μου κατεύθυνον κατὰ τὸ λόγιόν σου — あなたの仰せに従って、わたしの歩みをまっすぐにしてください (διαβήματα — «шаги»). καὶ μὴ κατακυριευσάτω μου πᾶσα ἀνομία — どんな不法もわたしを支配しませんように (κατακυριεύω — «господствовать»)."
  134: "λύτρωσαί με ἀπὸ συκοφαντίας ἀνθρώπων — 人々の中傷からわたしを贖い出してください (λυτρόω — «выкупать, избавлять»; συκοφαντία — 中傷). καὶ φυλάξω τὰς ἐντολάς σου — そうすれば、あなたの戒めを守ります."
  135: "τὸ πρόσωπόν σου ἐπίφανον ἐπὶ τὸν δοῦλόν σου — あなたの御顔をあなたの僕の上に輝かせ (ἐπιφαίνω — «осиять»). καὶ δίδαξόν με τὰ δικαιώματά σου — あなたの掟をわたしに教えてください."
  136: "διεξόδους ὑδάτων κατέβησαν οἱ ὀφθαλμοί μου — わたしの目から水の流れが注ぎ出た (διέξοδος — «исход, поток»). ἐπεὶ οὐκ ἐφύλαξαν τὸν νόμον σου — 人々があなたの律法を守らなかったからである."
  137: "Δίκαιος εἶ, κύριε, καὶ εὐθὴς ἡ κρίσις σου — 主よ、あなたは正しく、あなたの裁きはまっすぐである (κρίσις — 裁[さば]き, постоянное соответствие; ср. κρίμα = 定め)."
  138: "ἐνετείλω δικαιοσύνην τὰ μαρτύριά σου καὶ ἀλήθειαν σφόδρα — あなたはあなたの証を義と、きわめて真実なものとして命じられた; «заповедал» с двумя винительными — «правду и истину весьма»."
  139: "ἐξέτηξέν με ὁ ζῆλος τοῦ οἴκου σου — あなたの家への熱い思いがわたしを焼き尽くした (τήκω — «расплавлять, истаивать»; ζῆλος — «ревность»; ср. Ин 2:17). ὅτι ἐπελάθοντο τῶν λόγων σου οἱ ἐχθροί μου — わたしの敵があなたの御言葉を忘れたからである."
  140: "πεπυρωμένον τὸ λόγιόν σου σφόδρα — あなたの仰せは火で錬られたものであり (πυρόω — «очищать огнём, раскалять»; ср. ru «Слово Твое весьма чисто»). καὶ ὁ δοῦλός σου ἠγάπησεν αὐτό — あなたの僕はそれを愛した."
  141: "νεώτερός εἰμι ἐγὼ καὶ ἐξουδενωμένος — わたしは若く、軽んじられている (νεώτερος — «младший»; ru «Мал я и презрен»). τὰ δικαιώματά σου οὐκ ἐπελαθόμην — あなたの掟を忘れなかった."
  142: "ἡ δικαιοσύνη σου δικαιοσύνη εἰς τὸν αἰῶνα — あなたの義はとこしえの義であり. καὶ ὁ νόμος σου ἀλήθεια — あなたの律法は真実である."
  143: "θλῖψις καὶ ἀνάγκη εὕροσάν με — 苦難と行き詰まりがわたしに及んだ (θλῖψις — 苦難[くなん]; ἀνάγκη — «теснота, нужда»; ср. ru «скорбь и горесть»). αἱ ἐντολαί σου μελέτη μου — あなたの戒めはわたしの思い巡らすところである."
  144: "δικαιοσύνη τὰ μαρτύριά σου εἰς τὸν αἰῶνα — あなたの証はとこしえの義である. συνέτισόν με, καὶ ζήσομαι — わたしに悟らせてください、そうすれば、わたしは生きます."
  145: "Ἐκέκραξα ἐν ὅλῃ καρδίᾳ μου — わたしは心を尽くして呼ばわった (κράζω — «взывать»). ἐπάκουσόν μου, κύριε — 主よ、わたしに答えてください. τὰ δικαιώματά σου ἐκζητήσω — わたしはあなたの掟を求めます."
  146: "ἐκέκραξά σε· σῶσόν με — わたしはあなたを呼んだ、わたしを救ってください. καὶ φυλάξω τὰ μαρτύριά σου — そうすれば、あなたの証を守ります."
  147: "προέφθασα ἐν ἀωρίᾳ καὶ ἐκέκραξα — わたしは夜明けに先んじて呼ばわった (προφθάνω — «предварять»; ἀωρία — «ранний час»; ср. ru «Предваряю рассвет»). εἰς τοὺς λόγους σου ἐπήλπισα — あなたの御言葉に望みを置いた."
  148: "προέφθασαν οἱ ὀφθαλμοί μου πρὸς ὄρθρον — わたしの目は夜明けの見張りに先だって覚め (ὄρθρος — «утренняя заря, стража»). τοῦ μελετᾶν τὰ λόγιά σου — あなたの仰せを思い巡らした."
  149: "τῆς φωνῆς μου ἄκουσον, κύριε, κατὰ τὸ ἔλεός σου — 主よ、あなたのあわれみによってわたしの声を聞き. κατὰ τὸ κρίμα σου ζῆσόν με — あなたの定めによって、わたしを生かしてください."
  150: "προσήγγισαν οἱ καταδιώκοντές με ἀνομίᾳ — わたしを迫害する者たちが、不法を抱えて近づき (ἀνομία — 不法). ἀπὸ δὲ τοῦ νόμου σου ἐμακρύνθησαν — あなたの律法からは遠ざかった."
  151: "ἐγγὺς εἶ σύ, κύριε — 主よ、あなたは近くにおられ. καὶ πᾶσαι αἱ ἐντολαί σου ἀλήθεια — あなたの戒めはすべて真実である."
  152: "κατ᾿ ἀρχὰς ἔγνων ἐκ τῶν μαρτυρίων σου — わたしは昔から、あなたの証によって…知っていた. ὅτι εἰς τὸν αἰῶνα ἐθεμελίωσας αὐτά — あなたがそれをとこしえに据えられたことを; по-японски два греч. оборота сведены в одно предложение с придаточным …ことを知っていた."
  153: "Ἰδὲ τὴν ταπείνωσίν μου καὶ ἐξελοῦ με — わたしの苦しみをご覧になり、わたしを救い出してください (ἐξαιρέω — «извлекать, избавлять»; ταπείνωσις — «уничижение, бедствие»). ὅτι τὸν νόμον σου οὐκ ἐπελαθόμην — 律法を忘れなかったからである."
  154: "κρῖνον τὴν κρίσιν μου καὶ λύτρωσαί με — わたしの訴えを裁いて、わたしを贖い出してください (κρίνω — «судить», κρίσις — «тяжба»). διὰ τὸν λόγον σου ζῆσόν με — あなたの御言葉によって、わたしを生かしてください."
  155: "μακρὰν ἀπὸ ἁμαρτωλῶν σωτηρία — 救いは罪人から遠く離れている. ὅτι τὰ δικαιώματά σου οὐκ ἐξεζήτησαν — 彼らはあなたの掟を求めなかったからである."
  156: "οἱ οἰκτιρμοί σου πολλοί, κύριε — 主よ、あなたの慈しみは多い. κατὰ τὸ κρίμα σου ζῆσόν με — あなたの定めによって、わたしを生かしてください."
  157: "πολλοὶ οἱ ἐκδιώκοντές με καὶ ἐκθλίβοντές με — わたしを迫害し、苦しめる者は多い (ἐκδιώκω — «гнать»; ἐκθλίβω — «теснить»). ἐκ τῶν μαρτυρίων σου οὐκ ἐξέκλινα — わたしはあなたの証からそれなかった."
  158: "εἶδον ἀσυνθετοῦντας καὶ ἐξετηκόμην — わたしは、あなたに背く者たちを見て心が溶けた (ἀσυνθετέω — «нарушать договор, изменять»; τήκω — «таять»). ὅτι τὰ λόγιά σου οὐκ ἐφυλάξαντο — 彼らがあなたの仰せを守らなかったからである."
  159: "ἰδὲ ὅτι τὰς ἐντολάς σου ἠγάπησα — ご覧ください、わたしがどれほどあなたの戒めを愛しているかを. ἐν τῷ ἐλέει σου ζῆσόν με — あなたのあわれみによって、わたしを生かしてください."
  160: "ἀρχὴ τῶν λόγων σου ἀλήθεια — あなたの御言葉の基は真実であり (ἀρχή — «начало, основание»; ср. ru «Основание слова Твоего истинно»). καὶ εἰς τὸν αἰῶνα πάντα τὰ κρίματα τῆς δικαιοσύνης σου — あなたの義の定めはすべてとこしえに及ぶ."
  161: "Ἄρχοντες κατεδίωξάν με δωρεάν — 支配者たちは理由もなくわたしを迫害した (δωρεά — «даром, без причины»). καὶ ἀπὸ τῶν λόγων σου ἐδειλίασεν ἡ καρδία μου — わたしの心はあなたの御言葉を恐れた (δειλιάω — «робеть, страшиться»)."
  162: "ἀγαλλιάσομαι ἐγὼ ἐπὶ τὰ λόγιά σου — わたしは…あなたの仰せを喜ぶ (ἀγαλλιάομαι — «ликовать»). ὡς ὁ εὑρίσκων σκῦλα πολλά — 多くの分捕り物を得た者のように (σκῦλα — «добыча»; ср. ru «как получивший великую прибыль»)."
  163: "ἀδικίαν ἐμίσησα καὶ ἐβδελυξάμην — わたしは不正を憎み、忌み嫌った (βδελύσσομαι — «гнушаться»). τὸν δὲ νόμον σου ἠγάπησα — あなたの律法を愛した."
  164: "ἑπτάκις τῆς ἡμέρας ᾔνεσά σοι — 一日に七度あなたをほめたたえた (ἑπτάκις — 七度[ななたび]; «семь раз в день» — полнота хвалы, не буквальный счёт). ἐπὶ τὰ κρίματα τῆς δικαιοσύνης σου — あなたの義の定めのゆえに."
  165: "εἰρήνη πολλὴ τοῖς ἀγαπῶσιν τὸν νόμον σου — あなたの律法を愛する者には大きな平和があり. καὶ οὐκ ἔστιν αὐτοῖς σκάνδαλον — 彼らにつまずきはない (σκάνδαλον — «преткновение, соблазн»)."
  166: "προσεδόκων τὸ σωτήριόν σου, κύριε — 主よ、わたしはあなたの救いを待ち望み (προσδοκάω — «ожидать»; имперфект). καὶ τὰς ἐντολάς σου ἠγάπησα — あなたの戒めを愛した."
  167: "ἐφύλαξεν ἡ ψυχή μου τὰ μαρτύριά σου — わたしの魂はあなたの証を守り. καὶ ἠγάπησεν αὐτὰ σφόδρα — それを心から愛した."
  168: "ἐφύλαξα τὰς ἐντολάς σου καὶ τὰ μαρτύριά σου — わたしはあなたの戒めと証を守った. ὅτι πᾶσαι αἱ ὁδοί μου ἐναντίον σου, κύριε — 主よ、わたしの道はすべてあなたの前にあるからである. В конце стиха в gr-lxx-byz стоит буква κβ θαυ — последняя строфа тав."
  169: "Ἐγγισάτω ἡ δέησίς μου ἐνώπιόν σου, κύριε — 主よ、わたしの願いがあなたの前に近づきますように (δέησις — «моление»). κατὰ τὸ λόγιόν σου συνέτισόν με — あなたの仰せに従って、わたしに悟らせてください."
  170: "εἰσέλθοι τὸ ἀξίωμά μου ἐνώπιόν σου — わたしの願い事があなたの前に入りますように (ἀξίωμα — «прошение, ходатайство»; ср. ст. 169 δέησις — синоним, поэтому 願い事). κατὰ τὸ λόγιόν σου ῥῦσαί με — あなたの仰せに従って、わたしを救い出してください (ῥύομαι — «избавлять»)."
  171: "ἐξερεύξαιντο τὰ χείλη μου ὕμνον — わたしの唇は賛美をあふれ出させる (ἐξερεύγομαι — «изливать, изрыгать»; ὕμνος — 賛美). ὅταν διδάξῃς με τὰ δικαιώματά σου — あなたがわたしに掟を教えられるとき."
  172: "φθέγξαιτο ἡ γλῶσσά μου τὸ λόγιόν σου — わたしの舌はあなたの仰せを語る (φθέγγομαι — «произносить, возглашать»). ὅτι πᾶσαι αἱ ἐντολαί σου δικαιοσύνη — あなたの戒めはすべて義だからである."
  173: "γενέσθω ἡ χείρ σου τοῦ σῶσαί με — あなたの手がわたしを救うものとなりますように. ὅτι τὰς ἐντολάς σου ᾑρετισάμην — わたしはあなたの戒めを選んだからである (αἱρέομαι — как в ст. 30)."
  174: "ἐπεπόθησα τὸ σωτήριόν σου, κύριε — 主よ、わたしはあなたの救いを慕い求めた (ποθέω — «жаждать»). καὶ ὁ νόμος σου μελέτη μού ἐστιν — あなたの律法はわたしの思い巡らすところである."
  175: "ζήσεται ἡ ψυχή μου καὶ αἰνέσει σε — わたしの魂は生きてあなたをほめたたえる. καὶ τὰ κρίματά σου βοηθήσει μοι — あなたの定めがわたしを助ける (греч. ед. ч. βοηθήσει, подлежащее — τὰ κρίματα; передано 定め как собирательное)."
  176: "ἐπλανήθην ὡς πρόβατον ἀπολωλός — わたしは、迷い出た羊のように迷った (ἀπόλλυμι в перфекте — «погибшая, потерянная»). ζήτησον τὸν δοῦλόν σου — あなたの僕を尋ね求めてください. ὅτι τὰς ἐντολάς σου οὐκ ἐπελαθόμην — わたしはあなたの戒めを忘れなかったからである. Псалом завершается последней строфой тав (κβ θαυ)."
