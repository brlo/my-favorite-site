  163: "わたしは不正[ふせい]を憎[にく]み、忌[い]み嫌[きら]った。あなたの律法[りっぽう]を愛[あい]した。"
  164: "わたしは、あなたの義[ぎ]の定[さだ]めのゆえに、一日[いちにち]に七度[ななたび]あなたをほめたたえた。"
