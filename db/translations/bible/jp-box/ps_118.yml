  104: "わたしはあなたの戒[いまし]めによって悟[さと]った。それゆえ、すべての不正[ふせい]な道[みち]を憎[にく]んだ。"
  105: "あなたの御言葉[みことば]はわたしの足[あし]のともしび、わたしの小道[こみち]の光[ひかり]である。"
  106: "わたしは誓[ちか]いを立[た]て、あなたの義[ぎ]の定[さだ]めを守[まも]ることを固[かた]く決[き]めた。"
  107: "わたしはひどく苦[くる]しめられた。主[しゅ]よ、あなたの御言葉[みことば]によって、わたしを生[い]かしてください。"
