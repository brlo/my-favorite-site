  147: "わたしは夜明[よあ]けに先[さき]んじて呼[よ]ばわった。あなたの御言葉[みことば]に望[のぞ]みを置[お]いた。"
  148: "わたしの目[め]は夜明[よあ]けの見張[みは]りに先[さき]だって覚[さ]め、あなたの仰[おお]せを思[おも]い巡[めぐ]らした。"
  149: "主[しゅ]よ、あなたのあわれみによってわたしの声[こえ]を聞[き]き、あなたの定[さだ]めによって、わたしを生[い]かしてください。"
