  112: "わたしはあなたの掟[おきて]をとこしえに行[おこな]おうと、報[むく]いを目指[めざ]して心[こころ]を傾[かたむ]けた。"
  113: "わたしは不法[ふほう]な者[もの]たちを憎[にく]み、あなたの律法[りっぽう]を愛[あい]した。"
