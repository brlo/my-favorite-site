  168: "わたしはあなたの戒[いまし]めと証[あかし]を守[まも]った。主[しゅ]よ、わたしの道[みち]はすべてあなたの前[まえ]にあるからである。"
  169: "主[しゅ]よ、わたしの願[ねが]いがあなたの前[まえ]に近[ちか]づきますように。あなたの仰[おお]せに従[したが]って、わたしに悟[さと]らせてください。"
  170: "わたしの願[ねが]い事[ごと]があなたの前[まえ]に入[はい]りますように。あなたの仰[おお]せに従[したが]って、わたしを救[すく]い出[だ]してください。"
  171: "あなたがわたしに掟[おきて]を教[おし]えられるとき、わたしの唇[くちびる]は賛美[さんび]をあふれ出[だ]させる。"
  172: "わたしの舌[した]はあなたの仰[おお]せを語[かた]る。あなたの戒[いまし]めはすべて義[ぎ]だからである。"
  173: "あなたの手[て]がわたしを救[すく]うものとなりますように。わたしはあなたの戒[いまし]めを選[えら]んだからである。"
  174: "主[しゅ]よ、わたしはあなたの救[すく]いを慕[した]い求[もと]めた。あなたの律法[りっぽう]はわたしの思[おも]い巡[めぐ]らすところである。"
  175: "わたしの魂[たましい]は生[い]きてあなたをほめたたえる。あなたの定[さだ]めがわたしを助[たす]ける。"
