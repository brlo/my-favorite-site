  154: "わたしの訴[うった]えを裁[さば]いて、わたしを贖[あがな]い出[だ]してください。あなたの御言葉[みことば]によって、わたしを生[い]かしてください。"
  155: "救[すく]いは罪[つみ]人[びと]から遠[とお]く離[はな]れている。彼[かれ]らはあなたの掟[おきて]を求[もと]めなかったからである。"
