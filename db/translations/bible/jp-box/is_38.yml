# jp-box, Исаия, глава 38. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc в гл. 38 есть только 38:1–6 (1901, public domain): использован
# для сверки структуры, не языка; jp-ni не использовался.
# Язык — современный 常体 (в молитве и песни тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 38: болезнь Езекии и его молитва (1–3), ответ Господа через Исаию (4–8),
# надписание и песнь Езекии (9–20), смоквы и знамение (21–22).
# Речи: Исаия — 「…」 (1, 5–8, 21), слово Господа внутри — 『…』 (1; 5–8, не
# закрывается до конца ст. 8); молитва Езекии — 「…」 (3); песнь Езекии — 「…」
# (10–20), его собственные слова «я сказал» внутри песни — 『…』 (10; 11–12).
# Вводные формулы и надписание (9) — вне кавычек.
# Нумерация по gr: 22 стиха; у csl и ru тоже 22.
# Паритет: csl-добавки внесены без 〔…〕 — 38:2 «глаголя», 38:6 «и град сей»,
# 38:7 «якоже глагола», 38:8 «се, аз», 38:11 «спасения израилева на земли»,
# 38:21 «на язву»; оговорено в notes. Csl делит иначе 38:14/15: конец LXX-ст. 15
# («и отя болезнь души моея») стоит у него в 38:14, а 38:15 читает по МТ
# («и той сотвори путеводство во вся лета моя») — держим LXX и деление gr (notes 15).
# 〔…〕 нет. Сносок ⟨…⟩ нет: 神殿, 粗布, よみ, 琴, 燕, 鳩 уже в корпусе.
# Имена — транслитерация греческого (LXX).

