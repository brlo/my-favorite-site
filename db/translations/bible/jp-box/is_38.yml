verses:
  1: "そのころ、ヒゼキヤは死[し]に至[いた]る病[やまい]にかかった。預言者[よげんしゃ]イザヤ、アモスの子[こ]が彼[かれ]のもとへ来[き]て言[い]った。「主[しゅ]はこう言[い]われる。『あなたの家[いえ]のことを片[かた]づけなさい。あなたは死[し]ぬ。生[き]き延[の]びることはない。』」"
  2: "ヒゼキヤは顔[かお]を壁[かべ]に向[む]けて主[しゅ]に祈[いの]って言[い]った。"
  3: "「思[おも]い起[おこ]してください、主[しゅ]よ。わたしがあなたの前[まえ]を真実[しんじつ]と真[しん]なる心[こころ]で歩[あゆ]み、あなたの目[め]に良[よ]いことを行[おこな]ってきたことを。」そしてヒゼキヤは激[はげ]しく泣[な]いた。"
  4: "すると、主[しゅ]の言葉[ことば]がイザヤに臨[のぞ]んで言[い]った。"
  5: "「行[い]って、ヒゼキヤに言[い]いなさい。『あなたの父[ちち]ダビデの神[かみ]である主[しゅ]はこう言[い]われる。わたしはあなたの祈[いの]りを聞[き]き、あなたの涙[なみだ]を見[み]た。見[み]よ、わたしはあなたの年[とし]に十五[じゅうご]年[ねん]を加[くわ]える。"
  6: "アッシリアの王[おう]の手[て]から、あなたを、またこの町[まち]を救[すく]い、この町[まち]のために盾[たて]となって守[まも]る。"
  7: "これが、主[しゅ]からのあなたへのしるしである。主[しゅ]がこの言葉[ことば]を、言[い]われたとおりに成[な]し遂[と]げられる、ということである。"
  8: "見[み]よ、わたしは、太陽[たいよう]が降[お]りたあなたの父[ちち]の家[いえ]の十[じゅう]段[だん]の階段[かいだん]の影[かげ]を戻[もど]す。影[かげ]が降[お]りたその十段[じゅうだん]だけ、太陽[たいよう]を戻[もど]す。すると、太陽[たいよう]は、影[かげ]が降[お]りたその十段[じゅうだん]を上[のぼ]って戻[もど]った。』」"
  9: "ユダの王[おう]ヒゼキヤの祈[いの]り。彼[かれ]が病[やまい]にかかり、その病[やまい]から立[た]ち直[なお]ったときのものである。"
  10: "「わたしは言[い]った。『わたしの日[ひ]々[び]の盛[さか]りに、わたしはよみの門[もん]に入[はい]り、残[のこ]りの年[とし]を捨[す]て去[さ]る。』"
  11: "わたしは言[い]った。『もう、生[い]ける者[もの]の地[ち]で神[かみ]の救[すく]いを見[み]ることはない。もう、地[ち]でイスラエルの救[すく]いを見[み]ることもない。もう、生[い]ける者[もの]とともに人[ひと]を見[み]ることはない。"
  12: "わたしの親族[しんぞく]のうちの者[もの]を。』わたしは自分[じぶん]の命[いのち]の残[のこ]りを捨[す]てた。わたしの住[す]まいは、自分[じぶん]が張[は]った天幕[てんまく]を畳[たた]む者[もの]のように、わたしから取[と]り去[さ]られて行[い]った。わたしの霊[れい]は、機[はた]を織[お]る女[おんな]が断[た]ち切[き]ろうと近[ちか]づくときの布[ぬの]のように、わたしのうちにあった。その日[ひ]、わたしは引[ひ]き渡[わた]された。"
  13: "朝[あさ]まで、獅子[しし]に引[ひ]き渡[わた]されたかのように。こうして、わたしの骨[ほね]はすべて砕[くだ]かれた。昼[ひる]から夜[よる]まで、わたしは引[ひ]き渡[わた]されていた。"
  14: "わたしは燕[つばめ]のように叫[さけ]び、鳩[はと]のようにうめく。わたしの目[め]は、天[てん]の高[たか]みへ、わたしを救[すく]い出[だ]した主[しゅ]へと向[む]かううちに、衰[おとろ]え果[は]てた。"
  15: "主[しゅ]はわたしの魂[たましい]の苦[くる]しみを取[と]り去[さ]られた。"
  16: "主[しゅ]よ、このことについてあなたに告[つ]げられました。あなたはわたしの息[いき]を起[お]こし、わたしは慰[なぐさ]められて生[い]きました。"
  17: "あなたはわたしの魂[たましい]を選[えら]んで、滅[ほろ]びないようにされた。あなたはわたしのすべての罪[つみ]を、わたしの後[うし]ろに投[な]げ捨[す]てられた。"
  18: "よみにいる者[もの]たちはあなたをほめたたえず、死[し]んだ者[もの]たちはあなたをほめたたえない。よみにいる者[もの]たちは、あなたのあわれみを望[のぞ]みもしない。"
  19: "生[い]きている者[もの]、生[い]きている者[もの]が、今日[きょう]のわたしのように、あなたをほめたたえる。今日[きょう]から、わたしは子[こ]どもたちを生[う]み、彼[かれ]らがあなたの義[ぎ]を告[つ]げ知[し]らせるようにする。"
  20: "主[しゅ]はわたしの救[すく]い。わたしは命[いのち]のあるかぎり、神[かみ]の家[いえ]の前[まえ]で、琴[こと]に合わせてあなたをほめたたえることをやめない。」"
  21: "イザヤはヒゼキヤに言[い]った。「干[ほ]しいちじくの塊[かたまり]を取[と]ってすり潰[つぶ]し、患部[かんぶ]に塗[ぬ]りなさい。そうすれば癒[いや]される。」"
  22: "ヒゼキヤは言[い]った。「わたしが主[しゅ]の神[かみ]の家[いえ]に上[のぼ]るという、そのしるしは何[なん]か。」"

notes:
  1: "ἐμαλακίσθη ἕως θανάτου — «заболел до смерти» (μαλακίζομαι); Τάξαι περὶ τοῦ οἴκου σου — «дай распоряжение о доме твоём», т. е. сделай завещание (τάσσω); ἀποθνῄσκεις γὰρ σὺ καὶ οὐ ζήσῃ — «ибо ты умираешь и не будешь жить». Csl «разболеся» без «царь» — в гр тоже нет."
  2: "ἀπέστρεψεν τὸ πρόσωπον αὐτοῦ πρὸς τὸν τοῖχον — «обратил лицо своё к стене»; προσηύξατο πρὸς κύριον — «помолился Господу». Csl добавляет «глаголя» — отсюда «祈って言った»; в гр причастия нет, и стих кончается на «помолился»."
  3: "Μνήσθητι, κύριε — «вспомни, Господи» (без восклицания Ὦ δή, которое есть в 4 Цар 20:3); ὡς ἐπορεύθην ἐνώπιόν σου — «как я ходил пред Тобою»; μετὰ ἀληθείας ἐν καρδίᾳ ἀληθινῇ — «в истине и сердцем истинным» (в 4 Цар — καρδίᾳ πλήρει, «сердцем полным»); τὰ ἀρεστὰ ἐνώπιόν σου ἐποίησα — «угодное пред Тобою делал»; ἔκλαυσεν κλαυθμῷ μεγάλῳ — «плакал плачем великим»."
  4: "ἐγένετο λόγος κυρίου πρὸς Ησαιαν λέγων — «было слово Господне к Исаии, говоря». В гр нет «ещё на среднем дворе» (это 4 Цар 20:4)."
  5: "Πορεύθητι — «пойди»; Τάδε λέγει κύριος ὁ θεὸς Δαυιδ τοῦ πατρός σου — «так говорит Господь Бог Давида, отца твоего»; Ἤκουσα τῆς φωνῆς τῆς προσευχῆς σου — «услышал глас молитвы твоей» (родительный при ἤκουσα); εἶδον τὰ δάκρυά σου — «увидел слёзы твои»; προστίθημι πρὸς τὸν χρόνον σου ἔτη δέκα πέντε — «прилагаю к времени твоему пятнадцать лет». Здесь открывается слово Господа (『…』)."
  6: "ἐκ χειρὸς βασιλέως Ἀσσυρίων σώσω σε — «из руки царя Ассирийского спасу тебя»; csl добавляет «и град сей» — внесено; ὑπὲρ τῆς πόλεως ταύτης ὑπερασπιῶ — «за город этот буду защищать» (ὑπερασπίζω). В гр нет «ради Меня и ради Давида, раба Моего» (это 4 Цар 20:6)."
  7: "τὸ σημεῖον παρὰ κυρίου — «знамение от Господа»; ὅτι ὁ θεὸς ποιήσει τὸ ῥῆμα τοῦτο — «что Бог сотворит слово это»; csl добавляет «якоже глагола» — «как сказал», внесено. Стих с двоеточием в слав., здесь — конец фразы."
  8: "τὴν σκιὰν τῶν ἀναβαθμῶν — «тень ступеней» (ἀναβαθμός — ступень, 段); οὓς κατέβη ὁ ἥλιος — «которые прошло солнце»; τοὺς δέκα ἀναβαθμοὺς τοῦ οἴκου τοῦ πατρός σου — «десять ступеней дома отца твоего»; ἀποστρέψω τὸν ἥλιον — «возвращу солнце»; csl добавляет «се, аз» — внесено. В гр имени Ахаза нет (в 4 Цар 20:11 — «ступени Ахазовы»)."
  9: "Προσευχὴ Εζεκιου βασιλέως τῆς Ιουδαίας — «молитва Езекии, царя Иудейского»; ἡνίκα ἐμαλακίσθη καὶ ἀνέστη ἐκ τῆς μαλακίας αὐτοῦ — «когда он заболел и встал от болезни своей». Надписание, не речь; песнь начинается в 10."
  10: "Ἐγὼ εἶπα — «я сказал»; Ἐν τῷ ὕψει τῶν ἡμερῶν μου — «в высоте дней моих», т. е. в расцвете; ἐν πύλαις ᾅδου καταλείψω τὰ ἔτη τὰ ἐπίλοιπα — «в воротах ада оставлю годы остальные» (ᾅδης — よみ; καταλείπω — оставлять). Здесь открывается песнь Езекии (「…」), она идёт до 20; слова «я сказал» внутри неё — в 『…』."
  11: "Οὐκέτι μὴ ἴδω τὸ σωτήριον τοῦ θεοῦ ἐπὶ τῆς γῆς — «уже не увижу спасения Божия на земле»; csl добавляет «спасения израилева на земли» — внесено; ἐκ τῆς συγγενείας μου — «из родства моего» (в гр это начало ст. 12, продолжение той же фразы; отсюда «わたしの親族のうちの者を» в начале 12, там же закрывается 『…』)."
  12: "κατέλιπον τὸ λοιπὸν τῆς ζωῆς μου — «оставил остаток жизни моей»; ἐξῆλθεν καὶ ἀπῆλθεν ἀπ᾽ ἐμοῦ ὥσπερ ὁ καταλύων σκηνὴν πήξας — «вышло и ушло от меня, как разрушающий скинию, которую поставил»; τὸ πνεῦμά μου παρ᾽ ἐμοὶ ἐγένετο ὡς ἱστὸς ἐρίθου ἐγγιζούσης ἐκτεμεῖν — «дух мой во мне стал как ткань ткачихи, приближающейся отрезать» (ἱστός — ткань, основа; ἐρῖθος — ткачиха); ἐν τῇ ἡμέρᾳ ἐκείνῃ παρεδόθην — «в тот день я был предан»."
  13: "ἕως πρωΐ ὡς λέοντι — «до утра, как льву» (продолжение «предан»); οὕτως τὰ ὀστᾶ μου συνέτριψεν — «так сокрушил кости мои» (συντρίβω); ἀπὸ γὰρ τῆς ἡμέρας ἕως τῆς νυκτὸς παρεδόθην — «ибо от дня до ночи я был предан». Csl переносит «в той день предан бых» в начало стиха — деление иное."
  14: "ὡς χελιδών — «как ласточка» (χελιδών); φωνήσω — «буду взывать»; ὡς περιστερά — «как голубь» (περιστερά); μελετήσω — «буду издавать звуки, размышлять» (μελετάω); ἐξέλιπον οἱ ὀφθαλμοί μου τοῦ βλέπειν — «изнемогли глаза мои смотреть» (ἐκλείπω); εἰς τὸ ὕψος τοῦ οὐρανοῦ — «в высоту неба»; ὃς ἐξείλατό με — «который избавил меня»."
  15: "ἀφείλατό μου τὴν ὀδύνην τῆς ψυχῆς — «отнял у меня болезнь души моей» (ἀφαιρέω). Csl иначе: этим предложением заканчивает 38:14 («и отя болезнь души моея»), а в 38:15 читает «и той сотвори путеводство во вся лета моя» (по МТ; в LXX этого нет). Держим LXX и деление gr, csl-чтение — здесь."
  16: "κύριε, περὶ αὐτῆς γὰρ ἀνηγγέλη σοι — «Господи, об этом ведь было возвещено Тебе» (ἀναγγέλλω); ἐξήγειράς μου τὴν πνοήν — «Ты воздвиг дыхание моё» (πνοή); παρακληθεὶς ἔζησα — «утешенный, я ожил». Стих тёмный, передан буквально."
  17: "εἵλου γάρ μου τὴν ψυχήν — «ибо Ты избрал душу мою» (αἱρέομαι — выбирать); ἵνα μὴ ἀπόληται — «чтобы не погибла»; ἀπέρριψας ὀπίσω μου πάσας τὰς ἁμαρτίας μου — «бросил за меня все грехи мои» (ἀπορρίπτω). В ru по МТ «во благо мне была сильная горесть» — в LXX и csl этого нет."
  18: "οἱ ἐν ᾅδου — «те, что в аде» (よみ); αἰνέσουσίν σε — «восхвалят Тебя» (αἰνέω); οἱ ἀποθανόντες — «умершие»; ἐλπιοῦσιν τὴν ἐλεημοσύνην σου — «будут надеяться на милость Твою» (ἐλεημοσύνη — あわれみ)."
  19: "οἱ ζῶντες — «живые»; ὃν τρόπον κἀγώ — «как и я»; ἀπὸ τῆς σήμερον παιδία ποιήσω — «от сегодня сотворю детей»; ἃ ἀναγγελοῦσιν τὴν δικαιοσύνην σου — «которые возвестят правду Твою» (δικαιοσύνη — 義)."
  20: "κύριε τῆς σωτηρίας μου — «Господи спасения моего»; οὐ παύσομαι εὐλογῶν σε — «не перестану благословлять Тебя»; μετὰ ψαλτηρίου — «с псалтирью» (琴, как в Пс); πάσας τὰς ἡμέρας τῆς ζωῆς μου — «во все дни жизни моей»; κατέναντι τοῦ οἴκου τοῦ θεοῦ — «прямо пред домом Божиим». Здесь закрывается песнь; в ru «мы будем воспевать» (мн. ч.), в гр и csl — единственное число."
  21: "Λαβὲ παλάθην ἐκ σύκων — «возьми пласт смокв» (παλάθη — лепёшка сушёных плодов, 干しいちじくの塊); τρῖψον — «сотри»; κατάπλασαι — «приложи как пластырь» (καταπλάσσω); csl добавляет «на язву» — внесено (患部); ὑγιὴς ἔσῃ — «будешь здоров»."
  22: "Τοῦτο τὸ σημεῖον, ὅτι ἀναβήσομαι εἰς τὸν οἶκον κυρίου τοῦ θεοῦ — «это знамение, что взойду в дом Господа Бога»: в гр нет вопросительного слова (в 4 Цар 20:8 — Τί τὸ σημεῖον), вопрос выражен интонацией и передан «しるしは何か». Csl «сие знамение» — то же чтение без вопросительной частицы."
