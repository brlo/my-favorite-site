verses:
  1: "ウジヤ王[おう]が死[し]んだ年[とし]のこと、わたしは、高[たか]く上[あ]げられた王座[おうざ]に座[すわ]っておられる主[しゅ]を見[み]た。神殿[しんでん]は主の栄光[えいこう]で満[み]ちていた。"
  2: "セラフィムが主[しゅ]の周[まわ]りに立[た]っていた。それぞれに六[むっ]つの翼[つばさ]があり、二[ふた]つで顔[かお]を覆[おお]い、二つで足[あし]を覆い、二つで飛[と]んでいた。"
  3: "そして、互[たが]いに呼[よ]びかわして言[い]った。「聖[せい]なる、聖なる、聖なる、万軍[ばんぐん]の主[しゅ]。全[ぜん]地[ち]は主の栄光[えいこう]に満[み]ちている。」"
  4: "その叫[さけ]び声[ごえ]によって戸口[とぐち]の上[うえ]の梁[はり]が上[あ]がり、神殿[しんでん]は煙[けむり]で満[み]ちた。"
  5: "わたしは言[い]った。「ああ、わたしは滅[ほろ]びる。わたしは汚[けが]れた唇[くちびる]の者[もの]であり、汚れた唇の民[たみ]の間[あいだ]に住[す]んでいるのに、わたしの目[め]は王[おう]、万軍[ばんぐん]の主[しゅ]を見[み]てしまった。」"
  6: "すると、セラフィムの一人[ひとり]がわたしのところへ来[き]た。その手[て]には、祭壇[さいだん]から火[ひ]ばしで取[と]った炭[すみ]があった。"
  7: "彼[かれ]はわたしの口[くち]に触[ふ]れて言[い]った。「見[み]よ、これがあなたの唇[くちびる]に触れた。あなたの不法[ふほう]は取[と]り去[さ]られ、あなたの罪[つみ]は清[きよ]められる。」"
  8: "わたしは主[しゅ]の声[こえ]を聞[き]いた。「だれを遣[つか]わそうか。だれがこの民[たみ]のもとへ行[い]くのか。」わたしは言[い]った。「わたしがここにいます。わたしを遣[つか]わしてください。」"
  9: "主[しゅ]は言[い]われた。「行[い]って、この民[たみ]に言[い]え。『あなたがたは聞[き]くには聞[き]くが、決[けっ]して悟[さと]らない。見[み]るには見[み]るが、決して見[み]ない。』"
  10: "『この民[たみ]の心[こころ]は肥[こ]え太[ふと]り、その耳[みみ]は重[おも]く聞[き]き、その目[め]を閉[と]ざした。こうして、目[め]で見[み]、耳で聞[き]き、心[こころ]で悟[さと]って立[た]ち返[かえ]り、わたしが彼[かれ]らを癒[いや]すことのないように。』」"
  11: "わたしは言[い]った。「いつまでですか、主[しゅ]よ。」主[しゅ]は言[い]われた。「町[まち]々[まち]が住[す]む者[もの]を失[うしな]って荒[あ]れ果[は]て、家[いえ]々[いえ]に人[ひと]がいなくなり、この地[ち]が荒[あ]れ果[は]ててしまうまで。"
  12: "その後[のち]、神[かみ]は人[ひと]々[びと]を遠[とお]くへ移[うつ]される。そして、地[ち]に残[のこ]された者[もの]は多[おお]くなる。"
  13: "まだ、その地[ち]には十分[じゅうぶん]の一[いち]が残[のこ]る。しかし、それもまた略奪[りゃくだつ]にさらされる。テレビンの木[き]や、殻[から]から落[お]ちる樫[かし]の実[み]のようになる。その切[き]り株[かぶ]は聖[せい]なる種[たね]である。」"

notes:
  1: "Καὶ ἐγένετο τοῦ ἐνιαυτοῦ, οὗ ἀπέθανεν Οζιας ὁ βασιλεύς — «и было в год, когда умер Озия царь» (букв. «в год, в который умер»). εἶδον τὸν κύριον καθήμενον ἐπὶ θρόνου ὑψηλοῦ καὶ ἐπηρμένου — «видел я Господа, сидящего на престоле высоком и превознесённом» (ἐπαίρω — поднимать, возносить). πλήρης ὁ οἶκος τῆς δόξης αὐτοῦ — «полон дом славы Его». ru добавляет «края риз Его наполняли весь храм» — чтение МТ (שׁוּלָיו), нет ни в LXX, ни в слав., в текст не внесено."
  2: "σεραφιν — серафимы (евр. «пламенеющие»); в корпусе слова не было, дана транслитерация セラフィム. ἓξ πτέρυγες τῷ ἑνὶ καὶ ἓξ πτέρυγες τῷ ἑνί — «шесть крыльев одному и шесть крыльев другому» (τῷ ἑνί — датив притяжания). ταῖς μὲν δυσὶν κατεκάλυπτον τὸ πρόσωπον … τοὺς πόδας … ἐπέταντο — «двумя покрывали лицо, двумя — ноги, двумя летали» (κατακαλύπτω — закрывать; πέτομαι — летать). Слав. «окрест его» (κύκλῳ αὐτοῦ) — вокруг Него."
  3: "Ἅγιος ἅγιος ἅγιος κύριος σαβαωθ — трисвятое; κύριος σαβαωθ передано 万軍の主 (в корпусе транслитерации サバオト нет). πλήρης πᾶσα ἡ γῆ τῆς δόξης αὐτοῦ — «полна вся земля славы Его». ἐκέκραγον ἕτερος πρὸς τὸν ἕτερον — «взывали один к другому» (κράζω — кричать, взывать). Песнь серафимов — 「…」; в слав. перед ней двоеточие, кавычек нет."
  4: "ἐπήρθη τὸ ὑπέρθυρον ἀπὸ τῆς φωνῆς, ἧς ἐκέκραγον — «поднялась притолока от голоса, которым взывали» (ὑπέρθυρον — притолока, верх двери; слав. «наддверие»). ὁ οἶκος ἐπλήσθη καπνοῦ — «дом наполнился дыма» (καπνός — дым). ru «поколебались верхи врат» — иное понимание (МТ); в тексте по LXX/слав. «поднялась»."
  5: "Ὦ τάλας ἐγώ — «о, несчастный я» (τάλας — жалкий); ὅτι κατανένυγμαι — «что я сокрушён, пронзён» (κατανύσσομαι, перфект; слав. «умилихся», Син. «погиб я»), в тексте 滅びる. ἀκάθαρτα χείλη — «нечистые уста» (χείλος — губа, 唇). ἐν μέσῳ λαοῦ … ἐγὼ οἰκῶ — «живу среди народа». τὸν βασιλέα κύριον σαβαωθ εἶδον τοῖς ὀφθαλμοῖς μου — «Царя, Господа Саваофа, видели очи мои». Речь Исаии — 「…」."
  6: "ἀπεστάλη πρός με ἓν τῶν σεραφιν — «послан был ко мне один из серафимов». ἄνθραξ — горящий уголь, жар (слав. «угль горящь»). λαβίς — клещи, щипцы (в тексте 火ばし). ἀπὸ τοῦ θυσιαστηρίου — «от жертвенника» (θυσιαστήριον; слав. «олтаря»)."
  7: "ἥψατο τοῦ στόματός μου — «коснулся уст моих» (ἅπτω — касаться). Ἰδοὺ ἥψατο τοῦτο τῶν χειλέων σου — «вот, это коснулось губ твоих». ἀφελεῖ τὰς ἀνομίας σου — «уберёт беззакония твои» (ἀφαιρέω); περικαθαριεῖ — «совершенно очистит» (περικαθαρίζω, усиленное καθαρίζω; слав. «очистит»). Слова серафима — 「…」."
  8: "φωνὴν κυρίου λέγοντος — «голос Господа, говорящего» (слав. «глаголюща»). Τίνα ἀποστείλω, καὶ τίς πορεύσεται πρὸς τὸν λαὸν τοῦτον — «кого пошлю, и кто пойдёт к народу сему»; ru «кто пойдёт для Нас» — МТ, в LXX «к народу этому». Ἰδοὺ εἰμι ἐγώ· ἀπόστειλόν με — «вот я, пошли меня». Глас Господа и ответ пророка — две цитаты в одном стихе."
  9: "Πορεύθητι καὶ εἰπὸν τῷ λαῷ τούτῳ — «иди и скажи народу этому». Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε — «слухом услышите и не уразумеете» (фигура cognate accusative, сохранена); βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε — «видя увидите и не увидите». Цитируется в Мф 13:14–15 (в нашем Мф 13:14 передано 聞くには聞くが…理解せず); здесь буквальнее по LXX. Слова к народу — вложенная речь 『…』 внутри поручения Господа."
  10: "ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου — «ибо ожирело, огрубело сердце народа сего» (παχύνω — делать толстым; слав. «одебеле»). βαρέως ἤκουσαν — «тяжело слышали»; ἐκάμμυσαν — «смежили, закрыли» (καμμύω). μήποτε … ἰάσομαι αὐτούς — «как бы не … и Я не исцелю их»: придаточное цели сохранено, не сглажено в «они не покаются». Цит. Мф 13:15. Здесь закрываются 『…』 и поручение 「…」."
  11: "Ἕως πότε, κύριε — «доколе, Господи?» — вопрос пророка, 「…」. Ἕως ἂν ἐρημωθῶσιν πόλεις παρὰ τὸ μὴ κατοικεῖσθαι — «доколе не опустеют города так, что некому будет жить в них» (ἐρημόω — опустошать; παρά + inf. — «из-за того, что»). οἶκοι παρὰ τὸ μὴ εἶναι ἀνθρώπους — «домы — из-за того, что нет людей»; ἡ γῆ καταλειφθήσεται ἔρημος — «земля останется пустой» (καταλείπω). Слав. 6:11 дважды повторяет «и домы» — дефект слав. текста, в перевод не внесён. Ответ Господа — 「…」 до конца 6:13."
  12: "καὶ μετὰ ταῦτα μακρυνεῖ ὁ θεὸς τοὺς ἀνθρώπους — «и после этого удалит Бог людей» (μακρύνω — удалять, отдалять; слав. «продолжит»). οἱ καταλειφθέντες πληθυνθήσονται ἐπὶ τῆς γῆς — «оставшиеся умножатся на земле» (πληθύνω). ru «великое запустение будет на этой земле» — чтение МТ, нет ни в LXX, ни в слав.; в тексте «умножатся», как в LXX/слав."
  13: "τὸ ἐπιδέκατον — «десятая часть» (слав. «десятина»). πάλιν ἔσται εἰς προνομήν — «снова будет на расхищение» (προνομή — добыча, разграбление). ὡς τερέβινθος καὶ ὡς βάλανος ὅταν ἐκπέσῃ ἀπὸ τῆς θήκης αὐτῆς — «как теревинф и как жёлудь, когда выпадет из своей чашечки» (βάλανος — жёлудь; θήκη — вместилище, плюска). Слав. добавляет в конце «семя свято стояние его» — этого нет в LXX; по паритету внесено в основной текст без 〔…〕 (その切り株は聖なる種である). Образ: у срубленного дерева остаётся пень — от него и будет святой отпрыск."
