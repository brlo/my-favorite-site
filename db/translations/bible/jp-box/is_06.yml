# jp-box, Исаия, глава 6. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru (Синодальный) —
# только для понимания, не источник. jp-joc для Исаии есть фрагментами (гл. 3, 5–10,
# 13–14, 19, 25–29, 37–38 и др.), но в этой главе он не привлекался: свидетель
# церковного чтения, не источник; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 6: 1–4 видение в храме (Господь на престоле, серафимы, трисвятое, дым);
# 5 исповедание Исаии; 6–7 уголь и очищение; 8 глас Господа и ответ пророка;
# 9–10 поручение (цит. Мф 13:14–15); 11–13 опустошение и святое семя.
# Голоса: 1–2, 4, 6 авторское повествование; 3 песнь серафимов — 「…」;
# 5 и 8 (ответ) речь Исаии — 「…」; 7 слова серафима — 「…」; 8 глас Господа — 「…」;
# 9–10 поручение Господа, слова к народу внутри — 『…』; 11 вопрос пророка и ответ
# Господа 11–13 — 「…」. Красного и синего в Ветхом Завете нет.
# Нумерация по gr: 13 стихов; у csl тоже 13, деление по стихам совпадает (csl 6:11
# дважды повторяет «и домы» — дефект слав. текста, в перевод не внесён).
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz. Слав. добавление 6:13 «семя свято
# стояние его» внесено в основной текст без скобок (нет в LXX), в notes отмечено.
# Сносок ⟨…⟩ нет: セラフィム, 炭, 火ばし и пр. объяснены в notes или понятны.
# Имена — транслитерация греческого (LXX): ウジヤ, イザヤ.

