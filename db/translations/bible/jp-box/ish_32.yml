verses:
  1: "民[たみ]は、モーセが山[やま]から下[くだ]りて来[く]るのに手間取[てまど]っているのを見[み]て、アロンに詰[つ]め寄[よ]って言[い]った。「立[た]って、わたしたちのために、わたしたちの前[まえ]を行[ゆ]く神々[かみがみ]を造[つく]ってくれ。あのモーセという人[ひと]、わたしたちをエジプトの地[ち]から導[みちび]き出[だ]した者[もの]に何[なに]が起[お]こったのか、わたしたちには分[わ]からないのだ。」"
  2: "アロンは彼[かれ]らに言[い]った。「あなたがたの妻[つま]と娘[むすめ]たちの耳[みみ]にある金[きん]の耳飾[みみかざ]りを外[はず]し、わたしのところへ持[も]って来[き]なさい。」"
  3: "民[たみ]は皆[みな]、耳[みみ]にある金[きん]の耳飾[みみかざ]りを外[はず]して、アロンのところへ持[も]って来[き]た。"
  4: "アロンはそれを彼[かれ]らの手[て]から受[う]け取[と]り、のみで形[かたち]を整[ととの]えて、熔[と]かした金[きん]の子牛[こうし]を造[つく]った。人々[ひとびと]は言[い]った。「イスラエルよ、これこそ、あなたをエジプトの地[ち]から導[みちび]き上[のぼ]った神々[かみがみ]だ。」"
  5: "アロンはこれを見[み]て、その前[まえ]に祭壇[さいだん]を建[た]て、宣[の]べた。「明日[あす]は主[しゅ]の祭[まつ]りである。」"
  6: "人々[ひとびと]は翌朝[よくあさ]早[はや]く起[お]きて、燔祭[はんさい]をささげ、救[すく]いの供[そな]え物[もの]を献[ささ]げた。民[たみ]は座[すわ]って食[た]べ、飲[の]み、やがて立[た]って遊[あそ]び始[はじ]めた。"
  7: "主[しゅ]はモーセに言[い]われた。「急[いそ]いでここから下[くだ]りなさい。あなたがエジプトの地[ち]から導[みちび]き上[のぼ]ったあなたの民[たみ]が、悪[あく]を行[おこな]ったからである。"
  8: "彼[かれ]らは、あなたが彼[かれ]らに命[めい]じた道[みち]から速[すみ]やかに外[はず]れ、自分[じぶん]たちのために子牛[こうし]を造[つく]り、それにひれ伏[ふ]し、犠牲[ぎせい]をささげて言[い]った。"
  9: "〔『イスラエルよ、これこそ、あなたをエジプトの地[ち]から導[みちび]き上[のぼ]った神々[かみがみ]だ。』〕"
  10: "今[いま]、わたしを放[はな]っておきなさい。わたしは彼[かれ]らに向[む]かって怒[いか]りを燃[も]やし、彼[かれ]らを滅[ほろ]ぼし尽[つ]くして、あなたを大[おお]きな民[たみ]としよう。」"
  11: "モーセは主[しゅ]なる神[かみ]の前[まえ]で執[しつ]り成[な]しをして言[い]った。「主[しゅ]よ、なぜあなたは、あなたの民[たみ]に怒[いか]りを燃[も]やされるのですか。あなたが大[おお]きな力[ちから]と高[たか]く掲[かか]げられた腕[うで]によって、エジプトの地[ち]から導[みちび]き出[だ]された民[たみ]ですのに。"
  12: "なぜ、エジプト人[じん]が『彼[かれ]らを悪[わる]だくみで導[みちび]き出[だ]し、山[やま]の中で殺[ころ]し、地[ち]の面[おもて]から滅[ほろ]ぼし尽[つ]くそうとしたのだ』と言[い]うのですか。あなたの激[はげ]しい怒[いか]りを静[しず]め、あなたの民[たみ]の上[うえ]に下[くだ]そうとされた災[わざわ]いについて、あわれみを示[しめ]してください。"
  13: "あなたの僕[しもべ]であるアブラハム、イサク、ヤコブを思[おも]い起[お]こしてください。あなたは彼[かれ]らにご自分[じぶん]にかけて誓[ちか]い、『わたしはあなたがたの子孫[しそん]を天[てん]の星[ほし]のように数多[かずおお]くし、あなたがたの子孫[しそん]に与[あた]えると告[つ]げたこの地[ち]すべてを、彼[かれ]らは永遠[えいえん]に受[う]け継[つ]ぐ』と言[い]われました。」"
  14: "主[しゅ]は、ご自分[じぶん]の民[たみ]に下[くだ]すと言[い]われた災[わざわ]いを、あわれみのゆえに免[まぬが]れさせられた。"
  15: "モーセは向[む]きを変[か]えて山[やま]を下[くだ]った。証[あかし]の二枚[にまい]の石板[せきばん]が彼[かれ]の手[て]にあった。その板[いた]は両側[りょうがわ]に、こちらの面[めん]にもあちらの面[めん]にも書[か]かれていた。"
  16: "その石板[せきばん]は神[かみ]の造[つく]ったものであり、その書[か]き文字[もじ]は神[かみ]の文字[もじ]であって、石板[せきばん]に刻[きざ]まれていた。"
  17: "ヨシュアは民[たみ]の叫[さけ]ぶ声[こえ]を聞[き]いて、モーセに言[い]った。「宿営[しゅくえい]に戦[たたか]いの声[こえ]がする。」"
  18: "モーセは言[い]った。「勝[か]ちどきの声[こえ]でも、敗走[はいそう]の叫[さけ]びでもない。わたしに聞[き]こえるのは、酒[さけ]を飲[の]んで歌[うた]い始[はじ]めた者[もの]たちの声[こえ]だ。」"
  19: "宿営[しゅくえい]に近[ちか]づいたとき、モーセは子牛[こうし]と踊[おど]りを見[み]た。モーセは激[はげ]しく怒[いか]り、手[て]から二枚[にまい]の石板[せきばん]を投[な]げ捨[す]て、山[やま]のふもとでそれを砕[くだ]いた。"
  20: "彼[かれ]は自分[じぶん]たちが造[つく]った子牛[こうし]を取[と]って火[ひ]で焼[や]き、細[こま]かく砕[くだ]いて粉[こな]にし、水[みず]の上[うえ]にまき散[ち]らして、イスラエルの子[こ]らに飲[の]ませた。"
  21: "モーセはアロンに言[い]った。「この民[たみ]があなたに何[なに]をしたというので、あなたは彼[かれ]らに大[おお]きな罪[つみ]を負[お]わせたのか。」"
  22: "アロンは言[い]った。「わたしの主[あるじ]よ、怒[いか]らないでください。あなたはこの民[たみ]が激[はげ]しくなりやすいのをご存[ぞん]じです。"
  23: "彼[かれ]らはわたしに『わたしたちの前[まえ]を行[ゆ]く神々[かみがみ]を造[つく]ってくれ。あのモーセという人[ひと]、わたしたちをエジプトから導[みちび]き出[だ]した者[もの]に何[なに]が起[お]こったのか、わたしたちには分[わ]からない』と言[い]ったのです。"
  24: "そこでわたしは彼[かれ]らに『金[きん]を持[も]っている者[もの]は外[はず]せ』と言[い]い、彼[かれ]らがわたしに渡[わた]したので、それを火[ひ]に投[な]げ入[い]れると、この子牛[こうし]が現[あらわ]れたのです。」"
  25: "モーセは、民[たみ]が解[ほぐ]れているのを見[み]た。アロンが彼[かれ]らを解[ほぐ]して、敵[てき]の嘲[あざけ]りの的[まと]としたからである。"
  26: "モーセは宿営[しゅくえい]の門[もん]に立[た]って言[い]った。「主[しゅ]の側[がわ]につく者[もの]は、わたしのところへ来[き]なさい。」レビの子[こ]らは皆[みな]、彼[かれ]のもとに集[あつ]まった。"
  27: "彼[かれ]は言[い]った。「イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。『おのおの腰[こし]に剣[けん]を帯[お]び、宿営[しゅくえい]の中[なか]を門[もん]から門[もん]へと行[ゆ]き巡[めぐ]り、おのおのその兄弟[きょうだい]を、その友[とも]を、その隣[となり]の者[もの]を殺[ころ]せ。』」"
  28: "レビの子[こ]らはモーセが言[い]ったとおりに行[おこな]った。その日[ひ]、民[たみ]のうち約[やく]三千人[さんぜんにん]が倒[たお]れた。"
  29: "モーセは言[い]った。「今日[きょう]、あなたがたはおのおの自分の子[こ]や兄弟[きょうだい]によって、主[しゅ]のために手[て]を満[み]たした。あなたがたに祝福[しゅくふく]が与[あた]えられるためである。」"
  30: "翌日[よくじつ]、モーセは民[たみ]に言[い]った。「あなたがたは大[おお]きな罪[つみ]を犯[おか]した。今[いま]、わたしは神[かみ]のもとへ上[のぼ]って行[ゆ]き、あなたがたの罪[つみ]のために償[つぐな]いをする。」"
  31: "モーセは主[しゅ]のもとへ戻[もど]って言[い]った。「お願[ねが]いです、主[しゅ]よ。この民[たみ]は大[おお]きな罪[つみ]を犯[おか]し、自分[じぶん]たちのために金[きん]の神々[かみがみ]を造[つく]ってしまいました。"
  32: "今[いま]、もしあなたが彼[かれ]らの罪[つみ]をお赦[ゆる]しになるのなら、お赦[ゆる]しください。そうでないなら、あなたが書[か]かれたあなたの書[しょ]から、わたしを消[け]し去[さ]ってください。」"
  33: "主[しゅ]はモーセに言[い]われた。「わたしの前[まえ]で罪[つみ]を犯[おか]した者[もの]を、わたしはわたしの書[しょ]から消[け]し去[さ]る。"
  34: "今[いま]、行[ゆ]きなさい。あなたを導[みちび]いて、わたしがあなたに告[つ]げた場所[ばしょ]へ民[たみ]を連[つ]れて行[ゆ]きなさい。見[み]よ、わたしの天使[てんし]があなたの前[まえ]を進[すす]む。ただし、わたしが訪[おとず]れる日[ひ]には、彼[かれ]らの罪[つみ]を彼[かれ]らの上[うえ]に報[むく]いる。」"
  35: "主[しゅ]は、アロンが造[つく]った子牛[こうし]のことで、民[たみ]を打[う]たれた。"

notes:
  1: "ἰδὼν ὁ λαὸς ὅτι κεχρόνικεν Μωϋσῆς — モーセが…手間取っているのを見て (χρονίζω — «медлить»; perfect с оттенком «давно уже»). συνέστη ὁ λαὸς ἐπὶ Ααρων — アロンに詰め寄って (συνίστημι ἐπί + вин. — «восстать против»; слав. «восташа людие на аарона»). ποίησον ἡμῖν θεούς, οἳ προπορεύσονται ἡμῶν — わたしたちの前を行く神々を造ってくれ (θεοί мн. ч., как в евр.). οὐκ οἴδαμεν, τί γέγονεν αὐτῷ — 何が起こったのか分からない."
  2: "τὰ ἐνώτια τὰ χρυσᾶ — 金の耳飾り (ἐνώτιον от οὖς «ухо»). τῶν γυναικῶν ὑμῶν καὶ θυγατέρων — 妻と娘たちの (в LXX нет «сыновей»; Синодальный с масоретского добавляет «сыновей ваших»). ἐνέγκατε πρός με — わたしのところへ持って来なさい."
  3: "περιείλαντο — 外した (περιαιρέω — «снимать»). ἐν τοῖς ὠσὶν αὐτῶν — 耳にある (в LXX «в ушах их», т. е. самих людей; слав. «в ушесех жен их» — иначе)."
  4: "ἐδέξατο ἐκ τῶν χειρῶν — 手から受け取った (δέχομαι). ἔπλασεν αὐτὰ ἐν τῇ γραφίδι — のみで形を整えて (γραφίς — «резец, стило»; слав. «слия… делом литым»; Синодальный «обделал резцом»). μόσχος χωνευτός — 熔かした金の子牛 (χωνεύω — «плавить, лить»). εἶπεν — «сказал» (ед. ч.; слав. «рекоша» — мн. ч., т. е. народ; по-японски подлежащее — 人々)."
  5: "ᾠκοδόμησεν θυσιαστήριον κατέναντι αὐτοῦ — その前に祭壇を建て (κατέναντι — «напротив»). ἐκήρυξεν — 宣べた (κηρύσσω — «провозглашать»). Ἑορτὴ τοῦ κυρίου αὔριον — 明日は主の祭りである (в греч. без глагола)."
  6: "ὀρθρίσας τῇ ἐπαύριον — 翌朝早く起きて (ὀρθρίζω). ἀνεβίβασεν ὁλοκαυτώματα — 燔祭をささげ (ἀναβιβάζω — «возносить»). θυσίαν σωτηρίου — 救いの供え物 (жертва спасения, мирная). ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πιεῖν — 民は座って食べ飲みし. ἀνέστησαν παίζειν — 立って遊び始めた (παίζω — «играть, плясать»)."
  7: "Βάδιζε τὸ τάχος — 急いで…なさい (τὸ τάχος — «быстро»). ἠνόμησεν — 悪を行った (ἀνομέω). ὁ λαός σου, οὓς ἐξήγαγες — あなたの民、あなたが導き上った (LXX обращается к Моисею «ты»; Синодальный — «Мой народ, который Я вывел»)."
  8: "παρέβησαν ταχὺ ἐκ τῆς ὁδοῦ — 道から速やかに外れ (παραβαίνω — «преступать»). ἧς ἐνετείλω αὐτοῖς — あなたが彼らに命じた (2 л. ед. ч.; в Синодальном «который Я заповедал» — иное чтение). προσκεκυνήκασιν — ひれ伏し (προσκυνέω), τεθύκασιν — 犠牲をささげ (θύω)."
  9: "Οὗτοι οἱ θεοί σου, Ισραηλ — 『…神々だ』 (слова народа внутри речи Бога — вложенная цитата). οἵτινες ἀνεβίβασάν σε — あなたを導き上った. В базе gr-lxx-byz эти слова стоят в конце ст. 8, а на месте ст. 9 — «.»; слав. держит их стихом 9, поэтому стих целиком в 〔…〕."
  10: "ἔασόν με — わたしを放っておきなさい (ἐάω). θυμωθεὶς ὀργῇ — 怒りを燃やし (датив: «воспламенившись гневом»). ἐκτρίψω — 滅ぼし尽くす (ἐκτρίβω — «стирать»). ποιήσω σὲ εἰς ἔθνος μέγα — あなたを大きな民としよう."
  11: "ἐδεήθη — 執り成しをして (δέομαι — «умолять»). ἔναντι κυρίου τοῦ θεοῦ — 主なる神の前に. Ἵνα τί — なぜ. ἐν ἰσχύι μεγάλῃ καὶ ἐν τῷ βραχίονί σου τῷ ὑψηλῷ — 大きな力と高く掲げられた腕によって (βραχίων — «мышца, рука»; слав. «мышцею твоею высокою»)."
  12: "Μετὰ πονηρίας — 悪だくみで (букв. «с лукавством»). ἐξαναλῶσαι — 滅ぼし尽くす (ἐξαναλίσκω). παῦσαι τῆς ὀργῆς τοῦ θυμοῦ σου — 激しい怒りを静め (παύω + род.). ἵλεως γενοῦ ἐπὶ τῇ κακίᾳ — 災いについてあわれみを示してください (ἵλεως — «милостив»; κακία здесь «бедствие», слав. «о злобе»)."
  13: "μνησθεὶς — 思い起こしてください (букв. деепричастие «вспомнив»; по-японски передано просьбой). οἰκέται — 僕 (слав. «рабы»). ὤμοσας κατὰ σεαυτοῦ — ご自分にかけて誓い (клятва самим собой; ср. Быт 22:16). Πολυπληθυνῶ — 数多くし (усиление «умножая умножу»). ὡσεὶ τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει — 天の星のように (датив «по множеству»). καθέξουσιν — 受け継ぐ (κατέχω — «владеть»)."
  14: "ἱλάσθη κύριος περὶ τῆς κακίας — 主は…災いをあわれみのゆえに免れさせられた (ἱλάσκομαι — «умилостивляться»; слав. «умилостивися»). В евр. здесь נִחַם («раскаялся»), отсюда «отменил/раскаялся» в Синодальном; в базе ἱλάσθη, переводим по греч. ἧς εἶπεν ποιῆσαι — которое сказал сделать."
  15: "ἀποστρέψας — 向きを変えて (ἀποστρέφω). αἱ δύο πλάκες τοῦ μαρτυρίου ἐν ταῖς χερσὶν αὐτοῦ — 二枚の石板が彼の手に (греч. без глагола). καταγεγραμμέναι ἐξ ἀμφοτέρων τῶν μερῶν — 両側に書かれ (букв. «исписаны с обеих сторон»). ἔνθεν καὶ ἔνθεν — こちらの面にもあちらの面にも."
  16: "ἔργον θεοῦ — 神の造ったもの (букв. «дело Божие»). ἡ γραφὴ γραφὴ θεοῦ — 書き文字は神の文字. κεκολαμμένη — 刻まれていた (κολάπτω — «вырезать»; слав. «изваяно»)."
  17: "ἀκούσας Ἰησοῦς — ヨシュアは…聞いて. φωνὴ πολέμου — 戦いの声 (род.: «военный крик»). ἐν τῇ παρεμβολῇ — 宿営に (παρεμβολή — «стан»)."
  18: "φωνὴ ἐξαρχόντων κατ᾿ ἰσχύν — 勝ちどきの声 (ἐξάρχω — «запевать, начинать»; κατ᾿ ἰσχύν — «по силе», т. е. победный крик). φωνὴ ἐξαρχόντων τροπῆς — 敗走の叫び (τροπή — «бегство, поражение»). φωνὴν ἐξαρχόντων οἴνου — 酒を飲んで歌い始めた者たちの声 (букв. «голос начинающих от вина»; слав. «напиватися вином»)."
  19: "ἤγγιζεν τῇ παρεμβολῇ — 宿営に近づいた. ὁρᾷ τὸν μόσχον καὶ τοὺς χορούς — 子牛と踊りを見た (χοροί — «хороводы»; ср. 32:6 παίζειν). ὀργισθεὶς θυμῷ — 激しく怒り (датив усиления). ἔρριψεν ἀπὸ τῶν χειρῶν — 手から投げ捨て. συνέτριψεν — 砕いた (συντρίβω). ὑπὸ τὸ ὄρος — 山のふもとで."
  20: "κατέκαυσεν ἐν πυρί — 火で焼き (κατακαίω). κατήλεσεν λεπτόν — 細かく砕いて粉にし (ἀλέω — «молоть»; λεπτός — «мелкий»). ἔσπειρεν ἐπὶ τὸ ὕδωρ — 水の上にまき散らし (σπείρω). ἐπότισεν — 飲ませた (ποτίζω)."
  21: "Τί ἐποίησέν σοι ὁ λαὸς οὗτος — この民があなたに何をしたというのか. ἐπήγαγες ἐπ᾿ αὐτοὺς ἁμαρτίαν μεγάλην — 彼らに大きな罪を負わせた (ἐπάγω — «наводить»)."
  22: "Μὴ ὀργίζου, κύριε — 怒らないでください、わたしの主よ (κύριε здесь — обращение к Моисею как к господину; слав. «господине», не «Господи»). τὸ ὅρμημα τοῦ λαοῦ — 民の激しさ (ὅρμημα — «порыв, натиск»; слав. «устремление»)."
  23: "λέγουσιν γάρ μοι — 彼らはわたしに…と言った (praesens historicum; слав. «глаголаша бо ми»). Слова народа — вложенная цитата 『…』. οὐκ οἴδαμεν, τί γέγονεν αὐτῷ — 何が起こったのか分からない."
  24: "Εἴ τινι ὑπάρχει χρυσία — 金を持っている者は (χρυσίον). περιέλεσθε — 外せ. ἔρριψα εἰς τὸ πῦρ — 火に投げ入れると. ἐξῆλθεν ὁ μόσχος οὗτος — この子牛が現れた (букв. «вышел»; Аарон умалчивает о резце, ср. 32:4)."
  25: "διεσκέδασται — 解れている (διασκεδάννυμι — «рассыпать»; perfect). διεσκέδασεν γὰρ αὐτοὺς Ααρων — アロンが彼らを解き放って. ἐπίχαρμα τοῖς ὑπεναντίοις αὐτῶν — 敵の嘲りの的 (ἐπίχαρμα — «посмешище»; ὑπεναντίος — «противник»). В базе стих обрамлён тире — передано придаточным."
  26: "ἐπὶ τῆς πύλης τῆς παρεμβολῆς — 宿営の門に. Τίς πρὸς κύριον; — 主の側につく者は (букв. «кто за Господа?»). ἴτω πρός με — わたしのところへ来なさい. οἱ υἱοὶ Λευι — レビの子ら."
  27: "Τάδε λέγει κύριος ὁ θεὸς Ισραηλ — イスラエルの神である主はこう言われる (пророческая формула). Θέσθε τὴν ῥομφαίαν ἐπὶ τὸν μηρόν — 腰に剣を帯び (ῥομφαία — «меч»; μηρός — «бедро»). ἀπὸ πύλης ἐπὶ πύλην — 門から門へ. τὸν πλησίον — 友, τὸν ἔγγιστα — 隣の者 (ближайший)."
  28: "καθὰ ἐλάλησεν αὐτοῖς Μωϋσῆς — モーセが言ったとおりに. ἔπεσαν…εἰς τρισχιλίους ἄνδρας — 約三千人が倒れた (εἰς с числом — «около»)."
  29: "Ἐπληρώσατε τὰς χεῖρας ὑμῶν — 手を満たした (выражение посвящения: «наполнить руки» = поставить на служение; ср. 28:41). ἕκαστος ἐν τῷ υἱῷ ἢ τῷ ἀδελφῷ — おのおの自分の子や兄弟によって (ἐν — «через, ценой»). δοθῆναι ἐφ᾿ ὑμᾶς εὐλογίαν — あなたがたに祝福が与えられるために."
  30: "μετὰ τὴν αὔριον — 翌日. Ὑμεῖς ἡμαρτήκατε ἁμαρτίαν μεγάλην — あなたがたは大きな罪を犯した (вин. внутреннего объекта). ἀναβήσομαι πρὸς τὸν θεόν — 神のもとへ上って行き. ἐξιλάσωμαι περὶ τῆς ἁμαρτίας — 罪のために償いをする (ἐξιλάσκομαι — «умилостивлять»)."
  31: "Δέομαι, κύριε — お願いです、主よ (δέομαι — «умолять»). θεοὺς χρυσοῦς — 金の神々 (слав. «боги златы»)."
  32: "εἰ μὲν ἀφεῖς… ἄφες — もし赦しになるのなら、赦してください (условие с императивом). ἐξάλειψόν με ἐκ τῆς βίβλου σου — あなたの書からわたしを消し去ってください (ἐξαλείφω — «изглаживать»; образ книги жизни). ἧς ἔγραψας — あなたが書かれた."
  33: "Εἴ τις ἡμάρτηκεν ἐνώπιόν μου — わたしの前で罪を犯した者 (букв. «если кто согрешил»). ἐξαλείψω αὐτὸν ἐκ τῆς βίβλου μου — わたしの書から消し去る (ответ на 32:32: не Моисей, а согрешившие)."
  34: "νυνὶ δέ — 今. ὁδήγησον — 連れて行きなさい (ὁδηγέω — «вести»). ἰδοὺ ὁ ἄγγελός μου προπορεύεται πρὸ προσώπου σου — わたしの天使があなたの前を進む. ᾗ δ᾿ ἂν ἡμέρᾳ ἐπισκέπτωμαι — わたしが訪れる日には (ἐπισκέπτομαι — «посещать, взыскивать»). ἐπάξω…τὴν ἁμαρτίαν — 罪を報いる (ἐπάγω)."
  35: "ἐπάταξεν κύριος τὸν λαόν — 主は民を打たれた (πατάσσω). περὶ τῆς ποιήσεως τοῦ μόσχου — 子牛のことで (ποίησις — «изготовление»). οὗ ἐποίησεν Ααρων — アロンが造った (вина Аарона названа прямо)."
