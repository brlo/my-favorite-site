# jp-box, Исход, глава 32. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru и ru
# (с масоретского — только для понимания). У jp-joc в этой главе текста нет.
# Язык — современный 常体, порядок членов и деление на клаузы — по греческому.
# Глава 32: золотой телец (1–6), гнев Бога и ходатайство Моисея (7–14),
# разбитые скрижали и уничтожение тельца (15–20), ответ Аарона (21–24),
# левиты и три тысячи (25–29), молитва Моисея о прощении (30–34),
# поражение народа (35).
# Красного и синего нет: речь Бога — в 「…」; слова народа и египтян внутри неё —
# в 『…』 (9, 12, 13, 23, 27). «<j>» не ставится.
# 32:9 — в gr-lxx-byz на месте стиха стоит «.»: слова «вот боги твои» модуль держит
# в конце ст. 8, а славянский текст делит иначе и читает их стихом 9. Держим
# церковное деление: ст. 8 кончается на «и сказали», ст. 9 — их слова; так как на
# месте ст. 9 в базе «.», стих стоит целиком в 〔…〕 (проверено: «ουτοι» в 32:9 — НЕТ).
# 32:14 — в базе ἱλάσθη («умилостивился»), а не μετενόησεν («раскаялся», евр. נחם,
# отсюда «отменил/раскаялся» в Синодальном): переводим по греч., отличие в notes.
# Сносок ⟨…⟩ нет: 燔祭, 祭壇, 安息日, 祭司 уже в корпусе; 子牛, 石板 понятны.
# jp-ni не использовался.

