# jp-box, Псалтирь, псалом 102. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация — славяно-синодальная (csl-ru): в слав. надписание отдельным стихом
# не стоит, поэтому наш стих 0 (надписание) влит в начало стиха 1; дальше номера 1..22.
# Разбивка — славяно-синодальная (csl-ru): граница между ст. 17 и 18 иная —
# в слав. «и правда Его на сынех сынов» уже начало ст. 18 (см. notes 17–18).
# Псалом 102: благословение души — благодеяния Господа (1–5), правда Его
# к обиженным (6), Моисей и народ (7), милость и отеческая жалость (8–14),
# краткость человеческой жизни (15–16), вечная милость к хранящим завет (17–18),
# престол Господень и хвала ангелов (19–22).
# Красного и синего нет: это благословение и хвала, а не евангельская речь Христа.
# Прямой речи нет, кавычки не ставятся.
# 〔…〕 нет: всё переведено по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 鷲, 冠, 御座, 軍勢, 塵 понятны или уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 102
draft: true

verses:
  1: "ダビデの詩[うた]。わたしの魂[たましい]よ、主[しゅ]をほめたたえよ。わたしの内[うち]にあるすべてのものよ、その聖[せい]なる名[な]をほめたたえよ。"
  2: "わたしの魂[たましい]よ、主[しゅ]をほめたたえよ。主[しゅ]のすべての報[むく]いを忘[わす]れるな。"
  3: "主[しゅ]はあなたのすべての不法[ふほう]を赦[ゆる]し、あなたのすべての病[やまい]を癒[いや]される。"
  4: "主[しゅ]はあなたの命[いのち]を滅[ほろ]びから贖[あがな]い、あわれみと慈[いつく]しみとをもってあなたに冠[かんむり]を授[さず]けられる。"
  5: "主[しゅ]はあなたの望[のぞ]みを善[よ]いもので満[み]たされる。あなたの若[わか]さはわしのように新[あら]たになる。"
  6: "主[しゅ]は恵[めぐ]みを行[おこな]い、すべていじめられる者[もの]に裁[さば]きを行[おこな]われる。"
  7: "主[しゅ]はその道[みち]をモーセに、その御心[みこころ]をイスラエルの子[こ]らに知[し]らせられた。"
  8: "主[しゅ]はあわれみ深く、情[なさ]け深く、寛容[かんよう]で、いつくしみに満[み]ちておられる。"
  9: "主[しゅ]は最後[さいご]まで怒[いか]り続[つづ]けず、とこしえに憤[いきどお]りを抱[いだ]かない。"
  10: "主[しゅ]はわたしたちの罪[つみ]に応[おう]じてわたしたちを扱[あつか]わず、わたしたちの不法[ふほう]に応[おう]じて報[むく]いられない。"
  11: "天[てん]が地[ち]から高[たか]く離[はな]れているように、主[しゅ]はご自分[じぶん]を恐[おそ]れる者[もの]たちへのあわれみを大[おお]きくされた。"
  12: "東[ひがし]が西[にし]から遠[とお]く離[はな]れているように、主[しゅ]はわたしたちの不法[ふほう]をわたしたちから遠[とお]ざけられた。"
  13: "父[ちち]がその子[こ]らをあわれむように、主[しゅ]はご自分[じぶん]を恐[おそ]れる者[もの]たちをあわれまれた。"
  14: "主[しゅ]はわたしたちが何[なに]から造[つく]られたかを知[し]っておられ、わたしたちが塵[ちり]であることを覚[おぼ]えておられる。"
  15: "人[ひと]の日[ひ]々[び]は草[くさ]のようであり、野[の]の花[はな]のように咲[さ]いては消[き]える。"
  16: "霊[れい]がその上[うえ]を過[す]ぎ去[さ]ると、それは消[き]え失[う]せ、その場所[ばしょ]ももはや知[し]られない。"
  17: "しかし、主[しゅ]のあわれみは、とこしえからとこしえまで、主[しゅ]を恐[おそ]れる者[もの]たちの上[うえ]にあり、"
  18: "その義[ぎ]は子[こ]の子[こ]らに及[およ]び、主[しゅ]の契約[けいやく]を守[まも]り、その戒[いまし]めを覚[おぼ]えて行[おこな]う者[もの]たちに及[およ]ぶ。"
  19: "主[しゅ]は天[てん]にご自分[じぶん]の御座[みくら]を備[そな]え、その王国[おうこく]はすべてのものを治[おさ]める。"
  20: "主[しゅ]をほめたたえよ、そのすべての天使[てんし]たちよ。力[ちから]ある者[もの]たちよ、主[しゅ]の言葉[ことば]の声[こえ]に聞[き]き従[したが]って、その言葉[ことば]を行[おこな]う者[もの]たちよ。"
  21: "主[しゅ]をほめたたえよ、そのすべての軍勢[ぐんぜい]よ。その御心[みこころ]を行[おこな]う仕[つか]え人[びと]たちよ。"
  22: "主[しゅ]をほめたたえよ、その支配[しはい]の及[およ]ぶすべての場所[ばしょ]にある、そのすべてのわざよ。わたしの魂[たましい]よ、主[しゅ]をほめたたえよ。"

notes:
  1: "Τῷ Δαυιδ — ダビデの詩; в gr-lxx-byz строка 0 есть, взято оттуда. Надписание — стих 0 (в csl-ru отдельного стиха нет, влито в ст. 1), скобками не маркируется. Εὐλόγει, ἡ ψυχή μου, τὸν κύριον — わたしの魂よ、主をほめたたえよ (εὐλογέω — «благословлять», передано ほめたたえる, как по корпусу). πάντα τὰ ἐντός μου — わたしの内にあるすべてのもの (τὰ ἐντός — «внутренности», всё внутреннее). τὸ ὄνομα τὸ ἅγιον αὐτοῦ — その聖なる名."
  2: "εὐλόγει, ἡ ψυχή μου, τὸν κύριον — повтор ст. 1, сохранён. μὴ ἐπιλανθάνου πάσας τὰς ἀνταποδόσεις αὐτοῦ — 主のすべての報いを忘れるな (ἀνταπόδοσις — «воздаяние»; здесь в смысле благодеяний, ср. ст. 10)."
  3: "τὸν εὐιλατεύοντα πάσαις ταῖς ἀνομίαις σου — あなたのすべての不法を赦す方 (εὐιλατεύω — «умилостивлять, прощать»; ἀνομία — 不法). τὸν ἰώμενον πάσας τὰς νόσους σου — あなたのすべての病を癒す方 (ἰάομαι — «исцелять»; νόσος — 病)."
  4: "τὸν λυτρούμενον ἐκ φθορᾶς τὴν ζωήν σου — あなたの命を滅びから贖う方 (λυτρόω — «искупать, избавлять»; φθορά — «тление, погибель»; 命 — ζωή). τὸν στεφανοῦντά σε ἐν ἐλέει καὶ οἰκτιρμοῖς — あわれみと慈しみとをもってあなたに冠を授ける方 (στεφανόω — «венчать»; οἰκτιρμός — «щедроты, сострадание»)."
  5: "τὸν ἐμπιπλῶντα ἐν ἀγαθοῖς τὴν ἐπιθυμίαν σου — あなたの望みを善いもので満たす方 (ἐμπίμπλημι — «наполнять»; ἐπιθυμία — «желание»). ἀνακαινισθήσεται ὡς ἀετοῦ ἡ νεότης σου — あなたの若さはわしのように新たになる (ἀνακαινίζω — «обновлять»; νεότης — «юность»; ἀετός — わし); образ обновления сил."
  6: "ποιῶν ἐλεημοσύνας ὁ κύριος — 主は恵みを行う (ἐλεημοσύνη — «милостыня, благодеяние»). κρίμα πᾶσι τοῖς ἀδικουμένοις — すべていじめられる者に裁きを行う (κρίμα — «суд, правда»; ἀδικέω — «обижать»)."
  7: "ἐγνώρισεν τὰς ὁδοὺς αὐτοῦ τῷ Μωυσῇ — 主はその道をモーセに知らせ (γνωρίζω — «открывать, делать известным»). τοῖς υἱοῖς Ισραηλ τὰ θελήματα αὐτοῦ — その御心をイスラエルの子らに (θέλημα — «воля, хотение»); ср. Исх 33:13."
  8: "οἰκτίρμων καὶ ἐλεήμων ὁ κύριος — 主はあわれみ深く、情け深く (οἰκτίρμων — あわれみ深い, ἐλεήμων — 情け深い; формула Исх 34:6). μακρόθυμος — 寛容で (μακρόθυμος — «долготерпеливый», как в Пс 7:12). πολυέλεος — いつくしみに満ちておられる (πολυέλεος — «многомилостивый»); четыре слова переданы четырьмя."
  9: "οὐκ εἰς τέλος ὀργισθήσεται — 主は最後まで怒り続けず (εἰς τέλος — «до конца»). οὐδὲ εἰς τὸν αἰῶνα μηνιεῖ — とこしえに憤りを抱かない (μηνίω — «гневаться, держать гнев»)."
  10: "οὐ κατὰ τὰς ἁμαρτίας ἡμῶν ἐποίησεν ἡμῖν — わたしたちの罪に応じてわたしたちを扱わず (κατά — «по, соразмерно»). οὐδὲ κατὰ τὰς ἀνομίας ἡμῶν ἀνταπέδωκεν ἡμῖν — わたしたちの不法に応じて報いられない (ἀνταποδίδωμι — «воздавать»); параллелизм сохранён."
  11: "κατὰ τὸ ὕψος τοῦ οὐρανοῦ ἀπὸ τῆς γῆς — 天が地から高く離れているように (ὕψος — «высота»). ἐκραταίωσεν κύριος τὸ ἔλεος αὐτοῦ ἐπὶ τοὺς φοβουμένους αὐτόν — 主はご自分を恐れる者たちへのあわれみを大きくされた (κραταιόω — «утверждать, делать крепким»; φοβέομαι — «благоговеть»)."
  12: "καθ᾿ ὅσον ἀπέχουσιν ἀνατολαὶ ἀπὸ δυσμῶν — 東が西から遠く離れているように (ἀπέχω — «отстоять»; ἀνατολή — «восток», δύσις — «запад»). ἐμάκρυνεν ἀφ᾿ ἡμῶν τὰς ἀνομίας ἡμῶν — 主はわたしたちの不法をわたしたちから遠ざけられた (μακρύνω — «удалять»)."
  13: "καθὼς οἰκτίρει πατὴρ υἱούς — 父がその子らをあわれむように (οἰκτίρω — «миловать»). οἰκτίρησεν κύριος τοὺς φοβουμένους αὐτόν — 主はご自分を恐れる者たちをあわれまれた; аорист как совершившееся."
  14: "ὅτι αὐτὸς ἔγνω τὸ πλάσμα ἡμῶν — 主はわたしたちが何から造られたかを知っておられ (πλάσμα — «создание, вылепленное»; ср. Быт 2:7). μνήσθητι ὅτι χοῦς ἐσμεν — わたしたちが塵であることを覚えておられる (χοῦς — «прах»; в греч. повелительное «вспомни», но по смыслу и по jp-joc/Синодальному — утверждение о Боге, поэтому 覚えておられる)."
  15: "ἄνθρωπος, ὡσεὶ χόρτος αἱ ἡμέραι αὐτοῦ — 人の日々は草のようであり (χόρτος — 草). ὡσεὶ ἄνθος τοῦ ἀγροῦ, οὕτως ἐξανθήσει — 野の花のように咲いては消える (ἄνθος — «цветок»; ἐξανθέω — «расцветать и отцветать»); образ краткости жизни, ср. Ис 40:6–7."
  16: "ὅτι πνεῦμα διῆλθεν ἐν αὐτῷ — 霊がその上を過ぎ去ると (πνεῦμα — «дыхание, ветер»; в церковном чтении «дух», поэтому 霊[れい], как и по списку терминов корпуса; jp-joc — 風). καὶ οὐχ ὑπάρξει — それは消え失せ (ὑπάρχω — «существовать»). οὐκ ἐπιγνώσεται ἔτι τὸν τόπον αὐτοῦ — その場所ももはや知られない (ἐπιγινώσκω — «узнавать»)."
  17: "τὸ δὲ ἔλεος τοῦ κυρίου ἀπὸ τοῦ αἰῶνος καὶ ἕως τοῦ αἰῶνος — しかし、主のあわれみは、とこしえからとこしえまで (αἰών — «век»). ἐπὶ τοὺς φοβουμένους αὐτόν — 主を恐れる者たちの上にあり. ἡ δικαιοσύνη αὐτοῦ ἐπὶ υἱοὺς υἱῶν — その義は子の子らに及ぶ (υἱοὶ υἱῶν — «сыны сынов», т. е. потомки). По csl-ru граница иная: «и правда Его на сынех сынов» относится уже к ст. 18, поэтому яп. «その義は子の子らに及び» перенесено в начало ст. 18."
  18: "Слав. ст. 18 начинается словами «и правда Его на сынех сынов, хранящих завет Его…» — яп. начало взято из конца ст. 17. τοῖς φυλάσσουσιν τὴν διαθήκην αὐτοῦ — 主の契約を守る者たちに (φυλάσσω — «хранить»). μεμνημένοις τῶν ἐντολῶν αὐτοῦ τοῦ ποιῆσαι αὐτάς — その戒めを覚えて行う者たちに (μιμνήσκομαι — «помнить»; инфинитив цели)."
  19: "κύριος ἐν τῷ οὐρανῷ ἡτοίμασεν τὸν θρόνον αὐτοῦ — 主は天にご自分の御座を備え (θρόνος — 御座[みくら], как по корпусу). ἡ βασιλεία αὐτοῦ πάντων δεσπόζει — その王国はすべてのものを治める (δεσπόζω — «владычествовать»)."
  20: "εὐλογεῖτε τὸν κύριον, πάντες οἱ ἄγγελοι αὐτοῦ — 主をほめたたえよ、そのすべての天使たちよ. δυνατοὶ ἰσχύι — 力ある者たちよ (ἰσχύς — «сила, крепость»). ποιοῦντες τὸν λόγον αὐτοῦ — その言葉を行う者たちよ. τοῦ ἀκοῦσαι τῆς φωνῆς τῶν λόγων αὐτοῦ — その言葉の声に聞き従って (инфинитив цели: слушать голос слов Его)."
  21: "εὐλογεῖτε τὸν κύριον, πᾶσαι αἱ δυνάμεις αὐτοῦ — 主をほめたたえよ、そのすべての軍勢よ (δύναμις — «сила, воинство»). λειτουργοὶ αὐτοῦ ποιοῦντες τὸ θέλημα αὐτοῦ — その御心を行う仕え人たちよ (λειτουργός — «служитель»)."
  22: "εὐλογεῖτε τὸν κύριον, πάντα τὰ ἔργα αὐτοῦ — 主をほめたたえよ、そのすべてのわざよ. ἐν παντὶ τόπῳ τῆς δεσποτείας αὐτοῦ — その支配の及ぶすべての場所に (δεσποτεία — «владычество»). εὐλόγει, ἡ ψυχή μου, τὸν κύριον — わたしの魂よ、主をほめたたえよ; рамка псалма замкнута, повтор ст. 1 сохранён."
