verses:
  1: "イエスは十二人[じゅうににん]を呼[よ]び寄[よ]せ、すべての悪霊[あくりょう]に対[たい]する力[ちから]と権威[けんい]、また病[やまい]を癒[いや]す力[ちから]をお与[あた]えになった。"
  2: "そして、神[かみ]の国[くに]を宣[の]べ伝[つた]え、病人[びょうにん]を癒[いや]すために彼[かれ]らを遣[つか]わされた。"
  3: "そして言[い]われた。「<j>旅[たび]には何[なに]も持[も]って行[い]ってはならない。杖[つえ]も、袋[ふくろ]も、パンも、銀[ぎん]も、衣[ころも]二枚[にまい]も。</j>"
  4: "<j>どの家[いえ]に入[はい]っても、そこに留[とど]まり、そこから出[で]かけるようにしなさい。</j>"
  5: "<j>あなたがたを受[う]け入[い]れない者[もの]がいたら、その町[まち]を出[で]るとき、足[あし]の塵[ちり]を払[はら]い落[お]として、彼[かれ]らに対[たい]する証[あかし]としなさい。</j>」"
  6: "弟子[でし]たちは出[で]て行[い]き、村々[むらむら]を巡[めぐ]って、いたるところで福音[ふくいん]を告[つ]げ知[し]らせ、人々[ひとびと]を癒[いや]した。"
  7: "領主[りょうしゅ]ヘロデは、起[お]こっているすべてのことを聞[き]いて、当惑[とうわく]した。ある人々[ひとびと]が、ヨハネが死[し]んだ者[もの]の中[なか]から復活[ふっかつ]したと言[い]っていたからである。"
  8: "ほかの者[もの]たちはエリヤが現[あらわ]れたと言[い]い、またほかの者[もの]たちは昔[むかし]の預言者[よげんしゃ]の一人[ひとり]が復活[ふっかつ]したと言[い]っていた。"
  9: "ヘロデは言[い]った。「ヨハネはわたしが首[くび]をはねた。それなのに、このようなことを聞[き]かされているこの人[ひと]は、いったい誰[だれ]なのか。」そして、イエスに会[あ]いたいと思[おも]った。"
  10: "使徒[しと]たちは帰[かえ]って来[き]て、自分[じぶん]たちが行[おこな]ったことをすべてイエスに話[はな]した。イエスは彼[かれ]らを連[つ]れて、人[ひと]目[め]を避[さ]けて、ベツサイダという町[まち]の〔人里[ひとざと]離[はな]れた所[ところ]〕へ退[しりぞ]かれた。"
  11: "群衆[ぐんしゅう]はそれを知[し]って、イエスの後[あと]を追[お]って来[き]た。イエスは彼[かれ]らを迎[むか]え入[い]れ、神[かみ]の国[くに]について語[かた]り、癒[いや]しを必要[ひつよう]とする者[もの]たちを癒[いや]された。"
  12: "日[ひ]が傾[かたむ]き始[はじ]めたころ、十二人[じゅうににん]が近[ちか]づいて言[い]った。「群衆[ぐんしゅう]を解散[かいさん]させてください。周[まわ]りの村[むら]や村里[そんり]へ行[い]って宿[やど]を取[と]り、食[た]べ物[もの]を手[て]に入[い]れるためです。ここは人里[ひとざと]離[はな]れた所[ところ]ですから。」"
  13: "イエスは言[い]われた。「<j>あなたがたが、彼[かれ]らに食[た]べさせなさい。</j>」彼[かれ]らは言[い]った。「わたしたちには、五[いつ]つのパンと二匹[にひき]の魚[さかな]のほか、何[なに]もありません。わたしたちが行[い]って、この民[たみ]すべてのために食[た]べ物[もの]を買[か]うのでなければ。」"
  14: "男[おとこ]だけでおよそ五千人[ごせんにん]いたからである。イエスは弟子[でし]たちに言[い]われた。「<j>彼[かれ]らを五十人[ごじゅうにん]ずつの組[くみ]に分[わ]けて座[すわ]らせなさい。</j>」"
  15: "弟子[でし]たちはそのとおりにして、皆[みな]を座[すわ]らせた。"
  16: "イエスは五[いつ]つのパンと二匹[にひき]の魚[さかな]を取[と]り、天[てん]を仰[あお]いで祝福[しゅくふく]してから裂[さ]き、弟子[でし]たちに渡[わた]して、群衆[ぐんしゅう]の前[まえ]に置[お]かせになった。"
  17: "人々[ひとびと]は皆[みな]、食[た]べて満[み]ち足[た]りた。そして、余[あま]ったパンくずは十二[じゅうに]のかごに集[あつ]められた。"
  18: "イエスがひとりで祈[いの]っておられると、弟子[でし]たちもそばにいた。イエスは彼[かれ]らに尋[たず]ねられた。「<j>群衆[ぐんしゅう]は、わたしを誰[だれ]だと言[い]っているか。</j>」"
  19: "彼[かれ]らは答[こた]えた。「洗礼者[せんれいしゃ]ヨハネだと言[い]う人[ひと]もあれば、エリヤだと言[い]う人[ひと]もいます。また、昔[むかし]の預言者[よげんしゃ]の一人[ひとり]が復活[ふっかつ]したのだと言[い]う人[ひと]もいます。」"
  20: "イエスは言[い]われた。「<j>では、あなたがたは、わたしを誰[だれ]だと言[い]うのか。</j>」ペトロが答[こた]えて言[い]った。「神[かみ]のキリストです。」"
  21: "イエスは彼[かれ]らを厳[きび]しく戒[いまし]めて、このことをだれにも話[はな]さないようにお命[めい]じになった。"
  22: "そして言[い]われた。「<j>人[ひと]の子[こ]は多[おお]くの苦[くる]しみを受[う]け、長老[ちょうろう]たち、祭司長[さいしちょう]たち、律法学者[りっぽうがくしゃ]たちに排斥[はいせき]され、殺[ころ]され、三日目[みっかめ]に復活[ふっかつ]する。</j>」"
  23: "イエスは皆[みな]に言[い]われた。「<j>だれでもわたしの後[あと]について来[き]たいと思[おも]う者[もの]は、自分[じぶん]を捨[す]て、日々[ひび]自分[じぶん]の十字架[じゅうじか]を負[お]って、わたしに従[したが]いなさい。</j>"
  24: "<j>自分[じぶん]の命[いのち]を救[すく]おうとする者[もの]は、それを失[うしな]う。わたしのために自分[じぶん]の命[いのち]を失[うしな]う者[もの]は、それを救[すく]う。</j>"
  25: "<j>人[ひと]が全世界[ぜんせかい]を手[て]に入[い]れても、自分[じぶん]を失[うしな]い、損[そこな]うなら、何[なん]の益[えき]があるだろうか。</j>"
  26: "<j>わたしとわたしの言葉[ことば]を恥[は]じる者[もの]は、人[ひと]の子[こ]も、自分[じぶん]と父[ちち]と聖[せい]なる天使[てんし]たちの栄光[えいこう]のうちに来[く]るとき、その者[もの]を恥[は]じるのである。</j>"
  27: "<j>あなたがたに真[まこと]に言[い]う。ここに立[た]っている者[もの]の中[なか]には、神[かみ]の国[くに]を見[み]るまで、決[けっ]して死[し]を味[あじ]わわない者[もの]がいる。</j>」"
  28: "これらの言葉[ことば]の後[のち]、およそ八日[ようか]たって、イエスはペトロ、ヨハネ、ヤコブを連[つ]れて、祈[いの]るために山[やま]へ登[のぼ]られた。"
  29: "祈[いの]っておられるうちに、顔[かお]の様子[ようす]が変[か]わり、衣[ころも]は白[しろ]く輝[かがや]いた。"
  30: "すると、見[み]よ、二人[ふたり]の人[ひと]がイエスと語[かた]り合[あ]っていた。それはモーセとエリヤであった。"
  31: "二人[ふたり]は栄光[えいこう]のうちに現[あらわ]れ、イエスがエルサレムで果[は]たそうとしておられる逝去[せいきょ]について話[はな]していた。"
  32: "ペトロと一緒[いっしょ]にいた者[もの]たちは、眠[ねむ]けに沈[しず]んでいた。しかし、目[め]を覚[さ]ますと、イエスの栄光[えいこう]と、そばに立[た]つ二人[ふたり]の人[ひと]を見[み]た。"
  33: "二人[ふたり]がイエスから離[はな]れようとしたとき、ペトロがイエスに言[い]った。「先生[せんせい]、ここにいるのはよいことです。小屋[こや]を三[みっ]つ造[つく]りましょう。一[ひと]つはあなたのため、一[ひと]つはモーセのため、一[ひと]つはエリヤのためです。」自分[じぶん]で何[なに]を言[い]っているのか、分[わ]かっていなかったのである。"
  34: "ペトロがこう言[い]っていると、雲[くも]が現[あらわ]れて彼[かれ]らを覆[おお]った。彼[かれ]らは雲[くも]の中[なか]に入[はい]ると、恐[おそ]れた。"
  35: "すると、雲[くも]の中[なか]から声[こえ]が聞[き]こえた。「これはわたしの愛[あい]する子[こ]。彼[かれ]の言[い]うことを聞[き]きなさい。」"
  36: "声[こえ]が聞[き]こえ終[お]わると、そこにはイエスだけがおられた。弟子[でし]たちは黙[だま]り込[こ]み、そのころは、見[み]たことをだれにも話[はな]さなかった。"
  37: "翌日[よくじつ]、彼[かれ]らが山[やま]から下[お]りると、大勢[おおぜい]の群衆[ぐんしゅう]がイエスを迎[むか]えた。"
  38: "すると、群衆[ぐんしゅう]の中[なか]の一人[ひとり]が叫[さけ]んだ。「先生[せんせい]、お願[ねが]いです。わたしの息子[むすこ]をご覧[らん]ください。ひとり子[ご]なのです。"
  39: "霊[れい]がこの子[こ]を捕[つか]まえると、子[こ]は突然[とつぜん]叫[さけ]び、泡[あわ]を吹[ふ]いて引[ひ]きつけます。霊[れい]はなかなか離[はな]れず、子[こ]を痛[いた]めつけるのです。"
  40: "あなたの弟子[でし]たちに追[お]い出[だ]していただくようお願[ねが]いしましたが、できませんでした。」"
  41: "イエスは答[こた]えて言[い]われた。「<j>ああ、不信仰[ふしんこう]で曲[ま]がった時代[じだい]よ。いつまでわたしはあなたがたと一緒[いっしょ]にいて、あなたがたを我慢[がまん]しなければならないのか。あなたの息子[むすこ]をここへ連[つ]れて来[き]なさい。</j>」"
  42: "子[こ]どもが近[ちか]づくと、悪霊[あくりょう]はその子[こ]を引[ひ]き倒[たお]して、激[はげ]しく引[ひ]きつけさせた。イエスは汚[けが]れた霊[れい]をお叱[しか]りになり、子[こ]どもを癒[いや]して、父[ちち]に返[かえ]された。"
  43: "人々[ひとびと]は皆[みな]、神[かみ]の偉大[いだい]さに驚[おどろ]いた。皆[みな]がイエスの行[おこな]われるすべてのことに感嘆[かんたん]していると、イエスは弟子[でし]たちに言[い]われた。"
  44: "「<j>これらの言葉[ことば]を、あなたがたの耳[みみ]にしっかりと納[おさ]めなさい。人[ひと]の子[こ]は人々[ひとびと]の手[て]に渡[わた]されるのである。</j>」"
  45: "しかし、弟子[でし]たちにはこの言葉[ことば]が分[わ]からなかった。彼[かれ]らに悟[さと]られないように、それは隠[かく]されていたのである。彼[かれ]らは、この言葉[ことば]についてイエスに尋[たず]ねるのを恐[おそ]れた。"
  46: "さて、弟子[でし]たちの間[あいだ]に、自分[じぶん]たちのうちで誰[だれ]が一番[いちばん]大[おお]きいかという考[かんが]えが生[しょう]じた。"
  47: "イエスは彼[かれ]らの心[こころ]の思[おも]いを見[み]抜[ぬ]いて、一人[ひとり]の子[こ]どもを手[て]に取[と]って自分[じぶん]のそばに立[た]たせ、"
  48: "彼[かれ]らに言[い]われた。「<j>この子[こ]どもをわたしの名[な]のゆえに受[う]け入[い]れる者[もの]は、わたしを受[う]け入[い]れるのである。わたしを受[う]け入[い]れる者[もの]は、わたしを遣[つか]わした方[かた]を受[う]け入[い]れるのである。あなたがたすべての中[なか]で最[もっと]も小[ちい]さい者[もの]こそ、大[おお]きい者[もの]なのである。</j>」"
  49: "ヨハネが答[こた]えて言[い]った。「先生[せんせい]、あなたの名[な]によって悪霊[あくりょう]を追[お]い出[だ]している人[ひと]を見[み]かけました。でも、わたしたちに従[したが]っていないので、止[と]めさせました。」"
  50: "イエスは言[い]われた。「<j>止[と]めてはならない。あなたがたに反[はん]しない者[もの]は、あなたがたの味方[みかた]なのである。</j>」"
  51: "天[てん]に上[あ]げられる日々[ひび]が満[み]ちようとしていたころ、イエスは顔[かお]をエルサレムへ向[む]け、"
  52: "ご自分[じぶん]の前[まえ]に使者[ししゃ]たちを遣[つか]わされた。使者[ししゃ]たちはサマリア人[びと]の村[むら]へ行[い]き、イエスのために用意[ようい]をしようとしたが、"
  53: "イエスがエルサレムへ向[む]かっておられたので、村[むら]の人々[ひとびと]はイエスを受[う]け入[い]れなかった。"
  54: "弟子[でし]のヤコブとヨハネはこれを見[み]て言[い]った。「主[しゅ]よ、〔エリヤがしたように〕天[てん]から火[ひ]を降[ふ]らせて、彼[かれ]らを焼[や]き滅[ほろ]ぼしてしまいましょうか。」"
  55: "イエスは振[ふ]り向[む]いて彼[かれ]らをお叱[しか]りになり、〔言[い]われた。「<j>あなたがたは、自分[じぶん]がどんな霊[れい]に属[ぞく]しているかを知[し]らない。</j>」〕"
  56: "〔<j>人[ひと]の子[こ]が来[き]たのは、人[ひと]の霊[れい]を滅[ほろ]ぼすためではなく、救[すく]うためである。</j>〕そして、一行[いっこう]は別[べつ]の村[むら]へ向[む]かった。"
  57: "一同[いちどう]が道[みち]を行[ゆ]くとき、ある人[ひと]がイエスに言[い]った。「〔主[しゅ]よ、〕あなたがどこへ行[い]かれても、わたしはあなたに従[したが]います。」"
  58: "イエスは言[い]われた。「<j>狐[きつね]には穴[あな]があり、空[そら]の鳥[とり]には巣[す]がある。しかし、人[ひと]の子[こ]には、頭[あたま]を置[お]く所[ところ]さえない。</j>」"
  59: "イエスはほかの人[ひと]に言[い]われた。「<j>わたしに従[したが]いなさい。</j>」その人[ひと]は言[い]った。「〔主[しゅ]よ、〕まず行[い]って、父[ちち]を葬[ほうむ]らせてください。」"
  60: "イエスは言[い]われた。「<j>死[し]んだ者[もの]たちに、自分[じぶん]の死[し]んだ者[もの]を葬[ほうむ]らせなさい。あなたは行[い]って、神[かみ]の国[くに]を告[つ]げ知[し]らせなさい。</j>」"
  61: "また、ほかの人[ひと]も言[い]った。「主[しゅ]よ、わたしはあなたに従[したが]います。ただ、まず家[いえ]の者[もの]たちに別[わか]れを告[つ]げさせてください。」"
  62: "イエスは言[い]われた。「<j>鋤[すき]に手[て]を掛[か]けてから後[うし]ろを振[ふ]り向[む]く者[もの]は、神[かみ]の国[くに]にふさわしくない。</j>」"

notes:
  1: "δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια — 力と権威; ἐπὶ πάντα — すべての悪霊に対する."
  2: "τοὺς ἀσθενεῖς в критической базе в квадратных скобках; в церковном тексте читается — без 〔〕: колебание критиков, а не добавка Церкви."
  3: "μήτε [ἀνὰ] δύο χιτῶνας — 衣二枚; частица ἀνὰ в критической базе под скобками, смысла не меняет, поэтому без 〔〕."
  7: "τετραάρχης — тетрарх; 領主, как принято для Ирода Антипы. Слова Ирода — не красным."
  10: "Церковь (TR, jp-joc「野の處」) читает εἰς τόπον ἔρημον πόλεως καλουμένης Βηθσαϊδά — 〔人里離れた所〕; в критической базе только εἰς πόλιν."
  13: "εἰ μήτι — «разве только»; 買うのでなければ: вопрос сохранён незавершённым, как в греческом."
  14: "κλισίας ἀνὰ πεντήκοντα — «рядами по пятидесяти»; 五十人ずつの組に分けて."
  16: "εὐλόγησεν — благословил; 祝福して, κατέκλασεν — 裂き."
  17: "κόφινοι — かご (кана; не 籠)."
  20: "τὸν Χριστὸν τοῦ θεοῦ — «Христа Божия»; 神のキリスト (не メシア: иначе не срабатывает калька ハリストス)."
  22: "ἀποδοκιμασθῆναι — «быть отвергнутым»; 排斥され, без сглаживания."
  23: "καθ᾽ ἡμέραν — «ежедневно»; 日々 (церковное чтение, есть и в критической базе)."
  26: "ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων — 自分と父と聖なる天使たちの栄光."
  27: "γεύσωνται θανάτου — 死を味わわない."
  31: "ἔξοδος — «исход»; 逝去. По-японски слово не несёт связи с Исходом, поэтому связь не подсказываю и не сглаживаю в «кончину»."
  35: "В критической базе ὁ ἐκλελεγμένος («избранный»); Церковь (TR, jp-joc「至愛の子」) читает ὁ ἀγαπητός — 愛する子, замена без 〔〕. Слова Отца — не красным."
  38: "Слова отца отрока — не красным; μονογενής — ひとり子."
  39: "σπαράσσει μετὰ ἀφροῦ — 泡を吹いて引きつけ; μόγις ἀποχωρεῖ — なかなか離れず."
  44: "θέσθε εἰς τὰ ὦτα ὑμῶν — 耳にしっかりと納めなさい."
  48: "μικρότερος ἐν πᾶσιν ὑμῖν — あなたがたすべての中で最も小さい者."
  51: "τὸ πρόσωπον ἐστήρισεν τοῦ πορεύεσθαι — «утвердил лицо, чтобы идти»; 顔をエルサレムへ向け, без сглаживания в «решил идти»."
  52: "ἀγγέλους — 使者 (не 天使: здесь посланные люди)."
  54: "Церковь (TR, jp-joc「イリヤの爲しゝ如く」) добавляет ὡς καὶ Ἠλίας ἐποίησεν — 〔エリヤがしたように〕; в критической базе этого нет."
  55: "В критической базе только στραφεὶς ἐπετίμησεν αὐτοῖς; Церковь читает и слова «не знаете, какого вы духа» — весь оборот в 〔…〕."
  56: "Церковь добавляет «Сын Человеческий пришёл не губить души, а спасать» — в 〔…〕; в критической базе стих начинается сразу с καὶ ἐπορεύθησαν εἰς ἑτέραν κώμην."
  57: "В критической базе нет κύριε; Церковь (TR, jp-joc「主よ」) читает — 〔主よ〕."
  59: "[Κύριε] в критической базе в квадратных скобках; Церковь читает — 〔主よ〕."
  62: "ἄροτρον — плуг; 鋤. βλέπων εἰς τὰ ὀπίσω — 後ろを振り向く."
