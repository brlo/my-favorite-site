verses:
  1: "主[しゅ]はモーセに言[い]われた。"
  2: "「イスラエルの子[こ]らに告[つ]げなさい。わたしのために献[ささ]げ物[もの]を取[と]りなさい。心[こころ]から進[すす]んで差[さ]し出[だ]すすべての者[もの]から、わたしのための献[ささ]げ物[もの]を取[と]りなさい。"
  3: "取[と]り集[あつ]める献[ささ]げ物[もの]はこれである。金[きん]、銀[ぎん]、青銅[せいどう]、"
  4: "青[あお]の糸[いと]、紫[むらさき]の糸[いと]、二重[にじゅう]に撚[よ]った緋[ひ]の糸[いと]、撚[よ]った亜麻布[あまぬの]、山羊[やぎ]の毛[け]、"
  5: "赤[あか]く染[そ]めた雄羊[おひつじ]の皮[かわ]、青[あお]い皮[かわ]、アカシアの木[ざい]⟨荒[あ]れ野[の]に育[そだ]つ、堅[かた]くて腐[くさ]りにくい木[き]。⟩、"
  6: "〔灯[ともしび]のための油[あぶら]、塗[ぬ]り油[あぶら]と香[こう]を調[ととの]えるための香料[こうりょう]、〕"
  7: "サルディオス石[せき]、エフォド⟨祭司[さいし]が肩[かた]にかけて着[き]る祭服[さいふく]。⟩と長衣[ながぎぬ]に嵌[は]め込[こ]むための石[いし]、"
  8: "あなたはわたしのために聖所[せいしょ]を造[つく]らなければならない。わたしはあなたがたの間[あいだ]に現[あらわ]れる。"
  9: "わたしが山[やま]であなたに示[しめ]すすべてに従[したが]って、すなわち、幕屋[まくや]の型[かた]と、そのすべての器[うつわ]の型[かた]に従[したが]って、あなたはそれを作[つく]らなければならない。そのとおりに作[つく]りなさい。」"
  10: "「あなたはアカシアの木[ざい]で契約[けいやく]の箱[はこ]を造[つく]らなければならない。長[なが]さは二[に]キュビト半[はん]、幅[はば]は一[いっ]キュビト半[はん]、高[たか]さは一[いっ]キュビト半[はん]である。"
  11: "純金[じゅんきん]でそれを覆[おお]わなければならない。内側[うちがわ]も外側[そとがわ]も金[きん]で覆[おお]い、その周[まわ]りに金[きん]の撚[よ]り飾[かざ]りを巡[めぐ]らす。"
  12: "また、そのために金[きん]の環[かん]を四[よっ]つ鋳[い]て、四[よっ]つの側面[そくめん]に付[つ]ける。一[ひと]つの側面[そくめん]に二[ふた]つの環[かん]、次[つぎ]の側面[そくめん]に二[ふた]つの環[かん]を付[つ]ける。"
  13: "アカシアの木[ざい]で担[にな]い棒[ぼう]を造[つく]り、それを金[きん]で覆[おお]わなければならない。"
  14: "その担[にな]い棒[ぼう]を、契約[けいやく]の箱[はこ]の側面[そくめん]にある環[かん]に通[とお]し、それによって箱[はこ]を運[はこ]ぶ。"
  15: "担[にな]い棒[ぼう]は契約[けいやく]の箱[はこ]の環[かん]から抜[ぬ]いてはならない。"
  16: "あなたは、わたしがあなたに与[あた]える証[あかし]の板[いた]を箱[はこ]の中[なか]に入[い]れなければならない。"
  17: "また、純金[じゅんきん]で贖[あがな]いの座[ざ]⟨箱[はこ]の上[うえ]に載[の]せる金[きん]の蓋[ふた]。ここに神[かみ]が臨[のぞ]まれる。⟩を造[つく]らなければならない。長[なが]さは二[に]キュビト半[はん]、幅[はば]は一[いっ]キュビト半[はん]である。"
  18: "また、金[きん]で二[ふた]つのケルビムを打[う]ち出[だ]し細工[ざいく]で造[つく]り、贖[あがな]いの座[ざ]の両端[りょうたん]に置[お]かなければならない。"
  19: "一[ひと]つのケルビムをこちら側[がわ]に、もう一[ひと]つのケルビムをあちら側[がわ]に造[つく]る。すなわち、贖[あがな]いの座[ざ]の両端[りょうたん]に二[ふた]つのケルビムを造[つく]る。"
  20: "ケルビムは翼[つばさ]を上[うえ]に広[ひろ]げ、その翼[つばさ]で贖[あがな]いの座[ざ]を覆[おお]う。彼[かれ]らの顔[かお]は互[たが]いに向[む]かい合[あ]い、その顔[かお]は贖[あがな]いの座[ざ]の方[ほう]を向[む]く。"
  21: "あなたは贖[あがな]いの座[ざ]を箱[はこ]の上[うえ]に載[の]せ、わたしがあなたに与[あた]える証[あかし]の板[いた]を箱[はこ]の中[なか]に入[い]れなければならない。"
  22: "わたしはそこであなたにご自身[じしん]を知[し]らせ、贖[あがな]いの座[ざ]の上[うえ]、契約[けいやく]の箱[はこ]の上[うえ]にある二[ふた]つのケルビムの間[あいだ]から、あなたに語[かた]る。イスラエルの子[こ]らについて、わたしがあなたに命[めい]じるすべてのことを語[かた]るのである。」"
  23: "「また、純金[じゅんきん]の机[つくえ]を造[つく]らなければならない。長[なが]さは二[に]キュビト、幅[はば]は一[いっ]キュビト、高[たか]さは一[いっ]キュビト半[はん]である。"
  24: "その周[まわ]りに金[きん]の撚[よ]り飾[かざ]りを巡[めぐ]らし、さらにその周[まわ]りに手[て]のひら幅[はば]の縁[ふち]を付[つ]ける。"
  25: "その縁[ふち]の周[まわ]りに金[きん]の撚[よ]り飾[かざ]りを巡[めぐ]らす。"
  26: "また、金[きん]の環[かん]を四[よっ]つ造[つく]り、机[つくえ]の四[よっ]つの脚[あし]の部分[ぶぶん]にその環[かん]を付[つ]ける。"
  27: "すなわち、縁[ふち]の下[した]に付[つ]ける。その環[かん]は担[にな]い棒[ぼう]を差[さ]し込[こ]む所[ところ]となり、それによって机[つくえ]を運[はこ]ぶ。"
  28: "アカシアの木[ざい]で担[にな]い棒[ぼう]を造[つく]り、純金[じゅんきん]で覆[おお]う。机[つくえ]はそれによって運[はこ]ばれる。"
  29: "また、その皿[さら]、香[こう]の器[うつわ]、注[そそ]ぎの器[うつわ]、杯[さかずき]を造[つく]る。それらで注[そそ]ぎの献[ささ]げ物[もの]をするのである。それらを純金[じゅんきん]で造[つく]らなければならない。"
  30: "また、供[そな]えのパンをいつもわたしの前[まえ]に、机[つくえ]の上[うえ]に置[お]かなければならない。」"
  31: "「また、純金[じゅんきん]で燭台[しょくだい]を造[つく]らなければならない。燭台[しょくだい]は打[う]ち出[だ]し細工[ざいく]で造[つく]る。その茎[くき]と枝[えだ]、杯[さかずき]、玉[たま]、花[はな]は、すべて燭台[しょくだい]から一体[いったい]に出[で]るものでなければならない。"
  32: "六[むっ]つの枝[えだ]をその側面[そくめん]から出[だ]す。すなわち、燭台[しょくだい]の一方[いっぽう]の側[がわ]から三[みっ]つの枝[えだ]、他方[たほう]の側[がわ]から三[みっ]つの枝[えだ]を出[だ]す。"
  33: "一[ひと]つの枝[えだ]に、くるみの実[み]の形[かたち]をした三[みっ]つの杯[さかずき]と、玉[たま]と花[はな]を付[つ]ける。燭台[しょくだい]から出[で]る六[むっ]つの枝[えだ]も、すべて同[おな]じである。"
  34: "また、燭台[しょくだい]そのものには、くるみの実[み]の形[かたち]をした四[よっ]つの杯[さかずき]と、玉[たま]と花[はな]を付[つ]ける。"
  35: "燭台[しょくだい]から出[で]る六[むっ]つの枝[えだ]のために、二[ふた]つの枝[えだ]の下[した]に一[ひと]つの玉[たま]、四[よっ]つの枝[えだ]の下[した]に一[ひと]つの玉[たま]を付[つ]ける。"
  36: "玉[たま]も枝[えだ]も燭台[しょくだい]から一体[いったい]に出[で]るものでなければならない。その全体[ぜんたい]は一[ひと]つの純金[じゅんきん]から打[う]ち出[だ]して造[つく]る。"
  37: "また、その灯[ともしび]を七[なな]つ造[つく]り、その灯[ともしび]を上[うえ]に据[す]えて、正面[しょうめん]を照[て]らすようにする。"
  38: "また、その芯切[しんき]りばさみと受[う]け皿[ざら]を純金[じゅんきん]で造[つく]らなければならない。"
  39: "これらのすべての器[うつわ]には、一[いっ]タラントの純金[じゅんきん]を用[もち]いる。"
  40: "気[き]をつけて、山[やま]であなたに示[しめ]された型[かた]のとおりに作[つく]りなさい。」"

notes:
  1: "λέγων — «говоря»: обычная греческая формула введения речи, по-японски не переводится."
  2: "ἀπαρχάς — 献げ物 (ἀπαρχή — «начаток»; здесь добровольный дар). οἷς ἂν δόξῃ τῇ καρδίᾳ — 心から進んで (букв. «кому угодно будет в сердце»)."
  3: "ἡ ἀπαρχή — 献げ物. χαλκόν — 青銅 (медь)."
  4: "ὑάκινθος — 青の糸 (сине-фиолетовый цвет). πορφύρα — 紫. κόκκινον διπλοῦν — 二重に撚った緋 (двойная багряница). βύσσος κεκλωσμένη — 撚った亜麻布 (κλώθω — «прясть»). τρίχες αἴγειαι — 山羊の毛."
  5: "δέρματα κριῶν ἠρυθροδανωμένα — 赤く染めた雄羊の皮 (ῥυθροδανόω — «красить в красное»). δέρματα ὑακίνθινα — 青い皮 (у LXX — синие кожи; в евр. «тахаш», отсюда じゅごん в Синодальном). ξύλα ἄσηπτα — アカシアの木 (букв. «негниющие дерева»)."
  6: "В gr-lxx-byz стих пуст («.»), поэтому весь стих — церковное чтение (csl-ru) и стоит в 〔…〕: масло для светильника, миро и благовония. Проверено: 25:6 «ελαιον» — НЕТ."
  7: "λίθους σαρδίου — サルディオス石 (сердолик). ἐπωμίς — エフォド (наплечник первосвященника; так же в гл. 28). ποδήρης — 長衣. εἰς τὴν γλύφην — 嵌め込むための (γλυφή — «резьба»)."
  8: "ἁγίασμα — 聖所 (святилище). ὀφθήσομαι ἐν ὑμῖν — あなたがたの間に現れる."
  9: "τὸ παράδειγμα — 型 (образец). σκηνή — 幕屋. οὕτω ποιήσεις — そのとおりに作りなさい."
  10: "κιβωτὸς μαρτυρίου — 契約の箱 (μαρτύριον — «свидетельство»; слав. «кивот свидения»). πῆχυς — キュビト."
  11: "καταχρυσώσεις — 金で覆う (χρυσόω). κυμάτια στρεπτά — 金の撚り飾り (витой ободок)."
  12: "δακτυλίους — 環 (кольца). κλίτη — 側面 (боковые стороны)."
  13: "ἀναφορεῖς — 担い棒 (шесты для ношения)."
  14: "εἰσάξεις … εἰς τοὺς δακτυλίους — 環に通す. αἴρειν — 運ぶ (букв. «поднимать»)."
  15: "ἀκίνητοι — 抜いてはならない (букв. «неподвижны»)."
  16: "τὰ μαρτύρια — 証の板 (скрижали откровения)."
  17: "ἱλαστήριον ἐπίθεμα — 贖いの座 (ἱλαστήριον — «место умилостивления»; ἐπίθεμα — «покрытие»). Херувимы над ним — место, откуда Бог говорит (ст. 22)."
  18: "χερουβιμ — ケルビム. τορευτά — 打ち出し細工 (чеканные). ἀμφοτέρων τῶν κλιτῶν — 両端."
  19: "ποιηθήσονται — 造る (по форме passivum, по смыслу императив)."
  20: "συσκιάζοντες — 覆う (συσκιάζω — «осенять»). εἰς ἄλληλα — 互いに向かい合う. εἰς τὸ ἱλαστήριον — 贖いの座の方へ."
  21: "ἐπιθήσεις — 載せる. εἰς τὴν κιβωτόν — 箱の中へ."
  22: "γνωσθήσομαί σοι — ご自身を知らせる (passivum; букв. «буду познан тобой»). ἀνὰ μέσον τῶν δύο χερουβιμ — 二つのケルビムの間. ἐντειλῶμαι — 命じる."
  23: "τράπεζαν χρυσίου καθαροῦ — 純金の机 (у LXX стол из чистого золота; слав. «от древ негниющих», т. е. деревянный, обложенный золотом). εὖρος — 幅."
  24: "στρεπτὰ κυμάτια — 撚り飾り. στεφάνη παλαιστοῦ — 手のひら幅の縁 (παλαιστή — «ладонь»)."
  25: "στρεπτὸν κυμάτιον τῇ στεφάνῃ — 縁の周りの撚り飾り."
  26: "μέρη τῶν ποδῶν — 脚の部分."
  27: "θήκας τοῖς ἀναφορεῦσιν — 担い棒を差し込む所 (θήκη — «вместилище»)."
  28: "ἀρθήσεται — 運ばれる (αἴρω)."
  29: "τρυβλία — 皿. θυίσκαι — 香の器. σπονδεῖα — 注ぎの器. κυάθους — 杯. ἐν οἷς σπείσεις — それらで注ぎの献げ物をする."
  30: "ἄρτοι ἐνωπίοι — 供えのパン (букв. «хлебы пред лицем»; слав. «хлебы предложения»). διὰ παντός — いつも."
  31: "λυχνία — 燭台. τορευτή — 打ち出し細工. καυλός — 茎. καλαμίσκοι — 枝. κρατῆρες — 杯. σφαιρωτῆρες — 玉 (шары). κρίνα — 花 (лилии)."
  32: "ἓξ καλαμίσκοι — 六つの枝, по три с каждой стороны."
  33: "καρυίσκους — くるみの実の形 (καρύισκος — «орешек»)."
  34: "ἐν τῇ λυχνίᾳ — 燭台そのものに (не на ветвях)."
  35: "σφαιρωτήρ — 玉 (шар под ветвями)."
  36: "ἐξ ἑνὸς χρυσίου καθαροῦ — 一つの純金から (цельный)."
  37: "λύχνους — 灯 (лампады). ἐκ τοῦ ἑνὸς προσώπου — 正面を (букв. «с одной стороны лица»)."
  38: "ἐπαρυστήρ — 芯切りばさみ (щипцы). ὑποθέματα — 受け皿."
  39: "τάλαντον — タラント (мера веса, ок. 30 кг)."
  40: "τύπος — 型 (образец). δεδειγμένον — 示された."
