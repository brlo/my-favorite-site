# jp-box, Исход, глава 25. Черновик для приёмки.
#
# База: текст Церкви — Септуагинта (gr-lxx-byz); контроль — csl-ru, ru (с масоретского —
# только для понимания); jp-joc в этой главе нет. Язык — современный 常体.
# Глава 25: добровольные дары на святилище (1–9), ковчег завета (10–16),
# очистилище и херувимы (17–22), стол и хлебы предложения (23–30), светильник (31–40).
# Красного и синего нет: говорит Бог, но это не прямая речь Христа во плоти; «<j>» не ставится.
# Прямая речь — в 「…」 (2–9, 10–22, 23–30, 31–40); вложенной речи нет.
# 〔…〕: 25:6 — в gr-lxx-byz стих пуст («.»), весь стих взят из церковного чтения (csl-ru).
# Проверка: BOOK=ish CH=25 ruby tmp/bracket_check.rb "25:6:ελαιον" → НЕТ (в gr стиха нет).
# Сноски ⟨…⟩: 25:5 アカシアの木, 25:7 エフォド, 25:17 贖いの座 — первые упоминания в корпусе.
# Отличия от славянского: 25:23 у LXX стол «из чистого золота», у слав. — из негниющих дерев,
# обложенных золотом; 25:5 «синие кожи» (ὑακίνθινα), а не евр. «тахаш» (Синодальный: じゅごん).
