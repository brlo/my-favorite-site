# jp-box, 4-я Царств, глава 10. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 10: письма Иеху к старейшинам Самарии и истребление семидесяти сыновей
# Ахава (1–11), встреча с Ионадавом и убийство братьев Охозии (12–17), собрание
# служителей Ваала и их истребление (18–28), оценка царствования Иеху (29–36).
# Нумерация по gr: 36 стихов, совпадает с csl/ru.
# Речь — 「…」 (1–3, 5–6, 8–10, 13, 15–16, 18–21, 23–25, 30). Красного нет.
# 〔…〕 нет: на месте каждого стиха в gr-lxx-byz есть текст.
# Сносок ⟨…⟩ нет: バアル, 神殿, 預言者, 祭壇, 燔祭, 王座 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 4ts
chapter: 10
draft: true

verses:
  1: "アハブにはサマリアに七十人[ななじゅうにん]の息子[むすこ]がいた。イエフは手紙[てがみ]を書[か]き、サマリアの支配者[しはいしゃ]たち、長老[ちょうろう]たち、アハブの息子[むすこ]たちの養育係[よういくがかり]たちに送[おく]って、こう言[い]った。"
  2: "「今[いま]、この手紙[てがみ]があなたがたのところに届[とど]いたなら、あなたがたの主[しゅ]の息子[むすこ]たちがあなたがたとともにいて、戦車[せんしゃ]と馬[うま]、堅固[けんご]な町々[まちまち]、武器[ぶき]もあなたがたとともにあるのだから、"
  3: "あなたがたの主[しゅ]の息子[むすこ]たちのうちで良[よ]い者[もの]、正[ただ]しい者[もの]を見[み]て、その父[ちち]の王座[おうざ]に立[た]て、あなたがたの主[しゅ]の家[いえ]のために戦[たたか]いなさい。」"
  4: "彼[かれ]らは非常[ひじょう]に恐[おそ]れて言[い]った。「見[み]よ、二人[ふたり]の王[おう]でさえ彼[かれ]の前[まえ]に立[た]ち向[む]かえなかった。わたしたちがどうして立[た]ち向[む]かえられようか。」"
  5: "家[いえ]を司[つかさど]る者[もの]たち、町[まち]を司[つかさど]る者[もの]たち、長老[ちょうろう]たち、養育係[よういくがかり]たちは、イエフのもとへ人[ひと]を遣[つか]わして言[い]った。「わたしたちはあなたのしもべだ。あなたがわたしたちに言[い]うことは何[なん]でも行[おこな]う。わたしたちはだれも王[おう]に立[た]てない。あなたの目[め]に良[よ]いことを行[おこな]う。」"
  6: "イエフは彼[かれ]らに二通目[につうめ]の手紙[てがみ]を書[か]いて言[い]った。「もしあなたがたがわたしのもので、わたしの声[こえ]に聞[き]き従[したが]うなら、あなたがたの主[しゅ]の息子[むすこ]たちの首[くび]を取[と]って、明日[あした]のこの時間[じかん]にイズレエルへわたしのところへ持[も]って来[き]なさい。」王[おう]の息子[むすこ]たちは七十人[ななじゅうにん]で、町[まち]の有力者[ゆうりょくしゃ]たちが彼[かれ]らを養育[よういく]していた。"
  7: "手紙[てがみ]が彼[かれ]らのもとに届[とど]くと、彼[かれ]らは王[おう]の息子[むすこ]たちを捕[と]らえ、七十人[ななじゅうにん]を屠[ほふ]って、その首[くび]を籠[かご]に入[い]れ、イズレエルにいる彼[かれ]のもとへ送[おく]った。"
  8: "使者[ししゃ]が来[き]て告[つ]げた。「王[おう]の息子[むすこ]たちの首[くび]を持[も]って来[き]た。」彼[かれ]は言[い]った。「朝[あさ]まで、門[もん]の入口[いりぐち]のそばに二[ふた]つの山[やま]として積[つ]んでおけ。」"
  9: "朝[あさ]になると、彼[かれ]は出[で]て来[き]て町[まち]の門[もん]のところに立[た]ち、民[たみ]すべてに言[い]った。「あなたがたは正[ただ]しい。見[み]よ、わたしがわたしの主[しゅ]に逆[さか]らって彼[かれ]を殺[ころ]したのだ。だが、この者[もの]たちすべてを打[う]ち殺[ころ]したのはだれか。"
  10: "知[し]るがよい。主[しゅ]がアハブの家[いえ]について語[かた]られた言葉[ことば]は、一[ひと]つも地[ち]に落[お]ちることはない。主[しゅ]は、そのしもべエリヤによって語[かた]られたことをすべて成[な]し遂[と]げられた。」"
  11: "イエフは、イズレエルにいたアハブの家[いえ]の残[のこ]りの者[もの]をすべて討[う]ち、その有力者[ゆうりょくしゃ]たち、知人[ちじん]たち、祭司[さいし]たちを打[う]ち殺[ころ]して、彼[かれ]の残[のこ]りを一人[ひとり]も残[のこ]さなかった。"
  12: "そして彼[かれ]は立[た]ち上[あ]がってサマリアへ向[む]かった。その途中[とちゅう]、羊飼[ひつじか]いのベト・エケドの道[みち]にいたとき、"
  13: "イエフはユダの王[おう]アハズヤの兄弟[きょうだい]たちを見[み]つけて言[い]った。「あなたがたはだれか。」彼[かれ]らは言[い]った。「わたしたちはアハズヤの兄弟[きょうだい]で、王[おう]の息子[むすこ]たちと女王[じょおう]の息子[むすこ]たちの安否[あんぴ]を尋[たず]ねに下[くだ]って来[き]たのだ。」"
  14: "彼[かれ]は言[い]った。「生[い]けどりにせよ。」彼[かれ]らはその者[もの]たちを生[い]けどりにし、ベト・エケドで四十二人[よんじゅうににん]を屠[ほふ]った。彼[かれ]らの中[なか]から一人[ひとり]も残[のこ]さなかった。"
  15: "彼[かれ]はそこから進[すす]んで、途中[とちゅう]でリハブの子[こ]ヨナダブが自分[じぶん]を迎[むか]えに来[き]るのに会[あ]い、彼[かれ]を祝福[しゅくふく]した。イエフは彼[かれ]に言[い]った。「あなたの心[こころ]は、わたしの心[こころ]とともに正[ただ]しいか。わたしの心[こころ]があなたの心[こころ]とともに正[ただ]しいように。」ヨナダブは言[い]った。「正[ただ]しい。」イエフは言[い]った。「それなら、あなたの手[て]を貸[か]しなさい。」彼[かれ]が手[て]を差[さ]し出[だ]すと、イエフは彼[かれ]を自分[じぶん]の戦車[せんしゃ]に乗[の]せた。"
  16: "そして言[い]った。「わたしと一緒[いっしょ]に来[き]て、わたしが万軍[ばんぐん]の主[しゅ]のために熱心[ねっしん]に働[はたら]くのを見[み]よ。」こうして彼[かれ]を自分[じぶん]の戦車[せんしゃ]に座[すわ]らせた。"
  17: "彼[かれ]はサマリアに入[はい]り、アハブに属[ぞく]する残[のこ]りの者[もの]をすべてサマリアで打[う]ち殺[ころ]し、ついに彼[かれ]を滅[ほろ]ぼし尽[つ]くした。主[しゅ]がエリヤに語[かた]られた言葉[ことば]のとおりであった。"
  18: "イエフは民[たみ]をすべて集[あつ]めて言[い]った。「アハブはバアルに少[すこ]し仕[つか]えたが、イエフはもっと多[おお]く仕[つか]える。"
  19: "今[いま]、バアルの預言者[よげんしゃ]すべて、そのしもべすべて、その祭司[さいし]すべてをわたしのところに呼[よ]びなさい。一人[ひとり]も欠[か]けてはならない。わたしはバアルに大[おお]きな犠牲[ぎせい]を献[ささ]げるからだ。欠[か]けた者[もの]は生[い]きてはいられない。」イエフはバアルのしもべたちを滅[ほろ]ぼすために、これを策略[さくりゃく]として行[おこな]った。"
  20: "イエフは言[い]った。「バアルのために聖[せい]なる集会[しゅうかい]を定[さだ]めよ。」そこで彼[かれ]らはそれを布告[ふこく]した。"
  21: "イエフはイスラエル全土[ぜんど]に人[ひと]を遣[つか]わして言[い]った。「バアルのしもべすべて、その祭司[さいし]すべて、その預言者[よげんしゃ]すべてよ、だれも欠[か]けてはならない。わたしは大[おお]きな犠牲[ぎせい]を献[ささ]げるからだ。欠[か]けた者[もの]は生[い]きてはいられない。」バアルのしもべも祭司[さいし]も預言者[よげんしゃ]もすべて来[き]た。来[こ]なかった者[もの]は一人[ひとり]もいなかった。彼[かれ]らはバアルの神殿[しんでん]に入[はい]り、バアルの神殿[しんでん]は端[はし]から端[はし]まで満[み]ちた。"
  22: "イエフは衣装[いしょう]を管理[かんり]する者[もの]に言[い]った。「バアルのしもべすべてに衣[ころも]を出[だ]せ。」そこで衣装係[いしょうがかり]が彼[かれ]らに衣[ころも]を出[だ]した。"
  23: "イエフとリハブの子[こ]ヨナダブはバアルの神殿[しんでん]に入[はい]り、バアルのしもべたちに言[い]った。「調[しら]べて見[み]よ。あなたがたのうちに主[しゅ]のしもべがいるかどうかを。ここにはバアルのしもべだけがいるはずだ。」"
  24: "彼[かれ]は犠牲[ぎせい]と燔祭[はんさい]を献[ささ]げるために入[はい]った。イエフは外[そと]に八十人[はちじゅうにん]の者[もの]を配置[はいち]して言[い]った。「わたしがあなたがたの手[て]に渡[わた]す者[もの]のうち、だれか一人[ひとり]でも逃[に]がしたなら、その者[もの]の命[いのち]は、逃[に]がした者[もの]の命[いのち]をもって償[つぐな]われる。」"
  25: "燔祭[はんさい]を献[ささ]げ終[お]えると、イエフは近衛[このえ]の者[もの]たちと隊長[たいちょう]たちに言[い]った。「中[なか]に入[はい]って彼[かれ]らを打[う]ち殺[ころ]せ。だれも逃[に]げ出[だ]させてはならない。」彼[かれ]らは剣[つるぎ]の刃[は]で彼[かれ]らを打[う]ち殺[ころ]し、近衛[このえ]の者[もの]たちと隊長[たいちょう]たちは彼[かれ]らを投[な]げ捨[す]てて、バアルの神殿[しんでん]の町[まち]まで行[い]った。"
  26: "彼[かれ]らはバアルの柱像[ちゅうぞう]を運[はこ]び出[だ]して焼[や]いた。"
  27: "彼[かれ]らはバアルの柱像[ちゅうぞう]を打[う]ち壊[こわ]し、バアルの神殿[しんでん]を取[と]り壊[こわ]して、今日[こんにち]まで汚物[おぶつ]を捨[す]てる場所[ばしょ]とした。"
  28: "こうしてイエフはバアルをイスラエルから滅[ほろ]ぼした。"
  29: "ただ、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させた罪[つみ]からは、イエフは離[はな]れなかった。すなわち、ベテルとダンにある金[きん]の子牛[こうし]である。"
  30: "主[しゅ]はイエフに言[い]われた。「わたしの目[め]に正[ただ]しいことを行[おこな]い、わたしの心[こころ]にあるすべてをアハブの家[いえ]に対[たい]して行[おこな]ったことで、あなたの子[こ]たちは四代[よんだい]にわたってイスラエルの王座[おうざ]に座[すわ]る。」"
  31: "しかしイエフは、イスラエルの神[かみ]である主[しゅ]の律法[りっぽう]に心[こころ]を尽[つ]くして歩[あゆ]もうとはしなかった。彼[かれ]は、ネバトの子[こ]ヤロブアムがイスラエルに犯[おか]させた罪[つみ]から離[はな]れなかった。"
  32: "その日[ひ]ごろ、主[しゅ]はイスラエルを切[き]り減[へ]らし始[はじ]め、ハザエルがイスラエルの全[ぜん]領域[りょういき]で彼[かれ]らを打[う]った。"
  33: "すなわち、ヨルダンから日[ひ]の出[で]る方[ほう]へ、ガド人[じん]、ルベン人[じん]、マナセ人[じん]のギレアデの地[ち]すべて、アルノンの谷川[たにがわ]の岸[きし]にあるアロエルから、ギレアデとバシャンまでである。"
  34: "イエフの残[のこ]りの事[こと]ども、彼[かれ]が行[おこな]ったすべてのこと、その力[ちから]のすべて、また彼[かれ]が結[むす]んだ協定[きょうてい]は、イスラエルの王[おう]たちの日誌[にっし]の書[しょ]に記[しる]されているではないか。"
  35: "イエフは先祖[せんぞ]たちとともに眠[ねむ]り、サマリアに葬[ほうむ]られた。その子[こ]ヨアハズが彼[かれ]に代[か]わって王[おう]となった。"
  36: "イエフがサマリアでイスラエルを治[おさ]めた期間[きかん]は、二十八年[にじゅうはちねん]であった。"

notes:
  1: "τῷ Αχααβ ἑβδομήκοντα υἱοὶ ἐν Σαμαρείᾳ — «у Ахава семьдесят сыновей в Самарии» (датив принадлежности). βιβλίον — письмо, грамота (в слав. «писание»). ἄρχοντας Σαμαρείας — начальники Самарии (в ru «Изреельские» — по МТ). πρεσβυτέρους — старейшины. τιθηνούς — воспитатели, кормильцы (τιθηνός; слав. «кормители»). λέγων — «говоря»."
  2: "μεθ᾿ ὑμῶν οἱ υἱοὶ τοῦ κυρίου ὑμῶν — «с вами сыны господина вашего». ἅρμα — колесница (戦車), ἵπποι — кони. πόλεις ὀχυραί — укреплённые города. ὅπλα — оружие. Стих не закончен: мысль продолжается в ст. 3."
  3: "ὄψεσθε — «увидите» (ὁράω). ἀγαθὸν καὶ εὐθῆ — доброго и правого, т. е. лучшего и достойного. καταστήσετε — «поставите» (καθίστημι). θρόνος τοῦ πατρός — престол отца. πολεμεῖτε — «воюйте» (императив)."
  4: "ἐφοβήθησαν σφόδρα — устрашились весьма. οὐκ ἔστησαν κατὰ πρόσωπον αὐτοῦ — «не устояли пред лицом его» (ἵστημι κατά с род.). «Два царя» — Иорам Израильский и Охозия Иудейский, убитые Иеху (9:24, 27)."
  5: "οἱ ἐπὶ τοῦ οἴκου — «те, кто над домом», управители дворца; οἱ ἐπὶ τῆς πόλεως — градоначальники. Παῖδές σου ἡμεῖς — «мы рабы твои» (παῖς — слуга). οὐ βασιλεύσομεν ἄνδρα — «не воцарим человека», т. е. никого не поставим царём (слав. «не воцарим мужа»). τὸ ἀγαθὸν ἐν ὀφθαλμοῖς σου — «доброе в очах твоих»."
  6: "βιβλίον δεύτερον — второе письмо. εἰ ἐμοὶ ὑμεῖς — «если вы мои». τῆς φωνῆς μου εἰσακούετε — «слушаете голоса моего» (εἰσακούω с род.). κεφαλὴν ἀνδρῶν τῶν υἱῶν — «голову мужей, сынов» (плеоназм). ὡς ἡ ὥρα αὔριον — «завтра в это время». ἁδροί — тучные, знатные, влиятельные (ἁδρός); слав. «началницы града». ἐξέτρεφον — имперфект «вскармливали»."
  7: "ἔσφαξαν — закололи (σφάζω). καρτάλλοις — корзины (κάρταλλος; слав. «кошницы»), слово редкое. ἔθηκαν — положили."
  8: "βουνοὺς δύο — «два холма», т. е. две груды (слав. «в два холма»). παρὰ τὴν θύραν τῆς πύλης — у двери ворот. εἰς πρωί — до утра. ὁ ἄγγελος — здесь «посланный, вестник»."
  9: "Δίκαιοι ὑμεῖς — «вы праведны», т. е. невиновны (слав. «праведни вы»). συνεστράφην ἐπὶ τὸν κύριόν μου — «я составил заговор против господина моего» (συστρέφω; слав. «обратихся на»). ἀπέκτεινα — убил. ἐπάταξεν — «поразил» (πατάσσω). Речь продолжается в ст. 10."
  10: "αφφω — передача евр. אַף («также, и вот»); в слав. «убо». οὐ πεσεῖται εἰς τὴν γῆν — «не падёт на землю», т. е. ни одно слово не останется неисполненным. ῥῆμα — слово. ἐν χειρὶ δούλου αὐτοῦ Ηλιου — «рукою раба Своего Илии»."
  11: "καταλειφθέντας — оставшихся (καταλείπω). ἁδρούς — знатных, влиятельных. γνωστούς — знакомых, приближённых (слав. «знаемыя»). ἱερεῖς αὐτοῦ — жрецы Ахава, не Господни. κατάλειμμα — остаток."
  12: "Βαιθακαδ τῶν ποιμένων — Беф-Екед пастушеский (בית עקד, «дом привязи»); слав. «вефакад пастырский». В гр нет глагола: «он [был] в Беф-Екеде… на дороге», отсюда «находясь в пути». Стих оканчивается запятой — продолжение в ст. 13."
  13: "εἰς εἰρήνην — «к миру», т. е. приветствовать, справиться о благополучии (слав. «поздравити»). τῆς δυναστευούσης — «властвующей», царицы-матери (Гофолия); отсюда 女王. κατέβημεν — «сошли»: из Иерусалима вниз."
  14: "Συλλάβετε ζῶντας — «захватите живыми» (συλλαμβάνω). τεσσαράκοντα καὶ δύο — сорок два. οὐ κατέλιπεν ἄνδρα ἐξ αὐτῶν — «не оставил из них ни одного»."
  15: "εἰς ἀπάντησιν αὐτοῦ — «навстречу ему». εὐλόγησεν — благословил (слав. «благослови»). καρδία εὐθεῖα — «сердце правое»: формула верности (ср. 1Пар 12:17). ἀνεβίβασεν — «возвёл, посадил» (ἀναβιβάζω). Стих не закончен: продолжение в ст. 16."
  16: "Δεῦρο μετ᾿ ἐμοῦ — «иди со мной». ζηλῶσαί με — «когда я ревную» (ζηλόω), т. е. являю ревность о Господе. Σαβαωθ — Саваоф (万軍の主). ἐπεκάθισεν — «посадил» (ἐπικαθίζω); в ru «посадили» (мн. ч.), в гр ед. ч."
  17: "ἕως τοῦ ἀφανίσαι — «доколе не истребил» (ἀφανίζω). κατὰ τὸ ῥῆμα κυρίου — «по слову Господа» (исполнение 3Цар 21:21–24). πρὸς Ηλιου — «к Илии»."
  18: "συνήθροισεν — собрал (συναθροίζω). ἐδούλευσεν — «послужил» (δουλεύω). ὀλίγα… πολλά — «мало… много» (слав. «поработа мало… поработает ему много»). Слова Иеху — ирония, раскрытая в ст. 19."
  19: "ἐπισκεπήτω / ἐπισκεπῇ — «пусть не будет в отсутствии / кто окажется в отсутствии» (ἐπισκέπτομαι здесь «быть найденным, явиться»); слав. «да не потаится». θυσία μεγάλη — великая жертва. πτερνισμός — «хитрость, лукавство» (букв. «запинание»); слав. «лестию»."
  20: "Ἁγιάσατε ἱερείαν — «освятите священнодействие» (ἱερεία — священное служение, жертва; слав. «жертву… и служение»). ἐκήρυξαν — «провозгласили» (κηρύσσω)."
  21: "μηδεὶς ἀπολειπέσθω — «никто пусть не отсутствует» (ἀπολείπω). οὐ κατελείφθη ἀνήρ — «не осталось человека». παρεγένετο — «прибыл, явился». στόμα εἰς στόμα — букв. «уста в уста», т. е. от края до края (слав. «от края да края»)."
  22: "τῷ ἐπὶ τοῦ οἴκου μεσθααλ — «тому, кто над домом одежд»; μεσθααλ — передача евр. מֶלְתָּחָה («гардероб»), слово оставлено как непонятное; слав. «сущим над домом одежд». ἐνδύματα — одежды. στολιστής — хранитель одежд (στολίζω — одевать); слав. «ризохранитель»."
  23: "Ἐρευνήσατε — «исследуйте» (ἐρευνάω). ἀλλ᾿ ἢ … μονώτατοι — «но только одни» (ἀλλά с ἤ в значении «кроме»; μονώτατοι — превосходная степень). В слав. добавлено «и вышлите всех рабов Господних обретшихся тамо» — в гр этого нет."
  24: "θύματα — жертвы (θῦμα), ὁλοκαυτώματα — всесожжения. ἔταξεν ἑαυτῷ ἔξω — «поставил себе вне» (τάσσω). διασωθῇ — «уцелеет» (διασώζω). ἡ ψυχὴ αὐτοῦ ἀντὶ τῆς ψυχῆς αὐτοῦ — «душа его вместо души его»: жизнь стража за жизнь упущенного (слав. так же; место тёмное)."
  25: "συνετέλεσεν — «закончил» (συντελέω). παρατρέχοντες — «бегущие впереди», скороходы, телохранители (слав. «предтекущии»). τριστάται — «третьи», офицеры при колеснице (τριστάτης; слав. «тристаты»). ἐν στόματι ῥομφαίας — «устами меча», т. е. остриём. ἕως πόλεως οἴκου τοῦ Βααλ — «до города дома Ваалова», т. е. до укрепления капища."
  26: "στήλη — столп, статуя (柱像); в слав. «кумир». ἐνέπρησαν — сожгли (ἐμπίπρημι). В гр ед. ч.; в ru «статуи» мн. ч."
  27: "κατέσπασαν — «разрушили, разбили» (κατασπάω). καθεῖλον — «низвергли» (καθαιρέω). λυτρῶνας — «отхожие места» (λυτρών; слав. «афедрон» — заимствование): развалины капища стали местом нечистот. ἕως τῆς ἡμέρας ταύτης — «до сего дня»."
  28: "ἠφάνισεν — истребил (ἀφανίζω). В слав. добавлено «храм», в гр просто «Ваала»; стих заканчивается двоеточием — противопоставление в ст. 29."
  29: "πλήν — «впрочем, только». ἐξήμαρτεν — «ввёл в грех» (каузативное значение). οὐκ ἀπέστη ἀπὸ ὄπισθεν αὐτῶν — «не отступил от них», т. е. не перестал следовать. δαμάλεις χρυσαῖ — золотые телицы (δάμαλις); слав. «юницы златыя». Βαιθηλ — Вефиль (ベテル), Δαν — Дан."
  30: "Ἀνθ᾿ ὧν — «за то, что». ἠγάθυνας ποιῆσαι — «ты благоизволил сделать», т. е. охотно сделал (ἀγαθύνω). υἱοὶ τέταρτοι — «сыны четвёртые», т. е. до четвёртого рода (слав. «до четвертаго рода»). καθήσονται — «сядут»."
  31: "ἐφύλαξεν πορεύεσθαι — «не соблюдал ходить», т. е. не старался ходить. ἐν ὅλῃ καρδίᾳ — «всем сердцем». οὐκ ἀπέστη ἐπάνωθεν — «не отступил от» (ἐπάνωθεν — «свыше, от»)."
  32: "συγκόπτειν — «отсекать, уменьшать» (συγκόπτω); слав. «посецати». ὁρίῳ — «предел, область». Азаил — ハザエル (3Цар 19:15)."
  33: "κατ᾿ ἀνατολὰς ἡλίου — «на восток солнца». Γαλααδ τοῦ Γαδδι καὶ τοῦ Ρουβην καὶ τοῦ Μανασση — «Галаад Гада, Рувима и Манассии» (Γαδδι — Gad). χεῖλος χειμάρρου Αρνων — «берег потока Арнон» (χείμαρρος — поток, 谷川). Βασαν — Васан (バシャン)."
  34: "συνάψεις ἃς συνῆψεν — «связи, которые он связал», т. е. союзы, договоры (σύναψις; слав. «совещания»). δυναστεία — могущество, сила. βιβλίον λόγων τῶν ἡμερῶν — летопись (日誌の書)."
  35: "ἐκοιμήθη — «почил» (формула смерти). ἔθαψαν — «погребли». Ιωαχας — Иоахаз (ヨアハズ). ἀντ αὐτοῦ — «вместо него»."
  36: "αἱ ἡμέραι ἃς ἐβασίλευσεν — «дни, которые он царствовал». εἴκοσι ὀκτὼ ἔτη — двадцать восемь лет. ἐν Σαμαρείᾳ — в Самарии."
