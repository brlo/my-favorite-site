verses:
  1: "二年[にねん]の日[ひ]が過[す]ぎた後[あと]、ファラオは夢[ゆめ]を見[み]た。彼[かれ]は川[かわ]のほとりに立[た]っていると思[おも]った。"
  2: "すると、川[かわ]から、姿[すがた]が美[うつく]しく、肉[にく]づきの良[よ]い七頭[ななとう]の雌牛[めうし]が上[のぼ]って来[き]て、葦[あし]の茂[しげ]みの中[なか]で草[くさ]を食[た]べていた。"
  3: "すると、そのすぐ後[あと]から、別[べつ]の七頭[ななとう]の雌牛[めうし]が川[かわ]から上[のぼ]って来[き]た。姿[すがた]が醜[みにく]く、肉[にく]づきが痩[や]せ細[ほそ]っていた。そして、川[かわ]の岸[きし]のほとりで、あの雌牛[めうし]たちのそばに寄[よ]って草[くさ]を食[た]べていた。"
  4: "その七頭[ななとう]の醜[みにく]い、痩[や]せ細[ほそ]った雌牛[めうし]が、姿[すがた]が美[うつく]しく、肉[にく]づきの良[よ]い七頭[ななとう]の雌牛[めうし]を食[た]べた。そこでファラオは目[め]を覚[さ]ました。"
  5: "彼[かれ]はまた眠[ねむ]って、第二[だいに]の夢[ゆめ]を見[み]た。すると、一本[いっぽん]の茎[くき]から、良[よ]く実[みの]った七本[ななほん]の穂[ほ]が上[のぼ]って来[き]た。"
  6: "すると、そのすぐ後[あと]から、東風[ひがしかぜ]に焼[や]かれた細[ほそ]い七本[ななほん]の穂[ほ]が生[は]え出[で]た。"
  7: "そして、細[ほそ]い七本[ななほん]の穂[ほ]が、良[よ]く実[みの]った七本[ななほん]の穂[ほ]を飲[の]み込[こ]んだ。そこでファラオは目[め]を覚[さ]ました。すると、それは夢[ゆめ]であった。"
  8: "朝[あさ]になると、彼[かれ]の心[こころ]は乱[みだ]れた。彼[かれ]は人[ひと]を遣[つか]わして、エジプトのすべての夢[ゆめ]解[と]きと、すべての賢[かしこ]い者[もの]たちを呼[よ]び寄[よ]せた。ファラオは彼[かれ]らに夢[ゆめ]を話[はな]したが、それをファラオに告[つ]げる者[もの]はなかった。"
  9: "そのとき、献酌官[けんしゃくかん]がファラオに言[い]った。「今日[きょう]、わたしは自分[じぶん]の罪[つみ]を思[おも]い起[おこ]しています。"
  10: "ファラオは僕[しもべ]たちに怒[いか]り、わたしと調理官[ちょうりかん]を、料理人[りょうりにん]の長[かしら]の家[いえ]の牢[ろう]に入[い]れました。"
  11: "わたしたちは同[おな]じ夜[よる]、夢[ゆめ]を見[み]ました。わたしと彼[かれ]は、それぞれ自分[じぶん]の夢[ゆめ]を見[み]たのです。"
  12: "そこには、料理人[りょうりにん]の長[かしら]の家[いえ]のヘブライ人[じん]の若[わか]い僕[しもべ]が、わたしたちと一緒[いっしょ]にいました。わたしたちが話[はな]すと、彼[かれ]はわたしたちに解[と]き明[あ]かしてくれました。"
  13: "そして、彼[かれ]がわたしたちに解[と]き明[あ]かしたとおりになったのです。わたしは元[もと]の職[しょく]に戻[もど]され、あの者[もの]は吊[つ]るされました。」"
  14: "ファラオは人[ひと]を遣[つか]わしてヨセフを呼[よ]んだ。人々[ひとびと]は彼[かれ]を要塞[ようさい]から連[つ]れ出[だ]し、彼[かれ]の髪[かみ]を剃[そ]り、衣服[いふく]を着替[きが]えさせた。そして、彼[かれ]はファラオのところへ来[き]た。"
  15: "ファラオはヨセフに言[い]った。「わたしは夢[ゆめ]を見[み]たが、それを解[と]き明[あ]かす者[もの]がいない。ところが、あなたは夢[ゆめ]を聞[き]けばそれを解[と]き明[あ]かすと聞[き]いている。」"
  16: "ヨセフはファラオに答[こた]えて言[い]った。「わたしではありません。ファラオの救[すく]いとなる答[こた]えは、神[かみ]によらずには与[あた]えられません。」"
  17: "ファラオはヨセフに言[い]った。「わたしの夢[ゆめ]の中[なか]で、わたしは川[かわ]の岸[きし]に立[た]っていると思[おも]った。"
  18: "すると、川[かわ]から、姿[すがた]が美[うつく]しく、肉[にく]づきの良[よ]い七頭[ななとう]の雌牛[めうし]が上[のぼ]って来[き]て、葦[あし]の茂[しげ]みの中[なか]で草[くさ]を食[た]べていた。"
  19: "すると、そのすぐ後[あと]から、別[べつ]の七頭[ななとう]の雌牛[めうし]が川[かわ]から上[のぼ]って来[き]た。痩[や]せ細[ほそ]って醜[みにく]く、わたしはエジプトの全土[ぜんど]で、あれほど醜[みにく]いものを見[み]たことがない。"
  20: "その痩[や]せ細[ほそ]った七頭[ななとう]の雌牛[めうし]が、先[さき]の、肉[にく]づきの良[よ]い七頭[ななとう]の雌牛[めうし]を食[た]べた。"
  21: "それらは雌牛[めうし]たちの腹[はら]の中[なか]に入[はい]ったが、腹[はら]に入[はい]ったとは分[わ]からないほどで、見[み]た目[め]は初[はじ]めと同[おな]じように醜[みにく]かった。そこで、わたしは目[め]を覚[さ]ました。"
  22: "わたしはまた夢[ゆめ]の中[なか]で見[み]た。すると、一本[いっぽん]の茎[くき]から、実[みの]った良[よ]い七本[ななほん]の穂[ほ]が上[のぼ]って来[き]た。"
  23: "すると、そのすぐ後[あと]から、細[ほそ]く、東風[ひがしかぜ]に焼[や]かれた七本[ななほん]の穂[ほ]が生[は]え出[で]た。"
  24: "そして、細[ほそ]い七本[ななほん]の穂[ほ]が、あの良[よ]い七本[ななほん]の穂[ほ]を飲[の]み込[こ]んだ。わたしはこれを夢[ゆめ]解[と]きたちに話[はな]したが、だれもわたしに告[つ]げる者[もの]がいなかった。」"
  25: "ヨセフはファラオに言[い]った。「ファラオの夢[ゆめ]は一[ひと]つです。神[かみ]がなさろうとしていることを、ファラオにお示[しめ]しになったのです。"
  26: "良[よ]い七頭[ななとう]の雌牛[めうし]は七年[ななねん]です。良[よ]い七本[ななほん]の穂[ほ]も七年[ななねん]です。夢[ゆめ]は一[ひと]つです。"
  27: "そして、その後[あと]から上[のぼ]って来[き]た痩[や]せ細[ほそ]った七頭[ななとう]の雌牛[めうし]は七年[ななねん]です。細[ほそ]くて東風[ひがしかぜ]に焼[や]かれた七本[ななほん]の穂[ほ]も、飢饉[ききん]の七年[ななねん]となります。"
  28: "これが、わたしがファラオに申[もう]し上[あ]げた言葉[ことば]です。神[かみ]がなさろうとしていることを、ファラオにお示[しめ]しになったのです。"
  29: "見[み]よ、エジプトの全土[ぜんど]に大[おお]きな豊作[ほうさく]の七年[ななねん]が来[き]ます。"
  30: "しかし、その後に飢饉[ききん]の七年[ななねん]が来[き]て、エジプトの全土[ぜんど]で豊作[ほうさく]は忘[わす]れられ、飢饉[ききん]がその地[ち]を滅[ほろ]ぼします。"
  31: "その後[あと]に来[く]る飢饉[ききん]があまりにも激[はげ]しいので、その地[ち]の豊作[ほうさく]はもはや知[し]られることもありません。"
  32: "ファラオの夢[ゆめ]が二度[にど]繰[く]り返[かえ]されたのは、このことが神[かみ]によって確[かく]かに定[さだ]められ、神[かみ]がそれを速[すみ]やかに行[おこな]われるというしるしです。"
  33: "ですから今[いま]、ファラオは、思慮[しりょ]深[ぶか]く賢[かしこ]い人[ひと]を選[えら]び、エジプトの地[ち]の上[うえ]に立[た]ててください。"
  34: "そして、ファラオは、そうして地[ち]の上[うえ]に地方[ちほう]の長[おさ]たちを任[にん]じ、豊作[ほうさく]の七年[ななねん]の間[あいだ]、エジプトの地[ち]のすべての産物[さんぶつ]の〔五分[ごぶ]の一[いち]〕を集[あつ]めさせてください。"
  35: "そして、来[く]る良[よ]い七年[ななねん]のすべての食物[しょくもつ]を集[あつ]め、ファラオの手[て]のもとに穀物[こくもつ]をたくわえ、食物[しょくもつ]を町々[まちまち]に蓄[たくわ]えて守[まも]らせてください。"
  36: "そうすれば、その食物[しょくもつ]は、エジプトの地[ち]に来[く]る飢饉[ききん]の七年[ななねん]のための蓄[たくわ]えとなり、その地[ち]は飢饉[ききん]によって滅[ほろ]びないでしょう。」"
  37: "この言葉[ことば]はファラオとその僕[しもべ]たちすべての目[め]にかなった。"
  38: "ファラオは僕[しもべ]たちすべてに言[い]った。「神[かみ]の霊[れい]が宿[やど]っているこのような人[ひと]を、わたしたちは見[み]つけることができるだろうか。」"
  39: "ファラオはヨセフに言[い]った。「神[かみ]があなたにこれらすべてを示[しめ]されたのだから、あなたほど思慮[しりょ]深[ぶか]く賢[かしこ]い者[もの]はいない。"
  40: "あなたはわたしの家[いえ]の上[うえ]に立[た]つ。わたしの民[たみ]はすべてあなたの言葉[ことば]に従[したが]う。ただ、王座[おうざ]においてだけ、わたしがあなたより上[うえ]に立[た]つ。」"
  41: "ファラオはヨセフに言[い]った。「見[み]よ、わたしは今日[きょう]、あなたをエジプトの全土[ぜんど]の上[うえ]に立[た]てる。」"
  42: "ファラオは自分[じぶん]の手[て]から指輪[ゆびわ]を外[はず]してヨセフの手[て]にはめ、亜麻布[あさぬの]の衣[ころも]を着[き]せ、金[きん]の首輪[くびわ]をその首[くび]にかけた。"
  43: "そして、彼[かれ]を自分[じぶん]の第二[だいに]の車[くるま]に乗[の]せ、彼[かれ]の前[まえ]で布告者[ふこくしゃ]に布告[ふこく]させ、彼[かれ]をエジプトの全土[ぜんど]の上[うえ]に立[た]てた。"
  44: "ファラオはヨセフに言[い]った。「わたしはファラオである。あなたなしには、エジプトの全土[ぜんど]でだれも手[て]を挙[あ]げることはできない。」"
  45: "ファラオはヨセフにプソントムファネフと名[な]をつけ、ヘリオポリスの祭司[さいし]ポティフェラの娘[むすめ]アセンナテを彼[かれ]の妻[つま]として与[あた]えた。"
  46: "ヨセフは、エジプトの王[おう]ファラオの前[まえ]に立[た]ったとき、三十歳[さんじゅっさい]であった。ヨセフはファラオの前[まえ]から出[で]て、エジプトの全土[ぜんど]を行[ゆ]き巡[めぐ]った。"
  47: "その七年[ななねん]の豊作[ほうさく]の間[あいだ]、地[ち]は束[たば]を生[しょう]じた。"
  48: "ヨセフは、エジプトの地[ち]にあったその七年[ななねん]のすべての食物[しょくもつ]を集[あつ]め、食物[しょくもつ]を町々[まちまち]に置[お]いた。町[まち]の周[まわ]りにある畑[はたけ]の食物[しょくもつ]を、その町[まち]の中[なか]に置[お]いたのである。"
  49: "ヨセフは穀物[こくもつ]を海[うみ]の砂[すな]のように非常[ひじょう]に多[おお]く集[あつ]め、数[かぞ]えることができないほどになった。数[かず]がなかったからである。"
  50: "飢饉[ききん]の七年[ななねん]が来[く]る前[まえ]に、ヨセフに二人[ふたり]の息子[むすこ]が生[う]まれた。ヘリオポリスの祭司[さいし]ポティフェラの娘[むすめ]アセンナテが、彼[かれ]に産[う]んだのである。"
  51: "ヨセフは長男[ちょうなん]にマナセと名[な]をつけた。「神[かみ]はわたしのすべての労苦[ろうく]と、父[ちち]の家[いえ]のすべてを忘[わす]れさせてくださった」からである。"
  52: "次男[じなん]にエフライムと名[な]をつけた。「神[かみ]はわたしの苦[くる]しみの地[ち]で、わたしを実[みの]り多[おお]くしてくださった」からである。"
  53: "エジプトの地[ち]にあった豊作[ほうさく]の七年[ななねん]は過[す]ぎ去[さ]った。"
  54: "そして、ヨセフが言[い]ったとおり、飢饉[ききん]の七年[ななねん]が来[き]始[はじ]めた。飢饉[ききん]はすべての地[ち]に及[およ]んだが、エジプトの全土[ぜんど]にはパンがあった。"
  55: "やがて、エジプトの全土[ぜんど]も飢[う]えた。民[たみ]はパンのことでファラオに叫[さけ]んだ。ファラオはエジプト人[じん]すべてに言[い]った。「ヨセフのところへ行[い]き、彼[かれ]があなたがたに言[い]うとおりにしなさい。」"
  56: "飢饉[ききん]は地[ち]の全面[ぜんめん]に及[およ]んでいた。ヨセフはすべての穀物倉[こくもつぐら]を開[あ]けて、エジプト人[じん]すべてに売[う]った。"
  57: "すべての国々[くにぐに]が、ヨセフのもとへ穀物[こくもつ]を買[か]いにエジプトへ来[き]た。飢饉[ききん]が全地[ぜんち]に激[はげ]しかったからである。"

notes:
  1: "μετὰ δύο ἔτη ἡμερῶν — 二年の日が過ぎた後 (букв. «через два года дней»). ᾤετο ἑστάναι — 立っていると思った (οἴομαι — «думать, воображать»; сон). ἐπὶ τοῦ ποταμοῦ — 川のほとりに (Нил без имени, как в LXX)."
  2: "βόες — 雌牛 (в LXX βοῦς «корова/бык»; далее везде 雌牛). ἐκλεκταὶ ταῖς σαρξίν — 肉づきの良い (ἐκλεκτός — «отборный»). ἐν τῷ ἄχει — 葦の茂みの中 (ἄχι — тростник)."
  3: "αἰσχραὶ τῷ εἴδει καὶ λεπταὶ ταῖς σαρξίν — 姿が醜く、肉づきが痩せ細った. ἐνέμοντο — 草を食んでいた (νέμω, med.). παρὰ τὸ χεῖλος τοῦ ποταμοῦ — 川の岸のそば."
  4: "κατέφαγον — 食べた (букв. «сожрали»). ἠγέρθη — 目を覚ました. Слав. добавляет здесь в скобках «и сия невидимы быша, яко внидоша в чресла их» (из евр. 41:21) — не переведено, чтобы не сдвигать смысл в 4-й стих; то же сказано в 21-м по греч."
  5: "ἐνυπνιάσθη τὸ δεύτερον — また眠って第二の夢を見た (букв. «сновидел вторично»). ἐπὶ πυθμένος ἑνός — 一本の茎から (πυθμήν здесь «стебель», в 40:10 — «лоза»). ἐκλεκτοὶ καὶ καλοί — 良く実った七本の穂 (отборные и хорошие)."
  6: "λεπτοὶ καὶ ἀνεμόφθοροι — 東風に焼かれた細い穂 (ἀνεμόφθορος — «повреждённый ветром», слав. «истончени ветром»). ἀνεφύοντο — 生え出た."
  7: "κατέπιον — 飲み込んだ (букв. «выпили, пожрали»). τοὺς πλήρεις — 良く実った (полные). ἦν ἐνύπνιον — それは夢であった."
  8: "ἐταράχθη ἡ ψυχή — 心は乱れた. ἐξηγητάς — 夢解き (толкователи; слав. «сказатели»). οὐκ ἦν ὁ ἀπαγγέλλων — 告げる者はいなかった."
  9: "τὴν ἁμαρτίαν μου ἀναμιμνῄσκω — 自分の罪を思い起す (слав. «грех мой воспоминаю»; речь о вине перед фараоном, 40:1)."
  10: "ὠργίσθη τοῖς παισίν — 僕たちに怒り. τοῦ ἀρχιμαγείρου — 料理人の長 (Потифар, ср. 39:1). ἔθετο ἡμᾶς ἐν φυλακῇ — 牢に入れた."
  11: "ἕκαστος κατὰ τὸ αὑτοῦ ἐνύπνιον εἴδομεν — それぞれ自分の夢を見た."
  12: "νεανίσκος παῖς Εβραῖος — ヘブライ人の若い僕. συνέκρινεν ἡμῖν — わたしたちに解き明かした."
  13: "ἐγενήθη καθὼς συνέκρινεν — 解き明かしたとおりになった. ἐμὲ ἀποκατασταθῆναι… ἐκεῖνον δὲ κρεμασθῆναι — わたしは戻され、あの者は吊るされた (в греч. инфинитивы)."
  14: "ἐξήγαγον ἐκ τοῦ ὀχυρώματος — 要塞から連れ出した. ἐξύρησαν — 髪を剃らせた (ξυράω). ἤλλαξαν τὴν στολήν — 衣服を着替えさせた."
  15: "Ἐνύπνιον ἑώρακα — 夢を見た (perfect с силой: «я видел и вижу»). ἀκοῦσαντά σε ἐνύπνια συγκρῖναι — 夢を聞けば解き明かす (ἀκούω + acc. — «услышав сны»)."
  16: "Ἄνευ τοῦ θεοῦ οὐκ ἀποκριθήσεται τὸ σωτήριον Φαραω — ファラオの救いとなる答えは神によらずには与えられない (слав. «без Бога не отвещается спасение фараону»; Синод. перефразирует — «это не мое»; переведено по греч., без сглаживания)."
  17: "ἐν τῷ ὕπνῳ μου — わたしの夢の中で. παρὰ τὸ χεῖλος — 川の岸に (ср. 41:1 «на реке»)."
  18: "Повтор сна (18–19) сохранён, как в LXX; ἐκλεκταὶ ταῖς σαρξίν — 肉づきの良い."
  19: "οἵας οὐκ εἶδον τοιαύτας ἐν ὅλῃ γῇ Αἰγύπτῳ αἰσχροτέρας — エジプトの全土であれほど醜いものを見たことがない (двойное сравнение греч. сохранено)."
  20: "τὰς πρώτας — 先の (первых). Стих короткий и обрывается в LXX, как и в слав."
  21: "εἰσῆλθον εἰς τὰς κοιλίας αὐτῶν — 腹の中に入った. οὐ διάδηλοι ἐγένοντο — 分からないほどで (διάδηλος — «явный»). ἐξεγερθεὶς δὲ ἐκοιμήθην — 目を覚ました (в LXX странно: «пробудившись, я спал»; передано только пробуждение)."
  22: "πλήρεις καὶ καλοί — 実った良い穂. ἀνέβαινον — 上って来た."
  23: "ἐχόμενοι αὐτῶν — そのすぐ後から (букв. «следующие за ними»). ἀνεμόφθοροι — 東風に焼かれた."
  24: "εἶπα οὖν τοῖς ἐξηγηταῖς — 夢解きたちに話した. οὐκ ἦν ὁ ἀπαγγέλλων μοι — 告げる者はいなかった."
  25: "τὸ ἐνύπνιον Φαραω ἕν ἐστιν — ファラオの夢は一つ. ὅσα ὁ θεὸς ποιεῖ, ἔδειξεν — 神がなさろうとしていることを示された."
  26: "αἱ ἑπτὰ βόες… ἑπτὰ ἔτη ἐστίν — 七年のこと. Сон один (повтор, как в LXX)."
  27: "ἔσονται ἑπτὰ ἔτη λιμοῦ — 飢饉の七年となる."
  28: "τὸ δὲ ῥῆμα ὃ εἴρηκα — わたしが申し上げた言葉. Повтор 25-го стиха сохранён."
  29: "εὐθηνία πολλή — 大きな豊作 (εὐθηνία — «благоденствие, изобилие»)."
  30: "ἐπιλήσονται τῆς πλησμονῆς — 豊作は忘れられる (πλησμονή — «полнота, сытость»). ἀναλώσει ὁ λιμός — 飢饉が滅ぼす (ἀναλίσκω — «истреблять»)."
  31: "οὐκ ἐπιγνωσθήσεται — 知られることもない. ἰσχυρὸς γὰρ ἔσται σφόδρα — あまりにも激しい."
  32: "δευτερῶσαι… δίς — 二度繰り返された. ἀληθὲς ἔσται τὸ ῥῆμα — 確かに定められた. ταχυνεῖ ὁ θεός — 神が速やかに行う (ταχύνω)."
  33: "σκέψαι — 選べ (императив; слав. «усмотри»). φρόνιμον καὶ συνετόν — 思慮深く賢い."
  34: "τοπάρχας — 地方の長たち (τοπάρχης, областеначальник). ἀποπεμπτωσάτωσαν πάντα τὰ γενήματα — すべての産物を集めさせよ (ἀποπέμπω — «отсылать»). В LXX «пятой части» нет; она есть в слав. («да собирают пятую часть», из евр.) — взята в 〔…〕 как церковное чтение, отсутствующее в gr-lxx-byz (bracket_check: основа πεμπτον в 41:34 — НЕТ; πεμπτ- встречается только внутри ἀποπεμπτωσάτωσαν, другого слова)."
  35: "συναγαγέτωσαν πάντα τὰ βρώματα — すべての食物を集めよ. συναχθήτω ὁ σῖτος ὑπὸ χεῖρα Φαραω — 穀物をファラオの手のもとにたくわえよ. φυλαχθήτω — 守らせよ."
  36: "πεφυλαγμένα — 蓄え (perfect pass. φυλάσσω). οὐκ ἐκτριβήσεται ἡ γῆ — その地は滅びない (ἐκτρίβω — «истреблять»)."
  37: "Ἤρεσεν — 目にかなった (ἀρέσκω)."
  38: "πνεῦμα θεοῦ — 神の霊 (без ἅγιον, поэтому не 聖霊). Μὴ εὑρήσομεν — 見つけることができるだろうか (вопросительное μή)."
  39: "οὐκ ἔστιν ἄνθρωπος φρονιμώτερος καὶ συνετώτερός σου — あなたほど思慮深く賢い者はいない."
  40: "ἐπὶ τῷ οἴκῳ μου — わたしの家の上に. ἐπὶ τῷ στόματί σου ὑπακούσεται — あなたの言葉に従う (букв. «устам твоим будут послушны»). πλὴν τὸν θρόνον ὑπερέξω σου ἐγώ — ただ王座においてだけ、わたしがあなたより上に立つ (ὑπερέχω)."
  41: "καθίστημί σε — あなたを立てる (καθίστημι — «поставлять»)."
  42: "δακτύλιον — 指輪. βυσσίνην στολήν — 亜麻布の衣 (βύσσινος — виссон, тонкое льняное полотно). κλοιὸν χρυσοῦν περὶ τὸν τράχηλον — 金の首輪を首に (κλοιός — «ошейник, цепь»)."
  43: "ἅρμα τὸ δεύτερον — 第二の車. ἐκήρυξεν ἔμπροσθεν αὐτοῦ κῆρυξ — 布告者に布告させた; содержания возгласа в LXX нет (в евр. אַבְרֵךְ, Синод. «преклоняйтесь!») — не добавлено, чтобы не вносить масоретское чтение."
  44: "Ἐγὼ Φαραω — わたしはファラオである (формула царской власти). ἄνευ σοῦ οὐκ ἐξαρεῖ… τὴν χεῖρα αὐτοῦ — あなたなしにはだれも手を挙げることはできない; Синод. добавляет «ни ноги» — из евр., не переведено."
  45: "Ψονθομφανηχ — プソントムファネフ (греч. форма евр. имени, значение спорно). Ἡλίου πόλεως — ヘリオポリス («город Солнца»; евр. Он). Πετεφρη ἱερέως — ポティフェラ, другое лицо, чем ポティファル из 39:1 (слав. «петефриа»). В конце стиха Синод. добавляет «И пошел Иосиф по земле Египетской» — в греч. нет."
  46: "ἐτῶν τριάκοντα — 三十歳. ἔστη ἐναντίον Φαραω — ファラオの前に立った (предстал). διῆλθεν πᾶσαν γῆν — 全土を行き巡った."
  47: "δράγματα — 束 (снопы; букв. «горсти»; Синод. «по горсти»). ἐποίησεν ἡ γῆ — 地は生じた."
  48: "βρώματα τῶν πεδίων τῆς πόλεως τῶν κύκλῳ αὐτῆς — 町の周りにある畑の食物. ἔθηκεν ἐν αὐτῇ — その町の中に置いた."
  49: "ὡσεὶ τὴν ἄμμον τῆς θαλάσσης — 海の砂のように. ἕως οὐκ ἠδύναντο ἀριθμῆσαι — 数えることができないほど. οὐ γὰρ ἦν ἀριθμός — 数がなかった."
  50: "πρὸ τοῦ ἐλθεῖν τὰ ἑπτὰ ἔτη τοῦ λιμοῦ — 飢饉の七年が来る前に. Ἀσεννεθ — アセンナテ (в 45-м уже названа)."
  51: "Μανασση — マナセ. Ἐπιλαθέσθαι με ἐποίησεν ὁ θεὸς πάντων τῶν πόνων μου — 神はすべての労苦を忘れさせてくださった (πόνος — «труд, страдание»)."
  52: "Εφραιμ — エフライム. Ηὔξησέν με ὁ θεός — 神はわたしを実り多くしてくださった (αὐξάνω). ἐν γῇ ταπεινώσεώς μου — わたしの苦しみの地で (ταπείνωσις — «унижение, смирение»; слав. «в земли смирения моего»)."
  53: "Παρῆλθον — 過ぎ去った."
  54: "καθὰ εἶπεν Ιωσηφ — ヨセフが言ったとおり. ἐν δὲ πάσῃ γῇ Αἰγύπτου ἦσαν ἄρτοι — エジプトの全土にはパンがあった."
  55: "ἐπείνασεν πᾶσα ἡ γῆ — 全土も飢えた. ἐκέκραξεν ὁ λαός — 民は叫んだ. ὃ ἐὰν εἴπῃ ὑμῖν, ποιήσατε — 彼が言うとおりにしなさい."
  56: "ἐπὶ προσώπου πάσης τῆς γῆς — 地の全面に. σιτοβολῶνας — 穀物倉 (σιτοβολών — «хлебный склад»). ἐπώλει — 売った (имперфект: продавал постоянно)."
  57: "αἱ χῶραι — 国々. ἀγοράζειν πρὸς Ιωσηφ — ヨセフのもとへ買いに. ἐπεκράτησεν ὁ λιμός — 飢饉が激しかった (κρατέω — «одолевать»)."
