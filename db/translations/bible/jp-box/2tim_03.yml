# jp-box, 2-е Послание к Тимофею, глава 3. Черновик для приёмки.
#
# База: текст Церкви (византийский; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain): порядок членов,
# деление на клаузы, церковные чтения. Язык — современный, без 文語.
# Критический греческий — свидетель; расхождения с ним — в 〔…〕 и в notes.
# Глава 3: трудные времена в последние дни (1), портрет людей того времени (2–5),
# совратители в домах (6–9), жизнь Павла как образец (10–11),
# гонения на живущих благочестиво (12–13), пребывай в том, чему научен (14),
# Писание с младенчества (15), богодухновенность Писания (16–17).
# Красного и синего нет: прямой речи Христа и Богородицы в послании нет, <j>/<mo> не ставятся.
# 〔…〕 в главе нет: 3:15 [τὰ] ἱερὰ γράμματα стоит в базе в квадратных скобках — слово есть.
# Сноска ⟨…⟩ одна — 3:8 ヤンネとヤンブレ (имена не названы в Писании, известны из иудейского
# предания), первое место в корпусе. 3:8 — первое упоминание.
# 3:16 — 聖書はすべて神の霊感による; 3:1 — 終わりの日々. jp-ni не использовался.

tr_code: jp-box
book: 2tim
chapter: 3
draft: true

verses:
  1: "しかし、あなたはこのことを知[し]っておきなさい。終[お]わりの日[ひ]々[び]には、困難[こんなん]な時[とき]が来[く]る。"
  2: "人[ひと]々[びと]は自分[じぶん]を愛[あい]する者[もの]、金[かね]を愛[あい]する者[もの]、自慢[じまん]する者[もの]、高慢[こうまん]な者[もの]、神[かみ]を冒瀆[ぼうとく]する者[もの]、父母[ふぼ]に従[したが]わない者[もの]、恩[おん]を知[し]らない者[もの]、不敬[ふけい]な者[もの]となり、"
  3: "情[じょう]けを知[し]らない者[もの]、和解[わかい]を拒[こば]む者[もの]、中傷[ちゅうしょう]する者[もの]、自制[じせい]のない者[もの]、乱暴[らんぼう]な者[もの]、善[ぜん]を憎[にく]む者[もの]となり、"
  4: "裏切[うらぎ]る者[もの]、無謀[むぼう]な者[もの]、高[たか]ぶる者[もの]、神[かみ]を愛[あい]するよりも快楽[かいらく]を愛[あい]する者[もの]となり、"
  5: "敬虔[けいけん]の形[かたち]は持[も]ちながら、その力[ちから]を否[いな]んでいる者[もの]となる。あなたは、このような者[もの]たちから遠[とお]ざかりなさい。"
  6: "彼[かれ]らの中[なか]から、家[いえ]々[じ]に忍[しの]び込[こ]んで、罪[つみ]を積[つ]み重[かさ]ね、さまざまな欲[よく]に引[ひ]き回[まわ]される弱[よわ]い女[おんな]たちを捕[とら]えて行[い]く者[もの]たちが出[で]る。"
  7: "いつも学[まな]んではいるが、真理[しんり]の知識[ちしき]には決[けっ]して至[いた]ることのできない者[もの]たちである。"
  8: "ヤンネとヤンブレ⟨出[しゅつ]エジプト記[き]には名[な]が見[み]えないが、モーセに逆[さか]らったエジプトの魔術師[まじゅつし]たちの名[な]として、ユダヤの伝承[でんしょう]に伝[つた]わる。⟩がモーセに逆[さか]らったように、この者[もの]たちも真理[しんり]に逆[さか]らっている。思[おも]いが腐[くさ]り、信仰[しんこう]について失格[しっかく]した者[もの]たちである。"
  9: "しかし、彼[かれ]らはそれ以上[いじょう]進[すす]むことはない。彼[かれ]らの愚[おろ]かさは、あの者[もの]たちの愚[おろ]かさがそうであったように、すべての人[ひと]に明[あき]らかになるからである。"
  10: "しかし、あなたは、わたしの教[おし]え、行[おこな]い、目的[もくてき]、信仰[しんこう]、寛容[かんよう]、愛[あい]、忍耐[にんたい]、"
  11: "迫害[はくがい]、苦[くる]しみ、すなわち、アンティオキア、イコニオン、リストラでわたしに起[お]こったことに従[したが]ってきた。わたしはなんと多[おお]くの迫害[はくがい]を耐[た]え忍[しの]んだことか。しかし、主[しゅ]はそのすべてからわたしを救[すく]い出[だ]してくださった。"
  12: "また、キリスト・イエスにあって敬虔[けいけん]に生[い]きようと願[ねが]う者[もの]は、すべて迫害[はくがい]を受[う]ける。"
  13: "悪[わる]い人[ひと]々[びと]や詐欺師[さぎし]たちは、ますます悪[あく]へと進[すす]み、人[ひと]を欺[あざむ]き、自分[じぶん]も欺[あざむ]かれて行[い]く。"
  14: "しかし、あなたは、自分[じぶん]が学[まな]び、また確[たし]かめられたことを堅[かた]く守[まも]りなさい。あなたがだれから学[まな]んだかを知[し]っているからである。"
  15: "また、あなたが幼[おさな]い時[とき]から聖書[せいしょ]を知[し]っていることも。聖書[せいしょ]は、キリスト・イエスにある信仰[しんこう]によってあなたを救[すく]いに至[いた]らせる知恵[ちえ]を与[あた]えることができるものである。"
  16: "聖書[せいしょ]はすべて神[かみ]の霊感[れいかん]によるものであり、教[おし]え、戒[いまし]め、正[ただ]すこと、義[ぎ]に導[みちび]く訓練[くんれん]に益[えき]がある。"
  17: "そうして、神[かみ]の人[ひと]は完全[かんぜん]な者[もの]となり、すべての善[ぜん]い働[はたら]きのために整[ととの]えられるのである。"

notes:
  1: "Τοῦτο δὲ γίνωσκε — しかし、あなたはこのことを知っておきなさい. ἐν ἐσχάταις ἡμέραις — 終わりの日々に. ἐνστήσονται καιροὶ χαλεποί — 困難な時が来る (χαλεπός — «тяжкий, лютый», не «злой»)."
  2: "φίλαυτοι — 自分を愛する者. φιλάργυροι — 金を愛する者. ἀλαζόνες — 自慢する者. ὑπερήφανοι — 高慢な者. βλάσφημοι — 神を冒瀆する者. γονεῦσιν ἀπειθεῖς — 父母に従わない者. ἀχάριστοι — 恩を知らない者. ἀνόσιοι — 不敬な者 (ряд из восьми пороков сохранён, как в греч.)."
  3: "ἄστοργοι — 情けを知らない者 (ἀ-στέργω, «без родственной любви»). ἄσπονδοι — 和解を拒む者 (букв. «не заключающие перемирия»). διάβολοι — 中傷する者. ἀκρατεῖς — 自制のない者. ἀνήμεροι — 乱暴な者 («необузданные»). ἀφιλάγαθοι — 善を憎む者 (букв. «не любящие добра»)."
  4: "προδόται — 裏切る者. προπετεῖς — 無謀な者. τετυφωμένοι — 高ぶる者 (perfect от τυφόω — «оцепенеть от гордости»). φιλήδονοι μᾶλλον ἢ φιλόθεοι — 神を愛するよりも快楽を愛する者 (сравнение μᾶλλον ἤ сохранено)."
  5: "μόρφωσιν εὐσεβείας — 敬虔の形 (μόρφωσις — «вид, наружность»). τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι — その力を否んでいる. καὶ τούτους ἀποτρέπου — このような者たちから遠ざかりなさい."
  6: "οἱ ἐνδύνοντες εἰς τὰς οἰκίας — 家々に忍び込んで. αἰχμαλωτίζοντες — 捕えて行く. γυναικάρια — уменьшительное от γυνή, презрительно; 弱い女たち (не «женщины» нейтрально). σεσωρευμένα ἁμαρτίαις — 罪を積み重ね (σωρεύω — «нагромождать»). ἀγόμενα ἐπιθυμίαις ποικίλαις — さまざまな欲に引き回される."
  7: "πάντοτε μανθάνοντα — いつも学んではいる. μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα — 真理の知識には決して至ることのできない (ἐπίγνωσις — полное знание, ср. 2:25)."
  8: "ὃν τρόπον — ように. Ἰάννης καὶ Ἰαμβρῆς — ヤンネとヤンブレ: в Исх не названы, имена из иудейского предания, поэтому сноска при первом месте в корпусе. ἀνθίστανται τῇ ἀληθείᾳ — 真理に逆らっている. κατεφθαρμένοι τὸν νοῦν — 思いが腐り. ἀδόκιμοι περὶ τὴν πίστιν — 信仰について失格した者 (ἀδόκιμος — «не прошедший испытания», ср. 2:15 δόκιμον)."
  9: "οὐ προκόψουσιν ἐπὶ πλεῖον — それ以上進むことはない (ср. 2:16 προκύψουσιν — тот же глагол). ἡ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν — 愚かさはすべての人に明らかになる. ὡς καὶ ἡ ἐκείνων ἐγένετο — あの者たちの愚かさがそうであったように."
  10: "Σὺ δὲ παρηκολούθησάς μου — あなたは…従ってきた (παρακολουθέω — «идти следом, прослеживать»). Семь родительных: τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ — 教え、行い、目的、信仰、寛容、愛、忍耐; список обрывается, продолжение в 11 ст."
  11: "τοῖς διωγμοῖς, τοῖς παθήμασιν — 迫害、苦しみ. Ἀντιόχεια, Ἰκόνιον, Λύστρα — アンティオキア、イコニオン、リストラ (Деян 13–14). οἵους διωγμοὺς ὑπήνεγκα — なんと多くの迫害を耐え忍んだことか. ἐκ πάντων με ἐρρύσατο ὁ κύριος — 主はそのすべてから…救い出してくださった."
  12: "οἱ θέλοντες ζῆν εὐσεβῶς ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにあって敬虔に生きようと願う者. διωχθήσονται — 迫害を受ける (обещание, не возможность)."
  13: "πονηροὶ ἄνθρωποι καὶ γόητες — 悪い人々や詐欺師たち (γόης — «шарлатан, обманщик»). προκύψουσιν ἐπὶ τὸ χεῖρον — ますます悪へと進む. πλανῶντες καὶ πλανώμενοι — 人を欺き、自分も欺かれる (два причастия, оба сохранены)."
  14: "σὺ δὲ μὲνε ἐν οἷς ἔμαθες καὶ ἐπιστώθης — 学び、また確かめられたことを堅く守りなさい (πιστόω — «уверить, удостоверить»). εἰδὼς παρὰ τίνων ἔμαθες — だれから学んだかを知っている (τινῶν может быть и мн. ч. — не уточнено, поэтому だれから)."
  15: "ἀπὸ βρέφους — 幼い時から. ἱερὰ γράμματα — 聖書 (букв. «священные письмена»; в базе [τὰ] в квадратных скобках — слово есть, 〔…〕 не ставятся). σοφίσαι εἰς σωτηρίαν — 救いに至らせる知恵を与える. διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ — キリスト・イエスにある信仰によって."
  16: "πᾶσα γραφὴ θεόπνευστος — 聖書はすべて神の霊感による (θεόπνευστος — «богодухновенный»; в греч. без глагола-связки, по-японски によるものであり). καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ — 教え、戒め、正すこと、義に導く訓練に益がある (четыре цели сохранены, ἐλεγμός — 戒め, а не «обличение» ради резкости)."
  17: "ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος — 神の人は完全な者となり (ἄρτιος — «полный, годный», не «безгрешный»). πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος — すべての善い働きのために整えられる (ἐξαρτίζω — однокоренное с ἄρτιος; связь отмечена в переводе 完全/整えられる)."
