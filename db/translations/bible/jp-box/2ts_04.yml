# jp-box, 2-я Царств, глава 4. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 2 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 4: весть о смерти Авенира (1); Баана и Рихав, сыны Реммона (2–3);
# Мемфивосфей, сын Ионафана (4); убийство Иевосфея (5–7); голова принесена
# Давиду (8); ответ Давида (9–10); казнь убийц и погребение головы (11–12).
# Речь — 「…」: 4:8 (убийцы), 4:9–10 (Давид; кавычки открываются в 9 и
# закрываются в 10, как в 1 Цар 17:45–47).
# Красного и синего нет: <j>/<mo> не ставятся.
# 〔…〕 нет: слав. добавления («сын Ниров» 4:1, «внидоста в дом» 4:6,
# «и Ионафан» 4:10, «нашему» 4:8) внесены в основной текст без скобок;
# слав. помета в скобках («в Хевроне» 4:12) в текст не внесена. Всё в notes.
# Имя: в gr-lxx-byz сын Саула зовётся Μεμφιβοσθε, в csl и МТ — Иевосфей
# (イシュボシェト); по паритету взято церковное чтение csl, вариант LXX — в notes.
# В 4:4 сын Ионафана — Мемфивосфей (メフィボシェト) и в гр., и в слав.
# Сносок ⟨…⟩ нет: новых терминов в главе нет, имена сносок не получают.
# jp-ni не использовался.

tr_code: jp-box
book: 2ts
chapter: 4
draft: true

verses:
  1: "サウルの子[こ]イシュボシェトは、ニルの子[こ]アブネルがヘブロンで死[し]んだと聞[き]いて、両手[りょうて]がだらりと垂[た]れ、イスラエルの人[ひと]々[びと]もみな気力[きりょく]を失[うしな]った。"
  2: "サウルの子[こ]イシュボシェトのもとに、二人[ふたり]の隊[たい]の長[ちょう]がいた。一人[ひとり]の名[な]はバアナ、もう一人の名はリハブといい、ベニヤミンの子[こ]らのうちのベエロト人[じん]レモンの子[こ]らであった。ベエロトもベニヤミンの子らに数[かぞ]えられていたからである。"
  3: "ベエロトの人[ひと]々[びと]はギッタイムへ逃[に]げ、そこに寄留[きりゅう]して今日[きょう]に至[いた]っている。"
  4: "サウルの子[こ]ヨナタンには、足[あし]のきかない子[こ]があった。五歳[ごさい]のとき、サウルとその子ヨナタンのことがイズレエルから告[つ]げられたので、乳母[うば]が彼[かれ]を抱[かか]えて逃[に]げた。乳母が急[いそ]いで去[さ]ろうとしたとき、彼は落[ち]て足が不自由[ふじゅう]になった。その名[な]はメフィボシェトといった。"
  5: "ベエロト人[じん]レモンの子[こ]ら、リハブとバアナは出[で]かけて、日[ひ]の暑[あつ]い盛[さか]りにイシュボシェトの家[いえ]に入[はい]った。彼は真昼[まひる]の寝台[しんだい]の上[うえ]で眠[ねむ]っていた。"
  6: "見[み]よ、家[いえ]の女[おんな]の門番[もんばん]が小麦[こむぎ]を選[よ]り分[わ]けているうちに、うとうとして眠[ねむ]ってしまった。そこで兄弟[きょうだい]のリハブとバアナは、人目[ひとめ]を忍[しの]んで家の中[なか]へ入[はい]った。"
  7: "イシュボシェトは寝室[しんしつ]の寝台[しんだい]の上[うえ]で眠っていた。彼らは彼を打[う]ち、殺[ころ]し、その頭[あたま]を切[き]り取[と]った。そして頭を取って、夜[よる]通[どお]し西[にし]へ向[む]かう道[みち]を去[さ]った。"
  8: "彼らはイシュボシェトの頭[あたま]をヘブロンのダビデのもとへ携[たずさ]えて来[き]て、王[おう]に言[い]った。「ごらんなさい。あなたの敵[てき]、サウルの子[こ]イシュボシェトの頭です。あなたの命[いのち]を求[もと]めていた者[もの]の頭です。主[しゅ]は今日[きょう]、われらの主君[しゅくん]である王[おう]に、サウルというあなたの敵と、その子孫[ししそん]に対する復讐[ふくしゅう]をお与[あた]えになりました。」"
  9: "ダビデは、ベエロト人[じん]レモンの子[こ]らであるリハブと、その兄弟[きょうだい]バアナに答[こた]えて言[い]った。「主[しゅ]は生[い]きておられる。わたしの魂[たましい]をすべての苦[くる]しみから救[すく]い出[だ]された主[しゅ]にかけて言[い]う。"
  10: "サウルとヨナタンが死[し]んだと告[つ]げた者[もの]——その者[もの]はわたしの前[まえ]で良[よ]い知らせを告[つ]げる者のようであった——を、わたしは捕[つか]まえ、セケラクで殺[ころ]した。褒美[ほうび]を与[あた]えるべき者[もの]だったのに。」"
  11: "悪[わる]い者[もの]たちが、正[ただ]しい人[ひと]をその家[いえ]で、その寝台[しんだい]の上[うえ]で殺[ころ]した。それなら今[いま]、わたしはその血[ち]をあなたがたの手[て]から求[もと]め、あなたがたをこの地[ち]から断[た]ち滅[ほろ]ぼす。"
  12: "ダビデは若者[わかもの]たちに命[めい]じた。彼らは二人[ふたり]を殺[ころ]し、その手[て]と足[あし]を切[き]り落[お]とし、ヘブロンの泉[いずみ]のそばで彼らを吊[つる]した。彼らはイシュボシェトの頭[あたま]を、ニルの子[こ]アブネルの墓[はか]に葬[ほうむ]った。"

notes:
  1: "ἤκουσεν … ὅτι τέθνηκεν Αβεννηρ — услышал, что умер Авенир. ἐξελύθησαν αἱ χεῖρες αὐτοῦ — «ослабели, развязались руки его» (ἐκλύω): образ полной потери сил. παρείθησαν — ослабели, пали духом (παρίημι). Имя: в gr-lxx-byz здесь и далее (1, 2, 5, 7, 8, 12) Μεμφιβοσθε — Мемфивосфей; csl и МТ читают Иевосфей (イシュボシェト), это чтение взято по паритету как церковное. Слав. добавляет «сын Ниров» при Авенире — в гр. только Αβεννηρ (ср. 1 Цар 14:50; 2 Цар 2:8); внесено."
  2: "συστρέμματα — отряды, шайки (σύστρεμμα), слав. «полки». ὄνομα τῷ ἑνὶ Βαανα … τῷ δευτέρῳ Ρηχαβ — имена: Баана и Рихав. Ρεμμων τοῦ Βηρωθαίου — Реммон Беерофянин (Βηρωθ — Беероф, ベエロト); ἐκ τῶν υἱῶν Βενιαμιν — из сынов Вениамина. ἐλογίζετο — считался, причислялся (λογίζομαι)."
  3: "ἀπέδρασαν — убежали (ἀποδιδράσκω). Γεθθαιμ — Гиффаим (ギッタイム; слав. «гефем»). παροικοῦντες — живя пришельцами (παροικέω), отсюда 寄留. ἕως τῆς ἡμέρας ταύτης — до сего дня."
  4: "υἱὸς πεπληγὼς τοὺς πόδας — «поражённый в ноги», хромой; слав. «хром ногама». τιθηνός — кормилица, нянька (乳母). ἀναχωρεῖν — уходить, отступать. ἐχωλάνθη — охромел (χωλαίνω). Имя Μεμφιβοσθε и в слав. «мемфивосфей»: это сын Ионафана (メフィボシェト), его не надо смешивать с Иевосфеем, сыном Саула, из 1–3, 5, 7–8, 12."
  5: "ἐν τῷ καύματι τῆς ἡμέρας — в зной дня. κοίτη τῆς μεσημβρίας — полуденное ложе (послеобеденный сон); слав. «на одре в полудне». ἐκάθευδεν — имперфект: спал, лежал."
  6: "θυρωρός — привратница: в гр. женский род (ἡ θυρωρός), слав. «вратник» (муж. р.); в тексте 女の門番. ἐκάθαιρεν πυρούς — очищала пшеницу (καθαίρω). ἐνύσταξεν — задремала (νυστάζω). διέλαθον — прошли незаметно (διαλανθάνω). Слав. добавляет «внидоста в дом» — в гр. это начало 4:7; порядок по слав."
  7: "τύπτουσιν … θανατοῦσιν — настоящее историческое. ἀφαιροῦσιν τὴν κεφαλήν — отнимают голову. ὁδὸν τὴν κατὰ δυσμάς — дорогой на запад; в МТ «дорогой пустыни (Аравы)», гр. читает δυσμάς, слав. «иже на запад». Начало стиха в гр. — «и вошли в дом»; по слав. это конец 4:6."
  8: "ἐκδίκησιν τῶν ἐχθρῶν αὐτοῦ — отмщение врагов его (ἐκδίκησις). Слав. добавляет «нашему» («господину нашему царю») — в гр. τῷ κυρίῳ βασιλεῖ; внесено (われらの主君). ἐκ τοῦ σπέρματος αὐτοῦ — из семени, потомства его."
  9: "Ζῇ κύριος — «жив Господь», клятвенная формула (ср. 1 Цар 14:39; Пс 17:47). ἐλυτρώσατο — избавил (λυτρόω). ἐκ πάσης θλίψεως — от всякой скорби (θλῖψις). Формула продолжается в 4:10 (ὅτι …), поэтому добавлено かけて言う — иначе стихи 9–10 по-японски не связать."
  10: "εὐαγγελιζόμενος — как благовествующий, приносящий добрую весть. Слав. добавляет «и Ионафан» при «умре Саул» — в гр. только Σαυλ; внесено (ср. 1:4–10). ᾧ ἔδει με δοῦναι εὐαγγέλια — которому надлежало мне дать награду за весть (εὐαγγέλια, мн. ч.)."
  11: "ἀπεκτάγκασιν — убили (перфект ἀποκτείνω). ἄνδρα δίκαιον — мужа праведного, невинного. ἐκζητήσω τὸ αἷμα — взыщу кровь (ἐκζητέω; ср. Быт 9:5). ἐξολεθρεύσω — истреблю (ἐξολεθρεύω)."
  12: "παιδάρια — отроки, слуги (слав. «отроком»). κολοβοῦσιν — отсекают (κολοβόω). ἐπὶ τῆς κρήνης — над источником (κρήνη). Слав. в скобках добавляет «в Хевроне» — в гр. нет (в МТ есть), в текст не внесено. Гроб Авенира, сына Нира — ср. 3:32."
