# jp-box, Псалтирь, псалом 121. Черновик для приёмки.
#
# База: текст Церкви (LXX; контроль — Елизаветинская, Синодальный, jp-joc).
# Образец строя — jp-joc (Николай Японский, 1901, public domain). Язык — современный 常体.
# Нумерация церковная (LXX), как в русской базе сайта: надписание — стих 0.
# Псалом 121: радость о доме Господнем (1), Иерусалим как единый город (2–3),
# восхождение племён на суд (4–5), молитва о мире (6–9).
# Красного и синего нет. Кавычки: слова идущих в дом Господень в 1 — 「…」.
# 〔…〕 нет: перевод сделан по gr-lxx-byz, добавлений Церкви не вносилось.
# セラ (διάψαλμα) в этой главе нет.
# Сносок ⟨…⟩ нет: 王座, 砦, 繁栄 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: ps
chapter: 121
draft: true

verses:
  0: "登[とう]上[じょう]の歌[うた]。ダビデのもの。"
  1: "わたしに「主[しゅ]の家[いえ]へ行[ゆ]こう」と言[い]った人[ひと]たちのゆえに、わたしは喜[よろこ]んだ。"
  2: "エルサレムよ、わたしたちの足[あし]は、あなたの庭[にわ]に立[た]っている。"
  3: "エルサレムは、一つに結[むす]び合[あ]わされた町[まち]のように建[た]てられている。"
  4: "そこへ、もろもろの部族[ぶぞく]、主[しゅ]の部族[ぶぞく]が上[のぼ]って来[く]る。イスラエルへの証[あかし]として、主[しゅ]の名[な]をほめたたえるために。"
  5: "そこには裁[さば]きの王座[おうざ]、ダビデの家[いえ]の王座[おうざ]が置[お]かれている。"
  6: "エルサレムの平和[へいわ]のために祈[いの]れ。あなたを愛[あい]する者[もの]には繁栄[はんえい]があるように。"
  7: "あなたの砦[とりで]の内[うち]に平和[へいわ]が、あなたのやぐらに繁栄[はんえい]があるように。"
  8: "わたしの兄弟[きょうだい]たち、わたしの隣[となり]の人[ひと]たちのゆえに、わたしはあなたの平和[へいわ]を祈[いの]ろう。"
  9: "わたしたちの神[かみ]である主[しゅ]の家[いえ]のゆえに、わたしはあなたの幸[しあわ]せを求[もと]める。"

notes:
  0: "Ὠιδὴ τῶν ἀναβαθμῶν — 登[とう]上[じょう]の歌. В gr-lxx-byz надписание без имени, но в ru-базе и у jp-joc стоит «Давида»; по правилу надписаний добавлено ダビデのもの без 〔…〕 (надписания скобками не маркируются)."
  1: "Εὐφράνθην ἐπὶ τοῖς εἰρηκόσίν μοι — わたしに…と言った人たちのゆえに、わたしは喜んだ (εὐφραίνομαι — «радоваться, веселиться»; ἐπί + dat. — «по причине»). Εἰς οἶκον κυρίου πορευσόμεθα — 「主の家へ行こう」 (πορεύομαι — «идти, отправляться»). Слова идущих — прямая речь, первый уровень 「…」."
  2: "ἑστῶτες ἦσαν οἱ πόδες ἡμῶν — わたしたちの足は…立っている (ἵστημι в perfect — «стоим, утверждены»). ἐν ταῖς αὐλαῖς σου, Ιερουσαλημ — あなたの庭に、エルサレムよ (αὐλή — «двор» храма; 庭[にわ], как в 133:1 у jp-joc). Обращение к городу сохранено звательным エルサレムよ."
  3: "Ιερουσαλημ οἰκοδομουμένη ὡς πόλις ἧς ἡ μετοχὴ αὐτῆς ἐπὶ τὸ αὐτό — エルサレムは、一つに結び合わされた町のように建てられている (μετοχή — «соединение, общность»; ἐπὶ τὸ αὐτό — «в одно целое»). Причастие настоящего времени οἰκοδομουμένη передано 建てられている."
  4: "ἐκεῖ γὰρ ἀνέβησαν αἱ φυλαί — そこへ、もろもろの部族が上って来る (ἀναβαίνω — «восходить», глагол паломничества; аорист в знач. постоянного). φυλαὶ κυρίου μαρτύριον τῷ Ισραηλ — 主の部族、イスラエルへの証しとして (μαρτύριον — «свидетельство»; датив τῷ Ισραηλ — «Израилю»). τοῦ ἐξομολογήσασθαι τῷ ὀνόματι κυρίου — 主の名をほめたたえるために (ἐξομολογέομαι — «славить, исповедовать»; цель выражена ために)."
  5: "ὅτι ἐκεῖ ἐκάθισαν θρόνοι εἰς κρίσιν — そこには裁きの王座が…置かれている (θρόνος — 王座; καθίζω — «сесть, быть поставленным»; εἰς κρίσιν — «для суда»). θρόνοι ἐπὶ οἶκον Δαυιδ — ダビデの家の王座 (ἐπί + acc. — «над домом Давида», т. е. принадлежащие ему). Двойной θρόνοι сохранён повтором 王座."
  6: "ἐρωτήσατε δὴ τὰ εἰς εἰρήνην τὴν Ιερουσαλημ — エルサレムの平和のために祈れ (ἐρωτάω — «просить, вопрошать»; τὰ εἰς εἰρήνην — «то, что к миру»). καὶ εὐθηνία τοῖς ἀγαπῶσίν σε — あなたを愛する者には繁栄があるように (εὐθηνία — «изобилие, благоденствие»; пожелание передано ように)."
  7: "γενέσθω δὴ εἰρήνη ἐν τῇ δυνάμει σου — あなたの砦の内に平和があるように (δύναμις здесь — «крепость, сила» городских стен, ср. рус. «сила»; передано 砦). καὶ εὐθηνία ἐν ταῖς πυργοβάρεσίν σου — あなたのやぐらに繁栄があるように (πυργοβάρεσις — редкое сложение «башни-твердыни»; やぐら — башни). Оптатив γενέσθω — пожелание, отсюда ように."
  8: "ἕνεκα τῶν ἀδελφῶν μου καὶ τῶν πλησίον μου — わたしの兄弟たち、わたしの隣の人たちのゆえに (ἕνεκα — «ради»; πλησίον — «ближний»). ἐλάλουν δὴ εἰρήνην περὶ σοῦ — わたしはあなたの平和を祈ろう (λαλέω εἰρήνην — букв. «говорить мир», т. е. желать мира; имперфект в знач. намерения)."
  9: "ἕνεκα τοῦ οἴκου κυρίου τοῦ θεοῦ ἡμῶν — わたしたちの神である主の家のゆえに (два генетива: «дом Господа, Бога нашего»). ἐξεζήτησα ἀγαθά σοι — わたしはあなたの幸せを求める (ἐκζητέω — «искать, взыскивать»; ἀγαθά — «блага»; 幸せ — благо города)."
