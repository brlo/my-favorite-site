verses:
  1: "「主[しゅ]はご自分[じぶん]の言葉[ことば]を立[た]てられた。それは、私たちと、イスラエルを裁[さば]いた私たちの裁[さば]き手[て]たち、私たちの王[おう]たち、君[きみ]たち、そしてイスラエルとユダのすべての人[ひと]に向[む]かって語[かた]られたものである。"
  2: "天[てん]の下[した]のどこでも、エルサレムでなされたような大[おお]きな災[わざわ]いは、かつてなされなかった。モーセの律法[りっぽう]に書[か]かれているとおりである。"
  3: "すなわち、人[ひと]が自分[じぶん]の息子[むすこ]の肉[にく]を、娘[むすめ]の肉[にく]を食[た]べるということである。"
  4: "主[しゅ]は彼らを、周[まわ]りのすべての王国[おうこく]の支配[しはい]の下[した]に置[お]かれた。主が彼らを散[ち]らされた周りのすべての民[たみ]の間[あいだ]で、彼らは嘲[あざけ]りとなり、誰[だれ]も通[とお]らない荒[あ]れ地[ち]となった。"
  5: "私たちは下[した]にあり、上[うえ]にはなかった。私たちが私たちの神[かみ]である主[しゅ]に罪[つみ]を犯[おか]し、その声[こえ]に聞[き]かなかったからである。"
  6: "私たちの神[かみ]である主[しゅ]にこそ義[ぎ]があり、私たちと私たちの父[ちち]たちには顔[かお]の恥[はじ]がある。今日[きょう]という日[ひ]のように。"
  7: "主[しゅ]が私たちの上[うえ]に語[かた]られたすべての災[わざわ]いは、みな私たちに臨[のぞ]んだ。"
  8: "しかし、私たちは主[しゅ]の御顔[みかお]に願[ねが]い求めず、それぞれが自分[じぶん]の悪[わる]い心[こころ]の思[おも]いから離[はな]れ返[かえ]るようにと求[もと]めることもしなかった。"
  9: "主[しゅ]は災[わざわ]いの上[うえ]に目覚[めざ]めておられ、その災いを私たちに臨[のぞ]ませられた。主[しゅ]は、ご自分[じぶん]が私たちに命[めい]じられたすべてのわざにおいて正[ただ]しいからである。"
  10: "しかし、私たちはその声[こえ]に聞[き]き従[したが]わず、主[しゅ]が私たちの前[まえ]に置[お]かれた戒[いまし]めに従[したが]って歩[あゆ]まなかった。"
  11: "しかし今[いま]、イスラエルの神[かみ]である主[しゅ]よ。あなたは強[つよ]い手[て]と、しるしと、不思議[ふしぎ]と、大[おお]きな力[ちから]と、高[たか]く挙[あ]げられた腕[うで]によって、あなたの民[たみ]をエジプトの地[ち]から導[みちび]き出[だ]し、今日[きょう]という日[ひ]のように、ご自身[じしん]のために名[な]を建[た]てられました。"
  12: "私たちの神[かみ]である主[しゅ]よ、私たちは罪[つみ]を犯[おか]し、不敬[ふけい]を行[おこな]い、あなたのすべての定[さだ]めに逆[さか]らって不正[ふせい]を行[おこな]いました。"
  13: "どうか、あなたの怒[いか]りを私たちから退[しりぞ]けてください。あなたが私たちをそこに散[ち]らされた国々[くにぐに]の間[あいだ]で、私たちはわずかしか残[のこ]っていないのですから。"
  14: "主[しゅ]よ、私たちの祈[いの]りと願[ねが]いを聞[き]き入[い]れ、あなたご自身のために私たちを救[すく]い出[だ]し、私たちを移[うつ]した者[もの]たちの前[まえ]で、私たちに恵[めぐ]みを与[あた]えてください。"
  15: "そうすれば、地[ち]はすべて、あなたが私たちの神[かみ]である主[しゅ]であることを知[し]るでしょう。あなたの名[な]が、イスラエルとその子孫[しそん]の上[うえ]に呼[よ]ばれているからです。"
  16: "主[しゅ]よ、あなたの聖[せい]なる家[いえ]から見下[みお]ろし、私たちに心[こころ]を留[と]めてください。主[しゅ]よ、あなたの耳[みみ]を傾[かたむ]けて聞[き]いてください。"
  17: "主[しゅ]よ、あなたの目[め]を開[ひら]いて見[み]てください。陰府[よみ]にある死者[ししゃ]、その霊[れい]が自分[じぶん]の内[うち]から取[と]り去[さ]られた者[もの]たちは、主に栄光[えいこう]と義[ぎ]の誉[ほま]れを帰[き]さないからです。"
  18: "しかし、災[わざわ]いの大[おお]きさのために悲[かな]しみ、うなだれて弱[よわ]りながら歩[あゆ]む魂[たましい]、衰[おとろ]えて尽[つ]きる目[め]、飢[う]えた魂[たましい]は、あなたに栄光[えいこう]と義[ぎ]を帰[き]すのです、主[しゅ]よ。"
  19: "私たちの神[かみ]である主[しゅ]よ、私たちがあなたの前[まえ]に願[ねが]いを差[さ]し上[あ]げるのは、私たちの父[ちち]たちや王[おう]たちの義[ぎ]のわざによるのではありません。"
  20: "あなたは、あなたの怒[いか]りと憤[いきどお]りを私たちに注[そそ]がれました。それは、あなたがあなたの僕[しもべ]である預言者[よげんしゃ]たちの手[て]によって語[かた]られたとおりです。こう言[い]われました。"
  21: "『主[しゅ]はこう言[い]われる。あなたがたの肩[かた]を下[さ]げて、バビロンの王[おう]に仕[つか]えよ。そうすれば、あなたがたの父[ちち]たちに与[あた]えた地[ち]に住[す]むことができる。"
  22: "もしあなたがたが主[しゅ]の声[こえ]に聞[き]き従[したが]わず、バビロンの王[おう]に仕[つか]えないなら、"
  23: "わたしはユダの都々[みやこみやこ]とエルサレムの外[そと]から、喜[よろこ]びの声[こえ]と楽[たの]しみの声[こえ]、花婿[はなむこ]の声[こえ]と花嫁[はなよめ]の声[こえ]を絶[た]やさせる。この地[ち]はすべて、住[す]む者[もの]のいない荒[あ]れ地[ち]となる。』"
  24: "しかし、私たちはあなたの声[こえ]に聞[き]き従[したが]わず、バビロンの王[おう]に仕[つか]えなかった。あなたは、あなたの僕[しもべ]である預言者[よげんしゃ]たちの手[て]によって語[かた]られた言葉[ことば]を立[た]てられた。すなわち、私たちの王[おう]たちの骨[ほね]と私たちの父[ちち]たちの骨[ほね]が、その場所[ばしょ]から運[はこ]び出[だ]されるということである。"
  25: "見[み]よ、彼らは昼[ひる]の暑[あつ]さと夜[よる]の霜[しも]にさらされ、悪[わる]い苦[くる]しみのうちに死[し]んだ。飢[う]えと剣[つるぎ]と追放[ついほう]によってである。"
  26: "あなたは、あなたの名[な]が呼[よ]ばれている家[いえ]を、今日[きょう]という日[ひ]のようにしてしまわれた。イスラエルの家[いえ]とユダの家[いえ]の悪[わる]のためである。"
  27: "私たちの神[かみ]である主[しゅ]よ、あなたはあなたのすべての寛[かん]容[よう]と、あなたの大[おお]きな憐[あわ]れみのすべてに従[したが]って、私たちを扱[あつか]われました。"
  28: "あなたが、あなたの僕[しもべ]モーセの手[て]によって語[かた]られたとおりです。あなたが彼に、イスラエルの子[こ]らの前[まえ]であなたの律法[りっぽう]を書[か]き記[しる]すよう命[めい]じられた日[ひ]に、こう言[い]われました。"
  29: "『もしあなたがたがわたしの声[こえ]に聞[き]き従[したが]わないなら、この大[おお]きな群[む]れ、この多[おお]くの民[たみ]は、わたしが彼らをそこに散[ち]らす国々[くにぐに]の間[あいだ]で、小[ちい]さなものに変[か]わってしまう。"
  30: "わたしは、彼らがわたしに聞[き]き従[したが]わないことを知[し]っている。かたくなな民[たみ]だからである。しかし、彼らは移[うつ]された地[ち]で、自分[じぶん]の心[こころ]に立[た]ち返[かえ]る。"
  31: "そして、わたしが彼らの神[かみ]である主[しゅ]であることを知[し]る。わたしは彼らに心[こころ]と、聞[き]く耳[みみ]を与[あた]える。"
  32: "彼らは移[うつ]された地[ち]でわたしをほめたたえ、わたしの名[な]を思[おも]い出[だ]す。"
  33: "彼らは自分[じぶん]の頑[がん]固[こ]な背[せ]からも、悪[わる]い行[おこな]いからも離[はな]れ返[かえ]る。主[しゅ]の前[まえ]に罪[つみ]を犯[おか]した父[ちち]たちの道[みち]を思[おも]い出[だ]すからである。"
  34: "わたしは彼らを、彼らの父[ちち]たちに、すなわちアブラハム、イサク、ヤコブに誓[ちか]った地[ち]へ帰[かえ]す。彼らはその地を支配[しはい]し、わたしは彼らを多[おお]くし、少[すく]なくしない。"
  35: "わたしは彼らと永遠[えいえん]の契約[けいやく]を立[た]てる。わたしは彼らの神[かみ]となり、彼らはわたしの民[たみ]となる。わたしは、わたしの民[たみ]イスラエルを、与[あた]えた地[ち]からもう移[うつ]さない。』」"

notes:
  1: "ἔστησεν κύριος τὸν λόγον αὐτοῦ — «поставил Господь слово Своё» (ἵστημι — ставить, исполнять); ὃν ἐλάλησεν ἐφ᾽ ἡμᾶς — «которое сказал на нас»; ἐπὶ τοὺς δικαστὰς ἡμῶν τοὺς δικάσαντας τὸν Ισραηλ — «на судей наших, судивших Израиля» (δικάζω — судить); ἐπὶ τοὺς βασιλεῖς … ἄρχοντας … ἄνθρωπον Ισραηλ καὶ Ιουδα — «на царей, князей и человека Израилева и Иудина» (слав. «на всякаго человека израилева и иудина»)."
  2: "οὐκ ἐποιήθη ὑποκάτω παντὸς τοῦ οὐρανοῦ καθὰ ἐποίησεν ἐν Ιερουσαλημ — «не было сделано под всем небом так, как сделал в Иерусалиме»; слав. дополняет «навести на ны зло велие» (навёл на нас великое зло) — в LXX этого нет, внесено в текст (大きな災い), отмечено; κατὰ τὰ γεγραμμένα ἐν τῷ νόμῳ Μωυσῆ — «по написанному в законе Моисея»."
  3: "τοῦ φαγεῖν ἡμᾶς — «чтобы нам есть» (инфинитив цели/следствия); ἄνθρωπον σάρκας υἱοῦ αὐτοῦ καὶ ἄνθρωπον σάρκας θυγατρὸς αὐτοῦ — «человеку плоть сына своего и человеку плоть дочери своей» (ἄνθρωπον — «человек»; слав. «плоть человеческу»); исполнилось в осаде Иерусалима (Плач 4:10)."
  4: "ἔδωκεν αὐτοὺς ὑποχειρίους πάσαις ταῖς βασιλείαις — «отдал их под руки (в подчинение) всем царствам» (ὑποχείριος — подручный); εἰς ὀνειδισμὸν καὶ εἰς ἄβατον — «в поношение и в непроходимость» (ἄβατος — 荒れ地, куда нет прохода); ἐν πᾶσι τοῖς λαοῖς τοῖς κύκλῳ, οὗ διέσπειρεν αὐτοὺς κύριος ἐκεῖ — «у всех народов вокруг, куда рассеял их Господь»."
  5: "ἐγενήθησαν ὑποκάτω καὶ οὐκ ἐπάνω — «стали внизу, а не наверху» (в LXX 3-е лицо мн. ч.; слав. «быхом во исподи» — 1-е лицо мн. ч., в тексте по csl 「私たち」, различие отмечено); ὅτι ἡμάρτομεν κυρίῳ θεῷ ἡμῶν — «ибо мы согрешили Господу Богу нашему»; πρὸς τὸ μὴ ἀκούειν τῆς φωνῆς αὐτοῦ — «так что не слушали гласа Его»."
  6: "τῷ κυρίῳ θεῷ ἡμῶν ἡ δικαιοσύνη — «Господу Богу нашему правда» (повтор формулы 1:15); ἡμῖν δὲ καὶ τοῖς πατράσιν ἡμῶν ἡ αἰσχύνη τῶν προσώπων — «нам же и отцам нашим стыд лиц» (добавлены «отцы»); ὡς ἡ ἡμέρα αὕτη — «как день сей»."
  7: "ἃ ἐλάλησεν κύριος ἐφ᾽ ἡμᾶς — «что изрёк Господь на нас»; πάντα τὰ κακὰ ταῦτα ἦλθεν ἐφ᾽ ἡμᾶς — «все эти бедствия пришли на нас» (ἦλθεν — аорист ед. ч. при подлежащем мн. ч.; слав. «приидоша»)."
  8: "οὐκ ἐδεήθημεν τοῦ προσώπου κυρίου — «мы не умоляли лица Господня» (δέομαι — умолять; 御顔に願い求めなかった); τοῦ ἀποστρέψαι ἕκαστον ἀπὸ τῶν νοημάτων τῆς καρδίας αὐτῶν τῆς πονηρᾶς — «чтобы отвратить каждого от помышлений злого сердца его» (νόημα — 思い)."
  9: "ἐγρηγόρησεν κύριος ἐπὶ τοῖς κακοῖς — «бодрствовал Господь над бедствиями» (γρηγορέω — бодрствовать; слав. «убудися» — проснулся); ἐπήγαγε κύριος ἐφ᾽ ἡμᾶς — «навёл Господь на нас» (ἐπάγω); ὅτι δίκαιος ὁ κύριος ἐπὶ πάντα τὰ ἔργα αὐτοῦ — «ибо праведен Господь во всех делах Своих»; ἃ ἐνετείλατο ἡμῖν — «которые заповедал нам»."
  10: "οὐκ ἠκούσαμεν τῆς φωνῆς αὐτοῦ — «не послушали гласа Его»; πορεύεσθαι τοῖς προστάγμασιν κυρίου — «ходить в повелениях Господних»; οἷς ἔδωκεν κατὰ πρόσωπον ἡμῶν — «которые дал пред лицом нашим». Стих повторяет 1:18; в греч. текст заканчивается разделительным тире."
  11: "καὶ νῦν, κύριε ὁ θεὸς Ισραηλ — «и ныне, Господи, Боже Израилев» (начало молитвы 11–14); ὃς ἐξήγαγες τὸν λαόν σου ἐκ γῆς Αἰγύπτου — «изведший народ Твой из земли Египетской»; ἐν χειρὶ κραταιᾷ καὶ ἐν σημείοις καὶ ἐν τέρασιν καὶ ἐν δυνάμει μεγάλῃ καὶ ἐν βραχίονι ὑψηλῷ — «рукою крепкою, знамениями, чудесами, силою великою и мышцею высокою» (κραταιός — крепкий; τέρας — чудо, 不思議); ἐποίησας σεαυτῷ ὄνομα — «сотворил Себе имя»."
  12: "ἡμάρτομεν ἠσεβήσαμεν ἠδικήσαμεν — «согрешили, нечествовали, неправдовали» (три глагола без союзов; слав. так же; 罪を犯し、不敬を行い、不正を行った); ἐπὶ πᾶσιν τοῖς δικαιώμασίν σου — «против всех оправданий (уставов) Твоих» (δικαίωμα — 定め)."
  13: "ἀποστραφήτω ὁ θυμός σου ἀφ᾽ ἡμῶν — «да отвратится ярость Твоя от нас» (императив 3-го лица); ὅτι κατελείφθημεν ὀλίγοι — «ибо осталось нас мало» (καταλείπω); ἐν τοῖς ἔθνεσιν, οὗ διέσπειρας ἡμᾶς ἐκεῖ — «среди народов, куда Ты рассеял нас»."
  14: "εἰσάκουσον, κύριε, τῆς προσευχῆς ἡμῶν καὶ τῆς δεήσεως ἡμῶν — «услышь, Господи, молитву нашу и прошение наше» (προσευχή — 祈り, δέησις — 願い); ἐξελοῦ ἡμᾶς ἕνεκεν σοῦ — «избавь нас ради Тебя» (ἐξαιρέω); δὸς ἡμῖν χάριν κατὰ πρόσωπον τῶν ἀποικισάντων ἡμᾶς — «дай нам милость пред лицом переселивших нас» (ἀποικίζω — 移す)."
  15: "ἵνα γνῷ πᾶσα ἡ γῆ — «чтобы познала вся земля»; ὅτι σὺ κύριος ὁ θεὸς ἡμῶν — «что Ты Господь Бог наш»; ὅτι τὸ ὄνομά σου ἐπεκλήθη ἐπὶ Ισραηλ καὶ ἐπὶ τὸ γένος αὐτοῦ — «ибо имя Твоё наречено на Израиле и на роде его» (ἐπικαλέω — нарекать; γένος — 子孫)."
  16: "κάτιδε ἐκ τοῦ οἴκου τοῦ ἁγίου σου — «призри из дома святого Твоего» (καθοράω — смотреть сверху); ἐννόησον εἰς ἡμᾶς — «вникни (обрати внимание) в нас»; κλῖνον, κύριε, τὸ οὖς σου καὶ ἄκουσον — «приклони, Господи, ухо Твоё и услышь» (κλίνω)."
  17: "ἄνοιξον, κύριε, τοὺς ὀφθαλμούς σου καὶ ἰδέ — «открой, Господи, очи Твои и увидь»; ὅτι οὐχ οἱ τεθνηκότες ἐν τῷ ᾅδῃ — «ибо не умершие в аде» (ᾅδης — 陰府); ὧν ἐλήμφθη τὸ πνεῦμα αὐτῶν ἀπὸ τῶν σπλάγχνων αὐτῶν — «у которых взят дух их из внутренностей их» (σπλάγχνα — 内); δώσουσιν δόξαν καὶ δικαίωμα τῷ κυρίῳ — «воздадут славу и оправдание Господу» (δικαίωμα — «оправдание», слав. так же; ru «хвалу»; передано 義の誉れ)."
  18: "ἀλλὰ ἡ ψυχὴ ἡ λυπουμένη ἐπὶ τὸ μέγεθος — «но душа скорбящая о величии [бедствия]» (λύπη — печаль); ὃ βαδίζει κύπτον καὶ ἀσθενοῦν — «которая ходит поникшая и немощная» (κύπτω — сгибаться; ἀσθενέω); οἱ ὀφθαλμοὶ οἱ ἐκλείποντες — «очи изнемогающие (потусклые)» (ἐκλείπω); ἡ ψυχὴ ἡ πεινῶσα — «душа голодающая»; δώσουσίν σοι δόξαν καὶ δικαιοσύνην — «воздадут Тебе славу и правду»."
  19: "οὐκ ἐπὶ τὰ δικαιώματα τῶν πατέρων ἡμῶν καὶ τῶν βασιλέων ἡμῶν — «не на оправдания (заслуги) отцов наших и царей наших»; καταβάλλομεν τὸν ἔλεον ἡμῶν κατὰ πρόσωπόν σου — «мы повергаем моление наше пред лицом Твоим» (καταβάλλω — повергать; ἔλεος здесь «моление о милости»); слав. «(изливаем молитвы)» — редакционная вставка в скобках, не переводилась."
  20: "ἐνῆκας τὸν θυμόν σου καὶ τὴν ὀργήν σου εἰς ἡμᾶς — «Ты вложил (послал) ярость Твою и гнев Твой в нас» (ἐνίημι); καθάπερ ἐλάλησας ἐν χειρὶ τῶν παίδων σου τῶν προφητῶν λέγων — «как Ты говорил рукою рабов Твоих, пророков, говоря»: формула вне кавычек, далее 『…』."
  21: "Слова Господа через пророков — 『…』 (2:21–23) внутри молитвы 「…」; Οὕτως εἶπεν κύριος — «так говорит Господь» (формула внутри цитаты); Κλῖνατε τὸν ὦμον ὑμῶν — «склоните плечо ваше» (ὦμος — 肩); ἐργάσασθε τῷ βασιλεῖ Βαβυλῶνος — «работайте (служите) царю Вавилонскому» (ἐργάζομαι); καθίσατε ἐπὶ τὴν γῆν, ἣν ἔδωκα τοῖς πατράσιν ὑμῶν — «сидите на земле, которую Я дал отцам вашим»."
  22: "ἐὰν μὴ ἀκούσητε τῆς φωνῆς κυρίου — «если не послушаете гласа Господня»; ἐργάσασθαι τῷ βασιλεῖ Βαβυλῶνος — «чтобы служить царю Вавилонскому»: в слав. конец стиха иной («оскудение сотворю из градов иудиных…»), эта часть по LXX стоит в 2:23; деление наше по gr."
  23: "ἐκλείψειν ποιήσω ἐκ πόλεων Ιουδα καὶ ἔξωθεν Ιερουσαλημ — «сделаю, что исчезнет из городов Иуды и вне Иерусалима» (ἐκλείπω — исчезать); φωνὴν εὐφροσύνης καὶ φωνὴν χαρμοσύνης, φωνὴν νυμφίου καὶ φωνὴν νύμφης — «голос веселия и голос радости, голос жениха и голос невесты» (νυμφίος, νύμφη); ἔσται πᾶσα ἡ γῆ εἰς ἄβατον ἀπὸ ἐνοικούντων — «вся земля будет непроходима (пуста) от жителей». Здесь 『…』 закрывается; слав. «(от вас)» — редакционная вставка, не переводилась."
  24: "οὐκ ἠκούσαμεν τῆς φωνῆς σου — «мы не послушали гласа Твоего»; ἔστησας τοὺς λόγους σου — «Ты поставил (исполнил) слова Твои»; ἐν χερσὶν τῶν παίδων σου τῶν προφητῶν — «руками рабов Твоих, пророков»; τοῦ ἐξενεχθῆναι τὰ ὀστᾶ βασιλέων ἡμῶν καὶ τὰ ὀστᾶ τῶν πατέρων ἡμῶν ἐκ τοῦ τόπου αὐτῶν — «чтобы вынесены были кости царей наших и кости отцов наших из места их» (ὀστέον — 骨)."
  25: "ἰδού ἐστιν ἐξερριμμένα τῷ καύματι τῆς ἡμέρας καὶ τῷ παγετῷ τῆς νυκτός — «вот, они выброшены на дневной зной и ночной мороз» (καῦμα — зной, παγετός — мороз, 霜); ἀπεθάνοσαν ἐν πόνοις πονηροῖς — «умерли в злых муках»; ἐν λιμῷ καὶ ἐν ῥομφαίᾳ καὶ ἐν ἀποστολῇ — «от голода, меча и изгнания» (ἀποστολή — «отправление, изгнание», тёмное место; слав. «затчением», ru «изгнания»; передано 追放)."
  26: "ἔθηκας τὸν οἶκον, οὗ ἐπεκλήθη τὸ ὄνομά σου ἐπ᾽ αὐτῷ — «Ты поставил (оставил) дом, на котором наречено имя Твоё» (τίθημι); ὡς ἡ ἡμέρα αὕτη — «как день сей»; διὰ πονηρίαν οἴκου Ισραηλ καὶ οἴκου Ιουδα — «за злобу дома Израилева и дома Иудина» (πονηρία)."
  27: "ἐποίησας εἰς ἡμᾶς — «Ты поступил с нами»; κατὰ πᾶσαν ἐπιείκειάν σου — «по всему снисхождению Твоему» (ἐπιείκεια — кротость, снисхождение, 寛容); κατὰ πάντα οἰκτιρμόν σου τὸν μέγαν — «по всему великому милосердию Твоему» (οἰκτιρμός — 憐れみ)."
  28: "καθὰ ἐλάλησας ἐν χειρὶ παιδός σου Μωυσῆ — «как Ты сказал рукою раба Твоего Моисея»; ἐν ἡμέρᾳ ἐντειλαμένου σου αὐτῷ γράψαι τὸν νόμον σου ἐναντίον υἱῶν Ισραηλ — «в день, когда Ты повелел ему написать закон Твой пред сынами Израиля» (ἐντέλλομαι); λέγων — «говоря»: формула вне кавычек, далее 『…』 (2:29–35)."
  29: "Ἐὰν μὴ ἀκούσητε τῆς φωνῆς μου — «если не послушаете гласа Моего»; ἦ μήν — клятвенное усиление «истинно»; ἡ βόμβησις ἡ μεγάλη ἡ πολλὴ αὕτη — «это великое и многое гудение (множество)» (βόμβησις — гул, шум; слав. «множество сие великое и многое»; передано 大きな多くの群れ); ἀποστρέψει εἰς μικράν — «обратится в малую [величину]»; ἐν τοῖς ἔθνεσιν, οὗ διασπερῶ αὐτοὺς ἐκεῖ — «среди народов, куда Я рассею их»."
  30: "ἔγνων ὅτι οὐ μὴ ἀκούσωσίν μου — «Я знаю, что они не послушают Меня» (двойное отрицание οὐ μή); λαὸς σκληροτράχηλός ἐστιν — «народ жестоковыйный» (σκληροτράχηλος — かたくなな民); ἐπιστρέψουσιν ἐπὶ καρδίαν αὐτῶν — «обратятся к сердцу своему»; ἐν γῇ ἀποικισμοῦ αὐτῶν — «в земле переселения их»."
  31: "γνώσονται ὅτι ἐγὼ κύριος ὁ θεὸς αὐτῶν — «познают, что Я Господь Бог их»; δώσω αὐτοῖς καρδίαν καὶ ὦτα ἀκούοντα — «дам им сердце и уши слышащие» (слав. в скобках «(и уразумеют)» — редакционная вставка, не переводилась)."
  32: "αἰνέσουσίν με ἐν γῇ ἀποικισμοῦ αὐτῶν — «прославят Меня в земле переселения их» (αἰνέω — ほめたたえる); μνησθήσονται τοῦ ὀνόματός μου — «вспомнят имя Моё»."
  33: "ἀποστρέψουσιν ἀπὸ τοῦ νώτου αὐτῶν τοῦ σκληροῦ — «отвратятся от хребта своего жестокого» (νῶτος — спина, хребет; образ упорства, 頑固な背); ἀπὸ πονηρῶν πραγμάτων αὐτῶν — «от злых дел своих» (πρᾶγμα); ὅτι μνησθήσονται τῆς ὁδοῦ πατέρων αὐτῶν τῶν ἁμαρτόντων ἔναντι κυρίου — «ибо вспомнят путь отцов своих, согрешивших пред Господом»."
  34: "ἀποστρέψω αὐτοὺς εἰς τὴν γῆν, ἣν ὤμοσα τοῖς πατράσιν αὐτῶν — «возвращу их в землю, которую Я клялся отцам их» (ὄμνυμι); τῷ Αβρααμ καὶ τῷ Ισαακ καὶ τῷ Ιακωβ — «Аврааму, Исааку и Иакову» (アブラハム, イサク, ヤコブ — формы корпуса); κυριεύσουσιν αὐτῆς — «будут владеть ею» (κυριεύω); πληθυνῶ αὐτούς, καὶ οὐ μὴ σμικρυνθῶσιν — «умножу их, и не умалятся» (σμικρύνω)."
  35: "στήσω αὐτοῖς διαθήκην αἰώνιον — «поставлю им завет вечный» (διαθήκη — 契約); τοῦ εἶναί με αὐτοῖς εἰς θεὸν καὶ αὐτοὺς ἔσονταί μοι εἰς λαόν — «чтобы Мне быть им Богом, а им быть Мне народом» (формула завета); οὐ κινήσω ἔτι τὸν λαόν μου Ισραηλ ἀπὸ τῆς γῆς, ἧς ἔδωκα αὐτοῖς — «не подвигну более народ Мой Израиль с земли, которую дал им» (κινέω). Здесь закрываются 『…』 слов Моисея и 「…» исповедания; 」 в конце стиха — для парности главы, в 3:1 молитва открывается снова."
