# jp-box, Варух, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для книги есть только в 3:36–4:4; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Нумерация по gr: 35 стихов; совпадает со слав. и Синодальным, точек-лакун нет.
# Глава 2 — продолжение молитвы-исповедания (1:15–3:8): 1–5 Господь исполнил слово
# Своё — голод и людоедство в осаде, подчинение окрестным царствам, «мы внизу, а не
# наверху»; 6–10 повтор исповедания («Господу правда, нам стыд»), не послушали гласа
# и не ходили в повелениях; 11–14 молитва о милости («услышь, Господи, молитву нашу»,
# избавь ради Себя, дай милость пред переселившими); 15–19 прошение о знамении для
# всей земли, «призри из дома святого», «открой очи Твои»: не мёртвые в аде, но
# скорбящая душа, потусклые очи и голодная душа воздадут славу; 20–23 слова Господа
# через пророков; 24–35 продолжение молитвы: кости царей вынесены, Господь поступил
# по снисхождению, слова через Моисея — рассеяние, обращение, вечный завет.
# Голоса и кавычки: 2:1–35 — одно 「…» (продолжение исповедания, начатого в 1:15);
# внутри молитвы два вложенных слова Господа в 『…』: 2:21–23 (через пророков,
# с формулой Οὕτως εἶπεν κύριος внутри) и 2:29–35 (через Моисея). Формулы «как Ты
# говорил рукою рабов Твоих, пророков, говоря» (2:20) и «…рукою раба Твоего Моисея…
# говоря» (2:28) — вне кавычек. В конце 2:35 стоят 』」: слово Господа и молитва
# закрываются, в 3:1 молитва открывается снова.
# 〔…〕 нет: все 35 стихов и все слова есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 陰府, 燔祭, 骨, 契約, 定め уже в корпусе.
# Имена: ネブカドネツァル, バビロン, カルデア人, エルサレム, イスラエル, ユダ, モーセ,
# アブラハム, イサク, ヤコブ — по корпусу.

