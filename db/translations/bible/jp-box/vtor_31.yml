# jp-box, Второзаконие, глава 31. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в гл. 31 отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 31: последние повеления Моисея (1–6), назначение Иисуса (7–8), книга закона у священников
# (9), чтение закона в год отпущения (10–13), явление Господа в облаке и предсказание отступничества
# (14–21), песнь как свидетельство (19–22), повеление Иисусу (23), книга рядом с ковчегом (24–27),
# собрание старейшин и свидетельство неба и земли (28–29).
# НУМЕРАЦИЯ: в gr-lxx-byz глава 31 имеет 29 стихов; в csl-ru — 30. csl 31:30 («И глагола
# моисей во ушеса всего сонма…») в gr стоит в начале 32:1; gr 31:23 («И заповедал Моисей
# Иисусу…») в csl соединён с 31:22. Держимся gr.
# Кавычки: 31:1, 9, 14a, 15, 22, 24–25 — повествование; речь Моисея — 2–6, 7–8, 10b–13, 23,
# 26–29; речь Господа — 14, 16–21, вложенные слова народа в 17 — 『…』. Красного нет.
# 〔…〕 нет: в gr-lxx-byz все стихи полные (проверено по выгрузке); в csl 21 добавлено
# «и будет егда постигнут их многа зла и скорби» (из ст. 17) — в текст не внесено, см. notes.
# Отличия LXX: 31:15 — Господь сходит «в облаке» (ἐν νεφέλῃ), а не «в столпе»; 31:22 — Моисей
# пишет песнь, а в 31:23 заповедует Иисусу сам Моисей (в ru — Господь). jp-ni не использовался.

