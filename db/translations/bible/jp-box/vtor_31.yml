verses:
  1: "モーセはこれらのすべての言葉[ことば]を、イスラエルのすべての子[こ]らに語[かた]り終[お]えた。"
  2: "そして彼[かれ]らに言[い]った。「わたしは今日[きょう]で百二十歳[ひゃくにじゅっさい]になる。もはや出[で]て行[い]くことも、入[はい]って来[く]ることもできない。主[しゅ]はわたしに『あなたはこのヨルダン川[がわ]を渡[わた]らない』と言われた。"
  3: "あなたの神[かみ]であられる主[しゅ]は、あなたの前[まえ]を先立[さきだ]って行[い]き、あなたの前からこれらの民[たみ]を滅[ほろ]ぼし尽[つ]くされ、あなたは彼[かれ]らの地[ち]を嗣業[しぎょう]として受[う]け継[つ]ぐ。ヨシュアもあなたの前を先立って行く。主が語[かた]られたとおりである。"
  4: "主[しゅ]は、ヨルダン川[がわ]の向[む]こうにいたアモリ人[じん]の二人[ふたり]の王[おう]、シホンとオグ、およびその地[ち]にされたように、彼[かれ]らにもそうされる。主は彼らを滅[ほろ]ぼし尽[つ]くされたからである。"
  5: "主[しゅ]は彼[かれ]らをあなたがたの手[て]に渡[わた]された。あなたがたはわたしが命[めい]じたとおりに、彼らに行[おこな]いなさい。"
  6: "強[つよ]くあれ、雄々[おし]しくあれ。彼[かれ]らを恐[おそ]れてはならない。おののいてはならない。あなたの神[かみ]であられる主[しゅ]は、あなたがたのただ中[なか]であなたとともに歩[あゆ]み、あなたを離[はな]れず、あなたを見捨[みす]てられないからである。」"
  7: "モーセはヨシュアを呼[よ]び、すべてのイスラエルの前[まえ]で彼[かれ]に言[い]った。「強[つよ]くあれ、雄々[おし]しくあれ。あなたはこの民[たみ]に先立[さきだ]って、主[しゅ]が彼らの父祖[ふそ]たちに誓[ちか]って彼らに与[あた]えようと言われた地[ち]へ入[はい]り、あなたが彼らにそれを嗣業[しぎょう]として分[わ]け与えるからである。"
  8: "主[しゅ]はあなたとともに歩[あゆ]み、あなたを離[はな]れず、あなたを見捨[みす]てられない。恐[おそ]れてはならない。おののいてはならない。」"
  9: "モーセはこの律法[りっぽう]の言葉[ことば]を書[しょ]に書[か]き、それを、主[しゅ]の契約[けいやく]の箱[はこ]を担[かつ]ぐレビ人[びと]である祭司[さいし]たちと、イスラエルの子[こ]らの長老[ちょうろう]たちに渡[わた]した。"
  10: "モーセはその日[ひ]、彼[かれ]らに命[めい]じて言[い]った。「七[なな]年[ねん]が過[す]ぎるごとに、負債[ふさい]の免除[めんじょ]の年[とし]の定[さだ]めの時[とき]、仮庵[かりいお]の祭[まつ]りに、"
  11: "すべてのイスラエルが、主[しゅ]が選[えら]ばれる場所[ばしょ]に、あなたの神[かみ]であられる主の前[まえ]に出[で]て来[き]るとき、あなたはこの律法[りっぽう]を、すべてのイスラエルの前で、彼[かれ]らの耳[みみ]に読[よ]み聞[き]かせなさい。"
  12: "民[たみ]を集[あつ]めなさい。男[おとこ]も女[おんな]も子[こ]どもも、あなたがたの町[まち]にいる寄留者[きりゅうしゃ]も。彼[かれ]らが聞[き]いて、あなたがたの神[かみ]であられる主[しゅ]を恐[おそ]れることを学[まな]び、この律法[りっぽう]のすべての言葉[ことば]を守[まも]って行[おこな]うために。"
  13: "また、知[し]らない彼[かれ]らの子[こ]らも聞[き]いて、あなたがたがヨルダン川[がわ]を渡[わた]って入[はい]り、嗣業[しぎょう]として受[う]け継[つ]ごうとしている地[ち]に住[す]むすべての日[ひ]の間[あいだ]、あなたがたの神[かみ]であられる主[しゅ]を恐[おそ]れることを学[まな]ぶであろう。」"
  14: "主[しゅ]はモーセに言[い]われた。「見[み]よ、あなたの死[し]の日[ひ]が近[ちか]づいた。ヨシュアを呼[よ]び、あなたがたは証[あかし]の幕屋[まくや]の戸口[とぐち]に立[た]ちなさい。わたしは彼[かれ]に命[めい]じる。」モーセとヨシュアは証の幕屋へ行[い]き、幕屋の戸口に立った。"
  15: "主[しゅ]は雲[くも]の中[なか]で降[お]り、幕屋[まくや]の戸口[とぐち]に立[た]たれた。雲の柱[はしら]が幕屋の戸口に立った。"
  16: "主[しゅ]はモーセに言[い]われた。「見[み]よ、あなたは父祖[ふそ]たちとともに眠[ねむ]る。この民[たみ]は起[お]き上[あ]がって、彼[かれ]らが入[はい]って行[い]くあの地[ち]の異[い]なる神々[かみがみ]を慕[した]って淫[いん]を働[はたら]き、わたしを捨[す]てて、わたしが彼らと結[むす]んだ契約[けいやく]を破[やぶ]るであろう。"
  17: "その日[ひ]、わたしの怒[いか]りは彼[かれ]らに対して燃[も]え上[あ]がり、わたしは彼らを捨[す]て、わたしの顔[かお]を彼らから隠[かく]す。彼らは食[く]い尽[つ]くされ、多[おお]くの災[わざわ]いと苦悩[くのう]が彼らに降[ふ]りかかる。その日、彼は『わたしの内[うち]にわたしの神[かみ]である主[しゅ]がおられないから、これらの災いがわたしに降りかかったのだ』と言[い]うであろう。"
  18: "わたしはその日[ひ]、彼[かれ]らが行[おこな]ったすべての悪[あく]のゆえに、彼らから顔[かお]を背[そむ]けて隠[かく]す。彼らが他[ほか]の神々[かみがみ]に目[め]を向[む]けたからである。」"
  19: "今[いま]、あなたがたはこの歌[うた]の言葉[ことば]を書[か]き、イスラエルの子[こ]らに教[おし]え、それを彼[かれ]らの口[くち]に入[い]れなさい。この歌がイスラエルの子らに対するわたしの証[あかし]となるためである。"
  20: "わたしは彼[かれ]らを、彼らの父祖[ふそ]たちに誓[ちか]った良[よ]い地[ち]、乳[ちち]と蜜[みつ]の流[なが]れる地へ連[つ]れて行[い]く。彼らは食[た]べて満[み]ち足[た]り、肥[こ]え太[ふと]る。そして他[ほか]の神々[かみがみ]に目[め]を向[む]けてそれらに仕[つか]え、わたしを怒[いか]らせ、わたしの契約[けいやく]を破[やぶ]るであろう。"
  21: "彼[かれ]らに多[おお]くの災[わざわ]いと苦悩[くのう]が降[ふ]りかかるとき、この歌[うた]は彼らの面前[めんぜん]に立[た]って証[あかし]をする。彼らの口[くち]からも、その子孫[ししそん]の口からも、忘[わす]れられることはないからである。わたしは彼らの悪[あく]、すなわち、わたしが彼らを、父祖[ふそ]たちに誓[ちか]った良[よ]い地[ち]へ連[つ]れて行[い]く前[まえ]に、彼らが今日[きょう]ここで行[おこな]っているすべてのことを知[し]っている。"
  22: "モーセはその日[ひ]、この歌[うた]を書[か]き、イスラエルの子[こ]らに教[おし]えた。"
  23: "そしてモーセはヨシュアに命[めい]じて言[い]った。「強[つよ]くあれ、雄々[おし]しくあれ。あなたはイスラエルの子[こ]らを、主[しゅ]が彼[かれ]らに誓[ちか]われた地[ち]へ導[みちび]き入[い]れるからである。主はあなたとともにいる。」"
  24: "モーセがこの律法[りっぽう]のすべての言葉[ことば]を書[しょ]に、最後[さいご]まで書[か]き終[お]えたとき、"
  25: "モーセは、主[しゅ]の契約[けいやく]の箱[はこ]を担[かつ]ぐレビ人[びと]たちに命[めい]じて言[い]った。"
  26: "「この律法[りっぽう]の書[しょ]を取[と]って、あなたがたの神[かみ]である主[しゅ]の契約[けいやく]の箱[はこ]のそばに置[お]きなさい。そこであなたに対する証[あかし]となるであろう。"
  27: "わたしはあなたの反抗[はんこう]と、あなたのかたくなさを知[し]っているからである。見[み]よ、今日[きょう]わたしがあなたがたとともに生[い]きている間[あいだ]でさえ、あなたがたは神[かみ]を怒[いか]らせ続[つづ]けた。わたしの死[し]の後[あと]は、なおさらではないか。"
  28: "わたしのもとに、あなたがたの部族[ぶぞく]の長[ちょう]、あなたがたの長老[ちょうろう]、あなたがたの裁[さば]き人[びと]、あなたがたの監督[かんとく]たちを集[あつ]めなさい。わたしは彼[かれ]らの耳[みみ]にこれらのすべての言葉[ことば]を語[かた]り、天[てん]と地[ち]を彼らに対する証人[しょうにん]として呼[よ]ぼう。"
  29: "わたしは知[し]っている。わたしの死[し]の後[あと]、あなたがたは必[かなら]ず堕落[だらく]して悪[あく]を行[おこな]い、わたしが命[めい]じた道[みち]からそれる。終[お]わりの日[ひ]には、あなたがたが主[しゅ]の目[め]に悪を行い、その手[て]の業[わざ]をもって主を怒[いか]らせるので、災[わざわ]いがあなたがたに降[ふ]りかかるであろう。」"

notes:
  1: "συνετέλεσεν Μωϋσῆς λαλῶν — окончил Моисей говорить (συντελέω + причастие). В ru «пошёл Моисей» — по масоретскому тексту; в gr глагола «пошёл» нет."
  2: "ἑκατὸν καὶ εἴκοσι ἐτῶν εἰμι σήμερον — сегодня мне сто двадцать лет (ἐτῶν — родительный возраста). εἰσπορεύεσθαι καὶ ἐκπορεύεσθαι — входить и выходить, т. е. быть деятельным. Οὐ διαβήσῃ τὸν Ιορδάνην — не перейдёшь Иордан; слова Господа — 『…』."
  3: "ὁ προπορευόμενος πρὸ προσώπου σου — идущий пред лицом твоим. ἐξολεθρεύσει — истребит. κατακληρονομήσεις — наследуешь. καθὰ ἐλάλησεν κύριος — как сказал Господь."
  4: "Σηων καὶ Ωγ, τοῖς δυσὶ βασιλεῦσιν τῶν Αμορραίων — Сигон и Ог, два царя Аморрейские. οἳ ἦσαν πέραν τοῦ Ιορδάνου — которые были за Иорданом. ἐξωλέθρευσεν — истребил."
  5: "παρέδωκεν — предал (аорист, пророческое прошедшее, как в слав.). ποιήσετε αὐτοῖς καθότι ἐνετειλάμην — сделаете им, как я заповедал."
  6: "ἀνδρίζου καὶ ἴσχυε — мужайся и укрепляйся (императивы). μὴ φοβοῦ μηδὲ δειλίᾳ μηδὲ πτοηθῇς — не бойся, не малодушествуй, не страшись (δειλία — «робость»). ὁ προπορευόμενος μεθ᾽ ὑμῶν ἐν ὑμῖν — идущий с вами, среди вас (смешение чисел). οὐ μή σε ἀνῇ οὔτε μή σε ἐγκαταλίπῃ — не оставит тебя и не покинет."
  7: "ἔναντι παντὸς Ισραηλ — пред всем Израилем. ἀνδρίζου καὶ ἴσχυε — мужайся и укрепляйся. εἰσελεύσῃ πρὸ προσώπου τοῦ λαοῦ — войдёшь пред лицом народа. ὤμοσεν … δοῦναι αὐτοῖς — клялся дать им. κατακληρονομήσεις αὐτὴν αὐτοῖς — разделишь её им в наследие."
  8: "συμπορευόμενος μετὰ σοῦ — идущий с тобою. οὐκ ἀνήσει σε οὐδὲ μὴ ἐγκαταλίπῃ — не оставит и не покинет. μὴ φοβοῦ μηδὲ δειλίᾳ — не бойся и не малодушествуй."
  9: "ἔγραψεν … εἰς βιβλίον — написал в книгу. τοῖς ἱερεῦσιν τοῖς υἱοῖς Λευι — священникам, сынам Левииным. τοῖς αἴρουσιν τὴν κιβωτὸν τῆς διαθήκης — носящим ковчег завета. πρεσβύτεροι — старейшины."
  10: "Μετὰ ἑπτὰ ἔτη — через семь лет, семилетие. ἐν καιρῷ ἐνιαυτοῦ ἀφέσεως — во время года отпущения (ἄφεσις — прощение долгов, ср. 15:1–3). ἐν ἑορτῇ σκηνοπηγίας — в праздник кущей (仮庵の祭り). Стих переходит в 11."
  11: "ἐν τῷ συμπορεύεσθαι πάντα Ισραηλ — когда сходится весь Израиль. ὀφθῆναι ἐνώπιον κυρίου — явиться пред Господом. ἐν τῷ τόπῳ ᾧ ἂν ἐκλέξηται — на месте, которое изберёт. ἀναγνώσεσθε — читайте (мн. ч.). εἰς τὰ ὦτα αὐτῶν — в уши их."
  12: "ἐκκλησιάσας τὸν λαόν — созвав народ (аорист-причастие в значении императива). ἄνδρες, γυναῖκες, ἔκγονα — мужи, жёны, дети. προσήλυτος ἐν ταῖς πόλεσιν — пришелец в городах. ἵνα ἀκούσωσιν καὶ μάθωσιν — чтобы услышали и научились. φοβεῖσθαι — бояться."
  13: "οἱ υἱοὶ αὐτῶν, οἳ οὐκ οἴδασιν — сыны их, которые не знают. ἀκούσονται καὶ μαθήσονται — услышат и научатся. πάσας τὰς ἡμέρας ὅσας ζῶσιν — во все дни, сколько живут. διαβαίνετε τὸν Ιορδάνην — переходите Иордан."
  14: "ἠγγίκασιν αἱ ἡμέραι τοῦ θανάτου σου — приблизились дни смерти твоей. στῆτε παρὰ τὰς θύρας τῆς σκηνῆς τοῦ μαρτυρίου — станьте у дверей скинии свидетельства. ἐντελοῦμαι αὐτῷ — дам ему повеления. Далее повествование."
  15: "κατέβη κύριος ἐν νεφέλῃ — сошёл Господь в облаке (в csl и ru «в столпе облачном»). ὁ στῦλος τῆς νεφέλης — столп облачный. Двойное ἔστη — стал."
  16: "κοιμᾷ μετὰ τῶν πατέρων σου — почиешь с отцами твоими. ἐκπορνεύσει ὀπίσω θεῶν ἀλλοτρίων — будет блудодействовать вслед чужих богов. διασκεδάσουσιν τὴν διαθήκην — разрушат, нарушат завет. ἣν διεθέμην αὐτοῖς — который я поставил им."
  17: "ὀργισθήσομαι θυμῷ — воспылаю гневом. ἀποστρέψω τὸ πρόσωπόν μου — отвращу лицо Моё. ἔσται κατάβρωμα — будет съеден, станет добычей (κατάβρωμα — «снедь»). εὑρήσουσιν αὐτὸν κακά — найдут его беды. Слова народа — 『…』."
  18: "ἀποστροφῇ ἀποστρέψω — «отвращением отвращу» (усиление, игра слов). διὰ πάσας τὰς κακίας — за все злодеяния. ἐπέστρεψαν ἐπὶ θεοὺς ἀλλοτρίους — обратились к иным богам."
  19: "γράψατε … διδάξετε … ἐμβαλεῖτε — напишите, научите, вложите (мн. ч.). τὰ ῥήματα τῆς ᾠδῆς — слова песни. εἰς τὸ στόμα αὐτῶν — в уста их. εἰς μαρτύριον — во свидетельство."
  20: "εἰσάξω … εἰς τὴν γῆν τὴν ἀγαθήν — введу в землю добрую. ῥέουσαν γάλα καὶ μέλι — текущую молоком и мёдом. ἐμπλησθέντες κορήσουσιν — насытившись, утучнеют (κορέω — насыщаться). παροξυνοῦσίν με — раздражат Меня."
  21: "ἀντικαταστήσεται … κατὰ πρόσωπον μαρτυροῦσα — восстанет пред лицом, свидетельствуя. οὐ γὰρ μὴ ἐπιλησθῇ ἀπὸ στόματος — не будет забыта из уст. ἀπὸ στόματος τοῦ σπέρματος — из уст семени их. ὧδε σήμερον — здесь сегодня. В csl в начале стиха добавлено «и будет, когда постигнут их многие беды и скорби» (из 17); в gr этого нет."
  22: "ἔγραψεν Μωϋσῆς τὴν ᾠδὴν ταύτην — написал Моисей песнь сию. ἐδίδαξεν αὐτὴν τοὺς υἱοὺς Ισραηλ — научил ей сынов Израилевых."
  23: "ἐνετείλατο Μωϋσῆς Ἰησοῖ — заповедал Моисей Иисусу (в ru «Господь», по масоретскому тексту). εἰσάξεις τοὺς υἱοὺς Ισραηλ — введёшь сынов Израилевых. ὤμοσεν κύριος αὐτοῖς — клялся им Господь. αὐτὸς ἔσται μετὰ σοῦ — Он будет с тобою."
  24: "ἡνίκα δὲ συνετέλεσεν Μωϋσῆς γράφων — когда Моисей окончил писать. ἕως εἰς τέλος — до конца. Стих переходит в 25."
  25: "ἐνετείλατο τοῖς Λευίταις τοῖς αἴρουσιν τὴν κιβωτόν — заповедал левитам, носящим ковчег. λέγων — говоря; речь начинается в 26."
  26: "λαβόντες τὸ βιβλίον τοῦ νόμου — взяв книгу закона. θήσετε αὐτὸ ἐκ πλαγίων τῆς κιβωτοῦ — положите её сбоку ковчега (ἐκ πλαγίων — «с боков», слав. «от страны»). ἔσται ἐκεῖ ἐν σοὶ εἰς μαρτύριον — будет там в тебе во свидетельство, против тебя."
  27: "ἐπίσταμαι τὸν ἐρεθισμόν σου — знаю раздражение твоё. τράχηλος σκληρός — жёсткая выя, жестоковыйность (かたくなさ). παραπικραίνοντες ἦτε τὰ πρὸς τὸν θεόν — вы огорчали Бога. πῶς οὐχὶ καὶ ἔσχατον τοῦ θανάτου μου — тем более по смерти моей."
  28: "ἐκκλησιάσατε — созовите. φύλαρχοι — начальники племён. πρεσβύτεροι, κριταί, γραμματοεισαγωγεῖς — старейшины, судьи, надзиратели. διαμαρτύρωμαι … τὸν οὐρανὸν καὶ τὴν γῆν — призову в свидетели небо и землю."
  29: "ἔσχατον τῆς τελευτῆς μου — по кончине моей. ἀνομίᾳ ἀνομήσετε — «беззаконием собеззаконнуете» (гебраистический усилительный оборот), передано «непременно развратитесь и будете делать зло». ἐκκλινεῖτε ἐκ τῆς ὁδοῦ — уклонитесь от пути. συναντήσεται ὑμῖν τὰ κακά — встретят вас беды. παροργίσαι αὐτόν — раздражить Его."
