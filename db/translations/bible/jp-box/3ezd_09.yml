verses:
  1: "「時[とき]を測[はか]りつつ、自分[じぶん]のうちで測[はか]れ。そして、あらかじめ告[つ]げられたしるしの一部[いちぶ]が過[す]ぎ去[さ]るのを見[み]たなら、"
  2: "そのとき、あなたは悟[さと]るであろう。それこそ、いと高[たか]き方[かた]が、ご自身[じしん]によって造[つく]られた世[よ]を訪[おとず]れ始[はじ]める時[とき]である、と。"
  3: "また、世[よ]に方々[ほうぼう]の揺[ゆ]らぎと、もろもろの民[たみ]の騒[さわ]ぎが見[み]られるようになると、"
  4: "そのとき、あなたは悟[さと]るであろう。いと高[たか]き方[かた]が、あなたより前[まえ]にあった日[ひ]々[び]の初[はじ]めから、これらのことについて語[かた]っておられたのだ、と。"
  5: "というのは、世[よ]に造[つく]られたすべてのものは初[はじ]めを持[も]つように、終[お]わりも持[も]ち、その終[お]わりは明[あき]らかにされるからである。"
  6: "同[おな]じように、いと高[たか]き方[かた]の時[とき]々[どき]も、その初[はじ]めはしるしと力[ちから]あるわざによって明[あき]らかにされ、その終[お]わりは行[おこな]いとしるしによって現[あらわ]れる。"
  7: "そして、救[すく]われる者[もの]はだれでも、自分[じぶん]の行[おこな]いと、あなたがたが信[しん]じているその信仰[しんこう]とによって、逃[のが]れることができれば、"
  8: "その者[もの]は前[まえ]もって告[つ]げられた災[わざわ]いから残[のこ]り、わたしの地[ち]、わたしの国[くに]の境[さかい]のうちで、わたしの救[すく]いを見[み]る。わたしは世[よ]の初[はじ]めから、わたし自身[じしん]を聖[せい]なるものとしてきたからである。"
  9: "そのとき、今[いま]わたしの道[みち]から離[はな]れた者[もの]たちは悔[く]やみ、わたしの言葉[ことば]を侮[あなど]って捨[す]てた者[もの]たちは苦[くる]しみのうちにとどまる。"
  10: "というのは、わたしを知[し]らずに生[い]きながら恩恵[おんけい]を受[う]けていた者[もの]たち、"
  11: "また、まだ自由[じゆう]を持[も]ち、悔[く]い改[あらた]めの場所[ばしょ]がまだ開[ひら]かれていたとき、わたしの律法[りっぽう]を憎[にく]み、それを悟[さと]らず、かえって蔑[さげす]んだ者[もの]たちは、"
  12: "そのような者[もの]たちは死[し]んだのち、苦[くる]しみのうちでわたしを知[し]るようになる。"
  13: "だから、あなたはこれ以上[いじょう]、不敬虔[ふけいけん]な者[もの]たちがどのように苦[くる]しめられるかを詮索[せんさく]してはならない。むしろ、正[ただ]しい者[もの]たちがどのように救[すく]われるか、世[よ]が彼[かれ]らに属[ぞく]し、彼[かれ]らのために世[よ]があること、それがいつであるかを調[しら]べなさい。」"
  14: "わたしは答[こた]えて言[い]った。"
  15: "「わたしは前[まえ]にも語[かた]り、今[いま]も語[かた]り、後[のち]にも語[かた]るでしょう。滅[ほろ]びる者[もの]の数[かず]は、救[すく]われる者[もの]の数[かず]よりも多[おお]いのです。それはちょうど、波[なみ]がしずくより大[おお]きいようなものです。」"
  16: "彼はわたしに答[こた]えて言[い]った。"
  17: "「畑[はたけ]がどのようであれば種[たね]もそのようであり、花[はな]がどのようであれば色[いろ]もそのようであり、働[はたら]く者[もの]がどのようであればその仕事[しごと]もそのようであり、農[のう]夫[ふ]がどのようであればその耕作[こうさく]もそのようである。その時[とき]は世[よ]の時[とき]であったからである。"
  18: "そして今[いま]、わたしが今[いま]ある者[もの]たちのために、世[よ]がまだ存在[そんざい]しないうちに、彼[かれ]らがその中[なか]に住[す]むべき世[よ]を整[ととの]えていたとき、わたしに逆[さか]らう者[もの]は一人[ひとり]もいなかった。"
  19: "しかし、この世[よ]が整[ととの]えられ、刈[か]り入[い]れが尽[つ]きることなく、律法[りっぽう]が窮[きわ]めがたい今[いま]、造[つく]られた者[もの]たちの習[なら]わしは自[みずか]ら腐[くさ]ってしまった。"
  20: "わたしは世[よ]を眺[なが]めると、見[み]よ、その中[なか]に生[しょう]じた思[おも]い込[こ]みのゆえに災[わざわ]いがあった。"
  21: "わたしは見[み]て、これを大[おお]いに赦[ゆる]し、ぶどうの房[ふさ]から一[ひと]粒[つぶ]の実[み]を、多[おお]きな部族[ぶぞく]から一[ひと]本[ぽん]の苗[なえ]を、わたしのために取[と]っておいた。"
  22: "だから、むなしく生[う]まれた多[おお]くの者[もの]は滅[ほろ]び、わたしの実[み]と、わたしが大[おお]きな労苦[ろうく]によって育[そだ]てたわたしの苗[なえ]は保[たも]たれるように。"
  23: "しかし、あなたはさらに七日[なぬか]を過[す]ごしなさい。ただしその間[あいだ]、断食[だんじき]してはならない。"
  24: "花[はな]の咲[さ]く野[の]へ行[い]き、家[いえ]の建[た]てられていない所[ところ]で、野[の]の花[はな]だけを食[た]べなさい。肉[にく]を味[あじ]わってはならず、ぶどう酒[しゅ]も飲[の]んではならない。ただ花[はな]だけを。"
  25: "いと高[たか]き方[かた]に絶[た]えず祈[いの]りなさい。そうすれば、わたしが来[き]て、あなたと語[かた]ろう。」"
  26: "わたしは彼が言[い]ったとおりに、アルダフと呼[よ]ばれる野[の]へ行[い]き、そこで花[はな]の中[なか]に座[すわ]り、野[の]の草[くさ]を食[た]べた。それはわたしの食[たべ]物[もの]となり、わたしを満[み]たした。"
  27: "七日[なぬか]が過[す]ぎたころ、わたしは草[くさ]の上[うえ]に横[よこ]たわり、心[こころ]は前[まえ]のように再[ふたた]び乱[みだ]れた。"
  28: "わたしの口[くち]が開[ひら]かれ、わたしはいと高[たか]き方[かた]の前[まえ]で語[かた]り始[はじ]めて言[い]った。"
  29: "「ああ、主[しゅ]よ。あなたはご自身[じしん]をわたしたちに示[しめ]して、彼[かれ]らがエジプトから出[で]て来[き]たとき、通[とお]り抜[ぬ]けられず実[み]を結[むす]ばない荒野[こうや]で、わたしたちの父祖[ふそ]たちに現[あらわ]れました。"
  30: "そして、『イスラエルよ、わたしに聞[き]け。ヤコブの子孫[しそん]よ、わたしの言葉[ことば]に耳[みみ]を傾[かたむ]けよ。"
  31: "見[み]よ、わたしはあなたがたのうちにわたしの律法[りっぽう]を蒔[ま]く。それはあなたがたのうちに実[み]を結[むす]び、あなたがたはいつまでもその中[なか]でほめたたえられるであろう。』と言[い]われました。"
  32: "あなたの父[ちち]たちは律法[りっぽう]を受[う]けながらそれを守[まも]らず、あなたの掟[おきて]も守[まも]りませんでした。それで律法[りっぽう]の実[み]は実[み]を結[むす]ばないものとなりました。それは実[み]を結[むす]ぶことができませんでした。あなたのものであったからです。"
  33: "なぜなら、律法を受[う]けた者[もの]たちは、自分[じぶん]たちのうちに蒔[ま]かれたものを守[まも]らずに滅[ほろ]びたからです。"
  34: "見[み]よ、地[ち]が種[たね]を受[う]け、海[うみ]が船[ふね]を、器[うつわ]が食物[しょくもつ]や飲[の]み物[もの]を受[う]けるとき、蒔[ま]かれたもの、あるいは入[い]れられたものが損[そこ]なわれれば、"
  35: "蒔[ま]かれたもの、入[い]れられたもの、受[う]け取[と]られたものもともに滅[ほろ]び、受[う]け取[と]られたものはもはやわたしたちの前[まえ]に残[のこ]らない。しかし、わたしたちの場合[ばあい]はそうではない。"
  36: "わたしたちは律法[りっぽう]を受[う]けながら、罪[つみ]を犯[おか]して滅[ほろ]びました。律法を受[う]け入[い]れたわたしたちの心[こころ]もまた。"
  37: "律法[りっぽう]は滅[ほろ]びず、その働[はたら]きのうちにとどまっています。」"
  38: "わたしがこれらのことを心[こころ]のうちで語[かた]っていると、目[め]を上[あ]げて見[み]たところ、右[みぎ]の側[がわ]に女[おんな]がいた。見[み]よ、彼女[かのじょ]は泣[な]き、大[おお]きな声[こえ]をあげて嘆[なげ]き、魂[たましい]をひどく痛[いた]めていた。その衣[ころも]は裂[さ]け、頭[あたま]には灰[はい]があった。"
  39: "わたしは思[おも]い巡[めぐ]らしていた考[かんが]えを捨[す]て、彼女[かのじょ]の方[ほう]へ向[む]き直[なお]り、"
  40: "彼女[かのじょ]に言[い]った。「なぜ泣[な]くのか。なぜそんなに魂[たましい]を痛[いた]めるのか。」"
  41: "彼女[かのじょ]はわたしに言[い]った。「わたしを放[はな]ってください、わたしの主人[しゅじん]よ。自分[じぶん]のために泣[な]かせ、悲[かな]しみを重[かさ]ねさせてください。わたしは魂[たましい]をひどく苦[くる]しめられ、ひどく辱[はずか]しめられているのだ。」"
  42: "わたしは彼女[かのじょ]に言[い]った。「何[なに]に苦[くる]しんでいるのか。わたしに話[はな]しなさい。」彼女[かのじょ]はわたしに言[い]った。"
  43: "「わたし、この侍女[はしため]は、子[こ]を産[う]まない者[もの]だった。三十年[さんじゅうねん]も夫[おっと]を持[も]ちながら、産[う]んだことがなかった。"
  44: "わたしは三十年[さんじゅうねん]の間[あいだ]、毎時[まいじ]、毎日[まいにち]、昼[ひる]も夜[よる]もいと高[たか]き方[かた]に祈[いの]っていた。"
  45: "そして三十年[さんじゅうねん]が過[す]ぎたとき、神[かみ]はこの侍女[はしため]の願[ねが]いを聞[き]き入[い]れ、わたしのへりくだりをご覧[らん]になり、わたしの悲[かな]しみに耳[みみ]を傾[かたむ]け、わたしに男[おとこ]の子[こ]をお与[あた]えくださった。わたしも夫[おっと]も、わたしの町[まち]の人[ひと]々[びと]もみな、その子[こ]によって大[おお]いに喜[よろこ]び、全能者[ぜんのうしゃ]を大[おお]いにほめたたえた。"
  46: "わたしは大[おお]きな苦労[くろう]をしてその子[こ]を育[そだ]てた。"
  47: "そして、その子[こ]が育[そだ]ち、妻[つま]を迎[むか]えようとするとき、わたしは宴会[えんかい]の日[ひ]を設[もう]けた。」"

notes:
  1: "«мерящь мери» — букв. «измеряя измеряй» (лат. metiens metire): повеление измерять время в себе самом; ru: «измеряя измеряй время в себе самом». «знамений, яже предречена суть» — «знамений, которые предсказаны». В слав. стих кончается двоеточием, речь продолжается в 9:2 — кавычка открыта здесь."
  2: "«вышний» — Вышний (Altissimus), в тексте いと高[たか]き方[かた]; «посещати век» — посещать век; «век, иже от него сотворен бысть» — «век, который Им сотворён». ru: «начнет Всевышний посещать век, Им созданный»."
  3: "«зыбание местъ» — колебание, зыбление мест (зыбати — колебаться); «людий смущение» — смятение народов. ru: «колебание мест, смятение народов»."
  4: "«от дний, иже быша пред тобою от начала» — «от дней, бывших прежде тебя, от начала»; слав. порядок сохранён (о сих … от начала)."
  5: "«скончание есть явлено» — «конец бывает явлен»; слав. «начало имать, тако и скончание» — «имеет начало, так и конец»."
  6: "«начала имеют явленна в чудесех и силах» — «начала являются (явлены) в чудесах и силах»; «в деянии и знамениих» — «в действиях и знамениях» (ру: «действиями и знамениями»)."
  7: "«всяк иже спасется и иже возможетъ избежати делами своими и верою, еюже веровасте» — слав. фраза оборвана; «еюже веровасте» — «которою веруете» (мн. ч., к читателям). ru переносит сюда «от преждесказанных бед»; в слав. они в 9:8 — держим слав. деление."
  8: "«узритъ спасние мое на земли моей и в пределех моих» — «увидит спасение Моё на земле Моей и в пределах Моих»; «яко освятих мене от века» — букв. «ибо освятил Меня (Себя) от века»; ru: «которые Я освятил Себе от века»."
  9: "«умилятся» — умилятся, пожалеют (умилятися — смягчаться, сожалеть); «иже отвергоша я в презорстве» — «которые отвергли их (пути) с презрением». ru: «пожалеют отступившие … отвергшие их с презрением пребудут в муках»."
  10: "«живуще благодеяния получивше» — «живя и получая благодеяния»; слав. стих обрывается на придаточном, продолжение — 9:11."
  11: "«егда еще бяху имеюще свободу и егда еще бяше им отверсто покаяния место» — «когда ещё имели свободу и когда ещё было им открыто место покаяния»; «не уразумеша, но уничижиша» — «не уразумели, но уничижили». ru смягчает: «возгнушались законом Моим»."
  12: "«сим подобает по смерти в мучении познати» — «им подобает по смерти в мучении познать» (познать Бога). ru: «те познают Меня по смерти в мучении»."
  13: "«не буди любопытлив» — «не будь любопытен, не допытывайся»; «ихже век, и ради которыхъ век, и когда» — тёмное: «которым принадлежит век, и ради которых век, и когда»; передано «世が彼らに属し、彼らのために世があること、それがいつであるか». ru: «которым принадлежит век и ради которых век, и когда»."
  14: "Вводка ответа Ездры — вне кавычек (речь с 9:15)."
  15: "«древле глаголах и ныне глаголю и после возглаголю» — «прежде говорил, и теперь говорю, и после буду говорить»; «якоже умножаются волны над каплю» — «как волны умножаются над каплю», т. е. волна больше капли (ru: «как волна больше капли»)."
  16: "Вводка речи ангела (9:17–25) — вне кавычек."
  17: "«какова нива, такова и семена, и каковы цвети, таковы и пестроты» — «какова нива, таковы и семена, каковы цветы, таковы и краски (пестроты)»; «каков делатель, таково и дело, каков земледелец, таково и земледелство» — «каков делатель, таково и дело, каков земледелец, таково и возделывание»; «понеже время бяше века» — «ибо время века было» (тёмное; ru: «ибо то было время века»)."
  18: "«егда бых уготовляющь тем, иже ныне суть, прежде неже бысть век, въ немже бы обитали» — «когда Я готовил [век] тем, которые ныне суть, прежде нежели был век, в котором им обитать»; «никтоже противу рече мне» — «никто не противоречил Мне»."
  19: "Тёмное место: слав. «тогда бо всяк, и ныне творец в мире семъ уготованнем, и в жатве неоскудевающей, и в законе неизследимем растлени суть нравы своими» — оборвано и испорчено; переведено по ru: «А ныне, когда век сей был создан, нравы сотворенных повредились при неоскудевающей жатве, при неисследимом законе». «неизследимый» — неисследимый, непостижимый."
  20: "«разсмотрих век» — «я рассмотрел век»; «бяше беда ради помышлений, яже в нем приидоша» — «была беда из-за помышлений, которые вошли в него»."
  21: "«сохранихъ мне ягоду от грозда и саждение от колена многа» — «сохранил Мне ягоду из грозди и насаждение от многого колена (рода)»; «колено» здесь — род, племя (ru: «из множества»)."
  22: "«да погибнет убо множество, еже без вины рождено есть» — «да погибнет множество, которое напрасно (без вины) рождено»; «еже великим трудомъ соверших» — «которое Я совершил великим трудом»."
  23: "«аще и еще спустиши седмь дний инех, но да не постишися в них» — «если ещё пропустишь (проведёшь) семь других дней, но не постись в них»; «спустиши» — проведёшь, отпустишь."
  24: "«на поле цветное, идеже дом несть создан» — «на поле цветущее, где дом не построен»; «снеси токмо от цветов полевых» — «съешь только от полевых цветов»; «мяса да не вкусиши, и вина не пиеши» — «мяса не вкуси и вина не пей»."
  25: "«молися вышнему непрестанно» — «молись Вышнему непрестанно»; «прииду и возглаголю с тобою» — «приду и буду говорить с тобою». Здесь кавычка закрывается (9:17–25 — одна речь)."
  26: "«поле, еже зовется ардаф» — поле, называемое Ардаф (в ru — Ардаф); «от трав селных ядох» — «ел полевые травы»; «бысть ми пища их в сытость» — «пища их была мне в насыщение»."
  27: "«лежахъ на сене» — «лежал на сене (траве)»; «сердце мое паки смущашеся, якоже прежде» — «сердце моё опять смущалось, как прежде»."
  28: "«отверзошася уста моя» — «открылись уста мои»; молитва 9:29–37 открывается здесь."
  29: "«тя нам показуяй показался еси отцем нашим» — «Тебя нам являя, Ты явился отцам нашим»; «в пустыни непроходней и неплодней» — «в пустыне непроходимой и бесплодной»; «егда бяху исходяще от египта» — «когда они выходили из Египта»."
  30: "Внутри молитвы Ездры — слова Бога, вложенная цитата 『…』 (9:30–31); «ты, израилю, послушай мя, и семя иаковле, вонми словесем моим» — «ты, Израиль, послушай Меня, и семя Иакова, внемли словам Моим»."
  31: "«аз сею закон мой, и сотворитъ в вас плод, и прославитеся в нем во век» — «Я сею закон Мой, и он сотворит в вас плод, и прославитесь в нём вовеки». Цитата Бога закрывается здесь."
  32: "Тёмное: «и бысть плод закона неродящь: ниже бо можаше, понеже твой бе» — букв. «и стал плод закона неплодящим: ибо и не мог, потому что был Твой». ru (с лат. non perditus) иначе: «плод закона Твоего не погиб и не мог погибнуть, потому что был Твой». В тексте держим слав. «неродящь» (не приносящий плода) и добавляем «не мог» без объекта, как в слав."
  33: "«зане, иже прияша, погибоша не сохраняюще, еже в них сеяно бысть» — «ибо принявшие погибли, не сохранив того, что в них было посеяно»."
  34: "«обычай есть, да егда прииметъ земля семя, или корабль море, или сосудъ некий пищу или питие» — «есть обычай: когда земля примет семя, или море — корабль, или некий сосуд — пищу или питие»; «егда будет повреждено то, в немже сеяно есть, или то, в немже поставлено есть» — «когда будет повреждено то, в чём посеяно, или то, в чём помещено»."
  35: "«купно и то, еже насеяно или поставлено есть, или яже прията суть, истребляются» — «вместе и то, что посеяно, или помещено, или принято, истребляется»; «нам же не тако сотворено бысть» — «с нами же не так было»."
  36: "«мы бо, иже закон прияли есмы, согрешающе погибохом, и сердце наше, еже восприя его» — «ибо мы, принявшие закон, согрешая погибли, и сердце наше, которое приняло его»; слав. оборвано, продолжение — 9:37."
  37: "«яко закон не погибе, но пребывает во своемъ труде» — «ибо закон не погиб, но пребывает в своём труде (силе, делании)»; ru: «остается в своей силе». Здесь молитва закрывается."
  38: "«воззрех очима моима и видех жену в десней стране» — «воззрел очами моими и увидел жену на правой стороне»; «рыдаше и плакаше со гласомъ великим и душею боляше зело» — «рыдала и плакала с великим гласом и душою болела сильно»; «одеяние ея раздрано, и пепел на главе ея» — «одежда её разодрана, и пепел на голове её»."
  39: "«оставих помышления, в которых быхъ мысля, и обратихся к ней» — «оставил помышления, в которых был мысля, и обратился к ней»; в слав. нет «и сказал ей» (есть в ru), речь начинается в 9:40."
  40: "«о чем плачеши, и что болиши душею?» — «о чём плачешь, и что болит у тебя душа?» (слав. «что болиши душею» — «что ты болеешь душою»)."
  41: "«остави мя, господи мой, да восплачу себе и приложу болезни» — «оставь меня, господин мой, дай мне плакать о себе и приложить (умножить) скорби»; «смирена есмь зело» — «я весьма унижена (смирена)»; «огорчихся душею» — «я сильно огорчена душою»."
  42: "«что страждеши? рцы ми» — «что ты претерпела? скажи мне»; после вводки 9:43 — речь жены, продолжающаяся до конца главы."
  43: "«неплодна бых аз раба твоя и не родих, имеющи мужа лет тридесять» — «я, раба твоя, была неплодна и не рожала, имея мужа тридцать лет»."
  44: "«на всяк час и на всяк день, и лет сих тридесять молюся вышнему день и нощь» — «каждый час и каждый день, и эти тридцать лет молюсь Вышнему день и ночь»."
  45: "«и виде смирение мое, и внят скорбению моему» — «и увидел смирение (унижение) моё, и внял скорби моей»; «вси граждане мои» — «все сограждане мои»; «почтихом зело всесильнаго» — «мы весьма почтили Всесильного (Omnipotens)»."
  46: "«вскормих его с трудом великим» — «я вскормила его с великим трудом»."
  47: "«прииде пояти жену» — «пришёл взять жену»; «сотворих день пирный» — «я устроила день пиршества». Речь жены обрывается на конце главы: её рассказ продолжается в 10:1 (кавычка на границе глав закрыта и снова открыта)."
