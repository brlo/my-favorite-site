# jp-box, 3-я Ездры, глава 9. Черновик для приёмки.
#
# База: церковнославянский текст (csl-ru) — в Септуагинте книги нет; ru — для понимания.
# Нумерация — славянская. Язык — современный 常体; 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 1–13 речь ангела о временах и знамениях, о погибающих и спасаемых;
# 14–15 ответ Ездры («погибающих больше, чем спасаемых»); 16–25 притча о ниве, семени
# и плоде, повеление идти на цветущее поле и не поститься; 26–28 Ездра на поле Ардаф,
# вкушает травы, сердце снова смущается; 29–37 молитва о народе: отцы приняли закон и
# не сохранили его; 38–47 плачущая жена: тридцать лет была неплодна, родила сына и
# вскормила его, а когда он входил в брачный чертог — умер (её рассказ продолжается
# в гл. 10).
# Голоса: 9:1–13 — ангел 「…」; 9:15 — Ездра 「…」; 9:17–25 — ангел 「…」;
# 9:29–37 — молитва Ездры 「…」, в 9:30–31 слова Бога внутри неё — 『…』;
# 9:40 и 9:42 — вопросы Ездры 「…」; 9:41 — ответ жены 「…」; 9:43–47 — речь жены 「…」
# (продолжается в гл. 10). Вводки «и отвещах и рекох», «и рече ко мне» — вне кавычек.
# Термины: いと高[たか]き方[かた] — Вышний (Altissimus); 力[ちから]ある者[もの] —
# Крепкий; 全能者[ぜんのうしゃ] — Всесильный; 世[よ] — век (saeculum);
# 魂[たましい] — душа; 律法[りっぽう] — закон; 掟[おきて] — законная/повеления;
# 悔[く]い改[あらた]め — покаяние; 不敬虔[ふけいけん] — нечестивые; 災[わざわ]い — беда;
# Язык: молитва Ездры 9:29–37 и его ответ ангелу 9:15 — です・ます (как молитвы
# и обращения к ангелам в корпусе); речь ангела и жены — 常体.
# 野[の] — поле; 灰[はい] — пепел; 断食[だんじき] — пост. Имена: エズラ, イスラエル,
# ヤコブ, エジプト, アルダフ.
#
