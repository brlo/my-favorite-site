verses:
  1: "エフライムの人[ひと]々[びと]は彼[かれ]に言[い]った。「あなたがミディアンと戦[たたか]うために出[で]て行[い]かれたとき、わたしたちを呼[よ]ばなかったとは、どういうことか。」そして彼[かれ]と激[はげ]しく争[あらそ]った。"
  2: "彼[かれ]は彼[かれ]らに言[い]った。「今[いま]、わたしがしたことで、あなたがたに及[およ]ぶことがあるだろうか。エフライムのぶどう拾[ひろ]いの残[のこ]りは、アビエゼルのぶどうの収穫[しゅうかく]にもまさっていないか。"
  3: "神[かみ]はミディアンの首長[しゅちょう]オレブとゼエブをあなたがたの手[て]に渡[わた]された。わたしに、あなたがたに及[およ]ぶようなことができたでしょうか。」こう言[い]うと、彼[かれ]に向[む]かっていた彼[かれ]らの怒[いか]りは静[しず]まった。"
  4: "ギデオンはヨルダン川に来[き]て、彼[かれ]とともにいる三百人[にん]とともに渡[わた]った。彼[かれ]らは気力[きりょく]尽[つ]き、飢[うえ]えていた。"
  5: "彼[かれ]はスコテの人[ひと]々[びと]に言[い]った。「わたしとともにいる民[たみ]にパンを与[あた]えてください。彼[かれ]らは飢[うえ]えているのです。わたしはミディアンの王[おう]ゼバとツァルムナの後[あと]を追[お]っているのです。」"
  6: "スコテの首長[しゅちょう]たちは言[い]った。「ゼバとツァルムナの手[て]がもうあなたの手[て]にあるというのですか。それなのに、わたしたちがあなたの軍[ぐん]にパンを与[あた]えなければならないのですか。」"
  7: "ギデオンは言[い]った。「それなら、主[しゅ]がゼバとツァルムナをわたしの手[て]に渡[わた]されたとき、わたしはあなたがたの肉[にく]を野[の]の茨[いばら]と棘[とげ]の付[つ]いた打[う]ち板[いた]で打[う]ち砕[くだ]いてやる。」"
  8: "彼[かれ]はそこからペヌエルへ上[のぼ]って、同[おな]じことを彼[かれ]らに語[かた]った。ペヌエルの人[ひと]々[びと]も、スコテの人[ひと]々[びと]が答[こた]えたのと同[おな]じように答[こた]えた。"
  9: "彼[かれ]はペヌエルの人[ひと]々[びと]にも言[い]った。「わたしが平和[へいわ]のうちに帰[かえ]って来[き]たとき、このやぐらを崩[くず]してやる。」"
  10: "ゼバとツァルムナはカルコルにいた。彼[かれ]らの陣[じん]は、東[ひがし]の民[たみ]の全[ぜん]軍[ぐん]のうちに残[のこ]った者[もの]たちで、彼[かれ]らとともにあり、およそ一万五千人[にん]であった。剣[つるぎ]を抜[ぬ]いた者[もの]のうち、倒[たお]れた者[もの]は十二万人[にん]であった。"
  11: "ギデオンは天幕[てんまく]に住[す]む者[もの]たちの道[みち]を、ノバの東[ひがし]、ゼバの向[む]かいから上[のぼ]って、陣[じん]を不意[ふい]に打[う]った。陣[じん]は安心[あんしん]しきっていた。"
  12: "ゼバとツァルムナは逃[に]げ、彼[かれ]は彼[かれ]らの後[あと]を追[お]って、ミディアンの二人[ふたり]の王[おう]ゼバとツァルムナを捕[つか]まえ、彼[かれ]らの全[ぜん]軍[ぐん]を撃[う]ち破[やぶ]った。"
  13: "ヨアシュの子[こ]ギデオンは、ヘレスの坂[さか]から戦[たたか]いから戻[もど]った。"
  14: "彼[かれ]はスコテの人[ひと]々[びと]のうちの若者[わかもの]を一人[ひとり]捕[つか]まえ、彼[かれ]から尋[たず]ねて、スコテの首長[しゅちょう]たちとその長老[ちょうろう]たち、七十七人[にん]の名[な]を書[か]き記[しる]した。"
  15: "彼[かれ]はスコテの首長[しゅちょう]たちのところへ来[き]て言[い]った。「見[み]よ、ゼバとツァルムナだ。あなたがたは彼[かれ]らのことで、『ゼバとツァルムナの手[て]がもうあなたの手[て]にあるのか。それだから、あなたの疲[つか]れた者[もの]たちにパンを与[あた]えよというのか』と言[い]って、わたしをそしった。」"
  16: "彼[かれ]はその町[まち]の首長[しゅちょう]たちと長老[ちょうろう]たちを捕[つか]まえ、野[の]の茨[いばら]と棘[とげ]の付[つ]いた板[いた]を取[と]って、それでスコテの人[ひと]々[びと]を打[う]ち懲[こ]らした。"
  17: "彼[かれ]はペヌエルのやぐらを崩[くず]し、その町[まち]の人[ひと]々[びと]を殺[ころ]した。"
  18: "彼[かれ]はゼバとツァルムナに言[い]った。「あなたがたがタボルの山[やま]で殺[ころ]した者[もの]は、どんな者[もの]たちだったか。」彼[かれ]らは言[い]った。「あなたに似[に]た者[もの]たちで、あなたと同[おな]じようでした。王[おう]の子[こ]らにそっくりな姿[すがた]でした。」"
  19: "ギデオンは言[い]った。「彼[かれ]らはわたしの兄弟[きょうだい]、母[はは]の子[こ]らである。主[しゅ]は生[い]きておられる。あなたがたが彼[かれ]らを生[い]かしておいたなら、わたしはあなたがたを殺[ころ]さなかったであろう。」"
  20: "彼[かれ]は長男[ちょうなん]イェテルに言[い]った。「立[た]って、彼[かれ]らを殺[ころ]せ。」しかし若者[わかもの]は剣[つるぎ]を抜[ぬ]かなかった。まだ若[わか]かったので、恐[おそ]れたからである。"
  21: "ゼバとツァルムナは言[い]った。「あなた自身[じしん]が立[た]って、わたしたちを打[う]ち倒[たお]せ。人[ひと]に応[おう]じて力[ちから]もあるのだから。」そこでギデオンは立[た]って、ゼバとツァルムナを殺[ころ]し、彼[かれ]らのらくだの首[くび]にあった三日月[みかづき]形[がた]の飾[かざ]りを取[と]った。"
  22: "イスラエルの人[ひと]々[びと]はギデオンに言[い]った。「あなたも、あなたの子[こ]も、わたしたちを治[おさ]めてください。あなたがミディアンの手[て]からわたしたちを救[すく]ったのですから。」"
  23: "ギデオンは彼[かれ]らに言[い]った。「わたしはあなたがたを治[おさ]めない。わたしの子[こ]もあなたがたを治めない。主[しゅ]があなたがたを治[おさ]められる。」"
  24: "ギデオンは彼[かれ]らに言[い]った。「あなたがたに一[ひと]つ頼[たの]みたいことがある。おのおの、その分捕[ぶんど]り物[もの]の耳飾[みみかざ]りをわたしに与[あた]えてほしい。」彼[かれ]らには金[きん]の耳飾[みみかざ]りが多[おお]くあった。彼[かれ]らはイシュマエル人[じん]だったからである。"
  25: "彼[かれ]らは言[い]った。「喜[よろこ]んで与[あた]えましょう。」そして彼[かれ]は衣[ころも]を広[ひろ]げると、おのおのその分捕[ぶんど]り物[もの]の耳飾[みみかざ]りをそこへ投[な]げ入[い]れた。"
  26: "彼[かれ]が求[もと]めた金[きん]の耳飾[みみかざ]りの重[おも]さは、千七百シケルの金[きん]であった。そのほかに、三日月[みかづき]形[がた]の飾[かざ]り、垂[た]れ飾[かざ]り、エンフォトの首飾[くびかざ]り、ミディアンの王[おう]たちが着[き]ていた紫[むらさき]の衣[ころも]、および彼[かれ]らのらくだの首[くび]にあった金[きん]の鎖[くさり]があった。"
  27: "ギデオンはそれでエフォドを造[つく]り、それを自分[じぶん]の町[まち]オフラに置[お]いた。イスラエルはみな、そこへそれに従[したが]って淫[いん]行[こう]に走[はし]った。それはギデオンとその家[いえ]の罠[わな]となった。"
  28: "ミディアンはイスラエルの人[ひと]々[びと]の前[まえ]に屈[くっ]し、もはや頭[あたま]を上[あ]げなかった。ギデオンの時代[じだい]、地[ち]は四十年[ねん]の間[あいだ]、平穏[へいおん]であった。"
  29: "ヨアシュの子[こ]エルバアルは帰[かえ]って、自分[じぶん]の家[いえ]に住[す]んだ。"
  30: "ギデオンには、彼[かれ]の腰[こし]から出[で]た子[こ]が七十人[にん]あった。妻[つま]が多[おお]かったからである。"
  31: "シケムにいたそばめもまた、彼[かれ]に男[おとこ]の子[こ]を産[う]んだ。彼[かれ]はその名[な]をアビメレクと名[な]づけた。"
  32: "ヨアシュの子[こ]ギデオンは良[よ]い老[お]いを迎[むか]えて死[し]に、アビエゼル人[じん]のオフラにある父[ちち]ヨアシュの墓[はか]に葬[ほうむ]られた。"
  33: "ギデオンが死[し]ぬと、イスラエルの人[ひと]々[びと]は背[そむ]いて、バアルたちに従[したが]って淫[いん]行[こう]をし、バアル・ベリトを自分[じぶん]たちの神[かみ]とする契約[けいやく]を結[むす]んだ。"
  34: "イスラエルの人[ひと]々[びと]は、周[まわ]りのすべての敵[てき]の手[て]から彼[かれ]らを救[すく]い出[だ]した主[しゅ]なる自分[じぶん]たちの神[かみ]を覚[おぼ]えていなかった。"
  35: "彼[かれ]らは、エルバアル（すなわちギデオン）の家[いえ]に、彼[かれ]がイスラエルにしたすべての善[ぜん]に対[たい]して、慈[いつく]しみを示[しめ]さなかった。"

notes:
  1: "ἐκρίνοντο μετ᾽ αὐτοῦ κραταιῶς — «судились с ним крепко», т. е. жестоко ссорились (κρίνω здесь в судебном смысле). Τί τὸ ῥῆμα τοῦτο — «что это за дело». ὅτε ἐξεπορεύου πολεμῆσαι — когда ты выходил воевать."
  2: "ἐπιφυλλίδες — остатки после сбора винограда, «подбирание»; τρυγητός — сбор, урожай винограда. Смысл: остаток Ефрема больше целого Авиезера. Речь Гедеона продолжается до конца ст. 3."
  3: "ἐν χειρὶ ὑμῶν παρέδωκεν κύριος — в руки ваши предал Господь. ἠδυνάσθην — смог (δύναμαι). κατέπαυσαν — прекратили. τότε ἀνῆκε τὸ πνεῦμα αὐτῶν ἀπ᾽ αὐτοῦ — тогда отошёл дух их от него (ἀνίημι), т. е. гнев оставил их."
  4: "ὀλιγοψυχοῦντες καὶ πεινῶντες — малодушествуя и голодая (ὀλιγόψυχος). Слав. «алчни и утруждени гоняще». διαβαίνω — переходить (Иордан)."
  5: "Δότε δὴ ἄρτους — дайте же хлебов. ἐγὼ δὲ διώκω ὀπίσω Ζεβεε καὶ Σαλμανα — я же гонюсь вслед Зевея и Салмана (в корпусе ゼバ, ツァルムナ). βασιλέων Μαδιαμ — царей Мадиамских."
  6: "Μὴ χεὶρ Ζεβεε καὶ Σαλμανα νῦν ἐν τῇ χειρί σου — «разве рука Зевея и Салмана уже в руке твоей»; Μή вводит риторический вопрос с ожиданием «нет». ὅτι δώσομεν — что (будто) мы дадим. Здесь и в 15 — вложенная речь 『…』."
  7: "Οὐχ οὕτως — «не так» (слав. «не тако»). καταξανῶ τὰς σάρκας ὑμῶν — изотру, разотру тела ваши (καταξαίνω). ἀκάνθαις τῆς ἐρήμου — тернием пустыни. βαρκοννιμ (βαρακηνιμ в 16) — евр. «барконим», молотильные доски с зубьями; слав. «волчцами»."
  8: "Φανουηλ — Пенуэл (в корпусе ペヌエル; слав. «фануил»). κατὰ ταῦτα — так же, то же. ὃν τρόπον ἀπεκρίθησαν — каким образом ответили."
  9: "Ἐν τῷ ἐπιστρέφειν με μετ᾽ εἰρήνης — когда я возвращусь с миром. κατασκάψω τὸν πύργον τοῦτον — раскопаю, разрушу эту башню (κατασκάπτω); в корпусе やぐら."
  10: "ἐν Καρκαρ — в Каркоре. ὡσεὶ πεντεκαίδεκα χιλιάδες — около 15 000. οἱ καταλειφθέντες ἐν πάσῃ παρεμβολῇ υἱῶν ἀνατολῶν — оставшиеся во всём стане сынов востока. ἐσπασμένων ῥομφαίαν — обнаживших меч (σπάω): 120 000 павших."
  11: "ὁδὸν κατοικούντων ἐν σκηναῖς ἀνατολῶν τῆς Ναβεθ ἐξ ἐναντίας Ζεβεε — «дорогой живущих в шатрах, на восток от Нова, напротив Зевея»; в gr место тёмное, слав. «прямо навы и иегевала». ἐπάταξεν τὴν παρεμβολήν — поразил стан. ἦν πεποιθυῖα — был в безопасности, беспечен (πείθω, перфект)."
  12: "ἐδίωξεν ὀπίσω αὐτῶν — погнался за ними. ἐκράτησεν τοὺς δύο βασιλεῖς — захватил двух царей (κρατέω). ἐξέτριψεν — истребил, привёл в смятение (ἐκτρίβω); слав. «смяте»."
  13: "ἀπὸ ἀναβάσεως Αρες — «от восхода Арес»: либо топоним Херес (Син.), либо «от восхода солнца» (слав. «прежде восхода солнца»); принято ヘレスの坂. ἀνέστρεψεν ἐκ τοῦ πολέμου — возвратился с войны."
  14: "συνέλαβον παιδάριον ἐκ τῶν ἀνδρῶν Σοκχωθ — захватили отрока из мужей Сокхофа. ἐπηρώτησεν αὐτόν — расспросил его. ἀπεγράψατο — записал себе (ἀπογράφω); подлежащее — Гедеон, поэтому «расспросив, записал имена» (слав. «вписа от него»). ἑβδομήκοντα ἑπτὰ ἄνδρας — семьдесят семь мужей: число 77 в gr, слав. и Син."
  15: "δι᾽ οὓς ὠνειδίσατέ με — за которых вы поносили меня (ὀνειδίζω). τοῖς ἀνδράσιν σου τοῖς ἐκλελυμένοις — людям твоим ослабевшим (ἐκλύω). Их прежние слова повторены как 『…』."
  16: "ἔλαβεν τοὺς ἄρχοντας καὶ τοὺς πρεσβυτέρους τῆς πόλεως — взял начальников и старейшин города. κατέξανεν ἐν αὐτοῖς ἄνδρας Σοκχωθ — растёр ими мужей Сокхофа: старейшины взяты как орудие казни. βαρακηνιμ — см. прим. к 7."
  17: "τὸν πύργον Φανουηλ κατέσκαψεν — башню Пенуэла раскопал. ἀπέκτεινεν τοὺς ἄνδρας τῆς πόλεως — убил мужей города."
  18: "Ποῦ οἱ ἄνδρες, οὓς ἀπεκτείνατε ἐν Θαβωρ; — где те мужи, которых вы убили на Фаворе (Θαβωρ — Фавор). Ὡσεὶ σύ, ὅμοιος σοί, ὅμοιος αὐτῶν — «как ты, подобен тебе, подобен им»: ответ темен и в gr; ὡς εἶδος μορφὴ υἱῶν βασιλέων — видом как образ сынов царских."
  19: "Ἀδελφοί μου καὶ υἱοὶ τῆς μητρός μού εἰσιν — братья мои и сыны матери моей. Ζῇ κύριος — жив Господь (клятва). εἰ ἐζωογονήσατε — если бы вы оставили их в живых (ζωογονέω)."
  20: "τῷ Ιεθερ τῷ πρωτοτόκῳ αὐτοῦ — Иеферу, первенцу его (в корпусе イェテル). οὐκ ἔσπασεν τὴν μάχαιραν — не извлёк меча. ὅτι ἦν νεώτερος — потому что был младше."
  21: "Ἀνάστα δὴ σὺ καὶ ἀπάντησον ἡμῖν — встань же ты и выступи против нас (ἀπαντάω). ὡς ἀνὴρ ἡ δύναμις αὐτοῦ — «по человеку и сила его». μηνίσκους — полулуния, украшения-лунницы на шеях верблюдов (μηνίσκος)."
  22: "Ἄρχε ἐν ἡμῖν — владей нами (ἄρχω). σὺ καὶ οἱ υἱοί σου — ты и сыны твои; слав. и Син. добавляют «и сын сына твоего» (МТ), в gr этого нет — в текст не внесено. σέσωκας — ты спас (перфект). ἐκ χειρὸς Μαδιαμ — из руки Мадиама."
  23: "Οὐκ ἄρξω ἐγὼ ὑμῶν — не буду владеть вами. κύριος ἄρξει ὑμῶν — Господь будет владеть вами. Формула отказа от царской власти; в корпусе 治める."
  24: "Αἰτήσομαι παρ᾽ ὑμῶν αἴτησιν — попрошу у вас просьбу (фигура речи). ἐνώτιον τῶν σκύλων αὐτοῦ — серьгу из добычи его (σκῦλα — добыча). ὅτι Ισμαηλῖται ἦσαν — ибо они были Измаильтяне (в корпусе イシュマエル人)."
  25: "Διδόντες δώσομεν — «давая дадим», т. е. охотно дадим. ἀνέπτυξεν τὸ ἱμάτιον αὐτοῦ — он развернул одежду свою (ед. ч., Гедеон); слав. и Син. — множественное «разостлали»."
  26: "σταθμὸς τῶν ἐνωτίων — вес серег (σταθμός). σίκλοι χίλιοι καὶ ἑπτακόσιοι — 1700 сиклей. πλὴν τῶν σιρώνων καὶ τῶν ὁρμίσκων ενφωθ — кроме цепочек и ожерелий «енфот»; ενφωθ — транслитерация евр. слова, смысл спорен. περιβόλαια πορφυρᾶ — пурпуровые одежды. κλοιοί — золотые обручи, цепи на шеях верблюдов."
  27: "εφουδ — ефод (в корпусе エフォド, сноска уже есть). ἐξεπόρνευσεν πᾶς Ισραηλ ὀπίσω αὐτοῦ — весь Израиль блудно ходил вслед его (πορνεύω). εἰς σκάνδαλον — в соблазн, в сеть (σκάνδαλον)."
  28: "ἐνετράπη — был смирен, обращён в бегство (ἐντρέπω). οὐ προσέθεντο ἆραι κεφαλὴν αὐτῶν — не стали более поднимать головы своей. ἡσύχασεν ἡ γῆ — земля покоилась (ἡσυχάζω). ἔτη τεσσαράκοντα — сорок лет."
  29: "Ιεροβααλ υἱὸς Ιωας — Ероваал, сын Иоаса (в корпусе エルバアル). κατῴκησεν ἐν τῷ οἴκῳ αὐτοῦ — поселился в доме своём."
  30: "ἑβδομήκοντα υἱοὶ ἐκπορευόμενοι ἐκ μηρῶν αὐτοῦ — семьдесят сыновей, происшедших из чресл его. γυναῖκες πολλαὶ ἦσαν αὐτῷ — много было у него жён."
  31: "ἡ παλλακὴ αὐτοῦ ἡ ἐν Σικιμοις — наложница его в Сихеме. ἐπέθηκεν τὸ ὄνομα αὐτοῦ Αβιμελεχ — дал ему имя Авимелех (в корпусе アビメレク)."
  32: "ἐν πολιᾷ ἀγαθῇ — в доброй старости (πολιά — седина). ἐτάφη ἐν τῷ τάφῳ Ιωας τοῦ πατρὸς αὐτοῦ — погребён в гробе Иоаса, отца своего. ἐν Εφραθα — в Ефрафе; τατρὸς Αβιεζρι — испорченное «отца Авиезерова» (в корпусе アビエゼル人)."
  33: "ἀπεστράφησαν — отвратились, совратились. ἐξεπόρνευσαν ὀπίσω τῶν Βααλιμ — блудно ходили вслед Ваалов. ἔθεντο αὑτοῖς τὸν Βααλβεριθ εἰς διαθήκην — поставили себе Ваал-Верифа в завет, чтобы он был им богом (ср. 9:4, 46)."
  34: "οὐκ ἐμνήσθησαν — не вспомнили (μιμνήσκομαι). τοῦ ῥυσαμένου αὐτοὺς — избавившего их (ῥύομαι). ἐκ χειρὸς πάντων τῶν ἐχθρῶν αὐτῶν κυκλόθεν — из руки всех врагов их окрест."
  35: "οὐκ ἐποίησαν ἔλεος — не сотворили милости (ἔλεος). κατὰ πᾶσαν τὴν ἀγαθωσύνην — по всей благостыне (ἀγαθωσύνη). μετὰ Ισραηλ — с Израилем."
