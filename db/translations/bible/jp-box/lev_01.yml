# jp-box, Левит, глава 1. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в Левите отсутствует.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 1: закон всесожжения (燔祭): из крупного скота (3–9), из мелкого (10–13),
# из птиц (14–17). Речь Бога — 「…」 (2–17), красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 燔祭 уже пояснено при первом упоминании в корпусе (Быт 8:20),
# 祭壇, 祭司, 幕屋 понятны по контексту.
# jp-ni не использовался.

tr_code: jp-box
book: lev
chapter: 1
draft: true

verses:
  1: "主[しゅ]は証[あかし]の幕屋[まくや]からモーセを呼[よ]び、彼[かれ]に言[い]われた。"
  2: "「イスラエルの子[こ]らに語[かた]って言[い]いなさい。あなたがたのうちのだれかが主[しゅ]に捧[ささ]げ物[もの]を献[ささ]げるときは、家畜[かちく]のうちから、すなわち牛[うし]の群[む]れから、また羊[ひつじ]の群[む]れから、あなたがたの捧[ささ]げ物[もの]を献[ささ]げなさい。"
  3: "もし彼[かれ]の捧[ささ]げ物[もの]が、牛[うし]の群[む]れからの燔祭[はんさい]であるなら、傷[きず]のない雄[おす]を献[ささ]げなさい。主[しゅ]の前[まえ]に受[う]け入[い]れられるために、証[あかし]の幕屋[まくや]の入口[いりぐち]に、それを献[ささ]げなさい。"
  4: "彼[かれ]はその捧[ささ]げ物[もの]の頭[あたま]に手[て]を置[お]きなさい。それは彼[かれ]のために贖[あがな]いを成[な]し、彼[かれ]が受[う]け入[い]れられるためである。"
  5: "彼[かれ]は主[しゅ]の前[まえ]でその子牛[こうし]を屠[ほふ]りなさい。アロンの子[こ]らである祭司[さいし]たちはその血[ち]を持[も]って来[き]て、証[あかし]の幕屋[まくや]の入口[いりぐち]にある祭壇[さいだん]の周[まわ]りに、その血[ち]を注[そそ]ぎかけなさい。"
  6: "そして、燔祭[はんさい]の皮[かわ]をはぎ、それを部[ぶ]分[ぶん]ごとに切[き]り分[わ]けなさい。"
  7: "アロンの子[こ]らである祭司[さいし]たちは祭壇[さいだん]の上[うえ]に火[ひ]を置[お]き、その火[ひ]の上[うえ]に薪[たきぎ]を並[なら]べなさい。"
  8: "アロンの子[こ]らである祭司[さいし]たちは、切[き]り分[わ]けた肉[にく]、頭[あたま]、脂肪[しぼう]を、祭壇[さいだん]の上[うえ]の火[ひ]の上[うえ]にある薪[たきぎ]の上[うえ]に並[なら]べなさい。"
  9: "内臓[ないぞう]と足[あし]は水[みず]で洗[あら]いなさい。祭司[さいし]はすべてを祭壇[さいだん]の上[うえ]に置[お]きなさい。それは焼[や]き尽[つ]くす捧[ささ]げ物[もの]、主[しゅ]に芳[かんば]しい香[かおり]となる犠牲[ぎせい]である。"
  10: "もし彼[かれ]の捧[ささ]げ物[もの]が、主[しゅ]への羊[ひつじ]の群[む]れから、すなわち小羊[こひつじ]か山羊[やぎ]の子[こ]からの燔祭[はんさい]であるなら、傷[きず]のない雄[おす]を献[ささ]げ、その頭[あたま]に手[て]を置[お]きなさい。"
  11: "彼[かれ]は主[しゅ]の前[まえ]、祭壇[さいだん]の北側[きたがわ]でそれを屠[ほふ]りなさい。アロンの子[こ]らである祭司[さいし]たちは、その血[ち]を祭壇[さいだん]の周[まわ]りに注[そそ]ぎかけなさい。"
  12: "それを部[ぶ]分[ぶん]ごとに、その頭[あたま]と脂肪[しぼう]を切[き]り分[わ]けなさい。祭司[さいし]はそれらを、祭壇[さいだん]の上[うえ]の火[ひ]の上[うえ]にある薪[たきぎ]の上[うえ]に並[なら]べなさい。"
  13: "内臓[ないぞう]と足[あし]は水[みず]で洗[あら]いなさい。祭司[さいし]はすべてを持[も]って来[き]て祭壇[さいだん]の上[うえ]に置[お]きなさい。それは焼[や]き尽[つ]くす捧[ささ]げ物[もの]、主[しゅ]に芳[かんば]しい香[かおり]となる犠牲[ぎせい]である。"
  14: "もしあなたが鳥[とり]のうちから、主[しゅ]に焼[や]き尽[つ]くす捧[ささ]げ物[もの]を献[ささ]げるなら、山鳩[やまばと]か家鳩[いえばと]のうちから、その捧[ささ]げ物[もの]を献[ささ]げなさい。"
  15: "祭司[さいし]はそれを祭壇[さいだん]に持[も]って来[き]て、その頭[あたま]をもぎ取[と]り、祭壇[さいだん]の上[うえ]に置[お]きなさい。血[ち]は祭壇[さいだん]の基[もとい]のところに絞[しぼ]り出[だ]しなさい。"
  16: "その喉[のど]の袋[ふくろ]を羽[はね]とともに取[と]り除[のぞ]き、祭壇[さいだん]のそばの東側[ひがしがわ]、灰[はい]を置[お]く場所[ばしょ]に捨[す]てなさい。"
  17: "それを翼[つばさ]のところで裂[さ]きなさい。ただし、切[き]り離[はな]してはならない。祭司[さいし]はそれを祭壇[さいだん]の上[うえ]、火[ひ]の上[うえ]の薪[たきぎ]の上[うえ]に置[お]きなさい。それは焼[や]き尽[つ]くす捧[ささ]げ物[もの]、主[しゅ]に芳[かんば]しい香[かおり]となる犠牲[ぎせい]である。」"

notes:
  1: "ἀνεκάλεσεν — воззвал (καλέω); ἐκ τῆς σκηνῆς τοῦ μαρτυρίου — 証の幕屋 (σκηνὴ τοῦ μαρτυρίου, «скиния свидетельства»; в корпусе уже 証の幕屋). λέγων — «говоря»."
  2: "Ἄνθρωπος ἐξ ὑμῶν — あなたがたのうちのだれか (букв. «человек из вас»). ἐὰν προσαγάγῃ δῶρα — если принесёт дары. ἀπὸ τῶν κτηνῶν — из скота (κτῆνος — домашний скот). βοῶν — крупный рогатый скот, προβάτων — мелкий."
  3: "ὁλοκαύτωμα — 燔祭. ἄρσεν ἄμωμον — мужского пола, без порока (ἄμωμος — «непорочный»). προσάξει / προσοίσει — «приведёт / принесёт». δεκτὸν ἐναντίον κυρίου — «приятное пред Господом» (слав. «приятно пред Господем»)."
  4: "ἐπιθήσει τὴν χεῖρα ἐπὶ τὴν κεφαλήν — возложит руку на голову (знак передачи и посвящения). καρπώματος — приношения. δεκτὸν αὐτῷ ἐξιλάσασθαι περὶ αὐτοῦ — «приятно ему, чтобы умилостивить о нём»."
  5: "σφάξουσι — заколют (3-е л. мн. ч.; субъект — приносящий). προσχεοῦσιν — «прольют вокруг»: кровь возливается у жертвенника, не кропится (ср. 4:6). θυσιαστήριον — 祭壇."
  6: "ἐκδείραντες — сняв кожу. μελιοῦσιν αὐτὸ κατὰ μέλη — рассекут на части (μελίζω, дорийская форма будущего)."
  7: "ἐπιθήσουσιν πῦρ — «положат огонь»; ἐπιστοιβάσουσιν — «разложат в ряд» (ἐπιστοιβάζω)."
  8: "διχοτομήματα — рассечённые части; στέαρ — тук, жир (脂肪)."
  9: "ἐγκοίλια — внутренности; κάρπωμα — «сожигаемое»; θυσία — жертва; ὀσμὴ εὐωδίας — «запах благоухания» (слав. «воня благоухания»). Формула повторяется в 13 и 17."
  10: "ἀρνῶν — агнцев; ἐρίφων — козлят. εἰς ὁλοκαύτωμα — во всесожжение."
  11: "ἐκ πλαγίων τοῦ θυσιαστηρίου πρὸς βορρᾶν — «с боковой стороны жертвенника, к северу»."
  12: "διελοῦσιν — разделят; ср. 6."
  13: "προσοίσει ὁ ἱερεύς — священник принесёт; формула та же, что в 9."
  14: "τρυγόνων — горлиц; περιστερῶν — голубей. ἀπὸ τῶν πετεινῶν — из птиц."
  15: "ἀποκνίσει τὴν κεφαλήν — «отщипнёт голову» (без ножа, птица); στραγγιεῖ — «выцедит»; βάσις — основание жертвенника."
  16: "πρόλοβος — зоб (горловой мешок); πτερά — перья; σποδός — пепел."
  17: "ἐκκλάσει ἐκ τῶν πτερύγων — «надломит в крыльях»; οὐ διελεῖ — не разделит. Ср. слав. «да изломит его от крил, и да не разделит»."
