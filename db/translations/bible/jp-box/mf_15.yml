verses:
  1: "エルサレムからファリサイ派[は]と律法学者[りっぽうがくしゃ]たちがやって来[き]て、イエスに問[と]いかけた。"
  2: "「なぜ、あなたの弟子[でし]たちは昔[むかし]の人[ひと]の言[い]い伝[つた]えを破[やぶ]るのですか。彼[かれ]らはパンを食[た]べるときに手[て]を洗[あら]わないからです。」"
  3: "イエスは答[こた]えて言[い]われた。「<j>なぜ、あなたがたも、その言[い]い伝[つた]えのために神[かみ]の掟[おきて]を破[やぶ]るのか。</j>"
  4: "<j>神[かみ]は『父[ちち]と母[はは]を敬[うやま]え』と命[めい]じ、さらに『父[ちち]または母[はは]をののしる者[もの]は死[し]刑[けい]に処[しょ]せられる』とも言[い]われた。</j>"
  5: "<j>しかし、あなたがたは言[い]っている。『父[ちち]または母[はは]に「あなたに差[さ]し上[あ]げるべきものは、神[かみ]への供[そな]え物[もの]である」と言[い]う者[もの]は、</j>"
  6: "<j>父[ちち]〔または母[はは]〕を敬[うやま]わなくてもよい』と。あなたがたの言[い]い伝[つた]えのゆえに、神[かみ]の仰[おお]せは空[むな]しくされた。</j>"
  7: "<j>偽善者[ぎぜんしゃ]たちよ。イザヤがあなたがたのことを語[かた]った預言[よげん]は、見事[みごと]に言[い]い当[あ]てている。</j>"
  8: "<j>『この民[たみ]は唇[くちびる]ではわたしを崇[あが]めても、その心[こころ]はわたしから遠[とお]く隔[へだ]たっている。</j>"
  9: "<j>人[ひと]の定[さだ]めを教[おし]えとして教[おし]え、わたしをあがめても空[むな]しい。』</j>」"
  10: "そしてイエスは群衆[ぐんしゅう]を手[て]近[ぢか]に呼[よ]び、「<j>よく聞[き]いて、悟[さと]りなさい。</j>"
  11: "<j>人[ひと]を汚[けが]すのは、口[くち]に入[はい]るものではなく、口[くち]から出[で]て来[く]るものなのである。</j>」"
  12: "そこで、弟子[でし]たちが近[ちか]づいて来[き]て言[い]った。「ファリサイ派[は]の人々[ひとびと]が、この言葉[ことば]を聞[き]いてつまずいたのをご存[ぞん]じですか。」"
  13: "イエスは答[こた]えられた。「<j>天[てん]におられるわたしの父[ちち]がお植[う]えにならなかったものは、どれも根[ね]から引[ひ]き抜[ぬ]かれる。</j>"
  14: "<j>彼[かれ]らは盲人[もうじん]の道案内[みちあんない]をする盲人[もうじん]である。盲人[もうじん]が盲人[もうじん]を導[みちび]けば、二人[ふたり]とも穴[あな]に落[お]ちてしまう。</j>」"
  15: "すると、ペトロが答[こた]えて言[い]った。「そのたとえを説明[せつめい]してください。」"
  16: "そこでイエスは言[い]われた。「<j>あなたがたまでも、まだ分[わ]からないというのか。</j>"
  17: "<j>口[くち]から入[はい]ったものはみな、腹[はら]を経[へ]て外[そと]へ捨[す]て出[だ]される、それが分[わ]からないのか。</j>"
  18: "<j>だが、口[くち]から出[で]るものは心[こころ]の内[うち]から来[く]る。それが人[ひと]を汚[けが]すのだ。</j>"
  19: "<j>心[こころ]からは、悪[わる]い思[おも]い、殺[さつ]意[い]、姦淫[かんいん]、淫[いん]らな行[おこな]い、盗[ぬす]み、偽証[ぎしょう]、冒涜[ぼうとく]が出[で]て来[く]るからである。</j>"
  20: "<j>これらが人[ひと]を汚[けが]すのである。しかし、手[て]を洗[あら]わずに食[た]べることは、人[ひと]を汚[けが]さない。</j>」"
  21: "イエスはその地[ち]を去[さ]り、ティルスとシドンの地方[ちほう]へと移[うつ]られた。"
  22: "そこへ、カナンの女[おんな]がその地方[ちほう]からやって来[き]て、「主[しゅ]よ、ダビデの子[こ]よ、どうかわたしを憐[あわ]れんでください。娘[むすめ]が悪霊[あくりょう]にひどく苦[くる]しめられているのです」と叫[さけ]び続[つづ]けた。"
  23: "しかし、イエスは一言[ひとこと]もお答[こた]えにならなかった。そこで、弟子[でし]たちが近[ちか]づいて来[き]て、「この女[おんな]を追[お]い払[はら]ってください。後[あと]から叫[さけ]んでついて来[き]ますので」と願[ねが]った。"
  24: "イエスはお答[こた]えになった。「<j>わたしは、イスラエルの家[いえ]の失[うしな]われた羊[ひつじ]のところへしか遣[つか]わされていない。</j>」"
  25: "女[おんな]は近[ちか]づいてイエスを拝[おが]み、「主[しゅ]よ、わたしを助[たす]けてください」と願[ねが]った。"
  26: "イエスはお答[こた]えになった。「<j>子[こ]どもたちのパンを取[と]って小犬[こいぬ]たちに投[な]げ与[あた]えるのは、よくないことである。</j>」"
  27: "女[おんな]は言[い]った。「主[しゅ]よ、そのとおりです。しかし、小犬[こいぬ]も主人[しゅじん]たちの食卓[しょくたく]から落[お]ちるパン屑[ぱんくず]はいただきます。」"
  28: "イエスはお答[こた]えになった。「<j>婦人[ふじん]よ、あなたの信仰[しんこう]は大[おお]きい。あなたの望[のぞ]むとおりになれ。</j>」こうして、娘[むすめ]はその時[とき]から癒[いや]された。"
  29: "そこを立[た]ち去[さ]ったイエスは、ガリラヤ湖[みずうみ]の岸[きし]へ来[こ]られ、山[やま]に上[のぼ]って腰[こし]を下[お]ろされた。"
  30: "大[おお]ぜいの群衆[ぐんしゅう]が、足[あし]の不自由[ふじゆう]な者[もの]、目[め]の見[み]えぬ者[もの]、体[からだ]の不自由[ふじゆう]な者[もの]、口[くち]の利[き]けぬ者[もの]、そのほか多[おお]くの病人[びょうにん]を伴[ともな]って来[き]て、イエスの足[あし]もとへ横[よこ]たえた。そこで、イエスは彼[かれ]らをお癒[いや]しになった。"
  31: "口[くち]の利[き]けぬ者[もの]が物[もの]を言[い]い、体[からだ]の不自由[ふじゆう]な者[もの]が元[もと]どおりになり、足[あし]の不自由[ふじゆう]な者[もの]が歩[あゆ]み出[だ]し、目[め]の見[み]えぬ者[もの]が物[もの]を見[み]るようになるのを、群衆[ぐんしゅう]は目[め]の当[あ]たりにして驚[おどろ]き、イスラエルの神[かみ]をほめたたえた。"
  32: "イエスは弟子[でし]たちをそばへ呼[よ]んで言[い]われた。「<j>わたしはこの人々[ひとびと]を心[こころ]から憐[あわ]れむ。もう三日[みっか]にもなろうとしているのに、わたしのもとにいて、食[た]べる物[もの]がない。飢[う]えたまま帰[かえ]したくはない。道中[どうちゅう]で力[ちから]尽[つ]きてしまうといけないから。</j>」"
  33: "弟子[でし]たちが言[い]った。「こんな人[ひと]けのない所[ところ]で、これだけの人[ひと]を満腹[まんぷく]させるパンを、いったいどこで手[て]に入[い]れられるのでしょう。」"
  34: "イエスは言[い]われた。「<j>パンは幾[いく]つあるか。</j>」弟子[でし]たちは答[こた]えた。「七[なな]つあります。それに、小[ちい]さな魚[さかな]が少[すこ]しばかり。」"
  35: "イエスは群衆[ぐんしゅう]が地面[じめん]に腰[こし]を下[お]ろすようお命[めい]じになり、"
  36: "パンを七[なな]つ、魚[さかな]とともに取[と]り、神[かみ]に感謝[かんしゃ]して裂[さ]き割[わ]り、弟子[でし]たちへ手渡[てわた]された。弟子[でし]たちはそれを群衆[ぐんしゅう]に分[わ]け与[あた]えた。"
  37: "全員[ぜんいん]が腹[はら]いっぱい食[た]べた。食[た]べ残[のこ]りのパン屑[ぱんくず]をかき集[あつ]めると、七[なな]つの籠[かご]が満[み]ちあふれた。"
  38: "食[た]べた者[もの]の数[かず]は、女[おんな]や子[こども]を別[べつ]にすれば、男[おとこ]だけで四千人[よんせんにん]であった。"
  39: "群衆[ぐんしゅう]を帰[かえ]したイエスは、舟[ふね]でマグダラの地方[ちほう]へ渡[わた]られた。"

notes:
  2: "παράδοσις τῶν πρεσβυτέρων — «предание старцев»; как в Мк 7:3 — 昔の人の言い伝え. ὅταν ἄρτον ἐσθίωσιν — «когда едят хлеб», поставил パンを食べるときに (у jp-ni «食事の前に»). Сноску на ファリサイ派 не повторяю (Мф 3:7)."
  4: "κακολογῶν — ののしる, как в Мк 7:10; вторую заповедь ввёл через さらに…とも."
  5: "δῶρον — «дар (Богу)»; в отличие от Мк 7:11 здесь нет κορβάν, поэтому сноски нет."
  6: "В критической базе только «…οὐ μὴ τιμήσει τὸν πατέρα αὐτοῦ»; Церковь (Елизаветинская, jp-joc 父或は母) читает и «или матерь» — добавка в 〔または母〕. ἠκυρώσατε — 空しくする; λόγος τοῦ θεοῦ — 仰せ (в Мк 7:13 — 神の言葉を無にする)."
  8: "χείλεσιν — 唇では (в Мк 7:6 — 口先では); πόρρω ἀπέχει — 遠く隔たっている."
  9: "ἐντάλματα ἀνθρώπων — 人の定め (в Мк 7:7 — 人間の戒め); μάτην — 空しい."
  10: "προσκαλεσάμενος — «подозвав»; 手近に呼び. У jp-ni «呼び寄せて»."
  14: "ἄφετε αὐτούς — «оставьте их»; у jp-ni «そのままにしておきなさい». ἐὰν ὁδηγῇ — «если поведёт», поэтому 落ちてしまう, а не «упадут»."
  17: "εἰς ἀφεδρῶνα ἐκβάλλεται — «извергается в отхожее место»; не сглаживал, передал 外へ捨て出される."
  19: "διαλογισμοὶ πονηροί — «злые помыслы»; у jp-ni «悪意»."
  21: "ἀνεχώρησεν — «удалился»; その地を去り…移られた, εἰς τὰ μέρη Τύρου καὶ Σιδῶνος — ティルスとシドンの地方."
  22: "Χαναναία — хананеянка (у Марка 7:26 — сирофиникиянка); カナンの女, как у jp-ni. κράζει — имперфект «кричала», передал 叫び続けた."
  23: "ἀπόλυσον αὐτήν — «отпусти её»; у jp-ni «追い払ってください», оставил."
  24: "οὐκ ἀπεστάλην εἰ μή — «Я послан только к…»; 〜ところへしか遣わされていない."
  25: "προσεκύνει — «поклонялась»; 拝み, у jp-ni «ひれ伏し»."
  26: "κυνάρια — уменьшительное «собачки»; 小犬, как в Мк 7:27. Сноски нет — слово понятно."
  27: "καὶ γὰρ — «ибо и»; そのとおりです…しかし."
  28: "μεγάλη σου ἡ πίστις — あなたの信仰は大きい; ἀπὸ τῆς ὥρας ἐκείνης — そのときから."
  30: "κυλλούς — «увечные» (с иссохшей рукой); 体の不自由な者. Порядок членов списка сохранён по византийскому тексту."
  31: "Порядок чудес в 31 отличается от списка в 30 (κωφοί, κυλλοί, χωλοί, τυφλοί) — сохранён порядок греческого, не выровнен."
  32: "σπλαγχνίζομαι — 心から憐れむ (в 14:14 — 深く憐れみ); νήστεις — 飢えたまま."
  36: "εὐχαριστήσας — «благодарив»; 神に感謝して (в 14:19 стоит εὐλόγησεν — там 賛美の祈り)."
  39: "В критической базе Μαγαδάν; церковное чтение (Елизаветинская «в пределы Магдалински», jp-joc マグダラ) — マグダラ. Это вариант имени, а не добавка, поэтому без 〔〕."
