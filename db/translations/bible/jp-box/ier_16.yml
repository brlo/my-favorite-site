verses:
  1: "主[しゅ]の言葉[ことば]がわたしに臨[のぞ]んで言[い]った。「あなたは妻[つま]を娶[めと]ってはならない、とイスラエルの神[かみ]である主[しゅ]は言[い]われる。"
  2: "この場所[ばしょ]では、あなたに息子[むすこ]も娘[むすめ]も生[う]まれないであろう。"
  3: "主[しゅ]は、この場所[ばしょ]で生[う]まれる息子[むすこ]と娘[むすめ]、彼[かれ]らを産[う]む母[はは]たち、この地[ち]で彼らを生[う]んだ父[ちち]たちについて、こう言[い]われる。"
  4: "彼[かれ]らは苦[くる]しみの死[し]を遂[と]げ、泣[な]かれることも葬[ほうむ]られることもない。彼らは地[ち]の面[おもて]で見[み]せしめとなり、地[ち]の獣[けもの]、天[てん]の鳥[とり]のえじきとなる。彼らは剣[つるぎ]で倒[たお]れ、飢[うえ]で滅[ほろ]びる。"
  5: "主[しゅ]はこう言[い]われる。彼[かれ]らの宴[うたげ]の家[いえ]に入[はい]ってはならない。泣[な]きに行[い]くことも、彼らを嘆[なげ]くこともしてはならない。わたしはこの民[たみ]から、わたしの平和[へいわ]を、あわれみと慈[いつく]しみをも取[と]り去[さ]ったからである、と主[しゅ]は言[い]われる。"
  6: "大[おお]きい者[もの]も小[ちい]さい者[もの]もこの地[ち]で死[し]ぬ。彼らは葬[ほうむ]られず、泣[な]かれもせず、彼らのために身[み]を切[き]り裂[さ]くことも、髪[かみ]を剃[そ]ることもない。"
  7: "彼[かれ]らの嘆[なげ]きのうちに、死[し]んだ者[もの]を慰[なぐさ]めるためにパンを裂[さ]く者[もの]はなく、父[ちち]や母[はは]のために慰[なぐさ]めの杯[さかずき]を差[さ]し出[だ]す者もない。"
  8: "また、彼[かれ]らとともに座[すわ]って食[た]べ、飲[の]むために、酒宴[しゅえん]の家[いえ]に入[はい]ってはならない。"
  9: "万軍[ばんぐん]の主[しゅ]、イスラエルの神[かみ]はこう言[い]われる。見[み]よ、わたしはあなたがたの目[め]の前[まえ]、あなたがたの日[ひ]のうちに、この場所[ばしょ]から喜[よろこ]びの声[こえ]と楽[たの]しみの声、花婿[はなむこ]の声と花嫁[はなよめ]の声を絶[た]つ。"
  10: "あなたがこの民[たみ]にこれらすべての言葉[ことば]を告[つ]げる時、彼[かれ]らはあなたに言[い]うであろう。『なぜ主[しゅ]はわれわれにこれらすべての災[わざわ]いを語[かた]られたのか。われわれの不義[ふぎ]とは何[なに]か。われわれがわれわれの神[かみ]である主[しゅ]の前[まえ]に犯[おか]した罪[つみ]とは何か。』"
  11: "あなたは彼[かれ]らに言[い]うであろう。あなたがたの父[ちち]たちがわたしを捨[す]て、他[ほか]の神[かみ]々[がみ]の後[あと]について行[い]き、それらに仕[つか]え、それらを拝[おが]み、わたしを捨ててわたしの律法[りっぽう]を守[まも]らなかったからである、と主[しゅ]は言[い]われる。"
  12: "しかし、あなたがたは父[ちち]たちよりも悪[わる]いことをした。見[み]よ、あなたがたはおのおの、わたしに聞[き]き従[したが]わないために、自分[じぶん]の悪[わる]い心[こころ]の望[のぞ]むままに歩[あゆ]んでいる。"
  13: "だから、わたしはあなたがたをこの地[ち]から、あなたがたも父[ちち]たちも知[し]らなかった地[ち]へ追[お]い出[だ]す。そこであなたがたは昼[ひる]も夜[よる]も他[ほか]の神[かみ]々[がみ]に仕[つか]えるが、それらはあなたがたにあわれみを与[あた]えない。"
  14: "それゆえ、見[み]よ、日[ひ]が来[く]る、と主[しゅ]は言[い]われる。人[ひと]々[びと]はもはや、『イスラエルの子[こ]らをエジプトの地[ち]から上[のぼ]らせた主[しゅ]は生[い]きておられる』とは言[い]わない。"
  15: "『イスラエルの子[こ]らを北[きた]の地[ち]から、また彼[かれ]らが追[お]いやられたすべての国[くに]々[ぐに]から上[のぼ]らせた主[しゅ]は生[い]きておられる』と言[い]う。わたしは彼らを、彼らの父[ちち]たちに与[あた]えた彼らの地[ち]に帰[かえ]らせる。"
  16: "見[み]よ、わたしは多[おお]くの漁師[りょうし]を遣[つか]わす、と主[しゅ]は言[い]われる。彼らはその者[もの]たちを釣[つ]り上[あ]げる。その後[のち]、わたしは多くの狩人[かりゅうど]を遣わし、彼らはすべての山[やま]、すべての丘[おか]の上[うえ]、また岩[いわ]の裂[さ]け目[め]から、その者たちを狩[か]り出[だ]す。"
  17: "わたしの目[め]は彼[かれ]らのすべての道[みち]の上[うえ]にあり、彼らの不法[ふほう]はわたしの顔[かお]から隠[かく]れず、わたしの目[め]からも隠[かく]されない。"
  18: "まず、わたしは彼[かれ]らの不法[ふほう]と罪[つみ]を二倍[にばい]にして返[かえ]す。彼らが自分[じぶん]の忌[い]むべきものの死骸[しがい]でわたしの地[ち]を汚[けが]し、その不法でわたしの嗣業[しぎょう]を満[み]たしたからである。」"
  19: "「主[しゅ]よ、あなたはわたしの力[ちから]、わたしの助[たす]け、災[わざわ]いの日[ひ]の逃[に]げ場[ば]である。地[ち]の果[は]てから国[くに]々[ぐに]があなたのもとに来[き]て言[い]う。『まことに、われわれの父[ちち]たちは偽[いつわ]りのもの、すなわち偶像[ぐうぞう]を嗣[つ]いだ。それらの中[なか]には益[やく]がない。"
  20: "人間[にんげん]が自分[じぶん]のために神[かみ]を造[つく]ることができるだろうか。しかし、それらは神[かみ]ではない。』」"
  21: "「それゆえ、見[み]よ、わたしはこの時[とき]、彼[かれ]らにわたしの手[て]を示[しめ]し、わたしの力[ちから]を知[し]らせる。そして彼らは、わたしの名[な]が主[しゅ]であることを知[し]る。」"

notes:
  1: "Слав. 16:1 добавляет вводную формулу «И бысть слово Господне ко мне, рекущее» — в LXX её нет (греч. стих начинается с Καὶ σὺ μὴ λάβῃς γυναῖκα); по паритету внесена в основной текст без 〔…〕. μὴ λάβῃς γυναῖκα — «не возьми себе жены» (λαμβάνω — брать; о браке). λέγει κύριος ὁ θεὸς Ισραηλ — «говорит Господь Бог Израилев»: формула оставлена внутри кавычек, чтобы не разрывать начатую речь (как в is 1:11). У ru по МТ формула вынесена в ст. 1, а запрет — в ст. 2; держим деление gr."
  2: "οὐ γεννηθήσεταί σοι υἱὸς οὐδὲ θυγάτηρ — «не родится тебе ни сын, ни дочь» (γεννάω — рождать); ἐν τῷ τόπῳ τούτῳ — «на месте сем». Слав. «ниже дщерь» — «и не дочь». У ru этот стих соединён с запретом брака (МТ), у gr и csl он отдельный: держим gr."
  3: "τάδε λέγει κύριος περὶ τῶν υἱῶν… — «так говорит Господь о сыновьях…»; τῶν γεννωμένων ἐν τῷ τόπῳ τούτῳ — «рождаемых на месте сем»; τῶν τετοκυιῶν αὐτούς — «родивших их» (о матерях); τῶν γεγεννηκότων αὐτοὺς ἐν τῇ γῇ ταύτῃ — «произведших их на земле сей» (об отцах). Слав. «яже родиша их» и «родивших я в земли сей»; троекратный охват (дети, матери, отцы) сохранён."
  4: "Ἐν θανάτῳ νοσερῷ ἀποθανοῦνται — «смертью мучительной умрут» (νοσερός — болезненный, тяжкий); слав. «смертию лютою изомрут». οὐ κοπήσονται καὶ οὐ ταφήσονται — «не будут оплаканы и не будут погребены» (κόπτομαι — бить себя в грудь в знак траура). εἰς παράδειγμα ἐπὶ προσώπου τῆς γῆς — «в пример (на позор) на лице земли»; слав. «во образ на лицы земли». καὶ τοῖς θηρίοις τῆς γῆς καὶ τοῖς πετεινοῖς τοῦ οὐρανοῦ — «и зверям земным и птицам небесным»; слав. разворачивает: «и будут трупие их во снедь птицам небесным и зверем земным» (обратный порядок, добавлено «в снедь»). Держим порядок gr, «в снедь» передано словом えじき. ἐν μαχαίρᾳ πεσοῦνται καὶ ἐν λιμῷ συντελεσθήσονται — «мечом падут и голодом скончаются»; у слав. этот член стоит раньше — держим порядок gr."
  5: "θίασος — «сборище, хоровод, пирушка»; слав. «дом пирный», ru «дом сетующих» (МТ: дом плача). В тексте 宴の家 — по csl. μὴ πορευθῇς τοῦ κόψασθαι — «не ходи плакать»; μὴ πενθήσῃς αὐτούς — «не оплакивай их». ἀφέστακα τὴν εἰρήνην μου ἀπὸ τοῦ λαοῦ τούτου — «Я отнял (удалил) мир Мой от народа сего» (ἀφίστημι, перфект). Слав. добавляет в конце «милость и щедроты» (ἔλεος καὶ οἰκτιρμούς) — в LXX этого нет; по паритету внесено в основной текст без 〔…〕 (あわれみと慈しみ)."
  6: "Слав. в начале добавляет «И умрут велицыи и малии в земли сей» — в LXX нет (чтение МТ); внесено без 〔…〕. οὐ μὴ κόψωνται αὐτούς — «не оплачут их»; ἐντομίδας οὐ μὴ ποιήσωσιν — «надрезов не сделают» (ἐντομίς — надрез на теле в знак траура, ср. Лев 19:28; слав. «терзание о них»); οὐ ξυρήσονται — «не обреются» (ξυράω — брить; слав. «обриются ради их»)."
  7: "κλασθῇ ἄρτος — «преломится хлеб» (κλάω — ломать; хлеб поминальной трапезы); ἐν πένθει αὐτῶν — «в плаче их»; εἰς παράκλησιν — «в утешение» (παράκλησις); ἐπὶ τεθνηκότι — «над умершим». οὐ ποτιοῦσιν αὐτὸν ποτήριον — «не напоят его чашей» (ποτίζω — поить); εἰς παράκλησιν ἐπὶ πατρὶ καὶ μητρὶ αὐτοῦ — «в утешение об отце и матери его». Речь о поминальном обычае; слав. «ко утешению над мертвым… над отцем и материю их»."
  8: "εἰς οἰκίαν πότου — «в дом питья (пира)» (πότος — пиршество); συγκαθίσαι μετ᾽ αὐτῶν — «сесть вместе с ними»; τοῦ φαγεῖν καὶ πιεῖν — «чтобы есть и пить». Слав. «в дом пирный да не внидеши седети с ними, еже ясти и пити»."
  9: "καταλύω ἐκ τοῦ τόπου τούτου — «уничтожу (прекращу) с места сего» (καταλύω — разрушать, отменять); ἐνώπιον τῶν ὀφθαλμῶν ὑμῶν — «пред очами вашими»; ἐν ταῖς ἡμέραις ὑμῶν — «во дни ваши». φωνὴν χαρᾶς καὶ φωνὴν εὐφροσύνης — «голос радости и голос веселья»; φωνὴν νυμφίου καὶ φωνὴν νύμφης — «голос жениха и голос невесты». Слав. «Господь сил» (Σαβαωθ) при gr κύριος ὁ θεὸς Ισραηλ — добавка csl, в LXX нет; внесена как 万軍の主."
  10: "ἀναγγείλῃς τῷ λαῷ τούτῳ ἅπαντα τὰ ῥήματα ταῦτα — «возвестишь народу сему все слова сии». Вопрос народа — прямая речь внутри слова Господа, поэтому 『…』. Διὰ τί ἐλάλησεν κύριος ἐφ᾽ ἡμᾶς πάντα τὰ κακὰ ταῦτα; — «за что изрёк на нас Господь все эти беды?»; τίς ἡ ἀδικία ἡμῶν — «какая наша неправда»; ἣν ἡμάρτομεν ἔναντι κυρίου τοῦ θεοῦ ἡμῶν — «которым согрешили пред Господом Богом нашим». У ru вопрос оформлен как цитата народа — совпадает."
  11: "Ἀνθ᾽ ὧν — «за то, что» (ἀντὶ τούτων); ἐγκατέλιπόν με οἱ πατέρες ὑμῶν — «оставили Меня отцы ваши»; ᾤχοντο ὀπίσω θεῶν ἀλλοτρίων — «пошли вслед богов чужих»; ἐδούλευσαν αὐτοῖς καὶ προσεκύνησαν αὐτοῖς — «послужили им и поклонились им»; τὸν νόμον μου οὐκ ἐφυλάξαντο — «закона Моего не сохранили». «И скажи им» (καὶ ἐρεῖς αὐτοῖς) вводит эти слова, но они даны как речь самого Господа — без второго уровня кавычек (ср. is 38:5)."
  12: "ἐπονηρεύσασθε ὑπὲρ τοὺς πατέρας ὑμῶν — «вы сделали хуже отцов ваших» (πονηρεύομαι — поступать зло); ἕκαστος ὀπίσω τῶν ἀρεστῶν τῆς καρδίας ὑμῶν τῆς πονηρᾶς — «каждый вслед угодного сердцу вашему злому» (τὰ ἀρεστά — угодное); τοῦ μὴ ὑπακούειν μου — «чтобы не слушать Меня». Слав. «горше деласте, неже отцы ваши… кийждо вслед похотей сердца вашего лукаваго»."
  13: "ἀπορρίψω ὑμᾶς ἀπὸ τῆς γῆς ταύτης — «извергну вас из земли сей»; εἰς τὴν γῆν ἣν οὐκ ᾔδειτε — «в землю, которой не знали»; δουλεύσετε ἐκεῖ θεοῖς ἑτέροις — «будете там служить иным богам»; οἳ οὐ δώσουσιν ὑμῖν ἔλεος — «которые не дадут вам милости». Слав. добавляет «день и нощь» (в LXX нет; чтение МТ) — внесено без 〔…〕. У ru «ибо Я не окажу вам милосердия» — иное понимание того же места (МТ)."
  14: "Διὰ τοῦτο ἰδοὺ ἡμέραι ἔρχονται — «посему вот, приходят дни»; οὐκ ἐροῦσιν ἔτι — «не скажут более». Клятвенная формула Ζῇ κύριος — «жив Господь» (букв. «живёт Господь»); в тексте 生[い]きておられる. ὁ ἀναγαγὼν τοὺς υἱοὺς Ισραηλ ἐκ γῆς Αἰγύπτου — «Который вывел сынов Израилевых из земли Египетской». Формула — слова народа, поэтому 『…』: открывается здесь, закрывается в 15."
  15: "ἀνήγαγεν τὸν οἶκον Ισραηλ ἀπὸ γῆς βορρᾶ — «вывел дом Израилев из земли северной»; слав. «сынов израилевых», как в ст. 14 и в МТ, поэтому в тексте イスラエルの子ら, а вариант LXX «дом Израилев» — здесь в notes. ἀπὸ πασῶν τῶν χωρῶν, οὗ ἐξώσθησαν ἐκεῖ — «из всех стран, куда они были изгнаны» (ἐξωθέω — выталкивать, изгонять); ἀποκαταστήσω αὐτοὺς εἰς τὴν γῆν αὐτῶν — «возвращу их в землю их»; ἣν ἔδωκα τοῖς πατράσιν αὐτῶν — «которую Я дал отцам их». Клятва закрывается 『』, обещание возвращения — прямая речь Господа в 「…」 (цитата 1–18 не закрывается)."
  16: "ἁλεεῖς τοὺς πολλούς — «рыболовов многих» (ἁλιεύς); ἁλιεύσουσιν αὐτούς — «уловят их»; θηρευτάς — «ловцов, охотников» (θηρευτής); θηρεύσουσιν — «будут ловить»; ἐπάνω παντὸς ὄρους καὶ ἐπάνω παντὸς βουνοῦ — «на всякой горе и на всяком холме»; ἐκ τῶν τρυμαλιῶν τῶν πετρῶν — «из расселин (нор) скал» (τρυμαλιά — нора, щель). Слав. «рыбари многи… ловцы… от пещер каменных». Образ ловли людей — ср. Ам 4:2; Авв 1:15."
  17: "οἱ ὀφθαλμοί μου ἐπὶ πάσας τὰς ὁδοὺς αὐτῶν — «очи Мои на всех путях их»; οὐκ ἐκρύβη τὰ ἀδικήματα αὐτῶν — «не скрылись беззакония их»; ἀπέναντι τῶν ὀφθαλμῶν μου — «от очей Моих». Слав. даёт двойное выражение: «не сокровени суть от лица моего, и не утаена суть беззакония их от очию моею» — в LXX второй член не выражен отдельно; по паритету оба сохранены (…顔から隠れず、…目からも隠されない)."
  18: "ἀνταποδώσω διπλᾶς — «воздам вдвойне» (διπλᾶ — двойное; ἀνταποδίδωμι — воздавать); слав. «воздам первее сугубая» — «первее» в LXX нет, внесено (まず). ἐφ᾽ αἷς ἐβεβήλωσαν τὴν γῆν μου — «которыми осквернили землю Мою» (βεβηλόω — осквернять); ἐν τοῖς θνησιμαίοις τῶν βδελυγμάτων αὐτῶν — «мертвечинами мерзостей их» (θνησιμαῖον — падаль, труп; βδέλυγμα — мерзость); ἐπλημμέλησαν τὴν κληρονομίαν μου — «провинились против наследия Моего» (πλημμελέω), слав. «наполниша достояние мое» — иное понимание, ближе к МТ; держим csl (満たした). Здесь закрывается слово Господа 1–18."
  19: "κύριε ἰσχύς μου καὶ βοήθειά μου καὶ καταφυγή μου — «Господи, крепость моя и помощь моя и прибежище моё»; ἐν ἡμέρᾳ κακῶν — «в день зол», слав. «во днех злых». πρὸς σὲ ἔθνη ἥξουσιν ἀπ᾽ ἐσχάτου τῆς γῆς — «к Тебе придут народы от края земли»; Ὡς ψευδῆ ἐκτήσαντο οἱ πατέρες ἡμῶν εἴδωλα — «как ложное стяжали отцы наши — идолов» (ψευδῆ — ложное, κτάομαι — приобретать, наследовать); καὶ οὐκ ἔστιν ἐν αὐτοῖς ὠφέλημα — «и нет в них пользы» (ὠφέλημα). Молитва пророка — 「…」; слова народов — 『…』 (ср. ru «только ложь наследовали наши отцы»)."
  20: "εἰ ποιήσει ἑαυτῷ ἄνθρωπος θεούς; — «разве сделает себе человек богов?» (εἰ в вопросе — «разве»); καὶ οὗτοι οὔκ εἰσιν θεοί — «а они не боги». Стих отнесён к речи народов (『…』 закрывается здесь), так как по смыслу продолжает их рассуждение об идолах; возможно понимать и как реплику пророка — тогда 『』 закрывался бы в конце 19. Отмечено как спорное."
  21: "δηλώσω αὐτοῖς ἐν τῷ καιρῷ τούτῳ τὴν χεῖρά μου — «покажу им в это время руку Мою» (δηλόω — являть, показывать); γνωριῶ αὐτοῖς τὴν δύναμίν μου — «явлю (сделаю известной) им силу Мою»; γνώσονται ὅτι ὄνομά μοι κύριος — «узнают, что имя Мне — Господь». Слав. «покажу им во время сие руку мою и знаему сотворю им силу мою». Ответ Господа на молитву 19–20; открывает новую цитату."
