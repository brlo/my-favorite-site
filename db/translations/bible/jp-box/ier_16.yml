# jp-box, Иеремия, глава 16. Черновик для приёмки.
#
# Нумерация — по славянской и Синодальной Библии (масоретский порядок глав):
# так привычнее читателю. В Септуагинте (gr-lxx-byz) эта глава — 16.
# База: Септуагинта; контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# --- прежние заметки (написаны при нумерации по гр.; номера в них — греческие) ---
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный, с МТ) — только для понимания,
# не источник. jp-joc по Иеремии — только фрагменты (гл. 11, 12, 31), для главы 16 его
# нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 16: 1–9 три знамения (не брать жены, не оплакивать, не пировать) и отнятие
# мира; 10–13 вопрос народа и причина плена; 14–15 клятва «жив Господь» — возвращение
# из земли северной; 16–18 рыболовы и ловцы, двойное воздаяние; 19–20 молитва пророка
# и слова народов об идолах; 21 Господь покажет руку Свою.
# Голоса: 16:1–16:18 — 「…」 (одно непрерывное слово Господа, открывается в ст. 1,
# закрывается в конце ст. 18); внутри него 16:10 『…』 (вопрос народа) и 16:14–15 『…』
# (клятвенная формула «жив Господь»); 16:19–20 — 「…」 (молитва пророка), слова народов
# в 19–20 — 『…』; 16:21 — 「…」 (ответ Господа). Вводные формулы («И было слово
# Господне ко мне», «так говорит Господь») — вне кавычек.
# Нумерация по gr: 21 стих; слав. и ru — та же глава 16, но начало разделено иначе:
# у слав. вводная формула «И бысть слово Господне ко мне, рекущее» стоит в 16:1 (в LXX
# её нет), у ru по МТ формула — 16:1, а запрет брака — 16:2. Держим деление gr.
# Слав. добавки внесены в основной текст без 〔…〕 и оговорены: 16:6 «умрут велицыи и
# малии в земли сей», 16:5 «милость и щедроты», 16:9 «Господь сил», 16:13 «день и нощь»,
# 16:18 «первее»; 16:17 слав. даёт двойное выражение — сохранено двумя членами.
# 〔…〕 нет: все 21 стих есть в gr-lxx-byz. Сносок ⟨…⟩ нет: 燔祭, 偶像, 嗣業, 花婿,
# 花嫁, 漁師, 狩人 уже в корпусе или пояснены в notes.
# Имена — транслитерация греческого (LXX): エレミヤ, ユダ, イスラエル, エジプト.
# 
