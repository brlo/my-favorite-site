verses:
  1: "先[さき]に述[の]べたシモンは、金[かね]と国[くに]のことについての密告者[みっこくしゃ]となって、オニアスを悪[わる]く言[い]いふらし、彼[かれ]こそがヘリオドロスを駆[か]り立[た]て、災[わざわ]いの元[もと]を作[つく]ったのだと言[い]った。"
  2: "そして、都[みやこ]の恩人[おんじん]、同胞[どうほう]の後見[こうけん]人[にん]、律法[りっぽう]に熱心[ねっしん]な者[もの]を、事[こと]の企[くわだ]てをねらう者と呼[よ]ぶことをあえてした。"
  3: "しかし、憎[にく]しみはそこまで進[すす]み、ついにシモンが信[しん]用[よう]していた者[もの]の一人[ひとり]によって殺人[さつじん]まで行[おこな]われるようになった。"
  4: "オニアスは、この争[あらそ]いの激[はげ]しさと、ケレ・シリアとフェニキアの将軍[しょうぐん]であるメネステスの子[こ]アポロニオスがシモンの悪[あく]を大[おお]きくしているのを見[み]て、"
  5: "王[おう]のもとへ行[い]った。それは市民[しみん]を告発[こくはつ]するためではなく、すべての民[たみ]のために、共[とも]にも個[こ]人[じん]としても益[えき]となることを考[かんが]えてのことであった。"
  6: "なぜなら、王[おう]の配慮[はいりょ]がなければ、もはや事[こと]が平和[へいわ]のうちに収[おさ]まることはありえず、シモンもその愚[おろ]かさを止[や]めないと見[み]ていたからである。"
  7: "セレウコスがその生[いき]を終[お]え、エピファネスと呼[よ]ばれるアンティオコスが王国[おうこく]を受[う]け継[つ]ぐと、オニアスの兄弟[きょうだい]ヤソンは、策略[さくりゃく]によって大祭司[だいさいし]の座[ざ]を手[て]に入[い]れようとした。"
  8: "そして、謁見[えっけん]の際[さい]に王[おう]へ、銀[ぎん]三百[さんびゃく]六十[ろくじゅう]タラントと、別[べつ]の収入[しゅうにゅう]から八十[はちじゅう]タラントを払[はら]うと約束[やくそく]した。"
  9: "そのうえ、自分[じぶん]の権限[けんげん]で体育所[たいいくしょ]と青年[せいねん]の訓練所[くんれんじょ]を建[た]て、エルサレムの人[ひと]々[びと]をアンティオキア人として登録[とうろく]することが許[ゆる]されるなら、さらに百五十[ひゃくごじゅう]タラントを上[うわ]乗[の]せして払うと約束した。"
  10: "王[おう]が同意[どうい]し、彼[かれ]がその職権[しょっけん]を手[て]に入[い]れると、ただちに同胞[どうほう]たちをギリシア風[ふう]の習[なら]わしへと移[うつ]し始[はじ]めた。"
  11: "そして、ヨハネによってユダヤ人[じん]に認[みと]められていた人[じん]道[どう]的[てき]な王[おう]の特権[とっけん]を押[お]し捨[す]てた。ヨハネは、ローマ人[じん]との友好[ゆうこう]と同盟[どうめい]の使節[しせつ]となったエウポレモスの父[ちち]である。彼は、合法[ごうほう]の制度[せいど]を打[う]ち壊[こわ]し、不法[ふほう]な慣習[かんしゅう]を新[あら]たに持[も]ち込[こ]んだ。"
  12: "というのは、彼[かれ]は喜[よろこ]んで城塞[じょうさい]のすぐ下[した]に体育所[たいいくしょ]を設[もう]け、最[さい]良[りょう]の青年[せいねん]たちを従[したが]わせてペタソスの帽[ぼうし]をかぶらせたからである。"
  13: "このようにして、ギリシア風[ふう]の習[なら]わしに一[ひと]つの勢[いきお]いが生[しょう]じ、外国[がいこく]風[ふう]の暮[く]らしへの傾[かたむ]きが進[すす]んだ。それは、不敬[ふけい]な者[もの]であり、もはや大祭司[だいさいし]ではないヤソンの、度[ど]を越[こ]えた不敬[ふけい]のゆえであった。"
  14: "そのため、祭司[さいし]たちはもはや祭壇[さいだん]の務[つと]めに熱心[ねっしん]ではなくなり、神殿[しんでん]を軽[かろ]んじ、犠牲[ぎせい]をなおざりにして、円盤[えんばん]が呼[よ]ばれるやいなや、不法[ふほう]な格闘場[かくとうじょう]の催[もよお]しに加[くわ]わろうと急[いそ]いだ。"
  15: "彼らは父[ちち]たちの誉[ほま]れを何[なに]とも思[おも]わず、ギリシア風[ふう]の栄誉[えいよ]を最[さい]上[じょう]のものと考[かんが]えた。"
  16: "そのため、彼らには厳[きび]しい苦[くる]しい事情[じじょう]が降[ふ]りかかった。そして、その習[なら]わしを競[きそ]い求[もと]め、すべてにおいて似[に]せようとした者[もの]たちが、彼らの敵[てき]、罰[ばつ]の執行[しっこう]者[しゃ]となったのである。"
  17: "神[かみ]の律法[りっぽう]に対して不敬[ふけい]を行[おこな]うことは罰[ばつ]を免[まぬか]れない。それについて、後[のち]の時[とき]が明[あき]らかにするであろう。"
  18: "ティルスで五年[ごねん]ごとの競技[きょうぎ]が行[おこな]われ、王[おう]もそこにいたとき、"
  19: "その汚[けが]れたヤソンは、エルサレムから来[き]たアンティオキア人[じん]たちを使者[ししゃ]として遣[つか]わし、ヘラクレスへの犠牲[ぎせい]のために銀[ぎん]三百[さんびゃく]ドラクメを運[はこ]ばせた。しかし、それを運[はこ]んだ者[もの]たちは、犠牲に用[もち]いるのはふさわしくないと求[もと]めて、別[べつ]の出費[しゅっぴ]に充[あ]てようとした。"
  20: "こうして、その金[かね]は、遣[つか]わした者[もの]の意図[いと]ではヘラクレスへの犠牲のためであり、運[はこ]んだ者[もの]たちのためには三[さん]段[だん]漕[そう]船[せん]の建造[けんぞう]に充てられた。"
  21: "アポロニオス・メネステスの子[こ]が、王[おう]フィロメトルの即位[そくい]の祝[いわ]いのためにエジプトへ遣[つか]わされたとき、アンティオコスは、彼[かれ]が自分[じぶん]の事柄とは無縁[むえん]の者となったと受[う]け取[と]り、自分[じぶん]の安全[あんぜん]を気[き]にかけた。そこから、イオッピアに着[つ]いてからエルサレムまで来[き]た。"
  22: "そして、ヤソンと都[みやこ]の人[ひと]々[びと]に立派[りっぱ]にもてなされ、松明[たいまつ]と歓声[かんせい]の中[なか]に迎[むか]え入れられ、それから軍[ぐん]を率[ひき]いてフェニキアへ向[む]かった。"
  23: "三年[さんねん]の後[のち]、ヤソンは、先[さき]に述[の]べたシモンの兄弟[きょうだい]メネラオスを遣[つか]わして、王[おう]に金[かね]を届[とど]けさせ、必要[ひつよう]な事柄[ことがら]についての上申書[じょうしんしょ]をまとめさせた。"
  24: "彼[かれ]は王[おう]に取[と]り入[い]り、その権力[けんりょく]の威光[いこう]を賞[ほ]めそやして、ヤソンより銀[ぎん]三百[さんびゃく]タラント多[おお]く積[つ]んで、大祭司[だいさいし]の職[しょく]を自分[じぶん]のものとした。"
  25: "王[おう]の命令書[めいれいしょ]を受[う]け取[と]って来[き]た彼[かれ]は、大祭司[だいさいし]にふさわしいものを何[なに]ひとつ持[も]たず、ただ残酷[ざんこく]な暴君[ぼうくん]の怒[いか]りと野獣[やじゅう]の激[はげ]しい憤[いきどお]りだけを携[たずさ]えていた。"
  26: "こうして、自分[じぶん]の兄弟[きょうだい]を策略[さくりゃく]で倒[たお]したヤソンは、別[べつ]の者[もの]に同じ策略で倒され、逃亡者[とうぼうしゃ]としてアンモン人[じん]の地[ち]へ追[お]いやられた。"
  27: "メネラオスは職権[しょっけん]を握[にぎ]っていたが、王[おう]に約束[やくそく]した金[かね]のことは少[すこ]しもきちんと果[は]たさなかった。"
  28: "城塞[じょうさい]の長官[ちょうかん]ソストラトスがその取[と]り立[た]てをしていたからである。もっとも、さまざまな品[しな]の取[と]り立[た]ては彼の務[つと]めであった。こうした理由[りゆう]で、二人[ふたり]は王[おう]に呼[よ]び出[だ]された。"
  29: "メネラオスは大祭司[だいさいし]の職[しょく]の後継[あとつ]ぎとして自分[じぶん]の兄弟[きょうだい]リュシマコスを残[のこ]し、ソストラトスはキプロス人[じん]の部隊[ぶたい]の長[ちょう]クラテスを残した。"
  30: "こうしたことが起[お]こっているとき、王[おう]の側女[そばめ]アンティオキスに贈[おく]り物[もの]として与[あた]えられたために、タルソス人[じん]とマロス人[じん]が反乱[はんらん]を起[お]こした。"
  31: "そこで王[おう]は、事[こと]を鎮[しず]めるために急[いそ]いで出[で]かけ、高官[こうかん]の一人[ひとり]アンドロニコスを代理[だいり]として残[のこ]した。"
  32: "メネラオスは、好[こう]都[と]合[ごう]な時[とき]が来[き]たと考[かんが]え、神殿[しんでん]の金[きん]の器[うつわ]をいくつか盗[ぬす]み出[だ]してアンドロニコスに贈[おく]り、ほかのものはティルスや周[まわ]りの町[まち]々[まち]で売[う]り払[はら]った。"
  33: "オニアスはそれをはっきりと知[し]って、彼[かれ]を責[せ]めた。オニアスはすでに、アンティオキアの近[ちか]くにあるダフネの、安全[あんぜん]な場所へ退[の]いていたのである。"
  34: "そこでメネラオスは、アンドロニコスをひそかに呼[よ]び寄[よ]せて、オニアスを捕[と]らえるように頼[たの]んだ。彼[かれ]はオニアスのもとへ行[い]き、偽[いつわ]りをもって説[と]き伏[ふ]せ、誓[ちか]いを添[そ]えて右手[みぎて]を差[さ]し出[だ]し、疑[うたが]いを抱[いだ]かれていたにもかかわらず、安全[あんぜん]な場所から出[で]て来[く]るように説得[せっとく]した。そしてすぐに彼を捕[と]らえ、正[せい]義[ぎ]を恥[は]じることもなく殺[ころ]した。"
  35: "このため、ユダヤ人[じん]だけでなく、ほかの民[たみ]の多[おお]くの者[もの]たちも、この人[ひと]の不正[ふせい]な死[し]を悲[かな]しみ、憤[いきどお]った。"
  36: "王[おう]がキリキアの地方[ちほう]から戻[もど]ると、都[みやこ]にいるユダヤ人[じん]たちは、悪[あく]を憎[にく]むギリシア人[じん]たちとともに、オニアスが法[ほう]に反[はん]して殺[ころ]されたことについて王[おう]に訴[うった]えた。"
  37: "アンティオコスは心[こころ]を痛[いた]め、あわれみに動[うご]かされ、亡[な]くなった人[ひと]の節度[せつど]と大[おお]きな品位[ひんい]を思[おも]って涙[なみだ]を流[なが]した。"
  38: "そして怒[いか]りに燃[も]え、ただちにアンドロニコスから紫[むらさき]の衣[ころも]をはぎ取[と]り、衣[ころも]を引[ひ]き裂[さ]いて、都[みやこ]じゅうを引[ひ]き回[まわ]し、オニアスを不敬[ふけい]に殺[ころ]したまさにその場所[ばしょ]で、その人殺[ひとごろ]しを処刑[しょけい]した。主[しゅ]が彼にふさわしい罰[ばつ]を返[かえ]されたのである。"
  39: "メネラオスの同意[どうい]のもとでリュシマコスが都[みやこ]で多[おお]くの神殿[しんでん]荒[あら]しを行[おこな]い、そのうわさが外[そと]へ広[ひろ]まると、民[たみ]はリュシマコスに立[た]ち向[む]かった。すでに多[おお]くの金[きん]の器[うつわ]が運[はこ]び出[だ]されていたからである。"
  40: "群衆[ぐんしゅう]が立[た]ち上[あ]がり、怒[いか]りに満[み]ちあふれると、リュシマコスは三千人[さんぜんにん]ほどを武装[ぶそう]させ、年[とし]をとり、年[とし]に劣[おと]らず愚[おろ]かさも重[かさ]ねたアウラノスという者[もの]を先[さき]に立[た]てて、不法[ふほう]な手[て]を下[くだ]し始[はじ]めた。"
  41: "人[ひと]々[びと]は、リュシマコスの攻[せ]め寄[よ]りを見[み]て取[と]り囲[かこ]み、ある者[もの]は石[いし]を、ある者は太[ふと]い木[き]の棒[ぼう]を、またある者はそこらにある灰[はい]をつかんで、いっせいにリュシマコスの一味[いちみ]に投[な]げつけた。"
  42: "こうして彼らは多[おお]くの者[もの]に傷[きず]を負[お]わせ、何人[なんにん]かは倒[たお]し、すべての者[もの]を逃[に]げ散[ち]らせ、神殿[しんでん]荒[あら]しの本人[ほんにん]を宝物庫[ほうもつこ]のそばで捕[と]らえた。"
  43: "これらのことについて、メネラオスに対[たい]する裁判[さいばん]が始[はじ]まった。"
  44: "王[おう]がティルスに来[き]たとき、長老[ちょうろう]会[かい]から遣[つか]わされた三人[さんにん]の者[もの]たちが、王[おう]の前[まえ]で訴[うった]えを述[の]べた。"
  45: "メネラオスは、もはや追[お]い詰[つ]められていると見[み]て、王[おう]を説得[せっとく]するために、ドリメネスの子[こ]プトレマイオスに多[おお]くの金[かね]を払うと約束[やくそく]した。"
  46: "そこでプトレマイオスは、王[おう]を休[やす]ませるためだと言[い]って柱廊[ちゅうろう]の一[ひと]つへ連[つ]れて行[い]き、心[こころ]を変[か]えさせた。"
  47: "そして、すべての悪[あく]の原因[げんいん]であるメネラオスを告発[こくはつ]から放免[ほうめん]し、スキタイ人[じん]の前[まえ]で弁[べん]じたとしても無罪[むざい]となったであろう不幸[ふこう]な者[もの]たちには、死刑[しけい]を言[い]い渡[わた]した。"
  48: "こうして、都[みやこ]、民[たみ]々[びと]、聖[せい]なる器[うつわ]のために弁護[べんご]した者[もの]たちは、ただちに不正[ふせい]な罰[ばつ]を受[う]けた。"
  49: "このためティルス人[じん]たちも、悪[あく]を憎[にく]んで、彼らの葬[ほうむ]りのために立派[りっぱ]に品[しな]を整[ととの]えた。"
  50: "メネラオスは、支配[しはい]する者[もの]たちの強欲[ごうよく]のゆえに、その職[しょく]にとどまり、悪[あく]のうちに育[そだ]ち、市民[しみん]にとって大[おお]きな陰謀[いんぼう]者[しゃ]となった。"

notes:
  1: "ὁ τῶν χρημάτων καὶ τῆς πατρίδος ἐνδείκτης γεγονώς — «сделавшийся доносчиком (указателем) о деньгах и об отечестве» (ἐνδείκτης — доносчик, 密告者[みっこくしゃ]); ἐκακολόγει τὸν Ονιαν — «злословил Онию»; ὡς αὐτός τε εἴη τὸν Ἡλιόδωρον ἐπισεσεικὼς — «будто он сам подстрекнул (возбудил) Илиодора» (ἐπισείω); τῶν κακῶν δημιουργὸς καθεστηκώς — «ставший виновником зол»."
  2: "τὸν εὐεργέτην τῆς πόλεως — «благодетеля города»; τὸν κηδεμόνα τῶν ὁμοεθνῶν — «попечителя соплеменников» (κηδεμών — 後見[こうけん]人[にん]); ζηλωτὴν τῶν νόμων — «ревнителя законов»; ἐπίβουλον τῶν πραγμάτων — «злоумышленника против дел (государства)»."
  3: "τῆς ἔχθρας ἐπὶ τοσοῦτον προβαινούσης — «вражде до того дойти»; διά τινος τῶν ὑπὸ τοῦ Σιμωνος δεδοκιμασμένων — «через одного из испытанных (доверенных) Симоном»; φόνους συντελεῖσθαι — «убийства совершаться»."
  4: "συνορῶν — «видя»; τὸ χαλεπὸν τῆς φιλονεικίας — «жестокость (тяжесть) вражды-соперничества» (φιλονεικία); Ἀπολλώνιον Μενεσθέως — «Аполлония, сына Менесфея» (メネステス); συναύξοντα τὴν κακίαν τοῦ Σιμωνος — «умножающего злобу Симона»."
  5: "διεκομίσθη πρὸς τὸν βασιλέα — «отправился к царю»; οὐ γινόμενος τῶν πολιτῶν κατήγορος — «не делаясь обвинителем граждан»; τὸ σύμφορον κοινῇ καὶ κατ᾽ ἰδίαν παντὶ τῷ πλήθει σκοπῶν — «имея в виду полезное сообща и порознь всему множеству»."
  6: "ἄνευ βασιλικῆς προνοίας — «без царского попечения» (πρόνοια); ἀδύνατον εἶναι τυχεῖν εἰρήνης ἔτι τὰ πράγματα — «невозможно делам ещё получить мир»; παῦλαν οὐ λημψόμενον τῆς ἀνοίας — «не получит прекращения безумия»."
  7: "Μεταλλάξαντος τὸν βίον Σελεύκου — «Селевку переменившему жизнь (умершему)»; τοῦ προσαγορευθέντος Ἐπιφανοῦς — «названного Епифаном»; ὑπενόθευσεν Ἰάσων… τὴν ἀρχιερωσύνην — «выманил (подделал) Иасон первосвященство» (ὑπονοθεύω — подделывать, добывать обманом)."
  8: "ἐπαγγειλάμενος… δι᾽ ἐντέυξεως — «обещав при ходатайстве (встрече)» (ἔντευξις — обращение); ἀργυρίου τάλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις — «серебра талантов шестьдесят сверх трёхсот», т. е. 360; προσόδου τινὸς ἄλλης — «с иного какого-то дохода»."
  9: "ἕτερα… πεντήκοντα πρὸς τοῖς ἑκατόν — «ещё пятьдесят сверх ста», т. е. 150; γυμνάσιον καὶ ἐφηβεῖον — «гимнасий и эфебион» (体育所[たいいくしょ] и 青年[せいねん]の訓練所[くんれんじょ]); τοὺς ἐν Ιεροσολύμοις Ἀντιοχεῖς ἀναγράψαι — «иерусалимлян записать антиохийцами» (дарование гражданства)."
  10: "ἐπινεύσαντος δὲ τοῦ βασιλέως — «царю давшему согласие» (ἐπινεύω); τῆς ἀρχῆς κρατήσας — «овладев начальством»; πρὸς τὸν Ἑλληνικὸν χαρακτῆρα — «к эллинскому образу (отпечатку)» (χαρακτήρ — 風[ふう]の習[なら]わし); τοὺς ὁμοφύλους μετέστησε — «соплеменников перевёл (склонил)»."
  11: "τὰ κείμενα τοῖς Ιουδαίοις φιλάνθρωπα βασιλικὰ — «установленные иудеям человеколюбивые царские [права]»; διὰ Ιωάννου τοῦ πατρὸς Εὐπολέμου — «через Иоанна, отца Евполема» (ヨハネ, エウポレモス); τοῦ ποιησαμένου τὴν πρεσβείαν ὑπὲρ φιλίας καὶ συμμαχίας πρὸς τοὺς Ῥωμαίους — «совершившего посольство о дружбе и союзе к римлянам»; παρώσας — «отринув»; παρανόμους ἐθισμοὺς ἐκαίνιζεν — «беззаконные обычаи вводил»."
  12: "ὑπ᾽ αὐτὴν τὴν ἀκρόπολιν — «под самой крепостью» (ἀκρόπολις — 城塞[じょうさい]); τοὺς κρατίστους τῶν ἐφήβων ὑποτάσσων — «лучших из юношей подчиняя»; ὑπὸ πέτασον ἤγαγεν — «под петас (широкополую шляпу) вёл», знак эфебии; ペタソスの帽[ぼうし]."
  13: "ἀκμή τις Ἑλληνισμοῦ — «некий расцвет (остриё) эллинизма»; πρόσβασις ἀλλοφυλισμοῦ — «успех (доступ) чужеземного образа жизни» (ἀλλοφυλισμός); διὰ τὴν τοῦ ἀσεβοῦς… ὑπερβάλλουσαν ἀναγνείαν — «из-за превосходящей нечистоты нечестивого» (ἀναγνεία — нечистота); καὶ οὐκ ἀρχιερέως — «и не первосвященника»."
  14: "μηκέτι… προθύμους εἶναι τοὺς ἱερεῖς — «священникам уже не быть усердными»; τοῦ νεὼ καταφρονοῦντες — «храм презирая» (νεώς); τῆς ἐν παλαίστρῃ παρανόμου χορηγίας — «беззаконного содержания (участия) на палестре» (παλαίστρα — 格闘場[かくとうじょう], χορηγία — снабжение); μετὰ τὴν τοῦ δίσκου πρόσκλησιν — «после призыва диска» (метание диска как начало игр)."
  15: "τὰς πατρῴους τιμὰς ἐν οὐδενὶ τιθέμενοι — «отеческие почести ни во что ставя»; τὰς Ἑλληνικὰς δόξας καλλίστας ἡγούμενοι — «эллинские славы наилучшими считая»."
  16: "ὧν καὶ χάριν περιέσχεν αὐτοὺς χαλεπὴ περίστασις — «ради чего объяло их тяжкое обстояние»; ὧν ἐζήλουν τὰς ἀγωγάς — «чьим обычаям (ведениям) ревновали» (ἀγωγή); πολεμίους καὶ τιμωρητὰς ἔσχον — «врагами и карателями их имели»."
  17: "ἀσεβεῖν… εἰς τοὺς θείους νόμους οὐ ῥᾴδιον — «нечествовать против божественных законов не легко (не безнаказанно)»; ὁ ἀκόλουθος καιρὸς δηλώσει — «последующее время покажет»."
  18: "πενταετηρικοῦ ἀγῶνος — «пятилетних игр» (πενταετηρικός — совершаемый раз в пять лет); ἐν Τύρῳ — «в Тире» (ティルス); τοῦ βασιλέως παρόντος — «при присутствии царя»."
  19: "ὁ μιαρός — «скверный (нечестивый)»; θεωροὺς — «зрителями (посланными на игры)» (θεωρός); Ἀντιοχεῖς ὄντας — «будучи антиохийцами»; εἰς τὴν τοῦ Ἡρακλέους θυσίαν — «на жертву Гераклу» (ヘラクレス); μὴ χρῆσθαι… διὰ τὸ μὴ καθήκειν — «не употреблять, так как не подобает»; εἰς ἑτέραν… καταθέσθαι δαπάνην — «на иной расход отложить»."
  20: "ἔπεσε μὲν οὖν ταῦτα — «итак, это было послано (пало)»; διὰ μὲν τὸν ἀποστείλαντα — «ради пославшего»; ἕνεκεν δὲ τῶν παρακομιζόντων — «ради же принёсших»; εἰς τὰς τῶν τριηρέων κατασκευάς — «на построение триер» (τριήρης — 三[さん]段[だん]漕[そう]船[せん])."
  21: "Ἀπολλωνίου τοῦ Μενεσθέως — «Аполлония, сына Менесфея»; διὰ τὰ πρωτοκλίσια τοῦ Φιλομήτορος βασιλέως — «по поводу первенства (восшествия) царя Филометора» (πρωτοκλίσια — первое возлежание, пир вступления); ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονέναι πραγμάτων — «что он стал чужд его делам»; τῆς καθ᾽ αὑτὸν ἀσφαλείας ἐφρόντιζεν — «о своей безопасности заботился»; εἰς Ιοππην παραγενόμενος — «прибыв в Иоппию» (イオッピア)."
  22: "μεγαλομερῶς… ἀποδεχθείς — «великолепно принят»; μετὰ δᾳδουχίας καὶ βοῶν — «с факелоношением и криками» (δᾳδουχία); κατεστρατοπέδευσεν — «расположился с войском»."
  23: "Μετὰ δὲ τριετῆ χρόνον — «через трёхлетнее время»; Μενέλαον τὸν τοῦ… Σιμωνος ἀδελφόν — «Менелая, брата… Симона»; παρακομίζοντα τὰ χρήματα — «доставляющего деньги»; ὑπομνηματισμοὺς τελέσοντα — «имеющего исполнить памятные записки (представления)» (ὑπομνηματισμός)."
  24: "συσταθεὶς τῷ βασιλεῖ — «представ царю» (συνίστημι); δοξάσας αὐτὸν τῷ προσώπῳ τῆς ἐξουσίας — «почтив (прославив) его лицезрением власти»; εἰς ἑαυτὸν κατήντησεν τὴν ἀρχιερωσύνην — «к себе присвоил первосвященство»; ὑπερβαλὼν τὸν Ἰάσωνα τάλαντα… τριακόσια — «превзойдя Иасона на триста талантов»."
  25: "τῆς μὲν ἀρχιερωσύνης οὐδὲν ἄξιον φέρων — «ничего достойного первосвященства не неся»; θυμοὺς ὠμοῦ τυράννου — «ярость жестокого тирана»; θηρὸς βαρβάρου ὀργάς — «дикого зверя гнев»."
  26: "ὁ τὸν ἴδιον ἀδελφὸν ὑπονοθεύσας — «своего брата обманом оттолкнувший»; ὑπονοθευθεὶς ὑφ᾽ ἑτέρου — «другим обманутый»; φυγὰς εἰς τὴν Αμμανῖτιν χώραν συνήλαστο — «беглецом в Аммонитскую страну изгнан»."
  27: "τῆς μὲν ἀρχῆς ἐκράτει — «начальство держал»; τῶν ἐπηγγελμένων… χρημάτων οὐδὲν εὐτάκτει — «из обещанных денег ничего не вносил исправно» (εὐτακτέω — вносить в срок)."
  28: "ποιουμένου δὲ τὴν ἀπαίτησιν Σωστράτου — «когда Сострат делал взыскание» (ἀπαίτησις); τοῦ τῆς ἀκροπόλεως ἐπάρχου — «начальника крепости» (ἔπαρχος, 長官[ちょうかん]); ἡ τῶν διαφόρων πρᾶξις — «взыскание (сбор) податей»; οἱ δύο… προσεκλήθησαν — «оба были призваны»."
  29: "ἀπέλιπεν… διάδοχον — «оставил преемником»; Λυσίμαχον τὸν ἑαυτοῦ ἀδελφόν — «Лисимаха, своего брата» (リュシマコス); Κράτητα τὸν ἐπὶ τῶν Κυπρίων — «Кратита, начальника Кипрских [наёмников]» (クラテス)."
  30: "Τοιούτων δὲ συνεστηκότων — «при таких обстоятельствах»; Ταρσεῖς καὶ Μαλλώτας στασιάζειν — «тарсянам и маллотам возмутиться» (タルソス人, マロス人); Ἀντιοχίδι τῇ παλλακῇ — «Антиохиде, наложнице» (アンティオキス); ἐν δωρεᾷ δεδόσθαι — «быть отданными в дар»."
  31: "θᾶττον — «скорее (поспешно)»; καταστεῖλαι τὰ πράγματα — «успокоить (уладить) дела»; καταλιπὼν τὸν διαδεχόμενον Ἀνδρόνικον — «оставив заместителем Андроника»; τῶν ἐν ἀξιώματι κειμένων — «из находящихся в почёте (сановников)»."
  32: "εἰληφέναι καιρὸν εὐφυῆ — «получить удобное время»; χρυσώματά τινα τῶν τοῦ ἱεροῦ νοσφισάμενος — «некие золотые вещи храма похитив» (νοσφίζομαι — присваивать); ἐχαρίσατο τῷ Ἀνδρονίκῳ — «подарил Андронику»; ἕτερα… πεπρακὼς εἴς τε Τύρον — «иные продав в Тир»."
  33: "ἃ καὶ σαφῶς ἐπεγνωκώς — «это ясно узнав»; ἀπήλεγχεν — «изобличал» (ἀπελέγχω); ἀποκεχωρηκὼς εἰς ἄσυλον τόπον — «удалившись в безопасное (неприкосновенное) место»; ἐπὶ Δάφνης τῆς πρὸς Ἀντιόχειαν — «при Дафне, что близ Антиохии» (ダフネ)."
  34: "λαβὼν ἰδίᾳ τὸν Ἀνδρόνικον — «взяв наедине Андроника»; χειρώσασθαι τὸν Ονιαν — «захватить (убить) Онию» (χειρόω); πεισθεὶς ἐπὶ δόλῳ — «убедив обманом»; δεξιασθεὶς μεθ᾽ ὅρκων δοὺς δεξιάν — «приветствованный с клятвами, дав руку»; καίπερ ἐν ὑποψίᾳ κείμενος — «хотя и был в подозрении»; παρέκλεισεν οὐκ αἰδεσθεὶς τὸ δίκαιον — «заключил (покончил), не устыдившись правды»."
  35: "ἐδείναζον καὶ ἐδυσφόρουν — «негодовали и тяготились» (δεινάζω, δυσφορέω); ἐπὶ τῷ τοῦ ἀνδρὸς ἀδίκῳ φόνῳ — «о несправедливом убийстве мужа»."
  36: "ἐπανελθόντος… ἀπὸ τῶν κατὰ Κιλικίαν τόπων — «возвратившегося из киликийских мест»; ἐνετύγχανον — «обратились (с прошением)»; συμμισοπονηρούντων καὶ τῶν Ἑλλήνων — «когда и эллины вместе ненавидели зло»; ὑπὲρ τοῦ παρὰ λόγον τὸν Ονιαν ἀπεκτονῆσθαι — «за то, что Ония убит вопреки смыслу (праву)»."
  37: "ψυχικῶς… ἐπιλυπηθεὶς — «душевно опечалившись»; τραπεὶς ἐπὶ ἔλεος — «обратившись к жалости»; διὰ τὴν τοῦ μετηλλαχότος σωφροσύνην καὶ πολλὴν εὐταξίαν — «за целомудрие и великое благочиние скончавшегося» (μεταλλάσσω — умереть)."
  38: "πυρωθεὶς τοῖς θυμοῖς — «воспламенившись яростью»; τὴν τοῦ Ἀνδρονίκου πορφύραν περιελόμενος — «с Андроника порфиру сняв»; τοὺς χιτῶνας περιρρήξας — «одежды разодрав»; περιαγαγὼν καθ᾽ ὅλην τὴν πόλιν — «проведя по всему городу»; τὸν μιαιφόνον ἀπεκόσμησεν — «убийцу казнил (убрал)» (μιαιφόνος — кровопролитель); τοῦ κυρίου τὴν ἀξίαν αὐτῷ κόλασιν ἀποδόντος — «Господом воздавшим ему достойное наказание»."
  39: "πολλῶν ἱεροσυλημάτων — «многих святотатств» (ἱεροσύλημα); μετὰ τῆς τοῦ Μενελάου γνώμης — «с согласия (мнения) Менелая»; διαδοθείσης ἔξω τῆς φήμης — «когда молва разнеслась вовне»; χρυσωμάτων ἤδη πολλῶν διενηνεγμένων — «уже многих золотых вещей унесённых»."
  40: "ἐπεγειρομένων τῶν ὄχλων — «когда толпы поднимались»; ταῖς ὀργαῖς διεμπιπλαμένων — «гневом исполняясь» (διεμπίμπλημι); καθοπλίσας… πρὸς τρισχιλίους — «вооружив до трёх тысяч»; κατήρξατο χειρῶν ἀδίκων — «начал беззаконные руки (насилие)»; προηγησαμένου τινὸς Αυρανου — «при предводительстве некоего Аврана» (アウラノス); προβεβηκότος τὴν ἡλικίαν, οὐδὲν δὲ ἧττον καὶ τὴν ἄνοιαν — «преуспевшего возрастом, но не меньше и безумием»."
  41: "τὴν ἐπίθεσιν τοῦ Λυσιμάχου — «нападение (натиск) Лисимаха»; ξύλων πάχη — «толстые поленья»; ἐκ τῆς παρακειμένης σποδοῦ — «из лежащего рядом пепла»; φύρδην ἐνετίνασσον — «смешанно (вперемешку) бросали» (φύρδην)."
  42: "τραυματίας ἐποίησαν — «ранами покрыли» (τραυματίας); τινὰς δὲ καὶ κατέβαλον — «некоторых и повергли»; εἰς φυγὴν συνήλασαν — «в бегство обратили»; τὸν ἱερόσυλον παρὰ τὸ γαζοφυλάκιον ἐχειρώσαντο — «святотатца при сокровищнице схватили (умертвили)»."
  43: "ἐνέστη κρίσις πρὸς τὸν Μενέλαον — «начался суд против Менелая» (ἐνίστημι)."
  44: "καταντήσαντος τοῦ βασιλέως εἰς Τύρον — «когда царь прибыл в Тир»; ἐπ᾽ αὐτοῦ τὴν δικαιολογίαν ἐποιήσαντο — «пред ним представили оправдание (жалобу)» (δικαιολογία); οἱ πεμφθέντες τρεῖς ἄνδρες ὑπὸ τῆς γερουσίας — «посланные герусией три мужа»."
  45: "ἤδη… λελειμμένος — «уже оставленный (изобличённый)» (λείπω в значении «быть ули чённым»); ἐπηγγείλατο χρήματα ἱκανὰ τῷ Πτολεμαίῳ Δορυμένους — «обещал денег достаточно Птолемею, сыну Доримена» (ドリメネス); πρὸς τὸ πεῖσαι τὸν βασιλέα — «чтобы убедить царя»."
  46: "ἀπολαβὼν… εἴς τι περίστυλον — «отведя в некий портик (перистиль)»; ὡς ἀναψύξοντα τὸν βασιλέα — «как бы для освежения (отдыха) царя»; μετέθηκεν — «переубедил (переставил)»."
  47: "τῆς ὅλης κακίας αἴτιον — «виновника всей злобы»; ἀπέλυσεν τῶν κατηγορημένων — «освободил от обвинений»; εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον — «если бы и перед скифами говорили» (скифы — образ дикости, スキタイ人); ἀπελύθησαν ἀκατάγνωστοι — «были бы отпущены неосуждёнными»; θάνατον ἐπέκρινεν — «смерть присудил»."
  48: "τὴν ἄδικον ζημίαν ὑπέσχον — «несправедливое наказание (убыток) понесли» (ζημία); οἱ περὶ πόλεως καὶ δήμων καὶ τῶν ἱερῶν σκευῶν προηγορήσαντες — «говорившие в защиту города, народов и священных сосудов» (προηγορέω — защищать в суде)."
  49: "μισοπονηρήσαντες — «возненавидев зло»; τὰ πρὸς τὴν κηδείαν αὐτῶν μεγαλοπρεπῶς ἐχορήγησαν — «на погребение их великолепно снабдили» (κηδεία — погребение)."
  50: "διὰ τὰς τῶν κρατούντων πλεονεξίας — «из-за любостяжания властвующих» (πλεονεξία); ἔμενεν ἐπὶ τῇ ἀρχῇ — «оставался при начальстве»; ἐπιφυόμενος τῇ κακίᾳ — «возрастая (прорастая) в злобе» (ἐπιφύομαι); μέγας τῶν πολιτῶν ἐπίβουλος — «великий гражданам злоумышленник»."
