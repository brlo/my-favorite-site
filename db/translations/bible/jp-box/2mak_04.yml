# Содержание: 1–6 Симон клевещет на Онию, вражда и убийства, Ония идёт к царю;
# 7–17 Иасон покупает первосвященство, гимнасий, эфебион, «антиохийцы»,
# священники пренебрегают храмом; 18–22 пятилетние игры в Тире, Геракл,
# приезд Антиоха в Иерусалим; 23–29 Менелай отнимает первосвященство,
# крадёт сосуды, Ония обличает его; 30–38 убийство Онии Андроником и казнь
# Андроника; 39–42 святотатство Лисимаха и его смерть; 43–50 суд в Тире,
# Менелай оправдан, три мужа казнены.
# Голоса: прямой речи в главе нет; всё повествование, без кавычек.
# Имена: ヤソン, メネラオス, オニアス, アンドロニコス, リュシマコス, ソストラトス,
# クラテス, ヨハネ, エウポレモス, アンティオキス, ドリメネス, ヘラクレス,
# アウラノス, スキタイ人 — новое; アンティオコス, セレウコス, プトレマイオス,
# アポロニオス, シモン, ティルス, イオッピア, ダフネ, キリキア, タルソス,
# キプロス, アンモン人, エルサレム — по корпусу и брифу.
# Термины: 大祭司[だいさいし], 神殿[しんでん], 祭壇[さいだん], 祭司[さいし],
# 律法[りっぽう], 異邦人[いほうじん], 割礼[かつれい], 体育所[たいいくしょ],
# 青年[せいねん]の訓練所[くんれんじょ], 格闘場[かくとうじょう].

