# jp-box, 1-я Царств, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в книге нет,
# jp-ni (811 стихов, под авторским правом) источником не был.
# Язык — современный 常体 (в диалогах тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 29: филистимляне в Афеке, Давид в арьергарде с Анхусом (1–2);
# сатрапы требуют отослать Давида (3–5); Анхус отпускает его домой (6–11).
# Речь персонажей — 「…」 (3–4, 6–10); речь Анхуса открывается в 6 и
# закрывается в 7; вложенная речь — 『…』 (5, 9). Красного нет.
# Нумерация по gr: 11 стихов, совпадает с csl/ru.
# 〔…〕 нет: в gr-lxx-byz на месте каждого стиха есть текст, знака «.» нет.
# Сносок ⟨…⟩ нет: 太守, 将軍, ペリシテ人, イスラエル уже в корпусе.

tr_code: jp-box
book: 1ts
chapter: 29
draft: true

verses:
  1: "ペリシテ人[じん]はすべての陣[じん]をアフェクに集[あつ]めた。イスラエルは、イズレエルにあるアエンドルに陣[じん]を敷[し]いた。"
  2: "ペリシテ人[じん]の太守[たいしゅ]たちは、百人[ひゃくにん]ずつ、千人[せんにん]ずつに分[わ]かれて進[すす]んだ。ダビデとその部下[ぶか]たちは、アンクスとともに最後尾[さいこうび]を進[すす]んだ。"
  3: "ペリシテ人[じん]の太守[たいしゅ]たちは言[い]った。「あの通[とお]り過[す]ぎて行[い]く者[もの]たちはだれか。」アンクスはペリシテ人[じん]の将軍[しょうぐん]たちに言[い]った。「これは、イスラエルの王[おう]サウルのしもべダビデではないか。彼[かれ]はもう二年[にねん]、わたしのもとにいる。彼[かれ]がわたしのところへ来[き]た日[ひ]から今日[きょう]まで、わたしは彼[かれ]に何[なに]一[ひと]つ悪[わる]い点[てん]を見[み]いださなかった。」"
  4: "ペリシテ人[じん]の将軍[しょうぐん]たちは彼[かれ]に腹[はら]を立[た]てて言[い]った。「この男[おとこ]を帰[かえ]し、あなたが彼[かれ]を置[お]いたその場所[ばしょ]へ戻[もど]らせよ。彼[かれ]をわたしたちとともに戦[たたか]いに行[い]かせてはならない。陣[じん]の中[なか]で裏切[うらぎ]り者[もの]になってはならない。この者[もの]は、何[なに]によって自分[じぶん]の主人[しゅじん]と和解[わかい]するのか。あの男[おとこ]たちの首[くび]によってでなくて何[なに]か。」"
  5: "これは、あのダビデではないか。人[ひと]々[びと]は踊[おど]りの輪[わ]の中[なか]で歌[うた]って、『サウルは千[せん]を、ダビデは万[まん]を討[う]った』と言[い]ったではないか。"
  6: "アンクスはダビデを呼[よ]んで言[い]った。「主[しゅ]は生[い]きておられる。あなたは正[ただ]しく、わたしの目[め]には良[よ]い者[もの]だ。あなたの出[で]入[い]りは、陣[じん]の中[なか]でわたしとともにあった。あなたがわたしのところへ来[き]た日[ひ]から今日[きょう]まで、わたしはあなたに悪[わる]いところを見[み]いださなかった。だが、太守[たいしゅ]たちの目[め]には、あなたは良[よ]くない。"
  7: "今[いま]、引[ひ]き返[かえ]して、平和[へいわ]のうちに去[さ]れ。ペリシテ人[じん]の太守[たいしゅ]たちの目[め]の前[まえ]で悪[わる]いことをしてはならない。」"
  8: "ダビデはアンクスに言[い]った。「わたしが何[なに]をしたというのか。あなたのしもべのどこに、わたしがあなたの前[まえ]にいた日[ひ]から今日[きょう]まで、何[なん]の咎[とが]があったというのか。なぜ、わたしは主人[しゅじん]である王[おう]の敵[てき]と戦[たたか]いに行[い]くことができないのか。」"
  9: "アンクスはダビデに答[こた]えて言[い]った。「わたしは、あなたがわたしの目[め]に良[よ]い者[もの]だと知[し]っている。だが、ペリシテ人[じん]の太守[たいしゅ]たちは『彼[かれ]をわたしたちとともに戦[たたか]いに行[い]かせるな』と言[い]う。"
  10: "今[いま]、朝早[あさはや]く立[た]ちなさい。あなたと、あなたとともに来[き]た主人[しゅじん]のしもべたちは。そして、わたしがあなたがたを置[お]いたその場所[ばしょ]へ行[い]け。心[こころ]に悪[わる]い言葉[ことば]を抱[いだ]いてはならない。あなたはわたしの目[め]に良[よ]い者[もの]だから。夜[よる]が明[あ]けたら、道[みち]に出[で]て行[い]け。」"
  11: "ダビデは夜明[よあ]けに、自分[じぶん]とその部下[ぶか]たちとともに立[た]ち、ペリシテ人[じん]の地[ち]を守[まも]るために去[さ]った。ペリシテ人[じん]はイスラエルと戦[たたか]うために上[のぼ]って行[い]った。"

notes:
  1: "συναθροίζουσιν ἀλλόφυλοι πάσας τὰς παρεμβολὰς αὐτῶν εἰς Αφεκ — собирают все станы свои в Афек (アフェク). Ισραηλ παρενέβαλεν ἐν Αενδωρ τῇ ἐν Ιεζραελ — Израиль расположился станом в Аэндорe, что в Изрееле: LXX и слав. дают здесь Аэндор (アエンドル), а в ru — «у источника, что в Изрееле» (по евр. עַיִן, «источник»). Оставлено по греческому."
  2: "σατράπαι ἀλλοφύλων — сатрапы филистимские, 太守 (слав. «воеводы»). παρεπορεύοντο εἰς ἑκατοντάδας καὶ χιλιάδας — проходили сотнями и тысячами. ἐπ᾽ ἐσχάτων — «в последних», в арьергарде: 最後尾."
  3: "Τίνες οἱ διαπορευόμενοι οὗτοι — кто эти проходящие. στρατηγοί — военачальники, 将軍. γέγονεν μεθ᾽ ἡμῶν ἡμέρας τοῦτο δεύτερον ἔτος — «он у нас дни эти, второй уже год» (слав. «дний сие второе лето»). οὐχ εὕρηκα ἐν αὐτῷ οὐθέν — не нашёл в нём ничего."
  4: "ἐλυπήθησαν ἐπ᾽ αὐτῷ — опечалились, вознегодовали из-за него. Ἀπόστρεψον τὸν ἄνδρα — верни мужа. ἐπίβουλος — злоумышленник, предатель. διαλλαγήσεται τῷ κυρίῳ αὐτοῦ — примирится с господином своим. ἐν ταῖς κεφαλαῖς τῶν ἀνδρῶν ἐκείνων — головами тех мужей."
  5: "ᾧ ἐξῆρχον ἐν χοροῖς λέγοντες — «которому запевали в хорах, говоря» (ἐξάρχω — начинать хор, запевать). Ἐπάταξεν Σαουλ ἐν χιλιάσιν αὐτοῦ — «поразил Саул тысячами своими». Песня дана вложенной речью 『…』."
  6: "Ζῇ κύριος — жив Господь (клятва). εὐθὴς σὺ — прям, честен. ἡ ἔξοδός σου καὶ ἡ εἴσοδός σου μετ᾽ ἐμοῦ — исход и вход твой со мною (жизнь на виду). οὐχ εὕρηκα κατὰ σοῦ κακίαν — не нашёл на тебя зла."
  7: "Ἀνάστρεφε καὶ πορεύου εἰς εἰρήνην — возвратись и иди с миром. οὐ μὴ ποιήσεις κακίαν ἐν ὀφθαλμοῖς — «не сделаешь зла в очах» (усиленное отрицание, по смыслу — запрет)."
  8: "Τί πεποίηκά σοι — что я сделал тебе. τί εὗρες ἐν τῷ δούλῳ σου — что нашёл в рабе твоём. ὅτι οὐ μὴ ἔλθω πολεμῆσαι — «что я не пойду воевать»; в ru — «почему бы мне не идти» (то же греч. с вопросительной интонацией)."
  9: "Οἶδα ὅτι ἀγαθὸς σὺ ἐν ὀφθαλμοῖς μου — знаю, что ты хорош в очах моих. В csl добавлено «яко ангел Божий» (по евр.), в gr этого нет. Слова сатрапов — вложенная речь 『…』."
  10: "ὄρθρισον τὸ πρωί — встань рано утром. οἱ παῖδες τοῦ κυρίου σου — рабы господина твоего. λόγον λοιμὸν μὴ θῇς ἐν καρδίᾳ σου — «слова пагубного не полагай в сердце твоём» (λοιμός — гибельный). ὀρθρίσατε ἐν τῇ ὁδῷ — встаньте рано в путь. φωτισάτω ὑμῖν — да рассветёт вам."
  11: "ὤρθρισεν Δαυιδ — Давид встал рано. φυλάσσειν τὴν γῆν τῶν ἀλλοφύλων — охранять землю филистимлян. В csl добавлено «во иезраель» — в gr нет."
