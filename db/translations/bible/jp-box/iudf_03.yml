verses:
  1: "彼らは彼のもとに使者[ししゃ]たちを遣[つか]わし、平和[へいわ]の言葉[ことば]をもって言[い]った。"
  2: "「見[み]よ、わたしたちは大[だい]いなる王[おう]ネブカドネツァルの僕[しもべ]であり、あなたの前[まえ]に伏[ふ]している。あなたの顔[かお]にかなうとおりに、わたしたちを用[もち]いてください。"
  3: "見よ、わたしたちの村[むら]々[むら]、わたしたちのすべての場所[ばしょ]、小麦[こむぎ]の畑[はたけ]のすべて、羊[ひつじ]の群[む]れも牛[うし]の群れも、わたしたちの天幕[てんまく]のすべての囲[かこ]いも、あなたの前にある。あなたの好[この]むとおりに用いてください。"
  4: "見よ、わたしたちの都[みやこ]々[みやこ]も、そこに住む者たちも、あなたの奴隷[どれい]である。来[き]て、彼らを迎[むか]え、あなたの目[め]に良[よ]いと見[み]えるとおりにしてください。」"
  5: "その人[ひと]々[びと]はホロフェルネスのもとに来[き]て、これらの言葉[ことば]のとおりに彼に告[つ]げた。"
  6: "彼は自分の軍勢[ぐんぜい]とともに海辺[うみべ]の地[ち]へ下[くだ]り、高[たか]い都[みやこ]々[みやこ]に守備隊[しゅびたい]を置いて固[かた]め、そこから選[えら]ばれた者[もの]たちを味方[みかた]として連[つ]れて行[ゆ]った。"
  7: "そして、彼らも、その周辺[しゅうへん]のすべての者たちも、冠[かんむり]と踊[おど]りとタンバリンをもって彼を迎[むか]えた。"
  8: "彼は彼らのすべての境[さかい]を破壊[はかい]し、彼らの木立[こだち]を切[き]り倒[たお]した。彼には、地[ち]のすべての神[かみ]々[がみ]を滅[ほろ]ぼし、すべての国民[こくみん]とすべての民[たみ]がただ一人[ひとり]ネブカドネツァルに仕[つか]え、彼らのすべての言語[げんご]と部族[ぶぞく]が彼を神として呼[よ]び求[もと]めるようにせよ、と命[めい]じられていた。"
  9: "彼はエスドレロンの面[おもて]、ドタンの近[ちか]くに来[き]た。ドタンはユダヤの大[おお]きなのこぎりの向[む]かいにある。"
  10: "彼らはガイバイとスキトポリスの間[あいだ]に陣営[じんえい]を張[は]り、彼は自分の軍勢[ぐんぜい]の荷[に]のすべてを集[あつ]めるために、そこに一[ひと]月[つき]の日々[ひび]を過[す]ごした。"

notes:
  1: "ἀπέστειλαν πρὸς αὐτὸν ἀγγέλους — «послали к нему послов» (ἄγγελος здесь «посланник», не «ангел»). λόγοις εἰρηνικοῖς — «словами мирными» (датив образа действия; εἰρηνικός — «мирный»). λέγοντες — причастие «говоря», вводит прямую речь ст. 2–4."
  2: "ἡμεῖς οἱ παῖδες Ναβουχοδονοσορ βασιλέως μεγάλου — «мы, рабы Навуходоносора, царя великого» (παῖς — «слуга, раб»; слав. «отроцы»). παρακείμεθα ἐνώπιόν σου — «повергаемся пред тобою» (παράκειμαι — «лежать подле»; слав. «повергаемся»). χρῆσαι ἡμῖν — «употреби нас» (χράομαι — «пользоваться»; императив аориста). καθὼς ἀρεστόν ἐστιν τῷ προσώπῳ σου — «как угодно лицу твоему» (ἀρεστός — «угодный»); вежливая просьба передана ください."
  3: "αἱ ἐπαύλεις ἡμῶν — «усадьбы наши» (ἐπαυλις — «загородное жилище, усадьба»; слав. «села»). πᾶν πεδίον πυρῶν — «всякое поле пшеницы». τὰ ποίμνια καὶ τὰ βουκόλια — «стада овец и волов». πᾶσαι αἱ μάνδραι τῶν σκηνῶν ἡμῶν — «все загоны шатров наших» (μάνδρα — «загон»; σκηνή — 天幕). παράκεινται πρὸ προσώπου σου — «лежат пред лицом твоим». χρῆσαι καθὸ ἂν ἀρέσκῃ σοι — «пользуйся, как тебе угодно» (καθό с ἄν и конъюнктивом)."
  4: "αἱ πόλεις ἡμῶν καὶ οἱ κατοικοῦντες ἐν αὐταῖς — «города наши и живущие в них». δοῦλοί σοί εἰσιν — «рабы твои суть» (δοῦλος — «раб», сильнее παῖς). ἐλθὼν ἀπάντησον αὐταῖς — «придя, встреть их» (ἀπαντάω — «выходить навстречу»; αὐταῖς — городам, женский род). ὡς ἔστιν ἀγαθὸν ἐν ὀφθαλμοῖς σου — «как благо в очах твоих»."
  5: "παρεγένοντο οἱ ἄνδρες πρὸς Ολοφέρνην — «пришли мужи к Олоферну» (παραγίνομαι). ἀπήγγειλαν αὐτῷ κατὰ τὰ ῥήματα ταῦτα — «возвестили ему по словам сим» (ἀπαγγέλλω; κατά — «сообразно»)."
  6: "κατέβη ἐπὶ τὴν παραλίαν — «сошёл на приморье» (καταβαίνω). ἐφρούρωσε τὰς πόλεις τὰς ὑψηλάς — «укрепил города высокие» (φρουρέω — «охранять, ставить стражу»; слав. «утверди стражею»). ἔλαβεν ἐξ αὐτῶν εἰς συμμαχίαν ἄνδρας ἐπιλέκτους — «взял из них в союзное войско мужей отборных» (συμμαχία — «союз, вспоможение»; ἐπίλεκτος — «отборный»)."
  7: "ἐδέξαντο αὐτὸν αὐτοὶ καὶ πᾶσα ἡ περίχωρος αὐτῶν — «приняли его они и вся окрестность их» (δέχομαι — «принимать»; περίχωρος — «окрестность»). μετὰ στεφάνων καὶ χορῶν καὶ τυμπάνων — «с венцами, плясками и тимпанами» (στέφανος — «венец»; χορός — «хоровод, пляска», слав. «лики»; τύμπανον — タンバリン)."
  8: "κατέσκαψεν πάντα τὰ ὅρια αὐτῶν — «разорил все пределы их» (κατασκάπτω; ὅρια — «границы, области»); Син. «высоты» следует евр. במות, в LXX этого нет. τὰ ἄλση αὐτῶν ἐξέκοψεν — «вырубил рощи их» (ἄλσος — «священная роща»; ἐκκόπτω — «вырубать»). ἦν δεδομένον αὐτῷ ἐξολεθρεῦσαι — «дано было ему истребить» (пассивный перфект δίδωμι). ὅπως … λατρεύσωσι — «чтобы служили» (λατρεύω — «служить [Богу]»); слав. «вси роди и вси языцы» соответствует LXX πᾶσαι αἱ γλῶσσαι καὶ αἱ φυλαί. ἐπικαλέσωνται αὐτὸν εἰς θεόν — «призывали его как бога» (ἐπικαλέομαι)."
  9: "κατὰ πρόσωπον Εσδρηλων — «напротив Ездрилона» (κατὰ πρόσωπον — семитизм). πλησίον τῆς Δωταιας — «близ Дотаи» (Δωταια; в корпусе это место — ドタン). ἀπέναντι τοῦ πρίονος τοῦ μεγάλου — «против великой пилы»: πρίων — «пила», вероятно зубчатый горный гребень; слав. «пилы», Син. «теснины». τῆς Ιουδαίας — «Иудеи»."
  10: "κατεστρατοπέδευσαν ἀνὰ μέσον Γαιβαι καὶ Σκυθῶν πόλεως — «стали лагерем между Гаваем и городом скифов» (στρατοπεδεύω; ἀνὰ μέσον — «посреди»); Σκυθῶν πόλις — Скифополь (スキトポリス). ἦν ἐκεῖ μῆνα ἡμερῶν — «был там месяц дней», т. е. целый месяц (слав. «месяц дний»). εἰς τὸ συλλέξαι πᾶσαν τὴν ἀπαρτίαν τῆς δυνάμεως αὐτοῦ — «чтобы собрать весь обоз войска своего» (ἀπαρτία — «снаряжение, обоз»)."
