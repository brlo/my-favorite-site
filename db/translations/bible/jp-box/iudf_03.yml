# jp-box, Иудифь, глава 3. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (docs/japanese-bible.md, «Паритет LXX и церковнославянского»): csl-чтения в основном
# тексте без 〔…〕, вариант LXX — в notes; ru (Синодальный) — только для понимания,
# не источник. jp-joc для Иудифи нет; jp-ni не использовался.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 3: посольство приморских городов с мирной речью (1–4), Олоферн принимает
# их и укрепляет высокие города (5–6), торжественная встреча с венцами и плясками (7),
# разорение пределов и рощ, приказ истребить богов земли (8), приход к Ездрилону
# близ Дотана (9), лагерь между Гаваем и Скифополем, месяц на сбор обоза (10).
# Прямая речь: речь послов 2–4 — 「…」 (вежливая просьба с ください); вложенной речи
# нет; красного и синего нет.
# Нумерация по gr: 10 стихов; деление совпадает с csl-ru и ru.
# 〔…〕 нет: все стихи есть в gr-lxx-byz. Слав. удвоение «вси роди и вси языцы» (8)
# внесено в основной текст без скобок, как и положено по паритету.
# Сносок ⟨…⟩ нет: 冠, タンバリン, 天幕, 陣営, 守備隊, 奴隷, 言語 уже в корпусе.
# Имена и топонимы — транслитерация греческого (LXX).

