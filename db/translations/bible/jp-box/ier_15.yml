chapter: 15
draft: true

verses:
  1: "「わたしの前[まえ]にモーセとサムエルが立[た]っても、わたしの魂[たましい]はこの民[たみ]に傾[かたむ]かない。この民[たみ]をわたしの前[まえ]から追[お]い出[だ]せ。彼らは出[で]て行[ゆ]け。"
  2: "もし彼らがあなたに『どこへ出[で]て行[ゆ]こうか』と言[い]うなら、あなたは彼らに言[い]え。主[しゅ]はこう言[い]われる。死[し]に定[さだ]められた者[もの]は死[し]へ、剣[つるぎ]に定められた者は剣[つるぎ]へ、飢[うえ]えに定められた者は飢[うえ]えへ、捕囚[ほしゅう]に定められた者は捕囚[ほしゅう]へ。"
  3: "わたしは彼らに四[よっ]つの種[しゅ]類[るい]の罰[ばつ]を下[くだ]す、と主[しゅ]は言[い]われる。剣[つるぎ]を殺[ころ]すために、犬[いぬ]を引[ひ]き裂[さ]くために、地[ち]の獣[けもの]と空[そら]の鳥[とり]を食[く]らい、滅[ほろ]ぼすために。"
  4: "わたしは彼らを、地[ち]のすべての王国[おうこく]に苦[くる]しみの中[なか]へ渡[わた]す。ユダの王[おう]、ヒゼキヤの子[こ]マナセのゆえに。彼がエルサレムで行[おこな]ったすべての事[こと]のゆえに。"
  5: "エルサレムよ、だれがあなたをあわれむのか。だれがあなたのために悲[かな]しむのか。だれがあなたの安否[あんぴ]を尋[たず]ねに立[た]ち寄[よ]るのか。"
  6: "あなたはわたしを捨[す]てて背[そむ]き、うしろへ退[しりぞ]いた、と主[しゅ]は言[い]われる。だから、わたしはあなたに手[て]を伸[の]べ、あなたを滅[ほろ]ぼす。わたしはもはや彼らを惜[お]しまない。"
  7: "わたしは彼らを、散[ち]らすことによって散らす。わたしの民[たみ]の門[もん]で、彼らは子[こ]を失[うしな]い、わたしの民を滅[ほろ]ぼした。彼らの悪[あく]のゆえに。そして、彼らは立[た]ち返[かえ]らなかった。"
  8: "彼らのやもめは海[うみ]の砂[すな]よりも多[おお]くなった。わたしは昼[ひる]のうちに、若者[わかもの]の母[はは]の上[うえ]に苦[くる]しみを臨[のぞ]ませ、突然[とつぜん]、恐[おそ]れと慌[あわ]てを彼女[かのじょ]の上[うえ]に投[な]げかけた。"
  9: "七人[ななにん]を産[う]んだ女[おんな]は空[むな]しくなり、息[いき]が絶[た]えた。彼女[かのじょ]の太陽[たいよう]は、まだ昼[ひる]の最中[さいちゅう]に沈[しず]んだ。彼女は恥[は]じ、辱[はずかし]められた。わたしは彼らの残[のこ]りを、彼らの敵[てき]の前[まえ]で剣[つるぎ]に渡[わた]す、と主[しゅ]は言[い]われる。」"
  10: "「ああ、わたしの母[はは]よ。あなたはなぜ、わたしを全[ぜん]地[ち]と争[あらそ]い、論[ろん]じ合[あ]う男[おとこ]として産[う]んだのか。わたしはだれに貸[か]しもせず、だれもわたしに貸[か]しはしなかった。それなのに、すべての者[もの]がわたしを呪[のろ]う。わたしの力[ちから]は、わたしを呪[のろ]う者[もの]たちのゆえに尽[つ]きた。"
  11: "主[しゅ]よ、そうなりますように。彼らを正[ただ]しく導[みちび]く者[もの]たちに。わたしは彼らの災[わざわ]いの時[とき]、彼らの苦[しん]難[なん]の時[とき]に、敵[てき]に対して善[ぜん]を求[もと]めて、あなたのもとへ走[はし]ったのではなかったか。」"
  12: "「鉄[てつ]は知[し]られるだろうか。青銅[せいどう]の覆[おお]いが。"
  13: "あなたの力[ちから]は。わたしはあなたの宝[たから]を、あなたのすべての罪[つみ]の代[か]わりとして、あなたのすべての国境[こっきょう]で、奪[うば]い取[と]るために与[あた]える。"
  14: "わたしはあなたを、あなたの知[し]らない地[ち]で、あなたの周[まわ]りの敵[てき]の奴隷[どれい]とする。わたしの怒[いか]りから火[ひ]が燃[や]き上[あ]がり、あなたがたの上[うえ]で燃[も]え続[つづ]けるからである。」"
  15: "「主[しゅ]よ、あなたはすべてをご存[ぞん]じです。わたしを思[おも]い起[おこ]し、わたしを訪[たず]ね、わたしを追[お]い求[もと]める者[もの]たちからわたしを免[まぬか]れさせてください。あなたの寛容[かんよう]のゆえに、わたしを取[と]り去[さ]らないでください。あなたのゆえにわたしが辱[はずかし]めを受[う]けていることを知[し]ってください。"
  16: "あなたの言葉[ことば]を捨[す]てる者[もの]たちから。彼らを滅[ほろ]ぼし尽[つ]くしてください。あなたの言葉[ことば]がわたしの喜[よろこ]びとなり、心[こころ]の楽[たの]しみとなったからです。万軍[ばんぐん]の主[しゅ]よ、あなたの名[な]がわたしの上[うえ]に呼[よ]ばれているからです。"
  17: "わたしは笑[わら]う者[もの]たちの集[つど]いの中[なか]に座[すわ]らず、喜[よろこ]ばなかった。あなたの手[て]のゆえに、わたしはひとり座[すわ]っていた。あなたがわたしを苦[にが]さで満[み]たしたからである。"
  18: "なぜ、わたしを悲[かな]しませる者[もの]たちが、わたしに勝[まさ]るのか。わたしの傷[きず]は固[かた]く、どこから癒[いや]されるのか。それはわたしにとって、信[しん]のない水[みず]、頼[たよ]りにならない水のようになった。」"
  19: "それゆえ、主[しゅ]はこう言[い]われる。「もし、あなたが立[た]ち返[かえ]るなら、わたしはあなたを立[た]ち返[かえ]らせ、あなたはわたしの前[まえ]に立[た]つ。もし、あなたが尊[とうと]いものを卑[いや]しいものから分[わ]け出[だ]すなら、あなたはわたしの口[くち]のようになる。彼らはあなたのほうへ向[む]きを変[か]えるが、あなたは彼らのほうへ向きを変[か]えてはならない。"
  20: "わたしはあなたを、この民[たみ]に対して、青銅[せいどう]の強[つよ]い城壁[じょうへき]とする。彼らはあなたと戦[たたか]うが、あなたに勝[か]つことはできない。わたしがあなたとともにいて、あなたを救[すく]い、あなたを助[たす]け出[だ]すからである、と主[しゅ]は言[い]われる。"
  21: "悪[わる]い者[もの]たちの手[て]からあなたを救[すく]い出[だ]し、強[つよ]い者[もの]たちの手[て]からあなたを贖[あがな]い出[だ]す。」"

notes:
  1: "Ἐὰν στῇ Μωϋσῆς καὶ Σαμουηλ — «если бы стали Моисей и Самуил» (ἵστημι; слав. «аще станут моисей и самуил»). οὐκ ἔστιν ἡ ψυχή μου πρὸς αὐτούς — «душа Моя не к ним» (слав. «несть душа моя к людем сим»). ἐξαπόστειλον — «отошли» (ἐξαποστέλλω; слав. «изрини»); ἐξελθέτωσαν — «пусть выйдут». Слав. добавляет «от лица моего» (у слав. в скобках) — внесено (わたしの前から)."
  2: "ἐὰν εἴπωσιν Ποῦ ἐξελευσόμεθα — «если скажут: куда нам выйти?»: вопрос людей — 『…』. Ὅσοι εἰς θάνατον, εἰς θάνατον — «кто к смерти, к смерти»: четырёхчленный повтор сохранён (死へ…剣へ…飢えへ…捕囚へ). λιμός — голод; αἰχμαλωσία — плен, 捕囚 (слав. «пленение»)."
  3: "ἐκδικήσω ἐπ᾿ αὐτοὺς τέσσαρα εἴδη — «отмщу им четырьмя видами» (ἐκδικέω; εἶδος — вид; слав. «отмщу… четырьми образы»); εἰς σφαγήν — «на заклание» (σφαγή); εἰς διασπασμόν — «на растерзание» (διασπασμός; слав. «на растерзание»); εἰς βρῶσιν καὶ εἰς διαφθοράν — «в снедь и в погибель» (βρῶσις, διαφθορά). Порядок «звери земные и птицы небесные» — по gr; у слав. птицы впереди."
  4: "εἰς ἀνάγκας πάσαις ταῖς βασιλείαις τῆς γῆς — «в стеснения всем царствам земли» (ἀνάγκη — нужда, стеснение; слав. «во утеснение всем царствам земным»). διὰ Μανασση υἱὸν Εζεκιου — «за Манассию, сына Езекии» (слав. «ради манассии сына езекиина»); περὶ πάντων, ὧν ἐποίησεν — «за всё, что он сделал»."
  5: "τίς φείσεται ἐπὶ σοί — «кто пощадит тебя?» (φείδομαι); τίς δειλιάσει ἐπὶ σοί — «кто устрашится о тебе?» (δειλιάω — робеть); слав. «кто поскорбит о тебе» — иное понимание, взято слав. чтение (悲しむ). τίς ἀνακάμψει εἰς εἰρήνην σοι — «кто свернёт к тебе с миром?», т. е. спросить о мире (ἀνακάμπτω — возвращаться; слав. «кто пойдет молити о мире тебе»)."
  6: "σὺ ἀπεστράφης με — «ты отвратился от Меня» (ἀποστρέφω; слав. «Ты оставил мя еси»); ὀπίσω πορεύσῃ — «назад пойдёшь» (слав. «вспять пошел еси»); ἐκτενῶ τὴν χεῖρά μου — «простру руку Мою» (ἐκτείνω); διαφθερῶ σε — «погублю тебя» (διαφθείρω); οὐκέτι ἀνήσω αὐτούς — «уже не пощажу их» (ἀνίημι — отпускать, щадить; слав. «ктому не пощажу их»)."
  7: "διασπερῶ αὐτοὺς ἐν διασπορᾷ — «рассею их рассеянием» (διασπείρω, διασπορά; слав. «расточу их расточением»): удвоение сохранено. ἐν πύλαις λαοῦ μου ἠτεκνώθησαν — «в воротах народа Моего они лишились детей» (ἀτεκνόω; слав. «обезчадеша»); ἀπώλεσαν τὸν λαόν μου — «погубили народ Мой». Слав. добавляет «и не обратишася» — нет в LXX, внесено (そして、彼らは立ち返らなかった)."
  8: "ἐπληθύνθησαν χῆραι αὐτῶν ὑπὲρ τὴν ἄμμον τῆς θαλάσσης — «умножились вдовы их сверх песка морского» (χῆρα — вдова; ἄμμος — песок); ἐπήγαγον ἐπὶ μητέρα νεανίσκου ταλαιπωρίαν ἐν μεσημβρίᾳ — «навёл на мать юноши бедствие в полдень» (ταλαιπωρία — бедствие; μεσημβρία — полдень; слав. «бедность о полудни»); ἐπέρριψα ἐπ᾽ αὐτὴν ἐξαίφνης τρόμον καὶ σπουδήν — «бросил на неё внезапно трепет и спех» (τρόμος — трепет; σπουδή — поспешность; слав. «страх и трепет»)."
  9: "ἐκενώθη ἡ τίκτουσα ἑπτά — «опустела родившая семерых» (κενόω; слав. «Праздна бысть родившая седмь»); ἀπεκάκησεν ἡ ψυχὴ αὐτῆς — «изнемогла душа её» (ἀποκακέω; слав. «оскуде душа ея»); ἐπέδυ ὁ ἥλιος αὐτῇ — «зашло ей солнце» (ἐπιδύω; слав. «зайде ей солнце»); ἔτι μεσούσης τῆς ἡμέρας — «ещё в середине дня» (μεσόω); κατῃσχύνθη καὶ ὠνειδίσθη — «устыдилась и была поношена» (ὀνειδίζω); τοὺς καταλοίπους — «остатки» (κατάλοιπος; слав. «прочыя»)."
  10: "Οἴμμοι ἐγώ, μῆτερ — «горе мне, мать» (οἴμμοι — увы; слав. «Горе мне, мати (моя)»). ἄνδρα δικαζόμενον καὶ διακρινόμενον πάσῃ τῇ γῇ — «мужа, судящегося и препирающегося со всей землёй» (δικάζω, διακρίνω; слав. «мужа прителнаго и судимаго по всей земли»). οὔτε ὠφέλησα, οὔτε ὠφέλησέν με οὐδείς — «ни я не принёс пользы, ни мне никто» (ὠφελέω); слав. «не заях, ниже заят у мене кто» — «не давал в рост и мне не давали», взято слав. чтение (貸しもせず). ἡ ἰσχύς μου ἐξέλιπεν ἐν τοῖς καταρωμένοις με — «сила моя оскудела среди проклинающих меня» (καταράομαι). Слав. в конце прибавляет «(рече Господь)» — редакционная скобка, в текст не внесена."
  11: "γένοιτο, δέσποτα — «да будет, Владыко» (γένοιτο — оптатив; δεσπότης — владыка; слав. «Буди, Владыко»). κατευθυνόντων αὐτῶν — «при исправлении их», тёмное место (κατευθύνω — направлять, исправлять; слав. «исправляющым им»). εἰ μὴ παρέστην σοι — «не предстал ли я Тебе?» (παρίστημι; слав. «аще не притекох ко тебе»); ἐν καιρῷ τῶν κακῶν αὐτῶν — «во время бед их»; εἰς ἀγαθὰ πρὸς τὸν ἐχθρόν — «на благо против врага» (слав. «во благая на врага»). Место тёмное: у ru (МТ) здесь ответ Господа («Господь сказал: конец твой будет хорош»), но в LXX и слав. это продолжение жалобы пророка, поэтому речь пророка не разрывается (см. отчёт, сомнительное место)."
  12: "εἰ γνωσθήσεται σίδηρος — «будет ли познан (испытан) железо?» (γινώσκω; слав. «еда познается железо»); περιβόλαιον χαλκοῦν — «покрытие медное» (περιβόλαιον — покров, одеяние; χαλκοῦν — медное; слав. «одеяние медяно»). Деление LXX ставит ἡ ἰσχύς σου в начало 15:13, поэтому 13 начинается обрывком (あなたの力は); слав. соединяет с 12 («крепость твоя»)."
  13: "ἡ ἰσχύς σου — «сила твоя»: в gr это начало стиха (обрывок), у слав. — конец 15:12. θησαυρούς — «сокровища» (θησαυρός; слав. «сокровища»); εἰς προνομήν — «в добычу, на разграбление» (προνομή; слав. «в расхищение»); ἀντάλλαγμα — «в замену, взамен» (слав. «измену»); διὰ πάσας τὰς ἁμαρτίας σου — «за все грехи твои»; ἐν πᾶσι τοῖς ὁρίοις σου — «во всех пределах твоих» (ὅριον — предел, граница)."
  14: "καταδουλώσω σε κύκλῳ τοῖς ἐχθροῖς σου — «сделаю тебя рабом окружающим врагам твоим» (καταδουλόω; слав. «порабощу тя окрест врагом твоим»). ἐν τῇ γῇ, ᾗ οὐκ ᾔδεις — «в земле, которой ты не знал»; πῦρ ἐκκέκαυται ἐκ τοῦ θυμοῦ μου — «огонь возжжён от ярости Моей» (ἐκκαίω, θυμός); ἐφ᾽ ὑμᾶς καυθήσεται — «на вас будет гореть»: переход от ед. ч. к мн. сохранён (あなたを…あなたがたの上で)."
  15: "μνήσθητί μου — «вспомни обо мне» (μιμνήσκομαι; слав. «воспомяни мя»); ἐπίσκεψαί με — «посети меня» (ἐπισκέπτομαι); ἀθῴωσόν με — «оправдай, освободи меня» (ἀθῳόω; слав. «защити мя»); ἀπὸ τῶν καταδιωκόντων με — «от гонящих меня» (καταδιώκω); μὴ εἰς μακροθυμίαν — «не в долготерпение», тёмное (μακροθυμία; слав. «не в долготерпение твое восприими мя»); γνῶθι ὡς ἔλαβον περὶ σοῦ ὀνειδισμόν — «знай, что я принял за Тебя поношение» (ὀνειδισμός). Слав. добавляет в начале «Ты веси, Господи» — нет в LXX, внесено (あなたはすべてをご存じです)."
  16: "ὑπὸ τῶν ἀθετούντων τοὺς λόγους σου — «от отвергающих слова Твои»: в gr это начало стиха, у слав. — конец 15:15 (слав. «от отвергающих словеса твоя»); по gr 16 начинается этим оборотом (あなたの言葉を捨てる者たちから). συντέλεσον αὐτούς — «истреби их» (συντελέω; слав. «скончай их»); εἰς εὐφροσύνην καὶ χαρὰν καρδίας — «в веселие и радость сердца» (εὐφροσύνη); ἐπικέκληται τὸ ὄνομά σου ἐπ᾽ ἐμοί — «имя Твоё наречено на мне» (ἐπικαλέω); κύριε παντοκράτωρ — «Господи Вседержителю» (παντοκράτωρ; слав. «Господи Боже сил»), передано 万軍の主. У ru (МТ) в начале «Обретены слова Твои, и я съел их» — этого нет ни в LXX, ни в слав., не внесено."
  17: "οὐκ ἐκάθισα ἐν συνεδρίῳ αὐτῶν παιζόντων — «не сидел я в собрании их играющих» (συνέδριον — собрание; παίζω — играть, шутить; слав. «в сонме их играющих»); εὐλαβούμην ἀπὸ προσώπου χειρός σου — «я благоговел от лица руки Твоей» (εὐλαβέομαι — благоговеть, бояться; слав. «бояхся от лица руки твоея»); κατὰ μόνας ἐκαθήμην — «сидел я одиноко» (слав. «на едине седях»); ὅτι πικρίας ἐνεπλήσθην — «ибо исполнился горечи» (πικρία — горечь; слав. «горести исполнихся»)."
  18: "ἵνα τί οἱ λυποῦντές με κατισχύουσίν μου — «зачем огорчающие меня одолевают меня?» (λυπέω — огорчать; κατισχύω — одолевать; слав. «Вскую оскорбляющии мя возмогают на мя»); ἡ πληγή μου στερεά — «рана моя тверда» (στερεός — твёрдый; слав. «язва моя тверда»); πόθεν ἰαθήσομαι — «откуда исцелюсь?» (ἰάομαι); γινομένη ἐγενήθη μοι — «бывая, стала мне»: усиление через причастие и аорист сохранено одним оборотом; ὕδωρ ψευδὲς οὐκ ἔχον πίστιν — «вода ложная, не имеющая верности» (ψευδής, πίστις; слав. «вода лживая, не имущая верности»)."
  19: "ἐὰν ἐπιστρέψῃς, καὶ ἀποκαταστήσω σε — «если обратишься, и восстановлю тебя» (ἐπιστρέφω, ἀποκαθίστημι; слав. «аще обратишися, возставлю тя»); πρὸ προσώπου μου στήσῃ — «пред лицем Моим станешь» (ἵστημι); ἐὰν ἐξαγάγῃς τίμιον ἀπὸ ἀναξίου — «если изведёшь драгоценное из недостойного» (τίμιος — драгоценный; ἀνάξιος — недостойный; слав. «изведеши честное от недостойнаго»); ὡς στόμα μου ἔσῃ — «как уста Мои будешь»; ἀναστρέψουσιν αὐτοὶ πρὸς σέ — «они обратятся к тебе»; σὺ οὐκ ἀναστρέψεις πρὸς αὐτούς — «ты не обратишься к ним». Формула «так говорит Господь» вне кавычек."
  20: "τεῖχος ὀχυρὸν χαλκοῦν — «стена крепкая медная» (τεῖχος — стена; ὀχυρός — крепкий; χαλκοῦς — медный; слав. «стена крепка, медяна»); πολεμήσουσιν πρὸς σὲ — «будут воевать против тебя» (πολεμέω); οὐ μὴ δύνωνται — «не возмогут»; μετὰ σοῦ εἰμι τοῦ σῴζειν σε — «с тобою Я, чтобы спасать тебя» (σῴζω). Слав. добавляет «и избавлю тя, рече Господь» — нет в LXX, внесено (あなたを助け出す…と主は言われる)."
  21: "ἐξαιρεῖσθαί σε ἐκ χειρὸς πονηρῶν — «изымать тебя из руки злых» (ἐξαιρέω; слав. «избавлю тя от рук злейших»); λυτρώσομαί σε ἐκ χειρὸς λοιμῶν — «искуплю тебя из руки губителей» (λυτρόω — искуплять; λοιμός — губитель, язва; слав. «искуплю тя от рук губителей»). Инфинитив ἐξαιρεῖσθαι продолжает 15:20 («с тобою Я, чтобы спасать…»), поэтому стих — продолжение одного обещания."
