# jp-box, 2-я Паралипоменон, глава 14. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc для книги нет,
# jp-ni (под авторским правом) не использовался.
# Язык — современный 常体 (в речи тоже); порядок членов и деление на клаузы —
# по греческому.
# Глава 14: реформы Асы (1–4), укреплённые города и войско (5–7),
# нашествие Зарая Эфиоплянина и победа (8–14).
# Речь — 「…」: 6 (Аса к Иуде), 10 (молитва Асы). Красного нет.
# Нумерация по gr-lxx-byz: 14 стихов (15-го стиха в gr нет); у csl-ru 15
# стихов, у ru тоже 15. Вся глава в csl сдвинута на +1: gr 14:N = csl 14:N+1
# (gr 14:1 = csl 14:2, gr 14:14 = csl 14:15), см. notes каждой строки.
# Числа: 14:7 — у гр. 250 000 вениамитян, у csl и ru 280 000; в тексте csl,
# вариант гр. — в notes.
# Паритет: слав. чтения входят в основной текст без 〔…〕, вариант LXX — в notes
# (14:5 глагол «созда», 14:7 число, 14:10 «ты еси Бог»).
# 〔…〕 нет: текст всех стихов есть в gr-lxx-byz.
# Сносок ⟨…⟩ нет: 祭壇, 高い所, 石柱, 木立, 戦車 уже в корпусе.
# jp-ni не использовался.

tr_code: jp-box
book: 2par
chapter: 14
draft: true

verses:
  1: "アサは、自分[じぶん]の神である主の前[まえ]に良[よ]いことと正[ただ]しいことを行[おこな]った。"
  2: "彼[かれ]は異邦[いほう]の者[もの]たちの祭壇[さいだん]と高[たか]い所[ところ]を取[と]り除[のぞ]き、石柱[せきちゅう]を砕[くだ]き、木立[こだち]を切[き]り倒[たお]した。"
  3: "そしてユダに、父祖[ふそ]の神である主を求[もと]め、その律法[りっぽう]と戒[いまし]めを行[おこな]うように命[めい]じた。"
  4: "彼[かれ]はユダのすべての町[まち]から祭壇を取[と]り除[のぞ]き、偶像[ぐうぞう]を除[のぞ]いた。そして彼は平和[へいわ]のうちに治[おさ]めた。"
  5: "彼[かれ]はユダの地[ち]に城壁[じょうへき]のある町々[まちまち]を建[た]てた。地が平和であったからである。これらの年[とし]々[びと]には彼に戦[たたか]いがなかった。主が彼に安[やす]らぎを与[あた]えられたからである。"
  6: "彼はユダに言[い]った。「さあ、これらの町を建[た]て、城壁とやぐら、門[もん]と横木[よこぎ]を備[そな]えよう。この地はまだ私たちのものだからである。私たちが自分たちの神である主を求めたので、主は私たちを求めて、周[まわ]りから私たちに安らぎを与[あた]え、私たちを栄[さか]えさせてくださった。」"
  7: "アサの軍[ぐん]は、ユダの地で大盾[おおだて]と槍[やり]を持[も]つ者[もの]が三十万[さんじゅうまん]人[にん]、ベニヤミンの地で小盾[こだて]と弓[ゆみ]を持つ者が二十八万[にじゅうはちまん]人[にん]であった。これらの者はみな、力[ちから]ある戦士[せんし]たちであった。"
  8: "エチオピア人[じん]ザライが、百万[ひゃくまん]の軍勢[ぐんぜい]と三百[さんびゃく]の戦車[せんしゃ]をもって、彼らに向[む]かって出[で]て来[き]た。彼はマリサまで来[き]た。"
  9: "アサは彼に向かって出て、マリサの北[きた]の谷[たに]で戦[いくさ]の備[そな]えを整[ととの]えた。"
  10: "アサは彼の神である主に向[む]かって叫[さけ]び、言った。「主[しゅ]よ、多[おお]い者[もの]を救[すく]うにも少[すく]ない者を救うにも、あなたには力[ちから]が及[およ]ばない、ということはない。私たちを強[つよ]くしてください。私たちの神である主よ。私たちはあなたに頼[たよ]り、あなたの名[な]によってこの大[おお]きな群[む]れに向かって来[き]たのだ。私たちの神である主よ、あなたこそ神[かみ]だ。人[ひと]があなたに勝[か]つことのないようにしてください。」"
  11: "主はユダの前[まえ]でエチオピア人たちを打[う]たれ、エチオピア人たちは逃[に]げた。"
  12: "アサと彼とともにいた民[たみ]は、彼らをゲドルまで追撃[ついげき]した。エチオピア人は倒れ、生[い]き残[のこ]った者[もの]は一人[ひとり]もいなかった。主の前[まえ]、またその力[ちから]の前[まえ]で打[う]ち砕[くだ]かれたからである。彼らは多[おお]くの分捕[ぶんど]り物[もの]を取[と]った。"
  13: "彼らはゲドルの周[まわ]りの村々[むらむら]を打[う]ち壊[こわ]した。主への恐[おそ]れが彼らの上[うえ]に下[くだ]ったからである。彼らはそのすべての町々[まちまち]を略奪[りゃくだつ]した。多[おお]くの分捕[ぶんど]り物[もの]が彼らにあったからである。"
  14: "彼らは家畜[かちく]の天幕[てんまく]を打[う]ち壊し、アマゾン人[じん]を打[う]ち倒[たお]して、多[おお]くの羊[ひつじ]とらくだを取[と]って、エルサレムに帰[かえ]った。"

notes:
  1: "καὶ ἐποίησεν τὸ καλὸν καὶ τὸ εὐθὲς ἐνώπιον κυρίου θεοῦ αὐτοῦ — и сделал доброе и правое пред Господом Богом своим. В csl это 14:2: в csl гл. 13 кончается 22-м стихом, а gr 13:23 стоит у csl как 14:1; поэтому gr 14:N = csl 14:N+1. Слав. «благое и правое пред Господем Богом своим» — то же."
  2: "В csl это 14:3. ἀπέστησεν — отставил, убрал; τὰ θυσιαστήρια τῶν ἀλλοτρίων — жертвенники чужих; τὰ ὑψηλά — высоты (高い所); συνέτριψεν τὰς στήλας — сокрушил столпы (στήλη; слав. «идолы»); ἐξέκοψεν τὰ ἄλση — вырубил рощи (ἄλσος; слав. «дубравы», 木立)."
  3: "В csl это 14:4. εἶπεν τῷ Ιουδα — сказал Иуде; ἐκζητῆσαι τὸν κύριον θεὸν τῶν πατέρων αὐτῶν — взыскать Господа Бога отцов их (ἐκζητέω); ποιῆσαι τὸν νόμον καὶ τὰς ἐντολάς — исполнить закон и заповеди."
  4: "В csl это 14:5. ἀπὸ πασῶν τῶν πόλεων Ιουδα — из всех городов Иуды; τὰ θυσιαστήρια καὶ τὰ εἴδωλα — жертвенники и идолы; καὶ εἰρήνευσεν — и был в мире; слав. «и царствова в мире» — и царствовал в мире, в тексте csl (平和のうちに治めた)."
  5: "В csl это 14:6. В гр-lxx-byz стих начинается без глагола: πόλεις τειχήρεις ἐν γῇ Ιουδα... — «города укреплённые в земле Иуды»; глагол «созда» (建てた) взят из csl, где он есть. ὅτι εἰρήνευσεν ἡ γῆ — ибо была в мире земля; οὐκ ἦν αὐτῷ πόλεμος ἐν τοῖς ἔτεσιν τούτοις — не было ему войны в эти годы; ὅτι κατέπαυσεν αὐτῷ κύριος — ибо успокоил его Господь."
  6: "В csl это 14:7. Οἰκοδομήσωμεν — построим; ποιήσωμεν τείχη καὶ πύργους καὶ πύλας καὶ μοχλούς — сделаем стены, башни (слав. «столпы»), ворота и засовы (μοχλός); ἐν ᾧ τῆς γῆς κυριεύσομεν — пока владеем землёю; καθὼς ἐξεζητήσαμεν κύριον... ἐξεζήτησεν ἡμᾶς — как мы взыскали Господа, Он взыскал нас; κατέπαυσεν ἡμᾶς κυκλόθεν — успокоил нас окрест; εὐόδωσεν ἡμῖν — дал нам успех."
  7: "В csl это 14:8. ὁπλοφόρων αἰρόντων θυρεοὺς καὶ δόρατα — оруженосцев, носящих большие щиты (θυρεός) и копья; πελτασταὶ καὶ τοξόται — щитоносцы и стрелки; гр. διακόσιαι καὶ πεντήκοντα χιλιάδες — 250 000 вениамитян, у csl и ru «двести осмьдесят тысящ» / 280 000; в тексте csl. πάντες πολεμισταὶ δυνάμεως — все воины силы."
  8: "В csl это 14:9. Καὶ ἐξῆλθεν ἐπ᾽ αὐτοὺς Ζαρε ὁ Αἰθίοψ — и вышел на них Зара Эфиоплянин (Ζαρε; слав. «зарай»; Синод. «Зарай»); ἐν χιλίαις χιλιάσιν — с тысячью тысяч, т. е. миллион; ἅρμασιν τριακοσίοις — с тремястами колесниц; ἦλθεν ἕως Μαρισα — дошёл до Марисы."
  9: "В csl это 14:10. ἐξῆλθεν εἰς συνάντησιν αὐτῷ — вышел навстречу ему; παρετάξατο πόλεμον — выстроил войну, т. е. построил войско к бою; ἐν τῇ φάραγγι κατὰ βορρᾶν Μαρισης — в долине к северу от Марисы (φάραγξ — ущелье; слав. «в дебри»)."
  10: "В csl это 14:11. οὐκ ἀδυνατεῖ παρὰ σοὶ σῴζειν ἐν πολλοῖς καὶ ἐν ὀλίγοις — не бессильно у Тебя спасать во многих и в малых; κατίσχυσον ἡμᾶς — укрепи нас; ἐπὶ τῷ ὀνόματί σου ἤλθαμεν — во имя Твоё пришли; μὴ κατισχυσάτω πρὸς σὲ ἄνθρωπος — да не превозможет против Тебя человек. Слав. добавляет «ты еси Бог» (в гр. нет) — внесено (あなたこそ神だ)."
  11: "В csl это 14:12. ἐπάταξεν κύριος τοὺς Αἰθίοπας ἐναντίον Ιουδα — поразил Господь эфиопов пред Иудой; ἔφυγον οἱ Αἰθίοπες — побежали эфиопы."
  12: "В csl это 14:13. ἕως Γεδωρ — до Гедор (Γεδωρ; слав. «гедор»; Синод. «Герар» — иное отождествление); ὥστε μὴ εἶναι ἐν αὐτοῖς περιποίησιν — так что не было у них сбережённого, т. е. никого не осталось; συνετρίβησαν ἐνώπιον κυρίου καὶ ἐναντίον τῆς δυνάμεως αὐτοῦ — сокрушены пред Господом и пред силою Его; ἐσκύλευσαν σκῦλα πολλά — набрали добычи много."
  13: "В csl это 14:14. ἐξέκοψαν τὰς κώμας αὐτῶν κύκλῳ Γεδωρ — вырубили сёла их вокруг Гедор; ἐγενήθη ἔκστασις κυρίου ἐπ᾽ αὐτούς — нашло на них исступление (ужас) Господне; слав. «страх Господень велик» — в тексте csl; ἐσκύλευσαν πάσας τὰς πόλεις αὐτῶν — разграбили все города их."
  14: "В csl это 14:15; в gr-lxx-byz это последний стих главы, 15-го стиха там нет. σκηνὰς κτήσεων — шатры имений (κτῆσις — владение), т. е. кочевые стойбища (слав. «кущы скотския»); τοὺς Αμαζονεῖς — «амазонцев» (Ἀμαζονεῖς — передача евр. названия; слав. «амазонов»); πρόβατα πολλά — много овец; καμήλους — верблюдов; ἐπέστρεψαν εἰς Ιερουσαλημ — возвратились в Иерусалим."
