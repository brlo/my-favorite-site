# jp-box, Даниил, глава 5. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru) по паритету
# (csl-чтения в основном тексте без 〔…〕, вариант LXX — в notes); ru — не источник.
# Нумерация — по славяно-синодальной: 31 стих. В gr-lxx-byz глава — 5:1–30, наш стих
# совпадает по номеру (наш 5:1 = gr 5:1 … наш 5:30 = gr 5:30). Наш 5:31 («Дарий Мидянин
# принял царство») в гр. модуле отдельного стиха не имеет: это конец gr 5:30 («и царство
# отнято у Халдеев и отдано Мидянем и Персам») + слав./МТ «сый шестидесяти и двою лет»;
# поэтому 5:31 отделён от 5:30 и переведён по слав. (csl-ru 5:31).
# «Точки» gr (5:14, 5:15, 5:18–22, 5:24–28) закрыты по слав. тех же номеров без 〔…〕,
# в notes отмечено. В модуле истолкование надписи стоит в конце gr 5:23 с пометой
# «26–28» (ἠρίθμηται ὁ χρόνος σου τῆς βασιλείας…); у нас оно разнесено по слав. 5:26–28.
# Язык — современный 常体; порядок членов и клаузы — по греческому/слав.
# 〔…〕 нет; сносок ⟨…⟩ нет.
#
# Содержание: 5:1–4 пир Валтасара, сосуды храма, хвала идолам; 5:5–6 персты и надпись,
# страх царя; 5:7–9 мудрецы не могут, царь в смятении; 5:10–12 царица вспоминает
# Даниила; 5:13–16 Даниил перед царём, обещание багряницы; 5:17–24 отказ от даров
# и обличение: Навуходоносор, его безумие, «ты не смирился»; 5:25–28 надпись
# и «мани, фекел, фарес»; 5:29 награда Даниилу; 5:30 гибель Валтасара;
# 5:31 Дарий Мидянин принимает царство.
# Голоса: 5:7 — речь царя 「…»; 5:10–12 — речь царицы 「…»; 5:13–16 — речь царя 「…»;
# 5:17–28 — ответ Даниила 「…» (внутри 5:25–28 надпись и её слова — 『…』);
# 5:6, 8–9, 29–31 — авторское повествование, без кавычек.
# Термины: 酒宴[しゅえん] — δοχή/ἑστιατορία (пир); 神殿[しんでん] — οἶκος τοῦ θεοῦ;
# 器[うつわ] — σκεῦος; 呪術師[じゅじゅつし]/カルデア人[じん]/占[うらな]い師[し] — ἐπαοιδοί/
# Χαλδαῖοι/γαζαρηνοί (как в 4:4); 知者[ちしゃ] — σοφοί; 紫[むらさき]の衣[ころも] — πορφύρα;
# 金[きん]の鎖[くさり] — μανιάκης χρυσοῦς («гривна златая»); 第三[だいさん]の支配[しはい]者[しゃ] —
# τρίτος ἐν τῇ βασιλείᾳ; 解[と]き明[あ]かし — σύγκρισις; 奥秘[おうぎ] — μυστήριον;
# 王座[おうざ] — θρόνος; 秤[はかり]にかける — «поставися в мерилех» (ἐν ζυγῷ ἱστάναι).
# Имена: バルタザル, ネブカドネツァル, ダニエル, ダリウス, バビロン, メディア人[じん],
# ペルシア人[じん] — по брифу и корпусу. Надпись — マニ、テケル、ファレス (по слав.
# «мани, фекел, фарес»); греч. формы — в notes.

