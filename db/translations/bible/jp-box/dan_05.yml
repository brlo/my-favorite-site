verses:
  1: "バルタザル王[おう]は、千[せん]人[にん]の貴[き]人[じん]たちのために大[おお]きな酒宴[しゅえん]を催[もよお]し、その千人[せんにん]の見[み]ている前[まえ]で酒[さけ]を飲[の]んだ。"
  2: "酒[さけ]を味[あじ]わったとき、バルタザルは命[めい]じた。その父[ちち]ネブカドネツァルがエルサレムの神殿[しんでん]から持[も]ち出[だ]した金[きん]と銀[ぎん]の器[うつわ]を持[も]って来[こ]させ、王[おう]も貴[き]人[じん]たちも、その妻[つま]たちも側女[そばめ]たちも、それで酒[さけ]を飲[の]むように、と。"
  3: "そこで金[きん]と銀[ぎん]の器[うつわ]が運[はこ]ばれて来[き]た。王[おう]がエルサレムにある主[しゅ]の神[かみ]の神殿[しんでん]から持[も]ち出[だ]したものである。王[おう]も貴[き]人[じん]たちも、妻[つま]たちも側女[そばめ]たちも、それで酒[さけ]を飲[の]んだ。"
  4: "彼らは酒[さけ]を飲[の]み、金[きん]や銀[ぎん]、青銅[せいどう]や鉄[てつ]、木[き]や石[いし]の神々[かみがみ]をほめたたえた。しかし、彼らの霊[れい]を治[おさ]める権[けん]力[りょく]を持[も]つ永遠[えいえん]の神[かみ]をほめたたえなかった。"
  5: "その時[とき]、人[ひと]の手[て]の指[ゆび]が現[あらわ]れ、ともし火[び]の向[む]こうの王[おう]の家[いえ]の壁[かべ]の漆喰[しっくい]の上[うえ]に書[か]き始[はじ]めた。王[おう]は書[か]いている手[て]の指[ゆび]を見[み]た。"
  6: "そのとき、王[おう]の顔色[かおいろ]は変[か]わり、その思[おも]いは彼をかき乱[みだ]し、腰[こし]の筋[すじ]はゆるみ、膝[ひざ]は互[たが]いに打[う]ち合[あ]った。"
  7: "王[おう]は大声[おおごえ]で叫[さけ]び、呪術師[じゅじゅつし]たち、カルデア人[じん]たち、占[うらな]い師[し]たちを連[つ]れて来[こ]させた。王[おう]はバビロンの知者[ちしゃ]たちに言[い]った。「この書[か]き物[もの]を読[よ]み、その意味[いみ]をわたしに告[つ]げる者[もの]は、紫[むらさき]の衣[ころも]を着[き]せられ、金[きん]の鎖[くさり]を首[くび]にかけられ、わが王国[おうこく]の第三[だいさん]の支配[しはい]者[しゃ]となる。」"
  8: "王[おう]の知者[ちしゃ]たちはすべて入[はい]って来[き]たが、その書[か]き物[もの]を読[よ]むことも、その意味[いみ]を王[おう]に告[つ]げることもできなかった。"
  9: "バルタザル王[おう]はひどく取[と]り乱[みだ]れ、その顔[かお]つきは変[か]わり、貴[き]人[じん]たちも当惑[とうわく]した。"
  10: "女王[じょおう]は宴会[えんかい]の間[ま]に入[はい]って来[き]て言[い]った。「王[おう]よ、永遠[えいえん]に生[い]きよ。あなたの思[おも]いがあなたをかき乱[みだ]すことのありませんように。顔[かお]つきが変[か]わることのありませんように。"
  11: "あなたの王国[おうこく]に一人[ひとり]の男[おとこ]がいます。そのうちに神[かみ]の霊[れい]があります。あなたの父[ちち]の日[ひ]々[び]に、この者[もの]のうちに目覚[めざ]めと悟[さと]りが見[み]いだされました。ネブカドネツァル王[おう]、あなたの父[ちち]は、この者[もの]を呪術師[じゅじゅつし]たち、賢者[けんじゃ]たち、カルデア人[じん]たち、占[うらな]い師[し]たちの長[かしら]とされました。"
  12: "この者[もの]のうちにすぐれた霊[れい]があり、知識[ちしき]と悟[さと]りがあって、夢[ゆめ]を解[と]き、隠[かく]されたことを告[つ]げ、結[むす]び目[め]を解[と]くのです。ダニエル、すなわち王[おう]がバルタザルという名[な]を与[あた]えた者[もの]です。今[いま]、彼を呼[よ]び寄[よ]せてください。彼があなたにその解[と]き明[あ]かしを告[つ]げるでしょう。」"
  13: "そこでダニエルは王[おう]の前[まえ]に連[つ]れて来[こ]られた。王[おう]はダニエルに言[い]った。「あなたがダニエルか。わが父[ちち]である王[おう]がユダヤから連[つ]れて来[き]た捕囚[ほしゅう]の子[こ]らの一人[ひとり]、あのダニエルか。"
  14: "わたしはあなたのことを聞[き]いた。神[かみ]の霊[れい]があなたのうちにあり、目覚[めざ]めと悟[さと]りと、すぐれた知恵[ちえ]があなたのうちに見[み]いだされた、と。"
  15: "今[いま]、知者[ちしゃ]たちと賢者[けんじゃ]たちと占[うらな]い師[し]たちがわたしの前[まえ]に連[つ]れて来[こ]られた。この書[か]き物[もの]を読[よ]み、その解[と]き明[あ]かしをわたしに告[つ]げるためであったが、彼らはそれを告[つ]げることができなかった。"
  16: "わたしはあなたのことを聞[き]いた、あなたは難[なん]題[だい]を解[と]くことができる、と。それなら今[いま]、もしこの書[か]き物[もの]を読[よ]み、その解[と]き明[あ]かしをわたしに告[つ]げることができれば、あなたは紫[むらさき]の衣[ころも]を着[き]せられ、金[きん]の鎖[くさり]があなたの首[くび]にかけられ、わが王国[おうこく]の第三[だいさん]の支配[しはい]者[しゃ]となるであろう。」"
  17: "そこでダニエルは答[こた]えて、王[おう]の前[まえ]で言[い]った。「あなたの贈[おく]り物[もの]はあなたのもとに置[お]き、家[いえ]への賜[たま]り物[もの]はほかの人[ひと]に与[あた]えてください。それでも、わたしは王[おう]にこの書[か]き物[もの]を読[よ]み、その解[と]き明[あ]かしをあなたに告[つ]げましょう。"
  18: "王[おう]よ。いと高[たか]い神[かみ]は、あなたの父[ちち]ネブカドネツァルに王国[おうこく]と威[い]、誉[ほま]れと栄光[えいこう]をお与[あた]えになった。"
  19: "その方[かた]が彼に与[あた]えた威[い]のゆえに、すべての民[たみ]、部族[ぶぞく]、言[こと]語[ご]の者[もの]たちは、彼の顔[かお]の前[まえ]に震[ふる]え恐[おそ]れた。彼は殺[ころ]そうと思[おも]う者[もの]を殺[ころ]し、打[う]とうと思[おも]う者[もの]を打[う]ち、高[たか]めようと思[おも]う者[もの]を高[たか]め、低[ひく]くしようと思[おも]う者[もの]を低[ひく]くした。"
  20: "しかし、その心[こころ]が高[たか]ぶり、その霊[れい]が傲慢[ごうまん]に固[かた]まると、彼は王[おう]の座[ざ]から下[お]ろされ、その栄光[えいこう]と誉[ほま]れは彼から取[と]り去[さ]られた。"
  21: "彼は人[ひと]々[びと]から追[お]い払[はら]われ、その心[こころ]は獣[けもの]のものとされ、野[の]の驢馬[ろば]たちとともに暮[く]らした。牛[うし]のように草[くさ]を食[た]べさせられ、その身[み]は天[てん]の露[つゆ]にぬれた。ついに彼は知[し]った。人[ひと]の王国[おうこく]を治[おさ]めるのはいと高[たか]い神[かみ]であり、これを望[のぞ]む者[もの]に与[あた]えられることを。"
  22: "ところが、あなたはその子[こ]バルタザルよ、これらすべてを知[し]っていながら、主[しゅ]の前[まえ]で心[こころ]を低[ひく]くしなかった。"
  23: "あなたは天[てん]の主[しゅ]である神[かみ]に逆[さか]らって、その神殿[しんでん]の器[うつわ]をあなたの前[まえ]に運[はこ]ばせ、あなたも貴[き]人[じん]たちも、妻[つま]たちも側女[そばめ]たちも、それで酒[さけ]を飲[の]んだ。そして、見[み]ることも聞[き]くことも知[し]ることもできない、金[きん]や銀[ぎん]、青銅[せいどう]や鉄[てつ]、木[き]や石[いし]の神々[かみがみ]をほめたたえ、あなたの息[いき]をその手[て]に握[にぎ]り、あなたのすべての道[みち]を導[みちび]いておられる神[かみ]をほめたたえなかった。"
  24: "それゆえ、その方[かた]の前[まえ]から手[て]の指[ゆび]が遣[つか]わされ、この書[か]き物[もの]が記[しる]されたのです。"
  25: "記[しる]されたのは、次のとおりです。『マニ、テケル、ファレス。』"
  26: "『マニ』とは、神[かみ]があなたの王国[おうこく]を量[はか]って、それに終[おわ]りを定[さだ]められたという意味[いみ]です。"
  27: "『テケル』とは、あなたが秤[はかり]にかけられて、目[め]方[かた]が軽[かる]いと見[み]られたという意味[いみ]です。"
  28: "『ファレス』とは、あなたの王国[おうこく]が分[わ]けられて、メディア人[じん]とペルシア人[じん]に与[あた]えられたという意味[いみ]です。」"
  29: "そこでバルタザルは命[めい]じた。人[ひと]々[びと]はダニエルに紫[むらさき]の衣[ころも]を着[き]せ、金[きん]の鎖[くさり]をその首[くび]にかけ、彼が王国[おうこく]の第三[だいさん]の支配[しはい]者[しゃ]であることを告[つ]げ知[し]らせた。"
  30: "その夜[よる]、カルデア人[じん]の王[おう]バルタザルは殺[ころ]された。"
  31: "メディア人[じん]ダリウスが王国[おうこく]を受[う]け取[と]った。彼は六十[ろくじゅう]二[に]歳[さい]であった。"

notes:
  1: "Βαλτασαρ ὁ βασιλεὺς ἐποίησεν ἑστιατορίαν μεγάλην τοῖς ἑταίροις αὐτοῦ καὶ ἔπινεν οἶνον — «Валтасар царь сделал большое пиршество друзьям своим и пил вино»; в модуле gr 5:1 с пометой «[Title]» даёт и другую форму: «сделал большое угощение в день обновления царства своего и из вельмож своих позвал две тысячи мужей». Слав. (МТ 5:1): «валтасар царь сотвори вечерю велию вельможам своим тысящи мужем» — «для тысячи мужей»; по паритету взят слав. (千[せん]人[にん]). 酒宴[しゅえん] — δοχή, пир."
  2: "καὶ ἀνυψώθη ἡ καρδία αὐτοῦ, καὶ εἶπεν ἐνέγκαι τὰ σκεύη τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ τοῦ οἴκου τοῦ θεοῦ, ἃ ἤνεγκε Ναβουχοδονοσορ ὁ πατὴρ αὐτοῦ ἀπὸ Ιερουσαλημ, καὶ οἰνοχοῆσαι ἐν αὐτοῖς — «и вознеслось сердце его, и сказал принести сосуды золотые и серебряные дома Божия, которые вынес Навуходоносор, отец его, из Иерусалима, и пить из них». Слав. (МТ 5:2): «пред тысящею же вино, и пия валтасар рече при вкушении вина, еже принести сосуды златы и сребряны… и да пиют в них царь и вельможи его, и наложницы его и возлежащыя (окрест) его»; по паритету взят слав. (вино перед тысячей, жёны и наложницы)."
  3: "В LXX (gr 5:3) стих краток: καὶ ἠνέχθη, καὶ ἔπινον ἐν αὐτοῖς — «и принесено было, и пили из них». Слав. (МТ 5:3) повторяет: «и принесоша сосуды златыя и сребряныя, яже изнесе (навуходоносор царь) из храма Господа Бога, иже во Иерусалиме: и пияху ими царь и вельможи его, и наложницы его и возлежащыя (окрест) его»; по паритету взят слав. 神殿[しんでん] — οἶκος τοῦ θεοῦ; ср. 1:2 и 5:23."
  4: "καὶ ηὐλόγουν τὰ εἴδωλα τὰ χειροποίητα αὐτῶν, καὶ τὸν θεὸν τοῦ αἰῶνος οὐκ εὐλόγησαν τὸν ἔχοντα τὴν ἐξουσίαν τοῦ πνεύματος αὐτῶν — «и благословляли идолов рукотворённых своих, а Бога века не благословили, имеющего власть над духом их» (gr 5:4). Слав. (МТ 5:4): «пияху вино и похвалиша боги златыя и сребряныя, и медяныя и железныя, и древяныя и каменныя, а Бога вечнаго не благословиша, имущаго власть духа их»; по паритету взят слав. (перечисление шести материалов), прибавка LXX о «власти над духом их» в слав. тоже есть — 彼らの霊[れい]を治[おさ]める権[けん]力[りょく]."
  5: "ἐν αὐτῇ τῇ ὥρᾳ ἐκείνῃ ἐξῆλθον δάκτυλοι ὡσεὶ χειρὸς ἀνθρώπου καὶ ἔγραψαν ἐπὶ τοῦ τοίχου τοῦ οἴκου αὐτοῦ ἐπὶ τοῦ κονιάματος κατέναντι τοῦ φωτὸς ἔναντι τοῦ βασιλέως Βαλτασαρ, καὶ εἶδε χεῖρα γράφουσαν — «в тот самый час вышли персты как бы руки человеческой и писали на стене дома его, на извести, против света, перед царём Валтасаром, и он увидел руку пишущую» (gr 5:5). Слав. (МТ 5:5): «в той час изыдоша персты руки человечи и писаху противу лампады на поваплении стены дому царева, и царь видяше персты руки пишущия»; по паритету взят слав. (лампада, побелка/известь)."
  6: "καὶ ἡ ὅρασις αὐτοῦ ἠλλοιώθη, καὶ φόβοι καὶ ὑπόνοιαι αὐτὸν κατέσπευδον — «и вид его изменился, и страхи и помыслы устремились на него» (gr 5:6). Слав. (МТ 5:6): «тогда царю зрак изменися, и размышления его смущаху его, и соузы чресл его разслабляхуся, и колена его сражастася» — «связи чресл его ослабели, и колени его стали биться одно о другое»; по паритету взят слав. 腰[こし]の筋[すじ] — «связи чресл» (σύσφιγξις τῶν ὀσφύων)."
  7: "καὶ ὁ βασιλεὺς ἐφώνησε φωνῇ μεγάλῃ καλέσαι τοὺς ἐπαοιδοὺς καὶ φαρμακοὺς καὶ Χαλδαίους καὶ γαζαρηνούς… τότε ὁ βασιλεὺς ἐξέθηκε πρόσταγμα λέγων· Πᾶς ἀνήρ, ὃς ἂν ὑποδείξῃ τὸ σύγκριμα τῆς γραφῆς, στολιεῖ αὐτὸν πορφύραν καὶ μανιάκην χρυσοῦν περιθήσει αὐτῷ, καὶ δοθήσεται αὐτῷ ἐξουσία τοῦ τρίτου μέρους τῆς βασιλείας — «и царь вскричал громким голосом позвать ἐπαοιδούς, φαρμακούς, Халдеев и γαζαρηνούς… тогда царь изложил повеление: всякий муж, кто покажет истолкование написанного, облечётся в порфиру, и золотая цепь будет возложена на него, и дана ему власть третьей части царства» (gr 5:7). Слав. (МТ 5:7) перечисляет трёх: «и возопи царь силою, еже ввести волхвов, халдеев, газаринов: и рече царь мудрым вавилонским: иже прочтет писание сие и разум его возвестит мне, той в багряницу облечется, и гривна златая на выю его, и третий во царстве моем обладати начнет»; по паритету взят слав. (три разряда). LXX добавляет, что мудрецы «входили смотреть написанное и не могли истолковать его царю» — это в 5:8."
  8: "καὶ εἰσεπορεύοντο οἱ ἐπαοιδοὶ καὶ φαρμακοὶ καὶ γαζαρηνοί, καὶ οὐκ ἠδύνατο οὐδεὶς τὸ σύγκριμα τῆς γραφῆς ἀπαγγεῖλαι — «и входили ἐπαοιδοί, φαρμακοί и γαζαρηνοί, и никто не мог возвестить истолкование написанного» (gr 5:8). Слав. (МТ 5:8): «и вхождаху вси мудрии ко царю и не можаху писания прочести, ни разума царю возвестити»; по паритету взят слав. (知者[ちしゃ], без перечисления разрядов)."
  9: "Слав. (МТ 5:9): «царь же валтасар возмятеся, и зрак его изменися на нем, и вельможи его смущахуся». LXX (gr 5:9) иначе: τότε ὁ βασιλεὺς ἐκάλεσε τὴν βασίλισσαν περὶ τοῦ σημείου καὶ ὑπέδειξεν αὐτῇ, ὡς μέγα ἐστί, καὶ ὅτι πᾶς ἄνθρωπος οὐ δύναται ἀπαγγεῖλαι τῷ βασιλεῖ τὸ σύγκριμα τῆς γραφῆς — «тогда царь позвал царицу ради знамения и показал ей, сколь оно велико, и что ни один человек не может возвестить царю истолкование написанного». По паритету взят слав. (повтор смятения царя из ст. 6 — так у МТ/theodotion), LXX-чтение — здесь."
  10: "LXX (gr 5:10): τότε ἡ βασίλισσα ἐμνήσθη πρὸς αὐτὸν περὶ τοῦ Δανιηλ, ὃς ἦν ἐκ τῆς αἰχμαλωσίας τῆς Ιουδαίας — «тогда царица напомнила ему о Данииле, который был из плена Иудейского». Слав. (МТ 5:10): «и вниде царица в дом пирный, и рече царица: царю во веки живи: да не смущают тебе размышления твоя, и зрак твой да не изменяется»; по паритету взят слав. (вход царицы и приветствие). 女王[じょおう] — βασίλισσα; 永遠[えいえん]に生[い]きよ — «царю, вовеки живи»."
  11: "LXX (gr 5:11): καὶ εἶπε τῷ βασιλεῖ· Ὁ ἄνθρωπος ἐπιστήμων ἦν καὶ σοφὸς καὶ ὑπερέχων πάντας τοὺς σοφοὺς Βαβυλῶνος — «и сказала царю: человек тот был сведущ и мудр и превосходил всех мудрецов Вавилона». Слав. (МТ 5:11): «есть муж во царстве твоем, в немже дух Божий: и во дни отца твоего бодрость и смысл обретеся в нем, и царь навуходоносор отец твой князя постави его волхвом, обаятелем, халдеем, газарином»; по паритету взят слав. 目覚[めざ]めと悟[さと]り — «бодрость и смысл» (φῶς καὶ σύνεσις; ср. 4:5)."
  12: "LXX (gr 5:12): καὶ πνεῦμα ἅγιον ἐν αὐτῷ ἐστι, καὶ ἐν ταῖς ἡμέραις τοῦ πατρός σου τοῦ βασιλέως συγκρίματα ὑπέρογκα ὑπέδειξε Ναβουχοδονοσορ τῷ πατρί σου — «и святой дух в нём, и во дни отца твоего, царя, великие истолкования показал он Навуходоносору, отцу твоему». Слав. (МТ 5:12): «яко дух преизюбилный (бяше) в нем, и премудрость и смысл (обретеся) в нем, сказуя сны и возвещая сокровенная и разрешая соузы, даниил, и царь нарече имя ему валтасар: ныне убо да призовется, и сказание его возвестит тебе»; по паритету взят слав. 結[むす]び目[め]を解[と]く — «разрешая соузы» (λύων συνδέσμους). Здесь речь царицы закрывается."
  13: "τότε Δανιηλ εἰσήχθη πρὸς τὸν βασιλέα, καὶ ἀποκριθεὶς ὁ βασιλεὺς εἶπεν αὐτῷ — «тогда Даниил был введён к царю, и, отвечая, царь сказал ему» (gr 5:13; стих в модуле обрывается на вводной формуле). Слав. (МТ 5:13) продолжает вопросом: «тогда даниил введен бысть пред царя. И рече царь даниилу: ты лиеси даниил, от сынов пленник иудейских, ихже приведе навуходоносор царь отец мой?»; по паритету взят слав. (captivos — 捕囚[ほしゅう]の子[こ]ら)."
  14: "В gr-lxx-byz «.» (наш 5:14 = gr 5:14); по слав. (МТ 5:14): «слышах о тебе, яко дух Божий в тебе, и бодрость и смысл и премудрость изюбилна обретеся в тебе». 〔…〕 не ставится (решение брифа)."
  15: "В gr-lxx-byz «.» (gr 5:15); по слав. (МТ 5:15): «и ныне внидоша пред мя мудрии, волсви, газарини, да писание сие прочтут и сказания его возвестят ми, и не могоша возвестити мне». Перечислены три разряда, как в слав. 5:7."
  16: "Ὦ Δανιηλ, δύνῃ μοι ὑποδεῖξαι τὸ σύγκριμα τῆς γραφῆς; καὶ στολιῶ σε πορφύραν καὶ μανιάκην χρυσοῦν περιθήσω σοι, καὶ ἕξεις ἐξουσίαν τοῦ τρίτου μέρους τῆς βασιλείας μου — «о Даниил, можешь ли ты показать мне истолкование написанного? и облеку тебя в порфиру, и возложу на тебя золотую цепь, и будешь иметь власть третьей части царства моего» (gr 5:16). Слав. (МТ 5:16): «аз же слышах о тебе, яко можеши суды сказати: ныне убо аще возможеши ппсание сие прочести и сказание его возвестити мне, в багряницу облечешися, и гривна златая на выи твоей будет, и третий во царстве моем обладати будеши»; по паритету взят слав. (в модуле «ппсание» — опечатка в источнике). Здесь речь царя закрывается."
  17: "τότε Δανιηλ ἔστη κατέναντι τῆς γραφῆς καὶ ἀνέγνω καὶ οὕτως ἀπεκρίθη τῷ βασιλεῖ· Αὕτη ἡ γραφή· Ἠρίθμηται, κατελογίσθη, ἐξῆρται· καὶ ἔστη ἡ γράψασα χείρ. καὶ αὕτη ἡ σύγκρισις αὐτῶν — «тогда Даниил стал против написанного и прочитал, и так отвечал царю: вот написанное: исчислено, сочтено, отнято; и стала рука писавшая. И вот истолкование их» (gr 5:17). Слав. (МТ 5:17): «тогда отвеща даниил и рече пред царем: даяния: твоя с тобою да будут, и дар дому твоего иному даждь, аз же писание прочту царю и сказание его возвещу тебе»; по паритету взят слав. (отказ от даров), LXX — здесь. Ответ Даниила идёт до конца 5:28."
  18: "В gr-lxx-byz «.» (gr 5:18); по слав. (МТ 5:18): «царю! Бог вышний царство и величество, и честь и славу даде навуходоносору отцу твоему»."
  19: "В gr-lxx-byz «.» (gr 5:19); по слав. (МТ 5:19): «и от величества, еже ему даде, вси людие, племена, языцы бяху трепещуще и боящеся от лица его: ихже хотяше убиваше, и ихже хотяше бияше, и ихже хотяше возвышаше, и ихже хотяше, той смиряше». Слав. «бияше» — «бил, поражал» (в ru/МТ «кого хотел, оставлял в живых»); по паритету сохранено слав. чтение 打[う]つ, вариант Синодального отмечен здесь."
  20: "В gr-lxx-byz «.» (gr 5:20); по слав. (МТ 5:20): «и егда вознесеся сердце его и утвердися дух его еже презорствовати, сведеся от престола царства, и слава и честь отяся от него». 傲慢[ごうまん] — «презорство» (ὕβρις, дерзость); 王[おう]の座[ざ] — θρόνος."
  21: "В gr-lxx-byz «.» (gr 5:21); по слав. (МТ 5:21): «и от человек отгнася, и сердце его со зверьми отдася, и житие его со дивиими ослы, и травою аки вола питаху его, и от росы небесныя оросися тело его, дондеже уразуме, яко владеет Бог вышний царством человеческим, и емуже хощет, даст е». 驢馬[ろば] — «дикие ослы» (слав. «дивии ослы»; евр. עֲרָדַיָּא); ср. 4:22–30."
  22: "В gr-lxx-byz «.» (gr 5:22); по слав. (МТ 5:22): «и ты убо, сыне его валтасаре, не смирил еси сердца твоего пред Господем: не вся ли сия ведал еси?» — вопрос сохранён."
  23: "βασιλεῦ, σὺ ἐποίησας ἑστιατορίαν τοῖς φίλοις σου… καὶ τὰ σκεύη τοῦ οἴκου τοῦ θεοῦ τοῦ ζῶντος ἠνέχθη σοι… καὶ τῷ θεῷ τῷ ζῶντι οὐκ εὐλογήσατε, καὶ τὸ πνεῦμά σου ἐν τῇ χειρὶ αὐτοῦ, καὶ τὸ βασίλειόν σου αὐτὸς ἔδωκέ σοι — «царь, ты сделал пиршество друзьям твоим… и сосуды дома Бога живого принесены были тебе… а Бога живого не благословили, тогда как дыхание твоё в руке Его и царство твоё Он дал тебе» (gr 5:23). Слав. (МТ 5:23): «но на Господа Бога небеснаго вознеслся еси, и сосуды храма его принесоша пред тебе, ты же и вельможи твои, и наложницы твоя и возлежащыя (окрест) тебе, вино пиясте ими: и боги златыя и сребряныя, и медяныя и железныя, и каменныя и древяныя, иже ни видят, ни слышат, ни разумеют, похвалил еси, а Бога, у негоже дыхание твое в руце его, и вси путие твои, того не прославил еси»; по паритету взят слав. В модуле к концу gr 5:23 с пометой «26–28» добавлено истолкование надписи — у нас это слав. 5:26–28."
  24: "В gr-lxx-byz «.» (gr 5:24); по слав. (МТ 5:24): «сего ради от лица его послани быша персты ручнии и писание сие вчиниша» — «потому от лица Его посланы были персты ручные и начертали это написание»."
  25: "В gr-lxx-byz «.» (gr 5:25); по слав. (МТ 5:25): «се же есть писание вчиненое: мани, фекел, фарес». Слав. форма имён; греч. (Theodotion) Μανη, θεκελ, φαρες; в LXX-модуле надпись дана в 5:1 как «Μανη φαρες θεκελ»; в ru (МТ) «мене, мене, текел, упарсин». Транслитерация — по слав.: マニ、テケル、ファレス."
  26: "В gr-lxx-byz «.» (gr 5:26); по слав. (МТ 5:26): «се сказание глагола: мани, измери Бог царство твое и сконча е» — «вот значение слова: „мани“ — измерил Бог царство твоё и положил ему конец». В модуле то же истолкование стоит в конце gr 5:23: ἠρίθμηται ὁ χρόνος σου τῆς βασιλείας, ἀπολήγει ἡ βασιλεία σου."
  27: "В gr-lxx-byz «.» (gr 5:27); по слав. (МТ 5:27): «фекел, поставися в мерилех и обретеся лишаемо» — «„текел“ — поставлен на весах и найден недостающим». 秤[はかり]にかけられて — «поставися в мерилех» (ἐν ζυγῷ σταθῆναι)."
  28: "В gr-lxx-byz «.» (gr 5:28); по слав. (МТ 5:28): «фарес, разделися царство твое и дадеся мидом и персом». В модуле это стоит в конце gr 5:23: συντέτμηται καὶ συντετέλεσται ἡ βασιλεία σου, τοῖς Μήδοις καὶ τοῖς Πέρσαις δίδοται — «пересечено и скончалось царство твоё, Мидянам и Персам отдаётся». Здесь ответ Даниила закрывается."
  29: "τότε Βαλτασαρ ὁ βασιλεὺς ἐνέδυσε τὸν Δανιηλ πορφύραν καὶ μανιάκην χρυσοῦν περιέθηκεν αὐτῷ καὶ ἔδωκεν ἐξουσίαν αὐτῷ τοῦ τρίτου μέρους τῆς βασιλείας αὐτοῦ — «тогда Валтасар царь облёк Даниила в порфиру и возложил на него золотую цепь и дал ему власть третьей части царства своего» (gr 5:29). Слав. (МТ 5:29): «и рече валтасар: (облецыте и). И облекоша даниила в багряницу, и гривну златую возложиша на выю его, и проповеда о нем, еже быти ему князю третиему во царстве его» — «и возвестили о нём, что быть ему третьим князем в царстве его»; по паритету взят слав. (с возвещением)."
  30: "Слав. (МТ 5:30): «валтасара царя халдейска убиша в ту нощь» — «Валтасара, царя Халдейского, убили в ту ночь». LXX (gr 5:30): καὶ τὸ σύγκριμα ἐπῆλθε Βαλτασαρ τῷ βασιλεῖ, καὶ τὸ βασίλειον ἐξῆρται ἀπὸ τῶν Χαλδαίων καὶ ἐδόθη τοῖς Μήδοις καὶ τοῖς Πέρσαις — «и истолкование исполнилось над Валтасаром царём, и царство отнято у Халдеев и отдано Мидянам и Персам». По паритету взят слав. (убийство), LXX-чтение — здесь; ср. 5:28."
  31: "Слав. (МТ 5:31): «дарий же мидянин прия царство, сый шестидесяти и двою лет» — «Дарий Мидянин принял царство, будучи шестидесяти двух лет». В gr-lxx-byz отдельного стиха 5:31 нет: конец gr 5:30 говорит об отдаче царства Мидянам и Персам, а gr 6:1 (начало след. главы) добавляет: καὶ Ἀρταξέρξης ὁ τῶν Μήδων παρέλαβε τὴν βασιλείαν. Καὶ Δαρεῖος πλήρης τῶν ἡμερῶν καὶ ἔνδοξος ἐν γήρει — «и Артаксеркс Мидянин принял царство; и Дарий, полный дней и славный в старости». Возраст (62 года) — только слав./МТ. Стих отделён от 5:30 по брифу."
