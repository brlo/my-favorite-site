verses:
  1: "「第七[だいしち]の月[つき]の一日[ついたち]は、あなたがたの聖[せい]なる集[つど]いである。どのような仕事[しごと]もしてはならない。あなたがたには合図[あいず]の日[ひ]となる。"
  2: "あなたがたは主[しゅ]に芳[かんば]しい香[かおり]となる燔祭[はんさい]を献[ささ]げなさい。牛[うし]の群[む]れから一頭[いっとう]の子牛[こうし]、雄羊[おひつじ]一匹[いっぴき]、傷[きず]のない一歳[いっさい]の小羊[こひつじ]七匹[ななひき]である。"
  3: "その素祭[そさい]は、油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]で、子牛一頭[いっとう]に十分[じゅうぶん]の三[さん]、雄羊一匹[いっぴき]に十分の二[に]、"
  4: "七匹[ななひき]の小羊[こひつじ]には、一匹[いっぴき]ごとに十分の一[いち]を。"
  5: "また、あなたがたのために贖[あがな]いをするため、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。"
  6: "これらは、新月[しんげつ]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]、また常[つね]の燔祭とその素祭、その注ぎ物のほかである。それらは定[さだ]めに従[したが]って、主[しゅ]に芳[かんば]しい香[かおり]となる。"
  7: "この月[つき]の十日[とおか]は、あなたがたの聖[せい]なる集[つど]いである。あなたがたは自分[じぶん]の魂[たましい]を苦[くる]しめ、どのような仕事[しごと]もしてはならない。"
  8: "あなたがたは主[しゅ]に芳[かんば]しい香[かおり]となる燔祭[はんさい]、すなわち焼[や]き尽[つ]くす捧[ささ]げ物[もの]を献[ささ]げなさい。牛[うし]の群[む]れから一頭[いっとう]の子牛[こうし]、雄羊[おひつじ]一匹[いっぴき]、傷[きず]のない一歳[いっさい]の小羊[こひつじ]七匹[ななひき]である。それらはあなたがたにとって傷のないものでなければならない。"
  9: "その素祭[そさい]は、油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]で、子牛一頭[いっとう]に十分[じゅうぶん]の三[さん]、雄羊一匹[いっぴき]に十分の二[に]、"
  10: "七匹[ななひき]の小羊[こひつじ]には、一匹[いっぴき]ごとに十分の一[いち]を。"
  11: "また、あなたがたのために贖[あがな]いをするため、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは、贖いのための罪の献[ささ]げ物[もの]と、常[つね]の燔祭[はんさい]、その素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。定[さだ]めに従[したが]って、主[しゅ]に芳[かんば]しい香[かおり]となる焼[や]き尽[つ]くす捧[ささ]げ物[もの]である。"
  12: "この第七[だいしち]の月[つき]の十五日[じゅうごにち]は、あなたがたの聖[せい]なる集[つど]いである。どのような仕事[しごと]もしてはならない。あなたがたはこれを主[しゅ]の祭[まつ]りとして七日[なぬか]の間[あいだ]祝[いわ]いなさい。"
  13: "あなたがたは主[しゅ]に芳[かんば]しい香[かおり]となる燔祭[はんさい]、すなわち焼[や]き尽[つ]くす捧[ささ]げ物[もの]を献[ささ]げなさい。最初[さいしょ]の日[ひ]には、牛[うし]の群[む]れから十三頭[じゅうさんとう]の子牛[こうし]、二匹[にひき]の雄羊[おひつじ]、十四匹[じゅうよんひき]の一歳[いっさい]の小羊[こひつじ]である。それらは傷[きず]のないものでなければならない。"
  14: "その素祭[そさい]は、油[あぶら]を混[ま]ぜた小麦粉[こむぎこ]で、十三頭[じゅうさんとう]の子牛の一頭[いっとう]ごとに十分[じゅうぶん]の三[さん]、二匹[にひき]の雄羊の一匹[いっぴき]ごとに十分の二[に]、"
  15: "十四匹[じゅうよんひき]の小羊[こひつじ]の一匹[いっぴき]ごとに十分の一[いち]を、"
  16: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  17: "二日目[ふつかめ]には、十二頭[じゅうにとう]の子牛[こうし]、二匹[にひき]の雄羊[おひつじ]、十四匹[じゅうよんひき]の傷[きず]のない一歳[いっさい]の小羊[こひつじ]、"
  18: "その素祭[そさい]と注[そそ]ぎ物[もの]を、子牛[こうし]と雄羊[おひつじ]と小羊[こひつじ]に、その数[かず]に応[おう]じて、定[さだ]めに従[したが]って献[ささ]げなさい。"
  19: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  20: "三日目[みっかめ]には、十一頭[じゅういっとう]の子牛[こうし]、二匹[にひき]の雄羊[おひつじ]、十四匹[じゅうよんひき]の傷[きず]のない一歳[いっさい]の小羊[こひつじ]、"
  21: "その素祭[そさい]と注[そそ]ぎ物[もの]を、子牛[こうし]と雄羊[おひつじ]と小羊[こひつじ]に、その数[かず]に応[おう]じて、定[さだ]めに従[したが]って献[ささ]げなさい。"
  22: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  23: "四日目[よっかめ]には、十頭[じゅうとう]の子牛[こうし]、二匹[にひき]の雄羊[おひつじ]、十四匹[じゅうよんひき]の傷[きず]のない一歳[いっさい]の小羊[こひつじ]、"
  24: "その素祭[そさい]と注[そそ]ぎ物[もの]を、子牛[こうし]と雄羊[おひつじ]と小羊[こひつじ]に、その数[かず]に応[おう]じて、定[さだ]めに従[したが]って献[ささ]げなさい。"
  25: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  26: "五日目[いつかめ]には、九頭[きゅうとう]の子牛[こうし]、二匹[にひき]の雄羊[おひつじ]、十四匹[じゅうよんひき]の傷[きず]のない一歳[いっさい]の小羊[こひつじ]、"
  27: "その素祭[そさい]と注[そそ]ぎ物[もの]を、子牛[こうし]と雄羊[おひつじ]と小羊[こひつじ]に、その数[かず]に応[おう]じて、定[さだ]めに従[したが]って献[ささ]げなさい。"
  28: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  29: "六日目[むいかめ]には、八頭[はっとう]の子牛[こうし]、二匹[にひき]の雄羊[おひつじ]、十四匹[じゅうよんひき]の傷[きず]のない一歳[いっさい]の小羊[こひつじ]、"
  30: "その素祭[そさい]と注[そそ]ぎ物[もの]を、子牛[こうし]と雄羊[おひつじ]と小羊[こひつじ]に、その数[かず]に応[おう]じて、定[さだ]めに従[したが]って献[ささ]げなさい。"
  31: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  32: "七日目[なぬかめ]には、七頭[ななとう]の子牛[こうし]、二匹[にひき]の雄羊[おひつじ]、十四匹[じゅうよんひき]の傷[きず]のない一歳[いっさい]の小羊[こひつじ]、"
  33: "その素祭[そさい]と注[そそ]ぎ物[もの]を、子牛[こうし]と雄羊[おひつじ]と小羊[こひつじ]に、その数[かず]に応[おう]じて、定[さだ]めに従[したが]って献[ささ]げなさい。"
  34: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  35: "八日目[ようかめ]には、あなたがたに閉会[へいかい]がある。その日[ひ]にはどのような仕事[しごと]もしてはならない。"
  36: "あなたがたは主[しゅ]に芳[かんば]しい香[かおり]となる燔祭[はんさい]、すなわち焼[や]き尽[つ]くす捧[ささ]げ物[もの]を献[ささ]げなさい。一頭[いっとう]の子牛[こうし]、雄羊[おひつじ]一匹[いっぴき]、七匹[ななひき]の傷[きず]のない一歳[いっさい]の小羊[こひつじ]である。"
  37: "その素祭[そさい]と注[そそ]ぎ物[もの]を、子牛[こうし]と雄羊[おひつじ]と小羊[こひつじ]に、その数[かず]に応[おう]じて、定[さだ]めに従[したが]って献[ささ]げなさい。"
  38: "また、罪[つみ]のための贖罪祭[しょくざいさい]として、山羊[やぎ]の雄[おす]一匹[いっぴき]を献[ささ]げなさい。これは常[つね]の燔祭[はんさい]とその素祭[そさい]、その注[そそ]ぎ物[もの]のほかである。"
  39: "あなたがたはこれらのことを、あなたがたの祭[まつ]りにおいて主[しゅ]に行[おこな]いなさい。これは、あなたがたの誓願[せいがん]の捧[ささ]げ物[もの]、自[みずか]ら進[すす]んで献[ささ]げる捧げ物、あなたがたの燔祭[はんさい]、素祭[そさい]、注[そそ]ぎ物[もの]、酬恩祭[しゅうおんさい]のほかである。」"

notes:
  1: "τῷ μηνὶ τῷ ἑβδόμῳ μιᾷ τοῦ μηνός — в седьмой месяц, в первый [день] месяца (μηνί — датив времени). ἐπίκλητος ἁγία — священное собрание (ἐπίκλητος — «созванный»; слав. «нарочит»). ἔργον λατρευτόν — дело служебное (λατρευτός — «служебный, рабский»). ἡμέρα σημασίας — день знамения/сигнала (σημασία; в масоретском тексте и Синодальном — «день трубного звука», в LXX этого нет; ср. Лев 23:24)."
  2: "ὁλοκαύτωμα εἰς ὀσμὴν εὐωδίας — всесожжение в благоухание. μόσχος ἐκ βοῶν — телец из крупного скота (μόσχος — «молодой бык»). κριός — овен; ἀμνὸς ἐνιαύσιος — однолетний агнец; ἄμωμος — непорочный. Стих вводит формулу, повторяемую в ст. 8 и 36."
  3: "ἡ θυσία αὐτῶν — жертва их, т.е. хлебное приношение (素祭). σεμίδαλις ἀναπεποιημένη ἐν ἐλαίῳ — пшеничная мука, смешанная с елеем (ἀναποιέω). τρία δέκατα / δύο δέκατα — три/две десятых [ефы]; слав. «три десятины», «две десятины». Датив τῷ μόσχῳ — распределительно: на тельца."
  4: "δέκατον δέκατον — «десятое десятину» (повтор для распределительности): по одной десятой на каждого агнца. τοῖς ἑπτὰ ἀμνοῖς — на семь агнцев (датив)."
  5: "χίμαρος ἐξ αἰγῶν — козёл из коз (χίμαρος). περὶ ἁμαρτίας — за грех, т.е. жертва за грех (贖罪祭). ἐξιλάσασθαι περὶ ὑμῶν — умилостивить/очистить за вас (ἐξιλάσκομαι)."
  6: "πλήν — сверх, кроме: стих продолжает мысль, что эти жертвы — сверх постоянных. νουμηνία — новомесячие (新月). αἱ σπονδαί — возлияния (注ぎ物). τὸ ὁλοκαύτωμα τὸ διὰ παντός — постоянное всесожжение (слав. «всесожжение всегдашнее»). κατὰ τὴν σύγκρισιν — по уставу/чину (σύγκρισις, букв. «сопоставление»; слав. «по уставу»). В LXX «жертвы их и возлияния их» повторены дважды — при новомесячии и при постоянном всесожжении."
  7: "τῇ δεκάτῃ τοῦ μηνός — в десятый [день] месяца; речь о дне очищения (ср. Лев 23:27). κακώσετε τὰς ψυχάς — смирите/изнурите души (κακόω; слав. «озлобите душы»), т.е. пост и самоограничение. πᾶν ἔργον οὐ ποιήσετε — никакого дела не сделаете."
  8: "καρπώματα — сожигаемые приношения (κάρπωμα), здесь уточняет ὁλοκαυτώματα. ἄμωμοι ἔσονται ὑμῖν — непорочны да будут вам (предикативное согласование с подлежащим)."
  9: "Повтор формулы ст. 3; ср. также ст. 14. θυσία — хлебное приношение."
  10: "εἰς τοὺς ἑπτὰ ἀμνούς — на семь агнцев (предлог εἰς вместо простого датива, ср. ст. 4)."
  11: "πλὴν τὸ περὶ τῆς ἁμαρτίας τῆς ἐξιλάσεως — сверх жертвы за грех очищения (τὸ περί + род. — «жертва за»; ἐξίλασις — «умилостивление»), т.е. сверх жертв дня очищения. ἡ ὁλοκαύτωσις — всесожжение (более редкая форма при обычном ὁλοκαύτωμα). κάρπωμα κυρίῳ — сожигаемое приношение Господу."
  12: "τῇ πεντεκαιδεκάτῃ ἡμέρᾳ — в пятнадцатый день. ἑορτάσετε αὐτὴν ἑορτὴν κυρίῳ — празднуйте её как праздник Господу (cognate accusative). ἑπτὰ ἡμέρας — семь дней (винитив длительности)."
  13: "προσάξετε — принесёте (προσάγω). τῇ ἡμέρᾳ τῇ πρώτῃ — в первый день [праздника кущей]. μόσχους τρεῖς καὶ δέκα — тринадцать тельцов (порядок числительного как в греч.)."
  14: "αἱ θυσίαι αὐτῶν — хлебные приношения при них. τοῖς τρισκαίδεκα μόσχοις — на тринадцать тельцов (распределительно). ἐπὶ τοὺς δύο κριούς — на двух овнов."
  15: "ἐπὶ τοὺς τέσσαρας καὶ δέκα ἀμνούς — на четырнадцать агнцев; ср. ст. 4 и 10."
  16: "πλὴν τῆς ὁλοκαυτώσεως τῆς διὰ παντός — сверх постоянного всесожжения. αἱ θυσίαι αὐτῶν καὶ αἱ σπονδαὶ αὐτῶν — «приношения их и возлияния их» (без глагола; эллипсис, ср. ст. 6). Тире в греч. тексте — знак конца раздела."
  17: "τῇ ἡμέρᾳ τῇ δευτέρᾳ — во второй день. μόσχους δώδεκα — двенадцать тельцов (на одного меньше, чем в первый день)."
  18: "κατὰ ἀριθμὸν αὐτῶν — по числу их. κατὰ τὴν σύγκρισιν αὐτῶν — по уставу их (ср. ст. 6). Меры муки и вина не названы — они определяются числом животных (ср. 28:12–14)."
  19: "Повтор формулы ст. 16 (завершение дня)."
  20: "τῇ ἡμέρᾳ τῇ τρίτῃ — в третий день; μόσχους ἕνδεκα — одиннадцать тельцов."
  21: "Повтор формулы ст. 18."
  22: "Повтор формулы ст. 16."
  23: "τῇ ἡμέρᾳ τῇ τετάρτῃ — в четвёртый день; μόσχους δέκα — десять тельцов."
  24: "Повтор формулы ст. 18 (без начального ἡ θυσία, но смысл тот же: «приношения их и возлияния их»)."
  25: "Повтор формулы ст. 16."
  26: "τῇ ἡμέρᾳ τῇ πέμπτῃ — в пятый день; μόσχους ἐννέα — девять тельцов."
  27: "Повтор формулы ст. 18."
  28: "Повтор формулы ст. 16."
  29: "τῇ ἡμέρᾳ τῇ ἕκτῃ — в шестой день; μόσχους ὀκτώ — восемь тельцов."
  30: "Повтор формулы ст. 18."
  31: "Повтор формулы ст. 16."
  32: "τῇ ἡμέρᾳ τῇ ἑβδόμῃ — в седьмой день; μόσχους ἑπτά — семь тельцов."
  33: "Повтор формулы ст. 18."
  34: "Повтор формулы ст. 16."
  35: "ἐξόδιον — исходное, заключительное собрание (ἐξόδιον; слав. «исход»; в Лев 23:36 — 閉会). πᾶν ἔργον λατρευτόν — всякое служебное дело; в ст. 1, 7, 12 — та же формула."
  36: "προσάξετε ὁλοκαυτώματα... μόσχον ἕνα, κριὸν ἕνα, ἀμνοὺς ἑπτά — как в ст. 2, но без начального «и»; жертвы восьмого дня равны жертвам дня труб."
  37: "τῷ μόσχῳ καὶ τῷ κριῷ καὶ τοῖς ἀμνοῖς — датив по одному тельцу, овну и агнцам (в отличие от ст. 18, 21, 24 и т.д. с мн. ч.)."
  38: "Повтор формулы ст. 16; в конце нет тире — формула завершает ряд."
  39: "πλὴν τῶν εὐχῶν ὑμῶν — сверх обетов ваших. τὰ ἑκούσια — добровольные [приношения] (ἑκούσιος). τὰ σωτήρια — спасительные, т.е. мирные жертвы (σωτήριον; в книге — 酬恩祭). Перечисление в винительном падеже при ποιήσετε. Этим стихом заканчивается речь Господа, начатая в 28:1."
