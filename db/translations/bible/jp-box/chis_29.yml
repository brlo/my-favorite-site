# jp-box, Числа, глава 29. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в этой главе нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 29 — праздничные жертвы седьмого месяца: день труб / знамения (1–6),
# день очищения (7–11), праздник кущей (12–34) и восьмой, заключительный день
# (35–38), итоговая формула (39).
# Речь Бога — 「…」: глава целиком продолжает речь Господа, начатую в гл. 28,
# поэтому 「 открывается в ст. 1, а закрывается в ст. 39. Красного нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе).
# Сносок ⟨…⟩ нет: 燔祭, 素祭, 贖罪祭, 酬恩祭, 誓願 уже в корпусе (Лев 1–7, 23, 27);
# 新月 — в гл. 28, 閉会 — в Лев 23:36; レビ人 в этой главе не встречается.
# Нумерация: держимся gr-lxx-byz (39 стихов). В печатных слав. и Синодальном
# эта глава имеет 40 стихов, и их 29:40 = наш 30:1; в базе тексты уже
# перенумерованы по LXX, поэтому выгрузка совпадает стих в стих.
# LXX: 29:1 «день знамения» (σημασία), а не «день трубного звука» (масоретский
# текст, Синодальный); 29:6 и 11 — «сверх» новомесячных и постоянных жертв;
# 29:35 ἐξόδιον — «исходное, заключительное собрание» (閉会).
# jp-ni не использовался.

