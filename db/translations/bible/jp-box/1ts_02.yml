verses:
  1: "アンナは祈[いの]って言[い]った。「わたしの心[こころ]は主[しゅ]によって堅[かた]くされ、わたしの角[つの]は主によって高[たか]く挙[あ]げられた。わたしの口[くち]は敵[てき]に向[む]かって大[おお]きく開[ひら]かれ、わたしはあなたの救[すく]いによって喜[よろこ]ぶ。"
  2: "主[しゅ]のように聖[せい]なる者[もの]はなく、わたしたちの神[かみ]のように正[ただ]しい者もない。あなたのほかに聖なる者はない。"
  3: "高[たか]ぶったことを誇[ほこ]って語[かた]ってはならない。大[おお]げさな言葉[ことば]を口[くち]から出[だ]してはならない。主[しゅ]はすべてを知[し]る神[かみ]であり、その企[くわだ]てを備[そな]える神だからである。"
  4: "強[つよ]い者[もの]の弓[ゆみ]は弱[よわ]り、弱[よわ]い者たちは力[ちから]を帯[お]びた。"
  5: "パンに満[み]ちていた者[もの]は乏[とぼ]しくなり、飢[うえ]えていた者は地[ち]を手放[てばな]した。不妊[ふにん]の女[おんな]が七人[ななにん]を産[う]み、多[おお]くの子[こ]どもを持つ女は衰[おとろ]えたからである。"
  6: "主[しゅ]は殺[ころ]し、また生[い]かす。よみに下[くだ]し、また上[のぼ]らせる。"
  7: "主[しゅ]は貧[まず]しくし、また富[とみ]ませる。低[ひく]くし、また高[たか]くする。"
  8: "主は貧[まず]しい者を塵[ちり]から起[おこ]し、乏[とぼ]しい者を糞[ふん]の山[やま]から立[た]てて、民[たみ]の支配者[しはいしゃ]たちとともに座[すわ]らせ、栄光[えいこう]の王座[おうざ]を嗣業[しぎょう]として与[あた]える。"
  9: "主は祈[いの]る者に祈りを与え、正[ただ]しい者の年月[としつき]を祝福[しゅくふく]される。人[ひと]は力[ちから]によって強[つよ]いのではないからである。"
  10: "主[しゅ]は自分[じぶん]に逆[さか]らう者を弱[よわ]くされる。主は聖[せい]なる方[かた]である。知[ち]恵[え]ある者は自分の知恵を誇ってはならない。強[つよ]い者は自分の力[ちから]を、富[とみ]ある者は自分の富を誇ってはならない。誇る者は、主を知り、悟[さと]り、地[ち]のただ中[なか]で裁[さば]きと正義[せいぎ]を行[おこな]うことを誇るがよい。主は天[てん]に上[のぼ]って雷[かみなり]を鳴[な]らされた。主は地の果[は]てを裁き、わたしたちの王[おう]たちに力を与[あた]え、ご自分の油[あぶら]を注[そそ]がれた者[もの]の角[つの]を高[たか]く挙[あ]げられる。」"
  11: "彼らはサムエルをそこに主[しゅ]の前[まえ]に残[のこ]して、ラマタイムへ帰[かえ]った。子[こ]どもは祭司[さいし]エリの前で、主の前に仕[つか]えていた。"
  12: "祭司エリの息子[むすこ]たちはならず者[もの]で、主[しゅ]を知[し]らなかった。"
  13: "祭司[さいし]が民[たみ]から、すなわちいけにえを献[ささ]げるすべての者[もの]から受[う]ける分[ぶん]は、次[つぎ]のとおりであった。祭司の若[わか]い者が来[き]て、肉[にく]が煮[に]えたころに、三[みっ]つまたの肉叉[にくさし]を手[て]に持[も]って来た。"
  14: "それを大[おお]きな鍋[なべ]、あるいは青銅[せいどう]の器[うつわ]、あるいは土鍋[どなべ]に突[つ]き入[い]れ、肉叉[にくさし]に引[ひ]っかかったものをすべて、祭司[さいし]は自分[じぶん]のために取[と]った。彼らはシロで主[しゅ]にいけにえを献[ささ]げに来[く]るすべてのイスラエル人[じん]に、このようにしていた。"
  15: "脂肪[しぼう]を焼[や]く前[まえ]に、祭司[さいし]の若[わか]い者[もの]が来[き]て、いけにえを献[ささ]げる人[ひと]に言[い]った。「祭司に焼[や]き肉[にく]を渡[わた]しなさい。煮[に]た肉はもらわない。」"
  16: "いけにえを献[ささ]げる人が言った。「まず定[さだ]められたとおりに脂肪[しぼう]を焼[や]き、それから、あなたの心[こころ]が望[のぞ]むものをすべて自分[じぶん]に取[と]りなさい。」すると彼は言った。「いや、今[いま]渡せ。さもなければ、力[ちから]ずくで取る。」"
  17: "この若者[わかもの]たちの罪[つみ]は主[しゅ]の前[まえ]にとても大[おお]きかった。彼らが主のいけにえを蔑[ないがし]ろにしたからである。"
  18: "サムエルは子[こ]どもながら、亜麻[あま]のエフォドを身[み]に着[つ]けて、主[しゅ]の前[まえ]に仕[つか]えていた。"
  19: "母[はは]は彼のために小[ちい]さな上着[うわぎ]を作[つく]り、夫[おっと]とともにいけにえを献[ささ]げに上[のぼ]るとき、年[とし]ごとにそれを持[も]って来[き]て彼に与[あた]えた。"
  20: "エリはエルカナとその妻[つま]を祝福[しゅくふく]して言[い]った。「主[しゅ]がこの女[おんな]から、あなたが主に貸[か]したものの代[か]わりに、子孫[しそん]を与[あた]えてくださるように。」そしてその人[ひと]は自分[じぶん]の場所[ばしょ]へ帰[かえ]った。"
  21: "主[しゅ]はアンナを顧[かえり]み、彼女はさらに三人[さんにん]の息子[むすこ]と二人[ふたり]の娘[むすめ]を産[う]んだ。幼[おさな]いサムエルは主の前[まえ]で育[そだ]って行[い]った。"
  22: "エリは非常[ひじょう]に年[とし]を取[と]っていた。彼は、自分の息子[むすこ]たちがイスラエルの人[ひと]々[びと]に対してしていることを聞[き]いた。"
  23: "彼は彼らに言[い]った。「なぜ、わたしが主[しゅ]の民[たみ]すべての口[くち]から聞[き]いているようなことをしているのか。"
  24: "子[こ]どもたちよ、そうしてはならない。わたしが聞いているうわさは良[よ]くない。あなたがたのその行[おこな]いのため、民[たみ]が神[かみ]に仕[つか]えなくなっている。"
  25: "人[ひと]が人に対して罪[つみ]を犯[おか]すなら、その人のために主[しゅ]に祈[いの]る者[もの]があろう。しかし主に対して罪を犯すなら、だれがその人のために祈るのか。」彼らは父[ちち]の声[こえ]に聞[き]き従[したが]わなかった。主が彼らを滅[ほろ]ぼすことを望[のぞ]んでおられたからである。"
  26: "幼[おさな]いサムエルは育[そだ]ち進[すす]み、主[しゅ]にも人[ひと]にも良[よ]い者[もの]となって行[い]った。"
  27: "神[かみ]の人[ひと]がエリのもとに来[き]て言[い]った。「主[しゅ]はこう言われる。『わたしは、あなたの父[ちち]の家[いえ]がエジプトの地[ち]でファラオの家の奴隷[どれい]であったとき、あなたの父の家に自[みずか]らを現[あらわ]したではないか。"
  28: "また、イスラエルのすべての部族[ぶぞく]のうちから、あなたの父の家を選[えら]んで、わたしに祭司[さいし]として仕[つか]えさせ、わたしの祭壇[さいだん]に上[のぼ]って香[こう]をたき、エフォドを着[つ]けさせた。そして、イスラエルの子[こ]らが火[ひ]で焼[や]くすべていけにえを、あなたの父の家に食物[しょくもつ]として与えた。"
  29: "なぜ、あなたは厚[あつ]かましい目[め]で、わたしの香[こう]とわたしのいけにえを見[み]たのか。なぜ、イスラエルのすべてのいけにえの初穂[はつほ]で自分[じぶん]を肥[こ]やしながら、わたしよりも自分の息子[むすこ]たちを重[おも]んじたのか。"
  30: "それゆえ、イスラエルの神[かみ]である主[しゅ]はこう言[い]われる。わたしは、あなたの家[いえ]とあなたの父の家が永遠[えいえん]にわたしの前[まえ]を行[ゆ]くと言った。しかし今[いま]、主は言われる。もう、そうはならない。わたしを敬[うやま]う者をわたしは敬い、わたしを蔑[ないがし]ろにする者は辱[はずかし]めを受[う]ける。"
  31: "見[み]よ、日[ひ]が来[く]る。わたしはあなたの子孫[ししそん]と、あなたの父の家の子孫を断[た]ち切[き]る。"
  32: "あなたの家[いえ]には、すべていのちの日[ひ]、わたしの家で年[とし]を重[かさ]ねた者[もの]がいなくなる。"
  33: "わたしはあなたの家から、わたしの祭壇[さいだん]に立[た]つ者[もの]を断[た]ちはしない。かえってその目[め]は衰[おとろ]え、その魂[たましい]は尽[つ]き果[は]てる。あなたの家の残[のこ]る者はすべて、人[ひと]の剣[つるぎ]にかかって倒[たお]れる。"
  34: "これがあなたへのしるしである。あなたの二人[ふたり]の息子[むすこ]、ホフニとピネハスに、このことが起[お]こる。二人は同[おな]じ日[ひ]に死[し]ぬ。"
  35: "わたしは自分[じぶん]のために忠実[ちゅうじつ]な祭司[さいし]を立[た]てる。彼はわたしの心[こころ]にあること、わたしの魂[たましい]にあることをすべて行[おこな]う。わたしは彼のために確[かた]かな家[いえ]を建[た]て、彼はすべていのちの日、わたしの油[あぶら]を注[そそ]がれた者[もの]の前[まえ]を行く。"
  36: "あなたの家[いえ]に残[のこ]る者[もの]はだれでも、銀[ぎん]一[いち]オボロスのために彼のところへ来[き]て拝[おが]み、言[い]う。「わたしをあなたの祭司[さいし]の務[つと]めの一[ひと]つに加[くわ]えて、パンを食[た]べさせてほしい。」』」"

notes:
  1: "Ἐστερεώθη ἡ καρδία μου ἐν κυρίῳ — утвердилось сердце моё в Господе (στερεόω — укреплять). ὑψώθη κέρας μου ἐν θεῷ μου — вознёсся рог мой в Боге моём; рог — символ силы и достоинства (ср. Пс 88:18). По решению партии ἐν θεῷ μου передано 主によって, как в брифе. ἐπλατύνθη ἐπὶ ἐχθροὺς τὸ στόμα μου — расширились уста мои на врагов: свободная торжествующая речь. ἐν σωτηρίᾳ σου — о спасении Твоём."
  2: "οὐκ ἔστιν ἅγιος ὡς κύριος… οὐκ ἔστιν δίκαιος ὡς ὁ θεὸς ἡμῶν — нет святого, как Господь… нет праведного, как Бог наш. οὐκ ἔστιν ἅγιος πλὴν σοῦ — нет святого кроме Тебя; в евр. здесь «нет твердыни (צוּר), как Бог наш», LXX читает иначе. Троекратное отрицание сохранено."
  3: "μὴ καυχᾶσθε — не хвалитесь. μεγαλορρημοσύνη — велеречие, высокопарная речь. θεὸς γνώσεων κύριος — Господь Бог знаний (γνῶσις), т. е. всеведущий. θεὸς ἑτοιμάζων ἐπιτηδεύματα αὐτοῦ — Бог, приготовляющий Свои начинания (ἐπιτήδευμα — занятие, предприятие)."
  4: "τόξον δυνατῶν ἠσθένησεν — лук сильных ослабел (ἀσθενέω). περιεζώσαντο δύναμιν — препоясались силою: образ опоясывания перед боем."
  5: "πλήρεις ἄρτων ἠλαττώθησαν — полные хлебов умалились (ἐλαττόω). παρῆκαν γῆν — оставили землю, отпустили (παρίημι); тёмное место: слав. «пришелствоваша землю» (стали пришельцами), ru «отдыхают». στεῖρα ἔτεκεν ἑπτά — бесплодная родила семерых: «семь» как полнота. ἡ πολλὴ ἐν τέκνοις — многодетная."
  6: "θανατοῖ καὶ ζωογονεῖ — умерщвляет и животворит (ζωογονέω — оживлять). κατάγει εἰς ᾅδου καὶ ἀνάγει — низводит в ад и возводит; ᾅδης — преисподняя, よみ."
  7: "πτωχίζει καὶ πλουτίζει — обнищает и обогащает (πτωχίζω, πλουτίζω). ταπεινοῖ καὶ ἀνυψοῖ — смиряет и возвышает."
  8: "ἀπὸ κοπρίας — от навозной кучи, с гноища (κόπριον). καθίσαι μετὰ δυναστῶν λαῶν — посадить с владыками народов. θρόνον δόξης κατακληρονομῶν αὐτοῖς — наделяя их престолом славы в наследие (κατακληρονομέω). В евр. далее «ибо у Господа основания земли» — в LXX этого нет."
  9: "διδοὺς εὐχὴν τῷ εὐχομένῳ — дающий молитву молящемуся; вероятно, «исполняющий прошение» (слав. «даяй молитву молящемуся»). εὐλόγησεν ἔτη δικαίου — благословил лета праведного. οὐκ ἐν ἰσχύι δυνατὸς ἀνήρ — не в силе крепок муж. В евр. стих иной («стопы святых Своих блюдёт»); LXX даёт иное чтение."
  10: "ἀσθενῆ ποιήσει ἀντίδικον αὐτοῦ — сделает немощным противника Своего (ἀντίδικος — супротивник). κύριος ἅγιος — Господь свят. Далее в LXX — увещание не хвалиться мудростью, силою, богатством (ср. Иер 9:23–24), которого нет в евр. 1 Цар 2. συνίειν καὶ γινώσκειν τὸν κύριον — разуметь и знать Господа. κύριος ἀνέβη εἰς οὐρανοὺς καὶ ἐβρόντησεν — взошёл на небеса и возгремел. κρινεῖ ἄκρα γῆς — будет судить концы земли. χριστοῦ αὐτοῦ — помазанника Его; здесь χριστός ещё не титул, поэтому 油を注がれた者."
  11: "κατέλιπον αὐτὸν ἐκεῖ — оставили его там. λειτουργῶν τῷ προσώπῳ κυρίου — служа пред лицом Господним (λειτουργέω — священнослужение). ἐνώπιον Ηλι τοῦ ἱερέως — при Илии священнике."
  12: "υἱοὶ λοιμοί — сыны погибельные, негодные (λοιμός); слав. «сынове погибелнии». οὐκ εἰδότες τὸν κύριον — не знающие Господа: не только неведение, но и отвержение."
  13: "τὸ δικαίωμα τοῦ ἱερέως — право, обычай священника (δικαίωμα — установление, притязание). παρὰ τοῦ λαοῦ παντὸς τοῦ θύοντος — у народа, у всякого приносящего. κρεάγρα τριόδους — трезубая вилка (κρεάγρα). ὡς ἂν ἡψήθη τὸ κρέας — как только сварят мясо."
  14: "λέβης — котёл; χαλκίον — медный сосуд; κύθρα — горшок. ὃ ἐὰν ἀνέβη ἐν τῇ κρεάγρᾳ — что поднимется на вилке, т. е. попадётся. κατὰ τάδε ἐποίουν — так делали."
  15: "πρὶν θυμιαθῆναι τὸ στέαρ — прежде воскурения тука (θυμιάω — кадить, сожигать). ὀπτῆσαι — изжарить. ἑφθὸν ἐκ τοῦ λέβητος — варёное из котла: священник требует сырое мясо, а не варёное."
  16: "Θυμιαθήτω πρῶτον, ὡς καθήκει, τὸ στέαρ — пусть сначала воскурен будет тук, как должно (καθήκει — подобает). λαβὲ σεαυτῷ ἐκ πάντων ὧν ἐπιθυμεῖ ἡ ψυχή σου — возьми себе из всего, чего пожелает душа твоя. νῦν δώσεις — теперь дашь. λήμψομαι κραταιῶς — возьму силою (κραταιῶς — крепко, насильно)."
  17: "ἠθέτουν τὴν θυσίαν κυρίου — отвергали, обесценивали жертву Господню (ἀθετέω — отменять, отметать). μεγάλη σφόδρα — весьма велика."
  18: "παιδάριον περιεζωσμένον εφουδ βαρ — отрок, опоясанный ефодом виссонным (εφουδ βαρ — «ефод льняной», евр. בַּד). λειτουργῶν ἐνώπιον κυρίου — служа пред Господом."
  19: "διπλοΐδα μικράν — малый двойной плащ, верхняя одежда (διπλοΐς). ἐξ ἡμερῶν εἰς ἡμέρας — изо дня в день, т. е. ежегодно. θυσία τῶν ἡμερῶν — жертва дней, годовая."
  20: "Ἀποτείσαι σοι κύριος σπέρμα — да воздаст тебе Господь семя (ἀποτίνω — воздавать). ἀντὶ τοῦ χρέους οὗ ἔχρησας τῷ κυρίῳ — вместо долга, который ты дал в долг Господу (χρέος — долг; χράω — давать взаймы): Самуил — возврат этого долга."
  21: "ἐπεσκέψατο κύριος τὴν Ανναν — посетил Господь Анну. ἔτεκεν ἔτι — родила ещё. ἐμεγαλύνθη τὸ παιδάριον — отрок возрастал, был возвеличен."
  22: "πρεσβύτης σφόδρα — весьма старый. ἤκουσεν ἃ ἐποίουν οἱ υἱοὶ αὐτοῦ τοῖς υἱοῖς Ισραηλ — услышал, что делают сыновья его с сынами Израиля. В евр. и ru далее сказано, что они спали с женщинами у входа скинии; в греческом этого нет — не переведено."
  23: "Ἵνα τί ποιεῖτε κατὰ τὸ ῥῆμα τοῦτο — для чего делаете по слову сему. ὃ ἐγὼ ἀκούω ἐκ στόματος παντὸς τοῦ λαοῦ κυρίου — что я слышу из уст всего народа Господня."
  24: "οὐκ ἀγαθὴ ἡ ἀκοή — нехорош слух, молва (ἀκοή — слух, услышанное). μὴ ποιεῖτε οὕτως — не делайте так. τοῦ μὴ δουλεύειν λαὸν θεῷ — так что народ не служит Богу: цель-следствие, выраженное инфинитивом."
  25: "ἐὰν ἁμαρτάνων ἁμάρτῃ ἀνὴρ εἰς ἄνδρα — если согрешит человек против человека (усиление). προσεύξονται ὑπὲρ αὐτοῦ — помолятся о нём. ἐὰν τῷ κυρίῳ ἁμαρτάνῃ, τίς προσεύξεται — если против Господа согрешит, кто помолится. βουλόμενος ἐβούλετο κύριος διαφθεῖραι — Господь желал погубить их (усилительное «желая желал»)."
  26: "ἐπορεύετο καὶ ἐμεγαλύνετο — шёл и возрастал. ἀγαθὸν καὶ μετὰ κυρίου καὶ μετὰ ἀνθρώπων — добрый и пред Господом и пред людьми (ср. Лк 2:52)."
  27: "ἄνθρωπος θεοῦ — человек Божий, обозначение пророка. Ἀποκαλυφθεὶς ἀπεκαλύφθην — «открываясь открылся» (усиление). ὄντων αὐτῶν ἐν γῇ Αἰγύπτῳ δούλων τῷ οἴκῳ Φαραω — когда они были в земле Египетской рабами дому фараона. С этого стиха и до 36 — речь Божия, переданная человеком Божиим: внешние 「」, слова Господа — 『』."
  28: "ἐκ πάντων τῶν σκήπτρων Ισραηλ — из всех скипетров Израиля, т. е. колен (σκῆπτρον — жезл, колено). ἱερατεύειν — священнодействовать. ἀναβαίνειν ἐπὶ θυσιαστήριον — восходить к жертвеннику. θυμιᾶν θύμιαμα — кадить фимиам. αἴρειν εφουδ — носить ефод (αἴρω — поднимать, носить). τὰ πάντα τοῦ πυρός — всё огненное, т. е. сожигаемое."
  29: "ἐπέβλεψας… ἀναιδεῖ ὀφθαλμῷ — воззрел бесстыдным оком (ἀναιδής — бесстыжий). ἐδόξασας τοὺς υἱούς σου ὑπὲρ ἐμέ — прославил сыновей твоих более Меня. ἐνευλογεῖσθαι ἀπαρχῆς πάσης θυσίας — получать благословение от начатков всякой жертвы, т. е. жиреть от первых частей (ἐνευλογέομαι)."
  30: "Εἶπα — Я сказал (о прежнем обетовании дому Аарона). διελεύσεται ἐνώπιόν μου — будет ходить пред лицом Моим, т. е. служить. Μηδαμῶς ἐμοί — «да не будет Мне» (слав. «никакоже мне»): решительное отрицание. τοὺς δοξάζοντάς με δοξάσω — прославляющих Меня прославлю. ὁ ἐξουθενῶν με ἀτιμωθήσεται — уничижающий Меня будет обесчещен."
  31: "ἡμέραι ἔρχονται — наступают дни: пророческая формула. ἐξολεθρεύσω τὸ σπέρμα σου — истреблю семя твоё (ἐξολεθρεύω). Слав. здесь продолжает «и не будет старца в дому твоем во вся дни» — это уже ст. 32 по греческому делению."
  32: "οὐκ ἔσται σου πρεσβύτης ἐν οἴκῳ μου πάσας τὰς ἡμέρας — не будет у тебя старца в доме Моём во все дни. Слав. добавляет «и узриши державу мою во всех, имиже разблажает израиля» (соответствует евр. 2:32) — в греческом этого нет, поэтому не переведено."
  33: "ἄνδρα οὐκ ἐξολεθρεύσω σοι ἀπὸ τοῦ θυσιαστηρίου μου — не истреблю у тебя мужа от жертвенника Моего; далее цель: ἐκλιπεῖν τοὺς ὀφθαλμοὺς αὐτοῦ καὶ καταρρεῖν τὴν ψυχήν — чтобы оскудели глаза его и истаяла душа его. Тёмное место: слав. «во еже оскудети очесем его и истаяти души его», ru передаёт как «томить глаза твои и мучить душу твою». πᾶς περισσεύων οἴκου σου — всякий остающийся из дома твоего. ἐν ῥομφαίᾳ ἀνδρῶν — мечом мужей, т. е. от руки людей."
  34: "τοῦτό σοι τὸ σημεῖον — вот тебе знамение. ἐν ἡμέρᾳ μιᾷ — в один день. ἀμφότεροι — оба."
  35: "ἀναστήσω ἐμαυτῷ ἱερέα πιστόν — воздвигну Себе священника верного. πάντα τὰ ἐν τῇ καρδίᾳ μου καὶ τὰ ἐν τῇ ψυχῇ μου ποιήσει — всё по сердцу Моему и по душе Моей сотворит. οἰκοδομήσω αὐτῷ οἶκον πιστόν — созижду ему дом верен. διελεύσεται ἐνώπιον χριστοῦ μου — будет ходить пред помазанником Моим; χριστός здесь — «помазанник» (Саул, затем Давид), не титул."
  36: "ὁ περισσεύων ἐν οἴκῳ σου — остающийся в доме твоём. ὀβολοῦ ἀργυρίου — за обол серебра (ὀβολός — мелкая монета). Παράρριψόν με ἐπὶ μίαν τῶν ἱερατειῶν σου — «брось меня на одно из священств твоих», т. е. причисли к какой-либо священнической службе (ῥίπτω — бросать). φαγεῖν ἄρτον — съесть хлеб, т. е. получить пропитание."
