# jp-box, 1-я Царств, глава 2. Черновик для приёмки.
#
# База: Септуагинта (gr-lxx-byz); контроль — церковнославянский (csl-ru);
# ru (Синодальный) — только для понимания, не источник. jp-joc в 1 Царств нет.
# Язык — современный 常体; порядок членов и деление на клаузы — по греческому.
# Глава 2: песнь Анны (1–10), Самуил при Илии (11), нечестие сыновей Илия и их
# своеволие при жертвах (12–17), льняной ефод и материнская одежда (18–21),
# укор Илия сыновьям (22–26), пророчество человека Божия о доме Илия (27–36).
# Песнь Анны — 「…」, 1–10, поэзия с параллелизмами. Речь людей — 「…」: 15, 16,
# 20, 23–25; речь человека Божия — 「…」: 27–36, слова Господа в ней — 『…』:
# 27–36, слова остатка дома Илия — третьим уровнем 「…」: 36.
# Красного и синего нет.
# 〔…〕 нет: все стихи и слова есть в gr-lxx-byz (проверено по базе). Славянский
# в ст. 32 добавляет слова, которых в греческом нет; они не переведены.
# Сносок ⟨…⟩ нет: глава не вводит новых терминов корпуса.
# jp-ni не использовался.

