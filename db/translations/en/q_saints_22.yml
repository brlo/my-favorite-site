- src: PIGQn4ei_Образ_совершения_крещения
  path: The-mode-of-performing-baptism
  title: The mode of performing baptism
  title_sub: Triple immersion in water with the invocation of the name of the Father,
    the Son and the Holy Spirit
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: The mode of performing baptism (triple)
    priority: 12
  body: '<h2>Preface</h2><p>Threefold immersion in water with the invocation of the
    name of God — the Father, the Son, and the Holy Spirit — is the most ancient form
    of performing holy Baptism.</p><p>This is precisely how the Saviour commanded
    when sending out the disciples (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L19">Matt.
    28:19</a>). This is in no way a late insertion, as some groundlessly assert at
    times, but the most ancient reading. There can be no objection to this. There
    is not even a single variant reading of this place in Scripture. So it stands
    written in the Codex Sinaiticus. So this phrase is read by all the ancient writers:
    by St Irenaeus of Lyons (2nd c.), by Tertullian (2nd–3rd cc.), by St Hippolytus
    of Rome (2nd–3rd cc.), and others. It is precisely this mode of baptism that the
    author of the Didache (late 1st – early 2nd century) and the martyr Justin the
    Philosopher (2nd century) describe.</p><p>In the places of Scripture that speak
    of Baptism into Christ (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Acts
    2:38</a>; <a href="https://bibleox.com/en/eng-nkjv/act/10/#L48">Acts 10:48</a>;
    <a href="https://bibleox.com/en/eng-nkjv/rim/6/#L3">Rom. 6:3</a>; <a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal.
    3:27</a>) it is the essence of the sacrament that is spoken of — immersion into
    the body of Christ, the Church (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1
    Cor. 12:13</a>). The mode of performing the sacrament was established by the Saviour
    Himself (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L19">Matt. 28:19</a>).</p><h2>1st
    century</h2><h3>The Didache (late 1st – early 2nd century)</h3><blockquote><p>“And
    concerning baptism, baptize this way: Having first said all these things, <strong><mark>baptize
    into the name of the Father, and of the Son, and of the Holy Spirit</mark></strong>,
    in living water. But if you have no living water, baptize into other water; and
    if you cannot do so in cold water, do so in warm. But if you have neither, pour
    out water <strong><mark>three times upon the head into the name of Father and
    Son and Holy Spirit</mark></strong>. But <strong>before the baptism let the baptizer
    fast, and the baptized</strong>, and whoever else can; but you shall order the
    baptized to fast one or two days before.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Didache#HH-7">The
    Didache, 7</a>)</p><h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c.
    100–165)</h3><blockquote><p>Now I will also relate the manner in which we dedicated
    ourselves to God when we had been made new through Christ; lest, if we omit this,
    we seem to be unfair in the explanation we are making. <strong>As many as are
    persuaded and believe</strong> that what we teach and say is true, and <strong>undertake</strong>
    to be able to live accordingly, <strong>are instructed</strong> <strong>to pray
    and to entreat God with fasting, for the remission of their sins that are past</strong>,
    we <strong>praying and fasting with them</strong>. Then <strong>they are brought
    by us where there is water</strong>, <strong>and are regenerated in the same manner
    in which we were ourselves regenerated</strong>. For, <strong><mark>in the name
    of God, the Father</mark></strong> and Lord of the universe, <strong><mark>and
    of our Saviour Jesus Christ</mark></strong>, <strong><mark>and of the Holy Spirit</mark>,
    they then receive the <mark>washing with water</mark></strong>. For Christ also
    said, “Except ye be born again, ye shall not enter into the kingdom of heaven.”
    Now, that it is impossible for those who have once been born to enter into their
    mothers’ wombs, is manifest to all. And how those who have sinned and repent shall
    escape their sins, is declared by Esaias the prophet, as I wrote above; he thus
    speaks: “Wash you, make you clean; put away the evil of your doings from your
    souls; learn to do well; judge the fatherless, and plead for the widow: and come
    and let us reason together, saith the Lord. And though your sins be as scarlet,
    I will make them white like wool; and though they be as crimson, I will make them
    white as snow. But if ye refuse and rebel, the sword shall devour you: for the
    mouth of the Lord hath spoken it.” And for this [rite] we have learned from the
    apostles this reason. Since at our birth we were born without our own knowledge
    or choice, by our parents coming together, and were brought up in bad habits and
    wicked training; in order that we may not remain the children of necessity and
    of ignorance, but may become the children of choice and knowledge, and may obtain
    <strong>in the water the remission of sins formerly committed, there is pronounced
    over him who chooses to be born again, and has repented of his sins, the name
    of God the Father and Lord of the universe</strong>; he who leads to the layer
    the person that is to be washed calling him by this name alone. For no one can
    utter the name of the ineffable God; and if any one dare to say that there is
    a name, he raves with a hopeless madness. And this washing <strong>is called illumination</strong>,
    because they who learn these things are illuminated in their understandings. And
    in the name of Jesus Christ, who was crucified under Pontius Pilate, and in the
    name of the Holy Ghost, who through the prophets foretold all things about Jesus,
    <strong>he who is illuminated is washed</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-61">Apology
    1</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p><strong><em>And
    again, giving to the disciples the power of regeneration into God</em></strong><em>,
    He said to them, “</em><strong><em>Go and teach all nations, <mark>baptizing them
    in the name of the Father, and of the Son, and of the Holy Ghost” (Matt. 28:19)</mark></em></strong><em>.
    For [God] promised, that in the last times He would pour Him [the Spirit] upon
    [His] servants and handmaids, that they might prophesy; wherefore He did also
    descend upon the Son of God, made the Son of man</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-The-Apostles-Teach-that-It-Was-Neither-Christ-Nor-the-Saviour-But-the-Holy-Spirit-Who-Did-Descend-Upon-Jesus-The-Reason-for-This-Descent">Against
    Heresies, Book III, XVII.1</a>)</p><h3><a href="https://bibleox.com/en/en/w/6Frm_Tertullian_II_c">Tertullian
    (c. 155–220)</a></h3><blockquote><p>Here, then, those miscreants provoke questions.
    And so they say, “Baptism is not necessary for them to whom faith is sufficient;
    for withal, Abraham pleased God by a sacrament of no water, but of faith.” But
    in all cases it is the later things which have a conclusive force, and the subsequent
    which prevail over the antecedent. Grant that, in days gone by, there was salvation
    by means of bare faith, before the passion and resurrection of the Lord. But now
    that faith has been enlarged, and is become a faith which believes in His nativity,
    passion, and resurrection, there has been an amplification added to the sacrament,
    viz., the sealing act of baptism; the clothing, in some sense, of the faith which
    before was bare, and which cannot exist now without its proper law. And <strong><mark>the
    law of baptizing has been imposed, and the formula prescribed</mark>: <em>“Go,”</em>
    He saith, <em>“teach the nations, <mark>baptizing them into the name of the Father,
    and of the Son, and of Hol</mark></em><mark>y</mark><em><mark> Spirit</mark>.”</em>
    (Matt. 28:19)</strong>. The comparison with this law of that definition, <em>“Unless
    a man have been reborn of water</em> and <em>Spirit, he shall</em> <em>not</em>
    enter <em>into the kingdom of the heavens”</em> (John 3:5), has tied faith to
    the necessity of baptism. Accordingly, all thereafter who became believers used
    to be baptized.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-on-baptism#HH-Another-Objection--Abraham-Pleased-God-Without-Being-Baptized-Answer-Thereto-Old-Things-Must-Give-Place-to-New-and-Baptism-is-Now-a-Law">On
    Baptism, 13</a>)</p><h2>3rd century</h2><h3>St Hippolytus of Rome, hieromartyr
    (170–235)</h3><blockquote><p>The Father’s Word, therefore, knowing the economy
    (disposition) and the will of the Father, to wit, that the Father seeks to be
    worshipped in none other way than this, gave this charge to the disciples after
    He rose from the dead: <em>“Go ye and teach all nations, </em><strong><em><mark>baptizing
    them in the name of the Father, and of the Son, and of the Holy Ghost</mark></em></strong><em>”</em>.
    And by this He showed, that whosoever omitted any one of these, failed in glorifying
    God perfectly. For it is through this Trinity (διὰ τῆς Τριάδος) that the Father
    is glorified. For the Father willed, the Son did, the Spirit manifested. The whole
    Scriptures, then, proclaim this truth.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/hippolytus-against-the-heresy-of-one-noetus">Against
    the Heresy of One Noetus, 14</a>)</p><h2>4th century</h2><h3>St Basil the Great,
    bishop (329–379)</h3><blockquote><p><em>Of the beliefs and practices whether generally
    accepted or publicly enjoined which are preserved in the Church </em><strong><em><mark>some
    we possess derived from written teaching; others we have received delivered to
    us in a mystery by the tradition of the apostles</mark></em></strong><em>; and
    </em><strong><em><mark>both of these in relation to true religion have the same
    force</mark></em></strong><em>. And these no one will gainsay – no one, at all
    events, who is even moderately versed in the institutions of the Church. For </em><strong><em>were
    we to attempt to reject such customs as have no written authority, on the ground
    that the importance they possess is small, we should unintentionally injure the
    Gospel in its very vitals; or, rather, should make our public definition a mere
    phrase and nothing more</em></strong><em>.</em></p><p><em>For instance, to take
    the first and most general example, who is thence who has taught us in writing
    to sign </em><strong><em>with the sign of the cross</em></strong><em> those who
    have trusted in the name of our Lord Jesus Christ?</em></p><p><em>What writing
    has taught us </em><strong><em>to turn to the East at the prayer</em></strong><em>?</em></p><p><em>Which
    of the saints has left us in writing the words </em><strong><em>of the invocation
    at the displaying of the bread of the Eucharist and the cup of blessing?</em></strong><em>
    For we are not, as is well known, content with what the apostle or the Gospel
    has recorded, but both in preface and conclusion we add other words as being of
    great importance to the validity of the ministry, and these we derive </em><strong><em><mark>from
    unwritten teaching</mark></em></strong><em>.</em></p><p><strong><em><mark>Moreover
    we bless the water of baptism</mark></em></strong><em>, and </em><strong><em>the
    oil</em></strong><em> </em><strong><em>of the chrism</em></strong><em>, and besides
    this </em><strong><em><mark>the catechumen who is being baptized</mark></em></strong><em>.
    On what written authority do we do this? Is not </em><strong><em><mark>our authority
    silent and mystical tradition</mark></em></strong><em>?</em></p><p><em>Nay, by
    what written word is </em><strong><em>the anointing of oil</em></strong><em> itself
    taught?</em></p><p><em>And whence comes </em><strong><em><mark>the custom of baptizing
    thrice</mark></em></strong><em>?</em></p><p><em>And as to the other customs of
    baptism from what Scripture do we derive the renunciation of Satan and his angels?
    Does not this come from that unpublished and secret teaching which our fathers
    guarded in a silence out of the reach of curious meddling and inquisitive investigation?
    Well had they learned the lesson that the awful dignity of the mysteries is best
    preserved by silence.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/rwa9_De_Spiritu_Sancto#HH-Chapter-27">About
    the Holy Spirit</a>)</p><h3>St Athanasius the Great, bishop (c. 295–373)</h3><blockquote><p>if
    <strong>God is Triune</strong> (which He indeed is), and it has been proved that
    He is an undivided Trinity, not unlike Himself; then it is necessary that the
    holiness of the Trinity be one, and its eternity one, and its nature immutable.
    For, as the faith delivered to us in the Trinity is one, and it unites us with
    God, so <strong><mark>whoever takes anything away from the Trinity, and baptizes
    into the one name of the Father, or into the one name of the Son, or into the
    Father and the Son without the Spirit, receives nothing</mark>, but both those
    being baptized and the one who thinks himself to be administering baptism remain
    empty and unenlightened</strong>; because the initiation is performed in the name
    of the Trinity: just as he who separates the Son from the Father, or brings down
    the Spirit to the level of creatures, has neither the Son nor the Father, but
    is ungodly, worse than an unbeliever, and anything rather than a Christian. As
    there is one baptism administered in the Father, and the Son, and the Holy Spirit,
    and one faith in the Trinity, as the Apostle said (Eph. 4:5); so the Holy Trinity,
    itself identical with itself and abiding in unity, has nothing created in itself.
    Such is the undivided unity of the Trinity, such is the one faith in it.</p></blockquote><p>(Letters
    to Serapion, bishop of Thmuis. Against those who say that the Holy Spirit is a
    creature)</p><h2>17th century</h2><h3>St Peter (Mogila), metropolitan of Kiev
    (1596–1647)</h3><blockquote><p><strong><em>Baptism is the washing away and blotting
    out of original sin by means of <mark>a threefold immersion in water, with the
    Priest pronouncing these words: “In the name of the Father. Amen. And of the Son.
    Amen. And of the Holy Spirit. Amen”</mark> (the Amen must be pronounced by the
    sponsor).</em></strong><em> After this, by the birth of water and the Spirit,
    man is reconciled with God, and the entrance into the Kingdom of Heaven is opened
    to him, according to the words of our Saviour: “unless one is born of water and
    the Spirit, he cannot enter the kingdom of God” (John 3:5). This Sacrament, once
    received, is not repeated, provided the one baptized believes orthodoxly in the
    one Tri-hypostatic God, and pronounces the aforesaid words: “In the name of the
    Father, and of the Son, and of the Holy Spirit. Amen” — exactly and unchangeably,
    according to the understanding of the Catholic and Orthodox Church.</em></p></blockquote><p>(The
    Orthodox Confession of the Catholic and Apostolic Eastern Church)</p><h2>20th
    century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>Baptism
    must be performed through a threefold immersion of the one being baptized in the
    water, with the invocation of the name of the Father, and of the Son, and of the
    Holy Spirit. </strong>The Evangelists, narrating the baptism of Jesus Christ,
    say that He, when baptized, “came up immediately out of the water” (Matt. 3:16),
    “coming up out of the water” (Mark 1:10). The going down into the water was evidently
    required for immersion into it, and not at all for pouring it over. John chose
    for the baptism of the Jews a place with much water near Salim (John 3:23), without
    doubt because here it was more convenient for him to baptize by immersion. The
    Apostles also baptized by immersion: “they both went down into the water, Philip
    and the eunuch; and he baptized (ἐβάπτισεν) him. When they came up out of the
    water…” (Acts 8:38–39). That the one being baptized is immersed in the water is
    indicated by the word of God when it sees a type of baptism in the flood (1 Pet.
    3:21); it calls baptism “the washing of water” (Eph. 5:26), “the laver of regeneration”
    (Titus 3:5), “the likeness of His death” (Rom. 6:5) and of burial: “we were buried
    with Him by baptism into death” (Rom. 6:4), that is, as at a burial the earth
    embraces the one being buried in it, so at immersion the water embraces the one
    being baptized.</p><p>The words that accomplish the Sacrament of Baptism are pronounced
    according to the command of Jesus Christ (Matt. 28:19). “The great mystery of
    baptism”, bears witness St Basil the Great, — “is performed by three immersions
    and an equal number of invocations”. “In doing this (the threefold immersion)”,
    says <strong>St Gregory of Nyssa</strong>, — “we portray on ourselves the three-day
    grace of the resurrection, and we do this not receiving the sacrament in silence,
    but with the utterance over us of the name of the three holy Hypostases… Why in
    the name of the Father? Because He is the beginning of all. Why in the name of
    the Son? Because He is the maker of creation. Why in the name of the Holy Spirit?
    Because He is the perfecting power of all.” “You have confessed”, teaches <strong>St
    Cyril of Jerusalem</strong>, — “the saving confession, and were immersed three
    times in the water, and again appeared out of the water. And here you symbolically
    depicted the three-day burial of Christ”.</p><p>The expression “to be baptized
    in the name of Jesus Christ” (Acts 2:38, 8:16, 10:48, 19:5 and elsewhere) means
    to be baptized according to the command of Jesus Christ, to receive the baptism
    instituted by Him. By this expression the word of God characterizes Christian
    baptism in distinction from the baptism of John. “Let no one”, teaches <strong>St
    Basil the Great</strong>, — “be misled by the fact that the Apostle, when mentioning
    baptism, often passes over the name of the Father and of the Holy Spirit in silence,
    and let no one conclude from this that the invocation of the names need not be
    observed… This is because the naming of Christ is the confession of the whole;
    it points both to the God who anoints, and to the Son who is anointed, and to
    the anointing, the Spirit”.</p></blockquote><p>(The Orthodox Church and the Sectants)</p>'
