    sin and for uncleanness</em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/zah/13/#L1"><u>Zech.
    13:1</u></a>).</p></blockquote><p>(The Orthodox Church and the Sectarians, 1.2)</p>
