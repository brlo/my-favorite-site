  body: <h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“<em>Then
    I </em><strong><em>will sprinkle clean water on you, and you shall be clean</em></strong><em>&lt;…&gt;
