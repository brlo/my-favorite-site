- src: VJ9j4Qyv_Почему_Господь_благоволил_сообщать_верующим_Свою_Благодать_через_внешние_средства
  path: Why-the-Lord-imparts-Grace-through-external-means
  title: Why has the Lord been pleased to impart His Grace to the faithful through
    external means?
  menu:
    parent: Sacraments of the Church
    title: Why the Lord imparts His Grace through external means
    priority: 1
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Since
    man consists of soul and body, in order to convince him of the certainty of the
    bestowal of grace upon him <strong>the Lord, in accordance with his spiritual-sensible
    nature, chose spiritual-sensible means of communicating it; while for beings alien
    to the flesh (such as angels and the souls of the departed), communion with God
    without visible mediation is possible</strong>. “Christ”, remarks St John Chrysostom,
    “handed down to us nothing sensible, but all that is spiritual, only in sensible
    things&lt;…&gt; If you were bodiless, then Christ would have imparted these gifts
    to you bodilessly; but since your soul is united with your body, the spiritual
    is communicated to you through the sensible”.</p></blockquote><p>(The Orthodox
    Church and the Sectarians, 1.2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: vyQYtwk2_Значение_таинств
  path: The-meaning-of-the-sacraments
  title: The meaning of the sacraments
  menu:
    parent: Sacraments of the Church
    title: The meaning of the sacraments
    priority: 2
  body: "<h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p><strong>The
    blood sacrifice opened the way for the descent of the Holy Spirit to us, from
    whom are all the graced powers that pertain unto life and piety. Without these
    powers our salvation cannot be accomplished. </strong>Therefore every man must
    needs acquire the grace of the Holy Spirit. But the Holy Spirit descended directly
    upon the Apostles only; <strong>after them the grace of the Holy Spirit is communicated
    to the believers in no other way than through special mediators, or Sacraments,
    instituted by the Lord’s direction in the Holy Spirit through the Apostles.</strong>
    <strong><mark>And these Sacraments are entrusted to the Holy Orthodox Church and
    exist in her alone. And the Church became a treasure-house not of truth only,
    but also of grace.</mark></strong> <strong><mark>Do you feel the need of grace?
    Go to the Orthodox Church, approach the Sacraments, – and you will receive grace,
    – every grace that you seek.</mark></strong></p><p>Are you seeking regeneration?
    Seek it in the Holy Orthodox Church. She – and she alone – <strong>will bring
    you forth of water and the Spirit, in the Sacrament of holy Baptism. </strong>–
    <strong>Do you seek the gift of the Holy Spirit? Seek it in the Holy Orthodox
    Church. She – and she alone – will bestow it upon you in the Sacrament of Chrismation.
    </strong>– Have you sinned? Do you repent and seek the healing of the wounds of
    your soul and the loosing of the bonds of your conscience? Go to the Holy Orthodox
    Church. She – and she alone – having in the persons of her pastors received the
    power to bind and to loose,<strong> will loose you from your sins and heal the
    wounds of your soul </strong>by healing obligations<strong>. </strong>– Do you
    have need of, and seek, the most inward communion with the Lord? Go to the Holy
    Orthodox Church. She – and she alone – <strong>having given you to taste of the
    Body and Blood of the Lord from His sacrifice, which she offers continually, will
    bring it about that you are in the Lord and the Lord in you, according to His
    promise that cannot be false.</strong> – Do you seek to lay a graced foundation
    for your family? Go to the Holy Orthodox Church. She will grant you this blessing,
    sealing your marriage union with grace in the Sacrament of Matrimony. – Are you
    infirm in body and seeking healing? Turn to the Holy Church. She will grant you
    this blessing together with the remission of sins, through the Sacrament of Unction
    with Oil.</p><p><strong><mark>So many graced treasures have been entrusted to
    the Holy Church! – Their stewards and distributors were appointed first the Apostles,
    and then their successors, who themselves receive a special grace for this through
    the Sacrament of Priesthood in the Church of God. The Sacrament of Priesthood
    is the summit of the graced Sacraments: for without it all the other Sacraments
    also would remain inoperative, – and the Church would turn into a graceless one.</mark></strong></p><p><strong><mark>Thus
    the Hypostatic Wisdom of God, having built for Himself the house of the Holy Church,
    established in it “pillars” (divisions) “seven”, and all who come to her, at her
    call, abundantly feeds and gives drink with His manifold grace. </mark></strong>Seven
    fountains of grace. But two of them flow inseparably throughout the whole course
    of the life of the one being saved. <strong>These are the Sacraments – of Repentance
    and of holy Communion, which give the grace of justification and the grace of
    sanctification, – graces that are not constant in the saving life. </strong>They
    develop, root, and raise up in the spirit of man everything needful for salvation.
    And the more often one makes use of them, the more successfully his spiritual
    saving life ripens. Without this it soon becomes clogged, withers, and grows dull.</p></blockquote><p>(Selected
    Letters on Sects and Heresies, Letter 27)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p><strong>The Sacraments, according
    to the teaching of the Orthodox Church, are sources of divine life, actual means
    of grace, and not merely a means that strengthens faith.</strong> <strong><mark>In
    the Sacraments there is communicated to the believer, who has readiness to receive
    grace and for active communion with it, a special divine power, which sanctifies
    and strengthens him in the spiritual life and assists his closest communion with
    God</mark></strong>. In case of unbelief and unworthiness of the one receiving
    the sacrament, the action of grace for him will be not saving but unto judgment
    and condemnation (cf. 1 Cor. 11:27-29; Heb. 12:23-29), yet his unworthiness does
    not prevent the sacrament from being valid (having grace) and effectual (though
    not unto salvation but, through his own fault, unto condemnation). Whoever refuses
    the Sacraments blocks the way for himself to the divine powers “necessary for
    life and piety” (2 Pet. 1:3); the consequence of this is his powerlessness in
    the struggle with sin, slavery to sin, and spiritual death (cf. Rom. 6).</p></blockquote><p>(The
    Orthodox Church and the Sectarians, 1.2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
