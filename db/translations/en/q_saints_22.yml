  body: '<h2>4th century</h2><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>For if a man nourishing worms in his entrails,
    shall not be able so much as to breathe, his inward parts all wasting away; how
    shall we, having so large a serpent eating up all within us (it is <strong><mark>wrath</mark></strong>
    I mean), how, I say, shall we be able to produce anything noble? <strong>How then
    are we to be freed from this pest?</strong> If <strong>we can drink a potion that
    is able to kill the worms within us and the serpents</strong>. “And of what nature,”
    it will be asked, “may this potion be, that hath such power?” <strong><mark>The
    precious Blood of Christ, if it be received with full assurance,[135](for this
    will have power to extinguish every disease).</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-gospel-of-saint-matthew-1#HH-Matthew-I-17">Homilies
