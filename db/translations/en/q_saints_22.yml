  body: '<h2>1st century</h2><h3>Author of the “Epistle of Barnabas” (1st–2nd c.)</h3><blockquote><p>Let
    us further inquire whether the Lord took any care to foreshadow the water [of
    baptism] and the cross. Concerning the water, indeed, it is written, in reference
    to the Israelites, that they should not receive that <strong><mark>baptism which
    leads to the remission of sins</mark></strong>, but should procure another for
    themselves (Mark 7:4). &lt;…&gt; This meaneth, that <strong><mark>we indeed descend
    into the water full of sins and defilement</mark>, but <mark>come up, bearing
    fruit in our heart, having the fear [of God] and trust in Jesus in our spirit</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Epistle_of_Barnabas#HH-11">Epistle of Barnabas,
    ch. 11</a>)</p><h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p>I
    will also relate <strong>the manner in which we dedicated ourselves to God</strong>
    when we had been made new through Christ; lest, if we omit this, we seem to be
    unfair in the explanation we are making. As many as are persuaded and believe
    that what we teach and say is true, and undertake to be able to live accordingly,
    <strong>are instructed to pray and to entreat God with fasting, for the remission
    of their sins that are past, we praying and fasting with them. Then they are brought
    by us where there is water, and are regenerated in the same manner in which we
    were ourselves regenerated. For, in the name of God, the Father and Lord of the
    universe, and of our Saviour Jesus Christ, and of the Holy Spirit, they then <mark>receive
    the washing with water</mark>.</strong> For Christ also said, “Except ye be born
    again, ye shall not enter into the kingdom of heaven.” Now, that it is impossible
    for those who have once been born to enter into their mothers’ wombs, is manifest
    to all. And <strong><mark>how those who have sinned and repent shall escape their
    sins</mark></strong>, is declared by Esaias the prophet, as I wrote above; he
    thus speaks: “<strong><mark>Wash you</mark></strong>, make you clean; put away
    the evil of your doings from your souls; learn to do well; judge the fatherless,
    and plead for the widow: and come and let us reason together, saith the Lord.
    And though your sins be as scarlet, I will make them white like wool; and though
    they be as crimson, I will make them white as snow. But if ye refuse and rebel,
    the sword shall devour you: for the mouth of the Lord hath spoken it.” And for
    this [rite] <strong>we have learned from the apostles this reason</strong>. Since
    at our birth we were born without our own knowledge or choice, by our parents
    coming together, and were brought up in bad habits and wicked training; in order
    that we may not remain the children of necessity and of ignorance, but may become
    the children of choice and knowledge, and may <strong><mark>obtain in the water
    the remission of sins formerly committed, there is pronounced over him who chooses
    to be born again, and has repented of his sins, the name of God the Father and
    Lord of the universe</mark></strong>; he who leads to the layer the person that
    is to be washed calling him by this name alone. For no one can utter the name
    of the ineffable God; and if any one dare to say that there is a name, he raves
    with a hopeless madness. And <strong><mark>this washing is called illumination</mark></strong>,
    because <strong><mark>they who learn these things are illuminated in their understandings</mark></strong>.
    And in the name of Jesus Christ, who was crucified under Pontius Pilate, and in
    the name of the Holy Ghost, who through the prophets foretold all things about
    Jesus, he who is illuminated is washed.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-61">First
    Apology, ch. 61</a>)</p><h2>3rd century</h2><h3>Tertullian (c. 155–220)</h3><blockquote><p>Oh,
    what a god is this! everywhere perverse; nowhere rational; in all cases vain;
    and therefore a nonentity! <strong>2.</strong> In whose state, and condition,
    and nature, and every appointment, I see no coherence and consistency; no, not
    even in the very sacrament of his faith! For what end does <strong><mark>baptism</mark></strong>
    serve, according to him? If <strong><mark>the remission of sins</mark></strong>,
    how will he make it evident that he remits sins, when he affords no evidence that
    he retains them? Because he would retain them, if he performed the functions of
    a judge. If <strong><mark>deliverance from death</mark></strong>, how could he
    deliver <i>from</i> death, who has not delivered <i>to</i> death? For he must
    have delivered the sinner to death, if he had from the beginning condemned sin.
    If <strong><mark>the regeneration of man</mark></strong>, how can he regenerate,
    who has never generated? <strong>3.</strong> For the repetition of an act is impossible
    to him, by whom nothing any time has been ever done. If <strong><mark>the bestowal
    of the Holy Ghost</mark></strong>, how will he bestow the Spirit, who did not
    at first impart the life? For the life is in a sense the supplement of the Spirit.
    He therefore seals man, who had never been unsealed in respect of him; washes
    man, who had never been defiled so far as he was concerned; and into this sacrament
    of salvation wholly plunges that flesh which is beyond the pale of salvation!
    <strong>4.</strong> No farmer will irrigate ground that will yield him no fruit
    in return, except he be as stupid as Marcion’s god.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-the-five-books-against-marcion-1#HH-This-Perverse-Doctrine-Deprives-Baptism-of-All-Its-Grace-If-Marcion-Be-Right-the-Sacrament-Would-Confer-No-Remission-of-Sins-No-Regeneration-No-Gift-of-the-Spirit">Against
    Marcion, book 1, 28</a>)</p><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p>and
    set down only those things which God speaks, wherewith Christ exhorts His servants
    to martyrdom. Those divine precepts themselves must be supplied, as it were, for
    arms for the combatants. Let them be the incitements of the warlike trumpet; let
    them be the clarion-blast for the warriors. Let the ears be roused by them; let
    the minds be prepared by them; let the powers both of soul and body be strengthened
    to all endurance of suffering. Let us only who, <strong>by the Lord’s permission,
    have given <mark>the first baptism</mark> (translator’s note: water) to believers</strong>,
    also prepare each one for the second (translator’s note: martyrdom), urging and
    teaching that this is a baptism greater in grace, more lofty in power, more precious
    in honour—a baptism wherein angels baptize—a baptism in which God and His Christ
    exult—a baptism after which no one sins any more—a baptism which completes the
    increase of our faith—a baptism which, as we withdraw from the world, immediately
    associates us with God. <strong><mark>In the baptism of water is received the
    remission of sins</mark>, in the baptism of blood the crown of virtues</strong>.
    This thing is to be embraced and desired, and to be asked for in all the entreaties
    of our petitions, that we who are God’s servants should be also His friends.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-exhortation-to-martyrdom-addressed-to-fortunatus#HH-Preface">Exhortation
    to Martyrdom, Addressed to Fortunatus</a>)</p><h2>4th century</h2><h3>St John
    Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p>5. “Blessed
    be God,” let us say again, “who alone does wondrous things” (Ps. 71:18), who does
    all things and transforms! Yesterday’s captives are now free and citizens of the
    Church; once clothed in the shame of sins, they now stand in boldness and righteousness.
    Indeed, they are not only <strong>free</strong> but also <strong>holy</strong>,
    not only holy but <strong>righteous</strong>, not only righteous but <strong>sons</strong>,
    not only sons but <strong>heirs</strong>, not only heirs but <strong>brothers
    of Christ</strong>, not only brothers of Christ but <strong>co-heirs</strong>,
    not only co-heirs but <strong>members</strong>, not only members but a <strong>temple</strong>,
    not only a temple but <strong>instruments of the Spirit</strong>.</p><p>6. “Blessed
    be God, who alone does wondrous things!” Have you seen how great are the gifts
    of Baptism? Though many think the gift of Baptism consists only <strong>in the
    remission of sins</strong>, we have counted ten honors. That is why we baptize
    infants, even though they have no sins—so that they may receive sanctification,
    righteousness, adoption, inheritance, brotherhood, become members of Christ, and
    be made a dwelling place for the Holy Spirit.</p></blockquote><p><em>(</em><a
    href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-The-Baptism-of-Infants"><em>Catechetical
    Homilies, 4:5–6</em></a><em>)</em></p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p>“This sacrament (of baptism) destroys
    all sins: in infants the original sin, and in adults both the original sin and
    those committed of their own will. Secondly, it re-creates the man and restores
    to him the righteousness which he had in the state of innocence and sinlessness,
    as the apostle testifies (1 Cor. 6:11); finally, after baptism we become members
    of the body of Christ and put on our Lord” (Gal. 3:27; Orthodox Confession, answer
    to question 103). “In baptism,” teaches <strong>St Isidore of Pelusium</strong>,
    “nature not only received everything that was needed for the taking away of sin,
    but was also adorned with divine gifts. Not only was it delivered from punishment
    and stripped of all wickedness, but it was born again from above by the divine…
    re-creation, redeemed, sanctified, granted adoption, justified, made heir of the
    Only-begotten and of one body with Him through the partaking of the Sacred Mysteries;
    it became His body and was united with Him, as body with head… Therefore recognize,
    friend, that baptism not only takes away sins, but also produces adoption, and
    divine kinship, and thousands of other blessings, which we have enumerated and
    left unmentioned; for the King of all not only redeemed the enslaved nature, but
    also raised it to the highest degree of honor”.</p><p><strong><mark>a) Forgiveness
    of sins and cleansing from them</mark></strong></p><p>In baptism, and not before
    baptism, the person being baptized is granted the forgiveness of the original
    and personal sins (committed before baptism), the cleansing (“washing”) from everything
    sinful — and not merely a declaration of being righteous before God while sinfulness
    remains (cf. Ezek. 36:25; Mic. 7:19; Zech. 13:1). The apostle Peter said to the
    believing Jews: “Repent, and let every one of you be baptized in the name of Jesus
    Christ for the remission of sins” (Acts 2:38). Evidently, the sins of those who
    had believed but had not yet been baptized were not yet forgiven. To Saul Ananias
    said: “Arise and be baptized, and wash away your sins” (Acts 22:16) — which means
    they were not yet forgiven. “And such were some of you (sinners, before baptism).
    But you were washed (in baptism), but you were sanctified, but you were justified
    in the name of the Lord Jesus and by the Spirit of our God” (1 Cor. 6:11; cf.
    Rom. 6:2–7; Col. 2:11–13). In the Epistle to the Colossians (Col. 2:11–13) the
    apostle sets Christian baptism, “the circumcision of Christ,” in contrast to Jewish
    circumcision, which consisted in the removal of a certain part of the body and
    was only an external rite. The latter is a circumcision of the heart, an inward
    act, and in this sense it is “made without hands.” The expression “by the putting
    off (ἐν τῇ ἀπεκδύσει, from ἀπέκδυσις — the taking off of a garment, renunciation)
    of the body of the sins of the flesh” (of the sinfulness of human nature — cf.
    Rom. 6:6) signifies that, as a garment no longer needed is taken off entire, so
    in baptism (the circumcision made without hands) not a part of the body only is
    removed, but the whole sinful side of the human being. “Now,” says the apostle,
    as St John Chrysostom explains, “the circumcision is not done with a knife, but
    by Christ Himself; not the hand performs this circumcision, as there (in the old
    covenant), but the Spirit; it is not a part that is circumcised, but the whole
    man. The body is this, and the body is that; but the one is circumcised in the
    flesh, and this one spiritually — not as the Jews (circumcised) — for you have
    put off not the flesh, but sins. When and where? In baptism. What Paul calls circumcision,
    he calls also burial.” — “Since the Colossians, carried away, had come to love
    the life under the law, the apostle,” says <strong>Blessed Theodoret</strong>,
    “explains also the difference of the circumcision: it is not of the flesh but
    spiritual, not made by hands but divine, not the taking away of a small part of
    the body, but liberation from every corruption. And its author is not the law,
    but the Lord Christ… By ‘the putting off of the body of the sins of the flesh’
    he called the saving baptism, because in it we strip off the defiled garment of
    sin”.</p><p><strong><mark>b) Re-creation, or regeneration</mark></strong></p><p>In
    the Word of God the justifying and sanctifying action of the grace of baptism
    is called being “born again” (John 3:3), “born of the Spirit” (John 3:5), “regeneration”
    (“the washing of regeneration” — Tit. 3:5). Before baptism man was a slave of
    sin (Rom. 6:20); having believed in Christ, he hates sin, repents, and resolves
    to give himself “as a slave of righteousness for holiness” (Rom. 6:19), to become
    “a slave of God” (Rom. 6:22). But this resolution of his to change the direction
    of his will is still unsteady, unreliable, powerless. In baptism the grace of
    God, having washed him from sinful defilement, strengthens the resolution of his
    will to live for righteousness and holiness, and he comes out of the font altogether
    new, renewed in his spiritual and moral life, truly born anew — but only “from
    above,” “of the Spirit” — and therefore he is a new creation (2 Cor. 5:17). “Regeneration”
    has made his nature able to receive, to contain and to keep the gifts of the Holy
    Spirit, given in another sacrament — Chrismation. “He who comes out of the font
    of baptism,” writes <strong>bishop Theophan</strong>, “is both justified and righteous
    — every guilt of sin is taken away from him, and he desires only one thing: the
    good well-pleasing to God, and he is able to do it.” — “Human nature itself,”
    teaches St Gregory of Nyssa, “undergoes no change from baptism: neither the reason,
    nor the understanding, nor the faculty of knowledge, nor anything else that properly
    serves as the distinguishing mark of human nature, is transformed (changed). If,
    according to the word of the prophet, having washed in this mystical bath we have
    become clean in our choices, washing away the evils from our souls (Isa. 1:16),
    then we have become better and have been transformed into better… If you are such,
    then you have truly become a child of God. But if you remain with the former marks
    of vice, then in vain you proclaim your birth from above.” — “The essence of justification
    (in baptism),” <strong>writes Sergius, archbishop of Finland</strong>, “consists
    not in a change of man’s spiritual-bodily nature independent of his will, but
    in a change of his manner of life, in a change of the direction of his will. Dying
    to sin and rising to righteousness, man receives not another soul or a new power
    in the soul, but only resolves with the same soul to live entirely otherwise”.</p><p><strong><mark>c)
    Union with Christ, reconciliation with God</mark></strong></p><p>“<em>For you
    are all sons of God through faith in Christ Jesus. For as many of you as were
    baptized into Christ have put on Christ</em>” (i.e., united with Him — cf. 1 Cor.
    6:17; 2 Cor. 13:5; Gal. 3:26–27; cf. Rom. 8:14–15; Gal. 4:5). “In defining how
    we are sons of God,” remarks <strong>Blessed Theophylact</strong>, “he says it
    is through baptism. But he did not say: you who were baptized became children
    of God, as consistency would seem to require, but far more expressively: ‘you
    have put on Christ.’ And if we have put on ‘Christ the Son of God,’ and have been
    made like unto Him, then we have been brought into one kinship, into one image,
    becoming by grace what He is by nature” — “Therefore, having been justified by
    faith, we have peace with God through our Lord Jesus Christ” (Rom. 5:1). “To those
    who received Him, who believe in His name, He gave the right to become children
    of God, who were born not of blood, nor of the will of the flesh, nor of the will
    of man, but of God” (John 1:12–13). “But why did the evangelist not say: He made
    them children of God, but says: He gave the right to become children of God? To
    show,” explains <strong>St John Chrysostom</strong>, “how much care is needed
    to preserve, all our life long in purity and without blemish, the image of adoption
    that was imprinted on us at baptism; and at the same time to show that no one
    can take this right from us unless we first deprive ourselves of it… The evangelist
    recalls to us the very manner of the spiritual birth (baptism) itself and, by
    comparing it with bodily birth, shows its superiority.” — “For by one Spirit we
    were all baptized into one body” (1 Cor. 12:13). “Those who gladly received his
    word were baptized, and about three thousand souls were added (to the Church)
    in that day… And the Lord added daily to the Church those who were being saved”
    (Acts 2:41–47).</p><p><strong><mark>d) Deliverance from eternal condemnation</mark></strong></p><p>“<em>He
    who believes and is baptized will be saved; but he who does not believe will be
    condemned</em>” (Mark 16:16). “<em>And if children, then heirs — heirs of God
    and joint heirs with Christ</em>” (Rom. 8:17). “<em>Having been justified by His
    grace we should become heirs according to the hope of eternal life</em>” (Tit.
    3:7).</p></blockquote><p>(The Orthodox Church and Sectarians, 1.2)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
