- src: T2ustMfL_Приступать_к_таинству_причащения_необходимо_с_приготовлением
  path: Communion-requires-preparation
  title: One must approach the sacrament of Communion with preparation
  menu:
    parent: Sacraments of the Church/Eucharist (Communion)
    title: One must approach Communion with preparation
    priority: 6
  body: '<h2>Holy Scripture</h2><blockquote><p>“<strong><mark>But let a man examine
    himself,</mark></strong> and so let him eat of the bread and drink of the cup”
    (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L28">1 Cor. 11:28</a>)</p></blockquote><h2>1st
    century</h2><h3>The Didache</h3><blockquote><p>“But every Lord’s day gather yourselves
    together, and break bread, and give thanksgiving <strong><mark>after having confessed
    your transgressions</mark></strong>, that your sacrifice may be pure” (<a href="https://bibleox.com/en/en/w/Didache#HH-14">The
    Didache, ch. 14</a>)</p></blockquote><h2>20th century</h2><h3>Vasily (Rodzianko),
    bishop (1915–1999)</h3><blockquote><p><em>The Eucharist means thanksgiving, gratitude
    to God for this Bread. The Liturgy means a common service, or even cooperation:
    we are all fellow-workers, co-workers of God, as the holy Apostle Paul says. We
    are all His helpers in that great work which He performs in His divine creation,
    so that</em> we become, together with all the rest of creation, with the whole
    universe, with the people of the whole world, with the living beings in all the
    world — we all become one single whole and at the core (in essence) turn out to
    be the one Church of Christ, the one Body of Christ.</p><p>And our earthly bread,
    which we bring at the moment of the proskomedia, which in Greek means offering,
    when we bring bread in order to change it, that is, transform it into the Body
    of Christ. This is our gift, our holy gifts, which we bring as a gift to God,
    and the Lord gives us by His grace and <strong>by His changing, by the power of
    the Holy Spirit, bread into the Body and wine into the Blood</strong> — these
    are the Holy Gifts on God’s side. There meet together the human gifts, the result,
    the fruit of our labour, and <strong><mark>the Divine Gifts, the Gifts of the
    Heavenly Light, the Uncreated</mark></strong>. The Gifts of the Body of Christ,
    which are a reflection of that amazing circling (perichoresis) in the All-holy
    Trinity, of which we spoke in the talk on the Uncreated Light, for <strong>the
    Uncreated Light and Communion are part of each other</strong>. That is why <strong><mark>in
    divine Communion we become deified by the power of the Holy Spirit at the moment
    of Communion</mark></strong>. That is what Communion is. And <strong>that is why
    one must prepare for Communion, one must always be ready</strong>, so as not to
    approach Holy Communion too worldly, too earthly, too sinfully. No, <strong><mark>one
    must be cleansed of sins in repentance, if possible, in confession, and always
    come with an open heart, with an open soul, with a clean conscience and with love
    for God and for all our brothers and sisters — members of the Church of Christ.
    The Eucharist is thanksgiving. The Eucharistic life is a life of thanksgiving
    in God and with God. In God, so that we may always be one Body and one single
    whole. This is Communion, this is the meaning and essence of everything.</mark></strong></p><p><strong>One
    must not think that Communion is some kind of magic — God forbid. No, nothing
    of that sort can exist in what is divine, pure and holy</strong>. No, this is
    far greater, far fuller, far deeper, for <strong><mark>this is our participation
    in the divine life, our participation in the life of the Holy Trinity, our participation
    in the uncreated Heavenliness, our participation in the heavenly Paradise of the
    Kingdom of Heaven, of the kingdom of God. The kingdom of God on earth is the Divine
    Liturgy</mark></strong>, and therefore at the Liturgy it is said: the ever-present
    Being, that is, always Existing; likewise, Thou, and Thine Only-begotten Son,
    and Thy Holy Spirit — the Holy Trinity. The Holy Trinity in Its love, in Its Uncreated
    Light, in the transparency of this love. Thou hast brought us from non-being into
    being — Thou didst create us at the very beginning, so that we might live with
    Thee and in Thee in the kingdom of God, in Paradise; but then we all fell away
    (as a result of sin), and therefore it is said further in this prayer — and hast
    raised up again those who had fallen: that is, in spite of the fact that we fell
    away and were in our fall and are now still in our fall, yet here, now, at this
    Divine Liturgy Thou hast raised us up again, restored us; we have risen again,
    we are again in Paradise. And Thou hast not ceased to do everything until Thou
    hast led us up to Heaven — Thou hast led us up to Heaven itself. What Heaven?
    The uncreated Heaven, the divine Heaven, the holy Heaven, the Heaven in which
    and for which we were created in the beginning. And Thou hast granted Thy Kingdom,
    the one to come. — It is amazing that in this whole sentence there are three tenses
    of our grammar: past, present and future. We speak here of the future Kingdom,
    but we speak in the past tense, because Thou hast already granted us this Kingdom
    here, now. And now this very Liturgy is the present. These three tenses signify
    eternity. We are already, in this Liturgy, in eternity. And here the Eucharist
    — thanksgiving. — For all these things we thank Thee. — For all this we thank
    Thee. This is our Eucharist! And Thine Only-begotten Son, and Thy Holy Spirit,
    for all the good things, of which we know and of which we know not, manifest and
    unmanifest, bestowed on us — for everything we thank Thee now, here. What a divine
    power is at work in us at this moment. We find ourselves in the Kingdom of Heaven,
    in the kingdom of God, in the heavenly Paradise.</p></blockquote><p>(Holy Communion)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
