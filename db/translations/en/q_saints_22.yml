- src: 2uOZVBhN_Отличие_таинств_от_обрядов
  path: The-difference-between-sacraments-and-rites
  title: The difference between sacraments and rites
  menu:
    parent: Sacraments of the Church
    title: The difference between sacraments and rites
    priority: 3
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>a)
    <strong>In the rites there is not such a bond between the visible sign and the
    invisible, supernatural side as there is in the Sacraments</strong>, and therefore
    no necessary communication of grace is joined with the rites, grace, if it is
    imparted, being imparted only in the sense of God’s mercy or God’s blessing. </p><p>b)
    <strong>In the Sacraments those receiving them obtain definite gifts of God’s
    grace, which sanctifies them, and <mark>without the Sacraments man cannot inherit
    salvation</mark></strong> (John 3:5, 6:53). <strong>The rites, however, are performed
    not with the aim of bringing down upon the faithful saving grace, which appropriates
    to men the fruits of redemption, but with the aim of bringing down God’s blessing
    chiefly upon man’s outward activity and even upon outward objects (the blessing
    of fields, wells, and the like)</strong>. Therefore the rites, being most useful
    and permissible, as sources of God’s blessing or as means that kindle the religious
    disposition of the believer (for example, a journey to holy places), do not have
    the character of unconditional obligation for a Christian. c) The Sacraments are
    seven, while the rites are many.</p></blockquote><p>(The Orthodox Church and the
    Sectarians, 1.2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
