    parent: Sacraments of the Church/The sacrament of Baptism
    title: Examples of water baptism
    priority: 11
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>a)
    <strong>St John the Forerunner baptized in water</strong>: “these things were
    done in Bethabara beyond the Jordan, where John was baptizing” (John 1:28). “John
    also was baptizing in Aenon near Salim, because there was much <strong>water</strong>
    there. And they came and were baptized” (3:23).</p><p>b) <strong>The Lord Jesus
    Christ was baptized in water</strong>: “When He had been baptized, Jesus came
    up immediately from the <strong>water</strong>” (Matt. 3:16). “Jesus came from
    Nazareth of Galilee, and was baptized by John in the Jordan. And coming up from
    the <strong>water</strong>…” (Mark 1:9–10).</p><p>c) <strong>The apostles baptized
    in water</strong>: “they came to some water; and the eunuch said: See, here is
    <strong>water</strong>. What hinders me from being baptized…? and both went down
    into the <strong>water</strong>” (Acts 8:36–38), “Can anyone forbid <strong>water</strong>,
    that these should not be baptized who have received the Holy Spirit just as we
    have? And he commanded them to be baptized in the name of the Lord” (10:47–48).</p><p>In
    other places of Holy Scripture (cf. Acts 2:33, 8:12, 19:3–5; Mark 1:8; Matt. 28:19;
    Mark 16:16, etc.) the water in which they were baptized is not mentioned, because
    the notion of it (of water) is contained in the very word “to baptize” (βαπτίζειν
    — to immerse, sprinkle, wash).</p></blockquote><p>(The Orthodox Church and the
    Sectarians, 1.2)</p>"
