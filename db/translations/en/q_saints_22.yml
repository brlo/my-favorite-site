- src: Понятие_о_таинстве_Крещения
  path: The-concept-of-the-sacrament-of-Baptism
  title: The concept of the sacrament of Baptism
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: The concept of the sacrament of baptism
    priority: 1
  body: '<h2>17th century</h2><h3>Confession of the Orthodox Faith of the Eastern
    Church (1672, 1723)</h3><blockquote><p>And the effects of Baptism are, to speak
    concisely, <strong>firstly, the remission of the hereditary transgression, and
    of any sins whatsoever</strong> which the baptised may have committed.</p><p>Secondly,
    it <strong>delivereth him from the eternal punishment, to which he was liable,
    as well for original sin, as for mortal sins</strong> he may have individually
    committed.</p><p>Thirdly, it <strong>giveth to such immortality; for in justifying
    them from past sins, it maketh them temples of God</strong>.</p><p>And it may
    not be said, that any sin is not washed away through Baptism, which may have been
    previously committed; but to remain, though not imputed.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">The
    Eastern Orthodox Confession of Faith, Decree 16</a>)</p><h3>St Peter (Mogila),
    metropolitan of Kiev (1596–1647)</h3><blockquote><p><strong>Baptism is the washing
    away and destruction of original sin by means of threefold immersion in water,
    with the pronouncement by the Priest of these words: “In the name of the Father.
    Amen. And of the Son. Amen. And of the Holy Spirit. Amen” (the Amen must be pronounced
    by the sponsor).</strong> After this, <strong>by the birth of water and the Spirit
    there takes place the reconciliation of man with God, and the entrance into the
    Kingdom of Heaven is opened to man</strong>, after the words of our Saviour: “unless
    one is born of water and the Spirit, he cannot enter the kingdom of God” (John
    3:5). This Sacrament, once received, is not repeated, provided that the one being
    baptized believes Orthodoxly in the one Tri-hypostatic God and that he pronounces
    the aforesaid words: “In the name of the Father, and of the Son, and of the Holy
    Spirit. Amen” – exactly and without alteration, according to the understanding
    of the Catholic and Orthodox Church.</p></blockquote><p>(The Orthodox Confession
    of the Catholic and Apostolic Eastern Church, part 1, q. 9)</p><h2>19th century</h2><h3>St
    Philaret (Drozdov), metropolitan of Moscow (1782–1867)</h3><blockquote><p><strong>Baptism
    is a Sacrament, in which a man who believes, having his body thrice plunged in
    water in the name of God the Father, the Son, and the Holy Ghost, dies to the
    carnal life of sin, and is born again of the Holy Ghost to a life spiritual and
    holy</strong>.</p><p><em>“unless one is born of water and the Spirit, he cannot
    enter the kingdom of God”</em> (John 3:5).</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/TQdr_The_Longer_Catechism_of_The_Orthodox_Catholic_Eastern_Church#HH-On-Baptism">The
    Longer Catechism of the Orthodox Catholic Eastern Church, §288</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
