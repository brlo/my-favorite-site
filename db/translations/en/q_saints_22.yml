- src: YOWCLXrn_Понятие_о_таинстве_причащения
  path: The-concept-of-the-sacrament-of-Communion
  title: The concept of the sacrament of Communion
  menu:
    parent: Sacraments of the Church/Eucharist (Communion)
    title: The concept of the sacrament of Communion
    priority: 1
  body: '<h2>18th century</h2><h3>Epistle of the Patriarchs of the Orthodox Church
    (1723)</h3><blockquote><p><em>We believe the All-holy Mystery of the Sacred Eucharist,
    which we have enumerated above, fourth in order, to be that which our Lord delivered
    the night wherein he gave himself up for the life of the world. For taking bread,
    and blessing, he gave to his holy Disciples and Apostles, saying: “Take, eat ye;
    This is my Body” (Matt. 26.26). And taking the chalice, and giving thanks, he
    said: “Drink ye all of it; this is my Blood, which for you is being poured out,
    for the remission of sins” (Matt. 26.28).</em></p><p><em>In the celebration whereof
    </em><strong><em>we believe the Lord Jesus Christ to be present, not typically,
    nor figuratively, nor by superabundant grace, as in the other Mysteries, nor by
    a bare presence, as some of the Fathers have said concerning Baptism, or by impanation,
    so that the Divinity of the Word is united to the set forth bread of the Eucharist
    hypostatically, as the followers of Luther most ignorantly and wretchedly suppose,
    but truly and really, so that after the consecration of the bread and of the wine,
    <mark>the bread is transmuted, transubstantiated, converted and transformed into
    the true Body itself of the Lord, which was born in Bethlehem of the ever-Virgin</mark>,
    was baptised in the Jordan, suffered, was buried, rose again, was received up,
    sitteth at the right hand of God the Father, and is to come again in the clouds
    of heaven; <mark>and the wine is converted and transubstantiated into the true
    Blood itself of the Lord, which as he hung upon the Cross, was poured out for
    the life of the world</mark> (John 6.51). Further, [we believe] that after the
    consecration of the bread and of the wine, there no longer remaineth the substance
    of the bread and of the wine, but the Body itself and the Blood of the Lord, under
    the species and form of bread and wine; that is to say, under the accidents of
    the bread</em></strong><em>.</em></p><p><em>Further, that the all-pure Body itself,
    and Blood of the Lord is imparted, and entereth into the mouths and stomachs of
    the communicants, whether pious or impious. Nevertheless, they convey to the pious
    and worthy remission of sins and life eternal; but to the impious and unworthy
    involve condemnation and eternal punishment.</em></p><p><em>Further, that the
    Body and Blood of the Lord are severed and divided by the hands and teeth, though
    in accident only, that is, in the accidents of the bread and of the wine, under
    which they are visible and tangible, we do acknowledge; but in themselves to remain
    entirely unsevered and undivided. Wherefore the Catholic Church also saith: “Broken
    and distributed is he that is broken, yet not severed; which ever is eaten, yet
    never consumed, but sanctifying those that partake”, that is worthily.</em></p><p><em>Further,
    that in every part, or the smallest division of the transmuted bread and wine
    there is </em><strong><em>not a part of the Body and Blood of the Lord &lt;…&gt;
    but the entire whole Lord Christ substantially, that is, with his Soul and Divinity,
    or perfect God and perfect man. So that though there are not many Christs, or
    Bodies of Christ, but it is one and the same Christ that is truly and really present;
    and his one Body and his Blood is in all the several Churches of the Faithful</em></strong><em>;
    and this is not because the Body of the Lord that is in the Heavens descendeth
    upon the Altars; but because the bread of the Prothesis set forth in all the several
    Churches, being changed and transubstantiated, becometh, and is, after consecration,
    one and the same with that in the heavens. For it is one Body of the Lord in many
    places, and not many; </em><strong><em>and therefore this Mystery is the greatest,
    and is spoken of as wonderful, and comprehensible by faith only, and not by the
    sophistries of man’s wisdom; whose vain and foolish curiosity in divine things
    our pious and God-delivered religion rejecteth.</em></strong><em> Further, that
    the Body itself of the Lord and the Blood that are in the Mystery of the Eucharist
    ought to be honoured in the highest manner, and adored with latria. For one is
    the adoration of the Holy Trinity, and of the Body and Blood of the Lord. &lt;…&gt;
    Further, </em><strong><em><mark>that before its use, immediately after the consecration,
    and after its use, what is reserved in the Sacred Pixes for the communion of those
    that are about to depart [i.e. the dying] is the true Body of the Lord, and not
    in the least different therefrom; so that before its use after the consecration,
    in its use, and after its use, it is in all respects the true Body of the Lord.</mark></em></strong><em>
    Further, we believe that by the word “transubstantiation” the manner is not explained,
    by which the bread and wine are changed into the Body and Blood of the Lord, –
    </em><strong><em>for that is altogether incomprehensible and impossible, except
    by God himself, and those who imagine to do so are involved in ignorance and impiety</em></strong><em>,
    – </em><strong><em>but <mark>the bread and the wine are after the consecration,
    not typically, nor figuratively, nor by superabundant grace, nor by the communication
    or the presence of the Divinity alone of the Only-begotten, transmuted into the
    Body and Blood of the Lord</mark>; neither is any accident of the bread, or of
    the wine, by any conversion or alteration, changed into any accident of the Body
    and Blood of Christ, but <mark>truly, and really, and substantially, doth the
    bread become the true Body itself of the Lord, and the wine the Blood itself of
    the Lord</mark>, as is said above.</em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Epistle
    of the Patriarchs of the Orthodox Church (1723), Decree 17</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
