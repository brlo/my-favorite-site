    parent: Sacraments of the Church/The sacrament of Baptism
    title: The requirements for one who wishes to receive baptism
    priority: 14
  body: '<h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><em>Christ,
    being the first-born of every creature, became again the chief of another race
    </em>regenerated by Himself through water, and faith,<em> and wood, containing
    </em>the mystery of the cross; even as Noah was saved by wood <em>when he rode
    over the waters with his household.</em></p><p><em>&lt;…&gt;</em></p><p><em>I
    mean, that </em><strong><em><mark>by water</mark>, <mark>faith</mark></em></strong><em>,
    and wood, those who are </em><strong><em><mark>afore-prepared</mark></em></strong><em><mark>
    </mark></em><strong><em><mark>and who repent of the sins which they have committed</mark></em></strong><em>,
    shall escape from the impending judgment of God.</em></p><p><em>&lt;…&gt;</em></p><p><em>hasten
    to know in what way </em>forgiveness of sins, and a hope of inheriting the promised
    good things, shall be yours. But there is no other [way] than this,—to <strong><mark>become
    acquainted with this Christ</mark></strong>, to be washed in the fountain (λουτρόν
    — “laver”) spoken of by Isaiah for the remission of sins; and for the rest, <strong><mark>to
    live sinless </mark><em><mark>lives</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>a)
    <strong>faith</strong> in the Lord Jesus Christ (Mark 16:15–16). “When they believed
    Philip as he preached the things concerning the kingdom of God and the name of
    Jesus Christ, they were baptized” (Acts 8:12; cf. Acts 8:36–38, 18:8, etc.).</p><p>b)
    <strong>Repentance</strong> (the answer of a good conscience toward God — 1 Pet.
    3:21): “Repent, and let every one of you be baptized in the name of Jesus Christ
    for the remission of sins” (Acts 2:38).</p></blockquote><p>(The Orthodox Church
    and the Sectarians, 1.2)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: oVKxfINL_Крещение_не_повторяется
  path: Baptism-is-not-repeated
  title: Baptism is not repeated
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: Baptism is not repeated
    priority: 15
  body: <h2>18th century</h2><h3>The Confession of the Orthodox Faith of the Eastern
    Church (1672, 1723)</h3><blockquote><p>Moreover, <strong>Baptism</strong> <strong>imparteth
    an indelible character</strong>, as doth also the Priesthood. For as it is impossible
    for any one to receive twice the same order of the Priesthood, so <strong><mark>it
    is impossible</mark></strong> for any once rightly baptised, <strong><mark>to
    be again baptised</mark></strong>, although he should fall even into myriads of
    sins, or even into actual apostasy from the Fatih. For when he is willing to return
    unto the Lord, <strong>he receiveth again through the Mystery of Penance the adoption
    of a son, which he had lost</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">Decree
    16</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“Baptism
    is a spiritual birth, and <strong>a man is born once, and therefore is baptized
    once</strong>” (Catech.). “One Lord, one faith, <strong>one baptism</strong>”
    (Eph. 4:5). “Baptism imparts an indelible character. For it is impossible for
    one who has once been rightly baptized to be baptized again, even if after this
    he should commit a thousand sins, or even fall away from the faith itself. The
    one who wishes to turn to the Lord receives the lost adoption through the sacrament
    of repentance” (Epistle of the Patriarchs on the Orthodox Faith, Decree 16).</p></blockquote><p>(The
    Orthodox Church and the Sectarians, 1.2)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: oQ5y40bg_Обряды_при_крещении_и_их_значение
  path: The-rites-at-baptism-and-their-meaning
  title: The rites at baptism and their meaning
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: The rites at baptism and their meaning
    priority: 16
  body: '<h2>4th century</h2><h3>Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p>4.
    After these things, ye were led to the holy pool[234] of Divine Baptism, as Christ
    was carried from the Cross to the Sepulchre which is before our eyes. And each
    of you was asked, whether he believed in the name of the Father, and of the Son,
    and of the Holy Ghost, <strong><mark>and ye made that saving confession, and descended
    three times into the water, and ascended again; here also hinting by a symbol
    at the three days burial of Christ[235]. For as our Saviour passed three days
    and three nights in the heart of the earth, so you also in your first ascent out
    of the water, represented the first day of Christ in the earth, and by your descent,
    the night; for as he who is in the night, no longer sees, but he who is in the
    day, remains in the light, so in the descent, as in the night, ye saw nothing,
    but in ascending again ye were as in the day. And at the self-same moment ye were
    both dying and being born; and that Water of salvation was at once your grave
    and your mother</mark></strong>. And what Solomon spoke of others will suit you
    also; for he said, in that case, There is a time to bear and a time to die (Eccl.
    3:2); but to you, in the reverse order, there was a time to die and a time to
    be born; and one and the same time effected both of these, and your birth went
    hand in hand with your death.</p><p>5. O strange and inconceivable thing! <strong><mark>we
    did not really die, we were not really buried, we were not really crucified and
    raised again; but our imitation was in a figure, and our salvation in reality.
    Christ was actually crucified, and actually buried, and truly rose again; and
    all these things He has freely bestowed upon us, that we, sharing His sufferings
    by imitation, might gain salvation in reality</mark></strong>. O surpassing loving-kindness!
    Christ received nails in His undefiled hands and feet, and suffered anguish; while
    on me without pain or toil by the fellowship of His suffering He freely bestows
    salvation.</p><p>6. <strong>Let no one then suppose that Baptism is merely the
    grace of remission of sins, or further, that of adoption; as John’s was a baptism[236]
    conferring only remission of sins: whereas we know full well, that as it purges
    our sins, and ministers[237] to us the gift of the Holy Ghost, so also it is the
    counterpart[238] of the sufferings of Christ.</strong> For this cause Paul just
    now cried aloud and said, Or are ye ignorant that all we who were baptized into
    Christ Jesus, were baptized into His death? We were buried therefore with Him
    by baptism into His death[239]. These words he spoke to some who were disposed
    to think that Baptism ministers to us the remission of sins, and adoption, but
    has not further the fellowship also, by representation, of Christ’s true sufferings.</p><p>7.
    In order therefore that we might learn, that whatsoever things Christ endured,
    for us and for our salvation[240] He suffered them in reality and not in appearance,
    and that we also are made partakers of His sufferings, Paul cried with all exactness
    of truth, For if we have been planted together with the likeness of His death,
    we shall be also with the likeness of His resurrection. Well has he said, planted
    together[241]. For since the true Vine was planted in this place, we also by partaking
    in the Baptism of death have been planted together with Him. And fix thy mind
    with much attention on the words of the Apostle. He said not, “For if we have
    been planted together with His death,” but, with the likeness of His death. <strong>For
    in Christ’s case there was death in reality, for His soul was really separated
    from His body, and real burial, for His holy body was wrapt in pure linen; and
    everything happened really to Him; but in your case there was only a likeness
    of death and sufferings, whereas <mark>of salvation there was not a likeness but
    a reality.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-3#HH-On-the-Mysteries-II--Of-Baptism">On
    the Mysteries, II</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter
    (1863–1955)</h3><blockquote><p>The one being baptized, besides <strong>the verbal
    renunciation of the devil</strong>, the author of sin (John 8:44; Eph. 2:2), and
    <strong>the breathing upon</strong> (as it were his expulsion), <strong>spits
    on him as a sign of contempt</strong> (cf. Num. 12:14; Deut. 25:9) and of the
    breaking off of communion with him.</p><p>As a soldier of Christ (1 Tim. 1:18;
    2 Tim. 2:3), obliged to wage battle with the devil (Eph. 6:11–12), the one being
    baptized, after the example of the ancient wrestlers who anointed their bodies
    with oil when struggling with an opponent, <strong>is anointed with consecrated
    oil</strong>. <strong>A white garment is placed upon the one reborn</strong> as
    a sign of the purity of the soul (cf. Rev. 7:9–14), washed from sins in baptism
    (cf. Isa. 61:10).</p><p>For a visible and constant reminder to the Christian of
    the commandment of Christ (Matt. 16:24) <strong>a cross is placed upon him</strong>.
    The one receiving baptism is enlightened with the knowledge of the true God; therefore,
    as a sign of spiritual enlightenment (Heb. 6:4) and of joy, <strong>a lit candle
    is given to the one coming forth from the font</strong>. <strong>The walking around
    the font</strong> testifies to eternity (the circle is a symbol of the eternity
    of the union of the one being baptized with Christ, of the immutability of the
    vows given at baptism. <strong>The tonsure</strong> is performed as a sign that
    the newly-enlightened is dedicated to God, like the Nazarites (Num. 6:18), and
    is obliged to do all things for the glory of God (1 Cor. 10:31).</p></blockquote><p>(The
    Orthodox Church and the Sectarians, 1.2)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: грехи-после-креения-нуждаются-в-уврачевании
  path: Sins-after-baptism
  title: A Christian may sin even after baptism, and those sins need healing
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: Sins after baptism need healing
    priority: 20
  body: <h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><em>Christ,
    being the first-born of every creature, became again the chief of another race
    </em><strong><em>regenerated by Himself through water, and faith</em></strong><em>,
    and wood, containing the </em><strong><em>mystery of the cross</em></strong><em>;
    even as Noah was saved by wood when he rode over the waters with his household.</em></p><p><em>&lt;…&gt;</em></p><p><em>I
    mean, that </em><strong><em>by water, faith</em></strong><em>, and wood, those
    who are afore-prepared, and who repent of the sins which they have committed,
    shall escape from the impending judgment of God.</em></p><p><em>&lt;…&gt;</em></p><p><em>hasten
    to know in what way forgiveness of sins, and a hope of inheriting the promised
    good things, shall be yours. But </em><strong><em><mark>there is no other [way]
    than this,—to become acquainted with this Christ, to be washed in the fountain
    (λουτρόν — “laver”) spoken of by Isaiah for the remission of sins</mark></em></strong><em>;
    and for the rest, </em><strong><em><mark>to live sinless lives</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr
    (c. 201–258)</h3><blockquote><p><strong>O blessed are you (the martyrs — note),
    whose <mark>sins are remitted, if only ever you sinned</mark> in imitating the
    Lord!</strong> Blessed are you who from the beginning of the world have been sealed
    with the blood of the Lord, clothed in the white garment of grace and adorned
    with the shining robe! I already behold in my mind the glorious, divine spectacle;
    I say, I already behold how the valiant host of Christ begins to enjoy its glory.
    A rejoicing multitude of victors shall stand before His face, and all this numerous
    host, illumined as if by the rising sun, shall receive power. O that I, unworthy,
    might be granted to behold all this in reality! However, the Lord can accomplish
    this, for He will likely not reject your intercession.</p></blockquote><p>(On
    the Praise of Martyrdom, to Moyses, Maxima and the other confessors)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: bYvT_Крещение_должно_быть_принято_при_жизни_в_теле
  path: Baptism-must-be-received-during-earthly-life
  title: Baptism must be received during life in the body
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: Baptism must be received during life in the body
    priority: 100
  body: '<h2>4th century</h2><h3><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century">St
    John Chrysostom, archbishop of Constantinople (c. 347–407)</a></h3><p>The words
    about the necessity of being born of water and the Spirit, and of partaking of
    the flesh and blood of Christ, were spoken for the living, and not for the dead:</p><blockquote><p><strong>“Otherwise,
    what will they do who are baptized for the dead, if the dead do not rise at all?
    Why then are they baptized for the dead?” (</strong><a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L29"><strong>1
    Cor. 15:29</strong></a><strong>)</strong></p><p>1. He takes in hand again another
    topic, establishing what he said at one time from what God doeth[39], and at another
    from the very things which they practice[40]. And this also is no small plea for
    the defence of any cause when a man brings forward the gainsayers themselves as
    witnessing by their own actions what he affirms. What then is that which he means?
    Or will ye that I should first mention how <strong>they who are infected with
    the Marcionite heresy pervert this expression? And I know indeed that I shall
    excite much laughter; nevertheless, even on this account most of all I will mention
    it that you may the more completely avoid this disease: viz., when any Catechumen
    departs among them, having concealed the living man under the couch of the dead,
    they approach the corpse and talk with him, and ask him if he wishes to receive
    baptism;</strong></p><p><strong>Then when he makes no answer, he that is concealed
    underneath saith in his stead that of course he should wish to be baptized; and
    so they baptize him instead of the departed</strong>, like men jesting upon the
    stage[41]. So great power hath the devil over the souls of careless sinners. Then
    being called to account, they allege this expression, saying that even the Apostle
    hath said, “<strong>They who are baptized for the dead</strong>” <strong>(</strong><a
    href="https://bibleox.com/en/eng-nkjv/1kor/15/#L29"><strong>1 Cor. 15:29</strong></a><strong>)</strong>.
    <strong>Seest thou their extreme ridiculousness? Is it meet then to answer these
    things? I trow not; unless it were necessary to discourse with madmen of what
    they in their frenzy utter.</strong></p><p><strong>But that none of the more exceedingly
    simple folk may be led captive, one must needs submit to answer even these men.
    As thus, if this was Paul’s meaning <mark>wherefore did God threaten him that
    is not baptized</mark>? For it is impossible that any should not be baptized henceforth,
    this being once devised: and besides, the fault no longer lies with the dead,
    but with the living</strong>. <strong><mark>But to whom spake he</mark></strong>:
    <em>“Unless ye eat </em><strong><em><mark>My flesh, and drink My blood</mark></em></strong><em>,
    ye have no life in yourselves?”</em> (John 6:53.) — <strong><mark>To the living,
    or to the dead, tell me?</mark> <mark>And again, </mark><em><mark>“Unless a man
    be born again of water and of the Spirit, he cannot see the kingdom of God.”</mark></em><mark>
    (John 3:5)</mark></strong><mark>.</mark><strong> For if this be permitted, and
    there be no need of the mind of the receiver nor of his assent while he <mark>lives</mark>,
    what hinders both Greeks and Jews thus to become believers, other men after their
    decease doing these things in their stead?</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-5#HH-Homily-XL">Homily
    40 on First Corinthians</a>)</p><h3>The Council of Carthage (393–419)</h3><blockquote><p>It
    seemed good that the Eucharist should not be given to the bodies of the dead.
    For it is written: <em>Take, eat</em> (Matt. 26:26), and the bodies of the dead
    can neither take nor eat. <strong>It seemed good also that the ignorance of presbyters
    should <mark>not baptize those already dead</mark></strong>.</p></blockquote><p>(Canon
    26)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: PAKJ0qG7_Понятие_о_таинстве_миропомазания
  path: The-concept-of-the-sacrament-of-Chrismation
  title: The concept of the sacrament of Chrismation
  menu:
    parent: Sacraments of the Church/The sacrament of Chrismation
    title: The concept of the sacrament of Chrismation
    priority: 1
  body: '<h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p><strong><em>It
    is also necessary that he should be anointed who is baptized;</em></strong><em>
    </em><strong><em><mark>so that, having received the chrism, that is, the anointing,
    he may be anointed of God, and have in him the grace of Christ</mark></em></strong><em>.
    </em>Further, it is the Eucharist whence the baptized are anointed with the oil
    sanctified on the altar. But he cannot sanctify the creature of oil, who has neither
    an altar nor a church; <em>whence also there can be no spiritual anointing among
    heretics, since it is manifest that the oil cannot be sanctified nor the Eucharist
    celebrated at all among them. But we ought to know and remember that it is written,
    “Let not the oil of a sinner anoint my head” (</em>Ps. 141:5).</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">Epistle
    69, to Januarius and other Numidian bishops, on baptizing heretics</a>)</p><h2>4th
    century</h2><h3>St Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p>1.
    Having been <i>baptized into Christ</i>, and <i>put on Christ (Gal. 3:27)</i>,
    ye have been made conformable to the Son of God; for God having <i>foreordained
    us unto adoption as sons (Eph. 1:5)</i>, made us <i>to be conformed to the body
    of Christ’s glory</i> (Phil. 3:21). Having therefore become <i>partakers of Christ</i>
    (Heb. 3:14), ye are properly called Christs, and of you God said, <i>Touch not
    My Christs</i> (Ps. 5:15), or anointed. Now <strong>ye have been made Christs,
    by receiving the antitype of the Holy Ghost; and all things have been wrought
    in you by imitation, because ye are images of Christ. He washed in the river Jordan,
    and having imparted of the fragrance of His Godhead to the waters, He came up
    from them; and the Holy Ghost in the fulness of His being lighted on Him, like
    resting upon like. <mark>And to you in like manner, after you had come up from
    the pool of the sacred streams, there was given an Unction, the anti-type of that
    wherewith Christ was anointed; and this is the Holy Ghost; of whom also the blessed
    Esaias, in his prophecy respecting Him, said in the person of the Lord, <i>The
    Spirit of the Lord is upon Me, because He hath anointed Me: He hath sent Me to
    preach glad tidings to the poor</i> (Isa. 61:1).</mark></strong></p><p>2. For
    Christ was not anointed by men with oil or material ointment, but the Father having
    before appointed Him to be the Saviour of the whole world, anointed Him with the
    Holy Ghost, as Peter says, <i>Jesus of Nazareth, whom God anointed with the Holy
    Ghost</i> (Acts 10:38). David also the Prophet cried, saying, <i>Thy throne, O
    God, is for ever and ever; a sceptre of righteousness is the sceptre of Thy kingdom;
    Thou hast loved righteousness and hated iniquity; therefore God even Thy God hath
    anointed Thee with the oil of gladness above Thy fellows</i> (Ps. 45:6–7). <strong>And
    as Christ was in reality crucified, and buried, and raised, and you are in Baptism
    accounted worthy of being crucified, buried, and raised together with Him in a
    likeness, so is it with the unction also. As He was anointed with an ideal oil
    of gladness, that is, with the Holy Ghost, called oil of gladness, because He
    is the author of spiritual gladness, so ye were anointed with ointment, having
    been made partakers and <i>fellows of Christ</i>.</strong></p><p>3. But beware
    of supposing this to be plain ointment. For as the Bread of the Eucharist, after
    the invocation of the Holy Ghost, is mere bread no longer, but the Body of Christ,
    <strong><mark>so also this holy ointment is no more simple ointment, nor (so to
    say) common, after invocation, but it is Christ’s gift of grace, and, by the advent
    of the Holy Ghost, is made fit to impart His Divine Nature. Which ointment is
    symbolically applied to thy forehead and thy other senses; and while thy body
    is anointed with the visible ointment, thy soul is sanctified by the Holy and
    life-giving Spirit.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-3#HH-On-the-Mysteries-III--On-Chrism">On
    the Mysteries, III, 1–3</a>)</p><h2>20th century</h2><h3>St Seraphim (Sobolev),
    archbishop (1881–1950)</h3><blockquote><p>Grace, as a divine energy or power,
    cannot be divided into small or large parts. Grace is always one and the same;
    only its actions are different. In the Sacrament of Baptism it destroys original
    sin and all our personal sins; in the Sacrament of the Eucharist it transubstantiates
    the bread and wine into the Body and Blood of Christ; <strong><mark>in Chrismation
    it communicates to us in all fullness and perfection all the gifts of the Holy
    Spirit</mark></strong>, and so on. Therefore all seven Sacraments are equally
    divine and necessary for salvation.</p></blockquote><p>(On the Question of the
    Union of the Anglican Church with the Orthodox Church)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: v1HE7UG4_Необходимость_таинства_миропомазания
