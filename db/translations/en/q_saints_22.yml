- src: TxWsAeih_Совершители_таинства_крещения_и_других_таинств
  path: The-ministers-of-the-sacrament-of-baptism
  title: The ministers of the sacrament of baptism (and other sacraments)
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: The ministers of the sacrament of baptism (and other sacraments)
    priority: 9
  body: '<h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p>It
    is required, then, that the water should first be cleansed and sanctified by the
    priest, that it may wash away by its baptism the sins of the man who is baptized;
    because the Lord says by Ezekiel the prophet: “Then will I sprinkle clean water
    upon you, and ye shall be cleansed from all your filthiness; and from all your
    idols will I cleanse you: a new heart also will I give you, and a new spirit will
    I put within you.” (Ezek. 36:25–26) <strong><mark>But how can he cleanse and sanctify
    the water who is himself unclean, and in whom the Holy Spirit is not?</mark></strong>
    since the Lord says in the book of Numbers, “And whatsoever the unclean person
    toucheth shall be unclean.” (Num. 19:22) Or <strong><mark>how can he who baptizes
    give to another remission of sins who himself, being outside the Church, cannot
    put away his own sins?</mark></strong> But, moreover, the very interrogation which
    is put in baptism is a witness of the truth. For when we say, “Dost thou believe
    in eternal life and remission of sins through the holy Church?” we mean that remission
    of sins is not granted except in the Church, and that among heretics, where there
    is no Church, sins cannot be put away. Therefore <strong>they who assert that
    heretics can baptize, must either change the interrogation or maintain the truth</strong>,
    unless indeed they attribute a church also to those who, they contend, have baptism.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">Epistle
    LXIX: To Januarius and Other Numidian Bishops, on Baptizing Heretics</a>)</p><h2>4th
    century</h2><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>The
    well-being of a Church depends upon the dignity of its chief-priest, and unless
    some extraordinary and unique functions be assigned to him, we shall have as many
    schisms in the Churches as there are priests. Hence it is that <strong><mark>without
    ordination and the bishop’s license neither presbyter nor deacon has the power
    to baptize</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians">The
    Dialogue Against the Luciferians</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p><strong><mark>The Lord gave the
    command to perform baptism to the Apostles and to their lawful successors, i.e.
    the pastors of the Church (bishops and presbyters)</mark></strong>, who through
    continuous succession go back to the Apostles (whereby it is proved that they
    are the lawful heirs of the hierarchical authority of the Apostles). At the same
    time attention must be paid to the fact that, although the command and <strong>authority
    to perform the sacrament of baptism the Apostles received from the Lord before
    His ascension, they proceeded to perform the sacrament only on the day of Pentecost</strong>,
    when there followed their setting apart for the ministry of the Church by the
    action of the Holy Spirit (Acts 2:1-4, 38-41). <strong>“The water”, writes St
    Cyprian of Carthage, “must first be cleansed <mark>by the priest</mark></strong>,
    that it may wash away by its baptism the sins of the man who is baptized&lt;…&gt;
    <strong>But how can he cleanse and sanctify the water who is himself unclean,
    and in whom the Holy Spirit is not</strong>, and to whom the following words of
    the Lord apply: ‘<em>and whatsoever the unclean person toucheth shall be unclean</em>&lt;…&gt;?’
    (Num. 19:22). <strong>Who can give what he himself has not? Or how can he discharge
    spiritual functions who himself has lost the Holy Spirit?</strong>”</p></blockquote><p>(The
    Orthodox Church and the Sectarians, 1.2)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
