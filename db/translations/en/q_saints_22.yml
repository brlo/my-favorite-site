- src: ILXs9jf1_Миропомазание_есть_особое_отдельное_от_крещения_таинство
  path: Chrismation-is-a-sacrament-distinct-from-baptism
  title: Chrismation is a sacrament distinct from baptism
  menu:
    parent: Sacraments of the Church/The sacrament of Chrismation
    title: Chrismation is a sacrament distinct from baptism
    priority: 4
  body: <h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p><strong><em><mark>It
    is also necessary that he should be anointed who is baptized;</mark> so that,
    having received the chrism, that is, the anointing, he may be anointed of God,
    and have in him the grace of Christ</em></strong><em>. </em>Further, it is the
    Eucharist whence the baptized are anointed with the oil sanctified on the altar.
    But he cannot sanctify the creature of oil, who has neither an altar nor a church;
    <em>whence also there can be no spiritual anointing among heretics, since it is
    manifest that the oil cannot be sanctified nor the Eucharist celebrated at all
    among them. But we ought to know and remember that it is written, “Let not the
    oil of a sinner anoint my head” (</em>Ps. 141:5).</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">Epistle
    69, to Januarius and other Numidian bishops, on baptizing heretics</a>)</p>
