- src: GfsgNRij_Вещество_таинства_крещения__вода
  path: Water-the-substance-of-baptism
  title: Water — the substance of the sacrament of baptism
  meta_desc: Quotes on water baptism
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: The substance of the sacrament of baptism — water
    priority: 10
  body: '<h2>1st century</h2><h3>The Teaching of the Twelve Apostles (the “Didache”)</h3><blockquote><p>1.
    And concerning baptism, baptize this way: Having first said all these things,
    baptize into the name of the Father, and of the Son, and of the Holy Spirit<strong>
    </strong>in living <strong>water</strong>.</p><p>2. But if you have no living
    water, baptize into other <strong>water</strong>; and if you cannot do so in cold
    water, do so in warm.</p><p>3. But if you have neither, pour out water three times
    upon the head into the name of Father and Son and Holy Spirit.</p><p>4. But before
    the baptism let the baptizer fast, and the baptized, and whoever else can; but
    you shall order the baptized to fast one or two days before.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Didache#HH-7">The Didache, chapter 7</a>)</p><h2>2nd
    century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><p>There is
    no other way to the forgiveness of sins except the washing in Baptism for the
    remission of sins:</p><blockquote><p><em>For Christ, being the first-born of every
    creature, became again the chief of another race regenerated by Himself </em><strong><em><mark>through
    water</mark>, and faith</em></strong><em>, and wood, containing </em><strong><em>the
    mystery of the cross</em></strong><em>; even as Noah was saved by wood when he
    rode over the waters with his household.</em></p><p><em>&lt;…&gt;</em></p><p><em>I
    mean, that </em><strong><em><mark>by water</mark>, faith</em></strong><em>, and
    wood, those who are </em><strong><em>afore-prepared</em></strong><em> </em><strong><em>and
    who repent of the sins which they have committed</em></strong><em>, shall escape
    from the impending judgment of God.</em></p><p><em>&lt;…&gt;</em></p><p><em>So
    that it becomes you to eradicate this hope from your souls, and hasten to know
    </em><strong><em><mark>in what way forgiveness of sins</mark></em></strong><em>,
    and a hope of inheriting the promised good things, shall be yours. But </em><strong><em><mark>there
    is no other [way]</mark> than this,--to become acquainted with this Christ, <mark>to
    be washed in the fountain spoken of by Isaiah for the remission of sins</mark></em></strong><em>;
    and for the rest, </em><strong><em><mark>to live sinless lives</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-138">Dialogue
    with Trypho</a>)</p><blockquote><p><em>As many as are persuaded and believe that
    what we teach and say is true, and undertake to be able to live accordingly, are
    instructed to pray and to entreat God with fasting, for the remission of their
    sins that are past, we praying and fasting with them. Then </em><strong><em>they
    are brought by us <mark>where there is water</mark>, and are regenerated in the
    same manner in which we were ourselves regenerated. For, in the name of God, the
    Father and Lord of the universe, and of our Saviour Jesus Christ, and of the Holy
    Spirit, they then <mark>receive the washing with water</mark></em></strong><em>.
    For Christ also said, “Except ye be born again, ye shall not enter into the kingdom
    of heaven.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-61">Apology
    1</a>)</p><blockquote><p><strong><em>and may obtain <mark>in the water</mark>
    the remission of sins formerly committed, there is pronounced over him who chooses
    to be born again, and has repented of his sins, the name of God the Father and
    Lord of the universe</em></strong><em>; he who leads to the layer the person that
    is to be washed calling him by this name alone. For no one can utter the name
    of the ineffable God; and if any one dare to say that there is a name, he raves
    with a hopeless madness... And </em><strong><em>this washing is called illumination</em></strong><em>,
    because they who learn these things are illuminated in their understandings. And
    in the name of Jesus Christ, who was crucified under Pontius Pilate, and in the
    name of the Holy Ghost, who through the prophets foretold all things about Jesus,
    </em><strong><em>he who is illuminated is washed</em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-61">Apology
    1</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>“we
    who, being leprous in our sins, <strong>are purified through <mark>holy water</mark>
    and the invocation of the Lord</strong> (διὰ τοῦ <strong>ἁγίου ὕδατος</strong>
    καὶ τῆς τοῦ Κυρίου ἐπικλήσεως), cleansed of our former transgressions, reborn
    spiritually as newborn babes, just as the Lord said: Unless one is born of water
    and the Spirit, he cannot enter the kingdom of heaven.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/8yk4_Fragments#HH-33">Fragments of lost works,
    33</a>)</p><h3>Tertullian (c. 155–220)</h3><blockquote><p>The Spirit of God, who
    hovered over (the waters) from the beginning, would continue to linger over the
    waters of the baptized. But a holy thing, of course, hovered over a holy; or else,
    <strong><mark>from that which hovered over that which was hovered over borrowed
    a holiness, since it is necessary that in every case an underlying material substance
    should catch the quality of that which overhangs it</mark></strong>, most of all
    <strong>a corporeal of a spiritual</strong>, adapted (as the spiritual is) through
    the subtleness of its substance, <strong>both for penetrating and insinuating</strong>.
    Thus <strong><mark>the nature of the waters, sanctified by the Holy One, itself
    conceived withal the power of sanctifying</mark></strong>. Let no one say, “Why
    then, are we, pray, baptized with the very waters which then existed in the first
    beginning?” Not with those waters, of course, except in so far as the genus indeed
    is one, but the species very many. But what is an attribute to the genus reappears
    likewise in the species. And accordingly it makes no difference whether a man
    be washed in a sea or a pool, a stream or a fount, a lake or a trough; nor is
    there any distinction between those whom John baptized in the Jordan and those
    whom Peter baptized in the Tiber, unless withal the eunuch whom Philip baptized
    in the midst of his journeys with chance water, derived (therefrom) more or less
    of salvation than others. All waters, therefore, in virtue of the pristine privilege
    of their origin, do, after invocation of God, attain the sacramental power of
    sanctification; for the Spirit immediately supervenes from the heavens, and rests
    over the waters, sanctifying them from Himself; and being thus sanctified, <strong><mark>they
    imbibe at the same time the power of sanctifying</mark></strong>.</p><p>Albeit
    the similitude may be admitted to be suitable to the simple act; that, since <strong>we
    are defiled by sins, as it were by dirt, we should be washed from those stains
    in waters</strong>. But as sins do not show themselves in our flesh (inasmuch
    as no one carries on his skin the spot of idolatry, or fornication, or fraud),
    so persons of that kind are foul in the spirit, which is the author of the sin;
    for the spirit is lord, the flesh servant. Yet they each mutually share the guilt:
    the spirit, on the ground of command; the flesh, of subservience. Therefore, after
    the waters have been in a manner endued with medicinal virtue through the intervention
    of the angel, <strong>the spirit is corporeally washed in the waters, and the
    flesh is in the same spiritually cleansed</strong>.</p><p><strong><mark>“Well,
    but the nations, who are strangers to all understanding of spiritual powers, ascribe
    to their idols the imbuing of waters with the self-same efficacy.” (So they do)
    but they cheat themselves with waters which are widowed</mark></strong>.</p><p>&lt;…&gt;</p><p>Therefore,
    if the mere nature of water, in that it is the appropriate material for washing
    away, leads men to flatter themselves with a belief in omens of purification,
    how much more truly will <strong>waters render that service through the authority
    of God, by whom all their nature has been constituted</strong>! If men think that
    <strong>water is endued with a medicinal virtue by religion, what religion is
    more effectual than that of the living God?</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-on-baptism#HH-The-Primeval-Hovering-of-the-Spirit-of-God-Over-the-Waters-Typical-of-Baptism-The-Universal-Element-of-Water-Thus-Made-a-Channel-of-Sanctification-Resemblance-Between-the-Outward-Sign-and-the-Inward-Grace">On
    Baptism</a>)</p><h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c.
    201–258)</h3><blockquote><p>And again, sacred Scripture warns, and says, “Keep
    thee from the strange water, and drink not from a fountain of strange water” (Prov.
    9:18). It is required, then, that <strong><mark>the water should first be cleansed
    and sanctified by the priest</mark>, that it may wash away by its baptism the
    sins of the man who is baptized</strong>. &lt;…&gt; But how can he <strong><mark>cleanse
    and sanctify the water</mark></strong> who is himself unclean — and in whom the
    Holy Spirit is not? since the Lord says in the book of Numbers, “And whatsoever
    the unclean person toucheth shall be unclean” (Num. 19:22). Or how can he who
    baptizes give to another remission of sins who himself, being outside the Church,
    cannot put away his own sins?</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">To
    Januarius and the other Numidian bishops, on baptizing heretics</a>)</p><blockquote><p>set
    down only those things which God speaks, wherewith Christ exhorts His servants
    to martyrdom. Those divine precepts themselves must be supplied, as it were, for
    arms for the combatants. Let them be the incitements of the warlike trumpet; let
    them be the clarion-blast for the warriors. Let the ears be roused by them; let
    the minds be prepared by them; let the powers both of soul and body be strengthened
    to all endurance of suffering. <strong>Let us only who, by the Lord’s permission,
    have given the <mark>first baptism</mark> (of water — tr.) to believers</strong>,
    also prepare each one for the second (of martyrdom — tr.); urging and teaching
    that this is a baptism greater in grace, more lofty in power, more precious in
    honour—a baptism wherein angels baptize—a baptism in which God and His Christ
    exult—a baptism after which no one sins any more—a baptism which completes the
    increase of our faith—a baptism which, as we withdraw from the world, immediately
    associates us with God. <strong><mark>In the baptism of water is received the
    remission of sins</mark>, in the baptism of blood the crown of virtues</strong>.
    This thing is to be embraced and desired, and to be asked for in all the entreaties
    of our petitions, that we who are God’s servants should be also His friends.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-exhortation-to-martyrdom-addressed-to-fortunatus#HH-Preface">Exhortation
    to Martyrdom, Addressed to Fortunatus</a>)</p><h2>4th century</h2><h3>Cyril of
    Jerusalem, bishop (315–386)</h3><blockquote><p><strong>Regard not the Laver <mark>as
    simple water, but rather regard the spiritual grace that is given with the water</mark></strong>.
    For just as the offerings brought to the heathen altars, though simple in their
    nature, become defiled by the invocation of the idols, so contrariwise <strong><mark>the
    simple water having received the invocation of the Holy Ghost, and of Christ,
    and of the Father, acquires a new power of holiness</mark></strong>. For since
    man is of twofold nature, soul and body, the purification also is twofold, the
    one incorporeal for the incorporeal part, and the other bodily for the body: the
    water cleanses the body, and the Spirit seals the soul; that we may draw near
    unto God, having our heart sprinkled by the Spirit, and our body washed with pure
    water (Heb. 10:22). When going down, therefore, into the water, <strong><mark>think
    not of the bare element, but look for salvation by the power of the Holy Ghost</mark></strong>:
    for without both thou canst not possibly be made perfect. It is not I that say
    this, but the Lord Jesus Christ, who has the power in this matter: for He saith,
    Except a man be born anew (and He adds the words) of water and of the Spirit,
    he cannot enter into the kingdom of God (John 3:3). <strong>Neither doth he that
    is baptized with water, but not found worthy of the Spirit, receive the grace
    in perfection; nor if a man be virtuous in his deeds, but receive not <mark>the
    seal by water</mark>, shall he enter into the kingdom of heaven</strong>. A bold
    saying, but not mine, for it is Jesus who hath declared it: and here is the proof
    of the statement from Holy Scripture…</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1#HH-On-Baptism">Catechetical
    Lectures, Lecture 3</a>)</p><h3>Ambrose of Milan, bishop<strong> </strong>(c.
    339–397)</h3><blockquote><p>Therefore read that <strong><mark>the three</mark></strong>
    witnesses in baptism, <strong><mark>the water, the blood, and the Spirit,</mark></strong>
    (1 John 5:8) are one. For <strong><mark>if you take away one of these, the Sacrament
    of Baptism does not exist</mark></strong>. For what is water without the cross
    of Christ? A common element, without any sacramental effect. Nor, again, <strong><mark>is
    there the Sacrament of Regeneration without water</mark></strong>: “For except
    a man be born again of water and of the Spirit, he cannot enter into the kingdom
    of God” (cf. John 3:5). Now, even the catechumen believes in the cross of the
    Lord Jesus, wherewith he too is signed; but unless he be baptized in the Name
    of the Father, and of the Son, and of the Holy Spirit, he cannot receive remission
    of sins nor gain the gift of spiritual grace.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ambrose-on-the-mysteries#HH-4-That-water-does-not-cleanse-without-the-Spirit-is-shown-by-the-witness-of-John-and-by-the-very-form-of-the-administration-of-the-sacrament-And-this-is-also-declared-to-be-signified-by-the-pool-in-the-Gospel-and-the-man-who-was-there-healed-In-the-same-passage-too-is-shown-that-the-Holy-Spirit-truly-descended-on-Christ-at-His-baptism-and-the-meaning-of-this-mystery-is-explained">On
    the Mysteries</a>)</p><blockquote><p>What does this mean? You saw the water, but
    <strong><mark>not every water heals — only that water heals which has the grace
    of Christ</mark></strong>. The substance (elementum) and the consecration (consecratio)
    are not one and the same thing; the ordinary action (opus) and the divine operation
    (operatio) are different things. <strong><mark>To the water belongs the action
    (opus), but the operation (operatio) — to the Holy Spirit. The water does not
    heal unless the Holy Spirit comes down — and does not sanctify the water</mark></strong>.</p></blockquote><p>(The
    Sacraments)</p><h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p>It
    is not (possible), He says, for one not born of water and the Spirit, to enter
    into the Kingdom of heaven; because he wears the raiment of death, of cursing,
    of perdition, he has not yet received his Lord’s token, he is a stranger and an
    alien, he has not the royal watchword. “Except, He says, a man be born of water
    and of the Spirit, he cannot enter into the Kingdom of heaven.”</p><p>…</p><p>I
    formed (man) of earth and water; but that which was formed was unprofitable, the
    vessel was wrenched awry; <strong>I will no more form them of earth and water,
    but ‘of water’ and ‘of the Spirit.’ And if any one asks, How of water? I also
    will ask, How of earth?</strong> How was the clay separated into different parts?</p><p>…</p><p>For
    as the earth, which is soulless and motionless, was empowered by the will of God,
    and such wonders were worked in it; much more <strong><mark>when the Spirit is
    present with the water, do all those things so strange and transcending reason,
    easily take place</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/sYTb_Homilies_on_the_Gospel_of_John_2039#HH-25">Homilies
    on the Gospel of John, Homily 25</a>) (on John 3:5: “Jesus answered: verily, verily,
    I say unto thee, if a man be not born of water and of the Spirit, he cannot enter
    into the Kingdom of God”)</p><h2>19th century</h2><h3>St Theophan the Recluse,
    bishop (1815–1894)</h3><blockquote><p><strong>He who comes out of the font of
    baptism is both justified and righteous</strong>, — every guilt of sin is taken
    away from him, and he desires only the good that is pleasing to God and is able
    to do it. This is the putting on of Christ, in which what is needed for salvation
    passes from the Lord Christ to the believer and the one being baptized, and is
    made his not nominally but essentially. While he only believes in Christ, these
    needs of his exist, but only nominally, as appointed to him and made ready for
    him; <strong>but in the font of baptism</strong> they essentially become his own
    property. Here he is like a graft grafted onto a tree and drawing its life-giving
    sap into itself. The tree is the Lord. The sap of this tree is the oath-taking
    and justifying power of the death on the cross, and the renewed human life manifested
    in perfection.<strong> </strong>Both of these <strong>the graft — the new believer
    — receives into itself and draws in, in baptism</strong>. <strong><mark>And this
    is accomplished not by water alone, but by the Holy Spirit through the water,
    having first prepared the one being baptized by repentance and faith to receive
    both.</mark></strong> For this reason the Lord Jesus Christ, having endured the
    death of the cross and risen, ascended into heaven and sent down to us on earth
    from the Father the Holy Spirit, that He might endow all with those blessings
    and needs of salvation which are contained for us in the person of the Lord. For
    this reason He said: “It is better for you” that I go to the Father; for if I
    do not go, “the Comforter will not come to you” (John 16:7).</p></blockquote><p>(Selected
    Letters on Sects and Heresies, Letter 24)</p>'
