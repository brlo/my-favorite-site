# Переводы статей раздела «Цитаты» (ru/q) на английский: раздел «Бог», часть 1.
# Загрузка: bin/rails pages:import_translations FILE=db/translations/en/q_god_1.yml [PUBLISH=1] [DRY_RUN=1]
lang: en
list: en-q
pages:
  - src: Иисус_Христос-единственный-спаситель-человечества
    path: Tg3v_Jesus_Christ_the_Savior
    title: Jesus Christ — the Savior
    meta_desc: Bible quotes showing that Jesus Christ is the Savior of all, that all are called to Christ, but not all are saved
    menu: { parent: God/Son, title: Christ — the Savior, priority: 3 }
    body: |-
      <p>This article shows not only that Jesus Christ is the Savior, but also what kind of Savior He is: that He is the Savior of all. All are called to Christ, but not all are saved.</p><h2>The Pagan Gods Are Not Gods</h2><p>There is no other God:</p><blockquote><p>“Therefore concerning the eating of things offered to idols, we know that an idol is nothing in the world, and that <strong>there is no other God but one</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/8/#L4">1 Cor. 8:4</a>)</p></blockquote><p>Those whom the pagans served before are not gods:</p><blockquote><p>“But then, indeed, when you did not know God, you served those which by nature <strong>are not gods</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L8">Gal. 4:8</a>)</p></blockquote><p>False gods:</p><blockquote><p>“Men, why are you doing these things? We also are men with the same nature as you, and preach to you that you should <strong>turn from these useless things to the living God</strong>, who made the heaven, the earth, the sea, and all things that are in them” (<a href="https://bibleox.com/en/eng-nkjv/act/14/#L15">Act. 14:15</a>)</p></blockquote><p>In the past all nations walked not in God’s ways, but in their own:</p><blockquote><p>“who [God] in bygone generations <strong>allowed all nations to walk in their own ways</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/14/#L16">Act. 14:16</a>)</p></blockquote><p>Many more quotes like these: <a href="https://bibleox.com/en/en/w/Mrqu_God_is_one/">https://bibleox.com/en/en/w/Mrqu_God_is_one</a></p><h2>Rejecting Christ Is Rejecting God</h2><blockquote><p>“<strong>he who rejects Me rejects Him who sent Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L16">Luke. 10:16</a>)</p></blockquote><blockquote><p>“<strong>He who hates Me hates My Father also</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L23">John. 15:23</a>)</p></blockquote><blockquote><p>“<strong>Whoever denies the Son does not have the Father either</strong>; he who acknowledges the Son has the Father also” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L23">1 John. 2:23</a>)</p></blockquote><blockquote><p>“Whoever <strong>transgresses</strong> and <strong>does not abide in the doctrine of Christ does not have God</strong>. He who abides in the doctrine of Christ has both the Father and the Son” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9">2 John. 1:9</a>)</p></blockquote><blockquote><p>“He who believes in the Son has everlasting life; and <strong>he who does not believe the Son shall not see life, but the wrath of God abides on him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L36">John. 3:36</a>)</p></blockquote><h2>Without Faith in Christ It Is Impossible to Be Saved</h2><blockquote><p>“<strong>by the name of Jesus Christ</strong> of Nazareth, whom you crucified, whom God raised from the dead, by Him this man stands here before you whole. This is the ‘stone which was rejected by you builders, which has become the chief cornerstone.’ <strong>Nor is there salvation in any other</strong>, for <strong>there is no other name under heaven given among men by which we must be saved</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L10-12">Act. 4:10-12</a>)</p></blockquote><blockquote><p>“But <strong>without faith it is impossible to please Him</strong>, for he who comes to God must believe that He is, and that He is a rewarder of those who diligently seek Him” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L6">Heb. 11:6</a>)</p></blockquote><h2>Heresy and Separation from the Church Deprive One of Salvation</h2><p>Those who invent heresies will not inherit the Kingdom of God:</p><blockquote><p>“Now the works of the flesh are evident, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, contentions, jealousies, outbursts of wrath, selfish ambitions, <strong>dissensions</strong>*, <strong>heresies</strong>, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that those who practice such things <strong>will not inherit the kingdom of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p><p><strong><em>*dissensions (διχοστασίαι) — division, splitting apart; heresies (αἱρέσεις).</em></strong></p></blockquote><p>Those who create divisions in the Church do not serve the Lord Jesus Christ:</p><blockquote><p>“Now I urge you, brethren, <strong>note those who cause divisions and offenses</strong>, contrary to the doctrine which you learned, and avoid them. For <strong>those who are such do not serve our Lord Jesus Christ</strong>, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18">Rom. 16:17-18</a>)</p></blockquote><blockquote><p>“how they [the apostles] told you that there would be mockers in the last time who would walk according to their own ungodly lusts. These are sensual persons, <strong>who cause divisions</strong> <em>(Greek: ἀποδιορίζοντες — “those who separate”, i.e. who separate themselves from the unity of the faith)</em>, not having the Spirit” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L18-19">Jude. 1:18-19</a>)</p></blockquote><p>The Church is the body of Christ, and Christ is the Savior of the body:</p><blockquote><p>“And <strong>the Lord added to the church</strong> daily <strong>those who were being saved</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L47">Act. 2:47</a>)</p></blockquote><blockquote><p>“<strong>His body</strong>, which is <strong>the church</strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L24">Col. 1:24</a>)</p></blockquote><blockquote><p>“Christ is head of the church; and He is <strong>the Savior of the body</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L23">Eph. 5:23</a>)</p></blockquote><h2>All Are Subject to Judgment</h2><blockquote><p>“For <strong>we must all appear before the judgment seat of Christ</strong>, that each one may receive the things done in the body, according to what he <strong>has done</strong>, <strong>whether good or bad</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><blockquote><p>“For <strong>God will bring every work into judgment</strong>, including every secret thing, <strong>whether good or evil</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ekl/12/#L14">Eccl. 12:14</a>)</p></blockquote><h3>Judgment Will Begin with the Church</h3><blockquote><p>“For <strong>the time has come for judgment to begin at the house of God</strong>; and if <strong>it begins with us first</strong>, what will be the end of those who do not obey the gospel of God? Now ‘If <strong>the righteous one is scarcely saved</strong>, where will the ungodly and the sinner appear?’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18">1 Pet. 4:17-18</a>)</p></blockquote><h3>We All Sin Much</h3><blockquote><p>“For <strong>we all stumble in many things</strong>. If anyone does not stumble in word, he is a perfect man, able also to bridle the whole body” (<a href="https://bibleox.com/en/eng-nkjv/iak/3/#L2">James. 3:2</a>)</p></blockquote><blockquote><p>“<strong>If we say that we have no sin, we deceive ourselves</strong>, and the truth is not in us. If we say that we have not sinned, we make Him a liar, and His word is not in us” (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L8,10">1 John. 1:8,10</a>)</p></blockquote><h3>Many Will Be Surprised When They Are Not Saved</h3><p>They thought they were saved:</p><blockquote><p>“<strong>Many</strong> will say to Me in that day, ‘Lord, Lord, have we not <strong>prophesied</strong> in Your name, <strong>cast out demons</strong> in Your name, and <strong>done many wonders</strong> in Your name?’ And then I will declare to them, ‘<strong>I never knew you; depart from Me</strong>, you who practice lawlessness!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><h2>Many Will Not Be Saved</h2><h3>Not All Will Be Saved</h3><blockquote><p>“Strive to enter through the narrow gate, for <strong>many</strong>, I say to you, will seek to enter and <strong>will not be able</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/13/#L24">Luke. 13:24</a>)</p></blockquote><blockquote><p>“Enter by the narrow gate; for <strong>wide is the gate</strong> and broad is the way <strong>that leads to destruction, and there are many who go in by it</strong>. Because <strong>narrow is the gate</strong> and difficult is the way <strong>which leads to life, and there are few who find it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L13-14">Matt. 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>Not everyone who says to Me, ‘Lord, Lord,’ shall enter the kingdom of heaven</strong>, but he who does the will of My Father in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L21">Matt. 7:21</a>)</p></blockquote><blockquote><p>“For just as the farmer sows many seeds in the ground and plants a multitude of seedlings, and yet not all that have been sown will come up in due season, and not all that were planted will take root; so also those who have been sown in the world <strong>will not all be saved</strong>” (<a href="https://bibleox.com/en/en-nrsv/3ezd/8/#L41">2 Esd. 8:41</a>)</p></blockquote><h3>Those Who Are Saved Are Few</h3><blockquote><p>“Then one said to Him, ‘Lord, <strong>are there few who are saved?</strong>’ And He said to them, ‘Strive to enter through the narrow gate, for <strong>many, I say to you, will seek to enter and will not be able</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/13/#L23-24">Luke. 13:23-24</a>)</p></blockquote><blockquote><p>“Enter by the narrow gate; for <strong>wide is the gate</strong> and broad is the way <strong>that leads to destruction, and there are many who go in by it</strong>. Because <strong>narrow is the gate</strong> and difficult is the way <strong>which leads to life, and there are few who find it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L13-14">Matt. 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>Many</strong> will say to Me in that day, ‘Lord, Lord, have we not prophesied in Your name, cast out demons in Your name, and done many wonders in Your name?’ And then I will declare to them, ‘<strong>I never knew you; depart from Me, you who practice lawlessness!</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><blockquote><p>“Do not fear, <strong>little flock</strong>, for it is your Father’s good pleasure to give you the kingdom” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L32">Luke. 12:32</a>)</p></blockquote><blockquote><p>“He who is unjust, let him be unjust still; he who is filthy, let him be filthy still; he who is righteous, let him be righteous still; <strong>he who is holy, let him be holy still</strong>. And behold, I am coming quickly, and My reward is with Me, <strong>to give to every one according to his work</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L11-12">Rev. 22:11-12</a>)</p></blockquote>

  - src: Христос-жертва
    path: Ns8q_Christ_the_Sacrifice
    title: Christ — the Sacrifice
    meta_desc: Bible quotes about the sacrifice of Christ
    menu: { parent: God/Son, title: Christ — the Sacrifice, priority: 5 }
    body: |-
      <h2>The Son of God Was Destined to Be Sacrificed Even Before the Creation of the World</h2><blockquote><p>“Christ, as of a lamb without blemish and without spot. He indeed was <strong>foreordained before the foundation of the world</strong>, but was manifest in these last times for you” (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L19-20">1 Pet. 1:19-20</a>)</p></blockquote><h2>The Blessing of Abraham</h2><blockquote><p>“Christ has redeemed us from the curse of the law, having become a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), <strong>that the blessing of Abraham might come upon the Gentiles in Christ Jesus</strong>, that we might receive the promise of the Spirit through faith” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L13-14">Gal. 3:13-14</a>)</p></blockquote><h2>Redemption</h2><blockquote><p>“knowing that <strong>you were</strong> not <strong>redeemed</strong> with corruptible things, like silver or gold, from your aimless conduct received by tradition from your fathers, but with the precious <strong>blood of Christ, as of a lamb without blemish and without spot</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L18-19">1 Pet. 1:18-19</a>)</p></blockquote><blockquote><p>“<strong>Christ has redeemed us from the curse of the law</strong>, having become a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’)” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L13">Gal. 3:13</a>)</p></blockquote><blockquote><p>“so <strong>Christ was offered once to bear the sins of many</strong>. To those who eagerly wait for Him He will appear a second time, apart from sin, for salvation” (<a href="https://bibleox.com/en/eng-nkjv/evr/9/#L28">Heb. 9:28</a>)</p></blockquote><h2>Reconciliation</h2><blockquote><p>“For <strong>He Himself is our peace, who has made both one</strong>, and has broken down the middle wall of separation, <strong>having abolished in His flesh the enmity</strong>, that is, the law of commandments contained in ordinances, so as to create in Himself one new man from the two, thus making peace, and that <strong>He might reconcile them both to God in one body through the cross, thereby putting to death the enmity</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L14-16">Eph. 2:14-16</a>)</p></blockquote><blockquote><p>“For if when we were enemies <strong>we were reconciled to God through the death of His Son</strong>, much more, having been reconciled, we shall be saved by His life” (<a href="https://bibleox.com/en/eng-nkjv/rim/5/#L10">Rom. 5:10</a>)</p></blockquote><blockquote><p>“Now all things are of God, <strong>who has reconciled us to Himself through Jesus Christ</strong>, and has given us the ministry of reconciliation” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L18">2 Cor. 5:18</a>)</p></blockquote><blockquote><p>“that is, that <strong>God was in Christ reconciling the world to Himself</strong>, not imputing their trespasses to them, and has committed to us the word of reconciliation” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L19">2 Cor. 5:19</a>)</p></blockquote><blockquote><p>“and <strong>by Him to reconcile all things to Himself</strong>, by Him, whether things on earth or things in heaven, having made peace through the blood of His cross” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L20">Col. 1:20</a>)</p></blockquote><blockquote><p>“<strong>he has now reconciled in his fleshly body through death, so as to present you holy</strong> and blameless and <strong>irreproachable before him</strong>” (<a href="https://bibleox.com/en/en-nrsv/kol/1/#L22">Col. 1:22</a>)</p></blockquote><h2>Union with God</h2><blockquote><p>“For <strong>Christ also suffered once</strong> for sins, the just for the unjust, <strong>that He might bring us to God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L18">1 Pet. 3:18</a>)</p></blockquote><h2>The Eucharist (Communion of the Body and Blood of Christ)</h2><blockquote><p>“We have an altar from which those who serve the tabernacle have no right to eat. For the bodies of those animals, whose blood is brought into the sanctuary by the high priest for sin, are burned outside the camp. Therefore <strong>Jesus also, that He might sanctify the people with His own blood, suffered</strong> outside the gate” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L10-12">Heb. 13:10-12</a>)</p></blockquote><blockquote><p>“And as they were eating, Jesus took bread, blessed and broke it, and gave it to the disciples and said, ‘Take, eat; this is My body.’ Then He took the cup, and gave thanks, and gave it to them, saying, ‘<strong>Drink from it, all of you. For this is My blood of the new covenant, which is shed for many for the remission of sins</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/26/#L26-28">Matt. 26:26-28</a>)</p></blockquote><blockquote><p>“and when He had given thanks, He broke it and said, ‘Take, eat; this is <strong>My body which is broken for you</strong>; do this in remembrance of Me.’ In the same manner He also took the cup after supper, saying, ‘This cup is the new covenant in My blood’” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L24-25">1 Cor. 11:24-25</a>)</p></blockquote><h2>The New Covenant</h2><blockquote><p>“and when He had given thanks, He broke it and said, ‘Take, eat; this is My body which is broken for you; do this in remembrance of Me.’ In the same manner He also took the cup after supper, saying, ‘<strong>This cup is the new covenant in My blood</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L24-25">1 Cor. 11:24-25</a>)</p></blockquote><h2>The Kingdom</h2><blockquote><p>“For to this end <strong>Christ died and rose and lived again, that He might be Lord of both the dead and the living</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L9">Rom. 14:9</a>)</p></blockquote><p>Fulfilling the will of the Father, the prophecies and the promises</p><blockquote><p>“Now I say that Jesus Christ has become a servant to the circumcision <strong>for the truth of God, to confirm the promises made to the fathers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/15/#L8">Rom. 15:8</a>)</p></blockquote><h2>An Example</h2><blockquote><p>“For to this you were called, because <strong>Christ also suffered for us, leaving us an example, that you should follow His steps</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L21">1 Pet. 2:21</a>)</p></blockquote><blockquote><p>“and <strong>He died for all, that those who live should live no longer for themselves, but for Him who died for them and rose again</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L15">2 Cor. 5:15</a>)</p></blockquote><h2>Questions from Muslims</h2><h3>Why is a sacrifice needed, if a merciful God can simply forgive?</h3><p>The God in whom Christians believe is called love:</p><blockquote><p>“He who does not love does not know God, for <strong>God is love</strong>. &lt;...&gt; And we have known and believed the love that God has for us. <strong>God is love</strong>, and he who abides in love abides in God, and God in him” (<a href="https://bibleox.com/en/eng-nkjv/1in/4/#L8,16">1 John. 4:8,16</a>)</p></blockquote><p>God shows His love for His creation precisely by offering Himself as a sacrifice for their salvation, for God Himself said:</p><blockquote><p>“<strong><mark>Greater love has no one than this, than to lay down one’s life for his friends</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L13">John. 15:13</a>)</p></blockquote><p>In this way, by sacrificial love He draws to Himself those whom He wishes to save:</p><blockquote><p>“And I, <strong>if I am lifted up from the earth [on the cross], will draw all peoples to Myself</strong>. This He said, <strong>signifying by what death He would die</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/12/#L32-33">John. 12:32-33</a>)</p></blockquote><p>But the All-Wise God arranges salvation wisely. Besides love, we can also speak of satisfying divine justice, for God is not only merciful but also just. He knows how to combine everything at once: wisdom, mercy, justice and love.</p>

  - src: Христос-искупитель
    path: Wf6k_Christ_the_Redeemer
    title: Christ — the Redeemer
    meta_desc: '“You were slain, and have redeemed us to God by Your blood out of every tribe and tongue and people and nation” (Rev. 5:9)'
    menu: { parent: God/Son, title: Christ — the Redeemer, priority: 10 }
    body: |-
      <p>Through the transgression of Adam all mankind was condemned:</p><blockquote><p>“Therefore, as <strong>through one man’s offense judgment came to all men, resulting in condemnation</strong>, even so through one Man’s righteous act the free gift came to all men, resulting in justification of life” (<a href="https://bibleox.com/en/eng-nkjv/rim/5/#L18">Rom. 5:18</a>)</p></blockquote><p>Christ took the curse of mankind upon Himself:</p><blockquote><p>“Christ has redeemed us from the curse of the law, having become a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’)” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L13">Gal. 3:13</a>)</p></blockquote><p>Christ redeemed man with His Blood:</p><blockquote><p>“knowing that <strong>you were</strong> not <strong>redeemed</strong> with corruptible things, like silver or gold, <strong>from your aimless conduct received by tradition from your fathers</strong>, but with the precious <strong>blood of Christ</strong>, as of a lamb without blemish and without spot” (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L18-19">1 Pet. 1:18-19</a>)</p></blockquote><blockquote><p>“And they sang a new song, saying: ‘You are worthy to take the scroll, and to open its seals; for You were slain, and <strong>have redeemed us</strong> to God <strong>by Your blood</strong> out of every tribe and tongue and people and nation’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/5/#L9">Rev. 5:9</a>)</p></blockquote>

  - src: Христос-судья
    path: Jm2r_Christ_the_Judge
    title: Christ — the Judge
    meta_desc: '“we must all appear before the judgment seat of Christ, that each one may receive the things done in the body, according to what he has done, whether good or bad” (2 Cor. 5:10)'
    menu: { parent: God/Son, title: Christ — the Judge, priority: 12 }
    body: |-
      <h2>Jesus Christ Will Judge All People at the Last Judgment</h2><blockquote><p>“For <strong>the Son of Man</strong> will come in the glory of His Father with His angels, and then <strong>He will reward each according to his works</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27">Matt. 16:27</a>)</p></blockquote><blockquote><p>“When <strong>the Son of Man</strong> comes in His glory, and all the holy angels with Him, then He will sit on the throne of His glory. All the nations will be gathered before Him, and <strong>He will separate them one from another</strong>, as a shepherd divides his sheep from the goats” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32">Matt. 25:31-32</a>)</p></blockquote><blockquote><p>“For the Father judges no one, but <strong>has committed all judgment to the Son</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L22">John. 5:22</a>)</p></blockquote><blockquote><p>“how God anointed <strong>Jesus of Nazareth</strong> with the Holy Spirit and with power, who went about doing good and healing all who were oppressed by the devil &lt;...&gt; And He commanded us to preach to the people, and to testify that <strong>it is He who was ordained by God to be Judge of the living and the dead</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L38,42">Act. 10:38,42</a>)</p></blockquote><blockquote><p>“because He has appointed a day on which He will <strong>judge the world</strong> in righteousness <strong>by the Man whom He has ordained</strong>. He has given assurance of this to all <strong>by raising Him from the dead</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/17/#L31">Act. 17:31</a>)</p></blockquote><blockquote><p>“For we must all appear before <strong>the judgment seat of Christ</strong>, that each one may receive the things done in the body, according to what he has done, whether good or bad” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><blockquote><p>“I charge you therefore before <strong>God and the Lord Jesus Christ, who will judge the living and the dead</strong> at His appearing and His kingdom” (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L1">2 Tim. 4:1</a>)</p></blockquote><h2>All Are Subject to Judgment</h2><blockquote><p>“For <strong><mark>we must all</mark> appear before the judgment seat of Christ,</strong> that each one may receive the things done in the body, according to what he <strong>has done</strong>, <strong>whether good or bad</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><blockquote><p>“But why do you judge your brother? Or why do you show contempt for your brother? For <strong><mark>we shall all</mark> stand before the judgment seat of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L10">Rom. 14:10</a>)</p></blockquote><blockquote><p>“So speak and so <strong><mark>do as those who will be judged</mark></strong> by the law of liberty” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L12">James. 2:12</a>)</p></blockquote><blockquote><p>“For <strong>God will bring <mark>every work</mark> into judgment</strong>, including every secret thing, <strong>whether good or evil</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ekl/12/#L14">Eccl. 12:14</a>)</p></blockquote><blockquote><p>“When <strong>the Son of Man</strong> comes in His glory, and all the holy angels with Him, then <strong>He will sit on the throne</strong> of His glory. <strong><mark>All the nations</mark> will be gathered before Him</strong>, and <strong>He will <mark>separate them one from another</mark></strong>, as a shepherd divides <strong>his <mark>sheep from the goats</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32">Matt. 25:31-32</a>)</p></blockquote><h2>Judgment Will Begin with the Church</h2><blockquote><p>“For <strong>the time has come for judgment to begin <mark>at the house of God</mark></strong>; and if <strong><mark>it begins with us first</mark></strong>, what will be the end of those who do not obey the gospel of God? Now ‘If <strong>the righteous one is scarcely saved</strong>, where will the ungodly and the sinner appear?’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18">1 Pet. 4:17-18</a>)</p></blockquote><blockquote><p>“But with me <strong>it is a very small thing that I should be judged by you or by a human court. In fact, <mark>I do not even judge myself</mark></strong>. For I know of nothing against myself, yet <strong>I am not justified by this; but <mark>He who judges me is the Lord</mark></strong>. Therefore <strong>judge nothing before the time</strong>, until the Lord comes, who will both bring to light the hidden things of darkness and reveal the counsels of the hearts. Then each one’s praise will come from God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L3-5">1 Cor. 4:3-5</a>)</p></blockquote><h2>Christ Will Judge in a Person What Was Done During Life in the Body</h2><blockquote><p>“For we must all appear before the judgment seat of Christ, that each one may <strong>receive the things <mark>done in the body</mark>, according to what he has done</strong>, whether good or bad” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><p>The judgment is made on the basis of earthly deeds done in the body:</p><blockquote><p>“Then He will also say to those on the left hand, ‘<strong>Depart from Me, you cursed, into the everlasting fire prepared for the devil and his angels: for I was hungry and you gave Me no food</strong>; I was thirsty and you gave Me no drink; I was a stranger and you did not take Me in, naked and you did not clothe Me, sick and in prison and you did not visit Me.’ Then they also will answer Him, saying, ‘Lord, when did we see You hungry or thirsty or a stranger or naked or sick or in prison, and did not minister to You?’ Then He will answer them, saying, ‘Assuredly, I say to you, <strong>inasmuch as you did not do it to one of the least of these, you did not do it to Me.’ And these will go away into everlasting punishment, but the righteous into eternal life</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L41-46">Matt. 25:41-46</a>)</p></blockquote>

  - src: отвержение-Христа-отвержение-Бога
    path: Ry7p_Rejecting_Christ_Is_Rejecting_God
    title: Rejecting Christ Is Rejecting God
    menu: { parent: God/Son, title: Rejecting Christ Is Rejecting God, priority: 13 }
    body: |-
      <blockquote><p>“<strong>he who rejects Me rejects Him who sent Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L16">Luke. 10:16</a>)</p></blockquote><blockquote><p>“<strong>He who hates Me hates My Father also</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L23">John. 15:23</a>)</p></blockquote><blockquote><p>“<strong>Whoever denies the Son does not have the Father either</strong>; he who acknowledges the Son has the Father also” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L23">1 John. 2:23</a>)</p></blockquote><blockquote><p>“Whoever <strong>transgresses</strong> and <strong>does not abide in the doctrine of Christ does not have God</strong>. He who abides in the doctrine of Christ has both the Father and the Son” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9">2 John. 1:9</a>)</p></blockquote><blockquote><p>“He who believes in the Son has everlasting life; and <strong>he who does not believe the Son shall not see life, but the wrath of God abides on him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L36">John. 3:36</a>)</p></blockquote>

  - src: Христос-безгрешен
    path: Ze4b_Christ_Is_Sinless
    title: Christ Is Sinless
    menu: { parent: God/Son, title: Christ Is Sinless, priority: 14 }
    body: |-
      <blockquote><p>“For He made Him <strong>who knew no sin</strong> to be sin for us” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L21">2 Cor. 5:21</a>)</p></blockquote><blockquote><p>“but was in all points tempted as we are, <strong>yet without sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/4/#L15">Heb. 4:15</a>)</p></blockquote><blockquote><p>“who is holy, <strong>harmless, undefiled, separate from sinners</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L26">Heb. 7:26</a>)</p></blockquote><blockquote><p>“who through the eternal Spirit offered Himself <strong>without spot</strong> to God” (<a href="https://bibleox.com/en/eng-nkjv/evr/9/#L14">Heb. 9:14</a>)</p></blockquote><blockquote><p>“<strong>in Him there is no sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L5">1 John. 3:5</a>)</p></blockquote><blockquote><p>“I will no longer talk much with you, for <strong>the ruler of this world</strong> is coming, and <strong>he has nothing in Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L30">John. 14:30</a>)</p></blockquote><blockquote><p>“<strong>Which</strong> of you <strong>convicts Me of sin?</strong> And if I tell the truth, why do you not believe Me?” (<a href="https://bibleox.com/en/eng-nkjv/in/8/#L46">John. 8:46</a>)</p></blockquote><blockquote><p>“And they made His grave with the wicked — but with the rich at His death, because <strong>He had done no violence</strong> <em>(in the Greek Old Testament, the Septuagint: ἀνομίαν οὐκ ἐποίησεν — “He did no lawlessness”)</em>, nor was any deceit in His mouth” (<a href="https://bibleox.com/en/eng-nkjv/is/53/#L9">Is. 53:9</a>)</p></blockquote>
