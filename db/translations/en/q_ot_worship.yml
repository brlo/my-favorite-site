  - src: иерусалимский-храм
    path: Jt1t_The_Jerusalem_Temple
    title: The Old Testament Temple of Jerusalem
    title_sub: The biblical description of the structure of the ancient Old Testament temple in Jerusalem built by Solomon
    meta_desc: The biblical description of the structure of the ancient Old Testament temple in Jerusalem built by Solomon
    menu: { parent: Old Testament/Worship, title: The Jerusalem Temple, priority: 1 }
    body: |-
      <h2>General Information</h2><p>The Temple was built by Solomon on Mount Moriah (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L1">2 Chr. 3:1</a>), on the site of the threshing floor (the place where wheat is gathered and cleaned) of Ornan the Jebusite (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L1">2 Chr. 3:1</a>), where Solomon’s father (David) saw the angel striking the people, and which the prophet Gad also pointed out (<a href="https://bibleox.com/en/eng-nkjv/2ts/24/#L16-18">2 Sam. 24:16-18</a>). The building of the Temple began in the 480th year after the Jews came out of Egypt (according to the LXX, in the 440th year). It was the 4th year of Solomon’s reign, the month of Ziv (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L37">1 Kin. 6:37</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L2">2 Chr. 3:2</a>). The building was finished 7 years later, in the 11th year of Solomon’s reign, in the month of Bul (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L38">1 Kin. 6:38</a>).</p><h2>God’s Command to Make the Temple</h2><blockquote><p>“Then the LORD spoke to Moses, saying: ‘Speak to the children of Israel, that they bring Me an offering. &lt;...&gt; And <strong>let them make Me a sanctuary</strong>, that I may dwell among them. &lt;...&gt; And see to it that <strong>you make them according to the pattern which was shown you on the mountain</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1-2,8,40">Ex. 25:1-2,8,40</a>)</p></blockquote><blockquote><p>“Our fathers had <strong>the tabernacle</strong> of witness in the wilderness, as He appointed, <strong>instructing Moses to make it</strong> according to the pattern that he had seen” (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L44">Act. 7:44</a>)</p></blockquote><p>The earthly temple is arranged after the image of the heavenly reality:</p><blockquote><p><em>“For Christ has not entered </em><strong><em>the holy places made with hands, which are copies of the true</em></strong><em>, but into heaven itself, now to appear in the presence of God for us” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24"><em>Heb. 9:24</em></a><em>)</em></p></blockquote><h2>The Structure of the Jerusalem Temple</h2><p>The walls of the Temple were built of stone.</p><p><em>The dimensions below are given in cubits. To get meters roughly, divide the number of cubits by 2 (to get feet roughly, multiply by 1.5).</em></p><h3>Dimensions of the Temple (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L2">1 Kin. 6:2</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L3">2 Chr. 3:3</a>)</h3><ul><li><p>60 cubits long (divided by a wall into 20 and 40 cubits),</p></li><li><p>20 cubits wide,</p></li><li><p>30 cubits high.</p></li></ul><p>In meters: 31.5 x 10.5 x 15.75.</p><p>The Temple was divided into two parts (of 20 and 40 cubits) by a stone wall (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L16-17">1 Kin. 6:16-17</a>):</p><ul><li><p>the 20-cubit part is called the “Holy of Holies” (or the Debir, or “the inner sanctuary”);</p></li><li><p>the 40-cubit part is called the “Holy Place”.</p></li></ul><p>The Temple had latticed windows with beveled frames (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L4">1 Kin. 6:4</a>).</p><h3>The Vestibule</h3><p>In front of the Temple a vestibule (porch) was also built (it is not counted as part of the Temple). Its dimensions (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L3">1 Kin. 6:3</a>):</p><ul><li><p>20 cubits long;</p></li><li><p>10 cubits wide.</p></li><li><p>120 cubits high (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L4">2 Chr. 3:4</a>)?</p></li></ul><h3>The Annex</h3><p>Around the Temple a three-story annex was built (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L5">1 Kin. 6:5</a>), not fastened into the walls of the Temple (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L6">1 Kin. 6:6</a>). The width of the stories, starting from the lowest: 5, 6, 7 cubits.</p><h3>Side Chambers</h3><p>Around the Temple side chambers were also built, attached to the Temple with cedar beams (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L10">1 Kin. 6:10</a>). Height of the chambers: 5 cubits.</p><h3>The Walls of the Temple</h3><p>The walls were built of hewn stone. Inside, the walls and ceiling of the Temple were paneled with cedar boards (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L9,16">1 Kin. 6:9,16</a>). The floor of the Temple was covered with cypress planks (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L15">1 Kin. 6:15</a>). Everything was covered with wood. No stone could be seen from inside (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L18">1 Kin. 6:18</a>). The walls and floor of the Temple were also to some extent overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L22">1 Kin. 6:22</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L5">2 Chr. 3:5</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L7">2 Chr. 3:7</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L30">1 Kin. 6:30</a>). As a rule, the carved images were overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L32">1 Kin. 6:32</a>). On the cedar boards (walls and ceiling) were carved cherubim, palm trees, open flowers (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L29">1 Kin. 6:29</a>), and gourd-like ornaments (“ornamental buds”, <a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L18">1 Kin. 6:18</a>). They were carved in “both the inner and outer sanctuaries” (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L29">1 Kin. 6:29</a>), that is, in the Holy of Holies (the inner part of the Temple) and in the Holy Place (the outer part). The Temple was adorned with precious stones (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L6">2 Chr. 3:6</a>). Important: images of cherubim existed earlier as well, on the curtains (walls) of the Tabernacle (<a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">Ex. 26:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/36/#L8">36:8</a>).</p><h2>The Holy of Holies</h2><p>Dimensions: 20 x 20 x 20 cubits (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L20">1 Kin. 6:20</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L8">2 Chr. 3:8</a>), overlaid with pure gold. Golden chains were stretched across (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L21">1 Kin. 6:21</a>).</p><h3>The Entrance</h3><p>The entrance to the Holy of Holies was through a door that in the Russian Synodal translation is called <strong>five-sided </strong>(<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L31">1 Kin. 6:31</a>, NKJV: “the lintel and doorposts were one-fifth of the wall”; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L22">2 Chr. 4:22</a>), made of olive wood. The door (like the walls) was adorned with carved figures of cherubim, palm trees, open flowers. The carvings were overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L32">1 Kin. 6:32</a>). Here also was a veil with embroidered figures of cherubim (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L14">2 Chr. 3:14</a>; <a href="https://bibleox.com/en/en-nrsv/1mak/1/#L22">1 Macc. 1:22</a>), of blue, purple and crimson fabric, as in the Tabernacle (<a href="https://bibleox.com/en/eng-nkjv/ish/26/#L31">Ex. 26:31</a>). Before the veil an unquenchable lamp always burned (<a href="https://bibleox.com/en/eng-nkjv/lev/24/#L1-4">Lev. 24:1-4</a>)</p><h3>Two Cherubim</h3><p>Two large statues of cherubim made of olive wood were set up (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L23">1 Kin. 6:23</a>). They were overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L28">1 Kin. 6:28</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L10">2 Chr. 3:10</a>). The height and width of the cherubim were 10 cubits (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L23">1 Kin. 6:23</a>), the width being measured from the tip of one wing to the tip of the other (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L24-27">1 Kin. 6:24-27</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L11">2 Chr. 3:11</a>). One wing of each cherub touched the wall, the other wing touched the wing of the neighboring cherub (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L11-12">2 Chr. 3:11-12</a>). Their faces were turned toward the Temple (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L13">2 Chr. 3:13</a>).</p><h3>The Ark of the Covenant</h3><p>In the middle, under the wings of the cherubim, stood the Ark of the Covenant (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L19">1 Kin. 6:19</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L6">1 Kin. 8:6</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/5/#L7">2 Chr. 5:7</a>), together with the poles for carrying it (<a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L7">1 Kin. 8:7</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/5/#L9">2 Chr. 5:9</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/25/#L15">Ex. 25:15</a>). The dimensions of the Ark were 2.5×1.5×1.5 cubits (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L10">Ex. 25:10</a>). The Ark was made of acacia (shittim) wood (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L10">Ex. 25:10</a>), and was overlaid with gold inside and out (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L11">Ex. 25:11</a>). At each corner of the base of the Ark there was a golden ring (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L12">Ex. 25:12</a>) for wooden poles, also overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L13">Ex. 25:13</a>), which were needed to carry the Ark. In the Ark lay the 2 stone tablets of the Covenant, which the prophet Moses himself had put there (<a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L9">1 Kin. 8:9</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/5/#L10">2 Chr. 5:10</a>), the manna (<a href="https://bibleox.com/en/eng-nkjv/ish/16/#L32-34">Ex. 16:32-34)</a> and Aaron’s blossoming almond rod (<a href="https://bibleox.com/en/eng-nkjv/chis/17/#L8-11">Num. 17:8-11</a>). The Ark of the Covenant was closed on top with a lid (the mercy seat) of 2.5×1.5 cubits (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L17">Ex. 25:17)</a>. On the lid were two golden statues of cherubim, facing one another (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L18-20">Ex. 25:18-20</a>). Their wings were raised and with them they covered the lid of the Ark. Above the lid of the Ark, between the two cherubim, God revealed Himself and spoke (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L22">Ex. 25:22</a>).</p><h2>The Holy Place</h2><h3>The Entrance</h3><p>The entrance to the Holy Place was through a <strong>four-sided double door</strong> made of cypress (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L34">1 Kin. 6:34</a>), with doorposts of olive wood (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L33">1 Kin. 6:33</a>; NKJV: “one-fourth of the wall”). These doors too were adorned with carvings of cherubim, palm trees and open flowers overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L35">1 Kin. 6:35</a>).</p><h3>The Altar</h3><p>Before the door to the Holy of Holies stood the altar for <a href="https://bibleox.com/ru/q/%D1%84%D0%B8%D0%BC%D0%B8%D0%B0%D0%BC">burning incense</a>. It was made of wood and overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L22">1 Kin. 6:22</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L48">1 Kin. 7:48</a>).</p><h3>The Table</h3><p>Nearby was the golden table for the showbread (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L48">1 Kin. 7:48</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L8">2 Chr. 4:8</a>).</p><h3>The Lampstands</h3><p>On the left and right were golden lampstands (menorahs): 5 on the right and 5 on the left (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L49">1 Kin. 7:49</a>). They were made entirely of pure gold, together with the lamps, censers, flowers, wick-trimmers, basins, bowls, ladles and door hinges — all of gold (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L50">1 Kin. 7:50</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L19-22">2 Chr. 4:19-22</a>).</p><h2>The Vestibule</h2><p>Overlaid inside with pure gold (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L4">2 Chr. 3:4</a>)</p><h3>The Pillars: Jachin and Boaz</h3><p>Before the entrance to the Vestibule were set up two huge identical bronze pillars, which were given names: on the right — Jachin, on the left — Boaz (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L21">1 Kin. 7:21</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L17">2 Chr. 3:17</a>). The pillars were <strong>18 cubits</strong> high (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L15">1 Kin. 7:15</a>) (35 cubits — <a href="https://bibleox.com/en/eng-nkjv/2par/3/#L15">2 Chr. 3:15</a>). A line of 12 cubits measured their circumference (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L15">1 Kin. 7:15</a>). On the pillars stood capitals, each 5 cubits high (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L16">1 Kin. 7:16</a>). The capitals were adorned with lattice network and wreaths of chainwork (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L16">1 Kin. 7:16</a>): 7 on each capital (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L17">1 Kin. 7:17</a>). On the capitals were two rows of pomegranates (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L18">1 Kin. 7:18</a>). Capitals of the pillars in the Vestibule in the shape of lilies, each of 4 cubits, are also mentioned (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L19">1 Kin. 7:19</a>). All the bronze articles were burnished (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L45">1 Kin. 7:45</a>).</p><h2>The Courts</h2><p>In front of the Temple an <strong>inner (priests’) court</strong> was made (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L36">1 Kin. 6:36</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L9">2 Chr. 4:9</a>). It was built (enclosed) with three rows of hewn stones and one row of cedar beams (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L36">1 Kin. 6:36</a>) (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L12">1 Kin. 7:12</a>). The great outer court was also enclosed (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L12">1 Kin. 7:12</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L9">2 Chr. 4:9</a>).</p><h3>The Altar</h3><p>Dimensions: 20 x 20 cubits and 10 cubits high (<a href="https://bibleox.com/en/eng-nkjv/2par/4/#L1">2 Chr. 4:1</a>)</p><h3>The Bronze Sea</h3><p>A round vessel for the washing of the priests (<a href="https://bibleox.com/en/eng-nkjv/2par/4/#L6">2 Chr. 4:6</a>). In the first (inner) court stood the round “Sea” cast of bronze. Dimensions: 10 cubits in diameter, 5 cubits high (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L23">1 Kin. 7:23</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L2">2 Chr. 4:2</a>), about a handbreadth thick (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L26">1 Kin. 7:26</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L5">2 Chr. 4:5</a>). A line of 30 cubits measured its circumference (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L23">1 Kin. 7:23</a>). The rim of the vessel was adorned with two rows of gourds: 10 gourds to a cubit (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L24">1 Kin. 7:24</a>). It contained 2000 baths (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L26">1 Kin. 7:26</a>). It stood to the southeast of the Temple (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L39">1 Kin. 7:39</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L10">2 Chr. 4:10</a>).</p><h3>12 Oxen</h3><p>The Bronze Sea stood on 12 oxen (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L25">1 Kin. 7:25</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L3-4">2 Chr. 4:3-4</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L15">2 Chr. 4:15</a>): 3 oxen looked toward the north, and 3 oxen likewise looked toward each of the other points of the compass.</p><h3>10 Lavers</h3><p>Vessels for washing the animal sacrifices before they were offered (<a href="https://bibleox.com/en/eng-nkjv/2par/4/#L6">2 Chr. 4:6</a>). Each laver held [40] baths. They stood by the Temple: 5 on the left and 5 on the right (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L39">1 Kin. 7:39</a>). Each of them had a movable stand on wheels.</p><h3>10 Stands</h3><p>10 movable square bronze stands (carts) (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L27">1 Kin. 7:27</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L31">1 Kin. 7:31</a>): 4 by 4 cubits, and 3 cubits high. On the panels of the stands were depicted lions, oxen and cherubim, and on top were wreaths (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L28-29">1 Kin. 7:28-29</a>). The stands moved on 4 bronze wheels (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L30">1 Kin. 7:30</a>). The height of the wheels was 1.5 cubits (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L32">1 Kin. 7:32</a>). They were all identical (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L37">1 Kin. 7:37</a>).</p><h3>Singers, Trumpeters</h3><p>At the consecration of the Temple the Levites sang and played musical instruments (cymbals, stringed instruments and harps), and the priests sounded trumpets (<a href="https://bibleox.com/en/eng-nkjv/2par/5/#L12">2 Chr. 5:12</a>). The musical instruments were made specially for the Temple (<a href="https://bibleox.com/en/eng-nkjv/2par/7/#L6">2 Chr. 7:6</a>).</p><h2>Images</h2><p>Carved images of cherubim were on the walls of the Temple (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L32">1 Kin. 6:32</a>), on the entrance door (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L32">1 Kin. 6:32</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L35">1 Kin. 6:35</a>), and on the veil before the entrance to the Holy of Holies (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L14">2 Chr. 3:14</a>; <a href="https://bibleox.com/en/en-nrsv/1mak/1/#L22">1 Macc. 1:22</a>). In the Holy of Holies stood two large gilded wooden statues of cherubim (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L23">1 Kin. 6:23</a>). On the lid of the Ark of the Covenant two statues of cherubim were made (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L18-20">Ex. 25:18-20</a>). In the court of the Temple, on the large stands for the lavers, lions, oxen and cherubim were depicted (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L28-29">1 Kin. 7:28-29</a>).</p><h2>Prayer</h2><p>The prayer of King Solomon at the consecration of the Temple: <a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L22-53">1 Kin. 8:22-53</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/6/#L14-42">2 Chr. 6:14-42</a></p><p>God’s answer to Solomon’s prayer: <a href="https://bibleox.com/en/eng-nkjv/2par/7/#L12-22">2 Chr. 7:12-22</a></p>

