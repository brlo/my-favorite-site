    menu: { parent: Old Testament/Worship, title: The Ark of the Covenant, priority: 2 }
    body: |-
      <h2>The Ark of the Covenant (of the Testimony)</h2><p>In the middle of the <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">Holy of Holies</a> of the <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">Jerusalem Temple</a>, under the wings of the cherubim, stood the Ark of the Covenant (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L19">1 Kin. 6:19</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L6">1 Kin. 8:6</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/5/#L7">2 Chr. 5:7</a>), together with the poles for carrying it (<a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L7">1 Kin. 8:7</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/5/#L9">2 Chr. 5:9</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/25/#L15">Ex. 25:15</a>).</p><h3>The Body</h3><p>Its dimensions are 2.5 × 1.5 cubits, height 1.5 cubits (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L10">Ex. 25:10</a>). It is made of acacia (shittim) wood (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L10">Ex. 25:10</a>). Inside and out it is overlaid with gold, and on top it has a molding of gold (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L11">Ex. 25:11</a>).</p><h3>The Rings</h3><p>At each of the lower corners of the Ark a golden ring is fastened for carrying the Ark (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L14">Ex. 25:14</a>), 4 rings in all (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L12">Ex. 25:12</a>).</p><h3>The Poles</h3><p>Two poles of acacia wood are inserted into the rings (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L13">Ex. 25:13</a>). The poles are overlaid with gold (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L13">Ex. 25:13</a>). The poles must never be taken from the Ark (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L15">Ex. 25:15</a>).</p><h3>The Lid (the Mercy Seat)</h3><p>Its dimensions are 2.5 × 1.5 cubits (like the Ark), and it is made of pure gold (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L17">Ex. 25:17</a>).</p><h3>The Cherubim</h3><p>On the lid of the Ark two statues of cherubim are made of gold (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L18">Ex. 25:18</a>). One cherub at one end of the lid, and the other at the other end (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L19">Ex. 25:19</a>), facing one another, toward the lid (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L20">Ex. 25:20</a>). Their wings are raised upward and cover the lid (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L20">Ex. 25:20</a>).</p><h3>Contents</h3><p>In the Ark lay the 2 stone tablets of the Covenant, which the prophet Moses put there (<a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L9">1 Kin. 8:9</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/5/#L10">2 Chr. 5:10</a>), the manna (<a href="https://bibleox.com/en/eng-nkjv/ish/16/#L32-34">Ex. 16:32-34)</a> and Aaron’s blossoming almond rod (<a href="https://bibleox.com/en/eng-nkjv/chis/17/#L8-11">Num. 17:8-11</a>)</p><h2>God Speaks Above the Ark</h2><p>God manifestly reveals Himself and speaks above the lid of the Ark, between the two cherubim (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L22">Ex. 25:22</a>).</p>

  - src: ветхозаветный-священник
    path: Pr3o_The_Old_Testament_Priest
    title: The Old Testament Priest
    menu: { parent: Old Testament/Worship, title: The Old Testament Priest, priority: 3 }
    references: |-
      <ol><li><p>See the description by A. P. Lopukhin: <a href="https://bible.optina.ru/old:ish:28:30#lopuxin_ap">https://bible.optina.ru/old:ish:28:30#lopuxin_ap</a> (in Russian)</p></li><li><p><a href="https://en.wikipedia.org/wiki/Urim_and_Thummim">https://en.wikipedia.org/wiki/Urim_and_Thummim</a></p></li></ol>
    body: |-
      <h2>Admission to the Priesthood</h2><h3>Priests — Only the Descendants of Aaron</h3><p>Only Aaron (the brother of the prophet Moses) and his descendants could be priests (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L1">Ex. 28:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/28/#L4">Ex. 28:4</a>).</p><h3>Handing On the Office of High Priest</h3><p>Only Aaron (the brother of the prophet Moses) and his descendants could be priests (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L1">Ex. 28:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/28/#L4">Ex. 28:4</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/29/#L9">Ex. 29:9</a>). The successor of the high priest was clothed in the garments and anointed with oil for seven days (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29-30">Ex. 29:29-30</a>). Together with the office the sacred garments were handed on (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29">Ex. 29:29</a>). If an outsider undertook priestly service, he was punished by death (<a href="https://bibleox.com/en/eng-nkjv/chis/3/#L10">Num. 3:10</a>).</p><h3>Requirements for a Candidate</h3><p>He may not have bodily defects (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L17-21">Lev. 21:17-21</a>):</p><ul><li><p>blindness,</p></li><li><p>lameness,</p></li><li><p>a marred face or a limb too long,</p></li><li><p>a broken foot or broken hand,</p></li><li><p>a hunched back,</p></li><li><p>a defect in the eye,</p></li><li><p>eczema, scab, or damaged testicles.</p></li></ul><h3>Requirements for a Priest</h3><ul><li><p>he must not shave his head or the edges of his beard (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1,5">Lev. 21:1,5</a>);</p></li><li><p>he must not take as wife a divorced woman (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L7">Lev. 21:7</a>), a harlot, or a defiled woman (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L7">Lev. 21:7</a>), and the wife of the high priest may only be a virgin (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L13-14">Lev. 21:13-14</a>);</p></li><li><p>he must not touch the dead (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1-4">Lev. 21:1-4</a>), and the high priest may not touch even his dead relatives (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L10-11">Lev. 21:10-11</a>);</p></li><li><p>the high priest must not uncover his head (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L10">Lev. 21:10</a>).</p></li></ul><h2>The Rite</h2><h3>In Brief</h3><p>It is performed through the offering of sacrifices, washings, anointing with oil (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L41">Ex. 28:41</a>), sprinkling with the blood of animals, and a meal. For consecration sacred garments are required (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L2-3">Ex. 28:2-3</a>), which are handed on with the office (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29">Ex. 29:29</a>).</p><h3>Consecration of the Old Testament High Priest</h3><h4>Sacrifices</h4><p>For the consecration animals without blemish must be sacrificed (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L1">Ex. 29:1</a>), along with unleavened bread of wheat flour (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L2">Ex. 29:2</a>):</p><ul><li><p><strong>one young bull</strong>;</p></li><li><p><strong>two rams</strong>;</p></li><li><p>unleavened <strong>cakes</strong> mixed with oil, and wafers anointed with oil;</p></li><li><p><strong>unleavened bread</strong> of wheat flour.</p></li></ul><p>The high priest and the priests lay their hands on the bull, and then it is killed at the door of the Tabernacle of Meeting (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L10-11">Ex. 29:10-11</a>) (a prototype of the killing of Christ).</p><p>The horns of the altar are smeared with the blood of the bull, and all the rest is poured out at the base of the altar (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L12">Ex. 29:12</a>) (a prototype of Christ’s sufferings on the Cross-altar). The inward parts of the bull (the liver, kidneys, etc.) are burned on the altar (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L13">Ex. 29:13</a>). The flesh of the bull, its skin and the rest are burned with fire outside the camp — this is a sin offering (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L14">Ex. 29:14</a>).</p><p>In the same way the high priest and the priests lay their hands on the head of one ram (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L15">Ex. 29:15</a>), kill it, and its blood is sprinkled all around on the altar (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L16">Ex. 29:16</a>). The ram was cut in pieces, its entrails washed, and it was burned on the altar — this is a burnt offering to the Lord (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L17-18">Ex. 29:17-18</a>).</p><p>Likewise the high priest and the priests laid their hands on the head of the other ram (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L19">Ex. 29:19</a>), killed it (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L20">Ex. 29:20</a>), and with its blood touched the tip of the right ear of Aaron and his sons, the thumb of the right hand and the big toe of the right foot (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L20">Ex. 29:20</a>), and then the blood was sprinkled all around on the altar (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L20">Ex. 29:20</a>).</p><p>With the blood from the altar and the anointing oil Aaron and his sons and their priestly garments were sprinkled (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L21">Ex. 29:21</a>). Now they are hallowed.</p><p>Next the fat parts of the ram are taken (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L22">Ex. 29:22</a>), 1 loaf of bread, 1 cake and 1 wafer from the basket of unleavened bread (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L23">Ex. 29:23</a>), they are put into the hands of Aaron and his sons (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L24">Ex. 29:24</a>), then received back from them and burned on the altar (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L25">Ex. 29:25</a>). The breast of the ram is also offered (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L26-28">Ex. 29:26-28</a>).</p><h4>Washing</h4><p>Before the consecration a washing with water is performed (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L4">Ex. 29:4</a>).</p><h4>Vesting in the Priestly Garments</h4><p>After the washing the man is clothed in the holy garments (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L5-6">Ex. 29:5-6</a>). The priests are also clothed in garments (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L8-9">Ex. 29:8-9</a>).</p><h4>Pouring Oil on the Head</h4><p>After the vesting the man is anointed with oil (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L41">Ex. 28:41</a>), which is poured on his head (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L7">Ex. 29:7</a>).</p><h4>The Meal</h4><p>The flesh of the ram was boiled in the holy place (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L31">Ex. 29:31</a>), and then the high priest and the priests were to eat it at the door of the Tabernacle of Meeting (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L32">Ex. 29:32</a>). Outsiders could not take part in this meal (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L33">Ex. 29:33</a>). If any flesh remained until morning, it had to be burned (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L34">Ex. 29:34</a>).</p><h4>Repetition for 7 Days</h4><p>This whole rite of offering sacrifices and consecration was repeated for 7 days (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L35">Ex. 29:35</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/8/#L33-34">Lev. 8:33-34</a>). As a result the altar becomes most holy: whatever touches it will be holy (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L37">Ex. 29:37</a>) (a prototype of the Cross of Christ, which became a holy thing).</p><h2>Garments</h2><h3>Purpose</h3><p>For glory, for beauty, and for consecration (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L2-3">Ex. 28:2-3</a>), and for handing on the office of high priest (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29">Ex. 29:29</a>).</p><h3>The Set</h3><p>The set of the high priest’s garments includes (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L4">Ex. 28:4</a>):</p><ul><li><p>the <strong>breastplate</strong>,</p></li><li><p>the <strong>ephod</strong> (outer garment),</p></li><li><p>the <strong>robe</strong> (upper vestment),</p></li><li><p>the woven <strong>tunic</strong> (undergarment),</p></li><li><p>the <strong>turban</strong> (head covering),</p></li><li><p>the <strong>sash</strong>.</p></li></ul><h3>The Ephod, or Epomis (Outer Sleeveless Garment)</h3><p>Made of gold, of thread of various colors (blue, purple, scarlet, that is, red) and of fine woven linen (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L5-6">Ex. 28:5-6</a>).</p><h4>The Shoulder Straps</h4><p>The ephod is not of one piece, but consists of a back and a front part, and is therefore joined on the shoulders by “shoulder straps” (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L7">Ex. 28:7</a>).</p><p>For the two shoulder straps two ornaments were made (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L12">Ex. 28:12</a>): onyx stones in gold settings (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L10">Ex. 28:10</a>). On these stones the 12 names of the tribes of Israel were engraved (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L9">Ex. 28:9</a>): 6 names on one stone and 6 names on the other, in order of their birth (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L10">Ex. 28:10</a>). The stones were set in gold settings and adorned with golden chains (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L13-14">Ex. 28:13-14</a>).</p><p>Somewhere at the edges, probably near the band, the ephod had two rings for fastening the breastplate to it (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L28">Ex. 28:28</a>).</p><h3>The Band (Sash)</h3><p>The woven band is put on over the ephod and is made of the same materials: blue, purple and scarlet thread and fine woven linen (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L8">Ex. 28:8</a>). The sash was of woven work (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L39">Ex. 28:39</a>).</p><h3>The Breastplate</h3><p>A square piece of fabric folded double (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L16">Ex. 28:16</a>). Dimensions: about 23 × 23 cm, or 9 × 9 in (a span in length and width) (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L16">Ex. 28:16</a>). A span is the distance between the thumb and the little finger of a spread hand, about 23 cm. It is made of the same materials as the ephod (gold, thread and linen) (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L15">Ex. 28:15</a>).</p><p>To this piece of fabric 12 precious stones are fastened. They are listed 3 to a row (4 rows in all, <a href="https://bibleox.com/en/eng-nkjv/ish/28/#L17">Ex. 28:17</a>; the names of the stones are given as in the NKJV):</p><ul><li><p>sardius, topaz, emerald (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L17">Ex. 28:17</a>);</p></li><li><p>turquoise, sapphire, diamond (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L18">Ex. 28:18</a>);</p></li><li><p>jacinth, agate, amethyst (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L19">Ex. 28:19</a>);</p></li><li><p>beryl, onyx, jasper (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L20">Ex. 28:20</a>).</p></li></ul><p>On the stones the names of the 12 tribes of Israel were engraved, one name on each stone (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L21">Ex. 28:21</a>).</p><p>The breastplate was fastened to the shoulder straps (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L23">Ex. 28:23</a>). For this, at its two upper corners the breastplate had golden rings (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L23">Ex. 28:23</a>) through which a chain was passed (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L24">Ex. 28:24</a>) of pure gold (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L22">Ex. 28:22</a>), while the other end of the chain was fastened to the shoulder straps on the front side (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L22">Ex. 28:22</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/28/#L25">Ex. 28:25</a>).</p><p>At its two lower corners the breastplate had 4 golden rings: two on the inner side (toward the ephod) (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L26">Ex. 28:26</a>) and two on the outer side (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L27">Ex. 28:27</a>). By these rings the breastplate was bound with a blue cord (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L28">Ex. 28:28</a>) to the rings of the ephod (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L28">Ex. 28:28</a>), so that it would not come loose from the ephod, staying above the band (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L28">Ex. 28:28</a>).</p><p>The breastplate was put on every time one had to go into the holy place (the temple) (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L29">Ex. 28:29</a>).</p><h4>Urim and Thummim</h4><p>Into the breastplate (since it consisted of fabric folded double), like into the <a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0">Ark of the Covenant</a>, mysterious objects were put (<a href="https://bibleox.com/en/eng-nkjv/lev/8/#L8">Lev. 8:8</a>): the <strong>Urim and Thummim</strong>[1][2], in the Church Slavonic translation: <strong>“Manifestation and Truth”</strong> (<a href="https://bibleox.com/ru/csl-ru/ish/28/#L30">Ex. 28:30</a>, in Church Slavonic). The high priest had to have them over his heart (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L30">Ex. 28:30</a>).</p><h3>The Robe (Upper Vestment)</h3><p>Made of blue fabric (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L31">Ex. 28:31</a>). The robe must have an opening for the head (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L32">Ex. 28:32</a>). The opening is finished with a woven binding so that it does not tear (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L32">Ex. 28:32</a>).</p><p>Below, on its hem, the robe is embroidered with images of pomegranates (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L33">Ex. 28:33</a>), in threads of blue, purple and scarlet. Between the pomegranates golden bells are fastened (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L33">Ex. 28:33</a>): pomegranate, bell, pomegranate, bell — all around (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L34">Ex. 28:34</a>).</p><h3>The Turban (Head Covering)</h3><p>The turban is made of fine linen (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L39">Ex. 28:39</a>).</p><h4>The Golden Plate</h4><p>To the turban was fastened a plate of pure gold with the inscription engraved on it “HOLINESS TO THE LORD” (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L36">Ex. 28:36</a>). The plate is fastened to the front of the turban with a blue cord (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L37">Ex. 28:37</a>) and is at the level of the forehead (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L38">Ex. 28:38</a>).</p><h3>The Tunic</h3><p>The tunic is made of fine linen (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L39">Ex. 28:39</a>). Under it, linen trousers reach from the waist to the thighs (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L42">Ex. 28:42</a>).</p><h2>An Ordinary Priest</h2><p>The garments of ordinary priests have no detailed description. The garments are made for them for glory and beauty (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L40">Ex. 28:40</a>).</p><p>A priest must have a tunic (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L40">Ex. 28:40</a>), a woven sash (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L39">Ex. 28:39</a>-<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L40">40</a>), and a hat (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L40">Ex. 28:40</a>).</p><p>These garments are to be worn for being in the Tabernacle of Meeting and for performing divine services in the holy place (the temple) (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L43">Ex. 28:43</a>).</p><h2>Sacrifices</h2><p>Every day at the door of the Tabernacle of Meeting (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L42">Ex. 29:42</a>) <strong>two lambs of the first year</strong> must be offered (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L38">Ex. 29:38</a>): one in the morning and one in the evening (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L39">Ex. 29:39</a>).</p><p>Together with the lambs <strong>flour</strong>, <strong>oil</strong> and <strong>wine</strong> are offered (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L40">Ex. 29:40</a>).</p><p>The place of the offering of sacrifices will be sanctified by the glory of God (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L43">Ex. 29:43</a>).</p>

  - src: фимиам
    path: In20c_Incense
    title: Incense, Frankincense, the Censer
    meta_desc: Bible quotes about incense and frankincense
    menu: { parent: Old Testament/Worship, title: Incense, priority: 20 }
    body: |-
      <h2>Definitions</h2><p><strong>Incense</strong> — the smoke of burning frankincense (resin), or the fragrant compound that is burned.</p><p><strong>Frankincense</strong> (in Russian <em>livan</em> or <em>ladan</em>, from Arabic lādan — “fragrant resin”) — the fragrant resin of certain trees; the Russian word <em>livan</em> is connected with Lebanon. Burning frankincense gives off a pleasant fragrance. It is used during sacred rites and in preparing fragrant sacred compounds (<a href="https://bibleox.com/en/eng-nkjv/ish/30/#L34-36">Ex. 30:34-36</a>).</p><p><strong>Burning incense</strong> — the process of burning frankincense, the rising of incense smoke from it.</p><p><strong>Censer</strong> — a device (bowl) for burning fragrant compounds (with frankincense).</p><h2>Bible Quotes</h2><h3>The Fragrant Compound (with Frankincense) Is Most Holy</h3><blockquote><p>“And the LORD said to Moses: ‘<strong>Take sweet spices</strong>, stacte and onycha and galbanum, and pure <strong>frankincense</strong> with these sweet spices; there shall be equal amounts of each. You shall make of these an incense, a compound according to the art of the perfumer, salted, pure, and holy. And you shall beat some of it very fine, and put some of it before the Testimony in the tabernacle of meeting where I will meet with you. <strong>It shall be most holy</strong> to you. But as for the incense which you shall make, you shall not make any for yourselves, according to its composition. <strong>It shall be to you holy for the LORD</strong>. Whoever makes any like it, to smell it, he shall be cut off from his people’” (<a href="https://bibleox.com/en/eng-nkjv/ish/30/#L34-38">Ex. 30:34-38</a>)</p></blockquote><h3>Frankincense Is Added to the Grain Offering Together with Oil, and Then the Priest Burns the Offering</h3><blockquote><p>“When anyone offers <strong>a grain offering</strong> to the LORD, his offering shall be of fine flour. And he shall pour oil on it, and <strong>put <mark>frankincense</mark> on it</strong>. He shall bring it to Aaron’s sons, the priests, one of whom shall take from it his handful of fine flour and oil with all the frankincense. And <strong>the priest shall burn it as a memorial on the altar</strong>, an offering made by fire, a sweet aroma to the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/2/#L1-2">Lev. 2:1-2</a>)</p></blockquote><h3>There Is Also an Offering Without Frankincense</h3><blockquote><p>“then the man shall bring his wife to the priest. <strong>He shall bring the offering</strong> required for her, one-tenth of an ephah of barley meal; he shall pour no oil on it and <strong>put no frankincense on it</strong>, because it is a grain offering of jealousy, an offering for remembering, for bringing iniquity to remembrance” (<a href="https://bibleox.com/en/eng-nkjv/chis/5/#L15">Num. 5:15</a>)</p></blockquote><h3>An Altar Only for Incense</h3><p>Separately the making of an altar for burning incense is established, on which nothing else is to be burned. Incense is burned on it independently of the sacrifices, on its own. This is done every morning and every evening while the lamps are tended:</p><blockquote><p>“<strong>You shall make an altar to burn incense on</strong>; you shall make it of acacia wood. &lt;…&gt; And you shall put it <strong>before the veil that is before the ark of the Testimony</strong>, before the mercy seat that is over the Testimony, where I will meet with you. <strong>Aaron shall burn on it sweet incense every morning; when he tends the lamps, he shall burn incense on it</strong>. And when Aaron lights the lamps at twilight, he shall burn incense on it, a perpetual incense before the LORD throughout your generations. You shall not offer strange incense on it, or a burnt offering, or a grain offering; nor shall you pour a drink offering on it” (<a href="https://bibleox.com/en/eng-nkjv/ish/30/#L1,6-9">Ex. 30:1,6-9</a>)</p></blockquote><h3>Incense Symbolizes Prayers</h3><blockquote><p>“Let <strong>my prayer be set before You as incense</strong>, the lifting up of my hands as the evening sacrifice” (<a href="https://bibleox.com/en/eng-nkjv/ps/141/#L2">Ps. 141:2</a>)</p></blockquote><blockquote><p>“Now when He had taken the scroll, the four living creatures and the twenty-four elders fell down before the Lamb, each having a harp, and <strong>golden bowls full of incense, which are the prayers of the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/5/#L8">Rev. 5:8</a>)</p></blockquote><h3>Incense Is a Separate Offering to God</h3><p>Incense is mentioned on its own, listed on a par with the other sacred rites (not as an addition to something, not as something that comes only together with something else):</p><blockquote><p>“Did I not <strong>choose</strong> him out of all the tribes of Israel to be My priest, to offer upon My altar, <strong>to burn incense</strong>, and to wear an ephod before Me?” (<a href="https://bibleox.com/en/eng-nkjv/1ts/2/#L28">1 Sam. 2:28</a>)</p></blockquote><blockquote><p>“And <strong>there is not at this time</strong> prince, or prophet, or leader, or burnt offering, or sacrifice, or oblation, <strong>or incense</strong>, or place to make an offering before you and to find mercy” (<a href="https://bibleox.com/en/gr-lxx-byz/dan/3/#L38">Dan. 3:38, LXX</a>; the Prayer of Azariah; translated from the Greek: οὐδὲ θυμίαμα)</p></blockquote><blockquote><p>“For from the rising of the sun, even to its going down, My name shall be great among the Gentiles; <strong>in every place incense shall be offered to My name</strong>, and a pure offering; for My name shall be great among the nations,” says the LORD of hosts” (<a href="https://bibleox.com/en/eng-nkjv/mal/1/#L11">Mal. 1:11</a>)</p></blockquote><blockquote><p>“They made new holy vessels, and brought the lampstand, the altar <strong>of incense</strong>, and the table into the temple. Then <strong>they offered incense on the altar</strong> and lit the lamps on the lampstand, and these gave light in the temple” (<a href="https://bibleox.com/en/en-nrsv/1mak/4/#L49-50">1 Macc. 4:49-50</a>)</p></blockquote><blockquote><p>“<strong>The name of Josiah is like blended incense</strong> prepared by the skill of the perfumer; his memory is as sweet as honey to every mouth, and like music at a banquet of wine” (<a href="https://bibleox.com/en/en-nrsv/prsir/49/#L1">Sir. 49:1</a>)</p></blockquote><blockquote><p>“<strong>How glorious he was</strong> [the high priest Simon], surrounded by the people, as he came out of the house of the curtain! &lt;…&gt; <strong>like fire and incense in the censer</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/50/#L5,9">Sir. 50:5,9</a>)</p></blockquote><blockquote><p>“Let my prayer be set before You <strong>as incense</strong>, the lifting up of my hands as the evening sacrifice” (<a href="https://bibleox.com/en/eng-nkjv/ps/141/#L2">Ps. 141:2</a>)</p></blockquote><blockquote><p>“for he transgressed against the LORD his God <strong>by entering the temple of the LORD to burn incense</strong> on the altar of incense” (<a href="https://bibleox.com/en/eng-nkjv/2par/26/#L16">2 Chr. 26:16</a>)</p></blockquote><blockquote><p>“Who is this coming out of the wilderness like pillars of smoke, <strong>perfumed with myrrh and frankincense</strong>, with all the merchant’s fragrant powders?” (<a href="https://bibleox.com/en/eng-nkjv/pp/3/#L6">Song. 3:6</a>)</p></blockquote><blockquote><p>“You have not brought Me the sheep for your burnt offerings, nor have you honored Me with your sacrifices. I have not caused you to serve with grain offerings, <strong>nor wearied you with incense</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/43/#L23">Is. 43:23</a>)</p></blockquote><blockquote><p>“Then another angel, having a golden censer, came and stood at the altar. He was given <strong>much incense</strong>, that he should <strong>offer it with the prayers of all the saints upon the golden altar</strong> which was before the throne” (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3">Rev. 8:3</a>)</p></blockquote><blockquote><p>“And <strong>the smoke of the incense, with the prayers of the saints, ascended</strong> before God from the angel’s hand” (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L4">Rev. 8:4</a>)</p></blockquote><h3>God Is Offended When Incense Is Offered to False Gods</h3><blockquote><p>“I will utter My judgments against them concerning all their wickedness, because they have forsaken Me, <strong>burned incense to other gods</strong>, and worshiped the works of their own hands” (<a href="https://bibleox.com/en/eng-nkjv/ier/1/#L16">Jer. 1:16</a>)</p></blockquote><blockquote><p>“A people who provoke Me to anger continually to My face; who sacrifice in gardens, and <strong>burn incense on altars of brick</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/65/#L3">Is. 65:3</a>)</p></blockquote><blockquote><p>“Your iniquities and the iniquities of your fathers together,” says the LORD, “who have <strong>burned incense on the mountains</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/65/#L7">Is. 65:7</a>)</p></blockquote><p>The death penalty for using the sacred incense for one’s own purposes:</p><blockquote><p>“But as for the incense which you shall make, you shall not make any for yourselves, according to its composition. It shall be to you holy for the LORD. <strong>Whoever makes any like it, to smell it, he shall be cut off from his people</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/30/#L37-38">Ex. 30:37-38</a>)</p></blockquote>
