    body: |-
      <p>Tattoos and cuttings on the body are forbidden by God:</p><blockquote>“You are the children of the LORD your God; <b>you shall not cut yourselves</b> nor shave the front of your head for the dead” (<a href="https://bibleox.com/en/eng-nkjv/vtor/14/#L1">Deut. 14:1</a>)</blockquote><blockquote>“You shall not shave around the sides of your head, nor shall you disfigure the edges of your beard. <b>You shall not make any cuttings in your flesh</b> for the dead, <b>nor tattoo any marks on you</b>: I am the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L27-28">Lev. 19:27-28</a>)</blockquote><blockquote>“I beseech you therefore, brethren, by the mercies of God, <b>that you present your bodies a living sacrifice, holy, acceptable to God</b>, which is your reasonable service. And do not be conformed to this world, but be transformed by the renewing of your mind, that you may prove what is that good and acceptable and perfect will of God” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L1-2">Rom. 12:1-2</a>)</blockquote><blockquote>“And the LORD said to Moses, ‘<b>Speak to the priests, the sons of Aaron</b>, and say to them: ... They <b>shall not</b> make any bald place on their heads, nor shall they shave the edges of their beards <b>nor make any cuttings in their flesh</b>’” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1,5">Lev. 21:1,5</a>)</blockquote>

  - src: oGj1_Взятки
    path: Br19b_Bribes
    title: Bribes (a Sin)
    title_sub: Bribery
    menu: { parent: Man/Sin, title: Bribes, priority: 19 }
    body: |-
      <blockquote><p>“And <strong>you shall take no bribe, for a bribe blinds the discerning and perverts the words of the righteous</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/23/#L8">Ex. 23:8</a>)</p></blockquote><blockquote><p>“You shall not pervert justice; you shall not show partiality, <strong>nor take a bribe, for a bribe blinds the eyes of the wise and twists the words of the righteous</strong>” (<a href="https://bibleox.com/en/eng-nkjv/vtor/16/#L19">Deut. 16:19</a>)</p></blockquote><blockquote><p>“Surely oppression destroys a wise man’s reason, and <strong>a bribe debases the heart</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ekl/7/#L7">Eccl. 7:7</a>)</p></blockquote><blockquote><p>“<strong>A wicked man accepts a bribe</strong> behind the back <strong>to pervert the ways of justice</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/17/#L23">Prov. 17:23</a>)</p></blockquote><blockquote><p>“The king establishes the land by justice, but <strong>he who receives bribes overthrows it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/29/#L4">Prov. 29:4</a>)</p></blockquote><blockquote><p>“Now it came to pass when Samuel was old that he made his sons judges over Israel. &lt;...&gt; But <strong>his sons did not walk in his ways; they turned aside after dishonest gain, took bribes</strong>, and perverted justice” (<a href="https://bibleox.com/en/eng-nkjv/1ts/8/#L1,3">1 Sam. 8:1,3</a>)</p></blockquote><blockquote><p>“For the company of hypocrites will be barren, and <strong>fire will consume the tents of bribery</strong>. They conceive trouble and bring forth futility; their womb prepares deceit” (<a href="https://bibleox.com/en/eng-nkjv/iov/15/#L34-35">Job. 15:34-35</a>)</p></blockquote><blockquote><p>“Do not gather my soul with <strong>sinners</strong>, nor my life with bloodthirsty men, <strong>in whose hands is a sinister scheme, and whose right hand is full of bribes</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/26/#L9-10">Ps. 26:9-10</a>)</p></blockquote><blockquote><p>“<strong>By covetousness</strong> they will exploit you with deceptive words; for a long time their judgment has not been idle, and their destruction does not slumber. &lt;...&gt; and will receive the wages of unrighteousness, as those who count it pleasure to carouse in the daytime. They are spots and blemishes, carousing in their own deceptions while they feast with you, having eyes full of adultery and that cannot cease from sin, enticing unstable souls. <strong>They have a heart trained in covetous practices</strong>, and are accursed children. They have forsaken the right way and gone astray, <strong>following the way of Balaam</strong> the son of Beor, <strong>who loved the wages of unrighteousness</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L3,13-15">2 Pet. 2:3,13-15</a>)</p></blockquote>

  - src: yD3R_Воровство
