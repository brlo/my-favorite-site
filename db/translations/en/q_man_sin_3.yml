    body: |-
      <h2>Foul Language (Obscenity) Is a Sin</h2><blockquote><p>“Let no <strong>corrupt word</strong> proceed out of your mouth, but what is good for necessary edification, that it may impart grace to the hearers” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L29">Eph. 4:29</a>)</p></blockquote><blockquote><p>“But fornication and all uncleanness or covetousness, let it not even be named among you, as is fitting for saints; neither <strong>filthiness</strong>, nor foolish talking, nor coarse jesting, which are not fitting, but rather giving of thanks” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L3-4">Eph. 5:3-4</a>)</p></blockquote><blockquote><p>“But now you yourselves are to put off all these: anger, wrath, malice, blasphemy, <strong>filthy language</strong> out of your mouth” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L8">Col. 3:8</a>)</p></blockquote><blockquote><p>“not returning evil for evil or reviling for reviling, but on the contrary blessing, knowing that you were called to this, that you may inherit a blessing. For <strong>‘He who would love life and see good days, let him refrain his tongue from evil, and his lips from speaking deceit’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L9-10">1 Pet. 3:9-10</a>)</p></blockquote><blockquote><p>“But no man can tame <strong>the tongue</strong>. <strong>It is an unruly evil, full of deadly poison. With it we bless our God and Father, and with it we curse men, who have been made in the similitude of God.</strong> <strong><mark>Out of the same mouth proceed blessing and cursing. My brethren, these things ought not to be so</mark></strong>. Does a spring send forth fresh water and bitter from the same opening? &lt;...&gt; <strong><mark>Who is wise and understanding among you? Let him show by good conduct that his works are done in the meekness of wisdom</mark></strong>. But if you have bitter envy and self-seeking in your hearts, do not boast and lie against the truth. This wisdom does not descend from above, but is earthly, sensual, demonic. For where envy and self-seeking exist, confusion and every evil thing are there” (<a href="https://bibleox.com/en/eng-nkjv/iak/3/#L8-11,13-16">James. 3:8-11,13-16</a>)</p></blockquote><h2>What Is the Problem with Obscenity?</h2><p>The problem with obscenity (aggressive vocabulary) is that a person wants to seem and to be evil, aggressive, dangerous, tough. An evil vocabulary is only one of the ways of achieving this goal. To it are added evil emotions, looks, gestures, clothing, tattoos, habits and all the other means of self-expression. But let us return to words.</p><p>Words are made up of sounds. A combination of sounds in itself means nothing: it is neither bad nor good. Let us say we invent the word “amusadar”. “Amusadar” as yet means nothing and therefore is considered neither bad nor good. But when society puts a meaning into this or that word, a person chooses words with meanings depending on situations and on what kind of person he wants to appear in that situation. When a person wants to be polite and courteous, he uses a polite vocabulary, that is, words into which pleasant meanings have been put, showing our peaceful disposition, humility, helpfulness or something similar. But when a person wants to seem tough, dangerous, evil or aggressive, he turns to aggressive vocabulary, that is, to words into which aggressive, vulgar and other negative meanings have been put, which immediately make it clear that such a person does not have an upbringing or a mood that would restrain him from bad deeds — he wants to seem to those around him a dangerous, evil, aggressive, unbalanced, restless person, in which there is nothing good.</p><p>Moreover, when a person grows used to such an evil state, he becomes dependent on it, as on smoking tobacco or drinking spirits, as on every sinful passion. As a result, he may take various actions to bring himself into this evil state, to cultivate it inwardly: swearing even alone with himself, listening to evil music, filling himself and the space around him with gloomy symbols. That is, all this is a movement toward evil states, a cultivation in oneself of the state of malice, of the passion of anger, whereas the Lord Jesus Christ teaches us:</p><blockquote><p>“I say to you that <strong>whoever is angry with his brother without a cause shall be in danger of the judgment</strong>. <strong>And whoever says to his brother, ‘Raca!’ (an insult — note) shall be in danger of the council. But whoever says, ‘You fool!’ shall be in danger of hell fire</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L22">Matt. 5:22</a>)</p></blockquote><blockquote><p>“Blessed are <strong>the meek, for they shall inherit the earth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L5">Matt. 5:5</a>)</p></blockquote><p>And the apostle says:</p><blockquote><p>“<strong>Let all bitterness, wrath, anger, clamor, and evil speaking be put away from you, with all malice</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L31">Eph. 4:31</a>)</p></blockquote><p>And the prophet:</p><blockquote><p>“<strong>Cease from anger, and forsake wrath</strong>; do not fret — it only causes harm” (<a href="https://bibleox.com/en/eng-nkjv/ps/37/#L8">Ps. 37:8</a>)</p></blockquote><p>Here it is also worth saying something about foolish jokes:</p><blockquote><p>“nor foolish talking, nor <strong>coarse jesting, which are not fitting</strong>, but rather giving of thanks” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L4">Eph. 5:4</a>)</p></blockquote><blockquote><p>“<strong>Woe to you who laugh now, for you shall mourn and weep</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L25">Luke. 6:25</a>)</p></blockquote>

  - src: Злословие
    path: Ev16s_Evil_Speaking
    title: Evil Speaking
    menu: { parent: Man/Sin, title: Evil Speaking, priority: 16 }
    body: |-
      <h2>Evil Speaking (Insult)</h2><blockquote><p>“<strong>You give your mouth to evil</strong>, and your tongue frames deceit” (<a href="https://bibleox.com/en/eng-nkjv/ps/50/#L19">Ps. 50:19</a>)</p></blockquote><blockquote><p>“Their throat is an open tomb; with their tongues they have practiced deceit; the poison of asps is under their lips; <strong>whose mouth is full of cursing</strong> and bitterness” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L13-14">Rom. 3:13-14</a>)</p></blockquote><blockquote><p>“<strong>to speak evil of no one</strong>, to be peaceable, gentle, showing all humility to all men” (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L2">Titus. 3:2</a>)</p></blockquote><blockquote><p>“who, <strong>when He was reviled, did not revile in return</strong>; when He suffered, He did not threaten, but committed Himself to Him who judges righteously” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L23">1 Pet. 2:23</a>)</p></blockquote><blockquote><p>“Therefore, <strong>laying aside all malice</strong>, all deceit, hypocrisy, envy, and all <strong>evil speaking</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L1">1 Pet. 2:1</a>)</p></blockquote><blockquote><p>“But now you yourselves are to put off all these: anger, wrath, malice, <strong>blasphemy</strong>, filthy language out of your mouth” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L8">Col. 3:8</a>)</p></blockquote><h3>Against God</h3><blockquote><p>“And the Israelite woman’s son blasphemed the name of the LORD and cursed; and so they brought him to Moses. &lt;...&gt; Then you shall speak to the children of Israel, saying: ‘<strong>Whoever curses his God shall bear his sin</strong>. And whoever blasphemes the name of the LORD shall surely be put to death. All the congregation shall certainly stone him, the stranger as well as him who is born in the land. When he blasphemes the name of the LORD, he shall be put to death’” (<a href="https://bibleox.com/en/eng-nkjv/lev/24/#L11,15-16">Lev. 24:11,15-16</a>)</p></blockquote><h3>Against Parents</h3><blockquote><p>“And he who <strong>curses his father or his mother</strong> shall surely be put to death” (<a href="https://bibleox.com/en/eng-nkjv/ish/21/#L17">Ex. 21:17</a>)</p></blockquote><blockquote><p>“<strong>Cursed is the one who treats his father or his mother with contempt.</strong> And all the people shall say, ‘Amen!’” (<a href="https://bibleox.com/en/eng-nkjv/vtor/27/#L16">Deut. 27:16</a>)</p></blockquote><blockquote><p>“Whoever <strong>curses his father or his mother</strong>, his lamp will be put out in deep darkness” (<a href="https://bibleox.com/en/eng-nkjv/pr/20/#L20">Prov. 20:20</a>)</p></blockquote><h3>Against One’s Neighbor</h3><blockquote><p>“<strong>Do not speak evil of one another</strong>, brethren. He who speaks evil of a brother and judges his brother, speaks evil of the law and judges the law. But if you judge the law, you are not a doer of the law but a judge” (<a href="https://bibleox.com/en/eng-nkjv/iak/4/#L11">James. 4:11</a>)</p></blockquote><h3>Against Authorities and Rulers</h3><blockquote><p>“<strong>You shall not revile God</strong>, <strong>nor curse a ruler of your people</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/22/#L28">Ex. 22:28</a>) <em>(LXX 22:27: θεοὺς οὐ κακολογήσεις καὶ ἄρχοντας τοῦ λαοῦ σου οὐ κακῶς ἐρεῖς — “you shall not speak evil of the gods (judges), nor speak ill of the rulers of your people”)</em></p></blockquote><blockquote><p>“Likewise also these dreamers defile the flesh, reject authority, and <strong>speak evil of dignitaries</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L8">Jude. 1:8</a>)</p></blockquote><blockquote><p>“and especially those who walk according to the flesh in the lust of uncleanness and despise authority. They are presumptuous, self-willed. They are not afraid <strong>to speak evil of dignitaries</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L10">2 Pet. 2:10</a>)</p></blockquote>

  - src: Татуировки
    path: Tt18p_Tattoos_and_Piercing
    title: Tattoos, Piercing
