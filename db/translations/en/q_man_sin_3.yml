    body: |-
      <blockquote><p>“Do you not know that <strong>the unrighteous will not inherit the kingdom of God</strong>? <strong>Do not be deceived</strong>. Neither fornicators, nor idolaters, nor adulterers, nor homosexuals, nor sodomites, nor <strong><mark>thieves</mark></strong>, nor covetous, nor drunkards, nor revilers, nor extortioners <strong><mark>will inherit the kingdom of God</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L9-10">1 Cor. 6:9-10</a>)</p></blockquote><blockquote><p>“<strong>Let him who stole steal no longer</strong>, but rather let him labor, working with his hands what is good, that he may have something to give him who has need” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L28">Eph. 4:28</a>)</p></blockquote><blockquote><p>“For <strong><mark>I, the LORD, love justice; I hate robbery</mark></strong> for burnt offering; I will direct their work in truth, and will make with them an everlasting covenant” (<a href="https://bibleox.com/en/eng-nkjv/is/61/#L8">Isa. 61:8</a>)</p></blockquote><blockquote><p>“Then he said to me, ‘This is the curse that goes out over the face of the whole earth: “<strong>Every thief shall be expelled</strong>,” according to this side of the scroll; and, “Every perjurer shall be expelled,” according to that side of it. I will send out the curse,’ says the LORD of hosts; ‘It shall enter the house of the thief and the house of the one who swears falsely by My name. It shall remain in the midst of his house and consume it, with its timber and stones’” (<a href="https://bibleox.com/en/eng-nkjv/zah/5/#L3-4">Zech. 5:3-4</a>)</p></blockquote><blockquote><p>“Will <strong>you steal</strong>, murder, commit adultery, swear falsely, burn incense to Baal, and walk after other gods whom you do not know, <strong>and then come and stand before Me</strong> in this house which is called by My name, and say, ‘We are delivered to do all these abominations’?” (<a href="https://bibleox.com/en/eng-nkjv/ier/7/#L9-10">Jer. 7:9-10</a>)</p></blockquote><blockquote><p>“And God spoke all these words, saying: &lt;...&gt; <strong>You shall not steal</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L1,15">Ex. 20:1,15</a>)</p></blockquote><blockquote><p>“And the LORD spoke to Moses, saying, &lt;...&gt; ‘<strong>You shall not steal</strong>, nor deal falsely, nor lie to one another’” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L1,11">Lev. 19:1,11</a>)</p></blockquote><hr><blockquote><p>“Again, <strong><mark>when I say to the wicked, ‘You shall surely die,’ if he turns from his sin</mark></strong> and does what is lawful and right, <strong><mark>if the wicked restores the pledge, gives back what he has stolen, and walks in the statutes of life</mark></strong> without committing iniquity, <strong><mark>he shall surely live</mark></strong>; he shall not die. <strong>None of his sins which he has committed shall be remembered against him; he has done what is lawful and right; he shall surely live</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iez/33/#L14-16">Ezek. 33:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>Then Zacchaeus stood and said to the Lord, ‘Look, Lord, I give half of my goods to the poor; and if I have taken anything from anyone by false accusation, I restore fourfold.’</mark></strong> And Jesus said to him, ‘<strong><mark>Today salvation has come to this house</mark></strong>, because he also is a son of Abraham; for the Son of Man has come to seek and to save that which was lost’” (<a href="https://bibleox.com/en/eng-nkjv/lk/19/#L8-10">Luke. 19:8-10</a>)</p></blockquote>

  - src: человекоугодие
    path: Mp20l_Men_Pleasing_Partiality
    title: Men-Pleasing (Partiality)
    menu: { parent: Man/Sin, title: Men-Pleasing, priority: 20 }
    body: |-
      <blockquote>“My brethren, do not hold the faith of our Lord Jesus Christ, the Lord of glory, <b>with partiality</b>. For if there should come into your assembly a man with gold rings, in fine apparel, and there should also come in a poor man in filthy clothes, and <b>you pay attention to the one wearing the fine clothes and say to him, ‘You sit here in a good place,’ and say to the poor man, ‘You stand there,’</b> or, ‘Sit here at my footstool,’ have you not shown partiality among yourselves, and become judges with evil thoughts? ... If you really fulfill the royal law according to the Scripture, ‘You shall love your neighbor as yourself,’ you do well; but <b>if you show partiality, you commit sin</b>, and are convicted by the law as transgressors” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L1-4,8-9">James. 2:1-4,8-9</a>)</blockquote><blockquote>“Bondservants, obey in all things your masters according to the flesh, <b>not with eyeservice, as men-pleasers,</b> but in sincerity of heart, fearing God” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L22">Col. 3:22</a>)</blockquote><blockquote>“Bondservants, be obedient to those who are your masters according to the flesh, with fear and trembling, in sincerity of heart, as to Christ; <b>not with eyeservice, as men-pleasers</b>, but as bondservants of Christ, doing the will of God from the heart, with goodwill doing service, as to the Lord, and not to men” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L5-7">Eph. 6:5-7</a>)</blockquote><blockquote>“There they are in great fear where no fear was, for <b>God has scattered the bones of men-pleasers</b>; they were put to shame, for God has despised them” (<a href="https://bibleox.com/en/gr-lxx-byz/ps/52/#L5">Ps. 52:5 LXX</a>) <em>(translated from the Greek: ὁ θεὸς διεσκόρπισεν ὀστᾶ ἀνθρωπαρέσκων)</em></blockquote><blockquote>“How long will you judge unjustly, and <b>show partiality</b> to the wicked?” (<a href="https://bibleox.com/en/eng-nkjv/ps/82/#L2">Ps. 82:2</a>)</blockquote><blockquote>“You shall do no injustice in judgment. <b>You shall not be partial to the poor, nor honor the person of the mighty</b>. In righteousness you shall judge your neighbor” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L15">Lev. 19:15</a>)</blockquote><blockquote>“These things also belong to the wise: <b>It is not good to show partiality in judgment</b>” (<a href="https://bibleox.com/en/eng-nkjv/pr/24/#L23">Prov. 24:23</a>)</blockquote><blockquote>“<b>To show partiality is not good</b>, because for a piece of bread a man will transgress” (<a href="https://bibleox.com/en/eng-nkjv/pr/28/#L21">Prov. 28:21</a>)</blockquote><blockquote>“he will put on righteousness as a breastplate, and wear <b>impartial justice</b> as a helmet” (<a href="https://bibleox.com/en/en-nrsv/prs/5/#L18">Wis. 5:18</a>)</blockquote><blockquote>“Of the following things do not be ashamed, and <b>do not sin to save face</b>: Do not be ashamed of the law of the Most High and his covenant, and of rendering judgment to acquit the ungodly” (<a href="https://bibleox.com/en/en-nrsv/prsir/42/#L1-2">Sir. 42:1-2</a>) <em>(Greek: μὴ λάβῃς πρόσωπον τοῦ ἁμαρτάνειν — “do not show partiality so as to sin”)</em></blockquote><blockquote>“Therefore I also have made you contemptible and base before all the people, because you have not kept My ways but <b>have shown partiality</b> in the law” (<a href="https://bibleox.com/en/eng-nkjv/mal/2/#L9">Mal. 2:9</a>)</blockquote><blockquote>“These are grumblers, complainers, walking according to their own lusts; and they mouth great swelling words, <b>flattering people to gain advantage</b>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L16">Jude. 1:16</a>) <em>(Greek: θαυμάζοντες πρόσωπα ὠφελείας χάριν — “admiring persons for the sake of gain”)</em></blockquote>

  - src: грех-гомосексуализм
    path: Hm25s_Homosexuality
    title: Homosexuality (Sodomy)
    meta_desc: The Bible on the sin of homosexuality, on the acts of gays and lesbians
    menu: { parent: Man/Sin, title: Homosexuality, priority: 25 }
    body: |-
      <p>Homosexuality is a sin and an abomination before God:</p><blockquote>“You shall not lie with a male as with a woman. It is an abomination” (<a href="https://bibleox.com/en/eng-nkjv/lev/18/#L22">Lev. 18:22</a>)</blockquote><blockquote>“If a man lies with a male as he lies with a woman, both of them have committed an abomination. They shall surely be put to death. Their blood shall be upon them” (<a href="https://bibleox.com/en/eng-nkjv/lev/20/#L13">Lev. 20:13</a>)</blockquote><p>Homosexuality is a shameful passion that receives its penalty:</p><blockquote>“For this reason God gave them up to <b>vile passions</b>. <b>For even their women exchanged the natural use for what is against nature. Likewise also the men, leaving the natural use of the woman, burned in their lust for one another, men with men committing what is shameful, and receiving in themselves the penalty of their error which was due</b>. And even as they did not like to retain God in their knowledge, God gave them over to a debased mind, <b>to do those things which are not fitting</b>; &lt;...&gt; who, knowing the righteous judgment of God, that <b>those who practice such things are deserving of death</b>, not only do the same but also <b>approve of those who practice them</b>” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L26-28,32">Rom. 1:26-28,32</a>)</blockquote><p>Homosexuality is a mortal sin:</p><blockquote>“Do you not know that <b>the unrighteous will not inherit the kingdom of God</b>? Do not be deceived. Neither fornicators, nor idolaters, nor adulterers, nor homosexuals, nor <b>sodomites</b>, nor thieves, nor covetous, nor drunkards, nor revilers, nor extortioners will inherit the kingdom of God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L9-10">1 Cor. 6:9-10</a>)</blockquote><p>Homosexuality is lawlessness, forbidden by the commandments, contrary to sound teaching from God:</p><blockquote>“knowing this: that the law is not made for a righteous person, but <b>for the lawless</b> and insubordinate, for the ungodly and for sinners, for the unholy and profane, for murderers of fathers and murderers of mothers, for manslayers, for fornicators, <b>for sodomites</b>, for kidnappers, for liars, for perjurers, and if there is any other thing that is <b>contrary to sound doctrine</b>, according to the glorious gospel of the blessed God which was committed to my trust” (<a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L9-11">1 Tim. 1:9-11</a>)</blockquote><p>Sodom and Gomorrah were destroyed for the sin of homosexuality:</p><blockquote>“Now before they lay down, the men of the city, <b>the men of Sodom</b>, both old and young, all the people from every quarter, surrounded the house. And they called to Lot and said to him, ‘<b>Where are the men who came to you tonight? Bring them out to us that we may know them carnally</b>.’ So Lot went out to them through the doorway, shut the door behind him, and said, ‘Please, my brethren, do not do so wickedly!’ ... But the men reached out their hands and pulled Lot into the house with them, and shut the door. And they struck the men who were at the doorway of the house with blindness, both small and great, so that they became weary trying to find the door. Then the men said to Lot, ‘Have you anyone else here? Son-in-law, your sons, your daughters, and whomever you have in the city — take them out of this place! For <b>we will destroy this place, because the outcry against them has grown great before the face of the LORD, and the LORD has sent us to destroy it</b>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/19/#L4-7,10-13">Gen. 19:4-7,10-13</a>)</blockquote><blockquote>“as Sodom and Gomorrah, and the cities around them in a similar manner to these, having given themselves over to sexual immorality and <b>gone after strange flesh, are set forth as an example, suffering the vengeance of eternal fire</b>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L7">Jude. 1:7</a>)</blockquote><p>Nations were driven out of the land promised by God to the Hebrews for the sins of homosexuality:</p><blockquote>“Observe what I command you this day. Behold, <b>I am driving out from before you the Amorite and the Canaanite and the Hittite and the Perizzite and the Hivite and the Jebusite</b>” (<a href="https://bibleox.com/en/eng-nkjv/ish/34/#L11">Ex. 34:11</a>)</blockquote><blockquote>“<b>You shall not lie with a male as with a woman</b>. It is an abomination. &lt;...&gt; Do not defile yourselves with any of these things; for <b>by all these the nations are defiled, which I am casting out before you</b>” (<a href="https://bibleox.com/en/eng-nkjv/lev/18/#L22,24">Lev. 18:22,24</a>)</blockquote><blockquote>“<b>If a man lies with a male as he lies with a woman, both of them have committed an abomination</b>. They shall surely be put to death. Their blood shall be upon them. &lt;...&gt; <b>And you shall not walk in the statutes of the nation which I am casting out before you; for they commit all these things, and therefore I abhor them</b>” (<a href="https://bibleox.com/en/eng-nkjv/lev/20/#L13,23">Lev. 20:13,23</a>)</blockquote>

  - src: XBGN_Трансвестизм
    path: Tv26s_Transvestism
    title: Transvestism
    menu: { parent: Man/Sin, title: Transvestism, priority: 26 }
    body: |-
      <p><strong>Transvestism</strong> (from Latin <em>trans</em> — “across, over” and <em>vestitus</em> — “clothed”) is a person’s obsessive striving to wear clothing traditionally associated with the opposite sex.</p><blockquote><p><em>“</em><strong><em>A woman shall not wear anything that pertains to a man, nor shall a man put on a woman’s garment</em></strong><em>, for all who do so are an abomination to the LORD your God” (</em><a href="https://bibleox.com/en/eng-nkjv/vtor/22/#L5"><em>Deut. 22:5</em></a><em>)</em></p></blockquote>

  - src: родовые-грехи
    path: Ac50s_Ancestral_Sins
    title: Ancestral Sins
    menu: { parent: Man/Sin, title: Ancestral Sins (No Such Sin), priority: 500 }
    body: |-
      <p>There are no ancestral sins. This notion was invented and is used, as a rule, by so-called “folk healers”, psychics and sorcerers. In the Church there is the notion of original sin, but that is a different notion (see <a href="https://bibleox.com/ru/ru/w/7XucD5kC_%D0%92%D1%81%D0%B5%D0%BE%D0%B1%D1%89%D0%BD%D0%BE%D1%81%D1%82%D1%8C_%D0%BF%D0%B5%D1%80%D0%B2%D0%BE%D1%80%D0%BE%D0%B4%D0%BD%D0%BE%D0%B3%D0%BE_%D0%B3%D1%80%D0%B5%D1%85%D0%B0">quotes</a>). From original sin only the holy baptism of the Church completely frees a person, and not sorcerers and psychics, who existed even before the Incarnation of God, the Lord Jesus Christ, but did not do what Christ did.</p><p>God asks of everyone for his own sin. However, the consequences both of the righteous life of parents and of the vicious life of parents are laid upon children. This happens in the same way as when a parent ruins his health (with alcohol, drugs), he thereby harms the health of his child, although the child is not guilty of the parents ruining their health. Before God the child bears no responsibility for the parents’ alcoholism.</p><p>This thought can be understood in detail from the following biblical words:</p><blockquote><p>“<strong>What do you mean when you use this proverb concerning the land of Israel, saying: ‘The fathers have eaten sour grapes, and the children’s teeth are set on edge’?</strong> As I live,” says the Lord GOD, “you shall no longer use this proverb in Israel. Behold, all souls are Mine; the soul of the father as well as the soul of the son is Mine; <strong>the soul who sins shall die. <mark>But if a man is just and does what is lawful and right</mark></strong>; if he has not eaten on the mountains, nor lifted up his eyes to the idols of the house of Israel, nor defiled his neighbor’s wife, nor approached a woman during her impurity; if he has not oppressed anyone, but has restored to the debtor his pledge; has robbed no one by violence, but has given his bread to the hungry and covered the naked with clothing; if he has not exacted usury nor taken any increase, but has withdrawn his hand from iniquity and executed true judgment between man and man; <strong><mark>if he has walked in My statutes and kept My judgments faithfully — he is just; he shall surely live!</mark></strong>” says the Lord GOD. “<strong><mark>If he begets a son who is a robber</mark></strong> or a shedder of blood, who does any of these things and does none of those duties, but has eaten on the mountains or defiled his neighbor’s wife; if he has oppressed the poor and needy, robbed by violence, not restored the pledge, lifted his eyes to the idols, or committed abomination; if he has exacted usury or taken increase — <strong><mark>shall he then live? He shall not live!</mark></strong> If he has done any of these abominations, he <strong><mark>shall surely die; his blood shall be upon him</mark></strong>. <strong><mark>If, however, he begets a son who sees all the sins which his father has done, and considers but does not do likewise</mark></strong>; who has not eaten on the mountains, nor lifted his eyes to the idols of the house of Israel, nor defiled his neighbor’s wife; has not oppressed anyone, nor withheld a pledge, nor robbed by violence, but has given his bread to the hungry and covered the naked with clothing; who has withdrawn his hand from the poor and not received usury or increase, <strong><mark>but has executed My judgments and walked in My statutes — he shall not die for the iniquity of his father; he shall surely live!</mark></strong> <strong><mark>As for his father, because he cruelly oppressed</mark></strong>, robbed his brother by violence, and did what is not good among his people, behold, he <strong><mark>shall die for his iniquity</mark></strong>. Yet you say, <strong><mark>‘Why should the son not bear the guilt of the father?’ Because the son has done what is lawful and right, and has kept all My statutes and observed them, he shall surely live. The soul who sins shall die. The son shall not bear the guilt of the father, nor the father bear the guilt of the son. The righteousness of the righteous shall be upon himself, and the wickedness of the wicked shall be upon himself</mark></strong>. But <strong><mark>if a wicked man turns from all his sins which he has committed, keeps all My statutes, and does what is lawful and right, he shall surely live; he shall not die. None of the transgressions which he has committed shall be remembered against him; because of the righteousness which he has done, he shall live</mark></strong>. Do I have any pleasure at all that the wicked should die?” says the Lord GOD, “and not that he should turn from his ways and live? <strong><mark>But when a righteous man turns away from his righteousness and commits iniquity, and does according to all the abominations that the wicked man does, shall he live? All the righteousness which he has done shall not be remembered; because of the unfaithfulness of which he is guilty and the sin which he has committed, because of them he shall die.</mark></strong> Yet you say, ‘The way of the Lord is not fair.’ Hear now, O house of Israel, is it not My way which is fair, and your ways which are not fair? When a righteous man turns away from his righteousness, commits iniquity, and dies in it, it is because of the iniquity which he has done that he dies. Again, when a wicked man turns away from the wickedness which he committed, and does what is lawful and right, he preserves himself alive. Because he considers and turns away from all the transgressions which he committed, he shall surely live; he shall not die. Yet the house of Israel says, ‘The way of the Lord is not fair.’ O house of Israel, is it not My ways which are fair, and your ways which are not fair? Therefore I will judge you, O house of Israel, every one according to his ways,” says the Lord GOD. “Repent, and turn from all your transgressions, so that iniquity will not be your ruin” (<a href="https://bibleox.com/en/eng-nkjv/iez/18/#L2-30">Ezek. 18:2-30</a>)</p></blockquote><p>But people often have the thought that the guilt for the sins of parents is nevertheless passed on to children. This thought arises after reading the following biblical verse:</p><blockquote><p>“For I, the LORD your God, am a jealous God, <strong>visiting the iniquity of the fathers upon the children to the third and fourth generations <u>of those who hate Me</u></strong>, but showing mercy to thousands, to those who love Me and keep My commandments” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L5-6">Ex. 20:5-6</a>)</p></blockquote><p>This speaks of people who from generation to generation continue to hate God: “<strong>to the third and fourth generations <u>of those who hate Me</u></strong>”. Such people will be punished for their hatred of God. Why? Although the Lord endured the hatred of his father, grandfather and great-grandfather, since this hatred continues already in the 3rd-4th generation, the end of patience comes and punishment overtakes such people.</p><p>Venerable Ephrem the Syrian:</p><blockquote><p>Vv. 5-6, 13-14, 16-17, 22-26. On the mountain God gives the commandments and says: I am the Lord, visiting the sins of the fathers upon the children to the third and fourth generation of those who hate Me. <strong><mark>God, in His longsuffering, endures an evil man, and his son and grandson; but if they do not repent, He lays punishment on the head of the fourth, as soon as he in his evil is like his fathers</mark></strong>.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Efrem_Sirin/tolkovanie-na-knigu-iskhod/20">Commentary on Exodus 20</a>, in Russian; translated from the Russian)</p>
