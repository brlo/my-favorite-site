  body: '<h2>The Conciliar Condemnation of Catholicism</h2><h3>The Third Ecumenical
    Council (431) — against changing the Symbol of Faith and against the filioque</h3><blockquote><p>When
    these things had been read, the holy Synod decreed that <strong><mark>it is unlawful
    for any man to bring forward, or to write, or to compose a different (ἑτέραν)
    Faith as a rival to that established by the holy Fathers assembled with the Holy
    Ghost in Nicæa</mark></strong>. But those who shall dare to compose a different
    faith, or to introduce or offer it to persons desiring to turn to the acknowledgment
    of the truth, whether from Heathenism or from Judaism, or from any heresy whatsoever,
    shall be deposed, if they be bishops or clergymen; bishops from the episcopate
    and clergymen from the clergy; and if they be laymen, they shall be <strong><mark>anathematized</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-third-ecumenical-council-the-council-of-ephesus-431#HH-Canon-VII">The
    Third Ecumenical Council, Canon 7</a>) *At this council representatives of the
    Roman Church were present: bishops Arcadius and Projectus and presbyter Philip.</p><blockquote><p>Resolutely
    <strong><mark>we refuse to endure that anyone should shake the faith or the symbol
    of faith</mark>, set forth once by the holy fathers of Nicaea. And <mark>we will
    by no means permit either ourselves or any one else to alter one word of what
    is there set down, nor to let fall a single syllable</mark>, remembering the words
    of him who said: Do not remove the ancient landmark Which your fathers have set
    (Prov. 22:28)</strong>. For it was not they themselves who spoke, but the very
    <strong><mark>Spirit of God and the Father (Matt. 10:20), who proceedeth from
    him</mark></strong>, though he is not alien to the Son — as regards his essence,
    that is; and this is confirmed by the words of the saints who handed down the
    mysteries.</p></blockquote><p>(Letter of Cyril, archbishop of Alexandria, to John,
    bishop of Antioch, sent with Paul, bishop of Emesa)</p><blockquote><p>The holy
    and great synod at Ephesus necessarily foresaw that <strong>no other exposition
    of the faith ought to be introduced into the churches of God than that which they
    had, which our most blessed fathers defined, speaking by the Holy Spirit</strong>.</p></blockquote><p>(Letter
    of Cyril to Acacius, bishop of Melitene, who had reproached him by letter for
    having agreed with the Easterns)</p><h3>The Fourth Ecumenical Council — against
    changing the Symbol of Faith</h3><blockquote><p>These things, therefore, having
    been expressed by us with the greatest accuracy and attention, the <strong>holy
    Ecumenical Synod defines that no one shall be suffered to bring forward a different
    faith (ἑτέραν πίστιν), nor to write, nor to put together, nor to excogitate, nor
    to teach it to others. But such as <mark>dare</mark></strong> either to put together
    another faith, or to bring forward or to teach or to deliver a <strong><mark>different
    Creed</mark></strong> (ἕτερον σύμβολον) to as wish to be converted to the knowledge
    of the truth, from the Gentiles, or Jews or any heresy whatever, if they be Bishops
    or clerics let them be deposed, the Bishops from the Episcopate, and the clerics
    from the clergy; but if they be monks or laics: <strong><mark>let them be anathematized</mark>.</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-fourth-ecumenical-council-the-council-of-chalcedon-451">The
    Fourth Ecumenical Council, Act 5</a>) *Concilium Chalcedonense, Actio IV // ACO.
    T. 2, vol. 1(2), P. 130</p><blockquote><p><strong>As the holy and blessed and
    Ecumenical Synod holds fast and follows the rule of faith which was set forth
    by the fathers at Nice, it also confirms the faith set forth by the Synod of 150
    fathers gathered at Constantinople</strong> at the bidding of the great Theodosius
    of blessed memory. Moreover the exposition of their faith, of the illustrious
    Cyril of blessed memory set forth at the Council of Ephesus (in which Nestorius
    was condemned) is received. And in the third place the writings of that blessed
    man, Leo, Archbishop of all the churches, who condemned the heresy of Nestorius
    and Eutyches, shew what the true faith is. Likewise the <strong>holy Synod holds
    this faith, this it follows — nothing further can it add nor can it take aught
    away</strong>.” When this had been translated into Greek by Beronician, the devout
    secretary of the divine consistory, the most reverend bishops cried out: “<strong>So
    we all believe</strong>, so we were baptized, so we baptize, so we have believed,
    so we now believe”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-fourth-ecumenical-council-the-council-of-chalcedon-451">The
    Fourth Ecumenical Council, Act 4</a>)</p><h3>The Council of Constantinople (1484)
    — against the filioque</h3><blockquote><p>“Therefore with soul and mind we believe,
    and with the tongue we preach and confess, that the almighty and <strong>Holy
    Spirit by that ineffable and eternal procession (πρόοδον), according to the Lord’s
    word, proceedeth (ἐκπορεύεται) from God the Father, that is, from the Father’s
    hypostasis alone according to his essence</strong>, the Son contributing nothing
    whatsoever to the procession of the Holy Spirit and not mediating in it, lest
    two causes or two beginnings be imagined in the Trinity in the Uncreated Divinity,
    since to beget and to bring forth is the property not of the essence but of the
    hypostasis, and of the Father’s hypostasis alone. Thus we acknowledge that the
    one source and cause (αἰτία) of those who are from him is God the Father &lt;…&gt;
    But <strong><mark>those who think otherwise about the procession of the Holy Spirit</mark>,
    or preach it, or hold this opinion contrary to the truth and vainly proclaim it,
    we <mark>turn away from as heretics and deliver over to anathema</mark></strong>.”</p></blockquote><p>(The
    Tomos of the Council of Constantinople of 1484)</p><h3>The Encyclical Letter of
    the Patriarchs (1848) — against Papism and the filioque</h3><p>The general attitude
    of the Church is set forth. The letter is signed by the patriarchs, synods, and
    bishops of the Orthodox Churches (see the end of the letter):</p><blockquote><p>§
    4. <strong><mark>Of the heresies</mark></strong>, which spread by what destinies
    God knows over the greater part of the universe, there was once Arianism, and
    now there is <strong><mark>Papism</mark></strong></p><p>&lt;…&gt;</p><p>Therefore
    the one, holy, catholic and apostolic Church, following the holy Fathers of East
    and West, as of old it proclaimed at the time of our Fathers, so now again proclaims
    synodically that <strong>this newly-introduced <mark>opinion, that the Holy Spirit
    proceedeth from the Father and the Son, is a real heresy</mark>, and <mark>its
    followers, whoever they may be, are heretics</mark></strong>, according to the
    aforementioned conciliar definition of the most holy pope Damasus; <strong>the
    societies composed of them are <mark>societies of heretics</mark>, and all spiritual
    liturgical communion of the orthodox children of the conciliar Church with them
    is lawless</strong>, by force especially of the seventh canon of the Third Ecumenical
    Council.</p><p>&lt;…&gt;</p><p><strong>Condemned by many holy Councils of the
    four eastern Patriarchs</strong>;</p><p>11. <strong><mark>Anathematized, as an
    innovation and an enlargement of the Symbol</mark></strong>, at the (so-called)
    eighth ecumenical Council, convened in Constantinople for the pacification of
    the Churches of East and West;</p><p>&lt;…&gt;</p><p>not only the Roman throne,
    which is honored as having received privilege from St Peter by tradition alone,
    but also that which is represented in the holy Scripture as <strong>the chief
    throne of St Peter — that is, Antioch</strong>, whose Church, according to the
    testimony of St Basil (letter 48 to Athanasius the Great), is “the chief of all
    the Churches in the universe”, and, most important of all, of which the Second
    Ecumenical Council in its letter to the Council of the West (to the most honored
    and most God-beloved brethren and fellow-ministers Damasus, Ambrose, Britton,
    Valerian, and the rest) testifies thus: “To the oldest and, in truth, apostolic
    Church at Antioch in Syria, <strong>where first was accepted the honored name
    of Christians</strong>” — <strong>and this apostolic Church of Antioch, we say,
    never had the privilege</strong> — not to be judged by the divine Scripture and
    conciliar definitions, out of respect for it as the true throne of St Peter. But
    what do we say? <strong>St Peter himself was personally judged before all</strong>
    according to the truth of the Gospel (Gal. 2:14) and, according to the testimony
    of Scripture, was found blameworthy and not walking uprightly.</p><p>&lt;…&gt;</p><p>For,
    if <strong>the Church of Christ</strong> were not <strong>founded on the immovable
    rock of Peter’s <u>confession</u></strong>: You are the Christ, the Son of the
    living God (which was the common answer of the Apostles to the question put to
    them: But who do you say that I am? [Matt. 16:15-16], as the divine Fathers of
    East and West explain to us), — then even Kepha himself would be for it a weak
    foundation, <strong>all the more the pope</strong>, who, having appropriated to
    himself the keys of the Kingdom of Heaven — how he disposed of them is known from
    History.</p><p>&lt;…&gt;</p><p>we consider it our indispensable duty, in consequence
    of our patriarchal and <strong>synodical decision</strong></p></blockquote><p>(The
    Encyclical Letter of the One, Holy, Catholic and Apostolic Church to all Orthodox
    Christians, 1848)</p><h2>The Conciliar Condemnation of Protestantism</h2><h3>The
    Second Ecumenical Council — against those who do not confess the remission of
    sins in holy Baptism (in water)</h3><blockquote><p><em>We believe in one God,
    the Father Almighty, maker of heaven and earth and of all things visible and invisible.
    And in one Lord Jesus Christ, the only begotten Son of God, begotten of his Father
    before all worlds, Light of Light, very God of very God, begotten not made, being
    of one substance with the Father, by whom all things were made. Who for us men
    and for our salvation came down from heaven and was incarnate by the Holy Ghost
    and the Virgin Mary, and was made man, and was crucified also for us under Pontius
    Pilate. He suffered and was buried, and the third day he rose again according
    to the Scriptures, and ascended into heaven, and sitteth at the Right Hand of
    the Father. And he shall come again with glory to judge both the quick and the
    dead. Whose kingdom shall have no end. And in the Holy Ghost, the Lord and Giver-of-Life,
    who proceedeth from the Father, who with the Father and the Son together is worshipped
    and glorified, who spake by the prophets. And in one, holy, Catholic and Apostolic
    Church. </em><strong><em>We acknowledge one <mark>Baptism for the remission of
    sins</mark></em></strong><em>, and we look for the resurrection of the dead and
    the life of the world to come. Amen.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-second-ecumenical-council-the-first-council-of-constantinople-381#HH-The-Holy-Creed-Which-the-150-Holy-Fathers-Set-Forth-Which-is-Consonant-with-the-Holy-and-Great-Synod-of-Nice">The
    Creed</a>)</p><h3>The Third Ecumenical Council — against those who do not confess
    the Virgin Mary to be the Mother of God</h3><blockquote><p><strong>Anathematism
    I</strong></p><p><strong><mark>If anyone will not confess</mark></strong> that
    the Emmanuel is very God, and that therefore <strong><mark>the Holy Virgin is
    the Mother of God</mark></strong> (Θεοτόκος), inasmuch as in the flesh she bore
    the Word of God made flesh [as it is written, “The Word was made flesh”] <strong><mark>let
    him be anathema</mark></strong>.</p><p>Explanation</p><p>&lt;…&gt; Since, then,
    some reject his birth after the flesh from the holy Virgin for the salvation of
    all — a birth summoning him not to the beginning of his being, but to his becoming
    like unto us, that he might deliver us from death and corruption: for this reason
    <strong><mark>our first anathematism strikes their unbelief, confesses the orthodox
    faith, declaring that</mark></strong> <strong>the Emmanuel was truly God, and
    therefore that <mark>the holy Virgin is the Mother of God</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-third-ecumenical-council-the-council-of-ephesus-431#HH-Anathematism-I">The
    Anathematisms</a>)</p><h3>The Council of Carthage (393–419) — against those who
    deny the necessity of the baptism of infants</h3><p>The decisions of some local
    councils were ratified by the second canon of the Sixth Ecumenical Council and,
    as this Ecumenical Council itself writes, have a universally binding character
    for the whole Church. Thus this canon received the sanction of an ecumenical council
    (in more detail):</p><blockquote><p><em>Likewise it seemed good that </em><strong><em><mark>whosoever
    denies that infants newly from their mother’s wombs should be baptized</mark></em></strong><em>
    </em><strong><em>or</em></strong><em> </em><strong><em><mark>says that baptism
    is for remission of sins, but that they derive from Adam no original sin, which
    needs to be removed by the laver of regeneration</mark></em></strong><em>, from
    whence the conclusion follows, that in them the form of baptism for the remission
    of sins, is to be understood as false and not true, </em><strong><em><mark>let
    him be anathema.</mark></em></strong><em> For no otherwise can be understood what
    the Apostle says, “By one man sin is come into the world, and death through sin,
    and so death passed upon all men in that all have sinned” (Rom. 5:12), than the
    Catholic Church everywhere diffused has always understood it. For on account of
    this rule of faith </em>even infants, who could have committed as yet no sin themselves,
    therefore are truly baptized for the remission of sins, in order that what in
    them is the result of generation may be cleansed by regeneration.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-canons-of-the-synods-of-sardica-carthage-and-constantinople-2#HH-Canon-CX">The
    Canons of the Council of Carthage, Canon 110 (124)</a>)</p><p>It should be borne
    in mind that this 124th canon is directed against the teaching of Pelagius, who
    asserted that infants are born in the state of Adam before the fall and do not
    need Baptism for salvation. The council, however, decrees that infants <strong>need</strong>
    Baptism (for salvation) and inherit original sin, and commands that those who
    deny this be anathematized.</p><h3>The Definition of the Seventh Ecumenical Council
    (787) — on the veneration of icons, the Gospels, the cross, and the holy relics</h3><blockquote><p><em>We
    believe…life of the world to come. Amen. We detest and anathematize Arius and
    all the sharers of his absurd opinion; also Macedonius and those who following
    him are well styled “Foes of the Spirit” (Pneumatomachi). We confess that our
    Lady, St. Mary, is properly and truly the Mother of God, because she was the Mother
    after the flesh of One Person of the Holy Trinity, to wit, Christ our God, as
    the Council of Ephesus has already defined when it cast out of the Church the
    impious Nestorius with his colleagues, because he taught that there were two Persons
    [in Christ]. With the Fathers of this synod we confess that he who was incarnate
    of the immaculate Mother of God and Ever-Virgin Mary has two natures, recognizing
    him as perfect God and perfect man, as also the Council of Chalcedon hath promulgated,
    expelling from the divine Atrium [αὐλῆς] as blasphemers, Eutyches and Dioscorus;
    and placing in the same category Severus, Peter and a number of others, blaspheming
    in divers fashions. Moreover, with these we anathematize the fables of Origen,
    Evagrius, and Didymus, in accordance with the decision of the Fifth Council held
    at Constantinople. We affirm that in Christ there be two wills and two operations
    according to the reality of each nature, as also the Sixth Synod, held at Constantinople,
    taught, casting out Sergius, Honorius, Cyrus, Pyrrhus, Macarius, and those who
    agree with them, and all those who are unwilling to be reverent. </em><strong><em>To
    make our confession short, we keep unchanged all the ecclesiastical traditions
    handed down to us, whether in writing or verbally, one of which is the making
    of pictorial representations, agreeable to the history of the preaching of the
    Gospel, a tradition useful in many respects, but especially in this, that so the
    incarnation of the Word of God is shown forth as real and not merely phantastic,
    for these have mutual indications and without doubt have also mutual significations.</em></strong><em>
    We, therefore, following the royal pathway and the divinely inspired authority
    of our Holy Fathers and the traditions of the Catholic Church (for, as we all
    know, the Holy Spirit indwells her), </em><strong><em>define with all certitude
    and accuracy that just as the figure of the precious and life-giving Cross, so
    also the venerable and holy images</em></strong><em>, as well in painting and
    mosaic as of other fit materials, should be set forth in the holy churches of
    God, and on the sacred vessels and on the vestments and on hangings and in pictures
    both in houses and by the wayside, to wit, </em><strong><em>the figure of our
    Lord God and Saviour Jesus Christ, of our spotless Lady, the Mother of God, of
    the honourable Angels, of all Saints and of all pious people. For by so much more
    frequently as they are seen in artistic representation, by so much more readily
    are men lifted up to the memory of their prototypes, and to a longing after them;
    and to these should be given due salutation and honourable reverence (ἀσπασμὸν
    καὶ τιμητικὴν προσκύνησιν), not indeed that true worship of faith (λατρείαν) which
    pertains alone to the divine nature</em></strong><em>. </em><strong><em>But to
    these, as to the figure of the precious and life-giving Cross and to the Book
    of the Gospels and to the other holy objects, incense and lights may be offered
    according to ancient pious custom. For the honour which is paid to the image passes
    on to that which the image represents, and he who reveres the image reveres in
    it the subject represented.</em></strong><em> For thus the teaching of our holy
    Fathers, that is the tradition of the Catholic Church, which from one end of the
    earth to the other hath received the Gospel, is strengthened. Thus we follow Paul,
    who spake in Christ, and the whole divine Apostolic company and the holy Fathers,
    holding fast the traditions which we have received. So we sing prophetically the
    triumphal hymns of the Church, “Rejoice greatly, O daughter of Sion; Shout, O
    daughter of Jerusalem. Rejoice and be glad with all thy heart. The Lord hath taken
    away from thee the oppression of thy adversaries; thou art redeemed from the hand
    of thine enemies. The Lord is a King in the midst of thee; thou shalt not see
    evil any more, and peace be unto thee forever” (Zeph. 3:14-15).</em></p><p><em>Thus
    </em><strong><em><mark>those, therefore who dare to think or teach otherwise,
    or as wicked heretics to spurn the traditions of the Church and to invent some
    novelty, or else to reject some of those things which the Church hath received
    </mark><u><mark>(e.g., the Book of the Gospels</mark></u><mark>, or </mark><u><mark>the
    image of the cross</mark></u><mark>, or </mark><u><mark>the pictorial icons</mark></u><mark>,
    or </mark><u><mark>the holy reliques of a martyr</mark></u><mark>), or evilly
    and sharply to devise anything subversive of </mark><u><mark>the lawful traditions
    of the Catholic Church</mark></u><mark> or to </mark><u><mark>turn to common uses
    the sacred vessels or the venerable monasteries</mark></u><mark>,</mark></em></strong><em>
    if they be Bishops or Clerics, we command that they be deposed; if religious or
    laics, </em><strong><em><mark>that they be cut off from communion</mark></em></strong><em>”</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-The-Decree-of-the-Holy-Great-Ecumenical-Synod-the-Second-of-Nice">The
    Acts of the Ecumenical Councils, vol. 7, Act 7</a>)</p><h3>The Council of Iași
    (1643)</h3><p>At the council the main characteristic tenets of Protestantism were
    condemned.</p><h3>The Council of Jerusalem (1672)</h3><p>The document at length
    condemns the tenets of the Protestant teachings, calling their holders heretics
    and delivering them over to anathema:</p><blockquote><p>But to say, as the <strong><mark>most
    wicked heretics</mark></strong> do and as is contained in the chapter answering
    hereto – <strong>that God, in predestinating, or condemning, had in no wise regard
    to the works of those predestinated, or condemned</strong>, we know to be profane
    and impious</p><p>&lt;…&gt;</p><p>Further, <strong>that this Mystery of the Sacred
    Eucharist can be performed by none other, except only by an Orthodox Priest, who
    hath received his priesthood from an Orthodox and Canonical Bishop, in accordance
    with the teaching of the Eastern Church</strong>. This is compendiously the doctrine,
    and true confession, and most ancient tradition of the Catholic Church concerning
    this Mystery; <strong><mark>which must not be departed from in any way by such
    as would be Orthodox, and who reject the novelties and profane vanities of heretics</mark></strong>;
    but necessarily the tradition of the intuition must be kept whole and unimpaired.
    For <strong><mark>those that transgress the Catholic Church of Christ rejecteth
    and anathematiseth</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732">The
    Confession of the Orthodox Faith of the Eastern Church, adopted by the Council
    of Jerusalem of 1672</a>)</p><h3>The Letter of the Patriarchs of the Eastern Catholic
    Church on the Orthodox Faith (1723)</h3><p>This is the same conciliar document
    of the Church of Jerusalem (1672), but by this time (1723) also approved by the
    4 patriarchates (Constantinople, Jerusalem, Antioch, Alexandria) and by the Synod
    of the Russian Church.</p><h4>The condemnation of predestination (Calvinism)</h4><blockquote><p>But
    to say, as <strong>the <mark>most wicked heretics</mark> do</strong> and as is
    contained in the chapter answering hereto – <strong>that God, in predestinating,
    or condemning, had in no wise regard to the works of those predestinated, or condemned</strong>,
    we know to be profane and impious. &lt;…&gt; But <strong>than to affirm that the
    Divine Will is thus solely and without cause the author of their condemnation</strong>,
    <strong><mark>what greater calumny can be fixed upon God? and what greater injury
    and blasphemy can be offered to the Most High?</mark></strong></p><p>For that
    the Deity is not tempted with evils (cf. Jas 1:13), and that he equally willeth
    the salvation of all, since there is no respect of persons with him, we do know;
    and that for those who through their own wicked choice, and their impenitent heart,
    have become vessels of dishonour, there is, as is just, decreed condemnation,
    we do confess. But of eternal punishment, of cruelty, of pitilessness, and of
    inhumanity, we never, never say God is the author, who telleth us that there is
    joy in heaven over one sinner that repenteth (Luke 15:7). Far be it from us, while
    we have our senses, thus to believe, or to think; and we do <strong><mark>subject
    to an eternal anathema those who say and think such things, and esteem them to
    be worse than any infidels</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-3">Decree
    3</a>)</p><h4>Those who reject the episcopate are forsaken by the Holy Spirit</h4><blockquote><p>But
    forasmuch as among their other impieties, the Calvinists have fancied this also,
    that the simple Priest and the High Priest [i.e. Bishop] are perhaps the same;
    and that there is no necessity for High Priests, and that the Church may be governed
    by some Priests; and that not a High Priest [only], but a Priest also is able
    to ordain a Priest, and a number of Priests to ordain a High Priest; and affirm
    in lofty language that the Eastern Church assenteth to this wicked notion – for
    which purpose the Tenth Chapter was written by Cyril – we explicitly declare according
    to the mind which hath obtained from the beginning in the Eastern Church: – <strong><mark>That
    the dignity of the Bishop is so necessary in the Church, that without him, neither
    Church nor Christian could either be or be spoken of</mark></strong>. For <strong><mark>he,
    as a successor of the Apostles, having received in continued succession by the
    imposition of hands and the invocation of the All-holy Spirit the grace that is
    given him of the Lord of binding and loosing, is a living image of God upon the
    earth</mark></strong>, and by a most ample participation of the operation of the
    Holy Spirit, who is the chief functionary, <strong><mark>is a fountain of all
    the Mysteries of the Catholic Church, through which we obtain salvation</mark></strong>.
    And <strong><mark>he is, we suppose, as necessary to the Church as breath is to
    man, or the sun to the world</mark></strong>. Whence it hath also been elegantly
    said by some in commendation of the dignity of the High Priesthood, “What God
    is in the heavenly Church of the first-born (cf. Heb. 12:23), and the sun in the
    world, that every High Priest is in his own particular Church, as <strong><mark>through
    him the flock is enlightened, and nourished, and becometh the temple of God</mark></strong>.”</p><p>And
    <strong><mark>that this great mystery and dignity of the Episcopate hath descended
    unto us by a continued succession</mark></strong> is manifest. For since the Lord
    hath promised to be with us always, although he be with us by other means of grace
    and divine operations, yet in a more eminent manner doth he, through the Bishop
    as chief functionary make us his own and dwell with us, and through the divine
    Mysteries is united with us; of which the Bishop is the first minister, and chief
    functionary, through the Holy Spirit, and suffereth us not to fall into heresy.
    And, therefore [John] the Damscene, in his Fourth Epistle to the Africans, hath
    said, the Catholic Church is everywhere committed to the care of the Bishops;
    and that Clement, the first Bishop of the Romans, and Evodius at Antioch, and
    Mark at Alexandria, were successors of Peter is acknowledged. Also that the divine
    Andrew seated Stachys on the Throne of Constantinople, in his own stead; and that
    in this great holy city of Jerusalem our Lord himself appointed James, and that
    after James another succeeded, and then another, until our own times. And, therefore,
    Tertullian in his Epistle to Papianus called all Bishops the Apostles’ successors.
    To their succession to the Apostles’ dignity and authority Eusebius, the friend
    of Pamphilus, testifieth, and all the Fathers testify, of whom it is needless
    to give a lift; and this the common and most ancient custom of the Catholic Church
    confirmeth.</p><p>And that the dignity of the Episcopate differeth from that of
    the simple Priest, is manifest. For the Priest is ordained by the Bishop, but
    a Bishop is not ordained by a Priest, but by two or three High Priests, as the
    Apostolic Canon directeth. And the Priest is chosen by the Bishop, but the High
    Priest is not chosen by the Priests or Presbyters, nor is he chosen by secular
    Princes, but by the Synod of the Primatial Church of that country, in which is
    situated the city that is to receive the ordinand, or at least by the Synod of
    the Province in which he is to become a Bishop. Or, if ever the city choose him,
    it doth not this absolutely; but the election is referred to the Synod; and if
    it appear that he hath obtained this agreeably to the Canons, the Elect is advanced
    by ordination by the Bishops, with the invocation of the All-holy Spirit; but
    if not, he is advanced whom the Synod chooseth.</p><p>And the Priest, indeed,
    retaineth to himself the authority and grace of the Priesthood, which he hath
    received; but the Bishop imparteth it to others also. And the one having received
    the dignity of the Priesthood from the Bishop, can only perform Holy Baptism,
    and Prayer-oil, minister sacrificially the unbloody Sacrifice, and impart to the
    people the All-holy Body and Blood of our Lord Jesus Christ, anoint the baptised
    with the Holy Myron, crown the Faithful legally marrying, pray for the sick, and
    that all men may be saved and come to the knowledge of the truth (cf. 1 Tim. 2:4),
    and especially for the remission and forgiveness of the sins of the Faithful,
    living and dead. And if he be eminent for experience and virtue, receiving his
    authority from the Bishop, he directeth those Faithful that come unto him, and
    guideth them into the way of possessing the heavenly kingdom, and is appointed
    a preacher of the sacred Gospel. But the High Priest is also the minister of all
    these, since he is in fact, as hath been said before, the fountain of the Divine
    Mysteries and graces, through the Holy Spirit, and he alone consecrateth the Holy
    Myron. And the ordinations of all orders and degrees in the Church are proper
    to him; and in a primary and highest sense he bindeth and looseth, and his sentence
    is approved by God, as the Lord hath promised (Matt. 16:19). And he preacheth
    the Sacred Gospel, and contendeth for the Orthodox faith, and those that refuse
    to hear he casteth out of the Church as heathens and publicans (cf. Matt. 18:17),
    and he putteth heretics under excommunication and anathema, and layeth down his
    own life for the sheep (cf. John 10:11). From which it is manifest, that without
    contradiction the Bishop differeth from the simple Priest, and that without him
    all the Priests in the world could not exercise the pastorate in the Church of
    God, or govern it at all.</p><p>But it is well said by one of the Fathers, that
    <strong>it is not easy to find a heretic that hath understanding. For when these
    forsake the Church, they are <mark>forsaken by the Holy Spirit</mark></strong>,
    and there remaineth in them neither understanding nor light, but only darkness
    and blindness. For, <strong>if such had not happened to them, they would not have
    opposed things that are most plain; among which is the truly great mystery of
    the Episcopacy</strong>, which is taught by Scripture, written of, and witnessed
    to, both by all Ecclesiastical history and the writings of holy men, and always
    held and acknowledged by the Catholic Church</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decree
    10</a>)</p><h4>Those who call the veneration of icons idolatry are condemned (anathematized),
    as well as those who deify icons</h4><blockquote><p>The saints being, and acknowledged
    by the Catholic Church to be, intercessors, as hath been said in the Eighth Decree,
    it is time to say that we honour them as friends of God, and as praying for us
    to the God of all. And the honour we pay them is twofold; – according to one manner
    which we call hyperdoulia (ὑπέρδουλεία), we honour the Mother of God the Word.
    For though indeed the Theotokos be servant of the only God, yet is she also his
    Mother, as having borne in the flesh one of the Trinity; wherefore also is she
    hymned, as being beyond compare, above as well all Angels as Saints; wherefore,
    also, we pay her the adoration of hyperdoulia. But according to the other manner,
    which we call doulia (δουλεία), we adore, or rather honour, the holy Angels, Apostles,
    Prophets, Martyrs, and, in fine, all the Saints.</p><p>Moreover, we adore and
    honour the wood of the precious and life-giving Cross, whereon our Saviour underwent
    this world-saving passion, and the sign of the life-giving Cross, the Manger at
    Bethlehem, through which we have been delivered from irrationality, the place
    of the Skull, the life-giving Sepulchre, and the other holy objects of adoration;
    as well the holy Gospels, as the sacred vessels, wherewith the unbloody Sacrifice
    is performed.</p><p>And by annual commemorations, and popular festivals, and sacred
    edifices and offerings; we do respect and honour the saints. And then we adore,
    and honour, and kiss the icons of our Lord Jesus Christ, and of the most holy
    Theotokos, and of all the saints, also of the holy Angels, as they appeared to
    some of the forefathers and prophets. We also represent the All-Holy Spirit, as
    he appeared, in the form of a dove.</p><p>And if some say we commit idolatry in
    adoring the Saints, and the Icons of the Saints, and the other things, we regard
    it as foolish and frivolous. For we worship with latria<strong> </strong>the only
    God in Trinity, and none other.</p><p>But the Saints we honour upon two accounts:
    firstly, for their relation to God, since we honour them for his sake; and for
    themselves, because they are living images of God. But that which is for themselves
    hath been defined as doulia. But the holy Icons we adore relatively since the
    honour paid to them is referred to their prototypes. For he that adoreth the Icon
    doth, through the Icon, adore the prototype; and the honour paid to the Icon is
    not at all divided, or at all separated from that of him that is portrayed, and
    is done unto the same, like that done unto a royal embassy.</p><p>And what they
    adduce from Scripture in support of their novelties, doth not help them as they
    would, but rather appeareth agreeable to us. For we, when reading the Divine Scripture,
    examine the occasion and person, the example and cause. Wherefore, when we contemplate
    God himself saying at one time, “Thou shalt not make to thyself any idol, or likeness;
    neither shalt thou adore them, nor serve them” (Exod. 20:4-5); and at another,
    commanding that Cherubim should be made (Exod. 25:18); and further, that oxen
    and lions (1 Kings 7:29) were placed in the Temple, we do not rashly consider
    the import of these things. For faith is not in assurance; but, as hath been said,
    considering the occasion and other circumstances, we arrive at the right interpretation
    of the same; and we conclude that, “Thou shalt not make to thyself any idol, or
    likeness”, is the same as saying, “Thou shalt not adore strange gods” (Exod. 20:4),
    or rather, “Thou shalt not commit idolatry”. For so both the custom obtaining
    in the Church from Apostolic times of adoring the holy Icons relatively is maintained,
    and the worship of latria reserved for God alone; and God doth not appear to speak
    contrarily to himself. For if the Scripture saith [absolutely], “Thou shalt not
    make”, “Thou shalt not adore”, we fail to see how God afterwards permitted likenesses
    to be made, even though not for adoration. Wherefore, since the commandment concerneth
    idolatry only, we find serpents, and lions, and oxen, and Cherubim made, and figures
    and likenesses; among which Angels appear, as having been adored.</p><p>And as
    to the Saints whom they bring forward as saying, that it is not lawful to adore
    Icons; we conclude that they rather help us; since they in their sharp disputations
    inveighed, as well against those that adore the holy Icons with latria, as against
    those that bring the icons of their deceased relatives into the Church, and subjected
    to anathema those that so do; but not against the right adoration, either of the
    Saints, or of the holy Icons, or of the precious Cross, or of the other things
    of which mention hath been made; especially since the holy Icons have been in
    the Church, and have been adored by the Faithful, even from the times of the Apostles,
    as is recorded and proclaimed by very many; with whom and after whom the Seventh
    Holy Ecumenical Synod putteth to shame all heretical impudence.</p><p>Since it
    giveth us most plainly to understand that it behoveth to adore the Holy Icons,
    and what have been mentioned above. And it <strong><mark>anathematises, and subjects
    to excommunication</mark></strong>, as well those that adore the Icons with latria
    as <strong><mark>those that say that the Orthodox commit idolatry in adoring the
    Icons</mark></strong>. We also, therefore, do anathematise with them such as adore
    either Saint, or Angel, or Icon, or Cross, or Relic of Saints, or sacred Vessel,
    or Gospel, or aught else that is in heaven above, or aught on the earth, or in
    the sea, with latria; and we ascribe adoration with latria to the only God in
    Trinity. And <strong><mark>we anathematise those that say that the adoration of
    Icons is the latria of Icons, and who adore them not, and honour not the Cross,
    and the Saints, as the Church hath delivered.</mark></strong></p><p>Now we adore
    the Saints and the Holy Icons, in the manner declared; and portray them in adornment
    of our temples, and that they may be the books of the unlearned, and for them
    to imitate the virtues of the Saints; and for them to remember, and have an increase
    of love, and be vigilant in ever calling upon the Lord, as Sovereign and Father,
    but upon the Saints, as his servants, and our helpers and mediators.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Q-4-How-ought-we-to-think-of-the-Holy-Icons-and-of-the-adoration-of-the-Saints">Question
    4 — on the veneration of icons and the saints</a>)</p><h4>Those who do not accept
    the following teaching on the Eucharist are condemned (anathematized)</h4><blockquote><p>This
    is compendiously the doctrine, and true confession, and most ancient tradition
    of the Catholic Church concerning this Mystery; which <strong>must not be departed
    from in any way by such as would be Orthodox</strong>, and who <strong>reject
    the novelties and <mark>profane vanities of heretics</mark>; but necessarily the
    tradition of the intuition must be kept whole and unimpaired</strong>. For <strong><mark>those
    that transgress the Catholic Church of Christ rejecteth and anathematiseth</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Decree
    17</a>)</p><ul><li><p>in the Eucharist only the species of the bread and wine
    remains;</p></li><li><p>the bread and wine truly become the body and blood of
    Christ;</p></li><li><p>in every particle the whole Christ, not a part;</p></li><li><p>divine
    worship is rendered to the body and blood of Christ in the Eucharist;</p></li><li><p>the
    bread and wine, having been changed into the body and blood of Christ, remain
    such even after the sacrament;</p></li><li><p>the Eucharist is a sacrifice for
    the living and the dead;</p></li><li><p>the Eucharist can be celebrated only by
    a lawfully ordained priest.</p></li></ul><h4>In the Eucharist only the species
    of the bread and wine remains; the substance of the bread and wine is wholly changed
    into the body and blood of Christ, so that there is no more bread and wine, but
    before us is the whole Christ: body, soul, and Divinity. He is present whole in
    every particle administered, undivided.</h4><blockquote><p>We believe the All-holy
    Mystery of the Sacred Eucharist, which we have enumerated above, fourth in order,
    to be that which our Lord delivered the night wherein he gave himself up for the
    life of the world. For taking bread, and blessing, he gave to his holy Disciples
    and Apostles, saying: “Take, eat ye; This is my Body” (Matt. 26:26). And taking
    the chalice, and giving thanks, he said: “Drink ye all of it; this is my Blood,
    which for you is being poured out, for the remission of sins” (Matt. 26:28). In
    the celebration whereof <strong><mark>we believe the Lord Jesus Christ to be present</mark></strong>,
    <strong>not typically, nor figuratively</strong> (οὐ τυπικῶς, οὐδ᾿ εἰκονικῶς),
    <strong>nor by superabundant grace</strong>, as in the other Mysteries, <strong>nor
    by a bare presence</strong>, as some of the Fathers have said concerning Baptism,
    or <strong>by impanation</strong> (κατ᾿ ἐναρτισμόν), so that <strong>the Divinity
    of the Word is united to the set forth bread of the Eucharist hypostatically</strong>,
    as the followers of Luther most ignorantly and wretchedly suppose, <strong>but
    <mark>truly and really, so that after the consecration of the bread and of the
    wine, the bread is transmuted, transubstantiated, converted and transformed into
    the true Body itself of the Lord, which was born in Bethlehem of the ever-Virgin</mark></strong>,
    was baptised in the Jordan, suffered, was buried, rose again, was received us,
    sitteth at the right hand of God the Father, and is to come again in the clouds
    of heaven; <strong><mark>and the wine is converted and transubstantiated into
    the true Blood itself of the Lord, which as he hung upon the Cross</mark></strong>,
    was poured out for the life of the world (John 6:51).</p><p>Further, [we believe]
    that <strong><mark>after the consecration of the bread and of the wine, there
    no longer remaineth the substance of the bread and of the wine, but the Body itself
    and the Blood of the Lord, under the species and form of bread and wine; that
    is to say, under the accidents (συμβεβηκόσιν) of the bread</mark></strong>.</p><p>Further,
    that <strong>the all-pure Body itself, and Blood of the Lord is imparted, and
    entereth into the mouths and stomachs of the communicants, whether pious or impious</strong>.
    Nevertheless, they convey to the pious and worthy remission of sins and life eternal;
    but to the impious and unworthy involve condemnation and eternal punishment.</p><p>Further,
    that <strong>the Body and Blood of the Lord are severed and divided by the hands
    and teeth, though in accident only, that is, in the accidents of the bread and
    of the wine, under which they are visible and tangible, we do acknowledge; but
    in themselves to remain entirely unsevered and undivided</strong>. Wherefore the
    Catholic Church also saith: “Broken and distributed is he that is broken, yet
    not severed; which ever is eaten, yet never consumed, but sanctifying those that
    partake”, that is worthily.</p><p>Further, that <strong>in every part, or the
    smallest division of the transmuted bread and wine there is not a part of the
    Body and Blood of the Lord – for to say so were blasphemous and wicked – but <mark>the
    entire whole Lord Christ substantially</mark>, that is, <mark>with his Soul</mark>
    and <mark>Divinity</mark>, or perfect God and perfect man</strong>. So that though
    there are not many Christs, or Bodies of Christ, but it is one and the same Christ
    that is truly and really present; and his one Body and his Blood is in all the
    several Churches of the Faithful; and this is not because the Body of the Lord
    that is in the Heavens descendeth upon the Altars; but because the bread of the
    Prothesis set forth in all the several Churches, being changed and transubstantiated,
    becometh, and is, after consecration, one and the same with that in the heavens.
    For it is one Body of the Lord in many places, and not many; and therefore this
    Mystery is the greatest, and is spoken of as wonderful, and <strong><mark>comprehensible
    by faith only, and not by the sophistries of man’s wisdom</mark></strong>, whose
    vain and foolish curiosity in divine things our pious and God-delivered religion
    rejecteth.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Decree
    17</a>)</p><blockquote><p>Further, we believe that by the word “<strong><mark>transubstantiation</mark></strong>”
    the manner is not explained, by which the bread and wine are changed into the
    Body and Blood of the Lord, – for that is altogether incomprehensible and impossible,
    except by God himself, and those who imagine to do so are involved in ignorance
    and impiety, – <strong><mark>but that the bread and the wine are after the consecration,
    not typically, nor figuratively, nor by superabundant grace, nor by the communication
    or the presence of the Divinity alone of the Only-begotten, transmuted into the
    Body and Blood of the Lord; neither is any accident of the bread, or of the wine,
    by any conversion or alteration, changed into any accident of the Body and Blood
    of Christ</mark></strong>, <strong><mark>but truly, and really, and substantially,
    doth the bread become the true Body itself of the Lord, and the wine the Blood
    itself of the Lord, as is said above</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Decree
    17</a>)</p><h4>The body and blood of Christ in the Eucharist are given worship
    as God, because before us is God himself</h4><blockquote><p>Further, that the
    Body itself of the Lord and the Blood that are in the Mystery of the Eucharist
    ought to be honoured in the highest manner, and adored with latria. For one is
    the adoration of the Holy Trinity, and of the Body and Blood of the Lord</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Decree
    17</a>)</p><h4>The Eucharist is a sacrifice for the living and the dead</h4><blockquote><p>Further,
    that it is a true and propitiatory Sacrifice offered for all Orthodox, living
    and dead; and for the benefit of all, as is set forth expressly in the prayers
    of the Mystery delivered to the Church by the Apostles, in accordance with the
    command they received of the Lord.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Decree
    17</a>)</p><h4>The body and blood of Christ in the Eucharist remain such after
    the sacrament and may be used later</h4><blockquote><p>Further, that before its
    use, immediately after the consecration, and after its use, what is reserved in
    the Sacred Pixes for the communion of those that are about to depart is the true
    Body of the Lord, and not in the least different therefrom; so that before its
    use after the consecration, in its use, and after its use, it is in all respects
    the true Body of the Lord.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Decree
    17</a>)</p><h4>The Eucharist can be celebrated only by a lawfully ordained priest</h4><blockquote><p>Further,
    that this Mystery of the Sacred Eucharist can be performed by none other, except
    only by an Orthodox Priest, who hath received his priesthood from an Orthodox
    and Canonical Bishop, in accordance with the teaching of the Eastern Church.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-17">Decree
    17</a>)</p><h4>The members of the Church are all the Orthodox, notwithstanding
    their sins</h4><blockquote><p>We believe to be members of the Catholic Church
    all the faithful, and only the faithful; who, forsooth, having received the blameless
    faith of the Saviour Christ, from Christ himself, and the Apostles, and the Holy
    Ecumenical Synods, adhere to the same without wavering; although some of them
    may be guilty of all manner of sins. For unless the Faithful, even when living
    in sin, were members of the Church, they could not be judged by the Church. But
    now being judged by her, and called to repentance, and guided into the way of
    her salutary precepts, though they may be still defiled with sins, for this only,
    that they have not fallen into despair, and that they cleave to the Catholic and
    Orthodox faith, they are, and are regarded as, members of the Catholic Church.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-11">Decree
    11</a>)</p><h4>The Church cannot err, because the Holy Spirit teaches it</h4><blockquote><p>We
    believe the Catholic Church to be taught by the Holy Spirit. For he is the true
    Paraclete; whom Christ sendeth from the Father (cf. John 25:26) to teach the truth
    (cf. John 26:13), and to drive away darkness from the minds of the Faithful. The
    teaching of the Holy Spirit, however, doth not immediately, but through the Holy
    Fathers and Leaders of the Catholic Church, illuminate the Church. For as all
    Scripture is, and is called, the word of the Holy Spirit; not that it was spoken
    immediately by him, but that it was spoken by him through the Apostles and Prophets;
    so also the Church is taught indeed by the Life-giving Spirit, but through the
    medium of the holy Fathers and Doctors (whose rule is acknowledged to be the Holy
    and Ecumenical Synods; for we shall not cease to say this ten thousand times);
    and, therefore, not only are we persuaded, but do profess as true and undoubtedly
    certain, that it is impossible for the Catholic Church to err, or at all be deceived,
    or ever to choose falsehood instead of truth. For the All-holy Spirit continually
    operating through the holy Fathers and Leaders faithfully ministering, delivereth
    the Church from error of every kind.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-12">Decree
    12</a>)</p><h4>Salvation is attained not by faith alone, but by works as well</h4><blockquote><p>We
    believe a man to be not simply justified through faith alone, but through faith
    which worketh through love, that is to say, through faith and works. But [the
    notion] that faith fulfilling the function of a hand layeth hold on the righteousness
    which is in Christ, and applied it unto us for salvation, we know to be far from
    all Orthodoxy. For faith so understood would be possible in all, and so none could
    miss salvation, which is obviously false. But on the contrary, we rather believe
    that it is not the correlative of faith, but the faith which is in us, justifieth
    through works, with Christ. But we regard works not as witnesses certifying our
    calling, but as being fruits themselves, through which faith becomes efficacious,
    and as in themselves meriting, through the Divine promises (cf. 2 Cor. 5:10) that
    each of the Faithful may receive what is done through his own body, whether it
    be good or bad, forsooth.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-13">Decree
    13</a>)</p><h4>After the fall man can do good, but good deeds lead to salvation
    only in those who do good through the operation of saving grace</h4><blockquote><p>We
    believe man in falling by the [original] transgression to have become comparable
    and like unto the beasts, that is, to have been utterly undone, and to have fallen
    from his perfection and impassibility, yet not to have lost the nature and power
    (ἐνέργεια) which he had received from the supremely good God. For otherwise he
    would not be rational, and consequently not man; but to have the same nature,
    in which he was created, and the same power of his nature, that is free-will,
    living and operating. So as to be by nature able to choose and do what is good,
    and to avoid and hate what is evil. For it is absurd to say that the nature which
    was created good by him who is supremely good lacketh the power of doing good.
    For this would be to make that nature evil – than which what could be more impious?
    For the power of working dependeth upon nature, and nature upon its author, although
    in a different manner. And that a man is able by nature to do what is good, even
    our Lord himself intimateth, saying, even the Gentiles love those that love them
    (Matt. 5:46; Luke 6:32). But this is taught most plainly by Paul also, in Romans
    ch. 2:14 and elsewhere expressly, saying in so many words, “The Gentiles which
    have no law do by nature the things of the law”. From which it is also manifest
    that the good which a man may do cannot forsooth be sin. For it is impossible
    that what is good can be evil. Albeit, being done by nature only, and tending
    to form the natural character of the doer, but not the spiritual, it contributeth
    not unto salvation thus alone without faith, nor yet indeed unto condemnation,
    for it is not possible that good, as such, can be the cause of evil. But in the
    regenerated, what is wrought by grace, and with grace, maketh the doer perfect,
    and rendereth him worthy of salvation.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-14">Decree
    14</a>)</p><h4>The sacraments are not only signs. Grace works in them</h4><blockquote><p>And
    the Mysteries consist of something natural, and of something supernatural; and
    <strong>are not bare signs of the promises of God. For then they would not differ
    from circumcision – than which [notion] what could be worse</strong>? And we acknowledge
    them to be, of necessity, efficient means of grace to the receivers</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-15">Decree
    15</a>)</p><h4>The sacraments are perfected not only at the time of receiving
    the holy thing</h4><blockquote><p>But we reject, as alien to Christian doctrine,
    the notion that the integrity of the Mystery requireth the use of the earthly
    thing; for this is contrary to the Mystery of the Offering, which being instituted
    by the Substantial Word, and hallowed by the invocation of the Holy Spirit, is
    perfected by the presence of the thing signified, to wit, of the Body and Blood
    of Christ. And the perfecting thereof necessarily precedeth its use. For if it
    were not perfect before its use, he that useth it not aright could not eat and
    drink judgment unto himself; since he would be partaking of mere bread and wine.
    But now, he that partaketh unworthily eateth and drinketh judgment unto himself
    (1 Cor. 11:29); so that not in its use, but even before its use, the Mystery of
    the Eucharist hath its perfection.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-15">Decree
    15</a>)</p><h4>Weakness of faith does not impair the sacrament</h4><blockquote><p>Moreover,
    we reject as something abominable and pernicious the notion that when faith is
    weak the integrity of the Mystery is impaired. For heretics who abjure their heresy
    and join the Catholic Church are received by the Church; although they received
    their valid Baptism with weakness of faith. Wherefore, when they afterwards become
    possessed of the perfect faith, they are not again baptised.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-15">Decree
    15</a>)</p><h4>Infants without baptism cannot be saved</h4><blockquote><p>We believe
    Holy Baptism, which was instituted by the Lord, and is conferred in the name of
    the Holy Trinity, to be of the highest necessity. For without it none is able
    to be saved, as the Lord saith, “Whosoever is not born of water and of the Spirit,
    shall in no wise enter into the Kingdom of the Heavens” (John 3:5). And, therefore,
    it is necessary even for infants, since they also are subject to original sin,
    and without Baptism are not able to obtain its remission. Which the Lord showed
    when he said, not of some only, but simply and absolutely, “Whosoever is not born
    [again]”, which is the same as saying, “All that after the coming of Christ the
    Saviour would enter into the Kingdom of the Heavens must be regenerated.” And
    forasmuch as infants are men, and as such need salvation; needing salvation, they
    need also Baptism.</p><p>And those that are not regenerated, since they have not
    received the remission of hereditary sin, are, of necessity, subject to eternal
    punishment, and consequently cannot without Baptism be saved; so that even infants
    ought, of necessity, to be baptised. Moreover, infants are saved, as is said in
    Matthew (Matt. 19:12); but he that is not baptised is not saved. And consequently
    even infants must of necessity be baptised. And in the Acts (Acts 8:12; 16:33)
    it is said that the whole houses were baptised, and consequently the infants.
    To this the ancient Fathers also witness explicitly, and among them Dionysius
    in his Treatise concerning the Ecclesiastical Hierarchy; and Justin in his fifty-sixth
    Question, who saith expressly, “And they are vouchsafed the benefits of Baptism
    by the faith of those that bring them to Baptism.” And Augustine saith that it
    is an Apostolical tradition, that children are saved through Baptism; and in another
    place, “The Church giveth to babes the feet of others, that they may come; and
    the hearts of others, that they may believe; and the tongues of others, that they
    may promise”; and in another place, “Our mother, the Church, furnisheth them with
    a particular heart”</p><p>&lt;…&gt;</p><p>For if Christ truly died, then remission
    of sin through the Spirit is true also. Hence it is evident that all who are baptised
    and fall asleep while babes are undoubtedly saved, being predestinated through
    the death of Christ. Forasmuch as they are without any sin; – without that common
    [to all], because delivered therefrom by the Divine laver, and without any of
    their own, because as babes they are incapable of committing sin; – and consequently
    are saved.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">Decree
    16</a>)</p><h4>The matter of the sacrament of Baptism is water</h4><blockquote><p>Now
    the matter of Baptism is pure water, and no other liquid. And it is performed
    by the Priest only, or in a case of unavoidable necessity, by another man, provided
    he be Orthodox, and have the intention <u>61</u> (σκοπὸν) proper to Divine Baptism.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">Decree
    16</a>)</p><h4>Baptism delivers from original sin and from sin of any kind, and
    saves</h4><blockquote><p>And the effects of Baptism are, to speak concisely, firstly,
    the remission of the hereditary transgression, and of any sins whatsoever which
    the baptised may have committed.</p><p>Secondly, it delivereth him from the eternal
    punishment, to which he was liable, as well for original sin, as for mortal sins
    he may have individually committed.</p><p>Thirdly, it giveth to such immortality;
    for in justifying them from past sins, it maketh them temples of God.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">Decree
    16</a>)</p><h4>Baptism is not repeated</h4><blockquote><p>Moreover, Baptism imparteth
    an indelible character, as doth also the Priesthood. For as it is impossible for
    any one to receive twice the same order of the Priesthood, so it is impossible
    for any once rightly baptised, to be again baptised, although he should fall even
    into myriads of sins, or even into actual apostasy from the Faith. For when he
    is willing to return unto the Lord, he receiveth again through the Mystery of
    Penance the adoption of a son, which he had lost.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">Decree
    16</a>)</p><h4>After death neither blessedness nor punishment is final; in its
    fullness it will come only after the resurrection</h4><blockquote><p>We believe
    that the souls of those that have fallen asleep are either at rest or in torment,
    according to what each hath wrought; – for when they are separated from their
    bodies, they depart immediately either to joy, or to sorrow and lamentation; though
    confessedly neither their enjoyment, nor condemnation are complete. For after
    the common resurrection, when the soul shall be united with the body, with which
    it had behaved itself well or ill, each shall receive the completion of either
    enjoyment or of condemnation forsooth.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-18">Decree
    18</a>)</p><h4>The departed faithful may be pardoned and saved through the prayers
    of the Church and of the saints</h4><blockquote><p>And such as though involved
    in mortal sins have not departed in despair, but have, while still living in the
    body, repented, though without bringing forth any fruits of repentance (μὴ ποιήσαντας
    οὐδοτιοῦν καρπὸν μετανοίας) – by pouring forth tears, forsooth, by kneeling while
    watching in prayers, by afflicting themselves, by relieving the poor, and in fine
    by showing forth by their works their love towards God and their neighbour, and
    which the Catholic Church hath from the beginning rightly called satisfaction
    (ἱκανοποίησις) – of these and such like the souls departed into Hades (ᾅδης),
    and there endure the punishment (ποινή) due to the sins they have committed.</p><p>But
    they are aware of their future release from thence, and are delivered by the Supreme
    Goodness, through the prayers of the Priests, and the good works which the relatives
    of each do for their Departed; especially the unbloody Sacrifice availing in the
    highest degree; which each offereth particularly for his relatives that have fallen
    asleep, and which the Catholic and Apostolic Church offereth daily for all alike;
    it being, of course, understood that we know not the time of their release. For
    that there is deliverance for such from their direful condition, and that before
    the common resurrection and judgment we know and believe; but when we know not</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-18">Decree
    18</a>)</p><h4>Unceasing prayer</h4><blockquote><p>But if they say this only,
    that to pray continually and unremittingly is wrong, what have they to do with
    us? Let them contend with Christ – as indeed they do contend – who spake the parable
    of the unjust judge (Luke 28:2), how that prayer should be made continually; and
    taught us to watch and pray (Mark 13:33), in order to escape trials, and to stand
    before the Son of man (Luke 21:36). Let them contend with Paul, [who] in the [5th]
    Chapter of the First Epistle to the Thessalonians, and elsewhere in many places
    [exhorteth to pray unremittingly]. I forbear to mention the divine leaders of
    the Catholic Church, from Christ until us; for to put these [heretics] to shame
    sufficeth the accord of the Forefathers, Apostles, and Prophets concerning prayer.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Q-4-How-ought-we-to-think-of-the-Holy-Icons-and-of-the-adoration-of-the-Saints">Question
    4 — on icons</a>)</p><h4>Fasts</h4><blockquote><p>Unavailing too is the assertion,
    the Church cannot, without violence and tyranny, appoint fasts and abstinence
    from certain meats. For the Church for the mortification of the flesh and all
    the passions, and acting most rightly, carefully appointeth prayer and fasting,
    of which all the Saints have been lovers and examples; through which our adversary
    the devil (cf. 1 Pet. 5:8) being overthrown by the grace from on high, together
    with his armies and his hosts – the race (cf. 2 Tim. 4:7) that is set before the
    pious is the more easily accomplished. In making these provisions the undefiled
    Church everywhere useth neither violence nor tyranny; but exhorteth, admonisheth,
    and teacheth, in accordance with Scripture, and persuadeth by the power of the
    Spirit.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Q-4-How-ought-we-to-think-of-the-Holy-Icons-and-of-the-adoration-of-the-Saints">Question
    4 — on icons</a>)</p><h4>Those who have separated from the Church will be punished
    together with the heathens</h4><blockquote><p>But <strong><mark>for a sign to
    be believed</mark></strong>, that is <strong><mark>for reformation</mark></strong>
    of their innovations, and <strong><mark>for their return to the Catholic and Apostolic
    Church</mark></strong>, in which <strong>their</strong> <strong>forefathers</strong>
    also were of old, and <strong>assisted at those Synods</strong> and contests against
    heretics, <strong>which these now reject and revile</strong>. For it was <strong>unreasonable
    on their part</strong>, especially as they considered themselves to be wise, <strong>to
    have listened to men that were lovers of self; and profane, and that spake not
    from the Holy Spirit, but from the prince of lies, and to have forsaken the Holy,
    Catholic, and Apostolic Church</strong>, which God hath purchased with the Blood
    of his own Son (cf. Acts 20:28); and to have abandoned her. For otherwise, <strong><mark>there
    will overtake those that have separated from the Church the pains that are reserved
    for heathens and publicans</mark></strong>. But the Lord who hath ever protected
    her against all enemies, will not neglect the Catholic Church; to him be glory
    and dominion unto the ages of the ages. Amen.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Epilogue">Epilogue</a>)</p><h3></h3>'
