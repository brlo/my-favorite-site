  body: '<h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr († late 2nd c.)</h3><p>Christians
    miraculously spoke in foreign languages:</p><blockquote><p>For this reason does
    the apostle declare, “We speak wisdom among them that are perfect” (1 Cor. 2:6),
    terming those persons “perfect” who have received the Spirit of God, and who through
    the Spirit of God <strong><mark>do speak in </mark><u><mark>all</mark></u><mark>
    languages</mark></strong>, as he used Himself also to speak. In like manner <strong>we
    do also hear many brethren in the Church, who possess prophetic gifts, and who
    through the Spirit speak <u><mark>all kinds of</mark></u> languages, and bring
    to light <mark>for the general benefit</mark> the hidden things of men, and <mark>declare
    the mysteries</mark> of God</strong>, whom also the apostle terms “spiritual,”
    they being spiritual because they partake of the Spirit, and not because their
    flesh has been stripped off and taken away, and because they have become purely
    spiritual.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-6">Against
    Heresies, Book V, ch. 6</a>)</p><p>He speaks of the heretic who, by deceit, with
    the help of demonic powers, bestowed no gift but taught (as today’s Pentecostals
    and charismatics do) people to open their mouth and utter whatever nonsense came
    into their heads, persuading them that it was they who were prophesying:</p><blockquote><p>It
    appears probable enough that this man <strong>possesses a demon as his familiar
    spirit, by means of whom he seems able to prophesy, and also enables as many as
    he counts worthy to be partakers of his Charis themselves to prophesy</strong>.
    He devotes himself especially to women, and those such as are well-bred, and elegantly
    attired, and of great wealth, whom he frequently seeks to draw after him, by addressing
    them in such seductive words as these: “I am eager to make thee a partaker of
    my Charis, since the Father of all doth continually behold thy angel before His
    face. Now the place of thy angel is among us: it behoves us to become one. Receive
    first from me and by me [the gift of] Charis. Adorn thyself as a bride who is
    expecting her bridegroom, that thou mayest be what I am, and I what thou art.
    Establish the germ of light in thy nuptial chamber. Receive from me a spouse,
    and become receptive of him, while thou art received by him. <strong>Behold Charis
    has descended upon thee; open thy mouth and prophesy.” On the woman replying,
    “I have never at any time prophesied, nor do I know how to prophesy,” then engaging,
    for the second time, in certain invocations, so as to astound his deluded victim,
    he says to her, “Open thy mouth, speak whatsoever occurs to thee, and thou shalt
    prophesy.”</strong> She then, vainly puffed up and elated by these words, and
    greatly excited in soul by the expectation that it is herself who is to prophesy,
    her heart beating violently [from emotion], <strong>reaches the requisite pitch
    of audacity, and idly as well as impudently utters some nonsense as it happens
    to occur to her, such as might be expected from one heated by an empty spirit</strong>.
    (Referring to this, one superior to me has observed, that the soul is both audacious
    and impudent when heated with empty air.) Henceforth she reckons herself a prophetess,
    and expresses her thanks to Marcus for having imparted to her of his own Charis.
    She then makes the effort to reward him, not only by the gift of her possessions
    (in which way he has collected a very large fortune), but also by yielding up
    to him her person, desiring in every way to be united to him, that she may become
    altogether one with him.</p><p>4. But already some of the most faithful women,
    possessed of the fear of God, and not being deceived (whom, nevertheless, he did
    his best to seduce like the rest by bidding them prophesy), abhorring and execrating
    him, have withdrawn from such a vile company of revellers. This they have done,
    as being well aware that the gift of prophecy is not conferred on men by Marcus,
    the magician, but that only those to whom God sends His grace from above possess
    the divinely-bestowed power of prophesying; and then they speak where and when
    God pleases, and not when Marcus orders them to do so. For that which commands
    is greater and of higher authority than that which is commanded, inasmuch as the
    former rules, while the latter is in a state of subjection. If, then, Marcus,
    or any one else, does command — as these are accustomed continually at their feasts
    to play at drawing lots, and [in accordance with the lot] to command one another
    to prophesy, giving forth as oracles what is in harmony with their own desires
    — it will follow that he who commands is greater and of higher authority than
    the prophetic spirit, though he is but a man, which is impossible. But <strong><mark>such
    spirits</mark> as are commanded by these men, and speak when they desire it, are
    earthly and weak, audacious and impudent, <mark>sent forth by Satan for the seduction
    and perdition</mark> of those who do not hold fast that well-compacted faith which
    they received at first through the Church.</strong></p><p>5. Moreover, that <strong>this
    Marcus</strong> compounds philters and love-potions, in order to insult the persons
    of some of these women, if not of all, those of them who have returned to the
    Church of God — a thing which frequently occurs — have acknowledged, confessing,
    too, that <strong>they have been defiled by him</strong>, and that they were filled
    with a burning passion towards him. <strong>A sad example of this occurred in
    the case of a certain Asiatic, one of our deacons, who had received him (Marcus)
    into his house. His wife, a woman of remarkable beauty, fell a victim both in
    mind and body to this magician, and, for a long time, travelled about with him.
    At last, when, with no small difficulty, the brethren had converted her, she spent
    her whole time in the exercise of public confession, weeping over and lamenting
    the defilement which she had received from this magician.</strong></p><p>6. <strong>Some
    of his disciples, too, addicting themselves to the same practices, have deceived
    many silly women, and defiled them</strong>. They proclaim themselves as being
    “perfect,” so that no one can be compared to them with respect to the immensity
    of their knowledge, nor even were you to mention Paul or Peter, or any other of
    the apostles. They assert that they themselves know more than all others, and
    that they alone have imbibed the greatness of the knowledge of that power which
    is unspeakable. They also maintain that they have attained to a height above all
    power, and that therefore they are free in every respect to act as they please,
    having no one to fear in anything. For they affirm, that because of the “Redemption”
    it has come to pass that they can neither be apprehended, nor even be seen by
    the judge.</p><p>&lt;…&gt;</p><p>7. Such are the words and deeds by which <strong>in
    our own district of the Rhone, they have deluded many women</strong>, who have
    their consciences seared as with a hot iron. <strong>Some of them, indeed, make
    a public confession of their sins; but others of them are ashamed to do this</strong>,
    and in a tacit kind of way, despairing of [attaining to] the life of God, have,
    some of them, apostatized altogether; while others hesitate between the two courses,
    and incur that which is implied in the proverb, “neither without nor within,”
    possessing this as the fruit from the seed of the children of knowledge.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-13">Against
    Heresies, Book I, ch. 13.3</a>)</p><h2>4th century</h2><h3>St John Chrysostom,
    archbishop of Constantinople (c. 347–407)</h3><p>“Tongues” are foreign languages:</p><blockquote><p>1
    Cor. 14:1-3: At this point he makes a comparison between the gifts, and lowers
    that of <strong>the tongues</strong>, showing it to be neither altogether useless,
    <strong>nor very profitable by itself</strong>. For in fact they were greatly
    puffed up on account of this, because the gift was considered to be a great one.
    And it was thought great because the Apostles received it first, and with so great
    display; it was not however therefore to be esteemed above all the others. <strong><mark>Wherefore
    then did the Apostles receive it before the rest? Because they were to go abroad
    every where.</mark></strong> And as in the time of building the tower the one
    tongue was divided into many; so <strong><mark>then the many tongues frequently
    met in one man, and the same person used to discourse both in the Persian, and
    the Roman, and the Indian, and many other tongues, the Spirit sounding within
    him: </mark><u><mark>and the gift was called the gift of tongues</mark></u><mark>
    because he could </mark><u><mark>all at once speak divers languages</mark></u><mark>.</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4#HH-Homily-XXXV">Homilies
    on First Corinthians, Homily 35</a>)</p><h2>5th century</h2><h3>Blessed Theodoret
    of Cyrrhus (c. 386–457)</h3><blockquote><p>In ancient times, to those who received
    the Divine preaching and were counted worthy of saving baptism, the working of
    spiritual grace was plainly bestowed; and some <strong><mark>began to speak in
    languages which they did not know by nature and had not learned from others</mark></strong>;
    others worked wonders</p></blockquote><p>(Commentary on the First Epistle to the
    Corinthians, ch. 12)</p><blockquote><p>1 Cor. 14:2: The apostle produces both
    at once. He censures the Corinthians for their love of honour and makes visible
    the need for <strong>the gift. <mark>It was given to the preachers because of
    the different languages among men</mark></strong>, so that, <strong><mark>when
    they came to the Indians, they might set forth the Divine preaching, speaking
    their tongue</mark></strong>, and likewise conversing with <strong>Persians</strong>,
    <strong>Scythians</strong>, <strong>Romans</strong> and <strong>Egyptians</strong>,
    might preach to them the gospel teaching <strong><mark>in the tongue of each of
    these peoples</mark></strong>. Therefore for those conversing <strong>in Corinth
    it was a superfluous thing to speak in the Scythian, or Persian, or Egyptian tongue,
    which the Corinthians could not understand</strong>. This is why the divine Apostle
    said that “he who speaks in a tongue does not speak to men, but to God,” for he
    added the following: “for no one understands him.” And lest the gift should be
    thought useless, he added further: “however, in the spirit he speaks mysteries.”</p></blockquote><p>(Commentary
    on the First Epistle to the Corinthians, ch. 14)</p><blockquote><p><strong>I am
    appointed (apostle — tr.) <mark>a teacher of all nations</mark></strong>. Therefore
    I am bound to render to all <strong><mark>the debt of teaching, not to Greeks
    only, but also to barbarians. For this the grace of the Spirit granted us also
    different languages</mark></strong>, and this debt must be paid both to those
    who think highly of their own education and to those not initiated in the literary
    sciences.</p></blockquote><p>(Commentary on the Epistle to the Romans, 1:15)</p><h3>Romanos
    the Melodist, monk (5th–6th c.)</h3><p>From the texts of the services it follows
    directly that at Pentecost the Lord performed the reverse action:</p><ul><li><p>at
    Babel He confounded the tongues;</p></li><li><p>in the Church He united.</p></li></ul><p>The
    kontakion from the service of Pentecost (translations below):</p><blockquote><p>Kontakion,
    Tone 8:</p><p>Егда снизшед языки слия, / разделяше языки Вышний, / егда же огненныя
    языки раздаяше, / в соединение вся призва, / и согласно славим Всесвятаго Духа.</p></blockquote><p>(Church
    Slavonic text of the Pentecostarion)</p><p>Russian translation by Hieromonk Ambrose
    (Timrot):</p><blockquote><p>When the Most High came down and <strong><mark>confounded
    the tongues, / He thereby divided the nations</mark></strong>; / and when <strong><mark>He
    distributed the tongues of fire, / He called all to unity</mark></strong>, / and
    we together glorify the All-holy Spirit.</p></blockquote><p>Russian translation
    by Deacon Sergius Tsvetkov:</p><blockquote><p>When the Most High, having descended
    (to earth), <strong>confounded the tongues, and (thereby) He divided the nations</strong>:
    when He <strong>distributed the tongues of fire, then (by this very act) He called
    all to unity</strong>. Therefore we (all) with one accord glorify the All-holy
    Spirit.</p></blockquote><p>Russian translation from the pravoslavie.ru website:</p><blockquote><p>When
    the Most High came down and confounded the tongues, He thereby divided the nations;
    and when He bestowed the tongues of fire, He called all to unity (of faith), and
    behold, we all with one mind glorify the All-holy Spirit.</p></blockquote><p>Russian
    translation and explanation of the Church Slavonic text by N. Afanasyeva:</p><blockquote><p>When
    the Most High, descending, confounded the tongues (that is, language as a means
    of communication), He [thereby] divided the nations; when He distributed the tongues
    of fire, He called all to unity. And we together glorify the All-holy Spirit.</p></blockquote><p>(source
    of the translations)</p><p><strong>In other texts of the service the foreign languages
    are spoken of directly:</strong></p><blockquote><p><strong><mark>With the tongues
    of the foreigners</mark> / Thou didst renew Thy disciples, O Christ</strong>,
    / so that through them they might proclaim Thee, / the immortal Word and God,
    / who bestowest great mercy upon our souls.</p></blockquote><p>(Stichera at “Lord,
    I have cried:”)</p><blockquote><p>When Thou didst send Thy Spirit, O Lord, / at
    the gathering of the Apostles, / then <strong><mark>the sons of the Hebrews</mark></strong>,
    seeing this, <strong><mark>were struck with awe, / for they heard them speaking
    / in other, foreign tongues</mark></strong>, as the Spirit gave unto them; / for,
    being unlearned, they were filled with wisdom / and, catching the nations into
    the faith, / they discoursed eloquently of things divine. / Therefore we also
    cry aloud to Thee: / “Thou who didst appear on earth and hast saved us from delusion,
    / O Lord, glory to Thee!”</p></blockquote><p>(Stichera at the Litya)</p><h2>19th
    century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p>What
    are “kinds of tongues”? — The gift of speaking in different languages, not from
    studying them, but by a bestowal of the Spirit of God. <strong><mark>The Roman
    Empire was filled with peoples of different tongues. So that no one should be
    deprived of the opportunity to hear the gospel preaching, everywhere the gift
    of speaking in different tongues was bestowed</mark></strong>. This gift and the
    gift of the word of wisdom were the most necessary. “The apostle gave it the last
    place, and the gift of teaching the first, because for both of these gifts the
    others were given, so that the preaching might be received with faith” (Theodoret).</p><p>&lt;…&gt;</p><p><strong>What
    is “the interpretation of tongues”? — The gift of interpreting for others what
    has been said in foreign languages</strong>. “One himself knew what he was saying,
    but could not interpret it to another; while another had the ability for both”
    (St Chrysostom). “And this was a spiritual gift. For often one who knew only the
    Greek tongue, when another conversed in the Scythian and Thracian tongue, would
    translate him to the hearers” (Theodoret). “This gift was sometimes possessed
    by the very speakers in tongues, and they interpreted themselves” (Oecumenius).</p><p>&lt;…&gt;</p><p>The
    Apostle’s discourse is such that it does not disparage the gift, but leads the
    one who uses it improperly toward amendment. “He produces both at once. He censures
    the Corinthians for their love of honour and makes visible the need for the gift.
    <strong><mark>It was given to the preachers because of the different languages
    among men</mark>, so that, when they came to the Indians, they might set forth
    the divine preaching, speaking their tongue, and likewise conversing with Persians,
    Scythians, Romans and Egyptians, might preach to them the Gospel teaching <mark>in
    the tongue of each people</mark></strong>. Therefore for those conversing in Corinth
    <strong>it was a superfluous thing to speak in the Scythian, or Persian, or Egyptian
    tongue, which the Corinthians could not understand</strong>” (Theodoret)</p></blockquote><p>(The
    First Epistle to the Corinthians of the Holy Apostle Paul, interpreted by St Theophan)</p><h2>Additional
    material on the heresies claiming the gift of tongues</h2><h3>St John of Damascus,
    monk (2nd half of the 7th c. – before 754)</h3><p><strong><mark>The Messalians
    (also Euchites, Enthusiasts) are followers of a heresy</mark></strong> which took
    place in Syria and Asia Minor in the 4th–6th centuries, and in Syriac-speaking
    Persia in the 7th century. The Messalians have yet another name — the Enthusiasts
    (Gr. ἐνθουσιασταί; Lat. enthusistae, from Gr. ἐνθουσίασις — “(divine) inspiration,
    fervour, rapture, ecstasy”); they received this name, as John of Damascus explains,
    because <strong>these people receive into themselves the operation of some demon</strong>
    and take this operation <strong>for the operation of the Holy Spirit</strong>.</p><blockquote><p>80.
    <strong>Messalians, that is, “those who pray”</strong>. To them adhere also, from
    among the former <strong>Hellenic heresies</strong>, the so-called <strong>Euphemites</strong>,
    <strong>Martyrians</strong> and <strong>Satanians</strong>.</p><p>Here is the
    table of contents of the seventh section.</p><p>Chapters of the impious <strong>teaching
    of the Massalians, taken from their book</strong>.</p><p>Satan co-exists hypostatically
    with man and rules over him in everything.</p><p>Satan and the demons possess
    the human mind, and the nature of men enters into communion with the nature of
    the spirits of wickedness.</p><p>Satan and the Holy Spirit dwell together in man,
    and even the apostles were not pure from the action of possession, and <strong>neither
    does baptism make a man perfect, nor does the partaking of the divine mysteries
    cleanse the soul, but only the prayer which they cultivate</strong>. A man is
    defiled by sin even after baptism. <strong><mark>Not through baptism does the
    faithful receive the incorruptible and divine garment, but through prayer</mark></strong><mark>.</mark></p><p>One
    must keep dispassion, and the partaking of the Holy Spirit will be in every feeling
    and in fullness.</p><p>The soul must feel such communion with the heavenly Bridegroom
    as a wife experiences in union with her husband.</p><p>The spiritual see sin within
    and without, as well as grace acting and producing.</p><p>Revelation takes place
    in the feeling and in the divine hypostasis, as also in the teaching.</p><p>Fire
    is a creative element.</p><p>A soul that has not Christ in feeling and in every
    action is the dwelling of serpents and poisonous beasts, that is, of all the hostile
    power.</p><p>Evil exists by nature.</p><p>Adam, even before the transgression,
    entered into communion with Eve dispassionately.</p><p>The seed and the Word fell
    into Mary.</p><p>They say that a man must acquire two souls: one common with all
    men, and another heavenly.</p><p><strong>They say that it is possible for a man
    to perceive sensibly the hypostasis of the Holy Spirit in all fullness and in
    <u>every</u> action</strong>.</p><p>To those at prayer there may appear in the
    light a cross. At one time there was found a man standing at the sacrificial altar,
    and there were brought to Him three loaves kneaded with oil.</p><p>Besides this,
    they also reject the work of their hands, as unbecoming to Christians. In part
    they introduce also inhumanity toward the poor, asserting that for those who do
    not beg publicly, or widows left behind, and for those whom misfortunes do not
    befall — injuries of the body, or illness, or harsh creditors, or attacks of robbers
    or barbarians — and for those who do not fall into other such misfortunes, one
    must seize those who renounce the world, or those who have wholly given themselves
    over to charity, and deliver everything to them; for the Massalians say that precisely
    they are the truly poor in spirit.</p><p>To this the Massalians have added also
    neglect of churches and altars. They taught that <strong>ascetics ought not to
    remain in church assemblies, but to content themselves with prayers in their oratories</strong>.
    They said that <strong>their prayer has such power that for both themselves and
    those who learned from them the Holy Spirit appears sensibly</strong>. They chatter
    that <strong>those who wish to be saved must pray so much</strong>, doing absolutely
    nothing else, <strong>until they sense that sin, like some smoke or fire, or a
    dragon, or some similar wild beast, is driven out by prayer and departs sensibly
    through the prayers</strong>, and <strong>the entrance of the Holy Spirit, in
    its turn, they perceive sensibly and have in the soul a clear feeling of the entrance
    of the Holy Spirit</strong>. And this, they say, is the true communion of Christians.
    <strong>For in church baptism, or at the ordinations of clerics, those being baptized
    receive the Holy Spirit not at all</strong>, unless they diligently take part
    in their prayers, and <strong>anyone may receive communion of the Holy Spirit
    even without baptism, if he wishes to remain with them and learn their dogmas</strong>.
    So that <strong>when certain presbyters said to them: we confess that we have
    the Holy Spirit by faith, and not by sensible perception, they <mark>promised
    that through prayer with them those men also would receive a share in the sensible
    perception of the Spirit</mark></strong>. The pride of their boasting is so great
    that <strong><mark>those of them who have supposedly received a share in the sensible
    perception of the Spirit are pronounced blessed by them as perfect and free from
    every sin, people of a higher order, and are honored as no longer subject to the
    dangers of sin</mark></strong>. But later there comes among them relaxation and
    freedom in food, and every retinue, and honor, and luxury, so that many of them,
    even after such a testimony of perfection among them, appear to those outside
    unworthy even to be called Christians, having fallen into various shamelessnesses,
    thefts of property, and fornication.</p><p>Besides what has been said, they invent
    much else, namely: they calmly dissolve lawful marriages; those who have withdrawn
    from marriages they receive and pronounce blessed as ascetics; they persuade fathers
    and mothers not to care for the upbringing of children, but beguile them to bring
    everything to them. Slaves who flee from their masters they willingly receive,
    and sinners who come to them without any fruit of repentance, apart from the authority
    of the priest, without the degrees established by the canons of the Church, they
    promise quickly to cleanse from every sin, if only someone, having learned from
    them their famous prayer, becomes closely initiated into their charlatanry. Some
    of such sinners they bring, before their release from sins, to ordination as clerics,
    craftily persuading bishops to lay hands on them, beguiling them with the testimony
    of those who are reckoned ascetics among them. They care about this not because
    they consider the degrees of clerics honorable — indeed they <strong>disdain even
    the bishops themselves, when they wish</strong> — but in order to bargain for
    themselves a certain dominion and power. Some of them say that they would not
    partake of the mysteries if they did not sensibly feel the appearance of the Spirit,
    which takes place at that hour. Some of them permit those who wish to cut off
    their natural members. They lightly disregard excommunications. They swear without
    fear and break their oaths, while hypocritically anathematizing their own heresy
    as well.</p><p>Further, concerning the said heresy of the Massalians, who are
    found mostly in monasteries, from the history of Theodoret.</p><p><strong>In the
    times of Valentinian and Valens there appeared the heresy of the Massalians</strong>.
    Those who render this name into Greek call them <strong>Euchites</strong>. They
    have also another name, taken from their deed; for they are called <strong>Enthusiasts</strong>,
    <strong>because <mark>they receive into themselves the operation of some demon
    and take this for the operation of the Holy Spirit</mark></strong>. Wholly infected
    with this disease, they shun manual labour as an evil, and, giving themselves
    over to sleep, they call the dreams of their sleep inspirations. <strong>The leaders
    of this heresy were Dadoes, Sabbas, Adelphius, Hermas, Simeon</strong>, and others
    besides these, who <strong>withdrew from church communion, asserting that the
    Divine Food, of which Christ says — he that eateth My Flesh and drinketh My Blood
    hath eternal life (John 6:54) — <mark>does neither harm nor good</mark></strong>.
    Seeking to conceal their disease, even after being exposed they shamelessly deny
    it and renounce those who think the same as they carry in their souls.</p><p>A
    certain Litos, who governed the church of Melitene, adorned with divine zeal,
    seeing that many monasteries — or rather, dens of robbers — had been infected
    with this disease, burned them and drove the wolves from the flock. Likewise the
    all-praised Amphilochius, to whom the metropolia of Lycaonia was entrusted and
    who shepherded that whole tribe, learned that this plague had penetrated here
    also, rose against it and freed the flock under him from this contagion. The renowned
    Flavian, archbishop of Antioch, learning that they lived in Edessa, corrupting
    their neighbors with their poison, gathered a multitude of monks, brought them
    to Antioch, and, when they denied their disease, exposed them in the following
    manner. He said that their accusers slandered, and the witnesses lied. Having
    gently invited Adelphius, who was already in deep old age, to sit close beside
    him, Flavian said: “We old men, having lived a long life, have studied more carefully
    both the nature of man and learned the devices of the opposing demons, and have
    been taught by the experience itself of the help of grace. These men, being young,
    knowing nothing well of such things, cannot contain discourses more spiritual.
    Tell me, then, in what sense do you say that the hostile spirit departs and the
    grace of the All-holy Spirit takes up its dwelling?” Charmed by these words, that
    old man poured out all his hidden poison and <strong>says that <mark>from baptism
    (of water — tr.) no benefit comes</mark> to those made worthy of it, but that
    only fervent prayer drives out the demon that dwells in man</strong>. Every man
    born, he said, borrowed from our forefather both his nature and his bondage to
    the demons. But when <strong><mark>they are driven out by fervent prayer, then
    the All-holy Spirit takes up His dwelling, showing His presence in a sensible
    and visible manner, and freeing the body from the movements of the passions, and
    delivering the soul utterly from the inclination to evil; so that there is no
    longer any need either of fasting to bridle the body, or of teaching to bridle
    man and instill in him seemly conduct</mark></strong>. Whoever has attained this
    is freed not only from bodily rebellions, but also clearly foresees the future,
    and beholds the Divine Trinity face to face. When thus the divine Flavian had
    dug up the foul spring and made its streams gush forth, he said to the unhappy
    old man: “O thou head grown grey in evil! Thou art convicted now not by me, but
    by thine own mouth; against thee the witness is thine own lips.” After such a
    disclosure of their disease they were expelled from Syria, and withdrawing into
    Pamphylia, they filled it with their contagion.</p></blockquote><p>(On a Hundred
    Heresies in Brief)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: L18uU36a_Вечность_мучений_грешников
  path: Hell-the-Endlessness-of-Torment
  title: Hell — the Endlessness of Torment
  menu:
    parent: Retribution of the righteous and the wicked
    title: Hell — the Endlessness of Torment
    priority: 3
  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p><em>“If, then, those who do this as respects the
    flesh have suffered death, how much more shall this be the case with any one who
    corrupts by wicked doctrine the faith of God, for which Jesus Christ was crucified!
    Such an one becoming defiled [in this way], </em><strong><em>shall go away into
    <mark>everlasting fire</mark></em></strong><em>, and so shall every one that hearkens
    unto him.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-16">To
    Ephesians, 16</a>)</p><h2>2nd century</h2><h3>Justin the Philosopher, martyr (c.
    100–165)</h3><p>St Justin, who had been a Platonist philosopher before his conversion
    to Christianity, condemns the philosophical notions that torments are finite:</p><blockquote><p><em>to
    you and all who unjustly hate us, and do not repent, brings </em><strong><em>eternal
    punishment by fire</em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>we
    say that the same thing will be done, but at the hand of Christ, and upon the
    wicked in the same bodies united again to their spirits which are now to </em><strong><em><mark>undergo
    everlasting punishment; and not only, as Plato said, for a period of a thousand
    years</mark></em></strong></p><p><em>&lt;…&gt;</em></p><p><em>we hold this view,
    that it is alike impossible for the wicked, the covetous, the conspirator, and
    for the virtuous, to escape the notice of God, and that </em><strong><em>each
    man goes to everlasting punishment or salvation according to the value of his
    actions</em></strong><em>.</em></p><p><strong><em>For if all men knew this, <mark>no
    one would choose wickedness even for a little, knowing that he goes to the everlasting
    punishment of fire</mark></em></strong><em>; but would by all means restrain himself,
    and adorn himself with virtue, that he might obtain the good gifts of God, and
    escape the punishments.</em></p><p><em>&lt;…&gt;</em></p><p><em>we believe (or
    rather, indeed, are persuaded) that every man will </em><strong><em>suffer punishment
    in eternal fire</em></strong><em> according to the merit of his deed, and will
    render account according to the power he has received from God, as Christ intimated
    when He said, “To whom God has given more, of him shall more be required.”</em></p><p><strong><em>which,
    if it issued in insensibility, would be a godsend to all the wicked. But since
    sensation remains to all who have ever lived, and eternal punishment is laid up
    (i.e., for the wicked)</em></strong><em>, see that ye neglect not to be convinced,
    and to hold as your belief, that these things are true.</em></p><p><em>&lt;…&gt;</em></p><p><em>And
    we have learned that those only are deified who have lived near to God in holiness
    and virtue; and we believe that those who live wickedly and do not repent </em><strong><em>are
    punished in everlasting fire</em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>For
    among us the prince of the wicked spirits is called the serpent, and Satan, and
    the devil, as you can learn by looking into our writings. And that he </em><strong><em>would
    be sent into the fire with his host, and the men who follow him, and would be
    punished for an endless duration</em></strong><em>, Christ foretold.</em></p><p><em>&lt;…&gt;</em></p><p><em>to
    you and all who unjustly hate us, and do not repent, brings </em><strong><em>eternal
    punishment by fire</em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>the
    prophets have proclaimed two advents of His: the one, that which is already past,
    when He came as a dishonoured and suffering Man; but the second, when, according
    to prophecy, He shall come from heaven with glory, accompanied by His angelic
    host, when also He shall raise the bodies of all men who have lived, and shall
    clothe those of the worthy with immortality, and </em><strong><em>shall send those
    of the wicked, endued with eternal sensibility, into everlasting fire with the
    wicked devils</em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>And in
    what kind of </em><strong><em>sensation</em></strong><em> and punishment </em><strong><em>the
    wicked are to be</em></strong><em>, hear from what was said in like manner with
    reference to this; it is as follows: “</em><strong><em><mark>Their worm shall
    not rest, and their fire shall not be quenched; and then shall they repent, when
    it profits them not</mark></em></strong><em>”.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1">Apology
    1</a>)</p><blockquote><p><em>the unjust and intemperate shall be </em><strong><em>punished
    in eternal fire</em></strong><em>, but that the virtuous and those who lived like
    Christ shall dwell with God in a state that is free from suffering — we mean,
    those who have become Christians</em></p><p><em>&lt;…&gt;</em></p><p><strong><em>there
    shall be punishment in eternal fire</em></strong><em> inflicted upon those who
    do not live temperately and conformably to right reason</em></p><p><em>&lt;…&gt;</em></p><p><em>And
    they, </em><strong><em>having been shut up in eternal fire</em></strong><em>,
    shall suffer their just punishment and penalty.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_2">Apology
    2</a>)</p><blockquote><p><em>But these filthy garments, which have been put by
    you on all who have become Christians by the name of Jesus, God shows shall be
    taken away from us, when He shall raise all men from the dead, and appoint some
    to be incorruptible, immortal, and free from sorrow in the everlasting and imperishable
    kingdom; but shall send </em><strong><em>others away to the everlasting punishment
    of fire</em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>we know from
    Isaiah that </em><strong><em><mark>the members of those who have transgressed
    shall be consumed by the worm and unquenchable fire, remaining immortal</mark></em></strong><em>;
    so that they become a spectacle to all flesh.</em></p><p><em>&lt;…&gt;</em></p><p><em>in
    order that, by this dispensation, the serpent that sinned from the beginning,
    and the angels like him, may be destroyed, and that death may be contemned, and
    for ever quit, </em><strong><em>at the second coming of the Christ Himself</em></strong><em>,
    those who believe in Him and live acceptably — and be no more: when some </em><strong><em>are
    sent <mark>to be punished unceasingly into judgment and condemnation of fire</mark></em></strong><em>;
    but others shall exist in freedom from suffering, from corruption, and from grief,
    and in immortality</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><h3>Polycarp of Smyrna, hieromartyr (69–155)</h3><p>The disciple
    of John the Theologian contrasts the temporary fire that he now has to endure
    for Christ with the eternal fire prepared for the ungodly:</p><blockquote><p><em>“But
    Polycarp said: </em><strong><em><mark>‘You threaten that fire which burns for
    a season and after a little while is quenched: for you are ignorant of the fire
    of the future judgment and eternal punishment, which is reserved for the ungodly</mark></em></strong><em>.
    But why do you delay? Come, do what you will.’”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-11">Martyrdom
    of Polycarp, 11</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>For
    as, in the New Testament, that faith of men [to be placed] in God has been increased,
    receiving in addition [to what was already revealed] the Son of God, that man
    too might be a partaker of God; so is also our walk in life required to be more
    circumspect, when we are directed not merely to abstain from evil actions, but
    even from evil thoughts, and from idle words, and empty talk, and scurrilous language:
    <strong><mark>thus also the punishment</mark></strong> of those who do not believe
    the Word of God, and despise His advent, and are turned away backwards, is increased;
    being <strong><mark>not merely temporal, but rendered also eternal</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-28">Against
    Heresies, Book 4, ch. 28, § 2</a>)</p><p>The contrast:</p><blockquote><p><em>For
    those points to which they call attention with regard to the God who </em><strong><em><u><mark>then
    awarded temporal</mark></u><mark> punishments to the unbelieving</mark></em></strong><em>,
    and smote the Egyptians, while He saved those that were obedient; these same [facts,
    I say, ] shall nevertheless repeat themselves in the Lord, who </em><strong><em>judges
    <u><mark>for eternity</mark></u><mark> those whom He doth judge</mark>, and lets
    go free for eternity those whom He does let go free</em></strong><em>;</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-28">Against
    Heresies, Book 4, ch. 28, § 3</a>)</p><h2>3rd century</h2><h3>St Cyprian of Carthage,
    hieromartyr (c. 200–258)</h3><blockquote><p>Is honour, then, given to God when
    the majesty and decree of God are so condemned, that when He declares that He
    is indignant and angry with those who sacrifice, and when He <strong>threatens
    eternal penalties and <mark>perpetual punishments</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Cornelius-Concerning-Fortunatus-and-Felicissimus-or-Against-the-Heretics">To
    Cornelius, Concerning Fortunatus and Felicissimus, or Against the Heretics</a>)</p><blockquote><p>And
    therefore with reason in these plagues that occur, there are not wanting God’s
    stripes and scourges; and since they are of no avail in this matter, and do not
    convert individuals to God by such terror of destructions, <strong>there remains
    after all the eternal dungeon, and the continual fire, and <mark>the everlasting
    punishment</mark></strong>; nor shall the groaning of the suppliants be heard
    there, because here the terror of the angry God was not heard</p><p>&lt;…&gt;</p><p>Believe
    Him who will give to all that believe the reward of eternal life. Believe Him
    who will call down on them that believe not, eternal punishments in the fires
    of Gehenna. What will then be the glory of faith? what the punishment of faithlessness?
    When the day of judgment shall come, what joy of believers, what sorrow of unbelievers;
    that they should have been unwilling to believe here, and now that they should
    be unable to return that they might believe! <strong><mark>An ever-burning Gehenna
    will burn up the condemned, and a punishment devouring with living flames; nor
    will there be any source whence at any time they may have either respite or end
    to their torments</mark></strong>. Souls with their bodies will be reserved <strong><mark>in
    infinite tortures for suffering</mark></strong>. Thus the man will be for ever
    seen by us <strong>who here gazed upon us for a season</strong>; and the <strong>short
    joy of those cruel eyes</strong> in the persecutions that they made for us will
    be <strong>compensated by a perpetual spectacle</strong>, according to the truth
    of Holy Scripture, which says, “<strong>Their worm shall not die, and their fire
    shall not be quenched; and they shall be for a vision to all flesh</strong>” (Isa.
    66:24).</p><p>&lt;…&gt;</p><p><strong><mark>The pain of punishment will then be
    without the fruit of penitence; weeping will be useless, and prayer ineffectual.
    Too late they will believe in eternal punishment who would not believe in eternal
    life.</mark></strong></p><p>Provide, therefore, while you may, for your safety
    and your life. We offer you the wholesome help of our mind and advice. And because
    we may not hate, and we please God more by rendering no return for wrong, we exhort
    you <strong>while you have the power, while there yet remains to you something
    of life</strong>, to make satisfaction to God, and to emerge from the abyss of
    darkling superstition into the bright light of true religion. We do not envy your
    comforts, nor do we conceal the divine benefits. We repay kindness for your hatred;
    and for the torments and penalties which are inflicted on us, we point out to
    you the ways of salvation. Believe and live, and do ye who persecute us in time
    rejoice with us for eternity. <strong><mark>When you have once departed thither,
    there is no longer any place for repentance, and no possibility of making satisfaction</mark></strong>.
    <strong><mark>Here life is either lost or saved</mark></strong>; here eternal
    safety is provided for by the worship of God and the fruits of faith. Nor let
    any one be restrained either by his sins or by his years from coming to obtain
    salvation. To him who still remains in this world no repentance is too late.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-an-address-to-demetrianus">An Address
    to Demetrianus</a>)</p><h2>4th century</h2><h3>Anthony the Great, monk (c. 251–356)</h3><blockquote><p>As
    much as the power and might of God are incomprehensible, so much are His workings
    incomprehensible. As His wisdom is immeasurable, so are “His ways past finding
    out” (Rom. 11:33). God can fulfill what He has promised: wherefore let us not
    allow ourselves unbelief, lest we be condemned more for unbelief than for lawless
    deeds. To err in deeds is a sign of weakness; to allow oneself unbelief is a sign
    of insolent levity and folly. <strong>While we have time, let us spare ourselves,
    and let us beseech God for the forgiveness of our sins, lest He command us to
    be “bound hand and foot, taken away, and cast into outer darkness, where there
    will be weeping and gnashing of teeth” (Matt. 22:13). What do weeping and lamentation
    signify, if not the boundlessness of cruel and terrible torments? And what is
    depicted by the gnashing of teeth, if not the greatest regret for the sins committed?</strong>
    Then — and this will surely come to pass — then we shall begin to be indignant
    with ourselves, to repent with gnashing of teeth, when <strong><mark>repentance
    will have no place, when there will be no benefit from it, when the time given
    for repentance has passed</mark>. Having the possibility to appease God in the
    brief time of earthly life by serving Him, <mark>having the possibility to deliver
    ourselves from Gehenna and eternal torments</mark></strong>, why do we abide in
    negligence, and despising the commandments of God serve our desires, delivering
    ourselves to the unavoidable punishment? Our God, great and lover of mankind,
    “rich in mercy” (Eph. 2:4), almighty in His working, may He Himself help our weakness,
    may He quickly cast down Satan under our feet, may He grant us strength and spiritual
    understanding, so that in the time remaining to us we may serve Him with faithfulness,
    in truth, and be counted worthy of His mercy on the dreadful day of His judgment.</p></blockquote><p>(Otechnik
    of St Ignatius (Brianchaninov), Anthony the Great)</p><h3>St Basil the Great,
    archbishop of Caesarea (c. 329–379)</h3><blockquote><p>Question. If one is “beaten
    with many stripes,” and another “with few” (Luke 12:47-48), why then do some say
    that there is no end to torment?</p><p>Answer. What is said in some places of
    the divinely inspired Scripture seemingly in both ways and covertly is made clear
    by what is said openly in other places. And the Lord at one time <strong>resolutely
    says that “these will go away into everlasting punishment”</strong> (Matt. 25:46),
    at another <strong>sends some away “into the everlasting fire</strong> prepared
    for the devil and his angels” (Matt. 25:41), in another place names “the Gehenna
    of fire,” and adds: “<strong>where their worm does not die, and the fire is not
    quenched</strong>” (Mark 9:47-48), and long ago foretold through the prophet concerning
    some that “<strong>their worm does not die, and their fire is not quenched</strong>”
    (Isa. 66:24); therefore, if <strong>with such a number of similar testimonies
    found in many places of the divinely inspired Scripture, <mark>many still, as
    though forgetting all such sayings and definitions of the Lord, promise themselves
    an end to torment, so as to venture upon sin more freely</mark>, this is certainly
    one of the wiles of the devil</strong>. For, <strong>if there will ever be an
    end to everlasting torment, then everlasting life, without doubt, must have an
    end too</strong>. And if we dare not think this of life, what ground is there
    for setting an end to everlasting torment? <strong><mark>One and the same word
    is ascribed alike to torment and to life: everlasting</mark></strong>. It is said:
    “these will go away into everlasting punishment, but the righteous into eternal
    life” (Matt. 25:46). The same from his exhortatory word to baptism: “for the momentary
    enjoyment of sin I suffer immortal torment; for the pleasure of the flesh I am
    now given over to fire.”</p></blockquote><p>(Rules Briefly Summarized in Questions
    and Answers, Question 267)</p><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>think ever on Him and the river of fire: “For
    a river of fire” we read, “winds before His face;” (Dan. 7:10) for it is impossible
    for one who has been delivered over by Him to the fire <strong><mark>to expect
    any end of his punishment</mark></strong>. But the unseemly pleasures of this
    life no-wise differ from shadows and dreams; for before the deed of sin is completed,
    the conditions of pleasure are extinguished; and <strong><mark>the punishments
    for these have no limit</mark></strong>. And the sweetness lasts for a little
    while but <strong>the pain is everlasting</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-an-exhortation-to-theodore-after-his-fall#HH-Letter-II">An
    Exhortation to Theodore After His Fall, Letter II</a>)</p><blockquote><p>This
    is no small subject of enquiry which we propose, but rather about things which
    are of the first necessity and which all men enquire about; namely, whether hell
    fire have any end. <strong><mark>For that it hath no end Christ indeed declared</mark></strong>
    when he said, “Their fire shall not be quenched, and their worm shall not die.”
    (Mark 9:46) Well: I know that a chill comes over you (ναρκᾶτε) on hearing these
    things; but what am I to do? For this is God’s own command, continually to sound
    these things in your ears, where He says, “Charge this people;” (Isa. 58:1) and
    ordained as we have been unto the ministry of the word, <strong>we must give pain
    to our hearers, not willingly but on compulsion</strong>. Nay rather, if you will,
    we shall avoid giving you pain. For saith He, (Rom. 13:3, in substance.) “if thou
    do that which is good, fear not:” so that it is possible for you to hear me not
    only without ill-will, but even with pleasure. As I said then; <strong><mark>that
    it hath no end, Christ has declared</mark></strong>. Paul also saith, in pointing
    out the eternity of the punishment, that the sinners “shall pay the penalty of
    destruction, and that for ever” (2 Thess. 1:9); &lt;…&gt; And the virgins too
    who were shut out, entered in no more. And also about those who gave Him no food,
    He saith, (St. Matt. 25:46.) “They shall go away into everlasting punishment.”</p><p>And
    say not unto me, “where is the rule of justice preserved entire, if <strong><mark>the
    punishment hath no end</mark></strong>?” Rather, when God doeth any thing, obey
    His decisions and submit not what is said to human reasonings. But moreover, how
    can it be any thing else than just for one who hath experienced innumerable blessings
    from the beginning, and then committed deeds worthy of punishment, and neither
    by threat nor benefit improved at all, to suffer punishment?</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-1#HH-Homily-IX">Homilies
    on First Corinthians, Homily 9</a>)</p><blockquote><p>For if <strong>the devil,
    holding out pleasure for a season, but <mark>pain for ever</mark></strong>, is
    yet strong, and prevails; seeing our case is just the reverse in these matters,
    the labor temporary, the pleasure and profit immortal, what plea shall we have,
    if we follow not virtue after so great encouragement?</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-gospel-of-saint-matthew-2#HH-Matthew-V-17">Homilies
    on the Gospel of Saint Matthew, Homily 16</a>)</p><blockquote><p>So far as to
    the things of this world; but what speech may recount the things of that world,
    either the goods or the evils? There is none. For as to the blessings, they surpass
    all thought, not speech only; for their opposites are expressed indeed in terms
    familiar to us. For fire, it is said, is there, and darkness, and bonds, and <strong>a
    worm that never dieth</strong>. But this represents not only the things which
    are spoken of, but others more intolerable. And to convince thee, consider at
    once this first: if it be fire, how is it also darkness? Seest thou how that fire
    is more intolerable than this? For it hath no light. If it be fire, how is it
    <strong>forever burning</strong>? Seest thou how something more intolerable than
    this happens? For <strong>it is not quenched. Yea, therefore it is called unquenchable</strong>.
    Let us then consider how great a misery it must be, <strong><mark>to be forever
    burning</mark></strong>, and to be in darkness, and to utter unnumbered groanings,
    and to gnash the teeth, and not even to be heard.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-epistle-to-the-hebrews-1#HH-Hebrews-112">Homilies
    on the Epistle to the Hebrews, Homily 1</a>)</p><blockquote><p>And when there
    is yet also Gehenna, and the <strong>never-dying worm</strong>, and the unquenchable
    fire, and the gnashing of teeth — how, tell me, shall we endure it?</p></blockquote><p>(Homilies
    on the Gospel of John, Homily 80)</p><blockquote><p>He did not say: violent <u>death</u>
    is bitter, but: <em>“bitter is the death of sinners”</em>. And justly: because
    after their departure from here there await them unbearable punishment, <strong>endless
    torments</strong>, the venomous worm, the unquenchable fire, outer darkness, <strong>bonds
    indissoluble</strong>, the gnashing of teeth, affliction, straitness, and everlasting
    condemnation.</p></blockquote><p>(Homilies on the Gospel of John, Homily 80)</p><blockquote><p>Indeed,
    we must fear and dread Gehenna not for the sake of that <strong>unquenchable fire</strong>,
    the terrible punishments, and the <strong>endless torments</strong>, but because
    we offend so good a Lord and become unworthy of His favor; and likewise we must
    hasten to the Kingdom out of love for Him, that we may enjoy His grace.</p></blockquote><p>(Homilies
    on Genesis, Homily 23)</p><blockquote><p>What then are those things which abide,
    both good and evil? <strong>The eternal kingdom</strong> and <strong>the everlasting
    hell</strong>. For “neither shall <strong>the worm die</strong>, nor shall <strong>the
    fire be quenched</strong>:” and “these shall rise again to everlasting life: and
    these to everlasting punishment.” That then we may escape <strong>the one</strong>
    and enjoy the other, letting go the shadow, let us cling to the real things with
    all earnestness</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-second-corinthians-3#HH-Homily-XXIX">Homilies
    on Second Corinthians, Homily 29</a>)</p><h2>Fifth Ecumenical Council (553)</h2><h3>From
    the conciliar epistle composed by the bishops of Egypt and Alexandria against
    the teaching of Origen</h3><blockquote><p>The followers of Origen, as though his
    impious teaching about the pre-existence of souls and his blasphemies against
    the Holy Trinity were not enough for them, and guided by his words wrongly understood,
    joined to their error also this <strong>opinion, that the torments of all ungodly
    men and even of demons are not everlasting</strong>, and that the ungodly and
    the demons will return to their original state. Speaking thus, they give men occasion
    to be slothful in the keeping of the commandments of God, turn them away from
    the strait and narrow path, and make them wander on the broad and spacious way.
    They <strong>go utterly against the words of the great God and our Savior Jesus
    Christ, Who in the holy Gospel teaches that as the ungodly “go away into everlasting
    punishment,” so also “the righteous into life eternal” (Matt. 25:46); and again
    to those on the right hand He says:</strong> <strong>“Come, you blessed of My
    Father, inherit the kingdom prepared for you from the foundation of the world,”
    and to those on the left hand He says: “Depart from Me, you cursed, into the everlasting
    fire prepared for the devil and his angels” (Matt. 25:34, 41)</strong>. Therefore,
    when <strong><mark>the Lord in the holy Gospel clearly proclaimed that both the
    torment and the kingdom are everlasting</mark></strong>, it is evident that the
    followers of Origen set his fables above the words of the Lord; and from this
    their madness is revealed. For, <strong><mark>if anyone, carried away by his empty
    talk, admits that the torment has an end, he must of necessity admit that the
    everlasting life promised to the righteous has an end too; because everlastingness
    is promised alike to both</mark></strong>. And if both the torment and the blessedness
    have an end, then why the incarnation of our Lord Jesus Christ? Why the crucifixion,
    and death, and tomb, and resurrection of the Lord? What profit is there for those
    who have struggled in the good contest and endured martyrdom for Christ, if the
    demons and the ungodly will attain through the restoration the same state as the
    saints? But let this turn upon the heads of those who speak such fables; for the
    words of Christ abide unshaken both in the souls of the faithful and in the very
    truth of deeds.</p><p>Those who justify the impious teaching of Origen, avoiding
    the strong arguments directed against them and wishing to cover their error, snatch
    up in fragments certain sayings of the holy fathers and, reinterpreting them after
    their own understanding, adapt them to their malady. This they do also with the
    divine Scriptures. But we shall show from the very holy fathers that these devices
    of theirs are vain. Thus St Gregory the Theologian in his apologetic oration says
    the following: “but for us, when we are in danger of losing the salvation of the
    blessed and immortal soul, which will be everlastingly either punished for wickedness
    or glorified for virtue — what struggle lies before us, and what knowledge is
    needed?”</p><p>&lt;…&gt;</p><p>Therefore, if both <strong><mark>the divine Scripture
    and the holy fathers clearly teach us that there will be no end to the torments
    of the ungodly and of the demons they deify</mark></strong>, then of what restoration
    do the like-minded of Origen dream, when the torments are without end? For the
    holy Church of Christ, as she proclaims to the righteous the everlasting life
    without end, so she proclaims to the ungodly the torment without end. In this
    is the whole matter. And we have found it needful to bring forward from the much
    said in the divine Scripture and by the holy fathers only a little, for the refutation
    of the impiety of the Origenists.</p></blockquote><p>(Acts of the Ecumenical Councils,
    vol. 5)</p><h2>Quotes of the holy fathers on the decisions of the Fifth Ecumenical
    Council (553)</h2><h3>St Sophronius, patriarch of Jerusalem (c. 560–638)</h3><p>A
    letter with the confession of faith to Patriarch Sergius, appended to the acts
    of the Sixth Ecumenical Council:</p><blockquote><p>“We <strong>believe</strong>
    that after this life that other life will <strong>continue everlastingly</strong>,
    and we also accept the [belief in] <strong>punishment without end</strong>”</p></blockquote><p>(The
    conciliar epistle)</p><h3>Photius of Constantinople, patriarch (c. 820–896)</h3><p>In
    the epistle “On the Seven Councils” to Prince Michael of Bulgaria he retells the
    decision of the Fifth Ecumenical Council:</p><blockquote><p>“And [those condemned
    by the council] <strong>preached an end to the endless torment</strong>, which
    is a summons to every sin and to perdition, and dreamed that the wicked demons
    would again be granted their first dignity &lt;…&gt; the divine assembly of hierarchs
    cut off and rejected these men… and such are the acts of the Fifth Ecumenical
    Council concerning them.”</p></blockquote><p>(Instructive Epistle on the Seven
    Councils, and on the Orthodox Faith, and How It Behoves a Prince to Act)</p><h3>Mark
    Eugenikos, metropolitan of Ephesus (1392–1444)</h3><p>On the opinion of St Gregory
    of Nyssa:</p><blockquote><p>As for the words of blessed Gregory of Nyssa quoted
    after this, it would have been better to consign them to silence and not at all
    to compel us, for the sake of our own defense, to bring them openly into the midst.
    For this teacher is plainly seen to agree with the dogmas of the Origenists and
    to introduce an end to torments; and, in particular, in those words quoted by
    you he proclaims nothing else than that there is a certain purgatory and a furnace
    of refining and a drawing to God through grief and suffering, until the time when
    the final restoration of all, and of the very demons, shall come, when “God,”
    he says, “will be all in all,” according to the word of the Apostle. Since, however,
    these words too have been brought into the midst among the others, we shall first
    answer concerning them as we have received from our Fathers: that <strong>it is
    possible that these are corruptions and insertions made by certain heretics and
    Origenists, who flourished in multitude in those times, especially in the regions
    of Egypt and Palestine, fabricated with this purpose, that it might seem that
    this holy and great luminary also has them as a patron</strong>. Then, we shall
    say that <strong>even if the saint [Gregory of Nyssa] did indeed hold this opinion,
    it was at a time when <mark>this teaching [on the finiteness of eternal torments]
    was still a matter of dispute and had not yet been finally condemned and rejected
    by the contrary opinion brought forward at the Fifth Ecumenical Council</mark></strong>;
    so that it is not surprising that he himself, being a man, erred in precision
    (of the Truth), when the same thing happened to many before him — as to Irenaeus
    of Lyons and Dionysius of Alexandria and others, for by their sayings they too
    gave a certain support to those who were not in the right way. <strong>That this
    teaching was then disputed and by no means settled so as to represent a precise
    judgment, Gregory the Theologian himself bears witness</strong>, who in his oration
    “On Baptism,” philosophizing about that unquenchable fire, says after this: “Unless
    it should please someone to understand this even here more humanely and worthily
    of the One who punishes.” Do you see how he allows those who wish to understand
    this fire more humanely? <strong><mark>But by the Fifth Ecumenical Council such
    an opinion (on the finiteness of torment) was recognized as the most inhumane
    of all teachings</mark></strong>, and, as harmful to the Church and as weakening
    the diligent, it was given over to anathema.</p><p>&lt;…&gt;</p><p>Finally, <strong><mark>this
    teaching of the restoration and of the end of everlasting torment, having taken
    its beginning from Origen</mark>, as has been said, and having prevailed among
    certain churchly men, among whom were also Didymus and Evagrius</strong> — as
    appealing to the philanthropy of God and easily acceptable among the careless,
    as the God-bearing John, builder of “the Ladder of Heaven,” says — nevertheless,
    <strong><mark>was forbidden and given over to anathema by the holy Fifth Ecumenical
    Council</mark></strong>, as relaxing the souls and making the careless still more
    careless, since they expect that at some time there will be a release from torments
    and the promised restoration. Therefore, on this ground, the dogma set forth about
    the purifying fire must be cast out of the Church, as leading the diligent to
    carelessness and persuading them not to strive with all means in the present life
    for their purification, since, allegedly, another purification is expected after
    death.</p></blockquote><p>(Discourse One on the purifying fire, § 11)</p><h3>St
    Dmitry of Rostov, hierarch (1651–1709)</h3><blockquote><p>“The Fifth Ecumenical
    Council was in the city of Constantinople, in 553 &lt;…&gt; it completed and confirmed
    the acts of the holy Council of Chalcedon, <strong>anathematized the heresies</strong>
    that had spread in its time, namely — the ancient fabulous teachings of the renowned
    teacher the presbyter Origen, Evagrius and Didymus, <strong>who senselessly taught
    that there will be an end to torments</strong>”</p></blockquote><p>(Brief Questions
    and Answers on the Faith and on Other Subjects of Knowledge Most Important for
    a Christian)</p><h3>Barsanuphius the Great, monk (mid-5th c. – 563)</h3><p><em>“Directions
    for the Spiritual Life in Answers to the Questions of the Disciples by the holy
    Fathers Barsanuphius the Great and John”</em></p><h4>Answer of St Barsanuphius
    to a monk on the teaching of Origen, Didymus and Evagrius</h4><blockquote><p>“This
    is the thorn grown from the earth cursed by the Master God. They are perfect falsehood,
    perfect darkness, perfect delusion, decisive estrangement from God. Flee them,
    brother, lest their teaching take root in your heart. They… utterly destroy the
    men who give heed to them… <strong>As for the knowledge of things to come — do
    not be deceived: what a man sows here, that he shall reap there</strong> (see
    Gal. 6:7). <strong>After the departure from here no one can make progress any
    more… Brother, here is the labor — there the recompense; here the struggle — there
    the crowns.</strong> Brother, if you wish to be saved, do not enter into this
    teaching, for I bear witness to you before God that you have fallen into the devil’s
    pit and into utter perdition. Therefore turn away from this and follow the holy
    Fathers”</p></blockquote><p>(Guidance to the Spiritual Life in Answers to the
    Questions of the Disciples, Question 606)</p><h4>Answer of St John the Prophet
    (5th–6th cc.) to the same monk</h4><blockquote><p>“This is not the wisdom descending
    from above, but <em>earthly, sensual, demonic</em> (Jas. 3:15). This is a teaching
    of the devil. This teaching <strong>leads to everlasting torment</strong> those
    who give heed to it. Whoever occupies himself with this teaching becomes a heretic.
    He who believes it has turned away from the truth. He who agrees with it is a
    stranger to the way of God… Rather leave these opinions, brother, lest your heart
    be burned by the devil’s fire”</p></blockquote><p>(Guidance to the Spiritual Life
    in Answers to the Questions of the Disciples, Question 607)</p><h3>Other testimonies
    and historical monuments</h3><h4>The conciliar decision is also set out in the
    Nomocanon or the Rudder (Kormchaya)</h4><blockquote><p>“The fifth holy Ecumenical
    Council was in the city of Constantine, in the year 6047… This holy Council… anathematized
    and rejected the senseless Origen and all his impious writings. Likewise Evagrius
    and Didymus… [the condemned] said that there will be <strong>an end to torment</strong>,
    and that the demons will return again to their original order”</p></blockquote><p>(The
    Rudder (Kormchaya Book))</p><h4>The Byzantine canonist Alexius Aristenus (†1166)</h4><blockquote><p>“The
    Fifth Council was under Justinian the Great in Constantinople against the reckless
    Origen, likewise Evagrius and Didymus, who renewed the Hellenic fables and senselessly
    <strong>said that &lt;…&gt; there is an end to torments</strong> and a restoration
    of the demons to their former state, and brought forth into the light a multitude
    of other blasphemies”</p></blockquote><p>(Interpretation of the First Canon of
    the Council of Trullo, 691)</p><h4>Fresco of the Church of the Nativity of Christ
    in Bethlehem</h4><blockquote><p>“The fifth holy council of 164 bishops was held
    against the disciples of Nestorius and against Origen. <strong>Origen taught that
    punishment has an end</strong>. Justinian the Great condemned him. The holy council
    confirmed the decisions of the preceding councils: the Mother of God is the Theotokos;
    it condemned Nestorius, his disciples, and <strong>Origen, who asserted that torment
    has an end</strong>.”</p></blockquote><p>(source)</p><h3>Answers of the fathers
    to the objection that Gregory of Nyssa allowed the cessation of eternal torments</h3><h4>Barsanuphius
    the Great, monk</h4><blockquote><p>“Hear what <strong>God revealed to me three
    days before you wrote me your question</strong>… Do not think that men, even holy
    ones, can perfectly comprehend all the depths of God… The saints, having become
    teachers… surpassed their teachers and, having received confirmation from above,
    set forth a new teaching, but at the same time kept also what they <strong>had
    received from their former teachers, that is, an unrighteous teaching</strong>”</p></blockquote><p>(Guidance
    to the Spiritual Life in Answers to the Questions of the Disciples, Question 610)</p><h4>Mark
    of Ephesus, bishop (†1444), on St Gregory of Nyssa</h4><blockquote><p>“<strong>This
    teacher is plainly seen to agree with the dogmas of the Origenists and to introduce
    an end to torments</strong>… however <strong>it was at a time when this teaching
    was still a matter of dispute and had not yet been finally condemned and rejected
    by the contrary opinion brought forward at the Fifth Ecumenical Council</strong>;
    so that it is not surprising that he himself, being a man, <strong>erred in precision
    [of the truth]</strong>… But by the Fifth Ecumenical Council such <strong>an opinion
    [on the finiteness of torment] &lt;…&gt; was given over to anathema</strong>.”</p></blockquote><p>(Discourse
    One on the purifying fire)</p><h2>7th century</h2><h3>John Climacus, monk (c.
    579–649)</h3><p>Origen taught of a gradual universal salvation</p><blockquote><p>Let
    all of us, and especially the fallen, beware lest we <strong>sicken in heart from
    <mark>the disease of the godless Origen</mark> (on the finiteness of torments
    — ed.). For this foul disease, by using God’s love for man as an excuse, is readily
    accepted by pleasure-lovers</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/rJWX_The_Ladder_of_Divine_Ascent#HH-Step-5-On-painstaking-and-true-repentance-which-constitute-the-life-of-the-holy-convicts-and-about-the-prison">The
    Ladder of Divine Ascent, Step 5, 41</a>)</p><h2>11th century</h2><h3>Nestor the
    Chronicler, monk (c. 1056–1114)</h3><blockquote><p>God also appointed one single
    day on which, descending from the heavens, He will judge the living and the dead
    and render to each according to his deeds: to the righteous — the heavenly kingdom,
    beauty unspeakable, joy without end and everlasting immortality; <strong><mark>to
    sinners — the torment of fire, the worm that sleeps not, and torment without end</mark></strong>.
    Such will be the torments of those who do not believe in God our Jesus Christ:
    those who are not baptized will be tormented in fire.</p></blockquote><p>(The
    Tale of Bygone Years)</p><h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo),
    hierarch (1651–1709)</h3><blockquote><p>The devil’s temptation is at first sweet
    as honey, but only for a short time, for <strong><mark>after this short-lived
    sweetness there will come the bitter and everlasting sorrow in endless torments</mark></strong>.</p></blockquote><p>(The
    Cell Chronicle, Events in the Fifth Century of the Fourth Millennium)</p><blockquote><p>the
    holy Apostle Thaddeus told the people also of how our Lord Jesus Christ came down
    from the heavens to earth, ineffably becoming incarnate for the salvation of men,
    how He suffered willingly, rose again, ascended into the heavens, and prepared
    <strong>for the virtuous an everlasting reward in the heavens</strong>, <strong><mark>for
    the wicked torments without end in Hades</mark></strong>.</p></blockquote><p>(Life
    of the Holy Apostle Thaddeus)</p><blockquote><p>“There should be delay no longer”
    (Rev. 10:6). Hear, sinful man, wallowing without repentance in your sins as in
    impurities, and putting off repentance to another time, to old age — hear that
    <strong>if you do not repent soon, you will not receive time for repentance</strong>.
    Believe the angel who swears by God: “There should be delay no longer.” A mortal
    illness will come upon you unexpectedly: <strong><mark>you will then wish to repent,
    but there will be no more time</mark></strong>. God’s chastisement will come upon
    you unexpectedly, fire and sword: <strong><mark>you will wish to amend, but there
    will be no more time</mark></strong>. You will fall into the hands of your enemies
    visible and invisible: <strong><mark>you will wish to weep over your sins, but
    there will be no more time</mark></strong>. The last minute of your life will
    come, all your sins will stand before you: <strong><mark>you would then wish to
    take upon yourself every repentance, even the heaviest, but you will not find
    time for repentance</mark></strong>, “for there should be delay no longer.” Now
    then, now, without putting it off, while there is time, take care of your sin,
    repent truly, but <strong><mark>afterwards there will be no more time</mark></strong>.</p></blockquote><p>(Homilies
    and Sermons, Homily 31)</p><h2>19th century</h2><h3>St Theophan the Recluse, bishop
    (1815–1894)</h3><blockquote><p><strong>There have been (and perhaps there are
    even now) <mark>clever men to whom it seemed that the torments will not be everlasting</mark></strong>,
    but there has not yet been, it seems, even one who would reject altogether the
    torments of the life to come. The sense of justice exists even in the most desperate
    sinners and hinders them from thinking so; even those invisible beings who give
    their revelations to the spiritists do not reject punishments in the future, but
    only contrive in every way to soften their terror, though nothing can be more
    doubtful than their counsels.</p><p>Well, fine: let the torments, in your view,
    not be everlasting — how long, then, will they continue? Even if a thousand thousand
    years, still they must come to an end, — you say. But what gain is there in this
    for us sinners? For the torment there will be unbearable, such as we cannot even
    imagine here on earth. If even here there are sometimes such sufferings that a
    day seems a year — what will it be there? Every minute will turn into hundreds
    of years. The prophet David says that with God a thousand years are as one day,
    and consequently, conversely, one day is as a thousand years. If we accept this
    reckoning, then even so from a single year of ours there would come out 365 thousand
    years; from ten — more than three and a half millions; from a hundred — you would
    lose the count. So this is badly contrived. Contrive rather that there will be
    no torments at all — and not on paper only, not by your own reasonings alone,
    but bring us a certificate of this from Him who has the keys of hell; then for
    us sinners this would come in handy: sin away, as much and however you like! But
    reasoning as you do… we thank you for your kind-heartedness towards us! Besides,
    everything with you is somehow indefinite. <strong><mark>You forget that there
    it will be eternity, and not time; consequently, everything there will be everlasting,
    and not temporary. You count the torments in hundreds, thousands, and millions
    of years, but there the first minute will begin, and it will have no end, for
    it will be an everlasting minute. The counting will go no further, but will halt
    on the first minute, and so it will stand</mark></strong>. Of course, <strong>when
    you hear or read somewhere the theorizing of the clever humanists, the sin-loving
    heart seems to grow merrier</strong>; but afterwards, when you begin to reflect,
    all the fears return again, and you always come back to the same thing: better
    to abandon sin and repent, or else you may be cheated — and in such a way that
    nothing can mend the matter any more. And the matter is decisive; one cannot reason
    about it somehow or other, but must reason with caution, and if one assumes, one
    must assume with such certainty as we have about what truly does or does not exist.
    The spiritists, you see, talk all sorts of things! Though the bones of their teachers
    are visible, they still listen to them, and do not see that the demons alone do
    not want to be in hell, and therefore they trouble themselves so as to gather
    in more people! “No,” they say, “there are no great torments — just a little boring
    and shameful; then you will be born anew, forget everything, and live on and on.”
    By this they take away all support from the weak man. He struggles a little with
    the passion, and then says: “Well, truly, there is nothing to be done; one must
    give in. Here I shall be born another time, and then I shall overcome.” Thus there
    came out a lifelong slave of passion, an unrepentant sinner — and this is all
    the spiritist teachers need. We shall not live to see the second birth, while
    the first has been spent on working for the passions — and the Christian host
    has diminished, and the demonic one increased.</p></blockquote><p>(Thoughts on
    Various Subjects of the Faith)</p><h3>St Barsanuphius of Optina (Plikhanov), monk
    (1845–1913)</h3><blockquote><p><strong><mark>At the present time not only among
    the laity, but even among the young clergy, there is beginning to spread the conviction
    that everlasting torments are incompatible with God’s boundless mercy — consequently,
    the torments are not everlasting. Such an error comes from a failure to understand
    the matter</mark></strong>. <strong>Everlasting torments and everlasting blessedness
    are not something that comes only from without, but is, above all, within man
    himself. The kingdom of God is within you. Whatever feelings a man plants in himself
    during life, with those he departs into eternal life.</strong> A sick body suffers
    on earth, and the stronger the sickness, the greater the suffering. So also <strong>the
    soul, infected with various diseases, begins to suffer cruelly at its passage
    into eternal life</strong>. An incurable bodily disease ends with death, but <strong><mark>how
    can a sickness of the soul come to an end when the soul has no death?</mark></strong>
    Malice, anger, irritability, fornication and other sicknesses of the soul are
    such vipers that crawl after a man even into eternal life. Hence the aim of life
    consists in crushing these vipers here on earth, in purifying one’s soul completely
    and before death saying with our Savior: “The ruler of this world is coming, and
    he has nothing in Me.” A sinful soul, not purified by repentance, cannot be in
    the communion of the saints. Even if it were placed in Paradise, it would itself
    find it unbearable to remain there, and would strive to flee from it.</p><p>Truly,
    how could a merciless one be among the merciful, an unchaste one among the chaste,
    a malicious one among the loving — and so on?</p><p>&lt;…&gt;</p><p><strong><mark>A
    wrong view of torments in general is now widely spread. They are understood somehow
    too spiritually and abstractly, as the pangs of conscience; of course, the pangs
    of conscience will be there, but there will be torments for the body as well —
    not for that one with which we are now clothed, but for the new one with which
    we shall be clothed after the resurrection. And hell has a definite place; it
    is not an abstract notion.</mark></strong></p></blockquote><p>(Conversations in
    the Skete of Optina Hermitage, June 1909)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
