    title: The Typological Significance of the Sabbath
    priority: 2
  body: '<h2>1st century</h2><h3>Author of the Epistle of Barnabas</h3><blockquote><p>If,
    therefore, <strong>any one can now sanctify the day which God hath sanctified,
    except he is pure in heart in all things, we are deceived</strong>. Behold, therefore:
    certainly then <strong><mark>one properly resting sanctifies it</mark>, when we
    ourselves, having received the promise, <mark>wickedness no longer existing, and
    all things having been made new by the Lord</mark>, shall be able to work righteousness.
    Then we shall be able to <mark>sanctify it, having been first sanctified ourselves</mark></strong>.
    Further, He says to them, “Your new moons and your Sabbath I cannot endure” (Isa.
    1:13). Ye perceive how He speaks: Your present Sabbaths are not acceptable to
    Me, but that is which I have made, [namely this,] <strong><mark>when, giving rest
    to all things, I shall make a beginning of the eighth day, that is, a beginning
    of another world</mark></strong>. <strong>Wherefore, also, we <mark>keep the eighth
    day with joyfulness, the day also on which Jesus rose again</mark> from the dead.
    And when He had manifested Himself, He ascended into the heavens</strong>.</p></blockquote><h2>2nd
    century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><p><strong>The
    reason for the Law of Moses</strong></p><blockquote><p><em>Likewise I again ask
    you: did God enjoin your fathers to present the offerings and sacrifices because
    He had need of them, or </em><strong><em>because of the hardness of their hearts
    and tendency to idolatry</em></strong><em>?</em></p><p><em>“The latter,” said
    he, “the Scriptures in like manner compel us to admit.”</em></p><p><em>&lt;…&gt;</em></p><p><strong><em>it
    was for the sins of your own nation, and for their idolatries</em></strong><em>
    and not because there was any necessity for such sacrifices, that they were likewise
    enjoined, listen to the manner in which He speaks of these by Amos, one of the
    twelve</em></p><p><em>&lt;…&gt;</em></p><p><em>Accordingly He neither takes sacrifices
    from you nor </em><strong><em>commanded them at first to be offered because they
    are needful to Him, but because of your sins</em></strong><em>. For indeed the
    temple, which is called the temple in Jerusalem, He admitted to be His house or
    court, not as though He needed it, but in order that you, in this view of it,
    giving yourselves to Him, might not worship idols. And that this is so, Isaiah
    says</em></p><p><em>&lt;…&gt;</em></p><p><em>As, then,</em><strong><em>circumcision
    began with Abraham</em></strong><em>, and </em><strong><em><mark>the Sabbath</mark>
    and sacrifices and offerings and feasts with Moses</em></strong><em>, and it has
    been proved </em><strong><em>they <mark>were enjoined on account of the hardness
    of your people’s heart, so it was necessary, in accordance with the Father’s will,
    that they should have an end</mark> in Him who was born of a virgin, of the family
    of Abraham and tribe of Judah, and of David; in Christ the Son of God</em></strong></p><p><em>&lt;…&gt;</em></p><p><strong><em>some
    injunctions were laid on you in reference to the worship of God and practice of
    righteousness</em></strong><em>; </em><strong><em>but some injunctions and acts
    were likewise mentioned in reference to the mystery of Christ, on account of the
    hardness of your people’s hearts</em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><p><strong>The reason for the Sabbath observance</strong></p><blockquote><p>Moreover,
    that <strong><em><mark>God enjoined you to keep the Sabbath</mark></em></strong><em>,
    and impose on you other precepts for a sign, as I have already said, </em><strong><em><mark>on
    account of your unrighteousness, and that of your fathers</mark></em></strong><em>
    </em><strong><em>as He declares that for the sake of the nations, lest His name
    be profaned among them, therefore He permitted some of you to remain alive</em></strong><em>—these
    words of His can prove to you</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><p>The prophets recalled the sabbath because of the corruption
    of the people, the abandonment of worship and the turning to idolatry:</p><blockquote><p><em>“I
    have passed them by, my friends,” I replied, “not because such prophecies were
    contrary to me, but because you have understood, and do understand, that although
    God commands you by all the prophets to do the same things which He also commanded
    by Moses, </em><strong><em><mark>it was on account of the hardness of your hearts,
    and your ingratitude towards Him, that He continually proclaims them</mark></em></strong><em>,
    in order that, even in this way, if you repented, you might please Him, and neither
    sacrifice your children to demons, nor be partakers with thieves, nor lovers of
    gifts, nor hunters after revenge, nor fail in doing judgment for orphans, nor
    be inattentive to the justice due to the widow nor have your hands full of blood.”</em></p><p><em>...</em></p><p><em>So
    that, as in the beginning, these things were enjoined you because of your wickedness,
    in like manner because of your stedfastness in it, or rather your increased proneness
    to it, </em><strong><em><mark>by means of the same precepts He calls you to a
    remembrance</mark></em></strong><em> or knowledge of it. </em>But you are a people
    hard-hearted and without understanding, both blind and lame, children in whom
    is no faith, as He Himself says, honouring Him only with your lips, far from Him
    in your hearts, teaching doctrines that are your own and not His.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-27">Dialogue
    with Trypho, 28</a>)</p><p>Before the prophet Moses the sabbath rest was not kept:</p><blockquote><p><strong>For,
    tell me, did God wish the priests to sin when they offer the sacrifices on the
    Sabbaths? or those to sin, who are circumcised and do circumcise on the Sabbaths;
    since He commands that on the eighth day — even though it happen to be a Sabbath
    — those who are born shall be always circumcised? or could not the infants be
    operated upon one day previous or one day subsequent to the Sabbath, if He knew
    that it is a sinful act upon the Sabbaths? Or why did He not teach those <mark>who
    are called righteous and pleasing to Him, who lived before Moses and Abraham,
    who were not circumcised in their foreskin, and observed no Sabbaths</mark> to
    keep these institutions?</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-27">Dialogue
    with Trypho, 28</a>)</p><p><strong>The general reason</strong></p><blockquote><p><em>Therefore
    we must confess that He, who is ever the same, has commanded these and such like
    institutions </em><strong><em>on account of sinful men</em></strong><em>, and
    we must declare Him to be benevolent, foreknowing, needing nothing, righteous
    and good</em></p><p><em>&lt;...&gt;</em></p><p><em>to know that </em><strong><em>your
    nation</em></strong><em> were called to conversion and repentance of spirit, while
    they were in a sinful condition and labouring under spiritual disease</em></p><p><em>&lt;…&gt;</em></p><p><strong><em>God
    by Moses laid all such ordinances upon you <mark>on account of the hardness of
    your people’s hearts, in order that, by the large number of them, you might keep
    God continually, and in every action, before your eyes, and never begin to act
    unjustly or impiously</mark></em></strong><em>. For He enjoined you to place around
    you [a fringe] of purple dye, in order that you might not forget God; and He commanded
    you to wear a phylactery, certain characters, which indeed we consider holy, being
    engraved on very thin parchment; and by these means stirring you up to retain
    a constant remembrance of God: at the same time, however, convincing you, that
    in your hearts you have not even a faint remembrance of God’s worship</em></p><p><em>...</em></p><p><em>and
    we know that </em><strong><em>the ordinances imposed <mark>by reason of the hardness
    of your people’s hearts</mark>, contribute nothing to the performance of righteousness
    and of piety</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><p><strong>He devotes to God the whole of life, not the sabbath</strong></p><blockquote><p><strong><em><mark>The
    new law requires you to keep perpetual sabbath, and you, because you are idle
    for one day</mark></em></strong><em>, suppose you are pious, not discerning why
    this has been commanded you: and if you eat unleavened bread, you say the will
    of God has been fulfilled. The Lord our God does not take pleasure in such observances:
    if there is any perjured person or a thief among you, let him cease to be so;
    if any adulterer, let him repent; then he has kept the sweet and true sabbaths
    of God</em></p><p><em>&lt;…&gt;</em></p><p><strong><em><mark>all those righteous
    men already mentioned, though they kept no Sabbaths, were pleasing to God</mark></em></strong><em>;
    and after them Abraham with all his descendants until Moses, under whom your nation
    appeared unrighteous and ungrateful to God, making a calf in the wilderness: wherefore
    God, accommodating Himself to that nation, enjoined them also to offer sacrifices,
    as if to His name, in order that you might not serve idols. Which precept, however,
    you have not observed; nay, you sacrificed your children to demons. And you </em><strong><em>were
    commanded to keep Sabbaths, that you might retain the memorial of God</em></strong><em>.
    For His word makes this announcement, saying, “That ye may know that I am God
    who redeemed you.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><p><strong>Sunday is greater than the sabbath</strong></p><blockquote><p><strong><em><mark>the
    eighth day possessed a certain mysterious import, which the seventh day did not
    possess, and which was promulgated by God through these rites</mark></em></strong><em>.
    But lest I appear now to diverge to other subjects, understand what I say: the
    blood of that circumcision is obsolete, and we trust in the blood of salvation;
    </em><strong><em>there is now another covenant, and another law has gone forth
    from Zion</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><p><strong>Assemblies on Sunday</strong></p><p>In the Roman
    Empire, this day of the week was called the day of the sun:</p><blockquote><p><strong><em>on
    the day called Sunday, all who live in cities or in the country gather together</em></strong><em>
    to one place, and the memoirs of the apostles or the writings of the prophets
    are read, as long as time permits; then, when the reader has ceased, the president
    verbally instructs, and exhorts to the imitation of these good things. Then we
    all rise together and pray, and, as we before said, when our prayer is ended,
    bread and wine and water are brought, and the president in like manner offers
    prayers and thanksgivings, according to his ability, and the people assent, saying
    Amen; and there is a distribution to each, and a participation of that over which
    thanks have been given, and to those who are absent a portion is sent by the deacons</em></p><p><em>...</em></p><p><strong><em>But
    Sunday is the day on which we all hold our common assembly</em></strong><em>,
    because it is the first day on which God, having wrought a change in the darkness
    and matter, made the world; and Jesus Christ our Saviour on the same day rose
    from the dead. For He was crucified on the day before that of Saturn; and on the
    day after that of Saturn, which is the day of the Sun, having appeared to His
    apostles and disciples, He taught them these things, which we have submitted to
    you also for your consideration</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1">Apology
    1</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>“Offer
    unto God the sacrifice of praise, and pay thy vows to the Most High; and call
    upon Me in the day of thy trouble, and I will deliver thee, and thou shalt glorify
    Me” (Ps. 50:14-15) — <strong>rejecting, indeed, those things by which sinners
    imagined they could propitiate God</strong>, and showing that He does Himself
    stand in need of nothing; but He exhorts and advises them to those things by which
    man is justified and draws nigh to God. This same declaration does Esaias make:
    “To what purpose is the multitude of your sacrifices unto Me? saith the Lord.
    I am full” (Isa. 1:11). And <strong><mark>when He had repudiated</mark> holocausts,
    and sacrifices, and oblations, as likewise the new moons, and <mark>the sabbaths</mark>,
    and the festivals, and all the rest of the services accompanying these, <mark>He
    continues, exhorting them to what pertained to salvation</mark>: “Wash you, make
    you clean, <mark>take away wickedness from your hearts</mark> from before mine
    eyes</strong>;<strong> cease from your evil ways, learn to do well, seek judgment,
    relieve the oppressed, judge the fatherless, plead for the widow; and come, let
    us reason together, saith the Lord” (Isa. 1:16-18).</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4">Against Heresies,
    Book IV, ch. 17.1</a>)</p><blockquote><p>1. Moreover, we learn from the Scripture
    itself, that God gave circumcision, not as the completer of righteousness, but
    as a sign, that the race of Abraham might continue recognisable. For it declares:
    “God said unto Abraham, Every male among you shall be circumcised; and ye shall
    circumcise the flesh of your foreskins, as a token of the covenant between Me
    and you” (Gen. 17:10-11). This same does Ezekiel the prophet say with regard to
    the Sabbaths: “Also I gave them My Sabbaths, to be a sign between Me and them,
    that they might know that I am the Lord, that sanctify them” (Ezek. 20:12). And
    in Exodus, God says to Moses: “And ye shall observe My Sabbaths; for it shall
    be a sign between Me and you for your generations” (Ex. 31:13). <strong><mark>These
    things, then, were given for a sign; but the signs were not unsymbolical, that
    is, neither unmeaning nor to no purpose, inasmuch as they were given by a wise
    Artist</mark></strong>; but <strong>the circumcision after the flesh typified
    that after the Spirit</strong>. For “we,” says the apostle, “have been circumcised
    with the circumcision made without hands” (Col. 2:11). And the prophet declares,
    “Circumcise the hardness of your heart” (Deut. 10:16). <strong><mark>But the Sabbaths
    taught that we should continue day by day in God’s service</mark>. “For we have
    been counted,” says the Apostle Paul, “all the day long as sheep for the slaughter”
    (Rom. 8:36), that is, consecrated [to God], and <mark>ministering continually
    to our faith, and persevering in it, and abstaining from all avarice, and not
    acquiring or possessing treasures upon earth</mark></strong>. Moreover, <strong><mark>the
    Sabbath of God (requietio Dei), that is, the kingdom, was, as it were, indicated
    by created things; in which [kingdom], the man who shall have persevered in serving
    God (Deo assistere) shall, in a state of rest, partake of God’s table</mark></strong>.</p><p>2.
    And that <strong><mark>man was not justified by these things, but that they were
    given as a sign to the people</mark></strong>, this fact shows — that <strong>Abraham
    himself, without circumcision and without observance of Sabbaths, “believed God,
    and it was imputed unto him for righteousness</strong>, and he was called the
    friend of God” (Jas. 2:23).</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4">Against
    Heresies, Book IV, ch. 16</a>)</p><blockquote><p>96. Wherefore also <strong>we
    need not the Law as a tutor</strong>. Behold, with the Father we speak, and in
    His presence we stand, being children in malice, and grown strong in all righteousness
    and soberness. For no longer shall the Law say, Do not commit adultery, to him
    who has no desire at all for another’s wife; and Thou shalt not kill, to him who
    has put away from himself all anger and enmity; (and) Thou shalt not covet thy
    neighbour’s field or ox or ass, to those who have no care at all for earthly things,
    but store up the heavenly fruits: nor An eye for an eye, and a tooth for a tooth
    (Ex. 21:24), to him who counts no man his enemy, but all men his neighbours, and
    therefore cannot stretch out his hand at all for vengeance. It will not require
    tithes of him who consecrates all his possessions to God, leaving father and mother
    and all his kindred, and following the Word of God. And <strong><mark>there will
    be no command to remain idle for one day of rest, to him who perpetually keeps
    sabbath, that is to say, who in the temple of God, which is man’s body, does service
    to God, and in every hour works righteousness</mark></strong>. For I desire mercy,
    He saith, and not sacrifice; and the knowledge of God more than burnt offerings
    (Hos. 6:6).</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/YQKGC4v5_The_Proof_Demonstration_of_the_Apostolic_Preaching">The
    Demonstration of the Apostolic Preaching</a>)</p><h3><a href="https://bibleox.com/en/en/w/6Frm_Tertullian_II_c">Tertullian
    (c. 155–220)</a></h3><blockquote><p>So that we are not to give heed to <em>Moses’</em>
    Law as to the primitive law, but as to a subsequent, which at a definite period
    God has set forth to the Gentiles too and, after repeatedly promising so to do
    through the prophets, has reformed for the better; and has premonished that it
    should come to pass that, just as “the law was given through <em>Moses</em>” at
    a definite time, so it should be believed to have been temporarily observed and
    kept. And let us not annul this power which God has, which reforms the law’s precepts
    answerably to the circumstances of the times, with a view to man’s salvation.
    <strong><mark>In fine, let him who contends that the Sabbath is still to be observed
    as a balm of salvation</mark></strong>, and circumcision on the eighth day because
    of the threat of death, <strong><mark>teach us that, for the time past, righteous
    men kept the Sabbath</mark></strong>, or practised circumcision, <strong><mark>and
    were thus rendered “friends of God.”</mark></strong> For if circumcision purges
    a man since God made <em>Adam</em> uncircumcised, why did He not circumcise him,
    even after his sinning, if circumcision purges? At all events, in settling him
    in paradise, He appointed one uncircumcised as colonist of paradise. Therefore,
    since <strong>God originated Adam uncircumcised</strong>, and <strong><mark>inobservant</mark>
    <mark>of the Sabbath</mark>, consequently his offspring also, <em>Abel,</em> offering
    Him sacrifices, uncircumcised and <mark>inobservant of the Sabbath</mark>, was
    by Him commended</strong>, while He accepted what <em>Abel</em> was offering in
    simplicity of heart, and reprobated the sacrifice of his brother <em>Cain,</em>
    who was <em>not rightly dividing</em> what he was offering. <strong><em>Noah</em></strong><em>
    </em>also, uncircumcised — yes, and <strong><mark>inobservant of the Sabbath</mark></strong>
    — God freed from the deluge. For <em>Enoch,</em> too, most righteous man, <strong><mark>uncircumcised</mark></strong>
    and <strong><mark>inobservant of the Sabbath</mark></strong>, He translated from
    this world; who did not first taste death, in order that, being a candidate for
    eternal life, he might by this time show us that we also may, without the burden
    of the law of Moses, please God. <em>Melchizedek</em> also, “the priest of the
    most high God,” <strong><mark>uncircumcised and inobservant of the Sabbath</mark></strong>,
    was chosen to the priesthood of God. <em>Lot,</em> withal, the brother of Abraham,
    proves that it was for the merits of righteousness, without observance of the
    law, that he was freed from the conflagration of the Sodomites.</p><p>3) But <em>Abraham,</em>
    (you say,) was circumcised. Yes, but <strong><mark>he pleased God before his circumcision;
    nor yet did he observe the Sabbath</mark></strong>.</p><p>&lt;…&gt;</p><p>4) It
    follows, accordingly, that, in so far as the abolition of carnal circumcision
    and of the old law is demonstrated as having been consummated at its specific
    times, so also <strong><mark>the observance of the Sabbath is demonstrated to
    have been temporary</mark></strong>. For the Jews say, that from the beginning
    God <em>sanctified the seventh day, by resting on it from all His works which
    He made;</em> and that thence it was, likewise, that Moses said to the People:
    <em>“Remember the day of the sabbaths, to sanctify it: every servile work ye shall
    not do therein”</em>, except what pertaineth unto life. Whence we (Christians)
    understand that we still more ought to observe a sabbath from all “servile work”
    always, and not only every seventh day, but through all time. And through this
    arises the question for us, what sabbath God willed us to keep? For the Scriptures
    point to a sabbath eternal and a sabbath temporal. For <em>Isaiah</em> the prophet
    says, <em>“Your sabbaths my soul hateth”</em> (Isa. 1:13); and in another place
    he says, <em>“My sabbaths ye have profaned”</em> (Ezek. 23:38). Whence we discern
    that the temporal sabbath is human, and the eternal sabbath is accounted divine;
    concerning which He predicts through Isaiah: <em>“And there shall be,” He says,
    “month after month, and day after day, and sabbath after sabbath; and all flesh
    shall come to adore in Jerusalem, saith the Lord”</em> (Isa. 66:23); which we
    understand to have been fulfilled in the times of Christ, when “all flesh” — that
    is, every nation — “came to adore in Jerusalem” God the Father, through Jesus
    Christ His Son, as was predicted through the prophet: <em>“Behold, proselytes
    through me shall go unto Thee.”</em></p><p>Thus, therefore, <strong>before this
    temporal sabbath, there was withal an eternal sabbath foreshown and foretold</strong>,
    just as <strong>before the carnal circumcision there was withal a spiritual circumcision
    foreshown</strong>. In short, let them teach us, as we have already premised,
    that <strong><em>Adam</em></strong><em> </em>observed the sabbath, or<em> </em><strong><em>Abel</em></strong><em>,
    </em>when offering to God a holy victim, pleased Him by a religious reverence
    for the sabbath, or<em> </em><strong><em>Enoch</em></strong>, when translated,
    had been a keeper of the sabbath, or<em> </em><strong><em>Noah</em></strong> the
    ark-builder observed, on account of the deluge, an immense sabbath, or<em> </em><strong><em>Abraham</em></strong>,
    in observance of the sabbath, offered <em>Isaac</em> his son, or <strong><em>Melchizedek</em></strong>
    in his priesthood received the law of the sabbath.</p><p>But <strong><mark>the
    Jews are sure to say, that ever since this precept was given through Moses, the
    observance has been binding</mark></strong>. <strong><mark>Manifest accordingly
    it is, that the precept was not eternal nor spiritual, but temporary</mark></strong>,
    which would one day cease. In short, so true is it that it is not in the exemption
    from work of the sabbath — that is, of the seventh day — that the celebration
    of this solemnity is to consist, that <em>Joshua</em> the son of Nun, at the time
    that he was reducing the city Jericho by war, stated that he had received from
    God a precept to order the People that priests should carry the ark of the testament
    of God seven days, making the circuit of the city; and thus, when the seventh
    day’s circuit had been performed, the walls of the city would spontaneously fall.
    Which was so done; and when the space of the seventh day was finished, just as
    was predicted, down fell the walls of the city. Whence it is manifestly shown,
    that in the number of the seven days there intervened a sabbath-day. For seven
    days, whencesoever they may have commenced, must necessarily include within them
    a sabbath-day; on which day not only must the priests have worked, but the city
    must have been made a prey by the edge of the sword by all the people of Israel.
    Nor is it doubtful that they “wrought servile work,” when, in obedience to God’s
    precept, they drave the preys of war. For in the times of the Maccabees, too,
    they did bravely in fighting on the sabbaths, and routed their foreign foes, and
    recalled the law of their fathers to the primitive style of life by fighting on
    the sabbaths. Nor should I think it was any other law which they thus vindicated,
    than the one in which they remembered the existence of the prescript touching
    “the day of the sabbaths.” Whence it is manifest that the force of such precepts
    was temporary, and respected the necessity of present circumstances; and that
    <strong><mark>it was not with a view to its observance in perpetuity that God
    formerly gave them such a law</mark></strong>.</p><p>&lt;…&gt;</p><p>6) Therefore,
    since it is manifest that <strong><mark>a sabbath temporal was shown, and a sabbath
    eternal foretold</mark></strong>; a circumcision carnal foretold, and a circumcision
    spiritual pre-indicated; a law temporal and a law eternal formally declared; sacrifices
    carnal and sacrifices spiritual foreshown; it follows that, after all these precepts
    had been given carnally, in time preceding, to the people Israel, <strong>there
    was to supervene a time whereat the precepts of the ancient Law and of the old
    ceremonies would cease, and the promise of the new law, and the recognition of
    spiritual sacrifices, and the promise of the New Testament, supervene</strong>;
    while the light from on high would beam upon us who were sitting in darkness,
    and were being detained in the shadow of death. And so there is incumbent on us
    a necessity binding us, since we have premised that a new law was predicted by
    the prophets, and that not such as had been already given to their fathers at
    the time when He led them forth from the land of Egypt, to show and prove, on
    the one hand, <strong><mark>that that old Law has ceased</mark>, and on the other,
    that the promised new law is now in operation</strong>.</p><p>And, indeed, first
    we must inquire <strong>whether there be expected a giver of the new law, and
    an heir of the new testament, and a priest of the new sacrifices, and a purger
    of the new circumcision, and an observer of the eternal sabbath</strong>, <strong>to
    suppress the old law, and institute the new testament</strong>, and offer the
    new sacrifices, and repress the ancient ceremonies, and suppress the old circumcision
    together with its own sabbath, <strong>and announce the new kingdom which is not
    corruptible</strong>. Inquire, I say, we must, whether this giver of the new law,
    observer of the spiritual sabbath, priest of the eternal sacrifices, eternal ruler
    of the eternal kingdom, be come or no: that, if he is already come, service may
    have to be rendered him; if he is not yet come, he may have to be awaited, until
    by his advent it be manifest that the old Law’s precepts are suppressed, and that
    the beginnings of the new law ought to arise.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-an-answer-to-the-jews">An
    Answer to the Jews</a>)</p><blockquote><p>It is this circumcision, therefore,
    and this renewal, <strong>which the apostle insisted on, when he forbade those
    ancient ceremonies concerning which their very founder announced that they were
    one day to cease</strong>; thus by Hosea: <strong><mark>“I will also cause all
    her mirth to cease</mark></strong>, her feast-days, her new moons, and <strong><mark>her
    Sabbaths</mark></strong>, and all her solemn feasts.” (Hos. 2:11) So likewise
    by Isaiah: “The new moons, and Sabbaths, the calling of assemblies, I cannot away
    with; your holy days, and fasts, and feast-days, my soul hateth.” Now, if even
    <strong><mark>the Creator had so long before discarded all these things, and the
    apostle was now proclaiming them to be worthy of renunciation</mark></strong>,
    the very agreement of the apostle’s meaning with the decrees of the Creator proves
    that none other God was preached by the apostle than He whose purposes he now
    wished to have recognised.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-the-five-books-against-marcion-1">Against
    Marcion, Book I</a>)</p><h2>3rd century</h2><h3>Origen (c. 185–253)</h3><blockquote><p>When
    you see that “Christ, our Passover, was sacrificed for us” (1 Cor. 5:7), and that
    we eat “the unleavened bread of sincerity and truth” (1 Cor. 5:8), when you see
    that in the church what “fell on the good ground yielded a crop: some a hundredfold,
    some sixty, some thirty” (Matt. 13:8, 23), when you see widows, virgins and martyrs,
    when you see the seed of Israel multiplied from those “who were born, not of blood
    nor of the will of the flesh, nor of the will of man, but of God” (John 1:13),
    when you see the “scattered children of God” gathered “in one” (John 11:52), when
    you see that <strong><mark>the people of God keeps the sabbath, resting not from
    the ordinary life but from the work of sin</mark></strong>, when you see all this,
    you will say: “Moses, the servant of God, is dead,” and Jesus the Son of God rules.</p><p>&lt;…&gt;</p><p>I
    in the Church am the youngest brother of Caleb, I who, setting aside and abolishing
    the letter of the law, seek in it the spiritual meaning. I <strong>reject the
    letter</strong> when I am not circumcised in the flesh, when I do not eat unleavened
    bread in the flesh, when I do not keep the Passover with the Jews and <strong><mark>do
    not keep the sabbath according to the letter</mark></strong>.</p></blockquote><p>(Homilies
    on the Book of Joshua, homily 2, 1)</p><blockquote><p>1.3. And that you may better
    understand what we are speaking of, let us bring examples from the divine books.
    <strong>Without doubt Moses understood what the true circumcision is</strong>
    (cf. Rom. 2:26-27), <strong>what the true Passover is</strong> (1 Cor. 5:7), <strong>he
    knew what is the essence of the true new moons and <mark>sabbaths</mark></strong>
    (cf. Col. 2:16-17); and <strong>although he understood all this in the spirit,
    he hid it under the veil of words</strong>, covering it with shadows and images
    of the material. And although it was known to him that “Christ, our Passover,
    was sacrificed for us” (1 Cor. 5:7), he commanded the material lamb to be slain
    at the Passover (cf. Ex. 12:3). And although he knew that the feast is to be kept
    “with the unleavened bread of sincerity and truth” (1 Cor. 5:8), he nevertheless
    gave instructions about the unleavened bread (cf. Ex. 12:8). So these things and
    things like them were “the Holy of Holies,” which, although Moses ordered it to
    be carried by others, that is, although it was to be fulfilled in reality and
    in deed, he handed down veiled and covered in ordinary words.</p><p>&lt;…&gt;</p><p><strong><mark>Moses</mark>,
    <mark>that is, the spiritual law</mark></strong>, takes a wife; and this act arouses
    the indignation of Miriam, who now is the synagogue, and she speaks with contempt,
    together with Aaron, that is, with the priests and Pharisees. And to this day
    these people attack Moses, who is with us; it seems shameful to them that <strong>he
    <mark>does not teach us</mark> the circumcision of the flesh</strong> (cf. Eph.
    2:11), <strong>nor <mark>the keeping of the sabbaths</mark></strong> and new moons
    (cf. Col. 2:16), nor the sacrifices of blood, but teaches the circumcision of
    the heart (cf. Rom. 2:29), abstinence from sin, the keeping of the feast “with
    the unleavened bread of sincerity and truth” (cf. 1 Cor. 5:8), the sacrifices
    of praise (cf. Ps. 50:14) and the offerings not of slain animals but of vices
    put to death.</p><p>&lt;…&gt;</p><p>For <strong>those who hear in church the reading
    about the rites of sacrifice or about the keeping of the sabbaths or about anything
    else of this kind inevitably grow angry and say: “Why read this in church? What
    profit have we from the Jewish instructions and the keeping of the precepts of
    a rejected people? <mark>All this belongs to the Jews, and let them follow it!</mark>”</strong>
    And that such stumbling-blocks may not come to the hearers, <strong>one must labour
    and strive to obtain the knowledge of the law, so as <mark>to understand and explain
    what is read according to what “the law is spiritual”</mark> (cf. Rom. 7:14)</strong>,
    so as not to give the unskilled and inexperienced occasion, through their learning,
    or rather idleness and negligence, to revile Moses; but let us turn to the Lord,
    that He may take away for us the “veil” (cf. 2 Cor. 3:16) of the letter, <strong>so
    that Moses may appear before us not in a distorted form but in a glorious and
    worthy one</strong>, and then we shall not only not revile Moses, but will praise
    and glorify him for the greatness of his judgments.</p></blockquote><p>(Homilies
    on the Book of Numbers)</p><blockquote><p>although not all can unfold the spiritual
    meaning in order and clearly — yet nevertheless all hold the conviction that <strong><mark>one
    must not understand in the bodily sense</mark> either the circumcision, or <mark>the
    sabbath rest</mark>, or the shedding of the blood of cattle</strong>, nor (the
    account that) God gave Moses instructions concerning all this.</p></blockquote><p>(De
    Principiis)</p><blockquote><p>I answer: since the Apostles were Jews and were
    brought up on the literal understanding of the law, Jesus perhaps had to tell
    them of <strong>what exactly the true law is, <mark>what the “heavenly shadows”
    are</mark></strong> (cf. Heb. 8:5) — <strong><mark>the things to which the Jewish
    worship pointed in the form of “image and shadow”</mark></strong>, and what the
    “good things to come” are (Heb. 10:1), which <strong><mark>were prefigured by
    the law</mark></strong> about meats and drinks, about feasts, new moons and <strong><mark>sabbaths</mark></strong>
    (Col. 2:16).</p></blockquote><p>(Against Celsus, book 2, 2)</p><blockquote><p>He
    examines every chapter of the law and ponders it, to determine when one should
    depart from the letter, when it must be accepted, and when the historical narrative
    agrees with the mystical interpretation. For “Christ has redeemed us from the
    curse of the law” (Gal. 3:13); He redeemed us not from the curse of the commandment,
    not from the curse of the testimony, not from the curse of the judgments, but
    “from the curse of the law,” that is, He made it so that we <strong><mark>should
    not be bound</mark> by the circumcision of the flesh, <mark>by the keeping of
    the sabbaths</mark> and other things of this kind</strong> (cf. Col. 2:16), contained
    not in the commandments but in the law.</p></blockquote><p>(Homilies on the Book
    of Numbers, book 2, homily 11)</p><blockquote><p>But to the apostles, who afterwards
    said: “If you become circumcised, Christ will profit you nothing” (Gal. 5:2) and
    also said: “Let no one <strong>judge you in</strong> food or in drink, or regarding
    a festival or a new moon or <strong>sabbaths</strong>, which are a shadow of things
    to come” (Col. 2:16-17), it was forbidden to have two garments, <strong>so that
    they might fully renounce the institutions of this kind of the letter of the law
    and not weary the disciples with Jewish fables</strong> (cf. Tit. 1:14) and not
    lay “a yoke on the neck of the disciples which neither our fathers nor we were
    able to bear” (Acts 15:10).</p></blockquote><p>(Homilies on the Book of Leviticus,
    homily 6.3)</p><h2>4th century</h2><h3>Council of Laodicea (360)</h3><blockquote><p><em>“That
    </em><strong><em><mark>Christians must not judaize by resting on the Sabbath</mark>,
    but must work on that day</em></strong><em>, rather honouring the Lord’s Day;
    and, if they can, resting then as Christians. </em><strong><em>But if any shall
    be found to be judaizers, let them be anathema from Christ</em></strong><em>.”</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-canons-of-the-councils-of-ancyra-neocaesarea-gangra-antioch-and-laodicea-5#HH-Canon-XXIX">Canon
    XXIX</a>)</p><h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3><blockquote><p>1.
    <strong>In the shadow of the law given through Moses, God commanded that on the
    sabbath every one should rest and do no work. <mark>This was the image and shadow
    of the true sabbath which the Lord grants to the soul</mark>. For the soul that
    has been vouchsafed to be delivered from shameful and unclean thoughts keeps the
    true sabbath, and <mark>rests a true rest, remaining idle and free from all dark
    works</mark></strong>. For there, in the figurative sabbath, although they rested
    bodily, their souls were bound by wickedness and vices; but this true sabbath
    is the true rest of the soul, which remains idle, purified of satanic thoughts,
    resting in the eternal rest of the Lord and in joy.</p><p>2. As then God commanded
    that even the irrational animals should rest on the sabbath, that the ox should
    not be forced under the yoke of necessity, and that no burden should be laid on
    the ass, because the animals themselves rested from heavy labours: <strong>so
    the Lord, having come and granting the true and eternal sabbath, gave rest to
    the soul burdened and weighed down by the burdens of lawlessness, of unclean thoughts,
    doing works of unrighteousness by necessity, because it was in slavery to cruel
    masters, and lightened it of the unbearable burdens, of vain and unclean thoughts;
    took from it the heavy yoke of works of unrighteousness, gave rest to its wearied
    self in unclean thoughts</strong>.</p><p>3. For the Lord calls man to rest, saying:
    “<strong>Come to Me, all you who labour and are heavy laden, and I will give you
    rest</strong>” (Matt. 11:28). And the souls that submit and come He gives rest
    from these heavy, burdensome and unclean thoughts; <strong><mark>they become idle
    from all lawlessness, they keep the true sabbath, pleasing and holy</mark></strong>,
    celebrate a spiritual feast of unspeakable joy and gladness, and perform from
    a pure heart a service pure and pleasing to God. And <strong><mark>this is the
    true and holy sabbath. Therefore let us also beseech God to enter into this rest</mark></strong>,
    to be set free from shameful, wicked and vain thoughts; and thus to become able
    to serve God from a pure heart and to keep the feast of the Holy Spirit. And blessed
    is he who enters into that rest. Glory to the Father who has so willed, and to
    the Son and to the Holy Spirit, for ever! Amen.</p></blockquote><p>(Spiritual
    Homilies, homily 35. On the Old and the New Sabbath)</p>

