  - src: аборт-грех
    path: Ab7r_Abortion
    title: Abortion
    title_sub: Bible quotes on the subject of abortion (the killing of children)
    meta_desc: Bible quotes on the subject of abortion (the killing of children)
    menu: { parent: Man/Sin, title: Abortion, priority: 7 }
    body: |-
      <h2>Murder Is a Sin</h2><blockquote>“<b>You shall not murder</b>” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L13">Ex. 20:13</a>) (<a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L17">Deut. 5:17</a>)</blockquote><blockquote>“Jesus said, ‘<b>You shall not murder</b>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L18">Matt. 19:18</a>) (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L21">Matt. 5:21</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L19">Mark. 10:19</a>) (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L20">Luke. 18:20</a>) (<a href="https://bibleox.com/en/eng-nkjv/rim/13/#L9">Rom. 13:9</a>)</blockquote><p>Every infant, whether still in the womb or already come out of it, is a human being. And the killing of a human being is a sin. An ancient monument of Christian writing (the Didache) says this directly:</p><blockquote>“<b>you shall not murder a child by abortion</b> nor kill that which is born” (<a href="https://bibleox.com/en/en/w/Didache/#HH-2">The Didache</a>)</blockquote><h2>An Infant Is Also a Human Being. In the Womb and Outside the Womb.</h2><p>Scripture calls infants those born long before term (in the 3rd-4th month of pregnancy):</p><blockquote>“Children a year old shall speak with their voices, and pregnant women <b>shall give birth to premature children at three and four months</b>, and these shall live and leap about” (<a href="https://bibleox.com/en/en-nrsv/3ezd/6/#L21">2 Esd. 6:21</a>)</blockquote><p>The praise of the midwives who refused to kill newborn infants:</p><blockquote>“But the midwives feared God, and did not do as the king of Egypt commanded them, but <b>saved the male children alive</b>. &lt;...&gt; Therefore God dealt well with the midwives, and the people multiplied and grew very mighty. And so it was, because the midwives feared God, that He provided households for them” (<a href="https://bibleox.com/en/eng-nkjv/ish/1/#L17,20-21">Ex. 1:17,20-21</a>)</blockquote><p>The prophet John the Baptist was filled with the Holy Spirit even before his birth, right in his mother’s womb. That is, not “something” that would someday become a human being, but the prophet John himself, while still in the womb, becomes a temple of the Spirit of God.</p><blockquote>“For he will be great in the sight of the Lord, and shall drink neither wine nor strong drink. He will also <b>be filled with the Holy Spirit, even from his mother’s womb</b>” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L15">Luke. 1:15</a>)</blockquote><p>God formed in the mother’s womb not “something” that later became a human being, but the human being himself, who later merely came out of the womb, that is, was born. And God sanctified the person even before birth:</p><blockquote>“Before <b>I formed you in the womb</b> I knew you; before <b>you were born</b> I sanctified you; I ordained you a prophet to the nations” (<a href="https://bibleox.com/en/eng-nkjv/ier/1/#L5">Jer. 1:5</a>)</blockquote><p>The much-suffering prophet Job says the same. God creates us in the womb, not “something” that will later become a human being:</p><blockquote>“Did not He who <b>made me in the womb</b> make them? Did not the same One <b>fashion us in the womb</b>?” (<a href="https://bibleox.com/en/eng-nkjv/iov/31/#L15">Job. 31:15</a>)</blockquote><p>The process of a person’s development in the mother’s womb is described as a creative act of God Himself. It is described in such a way that the person already exists, but is clothed in flesh as in a garment in order to come out into the world. Job speaks not of some material that developed and then became Job. He speaks at once of the embryo as of himself: did You not clothe <b>me</b> with flesh?</p><blockquote>“Your hands have made me and fashioned me, an intricate unity &lt;...&gt; Remember, I pray, that You have made me like clay. And will You turn me into dust again? Did You not <b>pour me out like milk, and curdle me like cheese, clothe me with skin and flesh, and knit me together with bones and sinews</b>? You have granted me life and favor, and Your care has preserved my spirit” (<a href="https://bibleox.com/en/eng-nkjv/iov/10/#L8-12">Job. 10:8-12</a>)</blockquote><p>The prophet David describes the same:</p><blockquote>“For You formed my inward parts; <b>You covered me</b> <b>in my mother’s womb</b>. &lt;...&gt; My frame was not hidden from You, when <b>I was made in secret</b>, and skillfully wrought in the lowest parts of the earth. <b>Your eyes saw my substance, being yet unformed</b>. And in Your book they all were written, the days fashioned for me, when as yet there were none of them” (<a href="https://bibleox.com/en/eng-nkjv/ps/139/#L13,15-16">Ps. 139:13,15-16</a>)</blockquote>

