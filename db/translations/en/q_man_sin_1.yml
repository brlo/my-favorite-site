  - src: смертный-грех
    path: Ms0n_Mortal_Sins
    title: Mortal Sins
    title_sub: Bible quotes about mortal sins
    meta_desc: Bible quotes about mortal sins
    menu: { parent: Man/Sin, title: Mortal Sins, priority: 0 }
    body: |-
      <p>Some of the mortal sins given in the Bible:</p><blockquote><p>“being filled with all unrighteousness, sexual immorality, wickedness, covetousness, maliciousness; full of envy, murder, strife, deceit, evil-mindedness; they are whisperers, backbiters, haters of God, violent, proud, boasters, inventors of evil things, disobedient to parents, undiscerning, untrustworthy, unloving, unforgiving, unmerciful; who, knowing the righteous judgment of God, that <strong>those who practice such things are deserving of death</strong>, not only do the same but also approve of those who practice them” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L29-32">Rom. 1:29-32</a>)</p></blockquote><blockquote><p>“Now the works of the flesh are evident, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, contentions, jealousies, outbursts of wrath, selfish ambitions, dissensions, heresies, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that <strong>those who practice such things will not inherit the kingdom of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p></blockquote><blockquote><p>“Do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived. Neither fornicators, nor idolaters, nor adulterers, nor homosexuals, nor sodomites, nor thieves, nor covetous, nor drunkards, nor revilers, nor extortioners <strong>will inherit the kingdom of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L9-10">1 Cor. 6:9-10</a>)</p></blockquote><blockquote><p>“For this you know, that no fornicator, unclean person, nor covetous man, who is an idolater, <strong>has any inheritance in the kingdom of Christ and God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L5">Eph. 5:5</a>)</p></blockquote><blockquote><p>“But the cowardly, unbelieving, abominable, murderers, sexually immoral, sorcerers, idolaters, and all liars <strong>shall have their part in the lake which burns with fire and brimstone</strong>, which is the second death” (<a href="https://bibleox.com/en/eng-nkjv/otkr/21/#L8">Rev. 21:8</a>)</p></blockquote><blockquote><p>“Blessed are those who do His commandments, that they may have the right to the tree of life, and may enter through the gates into the city. But <strong>outside</strong> are dogs and sorcerers and sexually immoral and murderers and idolaters, and whoever loves and practices a lie” (<a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L14-15">Rev. 22:14-15</a>)</p></blockquote><blockquote><p>“A false witness will not go unpunished, and <strong><mark>he who speaks lies will not escape</mark></strong>. &lt;...&gt; A false witness will not go unpunished, and <strong><mark>he who speaks lies shall perish</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/19/#L5,9">Prov. 19:5,9</a>)</p></blockquote><p>All sins can be forgiven while a person is alive and able to bring repentance, entering the Church of Christ. A person will be judged for what he did while living in the body:</p><blockquote><p><em>“For we must all appear before the judgment seat of Christ, that each one may receive </em><strong><em>the things done in the body</em></strong><em>, according to what he has done, whether good or bad” (</em><a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10"><em>2 Cor. 5:10</em></a><em>)</em></p></blockquote>

  - src: ADHo_Гордость
    path: Pr1d_Pride
    title: Pride
    menu: { parent: Man/Sin, title: Pride, priority: 1 }
    body: |-
      <h2>The Condemnation of Pride</h2><blockquote><p><em>“be clothed with humility, for </em><strong><em>‘God resists the proud</em></strong><em>, but gives grace to the humble’” (</em><a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L5"><em>1 Pet. 5:5</em></a><em>) (</em><a href="https://bibleox.com/en/eng-nkjv/iak/4/#L6"><em>James. 4:6</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>Everyone proud in heart is an abomination to the LORD</em></strong><em>; though they join forces, none will go unpunished” (</em><a href="https://bibleox.com/en/eng-nkjv/pr/16/#L5"><em>Prov. 16:5</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>The fear of the LORD is to hate evil; pride and arrogance</em></strong><em> and the evil way and the perverse mouth I hate” (</em><a href="https://bibleox.com/en/eng-nkjv/pr/8/#L13"><em>Prov. 8:13</em></a><em>)</em></p></blockquote><h2>Manifestations of Pride</h2><blockquote><p><em>“Take heed that you do not do your charitable deeds before men, to be seen by them. Otherwise you have no reward from your Father in heaven. Therefore, when you do a charitable deed, </em><strong><em>do not sound a trumpet before you as the hypocrites do</em></strong><em> in the synagogues and in the streets, </em><strong><em>that they may have glory from men</em></strong><em>. Assuredly, I say to you, they have their reward. But when you do a charitable deed, do not let your left hand know what your right hand is doing, that your charitable deed may be in secret; and your Father who sees in secret will Himself reward you openly. And when you pray, you shall not be like the hypocrites. For they love to pray standing in the synagogues and on the corners of the streets, </em><strong><em>that they may be seen by men</em></strong><em>. Assuredly, I say to you, they have their reward. But you, when you pray, go into your room, and when you have shut your door, pray to your Father who is in the secret place; and your Father who sees in secret will reward you openly” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/6/#L1-6"><em>Matt. 6:1-6</em></a><em>)</em></p></blockquote><blockquote><p><em>“Also He spoke this parable to some who </em><strong><em>trusted in themselves that they were righteous, and despised others</em></strong><em>: ‘Two men went up to the temple to pray, one a Pharisee and the other a tax collector. The Pharisee stood and prayed thus with himself, “God, I thank You that </em><strong><em>I am not like other men</em></strong><em> — extortioners, unjust, adulterers, or even as this tax collector. I fast twice a week; I give tithes of all that I possess”’” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/18/#L9-12"><em>Luke. 18:9-12</em></a><em>)</em></p></blockquote><blockquote><p><em>“Judge not, and you shall not be judged. Condemn not, and you shall not be condemned. Forgive, and you will be forgiven” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/6/#L37"><em>Luke. 6:37</em></a><em>)</em></p></blockquote><blockquote><p><em>“Blind guides, who strain out a gnat and swallow a camel!” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/23/#L24"><em>Matt. 23:24</em></a><em>)</em></p></blockquote><h2>Pride Is the Devil’s Sin</h2><blockquote><p>“Son of man, take up a lamentation for the king of Tyre, and say to him, ‘Thus says the Lord GOD: “You were the seal of perfection, full of wisdom and perfect in beauty. You were in Eden, the garden of God; every precious stone was your covering: the sardius, topaz, and diamond, beryl, onyx, and jasper, sapphire, turquoise, and emerald with gold. The workmanship of your timbrels and pipes was prepared for you on the day you were created. <strong>You were the anointed cherub</strong> who covers; I established you; you were on the holy mountain of God; you walked back and forth in the midst of fiery stones. You were perfect in your ways from the day you were created, <strong>till iniquity was found in you</strong>. By the abundance of your trading <strong>you became filled with violence within, and you sinned</strong>; therefore I cast you as a profane thing out of the mountain of God; and I destroyed you, O covering cherub, from the midst of the fiery stones. <strong><mark>Your heart was lifted up</mark> because of your beauty; you corrupted your wisdom for the sake of your splendor</strong>; I cast you to the ground, I laid you before kings, that they might gaze at you”’” (<a href="https://bibleox.com/en/eng-nkjv/iez/28/#L12-17">Ezek. 28:12-17</a>)</p></blockquote><blockquote><p>“How you are fallen from heaven, O Lucifer, son of the morning! How you are cut down to the ground, you who weakened the nations! For <strong><mark>you have said in your heart: ‘I will ascend into heaven, I will exalt my throne above the stars of God</mark>; I will also sit on the mount of the congregation on the farthest sides of the north; I will ascend above the heights of the clouds, I will be like the Most High’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/14/#L12-14">Isa. 14:12-14</a>)</p></blockquote>

  - src: непрощение
    path: Uf2g_Unforgiveness
    title: Unforgiveness
    meta_desc: Bible quotes about the sin of unforgiveness, about mercilessness and cruelty
    menu: { parent: Man/Sin, title: Unforgiveness, priority: 2 }
    body: |-
      <blockquote><p>“Blessed are <strong>the merciful</strong>, for they <strong>shall obtain mercy</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L7">Matt. 5:7</a>)</p></blockquote><blockquote><p>“In this manner, therefore, pray: Our Father in heaven, hallowed be Your name. &lt;...&gt; And <strong>forgive us our debts, as we forgive</strong> our debtors. &lt;...&gt; For <strong>if you forgive men their trespasses, your heavenly Father will also forgive you. But if you do not forgive men their trespasses, neither will your Father forgive your trespasses</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L9,12,14-15">Matt. 6:9,12,14-15</a>)</p></blockquote><blockquote><p>“Judge not, and you shall not be judged. Condemn not, and you shall not be condemned. <strong>Forgive, and you will be forgiven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L37">Luke. 6:37</a>)</p></blockquote><blockquote><p>“Then Peter came to Him and said, ‘Lord, <strong>how often shall my brother sin against me, and I forgive him</strong>? Up to seven times?’ Jesus said to him, ‘I do not say to you, up to seven times, but up to seventy times seven’” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L21-22">Matt. 18:21-22</a>)</p></blockquote><blockquote><p>“And be kind to one another, tenderhearted, <strong>forgiving one another</strong>, <strong>even as God in Christ forgave you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L32">Eph. 4:32</a>)</p></blockquote><blockquote><p>“For <strong>we</strong> ourselves were also <strong>once</strong> foolish, disobedient, deceived, serving various lusts and pleasures, <strong>living in malice</strong> and envy, hateful and <strong>hating one another</strong>” (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L3">Titus. 3:3</a>)</p></blockquote><blockquote><p>“Therefore <strong>if you bring your gift to the altar, and there remember that your brother has something against you, leave your gift there before the altar, and go your way. First be reconciled to your brother</strong>, and then come and offer your gift. <strong>Agree with your adversary quickly, while you are on the way with him</strong>, lest your adversary deliver you to the judge, the judge hand you over to the officer, and you be thrown into prison. Assuredly, I say to you, you will by no means get out of there till you have paid the last penny” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L23-26">Matt. 5:23-26</a>)</p></blockquote><blockquote><p>“<strong>Do not grumble against one another, brethren, lest you be condemned</strong>. Behold, the Judge is standing at the door!” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L9">James. 5:9</a>)</p></blockquote><blockquote><p>“being filled with all unrighteousness, sexual immorality, wickedness, covetousness, maliciousness; full of envy, murder, <strong>strife</strong>, deceit, evil-mindedness; they are whisperers, backbiters, haters of God, <strong>violent</strong>, <strong>proud</strong>, boasters, inventors of evil things, disobedient to parents, undiscerning, untrustworthy, unloving, <strong>unforgiving</strong>, <strong>unmerciful</strong>; who, knowing the righteous judgment of God, that <strong>those who practice such things are deserving of death</strong>, not only do the same but also approve of those who practice them” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L29-32">Rom. 1:29-32</a>)</p></blockquote><blockquote><p>“Now the works of the flesh are evident, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, <strong>contentions</strong>, jealousies, <strong>outbursts of wrath</strong>, selfish ambitions, <strong>dissensions</strong>, heresies, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that those who practice such things <strong>will not inherit the kingdom of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p></blockquote><blockquote><p>“Then his master, after he had called him, said to him, <strong>‘You wicked servant! I forgave you all that debt because you begged me. Should you not also have had compassion on your fellow servant, just as I had pity on you?’</strong> And his master was angry, and delivered him to the torturers until he should pay all that was due to him. <strong>So My heavenly Father also will do to you if each of you, from his heart, does not forgive his brother his trespasses</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L32-35">Matt. 18:32-35</a>)</p></blockquote>

  - src: cICd_Ложь_обман
    path: Ly3g_Lying_Deceit
    title: Lying (Deceit)
    menu: { parent: Man/Sin, title: Lying, priority: 3 }
    body: |-
      <blockquote><p>“You are of your father <strong><mark>the devil</mark></strong>, and the desires of your father you want to do. He was a murderer from the beginning, and does not stand in the truth, because there is no truth in him. When he speaks a lie, he speaks from his own resources, for he is <strong><mark>a liar and the father of it</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/8/#L44">John. 8:44</a>)</p></blockquote><blockquote><p>“A false witness will not go unpunished, and <strong>he who speaks lies will not escape</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/19/#L5">Prov. 19:5</a>)</p></blockquote><blockquote><p>“<strong>You shall not bear false witness</strong> against your neighbor” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L16">Ex. 20:16</a>)</p></blockquote><blockquote><p>“You shall not steal, <strong>nor deal falsely, nor lie to one another</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L11">Lev. 19:11</a>)</p></blockquote><blockquote><p>“But now you yourselves are to put off all these: anger, wrath, malice, blasphemy, filthy language out of your mouth. <strong>Do not lie to one another</strong>, since you have put off the old man with his deeds” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L8-9">Col. 3:8-9</a>)</p></blockquote><blockquote><p>“Therefore, <strong>putting away lying, ‘Let each one of you speak truth</strong> with his neighbor,’ for we are members of one another” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L25">Eph. 4:25</a>)</p></blockquote><blockquote><p>“<strong>All unrighteousness is sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L17">1 John. 5:17</a>)</p></blockquote><blockquote><p>“<strong>Lying lips are an abomination to the LORD</strong>, but those who deal truthfully are His delight” (<a href="https://bibleox.com/en/eng-nkjv/pr/12/#L22">Prov. 12:22</a>)</p></blockquote><blockquote><p>“The boastful shall not stand in Your sight; You hate all workers of iniquity. <strong>You shall destroy those who speak falsehood</strong>; the LORD abhors the bloodthirsty and deceitful man” (<a href="https://bibleox.com/en/eng-nkjv/ps/5/#L5-6">Ps. 5:5-6</a>)</p></blockquote><blockquote><p>“But <strong>cursed be the deceiver</strong> who has in his flock a male, and takes a vow, but sacrifices to the Lord what is blemished — for I am a great King,’ says the LORD of hosts, ‘and My name is to be feared among the nations” (<a href="https://bibleox.com/en/eng-nkjv/mal/1/#L14">Mal. 1:14</a>)</p></blockquote>

  - src: грех-осуждение
    path: Jd4m_Judging_Others
    title: Judging Others
    meta_desc: Bible quotes about the sin of judging others
    menu: { parent: Man/Sin, title: Judging Others, priority: 4 }
    body: |-
      <p>The Lord Jesus Christ forbids judging others:</p><blockquote>“<b>Judge not</b>, that you be not judged” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L1">Matt. 7:1</a>)</blockquote><blockquote>“<b>Judge not</b>, and you shall not be judged. <b>Condemn not</b>, and you shall not be condemned. Forgive, and you will be forgiven” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L37">Luke. 6:37</a>)</blockquote><p>Addressing these words to those who judge others while themselves full of an even greater sin:</p><blockquote>“Or how can you say to your brother, ‘Let me remove the speck from your eye’; and look, a plank is in your own eye? <b>Hypocrite! First remove the plank from your own eye, and then you will see clearly to remove the speck from your brother’s eye</b>” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L4-5">Matt. 7:4-5</a>)</blockquote><p>At the same time, He teaches to judge with righteous judgment:</p><blockquote>“Do not judge according to appearance, but <b>judge with righteous judgment</b>” (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L24">John. 7:24</a>)</blockquote><blockquote>“Therefore <b>do not be unwise</b>, but understand what the will of the Lord is” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L17">Eph. 5:17</a>)</blockquote><blockquote>“Yes, and <b>why, even of yourselves, do you not judge</b> what is right?” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L57">Luke. 12:57</a>)</blockquote><p>The apostles speak of the necessity of judgment:</p><blockquote>“For what have I to do with judging those also who are outside? <b>Do you not judge those who are inside?</b> But those who are outside God judges. Therefore <b>‘put away from yourselves the evil person’</b>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/5/#L12-13">1 Cor. 5:12-13</a>)</blockquote><blockquote>“Dare any of you, having a matter against another, go to law before the unrighteous, and not before the saints? Do you not know that the saints will judge the world? And if the world will be judged by you, <b>are you unworthy to judge the smallest matters?</b> &lt;...&gt; I say this to your shame. <b>Is it so, that there is not a wise man among you, not even one, who will be able to judge between his brethren?</b>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L1-2,5">1 Cor. 6:1-2,5</a>)</blockquote>

