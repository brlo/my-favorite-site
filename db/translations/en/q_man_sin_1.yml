      <h2>A Sin</h2><p>Everything else also belongs to the section “Witchcraft”:</p><ul><li>fortune-telling (of any kind), </li><li>calling up spirits, </li><li>belief in magic (any kind, black, white), </li><li>in the power of amulets (including red threads), </li><li>of charmed objects, </li><li>horoscopes (astrology), </li><li>turning to psychics, </li><li>sorcerers, </li><li>magicians, </li><li>witches, </li><li>soothsayers, </li><li>enchanters, </li><li>old women who remove the “evil eye”, “curses”, “ancestral curses” </li><li>and so on:</li></ul><blockquote>“When you come into the land which the LORD your God is giving you, you shall not learn to follow the abominations of those nations. There shall not be found among you anyone who <b>makes his son or his daughter pass through the fire</b>, or <b>one who practices witchcraft</b>, or <b>a soothsayer</b>, or <b>one who interprets omens</b>, or <b>a sorcerer</b>, or <b>one who conjures spells</b>, or <b>a medium</b>, or <b>a spiritist</b>, or <b>one who calls up the dead</b>. For <b>all who do these things are an abomination to the LORD</b>, and because of these abominations the LORD your God drives them out from before you. You shall be blameless before the LORD your God. For these nations which you will dispossess <b>listened to soothsayers</b> and <b>diviners</b>; but as for you, the LORD your God has not appointed such for you” (<a href="https://bibleox.com/en/eng-nkjv/vtor/18/#L9-14">Deut. 18:9-14</a>)</blockquote><blockquote>“And they caused their sons and daughters to pass through the fire, <b>practiced witchcraft</b> and <b>soothsaying</b>, and sold themselves to do evil in the sight of the LORD, to provoke Him to anger” (<a href="https://bibleox.com/en/eng-nkjv/4ts/17/#L17">2 Kin. 17:17</a>)</blockquote><blockquote>“Also he <b>caused his sons to pass through the fire</b> in the Valley of the Son of Hinnom; he <b>practiced soothsaying</b>, <b>used witchcraft</b> and <b>sorcery</b>, and <b>consulted mediums</b> and <b>spiritists</b>. <b>He did much evil in the sight of the LORD</b>, to provoke Him to anger. He even <b>set a carved image</b>, the idol which he had made, in the house of God” (<a href="https://bibleox.com/en/eng-nkjv/2par/33/#L6-7">2 Chr. 33:6-7</a>)</blockquote><blockquote>“And when they say to you, ‘Seek those who are <b>mediums</b> and <b>wizards</b>, who <b>whisper</b> and <b>mutter</b>,’ <b>should not a people seek their God?</b> Should they seek the dead on behalf of the living?” (<a href="https://bibleox.com/en/eng-nkjv/is/8/#L19">Isa. 8:19</a>)</blockquote><blockquote>“Therefore do not listen to <b>your prophets</b>, your <b>diviners</b>, your <b>dreamers</b>, your <b>soothsayers</b>, or your <b>sorcerers</b>, who speak to you, saying, ‘You shall not serve the king of Babylon’” (<a href="https://bibleox.com/en/eng-nkjv/ier/27/#L9">Jer. 27:9</a>)</blockquote><blockquote>“For thus says the LORD of hosts, the God of Israel: Do not let <b>your prophets</b> and your <b>diviners</b> who are in your midst deceive you, <b>nor listen to your dreams</b> which you cause to be dreamed” (<a href="https://bibleox.com/en/eng-nkjv/ier/29/#L8">Jer. 29:8</a>)</blockquote><blockquote>“and say, ‘Thus says the Lord GOD: “Woe to the women <b>who sew magic charms</b> on their sleeves and make veils for the heads of people of every height to hunt souls! Will you hunt the souls of My people, and keep yourselves alive?”’” (<a href="https://bibleox.com/en/eng-nkjv/iez/13/#L18">Ezek. 13:18</a>)</blockquote><blockquote>“Therefore thus says the Lord GOD: ‘Behold, I am against <b>your magic charms</b> by which you hunt souls there like birds. I will tear them from your arms, and let the souls go, the souls you hunt like birds’” (<a href="https://bibleox.com/en/eng-nkjv/iez/13/#L20">Ezek. 13:20</a>)</blockquote><blockquote>“Thus says the LORD, your Redeemer, and He who formed you from the womb: ‘I am the LORD, who makes all things, who stretches out the heavens all alone, who spreads abroad the earth by Myself; <b>who frustrates the signs of the babblers</b>, and <b>drives diviners mad</b>; <b>who turns wise men backward, and makes their knowledge foolishness</b>’” (<a href="https://bibleox.com/en/eng-nkjv/is/44/#L24-25">Isa. 44:24-25</a>)</blockquote><blockquote>“I will cut off <b>sorceries</b> from your hand, and you shall have no <b>soothsayers</b>. Your <b>carved images</b> I will also cut off, and your sacred pillars from your midst; you shall no more worship the work of your hands; I will pluck your <b>wooden images</b> from your midst; thus I will destroy your cities” (<a href="https://bibleox.com/en/eng-nkjv/mih/5/#L12-14">Mic. 5:12-14</a>)</blockquote><blockquote>“And they did not repent of their murders or their <b>sorceries</b> or their sexual immorality or their thefts” (<a href="https://bibleox.com/en/eng-nkjv/otkr/9/#L21">Rev. 9:21</a>)</blockquote><blockquote>“He who overcomes shall inherit all things, and I will be his God and he shall be My son. But the cowardly, unbelieving, abominable, murderers, sexually immoral, <b>sorcerers</b>, <b>idolaters</b>, and all liars shall have their part in the lake which burns with fire and brimstone, which is the second death” (<a href="https://bibleox.com/en/eng-nkjv/otkr/21/#L7-8">Rev. 21:7-8</a>)</blockquote><blockquote>“But outside are dogs and <b>sorcerers</b> and sexually immoral and murderers and idolaters, and whoever loves and practices a lie” (<a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L15">Rev. 22:15</a>)</blockquote><h2>Enchanters and Sorcerers Are Nothing Against God. They Will Not Save People from His Punishments.</h2><blockquote>“But these two things shall come to you in a moment, in one day: the loss of children, and widowhood. They shall come upon you in their fullness because of the multitude of your <b>sorceries</b>, for the great abundance of your <b>enchantments</b>” (<a href="https://bibleox.com/en/eng-nkjv/is/47/#L9">Isa. 47:9</a>)</blockquote><blockquote>“Stand now with your <b>enchantments</b> and the multitude of your <b>sorceries</b>, in which you have labored from your youth — perhaps you will be able to profit, perhaps you will prevail. You are wearied in the multitude of your counsels; let now <b>the astrologers</b>, <b>the stargazers</b>, and <b>the monthly prognosticators</b> stand up and save you from what shall come upon you. Behold, <b>they shall be as stubble, the fire shall burn them</b>; they shall not deliver themselves from the power of the flame; it shall not be a coal to be warmed by, nor a fire to sit before! Thus shall they be to you with whom you have labored, your merchants from your youth; they shall wander each one to his quarter. <b>No one shall save you</b>” (<a href="https://bibleox.com/en/eng-nkjv/is/47/#L12-15">Isa. 47:12-15</a>)</blockquote><h2>Turning to the Dark Powers Is Betrayal of God (Adultery)</h2><blockquote>“But come here, you sons of <b>the sorceress</b>, you <b>offspring of the adulterer</b> and <b>the harlot</b>! Whom do you ridicule? Against whom do you make a wide mouth and stick out the tongue? Are you not children of transgression, <b>offspring of falsehood, inflaming yourselves with gods</b> under every green tree, slaying the children in the valleys, under the clefts of the rocks?” (<a href="https://bibleox.com/en/eng-nkjv/is/57/#L3-5">Isa. 57:3-5</a>)</blockquote><blockquote>“Because of the multitude of harlotries of the seductive harlot, the mistress of <b>sorceries</b>, who sells nations through her <b>harlotries</b>, and families through her <b>sorceries</b>” (<a href="https://bibleox.com/en/eng-nkjv/naum/3/#L4">Nah. 3:4</a>)</blockquote><blockquote>“And I will come near you for judgment; I will be a swift witness against <b>sorcerers</b>, against <b>adulterers</b>, against perjurers, against those who exploit wage earners and widows and orphans, and against those who turn away an alien — because they do not fear Me,’ says the LORD of hosts” (<a href="https://bibleox.com/en/eng-nkjv/mal/3/#L5">Mal. 3:5</a>)</blockquote><h2>Turning to Christianity, People Renounced Sorcery</h2><blockquote>“And many who had believed came confessing and telling their deeds. Also, many of those who had practiced <b>magic</b> brought their books together and burned them in the sight of all. And they counted up the value of them, and it totaled fifty thousand pieces of silver” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L18-19">Act. 19:18-19</a>)</blockquote>
