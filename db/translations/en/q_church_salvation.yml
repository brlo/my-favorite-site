      <h2>What Salvation Is</h2><p>Salvation is eternal life with God, salvation from death, a new (transfigured) life.</p><h3>Eternal Life with God</h3><blockquote><p>“If your hand or foot causes you to sin, cut it off and cast it from you. It is better for you <strong>to enter into life</strong> lame or maimed, rather than having two hands or two feet, to be cast into the everlasting fire” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L8">Matt. 18:8</a>)</p></blockquote><blockquote><p>“So He said to him, ‘Why do you call Me good? No one is good but One, that is, God. <strong>But if you want to enter into life</strong>, keep the commandments’” (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L17">Matt. 19:17</a>)</p></blockquote><h3>Deification (Theosis)</h3><blockquote><p>“as <strong>His divine power has given to us</strong> all things that pertain to life and godliness, through the knowledge of Him who called us by glory and virtue, by which have been given to us exceedingly great and precious <strong>promises, that through these you may be partakers of the divine nature</strong>, having escaped the corruption that is in the world through lust” (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L3-4">2 Pet. 1:3-4</a>)</p></blockquote><blockquote><p>“who <strong>will transform our lowly body that it may be conformed to His glorious body</strong>, according to the working by which He is able even to subdue all things to Himself” (<a href="https://bibleox.com/en/eng-nkjv/fil/3/#L21">Phil. 3:21</a>)</p></blockquote><p><a href="https://bibleox.com/en/eng-nkjv/in/17/#L21-23">John. 17:21-23</a>; <a href="https://bibleox.com/en/eng-nkjv/1in/3/#L2">1 John. 3:2</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/82/#L6">Ps. 82:6</a>; <a href="https://bibleox.com/en/eng-nkjv/gal/2/#L20">Gal. 2:20</a>; <a href="https://bibleox.com/en/eng-nkjv/rim/8/#L14,16">Rom. 8:14,16</a></p><h2>The Conditions of Salvation</h2><h3>The Right Faith in Christ</h3><blockquote><p>“<strong>by the name of Jesus Christ</strong> of Nazareth, whom you crucified, whom God raised from the dead, by Him this man stands here before you whole. This is the ‘stone which was rejected by you builders, which has become the chief cornerstone.’ <strong>Nor is there salvation in any other</strong>, for there is <strong>no other name under heaven given among men by which we must be saved</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L10-12">Act. 4:10-12</a>)</p></blockquote><blockquote><p>“But <strong>without faith it is impossible to please Him</strong>, for he who comes to God must believe that He is, and that He is a rewarder of those who diligently seek Him” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L6">Heb. 11:6</a>)</p></blockquote><blockquote><p>“Whoever <strong>transgresses and does not abide in <mark>the doctrine of Christ</mark> does not have God</strong>. He who abides <strong>in the doctrine of Christ</strong> has both the Father and the Son” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9">2 John. 1:9</a>)</p></blockquote><blockquote><p>“Now <strong>the works of the flesh</strong> are evident, which are: adultery, &lt;…&gt; <strong><mark>heresies</mark></strong>, &lt;…&gt; and the like; of which I tell you beforehand, just as I also told you in time past, that <strong>those who practice such things <mark>will not inherit the kingdom of God</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p></blockquote><h3>The Works of Faith</h3><h4>Keeping the Commandments</h4><blockquote><p>“But if you want to enter into life, <strong><mark>keep the commandments</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L17">Matt. 19:17</a>)</p></blockquote><blockquote><p>“Therefore whoever hears <strong>these sayings of Mine, and <mark>does</mark> them</strong>, I will liken him to a wise man who built his house on the rock” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L24">Matt. 7:24</a>)</p></blockquote><blockquote><p>“Whoever comes to Me, and <strong>hears My sayings and <mark>does</mark> them</strong>, I will show you whom he is like: He is like a man building a house, who dug deep and laid the foundation on the rock. And when the flood arose, the stream beat vehemently against that house, and could not shake it, for it was founded on the rock. <strong>But he who heard and <mark>did nothing</mark> is like a man who built a house on the earth without a foundation</strong>, against which the stream beat vehemently; and immediately <strong>it fell</strong>. And the ruin of that house was great” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L47-49">Luke. 6:47-49</a>)</p></blockquote><blockquote><p>“But be <strong><mark>doers</mark></strong> of the word, and not hearers only, deceiving yourselves. For if anyone is a hearer of the word and not a doer, he is like a man observing his natural face in a mirror” (<a href="https://bibleox.com/en/eng-nkjv/iak/1/#L22-23">James. 1:22-23</a>)</p></blockquote><h4>The Necessity of Life in the <a href="https://bibleox.com/en/en/w/Cw7a_The_Church/">Church</a></h4><blockquote><p>“Christ is head of the church; and He is <strong><mark>the Savior of the body</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L23">Eph. 5:23</a>)</p></blockquote><blockquote><p>“<strong><mark>His body</mark></strong>, which is <strong><mark>the church</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L24">Col. 1:24</a>)</p></blockquote><blockquote><p>“For <strong>by one Spirit we were all <mark>baptized into one body</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>)</p></blockquote><blockquote><p>“For as many of you as <strong><mark>were baptized into Christ have put on Christ</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal. 3:27</a>)</p></blockquote><blockquote><p>“And the Lord <strong><mark>added to the church</mark></strong> daily <strong><mark>those who were being saved</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L47">Act. 2:47</a>)</p></blockquote><h4>Baptism</h4><p>Baptism is also called “being born from above”:</p><blockquote><p>“<strong>unless one is <mark>born of water and the Spirit</mark></strong>, <strong>he cannot enter the kingdom of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L5">John. 3:5</a>)</p></blockquote><p>More: <a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D0%B5">https://bibleox.com/ru/ru/w/крещение</a></p><h4>Communion of the Flesh and Blood of Christ</h4><blockquote><p>“Then Jesus said to them, ‘Most assuredly, I say to you, <strong>unless you <mark>eat the flesh of the Son of Man and drink His blood</mark>, you have no life in you</strong>. Whoever eats My flesh and drinks My blood has eternal life, and I <strong>will raise him up at the last day</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/6/#L53-54">John. 6:53-54</a>)</p></blockquote><p>More: <a href="https://bibleox.com/en/en/w/Eucharist/">https://bibleox.com/en/en/w/Eucharist</a></p><h2>Not Only Faith but Also Works Are Necessary for Salvation</h2><h3>Faith Without Works Does Not Save</h3><blockquote><p>“My brethren, do not hold the faith of our Lord Jesus Christ, the Lord of glory, with partiality. &lt;...&gt; What does it profit, my brethren, <strong>if someone says he has faith but <mark>does not have works? Can faith save him?</mark></strong> If a brother or sister is naked and destitute of daily food, and one of you says to them, ‘Depart in peace, be warmed and filled,’ but you do not give them the things which are needed for the body, what does it profit? Thus also <strong><mark>faith by itself, if it does not have works, is dead</mark></strong>. But someone will say, ‘You have faith, and I have works.’ Show me your faith without your works, and I will show you my faith by my works. You believe that there is one God. You do well. <strong>Even the demons believe</strong> — and tremble! But do you want to know, O foolish man, that <strong><mark>faith without works is dead</mark></strong>?” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L1,14-20">James. 2:1,14-20</a>)</p></blockquote><h3>Many Who Practice Lawlessness Will Perish, Although They Not Only Believed but Even Worked Miracles in Christ’s Name</h3><blockquote><p>“<strong>Many</strong> will say to Me in that day, ‘Lord, Lord, have we not <strong>prophesied</strong> in Your name, <strong>cast out demons</strong> in Your name, and <strong>done many wonders</strong> in Your name?’ And then I will declare to them, ‘<strong>I never knew you; <mark>depart</mark></strong> from Me, <strong><mark>you who practice lawlessness</mark></strong>!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><h3>The Judgment Takes Place on the Basis of Works</h3><blockquote><p>“For the Son of Man will come in the glory of His Father with His angels, and then <strong><mark>He will reward each according to his works</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27">Matt. 16:27</a>)</p></blockquote><blockquote><p>“For <strong><mark>we must all</mark></strong> <strong>appear before the judgment seat</strong> of Christ, that <strong><mark>each one</mark> may receive the things done in the body, <mark>according to what he has done</mark></strong>, whether good or bad” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><blockquote><p>“with goodwill doing service, as to the Lord, and not to men, <strong>knowing that <mark>whatever good anyone does, he will receive the same</mark> from the Lord</strong>, whether he is a slave or free” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L7-8">Eph. 6:7-8</a>)</p></blockquote><blockquote><p>“Also to You, O Lord, belongs mercy; for <strong><mark>You render to each one according to his work</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/62/#L12">Ps. 62:12</a>)</p></blockquote><blockquote><p>“who ‘<strong><mark>will render to each one according to his deeds</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L6">Rom. 2:6</a>)</p></blockquote><blockquote><p>“and all the churches shall know that I am He who searches the minds and hearts. And <strong><mark>I will give to each one of you according to your works</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L23">Rev. 2:23</a>)</p></blockquote><blockquote><p>“And behold, I am coming quickly, and My reward is with Me, <strong><mark>to give to every one according to his work</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L12">Rev. 22:12</a>)</p></blockquote><h3>Justification by Works, and Not by Faith Only</h3><blockquote><p>“<strong>Was not Abraham our father justified by works</strong> when he offered Isaac his son on the altar? Do you see that faith was working together with his works, and by works faith was made perfect? And the Scripture was fulfilled which says, ‘Abraham believed God, and it was accounted to him for righteousness.’ And he was called the friend of God. You see then that <strong><mark>a man is justified by works, and not by faith only</mark></strong>. Likewise, <strong>was not Rahab the harlot also justified by works</strong> when she received the messengers and sent them out another way? For as the body without the spirit is dead, so faith without works is dead also” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L21-26">James. 2:21-26</a>)</p></blockquote><h3>By Patient Continuance in Doing Good Eternal Life Is Obtained</h3><blockquote><p>“But in accordance with your hardness and your impenitent heart you are treasuring up for yourself wrath in the day of wrath and revelation of the righteous judgment of God, who ‘<strong>will render to each one according to his deeds</strong>’: <strong><mark>eternal life</mark> to those who <mark>by patient continuance in doing good seek</mark> for glory, honor, and <mark>immortality</mark></strong>; but to those who are self-seeking and do not obey the truth, but obey unrighteousness — indignation and wrath” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L5-8">Rom. 2:5-8</a>)</p></blockquote><h3>To Be Rich in Works in Order to Attain Eternal Life</h3><blockquote><p>“Let them do good, that they <strong><mark>be rich in good works</mark></strong>, ready to give, willing to share, storing up for themselves a good foundation for the time to come, <strong><mark>that they may lay hold on eternal life</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L18-19">1 Tim. 6:18-19</a>)</p></blockquote><h3>Created for Good Works</h3><p>The absence of works is a violation of God’s will for oneself. Without good works a person will not fulfill his purpose, will not fulfill that for which he was created:</p><blockquote><p>“For we are His workmanship, <strong><mark>created</mark> in Christ Jesus <mark>for good works</mark></strong>, which God prepared beforehand that we should walk in them” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L10">Eph. 2:10</a>)</p></blockquote><h3>The Kingdom of God Is Inherited by Following Christ in Patient Endurance of Suffering</h3><blockquote><p>“and if children, then <strong><mark>heirs</mark></strong> — heirs of God and joint heirs with Christ, <strong><mark>if</mark></strong> indeed <strong><mark>we suffer with Him</mark></strong>, that we may also be glorified together” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L17">Rom. 8:17</a>)</p></blockquote><h3>The Apostle Knows That the Preaching of the Gospel (a Work) Will Serve for His Salvation</h3><blockquote><p>“For I know that this <strong>will turn out for my deliverance</strong> <em>(Greek: εἰς σωτηρίαν — “for salvation”)</em> through your prayer and the supply of the Spirit of Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L19">Phil. 1:19</a>)</p></blockquote><h3>The Righteousness of a Christian Must Exceed the Righteousness of the Scribes and Pharisees</h3><blockquote><p>“For I say to you, that <strong><mark>unless your righteousness exceeds the righteousness of the scribes and Pharisees</mark></strong>, you <strong><mark>will by no means enter the kingdom of heaven</mark></strong>. [IMMEDIATELY AFTER THIS — A SPEECH ABOUT WORKS] &lt;...&gt; whoever is angry with his brother without a cause &lt;...&gt; whoever looks at a woman to lust for her &lt;...&gt; do not swear at all &lt;...&gt; not to resist an evil person &lt;...&gt; love your enemies, bless those who curse you, do good to those who hate you, and pray for those who spitefully use you and persecute you &lt;...&gt; Therefore you shall be perfect, just as your Father in heaven is perfect” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L20,22,28,34,39,44,48">Matt. 5:20,22,28,34,39,44,48</a>)</p></blockquote><p>And the scribes and Pharisees say, but do not do:</p><blockquote><p>“saying: ‘<strong><mark>The scribes and the Pharisees</mark></strong> sit in Moses’ seat. Therefore whatever they tell you to observe, that observe and do, but do not do according to their works; for they <strong><mark>say, and do not do</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L2-3">Matt. 23:2-3</a>)</p></blockquote><p>*Faith is accounted for righteousness when there are works. A person is justified not only by faith, but also by works (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L21-24">James. 2:21-24</a>).</p><h3>He Who Does Is Righteous</h3><blockquote><p>“Little children, let no one deceive you. <strong><mark>He who practices</mark> righteousness <mark>is righteous</mark></strong>, just as He is righteous. <strong>He who sins is of the devil</strong>, for the devil has sinned from the beginning” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L7-8">1 John. 3:7-8</a>)</p></blockquote><h3>The Righteous One Is Scarcely Saved</h3><p>A righteous person is one who acts according to the righteousness of God (<a href="https://bibleox.com/en/eng-nkjv/iez/33/#L13-16">Ezek. 33:13-16</a>). A sinner is a person acting against the righteousness of God, that is, sinning. Even the righteous is scarcely saved. The sinner, following the logic, is not saved at all:</p><blockquote><p>“Now ‘If <strong><mark>the righteous one is scarcely saved</mark></strong>, where will the ungodly and the sinner appear?’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L18">1 Pet. 4:18</a>)</p></blockquote><h3>One Can Claim to Know God, but Deny Him by Works</h3><blockquote><p>“But why do you call Me ‘Lord, Lord,’ and <strong><mark>not do</mark> the things</strong> which I say?” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L46">Luke. 6:46</a>)</p></blockquote><blockquote><p>“They <strong>profess to know God, but <mark>in works they deny Him</mark></strong>, being abominable, disobedient, and disqualified for every good work” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L16">Titus. 1:16</a>)</p></blockquote><p>Among the works displeasing to God are heresies (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L20">Gal. 5:20</a>) and the creation of divisions among believers (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>).</p><h3>The Work of Turning a Sinner from the Error of His Way Covers Sins</h3><p>If a true believer turns his neighbor from error, by this work he will cover a multitude of sins. If salvation were attained by faith alone, then turning a neighbor from error would help only the neighbor, and would give nothing to the one who turned him and would not cover his sins (why cover them if you are already saved by faith?):</p><blockquote><p>“Brethren, if anyone among you <strong>wanders from the truth</strong>, and someone turns him back, let him know that <strong><mark>he who turns</mark> a sinner from the error of his way <mark>will save a soul from death</mark> and <mark>cover a multitude of sins</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L19-20">James. 5:19-20</a>)</p></blockquote><h3>The Call to Believers to Be Diligent to Enter God’s Rest</h3><p>That is, without diligence believers may not enter:</p><blockquote><p>“Let us therefore <strong><mark>be diligent to enter</mark></strong> that rest, lest anyone fall according to the same example of disobedience” (<a href="https://bibleox.com/en/eng-nkjv/evr/4/#L11">Heb. 4:11</a>)</p></blockquote><h3>Virtues and the Entrance into the Everlasting Kingdom</h3><p>A believer will not remain without success when he has virtues. Being established in them, he is granted a free entrance into the Kingdom. And whoever has no virtue is blind:</p><blockquote><p>“But also for this very reason, giving all diligence, <strong><mark>add to your faith virtue</mark></strong>, to virtue <strong>knowledge</strong>, to knowledge <strong>self-control</strong>, to self-control <strong>perseverance</strong>, to perseverance <strong>godliness</strong>, to godliness <strong>brotherly kindness</strong>, and to brotherly kindness <strong>love</strong>. <strong><mark>For if these things are yours and abound, you will be neither barren nor unfruitful</mark></strong> in the knowledge of our Lord Jesus Christ. <strong>For he who lacks these things is shortsighted, even to blindness, and has forgotten that he was cleansed from his old sins</strong>. Therefore, brethren, <strong><mark>be even more diligent to make</mark></strong> your call and election sure, for if you <strong>do</strong> these things you will never stumble; <strong><mark>for so an entrance will be supplied to you abundantly into the everlasting kingdom</mark></strong> of our Lord and Savior Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L5-11">2 Pet. 1:5-11</a>)</p></blockquote><hr><p>Thus neither faith without works saves, nor works without faith.</p><h2>After Baptism Believers Are Still Able to Sin and Must Fight Against Sin in Themselves</h2><blockquote><p>“For <strong>if we sin willfully after we have received the knowledge of the truth</strong>, there no longer remains a sacrifice for sins” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L26">Heb. 10:26</a>)</p></blockquote><blockquote><p>“<strong>If we say that we have no sin, we deceive ourselves</strong>, and the truth is not in us. If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness” (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L8-9">1 John. 1:8-9</a>)</p></blockquote><blockquote><p>“My little children, <strong><mark>these things I write to you, so that you may not sin</mark></strong>. And if anyone sins, we have an Advocate with the Father, Jesus Christ the righteous” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L1">1 John. 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>Where do wars and fights come from among you?</mark></strong> Do they not come from your desires for pleasure that war in your members?” (<a href="https://bibleox.com/en/eng-nkjv/iak/4/#L1">James. 4:1</a>)</p></blockquote><blockquote><p><em>“Is anyone among you sick? </em><strong><em>Let him call for the elders of the church</em></strong><em>, and let them pray over him, anointing him with oil in the name of the Lord. And </em><strong><em>the prayer of faith will save the sick</em></strong><em>, and the Lord will raise him up. And </em><strong><em>if he has committed <mark>sins, he will be forgiven</mark></em></strong><em>. Confess your trespasses to one another, and </em><strong><em>pray for one another, that you may be healed. The effective, fervent prayer of a righteous man avails much</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-16"><em>James. 5:14-16</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>Awake to righteousness, and <mark>do not sin</mark></em></strong><em>; for </em><strong><em>some do not have the knowledge of God</em></strong><em>. I speak this to your shame” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L34"><em>1 Cor. 15:34</em></a><em>)</em></p></blockquote><blockquote><p>“And be kind to one another, tenderhearted, <strong><mark>forgiving one another</mark></strong>, even as God in Christ forgave you” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L32">Eph. 4:32</a>)</p></blockquote><p>Finally, the Lord Jesus Christ gives His disciples a prayer in which He teaches them to ask for the forgiveness of sins. This is not a one-time prayer to be said once in a lifetime. The disciples asked Christ to teach them to pray, and in answer Christ gave them this pattern:</p><blockquote><p>“So He said to them, ‘<strong><mark>When you pray, say</mark></strong>: Our Father in heaven, hallowed be Your name. Your kingdom come. Your will be done on earth as it is in heaven. Give us day by day our daily bread. And <strong><mark>forgive us our sins</mark></strong>, for we also forgive everyone who is indebted to us. And do not lead us into temptation, but deliver us from the evil one’” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L1-4">Luke. 11:1-4</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/6/#L7-13">Matt. 6:7-13</a>)</p></blockquote><h2>Salvation Is Not an Act, but a Process of the Whole Life</h2><p>The necessity of working out salvation (Greek κατεργάζεσθε — <em>to work out, to do, to produce, to achieve, to accomplish, to subdue, to conquer</em>)</p><blockquote><p>“Therefore, my beloved, as you have always obeyed, not as in my presence only, but now much more in my absence, <strong>work out your own salvation</strong> with fear and trembling” (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L12">Phil. 2:12</a>)</p></blockquote><p>The apostle is in the pains of birth until Christ is formed in the baptized Christians. That is, Christ was not formed in them automatically, in a single moment:</p><blockquote><p>“My little children, for whom <strong>I labor in birth again until Christ is formed in you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L19">Gal. 4:19</a>)</p></blockquote><blockquote><p>“I have fought the good fight, <strong>I have finished the race</strong>, I have kept the faith” (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L7">2 Tim. 4:7</a>)</p></blockquote><p>Salvation is only promised, not received (will be saved, not is saved):</p><blockquote><p>“And you will be hated by all for My name’s sake. But <strong><mark>he who endures to the end</mark></strong> will be saved” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L22">Matt. 10:22</a>) (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L13">Matt. 24:13</a>)</p></blockquote><blockquote><p>“<strong><mark>Be faithful until death, and I will give</mark></strong> you the crown of life” (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L10">Rev. 2:10</a>)</p></blockquote><p>The apostle passes no judgment on himself; although he knows of no deeds against God on his part, he does not justify himself by this, but waits for judgment from God:</p><blockquote><p>“Let a man so <strong>consider us, as</strong> servants of Christ and <strong>stewards</strong> of the mysteries of God. <strong>Moreover <mark>it is required</mark> in stewards <mark>that</mark> one <mark>be found faithful</mark></strong>. But with me it is a very small thing that I should be judged by you or by a human court. <strong><mark>In fact, I do not even judge myself</mark></strong>. For I know of nothing against myself, yet I am not justified by this; <strong><mark>but He who judges me is the Lord</mark></strong>. <strong>Therefore judge nothing before the time</strong>, until the Lord comes, who will both bring to light the hidden things of darkness and reveal the counsels of the hearts. Then each one’s praise will come from God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L1-5">1 Cor. 4:1-5</a>)</p></blockquote><h3>On Attaining Christian Perfection</h3><p>The apostle, like all Christians, runs to obtain an imperishable crown, labors, and is anxious lest he himself be found unworthy:</p><blockquote><p>“And everyone who competes for the prize is temperate in all things. Now they do it <strong>to obtain a</strong> perishable <strong>crown</strong>, but we for an <strong>imperishable</strong> crown. <strong>Therefore I run</strong> thus: not with uncertainty. Thus I fight: not as one who beats the air. But I discipline my body and <strong>bring it into subjection</strong>, <strong>lest</strong>, when I have preached to others, I myself <strong><mark>should become disqualified</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/9/#L25-27">1 Cor. 9:25-27</a>)</p></blockquote><blockquote><p>“<strong>Not that I have already attained</strong>, or am already perfected; <strong>but I press on, that I may lay hold</strong> of that for which Christ Jesus has also laid hold of me. Brethren, <strong>I do not count myself to have apprehended</strong>; but one thing I do, forgetting those things which are behind and reaching forward to those things which are ahead, <strong>I press toward the goal</strong> for the prize of the upward call of God in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/fil/3/#L12-14">Phil. 3:12-14</a>)</p></blockquote><h3>Those Being Saved and Those Perishing</h3><p>Just as those being saved are not yet saved, so those perishing have not yet perished. Both are on the way and both can change their way. One who is being saved can still go to perdition, and one who is perishing — to salvation:</p><blockquote><p>“For we are to God the fragrance of Christ among <strong><mark>those who are being saved</mark></strong> and among <strong><mark>those who are perishing</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/2/#L15">2 Cor. 2:15</a>)</p></blockquote><p>Many will try to attain the Kingdom of Heaven, and will not be able to:</p><blockquote><p>“<strong>Strive to enter through the narrow gate</strong>, for <strong><mark>many</mark></strong>, I say to you, <strong><mark>will seek to enter and will not be able</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/13/#L24">Luke. 13:24</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/7/#L14">Matt. 7:14</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/7/#L13">Matt. 7:13</a>)</p></blockquote><p>Not only many believers, but even those who work miracles in Christ’s name, do not attain the Kingdom of Heaven:</p><blockquote><p>“<strong>Many</strong> will say to Me in that day, ‘Lord, Lord, have we not <strong>prophesied</strong> in Your name, <strong>cast out demons</strong> in Your name, and <strong>done many wonders</strong> in Your name?’ And then I will declare to them, ‘<strong>I never knew you; depart from Me,</strong> you who practice lawlessness!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><h2>Christ Is the Universal Judge</h2><h3>All Are Subject to Judgment</h3><blockquote><p>“For <strong><mark>we must all</mark> appear before the judgment seat of Christ,</strong> that each one may receive the things done in the body, according to what he <strong>has done</strong>, <strong>whether good or bad</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><blockquote><p>“But why do you judge your brother? Or why do you show contempt for your brother? For <strong><mark>we shall all</mark> stand before the judgment seat of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L10">Rom. 14:10</a>)</p></blockquote><blockquote><p>“So speak and so <strong><mark>do as those who will be judged</mark></strong> by the law of liberty” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L12">James. 2:12</a>)</p></blockquote><blockquote><p>“For <strong>God will bring <mark>every work</mark> into judgment</strong>, including every secret thing, <strong>whether good or evil</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ekl/12/#L14">Eccl. 12:14</a>)</p></blockquote><blockquote><p>“When <strong>the Son of Man</strong> comes in His glory, and all the holy angels with Him, then <strong>He will sit on the throne</strong> of His glory. <strong>All <mark>the nations</mark> will be gathered before Him</strong>, and <strong>He will <mark>separate them one from another</mark></strong>, as a shepherd divides <strong>his <mark>sheep from the goats</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32">Matt. 25:31-32</a>)</p></blockquote><h3>Judgment Will Begin with the Church</h3><blockquote><p>“For <strong>the time has come for judgment to begin <mark>at the house of God</mark></strong>; and if <strong><mark>it begins with us first</mark></strong>, what will be the end of those who do not obey the gospel of God? Now ‘If <strong>the righteous one is scarcely saved</strong>, where will the ungodly and the sinner appear?’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18">1 Pet. 4:17-18</a>)</p></blockquote><blockquote><p>“But with me <strong>it is a very small thing that I should be judged by you or by a human court. In fact, <mark>I do not even judge myself</mark></strong>. For I know of nothing against myself, yet <strong>I am not justified by this; but <mark>He who judges me is the Lord</mark></strong>. Therefore <strong>judge nothing before the time</strong>, until the Lord comes, who will both bring to light the hidden things of darkness and reveal the counsels of the hearts. Then each one’s praise will come from God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L3-5">1 Cor. 4:3-5</a>)</p></blockquote><h3>We All Sin Much</h3><blockquote><p>“For <strong>we all stumble in many things</strong>. If anyone does not stumble in word, he is a perfect man, able also to bridle the whole body” (<a href="https://bibleox.com/en/eng-nkjv/iak/3/#L2">James. 3:2</a>)</p></blockquote><blockquote><p>“<strong>If we say that we have no sin, we deceive ourselves</strong>, and the truth is not in us. If we say that we have not sinned, we make Him a liar, and His word is not in us” (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L8,10">1 John. 1:8,10</a>)</p></blockquote><h3>Many Will Be Surprised When They Are Not Saved</h3><p>They thought they were saved:</p><blockquote><p>“<strong>Many</strong> will say to Me in that day, ‘Lord, Lord, have we not <strong>prophesied</strong> in Your name, <strong>cast out demons</strong> in Your name, and <strong>done many wonders</strong> in Your name?’ And then I will declare to them, ‘<strong>I never knew you; depart from Me,</strong> you who practice lawlessness!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><h2>Criticism</h2><h3>“The Believer Shall Not Come into Judgment”</h3><blockquote><p>“Most assuredly, I say to you, he who hears My word and believes in Him who sent Me has everlasting life, and <strong>shall not come into judgment</strong>, but has passed from death into life” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L24">John. 5:24</a>)</p></blockquote><p>Briefly, it should be said that this speaks of the fact that those who truly believe and do (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L47-49">Luke. 6:47-49</a>; <a href="https://bibleox.com/en/eng-nkjv/1in/2/#L17">1 John. 2:17</a>) the words of the Savior are not brought to condemnation for punishment; but who these believers and doers are, Christ Himself will decide at the judgment (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L3-5">1 Cor. 4:3-5</a>), for as already shown above, the universal judgment will begin precisely with the Church (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18">1 Pet. 4:17-18</a>), and all are subject to judgment.</p><p>Let us look more closely.</p><p>The quote should be understood in the context of everything that is said in the Bible. There it is also said that keeping the commandments is necessary for salvation (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L47-49">Luke. 6:47-49</a>; <a href="https://bibleox.com/en/eng-nkjv/1in/2/#L17">1 John. 2:17</a>), and that Baptism is necessary (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L5">John. 3:5</a>), and the Eucharist (<a href="https://bibleox.com/en/eng-nkjv/in/6/#L53-54">John. 6:53-54</a>), and much else. One may not look at some quotes while closing one’s eyes to others.</p><p>And since one may not exclude the other things necessary for salvation, it means this is about believers who have entered the Church through Baptism, live in the Church (the body of Christ) through participation in the Eucharist, keep the commandments, come to know and live according to the will of God. <strong>If</strong> they act so, they do not come into judgment for condemnation. But who will this be? The Judge, Christ, knows. Therefore, to begin with, all come to judgment, which is said directly in other places.</p><p>All are subject to judgment:</p><blockquote><p>“For <strong>we must all appear before the judgment seat of Christ</strong>, that each one may receive the things done in the body, according to what he <strong>has done</strong>, whether <strong>good</strong> or <strong>bad</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><p>Here the speech is directly <strong>about believers</strong>:</p><blockquote><p>“But why do you judge your <strong>brother</strong>? Or why do you show contempt for your <strong>brother</strong>? For <strong>we shall all stand before the judgment seat of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L10">Rom. 14:10</a>)</p></blockquote><blockquote><p>“For <strong>God will bring every work into judgment</strong>, including every secret thing, <strong>whether good or evil</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ekl/12/#L14">Eccl. 12:14</a>)</p></blockquote><p>But it is not enough to say only that all will be judged. Moreover, it is precisely with the Church, that is, with the believers, that the judgment will begin:</p><blockquote><p>“For <strong>the time has come for judgment to begin at the house of God</strong>; and if <strong>it begins with us first</strong>, what will be the end of those who do not obey the gospel of God? Now ‘If the righteous one is scarcely saved, where will the ungodly and the sinner appear?’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18">1 Pet. 4:17-18</a>)</p></blockquote><p>So, the one who believes and does (and who this is, Christ as Judge will decide) does not come into judgment for condemnation.</p><p>These <strong>many believers</strong> obviously thought that they were saved and would not come into judgment, and although they believed, they are condemned as workers of lawlessness:</p><blockquote><p>“<strong>Many</strong> will say to Me in that day, ‘Lord, <strong>Lord, have we not prophesied in Your name</strong>, <strong>cast out demons</strong> in Your name, and <strong>done many wonders</strong> in Your name?’ And then I will declare to them, ‘<strong>I never knew you; depart from Me</strong>, you who practice lawlessness!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><p>So Christ will judge all, separating one from another at the Judgment:</p><blockquote><p>“When <strong>the Son of Man</strong> comes in His glory, and all the holy angels with Him, then <strong>He will sit on the throne</strong> of His glory. <strong>All <mark>the nations</mark> will be gathered before Him</strong>, and <strong>He will <mark>separate them one from another</mark></strong>, as a shepherd divides <strong>his <mark>sheep from the goats</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32">Matt. 25:31-32</a>)</p></blockquote><h3>“A Man Is Not Justified by Works”</h3><blockquote><p>“knowing that <strong>a man is not justified by the works <mark>of the law</mark> but by faith</strong> in Jesus Christ, even we have believed in Christ Jesus, that we might be justified by faith in Christ and <strong>not by the works <mark>of the law</mark>; for by the works <mark>of the law</mark> no flesh shall be justified</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/2/#L16">Gal. 2:16</a>)</p></blockquote><p>This speaks of the works of the Law of Moses, by which one cannot be justified. In the epistle to the Galatians this is the main theme, the occasion for which was a dispute about the necessity of circumcision for the Gentiles. It is not needed, because we are saved not by the works of the Law of Moses, but by faith in Christ and by the works of this faith in Christ (see the <a href="https://bibleox.com/en/en/w/Sv3a_Salvation/#HH-Not-Only-Faith-but-Also-Works-Are-Necessary-for-Salvation">quotes about the necessity of works</a>).</p><h3>“By Grace You Have Been Saved Through Faith”</h3><blockquote><p>“even when we were dead in trespasses, made us alive together with Christ (<strong>by grace you have been saved</strong>) &lt;...&gt; For <strong>by grace you have been saved through faith</strong>, and that not of yourselves; <strong>it is the gift of God,</strong> <strong>not of works</strong>, lest anyone should boast” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L5,8-9">Eph. 2:5,8-9</a>)</p></blockquote><p>Here the speech is not about the personal salvation of each person, but about the coming into the world of the <strong>possibility</strong> of being saved (about the opening of this possibility).</p><h4>1. The Opening of the Possibility of Salvation Is a Gift</h4><p>Before Christ there was no possibility of being saved. After Christ salvation became possible, the means of salvation were created. What did man do for the possibility of salvation to appear? Nothing. The sins of mankind only multiplied. The arrangement of the way of salvation arose as a <strong>gift</strong> of God to people. This gift was not deserved by sinful mankind:</p><blockquote><p>“For <strong>when we were still without strength, in due time Christ died for the ungodly</strong>. For scarcely for a righteous man will one die; yet perhaps for a good man someone would even dare to die. But <strong><mark>God demonstrates His own love toward us, in that while we were still sinners, Christ died for us</mark></strong>. Much more then, having now been justified by His blood, we shall be saved from wrath through Him” (<a href="https://bibleox.com/en/eng-nkjv/rim/5/#L6-9">Rom. 5:6-9</a>)</p></blockquote><h4>2. The Means of Salvation Are a Gift</h4><p>Also, to set out on the saving way and receive the means of salvation, a particular person needs precisely faith. He is brought into the Church, reborn in Baptism, receives the gifts of the Holy Spirit in Chrismation, is united with Christ in the Eucharist — all this is <strong>freely given</strong> by faith. A person is not required to earn this gift beforehand.</p><h4>3. The Way to Salvation Is Traveled with God’s Help (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L10">1 Cor. 15:10</a>) by Human Works (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L5-8">Rom. 2:5-8</a>) Throughout One’s Life (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L10">Rev. 2:10</a>)</h4><p>Further, the purpose of being born in Christ is spoken of — it is good works:</p><blockquote><p>“For we are His workmanship, <strong>created in Christ Jesus for <mark>good works</mark></strong>, which God prepared beforehand that we should walk in them” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L10">Eph. 2:10</a>)</p></blockquote><p>Without these good works, as is said in other places of Scripture, it is impossible to be saved, because faith without works is dead (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L20">James. 2:20</a>), a person is justified by works and not by faith only (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L24">James. 2:24</a>), all will be judged (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>), and the judgment itself will be according to works (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>; <a href="https://bibleox.com/en/eng-nkjv/ef/6/#L7-8">Eph. 6:7-8</a>).</p><p>Thus, the salvation once opened to mankind must be appropriated not only by faith, but also by works, and this, as already shown above, is a process, and a hard one, whose goal is not reached by many:</p><blockquote><p>“<strong>Strive to enter through the narrow gate</strong>, for <strong><mark>many</mark></strong>, I say to you, <strong><mark>will seek to enter and will not be able</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/13/#L24">Luke. 13:24</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/7/#L14">Matt. 7:14</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/7/#L13">Matt. 7:13</a>)</p></blockquote><h3>Did the Wise Thief Only Manage to Believe, but Did No Works?</h3><p>The thief is saved as part of Old Testament Israel, being in the Old Covenant with God, by faith in the Savior, having managed to do something as well.</p><p>Why in the Old Covenant? Because it is written that Christ would baptize with the Holy Spirit (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L16">Luke. 3:16</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/3/#L11">Matt. 3:11</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/1/#L8">Mark. 1:8</a>), and Christ promised to send Him after the ascension (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L7">John. 16:7</a>; <a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>; <a href="https://bibleox.com/en/eng-nkjv/in/14/#L26">John. 14:26</a>; <a href="https://bibleox.com/en/eng-nkjv/in/7/#L38-39">John. 7:38-39</a>), that is, at Pentecost. Nothing is written about the preaching of repentance and baptism to the thief, nothing is written about the descent of the Holy Spirit upon the thief (unlike how it was with other ancient Christians later). Thus the wise thief was saved still within the Old Covenant, before the formation of the Church, without the sacraments of Baptism and the Eucharist.</p><p>However, the thief also did a work — he humbly accepted the punishment sent to him as what he truly deserved, and brought forth a fruit worthy of repentance (<a href="https://bibleox.com/en/eng-nkjv/mf/3/#L8">Matt. 3:8</a>).</p><blockquote><p>“<strong>And we indeed justly, for we receive the due reward of our deeds</strong>; but this Man has done nothing wrong” (<a href="https://bibleox.com/en/eng-nkjv/lk/23/#L41">Luke. 23:41</a>)</p></blockquote><p>Humble endurance of suffering, without murmuring against God, without looking for someone else to blame and without condemning them, is the act of a Christian (<a href="https://bibleox.com/en/eng-nkjv/pr/3/#L11">Prov. 3:11</a>). Our forefathers, having fallen, began to accuse not themselves, but others, and partly even God:</p><blockquote><p>“Then the man said, ‘<strong>The woman whom You gave to be with me, she gave me of the tree, and I ate</strong>.’ And the LORD God said to the woman, ‘What is this you have done?’ The woman said, ‘<strong>The serpent deceived me, and I ate</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L12-13">Gen. 3:12-13</a>)</p></blockquote><p>But the thief accused himself and bore the punishment. This is a work, and one very worthy of the Christian spirit.</p><p>Being a thief, he is not glorified as one of the great, does not receive the place prepared at the right or left hand of the Savior (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L40">Mark. 10:40</a>), but he is saved by faith and at least by this small work which he managed to do. So the thief does have works after all, and not only faith.</p><p>It is also worth noticing that it is not the thief himself who declares himself saved, but Christ who passes judgment on him. In the thief’s words no certainty of salvation is seen; on the contrary, he realizes that he will not attain eternal life with God, and therefore, having only a cautious hope of mercy, asks Christ to remember him when Christ comes into His Kingdom (where, as the thief himself supposes, he will not be at that time).</p><h3>“Whoever Calls on the Name of the Lord Shall Be Saved”</h3><blockquote><p>“For ‘whoever calls on the name of the LORD shall be saved’” (<a href="https://bibleox.com/en/eng-nkjv/rim/10/#L13">Rom. 10:13</a>)</p></blockquote><blockquote><p>“And it shall come to pass that whoever calls on the name of the LORD shall be saved” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L21">Act. 2:21</a>)</p></blockquote><p>A difficulty may arise with the thought: is it really enough for salvation merely to call on the Lord, and everyone, however he calls and whatever he does, will be saved anyway? In fact, the word “whoever” here means that not only a Jew, but a person of any nation will be able to be saved.</p><p>The apostle only quotes these words. Originally they were spoken to the Jews in the Old Testament as a prophecy about the future. And now the apostle recalls what was said, pointing out that the time for the fulfillment of these words has come. In the Old Testament these words were spoken by the prophet Joel:</p><blockquote><p>“And it shall come to pass that <strong>whoever calls on the name of the LORD shall be saved</strong>. For in Mount Zion and in Jerusalem there shall be deliverance, as the LORD has said, among the remnant whom the LORD calls” (<a href="https://bibleox.com/en/eng-nkjv/iol/2/#L32">Joel. 2:32</a>)</p></blockquote><p>The prophet’s speech is addressed to the people of Israel, who were convinced that God saves only Israelites. And so a prophecy is given to the people of Israel that a time will come when not only the Israelite will be saved, but every one (every nation) who will call on God.</p><p>So these words are from the Old Covenant, which God made only with the people of Israel, while the New Covenant is with the Church, into which He called all nations, because in the Church nationality no longer matters (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L11">Col. 3:11</a>). This is what it is about, as is seen directly from the context: nationality does not matter for salvation:</p><blockquote><p>“For the Scripture says, ‘<strong>Whoever believes</strong> on Him will not be put to shame.’ <strong><mark>For there is no distinction between Jew and Greek</mark></strong>, for the same Lord over all is rich to all who call upon Him. For ‘<strong><mark>whoever calls on the name of the LORD shall be saved</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/rim/10/#L11-13">Rom. 10:11-13</a>)</p></blockquote><p>The rest of Holy Scripture does not lose its necessity.</p><p>How can one be saved? Keep the commandments, says the Lord:</p><blockquote><p>“But if you want to enter into life, <strong>keep the commandments</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L17">Matt. 19:17</a>)</p></blockquote><p>Is this cancelled by the words about calling on God? Of course not.</p><p>It is said that one who is not born of water and the Spirit will not see the Kingdom of Heaven and will not enter it. This is not cancelled either.</p><blockquote><p>“Jesus answered and said to him, ‘Most assuredly, I say to you, unless one is born again, <strong>he cannot see the kingdom of God</strong>.’ &lt;...&gt; Jesus answered, ‘Most assuredly, I say to you, unless one is born of water and the Spirit, <strong>he cannot enter the kingdom of God</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5">John. 3:3,5</a>)</p></blockquote><p>The words about the Eucharist are not cancelled. Without it a person cannot have life in himself and be raised (for life with God) on the last day.</p><blockquote><p>“Then Jesus said to them, ‘Most assuredly, I say to you, <strong>unless you eat the flesh of the Son of Man and drink His blood,</strong> <strong>you have no life in you</strong>. Whoever eats My flesh and drinks My blood has eternal life, and <strong>I will raise him up at the last day</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/6/#L53-54">John. 6:53-54</a>)</p></blockquote><p>The Nicolaitans and many heretics call on God; however, as heretics and schismatics they are condemned to be deprived of the Kingdom:</p><blockquote><p><em>“Now the works of the flesh are evident, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, contentions, jealousies, outbursts of wrath, selfish ambitions, </em><strong><em>dissensions</em></strong><em>*, </em><strong><em>heresies</em></strong><em>, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that those who practice such things will not inherit the kingdom of God” (</em><a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21"><em>Gal. 5:19-21</em></a><em>)</em></p><p><strong><em>*dissensions (διχοστασίαι) — division, splitting apart.</em></strong></p></blockquote><p>So “whoever” means of any nationality, and not only a Jew. This is how the apostle speaks of the Church:</p><blockquote><p>“But now you yourselves are to put off all these: &lt;...&gt; and have put on the new man who is renewed in knowledge according to the image of Him who created him, where <strong><mark>there is neither Greek nor Jew</mark>, circumcised nor uncircumcised, <mark>barbarian, Scythian</mark>, slave nor free</strong>, but Christ is all and in all” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L8,10-11">Col. 3:8,10-11</a>)</p></blockquote><h3>“Substitutionary Sacrifice”</h3><p>Some supporters of the teaching of salvation by faith alone (without works) speak of a theory of salvation such as “substitutionary sacrifice”, by which the following is meant. Just as instead of Isaac a lamb was offered in sacrifice so that Isaac might live, so instead of sinful man Christ was offered in sacrifice so that the sinner might live. Thus, since God the Father pours out His wrath on the Son, He is no longer angry with believing sinners. And now believing sinners have no obstacles to life with God.</p><p>The idea of the substitutionary sacrifice does not seem to have anything to do with the truth. It proceeds from the false premise that the problem is in God (He is angry with sinners). And in order to correct God (what a bold thought in itself) the Son must die. And man need not correct himself at all, since God will be angry with the Son, and thus the problem (as if located in God) is removed. Such a theory cannot be accepted as the truth, because it is contrary to common sense. It is clear that the problem is not in God. Nothing unclean can enter eternal life with God:</p><blockquote><p>“The city had no need of the sun or of the moon to shine in it &lt;...&gt; But <strong>there shall by no means enter it anything that defiles, or causes an abomination or a lie</strong>, but only those who are written in the Lamb’s Book of Life” (<a href="https://bibleox.com/en/eng-nkjv/otkr/21/#L23,27">Rev. 21:23,27</a>)</p></blockquote>

  - src: спасутся-не-все
    path: Nt2b_Not_All_Will_Be_Saved
    title: Not All Will Be Saved
    title_sub: Bible quotes showing that not all will be saved
    meta_desc: '“those who have been sown in the world will not all be saved” (2 Esd. 8:41)'
    menu: { parent: Church/Salvation, title: Not All Will Be Saved, priority: 9 }
    body: |-
      <h2>Many Will Not Be Saved</h2><blockquote><p>“Strive to enter through the narrow gate, for <strong><mark>many</mark></strong>, I say to you, will seek to enter and <strong>will not be able</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/13/#L24">Luke. 13:24</a>)</p></blockquote><blockquote><p>“Enter by the narrow gate; for <strong>wide is the gate</strong> and broad is the way <strong>that leads to destruction, and there are</strong> <strong><mark>many</mark> who go in by it</strong>. Because <strong>narrow is the gate</strong> and difficult is the way <strong>which leads to life, and there are</strong> <strong>few who find it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L13-14">Matt. 7:13-14</a>)</p></blockquote><h2>Not Every Believer Will Be Saved</h2><blockquote><p>“<strong><mark>Not everyone who says</mark> to Me, ‘Lord, Lord,’ shall enter the kingdom of heaven</strong>, but he who does the will of My Father in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L21">Matt. 7:21</a>)</p></blockquote><blockquote><p>“Many will say to Me in that day, ‘Lord, Lord, have we not <strong>prophesied</strong> in Your name, <strong>cast out demons</strong> in Your name, and <strong>done many wonders</strong> in Your name?’ And then I will declare to them, ‘<strong><mark>I never knew you; depart from Me, you who practice lawlessness!</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><blockquote><p>“For just as the farmer sows many seeds in the ground and plants a multitude of seedlings, and yet not all that have been sown will come up in due season, and not all that were planted will take root; so also those who have been sown in the world <strong>will not all be saved</strong>” (<a href="https://bibleox.com/en/en-nrsv/3ezd/8/#L41">2 Esd. 8:41</a>)</p></blockquote>

  - src: спасающихся-мало
    path: Fw8c_Few_Are_Being_Saved
    title: Few Are Being Saved
    meta_desc: Not only are there few believers, but even among believers few are being saved
    menu: { parent: Church/Salvation, title: Few Are Being Saved, priority: 10 }
    body: |-
      <h2>Few Are Being Saved</h2><blockquote><p>“Then one said to Him, ‘Lord, <strong>are there few who are saved?</strong>’ And He said to them, ‘Strive to enter through the narrow gate, for <strong>many, I say to you, will seek to enter and will not be able</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/13/#L23-24">Luke. 13:23-24</a>)</p></blockquote><blockquote><p>“Enter by the narrow gate; for <strong>wide is the gate</strong> and broad is the way <strong>that leads to destruction, and there are</strong> <strong>many who go in by it</strong>. Because <strong>narrow is the gate</strong> and difficult is the way <strong>which leads to life, and there are</strong> <strong>few who find it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L13-14">Matt. 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>Many</strong> will say to Me in that day, ‘Lord, Lord, have we not prophesied in Your name, cast out demons in Your name, and done many wonders in Your name?’ And then I will declare to them, ‘<strong>I never knew you; depart from Me, you who practice lawlessness!</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><blockquote><p>“Do not fear, <strong>little flock</strong>, for it is your Father’s good pleasure to give you the kingdom” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L32">Luke. 12:32</a>)</p></blockquote><blockquote><p>“Is it not lawful for me to do what I wish with my own things? Or is your eye evil because I am good? So the last will be first, and the first last. For many are called, but <strong>few chosen</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/20/#L15-16">Matt. 20:15-16</a>)</p></blockquote><blockquote><p>“Then the king said to the servants, ‘Bind him hand and foot, take him away, and cast him into outer darkness; there will be weeping and gnashing of teeth.’ For many are called, but <strong>few are chosen</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/22/#L13-14">Matt. 22:13-14</a>)</p></blockquote><h2>An Old Testament Example of the Small Number of Those Being Saved</h2><blockquote><p>“For if God did not spare the angels who sinned, but cast them down to hell and delivered them into chains of darkness, to be reserved for judgment; and <strong>did not spare the ancient world, but <mark>saved Noah, one of eight people</mark></strong>, a preacher of righteousness, bringing in the flood on the world of the ungodly; and <strong>turning the cities of Sodom and Gomorrah into ashes, condemned them to destruction</strong>, making them an example to those who afterward would live ungodly; <strong>and delivered righteous Lot</strong>, who was oppressed by the filthy conduct of the wicked (for that righteous man, dwelling among them, tormented his righteous soul from day to day by seeing and hearing their lawless deeds) — then the Lord knows how to deliver the godly out of temptations and to reserve the unjust under punishment for the day of judgment” (<a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L4-9">2 Pet. 2:4-9</a>)</p></blockquote><blockquote><p>“<strong>Now all these things happened to them as examples, and they were written for our admonition</strong>, upon whom the ends of the ages have come” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L11">1 Cor. 10:11</a>)</p></blockquote>
