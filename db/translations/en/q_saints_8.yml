    <h2>2nd century</h2>
    <h3>Tertullian (c. 155–220)</h3>
    <blockquote><p>We take also, in congregations before daybreak, and from the hand of none but the presidents, the sacrament of the Eucharist, which the Lord both commanded to be eaten at meal-times, and enjoined to be taken by all alike. As often as the anniversary comes round, <strong><mark>we make offerings for the dead as birthday honours</mark></strong>. We count fasting or kneeling in worship on the Lord’s day to be unlawful. We rejoice in the same privilege also from Easter to Whitsunday.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/tertullian-the-chaplet-or-de-corona#HH-3">The Chaplet, or De Corona, 3</a>)</p>
    <h2>3rd century</h2>
    <h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3>
    <p>This order was established before St Cyprian. He received it from his predecessors:</p>
    <blockquote><p>Which plan and rule is now maintained in respect of the clergy, that they who are promoted by clerical ordination in the Church of the Lord may be called off in no respect from the divine administration, nor be tied down by worldly anxieties and matters; but in the honour of the brethren who contribute, receiving as it were tenths of the fruits, they may not withdraw from the altars and sacrifices, but may serve day and night in heavenly and spiritual things. <strong><mark>The bishops our predecessors</mark></strong> religiously considering this, and wholesomely providing for it, <strong><mark>decided that no brother departing should name a cleric for executor</mark></strong> or guardian; <strong><mark>and if any one should do this, no offering should be made for him, nor any sacrifice be celebrated </mark><u><mark>for his repose</mark></u></strong>. For he <strong>does not deserve to be named <mark>at the altar of God in the prayer of the priests</mark>, who has wished to call away the priests and ministers from the altar.</strong> And therefore, since <strong><mark>Victor</mark></strong>, contrary to the rule lately made in council by the priests, has dared to appoint Geminius Faustinus, a presbyter, his executor, <strong><mark>it is not allowed that any </mark><u><mark>offering</mark></u><mark> be made by you </mark><u><mark>for his repose</mark></u><mark>, nor any </mark><u><mark>prayer be made in the church in his name</mark></u></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-the-Clergy-and-People-Abiding-at-Furni-About-Victor-Who-Had-Made-the-Presbyter-Faustinus-a-Guardian">Epistle LXV, to the clergy and people abiding at Furni, 1–2</a>)</p>
    <h2>4th century</h2>
    <h3>Serapion of Thmuis, bishop (early 4th c. – after 362)</h3>
    <blockquote><p>O God, who hast power over life and death, God of spirits and Lord of all flesh, God who sendest death and givest life, who descendest to the gates of hell and ascendest, who createst the spirit of man within him and receivest the souls of the saints, and givest them rest, who turnest about, changest and variest Thy creations as is just and profitable, being Thyself alone immortal, immutable and eternal: <strong><mark>we pray Thee for the falling asleep and the repose of Thy servant</mark></strong> N., or of Thy handmaid N., <strong><mark>rest his soul and spirit in places of verdure, in the treasuries of repose together with Abraham, Isaac and Jacob and all Thy saints</mark>, and raise up his body in that day in which, according to Thy unlying promise, Thou didst promise that, having given him the due portion according to his worth in Thy holy pastures, <mark>Thou wouldest not remember his transgressions and sins, and wouldest make his present departure peaceful and blessed</mark></strong>, heal the sorrows of those who grieve in spirit with consolation, and grant us all a good end through Thy Only-begotten Jesus Christ, through whom to Thee be glory and dominion in the Holy Spirit unto ages of ages. Amen.</p></blockquote>
    <p>(Euchologion, or the collection of prayers: the prayer for the departed before the removal of the body)</p>
    <blockquote><p><strong><mark>We pray also for all the departed whom we commemorate by name</mark></strong>, sanctify these souls, for Thou knowest all things, <strong><mark>sanctify the souls that have fallen asleep in the Lord and number them with all Thy holy powers, and give them a place and a dwelling in Thy kingdom</mark></strong>; receive also the thanksgiving of the people and bless those who have brought the offerings and thanksgivings, and grant health, soundness, joy and all prosperity of soul and body to all this people through Thine Only-begotten Jesus Christ in the Holy Spirit, to whom be glory and dominion, who was and is and is to come, unto generations of generations and unto all ages. Amen.</p></blockquote>
    <p>(Euchologion, or the collection of prayers: the prayer of oblation)</p>
    <h3>St Ephrem the Syrian, monk (c. 306–373)</h3>
    <blockquote><p>The day will come, brethren, it will surely come, and the day will not pass us by, in which man will leave everything and everyone, and will go alone, abandoned by all, humiliated, put to shame, stripped, helpless, having neither advocate nor companion, unprepared, without an answer, if that day finds him in negligence — “in the day when he looketh not for him, and in an hour that he is not aware of” (Matt. 24:50), while he is merry, heaping up treasures, living in luxury, giving himself over to negligence. For suddenly one hour will come — and all is at an end; a slight fever — and everything will turn to vanity and emptiness; one deep, dark and painful night — and man will go, like a defendant, where those who take him will lead him. <strong><mark>Many then, O man, will you need</mark> guides, many helpers, <mark>many prayers</mark>, many fellow-workers in that hour of the parting of the soul from the body</strong>. Great then is the fear, great the trembling, great the mystery, great the upheaval for the body in its passage to the world beyond. For if even on earth, passing from one country to another, we need certain guides and leaders, how much more will they be needed when we pass into the boundless age, from which no one has ever returned? Again I repeat: <strong><mark>many helpers will you need in that hour</mark></strong>. This hour is ours, and not some other; ours is the path, ours the hour, and the hour is terrible; ours is this bridge, and there is no passing over it; this is the end common to all, common, and terrible for all; a hard path, but all must walk it; a narrow and strait way, but we shall all enter it; this is a bitter and fearful cup, but we shall all drink it, and not another; great and hidden is the mystery of death, and no one can explain it. Terrible and dreadful is what the soul then experiences, but none of us knows it, except those who have gone before us there, except those who have learned it by experience.</p>
    <p>&lt;…&gt;</p>
    <p><strong><mark>Pray that his soul may depart in peace</mark></strong>, ask that a place of rest be given him; fall down in supplication that he may have merciful Angels; <strong><mark>fall down in supplication</mark></strong> that he may find the Judge indulgent;<strong> <mark>offer up fragrant incense</mark></strong>, because he sees the Angelic vision; pray, because he is now in great struggle. Watch over this yourselves, and <strong><mark>pray</mark></strong>. Look attentively and do not forget this mystery; strain your eyes, and take thought yourselves for that hour.”</p></blockquote>
    <p>(Homily on the brethren who have fallen asleep in Christ)</p>
    <h3>St Cyril of Jerusalem, bishop (315–386)</h3>
    <blockquote><p>9. Then <strong><mark>we commemorate also those who have fallen asleep before us</mark></strong>, first Patriarchs, Prophets, Apostles, Martyrs, that at their prayers and intercessions God would receive our petition. Then on behalf also of the Holy Fathers and Bishops who have fallen asleep before us, and in a word of all <strong><mark>who in past years have fallen asleep among us, believing that it will be a very great benefit to the souls, for whom the supplication is put up</mark></strong>, while that holy and most awful sacrifice is set forth.</p>
    <p>10. And I wish to persuade you by an illustration. For I know that many say, <strong>what is a soul profited</strong>, which departs from this world either with sins, or without sins, <strong>if it be commemorated in the prayer?</strong> For if a king were to banish certain who had given him offence, and then those who belong to them should weave a crown and offer it to him on behalf of those under punishment, <strong>would he not grant a remission of their penalties?</strong> In the same way <strong><mark>we, when we offer to Him our supplications for those who have fallen asleep, though they be sinners</mark></strong>, weave no crown, but offer up Christ sacrificed for our sins, <strong><mark>propitiating our merciful God for them as well as for ourselves</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-3#HH-On-the-Mysteries-V--On-the-Sacred-Liturgy-and-Communion">Mystagogical Catechesis 5, 9–10</a>)</p>
    <h3>St Epiphanius of Cyprus, bishop (c. 315–403)</h3>
    <blockquote><p>Then, <strong>as for the <mark>commemoration of the names of the departed</mark>, what could be more profitable than this, what more timely and more wonderful than the faith of living people, that the departed are alive and have not turned into non-existent beings, but exist and live with the Master, that</strong> <strong>in this way the pious <mark>teaching is handed down that there is hope for those who pray for their brethren</mark>, as for those who have set out on a journey</strong>. <strong><mark>The prayer offered for them is profitable, though it does not abolish all guilt, and it is profitable</mark></strong> because, living in the world, we often stumble involuntarily and voluntarily, and because it serves to show forth what is more perfect. <strong>We commemorate both the righteous and the sinners, the sinners because we ask mercy for them from God</strong>, and the righteous — fathers, prophets, apostles, evangelists, martyrs, confessors, bishops and ascetics and all their order — in order that, honouring the Lord Jesus Christ, we may separate Him from the order of men and render Him honour, bearing in mind that the Lord is incomparable with any of men, even if each of men possessed countless works of righteousness.</p></blockquote>
    <p>(Panarion, or the Ark, Book 3, Against Aerius, ch. 7)</p>
    <h3>St Basil the Great, archbishop of Caesarea (c. 329–379)</h3>
    <blockquote><p>Thou, O Lord of glory that fadeth not away, and beloved Son of the most high Father, eternal Light from eternal Light, Sun of righteousness, <strong><mark>hear us who pray to Thee, and give rest to the souls of Thy servants, the fathers and brethren who have fallen asleep before us, and other kinsmen according to the flesh, and all Thine own according to the faith, of whom we now make remembrance</mark></strong>, for Thou hast power over all things and holdest in Thy hand all the ends of the earth.</p>
    <p><strong><mark>O Sovereign Lord, God of our fathers</mark></strong> and Lord of mercy, Creator of the mortal race as also of the immortal, and of every human nature, which is composed and again dissolved; Creator of life as also of death, of abiding here and of departure thither, <strong><mark>who measurest the years of the living and appointest the time of death, who bringest down to hell and bringest up from thence</mark></strong>, who bindest in weakness and loosest with power, who orderest the present according to the needs of all and directest the future to their profit; who quickenest those smitten by the sting of death with hopes of resurrection! Do Thou, the very Master of all, O God our Saviour, the hope of all the ends of the earth &lt;…&gt;, in this final and saving feast also <strong><mark>who hast been pleased to receive the propitiatory supplications for those held in hell and who givest us great hopes of sending down to the departed relief from the sorrows that oppress them and consolation from Thee</mark></strong>! Hear us, the humble who need Thy compassion, and <strong><mark>give rest to the souls of Thy servants who have fallen asleep before us in a place of light, in a place of blessedness, in a place of refreshment, from whence all pain, sorrow and groaning have departed, and settle their spirits in the dwellings of the righteous, and vouchsafe them peace and relief</mark></strong>, because the dead will not praise Thee, O Lord, nor those who are in hell dare to bring Thee confession, but we, the living, bless Thee and pray and bring propitiatory prayers and sacrifices to Thee for their souls.</p></blockquote>
    <p>(Kneeling Prayers on the day of Pentecost, the third prayer)</p>
    <h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3>
    <blockquote><p>Mourn for those who <strong>have died in wealth, and did not from their wealth think of any solace for their soul, who had power to wash away their sins and would not</strong>. Let us all weep for these in private and in public, but with propriety, with gravity, not so as to make exhibitions of ourselves; let us weep for these, not one day, or two, but <strong>all our life. Such tears spring not from senseless passion, but from true affection</strong>; the other sort are of senseless passion. For this cause they are quickly quenched, whereas if they spring from the fear of God, they always abide with us. <strong>Let us weep for these; let us assist them according to our power; let us think of some assistance for them, small though it be, yet still let us assist them</strong>. How and in what way? <strong>By praying and entreating others to make <mark>prayers for them, by continually giving to the poor on their behalf</mark>. This deed hath some consolation</strong>; for hear the words of God Himself, when He says, “I will defend this city for Mine own sake, and for My servant David’s sake.” (2 Kgs. 20:6.) If the remembrance only of a just man had so great power when deeds are done for one, how great power will it not have? <strong>Not in vain did the Apostles order that <mark>remembrance should be made of the dead</mark> in the dreadful Mysteries</strong>. They know that great gain resulteth to them, great benefit; for when the whole people stands with uplifted hands, a priestly assembly, and that awful Sacrifice lies displayed, how shall we not prevail with God by our entreaties for them? And this we do for those who have departed in faith, whilst the catechumens are not thought worthy even of this consolation, but are deprived of all means of help save one. And what is this? We may give to the poor on their behalf. This deed in a certain way refreshes them. For God wills that we should be mutually assisted; else why hath He ordered us to pray for peace and the good estate of the world? why on behalf of all men? since in this number are included robbers, violaters of tombs, thieves, men laden with untold crimes; and yet we pray on behalf of all; perchance they may turn. As then we pray for those living, who differ not from the dead, <strong><mark>so too we may pray for them</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-philippians-1#HH-Philippians-118-20">Homilies on Philippians, Homily 3</a>)</p>
    <blockquote><p>But if <strong><mark>he has departed</mark></strong> a sinner, even for this we should rejoice, since his sins have been cut off and his wickedness has ceased to increase; and besides, <strong><mark>we must help</mark> him as far as possible, not with tears, but with <mark>prayers</mark>, <mark>supplications</mark>, <mark>alms</mark> and <mark>offerings</mark></strong>. In truth, this was not devised without reason, <strong><mark>it is not in vain that we make remembrance of the departed in the Divine Mysteries</mark></strong> and <strong><mark>approach with prayer for them the Lamb that is set before us</mark></strong>, who took away the sin of the world, but so that <strong>some consolation might come to them from this</strong>; and it is not without cause that he who stands at the altar, when the dread Mysteries are celebrated, <strong>cries: “For all who have fallen asleep in Christ, and for those who make remembrance of them”</strong>. And if the remembrance were not made for them, these words would not be spoken. For our service is not a spectacle — God forbid — but it is done by the commandment of the Spirit. <strong><mark>Let us then help them and make remembrance of them</mark></strong>. If the sacrifice of the father cleansed the sons of Job, canst thou doubt that there is some consolation for the departed when we make offerings for them? It is customary with God that thanksgiving be offered by some for others; Paul also pointed to this, saying: “that for the gift bestowed upon us by the means of many persons thanks may be given by many on our behalf” (2 Cor. 1:11). <strong><mark>Let us not cease to help the departed and to offer perfect prayers for them</mark></strong>. For the universal cleansing of the world is set before us. Therefore let us then boldly pray for the world and call them together with the martyrs, confessors and priests, because we are all one body, although some members are more excellent than others, and it is possible in every way <strong><mark>to bring down upon them indulgence — through prayers, through gifts</mark></strong> for them, through those who are invoked together with them. Why then dost thou grieve, why dost thou weep, when it is possible to bring down such indulgence upon the departed?</p>
    <p>&lt;…&gt;</p>
    <p>Shall we not endeavour to snatch him from the dangers? For it is possible, <strong>possible</strong>, if only we desire it, <strong>to soften his punishment</strong>.</p>
    <p><strong><mark>Let us offer constant prayers for him</mark></strong>, <strong><mark>let us give alms</mark></strong> — and even if he were unworthy, God will have mercy through us. If Paul spared and pitied one for the sake of others, how much more ought we to do so. Whether from his money or from thine own, or from whatever source thou wilt, help, pour out oil — or rather, water.</p>
    <p>&lt;…&gt;</p>
    <p>appoint the widows, proclaim his name, bid all <strong><mark>to offer prayers and supplications for him; this will propitiate God</mark></strong>. Although it was not done by himself, yet another has become the cause of alms for him, and this too is a work of the divine love for man.</p>
    <p>&lt;…&gt;</p>
    <p>Knowing this, let us consider what consolations we might bring to the departed: instead of tears, instead of wailing, instead of memorial meals — <strong><mark>alms</mark></strong>, <strong><mark>prayers</mark></strong>, <strong><mark>offerings</mark></strong>, <strong><mark>so that both they and we may attain the promised good things</mark></strong>, by the grace and love for man of the Only-begotten Son</p></blockquote>
    <p>(Homily 45: that we should not weep excessively for the departed)</p>
    <h3>Blessed Augustine of Hippo, bishop (354–430)</h3>
    <blockquote><p>Nor can it be denied that <strong><mark>the souls of the dead are benefited by the piety of their living friends, who offer the sacrifice of the Mediator, or give alms in the church on their behalf</mark></strong>. But <strong>these services are of advantage only to those who during their lives have earned such merit, that services of this kind can help them. For there is a manner of life which is neither so good as not to require these services after death, nor so bad that such services are of no avail after death; there is, on the other hand, a kind of life so good as not to require them; and again, one so bad that when life is over they render no help</strong>. Therefore, it is in this life that all the merit or demerit is acquired, which can either relieve or aggravate a man’s sufferings after this life. No one, then, need hope that after he is dead he shall obtain merit with God which he has neglected to secure here. And accordingly it is plain that the services which the church celebrates for the dead are in no way opposed to the apostle’s words: “For we must all appear before the judgment-seat of Christ; that every one may receive the things done in his body, according to that he hath done, whether it be good or bad;” (2 Cor. 5:10; comp. Rom. 14:10) for the merit <strong><mark>which renders such services as I speak of profitable to a man</mark></strong>, is earned while he lives in the body. It is not to every one that these services are profitable. And why are they not profitable to all, except because of the different kinds of lives that men lead in the body? <strong>When, then, <mark>sacrifices either of the altar or of alms are offered on behalf of all the </mark><u><mark>baptized</mark></u><mark> dead</mark>, they are thank-offerings for the very good, they are propitiatory offerings for the not very bad, and in the case of the very bad, even though they do not assist the dead, they are a species of consolation to the living. And <mark>where they are profitable, their benefit consists either in obtaining a full remission of sins, or at least in making the condemnation more tolerable</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/augustine-the-enchiridion#HH-The-Benefit-to-the-Souls-of-the-Dead-from-the-Sacraments-and-Alms-of-Their-Living-Friends">The Enchiridion, 110</a>)</p>
    <h3>Blessed Jerome of Stridon, monk (c. 347–420)</h3>
    <blockquote><p><strong><em>You say, in your pamphlet, that so long as we are alive we can pray for one another, but once we die, the prayer of no person</em> for another <em>can be heard, and all the more because the martyrs, though they (Rev. 6:10) cry for the avenging of their blood, have never been able to obtain their request</em>. <em><mark>If Apostles and martyrs while still in the body can pray for others, when they ought still to be anxious for themselves, how much more must they do so when once they have won their crowns, overcome, and triumphed?</mark> </em></strong><em>A single man, Moses, oft wins pardon from God for six hundred thousand armed </em>men; and<em> (Acts 7:59–60)Stephen, the follower of his Lord and the first Christian martyr, entreats pardon for his persecutors; </em><strong><em><mark>and when once they have entered on their life with Christ, shall they have less power than before?</mark></em></strong><em> The Apostle Paul (Acts 27:37) says that two hundred and seventy-six souls were given to him in the ship; and when, after his dissolution, he has begun to be with Christ, must he shut his mouth, and be unable to say a </em>word for those who throughout the whole world have believed in his Gospel? Shall Vigilantius the live dog be better than Paul the dead lion? I <em>should be right in saying so after (Eccl. 9:4) Ecclesiastes, if I admitted that Paul is dead in spirit. </em><strong><em>The truth is that the saints are not called dead, but are said to be asleep.</em></strong></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/jerome-against-vigilantius">Against Vigilantius, 6</a>)</p>
    <h2>15th century</h2>
    <h3>St Mark Eugenicus, metropolitan of Ephesus (1392–1444)</h3>
    <blockquote><p><strong><mark>The saints</mark></strong> — moved by love for man and compassion for their fellow-countrymen, willing and daring almost the impossible — <strong><mark>pray that those who have fallen asleep in the faith may be delivered</mark></strong>.</p>
    <p>&lt;…&gt;</p>
    <p>Therefore <strong><mark>the Church and we make offerings of prayers and liturgies for all men of this kind</mark></strong>. And that the power of those prayers, and especially of the Mysterious Sacrifice, reaches those who already enjoy blessedness with God, is evident from the fact that in the prayers of the Liturgy which the great John Chrysostom composed we say thus: “Again <strong><mark>we offer unto Thee this reasonable</mark></strong> service, <strong><mark>for those who have fallen asleep in the faith</mark></strong>, the forefathers, fathers, patriarchs, prophets, apostles, martyrs, confessors, ascetics, and for every righteous spirit departed in the faith.” For, <strong>even if we do not ask blessings from God for them (which they already possess), we give thanks for them</strong>, and we do this to their glory, and in this way the Sacrifice is also made for them and reaches them.</p>
    <p>&lt;…&gt;</p>
    <p><strong><mark>this action extends to all, and through prayers and mysterious sacred rites help is shown to almost all who have fallen asleep in the faith</mark></strong></p></blockquote>
    <p>(First discourse on the Purifying Fire)</p>
    <h2>18th century</h2>
    <h3>The Confession of the Orthodox Faith of the Eastern Church (1672, 1723)</h3>
    <blockquote><p>We believe that the souls of those that have fallen asleep are either at rest or in torment, according to what each hath wrought; — for when they are separated from their bodies, they depart immediately either to joy, or to sorrow and lamentation; though confessedly neither their enjoyment, nor condemnation are complete. For after the common resurrection, when the soul shall be united with the body, with which it had behaved itself well or ill, each shall receive the completion of either enjoyment or of condemnation forsooth.</p>
    <p>And such as though involved in mortal sins have not departed in despair, but have, while still living in the body, repented, though without bringing forth any fruits of repentance — by pouring forth tears, forsooth, by kneeling while watching in prayers, by afflicting themselves, by relieving the poor, and in fine by showing forth by their works their love towards God and their neighbour, and which the Catholic Church hath from the beginning rightly called satisfaction — of these and such like the souls departed into Hades, and there endure the punishment due to the sins they have committed.</p>
    <p>But they are aware of their future release from thence, and <strong>are delivered by the Supreme Goodness, through the prayers of the Priests, and the good works which the relatives of each do for their Departed; especially the unbloody Sacrifice availing in the highest degree; which each offereth particularly for his relatives that have fallen asleep, and which the Catholic and Apostolic Church</strong> offereth daily for all alike; it being, of course, understood that we know not the time of their release. For that there is deliverance for such from their direful condition, and that before the common resurrection and judgment we know and believe; but when we know not.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-18">The Eastern Orthodox Confession of Faith, Decree 18</a>)</p>
