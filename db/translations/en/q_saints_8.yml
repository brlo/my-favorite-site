    <h2>3rd century</h2>
    <h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3>
    <p>This order was established before St Cyprian. He received it from his predecessors:</p>
    <blockquote><p>Which plan and rule is now maintained in respect of the clergy, that they who are promoted by clerical ordination in the Church of the Lord may be called off in no respect from the divine administration, nor be tied down by worldly anxieties and matters; but in the honour of the brethren who contribute, receiving as it were tenths of the fruits, they may not withdraw from the altars and sacrifices, but may serve day and night in heavenly and spiritual things. <strong><mark>The bishops our predecessors</mark></strong> religiously considering this, and wholesomely providing for it, <strong><mark>decided that no brother departing should name a cleric for executor</mark></strong> or guardian; <strong><mark>and if any one should do this, no offering should be made for him, nor </mark><u><mark>any sacrifice be celebrated for his repose</mark></u></strong>. For he <strong>does not deserve to be named <u><mark>at the altar of God in the prayer of the priests</mark></u>, who has wished to call away the priests and ministers from the altar.</strong> And therefore, since <strong><mark>Victor</mark></strong>, contrary to the rule lately made in council by the priests, has dared to appoint Geminius Faustinus, a presbyter, his executor, <strong><mark>it is not allowed that any </mark><u><mark>offering</mark></u><mark> be made by you </mark><u><mark>for his repose</mark></u><mark>, nor any </mark><u><mark>prayer be made in the church in his name</mark></u></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-the-Clergy-and-People-Abiding-at-Furni-About-Victor-Who-Had-Made-the-Presbyter-Faustinus-a-Guardian">Epistle LXV, to the clergy and people abiding at Furni, 1–2</a>)</p>
    <h2>4th century</h2>
    <h3>Serapion of Thmuis, bishop (early 4th c. – after 362)</h3>
    <blockquote><p><em>O Lord of hosts, fill also </em><strong><em>this sacrifice</em></strong><em> with Thy power and Thy communion, for </em><strong><em>to Thee we have brought this living sacrifice, the unbloody offering</em></strong><em>; </em><strong><em>to Thee we have brought this bread</em></strong><em> as the likeness of the body of the Only-begotten; this bread is the likeness of the Holy body, because the Lord Jesus Christ in the night in which He was betrayed took bread, broke it and gave it to His disciples, saying: Take, eat, this is My Body, which is broken for you for the remission of sins. Therefore we also, accomplishing the likeness of His death, have brought the bread and ask through </em><strong><em>this sacrifice</em></strong><em> to forgive us all and have mercy, O God of truth. And as this bread was sown upon the mountains and, gathered, became one (whole), so gather Thy holy Church from every nation, from every country, from every city, village and dwelling, and make her one living catholic Church. </em><strong><em>We have also brought the cup </em></strong><em>as the likeness of the blood, because the Lord Jesus Christ, having taken the cup after the supper, said to His disciples: Take, drink, this (cup) is the new covenant, this is My blood, which is shed for you for the remission of sins. Therefore </em><strong><em>we have also brought the cup </em></strong><em>as the likeness of the blood, asking: </em><strong><em>Let Thy holy Word come, O God of truth, upon this bread, that the bread may become the Body of the Word, and upon this cup, that the cup may become the true blood</em></strong><em>, and make all who partake to receive the medicine of life for the healing of every disease, for the increase of every progress and virtue, but not for condemnation, O God of truth, nor for reproof and shame, because we have called upon Thee, the unbegotten, through the Only-begotten in the Holy Spirit, that this people may receive mercy, be counted worthy of progress, and that angels may be sent as companions to the people to withstand the evil one and to strengthen the Church. </em><strong><mark>We pray also for all the departed whom we commemorate by name</mark>, sanctify these souls, for Thou knowest all things, sanctify the souls that have fallen asleep in the Lord and number them with all Thy holy powers, and give them a place and a dwelling in Thy kingdom</strong>; receive also the thanksgiving of the people and bless those who have brought the offerings and thanksgivings, and grant health, soundness, joy and all prosperity of soul and body to all this people through Thine Only-begotten Jesus Christ in the Holy Spirit, to whom be glory and dominion, who was and is and is to come, unto generations of generations and unto all ages. Amen.</p></blockquote>
    <p>(Euchologion, or the collection of prayers: the prayer of oblation)</p>
    <h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3>
    <blockquote><p>But if <strong><mark>he has departed</mark></strong> a sinner, even for this we should rejoice, since his sins have been cut off and his wickedness has ceased to increase; and besides, <strong><mark>we must help</mark> him as far as possible, not with tears, but with prayers, supplications, alms and offerings</strong>. In truth, this was not devised without reason, <strong><mark>it is not in vain that we make remembrance of the departed in the Divine Mysteries</mark></strong> and <strong><mark>approach with prayer for them the Lamb that is set before us</mark></strong>, who took away the sin of the world, but so that <strong>some consolation might come to them from this</strong>; and it is not without cause that he who stands at the altar, when the dread Mysteries are celebrated, <strong>cries: “For all who have fallen asleep in Christ, and for those who make remembrance of them”</strong>. And if the remembrance were not made for them, these words would not be spoken. For our service is not a spectacle — God forbid — but it is done by the commandment of the Spirit. <strong>Let us then help them and make remembrance of them</strong>. If the sacrifice of the father cleansed the sons of Job, canst thou doubt that there is some consolation for the departed when we make offerings for them? It is customary with God that thanksgiving be offered by some for others; Paul also pointed to this, saying: “that for the gift bestowed upon us by the means of many persons thanks may be given by many on our behalf” (2 Cor. 1:11). <strong>Let us not cease to help the departed and to offer perfect prayers for them</strong>. For the universal cleansing of the world is set before us. Therefore let us then boldly pray for the world and call them together with the martyrs, confessors and priests, because we are all one body, although some members are more excellent than others, and it is possible in every way <strong><mark>to bring down upon them indulgence — through prayers, through gifts</mark></strong> for them, through those who are invoked together with them. Why then dost thou grieve, why dost thou weep, when it is possible to bring down such indulgence upon the departed?</p>
    <p>&lt;…&gt;</p>
    <p>Shall we not endeavour to snatch him from the dangers? For it is possible, <strong>possible</strong>, if only we desire it, <strong>to soften his punishment</strong>.</p>
    <p><strong>Let us offer constant prayers for him</strong>, <strong>let us give alms</strong> — and even if he were unworthy, God will have mercy through us. If Paul spared and pitied one for the sake of others, how much more ought we to do so. Whether from his money or from thine own, or from whatever source thou wilt, help, pour out oil — or rather, water.</p>
    <p>&lt;…&gt;</p>
    <p>appoint the widows, proclaim his name, bid all <strong><mark>to offer prayers for him</mark> and <mark>supplications; this will propitiate God</mark></strong>. Although it was not done by himself, yet another has become the cause of alms for him, and this too is a work of the divine love for man.</p>
    <p>&lt;…&gt;</p>
    <p>Knowing this, let us consider what consolations we might bring to the departed: instead of tears, instead of wailing, instead of memorial meals — <strong>alms</strong>, <strong>prayers</strong>, <strong><mark>offerings</mark></strong>, <strong><mark>so that both they and we may attain the promised good things</mark></strong>, by the grace and love for man of the Only-begotten Son</p></blockquote>
    <p>(Homily 45: that we should not weep excessively for the departed)</p>
    <blockquote><p><em>Mourn for those who </em><strong><em>have died in wealth, and did not from their wealth think of any solace for their soul, who had power to wash away their sins and would not</em></strong><em>. Let us all weep for these in private and in public, but with propriety, with gravity, not so as to make exhibitions of ourselves; let us weep for these, not one day, or two, but </em><strong><em>all our life. Such tears spring not from senseless passion, but from true affection</em></strong><em>; the other sort are of senseless passion. For this cause they are quickly quenched, whereas if they spring from the fear of God, they always abide with us. </em><strong><em>Let us weep for these; let us assist them according to our power; let us think of some assistance for them, small though it be, yet still let us assist them</em></strong><em>. How and in what way? </em><strong><em>By praying and entreating others to make prayers for them, by continually giving to the poor on their behalf. This deed hath some consolation</em></strong><em>; for hear the words of God Himself, when He says, “I will defend this city for Mine own sake, and for My servant David’s sake.” (2 Kgs. 20:6.) If the remembrance only of a just man had so great power when deeds are done for one, how great power will it not have? </em><strong><em><mark>Not in vain did the Apostles order that remembrance should be made of the dead in the dreadful Mysteries</mark></em></strong>. <em>They know that great gain resulteth to them, great benefit; for when the whole people stands with uplifted hands, a priestly assembly, and that awful Sacrifice lies displayed, how shall we not prevail with God by our entreaties for them? And this we do for those who have departed in faith, whilst the catechumens are not thought worthy even of this consolation, but are deprived of all means of help save one. And what is this? We may give to the poor on their behalf. This deed in a certain way refreshes them. For God wills that we should be mutually assisted; else why hath He ordered us to pray for peace and the good estate of the world? why on behalf of all men? since in this number are included robbers, violaters of tombs, thieves, men laden with untold crimes; and yet we pray on behalf of all; perchance they may turn. As then we pray for those living, who differ not from the dead, so too </em><strong><em>we may pray for them</em></strong><em>.</em></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-philippians-1#HH-Philippians-118-20">Homilies on Philippians, Homily 3</a>)</p>
    <h3>Blessed Augustine of Hippo, bishop (354–430)</h3>
    <blockquote><p>Nor can it be denied that <strong><mark>the souls of the dead are benefited by the piety of their living friends, who offer the sacrifice of the Mediator, or give alms in the church on their behalf</mark></strong>. But <strong>these services are of advantage only to those who during their lives have earned such merit, that services of this kind can help them. For there is a manner of life which is neither so good as not to require these services after death, nor so bad that such services are of no avail after death; there is, on the other hand, a kind of life so good as not to require them; and again, one so bad that when life is over they render no help</strong>. Therefore, it is in this life that all the merit or demerit is acquired, which can either relieve or aggravate a man’s sufferings after this life. No one, then, need hope that after he is dead he shall obtain merit with God which he has neglected to secure here. And accordingly it is plain that the services which the church celebrates for the dead are in no way opposed to the apostle’s words: “For we must all appear before the judgment-seat of Christ; that every one may receive the things done in his body, according to that he hath done, whether it be good or bad;” (2 Cor. 5:10; comp. Rom. 14:10) for the merit <strong><mark>which renders such services as I speak of profitable to a man</mark></strong>, is earned while he lives in the body. It is not to every one that these services are profitable. And why are they not profitable to all, except because of the different kinds of lives that men lead in the body? <strong>When, then, <mark>sacrifices either of the altar or of alms are offered on behalf of all the </mark><u><mark>baptized</mark></u><mark> dead</mark>, they are thank-offerings for the very good, they are propitiatory offerings for the not very bad, and in the case of the very bad, even though they do not assist the dead, they are a species of consolation to the living. And <mark>where they are profitable, their benefit consists either in obtaining a full remission of sins, or at least in making the condemnation more tolerable</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/augustine-the-enchiridion#HH-The-Benefit-to-the-Souls-of-the-Dead-from-the-Sacraments-and-Alms-of-Their-Living-Friends">The Enchiridion, 110</a>)</p>
    <h2>20th century</h2>
    <h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3>
    <blockquote><p>a) Besides prayers, the offering of the unbloody sacrifice for their salvation has a beneficent effect on the lot of the departed. At the Liturgy, by the immersion into the Blood of Christ of the particles of the prosphora taken out in memory of the departed, their sins are washed away: “Jesus Christ is able also to save them to the uttermost that come unto God by Him, seeing He ever liveth to make intercession for them” (Heb. 7:25; cf. Heb. 9:14). “Not in vain did the apostles establish,” teaches <strong>St John Chrysostom</strong>, “that at the celebration of the dread Mysteries the departed should be commemorated: they knew that from this comes much gain, much profit for them. When the whole people and the sacred choir stand with uplifted hands, and when the dread Sacrifice lies before us, how shall we not entreat God, asking for them? Not in vain do we, at the divine Mysteries, make commemoration of the departed and intercede for them, entreating the Lamb that is set before us, who took away the sins of the world, but so that from this they might have some consolation; not in vain does he who stands before the altar, at the celebration of the dread Mysteries, cry: for all who have fallen asleep in Christ and for those who make remembrance of them. If commemoration were not made for them, these words would not be spoken either. For our actions are not stage performances (God forbid), but they are performed by the dispensation of the Spirit. Let us then help them and make commemoration of them. If the sacrifice of the father cleansed the children of Job (Job 1:5), why dost thou doubt that, when we too offer sacrifice for the departed, they have some consolation? God often grants grace to some for the sake of others (cf. 2 Cor. 1:11). We are all one body, although the members are some more excellent than others. Thus from every side it is possible to obtain forgiveness for them — both from prayers and from the gifts offered for them.” — “We commemorate,” testifies St Cyril of Jerusalem, “also those who have fallen asleep before us, first patriarchs, prophets, apostles, martyrs, that at their prayers and intercession God may receive our supplication. Then also concerning the holy fathers and bishops who have departed, and in general concerning all of us who have fallen asleep before us, believing that there will be very great benefit to the souls for whom the supplication is offered while the holy and dread Sacrifice lies before us. I wish to persuade you also by an example. For I know that many say: what profit is it to the soul, departing from this world with sins or without sins, if it is commemorated in prayer? And what if some king sent into exile those who had offended him, and their relatives afterwards, having woven a crown, brought it to him for those enduring punishment, would he not grant them alleviation of punishment? Thus we too, when we offer prayers to God for the departed, even if they are sinners, do not weave a crown, but bring Christ, slain for our sins, propitiating for them and for us the God who loves mankind.”</p>
    <p>b) Works of beneficence performed in memory of the departed strengthen the efficacy of the prayers for them. “By mercy and truth iniquity is purged” (Prov. 16:6). “He that hath pity upon the poor lendeth unto the Lord” (Prov. 19:17). “Alms delivereth from death, and is able to purge away every sin” (Tob. 12:9). “For alms delivereth from death, and suffereth not to come into darkness” (Tob. 4:10). “Redeem thy sins with righteousness, and thine iniquities with mercy to the poor” (Dan. 4:24). “I say unto you: make to yourselves friends of the mammon of unrighteousness (unreliable, transitory, having no inner value), that, when ye fail (ἐκλίπητε), they may receive you into everlasting habitations” (Luke 16:9), that is, by works of beneficence (cf. Luke 19:8) one can acquire on earth, in the person of the poor and, generally, of those in need of help, friends who after our death will, by their prayerful intercession, open the entrance into the Kingdom of Heaven (cf. Matt. 25:40). “Here (Luke 16:9) it is said,” explains <strong>St John Chrysostom</strong>, “that one must acquire friends in the present life, using riches and spending one’s substance on the needy; here nothing else is commanded but generous almsgiving. If thou departest thither having done nothing of the kind, no one will intercede for thee. It is not the friendship of men that intercedes for us, but the fact that friends have been acquired by riches; therefore the Lord also added: ‘friends of the mammon of unrighteousness,’ so that thou mightest know that these very works of thine will defend thee: mercy, love for man, generosity to the needy. Let us not take thought for monuments; not for sepulchral ornaments. Gather widows — that is the best monument! Tell them the name of the departed; let all make prayers and supplications for him. This will incline God to mercy, even though it is not he himself, but another, who performs alms for him. This is in accordance with the love of God for man. The widows standing around and weeping can save him if not from the present, then from the future death. Many have received benefit from the alms performed for them by others.”</p></blockquote>
    <p>(The Orthodox Church and Sectarians, part 2)</p>
