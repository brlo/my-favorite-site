      <h2>The Definition of Heresy</h2><p><strong>Heresy</strong> (ancient Greek <a href="https://bibleox.com/ru/words/%CE%B1%CE%B9%CF%81%CE%B5%CF%83%CE%B9%CF%82">αἵρεσις</a> — direction, teaching, school, choice) is a later separate teaching that arose on the ideas of a preceding teaching, as a rule in opposition to it. The supporters of a heresy consider wrong the teaching from which they branched off, meeting the same reaction in return.</p><p>In the biblical context any significant distortion of doctrine was considered a heresy:</p><ul><li><p><strong>the Pharisees</strong> — a mistaken teaching about salvation. In many ways they reduced salvation to the exact observance of external prescriptions;</p></li><li><p><strong>the Sadducees</strong> — a mistaken teaching about spiritual reality. They denied spiritual reality: the life of the soul after the death of the body, the existence of spirits and angels, the resurrection of the dead;</p></li><li><p><strong>the teaching of Hymenaeus and Philetus</strong> — a mistaken teaching about the resurrection. They taught that the resurrection had already taken place in the past;</p></li><li><p><strong>the Nicolaitans</strong> — a mistaken teaching about moral life. They allowed bodily debauchery.</p></li></ul><p>All these heresies do not directly concern the teaching about God, but concern some other points of doctrine, and nevertheless they are heresies.</p><h2>Heresy Is a Sin That Deprives One of Salvation</h2><blockquote><p>“Now the works of the flesh are evident, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, contentions, jealousies, outbursts of wrath, selfish ambitions, dissensions, <strong><mark>heresies</mark></strong>, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that <strong>those who practice such things <mark>will not inherit the kingdom of God</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p></blockquote><blockquote><p>“Now I urge you, brethren, <strong>note those who cause divisions and offenses</strong>, <strong>contrary to the doctrine which you learned</strong>, and avoid them. For <strong>those who are such <mark>do not serve our Lord</mark> Jesus Christ</strong>, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18">Rom. 16:17-18</a>)</p></blockquote><p>A wrong teaching does not lead to God:</p><blockquote><p><em>“Whoever </em><strong><em><mark>transgresses</mark> and does not abide in <mark>the doctrine of Christ does not have God</mark></em></strong><em>. He who abides in the doctrine of Christ has both the Father and the Son” (</em><a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9"><em>2 John. 1:9</em></a><em>)</em></p></blockquote><blockquote><p>“For <strong>perverse thoughts separate people from God</strong>, and when his power is tested, it exposes the foolish” (<a href="https://bibleox.com/en/en-nrsv/prs/1/#L3">Wis. 1:3</a>)</p></blockquote><h2>The Opponents of Jesus Christ Perceived His Teaching as One of the Heresies</h2><p>The accusers of the apostles of Christ call the teaching of Christ the heresy of the Nazarenes (Christ grew up in Nazareth, <a href="https://bibleox.com/en/eng-nkjv/in/1/#L45-46">John. 1:45-46</a>):</p><blockquote><p>“For we have found this man a plague, a creator of dissension among all the Jews throughout the world, and a ringleader of <strong>the sect of the Nazarenes</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/24/#L5">Act. 24:5</a>) <em>(Greek: τῆς τῶν Ναζωραίων αἱρέσεως — “of the heresy of the Nazarenes”)</em></p></blockquote><p>The apostles confirm that the Pharisees and Sadducees consider their teaching a heresy:</p><blockquote><p>“But this I confess to you, that <strong>according to the Way which</strong> <strong>they call a sect</strong>, so I worship the God of my fathers, believing all things which are written in the Law and in the Prophets” (<a href="https://bibleox.com/en/eng-nkjv/act/24/#L14">Act. 24:14</a>) <em>(Greek: ἣν λέγουσιν αἵρεσιν — “which they call a heresy”)</em></p></blockquote><p>In the Sanhedrin the teaching of Christ is considered as one of many teachings. The Pharisee Gamaliel gives examples of new teachings:</p><blockquote><p>“Then one in the council stood up, <strong>a Pharisee named Gamaliel, a teacher of the law</strong> held in respect by all the people, and commanded them to put the apostles outside for a little while. And he said to them: ‘Men of Israel, take heed to yourselves what you intend to do regarding these men. For some time ago <strong><mark>Theudas rose up</mark>, claiming to be somebody. A number of men, about four hundred, joined him</strong>. He was slain, and all who obeyed him were scattered and came to nothing. After this man, <strong><mark>Judas</mark> of Galilee <mark>rose up</mark> in the days of the census, and drew away many people after him</strong>. He also perished, and all who obeyed him were dispersed’” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L34-37">Act. 5:34-37</a>)</p></blockquote><p>See also: <a href="https://bibleox.com/en/eng-nkjv/lk/23/#L2">Luke 23:2</a>, <a href="https://bibleox.com/en/eng-nkjv/in/7/#L12">John 7:12</a>.</p><h3>Why Is the Teaching of Christ Not a Heresy?</h3><p>In short, because He is God (<a href="https://bibleox.com/ru/ru/w/%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%91%D0%BE%D0%B3">quotes</a>), the Truth (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L6">John. 14:6</a>), the Lawgiver (“it was said to those of old: &lt;…&gt; but I say to you…” — <a href="https://bibleox.com/en/eng-nkjv/mf/5/#L21-22">Matt. 5:21-22</a>).</p><p>The teaching of Christ is perceived as false and separate only by those who do not consider Jesus to be the Christ and God, who do not believe that He is the very God and Lawgiver who spoke with Abraham, Isaac and Jacob (<a href="https://bibleox.com/en/eng-nkjv/ish/3/#L15">Ex. 3:15</a>; <a href="https://bibleox.com/en/eng-nkjv/in/8/#L25">John. 8:25</a>), who gave Israel the Law (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L19">Gal. 3:19</a>) and who sent the prophets to Israel (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L34">Matt. 23:34</a>). Since Jesus Christ is God, as the Lawgiver He came and changed the order He Himself had given, giving His own vineyard to others (<a href="https://bibleox.com/en/eng-nkjv/lk/20/#L16">Luke. 20:16</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/12/#L9">Mark. 12:9</a>).</p><p>Therefore only those who do not believe in Christ consider the teaching of Christ a heresy, while those who believe in Christ consider His teaching the only true one (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9">2 John. 1:9</a>; <a href="https://bibleox.com/en/eng-nkjv/in/3/#L36">John. 3:36</a>). However, Christ and the apostles warned that after them false teachings would appear, but that what was once delivered to the Church must be preserved:</p><blockquote><p>“to contend earnestly for the faith which was <strong>once for all</strong> delivered to the saints” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude. 1:3</a>)</p></blockquote><h3>Is Every Teaching About Jesus Christ True Just Because It Speaks of Christ?</h3><p>The apostles warn that other people may preach another Jesus, another Gospel and give another spirit:</p><blockquote><p>“<strong>But I fear</strong>, &lt;…&gt; For <strong>if he who comes preaches another Jesus</strong> whom we have not preached, or if you receive <strong>a different spirit</strong> which you have not received, or <strong>a different gospel</strong> which you have not accepted — you may well put up with it!” (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L3-4">2 Cor. 11:3-4</a>)</p></blockquote><h2>Prophecies About Heresies</h2><h3>Many Heresies Will Arise in Christianity</h3><blockquote><p>“For <strong><mark>many</mark> will come in My name</strong>, saying, ‘I am He,’ and <strong>will deceive <mark>many</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/13/#L6">Mark. 13:6</a>)</p></blockquote><blockquote><p><em>“Then </em><strong><em><mark>many</mark> false prophets will rise up and deceive <mark>many</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/24/#L11"><em>Matt. 24:11</em></a><em>)</em></p></blockquote><blockquote><p><em>“Beloved, do not believe every spirit, but test the spirits, whether they are of God; because </em><strong><em><mark>many</mark></em></strong><em> </em><strong><em>false prophets</em></strong><em> have gone out into the world” (</em><a href="https://bibleox.com/en/eng-nkjv/1in/4/#L1"><em>1 John. 4:1</em></a><em>)</em></p></blockquote><p>There is also an indication in the <a href="https://bibleox.com/en/en/w/Didache/">Didache</a> (1st-2nd century):</p><blockquote><p>“For <strong>in the last days false prophets and corrupters shall be multiplied</strong>, and the sheep shall be turned into wolves, and love shall be turned into hate” (<a href="https://bibleox.com/en/en/w/Didache/#HH-16">Didache. 16</a>)</p></blockquote><h3>Heresies Will Spread Very Widely</h3><blockquote><p><em>“And </em><strong><em><mark>their message will spread like cancer</mark></em></strong><em>. Hymenaeus and Philetus are of this sort, who </em><strong><em>have strayed concerning the truth</em></strong><em>, saying that the resurrection is already past; and they overthrow the faith of some” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L17-18"><em>2 Tim. 2:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>“But there were also false prophets among the people (of Israel — note), even as there will be false teachers among you (Christians — note), who will </em><strong><em>secretly bring in destructive heresies</em></strong><em>, even denying the Lord who bought them, and bring on themselves swift destruction. And </em><strong><em><mark>many</mark> will follow their destructive ways, because of whom the way of truth will be blasphemed</em></strong><em>. </em><strong><em>By covetousness</em></strong><em> </em><strong><em>they will exploit</em></strong><em> you with deceptive words; for a long time their judgment has not been idle, and their destruction does not slumber” (</em><a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L1-3"><em>2 Pet. 2:1-3</em></a><em>).</em></p></blockquote><h3>Communities of Heretics Will Separate from the Church and Her Unity of Faith</h3><blockquote><p><em>“Little children, it is the last hour; and as you have heard that the Antichrist is coming, even now many antichrists have come, by which we know that it is the last hour. </em><strong><em>They went out from us, but they were not of us; for <mark>if they had been of us, they would have continued with us</mark></em></strong><em>; but they went out that they might be made manifest, that none of them were of us” (</em><a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18-19"><em>1 John. 2:18-19</em></a><em>)</em></p></blockquote><blockquote><p><em>“how they told you that there would be mockers </em><strong><em>in the last time</em></strong><em> who would walk according to their own ungodly lusts. These are</em><strong><em> sensual persons, <mark>who cause divisions</mark></em></strong><em>, not having the Spirit” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L18-19"><em>Jude. 1:18-19</em></a><em>) (Greek: οἱ ἀποδιορίζοντες — “those who separate themselves”)</em></p></blockquote><h3>The Task of False Teachers Is to Steal the Believer from the Church and Lead Him Away After Themselves</h3><blockquote><p><em>“For I know this, that after my departure </em><strong><em>savage wolves will come in among you, not sparing the flock. Also from among yourselves men will rise up, <mark>speaking perverse things</mark>, <mark>to draw away</mark> the disciples <mark>after themselves</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/act/20/#L29-30"><em>Act. 20:29-30</em></a><em>)</em></p></blockquote><h3>The Methods of False Teachers</h3><h4>Pleasant Teachings</h4><p>False teachers will invent pleasant teachings precisely because their hearers will seek teaching pleasant to the ear, not enduring sound teaching:</p><blockquote><p><em>“For the time will come when </em><strong><em>they will not endure sound doctrine</em></strong><em>, but </em><strong><em>according to their own desires</em></strong><em>, because they have itching ears, </em><strong><em>they will heap up for themselves <mark>teachers</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L3"><em>2 Tim. 4:3</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now the Spirit expressly says that </em><strong><em>in latter times some will depart from the faith, <mark>giving heed to deceiving spirits</mark> and doctrines of demons</em></strong><em>, speaking lies in hypocrisy, having their own conscience seared with a hot iron” (</em><a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L1-2"><em>1 Tim. 4:1-2</em></a><em>)</em></p></blockquote><h4>False Piety</h4><blockquote><p><em>“But know this, that </em><strong><em>in the last days</em></strong><em> perilous times will come: For men will be lovers of themselves, lovers of money, boasters, proud, blasphemers, disobedient to parents, unthankful, unholy, &lt;...&gt; </em><strong><em><mark>having a form of godliness</mark></em></strong><em> but denying its power. And from such people turn away! &lt;...&gt; always learning and never able to come to the knowledge of the truth. Now as Jannes and Jambres resisted Moses, so do these also </em><strong><em>resist the truth: men of corrupt minds, disapproved concerning the faith</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L1-2,5,7-8"><em>2 Tim. 3:1-2,5,7-8</em></a><em>)</em></p></blockquote><blockquote><p><em>“Beware of </em><strong><em>false prophets</em></strong><em>, who </em><strong><em>come to you <mark>in sheep’s clothing</mark></em></strong><em>, but inwardly they are ravenous wolves” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/7/#L15"><em>Matt. 7:15</em></a><em>)</em></p></blockquote><h4>Miracles</h4><p>The apostles and the ancient Christians were given abundant powers of working miracles not for show, but for profit:</p><blockquote><p>“But the manifestation of the Spirit is given to each one <strong>for the profit</strong> of all” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L7">1 Cor. 12:7</a>)</p></blockquote><p>A small group of fishermen needed great help to carry the preaching throughout the whole world in their short lifetime. The apostles warned that these gifts would cease:</p><blockquote><p>“Love never fails. But whether there are <strong>prophecies, they will fail; whether there are tongues, they will cease</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>)</p></blockquote><p>Christ Himself condemned the seeking of miracles:</p><blockquote><p>“<strong>An evil and adulterous generation seeks after a sign</strong>, and no sign will be given to it except the sign of the prophet Jonah” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L39">Matt. 12:39</a>)</p></blockquote><p>In the last times false prophets will lead people away precisely with miracles:</p><blockquote><p>“For false christs and false prophets will rise and <strong>show great signs and wonders to deceive</strong>, if possible, even the elect” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L24">Matt. 24:24</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/13/#L22">Mark. 13:22</a>)</p></blockquote><p>As a result, at the Judgment many believers will be convinced that they are saved precisely because they worked miracles in the name of Christ, prophesied and cast out demons. But they turned out to have been deceived, taught lawlessness; Christ does not know them and drives them away from Himself:</p><blockquote><p>“Many will say to Me in that day, ‘Lord, Lord, have we not prophesied in Your name, cast out demons in Your name, and <strong>done many wonders in Your name?</strong>’ And then I will declare to them, ‘<strong>I never knew you;</strong> <strong>depart from Me</strong>, you who practice lawlessness!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><h2>Examples of Heresies in the 1st Century</h2><h3>The Pharisees</h3><p>The apostles called the teaching of the Pharisees a heresy (a separate and wrong teaching):</p><blockquote><p>“But some of <strong>the sect of the Pharisees</strong> who believed rose up, saying, ‘It is necessary to <strong>circumcise</strong> them, and to command them <strong>to keep the law of Moses</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L5">Act. 15:5</a>) <em>(Greek: τῆς αἱρέσεως τῶν Φαρισαίων — “of the heresy of the Pharisees”)</em></p></blockquote><p>The believers from among the Pharisees thought that for salvation the Gentiles had to be circumcised and keep the law of Moses.</p><p>The Evangelist Matthew also points to the danger of the teaching of the Pharisees and Sadducees:</p><blockquote><p>“Then Jesus said to them, ‘Take heed and <strong>beware of the leaven of the Pharisees and the Sadducees</strong>.’ &lt;...&gt; ‘How is it you do not understand that I did not speak to you concerning bread? — but to beware of the leaven of the Pharisees and Sadducees.’ Then they understood that He did not tell them to beware of the leaven of bread, but of <strong>the doctrine of the Pharisees and Sadducees</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L6,11-12">Matt. 16:6,11-12</a>)</p></blockquote><h3>The Sadducees</h3><p>The apostles called the teaching of the Sadducees a heresy (a separate and wrong teaching):</p><blockquote><p>“Then the high priest rose up, and all those who were with him (which is <strong>the sect of the Sadducees</strong>), and they were filled with indignation” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L17">Act. 5:17</a>) <em>(Greek: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων — “the heresy of the Sadducees”)</em></p></blockquote><p>The teaching of the Sadducees denied the resurrection of the dead, the life of the soul after death, and the existence of angels and spirits in general:</p><blockquote><p>“Then <strong>some Sadducees, who say there is no resurrection</strong>, came to Him; and they asked Him, saying: &lt;...&gt; Jesus answered and said to them, ‘<strong>Are you not therefore mistaken</strong>, because you do not know the Scriptures nor the power of God? &lt;...&gt; But <strong>concerning the dead, that they rise, have you not read in the book of Moses</strong>, in the burning bush passage, how God spoke to him, saying, “I am the God of Abraham, the God of Isaac, and the God of Jacob”? He is not the God of the dead, but the God of the living. <strong>You are therefore greatly mistaken</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mk/12/#L18,24,26-27">Mark. 12:18,24,26-27</a>)</p></blockquote><blockquote><p>“For <strong>Sadducees say that there is no resurrection — and no angel or spirit</strong>; but the Pharisees confess both” (<a href="https://bibleox.com/en/eng-nkjv/act/23/#L8">Act. 23:8</a>)</p></blockquote><p>The Pharisees disputed with the Sadducees:</p><blockquote><p>“But when Paul perceived that <strong>one part were Sadducees and the other Pharisees</strong>, he cried out in the council, ‘Men and brethren, I am a Pharisee, the son of a Pharisee; concerning the hope and resurrection of the dead I am being judged!’ And when he had said this, <strong>a dissension arose between the Pharisees and the Sadducees; and the assembly was divided</strong>. For Sadducees say that there is no resurrection — and no angel or spirit; but the Pharisees confess both” (<a href="https://bibleox.com/en/eng-nkjv/act/23/#L6-8">Act. 23:6-8</a>)</p></blockquote><h3>The Teaching of Hymenaeus and Philetus</h3><p>The teaching of Hymenaeus and Philetus, who strayed from the truth. Since they strayed, it means they had been Christians before. Now they teach wrongly about the resurrection, which is obviously a heresy that will spread and from which one must depart:</p><blockquote><p>“But shun profane and idle babblings, for they will increase to more ungodliness. And <strong>their message will spread like cancer. Hymenaeus and Philetus are of this sort, who have strayed concerning the truth, saying that the resurrection is already past</strong>; and they overthrow the faith of some. Nevertheless the solid foundation of God stands, having this seal: ‘The Lord knows those who are His,’ and, ‘<strong>Let everyone who names the name of Christ depart from iniquity</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L16-19">2 Tim. 2:16-19</a>)</p></blockquote><h3>The Nicolaitans</h3><p>The Lord Jesus Christ hates the teaching of the Nicolaitans, that is, obviously, their teaching is a heresy:</p><blockquote><p>“Thus you also have those who hold <strong>the doctrine of the Nicolaitans, which thing I hate</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L15">Rev. 2:15</a>)</p></blockquote><blockquote><p>“But this you have, <strong>that you hate the deeds of the Nicolaitans, which I also hate</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L6">Rev. 2:6</a>)</p></blockquote><h2>Examples of Heresies in the 2nd Century</h2><p>The holy martyr Justin the Philosopher (~100-165) writes that there are people who, although they call themselves Christians and acknowledge Jesus Christ as Lord, preach the teachings of the spirits of error, that is, separate false teachings (heresies):</p><blockquote><p><em>The fact that there are such </em><strong><em>men confessing themselves to be Christians, and admitting the crucified Jesus to be both Lord and Christ, yet not teaching His doctrines, but those of the spirits of error </em></strong><em>&lt;…&gt; with whom we have nothing in common</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho/#HH-35">Dialogue with Trypho, 35</a>)</p><p>The hieromartyr Irenaeus of Lyons (~130-202) also writes about countless Christian heresies. For example, he writes about a disciple of Justin the Philosopher — Tatian, who before Justin’s martyrdom did not speak heresy, but afterward invented his own teaching:</p><blockquote><p>1. Many offshoots of numerous heresies have already been formed from those heretics we have described. This arises from the fact that <strong>numbers of them — indeed, we may say all — desire themselves to be teachers, and to break off from the particular heresy in which they have been involved. Forming one set of doctrines out of a totally different system of opinions, and then again others from others, they insist upon teaching something new, declaring themselves the inventors of any sort of opinion which they may have been able to call into existence</strong>. To give an example: Springing from Saturninus and Marcion, those who are called Encratites (self-controlled) <strong>preached against marriage</strong>, thus setting aside the original creation of God, and indirectly blaming Him who made the male and female for the propagation of the human race. Some of those reckoned among them have also <strong>introduced abstinence from animal food</strong>, thus proving themselves ungrateful to God, who formed all things. <strong>They deny, too, the salvation of him who was first created</strong>. It is but lately, however, that this opinion has been invented among them. A certain man named Tatian first introduced the blasphemy. He was a hearer of Justin’s, and as long as he continued with him he expressed no such views; but after his martyrdom he separated from the Church, and, excited and puffed up by the thought of being a teacher, as if he were superior to others, he composed his own peculiar type of doctrine. He invented a system of certain invisible Aeons, like the followers of Valentinus; while, like Marcion and Saturninus, he declared that marriage was nothing else than corruption and fornication. But his denial of Adam’s salvation was an opinion due entirely to himself.</p><p>2. Others, again, following upon Basilides and Carpocrates, have introduced promiscuous intercourse and a plurality of wives, and are indifferent about eating meats sacrificed to idols, maintaining that God does not greatly regard such matters. But why continue? <strong>For it is an impracticable attempt to mention all those who, in one way or another, have fallen away from the truth</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1/#HH-28">Against Heresies, Book I, Chapter 28</a>)</p><h2>The Church Is One Faith, Unity and Like-Mindedness</h2><h3>In the Church There Is One Faith</h3><blockquote><p>“There is one body and one Spirit, just as you were called in one hope of your calling; one Lord, <strong>one faith</strong>, one baptism” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L4-5">Eph. 4:4-5</a>)</p></blockquote><h3>The Commandment of Like-Mindedness</h3><blockquote><p><em>“</em><strong><em>Be <mark>of the same mind</mark></em></strong><em> toward one another. Do not set your mind on high things, but </em><strong><em>associate with the humble</em></strong><em>. Do not be wise in your own opinion” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/12/#L16"><em>Rom. 12:16</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now I plead with you, brethren, by the name of our Lord Jesus Christ, that </em><strong><em><mark>you all speak the same thing</mark></em></strong><em>, and that there be no divisions among you, but that you be </em><strong><em>perfectly joined together in the same mind and <mark>in the same judgment</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10"><em>1 Cor. 1:10</em></a><em>)</em></p></blockquote><p>More quotes on like-mindedness: <a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B4%D0%B8%D0%BD%D0%BE%D0%BC%D1%8B%D1%81%D0%BB%D0%B8%D0%B5">https://bibleox.com/ru/ru/w/Единомыслие</a></p><h3>God’s Will for Unity</h3><p>The Lord desires the unity of those who believe in Him through the word of the apostles</p><blockquote><p>“I do not pray for these alone, but also <strong>for those who will believe in Me through their word; <mark>that they all may be one</mark></strong>, as You, Father, are in Me, and I in You; that they also may be one in Us” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>)</p></blockquote><h2>The Need to Resist Heresies</h2><blockquote><p>“<strong>Fight to the death for truth</strong>, and the Lord God will fight for you” (<a href="https://bibleox.com/en/en-nrsv/prsir/4/#L28">Sir. 4:28</a>)</p></blockquote><blockquote><p>“Beloved, while I was very diligent to write to you concerning our common salvation, I found it necessary to write to you exhorting you <strong>to contend earnestly for the faith which was once for all delivered to the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude. 1:3</a>)</p></blockquote><blockquote><p>“And have no fellowship with the unfruitful works of darkness, <strong>but rather expose them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L11">Eph. 5:11</a>)</p></blockquote><h2>The Devil Will Always Fight Against the Church</h2><blockquote><p>“So the LORD God said to the serpent: &lt;…&gt; ‘<strong>And I will put enmity</strong> between you and the woman, and <strong>between your seed and her Seed</strong>; He shall bruise your head, and you shall bruise His heel’” (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L14-15">Gen. 3:14-15</a>)</p></blockquote><blockquote><p>“Now when the dragon saw that he had been cast to the earth, he persecuted the woman who gave birth to the male Child. &lt;...&gt; And <strong>the dragon was enraged with the woman, and he went to make war with the rest of her offspring</strong>, who keep the commandments of God and have the testimony of Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/otkr/12/#L13,17">Rev. 12:13,17</a>)</p></blockquote><h2>Criticism</h2><h3>You Are Not Zealous for Miracles</h3><p>Supporters of heresy often try to attract people into their society with the help of miracles, healings and exorcism. For this they use the following quotes:</p><blockquote><p>“Pursue love, and <strong>desire spiritual gifts</strong>, but especially that you may prophesy” (<a href="https://bibleox.com/en/eng-nkjv/1kor/14/#L1">1 Cor. 14:1</a>)</p></blockquote><p>With this same quote they reproach the Church for not being zealous, and that therefore there is no mass demonstration of miracles in her.</p><p>However, the apostles and the ancient Christians were given abundant powers of working miracles not for show, but for profit:</p><blockquote><p>“But the manifestation of the Spirit is given to each one <strong>for the profit</strong> of all” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L7">1 Cor. 12:7</a>)</p></blockquote><p>A small group of fishermen needed great help to carry the preaching throughout the whole world in their short lifetime. The apostles warned that these gifts would come to an end:</p><blockquote><p>“Love never fails. But whether there are <strong>prophecies, they will fail; whether there are tongues, they will cease</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>)</p></blockquote><p>Christ Himself condemned the seeking of miracles:</p><blockquote><p>“<strong>An evil and adulterous generation seeks after a sign</strong>, and no sign will be given to it except the sign of the prophet Jonah” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L39">Matt. 12:39</a>)</p></blockquote><p>In the last times false prophets will lead people away precisely with miracles:</p><blockquote><p>“For false christs and false prophets will rise and <strong>show great signs and wonders to deceive</strong>, if possible, even the elect” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L24">Matt. 24:24</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/13/#L22">Mark. 13:22</a>)</p></blockquote><p>As a result, at the Judgment many believers will be convinced that they are saved because they worked miracles in the name of Christ, prophesied and cast out demons. But they turned out to have been deceived, taught lawlessness; Christ does not know them and drives them away from Himself:</p><blockquote><p>“Many will say to Me in that day, ‘Lord, Lord, have we not prophesied in Your name, cast out demons in Your name, and <strong>done many wonders in Your name?</strong>’ And then I will declare to them, ‘<strong>I never knew you;</strong> <strong>depart from Me</strong>, you who practice lawlessness!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23">Matt. 7:22-23</a>)</p></blockquote><h3>There Is No Love in You</h3><p>In conversations with supporters of societies separate from the Church, a defensive reaction is often used such as leaving the topic under discussion and trying to move to discussing the opponent’s person and his qualities. As a rule, this happens after difficult questions. However tactful and polite you may be, you may still be accused of:</p><ul><li><p>judging;</p></li><li><p>pride;</p></li><li><p>lack of love.</p></li></ul><p><strong>Of judging</strong> — because you say that one cannot be saved in heresy. However, the apostle says this (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L20">Gal. 5:20</a>), as do the holy fathers, beginning from the 1st century (<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_%D0%A1%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B2%D0%BE%D0%B7%D0%BC%D0%BE%D0%B6%D0%BD%D0%BE_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%B2_%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8">quotes</a>). The Lord gave the commandment not to condemn (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L37">Luke. 6:37</a>), but on the other hand He said that we should judge with righteous judgment (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L24">John. 7:24</a>).</p><p><strong>Of pride</strong> — because you say that <a href="https://bibleox.com/ru/ru/w/X7l9DcTY_%D0%A1%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B2%D0%BE%D0%B7%D0%BC%D0%BE%D0%B6%D0%BD%D0%BE_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%B2_%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8">salvation is possible only in the Church of Christ</a>, <a href="https://bibleox.com/ru/ru/w/%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">one, visible and united</a>. However, Scripture says this too: that Christ is the Savior of the body (the Church) (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L23">Eph. 5:23</a>), that without Christ no one will be saved (<a href="https://bibleox.com/ru/ru/w/%D0%98%D0%B8%D1%81%D1%83%D1%81_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%B5%D0%B4%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9-%D1%81%D0%BF%D0%B0%D1%81%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%B0">quotes</a>). The holy fathers say the same (<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_%D0%A1%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B2%D0%BE%D0%B7%D0%BC%D0%BE%D0%B6%D0%BD%D0%BE_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%B2_%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8">quotes</a>)</p><p>As for <strong>love</strong>. Without doubt, Christians must be meek, humble, and always act out of love. But what kind of love can and must it be? We cannot accuse the Lord Jesus Christ and the apostles of a lack of love. And yet, here are the teachings we can find in Holy Scripture:</p><blockquote><p>“My son, do not despise the chastening of the LORD, nor detest His correction; for <strong>whom the LORD loves He <mark>corrects</mark></strong>, just as a father the son in whom he delights” (<a href="https://bibleox.com/en/eng-nkjv/pr/3/#L11-12">Prov. 3:11-12</a>)</p></blockquote><blockquote><p>“For <strong>whom the LORD loves He <mark>chastens</mark></strong>, and scourges every son whom He receives” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L6">Heb. 12:6</a>)</p></blockquote><blockquote><p>“<strong>As many as I love, I <mark>rebuke</mark> and chasten</strong>. Therefore be zealous and repent” (<a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L19">Rev. 3:19</a>)</p></blockquote><blockquote><p>“Behold, happy is the man whom God <strong><mark>corrects</mark></strong>; therefore <strong>do not despise the chastening of the Almighty</strong>. For He bruises, but He binds up; He wounds, but His hands make whole” (<a href="https://bibleox.com/en/eng-nkjv/iov/5/#L17-18">Job. 5:17-18</a>)</p></blockquote><p>Therefore one must remember that if we take every rebuke as a manifestation of hatred, then we will accuse of hatred God and the apostles, who not only themselves exposed lies, but also called others to do so:</p><blockquote><p>“And have no fellowship with the unfruitful works of darkness, but rather <strong><mark>expose them</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L11">Eph. 5:11</a>)</p></blockquote><p>Attempts to show the falsity of one teaching or another can be not only a manifestation of hatred (which some may indeed do out of pride and hatred), but also a manifestation of love, of care for one’s neighbor, of desire for his salvation:</p><blockquote><p>“Brethren, if anyone among you <strong>wanders from the truth</strong>, and someone turns him back, let him know that <strong>he who turns a sinner from the error of his way will save a soul from death and cover a multitude of sins</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L19-20">James. 5:19-20</a>)</p></blockquote><p>One must try never to insult anyone, and also not to let the conversation be led away into a discussion of persons, where mutual judging of one another often begins. One must speak about teachings, and not about the qualities of people.</p>

  - src: грех-раскол
    path: Sc12m_Schism
    title: Schism (Division)
    meta_desc: Bible quotes about the sin of schism
    menu: { parent: Man/Sin, title: Schism, priority: 12 }
    body: |-
      <h2>The Will of Christ and the Apostles for the Visible Unity of the Church</h2><blockquote><p><em>“I do not </em><strong><em><mark>pray</mark></em></strong><em> for these alone, but also for those who will believe in Me through their word; </em><strong><em><mark>that they all may be one</mark></em></strong><em>, as You, Father, are in Me, and I in You; that they also </em><strong><em>may be one in Us, <mark>that the world may believe that You sent</mark> Me</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21"><em>John. 17:20-21</em></a><em>)</em></p></blockquote><blockquote><p>“Now <strong><mark>I plead</mark></strong> with you, brethren, by the name of our Lord Jesus Christ, <strong><mark>that you all speak the same thing</mark></strong>, <strong><mark>and that there be no divisions among you</mark></strong>, but that you be <strong>perfectly joined together <mark>in the same mind</mark> and <mark>in the same judgment</mark></strong>. For it has been declared to me concerning you, my brethren, by those of Chloe’s household, that <strong>there are contentions among you. Now I say this, that each of you says, ‘I am of Paul,’ or ‘I am of Apollos,’ or ‘I am of Cephas,’ or ‘I am of Christ.’ Is Christ divided?</strong> Was Paul crucified for you? Or were you baptized in the name of Paul?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10-13">1 Cor. 1:10-13</a>) “For when one says, ‘I am of Paul,’ and another, ‘I am of Apollos,’ <strong>are you not carnal?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L4">1 Cor. 3:4</a>)</p></blockquote><p>God arranged the members of the body (the Church) so that there would be no divisions, but that all would care for one another, suffer together and rejoice together:</p><blockquote><p>“For <strong>by one Spirit we were all baptized into one body</strong> — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit. For in fact <strong>the body is not one member but many</strong>. &lt;...&gt; <strong><mark>And the eye cannot say to the hand, ‘I have no need of you’; nor again the head to the feet, ‘I have no need of you.’</mark></strong> No, much rather, those members of the body which seem to be weaker are necessary. And those members of the body which we think to be less honorable, on these we bestow greater honor; and our unpresentable parts have greater modesty, but our presentable parts have no need. But <strong><mark>God composed the body</mark></strong>, having given greater honor to that part which lacks it, <strong><mark>that there should be no schism in the body</mark></strong>, but that the members should have the same care for one another. And <strong>if one member suffers, all the members suffer with it; or if one member is honored, all the members rejoice with it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13-14,21-26">1 Cor. 12:13-14,21-26</a>)</p></blockquote><p>What are these different members of the body? — The different ministries and gifts in the Church:</p><blockquote><p>“For as <strong>the body is one and has many members, but all the members of that one body</strong>, being many, are one body, so also is Christ. &lt;...&gt; For in fact <strong>the body is not one member but many</strong>. &lt;...&gt; Now <strong>you are the body of Christ, and members individually</strong>. And <strong>God has appointed these in the church</strong>: first <strong>apostles</strong>, second <strong>prophets</strong>, third <strong>teachers</strong>, after that <strong>miracles</strong>, then <strong>gifts</strong> of healings, helps, administrations, varieties of tongues. <strong>Are all apostles? Are all prophets? Are all teachers? Are all workers of miracles? Do all have gifts</strong> of healings? <strong>Do all speak</strong> with tongues? <strong>Do all interpret?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L12,14,27-30">1 Cor. 12:12,14,27-30</a>)</p></blockquote><p>Thus God arranged all these ministries and gifts so that there would be no divisions in the body, which the apostle prevents at the beginning of the epistle (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10-13">1 Cor. 1:10-13</a>). That is, God not only wants unity (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>), but also takes care of it. Here the apostle, appointed to the ministry by God, takes care of visible unity and forbids the Corinthians to create visible divisions.</p><h2>Schism in the Church Is a Sin That Closes a Person’s Way into the Kingdom of God</h2><blockquote><p>“<em>Now the works of the flesh are evident, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, contentions, jealousies, outbursts of wrath, selfish ambitions,</em> <strong><mark>dissensions</mark></strong><mark>*</mark>, <em>heresies, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that those who practice such things </em><strong><em><mark>will not inherit the kingdom of God</mark></em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p><p><strong><mark>*dissensions (διχοστασίαι)</mark> – division, splitting in two.</strong></p></blockquote><blockquote><p>“Now I urge you, brethren, <strong><mark>note those who cause divisions</mark> and offenses</strong>, contrary to the doctrine which you learned, and avoid them. For <strong><mark>those who are such do not serve our Lord Jesus Christ</mark></strong>, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18">Rom. 16:17-18</a>)</p></blockquote><h2>The Prophecy About Schisms</h2><blockquote><p>“<em>how they [the apostles] told you that </em><strong><em>there would be mockers in the last time</em></strong><em> who would walk according to their own ungodly lusts. These are</em> <strong>sensual persons, who cause divisions</strong> <em>(Greek: οἱ ἀποδιορίζοντες — “those who separate themselves”), not having the Spirit</em>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L18-19">Jude. 1:18-19</a>)</p></blockquote><blockquote><p>“Little children, it is the last hour; and as you have heard that the Antichrist is coming, <strong><mark>even now many antichrists have come</mark></strong>, by which we know that it is the last hour. <strong><mark>They went out from us, but they were not of us; for if they had been of us, they would have continued with us</mark></strong>; but they went out that they might be made manifest, that none of them were of us” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18-19">1 John. 2:18-19</a>)</p></blockquote><h2>Examples of Schisms</h2><blockquote><p>“I wrote to the church, but <strong>Diotrephes</strong>, who loves to have the preeminence among them, does not receive us. Therefore, if I come, I will call to mind his deeds which he does, <strong>prating against us with malicious words. And not content with that, he himself does not receive the brethren, and forbids those who wish to, putting them out of the church</strong>” (<a href="https://bibleox.com/en/eng-nkjv/3in/1/#L9-10">3 John. 1:9-10</a>)</p></blockquote><h2>The Apostles Prevented Attempts at Division</h2><blockquote><p>“For it has been declared to me concerning you, my brethren, by those of Chloe’s household, that there are contentions among you. Now I say this, that each of you says, ‘<strong>I am of Paul,’ or ‘I am of Apollos,’ or ‘I am of Cephas,’ or ‘I am of Christ.’ Is Christ divided?</strong> Was Paul crucified for you? Or were you baptized in the name of Paul?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L11-13">1 Cor. 1:11-13</a>)</p></blockquote><blockquote><p>“Now <strong>I plead</strong> with you, brethren, by the name of our Lord Jesus Christ, <strong>that you all speak the same thing, and that there be no divisions among you</strong>, but that you be perfectly joined together in the same mind and in the same judgment” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>)</p></blockquote><blockquote><p>“that <strong>there should be no schism in the body</strong>, but that the members should have the same care for one another” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L25">1 Cor. 12:25</a>)</p></blockquote>
