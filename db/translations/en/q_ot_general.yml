    body: |-
      <h2>The Ten Commandments Which God Gave to the Prophet Moses on the Stone Tablets</h2><p>God’s commands were not limited to these commandments, but it was precisely these commands that were given on the stone tablets.</p><h3>1</h3><blockquote><p>“<strong>I am the LORD your God</strong>, who brought you out of the land of Egypt, out of the house of bondage. <strong>You shall have no other gods</strong> before Me” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L2-3">Ex. 20:2-3</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L6-7">Deut. 5:6-7</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L2">Lev. 19:2</a>)</p></blockquote><h3>2</h3><blockquote><p>“<strong>You shall not make for yourself a carved image</strong> — any likeness of anything that is in heaven above, or that is in the earth beneath, or that is in the water under the earth; you shall not bow down to them nor serve them” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L4-5">Ex. 20:4-5</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L8-9">Deut. 5:8-9</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L4">Lev. 19:4</a>);</p></blockquote><h3>3</h3><blockquote><p>“<strong>You shall not take the name of the LORD your God in vain</strong>, for the LORD will not hold him guiltless who takes His name in vain” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L7">Ex. 20:7</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L11">Deut. 5:11</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L12">Lev. 19:12</a>);</p></blockquote><h3>4</h3><blockquote><p>“<strong>Remember the Sabbath day, to keep it holy</strong>. Six days you shall labor and do all your work, but the seventh day is the Sabbath of the LORD your God. In it you shall do no work: you, nor your son, nor your daughter, nor your male servant, nor your female servant, nor your cattle, nor your stranger who is within your gates” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L8-10">Ex. 20:8-10</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L12-15">Deut. 5:12-15</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L3">Lev. 19:3</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/ier/17/#L21">Jer. 17:21</a>; <a href="https://bibleox.com/en/eng-nkjv/neem/13/#L15-18">Neh. 13:15-18</a>)</p></blockquote><h3>5</h3><blockquote><p>“<strong>Honor your father and your mother</strong>, that your days may be long upon the land which the LORD your God is giving you” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L12">Ex. 20:12</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L16">Deut. 5:16</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L3">Lev. 19:3</a>);</p></blockquote><h3>6</h3><blockquote><p>“<strong>You shall not murder</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L13">Ex. 20:13</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L17">Deut. 5:17</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L17-18">Lev. 19:17-18</a>)</p></blockquote><h3>7</h3><blockquote><p>“<strong>You shall not commit adultery</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L14">Ex. 20:14</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L18">Deut. 5:18</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L20">Lev. 19:20</a>)</p></blockquote><h3>8</h3><blockquote><p>“<strong>You shall not steal</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L15">Ex. 20:15</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L19">Deut. 5:19</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L11">Lev. 19:11</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L13">Lev. 19:13</a>)</p></blockquote><h3>9</h3><blockquote><p>“<strong>You shall not bear false witness </strong>against your neighbor” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L16">Ex. 20:16</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L20">Deut. 5:20</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L11">Lev. 19:11</a>);</p></blockquote><h3>10</h3><blockquote><p>“<strong>You shall not covet your neighbor’s house</strong>; you shall not covet your neighbor’s wife, nor his male servant, nor his female servant, nor his ox, nor his donkey, nor anything that is your neighbor’s” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L17">Ex. 20:17</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L21">Deut. 5:21</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L17">Lev. 19:17</a>).</p></blockquote><h2>Explanation</h2><p><a href="https://bibleox.com/ru/ru/w/Z1BU_%D0%98%D0%B7%D1%8A%D1%8F%D1%81%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B4%D0%B5%D1%81%D1%8F%D1%82%D0%B8_%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9/">An explanation of the Ten Commandments (in Russian)</a></p>

  - src: женщина-ветхий-завет
    path: Wm7l_Woman_in_the_Law_of_Moses
    title: Woman in the Law of Moses
    meta_desc: Bible quotes about woman in the Old Testament
    menu: { parent: Old Testament, title: Woman in the Law of Moses, priority: 7 }
    body: |-
      <p>For the most part, the Law describes life situations characteristic of the female sex, as well as various situations in the relations between the sexes. Among them the following areas can be singled out:</p><ul><li><p>childbirth (<a href="https://bibleox.com/en/eng-nkjv/lev/12/">Lev. 12</a>)</p></li></ul><ul><li><p>discharge of blood (<a href="https://bibleox.com/en/eng-nkjv/lev/15/#L19-30">Lev. 15:19-30</a>, <a href="https://bibleox.com/en/eng-nkjv/lev/18/#L19">Lev. 18:19</a>, <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L18">Lev. 20:18</a>)</p></li></ul><ul><li><p>nakedness (<a href="https://bibleox.com/en/eng-nkjv/lev/18/">Lev. 18</a>)</p></li></ul><ul><li><p>relations with men, the choice of a husband (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L20">Lev. 19:20</a>, <a href="https://bibleox.com/en/eng-nkjv/lev/21/#L7-14">Lev. 21:7-14</a>, <a href="https://bibleox.com/en/eng-nkjv/chis/5/#L12-31">Num. 5:12-31</a>, <a href="https://bibleox.com/en/eng-nkjv/chis/36/">Num. 36</a>)</p></li></ul><ul><li><p>vows (<a href="https://bibleox.com/en/eng-nkjv/lev/27/#L3-8">Lev. 27:3-8</a>, <a href="https://bibleox.com/en/eng-nkjv/chis/6/">Num. 6</a>, <a href="https://bibleox.com/en/eng-nkjv/chis/30/#L3-16">Num. 30:3-16</a>)</p></li></ul><ul><li><p>falls into sin (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L20">Lev. 19:20</a>, <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L10-21">Lev. 20:10-21</a>)</p></li></ul><p>Let us consider these areas separately, in the order given.</p><h2>Childbirth</h2><p>After the birth of a child the Law sets for the woman a number of days of purification, and they differ depending on the sex of the child born. After the birth of a male infant the woman is considered unclean for 7 days, and 33 days of purification are imposed on her, during which she may not touch anything holy or come to the sanctuary (<a href="https://bibleox.com/en/eng-nkjv/lev/12/#L2-4">Lev. 12:2-4</a>). In the case of a female infant these days are doubled accordingly (<a href="https://bibleox.com/en/eng-nkjv/lev/12/#L5">Lev. 12:5</a>).</p><h2>Discharge of Blood</h2><p>First it is worth mentioning that the Law says that any discharge from a person’s body makes him unclean:</p><blockquote><p>“Speak to the children of Israel, and say to them: ‘When any man has a discharge from his body, his discharge is unclean’” (<a href="https://bibleox.com/en/eng-nkjv/lev/15/#L2">Lev. 15:2</a>).</p></blockquote><p>Nevertheless, for obvious reasons, women are mentioned separately and at considerable length.</p><p>In general, as long as a woman has a discharge of blood she is unclean, and afterwards 7 days of purification are imposed on her. If she always has a discharge of blood, she is always unclean. An unclean woman may not have intimacy with her husband, and if it is otherwise, the husband will be unclean in exactly the same way as the wife, and the same regulations apply to the husband as to the wife. All things on which a woman with a discharge of blood lies or sits become unclean, and whoever touches them will be unclean until evening. After the days of purification an offering of two turtledoves or two young pigeons must be brought (<a href="https://bibleox.com/en/eng-nkjv/lev/15/#L29-30">Lev. 15:29-30</a>), after which the woman is considered clean.</p><p>There are also other regulations connected with women and the discharge of blood, but they will be discussed in the following sections.</p><h2>Nakedness</h2><blockquote><p>“None of you shall approach anyone who is near of kin to him, to uncover his nakedness” (<a href="https://bibleox.com/en/eng-nkjv/lev/18/#L6">Lev. 18:6</a>).</p></blockquote><p>Although this chapter also mentions the nakedness of a man (the father), logically it mainly lists prohibitions against uncovering the nakedness of women in various degrees of kinship, not only by blood:</p><blockquote><p>“You shall not uncover the nakedness of your daughter-in-law — she is your son’s wife — you shall not uncover her nakedness” (<a href="https://bibleox.com/en/eng-nkjv/lev/18/#L15">Lev. 18:15</a>).</p></blockquote><p>Returning to the already mentioned provisions of the Law on the discharge of blood, let us also mention this prohibition to the husband:</p><blockquote><p>“Also you shall not approach a woman to uncover her nakedness as long as she is in her customary impurity” (<a href="https://bibleox.com/en/eng-nkjv/lev/18/#L19">Lev. 18:19</a>).</p></blockquote><h2>Relations with Men, the Choice of a Husband</h2><p>If a man seduces a slave woman betrothed to another man, he is not to be punished by death, unlike the case where he seduced a free woman (that is, not a slave) (<a href="https://bibleox.com/en/eng-nkjv/vtor/22/#L25">Deut. 22:25</a>), but must only bring a trespass offering — a ram (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L20-21">Lev. 19:20-21</a>).</p><p>A husband and wife are considered unclean until evening after marital intimacy (<a href="https://bibleox.com/en/eng-nkjv/lev/15/#L18">Lev. 15:18</a>).</p><p>Only virgins could become the wives of priests (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L13">Lev. 21:13</a>), and not widows, divorced women, defiled women or harlots.</p><p>If a woman, in the absence of male heirs, inherits land, she may marry only someone from the tribe of her father (<a href="https://bibleox.com/en/eng-nkjv/chis/36/#L8">Num. 36:8</a>), so that the inheritance would not pass to other tribes.</p><p>There is even an ordinance describing what is to be done with a wife whom her husband suspects of adultery (<a href="https://bibleox.com/en/eng-nkjv/chis/5/#L12-31">Num. 5:12-31</a>).</p><h2>Vows (Promises to God)</h2><p>There were people who made certain vows to God, and some of them were called Nazirites (do not confuse: Jesus Christ was called a Nazarene because He was from Nazareth); they promised not to drink or eat any products made from grapes, not to cut their hair, and not to go near a dead body. Such a vow could be made either for a certain time or for life. This is mentioned only to emphasize the fact that both men and women were Nazirites.</p><p>The Law allowed what had been sold to be redeemed (<a href="https://bibleox.com/en/eng-nkjv/lev/25/#L25">Lev. 25:25</a>), and by analogy a price is set even for one who has dedicated his life to God through service at the sanctuary. Here one can notice that the life of a man and of a woman are valued differently. For example, a man from 20 to 60 years old is valued at 50 shekels of silver of the sanctuary, and a woman at 30 shekels (<a href="https://bibleox.com/en/eng-nkjv/lev/27/#L3-4">Lev. 27:3-4</a>). A. P. Lopukhin explains this difference by the unequal capacity for work of the person dedicated to the sanctuary in each case: physical work for the sanctuary was required of him — chopping wood, carrying water and so on.</p><blockquote><p>“If a man makes a vow to the LORD, or swears an oath to bind himself by some agreement, he shall not break his word; he shall do according to all that proceeds out of his mouth” (<a href="https://bibleox.com/en/eng-nkjv/chis/30/#L2">Num. 30:2</a>).</p></blockquote><p>Thus whoever has sworn must fulfill his oath, but with regard to a woman there are reservations. If a wife makes an oath or a vow, the husband who heard it can annul this oath, and it will be considered as never having been. So too a father can annul an oath of his daughter in her youth that he has heard.</p><h2>Falls into Sin</h2><p>A number of laws are described that impose severe punishments for falls into sin, such as:</p><ul><li><p>adultery (<a href="https://bibleox.com/en/eng-nkjv/lev/20/#L10-12">Lev. 20:10-12</a>),</p></li><li><p>bestiality (described specifically with regard to women: <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L16">Lev. 20:16</a>, <a href="https://bibleox.com/en/eng-nkjv/lev/18/#L23">Lev. 18:23</a>),</p></li><li><p>sodomy (<a href="https://bibleox.com/en/eng-nkjv/lev/20/#L13">Lev. 20:13</a>) and others.</p></li></ul><p>Such crimes against the Law were punished by death.</p>

  - src: Ветхий-Завет-конец
    path: Oe9d_The_End_of_the_Old_Testament
    title: The Old Testament — the End
    meta_desc: Bible quotes showing that the Old Covenant has ended and the Jewish ordinances have been abolished
    menu: { parent: Old Testament, title: The Old Testament — the End, priority: 9 }
    body: |-
      <h2>That There Will Be a New Covenant</h2><p>Old Testament prophecies that, instead of the Covenant with the Jewish people, which they broke, a New Covenant will be made with a new people:</p><blockquote><p>“But <strong>Jeshurun grew fat and kicked</strong>; you grew fat, you grew thick, you are obese! Then <strong>he forsook God</strong> who made him, and scornfully esteemed the Rock of his salvation. <strong>They provoked Him to jealousy with foreign gods</strong>; with abominations they provoked Him to anger. <strong>They sacrificed to demons, not to God, to gods they did not know, to new gods, new arrivals that your fathers did not fear</strong>. Of the Rock who begot you, you are unmindful, and have forgotten the God who fathered you. And when the LORD saw it, He spurned them, because of the provocation of His sons and His daughters. And He said: ‘<strong>I will hide My face from them, I will see what their end will be</strong>, for they are a perverse generation, children in whom is no faith. They <strong>have provoked Me to jealousy by what is not God</strong>; they have moved Me to anger by their foolish idols. But <strong>I will provoke them to jealousy by those who are not a nation</strong>; I will move them to anger by a foolish nation’” (<a href="https://bibleox.com/en/eng-nkjv/vtor/32/#L15-21">Deut. 32:15-21</a>)</p></blockquote><blockquote><p>“Behold, the days are coming, says the LORD, when <strong>I will make a new covenant with the house of Israel and with the house of Judah</strong> — not according to the covenant that I made with their fathers in the day that I took them by the hand to lead them out of the land of Egypt, <strong>My covenant which they broke, though I was a husband to them</strong>, says the LORD. <strong>But this is the covenant that I will make with the house of Israel after those days</strong>, says the LORD: I will put My law in their minds, and write it on their hearts; <strong>and I will be their God, and they shall be My people</strong>. &lt;…&gt; If those ordinances depart from before Me, says the LORD, then <strong>the seed of Israel shall also cease from being a nation before Me forever</strong>. Thus says the LORD: If heaven above can be measured, and the foundations of the earth searched out beneath, <strong>I will also cast off all the seed of Israel</strong> for all that they have done, says the LORD” (<a href="https://bibleox.com/en/eng-nkjv/ier/31/#L31-33,36-37">Jer. 31:31-33,36-37</a>)</p></blockquote><blockquote><p>“<strong>I was sought by those who did not ask for Me</strong>; <strong>I was found by those who did not seek Me</strong>. I said, ‘Here I am, here I am,’ <strong>to a nation that was not called by My name</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/65/#L1">Is. 65:1</a>)</p></blockquote><blockquote><p>“Then I will sow her for Myself in the earth, and I will have mercy on her who had not obtained mercy; then <strong>I will say</strong> <strong>to those who were not My people, ‘You are My people!’ And they shall say, ‘You are my God!’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/os/2/#L23">Hos. 2:23</a>)</p></blockquote><h2>On the End of the Old Covenant</h2><blockquote><p>“Because finding fault with them, He says: ‘Behold, the days are coming, says the LORD, when I will make a <strong><mark>new</mark></strong> covenant with the house of Israel and with the house of Judah’ &lt;…&gt; In that He says, ‘A new covenant,’ <strong><mark>He has made the first obsolete</mark></strong>. Now <strong>what is becoming obsolete</strong> <strong>and growing old</strong> <strong>is ready to vanish away</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/8/#L8,13">Heb. 8:8,13</a>)</p></blockquote><blockquote><p>“But their minds [of the Jews] were blinded. For until this day the same <strong>veil</strong> remains unlifted <strong>in the reading of the <mark>Old</mark> Testament</strong>, because the veil <strong>is taken away in Christ</strong>. But even to this day, when Moses is read, a veil lies on their heart. Nevertheless when one turns to the Lord, the veil is taken away” (<a href="https://bibleox.com/en/eng-nkjv/2kor/3/#L14-16">2 Cor. 3:14-16</a>)</p></blockquote><blockquote><p>“who also made us <strong>sufficient as ministers of the <mark>new</mark> covenant, not of the letter but of the Spirit</strong>; for the letter kills, but the Spirit gives life” (<a href="https://bibleox.com/en/eng-nkjv/2kor/3/#L6">2 Cor. 3:6</a>)</p></blockquote><blockquote><p>“But now <strong>we have been delivered from the law</strong>, having died to what we were held by, so that we should serve in the newness of the Spirit and <strong>not in the <mark>oldness</mark> of the letter</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/7/#L6">Rom. 7:6</a>)</p></blockquote><blockquote><p>“But before faith came, <strong>we were kept under guard by the law</strong>, kept for the faith which would afterward be revealed. Therefore <strong>the law was our tutor</strong> to bring us to Christ, that we might be justified by faith. But after faith has come, <strong><mark>we are no longer under a tutor</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L23-25">Gal. 3:23-25</a>)</p></blockquote><h3>A Warning Not to Use Christian Freedom for Evil:</h3><blockquote><p>“<strong>For you, brethren, have been called to liberty; only do not use liberty as an opportunity for the flesh</strong>, but through love serve one another” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L13">Gal. 5:13</a>)</p></blockquote>

  - src: языческая-вера-в-идола
    path: Pi50d_Pagan_Faith_in_Idols
    title: Pagan Faith in Idols
    title_sub: Bible quotes about pagan faith in idols
    meta_desc: Bible quotes about pagan faith in idols
    menu: { parent: Old Testament, title: Pagan Faith in Idols, priority: 50 }
    body: |-
      <h2>Kinds of Pagan Faith in Idols</h2><p>Pagan faith in idols is of three kinds, beginning with the most widespread in antiquity:</p><ol><li><p><strong>The idol is the god itself</strong>. The object made by the pagan himself is the deity.</p></li><li><p><strong>The idol is an image</strong> of a deity far away, which supposedly must look like that.</p></li><li><p><strong>The idol is</strong> <strong>an invented image</strong> of a deified natural element: the sea, wind, rain, fire, earth.</p></li></ol><p>In all three cases a <u>false god</u> is worshiped, one that <u>does not exist</u>. This is faith in a lie.</p><p>It is precisely the first variant that we meet in the Bible: the most widespread pagan faith is <u>the deification of the object itself</u><strong> </strong>(of matter).</p><h2>Pagans Consider the Manufactured Article Itself to Be God</h2><blockquote><p>“Even from the beginning I have declared it to you; before it came to pass I proclaimed it to you, lest you should say, ‘<strong>My idol has done them, and my carved image and my molded image have commanded them</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/is/48/#L5">Is. 48:5</a>)</p></blockquote><blockquote><p>“Their tongues are smoothed by the carpenter, and they themselves are overlaid with gold and silver; but <strong>they are false and cannot speak</strong>. People take gold and make crowns for the heads of their gods, as they might for a girl who loves ornaments. Sometimes <strong>the priests secretly take gold and silver from their gods</strong> and spend it on themselves, or even give some of it to the prostitutes on the terrace. <strong>They deck their gods out with garments</strong> like human beings — these gods of silver and gold and wood that <strong>cannot save themselves from rust and corrosion</strong>. When they have been dressed in purple robes, <strong>their faces are wiped</strong> because of the dust from the temple, which is thick upon them. One of them holds a scepter, like a district judge, but <strong>is unable to destroy anyone who offends it</strong>. Another has a dagger in its right hand, and an ax, but <strong>cannot defend itself from war and robbers</strong>. From this it is evident that <strong>they are not gods (!)</strong>; so do not fear them. For just as someone’s dish is useless when it is broken, so are their gods when they have been set up in the temples. Their eyes are full of the dust raised by the feet of those who enter. And just as the gates are shut on every side against anyone who has offended a king, as though under sentence of death, so <strong>the priests make their temples secure with doors and locks and bars, in order that they may not be plundered</strong> by robbers. They light more lamps for them than they light for themselves, though their gods can see none of them. They are just like a beam of the temple, but <strong>their hearts, it is said, are eaten away when crawling creatures from the earth devour them and their robes. They do not notice</strong> when their faces have been blackened by the smoke of the temple. <strong>Bats, swallows, and birds alight on their bodies and heads; and so do cats. From this you will know that they are not gods</strong>; so do not fear them. As for the gold that they wear for beauty — it will not shine unless someone wipes off the tarnish; for <strong>even when they were being cast, they did not feel it</strong>. They are bought without regard to cost, but there is no breath in them. Having no feet, <strong>they are carried on the shoulders</strong> of others, revealing to humankind their worthlessness. And those who serve them are put to shame because, <strong>if any of these gods falls to the ground, they themselves must pick it up</strong>. If anyone sets it upright, <strong>it cannot move itself</strong>; and if it is tipped over, <strong>it cannot straighten itself</strong>. Gifts are placed before them just as before the dead. The priests sell the sacrifices that are offered to these gods and use the money themselves. Likewise their wives preserve some of the meat with salt, but give none to the poor or helpless. Sacrifices to them may even be touched by women in their periods or at childbirth. Since you know by these things that they are not gods, do not fear them. For how can they be called gods? Women serve meals for gods of silver and gold and wood; and in their temples the priests sit with their clothes torn, their heads and beards shaved, and their heads uncovered. &lt;…&gt; These things that are made of wood and overlaid with gold and silver are like stones from the mountain, and those who serve them will be put to shame. Why then must anyone think that they are gods, or call them gods? &lt;…&gt; <strong>They are made by carpenters and goldsmiths; they can be nothing but what the artisans wish them to be</strong>. Those who make them will certainly not live very long themselves; how then can the things that are made by them be gods? They have left only lies and reproach for those who come after. &lt;…&gt; How then can one fail to see that these are not gods, for <strong>they cannot save themselves</strong> from war or calamity? Since they are made of wood and overlaid with gold and silver, it will afterward be known that they are false. It will be manifest to all the nations and kings that <strong>they are not gods but the work of human hands, and that there is no work of God in them</strong>. Who then can fail to know that they are not gods? For they cannot set up a king over a country or give rain to people. They cannot judge their own cause or deliver one who is wronged, for they have no power; they are like crows between heaven and earth. <strong>When fire breaks out in a temple of wooden gods</strong> overlaid with gold or silver, their priests will flee and escape, but the gods <strong>will be burned up like timbers</strong>. Besides, they can offer no resistance to king or enemy. Why then must anyone admit or think that they are gods? <strong>Gods made of wood and overlaid with silver and gold are unable to save themselves from thieves or robbers</strong>. Anyone who can will strip them of their gold and silver and of the robes they wear, and go off with this booty, and they will not be able to help themselves. So it is better to be a king who shows his courage, or a household utensil that serves its owner’s need, than to be these false gods; better even the door of a house that protects its contents, than these false gods; better also a wooden pillar in a palace, than these false gods. &lt;…&gt; Since you know then that they are not gods, do not fear them. &lt;…&gt; The wild animals are better than they are, for they can flee to shelter and help themselves. So <strong>we have no evidence whatever that they are gods</strong>; therefore do not fear them. <strong>Like a scarecrow in a cucumber bed</strong>, which guards nothing, so are their gods of wood, overlaid with gold and silver. In the same way, their gods of wood, overlaid with gold and silver, are like a thornbush in a garden on which every bird perches; or like a corpse thrown out in the darkness. From the purple and linen that rot upon them you will know that they are not gods; and they will finally be consumed themselves, and be a reproach in the land. Better, therefore, is someone upright who has no idols; such a person will be far above reproach” (<a href="https://bibleox.com/en/en-nrsv/pos/1/#L8-31,39-40,45-59,65,68-73">Ep. Jer. 1:8-31,39-40,45-59,65,68-73</a>)</p></blockquote><h2>Pagan Israelites Considered the Manufactured Article Itself to Be God, and Also the Elements</h2><blockquote><p>“Those who make an image, all of them are useless, and their precious things shall not profit; they are their own witnesses; <strong>they neither see nor know</strong>, that they may be ashamed. Who would form a god or mold an image that profits him nothing? Surely all his companions would be ashamed; and the workmen, they are mere men. Let them all be gathered together, let them stand up; yet they shall fear, they shall be ashamed together. The blacksmith with the tongs works one in the coals, fashions it with hammers, and works it with the strength of his arms. Even so, he is hungry, and his strength fails; he drinks no water and is faint. The craftsman stretches out his rule, he marks one out with chalk; he fashions it with a plane, he marks it out with the compass, and makes it like the figure of a man, according to the beauty of a man, that it may remain in the house. <strong>He cuts down cedars for himself</strong>, and takes the cypress and the oak; he secures it for himself among the trees of the forest. He plants a pine, and the rain nourishes it. <strong>Then it shall be for a man to burn, for he will take some of it and warm himself; yes, he kindles it and bakes bread; indeed he makes a god and worships it; he makes it a carved image, and falls down to it</strong>. He burns half of it in the fire; with this half he eats meat; he roasts a roast, and is satisfied. He even warms himself and says, ‘Ah! I am warm, I have seen the fire.’ <strong>And the rest of it he makes into a god, his carved image. He falls down before it and worships it, prays to it</strong> and says, <strong>‘Deliver me, for you are my god!’ (!)</strong> They do not know nor understand; for He has shut their eyes, so that they cannot see, and their hearts, so that they cannot understand. And no one considers in his heart, nor is there knowledge nor understanding to say, ‘<strong>I have burned half of it in the fire, yes, I have also baked bread on its coals; I have roasted meat and eaten it</strong>; and shall I make the rest of it an abomination? <strong>Shall I fall down before a block of wood?</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/is/44/#L9-19">Is. 44:9-19</a>)</p></blockquote><blockquote><p>“For all people who were ignorant of God were foolish by nature; and they were unable from the good things that are seen to know the one who exists, nor did they recognize the artisan while paying heed to his works; but <strong>they supposed that either fire or wind or swift air, or the circle of the stars, or turbulent water, or the luminaries of heaven were the gods that rule the world</strong>. If through delight in the beauty of these things people assumed them to be gods, let them know how much better than these is their Lord, for the author of beauty created them. And if people were amazed at their power and working, let them perceive from them how much more powerful is the one who formed them. For from the greatness and beauty of created things comes a corresponding perception of their Creator. Yet these people are little to be blamed, for perhaps they go astray while seeking God and desiring to find him. For while they live among his works, they keep searching, and they trust in what they see, because the things that are seen are beautiful. Yet again, not even they are to be excused; for if they had the power to know so much that they could investigate the world, how did they fail to find sooner the Lord of these things? <strong>But miserable, with their hopes set on dead things,</strong> are those who <strong>give the name ‘gods’ to the works of human hands (!)</strong>, gold and silver fashioned with skill, and <strong>likenesses of animals</strong>, or a useless stone, the work of an ancient hand. A skilled woodcutter may saw down a tree easy to handle and skillfully strip off all its bark, and then with pleasing workmanship <strong>make a useful vessel that serves life’s needs, and burn the cast-off pieces of his work to prepare his food, and eat his fill. But a cast-off piece from among them, useful for nothing, a stick crooked and full of knots, he takes and carves with care in his leisure, and shapes it with skill gained in idleness;</strong> <strong>he forms it in the likeness (!) of a human being </strong>[NOT OF A GOD], or makes it <strong>like some worthless animal</strong>, giving it a coat of red paint and coloring its surface red and covering every blemish in it with paint; then he makes a suitable niche for it, and sets it in the wall, and <strong>fastens it there with iron. He takes thought for it, so that it may not fall</strong>, <strong>because he knows that it cannot help itself</strong>, for it is only an image and has need of help. When he prays about possessions and his marriage and children, he is not ashamed to address a lifeless thing. For health he appeals to a thing that is weak; for life he prays to <strong>a thing that is dead</strong>; for aid he entreats <strong>a thing that is utterly inexperienced</strong>; for a prosperous journey, <strong>a thing that cannot take a step</strong>; for money-making and work and success with his hands <strong>he asks strength of a thing whose hands have no strength</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/13/#L1-19">Wis. 13:1-19</a>)</p></blockquote><blockquote><p>“Again, one preparing to sail and about to voyage over raging waves <strong>calls upon a piece of wood</strong> more fragile than the ship that carries him. &lt;…&gt; But the idol <strong>made with hands</strong> is accursed, and so is the one who made it — he for having made it, and <strong>the perishable thing because it was named a god</strong>. &lt;…&gt; For through human vanity they entered the world, and therefore their speedy end has been planned. For a father, consumed with grief at an untimely bereavement, <strong>made an image of his child, who had been suddenly taken from him; he now honored as a god</strong> [THE IMAGE] <strong>what was once a dead human being</strong>, and handed on to his dependents secret rites and initiations. Then the ungodly custom, grown strong with time, was kept as a law, and at the command of monarchs <strong>carved images (!) were worshiped</strong>. When people could not honor monarchs in their presence, since they lived at a distance, they imagined their appearance far away, and made a visible image of the king whom they honored, so that by their zeal they might flatter the absent one as though present. Then the ambition of the artisan impelled even those who did not know the king to intensify their worship. For he, perhaps wishing to please his ruler, <strong>skillfully forced the likeness to take more beautiful form, and the multitude, attracted by the charm of his work, now regarded as an object of worship the one whom shortly before they had honored as a human being</strong> [EARLIER THEY HONORED THE STATUE OF A GREAT MAN]. And this became a hidden trap for humankind, because people, in bondage to misfortune or to royal authority, <strong>bestowed on objects of stone or wood the name that ought not to be shared</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/14/#L1,8,14-21">Wis. 14:1,8,14-21</a>)</p></blockquote><p>At the foot of Mount Sinai the Israelites literally asked to have a god made for them:</p><blockquote><p>“Now when the people saw that Moses delayed coming down from the mountain, the people gathered together to Aaron, and said to him, ‘Come, <strong>make us gods that shall go before us</strong>; for as for this Moses, the man who brought us up out of the land of Egypt, we do not know what has become of him.’ And Aaron said to them, ‘Break off the golden earrings which are in the ears of your wives, your sons, and your daughters, and bring them to me.’ &lt;…&gt; And he received the gold from their hand, and <strong>he fashioned it with an engraving tool, and made a molded calf</strong>. Then they said, ‘<strong>This is your god</strong>, O Israel, that brought you out of the land of Egypt!’ &lt;…&gt; For they said to me, ‘<strong>Make us gods that shall go before us</strong>; as for this Moses, the man who brought us out of the land of Egypt, we do not know what has become of him’” (<a href="https://bibleox.com/en/eng-nkjv/ish/32/#L1-2,4,23">Ex. 32:1-2,4,23</a>)</p></blockquote><blockquote><p>“Then Moses returned to the LORD and said, ‘Oh, these people have committed a great sin, and <strong>have made for themselves a god of gold</strong>!’” (<a href="https://bibleox.com/en/eng-nkjv/ish/32/#L31">Ex. 32:31</a>)</p></blockquote><p>They burned incense not to God but to the serpent, gave it a name — that is, they invented a god:</p><blockquote><p>“He removed the high places and broke the sacred pillars, cut down the wooden image and broke in pieces <strong>the bronze serpent</strong> that Moses had made; for until those days the children of Israel <strong>burned incense to it, and called it Nehushtan</strong>” (<a href="https://bibleox.com/en/eng-nkjv/4ts/18/#L4">2 Kin. 18:4</a>)</p></blockquote><p>They stole gods (although they stole merely manufactured articles), that is, the articles themselves are called gods:</p><blockquote><p>“And now you have surely gone because you greatly long for your father’s house, but <strong>why did you steal my gods</strong>?” Then Jacob answered and said to Laban, “Because I was afraid, for I said, ‘Perhaps you would take your daughters from me by force.’ <strong>With whomever you find your gods, do not let him live</strong>. In the presence of our brethren, identify what I have of yours and take it with you.” For Jacob did not know that Rachel <strong>had stolen them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/31/#L30-32">Gen. 31:30-32</a>)</p></blockquote><p>Gods made by hands, which they worshiped, are forbidden:</p><blockquote><p>“Do not turn to idols, <strong>nor make for yourselves</strong> <strong>molded gods</strong>: I am the LORD your God” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L4">Lev. 19:4</a>)</p></blockquote><blockquote><p>“Their land is also full of idols; <strong>they worship the work of their own hands, that which their own fingers have made</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/2/#L8">Is. 2:8</a>)</p></blockquote><h2>The Reason Idols Were Made in Israel</h2><blockquote><p>“And Jeroboam said in his heart, ‘<strong>Now the kingdom may return to the house of David</strong> [THIS IS THE REASON FOR MAKING THE IDOLS]: If these people go up to offer sacrifices in the house of the LORD at Jerusalem, then the heart of this people will turn back to their lord, Rehoboam king of Judah, and they will kill me and go back to Rehoboam king of Judah.’ Therefore <strong>the king asked advice, made two calves of gold</strong>, and said to the people, ‘It is too much for you to go up to Jerusalem. <strong>Here are your gods</strong> [TWO CALVES — TWO GODS, NOT TWO IMAGES OF ONE AND THE SAME GOD], O Israel, which <strong>brought you up</strong> [PLURAL] from the land of Egypt!’ And he set up one in Bethel, and the other he put in Dan. &lt;…&gt; Jeroboam ordained a feast on the fifteenth day of the eighth month, like the feast that was in Judah, and offered sacrifices on the altar. So he did at Bethel, <strong>sacrificing to the calves</strong> [THE SACRIFICES WERE OFFERED TO THE BULLS THEMSELVES] <strong>that he had made</strong>. And at Bethel he installed the priests of the high places which he had made” (<a href="https://bibleox.com/en/eng-nkjv/3ts/12/#L26-29,32">1 Kin. 12:26-29,32</a>)</p></blockquote><h2>In Babylon They Considered the Bronze Article Itself to Be God, and Also an Animal</h2><blockquote><p>“The Babylonians had <strong>an idol named Bel</strong>, and every day they spent on it twenty great measures of fine flour, forty sheep and six measures of wine. <strong>The king revered it and went every day to worship it</strong>; but Daniel worshiped his own God. And the king said to him, ‘Why do you not worship Bel?’ He answered, ‘Because I do not worship idols made with hands, but the living God, who created heaven and earth and has dominion over all flesh.’ The king said, ‘<strong>Do you not think that Bel is a living god? Do you not see how much he eats and drinks every day?</strong>’ Daniel smiled and said, ‘Do not be deceived, O king; for this is clay inside and bronze outside, and it never ate or drank anything.’ Then the king was angry and called his priests and said to them, ‘If you do not tell me who is eating all this, you shall die. But if you prove that Bel is eating it, Daniel shall die, because he has blasphemed Bel.’ And Daniel said to the king, ‘Let it be according to your word.’ There were seventy priests of Bel, besides their wives and children. And the king went with Daniel to the temple of Bel, and the priests of Bel said, ‘Behold, we will go out, and you, O king, set out the food and mix the wine, shut the door and seal it with your signet. And if tomorrow you come and do not find that everything has been eaten by Bel, we will die; or else Daniel, who is lying about us.’ They were not concerned, for they had made a hidden entrance under the table, and through it they used to go in regularly and consume the provisions. When they had gone out, the king set out the food for Bel, and Daniel ordered his servants, and they brought ashes and scattered them over the whole temple in the presence of the king alone; then they went out, shut the door, sealed it with the king’s signet, and departed. In the night the priests came, as they were accustomed, with their wives and children, and they ate and drank everything. Early the next day the king rose, and Daniel with him. And he said, ‘Are the seals unbroken, Daniel?’ He said, ‘They are unbroken, O king.’ And as soon as the doors were opened, the king looked at the table and shouted in a loud voice, ‘You are great, O Bel, and there is no deceit in you!’ Daniel smiled and held the king back from going in, and said, ‘Look at the floor and notice whose footprints these are.’ The king said, ‘I see the footprints of men and women and children.’ Then the king was enraged, and he seized the priests and their wives and children; and they showed him the secret doors through which they used to enter and devour what was on the table. Therefore the king put them to death, and gave Bel over to Daniel, who destroyed it and its temple. <strong>There was also a great dragon in that place, which the Babylonians revered</strong>. And the king said to Daniel, ‘<strong>You cannot say of this one too that it is bronze? Behold, it is alive, and eats and drinks; you cannot deny that this is a living god</strong>; so worship it.’ Daniel said, ‘I worship the Lord my God, for He is the living God. But give me permission, O king, and I will kill the dragon without sword or club.’ The king said, ‘I give you permission.’ Then Daniel took pitch, fat and hair, and boiled them together and made cakes, which <strong>he threw into the dragon’s mouth, and the dragon burst open</strong>. And Daniel said, ‘See what you have been worshiping!’ When the Babylonians heard it, they were very indignant and conspired against the king, saying, ‘The king has become a Jew; he has destroyed Bel, and killed the dragon, and slaughtered the priests’” (<a href="https://bibleox.com/en/ru/dan/14/#L3-28">Bel and the Dragon (Dan. 14:3-28)</a>; translated from the Russian Synodal)</p></blockquote><h2>An Idol Can Do Nothing and Itself Requires Care</h2><p>Attention is constantly drawn to the fact that idols can do nothing:</p><blockquote><p>“Of what use to an idol is a sacrifice? <strong>For it can neither eat nor smell</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/30/#L19">Sir. 30:19</a>)</p></blockquote><blockquote><p>“But the rest of mankind, who were not killed by these plagues, did not repent of the works of their hands, that they should not worship demons, and <strong>idols of gold, silver, brass, stone, and wood, which can neither see nor hear nor walk</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/9/#L20">Rev. 9:20</a>)</p></blockquote><p>But if an idol were only an image, there would be no need to say that it can do nothing. The pagans themselves would laugh and say: of course it can’t, it’s only an image.</p><h2>Without the Idol, the Service of the Idol Is Not Performed</h2><blockquote><p>“As for you, O house of Israel,” thus says the Lord GOD: “<strong>Go, serve every one of you his idols</strong> — and hereafter — if you will not obey Me; but profane My holy name no more with your gifts and your idols” (<a href="https://bibleox.com/en/eng-nkjv/iez/20/#L39">Ezek. 20:39</a>)</p></blockquote><h2>On Idols in the New Testament</h2><p>The idol itself is considered a god:</p><blockquote><p>“For a certain man named Demetrius, a silversmith, who made silver shrines of Diana (Artemis), brought no small profit to the craftsmen. He called them together with the workers of similar occupation, and said: ‘Men, you know that we have our prosperity by this trade. Moreover you see and hear that not only at Ephesus, but throughout almost all Asia, this Paul has persuaded and turned away many people, saying that <strong>they are not gods which are made with hands</strong>. So <strong>not only is this trade of ours in danger (!)</strong> of falling into disrepute, but also the temple of the great goddess Diana may be despised and her magnificence destroyed, whom all Asia and the world worship’” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L24-27">Act. 19:24-27</a>)</p></blockquote><h2>The True God Gives No Answer to a Worshiper of Idols</h2><blockquote><p>“For when you offer your gifts and make your sons pass through the fire, <strong>you defile yourselves with all your idols</strong>, even to this day. So shall I be inquired of by you, O house of Israel? As I live,” says the Lord GOD, “<strong>I will not be inquired of by you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iez/20/#L31">Ezek. 20:31</a>)</p></blockquote><blockquote><p>“that I may seize the house of Israel by their heart, because <strong>they are all estranged from Me by their idols</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iez/14/#L5">Ezek. 14:5</a>)</p></blockquote><h2>Other</h2><blockquote><p>“For the idea of making idols was the beginning of fornication, and the invention of them was the corruption of life” (<a href="https://bibleox.com/en/en-nrsv/prs/14/#L12">Wis. 14:12</a>)</p></blockquote><blockquote><p>“For the worship of idols not to be named is the beginning and cause and end of every evil” (<a href="https://bibleox.com/en/en-nrsv/prs/14/#L27">Wis. 14:27</a>)</p></blockquote><blockquote><p>“for because they trust in lifeless idols they swear wicked oaths and expect to suffer no harm” (<a href="https://bibleox.com/en/en-nrsv/prs/14/#L29">Wis. 14:29</a>)</p></blockquote><blockquote><p>“I went out to meet the foreigner, and he cursed me by his idols” (<a href="https://bibleox.com/en/gr-lxx-byz/ps/151/#L6">Ps. 151:6, LXX</a>; translated from the Greek: ἐξῆλθον εἰς συνάντησιν τῷ ἀλλοφύλῳ, καὶ ἐπικατηράσατό με ἐν τοῖς εἰδώλοις αὐτοῦ)</p></blockquote>

