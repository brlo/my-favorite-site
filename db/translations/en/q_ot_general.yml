    body: |-
      <h2>The Covenant with Abraham</h2><h3>The Promise</h3><blockquote><p>“Now the LORD had said to Abram: ‘Get out of your country, from your family and from your father’s house, to a land that I will show you. <strong>I will make you a great nation</strong>; <strong>I will bless you</strong> and <strong>make your name great</strong>; and <strong>you shall be a blessing</strong>. <strong>I will bless those who bless you</strong>, and <strong>I will curse him who curses you</strong>; and <strong>in you all the families of the earth shall be blessed</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/12/#L1-3">Gen. 12:1-3</a>)</p></blockquote><h3>The Covenant</h3><blockquote><p>“As for Me, behold, My covenant is with you, and <strong>you shall be a father of many nations</strong>. No longer shall your name be called Abram, but your name shall be Abraham; for I have made you a father of many nations. I will make you exceedingly fruitful; and <strong>I will make nations of you</strong>, and <strong>kings shall come from you</strong>. And <strong>I will establish My covenant between Me and you and your descendants after you</strong> in their generations, <strong>for an everlasting covenant</strong>, <strong>to be God to you and your descendants</strong> after you. Also <strong>I give to you and your descendants after you the land</strong> in which you are a stranger, all the land of Canaan, <strong>as an everlasting possession</strong>; and <strong>I will be their God</strong>.” And God said to Abraham: “As for you, you shall keep My covenant, you and your descendants after you throughout their generations. This is My covenant which you shall keep, between Me and you and your descendants after you: <strong>Every male child among you shall be circumcised</strong>; and you shall be circumcised in the flesh of your foreskins, and <strong>it shall be a sign of the covenant between Me and you</strong>. He who is eight days old among you <strong>shall be circumcised, every male child in your generations</strong>, he who is born in your house or bought with money from any foreigner who is not your descendant. He who is born in your house and he who is bought with your money must be circumcised, and My covenant shall be in your flesh for an everlasting covenant. And the uncircumcised male child, who is not circumcised in the flesh of his foreskin, that person shall be cut off from his people; he has broken My covenant.” Then God said to Abraham, “As for Sarai your wife, you shall not call her name Sarai, but Sarah shall be her name. And I will bless her and also give you a son by her; then I will bless her, and she shall be a mother of nations; kings of peoples shall be from her” (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L4-16">Gen. 17:4-16</a>)</p></blockquote><h3>The Sinai Covenant</h3><blockquote><p>“Therefore say to the children of Israel: ‘I am the LORD; I will bring you out from under the burdens of the Egyptians, <strong>I will rescue you from their bondage</strong>, and I will redeem you with an outstretched arm and with great judgments. <strong>I will take you as My people</strong>, and <strong>I will be your God</strong>. Then you shall know that I am the LORD your God who brings you out from under the burdens of the Egyptians. And <strong>I will bring you into the land which I swore to give to Abraham, Isaac, and Jacob; and I will give it to you as a heritage</strong>: I am the LORD’” (<a href="https://bibleox.com/en/eng-nkjv/ish/6/#L6-8">Ex. 6:6-8</a>)</p></blockquote><h2>The Promise of the Coming of the Savior</h2><h3>To the First People</h3><blockquote><p>“So the LORD God said to the serpent: ‘Because you have done this, you are cursed more than all cattle, and more than every beast of the field; on your belly you shall go, and you shall eat dust all the days of your life. And <strong>I will put enmity between you and the woman, and between <mark>your seed and her Seed</mark></strong>; He shall bruise your head, and you shall bruise His heel’” (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L14-15">Gen. 3:14-15</a>)</p></blockquote><h3>To Abraham</h3><blockquote><p>“By Myself I have sworn, says the LORD, because you have done this thing, and have not withheld your son, your only son — <strong>blessing I will bless you, and multiplying I will multiply your descendants</strong> as the stars of the heaven and as the sand which is on the seashore; and <strong>your descendants shall possess the gate</strong> of their enemies. <strong><mark>In your seed all the nations of the earth shall be blessed</mark></strong>, because you have obeyed My voice” (<a href="https://bibleox.com/en/eng-nkjv/gen/22/#L16-18">Gen. 22:16-18</a>)</p></blockquote><h3>To Isaac</h3><blockquote><p>“Then the LORD appeared to him and said: ‘Do not go down to Egypt; live in the land of which I shall tell you. Dwell in this land, and <strong>I will be with you</strong> and <strong>bless you</strong>; for <strong>to you and your descendants I give all these lands</strong>, and I will perform the oath which I swore to Abraham your father. And <strong>I will make your descendants multiply</strong> as the stars of heaven; <strong>I will give to your descendants all these lands</strong>; and <strong><mark>in your seed all the nations of the earth shall be blessed</mark></strong>; because Abraham obeyed My voice and kept My charge, My commandments, My statutes, and My laws’” (<a href="https://bibleox.com/en/eng-nkjv/gen/26/#L2-5">Gen. 26:2-5</a>)</p></blockquote><h3>To Jacob</h3><blockquote><p>“I am the LORD God of Abraham your father and the God of Isaac; <strong>the land on which you lie I will give to you and your descendants</strong>. Also <strong>your descendants shall be as the dust of the earth</strong>; you shall spread abroad to the west and the east, to the north and the south; and <strong><mark>in you and in your seed all the families of the earth shall be blessed</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/28/#L13-14">Gen. 28:13-14</a>)</p></blockquote><h2>The Covenant with the People of Israel</h2><blockquote><p>“You have seen what I did to the Egyptians, and how I bore you on eagles’ wings and brought you to Myself. Now therefore, <strong><mark>if</mark> you will indeed obey My voice and keep My covenant, then you shall be a special treasure to Me above all people</strong>; for all the earth is Mine. &lt;...&gt; Then all the people answered together and said, ‘All that the LORD has spoken <strong>we will do</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/ish/19/#L4-5,8">Ex. 19:4-5,8</a>)</p></blockquote><blockquote><p>“But <strong>if you indeed obey His voice and do all that I speak</strong>, then I will be an enemy to your enemies and an adversary to your adversaries” (<a href="https://bibleox.com/en/eng-nkjv/ish/23/#L22">Ex. 23:22</a>)</p></blockquote><blockquote><p>“And they said, ‘All that the LORD has said <strong>we will do, and be obedient</strong>.’ And Moses took the blood, sprinkled it on the people, and said, ‘<strong>This is the blood of the covenant which the LORD has made with you</strong> according to all these words’” (<a href="https://bibleox.com/en/eng-nkjv/ish/24/#L7-8">Ex. 24:7-8</a>)</p></blockquote><h2>Israel’s Departures from God</h2><blockquote><p>“And the LORD said to Moses, ‘Go, get down! For your people whom you brought out of the land of Egypt have corrupted themselves. <strong>They have turned aside quickly out of the way which I commanded them</strong>. They have made themselves a molded calf, and worshiped it and sacrificed to it, and said, “This is your god, O Israel, that brought you out of the land of Egypt!”’” (<a href="https://bibleox.com/en/eng-nkjv/ish/32/#L7-8">Ex. 32:7-8</a>)</p></blockquote><blockquote><p>“For <strong>My people</strong> have committed two evils: <strong>they have forsaken Me, the fountain of living waters</strong>, and hewn themselves cisterns — broken cisterns that can hold no water” (<a href="https://bibleox.com/en/eng-nkjv/ier/2/#L13">Jer. 2:13</a>)</p></blockquote><blockquote><p>“<strong>My people</strong> ask counsel from their wooden idols, and their staff informs them. For the spirit of harlotry has caused them to stray, and <strong>they have played the harlot against their God</strong>. They offer sacrifices on the mountaintops, and burn incense on the hills, under oaks, poplars, and terebinths, because their shade is good. Therefore your daughters commit harlotry, and your brides commit adultery” (<a href="https://bibleox.com/en/eng-nkjv/os/4/#L12-13">Hos. 4:12-13</a>)</p></blockquote><blockquote><p>“The ox knows its owner and the donkey its master’s crib; but <strong>Israel does not know, My people do not consider</strong>. Alas, <strong>sinful nation, a people laden with iniquity, a brood of evildoers, children who are corrupters! They have forsaken the LORD, they have provoked to anger the Holy One of Israel</strong>, they have turned away backward. <strong>Why should you be stricken again? You will revolt more and more. The whole head is sick, and the whole heart faints. From the sole of the foot even to the head, there is no soundness in it</strong>, but wounds and bruises and putrefying sores; they have not been closed or bound up, or soothed with ointment” (<a href="https://bibleox.com/en/eng-nkjv/is/1/#L3-6">Is. 1:3-6</a>)</p></blockquote><blockquote><p>“O LORD, are not Your eyes on the truth? You have stricken them, but they have not grieved; You have consumed them, but <strong>they have refused to receive correction</strong>. They have made their faces harder than rock; <strong>they have refused to return</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ier/5/#L3">Jer. 5:3</a>)</p></blockquote><blockquote><p>“I overthrew some of you, as God overthrew Sodom and Gomorrah, and you were like a firebrand plucked from the burning; yet <strong>you have not returned to Me</strong>,” says the LORD” (<a href="https://bibleox.com/en/eng-nkjv/am/4/#L11">Amos. 4:11</a>)</p></blockquote><h3>God Warned for What He Would Drive Israel Out of the Promised Land</h3><h4>The Warning</h4><p>The Jewish people were warned that they were receiving the land promised by God not because of their righteousness. The former nations are driven out of God’s lands because the measure of their sins has overflowed. Israel, however, is brought into this land of God with the warning that if they sin in the same way, God will drive them too out of His land:</p><blockquote><p>“When the LORD your God brings you into the land which you go to possess, and <strong>has cast out many nations before you, the Hittites and the Girgashites and the Amorites and the Canaanites and the Perizzites and the Hivites and the Jebusites</strong>, seven nations greater and mightier than you” (<a href="https://bibleox.com/en/eng-nkjv/vtor/7/#L1">Deut. 7:1</a>; <a href="https://bibleox.com/en/eng-nkjv/nav/3/#L10">Josh. 3:10</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/3/#L8,17">Ex. 3:8,17</a>),</p><p>“<strong><mark>Do not think in your heart, after the LORD your God has cast them out before you, saying, ‘Because of my righteousness the LORD has brought me in to possess this land’</mark></strong>; but it is because of the wickedness of these nations that the LORD is driving them out from before you. <strong><mark>It is not because of your righteousness or the uprightness of your heart that you go in to possess their land</mark></strong>, <strong><mark>but because of the wickedness of these nations that the LORD your God drives them out from before you, and that He may fulfill the word which the LORD swore to your fathers, to Abraham, Isaac, and Jacob</mark></strong>. Therefore understand that <strong><mark>the LORD your God is not giving you this good land to possess because of your righteousness, for you are a stiff-necked people</mark></strong>. Remember! <strong>Do not forget how you provoked the LORD your God to wrath</strong> in the wilderness. From the day that you departed from the land of Egypt until you came to this place, you have been rebellious against the LORD. Also in Horeb you provoked the LORD to wrath, so that the LORD was angry enough with you <strong>to have destroyed you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/vtor/9/#L4-8">Deut. 9:4-8</a>)</p></blockquote><blockquote><p>“According to the doings of the land of Egypt, where you dwelt, you shall not do; and <strong>according to the doings of the land of Canaan, where I am bringing you, you shall not do</strong>; nor shall you walk in their ordinances. &lt;...&gt; <strong>Do not defile yourselves with any of these things; for by all these the nations are defiled, which I am casting out</strong> before you. For the land is defiled; therefore I visit the punishment of its iniquity upon it, and the land vomits out its inhabitants. <strong><mark>You shall therefore keep My statutes and My judgments</mark></strong>, and shall not commit any of these abominations, either any of your own nation or any stranger who dwells among you (for all these abominations the men of the land have done, who were before you, and thus the land is defiled), <strong><mark>lest the land vomit you out also when you defile it, as it vomited out the nations that were before you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/18/#L3,24-28">Lev. 18:3,24-28</a>)</p></blockquote><blockquote><p>“But it shall come to pass, <strong><mark>if you do not obey the voice of the LORD your God</mark></strong>, to observe carefully all His commandments and His statutes which I command you today, that all these curses will come upon you and overtake you. &lt;...&gt; <strong>If you do not carefully observe all the words of this law</strong> that are written in this book, that you may fear this glorious and awesome name, THE LORD YOUR GOD, &lt;...&gt; And it shall be, that just as the LORD rejoiced over you to do you good and multiply you, <strong>so the LORD will rejoice over you to destroy you and bring you to nothing; and <mark>you shall be plucked from off the land which you go to possess</mark>.</strong> Then the LORD will scatter you among all peoples, from one end of the earth to the other, and there you shall serve other gods, which neither you nor your fathers have known — wood and stone” (<a href="https://bibleox.com/en/eng-nkjv/vtor/28/#L15,58,63-64">Deut. 28:15,58,63-64</a>)</p></blockquote><h4>The People of Israel Acted Even Worse than the Nations Driven Out Before Them for Their Sins, and Were Also Driven Out</h4><blockquote><p>“But they paid no attention, and Manasseh seduced them <strong><mark>to do more evil than the nations whom the LORD had destroyed before the children of Israel</mark></strong>. And the LORD spoke by His servants the prophets, saying, ‘Because Manasseh king of Judah has done these abominations (<strong><mark>he has acted more wickedly than all the Amorites who were before him</mark></strong>, and has also made Judah sin with his idols)…’” (<a href="https://bibleox.com/en/eng-nkjv/4ts/21/#L9-11">2 Kin. 21:9-11</a>)</p></blockquote><blockquote><p>“Then it was so, after all your wickedness — ‘Woe, woe to you!’ says the Lord GOD — &lt;...&gt; You are the opposite of other women in your harlotry, because no one solicited you to be a harlot. In that you gave payment but no payment was given you, therefore you are the opposite. <strong>Now then, O harlot, hear the word of the LORD!</strong> &lt;...&gt; You are your mother’s daughter, loathing husband and children; and you are the sister of your sisters, who loathed their husbands and children; <strong>your mother was a Hittite and your father an Amorite. Your elder sister is Samaria, who dwells with her daughters to the north of you; and your younger sister, who dwells to the south of you, is Sodom and her daughters. </strong><strong><mark>You did not walk in their ways nor act according to their abominations; but, as if that were too little, you became more corrupt than they in all your ways</mark>.</strong> As I live, says the Lord GOD, <strong><mark>neither your sister Sodom nor her daughters have done as you and your daughters have done</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/iez/16/#L23,34-35,45-48">Ezek. 16:23,34-35,45-48</a>)</p></blockquote><p>Before the crucifixion of Jesus Christ, the greatest punishment the Jewish people received lasted about 70 years — the Babylonian captivity. But after the rejection and killing of Christ, the Jewish people were driven out of their land for ~2000 years, and the Temple has not been restored to this day.</p><h2>The End of the Old Covenant</h2><p><a href="https://bibleox.com/ru/ru/w/%D0%92%D0%B5%D1%82%D1%85%D0%B8%D0%B9-%D0%97%D0%B0%D0%B2%D0%B5%D1%82-%D0%BA%D0%BE%D0%BD%D0%B5%D1%86">The Old Testament — the End</a></p>

  - src: главное-в-законе
    path: Ml2w_The_Weightier_Matters_of_the_Law
    title: The Weightier Matters of the Law
    title_sub: Bible quotes about the main components of the Law of Moses
    meta_desc: 'Bible quotes about the main components of the Law of Moses: justice, mercy and faith'
    menu: { parent: Old Testament, title: The Weightier Matters of the Law, priority: 2 }
    body: |-
      <h2>The Main Things</h2><ul><li><p>Justice</p></li></ul><ul><li><p>Mercy</p></li></ul><ul><li><p>Faith</p></li></ul><h2>The Teaching of the Lord and God Jesus Christ</h2><blockquote><p>“Woe to you, scribes and Pharisees, hypocrites! For you pay tithe of mint and anise and cummin, and have neglected <strong>the weightier matters of the law</strong>: <strong>justice and mercy and faith</strong>. These you ought to have done, without leaving the others undone” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L23">Matt. 23:23</a>)</p></blockquote><blockquote><p>“Teacher, which is <strong>the great commandment in the law</strong>?” Jesus said to him, “‘<strong>You shall love the LORD your God</strong> with all your heart, with all your soul, and with all your mind.’ <strong>This is the first and great commandment</strong>. And the second is like it: ‘<strong>You shall love your neighbor as yourself.’ On these two commandments hang all the Law and the Prophets</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/22/#L36-40">Matt. 22:36-40</a>)</p></blockquote><h2>In the Apostles</h2><blockquote><p>“For <strong>all</strong> <strong>the law is fulfilled in one word, even in this: ‘You shall love your neighbor as yourself’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L14">Gal. 5:14</a>)</p></blockquote><h2>In the Prophets</h2><blockquote><p>“He has shown you, O man, what is good; and what does the LORD require of you but <strong>to do justly</strong>, <strong>to love mercy</strong>, and <strong>to walk humbly with your God</strong>?” (<a href="https://bibleox.com/en/eng-nkjv/mih/6/#L8">Mic. 6:8</a>)</p></blockquote><blockquote><p>“So you, by the help of your God, return; observe <strong>mercy</strong> and <strong>justice</strong>, and <strong>wait on your God</strong> continually” (<a href="https://bibleox.com/en/eng-nkjv/os/12/#L6">Hos. 12:6</a>)</p></blockquote><blockquote><p>“Hear the word of the LORD, you children of Israel, for the LORD brings a charge against the inhabitants of the land: ‘<strong>There is no truth</strong> <strong>or mercy</strong> <strong>or knowledge of God</strong> in the land’” (<a href="https://bibleox.com/en/eng-nkjv/os/4/#L1">Hos. 4:1</a>)</p></blockquote><blockquote><p>“For <strong>I desire mercy</strong> and not sacrifice, and <strong>the knowledge of God</strong> more than burnt offerings” (<a href="https://bibleox.com/en/eng-nkjv/os/6/#L6">Hos. 6:6</a>)</p></blockquote><blockquote><p>“Thus says the LORD of hosts: ‘<strong>Execute true justice</strong>, <strong>show mercy</strong> and compassion everyone to his brother’” (<a href="https://bibleox.com/en/eng-nkjv/zah/7/#L9">Zech. 7:9</a>)</p></blockquote><blockquote><p>“For <strong>the LORD loves justice</strong>, and does not forsake His saints; they are preserved forever, but the descendants of the wicked shall be cut off” (<a href="https://bibleox.com/en/eng-nkjv/ps/37/#L28">Ps. 37:28</a>)</p></blockquote><blockquote><p>“<strong>He loves righteousness and justice</strong>; the earth is full of the goodness of the LORD” (<a href="https://bibleox.com/en/eng-nkjv/ps/33/#L5">Ps. 33:5</a>)</p><p>In the Septuagint (<a href="https://bibleox.com/en/gr-lxx-byz/ps/32/#L5">Ps. 32:5, LXX</a>): ἀγαπᾷ ἐλεημοσύνην καὶ κρίσιν — “He loves <strong>mercy</strong> (almsgiving) and justice”.</p></blockquote><h2>Other</h2><blockquote><p>“But <strong>rather give alms</strong> of such things as you have; <strong>then indeed all things are clean to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L41">Luke. 11:41</a>)</p></blockquote><blockquote><p>“As water extinguishes a blazing fire, so <strong>almsgiving atones for sin</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/3/#L30">Sir. 3:30</a>)</p></blockquote>

  - src: 10-заповедей
    path: Tc4m_The_Ten_Commandments
    title: The Ten Commandments (the Decalogue)
