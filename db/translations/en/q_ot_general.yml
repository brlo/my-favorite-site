    path: Op1p_The_Old_Testament_Priesthood
    title: The Old Testament Priesthood
    meta_desc: Bible quotes about the Old Testament priesthood
    body: |-
      <h2>Consecration as a Priest</h2><h3>The Rite</h3><p>It is performed through anointing (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L41">Ex. 28:41</a>). For consecration sacred garments are required (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L2-3">Ex. 28:2-3</a>), which are handed on with the office (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29">Ex. 29:29</a>).</p><h3>Priests — Only the Descendants of Aaron</h3><p>Only Aaron (the brother of the prophet Moses) and his descendants could be priests (<a href="https://bibleox.com/en/eng-nkjv/ish/28/#L1">Ex. 28:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/28/#L4">Ex. 28:4</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/29/#L9">Ex. 29:9</a>). If an outsider undertook priestly service, he was to be put to death (<a href="https://bibleox.com/en/eng-nkjv/chis/3/#L10">Num. 3:10</a>).</p><h3>Requirements for a Candidate</h3><h4>A Priest Must Have No Bodily Defect</h4><blockquote><p>“Speak to Aaron, saying: ‘No man of your descendants in succeeding generations, who has any defect, may approach to offer the bread of his God. For <strong>any man who has a defect shall not approach</strong>: a man <strong>blind</strong> or <strong>lame</strong>, who has <strong>a marred face</strong> or any limb too long, a man who has <strong>a broken foot</strong> or <strong>broken hand</strong>, or is <strong>a hunchback</strong> or <strong>a dwarf</strong>, or a man who has <strong>a defect in his eye</strong>, or <strong>eczema</strong> or <strong>scab</strong>, or <strong>is a eunuch</strong>. No man of the descendants of Aaron the priest, who <strong>has a defect</strong>, shall come near to offer the offerings made by fire to the LORD. He has a defect; <strong>he shall not come near</strong> to offer the bread of his God’” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L17-21">Lev. 21:17-21</a>)</p></blockquote><h3>Obligations</h3><p>He must grow his hair and beard:</p><blockquote><p>“And the LORD said to Moses, ‘<strong>Speak to the priests, the sons of Aaron</strong>, and say to them: … They <strong>shall not</strong> <strong>make any bald place on their heads, nor shall they shave the edges of their beards</strong> nor make any cuttings in their flesh’” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1,5">Lev. 21:1,5</a>)</p></blockquote><p>He must not take a divorced woman as wife:</p><blockquote><p>“<strong>They shall not take a wife who is a harlot</strong> or <strong>a defiled woman</strong>, nor shall they take <strong>a woman divorced from her husband</strong>; for the priest is holy to his God” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L7">Lev. 21:7</a>)</p></blockquote><p>He must not touch the dead, although touching deceased relatives is allowed:</p><blockquote><p>“And the LORD said to Moses, ‘Speak to the priests, the sons of Aaron, and say to them: “<strong>None shall defile himself for the dead</strong> among his people, <strong>except for his relatives who are nearest to him</strong>: his mother, his father, his son, his daughter, and his brother; also his virgin sister who is near to him, who has had no husband, <strong>for her he may defile himself</strong>. <strong>Otherwise he shall not defile himself</strong>, being a chief man among his people, to profane himself”’” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1-4">Lev. 21:1-4</a>)</p></blockquote><h3>Obligations of the High Priest</h3><p>The high priest may not touch even his deceased relatives:</p><blockquote><p>“<strong>He who is the high priest</strong> among his brethren, on whose head the anointing oil was poured and who is consecrated to wear the garments, shall not uncover his head nor tear his clothes; <strong>nor shall he go near any dead body, nor defile himself for his father or his mother</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L10-11">Lev. 21:10-11</a>)</p></blockquote><p>His wife must be a virgin who has not been married:</p><blockquote><p>“<strong>And he shall take a wife in her virginity. A widow or a divorced woman or a defiled woman or a harlot — these he shall not marry; but he shall take a virgin of his own people as wife</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L13-14">Lev. 21:13-14</a>)</p></blockquote><p>He must keep his head covered:</p><blockquote><p>“He who is the high priest among his brethren, on whose head the anointing oil was poured and who is consecrated to wear the garments, <strong>shall not uncover his head</strong> nor tear his clothes” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L10">Lev. 21:10</a>)</p></blockquote>
