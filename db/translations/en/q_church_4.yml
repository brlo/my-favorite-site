      <h2>The High Priest Caiaphas</h2><p>Through a man seeking to kill Christ, a prophecy is uttered — not from himself, but only because he was high priest that year:</p><blockquote><p>“And one of them, <strong><mark>Caiaphas</mark></strong>, being high priest that year, said to them, ‘You know nothing at all, nor do you consider that <strong>it is expedient for us that one man should die for the people, and not that the whole nation should perish.’ Now <mark>this he did not say on his own authority; but being high priest that year he prophesied</mark> that Jesus would die for the nation</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/11/#L49-51">John. 11:49-51</a>)</p></blockquote><h2>Judas Iscariot</h2><blockquote><p>“And <strong>when He had called His twelve disciples</strong> to Him, He <strong><mark>gave them power over unclean spirits, to cast them out, and to heal all kinds of sickness and all kinds of disease</mark></strong>. Now the names of the twelve apostles are these: first, Simon, who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother; Philip and Bartholomew; Thomas and Matthew the tax collector; James the son of Alphaeus, and Lebbaeus, whose surname was Thaddaeus; Simon the Cananite, and <strong><mark>Judas</mark> Iscariot</strong>, who also betrayed Him. These twelve Jesus sent out and commanded them, saying: &lt;...&gt; ‘<strong>Heal the sick, cleanse the lepers, raise the dead, cast out demons</strong>. Freely you have received, freely give’” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L1-5,8">Matt. 10:1-5,8</a>)</p></blockquote><blockquote><p>“But one of His disciples, <strong><mark>Judas</mark> Iscariot, Simon’s son</strong>, who would betray Him, said, &lt;...&gt; This he said, not that he cared for the poor, but because he <strong><mark>was a thief</mark></strong>, and had the money box; and he used to take what was put in it” (<a href="https://bibleox.com/en/eng-nkjv/in/12/#L4,6">John. 12:4,6</a>)</p></blockquote><h2>God’s Faithfulness Is Above Human Unfaithfulness</h2><blockquote><p>“For what if <strong>some did not believe? Will their unbelief make the faithfulness of God without effect? Certainly not!</strong> Indeed, let God be true but every man a liar. As it is written: ‘That You may be justified in Your words, and may overcome when You are judged’” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L3-4">Rom. 3:3-4</a>)</p></blockquote><h2>The Responsibility of the Priest</h2><blockquote><p>“For everyone to whom much is given, from him much will be required; and <strong>to whom much has been committed, of him they will ask the more</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L48">Luke. 12:48</a>)</p></blockquote>

