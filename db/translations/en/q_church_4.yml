      <p>The choosing of widows for service in the Church:</p><blockquote><p>“Do not let a widow under sixty years old be taken into the number, and not unless she has been <strong>the wife</strong> <strong>of one</strong> <strong>man</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L9">1 Tim. 5:9</a>)</p></blockquote><p>More (in Russian):</p><ul><li><p><a href="https://azbyka.ru/otechnik/Mihail_Zheltov/tserkovnoe-blagoslovenie-povtornyh-brakov/">https://azbyka.ru/otechnik/Mihail_Zheltov/tserkovnoe-blagoslovenie-povtornyh-brakov/</a></p></li></ul>
    body: |-
      <h2>The Christian Ideal</h2><p>The Christian ideal is a single marriage forever.</p><h2>Condescension for the Laity</h2><p>If a wife or husband dies, then although a new marriage is not encouraged (for Christians believe in the life after death and the general resurrection of the dead), it is allowed as a measure of condescension, voiced by the apostle, so that a person would not fall into some grave sins and then perish altogether:</p><blockquote><p>“But <strong>I say to</strong> the unmarried and to <strong>the widows</strong>: It is good for them if they remain even as I am; but <strong>if they cannot exercise self-control, let them marry. For <mark>it is better to marry than to burn with passion</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L8-9">1 Cor. 7:8-9</a>)</p></blockquote><blockquote><p>“Therefore I desire <strong>that the younger widows marry</strong>, bear children, manage the house, give no opportunity to the adversary to speak reproachfully” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L14">1 Tim. 5:14</a>)</p></blockquote><p>The Savior too, speaking of the prohibition of divorce, makes an exception for the case of fornication (adultery):</p><blockquote><p>“Furthermore it has been said, ‘Whoever divorces his wife, let him give her a certificate of divorce.’ But I say to you that whoever divorces his wife <strong>for any reason except sexual immorality</strong> causes her to commit adultery; and whoever marries a woman who is divorced commits adultery” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L31-32">Matt. 5:31-32</a>) <a href="https://azbyka.ru/biblia/in/?Mt.5:32">*</a></p></blockquote><p>Thus, if a spouse has died or been unfaithful, a new marriage is possible. But still not endlessly, only as a measure of condescension: only two additional times.</p><p>To these reasons, by similar reasoning, the Church added some other reasons as well, such as a threat to life from the spouse and <a href="https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/#0_10_3">the like</a> (in Russian).</p><h2>A Man in a Single Marriage Must Be Chosen for the Priesthood</h2><p>This is worth mentioning in order to see that remaining in one marriage is indeed considered a more worthy way of life:</p><blockquote><p>“A <strong>bishop</strong> then <strong>must be blameless, the husband of one</strong> <strong>wife</strong>, temperate, sober-minded, of good behavior, hospitable, able to teach” (<a href="https://bibleox.com/en/eng-nkjv/1tim/3/#L2">1 Tim. 3:2</a>)</p></blockquote><blockquote><p>“Let <strong>deacons be</strong> <strong>the husbands</strong> <strong>of one</strong> <strong>wife</strong>, ruling their children and their own houses well” (<a href="https://bibleox.com/en/eng-nkjv/1tim/3/#L12">1 Tim. 3:12</a>)</p></blockquote><blockquote><p>“For this reason I left you in Crete, that you should set in order the things that are lacking, and <strong>appoint elders</strong> <em>(Greek: πρεσβυτέρους — “presbyters”)</em> <strong>in every city</strong> as I commanded you — <strong>if a man is blameless, the husband of one wife</strong>, having faithful children not accused of dissipation or insubordination” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L5-6">Titus. 1:5-6</a>)</p></blockquote>
