  - src: анания-и-сапфира
    path: As9k_Ananias_and_Sapphira
    title: Ananias and Sapphira
    meta_desc: Bible quotes on understanding the punishment of Ananias and Sapphira
    menu: { parent: Church, title: Ananias and Sapphira, priority: 28 }
    body: |-
      <p>At the beginning of the life of the Church the Lord watches with special strictness over the purity of life in it. Thus, for an attempt to lie to the Church, a husband and wife (Ananias and Sapphira) fall dead at the word of the apostle:</p><blockquote><p>“But a certain man named <strong>Ananias</strong>, with <strong>Sapphira</strong> his wife, <strong>sold a possession. And he kept back part of the proceeds</strong>, his wife also being aware of it, and brought a certain part and laid it at the apostles’ feet. But Peter said, ‘<strong>Ananias, why has Satan filled your heart to lie to the Holy Spirit and keep back part of the price of the land for yourself?</strong> While it remained, was it not your own? And after it was sold, was it not in your own control? Why have you conceived this thing in your heart? <strong>You have not lied to men but to God.’ Then Ananias, hearing these words, fell down and breathed his last</strong>. So great fear came upon all those who heard these things. And the young men arose and wrapped him up, carried him out, and buried him. Now it was about three hours later when his wife came in, not knowing what had happened. And Peter answered her, ‘Tell me whether you sold the land for so much?’ She said, ‘Yes, for so much.’ Then Peter said to her, ‘How is it that you have agreed together to test the Spirit of the Lord? Look, the feet of those who have buried your husband are at the door, and they will carry you out.’ Then immediately <strong>she fell down at his feet and breathed her last. And the young men came in and found her dead, and carrying her out, buried her by her husband</strong>. So great fear came upon all the church and upon all who heard these things” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L1-11">Act. 5:1-11</a>)</p></blockquote><p>So it was also with the Old Testament church. At the beginning of the life of that church, a man was punished with death for violating the Sabbath rest:</p><blockquote><p>“Now while the children of Israel were in the wilderness, <strong>they found a man gathering sticks on the Sabbath day</strong>. And those who found him gathering sticks brought him to Moses and Aaron, and to all the congregation. They put him under guard, because it had not been explained what should be done to him. Then <strong>the LORD said to Moses, ‘The man must surely be put to death</strong>; all the congregation shall stone him with stones outside the camp.’ So, as the LORD commanded Moses, all the congregation brought him outside the camp and stoned him with stones, and he died” (<a href="https://bibleox.com/en/eng-nkjv/chis/15/#L32-36">Num. 15:32-36</a>)</p></blockquote><p>Although later the Jews repeatedly violated the Sabbaths (<a href="https://bibleox.com/en/eng-nkjv/neem/13/#L15-16,18">Neh. 13:15-16,18</a>; <a href="https://bibleox.com/en/eng-nkjv/iez/20/#L13,16,21,24">Ezek. 20:13,16,21,24</a>; <a href="https://bibleox.com/en/eng-nkjv/iez/22/#L8">Ezek. 22:8</a>; <a href="https://bibleox.com/en/eng-nkjv/iez/23/#L38">Ezek. 23:38</a>), even the priests (<a href="https://bibleox.com/en/eng-nkjv/iez/22/#L26">Ezek. 22:26</a>), yet instead of instant deadly punishment, attempts were made to prevent the violation of the Sabbaths:</p><blockquote><p>“So it was, at the gates of Jerusalem, as it began to be dark before the Sabbath, that <strong>I commanded the gates to be shut, and charged that they must not be opened till after the Sabbath</strong>. Then I posted some of my servants at the gates, <strong>so that no burdens would be brought in on the Sabbath day</strong>. Now the merchants and sellers of all kinds of wares lodged outside Jerusalem once or twice. Then I warned them, and said to them, ‘Why do you spend the night around the wall? If you do so again, I will lay hands on you!’ From that time on they came no more on the Sabbath. And <strong>I commanded the Levites that they should cleanse themselves, and that they should go and guard the gates, to sanctify the Sabbath day</strong>” (<a href="https://bibleox.com/en/eng-nkjv/neem/13/#L19-22">Neh. 13:19-22</a>)</p></blockquote><blockquote><p>“Thus <strong>the LORD said to me</strong>: ‘Go and <strong>stand in the gate of the children of the people</strong>, by which the kings of Judah come in and by which they go out, and in all the gates of Jerusalem; and say to them, “Hear the word of the LORD, you kings of Judah, and all Judah, and <strong>all the inhabitants of Jerusalem, who enter by these gates</strong>. Thus says the LORD: <strong>Take heed to yourselves, and bear no burden on the Sabbath day, nor bring it in by the gates of Jerusalem; nor carry a burden out of your houses on the Sabbath day, nor do any work, but hallow the Sabbath day, as I commanded your fathers</strong>”’” (<a href="https://bibleox.com/en/eng-nkjv/ier/17/#L19-22">Jer. 17:19-22</a>)</p></blockquote>

