      <h2>Summary Comparison Table</h2><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>Timothy</strong> (the city of Ephesus, 1 Tim. 1:3)</p><p>(<a href="https://bibleox.com/en/eng-nkjv/1tim/3/#L1-13"><u>1 Tim. 3:1-13</u></a>)</p></td><td><p><strong>Titus</strong> (the island of Crete, Titus 1:5)</p><p>(<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L5-9"><u>Titus. 1:5-9</u></a>)</p></td></tr><tr><td><p>blameless</p></td><td><p>blameless</p><p>blameless, as a steward of God</p></td></tr><tr><td><p>the husband of one wife</p></td><td><p>the husband of one wife</p></td></tr><tr><td><p>temperate</p></td><td><p>self-controlled</p></td></tr><tr><td><p>sober-minded</p></td><td><p>sober-minded</p></td></tr><tr><td><p>of good behavior</p></td><td><p>holy</p></td></tr><tr><td><p> </p></td><td><p>just</p></td></tr><tr><td><p>hospitable</p></td><td><p>hospitable</p></td></tr><tr><td><p>able to teach</p></td><td><p>holding fast the faithful word as he has been taught, that he may be able, by sound doctrine, both to exhort and convict those who contradict</p></td></tr><tr><td><p>not given to wine</p></td><td><p>not given to wine</p></td></tr><tr><td><p>not violent</p></td><td><p>not violent</p></td></tr><tr><td><p>not quarrelsome</p></td><td><p>not self-willed</p></td></tr><tr><td><p>not greedy for money, but</p></td><td><p>not greedy for money</p></td></tr><tr><td><p>gentle</p></td><td><p>not quick-tempered</p></td></tr><tr><td><p>not covetous</p></td><td><p> </p></td></tr><tr><td><p>one who rules his own house well</p></td><td><p> </p></td></tr><tr><td><p>having his children in submission with all reverence (for if a man does not know how to rule his own house, how will he take care of the church of God?)</p></td><td><p>having faithful children not accused of dissipation or insubordination</p></td></tr><tr><td><p>not a novice, lest being puffed up with pride he fall into the same condemnation as the devil</p></td><td><p> </p></td></tr><tr><td><p>he must have a good testimony among those who are outside, lest he fall into reproach and the snare of the devil</p></td><td><p>a lover of what is good</p></td></tr></tbody></table><h2>Quotes</h2><blockquote><p>“This is a faithful saying: If a man desires the position of a bishop, he desires a good work.</p><p>A <strong>bishop</strong> then must be:</p><ul><li><p>blameless,</p></li><li><p>the husband of one wife,</p></li><li><p>temperate,</p></li><li><p>sober-minded,</p></li><li><p>of good behavior,</p></li><li><p>hospitable,</p></li><li><p>able to teach;</p></li><li><p>not given to wine,</p></li><li><p>not violent,</p></li><li><p>not greedy for money, but</p></li><li><p>gentle,</p></li><li><p>not quarrelsome,</p></li><li><p>not covetous;</p></li><li><p>one who rules his own house well,</p></li><li><p>having his children in submission with all reverence (for if a man does not know how to rule his own house, how will he take care of the church of God?);</p></li><li><p>not a novice, lest being puffed up with pride he fall into the same condemnation as the devil.</p></li><li><p>Moreover he must have a good testimony among those who are outside, lest he fall into reproach and the snare of the devil.</p></li></ul><p>Likewise <strong>deacons</strong> must be:</p><ul><li><p>reverent,</p></li><li><p>not double-tongued,</p></li><li><p>not given to much wine,</p></li><li><p>not greedy for money,</p></li><li><p>holding the mystery of the faith with a pure conscience.</p></li><li><p>But let these also first be tested; then let them serve as deacons, being found blameless.</p></li></ul><p>Likewise, <strong>their wives</strong> must be:</p><ul><li><p>reverent,</p></li><li><p>not slanderers,</p></li><li><p>temperate,</p></li><li><p>faithful in all things.</p></li></ul><p>Let <strong>deacons</strong> be:</p><ul><li><p>the husbands of one wife,</p></li><li><p>ruling their children and their own houses well.</p></li></ul><p>For those who have served well as deacons obtain for themselves a good standing and great boldness in the faith which is in Christ Jesus”</p><p>(<a href="https://bibleox.com/en/eng-nkjv/1tim/3/#L1-13">1 Tim. 3:1-13</a>)</p></blockquote><blockquote><p>“For this reason I left you in Crete, that you should set in order the things that are lacking, and appoint <strong>elders</strong> <em>(Greek: πρεσβυτέρους — “presbyters”)</em> in every city as I commanded you — if a man is:</p><ul><li><p>blameless,</p></li><li><p>the husband of one wife,</p></li><li><p>having faithful children not accused of dissipation or insubordination.</p></li></ul><p>For a <strong>bishop</strong> must be:</p><ul><li><p>blameless, as a steward of God,</p></li><li><p>not self-willed,</p></li><li><p>not quick-tempered,</p></li><li><p>not given to wine,</p></li><li><p>not violent,</p></li><li><p>not greedy for money,</p></li><li><p>but hospitable,</p></li><li><p>a lover of what is good,</p></li><li><p>sober-minded,</p></li><li><p>just,</p></li><li><p>holy,</p></li><li><p>self-controlled,</p></li><li><p>holding fast the faithful word as he has been taught, that he may be able, by sound doctrine, both to exhort and convict those who contradict”</p></li></ul><p>(<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L5-9">Titus. 1:5-9</a>)</p></blockquote>

