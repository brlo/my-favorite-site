- src: wJ4g52lV_Непрерывность_священства
  path: Continuity-of-the-priesthood
  title: The continuity of the priesthood
  menu:
    parent: Sacraments of the Church/Priesthood
    title: The continuity of the priesthood
    priority: 10
  body: '<h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p><em>But
    if the flock is one, how can he be numbered among the flock who is not in the
    number of the flock? Or </em><strong><em>how can he be esteemed a pastor, who,—while
    the true shepherd remains and presides over the Church of God <mark>by successive
    ordination,</mark>—<mark>succeeding to no one, and beginning from himself</mark>,
    becomes a stranger and a profane person, an enemy of the Lord’s peace and of the
    divine unity, not dwelling in the house of God, that is, in the Church of God,
    in which none dwell except they are of one heart and one mind</em></strong><em>,
    since the Holy Spirit speaks in the Psalms, and says, “It is God who maketh men
    to dwell of one mind in a house.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Magnus-on-Baptizing-the-Novatians-and-Those-Who-Obtain-Grace-on-a-Sick-Bed">Epistle
    LXXV: To Magnus, on Baptizing the Novatians, and Those Who Obtain Grace on a Sick-Bed</a>;
    Ps. 68:6)</p><h2>4th century</h2><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>Amos
    6:2–6: “<strong><em>you drink strained wine, you anoint yourselves with the finest
    ointments</em></strong><em> and are not at all grieved for the affliction of Joseph”
    </em></p><p><em>&lt;…&gt; </em></p><p>The words that follow — <strong>“they drink
    strained wine” — can be referred specifically to heretics, to heretics who approve
    some of the Scriptures and reject others</strong>, wishing to drink strained wine,
    whereas in the Holy Scriptures there is nothing turbid or muddy, but everything
    in them is like the upper parts of the purest liquid. <strong>Those anoint themselves
    with the finest ointments who, lacking the art of using ointments, <mark>being
    strangers</mark> to the knowledge of the Scriptures, the traditions, and the teaching
    of the apostles, <mark>appropriate to themselves the dignity of the priesthood
    and call themselves the Lord’s anointed</mark>, polluting the purest oil with
    the dregs of their own understanding</strong>. And doing this to the destruction
    of those whom they have seduced, they do not grieve at all, but rejoice in another’s
    death and take pleasure in the blood of the unfortunate.</p></blockquote><p>(Commentary
    on the Book of the Prophet Amos: Amos 6:2–6)</p>'
