- src: hgDc_Еретики_прикрываются_именем_Иисуса
  path: Heretics-hide-behind-the-name-of-Jesus
  title: Heretics hide behind the name of Jesus
  menu:
    parent: Awaiting distribution
    title: Heretics hide behind the name of Jesus
    priority: 13
  body: '<h2>Holy Scripture</h2><blockquote><p>“And He said: ‘Take heed that you not
    be deceived. For <strong><mark>many will come in My name</mark></strong>, saying,
    “I am He,” and, “The time has drawn near.” Therefore do not go after them.’” (<a
    href="https://bibleox.com/en/eng-nkjv/lk/21/#L8">Luke 21:8</a>)</p></blockquote><blockquote><p>“For
    <strong><mark>many will come in My name</mark></strong>, saying, ‘I am the Christ,’
    and will deceive many” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L5">Matt.
    24:5</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/13/#L6">Mark 13:6</a>)</p></blockquote><h2>1st
    century</h2><h3><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus">St
    Ignatius the God-bearer, bishop of Antioch, hieromartyr (c. 35–107)</a></h3><blockquote><p>“I
    therefore, yet not I, but the love of Jesus Christ, entreat you that ye use Christian
    nourishment only, and abstain from herbage of a different kind; I mean heresy.
    <strong>For <mark>those [that are given to this] mix up Jesus Christ</mark> with
    their own poison, speaking things which are unworthy of credit, like those who
    administer a deadly drug in sweet wine</strong>, which he who is ignorant of does
    greedily take, with a fatal pleasure leading to his own death.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-6">To Trallians, 6</a>)</p><h2>2nd
    century</h2><h3><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr">St
    Justin the Philosopher, martyr (c. 100–165)</a></h3><blockquote><p><em>And I replied,
    </em><strong><em><mark>The fact that there are such men confessing themselves
    to be Christians, and admitting the crucified Jesus to be both Lord and Christ,
    yet not teaching His doctrines, but those of the spirits of error</mark></em></strong><em>,
    causes us who are disciples of the true and pure doctrine of Jesus Christ, to
    be more faithful and stedfast in the hope announced by Him.</em></p><p><em>&lt;…&gt;</em></p><p><strong><em><mark>There
    are, therefore, and there were many, my friends, who, coming forward in the name
    of Jesus, taught both to speak and act impious and blasphemous things; and these
    are called by us after the name of the men from whom each doctrine and opinion
    had its origin</mark></em></strong><em>. For some in one way, others in another,
    teach to blaspheme the Maker of all things, and Christ, who was foretold by Him
    as coming, and the God of Abraham, and of Isaac, and of Jacob, </em><strong><em><mark>with
    whom we have nothing in common, since we know them to be atheists, impious, unrighteous,
    and sinful, and confessors of Jesus in name only, instead of worshippers of Him</mark></em></strong><em>.
    Yet they style themselves </em><strong><em>Christians, just as certain among the
    Gentiles inscribe the name of God upon the works of their own hands, and partake
    in nefarious and impious rites</em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-35">Dialogue
    with Trypho, 35</a>)</p><h3><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon">St
    Irenaeus of Lyons, hieromartyr (c. 130–202)</a></h3><blockquote><p>But since this
    man is the only one who has dared openly to mutilate the Scriptures, and unblushingly
    above all others to inveigh against God, I purpose specially to refute him, convicting
    him out of his own writings; and, with the help of God, <strong>I shall overthrow
    him out of those discourses of the Lord and the apostles, which are of authority
    with him, and of which he makes use</strong>. At present, however, I have simply
    been led to mention him, that thou mightest know that all those who in any way
    corrupt the truth, and injuriously affect the preaching of the Church, are the
    disciples and successors of Simon Magus of Samaria. Although <strong>they do not
    confess the name of their master, in order all the more to seduce others, yet
    they do teach his doctrines. They <mark>set forth, indeed, the name of Christ
    Jesus as a sort of lure</mark>, but in various ways they introduce the impieties
    of Simon; and thus they destroy multitudes, wickedly disseminating their own doctrines
    by the use of a good name, and, through means of its sweetness and beauty, extending
    to their hearers the bitter and malignant poison of the serpent, the great author
    of apostasy</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-27">Against
    Heresies, Book I, chapter 27</a>)</p><h2>4th century</h2><h3>Cyril of Jerusalem,
    bishop (315–386)</h3><blockquote><p>since there are many that make spoil through
    philosophy and vain deceit (Col. 2:8). The Greeks on the one hand draw men away
    by their smooth tongue, for honey droppeth from a harlot’s lips (Prov. 5:3): whereas
    they of the Circumcision deceive those who come to them by means of the Divine
    Scriptures, which they miserably misinterpret though studying them from childhood
    to old age, and growing old in ignorance. <strong><em>But the children of heretics,
    by their good words and smooth tongue, <mark>deceive the hearts of the innocent,
    disguising with the name of Christ</mark></em></strong><em> as it were with honey
    the poisoned arrows of their impious doctrines: concerning all of whom together
    the Lord saith, Take heed lest any man mislead you (Matt. 24:4). </em>This is
    the reason for the teaching of the Creed and for expositions upon it.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1#HH-On-the-Ten-Points-of-Doctrine">Catechetical
    Lectures, Lecture 4</a>; “children of heretics” — that is, their followers)</p><h3>Epiphanius
    of Cyprus, bishop (c. 315–403)</h3><blockquote><p>So <strong><mark>Simon</mark>
    (the sorcerer — note)</strong>, having his understanding disordered by the demonic
    deceit of magic, and having become a visionary, being always ready by his sorcery
    to display the barbarous deeds of his own and demonic wickedness, having come
    forth into the midst, and <strong><mark>under the covering of the name of Christ</mark>,
    as if mixing honey with hellebore, having given poison to those caught in his
    pernicious error, by the dignity of the name of Christ <mark>caused death to those
    who believed</mark></strong>.</p></blockquote><p>(Panarion, on the Simonians,
    ch. 2)</p><h3>Serapion of Thmuis, bishop (early 4th c. – after 362)</h3><blockquote><p>And
    since a multitude of wolves in sheep’s clothing has now appeared, let pastoral
    knowledge not be silent, but, defending the flock and guarding it, let it bare
    the sword of the word, granting the sheep safety and exposing the snares of the
    predators. For behold, <strong><mark>many have already gone out and wander everywhere,
    covering themselves with the name of Christ instead of a sheep’s skin, calling
    themselves what they are not, and not enduring to be called what they are in deed</mark></strong>.
    They hide their wickedness under the mask of the name of Christ, but, although
    they share this name, with all their soul they strive to destroy the name of Christ,
    fighting against Jesus while bearing His name. This is the most terrible wickedness,
    for they bear the name of Christ but fight against Christ. And since evil has
    grown weak in open struggle against God, it uses His very name, in order, having
    instilled in the foolish the thought that it belongs to Christ, to harm where
    it wishes those who have believed in the Saviour. Here Valentinus came forward,
    there Marcion, in another place Sotion, and at the end appeared the abortion of
    evil — the Manichaean madness</p><p>&lt;…&gt;</p><p>For even if they agree with
    the Gospels, it is not because they confess their truth, but <strong>because the
    name of Jesus is glorified, and they pretend to honour Him, in order to draw those
    who honour Him whither they wish</strong>.</p></blockquote><p>(Against the Manichaeans,
    3, 36)</p><h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p>You
    see that under the name of Christ one who is not the Lord Christ at all can be
    preached. And you rushed indiscriminately to this shouter, for the sake of the
    fact that he <strong><mark>covered his lie with the name of Christ</mark></strong>.
    Do you think that what was said does not apply to him: “<strong>Many will come
    in My name</strong>… and will deceive many” (Matt. 24:5)?</p><p>&lt;…&gt;</p><p>…
    I fear for you, lest someone corrupt your minds, as the serpent once deceived
    Eve by his cunning. You are so eager for new teachings that, if someone came to
    you and began to preach another Jesus, you would at once take his side, having
    received him favourably (2 Cor. 11:2–4). And what the Apostle feared in the Corinthians
    is now happening among you. A shouter came, began to preach another Jesus, and
    you were drawn to him. <strong>You will say: “No, indeed — what other Jesus is
    there here? Why, everything he says he takes from the Gospel and teaches with
    the words of the Gospel…”</strong></p><p>&lt;…&gt;</p><p>The Galatians sincerely
    believed in the Lord Saviour and with all their soul received the joyful tidings
    of salvation in Him; and they were so grateful to St Paul for enlightening them
    with the truth that they were ready to pluck out their own eyes and give them
    to him. But, <strong>after St Paul had departed from them, certain vain-minded
    men came, also with a Gospel, or tidings, but not a pure one, rather mixed with
    a lie, and began to re-teach them</strong>. The Galatians, not examining the matter
    strictly but only being carried away by the name of the tidings, received these
    preachers, and fell into the nets of a lie. Their word seemed an attractive gospel,
    but in the essence of the matter it was a pernicious evil tidings. So seductive
    is a lie that covers itself with sacred and sweet names!</p></blockquote><p>(Letter
    8. The first letter to St Petersburg about the heresy there)</p>

    '
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
