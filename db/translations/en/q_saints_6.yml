- src: Икономия
  path: Economy-oikonomia
  title: Economy (oikonomia)
  menu:
    parent: Awaiting distribution
    title: Economy (oikonomia)
    priority: 50
  body: "<h2>5th century</h2><h3>St Cyril of Alexandria, archbishop (376–444)</h3><blockquote><p>Economy
    for the sake of certain circumstances occurs when for a short time one disregards
    what is due, setting something aside in order to gain something greater.</p></blockquote><p>(<em>St
    Cyril of Alexandria</em>, Ep. 56 // PG 77, col. 320; oikonomia)</p><h2>8th century</h2><h3>St
    Theodore the Studite, monk (c. 759–826)</h3><blockquote><p>Now we, making use
    of economy, affirm the following two positions: either let the deposed one cease
    to serve, and we will immediately enter into communion with the holy patriarch,
    which would indeed be beneficial; or, if this is not accepted, we will remain
    in the same restraint as before, leaving the judgment of this matter to the Lord.
    But anything beyond this will be, forgive me, no longer economy, but the guilt
    of lawlessness and the transgression of the divine canons. For <strong>the limit
    of economy, as you know, consists in neither completely violating some ordinance,
    nor going to an extreme and causing harm to what is most important, when a small
    concession can be made according to the time and circumstances, so as thus more
    easily to attain what is desired</strong>.</p></blockquote><p>(Letter 24. To the
    magistros Theoctistus (I, 24))</p><h2>20th century</h2><h3>St Paisios of Mount
    Athos (Eznepidis), monk (1924–1994)</h3><blockquote><p>If a confessor uses the
    canons as cannons, that is, without discernment, not taking into account the concrete
    person, the measure and manner of his repentance, and the like, then instead of
    healing souls he will commit crimes.</p></blockquote><p>(Words, vol. 3, The Spiritual
    Struggle // Η χρήση των επιτιμίων)</p><p>Greek:</p><blockquote><p>Αν ο πνευματικός
    χρησιμοποιή τους κανόνες σάν... κανόνια, και όχι με διάκριση, ανάλογα με τον άνθρωπο,
    με την μετάνοια που έχει κ.λπ., αντί να θεραπεύη ψυχές, θα εγκληματή.</p></blockquote><p>(Words,
    vol. 3, The Spiritual Struggle // Η χρήση των επιτιμίων)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: Запрет_молиться_с_еретиками_каноны
  path: Prohibition-of-joint-prayer
  title: The prohibition of joint prayer with heretics (canons)
  menu:
    parent: Awaiting distribution
    title: The prohibition of joint prayer with heretics (canons)
    priority: 25
  body: '<h2>The canons</h2><blockquote><p>Let a bishop, presbyter, or deacon, who
    has only prayed with heretics, be excommunicated: but if he has permitted them
    to perform any clerical office, let him be deposed.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-holy-apostles">The
    45th Apostolic Canon</a>)</p><blockquote><p>If any clergyman or layman enters
    a Jewish synagogue or a heretical assembly to pray, let him be deposed and excommunicated.</p></blockquote><p>(The
    65th Apostolic Canon)</p><blockquote><p>No one shall join in prayers with heretics
    or schismatics.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-councils-of-ancyra-neocaesarea-gangra-antioch-and-laodicea-5#HH-Canon-XXXIII">The
    33rd Canon of the Council of Laodicea</a>)</p><h2>A video with details on this
    question</h2><p><a href="https://rutube.ru/video/86f09aac3920a287aaf041a3ffe019b2/?t=138&amp;r=plwd">https://rutube.ru/video/86f09aac3920a287aaf041a3ffe019b2/?t=138&amp;r=plwd</a></p><h2>The
    question of prayer before a meal when visiting heretics</h2><p>A question from
    an Orthodox Christian (formerly a Protestant):</p><blockquote><p>Brothers, tell
    me what to do: for example, I often have to visit my former Protestant friends
    and sit down with them at a meal, before which they pray and sometimes ask me
    to pray too — am I sinning by this?</p></blockquote><p>The answer of the clergyman,
    priest Evgeny Veselov:</p><blockquote><p>You should say beforehand that it is
    not possible to pray together, but that out of respect you are ready simply to
    stand during their prayer. At the end, do not say “amen.”</p><p>If convenient,
    after their prayer read the “Our Father” yourself. Or at least simply say “Lord,
    bless” and cross yourself. You can also make the sign of the cross over the food,
    if the hosts do not object.</p></blockquote><p>(October 12, 2024)</p>'
