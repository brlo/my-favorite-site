    parent: The soul and the state of the departed
    title: The immortality of the soul
    priority: 3
  body: '<h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><em>And
    that which was said out of the bush to Moses, </em><strong><em>“I am that I am,
    the God of Abraham, and the God of Isaac, and the God of Jacob, and the God of
    your fathers,” this signified that <mark>they, even though dead, are still in
    existence, and are men belonging to Christ Himself.</mark></em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-63">Apology
    1</a>)</p><p>The Elder (who converted Justin to Christianity):</p><blockquote><p><em>The
    soul assuredly is or has life. If, then, it is life, it would cause something
    else, and not itself, to live, even as motion would move something else than itself.
    </em><strong><em><mark>Now, that the soul lives, no one would deny.</mark></em></strong><em>
    But if it lives, it lives not as being life, but as the partaker of life; but
    that which partakes of anything, is different from that of which it does partake.
    </em><strong><em>Now the soul partakes of life, since God wills it to live. Thus,
    then, it will not even partake [of life] when God does not will it to live.</em></strong><em>
    For to live is not its attribute, as it is God’s; but as a man does not live always,
    and </em><strong><em><mark>the soul is not for ever conjoined with the body, since,
    whenever this harmony must be broken up, the soul leaves the body</mark></em></strong><em>,
    and the man exists no longer; </em><strong><em>even so, whenever the soul must
    cease to exist, the spirit of life is removed from it, and there is no more soul,
    but it goes back to the place from whence it was taken</em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-6">Dialogue
    with Trypho</a>)</p><p>Justin:</p><blockquote><p><em>…And the prayer that His
    soul should be saved from the sword, and lion’s mouth, and hand of the dog, was
    </em><strong><em>a prayer that no one should take possession of His soul</em></strong><em>;
    so that, <mark> </mark></em><strong><em><mark>when we arrive at the end of life</mark>,
    we may ask the same petition from God</em></strong><em>, who is able to </em><strong><em><mark>turn
    away</mark> every shameless <mark>evil angel from taking our souls</mark></em></strong><em>.
    And </em><strong><em><mark>that the souls survive, I have shown</mark> to you
    from the fact that the soul of Samuel was called up by the witch, as Saul demanded</em></strong><em>.
    And it appears also, that all the souls of similar righteous men and prophets
    fell under the dominion of such powers, as is indeed to be inferred from the very
    facts in the case of that witch.</em></p><p><em>Hence also God by His Son teaches
    us for whose sake these things seem to have been done, always to strive earnestly,
    and </em><strong><em><mark>at death to pray that our souls may not fall into the
    hands of any such power</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-105">Dialogue
    with Trypho</a>)</p><blockquote><p><em>But since </em><strong><em>sensation remains
    to all who have ever lived</em></strong><em>, and eternal punishment is laid up
    (i.e., for the wicked), see that ye neglect not to be convinced, and to hold as
    your belief, that these things are true. For let even necromancy, and the divinations
    you practise by immaculate children, and the evoking of departed human souls,
    and those who are called among the magi, Dream-senders and Assistant-spirits (Familiars),
    and all that is done by those who are skilled in such matters — let these persuade
    you that </em><strong><em><mark>even after death souls are in a state of sensation</mark></em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>For
    while we say that all things have been produced and arranged into a world by God,
    we shall seem to utter the doctrine of Plato; and while we say that there will
    be a burning up of all, we shall seem to utter the doctrine of the Stoics: and
    while we affirm that </em><strong><em><mark>the souls of the wicked, being endowed
    with sensation even after death, are punished</mark></em></strong><em>, and that
    </em><strong><em><mark>those of the good being delivered from punishment spend
    a blessed existence</mark></em></strong><em>, we shall seem to say the same things
    as the poets and philosophers.</em></p><p><em>&lt;…&gt;</em></p><p><em>For Moses
    is more ancient than all the Greek writers. And whatever both philosophers and
    poets have said </em><strong><em><mark>concerning the immortality of the soul,
    or punishments after death, or contemplation of things heavenly</mark></em></strong><em>,
    or doctrines of the like kind, they have received such suggestions from the prophets
    as have enabled them to understand and interpret these things. And hence there
    seem to be seeds of truth among all men.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-18">Apology
    1</a>)</p><h2>4th century</h2><h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3><blockquote><p>And
    as I said above concerning the soul, that it is deep, so let us depict its composition
    by means of likenesses. As there is the sun, and many rays proceed from it; or
    there is a tall tree, and it has many branches; or there is a great city, and
    it is surrounded by many neighboring lands: so also the <strong>intelligent essence,
    the immortal soul</strong>, is a beauty more honourable than all created things,
    the image and likeness of God.</p></blockquote><p>(Seven Words, Word 1, p. 12)</p><h3>St
    Athanasius the Great, archbishop of Alexandria (297–373)</h3><blockquote><p><strong><mark>But
    that the soul is made immortal is a further point in the Church’s teaching which
    you must know</mark></strong>, to show how the idols are to be overthrown. <strong>But
    we shall more directly arrive at a knowledge of this from what we know of the
    body, and from the difference between the body and the soul. For if our argument
    has proved it to be distinct from the body, while the body is by nature mortal,
    it follows that the soul is immortal, because it is not like the body.</strong>
    And again, if as we have shewn, the soul moves the body and is not moved by other
    things, it follows that the movement of the soul is spontaneous, and that this
    spontaneous movement goes on after the body is laid aside in the earth. If then
    the soul were moved by the body, it would follow that the severance of its motor
    would involve its death. <strong>But if the soul moves the body also, it follows
    all the more that it moves itself. But if moved by itself, it follows that it
    outlives the body. For the movement of the soul is the same thing as its life,
    just as, </strong>of course, we call the body alive when it moves, and say that
    its death takes place when it ceases moving. But this can be made clearer once
    for all from the action of the soul in the body. For <strong>if even when united
    and coupled with the body it is not shut in or commensurate with the small dimensions
    of the body, but often, when the body lies in bed, not moving, but in death-like
    sleep, the soul keeps awake by virtue of its own power, and transcends the natural
    power of the body, and as though travelling away from the body while remaining
    in it, imagines and beholds things above the earth, and often even holds converse
    with the saints and angels who are above earthly and bodily existence, and approaches
    them in the confidence of the purity of its intelligence; shall it not all the
    more, <mark>when separated from the body</mark> at the time appointed by God Who
    coupled them together, <mark>have its knowledge of immortality more clear</mark>?
    For if even when coupled with the body it lived a life outside the body, much
    more shall its life continue after the death of the body, and live without ceasing
    by reason of God Who made it thus by His own Word, our Lord Jesus Christ. For
    this is the reason why the soul thinks of and bears in mind things immortal and
    eternal, namely, because <mark>it is itself immortal.</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/athanasius-against-the-heathen-contra-gentes#HH-33-The-soul-immortal-Proved-by-1-its-being-distinct-from-the-body-2-its-being-the-source-of-motion-3-its-power-to-go-beyond-the-body-in-imagination-and-thought">Against
    the Heathen, §33</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
