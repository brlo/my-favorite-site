- src: Wzdw_Исповедь__отпущение_грехов_через_священника
  path: Confession-remission-of-sins
  title: Confession — the remission of sins through the priest
  menu:
    parent: Sacraments of the Church/Penance (Confession)
    title: Confession — the remission of sins through the priest
    priority: 2
  body: '<h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p><em>All
    these warnings being scorned and contemned,—</em><strong><em>before their sin
    is expiated, before confession has been made of their crime, before their conscience
    has been purged by sacrifice and <mark>by the hand of the priest</mark>, before
    the offence of an angry and threatening Lord has been appeased</em></strong><em>,
    violence is done to His body and blood; and they sin now against their Lord more
    with their hand and mouth than when they denied their Lord. They think that that
    is peace which some with deceiving words are blazoning forth: that is not peace,
    but war.</em></p><p><em>…</em></p><p><strong><em>I entreat</em></strong><em> you,
    beloved brethren, </em><strong><em>that each one should <mark>confess his own
    sin</mark>, while he who has sinned is still in this world, <mark>while his confession
    may be received</mark>, while the satisfaction and remission <mark>made by the
    priests</mark> are pleasing to the Lord.</em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-on-the-lapsed">On the Lapsed</a>) *The
    Latin reads sacrificio — here the sacrifice of penitential satisfaction, not the
    Eucharistic Sacrifice.</p><blockquote><p><em>Whence we perceive that </em><strong><em><mark>only
    they who are set over the Church and established in the Gospel law, and in the
    ordinance of the Lord, are allowed to baptize and to give remission of sins; but
    that without, nothing can either be bound or loosed, where there is none who can
    either bind or loose anything</mark></em></strong><em>. Nor do we propose this,
    dearest brother, without the authority of divine Scripture, when we say that all
    things are arranged by divine direction by a certain law and by special ordinance,
    and that none can usurp to himself, in opposition to the bishops and priests,
    anything which is not of his own right and power. For Korah, Dathan, and Abiram
    endeavoured to usurp, in opposition to Moses and Aaron the priest, the power of
    sacrificing; and they did not do without punishment what they unlawfully dared.
    The sons of Aaron also, who placed strange fire upon the altar, were at once consumed
    in the sight of an angry Lord; which punishment remains to those who introduce
    strange water by a false baptism, that </em><strong><em><mark>the divine vengeance
    may avenge and chastise when heretics do that in opposition to the Church, which
    the Church alone is allowed to do</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Jubaianus-Concerning-the-Baptism-of-Heretics">Epistle
    LXXII: To Jubaianus, Concerning the Baptism of Heretics</a>)</p><p>From the reply
    to Bishop Cyprian by Bishop Firmilian:</p><blockquote><p><em>When Christ breathed
    on the apostles alone, saying, “Receive ye the Holy Ghost: whose soever sins ye
    remit they are remitted unto them, and whose soever sins ye retain they are retained.”
    Therefore </em><strong><em><mark>the power of remitting sins was given to the
    apostles</mark>,</em></strong><em> and to the churches which they, sent by Christ,
    established, </em><strong><em>and to the <mark>bishops</mark> who <mark>succeeded
    to them by vicarious ordination</mark></em></strong><em>. But the enemies of the
    one Catholic Church in which we are, and the adversaries of us who have succeeded
    the apostles, asserting for themselves, in opposition to us, unlawful priesthoods,
    and setting up profane altars, what else are they than Korah, Dathan, and Abiram,
    profane with a like wickedness, and about to suffer the same punishments which
    they did, as well as those who agree with them, just as their partners and abettors
    perished with a like death to theirs?</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-Firmilian-Bishop-of-C%C3%A6sarea-in-Cappadocia-to-Cyprian-Against-the-Letter-of-Stephen-AD-256">Epistle
    LXXIV: Firmilian of Cæsarea to Cyprian, Against the Letter of Stephen</a>)</p><h2>4th
    century</h2><h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p><em>For
    if any one will consider how great a thing it is for one, being a man, and compassed
    with flesh and blood, to be enabled to draw nigh to that blessed and pure nature,
    he will then clearly see </em><strong><em>what great honor the grace of the Spirit
    has vouchsafed to <mark>priests</mark></em></strong><em>; </em><strong><em><mark>since
    by their agency these rites are celebrated,</mark></em></strong><em> and others
    nowise inferior to these both in respect of our dignity and our salvation. For
    they who inhabit the earth and make their abode there are entrusted with the administration
    of things which are in Heaven, and </em><strong><em><mark>have received an authority
    which God has not given to angels or archangels</mark></em></strong><em>. For
    it has not been said to them, “Whatsoever ye shall bind on earth shall be bound
    in Heaven, and whatsoever ye shall loose on earth shall be loosed in Heaven.”
    (Matt. 18:18) </em><strong><em>They who rule on earth have indeed authority to
    bind, but only the body: whereas <mark>this binding lays hold of the soul and
    penetrates the heavens; and what priests do here below God ratifies above, and
    the Master confirms the sentence of his servants</mark></em></strong><em>. For
    indeed what is it but all manner of heavenly authority which He has given them
    when He says, “Whose sins ye remit they are remitted, and whose sins ye retain
    they are retained?” (John 20:23) </em><strong><em><mark>What authority could be
    greater than this?</mark></em></strong><em> “The Father hath committed all judgment
    to the Son?” (John 5:22) But </em><strong><em><mark>I see it all put into the
    hands of these men by the Son</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-treatise-concerning-the-christian-priesthood#HH-Book-III">Treatise
    Concerning the Christian Priesthood, Book III, 5</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
