  path: Attitude-towards-heretics
  title: Should heretics be persecuted?
  menu:
    parent: Awaiting distribution
    title: Attitude towards heretics
    priority: 10
  body: "<h2>9th century</h2><h3>St Theodore the Studite, monk (c. 759–826)</h3><blockquote><p>Letter
    26 (214). To Theophilus, bishop of Ephesus</p><p>Having taken in hand the letter
    which your sacred height sent to our brother Athanasius, and having read it, I
    was grieved with great grief, my most honoured father, first, because among ourselves,
    who have stood directly for the truth against the now raging <strong>heresy of
    the iconoclasts</strong>, disagreements occur and divisions arise; and secondly,
    because I, the least, am compelled to make objection. May your greatness forgive
    me; but the matter concerns the truth, than which nothing is more important or
    more worthy of honour.</p><p>What, then, is the distressing content of the letter?
    “We, as you say, did not advise either to kill the Manichaeans or not to kill
    them; but even if we had permitted it, we would have done a deed, the greatest
    of good deeds.”</p><p>What do you say, O God-honoured one? The Lord forbade this
    in the Gospel, saying: “No, lest while you gather up the tares you also uproot
    the wheat with them. <strong>Let both grow together until the harvest</strong>”
    (Matt. 13:29–30). But you call the permission to uproot them the greatest of good
    deeds.</p><p>And that He called the tares precisely the heretics, both those of
    that time and those who came after, that is, all of them — let us hear Chrysostom
    on this, who, explaining the very same words, says: “What does the Lord forbid
    when He says: ‘<strong>lest, while you gather up the tares, you also uproot the
    wheat with them</strong>’? By these words Christ forbids wars, bloodshed and murders;
    and a heretic must not be killed, otherwise this will give occasion for an irreconcilable
    war in the universe.”</p><p>And further: “What did the Lord mean when He said:
    ‘lest, while you gather up the tares, you also uproot the wheat with them,’ if
    not that <strong>if you take up arms and begin to kill heretics, then many of
    the saints will inevitably be destroyed together with them</strong>?” And this
    has happened in our times; for bloodshed and murders have filled our country,
    and many of the saints have been put to death; the word of the Lord proved not
    in vain, as many have testified.</p><p>And why do we say that <strong>it is not
    permissible to kill heretics? It is not permissible for us even to wish them evil</strong>.
    Let us again hear the Lord, who, according to the words of the wise Dionysius,
    said to St Carpus: “Strike Me, I am ready to suffer again for the salvation of
    men; for Me this is desirable, if only other men would not sin; but see whether
    it will be good for you to exchange your abiding with God and with the good and
    man-loving Angels for a life in the pit with the serpents.”</p><p>You see, O God-wise
    one, <strong>the wrath of God upon the saint because he prayed concerning the
    heretics that they might be deprived of life</strong>; and if the saint had remained
    in such a disposition, he would have been condemned. Thus, <strong>one must by
    no means wish evil to enemies, as the truth has shown; but, on the contrary, one
    must pray for them</strong>, as the Lord Himself showed during His passion, saying
    to His Father: “Father! forgive them” their sin: “for they know not what they
    do” (Luke 23:34).</p><p>As for the claim that, as your holiness says, certain
    saints agree with your opinion — forgive me, father, we do not understand the
    words of the saints well, and therefore turn out to be introducing something new
    against the fathers, or rather, against God. Thus the divine Cyril, in his discourse
    against Julian, spoke in accordance with the ancient law, not mixing the Old Testament
    with the New — God forbid. For he could not but know that what was said in the
    law was said to those who lived under the law (Rom. 4); nor could he fail to know
    the comparison made by the Saviour in the words: ‘it was said to them of old’
    this or that; ‘but I say to you’ this or that (Matt. 5:21–22). Therefore we, as
    the divine Dionysius says to a certain Demophilus, will not accept your excessively
    zealous aspirations, even if a thousand times you appeal to Phinehas and Elijah.</p><p>Hearing
    the same thing, Jesus did not approve the disciples who were strangers to the
    meek and good spirit (Luke 9:54–56). For our Divine Hierarch teaches with meekness
    those who oppose the teaching of God. One must teach the ignorant, and not punish
    them. Let us, then, blessed one, attend to what St Paul also said, the sun of
    the universe (2 Tim. 2:25). Ignatius the God-bearer also says: “Those who hate
    God must be hated, and one must be indignant against His enemies (cf. Ps. 79:6),
    but we must not persecute or beat them, like the Gentiles who do not know God.”
    <strong>But if</strong> <strong>one must not beat them, it is hardly permissible
    to kill them</strong>.</p><p>Since you, O Master, suppose that St Symeon, who
    lived on the wondrous mountain, also agrees with you, do not think so. For the
    saint could not oppose Christ or the teachers who were higher than he. But what
    then? <strong>He addressed an exhortation to the emperor of that time concerning
    the pagans who were tormenting the Christian people, striving that the Christians
    should not be oppressed by the Samaritans. And this is good.</strong> To the same
    end <strong>we also now exhort when we say that the emperors should not spare,
    but should fight against the Scythians and the Arabs who are killing the people
    of God</strong>. But this is one thing, and that is another; <strong>this concerns
    the enemies, and that concerns the heretics who are subject to us</strong>.</p><p>What
    is reported about John the Faster, the primate of Constantinople, that he ordered
    the sorcerers to be impaled, does not seem to me to be true; but perhaps he did
    permit it. For they too are murderers, and the rulers are not forbidden to deal
    with them according to the Roman laws; “for they do not bear the sword in vain,”
    says the apostle, but are avengers “on him who does evil” (Rom. 13:4); but this
    is not permissible in relation to those concerning whom the Lord has uttered a
    prohibition. <strong><mark>Those who have authority over bodies have the right
    to punish those guilty of crimes that concern the body</mark></strong>, but not
    <strong>those guilty in matters of the soul; for <mark>the right to punish the
    latter belongs to those who govern souls, and the punishments here are excommunications
    and other penances</mark></strong>.</p><p>This, O Master, is what we, the lowly,
    think; and, to speak in our folly, we even dared to say to our Most Blessed Patriarch
    that <strong><mark>the Church does not avenge with the sword</mark></strong>,
    and he agreed with this. And to the emperors who committed murder we said — to
    the first: “Such a murder is not pleasing to God,” and to the second, who demanded
    approval for the murder: “Let them take off my head first, before I agree to this.”
    Such is the answer from us sinners. But you, most holy ones, if you have read
    another Gospel, which we do not know, then it is well; and if not, then consider
    what the apostle declared.</p></blockquote><p>(Letter 26 (214))</p>\n"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
