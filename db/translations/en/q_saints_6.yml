- src: кадило_фимиам
  path: Censer-and-incense
  title: The censer (incense)
  meta_desc: Quotes on the censer and incense
  menu:
    parent: Awaiting distribution
    title: The censer (incense)
    priority: 15
  body: <h2>1st century</h2><h3>St Dionysius the Areopagite, bishop of Athens († c.
    96)</h3><blockquote><p>“Having completed the sacred prayer before the holy altar,
    <strong>the hierarch,</strong> <strong>having begun the censing from the altar,
    goes round the whole circle</strong> occupied by the sacred assembly, and then,
    returning again to the divine altar, begins the sacred singing of psalms together
    with all the church clergy, who participate with him in the singing of the psalmic
    doxology”</p></blockquote><p>(On the Ecclesiastical Hierarchy, ch. 3, II. The
    sacrament of the assembly)</p><h3><a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-holy-apostles">The
    Canons of the Holy Apostles</a></h3><blockquote><p>If any bishop or presbyter
    offer any other things at the altar, besides that which the Lord ordained for
    the sacrifice, as honey, or milk, or strong-made drink instead of wine, or birds,
    or any living things, or vegetables, besides that which is ordained, let him be
    deposed. Excepting only new ears of corn, and grapes at the suitable season. Neither
    is it allowed to bring anything else to the altar at the time of the holy oblation,
    <strong>excepting oil for the lamps, and incense</strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-canons-of-the-holy-apostles">The
    3rd Apostolic Canon</a>)</p><h2>4th century</h2><h3>St John Chrysostom, archbishop
    of Constantinople (c. 347–407)</h3><blockquote><p>“If it were possible to see
    what men and women talk about at every sacred assembly, you would see that their
    words are viler than any dung. Therefore I beseech you, leave this bad custom,
    so that the church may be fragrant with myrrh. <strong>We fill it today only with
    material incense</strong>, but we do not care to drive out and destroy spiritual
    impurity. What benefit is there in that? Truly, we do not dishonour the church
    so much when we bring dung into it as we defile it when we talk with one another
    in it about profits, about trade, about taverns, about things that are not at
    all fitting for us, whereas the choirs of angels ought to be present here, and
    the church should be made heaven, and we should know nothing else but heartfelt
    prayers, silence, and attention. Let us correct ourselves, then, at least from
    this time on, so as to purify our life and inherit the promised good things, by
    the grace and love for mankind of our Lord Jesus Christ, to whom be glory forever
    and ever. Amen.”</p></blockquote><p>(Homilies on the Gospel of Matthew, Homily
    88)</p><h2>5th century</h2><h3>Blessed Theodoret of Cyrrhus (c. 386–457)</h3><blockquote><p>“Outside
    the tabernacle there was a bronze altar, receiving the sacrifices brought to it.
    And this signified that they were superfluous and unacceptable to the God of all.
    Therefore God, although He permitted this to be done because of the weakness of
    the Jews, commanded them to perform the sacred rites outside the tabernacle, as
    not necessary for the inner sanctuary. But we perform the sacred service that
    belongs to the inner sanctuary, because <strong>we offer to God incense, the light
    of the lamps, and the mysterious sacred rite of the holy table</strong>”</p></blockquote><p>(Commentary
    on Exodus, Question 60. Why did God command the tabernacle to be built?)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
