  body: '<p>See also: <a href="https://bibleox.com/en/en/w/Salvation-as-synergy">quotations
    about the synergy of God and man in the work of salvation</a>.</p><h2>4th century</h2><h3>St
    Macarius the Great of Egypt, monk (c. 300–391)</h3><p>See also: <a href="https://bibleox.com/en/en/w/Salvation-as-synergy">quotations
    on the synergy of God and man</a>.</p><blockquote><p><strong><mark>Both the opposing
    force and the grace of God prove to be prompting, not compelling, so that freedom
    and free choice may be fully preserved in us</mark></strong>. Therefore, for the
    evil deeds that a man does at Satan’s instigation, it is no longer Satan but the
    man who is punished; because <strong><mark>man is not forcibly drawn into vice,
    but is prompted to it by his own will</mark></strong>. And <strong><mark>likewise
    in the good deed, grace does not ascribe what is done to itself, but to man</mark></strong>,
    and therefore ascribes glory to him, because <strong><mark>he himself has become
    the author of the good for himself</mark></strong>. For <strong><mark>grace does
    not make his will necessary</mark></strong>, binding it, as has been said, with
    a compelling force: but, <strong><mark>abiding in man, it gives place also to
    free choice</mark>, so that it may become evident whether his will is inclined
    to virtue or to vice</strong>. For <strong><mark>the law was given not to nature,
    but to the freedom of choice</mark>, which <mark>can incline both to the good
    and to the evil</mark></strong>.</p></blockquote><p>(The Seven Words, Word 7.
    On the freedom of the mind, p. 3)</p><blockquote><p>Since, then, the <strong>opposing
    force only prompts, and <mark>does not compel</mark>; so also <mark>the grace
    of God prompts</mark>, because of the freedom and sobriety of nature</strong>.
    If, then, a man, prompted by Satan, does evil, it is not Satan who is condemned
    in his place, but the man himself who undergoes scourging and punishment, as one
    who has submitted to vice by his own will. In like manner, if a man turns to the
    good and the grace of God prevails, grace does not ascribe the good to itself,
    but renders it to man and glorifies him; because man is himself the author of
    the good for himself (such is his nature); and <strong>the grace that comes to
    him in no way binds his will with a compelling force, and does not make him unchangeable
    in good, whether he wills it or not</strong>. On the contrary, <strong>the power
    of God present in man also gives place to freedom, so that the will of man may
    be revealed</strong>, whether he respects the soul or does not respect it, <strong>whether
    he agrees with grace or does not agree with it</strong>. Many have shown respect
    and agreement, while others have turned aside; for the Apostle says: “having begun
    in the Spirit, are you now being made perfect by the flesh” (Gal. 3:3). <strong><mark>The
    law is laid down not for nature, but for free choice, which can incline to the
    good and to the evil</mark></strong>.</p></blockquote><p>(Seven Words, Word 1,
    p. 12)</p><h3>St Gregory the Theologian, bishop (c. 325–389)</h3><blockquote><p>All
    men, He saith, cannot receive this saying, but they to whom it is given. <strong>When
    you hear this, It is given, do not understand it in a heretical fashion</strong>,
    and bring in differences of nature, the earthly and the spiritual and the mixed.
    <strong>For there are people so evilly disposed as to think that some men are
    of an utterly ruined nature, and some of a nature which is saved, and that others
    are of such a disposition as their will may lead them to, either to the better,
    or to the worse.</strong> For that men may have a certain aptitude, one more,
    another less, I too admit; but not that this aptitude alone suffices for perfection,
    but that it is reason which calls this out, that nature may proceed to action,
    just as fire is produced when a flint is struck with iron. <strong>When you hear
    To whom it is given, add, And it is given to those who are called and to those
    who incline that way. For when you hear, Not of him that willeth, nor of him that
    runneth, but of God that sheweth mercy, (Rom. 9:16) I counsel you to think the
    same. For since there are some who are so proud of their successes that they attribute
    all to themselves and nothing to Him that made them and gave them wisdom and supplied
    them with good; such are taught by this word that even to wish well needs help
    from God; or rather that even to choose what is right is divine and a gift of
    the mercy of God.</strong> <strong><mark>For it is necessary both that we should
    be our own masters and also that our salvation should be of God.</mark></strong>
    This is why He saith not of him that willeth; that is, not of him that willeth
    only, nor of him that runneth only, but also of God. That sheweth mercy. Next;
    since to will also is from God, he has attributed the whole to God with reason.
    However much you may run, however much you may wrestle, yet you need one to give
    the crown. Except the Lord build the house, they laboured in vain that built it:
    Except the Lord keep the city, in vain they watched that keep it. (Ps. 127:1)
    I know, He says, that the race is not to the swift, nor the battle to the strong,
    (Eccl. 9:11) nor the victory to the fighters, nor the harbours to the good sailors;
    but to God it belongs both to work victory, and to bring the barque safe to port.
    In another place it is also said and understood, and perhaps it is necessary that
    I should add it as follows to what has already been said, in order that I may
    impart to you also my wealth. The Mother of the Sons of Zebedee, in an impulse
    of parental affection, asked a thing in ignorance of the measure of what she was
    asking, (Matt. 20:20) but pardonably, through the excess of her love and of the
    kindness due to her children. For there is nothing more affectionate than a Mother,—and
    I speak of this that I may lay down a law for honouring Mothers. <strong>Their
    mother, then, asked Jesus that they might sit, the one on His right hand, the
    other on his left. But what saith the Saviour? He first asks if they can drink
    the Cup Which He Himself was about to drink; and when this was professed, and
    the Saviour accepted the profession (for He knew that they were being perfected
    by the same, or rather that they would be perfected thereby); what saith He? “They
    shall drink the cup; but to sit on My right hand and on My left—it is not Mine,
    He saith, to give this, but to whom it hath been given.”</strong> Is then the
    ruling mind nothing? Nothing the labour? Nothing the reasoning? Nothing the philosophy?
    Nothing the fasting? Nothing the vigils, the sleeping on the ground, the shedding
    floods of tears? Is it for nothing of these, but in accordance with some election
    by lot, that a Jeremias is sanctified, and others are estranged from the womb?
    I fear lest some monstrous reasoning may come in, as of the soul having lived
    elsewhere, and then having been bound to this body, and that it is from that other
    life that some receive the gift of prophecy, and others are condemned, namely,
    those who lived badly. But since such a conception is too absurd, and contrary
    to the traditions of the Church (others if they like may play with such doctrines,
    but it is unsafe for us to play with them); <strong><mark>we must in this place
    too add to the words “To whom it hath been given,” this, “who are worthy;” who
    have not only received this character from the Father, but have given it to themselves.</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/gregory_naz-select-orations-3#HH-On-the-Words-of-the-Gospel-When-Jesus-Had-Finished-These-Sayings-Etc--S-Matt-xix-1">Select
    Orations, Oration 37</a>)</p><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>Let us not then despair, but even though thou
    be a reviler, or covetous, or whatsoever thou art, consider that Paul was “a blasphemer,
    and persecutor, and injurious, and the chief of sinners,” and suddenly rose to
    the very summit of virtue, and his former life proved no hindrance to him. And
    yet none with so great frenzy clings to vice as he did to the war against the
    Church. For at that time he put his very life into it; and because he had not
    ten thousand hands that he might stone Stephen with all of them, he was vexed.
    Notwithstanding, even thus he found how he might stone him with more hands, to
    wit, those of the false witnesses whose clothes he kept. And again, when he entered
    into houses like a wild beast and no otherwise did he rush in, haling, tearing
    men and women, filling all things with tumult and confusion and innumerable conflicts.
    <strong>For instance, so terrible was he that the Apostles, even after his most
    glorious change, did not yet venture to join themselves to him. Nevertheless,
    after all those things he became such as he was: for I need not say more. <mark>Where
    now are they who build up the necessity of fate against the freedom of the will?
    Let them hear these things, and let their mouths be stopped. For there is nothing
    to hinder him that willeth to become good, even though before he should be one
    of the vilest.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-3#HH-Homily-XXII">Homilies
    on First Corinthians, Homily 22</a>)</p><h2>8th century</h2><h3>St John of Damascus,
    monk (c. 675–754)</h3><blockquote><p>We ought to understand that while God knows
    <strong><mark>all things beforehand, yet He does not predetermine all things</mark></strong>.
    <strong>For He knows beforehand those things that are in our power, but He does
    not predetermine them. For it is not His will that there should be wickedness
    nor does He choose to compel virtue.</strong> So that predetermination is the
    work of the divine command based on fore-knowledge. But on the other hand God
    predetermines those things which are not within our power in accordance with His
    prescience. For already God in His prescience has prejudged all things in accordance
    with His goodness and justice.</p><p><strong>Bear in mind, too, that virtue is
    a gift from God implanted in our nature, and that He Himself is the source and
    cause of all good, and without His co-operation and help we cannot will or do
    any good thing, but <mark>we have it in our power either to abide in virtue and
    follow God, Who calls us into ways of virtue, or to stray from paths of virtue,
    which is to dwell in wickedness, and to follow the devil who summons but cannot
    compel us</mark>.</strong></p><p>Repentance is the returning from the unnatural
    into the natural state, from the devil to God, through discipline and effort.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/9TKB_An_Exact_Exposition_of_the_Orthodox_Faith__Book_2#HH-Chapter-XXX-Concerning-Prescience-and-Predestination">An
    Exact Exposition of the Orthodox Faith, Book II, ch. 30</a>. Translator’s note:
    the Greek προορίζει, rendered “predetermine” in the NPNF translation, is the same
    term that stands behind “predestination”; the library wording is retained.)</p><blockquote><p>The
    first enquiry involved in the consideration <strong>of <mark>free-will</mark></strong>,
    that is, of <strong><mark>what is in our own power</mark></strong>, is whether
    anything is in our power: for there are many who deny this.&lt;…&gt;</p><p>We
    are left then with this fact, that <strong><mark>the man who acts and makes is
    himself the author of his own works</mark></strong>, and <strong><mark>is a creature
    endowed with free-will</mark></strong>.</p><p>Further, if man is the author of
    no action, the faculty of deliberation is quite superfluous for to what purpose
    could deliberation be put if man is the master of none of his actions? for all
    deliberation is for the sake of action. But to prove that the fairest and most
    precious of man’s endowments is quite superfluous would be the height of absurdity.
    If then man deliberates, he deliberates with a view to action. For all deliberation
    is with a view to and on account of action.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/9TKB_An_Exact_Exposition_of_the_Orthodox_Faith__Book_2#HH-Chapter-XXV-Concerning-what-is-in-our-own-power-that-is-concerning-Free-will">An
    Exact Exposition of the Orthodox Faith, Book II, ch. 25 (39)</a>)</p><blockquote><p><em>So,
    </em><strong><em>God, foreknowing what we shall do voluntarily, that is, what
    depends on us — I mean virtue and evil — predetermines what does not depend on
    us.</em></strong> <strong><em><mark>And the foreknowing power of God has its cause
    not in us, but the foreknowledge of what we are about to do is in us: for if we
    were not about to do it, He would not have foreknown what will not be.</mark></em></strong><em>
    And the foreknowledge of God is true and inviolable, </em><strong><em>but it is
    not itself the cause that what is to come will certainly come to pass,</em></strong><em>
    — He foreknows that we are about to do this or that. He foreknows many things
    that are not pleasing to Him, and of which He is not Himself the cause. As a physician
    is not guilty of a disease when he foreknows that someone will fall ill, but the
    disease is caused by another cause that produces the disease, and the physician’s
    foreknowledge is a matter of his art, so what we shall do has its cause not in
    God, but in our free will.</em></p></blockquote><p>(Against the Manichaeans, ch.
    79)</p><blockquote><p><em>Also one must bear in mind that </em><strong><em>God’s
    original wish was that all should be saved and come to His Kingdom.</em></strong><em>
    (1 Tim. 2:4)</em> <strong><em><mark>For it was not for punishment that He formed
    us but to share in His goodness, inasmuch as He is a good God. But inasmuch as
    He is a just God, His will is that sinners should suffer punishment.</mark></em></strong></p><p>The
    first then is called God’s antecedent will and pleasure, and springs from Himself,
    while the second is called God’s consequent will and permission, and has its origin
    in us. And the latter is two-fold; one part dealing with matters of guidance and
    training, and having in view our salvation, and the other being hopeless and leading
    to our utter punishment, as we said above. And this is the case with actions that
    are not left in our hands.</p><p><strong>But of actions that are in our hands
    the good ones depend on His antecedent goodwill and pleasure, <mark>while the
    wicked ones depend neither on His antecedent nor on His consequent will, but are
    a concession to free-will. For that which is the result of compulsion has neither
    reason nor virtue in it.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/9TKB_An_Exact_Exposition_of_the_Orthodox_Faith__Book_2#HH-Chapter-XXIX-Concerning-Providence">An
    Exact Exposition of the Orthodox Faith, Book II, ch. 29</a>)</p><blockquote><p><em>It
    is to be observed that it is the custom in the Holy Scripture to speak of God’s
    permission as His energy, as when the apostle says in the Epistle to the Romans,
    “Hath not the potter power over the clay, of the same lump to make one vessel
    unto honour and another unto dishonour?”</em> <strong><em>And for this reason,
    that He Himself makes this or that. For He is Himself alone the Maker of all things;
    <mark>yet it is not He Himself that fashions noble or ignoble things, but the
    personal choice of each one</mark></em></strong><em><mark>.</mark> And this is
    manifest from what the same Apostle says in the Second Epistle to Timothy, “In
    a great house there are not only vessels of gold and of silver, but also of wood
    and of earth: and some to honour and some to dishonour. If a man therefore purge
    himself from these, he shall be a vessel unto honour sanctified, and meet for
    the master’s use, and prepared unto every good work.”</em> <strong><em><mark>And
    it is evident that the purification must be voluntary</mark></em></strong><em>:
    for if a man, he saith, purge himself. And the consequent antistrophe responds,
    </em><strong><em>“If a man purge not himself he will be a vessel to dishonour,
    unmeet for the master’s use and fit only to be broken in pieces.”</em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/MIa1_An_Exact_Exposition_of_the_Orthodox_Faith__Book_4#HH-Chapter-XIX-That-God-is-not-the-cause-of-evils">An
    Exact Exposition of the Orthodox Faith, Book IV, ch. 19</a>)</p><h2>11th century</h2><h3>Blessed
    Theophylact of Bulgaria, archbishop of Ohrid (2nd half of the 11th c. – beginning
    of the 12th c.)</h3><blockquote><p>God foreknows those worthy of the calling,
    and then predestines them. So first comes foreknowledge, then predestination.
    <strong><mark>By predestination, then, understand the unchangeable good will of
    God</mark></strong>. Thus He foreknew that Paul was worthy of the evangelical
    calling, and in this way predestined him, that is, unchangeably determined, and
    therefore resolved to call him. <strong>Those whom He foreknows to be worthy of
    the calling, He makes like the image of His Son</strong>.</p></blockquote><p>(Commentary
    on the Epistle to the Romans)</p><h2>17th century</h2><h3>St Elias (Miniatis),
    bishop (1669–1714)</h3><blockquote><p>It is enough to know these two clear, easy,
    and firm principles: the first, that God wills that we be saved, for He is a lover
    of mankind; the second, that we can be saved, for we are free. The will of God
    and the free choice of man form predestination. God wills; if man also wills,
    then he is already predestined</p><p>&lt;…&gt;</p><p>You do not understand what
    divine foreknowledge is and what it accomplishes. Listen, then. It is indeed a
    stone of stumbling at which many have stumbled and fallen. But whoever thinks
    of it as you do is greatly mistaken and very far from the truth. If you are ill,
    does not God foreknow whether you will recover or die? But should you for that
    reason fail to call the physician, fail to take medicine, and sit with folded
    hands waiting for recovery or death? In that case you would be very foolish and
    stupid. <strong>It is one thing for God to foreknow your healing or death (and
    this is entirely true), and quite another that God’s foreknowledge should grant
    you health or death (and this is entirely false); for if you take care of yourself,
    you will recover, but otherwise you will die. <mark>God foreknows both, but the
    foreknowledge of God brings neither the one nor the other to pass.</mark></strong><mark>
    </mark>You will either recover or die; one of the two is certain, but it is not
    fixed beforehand. Understand this better. God truly foreknows whether you will
    be in paradise or in hell, but learn what follows from this. In a mirror we appear
    such as we really are — the beautiful as beautiful, and the opposite. <strong>In
    the same way, in the purest foreknowledge of God we appear such as we are in reality:</strong>
    — either written in bright letters in the book of life, or marked in the fateful
    book of death; if we are righteous, in the choir of the saved righteous, and if
    sinful, in the list of condemned sinners. The mirror reflects our appearance,
    and the foreknowledge of God reflects our free choice.</p></blockquote><p>(Sermon
    on predestination for the first week of Lent)</p><h2>17th century</h2><h3>Epistle
    of the Patriarchs of the Orthodox Church (1723)</h3><p>This is a conciliar document
    of the Church of Jerusalem (1672), but by this time (1723) it had also been approved
    by the four patriarchates (Constantinople, Jerusalem, Antioch, Alexandria) and
    by the Synod of the Russian Church.</p><blockquote><p><strong>We believe the most
    good God to have from eternity <mark>predestinated</mark></strong> unto glory
    those whom he hath chosen, and to have consigned unto condemnation those whom
    he hath rejected; <strong>but not so that he would justify the one, and consign
    and condemn the other without cause</strong>. For that were contrary to the nature
    of God, who is the common Father of all, and no respecter of persons, and would
    have all men to be saved, and to come to the knowledge of the truth (1 Tim. 2.4);
    <strong>but since he <mark>foreknew</mark> the one would make a right use of their
    free-will, and the other a wrong, he predestinated the one, or condemned the other</strong>.</p><p>And
    we understand the use of free-will thus, that <strong><mark>the Divine and illuminating
    grace</mark>, and which we call preventing grace, being, as a light to those in
    darkness, by the Divine goodness imparted to all</strong>, to those that are willing
    to obey this – <strong>for <mark>it is of use only to the willing, not to the
    unwilling</mark></strong> – and co-operate with it, in what it requireth as necessary
    to salvation, <strong><mark>there is consequently granted particular grace</mark></strong>;
    which, co-operating with us, and enabling us, and making us perseverant in the
    love of God, that is to say, <strong>in performing those good things</strong>
    that God would have us to do, and which his preventing grace admonisheth us that
    we should do, <strong>justifieth us, and maketh us predestinated</strong>. <strong><mark>But
    those who will not obey, and co-operate with grace; and, therefore, will not observe
    those things that God would have us perform, and that abuse in the service of
    Satan the free-will, which they have received of God to perform voluntarily what
    is good, are consigned to eternal condemnation.</mark></strong></p><p>But <strong><mark>to
    say, as the most wicked heretics do and as is contained in the chapter answering
    hereto – that God, in predestinating, or condemning, had in no wise regard to
    the works of those predestinated, or condemned, we know to be profane and impious.</mark></strong>
    For thus <strong><mark>Scripture</mark></strong> would be opposed to itself, since
    it <strong><mark>promiseth the believer salvation through works</mark></strong>,
    yet supposeth God to be its sole author, by his sole illuminating grace, which
    he bestoweth without preceding works, to shew to men the truth of divine things,
    and to teach him how he may co-operate therewith, if he will, <strong>and <mark>do</mark>
    what is good and acceptable, <mark>and so</mark> <mark>obtain salvation</mark>.</strong>
    <strong><mark>He taketh not away the power to will – to will to obey, or not obey
    him.</mark></strong></p><p><strong><mark>But than to affirm that the Divine Will
    is thus solely and without cause the author of their condemnation, what greater
    calumny can be fixed upon God? and what greater injury and blasphemy can be offered
    to the Most High?</mark></strong></p><p>For that the Deity is not tempted with
    evils (cf. Jas 1.13), and that he equally willeth the salvation of all, since
    there is no respect of persons with him, we do know; and that for those who through
    their own wicked choice, and their impenitent heart, have become vessels of dishonour,
    there is, as is just, decreed condemnation, we do confess. <strong><mark>But of
    eternal punishment, of cruelty, of pitilessness, and of inhumanity, we never,
    never say God is the author, who telleth us that there is joy in heaven over one
    sinner that repenteth (Luke 15.7).</mark></strong> Far be it from us, while we
    have our senses, thus to believe, or to think; <strong><mark>and we do subject
    to an eternal anathema those who say and think such things, and esteem them to
    be worse than any infidels.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-3">Epistle
    of the Patriarchs of the Orthodox Church (1723), Decree 3</a>)</p><h2>19th century</h2><h3>St
    Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>“<strong><mark>I
    am predestined!</mark> I have no possibility whatever of opposing predestination,
    of changing or destroying the predestination of God</strong>. Why, then, should
    I force myself to relentlessly strict Christian virtue? Why subject myself to
    countless deprivations and live in constant renunciation of life? I will live
    as I wish and please! I will hasten to whatever my dream lures me toward, painting
    enchanting pictures before my eyes! I will gratify myself to satiety with all
    pleasures, even sinful ones! They are scattered throughout the universe in luxury,
    and an unbearable curiosity draws me to taste and know them by experience! <strong>If
    it is predestined that I should be saved, then, despite all my wickedness, God
    will save me. But if it is fated that I should perish, then I shall perish, despite
    all my efforts to gain salvation.” <mark>Such a judgment is proclaimed out of
    ignorance of the mysteries of Christianity!</mark> It is proclaimed by a falsely
    named reason and carnal wisdom. <mark>In it is uttered a terrible blasphemy, which
    they do not understand!</mark> </strong>The wretched, utterly erroneous reasoning
    is recognized and accepted by many as irrefutable truth; on it is founded a life
    of self-will, a life of lawlessness and depravity. On the earthly life of vice
    is founded a life of eternal grief, a life of eternal misery in the land beyond
    the grave.</p><p>The false, soul-destroying reasoning about predestination and
    fate arose from the confusion of actions proper to God alone with human actions.
    One error inevitably leads to another error, and it leads to many errors if it
    is made in the initial, starting thought. <strong>The man who confuses his own
    action with the action of God has, as it were naturally, subjected both actions
    to one law, one judgment, the judgment of his own reason. From this there opened
    before him a boundless field of errors. Having set himself up as judge of the
    actions of God, he necessarily ascribed to God the same relation to good and evil
    that man has to them. He recognized the properties of God as identical with human
    properties, and subjected the thought of God to the laws of human thought: he
    posited some difference, but a difference not infinite, but somehow his own, indefinite,
    alien to correctness and meaning.</strong></p><p>From His beginningless beginning
    God was and is content with His single Word. The Word of God is also His Thought:
    “In the beginning was the Word, and the Word was with God, and the Word was God”
    (John 1:1–2). Such is the property of the boundless Mind. By His boundless perfection
    God has one and only one Thought, although this Thought is expressed in the realm
    of rational creatures in a countless multitude of thoughts. <strong>Let us separate
    from ourselves by an infinite distance both the being of God and His properties
    and His actions; then our judgment concerning the destinies and predestination
    will receive its proper foundation. <mark>Predestination of man’s lot is entirely
    fitting to God, by the unlimited perfection of the divine mind and by God’s independence
    from time. Predestination, showing man the greatness of God and remaining a mystery
    known to God alone, does not in the least constrain the free activity of man throughout
    the whole course of earthly life, and has no influence on this activity, no relation
    to it. Having no influence on the activity of man, the predestination of God has
    not and cannot have any influence on the consequences of this activity, on the
    salvation and perdition of man.</mark></strong> <strong>For the guidance of our
    conduct there are given, on the one hand, reason and free choice, and on the other,
    the revealed teaching of God. The revealed teaching of God proclaims with the
    most satisfactory detail the will of God as the means of salvation, proclaims
    the good will of God that all men should be saved, and proclaims eternal torment
    for trampling upon the will of God. Hence the clear consequence: <mark>the salvation
    and perdition of man depend solely on his own free choice, and not on any determination
    of God unknown to him</mark>.</strong></p></blockquote><p>(Symphony on the Works
    of St Ignatius Brianchaninov)</p><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p>From
    these two passages the Apostolic spirit took the prophetic thought and set it
    forth in its own words: God gave them the spirit of slumber, eyes that they should
    not see, and ears that they should not hear. Both in the Prophets and in the Apostles
    it is said in such a way that <strong>it is as though God Himself by His own power
    produced such an evil state</strong>. This is the usual manner of the Prophets,
    who refer everything to God, both good and evil. <strong>But <mark>some things
    are given directly from God, and others are only permitted</mark></strong>. God
    desires good for all men and seeks to bestow it on all. But <strong><mark>when
    He encounters opposition from men, then, after attempts to overcome this opposition,
    He leaves them in the hands of their own free choice</mark>, which, as opposing
    God, never leads to good, but is always accompanied by evil consequences</strong>.
    These evil consequences evidently come as God’s punishment for resistance to His
    will. That is why they are attributed to Him, although <strong><mark>the reason
    why God so permits is in men themselves — in their disobedience</mark></strong>.
    So it was with the Gospel as well. How many proofs did the Lord Himself show to
    the Jews, clearly pointing to who He is? How many also did the Apostles, by word
    and deed, persuade them that He is precisely the Promised One and that His teaching
    must be followed? <strong>The Jews had no heart to understand what was happening
    before their eyes, and did not want to hear about its meaning. <mark>But who is
    to blame? The Lord left them in their blindness</mark></strong>. Blessed Theodoret
    writes: “the word ‘gave,’ like ‘delivered up,’ means ‘permitted.’ For it was not
    God who caused them not to believe; otherwise <strong><mark>is it possible that
    He Himself implanted unbelief in them and Himself subjected them to punishment
    for it?</mark></strong> The Prophet also taught this more clearly: for the heart
    of this people has grown dull, and their ears are hard of hearing, and their eyes
    they have closed (cf. Isa. 6:10). <strong>Therefore <mark>it was not another who
    blinded them, but they themselves closed their eyes and did not want to see the
    light</mark></strong>.” And St Chrysostom says: “from what, then, did this blindness
    arise? The Apostle had already explained its causes and laid the whole blame on
    the heads of the Jews themselves, proving that <strong>they were blinded because
    of their untimely obstinacy, and now he repeats the same</strong>. For when he
    says, ‘eyes that they should not see and ears that they should not hear,’ he accuses
    nothing else than their obstinate will. <strong><mark>Having eyes to see miracles,
    having received ears to hear this wondrous teaching, they made use of neither
    as they ought.</mark></strong> Therefore, by the word ‘gave,’ <strong><mark>understand
    here not an action, but a permission</mark></strong>.”</p></blockquote><p>(Commentary
    on the Epistle of the Apostle Paul to the Romans, 11:8)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
