- src: освящение-материи-цитаты-святых-отцов
  path: Sanctification-of-matter
  title: The sanctification of matter (created substance)
  title_sub: Quotes of the Holy Fathers on the sanctification of matter
  menu:
    parent: Sanctification of created matter
    title: The holy and the sanctification of matter
    priority: 1
  body: '<h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p><em>“We
    who, being leprous in our sins, </em><strong><em>are purified through <mark>holy
    water</mark> and the invocation of the Lord</em></strong><em>, cleansed of our
    former transgressions, reborn spiritually as newborn babes, just as the Lord said:
    unless one is born of water and the Spirit, he cannot enter the kingdom of heaven.”</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/8yk4_Fragments#HH-33">Fragments, 33</a>)</p><h3>Tertullian
    (c. 160–240)</h3><blockquote><p><em>The Spirit of God, who hovered over the waters
    from the beginning, would continue to linger over the waters of the baptized.
    But a holy thing, of course, hovered over a holy; or else, from that which hovered
    over that which was hovered over borrowed a holiness, since it is necessary that
    in every case an underlying material substance should catch the quality of that
    which overhangs it, most of all a corporeal of a spiritual, adapted (as the spiritual
    is) through the subtleness of its substance, both for penetrating and insinuating.
    Thus </em><strong><em>the nature of the waters, sanctified by the Holy One, itself
    conceived withal the power of sanctifying</em></strong><em>. Let no one say, “Why
    then, are we, pray, baptized with the very waters which then existed in the first
    beginning?” Not with those waters, of course, except in so far as the genus indeed
    is one, but the species very many. But what is an attribute to the genus reappears
    likewise in the species. And accordingly it makes no difference whether a man
    be washed in a sea or a pool, a stream or a fount, a lake or a trough; nor is
    there any distinction between those whom John baptized in the Jordan and those
    whom Peter baptized in the Tiber, unless withal the eunuch whom Philip baptized
    in the midst of his journeys with chance water, derived (therefrom) more or less
    of salvation than others. All waters, therefore, in virtue of the pristine privilege
    of their origin, do, after invocation of God, attain </em><strong><em><mark>the
    sacramental power of sanctification</mark></em></strong><em>. For </em><strong><em>the
    Spirit immediately supervenes from the heavens, and rests over the waters, sanctifying
    them from Himself</em></strong><em>; and being thus </em><strong><em><mark>sanctified,
    they imbibe at the same time the power of sanctifying</mark></em></strong><em>.</em></p><p><em>Albeit
    the similitude may be admitted to be suitable to the simple act; that, since we
    are defiled by sins, as it were by dirt, we should be washed from those stains
    in waters. But as sins do not show themselves in our flesh (inasmuch as no one
    carries on his skin the spot of idolatry, or fornication, or fraud), so persons
    of that kind are foul in the spirit, which is the author of the sin; for the spirit
    is lord, the flesh servant. Yet they each mutually share the guilt: the spirit,
    on the ground of command; the flesh, of subservience. Therefore, after the waters
    have been in a manner endued with medicinal virtue through the intervention of
    the angel, the spirit is corporeally washed in the waters, and the flesh is in
    the same spiritually cleansed.</em></p><p><em>But the nations, who are strangers
    to all understanding of spiritual powers, ascribe to their idols the imbuing of
    waters with the self-same efficacy. (So they do) but they cheat themselves with
    waters which are widowed.</em></p><p><em>&lt;…&gt;</em></p><p><em>Therefore, if
    </em><strong><em><mark>the mere nature of water, in that it is the appropriate
    material for washing away, leads men to flatter themselves with a belief in omens
    of purification, how much more truly will waters render that service through the
    authority of God</mark></em></strong><em>, by whom all their nature has been constituted!
    If men think that water is endued with a medicinal virtue by religion, what religion
    is more effectual than that of the living God?</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-on-baptism">On
    Baptism, IV–V</a>)</p><h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr
    (c. 201–258)</h3><blockquote><p><em>And again, sacred Scripture warns, and says,
    “Keep thee from the strange water, and drink not from a fountain of strange water”
    (</em><a href="https://bibleox.com/en/eng-nkjv/pr/9/#L18"><em>Prov. 9:18</em></a><em>).
    It is required, then, that </em><strong><em><mark>the water should first be cleansed
    and sanctified by the priest, that it may wash away by its baptism the sins</mark></em></strong><em>
    of the man who is baptized. &lt;…&gt; But how can he cleanse and sanctify the
    water who is himself unclean, and in whom the Holy Spirit is not? since the Lord
    says in the book of Numbers, “And whatsoever the unclean person toucheth shall
    be unclean” (</em><a href="https://bibleox.com/en/eng-nkjv/chis/19/#L22"><em>Num.
    19:22</em></a><em>)? Or how can he who baptizes give to another remission of sins
    who himself, being outside the Church, cannot put away his own sins?</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">To
    Januarius and Other Numidian Bishops, on Baptizing Heretics</a>; the words quoted
    from Prov. 9:18 follow the LXX/Slavonic text and are not in the NKJV (Masoretic)
    verse)</p><p>The sanctification of the substance of oil (that is, of olive oil)
    on the altar:</p><blockquote><p><em>It is also necessary that he should be anointed
    who is baptized; so that, having received the chrism, that is, the anointing,
    he may be anointed of God, and have in him the grace of Christ. </em><strong><em>Further,
    it is the Eucharist whence the baptized are anointed with <mark>the oil sanctified
    on the altar</mark>. But <mark>he cannot sanctify the creature of oil, who has
    neither an altar nor a church</mark></em></strong><em>; whence also there can
    be no spiritual anointing among heretics, since it is manifest that the oil cannot
    be sanctified nor the Eucharist celebrated at all among them. But we ought to
    know and remember that it is written, “Let not the oil of a sinner anoint my head”
    (</em><a href="https://bibleox.com/en/eng-nkjv/ps/141/#L5"><em>Ps. 141:5</em></a><em>).</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">To
    Januarius and Other Numidian Bishops, on Baptizing Heretics</a>)</p><h2>4th century</h2><h3>St
    Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p><em>Regard not the Laver
    as </em><strong><em>simple water</em></strong><em>, but rather regard the spiritual
    grace that is </em><strong><em>given with the water</em></strong><em>. For just
    as the offerings brought to the heathen altars, though simple in their nature,
    become defiled by the invocation of the idols, so contrariwise the </em><strong><em><mark>simple
    water having received the invocation of the Holy Ghost, and of Christ, and of
    the Father, acquires a new power of holiness</mark></em></strong><em>. For since
    man is of twofold nature, soul and body, the purification also is twofold, the
    one incorporeal for the incorporeal part, and the other bodily for the body: the
    water cleanses the body, and the Spirit seals the soul; that we may draw near
    unto God, having our heart sprinkled by the Spirit, and our body washed with pure
    water (Heb. 10:22). When going down, therefore, into the water, think not of the
    bare element, but look for salvation by the power of the Holy Ghost: for </em><strong><em>without
    both thou canst not possibly be made perfect</em></strong><em>. It is not I that
    say this, but the Lord Jesus Christ, who has the power in this matter: for He
    saith, Except a man be born anew (and He adds the words) of water and of the Spirit,
    he cannot enter into the kingdom of God (</em>John 3:3)<em>. </em><strong><em>Neither
    doth he that is baptized with water, but not found worthy of the Spirit, receive
    the grace in perfection; nor if a man be virtuous in his deeds, but receive not
    the seal by water, shall he enter into the kingdom of heaven. A bold saying, but
    not mine, for it is Jesus who hath declared it.</em></strong><em> And here is
    the proof of the statement from Holy Scripture…</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1#HH-On-Baptism">Catechetical
    Lectures, Lecture 3, 2</a>)</p><h3>St Ambrose of Milan, bishop (c. 339–397)</h3><blockquote><p><em>Therefore
    read that </em><strong><em>the three witnesses in baptism, the water, the blood,
    and the Spirit, </em>(1 John 5:8)<em> are one, for if you take away one of these,
    the Sacrament of Baptism does not exist. For what is water without the cross of
    Christ? A common element, without any sacramental effect.</em></strong><em> Nor,
    again, is there the Sacrament of Regeneration without water: “For except a man
    be born again of water and of the Spirit, he cannot enter into the kingdom of
    God.” (cf.</em> John 3:5)<em>. Now, even the catechumen believes in the cross
    of the Lord Jesus, wherewith he too is signed; but unless he be baptized in the
    Name of the Father, and of the Son, and of the Holy Spirit, he cannot receive
    remission of sins nor gain the gift of spiritual grace.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/ambrose-on-the-mysteries#HH-4-That-water-does-not-cleanse-without-the-Spirit-is-shown-by-the-witness-of-John-and-by-the-very-form-of-the-administration-of-the-sacrament-And-this-is-also-declared-to-be-signified-by-the-pool-in-the-Gospel-and-the-man-who-was-there-healed-In-the-same-passage-too-is-shown-that-the-Holy-Spirit-truly-descended-on-Christ-at-His-baptism-and-the-meaning-of-this-mystery-is-explained">On
    the Mysteries, 20</a>)</p><blockquote><p><em>What then does this mean? You have
    seen water, but </em><strong><em><mark>not every water heals, but only that water
    heals which has the grace of Christ</mark></em></strong><em>. The substance (elementum)
    and the consecration (consecratio) are not the same, nor are the ordinary action
    (opus) and the divine operation (operatio). Action (opus) belongs to the water,
    and operation (operatio) to the Holy Spirit. Water will not heal unless </em><strong><em><mark>the
    Holy Spirit</mark></em></strong><em> comes down and </em><strong><em><mark>sanctifies
    the water</mark></em></strong><em><mark>.</mark></em></p></blockquote><p>(On the
    Sacraments)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
