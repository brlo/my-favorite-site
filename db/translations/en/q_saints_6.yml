    <h2>2nd century</h2>
    <h3>Tertullian (c. 155–220)</h3>
    <blockquote><p>Why do we not rather try to find in the Old Testament rules that agree with our rules and were, by His design, included in the New Testament? I see that in ancient times also the excessive inclination to marry was often restrained. It is said in the book of Leviticus: <em>“For a wife </em><strong><em>He (Sacerdotes, a priest)</em></strong><em> shall take a virgin [from his people]”</em> (Lev. 21:13); therefore one virgin, and not many. Again, it is said elsewhere: <em>“and that he should not multiply wives to himself, that his heart turn not away”</em> (Deut. 17:17). But in this case, as in every other, it was left to Jesus Christ to fulfil or to complete the law. Therefore <strong>among Christians it is reckoned a most exact and strict obligation <mark>for priests</mark> (alleguntur in ordinem sacerdotalem<em> — who are chosen into the sacerdotal order</em>) to marry only once (</strong><a href="https://bibleox.com/en/eng-nkjv/tit/1/#L6"><strong>Titus 1:6</strong></a><strong>), so that, as I know, he who has had two wives is deprived of the priesthood (loco dejectos — cast down from their place)</strong>. You will object, perhaps, that since this prohibition concerns priests only, it is therefore permitted to the rest of the faithful to enter into a second marriage. <strong>What madness to suppose that <mark>laymen (laicis)</mark> are allowed to do what is forbidden to <mark>priests (</mark><em><mark>sacerdotibus</mark></em><mark>)</mark>! Are we not (<em>laici, </em>laymen) all priests (<em>sacerdotes</em>)?</strong> Our Lord Jesus Christ made us all not only ministers but also priests (<em>sacerdotes</em>) of the Father in heaven. <strong><mark>The authority of the Church established the boundaries between priests (ordinem — the order) and laymen (</mark><em><mark>plebem — the people</mark></em><mark>)</mark>. But the essential duty of serving God belongs inalienably to each one</strong>. Do we not, even without priests (<em>ecclesiastici ordinis — of the ecclesiastical order</em>), offer Him sacrifices in prayers, genuflections, vigils, and even in teaching others? Do we not have the right to baptize on our own in case of need? <strong><mark>Thou art a priest (</mark><em><mark>sacerdos</mark></em><mark>) for thyself and for those, though not for all</mark> (<em>Adeo ubi ecclesiastici ordinis non est consessus, et offers, et tinguis, et sacerdos es tibi solus.</em>).</strong> Where three of the faithful have gathered, even if they are laymen, there is the Church: each one is quickened by his own faith, and God does not regard persons. Thou shalt be justified not as a minister, but as a member of the Church.</p>
    <p>Therefore, if thou dost sometimes discharge the office of a priest (<em>sacerdotis</em>), thou must also submit to the law of the priesthood (<em>disciplinam sacerdotis</em>). Wilt thou dare to baptize anyone and to offer sacrifices to God, having two wives? If this is forbidden <strong>to a priest (<em>sacerdoti</em>)</strong> who is a bigamist, then the layman who has presumed to do so is still more guilty. But thou wilt say that such an act is excused in case of necessity. Know then that what is sometimes not necessary cannot be called necessity. Do not enter into a second marriage, and thou wilt never have need to violate the law concerning church rites. God wishes us always to be ready to approach the celebration of His mysteries. If <strong><mark>laymen, from among whom priests are chosen (</mark><em><mark>presbyteri — presbyters</mark></em><mark>)</mark>, do not submit to the conditions of the priesthood, whence will <mark>priests (</mark><em><mark>presbyteri — presbyters</mark></em><mark>)</mark> be taken when they are needed?</strong> Thus, <strong>we must so act that laymen do not marry twice, because no one can be chosen as a <mark>priest (</mark><em><mark>presbyter — presbyters</mark></em><mark>)</mark> except such a layman</strong> who must be married only once. &lt;…&gt; Therefore thou wilt stand before thy God with as many wives as thou prayest for: thou wilt come, on account of two wives, <strong>to the celebration of the Holy Mysteries performed by the hands of a <mark>priest</mark></strong> who is monogamous, and perhaps even a virgin, surrounded by his deacons and canonesses, likewise monogamous or virgins.</p></blockquote>
    <p>(On Exhortation to Chastity, 7)</p>
    <p>On how heretics imitate the Church but have no order within themselves:</p>
    <blockquote><p>40. The question will arise, By whom is to be interpreted the sense of the passages which make for heresies? <strong>By the devil, of course, to whom pertain those wiles which pervert the truth, and who, by the mystic rites of his idols, vies even with the essential portions of the sacraments of God.</strong> He, too, baptizes some—that is, his own believers and faithful followers; he promises the putting away of sins by a laver (of his own); and if my memory still serves me, Mithra there, (in the kingdom of Satan,) sets his marks on the foreheads of his soldiers; celebrates also the oblation of bread, and introduces an image of a resurrection, and before a sword wreathes a crown. What also must we say to (Satan’s) limiting his chief priest to a single marriage? He, too, has his virgins; he, too, has his proficients in <em>continence</em>. Suppose now we revolve in our minds the superstitions of Numa Pompilius, and consider his priestly offices and badges and privileges, his sacrificial services, too, and the instruments and vessels of the sacrifices themselves, and the curious rites of his expiations and vows: is it not clear to us that the devil imitated the well-known moroseness of the Jewish law? <strong>Since, therefore he has shown such emulation in his great aim of expressing, in the concerns of his idolatry, <em>those very things</em> of which consists the administration of Christ’s sacraments, it follows, of course, that the same being, possessing still the same genius, both set his heart upon, and succeeded in, adapting to his profane and rival creed the very documents of divine things and of the Christian saints—his interpretation from their interpretations, his words from their words, his parables from their parables.</strong> For this reason, then, no one ought to doubt, either that “spiritual wickednesses,” from which also heresies come, have been introduced by the devil, or that <strong>there is any real difference between heresies and idolatry, seeing that they appertain both to the same author and the same work that idolatry does. They either pretend that there is another god in opposition to the Creator, or, even if they acknowledge that the Creator is the one only God, they treat of Him as a different being from what He is in truth. The consequence is, that every lie which they speak of God is in a certain sense a sort of idolatry.</strong></p>
    <p>41. I must not omit <strong>an account of the <mark>conduct also of the heretics—how frivolous it is</mark>, how worldly, how merely human, without seriousness, without authority, without discipline, as suits their creed</strong>. To begin with, <strong><mark>it is doubtful who is a catechumen, and who a believer</mark></strong>; they have all access alike, they hear alike, they pray alike—even heathens, if any such happen to come among them. “That which is holy they will cast to the dogs, and their pearls,” although (to be sure) they are not real ones, “they will fling to the swine.” (see Matt. 7:6) <strong><mark>Simplicity they will have to consist in the overthrow of discipline, attention to which on our part they call brothelry.</mark></strong> <strong><mark>Peace also they huddle up anyhow with all comers; for it matters not to them, however different be their treatment of subjects, provided only they can conspire together to storm the citadel of the one only Truth.</mark></strong> All are puffed up, all offer you knowledge. Their catechumens are perfect before they are full-taught. The very women of these heretics, how wanton they are! For they are bold enough to teach, to dispute, to enact exorcisms, to undertake cures—it may be even to baptize. <strong>Their ordinations are carelessly administered, capricious, changeable. At one time they put <i>novices</i> in office; at another time, men who are bound to some secular employment; at another, persons who have apostatized from us, to bind them by vainglory, since they cannot by the truth.</strong> <strong>Nowhere is promotion easier than in the camp of rebels, where the mere fact of being there is a foremost service.</strong> <strong>And so it comes to pass that to-day one man is their bishop, to-morrow another; to-day he is a deacon who to-morrow is a reader; to-day he is a presbyter who tomorrow is a layman. For even <mark>on laymen do they impose the functions of priesthood</mark>.</strong></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/tertullian-the-prescription-against-heretics#HH-No-Difference-in-the-Spirit-of-Idolatry-and-of-Heresy-In-the-Rites-of-Idolatry-Satan-Imitated-and-Distorted-the-Divine-Institutions-of-the-Older-Scriptures-The-Christian-Scriptures-Corrupted-by-Him-in-the-Perversions-of-the-Various-Heretics">The Prescription Against Heretics, 40–41</a>)</p>
    <h2>3rd century</h2>
    <h3>St Cyprian of Carthage, hieromartyr (c. 201–258)</h3>
    <blockquote><p><em>And again, sacred Scripture warns, and says, “Keep thee from the strange water, and drink not from a fountain of strange water” (</em><a href="https://bibleox.com/en/eng-nkjv/pr/9/#L18"><em>Prov. 9:18 (LXX)</em></a><em>). It is required, then, </em><strong><em><mark>that the water should first be cleansed</mark> and <mark>sanctified by the priest</mark>, that it may wash away by its baptism the sins</em></strong><em> of the man who is baptized. &lt;…&gt; But how can he cleanse and sanctify the water who is himself unclean, and in whom the Holy Spirit is not? since the Lord says in the book of Numbers, “And whatsoever the unclean person toucheth shall be unclean” (</em><a href="https://bibleox.com/en/eng-nkjv/chis/19/#L22"><em>Num. 19:22</em></a><em>). Or how can he who baptizes give to another remission of sins who himself, being outside the Church, cannot put away his own sins?</em></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">Epistle 69, to Januarius and other Numidian bishops, on baptizing heretics</a>)</p>
    <blockquote><p>This has been done, although our mind and intention had been already plainly declared to the brethren, and to the whole of the people in this place, when, having received letters lately from both parties, we read your letters, and <strong>intimated your ordination to the <mark>episcopate</mark></strong>, in the ears of every one. Moreover, <strong>remembering the common honour, and having respect for the <mark>sacerdotal</mark> gravity and sanctity</strong>, we repudiated those things which from the other party had been heaped together with bitter virulence into a document transmitted to us; alike considering and weighing, that <strong>in so great and so religious an assembly of brethren, in which <mark>God’s priests</mark> were sitting together</strong>, and His altar was set, they ought neither to be read nor to be heard. &lt;…&gt; Assuredly, we should exert ourselves, <strong><mark>as it is fitting for prelates and priests to do</mark></strong>, that such things, when they are written by any, should be repudiated as far as we are concerned.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-1#HH-To-Cornelius-About-Cyprians-Approval-of-His-Ordination-and-Concerning-Felicissimus">Epistle 41, to Cornelius, about Cyprian’s approval of his ordination, and concerning Felicissimus</a>)</p>
    <blockquote><p>Nor let them think that the way of life or of salvation is still open to them, if they have refused to obey the <strong><mark>bishops and priests</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Pomponius-Concerning-Some-Virgins">Epistle 61, to Pomponius, concerning some virgins</a>)</p>
    <blockquote><p><strong><mark>The bishops</mark> our predecessors</strong> religiously considering this, and wholesomely providing for it, <strong>decided</strong> that no brother departing should name a cleric for executor or guardian; and if any one should do this, no offering should be made for him, nor any sacrifice be celebrated for his repose. For he <strong>does not deserve to be named at the altar of God in the prayer of the <mark>priests</mark>, who has wished to call away the <mark>priests</mark> and ministers from the altar</strong>. And therefore, since Victor, contrary to the rule lately made in council by the priests, has dared to appoint Geminius Faustinus, <strong><mark>a presbyter</mark></strong>, his executor, it is not allowed that any offering be made by you for his repose, nor any prayer be made in the church in his name, that so the decree of the priests, religiously and needfully made, may be kept by us; and, at the same time, an example be given to the rest of the brethren, <strong>that no one should call away to secular anxieties the <mark>priests</mark> and ministers of God who are occupied with the service of His altar and Church</strong>. For care will probably be taken in time to come that this happen not with respect to the person of clerics any more, if what has now been done has been punished.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-the-Clergy-and-People-Abiding-at-Furni-About-Victor-Who-Had-Made-the-Presbyter-Faustinus-a-Guardian">Epistle 65, to the clergy and people abiding at Furni, about Victor, who had made the presbyter Faustinus a guardian</a>)</p>
    <blockquote><p>Now the same scheme, the same overturning, is again brought about by <strong><mark>the five presbyters</mark></strong>, linked with Felicissimus, to the destruction of salvation, that God should not be besought, and that he who has denied Christ should not appeal for mercy to the same Christ whom he had denied; that after the fault of the crime, repentance also should be taken away; and that <strong>the Lord should not be appeased through <mark>bishops and priests</mark></strong>, but that <strong>the Lord’s <mark>priests</mark> being forsaken</strong>, a new tradition of a sacrilegious appointment should arise, contrary to the evangelical discipline. And although it was once arranged as well by us as by the confessors and the city clergy, and moreover by all the <strong><mark>bishops</mark></strong> appointed either in our province or beyond the sea, that no novelty should be introduced in respect of the case of the lapsed unless we all assembled into one place, and our counsels being compared, should decide upon a moderate sentence, tempered alike with discipline and with mercy;—against this our counsel they have rebelled, and <strong><mark>all priestly authority and power is destroyed</mark></strong> by factious conspiracies.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-1#HH-To-the-People-Concerning-Five-Schismatic-Presbyters-of-the-Faction-of-Felicissimus">Epistle 39, to the people, concerning five schismatic presbyters of the faction of Felicissimus</a>)</p>
    <blockquote><p>He long ago feared this consciousness of crime. On account of this he regarded it as certain that he would <strong>not only be turned out of the <mark>presbytery</mark>, but restrained from communion</strong>; and by the urgency of the brethren, the day of investigation was coming on, on which his cause was to be dealt with before us, if the persecution had not prevented. He, welcoming this, with a sort of desire of escaping and evading condemnation, committed all these crimes, and wrought all this stir; so that he who was to be ejected and excluded from the Church, <strong>anticipated the <mark>judgment of the priests</mark> by a voluntary departure</strong>, as if to have anticipated the sentence were to have escaped the punishment.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-Cyprians-Answer-to-Cornelius-Concerning-the-Crimes-of-Novatus">Epistle 48, to Cornelius, concerning the crimes of Novatus</a>)</p>
    <p>And further, many other similar references to the priesthood.</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
