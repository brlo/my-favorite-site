  body: '<h2>1st century</h2><h3>The Didache (late 1st – early 2nd c.)</h3><blockquote><p>“<strong>In
    the church you shall acknowledge your transgressions</strong>, and you shall not
    come near for your prayer with an evil conscience. This is the way of life. &lt;…&gt;
    But every Lord’s day gather yourselves together, and break bread, and give thanksgiving
    after having <strong>confessed your transgressions</strong>, that your sacrifice
    may be pure.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Didache#HH-4">The
    Didache, 4, 14</a>)</p><h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr
    (c. 200–258)</h3><blockquote><p>All these warnings being scorned and contemned,—<strong><mark>before
    their sin is expiated, before confession has been made of their crime, before
    their conscience has been purged by sacrifice and by the hand of the priest</mark></strong>,
    before the offence of an angry and threatening Lord has been appeased, violence
    is done to His body and blood; and they sin now against their Lord more with their
    hand and mouth than when they denied their Lord. They think that that is peace
    which some with deceiving words are blazoning forth: that is not peace, but war.</p><p>…</p><p><strong>I
    entreat</strong> you, beloved brethren, <strong>that each one should <mark>confess
    his own sin</mark>, while he who has sinned is still in this world, <mark>while
    his confession may be received</mark>, while the satisfaction and remission <mark>made
    by the priests</mark> are pleasing to the Lord.</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-on-the-lapsed">On the Lapsed</a>)</p>'
