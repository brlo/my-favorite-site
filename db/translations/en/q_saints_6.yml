- src: AmLweto1_Благодать_через_священство
  path: Grace-through-the-unworthy
  title: The action of grace through the unworthy
  menu:
    parent: Sacraments of the Church/Priesthood
    title: The action of grace through the unworthy
    priority: 10
  body: |
    <h2>4th century</h2>
    <h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3>
    <blockquote><p>And how calleth he those “carnal,” who had attained so large a measure of the Spirit; and into whose praises, at the beginning he had entered so much at large? Because they also were carnal, unto whom the Lord saith, (St. Matt. 7:22–23.) “Depart from Me, ye workers of iniquity, I know you not;” and yet they both cast out devils, and raised the dead, and uttered prophecies. <strong>So that it is possible even for one who wrought miracles to be carnal. For so God wrought by Balaam, and unto Pharaoh He revealed things to come, and unto Nebuchadnezzar; and Caiaphas prophesied, not knowing what he said; yea, and some others cast out devils in His name, though they were (Luke 9:49.) “not with Him;” <mark>since not for the doers’ sake are these things done, but for others’ sake</mark>: <mark>nor is it seldom, that those who were positively unworthy have been made instrumental to them</mark>. Now why wonder, if in the case of unworthy men these things are done for others’ sake, seeing that so it is, even when they are wrought by saints?</strong></p>
    <p>For Paul saith, (1 Cor. 3:22.) “All things are yours; whether Paul, or Apollos, or Cephas, or life, or death:” and again, (Eph. 4:11–12.) “He gave some Apostles, and some Prophets, and some Pastors and Teachers, for the perfecting of the saints, unto the work of ministering.” For if it were not so, there would have been no security against universal corruption. <strong>For it may be that rulers are wicked and polluted, and their subjects good and virtuous; that laymen may live in piety, and priests in wickedness; and there could not have been either baptism, or the body of Christ, or oblation, through such, if in every instance grace required merit. But as it is, <mark>God uses to work even by unworthy persons, and in no respect is the grace of baptism damaged by the conduct of the priest</mark>: else would the receiver suffer loss. Accordingly, though such things happen rarely, still, it must be owned, they do happen. Now these things I say, lest any one of the bystanders busying himself about the life of the priest, should be offended as concerning the things solemnized (τὰ τελούμενα). <mark>“For man introduceth nothing into the things which are set before us, but the whole is a work of the power of God, and He it is who initiates (ὁ μυσταγωγῶν) you into the mysteries.”</mark></strong></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-1#HH-Homily-VIII">Homilies on First Corinthians, 8</a>)</p>
    <blockquote><p>And Magi moreover obtained a revelation (Matt. 2.); and Caiaphas prophesied, though a slayer of Christ, and an unworthy man, because of the worthiness of the priesthood. (John 11:49.) And it is said to have been for this reason that Aaron was not smitten with leprosy. For why, tell me, when both had spoken against Moses did his sister alone suffer the punishment? (Num. 12.) Marvel not: for if in worldly dignities, even though ten thousand charges be laid against a man, <strong>yet is he not brought to trial before he has laid down his office, in order that it may not be dishonored along with him; much more in the case of spiritual office, be he whosoever he may, the grace of God works in him, for otherwise everything is lost</strong>: but when he hath laid it down, either after he is departed or even here, then indeed, then he will suffer a sorer punishment. Do not, I pray you, think that these things are spoken from us; <strong><mark>it is the Grace of God which worketh in the unworthy, not for our sakes, but for yours</mark></strong>. Hear ye then what Christ saith. “If the house be worthy, let your peace come upon it.” (Matt. 10:13–15.) And how becometh it worthy? If “they receive you” (Luke 10:8.), He saith. “But if they receive you not, nor hear your words,…verily I say unto you, it shall be more tolerable for the land of Sodom and Gomorrah in the day of judgment, than for that city.” What boots it then, that ye receive us, and hear not the things we say? What gain is it that ye wait upon us, and give no heed to the things which are spoken to you? This will be honor to us, this the admirable service, which is profitable both to you and to us, if ye hear us. Hear also Paul saying, “I wist not, brethren, that he was High Priest.” (Acts 23:5.) Hear also Christ saying, “All whatsoever they bid you observe” (Matt. 23:3.), that “observe and do.” Thou despisest not me, but the Priesthood; when thou seest me stripped of this, then despise me; then no more will I endure to impose commands. But so long as we sit upon this throne, so long as we have the first place, we have both the dignity and the power, even though we are unworthy. If the throne of Moses was of such reverence, that for its sake they were to be heard, much more the throne of Christ.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-colossians-1#HH-Colossians-115-18">Homilies on Colossians, 3</a>)</p>
    <blockquote><p>“Lord! have we not prophesied in Thy name?” Why then dost Thou now turn away from us? What is the meaning of this strange and unexpected end? But <strong>let them marvel that, having worked so many miracles, they were punished; do not thou marvel. All that grace was nothing other than the gift of Him who gave it, and they contributed nothing of themselves</strong>, wherefore they are justly punished, since they became ungrateful and insensible before Him who so honored them that He gave them, though unworthy, the grace of working miracles. <strong>“Then,” thou sayest, “did they work miracles while committing works of impiety?” Some say that they were not impious at the time when they worked miracles, but afterward became corrupt and committed crimes. But this too is entirely contrary to the Saviour’s intention; He wished to show that neither faith nor miracles mean anything without a virtuous life.</strong> The same also Paul says: “Though I have the gift of prophecy, and understand all mysteries, and all knowledge, and though I have all faith, so that I could remove mountains, and have not love, I am nothing” (1 Cor. 13:2). Who then, thou askest, are those whom Jesus Christ, despite their miracles, presents as worthy of punishment? Many of those who believed received gifts: <strong>such was he who cast out demons without being a follower of Jesus Christ; such was Judas too, for he also, being wicked, had the gift of working miracles. The same may be found in the Old Testament also, namely, that <mark>grace often worked in the unworthy, for the benefit of others</mark></strong>. Since not all were capable of all things, but some led a blameless life yet did not have such faith, while others were the opposite, the Lord both urged the former through the latter to show forth great faith, and called the latter through this ineffable gift to amendment.</p>
    <p>2. This is why the Lord gave grace in great abundance. “We have worked many miracles,” they say. “And then will I declare to them: I never knew you”: that is, now they consider themselves My friends, but then they will learn that I gave them grace not as to friends. And why marvel that He gave the gifts of grace to people who believed in Him but did not have a life in accordance with faith, when He is shown to have worked even in those who had neither the one nor the other? Thus <strong>Balaam was a stranger both to faith and to a virtuous life; and yet grace worked in him for the ordering of the salvation of others. Pharaoh was the same; yet to him too God showed the future (Gen. 41). To Nebuchadnezzar, the most lawless of men, He also revealed what was to happen after many generations; and to his son too, who surpassed his father in impiety, He revealed the future — and all for the wondrous and great works of His providence (Dan. 2)</strong>. Therefore, since even then, <strong>at the beginning of the Gospel preaching, many proofs of Christ’s power were needed, many even from among the unworthy received gifts</strong>. Moreover, <strong>from such miracles they received no benefit for themselves, but only brought upon themselves a still greater punishment</strong>. Therefore the Saviour uttered to them that fearful word: “I never knew you!” Thus He already hates many even here, and turns away from them even before the judgment. Therefore, beloved, let us be afraid, and apply great diligence to our life, and <strong>let us not think that because we do not now work miracles, we therefore have less grace</strong>. From miracles nothing will ever be added to us, just as nothing will be taken away from us by the fact that we do not work them, if only we care for every virtue.</p></blockquote>
    <p>(Homilies on the Gospel of Saint Matthew, 24)</p>
    <blockquote><p>“And the God of peace Himself sanctify you wholly; and may your spirit and soul and body be preserved entire, without blame at the coming of our Lord Jesus Christ” (1 Thess. 5:23). Observe the affection of the Teacher. After the admonition he adds a prayer; not only that, but even introduces it in his letter. For we need both counsel and prayer. For this reason we also first giving you counsel, then offer prayers for you. And this the Initiated know. But Paul indeed did this with good reason, having great confidence towards God, whereas we are confounded with shame, and have no freedom of speech. But because we were appointed to this we do it, <strong>being unworthy even to stand in His presence, and to hold the place of the lowest disciples. But because <mark>grace works even through the unworthy, not for our own sakes but for theirs who are about to be benefited</mark>, we contribute our parts</strong>. “Sanctify you wholly,” he says, and may “your spirit and soul and body be preserved entire, without blame at the coming of our Lord Jesus Christ.”</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-thessalonians#HH-1-Thessalonians-519-22">Homilies on First Thessalonians, 11</a>)</p>
    <blockquote><p>&lt;…&gt; Let us listen now with fear, that we may not then listen with vengeance: “Depart from Me” (He says); “I never knew you” (Matt. 7:23), no not even then (He means) when ye made a display of prophesyings, and were casting out demons. It is probable that He also here hints at something else, that even then they were wicked; and from the beginning, <strong><mark>grace wrought even by the unworthy</mark>. For if it wrought through Balaam, much more through the unworthy, <mark>for the sake of those who shall profit [by it]</mark></strong>. But if even signs and wonders did not avail to deliver from punishment; much more, if a man happen to be in the priestly dignity: even if he reach the highest honor, even if <strong><mark>grace work in him to ordination, even if unto all the other things</mark></strong>, for the sake of those who need his leadership, he also shall hear, “I never knew thee,” no, not even then when grace wrought in thee.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-epistle-to-the-hebrews-3#HH-Hebrews-111316">Homilies on the Epistle to the Hebrews, 24</a>)</p>
    <blockquote><p>“He that receiveth you,” He saith, “receiveth Me” (Matt. 10:40). <strong>“Hold my priests in honor” (Sir. 7:31?)</strong>, He says. The Jews learned to despise God, because they despised Moses, and would have stoned him. For when a man is piously disposed towards the Priest, he is much more so towards God. And even if the Priest be wicked, God seeing that thou respectest him, though unworthy of honor, through reverence to Him, will Himself reward thee. For if “he that receiveth a prophet in the name of a prophet shall receive a prophet’s reward” (Matt. 10:41); then he who honoreth and submitteth and giveth way to the Priest shall certainly be rewarded. For if in the case of hospitality, when thou knowest not the guest, thou receivest so high a recompense, <strong>much more wilt thou be requited, if thou obeyest him whom He requires thee to obey</strong>. “The Scribes and Pharisees,” He says, “sit in Moses’ seat; all therefore, whatsoever they bid you observe, that observe and do, but do not ye after their works” (Matt. 23:2–3). Knowest thou not <strong>what the Priest is? He is an Angel of the Lord. Are they his own words that he speaks? If thou despisest him, thou despisest not him, but God that ordained him. But how does it appear, thou askest, that he is ordained of God? Nay, if thou suppose it otherwise, thy hope is rendered vain. For if God worketh nothing through his means, thou neither hast any Laver, nor art partaker of the Mysteries, nor of the benefit of Blessings; thou art therefore not a Christian</strong>.</p>
    <p><strong>3. What then, you say, does God ordain all, even the unworthy? God indeed doth not ordain all, but <mark>He worketh through all, though they be themselves unworthy, that the people may be saved</mark>. For if He spoke, for the sake of the people, by an ass, and by Balaam, a most wicked man, much more will He speak by the mouth of the Priest.</strong> What indeed will not God do or say for our salvation? By whom doth He not act? For if He wrought through Judas and those other that “prophesied,” to whom He will say, “I never knew you; depart from Me, ye workers of iniquity” (Matt. 7:22–23.); and if others “cast out devils” (Ps. 6:8.); will He not much more work through the Priests?</p>
    <p>&lt;…&gt;</p>
    <p>For if we may not judge our brother, much less our teacher. If God commands this indeed, thou doest well, and sinnest if thou do it not; but if the contrary, dare not do it, nor attempt to go beyond the lines that are marked out. <strong>After Aaron had made the golden calf, Corah, Dathan, and Abiram raised an insurrection against him. And did they not perish? Let each attend to his own department. For if he teach perverted doctrine, though he be an Angel, obey him not; but if he teach the truth, take heed not to his life, but to his words</strong>. Thou hast Paul to instruct thee in what is right both by words and works. <strong><mark>But thou sayest, “He gives not to the poor, he does not govern well.” Whence knowest thou this? Blame not, before thou art informed. Be afraid of the great account. Many judgments are formed upon mere opinion</mark></strong>. Imitate thy Lord, who said, “I will go down now, and see whether they have done altogether according to the cry of it, and if not, I will know” (Gen. 18:21). But if thou hast enquired, and informed thyself, and seen; yet await the Judge, and usurp not the office of Christ. To Him it belongs, and not to thee, to make this inquisition. Thou art an inferior servant, not a master. Thou art a sheep, <strong>be not curious concerning the shepherd, lest thou have to give account of thy accusations against him</strong>. But you say, How does he teach me that which he does not practice himself? It is not he that speaks to thee. If it be he whom thou obeyest, thou hast no reward. It is Christ that thus admonishes thee. And what do I say? Thou oughtest not to obey even Paul, if he speaks of himself, or anything human, but the Apostle, that has Christ speaking in him. Let not us judge one another’s conduct, but each his own. Examine thine own life. But thou sayest, “He ought to be better than I.” Wherefore? “Because he is a Priest.” And is he not superior to thee in his labors, his dangers, his anxious conflicts and troubles? But if he is not better, oughtest thou therefore to destroy thyself? These are the words of arrogance. For how is he not better than thyself? He steals, thou sayest, and commits sacrilege! How knowest thou this? Why dost thou cast thyself down a precipice? If thou shouldest hear it said that such an one hath a purple robe, though thou knewest it to be true, and couldest convict him, thou declinest to do it, and pretendest ignorance, not being willing to run into unnecessary danger. But in this case thou art so far from being backward, that even without cause thou exposest thyself to the danger. Nor think thou art not responsible for these words. Hear what Christ says, “Every idle word that men shall speak, they shall give account thereof in the day of judgment” (Matt. 12:36). <strong><mark>And dost thou think thyself better than another, and dost thou not groan, and beat thy breast, and bow down thy head, and imitate the Publican?</mark> And then thou destroyest thyself, though thou be better. Be silent, that thou cease not to be better. If thou speak of it, <mark>thou hast done away the merit</mark>; if thou thinkest it, I do not say so; if thou dost not think it, thou hast added much.</strong> For if a notorious sinner, when he confessed, “went home justified,” he who is a sinner in a less degree, and is conscious of it, how will he not be rewarded? Examine thy own life. Thou dost not steal; but thou art rapacious, and overbearing, and guilty of many other such things. I say not this to defend theft; God forbid! deeply lament if there is any one really guilty of it, but I do not believe it. How great an evil is sacrilege, it is impossible to say. But I spare you. For I would not that our virtue should be rendered vain by accusing others. What was worse than the Publican? For it is true that he was a publican, and guilty of many offenses, yet <strong>because the Pharisee only said, “I am not as this publican,” he destroyed all his merit. I am not, thou sayest, like this sacrilegious Priest</strong>. And dost not thou make all in vain? <strong>This I am compelled to say, and to enlarge upon in my discourse, not so much because I am concerned for them, but because I fear for you</strong>, lest you should render your virtue vain by this boasting of yourselves, and condemnation of others. For hear the exhortation of Paul, “Let every one prove his own work, and then shall he have rejoicing in himself alone, and not in another” (Gal. 6:4).</p>
    <p><strong>4. If you had a wound, tell me, and should go to a physician, would you stay him from salving and dressing your own wound, and be curious to enquire whether the physician had a wound, or not?</strong> and if he had, would you mind it? Or because he had it, would you forbear dressing your own, and say, <strong>A physician ought to be in sound health, and since he is not so, I shall let my wound go uncured?</strong> <strong><mark>For will it be any palliation for him that is under rule, that his Priest is wicked? By no means.</mark></strong> He will suffer the destined punishment, and you too will meet with that which is your due. For the Teacher now only fills a place. For “it is written, They shall all be taught of God” (John 6:45; Isa. 54:13). “Neither shall they say, Know the Lord. For all shall know Me from the least to the greatest” (Jer. 31:34). Why then, you will say, does he preside? Why is he set over us? I beseech you, let us not speak ill of our teachers, nor call them to so strict an account, lest we bring evil upon ourselves. Let us examine ourselves, and we shall not speak ill of others. Let us reverence that day, on which he enlightened us. <strong>He who has a father, whatever faults he has, conceals them all. For it is said, “Glory not in the dishonor of thy father; for thy father’s dishonor is no glory unto thee. And if his understanding fail, have patience with him.” (Sir. 3:10–12.) And if this be said of our natural fathers, much more of our spiritual fathers.</strong> Reverence him, in that he every day ministers to thee, causes the Scriptures to be read, sets the house in order for thee, watches for thee, prays for thee, stands imploring God on thy behalf, offers supplications for thee, for thee is all his worship. Reverence all this, think of this, and approach him with pious respect. Say not, he is wicked. What of that? He that is not wicked, doth he of himself bestow upon thee these great benefits? By no means. Everything worketh according to thy faith. <strong><mark>Not even the righteous man can benefit thee, if thou art unfaithful, nor the unrighteous harm thee, if thou art faithful</mark></strong>. God, when He would save His people, wrought for the ark by Oxen. (1 Sam. 6:12) Is it the good life or the virtue of the Priest that confers so much on thee? <strong><mark>The gifts which God bestows are not such as to be effects of the virtue of the Priest. All is of grace. His part is but to open his mouth, while God worketh all: the Priest only performs a symbol.</mark></strong> Consider how wide was the distance between John and Jesus. Hear John saying, “I have need to be baptized of Thee” (Matt. 3:14.), and, “Whose shoe’s latchet I am not worthy to unloose.” (John 1:27.) Yet notwithstanding this difference, the Spirit descended. Which John had not. For “of His fullness,” it is said, “we all have received.” (John 1:16.) <strong>Yet nevertheless, It descended not till He was baptized</strong>. But neither was it John who caused It to descend. Why then is this done? That thou mayest learn that the Priest performs a symbol. No man differs so widely from another man, as John from Jesus, and yet with him the Spirit descended, that we may learn, that <strong><mark>it is God who worketh all, that all is God’s doing</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-second-timothy#HH-2-Timothy-18-10">Homilies on Second Timothy, 2</a>)</p>
