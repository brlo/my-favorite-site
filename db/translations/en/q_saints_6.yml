- src: O8yG_Грех_непрощения
  path: The-sin-of-unforgiveness
  title: The sin of unforgiveness
  menu:
    parent: Awaiting distribution
    title: The sin of unforgiveness
    priority: 100
  body: "<h3>St Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p>If a quarrel
    happens between two brothers, then the first to repent will receive the crown
    of victory, but the other is also crowned if he does not reject repentance, but
    readily does what is needed for peace.</p></blockquote><p>(In imitation of the
    parables)</p><h3>Kiev Caves Patericon</h3><blockquote><p><em>There were two brothers
    in the spirit, the deacon Evagrius and the priest Titus. They had a great and
    unfeigned love for each other. But the devil stirred up enmity between them, and
    they quarrelled. And he put such hatred into them that they did not even want
    to see each other. Many times the brethren asked them to make peace, but they
    would not even hear of it. When Titus went with the censer, Evagrius ran away
    from the incense; and when Evagrius did not run away, Titus would pass by without
    censing anyone. For a long time they remained in the darkness of sin; they even
    approached the Mysteries of Christ — Titus without asking forgiveness, and Evagrius
    in anger. One day Titus became very ill, and being already at death’s door, he
    began to grieve over his transgression and sent to the deacon with the plea: “Forgive
    me, for God’s sake, my brother, I was angry with you without cause.” But Evagrius
    answered with cruel words and curses. The elders, seeing that Titus was dying,
    forcibly dragged Evagrius to reconcile him with his brother. When he saw him,
    the sick man fell at Evagrius’s feet and said: “Forgive me and bless me, my father!”
    But he, merciless and fierce, refused before all: “I never want to be reconciled
    with him, neither in this age nor in the age to come.” Then Evagrius tore himself
    from the hands of the elders and suddenly fell. The fathers wanted to raise him,
    but they saw that he was already dead. And they could neither fold his hands nor
    close his mouth, as with a man long dead. All were horrified. Father Titus immediately
    got up, as if he had never been ill. With much weeping they buried Evagrius. His
    mouth and eyes remained open, and his hands outstretched. Then Father Titus told
    the brethren: “I saw the angels who had withdrawn from me, and the demons rejoicing
    at my anger. And then I began to beg my brother to forgive me. When they brought
    him to me, I saw a merciless angel with a fiery spear, and when Evagrius did not
    forgive me, he struck him, and he fell dead. But the angel gave me his hand and
    raised me up.” Hearing this, the brethren feared God, who said: forgive, and you
    will be forgiven </em>(Luke 6:37). For the Lord said: “Whoever is angry with his
    brother without cause shall be subject to judgment.” And Ephrem says: “If anyone
    happens to die in enmity, the inexorable judgment awaits such.”</p><p>And if this
    Evagrius, for the sake of the holy Anthony and Theodosius, does not receive forgiveness
    — woe, bitter woe to him, conquered by such a passion!</p><p><em>To Polycarp</em>.
    Beware of it too, brother, and do not give place to the demon of anger: whoever
    submits to him is enslaved by him. But rather go and bow down to the one who has
    enmity against you, lest you be handed over to the merciless angel, and may the
    Lord preserve you from all anger. For He said: “Let not the sun go down on your
    wrath.” Glory to Him with the Father and the Holy Spirit, now and ever!</p></blockquote><p>(Kiev
    Caves Patericon)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
