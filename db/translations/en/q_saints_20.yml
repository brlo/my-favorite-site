    title: The choice and sending of the apostles
    priority: 1
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>“As
    Thou hast sent Me into the world, even so have I sent them into the world”</strong>
    (John 17:18; cf. John 20:21), – that is, “as by the eternal purpose of God” (Eph.
    3:11; Heb. 10:7) the Son of God was sent into the world, so by the same purpose
    were the apostles sent by Him.</p><p>The apostles chosen by the Lord were witnesses
    of His deeds during all the days of His earthly ministry; to them alone He opened
    “the mysteries of the kingdom of heaven” (Matt. 13:11; Mark 4:11, 33; Acts 1:3),
    that is, the hidden truths concerning the Church, and to them55 (and not to the
    community of believers) He transmitted His powers directly from Himself:</p><p><strong><mark>a)
    to teach</mark> the divine truths</strong>: “then the eleven disciples went away
    into Galilee... and when they saw Him, Jesus said unto them: all power is given
    unto Me in heaven and in earth; go ye therefore, and teach all nations” (Matt.
    28:16, 18–19). “Afterwards He appeared unto the eleven... and said unto them:
    go ye into all the world, and preach the Gospel to every creature” (Mark 16:14–15).
    “Ye shall be witnesses (of My life, My teaching, My deeds, or, what is the same,
    preachers of the Gospel) unto Me both in Jerusalem, and in all Judaea, and in
    Samaria, and even unto the uttermost part of the earth” (Acts 1:8).</p><p><strong><mark>b)
    to perform the sacred rites</mark>, that is, to sanctify the believers with the
    divine sacraments</strong>. “Go ye therefore, and teach all nations, baptizing
    them in the name of the Father, and of the Son, and of the Holy Spirit” (Matt.
    28:19). “This (the sacrament of holy Communion) do in remembrance of Me” (Luke
    22:19). “And when He had said this, He breathed on them, and saith unto them:
    receive ye the Holy Spirit. Whose soever sins ye forgive, they are forgiven; and
    whose soever sins ye retain, they are retained” (John 20:22–23).</p><p><strong><mark>c)
    to govern</mark>, that is, to guide and direct the believers towards the attainment
    of salvation</strong>. “Jesus saith unto him (Peter): feed My lambs (that is,
    the members of the Church inexperienced in spiritual life)... feed My sheep” (the
    members more perfect in spiritual life), – that is, care for, govern the believers
    (John 21:15–17). “Verily I say unto you: whatsoever ye shall bind on earth shall
    be bound in heaven; and whatsoever ye shall loose on earth shall be loosed in
    heaven” (Matt. 18:18; cf. John 20:22–23). Here we speak of the power of judgment
    over the believers with the right to subject the guilty to punishment (cf. Matt.
    18:17).</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>"
