- src: YQixalrC_Служение_апостолов
  path: The-ministry-of-the-apostles
  title: The ministry of the apostles
  menu:
    parent: Composition of the Church
    title: The ministry of the apostles
    priority: 2
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Having
    received the Holy Spirit on the day of Pentecost (Acts 2:1–4), <strong>the apostles
    set about the performance of their ministry with the consciousness that their
    powers for it came from the Lord Jesus Christ Himself, and not from any Christian
    community, and that they were responsible not before it, but before God</strong>.</p><p>“Peter,
    an apostle of Jesus Christ” (1 Pet. 1:1). “Paul – an apostle, not of men, neither
    by man, but by Jesus Christ and God the Father” (Gal. 1:1; cf. Rom. 1:1). “So
    then every one of us must be regarded by you as ministers of Christ” (1 Cor. 4:1).
    “Now then we are ambassadors for Christ, as though God did beseech you by us:
    we pray you in Christ's stead, be ye reconciled to God” (2 Cor. 5:20; cf. Eph.
    4:11; 1 Cor. 12:28). “For if I should boast somewhat more of our power, which
    the Lord hath given us for edification, and not for your destruction, I should
    not be ashamed” (2 Cor. 10:8). “But with me it is a very small thing that I should
    be judged of you, or of man's judgment... he that judgeth me is the Lord” (1 Cor.
    4:3–4; cf. Acts 4:19).</p><p><strong>The apostles, vested with hierarchical power
    by the Lord, at first alone taught, performed the worship and governed (Acts 2:14–47,
    5:1–12; 6:2–3, 8); and as the Church grew they (by the divine command) themselves,
    and not the community, set apart persons chosen from among the believers</strong>;
    they set them apart through a special sacred action – the laying on of hands joined
    with prayer, for this or that ministry of the Church.</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
