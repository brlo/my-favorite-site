  body: '<h2>1st century</h2><h3>Clement of Rome, hieromartyr († c. 101)</h3><blockquote><p><em>And
    </em><strong><em><mark>our apostles</mark></em></strong><em> also knew, through
    our Lord Jesus Christ, that there would be strife on account of the office of
    the episcopate. For this reason, therefore, inasmuch as they had obtained a perfect
    fore-knowledge of this, </em><strong><em><mark>they appointed those [ministers]
    already mentioned</mark>, and afterwards gave instructions, <mark>that when these
    should fall asleep</mark>, other approved <mark>men should succeed them in their
    ministry</mark></em></strong><em>. We are of opinion, therefore, that those appointed
    by them, or afterwards by other eminent men, with the consent of the whole Church,
    and who have blamelessly served the flock of Christ in a humble, peaceable, and
    disinterested spirit, and have for a long time possessed the good opinion of all,
    cannot be justly dismissed from the ministry.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-44">First
    Epistle to the Corinthians, ch. 44</a>)</p><blockquote><p><strong><em>The apostles
    have preached the Gospel to us</em></strong><em> </em><strong><em>from the Lord
    Jesus Christ</em></strong><em>, </em><strong><em>Jesus Christ from God</em></strong><em>.
    </em><strong><em><mark>Christ therefore was sent forth by God, and the apostles
    by Christ</mark></em></strong><em>; both these appointments, then, were made in
    an orderly way, according to the will of God. Having therefore received their
    orders, and being fully assured by the resurrection of our Lord Jesus Christ,
    and established in the word of God, with full assurance of the Holy Ghost, </em><strong><em><mark>they</mark></em></strong><em>
    went forth proclaiming that the kingdom of God was at hand. And thus preaching
    through countries and cities, they </em><strong><em><mark>appointed the first-fruits,
    having first proved them by the Spirit, to be bishops and deacons</mark></em></strong><em>
    of those who should afterwards believe.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-42">First
    Epistle to the Corinthians, ch. 42</a>)</p><h2>3rd century</h2><h3>St Cyprian
    of Carthage, hieromartyr (c. 200–258)</h3><p>From the reply of bishop Firmilian
    to bishop Cyprian:</p><blockquote><p><em>And again, in the Gospel, when Christ
    breathed on the apostles alone, saying, “Receive ye the Holy Ghost: whose soever
    sins ye remit they are remitted unto them, and whose soever sins ye retain they
    are retained.” Therefore </em><strong><em><mark>the power of remitting sins was
    given to the apostles</mark></em></strong><em>, and to the churches which they,
    sent by Christ, established, </em><strong><em>and to <mark>the bishops</mark>
    who <mark>succeeded to them by vicarious ordination</mark></em></strong><em>.
    But the enemies of the one Catholic Church in which we are, and the adversaries
    of us who have succeeded the apostles, asserting for themselves, in opposition
    to us, unlawful priesthoods, and setting up profane altars, what else are they
    than Korah, Dathan, and Abiram, profane with a like wickedness</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-Firmilian-Bishop-of-Cæsarea-in-Cappadocia-to-Cyprian-Against-the-Letter-of-Stephen-AD-256">Letter
    from bishop Firmilian</a>)</p><h2>18th century</h2><h3>Epistle of the Patriarchs
    (1723)</h3><blockquote><p><em>We declare that </em>the dignity of <strong><mark>the
    Bishop</mark></strong> is so necessary in the Church, that without him, neither
    Church nor Christian could either be or be spoken of. For he, as <strong><mark>a
    successor of the Apostles, having received in continued succession by the imposition
    of hands and the invocation of the All-holy Spirit the grace that is given him
    of the Lord of binding and loosing</mark></strong>, is a living image of God upon
    the earth, and by a most ample participation of the operation of the Holy Spirit,
    who is the chief functionary [of the Mysteries], is a fountain of all the Mysteries
    of the Catholic Church, through which we obtain salvation. And he is, we suppose,
    <em>as necessary to the Church as breath is to man, or the sun to the world.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decree
    10</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>The
    apostles transmitted all the fulness of their hierarchical power <strong>not to
    the community of Christians</strong>, but only to their successors, the bishops:</p><p><strong>a)
    the power of teaching</strong>. “These things <em>command and teach</em>... give
    attendance to reading, to exhortation, to doctrine... Take heed unto thyself,
    and unto the doctrine; continue in them.” (1 Tim. 4:11–16). “Preach the word;
    be instant in season, out of season” (2 Tim. 4:2; cf. Tit. 1:9). “Study to shew
    thyself approved unto God, a workman that needeth not to be ashamed, rightly dividing
    the word of truth” (2 Tim. 2:15).</p><p><strong>b) the power of the sacred rites</strong>:
    to choose and set apart, through sacred ordination, persons worthy of the service
    of the Church, after examination and assurance of their moral qualities (1 Tim.
    3:2–12, 5:22; Tit. 1:5–9).</p><p><strong>c) the power of governing the Church</strong>.
    “These things <em>w</em>rite I unto thee, that if I tarry long, thou (and not
    the community) mayest know how thou oughtest to behave thyself in the house of
    God, which is the Church of the living God” (1 Tim. 3:14–15). “Rebuke, forbid
    (by the right of a chief), exhort with all longsuffering and doctrine” (the property
    of the spiritual guide – 2 Tim. 4:2). The bishops are set to oversee the Church,
    to guide it (Acts 20:28; 1 Pet. 5:1–5), to administer judgment (1 Tim. 5:17–19).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: kCelXgHw_Назначение_иерархии
  path: The-purpose-of-the-hierarchy
  title: The purpose of the hierarchy
  menu:
    parent: Composition of the Church
    title: The purpose of the hierarchy
    priority: 5
  body: <h2>4th century</h2><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>The
    well-being of a Church depends upon the dignity of <strong><mark>its chief-priest,
    and unless some extraordinary and unique functions be assigned to him, we shall
    have as many schisms in the Churches as there are priests</mark></strong>. Hence
    it is that without ordination and the bishop’s license neither presbyter nor deacon
    has the power to baptize.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians">The
    Dialogue against the Luciferians</a>)</p><h2>18th century</h2><h3>Epistle of the
    Patriarchs (1723)</h3><blockquote><p><em>We declare that </em>the dignity of <strong><mark>the
    Bishop</mark></strong> is so necessary in the Church, that without him, neither
    Church nor Christian could either be or be spoken of. For he, as <strong><mark>a
    successor of the Apostles, having received in continued succession by the imposition
    of hands and the invocation of the All-holy Spirit the grace that is given him
    of the Lord of binding and loosing</mark></strong>, is a living image of God upon
    the earth, and by a most ample participation of the operation of the Holy Spirit,
    who is the chief functionary [of the Mysteries], is a fountain of all the Mysteries
    of the Catholic Church, through which we obtain salvation. And he is, we suppose,
    <em>as necessary to the Church as breath is to man, or the sun to the world.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decree
    10</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“<strong><em>H</em>e
    (Jesus Christ) <em>gave some, apostles; and some, prophets; and some, evangelists;
    and some, pastors and teachers; <mark>for the perfecting of the saints</mark>,
    for the work of the ministry, for the edifying of the Body of Christ</em></strong><em>”,</em>
    (the spiritual growth and strengthening of the believers is attained through the
    pastoral ministry, that is, through teaching, governing, spiritual guidance and
    sanctification by the sacraments), “till we all come in the unity of the faith,
    and of the knowledge of the Son of God” (that is, into a single understanding,
    knowledge of the object of the faith – the Son of God; – Eph. 4:11–13; cf. Col.
    2:3), “unto a perfect man” (perfect in the faith and in the Christian life – Heb.
    5:13–14; 1 Cor. 2:6, 3:1), “unto the measure of the stature of the fulness of
    Christ” (unto the measure of spiritual age, possessing the fulness of the grace
    of Christ), “that we henceforth be no more children” (Eph. 4:11–16), that is,
    that under pastoral guidance, with the sanctification of the Holy Spirit through
    the sacraments, we should be strong and steadfast in the faith, not tossed to
    and fro like children by every wind of false teaching, and, remaining steadfast
    in love, grow in communion with Christ, and through Him – with God the Father
    (John 14:6).</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: c5XxHdFl_Иерархия_пребудет_в_Церкви_до_скончания_века
  path: The-hierarchy-will-abide-to-the-end
  title: The hierarchy will abide in the Church to the end of the age
  menu:
    parent: Composition of the Church
    title: The hierarchy will abide to the end of the age
    priority: 6
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Transmitting
    authority to the apostles, Jesus Christ said: “and lo (behold), I am with you
    all the days, unto the end of the age” (Matt. 28:20), – that is, He promised that
    His Church would always abide until the end of the age under His immediate invisible
    guidance as its Head, who quickens and preserves it, and that He would be together
    with the Holy Spirit (John 14:16) the co-builder of the salvation of man. These
    <strong>promises (Matt. 28:20 and John 14:16) could not relate to the apostles
    alone, since the latter could not live on earth until the end of the age, but
    to all their successors. <mark>In these promises the Lord evidently expressed
    His will, that His authority should continue in the Church successively from the
    apostles until the end of the age</mark></strong>. “This Gospel of the kingdom
    shall be preached in all the world, for a witness unto all nations; and then shall
    the end come” (Matt. 24:14), – that is, the divinely established authority of
    teaching (cf. Rom. 10:14–15) will continue until the coming of Christ. “For <strong>as
    often as ye eat this bread, and drink this cup, ye do shew the Lord's death <mark>till
    He come” (1 Cor. 11:26), – that is, the sacrament of communion, and consequently
    its divinely established celebrants, will be until the second coming of the Lord</mark></strong>.
    From the Epistle to the Ephesians (Eph. 4:11–14) it is evident that the hierarchical
    ministry will continue to the end of the world, since in the Church there are
    always members who have not attained the unity of the faith and spiritual perfection,
    who need instruction, pastoral guidance and protection from crafty seducers. The
    danger to the believers from false teachers will be until the end of the age (Matt.
    24:5, 11–12; Mark 13:5; Luke 17:23, 21:8; 2 Pet. 2:1–2; 1 Tim. 4:1–3; 2 Thess.
    2:2–8), when the father of the seducers – the devil – will be “cast into the lake
    of fire and brimstone, where the beast and the false prophet are, and shall be
    tormented day and night for ever and ever” (Rev. 20:10).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: xmX7KaFW_Верующие_обязаны_оказывать_послушание_и_уважение
  path: Obedience-due-to-the-clergy
  title: The obedience of the faithful to the priesthood
  menu:
    parent: Composition of the Church
    title: Obedience to the hierarchy
    priority: 7
  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p>For, <strong>since ye <mark>are subject to the
    bishop</mark> as to Jesus Christ, ye appear to me to live not after the manner
    of men, but according to Jesus Christ</strong>, who died for us, in order, by
    believing in His death, ye may escape from death. It is therefore necessary that,
    as ye indeed do, <strong><mark>so without the bishop ye should do nothing, but
    should also be subject to the presbytery</mark>, as to the apostles of Jesus Christ</strong>,
    who is our hope, in whom, if we live, we shall be found. It is fitting also that
    <strong><mark>the deacons</mark>, as being the ministers of the mysteries of Jesus
    Christ, should in every respect be pleasing to all. For they are not ministers
    of meat and drink, but servants of the Church of God</strong>. They are bound,
    therefore, to avoid all grounds of accusation, as they would do fire.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-2">Epistle to the Trallians, ch.
    2</a>)</p><blockquote><p>See that ye all <strong><mark>follow the bishop</mark>,
    even as Jesus Christ does the Father, and <mark>the presbytery</mark> as ye would
    the apostles; and <mark>reverence the deacons</mark>, as being the institution
    of God</strong>. Let no man do anything connected with the Church without the
    bishop. <strong>Let that be deemed a proper Eucharist, which is either by the
    bishop, or by one to whom he has entrusted it. Wherever the bishop shall appear,
    there let the multitude also be</strong>; even as, wherever Jesus Christ is, there
    is the Catholic Church. <strong><mark>It is not lawful without the bishop either
    to baptize or to celebrate a love-feast; but whatsoever he shall approve of, that
    is also pleasing to God</mark></strong>, so that everything that is done may be
    secure and valid.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-8">Epistle
    to the Smyrnaeans, ch. 8</a>)</p><h2>4th century</h2><h3>St John Chrysostom, archbishop
    of Constantinople (c. 347–407)</h3><blockquote><p>Thou despisest not me, but the
    Priesthood; when thou seest me stripped of this, then despise me; then no more
    will I endure to impose commands. But <strong>so long as we sit upon this throne,
    so long as we have the first place, we have both the dignity and the power, even
    though we are unworthy. If the throne of Moses was of such reverence, that for
    its sake they were to be heard, much more the throne of Christ</strong>. It, we
    have received by succession; from it we speak; since the time that <strong>Christ
    hath vested in us the ministry of reconciliation</strong>. <strong><mark>Ambassadors,
    whatever be their sort, because of the dignity of an embassy, enjoy much honor.</mark></strong>
    For observe; they go alone into the heart of the land of barbarians, through the
    midst of so many enemies; and because the law of embassy is of mighty power, all
    honor them; all look towards them with respect, all send them forth with safety.
    And <strong><mark>we now have received a word of embassy, and we are come from
    God, for this is the dignity of the Episcopate</mark>. We are come to you on an
    embassy, requesting you to put an end to the war, and we say on what terms; not
    promising to give cities, nor so and so many measures of corn, nor slaves, nor
    gold; but the kingdom of heaven, eternal life, society with Christ, the other
    good things</strong>, which neither are we able to tell you, so long as we are
    in this flesh, and the present life.</p><p>Ambassadors then we are, and we wish
    to enjoy honor, not for our own sakes, far be it, for we know its worthlessness,
    but for yours; that ye may hear with earnestness the things we say; that ye may
    be profited, that not with listlessness or indifference ye may attend to what
    is spoken. See ye not ambassadors, how all pay court to them? <strong>We are God’s
    ambassadors to men; but, if this offend you, not we, but the Episcopate itself,
    not this man or that, but the Bishop.</strong> <strong><mark>Let no one hear me,
    but the dignity.</mark></strong> Let us then do everything according to the will
    of God, that we may live to the glory of God, and be counted worthy of the good
    things promised to those that love Him, through the grace and lovingkindness,
    &amp;c. &amp;c.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-colossians-1#HH-Colossians-216-19">Homilies
    on Colossians, Homily 3</a>)</p><blockquote><p>“He that receiveth you,” He saith,
    “receiveth Me.” (Matt. 10:40.) <strong>“Hold my priests in honor”</strong> (Sir.
    7:31?), He says. The Jews learned to despise God, because they despised Moses,
    and would have stoned him. For when a man is piously disposed towards the Priest,
    he is much more so towards God. And even if the Priest be wicked, God seeing that
    thou respectest him, though unworthy of honor, through reverence to Him, will
    Himself reward thee. For if “he that receiveth a prophet in the name of a prophet
    shall receive a prophet’s reward” (Matt. 10:41.); then he who honoreth and submitteth
    and giveth way to the Priest shall certainly be rewarded. For if in the case of
    hospitality, when thou knowest not the guest, thou receivest so high a recompense,
    <strong>much more wilt thou be requited, if thou obeyest him whom He requires
    thee to obey</strong>. “The Scribes and Pharisees,” He says, “sit in Moses’ seat;
    all therefore, whatsoever they bid you observe, that observe and do, but do not
    ye after their works.” (Matt. 23:2–3.) Knowest thou not <strong>what the Priest
    is? He is an Angel of the Lord. Are they his own words that he speaks? If thou
    despisest him, thou despisest not him, but God that ordained him. But how does
    it appear, thou askest, that he is ordained of God? Nay, if thou suppose it otherwise,
    thy hope is rendered vain. For if God worketh nothing through his means, thou
    neither hast any Laver, nor art partaker of the Mysteries, nor of the benefit
    of Blessings; thou art therefore not a Christian</strong>.</p><p><strong>What
    then, you say, does God ordain all, even the unworthy? God indeed doth not ordain
    all, but He worketh through all, though they be themselves unworthy, that the
    people may be saved. For if He spoke, for the sake of the people, by an ass, and
    by Balaam, a most wicked man, much more will He speak by the mouth of the Priest.</strong>
    What indeed will not God do or say for our salvation? By whom doth He not act?
    For if He wrought through Judas and those other that “prophesied,” to whom He
    will say, “I never knew you; depart from Me, ye workers of iniquity” (Matt. 7:22–23.);
    and if others “cast out devils” (Ps. 6:8.); will He not much more work through
    the Priests?</p><p>&lt;…&gt;</p><p>For if we may not judge our brother, much less
    our teacher. If God commands this indeed, thou doest well, and sinnest if thou
    do it not; but if the contrary, dare not do it, nor attempt to go beyond the lines
    that are marked out. <strong>After Aaron had made the golden calf, Corah, Dathan,
    and Abiram raised an insurrection against him. And did they not perish? Let each
    attend to his own department. For if he teach perverted doctrine, though he be
    an Angel, obey him not; but if he teach the truth, take heed not to his life,
    but to his words.</strong> Thou hast Paul to instruct thee in what is right both
    by words and works. <strong><mark>But thou sayest, “He gives not to the poor,
    he does not govern well.” Whence knowest thou this? Blame not, before thou art
    informed. Be afraid of the great account. Many judgments are formed upon mere
    opinion.</mark></strong> Imitate thy Lord, who said, “I will go down now, and
    see whether they have done altogether according to the cry of it, and if not,
    I will know.” (Gen. 18:21.) But if thou hast enquired, and informed thyself, and
    seen; yet await the Judge, and usurp not the office of Christ. To Him it belongs,
    and not to thee, to make this inquisition. Thou art an inferior servant, not a
    master. Thou art a sheep, <strong>be not curious concerning the shepherd, lest
    thou have to give account of thy accusations against him</strong>. But you say,
    How does he teach me that which he does not practice himself? It is not he that
    speaks to thee. If it be he whom thou obeyest, thou hast no reward. It is Christ
    that thus admonishes thee. And what do I say? Thou oughtest not to obey even Paul,
    if he speaks of himself, or anything human, but the Apostle, that has Christ speaking
    in him. Let not us judge one another’s conduct, but each his own. Examine thine
    own life. But thou sayest, “He ought to be better than I.” Wherefore? “Because
    he is a Priest.” And is he not superior to thee in his labors, his dangers, his
    anxious conflicts and troubles? But if he is not better, oughtest thou therefore
    to destroy thyself? These are the words of arrogance. For how is he not better
    than thyself? He steals, thou sayest, and commits sacrilege! How knowest thou
    this? Why dost thou cast thyself down a precipice? If thou shouldest hear it said
    that such an one hath a purple robe, though thou knewest it to be true, and couldest
    convict him, thou declinest to do it, and pretendest ignorance, not being willing
    to run into unnecessary danger. But in this case thou art so far from being backward,
    that even without cause thou exposest thyself to the danger. Nor think thou art
    not responsible for these words. Hear what Christ says, “Every idle word that
    men shall speak, they shall give account thereof in the day of judgment.” (Matt.
    12:36.) <strong><mark>And dost thou think thyself better than another, and dost
    thou not groan, and beat thy breast, and bow down thy head, and imitate the Publican?</mark>
    And then thou destroyest thyself, though thou be better. Be silent, that thou
    cease not to be better. If thou speak of it, <mark>thou hast done away the merit</mark></strong>;
    if thou thinkest it, I do not say so; if thou dost not think it, thou hast added
    much. For if a notorious sinner, when he confessed, “went home justified,” he
    who is a sinner in a less degree, and is conscious of it, how will he not be rewarded?
    Examine thy own life. Thou dost not steal; but thou art rapacious, and overbearing,
    and guilty of many other such things. I say not this to defend theft; God forbid!
    deeply lament if there is any one really guilty of it, but I do not believe it.
    How great an evil is sacrilege, it is impossible to say. But I spare you. For
    I would not that our virtue should be rendered vain by accusing others. What was
    worse than the Publican? For it is true that he was a publican, and guilty of
    many offenses, yet because <strong>the Pharisee only said, “I am not as this publican,”
    he destroyed all his merit. I am not, thou sayest, like this sacrilegious Priest</strong>.
    And dost not thou make all in vain? <strong>This I am compelled to say, and to
    enlarge upon in my discourse, not so much because I am concerned for them, but
    because I fear for you</strong>, lest you should render your virtue vain by this
    boasting of yourselves, and condemnation of others. For hear the exhortation of
    Paul, “Let every one prove his own work, and then shall he have rejoicing in himself
    alone, and not in another.” (Gal. 6:4.)</p><p><strong>If you had a wound, tell
    me, and should go to a physician, would you stay him from salving and dressing
    your own wound, and be curious to enquire whether the physician had a wound, or
    not?</strong> and if he had, would you mind it? Or because he had it, would you
    forbear dressing your own, and say, A physician ought to be in sound health, and
    <strong>since he is not so, I shall let my wound go uncured?</strong> <strong><mark>For
    will it be any palliation for him that is under rule, that his Priest is wicked?
    By no means.</mark></strong> He will suffer the destined punishment, and you too
    will meet with that which is your due. For the Teacher now only fills a place.
    For “it is written, They shall all be taught of God.” (John 6:45; Isa. 54:13.)
    “Neither shall they say, Know the Lord. For all shall know Me from the least to
    the greatest.” (Jer. 31:34.) Why then, you will say, does he preside? Why is he
    set over us? I beseech you, let us not speak ill of our teachers, nor call them
    to so strict an account, lest we bring evil upon ourselves. Let us examine ourselves,
    and we shall not speak ill of others. Let us reverence that day, on which he enlightened
    us. <strong>He who has a father, whatever faults he has, conceals them all. For
    it is said, “Glory not in the dishonor of thy father; for thy father’s dishonor
    is no glory unto thee. And if his understanding fail, have patience with him.”
    (Sir. 3:10–12.) And if this be said of our natural fathers, much more of our spiritual
    fathers.</strong> Reverence him, in that he every day ministers to thee, causes
    the Scriptures to be read, sets the house in order for thee, watches for thee,
    prays for thee, stands imploring God on thy behalf, offers supplications for thee,
    for thee is all his worship. Reverence all this, think of this, and approach him
    with pious respect. Say not, he is wicked. What of that? He that is not wicked,
    doth he of himself bestow upon thee these great benefits? By no means. Everything
    worketh according to thy faith. Not even the righteous man can benefit thee, if
    thou art unfaithful, nor the unrighteous harm thee, if thou art faithful. God,
    when He would save His people, wrought for the ark by Oxen. (1 Sam. 6:12) Is it
    the good life or the virtue of the Priest that confers so much on thee? The gifts
    which God bestows are not such as to be effects of the virtue of the Priest. All
    is of grace. His part is but to open his mouth, while God worketh all: the Priest
    only performs a symbol. Consider how wide was the distance between John and Jesus.
    Hear John saying, “I have need to be baptized of Thee” (Matt. 3:14.), and, “Whose
    shoe’s latchet I am not worthy to unloose.” (John 1:27.) Yet notwithstanding this
    difference, the Spirit descended. Which John had not. For “of His fullness,” it
    is said, “we all have received.” (John 1:16.) Yet nevertheless, It descended not
    till He was baptized. But neither was it John who caused It to descend. Why then
    is this done? That thou mayest learn that the Priest performs a symbol. No man
    differs so widely from another man, as John from Jesus, and yet with him the Spirit
    descended, that we may learn, that it is God who worketh all, that all is God’s
    doing.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-second-timothy#HH-2-Timothy-18-10">Homilies
    on Second Timothy, 2</a>)</p><h2>19th century</h2><h3>St Theophan the Recluse,
    bishop (1815–1894)</h3><blockquote><p>Three points set forth: faith, life according
    to the commandments in the spirit of faith, and grace through the Mysteries, –
    <strong>require</strong> <strong>a fourth: the divinely established pastorate.</strong>
    One must believe; but how shall they believe without a preacher? And “how shall
    they preach, except they be sent?” (Rom. 10:15). Grace must be received through
    the Mysteries; but how could this be without the builders and celebrators of the
    Mysteries of God? (1 Cor. 4:1). It is necessary to live according to the commandments
    in the spirit of faith; but <strong><mark>how can this be kept in order without
    a guide, who would point out, warn, correct mistakes, raise up those who fall,
    and direct again onto the path those who turn aside from the present road?</mark></strong>
    <strong>Thus, <mark>for the ordering of salvation there are necessary persons
    acting on behalf of God, who would teach the faith, sanctify by grace through
    the Mysteries and guide in life – pastors are necessary, God-given and God-established</mark>.</strong>
    The Lord was pleased to establish them. Here is the apostolic assurance for this!
    “And He (the Lord) gave some, apostles; and some, prophets... some, pastors and
    teachers, for the perfecting of the saints, for the work of the ministry, for
    the edifying of the body of Christ” (Eph. 4:11–12). And the very work showed this.
    The Lord sent the apostles to go <strong>and teach the faith, baptize those who
    were taught, and instruct the baptized and taught to keep all that was commanded</strong>
    (Matt. 28:19–20). The apostles did so. But as they are not eternal, and their
    apostolic work must abide for all ages, then, knowing this, they everywhere, by
    the command of God, <strong><mark>left in their place successors, pastors and
    teachers, that they might continue their work</mark> – the perfecting of the saints,
    the ministry (the performance of the Mysteries) and the edifying of the body of
    Christ.</strong></p></blockquote><p>(Selected letters on sects and heresies. Letter
    8)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“<em>We
    ask you, breth</em>ren, <strong><mark>to know them which labour among you, and
    are over you in the Lord, and admonish you; and to esteem them</mark></strong>
    very highly in love for their work''s sake” (1 Thess. 5:12–13). “<strong><mark>Obey
    them that have the rule over you, and submit yourselves</mark></strong>, for they
    watch for your souls, as they that must give account, that they may do it with
    joy, and not with grief, for that is unprofitable for you” (Heb. 13:17). “Thou
    shalt not speak evil of the ruler of thy people” (Acts 23:5; cf. Exod. 22:28;
    Deut. 17:12–13).</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: hbE6XzDZ_Верующим_запрещено_восхищать_себе_иерархическую_власть
  path: Usurping-hierarchical-authority-forbidden
  title: The faithful are forbidden to usurp hierarchical authority
  menu:
    parent: Composition of the Church
    title: Usurping hierarchical authority is forbidden
    priority: 8
  body: '<h2>1st century</h2><h3>Clement of Rome, hieromartyr († c. 101)</h3><blockquote><p><strong>The
    apostles have preached the Gospel to us from the Lord Jesus Christ; Jesus Christ
    from God</strong>. <strong><mark>Christ therefore was sent forth by God, and the
    apostles by Christ</mark></strong>; both these appointments, then, were made in
    an orderly way, according to the will of God. Having therefore received their
    orders, and being fully assured by the resurrection of our Lord Jesus Christ,
    and established in the word of God, with full assurance of the Holy Ghost, <strong><mark>they</mark></strong>
    went forth proclaiming that the kingdom of God was at hand. And thus preaching
    through countries and cities, they <strong>appointed the first-fruits, having
    first proved them by the Spirit, <mark>to be bishops and deacons</mark></strong>
    of those who should afterwards believe. &lt;…&gt; <strong><mark>and afterwards
    gave instructions, that when these should fall asleep, other approved men should
    succeed them in their ministry</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-42">First
    Epistle to the Corinthians, 42, 44</a>)</p><h3>St Ignatius the God-bearer, bishop
    of Antioch, hieromartyr (c. 35–107)</h3><blockquote><p><strong><em><mark>See that
    ye all follow the bishop, even as Jesus Christ does the Father, and the presbytery
    as ye would the apostles</mark></em></strong><em>. Reverence the deacons, as being
    the institution of God. </em><strong><em><mark>Let no man do anything connected
    with the Church without the bishop</mark>. Let that be deemed a proper Eucharist,
    which is either by the bishop, or by one to whom he has entrusted it. <mark>Wherever
    the bishop shall appear, there let the multitude also be; even as, wherever Jesus
    Christ is, there is the Catholic Church</mark>. It is not lawful without the bishop
    either to baptize or to celebrate a love-feast; but whatsoever he shall approve
    of, that is also pleasing to God, so that everything that is done may be secure
    and valid.</em></strong><em> It is well to reverence both God and the bishop.
    He who honours the bishop has been honoured by God; </em><strong><em><mark>he
    who does anything without the knowledge of the bishop, does serve the devil</mark></em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-8">Epistle to the Smyrnaeans, ch.
    8-9</a>)</p><blockquote><p>“Wherefore it is fitting that ye should <strong><mark>run
    together in accordance with the will of your bishop</mark></strong>, which thing
    also ye do. For your justly renowned presbytery, worthy of God, is fitted as exactly
    to the bishop as the strings are to the harp. Therefore in your concord and harmonious
    love, Jesus Christ is sung. And do ye, man by man, become a choir, that being
    harmonious in love, and taking up the song of God in unison, ye may with one voice
    sing to the Father through Jesus Christ, so that He may both hear you, and perceive
    by your works that ye are indeed the members of His Son. It is profitable, therefore,
    that you should live in an unblameable unity, that thus ye may always enjoy communion
    with God.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-4">To
    the Ephesians, ch. 4</a>)</p><h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr
    (c. 130–202)</h3><blockquote><p>“Wherefore, <strong><mark>it is incumbent to obey
    the presbyters who are in the Church, those who, as I have shown, possess the
    succession from the apostles; those who, together with the succession of the episcopate,
    have received the certain gift of truth, according to the good pleasure of the
    Father</mark></strong>. But to hold in suspicion others who depart from the primitive
    succession, and assemble themselves together in any place whatsoever, either as
    heretics of perverse minds, or as schismatics puffed up and self-pleasing, or
    again as hypocrites, acting thus for the sake of lucre and vainglory”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-26">Against
    Heresies — Book IV</a>)</p><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p>Thus
    the Lord God says in Deuteronomy: “and the man who in his pride will not hearken
    to the priest... or to the judge who shall be in those days, that man shall die,
    and all the people having heard shall fear and shall not sin any more” (Deut.
    17:12–13). And that these divine words were uttered with true and most lofty majesty
    of God, that <strong>the priests of God should be honoured and avenged</strong>,
    is evident from the fact that Kore, Dathan and Abiron, who served the priest Aaron,
    as soon as they dared to rise against him, to be proud before him and to consider
    themselves equal to the presiding priest, were straightway, being swallowed up
    and consumed by the opening earth, made to receive punishment for their sacrilegious
    boldness. And not they alone, but also the other two hundred and fifty men who
    took part in their sedition, were consumed by the fire sent down from God, that
    it might become evident that the priests of God are avenged by Him who appoints
    priests. Also in the book of Kings it is said that when the Jewish people showed
    contempt for the priest Samuel because of his old age, as now to thee, God said
    in anger: “not thee have they despised, but Me have they despised” (1 Sam. 8:7),
    and in punishment for this raised up to them king Saul, that he, oppressing them
    with heavy injustices, might humble and abase the proud people with various embitterments
    and punishments; and thus <strong>divine vengeance was rendered to this proud
    people for the dishonoured priest</strong>. Solomon, instructed by the Holy Spirit,
    likewise bears witness to the priestly dignity and authority, giving instruction
    in the following words: “<strong>with all thy soul fear the Lord, and honour His
    priests</strong>”. And again: “<strong>with all thy strength... fear the Lord
    and glorify the priest</strong>”. Remembering these commandments, the blessed
    apostle Paul, as we read in the Acts of the Apostles, – when it was said to him:
    “dost thou revile the high priest of God?” answered: “I knew not, brethren, that
    he was the high priest: for it is written: thou shalt not speak evil of the ruler
    of thy people” (Acts 23:5). <strong>Our Lord Jesus Christ Himself, the King, Judge
    and God, even up to the day of His sufferings showed respect to the high priests
    and priests, although they had neither the fear of God nor the knowledge of Christ</strong>.
    Thus, when He cleansed the leper, He said to him: “go, show thyself to the priest,
    and offer the gift” (Matt. 8:4). By the humility which He enjoined upon us, He
    still called priest the one whom He knew to be a blasphemer. Also, when during
    His sufferings He was struck on the cheek and told: “Answerest thou the high priest
    so?” – He said nothing insulting about the person of the high priest, but only,
    defending His innocence, answered: “If I have spoken evil, bear witness of the
    evil; but if well, why smitest thou Me?” (John 18:22–23). In all cases He acted
    thus patiently, in order to give us an example of meekness and patience. Being
    respectful to lying priests, He thereby taught us to render to true priests lawful
    and full respect. Moreover, <strong><mark>the deacons must remember that the apostles,
    that is, the bishops and presidents, were chosen by the Lord Himself, while the
    deacons, after the Ascension of the Lord into heaven, were appointed by the apostles
    as the ministers of their episcopal office in the Church</mark></strong>. &lt;…&gt;
    there are many other examples confirming the importance and authority of the priesthood,
    which comes from the divine vouchsafing: <strong>what then dost thou consider
    those to be who, in enmity against the priests and in sedition against the Catholic
    Church, fear neither the threats of the forewarning God nor the vengeance of the
    future judgment?</strong> For <strong><mark>from nothing else have heresies arisen
    and schisms been born, than from the fact that obedience is not rendered to the
    priest of God</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Cornelius-Concerning-Fortunatus-and-Felicissimus-or-Against-the-Heretics">Letter
    to Cornelius concerning Fortunatus and Felicissimus, or against the heretics</a>;
    translated from the Russian: the library’s English translation gives a shorter
    text of this passage)</p><h2>4th century</h2><h3>St Epiphanius of Cyprus, bishop
    (c. 315–403)</h3><blockquote><p>“Since Philip, <strong>being a deacon, had not
    the power of ordination, so as to bestow the Holy Spirit on those who were baptized</strong>”</p></blockquote><p>(The
    Panarion)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“<strong><em>How
    shall they preach</em>, except they be sent?</strong>” (Rom. 10:15). “Are all
    apostles? Are all prophets? Are all teachers?” (1 Cor. 12:29). “<strong>No man
    taketh this honour unto himself</strong>, but he that is called of God, as was
    Aaron. So also Christ glorified not Himself to be made an High Priest, but He
    that said unto Him: Thou art My Son, today have I begotten Thee” (Heb. 5:4–5).
    “<strong>My brethren, be not many masters</strong>” (James 3:1; cf. Num. 16; 2
    Chron. 26:16–21).</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>'
