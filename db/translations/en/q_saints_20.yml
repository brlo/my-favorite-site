  title: The ordination of the priesthood
  menu:
    parent: Composition of the Church
    title: The ordination of the priesthood
    priority: 3
  body: '<h2>1st century</h2><h3>Clement of Rome, hieromartyr († c. 101)</h3><blockquote><p><strong>The
    apostles have preached the Gospel to us</strong> from <strong>the Lord Jesus Christ</strong>;
    <strong>Jesus Christ from God</strong>. <strong><mark>Christ therefore was sent
    forth by God, and the apostles by Christ</mark></strong>; both these appointments,
    then, were made in an orderly way, according to the will of God. Having therefore
    received their orders, and being fully assured by the resurrection of our Lord
    Jesus Christ, and established in the word of God, with full assurance of the Holy
    Ghost, <strong><mark>they</mark></strong> went forth proclaiming that the kingdom
    of God was at hand. And thus preaching through countries and cities, they <strong><mark>appointed
    the first-fruits, having first proved them by the Spirit, to be bishops and deacons</mark></strong>
    of those who should afterwards believe.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-42">First
    Epistle to the Corinthians, ch. 42</a>)</p><blockquote><p><em>Our apostles also
    knew, through our Lord Jesus Christ, that there would be strife on account of
    the office of the episcopate. For this reason, therefore, inasmuch as they had
    obtained a perfect fore-knowledge of this, </em><strong><em><mark>they appointed
    those [ministers] already mentioned, and afterwards gave instructions</mark>,
    that when these should fall asleep, other approved men should succeed them in
    their ministry</em></strong><em>. We are of opinion, therefore, that those </em><strong><em><mark>appointed
    by them, or afterwards by other eminent men, with the consent of the whole Church</mark></em></strong><em>,
    and who have blamelessly served the flock of Christ in a humble, peaceable, and
    disinterested spirit, and have for a long time possessed the good opinion of all,
    cannot be justly dismissed from the ministry.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-44">First
    Epistle to the Corinthians, ch. 44</a>)</p><h3>Didache (late 1st c. – early 2nd
    c.)</h3><blockquote><p>“<strong>Appoint, therefore, for yourselves, bishops and
    deacons</strong> worthy of the Lord, men meek, and not lovers of money, and truthful
    and proved; for they also render to you the service of prophets and teachers”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Didache#HH-15">The Didache, 15</a>)</p><h2>2nd
    century</h2><h3>St Irenaeus of Lyons, hieromartyr († late 2nd c.)</h3><blockquote><p><strong><em><mark>it
    is incumbent to obey the presbyters who are in the Church, those who, as I have
    shown, possess the succession from the apostles</mark></em></strong><em> </em><strong><em>those
    who, together with <mark>the succession of the episcopate</mark>, have received
    <mark>the certain gift of truth</mark>, according to the good pleasure of the
    Father. But to hold in suspicion others who depart from the primitive succession,
    and assemble themselves together in any place whatsoever, either as heretics of
    perverse minds, or as schismatics puffed up and self-pleasing, or again as hypocrites,
    acting thus for the sake of lucre and vainglory. For all these have fallen from
    the truth</em></strong><em>. And the heretics, indeed, who bring strange fire
    to the altar of God, namely, strange doctrines, shall be burned up by the fire
    from heaven, as were Nadab and Abiud (</em><a href="https://bibleox.com/en/eng-nkjv/lev/10/#L1-2"><em><u>Lev.
    10:1-2</u></em></a><em>). But such as rise up in opposition to the truth, and
    exhort others against the Church of God, shall remain among those in hell, being
    swallowed up by an earthquake, even as those who were with Chore, Dathan, and
    Abiron (</em><a href="https://bibleox.com/en/eng-nkjv/chis/16/#L33"><em><u>Num.
    16:33</u></em></a><em>). But those who cleave asunder, and separate the unity
    of the Church, shall receive from God the same punishment as Jeroboam did (</em><a
    href="https://bibleox.com/en/eng-nkjv/3ts/14/#L10"><em><u>1 Kings 14:10</u></em></a><em>
    ff.). &lt;…&gt;</em></p><p><em>4. </em><strong><em>From all such persons, therefore,
    it behooves us to keep aloof; <mark>but to adhere to those who, as I have already
    observed</mark>, <mark>do hold the doctrine of the apostles</mark> and, <mark>together
    with the order of priesthood</mark>, display sound speech and blameless conduct</em></strong><em>
    for the confirmation and correction of others.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-26">Against
    Heresies, Book IV, ch. 26, 2</a>)</p><h2>4th century</h2><h3>St Basil the Great,
    archbishop of Caesarea (c. 329–379)</h3><blockquote><p>The Cathari are of the
    number of the schismatics. But, nevertheless, it seemed good to the ancients –
    I mean Cyprian and our Firmilian – to bring them all under one definition, both
    the Cathari and the Encratites and the Hydroparastates, since although the beginning
    of their separation came from schism, yet <strong>those who had departed from
    the Church no longer had on them the grace of the Holy Spirit, for the imparting
    of it had failed through the <mark>breaking of the succession</mark>, and although
    the first who separated themselves had <mark>ordination from the fathers</mark>
    and had <mark>received through the laying on of their hands the spiritual gift</mark>,
    yet, having fallen away, they became laymen, and had no <mark>power</mark> either
    to baptize or to ordain, and were unable to impart to others the grace of the
    Holy Spirit, from which they themselves had fallen away</strong>.</p></blockquote><p>(Letter
    180 (188). To Amphilochius, on the canons, first canonical epistle)</p><blockquote><p>…
    The Cathari belong to the schismatics. However, the ancients, that is, Cyprian
    and our Firmilian, decided to pronounce one judgement on all of them, whether
    Cathari, Encratites, Hydroparastates or Apotactites. For, <strong>although the
    beginning of their separation was schism, yet <mark>those who had separated from
    the Church no longer had on them the grace of the Holy Spirit, for the imparting
    of it had ceased because the succession was broken</mark>. The first who fell
    away received ordination from the fathers and <mark>through the laying on of their
    hands had the spiritual gift</mark>, but since they <mark>had separated themselves</mark>,
    they <mark>became laymen and no longer had the power either to baptize or to ordain,
    and could not impart to others the grace of the Holy Spirit, from which they themselves
    had fallen away</mark></strong>. Therefore the fathers commanded that those who
    had received baptism from them, as baptized by laymen, should be cleansed by the
    true baptism of the Church, if they came to it. But since some of the Asian fathers
    decided once for all, out of care for the many, to accept their baptism, let it
    be accepted…</p></blockquote><p>(Canonical rule 1)</p><h3>St John Chrysostom,
    archbishop of Constantinople (c. 347–407)</h3><blockquote><p>And if you will,
    let us come first to the praise of his episcopate (of Ignatius the God-bearer
    — tr.). Does this seem to be one crown alone? come, then, let us unfold it in
    speech, and you will see both two, and three, and more produced from it. For I
    do not wonder at the man alone that he <strong><mark>seemed to be worthy of so
    great an office</mark></strong>, but that <strong>he obtained this office from
    those saints</strong>, and that <strong><mark>the hands of the blessed apostles
    touched his sacred head</mark></strong>. For not even is this a slight thing to
    be said in his praise, nor because he won greater grace from above, nor only because
    <strong><mark>they caused more abundant energy of the Spirit to come upon him</mark></strong>,
    but because they bore witness that every virtue possessed by man was in him. &lt;…&gt;
    This man, then, writing to Titus, and showing what kind of man the bishop ought
    to be, says, &lt;…&gt; and to Timothy again, when writing upon this subject, he
    says somewhat like this: &lt;…&gt; Dost thou see what strictness of virtue he
    demands from the bishop? &lt;…&gt; They who said these things <strong><mark>ordained
    him</mark></strong>, and they who suggest to others with so great strictness to
    make proof of those who are about to mount to the throne of this office, would
    not themselves have done this negligently. But had they not seen all this virtue
    planted in the soul of this martyr would not have entrusted him with this office.
    For they knew accurately how great danger besets those who bring about such <strong>ordinations</strong>,
    carelessly and hap-hazard. And Paul again, when showing this very thing to the
    same Timothy wrote and says, <strong><em>“Lay hands suddenly on no man</em></strong><em>,
    neither be partaker of other men’s sins.”</em> (1 Tim. 5:22)</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-eulogy-of-st-ignatius">Encomium on
    the holy hieromartyr Ignatius the God-bearer</a>)</p><h2>18th century</h2><h3>Epistle
    of the Patriarchs (1723)</h3><blockquote><p><em>We declare that </em>the dignity
    of <strong><mark>the Bishop</mark></strong> is so necessary in the Church, that
    without him, neither Church nor Christian could either be or be spoken of. For
    he, as <strong><mark>a successor of the Apostles, having received in continued
    succession by the imposition of hands and the invocation of the All-holy Spirit
    the grace that is given him of the Lord of binding and loosing</mark></strong>,
    is a living image of God upon the earth, and by a most ample participation of
    the operation of the Holy Spirit, who is the chief functionary [of the Mysteries],
    is a fountain of all the Mysteries of the Catholic Church, through which we obtain
    salvation. And he is, we suppose, <em>as necessary to the Church as breath is
    to man, or the sun to the world.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decree
    10</a>)</p><h2>20th century</h2><h3>Archimandrite Cleopa (Ilie) (1912–1998)</h3><blockquote><p>Christ
    is the vine, the trunk of the tree. <strong>He transmitted the Holy Spirit into
    His Church <mark>through the laying on of hands</mark></strong>. All the apostles
    were bishops, and <strong><mark>by the laying on of hands</mark> they consecrated
    other bishops, such as Titus, Timothy, Philemon and others</strong>. <strong><mark>Through
    the laying on of hands</mark> the bishop, by <mark>apostolic succession, transmits
    the Holy Spirit</mark> further</strong>, to all the priests and deacons who are
    ordained, and the priest, after he has received the Holy Spirit in his ordination,
    through the other sacraments which it falls to him to perform, sanctifies all
    the faithful. <strong><mark>In no other way does the Holy Spirit enter the soul
    of a man</mark>, but solely and only by that way which was appointed by Christ</strong>.</p></blockquote><p>(Instructions
    of my heart)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>a)
    <mark>deacons</mark></strong> (διάκονος – servant): seven men were set apart for
    service: “to serve tables” (διακονεῖν τραπέζαις) and for service at the sacred
    rites. They were set apart (by the believers) before the apostles, and these (and
    not the community), having prayed, laid hands on them” (Acts 6:2–6; cf. Acts 21:8).</p><p><strong>b)
    <mark>Presbyters</mark></strong> (πρεσβύτερος – elder, comparative degree of πρέσβυς
    – old).</p><p>“Having sent the collected sum to the presbyters” (Acts 11:30; 15:2–6,
    22–23, 16:4). “For this cause left I thee in Crete, that thou shouldest set in
    order the things that are wanting, and ordain presbyters in every city, as I had
    appointed thee” (Tit. 1:5). The apostle prescribes to Titus to ordain presbyters
    with certain qualities (Tit. 1:6) so that they might in time become bishops (Tit.
    1:7). “Is any sick among you? let him call for the presbyters of the Church, and
    let them pray over him, anointing him with oil in the name of the Lord” (James
    5:14). “Those who rule well” (προεστότες – προίστημι – to set before, to stand
    before, to govern; with literal exactness one must read: “worthily standing before”
    (before the bishop); cf. προισταμένους – “those who stand before” 1 Thess. 5:12)
    “presbyters must be counted worthy of double honour, especially those who labour
    in the word and doctrine” (1 Tim. 5:17). The presbyters stand before the bishop
    during the sacred rites, preach the word of God under the guidance of the bishop,
    perform the sacraments (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14">James
    5:14</a>) and are in all things subject to the bishop (1 Tim. 5:17, 19).</p><p><strong>c)
    <mark>Bishops</mark></strong> (ἐπίσκοπος – overseer, observer, guard, keeper).
    “A bishop must be blameless” (1 Tim. 3:2; Tit. 1:7). “The elders (πρεσβυτέρους)
    which are among you I exhort, who am also an elder (συμπρεσβύτερος)... Feed the
    flock of God which is among you, overseeing it (ἐπισκοποῦντες)... and not being
    lords over God''s heritage” (μηδ'' ὡς κατακυριεύοντες τῶν κλήρων – not as ruling
    over the clerics, that is, over the sacred people (1 Pet. 5:1–5)). “The apostle
    calls himself an elder (presbyter)”, explains Blessed Theophylact, – “either by
    age, or by the dignity of a bishop; for the book of Acts (Acts 20:17) also calls
    presbyters (elders) and bishops. Then, wishing to show that he excels them and
    that he calls himself a fellow-presbyter out of humility, he sets forth his dignity,
    namely that he is a witness of the sufferings of Christ.” “He called the presbyters
    (πρεσβυτέρους) of the church” and said to them: “Take heed therefore unto yourselves,
    and to all the flock, over the which the Holy Spirit hath made you overseers (ἐπισκόπους),
    to feed the Church of the Lord and God” (Acts 20:17, 28). The Holy Spirit set
    them apart not directly, but through the apostle Paul to the episcopate, that
    they might govern, oversee the life of the Church (cf. Acts 14:23) “Paul and Timothy...
    to all the saints in Christ Jesus which are at Philippi, with the bishops and
    deacons” (Phil. 1:1).</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
