    menu: { parent: Man, title: Illnesses, priority: 9 }
    body: |-
      <h2>The First Christians Had Illnesses</h2><p>Timothy (bishop of Ephesus) suffered from a stomach ailment, so much so that the apostle Paul tells him to relax his fast because of the illness:</p><blockquote><p>“<strong>No longer drink only water</strong>, but use a little wine <strong>for your stomach’s sake and your frequent infirmities</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L23">1 Tim. 5:23</a>)</p></blockquote><p>The apostle Paul himself was given an illness so that he would not become proud:</p><blockquote><p>“And lest I should be exalted above measure by the abundance of the revelations, <strong>a thorn in the flesh was given to me</strong>, a messenger of Satan to buffet me, <strong>lest I be exalted above measure</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/12/#L7">2 Cor. 12:7</a>)</p></blockquote><p>Epaphroditus (a companion of the apostle Paul) was sick and near death:</p><blockquote><p>“Yet I considered it necessary to send to you <strong>Epaphroditus</strong>, my brother, fellow worker, and fellow soldier, but your messenger and the one who ministered to my need; since he was longing for you all, and was distressed because <strong>you had heard that he was sick</strong>. For indeed <strong>he was sick almost unto death</strong>; but God had mercy on him, and not only on him but on me also, lest I should have sorrow upon sorrow. &lt;…&gt; because for the work of Christ <strong>he came close to death</strong>, not regarding his life, to supply what was lacking in your service toward me” (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L25-27,30">Phil. 2:25-27,30</a>)</p></blockquote><p>The apostle Paul delivers a sinning Christian to Satan, to be struck with illness:</p><blockquote><p>“have already judged &lt;...&gt; him who has so done this deed, <strong>deliver such a one to Satan for the destruction of the flesh, that his spirit may be saved</strong> in the day of the Lord Jesus” (<a href="https://bibleox.com/en/eng-nkjv/1kor/5/#L3,5">1 Cor. 5:3,5</a>)</p></blockquote><p>Unworthy participation in the Eucharist led many Christians to illnesses, infirmities and even death:</p><blockquote><p>“For this reason <strong>many are weak and sick among you</strong>, and many sleep” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L30">1 Cor. 11:30</a>)</p></blockquote><p>The righteous of the Old Testament fell ill</p><blockquote><p>“<em>Now it came to pass, when Isaac was old and </em><strong><em>his eyes were so dim that he could not see</em></strong><em>…”</em> (<a href="https://bibleox.com/en/eng-nkjv/gen/27/#L1">Gen. 27:1</a>)</p></blockquote><h2>The Benefit of Bodily Suffering</h2><h3>Help in Leaving Sins</h3><blockquote><p>“Therefore, since Christ suffered for us in the flesh, arm yourselves also with the same mind, for <strong>he who has suffered in the flesh has ceased from sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L1">1 Pet. 4:1</a>)</p></blockquote><h3>Protection from Pride</h3><blockquote><p>“And <strong>lest I should be exalted above measure by the abundance of the revelations, a thorn in the flesh was given to me, a messenger of Satan to buffet me, lest I be exalted above measure</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/12/#L7">2 Cor. 12:7</a>)</p></blockquote><h3>Bringing to One’s Senses</h3><blockquote><p>“<strong>Then it was that, broken in spirit, he began to lose much of his arrogance and to come to his senses under the scourge of God, for he was tortured with pain every moment</strong>” (<a href="https://bibleox.com/en/en-nrsv/2mak/9/#L11">2 Macc. 9:11</a>)</p></blockquote><h2>God Can Punish with Illness</h2><p>God can punish for lawlessness and sins:</p><blockquote><p>“Why do you cry about your affliction? <strong>Your sorrow is incurable.</strong> <strong>Because of the multitude of your iniquities, because your sins have increased, I have done these things to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ier/30/#L15">Jer. 30:15</a>)</p></blockquote><p>God punished Miriam (the sister of Aaron and Moses) with leprosy for reproaching Moses:</p><blockquote><p>“Why then were you not afraid to speak against My servant Moses? So <strong>the anger of the LORD was aroused against them</strong>, and He departed. And when the cloud departed from above the tabernacle, suddenly <strong>Miriam became leprous, as white as snow</strong>. Then Aaron turned toward Miriam, and there she was, a leper” (<a href="https://bibleox.com/en/eng-nkjv/chis/12/#L8-10">Num. 12:8-10</a>)</p></blockquote><p>A plague befell the people of Israel for turning away from the worship of God:</p><blockquote><p>“So Israel was joined to Baal of Peor, and <strong>the anger of the LORD was aroused against Israel. &lt;…&gt; And those who died in the plague were twenty-four thousand</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/25/#L3,9">Num. 25:3,9</a>)</p></blockquote><p>The Savior points to sins as a cause of illnesses:</p><blockquote><p>“Afterward Jesus found him in the temple, and said to him, ‘See, <strong>you have been made well. Sin no more, lest a worse thing come upon you</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L14">John. 5:14</a>)</p></blockquote><p>God can also have mercy and protect from illnesses</p><blockquote><p>“<strong><em>If you diligently heed the voice of the LORD</em></strong><em> your God and do what is right in His sight, give ear to His commandments and keep all His statutes, </em><strong><em>I will put none of the diseases on you</em></strong><em> which I have brought on the Egyptians. For I am the LORD who heals you</em>” (<a href="https://bibleox.com/en/eng-nkjv/ish/15/#L26">Ex. 15:26</a>)</p></blockquote><h2>Not All Illnesses Come from Sins</h2><blockquote><p>“Now as Jesus passed by, He saw a man who was blind from birth. And His disciples asked Him, saying, ‘Rabbi, who sinned, this man or his parents, that he was born blind?’ Jesus answered, ‘<strong>Neither this man nor his parents sinned, but that the works of God should be revealed in him</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/9/#L1-3">John. 9:1-3</a>)</p></blockquote><p>See also: <a href="https://bibleox.com/ru/q/%D0%BC%D0%B5%D0%B4%D0%B8%D1%86%D0%B8%D0%BD%D0%B0">Medicine</a>.</p><h2>The Didache — a Christian Writing of the 1st–2nd Century</h2><blockquote><p>“<strong>Accept whatever happens to you as good, knowing that apart from God nothing comes to pass</strong>”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Didache/#HH-3">Didache, ch. 3</a>)</p>

  - src: о_жизни_в_долг
    path: Db10t_Living_in_Debt
    title: Living in Debt (Credit)
    title_sub: Bible quotes about living in debt (on credit)
    meta_desc: Bible quotes about living in debt (on credit)
    menu: { parent: Man, title: Living in Debt, priority: 10 }
    body: |-
      <blockquote><p>“The rich rules over the poor, and <strong><mark>the borrower is servant to the lender</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/22/#L7">Prov. 22:7</a>)</p></blockquote><blockquote><p>“Do not be one of those who shakes hands in a pledge, one of those who is surety for debts; <strong><mark>if you have nothing with which to pay, why should he take away your bed from under you?</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/22/#L26-27">Prov. 22:26-27</a>)</p></blockquote><blockquote><p>“Now <strong>godliness with contentment is great gain</strong>. For we brought nothing into this world, and it is certain we can carry nothing out. <strong><mark>And having food and clothing, with these we shall be content</mark></strong>. But those who desire to be rich fall into temptation and a snare, and into many foolish and harmful lusts which drown men in destruction and perdition. For <strong><mark>the love of money is a root of all kinds of evil</mark></strong>, for which some have strayed from the faith in their greediness, and pierced themselves through with many sorrows” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L6-10">1 Tim. 6:6-10</a>)</p></blockquote><blockquote><p>“Let your conduct be without covetousness; <strong><mark>be content with such things as you have</mark></strong>. For He Himself has said, ‘I will never leave you nor forsake you’” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L5">Heb. 13:5</a>)</p></blockquote>

  - src: медицина
    path: Md11c_Medicine
    title: Medicine
    meta_desc: Bible quotes about medicine and remedies
    menu: { parent: Man, title: Medicine, priority: 11 }
    body: |-
      <p>The prophet Isaiah allows treatment with medicinal remedies:</p><blockquote><p>“Then Isaiah said, ‘<strong>Take a lump of figs.</strong>’ <strong>So they took and laid it on the boil</strong>, and he recovered” (<a href="https://bibleox.com/en/eng-nkjv/4ts/20/#L7">2 Kin. 20:7</a>)</p></blockquote><p>God created plants so that some of them have medicinal properties:</p><blockquote><p>“Honor physicians for their services, for the Lord created them; for their gift of healing comes from the Most High, and they are rewarded by the king. The skill of physicians makes them distinguished, and in the presence of the great they are admired. <strong>The Lord created medicines out of the earth</strong>, and the sensible will not despise them” (<a href="https://bibleox.com/en/en-nrsv/prsir/38/#L1-4">Sir. 38:1-4</a>)</p></blockquote><p>Hope in God when turning to a physician:</p><blockquote><p>“<em>My child, </em><strong><em>when you are ill, do not delay, but pray to the Lord, and he will heal you</em></strong><em>. Give up your faults and direct your hands rightly, and cleanse your heart from all sin. &lt;…&gt; </em><strong><em>Then give the physician his place, for the Lord created him; do not let him leave you, for you need him</em></strong><em>. There may come a time when recovery lies in the hands of physicians, for they too pray to the Lord that he grant them success in diagnosis and in healing, for the sake of preserving life”</em> (<a href="https://bibleox.com/en/en-nrsv/prsir/38/#L9-14">Sir. 38:9-14</a>)</p></blockquote><p>It is wrong to place all one’s hope only in physicians:</p><blockquote><p>“yet in his disease he did not seek the LORD, but the physicians” (<a href="https://bibleox.com/en/eng-nkjv/2par/16/#L12">2 Chr. 16:12</a>)</p></blockquote><p>The apostle and evangelist Luke was a physician:</p><blockquote><p>“Luke the beloved physician” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L14">Col. 4:14</a>)</p></blockquote>

  - src: все-люди-грешны
    path: As12n_All_People_Are_Sinners
    title: All People Are Sinners
    title_sub: Bible quotes on the universality of original sin
    meta_desc: Bible quotes on the universality of original sin
    menu: { parent: Man, title: All People Are Sinners, priority: 12 }
    references: |-
      <p>More:</p><ul><li><p><a href="https://azbyka.ru/grex-pervorodnyj">https://azbyka.ru/grex-pervorodnyj</a> (in Russian)</p></li></ul>
    body: |-
      <p><strong>Original sin</strong> —</p><p>1) The ancestral sin of Adam and Eve.</p><p>2) The damage to human nature, which is now drawn to sinful thoughts, words and deeds (one wants to do evil, while doing good takes an effort of the will). This state is passed on to descendants at birth: to all except the Lord Jesus Christ.</p><h2>From Conception All People Inherit Sinfulness from the First Parents (Adam and Eve)</h2><blockquote><p>“Who can bring a clean thing out of an unclean? <strong>No one!</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iov/14/#L4">Job. 14:4</a>)</p></blockquote><blockquote><p>“What then? Are we better than they? Not at all. For we have previously charged both Jews and Greeks that <strong>they are all under sin</strong>. As it is written: ‘<strong>There is none righteous, no, not one</strong>; there is none who understands; there is none who seeks after God. They have all turned aside; they have together become unprofitable; there is none who does good, no, not one’” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L9-12">Rom. 3:9-12</a>)</p></blockquote><blockquote><p>“for <strong>all have sinned</strong> and fall short of the glory of God” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L23">Rom. 3:23</a>)</p></blockquote><blockquote><p>“Therefore, just as <strong>through one man sin entered the world</strong>, and death through sin, and thus <strong>death spread to all men, because all sinned</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/5/#L12">Rom. 5:12</a>)</p></blockquote><blockquote><p>“For as <strong>by one man’s disobedience many were made sinners</strong>, so also by one Man’s obedience many will be made righteous” (<a href="https://bibleox.com/en/eng-nkjv/rim/5/#L19">Rom. 5:19</a>)</p></blockquote><blockquote><p>“For we know that the law is spiritual, but <strong>I am carnal, sold under sin</strong>. &lt;...&gt; For I delight in the law of God according to the inward man. But <strong>I see another law in my members, warring</strong> against the law of my mind, and <strong>bringing me into captivity to the law of sin</strong> which is in my members” (<a href="https://bibleox.com/en/eng-nkjv/rim/7/#L14,22-23">Rom. 7:14,22-23</a>)</p></blockquote><blockquote><p>“among whom also we <strong>all</strong> once conducted ourselves in the lusts of our flesh, fulfilling the desires of the flesh and of the mind, and were <strong>by nature children of wrath</strong>, just as the others” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L3">Eph. 2:3</a>)</p></blockquote><blockquote><p>“Behold, I was brought forth in iniquity, and <strong>in sin my mother conceived me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/51/#L5">Ps. 51:5</a>)</p></blockquote><blockquote><p>“<strong>The heart is deceitful</strong> above all things, and desperately wicked; who can know it?” (<a href="https://bibleox.com/en/eng-nkjv/ier/17/#L9">Jer. 17:9</a>)</p></blockquote><h2>As They Grow Up, All Also Acquire Their Own Sinfulness</h2><blockquote><p>“For there is not a <strong>just</strong> man on earth who does good and <strong>does not sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ekl/7/#L20">Eccl. 7:20</a>)</p></blockquote><blockquote><p>“For in truth <strong>there is no one among those who have been born who has not acted wickedly</strong>; among those who have existed there is no one who has not done wrong” (<a href="https://bibleox.com/en/en-nrsv/3ezd/8/#L35">2 Esd. 8:35</a>)</p></blockquote><blockquote><p>“<strong>If we say that we have no sin, we deceive ourselves</strong>, and the truth is not in us” (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L8">1 John. 1:8</a>)</p></blockquote><blockquote><p>“for <strong>there is no one who does not sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2par/6/#L36">2 Chr. 6:36</a>)</p></blockquote><blockquote><p>“Indeed, let God be true but <strong>every man a liar</strong>. As it is written: ‘That You may be justified in Your words, and may overcome when You are judged’” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L4">Rom. 3:4</a>)</p></blockquote><blockquote><p>“As it is written: ‘<strong>There is none righteous, no, not one</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L10">Rom. 3:10</a>)</p></blockquote><blockquote><p>“But <strong>the Scripture has confined all under sin</strong>, that the promise by faith in Jesus Christ might be given to those who believe” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L22">Gal. 3:22</a>)</p></blockquote><h2>God Calls to Repentance and Amendment</h2><blockquote><p>“Truly, these times of ignorance God overlooked, but <strong><mark>now commands all men everywhere to repent</mark></strong>, because He has appointed a day on which He will judge the world in righteousness by the Man whom He has ordained. He has given assurance of this to all by raising Him from the dead” (<a href="https://bibleox.com/en/eng-nkjv/act/17/#L30-31">Act. 17:30-31</a>)</p></blockquote><blockquote><p>“Then Peter said to them, ‘<strong><mark>Repent, and let every one of you be baptized in the name of Jesus Christ for the remission of sins</mark></strong>; and you shall receive the gift of the Holy Spirit’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Act. 2:38</a>)</p></blockquote><blockquote><p>“<strong><mark>He who believes and is baptized will be saved</mark></strong>; but <strong><mark>he who does not believe will be condemned</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L16">Mark. 16:16</a>)</p></blockquote><p>God calls to salvation through the <a href="https://bibleox.com/ru/ru/w/%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C"><strong>Orthodox Church</strong></a> which He created 2000 years ago, and which one enters through <a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D0%B5"><strong>Baptism</strong></a>.</p>

  - src: Исцеления
    path: Hl13g_Healings
    title: Healings
    meta_desc: Healings through objects, remains (relics), water, clothing, and directly
    menu: { parent: Man, title: Healings, priority: 13 }
    body: |-
      <h2>Through Remains (Relics)</h2><blockquote><p>“So it was, as they were burying a man, that suddenly they spied a band of raiders; and they put the man in the tomb of Elisha; and when the man was let down and touched <strong>the bones of Elisha</strong>, he revived and stood on his feet” (<a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21">2 Kin. 13:21</a>)</p></blockquote><h2>Through Water</h2><blockquote><p>“For an angel went down at a certain time into the pool and <strong>stirred up the water</strong>; then whoever stepped in first, after the stirring of the water, was made well of whatever disease he had” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L4">John. 5:4</a>)</p></blockquote><h2>Through Clothing</h2><blockquote><p>“so that even <strong>handkerchiefs or aprons were brought from his body</strong> to the sick, and the diseases left them and the evil spirits went out of them” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L12">Act. 19:12</a>)</p></blockquote><h2>Through the Image (Shadow) of an Apostle</h2><blockquote><p>“so that <strong>they brought the sick out</strong> into the streets and laid them on beds and couches, <strong>that at least the shadow of Peter passing by might fall on some of them</strong>. Also a multitude gathered from the surrounding cities to Jerusalem, bringing sick people and those who were tormented by unclean spirits, and <strong>they were all healed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15-16">Act. 5:15-16</a>)</p></blockquote><h2>Directly, by the Word of God</h2><blockquote><p>“Therefore I did not even think myself worthy to come to You. But <strong>say the word, and my servant will be healed</strong>. &lt;…&gt; And those who were sent, returning to the house, found the servant well who had been sick” (<a href="https://bibleox.com/en/eng-nkjv/lk/7/#L7,10">Luke. 7:7,10</a>)</p></blockquote><h2>The Action of Grace Through Objects</h2><blockquote><p>“But lift up your <strong>rod</strong>, and stretch out your hand over the sea and divide it. And the children of Israel shall go on dry ground through the midst of the sea” (<a href="https://bibleox.com/en/eng-nkjv/ish/14/#L16">Ex. 14:16</a>)</p></blockquote>

  - src: христианин-раб-Бога
    path: Sv14g_The_Christian_a_Servant_of_God
    title: The Christian — a Servant (Slave) of God
    menu: { parent: Man, title: The Christian — a Servant of God, priority: 14 }
    body: |-
      <p>Christians call themselves servants — literally, slaves (Greek δοῦλοι) — of God, because they strive to do the will of Christ God. Christians serve Christ, they are His slaves, they submit their will to Him, and they do so voluntarily. Christ is such that it is no shame to be His slave. Nor is it a shame to be a slave of the Creator of the world. And in the Kingdom of Christ, to which Christians aspire, it is even an honor to be an obedient slave of the King of kings:</p><blockquote><p>“<strong><mark>Blessed are those servants whom the master, when he comes, will find watching</mark></strong>. Assuredly, I say to you that he will gird himself and have them sit down to eat, and will come and <strong>serve them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L37">Luke. 12:37</a>)</p></blockquote><h2>Christ Commands Us to Call Ourselves His Servants</h2><blockquote><p>“So likewise you, when you have done all those things which you are commanded, <strong><mark>say, ‘We are unprofitable servants</mark></strong>. We have done what was our duty to do’” (<a href="https://bibleox.com/en/eng-nkjv/lk/17/#L10">Luke. 17:10</a>)</p></blockquote><blockquote><p>“<strong>You call Me</strong> Teacher and <strong><mark>Lord</mark></strong>, and <strong><mark>you say well</mark>, for so I am</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/13/#L13">John. 13:13</a>)</p></blockquote><blockquote><p>“Remember the word that I said to you, ‘<strong>A servant is not greater than his master</strong>.’ If they persecuted Me, they will also persecute you. If they kept My word, they will keep yours also” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L20">John. 15:20</a>)</p></blockquote><h2>The Apostles Command Us to Be Servants of Christ</h2><blockquote><p>“Bondservants, be obedient to those who are your masters according to the flesh, with fear and trembling, in sincerity of heart, as to Christ; not with eyeservice, as men-pleasers, but <strong>as bondservants of Christ, </strong>doing the will of God from the heart” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L5-6">Eph. 6:5-6</a>)</p></blockquote><blockquote><p>“For <strong>he who is called in the Lord while a slave</strong> is the Lord’s freedman. Likewise he who is called while free is <strong>Christ’s slave</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L22">1 Cor. 7:22</a>)</p></blockquote><blockquote><p>“as free, yet not using liberty as a cloak for vice, but as <strong>bondservants of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L16">1 Pet. 2:16</a>)</p></blockquote><h2>The Apostles Call Themselves Servants of Christ</h2><blockquote><p>“For do I now persuade men, or God? Or do I seek to please men? For if I still pleased men, I would not be <strong>a bondservant of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/1/#L10">Gal. 1:10</a>)</p></blockquote><blockquote><p>“<strong>Paul, a bondservant of God</strong> and an apostle of Jesus Christ, according to the faith of God’s elect and the acknowledgment of the truth which accords with godliness” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L1">Titus. 1:1</a>)</p></blockquote><blockquote><p>“<strong>Jude, a bondservant of Jesus Christ</strong>, and brother of James, to those who are called, sanctified by God the Father, and preserved in Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L1">Jude. 1:1</a>)</p></blockquote><blockquote><p>“<strong>James, a bondservant of God</strong> and of the Lord Jesus Christ, to the twelve tribes which are scattered abroad: Greetings” (<a href="https://bibleox.com/en/eng-nkjv/iak/1/#L1">James. 1:1</a>)</p></blockquote><blockquote><p>“<strong>Simon Peter, a bondservant and apostle of Jesus Christ</strong>, to those who have obtained like precious faith with us by the righteousness of our God and Savior Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L1">2 Pet. 1:1</a>)</p></blockquote><blockquote><p>“<strong>Paul, a bondservant of Jesus Christ</strong>, called to be an apostle, separated to the gospel of God” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L1">Rom. 1:1</a>)</p></blockquote><blockquote><p>“<strong>Epaphras, who is one of you, a bondservant of Christ</strong>, greets you, always laboring fervently for you in prayers, that you may stand perfect and complete in all the will of God” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L12">Col. 4:12</a>)</p></blockquote><h2>The Theotokos Calls Herself the Handmaid of God</h2><blockquote><p>“Then Mary said, ‘<strong>Behold the maidservant of the Lord</strong>! Let it be to me according to your word.’ And the angel departed from her” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L38">Luke. 1:38</a>)</p></blockquote><h2>In the Old Testament God Called Believers His Servants</h2><blockquote><p>“Behold, <strong>My servants </strong>shall rejoice, but you shall be ashamed; behold, <strong>My servants</strong> shall sing for joy of heart, but you shall cry for sorrow of heart, and wail for grief of spirit” (<a href="https://bibleox.com/en/eng-nkjv/is/65/#L13-14">Is. 65:13-14</a>)</p></blockquote><blockquote><p>“I will bring forth descendants from Jacob, and from Judah an heir of My mountains; My elect shall inherit it, and<strong> My servants </strong>shall dwell there” (<a href="https://bibleox.com/en/eng-nkjv/is/65/#L9">Is. 65:9</a>)</p></blockquote><h2>The Prophets and Believers Called Themselves Servants of God</h2><blockquote><p>“For <strong>I am your servant</strong> <strong>the son of your serving girl</strong>, a man who is weak and short-lived, with little understanding of judgment and laws” (<a href="https://bibleox.com/en/en-nrsv/prs/9/#L5">Wis. 9:5</a>)</p></blockquote><blockquote><p>“So I answered them, and said to them, ‘The God of heaven Himself will prosper us; therefore <strong>we His servants</strong> will arise and build, but you have no heritage or right or memorial in Jerusalem’” (<a href="https://bibleox.com/en/eng-nkjv/neem/2/#L20">Neh. 2:20</a>)</p></blockquote><blockquote><p>“<strong>Now these are Your servants</strong> and Your people, whom You have redeemed by Your great power, and by Your strong hand” (<a href="https://bibleox.com/en/eng-nkjv/neem/1/#L10">Neh. 1:10</a>)</p></blockquote><blockquote><p>“Then she made a vow and said, ‘O LORD of hosts, if You will indeed look on <strong>the affliction of Your maidservant</strong> and remember me, and not forget <strong>Your maidservant</strong>, but will give Your maidservant a male child, then I will give him to the LORD all the days of his life, and no razor shall come upon his head’” (<a href="https://bibleox.com/en/eng-nkjv/1ts/1/#L11">1 Sam. 1:11</a>)</p></blockquote><blockquote><p>“Bless the Lord, <strong>you servants</strong>; sing praise to Him and highly exalt Him forever” (<a href="https://bibleox.com/en/gr-lxx-byz/dan/3/#L85">Dan. 3:85, LXX</a>; the Song of the Three Young Men; translated from the Greek: εὐλογεῖτε, δοῦλοι, τὸν κύριον)</p></blockquote><blockquote><p>“They answered us, ‘<strong>We are the servants of the Lord</strong> who created the heaven and the earth’” (<a href="https://bibleox.com/en/en-nrsv/2ezd/6/#L13">1 Esd. 6:13</a>)</p></blockquote><h2>There Were Slaves Who Loved Their Masters</h2><blockquote><p>“And when you send him away free from you, you shall not let him go away empty-handed; &lt;…&gt; And if it happens that he says to you, ‘<strong>I will not go away from you,’ because he loves you</strong> and your house, since he prospers with you” (<a href="https://bibleox.com/en/eng-nkjv/vtor/15/#L13,16">Deut. 15:13,16</a>)</p></blockquote>

