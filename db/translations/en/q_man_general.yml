# Переводы статей раздела «Цитаты» (ru/q) на английский: «Человек», статьи верхнего уровня.
# Загрузка: bin/rails pages:import_translations FILE=db/translations/en/q_man_general.yml [PUBLISH=1] [DRY_RUN=1]
lang: en
