pages:
  - src: состав-человека
    path: Cm3h_Composition_of_Human_Nature
    title: The Composition of Human Nature
    title_sub: Bible quotes on the composition of human nature
    meta_desc: Bible quotes on the composition of human nature
    menu: { parent: Man, title: The Composition of Human Nature, priority: 3 }
    body: |-
      <p>The composition of human nature:</p><ol><li><p>The fleshly body;</p></li><li><p>The soul;</p></li><li><p>The spirit (a power of the soul).</p></li></ol><h2>The Flesh</h2><blockquote><p>“and in the womb of a mother <strong>I was molded into flesh</strong>, within the period of ten months, compacted with blood, from the seed of a man and the pleasure of marriage” (<a href="https://bibleox.com/en/en-nrsv/prs/7/#L1-2">Wis. 7:1-2</a>)</p></blockquote><h2>Soul and Spirit</h2><blockquote><p>“Now may the God of peace Himself sanctify you <strong>completely</strong>; and may your whole <strong>spirit</strong>, <strong>soul</strong>, and <strong>body</strong> be preserved blameless at the coming of our Lord Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L23">1 Thess. 5:23</a>)</p></blockquote><blockquote><p>“But <strong>his flesh</strong> will be in pain over it, and <strong>his soul</strong> will mourn over it” (<a href="https://bibleox.com/en/eng-nkjv/iov/14/#L22">Job. 14:22</a>)</p></blockquote><blockquote><p>“O God, You are my God; early will I seek You; <strong>my soul</strong> thirsts for You; <strong>my flesh</strong> longs for You in a dry and thirsty land where there is no water” (<a href="https://bibleox.com/en/eng-nkjv/ps/63/#L1">Ps. 63:1</a>)</p></blockquote><blockquote><p>“<strong>My soul</strong> longs, yes, even faints for the courts of the LORD; my heart and <strong>my flesh</strong> cry out for the living God” (<a href="https://bibleox.com/en/eng-nkjv/ps/84/#L2">Ps. 84:2</a>)</p></blockquote><blockquote><p>“The merciful man does good for <strong>his own soul</strong>, but he who is cruel troubles <strong>his own flesh</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/11/#L17">Prov. 11:17</a>)</p></blockquote><h2>At a Person’s Death the Soul Is Separated from the Body</h2><blockquote><p>“And do not fear <strong>those who kill the body but cannot kill the soul</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L28">Matt. 10:28</a>) (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L4">Luke. 12:4</a>)</p></blockquote><blockquote><p>“And in a window sat a certain young man named Eutychus, who was sinking into a deep sleep. He was overcome by sleep; and as Paul continued speaking, he <strong>fell</strong> down from the third story and <strong>was taken up dead</strong>. But Paul went down, fell on him, and embracing him said, ‘<strong>Do not trouble yourselves, for his life is in him</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L9-10">Act. 20:9-10</a>)</p><p>In the Greek: ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν — “for his <strong>soul</strong> is in him”.</p></blockquote><h2>After Death a Person’s Flesh Decays, but the Soul Continues to Exist</h2><blockquote><p>“he, foreseeing this, spoke concerning the resurrection of the Christ, that <strong>His soul</strong> was not left in Hades, nor did <strong>His flesh</strong> see corruption” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L31">Act. 2:31</a>)</p></blockquote><p>Quotes on the <a href="https://bibleox.com/ru/q/%D0%B6%D0%B8%D0%B7%D0%BD%D1%8C-%D0%B4%D1%83%D1%88%D0%B8-%D0%BF%D0%BE%D1%81%D0%BB%D0%B5-%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%B8-%D1%82%D0%B5%D0%BB%D0%B0">immortality of the human soul</a>.</p><h2>At the Resurrection a Person’s Own Former Flesh Is Restored, and the Soul Returns, Reuniting with Its Flesh</h2><blockquote><p>“For I know that my Redeemer lives, and He shall stand at last on the earth; and after <mark>my skin</mark> is destroyed, this I know, <strong>that <mark>in my flesh</mark> I shall see God, <mark>whom I shall see for myself, and my eyes shall behold, and not another</mark></strong>. How my heart yearns within me!” (<a href="https://bibleox.com/en/eng-nkjv/iov/19/#L25-27">Job. 19:25-27</a>)</p><p>In the Septuagint (<a href="https://bibleox.com/en/gr-lxx-byz/iov/19/#L26">Job. 19:26, LXX</a>): ἀναστήσαι τὸ δέρμα μου — “may He <strong>raise up my skin</strong>”.</p></blockquote>

  - src: человек-образ-Бога
    path: Im4g_Man_the_Image_of_God
    title: Man — the Image of God
    meta_desc: Bible quotes about man as the image of God
    menu: { parent: Man, title: Man — the Image of God, priority: 4 }
    body: |-
      <h2>Man Was Conceived to Be the Image and Likeness of God:</h2><blockquote><p>“Then God said, ‘Let Us make man <strong>in Our image</strong>, <strong>according to Our likeness</strong>…’” (<a href="https://bibleox.com/en/eng-nkjv/gen/1/#L26">Gen. 1:26</a>)</p></blockquote><p>However, he is created only in the image:</p><blockquote><p>“So God <strong>created</strong> man <strong>in His own image</strong>; <strong>in the image of God He created him</strong>; male and female He created them” (<a href="https://bibleox.com/en/eng-nkjv/gen/1/#L27">Gen. 1:27</a>)</p></blockquote><blockquote><p>“This is the book of the genealogy of Adam. In the day that God created man, <strong>He made him in the likeness of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/5/#L1">Gen. 5:1</a>)</p><p>In the Septuagint (<a href="https://bibleox.com/en/gr-lxx-byz/gen/5/#L1">Gen. 5:1, LXX</a>), which the Church Slavonic text follows: κατ᾿ εἰκόνα θεοῦ ἐποίησεν αὐτόν — “<strong>in the image of God</strong> He made him”.</p></blockquote><blockquote><p>“Whoever sheds man’s blood, by man his blood shall be shed; for <strong>in the image of God He made man</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/9/#L6">Gen. 9:6</a>)</p></blockquote><h3>The Image of God in Man</h3><p>Eternal being:</p><blockquote><p>“for God created us for incorruption, and made us <strong>in the image of his own eternity</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/2/#L23">Wis. 2:23</a>)</p></blockquote><h3>The Likeness of God in Man</h3><p>Man is only called to become like God:</p><blockquote><p>“Take My yoke upon you and <strong>learn from Me</strong>, for I am gentle and lowly in heart, and <strong>you will find rest</strong> for your souls” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L29">Matt. 11:29</a>)</p></blockquote><blockquote><p>“For whom He foreknew, He also predestined <strong>to be conformed to the image of His Son</strong>, that He might be the firstborn among many brethren” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L29">Rom. 8:29</a>)</p></blockquote>

  - src: человек-храм-Божий
    path: Tm5g_Man_the_Temple_of_God
    title: Man — the Temple of God
    menu: { parent: Man, title: Man — the Temple of God, priority: 5 }
    body: |-
      <blockquote><p>“Or do you not know that <strong>your body is the temple of the Holy Spirit who is in you</strong>, whom you have from God, and you are not your own?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L19">1 Cor. 6:19</a>)</p></blockquote><blockquote><p>“If anyone defiles the temple of God, God will destroy him. For the temple of God is holy, <strong>which temple you are</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L17">1 Cor. 3:17</a>)</p></blockquote><blockquote><p>“Do you not know that <strong>you are the temple of God</strong> and that the Spirit of God dwells in you?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L16">1 Cor. 3:16</a>)</p></blockquote><blockquote><p>“And what agreement has the temple of God with idols? For <strong>you are the temple of the living God</strong>. As God has said: ‘<strong>I will dwell in them and walk among them</strong>. I will be their God, and they shall be My people’” (<a href="https://bibleox.com/en/eng-nkjv/2kor/6/#L16">2 Cor. 6:16</a>)</p></blockquote><blockquote><p>“Then the Jews said, ‘It has taken forty-six years to build this temple, and will You raise it up in three days?’ But He was speaking of <strong>the temple of His body</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/2/#L20-21">John. 2:20-21</a>)</p></blockquote><blockquote><p>“but Christ as a Son over His own house, <strong>whose house we are</strong> if we hold fast the confidence and the rejoicing of the hope firm to the end” (<a href="https://bibleox.com/en/eng-nkjv/evr/3/#L6">Heb. 3:6</a>)</p></blockquote><blockquote><p>“in whom the whole building, being fitted together, grows into a holy temple in the Lord, in whom <strong>you also are being built together for a dwelling place of God</strong> in the Spirit” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L21-22">Eph. 2:21-22</a>)</p></blockquote>

  - src: расы-и-народы
    path: Rn6p_Races_and_Peoples
    title: Races and Peoples
    title_sub: Bible quotes about races and peoples
    meta_desc: Bible quotes about the origin of mankind, races and peoples
    menu: { parent: Man, title: Races and Peoples, priority: 6 }
    body: |-
      <p>In the beginning God created Adam:</p><blockquote><p>“And <strong>the LORD God formed man</strong> (Heb. אָדָ֗ם — Adam) of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living being” (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L7">Gen. 2:7</a>)</p></blockquote><p>Then, from Adam’s rib, He created Eve:</p><blockquote><p>“But for Adam <strong>there was not found a helper comparable to him</strong> &lt;...&gt; Then <strong>the rib which the LORD God had taken from man He made into a woman</strong>, and He brought her to the man” (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L20-22">Gen. 2:20-22</a>)</p></blockquote><p>Many children were born to Adam:</p><blockquote><p>“<strong>After he begot Seth</strong>, the days of Adam were eight hundred years; and <strong>he had sons and daughters</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/5/#L4">Gen. 5:4</a>)</p></blockquote><p>After Seth (that is, three boys had already been born: <a href="https://bibleox.com/en/eng-nkjv/gen/4/#L1">Cain</a>, <a href="https://bibleox.com/en/eng-nkjv/gen/4/#L2">Abel</a> and <a href="https://bibleox.com/en/eng-nkjv/gen/4/#L25">Seth</a>), more sons and daughters were born. The writer of Genesis, however, pays them no further attention, since his gaze turns only to those details of the story which he considers important for the reader. What follows lists only individual lines of genealogy through the fathers (according to Jewish tradition) from Cain and from Seth. From Cain the line is mentioned that leads to the inventors of musical instruments (<a href="https://bibleox.com/en/eng-nkjv/gen/4/#L21">Gen. 4:21</a>), of weapons (<a href="https://bibleox.com/en/eng-nkjv/gen/4/#L22">Gen. 4:22</a>), of polygamy (<a href="https://bibleox.com/en/eng-nkjv/gen/4/#L19">Gen. 4:19</a>). Some of the fathers from Seth to Noah are listed (<a href="https://bibleox.com/en/eng-nkjv/gen/5/#L6-29">Gen. 5:6-29</a>). Seth begot many sons and daughters (<a href="https://bibleox.com/en/eng-nkjv/gen/5/#L7">Gen. 5:7</a>), but only one of them is mentioned: Enosh (<a href="https://bibleox.com/en/eng-nkjv/gen/4/#L26">Gen. 4:26</a>). And so with the rest. Then people multiply, forget God, and drown first in sins and then in the waters of the flood. All people except Noah’s family die. And now it is from Noah’s family that all the races descend (<a href="https://bibleox.com/en/eng-nkjv/gen/9/#L19">Gen. 9:19</a>). Noah begot Shem, Ham and Japheth:</p><blockquote><p>“And Noah was five hundred years old, and Noah begot Shem, Ham, and Japheth” (<a href="https://bibleox.com/en/eng-nkjv/gen/5/#L32">Gen. 5:32</a>)</p></blockquote><blockquote><p>“And Noah begot three sons: Shem, Ham, and Japheth” (<a href="https://bibleox.com/en/eng-nkjv/gen/6/#L10">Gen. 6:10</a>)</p></blockquote><blockquote><p>“On the very same day Noah and Noah’s sons, Shem, Ham, and Japheth, and Noah’s wife and the three wives of his sons with them, entered the ark” (<a href="https://bibleox.com/en/eng-nkjv/gen/7/#L13">Gen. 7:13</a>)</p></blockquote><blockquote><p>“Now the sons of Noah who went out of the ark were Shem, Ham, and Japheth. And Ham was the father of Canaan” (<a href="https://bibleox.com/en/eng-nkjv/gen/9/#L18">Gen. 9:18</a>)</p></blockquote><p>Ham:</p><blockquote><p>“The sons of Ham were Cush, Mizraim, Put, and Canaan” (<a href="https://bibleox.com/en/eng-nkjv/gen/10/#L6">Gen. 10:6</a>)</p></blockquote><blockquote><p>“The sons of Ham were Cush, Mizraim, Put, and Canaan” (<a href="https://bibleox.com/en/eng-nkjv/1par/1/#L8">1 Chr. 1:8</a>)</p></blockquote><p><strong>Cush</strong> — Ethiopia (black); <strong>Mizraim</strong> — Egypt (swarthy); <strong>Put</strong> — Libya (white); <strong>Canaan</strong> — the western part of the Fertile Crescent (not black), and it is he whom Noah curses (<a href="https://bibleox.com/en/eng-nkjv/gen/9/#L25,27">Gen. 9:25,27</a>). The Sumerians (not black) also descended from a descendant of Cush (Nimrod — <a href="https://bibleox.com/en/eng-nkjv/gen/10/#L8">Gen. 10:8</a>). [<a href="https://www.youtube.com/watch?v=JPGyRZqSZkY">Detailed analysis (in Russian)</a>] <strong><em>Note</em></strong><em>: the sons of Adam took their sisters as wives. There was simply no other way to fulfill the divine commandment to multiply. Moreover, a similar situation arose with the grandsons of Noah: after the flood all people on Earth were the closest of relatives. Incest becomes forbidden much later, under the prophet Moses. The Jewish people descend from a brother and sister: Abraham and Sarah (</em><a href="https://bibleox.com/en/eng-nkjv/gen/20/#L12"><em>Gen. 20:12</em></a><em>). The rest of this article still needs work: the information found in the Bible about the forefathers of peoples and races remains to be described.</em></p>

  - src: образование
    path: Ed7c_Education
    title: Education
    title_sub: Bible quotes on the necessity of education
    meta_desc: Bible quotes on the necessity of education
    menu: { parent: Man, title: Education, priority: 7 }
    body: |-
      <blockquote><p>“My child, <strong>from your youth choose discipline</strong>, and when you have gray hair <strong>you will still find wisdom</strong>. Come to her like one who plows and sows, and wait for her good harvest. For when you cultivate her you will toil but little, and soon you will eat of her produce. <strong>She seems very harsh to the undisciplined</strong>; fools cannot remain with her. She will be like a heavy stone to test them, and they will not delay in casting her aside” (<a href="https://bibleox.com/en/en-nrsv/prsir/6/#L18-21">Sir. 6:18-21</a>)</p></blockquote><blockquote><p>“<strong>How long, you simple ones, will you love simplicity?</strong> For scorners delight in their scorning, and fools hate knowledge. &lt;…&gt; For <strong>the turning away of the simple will slay them, and the complacency of fools will destroy them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/1/#L22,32">Prov. 1:22,32</a>)</p></blockquote><blockquote><p>“Better is the poor who walks in his integrity than one who is perverse in his lips, and is <strong>a fool</strong>. Also it is not good for a soul to be without knowledge, and he sins who hastens with his feet. <strong>The foolishness of a man twists his way</strong>, and his heart frets against the LORD” (<a href="https://bibleox.com/en/eng-nkjv/pr/19/#L1-3">Prov. 19:1-3</a>)</p></blockquote><blockquote><p>“<strong>He who gets wisdom loves his own soul</strong>; he who keeps understanding will find good” (<a href="https://bibleox.com/en/eng-nkjv/pr/19/#L8">Prov. 19:8</a>)</p></blockquote><blockquote><p>“I went by the field of the lazy man, and by the vineyard of <strong>the man devoid of understanding</strong>; and there it was, <strong>all overgrown with thorns</strong>; its surface was covered with nettles; its stone wall was broken down” (<a href="https://bibleox.com/en/eng-nkjv/pr/24/#L30-31">Prov. 24:30-31</a>)</p></blockquote><blockquote><p>“<strong>Take heed to yourself and to the doctrine. Continue in them</strong>, for in doing this you will save both yourself and those who hear you” (<a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L16">1 Tim. 4:16</a>)</p></blockquote><blockquote><p>“<strong>Understand, you senseless among the people</strong>; and <strong>you fools</strong>, when will you be wise?” (<a href="https://bibleox.com/en/eng-nkjv/ps/94/#L8">Ps. 94:8</a>)</p></blockquote><blockquote><p>“Whoever loves instruction loves knowledge, but <strong>he who hates correction is stupid</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/12/#L1">Prov. 12:1</a>)</p></blockquote><blockquote><p>“For <strong>the turning away of the simple will slay them</strong>, and the complacency of fools will destroy them” (<a href="https://bibleox.com/en/eng-nkjv/pr/1/#L32">Prov. 1:32</a>)</p></blockquote><blockquote><p>“<strong>The simple inherit folly</strong>, but the prudent are crowned with knowledge” (<a href="https://bibleox.com/en/eng-nkjv/pr/14/#L18">Prov. 14:18</a>)</p></blockquote><blockquote><p>“The crown of the wise is their riches, but <strong>the foolishness of fools is folly</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/14/#L24">Prov. 14:24</a>)</p></blockquote><blockquote><p>“A <strong>lie</strong> is an ugly blot on a person; <strong>it is continually on the lips of the ignorant</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/20/#L24">Sir. 20:24</a>)</p></blockquote><blockquote><p>“<strong>The beginning of wisdom is the most sincere desire for instruction</strong>, and <strong>concern for instruction is love of her</strong>, and love of her is the keeping of her laws, and giving heed to her laws is assurance of immortality” (<a href="https://bibleox.com/en/en-nrsv/prs/6/#L17-18">Wis. 6:17-18</a>)</p></blockquote><blockquote><p>“Now as Jannes and Jambres resisted Moses, so do these also <strong>resist the truth</strong>: men of corrupt minds, <strong>disapproved concerning the faith</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L8">2 Tim. 3:8</a>)</p></blockquote><blockquote><p>“as also in all his epistles, speaking in them of these things, in which are some things hard to understand, which <strong>untaught</strong> and unstable people <strong>twist to their own destruction, as they do also the rest of the Scriptures</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L16">2 Pet. 3:16</a>)</p></blockquote>

  - src: человек-труд
    path: Wk8l_Labor
    title: Labor
    title_sub: Bible quotes on the necessity of working
    meta_desc: Bible quotes on the necessity of working
    menu: { parent: Man, title: Labor, priority: 8 }
    body: |-
      <blockquote><p>“<strong><mark>In the sweat of your face you shall eat bread</mark></strong> till you return to the ground, for out of it you were taken; for dust you are, and to dust you shall return” (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L19">Gen. 3:19</a>)</p></blockquote><blockquote><p>“But we <strong><mark>urge</mark></strong> you, brethren, that you increase more and more; that you also aspire to lead a quiet life, to mind your own business, and <strong><mark>to work with your own hands</mark>, as we commanded you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/4/#L10-11">1 Thess. 4:10-11</a>)</p></blockquote><blockquote><p>“After these things <strong>Paul</strong> departed from Athens and went to Corinth. &lt;...&gt; So, <strong>because he was of the same trade</strong>, he stayed with them and worked; for <strong><mark>by occupation they were tentmakers</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/18/#L1,3">Act. 18:1,3</a>)</p></blockquote><blockquote><p>“To the present hour we both hunger and thirst, and we are poorly clothed, and beaten, and homeless. And <strong><mark>we labor, working with our own hands</mark></strong>. Being reviled, we bless; being persecuted, we endure” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L11-12">1 Cor. 4:11-12</a>)</p></blockquote><blockquote><p>“Let him who stole steal no longer, but <strong><mark>rather let him labor, working with his hands what is good</mark></strong>, that he may have something to give him who has need” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L28">Eph. 4:28</a>)</p></blockquote><blockquote><p>“<strong>I have coveted no one’s silver or gold or apparel</strong>. Yes, you yourselves know that <strong><mark>these hands have provided for my necessities</mark>, and for those who were with me</strong>. I have shown you in every way, by laboring like this, that you must support the weak. And remember the words of the Lord Jesus, that He said, ‘It is more blessed to give than to receive’” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L33-35">Act. 20:33-35</a>)</p></blockquote><blockquote><p>“For our exhortation did not come from error or uncleanness, nor was it in deceit. &lt;...&gt; For <strong>neither at any time did we use</strong> flattering words, as you know, nor <strong>a cloak for covetousness</strong> — God is witness. &lt;...&gt; For you remember, brethren, our labor and toil; for <strong><mark>laboring night and day, that we might not be a burden to any of you</mark></strong>, we preached to you the gospel of God” (<a href="https://bibleox.com/en/eng-nkjv/1sol/2/#L3,5,9">1 Thess. 2:3,5,9</a>)</p></blockquote><blockquote><p>“<strong>nor did we eat anyone’s bread free of charge, but <mark>worked with labor and toil night and day</mark>, that we might not be a burden to any of you,</strong> not because we do not have authority, but to make ourselves an example of how you should follow us. For even when we were with you, we commanded you this: <strong>If anyone will not work, neither shall he eat</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L8-10">2 Thess. 3:8-10</a>)</p></blockquote><blockquote><p>“<strong><mark>Do not hate hard labor</mark></strong> or farm work, which was created by the Most High” (<a href="https://bibleox.com/en/en-nrsv/prsir/7/#L15">Sir. 7:15</a>)</p></blockquote><blockquote><p>“<strong><mark>Better is the worker</mark></strong> who has goods in plenty than the boaster who lacks bread” (<a href="https://bibleox.com/en/en-nrsv/prsir/10/#L27">Sir. 10:27</a>)</p></blockquote><blockquote><p>“Put him to work, in order that he may not be idle, for <strong><mark>idleness teaches much evil</mark></strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/33/#L28-29">Sir. 33:28-29</a>)</p></blockquote><blockquote><p>“I went by the field of <strong>the lazy man</strong>, and by the vineyard of the man devoid of understanding; and there it was, all overgrown with thorns; its surface was covered with nettles; its stone wall was broken down” (<a href="https://bibleox.com/en/eng-nkjv/pr/24/#L30-31">Prov. 24:30-31</a>)</p></blockquote>

