      <p>Concerning clothing, the Old Testament contains this prohibition:</p><blockquote><p>“<strong>A woman shall not wear anything that pertains to a man, nor shall a man put on a woman’s garment</strong>, for all who do so are an abomination to the LORD your God” (<a href="https://bibleox.com/en/eng-nkjv/vtor/22/#L5">Deut. 22:5</a>)</p></blockquote><p>Evidently this prohibition is directed against <a href="https://bibleox.com/ru/ru/w/XBGN_%D0%A2%D1%80%D0%B0%D0%BD%D1%81%D0%B2%D0%B5%D1%81%D1%82%D0%B8%D0%B7%D0%BC">perversions</a>, when a person deliberately aims to look like the opposite sex, or is in some abnormal state.</p><hr><p>In the New Testament there are words about covering the head:</p><blockquote><p>“But every <strong>woman who prays or prophesies with her head uncovered</strong> dishonors her head, for that is one and the same as if her head were shaved” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L5">1 Cor. 11:5</a>)</p></blockquote><p>In the modern world various kinds of clothing have been devised for women, including women’s trousers, but church tradition has adopted certain rules regarding the appearance of parishioners (it should be modest): women are advised to come in skirts with their heads covered and to use as little cosmetics as possible, while for men moderately covering clothes are recommended (shorts and a tank top would be unsuitable clothing for church). This is to be done in order to appear neat before God (inner order does not exclude outer order), and also so as not to distract, by a provocative appearance, our neighbors who have come to church to pray.</p><p>When they have one or another practical difficulty in keeping the tradition, women sometimes bring a scarf or something similar with them, to tie over their trousers before entering the church.</p><p>Sometimes certain parishioners react inappropriately to those who break this tradition — not out of ill will, but simply because they came into the church out of curiosity or to pray without knowing about it. Such parishioners are urged not to frighten people or drive them away, and still less to be rude to them.</p>
