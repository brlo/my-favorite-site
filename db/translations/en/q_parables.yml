  - src: притча-о-виноградарях
    path: Wv1n_The_Wicked_Vinedressers
    title: The Wicked Vinedressers
    meta_desc: The biblical parable of Jesus Christ about the wicked vinedressers
    menu: { parent: Parables, title: The Wicked Vinedressers, priority: 1 }
    body: |-
      <p>The parable of Jesus Christ about the wicked vinedressers:</p><blockquote>“Hear another parable: There was a certain landowner who planted a vineyard and set a hedge around it, dug a winepress in it and built a tower. And he leased it to vinedressers and went into a far country. Now when vintage-time drew near, he sent his servants to the vinedressers, that they might receive its fruit. And the vinedressers took his servants, beat one, killed one, and stoned another. Again he sent other servants, more than the first, and they did likewise to them. Then last of all he sent his son to them, saying, ‘They will respect my son.’ But when the vinedressers saw the son, they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’ So they took him and cast him out of the vineyard and killed him. Therefore, when the owner of the vineyard comes, what will he do to those vinedressers?” They said to Him, “He will destroy those wicked men miserably, and lease his vineyard to other vinedressers who will render to him the fruits in their seasons.” &lt;…&gt; Now when the chief priests and Pharisees heard His parables, they perceived that He was speaking of them” (<a href="https://bibleox.com/en/eng-nkjv/mf/21/#L33-41,45">Matt. 21:33-41,45</a>)</blockquote>

  - src: притча-о-работниках-в-винограднике
    path: Lv2y_The_Laborers_in_the_Vineyard
    title: The Laborers in the Vineyard
    meta_desc: The parable of the laborers in the vineyard
    menu: { parent: Parables, title: The Laborers in the Vineyard, priority: 2 }
    body: |-
      <p>The parable of Jesus Christ about the equal wages paid to different laborers in the vineyard:</p><blockquote>“For the kingdom of heaven is like a landowner who went out early in the morning to hire laborers for his vineyard. Now when he had agreed with the laborers for a denarius a day, he sent them into his vineyard. And he went out about the third hour and saw others standing idle in the marketplace, and said to them, ‘You also go into the vineyard, and whatever is right I will give you.’ So they went. Again he went out about the sixth and the ninth hour, and did likewise. And about the eleventh hour he went out and found others standing idle, and said to them, ‘Why have you been standing here idle all day?’ They said to him, ‘Because no one hired us.’ He said to them, ‘You also go into the vineyard, and whatever is right you will receive.’ So when evening had come, the owner of the vineyard said to his steward, ‘Call the laborers and give them their wages, beginning with the last to the first.’ And when those came who were hired about the eleventh hour, they each received a denarius. But when the first came, they supposed that they would receive more; and they likewise received each a denarius. And when they had received it, they complained against the landowner, saying, ‘These last men have worked only one hour, and you made them equal to us who have borne the burden and the heat of the day.’ But he answered one of them and said, ‘Friend, I am doing you no wrong. Did you not agree with me for a denarius? Take what is yours and go your way. I wish to give to this last man the same as to you. Is it not lawful for me to do what I wish with my own things? Or is your eye evil because I am good?’ So the last will be first, and the first last. For many are called, but few chosen” (<a href="https://bibleox.com/en/eng-nkjv/mf/20/#L1-16">Matt. 20:1-16</a>)</blockquote>

  - src: о-мытаре-и-фарисее
    path: Pt2c_The_Pharisee_and_the_Tax_Collector
    title: The Pharisee and the Tax Collector
    title_sub: A parable
    menu: { parent: Parables, title: The Pharisee and the Tax Collector, priority: 2 }
    body: |-
      <blockquote><p>“Two men went up to the temple to pray, <strong>one a Pharisee and the other a tax collector</strong>. The Pharisee stood and prayed thus with himself, ‘God, I thank You that I am not like other men — extortioners, unjust, adulterers, or even as this tax collector. I fast twice a week; I give tithes of all that I possess.’ And the tax collector, standing afar off, would not so much as raise his eyes to heaven, but beat his breast, saying, ‘God, be merciful to me a sinner!’ I tell you, this man went down to his house justified rather than the other; for everyone who exalts himself will be humbled, and he who humbles himself will be exalted” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L10-14">Luke. 18:10-14</a>)</p></blockquote>

  - src: о_милосердном_самарянине
    path: Gs3m_The_Good_Samaritan
    title: The Good Samaritan
    menu: { parent: Parables, title: The Good Samaritan, priority: 3 }
    body: |-
      <h2>The Parable</h2><blockquote><p>“But he [the lawyer], wanting to justify himself, said to Jesus, ‘And who is my neighbor?’ Then Jesus answered and said: ‘A certain man went down from Jerusalem to Jericho, and fell among thieves, who stripped him of his clothing, wounded him, and departed, leaving him half dead. Now by chance a certain priest came down that road. And when he saw him, he passed by on the other side. Likewise a Levite, when he arrived at the place, came and looked, and passed by on the other side. But a certain Samaritan, as he journeyed, came where he was. And when he saw him, he had compassion. So he went to him and <strong>bandaged his <mark>wounds</mark></strong>, pouring on oil and wine; and <strong>he set him on his own <mark>animal</mark></strong>, <strong>brought him to an <mark>inn</mark>, and took care of him</strong>. On the next day, when he departed, he took out two denarii, gave them to the innkeeper, and said to him, “Take care of him; and whatever more you spend, when I come again, I will repay you.” So which of these three do you think was neighbor to him who fell among the thieves?’ And he said, ‘He who showed mercy on him.’ Then Jesus said to him, ‘Go and do likewise’” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L29-37">Luke. 10:29-37</a>)</p></blockquote><h2>An Explanation of the Parable</h2><h3>Priest Georgy Maximov</h3><blockquote><p>The parable of the good Samaritan — what is it about?</p><p>Today in the Gospel reading we heard the parable of the good Samaritan. At the beginning the circumstances in which this parable was told are related: a certain lawyer came to Christ to test Him and asked the question: “What must I do to be saved?” As the holy fathers explain, he hoped to provoke Christ into words that could be presented as contradicting the Law of Moses. But Jesus, seeing his heart, asks: “What is written in the Law?” And he answers: love God and your neighbor. The Lord says to him: you have answered well, so do this. By this He at once destroyed the man’s cunning design and showed the absurdity of his question: if you already know the answer to your question, why do you ask?</p><p>But in order, as the evangelist says, “to justify himself”, to show that he supposedly asks the question not out of cunning but out of misunderstanding, the lawyer asks: “And who is my neighbor?” And the Lord answers him with the parable of the good Samaritan, at the end of which He asks: what do you think, which of those mentioned in this parable was a neighbor to the man who suffered from the robbers? And His questioner has to admit that the Samaritan was the neighbor.</p><p>From the Lord’s first answer we see, as St. Theophan the Recluse said, that everything necessary for salvation we can learn from Holy Scripture. But then this man asks a question to which there was no unambiguous answer in the Holy Scripture of the Old Testament. And then Christ shows that his very conscience testifies how to act rightly. Each of us, by virtue of this voice of conscience, already knows how to act rightly, and, conversely, which deeds are wrong and displeasing to God. In this is a symbol of how we will be judged after the resurrection at the Dread Judgment of Christ. Many saints said that then a person’s conscience will testify against him, that is, the person himself will be his own accuser, his own prosecutor. Therefore at that judgment there will be no disputes and objections — “I didn’t do it, I didn’t know” — because each one’s conscience will testify, just as this scribe’s conscience testified. We knew that this was displeasing to God, and we knew how we should have acted rightly, according to conscience. And if we acted wrongly, our conscience will not let us justify ourselves.</p><p>The parable the Lord told, in its literal sense, says that one should not consider as a neighbor only a fellow tribesman and one who shares one’s views, as the Jews thought. Christ showed the scribe that his own conscience testifies that a neighbor can be even one whom all the Jews of that time considered a stranger. That is why He gave the example of a Samaritan, whom the Jews despised. At the same time the Lord shows in this parable that it is precisely deeds of love, mercy and goodness that can make us too neighbors to any person to whom we do good.</p><p>As for the spiritual understanding of this parable, according to the explanation of Blessed Theophylact, the man who fell among robbers is all mankind; the robbers are the devil and the demons; the priest and the Levite who passed by the injured man signify the old Law, which could explain what is good and what is bad, but did not save man. And finally, in the image of the Samaritan the Lord Jesus Christ Himself appears here.</p><p>The inn to which he brings the injured man signifies the Church; the innkeeper is the pastors of the Church; the two denarii which the Samaritan gives for the treatment of the injured man are the Old and New Testaments. As ancient coins bore the image of the king, so the Old and New Testaments alike bear the image of the Heavenly King, our Lord. That he treated the wounds of the injured man with oil and wine signifies the sacraments of the Church: oil — Chrismation, wine — the Eucharist. That it was not the innkeeper but the Samaritan who did this shows that the One who performs the sacraments is Christ Himself, and not the pastors. Finally, the Samaritan’s words, “If you spend anything more than these two denarii on healing this man, I will repay you later,” refer to the efforts and expenses which many pastors of the Church undertook for the sake of their flock. And you know from the lives of the saints that many spent on this not only their property, but also their health, and their very life — all this the Lord will repay them a hundredfold when He returns in His Second Coming.</p><p>Being edified by these words of the Gospel, let us too hold fast to the Church of Christ, learn from Holy Scripture, and strive to do works of mercy. Doing good brings light into our soul and makes us Christlike. As the Lord showed mercy to all mankind and to us, so we become at least a little like the Lord when we show mercy to one who is in need or has fallen into trouble. And, walking this way, we will find ourselves where the Lord wants to see us all — in the Kingdom of Heaven.</p></blockquote><p>(translated from the Russian; <a href="https://vk.com/wall293099986_47857">source, in Russian</a>)</p>

  - src: притча-о-двух-сынах
    path: Ts3s_The_Two_Sons
    title: The Two Sons
    meta_desc: The biblical parable of Jesus Christ about the two sons
    menu: { parent: Parables, title: The Two Sons, priority: 3 }
    body: |-
      <p>The parable of Jesus Christ about the two sons:</p><blockquote>“A man had two sons, and he came to the first and said, ‘Son, go, work today in my vineyard.’ He answered and said, ‘I will not,’ but afterward he regretted it and went. Then he came to the second and said likewise. And he answered and said, ‘I go, sir,’ but he did not go. Which of the two did the will of his father?” They said to Him, “The first.” Jesus said to them, “Assuredly, I say to you that tax collectors and harlots enter the kingdom of God before you” (<a href="https://bibleox.com/en/eng-nkjv/mf/21/#L28-31">Matt. 21:28-31</a>)</blockquote>

  - src: Притча_о_блудном_сына
    path: Ps3n_The_Prodigal_Son
    title: The Parable of the Prodigal Son
    meta_desc: The biblical parable of the prodigal son
    menu: { parent: Parables, title: The Prodigal Son, priority: 3 }
    body: |-
      <blockquote><p>“Then He said: ‘A certain man had two sons. And the younger of them said to his father, “Father, give me the portion of goods that falls to me.” So he divided to them his livelihood. And not many days after, the younger son gathered all together, journeyed to a far country, and there wasted his possessions with prodigal living. But when he had spent all, there arose a severe famine in that land, and he began to be in want. Then he went and joined himself to a citizen of that country, and he sent him into his fields to feed swine. And he would gladly have filled his stomach with the pods that the swine ate, and no one gave him anything. But when he came to himself, he said, “How many of my father’s hired servants have bread enough and to spare, and I perish with hunger! I will arise and go to my father, and will say to him, ‘Father, I have sinned against heaven and before you, and I am no longer worthy to be called your son. Make me like one of your hired servants.’” And he arose and came to his father. But when he was still a great way off, his father saw him and had compassion, and ran and fell on his neck and kissed him. And the son said to him, “Father, I have sinned against heaven and in your sight, and am no longer worthy to be called your son.” But the father said to his servants, “Bring out the best robe and put it on him, and put a ring on his hand and sandals on his feet. And bring the fatted calf here and kill it, and let us eat and be merry; for this my son was dead and is alive again; he was lost and is found.” And they began to be merry. Now his older son was in the field. And as he came and drew near to the house, he heard music and dancing. So he called one of the servants and asked what these things meant. And he said to him, “Your brother has come, and because he has received him safe and sound, your father has killed the fatted calf.” But he was angry and would not go in. Therefore his father came out and pleaded with him. So he answered and said to his father, “Lo, these many years I have been serving you; I never transgressed your commandment at any time; and yet you never gave me a young goat, that I might make merry with my friends. But as soon as this son of yours came, who has devoured your livelihood with harlots, you killed the fatted calf for him.” And he said to him, “Son, you are always with me, and all that I have is yours. It was right that we should make merry and be glad, for your brother was dead and is alive again, and was lost and is found”’” (<a href="https://bibleox.com/en/eng-nkjv/lk/15/#L11-32">Luke. 15:11-32</a>)</p></blockquote>

  - src: притча-о-званных-на-пир
    path: Wf4t_The_Wedding_Feast
    title: Those Invited to the Wedding Feast
    meta_desc: The biblical parable of Jesus Christ about those invited to the wedding feast
    menu: { parent: Parables, title: Those Invited to the Feast, priority: 4 }
    body: |-
      <p>The biblical parable of Jesus Christ about those invited to the wedding feast:</p><blockquote>“The kingdom of heaven is like a certain king who arranged a marriage for his son, and sent out his servants to call those who were invited to the wedding; and they were not willing to come. Again, he sent out other servants, saying, ‘Tell those who are invited, “See, I have prepared my dinner; my oxen and fatted cattle are killed, and all things are ready. Come to the wedding.”’ But they made light of it and went their ways, one to his own farm, another to his business. And the rest seized his servants, treated them spitefully, and killed them. But when the king heard about it, he was furious. And he sent out his armies, destroyed those murderers, and burned up their city. Then he said to his servants, ‘The wedding is ready, but those who were invited were not worthy. Therefore go into the highways, and as many as you find, invite to the wedding.’ So those servants went out into the highways and gathered together all whom they found, both bad and good. And the wedding hall was filled with guests. But when the king came in to see the guests, he saw a man there who did not have on a wedding garment. So he said to him, ‘Friend, how did you come in here without a wedding garment?’ And he was speechless. Then the king said to the servants, ‘Bind him hand and foot, take him away, and cast him into outer darkness; there will be weeping and gnashing of teeth.’ For many are called, but few are chosen” (<a href="https://bibleox.com/en/eng-nkjv/mf/22/#L2-14">Matt. 22:2-14</a>)</blockquote>

  - src: притча_о_выборе_места_на_свадьбе
    path: Cp5w_Choosing_a_Place_at_a_Wedding
    title: Choosing a Place at a Wedding
    menu: { parent: Parables, title: Choosing a Place at a Wedding, priority: 5 }
    body: |-
      <blockquote><p>“When you are invited by anyone to a wedding feast, <strong>do not sit down in the best place</strong>, lest one more honorable than you be invited by him; and he who invited you and him come and say to you, ‘Give place to this man,’ and then <strong>you begin with shame to take the lowest place</strong>. But when you are invited, go and <strong>sit down in the lowest place</strong>, so that when he who invited you comes he may say to you, ‘<strong>Friend, go up higher.’ Then you will have glory in the presence of those who sit</strong> at the table with you. For <strong><mark>whoever exalts himself will be humbled, and he who humbles himself will be exalted</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/14/#L8-11">Luke. 14:8-11</a>).</p></blockquote>

  - src: притча_о_богаче_и_Лазаре
    path: Rl10z_The_Rich_Man_and_Lazarus
    title: The Rich Man and Lazarus
    title_sub: A parable
    menu: { parent: Parables, title: The Rich Man and Lazarus, priority: 10 }
    body: |-
      <blockquote><p>“There was a certain rich man who was clothed in purple and fine linen and fared sumptuously every day. But there was a certain beggar named Lazarus, full of sores, who was laid at his gate, desiring to be fed with the crumbs which fell from the rich man’s table. Moreover the dogs came and licked his sores. So it was that the beggar died, and was carried by the angels to Abraham’s bosom. The rich man also died and was buried. And being in torments in Hades, he lifted up his eyes and saw Abraham afar off, and Lazarus in his bosom. Then he cried and said, ‘Father Abraham, have mercy on me, and send Lazarus that he may dip the tip of his finger in water and cool my tongue; for I am tormented in this flame.’ But Abraham said, ‘Son, remember that in your lifetime you received your good things, and likewise Lazarus evil things; but now he is comforted and you are tormented. And besides all this, between us and you there is a great gulf fixed, so that those who want to pass from here to you cannot, nor can those from there pass to us.’ Then he said, ‘I beg you therefore, father, that you would send him to my father’s house, for I have five brothers, that he may testify to them, lest they also come to this place of torment.’ Abraham said to him, ‘They have Moses and the prophets; let them hear them.’ And he said, ‘No, father Abraham; but if one goes to them from the dead, they will repent.’ But he said to him, ‘If they do not hear Moses and the prophets, neither will they be persuaded though one rise from the dead’” (<a href="https://bibleox.com/en/eng-nkjv/lk/16/#L19-31">Luke. 16:19-31</a>)</p></blockquote>

  - src: притча-о-двух-рабах-_благоразумном-и-злом
    path: Tw10s_The_Two_Servants
    title: The Two Servants
    menu: { parent: Parables, title: The Two Servants, priority: 10 }
    body: |-
      <p>“Who then is a faithful and wise servant, whom his master made ruler over his household, to give them food in due season? Blessed is that servant whom his master, when he comes, will find so doing. Assuredly, I say to you that he will make him ruler over all his goods. But if that evil servant says in his heart, ‘My master is delaying his coming,’ and begins to beat his fellow servants, and to eat and drink with the drunkards, the master of that servant will come on a day when he is not looking for him and at an hour that he is not aware of, and will cut him in two and appoint him his portion with the hypocrites. There shall be weeping and gnashing of teeth” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L45-51">Matt. 24:45-51</a>)</p>

  - src: притча-о-десяти-девах-мудрых-и-неразумных
    path: Tv10n_The_Ten_Virgins
    title: The Ten Virgins
    title_sub: The Gospel parable of the ten virgins
    menu: { parent: Parables, title: The Ten Virgins, priority: 10 }
    body: |-
      <blockquote><p>“Then the kingdom of heaven shall be likened to ten virgins who took their lamps and went out to meet the bridegroom. Now five of them were wise, and five were foolish. Those who were foolish took their lamps and took no oil with them, but the wise took oil in their vessels with their lamps. But while the bridegroom was delayed, they all slumbered and slept. And at midnight a cry was heard: ‘Behold, the bridegroom is coming; go out to meet him!’ Then all those virgins arose and trimmed their lamps. And the foolish said to the wise, ‘Give us some of your oil, for our lamps are going out.’ But the wise answered, saying, ‘No, lest there should not be enough for us and you; but go rather to those who sell, and buy for yourselves.’ And while they went to buy, the bridegroom came, and those who were ready went in with him to the wedding; and the door was shut. Afterward the other virgins came also, saying, ‘Lord, Lord, open to us!’ But he answered and said, ‘Assuredly, I say to you, I do not know you’” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L1-12">Matt. 25:1-12</a>)</p></blockquote>

  - src: притча-о-трёх-рабах-и-талантах-5-2-1
    path: Tl15t_The_Talents
    title: The Talents (5, 2 and 1)
    menu: { parent: Parables, title: "The Talents (5, 2 and 1)", priority: 15 }
    body: |-
      <blockquote>“For the kingdom of heaven is like a man traveling to a far country, who called his own servants and delivered his goods to them. And to one he gave five talents, to another two, and to another one, to each according to his own ability; and immediately he went on a journey. Then he who had received the five talents went and traded with them, and made another five talents. And likewise he who had received two gained two more also. But he who had received one went and dug in the ground, and hid his lord’s money. After a long time the lord of those servants came and settled accounts with them. So he who had received five talents came and brought five other talents, saying, ‘Lord, you delivered to me five talents; look, I have gained five more talents besides them.’ His lord said to him, ‘Well done, good and faithful servant; you were faithful over a few things, I will make you ruler over many things. Enter into the joy of your lord.’ He also who had received two talents came and said, ‘Lord, you delivered to me two talents; look, I have gained two more talents besides them.’ His lord said to him, ‘Well done, good and faithful servant; you have been faithful over a few things, I will make you ruler over many things. Enter into the joy of your lord.’ Then he who had received the one talent came and said, ‘Lord, I knew you to be a hard man, reaping where you have not sown, and gathering where you have not scattered seed. And I was afraid, and went and hid your talent in the ground. Look, there you have what is yours.’ But his lord answered and said to him, ‘You wicked and lazy servant, you knew that I reap where I have not sown, and gather where I have not scattered seed. So you ought to have deposited my money with the bankers, and at my coming I would have received back my own with interest. Therefore take the talent from him, and give it to him who has ten talents. For to everyone who has, more will be given, and he will have abundance; but from him who does not have, even what he has will be taken away. And cast the unprofitable servant into the outer darkness. There will be weeping and gnashing of teeth’” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L14-30">Matt. 25:14-30</a>)</blockquote>

  - src: притча-об-овцах-и-козлах-по-разную-сторону-от-Господа
    path: Sg20s_The_Sheep_and_the_Goats
    title: The Sheep and the Goats
    menu: { parent: Parables, title: The Sheep and the Goats, priority: 20 }
    body: |-
      <blockquote>“When the Son of Man comes in His glory, and all the holy angels with Him, then He will sit on the throne of His glory. All the nations will be gathered before Him, and He will separate them one from another, as a shepherd divides his sheep from the goats. And He will set the sheep on His right hand, but the goats on the left. Then the King will say to those on His right hand, ‘Come, you blessed of My Father, inherit the kingdom prepared for you from the foundation of the world: for I was hungry and you gave Me food; I was thirsty and you gave Me drink; I was a stranger and you took Me in; I was naked and you clothed Me; I was sick and you visited Me; I was in prison and you came to Me.’ Then the righteous will answer Him, saying, ‘Lord, when did we see You hungry and feed You, or thirsty and give You drink? When did we see You a stranger and take You in, or naked and clothe You? Or when did we see You sick, or in prison, and come to You?’ And the King will answer and say to them, ‘Assuredly, I say to you, inasmuch as you did it to one of the least of these My brethren, you did it to Me.’ Then He will also say to those on the left hand, ‘Depart from Me, you cursed, into the everlasting fire prepared for the devil and his angels: for I was hungry and you gave Me no food; I was thirsty and you gave Me no drink; I was a stranger and you did not take Me in, naked and you did not clothe Me, sick and in prison and you did not visit Me.’ Then they also will answer Him, saying, ‘Lord, when did we see You hungry or thirsty or a stranger or naked or sick or in prison, and did not minister to You?’ Then He will answer them, saying, ‘Assuredly, I say to you, inasmuch as you did not do it to one of the least of these, you did not do it to Me.’ And these will go away into everlasting punishment, but the righteous into eternal life” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-46">Matt. 25:31-46</a>)</blockquote>
