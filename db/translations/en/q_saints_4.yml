    parent: Sacraments of the Church/The sacrament of Baptism/The baptism of infants
    title: Infant baptism
    priority: 2
  body: |
    <p>In resolving the question of the baptism and salvation of unbaptized infants, it should be borne in mind that not all are saved alike and not all perish alike: <a href="https://bibleox.com/ru/ru/w/saint_%D0%9D%D0%B5%D0%BE%D0%B4%D0%B8%D0%BD%D0%B0%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D0%BC%D0%B5%D1%80%D0%B0_%D0%B2%D0%BE%D0%B7%D0%B4%D0%B0%D1%8F%D0%BD%D0%B8%D1%8F:_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D1%8F_%D0%B8_%D0%B1%D0%BB%D0%B0%D0%B6%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0" lang="ru">The Unequal Measure of Reward: Torments and Beatitudes</a></p><h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><em>And many, both men and women, </em><strong><em><mark>who have been Christ’s disciples from childhood</mark></em></strong><em>, remain pure </em><strong><em>at the age of sixty or seventy years</em></strong><em>; and I boast that I could produce such from every race of men.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-15">Apology 1</a>; the Greek οἳ ἐκ παίδων ἐμαθητεύθησαν τῷ Χριστῷ is supplied from the Russian edition and is not part of the English text)</p><p>Note: the verb “<strong>ἐμαθητεύθησαν</strong>” refers back to the Saviour’s words about Baptism:<strong> </strong>“<em>Go therefore and </em><strong><em>make disciples (μαθητεύσατε)</em></strong><em> of all the nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit</em>” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L19">Matt. 28:19</a>).</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>“Being thirty years old when He came to be baptized, and then possessing the full age of a Master, He came to Jerusalem, so that He might be properly acknowledged by all as a Master. For He did not seem one thing while He was another, as those affirm who describe Him as being man only in appearance; but what He was, that He also appeared to be. Being a Master, therefore, He also possessed the age of a Master, not despising or evading any condition of humanity, nor setting aside in Himself that law which He had appointed for the human race, but sanctifying every age, by that period corresponding to it which belonged to Himself. For <strong>He came to <mark>save</mark> <mark>all</mark></strong> through means of Himself—all, I say, <strong><mark>who</mark></strong> through Him <strong><mark>are born again to God</mark></strong>—<strong><mark>infants</mark></strong>, and children, and boys, and youths, and old men. He therefore passed through every age, becoming an infant for infants, thus sanctifying infants; a child for children, thus sanctifying those who are of this age, being at the same time made to them an example of piety, righteousness, and submission; a youth for youths, becoming an example to youths, and thus sanctifying them for the Lord. So likewise He was an old man for old men, that He might be a perfect Master for all, not merely as respects the setting forth of the truth, but also as regards age, sanctifying at the same time the aged also, and becoming an example to them likewise. Then, at last, He came on to death itself, that He might be “the first-born from the dead, that in all things He might have the pre-eminence” (Col. 1:18), the Prince of life (Acts 3:15), existing before all, and going before all.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b2#HH-The-Thirty-Aeons-are-Not-Typified-by-the-Fact-that-Christ-Was-Baptized-in-His-Thirtieth-Year-He-Did-Not-Suffer-in-the-Twelfth-Month-After-His-Baptism-But-Was-More-Than-Fifty-Years-Old-When-He-Died">Against Heresies, Book II, chapter 22.4</a>)</p><p>“<strong>Regeneration into God</strong>” is the name given to baptism (this is a stable expression among the early Christians). St Irenaeus says literally:</p><blockquote><p>And when we come to refute them, we shall show in its fitting-place, that this class of men have been instigated by Satan to a denial of <strong><mark>that baptism which is regeneration to God</mark></strong>, and thus to a renunciation of the whole [Christian] faith.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-The-Views-of-Redemption-Entertained-by-These-Heretics">Against Heresies, I.21</a>)</p><blockquote><p><strong>And again, giving to the disciples the power of <mark>regeneration into God</mark></strong>, He said to them, “Go and teach all nations, <strong><mark>baptizing</mark> them in the name of the Father, and of the Son, and of the Holy Ghost</strong>” (Matt. 28:19). For [God] promised, that in the last times He would pour Him [the Spirit] upon [His] servants and handmaids, that they might prophesy; wherefore He did also descend upon the Son of God, made the Son of man</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-The-Apostles-Teach-that-It-Was-Neither-Christ-Nor-the-Saviour-But-the-Holy-Spirit-Who-Did-Descend-Upon-Jesus-The-Reason-for-This-Descent">Against Heresies, III.17.1</a>)</p><p>This word is also used by his contemporary, St Justin the Martyr:</p><blockquote><p><em>Christ, being the first-born of every creature, became again the chief of another race </em><strong><em><mark>regenerated</mark> by Himself <mark>through water</mark> and faith</em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-138">Dialogue with Trypho</a>)</p><blockquote><p><em>Then </em><strong><em>they are brought by us where there is water, and are <mark>regenerated</mark> in the same manner in which we were ourselves regenerated. For, in the name of God, the Father and Lord of the universe, and of our Saviour Jesus Christ, and of the Holy Spirit, they then <mark>receive the washing</mark> with <mark>water</mark></em></strong><em>. For Christ also said, “Except ye be born again, ye shall not enter into the kingdom of heaven.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-61">Apology 1</a>)</p><h3>Tertullian (c. 155–220)</h3><p>Tertullian expresses the opinion that infants, virgins, and widows should not be in a hurry with baptism, since temptations lie ahead of them. Since sins are forgiven in Baptism, and it can be performed on a person only once, Tertullian proposes to get through the dangerous period of life first and then make use of Baptism. This approach gained some popularity among the people and in the 4th century was condemned by the holy fathers (see below: Gregory the Theologian, Basil the Great, John Chrysostom, Gregory of Nyssa, the author of the Apostolic Constitutions). Be that as it may, here Tertullian records a historical church fact: the Church baptizes infants, and moreover with sponsors who take upon themselves the obligation to raise the child in the faith.</p><p>It is worth noting separately that Tertullian also records the church’s faith in the remission of sins in water baptism, which Protestants deny, for whom these are only signs. It was precisely the faith in the forgiveness of sins in water baptism that prompted Tertullian to suggest making use of this forgiveness of sins as late as possible, when the period of life in which people commit grave sins has been passed. Moreover, Tertullian’s whole argument is built on the fact that Christians can sin after Baptism, which is also denied by many Protestants.</p><blockquote><p>God’s approbation sends sure premonitory tokens before it; every “petition” may both deceive and be deceived. And so, according to the circumstances and disposition, and even age, of each individual, the delay of baptism is preferable; principally, however, in the case of little children. For <strong>why is it necessary—if (baptism itself) is not so necessary—that the <mark>sponsors</mark> likewise should be thrust into danger</strong>? Who both themselves, by reason of mortality, may fail to fulfil their promises, and <strong>may be disappointed</strong> <strong>by the development</strong> of <strong>an evil disposition</strong>, in those for whom they stood? The Lord does indeed say, “Forbid them not to come unto me.” Let them “come,” then, while they are growing up; let them “come” while they are learning, while they are learning whither to come; let them become Christians when they have become able to know Christ. <strong>Why does the innocent period of life <mark>hasten</mark> to the “<mark>remission of sins</mark>?”</strong> More caution will be exercised in worldly matters: so that one who is not trusted with earthly substance is trusted with divine! Let them know how to “ask” for salvation, that you may seem (at least) to have given “to him that asketh.” <strong>For no less cause must the unwedded also be deferred</strong>—<strong>in whom the ground of temptation is prepared</strong>, <strong>alike in such as never were wedded</strong> by means of their maturity, and in the <strong>widowed</strong> by means of their freedom—<strong>until</strong> they either marry, or else <strong>be more fully strengthened for continence</strong>. If any understand the weighty import of baptism, they will fear its reception more than its delay: sound faith is secure of salvation.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-on-baptism#HH-Of-the-Persons-to-Whom-and-the-Time-When-Baptism-is-to-Be-Administered">On Baptism, chapter 18</a>)</p><h2>3rd century</h2><h3>The Council of Carthage (252) under the presidency of St Cyprian of Carthage</h3><blockquote><p>“To Fidus, on the Baptism of Infants. Cyprian, and others his colleagues who were present in council, in number sixty-six, to Fidus their brother, greeting. … <strong><mark>But in respect of the case of the infants… we all thought very differently in our council. For in this course which you thought was to be taken, no one agreed; but we all rather judge that the mercy and grace of God is not to be refused to any one born of man… and our age may have a difference in the increase of our bodies, according to the world, but not according to God; unless that very grace also which is given to the baptized is given either less or more, according to the age of the receivers, whereas the Holy Spirit is not given with measure, but by the love and mercy of the Father alike to all.</mark></strong> For God, as He does not accept the person, so does not accept the age; since He shows Himself Father to all with well-weighed equality for the attainment of heavenly grace… For which reason we think that<strong> <mark>no one is to be hindered from obtaining grace…</mark></strong><mark> </mark><strong><mark>absolutely every man is to be admitted to the grace of Christ</mark></strong>… But if anything could hinder men from obtaining grace, their more heinous sins might rather hinder those who are mature and grown up and older. But again, if even to the greatest sinners, and to those who had sinned much against God, when they subsequently believed, remission of sins is granted—and nobody is hindered from baptism and from grace—<strong><mark>how much rather ought we to shrink from hindering an infant</mark></strong>, who, being lately born, has not sinned, except in that, <strong>being born after the flesh according to Adam, he has contracted the contagion of the ancient death at its earliest birth</strong>, who approaches the more easily on this very account to the reception of the forgiveness of sins—that to him are remitted, not his own sins, but the sins of another. And therefore, dearest brother, this was our opinion in council, that <strong><mark>by us no one ought to be hindered from baptism and from the grace of God</mark></strong>, who is merciful and kind and loving to all. Which, since it is to be observed and maintained in respect of all, we think <strong>is to be even more observed in respect of infants and newly-born persons</strong>, who on this very account deserve more from our help and from the divine mercy, that immediately, on the very beginning of their birth, lamenting and weeping, they do nothing else but entreat.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Fidus-on-the-Baptism-of-Infants">To Fidus, on the Baptism of Infants</a>)</p><h3>Origen (c. 185–253)</h3><p>In this passage Origen merely records the historical church fact of the baptism of infants:</p><blockquote><p>if you wish to know what other saints think about the day of birth, listen to what David says: “In iniquity was I conceived, and in sin did my mother bear me” (Ps. 51:5), showing by this that every soul born in the flesh is defiled by the impurity of “iniquity and sin”; and therefore we may repeat the words quoted above: “Who shall be born clean from uncleanness? No one, even if his days are but one” (Job 14:4–5). To this it may be added that, since <strong><mark>the baptism of the Church is given for the remission of sins, </mark><u><mark>according to the ordinances of the Church</mark></u><mark>, infants too are baptized</mark>; and if there were nothing in them that needed to be forgiven and remitted, the grace of baptism would seem superfluous</strong>.</p></blockquote><p>(Homilies on Leviticus, VIII.3)</p><blockquote><p>Often a question arises among the brethren, and here I will turn to it again. <strong>Infants are baptized “for the remission of sins.” Of what sins? When did they sin?</strong> And what other explanation of the baptismal washing can be applied to children, besides the one we spoke of above? “Who is born clean from the unclean? Not one” (Job 14:4). <strong><mark>In the mystery of baptism the defilement of birth is washed away, and therefore infants too are baptized</mark></strong>, for “unless one is born of water and the Spirit, he cannot enter the kingdom of God” (John 3:5).</p></blockquote><p>(Homily 14. The Gospel of Luke 2:21–24. On the passage from the words “when it was time to circumcise the Child” to the place where it is said “two turtle-doves or two young pigeons.” §5)</p><h3>The author of the “Apostolic Tradition” (early 3rd century)</h3><p>This fragment of the historical monument dates from the early 3rd century:</p><blockquote><p>At the hour of the crowing of the cock, he (the bishop) shall first pray over the water. The water should be flowing from a spring or flowing down from above. Let this be done in this way, unless there is some other necessity. But if there is a constant and urgent necessity, use the water that there is. Put on your clothes and <strong><mark>first of all baptize the children</mark>. All those who can speak for themselves, let them speak. But for those <mark>who cannot speak</mark> for themselves, let their parents or someone of their relatives speak. </strong>Then baptize the men and, finally, the women</p></blockquote><p>(Apostolic Tradition, chapter 21)</p><h2>4th century</h2><h3>St Gregory the Theologian, bishop (c. 325–389)</h3><p>St Gregory reproaches those who wish to postpone baptism until the age has been passed in which people often commit grave sins (the postponement of baptism for this reason had earlier been proposed by Tertullian, see above).</p><blockquote><p>XVII. Art thou young? stand against thy passions; be numbered with the alliance in the army of God: do valiantly against Goliath. Take your thousands or your myriads; thus enjoy your manhood; but do not allow your youth to be withered, being killed by the imperfection of your faith.</p><p>Are you old and near the predestined necessity? Aid your few remaining days. Entrust the purification to your old age. <strong><u>Why do you fear youthful passion in deep old age and at your last breath?</u> Or will you wait to be washed till you are dead, and not so much the object of pity as of dislike? <u>Are you regretting the dregs of pleasure</u>, being yourself in the dregs of life? <u>It is a shameful thing to be past indeed the flower of your age, but not past your wickedness</u>, but either to be involved in it still, or at least to seem so by <u>delaying your purification.</u></strong></p><p><strong><mark>Have you an infant child? Do not let sin get any opportunity, but let him be sanctified from his childhood; from his very tenderest age let him be consecrated by the Spirit.</mark> Fearest thou the Seal on account of <u>the weakness of nature</u>? O what a small-souled mother, and of how little faith!</strong> Why, <strong><mark>Anna even before Samuel was born promised him to God, and after his birth consecrated him at once, and brought him up in the priestly habit</mark></strong>, <strong><u>not fearing anything in human nature, but trusting in God</u></strong>. You have no need of amulets or incantations, with which the Devil also comes in, stealing worship from God for himself in the minds of vainer men. <strong><mark>Give your child the Trinity, that great and noble Guard</mark></strong>.</p><p>&lt;…&gt;</p><p>And I think that the first will have to suffer punishment, as for all their sins, so for their contempt of baptism; and that the second will also have to suffer, but less, because it was not so much through wickedness as <strong><mark>through folly that they wrought their failure; and that the third will be neither glorified nor punished by the righteous Judge, as unsealed and yet not wicked, but persons who have suffered rather than done wrong.</mark></strong> For not every one who is not bad enough to be punished is good enough to be honoured; just as not every one who is not good enough to be honoured is bad enough to be punished. And I look upon it as well from another point of view. <strong>If you judge the murderously disposed man by his will alone, apart from the act of murder, then you may reckon as baptized him who desired baptism apart from the reception of baptism. But if you cannot do the one how can you do the other? I cannot see it.</strong> Or, if you like, we will put it thus:—<strong><mark>If desire in your opinion has equal power with actual baptism, then judge in the same way in regard to glory, and you may be content with longing for it, as if that were itself glory.</mark></strong> And what harm is done you by your not attaining the actual glory, as long as you have the desire for it?</p><p>&lt;…&gt;</p><p>XXVIII. Be it so, some will say, in the case of those who ask for Baptism; <strong>what have you to say about those who are still <mark>children</mark>, and conscious neither of the loss nor of the grace? Are we to baptize them too?</strong> <strong><mark>Certainly, if any danger presses. For it is better that they should be unconsciously sanctified than that they should depart unsealed and uninitiated.</mark></strong> A proof of this is found in the <strong>Circumcision</strong> on the eighth day, which was a sort of typical seal, and <strong>was conferred on children before they had the use of reason</strong>. And so is the anointing of the doorposts, which preserved the firstborn, though applied to things which had no consciousness. But in respect of others I give my advice to wait till the end of the third year, or a little more or less, when they may be able to listen and to answer something about the Sacrament; that, even though they do not perfectly understand it, yet at any rate they may know the outlines; and then to sanctify them in soul and body with the great sacrament of our consecration. For this is how the matter stands; at that time they begin to be responsible for their lives, when reason is matured, and they learn the mystery of life (for of sins of ignorance owing to their tender years they have no account to give), and it is <strong><mark>far more profitable on all accounts to be fortified by the Font, because of the sudden assaults of danger that befall us, stronger than our helpers.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-orations-4#HH-The-Oration-on-Holy-Baptism">Oration 40, On Holy Baptism</a>)</p><p>When St Gregory the Theologian was caught in a storm at sea, <u>what he feared most of all</u> was that he would die unbaptized:</p><blockquote><p><em>I was on a voyage from Alexandria to Greece over the Parthenian Sea. The voyage was quite unseasonable, undertaken in an Æginetan vessel, under the impulse of eager desire; for what specially induced me was that I had fallen in with a crew who were well known to me. After making some way on the voyage, a terrible storm came upon us, and such an one as my shipmates said they had but seldom seen before. </em><strong><em>While we were all in fear of a common death, spiritual death was what I was most afraid of; for I was in danger of departing in misery, being unbaptised</em></strong><em>, and I longed for the spiritual water among the waters of death. On this account I cried and begged and besought a slight respite.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-orations-2#HH-On-the-Death-of-His-Father">Orations, 18</a>)</p><h3>St Gregory of Nyssa, bishop (c. 331–394)</h3><p>Against Tertullian’s idea of deferring Baptism:</p><blockquote><p>“In choosing between two evils, <strong><mark>it is better, having been made worthy of saving baptism, to fall into sin again, than to end one’s life without a share in grace</mark></strong>. For <strong>sin may perhaps receive forgiveness through the love of God for man, on which the good have great hope, but salvation is utterly inaccessible to that one, according to the exact definition</strong>. For when I hear the unlying voice say: “Amen, amen I say to you, unless one is born … from above, he cannot see … the kingdom of God” (John 3:5), I can expect nothing good for those not washed by the water of baptism.</p><p>&lt;…&gt;</p><p>But I fear, <strong>you say, that our nature is inclined to sin, and therefore I delay to approach the grace of regeneration</strong>. Though the pretext of your fear is plausible, and you do well to cover yourself with the cloak of caution, yet a short question put to you will easily strip off your mask. You say that you remain a catechumen, fearing sin: tell me then, what kind of life do you live: one not subject to condemnation, a sinless life, or one in sins? If sinless, why do you fear baptism, keeping even before it the correctness of life prescribed by the law? But if your life is not pure and attentive, why do you linger in iniquities and by long practice acquire a habit of evil? It is clear that you await your last breath, so that with the reception of baptism in the final hour life may end. &lt;…&gt; They fear baptism as a prohibition of pleasures and a restraint from vile enjoyments”</p></blockquote><p>(Against Those Who Defer Baptism)</p><h3>The Apostolic Constitutions</h3><p>Tertullian’s idea of postponing the possibility of the remission of sins in Baptism to a later time is also condemned here:</p><blockquote><p>But those who try to baptize the sanctified a second time crucify the Lord again, put Him to death a second time, mock the divine, deride what is holy, insult the Holy Spirit, dishonour that holy blood as something ordinary, and act impiously against the One who sent Him, who suffered, and who testified.</p><p>But even the one who does not wish to be baptized out of contempt will be condemned as an unbeliever and will be mocked as ungrateful and senseless; for the Lord says: “unless one is baptized of water and the Spirit, he will not enter the kingdom of heaven”; and again: “whoever believes and is immersed will be saved; but whoever does not believe will be condemned.”</p><p>And <strong><mark>the one who says: “when I am dying, then I will be immersed, so as not to sin and not to defile the immersion,” does not know God</mark></strong> and has forgotten his own nature. For “do not delay, he says, to turn to the LORD, for you do not know what the coming day will bring forth.”</p><p><strong><mark>And baptize your infants</mark></strong>, and bring them up in the teaching and admonition of God; for “suffer, he says, the children to come to Me, and do not hinder them.”</p></blockquote><p>(Apostolic Constitutions, Book 6, 15)</p><h3>St Amphilochius of Iconium, bishop (c. 340–394)</h3><blockquote><p>Why do you, sons of truth, being present here in the Holy and Catholic Church, not cease to grieve? If there is some reason for this, tell me, open it to me as beloved children to a father full of love, so that you may receive consolation from it. For it is unfitting that <strong><mark>those who have been clothed from their very birth through holy Baptism into Christ</mark></strong>, our true God, should torment themselves and be torn by sorrow. Let it not be! The most blessed Paul commands us to rejoice continually, when he says: “Rejoice in the Lord: and again I say, rejoice: let your gentleness be known to all men” (Phil. 4:4–5).</p></blockquote><p>(Homily on Repentance, or That One Should Not Despair of Salvation)</p><h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p><em>5. “Blessed be God,” let us say again, “who alone does wondrous things” (Ps. 71:18), who does all things and transforms! Yesterday’s captives are now free and citizens of the Church; once clothed in the shame of sins, they now stand in boldness and righteousness. Indeed, they are not only free but holy, not only holy but righteous, not only righteous but sons, not only sons but heirs, not only heirs but brothers of Christ, not only brothers of Christ but co-heirs, not only co-heirs but members, not only members but a temple, not only a temple but instruments of the Spirit.</em></p><p><em>6. “Blessed be God, who alone does wondrous things!” Have you seen how great are the gifts of Baptism? Though many think the gift of Baptism consists only in the remission of sins, we have counted ten honors. That is why </em><strong><em><mark>we baptize infants</mark></em></strong><em>, even though they have no sins—so that they may receive sanctification, righteousness, adoption, inheritance, brotherhood, become members of Christ, and be made a dwelling place for the Holy Spirit.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-The-Baptism-of-Infants">Catechetical Homilies, 4:5–6</a>)</p><p>St John Chrysostom also condemns the idea proposed above by Tertullian of postponing baptism:</p><blockquote><p>(Russian edition heading: “The miserable condition of those who are baptized at the point of death”)</p><p>3. Wherefore, I count you blessed already before those sacred nuptials, and <strong>I do not only count you blessed, but I praise your prudence in that you have not come to your illumination as the most slothful among men, at your last breath, but already, like prudent servants</strong>, prepared with much goodwill to obey your master, have brought the neck of your soul with much meekness and readiness beneath the bands of Christ, and have received His easy yoke, and have taken His light burden. For if the grace bestowed be the same both for you and for those who are initiated at their last hour, yet the matter of the intention is not the same, nor yet the matter of the preparation for the rite. For they indeed receive it on their bed, but you in the bosom of the Church, which is the common mother of us all; they indeed with lamentation and weeping, but you rejoicing, and exceeding glad: they sighing, you giving thanks; they indeed lethargic with much fever, you filled with much spiritual pleasure; wherefore in your case all things are in harmony with the gift, but in theirs all are adverse to it. For there is wailing and much lamentation on the part of the initiated, and children stand around crying, wife tearing her cheeks, and dejected friends and tearful servants; the whole aspect of the house resembles some wintry and gloomy day.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/5niy_Instructions_to_Catechumens#HH-First-Instruction">Instructions to Catechumens, First Instruction</a>)</p><h3>St Basil the Great, bishop (329–379)</h3>
    <blockquote><p>This saying applies not to men alone. Under Christ the female sex also serves as soldiers, being enrolled in the army for its courage of soul and not rejected for its bodily weakness. And many women have distinguished themselves no less than men; there are even those who have been glorified more. Such are they who fill the choir of virgins, such are they who shine by the labours of confession and the victories of martyrdom. And the Lord Himself, at His coming, was followed not only by men but also by women. By both alike service was rendered to the Saviour.</p>
    <p>Since such and so glorious are the rewards prepared for those who serve as soldiers in Christ, <strong>let fathers desire this warfare for their sons, and mothers for their daughters. Let them bring those whom they have borne,</strong> <strong>rejoicing in the eternal hopes in which their children will share</strong>, and longing to have intercessors with Christ and good men of prayer. <strong>Let us not be faint-hearted regarding children, let us not fear if they are wearied, but let us gladden ourselves with the thought that they will be glorified. Let us dedicate to the Lord those whom He has given</strong>, so that we too may be partakers in the glorification of <strong>our children</strong>, when <strong>together with them we bring and dedicate ourselves to the Lord</strong>.</p></blockquote>
    <p>(On Asceticism) (<a href="https://bibleox.com/ru/ru/w/Lw5B_Spuria/" lang="ru">Spuria</a>)</p>
    <p>St Basil the Great also condemns the idea, proposed above by Tertullian, of postponing baptism:</p>
    <blockquote><p>Baptism is the ransom of captives, the remission of debts, the death of sin, the regeneration of the soul, the bright garment, the inviolable seal, the chariot to heaven, the preparation of the Kingdom, the gift of adoption. <strong>Is fleshly pleasure, then, O wretched man, preferable to you to so many and so great blessings?</strong></p>
    <p><strong>I understand your delay, though you cover it with words; the deeds themselves cry out, though your voice is not heard. “Leave me alone; I will use the flesh for shameful pleasures, I will wallow in the mire of delights, stain my hands with blood, take what belongs to others, live by deceit, break oaths, lie — and then I will receive baptism, when at last I cease to do evil.” Therefore, if sin is beautiful, hold to it to the end; but if it is harmful to the one who sins, why do you persist in deadly deeds?</strong> He who tries to be freed from bile does not multiply it in himself by a disorderly and intemperate life. One must cleanse the body of what troubles it, and not increase the disease beyond its strength. A ship is visible above the water as long as it carries a cargo of goods; but put more into it, and it sinks. Fear lest you suffer the like, and, having committed sins exceeding the measure of forgiveness, be shipwrecked before you enter the hoped-for harbour.</p>
    <p><strong>Does God not see what is done, does He not know your thoughts? Does He assist you in iniquities?</strong> It is said: “Thou hast thought iniquity, that I shall be like thee” (Ps. 50:21). You yourself, when you seek the friendship of a mortal man, draw him to yourself by benefits, saying and doing what you guess will please him; but when you wish to enter into communion with God and hope to be received by Him in the dignity of a son, and meanwhile do what is contrary to God and dishonour Him by transgressing the law — do you hope by that very means to attain communion with Him, whereby you rather offend Him? <strong>See that, while hoping for redemption you heap up for yourself a multitude of evils, you do not bring it about that you accumulate sins and do not receive forgiveness</strong>. “God is not mocked” (Gal. 6:7). Do not trade in grace; <strong>do not say: “The law is beautiful, but sin is more pleasant.”</strong> Pleasure is the devil’s hook, drawing one to destruction. Pleasure is the mother of sin, and sin is “the sting of death” (1 Cor. 15:56). Pleasure is the food of the eternal worm; it comforts the one who enjoys it for a time, but afterwards produces such offspring, in which there is more bitterness than in bile.</p>
    <p><strong>This delay expresses nothing else than this: “Let sin reign in me first, and afterwards the Lord will also reign at some time.” First I will present my members “as weapons of unrighteousness to sin, and then, in time, I will present them also as weapons of righteousness to God” (Rom. 6:13). So Cain also offered sacrifices; what was better he kept for his own enjoyment, and what was worse he offered to God who made and gave him. While you are capable of labours, you spend your youth in sins; but as soon as your members grow weak, then you bring them as a gift to God, when they can no longer be used for anything and must of necessity be left idle, because their strength has been lost through long exhaustion. Chastity in old age is no longer chastity, but the inability to indulge in intemperance. They do not crown a dead man; he is not righteous who is unable to do evil. While you have strength, overcome sin by reason; for behold, virtue is to turn away from evil and do good. But when vice becomes inactive from weariness, this in itself deserves neither praise nor punishment.</strong> If you cease to sin because of age, this will be by the mercy of your weakness. But we praise those who are good by their own will, and not those who are compelled by some necessity.</p>
    <p>And who has firmly appointed for you the limit of life? Who has determined the term of your old age? Who is a trustworthy guarantor to you for the future? <strong>Do you not see that death carries off children too</strong>, and sweeps away those who are coming into maturity? No single term of life has been set. Why do you wait for baptism to be for you a gift of fever, when you will no longer be able to pronounce the saving words, and perhaps will not even be able to hear them clearly; for the disease will settle in the very head; when you will have strength neither to raise your hands to heaven, nor to stand on your feet, nor to bend your knees for worship, nor to learn with profit, nor to utter the confession firmly, nor to be united with God, nor to renounce the enemy, nor even, perhaps, to follow with understanding the order of the mystagogy, so that those present will remain in doubt whether you have perceived the grace or are insensible to what is being done; and even if you receive the grace with understanding, you will have a talent, but will not bring any profit on it?</p></blockquote>
    <p>(Homily 13. An Exhortation to Receive Holy Baptism)</p>
    <h3>Blessed Jerome of Stridon, monk (c. 347–420)</h3>
    <blockquote><p>18. <strong>C.</strong> Tell me, pray, and rid me of all doubts, why little children are baptized.</p>
    <p><strong>A.</strong> That their sins may be forgiven them in baptism.</p>
    <p>C. What sin are they guilty of? How can any one be set free who is not bound?</p>
    <p>A. You ask me! The Gospel trumpet will reply, the teacher of the Gentiles, the golden vessel shining throughout the world: “Death reigned from Adam even unto Moses: even over those who did not sin after the likeness of the transgression of Adam, who is a figure of Him that was to come” (Rom. 5:14). And if you object that some are spoken of who did not sin, you must understand that they did not sin in the same way as Adam did by transgressing God’s command in Paradise. But all men are held liable either on account of their ancient forefather Adam, or on their own account. <strong><mark>He that is an infant is released in baptism from the chain which bound his father</mark></strong>. He who is old enough to have discernment is set free from the chain of his own or another’s sin by the blood of Christ. You must not think me a heretic because I take this view, for the blessed martyr Cyprian, whose rival you boast of being in the classification of Scripture proofs, in the epistle addressed to Bishop Fidus on the Baptism of Infants speaks thus: “Moreover, if even the worst offenders, and those who previous to baptism sin much against God, once they believe have the gift of remission of sins, and no one is kept from baptism and from grace, <strong>how much more ought not an infant to be kept from baptism…</strong></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/jerome-against-the-pelagians#HH-Book-III">Against the Pelagians, Book III, 18</a>. C. — Critobulus the heretic; A. — Atticus the Orthodox.)</p>
    <h3>St Isidore of Pelusium, monk (c. 350–435)</h3>
    <blockquote><p>Since your great wisdom in your letter expressed a desire to learn for what reason <strong><mark>baptism is performed over infants</mark></strong>, who have committed no sin, I considered it necessary to answer you also by letter. Some, content with an incomplete understanding of the matter, say that <strong><mark>infants are washed in baptism from the defilement communicated to human nature by Adam’s transgression</mark></strong>. But I believe that not this alone is accomplished (for this alone would still be of no great importance), but that <strong><mark>many other gifts also are bestowed at this time</mark></strong>, far exceeding our nature. For in baptism nature not only received all that was needed for the removal of sin, but was further adorned with divine gifts. <strong><mark>It is not only delivered from punishment and stripped of every wickedness, but is also born from above by the divine, mind-surpassing</mark></strong> and, as it were, by some artifice devised, <strong><mark>regeneration</mark></strong>, <strong>redeemed, sanctified, granted adoption, justified</strong>, made an heir of the Only-begotten and a fellow-body of Him through the Communion of the Holy Mysteries, became His body and was united to Him, as the body to the head. &lt;…&gt; Therefore acknowledge, friend, that baptism not only takes away sins, but also produces adoption and divine kinship, and thousands of other blessings which we have enumerated and left unmentioned, because the King of all not only redeemed the enslaved nature, but also raised it to the highest degree of honour.</p></blockquote>
    <p>(Letters, 285. To the Count Herminus. On the Grace of Holy Baptism)</p>
    <h3>Blessed Augustine of Hippo (354–430)</h3>
    <blockquote><p><em>As we both know, </em><strong><em>repentance is of three kinds</em></strong><em>. In the Church of God they are customary and known to those who wish to be attentive to everything. </em><strong><em>The first gives birth to a new man, before in baptism</em></strong><em> the final saving washing of all former sins takes place, just as in the birth of a child the pangs pass for those whose inward parts are in travail, and joy follows sorrow. Anyone who watches the movements of his will, when he approaches the sacraments of the faithful, </em><strong><em>cannot begin a new life unless he repents of the former. From this repentance in baptism only infants are free</em></strong><em>, because they have no free will. </em><strong><em><mark>For them (translator’s note: infants), for the cleansing and remission of original sin</mark>, the faith of those who bring them is profitable</em></strong><em>, so that from all the consequences of the vices of others, from whom they are born, </em><strong><em><mark>they are cleansed</mark> just as truly by the open confession of others</em></strong><em>. Truly therefore it is said in the psalm: “Behold, </em><strong><em><mark>I was conceived in iniquity, and in sin did my mother bear me</mark></em></strong><em>” (Ps. 51:5); likewise it is written in another place that </em><strong><em><mark>no one is clean before the face of God</mark></em></strong><em>, even if he had only one day of life on earth (Job 14:4).</em></p></blockquote>
    <p>(Sermons and Instructions, Homily 11, On the Profit of Repentance)</p>
    <blockquote><p><em>…to choose a virtuous life, yet not otherwise than with the help of the grace of the Mediator? If a man does not do this, he is Adam not only according to the flesh but also according to the spirit; but living rightly according to the spirit, he will cleanse from the defilement of sin even that which </em><strong><em>he received as blameworthy from Adam</em></strong><em>.</em></p>
    <p><em>But </em><strong><em>before he can live according to the spirit with advancing age, the sacrament of the Mediator is necessary for him</em></strong><em>, so that what he cannot yet do by his own faith may be accomplished by the faith of those who love him. By this </em><strong><em><mark>sacrament the penalty of original sin is already remitted in infancy; and unless a man be strengthened by this sacrament in infancy, he will not afterwards be able to restrain fleshly lust</mark></em></strong><em>; and even having subdued it, he will be able to receive the reward of eternal life only in the house of Him whom he strives to gain. Therefore </em><strong><em><mark>he must be baptized while still an infant, so that the soul may not be harmed by its fellowship with sinful flesh</mark></em></strong><em>, sharing in which the soul can understand nothing according to the spirit. This attachment also burdens the soul when it is separated from the body, unless, while living in the body, the soul is redeemed by the one sacrifice of the Priest and Mediator.</em></p></blockquote>
    <p>(On Genesis, Book 10, Chapter XV)</p>
    <blockquote><p>And to this period of the bodily life moreover pertains, what <strong><mark>the Pelagians deny, but Christ’s Church confesses, original sin</mark></strong>; and according to whether this is <strong><mark>by God’s grace loosed</mark></strong>, or by God’s judgment not loosed, <strong><mark>when infants die, they pass, on the one hand, by the merit of regeneration from evil to good, or on the other, by the merit of their origin from evil to evil</mark></strong>. The catholic faith acknowledges this, and even some heretics, without any contradiction, agree to this.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/augustine-on-the-predestination-of-the-saints#HH-That-No-One-is-Judged-According-to-What-He-Would-Have-Done-If-He-Had-Lived-Longer">On the Predestination of the Saints, Chapter 24</a>)</p>
    <blockquote><p>If on this account, then, <strong><mark>even the infants are, according to the true belief, born in sin, not actual but original, so that we confess they have need of grace for the remission of sins</mark>, certainly it must be acknowledged that in the same sense in which they are sinners they are also prevaricators of that law which was given in Paradise</strong>, according to the truth of both scriptures, “I accounted all the sinners of the earth prevaricators,” and “Where no law is, there is no prevarication.”</p>
    <p>And thus, because circumcision was the sign of regeneration, and the infant, on account of the original sin by which God’s covenant was first broken, was not undeservedly to lose his generation unless delivered by regeneration, these divine words are to be understood as if it had been said, “Whoever is not born again, that soul shall perish from his people, because he has broken my covenant, <strong>since he also has sinned in Adam with all others</strong>.” For had He said, “Because he has broken this my covenant,” He would have compelled us to understand by it only this of circumcision; but since He has not expressly said what covenant the infant has broken, we are free to understand Him as speaking of that covenant of which the breach can be ascribed to an infant. Yet if any one contends that it is said of nothing else than circumcision, that in it the infant has broken the covenant of God because he is not circumcised, he must seek some method of explanation by which it may be understood without absurdity (such as this) that he has broken the covenant, because it has been broken in him although not by him. Yet in this case also it is to be observed that <strong>the soul of the infant, being guilty of no sin of neglect against itself, would perish unjustly, unless original sin rendered it obnoxious to punishment</strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/LS0B_The_City_of_God_4#HH-Chapter-27-Of-the-Male-Who-Was-to-Lose-His-Soul-If-He-Was-Not-Circumcised-on-the-Eighth-Day-Because-He-Had-Broken-Gods-Covenant">The City of God, Book XVI, Chapter 27</a>)</p>
    <blockquote><p>However, <strong>the custom of Mother Church <mark>to baptize infants</mark></strong> must in no wise be rejected because of this, nor thought superfluous, but we must <strong><mark>regard</mark> it as nothing other than <mark>an apostolic tradition</mark></strong>. For even this tender age has the significance of a testimony, since it was the first to be deemed worthy to shed its blood for Christ.</p></blockquote>
    <p>(On Genesis, Book 10)</p>
    <h2>5th century</h2>
    <h3>Council of Carthage (393–419)</h3>
    <p>The 124th canon of the Council of Carthage, confirmed by the <a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%B8%D0%BB%D0%B0_%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85_%D0%92%D1%81%D0%B5%D0%BB%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D1%85_%D0%A1%D0%BE%D0%B1%D0%BE%D1%80%D0%BE%D0%B2#HH5-2" lang="ru">2nd canon</a> of the Sixth Ecumenical Council:</p>
    <blockquote><p>Likewise it seemed good that <strong><mark>whosoever denies that infants</mark> newly from their mother’s wombs <mark>should be baptized</mark></strong>, or <strong><mark>says that</mark></strong> baptism is for remission of sins, but that they <strong><mark>derive from Adam no original sin</mark></strong>, which needs to be removed by the laver of regeneration, from whence the conclusion follows, that in them the form of baptism for the remission of sins is to be understood as false and not true, <strong><mark>let him be anathema</mark></strong>. For no otherwise can be understood what the Apostle says, “By one man sin is come into the world, and death through sin, and so death passed upon all men in that all have sinned,” than the Catholic Church everywhere diffused has always understood it. For on account of this rule of faith (regulam fidei) <strong><mark>even infants, who could have committed as yet no sin themselves, therefore are truly baptized for the remission of sins, in order that what in them is the result of generation may be cleansed by regeneration</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-synods-of-sardica-carthage-and-constantinople-2#HH-Canon-CX">The Code of Canons of the African Church, Canon 110 (124)</a>)</p>
    <blockquote><p>Item, it seemed good that <strong>whenever there were not found reliable witnesses who could testify that without any doubt they were baptized and when the children themselves were not, on account of their tender age, <mark>able to answer concerning the giving of the sacraments to them</mark>, <mark>all such children should be baptized without scruple</mark>, lest a hesitation should deprive them of the <mark>cleansing of the sacraments</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-synods-of-sardica-carthage-and-constantinople-2#HH-Canon-LXXII">The Code of Canons of the African Church, Canon 72 (83)</a>)</p>
    <h2>7th century</h2>
    <h3>The Fifth–Sixth Ecumenical Council, Constantinople (Trullan) (691)</h3>
    <blockquote><p>Following the canonical laws of the Fathers, we decree concerning infants, as often as they are found <strong>without trusty witnesses who say that they are undoubtedly baptized; and as often as they are themselves <mark>unable on account of their age to answer satisfactorily</mark> in respect to the initiatory mystery given to them; <mark>that they ought without any offence to be baptized</mark>, lest such a doubt might deprive them of the <mark>sanctification of such a purification</mark></strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-council-in-trullo-quinisext#HH-Canon-LXXXIV">The Canons of the Council in Trullo, Canon 84</a>; the Russian edition notes that this refers to Canon 83 of the Council of Carthage (393–419))</p>
    <h2>11th century</h2>
    <h3>John Zonaras (c. 1070–1075)</h3>
    <blockquote><p>In the divine symbol of faith we are taught to confess one baptism. And since the Lord said, “Unless a man be born of water and the Spirit, he cannot enter into the kingdom of heaven” (John 3:5), the holy fathers, following the ordinances of the most ancient fathers, therefore determined that <strong>if there is any doubt concerning the baptism of certain persons, when they themselves do not know whether they have been baptized, because of their minority and the extreme imperfection of their age (for the word means age), and no one is found who knows and can testify that they have been baptized, they should be baptized</strong> without any doubt, that is, without the obstacle arising from the uncertainty whether they have been baptized. And we determine this, they say, for the purpose that, because of misunderstanding and doubt as to whether they have been baptized or not, they may not be deprived of so great a cleansing by this sanctity, and may not remain, according to the Lord’s saying, outside the kingdom of God.</p></blockquote>
    <p>(Interpretation of the Canons, Canon 84 of the Sixth Ecumenical Council)</p>
    <h2>12th century</h2>
    <h3>Theodore Balsamon, patriarch of Antioch (c. 1140–1199)</h3>
    <blockquote><p>The fathers assembled at Carthage, whom the present canon mentions, confessing one baptism according to the mind of the holy symbol, determined in the 72nd (83rd) canon that <strong>those who are said to have been baptized in infancy, and perhaps were not, should be baptized if there are no trustworthy witnesses attesting that they have been baptized</strong>. Following them, therefore, the fathers in the present canon decreed the same as the fathers assembled at Carthage also enjoined, that is, to baptize those about whom there is doubt whether they have been baptized, if neither they themselves can attest that they have been baptized, through ignorance of what happened to them in infancy (for it means imperfect age), nor are there any witnesses attesting to their baptism; for it must be feared <strong>lest, because of such a misunderstanding, children should somehow be deprived of divine baptism and of the kingdom of heaven given through baptism</strong>, according to the voice of the Lord who says, “Unless a man be born of water and the Spirit, he cannot enter into the kingdom of heaven” (John 3:5). And this was enacted because some did not permit such persons to be baptized on account of doubt, lest they should turn out to be re-baptizing those already baptized. About this there was frequent debate in the Synod. For a doubt arose whether it was right to baptize purchased children who had been taken captive from a Christian country by the Scythians and Hagarenes and afterwards sold to the Greeks. Some said that they, as taken captive from a Christian country, <strong>may have been baptized in infancy on the spot, and therefore should not again be baptized</strong>. But the more prevalent opinion was that they ought to be baptized, because they themselves do not know whether they were baptized in infancy, and there is no one to confirm their baptism. And concerning those taken captive from a country of the unbelievers, <strong>it is decreed: to baptize such without delay, unless witnesses show that they were baptized after being taken captive</strong>. — In the days of the most holy patriarch Kyr-Luke, Hagarenes appeared in the synod, and when they were required to accept baptism, they said that they had already been baptized in their own countries; and when they were asked how this could have happened, they replied that there is a custom among the Orthodox priests of baptizing all the children of the Hagarenes. But this was not taken into consideration, for they ought to hear that the baptism which the unbelievers seek from Christians is sought not with good disposition and not with Orthodox intention, but for bodily healing. For the Hagarenes have a belief that their children are subject to demonic possession and have a smell peculiar to dogs if they do not receive Christian baptism; and therefore they seek baptism not as a means of cleansing from all spiritual defilement and bestowing divine light and sanctification, but as a medicine or incantation. Some of them said that they had Orthodox mothers and that through their zeal they had been baptized among the Orthodox; but this too was not taken into account, because they produced no witnesses who would testify to it, and they were rather even condemned as giving a bad opinion against themselves by approaching the faith improperly. Wherefore it was permitted to baptize all such.</p></blockquote>
    <p>(Interpretation of the Canons, Canon 84 of the Sixth Ecumenical Council)</p>
    <h3>Alexios Aristenos († c. 1166)</h3>
    <blockquote><p>Those who do not know and have no testimony that they have been baptized must be baptized. All those who do not know <strong>whether they were baptized in their infancy</strong>, and of whom no reliable witnesses are found affirming that they were undoubtedly baptized, must be baptized without any doubt.</p></blockquote>
    <p>(Interpretation, Canon 84 of the Sixth Ecumenical Council)</p>
    <blockquote><p>Those concerning whom it is doubted whether they have been baptized or not, it has been decided to baptize, so that by doubt they may not be deprived of divine cleansing. Various canons forbid baptizing anyone a second time, unless he was baptized by the impious; but if there is doubt about anyone, <strong>whether he has been baptized, since neither he himself knows this because of his infancy</strong>, nor do others affirm and testify that he has undoubtedly been baptized, then he must without any doubt be baptized, lest because of doubt he be deprived of divine cleansing.</p></blockquote>
    <p>(Interpretation, Canon 83 of Carthage)</p>
    <h2>14th century</h2>
    <h3>St Gregory Palamas, archbishop of Thessalonica (c. 1296–1357)</h3>
    <blockquote><p>At divine baptism an account is required of us: because it is a solemn promise on our part to have a good conscience before God, and a covenant and obligation to lead a life pleasing to God and to have a manner of life acceptable to God. Because, having believed, we are united to the good and supremely good Christ, renouncing the wicked and utterly wicked enemy, and we promise to keep with all our strength the beneficent commandments of God, while refraining from every evil intention and deed; and so, being questioned, we <strong>answer either directly ourselves or through our sponsors, as happens <mark>at the baptism of infants</mark></strong>, that what we have believed, this very thing we have lovingly received into our soul, and have mentally made a vow (translator’s note: or “concluded a covenant”). And since, according to the Apostle, “With the heart man believeth unto righteousness, and with the mouth confession is made unto salvation” (Rom. 10:10), having made the good confession with our lips, we <strong><mark>receive salvation in the Bath of Regeneration</mark></strong>.</p>
    <p>2. Since also <strong><mark>this divine font and all that is connected with it, the majority receive in infancy</mark></strong>, and do not realize the meaning of the Mystery being performed, come, now, since the approaching Feast also requires it, let us briefly open to the hearing of us all: in what this meaning consists.</p>
    <p>&lt;…&gt;</p>
    <p>Because together with Himself He implanted in the water the grace of the Most Holy Spirit, which He drew from above, so that for those who are afterwards baptized into Him, being immersed <strong><mark>in the water, He Himself and His Spirit might be present in it, communicating Himself to them ineffably and being appropriated by them, and filling rational beings with cleansing and enlightening grace</mark></strong></p></blockquote>
    <p>(Homilies. A Homily on What Is Performed in the Order of the Mystery of Baptism)</p>
    <h2>16th century</h2>
    <h3>Jeremiah, patriarch of Constantinople (1536–1595)</h3>
    <blockquote><p>Concerning your second chapter, which contains the teaching that <strong><mark>every man is liable to the ancestral sin</mark></strong>, we also affirm that this is truly so. For the psalmist says: “Behold, I was conceived in iniquities, and in sins did my mother bear me” (Ps. 51:5); and the Lord in the Gospel: “Unless a man be born of water and the Spirit,” that is, <strong><mark>for cleansing from this ancestral sin</mark></strong>, “he cannot enter into the kingdom of God” (John 3:5).</p>
    <p>Moreover, as regards regeneration through divine baptism, of which it is said in the confession of the Symbol: “I confess one <strong><mark>baptism for the remission of sins</mark></strong>”</p>
    <p>&lt;…&gt;</p>
    <p>The ninth chapter says that <strong><mark>infants should be baptized</mark>, and that we should not wait for the time of their full age</strong>. This we also do, lest, because of the delay, something should happen — yet in the manner shown in the analogy of the second chapter. <strong>For “unless a man be born of water and the Spirit, he cannot enter into the kingdom of God” (John 3:5)</strong>. Afterwards we give them, as has been said, divine Communion: for, according to the great Basil, the regenerate has need also of spiritual food. And the Lord said: “Unless ye eat the flesh of the Son of man and drink His blood” (John 6:53), ye shall not enter into the kingdom of God. Therefore <strong><mark>both are necessary: baptism and Communion</mark></strong>.</p></blockquote>
    <p>(Answers to the Lutherans)</p>
    <h2>18th century</h2>
    <h3>Epistle of the Patriarchs of the Orthodox Church (1723)</h3>
    <blockquote><p><strong>We believe Holy Baptism, which was instituted by the Lord, and is conferred in the name of the Holy Trinity, to be of the highest necessity. For <mark>without it none is able to be saved</mark></strong>, as the Lord saith, “Whosoever is not born of water and of the Spirit, shall in no wise enter into the Kingdom of the Heavens” (John 3:5). And, therefore, <strong><mark>it is necessary even for infants</mark></strong>, since they also <strong><mark>are subject to original sin, and without Baptism are not able to obtain its remission</mark></strong>. Which the Lord showed when he said, not of some only, but simply and absolutely, “Whosoever is not born [again]”, which is the same as saying, “All that after the coming of Christ the Saviour would enter into the Kingdom of the Heavens must be regenerated.” And <strong><mark>forasmuch as infants are men, and as such need salvation; needing salvation, they need also Baptism</mark></strong>.</p>
    <p>And those that are not regenerated, since they have not received the remission of hereditary sin, are, of necessity, subject to eternal punishment, and consequently <strong><mark>cannot without Baptism be saved</mark></strong>; so that <strong><mark>even infants ought, of necessity, to be baptised</mark></strong>. Moreover, infants are saved, as is said in Matthew (Matt. 19:12); but <strong><mark>he that is not baptised is not saved</mark></strong>. And consequently even infants must of necessity be baptised.</p>
    <p>&lt;…&gt;</p>
    <p>Hence it is evident that <strong>all who are baptised and fall asleep while babes are undoubtedly saved</strong>, being predestinated through the death of Christ. Forasmuch as they are without any sin — without that common [to all], because delivered therefrom by the Divine laver, and without any of their own, because as babes they are incapable of committing sin — and consequently are saved.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">Epistle of the Patriarchs of the Orthodox Church (1723), Decree 16</a>. The English edition cites Matt. 19:12; the passage about children is Matt. 19:14.)</p>
    <h2>19th century</h2>
    <h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3>
    <blockquote><p>The Holy Church sends <strong>departed infants</strong> from this world into the eternal world not with mournful songs but with songs of joy. She <strong>acknowledges their blessedness to be certain</strong>: her prayers at the burial of infants do not speak of the unknown lot of man after death, as they speak of it tenderly and mournfully at the burial of adults. These prayers both ask of God repose for the departed infant (because no human purity in itself can be worthy of heavenly blessedness: it is a gift of God), and acknowledge that this repose has been given — <strong>the departed infant is already called blessed</strong>. <strong><mark>Infants</mark> in their brief stay on earth avoid all that deprives of blessed eternity, <mark>and succeed in fulfilling all that procures blessed eternity: they are washed from the ancestral sin and united to Christ by baptism</mark>, are joined to Him in one through communion of His Body and Blood and of the Divinity united with them</strong>. Not having had time to defile either the sacred washing or the most blessed union with God, they depart from this vain world and go naturally to where they belong.</p></blockquote>
    <p>(Letters. Death)</p>
    <blockquote><p><strong>By the Redemption human nature was renewed</strong>. The God-man renewed it by Himself and in Himself. Such human nature, renewed by the Lord, is grafted, so to speak, onto fallen nature by means of baptism. Baptism, without destroying nature, destroys its state of fall; without making nature other, it changes its state, having united human nature to the divine nature (2 Pet. 1:4).</p>
    <p>Baptism is at once both mortification and quickening — at once both burial and birth. <strong>Into the font of baptism the sinful corruption of fallen nature is plunged, buried in it, and dies, and from the font rises nature renewed; into the font the son of the old Adam is plunged — from the font comes forth the son of the new Adam</strong>. This is attested by the Lord, who said: “Unless a man be born of water and the Spirit, he cannot enter into the kingdom of God. That which is born of the flesh is flesh, and that which is born of the Spirit is spirit” (John 3:5–6). From these words it is evident that <strong>the Holy Spirit, having received into the font of baptism the carnal man, such as man became after the fall, brings out of the font the same man, but now spiritual, having put to death in him the sinful carnal state and having given birth to the spiritual. <mark>In baptism man is forgiven the original sin inherited from the forefathers, and his own sins committed before baptism</mark>. In baptism man is granted spiritual freedom: he is no longer constrained by sin</strong>, but by his own will he can choose good or evil. <strong><mark>In baptism Satan, who dwells in every man of fallen nature, is cast out of man</mark></strong>; and it is left to the will of the baptized man either to remain a temple of God and be free from Satan, or to remove God from himself and again become a dwelling of Satan (Matt. 12:43–45).</p>
    <p>&lt;…&gt;</p>
    <p>Careful preparation is necessary before receiving holy baptism. In careful preparation lies the indispensable condition for the great mystery to bring abundantly its fruit, for it to serve unto salvation and not unto greater condemnation. <strong><mark>This is said</mark></strong> for the explanation of the mystery, and especially <strong><mark>for those who approach it not in infancy</mark>, in which, under the circumstances of the present time, almost all of us receive baptism</strong>. Preparation for holy baptism is true repentance. True repentance is an indispensable condition for holy baptism to be received in a worthy manner, unto the salvation of the soul. Such repentance consists in recognizing one’s sins as sins, in sorrowing for them, in confessing them, in forsaking a sinful life. In other words: repentance is the consciousness of the fall, the consciousness of the need for a Redeemer; repentance is the condemnation of one’s fallen nature and the renunciation of it for the sake of renewed nature. It is necessary that our vessel — by vessel I mean the mind, heart, and body of man in relation to divine grace — be cleansed for the reception and preservation of the Spiritual Gift bestowed by holy baptism. It is necessary that this vessel be not only cleansed but also carefully inspected; it is necessary that the damages in it, especially the leaks, be carefully repaired; but if they remain unrepaired, then the living water (John 7:38), poured into the vessel by holy baptism, will not be retained in the vessel: it will flow out of it, to its greatest misfortune. By leaks I mean sinful habits. It is necessary that our Jerusalem be surrounded on all sides, as with walls, by good morals and customs: only then can our fallen nature be offered in sacrifice and burnt offering in the font of baptism, and the renewed nature, supplied by baptism, become an altar fit for offering sacrifices and burnt offerings well-pleasing to God (Ps. 51:18–19). Without such preparation, what profit can there be from baptism? What profit can there be from baptism, when we receive it in adulthood and do not understand its meaning in the least? What profit can there be from <strong>baptism, when we receive it in infancy and afterwards remain in complete ignorance of what we have received (translator’s note: that is, no one instructs a person as he grows up)?</strong> Meanwhile we have received an invaluable Gift, we have taken upon ourselves a terrible obligation; the responsibility for this obligation is as immeasurable and infinite as the Gift is immeasurable and infinite.</p>
    <p>&lt;…&gt;</p>
    <p>Having freedom of choice, the baptized person is invited by the Holy Spirit to maintain union with the Redeemer, to maintain in himself the renewed nature, to maintain the spiritual state granted by baptism, to refrain from gratifying the desires of the flesh, that is, from turning aside after the attractions of the carnal, the natural way of thinking. The Apostle’s words have the same meaning: <strong>“The first man is of the earth, earthy: the second man is the Lord from heaven. As is the earthy, such are they also that are earthy: and as is the heavenly, such are they also that are heavenly: and as we have borne the image of the earthy” — for <mark>we are all born in original sin and with all the infirmities that have become natural to us in consequence of the fall</mark>, which were revealed in Adam after his fall — <mark>“let us also bear the image of the heavenly” through baptism</mark>, which gives us this image</strong>, and through the careful keeping of the Gospel commandments, which preserve this image whole.</p></blockquote>
    <p>(Ascetical Experiments, Volume 2, A Word on the Various States of Human Nature in Relation to Good and Evil)</p>
    <h3>Nicodemus Milash, hieroconfessor (1845–1915)</h3>
    <blockquote><p>Canon 72 (83) of Carthage</p>
    <p>“<strong>Concerning infants</strong>, when no reliable witnesses are found who affirm that they have undoubtedly been baptized, and they themselves, by reason of their age, cannot satisfactorily answer concerning the mystery given to them, it has been decided that they ought without any doubt to be baptized, lest such doubt deprive them of cleansing by this sanctity. Our brethren the legates of Mauritania advised this, because many such are bought from the barbarians”</p>
    <p>As is evident from the canon, <strong>the baptism of newborn children was considered at that time (401) a general law of the African Church, and therefore the canon prescribes baptizing every child concerning whom it is unknown whether he was previously baptized or not</strong>, of course in the case when the child himself by his age is not able to report whether baptism was received by him, and there is no person who can testify to it; the Carthaginian fathers motivate such a decree by the fact that <strong><mark>it is impossible, because of uncertainty, to deprive a child of cleansing by such a sanctity as the mystery of baptism</mark></strong>. The occasion for issuing this canon was that many Christians bought slaves from non-Christian peoples, among whom not infrequently there were also children, and in order that the latter might have the opportunity to become true members of the church, it was necessary to make the aforementioned decree. At the present time this decree has significance mainly for foundlings.</p></blockquote>
    <p>(Interpretation, Canon 72 (83) of Carthage; the Russian edition titles it 73)</p>
    <h2>20th century</h2>
    <h3>St Nicholas of Serbia (Velimirović), bishop (1880–1956)</h3>
    <blockquote><p><strong>When infants are baptized, who pronounces in their name the words of renunciation of Satan, repentance, and true faith?</strong></p>
    <p>— <mark>For an infant these words are pronounced by the godfather</mark> (kum), or the godmother (kuma), who give surety for him.</p>
    <p><strong>What are the duties of a godfather (godmother)?</strong></p>
    <p>— The godfather must teach or help to teach his godchild Christian truths and bring him up in the true faith.</p>
    <p><strong>What honour is shown to the godfather?</strong></p>
    <p>— Orthodox Christians greatly honour godparents, considering them spiritual sponsors.</p>
    <p><strong>Why is it necessary to baptize infants?</strong></p>
    <p>— First, for fear that <mark>a child, if he dies unbaptized, will be excluded from the Christian family and therefore will appear among the godless at the Last Judgment</mark>. Second, because the apostles baptized children. Third, the Lord Jesus Christ Himself loved children very much and demanded: <em>“Suffer the little children to come unto </em>Me” (Mark 10:14).</p>
    <p><strong>How should one regard parents who, through their irresponsibility, allow an infant to die <mark>unbaptized?</mark></strong></p>
    <p><mark>— As murderers of their own children.</mark></p></blockquote>
    <p>(The Faith of the Saints. Catechism of the Eastern Orthodox Church)</p>
    <h2>Synaxarion</h2>
    <blockquote><p>“It should also be known that baptized infants enjoy delight after death, while <strong>children not enlightened by baptism, and the children of pagans, will attain neither delight nor gehenna</strong>”</p></blockquote>
    <p>(Synaxarion)</p>
    <h2>Concerning the Baptism in Later Life of Certain Well-Known Fathers of the Orthodox Church of the 4th–5th Centuries</h2>
    <blockquote><p>The practice of infant baptism is mentioned in early Christian sources. Nevertheless, even in the 4th century there was debate about the age at which baptism should be received. There were several traditions — baptism in childhood, baptism upon entering mature age (about thirty years), and baptism before death. <strong>St <mark>Gregory the Theologian</mark></strong>, being the son of a bishop, was baptized only after completing his studies, at the age of thirty. However, with time he inclined more and more to the view that one should be baptized in infancy: <strong>“Have you an infant? Let not evil take advantage of this, let him be sanctified from infancy, let him be dedicated to God from his tender years”</strong>. In principle the saint does not object to baptism being conscious, but the danger of sudden death remains for him an irrefutable argument in favour of baptism in infancy. He considers the age of three, when a child can already meaningfully perceive what is happening, to be optimal for receiving baptism. Answering the question whether infants who feel neither harm nor grace should be baptized, he writes:</p>
    <p><strong>Certainly, if there is any danger. For <mark>it is better to be sanctified unconsciously than to depart unsealed and imperfect</mark>… As for the others, I express this opinion: after waiting until the age of three, or a little earlier, or a little later, when one can already hear something of the mysteries and answer, though not fully understanding, yet being sealed — one should sanctify souls and bodies with the great mystery of dedication. For the matter stands thus: although children begin to bear responsibility for their life only when reason matures in them and when they understand the meaning of the mystery… nevertheless to be protected by the font is in every respect far more profitable for them, because of the dangers that may suddenly befall them and cannot be prevented.</strong></p>
    <p>Concerning those who died unbaptized not by their own will, for example infants, or those who did not receive the mystery “through ignorance,” St Gregory writes that they “will neither be glorified by the righteous Judge, nor condemned to torments as unsealed, but are also innocent and rather themselves have suffered harm than caused it.” This, however, does not apply to those who consciously postpone baptism and die unbaptized through their own fault.</p>
    <p>On the question of the final lot of unbaptized infants there is no unequivocal answer in the Orthodox tradition. The Synaxarion of Meatfare Saturday says that “baptized infants will enjoy the sweetness (of paradise), while the unenlightened and pagan ones will neither enjoy sweetness nor go into the fire of gehenna.”</p></blockquote>
    <p>(Conclusion of the Synodal Biblical and Theological Commission on the results of the examination of the appeal of believers concerning the disputed theological views of Professor A. I. Osipov)</p>
    <h2>Additional Information</h2>
    <h3>Dionysius the Areopagite († c. 96)</h3>
    <p><strong><em>Translator’s note: Some researchers, including from within the Orthodox Church, believe that these works (the Areopagitic writings, the Corpus Areopagiticum) do not belong to the first century and to Dionysius the Areopagite, but to some later unknown author. However, there are prominent Orthodox authors who offer arguments in defence of the authenticity of these works</em></strong></p>
    <p>Infants are admitted to baptism through their godparents. Infants are also admitted to the Eucharist, to which only the baptized are admitted:</p>
    <blockquote><p>“11. Finally, in the fact that <strong><mark>children who are not yet able to understand divine things are made partakers of the sacred birth from God (translator’s note: baptism) and of the most holy mysteries of the divine communion (translator’s note: the Eucharist)</mark></strong>, those who are strangers to sanctification find, as you say, a thing worthy of just laughter, when <strong>the hierarchs teach divine things to those who cannot yet hear</strong>, and vainly impart the sacred traditions to those <strong>who as yet understand nothing</strong> and, what is supposedly even more ridiculous, when <strong><mark>others pronounce the renunciations and sacred vows in place of the children</mark></strong>. Your hierarchic understanding ought not to be indignant at the erring, but prudently and with love, for their instruction, to give an answer to the objections they bring, setting before them in defence of the sacred institution also the fact that <strong>our knowledge does not embrace all that is divine </strong>(<em>translator’s note: our mind does not comprehend the whole depth of the divine</em>), that much that is incomprehensible to us has its God-befitting grounds, perhaps unknown to us, but known to the ranks higher than we, and much is hidden even from the highest beings and is fully known only to the one wise and wisdom-giving Principle of all. However, we shall now say concerning this subject also what was handed down to us, having been learned from ancient tradition, by our God-like sacred celebrants. They said that it is also <strong>just that infants, being brought to the mysteries according to the sacred ordinance, should be introduced into the sacred order of life, becoming free from all impiety and withdrawing from a life alien to holiness</strong>. Taking this into consideration, <strong><mark>our divine teachers laid down that infants should be received according to the sacred order in such a way that the natural parents of the child brought forward should hand him over to some good guide among those initiated into the mysteries of divine teaching (translator’s note: a godparent)</mark></strong>, by whom the child would afterwards be guided as by a God-given father and a sponsor of sacred salvation. When <strong>this one gives a vow to guide the infant in holy life</strong>, the hierarch orders the renunciations and sacred vows to be pronounced not at all <strong>as though he were initiating someone else in place of the child into the Divine Mysteries</strong>, as those censurers say. The sponsor does not say: “In place of the child I make the renunciations or the sacred vows,” <strong>but says that the child renounces and is united, that is, as if to say: “I promise to instil into this infant, when he comes to reason and is able to understand what is sacred, that he should renounce wholly all that is of the enemy and confess and fulfil in deed the divine vows”</strong>. It seems to me that there is nothing terrible in the child being guided in divine upbringing, having a guide and sacred sponsor who implants the habit of the divine and keeps him untouched by all that is of the enemy. <strong><mark>The hierarch also gives the child communion of the sacred mysteries</mark></strong>, so that he may be nourished by them and know no other life than that which is always directed toward the divine, and may be reared in holiness as a partaker of the mysteries, established in sacred habits, and in a manner befitting the sacred be brought to perfection under the influence of the God-like sponsor”</p></blockquote>
    <p>(On the Ecclesiastical Hierarchy)</p>
