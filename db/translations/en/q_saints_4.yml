    c. 96)</h3><p>Infants are admitted to Baptism through their sponsors. Infants
    are also admitted to the Eucharist, to which only the baptized are admitted:</p><blockquote><p>“11.
    Finally, in that children who are not yet able to understand divine things are
    made partakers of the sacred birth from God (Baptism — note) and of the most holy
    mysteries of the divine communion (the Eucharist — note), those who are strangers
    to sanctification find this, as you say, a thing worthy of just laughter, when
    the hierarchs teach divine things to those who cannot yet hear, <em>and vainly
    deliver the sacred traditions to those </em><strong><em>who as yet understand
    nothing</em></strong><em>, and, what is supposedly even more ridiculous, when
    </em><strong><em><mark>others pronounce the renunciations and sacred vows on behalf
    of the children</mark></em></strong><em>. Your hierarchic understanding ought
    not to be indignant at the erring, but prudently and lovingly, for their correction,
    to give an answer to the objections they bring, setting before them in defence
    of the sacred </em>institution also this, that our knowledge does not embrace
    all that is divine (our mind does not comprehend the whole depth of the divine
    — note), that much that is incomprehensible to us has its God-befitting grounds,
    unknown perhaps to us, but known to the degrees higher than we, and much is hidden
    even from the highest beings and is fully known only to the one wise and wisdom-giving
    Godhead. However, we shall now say about this subject also what our God-formed
    sacred celebrants handed down to us, having learned it from ancient tradition.
    They said that it is also just that infants, being led to the mysteries according
    to the sacred ordinance, should be introduced into the sacred order of life, becoming
    free from all impiety and withdrawing from a life alien to holiness.<em> Having
    taken this into consideration, </em><strong><em><mark>our divine teachers established
    that infants should be received according to the sacred order in such a way that
    the natural parents of the child brought forward hand him over to one of those
    initiated into the mysteries of the divine teaching, a good guide (a sponsor —
    note)</mark></em></strong><em>, by whom the child would afterwards be guided,
    as by a God-given father and a co-guarantor of sacred salvation. When </em><strong><em><mark>he
    gives the promise to guide the infant in a holy life</mark></em></strong><em>,
    the hierarch orders the renunciations and sacred vows to be pronounced by no means
    </em><strong><em><mark>as though he were initiating one person into the Divine
    Mysteries in place of another</mark></em></strong><em>, as those censurers say.
    The sponsor does not say: “In place of the child I make the renunciations or the
    sacred vows,” </em><strong><em><mark>but says that the child renounces and is
    united, that is, as it were: “I give the promise to instill into this infant,
    when he comes to reason and is able to understand what is sacred, that he should
    renounce wholly all that is of the enemy and confess and fulfil in deed the divine
    vows”</mark></em></strong><em>. It seems to me that there is nothing terrible
    in the child being guided in divine upbringing, having a guide and sacred sponsor
    who implants the habit of the divine and keeps him untouched by all that is of
    the enemy. </em>The hierarch also gives the child communion of the sacred mysteries<em>,
    so that he may be nourished by them and know no other life than that which is
    always directed to the divine, and he raises the partaker of the mysteries in
    holiness, confirms him in sacred habits, and in a manner befitting the sacred
    elevates him to perfection under the influence of the God-like sponsor.”</em></p></blockquote><p>(On
    the Ecclesiastical Hierarchy)</p><h2>5th century</h2><h3>Blessed Augustine of
    Hippo (354–430)</h3><blockquote><p><strong><em><mark>For them (infants — note)
    the faith of those by whom they are brought is profitable for the cleansing and
    remission of original sin</mark></em></strong><em>, so that from all the consequences
    of the vices of others, from whom they are born, </em><strong><em><mark>they are
    cleansed just as truly by the open confession of others</mark></em></strong><em>.
    Truly, therefore, it is said in the psalm: “Behold</em>, I was brought forth in
    iniquity, and in sin my mother conceived me” (Ps. 51:5); and likewise it is written
    in another place that no one is clean before the face of God, <em>even if he had
    only one day of life on earth (Job 14:4).</em></p></blockquote><p>(Sermon 11,
    On the Profit of Repentance)</p>"
