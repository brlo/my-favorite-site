- src: HwkJel3D_Послушание_государственным_властям
  path: Obedience-to-the-secular-authorities
  title: Obedience to the secular authorities
  menu:
    parent: Awaiting distribution
    title: Obedience to the secular authorities
    priority: 20
  body: '<h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><strong>And
    everywhere we, more readily than all men, endeavour to pay to those appointed
    by you the taxes both ordinary and extraordinary, as we have been taught by Him</strong>;
    for at that time some came to Him and asked Him, if one ought to pay tribute to
    Caesar; and He answered, “Tell Me, whose image does the coin bear?” And they said,
    “Caesar’s.” And again He answered them, “Render therefore to Caesar the things
    that are Caesar’s, and to God the things that are God’s.” <strong>Whence <mark>to
    God alone we render worship, but in other things we gladly serve you, acknowledging
    you as kings and rulers of men</mark>, and praying that with your kingly power
    you be found to possess also sound judgment</strong>. But if you pay no regard
    to our prayers and frank explanations, we shall suffer no loss, since we believe
    (or rather, indeed, are persuaded) that every man will suffer punishment in eternal
    fire according to the merit of his deed, and will render account according to
    the power he has received from God, as Christ intimated when He said, “To whom
    God has given more, of him shall more be required.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-17">Apology
    1</a>)</p><h3>Apollonius of Rome, martyr († c. 183)</h3><blockquote><p>Therefore,
    in accordance with the teaching of God, we pray to Him who dwells in heaven and
    is the one true God, that (those in authority) may rule rightly on this earth,
    because <strong><mark>we know without doubt that he (that is, Commodus) has been
    made emperor by no one else but by that one King — God, who holds all things in
    His hand</mark></strong>.</p></blockquote><p>(Apology)</p>

    '
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
