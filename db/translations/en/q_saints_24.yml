- src: saint_Неодинаковая_мера_воздаяния:_мучения_и_блаженства
  path: A-different-measure-of-recompense-torments-and-bliss
  title: 'A different measure of recompense: torments and bliss'
  menu:
    parent: Retribution of the righteous and the wicked
    title: 'A different measure of recompense: torments and bliss'
    priority: 50
  body: '<h2>Unequal torment in hell</h2><h2>4th century</h2><h3>Ephrem the Syrian,
    monk (c. 306–373)</h3><blockquote><p>Do all then go into one torment, or are the
    torments different? — <strong><mark>There are different kinds of torments</mark></strong>,
    as we have heard in the Gospel. There is “outer darkness” (Matt. 8:12), and from
    this it is evident that there is another darkness — the deepest; “the fiery hell”
    (Matt. 5:22) is a different place of torment; “the gnashing of teeth” (Matt. 13:42)
    is also a special place; the worm that sleeps not (Mark 9:48) is in another place;
    “the lake of fire” (Rev. 19:20) is again a different place; Tartarus also has
    its own place; “the unquenchable fire” (Mark 9:43) is a special country; “the
    abyss” (Phil. 2:10) and “destruction” (Matt. 7:13) are each in their own place;
    “the lowest parts of the earth” (Eph. 4:9) is yet another place; hell, where sinners
    abide, and the depth of hell is the most tormenting place of all. <strong><mark>To
    these torments the wretched will be assigned, each according to the measure of
    his sins, either more grievous or more bearable</mark></strong>, according to
    what is written: “with the toils of his own sins each is held as it were” (Prov.
    5:22). The same is meant by what is said: “shall be beaten with many stripes …
    and shall be beaten with few stripes” (Luke 12:47–48). <strong><mark>As there
    are differences of punishments here, so also in the age to come</mark></strong>.
    Those who live in enmity one with another, if it should happen that they depart
    from the body in such a state, at the hour of Judgment will find for themselves
    merciless condemnation and, as hated ones, will be sent into the outer fire and
    unending darkness, because they neglected the light commandment of the Lord, which
    says: “love one another” (John 15:17), — “and forgive, unto seventy times seven”
    (Matt. 18:22).</p></blockquote><p>(Homily on the Second Coming of Our Lord Jesus
    Christ)</p><blockquote><p>Christ-lovers: “<strong>Tell</strong> us also <strong>about
    the difference of torments</strong>”.</p><p>The teacher says: “<strong>The adulterer
    is tormented in one way, the fornicator in another, the murderer in another, the
    thief in another, and the drunkard in another</strong>. Those who have defiled
    themselves with heresies shall hear: ‘let the ungodly be taken away, that he not
    see the glory of the Lord’ (Isa. 26:10). Those who have enmity one against another,
    and it so happens that they depart from this life, will find for themselves merciless
    condemnation and, as hated ones, will be sent into outer darkness, — for they
    hated Christ, who said: ‘love one another, and forgive one another’”.</p></blockquote><p>(Homily
    on the General Resurrection, on Repentance and Love, and on the Second Coming
    of Our Lord Jesus Christ)</p><h3>St Basil the Great, archbishop of Caesarea (c.
    329–379)</h3><blockquote><p>But if we do not allow ourselves to think this of
    life, then on what ground should we set an end to eternal torment, when the epithet
    “eternal” is applied equally to both? “These,” it is said, “will go away into
    everlasting punishment, but the righteous into eternal life” (Matt. 25:46). And
    having agreed on this, one must know that <strong>the expressions “shall be beaten
    with many stripes” and “shall be beaten with few stripes” (Luke 12:47–48) signify
    not an end, but <mark>a difference of torment</mark></strong>. For if God is a
    righteous Judge, rendering not only to the good but also to the wicked <strong><mark>to
    each according to his works, then one may be worthy of the unquenchable fire,
    but either a weaker one or one that burns more fiercely; another of the worm that
    dies not, but again causing pain either more light or more cruel, according to
    the worth of each; and one of hell, in which there are, without doubt, different
    kinds of torments; and another of outer darkness, where one is brought only to
    weeping, and another, by the intensified torments, to the gnashing of teeth as
    well</mark></strong>. Outer darkness itself shows without doubt that there is
    also something inward. And what is said in Proverbs: “in the depths of hell” (Prov.
    9:18) gives to understand that some are in hell, yet not “in the depths of hell,”
    suffering a lighter torment. This can be noticed even now in bodily sufferings.
    For one is sick with a fever with convulsions and other ailments, another feels
    only the fever, and this one not in the same way as that one; another has no fever,
    but suffers pain in some limb, and again this one more or less than the other.
    But this “much” and “little” is said by the Lord according to common usage, as
    are other things like it. For we know that a similar manner of speech is often
    used about those suffering from some single ailment — for example, when people
    speak of a man who is ill only with a fever or feels pain in an eye, and marvel
    how much he endured or what hardships he went through. Wherefore I repeat again
    that to be beaten “much” and “little” signifies not a continuance or an ending
    of time, but <strong><mark>a difference of punishment</mark></strong>.</p></blockquote><p>(The
    Rules, Briefly Set Forth in Questions and Answers; Question 267)</p><h3>St John
    Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p>For he
    that had enjoyed a larger share of instruction <strong><mark>would also deserve
    to undergo a larger share of vengeance</mark></strong> if doing lawlessly. And
    so the wiser or mightier men we are, <strong><mark>the more are we punished if
    we sin</mark></strong>. For if thou art rich, thou wilt have more money demanded
    of thee than of the poor; and if wiser than others, a stricter obedience; and
    if thou hast been invested with authority, more shining acts of goodness; and
    so in the case of all the other things, thou wilt have to bring in measures proportioned
    to your power.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-epistle-to-the-romans-1#HH-Homily-V-on-Rom-i-28">Homilies
    on the Epistle to the Romans, Homily 5</a>)</p><blockquote><p>But as it is, (right
    action[22]) like some stout breastplate does not suffer the sharp and bitter dart
    to accomplish its work, but even if it is itself cut through, it averts much danger
    from the body. For <strong>he who departs to the other world with many deeds both
    good and bad, will have <mark>some alleviation</mark> in respect of the punishment
    and the torment there; but if a man is destitute of these good works, and takes
    <mark>only the evil with him, it is impossible to say what great sufferings he
    will undergo</mark></strong>, when he is conducted to everlasting punishment.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-an-exhortation-to-theodore-after-his-fall#HH-Letter-I">An
    Exhortation to Theodore After His Fall, Letter I</a>)</p><h2>Unequal blessedness
    in the Kingdom of Heaven</h2><h2>4th century</h2><h3>St Macarius the Great of
    Egypt, monk (c. 300–391)</h3><blockquote><p>1. The resurrection of souls that
    have been put to death takes place even now, but the resurrection of bodies will
    be in that day. But <strong><mark>as the stars established in the heavens are
    not all equal, and differ one from another in brightness and magnitude: so in
    spiritual progress, in that same Spirit, they differ according to the measure
    of faith, and one is found richer than another</mark></strong>. Scripture says:
    “he that speaketh in a tongue speaketh by the Spirit of God” (1 Cor. 14:2); and
    he, speaking with God, is spiritual. And “he that prophesieth buildeth up the
    Church” (1 Cor. 14:4); and this one has an abundance of grace. For the first edifies
    only himself, and the last — both himself and his neighbor; that is, like a grain
    of wheat sown in the earth, he brings forth from one heart many and diverse grains.
    And again the very <strong><mark>ears of corn are some larger, some smaller</mark></strong>,
    but all are gathered onto one threshing-floor, into one granary; and <strong><mark>though
    they are different, one bread is made of them</mark></strong>.</p><p>2. Or, as
    <strong><mark>in a city there are many people: some of them are little children,
    others are men or youths</mark></strong>, yet all drink water from one fountain,
    eat of one bread, and have about them one air; <strong><mark>or picture to thyself
    lamps</mark></strong>: if one has two spouts, and another seven, then <strong><mark>the
    one in which there is the greater abundance of light shines differently: so also
    those who are amid fire and light cannot be in darkness, but among them there
    is a great difference</mark></strong>. If anyone, being a father, has two sons
    — one a little child, the other a youth — he sends the youth to cities and provinces,
    but accompanies the infant everywhere himself, because he can as yet do nothing.
    Glory be to God! Amen.</p></blockquote><p>(Spiritual Homilies, Homily 36)</p><blockquote><p>all
    are one in Christ, and all repose in one light. They will be attentive one to
    another, and while they attend to one another they are at once illumined with
    truth, with the true contemplation of the unutterable light.</p><p>3. So <strong><mark>they
    will see one another in many forms, and in many and various Divine glories</mark></strong>,
    and each will marvel and rejoice with joy unspeakable, beholding the glory of
    another. Seest thou how the glories of God are inexpressible and incomprehensible;
    for they are the unutterable light, eternal mysteries, unnumbered blessings. For
    as in the visible world no one <strong>can number all the multiform plants</strong>,
    seeds and flowers upon the earth, and no one is able to measure or to know <strong>all
    the riches of the earth</strong>; or, as <strong>it is impossible for any man
    to comprehend with his mind all the living creatures</strong> in the sea, or <strong>their
    number, or their kinds, or their differences</strong>, or the quantity of the
    water itself, or the space of the sea; or, as it is impossible to know the number
    of the birds in the air, or their kinds, or their variety; or, as there is no
    possibility of grasping the magnitude of the heavens, or the position of the stars,
    or their course: so it is impossible to express or describe the measureless, <strong>boundless
    and incomprehensible riches of Christians</strong>.</p></blockquote><p>(Spiritual
    Homilies, Homily 34)</p><blockquote><p>Since some affirm that when grace is present
    the soul has no further care, God requires even of the perfect the will of the
    soul for the service of the Spirit, so that they act in harmony with grace. For
    the Apostle says: “Quench not the Spirit” (1 Thess. 5:19). Some do not wish to
    be a burden to others; others serve themselves; and others take from worldly people
    and give to the poor. And this is more excellent. <strong><mark>Some, having grace,
    care only for themselves; while others strive to bring benefit to the souls of
    others. The latter far surpass the former.</mark> And others, having grace, deliver
    up their bodies for abuse and sufferings for the name of God. And <mark>these
    again are higher than the former.</mark></strong> Some, while exercising themselves
    in virtue, desire that people should praise and honor them, saying of themselves:
    “we are Christians and partakers of the Holy Spirit”; others strive to hide themselves
    even from meeting people. — <strong><mark>The latter in many ways surpass the
    former</mark></strong>. Seest thou how, even amid the very perfection, zeal for
    God, <strong><mark>depending upon the natural will, becomes higher and more excellent</mark></strong>?</p></blockquote><p>(Spiritual
    Homilies, Homily 17)</p><blockquote><p><em>Question.</em> Since some sell their
    possessions, set slaves free, keep the commandments, but do not strive to receive
    the Spirit in this world — will they then, living in this way, not enter into
    the heavenly kingdom?</p><p><em>Answer.</em> This is a subtle subject for discussion.
    For some affirm that the kingdom is one and hell is one; but we say that there
    are many degrees, differences and measures in one and the same kingdom and in
    one and the same hell. As in all the members there is one soul, and above it acts
    in the brain, while below it moves the legs: so the Godhead embraces all creatures,
    both those in heaven and those beneath the abyss, and everywhere dwells wholly
    in the creature, though by Its immeasurability and immensity It is outside creatures.
    Wherefore the Godhead itself hearkens to men, and orders all things wisely. And
    since some pray, not knowing what they ask; others fast; others abide in service;
    God, the righteous Judge, rewards each according to the measure of faith. For
    what they do, they do out of the fear of God, but not all of them are sons, kings,
    heirs.</p><p>4. Some in the world are murderers, others adulterers, others robbers,
    while some also distribute their substance to the poor; the Lord looks upon both,
    and to those who do good He gives repose and reward; there are measures that overflow,
    and there are small measures; in the very light and in the very glory there is
    difference. <strong>In hell itself, in the punishment, there are poisoners and
    robbers and others who have sinned in lesser things. And those who affirm that
    there is one kingdom and one hell, and no degrees, speak badly.</strong></p></blockquote><p>(Spiritual
    Homilies, Homily 40)</p><h3>Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p>By
    many mansions of the Father the Savior means <strong>the measures of understanding
    of those who dwell in that country; I mean those <mark>varieties and differences
    with which they enjoy there</mark>, according to their own understanding, for
    the Lord named many mansions not because of difference of places, but <mark>according
    to the degree of the gift</mark></strong>. As everyone enjoys the rays of the
    visible sun according to the measure of the purity of his power of sight and of
    the impression, and as from one lamp that lights one house each ray is different,
    while the light is not divided into many lamps: so in the age to come <strong>all
    the righteous abide indivisibly, in one joy. <mark>But each in his own measure
    is illumined by the one noetic Sun, and according to the degree of his worth draws
    joy</mark></strong> and gladness, as it were in one air and place, seat, contemplation
    and form. And no one sees the measure of the higher and of the lower, lest, looking
    at the superior grace of another and at his own deprivation, he should have in
    this a cause for sorrow and disquiet. May it not be so there, where there is neither
    sorrow nor sighing; but everyone, according to the grace given him, <strong>rejoices
    inwardly in his own measure</strong>, while outwardly all have one contemplation
    and one joy! Besides these two ranks there is no other intermediate rank — I mean
    one rank the higher, and the other the lower; their middle is this <strong>diversity
    in the difference of recompenses</strong>.</p></blockquote><p>(On the Blessed
    Mansions)</p><h3>St Gregory the Theologian, archbishop of Constantinople (c. 325–389)</h3><blockquote><p>To
    put it briefly, the contemplation is beautiful, and beautiful too is the active
    life: the former because it rises above earthly things, enters into the Holy of
    Holies and raises our mind to that which is akin to it; the latter because, receiving
    Christ to itself and serving Him, it proves its love by works. 5. <strong>Each
    of these virtues is a special path to salvation, and without doubt leads to one
    or another of the eternal and blessed mansions. For <mark>as the kinds of life
    are different, so there are many mansions with God (John 14:2), and they are divided
    and appointed to each according to his worth</mark></strong>. Wherefore let one
    fulfill this virtue, another that, another many, and someone, if it be possible,
    all of them; only let each go forward without stopping, let him press onward and
    follow unswervingly in the footsteps of that good Guide, who directs his path
    straight, and by the narrow way, through the strait gate (Matt. 7:14), leads out
    into the breadth of heavenly blessedness.</p></blockquote><p>(Oration 14. On the
    Love of the Poor)</p><h3>St John Chrysostom, archbishop of Constantinople (c.
    347–407)</h3><blockquote><p>for He Himself saith, “He shall reward every man according
    to his works.” (Rom. 2:6) And <strong><mark>not only in hell, but also in the
    kingdom one will find many differences</mark></strong>; for He saith “in my Fathers
    house are many mansions;” (John 14:2) and, “there is one glory of the sun, and
    another glory of the moon.” (1 Cor. 15:41) And what wonder, if in dealing with
    such great matters he has spoken with such precision, seeing that <strong><mark>He
    declares there is a difference in that world even between one star and another</mark></strong>?
    Knowing then all these things let us never desist from doing good deeds, nor grow
    weary, nor, if we should be unable to reach the rank of the sun or of the moon,
    let us despise that of the stars. For if only we display thus much virtue at least,
    we shall be able to have a place in Heaven. And though we may not have become
    gold, or precious stone, yet if we only occupy the rank of silver we shall abide
    in the foundation; <strong>only let us not fall back again into that material
    which the fire readily devours, nor, when we are unable to accomplish great things,
    desist also from small ones</strong>, for this is the part of extreme folly, which
    I trust we may not experience. For just as material wealth increases if the lovers
    of it do not despise even the smallest gains, so is it also with the spiritual.
    For it is a strange thing that the judge should not overlook the reward of even
    a cup of cold water, but that we, if our achievements are not altogether great,
    should neglect the performance of little things. For he who does not despise the
    lesser things, will exercise much zeal concerning the greatest; but he who overlooks
    the former will also abstain from the latter; and to prevent this taking place
    Christ has defined great rewards even for these small things.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-an-exhortation-to-theodore-after-his-fall#HH-Letter-I">An
    Exhortation to Theodore After His Fall, Letter I</a>)</p><h2>17th century</h2><h3>St
    Dmitry of Rostov (Tuptalo), hierarch (1651–1709)</h3><blockquote><p>Our Lord ascended
    from us into heaven in order to prepare for us a place in the heavens, where we
    might live eternally and reign together with Him, our Lord. He Himself says: “I
    go to prepare a place for you. And if I go and prepare a place for you, I will
    come again and receive you unto Myself, that where I am, there ye may be also”
    (John 14:2–3). Good and full of joy is this cause. The Lord ascended from us into
    heaven, so that <strong><mark>He might prepare in the heavens a place for each:
    for people who love God — a place among the seraphim; for the divinely wise —
    among the cherubim; for the God-bearing — among the God-bearing thrones; for good
    masters — among the dominions; for brave warriors who struggle for the fatherland
    — among the Virtues; for various powers — among the Powers; for all superiors
    who govern their region in a godlike manner — a place among the Principalities;
    for those who comfort their friends and the poor and help them in calamities and
    misfortunes — a place among the archangels; finally, for those who live in the
    flesh on earth in an angelic manner — a place in the heavens together with the
    angels</mark></strong>.</p></blockquote><p>(Homilies and Sermons, part 2, homily
    20)</p><h2>19th century</h2><h3>St Philaret (Drozdov), metropolitan of Moscow
    (1782–1867)</h3><blockquote><p>382. Will all be equally happy?</p><p><strong><mark>No.
    There will be different degrees of happiness</mark></strong>, in proportion as
    every one shall have here endured the fight of faith, love, and good works.</p><p><em>There
    is one glory of the sun, and another glory of the moon, and another glory of the
    stars; for one star differeth from another star in glory. So also is the resurrection
    of the dead.</em> 1Cor. xv. 41, 42.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/TQdr_The_Longer_Catechism_of_The_Orthodox_Catholic_Eastern_Church#HH-On-the-Twelfth-Article">The
    Longer Catechism of The Orthodox, Catholic, Eastern Church</a>, question 382,
    in the numbering of the English edition; in the Russian edition, question 379)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
