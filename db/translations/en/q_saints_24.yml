    priority: 1
  body: '<h2>5th century</h2><h3>St John Cassian, monk (4th–5th c.)</h3><blockquote><p>The
    third method of healing is copied by the deceit and contrivance of devils, <strong>that,
    when a man who is enslaved to evident sins is out of admiration for his miracles
    regarded as a saint and a servant of God, men may be persuaded to copy his sins
    and thus an opening being made for cavilling, the sanctity of religion may be
    brought into disgrace, or else that he, who believes that he possesses the gift
    of healing, may be puffed up by pride of heart and so fall more grievously. Hence
    it is that invoking the names of those, who, as they know, have no merits of holiness
    or any spiritual fruits, they pretend that by their merits they are disturbed
    and made to flee from the bodies they have possessed</strong>. Of which it says
    in Deuteronomy: If there rise up in the midst of you a prophet, or one who says
    that he has seen a dream, and declare a sign and a wonder, and that which he has
    spoken comes to pass, and he say to you: “Let us go and follow after other gods
    whom you know not, and let us serve them”: you shall not hear the words of that
    prophet or of that dreamer, for the Lord your God is tempting you that it may
    appear whether you love Him or not, with all your heart and with all your soul.
    Deuteronomy 13:1–3 And in the gospel it says: <strong>There shall arise false
    Christs and false prophets, and shall give great signs and wonders</strong>, so
    that, if it were possible, even the elect should be led astray. Matthew 24:24</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/PBIm_Conferences_2#HH-Chapter-1-Discourse-of-Abbot-Nesteros-on-the-threefold-system-of-gifts">Conferences,
    15.1</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
