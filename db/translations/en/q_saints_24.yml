  body: "<h2>4th century</h2><h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3><blockquote><p>Imagine
    a garden in which there were fruit-bearing trees of every kind: there were a pear
    tree, an apple tree, and a vine with fruits and leaves; but the garden, and all
    the trees and the leaves, were changed and turned into another nature, and all
    that was of old became light-bearing. So also <strong>will men be changed in the
    resurrection, and their members will become holy and light-bearing</strong>.</p></blockquote><p>(Spiritual
    Homilies, Homily 15)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
