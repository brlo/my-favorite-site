- src: OkZs50zV_Светильники_в_храме
  path: Lamps-in-the-temple
  title: Lamps in the temple
  menu:
    parent: Awaiting distribution
    title: Lamps (candles) in the temple
    priority: 1
  body: '<h2>4th century</h2><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>As
    to the question of tapers, however, <strong>we do not, as you in vain misrepresent
    us, light them in the daytime, but by their solace we would cheer the darkness
    of the night, and watch for the dawn, lest we should be blind like you and sleep
    in darkness</strong>. And if some persons, being ignorant and simple minded laymen,
    or, at all events, religious women—of whom we can truly say, (Rom. 10:2) “I allow
    that they have a zeal for God, but not according to knowledge”—adopt the practice
    in honour of the martyrs, what harm is thereby done to you? Once upon a time even
    the Apostles (Matt. 26:8; Mark 14:4)pleaded that the ointment was wasted, but
    they were rebuked by the voice of the Lord. Christ did not need the ointment,
    nor do <strong>martyrs need the light of tapers; and yet that woman poured out
    the ointment in honour of Christ, and her heart’s devotion was accepted</strong>.
    All those who light these tapers have their reward according to their faith, as
    the Apostle says:[10]“Let every one abound in his own meaning.” Do you call men
    of this sort idolaters? I do not deny, that all of us who believe in Christ have
    passed from the error of idolatry. For we are not born Christians, but become
    Christians by being born again. And because we formerly worshipped idols, does
    it follow that we ought not now to worship God lest we seem to pay like honour
    to Him and to idols? <strong>In the one case respect was paid to idols, and therefore
    the ceremony is to be abhorred; in the other the martyrs are venerated, and the
    same ceremony is therefore to be allowed</strong>. &lt;…&gt;</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/jerome-against-vigilantius">Against Vigilantius</a>)</p><h2>6th
    century</h2><h3>St Sophronius, patriarch of Jerusalem (c. 560–638)</h3><blockquote><p><strong>The
    lamp and the candles are an image of the eternal light</strong>, and they also
    signify the light with which the righteous shine.</p></blockquote><p>(Excerpt
    from the homily on the Divine liturgy)</p><h2>14th century</h2><h3>St Symeon of
    Thessalonica, archbishop (2nd half of the 14th c. – 1429)</h3><blockquote><p>Then,
    taking again upon his head the sacred relics of the martyrs, he signs the gates,
    and having opened them, performs the entrance. <strong>The temple is then filled
    with light and incense, symbolizing the heavenly illumination and the fragrance
    of grace</strong> bestowed upon all who are present here, and also as a sign that
    the house of the Lord is filled with it, according to the vision of Ezekiel, who
    said: “so I looked, and behold, the glory of the Lord filled the house of the
    Lord” (Ezek. 44:4).</p><p>…</p><p><strong>Upon</strong> <strong>the lighting of
    the lamps to the glory of God, the first Light, in token of the divine illumination</strong>,
    he goes three times around the altar</p></blockquote><p>(The Wisdom of Our Salvation)</p>

    '
