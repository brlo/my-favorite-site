  body: <h2>1st century</h2><h3>St Ignatius the God-bearer, hieromartyr (c. 35–107)</h3><ul><li><p><a
    href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-Christ-is-God">Christ
    is God</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-God-was-born-of-Mary">God
    was born of Mary</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-The-Eucharist---Not-a-Symbol-but-the-True-Flesh-and-Blood-of-Jesus-Christ">The
    Eucharist - Not a Symbol, but the True Flesh and Blood of Jesus Christ</a></p></li><li><p><a
    href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-A-Christian-Does-Not-Consider-Himself-Saved">A
    Christian Does Not Consider Himself Saved</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-Salvation-is-Impossible-in-Heresy-and-Schism">Salvation
    is Impossible in Heresy and Schism</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-Separation-from-Heretics">Separation
    from Heretics</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-Without-a-Bishop-Presbyters-and-Deacons-There-Is-No-Church">Without
    a priestly hierarchy there is no Church</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-The-Life-of-the-Soul-After-the-Death-of-the-Body">The
    Life of the Soul After the Death of the Body</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-The-Abolition-of-the-Jewish-Law">The
    Abolition of the Jewish Law</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus#HH-Eternal-Torments-in-Hell">Eternal
    Torments in Hell</a></p></li></ul><h3>Polycarp of Smyrna, hieromartyr (69–155)</h3><ul><li><p><a
    href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-Interpretation-of-Scripture-in-accordance-with-Tradition">Interpretation
    of Scripture in accordance with Tradition</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-Obedience-to-the-Clergy">Obedience
    to the Clergy</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-The-Departed-Saints-Already-Dwell-in-Heaven-with-Christ">The
    Departed Saints Already Dwell in Heaven with Christ</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-The-Coming-of-Christ-to-Judge-the-Living-and-the-Dead">The
    Coming of Christ to Judge the Living and the Dead</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-All-Will-Be-Judged">All
    Will Be Judged</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-Avoiding-Those-Who-Lead-Astray">Avoiding
    Those Who Lead Astray</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-Fasting">Fasting</a></p></li><li><p><a
    href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-Prayer-for-Authorities">Prayer
    for Authorities</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-The-Faithful-Venerated-Polycarp">The
    disciples venerated Polycarp</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-The-Faithful-Honored-the-Relics-of-Polycarp">The
    disciples venerated the relics of Polycarp</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna#HH-Eternal-Torment">Eternal
    Torment</a></p></li></ul><h2>2nd century</h2><h3>St Justin the Philosopher, martyr
    (c. 100–165)</h3><ul><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-God-is-triune">God
    is triune</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-consubstantiality-of-God">The
    consubstantiality of God</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-There-is-one-will-in-God">There
    is one will in God</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-Son-of-God-is-not-a-separate-God-from-the-Father">The
    Son of God is not a separate God from the Father</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-Son-of-God-was-born-of-God-in-a-peculiar-manner">The
    Son of God was born of God in a peculiar manner</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-God-was-born-as-a-man-of-a-virgin">God
    was born as a man of a virgin</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-Mother-of-God-remained-a-virgin">The
    Mother of God remained a virgin</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Christ-is-God">Christ
    is God</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Christ-is-God-and-man">Christ
    is God and man</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Christs-human-body-and-soul-belong-wholly-to-God">Christ’s
    human body and soul belong wholly to God</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-law-of-Moses-is-abolished">The
    law of Moses is abolished</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-true-meaning-of-the-law-of-Moses-is-figurative-and-eternal-and-the-law-is-fulfilled-by-Christians">The
    true meaning of the law of Moses is figurative and eternal, and the law is fulfilled
    by Christians</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-He-consecrates-his-whole-life-to-God-not-to-the-Sabbath">He
    consecrates his whole life to God, not to the Sabbath</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Sunday-is-greater-than-the-Sabbath">Sunday
    is greater than the Sabbath</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-God-became-man-in-order-to-save-men">God
    became man in order to save men</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Faith-and-works-are-necessary-for-salvation">Faith
    and works are necessary for salvation</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-All-men-have-an-inclination-to-evil">All
    men have an inclination to evil</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Men-are-able-to-distinguish-good-from-evil">Men
    are able to distinguish good from evil</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-necessity-of-repentance-for-sins">The
    necessity of repentance for sins</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Baptism-regeneration-by-water-and-faith">Baptism
    (regeneration) by water and faith</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-They-are-regenerated-by-being-washed-in-water">They
    are regenerated by being washed in water</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-Eucharist-is-the-true-body-and-blood-of-Jesus-Christ">The
    Eucharist is the true body and blood of Jesus Christ</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-bloodless-sacrifice-offered-to-God-in-the-Eucharist">The
    bloodless sacrifice offered to God in the Eucharist</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-He-venerates-the-angels">He
    venerates the angels</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-He-venerates-the-cross">He
    venerates the cross</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-existence-of-souls-after-death">The
    existence of souls after death</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-toll-houses-the-trials-of-the-soul-after-death">The
    toll-houses (the trials of the soul after death)</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-souls-of-the-righteous-are-in-a-better-place-and-see-God-while-the-souls-of-sinners-suffer-in-another-place">The
    souls of the righteous are in a better place and see God, while the souls of sinners
    suffer in another place</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-souls-of-the-martyrs-go-to-the-Father-and-the-heavenly-King">The
    souls of the martyrs go to the Father and the heavenly King</a></p></li><li><p><a
    href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Christians-attain-to-life-with-God">Christians
    attain to life with God</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Christ-is-the-judge-of-the-living-and-the-dead">Christ
    is the judge of the living and the dead</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Eternal-torments-in-hell">Eternal
    torments in hell</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Torments-are-justice">Torments
    are justice</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Only-two-comings-of-Christ">Only
    two comings of Christ</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-second-coming-of-Christ-is-for-the-resurrection-the-judgment-punishment-and-reward">The
    second coming of Christ is for the resurrection, the judgment, punishment and
    reward</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-second-coming-of-Christ-may-take-place-at-any-moment">The
    second coming of Christ may take place at any moment</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-All-await-the-second-coming-of-Christ">All
    await the second coming of Christ</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Justin-thinks-that-Christ-will-come-to-judge-in-his-own-lifetime">Justin
    thinks that Christ will come to judge in his own lifetime</a></p></li><li><p><a
    href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Christ-has-been-enthroned-in-heaven">Christ
    has been enthroned in heaven</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-eternal-kingdom-of-Christ">The
    eternal kingdom of Christ</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-kingdom-of-Christ-is-not-a-human-kingdom">The
    kingdom of Christ is not a human kingdom</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-The-millennium-before-the-second-coming-of-Christ">The
    millennium before the second coming of Christ</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-One-universal-resurrection-and-one-universal-judgment">One
    universal resurrection and one universal judgment</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-In-the-resurrection-men-rise-up-sound">In
    the resurrection men rise up sound</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Resurrection-in-their-own-bodies">Resurrection
    in their own bodies</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-How-the-righteous-of-the-Old-Testament-will-be-saved">How
    the righteous of the Old Testament will be saved</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Freedom-and-fate">Freedom
    and fate</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Monasticism">Monasticism</a></p></li><li><p><a
    href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-False-prophets-can-work-miracles">False
    prophets can work miracles</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-Fasting">Fasting</a></p></li><li><p><a
    href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr#HH-He-is-obedient-to-the-laws-of-the-state">He
    is obedient to the laws of the state</a></p></li></ul><h3>St Irenaeus of Lyons,
    hieromartyr (c. 130–202)</h3><ul><li><p><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon#HH-The-Afterlife-of-the-Soul">The
    Afterlife of the Soul</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon#HH-The-Souls-of-the-Righteous-Dwell-with-God-After-Death">The
    Souls of the Righteous Dwell with God After Death</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon#HH-Freedom-from-the-Bonds-of-the-Mosaic-Law">Freedom
    from the Bonds of the Mosaic Law</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon#HH-Sabbath-Righteousness-Every-Day">Sabbath
    (Righteousness) Every Day</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon#HH-Eternal-Punishment">Eternal
    Punishment</a></p></li></ul><h2>4th century</h2><h3>St John Chrysostom, archbishop
    of Constantinople (c. 347–407)</h3><ul><li><p><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-Outside-the-Church-There-Is-No-Salvation">Outside
    the Church There Is No Salvation</a></p></li><li><p><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-Priesthood">Priesthood</a></p></li><li><p><a
    href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-The-Baptism-of-Infants">The
    Baptism of Infants</a></p></li><li><p><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-The-Eucharist---The-True-Body-and-Blood-of-Jesus-Christ">The
    Eucharist - The True Body and Blood of Jesus Christ</a></p></li><li><p><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-Prayers-to-the-Saints">Prayers
    to the Saints</a></p></li><li><p><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-Veneration-of-the-Relics-of-Saints">Veneration
