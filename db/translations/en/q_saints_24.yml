  menu:
    parent: Fasting
    title: The purpose of fasting
    priority: 3
  body: "<h2>19th century</h2><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>The
    head of the virtues is prayer; their foundation is fasting.</p><p>Fasting is a
    constant moderation in food, with prudent discernment in it.</p><p>Proud man!
    you dream so much and so loftily about your mind, yet it is in complete and unceasing
    dependence on the stomach.</p><p>The law of fasting, being outwardly a law for
    the belly, is in essence a law for the mind.</p><p><strong>The mind, this king
    in man, if it wishes to enter into the rights of its autocracy and to keep them,
    must first of all submit itself to the law of fasting. Only then will it be constantly
    watchful and bright; only then can it rule over the desires of the heart and body;
    only in constant soberness can it study the commandments of the Gospel and follow
    them. </strong>The foundation of the virtues is fasting.</p><p>To the newly created
    man, brought into paradise, the one commandment was given — the commandment of
    fasting. Of course, one commandment was given because it was sufficient to preserve
    the primeval man in his innocence.</p><p>&lt;…&gt;</p><p>A wondrous union of fasting
    with prayer! <strong>Prayer is powerless if it is not founded upon fasting, and
    fasting is fruitless if prayer is not built upon it</strong>.</p><p><strong><mark>Fasting
    detaches man from the passions of the flesh, while prayer struggles with the passions
    of the soul and, having overcome them, penetrates the whole make-up of man and
    cleanses him; into the cleansed rational temple it brings in God.</mark></strong></p><p><strong><mark>&lt;…&gt;</mark></strong></p><p><strong><mark>The
    rules of fasting are established by the Church with the purpose of aiding her
    children</mark></strong>, as a guidance for the whole Christian society. <strong>At
    the same time it is prescribed to each one to examine himself with the help of
    an experienced and discerning spiritual father, and not to lay upon himself a
    fast beyond his strength: because, we repeat, fasting is for man, and not man
    for fasting; the food given for the support of the body must not be used to destroy
    it.</strong></p><p>“If you hold in check your belly, said the holy Basil the Great,
    you will ascend into paradise; if you do not hold it in check, you will be the
    victim of death.” By the name of paradise must here be understood the grace-filled
    state of prayer, and by the name of death the passionate state. The grace-filled
    state of man, during his sojourn on earth, serves as the pledge of his eternal
    blessedness in the heavenly Eden; the falling into the power of sin and into the
    state of spiritual deadness serves as the pledge of the fall into the abyss of
    hell for eternal torment. Amen.</p></blockquote><p>(Ascetic Experiences, vol.
    1, On Fasting)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
