  body: <h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p>“How
    many there are daily who do not repent nor make confession of the consciousness
    of their crime, who are filled with unclean spirits![42] How many are shaken even
    to unsoundness of mind and idiotcy by the raging of madness! Nor is there any
    need to go through the deaths of individuals, since <strong><mark>through the
    manifold lapses occurring in the world the punishment of their sins is as varied
    as the multitude of sinners is abundant</mark></strong>.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-on-the-lapsed">On the Lapsed</a>)</p>
