- src: Hg0xrc3u_Христианину_необходим_пост
  path: A-Christian-needs-fasting
  title: A Christian needs fasting
  menu:
    parent: Fasting
    title: A Christian needs fasting
    priority: 9
  body: "<h2>6th century</h2><h3>St Isaac the Syrian (of Nineveh), monk (6th–7th c.)</h3><blockquote><p>With
    a full belly it is impossible to attain knowledge of the mysteries of God.</p></blockquote><p>(Ascetical
    Homilies, Homily 1)</p><h2>Quotes of the Optina saints on fasting[1]</h2><p>...<strong>From
    lack of self-restraint every evil comes... Fasting arouses to prayer, and for
    that reason it is especially hateful to the enemy</strong>: people come to me
    for counsel and for confession, and among other things I advise them to keep the
    holy fasts. They agree to everything, but when the matter touches the fast: I
    do not want to, I cannot, and so forth. The enemy stirs this up; he does not want
    the holy fasts to be kept... (Elder Barsanuphius).</p><hr><p>Though those who
    reason freely think that there is little difference between drinking tea or a
    mint infusion, in reality it has no small significance. Every deprivation and
    every self-restraint is esteemed before God, according to what is said in the
    Gospel: “the kingdom of heaven is taken by force, and those who make effort seize
    it” (Matt. 11:12). And those who boldly and self-willedly break the rule of the
    fast are called “enemies of the cross of Christ: their god is their belly, and
    their glory is in their shame” (Phil. 3:18-19). And in the psalms it is said:
    “they go astray from the womb” (Ps. 58:3). It goes without saying that it is another
    matter if someone breaks the fast because of illness and bodily infirmity. But
    the healthy are made healthier and kinder by fasting, and besides that they live
    longer, although they may look thin. <strong>With fasting and abstinence the flesh
    does not rebel so much, and sleep does not overcome one so much, and fewer empty
    thoughts come into the head, and spiritual books are read more willingly and with
    deeper understanding</strong> (Elder Ambrose).</p><hr><p>...You write that on
    the basis of the words of the Savior himself — “not that which goes into the mouth
    defiles a man, but that which comes out of the mouth” (Matt. 15:11) — you formed
    the firm intention first to purify yourself of inner vices, and only afterwards
    to take up abstinence in food; for now, apart from the Dormition and Great fasts,
    not to keep any others. But the words of the Savior you cite were said not at
    all so that they might serve as a basis for breaking the fasts... Some Pharisees
    and scribes reproached the Lord because his disciples ate bread with unwashed
    hands. Then the Lord, to rebuke their incorrect understanding of human purity,
    said: “there is nothing from without a man which entering into him can defile
    him, but the things which come out of him, those defile the man” (cf. Matt. 15:11).
    That is, the Lord said, as it were: however unclean your hands may be, if you
    take bread with them unwashed and eat, this cannot defile you. Meated food, however,
    is not in the least a defilement. It does not defile, but fattens the body. And
    the holy apostle Paul says: “though our outward man perish, yet the inward man
    is renewed day by day” (2 Cor. 4:16). By the outward man he meant the body, and
    by the inward the soul. If, he says, <strong>our outward man, that is, the body,
    decays, wastes away, is oppressed and grows thin with fasting and other labors,
    then the inward man is renewed. And conversely, if the body is nourished and grows
    fat, then the soul decays, or falls into forgetfulness of God and of its high
    destiny, as it is said in the psalms: “they grew fat, they grew thick, they grew
    gross; and he forsook God who made him” (cf. Deut. 32:15)</strong>. That the keeping
    of the fasts is necessary we can see both in the Gospel, and, <strong>first of
    all</strong>, from the example of the <strong>Lord himself, who fasted forty days
    in the wilderness</strong>, although he was God and had no need of it. <strong>Secondly</strong>,
    when his disciples asked him why they could not cast out the devil from a man,
    the Lord answered: “because of your unbelief” (Matt. 17:20), and then added: “<strong>this
    kind goeth not out but by prayer and fasting</strong>” (Mark 9:29). Besides this,
    the Gospel also contains an indication that we must keep the fast on Wednesday
    and Friday. In the second chapter of Mark, when the Lord was asked: “Why do the
    disciples of John and the Pharisees fast, but your disciples do not fast? And
    Jesus said to them: Can the children of the bridechamber fast while the bridegroom
    is with them? As long as they have the bridegroom with them they cannot fast,
    but the days will come when the bridegroom shall be taken away from them, and
    then shall they fast in those days (Mark 2:18-20). By the bridegroom the Lord
    here meant himself, and by the children of the bridechamber his disciples, and
    in their person all the faithful. The bridegroom is taken from the children of
    the bridechamber on Wednesday and Friday: for on Wednesday the Lord was given
    over to crucifixion, and on Friday he was crucified. Therefore the Holy Church
    has appointed to hallow these days with fasting (Elder Ambrose).</p><hr><p>You
    are perplexed about fasting; when you visit your relatives you must dine and eat
    meated food, but you are afraid to require that fasting food be prepared for you,
    lest you give occasion for the thought that you set yourself above others and
    exalt yourself. You ask what to do in such a case. I do not lay bonds on you,
    but give you this counsel: in my opinion, <strong>do not be afraid to ask your
    relatives to prepare a fasting table for you. This does not mean setting yourself
    above others. Not at all: you are fulfilling a duty and the obedience owed the
    Church — in what way is that being exalted? Looking at you, others will be found
    to imitate you too</strong>. But if you eat meated food, then others too, following
    your example, will be carried away and will not grieve that they sin, and you
    will be doubly guilty — for yourself and for others. What does it matter to you
    what people say about you — pay no heed to that and be at peace. If your relatives
    eat thus because of illness, that is more excusable, but of course they too must
    repent of it. But to eat thus only out of fear of gossip — that is unseemly. You
    know what the Lord appointed for disobedience to the Church (Elder Macarius).</p><hr><p>You
    write that owing to bodily infirmities you occasionally had of necessity, during
    the holy Quadragesima, to relax somewhat the strictness of the fast. What is to
    be done? They say that by necessity there takes place even &lt;a dispensation&gt;
    from the law. So then, may the all-good Lord forgive what happened from infirmity,
    and strengthen you in what is good (Elder Joseph).</p><hr><p>You write that for
    two gravely ill sisters you bought a box of sprats each, and you ask how to repent
    of this. Tell your spiritual father just as it happened, that is, that you bought
    sprats for the gravely ill sisters and allowed them to eat some during the Great
    Fast (Elder Joseph).</p><hr><p>The keeping of the fasts and fasting days is absolutely
    necessary. This is not a human invention: it was decreed and enacted by the Church
    and the Councils through the cooperation of the Holy Spirit, and the foundation
    and Head of the Church is our Lord Jesus Christ himself. He clothed his Church
    with such authority that if anyone does not obey the Church, “let him be unto
    thee as a heathen man and a publican” (Matt. 18:17); and he said further to the
    apostles, and in them to the pastors: “He that heareth you heareth me, and he
    that despiseth you despiseth me; and he that despiseth me despiseth him that sent
    me” (Luke 10:16). Only repentance can reconcile us with this transgression, but
    when it is done with contempt, then I can say nothing more (Elder Macarius).</p><hr><p>While
    abstaining from foods, we must also abstain from the passions (Elder Macarius).</p><hr><p>I
    do not agree with you about adding rules to the fast, considering your weak health,
    and also because you care only about fulfilling the quantity and take no care
    for the quality; where both are lacking, let humility supply their place. And
    when the fragrance of humility is absent, a man profits nothing by them, but takes
    harm instead through vanity and self-opinion (Elder Macarius).</p><hr><p>And the
    bloodthirsty beasts, and the predatory hawks, and how many other innocent creatures,
    small and great — what countless thousands of them — also fast. The wolves, it
    is said, sometimes do not eat for a week and more. Shall we, Christians, who are
    heirs of the Eternal Kingdom, not fast? And now is the most fitting time. Behold,
    now is an acceptable time; behold, the day of salvation. “The joyful time of fast
    has come; let us, abundantly filled with luminous purity and pure love, radiant
    prayer and every other virtue, cry out brightly: O all-holy Cross of Christ, who
    hast nurtured the sweetness of life, vouchsafe that all of pure heart may worship
    thee!” For not eating bread and not drinking water or anything else is not yet
    fasting, for the demons neither eat nor drink anything at all — and all the same
    they are evil and hateful to God. For us fasting is (as the Church sings) a departure
    from evil, restraint of the tongue, laying aside of anger, renunciation of lusts,
    of slander, of lies and of perjury. A departure from these things is the true
    fast, and acceptable (Elder Anatole).</p><hr><p>The fasts must unconditionally
    be kept: on Wednesday and Friday, and the whole of the Great Fast. Now it is Passion
    Week, and you must unconditionally fast... Unconditionally fast! (Elder Anatole).</p><hr><p>...Restrain
    yourself from dainties and food as much as you can, and try to eat moderately
    of light food that you know (Elder Leo).</p><hr><p>To the question “Does it not
    make any difference to God what food it is?” the elder replied: “It is not the
    food that matters, but the commandment. Adam was banished from paradise not for
    overeating, but for eating only what was forbidden. That is why even now on Thursday
    or Tuesday one may eat what one wills and is not punished for it, while on Wednesday
    and Friday one is punished, because we are not obedient to the commandment. What
    is especially important here is that through obedience submissiveness is formed”
    (Elder Ambrose).</p><hr><p>I am very glad that those who serve with you have begun
    to honor Wednesday and Friday without breaking the Church’s rule on fasting. The
    example of Germans and other foreigners led Orthodox Russians astray into not
    honoring the fast, asserting that there is little or no sin in food. If that were
    true, Adam and Eve would not have been banished from paradise for eating the fruit
    of the forbidden tree — and that tree was a fig tree. But the force of the sin
    consisted not in the fruit of the tree, but in the prohibition and the disobedience.
    So too now the sin is not in the food, but in the prohibition and the disobedience
    to the rules of the Church (Elder Ambrose).</p><hr><p>...In your last letter there
    is again a covert scheme of inconstancy and self-will, namely, not to appear at
    the common meal on certain days, for the sake of fasting. — It is better to imitate
    St Theodore the Studite, who was every day at the table, and yet was a faster
    (Elder Ambrose).</p><hr><p>You write in your letter that during Cheese-fare Week
    you abode in such a state, as you thought, of pleasing God, that even for half
    an hour it was hard for you to occupy yourself with anything but remembrance of
    the Lord and the reading of holy books. But in the first week of the fast, after
    such spiritual consolation of yours, a fierce carnal warfare arose, and after
    it spiritual despondency. You ask me how this could have happened. You yourself
    point out the causes in your letter. First: the reckless doubt and agitation that
    you would not endure the fast as one ought, and then murmuring against the Lord.
    St Isaac the Syrian writes that God endures all human infirmities, but does not
    endure a murmuring man, lest he punish him. The second cause of this warfare that
    rose against you is fasting on your own authority. While you lived by yourself,
    whatever you did, everything by necessity went well for you: the Lord indulged
    your senseless zeal and recklessness. But if you have a spiritual bond with someone,
    then you must no longer, by your own will, undertake or take upon yourself reckless
    exploits contrary to the blessing or counsel you have received; and by this one
    not only cannot please God, but such self-will does not remain unpunished — it
    brings temptation upon a man. You describe how in a similar case fasting formerly
    helped you, and ask a blessing to take it up again in the same way if the warfare
    does not depart. — St John of the Ladder writes: “he who attempts to subdue this
    warfare by abstinence alone is like one who swims with one hand and wants to swim
    out of the sea”; and here, in another place, he points out the true remedy: “if
    you join yourself to obedience, you will thereby be freed from it (that is, from
    the warfare of the flesh); if you acquire humility, you will thereby cut off its
    head.” But with you fasting is joined to haughtiness and disobedience: what profit
    can come of that? With your weak health, reckless exploits on your own authority
    can only finally unsettle you and make you fit for nothing, while from the warfare
    you can receive relief only through humble repentance and the humble calling upon
    God’s help, with obedience and moderate abstinence (Elder Ambrose).</p><hr><p>...The
    fast has drawn near and almost begun; how then shall we fast? We cannot keep the
    bodily fast from foods as our fathers and teachers kept it; but even if we kept
    it, what profit would there be without the spiritual fast, of which the Church
    reminds us: “let us fast with a spiritual fast acceptable to the Lord”, and so
    forth (a Triodion sticheron). So then one must strive, calling to mind one’s sins:
    in the first place, to have “a broken and humbled heart” (Ps. 51:17); not to attend
    to the failings of others and not judge them, but attend more to one’s own passions
    and not allow them to pass into action (Elder Macarius).</p><hr><p>Use food, to
    the glory of God, such as can strengthen your bodily constitution, appointed by
    the rule of the Church as befits the times of meat-eating and of fasts; do not
    listen to those who advise you the contrary — to depart from food and drink. We
    must be, according to the teaching of the holy fathers, not slayers of the body
    but slayers of the passions; that is, we must destroy in ourselves the passions:
    pride and vanity, fleshly lusts, love of money, anger, envy and rancor over offenses
    of our neighbors, and so forth; and plant in ourselves love, meekness, humility,
    mercy, patience and the other Christian virtues, strengthened by prayer (Elder
    Macarius).</p><hr><p>Peace be to you, and the blessing of God! I congratulate
    you on the fast and desire that you pass this joyful time — as we shall sing in
    the second week of the fast — in joy of spirit and consolation. Do not force yourself
    too hard in going to church, given your infirmity: God does not require it of
    the weak. And if you keep the Jesus prayer at home during the services, that will
    be more profitable for you. Fasts, bows and labors are given for the taming of
    the disturbances of the flesh, but to the weak they do harm, for they make him
    useless and fit for nothing. St Basil the Great teaches that we must not be slayers
    of the flesh but slayers of the passions, and humility and the consciousness of
    one’s own infirmity help toward this more than anything (Elder Anatole).</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
