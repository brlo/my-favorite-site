    title: The sign of the cross
    priority: 7
  body: '<h2>2nd century</h2><h3>Tertullian<strong> </strong>(c. 155–220)</h3><blockquote><p>At
    every forward step and movement, at every going in and out, when we put on our
    clothes and shoes, when we bathe, when we sit at table, when we light the lamps,
    on couch, on seat, in all the ordinary actions of daily life, <strong><mark>we
    trace upon the forehead the sign</mark></strong>.[11]</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-the-chaplet-or-de-corona#HH-3">The
    Chaplet, or De Corona, 3</a>)</p><blockquote><p>“Now such remarks have I wished
    to advance in defence of the flesh, from a general view of the condition of our
    human nature. Let us now consider its special relation to Christianity, and see
    how vast a privilege before God has been conferred on this poor and worthless
    substance. It would suffice to say, indeed, that there is not a soul that can
    at all procure salvation, except it believe whilst it is in the flesh, so true
    is it that the flesh is the very condition on which salvation hinges. And since
    the soul is, in consequence of its salvation, chosen to the service of God, it
    is the flesh which actually renders it capable of such service. The flesh, indeed,
    is washed, in order that the soul may be cleansed; the flesh is anointed, that
    the soul may be consecrated; <strong><mark>the flesh is signed (with the cross),
    that the soul too may be fortified</mark></strong>; the flesh is shadowed with
    the imposition of hands, that the soul also maybe illuminated by the Spirit; the
    flesh feeds on the body and blood of Christ, that the soul likewise may fatten
    on <i>its</i> God. They cannot then be separated in their recompense, when they
    are united in their service.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-on-the-resurrection-of-the-flesh#HH-Christianity-by-Its-Provision-for-the-Flesh-Has-Put-on-It-the-Greatest-Honour-The-Privileges-of-Our-Religion-in-Closest-Connection-with-Our-Flesh-Which-Also-Bears-a-Large-Share-in-the-Duties-and-Sacrifices-of-Religion">On
    the Resurrection of the Flesh, 8</a>)</p><blockquote><p>Shall you escape notice
    <strong><mark>when you sign your bed, (or) your body</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-to-his-wife#HH-Of-Sin-and-Danger-Incurred-Even-with-a-Tolerant-Husband">To
    His Wife, Book II, 5</a>)</p><h2>4th century</h2><h3>St Athanasius the Great,
    archbishop of Alexandria (c. 295–373)</h3><blockquote><p>And whereas formerly
    demons used to deceive men’s fancy, occupying springs or rivers, trees or stones,
    and thus imposed upon the simple by their juggleries; now, after the divine visitation
    of the Word, their deception has ceased. For <strong><mark>by the Sign of the
    Cross, though a man but use it</mark>, he drives out their deceits</strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/KADO_On_the_Incarnation_of_the_Word">On the
    Incarnation of the Word, 8</a>)</p><h3>Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p>Instead
    of a shield <strong><mark>guard yourself with the honored cross, sealing your
    members and heart with it. And do not only make the sign of the cross upon yourself
    with your hand, but seal with it in your thoughts every occupation of yours</mark></strong>:
    your going in and your walking about at all times, your sitting and your rising,
    your bed, and whatever service you pass through — above all, <strong>seal yourself
    in the name of the Father and of the Son and of the Holy Spirit</strong>. Very
    mighty is this weapon, and no one will ever be able to harm you if you are guarded
    by this weapon. If no one can do harm even to what bears the seal of an earthly
    king, then all the less can anyone contend with us who bear upon ourselves the
    seal of so great a heavenly King! With this weapon, brother, act most often of
    all, for it gives strength to resist the arrows of the enemy — or rather, his
    sword: bitter and terrible anger. Like a double-edged sword, in an instant it
    destroys whoever clings to it, as it is written: “the outpouring of his wrath
    is his fall” (Sir. 1:22). Therefore, brother, never be careless about <strong>sealing
    yourself with the cross</strong> — and you will break apart the nets which the
    devil has hidden for you, for it is written: “on this path in which I walk, they
    have hidden a snare for me” (Ps. 142:3). So always seal yourself with the cross,
    and evil will not touch your spirit.</p></blockquote><p>(An Exhortation to Monks)</p><h3>Cyril
    of Jerusalem, bishop (315–386)</h3><blockquote><p>Let us not then be ashamed to
    confess the Crucified. Be the Cross our seal <strong>made with boldness <mark>by
    our fingers on our brow, and on everything</mark>; over the bread we eat, and
    the cups we drink; in our comings in, and goings out; before our sleep, when we
    lie down and when we rise up; when we are in the way, and when we are still</strong>[207].
    Great is that preservative; it is without price, for the sake of the poor; without
    toil, for the sick; since also its grace is from God. It is the Sign of the faithful,
    and the dread of devils: for He <i>triumphed over them in it, having made a shew
    of them openly</i> (Col. 2:15); for when they see the Cross they are reminded
    of the Crucified; they are afraid of Him, who <i>bruised the heads of the dragon</i>
    (Ps. 74:13). Despise not the Seal, because of the freeness of the gift; out for
    this the rather honour thy Benefactor.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-2#HH-On-the-words-Crucified-and-Buried">The
    Catechetical Lectures, Lecture XIII, 36</a>)</p><blockquote><p>“<i>I come to gather
    all nations, and <strong>I will leave on them <mark>a sign</mark></strong></i>[123].
    For <strong><mark>from My conflict upon the Cross</mark> I give to each of My
    soldiers <mark>a royal seal to bear upon his forehead</mark></strong>.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-2#HH-On-the-words-Incarnate-and-Made-Man">The
    Catechetical Lectures, Lecture XII, 8</a>)</p><h3>St Epiphanius of Cyprus, bishop
    (c. 315–403)</h3><blockquote><p>The troubled man, kindled with zeal for the Lord,
    goes out of the city and, ordering water to be brought in a vessel — I mean in
    a capsas (the natives call it a kakuvion) — takes this vessel of water before
    everyone (a multitude of Jews had gathered to watch, wishing to see what would
    happen and what Josephus intended to do) — with a loud voice, having set upon
    the vessel with his own <strong><mark>finger the seal of the cross</mark> and
    invoked the name of Jesus</strong>, he said: “In the name of Jesus the Nazarene,
    whom my fathers and the fathers of all these who stand here crucified, let there
    be in this water the power to destroy every sorcery and magic produced by them,
    and to bring the power of fire to accomplish the house of the Lord.” Then he takes
    water in his hand and sprinkles every furnace with the water. And he destroyed
    the sorcery</p></blockquote><p>(The Panarion, or Chest Against Eighty Heresies,
    12)</p><h3>St Basil the Great, archbishop of Caesarea (c. 329–379)</h3><blockquote><p><em>Of
    the beliefs and practices whether generally accepted or publicly enjoined which
    are preserved in the Church </em><strong><em>some we possess derived from written
    teaching; others we have received delivered to us in a mystery by the tradition
    of the apostles</em></strong><em>; and</em> both of these in relation to true
    religion have the same force.<em> And these no one will gainsay – no one, at all
    events, who is even moderately versed in the institutions of the Church. For were
    we to attempt to reject such customs as have no written authority, on the ground
    that the importance they possess is small, we should unintentionally injure the
    Gospel in its very vitals; or, rather, should make our public definition a mere
    phrase and nothing more.</em></p><p><em>For instance, to take the first and most
    general example, who is thence who has taught us in writing </em><strong><em><mark>to
    sign with the sign of the cross</mark></em></strong><em> those who have trusted
    in the name of our Lord Jesus Christ?</em></p><p><em>What writing has taught us
    </em><strong><em>to turn to the East at the prayer</em></strong><em>?</em></p><p><em>Which
    of the saints has left us in writing the words of </em><strong><em>the invocation
    at the displaying of the bread of the Eucharist and the cup of blessing?</em></strong><em>
    For we are not, as is well known, content with what the apostle or the Gospel
    has recorded, but both in preface and conclusion we add other words as being of
    great importance to the validity of the ministry, </em><strong><em><mark>and these
    we derive from unwritten teaching</mark></em></strong><em>.</em></p><p><em>Moreover
    we bless </em><strong><em>the water of baptism</em></strong><em>, and </em><strong><em>the
    oil</em></strong><em> </em><strong><em>of the chrism</em></strong><em>, and besides
    this </em><strong><em>the catechumen who is being baptized</em></strong><em>.
    On what written authority do we do this? Is not our authority silent and mystical
    tradition?</em></p><p><em>Nay, by what written word is </em><strong><em>the anointing
    of oil itself</em></strong><em> taught?</em></p><p><em>And whence comes the custom
    of </em><strong><em>baptizing thrice</em></strong><em>?</em></p><p><em>And as
    to the other customs of baptism from what Scripture do we derive the renunciation
    of Satan and his angels? Does not this come from that unpublished and secret teaching
    which our fathers guarded in a silence out of the reach of curious meddling and
    inquisitive investigation? Well had they learned the lesson that the awful dignity
    of the mysteries is best preserved by silence.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/rwa9_De_Spiritu_Sancto#HH-Chapter-27">About
    the Holy Spirit, 27</a>)</p><h3>St Ambrose of Milan, bishop (c. 339–397)</h3><blockquote><p>For
    Christians the weak pain of circumcision has become unnecessary. They proclaim
    the death of the Lord, <strong>hourly <mark>inscribe upon their forehead contempt
    for death</mark> and bear witness to all that without the <mark>cross</mark> of
    Christ salvation cannot be obtained</strong>. And who, after all, would fight
    in battle with a knitting needle when he has mighty spears?</p></blockquote><p>(Letter
    69 (Maur. 72), to Constantius, 12)</p><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>Let no man therefore be ashamed of the honored
    symbols of our salvation, and of the chiefest of all good things, whereby we even
    live, and whereby we are; but <strong><mark>as a crown, so let us bear about the
    cross of Christ</mark></strong>. Yea, for by it all things are wrought, that are
    wrought among us. <strong>Whether one is to be new-born, <mark>the cross is there</mark></strong>;
    or to be nourished with that mystical food, or to be ordained, or to do anything
    else, <strong>everywhere <mark>our symbol of victory is present</mark></strong>.
    Therefore <strong>both on house, and walls, and windows, and upon our forehead,
    and upon our mind, <mark>we inscribe it</mark> with much care</strong>. For of
    the salvation wrought for us, and of our common freedom, and of the goodness of
    our Lord, this is the sign. “For as a sheep was He led to the slaughter.” (Isa.
    53:7) When therefore <strong><mark>thou signest thyself</mark>, think of the purpose
    of the cross</strong>, and quench anger, and all the other passions. When <strong><mark>thou
    signest thyself</mark></strong>, fill <strong><mark>thy forehead</mark></strong>
    with all courage, make thy soul free. &lt;…&gt; Since <strong><mark>not merely
    by the fingers ought one to engrave it</mark></strong>, but before this by the
    purpose of the heart with much faith. &lt;…&gt; This therefore do thou engrave
    upon thy mind, and embrace the salvation of our souls.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-gospel-of-saint-matthew-6#HH-Matthew-XV-21-22">Homilies
    on the Gospel of Saint Matthew, Homily 54</a>)</p><blockquote><p><strong>Many
    are in the habit of <mark>crossing[82] themselves continually</mark></strong>,
    and they need no one to remind them of it, but often when the mind is wandering
    after other things, <strong>the hand is involuntarily drawn by custom, as by some
    living teacher, to make the sign</strong>. Some have brought themselves into a
    habit of not swearing at all, and therefore neither willingly nor unwillingly
    do they ever do it. Let us then bring ourselves into such a habit of almsgiving.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-homilies-on-second-timothy#HH-2-Timothy-22021">Homilies
    on Second Timothy, Homily 6</a>)</p><p>He speaks of the fact that some have become
    so accustomed to making the sign of the cross upon entering the temple that they
    do it unconsciously, when entering a bath or lighting a candle:</p><blockquote><p>See
    the discernment of this wise man. He did not say, “Accustom not to swearing” thy
    mind, but “thy mouth”; because being altogether an affair of the mouth, thus it
    is easily remedied. For at last <strong>it becomes a habit without intention;
    as for instance, there are many who entering the public baths, as soon as they
    have passed the threshold, <mark>cross (Hom. in 1 Cor. 11:7) themselves (σφραγίζονται).</mark>[73]</strong>
    This the hand has got to do, without any one’s bidding, by force of habit. Again,
    <strong>at the lighting of a candle, often when the mind is intent on something
    else, <mark>the hand makes the sign</mark></strong>. In the same way also the
    mouth, without concurrence of the mind, articulates the word, from mere habit,
    and the whole affair is in the tongue.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-acts-of-the-apostles-2#HH-Homily-X-on-Acts-iv-1">Homilies
    on the Acts of the Apostles, Homily 10</a>)</p><blockquote><p>How wilt thou enter
    the synagogue? If <strong>thou sealest thy face (with the sign of the cross)</strong>,
    at once all the hostile power that dwells in the synagogue will flee; but if thou
    sealest it not, then at the very entrance thou wilt already have thrown down thy
    weapon, and then the devil, finding thee defenseless and unarmed, will do thee
    much harm.</p></blockquote><p>(Against the Jews)</p><h3>Blessed Jerome of Stridon,
    monk (c. 347–419)</h3><blockquote><p>kept repeating the verses just quoted down
    to the moment in which she breathed out her soul, but in a tone so low that we
    could scarcely hear what she said. <strong><mark>Raising her finger also to her
    mouth</mark> she made</strong> <strong><mark>the sign of the cross upon her lips</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/jerome-the-letters-of-st-jerome-4#HH-To-Eustochium">The
    Letters of St. Jerome, Letter CVIII</a>)</p><h2>5th century</h2><h3>Blessed Theodoret
    of Cyrrhus (c. 386–457)</h3><blockquote><p>After sharing the tortures inflicted
    on murderers, he was terribly scourged with stones and bits of lead about his
    very neck.[77] He went on board ship to sail, like the rest, <strong><mark>with
    the mark of the sacred cross upon his brow</mark></strong>; with none to aid and
    none to tempt him he was despatched to the copper mines of Phennesus.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/theodoret-the-ecclesiastical-history-4#HH-Narrative-of-events-at-Alexandria-in-the-time-of-Lucius-the-Arian-taken-from-a-letter-of-Petrus-Bishop-of-Alexandria">The
    Ecclesiastical History, Book IV, 19</a>)</p><blockquote><p>Marcellus forthwith
    hurried to the church, ordered water to be poured into a pail, and placed the
    water upon the divine altar. Then, bending his head to the ground, he besought
    the loving Lord in no way to give in to the usurped power of the demon, but to
    lay bare its weakness and exhibit His own strength, lest unbelievers should henceforth
    find excuse for greater wrong. With these and other like words <strong><mark>he
    made the sign of the cross over the water</mark></strong>, and ordered Equitius,
    one of his deacons, who was armed with faith and enthusiasm, to take the water
    and sprinkle it in faith, and then apply the flame. His orders were obeyed, and
    the demon, unable to endure the approach of the water, fled. Then the fire, affected
    by its foe the water as though it had been oil, caught the wood, and consumed
    it in an instant.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/theodoret-the-ecclesiastical-history-5#HH-Of-Marcellus-bishop-of-Apamea-and-the-idols-temples-destroyed-by-him">The
    Ecclesiastical History, Book V, 21</a>)</p><h2>6th century</h2><h3>St Gregory
    the Great (the Dialogist), pope of Rome (c. 540–604)</h3><blockquote><p>In the
    province of Valeria there lived a certain Martyrius, a great servant of God, and
    this is what he did as a sign of his great holiness. Once the brethren who lived
    with him were putting bread into the oven and forgot <strong><mark>to trace the
    sign of the cross upon it</mark></strong>, as was ordinarily done in that country
    upon the dough, which for that reason seemed as it were divided into four parts.
    The saint was present and noticed that the sign of the cross had not been <strong><mark>traced
    upon the bread</mark></strong>. When the bread had been put into the oven and
    covered with coals and ashes, the saint asked: “Why did you not trace the sign
    of the cross upon the dough?” And at once he traced <strong><mark>the sign of
    the cross with his finger</mark></strong> toward the place where the bread had
    been put under the coals. At this the bread gave forth such a crack as is heard
    when a large clay vessel bursts in the fire. When the finished bread was taken
    out of the oven, they saw upon it <strong><mark>the image of the sign of the cross</mark></strong>,
    produced not by touch but by faith.</p></blockquote><p>(The Dialogues, Book I,
    11)</p><h2>7th century</h2><h3>Anastasius of Sinai, monk (early 7th c. – after
    701)</h3><blockquote><p>9. Then the man of God asked them: “Of all that God has
    handed down to the Christians, what do you fear most?” The demons answered him:
    “The Christians in fact have three things that stand mightily against us. The
    first is what you partake of [at the Eucharist]; the second is <strong>what you
    <mark>hang on your neck</mark></strong>; the third is that you are washed [in
    the bath of rebirth].” By these three things the wicked demons meant Holy Communion,
    <strong><mark>the Honorable Cross</mark></strong>, and Holy Baptism. Then the
    man of God asked them: “Which of these three do you fear most?” They answered:
    “If you keep the power of what is partaken of [at the Eucharist], we cannot in
    any way come near a man or do him harm.”</p></blockquote><p>(Questions and Answers,
    Question 10a)</p><h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p><strong><mark>Whoever
    makes the sign of the cross confesses, without a word, the Lord Jesus Christ,
    who endured the cross, crucifixion and death for us and thereby redeemed us.</mark></strong>
    Your teacher shouts: confess Christ with your lips; but you should go up to him
    and press him: confess Christ with the sign of the cross. It is all one: confession
    there and here; only there — by the word, and here — by the deed. <strong><mark>The
    deed is stronger than the word</mark></strong>. He said to the one who refused
    to confess the Lord with his lips: ah, you are ashamed before men! <strong>Say
    to him in your turn: <mark>you too are ashamed to make the sign of the cross;
    but since it too is a confession, it turns out that you yourself are ashamed to
    confess the Lord before men.</mark></strong></p></blockquote><p>(Selected letters
    on sects and heresies, Letter 8)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
