- src: Страдания_за_Христа_святые_отцы
  path: Sufferings-for-Christ
  title: Sufferings for Christ
  menu:
    parent: Awaiting distribution
    title: Sufferings for Christ
    priority: 155
  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p>“And why have I also surrendered myself to death,
    to fire, to the sword, to the wild beasts? But,[in fact,] <strong>he who is near
    to the sword is near to God; he that is among the wild beasts is in company with
    God; provided only he be so in the name of Jesus Christ</strong>. I undergo all
    these things that I may suffer together with Him, He who became a perfect man
    inwardly strengthening me.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-4">To
    the Smyrnaeans, 4</a>)</p>

    '
