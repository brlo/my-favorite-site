  body: '<h2>1st century</h2><h3>Dionysius the Areopagite, hieromartyr († 96)</h3><blockquote><p>Then,
    <strong><mark>when we shall have become incorruptible and immortal</mark> and
    shall have been deemed worthy of the most blessed rest that belongs to Christ
    and <em><mark>always</mark></em><mark>, according to the Word, </mark><em><mark>be
    with the Lord</mark></em></strong> (1 Thess. 4:17), then we shall be filled with
    the visible theophany in the most pure visions which illumine us with the brightest
    radiance, as the disciples during that most divine Transfiguration, partaking
    with a dispassionate and immaterial mind of His intellectual light-giving and
    of the union that surpasses the mind, when in a manner unknown and blessed — in
    the most divine imitation of the supercelestial minds — we shall prove attainable
    to the most radiant rays; for, as the truth of the Oracles says, we shall be <em>equal
    to the angels</em> and <em>children of God, </em><strong><em><mark>being children
    of the resurrection</mark></em></strong> (Luke 20:36).</p></blockquote><p>(On
    the Divine Names)</p><h3>The grandsons of the apostle Jude, the brother of the
    Lord (before c. 98)</h3><p>In the second century Hegesippus records the words
    of the grandsons of the apostle Jude, the brother of the Lord:</p><blockquote><p><em>1.
    “Of the family of the Lord there were still </em><strong><em>living the grandchildren
    of Jude, who is said to have been the Lord’s brother according to the flesh.[143]</em></strong><em>
    Information was given that they belonged to the family of David, and they were
    brought to the Emperor Domitian by the Evocatus.[144] For Domitian feared the
    coming of Christ as Herod also had feared it.</em></p><p><em>2. And he asked them
    if they were descendants of David, and they confessed that they were. Then he
    asked them how much property they had, or how much money they owned. And both
    of them answered that they had only nine thousand denarii,[145] half of which
    belonged to each of them; and this property did not consist of silver, but of
    a piece of land which contained only thirty-nine acres, and from which they raised
    their taxes[146] and supported themselves by their own labor.[147]</em></p><p><em>3.
    Then they showed their hands, exhibiting the hardness of their bodies and the
    callousness produced upon their hands by continuous toil as evidence of their
    own labor.</em></p><p><em>4. </em><strong><em>And when they were asked <mark>concerning
    Christ and his kingdom, of what sort it was and where and when it was to appear</mark>,
    they answered that it was not a temporal nor an earthly kingdom, <mark>but a heavenly
    and angelic one</mark>, <mark>which would appear at the end of the world, when
    he should come in glory to judge the quick and the dead, and to give unto every
    one according to his works</mark></em></strong><em><mark>.</mark></em></p><p><em>5.
    Upon hearing this, Domitian did not pass judgment against them, but, despising
    them as of no account, he let them go, and by a decree put a stop to the persecution
    of the Church.</em></p><p><em>6. </em><strong><em>But when they were released
    they ruled the churches because they were witnesses[148] and were also relatives
    of the Lord.[149]</em></strong><em> And peace being established, they lived until
    the time of Trajan.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-3#HH-The-Relatives-of-our-Saviour">Eusebius
    of Caesarea, Church History, 3.20</a>)</p><h2>3rd century</h2><h3>Methodius of
    Olympus, bishop of Patara, hieromartyr<strong> </strong>(c. 260–312)</h3><blockquote><p>Let
    us then supply now the oil of good works abundantly, and of prudence, being purged
    from all corruption which would weigh us down; lest, while the Bridegroom tarries,
    our lamps may also in like manner be extinguished. For <strong>the delay is <mark>the
    interval which precedes the appearing of Christ</mark></strong>. <strong>Now the
    slumbering and sleeping of the virgins signifies <mark>the departure from life</mark></strong>;
    and <strong>the midnight is <mark>the kingdom of Antichrist</mark></strong>, during
    which the destroying angel passes over the houses. (Exod. xi., xii) But <strong>the
    cry which was made when it was said,[87] “Behold the bridegroom cometh, go ye
    out to meet him,” (Matt. 25:6) is <mark>the voice which shall be heard from heaven,
    and the trumpet, when the saints, all their bodies being raised, shall be caught
    up</mark>, and shall go on the clouds to meet the Lord. (1 Thess. 4:16–17)</strong>
    For it is to be observed that <strong>the word of God says, that after the cry
    <mark>all the virgins arose</mark>, <mark>that is, that the dead shall be raised
    after the voice which comes from heaven</mark></strong>, as also Paul intimates,
    (1 Thess. 4:16) that “the Lord Himself shall descend from heaven with a shout,
    with the voice of the archangel, and with the trump of God: and the dead in Christ
    shall rise first;” that is the tabernacles,[88] for they died, being put off by
    their souls. “Then we which are alive shall be caught up together with them” (<a
    href="https://bibleox.com/en/eng-nkjv/1sol/4/#L17">1 Thess. 4:17</a>), meaning
    our souls.[89] For <strong>we truly who are alive are <mark>the souls which, with
    the bodies, having put them on again, shall go to meet Him in the clouds</mark></strong>,
    bearing our lamps trimmed, not with anything alien and worldly, but like stars
    radiating the light of prudence and continence, full of ethereal splendour.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/methodius-the-banquet-of-the-ten-virgins-or-concerning-chastity#HH-What-the-Oil-in-the-Lamps-Means">The
    Banquet of the Ten Virgins, or Concerning Chastity, Discourse VI, Chapter IV</a>)</p><h2>4th
    century</h2><h3>Blessed Augustine of Hippo (354–430)</h3><blockquote><p>Thus all,
    without one exception, were dead in sins, whether original or voluntary sins,
    sins of ignorance, or sins committed against knowledge; and for all the dead there
    died the one only person who lived, that is, who had no sin whatever, in order
    that they who live by the remission of their sins should live, not to themselves,
    but to Him who died for all, for our sins, and rose again for our justification,
    that we, <strong>believing in Him who justifies the ungodly, and being justified
    from ungodliness or quickened from death, may be able to <mark>attain to the first
    resurrection which now is</mark></strong>. For in this first resurrection none
    have a part save those who shall be eternally blessed; <strong><mark>but in the
    second, of which He goes on to speak, all, as we shall learn, have a part, both
    the blessed and the wretched</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/qutD_The_City_of_God_6#HH-Chapter-6-What-is-the-First-Resurrection-and-What-the-Second">The
    City of God, Book XX, Chapter VI. What the First Resurrection Is, and What the
    Second</a>)</p><blockquote><p>But the apostle has said nothing here regarding
    the resurrection of the dead; but in his first Epistle to the Thessalonians he
    says, We would not have you to be ignorant brethren, concerning them which are
    asleep, 1 Thessalonians 4:13–16 etc. <strong>These words of the apostle most distinctly
    proclaim the <mark>future resurrection of the dead</mark>, when the Lord Christ
    <mark>shall come to judge the quick and the dead</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/qutD_The_City_of_God_6#HH-Chapter-20-What-the-Same-Apostle-Taught-in-the-First-Epistle-to-the-Thessalonians-Regarding-the-Resurrection-of-the-Dead">The
    City of God, Book XX, Chapter XX. What the Same Apostle Taught in the First Epistle
    to the Thessalonians Regarding the Resurrection of the Dead</a>)</p><h3>St Ephrem
    the Syrian, monk (c. 306–373)</h3><blockquote><p>the Gentiles, who have no resurrection,
    nor have any hope of the promised blessedness (1 Thess. 4:14). For if... we believe...
    in the resurrection of Christ, then we must believe also that God... will bring
    with Him, at His coming, those who have fallen asleep [reposed] in Jesus, that
    is, in the faith of Jesus. 1 Thess. 4:15. But this I say to you, brethren, not
    of myself, but from the word of our Lord, which is in the Gospel itself (Matt.
    24:30), that we who live, who remain until the coming of the Lord, do not... go
    before them by our flight upward, —<strong> we do not, evidently, go before the
    dead, who have already fallen asleep</strong>. For, at the descent 1 Thess. 4:16.
    of our Lord from heaven at the sound of the trumpet of the Archangel, before the
    righteous who are then alive will be furnished with new wings, — <strong>before
    this the resurrection of the dead in Christ will take place</strong>. 1 Thess.
    4:17. <strong>Then we who live shall... be caught up, — not before them, but with
    them</strong>, — and not without them, but together, in the clouds, to meet our
    Lord, — into the air [we shall be caught up]: and so always we all, remaining
    ever righteous, shall be with the Lord.</p></blockquote><p>(Commentary on 1 Thessalonians)</p><blockquote><p>Him
    Elijah longed for, and since he did not see the Son on earth, he redoubled his
    faith and purity, that he might ascend and behold Him in heaven. <strong>Him Moses
    and Elijah beheld</strong>; the meek one came up from the depths, the jealous
    zealot came down from the heights, and they saw the Son in their midst. <strong>They
    depicted the mystery of His last coming: <mark>Moses was the image of the dead,
    Elijah — of the living, who shall be caught up to meet Him when He comes</mark></strong>.
    The dead, because they tasted death, He will make first, and those who have not
    known burial shall be caught up last to meet Him.</p></blockquote><p>(Hymns on
    the Nativity)</p><h3>St Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p>The
    real and true life then is the Father, who through the Son in the Holy Spirit
    pours forth as from a fountain His heavenly gifts to all; and through His love
    to man, the blessings of the life eternal are promised without fail to us men
    also. We must not disbelieve the possibility of this, but having an eye not to
    our own weakness but to His power, we must believe; for with God all things are
    possible. And that this is possible, and that we may look for eternal life, Daniel
    declares, And of the many righteous shall they shine as the stars for ever and
    ever[196] (Dan. 12:3). And Paul says, <strong>And so shall we be ever with the
    Lord</strong> (1 Thess. 4:17): for the <strong><mark>being for ever with the Lord</mark>
    implies the life eternal. But most plainly of all the Saviour Himself says in
    the Gospel, And <mark>these shall go away into eternal punishment, but the righteous
    into life eternal</mark></strong> (Matt. 25:46).</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-3#HH-On-the-Words-And-in-One-Holy-Catholic-Church-and-in-the-Resurrection-of-the-Flesh-and-the-Life-Everlasting">Catechetical
    Lectures, 18</a>)</p><h3>St Gregory the Theologian, archbishop of Constantinople
    (c. 325–389)</h3><blockquote><p>I believe the words of the wise, that <strong>every
    fair and God-beloved soul, when, set free from the bonds of the body, it departs
    hence, at once enjoys a sense and perception of the blessings which await it</strong>,
    inasmuch as that which darkened it has been purged away, or laid aside—I know
    not how else to term it—and feels a wondrous pleasure <strong>and exultation,
    and goes rejoicing to meet its Lord, having escaped as it were from the grievous
    poison of life here</strong>, and shaken off the fetters which bound it and held
    down the wings of the mind, and so enters on the enjoyment of the bliss laid up
    for it, of which it has even now some conception. <strong><mark>Then, a little
    later, it receives its kindred flesh, which once shared in its pursuits of things
    above, from the earth which both gave and had been entrusted with it, and in some
    way known to God, who knit them together and dissolved them, enters with it upon
    the inheritance of the glory there</mark></strong>. And, as it shared, through
    their close union, in its hardships, so also it bestows upon it a portion of its
    joys, gathering it up entirely into itself, and becoming with it one in spirit
    and in mind and in God, the mortal and mutable being swallowed up of life. Hear
    at least how the inspired <strong>Ezekiel discourses of the knitting together
    of bones and sinews</strong>,[137] how after him Saint <strong>Paul speaks of
    the earthly tabernacle, and the house not made with hands, the one to be dissolved,
    the other laid up in heaven</strong>, <strong>alleging absence from the body to
    be presence with the Lord</strong>, (2 Cor. 5:1; 2 Cor. 5:6; Phil. 1:23) and bewailing
    his life in it as an exile, and therefore longing for and hastening to his release.
    Why am I faint-hearted in my hopes? Why behave like a mere creature of a day?
    <strong>I await the voice of the Archangel, (1 Thess. 4:16) the last trumpet,
    (1 Cor. 15:52) the transformation of the heavens, the transfiguration of the earth,
    the liberation of the elements, the renovation of the universe. (2 Pet. 3:10)
    Then shall I see Cæsarius himself</strong>, no longer in exile, no longer laid
    upon a bier, no longer the object of mourning and pity, but <strong>brilliant,
    glorious, heavenly</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-orations-1#HH-Panegyric-on-His-Brother-S-C%C3%A6sarius">Select
    Orations, Oration 7. Funeral Oration for his brother Cæsarius, spoken while his
    parents were still living</a>)</p><h2>8th century</h2><h3>St John of Damascus,
    monk (c. 675–754)</h3><blockquote><p>Afterwards, after many years, <strong><mark>Christ
    our God shall come in His terrible and unspeakable glory to judge the world</mark></strong>,
    at which the heavenly powers shall be seized with dread, and all the legions of
    Angels shall stand trembling before Him. Then, at the voice of the Archangel and
    at the trumpet of God, <strong><mark>all the dead shall rise and shall stand before
    His awesome throne</mark></strong>. The resurrection is the re-union of the soul
    with the body. And the body, though it has perished and crumbled away, shall rise
    incorrupt; and let it not seem incredible to you. There is nothing impossible
    in this: that a body, created in the beginning from the earth and turned again
    into the earth from which it was taken, should at the Creator’s command rise again
    incorrupt.</p></blockquote><p>(Barlaam and Ioasaph)</p><h2>19th century</h2><h3>St
    Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p>“Then we who are alive….”
    <strong>The dead shall rise; but what will become of the living</strong>, in correspondence
    with the resurrection of the latter — of this the Apostle says nothing here, hastening
    to say that with both the one and the other it will be together. In the Epistle
    to the Corinthians the Apostle writes that, <strong><mark>while the dead rise,
    the living will be changed into the same mode of being which those who have risen
    will receive</mark></strong>. “Behold, I tell you a mystery: we shall not all
    sleep, but we shall all be changed, in a moment, in the twinkling of an eye, at
    the last trumpet; for the trumpet shall sound, and the dead shall rise incorruptible,
    and we shall be changed” (1 Cor. 15:51-52). <strong><mark>After some have risen
    and others have been changed, and all have been gathered together into one, judgment
    will follow, and the separation of the good from the evil</mark></strong>. The
    Apostle does not touch upon this, for it did not enter into his purpose, and he
    the more quickly transfers attention to the last, most consoling moment for the
    faithful of this dread final event — to the meeting of the Lord and the everlasting
    abiding with Him. Having been made equal in the mode of being to the dead, the
    living will have with them the same advantage, to meet the Lord in the clouds.</p><p>“Together
    with them” — equally with them; nothing less than theirs will be lacking to us.
    “We shall be caught up” — we shall rise up into the place proper to those who
    have risen, in the renewed nature. This is said to indicate the swiftness of the
    movement, corresponding to the striving and irresistible desire of those who love
    the Lord to be with Him. “Caught up in the clouds.” <strong>The Lord ascended
    on the clouds (Acts 1:9), and He shall come again on the clouds (Acts 1:11; Matt.
    24:30); on the clouds He will also vouchsafe to believers to meet Him</strong>.
    “As the Master Himself ascended on a bright cloud, so those who believed in Him,
    both those raised from the dead and those still alive, borne on the clouds, shall
    meet the Judge of the universe, and shall abide with Him unto endless ages” (Theodoret).
    “Unto the meeting of the Lord.” <strong>The Lord shall descend from heaven to
    take His own; and they shall hasten from the earth to meet Him, like the virgins
    in the parable</strong> (Matt. 25:1-6). The place of the meeting is possible only
    in “the air,” up above, in the higher spheres of the atmosphere, at the transition
    into the heavenly dwellings. <strong><mark>But here they shall only meet, and
    not abide. They shall be with the Lord, but not in the air — there where He Himself
    is. He is at the right hand of the Father, and they around Him, or at His side,
    each in his own rank</mark></strong>. “And so shall we be ever with the Lord”
    — as partakers of His glory and blessedness. Having met the Lord, having drawn
    near, face to face, in blessed communion, we shall no longer be separated from
    Him. This is the summit of the hopes that inspire Christians! — Thus the Lord
    Himself promised: “I will come again and receive you unto Myself, that where I
    am, there ye may be also” (John 14:3). Of this He prayed to the Father: “Father,
    those whom Thou hast given Me, I will that where I am, they also may be with Me,
    that they may behold My glory which Thou hast given Me” (John 17:24). With this
    the holy Apostle comforted the believers in their sorrows for their faith: “if
    children, then heirs; heirs of God, and joint-heirs with Christ, if so be that
    we suffer with Him, that we may be also glorified together. For I reckon that
    the sufferings of this present time are not worthy to be compared with the glory
    which shall be revealed in us” (Rom. 8:17-18; likewise Col. 3:3-4; 2 Tim. 2:12).
    St John Chrysostom writes: “<strong><mark>If the Lord is about to descend, why
    shall we be caught up? — For the sake of honor</mark></strong>. For even when
    a king drives into a city, those who are in honor go out to meet him, while the
    condemned await the judge within; and when an affectionate father returns, the
    children and those worthy to be called his children ride out in a chariot to meet
    him, that they may see and greet him, while those of the household who have offended
    him remain at home. — We shall be borne on the chariot of our Father. For as He
    (the Father) received Him (the Lord) up on the clouds (Acts 1:9), so shall we
    be caught up on the clouds. Seest thou what honor awaits us! We shall meet Him
    Who descends and, what is most joyful of all, so we shall be with Him. “Who shall
    speak of the mightinesses of the Lord, and make all His praises to be heard?”
    (Ps. 105:2). What blessings has He vouchsafed to the human race! <strong><mark>The
    dead shall rise first, and thus all together shall meet Him</mark></strong>. Abel,
    who died before all, shall then come forth to meet Him together with those who
    remain alive, so that they will have no advantage in this; but he who has decayed,
    who has lain so many years in the earth, shall meet Him together with the living,
    as well as all the rest”.</p><p>Photius, as cited by Ecumenius, resolves the question
    that naturally arises here: why does the Apostle speak only of the lot of the
    believers on the last day, making no mention of the lot of the unbelievers and
    the evil. “Dost thou not observe that, in describing the resurrection, <strong>the
    Apostle makes no mention of those who are to rise for punishment and torments?
    — This he does, as I think, for three reasons. — First, he <mark>writes to the
    Thessalonians of the resurrection for their consolation</mark></strong>. For one
    who writes with the purpose of consoling it was unseemly to make mention of things
    bitter and grievous. By this he would rather have increased sorrow than given
    consolation. Second, <strong><mark>he wrote of the resurrection to the faithful</mark>,
    — and it was fitting not to make mention of those who are to be led away into
    torment</strong>. For the faithful, who live according to the Lord’s commandments,
    shall be subject to no punishment, but shall abide in eternal joy and eternal
    blessedness. Wherefore there was no need to make mention of the torments of others
    when writing to the faithful of the glory, the blessedness and the joys prepared
    for the faithful. Third, here he interprets the resurrection itself as it is in
    itself and for the sake of which it is. <strong><mark>God has appointed the resurrection
    to be for the salvation of men</mark></strong>, that they may taste of eternal
    blessings in unspeakable glory; while hell He prepared for the devil and his angels,
    as the Gospel says, and not for men. <strong>If some, by their own unrighteousness,
    choose instead of the blessings prepared for them that which was prepared for
    the devil, this happens apart from the desire of the Master who loves mankind</strong>.
    Wherefore the holy Apostle, writing of the essence of the resurrection itself
    and of the purpose for which its Creator appointed it, justly passes over in silence
    those who shall go into eternal torment”.</p></blockquote><p>(Commentary on 1
    Thessalonians)</p><h2>20th century</h2><h3>St Justin (Popović) of Ćelije, monk
    (1894–1979)</h3><blockquote><p>The Apostle Paul himself explains: Behold, I tell
    you a mystery: we shall not all die, but we shall all be changed, in a moment,
    in the twinkling of an eye, at the last trumpet; for the trumpet shall sound,
    and the dead shall rise incorruptible, and we shall be changed (1 Cor. 15:51-52).
    <strong>Those who will be alive at the Second Coming of the Saviour will be changed,
    their bodies will become incorruptible</strong>. In other words, everything corruptible
    that is in them will perish, and they will, in a manner incomprehensible to the
    human mind, escape the sentence of death and <strong><mark>will be changed like
    those whom the Lord will raise from the dead, since all will receive incorruptible
    bodies, and after the Last Judgment we shall all be caught up into heaven and
    shall always be with the Lord</mark></strong>. It is clear that we Christians
    know the path from death to immortality, from the temporal to the eternal. Everything
    on this path proceeds from the Risen Lord Jesus Christ and from our relationship
    to Him: from faith in Him and life according to His Gospel.</p><p>By faith in
    the Risen Lord and by the life that proceeds from this life-giving faith, we,
    while living on earth, are in actual fact in heaven. But our citizenship — our
    abode — is in heaven, from which also we wait for the Saviour, our Lord Jesus
    Christ, Who will transform our lowly body so that it may be conformed to His glorious
    body, by the power by which He works and subjects all things to Himself (Phil.
    3:20-21). Since what the Saviour, as God, gave to His risen and ascended body,
    He will give also to us, will give to all mankind, making them partakers of the
    divine nature (2 Pet. 1:4) through the grace-filled Gospel life in our Lord Jesus
    Christ, the Risen Saviour and only Conqueror of death, in Whom dwells all the
    fullness of the Godhead bodily (Col. 2:9), so that you may have fullness in Him
    (Col. 2:10).</p></blockquote><p>(Commentary on 1 Thessalonians)</p>'
