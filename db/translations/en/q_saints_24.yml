    title: The concept of fasting
    priority: 1
  body: "<h2>19th century</h2><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>The
    head <strong><mark>of the virtues</mark></strong> is prayer; their <strong><mark>foundation
    is fasting</mark></strong>.</p><p><strong><mark>Fasting is a constant moderation
    in food, with prudent discernment in it.</mark></strong></p><p>Proud man! you
    dream so much and so loftily <strong>of your mind, yet it is in complete and unceasing
    dependence on the stomach</strong>.</p><p><strong><mark>The law of fasting, being
    outwardly a law for the belly, is in essence a law for the mind.</mark></strong></p><p><strong>The
    mind, this king in man, if it wishes to enter into the rights of its autocracy
    and to keep them, must first of all submit itself to the law of fasting.</strong>
    Only then will it be constantly watchful and bright; only then can it rule over
    the desires of the heart and body; only in constant soberness can it study the
    commandments of the Gospel and follow them. The foundation of the virtues is fasting.</p><p>To
    the newly created man, brought into paradise, the one commandment was given —
    the commandment of fasting. Of course, one commandment was given because it was
    sufficient to preserve the primeval man in his innocence.</p><p>&lt;…&gt;</p><p>A
    wondrous union of fasting with prayer! <strong><mark>Prayer is powerless if it
    is not founded upon fasting, and fasting is fruitless if prayer is not built upon
    it</mark></strong>.</p><p><strong>Fasting detaches man from the passions of the
    flesh, while prayer struggles with the passions of the soul and, having overcome
    them, penetrates the whole make-up of man and cleanses him; into the cleansed
    rational temple it brings in God.</strong></p></blockquote><p>(Ascetic Experiences,
    vol. 1, On Fasting)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
