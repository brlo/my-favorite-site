    title: The Passion of Christ was foreordained and voluntary
    priority: 3
  body: <h2>4th century</h2><h3>St John Chrysostom, archbishop of Constantinople (c.
    347–407)</h3><blockquote><p>But let us give heed exactly to what He says, “I have
    power to lay down My life.” And who has not power to lay down his life? Since
    it is in the power of any that will, to kill himself. But He says it not so, but
    how? <strong><mark>I have in such a way the power to lay it down, that no one
    can effect this against My will</mark>. And this is a power not belonging to men</strong>;
    for we have no power to lay it down in any other way than by killing ourselves.
    And if we fall into the hands of men who plot against us, and have the power to
    kill us, we no longer are free to lay it down or not, but even against our will
    they take it from us. <strong><mark>Now this was not the case with Christ, but
    even when others plotted against Him, He had power not to lay it down</mark>.
    Having therefore said that, “No man takes it from Me,” He adds, “I have power
    to lay down My life,” that is, I alone can decide as to laying it down, a thing
    which does not rest with us, for many others also are able to take it from us.
    </strong>Now this He said not at first, (since the assertion would not have seemed
    credible,) but when He had received the testimony of facts, and when, having often
    plotted against Him, they had been unable to lay hold on Him, (for He escaped
    from their hands ten thousand times,) He then says, “No man takes it from me.”
    But if this be true, that other point follows, that He came to death voluntarily.
    And if this be true, the next point is also certain, that He can take it again
    when He will. For if the dying was a greater thing than man could do, doubt no
    more about the other. <strong><mark>Since the fact that He alone was able to let
    go His life, shows that He was able by the same power to take it again.</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Wp6k_Homilies_on_the_Gospel_of_John_6088#HH-60">Homilies
    on the Gospel of John, 60</a>)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
