    title: The priestly blessing
    priority: 3
  body: "<h2>18th century</h2><h3>St Tikhon of Zadonsk (Sokolov), bishop (1724–1783)</h3><blockquote><p>Those
    Christians act badly who <strong>begin to eat and drink and to take other good
    things without prayer and the blessing of God</strong>. Probably they do not know
    whence every good thing comes, and, not knowing the Giver, do not thank Him. Thus
    they become like the pagans, who do not know the true God and the Creator of all
    good things, or even like dumb beasts, which without any reasoning eat and drink
    whatever they see before them.</p></blockquote><p>(On the True Christianity, Book
    1)</p><h2>19th century</h2><h3>St Philaret (Drozdov), metropolitan of Moscow (1782–1867)</h3><blockquote><p>Turning
    to the circumstances of the Ascension of Jesus Christ into heaven, first of all
    we may <strong>call to mind the blessing which He then bestowed upon the apostles</strong>.
    The Evangelist Luke relates: “And it came to pass, while He blessed them, that
    He was parted from them and carried up into heaven” (Luke 24:51). This circumstance
    of His ascent into heaven and of His parting from His chosen ones the Lord Himself
    brings to their remembrance, speaking of the time when He will come in His glory
    and, meeting them again, will call them to the actual possession of His Kingdom:
    “Come, you blessed of My Father” (Matt. 25:34). What an infinite stream of Christ’s
    blessing opens before you, Christians! He sends a blessing and, not having finished
    it, ascends: “while He blessed them, that He was parted from them and carried
    up”. Thus, even having ascended, He still continues invisibly to bestow <strong>the
    blessing. It flows and descends without ceasing upon the apostles; through them
    it is poured out upon those whom they bless in the name of Jesus Christ; those
    who have received the blessing of Christ through the apostles spread it to others.
    And thus</strong> <strong>all who belong to the holy, catholic, apostolic church
    become partakers of the one blessing of Jesus Christ</strong> and of His Father,
    who has blessed “us with every spiritual blessing in the heavenly places in Christ”
    (Eph. 1:3); “the dew of Hermon, Descending upon the mountains of Zion” (Ps. 133:3)
    — this blessing of peace descends upon every soul that rises above the passions
    and lusts, above vanity and worldly cares; as an indelible seal it marks those
    who are Christ’s.</p></blockquote><p>(Words and Sermons)</p>"
