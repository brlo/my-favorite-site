  body: "<h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p><strong><mark>Whoever
    makes the sign of the cross confesses, without a word, the Lord Jesus Christ,
    who endured crucifixion and death for us, and thereby redeemed us.</mark></strong>
    Your teacher cries out: confess Christ with your lips; but you should go up to
    him and press him: confess Christ by the sign of the cross. It is all one: confession
    there and here; only there — by the word, and here — by the deed. <strong><mark>The
    deed is stronger than the word</mark></strong>. He said to him who refused to
    confess the Lord with his lips: ah! you are ashamed before men! <strong>Say to
    him as well: <mark>you too are ashamed to make the sign of the cross; but since
    it is likewise a confession, it turns out that you yourself are ashamed to confess
    the Lord before men.</mark></strong></p></blockquote><p>(Selected Letters on Sects
    and Heresies, Letter 8)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
