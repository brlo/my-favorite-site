- src: ZKVGwB6d_Состав_природы_человека
  path: The-composition-of-human-nature
  title: The composition of human nature
  menu:
    parent: The soul and the state of the departed
    title: The composition of human nature
    priority: 1
  body: '<h2>4th century</h2><h3>St Athanasius the Great, archbishop of Alexandria
    (c. 295–373)</h3><blockquote><p><strong>Firstly, then, the rational nature of
    the soul is strongly confirmed by its difference from irrational creatures. For
    this is why common use gives them that name, because, namely, the race of mankind
    is rational. </strong>Secondly, it is no ordinary proof, that man alone thinks
    of things external to himself, and reasons about things not actually present,
    and exercises reflection, and chooses by judgment the better of alternative reasonings.
    For the irrational animals see only what is present, and are impelled solely by
    what meets their eye, even if the consequences to them are injurious, while <strong>man
    is not impelled toward what he sees merely, but judges by thought what he sees
    with his eyes. Often for example his impulses are mastered by reasoning; and his
    reasoning is subject to after-reflection. But this alone is peculiar to mankind,
    and <mark>this is what is rational in the soul of mankind, by means of which it
    differs from the brutes, and shews that it is truly distinct from what is to be
    seen in the body.</mark> Often, for example, when the body is lying on the earth,
    man imagines and contemplates what is in the heavens.</strong></p><p>We add a
    further point to complete our demonstration for the benefit of those who shamelessly
    take refuge in denial of reason. <strong>How is it, that whereas the body is mortal
    by nature, man reasons on the things of immortality, and often, where virtue demands
    it, courts death? Or how, since the body lasts but for a time, does man imagine
    of things eternal, so as to despise what lies before him, and desire what is beyond?
    The body could not have spontaneously such thoughts about itself, nor could it
    think upon what is external to itself. For it is mortal and lasts but for a time.
    And it follows that that which thinks what is opposed to the body and against
    its nature must be distinct in kind. What then can this be, save a rational and
    immortal soul? <mark>Why, these things prove simply this, that the rational soul
    presides over the body</mark>. </strong>For the body is not even constituted to
    drive itself, but it is carried at the will of another, just as a horse does not
    yoke himself, but is driven by his master. Hence laws for human beings to practise
    what is good and to abstain from evil-doing, while to the brutes evil remains
    unthought of and undiscerned, because they lie outside rationality and the process
    of understanding.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-against-the-heathen-contra-gentes">Against
    the Heathen (Contra Gentes), §§31–32</a>)</p><h3>Blessed Augustine of Hippo, bishop
    (354–430)</h3><blockquote><p>And inasmuch as there are three things of which man
    consists,—namely, <strong><mark>spirit, soul, and body</mark></strong>,—which
    again are spoken of as <strong><mark>two, because frequently the soul is named
    along with the spirit</mark></strong>; for <strong><mark>a certain rational portion
    of the same</mark></strong>, of which beasts are devoid, is called spirit: the
    principal part in us is the spirit; next, the life whereby we are united with
    the body is called the soul; finally, the body itself, as it is visible, is the
    last part in us.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/augustine-a-treatise-on-faith-and-the-creed#HH-Of-the-Catholic-Church-the-Remission-of-Sins-and-the-Resurrection-of-the-Flesh">A
    Treatise on Faith and the Creed, ch. 10, 23</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  title_sub: Quotes of the Holy Fathers on the composition of human nature
  meta_desc: Quotes of the Holy Fathers on the composition of human nature
  update: true
- src: 560SPO2U_Место_где_пребывают_души_умерших
  path: The-place-where-the-souls-of-the-departed-abide
  title: The place where the souls of the departed abide
  menu:
    parent: The soul and the state of the departed
    title: The place where the souls of the departed abide
    priority: 4
  body: '<h2>1st century</h2><h3>Clement of Rome, hieromartyr († 101)</h3><blockquote><p><em>Through
    envy and jealousy, the greatest and most righteous pillars [of the Church] have
    been persecuted and put to death. Let us set before our eyes the illustrious apostles.
    </em><strong><em>Peter</em></strong><em>, through unrighteous envy, endured not
    one or two, but numerous labours and when he had at length suffered martyrdom,
    </em><strong><em><mark>departed to the place of glory due to him</mark></em></strong><em>.
    Owing to envy, </em><strong><em>Paul</em></strong><em> also obtained the reward
    of patient endurance, after being seven times thrown into captivity, compelled
    to flee, and stoned. After preaching both in the east and west, he gained the
    illustrious reputation due to his faith, having taught righteousness to the whole
    world, and come to the extreme limit of the west, and suffered martyrdom under
    the prefects. Thus </em><strong><em><mark>was he removed from the world, and went
    into the holy place</mark></em></strong><em>, having proved himself a striking
    example of patience. To these men who spent their lives in the practice of holiness,
    there is to be added </em><strong><em>a great multitude of the elect</em></strong><em>,
    who, having through envy endured many indignities and tortures, </em><strong><em>furnished
    us with a most excellent example</em></strong><em>. Through envy, those women,
    the Danaids and Dircae, being persecuted, </em><strong><em>after they had suffered
    terrible and unspeakable torments, finished the course of their faith with stedfastness,
    and though weak in body, <mark>received a noble reward</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-5">First Epistle to the Corinthians,
    ch. 5-6</a>)</p><blockquote><p><em>All the generations from Adam even unto this
    day have passed away; but </em><strong><em><mark>those who, through the grace
    of God, have been made perfect in love, now possess a place among the godly</mark></em></strong><em>,
    and shall be made manifest at the revelation of the kingdom of Christ.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-50">First Epistle to the Corinthians,
    ch. 50</a>)</p><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p><em>“And let no one, of things visible or invisible,
    </em><strong><em><mark>envy me that I should attain to Jesus Christ</mark></em></strong><em>”
    (To the Romans)</em></p></blockquote><blockquote><p><em>“…while I desire to belong
    to God, do not ye give me over to the world. </em><strong><em><mark>Suffer me
    to obtain pure light: when I have gone thither, I shall indeed be a man of God</mark></em></strong><em>.
    Permit me to be an imitator of the passion of my God. </em><strong><em>If any
    one has Him within himself, let him consider what I desire</em></strong><em>,
    and let him have sympathy with me, as knowing how I am straitened” (To the Romans)</em></p></blockquote><blockquote><p><em>“</em><strong><em>though
    I am alive while I write to you, yet I am eager to die</em></strong><em>. My love
    has been crucified, and there is no fire in me desiring to be fed; but </em><strong><em>there
    is within me a water that liveth and speaketh, <mark>saying to me inwardly, Come
    to the Father</mark></em></strong><em>” (To the Romans)</em></p></blockquote><blockquote><p><em>“If
    I am truly found to be one, I may also be called one, and only then can I be truly
    faithful, </em><strong><em>when the world shall no longer see me. Nothing visible
    is eternal. (“For the things which are seen are temporal, …but the things which
    are not seen are eternal”</em></strong><em> (2 Cor. 4:18).) </em><strong><em>Our
    God <mark>Jesus Christ appears in great glory when He is in the Father</mark></em></strong><em>”
    (To the Romans)</em></p></blockquote><blockquote><p><em>“It is good </em><strong><em><mark>to
    set out from the world unto God, that I may rise again to Him</mark></em></strong><em>”
    (To the Romans)</em></p></blockquote><blockquote><p><em>“But I have obtained mercy
    to be somebody, </em><strong><em>if I shall attain to God</em></strong><em>” (To
    the Romans)</em></p></blockquote><blockquote><p><em>“…that through your prayers
    I may </em><strong><em>attain to God</em></strong><em>.” (To the Smyrnaeans)</em></p></blockquote><blockquote><p><em>“My
    bonds, which I carry about with me for the sake of Jesus Christ (</em><strong><em>praying
    that I may attain to God</em></strong><em>)” (</em><a href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-12"><em>To
    the Trallians</em></a><em>)</em></p></blockquote><blockquote><p><em>“Be mindful
    of me in your prayers, that I may </em><strong><em>attain to God</em></strong><em>.”
    (To the Magnesians)</em></p></blockquote><blockquote><p><em>“…if indeed </em><strong><em>by
    means of suffering I may attain to God</em></strong><em>.” (To Polycarp)</em></p></blockquote><blockquote><p><em>“but
    it is difficult for me to </em><strong><em>attain to God</em></strong><em>, if
    ye spare me” (To the Romans)</em></p></blockquote><blockquote><p><em>“Suffer me
    to become food for the wild beasts, through whose instrumentality it will be granted
    me to </em><strong><em>attain to God</em></strong><em>.” (To the Romans)</em></p></blockquote><h2>2nd
    century</h2><h3>Polycarp of Smyrna, hieromartyr (69–155)</h3><blockquote><p><em>I
    exhort you all therefore to be obedient unto the word of righteousness and to
    practice all endurance, which also ye saw with your own eyes in the </em><strong><em>blessed
    Ignatius and Zosimus and Rufus, yea and in others also who came from among yourselves</em></strong><em>,
    as well as in </em><strong><em>Paul himself</em></strong><em> and </em><strong><em>the
    rest of the Apostles</em></strong><em>; being persuaded that </em><strong><em><mark>all
    these ran not in vain but in faith and righteousness, and that they are in their
    due place in the presence of the Lord</mark></em></strong><em>, with whom also
    they suffered.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Plk_Ph#HH-9">Epistle
    to the Philippians, ch. 9</a>)</p><h3>The community of Polycarp of Smyrna (2nd
    century)</h3><blockquote><p><em>“For he (Polycarp — tr.), having by his endurance
    overcome the unrighteous ruler in the conflict and so received the crown of immortality,
    he </em><strong><em><mark>rejoices in company with the Apostles and all righteous
    men, and glorifies</mark></em></strong><em> the Almighty God and Father, and blesses
    our Lord Jesus Christ, the savior of our souls and helmsman of our bodies and
    shepherd of the universal Church which is throughout the world.</em></p><p><em>&lt;…&gt;</em></p><p><em>We
    bid you God speed, brethren, while you walk by the word of Jesus Christ which
    is according to the Gospel; with Whom be glory to God for the salvation of His
    holy elect; even as the blessed Polycarp suffered martyrdom, </em><strong><em><mark>in
    whose footsteps may it be our lot to be found in the kingdom of Jesus Christ</mark></em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-19">The encyclical
    epistle of the Church at Smyrna on the martyrdom of Polycarp</a>)</p><h3>St Justin
    the Philosopher, martyr (c. 100–165)</h3><p>The souls of the righteous abide in
    a better place and behold God, while the souls of sinners suffer in another place.
    Justin tells of his conversion to Christianity and cites the words of a Christian
    elder:</p><blockquote><p><em>The Elder: But </em><strong><em>I do not say, indeed,
    that all souls die</em></strong><em>; for that were truly a piece of good fortune
    to the evil. What then? </em><strong><em><mark>The souls of the pious remain in
    a better place, while those of the unjust and wicked are in a worse</mark></em></strong><em>,
    waiting for the time of judgment. Thus some which have </em><strong><em><mark>appeared
    worthy of God</mark></em></strong><em> never die; but others are punished so long
    as God wills them to exist and to be punished</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-5">Dialogue
    with Trypho, ch. 5</a>)</p><p>Justin himself says:</p><blockquote><p><em>And whatever
    both philosophers and poets have said concerning the </em><strong><em><mark>immortality
    of the soul, or punishments after death</mark></em></strong><em>, or contemplation
    of things heavenly, or doctrines of the like kind, they have received such suggestions
    from the prophets as have enabled them to understand and interpret these things.
    And hence there seem to be seeds of truth among all men</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1">Apology 1</a>)</p><p>The
    souls of the martyrs depart to the Father and King of heaven:</p><blockquote><p><em>And
    he said nothing else in answer to Lucius than this: “You also seem to me to be
    such an one.” And when Lucius answered, “Most certainly I am,” he again ordered
    him also to be led away. </em><strong><em>And he professed his thanks, knowing
    that he was delivered from such wicked rulers, and was <mark>going to the Father
    and King of the heavens</mark></em></strong><em> (πρὸς τὸν πατέρα καὶ βασιλέα
    τῶν οὐρανῶν πορεύεσθαι).</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_2#HH-2">Apology
    2</a>)</p><p>Christians attain to life with God:</p><blockquote><p><em>And reckon
    ye that it is for your sakes we have been saying these things; for it is in our
    power, when we are examined, to deny that we are Christians; but we would not
    live by telling a lie. For, impelled by the desire of the eternal and pure life,
    </em><strong><em>we seek the abode that is with God, the Father and Creator of
    all, and <mark>hasten to confess our faith, persuaded and convinced as we are
    that they who have proved to God by their works that they followed Him, and loved
    to abide with Him</mark></em></strong><em> where there is no sin to cause disturbance,
    can obtain these things.</em></p><p><em>&lt;…&gt;</em></p><p><em>if men by their
    works show themselves worthy of this His design, </em><strong><em><mark>they are
    deemed worthy, and so we have received--of reigning in company with Him</mark>,
    being delivered from corruption and suffering</em></strong><em>. For as in the
    beginning He created us when we were not, so do we consider that, in like manner,
    those who choose what is pleasing to Him are, on account of their choice, </em><strong><em><mark>deemed
    worthy of incorruption and of fellowship with Him</mark></em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1">Apology 1</a>)</p><p>More
    on the sayings of St Justin: <a href="https://bibleox.com/ru/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D1%84%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D0%B2%D0%B5%D1%80%D0%B0_%D0%B2_%D0%BF%D0%BE%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%83%D1%8E_%D1%83%D1%87%D0%B0%D1%81%D1%82%D1%8C_%D1%81_%D0%91%D0%BE%D0%B3%D0%BE%D0%BC"
    lang="ru">article</a>.</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p><em>Wherefore
    the Church does in every place, because of that love which she cherishes towards
    God, </em><strong><em><mark>send forward, throughout all time, a multitude of
    martyrs to the Father</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-33">Against
    Heresies, Book IV, ch. 33, 9</a>)</p><blockquote><p><em>For as the Lord “went
    away in the midst of the shadow of death” (Ps. 23:4), where the souls of the dead
    were, yet afterwards arose in the body, and after the resurrection was taken up
    [into heaven], it is manifest that </em><strong><em>the souls of His disciples
    also, upon whose account the Lord underwent these things, shall go away into the
    invisible place allotted to them by God, and there remain until the resurrection,
    awaiting that event</em></strong><em>; then receiving their bodies, and rising
    in their entirety, that is bodily, just as the Lord arose, they shall come thus
    into the presence of God.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-31">Against
    Heresies, Book V, ch. 31, 2</a>)</p><p>More on the sayings of St Irenaeus: <a
    href="https://bibleox.com/ru/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D0%B2%D0%B5%D1%80%D0%B0_%D0%B2_%D0%BF%D0%BE%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%83%D1%8E_%D1%83%D1%87%D0%B0%D1%81%D1%82%D1%8C_%D1%81_%D0%91%D0%BE%D0%B3%D0%BE%D0%BC"
    lang="ru">article</a>.</p><h3>Tertullian (c. 155–220)</h3><blockquote><p><em>Accordingly,
    we get ourselves laughed at for proclaiming that God will one day judge the world.
    For, like us, the poets and philosophers set up a judgment-seat in the realms
    below. And if we threaten Gehenna, which is a reservoir of secret fire under the
    earth for purposes of punishment, we have in the same way derision heaped on us.
    For so, too, they have their Pyriphlegethon, a river of flame in the regions of
    the dead. And if </em><strong><em><mark>we speak of Paradise, the place of heavenly
    bliss appointed to receive the spirits of the saints</mark></em></strong><em>,
    severed from the knowledge of this world by that fiery zone as by a sort of enclosure,
    the Elysian plains have taken possession of their faith. Whence is it, I pray
    you have all this, so like us, in the poets and philosophers? The reason simply
    is, that they have been taken from our religion. But if they are taken from our
    sacred things, as being of earlier date, then ours are the truer, and have higher
    claims upon belief, since even their imitations find faith among you</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-apology#HH-47">Apology, ch. 47</a>)</p><h2>3rd
    century</h2><h3><strong>St Cyprian of Carthage, hieromartyr (c. 201–258)</strong></h3><blockquote><p><em>set
    down only those things which God speaks, wherewith Christ exhorts His servants
    to martyrdom. Those divine precepts themselves must be supplied, as it were, for
    arms for the combatants. Let them be the incitements of the warlike trumpet; let
    them be the clarion-blast for the warriors. Let the ears be roused by them; let
    the minds be prepared by them; let the powers both of soul and body be strengthened
    to all endurance of suffering. Let us only who, by the Lord’s permission, have
    given the first baptism (of water — tr.) to believers, also prepare each one for
    the second (of martyrdom — tr.); urging and teaching that this is a baptism greater
    in grace, more lofty in power, more precious in honour—a baptism wherein angels
    baptize—a baptism in which God and His Christ exult—</em><strong><em>a baptism
    (of martyrdom — tr.) after which no one sins any more—a baptism which completes
    the increase of our faith—</em></strong><em> </em><strong><em><mark>a baptism
    which, as we withdraw from the world, immediately associates us with God.</mark></em></strong><em>
    In the baptism of water is received the remission of sins, in the baptism of blood
    the crown of virtues. This thing is to be embraced and desired, and to be asked
    for in all the entreaties of our petitions, that we who are God’s servants should
    be also His friends.</em></p><p><em>&lt;…&gt;</em></p><p><em>Nor </em><strong><em>do
    the rewards of the divine promise attend those alone who are reproached and slain</em></strong><em>;
    but if the passion itself be wanting to the faithful, while their faith has remained
    sound and unconquered, and having forsaken and contemned all his possessions,
    the Christian has shown that he is following Christ, even he also is honoured
    by Christ among the martyrs, as He Himself promises and says: “There is no man
    that leaveth house, or land, or parents, or brethren, or wife, or children, for
    the kingdom of God’s sake, but shall receive seven times as much in this present
    time, and in the world to come eternal life.” (Luke 18:29–30) In the Apocalypse
    also He says the same thing: “And I saw,” saith he, “the souls of them that were
    slain for the name of Jesus and the word of God.” And when he had placed those
    who were slain in the first place, he added, saying: “And whosoever had not worshipped
    the image of the beast, neither had received his mark upon their forehead or in
    their hand;” all these </em><strong><em><mark>he joins together, as seen by him
    at one time in the same place</mark></em></strong><em>, and says, “And they lived
    and reigned with Christ.” (Rev. 20:4–5) He says that </em><strong><em><mark>all
    live and reign with Christ</mark>, not only who have been slain</em></strong><em>;
    but even whosoever, standing in firmness of the faith and in the fear of God,
    have not worshipped the image of the beast, and have not consented to his deadly
    and sacrilegious edicts. That we receive more as the reward of our suffering than
    what we endure here in the suffering itself, the blessed Apostle Paul proves;
    who by the divine condescension, being caught up into the third heaven and into
    paradise, testifies that he heard unspeakable words, who boasts that he saw Jesus
    Christ by the faith of sight…</em></p><p><em>&lt;…&gt;</em></p><p><em>Who, then,
    does not with all his powers labour to attain to such a glory that he may become
    the friend of God, that he may </em><strong><em><mark>at once rejoice with Christ,
    that after earthly tortures and punishments he may receive divine rewards</mark></em></strong><em>?
    If to soldiers of this world it is glorious to return in triumph to their country
    when the foe is vanquished, how much more excellent and greater is the glory,
    when the devil is overcome, </em><strong><em><mark>to return in triumph to paradise,
    and to bring back victorious trophies to that place whence Adam was ejected as
    a sinner</mark></em></strong><em>, after casting down him who formerly had cast
    him down; to offer to God the most acceptable gift—an uncorrupted faith, and an
    unyielding virtue of mind, an illustrious praise of devotion; </em><strong><em>to
    accompany Him when He shall come to receive vengeance from His enemies, to stand
    at His side when He shall sit to judge, to become co-heir of Christ, to be made
    equal to the angels; with the patriarchs, with the apostles, with the prophets,
    to rejoice in the possession of the heavenly kingdom</em></strong><em>! Such thoughts
    as these, what persecution can conquer, what tortures can overcome? The brave
    and stedfast mind, founded in religious meditations, endures; and the spirit abides
    unmoved against all the terrors of the devil and the threats of the world, when
    it is strengthened by the sure and solid faith of things to come. In persecutions,
    </em><strong><em>earth is shut up, but <mark>heaven is opened</mark></em></strong><em>;
    Antichrist is threatening, but Christ is protecting; death is brought in, but
    immortality follows; the world is taken away from him that is slain, but paradise
    is set forth to him restored; the life of time is extinguished, but the life of
    eternity is realized. What a dignity it is, and what a security, to go gladly
    from hence, </em><strong><em><mark>to depart gloriously in the midst of afflictions
    and tribulations; in a moment to close the eyes with which men and the world are
    looked upon, and at once to open them to look upon God and Christ!</mark></em></strong><em>
    Of such a blessed departure how great is the swiftness! You shall be </em><strong><em><mark>suddenly
    taken away from earth, to be placed in the heavenly kingdoms.</mark></em></strong><em>
    It behoves us to embrace these things in our mind and consideration, to meditate
    on these things day and night.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-exhortation-to-martyrdom-addressed-to-fortunatus">An
    Exhortation to Martyrdom, Addressed to Fortunatus</a>)</p><blockquote><p><em>I
    ask that there stand together before your eyes also – the examples of the sufferings
    of the Lord, the sacrifices, the rewards and the torments prepared, and what difference
    there is between them, look upon these and upon those; and you could not confess
    (Christ) if you did not know how much you would injure yourself if you denied
    (Him). </em><strong><em>The martyrs rejoice in heaven, while the fire consumes
    the enemies of the truth – the paradise of God is adorned with confessors, while
    the gehenna filled with those who have denied burns with eternal fire</em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>Thus,
    since those who triumph gain the victory, rising above these misfortunes, that
    one is not the victor whom, in his triumphal procession, empty ambition exalted
    or the crowd extolled, but the one whom, </em><strong><em>for his ardent love
    of the things of heaven, <mark>the Lord has numbered with His kingdom</mark></em></strong><em>.
    Therefore, important and worthy of honour is that one thing only which delivers
    from death, which imparts life and </em><strong><em><mark>grants an eternal kingdom
    with the saints</mark></em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><strong><em><mark>Upon
    a brief confession</mark> (of the name of Christ) the misfortunes cease, joy begins,
    <mark>the kingdom opens</mark>, dominion is made ready, punishment is left behind,
    death is cast out, life comes, and the opposing weapons of the restless enemy
    are destroyed. If there is a sin, it perishes – if there is a transgression, it
    vanishes.</em></strong></p><p><em>&lt;…&gt;</em></p><p><strong><em><mark>Behold
    – at the suffering of each one rejoice the martyrs, called before from this life;
    rejoice the heralds of all good things – the angels; in like manner rejoice the
    elect; the Lord rejoices over His warrior, Christ rejoices over the witness of
    His name.</mark></em></strong></p><p><em>&lt;…&gt;</em></p><p><em>if you cling
    with all your soul to the example of the suffering of the Lord and to the whole
    testimony of Christ, you will not fear to shed your blood; before martyrdom all
    things must fall silent. </em><strong><em>The glory of martyrdom is beyond price</em></strong><em>,
    its greatness boundless, its victory bright, its dignity renowned, its title priceless,
    its triumph endless; for it is as though with the very blood of Christ that he
    is adorned who is glorified by his confession.</em></p><p><em>&lt;…&gt;</em></p><p><em>the
    glory of martyrdom belongs to the promises of the Lord, is given from above, is
    received only by His appointment, and can neither be grasped by the mind nor expressed
    by word or by all the power of eloquence; but it will depend wholly upon your
    good will, upon your love, if only you wish to remember my words when </em><strong><em>the
    Lord begins to glorify martyrdom in your person</em></strong><em>. As it were
    </em><strong><em><mark>in a tender bosom you will dwell in the holy altar (heaven),
    in that great and most glorious habitation, you will live for ever, you will reign
    there (</mark></em></strong><a href="https://bibleox.com/en/eng-nkjv/heb/12/#L23"><strong><em><mark>Heb.
    12:23)</mark></em></strong></a><strong><em><mark>.</mark></em></strong><em> O,
    blessed are you, whose sins are forgiven, if only you ever sinned, imitating the
    Lord! Blessed are you, who from the beginning of the world have been sealed with
    the blood of the Lord, clothed in the white garment of grace and adorned with
    the shining robe! I behold already in my mind the glorious, divine spectacle –
    I say, I behold already – how the valiant host of Christ begins to enjoy its glory.
    There will stand before His face the exulting multitude of victors, and all that
    numerous host, illumined as it were by the risen sun, will receive power. O, that
    I, unworthy, might be counted worthy to see all this in very deed! Yet the Lord
    can accomplish this, for He will likely not reject </em><strong><em>your intercession</em></strong><em>.</em></p></blockquote><p>(The
    book of the praise of martyrdom, to Moses, Maximus and the other confessors)</p><blockquote><p><em>It
    is for him to wish to remain long in the world whom the world delights, whom this
    life, flattering and deceiving, invites by the enticements of earthly pleasure.
    Again, since the world hates the Christian, why do you love that which hates you?
    and why do you not rather follow Christ, who both redeemed you and loves you?</em></p><p><em>&lt;…&gt;</em></p><p><em>We
    should consider, dearly beloved brethren—we should ever and anon reflect that
    we have renounced the world, and are in the meantime living here as guests and
    strangers. Let us greet the </em><strong><em>day which assigns each of us to his
    own home, which <mark>snatches us hence, and sets us free from the snares of the
    world, and restores us to paradise and the kingdom</mark></em></strong><em>. Who
    that has been placed in foreign lands would not hasten to return to his own country?
    Who that is hastening to return to his friends would not eagerly desire a prosperous
    gale, that he might the sooner embrace those dear to him? </em><strong><em><mark>we
    regard paradise as our country—we already begin to consider the patriarchs as
    our parents: why do we not hasten and run, that we may behold our country, that
    we may greet our parents? There a great number of our dear ones is awaiting us,
    and a dense crowd of parents, brothers, children, is longing for us, already assured
    of their own safety, and still solicitous for our salvation.</mark></em></strong><em>
    To attain to their presence and their embrace, what a gladness both for them and
    for us in common! What a pleasure is there in the heavenly kingdom, without fear
    of death; and how lofty and perpetual a happiness with eternity of living! </em><strong><em><mark>There</mark></em></strong><em>
    the glorious company of </em><strong><em><mark>the apostles</mark></em></strong><em>;
    there the host of the rejoicing </em><strong><em><mark>prophets</mark></em></strong><em>;
    there the innumerable multitude of </em><strong><em><mark>martyrs</mark></em></strong><em>,
    crowned for the victory of their struggle and passion; there the triumphant </em><strong><em><mark>virgins</mark></em></strong><em>,
    who subdued the lust of the flesh and of the body by the strength of their continency;
    there are merciful men </em><strong><em><mark>rewarded</mark></em></strong><em>,
    who by feeding and helping the poor have done the works of righteousness—who,
    keeping the Lord’s precepts, have transferred their earthly patrimonies to the
    heavenly treasuries. To these, beloved brethren, let us hasten with an eager desire;
    let us crave quickly </em><strong><em><mark>to be with them, and quickly to come
    to Christ</mark></em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-on-the-mortality">On
    the Mortality</a>)</p><h2><strong>4th century</strong></h2><h3><strong>St Macarius
    the Great of Egypt, monk (c. 300–391)</strong></h3><blockquote><p><em>And as the
    Lord, taking His body, ascended on high and sat down at the right hand of the
    Majesty in the heights, so </em><strong><em><mark>now</mark></em></strong><em>
    the believing and </em><strong><em><mark>souls worthy of God pass over and will
    pass over into His Kingdom</mark></em></strong><em>, since He begets them from
    above by His Spirit, as the Lord says: “He that believeth in Him that sent Me...
    has passed from death unto life” (John 5:24). For the true believers, even while
    (yet) abiding on earth, serve the Lord in the heavenly places above. And He, sitting
    on high on the throne of His majesty, comes down below, resting on the souls of
    the saints as on thrones. For </em><strong><em>they are members, and His body
    is the whole Church of the saints; and He is the Head of this Church</em></strong><em>.
    As one soul abides in the whole body and all the members of the body are governed
    by it, so all the saints live in the Spirit of the Godhead and are governed by
    Him. And each member lives in the Hypostasis (of the Spirit) and in the divine
    Soul.</em></p><p><em>&lt;…&gt;</em></p><p><em>(Only) in this manner (can Christians)
    be made perfect and fit for </em><strong><em><mark>the Kingdom of Heaven, soaring
    up (thither) and borne aloft on the wings of the Spirit</mark></em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>As
    the body of Christ, mingled with the Godhead, is God; as iron cast into the fire
    is fire, and no one can touch or approach it without fearing to be destroyed or
    consumed (only fire with fire and glowing coal with glowing coal can remain unharmed),
    – so </em><strong><em><mark>every soul purified by the fire of the Spirit and
    become (itself) fire and spirit can be together with the pure body of Christ</mark></em></strong><em>.
    But a soul not initiated into this Spirit cannot draw near to the Divine, just
    as it cannot fix its gaze on that Divine Radiance or </em><strong><em>live in
    Him</em></strong><em>. For </em><strong><em>every being exists and lives there
    where it was born</em></strong><em>. Water creatures live in the water, since
    there they were born; birds soaring in the sky live in the air and die in the
    air. Like them is the </em><strong><em>life <mark>of the soul</mark>: the lofty
    heights of the Godhead are the air (of the souls) that have the wings of the Spirit,
    <mark>for there they were born</mark></em></strong><em>.</em></p><p><strong><em>7</em></strong><em>.
    As a charioteer, taking the reins in his hands, rules his horses and guides them
    at his own discretion and will, so the Lord on high rules and guides the creatures
    of heaven and earth according to His own discretion. For </em><strong><em><mark>He
    sits at the right hand of the Majesty (of the Father)</mark></em></strong><em>
    and governs the earthly (world), abiding and </em><strong><em><mark>living together
    with all the saints</mark></em></strong><em>; He (abides) on high and He (dwells)
    below; He is God and He is Man; He is the Living One and He is the Dead One; He
    is the Lord of all and He is the Servant of all; He is the Lamb and He is the
    Sacrifice; He is the Bull offered in sacrifice and He is the High Priest (of the
    sacrifices); He is the one enduring the passions and He is the impassible; He
    is the Bridegroom and He is the Bride; He is the Bridal Chamber and He is the
    Marriage Bed; </em><strong><em><mark>He is Paradise</mark> and He is the Tree
    of Life; <mark>He is the City of Jerusalem</mark></em></strong><em> and He is
    the Temple and the Holy of Holies; He is the Sea and He is the Universe; He is
    the Food of souls and He is the One Who is fed by the salvation of these souls;
    He is the Living Bread and He is the Water of Life; He is the “true Vine” (John
    15:1) and He is the Wine of Joy; He is the Pearl and He is the Treasury; He is
    the Net and He is the Warrior; He is the Breastplate (of the warrior) and He is
    the Victor; He is Circumcision and He is the Sabbath and the Law; </em><strong><em><mark>He
    is the Head of the Church of the saints</mark></em></strong><em> and He is the
    Mustard Seed (Matt. 13:31); He is the Vineyard and He is the Plough; He is Grace
    and He is Faith; He is the Marriage and He is the Wedding Garment; He is the Way
    and He is the Door; He is the “Sun of Righteousness” (Mal. 4:2) and </em><strong><em><mark>He
    is the Light of souls</mark></em></strong><em>; He is Life and </em><strong><em><mark>He
    is the Kingdom</mark></em></strong><em>; He is the Beginning and He is the End
    (Rev. 22:13); He is the One Who is above all, and He is the One Who has become
    all in all (1 Cor. 15:27; Eph. 1:23, 4:6; Col. 3:11).</em></p></blockquote><p>(Spiritual
    homilies, Homily 52. The ordering of the visible holy church is the image of the
    unseen and sanctified soul)</p><h3><strong>St Epiphanius of Cyprus, bishop (c.
    315–403)</strong></h3><blockquote><p><em>Further, </em><strong><em>as concerns
    the commemoration of the names of the departed, what can be more profitable than
    this, what more seasonable and more wonderful than the faith of living men, that
    <mark>those who have departed are alive and have not turned into non-existence,
    but exist and live with the Master</mark>, and that</em></strong><em> </em><strong><em>thus
    the pious teaching is handed down that there is hope for those who pray for their
    brethren, as for men gone on a journey</em></strong><em>. </em><strong><em>The
    prayer offered for them is profitable, though it does not blot out all faults,
    and it is profitable for this</em></strong><em>, that living in the world we often
    stumble both involuntarily and voluntarily, and in order that what is more perfect
    may be shown. </em><strong><em>We commemorate both the righteous and sinners —
    sinners, because we ask mercy for them from God</em></strong><em>, and the righteous,
    fathers, prophets, apostles, evangelists, martyrs, confessors, bishops and hermits
    and their whole order, so that, venerating the Lord Jesus Christ, we may separate
    Him from the order of men and pay Him homage, bearing in mind that the Lord is
    incomparable with any of men, even though each of men possessed countless deeds
    of righteousness.</em></p></blockquote><p>(Panarion, or the Medicine-chest, against
    Aerius, book 3, ch. 7)</p><h3><strong>St Gregory of Nyssa, bishop (c. 331–394)</strong></h3><p>In
    the church the bishop preaches a sermon. Here lie the relics of the saint; above
    them, an icon of the saint with the history of his martyrdom. There is talk of
    prayer to the saint and of his intercession for us.</p><blockquote><p><em>let
    us consider the present state of the saints, how beautiful and majestic it is.
    For </em><strong><em><mark>their soul, departed on high, abides in the place proper
    to it and, separated from the body, dwells together with those like it</mark></em></strong><em>;
    and the body, the honourable and undefiled organ, which in no wise impaired by
    its passions the incorruption of the soul that dwelt in it, is buried with great
    honour and reverence, is honourably laid in a sacred place, as it were some precious
    treasure kept until the time of the resurrection &lt;…&gt; If anyone is granted
    the happiness of being able to touch the very remains, how desirable this is,
    and what a gift of elevated prayer it is esteemed, they know who have experienced
    it and who were themselves animated by this desire. Those who behold them kiss
    them as the very body alive and blooming with life, bringing them close to the
    eyes, the lips, the ears, to all the senses; then, pouring out tears of reverence
    and heartfelt tenderness, </em><strong><em><mark>they offer the prayer of intercession</mark></em></strong><em>,
    as to the </em><strong><em><mark>martyr</mark></em></strong><em> himself seen
    whole before them, </em><strong><em><mark>beseeching him as the armour-bearer
    of God</mark></em></strong><em>, crying to him as to one who receives the gifts
    (of prayer) when he will. From all this know, pious people, that “precious in
    the sight of the Lord is the death of His saints” (Ps. 115:6). For one and the
    same is the body of all men, being composed of one and the same substance; but
    one dies a simple death and is cast down as it happens; another, graced with martyric
    suffering, is so highly honourable and desired by all, as we said above.</em></p><p><em>&lt;…&gt;</em></p><p><em>When,
    after many sufferings, (the martyr) appeared a man fully matured in confession
    and piety, the judicial sentence is pronounced over him and the command goes out
    to commit him to the fire; thus by the beautiful and blessed way he </em><strong><em><mark>departed
    to God</mark></em></strong><em>, and left to us an instructive memory of his contest,
    </em><strong><em>gathering the peoples, instructing the church, driving out demons,
    bringing down the peaceful angels, asking of God for us what is profitable, having
    made this place a clinic of divers diseases</em></strong><em>, a haven for those
    tossed by sorrows, an abundant treasury for the poor, a ready inn for travellers,
    </em><strong><em>a constant place of festival for those who keep the feasts</em></strong><em>.
    For, </em><strong><em>although we honour this day with annual festivals, yet the
    zeal of the multitude of those who hasten hither never ceases</em></strong><em>,
    but the road leading hither resembles a path strewn with ants; some go on before,
    others give place to those newly coming.</em></p><p><em>We, O blessed one, having
    by the mercy of the Creator completed the yearly round, </em><strong><em>have
    gathered for the celebration of thy feast the sacred assembly of those who love
    the martyrs</em></strong><em>, worshipping the common Master and </em><strong><em>keeping
    the victorious commemoration of thy contests</em></strong><em>. Do thou, the president
    of the feast (for to thee who hast called us we cry), draw near to us, </em><strong><em><mark>wherever
    thou mayst be — whether thou dwellest in the ethereal height or walkest about
    some heavenly vault, whether thou standest before the Master together with the
    ranks of the angels or, as a faithful servant, worshippest Him together with the
    Powers and Dominions</mark></em></strong><em>, – leaving the things above for
    a little time, </em><strong><em>come as an invisible friend to those who honour
    thee</em></strong><em>; look upon what is being done here, that thou mayest double
    thy thanksgiving to God, who for one suffering and for one pious confession hath
    rendered thee such rewards, and rejoice over (thy) blood and thy fiery torment;
    for as many then were the beholders of thy punishment, </em><strong><em>so many
    now are the ministers of thy honour</em></strong><em>. In many blessings have
    we need; </em><strong><em><mark>pray for the fatherland before the common King
    of all</mark></em></strong><em>; for the fatherland of a martyr is the land where
    he suffered, and his fellow-citizens and kinsfolk are those who buried him, in
    whose keeping is his body, who honour him. We foresee sorrows; we await dangers;
    the terrible Scythians, who were plotting war against us, are not far off; as
    a warrior </em><strong><em>fight for us, and as a martyr show (prayerful) boldness
    (towards God) for those who serve Him together with thee</em></strong><em>. Although
    thou hast passed from this life, yet </em><strong><em><mark>thou knowest the sufferings
    and needs of mankind</mark></em></strong><em>; ask peace for us, that these festivals
    may not cease, that the wild and unbridled barbarian may not rejoice over the
    temples and altars, that the defiler may not trample on the holy things. For we
    count </em><strong><em>even the fact that we have hitherto remained unharmed as
    thy good deed</em></strong><em>; we ask of thee safety also for the time to come.
    And if there should be need of greater intercession of prayer, </em><strong><em>gather
    the choir of thy brother martyrs and pray together with them all: may the prayers
    of many righteous loosen the sins of peoples and tribes</em></strong><em>. </em><strong><em>Remind
    of us Peter, awaken Paul, likewise also John the Theologian</em></strong><em>
    and the beloved disciple, </em><strong><em>that they may care for the churches</em></strong><em>
    which they founded, for which they bore chains, for which they faced dangers and
    death</em></p></blockquote><p>(Encomium on the great martyr Theodore)</p><h3><strong>St
    John Chrysostom, archbishop of Constantinople (c. 347–407)</strong></h3><blockquote><p><em>Not
    yet have seven days passed since we celebrated the sacred solemnity of Pentecost,
    and lo, again the choir of martyrs has overtaken us — or rather the host and army
    of martyrs, in nothing inferior to the host of angels which the patriarch Jacob
    saw (Gen. 32:2), but like it and equal to it. Martyrs and angels are distinguished
    only by their names, but are joined in their deeds: </em><strong><em><mark>the
    angels dwell in heaven, and the martyrs also</mark></em></strong><em>; the former
    are not subject to old age and are immortal, and the martyrs will have the same.
    But those received a bodiless nature. What then? The martyrs too, though clothed
    in body, are immortal — or, better still, before immortality death for Christ
    adorns their bodies more than immortality.</em></p></blockquote><p>(In praise
    of the saints, 19)</p>'
