  body: "<h2>4th century</h2><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>Whoever comes here [to the church] with faith
    and zeal <strong>departs with countless treasures</strong>; as soon as he opens
    his lips, he at once fills those present with all fragrance and spiritual riches;
    and even if countless misfortunes overtake him, he bears everything easily, having
    received here from the divine Scriptures sufficient encouragement to patience
    and to the love of wisdom. And as one who stands constantly upon a rock laughs
    at the waves, so one who takes part constantly in the (church) assemblies and
    is watered by the divine sayings, having established himself as though on the
    rock of right judgment about things, will be carried away by nothing human, having
    risen above the pressure of worldly affairs. <strong>Having received great <mark>benefit
    and consolation of soul not only from the instruction, but also from the prayer,
    and from the fathers’ blessing, and from the common assembly, and from the love
    of the brethren, and from much else</mark>, he thus returns, bringing home countless
    blessings.</strong></p></blockquote><p>(Encomium on the Holy Martyr Lucian, delivered
    7 January 387)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
