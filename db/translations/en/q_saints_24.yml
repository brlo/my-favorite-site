- src: Pm2C_Смирение_смиренномудрие
  path: Humility
  title: Humility (humblemindedness)
  menu:
    parent: Awaiting distribution
    title: Humility (humblemindedness)
    priority: 1
  body: '<h2>4th century</h2><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>“Knowing therefore these things, beloved <strong>even
    if we should have mounted to the very pinnacle of virtue, let us consider ourselves
    last of all</strong>; having learned that pride is able to cast down even from
    the heavens themselves him who takes not heed, and humbleness of mind to bear
    up on high from the very abyss of sins him who knows how to be sober. For this
    it was that placed the publican before the Pharisee; whereas that, pride I mean
    and an overweening spirit, surpassed even an incorporeal power, that of the devil;
    while humbleness of mind and the acknowledgment of his own sins committed brought
    the robber into Paradise before the Apostles.</p><p>…</p><p><strong>For humbleness
    of mind is the foundation of the love of wisdom which pertains to us. Even if
    thou shouldest have built a superstructure of things innumerable; even if almsgiving,
    even if prayers, even if fastings, even if all virtue; unless this have first
    been laid as a foundation, all will be built upon it[8] to no purpose and in vain;
    and it will fall down easily</strong>, like that building which had been placed
    on the sand.[9] For there is no one, no one of our good deeds, which does not
    need this; there is no one which separate from this will be able to stand. But
    even if thou shouldest mention temperance, even if virginity, even if despising
    of money, even if anything whatever, all are unclean and accursed and loathsome,
    humbleness of mind being absent. Everywhere therefore let us take her with us,[10]
    in words, in deeds, in thoughts, and with this let us build these (graces).”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-homily-concerning-lowliness-of-mind#HH-Concerning-Lowliness-of-Mind">Homily
    Concerning Lowliness of Mind</a>)</p>

    '
