- src: молитва-Иисусу-Христу-цитаты-святых
  path: Prayer-to-Jesus-Christ
  title: Prayer to Jesus Christ
  menu:
    parent: Awaiting distribution
    title: Prayer to Jesus Christ
    priority: 40
  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p>“If <strong>Jesus Christ shall graciously permit
    me through your prayers</strong>, and if it be His will, I shall, in a second
    little work which I will write to you, make further manifest to you [the nature
    of] the dispensation of which I have begun [to treat], with respect to the new
    man, Jesus Christ, in His faith and in His love, &lt;…&gt;”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-20">To the Ephesians</a>)</p><h2>2nd
    century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p>“For
    we do continually <strong>beseech God by Jesus Christ</strong> to preserve us
    from the demons which are hostile to the worship of God, and whom we of old time
    served, in order that, after our conversion by Him to God, we may be blameless.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-30">Dialogue
    with Trypho, 30</a>)</p><h2>3rd century</h2><h3>Anthony the Great, monk (c. 251–356)</h3><blockquote><p>My
    son, water your bed with your tears and <strong>pray to the Lord Jesus Christ</strong>,
    that He may blot out your sins, <em>renew a steadfast spirit within you</em> (Ps.
    51:10), send down upon you strength for the doing of your good deeds, and give
    you His everlasting Kingdom as an inheritance. To Him, as to our Creator and Saviour,
    glory and honour ought to be ascribed, and worship ought to be offered, together
    with the Father and the Holy Spirit, now and ever, and unto ages of ages.</p></blockquote><p>(Spiritual
    Instructions)</p><blockquote><p>If, to the good deeds that have been set before
    you in these instructions, you wish to add other good deeds, then perform them
    and <strong>give thanks unceasingly to the Lord Jesus Christ</strong>, whose glory
    is eternal. Amen.</p></blockquote><p>(Various Instructions to His Children, the
    Monks)</p><h2>4th century</h2><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>Forasmuch then as they are in a sort of senseless
    state, being turned to dead men, let us in their behalf <strong>draw nigh unto
    Jesus, let us entreat Him</strong> to raise them up, let us take away the stone,
    let us loosen the grave clothes.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-gospel-of-saint-matthew-4#HH-Matthew-VIII-14-15">Homily
    27 on the Gospel of Saint Matthew</a>)</p><h3>Blessed Jerome of Stridon, monk
    (c. 347–419)</h3><blockquote><p><strong>Let us pray to Jesus</strong>, that neither
    in the present nor in the future age He may uncover our thighs and our hinder
    parts, but that He may blot out all our unrighteousnesses and not disclose all
    our transgressions.</p></blockquote><p>(Six Books of Commentary on the Prophet
    Jeremiah)</p>

    '
