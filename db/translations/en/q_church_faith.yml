  - src: апостольская-вера
    path: Ap4f_The_Apostolic_Faith
    title: The Apostolic Faith
    meta_desc: Bible quotes about the necessity of the apostolic faith in Jesus Christ
    menu: { parent: Church/Faith, title: The Apostolic Faith, priority: 1 }
    body: |-
      <p>The Lord Jesus Christ speaks of faith in Him according to the word of the apostles:</p><blockquote><p>“And for their sakes I sanctify Myself, that they also may be sanctified by the truth. I do not pray for these alone, but also <strong>for those who will believe in Me <mark>through their word</mark>; that they all may be one</strong>, as You, Father, are in Me, and I in You; that they also may be one in Us, that the world may believe that You sent Me” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L19-21">John. 17:19-21</a>)</p></blockquote><p>The apostles repeatedly pointed out the necessity of keeping the faith handed down once: [<a href="https://bibleox.com/en/en/w/Tr4n_Holy_Tradition/">Tradition</a>] *This page is awaiting revision</p>

  - src: вера-во-Христа-для-всех-народов
    path: Fa6g_Faith_in_Christ_for_All
    title: Faith in Christ for All
    meta_desc: Bible quotes about the apostolic faith in Jesus Christ and salvation through this faith for all nations
    menu: { parent: Church/Faith, title: Faith in Christ for All, priority: 2 }
    body: |-
      <h2>All Nations Are Called to Faith in Christ — Indications in the New Testament</h2><p>Christ sends the apostles to preach the Gospel to all nations, tribes, speaking any language, to the whole world:</p><blockquote><p>“<strong>Go therefore and make disciples of all the nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all things that I have commanded you</strong>; and lo, I am with you always, even to the end of the age. Amen” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L19-20">Matt. 28:19-20</a>)</p></blockquote><blockquote><p>“Through Him we have received grace and apostleship <strong>for obedience to the faith among all nations for His name</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L5">Rom. 1:5</a>)</p></blockquote><blockquote><p>“Now to Him who is able to establish you according to my <strong>gospel</strong> and the <strong>preaching</strong> of Jesus Christ, according to the revelation of the mystery kept secret since the world began but now made manifest, and by the prophetic Scriptures <strong>made known to all nations</strong>, according to the commandment of the everlasting God, <strong>for obedience to the faith</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L25-26">Rom. 16:25-26</a>)</p></blockquote><blockquote><p>“And <strong>this gospel of the kingdom will be preached in all the world as a witness to all the nations</strong>, and then the end will come” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L14">Matt. 24:14</a>)</p></blockquote><blockquote><p>“Then I saw another angel flying in the midst of heaven, having the everlasting gospel <strong>to preach to those who dwell on the earth — to every nation, tribe, tongue, and people</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L6">Rev. 14:6</a>)</p></blockquote><h2>All Nations Are Called to Faith in Christ — Indications in the Old Testament</h2><p>The promise to Abraham that in his seed (through one of his descendants) all nations would be blessed:</p><blockquote><p>“In your seed <strong>all the nations</strong> of the earth shall be blessed, because you have obeyed My voice” (<a href="https://bibleox.com/en/eng-nkjv/gen/22/#L18">Gen. 22:18</a>)</p></blockquote><p>Prophecies that all nations will turn to the true God:</p><blockquote><p>“<strong>All nations</strong> whom You have made shall come and worship before You, O Lord, and shall glorify Your name” (<a href="https://bibleox.com/en/eng-nkjv/ps/86/#L9">Ps. 86:9</a>)</p></blockquote><blockquote><p>“Yes, all kings shall fall down before Him; <strong>all nations</strong> shall serve Him” (<a href="https://bibleox.com/en/eng-nkjv/ps/72/#L11">Ps. 72:11</a>)</p></blockquote><blockquote><p>“His name shall endure forever; His name shall continue as long as the sun. And <strong>men shall be blessed in Him; all nations</strong> shall call Him blessed” (<a href="https://bibleox.com/en/eng-nkjv/ps/72/#L17">Ps. 72:17</a>)</p></blockquote><blockquote><p>“Praise the LORD, <strong>all you Gentiles</strong>! Laud Him, all you peoples!” (<a href="https://bibleox.com/en/eng-nkjv/ps/117/#L1">Ps. 117:1</a>)</p></blockquote><blockquote><p>“It shall be that I will gather <strong>all nations and tongues</strong>; and they shall come and see My glory. I will set a sign among them; and those among them who escape I will send to the nations: to Tarshish and Pul and Lud, who draw the bow, and Tubal and Javan, to the coastlands afar off who have not heard My fame nor seen My glory. And they shall declare My glory among the Gentiles. Then they shall bring all your brethren for an offering to the LORD <strong>out of all nations</strong>, on horses and in chariots and in litters, on mules and on camels, to My holy mountain Jerusalem, says the LORD, as the children of Israel bring an offering in a clean vessel into the house of the LORD. <strong>And I will also take some of them for priests</strong> and Levites, says the LORD” (<a href="https://bibleox.com/en/eng-nkjv/is/66/#L18-21">Is. 66:18-21</a>)</p></blockquote><blockquote><p>“Look to Me, and <strong>be saved, all you ends of the earth</strong>! For I am God, and there is no other” (<a href="https://bibleox.com/en/eng-nkjv/is/45/#L22">Is. 45:22</a>)</p></blockquote><blockquote><p>“I will also give You as a light to the Gentiles, that <strong>You should be My salvation to the ends of the earth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/49/#L6">Is. 49:6</a>)</p></blockquote><blockquote><p>“That Your way may be known on earth, <strong>Your salvation among all nations</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/67/#L2">Ps. 67:2</a>)</p></blockquote><blockquote><p>“Then to Him was given dominion and glory and a kingdom, that <strong>all peoples, nations, and languages</strong> should serve Him. His dominion is an everlasting dominion, which shall not pass away, and His kingdom the one which shall not be destroyed” (<a href="https://bibleox.com/en/eng-nkjv/dan/7/#L14">Dan. 7:14</a>)</p></blockquote><blockquote><p>“Declare His glory among the nations, His wonders <strong>among all peoples</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1par/16/#L24">1 Chr. 16:24</a>)</p></blockquote><blockquote><p>“that <strong>all the peoples</strong> of the earth may know that the LORD is God; there is no other” (<a href="https://bibleox.com/en/eng-nkjv/3ts/8/#L60">1 Kin. 8:60</a>)</p></blockquote><blockquote><p>“and I will shake all nations, and <strong>they shall come to the Desire of All Nations</strong>, and I will fill this temple with glory, says the LORD of hosts” (<a href="https://bibleox.com/en/eng-nkjv/ag/2/#L7">Hag. 2:7</a>)</p></blockquote><blockquote><p>“For as the earth brings forth its bud, as the garden causes the things that are sown in it to spring forth, so <strong>the Lord GOD will cause righteousness and praise to spring forth before all the nations</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/61/#L11">Is. 61:11</a>)</p></blockquote><h2>The Faiths of Other Nations Are Not Saving</h2><p>The apostolic faith in Jesus Christ is saving. The faiths of other nations are not saving:</p><blockquote><p>“who [God] in bygone generations <strong>allowed all nations to walk in their own ways</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/14/#L16">Act. 14:16</a>)</p></blockquote><p>More: <a href="https://bibleox.com/en/en/w/Mrqu_God_is_one/">the gods of other nations are not gods</a></p><p>At the same time, the apostolic faith in Jesus Christ and salvation by this faith are open to all people without exception.</p>

  - src: суд
    path: Jd5h_The_Judgment
    title: The Judgment
    menu: { parent: Church/Faith, title: The Judgment, priority: 5 }
    body: |-
      <h2>Jesus Christ Will Judge All People at the Last Judgment</h2><blockquote><p>“For <strong>the Son of Man</strong> will come in the glory of His Father with His angels, and then <strong>He will reward each according to his works</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27">Matt. 16:27</a>)</p></blockquote><blockquote><p>“When <strong>the Son of Man</strong> comes in His glory, and all the holy angels with Him, then He will sit on the throne of His glory. All the nations will be gathered before Him, and <strong>He will separate them one from another</strong>, as a shepherd divides his sheep from the goats” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32">Matt. 25:31-32</a>)</p></blockquote><blockquote><p>“For the Father judges no one, but <strong>has committed all judgment to the Son</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L22">John. 5:22</a>)</p></blockquote><blockquote><p>“how God anointed <strong>Jesus of Nazareth</strong> with the Holy Spirit and with power, who went about doing good and healing all who were oppressed by the devil &lt;...&gt; And He commanded us to preach to the people, and to testify that <strong>it is He who was ordained by God to be Judge of the living and the dead</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L38,42">Act. 10:38,42</a>)</p></blockquote><blockquote><p>“because He has appointed a day on which He will <strong>judge the world</strong> in righteousness <strong>by the Man whom He has ordained</strong>. He has given assurance of this to all <strong>by raising Him from the dead</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/17/#L31">Act. 17:31</a>)</p></blockquote><blockquote><p>“For we must all appear before <strong>the judgment seat of Christ</strong>, that each one may receive the things done in the body, according to what he has done, whether good or bad” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><blockquote><p>“I charge you therefore before <strong>God and the Lord Jesus Christ, who will judge the living and the dead</strong> at His appearing and His kingdom” (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L1">2 Tim. 4:1</a>)</p></blockquote><h2>All Are Subject to Judgment</h2><blockquote><p>“For <strong><mark>we must all</mark> appear before the judgment seat of Christ,</strong> that each one may receive the things done in the body, according to what he <strong>has done</strong>, <strong>whether good or bad</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><blockquote><p>“But why do you judge your brother? Or why do you show contempt for your brother? For <strong><mark>we shall all</mark> stand before the judgment seat of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L10">Rom. 14:10</a>)</p></blockquote><blockquote><p>“So speak and so <strong><mark>do as those who will be judged</mark></strong> by the law of liberty” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L12">James. 2:12</a>)</p></blockquote><blockquote><p>“For <strong>God will bring <mark>every work</mark> into judgment</strong>, including every secret thing, <strong>whether good or evil</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ekl/12/#L14">Eccl. 12:14</a>)</p></blockquote><blockquote><p>“When <strong>the Son of Man</strong> comes in His glory, and all the holy angels with Him, then <strong>He will sit on the throne</strong> of His glory. <strong><mark>All the nations</mark> will be gathered before Him</strong>, and <strong>He will <mark>separate them one from another</mark></strong>, as a shepherd divides <strong>his <mark>sheep from the goats</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32">Matt. 25:31-32</a>)</p></blockquote><h2>Judgment Will Begin with the Church</h2><blockquote><p>“For <strong>the time has come for judgment to begin <mark>at the house of God</mark></strong>; and if <strong><mark>it begins with us first</mark></strong>, what will be the end of those who do not obey the gospel of God? Now ‘If <strong>the righteous one is scarcely saved</strong>, where will the ungodly and the sinner appear?’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18">1 Pet. 4:17-18</a>)</p></blockquote><blockquote><p>“But with me <strong>it is a very small thing that I should be judged by you or by a human court. In fact, <mark>I do not even judge myself</mark></strong>. For I know of nothing against myself, yet <strong>I am not justified by this; but <mark>He who judges me is the Lord</mark></strong>. Therefore <strong>judge nothing before the time</strong>, until the Lord comes, who will both bring to light the hidden things of darkness and reveal the counsels of the hearts. Then each one’s praise will come from God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L3-5">1 Cor. 4:3-5</a>)</p></blockquote><h2>Christ Will Judge in a Person What Was Done During Life in the Body</h2><blockquote><p>“For we must all appear before the judgment seat of Christ, that each one may <strong>receive the things <mark>done in the body</mark>, according to what he has done</strong>, whether good or bad” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><p>The judgment is made on the basis of earthly deeds done in the body:</p><blockquote><p>“Then He will also say to those on the left hand, ‘<strong>Depart from Me, you cursed, into the everlasting fire prepared for the devil and his angels: for I was hungry and you gave Me no food</strong>; I was thirsty and you gave Me no drink; I was a stranger and you did not take Me in, naked and you did not clothe Me, sick and in prison and you did not visit Me.’ Then they also will answer Him, saying, ‘Lord, when did we see You hungry or thirsty or a stranger or naked or sick or in prison, and did not minister to You?’ Then He will answer them, saying, ‘Assuredly, I say to you, <strong>inasmuch as you did not do it to one of the least of these, you did not do it to Me.’ And these will go away into everlasting punishment, but the righteous into eternal life</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L41-46">Matt. 25:41-46</a>)</p></blockquote>

  - src: бездетность
    path: Ch7i_Childlessness
    title: Childlessness
    meta_desc: Bible quotes about the attitude to childlessness
    menu: { parent: Church/Faith, title: Childlessness, priority: 7 }
    body: |-
      <p>This speaks of those who want to have children but cannot because of barrenness:</p><blockquote><p>“For <strong>blessed is the barren woman</strong> who is undefiled, who has not entered into a sinful union; <strong>she will have fruit when God examines souls</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/3/#L13">Wis. 3:13</a>)</p></blockquote><blockquote><p>“Better than this is <strong>childlessness with virtue</strong>, for <strong>in the memory of virtue is immortality, because it is known both by God</strong> and by mortals” (<a href="https://bibleox.com/en/en-nrsv/prs/4/#L1">Wis. 4:1</a>)</p></blockquote>

  - src: предопределение
    path: Pd9j_Predestination_Fate
    title: Predestination (Fate)
    meta_desc: Bible quotes about predestination, or in other words, fate
    menu: { parent: Church/Faith, title: Predestination (Fate), priority: 8 }
    body: |-
      <h2>God Desires All People to Be Saved</h2><blockquote><p>“For this is good and acceptable in the sight of <strong><mark>God our Savior, who <u>desires</u> all men to be saved</mark></strong> and to come to the knowledge of the truth” (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L3-4">1 Tim. 2:3-4</a>)</p></blockquote><blockquote><p>“Or do you despise the riches of His goodness, forbearance, and longsuffering, not knowing that <strong><u><mark>the goodness of God leads</mark></u><mark> you </mark><u><mark>to repentance</mark></u></strong>? <strong><mark>But in accordance with your hardness and your impenitent heart </mark><u><mark>you are treasuring up for yourself wrath</mark></u><mark> in the day of wrath</mark></strong> and revelation of the righteous judgment of God, who ‘will render to each one according to his deeds’: eternal life to those who by patient continuance in doing good seek for glory, honor, and immortality; but to those who are self-seeking and do not obey the truth, but obey unrighteousness — indignation and wrath” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L4-8">Rom. 2:4-8</a>)</p></blockquote><h2>Salvation Does Not Happen by Force, but Is Opened to Those Who Seek</h2><blockquote><p>“But without faith it is impossible to please Him, for he who comes to God must believe that He is, and that <strong><mark>He is a rewarder of those who diligently seek Him</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L6">Heb. 11:6</a>)</p></blockquote><blockquote><p><em>“</em><strong><em>I sought the LORD, and He heard me</em></strong><em>, and delivered me from all my fears. </em><strong><em><mark>They looked to Him and were radiant</mark></em></strong><em>, and their faces were not ashamed” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/34/#L4-5"><em>Ps. 34:4-5</em></a><em>)</em></p></blockquote><blockquote><p><em>“I love those who love me, and </em><strong><em><mark>those who seek me diligently will find me</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/pr/8/#L17"><em>Prov. 8:17</em></a><em>)</em></p></blockquote><blockquote><p><em>“for the LORD searches all hearts and understands all the intent of the thoughts. </em><strong><em><mark>If you seek Him, He will be found by you</mark></em></strong><em>; but if you forsake Him, He will cast you off forever” (</em><a href="https://bibleox.com/en/eng-nkjv/1par/28/#L9"><em>1 Chr. 28:9</em></a><em>)</em></p></blockquote><blockquote><p>“Or do you despise the riches of His goodness, forbearance, and longsuffering, not knowing that the goodness of God leads you to repentance? But in accordance with your hardness and your impenitent heart you are treasuring up for yourself wrath in the day of wrath and revelation of the righteous judgment of <strong><mark>God, who ‘will render</mark></strong> to each one according to his deeds’: <strong><u><mark>eternal life</mark></u><mark> to </mark><u><mark>those who</mark></u><mark> by patient continuance in doing good </mark><u><mark>seek</mark></u><mark> for glory, honor, and immortality</mark>; but to those who are self-seeking and do not obey the truth</strong>, but obey unrighteousness — <strong>indignation and wrath</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L4-8">Rom. 2:4-8</a>)</p></blockquote><h2>God Grieves over the Perdition of Sinners and Tries to Save as Many of Them as Possible</h2><blockquote><p>“<strong><u><mark>Do I have any pleasure</mark></u><mark> at all that the wicked should die?</mark></strong> says the Lord GOD, <strong><mark>and not that he should turn from his ways and live?</mark></strong> &lt;...&gt; Yet you say, ‘The way of the Lord is not fair.’ Hear now, O house of Israel, <strong>is it not My way which is fair, and your ways which are not fair?</strong> &lt;...&gt; Therefore I will judge you, O house of Israel, every one according to his ways, says the Lord GOD. <strong><mark>Repent, and turn from all your transgressions, so that iniquity will not be your ruin</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/iez/18/#L23,25,30">Ezek. 18:23,25,30</a>)</p></blockquote><blockquote><p>“Say to them: ‘As I live,’ says the Lord GOD, ‘<strong><u><mark>I have no pleasure</mark></u><mark> in the death of the wicked, but that the wicked turn from his way and live</mark></strong>. Turn, turn from your evil ways! <strong><mark>For why should you die</mark></strong>, O house of Israel?’” (<a href="https://bibleox.com/en/eng-nkjv/iez/33/#L11">Ezek. 33:11</a>)</p></blockquote><blockquote><p>“Jesus answered and said to them, ‘<strong>Those who are well <mark>have no need of a physician</mark>, but <mark>those who are sick</mark>. <mark>I have not come to call</mark> the righteous, but <mark>sinners, to repentance</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/5/#L31-32">Luke. 5:31-32</a>)</p></blockquote><blockquote><p>“<strong><mark>The Lord is not slack</mark></strong> concerning His promise, as some count slackness, <strong><mark>but is longsuffering toward us, <u>not willing</u> that any should perish but that all should come to repentance</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L9">2 Pet. 3:9</a>)</p></blockquote><h2>A Person Perishes Because of His Own Unwillingness to Turn His Will to God</h2><blockquote><p>“O Jerusalem, Jerusalem, the one who kills the prophets and stones those who are sent to her! <strong><mark>How often <u>I wanted</u> to gather</mark></strong> your children together, as a hen gathers her chicks under her wings, <strong><mark>but you <u>were not willing</u>!</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L37">Matt. 23:37</a>)</p></blockquote><blockquote><p>“And this is the condemnation, that the light has come into the world, and <strong><mark>men <u>loved</u> darkness rather than light</mark></strong>, because their deeds were evil. For <strong><mark>everyone practicing evil <u>hates</u> the light and <u>does not come</u> to the light</mark></strong>, lest his deeds should be exposed. But he who does the truth comes to the light, that his deeds may be clearly seen, that they have been done in God” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L19-21">John. 3:19-21</a>)</p></blockquote><blockquote><p>“Or do you despise the riches of His goodness, forbearance, and longsuffering, not knowing that <strong><mark>the goodness of God leads you to repentance</mark></strong>? <strong><mark>But in accordance with your hardness and your impenitent heart you are treasuring up for yourself wrath in the day of wrath</mark></strong> and revelation of the righteous judgment of God, who ‘will render to each one according to his deeds’: eternal life to those who by patient continuance in doing good seek for glory, honor, and immortality; but to those who are <strong><mark>self-seeking and do not obey the truth</mark></strong>, but obey unrighteousness — indignation and wrath” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L4-8">Rom. 2:4-8</a>)</p></blockquote><h2>God Predestined to Salvation Those Whom He <strong>Foreknew</strong> (That Is, Knew Beforehand That They Would Choose)</h2><p>Predestination does not take place without regard to a person’s deeds, which God, being outside time, knows beforehand, and it is precisely on the basis of this knowledge (foreknowledge) that He predestines. This is the key point. Predestination does not happen at random, but precisely with regard to the deeds of each person, which God knows <strong>before</strong> they are done, being outside time:</p><blockquote><p>“For <strong>whom He <mark>foreknew</mark></strong> <em>(Greek: προέγνω — “knew beforehand”)</em><strong>, He also <mark>predestined</mark></strong> to be conformed to the image of His Son, that He might be the firstborn among many brethren. Moreover <strong>whom He predestined, these He also called</strong>; whom He called, these He also justified; and whom He justified, these He also glorified” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L29-30">Rom. 8:29-30</a>)</p></blockquote><blockquote><p>“Peter, an apostle of Jesus Christ, to the pilgrims of the Dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia, <strong><mark>elect according to the foreknowledge</mark> of God the Father</strong>, in sanctification of the Spirit, for obedience and sprinkling of the blood of Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L1-2">1 Pet. 1:1-2</a>)</p></blockquote><blockquote><p>“<strong>All human beings come from the ground</strong>, and humankind was created out of the dust. <strong><mark>In the fullness of his knowledge</mark> the Lord</strong> distinguished them and <strong><mark>appointed</mark> their different ways</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/33/#L10-11">Sir. 33:10-11</a>)</p></blockquote><blockquote><p>“Now when the Gentiles heard this, they were glad and glorified the word of the Lord. And <strong>as many as had been appointed to eternal life believed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L48">Act. 13:48</a>)</p></blockquote><h2>The Fate of Man Is in God’s Hands</h2><p><em>(In the Russian Synodal translation the Greek κρίματα and the Hebrew מִשְׁפָּט — “judgments, decisions” — are often rendered «судьбы», literally “fates, destinies”. English translations render this word as “judgments” or “justice”.)</em></p><blockquote><p>“Your righteousness is like the great mountains; <strong>Your <mark>judgments</mark> are a great deep</strong>; O LORD, You preserve man and beast” (<a href="https://bibleox.com/en/eng-nkjv/ps/36/#L6">Ps. 36:6</a>)</p></blockquote><blockquote><p>“<strong><mark>A man’s steps</mark> are of the LORD</strong>; how then can a man understand his own way?” (<a href="https://bibleox.com/en/eng-nkjv/pr/20/#L24">Prov. 20:24</a>)</p></blockquote><blockquote><p>“Many seek the ruler’s favor, but <strong><mark>justice</mark> for man comes from the LORD</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/29/#L26">Prov. 29:26</a>)</p></blockquote><blockquote><p>“Like clay in the hand of the potter, <strong>to be molded as he pleases</strong>, so <strong>all are in the hand of their Maker</strong>, to be given whatever he decides” (<a href="https://bibleox.com/en/en-nrsv/prsir/33/#L13">Sir. 33:13</a>)</p></blockquote><blockquote><p>“This also comes from the LORD of hosts, <strong>who is wonderful in counsel</strong> and excellent in guidance” (<a href="https://bibleox.com/en/eng-nkjv/is/28/#L29">Is. 28:29</a>)</p></blockquote><blockquote><p>“Oh, the depth of the riches both of the wisdom and knowledge of God! How <strong>unsearchable are His <mark>judgments</mark></strong> and His ways past finding out!” (<a href="https://bibleox.com/en/eng-nkjv/rim/11/#L33">Rom. 11:33</a>)</p></blockquote><h2>God Predestined the Sufferings of Jesus Christ on the Cross</h2><blockquote><p>“For truly against Your holy Servant Jesus, whom You anointed, both Herod and Pontius Pilate, with the Gentiles and the people of Israel, were gathered together to do whatever <strong>Your hand</strong> and Your purpose <strong><mark>determined before</mark> to be done</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L27-28">Act. 4:27-28</a>)</p></blockquote><h2>God Chose the Apostle Paul Beforehand</h2><blockquote><p>“Then he said, ‘The God of our fathers <strong><mark>has chosen</mark></strong> you that you should know His will, and see the Just One, and hear the voice of His mouth’” (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L14">Act. 22:14</a>)</p></blockquote><h2>Criticism</h2><h3>God Is Not Almighty if He Wants to Save All, but Not All Are Saved</h3><p>Love is a free feeling: you cannot be loved by force. God desires that His creatures be able to love God, and therefore gives them the possibility to freely choose or not choose God: to love Him or to hate Him.</p><p>Can God save everyone? He can. Does God want all to be saved? He does, but in a particular state — having love for God. God does not want to doom to eternal life with Him those who hate God. Therefore He does not do what He does not want. Does this make God not almighty? No, because God does not want to force anyone to love.</p><p>Can a loving God grant people the possibility to freely love or hate Him? He can. And if He could not give freedom of choice, would He be almighty?</p>

  - src: Авраам-отец-верующих
    path: Ab2k_Abraham_the_Father_of_Believers
    title: Abraham — the Father of Believers
    meta_desc: Bible quotes about Abraham as the father of believers
    menu: { parent: Church/Faith, title: Abraham — the Father of Believers, priority: 25 }
    body: |-
      <p>Abraham became righteous without the Law and even before circumcision:</p><blockquote><p>“just as David also describes the blessedness of the man to whom God imputes righteousness apart from works: ‘Blessed are those whose lawless deeds are forgiven, and whose sins are covered; blessed is the man to whom the LORD shall not impute sin.’ Does this blessedness then come upon the circumcised only, or upon the uncircumcised also? For we say that <strong>faith was accounted to Abraham for righteousness. How then was it accounted? While he was circumcised, or uncircumcised? Not while circumcised, but while uncircumcised</strong>. And he received the sign of circumcision, a seal of the righteousness of the faith which he had while still uncircumcised, that <strong>he might be the father of all those who believe, though they are uncircumcised</strong>, that righteousness might be imputed to them also, and the father of circumcision to those who not only are of the circumcision, but who also walk in the steps of the faith which our father Abraham had while still uncircumcised. For <strong>the promise that he would be the heir of the world was not to Abraham or to his seed through the law, but through the righteousness of faith</strong>. For if those who are of the law are heirs, faith is made void and the promise made of no effect, because the law brings about wrath; for where there is no law there is no transgression. Therefore it is of faith that it might be according to grace, so that <strong>the promise might be sure to all the seed, not only to those who are of the law, but also to those who are of the faith of Abraham, who is the father of us all (as it is written, ‘I have made you a father of many nations’) in the presence of Him whom he believed</strong> — God, who gives life to the dead and calls those things which do not exist as though they did” (<a href="https://bibleox.com/en/eng-nkjv/rim/4/#L6-17">Rom. 4:6-17</a>)</p></blockquote><blockquote><p>“When Abram was ninety-nine years old, the LORD appeared to Abram and said to him, ‘I am Almighty God; walk before Me and be blameless. &lt;...&gt; As for Me, behold, My covenant is with you, and <strong>you shall be a father of many nations</strong>. No longer shall your name be called Abram, but your name shall be Abraham; for <strong>I have made you a father of many nations</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L1,4-5">Gen. 17:1,4-5</a>)</p></blockquote><p>Believers are the sons of Abraham:</p><blockquote><p>“just as Abraham ‘believed God, and it was accounted to him for righteousness.’ Therefore know that <strong>only those who are of faith are sons of Abraham</strong>. And the Scripture, foreseeing that God would justify the Gentiles by faith, preached the gospel <strong>to Abraham beforehand, saying, ‘In you all the nations shall be blessed.’</strong> So then <strong>those who are of faith are blessed with believing Abraham</strong>. For as many as are of the works of the law are under the curse; for it is written, ‘Cursed is everyone who does not continue in all things which are written in the book of the law, to do them.’ But that no one is justified by the law in the sight of God is evident, for ‘the just shall live by faith.’ Yet the law is not of faith, but ‘the man who does them shall live by them.’ Christ has redeemed us from the curse of the law, having become a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), that <strong>the blessing of Abraham might come upon the Gentiles in Christ Jesus</strong>, that we might receive the promise of the Spirit through faith. Brethren, I speak in the manner of men: Though it is only a man’s covenant, yet if it is confirmed, no one annuls or adds to it. Now to Abraham and his Seed were the promises made. <strong>He does not say, ‘And to seeds,’ as of many, but as of one, ‘And to your Seed,’ who is Christ</strong>. &lt;...&gt; For as many of you as were baptized into Christ have put on Christ. &lt;...&gt; <strong>And if you are Christ’s, then you are Abraham’s seed</strong>, and heirs according to the promise” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L6-16,27,29">Gal. 3:6-16,27,29</a>)</p></blockquote><blockquote><p>“I will bless those who bless you, and I will curse him who curses you; and <strong>in you all the families of the earth shall be blessed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/12/#L3">Gen. 12:3</a>)</p></blockquote><blockquote><p>“that <strong>the blessing of Abraham might come upon the Gentiles in Christ Jesus</strong>, that we might receive the promise of the Spirit <strong>through faith</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L14">Gal. 3:14</a>)</p></blockquote><h2>Jesus Christ on the Children of Abraham:</h2><blockquote><p>“and do not think to say to yourselves, ‘We have Abraham as our father.’ For I say to you that <strong>God is able to raise up children to Abraham from these stones</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/3/#L9">Matt. 3:9</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/3/#L8">Luke. 3:8</a>)</p></blockquote><h2>The Church Is the New Israel</h2><blockquote><p>“But you are a chosen generation, a royal priesthood, a holy nation, His own special people, that you may proclaim the praises of Him who called you out of darkness into His marvelous light; <strong>who once were not a people but are now the people of God, who had not obtained mercy but now have obtained mercy</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L9-10">1 Pet. 2:9-10</a>)</p></blockquote>
