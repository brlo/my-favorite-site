    priority: 2
  body: <h2>18th century</h2><h3>Epistle of the Patriarchs of the Orthodox Church
    (1723)</h3><blockquote><p>We <strong>believe</strong>, as we have been taught
    to believe, in that which is called, and rather is, <strong>the Holy Catholic
    and Apostolic Church, which containeth generally all the Faithful in Christ, who,
    that is to say, being still on their pilgrimage, have not yet reached their home
    in the Fatherland</strong>. But we do not in any wise confound this Church which
    is on its pilgrimage with that which is in the Fatherland, merely because, as
    some of the heretics say, the members of the two are sheep of God, the Chief Shepherd
    (cf. Ps. 94:7), and hallowed by the same Holy Spirit. That <strong>[confounding
    of the heavenly and the earthly Church] is absurd</strong> and impossible, since
    the one is yet militant, and on its journey; and the other is triumphant, and
    settled in the Fatherland, and hath received the prize.</p><p>&lt;…&gt;</p><p>We
    believe <strong>to be members of the Catholic Church all the faithful, and only
    the faithful</strong> – that is, <strong>those who, forsooth, having received
    the blameless faith</strong> of the Saviour Christ, from Christ himself, and the
    Apostles, and the Holy Ecumenical Synods, <strong>adhere to the same without wavering,
    although some of them may be guilty of all manner of sins</strong>. For unless
    the Faithful, even when living in sin, were members of the Church, they could
    not be judged by the Church. But now being judged by her, and called to repentance,
    and guided into the way of her salutary precepts, <strong>though they may be still
    defiled with sins, for this only, that they have not fallen into despair, and
    that they cleave to the Catholic and Orthodox faith, they are, and are regarded
    as, members of the Catholic Church</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decrees
    10-11</a>)</p><h2>19th century</h2><h3>St Macarius of Optina (Ivanov), monk (1788–1860)</h3><blockquote><p><strong>The
    Church is for us an earthly heaven</strong>, where God Himself is invisibly present
    and marks those who stand before Him; therefore in church one must stand with
    decorum and great reverence. Let us love the Church and be zealous towards it;
    it is our consolation and comfort in sorrows and joys.</p></blockquote><p>(Symphony)</p><h3>St
    Antony of Optina (Putilov), monk (1795–1865)</h3><blockquote><p>Without the <strong>visible
    Holy Church</strong> there could be no Holy Mysteries of Christ, without which
    a man cannot inherit life eternal. Churchly prayer has such power and importance
    that the churchly “Lord, have mercy!” surpasses all cell exercises of the spirit;
    and therefore the holy fathers, standing in the holy temple, imagined that they
    were standing in the Heavens before the throne of God.</p></blockquote><p>(Letters)</p><h3>St
    Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>The holy Church
    sails across the waves of the sea of life, and abides above its waves by the divine
    teaching, <strong>holding in its bosom the true knowledge of God, the true knowledge
    of man, of good and evil, of the material and temporal world, of the spiritual
    and eternal world</strong>. All true Christians throughout the universe belong
    to one true Church and, holding its teaching in fullness and purity, make up that
    fleet of ships which crosses the sea of life without sinking into its dark depths.</p></blockquote><p>(Ascetical
    Experiences, vol. 1, The sea of life)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p>The Christian Church (the earthly
    one) is <strong>the society of those who truly believe in the Lord Jesus Christ,
    joined to Him as its Head, governed by Him and founded by Himself, in order, through
    the teaching of the faith, the sacraments and hierarchical guidance, by the invisible
    action of the Holy Spirit sent down from God the Father, to bring all men to salvation
    and reunion with God.</strong></p></blockquote><p>(The Orthodox Church and the
    Sectarians)</p>
