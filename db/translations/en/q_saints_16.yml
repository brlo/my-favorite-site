    title: The Church — the new Israel
    priority: 500
  body: "<h2>20th century</h2><h3>St Hilarion (Troitsky), archbishop of Vereya, hieromartyr
    (1886–1929)</h3><blockquote><p>The Church is the true Israel of God.</p><p>&lt;…&gt;</p><p>The
    Church is this covenant of God already with the whole of mankind, and not with
    the Jewish people alone.</p></blockquote><p>(Outlines from the history of the
    dogma of the Church)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
