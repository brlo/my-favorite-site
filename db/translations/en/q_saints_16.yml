    title: The Church — earthly and heavenly
    priority: 1
  body: '<h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p><em>It
    is for him to wish to remain long in the world whom the world delights, whom this
    life, flattering and deceiving, invites by the enticements of earthly pleasure.
    Again, since the world hates the Christian, why do you love that which hates you?
    and why do you not rather follow Christ, who both redeemed you and loves you?</em></p><p><em>&lt;…&gt;</em></p><p><em>We
    should consider, dearly beloved brethren—we should ever and anon reflect that
    we have renounced the world, and are in the meantime living here as guests and
    strangers. Let us greet the </em><strong><em>day which assigns each of us to his
    own home, which snatches us hence, and sets us free from the snares of the world,
    <mark>and restores us to paradise and the kingdom</mark></em></strong><em>. Who
    that has been placed in foreign lands would not hasten to return to his own country?
    Who that is hastening to return to his friends would not eagerly desire a prosperous
    gale, that he might the sooner embrace those dear to him? We regard paradise as
    our country—we already begin to consider the patriarchs as our parents: </em><strong><em>why
    do we not hasten and run, that we may behold our country, that we may greet our
    parents? <mark>There a great number of our dear ones is awaiting us</mark>, –
    a dense crowd of parents, brothers, children, is longing for us, already assured
    of their own safety, <mark>and still solicitous for our salvation</mark>.</em></strong><em>
    To attain to their presence and their embrace, what a gladness both for them and
    for us in common! What a pleasure is there in the heavenly kingdom, without fear
    of death; and how lofty and perpetual a happiness with eternity of living! There
    the glorious company of </em><strong><em><mark>the apostles</mark></em></strong><em>;
    there the host of the rejoicing </em><strong><em><mark>prophets</mark></em></strong><em>;
    there the innumerable multitude of </em><strong><em>martyrs</em></strong><em>,
    crowned for the victory of their struggle and passion; there the triumphant </em><strong><em><mark>virgins</mark></em></strong><em>,
    who subdued the lust of the flesh and of the body by the strength of their continency;
    there are </em><strong><em><mark>merciful men rewarded</mark></em></strong><em>,
    who by feeding and helping the poor have done the works of righteousness—who,
    keeping the Lord’s precepts, have transferred their earthly patrimonies to the
    heavenly treasuries. To these, beloved brethren, let us hasten with an eager desire;
    let us crave quickly to be with them, and quickly to come to Christ.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-on-the-mortality">On the Mortality</a>)</p><h2>18th
    century</h2><h3>Epistle of the Patriarchs of the Orthodox Church (1723)</h3><blockquote><p><em>We
    </em><strong><em>believe</em></strong><em> that what is called, or rather is,
    the </em><strong><em>Holy Catholic and Apostolic Church, and in which we have
    been taught to believe, containeth generally all the Faithful in Christ, who,
    that is to say, being still on their pilgrimage, have not yet reached their home
    in the Fatherland</em></strong><em>. But we do not in any wise confound this Church
    which is on its pilgrimage with that which is in the Fatherland, merely because,
    as some of the heretics say, the members of the two are sheep of God, the Chief
    Shepherd (cf. Ps. 94:7), and hallowed by the same Holy Spirit; for that </em><strong><em>[confounding
    of the heavenly and the earthly Church] is absurd</em></strong><em> and impossible,
    since the one is yet militant, and on its journey; and the other is triumphant,
    and settled in the Fatherland, and hath received the prize.</em></p><p><em>&lt;…&gt;</em></p><p><em>We
    believe </em><strong><em>to be members of the Catholic Church all the faithful,
    and only the faithful</em></strong><em> – that is, </em><strong><em>those who,
    forsooth, having received the blameless faith</em></strong><em> of the Saviour
    Christ, from Christ himself, and the Apostles, and the Holy Ecumenical Synods,
    </em><strong><em>adhere to the same without wavering, although some of them may
    be guilty of all manner of sins</em></strong><em>. For unless the Faithful, even
    when living in sin, were members of the Church, they could not be judged by the
    Church. But now being judged by her, and called to repentance, and guided into
    the way of her salutary precepts, </em><strong><em>though they may be still defiled
    with sins, they are, and are regarded as, members of the Catholic Church, for
    this only, that they have not fallen into despair, and that they cleave to the
    Catholic and Orthodox faith</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decrees
    10-11</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>The
    Church of Christ is divided into</strong></p><p><strong>a) the heavenly Church</strong></p><p>The
    Church consisting of angels, saints and all who have reposed in faith and repentance
    is called the Church “invisible”, “heavenly”, “triumphant” (Heb. 12:22–24), “the
    kingdom of glory”.</p><p><strong>b) the earthly Church</strong></p><p>The Church
    consisting of believers living on earth is the Church “visible”, “earthly”, “militant”
    (John 15:18–19; 1 Pet. 5:8; 1 John 5:4; Gal. 4:19; Eph. 6:11–12; Heb. 13:14).</p><p>The
    concept of the earthly Church:</p><p>The Christian Church (the earthly one) is
    the society of those who truly believe in the Lord Jesus Christ, joined to Him
    as its Head, governed by Him and founded by Himself, in order, through the teaching
    of the faith, the sacraments and hierarchical guidance, by the invisible action
    of the Holy Spirit sent down from God the Father, to bring all men to salvation
    and reunion with God.</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>'
