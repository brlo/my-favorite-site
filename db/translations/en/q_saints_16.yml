- src: dZRSAfwE_Господь_Иисус_Христос_основал_Церковь
  path: Lord-Jesus-Christ-founded-the-Church
  title: The Lord Jesus Christ founded the Church
  menu:
    parent: Church
    title: Christ — the Founder of the Church
    priority: 0
  body: "<h2>4th century</h2><h3>Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p><strong>You
    founded on earth the Holy Church</strong> as the image of the kingdom above. <strong>You
    created</strong> it in love, planted it in bounty, betrothed it to Yourself spiritually,
    and won it for Yourself by Your suffering. But the hater of mankind, in his shameless
    insolence, attacks it through his servants.</p></blockquote><p>(Works, 62)</p><blockquote><p>Blessed
    are you, O Church of the faithful, for the King of kings has established His dwelling
    in you. Your foundations shall never be shaken, for the Lord is your guardian,
    and the gates of hell shall not prevail against you, and the ravenous wolves cannot
    crush or weaken your strength. O, how great you are, O house of God! How beautiful
    you are!</p></blockquote><p>(the source requires processing) Read the explanation[1]</p><h2>5th
    century</h2><h3>Blessed Theodoret of Cyrrhus (386–457)</h3><blockquote><p><strong>The
    Master Christ is the head</strong>, and those who believe in Him are His body</p></blockquote><p>(Commentary
    on the Epistle to the Ephesians)</p><h2>19th century</h2><h3>St Theophan the Recluse,
    bishop (1815–1894)</h3><blockquote><p>If in our body nothing takes place without
    depending on the head (the brain, the nerves), then all the more must we believe
    that <strong><mark>such is the case in the Church of God: that is, that in it,
    as in the body of the Lord, nothing takes place without the Lord, Who is its Head.</mark></strong>
    True faith always touches the right hand of the Lord in every churchly thing and
    receives it as proceeding from Him, with humble and warm submission, not allowing
    itself bold designs about abolitions or changes.</p></blockquote><p>(Selected
    letters on sects and heresies, Letter 29)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p>“I will build My Church, and the
    gates of hell shall not prevail against it” (Matt. 16:18). “Take heed to yourselves,
    and to all the flock, in which the Holy Spirit has made you overseers, to feed
    the Church of the Lord and God, which He purchased with His own blood” (Acts 20:28).
    “Christ loved the Church and gave Himself for it” (Eph. 5:25).</p><p>The Lord
    Jesus Christ laid the beginning and foundation of His Church by choosing the apostles
    from among His hearers. The apostles and the few believers (Acts 1:16; 1 Cor.
    15:6), united by faith in Him and by His teaching, made up the Church of Christ.
    <strong><mark>He Himself gave the Church its structure, established in it the
    hierarchy and the sacraments for the sanctification of the faithful</mark>. But
    by this the Lord did not limit His activity in the work of building the Church,
    otherwise it would not differ essentially from other religious societies organized
    by men. <mark>He gave His life for the redemption of man from the sins of the
    world</mark>, by His death on the cross delivered the believers (the Church) from
    the power of the devil and made them His own possession</strong> (1 Pet. 1:18–19,
    2:9; Col. 1:14 and elsewhere). To make the blessings of redemption the possession
    of men, He sent down (Acts 2:1–4) the Holy Spirit into the Church, and from the
    day of His descent it became the body of Christ, headed by Him (Eph. 1:22–23,
    4:15–16, 5:23–30; Col. 1:18, 24, 2:19; 1 Cor. 12:27 and elsewhere) and made alive
    by the Holy Spirit by the good will of God the Father (John 14:16, 26). Until
    the sending down of the Holy Spirit the Church could not (cf. John 7:37–39) make
    the blessings purchased by the blood of Jesus Christ its own, since it did not
    have “of His divine power” everything needful for life and godliness (2 Pet. 1:3).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
