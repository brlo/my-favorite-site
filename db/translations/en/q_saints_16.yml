  title: The Church — a definition
  menu:
    parent: Church
    title: The Church — a definition
    priority: 0
  body: <h2>18th century</h2><h3>Epistle of the Patriarchs of the Orthodox Church
    (1723)</h3><blockquote><p>We believe that what is called, or rather is, <strong><mark>the
    Holy Catholic and Apostolic Church, which containeth generally all the Faithful
    in Christ</mark></strong>, who, that is to say, being still on their pilgrimage,
    have not yet reached their home in the Fatherland. But we do not in any wise confound
    this Church which is on its pilgrimage with that which is in the Fatherland, merely
    because, as some of the heretics say, the members of the two are sheep of God,
    the Chief Shepherd (cf. Ps. 94:7), and hallowed by the same Holy Spirit; for that
    [confounding of the heavenly and the earthly Church] is absurd and impossible,
    since the one is yet militant, and on its journey; and the other is triumphant,
    and settled in the Fatherland, and hath received the prize.</p><p>Of which Catholic
    Church, since a mortal man cannot universally and perpetually (καθόλου) be head,
    <strong>our Lord Jesus Christ himself is head, and himself holding the rudder
    is at the helm in the governing of the Church, through the Holy Fathers</strong>.
    And, therefore, over particular Churches, that are real Churches, and consist
    of real members [of the Catholic Church], the Holy Spirit hath appointed Bishops
    as leaders and shepherds, <strong>who being not at all by abuse, but properly,
    authorities and heads, look unto the Author and Finisher of our Salvation (cf.
    Heb. 12:2), and refer to him what they do in their capacity of heads</strong>
    forsooth.</p><p><em>&lt;…&gt;</em></p><p>We declare that <strong><mark>the dignity
    of the Bishop is so necessary in the Church, that without him, neither Church
    nor Christian could either be or be spoken of</mark></strong>. For he, as a successor
    of the Apostles, having received in continued succession by the imposition of
    hands and the invocation of the All-holy Spirit the grace that is given him of
    the Lord of binding and loosing, is a living image of God upon the earth, and
    by a most ample participation of the operation of the Holy Spirit, who is the
    chief functionary [of the Mysteries], <strong><mark>is a fountain of all the Mysteries
    of the Catholic Church, through which we obtain salvation</mark></strong><mark>.</mark>
    <strong>And he is, we suppose, as necessary to the Church as breath is to man,
    or the sun to the world.</strong> Whence it hath also been elegantly said by some
    in commendation of the dignity of the High Priesthood, “What God is in the heavenly
    Church of the first-born (cf. Heb. 12:23), and the sun in the world, that every
    High Priest is in his own particular Church, as through him the flock is enlightened,
    and nourished, and becometh the temple of God.”</p><p>&lt;…&gt;</p><p><em>We believe
    </em><strong><em><mark>to be members of the Catholic Church all the faithful,
    and only the faithful</mark></em></strong><em> – that is, </em><strong><em>those
    who, forsooth, having received the blameless faith</em></strong><em> of the Saviour
    Christ, from Christ himself, and the Apostles, and the Holy Ecumenical Synods,
    </em><strong><em><mark>adhere to</mark> the same without wavering, although some
    of them may be guilty of all manner of sins</em></strong><em>. For unless the
    Faithful, even when living in sin, were members of the Church, they could not
    be judged by the Church. But now being judged by her, and called to repentance,
    and guided into the way of her salutary precepts, </em><strong><em>though they
    may be still defiled with sins, for this only, that they have not fallen into
    despair, and that they <mark>cleave to the Catholic and Orthodox faith</mark>,
    they are, and are regarded as, members of the Catholic Church</em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decrees
    10-11</a>)</p><h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p><strong>What
    is <mark>the Holy Church? It is a society of the faithful, united</mark> with
    one another by the unity of <mark>the confession</mark> of the divinely revealed
    truths, by the unity of sanctification through the <mark>sacraments</mark> divinely
    established, and by the unity of government and guidance through the God-given
    <mark>pastorate</mark>.</strong> The unity of confession, of sanctification and
    of government makes up the rule of this society, which everyone who enters it
    must observe without fail. Entry into the society is conditioned upon accepting
    this rule, agreeing to it, and abiding in it upon fulfilling it. Look how the
    Holy Church has spread and continues to spread. Preachers preach; of those who
    hear, some do not accept the preaching and depart, others accept and are thereby
    sanctified by the holy sacraments, come under the guidance of the pastors and
    are churched. Entering the Church, they merge with all, are united, and so long
    as they remain one with all, so long do they abide in the Church.</p></blockquote><p>(Contemplation
    and Meditation)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
