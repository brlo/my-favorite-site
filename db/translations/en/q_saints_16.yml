    priority: 4
  body: '<h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr († late 2nd c.)</h3><blockquote><p><em>Since
    therefore we have such proofs, </em><strong><em><mark>it is not necessary to seek
    the truth among others which it is easy to obtain from the Church; since the apostles,
    like a rich man in a bank, lodged in her hands most copiously all things pertaining
    to the truth: so that every man, whosoever will, can draw from her the water of
    life</mark></em></strong><em> (Rev. 22:17). For she is the entrance to life; all
    others are thieves and robbers. On this account are we bound to avoid them, but
    to make choice of the thing pertaining to the Church with the utmost diligence,
    and </em><strong><em>to lay hold of the tradition of the truth</em></strong><em>.
    For how stands the case? </em><strong><em>Suppose there arise a dispute relative
    to some important question among us, should we not have recourse to the most ancient
    Churches with which the apostles held constant intercourse, and learn from them
    what is certain and clear in regard to the present question? For how should it
    be if the apostles themselves had not left us writings? Would it not be necessary
    to follow the course of the tradition which they handed down to those to whom
    they did commit the Churches?</em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against
    Heresies, Book III, ch. 4</a>)</p><h2>19th century</h2><h3>St Macarius of Optina
    (Ivanov), monk (1788–1860)</h3><blockquote><p>Glory to God that you have come
    to know, or <strong><mark>are coming to know, the truth; and where is it to be
    found?</mark></strong> The Lord said: I am the way, the truth and the life (John
    14:6); He both commissioned the Church, and is Himself its Foundation and Head,
    and therefore the holy apostle writes: the Church is the pillar and ground of
    the truth (1 Tim. 3:15). <strong><mark>Here is where the truth is to be sought:
    in the teaching of the Holy Catholic and Apostolic Orthodox Church of Christ;
    hold sacred and obey its rules and offices</mark></strong>; for the Lord decisively
    commanded: if anyone will not hear the Church, let him be unto thee as a heathen
    and a publican (Matt. 18:17); the teaching of the Church is all founded on the
    word of God, contained in the Holy Scriptures, and the Holy Spirit Himself acted
    in the holy fathers who established the rules, laws and canons of the Church</p></blockquote><p>(A
    word for your benefit, Letter of 22 October 1857)</p><h3>St Theophan the Recluse,
    bishop (1815–1894)</h3><blockquote><p>What we confess and how we work out our
    salvation <strong>was in force among our fathers, grandfathers, great-grandfathers,
    and all the Russians from the very time of their enlightening with the true faith
    under St Vladimir. Of this it is now soon a thousand years.</strong> And how many
    saints has our Holy Church brought up, intercessors and prayer-makers for us before
    the Lord, as their incorrupt relics show, scattered throughout all the Russian
    land! And suddenly this bawler, only yesterday deluded by a lie, attempts to tear
    you away from this holy company!!! <strong>But go further on – you will see the
    same confession and the same working out of salvation among the Greeks, from whom
    we received the holy faith. Go through the centuries among them; you will reach
    the Councils that defended and established the universal truth. </strong>Pass
    through the Councils down to Constantine the Great, and everywhere you will behold
    one and the same truth, held by the whole company of the faithful and reigning
    throughout the whole universe.<strong> Move on still further – you will pass through
    the centuries of persecutions and reach the apostolic age – and you will see there
    the same confession and the same working out of salvation as is now held and acted
    upon among us. <mark>And what the Apostles taught and established they received
    from the Lord, and the Lord spoke and acted as He received from His Father, in
    the mystery of the Most Holy Trinity. – This is where our faith comes from! </mark>Here
    is its source! See how, flowing from the depths of God, it ran on through the
    course of the centuries and flowed down to us!</strong></p></blockquote><p>(Selected
    letters on sects and heresies, Letter 8)</p><blockquote><p><strong>The Holy Orthodox
    Church is the treasury of the blessings of salvation. Whatever you may need for
    salvation – you will find it in her, and in her alone. Apart from her even the
    Lord Himself does not give these blessings. <mark>So He Himself was pleased to
    arrange it. Having become the Head of the Church, He does not act for our salvation
    otherwise than through this His body</mark>. And do not seek another approach
    to His treasures of salvation. There is none.</strong></p><p>The Lord Saviour,
    as the Hypostatic Wisdom, brought to earth in Himself, from the innermost sanctuary
    of the Trihypostatic Godhead, all the saving wisdom. But He did not keep it hidden
    within Himself; He first delivered it to the Apostles, commanding them to deliver
    it to all the faithful of all nations. The Apostles handed it down to the whole
    company of the faithful, commanding their successors to keep it. <strong><mark>And
    the Church became the pillar and ground of the truth, which, having settled in
    her, abides in her and will abide to the end of the age. Do you wish to know this
    wisdom? Go to the Orthodox Church, the faithful keeper of all that has been handed
    down by the Apostles, and learn it from her.</mark></strong></p></blockquote><p>(Selected
    letters on sects and heresies, Letter 27)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p><strong>The Church of Christ keeps
    the divinely entrusted true teaching unchangeably, whole and pure, as it was delivered
    to her at the beginning by her divine Founder</strong>. “The Church of the living
    God, the pillar and ground of the truth” (1 Tim. 3:15). “Teaching them to observe
    all things whatsoever I have commanded you” (Matt. 28:20). “That now unto the
    principalities and powers in heavenly places might be known by the Church the
    manifold wisdom of God” (Eph. 3:10). <strong>The unfailing pledge of the Church’s
    keeping of the truth is that she has the Holy Spirit. This Spirit of truth always
    dwells in the Church and is in her the principle of life</strong>: “...and I will
    pray the Father, and he shall give you another Comforter, that he may abide with
    you for ever... he shall teach you all things, and bring all things to your remembrance,
    whatsoever I have said unto you” (John 14:16, 26). “When he, the Spirit of truth,
    is come, he will guide you into all truth” (John 16:13). “One ought not”, writes
    St Irenaeus of Lyons, “to seek among others the truth, which it is easy to obtain
    from the Church; since the apostles, like a rich man in a treasury, lodged in
    her hands most copiously all things pertaining to the truth: so that every man,
    whosoever will, can draw from her the water of life. For she is the entrance to
    life; all others are thieves and robbers. On this account are we bound to avoid
    them, but to make choice of the thing pertaining to the Church with the utmost
    diligence, and to lay hold of the tradition of the truth.”</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: LdGoZwD8_Церковь_Христова_имеет_внешнюю_сторону
  path: Outward-side-of-the-Church
  title: The outward side of the Church
  menu:
    parent: Church
    title: The outward side of the Church
    priority: 5
  body: "<h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p>I
    begin with the first reproach, that our Christianity has been made material, hardened,
    bodily. This they say, looking at our churchly order, or our churchly life, visibly
    and bodily manifested and performed. You, they say, have nothing but rites and
    rites, and nothing more. One performs the rite and is at rest – whether the soul
    took part in it or not.</p><p>Let us say to them: <strong><mark>Christianity is
    in the highest degree spiritual, for it is gracious; but it is not invisible</mark>.
    And true Christians are in the highest degree spiritual, for they are necessarily
    endowed with grace; but they are not bodiless. Therefore, with all their spirituality
    – the highest – they cannot but act bodily, not only in relation to men, but also
    in relation to God, in the most spiritual movements of their hearts. <mark>From
    this it follows that, looking at the visible, by which Christian life is expressed
    in the Church and in Christians, it is unjust to limit everything in them by this
    one visible thing. Is it not more just, on the contrary, to discern beneath this
    visible the invisible and spiritual, as in a word we tangibly encounter a hidden
    thought.</mark></strong></p><p>Perhaps others are confused in this matter by the
    word – rite. Let us explain the meaning of this word. Take the liturgical part,
    because in it the churchly life is most expressed, or in it is most visible, concealing
    or even completely covering the other parts – the labors and good deeds (fasting
    and almsgiving). What is every liturgical service? – A series of prayers, read,
    sung and raised mentally to God. In this is the essence of the sacred service.
    But as we are enclosed in space and time, <strong>every such service requires
    its own time, its own place and order, its own setting, its rite, that which inevitably
    surrounds the series of prayers, although it does not constitute the essence of
    the service.</strong> A priest in a known place, at a known time, in a definite
    order, as appointed in the church, performs his sacred service, and both he, and
    the clergy, and the Christians present hold themselves in a known position. All
    this is the rite. But the essence of the matter is not in this outward thing,
    but in the series of prayers performed at the same time. All this is added because
    we are spatial and temporal, and whatever we do, we do in our own time, in our
    own place and in a definite order. And whoever were to place the essence of the
    matter in this would make a great mistake.</p></blockquote><p>(Selected letters
    on sects and heresies, Letter 29)</p><blockquote><p>…<strong><mark>we place the
    power not in the outward thing in this office, but in the inner spirit with which
    it is performed; now I will add: and it is performed according to the institution
    of the Church. </mark>The priest with those present represents and combines within
    himself the whole Church, – and the prayer that takes place here is as powerful
    as the whole Church is powerful, in its complete composition, – the Church, whose
    Head is Christ the Lord. Looking at the outward office, or the rite, one may still
    come to the question, what use is there in it; but holding in mind the essence
    of the matter and the meaning of churchly worship, no one will ask such a question.
    So understand everything churchly. Picture the Church as filled full with the
    heavenly powers.</strong> Let anyone only come into contact with her, – and he
    will partake of her powers. The varied churchly prayers, or prayer offices, bring
    one into this contact. They are for us in life what in physical experiments are
    the wires carried to the point of contact with a powerful electric battery. Take
    hold of whatever wire you will, even the very thinnest – the force of the current
    flowing to you is determined not by the wire, but by the battery. <strong><mark>So
    in life, through whatever office you touch the Church, you touch all her power.
    – Is such faith vain, when the Lord is her Head and fills her all in all? Outside
    the Church, whatever you do, nothing will come of it.</mark></strong></p></blockquote><p>(Selected
    letters on sects and heresies, Letter 29)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p><strong>The Church of Christ, being
    on its inner side invisible (since her Head – Jesus Christ – lives and acts in
    her invisibly by the good will of God the Father, and the Holy Spirit, who sanctifies
    the believers</strong> and aids their salvation)<strong><mark>, on its outward
    side is a visible society of men</mark></strong>. <strong><mark>She was visible
    from the very beginning: her members, by their spiritual-bodily nature, were visible
    and were not scattered separately from one another in different places, but were
    joined together</mark></strong> (Acts 1:5, 2:1 and elsewhere), <strong>appearing
    as a completely separate visible society among Jews and pagans</strong> (Acts
    2:41–47 and elsewhere). New members <strong><mark>joined the Church visibly</mark></strong>
    through baptism (Acts 2:41, 8:12, 38 and elsewhere), <strong>gathered for prayer
    and the sacrament of communion</strong> (Acts 2:42–46; 1 Cor. 11:18–27). The Church,
    by the institution of the Lord Jesus Christ, has <strong><mark>a visible hierarchy</mark></strong>,
    which received from Him the authority to teach, to celebrate and to govern in
    her, and has <strong><mark>visible worship and visible sacred actions</mark></strong>
    – the sacraments, in which under a visible form the invisible grace of God is
    given to the believers. If the Church of Christ were invisible, then, among other
    things, the command of the Lord would be inexplicable: “if he neglect to hear
    them (the witnesses), tell it unto the church” (Matt. 18:17); then she would have
    no history of her life, could not be recognized by men who wish for their salvation
    to join themselves to her (Acts 2:47), and to be distinguished from other religious
    societies that pose as the true Church (cf. Matt. 24:5 and elsewhere).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: uAPgpWln_Церковь_вечна
  path: The-Church-is-eternal
  title: The Church is eternal
  menu:
    parent: Church/Properties of the Church
    title: Eternity
    priority: 1
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“<em>I
    will build My Church, and the gates of hel</em>l shall not prevail against it”
    (Matt. 16:18), that is, all the evil of the world – temptations, outward persecutions,
    the wiles of the devil – shall not prevail against her, since her Founder and
    Head is Jesus Christ, true God (John 10:30; Acts 10:36; 1 John 5:20; Rom. 9:5;
    and elsewhere). He is the corner-stone (Matt. 21:43; Luke 20:17–18; Eph. 2:20;
    1 Cor. 3:11) of the Church. <strong><mark>To overcome the Church would mean to
    overcome Christ Himself</mark></strong>, who promised to abide with her all the
    days to the end of the age (Matt. 28:20).</p></blockquote><p>(The Orthodox Church
    and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: tiWvpeFo_Церковь_непрерывна
  path: The-Church-is-continuous
  title: The Church is continuous
  menu:
    parent: Church/Properties of the Church
    title: Continuity
    priority: 2
  body: '<h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p><em>But
    if the flock is one, how can he be numbered among the flock who is not in the
    number of the flock? Or, </em><strong><em><mark>how can he be esteemed a pastor</mark>,
    who,—while the true shepherd remains and presides over the Church of God by successive
    ordination,—<mark>succeeding to no one, and beginning from himself</mark>, becomes
    a stranger and a profane person, an enemy of the Lord’s peace and of the divine
    unity, not dwelling in the house of God, that is, in the Church of God, in which
    none dwell except they are of one heart and one mind</em></strong><em>, since
    the Holy Spirit speaks in the Psalms, and says, “It is God who maketh men to dwell
    of one mind in a house.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Magnus-on-Baptizing-the-Novatians-and-Those-Who-Obtain-Grace-on-a-Sick-Bed">Letter
    62. To Magnus, on baptizing the Novatians and those who received baptism in sickness</a>)</p><h2>20th
    century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>The
    Church of Christ, as <strong><mark>it has existed without interruption from its
    foundation to our days, so it will exist without interruption “to the end of the
    age”</mark></strong>. – “I am with you all the days to the end of the age” (Matt.
    28:20). “And I will pray the Father, and he shall give you another Comforter,
    that he may abide with you for ever” (John 14:16). “To him be glory in the church
    by Christ Jesus (through Christ) throughout all ages, from age to age” (Eph. 3:21).
    “Well said”, explains St John Chrysostom, – “and this is His glory in the Church,
    since it is known that <strong><mark>the Church will exist always</mark></strong>.
    And since she always abides, the (apostle) wishes that we too should glorify God
    to the end of the world, which he explained by saying: “throughout all ages”.</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: 6VkS1hvQ_Церковь_Апостольская
  path: The-Church-is-apostolic
  title: The Church is apostolic
  menu:
    parent: Church/Properties of the Church
    title: Apostolicity
    priority: 4
  body: '<h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>4.
    From all such persons, therefore, it behooves us to keep aloof, but <strong>to
    adhere to those who, as I have already observed, do hold the doctrine of the apostles,
    and who, together with the order of priesthood (presbyterii ordine), display sound
    speech and blameless conduct for the confirmation and correction of others</strong>.
    In this way, Moses, to whom such a leadership was entrusted, relying on a good
    conscience, cleared himself before God, saying, “I have not in covetousness taken
    anything belonging to one of these men, nor have I done evil to one of them.”
    (Num. 16:15) In this way, too, Samuel, who judged the people so many years, and
    bore rule over Israel without any pride, in the end cleared himself, saying, “I
    have walked before you from my childhood even unto this day: answer me in the
    sight of God, and before His anointed (Christi ejus); whose ox or whose ass of
    yours have I taken, or over whom have I tyrannized, or whom have I oppressed?
    or if I have received from the hand of any a bribe or [so much as] a shoe, speak
    out against me, and I will restore it to you.” (1 Sam. 12 ff.) And when the people
    had said to him, “Thou hast not tyrannized, neither hast thou oppressed us neither
    hast thou taken ought of any man’s hand,” he called the Lord to witness, saying,
    “The Lord is witness, and His Anointed is witness this day, that ye have not found
    ought in my hand. And they said to him, He is witness.” In this strain also the
    Apostle Paul, inasmuch as he had a good conscience, said to the Corinthians: “For
    we are not as many, who corrupt the Word of God: but as of sincerity, but as of
    God, in the sight of God speak we in Christ;” (2 Cor. 2:4) “We have injured no
    man, corrupted no man, circumvented no man.” (2 Cor. 7:2)</p><p>5. <strong>Such
    presbyters does the Church nourish</strong>; of whom also the prophet says: “I
    will give thy rulers in peace, and thy bishops in righteousness.” (Isa. 60:17)
    Of whom also did the Lord declare, “Who then shall be a faithful steward (actor),
    good and wise, whom the Lord sets over His household, to give them their meat
    in due season? Blessed is that servant whom his Lord, when He cometh, shall find
    so doing.” (Matt. 24:45–46) <strong>Paul then, teaching us where one may find
    such, says, “God hath placed in the Church</strong>, first, apostles; secondly,
    prophets; thirdly, teachers.” (1 Cor. 12:28) Where, therefore, the gifts of the
    Lord have been placed, there <strong><mark>it behoves us to learn the truth, from
    those who possess that succession of the Church which is from the apostles, and
    among whom exists that which is sound and blameless in conduct, as well as that
    which is unadulterated and incorrupt in speech</mark>. For these also preserve
    this faith of ours in one God who created all things; and they increase that love
    for the Son of God, who accomplished such marvellous dispensations for our sake:
    and they expound the Scriptures to us without danger, neither blaspheming God,
    nor dishonouring the patriarchs, nor despising the prophets.</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-26">Against
    Heresies, IV. 26.4</a>)</p><h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr
    (c. 200–258)</h3><blockquote><p><em>But if the flock is one, how can he be numbered
    among the flock who is not in the number of the flock? Or, </em><strong><em>how
    can he be esteemed a pastor, who,—while the true shepherd remains and presides
    over the Church of God <mark>by successive ordination</mark>,—<mark>succeeding
    to no one, and beginning from himself</mark>, becomes a stranger and a profane
    person, an enemy of the Lord’s peace and of the divine unity, not dwelling in
    the house of God, that is, in the Church of God, in which none dwell except they
    are of one heart and one mind</em></strong><em>, since the Holy Spirit speaks
    in the Psalms, and says, “It is God who maketh men to dwell of one mind in a house.”</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Magnus-on-Baptizing-the-Novatians-and-Those-Who-Obtain-Grace-on-a-Sick-Bed">Letter
    62. To Magnus, on baptizing the Novatians and those who received baptism in sickness</a>)</p><h2>20th
    century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>God
    the Father, in His love for man, “sent” (ἀπέστειλεν) His Son into the world (John
    3:17–34, 5:23–38, 6:29–57 and elsewhere) to accomplish salvation. The Lord Jesus
    Christ, being the “Apostle” (Ἀπόστολον) and “High Priest of our profession” (Heb.
    3:1), <strong>chose (Luke 6:13; John 15:16) and sent from Himself (John 20:21;
    Acts 1:8) the apostles to plant and spread the Church founded by Him, which in
    the sense of being sent for the salvation of the world is precisely apostolic</strong>.</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: xPEoFfHv_Учительство_Церкви
  path: The-Church-teaches
  title: The teaching office of the Church
  menu:
    parent: Church
    title: The Church teaches
    priority: 7
  body: '<h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr († late 2nd c.)</h3><blockquote><p>Since
    therefore we have such proofs, <strong><mark>it is not necessary to seek the truth
    among others which it is easy to obtain from the Church</mark>, since the apostles,
    like a rich man in a bank, lodged in her hands most copiously all things pertaining
    to the truth: so that every man, whosoever will, can draw from her the water of
    life</strong> (Rev. 22:17). For she is the entrance to life; all others are thieves
    and robbers. On this account are we bound to avoid them, but to make choice of
    the thing pertaining to the Church with the utmost diligence, and to lay hold
    of the tradition of the truth. For how stands the case? Suppose there arise a
    dispute relative to some important question among us, should we not have recourse
    to the most ancient Churches with which the apostles held constant intercourse,
    and learn from them what is certain and clear in regard to the present question?
    For how should it be if the apostles themselves had not left us writings? Would
    it not be necessary to follow the course of the tradition which they handed down
    to those to whom they did commit the Churches? &lt;…&gt; For, prior to Valentinus,
    those who follow Valentinus had no existence; nor did those from Marcion exist
    before Marcion; nor, in short, had any of those malignant-minded people, whom
    I have above enumerated, any being previous to the initiators and inventors of
    their perversity.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against
    Heresies, Book III, ch. 4</a>)</p><h2>19th century</h2><h3>St Theophan the Recluse,
    bishop (1815–1894)</h3><blockquote><p><strong>The Lord, <mark>having established
    through the holy Apostles the Holy Church</mark>, placed in her all that is saving,
    for keeping and spreading on earth. <mark>In her are all the mysteries</mark>
    of the faith and all the understanding of the truth; in her is all grace and all
    the sacraments that give it; <mark>in her is the true pastorate, truly guiding
    to salvation; upon her rests the good will of God, keeping her and hearing her
    voice of prayer; Angels and men, and all rational creation, having been united
    together, serve the one all-good God.</mark></strong></p><p>This – to be in the
    body of the Church and to work out one’s salvation in her – is what binds every
    believer: <strong>1) to believe as the whole Church believes, </strong>from her
    beginning to this day, to test by her voice every consideration of one’s own or
    of others, and resolve every doubt that arises, and <strong>on no account allow
    oneself to admit anything, though it be but a hair’s breadth, that is not in agreement
    with the teaching of the Church. <mark>For she is “the pillar and ground of the
    truth” (1 Tim. 3:15). Mark this – whoever does not observe this is “a heathen
    and a publican”, by the word of the Lord (Matt. 18:17);</mark> 2) not to be separate
    from all in anything in the orders of churchly life: to fast when the fast is
    set before all, to prepare and to commune of the Holy Mysteries of Christ as is
    established in the Church, </strong>and to observe all the other prayerful and
    sanctifying sacred offices of the Church, obeying the word of the Apostle, who
    forbids forsaking the assemblies (Heb. 10:25);<strong> 3) to hold the conviction
    that the heavenly and the earthly are in unbroken communion with one another,
    living and immediate. </strong>This is why our prayers to them and for them, and
    their prayers for us, are both heard and effectual. We are kin, related both to
    the Angels and to all who from the age have pleased God; for, being churched,
    we draw near to “the city of the living God, the heavenly Jerusalem, and to an
    innumerable company of Angels... and to the Church of the first-born which are
    written in heaven” (Heb. 12:22–23).</p><p>Let us now gather together again all
    that has been said about the saving path and repeat it: do you wish to be saved?
    Believe all the divinely revealed teaching, and, receiving the gracious powers
    that are unto life and godliness through the Holy Mysteries, live steadfastly
    according to the commandments of God under the guidance of the divinely established
    pastors and in obedience to them, – <strong>but all this in the spirit of the
    Holy Church of God, according to her laws, and being in living union with her
    – and you will be saved.</strong></p></blockquote><p>(Selected letters on sects
    and heresies, Letter 8)</p><h3>St Nikolai of Japan (Kasatkin), equal-to-the-apostles
    (1836–1912)</h3><blockquote><p>Protestants sometimes come to me, <strong>asking
    me to explain some passage of the Holy Scriptures</strong>. “But you have your
    own missionary teachers; ask them”, I say to them; and what do they answer?</p><p>–
    We asked them, – <strong>they say, – “understand it as you please”</strong>; <strong><mark>but
    I need to know the genuine thought of God, and not my personal opinion</mark></strong>.
    Here you see how unstable Protestantism is with the Holy Scriptures alone. It
    is not so with us: everything is light and reliable, clear and firm; because <strong>we,
    besides the Holy Scripture, accept also the Holy Tradition, and</strong> <strong>the
    Holy Tradition is <mark>the living, unbroken voice of our Mother the Church from
    the times of Christ and His Apostles to this day, and destined to be so to the
    end of the world</mark>. </strong>Upon it the Holy Scripture is kept whole and
    entire, and it helps us to understand the meaning of the Holy Scripture without
    error, for <strong><mark>if a child does not understand something in his father’s
    letter, the most reliable thing for him is to turn to his mother for explanation;
    and our Mother is the Church, in which Christ Himself invisibly dwells, according
    to His promise</mark></strong></p></blockquote><p>(Diaries, vol. III, 3/15 January
    1897. Friday)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: история_слова_Православие_на_Руси
  path: History-of-the-word-Orthodoxy-in-Rus
  title: The history of the word “Orthodoxy” in Rus’
  menu:
    parent: Church
    title: The history of the word “Orthodoxy” in Rus’
    priority: 8
  body: '<h2>10th century — the coming of Orthodoxy to Rus’</h2><p>At the end of the
    10th century (the year 988) Rus’ received from the Byzantine Empire the Christian
    faith, which from the 2nd century had been called in Greek <strong>ὀρθοδοξία</strong>
    [orthodoxia] (<a href="https://bibleox.com/en/en/w/eBHq_When_Did_the_Church_of_Christ_Begin_to_Be_Called_Orthodox">detailed
    analysis</a>). This name is rendered in the Slavonic language as “pravoslavie”
    (Orthodoxy), which is a calque (a literal translation) of the Greek word <strong>ὀρθοδοξία</strong>
    (ὀρθός — straight, correct; δόξα — glory). In this article the history of the
    word “Orthodoxy” in the lands of Rus’ is examined in the quotations.</p><h2>11th
    century</h2><h3>St Theodosius of the Caves, monk (c. 1008–1074)</h3><blockquote><p>And
    the holy fathers, having written this venerable <strong><mark>Orthodox teaching</mark></strong>,
    handed it on to Christians for the continuation of this life and for the partaking
    of eternal life, so that whoever fulfills this rule of the holy fathers, and lives
    his years doing the will of God, shall inherit eternal life, but whoever does
    not heed these books shall be condemned with the devil to eternal torment.</p></blockquote><p>(Instruction
    on the punishments of God)</p><blockquote><p>Lord, bless! I have a word for you,
    O God-loving Prince. I am Theodosius, a lowly servant of the Most Holy Trinity,
    of the Father and of the Son and of the Holy Spirit, born in the pure and <strong>Orthodox</strong>
    <strong>faith</strong> and raised in good instruction by <strong>Orthodox</strong>
    father and mother. Beware, my child, of the crooked-believers and of all their
    conversations, for our land too has been filled with them.</p><p>If anyone saves
    his soul, it is only by living in the <strong>Orthodox faith</strong>, for there
    is no faith better than our pure, Holy, <strong>Orthodox</strong> one. Living
    in this Faith you will not only be delivered from sins and eternal torment, but
    will become a partaker of eternal life and will rejoice without end with the Saints.
    But those who live in another faith shall not see eternal life.</p><p>It is not
    fitting, my child, to praise a foreign faith. Whoever praises a foreign faith
    is the same as one who blasphemes his own. If anyone praises both his own and
    a foreign one, he is a man of two faiths, close to heresy. Therefore, my child,
    beware of them and always stand for your Faith.</p><p>&lt;…&gt;</p><p>My child!
    If you must die for your holy Faith, go boldly to death. So did the saints die
    for the Faith, and now they live in Christ. If you see, my child, men of another
    faith arguing with an <strong>Orthodox</strong> man and wishing to tear him away
    from the <strong><mark>Orthodox Church</mark></strong> – help the <strong>Orthodox</strong>
    man. By this you will deliver the lamb from the lion’s mouth. But if you keep
    silent and leave him without help, it is the same as if you had taken the redeemed
    soul away from Christ and sold it to Satan. If anyone says to you: “Your faith
    and ours are from God”, then you, my child, answer him thus: “You of crooked faith,
    do you consider God also of two faiths? Do you not hear what the Scripture says:
    ‘One God, one Faith, one baptism’ (Eph. 4:5)? Do you not hear the Apostle Paul
    teaching: ‘Though we... an angel from heaven preach any other gospel unto you
    than that which we preached unto you, ... let him be accursed’ (Gal. 1:8). Those
    of another faith have rejected the apostolic preaching and the decrees of the
    holy fathers and have accepted an unrighteous and corrupt faith, full of all perdition,
    and therefore have been rejected by us. They are dead and offer a dead sacrifice.
    But we offer to the Living God a Living Sacrifice, pure and undefiled, that we
    may find eternal life in Christ Jesus our Lord. To Him be glory. Amen.</p></blockquote><p>(Testament
    to the Kiev prince Izyaslav on the Orthodox Christian faith)</p><p>(*According
    to the opinion of a number of researchers, the epistle was written in the mid-12th
    century by Theodosius the Greek.)</p><h3>Nestor the Chronicler, monk (c. 1056–1114)</h3><blockquote><p>by
    all such deeds our <strong><mark>Orthodox faith</mark></strong> is tested, that
    it is firm and strong, abiding near to the Lord and not carried away by the devil</p></blockquote><p>(The
    Tale of Bygone Years)</p><p>According to the Hypatian codex (c. 1420):</p><blockquote><p>таковыми
    вещьми искушатися нашея <strong><mark>православныя</mark> вѣры</strong>, аще тверда
    есть и искрь пребывающи Господеви</p></blockquote><p>(Chronicle according to the
    Hypatian codex, edition of the Archaeographic Commission, St Petersburg, 1871,
    p. 25)</p><h2>12th century</h2><h3>Kirik of Novgorod, hieromonk (c. 1110–1156)</h3><blockquote><p>If
    a Latin wishes <strong><mark>Orthodox baptism</mark></strong> (fol. 276a). If
    there is any man in the faith and baptism of the Latins and wishes to come over
    to us, let him go to church for 7 days.</p></blockquote><p>(The Questions of Kirik
    to Archbishop Niphont)</p><h3>St Cyril of Turov, bishop (c. 1130–1182)</h3><blockquote><p>Cover
    me with Thy protection, O Hope of all the ends of the earth, O Most Holy Lady
    Virgin Mother of God, the great wonder of Angels, the lofty preaching of prophets,
    the praise of Apostles, the firm confirmation of martyrs, the excellent adornment
    of hierarchs, the unconquerable stronghold of tsars <strong><mark>Orthodox</mark></strong>
    and of princes, the precious adornment of churches</p></blockquote><p>(Prayers
    for Wednesday)</p><h2>15th century</h2><h3>Epiphanius the Wise, monk (c. 1375–1443)</h3><blockquote><p>Every
    day he served the Divine Liturgy, zealously performed the morning and evening
    prayers – for the peace of the whole world, for the good estate of the Holy Churches,
    for <strong>Orthodox</strong> tsars and princes, and for all <strong><mark>Orthodox
    Christians.</mark></strong></p><p>&lt;…&gt;</p><p>not wishing to submit to the
    Latin authority, and therefore endured from Isidore for the <strong><mark>Orthodox
    faith</mark></strong> great sorrows and torments in prisons, in fetters and chains.</p><p>&lt;…&gt;</p><p>Who
    could tell of all the misfortunes and the great sorrow that then fell upon the
    <strong><mark>Orthodox Christians</mark></strong>?</p><p>&lt;…&gt;</p><p>The instruction
    given to you by St Mark preach everywhere you go, to all the <strong><mark>Orthodox</mark></strong>,
    who keep the traditions of the holy apostles and the commandments of the holy
    fathers of the seven Councils.</p><p>&lt;…&gt;</p><p>During the siege of the mother
    of cities, Moscow, many of the <strong><mark>Orthodox</mark></strong> saw how,
    from the eastern gates, where men usually entered the city</p><p>&lt;…&gt;</p><p>Not
    only did the <strong><mark>Orthodox</mark></strong> marvel at the virtuous life
    of the Monk, but many of the unbelievers also marvelled at his blessed life</p><p>&lt;…&gt;</p><p>In
    those times, when near the monastery of the saint <strong><mark>Orthodox Christians</mark></strong>
    suffered devastation from the pagan Lithuanians</p><p>&lt;…&gt;</p><p>from the
    godless Tatars, Germans, Lithuanians and other peoples who do not honour in truth
    God, our Lord Jesus Christ, and who desire to destroy <strong><mark>Orthodox Christianity</mark></strong>.</p><p>&lt;…&gt;</p><p>The
    Monk appeared in the Latin and German lands and praised St Mark of Ephesus, calling
    him equal-to-the-apostles and long-suffering, and by his appearance preserved
    from the pagans, on the way back, the priest Simeon and others, commanding that
    the <strong><mark>rightness of the Orthodox faith</mark></strong> be preached
    in Rus’.</p><p>&lt;…&gt;</p><p>they bravely armed themselves against the godless,
    for they saw that the <strong><mark>Orthodox faith</mark></strong> was being trampled
    and Christians were being beaten down by the godless</p><p>&lt;…&gt;</p><p>Those
    who had trampled the Christian faith and sided with the Poles and Lithuanians,
    ravaging <strong><mark>Orthodox Christians</mark></strong>, he besought to depart
    from the heretics and to join themselves anew to the Orthodox.</p><p>&lt;…&gt;</p><p>many
    men of past generations bravely stood for the <strong><mark>Orthodox faith</mark></strong>,
    did not spare their heads and endured a martyric death, and now the Church of
    God glorifies their sufferings and sings praise to them in her services.</p></blockquote><p>(The
    Life and Miracles of St Sergius, abbot of Radonezh)</p><blockquote><p>As once
    in Israel Bezaleel, He filled him with wisdom, understanding and skill. Filled
    with this, he was kindled with the warmth of <strong>the faith of Christ</strong>
    and with a strong desire, and wished to go to the land of Perm and teach them
    the <strong><mark>Orthodox faith</mark> of Christ</strong>.</p><p>&lt;…&gt;</p><p>“<strong>Holy
    is <mark>the church</mark></strong> of thee and wondrous in righteousness”. Wondrous,
    because of the many praises of her, with many praises do I boast of her. Not because
    she is painted with human skills or masterly devices and designs and inventions,
    but because she is adorned with the glory of God, arrayed in virtue, embellished
    with divine doxologies, coloured with the salvation of man, and <strong>clothed
    in the beauty of <mark>Orthodoxy</mark></strong>.</p><p>&lt;…&gt;</p><p>And after
    the appointed short time, having prayed for them abundantly and taught them the
    <strong><mark>Orthodox</mark> Christian faith</strong>, with their wives and children
    he baptized them in the name of the Father and of the Son and of the Holy Spirit,
    and taught them the Perm letters, which he had by that time created.</p><p>&lt;…&gt;</p><p>For
    a difficult labour lies before me, and I strive with joy to accomplish it and
    to suffer. And not only this, but I am ready even to die for the holy <strong><mark>Orthodox
    faith</mark></strong></p><p>&lt;…&gt;</p><p>he flourished well, abounding in the
    fruit of virtue; thus the order of the Church of Christ was duly strengthened,
    and <strong><mark>Orthodoxy</mark></strong> flourished.</p><p>&lt;…&gt;</p><p>Shall
    I call thee father or teacher of the Permians, for in Christ Jesus, by the holy
    Gospel, thou hast begotten the Permians and taught them the <strong><mark>Orthodox
    faith</mark></strong></p></blockquote><p>(A discourse on the life of St Stephen,
    former bishop of Perm)</p><h3>St Joseph of Volokolamsk (Sanin), monk (1439–1515)</h3><blockquote><p>all
    rejoiced that you showed zeal for the most pious and <strong><mark>Orthodox</mark>
    Christian faith</strong>, as the former holy Orthodox Christian tsars</p><p>&lt;…&gt;</p><p>For
    God’s sake, O sovereign, and of the Most Pure Mother of God, be pleased to care
    for and provide for the divine churches and for the <strong><mark>Orthodox</mark>
    faith </strong>of Christians and for us, thy poor and needy ones, for thou, O
    sovereign, art appointed by the right hand of the Most High God an autocrat and
    sovereign of all Rus’.</p><p>&lt;…&gt;</p><p>Those dark and foul heretics of Novgorod
    and apostates and followers of Jewish wisdom thou hast utterly cast down with
    their blasphemic teachings, while the <strong><mark>Orthodox</mark> and true and
    undefiled Christian faith</strong>, shaken and weakened by the heretic and Jewish
    teachings, thou hast again established</p><p>&lt;…&gt;</p><p>If now thou, O sovereign,
    dost not take care and dost not bestir thyself in these things, dost not extinguish
    the foul heretics and their dark heretic teaching, then, O sovereign, the whole
    of <strong><mark>Orthodox Christianity</mark></strong> will perish from the heretic
    teachings, as in former times many kingdoms perished in this way: the great kingdom
    of Ethiopia, and Armenia, and Rome, which for many years abode in the <strong><mark>Orthodox
    faith</mark> of Christians</strong>, and so perished.</p><p>&lt;…&gt;</p><p>So
    too the great Russian land, which for five hundred years had abode in the <strong><mark>Orthodox</mark>
    Christian faith</strong></p></blockquote><p>(Epistles of Joseph of Volokolamsk)</p><h2>16th
    century</h2><h3>St Maxim the Greek (Trivolis), monk (1470–1556)</h3><blockquote><p>“This
    is the prophetic faith, this is the apostolic faith, this is the patristic faith,
    this is the <strong>Orthodox</strong> faith, this faith established the universe”.
    This is the faith of thy ancient forefathers, from which those have vainly departed
    who teach contrary to the saying of the Lord and transgress the institution of
    the blessed fathers</p><p>&lt;…&gt;</p><p>But the Latins, when the <strong>Orthodox</strong>
    ask them why they invented the addition concerning the procession of the Holy
    Spirit “and from the Son”, answer that they do this prudently.</p><p>&lt;…&gt;</p><p>The
    Latins, who in their pride are presumptuous in all things, not only dreamed that
    they had the authority to change the word of the Master, but also renounced the
    agreed definition of the ecumenical councils, by which our pious <strong>Orthodox
    Christian faith</strong> was taught by experience and received establishment in
    the truth.</p><p>&lt;…&gt;</p><p>And since we have spoken briefly about the confession
    of the <strong>Orthodox faith</strong>, there now lies before us the second labour</p><p>&lt;…&gt;</p><p>The
    use of unleavened bread at the sacrifice is a Jewish thing, and none of the <strong><mark>Orthodox
    Churches</mark></strong> or holy patriarchates – neither <strong><mark>Constantinople</mark></strong>,
    nor <strong><mark>Alexandria</mark></strong>, nor <strong><mark>Antioch</mark></strong>,
    nor <strong><mark>Jerusalem</mark></strong> – allow unleavened bread at the service.
    Unleavened bread is used only by the Jews and the accursed Armenians, from whom
    the Latins afterwards accepted it, imitating them.</p></blockquote><p>(An answer
    to Nicholas the Latin)</p><blockquote><p>How else can this be corrected by us,
    if not by <strong><mark>the true-believing and Orthodox faith</mark></strong></p><p>&lt;…&gt;</p><p>by
    the grace of the true God our Jesus Christ I am a true-believing Christian in
    all things, and a well-wisher and most diligent prayer-maker for the God-kept
    Russian realm. I beseech every pious <strong><mark>Orthodox</mark> priest</strong>
    and prince to hear my answer</p><p>&lt;…&gt;</p><p>Having enlightened your minds
    with the customary <strong><mark>Orthodox</mark></strong> tranquillity of sacred
    love and meekness, take care, wherever anything departs from the <strong><mark>Orthodox
    faith</mark></strong>, whether through unreason, or forgetfulness, or the lack
    of instruction of the mind and understanding</p><p>&lt;…&gt;</p><p>which the eyewitnesses
    and servants of God the Word handed down to us, and after them all the ecumenical
    councils of the God-inspired fathers, adding nothing to them at all, nor smoothing
    over, nor changing one iota or a single stroke, but the whole <strong><mark>Orthodox
    faith</mark></strong> and their theology I keep in my heart whole and unaltered.</p><p>&lt;…&gt;</p><p>Further
    to this I confess and proclaim for myself and for every believer the Most Blessed
    Lady my Mother of God to be the intercessor and protectress of all <strong><mark>Orthodox
    Christians</mark></strong>, to be throughout all holy and most pure and undefiled
    and Ever-virgin</p><p>&lt;…&gt;</p><p>Judge whether it is righteous for me to
    suffer thus from you and to hear this, being not guilty, that is, as far as the
    <strong><mark>Orthodox faith</mark></strong> is concerned.</p><p>&lt;…&gt;</p><p>But
    if the zeal for the truth which is after God, and the boldness with which we dare
    in God, trusting in your and our <strong><mark>Orthodox faith</mark></strong>
    and love, are displeasing to you</p></blockquote><p>(The confession of the Orthodox
    faith by Maxim, a monk of the Holy Mountain)</p><blockquote><p>We could offer
    you, for your assurance, many other powerful testimonies and indications from
    the books of Moses and the prophets, in proof that the only true, infallible and
    God-pleasing faith is – <strong>the gospel and apostolic faith, which the <mark>Orthodox
    Christians</mark> hold</strong>.</p></blockquote><p>(Answers of Christians against
    the Hagarenes, who blaspheme our Orthodox Christian faith)</p><h2>17th century</h2><h3>St
    Peter (Mohyla), metropolitan of Kiev<strong> </strong>(1596–1647)</h3><blockquote><p>The
    Orthodox, Catholic and Apostolic Faith consists in believing with the heart and
    confessing with the mouth the one Trihypostatic God, according to the teaching
    of the same Paul: “with the heart man believeth unto righteousness; and with the
    mouth confession is made unto salvation” (Rom. 10:10). Besides this, the Orthodox
    Christian must accept as certain and undoubted (VI Council, rule 28) that all
    the articles of the faith of the Catholic and <strong><mark>Orthodox Church</mark></strong>
    were handed down to her by our Lord Jesus Christ through His Apostles, expounded
    and established by the Ecumenical Councils</p><p>&lt;…&gt;</p><p>so they received
    from the Holy Apostles; so, and not otherwise, taught, handed down and established
    the Ecumenical and Local Councils and the teachers of the Church. The same does
    our <strong><mark>Orthodox</mark> and Catholic <mark>Church</mark></strong> contain.</p><p>&lt;…&gt;</p><p>And
    so it is enough for us firmly to hold and to believe what Christ taught us, in
    what the Eastern Catholic and <strong><mark>Orthodox Church</mark></strong> believes</p><p>&lt;…&gt;</p><p>that
    they may be the signs of the true sons of God, or of the <strong><mark>Orthodox</mark>
    Catholic and Apostolic <mark>Church</mark>.</strong></p><p>&lt;…&gt;</p><p>“In
    the name of the Father, and of the Son, and of the Holy Spirit. Amen” – he will
    pronounce exactly and unchangeably, according to the understanding of the Catholic
    and <strong><mark>Orthodox Church</mark></strong>.</p><p>&lt;…&gt;</p><p>For the
    reception of the dread Mysteries one must prepare according to the order of our
    <strong><mark>Orthodox Church</mark></strong>.</p></blockquote><p>(The Orthodox
    Confession of the Catholic and Apostolic Eastern Church)</p><h3>St Dmitry of Rostov
    (Tuptalo), hierarch (1651–1709)</h3><blockquote><p>What is greater: <strong>whether
    the catholic Orthodox Apostolic Church which is throughout the universe</strong>,
    or your Bryn? <strong><mark>The catholic Orthodox Apostolic Church</mark></strong>,
    (I speak not of walls and buildings, but of the multitude of the true-believing)
    not only in the Russian state, but in the Greek, and Arabian, and Syrian, and
    Egyptian lands, and in the Serbian, and Bulgarian, and in Dalmatia, and in Moldavia,
    and simply put, throughout the universe: your Bryn, however, is in only one corner
    of the Russian state, and it is as great against the whole c<strong><mark>atholic
    Orthodox Apostolic church</mark></strong>, as a single handful of water is great
    against the great sea.</p></blockquote><p>(The Search into the schismatic Bryansk
    faith, part 2, ch. 7)</p><h2>18th century</h2><h3>St Stephen (Yavorsky), metropolitan
    (1658–1722)</h3><blockquote><p>The same does our Holy <strong><mark>Orthodox Church</mark></strong>
    divinely teach about the holy icons, and teaches us, her children, the same theology.</p><p>&lt;…&gt;</p><p>Understand
    and divinely teach the same about the holy icons, according to the common teaching
    and establishment of the holy fathers, the Ecumenical Councils and the whole <strong><mark>Orthodox
    Church</mark></strong>.</p><p>&lt;…&gt;</p><p>Do you see, sons of the <strong><mark>Orthodox
    Church</mark></strong>, the nets of the adversaries, woven by wiles, and consider,
    what truth is in them?</p><p>&lt;…&gt;</p><p>I answer. Arius, and Nestorius, and
    the other heretics did not contradict the <strong><mark>Orthodox Church</mark></strong>
    in everything, yet they were heretics, and you call them so.</p><p>&lt;…&gt;</p><p>But
    you, sons of the <strong><mark>Orthodox Church</mark></strong>, stand firm in
    the faith which you have successively received from Christ and from the apostles</p><p>&lt;…&gt;But
    if you enter into the iconoclastic temples, and especially into the Calvinist
    kirches, you will find in them such a difference from the <strong><mark>Orthodox
    churches</mark></strong> as there is between a stable, or a stall for cattle,
    and a royal palace.</p><p>&lt;…&gt;</p><p>All that has been said above I conclude
    with this: that the <strong><mark>Orthodox Church</mark></strong> acts rightly
    and justly when she completely refuses to listen to the institutions of your iconoclastic
    tsars about the casting out of the holy icons and departs from them as from utter
    perdition.</p><p>&lt;…&gt;</p><p>Understand all this perfectly, son of the <strong><mark>Orthodox
    Church</mark></strong>, and doubt not at all in the holy icons</p></blockquote><p>(The
    Stone of Faith of the Orthodox-Catholic Eastern Church)</p><blockquote><p>The
    Holy <strong><mark>Orthodox Church</mark></strong> has full authority to establish
    laws about the holy fasts, adapting them to the needs of the time, and to incite
    true Christians to keep them according to conscience.</p><p>&lt;…&gt;</p><p>does
    not the Holy Church have a similar and even greater authority to impose a fast
    upon <strong><mark>Orthodox</mark> Christians</strong> by her own discretion and
    good judgment? And if the Old Testament people obeyed their teachers, then we
    all the more</p><p>&lt;…&gt;</p><p>From this it is evident that the Church of
    Christ (that is, the Ecumenical and Local Councils and the whole order of pastors
    and churchly teachers – successors of the apostles, <strong>Orthodoxly</strong>
    and unanimously confessing the holy <strong><mark>Orthodox</mark> faith</strong>)
    has the authority to establish laws.</p><p>&lt;…&gt;</p><p>all the more is there
    a need for churchly laws for the spiritual governance of the <strong><mark>Orthodox</mark>
    people</strong>, that they may live according to the spirit and not according
    to the flesh, and may subdue their passions to the spirit.</p></blockquote><p>(Fasting
    is the commandment of God, the teaching of the Orthodox Church on the holy fasts)</p><h2>19th
    century</h2><h3>St Philaret (Drozdov), metropolitan of Moscow (1782–1867)</h3><blockquote><p><em>272.
    Why is our Church called “Apostolic”?</em></p><p><em>The Church is called Apostolic
    because she unceasingly and unchangeably keeps from the apostles both the teaching
    and the succession of the gifts of the Holy Spirit through sacred ordination.
    In the same sense </em><strong><em><mark>the Church is also called Orthodox</mark></em></strong><em>,
    or True-believing</em><strong><em>.</em></strong></p></blockquote><p>(The Longer
    Catechism of the Orthodox Catholic Eastern Church, part 1)</p><h3>St Gregory (Postnikov),
    metropolitan (1784–1860)</h3><blockquote><p>For by the clear word of God and by
    the firm teaching of the whole truly <strong><mark>Orthodox</mark> Church of <mark>Christ</mark></strong>,
    the true Church of Christ must be with Bishops until the very second coming of
    Christ.</p><p>&lt;…&gt;</p><p>To think, to admit, and all the more to strive with
    special effort to prove that in our time the Church of Christ consists only of
    simple Christians not consecrated by any ordination, means to think, to admit,
    or yet with special effort to strive to prove an opinion directly contrary to
    the clear word of God and contrary to the ever-constant common and firm teaching
    of the whole <strong><mark>Orthodox Church</mark></strong></p><p>&lt;…&gt;</p><p>But
    to think, to admit and yet with special effort to strive to prove anything directly
    contrary to the clear word of God and to the ever-constant common and firm teaching
    of the whole <strong><mark>Orthodox Church</mark></strong></p><p>&lt;…&gt;</p><p>men
    who reject not only the <strong>teaching</strong> <strong><mark>of the Orthodox
    Church</mark></strong>, but Christianity itself</p><p>&lt;…&gt;</p><p>one or the
    other, by the clear word of God and by the ever-constant common and firm teaching
    of the whole <strong><mark>Orthodox Church</mark></strong>, which must continue
    until the very second coming of the Lord</p><p>&lt;…&gt;</p><p>the common and
    firm voice of the whole <strong><mark>Orthodox Church</mark></strong></p><p>&lt;…&gt;</p><p>The
    answer of the Orthodox Church dominant in the Russian State, with its foundation.</p><p><strong><mark>The
    Orthodox Church</mark></strong> says: “The Church created by the Son of God and
    God Jesus Christ, the Saviour of the world, is precisely she”, and in proof of
    her words presents that she has and holds everything that the Church created by
    the Lord must have and hold, both according to the word of God and according to
    the rules of the holy Councils and holy Fathers</p></blockquote><p>(The truly
    ancient and truly Orthodox Church of Christ, set forth in relation to the so-called
    Old Belief)</p><h2>20th century</h2><h3>St Arkady (Ostalsky), hieromartyr (1889–1937)</h3><blockquote><p>Do
    you wish to test the words and counsels of the holy <strong><mark>Orthodox Church</mark></strong>
    – walk the path of Christian life</p><p><em>&lt;…&gt;</em></p><p><em>The solution
    of this question by the experience </em><strong><em><mark>of the Orthodox Church</mark></em></strong><em>
    </em><strong><em>of Christ</em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p>Of
    what do they accuse the <strong><mark>Orthodox Church</mark></strong>?</p><p>&lt;…&gt;</p><p>Let
    us consider, then, whether the <strong><mark>Orthodox Church</mark></strong> is
    truly hostile to popular education.</p><p>II. The <strong><mark>Orthodox Church</mark></strong>
    is not only not an enemy of popular education, but she was the first to take it
    up and carried it until the latest times.</p><p>&lt;…&gt;</p><p>Thus the <strong><mark>Orthodox
    Church</mark></strong> is the protectress and the source of true teaching and
    upbringing, giving to parents good, obedient and caring children, to the fatherland
    honest, industrious and patient sons, to the world true men, and to heaven angel-like
    citizens and companions of the saints.</p></blockquote><p>(“We must not fear any
    sufferings...”. Works, vol. I)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
