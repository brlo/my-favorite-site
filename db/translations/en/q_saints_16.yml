    parent: Church
    title: The apostles — builders of the Church of Christ
    priority: 9
  body: '<h2>4th century</h2><h3>Blessed Jerome of Stridon, monk (c. 347–420)</h3><blockquote><p>But
    as we have already had a long discussion and the protracted controversy has wearied
    out the attention of our audience, I will tell you my opinion briefly and without
    reserve: <strong>We ought to remain in that Church which was founded by the Apostles
    and continues to this day. If ever you hear of any that are called Christians
    taking their name not from the Lord Jesus Christ, but from some other, for instance,
    Marcionites, Valentinians, Men of the mountain or the plain, you may be sure that
    you have there not the Church of Christ, but the synagogue of Antichrist. For
    the fact that they took their rise after the foundation of the Church is proof
    that they are those whose coming the Apostle foretold</strong>. And let them not
    flatter themselves if they think they have Scripture authority for their assertions,
    since the devil himself quoted Scripture, and the essence of the Scriptures is
    not the letter, but the meaning. Otherwise, if we follow the letter, we too can
    concoct a new dogma and assert that such persons as wear shoes and have two coats
    must not be received into the Church.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians">The
    Dialogue Against the Luciferians</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p>Jesus Christ, although He said that
    after His glorification all who believe in Him would receive in abundance the
    powers of the Holy Spirit (John 7:39), at the same time promised to send down
    (John 14:16–26, 16:7), and in fact <strong>after Pentecost sent down the Holy
    Spirit at first upon the apostles alone</strong> (Acts 2:2–4). “<strong>This was
    done by Him with the purpose that the apostles, being the first filled with the
    Holy Spirit, should thereby serve as organs and mediators in His sending down
    upon the rest of the believers, and for this reason to them alone the Saviour
    gave the right to perform those sacred actions, or sacraments, through which the
    grace of God was to be communicated to the believers by the Holy Spirit, such
    as, for example, baptism (Matt. 28:19), communion (Luke 22:19–20), repentance
    (John 20:22–23)</strong>”. The apostles, endued with the power of the Holy Spirit,
    “went forth (by the command of the Lord), and preached every where, the Lord working
    with them, and confirming the word with signs following” (Mark 16:20), whereby
    God bore witness that they were His sent ones. They also received from the Lord
    authority not only to communicate the grace of Christ to the believers, but also
    through ordination to transmit to their successors their commission to bring down
    the grace-given gifts, which (successors) they appointed (1 Tim. 1:5; 1 Tim. 5:22;
    cf. Acts 20:28). The Churches founded by the apostles became mothers for all the
    subsequent local Churches, including the Eastern Greco-Russian Church; therefore
    the Church of Christ, although she has the Lord Himself as her corner-stone, is
    by the word of God established “on the foundation of the apostles” (Eph. 2:20;
    Rev. 21:14).</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: 9SL4P1ja_Апостольство__признак_Церкви_Христовой
  path: Apostolicity-a-mark-of-the-Church
  title: Apostolicity — a mark of the Church of Christ
  menu:
    parent: Church
    title: Apostolicity — a mark of the Church of Christ
    priority: 9
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Through
    the apostles the Church received from the Lord her structure, <strong>with them
    she is in constant inward connection, consisting in the hierarchy received by
    her from the apostles (and preserved through unbroken succession), the teaching,
    the sacred actions and the government.</strong> <strong><mark>In the true Church
    of Christ is found everything essential that she possessed in the time of the
    apostles, and it must remain in her for ever</mark></strong>. From this <strong><mark>only
    that Church is the apostolic Church which </mark><u><mark>has from the apostles
    themselves the succession</mark></u><mark> of the gifts of the Holy Spirit through
    sacred ordination, that is, ascends to the apostles through the unbroken succession
    from them of the divinely established </mark><u><mark>hierarchy</mark></u><mark>
    (the episcopate), and which is faithful to them in </mark><u><mark>teaching, sacred
    action and government</mark></u></strong>. <strong>Apostolicity, being the most
    important property of the Church of Christ, constitutes her essential and chief
    mark</strong>. Without this mark all who bear the name of Christian might consider
    themselves belonging to the Church of Christ. Consequently, <strong>if the sectarians
    call their community the Church of Christ, but have no unbroken hierarchical succession
    from the apostles and do not keep the apostolic tradition (2 Thess. 2:15), then
    their community, having broken its connection with the apostles, is deprived of
    the grace of God</strong>, needful for spiritual life, and is not the apostolic
    Church of Christ, but a self-willed assembly (Ps. 1:1, 25:5; Rev. 2:9, 3:9), unable
    to save its members. A Christian is a member of the body of Christ – the Church
    (1 Cor. 12:12–27), and must not separate himself from this life-giving body; otherwise,
    instead of true life, he will receive eternal death. “Break off a branch from
    a tree”, says St Cyprian of Carthage, – “the broken-off branch will lose the power
    to grow; cut off a stream from its source, – the cut-off stream dries up... And
    dost thou think that thou canst stand and live apart from the Church, building
    for thyself other various dwellings?”</p></blockquote><p>(The Orthodox Church
    and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: eXGExiQA_Русская_Православная_Церковь_есть_истинно_апостольская_Церковь
  path: Russian-Orthodox-Church-apostolic
  title: The Russian Orthodox Church is the true apostolic Church
  menu:
    parent: Church
    title: The Russian Orthodox Church — an apostolic Church
    priority: 10
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>The
    Eastern Greco-Russian Church (ROC — tr.), having through unbroken succession from
    the apostles a divinely established hierarchy of three degrees, remains faithful
    to the apostles in teaching (the “creed” expresses the genuine teaching of the
    Lord and of the apostles), in sacred action (the order of worship and of the performance
    of the sacraments ascends to the apostles) and in government, is guided by the
    apostolic canons and the canons of the ecumenical councils, which canons are a
    further development of the apostolic canons). And therefore she alone is the true
    apostolic Church, and to her alone belongs by right the name of “Orthodox”</strong>,
    as of one who “rightly” (cf. 2 Tim. 2:15) or unchangeably keeps the teaching of
    Christ handed down by the apostles by word or by epistle, and remains faithful
    in everything established by the Lord Jesus Christ and His apostles. “What we
    confess”, writes Bishop Theophan, – “and how we work out our salvation was in
    force among our fathers, grandfathers, great-grandfathers and all the Russians
    from the very time of their enlightening with the true faith under St Vladimir.
    Of this it is already a thousand years... But go further on: you will see the
    same confession and the same working out of salvation among the Greeks, from whom
    we received the Holy Faith. Go through the centuries among them; you will reach
    the councils that defended and established the universal truth... Move on still
    further, pass through the centuries of persecutions, reach the apostolic age,
    and you will see: there the same confession and the same working out of salvation
    as is now held and acted upon among us. And what the apostles taught and established
    they received from the Lord, and the Lord spoke and acted as He received from
    His Father, in the mystery of the Most Holy Trinity. This is where our faith comes
    from! Here is its source! See how it flowed from the depths of God, ran on through
    the course of the centuries and flowed down to us!”</p></blockquote><p>(The Orthodox
    Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: kqh8yFBP_Цель_Церкви
  path: The-purpose-of-the-Church
  title: The purpose of the Church
  menu:
    parent: Church
    title: The purpose of the Church
    priority: 11
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong><mark>The
    Church of Christ has as her aim to bring all men (Matt. 28:19–20; Mark 16:15–16;
    Luke 24:47 and elsewhere) to reunion with God – the Source of life and blessedness</mark></strong>
    (John 14:6, 17:21); and since man through sin fell away from union with God and
    became “a son of disobedience” (Eph. 2:3), the <strong>Church, as the continuer
    of the work of Christ – the salvation of mankind, must regenerate fallen man to
    a new, holy life</strong>. For the accomplishment of this the Church possesses
    not only human but also “divine powers” (2 Pet. 1:3–4); in her abides and will
    abide to the end of the age the Redeemer Himself, Jesus Christ (Matt. 28:20),
    and the Holy Spirit (John 14:16), Who, giving the grace of God in the sacraments,
    makes our own, by the good will of God the Father, everything needful for our
    salvation and through Christ leads the believers to the Father (John 14:6).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: zhNC_Церковь_новый_Израиль
  path: Church-the-new-Israel
  title: The Church — the new Israel
  menu:
