  title: Sunday as a day off / The Edict of Emperor Constantine (321)
  body: '<h2>The Edict</h2><h3>Russian version (in English)</h3><blockquote><p>The
    Emperor Constantine to Elpidius.</p><p>All judges and craftsmen <strong>must not
    work on</strong> <strong>the venerable</strong> <strong>day of the sun</strong>.
    Farmers, however, may freely engage in field work on that day, because it often
    happens that work in the field or in the vineyard cannot be postponed. One should
    not allow the harvest given by heavenly Providence to be lost because of this.</p></blockquote><p>(<a
    href="https://en.wikipedia.org/wiki/Code_of_Justinian">Codex Iustinianus, Book
    III, Chapter XII, 3</a>)</p><h3>In Latin</h3><blockquote><p>Imp. Constantinvs
    A. Elpidio.</p><p>Omnes iudices urbanaeque plebes et artium officia cunctarum
    uenerabili <strong>die solis quiescant</strong>. ruri tarnen positi agrorum culturae
    libero licenterque inseruiant, quoniam frequenter euenit, ut non alio aptius die
    frumenta sulcis aut uineae scrobibus commendentur, ne occasione momenti pereat
    commoditas caelesti prouisione concessa.</p><p>PP. v non. Mart. Crispo II ET CONSTANTINO
    II CONSS.</p></blockquote><p>(<a href="https://archive.org/details/codexiustinianu00kruegoog/page/247/mode/2up">Codex
    Iustinianus, Book III, Chapter XII, 3 // p. 248</a>)</p><h3>In English translation</h3><blockquote><p>3
    The Emperor Constantine to Elpidius.</p><p>Let all judges, the people of cities,
    and those employed in all trades, <strong>remain quiet on</strong> <strong>the
    Holy Day of</strong> <strong>Sunday</strong>. Persons residing in the country,
    however, can freely and lawfully proceed with the cultivation of the fields; as
    it frequently happens that the sowing of grain or the planting of vines cannot
    be deferred to a more suitable day, and by making concessions to Heaven the advantage
    of the time may be lost.</p><p>Given on the Nones of March, during the Consulate
    of Crispus and Constantine, Consuls for the second time, 311.</p></blockquote><p>(<a
    href="https://web.archive.org/web/20130727022718/http://www.freewebs.com/vitaphone1/history/justinianc.html">Codex
    Iustinianus, III, XII, 3</a>)</p><h2>Historical background</h2><ol><li><p>In the
    1st century BC, Rome began to use the seven-day week instead of the eight-day
    one, and the names of the days of the week were changed from letters (A, B, C,
    D, E, F, G, H) to the names of celestial bodies: Saturn (Sat), the Sun (Sun),
    the Moon (Mon), Mars (Tue), Mercury (Wed), Jupiter (Thu), and Venus (Fri) (<a
    href="https://en.wikipedia.org/wiki/Roman_calendar#Weeks">wiki</a>).</p></li><li><p>Saturday
    was not a day off in the Roman Empire, the Byzantine Empire, Rus, or the Russian
    Empire.</p></li><li><p>In the Roman Empire, the phenomenon of a weekly day off
    emerged in 321. By the edict of Emperor Constantine, it became the day of the
    sun (Sunday). The edict establishing Sunday as a day off did not in any way concern
    Saturday, which remained a working day as before.</p></li><li><p>In the Russian
    Empire, by contrast, a day off appeared only in July 1897, by a decree of Emperor
    Nicholas II. The second day off (Saturday) first appeared on Russian lands in
    March 1967.</p></li><li><p>The Jewish people consider Saturday the day off, since
    for them it is the last (seventh) day of the week. Today Israel has in effect
    one and a half days off, because preparations for the Sabbath begin in the middle
    of Friday. The time free from work is the second half of Friday and the whole
    of Saturday.</p></li><li><p>Christians <a href="https://bibleox.com/en/en/w/Ab21l_Abolition_of_the_Law_of_Moses#HH-They-Do-Not-Keep-the-Sabbath-Rest">did
    not observe</a> complete abstinence from work on Saturday, because the <a href="https://bibleox.com/en/en/w/Ab21l_Abolition_of_the_Law_of_Moses#HH-The-Law-of-Moses-Is-Abolished">Law
    of Moses was abolished</a> with the coming of Christ.</p></li></ol>'
