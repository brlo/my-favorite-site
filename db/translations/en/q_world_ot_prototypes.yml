  - src: интересные-животные
    path: An1m_Interesting_Animals
    title: Interesting Animals
    meta_desc: Bible quotes about interesting animals of antiquity
    menu: { parent: World, title: Interesting Animals, priority: 1 }
    body: |-
      <p>The flying serpent, which lays eggs:</p><blockquote>“The burden against the beasts of the South. Through a land of trouble and anguish, from which came the lioness and lion, the viper and <b>fiery flying serpent</b>, they will carry their riches on the backs of young donkeys, and their treasures on the humps of camels, to a people who shall not profit” (<a href="https://bibleox.com/en/eng-nkjv/is/30/#L6">Is. 30:6</a>)</blockquote><blockquote>“There the <b>arrow snake</b> shall make her nest and lay eggs and hatch, and gather them under her shadow; there also shall the hawks be gathered, every one with her mate” (<a href="https://bibleox.com/en/eng-nkjv/is/34/#L15">Is. 34:15</a>; the Russian Synodal translation has here “<b>flying serpent</b>”)</blockquote><blockquote>“Do not rejoice, all you of Philistia, because the rod that struck you is broken; for out of the serpent’s roots will come forth a viper, and its offspring will be a <b>fiery flying serpent</b>” (<a href="https://bibleox.com/en/eng-nkjv/is/14/#L29">Is. 14:29</a>)</blockquote>Winged lizards:<blockquote>“Also <b>every creeping thing that flies</b> is unclean for you; they shall not be eaten” (<a href="https://bibleox.com/en/eng-nkjv/vtor/14/#L19">Deut. 14:19</a>)</blockquote>Behemoth, whose description resembles a dinosaur:<blockquote>“Look now at the <b>behemoth</b>, which I made along with you; he eats grass like an ox. See now, his strength is in his hips, and his power is in his stomach muscles. <b>He moves his tail like a cedar</b>; the sinews of his thighs are tightly knit. His bones are like beams of bronze, his ribs like bars of iron. He is the first of the ways of God; only He who made him can bring near His sword. &lt;…&gt; The lotus trees cover him with their shade; the willows by the brook surround him. Indeed the river may rage, yet he is not disturbed; he is confident, though the Jordan gushes into his mouth, though he takes it in his eyes, or one pierces his nose with a snare” (<a href="https://bibleox.com/en/eng-nkjv/iov/40/#L15-19,22-24">Job. 40:15-19,22-24</a>)</blockquote>Leviathan, whose description resembles a dinosaur:<blockquote>“Can you draw out <b>Leviathan</b> <b>with a hook</b>, or snare his tongue with a line which you lower? Can you put a reed through his nose, or pierce his jaw with a hook? Will he make many supplications to you? Will he speak softly to you? Will he make a covenant with you? Will you take him as a servant forever? Will you play with him as with a bird, or will you leash him for your maidens? Will your companions make a banquet of him? Will they apportion him among the merchants? <b>Can you fill his skin with harpoons, or his head with fishing spears?</b>” (<a href="https://bibleox.com/en/eng-nkjv/iov/41/#L1-7">Job. 41:1-7</a>)</blockquote><blockquote>“Indeed, any hope of overcoming him is false; <b>shall one not be overwhelmed at the sight of him?</b> &lt;…&gt; <b>I will not conceal his limbs, his mighty power, or his graceful proportions</b>. Who can remove his outer coat? Who can approach him with <b>a double bridle</b>? Who can open the doors of his face, <b>with his terrible teeth all around? His rows of scales are his pride, shut up tightly as with a seal; one is so near another that no air can come between them; they are joined one to another, they stick together and cannot be parted</b>. His sneezings flash forth light, <b>and his eyes are like the eyelids of the morning. Out of his mouth go burning lights; sparks of fire shoot out. Smoke goes out of his nostrils, as from a boiling pot and burning rushes. His breath kindles coals, and a flame goes out of his mouth. Strength dwells in his neck, and sorrow dances before him.</b> The folds of his flesh are joined together; they are firm on him and cannot be moved. His heart is as hard as stone, even as hard as the lower millstone. <b>When he raises himself up, the mighty are afraid; because of his crashings they are beside themselves. Though the sword reaches him, it cannot avail; nor does spear, dart, or javelin. He regards iron as straw, and bronze as rotten wood. The arrow cannot make him flee; slingstones become like stubble to him. Darts are regarded as straw; he laughs at the threat of javelins. His undersides are like sharp potsherds; he spreads pointed marks in the mire. He makes the deep boil like a pot; he makes the sea like a pot of ointment. He leaves a shining wake behind him; one would think the deep had white hair. On earth there is nothing like him, which is made without fear. He beholds every high thing; he is king over all the children of pride</b>” (<a href="https://bibleox.com/en/eng-nkjv/iov/41/#L9,12-34">Job. 41:9,12-34</a>)</blockquote>

  - src: прообраз-крестной-жертвы-Авраам-и-Исаак
    path: Ai1s_Abraham_and_Isaac
    title: The Sacrifice of Christ on the Cross — Abraham and Isaac
    meta_desc: Bible quotes on the typological meaning of Abraham’s offering of his son Isaac
    menu: { parent: Old Testament/Prototypes, title: The Sacrifice on the Cross — Abraham and Isaac, priority: 1 }
    body: |-
      <p>The Old Testament prototype of Christ’s sacrifice on the Cross is the offering of Isaac. Abraham (the father) offers Isaac (his only son) as a sacrifice:</p><blockquote>“Then He said, ‘Take now <b>your son, your only son</b> Isaac, whom you love, and go to the land of Moriah, and <b>offer him there as a burnt offering on one of the mountains</b> of which I shall tell you’” (<a href="https://bibleox.com/en/eng-nkjv/gen/22/#L2">Gen. 22:2</a>)</blockquote><blockquote>“For God so loved the world that <b>He gave His only begotten Son</b>” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L16">John. 3:16</a>)</blockquote>Isaac carries up the mountain that on which he is to be sacrificed:<blockquote>“So Abraham took the wood of the burnt offering and <b>laid it on Isaac</b> his son; and he took the fire in his hand, and a knife, and the two of them went together” (<a href="https://bibleox.com/en/eng-nkjv/gen/22/#L6">Gen. 22:6</a>)</blockquote><blockquote>“So they took Jesus and led Him away. And He, <b>bearing His cross</b>, went out to a place called the Place of a Skull, which is called in Hebrew, Golgotha, where they crucified Him” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L16-18">John. 19:16-18</a>)</blockquote>Abraham laid Isaac on the altar:<blockquote>“Was not Abraham our father justified by works when he <b>offered Isaac his son on the altar</b>?” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L21">James. 2:21</a>)</blockquote><blockquote>“Him, being delivered by the determined purpose and foreknowledge of God, <b>you have taken</b> by lawless hands, <b>have crucified, and put to death</b>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L23">Act. 2:23</a>)</blockquote>On the Cross, as on an altar, the salvation of mankind is accomplished:<blockquote>“and that He might reconcile them both to God in one body <b>through the cross, thereby putting to death the enmity</b>” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L16">Eph. 2:16</a>)</blockquote>

  - src: крест-Моисей
    path: Mo2s_The_Cross_Moses
    title: The Cross — Moses
    meta_desc: Bible quotes on the typological meaning of Moses standing on the hill in the form of a cross
    menu: { parent: Old Testament/Prototypes, title: The Cross — Moses, priority: 2 }
    body: |-
      <h2>The Battle with the Amalekites</h2><p>A prototype of the saving sacrifice of Jesus Christ on the Cross is an Old Testament event: the battle of the Jewish people with the Amalekites, in which the Jews prevailed when the prophet Moses, praying on the hill, raised his hands (<a href="https://bibleox.com/en/eng-nkjv/ish/17/#L11">Ex. 17:11</a>), and when he lowered them from weariness, the people began to give way to the enemy. The prophet Moses on the hill during the battle of the Jews with the Amalekites; his hands are supported by Aaron and Hur (<a href="https://bibleox.com/en/eng-nkjv/ish/17/#L11-12">Ex. 17:11-12</a>). The battle went on all day, and Moses could not hold up his hands for so long, so Aaron and Hur helped Moses: they put a stone under him to sit on and held his hands from either side — Aaron one hand and Hur the other (if you like, as the nails held the hands of Christ). And in this position Moses remained on the hill (as the Cross of Christ on the hill) until the end of the day (<a href="https://bibleox.com/en/eng-nkjv/ish/17/#L12">Ex. 17:12</a>) (as did Christ). So it turns out:</p><ul><li><p>The army of Joshua (Greek Ἰησοῦς, “Jesus” — the name of the Jewish commander) [<em>As also the army of Jesus Christ, the leader of the Church</em>]</p></li></ul><ul><li><p>defeated the Amalekites with the help of the cross [<em>as Christ also won the victory by the Cross</em> (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L16">Eph. 2:16</a>)],</p></li></ul><ul><li><p>which Moses depicted on the hill [<em>As also the Cross of Christ on Golgotha</em>],</p></li></ul><ul><li><p>who was held in this position [<em>As Christ too was held on the Cross</em>]</p></li></ul><ul><li><p>until the end of the day [<em>As was Christ</em>].</p></li></ul>

  - src: еврейский-стан-крест
    path: Cm3p_The_Cross_the_Camp_of_Israel
    title: The Cross — the Camp of Israel
    meta_desc: Bible quotes on the cross-shaped arrangement of the camp of Israel
    menu: { parent: Old Testament/Prototypes, title: The Cross — the Camp of Israel, priority: 3 }
    body: |-
      <p>God establishes the arrangement of the tribes in the camp of Israel. This is how they must stand and how they must move. The camp of Israel forms a cross.</p><ul><li><p>In the center of the camp is the Tabernacle of Meeting:</p></li></ul><blockquote><p>“Everyone of the children of Israel shall camp by his own standard, beside the emblems of his father’s house; <strong>they shall camp some distance from the tabernacle of meeting</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L2">Num. 2:2</a>)</p><p>The NRSV renders this: “they shall camp facing the tent of meeting <strong>on every side</strong>” (<a href="https://bibleox.com/en/en-nrsv/chis/2/#L2">Num. 2:2</a>).</p></blockquote><p>The tribe of Levi is also placed in the center of the camp:</p><blockquote><p>“And the tabernacle of meeting shall move out with <strong>the camp of the Levites in the middle of the camps</strong>; as they camp, so they shall move out, everyone in his place, by their standards” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L17">Num. 2:17</a>)</p></blockquote><ul><li><p>On the east: the tribe of Judah, then Issachar, then Zebulun:</p></li></ul><blockquote><p>“<strong>On the east side</strong>, toward the rising of the sun, those of the standard of the forces with <strong>Judah</strong> shall camp &lt;...&gt; Those who camp next to him shall be the tribe of <strong>Issachar</strong> &lt;...&gt; Then comes the tribe of <strong>Zebulun</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L3,5,7">Num. 2:3,5,7</a>)</p></blockquote><ul><li><p>On the south: the tribe of Reuben, then Simeon, then Gad:</p></li></ul><blockquote><p>“<strong>On the south side</strong> shall be the standard of the forces with <strong>Reuben</strong> &lt;...&gt; Those who camp next to him shall be the tribe of <strong>Simeon</strong> &lt;...&gt; Then comes the tribe of <strong>Gad</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L10,12,14">Num. 2:10,12,14</a>)</p></blockquote><ul><li><p>On the west: the tribe of Ephraim (from Joseph), then Manasseh (from Joseph), then Benjamin:</p></li></ul><blockquote><p>“<strong>On the west side</strong> shall be the standard of the forces with <strong>Ephraim</strong> according to their armies &lt;...&gt; Next to him comes the tribe of <strong>Manasseh</strong> &lt;...&gt; Then comes the tribe of <strong>Benjamin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L18,20,22">Num. 2:18,20,22</a>)</p></blockquote><ul><li><p>On the north: the tribe of Dan, then Asher, then Naphtali:</p></li></ul><blockquote><p>“The standard of the forces with <strong>Dan</strong> shall be <strong>on the north side</strong> &lt;...&gt; Those who camp next to him shall be the tribe of <strong>Asher</strong> &lt;...&gt; Then comes the tribe of <strong>Naphtali</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L25,27,29">Num. 2:25,27,29</a>)</p></blockquote><p><strong><em>* </em></strong><em>Such an arrangement requires 13 camps (1+3+3+3+3), while Jacob had only 12 sons. All the tribes are listed here, but instead of the one tribe of Joseph, the camp has the two tribes of his sons: Manasseh and Ephraim.</em></p><h2>Each Side of the Cross Was Counted by the Name of the Tribe Nearest the Center</h2><p>First the number of the camp of Judah is given:</p><blockquote><p>“On the east side, toward the rising of the sun, those of the standard of the forces with Judah shall camp according to their armies &lt;...&gt; And his army was numbered at <strong>seventy-four thousand six hundred</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L3-4">Num. 2:3-4</a>)</p></blockquote><p>Then the numbers of the people in the tribes that come after Judah are listed:</p><blockquote><p>“And his army was numbered at <strong>fifty-four thousand four hundred</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L6">Num. 2:6</a>)</p></blockquote><blockquote><p>“And his army was numbered at <strong>fifty-seven thousand four hundred</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L8">Num. 2:8</a>)</p></blockquote><p>Then everything is added up and called the camp of Judah (the one nearest the center), whose number already includes all three camps:</p><blockquote><p>“All who were numbered according to their armies <strong>of the forces with Judah</strong>, <strong>one hundred and eighty-six thousand four hundred</strong> — these shall break camp first” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L9">Num. 2:9</a>)</p></blockquote><p>The same is repeated for all the other sides of the cross.</p><h2>In the Form of a Cross the Camp Stood and Also Moved</h2><blockquote><p>“<strong>As they camp, so they shall move out, everyone in his place</strong>, by their standards. &lt;...&gt; Thus the children of Israel did according to all that the LORD commanded Moses; <strong>so they camped</strong> by their standards <strong>and so they broke camp, each one by his family</strong>, according to their fathers’ houses” (<a href="https://bibleox.com/en/eng-nkjv/chis/2/#L17,34">Num. 2:17,34</a>)</p></blockquote>

  - src: крест-и-крещение-переход-через-море
    path: Cb4s_The_Cross_and_Baptism_the_Crossing_of_the_Sea
    title: The Cross and Baptism — the Crossing of the Sea
    meta_desc: Bible quotes on the typological meaning of the crossing of the Red Sea
    menu: { parent: Old Testament/Prototypes, title: The Cross and Baptism — the Crossing of the Sea, priority: 4 }
    body: |-
      <p>The crossing of the Jewish people along the bottom of the Red Sea out of Egyptian captivity is a prototype of Baptism (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L2">1 Cor. 10:2</a>), of leaving the slavery of sin. The prophet Moses commands the waters of the Red Sea to return to their place (<a href="https://bibleox.com/en/eng-nkjv/ish/14/#L26-27">Ex. 14:26-27</a>). God told the prophet Moses to raise his rod and divide the sea (<a href="https://bibleox.com/en/eng-nkjv/ish/14/#L16,21">Ex. 14:16,21</a>), and when the people had crossed to the other side, Moses was to command the waters with his hand to return to their place (<a href="https://bibleox.com/en/eng-nkjv/ish/14/#L26-27">Ex. 14:26-27</a>). Logically, this is done with a horizontal movement, in contrast to the previous, dividing movement. The result is a cross:</p><ul><li><p>the dividing vertical movement “before”.</p></li><li><p>the joining horizontal movement “after”.</p></li></ul><p>The result is a cross (this “|” and this “—” equal “＋”). By a cross the Jews were saved from slavery. So too are we saved from the slavery of sin by the Cross of Christ, being immersed in the waters of Baptism.</p>

  - src: крест-Иаков
    path: Jb5l_The_Cross_Jacobs_Blessing
    title: The Cross — Jacob’s Blessing
    meta_desc: Bible quotes on the typological meaning of Jacob’s cross-shaped blessing
    menu: { parent: Old Testament/Prototypes, title: The Cross — Jacob’s Blessing, priority: 5 }
    body: |-
      <p>Jacob’s cross-shaped blessing of his grandsons. Joseph brought his sons and placed each one directly opposite the corresponding hand of his father, but Jacob crossed his hands, laying them the other way round:</p><blockquote>“And Joseph took them both, Ephraim with his right hand toward Israel’s left hand, and Manasseh with his left hand toward Israel’s right hand, and brought them near him. Then Israel stretched out his right hand and laid it on Ephraim’s head, who was the younger, and his left hand on Manasseh’s head, <b>guiding his hands knowingly</b>, for Manasseh was the firstborn” (<a href="https://bibleox.com/en/eng-nkjv/gen/48/#L13-14">Gen. 48:13-14</a>)</blockquote>

  - src: EMRx_Крест__буква_тау
    path: Tw6l_The_Cross_the_Letter_Tav
    title: The Cross — the Letter Tav «𐤕»
    title_sub: In the vision of the prophet Ezekiel, an image of the sign of the cross that the early Christians traced with a finger on the forehead
    menu: { parent: Old Testament/Prototypes, title: The Cross — the Letter Tav, priority: 6 }
    references: |-
      <h3>Related Material</h3><ul><li><p><a href="https://www.pravoslavie.ru/110001.html">https://www.pravoslavie.ru/110001.html</a> (in Russian)</p></li></ul>
    body: |-
      <p><strong>In the vision of the prophet Ezekiel, the scribe was to put the sign </strong>«𐤕»<strong> (the Phoenician letter Tav) on the foreheads of certain people.</strong></p><p>The prophet Ezekiel sees a vision of the deeds of the Jews that are abominable to God, for which God sends executioners against them, headed by a scribe. The scribe puts a sign on the foreheads of those people to whom all those abominations are as repugnant as they are to God. Those who bear these seals, by God’s command, will not be touched by the punishment.</p><blockquote><p>“and the LORD said to him, ‘Go through the midst of the city, through the midst of Jerusalem, and <strong>put a mark on the foreheads of the men who sigh and cry over all the abominations that are done within it.</strong>’ To the others He said in my hearing, ‘Go after him through the city and kill &lt;…&gt; but <strong>do not come near anyone on whom is the mark</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/iez/9/#L4-6">Ezek. 9:4-6</a>).</p></blockquote><p>In Hebrew “put a mark” is written as «הִתְוִיתָ <strong>תָּו</strong>» [taw-vaw' tawv].</p><p>Literally it can be translated as “draw a <strong>תָּ</strong>” (the letter Tav), but the prophet Ezekiel was born at a time when the Jews still used the Phoenician script, or the Paleo-Hebrew script derived from the Phoenician, in which the letter Tav is written like this:<strong> </strong>«𐤕». Thus, literally the following is written: “<strong>draw </strong>𐤕”.</p><p>In the same way the early Christians traced the cross on their foreheads: <a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82%D0%BD%D0%BE%D0%B5-%D0%B7%D0%BD%D0%B0%D0%BC%D0%B5%D0%BD%D0%B8%D0%B5">the sign of the cross (in Russian)</a></p><hr><p>The Jews used the Phoenician alphabet (the Paleo-Hebrew alphabet derived from the Phoenician) from roughly the 10th to the 7th century before the Nativity of Christ. That is, it was used before the Babylonian captivity. The Jews were carried off to Babylon in several stages over 16 years (<a href="https://en.wikipedia.org/wiki/Babylonian_captivity">598–582 BC</a>).</p><p>The prophet Ezekiel lived in the years <a href="https://en.wikipedia.org/wiki/Ezekiel">c. 622 – c. 570 BC</a> (52 years in all).</p><p>At <a href="https://azbyka.ru/days/sv-iezekiil">25 years of age</a> (in Russian) he was carried off into captivity with his people.</p><p>That is, he was born and educated while the Phoenician script was still in use.</p><p>At <a href="https://en.wikipedia.org/wiki/Ezekiel">30 years of age</a> his prophetic ministry begins (<a href="https://bibleox.com/en/eng-nkjv/iez/1/#L1">Ezek. 1:1</a>).</p><p>At this time Ezekiel writes his prophetic book.</p><p>We are interested in the event described in chapters 8–9, which takes place a further 1 year and two months later (<a href="https://bibleox.com/en/eng-nkjv/iez/8/#L1">Ezek. 8:1</a>).</p><p>One way or another, we arrive somewhere at the boundary of the 7th–6th centuries BC, at the very beginning of the Babylonian captivity, when the gradual formation of a new script among the Jews is only beginning. The alphabet did not change at once. This happened over a long period in captivity.</p><p>Most likely the prophet still used the Phoenician script, understood by the Jewish people, and accordingly wrote Tav like this: «𐤕». And if this is correct, then the scribe was to put the symbol «𐤕» on people’s foreheads, delivering them from punishment, which also points us to the saving meaning of the Cross of the Lord.</p>
