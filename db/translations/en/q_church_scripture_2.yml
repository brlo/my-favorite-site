      <ol><li><p>«<em>Therefore say this, it is said, adding that </em><strong><em>He gave the law for a help</em></strong><em>, that is, the Gospel law, so that those who heed it would say: </em><strong><em>not as this word, for which it is not lawful to give gifts</em></strong><em>, for those who speak only from their own heart sell a lie; but the saving and true law of God, that is, the Gospel revelation, which is given as a help to those living on earth, is not </em><strong><em>as this word</em></strong><em>, that is, the word of the false prophets. And besides, one need not give gifts for it, whereas, as I said not long ago, some buy the lying words of sorcerers for money, while the heavenly revelation is offered (freely) to those who wish</em>» (<a href="https://azbyka.ru/otechnik/Kirill_Aleksandrijskij/tolkovanie-na-proroka-isaiyu/1">Cyril of Alexandria (376-444)</a>, Commentary on Isaiah; translated from the Russian)</p></li><li><p><a href="https://en.wikipedia.org/wiki/Sola_scriptura">https://en.wikipedia.org/wiki/Sola_scriptura</a></p></li><li><p><em>«Is it not remarkable that all who fall away from the Church constantly speak of their respect for Holy Scripture and, at the same time, very soon pass on to distorting even the very books of Scripture! As soon as people leave the Church, they at once begin to interpret Scripture in their own way, and each interprets it differently. Christ prayed to God the Father for the unity of all who believe in Him; the apostles exhorted to be of one mind and spoke of the unity of the faith. It turns out that without the Church no unity is possible. Once again a Babylonian “confusion of tongues” must result. In the Church the faith remains one and the same for millennia, always equal to itself. But among those who have fallen away from the Church it changes almost daily. New heretics and sectarians constantly appear, and each of their teachers preaches differently. It is clear that without the Church, first of all, the teaching of Christ perishes and is replaced by short-lived human speculations»</em> (<a href="https://azbyka.ru/otechnik/Ilarion_Troitskij/khristianstva-net-bez-tserkvi/#">Hieromartyr Hilarion (Troitsky) (1886-1929), There Is No Christianity Without the Church</a>; translated from the Russian)</p></li><li><p>Septuagint: «For He gave the law as a help, that they might say: not as this word, concerning which there are no gifts to give for it» (<a href="https://bibleox.com/en/gr-lxx-byz/is/8/#L20">Is. 8:20, LXX</a>; translated from the Greek). It speaks only of the Pentateuch of Moses. Besides the difference in wording, it points out that the diviners demand payment for their predictions.</p></li></ol><h3>Useful Materials (in Russian)</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/3_1">https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/3_1</a></p></li><li><p>An article analyzing attempts to show “Sola Scriptura” in Scripture: <a href="https://bibleox.com/ru/ru/w/tynP_%D0%9A%D0%B0%D0%BA_%D0%BF%D1%80%D0%BE%D1%82%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%82_%D0%BF%D0%BE%D1%81%D1%82%D1%83%D0%BB%D0%B0%D1%82_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%9F%D0%B8%D1%81%D0%B0%D0%BD%D0%B8%D0%B5_%D0%B7%D0%B0%D1%89%D0%B8%D1%89%D0%B0%D0%BB">https://bibleox.com/ru/ru/w/tynP_Как_протестант_постулат_только_Писание_защищал</a></p></li><li><p>From Pentecostalism to Orthodoxy in the context of Sola Scriptura: <a href="https://youtu.be/f3bOTveRdXY?si=0RdgWh51R4aqa14q">https://youtu.be/f3bOTveRdXY?si=0RdgWh51R4aqa14q</a></p></li></ol>
