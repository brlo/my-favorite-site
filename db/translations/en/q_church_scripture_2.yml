      <h2>Preface</h2><p>Sola Scriptura is a trick used to create one’s own churches. Like the tricks of shell-game players, simple but deft moves confuse the listeners, who do not notice the substitution taking place right before their eyes. They are not taught a doctrine “according to Scripture alone” at all, but are merely offered yet another interpretation of Scripture, rejecting everything that does not agree with the personal faith of the new teacher (his opinion). The teacher’s personal faith is passed on to the listeners, becoming yet another human tradition. But this tradition is not called a tradition — and therein lies the trick: the listeners get the illusion that they believe according to Scripture alone. In the same way the earlier heretical societies were created: rejecting the faith of the Church, received directly from the apostles together with Scripture, they raised above everything the personal opinions of their teachers, all of whom are different. However many sects arise, their teachers can interpret absolutely any faith out of Scripture.</p><p><strong>Hieromartyr Irenaeus of Lyons (~130-202)</strong></p><blockquote><p>And it is not only from the writings of the evangelists and the apostles that they endeavour to derive proofs for their opinions <strong>by means of perverse interpretations and deceitful expositions: they deal in the same way with the law and the prophets</strong> &lt;…&gt; And others of them, <strong>with great craftiness, adapted such parts of Scripture to their own figments, lead away captive from the truth those who do not retain a stedfast faith</strong> &lt;…&gt; You see, my friend, <strong>the method which these men employ to deceive themselves, while they abuse the Scriptures by endeavouring to support their own system out of them</strong>. &lt;…&gt; Let us now look at the inconsistent opinions of those heretics (<strong>for there are some two or three of them</strong>), <strong>how they do not agree in treating the same points, but</strong> alike, in things and names, <strong>set forth opinions mutually discordant</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1/">Against Heresies, I</a>)</p><blockquote><p>Such are <strong>the variations existing among them with regard to one [passage], holding discordant opinions as to the same Scriptures</strong>;</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4/">Against Heresies, IV, 35.4</a>)</p><p><strong>Blessed Jerome of Stridon (~347-420)</strong></p><blockquote><p><em>But as we have already had a long discussion and the protracted controversy has wearied out the attention of our audience, I will tell you my opinion briefly and without reserve. </em><strong><em>We ought to remain in that Church which was founded by the Apostles and continues to this day. If ever you hear of any that are called Christians taking their name not from the Lord Jesus Christ, but from some other, for instance, Marcionites, Valentinians, Men of the mountain or the plain, you may be sure that you have there not the Church of Christ, but the synagogue of Antichrist. For the fact that they took their rise after the foundation of the Church is proof that they are those whose coming the Apostle foretold</em></strong><em>. </em><strong><em>And let them not flatter themselves if they think they have Scripture authority for their assertions, since the devil himself quoted Scripture, and the essence of the Scriptures is not the letter, but the meaning. Otherwise, if we follow <u>the letter</u>, we too can concoct a new dogma</em></strong><em> and assert that such persons as wear shoes and have two coats must not be received into the Church.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians/">The Dialogue Against the Luciferians</a>)</p><p><strong>Venerable Vincent of Lérins († before 450)</strong></p><blockquote><p>We inveighed also against the wicked presumption of Nestorius in <strong>boasting that he was the first and the only one who understood holy Scripture, and that all those teachers were ignorant, who before him had expounded the sacred oracles, forsooth, the whole body of priests, the whole body of Confessors and martyrs, of whom some had published commentaries upon the Law of God</strong>, others had agreed with them in their comments, or had acquiesced in them. In a word, he <strong>confidently asserted that the whole Church was even now in error, and always had been in error</strong>, in that, as it seemed to him, it had followed, and was following, ignorant and misguided teachers.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies/">The Commonitory</a>)</p><p>See other <a href="https://bibleox.com/ru/ru/w/WxNK_%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2_Sola_Scriptura/">sayings</a> like these (in Russian).</p><h2>Sola Scriptura</h2><p><strong>“Sola Scriptura”</strong> (Latin — Sola Scriptura, “Scripture alone”) is a method of building doctrine proposed in the 16th century by the reformers (who started the <a href="https://bibleox.com/ru/ru/w/3SlQ_%D0%9F%D1%80%D0%BE%D1%82%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%B7%D0%BC">Protestant</a> movement), according to which the highest authority for building doctrine is Holy Scripture alone (as subjectively understood by the reader).</p><p>Despite the theory, among Protestants and neo-Protestants the understanding of “Sola Scriptura” as a complete rejection of Tradition is widespread. Not many Protestants are ready to argue in the area of the patristic heritage, and most often, in the course of debates between the Orthodox and Protestants, even the mention of the names of the holy fathers, let alone their works, meets with sharp rejection and mockery. The very word “tradition” is given a negative connotation in Protestant societies by identifying it with “the tradition of the elders” (<a href="https://bibleox.com/en/eng-nkjv/mf/15/#L2">Matt. 15:2</a>), while completely ignoring the existence of the apostolic Tradition, which the apostles themselves commanded to be kept (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>) — the faith planted in the Church in various ways by the Lord and the apostles, and continuously kept in it and handed down from forefathers to descendants.</p><h2>Attempts to Justify Sola Scriptura</h2><p>The defenders of Sola Scriptura cite quotes from Scripture, presenting them as if they spoke of the necessity of regarding Scripture as the highest or the only authority of faith. However, in reality not a single one of the quotes cited speaks of Sola Scriptura, that is, that supposedly Scripture <strong>alone</strong> (and nothing besides it) has some exclusive, highest or only role in doctrine.</p><p>In defense of Sola Scriptura, quotes of the following types are offered.</p><h3>1. The Word of God Is Truth</h3><p>What God communicates in any way (orally, in writing, in a vision, through a messenger: an angel, a prophet or an apostle) is truth:</p><blockquote><p>“Sanctify them by Your truth. <strong>Your word is truth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L17">John. 17:17</a>)</p></blockquote><p>We do not dispute this. Every word of God is truth, and not only the written one. Oral tradition is also called the word of God:</p><blockquote><p>“when you received <strong>the word of God which you <u>heard</u></strong> from us, you welcomed it not as the word of men, but as it is in truth, <strong>the word of God</strong>, which also effectively works in you who believe” (<a href="https://bibleox.com/en/eng-nkjv/1sol/2/#L13">1 Thess. 2:13</a>) (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L23-25">1 Pet. 1:23-25</a>)</p></blockquote><p>We also do not dispute that all Scripture is God-inspired:</p><blockquote><p>“<strong>All Scripture is given by inspiration of God</strong>, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L16">2 Tim. 3:16</a>)</p></blockquote><h3>2. Scripture Is Important for Believers</h3><p>Holy Scripture is of great importance for believers:</p><blockquote><p>“<strong>All Scripture</strong> is given by inspiration of God, and is <strong>profitable</strong> for doctrine, for reproof, for correction, for instruction in righteousness” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L16">2 Tim. 3:16</a>)</p></blockquote><blockquote><p>“<strong>You search the Scriptures</strong>, for in them you think you have eternal life; and these are they which testify of Me” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L39">John. 5:39</a>)</p></blockquote><p>We do not dispute this either.</p><hr><p>All this is true. The Orthodox Church disputes none of the above, but itself affirms all of it.</p><p>However:</p><ul><li><p>these quotes do not show that the truth is <strong>only</strong> in Scripture and that Tradition is not truth; the same kind of quotes about Tradition are simply ignored (see <a href="https://bibleox.com/en/en/w/Ss5q_Refutation_of_Sola_Scriptura/#HH-The-Command-to-Keep-Tradition-and-to-Teach-in-Accordance-with-It">below</a>), since the supporters of Sola Scriptura have no aim of defending the necessity of Tradition.</p></li><li><p>these quotes do not show that <strong>all</strong> divine revelation is written down in Scripture, and that therefore, supposedly, Tradition can be cast aside. Casting aside Tradition is an act against Scripture (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>).</p></li></ul><p>None of the quotes cited says absolutely anything about the word “alone” from the concept of “Scripture alone”. All of them merely point to the necessity of divine revelation and its truth, in whatever form it is received: written, spoken or shown visually. In this we believe, and there is nothing of “Sola Scriptura” here.</p><h2>The Trick of the Preachers of Sola Scriptura</h2><p>Having shown the listener that Scripture has high authority, and that listening to Scripture is the same as listening to God, a substitution then takes place quite unnoticed by the listener: instead of God and Scripture, the preacher begins to speak and to interpret Scripture in his own way. And now the listener is already asked to accept as the words of God the words of the preacher, the founder of one of thousands of societies contradicting one another in the interpretation of Scripture.</p><p>Of course, the preacher continues to refer to Scripture in his speeches, backing his words with a set of quotes, but the obvious problem here is that Protestantism has thus given birth to thousands of every possible teaching about God, His actions and the ways of salvation. Moreover, from the very beginning of Christianity, societies external to the Church tried to distort the faith and lead people after themselves precisely through the distortion of Scripture. Even the devil did this, tempting Christ precisely with Scripture:</p><blockquote><p>“Then the devil took Him up into the holy city, set Him on the pinnacle of the temple, and said to Him, ‘If You are the Son of God, <strong>throw Yourself down. For it is written: “He shall give His angels charge over you,” and, “In their hands they shall bear you up, lest you dash your foot against a stone”</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/4/#L5-6">Matt. 4:5-6</a>)</p></blockquote><p>The devil also, taking occasion from the words of God, led the first people to their fall:</p><blockquote><p>“Now the serpent was more cunning than any beast of the field which the LORD God had made. And <strong>he said to the woman, ‘Has God indeed said, “You shall not eat of every tree of the garden”?’</strong> And the woman said to the serpent, ‘We may eat the fruit of the trees of the garden; but of the fruit of the tree which is in the midst of the garden, God has said, “You shall not eat it, nor shall you touch it, lest you die.”’ <strong>Then the serpent said to the woman, ‘You will not surely die</strong>. For God knows that in the day you eat of it your eyes will be opened, and you will be like God, knowing good and evil’” (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L1-5">Gen. 3:1-5</a>)</p></blockquote><p>So the devil and the founders of societies at enmity with the Church used precisely Scripture to lead people astray. How does this happen? It happens because a private interpretation of Scripture is endowed with the authority of Scripture.</p><h2>The Fundamental Problem of Sola Scriptura — Subjectivism</h2><p>The fundamental problem of this approach to building faith is that <strong>there is no objective understanding of Holy Scripture</strong>. Every person perceives it through the prism of his accumulated experience, worldview, interests and preferences, that is, perceives it <strong>subjectively</strong>. Simply put, the problem is this: <strong>who will decide what agrees with Scripture and what does not? </strong>Sola Scriptura does not answer this question. This is precisely what makes it merely a theory that cannot be carried out in practice. And these are not groundless claims.</p><p>The very first users of Sola Scriptura (the reformers) proposed different doctrines based on their own, different understanding of Holy Scripture. The disagreements concerned the most important questions:</p><ul><li><p>salvation;</p></li><li><p>the predestination of people to salvation,</p></li><li><p>the sinfulness of man,</p></li><li><p>the role of the sacraments in the life of believers,</p></li><li><p>the reality of Christ’s presence in the Eucharist,</p></li><li><p>the possibility of baptizing infants,</p></li><li><p>the presence of icons in the life of believers.</p></li></ul><p>Different doctrines immediately gave birth to different societies. And this is only the very beginning. In the course of time, the number of disagreements and divisions among the users of Sola Scriptura grew rapidly and, starting from a few doctrines and societies, within 500 years reached tens of thousands of divisions and disagreements on every possible question of faith, up to the most important ones — about God and the person of Christ.</p><p>Thus Sola Scriptura, as a concept, did not in practice make it possible to sift out human accretions and arrive at the faith of the authors of the biblical books. Sola Scriptura, despite the loud claims of its supporters, merely opens the way for the appearance of many new human accretions — new traditions, which will be discussed further.</p><h2>Sola Scriptura Has Led to the Appearance of Many Traditions</h2><p>According to the declared intention of the reformers, Sola Scriptura was to sift out human traditions. In reality, every new founder of yet another Protestant society became the founder of yet another human tradition, simply clothing his own faith in quotes from Scripture, which various heresiarchs did long before the reformers, ever since authoritative statements and texts appeared (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L1,4-5">Gen. 3:1,4-5</a>).</p><p>Around the new leader a society would form, which received, kept and handed down to its descendants nothing other than the faith of this leader. And if someone wants to join this society, he will be obliged to receive the faith of the leader of this society and to understand Scripture just as this particular society understands it. A person comes to the Baptists — he receives the faith according to the tradition of the Baptists; with the Pentecostals he receives the faith according to the tradition of the Pentecostals; with the Adventists — according to the tradition of the Adventists; and the same with all the rest. The societies condemn each other’s traditions: a Baptist will not be allowed to teach a society of Adventists, nor a Pentecostal a society of Baptists.</p><p>As a result, all such societies arrived from Sola Scriptura at the point that one must believe not at all “according to Scripture alone”, but strictly according to their tradition: only as their leader once said, and as the society has kept in the form of tradition, handing down knowledge from forefathers to descendants through oral preaching and the books of teachers. It is simply not customary to call this tradition, let alone “human tradition”, a name which, as a bogeyman, is customarily given only to the Tradition of the Church.</p><h2>The Leader of a Society as the Source of Faith</h2><p>If Scripture were some self-sufficient source of faith, then everyone who undertook to establish faith “on Scripture alone” would have the same faith as the other users of Sola Scriptura. However, all of them ended up with different faiths, which means that the source of faith is different too. This source is the <strong>person</strong> who founded the society. He invented it, handed it down to his followers, and they keep the faith of their leader.</p><h2>De Facto, Not Scripture but Their Own Tradition Takes First Place in Protestant Societies</h2><p>In all such societies, first place is given precisely to their tradition, and Scripture is used only as an auxiliary instrument, from which quotes useful for justifying the tradition are selected. The faith received in one of such communities in fact prevails over Scripture, and the biblical texts are used only to create a soap bubble around the listener, a distracting illusion that here people believe according to Scripture alone, while into his mind, through preaching, precisely the tradition of the community in which he has found himself is being laid.</p><p>Scripture can easily be ignored if it comes into contradiction with the tradition. For example, nowhere does Scripture say that infants may not be baptized; on the contrary, the prefiguration of baptism (circumcision) was applied precisely to infants (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L10-12">Gen. 17:10-12</a>), yet many Protestants insist on forbidding the baptism of infants, citing indirect reasons from Scripture. Scripture does not say that infants are saved without baptism; on the contrary, the Savior said that without being born of water and the Spirit no one can either see or enter the Kingdom of Heaven (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>), and without the prefiguration of baptism a person in the Old Testament also had to be cut off from the people (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L14">Gen. 17:14</a>); but many Protestants teach that infants are saved without baptism, again trying to cite indirect quotes from Scripture, though relying even more on their own reasoning about it.</p><p>Keeping the faith in what is found only in their tradition, they denounce the Church for its teaching on the transmission of the grace of the priesthood through ordination, easily casting aside the most direct words about the transmission of God’s gift <strong>through</strong> the laying on of hands (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6">2 Tim. 1:6</a>; <a href="https://bibleox.com/en/eng-nkjv/act/8/#L18">Act. 8:18</a>). Why so? Simply because their tradition offers a different faith, and since the tradition prevails over Scripture, the direct biblical text is cast aside, for one may not believe otherwise than this society was once taught. Although this is so, it may not be spoken of in such words: one may not use the word tradition (this word is used only for attacks on the Church), one may not openly say that here they pass on only the faith of the founder of this particular society.</p><h2>Dishonest Oppositions</h2><p>In societies created by supporters of Sola Scriptura, the following opposition is widespread: the Church has cast aside Scripture and believes only according to Tradition, while every Protestant society, on the contrary, has cast aside Tradition and believes only according to Scripture.</p><p>In reality:</p><ul><li><p>neither does the Church believe only according to Tradition, using Scripture equally with it;</p></li><li><p>nor do Protestant societies believe only according to Scripture, recognizing as correct only the faith of their leader, which they keep as a tradition.</p></li></ul><p>Thus no Sola Scriptura exists in practice. It exists only in theory. The implementation of this concept by any particular person inevitably entails the appearance of yet another new faith, a new understanding of Scripture, a new society, and as a consequence, a new tradition.</p><p>Proving this is not at all difficult. It is enough to carry out an experiment. If a person comes into one of these societies and it does not hand down its knowledge to him, but simply puts a Bible into his hands, then, reading the Bible alone, this person will 100% not arrive at the faith of this society. He will arrive at their faith in only one case — if the society hands down its faith to him.</p><p>The Orthodox Church confirms all its doctrine by Holy Scripture. However, Protestant societies do not agree with the <strong>Church’s understanding</strong> of Holy Scripture, offering in its place not “Scripture alone” (silently), but <strong>their own understanding and faith</strong>.</p><h2>Sola Scriptura Comes into Direct Conflict with Scripture</h2><p>The objections of the Orthodox Church to Sola Scriptura concern not the word “Scripture”, but the word “alone”. And the objections are built on Scripture itself:</p><ol><li><p><strong>“Sola Scriptura” is absent from Scripture</strong>. Scripture itself contains no requirement to build faith on Scripture alone or to give preference to Scripture alone. That is why Protestants cite quotes only about the importance of Scripture (keeping silent about the quotes on the importance of Tradition), because there are simply no quotes about Sola Scriptura in Scripture.</p></li><li><p><strong>On the contrary, Scripture says to keep the oral Tradition</strong>. It is repeatedly required to keep Tradition: not only the written, but also the oral preaching of the apostles (<a href="https://bibleox.com/en/en/w/Tr4n_Holy_Tradition/#HH-Tradition-Is-Not-Only-Texts-but-Also-Spoken-Words-That-Hand-Down-the-Faith">quotes</a>). And the oral preaching is put in first place by the apostles (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>).</p></li><li><p><strong>Scripture requires learning from the teachers of the Church. </strong>God appoints presbyters and teachers in the Church (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28">1 Cor. 12:28</a>; <a href="https://bibleox.com/en/eng-nkjv/ef/4/#L11">Eph. 4:11</a>), to whom the leadership and teaching of the Church’s flock is entrusted. The supporters of Sola Scriptura refuse to learn from the Church. Not wishing to become disciples in the Church, these people have proclaimed themselves teachers (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L3">2 Tim. 4:3</a>).</p></li><li><p><strong>Scripture can be interpreted wrongly</strong>. Scripture indicates that people not established by the Church interpret Scripture to their own destruction (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L15-16">2 Pet. 3:15-16</a>). The supporters of Sola Scriptura do not even intend to learn from the Church. Rejecting the teachers and taking only the textbook, they interpret Scripture however it happens, which has led them to the existence of a huge number of divided societies with different faiths and different understandings of the textbook (Scripture). And Scripture says that independent interpretation of Scripture without instruction from the Church leads to the twisting of Scripture and to destruction (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L15-16">2 Pet. 3:15-16</a>).</p></li></ol><p>Thus the supporters of Sola Scriptura act against Scripture in the following:</p><ol><li><p><strong>They teach what is not in Holy Scripture</strong>. There is no teaching of “Sola Scriptura” in Scripture;</p></li><li><p><strong>They reject the oral Tradition of the apostles</strong>. They say that only Scripture is of primary importance, acting contrary to the words of the apostles written in Scripture, in which they require keeping Tradition, putting oral preaching in first place, and only then the written (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>);</p></li><li><p><strong>They reject the teaching office of the Church</strong> and the teachers of the Church appointed by God, directly contrary to Scripture (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28">1 Cor. 12:28</a>; <a href="https://bibleox.com/en/eng-nkjv/ef/4/#L11">Eph. 4:11</a>).</p></li><li><p><strong>They interpret Scripture without being established by the Church</strong>. Every Protestant society has its own understanding of Scripture; every community of a society, and even within a community, can understand Scripture as they themselves please, because Sola Scriptura prompts rejecting the highest authority of any other doctrinal sources besides Scripture (as understood by the reader). If a person has come to like another understanding of Scripture, then it will be considered true, for Scripture is above the speech of a preacher, even a Protestant one.</p></li></ol><h2>The Main Proof That the Idea of Sola Scriptura Is Mistaken</h2><p>If the aim of inventing Sola Scriptura was the strongest possible division of the Christian world, then this idea proved extremely effective. But if the aim of its invention was the search for the faith of the apostles, then Sola Scriptura became a mistaken idea, one that only led away from the goal and gave birth to many traditions and divisions.</p><p>The main proof that Sola Scriptura is mistaken is the users of Sola Scriptura themselves: a countless multitude of societies contradicting one another, with doctrines invented under the slogan “Scripture alone”. No other idea has created as many divisions among believers in Christ as “Sola Scriptura”. And this was done directly contrary to Scripture (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>; <a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18-19">1 John. 2:18-19</a>).</p><blockquote><p>“I do not pray for these alone, but also for those who will believe in Me through their word; <strong>that they all may be one</strong>, as You, Father, are in Me, and I in You; that they also may be one in Us, <strong>that the world may believe</strong> that You sent Me” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>)</p></blockquote><blockquote><p>“Now I plead with you, brethren, by the name of our Lord Jesus Christ, <strong>that you all speak the same thing, and that there be no divisions among you</strong>, but that you be perfectly joined together in the same mind and in the same judgment” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>)</p></blockquote><blockquote><p>“Little children, it is the last hour; and as you have heard that the Antichrist is coming, even now many antichrists have come, by which we know that it is the last hour. They went out from us, but they were not of us; for <strong>if they had been of us, they would have continued with us; but they went out</strong> that they might be made manifest, that none of them were of us” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18-19">1 John. 2:18-19</a>)</p></blockquote><hr><p>In the 16th century the reformer Luther proposed the concept of Sola Scriptura. Subsequently, every reformer began to build faith, giving the highest authority, as they claimed, to “Scripture alone” (their own understanding of Scripture). It was assumed that building faith on Scripture alone should lead to the faith of the apostles. Thus it was declared that precisely this method, and it alone, allows a person to arrive at the faith of the apostles. But in the end, contrary to the intention, all the reformers ended up with different faiths.</p><p>At first the approach of “Sola Scriptura” gave birth to three directions with different understandings of Scripture: Lutherans, Calvinists and Anglicans. Later, this concept made it possible for any person on the planet to create his own society with his own doctrine — it is enough just to take a Bible in hand. Thus appeared thousands of so-called denominations, each with its own faith and its own understanding of Scripture. This process continues to this day. Because of the difference in faith, following <strong>human ways</strong> (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L3">1 Cor. 3:3</a>), they all separate from one another, all have a different <strong>faith</strong>, a different <strong>baptism</strong> and a different <strong>idea of God</strong>. All this contradicts how it should be in the Church:</p><blockquote><p>“There is one body and one Spirit, just as you were called in one hope of your calling; <strong>one <mark>Lord</mark>, one <mark>faith</mark>, one <mark>baptism</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L4-5">Eph. 4:4-5</a>)</p></blockquote><p>Some may object regarding the different faith in God, saying that everyone believes in Jesus. However, not all have the apostolic faith in Christ as God; there are not a few Protestant Unitarians, who deny faith in God, one in nature and triune in persons: Father, Son and Holy Spirit. Besides, many societies have different ideas about God, about His will and the ways of pleasing Him. For example, Pentecostals/charismatics believe that their incoherent muttering and falling to the floor are pleasing to God, and that all this is supposedly the action of the Holy Spirit, that is, of God. At the same time, the other societies reject this Pentecostal idea of God, offering their own ideas in its place. Thus they have different ideas about God, and sometimes different teachings about God.</p><p>A countless multitude of people contradicting one another with a Bible in their hands, claiming that they have built yet another faith “according to Scripture alone”, is the most striking argument against Sola Scriptura. Through “Scripture alone” people were promised a road to the one apostolic faith, freeing the faith from “human accretions”, but in reality this approach gave birth to a great multitude of human accretions and gave the Christian world nothing but countless divisions, contrary to God’s will for the unity of believers (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>; <a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18-19">1 John. 2:18-19</a>).</p><blockquote><p>“I do not pray for these alone, but also for those who will believe in Me through their word; that they all may be one, as You, Father, are in Me, and I in You; that they also <strong><mark>may be one in Us</mark>, that the world may believe</strong> that You sent Me” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>)</p></blockquote><blockquote><p>“Now I <strong><mark>plead</mark></strong> with you, brethren, by the name of our Lord Jesus Christ, <strong><mark>that you all speak the same thing</mark>, <mark>and that there be no divisions among you</mark></strong>, but that you <strong>be perfectly joined together <mark>in the same mind</mark> and <mark>in the same judgment</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>)</p></blockquote><h3>Old Testament Parallels[3]</h3><p>A similar division took place in the Old Testament during the building of the city and tower of Babel (<a href="https://bibleox.com/en/eng-nkjv/gen/11/#L1-9">Gen. 11:1-9</a>). People decided by their own efforts to build a city and a tower up to heaven (<a href="https://bibleox.com/en/eng-nkjv/gen/11/#L4">Gen. 11:4</a>), but began to speak differently (<a href="https://bibleox.com/en/eng-nkjv/gen/11/#L7">Gen. 11:7</a>), divided and dispersed (<a href="https://bibleox.com/en/eng-nkjv/gen/11/#L8">Gen. 11:8</a>). So it is now.</p><p>God created the Church, sent the Holy Spirit to it forever (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>), Himself promised to be with it always (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L20">Matt. 28:20</a>), handed down the teaching orally, appointed priests (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L17-18,28">Act. 20:17-18,28</a>) and teachers (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28">1 Cor. 12:28</a>), who taught orally, but also carried on correspondence.</p><p>More than fifteen centuries later, people come, take from the Church only the correspondence of some apostles (not all) preserved by the Church, contrary to this very correspondence cast aside the invincible Church (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L18">Matt. 16:18</a>) — the <strong>foundation</strong> that God laid — cast aside the faith received from the apostles and kept in the Church, the Tradition of the apostles (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a> and <a href="https://bibleox.com/en/en/w/Tr4n_Holy_Tradition/#HH-The-Command-to-Keep-Tradition-and-to-Teach-in-Accordance-with-It">others</a>), the priests (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L17-18,28">Act. 20:17-18,28</a>) and teachers (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28">1 Cor. 12:28</a>) appointed by God, and resolved by their own mind and strength (by research in history, archaeology, linguistics and so on) independently, apart from the Church founded by God, to build their own city. Other builders join them. In the end, they began to speak differently, divided and dispersed, beginning to build their own settlements with their own languages of communication, not wishing to live in <em>the city “which has <strong>foundations</strong>, whose builder and maker is God”</em> (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L10">Heb. 11:10</a>).</p><h2>“Scripture Alone” Leads to “Alone”-Thinking</h2><p>The teaching of the Protestants, which includes many postulates with the word “alone”, often leads its supporters to a way of thinking that can be briefly called “alone”-thinking. It makes many of them pay attention only to separate parts of a text that they like, imagining the word “alone” in the right places, as if saying to themselves: “only these words must I take into account”, and building some construction on this. When the author of a text considers different sides of one subject, describing them either one after another or in different places of his work, Protestants often choose only one thing and make it an absolute.</p><ul><li><p>For example, the apostles write about the necessity for salvation of both faith and works. “Alone”-thinking makes one choose here the fragment of text about faith and insert the word “alone”.</p></li><li><p>The apostles write about the necessity of both Scripture and Tradition. “Alone”-thinking makes one choose here the fragment of text about the importance of Scripture and insert the word “alone”.</p></li></ul><p>In the study of the texts of ancient writers this way of thinking shows itself in almost everything.</p><ul><li><p>For example, when explaining the Eucharist, authors give two explanations (a literal and a symbolic one); Protestants tend to see only the symbolic explanation, trying to pass these authors off as supporters of their “alone”-teachings.</p></li></ul><p>Many heresies arose on this principle. Does the fact that Jesus Christ is a man mean that He is only a man? No, He is also God. And if He is God, does that mean that He is only God? No, He is also a man. If Christ is the image of the Father, does that mean that He is only an image (merely a picture)? No, He is also true God and true man. How many have stumbled over this, and still stumble. So it is here: the symbolic explanation does not reject the literal one, and the literal does not reject the symbolic.</p><p>Nothing prevents the Orthodox from recognizing the necessity of both Scripture and Tradition, of both faith and works, and, recognizing the literal understanding of the Eucharist, also recognizing in addition the symbolic meanings. Many Protestants insist everywhere on the word “alone”, simply ignoring the other statements of the same authors.</p><h2>The Council in Jerusalem and Scripture</h2><p>One of the clearest proofs that the Church did not live by the principle “Scripture alone” is the events of the first church council in Jerusalem, headed by the apostles.</p><p>At the Jerusalem council, without instructions from Scripture, the Law of Moses is abolished: circumcision, the prohibition of unclean food, the Sabbath rest, the prohibition of touching the dead, of associating with Gentiles and so on. This decision was made by the Church, having gathered together and deliberated (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L22">Act. 15:22</a>). It was done without Scripture, because the author of Scripture lives in the Church — the Holy Spirit; and therefore <strong>the council’s decree is sealed not by the phrase “for it is written in Scripture”</strong>, but by an indication of the will of the Holy Spirit and the Church: “<strong><mark>For it seemed good to the Holy Spirit, and to us</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L28-29">Act. 15:28-29</a>).</p><p>So, the abolition of the Law of Moses is the decision of the Holy Spirit and the Church. On the other side, they were opposed by Christians who had come to believe from the sect of the Pharisees (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L5">Act. 15:5</a>). On the side of the latter were some clear expressions from Scripture (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L14">Gen. 17:14</a>). But on the side of the apostles was precisely the authority of the Church, for they, as it is written, deliberated with the whole Church (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L22">Act. 15:22</a>), and then proclaimed the common decision. Without Scripture, but only by their word, they indicated the abolition of the Law to those who demanded that the Law be kept according to Scripture.</p><p>Scripture says that one must be circumcised and that whoever is not circumcised will be cut off from the people (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L14">Gen. 17:14</a>). But the apostles gave no commandment to teach this:</p><blockquote><p><em>“Since we have heard that some who went out from us have troubled you with words, unsettling your souls, saying, ‘You must </em><strong><em>be circumcised and keep the law</em></strong><em>’ — </em><strong><em>to whom we <mark>gave no such commandment</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/act/15/#L24"><em>Act. 15:24</em></a><em>)</em></p></blockquote><p>But this, after all, is said in Scripture. On what basis must this not be taught? On the basis of what Scripture was it decided that one need not be circumcised? What Scripture allowed eating pork? This was done not according to Scripture, but by the conciliar decision of the whole Church, which establishes the truth (<a href="https://bibleox.com/en/eng-nkjv/1tim/3/#L15">1 Tim. 3:15</a>).</p><p>Since then, the decision of the Jerusalem council has become the Tradition of the Church:</p><blockquote><p><em>“And as they went through the cities, they </em><strong><em><mark>delivered</mark></em></strong><em> </em><em>(Greek: παρεδίδοσαν — “handed down”, from the same root as παράδοσις, “tradition”)</em><em> to them the decrees to keep, which were determined by the apostles and elders at Jerusalem” (</em><a href="https://bibleox.com/en/eng-nkjv/act/16/#L4"><em>Act. 16:4</em></a><em>)</em></p></blockquote><hr><p>The president of the apostolic council in Jerusalem, the apostle James, recalls in his speech the words of the prophet Amos. In this prophecy there are no words about circumcision:</p><blockquote><p><em>“On that day I will raise up the tabernacle of David, which has fallen down, and repair its damages; I will raise up its ruins, and rebuild it as in the days of old; that they may possess the remnant of Edom, and all the Gentiles who are called by My name, says the LORD who does this thing” (</em><a href="https://bibleox.com/en/eng-nkjv/am/9/#L11-12"><em>Amos. 9:11-12</em></a><em>)</em></p></blockquote><p>If on this basis what was done at the council in Jerusalem is accepted (some implicit reference to Scripture and the mention of the Holy Spirit), then all the Ecumenical Councils of the Orthodox Church should naturally be accepted, and not only the one in Jerusalem, because the Holy Spirit is sent to the Church not only for the Jerusalem council, but forever:</p><blockquote><p><em>“And I will pray the Father, and He will give you another Helper, that </em><strong><em>He may abide with you <mark>forever</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/in/14/#L16"><em>John. 14:16</em></a><em>)</em></p></blockquote><p>And Christ Himself promised to be with the Church always:</p><blockquote><p><em>“I am with you </em><strong><em><mark>always</mark>, even to the end of the age</em></strong><em>. Amen” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/28/#L20"><em>Matt. 28:20</em></a><em>)</em></p></blockquote><p>Far weightier grounds from Scripture were shown at all the Councils, including the 7th, which defended the veneration of icons. The Holy Spirit is still in the Church. All the Councils must be accepted in accordance with such arguments.</p><h2>The Teaching Office of the Church</h2><h3>The Flock Is Entrusted to the Presbyters, Who Are Its Overseers</h3><blockquote><p><em>“he called for the elders of the church. And when they had come to him, he said to them: &lt;...&gt; take heed to yourselves and to all the flock, among which </em><strong><em><mark>the Holy Spirit has made you overseers</mark></em></strong><em> (Greek: ἐπισκόπους — “bishops”), </em><strong><em><mark>to shepherd the church of God</mark></em></strong><em> which He purchased with His own blood” (</em><a href="https://bibleox.com/en/eng-nkjv/act/20/#L17-18,28"><em>Act. 20:17-18,28</em></a><em>)</em></p></blockquote><h3>God Appointed Teachers in the Church; Not All Are Teachers</h3><blockquote><p>“And <strong>He [Christ] Himself <mark>gave</mark></strong> some to be apostles, some prophets, some evangelists, and some <strong>pastors and <mark>teachers</mark></strong>, for the equipping of the saints for the work of ministry, for the edifying of the body of Christ” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L11-12">Eph. 4:11-12</a>)</p></blockquote><blockquote><p>“And <strong><mark>God has appointed these in the church</mark></strong>: first apostles, second prophets, third <strong><mark>teachers</mark></strong>; &lt;…&gt; Are all apostles? Are all prophets? <strong><mark>Are all teachers?</mark></strong> Are all workers of miracles?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28-29">1 Cor. 12:28-29</a>)</p></blockquote><h3>People Not Established by the Church Interpret Scripture to Their Own Destruction</h3><blockquote><p>“as also our beloved brother Paul, according to the wisdom given to him, has written to you, as also <strong>in all his epistles, speaking in them of these things, in which are some things hard to understand, which <mark>untaught and unstable people twist to their own destruction, as they do also the rest of the Scriptures</mark></strong>” <em>(Greek: ἀστήρικτοι — “not established, not made firm”)</em> (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L15-16">2 Pet. 3:15-16</a>)</p></blockquote><h2>Scripture Can Be Interpreted Wrongly</h2><blockquote><p>“as also our beloved brother Paul, according to the wisdom given to him, has written to you, as also <strong>in all his epistles, speaking in them of these things, in which are some things hard to understand, which <mark>untaught and unstable people twist to their own destruction, as they do also the rest of the Scriptures</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L15-16">2 Pet. 3:15-16</a>)</p></blockquote><p>More: <a href="https://bibleox.com/en/en/w/Ip7w_Interpretation_of_Scripture/">https://bibleox.com/en/en/w/Ip7w_Interpretation_of_Scripture</a></p><blockquote><p>If such bewilderment and empty speaking be from ignorance, Scripture will teach them, that <strong><mark>the devil, the author of heresies</mark></strong>, because of the ill savour which attaches to evil, <strong><mark>borrows Scripture language, as a cloak wherewith to sow the ground with his own poison also, and to seduce the simple</mark></strong>. Thus he deceived Eve; thus he framed former heresies; thus <strong><mark>he persuaded Arius at this time to make a show of speaking against those former ones, that he might introduce his own without observation</mark></strong>. &lt;…&gt; For who was ever yet a hearer of such a doctrine? or <strong>whence or from whom did the abettors and hirelings of the heresy gain it? who thus expounded to them when they were at school?</strong> &lt;…&gt; But if they themselves own that they have heard it now for the first time, how can they deny that this heresy is foreign, and <strong>not from our fathers</strong>? But what is not from our fathers, but has come to light in this day, how can it be but that of which the blessed Paul (1 Tim. 4:1–2; Titus 1:14) has foretold, that ‘in the latter times some shall depart from the sound faith, giving heed to seducing spirits and doctrines of devils, in the hypocrisy of liars; cauterized in their own conscience, and turning from the truth’?</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-four-discourses-against-the-arians-1/">Athanasius the Great, Discourses Against the Arians, I, 8</a>)</p><h2>What Is Tradition?</h2><p>Tradition is the revelation of God the Father, which He, through His Only Begotten Son, handed down to the apostles, and they handed down to the Church, and the Church hands it down as faith from generation to generation by word (spoken and written) and by deed:</p><blockquote><p><em>“For </em><strong><em>I have <mark>given</mark> to them the words which You have <mark>given</mark> Me; and they have received them</em></strong><em>, and have known surely that I came forth from You; and they have believed that You sent Me” (</em><a href="https://bibleox.com/en/eng-nkjv/in/17/#L8"><em>John. 17:8</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now I praise you, brethren, that </em><strong><em>you remember me in all things and keep the <mark>traditions</mark> just as I delivered them to you</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2"><em>1 Cor. 11:2</em></a><em>)</em></p></blockquote><h2>The Command to Keep Tradition and to Teach in Accordance with It</h2><blockquote><p><em>“Therefore, brethren, </em><strong><em><mark>stand fast and hold the traditions</mark></em></strong><em> which you were taught, whether </em><strong><em>by word</em></strong><em> or </em><strong><em>our epistle</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15"><em>2 Thess. 2:15</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now I praise you, brethren, that you remember me in all things and </em><strong><em><mark>keep the traditions just as I delivered</mark></em></strong><em> them to you” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2"><em>1 Cor. 11:2</em></a><em>)</em></p></blockquote><blockquote><p><em>“Moreover, brethren, I declare to you the gospel which I preached to you, which also you received and in which you stand, by which also </em><strong><em><mark>you are saved, if you hold fast that word</mark></em></strong><em> </em><strong><em>which I preached</em></strong><em> to you — unless you believed in vain” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L1-2"><em>1 Cor. 15:1-2</em></a><em>)</em></p></blockquote><blockquote><p><em>“And </em><strong><em><mark>the things that you have heard</mark></em></strong><em> </em><strong><em>from me </em></strong><em>among many witnesses, </em><strong><em><mark>commit these</mark> to faithful</em></strong><em> men who will be able to teach others also” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2"><em>2 Tim. 2:2</em></a><em>)</em></p></blockquote><blockquote><p><em>“Finally then, brethren, we urge and </em><strong><em><mark>exhort</mark></em></strong><em> in the Lord Jesus that you should </em><strong><em><mark>abound more and more</mark>, just as <mark>you received from us how you ought to walk</mark> and to please God</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1sol/4/#L1"><em>1 Thess. 4:1</em></a><em>)</em></p></blockquote><blockquote><p><em>“Beloved, while I was very diligent to write to you concerning our common salvation, I found it necessary to write to you exhorting you </em><strong><em><mark>to contend earnestly for the faith which was once for all delivered to the saints</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3"><em>Jude. 1:3</em></a><em>)</em></p></blockquote><blockquote><p><em>“holding fast </em><strong><em><mark>the faithful word as he has been taught</mark></em></strong><em>, that he may be able, by sound doctrine, both to exhort and convict those who contradict. For </em><strong><em>there are many insubordinate, both idle talkers and deceivers</em></strong><em>, especially those of the circumcision, whose mouths must be stopped, who subvert whole households, teaching things which they ought not, for the sake of dishonest gain” (</em><a href="https://bibleox.com/en/eng-nkjv/tit/1/#L9-11"><em>Titus. 1:9-11</em></a><em>)</em></p></blockquote><blockquote><p><em>“But I fear, lest somehow, as the serpent deceived Eve by his craftiness, so your minds may be corrupted from the simplicity that is in Christ. For if he who comes </em><strong><em><mark>preaches another Jesus whom we have not preached</mark></em></strong><em>, or if you receive a different spirit which you have not received, or </em><strong><em><mark>a different gospel which you have not accepted</mark></em></strong><em> — you may well put up with it! &lt;...&gt; For such are false apostles, deceitful workers, transforming themselves into apostles of Christ. And no wonder! For Satan himself transforms himself into an angel of light. Therefore it is no great thing if his ministers also transform themselves into ministers of righteousness, whose end will be according to their works” (</em><a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L3-4,13-15"><em>2 Cor. 11:3-4,13-15</em></a><em>)</em></p></blockquote><blockquote><p><em>“As I urged you when I went into Macedonia — remain in Ephesus that you may charge some that they </em><strong><em><mark>teach no other doctrine</mark></em></strong><em>, nor give heed to fables and endless genealogies, which cause disputes rather than godly edification which is in faith” (</em><a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L3-4"><em>1 Tim. 1:3-4</em></a><em>)</em></p></blockquote><h2>Tradition Is Not Only Texts but Also Words That Were Heard</h2><blockquote><p><em>“For this reason we also thank God without ceasing, because when </em><strong><em>you received the word of God which you <mark>heard</mark>(!) from us</em></strong><em>, you welcomed it not as the word of men, but as it is in truth, the word of God, which also effectively works in you who believe” (</em><a href="https://bibleox.com/en/eng-nkjv/1sol/2/#L13"><em>1 Thess. 2:13</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>Hold fast the pattern of sound words which you have <mark>heard</mark>(!) from me</em></strong><em>, in faith and love which are in Christ Jesus” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L13"><em>2 Tim. 1:13</em></a><em>)</em></p></blockquote><blockquote><p><em>“And </em><strong><em>the things that you have <mark>heard</mark>(!)</em></strong><em> </em><strong><em>from me </em></strong><em>among many witnesses, </em><strong><em>commit these to faithful</em></strong><em> men who will be able to teach others also” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2"><em>2 Tim. 2:2</em></a><em>)</em></p></blockquote><blockquote><p><em>“Therefore, brethren, </em><strong><em>stand fast and hold the traditions</em></strong><em> which you were taught, whether </em><strong><em><mark>by word</mark>(!)</em></strong><em> or </em><strong><em>our epistle</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15"><em>2 Thess. 2:15</em></a><em>)</em></p></blockquote><blockquote><p><em>“Therefore let that abide in you which you </em><strong><em>heard from the beginning</em></strong><em>. </em><strong><em>If what you <mark>heard</mark>(!) from the beginning abides in you, you also will abide in the Son and in the Father</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1in/2/#L24"><em>1 John. 2:24</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now I praise you, brethren, that </em><strong><em>you <mark>remember</mark>(!) me in all things</em></strong><em> and keep the traditions just as I delivered them to you” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2"><em>1 Cor. 11:2</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>Remember therefore how you have received and <mark>heard</mark>(!); hold fast</em></strong><em> and repent. Therefore if you will not watch, I will come upon you as a thief, and you will not know what hour I will come upon you” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L3"><em>Rev. 3:3</em></a><em>)</em></p></blockquote><h2>The Necessity of Tradition</h2><h3>Holy Scripture Is Not the Source of All Information About Jesus Christ</h3><blockquote><p><em>“And truly Jesus did many other signs in the presence of His disciples, which </em><strong><em>are not written in this book</em></strong><em>; but these are written that you may believe that Jesus is the Christ, the Son of God, and that believing you may have life in His name” (</em><a href="https://bibleox.com/en/eng-nkjv/in/20/#L30-31"><em>John. 20:30-31</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>And there are also many other things that Jesus did</em></strong><em>, which if they were written one by one, I suppose that even the world itself could not contain the books that would be written. Amen” (</em><a href="https://bibleox.com/en/eng-nkjv/in/21/#L25"><em>John. 21:25</em></a><em>)</em></p></blockquote><h3>The Teaching on the Laying On of Hands Is Not Described in Scripture</h3><p>In not a single epistle is there a teaching on how to baptize rightly, how to ordain deacons, presbyters, bishops:</p><blockquote><p><em>“</em><strong><em>not laying again the foundation</em></strong><em> of repentance from dead works and of faith toward God, </em><strong><em>of the doctrine of baptisms, of laying on of hands</em></strong><em>, of resurrection of the dead, and of eternal judgment” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/6/#L1-2"><em>Heb. 6:1-2</em></a><em>)</em></p></blockquote><h3>The Apostles Preferred Communication by Word of Mouth</h3><blockquote><p><em>“Having many things to write to you, </em><strong><em>I did not wish to do so with paper and ink</em></strong><em>; but I hope to come to you and speak face to face, that our joy may be full” (</em><a href="https://bibleox.com/en/eng-nkjv/2in/1/#L12"><em>2 John. 1:12</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>I had many things to write, but I do not wish to write to you with pen and ink</em></strong><em>; but I hope </em><strong><em>to see you shortly, and we shall speak face to face</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/3in/1/#L13-14"><em>3 John. 1:13-14</em></a><em>)</em></p></blockquote><h3>Both the Oral and the Written Preaching Must Be Kept</h3><p>The Apostle Paul asks to keep Tradition (the instruction of the apostles), received not only in the epistles, but also from words:</p><blockquote><p><em>“Therefore, brethren, stand fast and hold the traditions which you </em><strong><em>were taught</em></strong><em>, whether </em><strong><em>by word</em></strong><em> or </em><strong><em>our epistle</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15"><em>2 Thess. 2:15</em></a><em>)</em></p></blockquote><blockquote><p><em>“And </em><strong><em>the things that you have heard</em></strong><em> </em><strong><em>from me </em></strong><em>among many witnesses, </em><strong><em>commit these to faithful</em></strong><em> men who will be able to teach others also” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2"><em>2 Tim. 2:2</em></a><em>)</em></p></blockquote><h3>The Great Length of the Spoken Preaching of the Apostles</h3><h4>3 Years</h4><p>The Apostle Paul taught the presbyters of Asia for three years, night and day:</p><blockquote><p><em>“Therefore watch, and remember that </em><strong><em>for <mark>three years</mark> I did not cease to warn</em></strong><em> everyone night and day with tears” (</em><a href="https://bibleox.com/en/eng-nkjv/act/20/#L31"><em>Act. 20:31</em></a><em>)</em></p></blockquote><h4>1.5 Years</h4><p>For a year and a half he taught the community in Corinth:</p><blockquote><p><em>“After these things Paul departed from Athens and went to Corinth. &lt;...&gt; And he continued there </em><strong><em><mark>a year and six months</mark>, teaching</em></strong><em> the word of God among them” (</em><a href="https://bibleox.com/en/eng-nkjv/act/18/#L1,11"><em>Act. 18:1,11</em></a><em>)</em></p></blockquote><h4>2 Years and 3 Months</h4><p>He preached in Ephesus: first for three months in the synagogue, and then for two years with the disciples in a school:</p><blockquote><p><em>“And he went into the synagogue and spoke boldly for </em><strong><em>three months</em></strong><em>, reasoning and persuading concerning the things of the kingdom of God. But when some were hardened and did not believe, but spoke evil of the Way before the multitude, he departed from them and </em><strong><em>withdrew the disciples, reasoning daily in the school</em></strong><em> of Tyrannus. And </em><strong><em>this continued for <mark>two years</mark></em></strong><em>, so that all who dwelt in Asia heard the word of the Lord Jesus, both Jews and Greeks” (</em><a href="https://bibleox.com/en/eng-nkjv/act/19/#L8-10"><em>Act. 19:8-10</em></a><em>)</em></p></blockquote><p>Altogether, the Apostle Paul alone preached for at least 30 years: from his conversion in 33-34 AD until his death in 64-67 AD.</p><h2>The Apostles Made Use of Tradition</h2><p>The apostle names two Egyptian sorcerers whose names are absent from Scripture:</p><blockquote><p><em>“Now as </em><strong><em>Jannes and Jambres</em></strong><em> resisted Moses, so do these also resist the truth: men of corrupt minds, disapproved concerning the faith” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L8"><em>2 Tim. 3:8</em></a><em>)</em></p></blockquote><p>The apostle Jude tells of a dispute absent from Scripture:</p><blockquote><p><em>“Yet Michael the archangel, in contending with the devil, </em><strong><em>when he disputed about the body of Moses</em></strong><em>, dared not bring against him a reviling accusation, but said, ‘The Lord rebuke you!’” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L9"><em>Jude. 1:9</em></a><em>)</em></p></blockquote><p>About the words of Enoch, absent from Scripture:</p><blockquote><p><em>“Now </em><strong><em>Enoch</em></strong><em>, the seventh from Adam, </em><strong><em>prophesied</em></strong><em> about these men also, saying, ‘Behold, the Lord comes with ten thousands of His saints’” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L14"><em>Jude. 1:14</em></a><em>)</em></p></blockquote><p>The Apostle Paul speaks of the prophet Isaiah, who was sawn in two after hiding in the hollow of a tree:</p><blockquote><p>“They were stoned, they <strong>were sawn in two</strong>, were tempted, were slain with the sword. They wandered about in sheepskins and goatskins, being destitute, afflicted, tormented” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L37">Heb. 11:37</a>)</p></blockquote><p>The evangelist Luke writes down the Gospel on the basis of words heard from eyewitnesses, that is, he writes down tradition:</p><blockquote><p><em>“Inasmuch as many have taken in hand to set in order a narrative of those things which have been fulfilled among us, </em><strong><em>just as those who from the beginning were eyewitnesses</em></strong><em> and ministers of the word </em><strong><em>delivered them to us</em></strong><em>, it seemed good to me also, having had perfect understanding of all things from the very first, to write to you an orderly account, most excellent Theophilus” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/1/#L1-3"><em>Luke. 1:1-3</em></a><em>)</em></p></blockquote><h3>They Report Information Absent from the Gospel</h3><p>The Apostle Paul, in his talk with the Ephesian pastors, points to a teaching of Christ the Savior that is absent from the Gospel:</p><blockquote><p><em>“I have shown you in every way, by laboring like this, that you must support the weak. And remember the words of the Lord Jesus, that </em><strong><em>He said, ‘It is more blessed to give than to receive’</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/act/20/#L35"><em>Act. 20:35</em></a><em>)</em></p></blockquote><p>He reports the appearance of the risen Christ to a great number of people, which is also not written in the Gospel:</p><blockquote><p><em>“After that </em><strong><em>He was seen by over five hundred brethren</em></strong><em> at once, of whom the greater part remain to the present, but some have fallen asleep. After that He was seen by James, then by all the apostles” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L6-7"><em>1 Cor. 15:6-7</em></a><em>)</em></p></blockquote><h2>The Importance of Tradition</h2><p>A wrong teaching does not lead to God:</p><blockquote><p><em>“Whoever </em><strong><em>transgresses and does not abide in the doctrine of Christ does not have God</em></strong><em>. He who abides in the doctrine of Christ has both the Father and the Son” (</em><a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9"><em>2 John. 1:9</em></a><em>)</em></p></blockquote><p>Heresies (false teachings) do not inherit the Kingdom of God:</p><blockquote><p><em>“</em><strong><em>heresies</em></strong><em> &lt;...&gt; of which I tell you beforehand, just as I also told you in time past, that those who practice such things </em><strong><em>will not inherit the kingdom of God</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gal/5/#L20-21"><em>Gal. 5:20-21</em></a><em>)</em></p></blockquote><h2>Withdraw from Those Who Bring In a New Teaching</h2><blockquote><p><em>“</em><strong><em>Reject a divisive man</em></strong><em> (Greek: αἱρετικὸν ἄνθρωπον — “a heretic”) after the first and second admonition” (</em><a href="https://bibleox.com/en/eng-nkjv/tit/3/#L10"><em>Titus. 3:10</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>If anyone teaches otherwise</em></strong><em> and does not consent to wholesome words, even the words of our Lord Jesus Christ, and to the doctrine which accords with godliness, </em><strong><em>he is proud, knowing nothing, but is obsessed with disputes and arguments over words</em></strong><em>, from which come envy, strife, reviling, evil suspicions &lt;...&gt; </em><strong><em>From such <mark>withdraw</mark> yourself</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L3-5"><em>1 Tim. 6:3-5</em></a><em>)</em></p></blockquote><blockquote><p><em>“O Timothy! </em><strong><em>Guard what was committed to your trust</em></strong><em>, </em><strong><em><mark>avoiding</mark> the profane and idle babblings and contradictions of what is falsely called knowledge</em></strong><em> — by professing it some have strayed concerning the faith. Grace be with you. Amen” (</em><a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L20-21"><em>1 Tim. 6:20-21</em></a><em>)</em></p></blockquote><blockquote><p><em>“But we command you, brethren, in the name of our Lord Jesus Christ, that you </em><strong><em><mark>withdraw</mark> from every brother who walks</em></strong><em> disorderly and </em><strong><em>not according to the tradition</em></strong><em> which he received from us” (</em><a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L6"><em>2 Thess. 3:6</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now I urge you, brethren, </em><strong><em>note those who cause divisions and offenses, contrary to the doctrine which you learned, and <mark>avoid</mark> them</em></strong><em>. For those who are such do not serve our Lord Jesus Christ, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18"><em>Rom. 16:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>If anyone comes to you and does not bring this doctrine, <mark>do not receive</mark> him into your house</em></strong><em> nor greet him; for he who greets him shares in his evil deeds” (</em><a href="https://bibleox.com/en/eng-nkjv/2in/1/#L10-11"><em>2 John. 1:10-11</em></a><em>)</em></p></blockquote><blockquote><p><em>“But even if we, or an angel from heaven, preach any other gospel to you </em><strong><em>than what we have preached to you, let him be accursed</em></strong><em>. As we have said before, so now I say again, </em><strong><em>if anyone preaches any other gospel to you than what you have received, let him be <mark>accursed</mark></em></strong><em> (Greek: ἀνάθεμα — “anathema”)” (</em><a href="https://bibleox.com/en/eng-nkjv/gal/1/#L8-9"><em>Gal. 1:8-9</em></a><em>)</em></p></blockquote><p><strong>Anathema</strong> (Greek ἀνάθεμα) — excommunication from the Church.</p><h2>The Need to Honor and Follow the Saints</h2><blockquote><p><em>«</em><strong><em><mark>Remember</mark> those who rule over you</em></strong><em>, who have spoken the word of God to you, </em><strong><em><mark>whose faith follow</mark></em></strong><em>, considering the outcome of their conduct» (</em><a href="https://bibleox.com/en/eng-nkjv/evr/13/#L7"><em>Heb. 13:7</em></a><em>)</em></p></blockquote><blockquote><p><em>«Therefore I urge you, </em><strong><em><mark>imitate</mark> me</em></strong><em>» (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L16"><em>1 Cor. 4:16</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em><mark>Brethren, join in following my example</mark>, and <mark>note those who so walk, as you have us for a pattern</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/fil/3/#L17"><em>Phil. 3:17</em></a><em>)</em></p></blockquote><p>More about the veneration of the saints: <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85-%D0%B2-%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D0%B8">https://bibleox.com/ru/ru/w/почитание-святых-в-Библии</a></p><h2>Criticism</h2><h3>“To the Law and to the Testimony” (Is. 8:20)</h3><p>In defense of Sola Scriptura the following quote from the Old Testament is cited:</p><blockquote><p>“And <strong>when they say to you, ‘Seek those who are mediums and wizards, who whisper and mutter,’</strong> should not a people seek their God? Should they seek the dead on behalf of the living? <strong>To the law and to the testimony! If they do not speak according to this word, it is because there is no light in them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/8/#L19-20">Is. 8:19-20</a>) [4]</p></blockquote><ol><li><p>Nothing is said here about the superiority of Scripture over Tradition. Needless to say, <strong>between sorcerers and Scripture one must choose Scripture</strong>. These lines speak of comparing the Pentateuch of Moses (the Torah) and Revelation (the words of the prophets) with the words of sorcerers and mediums, who should not exist among the people at all (<a href="https://bibleox.com/en/eng-nkjv/vtor/18/#L9-14">Deut. 18:9-14</a>). The prophet Isaiah proposes using the Torah and the prophetic words as an external means of exposing the sorcerers, pointing out to the people the difference between what the sorcerers say and what God says.</p></li></ol><ol start="2"><li><p>Moreover, in Old Testament times Scripture in principle could not be separated from Tradition. Without Tradition it could not only not be understood rightly, but not even read rightly, because it was written only in consonants (<a href="https://bibleox.com/en/en/w/Lx6s_The_Evangelists_Refer_to_the_Septuagint/#HH-The-Septuagint-LXX--What-Is-It">more</a>). Not knowing the reading, one and the same word can be read in different ways. To read the words correctly, one has to be within the <strong>tradition</strong> of reading, and it was handed down as Tradition from forefathers to descendants. Therefore any words about Scripture are inseparable from Tradition.</p></li><li><p>It is worth reminding opponents of their own thesis — “Sola scriptura” insists on the word “Sola” (alone): that Scripture alone is the highest authority. However, in the quote cited there is no such exclusiveness of the authority of Scripture, no word “alone” (or anything similar), which the supporters of “Scripture <strong>alone</strong>” wish to see. If one adds it here only on the ground that Tradition is not directly mentioned, then one should be consistent and admit that other, similar quotes propose building faith on Tradition alone, since Scripture is not mentioned:</p></li></ol><blockquote><p>“<strong>Hold fast</strong> <strong>the pattern of sound words which you have <mark>heard</mark> from me</strong>, in faith and love which are in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L13">2 Tim. 1:13</a>)</p></blockquote><blockquote><p><em>“And </em><strong><em>the things that you have <mark>heard</mark> from me </em></strong><em>among many witnesses, </em><strong><em><mark>commit these to faithful</mark></em></strong><em> men who will be able to teach others also” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2"><em>2 Tim. 2:2</em></a><em>)</em></p></blockquote><p>Following the Tradition that was heard makes it possible not only to distinguish right from wrong, but infinitely more — it makes it possible to abide in God:</p><blockquote><p><em>“Therefore </em><strong><em>let that abide in you</em></strong><em> </em><strong><em>which you <mark>heard</mark> from the beginning</em></strong><em>. </em><strong><em>If what you <mark>heard</mark> from the beginning abides in you, you also will abide in the Son and in the Father</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1in/2/#L24"><em>1 John. 2:24</em></a><em>)</em></p></blockquote><p>The Lord Jesus Christ Himself also calls to keep what was heard, when almost all of the New Testament Scripture had already been written:</p><blockquote><p><em>“</em><strong><em>Remember therefore how you have received and <mark>heard</mark>; hold fast</em></strong><em> and repent. Therefore if you will not watch, I will come upon you as a thief, and you will not know what hour I will come upon you” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L3"><em>Rev. 3:3</em></a><em>)</em></p></blockquote><p>Does this mean that the Lord and the apostles teach “Tradition alone”? After all, having written this very Scripture, here they do not even mention Scripture, but require following Tradition.</p><p>Taking only these verses, the opponents of the Church could in exactly the same way invent the opposite extreme — the thesis “Tradition alone”. But since they did not receive the Tradition of the apostles, having arisen fifteen centuries (and more) after the apostles, and having no aim of defending Tradition, they do not derive such extremes about Tradition. The Church, however, having received from the apostles both Tradition and Scripture, rejects neither the one nor the other, and also does not reject the commandments of the apostles to keep the oral Tradition, regarding both Scripture and Tradition as equally true.</p><h3>“Not to Think Beyond What Is Written” (1 Cor. 4:6)</h3><blockquote><p>“Now these things, brethren, I have figuratively transferred to myself and Apollos for your sakes, that <strong>you may learn in us</strong> <strong>not to think beyond what is written</strong>, that none of you may be puffed up on behalf of one against the other” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L6">1 Cor. 4:6</a>)</p></blockquote><p>Here a certain written text is spoken of, on the basis of which one must understand that one should not be puffed up against one another. What text is meant? The previous chapter of this same epistle, in which a lesson of a lowly opinion of oneself was taught. The apostle proposes <strong>to learn from them not to be puffed up</strong> against one another, not thinking beyond what had just been written.</p><p>This epistle was written because of a division that had arisen in the Corinthian community. Throughout chapter 2 the apostle diminished the significance of himself and Apollos, exalting Christ, in order to prevent divisions in Corinth into followers of Paul and followers of Apollos (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L4-7">1 Cor. 3:4-7</a>), to prevent the division of the Church into parties. Those who were dividing did not differ in teaching (otherwise the apostle would have spoken about teaching), but in their attitude to one another. They divided by the name of a church teacher, as if everyone in the Church should have fellowship only with those who had studied under the same teacher, and reject the disciples of other church teachers. To correct this false thinking, the apostle diminished the significance of the names by which the divisions had formed, that is, he humbled himself and Apollos, exalting Christ.</p><p>A little further on, summing up what had been said, the apostle says the same in other words, calling on them to follow no longer what was written, but himself:</p><blockquote><p>“<strong><mark>Therefore</mark> I urge you, <mark>imitate me</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L16-17">1 Cor. 4:16-17</a>)</p></blockquote><p>Thus the quote is about Christians <strong>not thinking <u>of themselves</u> beyond the written apostolic example</strong>, and, following the call to a lowly opinion of oneself, not being puffed up against one another and not dividing.</p><h3>Not to Listen Even to an Apostle or an Angel if They Teach Otherwise?</h3><p>From the supporters of Sola Scriptura one can hear the argument that the apostle places his own letters above himself and even above an angel of God. They refer to this line:</p><blockquote><p><em>“But </em><strong><em>even if we, or an angel from heaven, preach any other gospel</em></strong><em> to you than what we have preached to you, </em><strong><em>let him be accursed</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gal/1/#L8"><em>Gal. 1:8</em></a><em>)</em></p></blockquote><p>The apostle is not speaking here about himself, but has in mind false letters that were sent to the communities as if in the name of the apostles:</p><blockquote><p>“<strong>not to be soon shaken in mind</strong> or troubled, either by spirit or by word or <strong>by letter, as if from us</strong>, as though the day of Christ had come. Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and the man of sin is revealed, the son of perdition” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L2-3">2 Thess. 2:2-3</a>)</p></blockquote><p>He also teaches not to listen to the revelations of people who falsely present themselves as speaking with the tongues of angels and as if prophesying from them.</p><p>How can one determine that a letter is not from an apostle, and a revelation not from an angel? Another faith is communicated in them. Not the one which the apostles once handed down. Of course, the apostle is not trying to take away the authority given by God to the apostles. The preceding lines, and indeed the whole epistle, are written against the teachers who had arisen and were seducing the Galatians into Judaism.</p><blockquote><p>“O foolish <strong>Galatians! Who has bewitched you</strong> that you should not obey the truth, before whose eyes Jesus Christ was clearly portrayed among you as crucified?” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L1">Gal. 3:1</a>)</p></blockquote><blockquote><p>“<strong>I am afraid</strong> for you, <strong>lest I have labored for you in vain</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L11">Gal. 4:11</a>)</p></blockquote><blockquote><p>“You ran well. <strong>Who hindered you</strong> from obeying the truth? &lt;...&gt; <strong>I could wish that those who trouble you would even cut themselves off!</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L7,12">Gal. 5:7,12</a>)</p></blockquote><p>The apostle’s intention is to protect his flock from false teachers, and not from himself, and still less from the angels of God. The holy angels cannot lead astray from the true path the Church of the God whom they serve. The apostle only makes clear that one must hold to the faith which he once handed down, and whoever teaches otherwise, even if he presented himself as an apostle or pretended to be an angel of God, should not be received.</p><hr><p>In this quote there are three steps of meaning:</p><ol><li><p><strong>These things</strong> I <strong>have figuratively transferred</strong> (μετεσχημάτισα) to myself and Apollos for your sakes, <strong>that (ἵνα),</strong></p></li><li><p><strong>you may learn in us</strong> not to think [of yourselves] beyond what is written [a chapter earlier], <strong>that (ἵνα),</strong></p></li><li><p>none of you may be <strong>puffed up</strong> on behalf of one against the other.</p></li></ol><p>Where did the apostle portray himself and Apollos as not puffed up before the other brethren? A chapter earlier:</p><blockquote><p>“For when one says, ‘I am of Paul,’ and another, ‘I am of Apollos,’ are you not carnal? <strong>Who then is Paul, and who is Apollos, but ministers</strong> through whom you believed, as the Lord gave to each one? <strong><mark>I planted, Apollos watered</mark>, but God gave the increase. So then <mark>neither he who plants is anything, nor he who waters</mark></strong>, but God who gives the increase” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L4-7">1 Cor. 3:4-7</a>)</p></blockquote><p>In a similar way the apostle speaks in another epistle, calling to be of one mind:</p><blockquote><p>“<strong>Be of the same mind</strong> toward one another. <strong><mark>Do not set your mind on high things</mark></strong>, but <strong>associate with the humble</strong>. Do not be wise in your own opinion” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L16">Rom. 12:16</a>)</p></blockquote><p>The Savior taught the same:</p><ul><li><p>“whoever exalts himself will be humbled, and he who humbles himself will be exalted” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L12">Matt. 23:12</a>)</p></li><li><p>“whoever desires to become great among you shall be your servant” (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L43">Mark. 10:43</a>)</p></li></ul><p>Thus the apostle only calls to humility and unity, referring to what was written about himself and Apollos earlier.</p><p>In this same epistle the apostle praises the Corinthians for keeping the tradition:</p><blockquote><p><em>“Now I praise you, brethren, that </em><strong><em>you remember me in all things and <mark>keep the traditions</mark> just <mark>as I delivered them to you</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2"><em>1 Cor. 11:2</em></a><em>)</em></p></blockquote><p>And he says that the Corinthians are saved if only they hold fast what was taught, as it was proclaimed:</p><blockquote><p><em>“Moreover, brethren, I declare to you the gospel which I preached to you, which also you received and in which you stand, by which also you are saved, if </em><strong><em><mark>you hold fast that word</mark></em></strong><em> </em><strong><em><mark>which I preached to you</mark></em></strong><em> — unless you believed in vain” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L1-2"><em>1 Cor. 15:1-2</em></a><em>)</em></p></blockquote><p>There are also many other statements about the oral tradition, already mentioned earlier. Let us cite some of them:</p><blockquote><p>“Hold fast <strong>the pattern of sound words which you have <u>heard</u> from me</strong>, in faith and love which are in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L13">2 Tim. 1:13</a>)</p></blockquote><blockquote><p><em>“And </em><strong><em>the things that you have <u>heard</u> from me </em></strong><em>among many witnesses, </em><strong><em>commit these to faithful</em></strong><em> men who will be able to teach others also” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2"><em>2 Tim. 2:2</em></a><em>)</em></p></blockquote><blockquote><p><em>“Therefore </em><strong><em>let that abide in you</em></strong><em> </em><strong><em>which you <u>heard</u> from the beginning</em></strong><em>. </em><strong><em>If what you <u>heard</u> from the beginning abides in you, you also will abide in the Son and in the Father</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1in/2/#L24"><em>1 John. 2:24</em></a><em>)</em></p></blockquote><h2>Conclusion</h2><p>To defend the thesis “Scripture alone”, the following tactic is used: having no explicit quotes about Sola Scriptura, show quotes about the importance of Scripture, <strong>ignoring and</strong> <strong>keeping silent about the quotes on the importance of Tradition</strong>. In this way the listener is supposed to get the impression that Scripture alone is important.</p><p>Protestants often reproach the Orthodox, saying:</p><blockquote><p>— <strong>just show in Scripture</strong> where it is written to venerate icons, to pray to the saints and so on.</p></blockquote><p>We show it, but we tell them:</p><blockquote><p>— Tradition is also important; even Scripture confirms this.</p></blockquote><p>Then they say:</p><blockquote><p>— no, only Scripture is important.</p></blockquote><p>And then we ask them:</p><blockquote><p>— <strong>just show in Scripture</strong> that only Scripture is important, or that Scripture is more important than Tradition.</p></blockquote><p>They cannot show this, because there are no such words in Scripture. Demanding from us to show such phrases about icons, about prayers to the saints, they cannot show exactly the same kind of phrase saying that everything must be in Scripture alone. They cannot meet their own demands, showing double standards.</p><p>They themselves invented this, they themselves demand that we show everything in Scripture, and they themselves cannot show their own principle in Scripture.</p><p>So the thesis “Sola Scriptura” contradicts itself and did not allow those who invented it to arrive at the apostolic faith, but instead gave birth to thousands of new beliefs and divisions among people who believe in Christ. Sola Scriptura gained its popularity as a trick through which any person alien to the Church of Christ intends to endow his statements with divine authority and to gather separate societies on the basis of his opinion.</p>
