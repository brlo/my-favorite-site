      <h2>Definition</h2><p><strong>Grace (ancient Greek</strong> <strong>χάρις, Hebrew חֵ֣ן) </strong>— in its main meaning, the divine power acting on a person for the purpose of his salvation.[1]</p><ol><li><p><strong>The power of God,</strong> <strong>the action of God</strong> (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L10">1 Cor. 15:10</a> — “But by the <u>grace</u> of God I am what I am, and <u>His grace toward me</u> was not in vain; but I labored more abundantly than they all, yet not I, but <u>the grace of God which was with me</u>” — χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ [ἡ] σὺν ἐμοί);</p></li><li><p><strong>Mercy, kindness, a gift, favor toward someone, love toward someone</strong> (<a href="https://bibleox.com/en/eng-nkjv/gen/18/#L3">Gen. 18:3</a> — “if I have now found <u>favor</u> in Your sight” — ἄρα εὗρον χάριν ἐναντίον σου), (<a href="https://bibleox.com/en/gr-lxx-byz/sud/6/#L17">Judg. 6:17</a> — “If now I have found <u>favor</u> in Your sight” — εἰ εὗρον χάριν ἐν ὀφθαλμοῖς σου), (<a href="https://bibleox.com/en/eng-nkjv/1ts/16/#L22">1 Sam. 16:22</a> — “he has found <u>favor</u> in my sight” — εὗρεν χάριν ἐν ὀφθαλμοῖς μου), (<a href="https://bibleox.com/en/gr-lxx-byz/3ts/11/#L19">1 Kin. 11:19</a> — “Hadad found great <u>favor</u> in the sight of Pharaoh” — καὶ εὗρεν Αδερ χάριν ἐναντίον Φαραω), (<a href="https://bibleox.com/en/gr-lxx-byz/act/2/#L47">Act. 2:47</a> — “having <u>favor</u> with all the people” — ἔχοντες χάριν πρὸς ὅλον τὸν λαόν), (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L46">Act. 7:46</a> — “who found <u>favor</u> before God” — ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ), (<a href="https://bibleox.com/en/gr-lxx-byz/1kor/16/#L3">1 Cor. 16:3</a> — “to bear your <u>gift</u> to Jerusalem” — ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ);</p></li><li><p><strong>Thanksgiving to God, being pleasing to God</strong> (<a href="https://bibleox.com/en/eng-nkjv/2kor/9/#L15">2 Cor. 9:15</a> — “<u>Thanks be to God</u> for His indescribable gift!” — χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ), (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L19">1 Pet. 2:19</a> — “For this is <u>commendable</u>, if because of conscience toward God one endures grief” — τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας);</p></li><li><p><strong>Beauty</strong> (<a href="https://bibleox.com/en/eng-nkjv/pr/5/#L19">Prov. 5:19</a> — “a <u>graceful</u> doe” — πῶλος σῶν χαρίτων), (<a href="https://bibleox.com/en/gr-lxx-byz/pr/3/#L22">Prov. 3:22</a> — “<u>grace</u> to your neck” — χάρις ᾖ περὶ σῷ τραχήλῳ);</p></li><li><p><strong>Something precious</strong> (<a href="https://bibleox.com/en/eng-nkjv/pr/17/#L8">Prov. 17:8</a> — “a <u>precious</u> stone” — אֶֽבֶן ־ חֵן), (<a href="https://bibleox.com/en/eng-nkjv/ekl/10/#L12">Eccl. 10:12</a> — “The words of a wise man’s mouth are <u>gracious</u>” — λόγοι στόματος σοφοῦ χάρις), (<a href="https://bibleox.com/en/eng-nkjv/ps/45/#L2">Ps. 45:2</a> — “<u>Grace</u> is poured upon Your lips” — ἐξεχύθη χάρις ἐν χείλεσίν σου);</p></li><li><p><strong>Honor, esteem, glory</strong> (<a href="https://bibleox.com/en/en-nrsv/iudf/8/#L23">Jdt. 8:23</a> — “our slavery will not bring us into <u>favor</u>” — κατευθυνθήσεται ἡ δουλεία ἡμῶν εἰς χάριν)</p></li></ol><h2>The Calling Action of Grace</h2><blockquote><p>“I marvel that you are turning away so soon from <strong><mark>Him who called you in the grace</mark></strong> of Christ, to a different gospel” (<a href="https://bibleox.com/en/eng-nkjv/gal/1/#L6">Gal. 1:6</a>)</p></blockquote><blockquote><p>“But when it pleased God, <strong>who separated me</strong> from my mother’s womb and <strong><mark>called me through His grace</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/1/#L15">Gal. 1:15</a>)</p></blockquote><h2>Grace as a Divine Gift</h2><blockquote><p>“<strong><mark>The grace</mark></strong> of our Lord Jesus Christ <strong><mark>be with you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/16/#L23">1 Cor. 16:23</a>)</p></blockquote><blockquote><p>“<strong><mark>Grace to you</mark></strong> and peace <strong>from God</strong> our Father and the Lord Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/2kor/1/#L2">2 Cor. 1:2</a>)</p></blockquote><blockquote><p>“But <strong><mark>you shall receive power</mark></strong> (δύναμιν) <strong>when the Holy Spirit has come upon you</strong>; and you shall be witnesses to Me…” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L8">Act. 1:8</a>)</p></blockquote><blockquote><p>“And I thank Christ Jesus our Lord <strong><mark>who has enabled me</mark></strong>, because He counted me faithful, putting me into the ministry” (<a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L12">1 Tim. 1:12</a>)</p></blockquote><blockquote><p>“of which I became a minister according to <strong><mark>the gift of the grace of God given to me by the effective working of His power</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/3/#L7">Eph. 3:7</a>)</p></blockquote><blockquote><p>“But <strong>to each one of us <mark>grace was given</mark></strong> according to the measure of Christ’s gift” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L7">Eph. 4:7</a>)</p></blockquote><blockquote><p>“and by their prayer for you, who long for you because of <strong><mark>the exceeding grace of God in you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/9/#L14">2 Cor. 9:14</a>)</p></blockquote><blockquote><p>“And <strong><mark>God is able to make all grace abound toward you</mark></strong>, that you, always having all sufficiency in all things, may have an abundance for every good work” (<a href="https://bibleox.com/en/eng-nkjv/2kor/9/#L8">2 Cor. 9:8</a>)</p></blockquote><blockquote><p>“And lest I should be exalted above measure by the abundance of the revelations, a thorn in the flesh was given to me, a messenger of Satan to buffet me, lest I be exalted above measure. Concerning this thing I pleaded with the Lord three times that it might depart from me. And He said to me, ‘<strong><mark>My grace</mark> (χάρις) <mark>is sufficient for you</mark>, for My strength (δύναμις) is made perfect in weakness</strong>.’ Therefore most gladly I will rather boast in my infirmities, <strong><mark>that the power </mark>(δύναμις) of Christ may rest upon me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/12/#L7-9">2 Cor. 12:7-9</a>)</p></blockquote><blockquote><p>“We then, as workers together with Him also plead with you <strong><mark>not to receive the grace of God in vain</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/6/#L1">2 Cor. 6:1</a>)</p></blockquote><blockquote><p>“But by the grace (χάριτι) of God I am what I am, and <strong><mark>His grace (χάρις) toward me</mark> was not in vain</strong>, but I <strong>labored</strong> more abundantly than they all, <strong>yet not I, but <mark>the grace (χάρις) of God which was with me</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L10">1 Cor. 15:10</a>)</p></blockquote><blockquote><p>“Then Peter said to them, ‘Repent, and let every one of you be baptized in the name of Jesus Christ for the remission of sins; and <strong><mark>you shall receive the gift of the Holy Spirit</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Act. 2:38</a>)</p></blockquote><blockquote><p>“Now He who establishes us with you in Christ and has anointed us is God, who also has sealed us and <strong><mark>given us the Spirit</mark> in our hearts as a guarantee</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/1/#L21-22">2 Cor. 1:21-22</a>)</p></blockquote><blockquote><p>“But you are not in the flesh but in the Spirit, if indeed <strong><mark>the Spirit of God dwells in you</mark></strong>. Now if anyone does not have the Spirit of Christ, he is not His” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L9">Rom. 8:9</a>)</p></blockquote><blockquote><p>“Do you not know that you are the temple of God and that <strong>the Spirit of God dwells</strong> in you?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L16">1 Cor. 3:16</a>)</p></blockquote><blockquote><p><em>“For you did not receive the spirit of bondage again to fear, but </em><strong><em>you <mark>received the Spirit</mark> of adoption <mark>by whom we cry out</mark>, ‘Abba, Father’</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/8/#L15"><em>Rom. 8:15</em></a><em>)</em></p></blockquote><blockquote><p><em>“And because you are sons, </em><strong><em>God <mark>has sent forth the Spirit</mark> of His Son <mark>into your hearts, crying out</mark>, ‘Abba, Father!’</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gal/4/#L6"><em>Gal. 4:6</em></a><em>)</em></p></blockquote><blockquote><p>“But <strong><mark>the anointing</mark></strong> which <strong><mark>you have received</mark> from Him <mark>abides in you</mark></strong>, and you do not need that anyone teach you; but as <strong><mark>the same anointing teaches you</mark></strong> concerning all things, and is true, and is not a lie, and just as it has taught you, you will abide in Him” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L27">1 John. 2:27</a>)</p></blockquote><blockquote><p>“We then, as workers together with Him also plead with you <strong>not to receive <mark>the grace</mark> of God <mark>in vain</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/6/#L1">2 Cor. 6:1</a>)</p></blockquote><blockquote><p>“For you are the temple of the living God. As God has said: ‘<strong><mark>I will dwell in them and walk among them</mark></strong>. I will be their God, and they shall be My people’” (<a href="https://bibleox.com/en/eng-nkjv/2kor/6/#L16">2 Cor. 6:16</a>)</p></blockquote><blockquote><p>“Jesus answered and said to him, ‘If anyone loves Me, he will keep My word; and My Father will love him, and <strong><mark>We will come to him and make Our home with him</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L23">John. 14:23</a>)</p></blockquote><blockquote><p>“For <strong><mark>it is good that the heart be established by grace</mark></strong>, not with foods which have not profited those who have been occupied with them” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L9">Heb. 13:9</a>)</p></blockquote><blockquote><p>“Therefore, since we are receiving a kingdom which cannot be shaken, <strong><mark>let us have grace</mark>, by which we may serve</strong> God acceptably with reverence and godly fear” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L28">Heb. 12:28</a>)</p></blockquote><blockquote><p>“Then <strong>they brought</strong> little children to Him, <strong>that He might touch them</strong>; but the disciples rebuked those who brought them. But when Jesus saw it, He was greatly displeased and said to them, ‘Let the little children come to Me, and do not forbid them; for of such is the kingdom of God.’ &lt;...&gt; And He <strong>took them up in His arms</strong>, <strong><mark>laid His hands on them, and blessed them</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L13-14,16">Mark. 10:13-14,16</a>)</p></blockquote><blockquote><p>“And He led them out as far as Bethany, and <strong><mark>He lifted up His hands and blessed them</mark></strong>. Now it came to pass, while He blessed them, that He was parted from them and carried up into heaven” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L50-51">Luke. 24:50-51</a>)</p></blockquote><h2>The Action of Grace Through People</h2><blockquote><p>“Therefore I have reason to glory in Christ Jesus in the things which pertain to God. For I will not dare to speak of any of those things which <strong>Christ has not <mark>accomplished through me</mark></strong>, in word and deed, to make the Gentiles obedient — <strong>in mighty</strong> (δυνάμει) signs and wonders, <strong><mark>by the power (δυνάμει) of the Spirit of God</mark></strong>, so that from Jerusalem and round about to Illyricum I have fully preached the gospel of Christ” (<a href="https://bibleox.com/en/eng-nkjv/rim/15/#L17-19">Rom. 15:17-19</a>)</p></blockquote><blockquote><p>“Therefore I remind you to stir up <strong><mark>the gift of God</mark></strong> which is <strong>in you <mark>through the laying on of my hands</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6">2 Tim. 1:6</a>)</p></blockquote><p>They received grace in order to bring the nations to obedience:</p><blockquote><p>“Through Him <strong><mark>we have received grace</mark></strong> and <strong>apostleship</strong> <strong><mark>for obedience to the faith among all nations</mark></strong> for His name” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L5">Rom. 1:5</a>)</p></blockquote><blockquote><p>“Let no corrupt <strong>word</strong> proceed out of your mouth, but what is <strong>good</strong> for necessary edification, that it may <strong>impart grace to the hearers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L29">Eph. 4:29</a>)</p></blockquote><blockquote><p>“<strong>Let your speech always be with grace</strong>, seasoned with salt, that you may know how you ought to answer each one” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L6">Col. 4:6</a>)</p></blockquote><h2>Grace Is Given to the Humble</h2><blockquote><p>“Surely He scorns the scornful, but <strong><mark>gives grace to the humble</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/3/#L34">Prov. 3:34</a>)</p></blockquote><blockquote><p>“But He gives more grace. Therefore He says: ‘God resists the proud, but <strong><mark>gives grace to the humble</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/iak/4/#L6">James. 4:6</a>)</p></blockquote><blockquote><p>“Likewise you younger people, submit yourselves to your elders. Yes, all of you be submissive to one another, and be clothed with humility, for ‘God resists the proud, but <strong><mark>gives grace to the humble</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L5">1 Pet. 5:5</a>)</p></blockquote><h2>The Need to Stir Up Grace</h2><blockquote><p>“Therefore <strong><mark>I remind you to stir up the gift of God</mark></strong> which is in you through the laying on of my hands” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6">2 Tim. 1:6</a>)</p></blockquote>
