    body: |-
      <ol><li><p><strong>Holiness</strong> is the complete setting apart of a thing for one particular purpose.</p></li><li><p><strong>Holiness</strong> is a way of life dedicated to God.</p></li><li><p><strong>A saint</strong> is one who lives without sin, according to the will of God.</p></li></ol><blockquote><p>“For the death that He died, <strong>He died to sin once for all; but the life that He lives, He lives to God</strong>. Likewise you also, <strong>reckon yourselves to be dead indeed to sin, but alive to God</strong> in Christ Jesus our Lord. Therefore <strong>do not let sin reign in your mortal body</strong>, that you should obey it in its lusts. And <strong>do not present your members</strong> as instruments of unrighteousness <strong>to sin</strong>, but present yourselves to God as being alive from the dead, and your members as instruments of righteousness to God. &lt;...&gt; And having been set free from sin, you became slaves of righteousness. &lt;...&gt; But now <strong>having been set free from sin, and having become slaves of God, you have your fruit to holiness</strong>, and the end, everlasting life” (<a href="https://bibleox.com/en/eng-nkjv/rim/6/#L10-13,18,22">Rom. 6:10-13,18,22</a>)</p></blockquote><blockquote><p>“Whoever has been born of God does not sin, for His seed remains in him; and he <strong>cannot sin</strong>, because he has been born of God” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L9">1 John. 3:9</a>)</p></blockquote><blockquote><p>“We know that <strong>whoever is born of God does not sin</strong>; but he who has been born of God keeps himself, and the wicked one does not touch him” (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L18">1 John. 5:18</a>)</p></blockquote><blockquote><p>“Pursue <strong>peace</strong> with all people, and <strong>holiness, without which no one will see the Lord</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L14">Heb. 12:14</a>)</p></blockquote><blockquote><p>“<strong>The city</strong> had no need of the sun or of the moon to shine in it &lt;...&gt; Its gates shall not be shut at all by day (there shall be no night there). &lt;...&gt; But <strong>there shall by no means enter it anything that defiles, or causes an abomination or a lie</strong>, but only those who are written in the Lamb’s Book of Life” (<a href="https://bibleox.com/en/eng-nkjv/otkr/21/#L23,25,27">Rev. 21:23,25,27</a>)</p></blockquote>

  - src: святыня
