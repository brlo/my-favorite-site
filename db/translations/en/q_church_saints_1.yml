    title: Sacred Things
    menu: { parent: Church/Saints, title: Sacred Things, priority: 2 }
    body: |-
      <h2>Sacred Things in the New Testament</h2><h3>The Holy Temple</h3><p>The temple in Jerusalem was an image of the true sanctuary:</p><blockquote><p>“For <strong>Christ has not entered the holy places made with hands, <mark>which are copies of the true</mark></strong>, but into heaven itself, now to appear in the presence of God for us” (<a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24">Heb. 9:24</a>)</p></blockquote><blockquote><p>“Now the Passover of the Jews was at hand, and Jesus went up to Jerusalem. And He found <strong><mark>in the temple</mark></strong> those who sold oxen and sheep and doves, and the money changers doing business. When He had made a whip of cords, <strong>He drove them all out of the temple</strong>, with the sheep and the oxen, and poured out the changers’ money and overturned the tables. And He said to those who sold doves, ‘Take these things away! <strong>Do not make <mark>My Father’s house</mark> a house of merchandise!</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/2/#L13-16">John. 2:13-16</a>)</p></blockquote><blockquote><p>“and [the apostles] <strong><mark>were continually in the temple</mark></strong> praising and blessing God. Amen” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L53">Luke. 24:53</a>)</p></blockquote><blockquote><p>“So <strong>continuing daily</strong> [the believers] with one accord <strong><mark>in the temple</mark></strong>, and breaking bread from house to house, they ate their food with gladness and simplicity of heart” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L46">Act. 2:46</a>)</p></blockquote><p>The apostle prays in the temple, and there Christ appears to him in a vision:</p><blockquote><p>“Now it happened, when I returned to Jerusalem and <strong><mark>was praying in the temple</mark>, that I was in a trance</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L17">Act. 22:17</a>)</p></blockquote><p>The Antichrist (the man of sin) will sit in the temple of God (obviously, in order to sit in the temple of God, it must exist: not a temple of Zeus and not a temple of Perun, but the temple of God):</p><blockquote><p>“Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and <strong>the man of sin</strong> is revealed, the son of perdition, <strong>who opposes and exalts himself above</strong> all <strong>that is called God</strong> or <strong>that is worshiped</strong> <em>(Greek: σέβασμα — “an object of worship, a sacred thing”)</em>, so that <strong><mark>he sits as God in the temple of God</mark></strong>, showing himself that he is God” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L3-4">2 Thess. 2:3-4</a>)</p></blockquote><h3>The Holy Place</h3><p>In the holy place the hearers must see something:</p><blockquote><p>“Therefore <strong>when you see the ‘abomination</strong> of desolation,’ spoken of by Daniel the prophet, <strong>standing in <mark>the holy place</mark></strong>” (whoever reads, let him understand)” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L15">Matt. 24:15</a>)</p></blockquote><h3>Holy Objects</h3><h4>The Temple and the Altar Are Still Holy and Sanctify</h4><blockquote><p>“Fools and blind! For which is greater, the gold or <strong><mark>the temple that sanctifies</mark></strong> the gold? &lt;...&gt; Fools and blind! For which is greater, the gift or <strong><mark>the altar that sanctifies</mark></strong> the gift?” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L17,19">Matt. 23:17,19</a>)</p></blockquote><h4>An Angel Grants Healing Through Water</h4><blockquote><p>“For <strong>an angel</strong> went down at a certain time into the pool and <strong>stirred up <mark>the water</mark>; then whoever stepped in first</strong>, after the stirring of the water, <strong><mark>was made well</mark></strong> of whatever disease he had” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L4">John. 5:4</a>)</p></blockquote><h4>The Apostles Healed Through Anointing with Oil</h4><blockquote><p>“And He called the twelve to Himself, and began to send them out two by two, and gave them power over unclean spirits. &lt;...&gt; So they went out and preached that people should repent. And they cast out many demons, and <strong><mark>anointed with oil many who were sick, and healed them</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L7,12-13">Mark. 6:7,12-13</a>)</p></blockquote><blockquote><p>“Is anyone among you sick? <strong>Let him call for the elders of the church</strong>, and let them <strong>pray over him, <mark>anointing him with oil</mark> in the name of the Lord</strong>. And the prayer of faith will save the sick, and the Lord will raise him up. And if he has committed sins, he will be forgiven” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15">James. 5:14-15</a>)</p></blockquote><h4>The Blood of Christ Is a Sacred Thing</h4><blockquote><p><em>“Anyone who has rejected Moses’ law dies without mercy on the testimony of two or three witnesses. </em><strong><em>Of how much <mark>worse punishment</mark>, do you suppose, <mark>will he be thought worthy who</mark> has trampled the Son of God underfoot, <mark>counted the blood of the covenant</mark> by which he was sanctified <mark>a common thing</mark>, and insulted the Spirit of grace?</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/10/#L28-29"><em>Heb. 10:28-29</em></a><em>)</em></p></blockquote><h4>People Are Healed by Touching Clothing Left by the Apostles</h4><blockquote><p><em>“so that </em><strong><em>even <mark>handkerchiefs or aprons were brought from his body</mark> to the sick, and the diseases left them and the evil spirits went out</em></strong><em> of them” (</em><a href="https://bibleox.com/en/eng-nkjv/act/19/#L12"><em>Act. 19:12</em></a><em>)</em></p></blockquote><h4>The Antichrist Will Exalt Himself Above What Is Sacred</h4><p>Obviously, in order to exalt oneself above what is sacred, it must exist:</p><blockquote><p>“Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and <strong>the man of sin</strong> is revealed, the son of perdition, <strong>who opposes and <mark>exalts himself above</mark></strong> all <strong>that is called God</strong> or <strong><mark>that is worshiped</mark></strong> <em>(Greek: σέβασμα — “an object of worship, a sacred thing”)</em>, so that he sits as God in the temple of God, showing himself that he is God” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L3-4">2 Thess. 2:3-4</a>)</p></blockquote><h3>A Holy Image</h3><h4>People Expected Healing from the Apostle’s Shadow</h4><blockquote><p>“so that <strong>they brought the sick out</strong> into the streets and laid them on beds and couches, <strong>that at least the shadow of Peter passing by might fall on some of them</strong>. Also a multitude gathered from the surrounding cities to Jerusalem, bringing sick people and those who were tormented by unclean spirits, and <strong>they were all healed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15-16">Act. 5:15-16</a>)</p></blockquote><h3>Sacred Persons (Priests)</h3><h4>Christ Appears Only to the Apostles. Christ Gives Authority Only to Them</h4><blockquote><p><em>“So Jesus said to them again, ‘Peace to you! As the Father has sent Me, I also send you.’ And when He had said this, </em><strong><em>He breathed</em></strong><em> on them, and said to them, ‘</em><strong><em>Receive the Holy Spirit.</em></strong><em> </em><strong><em>If you forgive the sins of any, they are forgiven them; if you retain the sins of any, they are retained</em></strong><em>’” (</em><a href="https://bibleox.com/en/eng-nkjv/in/20/#L21-23"><em>John. 20:21-23</em></a><em>)</em></p></blockquote><blockquote><p>“Assuredly, I say to you, <strong>whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L18">Matt. 18:18</a>)</p></blockquote><h3>Sacred Rites and Sacraments</h3><p>The Eucharistic sacrifice (of the New Testament). The Lord teaches its celebration to the apostles alone:</p><blockquote><p><em>“And as they were eating, Jesus </em><strong><em>took <mark>bread</mark>, blessed and <mark>broke</mark> it, and gave it to the disciples and said, ‘Take, eat; this is My body.’</em></strong><em> Then </em><strong><em>He took <mark>the cup</mark>, and gave thanks, and gave it to them, saying, ‘Drink from it, all of you. For this is My blood of the new covenant</em></strong><em>, which is shed for many for the remission of sins’” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/26/#L26-28"><em>Matt. 26:26-28</em></a><em>) / Also: </em><a href="https://bibleox.com/en/eng-nkjv/mk/14/#L22-24"><em>Mark. 14:22-24</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/lk/22/#L19-20"><em>Luke. 22:19-20</em></a></p></blockquote><blockquote><p>“And He <strong>took <mark>bread</mark>, gave thanks and <mark>broke</mark> it, and gave it to them, saying, ‘This is My body which is given for you; <mark>do this</mark> in remembrance of Me.’</strong> <strong><mark>Likewise He also took the cup</mark></strong> after supper, saying, ‘This cup is the new covenant in My blood, which is shed for you’” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L19-20">Luke. 22:19-20</a>)</p></blockquote><p>Then He separately teaches the same order (rite) to the later-converted Apostle Paul:</p><blockquote><p><em>“For </em><strong><em>I received from the Lord</em></strong><em> that which I also delivered to you: that the Lord Jesus on the same night in which He was betrayed </em><strong><em>took <mark>bread</mark>; and when He had given thanks</em></strong><em>, He </em><strong><em><mark>broke</mark></em></strong><em> it and said, ‘Take, eat; </em><strong><em>this is My body</em></strong><em> which is broken for you; </em><strong><em><mark>do this</mark></em></strong><em> in remembrance of Me.’ </em><strong><em><mark>In the same manner He also took the cup</mark></em></strong><em> after supper, saying, ‘</em><strong><em>This cup is the new covenant in My blood</em></strong><em>. This do, as often as you drink it, in remembrance of Me’” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L23-25"><em>1 Cor. 11:23-25</em></a><em>)</em></p></blockquote><h3>The Laying On of Hands with Prayer</h3><blockquote><p><em>“Therefore I remind you to stir up </em><strong><em><mark>the gift of God</mark> which is in you <u><mark>through</mark></u><mark> the laying on of my hands</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6"><em>2 Tim. 1:6</em></a><em>)</em></p></blockquote><blockquote><p><em>“Do not neglect </em><strong><em>the <mark>gift</mark> that is in you, which was given to you by prophecy <mark>with the laying on of the hands of the eldership</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L14"><em>1 Tim. 4:14</em></a><em>)</em></p></blockquote><blockquote><p><em>“As they ministered to the Lord and fasted, the Holy Spirit said, ‘Now separate to Me Barnabas and </em><strong><em><mark>Saul</mark></em></strong><em> for the work to which I have called them.’ Then, having fasted and prayed, and </em><strong><em><mark>laid hands on them</mark></em></strong><em>, they sent them away” (</em><a href="https://bibleox.com/en/eng-nkjv/act/13/#L2-3"><em>Act. 13:2-3</em></a><em>)</em></p></blockquote><blockquote><p><em>“whom they set before the apostles; and when they had prayed, they </em><strong><em><mark>laid hands on them</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/act/6/#L6"><em>Act. 6:6</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/act/21/#L8"><em>21:8</em></a><em>)</em></p></blockquote><blockquote><p><em>“of the </em><strong><em><mark>doctrine</mark></em></strong><em> of baptisms, </em><strong><em><mark>of laying on of hands</mark></em></strong><em>, of resurrection of the dead, and of eternal judgment” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/6/#L2"><em>Heb. 6:2</em></a><em>)</em></p></blockquote><blockquote><p>“And when Simon saw that <strong><mark>through the laying on of the apostles’ hands the Holy Spirit was given</mark></strong>, he offered them money, saying, ‘Give me this power also, that anyone on whom I lay hands may receive the Holy Spirit.’ But Peter said to him, ‘Your money perish with you, because you thought that <strong>the gift of God</strong> could be purchased with money!’” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L18-20">Act. 8:18-20</a>)</p></blockquote><blockquote><p>“For as yet He had fallen upon none of them. They had only been baptized in the name of the Lord Jesus. Then <strong><mark>they laid hands on them, and they received the Holy Spirit</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L16-17">Act. 8:16-17</a>)</p></blockquote><h3>The Gift of God to Impart Grace</h3><blockquote><p>“Then Peter said, ‘Silver and gold I do not have, but <strong><mark>what I do have I give you</mark></strong>: In the name of Jesus Christ of Nazareth, rise up and walk.’ And he took him by the right hand and lifted him up, and immediately his feet and ankle bones received strength. So he, leaping up, stood and walked and entered the temple with them — walking, leaping, and praising God” (<a href="https://bibleox.com/en/eng-nkjv/act/3/#L6-8">Act. 3:6-8</a>)</p></blockquote><h2>Sacred Things in the Old Testament</h2><h3>The Holy Temple</h3><blockquote><p>“Then <strong>the LORD spoke</strong> to Moses, saying: ‘Speak to the children of Israel, <strong>that they bring</strong> Me an offering. From everyone who gives it willingly with his heart you shall take My offering. &lt;...&gt; And let them make <strong><em><mark>Me a sanctuary (Greek </mark></em><mark>ἁγίασμα — a sacred thing</mark><em><mark>)</mark></em></strong>, that I may dwell among them. According to <strong><mark>all that I show you</mark></strong>, that is, <strong><mark>the pattern of the tabernacle</mark></strong> and the pattern of all its furnishings, just so you shall make it’” (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1-2,8-9">Ex. 25:1-2,8-9</a>)</p></blockquote><blockquote><p><em>“Behold, a son shall be born to you: &lt;…&gt; </em><strong><em>He shall build a house for My name</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1par/22/#L9-10"><em>1 Chr. 22:9-10</em></a><em>)</em></p></blockquote><blockquote><p><em>“But as for me, I will come into Your house in the multitude of Your mercy; in fear of You I </em><strong><em>will worship</em></strong><em> toward </em><strong><em><mark>Your holy temple</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7"><em>Ps. 5:7</em></a><em>)</em></p></blockquote><h3>The Holy Place</h3><blockquote><p><em>“Then He said, ‘Do not draw near this place. Take your sandals off your feet, for </em><strong><em><mark>the place</mark> where you stand <mark>is holy ground</mark></em></strong><em>’” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/3/#L5"><em>Ex. 3:5</em></a><em>)</em></p></blockquote><blockquote><p><em>“Then the Commander of the LORD’s army said to Joshua, ‘Take your sandal off your foot, for </em><strong><em><mark>the place</mark> where you stand <mark>is holy</mark></em></strong><em>.’ And Joshua did so” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/5/#L15"><em>Josh. 5:15</em></a><em>)</em></p></blockquote><blockquote><p><em>“And you shall take the ram of the consecration and boil its flesh </em><strong><em>in <mark>the holy place</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/29/#L31"><em>Ex. 29:31</em></a><em>)</em></p></blockquote><h3>Holy Objects</h3><p>The holy anointing oil (chrism) is a sacred thing. The temple and all the temple objects anointed with it are sacred. Of people, only the descendants of Aaron may be anointed with it, so that they become priests:</p><blockquote><p>“Also take for yourself quality spices — five hundred shekels of liquid myrrh, &lt;…&gt; And you shall make from these <strong><mark>a holy anointing oil</mark></strong>, an ointment compounded according to the art of the perfumer. It shall be a holy anointing oil. With it <strong>you shall anoint the tabernacle</strong> of meeting and <strong>the ark</strong> of the Testimony; <strong>the table</strong> and <strong>all its utensils</strong>, <strong>the lampstand</strong> and its utensils, and <strong>the altar</strong> of incense; <strong>the altar of burnt offering</strong> with all its utensils, and <strong>the laver</strong> and its base. <strong><mark>You shall consecrate them</mark></strong>, that <strong><mark>they may be most holy; whatever</mark></strong> touches them must be holy. <strong>And you shall anoint Aaron and his sons</strong>, and consecrate them, that they may minister to Me as priests. And you shall speak to the children of Israel, saying: ‘This shall be a holy anointing oil to Me throughout your generations. <strong>It shall not be poured on man’s flesh</strong>; nor shall you make any other like it, according to its composition. <strong><mark>It [the oil] is holy</mark></strong>, and <strong><mark>it shall be holy to you</mark></strong>. Whoever compounds any like it, or whoever puts any of it on an outsider, shall be cut off from his people’” (<a href="https://bibleox.com/en/eng-nkjv/ish/30/#L23-33">Ex. 30:23-33</a>)</p></blockquote><p>The altar is most holy:</p><blockquote><p>“And you shall take the anointing oil, and anoint the tabernacle and all that is in it; and you shall hallow it and all its utensils, and it shall be holy. You shall anoint the altar of the burnt offering and all its utensils, and consecrate the altar. <strong><mark>The altar shall be most holy</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/40/#L9-10">Ex. 40:9-10</a>)</p></blockquote><blockquote><p><em>“Seven days you shall make atonement for the altar and sanctify it. And </em><strong><em><mark>the altar shall be most holy</mark></em></strong><em>. </em><strong><em>Whatever touches the altar must be holy</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/29/#L37"><em>Ex. 29:37</em></a><em>)</em></p></blockquote><p><a href="https://bibleox.com/ru/ru/w/%D1%84%D0%B8%D0%BC%D0%B8%D0%B0%D0%BC">The incense</a> (a fragrant substance for burning on the altar) is most holy:</p><blockquote><p>“And the LORD said to Moses: ‘Take sweet spices, stacte and onycha and galbanum, and pure frankincense with these sweet spices; there shall be equal amounts of each. You shall make of these <strong><mark>an incense</mark></strong>, a compound according to the art of the perfumer, salted, pure, and holy. And you shall beat some of it very fine, and put some of it before the Testimony in the tabernacle of meeting where I will meet with you. It shall be <strong><mark>most holy</mark></strong> to you. But as for the incense which you shall make, you shall not make any for yourselves, according to its composition. <strong><mark>It shall be to you holy</mark></strong> for the LORD. Whoever makes any like it, to smell it, he shall be cut off from his people’” (<a href="https://bibleox.com/en/eng-nkjv/ish/30/#L34-38">Ex. 30:34-38</a>)</p></blockquote><h3>A Holy Image</h3><blockquote><p><em>“</em><strong><em><mark>Moreover you shall make the tabernacle with ten curtains</mark></em></strong><em> of fine woven linen and blue, purple, and scarlet thread; </em><strong><em><mark>with artistic designs of cherubim you shall weave them</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1"><em>Ex. 26:1</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/ish/36/#L8"><em>Ex. 36:8</em></a><em>)</em></p></blockquote><blockquote><p><em>“And </em><strong><em>you shall take the anointing oil, and anoint</em></strong><em> </em><strong><em><mark>the tabernacle and all that is in it</mark></em></strong><em>; and you shall </em><strong><em><mark>hallow</mark></em></strong><em> it and </em><strong><em><mark>all its utensils</mark></em></strong><em>, and </em><strong><em><mark>it shall be holy</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/40/#L9"><em>Ex. 40:9</em></a><em>)</em></p></blockquote><h3>Sacred Persons (Priests)</h3><p><a href="https://bibleox.com/ru/ru/w/%D0%A2%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%BE-%D0%A1%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">Priests</a> are only the descendants of Aaron:</p><blockquote><p><em>“And you shall gird them with sashes, </em><strong><em>Aaron and his sons</em></strong><em>, and put the hats on them. </em><strong><em>The priesthood shall be theirs</em></strong><em> for a perpetual statute. So you shall consecrate Aaron and his sons” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/29/#L9"><em>Ex. 29:9</em></a><em>)</em></p></blockquote><p>The priesthood is handed down together with the holy garments, by anointing:</p><blockquote><p><em>“And </em><strong><em>the holy garments</em></strong><em> of Aaron </em><strong><em>shall be his sons’ after him</em></strong><em>, </em><strong><em>to be anointed in them and to be consecrated in them</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29"><em>Ex. 29:29</em></a><em>)</em></p></blockquote><p>An outsider who approached the sacred service had to die. The task of the priesthood was to watch over this:</p><blockquote><p><em>“So you shall appoint Aaron and his sons, and they shall attend to their priesthood; </em><strong><em>but the outsider who comes near shall be put to death</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/chis/3/#L10"><em>Num. 3:10</em></a><em>)</em></p></blockquote><h4>Touching the Body of the Prophet Elisha Healed</h4><blockquote><p><em>“So it was, as they were burying a man, that suddenly they spied a band of raiders; and they put the man in the tomb of Elisha; and when the man was let down and touched </em><strong><em>the bones of Elisha</em></strong><em>, he revived and stood on his feet” (</em><a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21"><em>2 Kin. 13:21</em></a><em>)</em></p></blockquote><h3>Sacred Rites and Sacraments</h3><p>In the Old Testament there were very many rites. One can learn about them from the book of Leviticus. For example, the rite of appointing a high priest: <a href="https://bibleox.com/ru/ru/w/%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B9-%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D0%BD%D0%B8%D0%BA#HH-%D0%9E%D0%B1%D1%80%D1%8F%D0%B4">https://bibleox.com/ru/ru/w/ветхозаветный-священник#HH-Обряд</a></p><p>The Eucharistic sacrifice (of the Old Testament):</p><p><a href="https://bibleox.com/en/en/w/Eucharist/#HH-Old-Testament-prototypes-of-the-Eucharist">https://bibleox.com/en/en/w/Eucharist</a></p><h3>The Laying On of Hands with Prayer</h3><h4>Jacob Blesses His Grandsons</h4><p>Jacob blessed his grandsons, laying his hands on them with prayer:</p><blockquote><p><em>“Then Israel </em><strong><em>stretched out his right <mark>hand</mark> and <mark>laid it on</mark></em></strong><em> </em><strong><em>Ephraim’s <mark>head</mark></em></strong><em>, who was the younger, </em><strong><em>and his left hand <mark>on</mark> Manasseh’s <mark>head</mark></em></strong><em>. &lt;…&gt; And he </em><strong><em><mark>blessed</mark></em></strong><em> Joseph, and said: ‘God, before whom my fathers Abraham and Isaac walked, the God who has fed me all my life long to this day, </em><strong><em><mark>the Angel</mark></em></strong><em> who has redeemed me from all evil, </em><strong><em><mark>bless the lads</mark></em></strong><em>; let my name be named upon them, and the name of my fathers Abraham and Isaac; and let them grow into a multitude in the midst of the earth’” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/48/#L14-16"><em>Gen. 48:14-16</em></a><em>)</em></p></blockquote><h4>Moses Appoints Joshua the Son of Nun to Service</h4><p>God commanded the prophet Moses to appoint Joshua the son of Nun to service through the laying on of hands:</p><blockquote><p><em>“And </em><strong><em><mark>the LORD said</mark></em></strong><em> to Moses: ‘</em><strong><em><mark>Take Joshua the son of Nun</mark></em></strong><em> with you, a man in whom is the Spirit, and </em><strong><em><mark>lay your hand on him</mark></em></strong><em>’ &lt;...&gt; So Moses did as the LORD commanded him. He took Joshua and set him before Eleazar the priest and before all the congregation. </em><strong><em><mark>And he laid his hands on him</mark></em></strong><em> and inaugurated him, just as the LORD commanded by the hand of Moses” (</em><a href="https://bibleox.com/en/eng-nkjv/chis/27/#L18,22-23"><em>Num. 27:18,22-23</em></a><em>)</em></p></blockquote><h4>The Manner of Appointing the Levites to Service</h4><p>God commanded that the Levites be appointed to service at the temple through the laying on of hands:</p><blockquote><p><em>“So you shall bring the Levites before the LORD, and the children of Israel </em><strong><em><mark>shall lay their hands on the Levites</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/chis/8/#L10"><em>Num. 8:10</em></a><em>)</em></p></blockquote><h2>Criticism</h2><h3>God Does Not Dwell in Temples Made with Hands</h3><p>Critics of the Church who rise up against temples cite the verse:</p><blockquote><p>“who [David] found favor before God and asked to find a dwelling for the God of Jacob. But Solomon built Him a house. However, <strong>the Most High does not dwell in temples made with hands</strong>, as the prophet says: ‘Heaven is My throne, and earth is My footstool. What house will you build for Me? says the LORD, or what is the place of My rest?’” (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L46-49">Act. 7:46-49</a>)</p></blockquote><p>However, this in no way testifies against temples, for by the time David wanted to build a house (temple) for God, God Himself had already commanded the prophet Moses to construct the Tabernacle, consecrate it, appoint priests there, observe rites, have sacred things (the Ark), and had established death penalties for violating the order instituted by God. This verse only explains that God is everywhere, and not only in the temple. And temples are an institution of God Himself, not of man, and certainly not something supposedly borrowed from the pagans.</p><h2>Note</h2><h3>Opposing and Exalting Oneself Above What Is Sacred Is One of the Signs of the Antichrist</h3><blockquote><p>“Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and <strong><mark>the man of sin</mark></strong> is revealed, the son of perdition, <strong><mark>who opposes and exalts himself above</mark></strong> all <strong><mark>that is called</mark></strong> <strong>God</strong> or <strong><mark>that is worshiped</mark></strong>, so that he sits as God in the temple of God, showing himself that he is God” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L3-4">2 Thess. 2:3-4</a>)</p></blockquote><blockquote><p>“Little children, it is the last hour; and as you have heard that the Antichrist is coming, <strong><mark>even now many antichrists have come</mark></strong>, by which we know that it is the last hour” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18">1 John. 2:18</a>)</p></blockquote><h3>The Beast Will Blaspheme Those Who Dwell in Heaven</h3><blockquote><p>“Then he opened his mouth in blasphemy against God, <strong><mark>to blaspheme</mark></strong> His name, His tabernacle, and <strong><mark>those who dwell in heaven</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/13/#L6">Rev. 13:6</a>)</p></blockquote><h3>The Souls of the Righteous and the Angels Live in Heaven</h3><blockquote><p>“But <strong><mark>you have come</mark></strong> to Mount Zion and to the city of the living God, <strong><mark>the heavenly Jerusalem</mark>, to an innumerable company of <mark>angels</mark></strong>, to the general assembly and <strong>church of the firstborn who are registered in heaven</strong>, to God the Judge of all, <strong>to <mark>the spirits of just men</mark> made perfect</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-23">Heb. 12:22-23</a>)</p></blockquote>

