      <ol><li><p>Cyprian of Carthage, hieromartyr (~200–258): “<em>Let us remember one another in concord and unanimity. </em><strong><em>Let us on both sides always pray for one another</em></strong><em>. Let us relieve burdens and afflictions by mutual love, that </em><strong><em>if any one of us, by the swiftness of divine condescension, shall go hence the first, our love may continue in the presence of the Lord, and our prayers for our brethren and sisters not cease</em></strong><em> in the presence of the Father’s mercy</em>” (<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2/">Epistle to Cornelius in exile, concerning his confession</a>)</p></li><li><p>It should be said separately that incorruption of relics is not a necessary sign for the canonization of a righteous person as a saint. The remains of many saints do decay, although it does happen that the holy remains of some righteous people not only do not turn to dust, but are even fragrant, which is considered a miracle of God. For example, Venerable Alexander of Svir reposed in the 16th century, but his relics have not decayed and are kept in the monastery that bears his name. This question is not essential, since the preservation of remains in itself does not speak of a person’s holiness, just like miracles in themselves, reports of which come from various religious communities, but whose nature and source may differ, up to simple deception and the action of fallen powers. Sometimes the reasons for the preservation of remains are quite natural, connected with the temperature and humidity at the burial place, or with a mysterious action of God’s Providence not connected with the holiness of the people. As a negative example one can cite <a href="https://azbyka.ru/otechnik/sekty/opyt-sistematicheskago-posobija-pri-polemike-s-staroobrjadtsami-s-kratkim-ocherkom-razvitija-drevnih-sekt-i-russkogo-raskolostaroobrjadchestva/7_6">a case from the 19th century</a> (in Russian), when Old Believers recognized as relics of saints the remains of three Muslim Circassians, well known in that area (and next to them lay similar remains of a hare and a dog), and then justified themselves against accusations of deceiving the faithful.</p></li></ol>
