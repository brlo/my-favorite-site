    body: |-
      <h2>Preface</h2><p>The righteous saints and the angels are venerated not as gods, but as friends of God. They are venerated not in and of themselves, but because of their participation in God, because of the grace of God dwelling in them (article: <a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">man is the temple of God</a>). According to Scripture, honor is to be given not only to God; people bow not only to God; God Himself called us to seek the glory that comes from God; God promised to glorify the righteous and did glorify them; and the Church, following God, glorifies the holy friends of God.</p><p>God sends His grace through the saints both during their lifetime and through their <strong>dead bodies</strong> (<a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21">2 Kin. 13:21</a>), <strong>personal belongings</strong> (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L12">Act. 19:12</a>) and <strong>images</strong> (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15-16">Act. 5:15-16</a>), and therefore all of these are also venerated. More in the corresponding articles:</p><ul><li><p><a href="https://bibleox.com/en/en/w/Rl6c_Veneration_of_the_Relics_of_Saints/">veneration of the relics of saints</a>;</p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%B1%D0%BE%D1%80%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE">veneration of the icons of saints</a>.</p></li></ul><h2>Honor May Be Given Not Only to God</h2><h3>Honor to God</h3><blockquote><p>“A son honors his father, and a servant his master. If then I am the Father, <strong><mark>where is My honor</mark></strong>? And if I am a Master, <strong>where is My reverence?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mal/1/#L6">Mal. 1:6</a>)</p></blockquote><h3>To the Priest</h3><blockquote><p>“Fear the Lord and <strong><mark>honor the priest</mark></strong>, and give him his portion, as you have been commanded” (<a href="https://bibleox.com/en/en-nrsv/prsir/7/#L31">Sir. 7:31</a>)</p></blockquote><h3>To Godly Christians</h3><blockquote><p>“I am glad about the coming of Stephanas, Fortunatus, and Achaicus, for what was lacking on your part they supplied. For they refreshed my spirit and yours. Therefore <strong><mark>acknowledge such men</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/16/#L17-18">1 Cor. 16:17-18</a>) <em>(Greek: ἐπιγινώσκετε — “recognize, give due regard”)</em></p></blockquote><h3>To Wives</h3><blockquote><p>“Husbands, likewise, dwell with them with understanding, <strong><mark>giving honor to the wife</mark></strong>, as to the weaker vessel, and as being heirs together of the grace of life, that your prayers may not be hindered” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L7">1 Pet. 3:7</a>)</p></blockquote><h3>To Father and Mother</h3><blockquote><p>“<strong><mark>Honor your father and your mother</mark></strong>, that your days may be long upon the land which the LORD your God is giving you” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L12">Ex. 20:12</a>)</p></blockquote><h3>To the Elderly</h3><blockquote><p>“You shall rise before the gray headed and <strong><mark>honor the presence of an old man</mark></strong>, and fear your God: I am the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L32">Lev. 19:32</a>)</p></blockquote><h3>To Widows</h3><blockquote><p>“<strong><mark>Honor widows</mark></strong> who are really widows” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L3">1 Tim. 5:3</a>)</p></blockquote><h3>To the State Authorities</h3><blockquote><p>“Fear God. <strong><mark>Honor the king</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L17">1 Pet. 2:17</a>)</p></blockquote><blockquote><p>“Let every soul be subject to <strong><mark>the governing authorities</mark></strong>. For there is no authority except from God, and the authorities that exist are appointed by God. &lt;...&gt; Render therefore to all their due: taxes to whom taxes are due, customs to whom customs, fear to whom fear, <strong><mark>honor to whom honor</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/13/#L1,7">Rom. 13:1,7</a>)</p></blockquote><h3>To All</h3><blockquote><p>“<strong><mark>Honor all people</mark></strong>. Love the brotherhood. Fear God. Honor the king” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L17">1 Pet. 2:17</a>)</p></blockquote><blockquote><p>“Be kindly affectionate to one another with brotherly love, <strong><mark>in honor</mark></strong> giving preference to one another” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L10">Rom. 12:10</a>)</p></blockquote><h2>Bowing to the Saints</h2><p>The second commandment of the Decalogue (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L4-5">Ex. 20:4-5</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L8-9">Deut. 5:8-9</a>) forbids the worship of false gods (idols). False gods are not really gods; their divinity is invented, it is fantasy, a lie.</p><p>The saints really exist; they are friends of God, and they are not worshiped as gods. Bowing to the saints is an expression of respect for them as friends of God, as servants of God (angels), as the Mother of God. Such bows to angels, people and objects are found in the Bible and are not idolatry, because idolatry is the worship of <u>false</u> <u>gods</u>, the worship of a lie. The righteous constantly bow to people as people, to angels as angels, to prophets as prophets, to objects as objects. In all these cases they bow to them not as to gods.</p><h3>Bowing to God in the Form of Angels</h3><p>God appeared, but the three angels are not God as He really is, not what He is even before the creation of the world. That is, this is an <strong>image</strong> (in Greek — εἰκόνα [icon]) of God, and Abraham bows before an icon of God:</p><blockquote><p><em>“Then </em><strong><em>the LORD appeared to him [IN THE FORM OF AN IMAGE]</em></strong><em> (Greek: θεὸς — God; Hebrew: יְהוָ֔ה — Yahweh) by the terebinth trees of Mamre, as he was sitting in the tent door in the heat of the day. So he lifted his eyes and looked, and behold, </em><strong><em>three men</em></strong><em> were standing by him; and when he saw them, he ran from the tent door to meet them, and </em><strong><em>bowed himself to the ground</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/18/#L1-2"><em>Gen. 18:1-2</em></a><em>)</em></p></blockquote><h3>Bowing to an Angel</h3><blockquote><p><em>“So He said, ‘No, but as Commander of the army of the LORD I have now come.’ And Joshua fell on his face to the earth and </em><strong><em>worshiped</em></strong><em>, and said to Him, ‘What does my Lord say to His servant?’” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/5/#L14"><em>Josh. 5:14</em></a><em>)</em></p></blockquote><h3>Bowing to a Prophet</h3><blockquote><p><em>“Now when the sons of the prophets who were from Jericho saw him, they said, ‘The spirit of Elijah rests on Elisha.’ And they came to meet him, and </em><strong><em>bowed to the ground before him</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/4ts/2/#L15"><em>2 Kin. 2:15</em></a><em>)</em></p></blockquote><h3>Bowing to the Temple</h3><blockquote><p><em>“But as for me, I will come into Your house in the multitude of Your mercy; in fear of You </em><strong><em>I will worship toward Your holy temple</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7"><em>Ps. 5:7</em></a><em>) (Greek: προσκυνήσω πρὸς ναὸν ἅγιόν σου — “I will bow down toward Your holy temple”)</em></p></blockquote><h3>Bowing to God’s Footstool (the Temple)</h3><blockquote><p><em>“Exalt the LORD our God, and </em><strong><em>worship at His footstool</em></strong><em> (pedestal, a stand for the feet — note) — </em><strong><em>He is holy</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5"><em>Ps. 99:5</em></a><em>) (Greek: προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ, ὅτι ἅγιός ἐστιν — “bow down to the footstool of His feet, for He is holy”)</em></p></blockquote><blockquote><p><em>“Let us go into </em><strong><em>His tabernacle; let us worship at His footstool</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/132/#L7"><em>Ps. 132:7</em></a><em>)</em></p></blockquote><h3>Bowing Before the Ark of the Covenant</h3><blockquote><p><em>“Then Joshua tore his clothes, and </em><strong><em>fell to the earth on his face before the ark of the LORD</em></strong><em> until evening, he and the elders of Israel; and they put dust on their heads” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6"><em>Josh. 7:6</em></a><em>)</em></p></blockquote><h3>Bowing to a Staff</h3><blockquote><p><em>To a staff: “Then he said, ‘Swear to me.’ And he swore to him. So </em><strong><em>Israel bowed himself on the head of the bed</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/47/#L31"><em>Gen. 47:31</em></a><em>). In the LXX translation — </em><strong><em>to the staff</em></strong><em> (Greek: προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ — “Israel bowed down upon the top of his staff”; also </em><a href="https://bibleox.com/en/eng-nkjv/evr/11/#L21"><em>Heb. 11:21</em></a><em>)</em></p></blockquote><p>More examples: <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D0%BA%D0%BB%D0%BE%D0%BD%D1%8B">https://bibleox.com/ru/ru/w/поклоны</a> (in Russian)</p><h3>Why in Revelation the Angel Commands to Worship Not Himself, but God</h3><p>In the vision of the Apostle John, God is visibly present nearby, so it would be strange in such a situation to show reverence to an angel, as if he were the most important one there. In this case the angel calls to worship God:</p><blockquote><p>“And I fell at his feet to worship him. But he said to me, <strong>‘See that you do not do that! I am your fellow servant</strong>, and of your brethren who have the testimony of Jesus. <strong><mark>Worship God!</mark></strong> For the testimony of Jesus is the spirit of prophecy’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/19/#L10">Rev. 19:10</a>)</p></blockquote><blockquote><p>“Then he said to me, <strong>‘See that you do not do that. For I am your fellow servant</strong>, and of your brethren the prophets, and of those who keep the words of this book. <strong><mark>Worship God</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L9">Rev. 22:9</a>)</p></blockquote><p>On another occasion, an angel accepts a bow from the prophet Joshua the son of Nun:</p><blockquote><p><em>“So He said, ‘No, but as Commander of the army of the LORD I have now come.’ And Joshua fell on his face to the earth and </em><strong><em>worshiped</em></strong><em>, and said to Him, ‘What does my Lord say to His servant?’” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/5/#L14"><em>Josh. 5:14</em></a><em>)</em></p></blockquote><h2>The Saints Will Be in Honor</h2><blockquote><p>“But in a great house there are not only <strong>vessels</strong> of gold and silver, but also of wood and clay, some <strong>for honor</strong> and some for dishonor. Therefore <strong><mark>if anyone cleanses himself</mark></strong> from the latter, <strong><mark>he will be a vessel for honor</mark></strong>, sanctified and useful for the Master, prepared for every good work” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L20-21">2 Tim. 2:20-21</a>)</p></blockquote><blockquote><p>“but <strong><mark>glory, honor</mark>, and peace to everyone <mark>who works what is good</mark></strong>, to the Jew first and also to the Greek” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L10">Rom. 2:10</a>)</p></blockquote><h2>The Lord Promised to Glorify the Righteous</h2><blockquote><p>“for <strong>those who honor Me <mark>I will honor</mark></strong>, and those who despise Me shall be lightly esteemed” (<a href="https://bibleox.com/en/eng-nkjv/1ts/2/#L30">1 Sam. 2:30</a>) <em>(Greek: τοὺς δοξάζοντάς με δοξάσω — “those who glorify Me I will glorify”)</em></p></blockquote><blockquote><p>“If anyone serves Me, let him follow Me; and where I am, there My servant will be also. <strong>If anyone serves Me, him <mark>My Father will honor</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/12/#L26">John. 12:26</a>)</p></blockquote><blockquote><p>“I do not pray for these alone, but also for those who will believe in Me through their word; &lt;...&gt; And <strong><mark>the glory</mark> which You gave Me <mark>I have given them</mark></strong>, that they may be one just as We are one” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20,22">John. 17:20,22</a>)</p></blockquote><blockquote><p>“For whom He foreknew, He also predestined to be conformed to the image of His Son &lt;…&gt; Moreover whom He predestined, these He also called; whom He called, these He also justified; and <strong>whom He justified, <mark>these He also glorified</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L29-30">Rom. 8:29-30</a>)</p></blockquote><p>Glorification takes place, among other things, through the fulfillment of prayers and through deeds:</p><blockquote><p>“And whatever you <strong>ask</strong> in My name, <strong><mark>that I will do</mark></strong>, <strong><mark>that the Father may be glorified</mark></strong> in the <strong>Son</strong>. If you ask anything in My name, <strong><mark>I will do it</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L13-14">John. 14:13-14</a>)</p></blockquote><p>And in the end it is still the Father who is glorified, though in the Son, that is, the Son is glorified too.</p><h2>Seeking Glory from God</h2><blockquote><p>“How can you believe, who receive honor from one another, and <strong>do not seek <mark>the honor</mark> that comes <mark>from the only God</mark></strong>?” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L44">John. 5:44</a>) <em>(Greek: δόξαν — “glory”)</em></p></blockquote><blockquote><p>“But in accordance with your hardness and your impenitent heart you are treasuring up for yourself wrath in the day of wrath and revelation of the righteous judgment <strong><mark>of God</mark></strong>, who <strong>‘will render to each one according to his deeds’</strong>: <strong>eternal life to those who <mark>by patient continuance in doing good seek for glory, honor</mark>, and immortality</strong>; but to those who are self-seeking and do not obey the truth, but obey unrighteousness — indignation and wrath” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L5-8">Rom. 2:5-8</a>)</p></blockquote><h2>The Glory of the Saints</h2><blockquote><p>“For it was fitting for Him, for whom are all things and by whom are all things, <strong><mark>in bringing</mark> many sons <mark>to glory</mark></strong>, to make the captain of their salvation perfect through sufferings” (<a href="https://bibleox.com/en/eng-nkjv/evr/2/#L10">Heb. 2:10</a>)</p></blockquote><blockquote><p>“But we all, with unveiled face, <strong>beholding as in a mirror the glory of the Lord</strong>, <strong><mark>are being transformed</mark></strong> into the same image <strong><mark>from glory to glory</mark></strong>, just as by the Spirit of the Lord” (<a href="https://bibleox.com/en/eng-nkjv/2kor/3/#L18">2 Cor. 3:18</a>)</p></blockquote><blockquote><p>“tribulation and anguish, on every soul of man who does evil, of the Jew first and also of the Greek; but <strong><mark>glory</mark>, honor, and peace to everyone <mark>who works what is good</mark></strong>, to the Jew first and also to the Greek” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L9-10">Rom. 2:9-10</a>)</p></blockquote><blockquote><p>“And He has exalted the horn of His people, <strong><mark>the praise</mark> of all His saints</strong> — of the children of Israel, a people near to Him. Praise the LORD!” (<a href="https://bibleox.com/en/eng-nkjv/ps/148/#L14">Ps. 148:14</a>)</p></blockquote><h2>The Church Will Glorify the Righteous</h2><blockquote><p>“<strong>Let us now sing the praises of famous men</strong>, our ancestors in their generations. <strong><mark>The Lord apportioned to them great glory</mark>, his majesty</strong> from the beginning” (<a href="https://bibleox.com/en/en-nrsv/prsir/44/#L1-2">Sir. 44:1-2</a>)</p></blockquote><blockquote><p>“But these also were godly men, whose righteous deeds have not been forgotten; their wealth will remain with their descendants, and their inheritance with their children’s children. Their descendants stand by the covenants; their children also, for their sake. Their offspring will continue forever, and <strong><mark>their glory will never be blotted out</mark></strong>. <strong>Their bodies are buried in peace, but their name lives on generation after generation</strong>. <strong>The assembly declares their wisdom</strong>, and <strong><mark>the congregation proclaims their praise</mark></strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/44/#L10-15">Sir. 44:10-15</a>) <em>(Greek: τὸν ἔπαινον ἐξαγγέλλει ἐκκλησία — “the church proclaims their praise”)</em></p></blockquote><h2>The Need Not to Forget the Deeds and Faith of Those Who Came Before Us, and to Imitate Them</h2><blockquote><p>“<strong><mark>Remember your leaders</mark></strong>, those who spoke the word of God to you; consider the outcome of their way of life, and <strong><mark>imitate their faith</mark></strong>” (<a href="https://bibleox.com/en/en-nrsv/evr/13/#L7">Heb. 13:7</a>)</p></blockquote><blockquote><p>“Therefore I urge you, <strong><mark>imitate</mark> me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L16">1 Cor. 4:16</a>)</p></blockquote><blockquote><p>“Brothers and sisters, <strong><mark>join in imitating me</mark>, and <mark>observe those who live according to the example you have in us</mark></strong>” (<a href="https://bibleox.com/en/en-nrsv/fil/3/#L17">Phil. 3:17</a>)</p></blockquote><h2>Longing for Life Among the Saints</h2><blockquote><p>“O my soul, you have said to the LORD, ‘You are my Lord, my goodness is nothing apart from You.’ <strong>As for the saints who are on the earth, ‘They are the excellent ones, in whom is all my delight’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/16/#L2-3">Ps. 16:2-3</a>)</p></blockquote><h2>The Apocalyptic Beast Will Blaspheme the Saints</h2><h3>The Beast Will Blaspheme Those Who Dwell in Heaven</h3><blockquote><p><em>“Then he opened his mouth in blasphemy against God, </em><strong><em><mark>to blaspheme</mark></em></strong><em> His name, His tabernacle, and </em><strong><em><mark>those who dwell in heaven</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/13/#L6"><em>Rev. 13:6</em></a><em>)</em></p></blockquote><h3>The Souls of the Righteous and the Angels Live in Heaven</h3><blockquote><p><em>“But </em><strong><em><mark>you have come</mark></em></strong><em> to Mount Zion and to the city of the living God, </em><strong><em><mark>the heavenly Jerusalem</mark>, to an innumerable company of <mark>angels</mark></em></strong><em>, to the general assembly and </em><strong><em>church of the firstborn who are registered in heaven</em></strong><em>, to God the Judge of all, </em><strong><em>to <mark>the spirits of just men</mark> made perfect</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-23"><em>Heb. 12:22-23</em></a><em>)</em></p></blockquote><h2>Criticism</h2><h3>How Does the Church Know Who Is a Saint? Do People Not Decide for God?</h3><p>See the answer in the section of “<a href="https://bibleox.com/en/en/w/Ps5r_Prayers_to_the_Saints/#HH-How-Does-the-Church-Know-Who-Is-a-Saint-Do-People-Not-Decide-for-God">Prayers to the Saints</a>”</p><h3>God Will Not Give His Glory to Anyone</h3><blockquote><p>“I am the LORD, that is My name; and <strong>My glory I will not give to another</strong>, nor My praise to <strong>carved images</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/42/#L8">Isa. 42:8</a>)</p></blockquote><p>This is about carved images, that is, about false gods. Many quotes showing that God Himself glorifies people are given above.</p><h2>Related Quotes</h2><ol><li><p><a href="https://bibleox.com/en/en/w/Rl6c_Veneration_of_the_Relics_of_Saints/">Veneration of the Relics of Saints</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%B1%D0%BE%D1%80%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE">https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ps5r_Prayers_to_the_Saints/">Prayers to the Saints</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">https://bibleox.com/ru/ru/w/человек-храм-Божий</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">https://bibleox.com/ru/ru/w/состав-человека</a></p></li></ol>

