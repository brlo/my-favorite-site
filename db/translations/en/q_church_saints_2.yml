      <h2>The Understanding of the Orthodox Church</h2><p>The Orthodox Church teaches that the Lord Jesus Christ is the only Mediator, but what kind? The One who gave Himself as a <u>ransom</u> for all (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L5-6">1 Tim. 2:5-6</a>). None of the other holy people and angels are redeemers. But many are co-intercessors in prayer:</p><blockquote><p>“who delivered us from so great a death, and does deliver us; in whom we trust that <strong>He will still deliver us, you also helping together in prayer for us, that thanks may be given by many persons on our behalf for the gift granted to us through many</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/1/#L10-11">2 Cor. 1:10-11</a>)</p></blockquote><p>Such too are the holy, righteous friends of God: the Mother of God, the angels, the prophets, the apostles, the martyrs and the other saints. Just as the apostle was asked for prayers here, so he is asked for prayers there. The idea that everyone must pray to God only for himself is foreign to Holy Scripture. On the contrary, in Scripture the whole Church is repeatedly called to mutual prayer for one another (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L16">James. 5:16</a>)[1]. Everyone, even the great righteous ones and the chosen of God, while not ceasing their prayers to God, asked the faithful to pray for them, themselves prayed unceasingly for the faithful, and commanded that this order be kept in the future. This is otherwise called intercession for one another.</p><p>We know from the Church and confirm from Scripture that the righteous, upon separation from the body, pass to life with God and continue to offer Him their prayers. Therefore, just as people asked the prayers of these righteous ones during their life in the body on earth, in exactly the same way we ask their prayers after their separation from their bodies and their passing to the manifest life in heaven with Christ (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-23">Heb. 12:22-23</a>), for they have passed not to a worse, but to a better state (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L23">Phil. 1:23</a>). We believe that love never fails (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>), and therefore the whole Church — militant on earth and triumphant in heaven — is one Church, whole, communicating, praying together for one another, and moved by love to show care for all its members. We believe and know from the Church, and show from Scripture, that our guardian angels have communion with God (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L10">Matt. 18:10</a>) and are sent to minister to those who will inherit salvation (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L14">Heb. 1:14</a>), and the holy righteous ones, abiding in the divine light, also know about what is happening on earth and offer their prayers to God for the Church (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>), and eternal love moves everyone to communion and care for one another in the one body of Christ: in heaven and on earth.</p><h2>The Prayer of Angels</h2><h3>People Have Guardian Angels</h3><blockquote><p>“Take heed that you do not despise one of these little ones, for I say to you that in heaven <strong>their angels</strong> always see the face of My Father who is in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L10">Matt. 18:10</a>)</p></blockquote><h3>Angels Are Sent to Care for Those Being Saved</h3><blockquote><p>“Are they [the angels] not all ministering spirits <strong>sent forth to minister for those who will inherit salvation</strong>?” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13-14">Heb. 1:13-14</a>)</p></blockquote><h3>The Angels in Heaven Rejoice over a Person’s Repentance</h3><blockquote><p>“I say to you that likewise <strong>there will be more joy in heaven over one sinner who repents</strong> than over ninety-nine just persons who need no repentance. &lt;...&gt; Likewise, I say to you, <strong>there is joy in the presence of the angels of God over one sinner who repents</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/15/#L7,10">Luke. 15:7,10</a>)</p></blockquote><h3>An Angel Intercedes Before God for People</h3><p>An angel asks for mercy for the inhabitants of the cities of Judah:</p><blockquote><p>“Then the Angel of the LORD answered and said, <strong>‘O LORD of hosts, how long will You not have mercy on Jerusalem and on the cities of Judah</strong>, against which You were angry these seventy years?’ And the LORD answered the angel who talked to me, with good and comforting words” (<a href="https://bibleox.com/en/eng-nkjv/zah/1/#L12-13">Zech. 1:12-13</a>)</p></blockquote><h3>Communion with Angels</h3><blockquote><p>“When the morning dawned, <strong>the angels urged Lot to hurry, saying</strong>, ‘Arise, take your wife and your two daughters who are here, lest you be consumed in the punishment of the city’” (<a href="https://bibleox.com/en/eng-nkjv/gen/19/#L15">Gen. 19:15</a>)</p></blockquote><blockquote><p>“Now the Angel of the LORD came and sat under the terebinth tree which was in Ophrah, which belonged to Joash the Abiezrite, while his son Gideon threshed wheat in the winepress, in order to hide it from the Midianites. And <strong>the Angel of the LORD appeared to him, and said to him</strong>, ‘The LORD is with you, you mighty man of valor!’ <strong>Gideon said to Him</strong>, ‘O my lord, if the LORD is with us, why then has all this happened to us? And where are all His miracles which our fathers told us about, saying, “Did not the LORD bring us up from Egypt?” But now the LORD has forsaken us and delivered us into the hands of the Midianites’” (<a href="https://bibleox.com/en/eng-nkjv/sud/6/#L11-13">Judg. 6:11-13</a>)</p></blockquote><blockquote><p>“Now there was a certain man from Zorah, of the family of the Danites, whose name was Manoah; and his wife was barren and had no children. And <strong>the Angel of the LORD appeared to the woman and said to her</strong>, ‘Indeed now, you are barren and have borne no children, but you shall conceive and bear a son’” (<a href="https://bibleox.com/en/eng-nkjv/sud/13/#L2-3">Judg. 13:2-3</a>)</p></blockquote><blockquote><p>“Then <strong>an angel appeared to Him [Christ] from heaven, strengthening Him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L43">Luke. 22:43</a>)</p></blockquote><blockquote><p>“There was in the days of Herod, the king of Judea, a certain priest named Zacharias &lt;...&gt; Then <strong>an angel of the Lord appeared to him</strong>, standing on the right side of the altar of incense. &lt;...&gt; But <strong>the angel said to him</strong>, ‘Do not be afraid, Zacharias, for your prayer is heard; and your wife Elizabeth will bear you a son, and you shall call his name John.’ &lt;...&gt; And <strong>Zacharias said to the angel</strong>, ‘How shall I know this? For I am an old man, and my wife is well advanced in years.’ And <strong>the angel answered and said to him</strong>, ‘I am Gabriel, who stands in the presence of God, and was sent to speak to you and bring you these glad tidings’” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L5,11,13,18-19">Luke. 1:5,11,13,18-19</a>)</p></blockquote><blockquote><p>“Now in the sixth month <strong>the angel Gabriel was sent</strong> by God to a city of Galilee named Nazareth, <strong>to a virgin</strong> betrothed to a man whose name was Joseph, of the house of David. The virgin’s name was Mary. And <strong>having come in, the angel said to her</strong>, ‘Rejoice, highly favored one, the Lord is with you; blessed are you among women!’ &lt;...&gt; Then <strong>the angel said to her</strong>, ‘Do not be afraid, Mary, for you have found favor with God. And behold, you will conceive in your womb and bring forth a Son, and shall call His name JESUS.’ &lt;...&gt; Then <strong>Mary said to the angel</strong>, ‘How can this be, since I do not know a man?’ And <strong>the angel answered and said to her</strong>, ‘The Holy Spirit will come upon you, and the power of the Highest will overshadow you; therefore, also, that Holy One who is to be born will be called the Son of God’” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L26-28,30-31,34-35">Luke. 1:26-28,30-31,34-35</a>)</p></blockquote><blockquote><p>“And a vision appeared to Paul in the night. A man of Macedonia stood and pleaded with him, <strong>saying</strong>, ‘Come over to Macedonia and help us’” (<a href="https://bibleox.com/en/eng-nkjv/act/16/#L9">Act. 16:9</a>)</p></blockquote><blockquote><p>“Now behold, <strong>an angel of the Lord stood by him</strong>, and a light shone in the prison; and <strong>he struck Peter on the side and raised him up, saying</strong>, ‘Arise quickly!’ And his chains fell off his hands. Then <strong>the angel said to him</strong>, ‘Gird yourself and tie on your sandals’; and so he did. And he said to him, ‘Put on your garment and follow me’” (<a href="https://bibleox.com/en/eng-nkjv/act/12/#L7-8">Act. 12:7-8</a>)</p></blockquote><blockquote><p>“The Revelation of Jesus Christ, which God gave Him to show His servants — things which must shortly take place. And <strong>He sent and signified it by His angel to His servant John</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L1">Rev. 1:1</a>)</p></blockquote><h2>The Prayer of the Departed</h2><p>The prophet Baruch asks God to hear the prayers of the reposed righteous:</p><blockquote><p>“O Lord Almighty, God of Israel, the soul in anguish and the wearied spirit cry out to you. Hear, O Lord, and have mercy, for <strong>we have sinned</strong> before you. For you are enthroned forever, and we are perishing forever. O Lord Almighty, <strong>God of Israel, hear now the prayer of the people of Israel</strong> <em>(Greek: τῶν τεθνηκότων Ισραηλ — “of the dead of Israel”)</em><strong>, the children of those who sinned before you</strong>, who did not heed the voice of the Lord their God, so that calamities have clung to us” (<a href="https://bibleox.com/en/en-nrsv/var/3/#L1-4">Bar. 3:1-4</a>)</p></blockquote><p>The reposed Rachel, wife of the patriarch Jacob, grieves over the deaths and sufferings of her sons in the Babylonian captivity. And the Lord answers her, comforts her and promises to set them free, which was done:</p><blockquote><p>“Thus says the LORD: ‘A voice was heard in Ramah, lamentation and bitter weeping, <strong>Rachel weeping for her children, refusing to be comforted for her children, because they are no more</strong>.’ <strong>Thus says the LORD: ‘Refrain your voice from weeping, and your eyes from tears; for your work shall be rewarded, says the LORD</strong>, and they shall come back from the land of the enemy. There is hope in your future, says the LORD, that your children shall come back to their own border’” (<a href="https://bibleox.com/en/eng-nkjv/ier/31/#L15-17">Jer. 31:15-17</a>)</p></blockquote><p>This quote can be understood allegorically, or it can be understood literally.</p><h2>The Prayer of the Righteous</h2><h3>The Prayer of a Righteous Person Is More Pleasing to God</h3><blockquote><p>“The sacrifice of the wicked is an abomination to the LORD, but <strong>the prayer of the upright is His delight</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/15/#L8">Prov. 15:8</a>)</p></blockquote><blockquote><p>“The LORD is far from the wicked, but <strong>He hears the prayer of the righteous</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/15/#L29">Prov. 15:29</a>)</p></blockquote><blockquote><p>“Confess your trespasses to one another, and pray for one another, that you may be healed. <strong>The effective, fervent prayer of a righteous man avails much</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L16">James. 5:16</a>)</p></blockquote><h3>God Requires That a Righteous Person Pray for the Forgiveness of Sin</h3><h4>Job</h4><blockquote><p>“Now therefore, take for yourselves seven bulls and seven rams, go to My servant Job, and offer up for yourselves a burnt offering; and <strong>My servant Job shall pray for you. For I will accept him</strong>, lest I deal with you according to your folly; because you have not spoken of Me what is right, as My servant Job has” (<a href="https://bibleox.com/en/eng-nkjv/iov/42/#L8">Job. 42:8</a>)</p></blockquote><blockquote><p>“And God said to him in a dream, ‘Yes, I know that you did this in the integrity of your heart. For I also withheld you from sinning against Me; therefore I did not let you touch her. Now therefore, restore the man’s wife; for <strong>he is a prophet, and he will pray for you and you shall live. But if you do not restore her, know that you shall surely die, you and all who are yours</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/20/#L6-7">Gen. 20:6-7</a>)</p></blockquote><h4>The Prophet Moses</h4><p>The prophet Moses was a mediator between God and a whole people:</p><blockquote><p>“Listen now to my voice; I will give you counsel, and God will be with you: <strong>Stand before God for the people</strong>, so that you may bring the difficulties to God” (<a href="https://bibleox.com/en/eng-nkjv/ish/18/#L19">Ex. 18:19</a>)</p></blockquote><p>Thanks to the request of Moses, God forgave the sins of the people:</p><blockquote><p>“Pardon the iniquity of this people, I pray, according to the greatness of Your mercy, just as You have forgiven this people, from Egypt even until now.” Then the LORD said: <strong>‘I have pardoned, according to your word’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/14/#L19-20">Num. 14:19-20</a>)</p></blockquote><p>On another occasion, however, God indicates that He would not forgive even at the word of Moses:</p><blockquote><p>“Then the LORD said to me, <strong>‘Even if Moses and Samuel stood before Me, My mind would not be favorable toward this people</strong>. Cast them out of My sight, and let them go forth’” (<a href="https://bibleox.com/en/eng-nkjv/ier/15/#L1">Jer. 15:1</a>)</p></blockquote><p>He entreated God to change His decision:</p><blockquote><p>“Now therefore, let Me alone, <strong>that My wrath may burn hot against them and I may consume them</strong>. And I will make of you a great nation.” Then <strong>Moses pleaded with the LORD his God</strong>, and said: “LORD, why does Your wrath burn hot against Your people whom You have brought out of the land of Egypt with great power and with a mighty hand? Why should the Egyptians speak, and say, ‘He brought them out to harm them, to kill them in the mountains, and to consume them from the face of the earth’? Turn from Your fierce wrath, and <strong>relent from this harm to Your people</strong>. Remember Abraham, Isaac, and Israel, Your servants, to whom You swore by Your own self, and said to them, ‘I will multiply your descendants as the stars of heaven; and all this land that I have spoken of I give to your descendants, and they shall inherit it forever.’” <strong>So the LORD relented from the harm</strong> which He said He would do to His people” (<a href="https://bibleox.com/en/eng-nkjv/ish/32/#L10-14">Ex. 32:10-14</a>)</p></blockquote><p>Then he again went to intercede for the people:</p><blockquote><p>“Now it came to pass on the next day that Moses said to the people, <strong>‘You have committed a great sin. So now I will go up to the LORD; perhaps I can make atonement for your sin’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/32/#L30">Ex. 32:30</a>)</p></blockquote><p>And again he changed God’s decision:</p><blockquote><p>“So the LORD spoke to Moses face to face, as a man speaks to his friend. And he would return to the camp, but his servant Joshua the son of Nun, a young man, did not depart from the tabernacle. Then Moses said to the LORD, ‘See, You say to me, “Bring up this people.” But You have not let me know whom You will send with me. Yet You have said, “I know you by name, and you have also found grace in My sight.”’ &lt;...&gt; <strong>Then he said to Him, ‘If Your Presence does not go with us, do not bring us up from here.’</strong> &lt;...&gt; So the LORD said to Moses, <strong>‘I will also do this thing that you have spoken; for you have found grace in My sight</strong>, and I know you by name’” (<a href="https://bibleox.com/en/eng-nkjv/ish/33/#L11-12,15,17">Ex. 33:11-12,15,17</a>)</p></blockquote><h4>The Man of God</h4><blockquote><p>“Then the king answered and said to the man of God, ‘Please entreat the favor of the LORD your God, and <strong>pray for me</strong>, that my hand may be restored to me.’ <strong>So the man of God entreated the LORD</strong>, and the king’s hand was restored to him, and became as before” (<a href="https://bibleox.com/en/eng-nkjv/3ts/13/#L6">1 Kin. 13:6</a>)</p></blockquote><h2>The Prayer of the Priesthood for Other People</h2><p>Through the prayers of priests for another person (here we have mediation), sins may be forgiven:</p><blockquote><p>“<strong>Is anyone among you sick? Let him call for the elders of the church</strong>, and let them <strong>pray over him</strong>, anointing him with oil in the name of the Lord. And the prayer of faith will save the sick, and the Lord will raise him up. And <strong>if he has committed sins, he will be forgiven</strong>. Confess your trespasses to one another, and pray for one another, that you may be healed. The effective, fervent prayer of a righteous man avails much” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-16">James. 5:14-16</a>)</p></blockquote><h2>The Prayer of the Members of the Church for One Another</h2><p>Is personal prayer to God enough?</p><h3>The Apostles Need Prayers for Them</h3><blockquote><p>“<strong>praying also for us</strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L3">Col. 4:3</a>)</p></blockquote><blockquote><p>“Brethren, <strong>pray for us</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L25">1 Thess. 5:25</a>)</p></blockquote><blockquote><p>“Finally, brethren, <strong>pray for us</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L1">2 Thess. 3:1</a>)</p></blockquote><blockquote><p>“<strong>Pray for us</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L18">Heb. 13:18</a>)</p></blockquote><blockquote><p>“Now I beg you, brethren &lt;...&gt; that you strive together with me <strong>in prayers to God for me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/15/#L30">Rom. 15:30</a>)</p></blockquote><blockquote><p>“He will still deliver us, <strong>you also helping together in prayer for us</strong>, that thanks may be given by many persons on our behalf for the gift granted to us <strong>through many</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/1/#L10-11">2 Cor. 1:10-11</a>)</p></blockquote><blockquote><p>“For I know that this will turn out <strong>for my deliverance through your prayer</strong>” (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L19">Phil. 1:19</a>)</p></blockquote><blockquote><p>“for I trust that <strong>through your prayers</strong> I shall be granted to you” (<a href="https://bibleox.com/en/eng-nkjv/fm/1/#L22">Philem. 1:22</a>)</p></blockquote><h3>The Apostles Constantly Pray for Christians</h3><blockquote><p>“do not cease to give thanks for you, <strong>making mention of you in my prayers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L16">Eph. 1:16</a>)</p></blockquote><blockquote><p>“always in every prayer of mine <strong>making request for you all</strong> with joy” (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L4">Phil. 1:4</a>)</p></blockquote><blockquote><p>“We give thanks to God always for you all, <strong>making mention of you in our prayers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/1/#L2">1 Thess. 1:2</a>)</p></blockquote><blockquote><p>“Epaphras &lt;...&gt; always <strong>laboring fervently for you in prayers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L12">Col. 4:12</a>)</p></blockquote><blockquote><p>“<strong>without ceasing I remember you in my prayers</strong> night and day” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L3">2 Tim. 1:3</a>)</p></blockquote><blockquote><p>“<strong>making mention of you always in my prayers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/fm/1/#L4">Philem. 1:4</a>)</p></blockquote><h3>The Apostles Called Christians to Pray for One Another</h3><blockquote><p>“<strong>pray for one another</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L16">James. 5:16</a>)</p></blockquote><blockquote><p>“praying always with all prayer and supplication in the Spirit, being watchful to this end with all perseverance and <strong>supplication for all the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L18">Eph. 6:18</a>)</p></blockquote><blockquote><p>“Therefore I exhort first of all that supplications, <strong>prayers</strong>, intercessions, and giving of thanks <strong>be made for all men</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L1">1 Tim. 2:1</a>)</p></blockquote><h2>The Whole Church Is the One and Single Body of Christ, Communicating and Caring</h2><h3>The Church Is the Body of Christ</h3><blockquote><p><em>“Now </em><strong><em>you are the body of Christ</em></strong><em>, and members individually” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L27"><em>1 Cor. 12:27</em></a><em>)</em></p></blockquote><blockquote><p><em>“Do you not know that </em><strong><em>your bodies are members of Christ</em></strong><em>?” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L15"><em>1 Cor. 6:15</em></a><em>)</em></p></blockquote><h3>The Members of the Church Become Partakers of God</h3><blockquote><p>“as His divine power has given to us all things that pertain to life and godliness, through the knowledge of Him who called us by glory and virtue, by which have been given to us exceedingly great and precious promises, <strong>that through these you may be partakers of the divine nature</strong>, having escaped the corruption that is in the world through lust” (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L3-4">2 Pet. 1:3-4</a>)</p></blockquote><h3>All the Members of the Body Care for One Another</h3><blockquote><p>“And <strong>if one member suffers, all the members suffer</strong> with it; or <strong>if one member is honored, all the members rejoice</strong> with it” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L25-26">1 Cor. 12:25-26</a>)</p></blockquote><h3>The Apostles Always Pray for the Church</h3><blockquote><p>“we… <strong><u>do not cease</u> to pray for you, and to ask</strong> that you may be filled with the knowledge of His will in all wisdom and spiritual understanding” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L9">Col. 1:9</a>)</p></blockquote><h2>The Unity of the Earthly and Heavenly Church</h2><h3>We Have Already Come to the Heavenly Church</h3><p>Already now, and not in the future, after the resurrection:</p><blockquote><p>“But <strong>you have come(!)</strong> to Mount Zion and to the city of the living God, the heavenly Jerusalem, to an innumerable company of angels, to the general assembly and church of the firstborn who are registered in heaven, to God the Judge of all, <strong>to the spirits of just men made perfect</strong>, to Jesus the Mediator of the new covenant, and to the blood of sprinkling that speaks better things than that of Abel” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-24">Heb. 12:22-24</a>)</p></blockquote><h3>There Is No Division; All Care for One Another and Share in One Another’s Feelings</h3><blockquote><p>“But now indeed there are many members, yet one body. &lt;...&gt; But God composed the body, having given greater honor to that part which lacks it, <strong>that there should be no schism in the body, but that the members should have the same care for one another</strong>. And if one member suffers, <strong>all the members</strong> suffer with it; or if one member is honored, <strong>all the members</strong> rejoice with it” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L20,24-26">1 Cor. 12:20,24-26</a>)</p></blockquote><blockquote><p>“I say to you that likewise <strong>there will be more joy in heaven over one sinner who repents</strong> than over ninety-nine just persons who need no repentance. &lt;...&gt; Likewise, I say to you, <strong>there is joy in the presence of the angels of God over one sinner who repents</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/15/#L7,10">Luke. 15:7,10</a>)</p></blockquote><h3>What Is in Heaven and on Earth Is United in Christ</h3><blockquote><p><em>“Blessed be the God and Father of our Lord Jesus Christ, who has blessed us with every spiritual blessing in the heavenly places in Christ, &lt;...&gt; having made known to us the mystery of His will, according to His good pleasure which He purposed in Himself, that </em><strong><em>in the dispensation of the fullness of the times</em></strong><em> </em><strong><em>He might gather together in one all things in Christ, both which are <u>in heaven and which are on earth</u></em></strong><em> — in Him” (</em><a href="https://bibleox.com/en/eng-nkjv/ef/1/#L3,9-10"><em>Eph. 1:3,9-10</em></a><em>)</em></p></blockquote><blockquote><p><em>“For this reason I bow my knees to the Father of our Lord Jesus Christ, from whom the whole </em><strong><em>family in heaven and earth</em></strong><em> is named” (</em><a href="https://bibleox.com/en/eng-nkjv/ef/3/#L14-15"><em>Eph. 3:14-15</em></a><em>)</em></p></blockquote><blockquote><p><em>“And He is the head of the body, the church, who is the beginning, the firstborn from the dead, that in all things He may have the preeminence. For it pleased the Father that </em><strong><em>in Him all the fullness should dwell, and by Him to reconcile all things to Himself</em></strong><em>, by Him, whether </em><strong><em>things on earth or things in heaven</em></strong><em>, having made peace through the blood of His cross” (</em><a href="https://bibleox.com/en/eng-nkjv/kol/1/#L18-20"><em>Col. 1:18-20</em></a><em>)</em></p></blockquote><blockquote><p><em>“For to this end </em><strong><em>Christ</em></strong><em> died and rose and lived again, that </em><strong><em>He might be Lord of both the dead and the living</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/14/#L9"><em>Rom. 14:9</em></a><em>)</em></p></blockquote><p>See also: <a href="https://bibleox.com/en/en/w/Cw7a_The_Church/#HH-The-Unity-of-the-Earthly-and-Heavenly-Church-the-One-Body-of-Christ">The Church: the unity of the earthly and heavenly Church, the one Body of Christ</a></p><h2>The Saints Pray to God in Heaven</h2><h3>The Prayers of the Saints Are Pleasing to God</h3><blockquote><p>“Now when He had taken the scroll, the four living creatures and the twenty-four elders fell down before the Lamb, each having a harp, and <strong>golden bowls full of incense, which are the prayers of the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/5/#L8">Rev. 5:8</a>)</p></blockquote><blockquote><p>“Then another angel, having a golden censer, came and stood at the altar. He was given much incense, that he should offer it <strong>with the prayers of all the saints</strong> upon the golden altar which was before the throne” (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3">Rev. 8:3</a>)</p></blockquote><blockquote><p>“After these things I heard <strong>a loud voice of a great multitude in heaven, saying, ‘Alleluia! Salvation and glory and honor and power belong to the Lord our God!’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/19/#L1">Rev. 19:1</a>)</p></blockquote><p>They know about what is happening on earth:</p><blockquote><p>“When He opened the fifth seal, I saw under the altar <strong>the souls of those who had been slain for the word of God and for the testimony</strong> which they held. And they cried with a loud voice, saying, <strong>‘How long, O Lord, holy and true, until You judge and avenge our blood on those who dwell on the earth?’</strong> Then a white robe was given to each of them; and it was said to them that they should rest a little while longer, until both the number of their fellow servants and their brethren, who would be killed as they were, was completed” (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>)</p></blockquote><h3>The Saints Pass to a Better State, Not a Worse One</h3><blockquote><p>“For I am hard-pressed between the two, <strong>having a desire to depart and be with Christ, <mark>which is far better</mark></strong>. Nevertheless to remain in the flesh is more needful for you” (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L23-24">Phil. 1:23-24</a>)</p></blockquote><h3>After Separation from the Body, the Saints Do Not Lose the Ability to Communicate</h3><p>At the moment of the Savior’s Transfiguration on Mount Tabor, the apostles see the appearance of the prophet Moses, who had already died, conversing with Christ about the sufferings on the Cross that lie ahead of Him. That is, although the prophet died (<a href="https://bibleox.com/en/eng-nkjv/vtor/34/#L7">Deut. 34:7</a>; <a href="https://bibleox.com/en/eng-nkjv/nav/1/#L2">Josh. 1:2</a>), he did not vanish and did not lose consciousness: he <strong>communicates</strong> with Christ:</p><blockquote><p><em>“And behold, </em><strong><em>Moses and Elijah appeared to them, talking with Him</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/17/#L3"><em>Matt. 17:3</em></a><em>)</em></p></blockquote><blockquote><p><em>“As He prayed, the appearance of His face was altered, and His robe became white and glistening. And behold, </em><strong><em>two men talked with Him, who were Moses and Elijah</em></strong><em>, who appeared in glory and </em><strong><em>spoke</em></strong><em> of His decease which He was about to accomplish at Jerusalem” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/9/#L29-31"><em>Luke. 9:29-31</em></a><em>)</em></p></blockquote><h3>Love Always Moves One to Care for Others</h3><blockquote><p>“<strong><mark>Love never fails</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>)</p></blockquote><h2>Criticism</h2><h3>One Mediator</h3><h4>Short Answer</h4><p>The Orthodox are accused because of prayers to the saints, with the claim that only Christ is the one Mediator. The answer is that Christ is the one Mediator who redeemed people, as is said further on in the verse:</p><blockquote><p>“For there is one God and <strong><mark>one Mediator</mark> between God and men, the Man Christ Jesus</strong>, <strong><mark>who gave Himself a ransom for all</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L5-6">1 Tim. 2:5-6</a>)</p></blockquote><p>The saints are not redeemers, but co-intercessors in prayer (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L16">James. 5:16</a>). It is all a matter of meaning. Our opponents (as a rule, Protestants) pray for one another’s needs. If they are mediators for one another, then the saints too are our mediators. If they are co-intercessors for one another, then the saints too are our co-intercessors, for we simply ask them to pray for us, to join in our prayer to God. We do not consider them gods and do not pray to them as to gods. In exactly the same way, when Protestants ask others to pray for them, they do not consider their companions to be gods.</p><p>Can there be mediators in prayer? It is evident from Scripture that there can. For example, through the prayer of the elders of the Church, another person’s sins may be forgiven.</p><blockquote><p><em>“Is anyone among you sick? </em><strong><em>Let him <mark>call for the elders of the church</mark></em></strong><em>, and </em><strong><em>let them <mark>pray over him</mark></em></strong><em>, anointing him with oil in the name of the Lord. And the prayer of faith will save the sick, and </em><strong><em>the Lord will raise him up. And</em></strong><em> </em><strong><em><mark>if he has committed sins, he will be forgiven</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15"><em>James. 5:14-15</em></a><em>)</em></p></blockquote><p>An undeniable intercession. Thus the understanding of the words about Christ as the one Mediator (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L5-6">1 Tim. 2:5-6</a>) proposed by opponents of prayers to the saints is incorrect. The verse cited does not speak against mediators in prayer.</p><h4>More on the Word “Mediator”</h4><p>There are also particulars of translation. The word “mediator” is a translation of the Greek word “μεσίτης”. It can be translated as “peacemaker”, a person who helps bring about the reconciliation of parties. That is, in other words, Christ is the only <strong>reconciler</strong> (peacemaker) between God and people. This is said more explicitly in other places by the apostles:</p><blockquote><p>“Now all things are <strong>of God, who has <mark>reconciled</mark> us to Himself through Jesus Christ</strong>, and has given us <strong>the ministry of reconciliation</strong>, that is, that <strong><mark>God was in Christ reconciling the world to Himself</mark></strong>, not imputing their trespasses to them, and <strong>has committed to us the word of reconciliation</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L18-19">2 Cor. 5:18-19</a>)</p></blockquote><blockquote><p>“My little children, these things I write to you, so that you may not sin. And <strong><mark>if anyone sins</mark>, we <mark>have an Advocate</mark> with the Father, Jesus Christ</strong> the righteous. And <strong><mark>He Himself is the propitiation for our sins</mark></strong>, and not for ours only but also for the whole world. &lt;...&gt; I write to you, little children, because <strong><mark>your sins are forgiven you for His name’s sake</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L1-2,12">1 John. 2:1-2,12</a>)</p></blockquote><p>Translating the word “mediator” as <strong>reconciler</strong> or peacemaker also agrees with the end of the sentence, as already indicated earlier: “<em>who gave Himself a ransom for all</em>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L5-6">1 Tim. 2:5-6</a>). Such a peacemaker who, by offering Himself in sacrifice, redeemed the sin of mankind before God. Thus this verse does not speak against prayers to the saints, but speaks of Christ as the <strong>reconciler</strong> of mankind with God. Christ is also the <strong>reconciler</strong> of people with one another (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L14">Eph. 2:14</a>).</p><h3>On the Expressions “Save Us”</h3><p>The Orthodox are accused of allowing the expression “save us” in prayers to the saints. Here again it is a matter of meaning. Salvation was accomplished once by Christ. There is no other savior in this sense. But many can contribute to the personal salvation of a particular person. And such expressions are often allowed in Scripture:</p><h4>An Apostle Saves</h4><blockquote><p><em>“if by any means I may provoke to jealousy those who are my flesh and </em><strong><em><mark>save</mark> some of them</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/11/#L14"><em>Rom. 11:14</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>I have become all things to all men, that I might by all means <mark>save</mark></em></strong><em> some” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/9/#L22"><em>1 Cor. 9:22</em></a><em>)</em></p></blockquote><h4>A Wife Saves</h4><blockquote><p><em>“For how do you know, </em><strong><em>O wife, whether you will <mark>save</mark> your husband?</em></strong><em> Or how do you know, </em><strong><em>O husband, whether you will <mark>save</mark> your wife?</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L16"><em>1 Cor. 7:16</em></a><em>)</em></p></blockquote><h4>The Apostolic Call to Save Other People</h4><blockquote><p><em>“And on some have compassion, making a distinction; but others </em><strong><em><mark>save</mark></em></strong><em> with fear, pulling them out of the fire, hating even the garment defiled by the flesh” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L22-23"><em>Jude. 1:22-23</em></a><em>)</em></p></blockquote><blockquote><p>“Take heed to yourself and to the doctrine. Continue in them, for in doing this you will <strong><mark>save</mark></strong> both yourself and <strong>those who hear you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L16">1 Tim. 4:16</a>)</p></blockquote><h4>Can Anyone Besides Christ Really Save?</h4><p>Neither the apostle, nor wives and husbands, are saviors in the sense in which the Lord Jesus Christ is the Savior — the only Redeemer and Deliverer of mankind from death and hell, who grants resurrection and eternal life with God. However, the expressions “I will save”, as one can see, are allowed by the apostles. We understand the meaning of such expressions correctly — people can contribute to salvation:</p><blockquote><p>“<em>For we are God’s </em><strong><em>fellow workers</em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L9">1 Cor. 3:9</a>)</p></blockquote><h3>On the Expressions “Have Mercy”</h3><p>Here the situation is the same as with the word “save” (see above). Such words are addressed not only to the saints, but also to ordinary people. To have mercy means to show mercy. For example, the righteous Job says to his friends:</p><blockquote><p>“<strong>Have pity on me, have pity on me, O you my friends</strong>, for the hand of God has struck me!” (<a href="https://bibleox.com/en/eng-nkjv/iov/19/#L21">Job. 19:21</a>) <em>(Greek: ἐλεήσατέ με, ἐλεήσατέ με, ὦ φίλοι — “have mercy on me, have mercy on me, O friends”)</em></p></blockquote><h3>How Can the Saints Hear Prayers from All over the World?</h3><p>Opponents of prayers to the saints say: “<em>God is omnipresent and almighty, but if the saints do not possess such properties, then how can they hear the prayers of a great number of people in different places on the planet?</em>”.</p><h4>The Saints Prophesied and Worked Miracles Not by Their Own Power, but by Divine Power</h4><p>The saints are not considered separately, apart from God. Divine power dwelt in them even during their life in the body on earth, and all the more they are not deprived of it after their passing to heaven, to life with Christ. Thus the prophet Agabus, although he was not all-knowing, announced the coming famine throughout the world (<a href="https://bibleox.com/en/eng-nkjv/act/11/#L28">Act. 11:28</a>). The Apostle Peter was not almighty, but he raised Tabitha (<a href="https://bibleox.com/en/eng-nkjv/act/9/#L40">Act. 9:40</a>). Not by their own power did they do this, but by divine power.</p><p>The saints, according to the word of the apostle, pass not to a worse, but to an incomparably better state (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L23-24">Phil. 1:23-24</a>): they do not lose, but gain (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L21">Phil. 1:21</a>). They are united with God, they are in His light and grace. One cannot compare their existence with ours. They know about what is happening on earth (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L10">Rev. 6:10</a>). Even here in the body the apostles write that they are spiritually present with Christians:</p><h4>The Apostle Knows the State of the Christian Communities Not by the Body, but by the Spirit</h4><blockquote><p>“For though I am <strong>absent in the flesh, yet I am with you in spirit, rejoicing to see</strong> your good order and the steadfastness of your faith in Christ” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L5">Col. 2:5</a>)</p></blockquote><blockquote><p>“For I indeed, <strong>as absent in body but present in spirit, have already judged (as though I were present)</strong> him who has so done this deed. In the name of our Lord Jesus Christ, when you are gathered together, along with my spirit, with the power of our Lord Jesus Christ, deliver such a one to Satan for the destruction of the flesh, that his spirit may be saved in the day of the Lord Jesus” (<a href="https://bibleox.com/en/eng-nkjv/1kor/5/#L3-5">1 Cor. 5:3-5</a>)</p></blockquote><h4>Those Being Saved Have Guardian Angels</h4><p>As it is written, angels are sent to minister to those being saved:</p><blockquote><p>“Are <strong>they [the angels] not all ministering spirits sent forth to minister for those who will inherit salvation</strong>?” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L14">Heb. 1:14</a>)</p></blockquote><p>And the angels see the face of God (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L10">Matt. 18:10</a>). Even they could pass on our prayers. We pray not only to holy people, but also to the holy angels: we ask for their prayers for us, we thank them for their labor and care.</p><p>The opponents of communion between the earthly Church and the heavenly do not allow one even to thank the guardian angel who has been sent to minister to us, who does not need to be omnipresent and almighty in order to hear us.</p><p>So the Church believes that the saints hear our prayers thanks to their abiding in the divine light and grace. Union with God gives them this ability. God Himself gives them this ability. Thus, to put it very simply, the saints hear prayers not thanks to their own abilities, but thanks to God and His abilities.</p><h3>How Does the Church Know Who Is a Saint? Do People Not Decide for God?</h3><p>People do not decide for God. God, according to His promises (<a href="https://bibleox.com/en/en/w/Vs4n_Veneration_of_the_Saints/#HH-The-Saints-Will-Be-in-Honor">quotes</a>), Himself glorifies His saints, reveals miracles, and heeds their prayers. The Church only bears witness to this and brings into order the veneration of the saint among the people, so that there is no chaos, as the apostle also commanded:</p><blockquote><p>“<strong>Let all things be done decently and in order</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/14/#L40">1 Cor. 14:40</a>)</p></blockquote><blockquote><p>“For we hear that <strong>there are some who walk among you in a disorderly manner</strong>, not working at all, but are busybodies” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L11">2 Thess. 3:11</a>).</p></blockquote><p>The witness of the Church to the holiness of a righteous person and the establishment of the order of veneration (canonization) takes place, as a rule, much later than the death of the righteous person, when in examining this question one can proceed not only from the earthly life of the righteous person, but also from what God may have revealed about the righteous person after his passing to heaven, to life with God.</p><p>Testimonies are gathered from the members of the Church about miracles and healings that take place at the grave of the righteous person, about the prayerful help of the righteous person[2]. The purity of his life and faith is carefully examined. After this the Church examines the gathered information in council, and may approve the veneration of the righteous person as a saint, and also write church texts and an icon for this and establish a day of commemoration. In part, this is a bringing into order of the veneration that is already taking place among the church people, an indication of the correctness of this veneration, and its inclusion in divine services.</p><p>However, there is no need to bear witness to the holiness of many righteous people, since it follows from Holy Scripture and the Tradition of the Church. Among the well-known saints are, without doubt, <a href="https://bibleox.com/ru/ru/w/%D0%91%D0%BE%D0%B3%D0%BE%D1%80%D0%BE%D0%B4%D0%B8%D1%86%D0%B0/">the Virgin Mary, the Theotokos</a> (for whom God has done great things, <a href="https://bibleox.com/en/eng-nkjv/lk/1/#L49">Luke. 1:49</a>), the forefathers, the prophets, the apostles, the bishops, presbyters and deacons they appointed (for example, the deacon and first martyr Stephen, <a href="https://bibleox.com/en/eng-nkjv/act/7/#L55-60">Act. 7:55-60</a>), and a multitude of martyrs. Besides, the Church prays not only to holy people, but also to angels: to the Archangel Michael, to Gabriel, to many others, to the <a href="https://bibleox.com/ru/ru/w/%D0%B0%D0%BD%D0%B3%D0%B5%D0%BB-%D1%85%D1%80%D0%B0%D0%BD%D0%B8%D1%82%D0%B5%D0%BB%D1%8C/">guardian angel</a>. A witness to the holiness of the angels is superfluous, since they are known servants of God.</p><h2>An Important Comment</h2><p>Before defending prayers to the saints, one must firmly grasp a key point: the opponents have no positive part in their explanation of the prohibition of prayers to the saints. The foundation of the opponents’ argument consists of one phrase: “it is not said in Scripture”. This is the negative part of the explanation, on which they will insist. They have no positive part, that is, a clear understanding (comprehension) of the prohibition.</p><p>Adventists can partly offer an understanding, because they do not believe in the life of a person’s soul after the death of his body. However, even Adventists cannot explain the prohibition of prayers to angels, for they do not (yet) deny the existence of angels. According to Scripture, angels are appointed to those being saved, caring for the salvation of a person (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L14">Heb. 1:14</a>) — why can nothing be said to them? They cannot explain this.</p><p>As for the other (neo-)Protestants, most of them believe in the life of a person’s soul after separation from the body, and they cannot at all explain the reasons why one may not communicate with the heavenly Church, to which we have already come even now (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-23">Heb. 12:22-23</a>), why one may not speak with the patriarchs, apostles, martyrs and angels. Of course, they will try to bring up something, but it will always be unconvincing. For example, they will say that the saints have entered God’s rest and therefore supposedly are no longer troubled about earthly affairs. But then it turns out that God too is not troubled about earthly affairs, because He too is in the same rest. Their other attempts to give an explanation look just as absurd.</p><p>The need to pray to the saints is derived from Scripture implicitly (step by step), that is, this need is indicated not explicitly, it is implied. And this is normal, because not everything is said directly in Scripture. The most important teaching about God as the Trinity is derived from Scripture implicitly. Our opponents also derive a great deal from Scripture implicitly. For example, nowhere is it said that infants may not be baptized, yet they unreasonably claim that they may not be baptized, and it does not trouble them that this is not said in Scripture. They try to derive this prohibition implicitly, from other statements in Scripture. Therefore it is extremely important to bring them onto this field and ask them to give an understanding of the prohibition of praying to the saints.</p><p>And also, dear friend, remember too that the opponents of prayers to the saints rise up not at all against intercessory prayers (for it is easy to prove that they themselves are mediators for one another when they pray for one another, however much they argue with this). The most important thing they rise up against is the <strong><mark>communion</mark> of the earthly Church with the heavenly</strong>, against any communion with holy spirits: the holy angels and holy people, the friends of God. As if the earthly church had taken offense at the heavenly one and does not want to speak with it, as if one part of the body of Christ does not wish to communicate with another part of the same body. They cannot allow a single word; they do not allow even thanks to the guardian angel for his care for us. For having admitted even the slightest possibility of communion with the saints in the spiritual world, they would soon have nothing left but to admit, step by step, everything else that belongs to the communion of the earthly and heavenly Church. Therefore, as one of the questions, it is worth considering the possibility of communicating with angels, which is very widely presented in Scripture.</p>
