      <h2>Definition: the Church Is the Body of Christ</h2><blockquote><p>“And He put all things under His feet, and gave Him to be <strong>head over all things to the church, which is <mark>His body</mark></strong>, the fullness of Him who fills all in all” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L22-23">Eph. 1:22-23</a>)</p></blockquote><blockquote><p>“Now <strong>you are <mark>the body of Christ</mark></strong>, and members individually” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L27">1 Cor. 12:27</a>)</p></blockquote><blockquote><p>“Do you not know that <strong>your bodies are <mark>members of Christ</mark></strong>?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L15">1 Cor. 6:15</a>)</p></blockquote><blockquote><p>“For as we have many members in one body, but all the members do not have the same function, so <strong>we, being many, are <mark>one body in Christ</mark></strong>, and individually members of one another” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L4-5">Rom. 12:4-5</a>)</p></blockquote><blockquote><p>“I now rejoice in my sufferings for you, and fill up in my flesh what is lacking in the afflictions <strong>of Christ, for the sake of <mark>His body</mark>, which is <mark>the church</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L24">Col. 1:24</a>)</p></blockquote><blockquote><p>“For no one ever hated his own flesh, but nourishes and cherishes it, <strong>just as the Lord does <mark>the church</mark></strong>. For <strong><mark>we are members of His body</mark></strong>, of His flesh and of His bones” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L29-30">Eph. 5:29-30</a>)</p></blockquote><blockquote><p>“And let the peace of God rule in your hearts, to which also <strong>you were called <mark>in one body</mark></strong>; and be thankful” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L15">Col. 3:15</a>)</p></blockquote><h2>Joining the Body (the Church)</h2><h3>Baptism</h3><blockquote><p>“For <strong>by one Spirit we were all <mark>baptized into one body</mark></strong> — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>)</p></blockquote><h3>Communion</h3><blockquote><p>“The cup of blessing which we bless, is it not the communion of the blood of Christ? <strong>The bread</strong> which we break, is it not <strong><mark>the communion of the body of Christ</mark></strong>? <strong>For we, though many, are one bread and one body; for we all partake of that one bread</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L16-17">1 Cor. 10:16-17</a>)</p></blockquote><h2>Christ Is the Savior of the Body (the Church)</h2><blockquote><p>“For the husband is head of the wife, as also <strong>Christ is head of the church; and He is <mark>the Savior of the body</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L23">Eph. 5:23</a>)</p></blockquote><blockquote><p>“<strong><mark>Abide in Me</mark></strong>, and I in you. As <strong><mark>the branch cannot bear fruit of itself</mark>, unless it abides in the vine, neither can you, unless you abide in Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L4">John. 15:4</a>)</p></blockquote><h3>Christ Brings Those Who Are Being Saved into the Church</h3><blockquote><p>“And <strong><mark>the Lord</mark></strong> <strong><mark>added to the church</mark></strong> daily <strong><mark>those who were being saved</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L47">Act. 2:47</a>)</p></blockquote><p>The merciful Samaritan of the parable is an image of Christ saving man. He binds up the man’s wounds and brings him to an inn (the Church), to which He entrusts the care of his recovery (salvation):</p><blockquote><p>“Then Jesus answered and said: ‘A certain man went down from Jerusalem to Jericho, and fell among thieves, who stripped him of his clothing, wounded him, and departed, leaving him half dead. &lt;...&gt; But a certain <strong><mark>Samaritan</mark></strong>, as he journeyed, came where he was. And when he saw him, he had compassion. So he went to him and <strong><mark>bandaged his wounds</mark></strong>, pouring on oil and wine; and <strong>he set him on his own animal, <mark>brought him to an inn</mark>, and took care of him</strong>. On the next day, when he departed, he took out two denarii, gave them to the innkeeper, and said to him, “Take care of him; and whatever more you spend, when I come again, I will repay you”’” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L30,33-35">Luke. 10:30,33-35</a>)</p></blockquote><h2>The Composition of the Church</h2><h3>The Head of the Body Is Christ</h3><blockquote><p>“And <strong>He is the head of the body, the church</strong>, who is the beginning, the firstborn from the dead, that in all things He may have the preeminence” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L18">Col. 1:18</a>)</p></blockquote><blockquote><p>“And He put all things under His feet, and gave Him to be <strong>head</strong> over all things to <strong>the church</strong>, which is <strong>His body</strong>, the fullness of Him who fills all in all” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L22-23">Eph. 1:22-23</a>)</p></blockquote><blockquote><p>“and not holding fast to <strong>the Head, from whom all the body</strong>, nourished and knit together by joints and ligaments, grows with the increase that is from God” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L19">Col. 2:19</a>)</p></blockquote><h3>In the Body There Is No Other Head but Christ</h3><p>The apostles and bishops are equal among themselves. The apostles often argued about which of them was the greatest. Christ told them not to seek power over one another [<a href="https://bibleox.com/en/en/w/Be6q_The_Church_Bishops_Are_Equal/">more</a>]:</p><blockquote><p>“<strong>Now there was also a dispute among them</strong> [the apostles]<strong>, as to which of them should be considered the greatest</strong>. And He said to them, ‘The kings of the Gentiles exercise lordship over them, and those who exercise authority over them are called “benefactors.” <strong>But not so among you; on the contrary, he who is greatest among you, let him be as the younger</strong>, and he who governs as he who serves’” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L24-26">Luke. 22:24-26</a>)</p></blockquote><h3>The Members of the Body Are Different</h3><blockquote><p>“And God has appointed these in the church: first apostles, second prophets, third teachers, after that miracles, then gifts of healings, helps, administrations, varieties of tongues.</p><p>Are all <strong>apostles</strong>?</p><p>Are all <strong>prophets</strong>?</p><p>Are all <strong>teachers</strong>?</p><p>Are all <strong>workers of miracles</strong>?</p><p>Do all have gifts of <strong>healings</strong>?</p><p>Do all speak with <strong>tongues</strong>?</p><p>Do all <strong>interpret</strong>?”</p><p>(<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28-30">1 Cor. 12:28-30</a>)</p></blockquote><blockquote><p>“For in fact <strong>the body is not one member but many</strong>. If the foot should say, ‘Because I am not a hand, I am not of the body,’ is it therefore not of the body? And if the ear should say, ‘Because I am not an eye, I am not of the body,’ is it therefore not of the body? If the whole body were an eye, where would be the hearing? If the whole were hearing, where would be the smelling? But now God has set the members, each one of them, in the body just as He pleased. And if they were all one member, where would the body be? But now indeed <strong>there are many members, yet one body</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L14-20">1 Cor. 12:14-20</a>)</p></blockquote><h2>The Unity of the Earthly and Heavenly Church (the One Body of Christ)</h2><h3>The Heavenly and the Earthly Are United in Christ</h3><blockquote><p>“Blessed be the God and Father of our Lord Jesus Christ, who has blessed us with every spiritual blessing in the heavenly places in Christ, &lt;...&gt; having made known to us the mystery of His will, according to His good pleasure which He purposed in Himself, that <strong>in the dispensation of the fullness of the times</strong> <strong><mark>He might gather together in one all things in Christ</mark></strong> <em>(Greek: ἀνακεφαλαιώσασθαι — “to bring together under one head”)</em>, <strong><mark>both which are in <u>heaven and which are on earth</u></mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L3,9-10">Eph. 1:3,9-10</a>)</p></blockquote><blockquote><p>“For this reason I bow my knees to the Father of our Lord Jesus Christ, from whom <strong>the whole family</strong> <strong><mark>in heaven and earth</mark></strong> is named” (<a href="https://bibleox.com/en/eng-nkjv/ef/3/#L14-15">Eph. 3:14-15</a>)</p></blockquote><blockquote><p>“And He is the head of the body, the church, who is the beginning, the firstborn from the dead, that in all things He may have the preeminence. For it pleased the Father that <strong>in Him all the fullness should dwell, and by Him to reconcile all things to Himself</strong>, by Him, whether <strong><mark>things on earth or things in heaven</mark></strong>, having made peace through the blood of His cross” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L18-20">Col. 1:18-20</a>)</p></blockquote><blockquote><p>“For to this end <strong><mark>Christ</mark></strong> died and rose and lived again, that He might be <strong><mark>Lord of both the dead and the living</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L9">Rom. 14:9</a>)</p></blockquote><h3>The Bond and Care of All the Members for One Another</h3><p>The whole body is bound together by various bonds:</p><blockquote><p>“but, speaking the truth in love, may grow up in all things into Him who is the head — Christ — from whom <strong><mark>the whole body</mark>, joined and <mark>knit together by what every joint supplies</mark></strong>, according to the effective working by which every part does its share, causes growth of the body for the edifying of itself in love” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L15-16">Eph. 4:15-16</a>)</p></blockquote><blockquote><p>“Let no one cheat you of your reward &lt;…&gt; and not holding fast to the Head, from whom <strong><mark>all the body, nourished and knit together by joints and ligaments</mark>, grows</strong> with the increase that is from God” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L18-19">Col. 2:18-19</a>)</p></blockquote><p>All its members know one another and care for one another:</p><blockquote><p>“But now God has set <strong>the members, each one of them, in the body</strong> just as He pleased. And if they were all one member, where would the body be? But now indeed <strong>there are many members, yet one body</strong>. And the eye cannot say to the hand, ‘I have no need of you’; nor again the head to the feet, ‘I have no need of you.’ No, much rather, those members of the body which seem to be weaker are necessary. &lt;…&gt; on these we bestow greater honor; &lt;…&gt; But God composed the body, having given greater honor to that part which lacks it, <strong>that there should be no schism in the body</strong>, but that <strong><mark>the members should have the same care for one another</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L18-25">1 Cor. 12:18-25</a>)</p></blockquote><h3>On Earth the Church Is Militant</h3><blockquote><p>“<strong>Be sober</strong>, be vigilant; because <strong>your adversary the devil walks about like a roaring lion, seeking whom he may devour</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L8">1 Pet. 5:8</a>)</p></blockquote><blockquote><p>“Put on the whole armor of God, that you may be able <strong>to stand against the wiles of the devil. For we do not wrestle</strong> against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this age, <strong>against spiritual hosts of wickedness in the heavenly places</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L11-12">Eph. 6:11-12</a>)</p></blockquote><blockquote><p>“For <strong>here we have no continuing city</strong>, but we seek the one to come” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L14">Heb. 13:14</a>)</p></blockquote><h3>In Heaven the Church Is Triumphant</h3><blockquote><p>“But you have come to Mount Zion and to the city of the living God, <strong>the heavenly Jerusalem, to an innumerable company of angels</strong>, to <strong><mark>the general assembly</mark></strong> <em>(Greek: πανήγυρις — “a festal, triumphant assembly”)</em> and <strong><mark>church of the firstborn</mark></strong> who are registered in heaven, to God the Judge of all, <strong>to the spirits of just men made perfect</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-23">Heb. 12:22-23</a>)</p></blockquote><h2>The Church Is Visible</h2><p>It cannot be hidden from people</p><blockquote><p>“You are the light of the world. <strong><mark>A city that is set on a hill cannot be hidden</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L14">Matt. 5:14</a>)</p></blockquote><p>God arranged the members of the body (the Church) so that there would be no divisions, but that all would care for one another, suffer together and rejoice together:</p><blockquote><p>“For <strong>by one Spirit we were all baptized into one body</strong> — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit. <strong>For in fact the body is not one member but many</strong>. &lt;...&gt; <strong><mark>And the eye cannot say to the hand, ‘I have no need of you’; nor again the head to the feet, ‘I have no need of you’</mark></strong>. No, much rather, those members of the body which seem to be weaker are necessary. And those members of the body which we think to be less honorable, on these we bestow greater honor; and our unpresentable parts have greater modesty, but our presentable parts have no need. But <strong><mark>God composed the body</mark></strong>, having given greater honor to that part which lacks it, <strong><mark>that there should be no schism in the body</mark></strong>, but that the members should have the same care for one another. And <strong>if one member suffers, all the members suffer with it; or if one member is honored, all the members rejoice with it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13-14,21-26">1 Cor. 12:13-14,21-26</a>)</p></blockquote><p>The whole body is bound together by various bonds:</p><blockquote><p>“but, speaking the truth in love, may grow up in all things into Him who is the head — Christ — from whom <strong><mark>the whole body</mark>, joined and <mark>knit together by what every joint supplies</mark></strong>, according to the effective working by which every part does its share, causes growth of the body for the edifying of itself in love” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L15-16">Eph. 4:15-16</a>)</p></blockquote><blockquote><p>“Let no one cheat you of your reward &lt;…&gt; and not holding fast to the Head, from whom <strong><mark>all the body, nourished and knit together by joints and ligaments</mark>, grows</strong> with the increase that is from God” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L18-19">Col. 2:18-19</a>)</p></blockquote><p>One can turn to the Church for judgment:</p><blockquote><p>“<strong>Moreover if your brother sins against you</strong>, go and tell him his fault between you and him alone. If he hears you, you have gained your brother. &lt;...&gt; And if he refuses to hear them, <strong><mark>tell it to the church</mark>. But if he refuses even to hear the church, let him be to you like a heathen and a tax collector</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L15,17">Matt. 18:15,17</a>)</p></blockquote><p>About the boundaries of the Church: <a href="https://bibleox.com/en/en/w/Vu3d_The_Church_a_Visible_Unity/">more</a>.</p><h2>The Church Is Invincible</h2><h3>The Church Will Not Be Overcome</h3><blockquote><p>“I will build My church, and <strong>the gates of Hades <mark>shall not prevail against it</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L18">Matt. 16:18</a>)</p></blockquote><h3>God Always Abides with the Church</h3><blockquote><p>“And I will pray the Father, and He will give you another Helper, that <strong>He may abide with you <mark>forever</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>)</p></blockquote><blockquote><p>“I am with you <strong><mark>always</mark>, even to the end of the age</strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L20">Matt. 28:20</a>)</p></blockquote><h3>The Church Always Glorifies God</h3><blockquote><p>“to Him be <strong>glory in the church</strong> by Christ Jesus <strong><mark>to all generations, forever and ever</mark></strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/ef/3/#L21">Eph. 3:21</a>)</p></blockquote><h3>The Truth Will Always Be in the Church</h3><blockquote><p>“The Elder, to the elect lady and her children, whom I love in truth, and not only I, but also all those who have known the truth, because of <strong><mark>the truth</mark></strong> which abides in us and <strong><mark>will be with us forever</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L1-2">2 John. 1:1-2</a>)</p></blockquote><h2>The Banner of the Church Is the Cross</h2><p>In the Old Testament, Israel, on its way to the kingdom promised to it, moved in the shape of a cross: <a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82">more</a>. Ancient Israel was a prefiguration of the Church of Christ — <a href="https://bibleox.com/en/en/w/Ni5t_The_Church_the_New_Israel/">the new Israel</a>. Thus the cross is the main banner of the Church, a symbol of victory and reconciliation, an altar (that is, a great sacred object): <a href="https://bibleox.com/en/en/w/Cx2v_The_Cross/#HH-The-Cross--an-Instrument-of-Victory-and-Reconciliation">more about the cross</a>.</p><p>The use of the sign of the cross by the ancient Christians: <a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82%D0%BD%D0%BE%D0%B5-%D0%B7%D0%BD%D0%B0%D0%BC%D0%B5%D0%BD%D0%B8%D0%B5">https://bibleox.com/ru/ru/w/крестное-знамение</a></p><h2>The Day the Church Was Created Is the 50th Day After the Resurrection of Christ</h2><ol><li><p>One enters the Church through Baptism (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>).</p></li><li><p>Baptism is performed with water and the Spirit (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>).</p></li><li><p>Baptism with the Holy Spirit is first performed on the 50th day after the resurrection of Christ (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L1-5,8-9">Act. 1:1-5,8-9</a>).</p></li></ol><h3>One Enters the Church Through Baptism</h3><blockquote><p>“For <strong>by one Spirit we were all <mark>baptized into one body</mark></strong> — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>)</p></blockquote><blockquote><p>“For as many of you as <strong><mark>were baptized into Christ have put on Christ</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal. 3:27</a>)</p></blockquote><h3>Baptism Is Birth of Water and the Spirit</h3><blockquote><p>“Jesus answered, ‘Most assuredly, I say to you, <strong>unless one is <mark>born of water and the Spirit</mark>, he cannot enter the kingdom of God</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L5">John. 3:5</a>)</p></blockquote><h3>Christ Will Baptize with the Holy Spirit</h3><blockquote><p>“John answered, saying to all, ‘I indeed baptize you with water; but One mightier than I is coming, whose sandal strap I am not worthy to loose. <strong><mark>He will baptize you with the Holy Spirit</mark></strong> and fire’” (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L16">Luke. 3:16</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/3/#L11">Matt. 3:11</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/1/#L8">Mark. 1:8</a>)</p></blockquote><h3>Until Christ Goes Away, the Holy Spirit Will Not Come</h3><blockquote><p>“Nevertheless I tell you the truth. It is to your advantage that I go away; for <strong><mark>if I do not go away, the Helper will not come to you</mark></strong>; but if I depart, I will send Him to you” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L7">John. 16:7</a>; <a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>; <a href="https://bibleox.com/en/eng-nkjv/in/14/#L26">John. 14:26</a>)</p></blockquote><blockquote><p>“But <strong><mark>when the Helper comes, whom I shall send to you</mark></strong> from the Father, the Spirit of truth who proceeds from the Father, He will testify of Me” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L26">John. 15:26</a>)</p></blockquote><blockquote><p>“Behold, I send the Promise of My Father upon you; but <strong>tarry in the city of Jerusalem until you are endued with power from on high</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L49">Luke. 24:49</a>)</p></blockquote><h3>After the Resurrection Christ Had Not Yet Ascended to the Father</h3><blockquote><p>“Jesus said to her, ‘Do not cling to Me, for <strong><mark>I have not yet ascended to My Father</mark></strong>; but go to My brethren and say to them, “I am ascending to My Father and your Father, and to My God and your God”’” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L17">John. 20:17</a>)</p></blockquote><h3>What Christ Promised Will Be Fulfilled on the 50th Day After the Resurrection</h3><p>The promised baptism with the Holy Spirit was first accomplished 50 days after the Resurrection of Christ:</p><blockquote><p>“…of all that Jesus began both to do and teach, until the day in which He was taken up, after He through the Holy Spirit had given commandments to the apostles whom He had chosen, to whom He also presented Himself alive after His suffering by many infallible proofs, <strong><mark>being seen by them during forty days</mark></strong> and speaking of the things pertaining to the kingdom of God. And <strong>being assembled together with them, He commanded them <mark>not to depart from Jerusalem, but to wait for the Promise of the Father</mark>, “which,” He said, “<mark>you have heard from Me</mark>; for <mark>John truly baptized with water</mark>, but <mark>you shall be baptized with the Holy Spirit not many days from now</mark>.”</strong> &lt;...&gt; But you shall receive power when the Holy Spirit has come upon you; and you shall be witnesses to Me in Jerusalem, and in all Judea and Samaria, and to the end of the earth. Now when He had spoken these things, while they watched, He was taken up, and a cloud received Him out of their sight” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L1-5,8-9">Act. 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong>When the Day of Pentecost had fully come</strong>, they were all with one accord in one place. &lt;...&gt; Then <strong><mark>there appeared to them divided tongues, as of fire, and one sat upon each of them. And they were all filled with the Holy Spirit</mark></strong> and began to speak with other tongues, as the Spirit gave them utterance” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L1,3-4">Act. 2:1,3-4</a>)</p></blockquote><h3>However, the Sending of the Holy Spirit Is Spoken of on the Very Day of Christ’s Resurrection, but Baptism Is Not Mentioned</h3><p>Here the apostles are given the authority of the Church, and the priestly hierarchy is created:</p><blockquote><p>“<strong>Now on the first day of the week Mary Magdalene went to the tomb</strong> early, &lt;...&gt; Then, <strong>the same day at evening, being the first day of the week</strong>, when the doors were shut where the disciples were assembled, for fear of the Jews, <strong>Jesus came</strong> and stood in the midst, and said to them, ‘Peace be with you.’ &lt;...&gt; <strong>And when He had said this, He breathed on them, and said to them, “Receive the Holy Spirit.</strong> If you forgive the sins of any, they are forgiven them; if you retain the sins of any, they are retained”’” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L1,19,22-23">John. 20:1,19,22-23</a>)</p></blockquote><h2>Criticism</h2><h3>“The Historical Church Has Fallen”</h3><p>The founders of societies separate from the Church base the model of their movements’ existence on the claim that the historical Church of Christ departed from God and fell, and that this is why their separate society was needed. If one does not prove that the Church has fallen, then their separate society is not needed either, and what is needed is to enter the historical Church of Christ.</p><p>To support the idea of the fall of the Church, verses like these about wolves are often cited:</p><blockquote><p>“For I know this, that <strong>after my departure <mark>savage wolves will come in among you, not sparing the flock</mark>. Also from among yourselves men will rise up, speaking perverse things, <mark>to draw away</mark> the disciples <mark>after themselves</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L29-30">Act. 20:29-30</a>)</p></blockquote><p>However, it must be admitted that these verses are only a prophecy about the appearance of false teachers who wish to lead people away from the Church <strong>after themselves</strong>, and not a prophecy about the fall of the Church.</p><p>A line above, the apostle called on the presbyters to watch carefully over themselves and the flock:</p><blockquote><p>“he sent to Ephesus and <strong>called for the elders of the church</strong> &lt;...&gt; Therefore <strong><mark>take heed to yourselves and to all the flock</mark>, among which the Holy Spirit has made you overseers</strong> <em>(Greek: ἐπισκόπους — “bishops”)</em>, <strong>to shepherd the church of God</strong> which He purchased with His own blood” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L17,28">Act. 20:17,28</a>)</p></blockquote><p>Why does the apostle call for care of the flock? He immediately gives the answer: because false teachers will appear and, like wolves, they will want to plunder the Church’s flock (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L29-30">Act. 20:29-30</a>). But the presbyters appointed by the Holy Spirit must not allow this.</p><p>Will the presbyters succeed in protecting the Church’s flock? Yes, they will. Because there are no prophecies about the fall of the Church, but there are prophecies about its invincibility:</p><blockquote><p>“I will build My <strong>church</strong>, and <strong>the gates of Hades <mark>shall not prevail</mark> against it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L18">Matt. 16:18</a>)</p></blockquote><blockquote><p>“to Him be <strong>glory in the church</strong> by Christ Jesus <strong>to all generations</strong>, <strong><mark>forever and ever</mark></strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/ef/3/#L21">Eph. 3:21</a>)</p></blockquote><blockquote><p>“I am with you <strong><mark>always</mark>, even to the end of the age</strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L20">Matt. 28:20</a>)</p></blockquote><blockquote><p>“And I will pray the Father, and He will give you another Helper, that <strong><mark>He may abide with you forever</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>)</p></blockquote><h3>“The Church Is Two or Three Gathered for Prayer”</h3><p>After Christ had once created His Church, the later founders of Christian communities first of all face the need to explain to people the appearance of their new society, separate from the Church of Christ. Having arisen recently on the initiative of an ordinary person, such a society has no direct historical connection with the ancient Christians, and therefore is always forced to prove that it is somehow part of the Church of Christ created 2000 years ago. For this, a Bible verse about the importance of common prayer is often used. It is proposed to consider that since Christ is in the midst of two or three who pray, any such people praying are supposedly already a church unto themselves:</p><blockquote><p>“Again I say to you that if two of you agree on earth concerning anything that they ask, it will be done for them by My Father in heaven. For <strong>where two or three are gathered together in My name, I am there in the midst of them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L19-20">Matt. 18:19-20</a>)</p></blockquote><p>However, these verses literally speak only of the power of common prayer, not of the Church. There are no words about the Church here. But a few lines above there are words about the Church:</p><blockquote><p>“Moreover if your brother sins against you, go and tell him his fault between <strong>you</strong> and <strong>him alone</strong>. If he hears you, you have gained your brother. But if he will not hear, take with you <strong>one or two more</strong>, that ‘by the mouth of two or three witnesses every word may be established.’ <strong>And if he refuses to hear them, <mark>tell it to the church</mark>. But if he refuses even to hear the church</strong>, let him be to you like a heathen and a tax collector” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L15-17">Matt. 18:15-17</a>)</p></blockquote><p>Here the people who have met are:</p><ul><li><p>me;</p></li><li><p>the brother who sinned;</p></li><li><p>one or two more witnesses.</p></li></ul><p>In all that makes 1+1+2=4. Or at least 3.</p><p>These three people gathered together are still not the Church, as can be seen, because all of them must turn for judgment not to themselves, but to the Church. Thus the Church is not two or three gathered for prayer, but something permanently and visibly existing, to which one can turn for judgment, whose answer one can hear and either obey or not obey. And whoever does not listen to this answer of the Church becomes for the members of the Church “like a heathen and a tax collector”.</p><p>And who can judge? The apostles and their successors, the bishops (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L18">Matt. 18:18</a>). For example, Bishop Timothy:</p><blockquote><p>“<strong>Do not receive an accusation against an elder except from two or three witnesses</strong>. Those who are sinning rebuke in the presence of all, that the rest also may fear” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L19-20">1 Tim. 5:19-20</a>)</p></blockquote><p>Thus the interpretation about two or three praying people, who have no right to judge others, does not refer to the Church. And the founder of a society separate from the Church, by not listening to the Church, himself becomes to it “like a heathen and a tax collector” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L17">Matt. 18:17</a>). Whom will he judge in his society? How can he give authority to judge, if he himself never had it? The answer is obvious.</p>

