      <h2>Prayers, Prophecies and Miracles Are Not a Sign of Salvation</h2><blockquote><p>“<strong><mark>Not everyone who says to Me, ‘Lord, Lord,’ shall enter the kingdom of heaven</mark></strong>, but he who does the will of My Father in heaven. Many will say to Me in that day, ‘Lord, Lord, <strong>have we not prophesied</strong> in Your name, <strong>cast out demons</strong> in Your name, and <strong>done many wonders</strong> in Your name?’ And then I will declare to them, ‘<strong><mark>I never knew you</mark></strong>; depart from Me, you who practice lawlessness!’” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L21-23">Matt. 7:21-23</a>)</p></blockquote><blockquote><p>“And He said: ‘<strong>Take heed that you not be deceived. For many will come in My name</strong>, saying, “I am He,” and, “<strong>The time has drawn near.” Therefore do not go after them</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/21/#L8">Luke. 21:8</a>) (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L5">Matt. 24:5</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/13/#L6">Mark. 13:6</a>)</p></blockquote><h2>For Salvation It Is Necessary to Be a Member of the Body of Christ (the <a href="https://bibleox.com/en/en/w/Cw7a_The_Church/">Church</a>)</h2><p>The Church is the Body of Christ:</p><blockquote><p>“<strong><mark>His body</mark></strong>, which is <strong><mark>the church</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L24">Col. 1:24</a>)</p></blockquote><p>Christ is the Savior of the Body, that is, of the Church:</p><blockquote><p>“Christ is head of the church; and He is <strong><mark>the Savior of the body</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L23">Eph. 5:23</a>)</p></blockquote><p>The door to salvation is Christ:</p><blockquote><p>“<strong><mark>I am the door. If anyone enters by Me, he will be saved</mark></strong>, and will go in and out and find pasture. The thief does not come except to steal, and to kill, and to destroy. I have come that they may have life, and that they may have it more abundantly” (<a href="https://bibleox.com/en/eng-nkjv/in/10/#L9-10">John. 10:9-10</a>)</p></blockquote><p>The Lord added those who were being saved to the Church:</p><blockquote><p>“And the Lord <strong><mark>added to the church</mark></strong> daily <strong><mark>those who were being saved</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L47">Act. 2:47</a>)</p></blockquote><p>Whoever is outside the body cannot bear fruit, will be cast out and thrown into the fire:</p><blockquote><p>“<strong><mark>Abide in Me</mark>, and I in you. As <mark>the branch cannot bear fruit of itself</mark>, unless it abides in the vine</strong>, neither can you, unless you abide in Me. I am the vine, you are the branches. He who abides in Me, and I in him, bears much fruit; for <strong>without Me you can do nothing</strong>. <strong><mark>If anyone does not abide in Me, he is cast out</mark></strong> as a branch and is withered; and <strong>they gather them and throw them into the fire</strong>, and they are burned” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L4-6">John. 15:4-6</a>)</p></blockquote><blockquote><p>“This is the ‘stone which was rejected by you builders, which has become the chief cornerstone.’ <strong><mark>Nor is there salvation in any other</mark></strong>, for there is no other name under heaven given among men by which we must be saved” (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L11-12">Act. 4:11-12</a>)</p></blockquote><p>Whoever is not with Christ is against Him:</p><blockquote><p>“<strong>He who is not with Me is against Me</strong>, and he who does not gather with Me scatters” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L23">Luke. 11:23</a>)</p></blockquote><h2>Joining the Body of Christ (the Church)</h2><h3>Baptism</h3><blockquote><p>“For <strong>by one Spirit we were all <mark>baptized into one body</mark></strong> — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>)</p></blockquote><h3>Communion</h3><blockquote><p>“The cup of blessing which we bless, is it not the communion of the blood of Christ? <strong>The bread</strong> which we break, is it not <strong>the communion of the body of Christ</strong>? <strong>For we, though many, are one bread and <mark>one body</mark>; <mark>for we all partake</mark> of that one bread</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L16-17">1 Cor. 10:16-17</a>)</p></blockquote><h2>The Ark Is the Old Testament Prefiguration of Salvation</h2><blockquote><p>“So the LORD said, ‘<strong>I will destroy man whom I have created from the face of the earth</strong>, both man and beast, creeping thing and birds of the air, for I am sorry that I have made them.’ &lt;...&gt; The earth also was corrupt before God, and the earth was filled with violence. So God looked upon the earth, and indeed it was corrupt; for all flesh had corrupted their way on the earth. And God said to Noah, ‘The end of all flesh has come before Me, for the earth is filled with violence through them; and behold, <strong>I will destroy them with the earth</strong>. <strong><mark>Make yourself an ark</mark></strong> of gopherwood; make rooms in the ark, and cover it inside and outside with pitch. &lt;...&gt; And behold, <strong>I Myself am bringing floodwaters on the earth, to destroy from under heaven all flesh in which is the breath of life</strong>; <strong><mark>everything that is on the earth shall die</mark></strong>. But I will establish My covenant with you; and <strong>you shall go into the ark — you, your sons, your wife, and your sons’ wives with you</strong>. And of every living thing of all flesh you shall bring two of every sort into the ark, to keep them alive with you; they shall be male and female. Of the birds after their kind, of animals after their kind, and of every creeping thing of the earth after its kind, two of every kind will come to you to keep them alive. And you shall take for yourself of all food that is eaten, and you shall gather it to yourself; and it shall be food for you and for them.’ Thus Noah did; according to all that God commanded him, so he did” (<a href="https://bibleox.com/en/eng-nkjv/gen/6/#L7,11-14,17-22">Gen. 6:7,11-14,17-22</a>)</p></blockquote><blockquote><p>“And <strong>all flesh died</strong> that moved on the earth: birds and cattle and beasts and every creeping thing that creeps on the earth, and every man. <strong>All in whose nostrils was the breath of the spirit of life, all that was on the dry land, died</strong>. <strong>So He destroyed all living things which were on the face of the ground</strong>: both man and cattle, creeping thing and bird of the air. <strong><mark>They were destroyed from the earth. Only Noah and those who were with him in the ark remained alive</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/7/#L21-23">Gen. 7:21-23</a>)</p></blockquote><blockquote><p>“in the days of Noah, while the ark was being prepared, <strong><mark>in which a few, that is, eight souls, were saved</mark></strong> through water” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L20">1 Pet. 3:20</a>)</p></blockquote><h3>The Old Testament Images Were Written for Our Instruction</h3><blockquote><p>“<strong>Now all these things happened to them as examples, and they were written for our admonition</strong>, upon whom the ends of the ages have come” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L11">1 Cor. 10:11</a>)</p></blockquote><h2>Criticism</h2><h3>“You Say This out of Pride: ‘Only We Are Saved, and the Rest Are Not’”</h3><p>Once, through the prophet Moses, God created the Old Testament church and established in it the order pleasing to Him. Later, next to it, there arose the Samaritan people, made up of many resettled peoples, who, on the basis of the five scrolls of the prophet Moses (the Torah), not accepting the scrolls of the later writers (the prophets), themselves created their own separate religious society with its own order, which believed in God in its own way and awaited the Christ. Christ answers the Samaritan woman:</p><blockquote><p>“<strong>You worship what you do not know</strong>; we know what we worship, for <strong>salvation is of the Jews</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/4/#L22">John. 4:22</a>)</p></blockquote><p>Did Christ say this out of pride, or because in self-willed societies with a faith self-willedly invented from a book one really cannot be saved?</p><p>When the apostle says that those who do the works of the flesh, among which are heresies and schisms, cannot inherit the Kingdom of God, does he say this out of pride, or because with such sins one really cannot inherit the Kingdom of God?</p><blockquote><p>“<strong>Now the works of the flesh are evident</strong>, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, contentions, jealousies, outbursts of wrath, selfish ambitions, <strong><mark>dissensions*, heresies</mark></strong>, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that those who practice such things <strong><mark>will not inherit the kingdom of God</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p><p><strong><em><mark>*dissensions (διχοστασίαι)</mark> — division, splitting apart.</em></strong></p></blockquote><p>Protestants see pride here because of their invented teaching about a salvation supposedly already received merely by acknowledging Christ as one’s personal Savior, that is, salvation right now and by faith alone. The Orthodox do not hold this teaching, and accordingly have a completely different way of thinking about salvation (<a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5#HH-%D0%A3%D1%81%D0%BB%D0%BE%D0%B2%D0%B8%D1%8F-%D1%81%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D1%8F">more</a>).</p><p>On coming into the <a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F-%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">Orthodox Church</a>, we are not yet saved, but are being saved. Not all who have come into the Church will be saved, but only those who, making use of the means of salvation, labor diligently on themselves, uprooting sinful passions and acquiring the virtues of the Gospel. Being in the <a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F-%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">Orthodox Church</a> is only one of the conditions of salvation. Anyone who seeks salvation needs the means of salvation: a sick man needs medicine, and a man drowning in the middle of the ocean needs a ship. So too every person sick with sinful passions, in order to cross the sea of earthly life without drowning in the sinful abyss and to reach life with God, needs <strong>the means of salvation: the right faith and the grace-filled sacraments. </strong>These means of salvation have been placed by God in His ark of salvation — the <a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F-%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">Orthodox Church</a> — which God Jesus Christ Himself personally came and created 2000 years ago.</p><p>Communities recently and self-willedly created by ordinary people, directly contrary to God’s will for the unity of believers, not only do not have the means of salvation, but on the contrary, by their very separate existence lead people into grave sinful states — the mortal sins of heresies and schisms (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>).</p><p>The creation of one’s own “churches”, the division of believers, directly contrary to the will of Christ and the apostles for the unity of believers — all this is precisely a manifestation of pride:</p><blockquote><p>“I do not <strong><mark>pray</mark></strong> for these alone, but also for those who will believe in Me through their word; <strong><mark>that they all may be one</mark></strong>, as You, Father, are in Me, and I in You; that they also <strong>may be one in Us, <mark>that the world may believe that You sent</mark> Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>)</p></blockquote><blockquote><p>“Now I <strong><mark>plead</mark></strong> with you, brethren, by the name of our Lord Jesus Christ, <strong><mark>that you all speak the same thing</mark>, <mark>and that there be no divisions among you</mark></strong>, but that you <strong>be perfectly joined together <mark>in the same mind</mark> and <mark>in the same judgment</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>)</p></blockquote><p>Of course, being at enmity with Christ, creating one’s own “churches”, one cannot be saved. And the apostle says that by doing the works of the flesh, in heresies and schisms, one cannot inherit the Kingdom of Heaven:</p><blockquote><p>“<strong>Now the works of the flesh are evident</strong>, which are: adultery, fornication, uncleanness, lewdness, idolatry, sorcery, hatred, contentions, jealousies, outbursts of wrath, selfish ambitions, <strong><mark>dissensions*, heresies</mark></strong>, envy, murders, drunkenness, revelries, and the like; of which I tell you beforehand, just as I also told you in time past, that those who practice such things <strong><mark>will not inherit the kingdom of God</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p><p><strong><em><mark>*dissensions (διχοστασίαι)</mark> — division, splitting apart.</em></strong></p></blockquote><p>The apostle says directly that those who create divisions do not serve the Lord Jesus Christ:</p><blockquote><p>“Now I urge you, brethren, <strong><mark>note those who cause divisions</mark> and offenses</strong>, contrary to the doctrine which you learned, and avoid them. For <strong><mark>those who are such do not serve our Lord Jesus Christ</mark></strong>, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18">Rom. 16:17-18</a>)</p></blockquote><p>How can one be saved by following the road behind one who acts against Christ?</p><p>Besides, heresy and schism are not the only sins; there are many other <a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%8B%D0%B9-%D0%B3%D1%80%D0%B5%D1%85">mortal sins</a>. Is it an act of pride to warn a drunkard that, remaining in the mortal sin of drunkenness, one cannot inherit the Kingdom of Heaven, as it says in Scripture (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L9">1 Cor. 6:9</a>)? Or to say the same to a murderer, a thief, a sorcerer, a fornicator, a deceiver? If this is not pride and we must warn of these mortal sins (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L11">Eph. 5:11</a>), then, to be completely honest, one should also warn heretics and schismatics, because heresy and schisms are in the same list of mortal sins as drunkenness, murders and the like, remaining in which a person cannot inherit the Kingdom of Heaven.</p><p>How then can a person come out of this sinful state? By refusing to remain in a society recently created by an ordinary person, and refusing the faith of that society, recently invented by the same person. Then one should enter the <a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F-%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">Orthodox Church</a>, created by the Lord Jesus Christ, and take in the Orthodox faith, which the apostles were taught by Christ, which was placed by them in the <a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F-%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">Orthodox Church</a>, and which is unchangeably preserved in the Church of Christ by the Holy Spirit, sent to it forever:</p><blockquote><p>“And I will pray the Father, and He will give you another Helper, that <strong>He may abide with you <mark>forever</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>)</p></blockquote><blockquote><p>“I am with you <strong><mark>always</mark>, even to the end of the age</strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L20">Matt. 28:20</a>)</p></blockquote>

  - src: 4mHQbC7A_Церкви_изначально_дана_полнота_истины
    path: Fp2n_The_Fullness_of_Truth_Was_Given_to_the_Church_from_the_Beginning
    title: The Fullness of Truth Was Given to the Church from the Beginning
    title_sub: Bible quotes about the fullness of truth given to the Church from the beginning
    menu: { parent: Church, title: The Church — the Fullness of Truth, priority: 3 }
    body: |-
      <h2>The True Teaching Has Already Been Given to the Church Once</h2><blockquote><p>“Beloved, while I was very diligent to write to you concerning our common salvation, I found it necessary to write to you exhorting you <strong>to contend earnestly for the faith which was <mark>once for all</mark> delivered to the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude. 1:3</a>)</p></blockquote><blockquote><p>“Therefore <strong><mark>let that abide in you which you heard from the beginning</mark></strong>. If <strong><mark>what you heard from the beginning abides in you</mark></strong>, you also will abide in the Son and in the Father” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L24">1 John. 2:24</a>)</p></blockquote><p>That is why the Church is called the fullness:</p><blockquote><p>“And He put all things under His feet, and gave Him to be head over all things to <strong>the church</strong>, which is His body, <strong><mark>the fullness</mark></strong> of Him who fills all in all” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L22-23">Eph. 1:22-23</a>)</p></blockquote><p>The Church establishes this truth:</p><blockquote><p>“the church of the living God, the pillar and <strong><mark>ground of the truth</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/3/#L15">1 Tim. 3:15</a>)</p></blockquote><h2>The True Teaching Was Given Personally and Openly by Christ God Himself</h2><p>This teaching was handed down by Christ from the Father:</p><blockquote><p>“For <strong>I have given to them the words which You have given Me</strong>; and they have received them, and have known surely that I came forth from You; and they have believed that You sent Me” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L8">John. 17:8</a>)</p></blockquote><p>One must abide precisely in the teaching that Christ gave:</p><blockquote><p>“Whoever transgresses and does not abide in the doctrine of Christ does not have God. <strong>He who abides in the doctrine of Christ has both the Father and the Son</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9">2 John. 1:9</a>)</p></blockquote><h2>One May Not Teach Otherwise</h2><blockquote><p>“As I urged you when I went into Macedonia — remain in Ephesus that you may charge some <strong>that they <mark>teach no other doctrine</mark></strong>, nor give heed to fables and endless genealogies, which cause disputes rather than godly edification which is in faith” (<a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L3-4">1 Tim. 1:3-4</a>)</p></blockquote><blockquote><p>“And <strong><mark>the things that you have heard</mark> from me</strong> among many witnesses, <strong><mark>commit these</mark> to faithful</strong> men who will be able to teach others also” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2">2 Tim. 2:2</a>)</p></blockquote><blockquote><p>“Now I praise you, brethren, that you remember me in all things and <strong><mark>keep the traditions just as I delivered them to you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2">1 Cor. 11:2</a>)</p></blockquote><blockquote><p>“Moreover, brethren, I declare to you the gospel which I preached to you, which also you received and in which you stand, by which also you are saved, if <strong><mark>you hold fast that word which I preached to you</mark></strong> — unless you believed in vain” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L1-2">1 Cor. 15:1-2</a>)</p></blockquote><blockquote><p>“Finally then, brethren, we <strong>urge</strong> and exhort in the Lord Jesus that <strong>you should <mark>abound more and more</mark>, just as <mark>you received from us</mark> how you ought to walk and to please God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/4/#L1">1 Thess. 4:1</a>)</p></blockquote><blockquote><p>“Therefore, brethren, stand fast and <strong><mark>hold the traditions which you were taught</mark></strong>, whether by word or our epistle” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>)</p></blockquote><h2>There Will Be Attempts to Distort the Faith Given Once</h2><blockquote><p>“holding fast the faithful word as he has been taught, that he may be able, by sound doctrine, both to exhort and convict those who contradict. For <strong><mark>there are many insubordinate, both idle talkers and deceivers</mark></strong>, especially those of the circumcision, whose mouths must be stopped, who subvert whole households, teaching things which they ought not, for the sake of dishonest gain” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L9-11">Titus. 1:9-11</a>)</p></blockquote><blockquote><p>“But I fear, lest somehow, as the serpent deceived Eve by his craftiness, so your minds may be corrupted from the simplicity that is in Christ. For if he who comes <strong><mark>preaches another Jesus whom we have not preached</mark></strong>, or if you receive a different spirit which you have not received, or <strong><mark>a different gospel which you have not accepted</mark></strong> — you may well put up with it! &lt;...&gt; For such are false apostles, deceitful workers, transforming themselves into apostles of Christ. And no wonder! For Satan himself transforms himself into an angel of light. Therefore it is no great thing if his ministers also transform themselves into ministers of righteousness, whose end will be according to their works” (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L3-4,13-15">2 Cor. 11:3-4,13-15</a>)</p></blockquote><h2>Withdraw from Those Who Bring In a New Teaching Instead of the One Christ Left</h2><blockquote><p>“<strong>If anyone teaches otherwise</strong> and <strong>does not consent to wholesome words, even the words of our Lord Jesus Christ</strong>, and to the doctrine which accords with godliness, <strong>he</strong> is proud, <strong>knowing nothing</strong>, but is obsessed with disputes and arguments over words, from which come envy, strife, reviling, evil suspicions &lt;...&gt; <strong>From such <mark>withdraw</mark> yourself</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L3-5">1 Tim. 6:3-5</a>)</p></blockquote><blockquote><p>“O Timothy! <strong>Guard what was committed to your trust</strong>, <strong><mark>avoiding</mark></strong> the profane and idle babblings and contradictions of <strong>what is falsely called knowledge</strong> — by professing it some have strayed concerning the faith. Grace be with you. Amen” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L20-21">1 Tim. 6:20-21</a>)</p></blockquote><blockquote><p>“But we command you, brethren, in the name of our Lord Jesus Christ, that you <strong><mark>withdraw</mark> from every brother who walks</strong> disorderly and <strong>not according to the tradition which he received from us</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L6">2 Thess. 3:6</a>)</p></blockquote><blockquote><p>“Now I urge you, brethren, note those who cause divisions and offenses, <strong>contrary to the doctrine which you learned, and <mark>avoid</mark> them</strong>. For <strong>those who are such do not serve our Lord Jesus Christ</strong>, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18">Rom. 16:17-18</a>)</p></blockquote><blockquote><p>“<strong>If anyone</strong> comes to you and <strong>does not bring this doctrine, <mark>do not receive him into your house</mark></strong> nor greet him; for he who greets him shares in his evil deeds” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L10-11">2 John. 1:10-11</a>)</p></blockquote><blockquote><p>“But <strong>even if</strong> we, or <strong>an angel</strong> from heaven, <strong>preach any other gospel to you than what we have preached</strong> to you, <strong>let him be <mark>accursed</mark></strong> <em>(Greek: ἀνάθεμα — “anathema”)</em>. As we have said before, so now I say again, <strong>if anyone preaches any other gospel to you than what you have received, let him be <mark>accursed</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/1/#L8-9">Gal. 1:8-9</a>)</p></blockquote><p><strong>Anathema</strong> (Greek ἀνάθεμα) — excommunication from the Church.</p><h2>Expose Distortions of Tradition (Heresy)</h2><blockquote><p>“And have no fellowship with the unfruitful works of darkness, but rather <strong>expose</strong> them” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L11">Eph. 5:11</a>)</p></blockquote><blockquote><p>“holding fast the faithful word as he has been taught, that he may be able, by sound doctrine, both to exhort and <strong><mark>convict</mark></strong> those who contradict. For there are many insubordinate, both idle talkers and deceivers, especially those of the circumcision, whose <strong>mouths must be stopped</strong>, who subvert whole households, teaching things which they ought not, for the sake of dishonest gain” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L9-11">Titus. 1:9-11</a>)</p></blockquote><blockquote><p>“<strong>Fight to the death for truth</strong>, and the Lord God will fight for you” (<a href="https://bibleox.com/en/en-nrsv/prsir/4/#L28">Sir. 4:28</a>)</p></blockquote><blockquote><p>“Beloved, while I was very diligent to write to you concerning our common salvation, I found it necessary to write to you exhorting you <strong>to contend earnestly for the faith which was once for all delivered to the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude. 1:3</a>)</p></blockquote><h2>What the Spirit of Truth Will Guide Into</h2><p>Before the sending of the Holy Spirit and His descent upon the apostles, Christ promises that when the Holy Spirit is sent to the apostles, He will help them to remember and understand everything Christ had said:</p><blockquote><p>“But the Helper, the Holy Spirit, whom the Father will send in My name, He will teach you all things, and <strong><mark>bring to your remembrance all things that I said to you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L26">John. 14:26</a>)</p></blockquote><blockquote><p>“<strong>I still have many things to say to you, but you cannot bear them now</strong>. However, when He, <strong><mark>the Spirit of truth, has come, He will guide you into all truth</mark></strong>; for He will not speak on His own authority, but whatever He hears He will speak; and He will tell you things to come. He will glorify Me, for <strong><mark>He will take of what is Mine and declare it to you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L12-14">John. 16:12-14</a>)</p></blockquote>

  - src: церковь-вечность
    path: Ek9r_The_Church_Is_Eternal_and_Unbroken
    title: The Church Is Eternal and Unbroken
    meta_desc: Bible quotes about the invincibility (eternity) of the Church
    menu: { parent: Church, title: The Church — Eternal and Unbroken, priority: 3 }
    body: |-
      <h2>God Is Always with the Church</h2><p>The Holy Spirit is sent to the Church forever:</p><blockquote><p>“And I will pray the Father, and He will give you another Helper, that <strong>He may abide with you forever</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>)</p></blockquote><p>The Lord Jesus Christ promised to be with the Church always:</p><blockquote><p>“I am with you <strong>always, even to the end of the age</strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L20">Matt. 28:20</a>)</p></blockquote><h2>The Church Will Not Be Overcome</h2><p>The Lord pronounces a prophecy about the invincibility of the Church:</p><blockquote><p>“I will build My church, and <strong>the gates of Hades shall not prevail against it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L18">Matt. 16:18</a>)</p></blockquote><h2>The Truth Will Always Be in the Church</h2><p>The truth will be with the Church forever:</p><blockquote><p>“The Elder, to the elect lady and her children, whom I love in truth, and not only I, but also all those who have known the truth, because of <strong>the truth</strong> which abides in us and <strong>will be with us forever</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L1-2">2 John. 1:1-2</a>)</p></blockquote><h2>The Church Will Always Glorify God</h2><p>In the Church all, in all generations, will glorify God:</p><blockquote><p>“to Him be <strong>glory in the church</strong> by Christ Jesus <strong>to all generations</strong>, <strong>forever and ever</strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/ef/3/#L21">Eph. 3:21</a>)</p></blockquote><h2>The Eucharist Will Be Celebrated in the Church Until Christ Comes</h2><blockquote><p>“For as often as you eat this <strong>bread</strong> and drink this <strong>cup</strong>, you proclaim the Lord’s death <strong>till He comes</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L26">1 Cor. 11:26</a>)</p></blockquote>
