  path: The-heavenly-Church
  title: The heavenly Church
  title_sub: Quotes of the Holy Fathers on the life of the saints in heaven with Christ
  menu:
    parent: Church
    title: The heavenly Church
    priority: 3
  body: '<h2>1st century</h2><h3>Clement of Rome, hieromartyr († 101)</h3><blockquote><p>Through
    envy and jealousy, the greatest and most righteous pillars have been persecuted
    and put to death. Let us set before our eyes the illustrious apostles. <strong>Peter</strong>,
    through unrighteous envy, endured not one or two, but numerous labours and when
    he had at length suffered martyrdom, <strong><mark>departed to the place of glory
    due to him</mark></strong>. <strong>Paul</strong>, owing to envy, also obtained
    the reward of patient endurance, after being seven times thrown into captivity,
    compelled to flee, and stoned. After preaching both in the east and west, he gained
    the illustrious reputation due to his faith, having taught righteousness to the
    whole world, and come to the extreme limit of the west, and suffered martyrdom
    under the prefects. Thus <strong><mark>was he removed from the world, and went
    into the holy place</mark></strong>, having proved himself a striking example
    of patience. To these men who spent their lives in the practice of holiness, there
    is to be added <strong>a great multitude of the elect</strong>, who, having through
    envy endured many indignities and tortures, <strong>furnished us with a most excellent
    example</strong>. Through envy, those women, the Danaids and Dircae, being persecuted,
    <strong>after they had suffered terrible and unspeakable torments, finished the
    course of their faith with stedfastness, and though weak in body, <mark>received
    a noble reward</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-5">First
    Epistle to the Corinthians, ch. 5-6</a>)</p><blockquote><p>All the generations
    from Adam even unto this day have passed away; but <strong><mark>those who, through
    the grace of God, have been made perfect in love, now possess a place among the
    godly</mark></strong>, and shall be made manifest at the revelation of the kingdom
    of Christ.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-50">First
    Epistle to the Corinthians, ch. 50</a>)</p><h3>St Ignatius the God-bearer, bishop
    of Antioch, hieromartyr (c. 35–107)</h3><blockquote><p>“And let no one, of things
    visible or invisible, <strong><mark>envy me that I should attain to Jesus Christ</mark></strong>.”
    (<a href="https://bibleox.com/en/en/w/IgnAn_Rm#HH-5">To the Romans</a>)</p></blockquote><blockquote><p>“I
    wish to be God’s: do not give me over to the world. <strong><mark>Suffer me to
    obtain pure light: when I have gone thither, I shall indeed be a man of God</mark></strong>.
    Permit me to be an imitator of the passion of my God. <strong>If any one has Him
    within himself, let him consider what I desire</strong>, and let him have sympathy
    with me, as knowing how I am straitened.” (<a href="https://bibleox.com/en/en/w/IgnAn_Rm#HH-6">To
    the Romans</a>)</p></blockquote><blockquote><p>“If I am truly found to be one,
    I may also be called one, and only then can I be truly faithful, <strong>when
    the world shall no longer see me. Nothing visible is eternal. (“For the things
    which are seen are temporal, …but the things which are not seen are eternal”</strong>
    (2 Cor. 4:18).) <strong>Our God <mark>Jesus Christ appears in great glory when
    He is in the Father</mark></strong>” (To the Romans)</p></blockquote><blockquote><p>“<strong>though
    I am alive while I write to you, yet I am eager to die</strong>. My love has been
    crucified, and there is no fire in me desiring to be fed; but <strong>there is
    within me a water that liveth and speaketh, <mark>saying to me inwardly, Come
    to the Father</mark></strong>” (<a href="https://bibleox.com/en/en/w/IgnAn_Rm#HH-7">To
    the Romans</a>)</p></blockquote><blockquote><p>“It is good <strong><mark>to set
    from the world unto God, that I may rise again to Him</mark></strong>.” (<a href="https://bibleox.com/en/en/w/IgnAn_Rm#HH-2">To
    the Romans</a>)</p></blockquote><blockquote><p>“But <strong>if I attain to God</strong>,
    then by His mercy I shall be something” (To the Romans)</p></blockquote><blockquote><p>“…that
    through your prayers I may <strong>attain to God</strong>.” (<a href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-11">To
    the Smyrnaeans</a>)</p></blockquote><blockquote><p>“My bonds, which I carry about
    with me for the sake of Jesus Christ (<strong>praying that I may attain to God</strong>)”
    (<a href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-12">To the Trallians</a>)</p></blockquote><blockquote><p>“Be
    mindful of me in your prayers, that I may <strong>attain to God</strong>.” (<a
    href="https://bibleox.com/en/en/w/IgnAn_Mg#HH-14">To the Magnesians</a>)</p></blockquote><blockquote><p>“…if
    indeed <strong>by means of suffering I may attain to God</strong>.” (<a href="https://bibleox.com/en/en/w/IgnAn_Pol#HH-7">To
    Polycarp</a>)</p></blockquote><blockquote><p>“but it is difficult for me to <strong>attain
    to God</strong>, if ye spare me” (<a href="https://bibleox.com/en/en/w/IgnAn_Rm#HH-1">To
    the Romans</a>)</p></blockquote><blockquote><p>“Suffer me to become food for the
    wild beasts, through whose instrumentality it will be granted me to <strong>attain
    to God</strong>.” (<a href="https://bibleox.com/en/en/w/IgnAn_Rm#HH-4">To the
    Romans</a>)</p></blockquote><h2>2nd century</h2><h3>Polycarp of Smyrna, hieromartyr
    (69–155)</h3><blockquote><p>I exhort you all therefore to be obedient unto the
    word of righteousness and to practice all endurance, which also ye saw with your
    own eyes not only in the <strong>blessed Ignatius and Zosimus and Rufus, yea and
    in others also who came from among yourselves</strong>, as well as in <strong>Paul
    himself</strong> and <strong>the rest of the Apostles</strong>; being persuaded
    that <strong><mark>all these ran not in vain but in faith and righteousness, and
    that they are in their due place in the presence of the Lord</mark></strong>,
    with whom also they suffered.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Plk_Ph#HH-9">Epistle
    to the Philippians, ch. 9</a>)</p><h3>The community of Polycarp of Smyrna (2nd
    century)</h3><blockquote><p>“For he (Polycarp — tr.), having by his endurance
    overcome the unrighteous ruler in the conflict and so received the crown of immortality,
    <strong><mark>rejoices in company with the Apostles and all righteous men, and
    glorifies</mark></strong> the Almighty God and Father, and blesses our Lord Jesus
    Christ, the savior of our souls and helmsman of our bodies and shepherd of the
    universal Church which is throughout the world.</p><p>&lt;…&gt;</p><p>We bid you
    God speed, brethren, while you walk by the word of Jesus Christ which is according
    to the Gospel; with Whom be glory to God for the salvation of His holy elect;
    even as the blessed Polycarp suffered martyrdom, <strong><mark>in whose footsteps
    may it be our lot to be found in the kingdom of Jesus Christ</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-19">The encyclical
    epistle of the Church at Smyrna on the martyrdom of Polycarp</a>)</p><h3>St Justin
    the Philosopher, martyr (c. 100–165)</h3><blockquote><p><em>That which was said
    from the bush to Moses: </em><strong><em>“I am That I Am, the God of Abraham,
    and the God of Isaac, and the God of Jacob, and the God of thy fathers”, means
    that <mark>even after death they abide, and are the people of that same Christ</mark></em></strong><em>.</em></p></blockquote><p>(Apology
    1)</p><blockquote><p><em>And he said nothing else in answer to Lucius than this:
    “You also seem to me to be such an one.” And when Lucius answered, “Most certainly
    I am,” he again ordered him also to be led away. </em><strong><em>And he professed
    his thanks, knowing that he was delivered from such wicked rulers, and was <mark>going
    to the Father and King of the heavens</mark></em></strong><em> (πρὸς τὸν πατέρα
    καὶ βασιλέα τῶν οὐρανῶν πορεύεσθαι).</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_2#HH-2">Apology
    2</a>)</p><blockquote><p><em>The Elder: But at the same time </em><strong><em>I
    do not say, indeed, that all souls die</em></strong><em>; for that were truly
    a piece of good fortune to the evil. What then? </em><strong><em><mark>The souls
    of the pious remain in a better place, while those of the unjust and wicked are
    in a worse</mark></em></strong><em>, waiting for the time of judgment. Thus some
    which have </em><strong><em><mark>appeared worthy of God</mark></em></strong><em>
    never die; but others are punished so long as God wills them to exist and to be
    punished</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-5">Dialogue
    with Trypho, ch. 5</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p><em>Wherefore
    the Church does in every place, because of that love which she cherishes towards
    God, </em><strong><em><mark>send forward, throughout all time, a multitude of
    martyrs to the Father</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-33">Against
    Heresies, Book IV, ch. 33, 9</a>)</p><h3>Tertullian (c. 155–220)</h3><blockquote><p>Accordingly,
    we get ourselves laughed at for proclaiming that God will one day judge the world.
    For, like us, the poets and philosophers set up a judgment-seat in the realms
    below. And if we threaten Gehenna, which is a reservoir of secret fire under the
    earth for purposes of punishment, we have in the same way derision heaped on us.
    For so, too, they have their Pyriphlegethon, a river of flame in the regions of
    the dead. And if <strong><mark>we speak of Paradise, the place of heavenly bliss
    appointed to receive the spirits of the saints</mark></strong>, severed from the
    knowledge of this world by that fiery zone as by a sort of enclosure, the Elysian
    plains have taken possession of their faith. Whence is it, I pray you have all
    this, so like us, in the poets and philosophers? The reason simply is, that they
    have been taken from our religion. But if they are taken from our sacred things,
    as being of earlier date, then ours are the truer, and have higher claims upon
    belief, since even their imitations find faith among you</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-apology#HH-47">Apology, ch. 47</a>)</p><h2>3rd
    century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 201–258)</h3><blockquote><p>to
    set down only those things which God speaks, wherewith Christ exhorts His servants
    to martyrdom. Those divine precepts themselves must be supplied, as it were, for
    arms for the combatants. Let them be the incitements of the warlike trumpet; let
    them be the clarion-blast for the warriors. Let the ears be roused by them; let
    the minds be prepared by them; let the powers both of soul and body be strengthened
    to all endurance of suffering. Let us only who, by the Lord’s permission, have
    given the first baptism (of water — tr.) to believers, also prepare each one for
    the second (of martyrdom — tr.); urging and teaching that this is a baptism greater
    in grace, more lofty in power, more precious in honour—a baptism wherein angels
    baptize—a baptism in which God and His Christ exult—<strong>a baptism (of martyrdom
    — tr.) after which no one sins any more—a baptism which completes the increase
    of our faith—</strong> <strong><mark>a baptism which, as we withdraw from the
    world, immediately associates us with God.</mark></strong> In the baptism of water
    is received the remission of sins, in the baptism of blood the crown of virtues.
    This thing is to be embraced and desired, and to be asked for in all the entreaties
    of our petitions, that we who are God’s servants should be also His friends.</p><p>&lt;…&gt;</p><p>Nor
    <strong>do the rewards of the divine promise attend those alone who are reproached
    and slain</strong>; but if the passion itself be wanting to the faithful, while
    their faith has remained sound and unconquered, and having forsaken and contemned
    all his possessions, the Christian has shown that he is following Christ, even
    he also is honoured by Christ among the martyrs, as He Himself promises and says:
    “There is no man that leaveth house, or land, or parents, or brethren, or wife,
    or children, for the kingdom of God’s sake, but shall receive seven times as much
    in this present time, and in the world to come eternal life.” (Luke 18:29–30)
    In the Apocalypse also He says the same thing: “And I saw,” saith he, “the souls
    of them that were slain for the name of Jesus and the word of God.” And when he
    had placed those who were slain in the first place, he added, saying: “And whosoever
    had not worshipped the image of the beast, neither had received his mark upon
    their forehead or in their hand;” all these <strong><mark>he joins together, as
    seen by him at one time in the same place</mark></strong>, and says, “And they
    lived and reigned with Christ.” (Rev. 20:4–5) He says that <strong><mark>all live
    and reign with Christ</mark>, not only who have been slain</strong>; but even
    whosoever, standing in firmness of the faith and in the fear of God, have not
    worshipped the image of the beast, and have not consented to his deadly and sacrilegious
    edicts. That we receive more as the reward of our suffering than what we endure
    here in the suffering itself, the blessed Apostle Paul proves; who by the divine
    condescension, being caught up into the third heaven and into paradise, testifies
    that he heard unspeakable words, who boasts that he saw Jesus Christ by the faith
    of sight…</p><p>&lt;…&gt;</p><p>Who, then, does not with all his powers labour
    to attain to such a glory that he may become the friend of God, that he may <strong><mark>at
    once rejoice with Christ, that after earthly tortures and punishments he may receive
    divine rewards</mark></strong>? If to soldiers of this world it is glorious to
    return in triumph to their country when the foe is vanquished, how much more excellent
    and greater is the glory, when the devil is overcome, <strong><mark>to return
    in triumph to paradise, and to bring back victorious trophies to that place whence
    Adam was ejected as a sinner</mark></strong>, after casting down him who formerly
    had cast him down; to offer to God the most acceptable gift—an uncorrupted faith,
    and an unyielding virtue of mind, an illustrious praise of devotion; <strong>to
    accompany Him when He shall come to receive vengeance from His enemies, to stand
    at His side when He shall sit to judge, to become co-heir of Christ, to be made
    equal to the angels; with the patriarchs, with the apostles, with the prophets,
    to rejoice in the possession of the heavenly kingdom</strong>! Such thoughts as
    these, what persecution can conquer, what tortures can overcome? The brave and
    stedfast mind, founded in religious meditations, endures; and the spirit abides
    unmoved against all the terrors of the devil and the threats of the world, when
    it is strengthened by the sure and solid faith of things to come. In persecutions,
    <strong>earth is shut up, but <mark>heaven is opened</mark></strong>; Antichrist
    is threatening, but Christ is protecting; death is brought in, but immortality
    follows; the world is taken away from him that is slain, but paradise is set forth
    to him restored; the life of time is extinguished, but the life of eternity is
    realized. What a dignity it is, and what a security, to go gladly from hence,
    <strong><mark>to depart gloriously in the midst of afflictions and tribulations;
    in a moment to close the eyes with which men and the world are looked upon, and
    at once to open them to look upon God and Christ!</mark></strong> Of such a blessed
    departure how great is the swiftness! You shall be <strong><mark>suddenly taken
    away from earth, to be placed in the heavenly kingdoms.</mark></strong> It behoves
    us to embrace these things in our mind and consideration, to meditate on these
    things day and night.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-exhortation-to-martyrdom-addressed-to-fortunatus">An
    Exhortation to Martyrdom, Addressed to Fortunatus</a>)</p><blockquote><p>I ask
    that there stand together before your eyes also – the examples of the sufferings
    of the Lord, the sacrifices, the rewards and the torments prepared, and what difference
    there is between them, look upon these and upon those; and you could not confess
    (Christ) if you did not know how much you would injure yourself if you denied
    (Him). <strong>The martyrs rejoice in heaven, while the fire consumes the enemies
    of the truth – the paradise of God is adorned with confessors, while the gehenna
    filled with those who have denied burns with eternal fire</strong>.</p><p>&lt;…&gt;</p><p>Thus,
    since those who triumph gain the victory, rising above these misfortunes, that
    one is not the victor whom, in his triumphal procession, empty ambition exalted
    or the crowd extolled, but the one whom, <strong>for his ardent love of the things
    of heaven, <mark>the Lord has numbered with His kingdom</mark></strong>. Therefore,
    important and worthy of honour is that one thing only which delivers from death,
    which imparts life and <strong><mark>grants an eternal kingdom with the saints</mark></strong>.</p><p>&lt;…&gt;</p><p><strong><mark>Upon
    a brief confession</mark> (of the name of Christ) the misfortunes cease, joy begins,
    <mark>the kingdom opens</mark>, dominion is made ready, punishment is left behind,
    death is cast out, life comes, and the opposing weapons of the restless enemy
    are destroyed. If there is a sin, it perishes – if there is a transgression, it
    vanishes.</strong></p><p>&lt;…&gt;</p><p><strong><mark>Behold – at the suffering
    of each one rejoice the martyrs, called before from this life; rejoice the heralds
    of all good things – the angels; in like manner rejoice the elect; the Lord rejoices
    over His warrior, Christ rejoices over the witness of His name.</mark></strong></p><p>&lt;…&gt;</p><p>if
    you cling with all your soul to the example of the suffering of the Lord and to
    the whole testimony of Christ, you will not fear to shed your blood; before martyrdom
    all things must fall silent. <strong>The glory of martyrdom is beyond price</strong>,
    its greatness boundless, its victory bright, its dignity renowned, its title priceless,
    its triumph endless; for it is as though with the very blood of Christ that he
    is adorned who is glorified by his confession.</p><p>&lt;…&gt;</p><p>the glory
    of martyrdom belongs to the promises of the Lord, is given from above, is received
    only by His appointment, and can neither be grasped by the mind nor expressed
    by word or by all the power of eloquence; but it will depend wholly upon your
    good will, upon your love, if only you wish to remember my words when <strong>the
    Lord begins to glorify martyrdom in your person</strong>. As it were <strong><mark>in
    a tender bosom you will dwell in the holy altar (heaven), in that great and most
    glorious habitation, you will live for ever, you will reign there and triumph
    (</mark></strong><strong><mark><a href="https://bibleox.com/en/eng-nkjv/heb/12/#L23">Heb.
    12:23</a>)</mark></strong><strong><mark>.</mark></strong> O, blessed are you,
    whose sins are forgiven, if only you ever sinned, imitating the Lord! Blessed
    are you, who from the beginning of the world have been sealed with the blood of
    the Lord, clothed in the white garment of grace and adorned with the shining robe!
    I behold already in my mind the glorious, divine spectacle – I say, I behold already
    – how the valiant host of Christ begins to enjoy its glory. There will stand before
    His face the exulting multitude of victors, and all that numerous host, illumined
    as it were by the risen sun, will receive power. O, that I, unworthy, might be
    counted worthy to see all this in very deed! Yet the Lord can accomplish this,
    for He will likely not reject <strong>your intercession</strong>.</p></blockquote><p>(The
    book of the praise of martyrdom, to Moses, Maximus and the other confessors)</p><blockquote><p>It
    is for him to wish to remain long in the world whom the world delights, whom this
    life, flattering and deceiving, invites by the enticements of earthly pleasure.
    Again, since the world hates the Christian, why do you love that which hates you?
    and why do you not rather follow Christ, who both redeemed you and loves you?</p><p>&lt;…&gt;</p><p>We
    should consider, dearly beloved brethren—we should ever and anon reflect that
    we have renounced the world, and are in the meantime living here as guests and
    strangers. Let us greet the <strong>day which assigns each of us to his own home,
    which <mark>snatches us hence, and sets us free from the snares of the world,
    and restores us to paradise and the kingdom</mark></strong>. Who that has been
    placed in foreign lands would not hasten to return to his own country? Who that
    is hastening to return to his friends would not eagerly desire a prosperous gale,
    that he might the sooner embrace those dear to him? And <strong><mark>we regard
    paradise as our country—we already begin to consider the patriarchs as our parents:
    why do we not hasten and run, that we may behold our country, that we may greet
    our parents? There a great number of our dear ones is awaiting us, and a dense
    crowd of parents, brothers, children, is longing for us, already assured of their
    own safety, and still solicitous for our salvation.</mark></strong> To attain
    to their presence and their embrace, what a gladness both for them and for us
    in common! What a pleasure is there in the heavenly kingdom, without fear of death;
    and how lofty and perpetual a happiness with eternity of living! <strong><mark>There</mark></strong>
    the glorious company of <strong><mark>the apostles</mark></strong>; there the
    host of the rejoicing <strong><mark>prophets</mark></strong>; there the innumerable
    multitude of <strong><mark>martyrs</mark></strong>, crowned for the victory of
    their struggle and passion; there the triumphant <strong><mark>virgins</mark></strong>,
    who subdued the lust of the flesh and of the body by the strength of their continency;
    there are merciful men <strong><mark>rewarded</mark></strong>, who by feeding
    and helping the poor have done the works of righteousness—who, keeping the Lord’s
    precepts, have transferred their earthly patrimonies to the heavenly treasuries.
    To these, beloved brethren, let us hasten with an eager desire; let us crave quickly
    <strong><mark>to be with them, and quickly to come to Christ</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-on-the-mortality">On the Mortality</a>)</p><h2>4th
    century</h2><h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3><blockquote><p>And
    as the Lord, taking His body, ascended on high and sat down at the right hand
    of the Majesty in the heights, so <strong><mark>now</mark></strong> the believing
    and <strong><mark>souls worthy of God pass over and will pass over into His Kingdom</mark></strong>,
    since He begets them from above by His Spirit, as the Lord says: “He that believeth
    in Him that sent Me... has passed from death unto life” (John 5:24). For the true
    believers, even while (yet) abiding on earth, serve the Lord in the heavenly places
    above. And He, sitting on high on the throne of His majesty, comes down below,
    resting on the souls of the saints as on thrones. For <strong>they are members,
    and His body is the whole Church of the saints; and He is the Head of this Church</strong>.
    As one soul abides in the whole body and all the members of the body are governed
    by it, so all the saints live in the Spirit of the Godhead and are governed by
    Him. And each member lives in the Hypostasis (of the Spirit) and in the divine
    Soul.</p><p>&lt;…&gt;</p><p>(Only) in this manner (can Christians) be made perfect
    and fit for <strong><mark>the Kingdom of Heaven, soaring up (thither) and borne
    aloft on the wings of the Spirit</mark></strong>.</p><p>&lt;…&gt;</p><p>As the
    body of Christ, mingled with the Godhead, is God; as iron cast into the fire is
    fire, and no one can touch or approach it without fearing to be destroyed or consumed
    (only fire with fire and glowing coal with glowing coal can remain unharmed),
    – so <strong><mark>every soul purified by the fire of the Spirit and become (itself)
    fire and spirit can be together with the pure body of Christ</mark></strong>.
    But a soul not initiated into this Spirit cannot draw near to the Divine, just
    as it cannot fix its gaze on that Divine Radiance or <strong>live in Him</strong>.
    For <strong>every being exists and lives there where it was born</strong>. Water
    creatures live in the water, since there they were born; birds soaring in the
    sky live in the air and die in the air. Like them is the <strong>life <mark>of
    the soul</mark>: the lofty heights of the Godhead are the air (of the souls) that
    have the wings of the Spirit, <mark>for there they were born</mark></strong>.</p><p><strong>7</strong>.
    As a charioteer, taking the reins in his hands, rules his horses and guides them
    at his own discretion and will, so the Lord on high rules and guides the creatures
    of heaven and earth according to His own discretion. For <strong><mark>He sits
    at the right hand of the Majesty (of the Father)</mark></strong> and governs the
    earthly (world), abiding and <strong><mark>living together with all the saints</mark></strong>;
    He (abides) on high and He (dwells) below; He is God and He is Man; He is the
    Living One and He is the Dead One; He is the Lord of all and He is the Servant
    of all; He is the Lamb and He is the Sacrifice; He is the Bull offered in sacrifice
    and He is the High Priest (of the sacrifices); He is the one enduring the passions
    and He is the impassible; He is the Bridegroom and He is the Bride; He is the
    Bridal Chamber and He is the Marriage Bed; <strong><mark>He is Paradise</mark>
    and He is the Tree of Life; <mark>He is the City of Jerusalem</mark></strong>
    and He is the Temple and the Holy of Holies; He is the Sea and He is the Universe;
    He is the Food of souls and He is the One Who is fed by the salvation of these
    souls; He is the Living Bread and He is the Water of Life; He is the “true Vine”
    (John 15:1) and He is the Wine of Joy; He is the Pearl and He is the Treasury;
    He is the Net and He is the Warrior; He is the Breastplate (of the warrior) and
    He is the Victor; He is Circumcision and He is the Sabbath and the Law; <strong><mark>He
    is the Head of the Church of the saints</mark></strong> and He is the Mustard
    Seed (Matt. 13:31); He is the Vineyard and He is the Plough; He is Grace and He
    is Faith; He is the Marriage and He is the Wedding Garment; He is the Way and
    He is the Door; He is the “Sun of Righteousness” (Mal. 4:2) and <strong><mark>He
    is the Light of souls</mark></strong>; He is Life and <strong><mark>He is the
    Kingdom</mark></strong>; He is the Beginning and He is the End (Rev. 22:13); He
    is the One Who is above all, and He is the One Who has become all in all (1 Cor.
    15:27; Eph. 1:23, 4:6; Col. 3:11).</p></blockquote><p>(Spiritual homilies, Homily
    52. The ordering of the visible holy church is the image of the unseen and sanctified
    soul)</p><h3>St Epiphanius of Cyprus, bishop (c. 315–403)</h3><blockquote><p><em>Further,
    </em><strong><em>as </em>concerns the commemoration of the names of the departe<em>d,
    what can be more profitable than this, what more seasonable and more wonderful
    than the faith of living men, that <mark>those who have departed are alive and
    have not turned into non-existence, but exist and live with the Master</mark>,
    and that</em></strong><em> </em><strong><em>thus the pious teaching is handed
    down that there is hope for those who pray for their brethren, as for men gone
    on a journey</em></strong><em>. </em><strong><em>The prayer offered for them is
    profitable, though it does not blot out all faults, and it is profitable for this</em></strong><em>,
    that living in the world we often stumble both involuntarily and voluntarily,
    and in order that what is more perfect may be shown. </em><strong><em>We commemorate
    both the righteous and sinners — sinners, because we ask mercy for them from God</em></strong><em>,
    and the righteous, fathers, prophets, apostles, evangelists, martyrs, confessors,
    bishops and hermits and their whole order, so that, venerating the Lord Jesus
    Christ, we may separate Him from the order of men and pay Him homage, bearing
    in mind that the Lord is incomparable with any of men, even though each of men
    possessed countless deeds of righteousness.</em></p></blockquote><p>(Panarion,
    or the Medicine-chest, against Aerius, book 3, ch. 7)</p><h3>St Gregory of Nyssa,
    bishop (c. 331–394)</h3><p>In the church the bishop preaches a sermon. Here lie
    the relics of the saint; above them, an icon of the saint with the history of
    his martyrdom. There is talk of prayer to the saint and of his intercession for
    us.</p><blockquote><p>let us consider the present state of the saints, how beautiful
    and majestic it is. For <strong><mark>their soul, departed on high, abides in
    the place proper to it and, separated from the body, dwells together with those
    like it</mark></strong>; and the body, the honourable and undefiled organ, which
    in no wise impaired by its passions the incorruption of the soul that dwelt in
    it, is buried with great honour and reverence, is honourably laid in a sacred
    place, as it were some precious treasure kept until the time of the resurrection
    &lt;…&gt; If anyone is granted the happiness of being able to touch the very remains,
    how desirable this is, and what a gift of elevated prayer it is esteemed, they
    know who have experienced it and who were themselves animated by this desire.
    Those who behold them kiss them as the very body alive and blooming with life,
    bringing them close to the eyes, the lips, the ears, to all the senses; then,
    pouring out tears of reverence and heartfelt tenderness, <strong><mark>they offer
    the prayer of intercession</mark></strong>, as to the <strong><mark>martyr</mark></strong>
    himself seen whole before them, <strong><mark>beseeching him as the armour-bearer
    of God</mark></strong>, crying to him as to one who receives the gifts (of prayer)
    when he will. From all this know, pious people, that “precious in the sight of
    the Lord is the death of His saints” (Ps. 115:6). For one and the same is the
    body of all men, being composed of one and the same substance; but one dies a
    simple death and is cast down as it happens; another, graced with martyric suffering,
    is so highly honourable and desired by all, as we said above.</p><p>&lt;…&gt;</p><p>When,
    after many sufferings, (the martyr) appeared a man fully matured in confession
    and piety, the judicial sentence is pronounced over him and the command goes out
    to commit him to the fire; thus by the beautiful and blessed way he <strong><mark>departed
    to God</mark></strong>, and left to us an instructive memory of his contest, <strong>gathering
    the peoples, instructing the church, driving out demons, bringing down the peaceful
    angels, asking of God for us what is profitable, having made this place a clinic
    of divers diseases</strong>, a haven for those tossed by sorrows, an abundant
    treasury for the poor, a ready inn for travellers, <strong>a constant place of
    festival for those who keep the feasts</strong>. For, <strong>although we honour
    this day with annual festivals, yet the zeal of the multitude of those who hasten
    hither never ceases</strong>, but the road leading hither resembles a path strewn
    with ants; some go on before, others give place to those newly coming.</p><p>We,
    O blessed one, having by the mercy of the Creator completed the yearly round,
    <strong>have gathered for the celebration of thy feast the sacred assembly of
    those who love the martyrs</strong>, worshipping the common Master and <strong>keeping
    the victorious commemoration of thy contests</strong>. Do thou, the president
    of the feast (for to thee who hast called us we cry), draw near to us, <strong><mark>wherever
    thou mayst be — whether thou dwellest in the ethereal height or walkest about
    some heavenly vault, whether thou standest before the Master together with the
    ranks of the angels or, as a faithful servant, worshippest Him together with the
    Powers and Dominions</mark></strong>, – leaving the things above for a little
    time, <strong>come as an invisible friend to those who honour thee</strong>; look
    upon what is being done here, that thou mayest double thy thanksgiving to God,
    who for one suffering and for one pious confession hath rendered thee such rewards,
    and rejoice over (thy) blood and thy fiery torment; for as many then were the
    beholders of thy punishment, <strong>so many now are the ministers of thy honour</strong>.
    In many blessings have we need; <strong><mark>pray for the fatherland before the
    common King of all</mark></strong>; for the fatherland of a martyr is the land
    where he suffered, and his fellow-citizens and kinsfolk are those who buried him,
    in whose keeping is his body, who honour him. We foresee sorrows; we await dangers;
    the terrible Scythians, who were plotting war against us, are not far off; as
    a warrior <strong>fight for us, and as a martyr show (prayerful) boldness (towards
    God) for those who serve Him together with thee</strong>. Although thou hast passed
    from this life, yet <strong><mark>thou knowest the sufferings and needs of mankind</mark></strong>;
    ask peace for us, that these festivals may not cease, that the wild and unbridled
    barbarian may not rejoice over the temples and altars, that the defiler may not
    trample on the holy things. For we count <strong>even the fact that we have hitherto
    remained unharmed as thy good deed</strong>; we ask of thee safety also for the
    time to come. And if there should be need of greater intercession of prayer, <strong>gather
    the choir of thy brother martyrs and pray together with them all: may the prayers
    of many righteous loosen the sins of peoples and tribes</strong>. <strong>Remind
    of us Peter, awaken Paul, likewise also John the Theologian</strong> and the beloved
    disciple, <strong>that they may care for the churches</strong> which they founded,
    for which they bore chains, for which they faced dangers and death</p></blockquote><p>(Encomium
    on the great martyr Theodore)</p><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>Not yet have seven days passed since we celebrated
    the sacred solemnity of Pentecost, and lo, again the choir of martyrs has overtaken
    us — or rather the host and army of martyrs, in nothing inferior to the host of
    angels which the patriarch Jacob saw (Gen. 32:2), but like it and equal to it.
    Martyrs and angels are distinguished only by their names, but are joined in their
    deeds: <strong><mark>the angels dwell in heaven, and the martyrs also</mark></strong>;
    the former are not subject to old age and are immortal, and the martyrs will have
    the same. But those received a bodiless nature. What then? The martyrs too, though
    clothed in body, are immortal — or, better still, before immortality death for
    Christ adorns their bodies more than immortality.</p></blockquote><p>(In praise
    of the saints, 19)</p><h2>18th century</h2><h3>Epistle of the Patriarchs of the
    Orthodox Church (1723)</h3><blockquote><p><em>We </em><strong><em>believe</em></strong><em>
    that what is called, or rather is, the </em><strong><em>Holy Catholic and Apostolic
    Church, which containeth generally all the Faithful in Christ, who, that is to
    say, being still on their pilgrimage, have not yet reached their home in the Fatherland</em></strong><em>.
    But we do not in any wise confound this Church which is on its pilgrimage with
    that which is in the Fatherland, merely because, as some of the heretics say,
    the members of the two are sheep of God, the Chief Shepherd (cf. Ps. 94:7), and
    hallowed by the same Holy Spirit; for that </em><strong><em>[confounding of the
    heavenly and the earthly Church] is absurd</em></strong><em> and impossible, since
    the one is yet militant, and on its journey; and the other is triumphant, and
    settled in the Fatherland, and hath received the prize.</em></p><p><em>&lt;…&gt;</em></p><p><em>We
    believe </em><strong><em>to be members of the Catholic Church all the faithful,
    and only the faithful</em></strong><em> – that is, </em><strong><em>those who,
    forsooth, having received the blameless faith</em></strong><em> of the Saviour
    Christ, from Christ himself, and the Apostles, and the Holy Ecumenical Synods,
    </em><strong><em>adhere to the same without wavering, although some of them may
    be guilty of all manner of sins</em></strong><em>. For unless the Faithful, even
    when living in sin, were members of the Church, they could not be judged by the
    Church. But now being judged by her, and called to repentance, and guided into
    the way of her salutary precepts, </em><strong><em>though they may be still defiled
    with sins, for this only, that they have not fallen into despair, and that they
    cleave to the Catholic and Orthodox faith, they are, and are regarded as, members
    of the Catholic Church</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-10">Decrees
    10-11</a>)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>The
    Church consisting of angels, saints and all who have reposed in faith and repentance
    is called the Church “invisible”, “heavenly”, “triumphant” (Heb. 12:22–24), “the
    kingdom of glory”</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>'
