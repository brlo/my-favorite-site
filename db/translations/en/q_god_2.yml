# Переводы статей раздела «Цитаты» (ru/q) на английский: раздел «Бог», часть 2.
# Загрузка: bin/rails pages:import_translations FILE=db/translations/en/q_god_2.yml [PUBLISH=1] [DRY_RUN=1]
lang: en
list: en-q
pages:
  - src: Христос-титулы
    path: Ub5c_Titles_of_Christ
    title: Titles of Christ
    meta_desc: Bible quotes with the titles of Jesus Christ
    menu: { parent: God/Son, title: Titles of Christ, priority: 15 }
    body: |-
      <p>For Muslims it will be important that Holy Scripture applies to Christ many titles which Islam definitely allows to be attributed to God alone: Creator, Holy, King of Kings, the First, the Unchanging, the Mighty:</p><ul><li><p><strong>Creator</strong> (al-Khaliq, ٱلْخَـٰلِقُ) – <a href="https://bibleox.com/en/eng-nkjv/in/1/#L3,10">John. 1:3,10</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/1/#L1-2">Heb. 1:1-2</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/11/#L3">Heb. 11:3</a>; <a href="https://bibleox.com/en/en-nrsv/evr/1/#L8-12">Heb. 1:8-12</a>; <a href="https://bibleox.com/en/eng-nkjv/kol/1/#L13-17">Col. 1:13-17</a>;</p></li></ul><ul><li><p><strong>King of Kings</strong> (Malik al-Mulk, مالك الملك) – <a href="https://bibleox.com/en/eng-nkjv/otkr/17/#L14">Rev. 17:14</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/19/#L16">Rev. 19:16</a>;</p></li></ul><ul><li><p>The Dominant (al-Qahhar, ٱلْقَهَّـٰرُ) – <a href="https://bibleox.com/en/eng-nkjv/otkr/17/#L14">Rev. 17:14</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/19/#L16">Rev. 19:16</a>;</p></li></ul><ul><li><p><strong>Holy</strong> (al-Quddus, ٱلْقُدُّوسُ) – <a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L7">Rev. 3:7</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L10">6:10</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/7/#L26">Heb. 7:26</a>; <a href="https://bibleox.com/en/eng-nkjv/act/3/#L14">Act. 3:14</a>;</p></li></ul><ul><li><p>Meek (al-Halim, ٱلْحَلِيمُ) – <a href="https://bibleox.com/en/eng-nkjv/ier/11/#L19">Jer. 11:19</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/11/#L29">Matt. 11:29</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/21/#L5">Matt. 21:5</a>;</p></li></ul><ul><li><p>The Beginning, <strong>the First</strong> (al-Awwal, الأول) – <a href="https://bibleox.com/en/eng-nkjv/in/1/#L1-3">John. 1:1-3</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L11">Rev. 1:11</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L17">Rev. 1:17</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L8">Rev. 2:8</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L13">Rev. 22:13</a>;</p></li></ul><ul><li><p>The End, the Last (al-Akhir, الأخر) – <a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L11">Rev. 1:11</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L17">Rev. 1:17</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L8">Rev. 2:8</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L13">Rev. 22:13</a>;</p></li></ul><ul><li><p><strong>The Unchanging</strong> (as-Samad, الصمد) – <a href="https://bibleox.com/en/eng-nkjv/evr/13/#L8">Heb. 13:8</a>; <a href="https://bibleox.com/en/en-nrsv/evr/1/#L10-12">Heb. 1:10-12</a>;</p></li></ul><ul><li><p>The Living (al-Hayy, الحي) – <a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L18">Rev. 1:18</a>; <a href="https://bibleox.com/en/eng-nkjv/act/3/#L15">Act. 3:15</a>;</p></li></ul><ul><li><p>Savior (al-Muhaymin, ٱلْمُهَيْمِنُ) – <a href="https://bibleox.com/en/eng-nkjv/in/4/#L42">John. 4:42</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/1/#L47">Luke. 1:47</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/2/#L11">Luke. 2:11</a>; <a href="https://bibleox.com/en/eng-nkjv/act/5/#L31">Act. 5:31</a>; <a href="https://bibleox.com/en/eng-nkjv/act/13/#L23">Act. 13:23</a>; <a href="https://bibleox.com/en/eng-nkjv/ef/5/#L23">Eph. 5:23</a>; <a href="https://bibleox.com/en/eng-nkjv/fil/3/#L20">Phil. 3:20</a>; <a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L1">1 Tim. 1:1</a>; <a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L10">2 Tim. 1:10</a>; <a href="https://bibleox.com/en/eng-nkjv/tit/1/#L4">Titus. 1:4</a>; <a href="https://bibleox.com/en/eng-nkjv/tit/2/#L13">Titus. 2:13</a>; <a href="https://bibleox.com/en/eng-nkjv/tit/3/#L6">Titus. 3:6</a>; <a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L1">2 Pet. 1:1</a>; <a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L11">2 Pet. 1:11</a>; <a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L20">2 Pet. 2:20</a>; <a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L18">2 Pet. 3:18</a>; <a href="https://bibleox.com/en/eng-nkjv/1in/4/#L14">1 John. 4:14</a>;</p></li></ul><ul><li><p>Light (an-Nur, النور) – <a href="https://bibleox.com/en/eng-nkjv/in/1/#L9">John. 1:9</a>; <a href="https://bibleox.com/en/eng-nkjv/in/12/#L46">John. 12:46</a>; <a href="https://bibleox.com/en/eng-nkjv/in/12/#L35-36">John. 12:35-36</a>;</p></li></ul><ul><li><p>Heir (al-Warith, الوارث) – <a href="https://bibleox.com/en/eng-nkjv/evr/1/#L2">Heb. 1:2</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/21/#L38">Matt. 21:38</a>; <a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L1">2 Tim. 4:1</a>; <a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L11">2 Pet. 1:11</a>; <a href="https://bibleox.com/en/eng-nkjv/rim/8/#L17">Rom. 8:17</a>;</p></li></ul><ul><li><p>Truth (al-Haqq, الحق) – <a href="https://bibleox.com/en/eng-nkjv/in/14/#L6">John. 14:6</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L7">Rev. 3:7</a>;</p></li></ul><ul><li><p>The Opener (al-Fattah, ٱلْفَتَّاحُ) – <a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L7-8">Rev. 3:7-8</a>;</p></li></ul><ul><li><p>The Resurrector (al-Ba’ith, ٱلْبَاعِثُ) – <a href="https://bibleox.com/en/eng-nkjv/in/5/#L21">John. 5:21</a>; <a href="https://bibleox.com/en/eng-nkjv/in/6/#L54">John. 6:54</a>;</p></li></ul><ul><li><p><strong>The Mighty</strong> (al-Jabbar, ٱلْجَبَّارُ) – <a href="https://bibleox.com/en/eng-nkjv/evr/1/#L3">Heb. 1:3</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L8">Rev. 1:8</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/28/#L18">Matt. 28:18</a>.</p></li></ul>

  - src: Христос-не-архангел-Михаил
    path: Va9h_Christ_Is_Not_the_Archangel_Michael
    title: Christ Is Not the Archangel Michael
    meta_desc: A refutation of the teaching of the totalitarian sect of Jehovah’s Witnesses
    menu: { parent: God/Son, title: Christ Is Not the Archangel Michael, priority: 16 }
    body: |-
      <h2>Preface</h2><p>First it must be explained that this opinion (that Christ is the archangel Michael) exists in the totalitarian sect of “Jehovah’s Witnesses”. To support their teachings the Jehovah’s Witnesses created their own translation of Scripture with significant distortions (<a href="https://azbyka.ru/otechnik/sekty/rassuzhdaja-so-svideteljami-iegovy-pri-pomoshhi-pisanija/4_7"><em>expert reviews of the Jehovah’s Witnesses’ “New World Translation”</em></a>, in Russian). The Adventists also believe that the one who appears in the Old Testament as the archangel Michael is supposedly the Son of God, Jesus Christ.</p><h2>Two Meanings of the Word “Angel”</h2><p>In the Bible we find two senses of the word <em>angel</em>: a function and a nature.</p><p>The <strong>function</strong> of an angel is to be sent, because this ancient Greek word literally means exactly that: ἄγγελος [angelos] — messenger, herald; Hebrew ‏מלאך‏‎ — messenger.</p><p>The <strong>nature</strong> of an angel is a bodiless spirit. Angels are certain spiritual beings created by God who have no body (bodiless), or in other words, spirits. These spirits were created before man and endowed with freedom and reason. Some of them did not wish to live in obedience to God, fell away from Him, but are still called angels (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L41">Matt. 25:41</a>). That is, we have a nature independent of the kind of activity. Sent or not, still an angel. Such is the nature. Thus, a quite specific man born of a man is called an angel — the prophet John the Baptist (<a href="https://bibleox.com/en/eng-nkjv/mal/3/#L1">Mal. 3:1</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/11/#L10">Matt. 11:10</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/1/#L2">Mark. 1:2</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/7/#L27">Luke. 7:27</a>). In the same sense, in the same place, Christ Himself is called the Angel of the Covenant (<a href="https://bibleox.com/en/eng-nkjv/mal/3/#L1">Mal. 3:1</a>). <em>(English translations render the word as “messenger”: “I send My messenger”, “the Messenger of the covenant”; but the Greek text has ἄγγελος in both places: τὸν ἄγγελόν μου — “My angel”, ὁ ἄγγελος τῆς διαθήκης — “the Angel of the covenant”.)</em> That settles it. Now to the quotes.</p><h2>All Angels Are Ministering Spirits, but Christ Sits on the Throne</h2><p>The Apostle Paul calls the Son of God a being far superior to the angels (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L4">Heb. 1:4</a>), because God does not address the angels as He addresses His Son (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L5">Heb. 1:5</a>); all the angels will worship the Son of God (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L6">Heb. 1:6</a>); he points out the difference between God’s words about the angels and about the Son of God: the former are ministering beings, while the latter is the Ruler seated on the throne (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L7-8">Heb. 1:7-8</a> and <a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13">Heb. 1:13</a>); he points out that everything created is temporary, but the Son of God, who created everything, will never pass away (<a href="https://bibleox.com/en/en-nrsv/evr/1/#L10-12">Heb. 1:10-12</a>). Finally, it is said directly that all angels without exception are ministering spirits, but the Son sits on the throne with the Father:</p><blockquote><p>“But <strong>to which of the angels has He ever said: ‘Sit at My right hand</strong>, till I make Your enemies Your footstool’? Are they not <strong>all ministering spirits</strong> sent forth to minister for those who will inherit salvation?” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13-14">Heb. 1:13-14</a>)</p></blockquote><p>The Son is served, and the Son reigns with the Father.</p><h2>Mankind Will Bow Before God, but All Creation Will Bow Before Christ</h2><p>God says that it is before Him that every knee shall bow (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L11">Rom. 14:11</a>), and at the same time all creation will bow before Christ, not only people (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L10">Phil. 2:10</a>), including the angels (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L6">Heb. 1:6</a>).</p><h2>The World Is Subjected to Christ, Not to Angels</h2><blockquote><p>“For <strong>He has not put the world to come</strong>, of which we speak, <strong>in subjection to angels</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/2/#L5">Heb. 2:5</a>)</p></blockquote><p>And yet the world is subjected to Christ:</p><blockquote><p>“He has put all things under His feet” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L27">1 Cor. 15:27</a>)</p></blockquote><blockquote><p>“And He put all things under His feet, and gave Him to be head over all things to the church” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L22">Eph. 1:22</a>)</p></blockquote><blockquote><p>“You have put all things in subjection under his feet. For in that He put all in subjection under him, He left nothing that is not put under him” (<a href="https://bibleox.com/en/eng-nkjv/evr/2/#L8">Heb. 2:8</a>)</p></blockquote><h2>The Almighty, the King of Kings, the Lord of Lords</h2><p>So we have established that all angels are ministering spirits, while the Son of God, Jesus Christ, is called by the same names by which God is repeatedly called: the Almighty, the King of Kings, the Lord of Lords. The prophets call <strong>God</strong> the Lord of Lords (<a href="https://bibleox.com/en/eng-nkjv/ps/136/#L2-3">Ps. 136:2-3</a>). The apostles call <strong>God</strong> the Lord of Lords and the King of Kings (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L15-16">1 Tim. 6:15-16</a>). The apostles call <strong>Jesus Christ</strong> the Lord of Lords and the King of Kings (<a href="https://bibleox.com/en/eng-nkjv/otkr/17/#L14">Rev. 17:14</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/19/#L16">19:16</a>), and the Almighty (<a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L8">Rev. 1:8</a>). Over the King of Kings there is no other king. Over the Lord of Lords there is no other lord. Over the Almighty there is no one who would hold the Almighty, because He Himself holds everything by Himself. The archangel Michael is the commander of the angelic host. Christ is the commander of absolutely everything in the world, including the angels and the archangel Michael himself.</p><h2>God (Yahweh) Personally Sent the Prophets, and Christ Says That It Was He Who Sent Them</h2><p>It is important to say that Christ points out that He is the one who sent many prophets to Israel (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L34">Matt. 23:34</a>). And Scripture tells us that it was God personally (and not through angels) who spoke to the prophets and personally sent them to Israel (<a href="https://bibleox.com/en/eng-nkjv/ish/3/#L12">Ex. 3:12</a>; <a href="https://bibleox.com/en/eng-nkjv/mal/4/#L1,5">Mal. 4:1,5</a>; <a href="https://bibleox.com/en/eng-nkjv/sud/6/#L8">Judg. 6:8</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/25/#L15">2 Chr. 25:15</a>; <a href="https://bibleox.com/en/eng-nkjv/1ts/15/#L1">1 Sam. 15:1</a>; <a href="https://bibleox.com/en/eng-nkjv/2ts/12/#L1">2 Sam. 12:1</a>; <a href="https://bibleox.com/en/eng-nkjv/2ts/12/#L24-25">2 Sam. 12:24-25</a>; <a href="https://bibleox.com/en/en-nrsv/3ezd/1/#L32">2 Esd. 1:32</a>). That is, Christ is God, Yahweh. There were no intermediaries in God’s communication with the prophets.</p><h2>The Son of God, Begotten of the Father, Created the Angels</h2><p>Christ is the Creator of all things visible and invisible, including the angels (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L13-17">Col. 1:13-17</a>). That is, to be an angel, He would have had to create Himself as well.</p><h2>The Etymology of the Name “Michael”</h2><p>Michael is a Hebrew name; it comes from the Hebrew words ‏מי כמו אלוהים‏‎ (mi kmo elohim, shortened to “mi-ka-el”), literally “Who is like God”. That is, no one is equal to God, no one can be compared with Him. But Christ does not consider it robbery to be equal with God (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L6">Phil. 2:6</a>).</p><h2>The Old Covenant Was Given Through Angels, the New Was Preached by the Lord</h2><p>The Apostle Paul points out the difference between the Old and the New Covenant. The Old was given through angels (<a href="https://bibleox.com/en/eng-nkjv/evr/2/#L2">Heb. 2:2</a>), and the New was preached personally by the Lord Himself (<a href="https://bibleox.com/en/eng-nkjv/evr/2/#L3">Heb. 2:3</a>). That is, at the very least, not through angels.</p><h2>God, Having Become Man, Showed Himself to the Angels</h2><blockquote><p>“And without controversy great is the mystery of godliness: <strong>God was manifested in the flesh</strong>, justified in the Spirit, <strong>seen by angels</strong> <em>(Greek: ὤφθη ἀγγέλοις — “appeared to angels”)</em>, preached among the Gentiles, believed on in the world, received up in glory” (<a href="https://bibleox.com/en/eng-nkjv/1tim/3/#L16">1 Tim. 3:16</a>)</p></blockquote><p>No one has ever seen God (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>); He dwells in unapproachable light, and it is impossible for man to see God (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L16">1 Tim. 6:16</a>); but by being born a true man (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L14">John. 1:14</a>), God becomes visible to all in Christ. Man cannot see the inhabitants of the spiritual world (angels) with bodily eyes, yet Christ says that He saw Satan fall from heaven (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L18">Luke. 10:18</a>). Also, angels appear at various times in various places to various people, and Scripture attaches no significance whatsoever to this event (the very appearance of an angel); that is, it does not say something like: “he showed himself to the angels”. He appeared, and that is all.</p><h2>Angels Are Created, the Son of God Is Begotten. And Not Simply Begotten: No One Else Is Begotten of God the Father as the Only Begotten Son Is</h2><p>It is pointed out that the Son of God is not created but begotten of God, while everything that is created was created afterwards by the Son (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L15-16">Col. 1:15-16</a>). And the Son of God is the Only Begotten Son (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>), which means that no one else is a son to the Father in the way the Only Begotten Son is. We distinguish between the words “created” and “begotten”. One can create anything, but one can beget only one’s like, of the same nature: a fish begets a fish, a man begets a man, God begets God. Olive trees do not give birth to oranges.</p><h2>Conclusion</h2><p>Christ is not the archangel Michael, but God. And He is repeatedly called God directly. Scripture says so plainly: <a href="https://bibleox.com/en/en/w/8HYB_Christ_is_God/">https://bibleox.com/en/en/w/8HYB_Christ_is_God</a></p><blockquote><p>“<strong>Hear, O My people</strong>, and I will speak, O Israel, and I will testify against you; <strong>I am God, your God!</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/50/#L7">Ps. 50:7</a>)</p></blockquote>

  - src: Христос-жизнь-в-Палестине
    path: Qc1j_Christ_Life_in_Palestine
    title: Christ — Life in Palestine
    meta_desc: Bible quotes about the life of Jesus Christ in Palestine
    menu: { parent: God/Son, title: Christ — Life in Palestine, priority: 17 }
    references: |-
      <p><em>* This article is important as a refutation of the idea that Christ went somewhere far away, to India, and learned wisdom there.</em></p>
    body: |-
      <h2>Jesus Christ Is Born in Bethlehem</h2><blockquote><p>“Now after Jesus <strong>was born in Bethlehem of Judea</strong> in the days of Herod the king” (<a href="https://bibleox.com/en/eng-nkjv/mf/2/#L1">Matt. 2:1</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/2/#L4-7">Luke. 2:4-7</a>)</p></blockquote><p><em>In accordance with the prophecy: </em><a href="https://bibleox.com/en/eng-nkjv/mf/2/#L5"><em>Matt. 2:5</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/in/7/#L42"><em>John. 7:42</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/mih/5/#L2"><em>Mic. 5:2</em></a><em>.</em></p><h2>The Flight into Egypt</h2><p>After His birth, Joseph and the Virgin Mary take the infant Jesus to Egypt for several years, hiding Him from the persecution of King Herod (<a href="https://bibleox.com/en/eng-nkjv/mf/2/#L16">Matt. 2:16</a>):</p><blockquote><p>“When he arose, he took the young Child and His mother by night and <strong>departed for Egypt, and was there until the death of Herod</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/2/#L14-15">Matt. 2:14-15</a>)</p></blockquote><p><em>In accordance with the prophecy: </em><a href="https://bibleox.com/en/eng-nkjv/mf/2/#L15"><em>Matt. 2:15</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/os/11/#L1"><em>Hos. 11:1</em></a><em>.</em></p><h2>The Return to Nazareth</h2><p>And then they return to Joseph’s home (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L4">Luke. 2:4</a>) in Nazareth:</p><blockquote><p>“saying, ‘Arise, take the young Child and His mother, and go to the land of Israel, for those who sought the young Child’s life are dead.’ Then he arose, <strong>took the young Child and His mother, and came into the land of Israel</strong> &lt;...&gt; he turned aside <strong>into the region of Galilee</strong>. And he came and dwelt in a city called <strong>Nazareth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/2/#L20-23">Matt. 2:20-23</a>)</p></blockquote><p><em>In accordance with the prophecy: </em><a href="https://bibleox.com/en/eng-nkjv/mf/2/#L23"><em>Matt. 2:23</em></a><em>, possibly: </em><a href="https://bibleox.com/en/eng-nkjv/sud/13/#L5"><em>Judg. 13:5</em></a><em>.</em></p><h2>Yearly Visits to Jerusalem</h2><p>Every year Jesus Christ went to the temple in Jerusalem with His parents, relatives and acquaintances (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L43-44">Luke. 2:43-44</a>):</p><blockquote><p>“<strong>His parents went to Jerusalem every year</strong> at the Feast of the Passover. And when He was twelve years old, <strong>they went up to Jerusalem according to the custom</strong> of the feast” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L41-42">Luke. 2:41-42</a>)</p></blockquote><p>By the age of 12 the boy Jesus already possessed great wisdom, which amazed the teachers in the Jerusalem temple:</p><blockquote><p>“His parents went to Jerusalem every year at the Feast of the Passover. And <strong>when He was twelve years old</strong>, they went up to Jerusalem according to the custom of the feast &lt;...&gt; Now so it was that after three days they found Him <strong>in the temple, sitting in the midst of the teachers, both listening to them and asking them questions. And all who heard Him were astonished at His understanding and answers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L41-42,46-47">Luke. 2:41-42,46-47</a>)</p></blockquote><p>After the age of 12 Christ also lived in Nazareth, in obedience to His parents:</p><blockquote><p>“Then He went down with them and <strong>came to Nazareth, and was subject to them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L51">Luke. 2:51</a>)</p></blockquote><h2>The Move from Nazareth to Capernaum: the Beginning of the Preaching</h2><p>Only on reaching the age of 30, after His baptism by the prophet John, does Christ leave Nazareth and move to Capernaum to begin His preaching:</p><blockquote><p>“Now when Jesus heard that John had been put in prison, He departed to Galilee. And <strong>leaving Nazareth, He came and dwelt in Capernaum</strong>, which is by the sea, in the regions of Zebulun and Naphtali” (<a href="https://bibleox.com/en/eng-nkjv/mf/4/#L12-13">Matt. 4:12-13</a>)</p></blockquote><p><em>In accordance with the prophecy: </em><a href="https://bibleox.com/en/eng-nkjv/mf/4/#L14-16"><em>Matt. 4:14-16</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/is/9/#L1-2"><em>Is. 9:1-2</em></a></p><h2>Important Details</h2><h3>The Galileans Know Jesus Well as the Son of a Carpenter</h3><p>During His preaching in Galilee, the people know Jesus Christ well as an ordinary carpenter, the son of a carpenter:</p><blockquote><p>“<strong>Is this not the carpenter</strong>, the Son of Mary, and brother of James, Joses, Judas, and Simon? And are not His sisters here with us? So they were offended at Him” (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L3">Mark. 6:3</a>)</p></blockquote><blockquote><p>“<strong>Is this not the carpenter’s son?</strong> Is not His mother called Mary? And His brothers James, Joses, Simon, and Judas?” (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L55">Matt. 13:55</a>)</p></blockquote><h3>Regular Visits to the Temple to Keep the Law</h3><p>To keep the Law, Christ had to visit the temple in Jerusalem 3 times a year:</p><blockquote><p>“<strong>Three times in the year all your males</strong> shall appear before the Lord GOD” (<a href="https://bibleox.com/en/eng-nkjv/ish/23/#L17">Ex. 23:17</a>)</p></blockquote><blockquote><p>“<strong>Three times in the year all your males</strong> shall appear before the LORD God, the God of Israel” (<a href="https://bibleox.com/en/en-nrsv/ish/34/#L23">Ex. 34:23</a>)</p></blockquote><blockquote><p>“<strong>Three times a year all your males</strong> shall appear before the LORD your God in the place which He chooses: <strong>at the Feast of Unleavened Bread, at the Feast of Weeks, and at the Feast of Tabernacles</strong>; and they shall not appear before the LORD empty-handed” (<a href="https://bibleox.com/en/eng-nkjv/vtor/16/#L16">Deut. 16:16</a>)</p></blockquote><h3>Christ Fulfilled the Law</h3><blockquote><p>“Do not think that I came to destroy the <strong>Law</strong> or the Prophets. <strong>I did not come to destroy but to fulfill</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L17">Matt. 5:17</a>)</p></blockquote><blockquote><p>“But Jesus answered and said to him, ‘Permit it to be so now, for thus <strong>it is fitting for us to fulfill all righteousness</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/3/#L15">Matt. 3:15</a>)</p></blockquote><blockquote><p>“<strong>The Son of Man indeed goes just as it is written of Him</strong>, but woe to that man by whom the Son of Man is betrayed! It would have been good for that man if he had not been born” (<a href="https://bibleox.com/en/eng-nkjv/mf/26/#L24">Matt. 26:24</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/14/#L21">Mark. 14:21</a>)</p></blockquote><blockquote><p>“Then He said to them, ‘These are the words which I spoke to you while I was still with you, that <strong>all things must be fulfilled which were written in the Law of Moses</strong> and the <strong>Prophets</strong> and the <strong>Psalms</strong> concerning Me’” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L44">Luke. 24:44</a>)</p></blockquote><blockquote><p>“But when the fullness of the time had come, God sent forth His Son, <strong>born of a woman, born under the law</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L4">Gal. 4:4</a>)</p></blockquote><h3>Waiting for Full Age to Preach</h3><p>Christ refrained from preaching and miracles until the age of 30, because public ministry began at 30 by divine ordinance and established tradition (<a href="https://bibleox.com/en/eng-nkjv/chis/4/#L3">Num. 4:3</a>). Therefore Christ, who came not to destroy the law but to fulfill it (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L17">Matt. 5:17</a>), waited until 30 and then went out to preach:</p><blockquote><p>“Now Jesus Himself <strong>began His ministry at about thirty years of age</strong>, being (as was supposed) the son of Joseph, the son of Heli” (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L23">Luke. 3:23</a>)</p></blockquote><p>Christ waited for His time to come:</p><blockquote><p>“Jesus said to her, ‘Woman, what does your concern have to do with Me? <strong>My hour has not yet come</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/2/#L4">John. 2:4</a>)</p></blockquote><blockquote><p>“Therefore they sought to take Him; but no one laid a hand on Him, because <strong>His hour had not yet come</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L30">John. 7:30</a>)</p></blockquote><blockquote><p>“These words Jesus spoke in the treasury, as He taught in the temple; and no one laid hands on Him, for <strong>His hour had not yet come</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/8/#L20">John. 8:20</a>)</p></blockquote><blockquote><p>“Then Jesus said to them, ‘<strong>My time has not yet come</strong>, but your time is always ready’” (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L6">John. 7:6</a>)</p></blockquote><blockquote><p>“You go up to this feast. I am not yet going up to this feast, for <strong>My time has not yet fully come</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L8">John. 7:8</a>)</p></blockquote><blockquote><p>“But I have a baptism to be baptized with, and <strong>how distressed I am till it is accomplished!</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L50">Luke. 12:50</a>)</p></blockquote><blockquote><p>“Jesus spoke these words, lifted up His eyes to heaven, and said: ‘<strong>Father, the hour has come</strong>. Glorify Your Son, that Your Son also may glorify You’” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L1">John. 17:1</a>)</p></blockquote>

