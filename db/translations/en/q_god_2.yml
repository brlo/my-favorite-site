      <h2>May One Pray to Jesus Christ?</h2><p>Of course one may. But we have this commandment not from Scripture, but from Tradition.</p><h2>Can One Assert on the Basis of Scripture Alone That We Must Pray to Jesus Christ?</h2><p>In the Bible there is no commandment to pray to Jesus Christ. However, there are certain signs in <a href="https://bibleox.com/en/gr-lxx-byz/in/14/#L14">John. 14:14</a> (see the Greek text: ἐάν τι αἰτήσητέ με — “if you ask <strong>Me</strong> anything”; the NRSV renders it this way: “<a href="https://bibleox.com/en/en-nrsv/in/14/#L14">If in my name you ask me for anything</a>”).</p><p>Jesus Christ prayed to the Father (<a href="https://bibleox.com/en/eng-nkjv/mk/14/#L36">Mark. 14:36</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/22/#L42">Luke. 22:42</a>) and gave the prayer “Our Father” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L9">Matt. 6:9</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/11/#L2">Luke. 11:2</a>), that is, He taught to pray to the Father.</p><p>Those who build their faith without Tradition, on Scripture alone (on their own understanding of Scripture, of course), cannot bring themselves to deny prayer to Jesus Christ. So they say that the practice of praying to Jesus Christ exists, and therefore one may pray to Him. However, they often have difficulty even in showing the practice, because it is very rare, but of course it exists. For example:</p><blockquote><p>“While they were stoning Stephen, he <strong>prayed</strong> (ἐπικαλούμενον), ‘<strong>Lord Jesus</strong>, receive my spirit’” (<a href="https://bibleox.com/en/en-nrsv/act/7/#L59">Act. 7:59</a>)</p></blockquote><h2>Criticism</h2><h3>“Ask in My Name”</h3><p>Protestants object, pointing out that the commandment is in this verse:</p><blockquote><p>“If you ask anything <strong>in My name</strong>, I will do it” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L14">John. 14:14</a>)</p></blockquote><p>However, in the same farewell discourse the Lord Jesus Christ teaches to ask the Father:</p><blockquote><p>“And in that day you will ask Me nothing. Most assuredly, I say to you, whatever you <strong><mark>ask the Father</mark></strong> in My name He will give you” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L23">John. 16:23</a>)</p></blockquote>

  - src: f18sRKqQ_Возражения_против_филиокве
    path: Fx3n_Objections_to_the_Filioque
    title: Objections to the “Filioque”
    menu: { parent: God/Holy Spirit, title: Objections to the “Filioque”, priority: 100 }
    references: |-
      <ol><li><p>Justin Martyr writes about this, for example, in the 2nd century:</p><blockquote><p>But to the Father of all, who is unbegotten, <strong>there is no name given</strong>. For by whatever name He be called, He has as His elder the person who gives Him the name. But these words, Father, and God, and Creator, and Lord, and Master, are not names, but appellations derived from His good deeds and functions.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_2/">Apology 2</a>, ch. 6)</p></li></ol>
    body: |-
      <h2>Filioque — the Term</h2><p>The “Filioque” is the teaching of the Catholic Church that the Holy Spirit proceeds not only from the Father, but “and from the Son” (Latin “Filioque”).</p><p>A thorough video refutation of the filioque by priest George Maximov (in Russian): <a href="https://rutube.ru/video/c1878056726d0e041ba83802090cf308/">Rutube</a>, <a href="https://youtu.be/xuOSiS8zCO4">YouTube</a>.</p><h2>The Holy Spirit Proceeds from the Father</h2><p>We do not know the nature of God, but the Son of God, Jesus Christ, knows:</p><blockquote><p>“All things have been delivered to Me by My Father, and no one knows the Son except the Father. Nor does anyone know the Father except the Son, <strong>and the one to whom the Son wills to reveal Him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L27">Matt. 11:27</a>)</p></blockquote><p>He gave the divine Revelation to the apostles:</p><blockquote><p>“No longer do I call you servants, for a servant does not know what his master is doing; but I have called you friends, for <strong>all things that I heard from My Father I have made known to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L15">John. 15:15</a>)</p></blockquote><p>The Son of God said that the Holy Spirit proceeds from the Father:</p><blockquote><p>“But when the Helper comes, whom I shall send to you <strong>from the Father</strong>, the Spirit of truth <strong>who <mark>proceeds from the Father</mark></strong>, He will testify of Me” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L26">John. 15:26</a>)</p></blockquote><p>Father, Son, Holy Spirit are not names. God has no proper name. A name is given by one who is higher. There is no one higher than God[1].</p><p>The words Father, Son and Holy Spirit are only pointers to the relations of these divine persons to one another.</p><ul><li><p><strong>The Father</strong> <strong>begets</strong>, therefore He is the father. But He is not begotten, therefore He is not the son. He does not proceed, therefore He is not the Holy Spirit.</p></li><li><p><strong>The Son</strong> <strong>is begotten</strong>, therefore He is the son. But He does not beget, therefore He is not the father. Nor does He proceed, therefore He is not the Holy Spirit.</p></li><li><p><strong>The Holy</strong> <strong>Spirit</strong> is neither begotten nor begets, therefore He is neither the father nor the son. He proceeds, therefore He is the Holy Spirit.</p></li></ul><p>Each person has only one distinction (hypostatic property) by which we can distinguish them from one another. These words (Father, Son and Holy Spirit) allow us to point to these properties.</p><hr><p>The action of God that we observe in this world is not the very nature of God, but only His <strong>actions (energies)</strong>, what we also call grace.</p><p>Only the Father is the cause of all. He alone is the cause of the being of the Son and the cause of the being of the Holy Spirit. Only one cause, not two and not three.</p><p>At the same time, the Father is equal to the Son and the Holy Spirit in everything, and differs only by being <strong>unbegotten</strong>.</p><p>The Son differs from the Father and the Holy Spirit only by <strong>being begotten</strong>.</p><p>Likewise, the Holy Spirit differs from the Father and the Son only by <strong>procession</strong>.</p><p>These are called <strong>hypostatic properties</strong>. And the natural properties of all of them are one and the same, for the nature is one. God is one, and the hypostases are three. And each hypostasis has <strong>one</strong> distinction from the others.</p><h2>Objections of the Supporters of the “Filioque”</h2><h3>“I and My Father Are One”</h3><p>As proof of the Catholic teaching on the procession of the Holy Spirit not only from the Father but also from the Son, the following quote is given:</p><blockquote><p>“I and My Father are one” (<a href="https://bibleox.com/en/eng-nkjv/in/10/#L30">John. 10:30</a>)</p></blockquote><p>And also similar phrases:</p><blockquote><p>“However, when He, <strong>the Spirit of truth</strong>, has come, He will guide you into all truth; for He will not speak on His own authority, but whatever He hears He will speak; and He will tell you things to come. He will glorify Me, for <strong>He will take of what is Mine</strong> and declare it to you” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L13-14">John. 16:13-14</a>)</p></blockquote><blockquote><p>“<strong>All things that the Father has are Mine</strong>. Therefore I said that He will take of Mine and declare it to you” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L15">John. 16:15</a>)</p></blockquote><p>But if from the phrase “I and My Father are one” it follows that the Holy Spirit proceeds “and from the Son”, then it also means that the Holy Spirit proceeds from Himself, that is, supposedly the Holy Spirit proceeds from the Holy Spirit, for not only the Father and the Son are “one”, but the Holy Spirit too is “one” with them. The Holy Spirit also has everything the Father and the Son have.</p><p>The proposed argument could be logically admissible only if the Holy Spirit were not God, but merely some radiance, some feeling of love and nothing more, but not God. However, in that case it would already be another great error, one that rejects the divinity of the Holy Spirit.</p><p>Following the proposed argument, one would have to admit:</p><ul><li><p>either that “one” is only the Father and the Son, while the Holy Spirit is something else (a feeling of love, a radiance and nothing more);</p></li><li><p>or that the Holy Spirit proceeds from the Father, and from the Son, and... from the Holy Spirit.</p></li></ul><p>If one consistently accepts the claim that the Holy Spirit proceeds also from the Holy Spirit, then many other absurd conclusions follow, for example, that the Son is begotten not only by the Father (who is called the Father precisely for this reason), but that everyone begets the Son, including the Son Himself begetting Himself. But the Son is called the son because He is begotten, and the Father is called the father because He begets; likewise the Spirit is called the Spirit because He proceeds.</p><p>If the supporters of the “filioque” are not ready to admit that the Holy Spirit proceeds from Himself, they should admit that this quote speaks of something else and is not suitable for defending the “filioque”. Let us look at this expression more closely.</p><h3>“He Will Take of What Is Mine”</h3><blockquote><p>“He will glorify Me, for <strong>He will take of what is Mine</strong> and <strong><mark>declare</mark></strong> it to you. All things that the Father has are Mine. Therefore I said that <strong>He will take of Mine</strong> and <strong><mark>declare</mark></strong> it to you” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L14-15">John. 16:14-15</a>)</p></blockquote><p>It speaks of what the Holy Spirit will <strong>declare</strong>: that He will not contradict Christ. In God there is one knowledge and will. The Son of God warns the disciples that the Holy Spirit will not give some other teaching, for He too will speak from God. After Christ, Montanus appeared and presented himself as the incarnation of the Holy Spirit, teaching his own teaching and not the teaching of Christ. The prominent Christian theologian Tertullian was carried away by the teaching of Montanus.</p><h3>The Son of God Sends the Holy Spirit by Breathing</h3><p>Appearing to the apostles, Christ breathes on the apostles and offers them to receive the Holy Spirit:</p><blockquote><p>“So Jesus said to them again, ‘Peace to you! As the Father has sent Me, I also send you.’ And when He had said this, <strong>He breathed on them, and said to them, ‘Receive the Holy Spirit’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L21-22">John. 20:21-22</a>)</p></blockquote><p>This quote does not mean that the Son is the source of the Holy Spirit, but that the Holy Spirit is sent in time (in our earthly history of the Church, of the economy of salvation) from the Father by the Son. That is, previously He had not been sent (but of course He always had being, proceeding from the Father), and now in time He is sent from the Father to the Church, as Christ Himself says a few chapters earlier:</p><blockquote><p>“But when the Helper comes, whom <strong><mark>I shall send</mark> to you <mark>from the Father</mark>, the Spirit of truth</strong> who <strong><mark>proceeds from the Father</mark></strong>, He will testify of Me” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L26">John. 15:26</a>)</p></blockquote><p>The Son of God says that He Himself will send the Holy Spirit, but will send Him from the Father, because the Holy Spirit proceeds from the Father; that is, only the Father is the cause of the procession of the Holy Spirit, and not the Son.</p><h2>Background</h2><p>The Church from the beginning and always taught that the Holy Spirit proceeds precisely from the Father (<a href="https://bibleox.com/ru/ru/w/cLrG_%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D0%A4%D0%B8%D0%BB%D0%B8%D0%BE%D0%BA%D0%B2%D0%B5_Filioque/">quotes</a>, in Russian).</p><p>In the 8th century in the West there arises the idea of the procession of the Holy Spirit additionally “and from the Son”. There, too, this idea is condemned in 791 by Patriarch Paulinus of Aquileia.</p><p>In the 11th century one of the communities breaks away from the Orthodox Church because of the distortion of the faith and of views on the structure of the Church — the Roman one (today the Roman Catholic Church).</p><p>In Rome, under the political pressure of the Frankish king Charlemagne, they changed the doctrine:</p><ol><li><p>They single-handedly changed the “Creed” adopted at the Ecumenical Councils, which the Ecumenical Councils forbade to change (<a href="https://bibleox.com/en/en/w/councils-the-third-ecumenical-council-the-council-of-ephesus-431/">Third Ecumenical Council, Canon 7</a>);</p></li><li><p>They added to it what the Church had never taught: the filioque (the procession of the Holy Spirit not only from the Father but also from the Son);</p></li><li><p>They affirmed and demanded that the whole Church accept the infallible headship of the pope over the whole Church, which had never existed and which clearly contradicts Holy Scripture (the head is Christ, <a href="https://bibleox.com/en/eng-nkjv/ef/1/#L22">Eph. 1:22</a>). Even historically the pope was never the head of the Church, and not a single Ecumenical Council took place in Rome. Christ Himself forbade the apostles to seek who was the greatest, stopping their disputes about it (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L34">Mark. 9:34</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/20/#L25-28">Matt. 20:25-28</a>).</p></li></ol><p>To be able to assess this large-scale historical event, it is extremely important to understand the <strong>political situation in Italy</strong>.</p><p><strong>From the 5th century</strong> Rome suffers from very serious barbarian raids, and the papal see is regularly in an extremely shaky position. Byzantium had less and less opportunity to pay attention to its western front, concentrating on other directions. Thus the pope in Rome over time de facto came to represent not only religious but also state power.</p><p><strong>At the turn of the 8th–9th centuries</strong>, to save their position, the popes make a sharp political turn away from the Byzantine emperor towards the Frankish king Charlemagne (c. 748–814).</p><p><strong>In 800</strong> Pope Leo III proclaims, crowns and recognizes Charles as the heir of the Holy Roman Empire.</p><p>To justify the claim that the pope had such powers at all, several forged documents were produced:</p><ul><li><p><strong>The Donation of Constantine</strong> – <a href="https://en.wikipedia.org/wiki/Donation_of_Constantine">https://en.wikipedia.org/wiki/Donation_of_Constantine</a></p></li><li><p><strong>The Pseudo-Isidorean Decretals</strong> – <a href="https://en.wikipedia.org/wiki/Pseudo-Isidorean_Decretals">https://en.wikipedia.org/wiki/Pseudo-Isidorean_Decretals</a></p></li></ul><p>This step created a situation that required further steps from the popes.</p><p>Constantinople was the center of the empire not only because the emperor was there, but also because, on the initiative of Constantinople, the Ecumenical Councils took place in Constantinople itself or in its vicinity.</p><p>The desire to become the center of the empire again (not only political but also religious) required Rome to seize the initiative of the Councils and the establishment of theology. But Councils took place only because of large-scale heresies, and at that time there were none. Therefore in the West they took out of the “old Spanish chest” the <strong>7th–8th century teaching of the filioque</strong>, pushed it through politically, officially including it in the “Creed”, and also arbitrarily proclaimed the pope’s total headship in the Church, with the subsequent demand that the whole Church recognize all these maneuvers.</p><p>It is important to note that this addition to the Creed had already been condemned in the West before (in 791 by Patriarch Paulinus of Aquileia), and Pope Leo III himself, who crowned the king of the Franks, refused to recognize the addition of the filioque to the “Creed”.</p><p>Nevertheless, despite the resistance, by the end of the 9th century the “Filioque” had been successfully adopted in Rome, which resulted first in the “Photian schism”, and later in the conflict of 1054 in Constantinople.</p><p>From these events it follows that the revived Spanish teaching of the <strong>“filioque” served only as a pretext</strong> for establishing power over the Church. The Filioque was not an end in itself. It was revived for very specific purposes.</p><p><strong>A precedent was needed</strong>: that the pope, without any Ecumenical Councils, is able single-handedly to proclaim doctrinal truths and to demand that the whole Church accept his “infallible” innovations.</p><p>This claim of the pope to power, having neither theological nor historical grounds, was categorically rejected by all the other local churches.</p>
