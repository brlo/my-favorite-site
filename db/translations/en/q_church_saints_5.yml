      <h2>Preliminary General Questions</h2><p>This article proceeds from the fact that <strong>Christ is God </strong>(<a href="https://bibleox.com/ru/ru/w/%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%91%D0%BE%D0%B3">quotes</a>).</p><p>The Virgin Mary is venerated on the basis of the teaching on the veneration of the saints, so first of all it is worth proving the <a href="https://bibleox.com/en/en/w/Vs4n_Veneration_of_the_Saints/">Veneration of the Saints</a> and <a href="https://bibleox.com/en/en/w/Ps5r_Prayers_to_the_Saints/">Prayers to the Saints</a>.</p><p>Here, however, will be given the grounds not simply for the veneration of the Virgin Mary as one of the saints, but for her special veneration as <strong>the greatest of the holy servants and friends of God</strong>, as the mother of Jesus Christ (that is, the Mother of God, since Jesus Christ is God).</p><h2>The Reasons for the Special Veneration of the Theotokos</h2><ol><li><p><strong>The Virgin Mary’s special attentiveness to the words of God;</strong></p></li><li><p><strong>Perfect humble obedience to God;</strong></p></li><li><p><strong>Chosen by God</strong>. No one in the universe has been granted by God the honor of giving birth to Him in His humanity. The merit is not that she gave birth, but that God, knowing Mary’s qualities in advance (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L29">Rom. 8:29</a>), chooses her because of these qualities. By this choice God points to her greatness;</p></li><li><p><strong>The Son of God honors the Virgin Mary as His mother. </strong>No one else is the mother of the Son of God (no other being in the universe);</p></li><li><p><strong>The fulfillment of the prophecy</strong>: “henceforth all generations will call me blessed” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L48">Luke. 1:48</a>), — that is, all generations of people (γενεαί — ge-ne-ai). God has done great things for the Virgin Mary: <em>“For </em><strong><em>He who is mighty has done <mark>great things</mark> for me</em></strong><em>, and holy is His name”</em> (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L49">Luke. 1:49</a>);</p></li></ol><h2>Chosen for Her Humility</h2><blockquote><p>“And Mary said: ‘My soul magnifies the Lord, and my spirit has rejoiced in God my Savior. For <strong><mark>He has regarded the lowly state</mark> of His maidservant</strong>; for behold, henceforth all generations will call me blessed’” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L46-48">Luke. 1:46-48</a>) <em>(Greek: ταπείνωσιν — “lowliness, humility”)</em></p></blockquote><p>Even the father of the greatest of the prophets (Zacharias) was punished by the archangel (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L20">Luke. 1:20</a>) for unbelief, or rather distrust or doubt. The Mother of God, however, obediently accepted what was determined about her, humbly answering:</p><blockquote><p>“Behold the maidservant of the Lord! <strong><mark>Let it be to me according to your word</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L38">Luke. 1:38</a>)</p></blockquote><p>On the importance of humility:</p><blockquote><p><em>“For your strength does not depend on numbers, nor your might on the powerful. But </em><strong><em><mark>you are the God of the lowly</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/en-nrsv/iudf/9/#L11"><em>Jdt. 9:11</em></a><em>)</em></p></blockquote><blockquote><p>“<strong>The greater you are, the more you must humble yourself</strong>; so you will find favor in the sight of the Lord. &lt;...&gt; For great is the might of the Lord; but by the humble he is glorified” (<a href="https://bibleox.com/en/en-nrsv/prsir/3/#L18,20">Sir. 3:18,20</a>)</p></blockquote><p>Important quotes about humility: <a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BC%D0%B8%D1%80%D0%B5%D0%BD%D0%B8%D0%B5">https://bibleox.com/ru/ru/w/смирение</a></p><h2>The Most Attentive Listener to the Words of God</h2><blockquote><p>“My son, <strong><mark>give me your heart, and let your eyes observe my ways</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/23/#L26">Prov. 23:26</a>)</p></blockquote><blockquote><p>“But <strong>Mary kept <mark>all these things</mark> and pondered them <mark>in her heart</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L19">Luke. 2:19</a>) <em>(Greek: πάντα συνετήρει τὰ ῥήματα ταῦτα — “kept all these words”)</em>;</p></blockquote><blockquote><p>“but His mother <strong>kept <mark>all these things</mark> <mark>in her heart</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L51">Luke. 2:51</a>)</p></blockquote><blockquote><p><em>“But He said, ‘More than that, </em><strong><em>blessed are those who hear</em></strong><em> the word of God and </em><strong><em>keep</em></strong><em> it!’” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/11/#L27-28"><em>Luke. 11:27-28</em></a><em>)</em></p></blockquote><p>As Saint Ignatius (Brianchaninov) says, she proved to be the most attentive and constant listener to, and fulfiller of, the teaching of God:</p><blockquote><p>The Ever-Virgin is above all holy people both because she became the Mother of the God-Man, and because <strong>she was the most constant, the most attentive listener to and fulfiller of the teaching proclaimed by the God-Man</strong>.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54">An Exposition of the Teaching of the Orthodox Church on the Mother of God</a>, in Russian; translated from the Russian)</p><h2>She Became the Mother of Christ God</h2><p>One of the reasons for the special veneration of the Mother of God is the fact that she is the Mother of God (in His humanity), for no one else is the Mother of God, not a single being in the universe. The divine commandment obliges us to honor our parents (<a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9#HH-5">the 5th commandment</a>), therefore Christ God Himself honors the Theotokos as His mother, and after Him so do His believing disciples.</p><h3>The Virgin Mary Gave Birth to the Son of God</h3><p>It was precisely the Only-begotten Son of God who was truly born of a woman:</p><blockquote><p>“But when the fullness of the time had come, <strong>God sent forth <mark>His Son</mark> (the Only-begotten), <mark>born of a woman</mark></strong>, born under the law” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L4">Gal. 4:4</a>)</p></blockquote><p>The Only-begotten Son, the Word of God, truly became incarnate:</p><blockquote><p>“And <strong><mark>the Word became flesh</mark></strong> and dwelt among us, and we beheld His glory, the glory as of <strong>the only begotten of the Father</strong>, full of grace and truth” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L14">John. 1:14</a>)</p></blockquote><p>The Archangel Gabriel directly calls the Virgin Mary’s child the Son of God:</p><blockquote><p>“And the angel answered and said to her, ‘The Holy Spirit will come upon you, and the power of the Highest will overshadow you; therefore, also, that Holy One who is to be born will be called <strong><mark>the Son of God</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L35">Luke. 1:35</a>)</p></blockquote><h3>The Virgin Mary Is the Mother of the Son of God</h3><p>The righteous Elizabeth, the mother of the prophet John the Baptist, directly calls the Virgin Mary the mother of God:</p><blockquote><p>“But why is this granted to me, that <strong><mark>the mother of my Lord</mark></strong> should come to me?” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L43">Luke. 1:43</a>)</p></blockquote><blockquote><p>“And when they had come into the house, they saw the young Child with Mary <strong><mark>His mother</mark></strong>, and fell down and worshiped Him” (<a href="https://bibleox.com/en/eng-nkjv/mf/2/#L11">Matt. 2:11</a>)</p></blockquote><blockquote><p>“When <strong><mark>Jesus</mark></strong> therefore <strong><mark>saw His mother</mark></strong>, and the disciple whom He loved standing by, He said to <strong><mark>His mother</mark></strong>, ‘Woman, behold your son!’” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L26">John. 19:26</a>)</p></blockquote><blockquote><p>“<strong><mark>His mother</mark></strong> said to the servants, ‘Whatever He says to you, do it’” (<a href="https://bibleox.com/en/eng-nkjv/in/2/#L5">John. 2:5</a>)</p></blockquote><blockquote><p>“On the third day there was a wedding in Cana of Galilee, and <strong><mark>the mother of Jesus</mark></strong> was there” (<a href="https://bibleox.com/en/eng-nkjv/in/2/#L1">John. 2:1</a>)</p></blockquote><p>(<a href="https://bibleox.com/en/eng-nkjv/mf/2/#L14">Matt. 2:14</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/2/#L20">Matt. 2:20</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/2/#L21">Matt. 2:21</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/12/#L46">Matt. 12:46</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/3/#L31">Mark. 3:31</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/2/#L33">Luke. 2:33</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/2/#L34">Luke. 2:34</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/2/#L43">Luke. 2:43</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/2/#L48">Luke. 2:48</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/2/#L51">Luke. 2:51</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/8/#L19">Luke. 8:19</a>; <a href="https://bibleox.com/en/eng-nkjv/in/2/#L3">John. 2:3</a>; <a href="https://bibleox.com/en/eng-nkjv/in/2/#L12">John. 2:12</a>; <a href="https://bibleox.com/en/eng-nkjv/in/19/#L25">John. 19:25</a>; <a href="https://bibleox.com/en/eng-nkjv/in/19/#L26">John. 19:26</a>; <a href="https://bibleox.com/en/eng-nkjv/act/1/#L14">Act. 1:14</a>)</p><p>If the Son of God became man forever (and this is true), then the Virgin Mary became the mother of the Son of God forever.</p><h3>The Son of God Is the Son of the Virgin Mary</h3><blockquote><p>“<strong><mark>she had brought forth her</mark></strong> firstborn <strong><mark>Son</mark></strong>. And he called His name JESUS” (<a href="https://bibleox.com/en/eng-nkjv/mf/1/#L25">Matt. 1:25</a>)</p></blockquote><h3>The Virgin Mary Is the Theotokos</h3><p>The Virgin Mary gave birth to Jesus Christ.</p><p>Jesus Christ, the Son of God, is <a href="https://bibleox.com/ru/ru/w/%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%91%D0%BE%D0%B3">our God</a>.</p><p>The One to whom the Virgin Mary gave birth is <a href="https://bibleox.com/ru/ru/w/%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%91%D0%BE%D0%B3">our God</a>. This means she is the one who gave birth to God — the Theotokos (the God-bearer).</p><p>The Virgin Mary did not give birth to the eternal divine nature, which exists outside time and space, but to the human nature of the Son of God, which <a href="https://bibleox.com/ru/ru/w/%D0%A1%D1%8B%D0%BD-%D0%B1%D0%B5%D0%B7%D0%BD%D0%B0%D1%87%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9-%D0%BD%D0%B0%D1%87%D0%B8%D0%BD%D0%B0%D0%B5%D1%82%D1%81%D1%8F">has a beginning</a> and which from the very beginning of its existence belonged entirely to the person of the Son of God (God).</p><p>In short, the Virgin Mary gave birth to God in His humanity.</p><p>However, the greatness of the Theotokos lies precisely in the fact that she was chosen to be the Mother of God. The merit is not that she gave birth, for many give birth, but that God, knowing Mary’s qualities in advance (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L29">Rom. 8:29</a>), chose out of all the people who have ever existed not someone else, but precisely the Virgin Mary.</p><h2>The Theotokos Was and Remains a Virgin</h2><h3>Mary’s Virginity Before the Birth of Jesus Christ</h3><p>The Virgin Mary did not have marital relations with the righteous Joseph. Being betrothed to Joseph (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L27">Luke. 1:27</a>), she did not understand how a son could be born to her if she did not have marital relations:</p><blockquote><p>“Then Mary said to the angel, ‘How can this be, since <strong><mark>I do not know a man</mark></strong>?’” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L34">Luke. 1:34</a>)</p></blockquote><p>It is also worth noting that this question makes sense only if the Virgin Mary had made a promise to God to keep her virginity. Otherwise, even if the Virgin Mary had not had marital relations with the righteous Joseph until then, when the angel of God announces that a son will be born to her, obviously she should obey God and have marital relations with her husband so that the prediction would be fulfilled. But if the Virgin Mary had promised God to lead a virgin life, then the question immediately arises: “how can a son be born, if vows made to God may not be broken (<a href="https://bibleox.com/en/eng-nkjv/chis/30/#L2">Num. 30:2</a>)?”.</p><p>The angel answered that what was foretold to Mary would happen without a husband, by the miraculous action of the power of God:</p><blockquote><p>“And the angel answered and said to her, ‘<strong>The Holy Spirit will come upon you, and the power of the Highest will overshadow you</strong>; therefore, also, that Holy One who is to be born will be called the Son of God’” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L35">Luke. 1:35</a>)</p></blockquote><p>Jesus Christ was the son of Joseph only in people’s opinion:</p><blockquote><p>“Now Jesus Himself began His ministry at about thirty years of age, <strong>being (<mark>as was supposed</mark>) the son of Joseph</strong>, the son of Heli” (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L23">Luke. 3:23</a>)</p></blockquote><p>In reality, Christ was conceived not of Joseph, but by the power of the Holy Spirit.</p><h3>Mary’s Virginity After the Birth of Jesus Christ</h3><p>The prophecy of the ever-virginity (virginity to this day) of Mary, that only one child would be born of her: Jesus Christ — God, who entered our world as through a gate, by means of the Virgin Mary, the Theotokos:</p><blockquote><p>“Then He brought me back to the outer gate of the sanctuary which faces toward the east, but it was shut. And the LORD said to me, ‘<strong><mark>This gate shall be shut</mark>; it shall not be opened, and <mark>no man shall enter by it, because the LORD God of Israel has entered by it; therefore it shall be shut</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/iez/44/#L1-2">Ezek. 44:1-2</a>)</p></blockquote><p>Thus the Virgin Mary did not give birth to any other children besides Jesus Christ. And at the same time, Mary’s virginity was not violated.</p><p>It is also worth noting that on the day of the crucifixion, Christ entrusts the care of His mother to His beloved disciple — John the Theologian (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L26-27">John. 19:26-27</a>). This indicates that besides Christ, the only Son of the Virgin Mary, she had neither a husband nor other children who would have had to take care of her.</p><p>The righteous Joseph was elderly even at the time of the Nativity of Christ, and therefore by the time of Christ’s crucifixion he had long since died. And indeed, after the description of the childhood of Jesus Christ, Joseph is no longer mentioned in Scripture.</p><p>The Virgin Mary is entrusted to John because it was he who would live on earth longer than the other apostles. The Lord Himself indicates that the Apostle Peter would suffer for Christ, but the Apostle John would live considerably longer (<a href="https://bibleox.com/en/eng-nkjv/in/21/#L22">John. 21:22</a>). As we know, John was the youngest of the apostles and labored on earth until the end of the first century, while the other apostles suffered a martyr’s death. This allowed the Apostle John to care for the Virgin Mary longer than all the others.</p><p>This fact also indicates that the Virgin Mary had no other children who could have taken care of her.</p><h2>All Generations Will Call the Theotokos Blessed</h2><p>The Theotokos will be called blessed; God has done great things for her:</p><blockquote><p>“For He has regarded the <strong>lowly state</strong> of His maidservant; for behold, henceforth <strong><mark>all generations will call me blessed (μακαριοῦσίν)</mark></strong>. For <strong>He who is mighty <mark>has done great things</mark> for me</strong>, and holy is His name” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L48-49">Luke. 1:48-49</a>)</p></blockquote><p>A similar statement is found about Christ Himself:</p><blockquote><p>“His name shall endure forever; His name shall continue as long as the sun. And men shall be blessed in Him; <strong>all nations shall call Him blessed (μακαριοῦσιν)</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/72/#L17">Ps. 72:17</a>)</p></blockquote><h2>Christ’s Special Relationship with His Mother</h2><h3>The Son of God Honors the Virgin Mary as His Mother</h3><p>The Son of God was born under the law:</p><blockquote><p>“God sent forth His Son (the Only-begotten), born of a woman, <strong><mark>born under the law</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L4">Gal. 4:4</a>)</p></blockquote><p>God commands us to honor father and mother:</p><blockquote><p>“<strong><mark>Honor</mark> your father and <mark>your mother</mark></strong>, that your days may be long upon the land which the LORD your God is giving you” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L12">Ex. 20:12</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L16">Deut. 5:16</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/21/#L17">Ex. 21:17</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L9">Lev. 20:9</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/21/#L15">Ex. 21:15</a>)</p></blockquote><blockquote><p>“You know the commandments: &lt;…&gt; ‘<strong><mark>Honor</mark> your father and <mark>your mother</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L20">Luke. 18:20</a>)</p></blockquote><blockquote><p>“He said to them, ‘All too well you reject <strong>the commandment of God</strong>, that you may keep your tradition. &lt;…&gt; But you say, “If a man says to his father or mother, ‘Whatever profit you might have received from me is Corban’” &lt;…&gt; then you <strong><mark>no longer let him do anything for</mark> his father or <mark>his mother</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mk/7/#L9,11-12">Mark. 7:9,11-12</a>)</p></blockquote><p>No being in the universe, except the Virgin Mary, is the mother of the Son of God. In this respect, no one among angels and people is higher than the Virgin Mary, because the Son of God Himself, God, honors her as His mother.</p><h3>Christ Listens to His Mother</h3><p>Christ points out that the time for preaching and miracles (the manifestation of His glory) has not yet come, yet for the sake of His mother’s request He performs the first miracle:</p><blockquote><p>“And when they ran out of wine, <strong>the mother of Jesus said to Him, ‘They have no wine.’</strong> Jesus said to her, <strong><mark>‘Woman, what does your concern have to do with Me? My hour has not yet come.’</mark></strong> His mother said to the servants, ‘Whatever He says to you, do it.’ &lt;…&gt; <strong>Jesus said to them, ‘Fill the waterpots with water.’ And they filled them up to the brim. And He said to them, ‘Draw some out now, and take it to the master of the feast.’</strong> And they took it. &lt;…&gt; <strong><mark>This beginning of signs Jesus did</mark></strong> in Cana of Galilee, and <strong><mark>manifested His glory</mark></strong>; and His disciples believed in Him” (<a href="https://bibleox.com/en/eng-nkjv/in/2/#L3-5,7-8,11">John. 2:3-5,7-8,11</a>)</p></blockquote><h3>Christ Cares for His Mother</h3><p>During the cruel torments on the Cross, Christ shows care for His mother:</p><blockquote><p><em>“When Jesus therefore saw His mother, and the disciple whom He loved standing by, </em><strong><em>He said to His mother, ‘Woman, behold your son!’ Then He said to the disciple, ‘Behold your mother!’ And from that hour <mark>that disciple took her to his own home</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/in/19/#L26-27"><em>John. 19:26-27</em></a><em>)</em></p></blockquote><h3>The Character of Christ’s Personal Relationship with His Mother</h3><p>In the most terrible hour, enduring terrible bodily torments on the Cross, betrayal, the flight of the disciples, the human feeling of abandonment (the ninth hour: “<em>Eloi, Eloi, lama sabachthani?” which is translated, “My God, My God, </em><strong><em>why have You forsaken Me</em></strong><em>?</em>” <a href="https://bibleox.com/en/eng-nkjv/mk/15/#L34">Mark. 15:34</a>), the Lord cares for His mother, who follows Him to the end.</p><p>In this most difficult time He turns His attention to His Mother, shows special care for Her, entrusts Her to His beloved disciple, and not simply as “look after her, take care of her”, but receive her as “your mother”.</p><blockquote><p>“When Jesus therefore saw His mother, and the disciple whom He loved standing by, He said to His mother, ‘Woman, behold your son!’ Then He said to the disciple, <strong>‘Behold your mother!’</strong> And from that hour that disciple took her to his own home” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L26-27">John. 19:26-27</a>)</p></blockquote><p>Let us note that all those people whom Christ pointed to, saying “here are My mother and My brothers” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L48-50">Matt. 12:48-50</a>), left Him alone (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L32">John. 16:32</a>), while His mother was with Him to the end.</p><blockquote><p>“Indeed the hour is coming, yes, has now come, that you will be scattered, each to his own, and <strong>will leave Me alone</strong>. And yet I am not alone, because the Father is with Me” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L32">John. 16:32</a>)</p></blockquote><blockquote><p>“And He who sent Me is with Me. The Father <strong>has not left Me alone</strong>, <strong>for I always do those things that please Him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/8/#L29">John. 8:29</a>)</p></blockquote><p>And Christ did not leave His Mother alone for the same reason.</p><h3>Is It Important That the Mother of God Was with Christ to the End?</h3><p>The Apostle Paul before his death also went through a similar experience of abandonment:</p><blockquote><p>“This you know, that <strong>all those in Asia have turned away from me,</strong> among whom are Phygellus and Hermogenes” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L15">2 Tim. 1:15</a>)</p></blockquote><blockquote><p>“for Demas <strong>has forsaken me, having loved this present world</strong>, and has departed for Thessalonica — Crescens for Galatia, Titus for Dalmatia. <strong>Only Luke is with me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L10-11">2 Tim. 4:10-11</a>)</p></blockquote><p>The Mother of God was attentive, obedient and faithful to God in everything, from the very beginning to the very end. She always was and remains with God.</p><h2>Criticism</h2><h3>But the Word “Theotokos” Is Not in Scripture</h3><p>The word “Trinity” is not in Scripture either — so what? Scripture says the same thing that the word “Theotokos” says. The Virgin Mary is the mother of Jesus Christ. Jesus Christ is God. The Virgin Mary gave birth to Jesus Christ, that is, she gave birth to God — clearly, in His humanity. The One who was born of her is God. The Virgin Mary is the one who gave birth to God, or, in short, the Theotokos.</p><h3>“Blessed Is the Womb That Bore You”</h3><p>People praised the Theotokos for her family ties, for giving birth to and nursing Christ, but Christ Himself corrected this understanding (placed the emphasis), pointing to the greatness of His mother because of her special attentiveness to the Word of God and her complete humble obedience to God:</p><blockquote><p>“And it happened, as He spoke these things, that a certain woman from the crowd raised her voice and said to Him, <strong>‘Blessed is the womb that bore You, and the breasts which nursed You!’</strong> But He said, ‘More than that, <strong><mark>blessed are those who hear</mark></strong> the word of God and <strong><mark>keep</mark></strong> it!’” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L27-28">Luke. 11:27-28</a>)</p></blockquote><blockquote><p>“But <strong>Mary kept <mark>all these things</mark> and pondered them in her heart</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L19">Luke. 2:19</a>)</p></blockquote><blockquote><p>“Then He went down with them and came to Nazareth, and was subject to them, but <strong>His mother <mark>kept all these things</mark></strong> in her heart” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L51">Luke. 2:51</a>)</p></blockquote><h3>“Who Is My Mother and Who Are My Brothers?”</h3><p>Here Christ again places the emphasis: the greatness of the Virgin Mary lies not so much in family ties, as people thought, but in her unconditional fulfillment of the will of God:</p><blockquote><p>“Then one said to Him, ‘Look, Your mother and Your brothers are standing outside, seeking to speak with You.’ But He answered and said to the one who told Him, <strong>‘Who is My mother and who are My brothers?’</strong> And He stretched out His hand toward His disciples and said, ‘Here are My mother and My brothers! For <strong><mark>whoever does the will of My Father in heaven is My brother and sister and mother</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L47-50">Matt. 12:47-50</a>)</p></blockquote><h3>“And Did Not Know Her Till She Had Brought Forth” (Matt. 1:25)</h3><blockquote><p>“and <strong>did not know her <mark>till</mark> she had brought forth</strong> her firstborn Son. And he called His name JESUS” (<a href="https://bibleox.com/en/eng-nkjv/mf/1/#L25">Matt. 1:25</a>) <em>(Greek: ἕως οὗ — “until”)</em></p></blockquote><p>The expression “did not know her till she had brought forth” does not mean that after the birth of Christ he “knew” her. This is a common expression in the Bible, which does not mean that something changed afterwards.</p><p>For example:</p><blockquote><p>“teaching them to observe all things that I have commanded you; and <strong>lo, I am with you always, <mark>even to</mark> the end of the age</strong>. Amen” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L20">Matt. 28:20</a>) <em>(Greek: ἕως — “until”)</em></p></blockquote><p>— but after the end of the age too, obviously, Christ will be with those who believe in Him.</p><blockquote><p>“Then Jesus said to them, <strong>‘A little while longer the light is with you</strong>. Walk while you have the light, lest darkness overtake you; he who walks in darkness does not know where he is going. <strong><mark>While</mark> you have the light, believe in the light</strong>, that you may become sons of light.’ These things Jesus spoke, and departed, and was hidden from them” (<a href="https://bibleox.com/en/eng-nkjv/in/12/#L35-36">John. 12:35-36</a>)</p></blockquote><p>— but after Christ’s ascension into heaven too, one must believe in the Light (in Christ);</p><blockquote><p>“For He <strong>must reign <mark>till</mark> He has put all enemies</strong> under His feet” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L25">1 Cor. 15:25</a>)</p></blockquote><p>— but after the enemies are put down too, obviously, Christ will reign (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L33">Luke. 1:33</a>; <a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L11">2 Pet. 1:11</a>).</p><blockquote><p>“The LORD said to my Lord, <strong>‘Sit at My right hand, <mark>till</mark> I make Your enemies Your footstool’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/110/#L1">Ps. 110:1</a>)</p></blockquote><p>— but after the enemies are placed under His feet too, obviously, Christ will sit at the right hand of the Father, that is, He will reign.</p><blockquote><p>“Now to you I say, and to the rest in Thyatira, as many as do not have this doctrine, who have not known the depths of Satan, as they say, I will put on you no other burden. But <strong>hold fast what you have <mark>till</mark> I come</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L24-25">Rev. 2:24-25</a>)</p></blockquote><p>— but after the coming of Christ too, obviously, one must hold fast to virtues and faith.</p><blockquote><p>“Therefore Michal the daughter of Saul <strong>had no children <mark>to</mark> the day of her death</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2ts/6/#L23">2 Sam. 6:23</a>) <em>(Greek: ἕως — “until”)</em></p></blockquote><p>— but after death too, obviously, Michal had no children.</p><p>It is also worth paying attention to such passages of Scripture:</p><blockquote><p>“Behold! My Servant whom I have chosen, My Beloved in whom My soul is well pleased! I will put My Spirit upon Him, and He will declare justice to the Gentiles. He will not quarrel nor cry out, nor will anyone hear His voice in the streets. <strong>A bruised reed He will not break, and smoking flax He will not quench, <mark>till</mark> He sends forth justice to victory</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L18-20">Matt. 12:18-20</a>) <em>(Greek: ἕως ἂν — “until”)</em></p></blockquote><h3>She Bore a Firstborn — So There Were Other Children?</h3><p>In Scripture the son of the Theotokos is called the firstborn:</p><blockquote><p>“and did not know her till she had <strong>brought forth her <mark>firstborn*</mark> Son</strong>. And he called His name JESUS” (<a href="https://bibleox.com/en/eng-nkjv/mf/1/#L25">Matt. 1:25</a>)</p></blockquote><p>*the word “firstborn” is absent in the Sinaitic and Vatican manuscripts; however, this word is present in Luke 2:7.</p><blockquote><p>“And she <strong>brought forth her <mark>firstborn</mark> Son</strong>, and wrapped Him in swaddling cloths, and laid Him in a manger, because there was no room for them in the inn” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L7">Luke. 2:7</a>)</p></blockquote><p>Opponents of the teaching of the Orthodox Church consider this an indication that the Virgin Mary had other children too, saying: “<em>if there is a firstborn, then there are other children too</em>”. That this thought is mistaken is shown by Scripture itself.</p><p>God Himself in Scripture gives the definition of the word <strong>“firstborn” — that which opens the womb of all flesh</strong>:</p><blockquote><p>“<strong><mark>Everything that first opens the womb of all flesh</mark></strong>, which they bring to the LORD, whether man or beast, shall be yours; nevertheless <strong><mark>the firstborn</mark></strong> of man you shall surely redeem, and <strong><mark>the firstborn</mark></strong> of unclean animals you shall redeem” (<a href="https://bibleox.com/en/eng-nkjv/chis/18/#L15">Num. 18:15</a>)</p></blockquote><blockquote><p>“<strong><mark>All that open the womb</mark></strong> are Mine, and every male firstborn among your livestock, whether ox or sheep. But the firstborn of a donkey you shall redeem with a lamb. And if you will not redeem him, then you shall break his neck. <strong><mark>All the firstborn</mark></strong> of your sons you shall redeem. And none shall appear before Me empty-handed” (<a href="https://bibleox.com/en/eng-nkjv/ish/34/#L19-20">Ex. 34:19-20</a>)</p></blockquote><p>All the firstborn belong to God, therefore:</p><ol><li><p>The firstborn of a man had to be brought to the temple and redeemed from the priests.</p></li><li><p>The firstborn of clean animals were brought to the temple and given over; they were killed, being offered in sacrifice to God.</p></li><li><p>The firstborn of unclean animals could not be offered in sacrifice, so they had to be redeemed.</p></li></ol><p>As soon as a man or a beast had its first offspring, it had to be brought as a gift to God or redeemed. And it is perfectly obvious that at that very moment this newborn is an only-begotten child, yet God calls it firstborn, because it opened the womb. This means that <strong>every only-begotten child is a firstborn</strong>, but not every firstborn is an only-begotten child[2].</p><p>And if one thinks as those who rise up against the teaching of the Church do, that only one who has brothers or sisters is called firstborn, then it turns out that those who gave birth to their first child would have to say to the priest: “Wait until the second is born, so that this one may be called the firstborn; for now he is not a firstborn, but an only child, and therefore I need not bring him to God and redeem him”. But this absurd thought too contradicts Scripture and common sense, for the only-begotten Savior is brought to the temple according to this very law about the firstborn:</p><blockquote><p>“Now when the days of her purification <strong>according to the law of Moses</strong> were completed, <strong>they brought Him to Jerusalem to present Him to the Lord</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L22">Luke. 2:22</a>)</p></blockquote><p>It is obvious that the Lord Jesus Christ here is the <strong>only-begotten</strong>, and yet He is brought to the temple as a <strong>firstborn</strong>. So the firstborn in this case, according to the word of God, means the one who opens the womb of all flesh, and does not indicate whether the mother had other children born.</p><h3>The Brothers of Jesus Christ</h3><p>Scripture says that Christ had brothers:</p><blockquote><p>“Is this not the carpenter’s son? Is not His mother called Mary? And <strong>His brothers</strong> James, Joses, Simon, and Judas?” (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L55">Matt. 13:55</a>)</p></blockquote><blockquote><p>“For even <strong>His brothers</strong> did not believe in Him” (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L5">John. 7:5</a>)</p></blockquote><blockquote><p>“Then <strong>His brothers</strong> and His mother came, and standing outside they sent to Him, calling Him” (<a href="https://bibleox.com/en/eng-nkjv/mk/3/#L31">Mark. 3:31</a>)</p></blockquote><blockquote><p>“Do we have no right to take along a believing wife, as do also the other apostles, <strong>the brothers of the Lord</strong>, and Cephas?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/9/#L5">1 Cor. 9:5</a>)</p></blockquote><p>What is meant here are brothers from Joseph’s first marriage, or simply relatives. Any relatives are simply called brothers. For example, Lot was Abraham’s nephew, but in Scripture he is also called his brother:</p><blockquote><p>“They also took <strong>Lot, Abram’s <mark>brother’s son</mark></strong> who dwelt in Sodom, and his goods, and departed” (<a href="https://bibleox.com/en/eng-nkjv/gen/14/#L12">Gen. 14:12</a>)</p></blockquote><blockquote><p>“So Abram said to Lot, ‘Please let there be no strife between you and me, and between my herdsmen and your herdsmen; for <strong>we are <mark>brethren</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/13/#L8">Gen. 13:8</a>) <em>(Greek: ἀδελφοὶ — “brothers”)</em></p></blockquote><p>Joseph was already elderly when Mary was betrothed to him as a guardian, since Mary could not be without a husband. If Christ had been born of Mary when she had no known husband, then according to the Law she would have had to be stoned (<a href="https://bibleox.com/en/eng-nkjv/vtor/22/#L20-21">Deut. 22:20-21</a>), because everyone would have thought that she had had fornicating (extramarital) relations. Therefore the Lord arranges it so that Mary has a husband, but she conceives miraculously, without a husband, by the descent of the Holy Spirit (<a href="https://bibleox.com/en/eng-nkjv/mf/1/#L18-25">Matt. 1:18-25</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/1/#L34-35">Luke. 1:34-35</a>).</p><p>After the childhood of Jesus, Joseph the Betrothed is no longer mentioned in Scripture, while the Virgin Mary accompanied Jesus Christ to the very end — to the sufferings on the Cross (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L25-26">John. 19:25-26</a>), and she is also mentioned after the Resurrection, before the day of Pentecost (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L14">Act. 1:14</a>).</p><p>Christ entrusts His mother to His beloved disciple — John (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L27">John. 19:27</a>). Obviously, Joseph had already died by that time.</p><p>So the brothers of Jesus Christ are simply relatives, and not at all other children of the Virgin Mary.</p><p>And the prophecy clearly says that only the Lord Jesus Christ would be born of the Virgin Mary:</p><blockquote><p><em>“Then He brought me back to the outer gate of the sanctuary which faces toward the east, but it was shut. And the LORD said to me, ‘</em><strong><em><mark>This gate shall be shut</mark>; it shall not be opened, and <mark>no man shall enter by it, because the LORD God of Israel has entered by it; therefore it shall be shut</mark></em></strong><em>’” (</em><a href="https://bibleox.com/en/eng-nkjv/iez/44/#L1-2"><em>Ezek. 44:1-2</em></a><em>)</em></p></blockquote><h3>The Firstborn</h3><p>There are verses in which Christ is called the firstborn of the Virgin Mary:</p><blockquote><p>“and did not know her till she had brought forth her <strong>firstborn</strong> Son. And he called His name JESUS” (<a href="https://bibleox.com/en/eng-nkjv/mf/1/#L25">Matt. 1:25</a>)</p></blockquote><blockquote><p>“And she brought forth her <strong>firstborn</strong> Son, and wrapped Him in swaddling cloths, and laid Him in a manger, because there was no room for them in the inn” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L7">Luke. 2:7</a>)</p></blockquote><p>Some wish to see here an indication that besides the firstborn there were also second and third children born to her.</p><p>However, the word “firstborn” means only that the child was born first. It does not indicate the number of children. This is exactly how this word is used in Scripture. Every one that “opens the womb” is called firstborn, regardless of whether there were later children:</p><blockquote><p>“<strong><mark>Everything that first opens the womb</mark></strong> of all flesh, which they bring to the LORD, whether man or beast, shall be yours; nevertheless <strong><mark>the firstborn</mark></strong> of man you shall surely redeem, and the firstborn of unclean animals you shall redeem” (<a href="https://bibleox.com/en/eng-nkjv/chis/18/#L15">Num. 18:15</a>)</p></blockquote><blockquote><p>“<strong><mark>All that open the womb</mark></strong> are Mine, and every male firstborn among your livestock, whether ox or sheep. But the firstborn of a donkey you shall redeem with a lamb. And if you will not redeem him, then you shall break his neck. All <strong><mark>the firstborn</mark></strong> of your sons you shall redeem. And none shall appear before Me empty-handed” (<a href="https://bibleox.com/en/eng-nkjv/ish/34/#L19-20">Ex. 34:19-20</a>)</p></blockquote><p>Every only-begotten (the only one born) child of a mother is her firstborn, but not every firstborn is an only-begotten child.</p><p>So this word does not speak in favor of the Virgin Mary having other children besides Christ. Nor does it speak in favor of the Virgin Mary having had marital relations with the righteous Joseph. The Lord Jesus Christ is the only son of the Virgin Mary. See more[2].</p><h3>Nowhere Is It Said That the Virgin Mary Did Not Believe in Christ</h3><p>Critics of the Church often repeat the idea that the Virgin Mary supposedly did not believe that her Son was the Savior of people, the promised Messiah, the Christ. But this is simply untrue. There are no such words in Scripture. It is only said that the brothers (half-brothers, sons of Joseph from his first marriage) did not believe in Christ:</p><blockquote><p>“For even <strong>His brothers did not believe </strong>in Him” (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L5">John. 7:5</a>)</p></blockquote><p>This was quite predictable, since these were children from Joseph’s first marriage. They were already adults and had seen the boy Jesus grow up. Therefore it was hard for them, as for Christ’s other countrymen (the inhabitants of Galilee), to believe (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L54-58">Matt. 13:54-58</a>). But later the brothers too believed (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L14">Act. 1:14</a>; <a href="https://bibleox.com/en/eng-nkjv/gal/1/#L19">Gal. 1:19</a>).</p><h3>The Mother of the King Is a Queen</h3><p>Critics reproach the Church for calling the Theotokos a queen. But the mother of the King is precisely a queen.</p><blockquote><p>“<strong><mark>At Your right hand stands the queen</mark></strong> in gold from Ophir” (<a href="https://bibleox.com/en/eng-nkjv/ps/45/#L9">Ps. 45:9</a>).</p></blockquote><p>The apostles were refused the right to sit on Christ’s right and left in His Kingdom:</p><blockquote><p>“but <strong><mark>to sit on My right hand</mark></strong> and on My left <strong>is not Mine to give, but it is for those for whom it is prepared</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L40">Mark. 10:40</a>)</p></blockquote><p>If it was not the apostles who “sat” there, then who? In Orthodoxy, on the icon of the “Last Judgment”, it is precisely the Theotokos (on the right hand) and the prophet John the Baptist (on the left hand) who are painted next to Christ, as the greatest of those born of women (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L11">Matt. 11:11</a>).</p><h3>The Phrase “Most Holy Theotokos, Save Us”</h3><p>Here one needs to understand the meaning correctly. There is one Savior, but there are many fellow workers in the work of salvation:</p><blockquote><p>“For we are God’s <strong><mark>fellow workers</mark></strong>; you are God’s field, you are God’s building” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L9">1 Cor. 3:9</a>)</p></blockquote><p>The apostle intends to save people:</p><blockquote><p><em>“</em><strong><em>I have become all things to all men, that I might by all means <mark>save</mark></em></strong><em> some” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/9/#L22"><em>1 Cor. 9:22</em></a><em>)</em></p></blockquote><blockquote><p><em>“if by any means I may provoke to jealousy those who are my flesh and </em><strong><em><mark>save</mark> some of them</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/11/#L14"><em>Rom. 11:14</em></a><em>)</em></p></blockquote><p>A wife can save her husband, and a husband — his wife:</p><blockquote><p><em>“For how do you know, </em><strong><em>O wife, whether you will <mark>save</mark> your husband?</em></strong><em> Or how do you know, </em><strong><em>O husband, whether you will <mark>save</mark> your wife?</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L16"><em>1 Cor. 7:16</em></a><em>)</em></p></blockquote><p>The apostolic call to save people:</p><blockquote><p><em>“And on some have compassion, making a distinction; but others </em><strong><em><mark>save</mark></em></strong><em> with fear, pulling them out of the fire, hating even the garment defiled by the flesh” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L22-23"><em>Jude. 1:22-23</em></a><em>)</em></p></blockquote><blockquote><p>“Take heed to yourself and to the doctrine. Continue in them, for in doing this you will <strong><mark>save</mark></strong> both yourself and <strong>those who hear you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L16">1 Tim. 4:16</a>)</p></blockquote><h3>The Phrase “Servants of the Theotokos”</h3><p>Here it is the same as with salvation. One must understand the meaning correctly.</p><p>We do not serve the Theotokos as God, but we do serve her. If the Mother of God asked us for something, we would gladly serve her. And can one imagine Christians acting otherwise?</p><p>In the Bible there are places where righteous people call themselves servants (slaves) not only of God, while remaining servants of the one God.</p><p>The apostles are servants of Christians:</p><blockquote><p>“For we do not preach ourselves, but Christ Jesus the Lord, and <strong><mark>ourselves your bondservants</mark> </strong>for Jesus’ sake” (<a href="https://bibleox.com/en/eng-nkjv/2kor/4/#L5">2 Cor. 4:5</a>) <em>(Greek: δούλους — “slaves”)</em></p></blockquote><p>Obadiah, a God-fearing man who hid the prophets from persecution, calls himself the servant of the prophet Elijah, and Elijah — his lord:</p><blockquote><p>“<em>And Ahab had called Obadiah, who was in charge of his house. (Now Obadiah feared the LORD greatly. For so it was, while Jezebel massacred the prophets of the LORD, that Obadiah had taken one hundred prophets and hidden them, fifty to a cave, and had fed them with bread and water.) &lt;...&gt; Now as Obadiah was on his way, suddenly Elijah met him; and he recognized him, and fell on his face, and said, ‘Is that you, </em><strong><em>my lord Elijah?</em></strong><em>’ And he answered him, ‘It is I. Go, tell your master, “Elijah is here.”’ So he said, ‘How have I sinned, that you are delivering your servant into the hand of Ahab, to kill me? &lt;...&gt; And it shall come to pass, as soon as I am gone from you, that the Spirit of the LORD will carry you to a place I do not know; so when I go and tell Ahab, and he cannot find you, he will kill me. But I </em><strong><em><mark>your servant</mark></em></strong><em> have feared the LORD from my youth’</em>” (<a href="https://bibleox.com/en/eng-nkjv/3ts/18/#L3-4,7-9,12">1 Kin. 18:3-4,7-9,12</a>)</p></blockquote><h3>The Theotokos Was Raised After Her Burial</h3><p>Opponents of the veneration of the Theotokos object to the Tradition of the Orthodox Church about the raising of His mother by the Lord Jesus Christ, as if it were something impossible, supposing that only Christ was raised. However, from the side of Scripture there is no problem with this, since after the resurrection of Christ many saints were raised (however we may decide to understand the nature of this resurrection):</p><blockquote><p>“Then, behold, the veil of the temple was torn in two from top to bottom; and the earth quaked, and the rocks were split, and the graves were opened; and <strong><mark>many bodies of the saints who had fallen asleep were raised</mark>; and coming out of the graves after His resurrection</strong>, they went into the holy city and appeared to many” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L51-53">Matt. 27:51-53</a>)</p></blockquote><p>If after His resurrection the Lord raised many saints to life, then all the more could He bring back to life His own mother, whom He chose for His incarnation, whom He listened to when working miracles, and for whom He cared, entrusting her to His beloved disciple.</p><p>In confirmation of the Tradition about the raising of the Theotokos, it is also worth noting the circumstance that, with the Church’s reverent attitude toward the remains of the saints from the most ancient times (<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85">more</a>, in Russian), the Church has no remains of the Theotokos, just as it has no remains of the Lord Jesus Christ (because He rose).</p>
