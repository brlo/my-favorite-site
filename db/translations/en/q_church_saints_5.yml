      <h3>Related Material</h3><ol><li><p><strong>An Exposition of the Teaching of the Orthodox Church on the Mother of God // </strong>Ignatius (Brianchaninov), Saint, [Electronic resource] URL: <a href="https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54">https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54</a> (in Russian)</p></li><li><p><strong>The Perpetual Virginity of Blessed Mary // </strong>Jerome the Blessed, of Stridon, Venerable (~347-419), URL: <a href="https://bibleox.com/en/en/w/jerome-the-perpetual-virginity-of-blessed-mary/">https://bibleox.com/en/en/w/jerome-the-perpetual-virginity-of-blessed-mary/</a></p></li></ol>
