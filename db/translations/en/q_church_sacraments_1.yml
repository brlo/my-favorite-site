  - src: крещение
    path: Bp1t_Baptism
    title: Baptism
    meta_desc: Bible quotes about Baptism, which is the washing of a person from sin and spiritual birth for eternal life with God, for salvation.
    menu: { parent: Church/Sacraments, title: Baptism, priority: 1 }
    references: |-
      <ol><li><p>Protopresbyter Dimitry Vladykov: “Through the word of God, undoubtedly, God acts upon the soul of a person. The word of God can produce a revolution in a person’s soul, calling him to repentance and true life, but <strong>it does not give cleansing from sins and strength for the struggle with sin</strong>. Therefore the word of God does not do away with the sacraments and cannot replace them. The Jerusalem hearers of the Apostle Peter <strong>had to be baptized for the forgiveness of sins</strong> (Acts 2:38–41). Since in the process of a sinner’s turning to Christ <strong>the word of God is the means through which God gives birth to faith and repentance in him</strong>, the apostles said that He ‘brought us forth by the word of truth’ (James 1:18), that Christians are ‘born again through the word of God’ (1 Pet. 1:23), that is, awakened from the sleep of sin. But one ‘born again through the word of God’ is not yet cleansed from sin, which is why he must be born of water and the Spirit. On coming out of the font he, washed from the defilement of sin, having come to love righteousness and holiness, is born ‘from above’, granted ‘the washing of regeneration’. Regeneration through the word of God does not replace, but leads to regeneration in baptism. ‘The path (of a sinner’s conversion),’ writes Bishop Theophan, ‘is this: first hearing (of the word of God), then faith from hearing, and finally the sealing with the Holy Spirit in baptism and chrismation’” (<a href="https://azbyka.ru/otechnik/Dimitrij_Vladykov/pravoslavnaja-tserkov-i-sektanty/1_86">https://azbyka.ru/otechnik/Dimitrij_Vladykov/pravoslavnaja-tserkov-i-sektanty/1_86</a>, in Russian; translated from the Russian)</p></li></ol>
    body: |-
      <h2>The Essence of the Sacrament of Baptism</h2><p><strong>Baptism</strong> (“birth from above”, “spiritual birth”) is a sacrament performed in the Church, in which a person:</p><ol><li><p>is washed from sins (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Act. 2:38</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L11">1 Cor. 6:11</a>; <a href="https://bibleox.com/en/eng-nkjv/act/22/#L16">Act. 22:16</a>),</p></li><li><p>is born spiritually (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L44">1 Cor. 15:44</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L47-50">15:47-50</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L53">15:53</a>; <a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal. 3:27</a>),</p></li><li><p>receives saving grace (<a href="https://bibleox.com/en/eng-nkjv/2kor/6/#L1">2 Cor. 6:1</a>),</p></li><li><p>is joined to the Church (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>).</p></li></ol><h3>Forgiveness of Sins</h3><blockquote><p>“And now why are you waiting? Arise and <strong>be baptized, and <mark>wash away your sins</mark></strong>, calling on the name of the Lord” (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L16">Act. 22:16</a>)</p></blockquote><blockquote><p>“And such were some of you. But <strong><mark>you were washed</mark></strong>, but <strong>you were sanctified</strong>, but <strong>you were justified</strong> in the name of the Lord Jesus and by the Spirit of our God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L11">1 Cor. 6:11</a>)</p></blockquote><blockquote><p>“Then Peter said to them, ‘Repent, and <strong>let every one of you be baptized</strong> in the name of Jesus Christ <strong><mark>for the remission of sins</mark></strong>; and you shall receive the gift of the Holy Spirit’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Act. 2:38</a>)</p></blockquote><h3>Birth of Water and the Spirit</h3><blockquote><p>“Jesus answered and said to him, ‘Most assuredly, I say to you, unless one is <strong>born again</strong>, he cannot see the kingdom of God.’ &lt;...&gt; Jesus answered, ‘Most assuredly, I say to you, unless one is <strong><mark>born</mark> of water and the Spirit</strong>, he cannot enter the kingdom of God. <strong>That which is born of the flesh is flesh</strong>, and <strong><mark>that which is born of the Spirit is spirit</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>) <em>(Greek: γεννηθῇ ἄνωθεν — “born from above”)</em></p></blockquote><p><em>The other quotes are below, in “</em><a href="#HH-Infant-Baptism"><em>Infant Baptism</em></a><em>”.</em></p><h3>Joining the Body of Christ</h3><blockquote><p>“For by one Spirit <strong><mark>we were all baptized into one body</mark></strong> — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>)</p></blockquote><h3>The Possibility of Entering the Kingdom of God</h3><blockquote><p>“Jesus answered, ‘Most assuredly, I say to you, <strong>unless one is born of water and the Spirit, he cannot <mark>enter the kingdom of God</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L5">John. 3:5</a>)</p></blockquote><h3>The Possibility of Being Saved</h3><blockquote><p>“There is also an antitype which now <strong><mark>saves</mark></strong> us — <strong><mark>baptism</mark></strong> (not the <strong>removal</strong> of the filth of the flesh, but the answer of a good conscience toward God), through the resurrection of Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L21">1 Pet. 3:21</a>) (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L5">Titus. 3:5</a>)</p></blockquote><h2>The Institution of the Sacrament of Baptism</h2><blockquote><p><em>“All authority has been given to Me in heaven and on earth. </em><strong><em>Go</em></strong><em> therefore and make disciples of all the nations, </em><strong><em>baptizing them in the name of the Father and of the Son and of the Holy Spirit</em></strong><em>”</em> (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L18-19">Matt. 28:18–19</a>)</p></blockquote><h2>The Matter of the Sacrament of Baptism Is Water</h2><p>Baptism with water, in water:</p><blockquote><p>“Now as they went down the road, they <strong>came to some water</strong>. And the eunuch said, ‘<strong>See, here is water. What hinders me from being baptized?</strong>’ Then Philip said, ‘If you believe with all your heart, you may.’ And he answered and said, ‘I believe that Jesus Christ is the Son of God.’ So he commanded the chariot to stand still. And <strong>both Philip and the eunuch went down into the water</strong>, and <strong>he baptized him</strong>. Now when they <strong>came up out of the water</strong>, the Spirit of the Lord caught Philip away” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L36-39">Act. 8:36-39</a>)</p></blockquote><blockquote><p>“Can anyone forbid <strong>water</strong>, that these should not <strong>be baptized</strong> who have received the Holy Spirit just as we have?” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L47">Act. 10:47</a>)</p></blockquote><h2>Old Testament Prophecies of Baptism</h2><blockquote><p>“<em>Then </em><strong><em>I will sprinkle clean water on you, and you shall be clean; I will cleanse you from all your filthiness</em></strong><em> and from all your idols. I will give you a new heart and put a new spirit within you</em>” (<a href="https://bibleox.com/en/eng-nkjv/iez/36/#L25-28">Ezek. 36:25–28</a>)</p></blockquote><blockquote><p>“<em>He will again have compassion on us, and will subdue our iniquities. You will </em><strong><em>cast all our sins into the depths of the sea</em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mih/7/#L19">Mic. 7:19</a>)</p></blockquote><blockquote><p>“<em>In that day </em><strong><em>a fountain</em></strong><em> shall be opened for the house of David and for the inhabitants of Jerusalem, </em><strong><em>for sin and for uncleanness</em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/zah/13/#L1">Zech. 13:1</a>)</p></blockquote><h2>Conditions for Baptism</h2><h3>Faith</h3><p>Faith in God is needed: in the Father, the Son and the Holy Spirit (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L19">Matt. 28:19</a>):</p><blockquote><p>“Now as they went down the road, they came to some water. And the eunuch said, <strong>‘See, here is water. What hinders me from being baptized?’</strong> Then Philip said, <strong>‘If you believe with all your heart, you may.’</strong> And he answered and said, <strong>‘I believe that Jesus Christ is the Son of God.’</strong> So he commanded the chariot to stand still. And both Philip and the eunuch went down into the water, and <strong>he baptized him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L36-38">Act. 8:36-38</a>)</p></blockquote><h3>Repentance</h3><p>Repentance of sins is needed:</p><blockquote><p>“Then Peter said to them, ‘<strong>Repent</strong>, and let every one of you be baptized in the name of Jesus Christ for the remission of sins; and you shall receive the gift of the Holy Spirit’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Act. 2:38</a>)</p></blockquote><h2>Infant Baptism</h2><h3>Everyone Must Be Born Spiritually</h3><p>All people in general need spiritual birth for eternal life with God:</p><blockquote><p>“<strong>There are also celestial bodies and terrestrial bodies</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L40">1 Cor. 15:40</a>)</p></blockquote><blockquote><p>“<strong>There is a natural body, and there is a spiritual body</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L44">1 Cor. 15:44</a>)</p></blockquote><blockquote><p>“<strong>That which is born of the flesh is flesh</strong>, and that which is born of the Spirit is spirit” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L6">John. 3:6</a>)</p></blockquote><p>The heirs of Adam’s corruptible body cannot enter the Kingdom of God:</p><blockquote><p>“<strong>The first man was of the earth, made of dust</strong>; the second Man is the Lord from heaven. <strong>As was the man of dust, so also are those who are made of dust</strong>; and as is the heavenly Man, so also are those who are heavenly. And as <strong>we have borne the image of the man of dust</strong>, we shall also bear the image of the heavenly Man. Now this I say, brethren, that <strong>flesh and blood cannot inherit the kingdom of God</strong>; nor <strong>does corruption inherit incorruption</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L47-50">1 Cor. 15:47-50</a>)</p></blockquote><p>Therefore all who have corruptibility from Adam die, but those united with Christ in Baptism will be made alive.</p><blockquote><p>“For as <strong>in Adam</strong> <strong>all die</strong>, even so <strong>in Christ all shall be made alive</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L22">1 Cor. 15:22</a>)</p></blockquote><blockquote><p>“Or do you not know that as many of us as <strong>were baptized into Christ Jesus</strong> were baptized into His death? &lt;...&gt; For if we have been <strong>united together in the likeness of His death</strong>, certainly we also shall be <strong>in the likeness of His resurrection</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/6/#L3,5">Rom. 6:3,5</a>)</p></blockquote><p>All that is mortal must put on immortality:</p><blockquote><p>“For <strong>this corruptible must put on incorruption</strong>, and <strong>this mortal must put on immortality</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L53">1 Cor. 15:53</a>)</p></blockquote><p>That is, put on Christ in Baptism:</p><blockquote><p>“For as many of you as <strong>were baptized into Christ have put on Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal. 3:27</a>)</p></blockquote><h3>Everyone Must Be Washed of Original Sin</h3><p>Also, all people in general inherit sinfulness from our first parents. That is, <a href="https://bibleox.com/ru/q/%D0%B2%D1%81%D0%B5-%D0%BB%D1%8E%D0%B4%D0%B8-%D0%B3%D1%80%D0%B5%D1%88%D0%BD%D1%8B">infants have it too</a>:</p><blockquote><p>“Who can bring a clean thing out of an unclean? <strong>No one!</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iov/14/#L4">Job. 14:4</a>)</p></blockquote><blockquote><p>“Behold, I was brought forth in iniquity, and <strong>in sin my mother conceived me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/51/#L5">Ps. 51:5</a>)</p></blockquote><blockquote><p>“Therefore, just as <strong>through one man sin entered the world</strong>, and death through sin, and thus <strong>death spread to all men, because all sinned</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/5/#L12">Rom. 5:12</a>) <em>(Greek: ἐφ᾿ ᾧ — also understood as “in whom”)</em></p></blockquote><blockquote><p><em>“For as </em><strong><em>by one man’s disobedience many were made sinners</em></strong><em>, so also by one Man’s obedience many will be made righteous” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/5/#L19"><em>Rom. 5:19</em></a><em>)</em></p></blockquote><blockquote><p>“<strong>For the good that I will to do, I do not do; but the evil I will not to do, that I practice</strong>. Now if I do what I will not to do, it is no longer I who do it, but <strong>sin that dwells in me</strong>. I find then a law, that evil is present with me, the one who wills to do good. For I delight in the law of God according to the inward man. But <strong>I see another law in my members, warring against the law of my mind, and bringing me into captivity to the law of sin which is in my members</strong>. O wretched man that I am! <strong>Who will deliver me from this body of death?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/7/#L19-24">Rom. 7:19-24</a>)</p></blockquote><blockquote><p><em>“For we know that the law is spiritual, but </em><strong><em>I am carnal, sold under sin</em></strong><em>. &lt;...&gt; For I delight in the law of God according to the inward man. But </em><strong><em>I see another law in my members, warring</em></strong><em> against the law of my mind, and </em><strong><em>bringing me into captivity to the law of sin</em></strong><em> which is in my members” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/7/#L14,22-23"><em>Rom. 7:14,22-23</em></a><em>)</em></p></blockquote><blockquote><p><em>“among whom also we </em><strong><em>all</em></strong><em> once conducted ourselves in the lusts of our flesh, fulfilling the desires of the flesh and of the mind, and </em><strong><em>were by nature children of wrath</em></strong><em>, just as the others” (</em><a href="https://bibleox.com/en/eng-nkjv/ef/2/#L3"><em>Eph. 2:3</em></a><em>)</em></p></blockquote><h3>The Apostles Baptized Whole Families (Households)</h3><blockquote><p>“Yes, <strong>I also baptized the household of Stephanas</strong>. Besides, I do not know whether I baptized any other” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L16">1 Cor. 1:16</a>)</p></blockquote><blockquote><p>“And when <strong>she and her household were baptized</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/16/#L15">Act. 16:15</a>)</p></blockquote><blockquote><p>“‘what must I do to be saved?’ So they said, ‘Believe on the Lord Jesus Christ, and you will be saved, you and your household.’ Then they spoke the word of the Lord to him and to all who were in his house. And he took them the same hour of the night and washed their stripes. And immediately <strong>he and all his family were baptized</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/16/#L30-33">Act. 16:30-33</a>)</p></blockquote><p>The apostle calls everyone to be baptized, saying that the promise belongs not only to them (the adults), but also to their children:</p><blockquote><p>“Then Peter said to them, ‘<strong>Repent</strong>, and <strong>let every one of you be baptized</strong> in the name of Jesus Christ for the remission of sins; and you shall receive the gift of the Holy Spirit. For <strong>the <u>promise</u> is to you and to <u>your children</u></strong>, and to all who are afar off, as many as the Lord our God will call’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38-39">Act. 2:38-39</a>).</p></blockquote><p>Here it is literally a matter of infants. One must look into the context to understand what this mentioned <strong>promise</strong> is. This chapter tells about the descent of the Holy Spirit on the church assembly on the day of Pentecost. Explaining this event, the Apostle Peter points to the promise given through the prophet Joel:</p><blockquote><p>“And <strong>they were all filled with the Holy Spirit</strong> &lt;...&gt; But <strong>Peter</strong>, standing up with the eleven, raised his voice and said to them, &lt;…&gt; ‘<strong>this is what was spoken by the prophet <u>Joel</u></strong>: “And it shall come to pass in the last days, says God, that <strong>I will pour out of My Spirit on all flesh</strong>; your sons and your daughters shall prophesy, your young men shall see visions, your old men shall dream dreams.”’ &lt;...&gt; Now when they heard this, they were cut to the heart, and said to Peter and the rest of the apostles, ‘Men and brethren, what shall we do?’ Then Peter said to them, ‘<strong>Repent, and let every one of you be baptized</strong> in the name of Jesus Christ for the remission of sins; and you shall receive the gift of the Holy Spirit. <strong>For <u>the promise is to you and to your children</u>, and to all who are afar off</strong>, as many as the Lord our God will call’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L4,14-17,37-39">Act. 2:4,14-17,37-39</a>)</p></blockquote><p>So the Apostle Peter quotes the prophet Joel. Let us look at this promise in the prophet Joel himself:</p><blockquote><p>“Blow the trumpet in Zion, and sound an alarm in My holy mountain! Let all the inhabitants of the land tremble; for the day of the LORD is coming, for it is at hand &lt;...&gt; Blow the trumpet in Zion, consecrate a fast, call a sacred assembly; <strong>gather the people, sanctify the congregation, assemble the elders, gather the children and <u>nursing babes</u></strong>; let the bridegroom go out from his chamber, and the bride from her dressing room. Let the priests, who minister to the LORD, weep between the porch and the altar; let them say, ‘Spare Your people, O LORD, and do not give Your heritage to reproach, that the nations should rule over them. Why should they say among the peoples, “Where is their God?”’ <strong><u>Then the LORD will be zealous for His land, and pity His people</u></strong>. &lt;...&gt; And it shall come to pass afterward that <strong><u>I will pour out My Spirit on all flesh</u></strong>; your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions” (<a href="https://bibleox.com/en/eng-nkjv/iol/2/#L1,15-18,28">Joel. 2:1,15-18,28</a>)</p></blockquote><p>This is that promise. The whole people is called to this solemn assembly: from the elders to the nursing babes. And on this whole assembled people God promised to pour out the Holy Spirit, as it is written: on all flesh. Thus, when the apostle says that the promise belongs not only to his hearers, but also to their children and to those afar off, by children he literally means infants, if we follow the context.</p><h3>The Action of God’s Grace Through the Faith of Other People</h3><p>At the moment infants receive Baptism, the faith of their sponsors (godparents) can act. In Scripture there are many cases when divine grace acted on some people through the faith of other people:</p><h4>The Savior Heals Children Through the Faith of Their Parents</h4><p>God acts in children through the faith of their parents:</p><ul><li><p>Faith is required of the father, but it is the son who is healed of demon possession (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L17-24">Mark. 9:17-24</a>);</p></li><li><p>Faith is required of the father, but it is the daughter of Jairus who is raised and healed (<a href="https://bibleox.com/en/eng-nkjv/lk/8/#L41-42,49-55">Luke. 8:41-42,49-55</a>);</p></li><li><p>The mother believes, but it is the daughter of the Canaanite woman who is healed of demon possession (<a href="https://bibleox.com/en/eng-nkjv/mf/15/#L22-28">Matt. 15:22-28</a>);</p></li><li><p>The father believes, but it is the nobleman’s son who is healed (<a href="https://bibleox.com/en/eng-nkjv/in/4/#L46-50">John. 4:46-50</a>).</p></li></ul><h4>Cases of Healing (the Action of Grace) Through the Faith of Those Close to Someone</h4><ul><li><p>The centurion believes, but it is his servant who is healed (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L10,13">Matt. 8:10,13</a>)</p></li><li><p>The friends believe, but it is their paralyzed companion who is healed (<a href="https://bibleox.com/en/eng-nkjv/mk/2/#L5">Mark. 2:5</a>). What is important here is that, through the faith of other people, the man’s <strong>sins were also forgiven</strong>.</p></li></ul><p>More: <a href="https://bibleox.com/en/en/w/Gf3o_Gods_Action_Through_the_Faith_and_Prayer_of_Others/">God’s action through the faith of parents and friends</a></p><h3>A Vow to Dedicate a Future Son to God</h3><p>Parents dedicated to God not only infants already born (on the 8th day), but even those they were still asking God for. This is how the prophet Samuel was born:</p><blockquote><p>“Then she made a vow and said, ‘O LORD of hosts, if You will indeed look on the affliction of Your maidservant and remember me, and not forget Your maidservant, but will give Your maidservant a male child, then <strong>I will give him to the LORD all the days of his life, and no razor shall come upon his head</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/1ts/1/#L11">1 Sam. 1:11</a>)</p></blockquote><h2>Old Testament Prototypes of Baptism</h2><h3>Circumcision</h3><p>Old Testament circumcision is a prototype of New Testament Baptism:</p><blockquote><p>“In Him you were also <strong>circumcised with the circumcision made without hands</strong>, by putting off the body of the sins of the flesh, <strong>by the circumcision of Christ, buried with Him in baptism</strong>, in which you also were raised with Him through faith in the working of God, who raised Him from the dead” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L11-12">Col. 2:11-12</a>)</p></blockquote><p>The institution of Old Testament circumcision, which was an entry into the agreement (covenant) with God, into which infants entered from 8 days old:</p><blockquote><p>“This is My covenant which you shall keep, between Me and you and your descendants after you: Every male child among you shall be circumcised; and you shall be circumcised in the flesh of your foreskins, and <strong>it shall be a sign of the covenant between Me and you</strong>. <strong>He who is eight days old among you shall be circumcised, every male child in your generations</strong>, he who is born in your house or bought with money from any foreigner who is not your descendant” (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L10-12">Gen. 17:10-12</a>)</p></blockquote><h3>The Exodus from Slavery Across the Bottom of the Sea</h3><p>The exodus of the Hebrews from Egyptian slavery across the bottom of the Red Sea is a prototype of New Testament Baptism. The whole people came out of slavery and the whole people was baptized into Moses, including infants:</p><blockquote><p>“Moreover, brethren, I do not want you to be unaware that all our fathers <strong>were under the cloud, all passed through the sea, all were baptized into Moses in the cloud and in the sea</strong>, all ate the same spiritual food, and all drank the same spiritual drink. For they drank of that spiritual Rock that followed them, and that Rock was Christ” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L1-4">1 Cor. 10:1-4</a>).</p></blockquote><p>These images have a direct significance:</p><blockquote><p>“<em>Now all these things happened to them as examples, and </em><strong><em>they were written for our admonition</em></strong><em>, upon whom the ends of the ages have come</em>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L11">1 Cor. 10:11</a>)</p></blockquote><h2>Baptism of Blood</h2><p>Baptism of blood is a martyr’s death for Christ. This does not mean jihad or the act of a kamikaze. A martyr wants to live and threatens no one’s life. But simply because of his faith in Christ his life is taken from him. Such people, without baptism in water, attain not only salvation, but also special glory in heaven with Christ.</p><h3>Christ Speaks of His Coming Sufferings and Death as a Baptism</h3><blockquote><p>“But Jesus answered and said, ‘You do not know what you ask. Are you able to drink the cup that I am about to drink, and be baptized with the baptism that I am baptized with?’ They said to Him, ‘We are able.’ So He said to them, ‘You will indeed drink My cup, and be baptized with the baptism that I am baptized with; but to sit on My right hand and on My left is not Mine to give, but it is for those for whom it is prepared by My Father’” (<a href="https://bibleox.com/en/eng-nkjv/mf/20/#L22-23">Matt. 20:22-23</a>)</p></blockquote><h3>Those Slain for Christ Are Given White Robes in Heaven</h3><blockquote><p><em>“When He opened the fifth seal, I saw </em><strong><em>under the altar the souls of those who had been slain for the word of God and for the testimony*</em></strong><em> which they held. And they cried with a loud voice, saying, ‘How long, O Lord, holy and true, until You judge and avenge our blood on those who dwell on the earth?’ Then </em><strong><em>a white robe was given to each of them</em></strong><em>; and it was said to them that they should rest a little while longer, until both the number of their fellow servants and their brethren, who would be killed as they were, was completed” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11"><em>Rev. 6:9-11</em></a><em>)</em></p></blockquote><p>*In Greek martyrs are called by the word μάρτυς (witness). By their deed martyrs bear witness to a firm faith in Christ and the resurrection, which often became an occasion for others to accept faith in Christ.</p><h3>Christ on Martyrs and Persecutions</h3><blockquote><p>“Therefore <strong>whoever confesses Me before men, him I will also confess before My Father who is in heaven</strong>. But whoever denies Me before men, him I will also deny before My Father who is in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L32-33">Matt. 10:32-33</a>)</p></blockquote><blockquote><p>“Also I say to you, <strong>whoever confesses Me before men, him the Son of Man also will confess before the angels of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L8">Luke. 12:8</a>)</p></blockquote><blockquote><p>“Blessed are those who are <strong>persecuted for righteousness’ sake, for theirs is the kingdom of heaven</strong>. Blessed are you when they revile and <strong>persecute you, and say all kinds of evil against you falsely for My sake</strong>. Rejoice and be exceedingly glad, for <strong>great is your reward in heaven</strong>, for so they persecuted the prophets who were before you” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L10-12">Matt. 5:10-12</a>)</p></blockquote><h2>After Baptism Believers Are Still Capable of Sinning and Must Struggle Against Sin in Themselves</h2><blockquote><p>“For if we <strong>sin willfully after we have received the knowledge of the truth</strong>, there no longer remains a sacrifice for sins” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L26">Heb. 10:26</a>)</p></blockquote><blockquote><p>“<strong>If we say that we have no sin, we deceive ourselves</strong>, and the truth is not in us. If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness” (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L8-9">1 John. 1:8-9</a>)</p></blockquote><blockquote><p>“My little children, <strong><mark>these things I write to you, so that you may not sin</mark></strong>. And if anyone sins, we have an Advocate with the Father, Jesus Christ the righteous” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L1">1 John. 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>Where do wars and fights come from among you?</mark></strong> Do they not come from your desires for pleasure that war in your members?” (<a href="https://bibleox.com/en/eng-nkjv/iak/4/#L1">James. 4:1</a>)</p></blockquote><blockquote><p><em>“Is anyone among you sick? </em><strong><em>Let him call for the elders of the church</em></strong><em>, and let them pray over him, anointing him with oil in the name of the Lord. And </em><strong><em>the prayer of faith will save the sick</em></strong><em>, and the Lord will raise him up. And </em><strong><em>if he has committed <mark>sins, he will be forgiven</mark></em></strong><em>. Confess your trespasses to one another, and </em><strong><em>pray for one another, that you may be healed. The effective, fervent prayer of a righteous man avails much</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-16"><em>James. 5:14-16</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>Awake to righteousness, and <mark>do not sin</mark></em></strong><em>; for </em><strong><em>some do not have the knowledge of God</em></strong><em>. I speak this to your shame” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L34"><em>1 Cor. 15:34</em></a><em>)</em></p></blockquote><blockquote><p>“And be kind to one another, tenderhearted, <strong><mark>forgiving one another</mark></strong>, even as God in Christ forgave you” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L32">Eph. 4:32</a>)</p></blockquote><p>Finally, the Lord Jesus Christ gives His disciples a prayer in which He teaches them to ask for the forgiveness of sins. This is not a one-time prayer to be said once in a lifetime. The disciples asked Christ to teach them to pray, and Christ in answer gave them this pattern:</p><blockquote><p>“So He said to them, ‘<strong><mark>When you pray, say</mark></strong>: Our Father in heaven, hallowed be Your name. Your kingdom come. Your will be done on earth as it is in heaven. Give us day by day our daily bread. And <strong><mark>forgive us our sins</mark></strong>, for we also forgive everyone who is indebted to us. And do not lead us into temptation, but deliver us from the evil one’” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L1-4">Luke. 11:1-4</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/6/#L7-13">Matt. 6:7-13</a>)</p></blockquote><h2>Criticism</h2><h3>In the Words About Birth of Water and the Spirit (John 3:5), Does Water Mean the Spirit?</h3><p>Neo-Protestants explain allegorically the Savior’s words about the necessity of being born of water and the Spirit for salvation, saying that water means the Spirit. They connect the following two verses:</p><blockquote><p>“Jesus answered, ‘Most assuredly, I say to you, unless one is <strong>born of <mark>water</mark> and the Spirit</strong>, he cannot enter the kingdom of God’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L5">John. 3:5</a>)</p></blockquote><blockquote><p>“He who believes in Me, as the Scripture has said, <strong>out of his heart will flow <mark>rivers of living water</mark>.’ But this He <mark>spoke concerning the Spirit</mark></strong>, whom those believing in Him would receive; for the Holy Spirit was not yet given, because Jesus was not yet glorified” (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L38-39">John. 7:38-39</a>)</p></blockquote><p>But if water is understood as the Spirit, the result is a tautology (a superfluous repetition of one and the same thing). Then Christ would have said that one must be born of the Spirit and the Spirit. If in this speech it was fitting to speak of the Spirit directly, why resort to an allegory as well? And even in the case of an allegory, it would have been necessary to say: “<em>of the water of the Spirit</em>” or “<em>of water </em><strong><em><u>or</u></em></strong><em> the Spirit</em>” (which would be equivalent), but as it is, it turns out that one must be born of the Spirit <strong><u>and</u></strong> of something else, namely of water.</p><p>Moreover, as we well know, including from Scripture, the apostles performed regeneration literally in water. That is, the water in Baptism was always real, whereas rivers from the belly (literally) never flowed from anyone.</p><p>Therefore, since the apostles baptized in water, and baptism was accomplished by the Holy Spirit, we understand the Savior’s words about birth of water and the Spirit as applying to the way the apostles performed it: of water and the Spirit; that is, this understanding is objectively tied to the apostolic practice of baptism in water. The Church in antiquity never understood Baptism apart from water, purely mentally, but as a threefold immersion in sanctified waters, with the invocation of the name of the Father, the Son and the Holy Spirit.</p><h3>To Be Baptized One Must Repent, but Infants Cannot Repent, So They Cannot Be Baptized?</h3><p>Some societies that have separated from the Church accuse her of admitting infants to Baptism. They point to a biblical verse in which the apostle calls his hearers first to repent and then to be baptized:</p><blockquote><p>“Then Peter said to them, ‘<strong>Repent</strong>, and <strong>let every one of you be baptized</strong> in the name of Jesus Christ for the remission of sins; and you shall receive the gift of the Holy Spirit. For the promise is to you and to your children, and to all who are afar off, as many as the Lord our God will call’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38-39">Act. 2:38-39</a>).</p></blockquote><p>The requirement of repentance refers to adults, but infants have no personal sins, so it is difficult to apply the requirement of repentance to them. That is, infants need to be baptized, but since they have no personal sins, they also need not repent of what does not exist.</p><p>In general, the accusation sounds very strange. It follows from it that infants, in order to put on Christ (to be baptized — <a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal. 3:27</a>), must first sin, and until they sin, they cannot repent, and therefore can never be baptized. Some absurdity results: in order to gain the possibility of union with Christ, one must first sin against Christ. Of course, this is a great mistake. Everyone needs to be baptized, but only those who have sinned need to repent.</p><p>The baptism of repentance from the prophet John, although not the same as baptism into Christ (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L4">Act. 19:4</a>), allows us to verify the correctness of this reasoning. The prophet John baptized for repentance, but when Christ comes to him, He immediately enters the waters without repentance. Christ has no sins, so He receives the baptism of repentance without repentance. So too with infants. Christ does not need to acquire sins in order to gain the possibility of receiving the baptism of repentance. So too with infants. All are called to baptism, but only those who have something to repent of repent.</p><h3>To Be Baptized One Needs Faith, but Infants Cannot Confess Faith, So They Cannot Be Baptized?</h3><p>Societies that have separated from the Church also point to another biblical verse, in which the Lord says that people should believe and be baptized:</p><blockquote><p>“He who <strong>believes and is baptized</strong> will be saved; but he who does not believe will be condemned” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L16">Mark. 16:16</a>)</p></blockquote><p>So among the necessary conditions of salvation are acquiring <strong>faith</strong> and receiving <strong>baptism</strong>. Without fulfilling these conditions a person cannot be saved. However, it is difficult to apply the requirement of faith to infants, so they are baptized through the faith of their sponsors, for which there are also biblical grounds (<a href="#HH-The-Action-of-Gods-Grace-Through-the-Faith-of-Other-People">more</a>).</p><p>One should also pay special attention to the following words: whoever does not believe will be condemned. But does it then turn out that infants will be condemned, since they cannot believe?</p><blockquote><p>“He who believes and is baptized will be saved; but <strong>he who does not believe will be condemned</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L16">Mark. 16:16</a>)</p></blockquote><p>The point here is that the requirement of faith in this verse refers only to adults. Baptism itself, as the Savior said in another place (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>), is necessary for everyone, including infants. The infant will grow up having already put on Christ in Baptism (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal. 3:27</a>) through the faith of the sponsors (<a href="#HH-The-Action-of-Gods-Grace-Through-the-Faith-of-Other-People">more</a>). To the extent of the infant’s growing abilities, he will be strengthened in the faith by his sponsors. And if misfortune happens and the infant dies in tragic circumstances, then, as one baptized, he attains the Kingdom of Heaven and eternal life with Christ.</p><p>As for the order of the Savior’s words (believe and be baptized), there is also the reverse order:</p><blockquote><p>“John came <strong>baptizing in the wilderness and preaching</strong> a baptism of repentance for the remission of sins” (<a href="https://bibleox.com/en/eng-nkjv/mk/1/#L4">Mark. 1:4</a>)</p></blockquote><p>Let them then admit here too that first the baptism of repentance was given, and then the preaching was heard.</p><h3>But Christ Was Baptized Only at 30?</h3><p>The baptism of the prophet John the Baptist is not baptism into Christ. Those who already had John’s baptism the Apostle Paul baptized again into Christ:</p><blockquote><p>“he said to them, ‘Did you receive the Holy Spirit when you believed?’ So they said to him, ‘We have not so much as heard whether there is a Holy Spirit.’ And he said to them, ‘<strong>Into what then were you baptized?</strong>’ So they said, ‘<strong>Into John’s baptism</strong>.’ Then Paul said, ‘<strong>John indeed baptized with a baptism of repentance</strong>, saying to the people that they should believe on Him who would come after him, that is, on Christ Jesus.’ When they heard this, <strong>they were baptized in the name of the Lord Jesus. And when Paul had laid hands on them, the Holy Spirit came upon them</strong>, and they spoke with tongues and prophesied” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L2-6">Act. 19:2-6</a>)</p></blockquote><p>Besides, it is strange to hear such an accusation from those who do not imitate Christ in this, are not baptized at 30, and baptize their children, though not in infancy, yet without waiting for their 30th birthday, baptizing them at 8–12 years. If the accuser of the Church believes that in the age of baptism one must imitate Christ (His baptism by John), then to receive baptism he, apparently, must also wait until he is 30. However, this is wrong, because the baptism of repentance from the prophet John is not baptism into Christ (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L2-6">Act. 19:2-6</a>). Christ waited until 30 not in order to be baptized, but in order to come out to His ministry (<a href="https://bibleox.com/en/eng-nkjv/chis/4/#L3">Num. 4:3</a>), to preaching, to reveal His glory. His preaching began with the witness of the prophet John, who points to Jesus, who came to him to be baptized, as the Christ. John is a prophet. When will he point to the fulfillment of the prophecy of the Savior’s coming? When will he point to the Savior? When the Savior is ready to come out to His ministry — at 30 (<a href="https://bibleox.com/en/eng-nkjv/chis/4/#L3">Num. 4:3</a>).</p><h3>But the Wise Thief Did Not Manage to Receive Baptism and Was Still Saved?</h3><p>This was at a time when the Lord had not yet instituted the sacrament of baptism. The thief, who believed and repented, was saved without water baptism just as the Old Testament righteous were saved before the creation of the New Testament Church, which would appear only 52 days (2+40+10) after the crucifixion of Christ.</p><p><strong>Baptism is birth of water and the Spirit</strong></p><blockquote><p>“Jesus answered, ‘Most assuredly, I say to you, <strong>unless one is <mark>born of water and the Spirit</mark>, he cannot enter the kingdom of God</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L5">John. 3:5</a>)</p></blockquote><p><strong>Christ will baptize with the Holy Spirit</strong></p><blockquote><p>“John answered, saying to all, ‘I indeed baptize you with water; but One mightier than I is coming, whose sandal strap I am not worthy to loose. <strong><mark>He will baptize you with the Holy Spirit</mark></strong> and fire’” (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L16">Luke. 3:16</a>) (<a href="https://bibleox.com/en/eng-nkjv/mf/3/#L11">Matt. 3:11</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/1/#L8">Mark. 1:8</a>)</p></blockquote><p><strong>Until Christ goes away, the Holy Spirit will not come</strong></p><blockquote><p>“Nevertheless I tell you the truth. It is to your advantage that I go away; for <strong><mark>if I do not go away, the Helper will not come to you</mark></strong>; but if I depart, I will send Him to you” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L7">John. 16:7</a>) (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L16">John. 14:16</a>) (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L26">John. 14:26</a>) (<a href="https://bibleox.com/en/eng-nkjv/in/7/#L38-39">John. 7:38-39</a>)</p></blockquote><blockquote><p>“But <strong><mark>when the Helper comes, whom I shall send to you</mark></strong> from the Father, the Spirit of truth who proceeds from the Father, He will testify of Me” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L26">John. 15:26</a>)</p></blockquote><blockquote><p>“Behold, I send the Promise of My Father upon you; but <strong>tarry in the city of Jerusalem until you are endued with power from on high</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L49">Luke. 24:49</a>)</p></blockquote><p><strong>Christ after the resurrection had not yet ascended to the Father</strong></p><blockquote><p>“Jesus said to her, ‘Do not cling to Me, for <strong><mark>I have not yet ascended to My Father</mark></strong>; but go to My brethren and say to them, “I am ascending to My Father and your Father, and to My God and your God”’” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L17">John. 20:17</a>)</p></blockquote><p><strong>The promised baptism with the Holy Spirit first took place 50 days after the Resurrection of Christ</strong></p><blockquote><p>“…of all that Jesus began both to do and teach, until the day in which He was taken up, after He through the Holy Spirit had given commandments to the apostles whom He had chosen, to whom He also presented Himself alive after His suffering by many infallible proofs, <strong>being seen by them during forty days</strong> and speaking of the things pertaining to the kingdom of God. And <strong>being assembled together with them, He commanded them not to depart from Jerusalem, but to wait for the Promise of the Father, ‘which,’ He said, ‘you have heard from Me; for <mark>John truly baptized with water, but you shall be baptized with the Holy Spirit not many days from now</mark>’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L1-5">Act. 1:1-5</a>)</p></blockquote><blockquote><p>“…of all that Jesus began both to do and teach, until the day in which He was taken up, after He through the Holy Spirit had given commandments to the apostles whom He had chosen, to whom He also presented Himself alive after His suffering by many infallible proofs, <strong><mark>being seen by them during forty days</mark></strong> and speaking of the things pertaining to the kingdom of God. And <strong>being assembled together with them, He commanded them not to depart from Jerusalem, but to wait for the Promise of the Father, ‘which,’ He said, ‘you have heard from Me; for John truly baptized with water, but you shall be baptized with the Holy Spirit <mark>not many days from now</mark>.’</strong> &lt;...&gt; ‘But you shall receive power when the Holy Spirit has come upon you; and you shall be witnesses to Me in Jerusalem, and in all Judea and Samaria, and to the end of the earth.’ Now when He had spoken these things, while they watched, He was taken up, and a cloud received Him out of their sight” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L1-5,8-9">Act. 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong>When the Day of Pentecost had fully come</strong>, they were all with one accord in one place. &lt;...&gt; Then <strong><mark>there appeared to them divided tongues, as of fire, and one sat upon each of them. And they were all filled with the Holy Spirit</mark></strong> and began to speak with other tongues, as the Spirit gave them utterance” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L1,3-4">Act. 2:1,3-4</a>)</p></blockquote><p>However, the sending of the Holy Spirit is spoken of on the very day of Christ’s Resurrection, but nothing is said about Baptism. This was the establishment of the priestly hierarchy, together with the giving of the authority to forgive and retain sins:</p><blockquote><p>“<strong>Now on the first day of the week Mary Magdalene went to the tomb</strong> early, &lt;...&gt; <strong>Then, the same day at evening, being the first day of the week</strong>, when the doors were shut where the disciples were assembled, for fear of the Jews, <strong>Jesus came</strong> and stood in the midst, and said to them, ‘Peace be with you.’ &lt;...&gt; <strong>And when He had said this, He breathed on them, and said to them, ‘Receive the Holy Spirit’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L1,19,22">John. 20:1,19,22</a>)</p></blockquote><h3>“Do Not Forbid the Little Children to Come to Christ”</h3><p>Societies that have separated from the Church accuse the Church that her teaching on the impossibility of salvation without Baptism (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>) supposedly hinders the salvation of infants. By this the Church supposedly does not let infants come to Christ. They refer to the following verse:</p><blockquote><p>“Then <strong>they also brought infants to Him</strong> that He might touch them; but when the disciples saw it, they rebuked them. But Jesus called them to Him and said, ‘<strong>Let the little children come to Me, and do not forbid them</strong>; for of such is the kingdom of God’” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L15-16">Luke. 18:15-16</a>)</p></blockquote><p>In fact, this verse exposes precisely the opponents of infant baptism.</p><p>What literally happens in this biblical situation?</p><ol><li><p><strong>Mothers carry infants to Christ</strong>, so that the Lord may bless them;</p></li><li><p><strong>The disciples stand in the mothers’ way</strong>, forbidding them to bring infants to Christ;</p></li><li><p><strong>The Lord opens the way to the mothers</strong>, telling the disciples not to hinder bringing infants to Him, and blesses the infants (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L16">Mark. 10:16</a>).</p></li></ol><p>What do the opponents of the Church do?</p><ol><li><p>Mothers want to unite their infants with Christ from birth (we know this personally from mothers who have left sects);</p></li><li><p>The opponents of the Church stand in the mothers’ way, literally forbidding them baptism, which the Bible calls putting on Christ (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L27">Gal. 3:27</a>).</p></li></ol><p>What does the Church do?</p><ol><li><p>She calls mothers to Christ together with their infants;</p></li><li><p>When mothers bring their infants, the Church unites the infants with Christ through Baptism, the Eucharist and sacred things, and gives them a blessing.</p></li></ol><p>The opponents of the Church turn everything upside down. The Church’s call to mothers and infants to come to Christ they call a hindrance to union with Christ, and their own prohibitions on mothers baptizing their infants they call “not hindering” children from coming to Christ.</p><p>The teaching of the Church in no way hinders Christ from saving infants, if they were saved without Baptism. But the sectarians’ prohibition on baptizing infants greatly hinders the salvation of infants, considering that Christ said that without Baptism no one can enter the Kingdom of God (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>).</p><h3>Does the Remission of Sins Take Place When Faith Is Acquired, and Not in Immersion in Water?</h3><p>Many neo-Protestants call water baptism only a testimony (a kind of sign), while the regeneration of a person and the forgiveness of sins, as they think, takes place earlier, as soon as the person has believed and apologized to God for his sins. However, in Scripture we see that it is precisely in water Baptism that a person is regenerated and sins are washed away; it is precisely this that is saving for a person.</p><p>Saul (the future Apostle Paul) is blinded by Christ and immediately <strong>believes</strong> in Him, yet this did not lead to the forgiveness of his sins. Saul is sent to Damascus to be washed from his sins through receiving water Baptism:</p><blockquote><p>“So I answered, ‘Who are You, Lord?’ And He said to me, ‘I am Jesus of Nazareth, whom you are persecuting.’ &lt;...&gt; So I said, ‘<strong><mark>What shall I do, Lord?</mark></strong>’ And the Lord said to me, ‘Arise and <strong>go into Damascus</strong>, and there you will be told all things which are appointed for you to do.’ And since I could not see for the glory of that light, being led by the hand of those who were with me, I came into Damascus. Then a certain <a href="https://bibleox.com/ru/ru/w/%D0%90%D0%BD%D0%B0%D0%BD%D0%B8%D1%8F-%D0%B5%D0%BF%D0%B8%D1%81%D0%BA%D0%BE%D0%BF-%D0%94%D0%B0%D0%BC%D0%B0%D1%81%D0%BA%D0%B0-I-%D0%B2%D0%B5%D0%BA">Ananias</a>, a devout man according to the law, having a good testimony with all the Jews who dwelt there, came to me; and he stood and said to me, ‘Brother Saul, receive your sight.’ And at that same hour I looked up at him” (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L8,10-13">Act. 22:8,10-13</a>)</p></blockquote><p>The believing Saul needs to be washed from sins through Baptism:</p><blockquote><p>“And now why are you waiting? Arise and <strong><mark>be baptized, and wash away your sins</mark></strong>, calling on the name of the Lord” (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L16">Act. 22:16</a>)</p></blockquote><p>In another place it is said directly that Baptism saves (and does not merely bear witness):</p><blockquote><p>“And <strong><mark>baptism</mark></strong>, which this prefigured, now <strong><mark>saves</mark></strong> you — not as a removal of dirt from the body, but as an appeal to God for a good conscience, through the resurrection of Jesus Christ” (<a href="https://bibleox.com/en/en-nrsv/1pet/3/#L21">1 Pet. 3:21</a>) (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L5">Titus. 3:5</a>)</p></blockquote><h3>Is a Person Born Spiritually from the Preaching About Christ?</h3><p>Neo-Protestants who reject God’s action in the sacraments also deny the spiritual birth of a person in the waters of baptism. Denying it, they teach that this very birth “of water and the Spirit” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5">John. 3:3,5</a>) supposedly happens only at the moment of preaching, and everything else is solemn symbolic ceremony. To substantiate this idea they cite such quotes:</p><blockquote><p>“Of His own will <strong>He brought us forth by the word</strong> of truth, that we might be a kind of firstfruits of His creatures” (<a href="https://bibleox.com/en/eng-nkjv/iak/1/#L18">James. 1:18</a>)</p></blockquote><blockquote><p>“having been <strong>born again</strong>, not of corruptible seed but incorruptible, <strong>through the word of God</strong> which lives and abides forever, because ‘All flesh is as grass, and all the glory of man as the flower of the grass. The grass withers, and its flower falls away, but the word of the LORD endures forever.’ <strong>Now this is the word which by the gospel was preached to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L23-25">1 Pet. 1:23-25</a>)</p></blockquote><p>God assists the Church’s preaching of the Gospel, acting on the soul of the hearer. This preaching can produce a revolution in a person, calling him to repentance and setting him on the path of life. The word of God is a means of awakening a person from the sleep of sin, of arousing repentance in him, of the birth of faith[1]. However, this preaching does not yet cleanse a person from sin, does not give spiritual birth of water and the Spirit (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5">John. 3:3,5</a>) in the washing of regeneration with water (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L25-26">Eph. 5:25-26</a>; <a href="https://bibleox.com/en/eng-nkjv/tit/3/#L5">Titus. 3:5</a>).</p><p>In other places it is said clearly that for the forgiveness of sins one must receive the sacrament of Baptism, performed in water:</p><blockquote><p>“And now why are you waiting? <strong>Arise and <mark>be baptized, and wash away your sins</mark></strong>, calling on the name of the Lord” (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L16">Act. 22:16</a>)</p></blockquote><p>A person without faith and repentance is not admitted to baptism. Therefore he first needs the hearing of the word of God, then faith from hearing (<a href="https://bibleox.com/en/eng-nkjv/rim/10/#L17">Rom. 10:17</a>), and only then birth of water and the Spirit, cleansing from sins and sealing with the Holy Spirit in baptism and chrismation.</p><p>First the apostle preaches the Word of God, and when the hearers of the preaching are <em>cut to the heart</em>, he calls them to receive baptism for the forgiveness of sins:</p><blockquote><p>“Now <strong><mark>when they heard</mark></strong> this, they <strong><mark>were cut to the heart</mark></strong>, and said to Peter and the rest of the apostles, <strong>‘Men and brethren, what shall we do?’</strong> Then Peter said to them, ‘<strong>Repent, and <mark>let every one of you be baptized</mark></strong> in the name of Jesus Christ <strong><mark>for the remission of sins</mark></strong>; and you shall receive the gift of the Holy Spirit’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L37-38">Act. 2:37-38</a>)</p></blockquote><h3>“Baptism — Not the Removal of the Filth of the Flesh, but a Pledge”</h3><blockquote><p>“And baptism, which this prefigured, now saves you — not as a removal of dirt from the body, but as <strong>an appeal (ἐπερώτημα) to God</strong> for a good conscience, through the resurrection of Jesus Christ” (<a href="https://bibleox.com/en/en-nrsv/1pet/3/#L21">1 Pet. 3:21</a>)</p></blockquote><p>In some translations (for example, the Russian Synodal) this place is rendered as a “promise” or “pledge”, and the NKJV has “the answer of a good conscience toward God”. The difference is fundamental: in a “promise” there is no sacrament, nothing is received from God; on the contrary, a promise is given to Him. But when we ask of God, an action (a sacrament) is expected from God’s side: through the remission of sins (on God’s part) a good and clean conscience is obtained (<a href="https://bibleox.com/en/eng-nkjv/evr/9/#L14">Heb. 9:14</a>), not burdened by past sins. And if nothing of the kind is accomplished in immersion in water, as Protestants think, then why ask God for anything at all, if He gives nothing here.</p><p>The Epistle of the Apostle Peter was written in Greek. The holy brothers Cyril and Methodius, Greeks who also knew the Slavonic language, translated ἐπερώτημα not as a promise but as an inquiry (a request): a request to God for a good conscience.</p><p>Also, one of the ancient Christians, a Greek, a bishop of the Church, Gregory the Theologian (4th century), writes that this is about a divine action — the granting of a good conscience to a person upon request (<a href="https://azbyka.ru/otechnik/Grigorij_Bogoslov/slova-izd-2007-g/40">Oration 40. On Holy Baptism</a>, in Russian).</p><p>And in general, in the New Testament texts this word (and its verb) is never translated as a promise, but as an inquiry, a question.</p><ul><li><p>ἐπερωτῆσαι — to ask (Matt. 22:46)</p></li><li><p>ἐπερωτῶσιν — they ask (Mark 7:5)</p></li><li><p>ἐπερωτῆσαι — to ask (Mark 9:32)</p></li><li><p>Ἐπερωτήσω — I will ask (Mark 11:29)</p></li><li><p>ἐπερωτῆσαι — to question (Mark 12:34)</p></li><li><p>ἐπερωτῶντα — asking (Luke 2:46)</p></li><li><p>Ἐπερωτῶ — I will ask (Luke 6:9)</p></li><li><p>Ἐπερωτηθεὶς — having been asked (Luke 17:20)</p></li><li><p>ἐπερωτᾶν — to question (Luke 20:40)</p></li><li><p>ἐπερωτήσατε — ask (John 9:23)</p></li><li><p>ἐπερωτήσας — having asked (Acts 23:34)</p></li><li><p>ἐπερωτῶσιν — to those who asked (Rom. 10:20)</p></li><li><p>ἐπερωτάτωσαν — let them ask (1 Cor. 14:35)</p></li><li><p>ἐπερώτημα — an inquiry (Church Slavonic translation) (1 Pet. 3:21)</p></li></ul><p>That is, it is not man who gives God something, as would be the case with a promise. Man only asks, but it is God who gives (it is written directly: “<strong><mark>cleanse your conscience</mark></strong>” <a href="https://bibleox.com/en/eng-nkjv/evr/9/#L14">Heb. 9:14</a>).</p><p>The apostle points out that Baptism does not wash dirt from the body (not the removal of the filth of the flesh), but inwardly washes from sin. That is, it is a sacrament, something important, hidden from the eyes, not fully comprehensible and explicable.</p><p>All this takes place by the action of the Spirit on the water, which is why the Lord Jesus Christ said that people are born of water and the Spirit, and not only of the Spirit:</p><blockquote><p>“Jesus answered and said to him, ‘Most assuredly, I say to you, unless one is born again, he cannot see the kingdom of God.’ &lt;...&gt; Jesus answered, ‘Most assuredly, I say to you, <strong>unless one is born of water and the Spirit, he cannot enter the kingdom of God</strong>. That which is born of the flesh is flesh, and that which is born of the Spirit is spirit’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>)</p></blockquote><p>Moreover, the apostle in the end says that Baptism saves:</p><blockquote><p>“There is also an antitype which now <strong><mark>saves</mark></strong> us — <strong><mark>baptism</mark></strong> (not the removal of the filth of the flesh, but the answer of a good conscience toward God), through the resurrection of Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L21">1 Pet. 3:21</a>)</p></blockquote><p>With which neo-Protestants (Baptists) fundamentally disagree. For them Baptism is only a solemn promise, which is a formality and is not saving. But the apostle says that Baptism is precisely what <strong>saves</strong>.</p><p>They believe that at the moment of acquiring faith and repentance they receive the forgiveness of sins, but the Apostle Paul, although he believed, was later told to receive Baptism for the washing away of sins:</p><blockquote><p>“And now why are you waiting? <strong>Arise and <mark>be baptized, and wash away your sins</mark></strong>, calling on the name of the Lord” (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L16">Act. 22:16</a>)</p></blockquote><p>The same is said here too:</p><blockquote><p>“Then Peter said to them, ‘Repent, and <strong><mark>let every one of you be baptized</mark></strong> in the name of Jesus Christ <strong><mark>for the remission of sins</mark></strong>; and you shall receive the gift of the Holy Spirit’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Act. 2:38</a>)</p></blockquote><h3>Is It Not Baptism, but the Word of God That Cleanses from Sins?</h3><blockquote><p>“Husbands, love your wives, just as Christ also loved the church and gave Himself for her, that He might sanctify and <strong>cleanse her with the washing of water by the word</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L25-26">Eph. 5:25-26</a>)</p></blockquote><p>Christ gave Himself for the Church in order to sanctify her. How to cleanse her? <em>— “with the washing of water”,</em> that is, by holy baptism, in which, with a threefold immersion in water, the words are spoken: in the name of the Father and of the Son and of the Holy Spirit (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L19">Matt. 28:19</a>). It is this word that is spoken of here. And one may exclude neither the one (the water) nor the other (the words about the Father, the Son and the Holy Spirit). To interpret otherwise would be to tear the words out of context. It is about the word that is spoken at the <em>washing of water</em>.</p><h3>About the Centurion Cornelius. Is the Holy Spirit Given Without Baptism?</h3><p>Supporters of charismatic sects defend their doctrine of supposedly receiving the Holy Spirit simply through prayer. In their defense they cite the case when the Holy Spirit came, the only time, before Baptism:</p><blockquote><p>“While Peter was still speaking these words, the Holy Spirit fell upon all those who heard the word” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L44">Act. 10:44</a>)</p></blockquote><p>This is the story of the centurion Cornelius, who was a Gentile. It was not clear whether they could be baptized, whether Gentiles could be received into the Church.</p><p>Therefore the Lord gives special revelations in order to show that Gentiles may enter the Church.</p><ol><li><p>God sends to the Gentile Cornelius not the Holy Spirit, but an angel with a message that he should turn to the Church, call for and listen to the apostle in order to be saved.</p></li><li><p>The same vision is shown to the Apostle Peter three times: religiously unclean food comes down to him, and a voice commands him to kill and eat, for, the voice explains: “What God has cleansed you must not call common” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L15">Act. 10:15</a>)</p></li><li><p>When the apostle comes and begins to preach, the Holy Spirit comes upon the listening Gentiles.</p></li></ol><p>After all this, the Christians from among the Jews are astonished at what happened. How can it be that the Holy Spirit comes upon Gentiles?</p><blockquote><p>“And those of the circumcision who believed were astonished, as many as came with Peter, <strong>because the gift of the Holy Spirit had been poured out on the Gentiles also</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L45">Act. 10:45</a>)</p></blockquote><p>And then everything ends with the baptism of the Gentiles, who now could be baptized without doubt, for God Himself had pointed to this:</p><blockquote><p>“<strong>Can anyone forbid water, that these should not be baptized</strong> who have received the Holy Spirit just as we have? <strong>And he commanded them to be baptized in the name of the Lord</strong>. Then they asked him to stay a few days” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L47-48">Act. 10:47-48</a>)</p></blockquote><p>Thus this is the only case when the Holy Spirit comes before Baptism. Not instead of Baptism, but before it, for Baptism is performed anyway. And for this special descent of the Holy Spirit there is an exceptional reason — God the Holy Spirit shows that Gentiles may be received into the Church.</p><p>The descent of the Holy Spirit upon a person is itself a sacrament separate from Baptism (<a href="https://bibleox.com/en/en/w/Ch2r_Chrismation/">more</a>).</p><h3>Did the Eunuch Receive the Holy Spirit Without the Apostles?</h3><p>This question belongs to the topic of <a href="https://bibleox.com/en/en/w/Ch2r_Chrismation/#HH-If-Only-the-Apostles-Can-Impart-the-Gifts-of-the-Holy-Spirit-Why-Does-the-Holy-Spirit-Come-upon-the-Ethiopian-Eunuch-After-Baptism-by-the-Deacon-Philip">Chrismation</a>. In the case of Philip and the eunuch (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L39">Act. 8:39</a>) there is a very important nuance.</p><p>In the Russian Synodal and Church Slavonic translations this verse reads: “the Holy Spirit fell upon the eunuch, and an angel of the Lord caught Philip away”. But most interpreters, including the most ancient, among them Saint John Chrysostom, quote this text without the phrase about the descent of the Holy Spirit (αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε). It says simply (and this is how the NKJV and most English translations read it):</p><blockquote><p><em>the Spirit <s>fell upon the eunuch, and an angel</s> of the Lord caught Philip away.</em></p></blockquote><p>The Codex Sinaiticus without these words (4th century):</p><blockquote><p><em>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</em></p><p><em>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</em></p><p><em>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</em></p><p><em>καὶ ἐβάπτισεν αὐτόν.</em></p><p><em>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</em></p><p><strong><em>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</em></strong><em>,</em></p><p><em>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</em></p><p><em>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</em></p><p><em>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</em></p><p><em>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</em></p><p><em>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν. (Acts 8:39-40)</em></p></blockquote><p>The Codex Vaticanus without these words (4th century):</p><blockquote><p><em>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</em></p><p><em>οτε δε ανεβηϲαν εκ του υδατοϲ </em><strong><em>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</em></strong><em> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</em></p></blockquote><p>This is how Saint John Chrysostom quotes it (without the words about the descent of the Holy Spirit):</p><blockquote><p><em>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, </em><strong><em>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</em></strong><em>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</em></p></blockquote><p>(<a href="https://bibleox.com/el/grc/w/dNiR_%E1%BD%89%CE%BC%CE%B9%CE%BB%CE%AF%CE%B1%CE%B9_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B0%CF%82_%CE%A0%CF%81%CE%AC%CE%BE%CE%B5%CE%B9%CF%82_%CF%84%E1%BF%B6%CE%BD_%E1%BC%88%CF%80%CE%BF%CF%83%CF%84%CF%8C%CE%BB%CF%89%CE%BD#HH-%CE%9F%CE%9C%CE%99%CE%9B%CE%99%CE%91-%CE%99%CE%98%CD%B4">In acta apostolorum, ΟΜΙΛΙΑ ΙΘ</a>)</p><p>Commentary of Bishop Michael (Luzin):</p><blockquote><p><strong>The Holy Spirit fell upon the eunuch, and the Angel of the Lord caught Philip away</strong>: this is how the place reads only in a few ancient Greek manuscripts and translations (which our Slavonic and Russian translations follow) and in a few ancient interpreters; but in the greater part of the manuscripts and translations and in the interpreters (among them St. Chrysostom and Theophylact) it reads thus: the Holy Spirit caught Philip away. Whether this is an addition in some codices or an omission in others is hard to decide, but the former is more probable, and in that case is explained by the writer’s silence about the eunuch’s receiving of the Holy Spirit.</p></blockquote><p>(<a href="https://azbyka.ru/biblia/in/?Act.8:39&amp;r">source</a>, in Russian; translated from the Russian)</p><h2>Some Remarks</h2><h3>Infants Can Believe</h3><p>There is every reason to believe that infants too are capable of believing and being filled with the Holy Spirit, although they cannot answer a question by bearing witness to their faith.</p><p>The prophet David trusted in God from infancy:</p><blockquote><p>“But You are He who took Me out of the womb; <strong>You made Me trust while on My mother’s breasts</strong>. I was cast upon You from birth. From My mother’s womb You have been My God” (<a href="https://bibleox.com/en/eng-nkjv/ps/22/#L9-10">Ps. 22:9-10</a>)</p></blockquote><p>The prophet John, even before birth, senses the meeting with the Savior and rejoices at it:</p><blockquote><p>“Now <strong>Mary (pregnant with Christ — note)</strong> arose in those days and went into the hill country with haste, to a city of Judah, and entered the house of Zacharias and greeted Elizabeth. And it happened, when Elizabeth heard the greeting of Mary, that <strong>the babe (the prophet John — note) leaped in her womb</strong>; and Elizabeth was filled with the Holy Spirit” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L39-41">Luke. 1:39-41</a>)</p></blockquote><p>Christ, having set a child before Him, speaks of “these little ones” who believe in Him.</p><blockquote><p>“Then Jesus <strong>called <mark>a little child</mark></strong> to Him, set him in the midst of them, and said, ‘Assuredly, I say to you, unless you are converted and become as little children, you will by no means enter the kingdom of heaven. Therefore <strong>whoever humbles himself as this little child</strong> is the greatest in the kingdom of heaven. <strong>Whoever receives one little child like this</strong> in My name receives Me. <strong>Whoever causes one of these little ones <mark>who believe in Me</mark></strong> to sin, it would be better for him if a millstone were hung around his neck, and he were drowned in the depth of the sea’” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L2-6">Matt. 18:2-6</a>)</p></blockquote><p>Children glorified Christ at His entry into Jerusalem:</p><blockquote><p>“But when the chief priests and scribes saw the wonderful things that He did, and <strong>the children crying out in the temple and saying, ‘Hosanna to the Son of David!’</strong> they were indignant and said to Him, ‘Do You hear what these are saying?’ And Jesus said to them, ‘Yes. Have you never read, “Out of the mouth of babes and nursing infants You have perfected praise”?’” (<a href="https://bibleox.com/en/eng-nkjv/mf/21/#L15-16">Matt. 21:15-16</a>)</p></blockquote><h3>It Is Not Said That Anyone Can Be Saved Without Baptism</h3><p>In the Bible there are no indications that anyone can be saved without Baptism. But it is said that no one can enter the Kingdom of God without Baptism (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L3,5-6">John. 3:3,5-6</a>).</p>

  - src: миропомазание
    path: Ch2r_Chrismation
    title: Chrismation
    title_sub: One of the 7 sacraments of the Orthodox Church
    menu: { parent: Church/Sacraments, title: Chrismation, priority: 2 }
    references: |-
      <ol><li><p>Bishops could entrust the performance of some sacraments to presbyters. Without the bishop’s will this could not happen. A saint of the first century, a disciple of the apostles, Ignatius, Bishop of Antioch, writes: “See that ye all follow the bishop, even as Jesus Christ does the Father, and the presbytery as ye would the apostles; and reverence the deacons, as being the institution of God. <strong>Let no man do anything connected with the Church without the bishop</strong>. <strong>Let that be deemed a proper Eucharist, which is [administered] either by the bishop, or by one to whom he has entrusted it</strong>. Wherever the bishop shall appear, there let the multitude [of the people] also be; even as, wherever Jesus Christ is, there is the Catholic Church. <strong>It is not lawful without the bishop either to baptize or to celebrate a love-feast</strong>; but whatsoever he shall approve of, that is also pleasing to God, so that everything that is done may be secure and valid. &lt;...&gt; It is well to reverence both God and the bishop. He who honours the bishop has been honoured by God; he who does anything without the knowledge of the bishop, does [in reality] serve the devil” (<a href="https://bibleox.com/en/en/w/IgnAn_Sm/#HH-8">Epistle to the Smyrnaeans, chapters 8-9</a>)</p></li></ol><p>Anointing with oil was widespread in the Old Testament. Kings, prophets and priests were anointed with it. With a special oil, which was a great sacred thing, the temple and all its objects were anointed and thus sanctified. Anointing with oil also took place during the preaching of Christ and later:</p><blockquote><p>“So they went out and preached that people should repent. And they cast out many demons, and <strong>anointed with oil</strong> many who were sick, and healed them” (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L12-13">Mark. 6:12-13</a>)</p></blockquote><blockquote><p>“Is anyone among you sick? Let him call for the elders of the church, and let them pray over him, <strong>anointing him with oil</strong> in the name of the Lord. And the prayer of faith will save the sick, and the Lord will raise him up. And if he has committed sins, he will be forgiven” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15">James. 5:14-15</a>)</p></blockquote><p>See also: <a href="https://azbyka.ru/miropomazanie">https://azbyka.ru/miropomazanie</a> (in Russian)</p>
    body: |-
      <h2>Definition</h2><p><strong>Chrismation</strong> (receiving the gifts of the Holy Spirit) is one of the seven sacraments of the Church, in which a person receives strength (the gifts of the Holy Spirit) for traveling the spiritual path and growing. The sacrament of Chrismation is performed together with the sacrament of Baptism, immediately after it.</p><p>Originally the sacrament was performed through the laying on of the apostle’s hands with prayer. Later, but still in the time of the apostles, the laying on of hands was replaced by anointing a person with chrism (a special consecrated oil). Most likely this happened so that the sacrament could be performed not only by apostles and bishops, but also by those presbyters to whom the bishops give this right, as with the other sacraments[1]. The bishop prepares the chrism and gives it to the presbyter, who performs this sacrament. This is described in more detail in the corresponding section <a href="#HH-From-the-1st-or-2nd-Century-Anointing-with-Chrism-Replaced-the-Laying-On-of-Hands">below</a>.</p><h2>An Indication of the Sacrament of Imparting the Gifts of the Holy Spirit</h2><p>The sermon of the Apostle Peter.</p><p>The Apostle Peter calls to Baptism for the forgiveness of sins, and then additionally speaks of the need to receive the gift of the Holy Spirit:</p><blockquote><p>“Then Peter said to them, ‘Repent, and <strong><mark>let every one of you be baptized</mark></strong> in the name of Jesus Christ for the remission of sins; <strong><u><mark>and</mark></u><mark> you shall receive the gift of the Holy Spirit</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L38">Act. 2:38</a>)</p></blockquote><h2>The Gifts of the Holy Spirit Are Imparted Through the Laying On of the Apostles’ Hands</h2><p>The Evangelist Luke in the book of the Acts of the Apostles says directly that “through the laying on of the apostles’ hands the Holy Spirit was given” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L18">Act. 8:18</a>). These are not the words of Simon, but the words of the Evangelist Luke, the author of Acts. Moreover, further on the Apostle Peter speaks directly of the imparting of the gifts of the Holy Spirit as a gift of God, but rebukes Simon for having planned to obtain this gift for money:</p><blockquote><p>“… Then they laid hands on them, and they received the Holy Spirit. And when Simon saw that <strong><mark>through the laying on of the apostles’ hands the Holy Spirit was given</mark></strong>, he offered them money, saying, ‘Give me this power also, that anyone on whom I lay hands may receive the Holy Spirit.’ But Peter said to him, ‘Your money perish with you, because <strong>you thought that the gift of God could be purchased</strong> with money!’” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L17-20">Act. 8:17-20</a>)</p></blockquote><p>The Apostle Paul baptizes in Ephesus. Immediately after baptism he lays on hands to impart the gifts of the Holy Spirit:</p><blockquote><p>“Then Paul said, ‘John indeed baptized with a baptism of repentance, saying to the people that they should believe on Him who would come after him, that is, on Christ Jesus.’ When they heard this, <strong><mark>they were baptized</mark></strong> in the name of the Lord Jesus. <strong><mark>And when Paul had laid hands on them, the Holy Spirit came upon them</mark></strong>, and they spoke with tongues and prophesied” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L4-6">Act. 19:4-6</a>)</p></blockquote><h2>The Imparting of the Gifts of the Holy Spirit Is a Sacrament Separate from Baptism</h2><p>The Samaritans were baptized, but the Holy Spirit came later, after the laying on of the apostles’ hands.</p><p>The baptism of the Samaritans was accomplished. Nowhere is it said that there was anything wrong with this baptism. On the contrary, it is directly stated that “they had only been baptized”, and the Spirit had not yet come upon them. When the apostles heard about the Samaritans, it became clear that one of the apostles had to go to the Samaritans so that they would not only be baptized (which Philip could also do), but also receive the gifts of the Holy Spirit (which Philip could not do, since only the apostles, and those to whom they imparted this gift — the bishops — can impart the gifts of the Holy Spirit).</p><blockquote><p>“Then Philip went down to the city of Samaria and preached Christ to them. &lt;...&gt; But when they believed Philip as he preached the things concerning the kingdom of God and the name of Jesus Christ, both men and women <strong><mark>were baptized</mark></strong>. &lt;...&gt; Now when the apostles who were at Jerusalem heard that Samaria had received the word of God, <strong>they sent Peter and John to them, who, when they had come down, <mark>prayed for them that they might receive the Holy Spirit. For as yet He had fallen upon none of them. They had </mark><u><mark>only been baptized</mark></u></strong> in the name of the Lord Jesus. Then <strong><u><mark>they laid hands</mark></u><mark> on them, and they received the Holy Spirit</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L5,12,14-17">Act. 8:5,12,14-17</a>)</p></blockquote><h2>From the 1st or 2nd Century, Anointing with Chrism Replaced the Laying On of Hands</h2><p>Originally the sacrament was performed through the laying on of the hands of the apostles and bishops. Then, most likely because of the growing number of people converting to Christianity, it was very difficult for bishops to lay hands on all Christians, and so the practice was established of consecrating a special oil (chrism), which was given to the priest (presbyter) for anointing in the sacrament of Chrismation instead of the laying on of the bishop’s hands.</p><p>Indications of the sacrament being performed in this way are found both in Holy Scripture itself and in a number of the most ancient Christian writers.</p><blockquote><p>“Now He who establishes us with you in Christ and <strong>has anointed</strong> us is God, who also has sealed us and given us the Spirit in our hearts as a guarantee” (<a href="https://bibleox.com/en/eng-nkjv/2kor/1/#L21-22">2 Cor. 1:21-22</a>)</p></blockquote><blockquote><p>“But <strong>you have an anointing</strong> from the Holy One, and you know all things” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L20">1 John. 2:20</a>)</p></blockquote><blockquote><p>“But <strong>the anointing which you have received</strong> from Him abides in you, and you do not need that anyone teach you; but as <strong>the same anointing</strong> teaches you concerning all things, and is true, and is not a lie, and just as it has taught you, you will abide in Him” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L27">1 John. 2:27</a>)</p></blockquote><p><strong>Theophilus of Antioch, Saint, 2nd century</strong></p><blockquote><p>12. And about your laughing at me and calling me “Christian,” you know not what you are saying. First, because that which is anointed is sweet and serviceable, and far from contemptible. For what ship can be serviceable and seaworthy, unless it be first caulked [anointed]? Or what castle or house is beautiful and serviceable when it has not been anointed? And what man, when he enters into this life or into the gymnasium, is not anointed with oil? &lt;…&gt; Wherefore <strong>we are called Christians on this account, because we are anointed with the oil of God</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/theophilus-theophilus-to-autolycus/">Theophilus to Autolycus</a>)</p><p>See more quotes:</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/PAKJ0qG7_%D0%9F%D0%BE%D0%BD%D1%8F%D1%82%D0%B8%D0%B5_%D0%BE_%D1%82%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%B5_%D0%BC%D0%B8%D1%80%D0%BE%D0%BF%D0%BE%D0%BC%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D1%8F">https://bibleox.com/ru/ru/w/PAKJ0qG7_Понятие_о_таинстве_миропомазания</a> (in Russian)</p></li><li><p><a href="https://azbyka.ru/otechnik/Makarij_Bulgakov/pravoslavno-dogmaticheskoe-bogoslovie-tom2/24">https://azbyka.ru/otechnik/Makarij_Bulgakov/pravoslavno-dogmaticheskoe-bogoslovie-tom2/24</a> (in Russian)</p></li></ul><h2>Criticism</h2><h3>But the Holy Spirit Comes upon the Centurion Cornelius Without the Laying On of the Apostle’s Hands?</h3><p>The descent of the Holy Spirit upon the household of Cornelius during the preaching of the Apostle Peter is the <strong>only</strong> case when the Holy Spirit comes without the laying on of the apostle’s hands and before baptism. This exceptional case is preceded by a series of extraordinary events showing that in this way God was preparing the Church to receive the Gentiles (non-Jews). Before this, the possibility of receiving Gentiles was not at all obvious and even later caused disputes. Through such a special descent of the Holy Spirit God showed that:</p><ol><li><p>Gentiles (non-Jews) may be received into the Church;</p></li><li><p>He excluded the possibility of doubting this and of accusing people of mistaken judgments. God did this not without the apostle (the Spirit did not come at once, but first an angel was sent, who commanded that the apostle be sought out), yet the Holy Spirit Himself comes before the laying on of the apostle’s hands, clearly expressing God’s will about receiving the Gentiles.</p></li></ol><p>It is important to note that the descent of the Holy Spirit does not remove the need for the sacrament of Baptism, which the apostle performs immediately after the descent of the Holy Spirit upon the household of Cornelius:</p><blockquote><p>“There was a certain man in Caesarea called Cornelius, a centurion of what was called the Italian Regiment, &lt;...&gt; Then Peter opened his mouth and said: ‘In truth I perceive that God shows no partiality.’ &lt;...&gt; <strong>While Peter was still speaking these words, <mark>the Holy Spirit fell upon all</mark> those who heard the word</strong>. &lt;...&gt; Then Peter answered, ‘Can anyone forbid water, that these should not be baptized who have <strong>received the Holy Spirit</strong> just as we have?’ And <strong><mark>he commanded them to be baptized</mark> in the name of the Lord</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L1,34,44,46-48">Act. 10:1,34,44,46-48</a>)</p></blockquote><p>For those who want to be convinced of this in more detail, we give a detailed explanation.</p><p>At the beginning of the Church’s existence, receiving Gentiles was almost impossible. The preaching is opened only to the Jews (<a href="https://bibleox.com/en/eng-nkjv/act/11/#L19"><u>Act. 11:19</u></a>; <a href="https://bibleox.com/en/eng-nkjv/act/11/#L1,18"><u>Act. 11:1,18</u></a>; <a href="https://bibleox.com/en/eng-nkjv/act/14/#L27"><u>Act. 14:27</u></a>; <a href="https://bibleox.com/en/eng-nkjv/act/15/#L4"><u>Act. 15:4</u></a>; <a href="https://bibleox.com/en/eng-nkjv/act/15/#L7"><u>Act. 15:7</u></a>). The Church does not yet have a common understanding of whether Gentiles (that is, non-Jews) may be received.</p><p>Even one of the closest disciples, the Apostle Peter, needed special preparation: the same vision about unclean food was shown not once, but three times, with the command not to consider unclean what God has cleansed (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L15">Act. 10:15</a>; <a href="https://bibleox.com/en/eng-nkjv/act/11/#L9">Act. 11:9</a>).</p><p>So the Apostle Peter comes to Cornelius, and after the beginning of the preaching the Holy Spirit comes upon the household of Cornelius. After the descent, the apostle immediately baptizes them in water. After the baptism of the Roman centurion Cornelius, the Christians from among the Jews are amazed at what happened:</p><blockquote><p>“And those of the circumcision who believed were astonished, as many as came with Peter, because the gift of the Holy Spirit had been poured out on the Gentiles also” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L45">Act. 10:45</a>)</p></blockquote><p>In Jerusalem the Apostle Peter is reproached for baptizing a Gentile, but having heard his account of the revelation from God and the descent of the Holy Spirit upon Cornelius, they calm down (<a href="https://bibleox.com/en/eng-nkjv/act/11/#L1,18">Act. 11:1,18</a>). Even after this, the question remains not fully resolved. The Apostle Peter is in Antioch. Christians from Jerusalem from the Apostle James come there too (<a href="https://bibleox.com/en/eng-nkjv/gal/2/#L12">Gal. 2:12</a>), and here the Antiochian Jews, together with the Apostle Peter, begin to hide from those from Jerusalem, so as not to appear to associate with Gentiles.</p><p>So it is not hard to see that there was a great need for a special preparation of the Church to receive the Gentiles.</p><p>1. Even an apostle needed to be taught separately three times.</p><p>2. Christian eyewitnesses are shocked by what happened, and before the others one has to justify oneself.</p><p>3. Disputes with the apostles arise, and a whole council is convened in Jerusalem.</p><p>All this even though God intervened supernaturally and Himself, without the laying on of the apostle’s hands, came upon the Gentiles. Even despite all this, strong resistance arises. And what would have happened without it?</p><p>So the Lord acts in an exceptional way only once, in order to teach the Church to receive the Gentiles.</p><p>This special event did not abolish Baptism. The apostle immediately baptized the household of Cornelius.</p><p>Special attention should be paid to the whole chain of events, the essence of which is that God, quite predictably, can act as He Himself wishes, but… does not act without the Church.</p><p>Founders of their own Christian societies prefer to see here only a loophole for their self-appointed assembly, trying to prove that the Holy Spirit will be received by them supposedly simply from the preaching of the Gospel. But they completely ignore the fact that the Holy Spirit, who is able to act completely independently and does not need an apostle in order to come upon Cornelius and his household, did not do so without the Church.</p><p>Seeing the righteousness of Cornelius, his prayers and alms, God sends him not the gifts of the Holy Spirit, but first an angel, who commands Cornelius to find the Church. And only when the Church comes in the person of the apostle, when the one comes to whom the authority to impart the gifts of the Holy Spirit has been given, only then does He come upon Cornelius.</p><p>So the Holy Spirit can come without the Church, but does not do so. Not a single time in Scripture is there such a case. In all other cases the Spirit did not come before baptism.</p><p>The descent of the Holy Spirit during baptism means that in the course of baptism hands were laid on and the Holy Spirit came. Today the same thing is done. During baptism, immediately afterward, chrismation is also performed.</p><p>Baptism is called spiritual birth, entry into the Church, joining the body. The sending of the gifts of the Holy Spirit is not called so. Baptism, as the apostle says, saves. Does water alone save, then? Of course, also the action of the Spirit through the water. Spiritual birth in immersion in the waters of baptism does not take place without the Holy Spirit. But the sacrament of imparting the gifts of the Holy Spirit is separate. So here too the apostle reasons about these as separate actions of the Spirit:</p><blockquote><p>“For <strong>by one Spirit we were all <mark>baptized</mark></strong> into one body — whether Jews or Greeks, whether slaves or free — and have all <strong><mark>been made to drink</mark> into one Spirit</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13">1 Cor. 12:13</a>)</p></blockquote><p>1) <strong>Baptized</strong> by the Spirit and(!)</p><p>2) <strong>made to drink</strong> of the Spirit.</p><p>Both the one and the other are accomplished by the Holy Spirit. No one is born of water without the action of the Spirit.</p><p>And if these were separate notions, then there would be no need to make birth from water a condition for seeing and entering the Heavenly Kingdom. It would have been enough simply to say: of the Spirit. But the Savior, speaking of birth, speaks of both together: of water and the Spirit, omitting neither the water nor the Spirit.</p><h3>If Only the Apostles Can Impart the Gifts of the Holy Spirit, Why Does the Holy Spirit Come upon the Ethiopian Eunuch After Baptism by the Deacon Philip?</h3><p>In the case of Philip and the eunuch (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L39">Act. 8:39</a>) there is a very important nuance.</p><p>In the Russian Synodal and Church Slavonic translations this verse reads: “the Holy Spirit fell upon the eunuch, and an angel of the Lord caught Philip away”. But most interpreters, including the most ancient, among them Saint John Chrysostom, quote this text without the phrase about the descent of the Holy Spirit (αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε). It says simply (and this is how the NKJV and most English translations read it):</p><blockquote><p>the Spirit <s>fell upon the eunuch, and an angel</s> of the Lord caught Philip away.</p></blockquote><p>The Codex Sinaiticus without these words (4th century):</p><blockquote><p>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</p><p>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</p><p>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</p><p>καὶ ἐβάπτισεν αὐτόν.</p><p>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</p><p><strong>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</strong>,</p><p>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</p><p>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</p><p>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</p><p>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</p><p>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν. (Acts 8:39-40)</p></blockquote><p>The Codex Vaticanus without these words (4th century):</p><blockquote><p>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</p></blockquote><p>The Codex Alexandrinus without these words (5th century):</p><blockquote><p>και εκελευϲεν ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>π̅ν̅α̅ κ̅υ̅ ηρπαϲεν τον φιλιππο̅</strong> και ουκ ειδεν αυτον ουκετι ο ευνουχοϲ επορευετο γαρ την οδο̅ αυτου χαιρων</p><p>φιλιπποϲ δε ευρεθη ειϲ αζωτον και διερχομενοϲ ταϲ πολειϲ παϲαϲ εωϲ του ελθειν αυτο̅ ειϲ καιϲαριαν</p></blockquote><p>This is how Saint John Chrysostom quotes it (without the words about the descent of the Holy Spirit):</p><blockquote><p>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</p></blockquote><p>(<a href="https://bibleox.com/el/grc/w/dNiR_%E1%BD%89%CE%BC%CE%B9%CE%BB%CE%AF%CE%B1%CE%B9_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B0%CF%82_%CE%A0%CF%81%CE%AC%CE%BE%CE%B5%CE%B9%CF%82_%CF%84%E1%BF%B6%CE%BD_%E1%BC%88%CF%80%CE%BF%CF%83%CF%84%CF%8C%CE%BB%CF%89%CE%BD#HH-%CE%9F%CE%9C%CE%99%CE%9B%CE%99%CE%91-%CE%99%CE%98%CD%B4">In acta apostolorum, ΟΜΙΛΙΑ ΙΘ</a>)</p>

  - src: исповедь
    path: Cf5n_Confession
    title: Confession (Repentance)
    meta_desc: Bible quotes about the sacrament of Confession and repentance
    menu: { parent: Church/Sacraments, title: Confession, priority: 5 }
    body: |-
      <h2>The Confession of Sins in the Old Testament</h2><p>In the Old Testament church God Himself establishes confession in the temple before the priest and cleansing from sin through the priest:</p><blockquote><p>“And it shall be, when he is guilty in any of these matters, that <strong>he shall confess that he has sinned in that thing</strong>; and <strong>he shall bring his trespass offering to the LORD for his sin</strong> which he has committed, a female from the flock, a lamb or a kid of the goats as a sin offering. <strong>So the priest shall make atonement for him concerning his sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/5/#L5-6">Lev. 5:5-6</a>)</p></blockquote><blockquote><p>“He who covers his sins will not prosper, but <strong>whoever confesses and forsakes them will have mercy</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/28/#L13">Prov. 28:13</a>)</p></blockquote><h2>The Confession of Sins in the New Testament</h2><h3>The Priesthood Has the Authority to Forgive Sins</h3><p>God brings about a change of the priesthood (<a href="https://bibleox.com/ru/q/%D0%A2%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%BE-%D0%A1%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">more</a>):</p><blockquote><p>“For <strong>the priesthood being changed</strong>, of necessity there is also a change of the law” (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L12">Heb. 7:12</a>)</p></blockquote><p>He gives the new priesthood the authority to forgive sins:</p><blockquote><p>“And I will give you the keys of the kingdom of heaven, and whatever you bind on earth will be bound in heaven, and <strong>whatever you loose on earth will be loosed in heaven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L19">Matt. 16:19</a>)</p></blockquote><blockquote><p>“Assuredly, I say to you, whatever you bind on earth will be bound in heaven, and <strong>whatever you loose on earth will be loosed in heaven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L18">Matt. 18:18</a>)</p></blockquote><blockquote><p>“And when He had said this, He breathed on them, and said to them, ‘Receive the Holy Spirit. <strong>If you forgive the sins of any, they are forgiven them; if you retain the sins of any, they are retained</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L22-23">John. 20:22-23</a>)</p></blockquote><p>Through the prayer of the priesthood sins are forgiven:</p><blockquote><p>“Is anyone among you sick? Let him <strong>call for the elders of the church</strong>, and let them <strong>pray over him</strong>, anointing him with oil in the name of the Lord. And the prayer of faith will save the sick, and the Lord will raise him up. And <strong>if he has committed sins, he will be forgiven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15">James. 5:14-15</a>)</p></blockquote><p>The priesthood has been appointed as overseers of the Church:</p><blockquote><p>“he sent to Ephesus and called for <strong>the elders of the church</strong>. And when they had come to him, he said to them: &lt;...&gt; ‘Therefore take heed to yourselves and to all the flock, among which <strong>the Holy Spirit has made you overseers, to shepherd the church of God</strong> which He purchased with His own blood’” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L17-18,28">Act. 20:17-18,28</a>)</p></blockquote><h3>Confession Is Preserved in the Church</h3><p>At the boundary of the Old and New Testaments people came to the prophet John the Baptist and likewise confessed their sins:</p><blockquote><p>“John came baptizing in the wilderness and preaching a baptism of repentance <strong>for the remission of sins</strong>. Then <strong>all the land of Judea</strong>, and those from Jerusalem, <strong>went out to him</strong> and were all baptized by him in the Jordan River, <strong>confessing their sins</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/1/#L4-5">Mark. 1:4-5</a>)</p></blockquote><p>Confession is preserved in the Church:</p><blockquote><p>“And many <strong>who had believed</strong> came <strong>confessing and telling their deeds</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L18">Act. 19:18</a>)</p></blockquote><h3>Believers, After Acquiring the True Faith, Later Again Need the Forgiveness of New Sins</h3><p>A true believer can turn his neighbor from a false path and thereby cover a multitude of his own sins:</p><blockquote><p>“Brethren, if anyone among you <strong>wanders from the truth</strong>, and someone turns him back, let him know that <strong><mark>he who turns</mark> a sinner from the error of his way will save a soul from death and <mark>cover a multitude of sins</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L19-20">James. 5:19-20</a>)</p></blockquote><blockquote><p>“Is anyone <strong>among you</strong> sick? Let him call for the elders of the church, and let them pray over him, anointing him with oil in the name of the Lord. And the prayer of faith will save the sick, and the Lord will raise him up. And <strong><mark>if he has committed sins, he will be forgiven</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15">James. 5:14-15</a>)</p></blockquote><h2>The Lord Does Not Reject Those Who Repent</h2><p>God is always ready to accept the repentance of a sinner, however greatly he has sinned</p><blockquote><p>“The sacrifices of God are <strong>a broken spirit, a broken and a contrite heart — these, O God, You will not despise</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/51/#L17">Ps. 51:17</a>)</p></blockquote><blockquote><p>“<strong>the one who comes to Me I will by no means cast out</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/6/#L37">John. 6:37</a>)</p></blockquote>

  - src: венчание-брак
    path: Mr9g_Marriage
    title: Marriage (Crowning)
    title_sub: One of the 7 sacraments of the Orthodox Church
    menu: { parent: Church/Sacraments, title: Marriage, priority: 9 }
    body: |-
      <h2>Definition</h2><p><a href="https://azbyka.ru/brak"><strong>Marriage</strong></a> is one of the seven sacraments of the Church, in which God’s blessing is invoked upon a voluntary conjugal union, based on the mutual love of husband and wife, after the image of the spiritual union of Christ and His Church.</p><h2>Bible Quotes</h2><p>In marriage a sacrament takes place, performed by God:</p><blockquote><p>“And the LORD God said, ‘It is not good that man should be alone; I will make him a helper comparable to him.’ &lt;...&gt; Then the rib which the LORD God had taken from man He made into a woman, and He brought her to the man. &lt;...&gt; Therefore <strong>a man shall leave his father and mother and be joined to his wife, and <mark>they shall become one flesh</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L18,22,24">Gen. 2:18,22,24</a>)</p></blockquote><blockquote><p>“The Pharisees came and asked Him, ‘Is it lawful for a man to divorce his wife?’ testing Him. And He answered and said to them, ‘What did Moses command you?’ They said, ‘Moses permitted a man to write a certificate of divorce, and to dismiss her.’ And Jesus answered and said to them, ‘Because of the hardness of your heart he wrote you this precept. But from the beginning of the creation, God “made them male and female.” “For this reason a man shall leave his father and mother and be joined to his wife, and the two shall become one flesh”; so then <strong><mark>they are no longer two, but one flesh</mark>. Therefore what <mark>God has joined together</mark>, let not man separate</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L2-9">Mark. 10:2-9</a>)</p></blockquote><blockquote><p>“Do you not know that your bodies are members of Christ? Shall I then take the members of Christ and make them members of a harlot? Certainly not! Or do you not know that he who is joined to a harlot is one body with her? For <strong>‘the two,’ He says, ‘shall become one flesh’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L15-16">1 Cor. 6:15-16</a>)</p></blockquote><blockquote><p>“So husbands ought to love their own wives as their own bodies; he who loves his wife loves himself. &lt;...&gt; ‘For this reason a man shall leave his father and mother and be joined to his wife, and <strong>the two shall become one flesh.’ This is a great mystery</strong>, but I speak concerning Christ and the church. Nevertheless let each one of you in particular so love his own wife as himself, and let the wife see that she respects her husband” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L28,31-33">Eph. 5:28,31-33</a>) <em>(Greek: τὸ μυστήριον τοῦτο μέγα — “this mystery (sacrament) is great”)</em></p></blockquote><h2>On the Church’s Blessing of Marriage in the 1st Century</h2><h3>Ignatius the God-Bearer, Saint (~37-107)</h3><blockquote><p>“But it becomes both men and women who marry, <strong>to form their union with the approval of the bishop</strong>, that their marriage may be according to God, and not after their own lust”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Pol/#HH-5">Ignatius to Polycarp, 5</a>)</p>

  - src: елеосвящение-соборование
    path: Un10c_Holy_Unction
    title: Holy Unction (Anointing of the Sick)
    title_sub: One of the 7 sacraments of the Orthodox Church
    menu: { parent: Church/Sacraments, title: Holy Unction, priority: 10 }
    references: |-
      <h3>Related Material</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Spravochniki/spravochnik-pravoslavnogo-cheloveka-chast-2-tainstva-pravoslavnoj-tserkvi/8">https://azbyka.ru/otechnik/Spravochniki/spravochnik-pravoslavnogo-cheloveka-chast-2-tainstva-pravoslavnoj-tserkvi/8</a> (in Russian)</p></li><li><p><a href="https://rutube.ru/video/0cdbef5d0a4511e665f1ffccc9dc1ef3/?r=plwd">https://rutube.ru/video/0cdbef5d0a4511e665f1ffccc9dc1ef3/?r=plwd</a> (in Russian)</p></li></ol>
    body: |-
      <p><a href="https://azbyka.ru/soborovanie-eleosvyashhenie"><strong>Holy Unction</strong></a><strong> (the Anointing of the Sick)</strong> is a Church Sacrament performed over a sick person by a council of priests (in an extreme case — by one priest), consisting in invoking upon the sick person, through prayers and anointing with consecrated oil, the healing and cleansing grace that heals infirmities of body and soul.</p><p><strong>Bible quotes:</strong></p><blockquote><p>“Is anyone among you sick? Let him <strong>call for the elders of the church</strong>, and let them <strong>pray over him, <mark>anointing him with oil</mark> in the name of the Lord</strong>. And <strong>the prayer of faith will save the sick</strong>, and the Lord will raise him up. And <strong>if he has committed sins, he will be forgiven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15">James. 5:14-15</a>)</p></blockquote><blockquote><p>“So they went out and preached that people should repent. And they cast out many demons, and <strong><mark>anointed with oil many who were sick, and healed them</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L12-13">Mark. 6:12-13</a>)</p></blockquote><blockquote><p>“And when He had called His twelve disciples to Him, He <strong>gave them power</strong> over unclean spirits, to <strong>cast them out</strong>, and to <strong>heal all kinds of sickness</strong> and <strong>all kinds of disease</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L1">Matt. 10:1</a>)</p></blockquote><blockquote><p>“<strong>Heal the sick</strong>, cleanse the lepers, raise the dead, cast out demons. <strong>Freely you have received, freely give</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L8">Matt. 10:8</a>)</p></blockquote>
