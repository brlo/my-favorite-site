    path: Sf7x_Suffering_for_Christ
    title: Suffering for Christ
    menu: { parent: Church/Saints, title: Suffering for Christ, priority: 27 }
    body: |-
      <h2>Christians Are Granted Not Only to Believe, but Also to Suffer for Christ</h2><blockquote><p>“that you stand fast in one spirit, with one mind striving together for the faith of the gospel, and not in any way terrified by your adversaries, which is to them a <strong>proof</strong> of perdition, but to you of <strong>salvation</strong>, and that from God. For <strong><mark>to you it has been granted on behalf of Christ, not only to believe in Him, but also to suffer for His sake, having the same conflict</mark></strong> which you saw in me and now hear is in me” (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L27-30">Phil. 1:27-30</a>)</p></blockquote><h2>Prophecies of Persecution for Christ</h2><blockquote><p>“Remember the word that I said to you, ‘A servant is not greater than his master.’ <strong>If they persecuted Me, <mark>they will also persecute</mark> you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L20">John. 15:20</a>)</p></blockquote><blockquote><p>“Blessed are those who are persecuted for righteousness’ sake, for theirs is the kingdom of heaven. <strong>Blessed are you when <mark>they revile and persecute you</mark>, and say all kinds of evil against you falsely for My sake</strong>. Rejoice and be exceedingly glad, for <strong>great is your reward in heaven</strong>, for so they persecuted the prophets who were before you” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L10-12">Matt. 5:10-12</a>)</p></blockquote><blockquote><p>“<strong>Blessed are you when men hate you, and when they exclude you, and <mark>revile you</mark>, and cast out your name as evil, for the Son of Man’s sake</strong>. Rejoice in that day and leap for joy! For indeed <strong>your reward is great in heaven</strong>, for in like manner their fathers did to the prophets” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L22-23">Luke. 6:22-23</a>)</p></blockquote><h2>The Fulfillment of the Prophecies</h2><p>The apostles rejoiced that they had suffered for Christ:</p><blockquote><p>“So they departed from the presence of the council, <strong><mark>rejoicing</mark> that they were <mark>counted worthy to suffer shame</mark> for His name</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L41">Act. 5:41</a>)</p></blockquote><blockquote><p>“We are fools for Christ’s sake, but you are wise in Christ! We are weak, but you are strong! You are distinguished, but we are dishonored! <strong>To the present hour</strong> we both hunger and thirst, and we are poorly clothed, and beaten, and homeless. And we labor, working with our own hands. <strong><mark>Being reviled</mark></strong>, we bless; <strong><mark>being persecuted</mark></strong>, we endure; <strong><mark>being defamed</mark></strong>, we entreat. We have been made as the filth of the world, the offscouring of all things until now” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L10-13">1 Cor. 4:10-13</a>)</p></blockquote><h2>The Call Not to Fear Suffering for Christ</h2><blockquote><p>“Beloved, <strong>do not think it strange concerning the fiery trial</strong> which is to try you, as though some strange thing happened to you; but rejoice to the extent that you partake of Christ’s sufferings, that when His glory is revealed, you may also be glad with exceeding joy. <strong><mark>If you are reproached for the name of Christ, blessed are you</mark></strong>, for the Spirit of glory and of God rests upon you. On their part He is blasphemed, but on your part He is glorified. But let none of you suffer as a murderer, a thief, an evildoer, or as a busybody in other people’s matters. Yet <strong><mark>if anyone suffers as a Christian, let him not be ashamed</mark>, but let him glorify God in this matter</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L12-16">1 Pet. 4:12-16</a>)</p></blockquote><blockquote><p>“And who is he who will harm you if you become followers of what is good? But <strong>even if you should suffer for righteousness’ sake, you are blessed</strong>. ‘And do not be afraid of their threats, nor be troubled’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L13-14">1 Pet. 3:13-14</a>)</p></blockquote><h2>The Promise of Reward for Enduring Persecution for Christ</h2><p>Suffering for Christ is a sign of salvation:</p><blockquote><p>“that you stand fast in one spirit, with one mind striving together for the faith of the gospel, and <strong>not in any way terrified by your adversaries</strong>, which is to them a <strong>proof</strong> of perdition, but to you of <strong>salvation</strong>, and that from God. For to you it has been granted on behalf of Christ, not only to believe in Him, but also <strong>to suffer for His sake, having the same conflict</strong> which you saw in me and now hear is in me” (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L27-30">Phil. 1:27-30</a>)</p></blockquote><p>One who suffers with Christ will also be glorified with Him:</p><blockquote><p>“and if children, then heirs — heirs of God and joint heirs with Christ, if indeed <strong>we suffer with Him, that we may also be glorified together</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L17">Rom. 8:17</a>)</p></blockquote><p>One who dies with Christ lives and reigns with Him. And Christ denies the one who denies Him:</p><blockquote><p>“Remember that Jesus Christ, of the seed of David, was raised from the dead according to my <strong>gospel</strong>, <strong>for which I suffer trouble as an evildoer, even to the point of chains</strong>; but the word of God is not chained. &lt;...&gt; This is a faithful saying: <strong>For if we died with Him, we shall also live with Him. If we endure, we shall also reign with Him. If we deny Him, He also will deny us</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L8-12">2 Tim. 2:8-12</a>)</p></blockquote><p>Blessed are those who die in the Lord:</p><blockquote><p>“Then I heard a voice from heaven saying to me, ‘Write: “<strong>Blessed are the dead who die in the Lord</strong> from now on.”’ ‘Yes,’ says the Spirit, ‘that they may rest from their labors, and their works follow them’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L13">Rev. 14:13</a>)</p></blockquote><p>The souls of those slain for Christ live with Him in heaven:</p><blockquote><p>“When He opened the fifth seal, I saw under the altar <strong>the souls of those who had been slain for the word of God</strong> and for the testimony which they held. And they cried with a loud voice, saying, <strong>‘How long, O Lord, holy and true, until You judge and avenge our blood on those who dwell on the earth?’</strong> Then <strong>a white robe was given to each of them</strong>; and it was said to them that they should rest a little while longer, until both the number of their fellow servants and <strong>their brethren, who would be killed as they were, was completed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>)</p></blockquote>
