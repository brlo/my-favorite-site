    body: |-
      <h2>Why the Relics of the Holy Righteous Are Venerated</h2><p>The relics of the holy righteous are venerated for the same reason for which the righteous themselves are venerated in general (this is discussed in detail in the following article: <a href="https://bibleox.com/en/en/w/Vs4n_Veneration_of_the_Saints/">veneration of the saints</a>), and they are venerated because of their participation in God, because of the action of God’s grace in them (<a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">man is the temple of God</a>). The righteous person is venerated as a whole, not some separate part of him (<a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">the composition of human nature</a>). Not only the <strong>soul</strong> is venerated, but also the <strong>body </strong>(<a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21">2 Kin. 13:21</a>), and even the <strong>personal belongings </strong>(<a href="https://bibleox.com/en/eng-nkjv/act/19/#L12">Act. 19:12</a>) and the <strong>image </strong>(<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15">Act. 5:15</a>) of the righteous person, through which God grants His grace, working miracles and healings.</p><p>Since the saints <strong>are venerated because of their participation in God and the action of divine grace in them</strong>, and God grants His grace not only through the living bodies of the saints, but also through their dead bodies (<a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21">2 Kin. 13:21</a>), the bodies of the saints are venerated because of grace not only during their lifetime, but also after death (after the separation of the body from the soul).</p><p>God has no aversion to the bodily remains of His friends. God cares for the remains of the righteous (<a href="https://bibleox.com/en/eng-nkjv/ps/34/#L19-20">Ps. 34:19-20</a>; <a href="https://bibleox.com/en/eng-nkjv/in/19/#L33,36">John. 19:33,36</a>) and continues to act through them (<a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21">2 Kin. 13:21</a>). The myrrh-bearing women had no aversion to remains: on the third day after the death of the Savior they went to open His tomb in order to anoint the dead body of Christ with fragrant oil (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L1-3">Mark. 16:1-3</a>), even though the Law of Moses forbade anyone except relatives to touch the bodies of the dead (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1-4">Lev. 21:1-4</a>).</p><h2>Frequently Asked Questions</h2><h3>Why Are Relics in a Church, and Not in the Ground</h3><p><strong>The church is a tomb</strong> for the remains of the righteous person. Relics are kept in the church in a sarcophagus (a reliquary, an ark). The words of God that man is earth and therefore will return to the earth (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L19">Gen. 3:19</a>) mean that the human body, made from the earth[1], will become earth again, that is, it will decay and fall apart, becoming once more what it was originally — that is, earth.</p><p>Many righteous people were not literally buried in the ground. On the contrary, the righteous tried to bury the righteous in some special way, often choosing chambers for their burial.</p><ol><li><p><strong>Abraham buried his family in a cave purchased especially for this</strong>. Moreover, he looked for a burial place by turning to the inhabitants, and they offered him the <strong>choicest</strong> of their burial places (<a href="https://bibleox.com/en/eng-nkjv/gen/23/#L2-6">Gen. 23:2-6</a>). In the end, Abraham asked for and bought the cave he had pointed out as his own property (<a href="https://bibleox.com/en/eng-nkjv/gen/23/#L7-13,17-20">Gen. 23:7-13,17-20</a>), in order to bury his relatives there. In this same cave Abraham himself was buried (<a href="https://bibleox.com/en/eng-nkjv/gen/25/#L9-10">Gen. 25:9-10</a>), and his wife Sarah (<a href="https://bibleox.com/en/eng-nkjv/gen/23/#L19">Gen. 23:19</a>), Isaac and his wife Rebekah (<a href="https://bibleox.com/en/eng-nkjv/gen/49/#L1,29-33">Gen. 49:1,29-33</a>), Jacob and his wife Leah (<a href="https://bibleox.com/en/eng-nkjv/gen/49/#L1,29-33">Gen. 49:1,29-33</a>; <a href="https://bibleox.com/en/eng-nkjv/gen/50/#L12-13">Gen. 50:12-13</a>);</p></li><li><p><strong>The Lord Jesus Christ was buried in a special chamber in the rock</strong>, which a rich man — Joseph of Arimathea — had hewn out for himself (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L57,60">Matt. 27:57,60</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/15/#L46">Mark. 15:46</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/23/#L50-53">Luke. 23:50-53</a>; <a href="https://bibleox.com/en/eng-nkjv/in/19/#L41">John. 19:41</a>). This is exactly how God Himself had determined it from the beginning, foretelling it through the prophet Isaiah: “<em>And they made His grave with the wicked — but with the rich at His death</em>” (<a href="https://bibleox.com/en/eng-nkjv/is/53/#L9">Isa. 53:9</a>);</p></li><li><p><strong>The ancient Christians often buried the righteous in special chambers in the catacombs</strong>, where they celebrated divine services near the relics (<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85#HH-%D0%9E%D0%B1%D1%89%D0%B8%D0%BD%D0%B0-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B0-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B3%D0%BE-II-%D0%B2%D0%B5%D0%BA">example</a>, in Russian);</p></li><li><p>When, 300 years later, in the 4th century, safe times came for Christianity, the remains of the saints began to be buried in churches, placing them in a sarcophagus like the righteous Joseph (<a href="https://bibleox.com/en/eng-nkjv/gen/50/#L26">Gen. 50:26</a>, <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85#HH-%D0%93%D1%80%D0%B8%D0%B3%D0%BE%D1%80%D0%B8%D0%B9-%D0%9D%D0%B8%D1%81%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D0%B2%D1%8F%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-331-394">example</a>, in Russian), or placing them in a special chamber (a crypt) under the main part of the church (the altar), or building special separate chambers (martyria) (<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85#HH-%D0%90%D0%BC%D0%B2%D1%80%D0%BE%D1%81%D0%B8%D0%B9-%D0%9C%D0%B5%D0%B4%D0%B8%D0%BE%D0%BB%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D0%B2%D1%8F%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-397">example</a>, in Russian).</p></li></ol><p>Thus, <strong>from the most ancient times the righteous have buried the righteous in special chambers, and not in the ground</strong>. The same thing happens in the Church today: the remains of a righteous person are placed in a sarcophagus in a special chamber — a church, where divine services are celebrated.</p><p>Whichever way we act, the essence is the same:</p><ul><li><p>to build a martyrium to house the sarcophagus with the remains of the saint, where the Church gathers to celebrate divine services,</p></li><li><p>or, the other way round, to build a church for celebrating divine services and place the sarcophagus with the remains of the saint there.</p></li></ul><p>From its very earliest times the Church has built chambers to house the coffins of the saints, and celebrates divine services there.</p><h3>Translation of Remains</h3><p>The translation of the remains of the righteous took place in the Bible more than once, without any condemnation. For example, the patriarch Joseph was buried in a sarcophagus (a reliquary, an ark) in Egypt (<a href="https://bibleox.com/en/eng-nkjv/gen/50/#L26">Gen. 50:26</a>), and later the prophet Moses and the people carried the remains of Joseph through the wilderness for more than 40 years, in order to bury them in the place Joseph himself had asked for. More <a href="#HH-Episodes-About-Remains-from-the-Bible">below</a>.</p><h3>Division of Relics</h3><p>From the most ancient times, the remains of the holy righteous came to the Church after the cruelest tortures (being cut to pieces, burned), not whole and not all the parts at once (<a href="https://bibleox.com/en/eng-nkjv/mf/14/#L11">Matt. 14:11</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/6/#L28">Mark. 6:28</a>). And God afterwards acted through the remains of the righteous, regardless of whether they were gathered together or not. The Church herself, if the remains of a righteous person have been preserved whole, keeps them whole in special coffins (sarcophagi, reliquaries) placed in churches. Divisions could happen out of necessity, saving the remains during natural disasters and enemy attacks. Sometimes, for the veneration of a righteous person in another place, a very small particle, a crumb, is taken from the remains.</p><h2>God’s Attitude Toward Human Remains</h2><h3>God Preserves the Remains of the Righteous</h3><blockquote><p>“Many are the afflictions of <strong><mark>the righteous</mark></strong>, but the LORD delivers him out of them all. <strong><mark>He guards all his bones</mark>; not one of them is broken</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/34/#L19-20">Ps. 34:19-20</a>)</p></blockquote><blockquote><p>“But when they came to Jesus and saw that He was already dead, <strong>they did not break His legs</strong> &lt;…&gt;. For <strong>these things were done that the Scripture should be fulfilled, ‘<mark>Not one of His bones shall be broken</mark>’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L33,36">John. 19:33,36</a>)</p></blockquote><p>In this one can see the attitude of God Himself toward the remains of the saints. Nevertheless, God sometimes permits (but does not desire) the torture of the righteous, even beheading, as happened with the prophet John the Baptist (<a href="https://bibleox.com/en/eng-nkjv/mf/14/#L11">Matt. 14:11</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/6/#L28">Mark. 6:28</a>). But God grants grace through the divided remains of the saints as well.</p><h3>God Gives the Remains of Sinners Over to Dishonor</h3><blockquote><p>“<strong><mark>God has scattered the bones of men-pleasers</mark></strong>; they were put to shame, for God has despised them” (<a href="https://bibleox.com/en/gr-lxx-byz/ps/52/#L5">Ps. 52:5 LXX</a>) <em>(translated from the Greek: ὁ θεὸς διεσκόρπισεν ὀστᾶ ἀνθρωπαρέσκων)</em></p></blockquote><h2>God Continues to Act Through the Dead Body of a Righteous Person</h2><p>From touching the remains of the prophet Elisha a dead man came to life, although no prayer is seen being said nearby:</p><blockquote><p><em>“So it was, as they were burying a man, that suddenly they spied a band of raiders; and they put the man in the tomb of Elisha; and </em><strong><em><mark>when the man was let down and touched the bones of Elisha, he revived</mark></em></strong><em> and stood on his feet” (</em><a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21"><em>2 Kin. 13:21</em></a><em>)</em></p></blockquote><h2>God Continues to Act Through Things the Righteous Person Wore</h2><p>Healing from the clothing of the apostle:</p><blockquote><p>“so that even <strong><mark>handkerchiefs or aprons were brought from his body</mark></strong> to the sick, and the diseases left them and the evil spirits went out of them” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L12">Act. 19:12</a>)</p></blockquote><h2>God Acts Through the Image of a Righteous Person</h2><p>Healing from the image of the apostle:</p><blockquote><p>“so that <strong>they brought the sick out</strong> into the streets and laid them on beds and couches, <strong>that at least the shadow of Peter passing by might fall on some of them</strong>. Also a multitude gathered from the surrounding cities to Jerusalem, bringing sick people and those who were tormented by unclean spirits, and <strong>they were all healed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15-16">Act. 5:15-16</a>)</p></blockquote><h2>Bowing to a Saint</h2><p>The second commandment of the Decalogue (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L2-3">Ex. 20:2-3</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L6-7">Deut. 5:6-7</a>) forbids the worship of false gods (idols). False gods, besides being false, do not exist.</p><p>The saints, however, do exist; they are friends of God, and they are not worshiped as gods. Bowing to the saints and to their remains is an expression of respect for them as friends of God. Such bows to angels, people and objects are found in the Bible and are not idolatry, because idolatry is the worship of <u>false</u> <u>gods</u>. The righteous constantly bow to people, to various objects, to angels; other people bow to prophets.</p><h4><strong>Bowing to God in the Form of Angels</strong></h4><blockquote><p><em>“So he lifted his eyes and looked, and behold, </em><strong><em>three men</em></strong><em> were standing by him; and when he saw them, he ran from the tent door to meet them, and </em><strong><em>bowed himself to the ground</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/18/#L2"><em>Gen. 18:2</em></a><em>)</em></p></blockquote><h4><strong>Bowing to an Angel</strong></h4><blockquote><p><em>“So He said, ‘No, but as Commander of the army of the LORD I have now come.’ And Joshua fell on his face to the earth and </em><strong><em>worshiped</em></strong><em>, and said to Him, ‘What does my Lord say to His servant?’” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/5/#L14"><em>Josh. 5:14</em></a><em>)</em></p></blockquote><h4><strong>Bowing to a Prophet</strong></h4><blockquote><p><em>“Now when the sons of the prophets who were from Jericho saw him, they said, ‘The spirit of Elijah rests on Elisha.’ And they came to meet him, and </em><strong><em>bowed to the ground before him</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/4ts/2/#L15"><em>2 Kin. 2:15</em></a><em>)</em></p></blockquote><h4><strong>Bowing to the Temple</strong></h4><blockquote><p><em>“But as for me, I will come into Your house in the multitude of Your mercy; in fear of You </em><strong><em>I will worship toward Your holy temple</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7"><em>Ps. 5:7</em></a><em>) (Greek: προσκυνήσω πρὸς ναὸν ἅγιόν σου — “I will bow down toward Your holy temple”)</em></p></blockquote><h4><strong>Bowing to God’s Footstool</strong></h4><blockquote><p><em>“Exalt the LORD our God, and </em><strong><em>worship at His footstool</em></strong><em> (pedestal, a stand for the feet — note) — </em><strong><em>He is holy</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5"><em>Ps. 99:5</em></a><em>) (Greek: προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ — “bow down to the footstool of His feet”)</em></p></blockquote><blockquote><p><em>“Let us go into </em><strong><em>His tabernacle; let us worship at His footstool</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/132/#L7"><em>Ps. 132:7</em></a><em>)</em></p></blockquote><h4><strong>Bowing Before the Ark</strong></h4><blockquote><p><em>“Then Joshua tore his clothes, and </em><strong><em>fell to the earth on his face before the ark of the LORD</em></strong><em> until evening, he and the elders of Israel; and they put dust on their heads” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6"><em>Josh. 7:6</em></a><em>)</em></p></blockquote><h4><strong>Bowing to a Staff</strong></h4><blockquote><p><em>To a staff: “Then he said, ‘Swear to me.’ And he swore to him. So </em><strong><em>Israel bowed himself on the head of the bed</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/47/#L31"><em>Gen. 47:31</em></a><em>). In the LXX translation — </em><strong><em>to the staff</em></strong><em> (Greek: προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ — “Israel bowed down upon the top of his staff”; also </em><a href="https://bibleox.com/en/eng-nkjv/evr/11/#L21"><em>Heb. 11:21</em></a><em>)</em></p></blockquote><p>More examples: <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D0%BA%D0%BB%D0%BE%D0%BD%D1%8B">https://bibleox.com/ru/ru/w/поклоны</a> (in Russian)</p><h2>Episodes About Remains from the Bible</h2><h3>On the Third Day After the Burial the Myrrh-Bearing Women Went to Open the Tomb and Touch the Holy Body of the Lord Jesus Christ</h3><blockquote><p>“Now when the Sabbath was past, Mary Magdalene, Mary the mother of James, and Salome <strong>bought spices, that they might come and anoint Him</strong>. Very early in the morning, on the first day of the week, they came to the tomb when the sun had risen. And they said among themselves, <strong>‘Who will roll away the stone from the door of the tomb for us?’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L1-3">Mark. 16:1-3</a>)</p></blockquote><blockquote><p>“Now on the first day of the week, very early in the morning, they, and certain other women with them, <strong>came to the tomb bringing the spices which they had prepared</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L1">Luke. 24:1</a>)</p></blockquote><blockquote><p>“Now after the Sabbath, as the first day of the week began to dawn, Mary Magdalene and the other Mary came <strong>to see the tomb</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L1">Matt. 28:1</a>)</p></blockquote><blockquote><p>“Now on the first day of the week Mary Magdalene <strong>went to the tomb</strong> early, while it was still dark, and saw that the stone had been taken away from the tomb” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L1">John. 20:1</a>)</p></blockquote><h3>Translation of Remains</h3><h4>Joseph</h4><p>Joseph (the son of Jacob) asks that his remains later be carried from Egypt to the land that God had promised to give:</p><blockquote><p>“And Joseph said to his brethren, ‘I am dying; but God will surely visit you, and bring you out of this land to the land of which He swore to Abraham, to Isaac, and to Jacob.’ Then <strong>Joseph</strong> took an oath from the children of Israel, saying, ‘God will surely visit you, and <strong>you shall carry up my bones from here</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/50/#L24-25">Gen. 50:24-25</a>)</p></blockquote><p>Joseph dies; he is buried in Egypt, placed in a sarcophagus (a reliquary, an ark):</p><blockquote><p>“So <strong>Joseph</strong> died, being one hundred and ten years old; and they embalmed him, and <strong>he was put in a coffin in Egypt</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/50/#L26">Gen. 50:26</a>) <em>(Greek: καὶ ἔθαψαν αὐτὸν καὶ ἔθηκαν ἐν τῇ σορῷ — “and they buried him and placed him in the coffin (sarcophagus)”)</em></p></blockquote><p>The prophet Moses fulfills Joseph’s request:</p><blockquote><p>“So God led the people around by way of the wilderness of the Red Sea. And the children of Israel went up in orderly ranks out of the land of Egypt. And <strong>Moses took the bones of Joseph with him</strong>, for he had placed the children of Israel under solemn oath, saying, ‘God will surely visit you, and you shall carry up my bones from here with you’” (<a href="https://bibleox.com/en/eng-nkjv/ish/13/#L18-19">Ex. 13:18-19</a>)</p></blockquote><p>The prophet Moses and the people of Israel traveled across the Sinai Peninsula <strong>for more than 40 years</strong> together with the remains of Joseph. Later, Joshua the son of Nun would bury the remains of Joseph in Shechem (<a href="https://bibleox.com/en/eng-nkjv/nav/24/#L32">Josh. 24:32</a>).</p><p>If we take into account that the 40-year journey through the Sinai wilderness, that is, Israel’s movement from Egyptian slavery to the promised land, is a prefiguration of the life of the New Testament Church, which leads people out of slavery to sin and into the Heavenly Kingdom promised by God, then throughout this whole period of the Church’s life the people of God always had with them the relics of a righteous man. The Old Testament image of the Church always had with it the relics of a righteous man before it reached its kingdom.</p><h4>Saul</h4><p>Saul was killed by the Philistines, and the inhabitants of Jabesh burned the bodies and buried the bones under a tree of their city:</p><blockquote><p>“Then they put his armor in the temple of the Ashtoreths, and they fastened his body to the wall of Beth Shan. Now when the inhabitants of Jabesh Gilead heard what the Philistines had done to Saul, all the valiant men arose and traveled all night, and <strong>took the body of Saul</strong> and the bodies of his sons from the wall of Beth Shan; and they came to Jabesh and <strong>burned them there. Then they took their bones and buried them under the tamarisk tree at Jabesh</strong>, and fasted seven days” (<a href="https://bibleox.com/en/eng-nkjv/1ts/31/#L10-13">1 Sam. 31:10-13</a>) (<a href="https://bibleox.com/en/eng-nkjv/1par/10/#L12">1 Chr. 10:12</a>)</p></blockquote><p>David translates the remains of Saul to the land of Benjamin and buries them together with the remains of Saul’s father:</p><blockquote><p>“Then David went and <strong>took the bones of Saul</strong>, and the bones of Jonathan his son, from the men of Jabesh Gilead &lt;…&gt;. So <strong>he brought up the bones of Saul</strong> and the bones of Jonathan his son from there; and they gathered the bones of those who had been hanged. <strong>They buried the bones of Saul</strong> and Jonathan his son in the country of Benjamin in Zelah, <strong>in the tomb of Kish his father</strong>. So they performed all that the king commanded. And after that God heeded the prayer for the land” (<a href="https://bibleox.com/en/eng-nkjv/2ts/21/#L12-14">2 Sam. 21:12-14</a>)</p></blockquote><h3>A Case of Delayed Burial</h3><p>Jacob was committed to burial after more than 77 days:</p><blockquote><p>“Then Joseph fell on his father’s face, and wept over him, and kissed him. And Joseph commanded his servants the physicians to embalm his father. So the physicians embalmed Israel. <strong>Forty days</strong> were required for him, for such are the days required for those who are embalmed; <strong>and the Egyptians mourned for him seventy days</strong>. &lt;...&gt; ‘My father made me swear, saying, “Behold, I am dying; <strong>in my grave which I dug for myself in the land of Canaan, there you shall bury me</strong>.” Now therefore, please let me go up and bury my father, and I will come back.’ &lt;...&gt; Then they came to the threshing floor of Atad, which is beyond the Jordan, and they mourned there with a great and very solemn lamentation. He observed <strong>seven days</strong> of mourning for his father” (<a href="https://bibleox.com/en/eng-nkjv/gen/50/#L1-3,5,10">Gen. 50:1-3,5,10</a>)</p></blockquote><h3>A Prophet Asks to Be Buried Together with the Remains of Another Prophet</h3><blockquote><p>“And the prophet took up the corpse of the man of God, laid it on the donkey, and brought it back. So <strong>the old prophet</strong> came to the city to mourn, and to bury him. Then he laid the corpse in his own tomb; and they mourned over him, saying, ‘Alas, my brother!’ So it was, after he had buried him, that he spoke to his sons, saying, <strong>‘When I am dead, then bury me in the tomb where the man of God is buried; lay my bones beside his bones’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/3ts/13/#L29-31">1 Kin. 13:29-31</a>)</p></blockquote><h2>Jacob Honors the Remains of His Wife</h2><blockquote><p>“So Rachel died and was buried on the way to Ephrath (that is, Bethlehem). <strong>And Jacob set a pillar on her grave</strong>, which is the pillar of Rachel’s grave to this day” (<a href="https://bibleox.com/en/eng-nkjv/gen/35/#L19-20">Gen. 35:19-20</a>)</p></blockquote><h2>King Josiah Honors the Remains of a Prophet</h2><p>It is said of Josiah that there was no king like him before him or after him, because he turned to God with all his heart, soul and might (<a href="https://bibleox.com/en/eng-nkjv/4ts/23/#L25">2 Kin. 23:25</a>). The Judean king Josiah was obedient to God from childhood, and having reached a mature age, he began to cleanse his state of paganism. He destroyed pagan statues, altars, pagan high places for burning incense, sacred pagan groves, forbade the service of the idolatrous priests, wiped out the sorcerers and those who called up the dead, cleansed the temple of God in Jerusalem of pagan objects and repaired it, found the book of Holy Scripture, which was read to the people, and the people were brought into the Covenant with God. Josiah not only destroyed the pagan shrines, but also sought to defile them by scattering human bones:</p><blockquote><p>“Then the king defiled the high places that were east of Jerusalem, which were on the south of the Mount of Corruption, which Solomon king of Israel had built for Ashtoreth the abomination of the Sidonians, for Chemosh the abomination of the Moabites, and for Milcom the abomination of the people of Ammon. And he broke in pieces the sacred pillars and cut down the wooden images, and <strong>filled their places with the bones of men</strong>” (<a href="https://bibleox.com/en/eng-nkjv/4ts/23/#L13-14">2 Kin. 23:13-14</a>)</p></blockquote><p>Josiah destroyed the old idol of Jeroboam, defiling the burials there:</p><blockquote><p>“Moreover the altar that was at Bethel, and the high place which Jeroboam the son of Nebat, who made Israel sin, had made, both that altar and the high place he broke down; and he burned the high place and crushed it to powder, and burned the wooden image. As <strong>Josiah turned, he saw the tombs that were there on the mountain. And he sent and took the bones out of the tombs and burned them on the altar, and defiled it</strong> according to the word of the LORD which the man of God proclaimed, who proclaimed these words” (<a href="https://bibleox.com/en/eng-nkjv/4ts/23/#L15-16">2 Kin. 23:15-16</a>)</p></blockquote><p>However, when he comes across a monument and learns that it is the grave of the prophet who foretold these events, he treats his remains with reverence. Moreover, the very existence of the monument testifies to the earlier veneration of the prophet:</p><blockquote><p>“Then he said, <strong>‘What gravestone is this</strong> that I see?’ So the men of the city told him, <strong>‘It is the tomb of the man of God</strong> who came from Judah and proclaimed these things which you have done against the altar of Bethel.’ And he said, <strong><mark>‘Let him alone; let no one move his bones.’ So they let his bones alone, with the bones of the prophet</mark></strong> who came from Samaria” (<a href="https://bibleox.com/en/eng-nkjv/4ts/23/#L17-18">2 Kin. 23:17-18</a>)</p></blockquote><p>This same man of God had foretold earlier that this would happen:</p><blockquote><p>“Then he cried out against the altar by the word of the LORD, and said, ‘O altar, altar! Thus says the LORD: “Behold, <strong>a child, Josiah by name, shall be born to the house of David; and on you he shall sacrifice the priests of the high places who burn incense on you, and men’s bones shall be burned on you</strong>”’” (<a href="https://bibleox.com/en/eng-nkjv/3ts/13/#L2">1 Kin. 13:2</a>)</p></blockquote><h2>Simon Honors the Remains of His Family</h2><p>The high priest <a href="https://en.wikipedia.org/wiki/Jonathan_Apphus">Jonathan</a> (<a href="https://bibleox.com/en/en-nrsv/1mak/10/#L20">1 Macc. 10:20</a>; <a href="https://bibleox.com/en/en-nrsv/1mak/11/#L57">1 Macc. 11:57</a>) was buried in Baskama. Later, his brother the high priest Simon (<a href="https://bibleox.com/en/en-nrsv/1mak/13/#L36,42">1 Macc. 13:36,42</a>) translates his remains to the city of their ancestors — Modein, where Judas had been buried before (<a href="https://bibleox.com/en/en-nrsv/1mak/9/#L19">1 Macc. 9:19</a>). Simon erects a large structure, seeking by this to honor the remains of his family:</p><blockquote><p>“When he approached Baskama, <strong>he killed Jonathan, and he was buried there</strong>. &lt;...&gt; Simon sent and <strong>took the bones of his brother Jonathan, and buried him in Modein</strong>, the city of his ancestors. All Israel bewailed him with great lamentation, and mourned for him many days. And Simon built a monument over the tomb of his father and his brothers; he made it high so that it might be seen, with polished stone at the front and back. He also erected seven pyramids, opposite one another, for his father and mother and four brothers. For the pyramids he devised an elaborate setting, erecting about them great columns, and on the columns he put suits of armor <strong>for a permanent memorial</strong>, and beside the suits of armor he carved ships, so that they could be seen by all who sail the sea. This is <strong>the tomb</strong> that he built in Modein; it remains to this day” (<a href="https://bibleox.com/en/en-nrsv/1mak/13/#L23,25-30">1 Macc. 13:23,25-30</a>)</p></blockquote><h2>Related Quotes</h2><ol><li><p><a href="https://bibleox.com/en/en/w/Vs4n_Veneration_of_the_Saints/">Veneration of the Saints</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%B1%D0%BE%D1%80%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE">https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ps5r_Prayers_to_the_Saints/">Prayers to the Saints</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">https://bibleox.com/ru/ru/w/человек-храм-Божий</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">https://bibleox.com/ru/ru/w/состав-человека</a></p></li></ol>

