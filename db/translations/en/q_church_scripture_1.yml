    body: |-
      <ol><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/rim/1/">The Epistle of the Apostle Paul to the Romans</a> — the apostle sends the epistle ahead of his coming to Rome;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/1kor/1/">1 Corinthians</a> — rebuke of the incestuous man, of the forming of parties, of disorders at the suppers, of exalting oneself over the gift of tongues;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/2kor/1/">2 Corinthians</a> — proofs of his apostleship, encouragement to give donations;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/gal/1/">Galatians</a> — rebuke of the false teaching about the necessity of circumcision for Christians;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/ef/1/">Ephesians</a> — communication about the contemplation of God’s mysteries, consolation of the sorrowing;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/fil/1/">Philippians</a> — a greeting epistle to the church that loved the apostle most;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/kol/1/">Colossians</a> — against false teachings and a mixture of the false teachings of Gnosticism, philosophy and Judaism;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/1sol/1/">1 Thessalonians</a> — consolation concerning the fate of the dead, healing of moral ills;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/2sol/1/">2 Thessalonians</a> — clarification of the teaching about the Second Coming;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/1tim/1/">1 Timothy</a> — support and instruction at a time when false teachers were growing stronger in Ephesus;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/2tim/1/">2 Timothy</a> — the apostle’s testament before his death;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/tit/1/">Titus</a> — giving Titus authority among the Cretans;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/fm/1/">Philemon</a> — the desire to reconcile Philemon with his slave Onesimus;</p></li><li><p><a class="kanon" href="https://bibleox.com/en/eng-nkjv/evr/1/">Hebrews</a> — the falling away of Christians into Judaism, testimony to the superiority of the New Covenant over the Old, encouragement of Christians to endure sorrows.</p></li></ol>
