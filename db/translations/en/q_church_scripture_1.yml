      <h2>God Speaks Through Scripture</h2><blockquote><p>“which <strong>He</strong> promised before <strong>through His prophets in the Holy Scriptures</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L2">Rom. 1:2</a>)</p></blockquote><blockquote><p>“this <strong>Scripture</strong> had to be fulfilled, which <strong>the Holy Spirit spoke before</strong> by the mouth of David concerning Judas, who became a guide to those who arrested Jesus” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L16">Act. 1:16</a>)</p></blockquote><blockquote><p>“<strong>All Scripture is given by inspiration of God</strong>, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L16">2 Tim. 3:16</a>)</p></blockquote><h2>The Preaching of the Apostles Is the Word of God</h2><blockquote><p>“And when they arrived in Salamis, they <strong>preached <mark>the word of God</mark></strong> in the synagogues of the Jews. They also had John as their assistant” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L5">Act. 13:5</a>)</p></blockquote><blockquote><p>“But when the Jews from Thessalonica learned that <strong><mark>the word of God</mark> was preached by Paul</strong> at Berea, they came there also and stirred up the crowds” (<a href="https://bibleox.com/en/eng-nkjv/act/17/#L13">Act. 17:13</a>)</p></blockquote><blockquote><p>“For this reason we also thank God without ceasing, because when you received <strong><mark>the word of God</mark> which you heard from us, you welcomed it not as the word of men, but as it is in truth, <mark>the word of God</mark></strong>, which also effectively works in you who believe” (<a href="https://bibleox.com/en/eng-nkjv/1sol/2/#L13">1 Thess. 2:13</a>)</p></blockquote><h2>The Savior’s Commandment to Read the Scriptures</h2><blockquote><p>“<strong>You search the Scriptures</strong>, for in them you think you have eternal life; and these are they which testify of Me” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L39">John. 5:39</a>)</p></blockquote><blockquote><p>“Jesus answered and said to them, ‘<strong>You are mistaken, not knowing the Scriptures</strong> nor the power of God’” (<a href="https://bibleox.com/en/eng-nkjv/mf/22/#L29">Matt. 22:29</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/12/#L24">Mark. 12:24</a>)</p></blockquote><h2>Reading Scripture Is Profitable for Salvation</h2><blockquote><p>“and that from childhood you have known the Holy <strong>Scriptures, which are able to make you wise for salvation</strong> through faith which is in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L15">2 Tim. 3:15</a>)</p></blockquote><h2>Scripture Cannot Be Broken</h2><blockquote><p>“the Scripture cannot be broken” (<a href="https://bibleox.com/en/eng-nkjv/in/10/#L35">John. 10:35</a>)</p></blockquote><h3>Scripture Is Not a Tribute to History, but Was Written for the Person of Today</h3><blockquote><p>“For whatever things were written before <strong>were written for our learning</strong>, that we through the patience and comfort of the Scriptures might have hope” (<a href="https://bibleox.com/en/eng-nkjv/rim/15/#L4">Rom. 15:4</a>)</p></blockquote><h2>Understanding Scripture</h2><blockquote><p>“<strong>no prophecy of Scripture is of any private interpretation</strong>, for prophecy never came by the will of man, but holy men of God spoke as they were <strong>moved by the Holy Spirit</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L20-21">2 Pet. 1:20-21</a>)</p></blockquote><h3>The Apostles Knew Scripture, but They Needed the Savior’s Explanation</h3><blockquote><p>“And beginning at Moses and all the Prophets, <strong>He expounded to them in all the Scriptures the things concerning Himself</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L27">Luke. 24:27</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/24/#L32">24:32</a>)</p></blockquote><h3>God Gave the Apostles the Ability to Understand Scripture</h3><blockquote><p>“And <strong>He opened their understanding, that they might comprehend the Scriptures</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L45">Luke. 24:45</a>)</p></blockquote><h3>The Apostles Taught the Jews in the Synagogue to Understand Scripture Rightly</h3><blockquote><p>“Then the brethren immediately sent Paul and Silas away by night to Berea. When they arrived, they went into the synagogue of the Jews. These were more fair-minded than those in Thessalonica, in that they received the word with all readiness, and <strong>searched the Scriptures daily to find out whether these things were so</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/17/#L10-11">Act. 17:10-11</a>)</p></blockquote><h3>Not Everything in Scripture Is Easy to Understand. The Ignorant Twist Scripture</h3><blockquote><p>“as also in all his <strong>epistles</strong>, speaking in them of these things, <strong>in which are some things hard to understand</strong>, which untaught and unstable people twist to their own destruction, as they do also the rest of the Scriptures” (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L16">2 Pet. 3:16</a>)</p></blockquote><h3>The Jew Apollos Proved from Scripture That Jesus Is the Christ</h3><blockquote><p>“for he vigorously refuted the Jews publicly, <strong>showing from the Scriptures that Jesus is the Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/18/#L28">Act. 18:28</a>)</p></blockquote>

