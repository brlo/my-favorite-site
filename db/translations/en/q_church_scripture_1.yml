      <h2>Reading Scripture Is Profitable for Salvation</h2><p>The Apostle Paul says that the study of the Scriptures can help one to be saved:</p><blockquote><p>“and that from childhood you have known <strong>the Holy Scriptures, which are able to make you wise for salvation</strong> through faith which is in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L15">2 Tim. 3:15</a>)</p></blockquote><p>But without instruction from the Church, a wrong interpretation of Scripture can lead a person to perdition:</p><blockquote><p>“as also our beloved brother Paul, according to the wisdom given to him, has written to you, as also <strong>in all his epistles</strong>, speaking in them of these things, in which are some things hard to understand, which <strong>untaught and <mark>unstable</mark></strong> <em>(Greek: ἀστήρικτοι — “not established, not made firm”)</em> people <strong><mark>twist to their own destruction</mark>, as they do also the rest of the <mark>Scriptures</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L15-16">2 Pet. 3:15-16</a>)</p></blockquote><h2>The Need for the Right Interpretation of Scripture</h2><h3>What Was Written by the Holy Spirit Is Understood by the Bearers of the Holy Spirit</h3><p>What was written by people moved by the Holy Spirit can be rightly understood only by people of the same kind, moved by the same Holy Spirit:</p><blockquote><p>“And so <strong>we have the prophetic word confirmed</strong>, which <strong>you do well to heed</strong> as a light that shines in a dark place, until the day dawns and the morning star rises in your hearts; knowing this first, that <strong>no prophecy of Scripture is of any private interpretation</strong>, for prophecy never came by the will of man, but <strong>holy men of God spoke as they were moved by the Holy Spirit</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L19-21">2 Pet. 1:19-21</a>)</p></blockquote><h3>A Wrong Interpretation of Scripture Can Lead to Perdition</h3><p>Ignorant people, not established by the Church, interpret Scripture to their own destruction:</p><blockquote><p>“as also our beloved brother Paul, according to the wisdom given to him, has written to you, as also <strong>in all his epistles</strong>, speaking in them of these things, in which are some things hard to understand, which <strong>untaught and <mark>unstable</mark></strong> <em>(Greek: ἀστήρικτοι — “not established, not made firm”)</em> people <strong><mark>twist to their own destruction</mark>, as they do also the rest of the <mark>Scriptures</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L15-16">2 Pet. 3:15-16</a>)</p></blockquote><p>Also, the very study of Scripture is offered by the apostle only as a kind of addition to what the apostle has already instructed personally by his preaching:</p><blockquote><p>“But you must <strong>continue in the things which you have learned and been assured of</strong>, knowing from whom you have learned them, <strong>and that*</strong> from childhood you have known the Holy Scriptures, which are able to make you wise for salvation through faith which is in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L14-15">2 Tim. 3:14-15</a>)</p></blockquote><p><strong>*And that</strong> — in addition to the preceding. That is, knowledge of the Scriptures is profitable as an addition to the foundation — the teaching received from the apostle. In the next line this idea is confirmed:</p><blockquote><p>“All <strong>Scripture</strong> is given by inspiration of God, and is <strong>profitable</strong> <strong>for doctrine</strong>, for reproof, for correction, for instruction in righteousness” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L16">2 Tim. 3:16</a>)</p></blockquote><p>That is, Scripture does not stand as something on its own, but serves as a useful instrument for Bishop Timothy in his work of teaching, reproof, correction and instruction — that is, in the work of <strong>handing down</strong> the apostolic faith (Tradition).</p><blockquote><p>“holding fast <strong>the faithful word as he has been taught</strong>, that he may be able, by sound doctrine, both to exhort and convict those who contradict. For <strong>there are many insubordinate, both idle talkers and deceivers</strong>, especially those of the circumcision, whose mouths must be stopped, who subvert whole households, teaching things which they ought not, for the sake of dishonest gain” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L9-11">Titus. 1:9-11</a>)</p></blockquote><h3>The Apostles Misunderstood Christ</h3><blockquote><p>“Now when His disciples had come to the other side, they had forgotten to take bread. Then Jesus said to them, ‘Take heed and beware of the leaven of the Pharisees and the Sadducees.’ And they reasoned among themselves, saying, ‘It is because we have taken no bread.’ But Jesus, being aware of it, said to them, ‘O you of little faith, why do you reason among yourselves because you have brought no bread? Do you <strong>not yet understand</strong>, or remember the five loaves of the five thousand and how many baskets you took up? Nor the seven loaves of the four thousand and how many large baskets you took up? How is it <strong>you do not understand that I did not speak to you concerning bread</strong>? — but to beware of the leaven of the Pharisees and Sadducees.’ Then they understood that He did not tell them to beware of the leaven of bread, but of the doctrine of the Pharisees and Sadducees” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L5-12">Matt. 16:5-12</a>)</p></blockquote><h3>The Ethiopian Eunuch Could Not Understand Scripture</h3><blockquote><p>“Then the Spirit said to Philip, ‘Go near and overtake this chariot.’ So Philip ran to him, and heard him reading the prophet Isaiah, and said, ‘Do you understand what you are reading?’ And he said, ‘<strong>How can I, unless someone guides me?</strong>’ And he asked Philip to come up and sit with him” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L29-31">Act. 8:29-31</a>)</p></blockquote><h3>Christ Expounded the Prophecies of the Scriptures to the Apostles</h3><blockquote><p>“Then He said to them, ‘O foolish ones, and slow of heart to believe in all that the prophets have spoken! Ought not the Christ to have suffered these things and to enter into His glory?’ And <strong>beginning at Moses and all the Prophets, He expounded to them in all the Scriptures the things concerning Himself</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L25-27">Luke. 24:25-27</a>)</p></blockquote><h2>The Old Testament</h2><h3>The Need for the Interpretation of Scripture</h3><p>In the Old Testament, Scripture was not simply read before the people, but the priest Ezra, with other wise men, added an interpretation so that the people would understand:</p><blockquote><p>“So Ezra the scribe stood on a platform of wood which they had made for the purpose; and beside him, at his right hand, stood Mattithiah, Shema, &lt;...&gt; So they read distinctly from the book, in the Law of God; and <strong>they gave the sense</strong>, and <strong>helped them to understand the reading</strong>” (<a href="https://bibleox.com/en/eng-nkjv/neem/8/#L4,8">Neh. 8:4,8</a>)</p></blockquote>

