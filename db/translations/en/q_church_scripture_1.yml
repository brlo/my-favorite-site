      <h2>What Is Tradition?</h2><p>Tradition is the revelation of God the Father, which He, through His Only Begotten Son, handed down to the apostles, and they handed down to the rest of the Church, which hands it down from generation to generation by word (spoken and written) and by deed:</p><blockquote><p>“For <strong>I have given to them the words which You have given Me; and they have received them</strong>, and have known surely that I came forth from You; and they have believed that You sent Me” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L8">John. 17:8</a>)</p></blockquote><blockquote><p>“Now I praise you, brethren, that <strong>you remember me in all things and keep the traditions just as I delivered them to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2">1 Cor. 11:2</a>)</p></blockquote><h2>Tradition Is Not Only Texts but Also Spoken Words That Hand Down the Faith</h2><blockquote><p>“For this reason we also thank God without ceasing, because when <strong>you received <mark>the word of God which you heard(!)</mark> from us</strong>, you welcomed it not as the word of men, but as it is in truth, the word of God, which also effectively works in you who believe” (<a href="https://bibleox.com/en/eng-nkjv/1sol/2/#L13">1 Thess. 2:13</a>)</p></blockquote><blockquote><p>“<strong>Hold fast the pattern of sound words which you have heard(!) from me</strong>, in faith and love which are in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L13">2 Tim. 1:13</a>)</p></blockquote><blockquote><p>“And <strong>the things that you have heard(!) from me</strong> among many witnesses, <strong>commit these to faithful</strong> men who will be able to teach others also” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2">2 Tim. 2:2</a>)</p></blockquote><blockquote><p>“Therefore, brethren, <strong>stand fast and hold the traditions</strong> which you were taught, whether <strong>by word(!)</strong> or <strong>our epistle</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>)</p></blockquote><blockquote><p>“Therefore let that abide in you which you <strong>heard from the beginning</strong>. <strong>If what you heard(!) from the beginning abides in you, you also will abide in the Son and in the Father</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L24">1 John. 2:24</a>)</p></blockquote><blockquote><p>“Now I praise you, brethren, that <strong>you remember(!) me in all things</strong> and keep the traditions just as I delivered them to you” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2">1 Cor. 11:2</a>)</p></blockquote><blockquote><p>“<strong>Remember therefore how you have received and heard(!); hold fast</strong> and repent. Therefore if you will not watch, I will come upon you as a thief, and you will not know what hour I will come upon you” (<a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L3">Rev. 3:3</a>)</p></blockquote><h2>The Apostles Made Use of Tradition</h2><p>The apostle names two Egyptian sorcerers whose names are absent from Scripture:</p><blockquote><p>“Now as <strong>Jannes and Jambres</strong> resisted Moses, so do these also resist the truth: men of corrupt minds, disapproved concerning the faith” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L8">2 Tim. 3:8</a>)</p></blockquote><p>The apostle Jude tells of a dispute absent from Scripture:</p><blockquote><p>“Yet <strong>Michael the archangel, in contending with the devil, when he disputed about the body of Moses</strong>, dared not bring against him a reviling accusation, but said, ‘The Lord rebuke you!’” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L9">Jude. 1:9</a>)</p></blockquote><p>About the words of Enoch, absent from Scripture:</p><blockquote><p>“Now <strong>Enoch</strong>, the seventh from Adam, <strong>prophesied</strong> about these men also, saying, ‘<strong>Behold, the Lord comes with ten thousands of His saints</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L14">Jude. 1:14</a>)</p></blockquote><p>The Apostle Paul speaks of the prophet Isaiah, who was sawn in two after hiding in the hollow of a tree:</p><blockquote><p>“They were stoned, they <strong>were sawn in two</strong>, were tempted, were slain with the sword. They wandered about in sheepskins and goatskins, being destitute, afflicted, tormented” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L37">Heb. 11:37</a>)</p></blockquote><p>The evangelist Luke writes down the Gospel on the basis of words heard from eyewitnesses, that is, he writes down tradition:</p><blockquote><p>“Inasmuch as many have taken in hand to set in order a narrative of those things which have been fulfilled among us, <strong>just as those who from the beginning were eyewitnesses</strong> and ministers of the word <strong>delivered them to us</strong>, it seemed good to me also, having had perfect understanding of all things from the very first, to write to you an orderly account, most excellent Theophilus” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L1-3">Luke. 1:1-3</a>)</p></blockquote><h3>They Report Information Absent from the Gospel</h3><p>The Apostle Paul, in his talk with the Ephesian pastors, points to a teaching of Christ the Savior that is absent from the Gospel:</p><blockquote><p>“I have shown you in every way, by laboring like this, that you must support the weak. And remember the words of the Lord Jesus, that <strong>He said, ‘It is more blessed to give than to receive’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L35">Act. 20:35</a>)</p></blockquote><p>He reports the appearance of the risen Christ to a great number of people, which is also not written in the Gospel:</p><blockquote><p>“After that <strong>He was seen by over five hundred brethren</strong> at once, of whom the greater part remain to the present, but some have fallen asleep. After that He was seen by James, then by all the apostles” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L6-7">1 Cor. 15:6-7</a>)</p></blockquote><h2>The Importance of Tradition</h2><p>A wrong teaching does not lead to God:</p><blockquote><p>“Whoever <strong>transgresses and does not abide in the doctrine of Christ does not have God</strong>. He who abides in the doctrine of Christ has both the Father and the Son” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9">2 John. 1:9</a>)</p></blockquote><p>Heresies (false teachings) do not inherit the Kingdom of God:</p><blockquote><p>“<strong>heresies</strong> &lt;...&gt; of which I tell you beforehand, just as I also told you in time past, that those who practice such things <strong>will not inherit the kingdom of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L20-21">Gal. 5:20-21</a>)</p></blockquote><h2>The Necessity of Tradition</h2><p>Holy Scripture is not the source of all information about Jesus Christ:</p><blockquote><p>“And truly Jesus did many other signs in the presence of His disciples, which <strong>are not written in this book</strong>; but these are written that you may believe that Jesus is the Christ, the Son of God, and that believing you may have life in His name” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L30-31">John. 20:30-31</a>)</p></blockquote><blockquote><p>“<strong>And there are also many other things that Jesus did</strong>, which if they were written one by one, I suppose that even the world itself could not contain the books that would be written. Amen” (<a href="https://bibleox.com/en/eng-nkjv/in/21/#L25">John. 21:25</a>)</p></blockquote><p>In not a single epistle is there a teaching on how to baptize rightly, how to ordain deacons, presbyters, bishops:</p><blockquote><p>“<strong>not laying again the foundation</strong> of repentance from dead works and of faith toward God, <strong>of the doctrine of baptisms, of laying on of hands</strong>, of resurrection of the dead, and of eternal judgment” (<a href="https://bibleox.com/en/eng-nkjv/evr/6/#L1-2">Heb. 6:1-2</a>)</p></blockquote><p>Some information, as already shown above, the apostles wished to hand down orally:</p><blockquote><p>“Having many things to write to you, <strong>I did not wish to do so with paper and ink</strong>; but I hope to come to you and speak face to face, that our joy may be full” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L12">2 John. 1:12</a>)</p></blockquote><blockquote><p>“<strong>I had many things to write, but I do not wish to write to you with pen and ink</strong>; but I hope <strong>to see you shortly, and we shall speak face to face</strong>” (<a href="https://bibleox.com/en/eng-nkjv/3in/1/#L13-14">3 John. 1:13-14</a>)</p></blockquote><p>The Apostle Paul asks to keep Tradition (the instruction of the apostles), received not only in the epistles, but also from words:</p><blockquote><p>“Therefore, brethren, stand fast and hold the traditions which you <strong>were taught</strong>, whether <strong>by word</strong> or our epistle” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>)</p></blockquote><blockquote><p>“And <strong>the things that you have heard from me</strong> among many witnesses, <strong>commit these to faithful</strong> men who will be able to teach others also” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2">2 Tim. 2:2</a>)</p></blockquote><h3>The Length of the Spoken Preaching of the Apostles</h3><p>The Apostle Paul taught the presbyters of Asia for three years, night and day:</p><blockquote><p>“Therefore watch, and remember that <strong>for <mark>three years</mark> I did not cease to warn</strong> everyone night and day with tears” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L31">Act. 20:31</a>)</p></blockquote><p>For a year and a half he taught the community in Corinth:</p><blockquote><p>“After these things Paul departed from Athens and went to Corinth. &lt;...&gt; And he continued there <strong><mark>a year and six months</mark>, teaching</strong> the word of God among them” (<a href="https://bibleox.com/en/eng-nkjv/act/18/#L1,11">Act. 18:1,11</a>)</p></blockquote><p>He preached in Ephesus: first for three months in the synagogue, and then for two years with the disciples in a school:</p><blockquote><p>“And he went into the synagogue and spoke boldly for <strong>three months</strong>, reasoning and persuading concerning the things of the kingdom of God. But when some were hardened and did not believe, but spoke evil of the Way before the multitude, he departed from them and <strong>withdrew the disciples, reasoning daily in the school</strong> of Tyrannus. And <strong>this continued for <mark>two years</mark></strong>, so that all who dwelt in Asia heard the word of the Lord Jesus, both Jews and Greeks” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L8-10">Act. 19:8-10</a>)</p></blockquote><p>Altogether, the Apostle Paul alone preached for at least 30 years: from his conversion in 33-34 AD until his death in 64-67 AD.</p><h2>The Command to Keep Tradition and to Teach in Accordance with It</h2><blockquote><p>“As I urged you when I went into Macedonia — remain in Ephesus that you may charge some that they <strong>teach no other doctrine</strong>, nor give heed to fables and endless genealogies, which cause disputes rather than godly edification which is in faith” (<a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L3-4">1 Tim. 1:3-4</a>)</p></blockquote><blockquote><p>“And <strong>the things that you have heard from me</strong> among many witnesses, <strong>commit these to faithful</strong> men who will be able to teach others also” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L2">2 Tim. 2:2</a>)</p></blockquote><blockquote><p>“Therefore, brethren, <strong>stand fast and hold the traditions</strong> which you were taught, whether <strong>by word</strong> or <strong>our epistle</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>)</p></blockquote><blockquote><p>“Now I praise you, brethren, that you remember me in all things and <strong>keep the traditions</strong> just as I delivered them to you” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L2">1 Cor. 11:2</a>)</p></blockquote><blockquote><p>“Moreover, brethren, I declare to you the gospel which I preached to you, which also you received and in which you stand, by which also you are saved, if <strong>you hold fast that word</strong> which I preached to you — unless you believed in vain” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L1-2">1 Cor. 15:1-2</a>)</p></blockquote><blockquote><p>“Beloved, while I was very diligent to write to you concerning our common salvation, I found it necessary to write to you exhorting you <strong>to contend earnestly for the faith which was once for all delivered to the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude. 1:3</a>)</p></blockquote><blockquote><p>“Finally then, brethren, we <strong>urge</strong> and exhort in the Lord Jesus that <strong>you should abound more and more, just as you received from us how you ought to walk and to please God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/4/#L1">1 Thess. 4:1</a>)</p></blockquote><blockquote><p>“holding fast <strong>the faithful word as he has been taught</strong>, that he may be able, by sound doctrine, both to exhort and convict those who contradict. For <strong>there are many insubordinate, both idle talkers and deceivers</strong>, especially those of the circumcision, whose mouths must be stopped, who subvert whole households, teaching things which they ought not, for the sake of dishonest gain” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L9-11">Titus. 1:9-11</a>)</p></blockquote><blockquote><p>“But I fear, lest somehow, as the serpent deceived Eve by his craftiness, so your minds may be corrupted from the simplicity that is in Christ. For if he who comes <strong>preaches another Jesus whom we have not preached</strong>, or if you receive a different spirit which you have not received, or <strong>a different gospel which you have not accepted</strong> — you may well put up with it! &lt;...&gt; For such are false apostles, deceitful workers, transforming themselves into apostles of Christ. And no wonder! For Satan himself transforms himself into an angel of light. Therefore it is no great thing if his ministers also transform themselves into ministers of righteousness, whose end will be according to their works” (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L3-4,13-15">2 Cor. 11:3-4,13-15</a>)</p></blockquote><h2>Withdraw from Those Who Bring In a New Teaching</h2><blockquote><p>“<strong>Reject a divisive man</strong> <em>(Greek: αἱρετικὸν ἄνθρωπον — “a heretic”)</em> after the first and second admonition” (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L10">Titus. 3:10</a>)</p></blockquote><blockquote><p>“<strong>If anyone teaches otherwise</strong> and does not consent to wholesome words, even the words of our Lord Jesus Christ, and to the doctrine which accords with godliness, <strong>he is proud, knowing nothing, but is obsessed with disputes and arguments over words</strong>, from which come envy, strife, reviling, evil suspicions &lt;...&gt; <strong>From such withdraw yourself</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L3-5">1 Tim. 6:3-5</a>)</p></blockquote><blockquote><p>“O Timothy! <strong>Guard what was committed to your trust</strong>, <strong>avoiding the profane and idle babblings and contradictions of what is falsely called knowledge</strong> — by professing it some have strayed concerning the faith. Grace be with you. Amen” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L20-21">1 Tim. 6:20-21</a>)</p></blockquote><blockquote><p>“But we command you, brethren, in the name of our Lord Jesus Christ, that you <strong>withdraw from every brother who walks</strong> disorderly and <strong>not according to the tradition</strong> which he received from us” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L6">2 Thess. 3:6</a>)</p></blockquote><blockquote><p>“Now I urge you, brethren, <strong>note those who cause divisions and offenses, contrary to the doctrine which you learned, and avoid them</strong>. For those who are such do not serve our Lord Jesus Christ, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18">Rom. 16:17-18</a>)</p></blockquote><blockquote><p>“<strong>If anyone comes to you and does not bring this doctrine, do not receive him into your house</strong> nor greet him; for he who greets him shares in his evil deeds” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L10-11">2 John. 1:10-11</a>)</p></blockquote><blockquote><p>“But even if we, or an angel from heaven, preach any other gospel to you <strong>than what we have preached to you, let him be accursed</strong> <em>(Greek: ἀνάθεμα — “anathema”)</em>. As we have said before, so now I say again, <strong>if anyone preaches any other gospel to you than what you have received, let him be accursed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/1/#L8-9">Gal. 1:8-9</a>)</p></blockquote><p><strong>Anathema</strong> (Greek ἀνάθεμα) — excommunication from the Church.</p><h2>The Need to Honor and Follow the Saints</h2><blockquote><p>“<strong><mark>Remember</mark> those who rule over you</strong>, who have spoken the word of God to you, <strong><mark>whose faith follow</mark></strong>, considering the outcome of their conduct” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L7">Heb. 13:7</a>)</p></blockquote><blockquote><p>“Therefore I urge you, <strong><mark>imitate</mark> me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L16">1 Cor. 4:16</a>)</p></blockquote><blockquote><p>“<strong><mark>Brethren, join in following my example</mark>, and <mark>note those who so walk, as you have us for a pattern</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/fil/3/#L17">Phil. 3:17</a>)</p></blockquote><p>More about the veneration of the saints: <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85-%D0%B2-%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D0%B8">https://bibleox.com/ru/ru/w/почитание-святых-в-Библии</a></p><h2>Expose Distortions of Tradition (Heresy)</h2><blockquote><p>“<strong>Fight to the death for truth</strong>, and the Lord God will fight for you” (<a href="https://bibleox.com/en/en-nrsv/prsir/4/#L28">Sir. 4:28</a>)</p></blockquote><blockquote><p>“Beloved, while I was very diligent to write to you concerning our common salvation, I found it necessary to write to you exhorting you <strong>to contend earnestly for the faith which was once for all delivered to the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude. 1:3</a>)</p></blockquote><blockquote><p>“And have no fellowship with the unfruitful works of darkness, <strong>but rather expose them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L11">Eph. 5:11</a>)</p></blockquote>

  - src: Писание-не-под-диктовку
    path: Nd3k_Scripture_Is_Not_Dictated_by_God
    title: Scripture Is Not Dictated by God
    menu: { parent: Church/Scripture, title: Scripture Is Not Dictated by God, priority: 7 }
    body: |-
      <p>The lines of Holy Scripture, although written under the inspiration of the Spirit of God (God-inspired), are nevertheless not written at God’s dictation, and the scribes are not an impersonal instrument in God’s hands, like a pencil. A prophet who is a shepherd writes in simple language, while a prophet from a royal palace writes like a highly educated person. Both turn to examples suited to their way of life. Thus, the other apostles write about the Apostle Paul that there is something hard to understand in his epistles:</p><blockquote><p>“as also in all his epistles, speaking in them of these things, in which <strong>are some things hard to understand</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/3/#L16">2 Pet. 3:16</a>)</p></blockquote><p>And the Apostle Paul himself calls himself untrained in speech, but not in knowledge:</p><blockquote><p>“Even though I am <strong>untrained in speech</strong>, yet I am not in knowledge” (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L6">2 Cor. 11:6</a>)</p></blockquote><p>That is, he writes as he can, although he suffers no lack of knowledge. And indeed, the Apostle Paul, as an educated Pharisee, resorts to complex constructions of meaning. Moreover, sometimes the apostles say directly that they are writing on their own behalf:</p><blockquote><p>“Now concerning virgins: <strong>I have no commandment from the Lord; yet I give judgment</strong> as one whom the Lord in His mercy has made trustworthy” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L25">1 Cor. 7:25</a>)</p></blockquote><p>It would be more correct to say that Holy Scripture is a joint work of God and man (co-working, synergy):</p><blockquote><p>“For we are God’s <strong>fellow workers</strong> (συνεργοί [synergoi]); you are God’s field, you are God’s building” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L9">1 Cor. 3:9</a>)</p></blockquote>

  - src: евангелисты-обращаются-к-Септуагинте
    path: Lx6s_The_Evangelists_Refer_to_the_Septuagint
    title: The Evangelists Refer to the Septuagint
    title_sub: The apostles and evangelists referred to the Septuagint (the Greek version of the Old Testament Scriptures)
    meta_desc: Bible quotes showing that the apostles and evangelists referred to the Septuagint.
    menu: { parent: Church/Scripture, title: The Evangelists Refer to the Septuagint, priority: 9 }
    references: |-
      <ol><li><p><a href="https://dssenglishbible.com/scroll4Q80.htm">https://dssenglishbible.com/scroll4Q80.htm</a></p></li><li><p><a href="https://dssenglishbible.com/scroll4Q88.htm">https://dssenglishbible.com/scroll4Q88.htm</a> see the footnote.</p></li></ol>
    body: |-
      <h2>The Septuagint (LXX) — What Is It?</h2><p><strong>The Septuagint</strong> (Latin Septuaginta — “seventy”, or LXX for short) is a translation of the books of the Old Testament made in the 3rd–2nd centuries BC from Hebrew into ancient Greek by seventy (72) Jewish translators.</p><p>Besides this Greek text, there is a text in Hebrew — the Masoretic text.</p><p><strong>The Masoretic text</strong> is the text of the Holy Scripture of the Old Testament in Hebrew, to which vowel points were added in the 7th–10th centuries AD. What are vowel points? Simply put, they are various strokes and marks over the words which make it possible to read a word correctly, indicating the vowel sounds missing from it and the peculiarities of reading. These marks are called diacritics. Since the Hebrew text consisted only of consonants, only one who knew the tradition of reading (Tradition) could read it correctly. The vowel points were placed in order to give the text a single, unambiguous reading.</p><p>The Septuagint is important because it is a text of the Jews themselves, prepared before the Jewish people rejected Jesus as the Christ and God. That is, at that time there was not yet any need to understand Scripture in such a way that less and less room would remain in it for the Lord Jesus Christ. One must also keep in mind that any translation is always an interpretation. In this case, the Septuagint is an interpretation-translation made by native bearers of the language and the tradition, from Hebrew, which few could read, into Greek, which was understood by many.</p><p><em>(Note: English translations of the Old Testament, such as the NKJV and NRSV, are made from the Masoretic text. Therefore, below the Septuagint readings are translated directly from the Greek.)</em></p><h2>Virgin or Young Woman</h2><p>The evangelist Matthew refers to Isaiah’s prophecy about the birth of Christ from a virgin:</p><blockquote><p>“Behold, <strong>the virgin</strong> (Greek: παρθένος) shall be with child, and bear a Son, and they shall call His name Immanuel, which is translated, ‘God with us’” (<a href="https://bibleox.com/en/eng-nkjv/mf/1/#L23">Matt. 1:23</a>)</p></blockquote><p>According to the Septuagint, Christ was to be born of a Virgin:</p><blockquote><p>“Therefore the Lord Himself will give you a sign: behold, <strong>the virgin</strong> (Greek: παρθένος) shall conceive and bear a Son, and you shall call His name Immanuel” (<a href="https://bibleox.com/en/gr-lxx-byz/is/7/#L14">Is. 7:14, LXX</a>)</p></blockquote><p>And according to the Masoretic text, Christ is born of an unmarried young girl: Hebrew עַלְמָ֗ה [al-maw’]. This is how the NRSV renders it:</p><blockquote><p>“Therefore the Lord himself will give you a sign. Look, <strong>the young woman</strong> is with child and shall bear a son, and shall name him Immanuel” (<a href="https://bibleox.com/en/en-nrsv/is/7/#L14">Is. 7:14, NRSV</a>)</p></blockquote><h2>Staff or Head of the Bed</h2><p>The Apostle Paul, in the epistle to the Hebrews(!), recalls how Jacob bowed down on the top of his staff:</p><blockquote><p>“By faith Jacob, when he was dying, blessed each of the sons of Joseph, and worshiped, leaning on <strong>the top of his staff</strong> (Greek: ῥάβδου)” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L21">Heb. 11:21</a>)</p></blockquote><p>According to the Septuagint, Jacob bowed down on the top of his staff:</p><blockquote><p>“And he said, ‘Swear to me.’ And he swore to him. And Israel bowed down upon <strong>the top of his staff</strong> (Greek: ῥάβδου)” (<a href="https://bibleox.com/en/gr-lxx-byz/gen/47/#L31">Gen. 47:31, LXX</a>)</p></blockquote><p>And according to the Masoretic text, Jacob bowed down on the head of the bed: Hebrew מִּטָּֽה [mit-taw’]:</p><blockquote><p>“Then he said, ‘Swear to me.’ And he swore to him. So Israel bowed himself on <strong>the head of the bed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/47/#L31">Gen. 47:31, NKJV</a>)</p></blockquote><h2>Cainan in the Genealogy of the Lord Jesus Christ</h2><p>The evangelist Luke gives the genealogy of the Savior, mentioning Cainan between Shelah and Arphaxad:</p><blockquote><p>“the son of Serug, the son of Reu, the son of Peleg, the son of Eber, the son of Shelah, <strong>the son of Cainan</strong>, the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech, the son of Methuselah, the son of Enoch, the son of Jared, the son of Mahalalel, the son of Cainan, the son of Enosh, the son of Seth, the son of Adam, the son of God” (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L35-38">Luke. 3:35-38</a>)</p></blockquote><p>In the Septuagint Cainan (130+330 years) is present. He was begotten by Arphaxad, and he begot Shelah:</p><blockquote><p>“and <strong>Arphaxad lived, after he had begotten Cainan</strong> (Greek: Καιναν), four hundred and thirty years, and begot sons and daughters, and died. And <strong>Cainan lived a hundred and thirty years and begot Shelah</strong>. And Cainan lived, after he had begotten Shelah, three hundred and thirty years, and begot sons and daughters, and died” (<a href="https://bibleox.com/en/gr-lxx-byz/gen/11/#L13">Gen. 11:13, LXX</a>)</p></blockquote><p>In the Masoretic text Arphaxad (35+403 years) immediately begot Shelah, and there is no Cainan at all:</p><blockquote><p>“Arphaxad lived thirty-five years, and begot Salah. After he begot Salah, Arphaxad lived four hundred and three years, and begot sons and daughters” (<a href="https://bibleox.com/en/eng-nkjv/gen/11/#L12-13">Gen. 11:12-13</a>)</p></blockquote><p>A similar situation is described a chapter earlier: <a href="https://bibleox.com/en/eng-nkjv/gen/10/#L22,24">Gen. 10:22,24</a>.</p><h2>“Recovery of Sight to the Blind” or “the Opening of the Prison to Those Who Are Bound”</h2><p>The evangelist Luke points to the prophecy of the prophet Isaiah, quoting it according to the Septuagint:</p><blockquote><p>“The Spirit of the LORD is upon Me, because He has anointed Me to preach the gospel to the poor; He has sent Me to heal the brokenhearted, to proclaim liberty to the captives and <strong>recovery of sight to the blind</strong>, to set at liberty those who are oppressed; to proclaim the acceptable year of the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lk/4/#L18-19">Luke. 4:18-19</a>)</p></blockquote><p>In the Septuagint at this place stands the phrase “recovery of sight to the blind” (Greek: τυφλοῖς ἀνάβλεψιν):</p><blockquote><p>“The Spirit of the Lord is upon me, because He has anointed me; He has sent me to preach good news to the poor, to heal the brokenhearted, to proclaim release to the captives and <strong>recovery of sight to the blind</strong>, to proclaim the acceptable year of the Lord and the day of recompense, to comfort all who mourn” (<a href="https://bibleox.com/en/gr-lxx-byz/is/61/#L1-2">Is. 61:1-2, LXX</a>)</p></blockquote><p>And in the Masoretic text it is “the opening of the prison to those who are bound”: Hebrew אֲסוּרִים פְּקַח ־ קֽוֹחַ ׃ [aw-sar’ pek-akh-ko’-akh]:</p><blockquote><p>“The Spirit of the Lord GOD is upon Me, because the LORD has anointed Me to preach good tidings to the poor; He has sent Me to heal the brokenhearted, to proclaim liberty to the captives, and <strong>the opening of the prison to those who are bound</strong>; to proclaim the acceptable year of the LORD, and the day of vengeance of our God; to comfort all who mourn” (<a href="https://bibleox.com/en/eng-nkjv/is/61/#L1-2">Is. 61:1-2, NKJV</a>)</p></blockquote><p>Moreover, in the Masoretic text the same phrase turns out to be repeated in different words: “<em>to proclaim liberty to the captives, and the opening of the prison to those who are bound</em>”.</p><h2>They Pierced the Hands and Feet, or a Lion Mauls Them?</h2><p>The Septuagint contains a prophecy about Christ:</p><blockquote><p>“For many dogs have surrounded me, a congregation of evildoers has enclosed me, <strong>they pierced my hands and my feet</strong>” (<a href="https://bibleox.com/en/gr-lxx-byz/ps/21/#L16">Ps. 21:16, LXX</a>)</p></blockquote><p>The later Masoretic text (<a href="https://bibleox.com/en/heb-osm/ps/22/#L17">Ps. 22:17</a>) does not contain the words about the piercing of the hands and feet of Christ. Instead, there is the word “lion” (כָּאֲרִי — “like a lion”). The verb “maul”, meanwhile, is not in the text at all, and it is unclear how the actions of a lion relate to the hands and feet.</p><p>However, “pierced” is nevertheless correct. In the ancient Qumran scroll 4Q88[2] it is confirmed that the hands and feet were pierced. This is also how the NKJV renders it:</p><blockquote><p>“For dogs have surrounded Me; the congregation of the wicked has enclosed Me. <strong>They pierced My hands and My feet</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/22/#L16">Ps. 22:16, NKJV</a>)</p></blockquote><p>Besides, there is one more prophecy that He was pierced. It is mentioned here:</p><blockquote><p>“And again another Scripture says, <strong>‘They shall look on Him whom they <mark>pierced</mark>’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L37">John. 19:37</a>)</p></blockquote><p>The reference is to this place:</p><blockquote><p>“And I will pour on the house of David and on the inhabitants of Jerusalem the Spirit of grace and supplication; then they will look on Me whom they <strong><mark>pierced</mark></strong>. Yes, they will mourn for Him as one mourns for his only son, and grieve for Him as one grieves for a firstborn” (<a href="https://bibleox.com/en/eng-nkjv/zah/12/#L10">Zech. 12:10</a>)</p></blockquote><blockquote><p>“וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ <strong>דָּקָרוּ</strong> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃” (<a href="https://bibleox.com/en/heb-osm/zah/12/#L10">Zech. 12:10</a>)</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר — to pierce, to stab through; and to be stabbed, pierced.</p><p>The Qumran scroll 4Q80[1] confirms that He was pierced.</p>

  - src: FoSK_Причины_написания_посланий
