      <h2>Prayer for the Authorities</h2><blockquote><p>“Therefore <strong>I exhort</strong> first of all that supplications, <strong><mark>prayers</mark></strong>, intercessions, and giving of thanks be made for all men, <strong><mark>for kings and all who are in authority</mark></strong>, that we may lead a quiet and peaceable life in all godliness and reverence. For this is good and acceptable in the sight of God our Savior, who desires all men to be saved and to come to the knowledge of the truth” (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L1-4">1 Tim. 2:1-4</a>)</p></blockquote><h2>Submission to the State Authorities</h2><blockquote><p>“Remind them <strong><mark>to be subject to rulers and authorities, to obey</mark></strong>, to be ready for every good work, to speak evil of no one, to be peaceable, gentle, <strong>showing all humility</strong> to all men” (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L1-2">Titus. 3:1-2</a>)</p></blockquote><blockquote><p>“Therefore <strong><mark>submit yourselves to every ordinance of man</mark> for the Lord’s sake</strong>, whether <strong><mark>to the king</mark></strong> as <strong><mark>supreme</mark></strong>, or <strong><mark>to governors</mark></strong>, as to those who are sent by him for the punishment of evildoers and for the praise of those who do good” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L13-14">1 Pet. 2:13-14</a>)</p></blockquote><blockquote><p>“Honor all people. Love the brotherhood. Fear God. <strong><mark>Honor the king</mark></strong>. Servants, <strong>be submissive to your masters</strong> with all fear, <strong>not only to the good and gentle, but also to the harsh. For this is commendable</strong>, if because of conscience toward God one endures grief, suffering wrongfully” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L17-19">1 Pet. 2:17-19</a>)</p></blockquote><blockquote><p>“Then Paul said, ‘I did not know, brethren, that he was the high priest; for it is written, “<strong><mark>You shall not speak evil of a ruler of your people</mark></strong>”’” (<a href="https://bibleox.com/en/eng-nkjv/act/23/#L5">Act. 23:5</a>)</p></blockquote><blockquote><p>“as Sodom and Gomorrah, and the cities around them in a similar manner to these, having given themselves over to sexual immorality and gone after strange flesh, are set forth as an example, suffering the vengeance of eternal fire. Likewise also these dreamers defile the flesh, <strong><mark>reject authority, and speak evil of dignitaries</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L7-8">Jude. 1:7-8</a>)</p></blockquote><p>There is no authority except from God, and the existing authorities are appointed by God — <strong>says the apostle while living in the Roman Empire</strong> with its pagan cults:</p><blockquote><p>“<strong>Let every soul be subject to the governing authorities</strong>. For <strong>there is no authority except from God</strong>, and <strong><mark>the authorities that exist are appointed by God</mark></strong>. Therefore whoever resists the authority resists the ordinance of God, and those who resist will bring judgment on themselves. For rulers are not a terror to good works, but to evil. Do you want to be unafraid of the authority? Do what is good, and you will have praise from the same. For <strong>he is God’s minister</strong> to you for good. But if you do evil, be afraid; for he does not bear the sword in vain; for he is <strong>God’s minister, an avenger to execute wrath on him who practices evil</strong>. Therefore <strong>you must be subject</strong>, not only because of wrath but also for conscience’ sake” (<a href="https://bibleox.com/en/eng-nkjv/rim/13/#L1-5">Rom. 13:1-5</a>)</p></blockquote><p>Christ points out that Pilate has authority from above:</p><blockquote><p>“Jesus answered, ‘<strong><mark>You could have no power at all against Me unless it had been given you from above</mark></strong>. Therefore the one who delivered Me to you has the greater sin’” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L11">John. 19:11</a>)</p></blockquote><h2>The Limit of Obedience to the State Authorities</h2><blockquote><p>“But Peter and John answered and said to them, ‘<strong>Whether it is right in the sight of God to listen to you more than to God</strong>, you judge’” (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L19">Act. 4:19</a>)</p></blockquote><blockquote><p>“But Peter and the other apostles answered and said: ‘<strong>We ought to obey God rather than men</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L29">Act. 5:29</a>)</p></blockquote><h2>Taxes</h2><blockquote><p>“For because of this <strong>you also pay taxes</strong>, for they are God’s ministers attending continually to this very thing. <strong>Render therefore to all their due: taxes to whom taxes are due, customs to whom customs, fear to whom fear, honor to whom honor</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/13/#L6-7">Rom. 13:6-7</a>)</p></blockquote><h2>The Old Testament</h2><blockquote><p>“<strong>My son, fear the LORD and the king;</strong> do not associate with those given to change” (<a href="https://bibleox.com/en/eng-nkjv/pr/24/#L21">Prov. 24:21</a>)</p></blockquote><h3>God “Hires” Foreign Kings for Punishment</h3><blockquote><p>“<strong>The LORD will bring the king of Assyria upon you</strong> and your people and your father’s house — days that have not come since the day that Ephraim departed from Judah. &lt;…&gt; In the same day <strong><mark>the Lord will shave with a hired razor</mark>, with those from beyond the River, with the king of Assyria</strong>, the head and the hair of the legs, and will also remove the beard” (<a href="https://bibleox.com/en/eng-nkjv/is/7/#L17,20">Is. 7:17,20</a>)</p></blockquote><h3>God Commands the Jewish People to Submit to Nebuchadnezzar, King of Babylon</h3><blockquote><p>“And now <strong>I have given all these lands into the hand of Nebuchadnezzar the king of Babylon, <mark>My servant</mark></strong>; and the beasts of the field I have also given him to serve him. So all nations shall serve him and his son and his son’s son, until the time of his land comes; and then many nations and great kings shall make him serve them. And it shall be, that <strong>the nation and kingdom which will not serve Nebuchadnezzar the king of Babylon, and which will not put its neck under the yoke of the king of Babylon, that nation <mark>I will punish</mark>, says the LORD, <mark>with the sword</mark>, the famine, and the pestilence, until <mark>I have consumed them by his hand</mark></strong>. Therefore do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who speak to you, saying, ‘You shall not serve the king of Babylon.’ For they prophesy a lie to you, to remove you far from your land; and I will drive you out, and you will perish. <strong>But the nations that <mark>bring their necks under the yoke of the king of Babylon and serve him, I will let them remain in their own land</mark>, says the LORD, and they shall till it and dwell in it</strong>. I also spoke to Zedekiah king of Judah according to all these words, saying, ‘<strong><mark>Bring your necks under the yoke of the king of Babylon, and serve him and his people, and live!</mark></strong> Why will you die, you and your people, by the sword, by the famine, and by the pestilence, as the LORD has spoken against the nation that will not serve the king of Babylon? Therefore do not listen to the words of the prophets who speak to you, saying, “You shall not serve the king of Babylon,” for they prophesy a lie to you’” (<a href="https://bibleox.com/en/eng-nkjv/ier/27/#L6-14">Jer. 27:6-14</a>)</p></blockquote><p>Meanwhile, Nebuchadnezzar, king of Babylon, was of course an idolater (<a href="https://bibleox.com/en/eng-nkjv/dan/3/#L1-6">Dan. 3:1-6</a>). Submission to him meant recognizing his worldly authority over external things: the land, riches and the rest. When Nebuchadnezzar began to force the Jews to worship idols, it was precisely this ungodly command of his that was rejected:</p><blockquote><p>“Nebuchadnezzar spoke, saying to them, ‘Is it true, Shadrach, Meshach, and Abed-Nego, that <strong>you do not serve my gods or worship the gold image which I have set up?</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/dan/3/#L14">Dan. 3:14</a>)</p></blockquote><p>They recognize him as king, but refuse to obey:</p><blockquote><p>“Shadrach, Meshach, and Abed-Nego answered and said to the king, ‘O Nebuchadnezzar, we have no need to answer you in this matter. If that is the case, our God whom we serve is able to deliver us from the burning fiery furnace, and He will deliver us from your hand, O <strong><mark>king</mark></strong>. But if not, let it be known to you, O <strong><mark>king</mark></strong>, that <strong><mark>we do not serve your gods</mark>, nor will we worship the gold image which you have set up</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/dan/3/#L16-18">Dan. 3:16-18</a>)</p></blockquote><p>For what they were thrown into the furnace:</p><blockquote><p>“Then these men were bound in their coats, their trousers, their turbans, and their other garments, and <strong>were cast into the midst of the burning fiery furnace</strong>. Therefore, because the king’s command was urgent, and the furnace exceedingly hot, the flame of the fire killed those men who took up Shadrach, Meshach, and Abed-Nego. And these three men, Shadrach, Meshach, and Abed-Nego, fell down bound into the midst of the burning fiery furnace” (<a href="https://bibleox.com/en/eng-nkjv/dan/3/#L21-23">Dan. 3:21-23</a>)</p></blockquote><p>And the angel of God kept them unharmed:</p><blockquote><p>“But <strong>the angel of the Lord</strong> came down into the furnace together with Azariah and those with him, and drove the flame of the fire out of the furnace, and made the midst of the furnace like a moist wind whistling through, and <strong>the fire did not touch them at all, nor hurt them</strong>, nor trouble them” (<a href="https://bibleox.com/en/gr-lxx-byz/dan/3/#L49-50">Dan. 3:49-50</a>) <em>(this passage is preserved only in the Greek text of Daniel and is absent from the NKJV; translated from the Septuagint)</em></p></blockquote><p>The youths disobeyed only this one royal command — to serve other gods:</p><blockquote><p>“Then King Nebuchadnezzar was astonished; and he rose in haste and spoke, saying to his counselors, ‘Did we not cast three men bound into the midst of the fire?’ They answered and said to the king, ‘True, O king.’ &lt;...&gt; <strong>Nebuchadnezzar spoke, saying, ‘Blessed be the God of Shadrach, Meshach, and Abed-Nego, who sent His Angel and delivered His servants who trusted in Him, and <mark>they have frustrated the king’s word</mark></strong>, and yielded their bodies, <strong><mark>that they should not serve nor worship any god except their own God!</mark></strong> Therefore I make a decree that any people, nation, or language which speaks anything amiss against the God of Shadrach, Meshach, and Abed-Nego shall be cut in pieces, and their houses shall be made an ash heap; because there is no other God who can deliver like this’” (<a href="https://bibleox.com/en/eng-nkjv/dan/3/#L24,28-29">Dan. 3:24,28-29</a>)</p></blockquote><h3>God Saved from Foreign Kings</h3><blockquote><p>“Therefore thus says the LORD concerning the king of Assyria: ‘He shall not come into this city, nor shoot an arrow there, nor come before it with shield, nor build a siege mound against it. By the way that he came, by the same shall he return; and he shall not come into this city,’ says the LORD. ‘<strong>For I will defend this city, to save it for My own sake and for My servant David’s sake</strong>.’ And it came to pass on a certain night that <strong>the angel of the LORD went out, and killed in the camp of the Assyrians one hundred and eighty-five thousand</strong>; and when people arose early in the morning, there were the corpses — all dead. So Sennacherib king of Assyria departed and went away, returned home, and remained at Nineveh” (<a href="https://bibleox.com/en/eng-nkjv/4ts/19/#L32-36">2 Kin. 19:32-36</a>)</p></blockquote><h3>Punishment and Deliverance Depended on the Piety of the People</h3><blockquote><p>“They said, ‘<strong>Repent now everyone of his evil way and his evil doings, and dwell in the land that the LORD has given to you and your fathers forever and ever. <mark>Do not go after other gods to serve them and worship them, and do not provoke Me to anger with the works of your hands; and I will not harm you</mark></strong>.’ <strong><mark>Yet you have not listened to Me</mark>, says the LORD, that you might provoke Me to anger with the works of your hands to your own hurt</strong>. Therefore thus says the LORD of hosts: ‘<strong><mark>Because you have not heard My words</mark></strong>, behold, I will send and take all the families of the north,’ says the LORD, ‘and Nebuchadnezzar the king of Babylon, My servant, and will bring them against this land, against its inhabitants, and against these nations all around, and <strong>will utterly destroy them, and make them an astonishment, a hissing, and perpetual desolations</strong>. Moreover I will take from them the voice of mirth and the voice of gladness, the voice of the bridegroom and the voice of the bride, the sound of the millstones and the light of the lamp. And this whole land shall be a desolation and an astonishment, and <strong>these nations shall serve the king of Babylon seventy years</strong>. Then it will come to pass, <strong>when seventy years are completed, that I will punish the king of Babylon and that nation</strong>, the land of the Chaldeans, <strong>for their iniquity</strong>,’ says the LORD; ‘and I will make it a perpetual desolation’” (<a href="https://bibleox.com/en/eng-nkjv/ier/25/#L5-12">Jer. 25:5-12</a>)</p></blockquote><blockquote><p>“<strong>May He grant you according to your heart’s desire</strong>, and fulfill all your purpose” (<a href="https://bibleox.com/en/eng-nkjv/ps/20/#L4">Ps. 20:4</a>)</p></blockquote>

  - src: отцами_и_учителями_не_называться
    path: Df6c_Do_Not_Be_Called_Fathers_and_Teachers
    title: Do Not Be Called Fathers and Teachers
    menu: { parent: Church, title: Do Not Be Called Fathers and Teachers, priority: 22 }
    body: |-
      <h2>Christ Commands Not to Be Called Teachers and Fathers</h2><blockquote><p>“saying: ‘The scribes and the Pharisees sit in Moses’ seat. &lt;...&gt; But all their works they do to be seen by men. They make their phylacteries broad and enlarge the borders of their garments. They <strong>love</strong> the best places at feasts, the best seats in the synagogues, greetings in the marketplaces, <strong>and to be called by men, “Rabbi, Rabbi.”</strong> <strong>But you, <mark>do not be called “Rabbi”</mark></strong> <em>(Greek: Ῥαββί — “Rabbi”, that is, “my teacher”)</em>; for One is your Teacher, the Christ, and you are all brethren. <strong><mark>Do not call anyone on earth your father</mark></strong>; for One is your Father, He who is in heaven’” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L2,5-9">Matt. 23:2,5-9</a>)</p></blockquote><p>This is said not so literally, just as about cutting off members (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L29-30">Matt. 5:29-30</a>) or that Christ came to divide families, bringing not peace but a sword (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L34-35">Matt. 10:34-35</a>). A lesson of humility is given, so that believers would not strive to be called “Rabbi, Rabbi” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L7">Matt. 23:7</a>), and, having received these titles, would not be proud and exalt themselves, understanding that the highest authority, the true father and teacher, is God.</p><p>It is important to understand the meaning correctly, starting from the context; otherwise it would turn out that even a child cannot call his parent father, although God calls them so in the commandment (<a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L16">Deut. 5:16</a>). Likewise no teacher could be called a teacher, although there certainly are teachers in the Church. From Scripture we see that these words were not avoided.</p><h2>Teachers</h2><h3>Christ Calls the Pharisee Nicodemus the Teacher of Israel</h3><blockquote><p>“Jesus answered and said to him, ‘Are <strong><mark>you the teacher</mark></strong> of Israel, and do not know these things?’” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L10">John. 3:10</a>)</p></blockquote><h3>The Apostle Says That He Was Appointed a Teacher</h3><blockquote><p>“to which <strong><mark>I</mark></strong> was appointed a preacher, an apostle, and <strong><mark>a teacher</mark></strong> of the Gentiles” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L11">2 Tim. 1:11</a>)</p></blockquote><blockquote><p>“who gave Himself a ransom for all, to be testified in due time, for which <strong><mark>I</mark></strong> was appointed a preacher and an apostle — I am speaking the truth in Christ and not lying — <strong><mark>a teacher</mark></strong> of the Gentiles in faith and truth” (<a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L6-7">1 Tim. 2:6-7</a>)</p></blockquote><h3>God Appointed Teachers in the Church</h3><blockquote><p>“And <strong><mark>God has appointed</mark> these in the church</strong>: first apostles, second prophets, third <strong><mark>teachers</mark></strong>, after that miracles, then gifts of healings, helps, administrations, varieties of tongues” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28">1 Cor. 12:28</a>)</p></blockquote><blockquote><p>“And <strong><mark>He Himself gave</mark></strong> some to be apostles, some prophets, some evangelists, and some pastors and <strong><mark>teachers</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L11">Eph. 4:11</a>)</p></blockquote><blockquote><p>“or ministry, let us use it in our ministering; <strong><mark>he who teaches</mark></strong>, in teaching” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L7">Rom. 12:7</a>)</p></blockquote><blockquote><p>“For though by this time <strong><mark>you ought to be teachers</mark></strong>, you need someone to teach you again the first principles of the oracles of God; and you have come to need milk and not solid food” (<a href="https://bibleox.com/en/eng-nkjv/evr/5/#L12">Heb. 5:12</a>)</p></blockquote><h3>A Warning About the Responsibility of Teachers</h3><blockquote><p>“My brethren, <strong><mark>let not many of you become teachers</mark>, knowing that we shall receive a stricter judgment</strong>. For we all stumble in many things. If anyone does not stumble in word, he is a perfect man, able also to bridle the whole body” (<a href="https://bibleox.com/en/eng-nkjv/iak/3/#L1-2">James. 3:1-2</a>)</p></blockquote><h2>Fathers</h2><h3>The Apostle Calls Himself a Father, and the Believers Children</h3><blockquote><p>“I do not write these things to shame you, but as <strong><mark>my beloved children</mark></strong> I warn you. For though you might have ten thousand instructors in Christ, yet <strong><mark>you do not have many <u>fathers</u>; for in Christ Jesus I have begotten you</mark></strong> through the gospel. &lt;...&gt; For this reason I have sent Timothy to you, who is <strong><mark>my</mark></strong> beloved and faithful <strong><mark>son</mark></strong> in the Lord, who will remind you of my ways in Christ, as I teach everywhere in every church” (<a href="https://bibleox.com/en/eng-nkjv/1kor/4/#L14-15,17">1 Cor. 4:14-15,17</a>)</p></blockquote><blockquote><p>“<strong><mark>My little children</mark></strong>, for whom <strong>I labor in birth again</strong> until Christ is formed in you” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L19">Gal. 4:19</a>)</p></blockquote><blockquote><p>“<strong><mark>My little children</mark></strong>, these things I write to you, so that you may not sin. And if anyone sins, we have an Advocate with the Father, Jesus Christ the righteous” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L1">1 John. 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>My little children</mark></strong>, let us not love in word or in tongue, but in deed and in truth” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L18">1 John. 3:18</a>)</p></blockquote><blockquote><p>“I have no greater joy than to hear that <strong><mark>my children</mark></strong> walk in truth” (<a href="https://bibleox.com/en/eng-nkjv/3in/1/#L4">3 John. 1:4</a>)</p></blockquote><blockquote><p>“I appeal to you for <strong><mark>my son</mark></strong> Onesimus, whom I have <strong>begotten while in my chains</strong>” (<a href="https://bibleox.com/en/eng-nkjv/fm/1/#L10">Philem. 1:10</a>)</p></blockquote><h3>Abraham Is the Father of Believers</h3><blockquote><p>“Therefore it is of faith that it might be according to grace, so that the promise might be sure to all the seed, not only to those who are of the law, but also to those who are of the faith of <strong><mark>Abraham, who is the father of us all</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/4/#L16">Rom. 4:16</a>)</p></blockquote><blockquote><p>“Therefore know that <strong>only those who are of faith are sons of Abraham</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L7">Gal. 3:7</a>)</p></blockquote><blockquote><p>“When Abram was ninety-nine years old, the LORD appeared to Abram and said to him, ‘I am Almighty God; walk before Me and be blameless. &lt;...&gt; As for Me, behold, My covenant is with you, and <strong>you <mark>shall be a father</mark> of many nations</strong>. No longer shall your name be called Abram, but your name shall be Abraham; for <strong>I have made you <mark>a father of many nations</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/17/#L1,4-5">Gen. 17:1,4-5</a>)</p></blockquote><blockquote><p>“And he received the sign of circumcision, a seal of the righteousness of the faith which he had while still uncircumcised, that he might be <strong><mark>the father of all those who believe</mark></strong>, though they are uncircumcised, that righteousness might be imputed to them also, and <strong>the father</strong> of circumcision to those who not only are of the circumcision, but who also walk in the steps of the faith which <strong><mark>our father</mark></strong> Abraham had while still uncircumcised. &lt;...&gt; as it is written, ‘<strong><mark>I have made you a father</mark></strong> of many nations’ in the presence of Him whom he believed — God, who gives life to the dead and calls those things which do not exist as though they did” (<a href="https://bibleox.com/en/eng-nkjv/rim/4/#L11-12,17">Rom. 4:11-12,17</a>)</p></blockquote><h3>God Gives a Commandment Concerning Fathers and Mothers</h3><blockquote><p>“<strong><mark>Honor your father</mark></strong> and your mother, that your days may be long upon the land which the LORD your God is giving you” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L12">Ex. 20:12</a>)</p></blockquote><blockquote><p>“<strong><mark>Honor your father</mark></strong> and your mother, as <strong>the LORD your God has commanded you</strong>, that your days may be long, and that it may be well with you in the land which the LORD your God is giving you” (<a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L16">Deut. 5:16</a>)</p></blockquote><blockquote><p>“You know the commandments: ‘Do not commit adultery,’ ‘Do not murder,’ ‘Do not steal,’ ‘Do not bear false witness,’ ‘Do not defraud,’ ‘<strong><mark>Honor your father</mark></strong> and your mother’” (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L19">Mark. 10:19</a>)</p></blockquote><blockquote><p>“‘<strong><mark>Honor your father</mark></strong> and mother,’ which is the first commandment with promise” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L2">Eph. 6:2</a>)</p></blockquote><h3>The Apostle Addresses Fathers</h3><blockquote><p>“And <strong><mark>you, fathers</mark></strong>, do not provoke your children to wrath, but bring them up in the training and admonition of the Lord” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L4">Eph. 6:4</a>)</p></blockquote><blockquote><p>“<strong><mark>Fathers</mark></strong>, do not provoke your children, lest they become discouraged” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L21">Col. 3:21</a>)</p></blockquote><blockquote><p>“<strong><mark>I write to you, fathers</mark></strong>, because you have known Him who is from the beginning. I write to you, young men, because you have overcome the wicked one. I write to you, little children, because you have known the Father” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L13">1 John. 2:13</a>)</p></blockquote><h2>God Allows Calling Not Only “Teacher” and “Father”, but Even “Gods”, in the Right Sense (Not by Nature, but by Grace)</h2><blockquote><p>“I said, ‘<strong>You are gods</strong>, and all of you are children of the Most High. But you shall die like men, and fall like one of the princes’” (<a href="https://bibleox.com/en/eng-nkjv/ps/82/#L6-7">Ps. 82:6-7</a>)</p></blockquote><blockquote><p>“Jesus answered them, ‘Is it not written in your law, “I said, <strong>You are gods</strong>”? If He called them gods, to whom the word of God came (and the Scripture cannot be broken)’” (<a href="https://bibleox.com/en/eng-nkjv/in/10/#L34-35">John. 10:34-35</a>)</p></blockquote><p>However, Christ gives the commandment to call ourselves servants (<a href="https://bibleox.com/en/eng-nkjv/lk/17/#L10">Luke. 17:10</a>).</p><h2>A Related Topic</h2><p>On the objection against calling Christians servants (slaves) of God: <a href="https://bibleox.com/ru/ru/w/%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D0%B8%D0%BD-%D1%80%D0%B0%D0%B1-%D0%91%D0%BE%D0%B3%D0%B0">https://bibleox.com/ru/ru/w/христианин-раб-Бога</a></p>
