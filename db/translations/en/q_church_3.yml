    path: Cx2v_The_Cross
    title: The Cross
    meta_desc: Bible quotes about the Cross of Christ, the altar, the instrument of victory and reconciliation
    menu: { parent: Church, title: The Cross, priority: 15 }
    body: |-
      <h2>Prefigurations of the Cross in the Old Testament</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D1%80%D0%BE%D0%BE%D0%B1%D1%80%D0%B0%D0%B7-%D0%BA%D1%80%D0%B5%D1%81%D1%82%D0%BD%D0%BE%D0%B9-%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B-%D0%90%D0%B2%D1%80%D0%B0%D0%B0%D0%BC-%D0%B8-%D0%98%D1%81%D0%B0%D0%B0%D0%BA">The Sacrifice of Christ on the Cross — Abraham and Isaac</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D0%B9">The Cross — Moses</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82">The Cross — the Camp of the Hebrews</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82-%D0%B8-%D0%BA%D1%80%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D0%B5-%D0%BF%D0%B5%D1%80%D0%B5%D1%85%D0%BE%D0%B4-%D1%87%D0%B5%D1%80%D0%B5%D0%B7-%D0%BC%D0%BE%D1%80%D0%B5">The Cross and Baptism — the Crossing of the Sea</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82-%D0%98%D0%B0%D0%BA%D0%BE%D0%B2">The Cross — the Blessing of Jacob</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/EMRx_%D0%9A%D1%80%D0%B5%D1%81%D1%82__%D0%B1%D1%83%D0%BA%D0%B2%D0%B0_%D1%82%D0%B0%D1%83">The Cross — the Letter Tau on the Foreheads of Believers in a Prophetic Vision</a></p></li></ol><h2>The Cross — an Instrument of Victory and Reconciliation</h2><blockquote><p>“And you, being dead in your trespasses and the uncircumcision of your flesh, He has made alive together with Him, having forgiven you all trespasses, having wiped out the handwriting of requirements that was against us, which was contrary to us. And He has taken it out of the way, <strong>having nailed it to the cross. Having disarmed principalities and powers</strong>, He made a public spectacle of them, <strong>triumphing over them in it</strong> <em>(Greek: ἐν αὐτῷ — “in it” or “in Himself”)</em>” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L13-15">Col. 2:13-15</a>)</p></blockquote><blockquote><p>“and that He might <strong>reconcile</strong> them both to God in one body <strong>through the cross, thereby putting to death the enmity</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L16">Eph. 2:16</a>)</p></blockquote><blockquote><p>“and by Him to reconcile all things to Himself, by Him, whether things on earth or things in heaven, <strong>having made peace through the blood of His cross</strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L20">Col. 1:20</a>)</p></blockquote><h2>The Cross Is an Altar, a Great Sacred Object</h2><p>The Lord Jesus Christ offered Himself as a sacrifice on the cross, the altar:</p><blockquote><p>“so Christ was offered once to bear the sins of many” (<a href="https://bibleox.com/en/eng-nkjv/evr/9/#L28">Heb. 9:28</a>)</p></blockquote><p>A confirmation of this is the Old Testament prefiguration of the sacrifice of Christ on the cross — the sacrifice of Isaac. Abraham (the father) offers in sacrifice Isaac (his only son):</p><blockquote><p>“Then He said, ‘Take now <strong>your son, your only son</strong> Isaac, whom you love, and go to the land of Moriah, and <strong>offer him there as a burnt offering on one of the mountains</strong> of which I shall tell you’” (<a href="https://bibleox.com/en/eng-nkjv/gen/22/#L2">Gen. 22:2</a>)</p></blockquote><blockquote><p>“God so loved the world that <strong>He gave His only begotten Son</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L16">John. 3:16</a>)</p></blockquote><p>Isaac carries up the mountain that on which he is to be sacrificed:</p><blockquote><p>“So Abraham took the wood of the burnt offering and <strong>laid it on Isaac</strong> his son; and he took the fire in his hand, and a knife, and the two of them went together” (<a href="https://bibleox.com/en/eng-nkjv/gen/22/#L6">Gen. 22:6</a>)</p></blockquote><blockquote><p>“So they took Jesus and led Him away. And He, <strong>bearing His cross</strong>, went out to a place called the Place of a Skull, which is called in Hebrew, Golgotha, where they crucified Him” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L16-18">John. 19:16-18</a>)</p></blockquote><h3>Abraham Laid Isaac on the Altar</h3><blockquote><p>“Was not Abraham our father justified by works when <strong>he offered Isaac his son on the altar</strong>?” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L21">James. 2:21</a>)</p></blockquote><blockquote><p>“Him, being delivered by the determined purpose and foreknowledge of God, <strong>you have taken</strong> by lawless hands, <strong>have crucified, and put to death</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L23">Act. 2:23</a>)</p></blockquote><p>On the cross, as on an altar, the salvation of mankind is accomplished:</p><blockquote><p>“and that He might reconcile them both to God in one body <strong>through the cross, thereby putting to death the enmity</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L16">Eph. 2:16</a>)</p></blockquote><h3>The Altar Is Most Holy</h3><blockquote><p>“<strong>the altar shall be most holy. Whatever touches the altar must be holy</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L37">Ex. 29:37</a>)</p></blockquote><h2>The Gospel</h2><blockquote><p>“Then Jesus, looking at him, loved him, and said to him, ‘One thing you lack: Go your way, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, <strong>take up the cross, and follow Me</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L21">Mark. 10:21</a>)</p></blockquote><blockquote><p>“When He had called the people to Himself, with His disciples also, He said to them, ‘Whoever desires to come after Me, let him deny himself, and <strong>take up his cross</strong>, and follow Me’” (<a href="https://bibleox.com/en/eng-nkjv/mk/8/#L34">Mark. 8:34</a>)</p></blockquote><blockquote><p>“And <strong>he who does not take his cross</strong> and follow after Me is not worthy of Me” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L38">Matt. 10:38</a>)</p></blockquote><blockquote><p>“Then Jesus said to His disciples, ‘If anyone desires to come after Me, let him deny himself, and <strong>take up his cross</strong>, and follow Me’” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L24">Matt. 16:24</a>)</p></blockquote><blockquote><p>“Then He said to them all, ‘If anyone desires to come after Me, let him deny himself, and <strong>take up his cross</strong> daily, and follow Me’” (<a href="https://bibleox.com/en/eng-nkjv/lk/9/#L23">Luke. 9:23</a>)</p></blockquote><blockquote><p>“And <strong>whoever does not bear his cross</strong> and come after Me cannot be My disciple” (<a href="https://bibleox.com/en/eng-nkjv/lk/14/#L27">Luke. 14:27</a>)</p></blockquote><blockquote><p>“and saying, ‘You who destroy the temple and build it in three days, save Yourself! If You are the Son of God, <strong>come down from the cross</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L40">Matt. 27:40</a>)</p></blockquote><blockquote><p>“He saved others; Himself He cannot save. If He is the King of Israel, <strong>let Him now come down from the cross</strong>, and we will believe Him” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L42">Matt. 27:42</a>)</p></blockquote><blockquote><p>“save Yourself, and <strong>come down from the cross</strong>!” (<a href="https://bibleox.com/en/eng-nkjv/mk/15/#L30">Mark. 15:30</a>)</p></blockquote><blockquote><p>“Let the Christ, the King of Israel, <strong>descend now from the cross</strong>, that we may see and believe. Even those who were crucified with Him reviled Him” (<a href="https://bibleox.com/en/eng-nkjv/mk/15/#L32">Mark. 15:32</a>)</p></blockquote><h2>The Apostle</h2><blockquote><p>“looking unto Jesus, the author and finisher of our faith, who for the joy that was set before Him <strong>endured the cross</strong>, despising the shame, and has sat down at the right hand of the throne of God” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L2">Heb. 12:2</a>)</p></blockquote><blockquote><p>“But God forbid that I should <strong>boast</strong> except in <strong>the cross</strong> of our <strong>Lord</strong> Jesus Christ, by whom the world has been crucified to me, and I to the world” (<a href="https://bibleox.com/en/eng-nkjv/gal/6/#L14">Gal. 6:14</a>)</p></blockquote><blockquote><p>“For Christ did not send me to baptize, but to preach the gospel, not with wisdom of words, <strong>lest the cross of Christ should be made of no effect</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L17">1 Cor. 1:17</a>)</p></blockquote><blockquote><p>“For <strong>the message of the cross is foolishness to those who are perishing</strong>, but to us who are being saved it is the power of God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L18">1 Cor. 1:18</a>)</p></blockquote><blockquote><p>“As many as desire to make a good showing in the flesh, these would compel you to be circumcised, only that they may <strong>not suffer persecution for the cross of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/6/#L12">Gal. 6:12</a>)</p></blockquote><blockquote><p>“And I, brethren, if I still preach circumcision, why do I still suffer persecution? Then <strong>the offense of the cross</strong> has ceased” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L11">Gal. 5:11</a>)</p></blockquote><blockquote><p>“and that He might <strong>reconcile</strong> them both to God in one body <strong>through the cross, thereby putting to death the enmity</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L16">Eph. 2:16</a>)</p></blockquote><blockquote><p>“For many walk, of whom I have told you often, and now tell you even weeping, <strong>that they are the enemies of the cross of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/fil/3/#L18">Phil. 3:18</a>)</p></blockquote><blockquote><p>“and by Him to reconcile all things to Himself, by Him, whether things on earth or things in heaven, <strong>having made peace through the blood of His cross</strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L20">Col. 1:20</a>)</p></blockquote><blockquote><p>“having wiped out the handwriting of requirements that was against us, which was contrary to us. And He has taken it out of the way, <strong>having nailed it to the cross</strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L14">Col. 2:14</a>)</p></blockquote>

  - src: заповеди-блаженств
    path: Bt7g_The_Beatitudes
    title: The Beatitudes
    meta_desc: Bible quotes about the Beatitudes
    menu: { parent: Church, title: The Beatitudes, priority: 16 }
    body: |-
      <h2>The 9 Beatitudes Given by the Lord Jesus Christ in the Sermon on the Mount</h2><ol><li><p>“Blessed are <strong>the poor in spirit</strong>, for theirs is the kingdom of heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L3">Matt. 5:3</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L20">Luke. 6:20</a>)</p></li><li><p>“Blessed are <strong>those who mourn</strong>, for they shall be comforted” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L4">Matt. 5:4</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L21">Luke. 6:21</a>)</p></li><li><p>“Blessed are <strong>the meek</strong>, for they shall inherit the earth” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L5">Matt. 5:5</a>)</p></li><li><p>“Blessed are <strong>those who hunger and thirst for righteousness,</strong> for they shall be filled” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L6">Matt. 5:6</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L21">Luke. 6:21</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L25">Luke. 6:25</a>)</p></li><li><p>“Blessed are <strong>the merciful</strong>, for they shall obtain mercy” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L7">Matt. 5:7</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L24">Luke. 6:24</a>)</p></li><li><p>“Blessed are <strong>the pure in heart</strong>, for they shall see God” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L8">Matt. 5:8</a>)</p></li><li><p>“Blessed are <strong>the peacemakers</strong>, for they shall be called sons of God” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L9">Matt. 5:9</a>)</p></li><li><p>“Blessed are <strong>those who are persecuted for righteousness’ sake</strong>, for theirs is the kingdom of heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L10">Matt. 5:10</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L22">Luke. 6:22</a>)</p></li><li><p>“Blessed are you <strong>when they revile and persecute you, and say all kinds of evil against you falsely for My sake</strong>. Rejoice and be exceedingly glad, for great is your reward in heaven, for so they persecuted the prophets who were before you” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L11-12">Matt. 5:11-12</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L22-23">Luke. 6:22-23</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L26">Luke. 6:26</a>)</p></li></ol><h2>Additional Commandments</h2><ol><li><p>“<strong>love your enemies</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L27">Luke. 6:27</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/5/#L44">Matt. 5:44</a>)</p></li><li><p>“<strong>do good to those who hate</strong> you” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L27">Luke. 6:27</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/5/#L44">Matt. 5:44</a>)</p></li><li><p>“<strong>bless those who curse</strong> you” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L28">Luke. 6:28</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/5/#L44">Matt. 5:44</a>)</p></li><li><p>“<strong>pray for those who spitefully use</strong> you” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L28">Luke. 6:28</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/5/#L44">Matt. 5:44</a>)</p></li><li><p>“To him who <strong>strikes you</strong> on the one cheek, <strong>offer</strong> the other also” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L29">Luke. 6:29</a>)</p></li><li><p>“from him who <strong>takes away your</strong> cloak, <strong>do not withhold</strong> your tunic either” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L29">Luke. 6:29</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/5/#L40">Matt. 5:40</a>)</p></li><li><p>“<strong>Give</strong> to everyone who <strong>asks</strong> of you” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L30">Luke. 6:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L38">Luke. 6:38</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/5/#L42">Matt. 5:42</a>)</p></li><li><p>“from him who <strong>takes away</strong> your goods <strong>do not ask</strong> them back” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L30">Luke. 6:30</a>)</p></li><li><p>“<strong>just as you want men to do to you, you also do to them likewise</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L31">Luke. 6:31</a>)</p></li><li><p>“Therefore be <strong>merciful</strong>, just as your Father also is merciful” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L36">Luke. 6:36</a>)</p></li><li><p>“<strong>Judge not</strong>, and you shall not be judged” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L37">Luke. 6:37</a>)</p></li><li><p>“<strong>Condemn not</strong>, and you shall not be condemned” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L37">Luke. 6:37</a>)</p></li><li><p>“<strong>Forgive</strong>, and you will be forgiven” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L37">Luke. 6:37</a>)</p></li><li><p>“<strong>Give</strong>, and it will be given to you: good measure, pressed down, shaken together, and running over will be put into your bosom. For with the same measure that you use, it will be measured back to you” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L38">Luke. 6:38</a>)</p></li><li><p>“And why do you look at the speck in your brother’s eye, but do not perceive the plank in your own eye? Or how can you say to your brother, ‘Brother, let me remove the speck that is in your eye,’ when you yourself do not see the plank that is in your own eye? Hypocrite! <strong>First remove the plank from your own eye</strong>, and then you will see clearly to remove the speck that is in your brother’s eye” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L41-42">Luke. 6:41-42</a>)</p></li><li><p>“You have heard that it was said to those of old, ‘You shall not murder, and whoever murders will be in danger of the judgment.’ But I say to you that <strong>whoever is angry with his brother without a cause shall be in danger of the judgment</strong>. And whoever says to his brother, ‘Raca!’ shall be in danger of the council. But whoever says, ‘You fool!’ shall be in danger of hell fire” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L21-22">Matt. 5:21-22</a>)</p></li><li><p>“Therefore if you bring your gift to the altar, and there remember that your brother has something against you, leave your gift there before the altar, and <strong>go your way. First be reconciled to your brother</strong>, and then come and offer your gift. <strong>Agree</strong> with your adversary quickly, while you are on the way with him, lest your adversary deliver you to the judge, the judge hand you over to the officer, and you be thrown into prison. Assuredly, I say to you, you will by no means get out of there till you have paid the last penny” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L23-26">Matt. 5:23-26</a>)</p></li><li><p>“You have heard that it was said to those of old, ‘You shall not commit adultery.’ But I say to you that <strong>whoever looks at a woman to lust for her has already committed adultery</strong> with her in his heart” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L27-28">Matt. 5:27-28</a>)</p></li><li><p>“Furthermore it has been said, ‘Whoever divorces his wife, let him give her a certificate of divorce.’ But I say to you that <strong>whoever divorces his wife for any reason except sexual immorality causes her to commit adultery</strong>; and <strong>whoever marries a woman who is divorced commits adultery</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L31-32">Matt. 5:31-32</a>)</p></li><li><p>“Again you have heard that it was said to those of old, ‘You shall not swear falsely, but shall perform your oaths to the Lord.’ But I say to you, <strong>do not swear</strong> at all: neither by heaven, for it is God’s throne; nor by the earth, for it is His footstool; nor by Jerusalem, for it is the city of the great King. Nor shall you swear by your head, because you cannot make one hair white or black. But let your ‘Yes’ be ‘Yes,’ and your ‘No,’ ‘No.’ For whatever is more than these is from the evil one” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L33-37">Matt. 5:33-37</a>)</p></li><li><p>“You have heard that it was said, ‘An eye for an eye and a tooth for a tooth.’ But I tell you <strong>not to resist an evil person</strong>. But whoever slaps you on your right cheek, turn the other to him also. If anyone wants to sue you and take away your tunic, let him have your cloak also. And whoever compels you to go one mile, go with him two. Give to him who asks you, and from him who wants to borrow from you do not turn away” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L38-42">Matt. 5:38-42</a>)</p></li><li><p>“Therefore <strong>you shall be perfect, just as your Father</strong> in heaven is perfect” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L48">Matt. 5:48</a>)</p></li></ol>

