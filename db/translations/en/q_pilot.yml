# Переводы статей раздела «Цитаты» (ru/q) на английский: пилот, 5 статей из раздела «Бог».
# Загрузка: bin/rails pages:import_translations FILE=db/translations/en/q_pilot.yml [PUBLISH=1] [DRY_RUN=1]
lang: en
list: en-q
pages:
  - src: Христос-Единородный-Сын-Божий
    path: Kq7d_Christ_the_Only_Begotten_Son_of_God
    title: Christ — the Only Begotten Son of God
    meta_desc: Bible quotes about the Only Begotten Son of God
    menu: { parent: God/Son, title: Christ — the Only Begotten Son of God, priority: 3 }
    body: |-
      <h2>Only Begotten — the Only Son of the Father</h2><p>Firstborn means born first. That is, no one else has been born the way the Son of God was born</p><blockquote><p>“And <strong>the Word became flesh</strong> and dwelt among us, and we beheld His glory, the glory as of <strong>the only begotten of the Father</strong>, full of grace and truth” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L14">John. 1:14</a>)</p></blockquote><blockquote><p>“No one has seen God at any time. <strong>The only begotten Son</strong>, who is in the bosom of the Father, He has declared Him” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>)</p></blockquote><blockquote><p>“For <strong>God</strong> so loved the world that <strong>He gave His only begotten Son</strong>, that whoever believes in Him should not perish but have everlasting life” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L16">John. 3:16</a>)</p></blockquote><blockquote><p>“He who believes in Him is not condemned; but he who does not believe is condemned already, because he has not believed in the name of <strong>the only begotten Son of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L18">John. 3:18</a>)</p></blockquote><blockquote><p>“But when the fullness of the time had come, <strong>God sent forth His Son</strong>, born of a woman, born under the law” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L4">Gal. 4:4</a>)</p></blockquote><blockquote><p>“In this the love of God was manifested toward us, that God has sent <strong>His only begotten Son</strong> into the world, that we might live through Him” (<a href="https://bibleox.com/en/eng-nkjv/1in/4/#L9">1 John. 4:9</a>)</p></blockquote><p>Abraham’s sacrifice of his only begotten son is a prefiguration of the sacrifice of the only begotten Son of God on the cross:</p><blockquote><p>“By faith Abraham, when he was tested, offered up Isaac, and he who had received the promises <strong>offered up his only begotten son</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L17">Heb. 11:17</a>)</p></blockquote><h2>Jesus Christ — the Firstborn</h2><p>Christ is called the firstborn:</p><blockquote><p>“For whom He foreknew, He also predestined to be conformed to the image of His Son, that He might be <strong>the firstborn among many brethren</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L29">Rom. 8:29</a>)</p></blockquote><blockquote><p>“But when He again brings <strong>the firstborn</strong> into the world, He says: ‘Let all the angels of God worship Him’” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L6">Heb. 1:6</a>)</p></blockquote><p>Why is Christ the firstborn? Because He was the first to rise from the dead:</p><blockquote><p>“And He is the head of the body, the church, who is the beginning, <strong>the firstborn from the dead</strong>, that in all things He may have the preeminence” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L18">Col. 1:18</a>)</p></blockquote><blockquote><p>“and from Jesus Christ, the faithful witness, <strong>the firstborn from the dead</strong>, and the ruler over the kings of the earth. To Him who loved us and washed us from our sins in His own blood” (<a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L5">Rev. 1:5</a>)</p></blockquote><blockquote><p>“that the Christ would suffer, that He would be <strong>the first to rise from the dead</strong>, and would proclaim light to the Jewish people and to the Gentiles” (<a href="https://bibleox.com/en/eng-nkjv/act/26/#L23">Act. 26:23</a>)</p></blockquote><h2>By the Way</h2><p>According to Islam, Allah neither begot nor was begotten:</p><blockquote><p>“He (Allah) begets not, nor was He begotten” (Quran, Surah 112, Ayah 3)</p></blockquote>

  - src: Сын-безначальный-начинается
    path: Xr2m_The_Beginningless_Son_of_God_Begins_as_the_Son_of_Man
    title: The Beginningless Son of God Begins as the Son of Man
    title_sub: Bible quotes on how the beginningless Son of God receives a beginning (is born) as a man
    meta_desc: Bible quotes about the birth of the beginningless Son of God from the Virgin Mary
    menu: { parent: God/Son, title: The Beginningless Son Begins, priority: 4 }
    body: |-
      <h2>The Son of God Has No Beginning, but Gives a Beginning to All That Has One</h2><blockquote><p>“In the beginning was the Word, and the Word was with God, and the Word was God. <strong>All things were made through Him, and without Him nothing was made that was made</strong>. And the Word became flesh and dwelt among us, and we beheld His glory, the glory as of the only begotten of the Father, full of grace and truth” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L1,3,14">John. 1:1,3,14</a>)</p></blockquote><h2>The Priest Melchizedek Is an Image of the Son of God, Who Has No Beginning of Days (Beginningless)</h2><blockquote><p>“without father, without mother, without genealogy, <strong>having neither beginning of days nor end of life, but made like the Son of God</strong>, remains a priest continually” (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L3">Heb. 7:3</a>)</p></blockquote><h2>The Beginningless One Begins</h2><p>The beginningless <a href="https://bibleox.com/en/en/w/8HYB_Christ_is_God/">God</a> begins: He is born as a man of a virgin, according to the prophecy (<a href="https://bibleox.com/en/eng-nkjv/is/7/#L14">Is. 7:14</a>):</p><blockquote><p>“But when the fullness of the time had come, God <strong>sent forth</strong> His Son, <strong>born of a woman</strong>, born under the law” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L4">Gal. 4:4</a>)</p></blockquote><blockquote><p>“who, being in the form of God, did not consider it robbery to be equal with God, but made Himself of no reputation, <strong>taking the form of a bondservant, and coming in the likeness of men. And being found in appearance as a man</strong>” (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L6-8">Phil. 2:6-8</a>)</p></blockquote><blockquote><p>“In the beginning was the Word, and the Word was with God, and <strong>the Word was God</strong>. All things were made through Him, and without Him nothing was made that was made. And <strong>the Word became flesh</strong> and dwelt among us, and we beheld His glory, the glory as of the only begotten of the Father, full of grace and truth” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L1,3,14">John. 1:1,3,14</a>)</p></blockquote>

  - src: Христос-на-небе
    path: Pw4n_Christ_in_Heaven
    title: Christ in Heaven
    meta_desc: Bible quotes showing that Christ abides in heaven with the Father
    menu: { parent: God/Son, title: Christ in Heaven, priority: 6 }
    body: |-
      <blockquote><p>“So then, after the Lord had spoken to them, <strong>He was received up into heaven, and sat down at the right hand of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L19">Mark. 16:19</a>)</p></blockquote><blockquote><p>“who being the brightness of His glory and the express image of His person, and upholding all things by the word of His power, when He had by Himself purged our sins, <strong>sat down at the right hand of the Majesty on high</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L3">Heb. 1:3</a>)</p></blockquote><blockquote><p>“Now this is the main point of the things we are saying: <strong>We have such a High Priest, who is seated at the right hand of the throne of the Majesty in the heavens</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/8/#L1">Heb. 8:1</a>)</p></blockquote><blockquote><p>“But this Man, after He had offered one sacrifice for sins forever, <strong>sat down at the right hand of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L12">Heb. 10:12</a>)</p></blockquote><blockquote><p>“looking unto Jesus, the author and finisher of our faith, who for the joy that was set before Him endured the cross, despising the shame, and <strong>has sat down at the right hand of the throne of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L2">Heb. 12:2</a>)</p></blockquote><blockquote><p>“For <strong>Christ</strong> did not enter a sanctuary made by human hands, a mere copy of the true one, but <strong>he entered into heaven itself</strong>, now to appear in the presence of God on our behalf” (<a href="https://bibleox.com/en/en-nrsv/evr/9/#L24">Heb. 9:24</a>)</p></blockquote><blockquote><p>“But he, being full of the Holy Spirit, gazed into heaven and saw the glory of God, and <strong>Jesus standing at the right hand of God, and said, ‘Look! I see the heavens opened and the Son of Man standing at the right hand of God!’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L55-56">Act. 7:55-56</a>)</p></blockquote>

  - src: Христос-Творец-мира
    path: Lb9s_Christ_the_Creator_of_the_World
    title: Christ — the Creator of the World
    meta_desc: Jesus Christ is the One who created the world and everything in it.
    menu: { parent: God/Son, title: Christ — the Creator of the World, priority: 9 }
    body: |-
      <p>Jesus Christ, God the Son, is the Creator of the world:</p><blockquote><p>“But <strong><mark>of the Son</mark></strong> he says, ‘Your throne, O God, is forever and ever, and the righteous scepter is the scepter of your kingdom. You have loved righteousness and hated wickedness; therefore God, your God, has anointed you with the oil of gladness beyond your companions.’ And, ‘<strong><mark>In the beginning, Lord, you founded the earth, and the heavens are the work of your hands</mark></strong>; they will perish, but you remain; they will all wear out like clothing; like a cloak you will roll them up, and like clothing they will be changed. But you are the same, and your years will never end’” (<a href="https://bibleox.com/en/en-nrsv/evr/1/#L8-12">Heb. 1:8-12</a>)</p></blockquote><blockquote><p>“He has delivered us from the power of darkness and conveyed us into the kingdom of the <strong><mark>Son</mark> of His love</strong>, in whom we have redemption through His blood, the forgiveness of sins. He is the image of the invisible God, <strong>the firstborn over all creation</strong>. For <strong><mark>by Him all things were created that are in heaven and that are on earth, visible and invisible</mark>, whether thrones or dominions or principalities or powers. All things were created through Him and for Him</strong>. And He is before all things, and in Him all things consist” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L13-17">Col. 1:13-17</a>)</p></blockquote><blockquote><p>“He was in the world, and <strong>the world was made through Him</strong>, and the world did not know Him” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L10">John. 1:10</a>)</p></blockquote><blockquote><p>“God, who at various times and in various ways spoke in time past to the fathers by the prophets, has in these last days spoken to us by His <strong>Son</strong>, whom He has appointed heir of all things, <strong>through whom also He made the worlds</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L1-2">Heb. 1:1-2</a>)</p></blockquote><blockquote><p>“By faith we understand that <strong>the worlds were framed by the word of God</strong>, so that the things which are seen were not made of things which are visible” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L3">Heb. 11:3</a>)</p></blockquote>

  - src: СвятойДух-личность
    path: Hd5t_The_Holy_Spirit_Is_a_Person
    title: The Holy Spirit Is a Person
    meta_desc: 'The Holy Spirit always acts as a person: He dwells, speaks, hears, approves, shows; He is tested, insulted, blasphemed, lied to and resisted'
    menu: { parent: God/Holy Spirit, title: The Holy Spirit Is a Person, priority: 2 }
    body: |-
      <h2>The Holy Spirit Speaks of Himself Using a Personal Pronoun</h2><blockquote><p>“While Peter thought about the vision, <strong>the Spirit said</strong> to him, ‘Behold, three men are seeking you. Arise therefore, go down and go with them, doubting nothing; for <strong><mark>I</mark> (ἐγὼ) have sent them</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L19-20">Act. 10:19-20</a>)</p></blockquote><blockquote><p>“As they ministered to the Lord and fasted, <strong>the Holy Spirit said</strong>, ‘Now separate to <strong><mark>Me</mark> (μοι)</strong> Barnabas and Saul for the work to which <strong>I have called them</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L2">Act. 13:2</a>)</p></blockquote><h2>The Holy Spirit Speaks</h2><blockquote><p>“Then <strong>the Spirit said</strong> to Philip, ‘Go near and overtake this chariot’” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L29">Act. 8:29</a>) (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L19-20">Act. 10:19-20</a>) (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L2">Act. 13:2</a>)</p></blockquote><h2>The Holy Spirit Has a Mind and Intercedes</h2><blockquote><p>“Now He who searches the hearts knows what <strong>the mind of the Spirit</strong> is, because <strong>He makes intercession for the saints</strong> according to the will of God” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L27">Rom. 8:27</a>)</p></blockquote><h2>The Holy Spirit Acts as He Wills</h2><blockquote><p>“But one and the same <strong>Spirit</strong> works all these things, distributing to each one individually <strong>as He wills</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L11">1 Cor. 12:11</a>)</p></blockquote><h2>The Holy Spirit Speaks Through the Prophets</h2><blockquote><p>“<strong>The Holy Spirit spoke</strong> rightly <strong>through Isaiah the prophet</strong> to our fathers, saying, ‘Go to this people and say: “Hearing you will hear, and shall not understand; and seeing you will see, and not perceive”’” (<a href="https://bibleox.com/en/eng-nkjv/act/28/#L25-26">Act. 28:25-26</a>)</p></blockquote><blockquote><p>“Therefore, as <strong>the Holy Spirit says</strong>: ‘Today, if you will hear His voice’” (<a href="https://bibleox.com/en/eng-nkjv/evr/3/#L7">Heb. 3:7</a>)</p></blockquote><h2>From the Human Heart He Cries Out to the Father</h2><blockquote><p>“And because you are sons, God has sent forth the <strong>Spirit</strong> of His Son into your hearts, <strong>crying out</strong>, <strong>‘Abba, Father!’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L6">Gal. 4:6</a>)</p></blockquote><h2>He Hears</h2><blockquote><p>“However, when He, the Spirit of truth, has come, He will guide you into all truth; for He will not speak on His own authority, but whatever He <strong>hears</strong> He will speak; and He will tell you things to come” (<a href="https://bibleox.com/en/eng-nkjv/in/16/#L13">John. 16:13</a>)</p></blockquote><h2>He Approves</h2><blockquote><p>“For <strong>it seemed good to the Holy Spirit</strong>, and to us, to lay upon you no greater burden than these necessary things:” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L28">Act. 15:28</a>)</p></blockquote><h2>He Dwells</h2><blockquote><p>“Do you not know that you are the temple of God and that <strong>the Spirit of God dwells</strong> in you?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L16">1 Cor. 3:16</a>)</p></blockquote><h2>He Shows</h2><blockquote><p>“By this <strong>the Holy Spirit indicates</strong> that the way into the sanctuary has not yet been disclosed as long as the first tent is still standing” (<a href="https://bibleox.com/en/en-nrsv/evr/9/#L8">Heb. 9:8</a>)</p></blockquote><h2>He Testifies</h2><blockquote><p>“But <strong>the Holy Spirit also witnesses to us</strong>; for after He had said before,” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L15">Heb. 10:15</a>)</p></blockquote><h2>The Holy Spirit Is Tested</h2><blockquote><p>“Then Peter said to her, ‘How is it that you have agreed together <strong>to test the Spirit of the Lord</strong>? Look, the feet of those who have buried your husband are at the door, and they will carry you out’” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L9">Act. 5:9</a>)</p></blockquote><h2>He Is Insulted</h2><blockquote><p>“Of how much worse punishment, do you suppose, will he be thought worthy who has trampled the Son of God underfoot, counted the blood of the covenant by which he was sanctified a common thing, and <strong>insulted the Spirit of grace</strong>?” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L29">Heb. 10:29</a>)</p></blockquote><h2>He Is Blasphemed</h2><blockquote><p>“Therefore I say to you, every sin and blasphemy will be forgiven men, but <strong>the blasphemy against the Spirit</strong> will not be forgiven men” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L31">Matt. 12:31</a>)</p></blockquote><h2>People Try to Deceive Him</h2><blockquote><p>“But Peter said, ‘Ananias, why has Satan filled your heart <strong>to lie to the Holy Spirit</strong> and keep back part of the price of the land for yourself?’” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L3">Act. 5:3</a>)</p></blockquote><h2>He Is Resisted</h2><blockquote><p>“You stiff-necked and uncircumcised in heart and ears! <strong>You always resist the Holy Spirit</strong>; as your fathers did, so do you” (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L51">Act. 7:51</a>)</p></blockquote>
