  title: The Orthodox Church
  meta_desc: What the Orthodox Church is, her name, structure, history from Pentecost to the present day, and the Ecumenical Councils.
  copy_cover: true
  body: '<p><strong>The Orthodox Church</strong> (Greek Ἡ Ὀρθόδοξη Ἐκκλησία, Russian Православная Церковь, Japanese 正教会) is —</p><ol><li><p>in the simplest sense, the assembly of all people who believe in Christ in the Orthodox manner, living on earth or already departed to life in heaven with Christ;</p></li><li><p>in a more complex but profound sense, a God-manly organism whose head is Christ, and whose members are all who believe rightly in Christ, united by the Orthodox <strong>faith</strong>, <strong>sacraments</strong> and <strong>hierarchy</strong>.</p></li></ol><h2>The name</h2><p>The Church created by Christ was at first called neither Christian nor Orthodox. The believers began to be called Christians later, still in the first century, in Antioch (<a href="https://bibleox.com/en/en-nrsv/act/11/#L26">Acts 11:26</a>). Christians began to call themselves <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">Orthodox</a> in the second century[1], to distinguish the faith of the Church from the faith of alien communities (the Gnostics and others).</p><h2>Structure</h2><h3>Local Churches[3]</h3><ol><li><p>The <strong>Albanian</strong> Orthodox Church;</p></li><li><p>the <strong>Alexandrian</strong> Orthodox Church;</p></li><li><p>the <strong>Antiochian</strong> Orthodox Church;</p></li><li><p>the <strong>Bulgarian</strong> Orthodox Church;</p></li><li><p>the <strong>Georgian</strong> Orthodox Church;</p></li><li><p>the <strong>Jerusalem</strong> Orthodox Church;</p></li><li><p>the <strong>Cypriot</strong> Orthodox Church;</p></li><li><p>the <strong>Constantinopolitan</strong> Orthodox Church;</p></li><li><p>the <strong>Macedonian</strong> Orthodox Church — Ohrid Archbishopric;</p></li><li><p>the <strong>Polish</strong> Orthodox Church;</p></li><li><p>the Orthodox Church <strong>in America</strong>;</p></li><li><p>the Orthodox Church of the <strong>Czech Lands and Slovakia</strong>;</p></li><li><p>the <strong>Russian</strong> Orthodox Church;</p></li><li><p>the <strong>Romanian</strong> Orthodox Church;</p></li><li><p>the <strong>Serbian</strong> Orthodox Church;</p></li><li><p>the <strong>Church of Greece</strong>.</p></li></ol><h3>Autonomous Churches</h3><ol><li><p>the <strong>Chinese</strong> Autonomous Orthodox Church;</p></li><li><p>the <strong>Finnish</strong> Autonomous Orthodox Church;</p></li><li><p>the <strong>Japanese</strong> Autonomous Orthodox Church.</p></li></ol><h2>History</h2><p>The Orthodox Church comes into being in the year 33 from the Nativity of Christ, on the 50th day after the resurrection of Christ, on the day of Pentecost. On that day the Holy Spirit is sent down upon the assembly of the disciples of Christ (the apostles) gathered in a house in Jerusalem. They receive supernatural gifts needed for preaching the Gospel to the whole world. Soon the apostles go out into all the world and establish church communities, ordaining priests (presbyters) in them. Thus the Orthodox Church gradually increased and by the end of the first century had grown to the size of the territory of the Roman Empire, extending beyond its borders.</p><h2>The 1st–4th centuries — the period of persecutions</h2><p>The Orthodox Church is in a period of cruel persecutions on the part of the members of the Jewish religion; then members of the pagan religions join the persecutions, as well as the state apparatus of the then-pagan Roman Empire.</p><h2>The 4th century — the obtaining of freedom, theology</h2><p>In the year 313 the <a href="https://bibleox.com/ru/ru/w/%D0%9C%D0%B8%D0%BB%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8D%D0%B4%D0%B8%D0%BA%D1%82_%D0%BE_%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5_%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D1%81%D0%BA%D0%BE%D0%B9_%D0%B2%D0%B5%D1%80%D1%8B_313%D0%B3" lang="ru">Edict of Milan</a> is issued in the Roman Empire, proclaiming tolerance towards all religions, including Christianity. The persecutions cease. The buildings taken from the Orthodox Church during the persecutions are returned to her. Many renowned theologians appear, writing in detail about the Orthodox faith, defending and spreading it.</p><h2>The 4th–8th centuries — the period of the Ecumenical Councils</h2><p>After obtaining freedom, the Orthodox Church received the possibility of convening assemblies of all the bishops (senior priests) to decide questions concerning the false teachings that arose and to keep the Church in peace and unity. Such assemblies of the bishops of the whole Church received the name “Ecumenical Councils” and were a continuation of the apostolic practice of conciliar decision of acute questions (<a href="https://bibleox.com/en/en-nrsv/act/15/#L6-22">Acts 15:6-22</a>), although small local councils had taken place even before.</p><p>All the Ecumenical Councils were the answer of the Orthodox Church to attempts to distort the faith and truth once delivered and preserved in her. For example, the Church was given the simple faith about God that God is one, and at the same time the Father is God, the Son is God, the Holy Spirit is God; they have communion with one another; and only one of them (the Son of God) was in time born of the Virgin Mary for the salvation of people from sin and death, having created His Church. The Church received and kept this faith with simplicity of heart. But when people arose offering other teachings — now denying the divine dignity of the Son, now of the Holy Spirit, now separating the Son from Jesus — the Church gathered to preserve the faith and unity, pointing out the errors.</p><p>Assembling together and defending the faith, the Church was compelled not only to point out the false faith but also to expound the true one, giving definitions that served as barriers against attempts to distort this part of the faith. Thus a holy bishop of the beginning of that era writes of this:</p><p><strong>Hilary of Poitiers, bishop (~315-367)</strong></p><blockquote><p>“<strong><em>Only</em> the malice of the heretics forces us to do things not allowed, to climb heights inaccessible, to speak of subjects unutterable, to undertake forbidden inquiries. <mark>We ought to be content to perform with sincere faith what we are bidden, namely: to worship God the Father, to venerate with Him God the Son, and to be filled with the Holy Spirit.</mark> But now we are compelled to use our weak word to unfold the unutterable mysteries.</strong><em> The errors of others force us ourselves to tread the perilous path of setting forth in human language those Mysteries which we ought to keep with reverent faith in the depths of our souls.</em>”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ilarij_Piktavijskij/o-troitse/" lang="ru">On the <u>Holy Trinity</u>, 2:2</a>)</p><p>For the most part, the Bible itself (as the fixed list of sacred books) appears as the answer of the Church to attempts to distort this list:</p><p><strong>Tertullian (~155-220)</strong></p><blockquote><p>“For <strong>this heresy (Gnosticism — note) does not receive certain (books) of the Scripture</strong>, and if it receives some, not whole, distorting them with insertions and omissions to suit its own design”.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/o_prescript/" lang="ru">On the prescription [against] heretics</a>)</p><p>Briefly on the outcomes of the Ecumenical Councils:</p><h3>The First Ecumenical Council — the First Nicene, 325, 318 bishops</h3><ul><li><p><strong>Condemnation of Arius</strong>. The condemnation of the heresy of Arius, who taught that Christ is not God but a special creature made by God.</p></li><li><p><strong>The Creed</strong>. The first 7 articles of the Creed were established.</p></li><li><p><strong>The time of celebrating Pascha</strong>. To celebrate Pascha on the first Sunday after the full moon that falls after the spring equinox.</p></li></ul><h3>The Second Ecumenical Council — the First Constantinopolitan, 381, 150 bishops</h3><ul><li><p><strong>Condemnation of Macedonius.</strong> The heresy of Macedonius was condemned; he taught that the Holy Spirit is not God but a power of the Father and the Son.</p></li><li><p><strong>The Creed completed</strong>. 5 more articles were added to the Creed.</p></li></ul><h3>The Third Ecumenical Council — Ephesus, 431, 160 bishops</h3><ul><li><p><strong>Condemnation of Nestorius</strong>. The heresy of Nestorius was condemned; he taught that Christ is an ordinary man into whom, after birth, God entered as into a temple.</p></li><li><p><strong>Definitions</strong>. Christ is true God and true man. The Virgin Mary is the Mother of God (Theotokos).</p></li><li><p><strong>Prohibition of altering the Creed</strong>.</p></li></ul><h3>The Fourth Ecumenical Council — Chalcedon, 451, 520 bishops</h3><ul><li><p><strong>Condemnation of Monophysitism</strong>. The heresy of Eutyches was condemned; he taught that the human nature of Christ was wholly swallowed up by the divine, and that only the divine nature remained in Him, without the human.</p></li><li><p><strong>Definitions</strong>. In the person of the Son of God two natures were united (divine and human): <strong>without confusion and without change, without division and without separation</strong>. The natures did not merge into one; neither nature was altered as a result of the union; the union takes place without separation and forever.</p></li></ul><h3>The Fifth Ecumenical Council — the Second Constantinopolitan, 553, 165 bishops</h3><ul><li><p><strong>Condemnation of Origen. </strong>Origen and his false teaching on the finiteness of hellish torments and on the final salvation of everyone without exception were condemned[2].</p></li><li><p><strong>Condemnation of writings</strong>:</p><ul><li><p>of Theodore of Mopsuestia (he himself was also condemned as the teacher of Nestorius);</p></li><li><p>of Ibas of Edessa (suspected of Nestorianism);</p></li><li><p>of Theodoret of Cyrus (for criticism of the teaching of St Cyril of Alexandria).</p></li></ul></li></ul><h3>The Sixth Ecumenical Council — the Third Constantinopolitan, 680, 170 bishops</h3><ul><li><p><strong>Condemnation of Monothelitism</strong>. The heresy was condemned that taught of one will in Christ (only the divine).</p></li><li><p><strong>Definitions</strong>. In Christ there is, as in God, a divine will, and as in man — a human will. The human will is obedient to the divine will.</p></li></ul><h3>The Seventh Ecumenical Council — the Second Nicene, 787, 219 bishops and 131 monks</h3><ul><li><p><strong>Condemnation of Iconoclasm</strong>. The heresy was condemned that taught to regard church icons as idols and did not allow either depicting Christ and the saints or venerating these depictions.</p></li></ul><h2>The 10th–11th centuries — the falling away of the Roman local Church</h2><p>In this period the Orthodox bishops in Rome alter the teaching of the faith, introducing novelties and demanding that all the other Churches recognize them.</p><p>One of the principal errors of the Roman Church was the teaching on the procession of the Holy Spirit not only from the Father but also from the Son (the filioque). This contradicts both the direct words of Christ in the Gospel (<a href="https://bibleox.com/ru/ru/w/f18sRKqQ_%D0%92%D0%BE%D0%B7%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F_%D0%BF%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D1%84%D0%B8%D0%BB%D0%B8%D0%BE%D0%BA%D0%B2%D0%B5" lang="ru">more detail</a>) and the holy fathers. This teaching the Roman Church itself had condemned earlier in its history. But, having begun with this, in Rome they altered also the teaching on the Church, making the Roman bishop the head of the whole Church throughout the world, which had never been. To this, Catholicism added the teaching on the immaculate conception of the Virgin Mary, on purgatory, on the treasury of merits (with the indulgences flowing from it) and on the infallibility of the Roman bishop in teaching from the chair (ex cathedra). The Church knew and confessed none of this in the first millennium. All this is novelty, distortion, heresy.</p><p>By all the remaining Orthodox Churches (the Jerusalem, Antiochian, Alexandrian, Constantinopolitan, Georgian) these novelties were rejected.</p><p>The Church of Antioch tried through dialogue to persuade the Roman Church to renounce the novelties (<a href="https://bibleox.com/ru/ru/w/VuAM_%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%BA%D1%81%D1%82_%D1%81%D0%BE%D0%B1%D1%8B%D1%82%D0%B8%D0%B9_1054_%D0%B3%D0%BE%D0%B4%D0%B0" lang="ru">more detail</a>), but in the end, over the following centuries, the schism took final form. The concluding stage was the attack of the Fourth Catholic Crusade on the capital of Orthodox Byzantium — Constantinople. Decisive also was the character of this attack. All the Catholic crusades were sent at the initiative of the Roman bishop to free Jerusalem and the holy lands from the Muslim conquerors. However, the organizers of the Fourth Crusade, having already the usual agreements with Orthodox Constantinople about passage through their territory, suddenly change their aim from Jerusalem to Constantinople itself. They treacherously attack, seize, kill the inhabitants, plunder the holy things, found a Latin Empire on the remains of the city — and do not go to Jerusalem at all.</p><p>Thus the Roman Church finally fell away from the Ecumenical Orthodox Church.</p><p>The Orthodox Church was called variously, depending on the language of the population. The Greek-speaking population called the Church orthodox (Greek ορθοδόξω) or catholic (Greek καθολικός), but more often orthodox. The Latin-speaking population also called the Church orthodox (Latin ortodox) and catholic (Latin catholic), but more often catholic. The Greek word “καθολικός” is pronounced with the letter “ph” — “katholikos”, but after borrowing into the Latin language it came to be pronounced through the letter “t” — “catholic”.</p><p>After falling away from all the Orthodox churches, the Roman Church becomes increasingly known only by the name catholic, finally taking the name Roman Catholic Church, or simply Catholic Church.</p><h2>The 11th–21st centuries</h2><p>The Orthodox Church gradually grows; new local Churches appear (the Serbian, the Polish and others[3]). In polemics the Church confronts chiefly the challenge of resisting the expansion of the Roman Catholic Church (RCC), and in recent centuries also the Protestant communities born in the West in opposition to the RCC.</p><p>Attempts to distort the faith of the Church never ceased. The rise of Protestantism was chiefly a distortion of the teaching on the Church, but today the Protestant communities contain whatever heresies one pleases from the past, combining them in various orders. In general, the return of all the errors of past ages, down to pagan errors, is the contemporary challenge to the Orthodox Church.</p>'
  references: '<p>Перевод: Родион Власов (с использованием ИИ).</p><ol><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">Why the Church is called Orthodox (Russian)</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Georgij_Maksimov/pjatyj-vselenskij-sobor-i-osuzhdenie-origenizma/" lang="ru">The Fifth Ecumenical Council and the condemnation of Origenism (Russian)</a></p></li><li><p><a href="http://www.patriarchia.ru/db/organizations/30909/" lang="ru">Local and autonomous churches (Russian)</a></p></li></ol><h2>Further reading:</h2><ol><li><p>When the Church of Christ came to be called Orthodox: <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">(Russian)</a></p></li><li><p>The councils in brief: <a href="https://pravoslavie.ru/104647.html" lang="ru">pravoslavie.ru</a></p></li><li><p>Local and autonomous Churches: <a href="http://www.patriarchia.ru/db/organizations/30909/" lang="ru">patriarchia.ru</a></p></li></ol>'
