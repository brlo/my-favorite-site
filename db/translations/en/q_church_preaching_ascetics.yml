      <h2>Scripture on Monasticism</h2><h3>Eunuchs Who Choose What Pleases God</h3><p>God especially distinguishes those who, not entering into marriage, take special care to fulfill the laws of God. They are, as it were, exalted above the other “<em>sons and daughters</em>”:</p><blockquote><p>“For thus says the LORD: ‘<strong>To <mark>the eunuchs who</mark></strong> keep My Sabbaths, and choose what pleases Me, and <strong><mark>hold fast My covenant</mark></strong>, even to them I will give in My house and within My walls <strong><mark>a place and a name better</mark> than that of sons and daughters</strong>; I will give them an everlasting name that shall not be cut off’” (<a href="https://bibleox.com/en/eng-nkjv/is/56/#L4-5">Isa. 56:4-5</a>)</p></blockquote><blockquote><p>“<strong>Blessed also is the <mark>eunuch</mark></strong> <strong>whose hands have done no lawless deed</strong>, and who has not devised wicked things against the Lord; for <strong><mark>special favor</mark> will be shown him for his faithfulness, and a place of great delight in the temple of the Lord</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/3/#L14">Wis. 3:14</a>)</p></blockquote><h3>The Way of Perfection, Higher Than the Keeping of the Commandments</h3><p>The rich young man, who was seeking the way of salvation, receives from the Savior the confirmation that for this one must keep the commandments. However, since the young man asked about something greater, the Lord pointed him to something greater: not only to be saved, but also to become perfect. For this the Lord called the young man to give away all his possessions and follow Him:</p><blockquote><p>“Jesus said to him, ‘<strong><mark>If you want to be perfect</mark>, go, <mark>sell what you have and give to the poor</mark>,</strong> and you will have treasure in heaven; <strong>and <mark>come, follow Me</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L21">Matt. 19:21</a>)</p></blockquote><h3>Those Who Have Made Themselves Eunuchs for the Kingdom of Heaven</h3><p>Monks leave all earthly wealth and attachments, and devote their whole life to striving toward God and serving Him. Monks are eunuchs who have subjected themselves to deprivations for the Kingdom of Heaven:</p><blockquote><p>“His disciples said to Him, ‘If such is the case of the man with his wife, <strong>it is better not to marry</strong>.’ But He said to them, ‘<strong>All cannot accept this saying, but only those to whom it has been given</strong>: For there are eunuchs who were born thus from their mother’s womb, and there are eunuchs who were made eunuchs by men, and <strong>there are eunuchs who <mark>have made themselves eunuchs for the kingdom of heaven’s sake</mark></strong>. <strong>He who is able to accept it, let him accept it</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L10-12">Matt. 19:10-12</a>)</p></blockquote><p>These words about eunuchs were spoken by Christ after the apostles had heard His prohibition of divorcing one’s wife. The apostles decided that then it is better not to marry. The Lord did not argue with this conclusion, but only pointed out that not everyone can choose this path. But whoever can, let him choose it. That is, this is a special path of ascetics.</p><h3>The Apostle’s Recommendation</h3><p>The apostle repeats the thought about celibacy now explicitly:</p><blockquote><p>“Now concerning the things of which you wrote to me: <strong>It is good for a man not to touch a woman</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L1">1 Cor. 7:1</a>)</p></blockquote><p>The Apostle Paul had no wife and gives the unmarried and widows the advice (precisely advice) not to seek a new husband, remaining as he himself was:</p><blockquote><p>“But I say to the unmarried and to the widows: <strong><mark>It is good for them if they remain even as I am</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L8">1 Cor. 7:8</a>)</p></blockquote><p>The apostle explains the reasons for this recommendation:</p><blockquote><p>“But even if you do marry, you have not sinned; and if a virgin marries, she has not sinned. Nevertheless such will have trouble in the flesh, but I would spare you. But this I say, brethren, the time is short, so that from now on even those who have wives should be as though they had none, those who weep as though they did not weep, those who rejoice as though they did not rejoice, those who buy as though they did not possess, and those who use this world as not misusing it. For the form of this world is passing away. But I want you to be without care. <strong><mark>He who is unmarried cares for the things of the Lord — how he may please the Lord. But he who is married cares about the things of the world — how he may please his wife</mark></strong>. There is a difference between a wife and a virgin. <strong>The unmarried woman cares about the things of the Lord, that she may be holy both in body and in spirit. But she who is married cares about the things of the world — how she may please her husband</strong>. And this I say for your own profit, not that I may put a leash on you, but for what is proper, and that you may serve the Lord without distraction. But if any man thinks he is behaving improperly toward his virgin, if she is past the flower of youth, and thus it must be, let him do what he wishes. He does not sin; let them marry. Nevertheless he who stands steadfast in his heart, having no necessity, but has power over his own will, and <strong>has so determined in his heart that he will keep his virgin, does well</strong>. So then he who gives her in marriage does well, but <strong>he who does not give her in marriage does better</strong>. A wife is bound by law as long as her husband lives; but if her husband dies, she is at liberty to be married to whom she wishes, only in the Lord. But <strong><mark>she is happier if she remains as she is</mark></strong>, according to my judgment — and I think I also have the Spirit of God” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L28-40">1 Cor. 7:28-40</a>)</p></blockquote><p>Christians who have lived their life in virginity follow Christ in heaven wherever He goes:</p><blockquote><p>“Then I looked, and behold, a Lamb standing on Mount Zion, and with Him <strong>one hundred and forty-four thousand</strong>, having His Father’s name written on their foreheads. And I heard a voice from heaven, like the voice of many waters, and like the voice of loud thunder. And I heard the sound of harpists playing their harps. <strong>They sang as it were a new song before the throne</strong>, before the four living creatures, and the elders; and <strong><mark>no one could learn that song</mark> except the hundred and forty-four thousand</strong> who were redeemed from the earth. <strong>These are the ones who were not defiled with women, for they are <mark>virgins</mark>. These are the ones who <mark>follow the Lamb wherever He goes</mark></strong>. These were redeemed from among men, being firstfruits to God and to the Lamb. And in their mouth was found no deceit, for they are without fault before the throne of God” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L1-5">Rev. 14:1-5</a>)</p></blockquote><h3>The First Christian Community Was a Communal Monastery</h3><blockquote><p>“<strong>Now all who believed were together, and had <mark>all things in common</mark></strong>, and <strong><mark>sold their possessions</mark> and <mark>goods</mark>, and divided them among all, as anyone had need</strong>. So <strong><mark>continuing daily</mark> with one accord <mark>in the temple</mark></strong>, and breaking bread from house to house, they ate their food with gladness and simplicity of heart” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L44-46">Act. 2:44-46</a>)</p></blockquote><blockquote><p>“Now the multitude of those who believed were of one heart and one soul; <strong><mark>neither did anyone say that any of the things he possessed was his own</mark>, but they had all things in common</strong>. &lt;...&gt; Nor was there anyone among them who lacked; for <strong><mark>all who were possessors of lands or houses sold them, and brought the proceeds</mark> of the things that were sold, and laid them at the apostles’ feet</strong>; and <strong><mark>they distributed to each as anyone had need</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L32,34-35">Act. 4:32,34-35</a>)</p></blockquote><blockquote><p>“<strong><mark>Yet none of the rest dared join them</mark></strong>, but the people esteemed them highly” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L13">Act. 5:13</a>)</p></blockquote><h2>Examples of Monastic Life</h2><h3>The Lord Jesus Christ</h3><ul><li><p>was unmarried;</p></li><li><p>had no house of His own (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L20">Matt. 8:20</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/9/#L58">Luke. 9:58</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/19/#L21">Matt. 19:21</a>);</p></li><li><p>had no personal money, was unmercenary (<a href="https://bibleox.com/en/eng-nkjv/mk/12/#L15">Mark. 12:15</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/17/#L24-27">Matt. 17:24-27</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/19/#L21">Matt. 19:21</a>);</p></li><li><p>prayed much in solitude for whole nights (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L12">Luke. 6:12</a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/mf/6/#L6">Matt. 6:6</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/14/#L23,25">Matt. 14:23,25</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/14/#L32,35,37,39-41">Mark. 14:32,35,37,39-41</a>);</p></li><li><p>had disciples (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L13">Luke. 6:13</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/10/#L1">Luke. 10:1</a>);</p></li><li><p>taught prayer, gave His disciples a pattern of prayer (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L9">Matt. 6:9</a>);</p></li><li><p>comforted, rebuked, taught and instructed those who came (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L31">Mark. 6:31</a>).</p></li></ul><h3>The Virgin Mary, the Theotokos</h3><ul><li><p>made a vow of celibacy, was in marriage formally, and had no marital relations (“I do not know a man”, <a href="https://bibleox.com/en/en/w/Th9m_The_Theotokos/#HH-The-Theotokos-Was-and-Remains-a-Virgin">more</a>);</p></li><li><p>had no property, was given in childhood to be brought up in the temple, then betrothed to Joseph, then entrusted by the Lord to the Apostle John (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L27">John. 19:27</a>);</p></li></ul><h3>The Prophet John the Baptist</h3><ul><li><p>was unmarried;</p></li><li><p>lived in the wilderness, without a house of his own (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L80">Luke. 1:80</a>);</p></li><li><p>had rough homemade clothing (<a href="https://bibleox.com/en/eng-nkjv/mf/3/#L4">Matt. 3:4</a>);</p></li><li><p>ate very simple food found in the wilderness (<a href="https://bibleox.com/en/eng-nkjv/mf/3/#L4">Matt. 3:4</a>);</p></li><li><p>the homemade clothing and the food he found indicate that he had no money;</p></li><li><p>taught prayer, gave a pattern of prayer (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L1">Luke. 11:1</a>);</p></li><li><p>had disciples (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L2">Matt. 11:2</a>; <a href="https://bibleox.com/en/eng-nkjv/in/1/#L35">John. 1:35</a>; <a href="https://bibleox.com/en/eng-nkjv/in/3/#L25">John. 3:25</a>);</p></li><li><p>comforted, rebuked, taught and instructed those who came (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L18">Luke. 3:18</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/3/#L10-20">Luke. 3:10-20</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/6/#L31">Mark. 6:31</a>).</p></li></ul><h3>The Prophet Elijah</h3><ul><li><p>was unmarried;</p></li><li><p>often lived in wild conditions, in deserts and caves (<a href="https://bibleox.com/en/eng-nkjv/3ts/17/#L3-7">1 Kin. 17:3-7</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/19/#L9">1 Kin. 19:9</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/19/#L4">1 Kin. 19:4</a>).</p></li><li><p>wore simple clothing of animal hair and a leather belt (<a href="https://bibleox.com/en/eng-nkjv/4ts/1/#L8">2 Kin. 1:8</a>);</p></li><li><p>ate simple food, which the ravens brought (<a href="https://bibleox.com/en/eng-nkjv/3ts/17/#L6">1 Kin. 17:6</a>).</p></li><li><p>had a disciple (<a href="https://bibleox.com/en/eng-nkjv/3ts/19/#L19-21">1 Kin. 19:19-21</a>).</p></li><li><p>at God’s command rebuked the ungodliness of the people (<a href="https://bibleox.com/en/eng-nkjv/3ts/18/#L17-40">1 Kin. 18:17-40</a>).</p></li></ul><h3>The Prophet Daniel</h3><ul><li><p>was unmarried;</p></li><li><p>ate simple food, refusing the king’s food (<a href="https://bibleox.com/en/eng-nkjv/dan/1/#L12">Dan. 1:12</a>).</p></li><li><p>prayed often (<a href="https://bibleox.com/en/eng-nkjv/dan/6/#L10">Dan. 6:10</a>).</p></li><li><p>rebuked ungodliness (<a href="https://bibleox.com/en/eng-nkjv/dan/5/#L17-28">Dan. 5:17-28</a>).</p></li></ul><h3>The Prophet Jeremiah</h3><ul><li><p>was unmarried by God’s command (<a href="https://bibleox.com/en/eng-nkjv/ier/16/#L2">Jer. 16:2</a>).</p></li><li><p>lived in solitude, often being in imprisonment or exile (<a href="https://bibleox.com/en/eng-nkjv/ier/37/#L15-16">Jer. 37:15-16</a>).</p></li><li><p>instructed and rebuked the nations (<a href="https://bibleox.com/en/eng-nkjv/ier/1/#L9-10">Jer. 1:9-10</a>).</p></li></ul>

