      <h2>On God’s Rest</h2><blockquote><p><em>“Then God blessed the seventh day and sanctified it, because in it He </em><strong><em>rested </em></strong><em>from all His work which God had created and made” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/2/#L3"><em>Gen. 2:3</em></a><em>)</em></p></blockquote><blockquote><p>“But Jesus answered them, ‘<strong>My Father has been working until now, and I have been working</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L17">John. 5:17</a>)</p></blockquote><blockquote><p><em>“For </em><strong><em>we who have believed do enter that rest</em></strong><em>, as He has said: ‘So I swore in My wrath, “</em><strong><em>They shall not enter My rest</em></strong><em>,”’ although the works were finished from the foundation of the world” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/4/#L3"><em>Heb. 4:3</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/ps/95/#L11"><em>Ps. 95:11</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/evr/3/#L11"><em>Heb. 3:11</em></a><em>)</em></p></blockquote><h2>The Peace of God</h2><blockquote><p>“<strong><mark>Peace I leave with you, My peace I give to you</mark>; not as the world gives do I give to you. Let not your heart be troubled, neither let it be afraid</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L27">John. 14:27</a>)</p></blockquote><blockquote><p>“<strong>Take My yoke upon you and learn from Me</strong>, for I am gentle and lowly in heart, and <strong><mark>you will find rest for your souls</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L29">Matt. 11:29</a>)</p></blockquote><blockquote><p>“and <strong><mark>the peace of God</mark>, which <mark>surpasses all understanding</mark>, will guard your hearts</strong> and minds through Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/fil/4/#L7">Phil. 4:7</a>)</p></blockquote><blockquote><p>“For <strong>he who has entered His rest has himself also ceased from his works</strong> as God did from His. Let us therefore <strong><mark>be diligent to enter that rest</mark></strong>, lest anyone fall according to the same example of disobedience” (<a href="https://bibleox.com/en/eng-nkjv/evr/4/#L10-11">Heb. 4:10-11</a>)</p></blockquote><blockquote><p>“The LORD will fight for you, and you shall <strong>hold your peace</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/14/#L14">Ex. 14:14</a>)</p></blockquote><blockquote><p>“And He said, ‘My Presence will go with you, and <strong>I will give you rest</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/ish/33/#L14">Ex. 33:14</a>)</p></blockquote><blockquote><p>“Moreover I will appoint a place for My people Israel, and will plant them, that <strong>they may dwell in a place of their own and move no more</strong>; nor shall the sons of wickedness oppress them anymore, as previously” (<a href="https://bibleox.com/en/eng-nkjv/1par/17/#L9">1 Chr. 17:9</a>)</p></blockquote><blockquote><p>“So I swore in My wrath, ‘They shall not enter <strong>My rest</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/ps/95/#L11">Ps. 95:11</a>)</p></blockquote>
