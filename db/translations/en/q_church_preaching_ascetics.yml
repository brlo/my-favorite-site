  - src: стыд-показаться-верующим
    path: Sh1m_Ashamed_to_Appear_a_Believer
    title: Ashamed to Appear a Believer
    meta_desc: Bible quotes about being ashamed to appear a believer
    menu: { parent: Church/Preaching, title: Ashamed to Appear a Believer, priority: 1 }
    body: |-
      <h2>Being Ashamed to Be Called Christ’s</h2><blockquote><p>“For <strong>whoever is ashamed of Me</strong> <strong>and My words</strong> in this adulterous and sinful generation, <strong>of him the Son</strong> of Man <strong>also will be ashamed</strong> when He comes in the glory of His Father with the holy angels” (<a href="https://bibleox.com/en/eng-nkjv/mk/8/#L38">Mark. 8:38</a>)</p></blockquote><blockquote><p>“For <strong>whoever is ashamed of Me and My words</strong>, <strong>of him the Son of Man will be ashamed</strong> when He comes in His own glory, and in His Father’s, and of the holy angels” (<a href="https://bibleox.com/en/eng-nkjv/lk/9/#L26">Luke. 9:26</a>)</p></blockquote><blockquote><p>“May your soul rejoice in God’s mercy, and <strong>may you never be ashamed to praise him</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/51/#L29">Sir. 51:29</a>)</p></blockquote><blockquote><p>“But <strong>the cowardly</strong>, unbelieving, abominable, murderers, sexually immoral, sorcerers, idolaters, and all liars shall have their part in the lake which burns with fire and brimstone, which is the second death” (<a href="https://bibleox.com/en/eng-nkjv/otkr/21/#L8">Rev. 21:8</a>)</p></blockquote><h2>On Suffering for Christ</h2><p><a href="https://bibleox.com/en/en/w/Sf7x_Suffering_for_Christ/">Suffering for Christ</a></p>

  - src: проповедь-споры-о-вере
    path: Ds2p_Disputes
    title: Disputes
    meta_desc: Bible quotes about the character of disputes about the faith and their duration
    menu: { parent: Church/Preaching, title: Disputes, priority: 2 }
    body: |-
      <h2>The Character of Disputes</h2><h3>As Lambs</h3><blockquote><p>“Go your way; behold, <strong>I send you out</strong> <strong><mark>as lambs</mark></strong> among wolves. &lt;...&gt; But whatever city you enter, and they do not receive you, go out into its streets and say, ‘The very dust of your city which clings to us we wipe off against you. Nevertheless know this, that the kingdom of God has come near you’” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L3,10-11">Luke. 10:3,10-11</a>)</p></blockquote><blockquote><p>“Behold, <strong>I send you out <mark>as sheep</mark></strong> in the midst of wolves. Therefore <strong>be <mark>wise</mark> as serpents</strong> and <strong><mark>harmless</mark> as doves</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L16">Matt. 10:16</a>)</p></blockquote><h3>Meekness and Love</h3><blockquote><p>“But sanctify the Lord God in your hearts, and always be ready <strong>to give a defense to everyone who asks you a reason for the hope that is in you, with <mark>meekness</mark> and fear</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L15">1 Pet. 3:15</a>)</p></blockquote><blockquote><p>“Remind them to be subject to rulers and authorities, to obey, to be ready for every good work, <strong>to speak evil of no one, to be peaceable, gentle, showing all <mark>humility</mark> to all men</strong>” (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L1-2">Titus. 3:1-2</a>) <em>(Greek: πραΰτητα — “meekness”)</em></p></blockquote><blockquote><p>“but be gentle to all, able to teach, patient, <strong>in <mark>humility</mark> correcting those who are in opposition</strong>, if God perhaps will grant them repentance, so that they may know the truth” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L22-25">2 Tim. 2:22-25</a>) <em>(Greek: ἐν πραΰτητι — “in meekness”)</em></p></blockquote><blockquote><p>“Who is wise and understanding among you? Let him show <strong>by good conduct that his works are done in the <mark>meekness</mark> of wisdom</strong>. But if you have bitter envy and <strong>self-seeking in your hearts, do not boast and lie against the truth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/3/#L13-14">James. 3:13-14</a>)</p></blockquote><blockquote><p>“Now I, Paul, myself <strong>am pleading with you by the <mark>meekness</mark></strong> and gentleness of Christ — who in presence am lowly among you, but being absent am bold toward you” (<a href="https://bibleox.com/en/eng-nkjv/2kor/10/#L1">2 Cor. 10:1</a>)</p></blockquote><blockquote><p>“<strong>I, therefore, the prisoner of the Lord, beseech you to walk worthy of the calling with which you were called, with all lowliness and <mark>gentleness</mark>, with longsuffering</strong>, bearing with one another in love” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L1-2">Eph. 4:1-2</a>)</p></blockquote><blockquote><p>“<strong>Now the purpose of the commandment is <mark>love</mark></strong> from a pure heart, from a good conscience, and from sincere faith, from which some, having strayed, have turned aside to idle talk, desiring to be teachers of the law, understanding neither what they say nor the things which they affirm” (<a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L5-7">1 Tim. 1:5-7</a>)</p></blockquote><blockquote><p>“Though I speak with the tongues of men and of angels, but have not love, I have become sounding brass or a clanging cymbal. <strong>And though</strong> I have the gift of prophecy, and <strong>understand all mysteries and all knowledge, and though I have all faith, so that I could remove mountains, but <mark>have not love, I am nothing</mark></strong>. And <strong>though I bestow all my goods to feed the poor, and though I give my body to be burned, <mark>but have not love, it profits me nothing</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L1-3">1 Cor. 13:1-3</a>)</p></blockquote><blockquote><p>“But <strong><mark>the wisdom that is from above is first pure, then peaceable, gentle, willing to yield, full of mercy and good fruits, without partiality and without hypocrisy</mark></strong>. Now the fruit of righteousness is sown in peace by those who make peace” (<a href="https://bibleox.com/en/eng-nkjv/iak/3/#L17-18">James. 3:17-18</a>)</p></blockquote><h2>Avoid Foolish Disputes</h2><blockquote><p>“but pursue righteousness, faith, love, peace with those who call on the Lord out of a pure heart. But <strong><mark>avoid foolish and ignorant disputes</mark></strong>, knowing that <strong>they generate strife</strong>. And a servant of the Lord <strong>must not quarrel</strong> but be gentle to all, able to teach, patient, in humility correcting those who are in opposition, if God perhaps will grant them repentance, so that they may know the truth” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L22-25">2 Tim. 2:22-25</a>)</p></blockquote><blockquote><p>“If anyone teaches otherwise and does not consent to wholesome words, even the words of our Lord Jesus Christ, and to the doctrine which accords with godliness, he is proud, knowing nothing, but <strong><mark>is obsessed with disputes and arguments over words</mark>, from which come envy, strife, reviling, evil suspicions</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L3-4">1 Tim. 6:3-4</a>)</p></blockquote><blockquote><p>“Remind them of these things, charging them before the Lord <strong><mark>not to strive about words</mark></strong> <strong>to no profit, to the ruin of the hearers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L14">2 Tim. 2:14</a>)</p></blockquote><blockquote><p>“<strong>But <mark>avoid foolish disputes</mark>, genealogies, contentions, and strivings about the law; for they are unprofitable and useless</strong>. <strong><mark>Reject a divisive man</mark> after the first and second admonition</strong>, knowing that such a person is warped and sinning, being self-condemned” (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L9-11">Titus. 3:9-11</a>) <em>(Greek: αἱρετικὸν ἄνθρωπον — “a heretical man”)</em></p></blockquote>

  - src: наставления
    path: Ex9h_Exhortations
    title: Exhortations
    meta_desc: Bible quotes about exhortation
    menu: { parent: Church/Preaching, title: Exhortations, priority: 9 }
    body: |-
      <blockquote>“Let the word of Christ dwell in you richly in all wisdom, <b>teaching and admonishing one another</b> in psalms and hymns and spiritual songs, singing with grace in your hearts to the Lord” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L16">Col. 3:16</a>)</blockquote><blockquote>“Therefore <b>comfort each other and edify one another</b>, just as you also are doing” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L11">1 Thess. 5:11</a>)</blockquote><blockquote>“but <b>exhort one another</b> daily, while it is called ‘Today,’ lest any of you be hardened through the deceitfulness of sin” (<a href="https://bibleox.com/en/eng-nkjv/evr/3/#L13">Heb. 3:13</a>)</blockquote><blockquote>“And let us <b>consider one another in order to stir up love and good works</b>” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L24">Heb. 10:24</a>)</blockquote><blockquote>“not forsaking the assembling of ourselves together, as is the manner of some, but <b>exhorting one another</b>, and so much the more as you see the Day approaching” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L25">Heb. 10:25</a>)</blockquote><blockquote>“And a servant of the Lord <b>must not quarrel but be gentle to all</b>, <b>able to teach</b>, <b>patient</b>, <b>in humility correcting</b> those who are in opposition, if God perhaps will grant them repentance, so that they may know the truth” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L24-25">2 Tim. 2:24-25</a>)</blockquote>

  - src: апостолы-долго-учили-общины
    path: Al9t_The_Apostles_Taught_Communities_for_Long
    title: The Apostles Taught Communities for a Long Time
    meta_desc: Bible quotes about how the apostles taught communities for a long time
    menu: { parent: Church/Preaching, title: The Apostles Taught for Long, priority: 9 }
    body: |-
      <p>The Apostle Paul taught the presbyters of Asia for 3 years:</p><blockquote><p>“Therefore watch, and remember that <strong>for three years I did not cease to warn everyone night and day</strong> with tears” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L31">Act. 20:31</a>)</p></blockquote><p>The Apostle Paul taught the Christians in Ephesus for 2 years and 3 months:</p><blockquote><p>“And he went into the synagogue and spoke boldly <strong>for three months</strong>, reasoning and persuading concerning the things of the kingdom of God. But when some were hardened and did not believe, but spoke evil of the Way before the multitude, he departed from them and withdrew the disciples, reasoning daily in the school of Tyrannus. And this continued <strong>for two years</strong>, so that all who dwelt in Asia heard the word of the Lord Jesus, both Jews and Greeks” (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L8-10">Act. 19:8-10</a>)</p></blockquote>

  - src: мало-проповедников
    path: Fp10r_Few_Preachers
    title: Few Preachers
    meta_desc: Bible quotes about preachers
    menu: { parent: Church/Preaching, title: Few Preachers, priority: 10 }
    body: |-
      <blockquote>“If you walk in My statutes and keep My commandments, and perform them, &lt;...&gt; you will chase your enemies, and they shall fall by the sword before you. <b>Five of you shall chase a hundred</b>, and a hundred of you shall put ten thousand to flight; your enemies shall fall by the sword before you. For I will look on you favorably and make you fruitful, multiply you and confirm My covenant with you” (<a href="https://bibleox.com/en/eng-nkjv/lev/26/#L3,7-9">Lev. 26:3,7-9</a>)</blockquote><blockquote>“Then He said to them, ‘<b>The harvest truly is great, but the laborers are few</b>; therefore pray the Lord of the harvest to send out laborers into His harvest’” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L2">Luke. 10:2</a>)</blockquote><blockquote>“Then He said to His disciples, ‘<b>The harvest truly is plentiful, but the laborers are few</b>. Therefore pray the Lord of the harvest to send out laborers into His harvest’” (<a href="https://bibleox.com/en/eng-nkjv/mf/9/#L37-38">Matt. 9:37-38</a>)</blockquote>

  - src: искушения
    path: Tm18p_Temptations
    title: Temptations
    meta_desc: Bible quotes about temptations
    menu: { parent: Church/Asceticism, title: Temptations, priority: 18 }
    body: |-
      <h2>A Believer Must Prepare for Temptations</h2><blockquote><p>“<strong><mark>My child, when you come to serve the Lord, prepare yourself for testing</mark></strong>. Set your heart right and be steadfast, and do not be impetuous in time of calamity. Cling to him and do not depart, so that your last days may be prosperous. <strong>Accept whatever befalls you, and in times of humiliation be patient. For gold is tested in the fire</strong>, and those found acceptable, in the furnace of humiliation” (<a href="https://bibleox.com/en/en-nrsv/prsir/2/#L1-5">Sir. 2:1-5</a>)</p></blockquote><h2>Temptations (Trials) Are Beneficial</h2><blockquote><p>“<strong>Many shall be purified, made white, and refined</strong>, but the wicked shall do wickedly” (<a href="https://bibleox.com/en/eng-nkjv/dan/12/#L10">Dan. 12:10</a>)</p></blockquote><blockquote><p>“My child, when you come to serve the Lord, <strong>prepare yourself for testing</strong>. Set your heart right and be steadfast, and do not be impetuous in time of calamity. Cling to him and do not depart, <strong>so that your last days may be prosperous</strong>. <strong>Accept whatever befalls you</strong>, and in times of humiliation be patient. For gold is tested in the fire, and those found acceptable, in the furnace of humiliation” (<a href="https://bibleox.com/en/en-nrsv/prsir/2/#L1-5">Sir. 2:1-5</a>)</p></blockquote><blockquote><p>“<strong>My brethren, count it all joy when you fall into various trials</strong>, knowing that the testing of your faith produces patience. But let patience have its perfect work, that you may be perfect and complete, lacking nothing” (<a href="https://bibleox.com/en/eng-nkjv/iak/1/#L2-4">James. 1:2-4</a>) <em>(Greek: πειρασμοῖς — “temptations, trials”)</em></p></blockquote><blockquote><p>“<strong>Blessed is the man who endures temptation</strong>; for when he has been approved, he will receive the crown of life which the Lord has promised to those who love Him” (<a href="https://bibleox.com/en/eng-nkjv/iak/1/#L12">James. 1:12</a>)</p></blockquote><blockquote><p>“<strong>In this you greatly rejoice, though now for a little while, if need be, you have been grieved by various trials</strong>, that the genuineness of your faith, being much more precious than gold that perishes, though it is tested by fire, may be found to praise, honor, and glory at the revelation of Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L6-7">1 Pet. 1:6-7</a>)</p></blockquote><blockquote><p>“Beloved, <strong>do not think it strange concerning the fiery trial which is to try you</strong>, as though some strange thing happened to you; but rejoice to the extent that you partake of Christ’s sufferings, that when His glory is revealed, you may also be glad with exceeding joy” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L12-13">1 Pet. 4:12-13</a>)</p></blockquote><h2>God Does Not Allow Temptations Beyond Our Strength, and Gives Support</h2><blockquote><p>“No temptation has overtaken you except such as is common to man; but God is faithful, who <strong>will not allow you to be tempted beyond what you are able</strong>, but with the temptation <strong>will also make the way of escape, that you may be able to bear it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L13">1 Cor. 10:13</a>)</p></blockquote><blockquote><p>“then <strong>the Lord knows how to deliver the godly out of temptations</strong> and to reserve the unjust under punishment for the day of judgment” (<a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L9">2 Pet. 2:9</a>)</p></blockquote><h2>How to Overcome Temptations</h2><p>Spiritual watchfulness and prayer are necessary:</p><blockquote><p>“<strong>Watch and pray</strong>, lest you enter into temptation. The spirit indeed is willing, but the flesh is weak” (<a href="https://bibleox.com/en/eng-nkjv/mf/26/#L41">Matt. 26:41</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/14/#L38">Mark. 14:38</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/22/#L40">Luke. 22:40</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/22/#L46">22:46</a>)</p></blockquote><h2>Falling in Temptations</h2><blockquote><p>“But <strong>those who desire to be rich fall into temptation</strong> and a snare, and into many foolish and harmful lusts which drown men in destruction and perdition” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L9">1 Tim. 6:9</a>)</p></blockquote>

  - src: пост
    path: Fs19t_Fasting
    title: Fasting
    meta_desc: "The Lord Jesus Christ, the prophets, the apostles, the disciples of John the Baptist and the Church fasted. “Prayer with fasting is good” (Tob. 12:8)"
    menu: { parent: Church/Asceticism, title: Fasting, priority: 19 }
    body: |-
      <p>On asceticism in general:</p><blockquote><p>“And <strong>everyone who competes for the prize is temperate</strong> in all things. Now they do it <strong>to obtain a</strong> perishable <strong>crown</strong>, but <strong>we for an imperishable crown</strong>. Therefore I run thus: not with uncertainty. Thus I fight: not as one who beats the air. But <strong>I discipline my body and bring it into subjection, lest</strong>, when I have preached to others, I myself <strong>should become disqualified</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/9/#L25-27">1 Cor. 9:25-27</a>)</p></blockquote><p>God calls us to turn to Him with fasting:</p><blockquote><p>“‘Now, therefore,’ says the LORD, ‘<strong>Turn to Me with all your heart, with fasting</strong>, with weeping, and with mourning’” (<a href="https://bibleox.com/en/eng-nkjv/iol/2/#L12">Joel. 2:12</a>)</p></blockquote><p>The Lord Jesus Christ began His preaching with a fast:</p><blockquote><p>“And when He <strong>had fasted forty days</strong> and forty nights, afterward He was hungry” (<a href="https://bibleox.com/en/eng-nkjv/mf/4/#L2">Matt. 4:2</a>)</p></blockquote><p>The Lord taught how to fast rightly:</p><blockquote><p>“Moreover, <strong>when you fast</strong>, do not be like the hypocrites, with a sad countenance. For they disfigure their faces that they may appear to men to be fasting. Assuredly, I say to you, they have their reward” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L16">Matt. 6:16</a>)</p></blockquote><blockquote><p>“But you, <strong>when you fast</strong>, anoint your head and wash your face” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L17">Matt. 6:17</a>)</p></blockquote><p>The disciples of the prophet John fasted:</p><blockquote><p>“Then the disciples of John came to Him, saying, ‘Why do <strong>we and the Pharisees fast</strong> often, but Your disciples do not fast?’” (<a href="https://bibleox.com/en/eng-nkjv/mf/9/#L14">Matt. 9:14</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/2/#L18">Mark. 2:18</a>)</p></blockquote><p>The disciples of Christ will fast after the crucifixion of Christ:</p><blockquote><p>“And Jesus said to them, ‘Can the friends of the bridegroom mourn as long as the bridegroom is with them? But the days will come when the bridegroom will be taken away from them, and then <strong>they will fast</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/9/#L15">Matt. 9:15</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/2/#L20">Mark. 2:20</a>) (<a href="https://bibleox.com/en/eng-nkjv/lk/5/#L35">Luke. 5:35</a>)</p></blockquote><p>Some demons cannot be cast out of a person without fasting:</p><blockquote><p>“However, this kind does not go out except by prayer and <strong>fasting</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/17/#L21">Matt. 17:21</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L29">Mark. 9:29</a>)</p></blockquote><p>A widow at the temple of the Lord served God with prayer and fasting night and day:</p><blockquote><p>“a widow of about eighty-four years, who did not depart from the temple, but <strong>served God with fastings and prayers</strong> night and day” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L37">Luke. 2:37</a>)</p></blockquote><p>An Angel was sent to the centurion during a fast:</p><blockquote><p>“So Cornelius said, ‘Four days ago I <strong>was fasting</strong> until this hour; and at the ninth hour I prayed in my house, and behold, a man stood before me in bright clothing’” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L30">Act. 10:30</a>)</p></blockquote><p>The Holy Spirit communicated with the first Christians during a fast:</p><blockquote><p>“As they <strong>ministered to the Lord and</strong> <strong>fasted</strong>, the Holy Spirit said, ‘Now separate to Me Barnabas and Saul for the work to which I have called them’” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L2">Act. 13:2</a>)</p></blockquote><p>The first Christians added fasting to prayer in every important matter:</p><blockquote><p>“So when they had appointed elders in every church, and prayed <strong>with fasting</strong>, they commended them to the Lord in whom they had believed” (<a href="https://bibleox.com/en/eng-nkjv/act/14/#L23">Act. 14:23</a>)</p></blockquote><p>For the sake of fasting spouses may temporarily abstain from each other:</p><blockquote><p>“Do not deprive one another except with consent for a time, that you may give yourselves <strong>to fasting</strong> and prayer; and come together again so that Satan does not tempt you because of your lack of self-control” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L5">1 Cor. 7:5</a>)</p></blockquote><p>In fasting the apostles show themselves as servants of God:</p><blockquote><p>“But in all things we commend ourselves as ministers of God: in much patience, in tribulations, in needs, in distresses, in stripes, in imprisonments, in tumults, in labors, in sleeplessness, <strong>in fastings</strong>; by purity, by knowledge, by longsuffering, by kindness, by the Holy Spirit, by sincere love...” (<a href="https://bibleox.com/en/eng-nkjv/2kor/6/#L4-6">2 Cor. 6:4-6</a>)</p></blockquote><p>The apostle, reproaching himself for forced self-praise (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L21">2 Cor. 11:21</a>), boasts of fasting:</p><blockquote><p>“in weariness and toil, in sleeplessness often, in hunger and thirst, <strong>in fastings</strong> often, in cold and nakedness” (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L27">2 Cor. 11:27</a>)</p></blockquote><p>The apostle allows Bishop Timothy to relax his fast because of poor health:</p><blockquote><p>“<strong>No longer drink only water</strong>, but use a little wine for your stomach’s sake and your frequent infirmities” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L23">1 Tim. 5:23</a>)</p></blockquote><p>A good deed = prayer + fasting + almsgiving + righteousness:</p><blockquote><p>“<strong>Prayer with fasting is good</strong>, but better than both is almsgiving with righteousness. A little with righteousness is better than wealth with wrongdoing. It is better to give alms than to lay up gold” (<a href="https://bibleox.com/en/en-nrsv/tov/12/#L8">Tob. 12:8</a>)</p></blockquote><p>King and prophet David in times of calamity humbled himself before God with fasting:</p><blockquote><p>“But as for me, when they were sick, my clothing was sackcloth; <strong>I humbled myself with fasting</strong>; and my prayer would return to my own heart” (<a href="https://bibleox.com/en/eng-nkjv/ps/35/#L13">Ps. 35:13</a>)</p></blockquote>

