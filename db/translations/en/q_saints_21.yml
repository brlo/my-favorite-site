  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>From
    the Orthodox point of view, the salvation of man is his free and gracious (aided
    by grace) transition from sin to good, from the sinful life of alienation from
    God to a holy life, to the regaining of the blessedness lost (by the first parents);
    and it consists in communion with God, the Source of life and good.</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
