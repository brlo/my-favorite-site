    title: An assessment of the Protestant teaching of salvation by faith alone
    priority: 8
  body: '<h2>3rd century</h2><h3><a href="https://bibleox.com/en/en/w/6Frm_Tertullian_II_c"><strong>Tertullian
    (c. 155–220)</strong></a></h3><blockquote><p><em>Here, then, those miscreants
    provoke questions. And so </em><strong><em>they say, “Baptism is not necessary
    for them to whom faith is sufficient; for withal, Abraham pleased God by a sacrament
    of no water, but of faith” (Gen. 15:7)</em></strong><em>. But in all cases it
    is the later things which have a conclusive force, and the subsequent which prevail
    over the antecedent. Grant that, in days gone by, there was salvation by means
    of bare faith, before the passion and resurrection of the Lord. </em><strong><em>But
    now that faith has been enlarged, and is become a faith which believes in His
    nativity, passion, and resurrection, <mark>there has been an amplification added
    to the sacrament, viz., the sealing act of baptism</mark>; the clothing, in some
    sense, of the faith which before was bare, and which cannot exist now without
    its proper law. <mark>For the law of baptizing has been imposed, and the formula
    prescribed</mark>: “Go,” He saith, “teach the nations, <mark>baptizing them into
    the name of the Father, and of the Son, and of the Holy Spirit</mark>” (Matt.
    28:19)</em></strong><em>. The comparison with this law of that definition, “Unless
    a man have been reborn of water and Spirit, he shall not enter into the kingdom
    of the heavens” (John 3:5), has tied faith to the necessity of baptism. </em><strong><em>Accordingly,
    all thereafter who became believers used to be baptized</em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-on-baptism#HH-Another-Objection--Abraham-Pleased-God-Without-Being-Baptized-Answer-Thereto-Old-Things-Must-Give-Place-to-New-and-Baptism-is-Now-a-Law">On
    Baptism, 13</a>)</p><h2>17th century</h2><h3>The Epistle of the Patriarchs (1672,
    1723)</h3><p>An exposition of the Orthodox faith, composed by Dositheos, Patriarch
    of Jerusalem. Adopted by the Church of Jerusalem (1672), approved by the four
    Orthodox patriarchs (of Constantinople, Jerusalem, Antioch, and Alexandria) and
    by the Most Holy Synod of the Russian Church, by which it was sent to Great Britain
    in 1723.</p><p>The prevenient divine grace is available to all men freely, without
    the requirement of preceding labours. This grace points out to man what he must
    <strong>do</strong> in order to attain salvation:</p><blockquote><p><strong>[Scripture]
    promiseth the believer <mark>salvation through works</mark></strong>, yet supposeth
    <strong>God to be its (of salvation — note) sole author, by His illuminating grace</strong>,
    which He of the riches of His goodness <strong>bestoweth <mark>without preceding
    works</mark></strong>, <strong><mark>to shew</mark></strong> to men the truth
    of divine things and <strong><mark>to teach him</mark></strong> how he may co-operate
    therewith, if he will, and <strong><mark>do</mark> what is good and acceptable
    [to God], <mark>that</mark> he may thus <mark>obtain salvation</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-3">Epistle
    of the Patriarchs (1672)</a>)</p><h2>19th century</h2><h3>St Theophan the Recluse,
    bishop (1815–1894)</h3><blockquote><p><strong>That faith is necessary for the
    working out of salvation it is needless even to say. The unbeliever does not so
    much as think of salvation.</strong> Wherefore the Apostle Paul writes: “But without
    faith it is impossible to please him: for he that cometh to God must believe that
    he is, and that he is a rewarder of them that diligently seek him” (Heb. 11:6).
    <strong>But one must believe fully — in all that God was pleased to reveal to
    us, without adding and without taking away — and believe as the Holy Orthodox
    Church holds.</strong> Namely: that God is one in essence and three in persons;
    that by His Word He created the world and provides for it; that He created us
    for the life of paradise, honouring us in creation with His image, but we lost
    it when our first parents disobeyed His commandment; that from this fall we could
    not raise ourselves, but the Son of God had mercy on us and, taking upon Himself
    the work of our redemption and restoration, came to the earth, was incarnate,
    suffered, died on the cross, rose again, ascended into heaven and sits at the
    right hand of the Father, in witness of the acceptance of His sacrifice and of
    His intercessory power for the salvation of those who believe in Him; that after
    His ascension He sent down from the Father the Holy Spirit, who, having descended
    upon the Apostles, filled them with all wisdom and power, and they, inspired by
    Him, planted the Christian faith on the earth, and <strong>out of all the believers
    formed</strong> <strong>one body of the Holy Church, under the Head Christ the
    Lord, entrusting to her all the mysteries of the faith and all the sacraments
    that give grace; that, as dispensers of these gracious treasures and in general
    as continuers of the apostolic work of building up the Church, the Apostles, by
    the command of the Lord Himself, left their successors — bishops and priests,
    who receive a special grace for this through ordination, coming down unbroken
    from the Apostles and reaching even to us; that <mark>those who are being saved
    are saved in the body of the Church, that is, not singly but in common with all</mark></strong>,
    living the life common to all true believers, sanctified by the sacraments of
    the Church and abiding under the guidance of pastors; that the salvation of each
    is wrought here on earth in a hidden manner, for the most part in the spirit,
    though known to the one being saved, and will be revealed in its radiance in the
    other life — in the hope of which we take heart in enduring voluntary and involuntary
    deprivations for the sake of salvation; that <strong><mark>those who depart from
    us through the gates of death into the other life do not cease to abide in that
    same one body of the Church and are not deprived of communion with us</mark></strong>,
    only they have it invisible instead of visible.</p><p>&lt;…&gt;</p><p>there are
    wise men who assert that you need only believe, and the grace of God will at once
    enter and dwell in you. So know and hold firmly this conviction and this faith:
    that <strong><mark>the grace of the Holy Spirit is given and can be received in
    no other way than through the sacraments, instituted by the Lord Himself in the
    Church through the hands of the holy Apostles.</mark></strong> That you may be
    more surely assured of this, I will cite for you several examples of the receiving
    of grace according to the direction of the word of God.</p><p>The Lord and Saviour
    Himself, conversing with Nicodemus, said: “Ye must be born again,” meaning the
    gracious birth unto new life. What means did He point out for this? Did He say:
    believe, open your lips, and the grace of the Spirit, having entered, will regenerate
    you? No, He did not say so. What did He say? “Except a man be born of water and
    of the Spirit, he cannot enter into the kingdom of God” (John 3:3–5). <strong>The
    birth of water and of the Spirit is holy baptism — the first Christian sacrament.</strong></p><p>But
    regeneration only makes our nature capable of receiving, containing, and keeping
    the gift of the Holy Spirit; <strong><mark>the bestowal of this gift itself was
    wrought through a special sacrament — namely, the laying on of apostolic hands.</mark></strong>
    One incident, which took place in Ephesus during the apostolic activity of St
    Paul there, shows this to the point of obviousness. Coming to Ephesus, the Apostle
    met there twelve men who believed, and asked them: Did you receive the Holy Spirit
    when you believed? They answered: we have not so much as heard whether there be
    a Holy Spirit. How then were you baptized? asked St Paul. With John’s baptism,
    they answered. Then St Paul explained to them that the baptism of John was only
    a preparation for faith in the Lord Jesus Christ; then, having instructed them
    more fully in the Gospel teaching, he baptized them with Christian baptism — after
    baptism he laid his hands on them — and they received the Holy Spirit. You see
    — baptism apart, and the laying on of hands apart — and the gift of the Holy Spirit
    only after the laying on of hands! Afterwards the Apostles replaced the laying
    on of hands with chrismation, which they handed down to their successors as a
    sacrament that bestows the Holy Spirit on the faithful. It acts to this day in
    the Holy Church.</p><p>These two examples are enough for you to see that <strong><mark>the
    grace of the Holy Spirit is given not by the mental path of faith alone, but by
    the visible path of the holy sacraments. So the Lord Himself ordained it.</mark></strong></p></blockquote><p>(Selected
    letters on sects and heresies. Letter 8)</p><blockquote><p><em>“Your new teacher
    joins to confession such a promise: as soon as you confess Christ with your lips,
    you become one who has received Christ into himself. Where did he get this?! See
    how the Lord and the holy Apostles taught how one receives Christ into himself.
    </em><strong><em>St Paul says: ‘For as many of you as have been baptized into
    Christ have put on Christ’ (Gal. 3:27). He who has put on Christ, of course, has
    received Him into himself. Consequently, he who is baptized becomes one who has
    received Christ into himself. <mark>Before baptism the one being baptized confesses
    Christ the Lord</mark></em></strong><em>, reciting the Creed; </em><strong><em><mark>but
    by this Christ does not take up His dwelling in him; he only becomes capable of
    receiving Him into himself through holy baptism; the indwelling itself is wrought
    through baptism.</mark> </em></strong><em>This is how the Apostle teaches; but
    your teacher interprets otherwise. This is from his own mind, and not from God’s
    revelation and promise.</em></p><p><em>See further. The Lord says: </em><strong><em>‘He
    that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him’ (John
    6:56).</em></strong><em> </em><strong><em><mark>If the Lord abides in the one
    who has communed, this is, of course, because in holy communion he received Him.
    Consequently, he who partakes of the holy Mysteries of the Body and Blood of Christ
    becomes, by this very act, one who has received Him.</mark></em></strong><em>
    Before communion we confess the Lord, saying: ‘I believe, Lord, and I confess…’
    </em><strong><em><mark>But it is not this confession that makes Christ to dwell
    in us, but the very communion of the Body and Blood. The confession only opens
    the entrance for the Lord to be received, in the sacrament of His Body and Blood.</mark></em></strong></p><p><strong><em><mark>Thus
    you see that it is in virtue of baptism and holy communion that we become ones
    who have received Christ, and not in virtue of confession alone</mark>, though
    we make this confession before those sacraments.</em></strong><em> And your teacher
    has invented another path to the receiving of the Lord. This he does out of his
    own falsely wise conceit.</em></p></blockquote><p>(Selected letters on sects and
    heresies. Letter 8)</p>'
