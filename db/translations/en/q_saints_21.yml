    title: Salvation is the work of one’s whole earthly life
    priority: 7
  body: '<h2>Holy Scripture</h2><blockquote><p>“<strong><mark>Be faithful until death,
    and I will give</mark></strong> you the crown of life.” (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L10">Rev.
    2:10</a>)</p></blockquote><blockquote><p>“And you will be hated by all for My
    name’s sake. But <strong><mark>he who endures to the end</mark></strong> will
    be saved.” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L22">Matt. 10:22</a>)
    (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L13">Matt. 24:13</a>)</p></blockquote><h2>4th
    century</h2><h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3><blockquote><p>Afterwards,
    when a man seeks, grace comes to him and takes possession of two parts of the
    soul. Wherefore <strong><mark>the inexperienced one, stirred by grace, thinks
    that the grace that has come has taken possession of all the parts of the soul,
    and that sin has been rooted out; whereas the greater part of the soul is possessed
    by sin</mark>, and only one part is possessed by grace; and the man is deceived</strong>,
    and remains in ignorance. Often grace acts in a man unceasingly, just as the eye
    does in the body. But together with him there abides also sin, and it leads the
    mind into delusion. And <strong>the man without discernment, as if he had already
    reached the goal, dreams much about himself and is puffed up as though he had
    become free. But in fact it is not so; because, as I have said, <mark>Satan hides
    in secret, not acting until the proper time, so as to make the man think of himself:
    “I am pure and perfect”</mark>.</strong> He who plants a vineyard does not at
    once gather clusters from it and make wine. He who sows seed in the ground does
    not straightway reap and receive the fruits. Nor can the newborn child at once
    come to the full measure of a man. Or a recruit in an army does not at once become
    a commander; he must first labour and, having entered the battle, win the victory
    and be crowned.</p><p>&lt;…&gt;</p><p>For example: a man ought to acquire a hundred
    litra of gold, and, having received five litra, he is content with that. But <strong>in
    others, if one may so say, there are ten ounces of grace, and mentally they make
    of them a hundred, and boast of it</strong>. And others, not rarely, having five
    ounces of sin in themselves, make of them half an ounce. This happens to them
    either through ignorance – because, <strong><mark>deceived in their reasoning
    about grace itself, they do not know the matter; or through vainglory, when they
    are ashamed to say that evil is at work in them, because they already proclaim
    themselves perfect</mark></strong>. A man must both do and speak the truth, confessing
    in himself both the gifts of grace and the working of sin. He lies who says that
    he has a pure heart. <strong><mark>In fact it is not so that suddenly, as soon
    as grace has visited him, the man has already become pure</mark></strong>.</p><p>&lt;…&gt;</p><p>As
    there is a sun, and from it many rays come forth; or there is a tall tree, and
    it has many branches; or there is a great city, and it is surrounded by many neighbouring
    lands: so the intelligent essence, the immortal soul, is a beauty more honourable
    than all creation, the image and likeness of God. The grace that comes now shines
    forth in the soul with two rays; or from the whole tree it lights up two branches;
    or from the whole city – two neighbouring lands; but <strong>very many parts of
    the soul are still held by sin, while the soul thinks that it belongs wholly and
    entirely to the good part, is wholly in grace and in brightness</strong>; and
    he who, for example, has acquired five litra of gold imagines that a hundred litra
    have been acquired by him. Has the embryo in the mother’s womb already become
    a perfect man? Or has he who has laid one stone in the foundation already finished
    the building? Or has the seed buried in the ground already become an ear? Has
    the merchant who has only just begun to trade already filled his storehouse? And
    has he who has partaken of a small portion of grace already become on that account
    a Christian? Even the first and the greatest in respect of perfection are the
    same as the lowest clerk before the chief commander, or the small stream before
    the river Euphrates. He who intends to go to a city thirty stages away, if he
    has covered two or three stages, will not think that he has already come to the
    city.</p></blockquote><p>(Seven Homilies, Homily 1, §§ 11–12)</p><h3>St John Chrysostom,
    archbishop of Constantinople (c. 347–407)</h3><blockquote><p>But if even signs
    and wonders did not avail to deliver from punishment; much more, if a man happen
    to be in the priestly dignity: even if he reach the highest honor, even if grace
    work in him to ordination, even if unto all the other things, for the sake of
    those who need his leadership, he also shall hear, “I never knew thee,” no, not
    even then when grace wrought in thee.</p><p><strong>O! how strict shall the search
    be there as to <mark>purity of life</mark>! How does that, of itself, suffice
    to introduce us into the kingdom? While <mark>the absence of it gives up the man
    [to destruction], though he have ten thousand miracles and signs to show.</mark>
    For nothing is so pleasing to God as an excellent course of life. </strong>“If
    ye love Me” (John 14:15), He declares; He did not say, “work miracles,” but what?
    “<strong>Keep My commandments.</strong>” And again, “I call you friends” (John
    15:14), not when ye cast out demons, but “<strong>if ye keep My words.</strong>”
    For those things come of the gift of God: but these after the gift of God, <strong><mark>of
    our own diligence also.</mark></strong> Let us strive to become friends of God,
    and not remain enemies to Him. These things we are ever saying, these exhortations
    we are ever giving, both to ourselves and to you: but nothing more is gained.
    Wherefore also I am afraid. And I would have wished indeed to be silent, so as
    not to increase your danger. For when a person often hears, and even so does not
    act, this is to provoke the Lord to anger. But I fear also myself that other danger,
    that of silence, if when I am appointed to the ministering of the word, I should
    hold my peace. <strong><mark>What shall we then do that we may be saved? Let us
    begin [the practice of] virtue, as we have opportunity:</mark> let us portion
    out the virtues to ourselves, as laborers do their husbandry; in this month let
    us master evil-speaking, injuriousness, unjust anger; and let us lay down a law
    for ourselves, and say, To-day let us set this right. Again, in this month let
    us school ourselves in forbearance, and in another, in some other virtue: And
    when we have got into the habit of this virtue let us go to another, just as in
    the things we learn at school, guarding what is already gained, and acquiring
    others. After this let us proceed to contempt for riches. First let us restrain
    our hands from grasping, and then let us give alms. Let us not simply confound
    everything, with the same hands both slaying and showing mercy forsooth. After
    this, let us go to some other virtue, and from that, to another. “Filthiness and
    foolish talking and jesting, let it not be even named among you.” (Eph. 5:4; Eph.
    5:3.) Let us be thus far in the right way.</strong></p><p>There is no need of
    spending money, there is no need of labor, none of sweat, it is enough to have
    only the will, and all is done. There is no need to travel a long way, nor to
    cross a boundless ocean, but to be in earnest and of ready mind, and to put a
    bridle on the tongue. Unseasonable reproaches, anger, disorderly lusts, luxuriousness,
    expensiveness, let us cast off; and the desire of wealth also from our soul, perjury
    and habitual oaths. <strong><mark>If we thus cultivate ourselves</mark>, plucking
    out the former thorns, and casting in the heavenly seed, we shall be able to <mark>attain
    the good things promised</mark></strong>. For the Husbandman will come and will
    lay us up in His Garner, and we shall attain to all good things, which may we
    all attain, by the grace and lovingkindness of our Lord Jesus Christ, with whom
    to the Father together with the Holy Ghost, be glory, power, honor, now and for
    ever, and world without end. Amen.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-epistle-to-the-hebrews-3#HH-Hebrews-111316">Homilies
    on the Epistle to the Hebrews, 24</a>)</p><h2>19th century</h2><h3>St Theophan
    the Recluse, bishop (1815–1894)</h3><blockquote><p>The general thought of this
    point – that “salvation is given as a free gift and cannot be taken away, for
    the gifts of God are irrevocable” – is <strong>utterly false, flattering, and
    ruinous: for it undermines all the energy of the moral powers and, stopping the
    one who is running towards salvation, deprives him of the possibility of obtaining
    it. </strong>The economy of salvation is immutable and eternally mighty – all-sufficient
    for the salvation of all who have lived, who live, and who are yet to live in
    all times – and its power extends over all eternity. <strong><mark>But to the
    salvation of each particular person these qualities – immutability, unchangeableness,
    eternity – cannot be applied unconditionally while he is still here on earth</mark>.
    </strong>In this respect one can only say: he who believes and, according to his
    faith, faithfully fulfils everything needful for salvation, as the Saviour Himself
    established in His Holy Church, will without doubt be saved; but he who does not
    fulfil this needful thing cannot hope to be saved on the sole ground that the
    salvation ordained by the Lord is immutable, even after he has come to the Lord
    by faith and has received the firstfruits of salvation — the forgiveness of sins
    and the grace of the Holy Spirit. <strong> <mark>He who, having received forgiveness
    of sins, sins again, loses this gift; and likewise he who, having received the
    grace of the Holy Spirit, offends this Spirit of God by sins, is deprived of this
    gift. Such a one passes again into the rank of the unforgiven and the graceless.
    The received beginning of salvation is destroyed; it must be sought anew.</mark></strong>
    The word “cannot be taken away”, on account of our changeableness, is not applicable
    to the obtaining and the working out of salvation. Consequently it is used falsely
    and deceives the inexperienced.</p></blockquote><p>(Selected letters on sects
    and heresies. Letter 26)</p><blockquote><p>…to the one who has resolved to work
    out his salvation and has received grace for that, <strong><mark>there is set
    before him, through the action of his grace-filled spirit, the task of purifying
    soul and body from the passions and of re-tuning them to every good, so as to
    make them a temple worthy of God, who has promised to dwell in those who believe
    and to walk in them.</mark></strong></p><p>I will not repeat all of that. I take
    this one main proposition: the soul and the body must be purified and re-tuned
    by the power of the grace-filled spirit. – <strong>What is needful for this? Labours
    are needful – bodily labours for the body, labours of the soul for the soul, and
    spiritual labours for the spirit: for the spirit also must be quickened and strengthened,
    that it may constantly feel itself possessed of the power to act with authority
    upon the soul and the body</strong>.</p><p><strong>Bodily labours are needful
    because the body serves as the seat of the passions. If thou humblest not the
    flesh, thou shalt have no success in overcoming the passions. </strong>The flesh
    must therefore be wearied with deprivations of food, sleep, rest, and every delight
    of the senses. – <strong>But the handmaid and the lover of the passions is the
    soul. She must therefore be taken in hand and laboured upon even more than the
    body. In her arise passionate thoughts and desires, and they draw her to passionate
    deeds, because the passions themselves dwell in her. The task of the one being
    saved is to drive out these passionate movements, and in their place to restore
    and plant good thoughts, feelings and dispositions.</strong> This action, and
    everything else done for its sake, constitutes the subject of the labours of the
    soul. – <strong>Finally, the labours of the spirit are prayer and meditation upon
    God, </strong>and everything undertaken for their sake as an auxiliary means.</p><p><strong><mark>The
    Saviour pointed to these labours in the Sermon on the Mount, when He gave instruction
    on how to fast, to give alms, and to pray. Under fasting are here comprised all
    the bodily labours, under almsgiving – those of the soul, under prayer – those
    of the spirit.</mark></strong></p></blockquote><p>(Selected letters on sects and
    heresies. Letter 27)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter
    (1863–1955)</h3><blockquote><p>The spiritual life of a Christian begins from the
    time of his holy Baptism. In a man who has believed in Christ, even though he
    has been washed in baptism from the sins (committed before baptism), there remains
    an inclination to evil which tempts him to sin, and this he must root out, living
    in communion with the Church of Christ, with the help of the grace of God (cf.
    Eph. 4:22–24). In baptism he expressed only his resolve (the “answer of a good
    conscience” toward God – 1 Pet. 3:21) to leave the former path of sin and to walk
    the new path, the path of Christ; but <strong>this is not yet the final moral
    regeneration, but only its beginning</strong>. The life that follows must be the
    development and continuation of the moral renewal. “<strong>He who has received
    the laver of regeneration</strong>”, teaches St Gregory of Nyssa, – “<strong>is
    like a young soldier who has just been entered on the military rolls, but has
    not yet shown anything martial or manly... So do thou also: <mark>having received
    grace, do not think to dwell together with the righteous and to be enrolled in
    their choir, unless thou endure many hardships for piety, unless thou wagest the
    struggle with the flesh and then with the devil, and manfully withstandest all
    the arrows of the wicked spirits</mark></strong>”.</p><p>The Lord Jesus Christ
    taught: “Blessed are the poor in spirit, for theirs is the kingdom of heaven”
    (Matt. 5:3–16). “You shall be perfect, just as your Father in heaven is perfect”
    (Matt. 5:48). “Be merciful, just as your Father also is merciful” (Luke 6:36).
    Such is the ideal of moral perfection pointed out by the Lord to the Christian.
    <strong><mark>If he has gone after Christ, he must strive towards and draw near
    to that ideal. This is the work not only of his whole earthly life, but of boundless
    eternity</mark></strong>. Which of the Christians could ever say of himself that
    he is “perfect and merciful, as the heavenly Father?” – “Enter by the narrow gate”
    (Matt. 7:13–14; Luke 13:24). The narrowness of the saving path on which the Christian
    must walk comes not only from outward deprivations and sorrows, but chiefly from
    the necessity of restraining one’s strivings of soul and the desires of the heart
    that are contrary to the requirements of the Gospel, from the necessity of an
    unceasing struggle with sinful desires (Rom. 8:5, 8; Gal. 5:16–17, 19–21). For
    this struggle there are required from the man himself efforts, labours, and labours
    not small: “the kingdom of heaven suffers violence, and the violent take it by
    force” (Matt. 11:12). “Whoever desires to come after Me, let him deny himself
    (renounce everything to which he has attached himself) and take up his cross,
    and follow Me. For whoever desires to save his life (for earthly enjoyments, yielding
    to it in everything, fulfilling its desires and caprices) will lose it (for the
    Kingdom of Heaven); but whoever loses his life for My sake and the gospel’s (will
    suppress its caprices) will save it (for eternal joy in the Kingdom of Heaven)”
    (Mark 8:34–35; cf. Matt. 10:38–39; 16:24; Luke 9:23, 14:27). The same the holy
    apostles taught: “having escaped the corruption that is in the world through lust...
    you, giving all diligence, add to your faith virtue... be even more diligent to
    make your call and election sure” (2 Pet. 1:4–5, 10). “Therefore, beloved, looking
    forward to these things, be diligent to be found by Him in peace, without spot
    and blameless” (2 Pet. 3:14). “Everyone who has this (verse 2) hope in Him purifies
    himself, just as He is pure” (1 John 3:3). “Therefore, beloved, having such promises
    (communion with God – 2 Cor. 6:16, 18), let us cleanse ourselves from all filthiness
    of the flesh and spirit, perfecting holiness (ἐπιτελοῦντες ἁγιωσύνην – attaining
    holiness) in the fear of God” (2 Cor. 7:1). “Those who are Christ’s have crucified
    the flesh with its passions and desires” (Gal. 5:24; cf. 1 Cor. 9:27; Eph. 4:22–24;
    Col. 3:5–10 etc.). “With fear and trembling (before the danger of perishing through
    sin) work out your own salvation” (Phil. 2:12). “We have become partakers of Christ
    (the apostle did not say that we shall be such partakers eternally, but) if we
    hold the beginning of our confidence steadfast to the end” (Heb. 3:14; cf. Col.
    1:22–23). “You have not yet resisted to bloodshed, striving against sin” (Heb.
    12:4; cf. Heb. 12:14).</p><p><strong><mark>Christians, members of the earthly
    Church, who struggle against sin, are, according to the word of the apostle, not
    saved, but being saved</mark></strong>: “And the Lord added to the church daily
    <strong><mark>those who were being saved</mark></strong>” (Acts 2:47). “For the
    message of the cross... to us <strong><mark>who are being saved</mark></strong>
    it is the power of God” (1 Cor. 1:18). “For we are to God the fragrance of Christ
    among <strong><mark>those who are being saved</mark></strong> and among those
    who are perishing” (2 Cor. 2:15; cf. Acts 15:11; Rom. 8:24). “The nations of those
    who are <strong>saved</strong> will walk (in the new holy City of Jerusalem),
    when there appear (verses 1–2) the new heaven and the new earth” (Rev. 21:24).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
