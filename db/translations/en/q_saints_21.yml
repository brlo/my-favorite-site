  path: The-economy-of-salvation
  title: The economy of salvation
  menu:
    parent: The Church as mediator of salvation
    title: The economy of salvation
    priority: 4
  body: "<h2>5th century</h2><h3>Blessed Theodoret of Cyrrhus (386–457)</h3><blockquote><p>The
    one divine nature has need of nothing; but every creature had need of the healing
    of the Economy. For the elements, created for the use of men, God made subject
    to corruption, because transgression was to make man also mortal. And the invisible
    powers grieved, presumably, seeing the wickedness taking up its abode among men.
    For if they rejoice over “one sinner that repenteth,” as the Lord said (Luke 15:7),
    it is plain that they grieve, seeing the opposite. But the incarnation of the
    Only-begotten, having crushed death, having shown forth the resurrection, and
    having given pledges of the general resurrection, scattered this most dark cloud.
    Wherefore the Apostle calls this sudden change of things “recapitulation.” For
    <strong>through the economy of the Lord Christ human nature is raised up and clothed
    in incorruption, and the visible creation, set free from corruption, attains incorruption,
    and the hosts of the invisible powers shall abide in joy</strong>, because “sickness
    and grief and sighing have fled away” (Isa. 35:10).</p></blockquote><p>(Commentary
    on the Epistle to the Ephesians)</p><h2>19th century</h2><h3>St Theophan the Recluse,
    bishop (1815–1894)</h3><blockquote><p>For him who desires to understand fully
    all that pertains to our salvation, it is necessary <strong>to distinguish <mark>two
    moments</mark>: <mark>the economy of salvation</mark>, or the ordering of everything
    needful for salvation — <mark>and the working out of the salvation of each person</mark>.
    The first was wrought by the Lord Jesus Christ by the good pleasure of the Father,
    but not without the Holy Spirit; and the second is wrought, by the same good pleasure
    of the Father, by the Holy Spirit, but not without Christ the Lord — the Son of
    God.</strong> Two things are needful for our salvation: to remove from us the
    curse for the fall, and to renew our nature so that it may be sinless. <strong><mark>Both
    of these the Lord Jesus Christ wrought in Himself: He removed the curse that lay
    upon us by His death on the cross; and in His own person He showed forth our nature
    sinless, pure, and perfect. Thus everything essentially needful for our salvation
    is contained in the person of the Lord Jesus Christ — in which sense it is said
    that in the person of the Lord the human race was saved.</mark></strong> But in
    order that the salvation of each man in particular may be accomplished, it is
    necessary that the needs of salvation contained in the person of the Lord <strong>pass
    into each one and be made his own.</strong> <strong><mark>This last is wrought
    by the Holy Spirit.</mark></strong> By the word of the Gospel He arouses faith
    in the power of the Lord’s death on the cross, and in the font of baptism He washes
    the believer both from original sin and from all voluntary sins, at the same time
    renewing his spiritual life and making it strong to withstand sin and to make
    progress in good. Both needs of salvation are satisfied at once. <strong>The one
    who comes up out of the font of baptism is both justified and righteous</strong>
    — every guilt of sin is taken away from him, and he desires only the good well-pleasing
    to God and is able to do it. <strong>This is precisely the putting on of Christ,
    in which what is needful for salvation passes from Christ the Lord to the believer
    and the one being baptized, and is made his own not nominally but essentially.</strong>
    So long as he only believes in Christ, these needs are his, but only nominally,
    as appointed to him and ready for him; in the font of baptism, however, they become
    essentially his possession. Here he is like a scion grafted to a tree, drawing
    its life-giving sap into itself. <strong>The tree is the Lord. The sap of this
    tree is the curse-removing and justifying power of the death on the cross, and
    the renewed human life, manifested in perfection. </strong>Both of these the scion
    — the new believer — receives into itself and sucks into itself in baptism. And
    this is wrought not by the water alone, but by the Holy Spirit through the water,
    having first prepared the one being baptized, by repentance and faith, to receive
    both. <strong><mark>For this reason the Lord Jesus Christ, having endured the
    death of the cross and risen again, ascended into heaven and sent down from the
    Father to us on earth the Holy Spirit, that He might endue all men with those
    blessings and needs of salvation which are contained for us in the person of the
    Lord.</mark></strong> For this very reason He said: “It is expedient for you”
    that I go to the Father; for if I go not away, “the Comforter will not come unto
    you” (John 16:7).</p></blockquote><p>(Selected letters on sects and heresies.
    Letter 24)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Through
    the fall of our first parents men lost the blessed communion with God. <strong><mark>In
    order to restore this communion, it was necessary, by bringing a satisfaction
    to divine justice, to reconcile man with God, to set him free from sin — as guilt
    and as a state and the consequences of sin — to renew the spiritual and moral
    nature of man, so that he should cease to be a sinner and become able to answer
    divine love with love, and not with enmity. To accomplish this (cf. Matt. 1:21;
    Luke 1:75–77) God the Son became incarnate</mark></strong>,<strong> showed forth
    in His own person the sinless human nature, took upon Himself the sins of the
    world, endured sufferings and death for them, and, having thereby brought a satisfaction
    to the justice of God, received the right to forgive the sins of all who repent,
    to cleanse and to sanctify them (Rom. 3:23–25; Eph. 1:7; Col. 1:14; Heb. 9:26–28,
    10:10, 13:12). To set man free from sin, to renew his nature, He, after His resurrection
    and ascension into heaven, sent down from God the Father the Holy Spirit into
    the Church He had founded, that He might abide for ever (John 14:16). <mark>This
    is the divine side in the work of the salvation of man. Everything needful for
    salvation the Lord wrought by the good pleasure of God the Father (cf. John 3:16;
    Heb. 10:5–9, etc.) together with the Holy Spirit.</mark></strong></p><p>The Lord
    Jesus Christ, according to the teaching of the Orthodox Church, <strong><mark>is
    not only the propitiatory sacrifice, but also the restorer of our fallen nature</mark></strong>:
    “for this He came,” teaches St Macarius of Egypt († 390), “<strong><mark>to change,
    transform, and renew the nature</mark></strong>, and this soul, cast down by transgression
    into the passions, to create anew, mingling it with His own Divine Spirit.” “The
    aim of the coming of the Saviour,” says St Isaac the Syrian, “was to cleanse the
    soul from the evil produced by the first transgression and to restore it to its
    primitive state.” “<strong><mark>The economy of God and the Saviour towards man</mark></strong>,
    writes St Basil the Great, <strong><mark>is a calling out of the state of fall
    and a return to communion with God from the state of alienation brought about
    by disobedience</mark></strong>. For this purpose came the coming of Christ in
    the flesh, the outlines of the Gospel rules of life, for this purpose the sufferings,
    the cross, the burial, the resurrection — that man, being saved through the imitation
    of Christ, might receive that ancient adoption.”</p><p>“He became incarnate,”
    notes Blessed Theodoret, “in order to renew the nature corrupted by sin. Therefore
    He took upon Himself the whole nature that had sinned, that He might heal it all.”</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
