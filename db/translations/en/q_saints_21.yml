    priority: 2
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Communion
    with God, which constitutes the essence of the Christian life, is promised to
    man (John 6:56; 14:23; 2 Cor. 6:16–18). For the restoration of communion with
    God, God the Son became incarnate. For the unity and communion of the believers
    with the Father and the Son the Lord Himself prayed (John 17:20–23); communion
    with God was the aim of the apostolic preaching (1 John 1:3 – “communion” – ἡ
    κοινωνία – community, participation, bond; 1 Cor. 1:9; 2 Pet. 1:4 and elsewhere).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
