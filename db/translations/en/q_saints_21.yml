- src: zKtXTS7C_Что_требуется_от_человека
  path: What-is-required-of-man-for-salvation
  title: What is required of man for salvation
  menu:
    parent: The Church as mediator of salvation
    title: The conditions of salvation
    priority: 3
  body: "<h2>4th century</h2><h3>St Gregory of Nyssa, bishop (c. 331–394)</h3><blockquote><p>Blessed
    is God alone, as the Apostle names Him (1 Tim. 6:15), but <strong>for men communion
    in blessedness is possible through <mark>likeness to God</mark></strong>; this
    imitation, however, is exceedingly difficult: then it would follow that the blessedness
    of human life is unattainable. But even in the Godhead there is that which, as
    being possible, is set before those who wish it for imitation. What is it exactly?
    As it seems to me – <strong><mark>poverty of spirit</mark>; by it Scripture names
    voluntary humility</strong>. As an example of it the Apostle sets forth the poverty
    of God, saying: He, “being rich, for our sakes became poor, that we through His
    poverty”, might become rich (2 Cor. 8:9). Since, therefore, all else that is seen
    to belong to the Divine nature exceeds the measure of human nature, while humility
    is something akin to us and grown up together with us, who walk on the earth,
    have our composition from the earth, and return to the earth; then do you yourself,
    <strong>by becoming like God in that which is natural and possible for you, put
    on this blessed image</strong>. And let no one deem progress in humility effortless
    and easily acquired. <strong>On the contrary, this work is more difficult than
    any virtuous undertaking whatsoever</strong>. Why so? Because when man, having
    received within himself the good seed, fell asleep, the enemy of our life rooted
    in us the chief of the contrary sowing – the tares of pride. For by the very thing
    by which he cast himself down to the earth, the same he also drew poor mankind
    with himself into the common fall; and for our nature there is no other evil like
    this malady produced by pride. Therefore, since the passion of exaltation is inborn
    in almost everyone who belongs to the human race, the Lord begins the Beatitudes
    with this, as with a kind of original evil, uprooting pride from our habit by
    counselling us to become willingly like Him Who became poor, and Who is truly
    blessed, so that we, in what we can, as much as there is strength in us, <strong>by
    becoming like Him through voluntary poverty</strong>, may draw to ourselves also
    communion in blessedness.</p></blockquote><p>(On the Beatitudes, Homily 1)</p><h2>20th
    century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“God
    is love, and he who abides in love abides in God, and God in him” (1 John 4:16).
    “God is light and in Him is no darkness at all” (1:5), that is, God is the all-perfect
    Being, and in Him there is no moral defilement. Communion with God, Who is “love”
    and “light”, <strong><mark>requires of man love for God and for men, cleansing
    from sin, moral perfection, holiness (Matt. 5:8; Heb. 12:14), likeness in the
    inner disposition to the all-holy Being</mark></strong>. The model of moral good
    and the object of imitation for the Christian is the Saviour (1 John 2:6; 3:16;
    1 Pet. 2:21; Eph. 5:1–2, etc.). “In you”, says the apostle, “there must be the
    same feelings (the same inner disposition) as in Christ Jesus” (Phil. 2:5). “Blessed”,
    remarks St Gregory of Nyssa († 394), “is God alone, as the apostle names Him (1
    Tim. 6:15), but for men communion in blessedness is possible through likeness
    to God... The Lord counsels (Matt. 5:3) us to become willingly like Him Who became
    poor, and Who is truly blessed, so that we, in what we can, as much as there is
    strength in us, by becoming like Him through voluntary poverty, may draw to ourselves
    also communion in blessedness... He who wishes to draw near to anyone must imitate
    his character; so the soul that desires to be the bride of Christ must, as far
    as possible, liken itself to the beauty of Christ. The soul that intends to soar
    to the Godhead and to cleave to Christ must banish from itself every sin”.</p><p><strong><mark>The
    mere non-imputation of sins to a man, without inward cleansing from them, cannot
    give him communion with God, because sin is not guilt only, but inward uncleanness,
    love for the sensuous, the unclean</mark>. Communion of a sinful man with the
    all-holy Being is utterly inconceivable. “For, says the apostle, what communion
    has righteousness with lawlessness? And what communion has light with darkness”
    (2 Cor. 6:14; cf. 1 John 1:6).</strong></p></blockquote><p>(The Orthodox Church
    and the Sectarians, 1.2)</p>"
