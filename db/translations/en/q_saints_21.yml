  body: "<h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p>This
    – to be in the body of the Church and to work out one’s salvation in her – is
    what binds every believer:</p><p><strong><mark>1) to believe as the whole Church
    believes, from her beginning to this day</mark>,</strong> <strong>to test by her
    voice every consideration of one’s own or of others, and resolve every doubt that
    arises, and on no account allow oneself to admit anything, though it be but a
    hair’s breadth, that is not in agreement with the teaching of the Church.</strong>
    <strong><mark>For she is “the pillar and ground of the truth”</mark></strong>
    (1 Tim. 3:15). Mark this – whoever does not observe this is “a heathen and a publican”,
    by the word of the Lord (Matt. 18:17);</p><p><strong><mark>2) not to be separate
    from all in anything in the orders of churchly life</mark></strong>: <strong>to
    fast when the fast is set before all, to prepare and to commune of the Holy Mysteries
    of Christ as is established in the Church, and to observe all the other prayerful
    and sanctifying sacred offices of the Church, </strong>obeying the word of the
    Apostle, who forbids forsaking the assemblies (Heb. 10:25);</p><p><strong><mark>3)
    to hold the conviction that the heavenly and the earthly are in unbroken communion
    with one another, living and immediate</mark>.</strong> This is why our prayers
    to them and for them, and their prayers for us, are both heard and effectual.
    We are kin, related both to the Angels and to all who from the age have pleased
    God; for, being churched, we draw near to “the city of the living God, the heavenly
    Jerusalem, and to an innumerable company of Angels... and to the Church of the
    first-born which are written in heaven” (Heb. 12:22–23).</p><p>Let us now gather
    together again all that has been said about the saving path and repeat it: <strong><mark>do
    you wish to be saved? Believe all the divinely revealed teaching, and, receiving
    the gracious powers that are unto life and godliness through the Holy Mysteries,
    live steadfastly according to the commandments of God under the guidance of the
    divinely established pastors and in obedience to them, – but all this in the spirit
    of the Holy Church of God, according to her laws, and being in living union with
    her – and you will be saved.</mark></strong></p></blockquote><p>(Selected letters
    on sects and heresies, Letter 8)</p><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p><strong><mark>By the grace of God,
    with the self-active participation of man himself (1 Cor. 15:10; cf. 2 Tim. 4:7),
    his salvation is wrought</mark></strong>: cleansing from sin (Acts 2:38, 22:16),
    the crucifixion of the flesh with its passions and lusts (Gal. 5:24), the putting
    off of the old man and the putting on of the new man (Eph. 4:24), and the attaining
    of communion with God (Rom. 8:9–11; Gal. 2:20, etc.).</p><p>“For my advancement”,
    writes St Gregory the Theologian, “<strong><mark>two portions from the Great God
    are needed, namely: the first and the last, and also one portion from me... God
    grants me the power as well, and in the middle am I, running the race</mark></strong>”.</p><p>“The
    soul”, remarks the venerable Macarius the Great of Egypt, “that truly believes
    in Christ must pass from its present corrupt state into another, good state, and
    change its present abased nature into another, divine nature, and <strong><mark>become
    a new nature by the cooperating power of the Holy Spirit</mark></strong>; then
    can it become fit for the heavenly kingdom”. – “The vices hidden in the soul,
    teaches St Gregory of Nyssa, are so evil and so hard to heal that <strong><mark>by
    human effort and virtue alone, without accepting the help of the power of the
    Spirit, it is impossible to destroy and banish them</mark></strong>”.</p></blockquote><p>(The
    Orthodox Church and the Sectarians, 1.2)</p>"
