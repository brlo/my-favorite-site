      <h2>Ancient Texts</h2><p>The important work of Irenaeus of Lyon, <em>Against Heresies</em>, was written in ancient Greek and is today in large part lost. Remnants of the Greek text are preserved here: <a href="https://bibleox.com/en/grc/w/Az9E_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_1">“Against Heresies” (in Greek)</a></p><p>In antiquity, however, this work was translated into Latin. Modern translations are usually made from the Latin critical text: <a href="https://bibleox.com/en/la/w/LATIN-Adversus_haereses_LIBER_I">“Against Heresies” (in Latin)</a></p><h2>Biography</h2><p>Irenaeus of Lyon (Ancient Greek Εἰρηναῖος Λουγδούνου; Latin Irenaeus Lugdunensis)</p><p><strong>Commemoration</strong>: 23 August (5 September)</p><h3>Path to the Pastorate</h3><p>Little is known about the details of the life and pastoral ministry of Saint Irenaeus of Lyon. Even the place and date of birth of this great saint are concealed from us behind the veil of history. Irenaeus’ parents are believed to have been Christians.</p><p>It can be asserted with a high degree of certainty that he was born in the second quarter of the 2nd century. On the basis of a number of indirect facts this event is dated to approximately the year 130.</p><p>According to the recollections of Irenaeus himself that have come down to us, in his adolescence he was in contact with Saint Polycarp of Smyrna, a friend of the outstanding pastor of the Church Ignatius the God-Bearer and a disciple of the Evangelist John the Theologian. Irenaeus’ circle of acquaintances also included other men who had been witnesses of the apostolic preaching and of the apostolic miracles.</p><p>The community of Polycarp, in its epistle on the martyrdom of Polycarp, writes that Irenaeus was his disciple:</p><blockquote><p>This account Gaius copied from the papers of <strong>Irenaeus, a disciple of Polycarp</strong>. …</p><p>And I Socrates wrote it down in Corinth from the copy of Gaius.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-22">The Martyrdom of Polycarp, 22</a>)</p><p>His Greek name, his close connection with the Bishop of Smyrna, his good knowledge of Greek literature, philosophy and poetry, and his acquaintance with the methods of dialectic give grounds for supposing that Irenaeus was a Greek by origin (some scholars of his life and work, however, allow that he had Syrian roots).</p><p>In all probability, Irenaeus’ native land was Smyrna or one of the geographical regions adjoining it.</p><p>The spiritual atmosphere in which Irenaeus was brought up exerted the most beneficial influence upon his formation.</p><p>The Church of Smyrna, despite its poverty (Rev. 2:9), was distinguished by a good organisation. Its preaching and missionary activity were marked by a strict conformity to the spirit of the Gospel and of the apostolic Tradition. The zealous striving of Saint Polycarp of Smyrna to preserve and to spread the faith in unstained purity was in time transmitted to his disciple Irenaeus as well.</p><h3>Priestly Ministry in Gaul</h3><p>In what year of his life, and under what particular circumstances, Irenaeus left his native parts and set out for Gaul (the territory of present-day France), history does not report. One thing is known beyond doubt: he set himself the aim of spreading the preaching and strengthening the faith among the population there. It is believed that Polycarp of Smyrna himself blessed him for this mission. And this is not surprising, for there had long existed a friendly communion between the Christians of Smyrna and those of Gaul.</p><p>At that time the head of the Church of Lyon was Bishop Pothinus. Irenaeus, ordained to the priesthood, zealously bore with him the burden of pastoral ministry, was an earnest champion of the purity of the faith and an assistant to the ruling hierarch.</p><p>The time of Irenaeus’ ministry fell upon an era of the cruellest persecutions of the Church, now dying down, now flaring up with new force. Christians were robbed, punished for invented crimes, deprived of their property, beaten, tortured, raped and killed. To these external dangers were added internal ones, connected with the spread of heresies and of schismatic attitudes.</p><p>All this demanded of the clergy a special love, zeal and responsibility before God and the flock. The Christians of Lyon, and among them Bishop Pothinus, saw in Irenaeus precisely such a presbyter.</p><p>In that period the sect of the Montanists acquired great influence. The followers of this community laid claim to primacy in the possession of the gifts of grace. When the supporters of Montanus reached Rome and began to sow their errors among the Roman Christians, the local bishop Eleutherius, well aware of the danger, announced that he was breaking off good religious relations with the adherents of this heresy.</p><p>The martyrs of Lyon, having shown the liveliest interest in those events, sent a letter to Eleutherius and entrusted its delivery to the presbyter Irenaeus, and a few lines in that same letter were devoted to this. In these lines the martyrs expressed their complete confidence in Irenaeus, calling him a brother and a fellow-worker. There too they indicated that if the place of a presbyter were determined exclusively by righteousness, Irenaeus would be the first among them.</p><p>The letter played a positive role. The Roman bishop took into account the wishes of the believers of Lyon and granted peace to those who had gone astray.</p><h3>Episcopal Ministry</h3><p>After the death of the ninety-year-old Bishop Pothinus, who died in confinement in 177 or 178, Saint Irenaeus, with the support of the people, was deemed worthy of elevation to the episcopal see of Lyon.</p><p>One of his immediate tasks was the restoration of the activity of the Church of Lyon after the recent persecution. The task was not an easy one: many representatives of the Church had been tortured or killed, and the discontent of the pagans still made itself felt.</p><p>Bishop Irenaeus did not cease to do everything in his power for the establishment of the faith. He preached much himself and directed the priests to preach in the remote regions of Gaul, in particular in Valence and Besançon.</p><p>Another important field of activity for the new bishop was the struggle against Gnosticism. In this respect Saint Irenaeus is acknowledged as the most outstanding figure of his time.</p><p>On the whole, the Gnostic false teachings were an explosive mixture of perverted Christian ideas, pagan myths, philosophical doctrines and private fantasies. By virtue of this, all of them were distinguished by an obscurity and confusion of content. The unintelligibility of their views was accordingly presented as mystery. In certain sects, in order to increase the atmosphere of mystery or mysticism, false miracles were practised. The followers of each Gnostic sect believed that it was precisely their “faith” that was perfect. This not infrequently drew religiously illiterate and vainglorious people into their ranks.</p><p>This whole situation troubled and disturbed Irenaeus of Lyon. On every convenient occasion he explained to his flock wherein lay the danger of deviating from the faith of Christ and of disobedience to the Church, and laid bare the absurdity of the Gnostic teachings.</p><p>Contending for the purity of the faith, he did not confine himself to the area of his own diocese. Thus he sent a letter to the presbyter Florinus and pointed out to him his heretical deviations; and when the latter refused to heed sound instruction, Irenaeus wrote to the Roman bishop, asking him to react, to take urgent measures of influence and to extinguish the hotbed of heresy.</p><p>In the course of several years of his pastoral ministry he carefully investigated, described and exposed a whole series of Gnostic trends. Subsequently his labours were collected into a single work which became the possession of the Universal Church. The mastery of Gnostic ideas that Irenaeus of Lyon displayed still evokes admiration. Today this work is known to the reader under the title: The Detection and Overthrow of the So-Called Knowledge (Against Heresies).</p><h3>Participation in the Paschal Controversy</h3><p>Besides the labours enumerated above, Saint Irenaeus was remembered by the faithful also as a supporter of the settlement of the disputes connected with the day of the celebration of Pascha.</p><p>The question of the time of the celebration of Pascha was raised as early as 154. Then it became a subject of discussion between Polycarp of Smyrna and the Roman bishop Anicetus. As a result of this discussion the sides held to their own opinions, yet this did not lead them to a conflict.</p><p>The difference of approaches was conditioned by the fact that the communities of Asia Minor, appealing to the authority of John the Theologian and the apostle Philip, were guided by the tradition of celebrating Pascha on the 14th day of the month of Nisan (according to the lunar calendar), that is, on the day of the annual cycle on which Israel celebrated the Old Testament Pascha (this same day was associated with the day of Christ’s death on the Cross). The Roman Church, however, although it linked Pascha with the 14th of Nisan, celebrated it not on any day of the week but strictly on a Sunday.</p><p>Under Irenaeus, approximately in 190, another dispute flared up over this matter: this time between the Roman bishop Victor and Polycrates of Ephesus. The situation led to tension in relations between the hierarchs and threatened a rupture between the Churches they led. Intervening, Irenaeus persuaded the Roman bishop to be reconciled with Polycrates, and peace was restored.</p><p>In 202 Irenaeus of Lyon suffered a martyr’s death.</p><h2>Literary Legacy</h2><p>Only a few works have come down to us from Saint Irenaeus: The Detection and Overthrow of the So-Called Knowledge (Against Heresies), The Demonstration of the Apostolic Preaching, and On the Tyrannical Kingdom of the Antichrist. Meanwhile, the knowledge imparted in these works is difficult to overestimate.</p><p>First of all, a positive exposition of Christian doctrine is presented here. On the pages of the works listed, Irenaeus touches upon such important sections of dogmatics as the doctrine of God, of Redemption, of the creation of the world, of the Fall, of the Church, of the Sacraments, of Tradition, and others.</p><p>On the other hand, he gives a coherent picture and a clear characterisation of the most dangerous errors of his time. Each exposure is accompanied by irrefutable arguments and can serve as a manual of continuing relevance in the struggle for the purity of the faith even today.</p><h2>Annotation to the Works of Irenaeus of Lyon</h2><p>The present edition presents all the surviving works of Saint Irenaeus of Lyon: “The Detection and Overthrow of the So-Called Knowledge” in five books (called, after the example of Eusebius, the “father of Church history”, and of Blessed Jerome, usually by the abbreviated title “Against Heresies”) and “The Demonstration of the Apostolic Preaching”. St Irenaeus, Bishop of Lyon, was a spiritual pupil of St Polycarp of Smyrna, a disciple of the apostle John the Theologian, and still preserved on his own lips the living apostolic voice and the spirit of apostolic teaching and Tradition. He enjoyed wide renown and the profound respect of the whole Universal Church, and was a peacemaker in the dispute between Rome and the Churches of Asia Minor over ceremonial differences, but he became especially famous for his struggle against the most dangerous heretics of that time — the Gnostics. Zealously refuting all the Gnostic false teachings that existed at that time, St Irenaeus expounds with astonishing clarity and depth the apostolic teaching about God, about salvation, redemption and the resurrection of man, about the Eucharist and the last destinies of the universe. In his person we see the most brilliant defender of the idea of the Church, of its significance and of the necessity of belonging to it. Very valuable is the exegetical side of the works of St Irenaeus, to which in this edition special attention was given: the references to Holy Scripture were refined and supplemented, and an index of biblical quotations according to the works of St Irenaeus was compiled. The former Russian translation of Archpriest P. Preobrazhensky is given in a new redaction and is supplied, where necessary, with textological notes.</p><p>For all who wish to have a firm foundation of the faith that is the Lord’s, apostolic and churchly, and to drink the water of salvation from living springs.</p><h2>Faith</h2><h3>God — the Trinity</h3><blockquote><p><em>The Church, though dispersed through the whole world, even to the ends of the earth, has received from the apostles and their disciples this faith: [She believes] <strong>in one God, the Father Almighty</strong>, Maker of heaven, and earth, and the sea, and all things that are in them; and <strong>in one Christ Jesus, the Son of God</strong>, who became incarnate for our salvation; and <strong>in the Holy Spirit</strong>, who proclaimed through the prophets the dispensations of God, and the advents, and the birth from a virgin, and the passion, and the resurrection from the dead, and the ascension into heaven in the flesh of the beloved Christ Jesus, our Lord, and His [future] manifestation from heaven in the glory of the Father</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-10">Against Heresies, Book I, ch. 10</a>)</p><blockquote><p><em>The rule of truth which we hold, is, that <strong>there is one God Almighty</strong>, who made all things by His Word, and fashioned and formed, out of that which had no existence, all things which exist. Thus saith the Scripture, to that effect "By the <strong>Word</strong> of the Lord were the heavens established, and all the might of them, by the <strong>spirit</strong> of His mouth." …</em></p><p><em>For God needs none of all these things, but is He who, <strong>by His Word and Spirit, makes, and disposes, and governs all things</strong>, and commands all things into existence</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-22">Against Heresies, Book I, ch. 22</a>)</p><blockquote><p><em>For <strong>God</strong> did not stand in need of these [beings], in order to the accomplishing of what He had Himself determined with Himself beforehand should be done, as if He did not possess His own hands. For <strong>with Him were always present the Word and Wisdom, the Son and the Spirit</strong>, by whom and in whom, freely and spontaneously, He made all things, <strong>to whom also He speaks, saying, "Let Us make man after Our image and likeness; "</strong> He taking from Himself the substance of the creatures [formed], and the pattern of things made, and the type of all the adornments in the world.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-20">Against Heresies, Book IV, ch. 20</a>)</p><blockquote><p><em>But the path of those belonging to the Church circumscribes the whole world, as possessing the sure tradition from the apostles, and gives unto us to see that the faith of all is one and the same, since <strong>all receive one and the same God the Father</strong>, and believe in the same dispensation regarding the incarnation of <strong>the Son of God</strong>, and are cognizant of the same gift of <strong>the Spirit</strong>, and are conversant with the same commandments, and preserve the same form of ecclesiastical constitution</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against Heresies, Book V, ch. 20</a>)</p><blockquote><p><em>The presbyters, the disciples of the apostles, affirm that this is the gradation and arrangement of those who are saved, and that they advance through steps of this nature; also that <strong>they ascend through the Spirit to the Son, and through the Son to the Father</strong>, and that in due time the Son will yield up His work to the Father</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-36">Against Heresies, Book V, ch. 36</a>)</p><h3>Christ — God</h3><blockquote><p><em>This is the mystery which he says was made known to him by revelation, that <strong><mark>He who suffered under Pontius Pilate, the same is</mark> Lord of all, and King, and <mark>God</mark>, and Judge</strong>, receiving power from Him who is the God of all, because He became "obedient unto death, even the death of the cross."</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-12">Against Heresies, Book III, ch. 12</a>)</p><h3>God became man, born of a virgin</h3><blockquote><p><em><strong><mark>God, then, was made man</mark></strong>, and the Lord did Himself save us, giving us the token of the <strong><mark>Virgin</mark></strong>. …</em></p><p><em>so did He who is the Word, recapitulating Adam in Himself, rightly receive a birth, enabling Him to gather up Adam [into Himself], <strong><mark>from Mary, who was as yet a virgin</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-21">Against Heresies, Book III, ch. 21</a>)</p><h3>Salvation is possible only in the Church</h3><blockquote><p><em>"For <strong><mark>in the Church</mark></strong>," it is said, "<strong><mark>God hath set</mark></strong> apostles, prophets, teachers," and <strong><mark>all</mark></strong> the other means <strong><mark>through which the Spirit works; of which all those are not partakers who do not join themselves to the Church</mark></strong>, but <strong><mark>defraud themselves of life through their perverse opinions and infamous behaviour</mark>. For where the Church is, there is the Spirit of God; and where the Spirit of God is, there is the Church, and every kind of grace; but the Spirit is truth.</strong> Those, therefore, <strong><mark>who do not partake of Him, are neither nourished into life from the mother's breasts, nor do they enjoy that most limpid fountain which issues from the body of Christ; but they dig for themselves broken cisterns out of earthly trenches, and drink putrid water out of the mire, fleeing from the faith of the Church</mark></strong> lest they be convicted; and <strong><mark>rejecting the Spirit</mark></strong>, that they may not be instructed.</em></p><p><em>2. <strong>Alienated thus from the truth, they do deservedly wallow in all error, tossed to and fro by it, thinking differently in regard to the same things at different times, and never attaining to a well-grounded knowledge</strong>, being more anxious to be sophists of words than disciples of the truth. For they have not been founded upon the one rock, but upon the sand, which has in itself a multitude of stones.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-24">Against Heresies, Book III, ch. 24</a>)</p><blockquote><p><em>Wherefore it is incumbent to obey the presbyters who are in the Church,-those who, as I have shown, possess the succession from the apostles; those who, together with the succession of the episcopate, have received the certain gift of truth, according to the good pleasure of the Father. But [it is also incumbent] to hold in suspicion <strong>others who depart from the primitive succession, and assemble themselves together in any place whatsoever, [looking upon them] either as heretics of perverse minds, or as schismatics puffed up and self-pleasing, or again as hypocrites, acting thus for the sake of lucre and vainglory. <mark>For all these have fallen from the truth</mark></strong>. And <strong><mark>the heretics</mark>, indeed, who bring strange fire to the altar of God-namely, strange doctrines-<mark>shall be burned up by the fire from heaven</mark></strong>, as were Nadab and Abiud. But <strong><mark>such as rise up in opposition to the truth</mark>, and <mark>exhort others against the Church of God, [shall] remain among those in hell (apud inferos)</mark></strong>, being swallowed up by an earthquake, even as those who were with Chore, Dathan, and Abiron. But <strong><mark>those who cleave asunder, and separate the unity of the Church, [shall] receive from God the same punishment</mark></strong> as Jeroboam did. …</em></p><p><em><strong>From all such persons, therefore, it behooves us to keep aloof, <mark>but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech</mark> and blameless conduct</strong> for the confirmation and correction of others.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-26">Against Heresies, Book IV, ch. 26</a>)</p><h3>The life of the soul after death</h3><p>Here too the transmigration of souls is denied (he is arguing against Platonism):</p><blockquote><p>The Lord has taught with very great fulness, that <strong><mark>souls not only continue to exist</mark>, not by passing from body to body, but that they preserve the same form [in their separate state] as the body had to which they were adapted, and that they remember the deeds which they did in this state of existence, and from which they have now ceased</strong>,-in that narrative which is recorded respecting the rich man and that Lazarus who found repose in the bosom of Abraham. In this account He states that Dives knew Lazarus after death, and Abraham in like manner, and that each one of these persons continued in his own proper position, and that [Dives] requested Lazarus to be sent to relieve him-[Lazarus], on whom he did not [formerly] bestow even the crumbs [which fell] from his table. </p><p>[He tells us] also of the answer given by Abraham, who was acquainted not only with what respected himself, but Dives also, and who enjoined those who did not wish to come into that place of torment to believe Moses and the prophets, and to receive the preaching of Him who was to rise again from the dead. By these things, then, it is plainly declared that <strong><mark>souls continue to exist</mark> that they do not pass from body to body, that they possess the form of a man, so that they may be recognised, and retain the memory of things in this world; moreover, that the gift of prophecy was possessed by Abraham, and that <mark>each class of souls] receives a habitation such as it has deserved, even before the judgment</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b2#HH-34">Against Heresies, Book II, ch. 34</a>)</p><h3>The souls of the righteous remain with God after death</h3><blockquote><p><em>Wherefore the Church does in every place, because of that love which she cherishes towards God, <strong><mark>send forward, throughout all time, a multitude of martyrs to the Father</mark></strong></em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-33">Against Heresies, Book IV, ch. 33</a>)</p><p>More: <a href="https://bibleox.com/ru/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D0%B2%D0%B5%D1%80%D0%B0_%D0%B2_%D0%BF%D0%BE%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%83%D1%8E_%D1%83%D1%87%D0%B0%D1%81%D1%82%D1%8C_%D1%81_%D0%91%D0%BE%D0%B3%D0%BE%D0%BC">Irenaeus of Lyon — faith in the life of the soul with God (ru)</a></p><h3>The sanctification of created matter</h3><blockquote><p><em>we who, being leprous in our sins, <strong>are purified through <mark>holy water</mark> and the invocation of the Lord</strong>, cleansed of our former transgressions, reborn spiritually as newborn babes, just as the Lord said: Unless one is born of water and the Spirit, he cannot enter the kingdom of heaven.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/8yk4_Fragments#HH-33">Fragments, 33</a>)</p><p>(Fragments, 33)</p><h3>The reality of the body and blood of Christ in the Eucharist</h3><blockquote><p><em>But vain in every respect are they who despise the entire dispensation of God, and disallow <strong>the salvation of the flesh</strong>, and treat with contempt its regeneration, maintaining that it is not capable of incorruption. But if this indeed do not attain salvation, then neither did the Lord redeem us with His blood, nor is <strong>the cup of the Eucharist</strong> the communion of His blood, nor the bread which we break the communion of His body. For <strong>blood can only come from veins and flesh, and whatsoever else makes up the substance of man, such as the Word of God was actually made. By His own blood he redeemed us</strong>, as also His apostle declares, "In whom we have redemption through His blood, even the remission of sins." And as <strong>we are His members, we are also nourished by means of the creation</strong> (and He Himself grants the creation to us, for He causes His sun to rise, and sends rain when He wills ). He has acknowledged the cup (which is a part of the creation) as His own blood, from which He bedews our blood; and the bread (also a part of the creation) He has established as His own body, from which He gives increase to our bodies.</em></p><p><em>3. When, therefore, <strong><mark>the mingled cup and the manufactured bread receives the Word of God, and the Eucharist of the blood and the body of Christ is made</mark></strong>, from which things the substance of our flesh is increased and supported, how can they affirm that the flesh is incapable of receiving the gift of God, which is life eternal, <strong>which [flesh] is nourished from the body and blood of the Lord</strong>, and is a member of Him?-even as the blessed Paul declares in his Epistle to the Ephesians, that "we are members of His body, of His flesh, and of His bones." <strong><mark>He does not speak these words of some spiritual and invisible man</mark>, for a spirit has not bones nor flesh; but [he refers to] that dispensation [by which the Lord became] an actual man, consisting of flesh, and nerves, and bones,-that [flesh] which is nourished by the cup which is His blood, and receives increase from the bread which is His body</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-2">Against Heresies, Book V, ch. 2</a>)</p><blockquote><p><em>And the Church alone offers this pure oblation to the Creator, <strong>offering to Him, with giving of thanks</strong>, [the things taken] from His creation. But the Jews do not offer thus: for their hands are full of blood; for they have not received the Word, through whom it is offered to God. Nor, again, do any of the conventicles (synagogae) of the heretics [offer this]. For some, by maintaining that the Father is different from the Creator, do, when they offer to Him what belongs to this creation of ours, set Him forth as being covetous of another's property, and desirous of what is not His own. Those, again, who maintain that the things around us originated from apostasy, ignorance, and passion, do, while offering unto Him the fruits of ignorance, passion, and apostasy, sin against their Father, rather subjecting Him to insult than giving Him thanks. But how can they be consistent with themselves, [when they say] that <strong><mark>the bread over which thanks have been given is the body of their Lord, and the cup His blood</mark></strong>, if they do not call Himself the Son of the Creator of the world, that is, His Word, through whom the wood fructifies, and the fountains gush forth, and the earth gives "first the blade, then the ear, then the full corn in the ear."</em></p><p><em>5. Then, again, how can they say that <strong><mark>the flesh, which is nourished with the body of the Lord and with His blood</mark></strong>, goes to corruption, and does not partake of life? Let them, therefore, either alter their opinion, or cease from offering the things just mentioned. But our opinion is in accordance with the Eucharist, and the Eucharist in turn establishes our opinion. For we offer to Him His own, announcing consistently the fellowship and union of the flesh and Spirit. For as <strong>the bread, which is produced from the earth, when it receives the invocation of God, is no longer common bread, but the Eucharist, consisting of two realities, earthly and heavenly; so also our bodies, when they receive the Eucharist, are no longer corruptible, having the hope of the resurrection</strong> to eternity.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-18">Against Heresies, Book IV, ch. 18</a>)</p><h3>In the Eucharist bread and wine are offered to God as a sacrifice</h3><blockquote><p><em><strong>The oblation of the Church, therefore, which the Lord gave instructions to be offered throughout all the world, is accounted with God a pure sacrifice, and is acceptable to Him; not that He stands in need of a sacrifice from us, but that he who offers is himself glorified in what he does offer, if his gift be accepted. For by the gift both honour and affection are shown forth towards the King</strong>; and <strong>the Lord, wishing us to <mark>offer it</mark> in all simplicity and innocence</strong>, did express Himself thus: "Therefore, when thou offerest thy gift upon the altar, and shalt remember that thy brother hath ought against thee, leave thy gift before the altar, and go thy way; first be reconciled to thy brother, and then return and offer thy gift." We are bound, therefore, <strong><mark>to offer to God the first-fruits of His creation</mark></strong>, as Moses also says, "Thou shalt not appear in the presence of the Lord thy God empty; " so that man, being accounted as grateful, by those things in which he has shown his gratitude, may receive that honour which flows from Him.</em></p><p><em>2. <strong>And <mark>the class of oblations in general has not been set aside; for there were both oblations there [among the Jews], and there are oblations here [among the Christians]. Sacrifices there were among the people; sacrifices there are, too, in the Church: but the species alone has been changed</mark></strong> …</em></p><p><em>For at the beginning <strong>God had respect to the gifts of Abel, because he offered with single-mindedness and righteousness</strong>; but He had no respect unto the offering of Cain, because his heart was divided with envy and malice …</em></p><p><em>For if any one shall endeavour to offer a sacrifice merely to outward appearance, unexceptionably, in due order, and according to appointment, while in his soul he does not assign to his neighbour that fellowship with him which is right and proper, nor is under the fear of God;-he who thus cherishes secret sin does not deceive God by that sacrifice which is offered correctly as to outward appearance; nor will such an oblation profit him anything …</em></p><p><em>Inasmuch, then, as <strong>the Church offers with single-mindedness, her gift is justly reckoned a pure sacrifice with God</strong>. …</em></p><p><em>For <strong>it <mark>behoves us to make an oblation to God</mark>, and in all things to be found grateful to God our Maker, in a pure mind, and in faith without hypocrisy, in well-grounded hope, in fervent love, <mark>offering the first-fruits of His own created things</mark></strong>. And the Church alone offers this pure oblation to the Creator, offering to Him, with giving of thanks, [the things taken] from His creation. But the Jews do not offer thus: for their hands are full of blood; for they have not received the Word, through whom it is offered to God. Nor, again, <strong>do any of the conventicles (synagogae) of the heretics [offer this]</strong>. …</em></p><p><em>But how can they be consistent with themselves, [when they say] that the bread over which thanks have been given is the body of their Lord, and the cup His blood, if they do not call Himself the Son of the Creator of the world …</em></p><p><em>Then, again, how can they say that the flesh, which is nourished with the body of the Lord and with His blood, goes to corruption, and does not partake of life? <strong>Let them, therefore, either alter their opinion, or cease from offering the things just mentioned. But our opinion is in accordance with the Eucharist, and the Eucharist in turn establishes our opinion.</strong> <strong>For <mark>we offer to Him His own</mark></strong>, announcing consistently the fellowship and union of the flesh and Spirit. For as the bread, which is produced from the earth, when it receives the invocation of God, is no longer common bread, but the <strong>Eucharist</strong>, consisting of two realities, earthly and heavenly; so also our bodies, when they receive the <strong>Eucharist</strong>, are no longer corruptible, having the hope of the resurrection to eternity.</em></p><p><em>6. Now <strong><mark>we make offering to Him, not as though He stood in need of it, but rendering thanks</mark> for His gift, and thus sanctifying what has been created</strong>. …</em></p><p><em>As, therefore, <strong><mark>He does not stand in need of these [services], yet does desire that we should render them for our own benefit</mark></strong>, lest we be unfruitful; so did <strong>the Word give to the people that very precept as to the making of oblations, although He stood in no need of them, that they might learn to serve God: thus is it, therefore, also <mark>His will that we, too, should offer a gift at the altar, frequently and without intermission</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-18">Against Heresies, Book IV, ch. 18</a>)</p><h3>The denial that only faith and love are needed for salvation, while everything else (works, sacraments) is supposedly indifferent</h3><blockquote><p><strong><mark>And in their writings we read as follows</mark></strong>, the interpretation which they give [of their views], declaring that Jesus spoke in a mystery to His disciples and apostles privately, and that they requested and obtained permission to hand down the things thus taught them, to others who should be worthy and believing. <strong><mark>We are saved, indeed, by means of faith and love; but all other things, while in their nature indifferent</mark></strong>, are reckoned by the opinion of men-some good and some evil, there being nothing really evil by nature.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-25">Against Heresies, Book I, ch. 25</a>)</p><h3>The necessity of Baptism for salvation</h3><blockquote><p>And as dry earth does not bring forth unless it receive moisture, in like manner we also, being originally a dry tree, could never have brought forth fruit unto life without the voluntary rain from above. For <strong><mark>our bodies have received unity among themselves by means of that laver which leads to incorruption; but our souls, by means of the Spirit. Wherefore both are necessary</mark></strong>, since both contribute towards the life of God</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-17">Against Heresies, Book III, ch. 17</a>)</p><blockquote><p>For this reason, also, Philip, when he had discovered the eunuch of the Ethiopians' queen reading these words which had been written: "He was led as a sheep to the slaughter; and as a lamb is dumb before the shearer, so He opened not His mouth: in His humiliation His judgment was taken away; " and all the rest which the prophet proceeded to relate in regard to His passion and His coming in the flesh, and how He was dishonoured by those who did not believe Him; easily persuaded him to believe on Him, that He was Christ Jesus, who was crucified under Pontius Pilate, and suffered whatsoever the prophet had predicted, and that He was the Son of God, who gives eternal life to men. And immediately when [Philip] had baptized him, he departed from him. </p><p><strong>For nothing else [but baptism] was wanting to him who had been already instructed by the prophets</strong>: he was not ignorant of God the Father, nor of the rules as to the [proper] manner of life, but was merely ignorant of the advent of the Son of God, which, when he had become acquainted with, in a short space of time, he went on his way rejoicing, to be the herald in Ethiopia of Christ's advent. Therefore Philip had no great labour to go through with regard to this man, because he was already prepared in the fear of God by the prophets. For this reason, too, did the apostles, collecting the sheep which had perished of the house of Israel, and discoursing to them from the Scriptures, prove that this crucified Jesus was the Christ, the Son of the living God; </p><p>and they persuaded a great multitude, who, however, [already] possessed the fear of God. And there were, in one day, baptized three, and four, and five thousand men.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-23">Against Heresies, Book IV, ch. 23</a>)</p><h3>The baptism of infants</h3><blockquote><p><em>Being thirty years old when He came to be baptized, and then possessing the full age of a Master, He came to Jerusalem, so that He might be properly acknowledged by all as a Master. For He did not seem one thing while He was another, as those affirm who describe Him as being man only in appearance; but what He was, that He also appeared to be. Being a Master, therefore, He also possessed the age of a Master, not despising or evading any condition of humanity, nor setting aside in Himself that law which He had appointed for the human race, but sanctifying every age, by that period corresponding to it which belonged to Himself. For <strong>He came to save all</strong> through means of Himself-all, I say, <strong>who</strong> through Him <strong>are <mark>born again to God</mark></strong> -<strong>infants</strong>, and children, and boys, and youths, and old men. </em></p><p><em>He therefore passed through every age, becoming an infant for infants, thus sanctifying infants; a child for children, thus sanctifying those who are of this age, being at the same time made to them an example of piety, righteousness, and submission; a youth for youths, becoming an example to youths, and thus sanctifying them for the Lord. So likewise He was an old man for old men, that He might be a perfect Master for all, not merely as respects the setting forth of the truth, but also as regards age, sanctifying at the same time the aged also, and becoming an example to them likewise. Then, at last, He came on to death itself, that He might be "the first-born from the dead, that in all things He might have the pre-eminence," the Prince of life, existing before all, and going before all.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b2#HH-22">Against Heresies, Book II, ch. 22</a>)</p><p>"<strong>Regeneration into God</strong>" is the name for baptism (a fixed expression among the early Christians). St Irenaeus says literally:</p><blockquote><p><em>And when we come to refute them, we shall show in its fitting-place, that this class of men have been instigated by Satan to a denial of that <strong><mark>baptism which is regeneration to God</mark></strong>, and thus to a renunciation of the whole [Christian] faith.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-21">Against Heresies, Book I, ch. 21</a>)</p><blockquote><p><em>And again, <strong>giving to the disciples the power of <mark>regeneration into God</mark></strong>, He said to them," Go and teach all nations, <strong><mark>baptizing</mark> them in the name of the Father, and of the Son, and of the Holy Ghost</strong>." For [God] promised, that in the last times He would pour Him [the Spirit] upon [His] servants and handmaids, that they might prophesy; wherefore He did also descend upon the Son of God, made the Son of man</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-17">Against Heresies, Book III, ch. 17</a>)</p><p>The same word is also used by his contemporary, St Justin Martyr:</p><blockquote><p><em>For Christ, being the first-born of every creature, became again the chief of another race <strong><mark>regenerated</mark> by Himself <mark>through water</mark>, and faith</strong></em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-138">Justin, Dialogue with Trypho, 138</a>)</p><blockquote><p><em>Then <strong>they are brought by us where there is water, and <mark>are regenerated</mark> in the same manner in which we were ourselves regenerated. For, in the name of God, the Father and Lord of the universe, and of our Saviour Jesus Christ, and of the Holy Spirit, <mark>they then receive the washing</mark> with <mark>water</mark></strong>. For Christ also said, "Except ye be born again, ye shall not enter into the kingdom of heaven.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-61">Justin, First Apology, 61</a>)</p><h3>Other tongues — foreign languages</h3><p>Christians miraculously spoke in foreign languages:</p><blockquote><p><em>For this reason does the apostle declare, "We speak wisdom among them that are perfect," terming those persons "perfect" who have received the Spirit of God, and who through the Spirit of God <strong><mark>do speak in <u>all</u> languages</mark></strong>, as he used Himself also to speak. In like manner <strong>we do also hear many brethren in the Church, who possess prophetic gifts, and who through the Spirit speak <mark>all <u>kinds</u> of</mark> languages, and bring to light <mark>for the general benefit</mark> the hidden things of men, and <mark>declare the mysteries</mark> of God</strong>, whom also the apostle terms "spiritual," they being spiritual because they partake of the Spirit, and not because their flesh has been stripped off and taken away, and because they have become purely spiritual.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-6">Against Heresies, Book V, ch. 6</a>)</p><p>He is speaking of a heretic who, by deception and with the help of demonic powers, did not impart a gift but taught people (as today's Pentecostals and Charismatics do) to open their mouths and utter any nonsense that came into their heads, persuading them that it was they who were prophesying:</p><blockquote><p><em>It appears probable enough that this man <strong>possesses a demon as his familiar spirit, by means of whom he seems able to prophesy, and also enables as many as he counts worthy to be partakers of his Charis themselves to prophesy</strong>. He devotes himself especially to women, and those such as are well-bred, and elegantly attired, and of great wealth, whom he frequently seeks to draw after him, by addressing them in such seductive words as these: "I am eager to make thee a partaker of my Charis, since the Father of all doth continually behold thy angel before His face. Now the place of thy angel is among us: it behoves us to become one. Receive first from me and by me [the gift of] Charis. Adorn thyself as a bride who is expecting her bridegroom, that thou mayest be what I am, and I what thou art. </em></p><p><em>Establish the germ of light in thy nuptial chamber. Receive from me a spouse, and become receptive of him, while thou art received by him. <strong>Behold Charis has descended upon thee; open thy mouth and prophesy." On the woman replying," I have never at any time prophesied, nor do I know how to prophesy; "then engaging, for the second time, in certain invocations, so as to astound his deluded victim, he says to her," Open thy mouth, speak whatsoever occurs to thee, and thou shalt prophesy."</strong> She then, vainly puffed up and elated by these words, and greatly excited in soul by the expectation that it is herself who is to prophesy, her heart beating violently [from emotion], <strong>reaches the requisite pitch of audacity, and idly as well as impudently utters some nonsense as it happens. </strong></em></p><p><em><strong>to occur to her, such as might be expected from one heated by an empty spirit</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-13">Against Heresies, Book I, ch. 13</a>)</p><h3>Freedom from the bonds of the Law of Moses</h3><blockquote><p>2. For the law, since it was laid down for those in bondage, used to instruct the soul by means of those corporeal objects which were of an external nature, drawing it, as by a bond, to obey its commandments, that man might learn to serve God. But the Word set free the soul, and taught that through it the body should be willingly purified. Which having been accomplished, it followed as of course, <strong><mark>that the bonds of slavery should be removed</mark></strong>, to which man had now become accustomed, and <strong><mark>that he should follow God without fetters</mark></strong>: moreover, that the laws of liberty should be extended, and subjection to the king increased, so that no one who is convened should appear unworthy to Him who set him free, but that the piety and obedience due to the Master of the household should be equally rendered both by servants and children; while the children possess greater confidence [than the servants], inasmuch as <strong>the working of liberty is greater and more glorious than that obedience which is rendered in [a state of] slavery</strong>. …</p><p>But this is our Lord, the Word of God, <strong><mark>who in the first instance certainly drew slaves to God, but afterwards He set those free who were subject to Him</mark></strong>, as He does Himself declare to His disciples: "I will not now call you servants, for the servant knoweth not what his lord doeth; but I have called you friends, for all things which I have heard from My Father I have made known." For in that which He says, "I will not now call you servants," He indicates in the most marked manner that <strong><mark>it was Himself who did originally appoint for men that bondage with respect to God through the law, and then afterwards conferred upon them freedom</mark></strong>. And in that He says, "For the servant knoweth not what his lord doeth," He points out, by means of His own advent, the ignorance of a people in a servile condition. But when He terms His disciples "the friends of God," He plainly declares Himself to be the Word of God, whom Abraham also followed voluntarily and under no compulsion (sine vinculis), because of the noble nature of his faith, and so became "the friend of God."</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-13">Against Heresies, Book IV, ch. 13</a>)</p><blockquote><p><em>And that <strong><mark>not by the much-speaking of the law, but by the brevity of faith and love</mark></strong>, men were to be saved, Isaiah says thus: A word brief and short in righteousness: for a short word will God make in the whole world. And therefore the apostle Paul says: Love is the fulfilling of the law: <strong><mark>for he who loves God has fulfilled the law</mark></strong>. Moreover the Lord, when He was asked which is the first commandment, said: Thou shalt love the Lord thy God with all thy heart and with all thy strength. And the second is like unto it: Thou shalt love thy neighbour as thyself. On these two commandments, He says, all the law hangeth and the prophets. So then by our faith in Him He has made our love to God and our neighbour to grow, making us godly and righteous and good. And therefore a short word has God made on the earth in the world. …</em></p><p><em><strong><mark>That He would not send back the redeemed to the legislation of Moses----for the law was fulfilled in Christ----but would have them live in newness by the Word, through faith in the Son of God and love</mark></strong>, Isaiah declared, saying: <strong>Remember not the former things, nor bring to mind the things that were in the beginning. Behold I make new (things)</strong>, which shall now spring up, and ye shall know (them). And I will make in the wilderness a way, and in the waterless place streams, to give drink to my chosen race, and to my people whom I have purchased to declare my virtues. Now a wilderness and a waterless place was at first the calling of the Gentiles: for the Word had not passed through them, nor given them the Holy Spirit to drink; who fashioned the new way of godliness and righteousness, and made copious streams to spring forth, disseminating over the earth the Holy Spirit; even as it had been promised through the prophets, that in the end of the days He should pour out the Spirit upon the face of the earth.</em></p><p><em>90. <strong><mark>Therefore by newness of the spirit is our calling, and not in the oldness of the letter</mark></strong>; even as Jeremiah prophesied …</em></p><p><em>Now the first Synagogue had as husband the Law. …</em></p><p><em>Since, then, by this calling life has been given (us), and God has summed up again for Himself in us the faith of Abraham, <strong><mark>we ought not to turn back any more----I mean, to the first legislation.</mark> For we have received the Lord of the Law, the Son of God; and by faith in Him we learn to love God with all our heart, and our neighbour as ourselves.</strong> Now the love of God is far from all sin, and love to the neighbour worketh no ill to the neighbour.</em></p><p><em>96. Wherefore also <strong><mark>we need not the Law as a tutor</mark></strong>. Behold, with the Father we speak, and in His presence we stand, being children in malice, and grown strong in all righteousness and soberness. <strong>For no longer shall the Law say, Do not commit adultery, to him who has no desire at all for another's wife; and Thou shalt not kill, to him who has put away from himself all anger and enmity; (and) Thou shalt not covet thy neighbour's field or ox or ass, to those who have no care at all for earthly things, but store up the heavenly fruits: nor An eye for an eye, and a tooth for a tooth, to him who counts no man his enemy, but all men his neighbours, and therefore cannot stretch out his hand at all for vengeance. It will not require tithes of him who consecrates all his possessions to God, leaving father and mother and all his kindred, and following the Word of God. <mark>And there will be no command to remain idle for one day of rest, to him who perpetually keeps sabbath, that is to say, who in the temple of God, which is man's body, does service to God, and in every hour works righteousness</mark>. For I desire mercy, He saith, and not sacrifice; and the knowledge of God more than burnt offerings.</strong></em></p></blockquote><p>(The Demonstration of the Apostolic Preaching, 87)</p><h3>Sabbath (righteousness) every day</h3><blockquote><p>Moreover, we learn from the Scripture itself, that God gave circumcision, <strong>not as the completer of righteousness</strong>, but as a sign, that the race of Abraham might continue recognisable. For it declares: "God said unto Abraham, Every male among you shall be circumcised; and ye shall circumcise the flesh of your foreskins, as a token of the covenant between Me and you." <strong>This same does Ezekiel the prophet say with regard to the Sabbaths</strong>: "Also I gave them <strong>My Sabbaths</strong>, to be a sign between Me and them, that they might know that I am the Lord, that sanctify them." And in Exodus, God says to Moses: "And ye shall observe <strong>My Sabbaths</strong>; for it shall be a sign between Me and you for your generations." <strong>These things, then, were given for a sign; </strong></p><p><strong>but the signs were not unsymbolical, that is, neither unmeaning nor to no purpose, inasmuch as they were given by a wise Artist</strong>; but the circumcision after the flesh typified that after the Spirit. For "we," says the apostle, "have been circumcised with the circumcision made without hands." And the prophet declares, "Circumcise the hardness of your heart." <strong>But the Sabbaths taught that we should <mark>continue <mark>day by day</mark> in God's service</mark></strong>. "For we have been counted," says the Apostle Paul, "<strong>all the day long as sheep for the slaughter</strong>; " that is, <strong><mark>consecrated [to God], and ministering continually to our faith, and persevering in it, and abstaining from all avarice, and not acquiring or possessing treasures upon earth</mark></strong>. </p><p><strong>Moreover, the Sabbath of God (requietio Dei), that is, the kingdom, was, as it were, indicated by created things; in which [kingdom], the man who shall have persevered in serving God (Deo assistere) shall, in a state of rest, partake of God's table</strong>.</p><p>2. And that man was not justified by these things, but that they were given as a sign to the people, this fact shows,-that <strong>Abraham himself, <mark>without circumcision and without observance of Sabbaths</mark>, "believed God, and it was imputed unto him for righteousness</strong>; and he was called the friend of God." Then, again, <strong>Lot</strong>, without circumcision, was brought out from Sodom, receiving salvation from God. So also did <strong>Noah</strong>, pleasing God, although he was uncircumcised, receive the dimensions [of the ark], of the world of the second race [of men].</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-16">Against Heresies, Book IV, ch. 16</a>)</p><h3>The typological significance of the Sabbath</h3><blockquote><p><em>"Offer unto God the sacrifice of praise, and pay thy vows to the Most High; and call upon Me in the day of thy trouble, and I will deliver thee, and thou shalt glorify Me; " <strong>rejecting, indeed, those things by which sinners imagined they could propitiate God</strong>, and showing that He does Himself stand in need of nothing; but He exhorts and advises them to those. things by which man is justified and draws nigh to God. This same declaration does Esaias make: "To what purpose is the multitude of your sacrifices unto Me? saith the Lord. I am full." <strong>And when He had <mark>repudiated</mark> holocausts, and sacrifices, and oblations, as likewise the new moons, and <mark>the sabbaths</mark>, and the festivals, and all the rest of the services accompanying these, <mark>He continues, exhorting them to what pertained to salvation</mark>: "Wash you, make you clean, <mark>take away wickedness from your hearts</mark> from before mine eyes</strong>: <strong>cease from your evil ways, learn to do well, seek judgment, relieve the oppressed, judge the fatherless, plead for the widow; and come, let us reason together, saith the Lord.</strong>"</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-17">Against Heresies, Book IV, ch. 17</a>)</p><blockquote><p><em>1. Moreover, we learn from the Scripture itself, that God gave circumcision, not as the completer of righteousness, but as a sign, that the race of Abraham might continue recognisable. For it declares: "God said unto Abraham, Every male among you shall be circumcised; and ye shall circumcise the flesh of your foreskins, as a token of the covenant between Me and you." This same does Ezekiel the prophet say with regard to the Sabbaths: "Also I gave them My Sabbaths, to be a sign between Me and them, that they might know that I am the Lord, that sanctify them." And in Exodus, God says to Moses: "And ye shall observe My Sabbaths; for it shall be a sign between Me and you for your generations." <strong><mark>These things, then, were given for a sign; </mark></strong></em></p><p><em><strong><mark>but the signs were not unsymbolical, that is, neither unmeaning nor to no purpose, inasmuch as they were given by a wise Artist</mark></strong>; but <strong>the circumcision after the flesh typified that after the Spirit</strong>. For "we," says the apostle, "have been circumcised with the circumcision made without hands." And the prophet declares, "Circumcise the hardness of your heart." <strong>But the Sabbaths taught that we should <mark>continue day by day in God's service</mark>. "For we have been counted," says the Apostle Paul, "all the day long as sheep for the slaughter; " that is, consecrated [to God], and <mark>ministering continually to our faith, and persevering in it, and abstaining from all avarice, and not acquiring or possessing treasures upon earth</mark>.</strong> </em></p><p><strong><em><mark>Moreover, the Sabbath of God (requietio Dei), that is, the kingdom, was, as it were, indicated by created things; in which [kingdom], the man who shall have persevered in serving God (Deo assistere) shall, in a state of rest, partake of God's table.</mark></em></strong></p><p><em>2. And that <strong><mark>man was not justified by these things, but that they were given as a sign to the people</mark></strong>, this fact shows,-that <strong>Abraham himself, without circumcision and without observance of Sabbaths, "believed God, and it was imputed unto him for righteousness</strong>; and he was called the friend of God."</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-16">Against Heresies, Book IV, ch. 16</a>)</p><blockquote><p><em>96. Wherefore also <strong>we need not the Law as a tutor</strong>. Behold, with the Father we speak, and in His presence we stand, being children in malice, and grown strong in all righteousness and soberness. For no longer shall the Law say, Do not commit adultery, to him who has no desire at all for another's wife; and Thou shalt not kill, to him who has put away from himself all anger and enmity; (and) Thou shalt not covet thy neighbour s field or ox or ass, to those who have no care at all for earthly things, but store up the heavenly fruits: nor An eye for an eye, and a tooth for a tooth, to him who counts no man his enemy, but all men his neighbours, and therefore cannot stretch out his hand at all for vengeance. It will not require tithes of him who consecrates all his possessions to God, leaving father and mother and all his kindred, and following the Word of God. <strong><mark>And there will be no command to remain idle for one day of rest, to him who perpetually keeps sabbath, that is to say, who in the temple of God, which is man's body, does service to God, and in every hour works righteousness</mark></strong>. For I desire mercy, He saith, and not sacrifice; and the knowledge of God more than burnt offerings.</em></p></blockquote><p>(The Demonstration of the Apostolic Preaching, 96)</p><h3>Eternal punishment</h3><blockquote><p><em>For as, in the New Testament, that faith of men [to be placed] in God has been increased, receiving in addition [to what was already revealed] the Son of God, that man too might be a partaker of God; so is also our walk in life required to be more circumspect, when we are directed not merely to abstain from evil actions, but even from evil thoughts, and from idle words, and empty talk, and scurrilous-language: <strong><mark>thus also the punishment</mark></strong> of those who do not believe the Word of God, and despise His advent, and are turned away backwards, is increased; <strong><mark>being not merely temporal, but rendered also eternal</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-28">Against Heresies, Book IV, ch. 28</a>)</p><p>By way of contrast:</p><blockquote><p>For the same heretics already mentioned by us have fallen away from themselves, by accusing the Lord, in whom they say that they believe. For those points to which they call attention with regard to the God who <strong><mark>then awarded <u>temporal punishments</u> to the unbelieving</mark></strong>, and smote the Egyptians, while He saved those that were obedient; these same [facts, I say, ] shall nevertheless repeat themselves in the Lord, who <strong><mark>judges <u>for eternity</u> those whom He doth judge</mark>, and lets go free for eternity those whom He does let go free</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-28">Against Heresies, Book IV, ch. 28</a>)</p><h3>The necessity of apostolic succession</h3><blockquote><p><em><strong>Wherefore <mark>it is incumbent to obey the presbyters who are in the Church,-those who, as I have shown, possess the succession from the apostles; those who, together with the succession of the episcopate, have received the certain gift of truth, according to the good pleasure of the Father. But [it is also incumbent] to hold in suspicion others who depart from the primitive succession, and assemble themselves together in any place whatsoever, [looking upon them] either as heretics of perverse minds, or as schismatics</mark> puffed up and self-pleasing, or again as hypocrites, acting thus for the sake of lucre and vainglory.</strong> <strong>For <mark>all these have fallen from the truth. And the heretics</mark></strong>, indeed, who bring strange fire to the altar of God-namely, strange doctrines-shall be burned up by the fire from heaven, as were Nadab and Abiud. But such as rise up in opposition to the truth, and exhort others against the Church of God, [shall] remain among those in hell (apud inferos), being swallowed up by an earthquake, even as those who were with Chore, Dathan, and Abiron. But <strong><mark>those who cleave asunder, and separate the unity of the Church, [shall] receive from God the same punishment</mark></strong> as Jeroboam did.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-26">Against Heresies, Book IV, ch. 26</a>)</p><h3>The truth must be sought in the Church</h3><blockquote><p><em>Since therefore we have such proofs, <strong><mark>it is not necessary to seek the truth among others which it is easy to obtain from the Church</mark>; since the apostles, like a rich man [depositing his money] in a bank, lodged in her hands most copiously all things pertaining to the truth: so that every man, whosoever will, can draw from her the water of life.</strong> For she is the entrance to life; all others are thieves and robbers. On this account are we bound to avoid them, but to make choice of the thing pertaining to the Church with the utmost diligence, and <strong>to lay hold of the tradition of the truth</strong>. For how stands the case? Suppose there arise a dispute relative to some important question among us, should we not have recourse to the most ancient Churches with which the apostles held constant intercourse, and learn from them what is certain and clear in regard to the present question? For how should it be if the apostles themselves had not left us writings? Would it not be necessary, [in that case,] to follow the course of the tradition which they handed down to those to whom they did commit the Churches? …</em></p><p><em>For, prior to Valentinus, those who follow Valentinus had no existence; nor did those from Marcion exist before Marcion; nor, in short, had any of those malignant-minded people, whom I have above enumerated, any being previous to the initiators and inventors of their perversity.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against Heresies, Book III, ch. 4</a>)</p><h3>The authority of Tradition</h3><blockquote><p><em>2. But, again, <strong><mark>when we refer them to that tradition which originates from the apostles, [and] which is preserved by means of the succession of presbyters in the Churches</mark></strong>, they object to tradition, saying that they themselves are wiser not merely than the presbyters, but even than the apostles, because they have discovered the unadulterated truth. For [they maintain] that the apostles intermingled the things of the law with the words of the Saviour; and that not the apostles alone, but even the Lord Himself, spoke as at one time from the Demiurge, at another from the intermediate place, and yet again from the Pleroma, but that they themselves, indubitably, unsulliedly, and purely, have knowledge of the hidden mystery: this is, indeed, to blaspheme their Creator after a most impudent manner! It comes to this, therefore, that these men do now <strong>consent neither to Scripture nor to tradition</strong>.</em></p><p><em>3. Such are the adversaries with whom we have to deal, my very dear friend, endeavouring like slippery serpents to escape at all points. Where-fore they must be opposed at all points, if per-chance, by cutting off their retreat, we may succeed in turning them back to the truth. For, though it is not an easy thing for a soul under the influence of error to repent, yet, on the other hand, it is not altogether impossible to escape from error when the truth is brought alongside it.</em></p><p><em>1. <strong>It is within the power of all, therefore, in every Church, <mark>who may wish to see the truth, to contemplate clearly the tradition of the apostles</mark> manifested throughout the whole world; and we are in a position to reckon up those who were by the apostles instituted bishops in the Churches, and [to demonstrate] the succession of these men to our own times; those who neither taught nor knew of anything like what these [heretics] rave about.</strong> For if the apostles had known hidden mysteries, which they were in the habit of imparting to "the perfect" apart and privily from the rest, they would have delivered them especially to those to whom they were also committing the Churches themselves. For they were desirous that these men should be very perfect and blameless in all things, <strong><mark>whom also they were leaving behind as their successors, delivering up their own place of government to these men</mark>; which men, if they discharged their functions honestly, would be a great boon [to the Church], but if they should fall away, the direst calamity.</strong></em></p><p><em>2. Since, however, it would be very tedious, in such a volume as this, to reckon up the successions of all the Churches, we do put to confusion all those who, in whatever manner, whether by an evil self-pleasing, by vainglory, or by blindness and perverse opinion, assemble in unauthorized meetings; [we do this, I say, ] <strong>by indicating <mark>that tradition</mark> derived from the apostles, of the very great, the very ancient, and universally known Church founded and organized at Rome</strong> by the two most glorious apostles, Peter and Paul; as also [by pointing out] the faith preached to men, which comes down to our time by means of the successions of the bishops. For it is a matter of necessity that every Church should agree with this Church, on account of its pre- eminent authority, that is, the faithful everywhere, <strong><mark>inasmuch as the apostolical tradition has been preserved continuously by those [faithful men] who exist everywhere.</mark></strong></em></p><p><em>3. The blessed apostles, then, having founded and built up the Church, <strong>committed into the hands of Linus the office of the episcopate</strong>. Of this Linus, Paul makes mention in the Epistles to Timothy. <strong>To him succeeded Anacletus</strong>; and after him, in the third place from the apostles, <strong>Clement</strong> was allotted the bishopric. This man, as he had seen the blessed apostles, and had been conversant with them, might be said to have the preaching of the apostles still echoing [in his ears], and their traditions before his eyes. Nor was he alone [in this], for there were many still remaining who had received instructions from the apostles. In the time of this Clement, no small dissension having occurred among the brethren at Corinth, the Church in Rome despatched a most powerful letter to the Corinthians, exhorting them to peace, renewing their faith, and <strong><mark>declaring the tradition which it had lately received from the apostles</mark></strong>, proclaiming the one God, omnipotent, the Maker of heaven and earth, the Creator of man, who brought on the deluge, and called Abraham, who led the people from the land of Egypt, spake with Moses, set forth the law, sent the prophets, and who has prepared fire for the devil and his angels. </em></p><p><em>From this document, whosoever chooses to do so, may learn that He, the Father of our Lord Jesus Christ, was preached by the Churches, and may also <strong><mark>understand the apostolical tradition of the Church</mark></strong>, since this Epistle is of older date than these men who are now propagating falsehood, and who conjure into existence another god beyond the Creator and the Maker of all existing things. <strong>To this Clement there succeeded Evaristus. Alexander followed Evaristus; then, sixth from the apostles, Sixtus was appointed; after him, Telephorus, who was gloriously martyred; then Hyginus; after him, Pius; then after him, Anicetus. Sorer having succeeded Anicetus, Eleutherius does now, in the twelfth place from the apostles, hold the inheritance of the episcopate.</strong> </em></p><p><strong><mark><em>In this order, and by this succession, the ecclesiastical tradition from the apostles, and the preaching of the truth, have come down to us. And this is most abundant proof that there is one and the same vivifying faith, which has been preserved in the Church from the apostles until now, and handed down in truth.</em></mark></strong></p><p><em>4. <strong>But Polycarp also was not only instructed by apostles, and conversed with many who had seen Christ, but was also, by apostles in Asia, appointed bishop of the Church in Smyrna, whom I also saw in my early youth, for he tarried [on earth] a very long time, and, when a very old man, gloriously and most nobly suffering martyrdom, departed this life, having always taught the things which he had learned from the apostles, and which the Church has handed down, and which alone are true. To these things all the Asiatic Churches testify, as do also those men who have succeeded Polycarp down to the present time,-a man who was of much greater weight, and a more stedfast witness of truth</strong>, than Valentinus, and Marcion, and the rest of the heretics. </em></p><p><em>He it was who, coming to Rome in the time of Anicetus caused many to turn away from the aforesaid heretics to the Church of God, proclaiming that he had received this one and sole truth from the apostles,-that, namely, which is handed down by the Church. There are also those who heard from him that John, the disciple of the Lord, going to bathe at Ephesus, and perceiving Cerinthus within, rushed out of the bath-house without bathing, exclaiming, "Let us fly, lest even the bath-house fall down, because Cerinthus, the enemy of the truth, is within." And Polycarp himself replied to Marcion, who met him on one occasion, and said, "Dost thou know me? ""I do know thee, the first-born of Satan." Such was the horror which the apostles and their disciples had against holding even verbal communication with any corrupters of the truth; </em></p><p><em>as Paul also says, "A man that is an heretic, after the first and second admonition, reject; knowing that he that is such is subverted, and sinneth, being condemned of himself." There is also a very powerful Epistle of Polycarp written to the Philippians, from which those who choose to do so, and are anxious about their salvation, can learn the character of his faith, and the preaching of the truth. Then, again, the Church in Ephesus, founded by Paul, and having John remaining among them permanently until the times of Trajan, is a true witness of the tradition of the apostles.</em></p><p><em>1. Since therefore we have such proofs, <strong>it is not necessary to seek the truth among others which it is easy to obtain from the Church; since the apostles, like a rich man [depositing his money] in a bank, lodged in her hands most copiously all things pertaining to the truth: so that every man, whosoever will, can draw from her the water of life.</strong> For she is the entrance to life; all others are thieves and robbers. On this account are we bound to avoid them, but to make choice of the thing pertaining to the Church with the utmost diligence, and <strong><mark>to lay hold of the tradition of the truth</mark></strong>. For how stands the case? Suppose there arise a dispute relative to some important question among us, <strong>should we not have recourse to the most ancient Churches with which the apostles held constant intercourse, and learn from them what is certain and clear</strong> in regard to the present question? For how should it be if the apostles themselves had not left us writings? Would it not be necessary, [in that case,] <strong><mark>to follow the course of the tradition which they handed down to those to whom they did commit the Churches</mark></strong>?</em></p><p><em>2. To which course many nations of those barbarians who believe in Christ do assent, <mark><strong>having salvation written in their hearts by the Spirit, without paper or ink</strong>, and, carefully preserving the ancient tradition</mark>, believing in one God, the Creator of heaven and earth, and all things therein, by means of Christ Jesus, the Son of God; who, because of His surpassing love towards His creation, condescended to be born of the virgin, He Himself uniting man through Himself to God, and having suffered under Pontius Pilate, and rising again, and having been received up in splendour, shall come in glory, the Saviour of those who are saved, and the Judge of those who are judged, and sending into eternal fire those who transform the truth, and despise His Father and His advent. </em></p><p><em><strong><mark>Those who, in the absence of written documents, have believed this faith</mark></strong>, are barbarians, so far as regards our language; but as regards doctrine, manner, and tenor of life, they are, because of faith, very wise indeed; and they do please God, ordering their conversation in all righteousness, chastity, and wisdom. If any one were to preach to these men the inventions of the heretics, speaking to them in their own language, they would at once stop their ears, and flee as far off as possible, not enduring even to listen to the blasphemous address. Thus, by means of that ancient tradition of the apostles, they do not suffer their mind to conceive anything of the [doctrines suggested by the] portentous language of these teachers, among whom neither Church nor doctrine has ever been established.</em></p><p><em>3. For, prior to Valentinus, those who follow Valentinus had no existence; nor did those from Marcion exist before Marcion; nor, in short, had any of those malignant-minded people, whom I have above enumerated, any being previous to the initiators and inventors of their perversity.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-2">Against Heresies, Book III, chs. 2–4</a>)</p><blockquote><p><em>Now <strong>all these [heretics] are of much later date than the bishops to whom the apostles committed the Churches</strong>; which fact I have in the third book taken all pains to demonstrate. It follows, then, as a matter of course, that these heretics aforementioned, since they are blind to the truth, and deviate from the [right] way, <strong>will walk in various roads</strong>; and therefore <strong><mark>the footsteps of their doctrine are scattered here and there without agreement or connection</mark></strong>. <strong><mark>But the path of those belonging to the Church circumscribes the whole world, as possessing the sure <u>tradition from the apostles</u></mark></strong>, and gives unto us to see that <strong>the faith of all is one and the same</strong>, since <strong>all receive one and the same God</strong> the Father, and believe in the same dispensation regarding the incarnation of the Son of God, and are cognizant of the same gift of the Spirit, and <strong>are conversant with the same commandments</strong>, and <strong>preserve the same form of ecclesiastical constitution</strong>, and expect the same advent of the Lord, and <strong>await the same salvation of the complete man, that is, of the soul and body</strong>. </em></p><p><em>And undoubtedly the preaching of the Church is true and stedfast, in which one and the same way of salvation is shown throughout the whole world. For to her is entrusted the light of God; and therefore the "wisdom" of God, by means of which she saves all men, "is declared in [its] going forth; it uttereth [its voice] faithfully in the streets, is preached on the tops of the walls, and speaks continually in the gates of the city." For the Church preaches the truth everywhere, and she is the seven-branched candlestick which bears the light of Christ.</em></p><p><em>2. <strong><mark>Those, therefore, who desert the preaching of the Church, call in question the knowledge of the holy presbyters, not taking into consideration of how much greater consequence is a religious man, even in a private station, than a blasphemous and impudent sophist.</mark></strong> Now, such are all the heretics, and those who imagine that they have hit upon something more beyond the truth, so that by following those things already mentioned, <strong><mark>proceeding on their way variously, inharmoniously, and foolishly, not keeping always to the same opinions with regard to the same things, as blind men are led by the blind, they shall deservedly fall into the ditch of ignorance lying in their path, ever seeking and never finding out the truth</mark></strong>. It behoves us, therefore, to avoid their doctrines, and to take careful heed lest we suffer any injury from them; but <strong><mark>to <u>flee to the Church</u>, and be brought up in her bosom, and be nourished with the Lord's Scriptures</mark></strong>. For the Church has been planted as a garden (paradisus) in this world; therefore says the Spirit of God, "Thou mayest freely eat from every tree of the garden," that is, <strong><mark>Eat ye from every Scripture of the Lord; but ye shall not eat with an uplifted mind, nor touch any heretical discord</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against Heresies, Book V, ch. 20</a>)</p><h3>Some nations preserve the faith without Scripture, by Tradition alone</h3><blockquote><p><em>Since therefore we have such proofs, <strong>it is not necessary to seek the truth among others which it is easy to obtain from the Church; since the apostles, like a rich man [depositing his money] in a bank, lodged in her hands most copiously all things pertaining to the truth: so that every man, whosoever will, can draw from her the water of life.</strong> For she is the entrance to life; all others are thieves and robbers. On this account are we bound to avoid them, but to make choice of the thing pertaining to the Church with the utmost diligence, and <strong><mark>to lay hold of the tradition of the truth</mark></strong>. For how stands the case? <strong>Suppose there arise a dispute relative to some important question among us, should we not have recourse to the most ancient Churches with which the apostles held constant intercourse, and learn from them what is certain and clear in regard to the present question? For how should it be if the apostles themselves had not left us writings? Would it not be necessary, [in that case,] <mark>to follow the course of the tradition</mark> which they handed down to those to whom they did commit the Churches?</strong></em></p><p><em><strong>2. To which course many nations of those barbarians who believe in Christ do assent, <mark>having salvation written in their hearts by the Spirit, without paper or ink, and, carefully preserving the ancient tradition</mark></strong>, believing in one God, the Creator of heaven and earth, and all things therein, by means of Christ Jesus, the Son of God; who, because of His surpassing love towards His creation, condescended to be born of the virgin, He Himself uniting man through Himself to God, and having suffered under Pontius Pilate, and rising again, and having been received up in splendour, shall come in glory, the Saviour of those who are saved, and the Judge of those who are judged, and sending into eternal fire those who transform the truth, and despise His Father and His advent. </em></p><p><em><strong><mark>Those who, in the absence of written documents, have believed this faith</mark>, are barbarians, so far as regards our language; but as regards doctrine, manner, and tenor of life, they are, because of faith, very wise indeed; and they do please God, ordering their conversation in all righteousness, chastity, and wisdom.</strong> If any one were to preach to these men the inventions of the heretics, speaking to them in their own language, they would at once stop their ears, and flee as far off as possible, not enduring even to listen to the blasphemous address. Thus, by means of that ancient tradition of the apostles, they do not suffer their mind to conceive anything of the [doctrines suggested by the] portentous language of these teachers, among whom neither Church nor doctrine has ever been established.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against Heresies, Book III, ch. 4</a>)</p><h3>The value of church unity and the condemnation of divisions</h3><blockquote><p><em>He shall also judge false prophets, who, without having received the gift of prophecy from God, and not possessed of the fear of God, but either for the sake of vainglory, or with a view to some personal advantage, or acting in some other way under the influence of a wicked spirit, pretend to utter prophecies, while all the time they lie against God.</em></p><p><em>7. He <strong><mark>shall also judge those who give rise to schisms, who are destitute of the love of God, and who look to their own special advantage rather than to the unity of the Church</mark></strong>; and who for trifling reasons, or any kind of reason which occurs to them, cut in pieces and <strong><mark>divide the great and glorious body of Christ</mark></strong>, and so far as in them lies, [positively] destroy it,-<strong><mark>men who prate of peace while they give rise to war</mark></strong>, and do in truth strain out a gnat, but swallow a camel. For no reformation of so great importance can be effected by them, <strong><mark>as will compensate for the mischief arising from their schism</mark></strong>. He shall also judge all those who are beyond the pale of the truth, that is, who are outside the Church</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-33">Against Heresies, Book IV, ch. 33</a>)</p><h3>Simon Magus &mdash; a sectarian, the originator of heresies</h3><blockquote><p>2. Now this <strong><mark>Simon</mark> of Samaria, from whom <mark>all sorts of heresies derive their origin</mark></strong>, <strong><mark>formed his sect</mark></strong> out of the following materials:-Having redeemed from slavery at Tyre, a city of Phoenicia, a certain woman named Helena, he was in the habit of carrying her about with him, declaring that this woman was the first conception of his mind, the mother of all</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-23">Against Heresies, Book I, ch. 23</a>)</p><p>In Latin:</p><blockquote><p>2. <strong><mark>Simon</mark> autem Samaritanus, ex quo universæ <mark>hæreses</mark></strong> substiterunt, habet hujusmodi <strong><mark>sectæ</mark></strong> materiam. Hic Helenam quandam, quam ipse a Tyro civitate Phœnices quæstuariam cum redemisset, secum circumducebat, dicens hanc esse primam mentis ejus conceptionem, matrem omnium</p></blockquote><p>(<a href="https://bibleox.com/en/la/w/LATIN-Adversus_haereses_LIBER_I#HH-23-16">Against Heresies, Book I, ch. 23 (Latin)</a>)</p><h3>Heretics shelter behind the name of Jesus</h3><blockquote><p><em>But since this man is the only one who has dared openly to mutilate the Scriptures, and unblushingly above all others to inveigh against God, I purpose specially to refute him, convicting him out of his own writings; and, with the help of God, <strong>I shall overthrow him out of those discourses of the Lord and the apostles, which are of authority with him, and of which he makes use</strong>. At present, however, I have simply been led to mention him, that thou mightest know that all those who in any way corrupt the truth, and injuriously affect the preaching of the Church, are the disciples and successors of Simon Magus of Samaria. Although <strong>they do not confess the name of their master, in order all the more to seduce others, yet they do teach his doctrines. They <mark>set forth, indeed, the name of Christ Jesus as a sort of lure</mark>, but in various ways they introduce the impieties of Simon; and thus they destroy multitudes, wickedly disseminating their own doctrines by the use of a good name, and, through means of its sweetness and beauty, extending to their hearers the bitter and malignant poison of the serpent, the great author of apostasy.</strong></em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-27">Against Heresies, Book I, ch. 27</a>)</p><h3>Shunning the words of the heretics</h3><blockquote><p><em>If any one were to preach to these men the inventions of the heretics, speaking to them in their own language, they would at once <strong><mark>stop their ears, and flee as far off as possible, not enduring even to listen to the blasphemous address</mark>.</strong> Thus, by means of that ancient tradition of the apostles, <strong><mark>they do not suffer their mind to conceive anything of the [doctrines suggested by the] portentous language of these teachers</mark></strong></em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against Heresies, Book III, ch. 4</a>)</p><blockquote><p><em>Those, therefore, who desert the preaching of the Church, call in question the knowledge of the holy presbyters, not taking into consideration of how much greater consequence is a religious man, even in a private station, than a blasphemous and impudent sophist. Now, <strong>such are all the heretics</strong>, and those who imagine that they have hit upon something more beyond the truth, so that by following those things already mentioned, proceeding on their way variously, inharmoniously, and foolishly, not keeping always to the same opinions with regard to the same things, as blind men are led by the blind, they shall deservedly fall into the ditch of ignorance lying in their path, ever seeking and never finding out the truth. It behoves us, therefore, <strong><mark>to avoid their doctrines, and to take careful heed lest we suffer any injury from them</mark>; but to flee to the Church, and be brought up in her bosom, and be nourished with the Lord's Scriptures</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against Heresies, Book V, ch. 20</a>)</p><h3>Heretics contradict one another</h3><p>The heretics constantly contradict one another and invent new doctrines:</p><blockquote><p><em>Let us now look at the inconsistent opinions of those heretics (for there are some two or three of them), how they <strong><mark>do not agree in treating the same points, but alike, in things and names, set forth opinions mutually discordant</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-11">Against Heresies, Book I, ch. 11</a>)</p><blockquote><p><em>according to their idea, the truth properly resides <strong>at one time in Valentinus, at another in Marcion, at another in Cerinthus, then afterwards in Basilides, or has even been indifferently in any other opponent</strong>, who could speak nothing pertaining to salvation. For every one of these men, being altogether of a perverse disposition, depraving the system of truth, is not ashamed to preach himself.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-2">Against Heresies, Book III, ch. 2</a>)</p><blockquote><p><em>They affirm that certain things still, besides these, were spoken from the Pleroma, but are confuted by those which are referred to in the Scriptures as beating on the advent of Christ. But what these are [that are spoken from the Pleroma] they are not agreed, but <strong>give different answers regarding them</strong>. For <strong>if any one, wishing to test them, do question one by one with regard to any passage those who are their leading men, he shall find</strong> one of them referring the passage in question to the Propator-that is, to Bythus; another attributing it to Arche-that is, to the Only-begotten; another to the Father of all-that is, to the Word; while another, again, will say that it was spoken of that one iron who was [formed from the joint contributions] of the Aeons in the Pleroma; </em></p><p><em>others [will regard the passage] as referring to Christ, while another [will refer it] to the Saviour. One, again, more skilled than these, after a long protracted silence, declares that it was spoken of Horos; another that it signifies the Sophia which is within the Pleroma; another that it announces the mother outside the Pleroma; while another will mention the God who made the world (the Demiurge). <strong><mark>Such are the variations existing among them with regard to one [passage], holding discordant opinions as to the same Scriptures</mark></strong></em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-35">Against Heresies, Book IV, ch. 35</a>)</p><blockquote><p><em>Now all these [heretics] are of much later date than the bishops to whom the apostles committed the Churches; which fact I have in the third book taken all pains to demonstrate. It follows, then, as a matter of course, that these heretics aforementioned, since they are blind to the truth, and deviate from the [right] way, will walk in various roads; and therefore the footsteps of their doctrine are scattered here and there without agreement or connection. But the <strong><mark>path</mark></strong> of those belonging to the Church circumscribes the whole world, <strong><mark>as possessing the sure tradition from the apostles, and gives unto us to see that the faith of all is one and the same</mark></strong>, since all receive one and the same God the Father, and believe in the same dispensation regarding the incarnation of the Son of God, and are cognizant of the same gift of the Spirit, and are conversant with the same commandments, and <strong><mark>preserve the same form of ecclesiastical constitution</mark></strong>, and expect the same advent of the Lord, and await the same salvation of the complete man, that is, of the soul and body. </em></p><p><em>And undoubtedly the preaching of the Church is true and stedfast, in which one and the same way of salvation is shown throughout the whole world. For to her is entrusted the light of God; and therefore the "wisdom" of God, by means of which she saves all men, "is declared in [its] going forth; it uttereth [its voice] faithfully in the streets, is preached on the tops of the walls, and speaks continually in the gates of the city." For the Church preaches the truth everywhere, and she is the seven-branched candlestick which bears the light of Christ.</em></p><p><em>2. <strong>Those, therefore, who desert the preaching of the Church, call in question the knowledge of the holy presbyters</strong>, not taking into consideration of how much greater consequence is a religious man, even in a private station, than a blasphemous and impudent sophist. Now, <strong><mark>such are all the heretics</mark></strong>, and those who imagine that they have hit upon something more beyond the truth, so that by following those things already mentioned, proceeding on their way variously, inharmoniously, and foolishly, <strong><mark>not keeping always to the same opinions with regard to the same things</mark></strong>, as blind men are led by the blind, they shall deservedly fall into the ditch of ignorance lying in their path, ever seeking and never finding out the truth. It behoves us, therefore, to avoid their doctrines, and to take careful heed lest we suffer any injury from them; but <strong>to flee to the Church, and be brought up in her bosom, and be nourished with the Lord's Scriptures</strong>. For the Church has been planted as a garden (paradisus) in this world; therefore says the Spirit of God, "Thou mayest freely eat from every tree of the garden," that is, Eat ye from every Scripture of the Lord; but ye shall not eat with an uplifted mind, <strong><mark>nor touch any heretical discord</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against Heresies, Book V, ch. 20</a>)</p><h3>The structure of the Christian temple resembles the heavenly reality in the Revelation of John the Theologian</h3><p>The arrangement of the Christian temple is like that of the heavenly temple (Rev. 11:1, 19):</p><ul><li><p>the throne — Rev. 4:10</p></li><li><p>the altar — Rev. 8:3-5</p></li><li><p>the seven-branched lampstand — Rev. 4:5</p></li><li><p>the incense — Rev. 8:3, 5</p></li><li><p>the holy angels — Rev. 8:3; Rev. 15:6</p></li><li><p>the holy people — Rev. 6:9-11; Rev. 14:4-5</p></li></ul><p>Irenaeus refers to the Revelation of John the Theologian, saying that it is fitting for earthly things to be images of heavenly things, which are created by God:</p><blockquote><p><em>As, therefore, He does not stand in need of these [services], yet does desire that we should render them for our own benefit, lest we be unfruitful; so did the Word give to the people that very precept as to the making of oblations, although He stood in no need of them, that they might learn to serve God: thus is it, therefore, also His will that <strong>we, too</strong>, should <strong>offer a gift <mark>at the altar</mark></strong>, frequently and without intermission. The <strong><mark>altar, then, is in heaven</mark></strong> (for towards that place are our prayers and oblations directed); <strong><mark>the temple likewise</mark></strong> [is there], as John says in the Apocalypse, "And the temple of God was opened: " the tabernacle also: "For, behold," He says, "the tabernacle of God, in which He will dwell with men."</em></p><p><em>1. Now the gifts, oblations, and all the sacrifices, did the people receive in a figure, as was shown to Moses in the mount, from one and the same God, whose name is now glorified in the Church among all nations. But <strong><mark>it is congruous that those earthly things, indeed, which are spread all around us, should be types of the celestial</mark></strong>, being [both], however, created by the same God. <strong>For in no other way could He assimilate an image of spiritual things [to suit our comprehension]</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-18">Against Heresies, Book IV, chs. 18–19</a>)</p>
