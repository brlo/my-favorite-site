      <p>The quotations from <em>Against Heresies</em> are given from the English translation already published on this site (Ante-Nicene Fathers, ed. A. Roberts and J. Donaldson, 1867), verbatim save for the evident misprints of the electronic text, which are corrected here: “our the whole world” is read as “the whole world” (I, 10), “sesame” as “same” (IV, 28), “layer” as “laver” (III, 17), “in harmoniously” as “inharmoniously” (V, 20), “neigbbour” as “neighbour” (IV, 16). Where a reading is doubtful, it is left as printed and the difficulty is noted; the paragraph numbers of the Ante-Nicene Fathers are kept where a quotation runs over from one paragraph or chapter into the next, and an ellipsis (…) marks a gap where the Russian page has one. The quotations from the <em>Demonstration of the Apostolic Preaching</em> come from the same series; those from Justin Martyr and from the <em>Martyrdom of Polycarp</em> from their pages on this site. The emphases of the Russian page (bold, highlighting, italics, underlining) are reproduced on the corresponding English words. The translator’s notes of the Russian page (for instance the Greek διὰ τοῦ ἁγίου ὕδατος καὶ τῆς τοῦ Κυρίου ἐπικλήσεως, “through the holy water and the invocation of the Lord”, in fragment 33; or the explanation of “regeneration” as the name of baptism) are omitted from the quotations, the Greek or the explanation being given above.</p><p>Where the reference of the Russian page disagrees with the text, the reference follows the text: the passage on Philip and the eunuch, cited there as Book V, is <em>Against Heresies</em> IV, 23. The chapters of the Latin version are cited by the numbering of the Ante-Nicene Fathers; the Greek fragments by their numbering in the Greek collection.</p><p>Translation: Rodion Vlasov, with the use of AI, from the <a href="https://bibleox.com/en/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">Russian reference page</a>.</p>
