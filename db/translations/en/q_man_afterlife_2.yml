      <h2>The Old Testament Righteous on Their Descent into Hades After Death</h2><blockquote><p>“My days are past, my purposes are broken off, even the thoughts of my heart. They change the night into day; ‘The light is near,’ they say, in the face of darkness. If I wait for <strong><mark>the grave as my house, if I make my bed in the darkness</mark></strong>, if I say to corruption, ‘You are my father,’ and to the worm, ‘You are my mother and my sister,’ where then is <strong>my hope</strong>? As for my hope, who can see it? <strong><mark>Will they go down to the gates of Sheol?</mark></strong> Shall we have rest together in the dust?” (<a href="https://bibleox.com/en/eng-nkjv/iov/17/#L11-16">Job. 17:11-16</a>) <em>(Hebrew: שְׁאוֹל בֵּיתִי — “Sheol is my house”; Greek: ᾅδης μου ὁ οἶκος — “Hades is my house”)</em></p></blockquote><blockquote><p>“And all his sons and all his daughters arose to comfort him; but he refused to be comforted, and he said, ‘<strong><mark>For I shall go down into the grave to my son in mourning</mark></strong>.’ Thus his father wept for him” (<a href="https://bibleox.com/en/eng-nkjv/gen/37/#L35">Gen. 37:35</a>) <em>(Hebrew: שְׁאֹלָה — “to Sheol”; Greek: εἰς ᾅδου — “to Hades”)</em></p></blockquote><blockquote><p>“This is an evil in all that is done under the sun: that <strong><mark>one thing happens to all</mark></strong>. Truly the hearts of the sons of men are full of evil; madness is in their hearts while they live, and after that <strong><mark>they go to the dead</mark>. But for him who is joined to all the living there is hope, for a living dog is better than a dead lion.</strong> For the living know that they will die; but the dead know nothing, and they have no more reward, for the memory of them is forgotten” (<a href="https://bibleox.com/en/eng-nkjv/ekl/9/#L3-5">Eccl. 9:3-5</a>)</p></blockquote><blockquote><p>“Remember how short my time is; for what futility have You created all the children of men? <strong><mark>What man can live and not see death? Can he deliver his life from the power of the grave?</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/89/#L47-48">Ps. 89:47-48</a>) <em>(Hebrew: מִיַּד ־ שְׁאוֹל — “from the hand of Sheol”)</em></p></blockquote><h2>The Change of the Heavenly Reality After the Resurrection of Christ</h2><p>To be convinced that before Christ the souls of the departed righteous did not attain life with God in heaven, one can compare the description of the heavenly reality before Christ and after Christ’s resurrection.</p><p>Before Christ the heavenly reality was shown to the prophet Moses on the mountain, so that the prophet would build the earthly temple (the tabernacle, the sanctuary) according to the image he saw:</p><blockquote><p><em>“And </em><strong><em><mark>let them make</mark></em></strong><em> Me </em><strong><em>a sanctuary</em></strong><em>, that I may dwell among them. </em><strong><em><mark>According to all that I show you</mark></em></strong><em>, that is, </em><strong><em>the pattern of the tabernacle</em></strong><em> and the pattern of all its furnishings, just so you shall </em><strong><em>make</em></strong><em> it. &lt;...&gt; And see to it that you </em><strong><em>make them according to the pattern which was shown you on the mountain</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/25/#L8-9,40"><em>Ex. 25:8-9,40</em></a><em>)</em></p></blockquote><blockquote><p><em>“For Christ has not entered </em><strong><em>the holy places made with hands, <mark>which are copies of the true</mark></em></strong><em>, but into heaven itself, now to appear in the presence of God for us” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24"><em>Heb. 9:24</em></a><em>)</em></p></blockquote><p>Examining the <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">arrangement</a> and the images of the Old Testament temple, we see that before Christ’s sacrifice only God (invisibly) and the holy angels are in heaven (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L29">1 Kin. 6:29</a>).</p><p>After the resurrection and ascension of Christ, God, visible in His humanity, is seated in heaven (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L20-21">Eph. 1:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L21">Rev. 3:21</a>), where the angels still abide (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3">Rev. 8:3</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/15/#L6">Rev. 15:6</a>), and the souls of the righteous also appear (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L1,3-5">Rev. 14:1,3-5</a>). We see this new heavenly reality in the Revelation of John the Theologian.</p><p>Thus in the new heavenly reality, besides God and the angels, the souls of the righteous also appear, who were not there before the resurrection of Christ.</p><h3>The Old Testament — Only God and the Angels in the Temple</h3><p>Before Christ’s sacrifice, in the Old Testament God shows the prophet Moses a temple on the mountain, commanding that everything on earth be made according to the image shown (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L8-9,40">Ex. 25:8-9,40</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24">Heb. 9:24</a>). In the end Moses builds a temple in which God is not depicted in any way, and around the place of God’s manifestation (the cover of the ark) statues of angels are placed; all the walls and the veil also contain images of angels.</p><h4>The Invisible God</h4><p>In the Old Testament temple, built at God’s command, there was no image of God, since God was not visible. In the most important place there stood only the ark (a chest) with the sacred objects, above whose cover, between two cherubim, God revealed Himself and spoke:</p><blockquote><p><em>“And there </em><strong><em>I will meet with you, and I will speak with you from above the mercy seat, from between the two cherubim</em></strong><em> which are on the ark of the Testimony, about everything which I will give you in commandment to the children of Israel” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/25/#L22"><em>Ex. 25:22</em></a><em>)</em></p></blockquote><h4>The Holy Angels</h4><p>The temple was everywhere filled with images of angels (cherubim):</p><blockquote><p><em>“And </em><strong><em>you shall make two cherubim of gold</em></strong><em>; of hammered work you shall make them </em><strong><em>at the two ends of the mercy seat</em></strong><em>. Make one cherub at one end, and the other cherub at the other end; you shall make the cherubim at the two ends of it of one piece with the mercy seat. And the cherubim shall stretch out their wings above, covering the mercy seat with their wings, and they shall face one another; the faces of the cherubim shall be toward the mercy seat” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/25/#L18-20"><em>Ex. 25:18-20</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>Inside the inner sanctuary he made two cherubim</em></strong><em> of olive wood, each ten cubits high. &lt;...&gt; Then </em><strong><em>he set the cherubim inside the inner room</em></strong><em>; and they stretched out the wings of the cherubim so that the wing of the one touched one wall, and the wing of the other cherub touched the other wall. And their wings touched each other in the middle of the room” (</em><a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L23,27"><em>1 Kin. 6:23,27</em></a><em>)</em></p></blockquote><blockquote><p><em>“And he made </em><strong><em>the veil</em></strong><em> of blue, purple, crimson, and fine linen, and </em><strong><em>wove cherubim into it</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2par/3/#L14"><em>2 Chr. 3:14</em></a><em>) (</em><a href="https://bibleox.com/en/en-nrsv/1mak/1/#L22"><em>1 Macc. 1:22</em></a><em>)</em></p></blockquote><blockquote><p><em>“Then </em><strong><em>he carved all the walls of the temple all around, both the inner and outer sanctuaries, with carved figures of cherubim</em></strong><em>, palm trees, and open flowers” (</em><a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L29"><em>1 Kin. 6:29</em></a><em>)</em></p></blockquote><p>In detail about the arrangement of the temple: <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">https://bibleox.com/ru/ru/w/иерусалимский-храм</a> (in Russian)</p><h3>The New Testament — God, the Angels and the Souls of the Righteous in the Temple</h3><p>After the incarnation of the Son of God and His victory over death, we see a different heavenly reality. It is described by John the Theologian in the book of Revelation. First, God becomes visible and is seated on the throne. Second, not only angels serve Him in heaven now, but also a multitude of souls of holy righteous people.</p><h4>Christ</h4><blockquote><p>“So then, after the Lord had spoken to them, He was received up into heaven, and <strong><mark>sat down at the right hand of God</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L19">Mark. 16:19</a>)</p></blockquote><blockquote><p>“which He worked in Christ when He raised Him from the dead and <strong><mark>seated Him at His right hand in the heavenly places</mark></strong>, far above all principality and power and might and dominion, and every name that is named, not only in this age but also in that which is to come” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L20-21">Eph. 1:20-21</a>)</p></blockquote><blockquote><p>“To him who overcomes I will grant to sit with Me on <strong>My throne</strong>, as I also overcame and <strong><mark>sat down with My Father on His throne</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L21">Rev. 3:21</a>)</p></blockquote><h4>The Holy Angels</h4><blockquote><p><em>“Then another </em><strong><em>angel</em></strong><em>, having a golden censer, came and stood at the altar. He was given much incense, that he should offer it with the prayers of all the saints upon the golden altar which was before the throne” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3"><em>Rev. 8:3</em></a><em>)</em></p></blockquote><blockquote><p><em>“And out of the temple came the seven </em><strong><em>angels</em></strong><em> having the seven plagues, clothed in pure bright linen, and having their chests girded with golden bands” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/15/#L6"><em>Rev. 15:6</em></a><em>)</em></p></blockquote><h4>The Souls of the Holy Righteous</h4><blockquote><p><em>“When He opened the fifth seal, I saw </em><strong><em>under the altar the <mark>souls</mark> of those who had been slain for the word of God and for the testimony which they held</em></strong><em>. And they cried with a loud voice, saying, ‘How long, O Lord, holy and true, until You judge and avenge our blood on those who dwell on the earth?’ Then </em><strong><em>a white robe</em></strong><em> was given to each of them; and it was said to them that they should rest a little while longer, until both the number of their fellow servants and </em><strong><em>their brethren, who would be killed as they were, was completed</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11"><em>Rev. 6:9-11</em></a><em>)</em></p></blockquote><blockquote><p><em>“Then I looked, and behold, </em><strong><em>a Lamb</em></strong><em> standing on Mount Zion, and </em><strong><em>with Him <mark>one hundred and forty-four thousand</mark></em></strong><em>, having His Father’s name written on their foreheads. &lt;...&gt; They sang as it were a new song before the throne, before the four living creatures, and the elders; and no one could learn that song except the hundred and forty-four thousand </em><strong><em><mark>who were redeemed from the earth</mark></em></strong><em>. These are the ones </em><strong><em>who were not defiled with women</em></strong><em>, for they are virgins. These are the ones who </em><strong><em>follow the Lamb wherever He goes</em></strong><em>. These were redeemed from among men, being firstfruits to God and to the Lamb. And in their mouth was found no deceit, for they are without fault before the throne of God” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L1,3-5"><em>Rev. 14:1,3-5</em></a><em>)</em></p></blockquote><h2>No One Has Ascended to Heaven Except the Son Who Came Down from Heaven</h2><blockquote><p>“<strong><mark>No one has ascended to heaven but He who came down from heaven, that is, the Son of Man</mark></strong> who is in heaven” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L13">John. 3:13</a>)</p></blockquote><blockquote><p>“Men and brethren, <strong>let me speak freely to you of the patriarch David, that he is both dead and buried</strong> &lt;...&gt; <strong>For <mark>David did not ascend into the heavens</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L29,34">Act. 2:29,34</a>)</p></blockquote><h2>“You Will Not Leave My Soul in Hades” — Not Said of David</h2><p>The prophecy spoken by King David in the psalm (<a href="https://bibleox.com/en/eng-nkjv/ps/16/#L10">Ps. 16:10</a>) that the soul is not left in Hades and the flesh will not see corruption refers not to David, but to Christ. Consequently, both the <strong>flesh</strong> of King David saw corruption, and his <strong>soul</strong> was left in Hades until Christ’s descent into Hades.</p><blockquote><p>“For You will not leave my soul in Hades, nor will You allow Your Holy One to see corruption. &lt;...&gt; Men and brethren, <strong>let me speak freely to you of the patriarch David, that he is both dead and buried</strong>, and his tomb is with us to this day. &lt;...&gt; he, foreseeing this, <strong><mark>spoke concerning the resurrection of the Christ, that His soul was not left in Hades, nor did His flesh see corruption</mark></strong>. &lt;...&gt; <strong>For David did not ascend into the heavens</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L27,29,31,34">Act. 2:27,29,31,34</a>)</p></blockquote><h2>Christ Descended into Hades, Preached, Himself Came Out and Led the Righteous Out of Hades</h2><p>In Hades Christ preached to those spirits (souls) who had been there since the worldwide flood:</p><blockquote><p>“For Christ also suffered once for sins, the just for the unjust, that He might bring us to God, <strong>being put to death in the flesh but made alive by the Spirit</strong>, by whom also <strong><mark>He went and preached to the spirits in prison</mark></strong>, who formerly were disobedient, when once the Divine longsuffering waited in the days of Noah, while the ark was being prepared” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L18-20">1 Pet. 3:18-20</a>)</p><p>“They will give an account to Him who is ready to judge the living and the dead. For this reason <strong><mark>the gospel was preached also to those who are dead</mark></strong>, that they might be judged according to men in the flesh, but live according to God in the spirit” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L5-6">1 Pet. 4:5-6</a>)</p></blockquote><h2>The Righteous Were in the Captivity of Hades, but Christ Destroyed This Captivity</h2><blockquote><p>“Therefore He says: ‘When He ascended on high, <strong><mark>He led captivity captive</mark></strong>, and gave gifts to men.’ (Now this, <strong>‘He ascended’ — what does it mean but that He also first descended into the lower parts of the earth?</strong>)” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L8-9">Eph. 4:8-9</a>)</p></blockquote><blockquote><p>“Do not be afraid; I am the First and the Last. I am He who lives, and was dead, and behold, I am alive forevermore. Amen. And <strong><mark>I have the keys of Hades and of Death</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L17-18">Rev. 1:17-18</a>)</p></blockquote><h2>All the Old Testament Righteous Did Not Receive the Promise, and Were Not Made Perfect Apart from the New Testament Righteous</h2><p>They waited and strove for the heavenly, but did not receive it:</p><blockquote><p>“Now faith is the <strong>substance</strong> of things <strong>hoped for</strong>, the evidence of things not seen. &lt;...&gt; By faith Abel offered to God &lt;…&gt; By faith Enoch &lt;...&gt; Noah &lt;…&gt; Abraham &lt;…&gt; By faith <strong>he dwelt in the land of promise as in a foreign country</strong>, dwelling in tents with Isaac and Jacob, the heirs with him of the same promise; for <strong><mark>he waited for </mark><u><mark>the city</mark></u><mark> which has foundations, </mark><u><mark>whose builder and maker is God</mark></u></strong>. By faith Sarah herself also &lt;...&gt; <strong><mark>These all died in faith, not having received the promises</mark></strong>, <strong><mark>but </mark><u><mark>having seen them afar off were assured of them, embraced them</mark></u></strong> and confessed that they were strangers and pilgrims on the earth. For those who say such things declare plainly that they seek a homeland. And truly if they had called to mind that country from which they had come out, they would have had opportunity to return. But now <strong><mark>they desire a better, that is, </mark><u><mark>a heavenly</mark></u><mark> country</mark></strong>. Therefore God is not ashamed to be called their God, for <strong><mark>He has prepared a city for them</mark></strong>. By faith Abraham &lt;...&gt; Isaac &lt;…&gt; Joseph &lt;…&gt; Moses &lt;...&gt; For the time would fail me to tell of Gideon and Barak and Samson and Jephthah, also of David and Samuel and the prophets &lt;...&gt; And <strong><em><u><mark>all these</mark></u>, having obtained a good testimony through faith, <u><mark>did not receive the promise</mark></u></em></strong>, God having provided something better for us, that <strong><mark>they should not be made perfect apart from us</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/11/#L1-2,4-5,7-11,13-17,20-23,32,39-40">Heb. 11:1-2,4-5,7-11,13-17,20-23,32,39-40</a>)</p></blockquote><h2>Christ’s Sacrifice Frees the Believing Righteous from the Sins Previously Committed</h2><blockquote><p>“Now we know that whatever the law says, it says to those who are under the law, that every mouth may be stopped, and all the world may become guilty before God. Therefore <strong><mark>by the deeds of the law no flesh will be justified</mark></strong> in His sight, for by the law is the knowledge of sin. But <strong><mark>now the righteousness of God apart from the law is revealed</mark></strong>, <strong>being witnessed by the Law and the Prophets, even <mark>the righteousness of God, through faith in Jesus Christ</mark>, <mark>to all and on all who believe</mark></strong>. For <strong><mark>there is no difference</mark></strong>; for <strong><mark>all have sinned and fall short of the glory of God</mark>, <mark>being justified</mark> freely by His grace <mark>through the redemption that is in Christ Jesus</mark>, <mark>whom God set forth as a propitiation</mark></strong> by His blood, through faith, to demonstrate His righteousness, because in His forbearance God <strong><mark>had passed over the sins that were previously committed</mark></strong>, <strong><mark>to demonstrate</mark></strong> <strong><mark>at the present time His righteousness</mark></strong>, that He might be just and the justifier of the one who has faith in Jesus. Where is boasting then? It is excluded. By what law? Of works? No, but by the law of faith” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L19-27">Rom. 3:19-27</a>).</p></blockquote>

