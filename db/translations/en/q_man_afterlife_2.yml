      <h2>Unequal Torment in Hell</h2><h3>One Who Knew and Transgressed Will Be Punished More Severely Than One Who Did Not Know but Transgressed</h3><blockquote><p>“And that servant <strong>who knew his master’s will</strong>, and did not prepare himself <strong>or do according to his will, <mark>shall be beaten with many stripes</mark>. But he who did not know</strong>, yet <strong>committed things deserving of stripes, <mark>shall be beaten with few</mark></strong>. For everyone to whom much is given, from him much will be required; and <strong>to whom much has been committed, of him they will ask the more</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L47-48">Luke. 12:47-48</a>)</p></blockquote><h3>Hypocrites Will Receive Greater Condemnation</h3><blockquote><p>“<strong>Woe to you, scribes and Pharisees, hypocrites!</strong> For you devour widows’ houses, and for a pretense make long prayers. <strong><mark>Therefore you will receive greater condemnation</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L14">Matt. 23:14</a>)</p></blockquote><blockquote><p>“<strong>Beware of the scribes, who desire to go around in long robes</strong>, love greetings in the marketplaces, the best seats in the synagogues, and the best places at feasts, who devour widows’ houses, and for a pretense make long prayers. <strong><mark>These will receive greater condemnation</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/20/#L46-47">Luke. 20:46-47</a>)</p></blockquote><h3>A Teacher Who Sins Will Receive Greater Condemnation</h3><blockquote><p>“My brethren, <strong><mark>let not many of you become teachers</mark>, knowing that we shall <mark>receive a stricter judgment</mark></strong>. For we all stumble in many things. If anyone does not stumble in word, he is a perfect man, able also to bridle the whole body” (<a href="https://bibleox.com/en/eng-nkjv/iak/3/#L1-2">James. 3:1-2</a>)</p></blockquote><h3>The Sinful Cities Before Christ Will Fare More Tolerably at the Judgment Than Those Where Christ Was Rejected Even When Manifest Miracles Were Shown</h3><blockquote><p>“But I say to you, <strong>it will be more tolerable for Tyre and Sidon in the day of judgment than for you</strong>. And you, Capernaum, who are exalted to heaven, will be brought down to Hades; for if the mighty works which were done in you had been done in Sodom, it would have remained until this day. But I say to you that <strong><mark>it shall be more tolerable for the land of Sodom in the day of judgment than for you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L22-24">Matt. 11:22-24</a>)</p></blockquote><blockquote><p>“And <strong>whoever will not receive you</strong> nor hear you, when you depart from there, shake off the dust under your feet as a testimony against them. Assuredly, I say to you, <strong><mark>it will be more tolerable for Sodom and Gomorrah in the day of judgment than for that city</mark></strong>!” (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L11">Mark. 6:11</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/10/#L14-15">Matt. 10:14-15</a>)</p></blockquote><blockquote><p>“Woe to you, Chorazin! Woe to you, Bethsaida! For if the mighty works which were done in you had been done in Tyre and Sidon, they would have repented long ago, sitting in sackcloth and ashes. But <strong><mark>it will be more tolerable for Tyre and Sidon at the judgment than for you</mark></strong>. And you, Capernaum, who are exalted to heaven, will be brought down to Hades” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L13-15">Luke. 10:13-15</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/11/#L20-22">Matt. 11:20-22</a>)</p></blockquote><h3>Woe to Those Through Whom Offenses Come</h3><blockquote><p>“Then He said to the disciples, ‘<strong>It is impossible that no offenses should come, but <mark>woe to him</mark> through whom they do come! <mark>It would be better</mark> for him if a millstone were hung around his neck</strong>, and he were thrown into the sea, than that he should offend one of these little ones’” (<a href="https://bibleox.com/en/eng-nkjv/lk/17/#L1-2">Luke. 17:1-2</a>)</p></blockquote><h3>Woe to Those Who Cause Believers to Stumble</h3><blockquote><p>“Whoever receives one little child like this in My name receives Me. <strong><mark>Whoever causes</mark> one of these little ones who believe in Me <mark>to sin, it would be better for him</mark> if a millstone were hung around his neck, and he were drowned in the depth of the sea</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L5-6">Matt. 18:5-6</a>)</p></blockquote><h3>Woe to the Betrayer of Christ; It Would Have Been Better for Him Not to Be Born</h3><blockquote><p>“The Son of Man indeed goes just as it is written of Him, but <strong><mark>woe to that man</mark> by whom the Son of Man is betrayed! <mark>It would have been good for that man if he had not been born</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/26/#L24">Matt. 26:24</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/14/#L21">Mark. 14:21</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/22/#L22">Luke. 22:22</a>)</p></blockquote><h2>Unequal Blessedness in the Kingdom of Heaven</h2><h3>Reward According to the Measure of Good</h3><blockquote><p><em>“with goodwill doing service, as to the Lord, and not to men, </em><strong><em>knowing that <mark>whatever good anyone does, he will receive the same</mark> from the Lord</em></strong><em>, whether he is a slave or free” (</em><a href="https://bibleox.com/en/eng-nkjv/ef/6/#L7-8"><em>Eph. 6:7-8</em></a><em>)</em></p></blockquote><blockquote><p>“I planted, Apollos watered, but God gave the increase. So then neither he who plants is anything, nor he who waters, but God who gives the increase. Now he who plants and he who waters are one, and <strong><mark>each one</mark> will receive his own reward <mark>according to his own labor</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L6-8">1 Cor. 3:6-8</a>)</p></blockquote><blockquote><p>“But this I say: <strong><mark>He who sows sparingly will also reap sparingly, and he who sows bountifully will also reap bountifully</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/9/#L6">2 Cor. 9:6</a>)</p></blockquote><blockquote><p>“For the Son of Man will come in the glory of His Father with His angels, and then <strong>He will reward each according to his works</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27">Matt. 16:27</a>) (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L5-6">Rom. 2:5-6</a>)</p></blockquote><blockquote><p>“Give, and it will be given to you: good <strong>measure</strong>, pressed down, shaken together, and <strong>running over will be put into your bosom</strong>. For <strong><mark>with the same measure that you use, it will be measured back to you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L38">Luke. 6:38</a>)</p></blockquote><h3>The Apostle Strives for More</h3><blockquote><p><em>“</em><strong><em>Not that I have already attained</em></strong><em>, or am already perfected; </em><strong><em>but I press on, that I may lay hold</em></strong><em> of that for which Christ Jesus has also laid hold of me. Brethren, </em><strong><em><mark>I do not count myself to have apprehended</mark></em></strong><em>; but one thing I do, forgetting those things which are behind and reaching forward to those things which are ahead, </em><strong><em><mark>I press toward the goal for the prize of the upward call</mark></em></strong><em> of God in Christ Jesus” (</em><a href="https://bibleox.com/en/eng-nkjv/fil/3/#L12-14"><em>Phil. 3:12-14</em></a><em>)</em></p></blockquote><h3>Whoever Keeps the Commandments and Teaches Others to Keep Them Will Be Called Great</h3><blockquote><p>“Whoever therefore breaks one of the least of these commandments, and teaches men so, shall be called least in the kingdom of heaven; but <strong><mark>whoever does and teaches them, he shall be called great</mark> in the kingdom of heaven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L19">Matt. 5:19</a>)</p></blockquote><h3>There Are Many Mansions in the Kingdom of Heaven</h3><blockquote><p>“<strong>In My Father’s house are many mansions</strong>; if it were not so, I would have told you. I go to prepare a place for you” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L2">John. 14:2</a>)</p></blockquote><h3>A Prophet’s Reward and a Righteous Man’s Reward</h3><blockquote><p>“He who receives you receives Me, and he who receives Me receives Him who sent Me. <strong>He who receives a prophet in the name of a prophet shall receive <mark>a prophet’s reward</mark></strong>. And <strong>he who receives a righteous man in the name of a righteous man shall receive <mark>a righteous man’s reward</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L40-41">Matt. 10:40-41</a>)</p></blockquote><h3>The Servants Are Rewarded Differently</h3><blockquote><p>“And so it was that when he returned, having received the kingdom, he then commanded these servants, to whom he had given the money, to be called to him, that he might know how much every man had gained by trading. Then came the first, saying, ‘Master, your mina has earned ten minas.’ And he said to him, ‘Well done, good servant; because you were faithful in a very little, <strong>have authority over <mark>ten cities</mark></strong>.’ And the second came, saying, ‘Master, your mina has earned five minas.’ Likewise he said to him, ‘<strong>You also be over <mark>five cities</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/19/#L15-19">Luke. 19:15-19</a>)</p></blockquote><blockquote><p>“For the kingdom of heaven is like a man traveling to a far country, who called his own servants and <strong>delivered his goods to them</strong>. And <strong>to one he gave five talents, to another two, and to another one,</strong> <strong>to each according to his own ability</strong>; and immediately he went on a journey. &lt;…&gt; So <strong>he who had received five talents came and brought five other talents</strong> &lt;…&gt; ‘you delivered to me two talents; look, I have gained two more talents besides them.’ &lt;…&gt; Then he who had received the one talent came and said, ‘Lord, I knew you to be a hard man, reaping where you have not sown, and gathering where you have not scattered seed. And I was afraid, and went and hid your talent in the ground. Look, there you have what is yours.’ But his lord answered and said to him, ‘You wicked and lazy servant, you knew that I reap where I have not sown, and gather where I have not scattered seed. So you ought to have deposited my money with the bankers, and at my coming I would have received back my own with interest. Therefore <strong>take the talent from him, and give it to him who has ten talents</strong>. For to everyone who has, more will be given, and he will have abundance; but from him who does not have, even what he has will be taken away. And cast the unprofitable servant into the outer darkness. There will be weeping and gnashing of teeth’” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L14-30">Matt. 25:14-30</a>)</p></blockquote><p>*The parable of the laborers in the vineyard (<a href="https://bibleox.com/en/eng-nkjv/mf/20/#L1-16">Matt. 20:1-16</a>), in which all are rewarded equally, was spoken in the presence of the Pharisees (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L3">Matt. 19:3</a>); it was spoken so that some would not exalt themselves over others: those who came early and labored more over those who turned later and labored less — for even in a late, short time one can manage to acquire what is necessary, so one should not lose heart.</p><h3>Virgins Have a Special Nearness to Christ</h3><blockquote><p>“These are <strong>the ones who were not defiled with women</strong>, for they are virgins. <strong><mark>These are the ones who follow the Lamb wherever He goes</mark></strong>. These were redeemed from among men, being firstfruits to God and to the Lamb” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L4">Rev. 14:4</a>)</p></blockquote>
