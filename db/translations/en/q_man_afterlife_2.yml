    title: Before Christ’s Resurrection the Souls of All People Went to Hades
    title_sub: All souls, including the souls of the righteous, after separation from their bodies at death, went to Hades
    menu: { parent: Man/Afterlife, title: Before Christ All Went to Hades, priority: 6 }
    references: |-
      <p>“But the righteous shall obtain the incorruptible and unfading kingdom, who indeed are at present detained in Hades, but not in the same place with the unrighteous. For to this locality there is one descent, at the gate whereof we believe an archangel is stationed with a host. And when those who are conducted by the angels appointed unto the souls have passed through this gate, they do not proceed on one and the same way; but the righteous, being conducted in the light toward the right, and being hymned by the angels stationed at the place, are brought to a locality full of light. And there the righteous from the beginning dwell, not ruled by necessity, but enjoying always the contemplation of the blessings which are in their view, and delighting themselves with the expectation of others ever new, and deeming those ever better than these. And that place brings no toils to them. There, there is neither fierce heat, nor cold, nor thorn; but the face of the fathers and the righteous is seen to be always smiling, as they wait for the rest and eternal revival in heaven which succeed this location. And we call it by the name Abraham’s bosom…</p><p>Thus far, then, on the subject of Hades, in which the souls of all are detained until the time which God has determined; and then He will accomplish a resurrection of all, not by transferring souls into other bodies, but by raising the bodies themselves.”</p><p>Hieromartyr Hippolytus of Rome. <a href="https://bibleox.com/en/en/w/hippolytus-against-plato-on-the-cause-of-the-universe/">“Against Plato, on the Cause of the Universe”</a></p><p>“What is Abraham’s bosom, if not the secret rest of the fathers? Of it the Truth says: I say to you that many will come from east and west, and sit down with Abraham, Isaac, and Jacob in the kingdom of heaven (Matt. 8:11-12). For the one clothed in purple and fine linen is rightly called a son of the kingdom. He lifted up his eyes from afar to see Lazarus, because the unbelievers, being in the lower place of their condemnation, until the last day of judgment look upon all the faithful who are above them at rest, whose joys afterwards they can never see.”</p><p>Gregory the Dialogist. “Forty Homilies on the Gospels, XL” (translated from the Russian).</p>
