    title: The Incarnation
    priority: 15
  body: '<h2>Terminology</h2><p>Divine energies (actions): azbyka.ru/bozhestvennye-energii</p><p>The
    essence and the energies of God: azbyka.ru/shemy/sushhnost-i-energii-bozhii.shtml</p><h2>4th
    century</h2><h3>St Athanasius the Great, bishop (c. 295–373)</h3><blockquote><p><strong>For
    this purpose, then, the incorporeal and incorruptible and immaterial Word of God
    comes to our realm, howbeit He was not far from us before. For no part of Creation
    is left void of Him: He has filled all things everywhere, remaining present with
    His own Father. But He comes in condescension to show loving-kindness upon us,
    and to visit us.</strong> And seeing the race of rational creatures in the way
    to perish, <strong>death reigning over them by corruption; seeing, too, that the
    threat against transgression gave a firm hold to the corruption which was upon
    us, and that it was monstrous that before the law was fulfilled it should fall
    through: seeing, once more, the unseemliness of what had come to pass: that the
    things whereof He Himself was Artificer were passing away:</strong> seeing, further,
    the exceeding wickedness of men, and how little by little they had increased it
    to an intolerable pitch against themselves: and seeing, lastly, how all men were
    under penalty of death: <strong>He took pity on our race, and had mercy on our
    infirmity, and <mark>condescended to our corruption</mark>, and, unable to bear
    that death should have the mastery – lest the creature should perish, and His
    Father’s handiwork in men be spent for nought – <mark>He takes unto Himself a
    body, and that of no different sort from ours</mark></strong>. For He did not
    simply will to become embodied, or will merely to appear. For if He willed merely
    to appear, He was able to effect His divine appearance by some other and higher
    means as well. But <strong><mark>He takes a body of our kind, and not merely so,
    but from a spotless and stainless virgin, knowing not a man, a body clean and
    in very truth pure from intercourse of men</mark></strong>. For being Himself
    mighty, and Artificer of everything, He prepares the body in the Virgin as a temple
    unto Himself, and makes it His very own as an instrument, in it manifested, and
    in it dwelling. And thus taking from our bodies <strong><mark>one of like nature</mark></strong>,
    because all were under penalty of the corruption of death He gave it over to death
    in the stead of all, and offered it to the Father – <strong>doing this, moreover,
    of His loving-kindness, <mark>to the end that</mark>, firstly, all being held
    to have died in Him, <mark>the law involving the ruin of men might be undone</mark>
    (inasmuch as its power was fully spent in the Lord’s body, and had no longer holding-ground
    against men, His peers), and that, <mark>secondly, whereas men had turned toward
    corruption, He might turn them again toward incorruption</mark>, and quicken them
    from death by the appropriation of His body and by the grace of the Resurrection,
    banishing death from them like straw from the fire.</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/KADO_On_the_Incarnation_of_the_Word">On the
    Incarnation of God the Word and of His coming to us in the flesh</a>)</p><blockquote><p>For
    this cause <strong><mark>He was both born and appeared as Man</mark></strong>,
    and died, and rose again, dulling and casting into the shade the works of all
    men of old time, that whatsoever they had been inclined to hold might be withdrawn
    from them, and that men might know the true Father of His Father, as He Himself
    says: “I came forth… to seek and to save that which was lost” (Matt. 18:11; Luke
    19:10).</p><p>For seeing that men had once fallen to the sensible, the Word willingly
    made Himself visible through a body, that, <strong><mark>becoming man</mark></strong>,
    He might draw men’s attention to Himself, withdraw their senses to Himself, and
    when they <strong>should see Him as man</strong>, persuade them by the works He
    wrought that <strong><mark>He is not only man, but God</mark></strong>, the Word
    and Wisdom of the true God.</p><p>&lt;…&gt;</p><p>And as, while abiding in the
    whole creation, <strong><mark>though He is outside all by essence, He is present
    in all by His own powers</mark></strong>, ordering all things, extending His providence
    to all and in all, quickening each creature and all creatures together, embracing
    the whole universe and not being embraced by it, but <strong>abiding wholly in
    His Father alone; so also in the human body</strong>, while <strong>He quickened
    it, He quickened beyond all doubt also the universe, abode in all creatures, and
    was outside the universe</strong>, making Himself known in the body by His works,
    and <strong>never ceasing to manifest Himself in His actions</strong> toward the
    universe.</p><p>&lt;…&gt;</p><p>…the Word of God in the man. It was not bound
    by the body; on the contrary, it possessed it wholly; therefore, <strong>it was
    in the body, and was in all creatures, and was outside created things, and rested
    in the Father alone</strong>. And, what is most marvellous, <strong>it lived as
    a man, quickened all things as the Word, and abode with the Father as the Son</strong>.</p><p>&lt;…&gt;</p><p>Therefore,
    when theologians of the Word say that it ate, and drank, and was born, know that
    the body, as body, was born, and sustained with food corresponding to its nature,
    while God, the Word Himself, Who was united with the body, while ordering all
    things, also by the works He did in the body showed Himself to be not man, but
    God the Word. But these things are said of Him, because <strong>the actual body
    which ate, was born, and suffered, belonged to none other but to the Lord</strong>.
    And because <strong>the Lord became man, it was fitting to say of Him this also,
    as of a man</strong>, that it might be evident that He truly, and not in appearance,
    has a body.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/KADO_On_the_Incarnation_of_the_Word">On
    the Incarnation of God the Word and of His coming to us in the flesh, ch. 3</a>)</p><blockquote><p>He
    made even the creation break silence: in that even at His death, marvellous to
    relate, or rather at His actual trophy over death – the Cross I mean – all creation
    was confessing that <strong><mark>He that was made manifest and suffered in the
    body was not man merely, but the Son of God and Saviour of all</mark></strong>.</p><p>&lt;…&gt;</p><p>Again,
    these, even where they suffered, were men resembling all in their common nature;
    but he that is declared in Scripture to suffer on behalf of all is called not
    merely man, but the Life of all, albeit <strong>He was in fact <mark>like men
    in nature</mark></strong>. For you shall see, it says, your Life hanging before
    your eyes (Deut. 28:66); and “who shall declare his generation?” (Isa. 53:8; cf.
    Acts 8:33) For one can ascertain the genealogy of all the saints, and declare
    it from the beginning, and of whom each was born; but the generation of Him that
    is the Life the Scriptures refer to as not to be declared. Who then is he of whom
    the Divine Scriptures say this? Or who is so great that even the prophets predict
    of him such great things?</p><p>None else, now, is found in the Scriptures but
    the common Saviour of all, the Word of God, our Lord Jesus Christ. For <strong>He
    it is that proceeded from a virgin and appeared as man on the earth</strong>,
    and whose generation after the flesh cannot be declared; because <strong>there
    is none that can tell His father after the flesh, His body not being of a man,
    but of a virgin alone</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/KADO_On_the_Incarnation_of_the_Word">On
    the Incarnation of God the Word and of His coming to us in the flesh, ch. 6</a>)</p><blockquote><p>What
    is there in our case unseemly, or worthy of laughter? Surely it is this: that
    <strong>the Word, as we say, appeared in a body</strong>? Yet they themselves,
    if they are friends of the truth, will confess that there is nothing unseemly
    in this.</p><p>&lt;…&gt;</p><p>So then, if in the world, which is itself a body,
    there is the Word of God, and <strong>He abides in all the parts of the world,
    taken together and each separately</strong>: what is wonderful, or what unseemly,
    when we affirm that <strong>the same Word abode also in man</strong>? If in general
    it is unseemly for Him to be in a body at all, then it is unseemly for Him to
    abide in the universe, to illumine all things and set them in motion by His providence;
    for the universe is also a body. But if it is fitting for the Word to abide in
    the world and to reveal Himself in the universe, then <strong>it is fitting for
    Him to appear also in a human body, which would be illumined by Him and set in
    motion by Him</strong>; for mankind also is a part of the whole world. If it is
    unseemly for a part to become the instrument of His making known the knowledge
    of the Godhead, then it is far more unseemly for Him to reveal Himself in the
    whole world.</p><p>&lt;…&gt;</p><p>If <strong>the Word, abiding wholly by His
    powers in each creature and in all creatures</strong>, and bringing all into the
    best order, had willed to speak and to make Himself and His Father known through
    the sun, or the moon, or the heaven, or the earth, or the waters, or fire, no
    one would have said that He acted unseemly; for He contains all things together,
    and abides both in all and in each part, manifesting Himself invisibly. <strong>So
    there is nothing unseemly if He, ordering the universe and quickening all things,
    and willing to make Himself known through men, used a human body as the instrument
    for the manifestation of the truth and for the making known of the Father</strong>;
    for mankind also is part of the whole.</p><p>&lt;…&gt;Of course, neither the sun,
    nor the moon, nor the heaven, nor the stars, nor water, nor ether changed their
    order; on the contrary, knowing their Creator and King — the Word — they abide
    as they were created; <strong>only</strong> <strong>men turned away from good</strong>,
    devised for themselves what does not exist instead of the truth, and transferred
    to demons and to men carved out of stones the honour due to God, and the knowledge
    of Him. Since it was unworthy of the goodness of God to leave this without care,
    while men were unable to know God, who rules and reigns over the universe, <strong>He
    rightly took as His instrument a part of the whole — the human body — and abode
    in it</strong>, so that, since they could not know Him in the whole, they might
    know Him at least in the part; and since they could not perceive His invisible
    power, they might come to comprehend it by the mind at least through what is akin
    to them; for men, because of the body of like nature and the divine works wrought
    through it, can sooner and more readily know the Father, considering that the
    works He wrought are not human but divine. And if, as the heathens say, it was
    unseemly for the Word to reveal Himself in bodily works, it would be the same
    unseemliness to know Him from the works of the universe. <strong>Just as, abiding
    in creation, the Word does not partake of anything created, but on the contrary
    contains all by His power: so, having used a body as an instrument, He partook
    of nothing bodily, but on the contrary Himself sanctified the body also</strong>.</p><p>&lt;…&gt;So,
    in accordance with the purpose, <strong>the Word of God took upon Himself a body
    and used the human instrument, both to quicken the body, and as in creation He
    is known from His works, so to act also in man</strong>, and to manifest Himself
    everywhere, leaving nothing deprived of His own Godhead and of the knowledge of
    Him</p></blockquote><p>(On the Incarnation of God the Word and of His coming to
    us in the flesh, ch. 7)</p><h3>St Basil the Great, bishop (330–379)</h3><blockquote><p><strong>God
    [appeared] in the flesh,</strong> acting no longer from a distance, as with the
    prophets, <strong><mark>but having made human nature grown together and united
    with Himself, and thus raising all humanity to Himself through His flesh that
    is akin to us.</mark></strong> But one may say, how through one Source of light
    did He come to all? <strong>Or in what way was the Godhead [present] in the flesh?
    Thus, as fire in iron: not changing its place, but imparting its power. Indeed,
    fire does not pass over to where the iron is, remaining in its former place, but
    imparts to it its own power, so that it is itself not diminished by this imparting,
    and yet wholly fills what becomes partaker of it. Thus also God the Word both
    did not depart from Himself and “dwelt among us”, underwent no change, “and the
    Word became flesh”.</strong> And heaven was not emptied of Him that contains it,
    and earth received into its bosom the Heavenly One. Do not imagine here any descent
    of the Godhead, for it is not His nature to pass from place to place, like bodies.
    And do not imagine that the Godhead changed and became flesh, for that which is
    immortal is unchangeable.</p><p>&lt;…&gt;</p><p><strong>From this it clearly follows
    that the body of the Lord came to be not according to the common natural law of
    the flesh. </strong>Indeed, He who was carried in the womb attained at once the
    perfect state of flesh, not passing through gradual development in time. The [Gospel]
    words themselves speak of this, for it is said not “conceived”, but “born”. <strong><mark>So
    this flesh, being formed from Holiness, was worthy to be joined to the Godhead
    of the Only-begotten.</mark></strong></p></blockquote><p>(Homily on the Nativity,
    2-4)</p><h2>7th century</h2><h3>St Maximus the Confessor, monk (580–662)</h3><blockquote><p>Therefore
    let us neither neglect the union, lest the Nestorian division take place, which
    served for us as the cause of alien idolatry, nor postpone the distinction, lest
    the swift Apollinarian co-heresy find a crevice, bringing into us the birth of
    a newly-invented nature. But the former [that is, the union] let us piously know
    in the identity of the <strong>one hypostasis</strong> [consisting of the divinity
    and the manhood, essentially different from each other], and the latter [that
    is, the distinction] let us confess in the difference of the natural properties
    of <strong>[the natures] united hypostatically</strong>, of which neither curtails,
    obscures, nor damages what belongs to the other</p><p>&lt;…&gt;</p><p>For being
    God by nature, having truly become man by nature, He is wholly God in truth, and
    wholly man in truth, and all [the marks] by which He is naturally perceived He
    has from both of these [natures] without diminution</p><p>&lt;…&gt;</p><p>But
    if He is truly both, as possessing without deficiency all that in which they [that
    is, both natures] are naturally contemplated, then let us understand the victory
    as it has been handed down to us, believing that the Maker of all, while His divinity
    remained unchanged, <strong>was conceived in a virginal womb</strong> as He Himself
    willed, <strong><mark>making His own the nature He assumed</mark></strong>, ineffably
    <strong><mark>becoming its hypostasis from the very conception</mark></strong>,
    after which (I mean — after the nature) He <strong>who was begotten of the Father
    before all ages was Himself born of the Mother</strong> and was a man, having
    without deficiency [what belongs to man] by nature, as He was also God. And if
    He had each by nature without deficiency (for He is perfect in both), it is clear
    that together with the natures, of which He was the hypostasis, He had also their
    essential movements, of which He was the union, as natural to Himself, joining
    them to one another unconfusedly in a manner befitting union. Without them He
    would not be known what He is, who He is, and how He is</p></blockquote><p>(Ambigua
    to Thomas, Letter 2, II)</p><h2>8th century</h2><h3>St John of Damascus, monk
    (c. 675–754)</h3><blockquote><p><strong>Chapter VII. On the one compound hypostasis
    of God the Word.</strong></p><p>So we say that <strong>the divine hypostasis of
    God the Word</strong> existed before all time and eternally — <strong>simple,
    not compound, uncreated, bodiless, invisible, untouchable, uncircumscribed, having
    all that the Father has, as being consubstantial with the Father</strong>, differing
    from the Father’s hypostasis in the manner of generation and in [personal] property,
    perfect, <strong><mark>never departing</mark> from the Father’s hypostasis</strong>.
    And in the last days <strong><mark>the Word, without departing from the Father’s
    bosom</mark></strong>, ineffably, impassibly and incomprehensibly, as He Himself
    knows, <strong><mark>dwelt in the womb of the Holy Virgin and, in His very pre-eternal
    hypostasis, took to Himself flesh from the Holy Virgin</mark></strong>.</p><p>And
    <strong><u>while He was in the womb of the Holy Mother of God, <mark>God the Word
    was</mark>, of course, also in all things and above all things, but <mark>in her</mark>
    (more particularly) <mark>by the action</mark> of the incarnation</u></strong>.
    So God the Word became incarnate, taking from the Mother of God the first-fruits
    of our composition — flesh animated by a thinking and rational soul — so that
    <strong>the very hypostasis of God the Word became the hypostasis for the flesh</strong>,
    and <strong>the hypostasis of the Word, formerly simple, became compound — compounded
    precisely of two perfect natures, the Godhead and the manhood</strong>. And this
    hypostasis has in itself, as the characteristic and distinctive property, the
    divine sonship of God the Word, whereby it is distinguished from the Father and
    the Spirit, and it has also the characteristic and distinctive properties of the
    flesh, whereby it is distinguished both from the Mother and from other men. <strong>The
    incarnate God the Word has in Himself those properties of the divine Nature whereby
    He is joined to the Father and the Spirit</strong>, and those <strong>marks of
    the human nature whereby He is joined both to the Mother and to us.</strong> And,
    finally, the incarnate Word is distinguished both from the Father and the Spirit
    and from His Mother and from us in that He — one and the same — is at once God
    and man. For this we acknowledge as the most distinctive property of the hypostasis
    of Christ.</p><p>Therefore we confess that He is the one Son of God even after
    the incarnation; He Himself is also the Son of man, the one Christ, the one Lord,
    the only only-begotten Son and Word of God, Jesus our Lord. And we venerate His
    two births: one — of the Father, pre-eternal, which is above every cause, word,
    time and nature; and the other — that which took place in the last days for our
    sake, after our likeness and above us. It is for our sake, because it is for our
    salvation; after our likeness, because God the Word became man of a Woman and
    was born in the usual time after conception; above us, because He was born not
    of seed, but of the Holy Spirit and of the Holy Virgin Mary above the law of conception.
    And we do not preach of Him either as God only, stripped of our manhood, or as
    man only, stripping Him of His Godhead, nor as God and man separately; but <strong>we
    preach that He — one and the same — is at once God and man, perfect God and perfect
    man, wholly God and wholly man, one and the same — wholly God together with His
    flesh and wholly man together with His most divine Godhead. <mark>In calling Him
    perfect God and perfect man, we express by this the fullness and the absence of
    any deficiency in the natures</mark>; <mark>in saying that He is wholly God and
    wholly man, we designate the singularity and indivisibility of the hypostasis</mark>.</strong></p><p>We
    confess also the one nature of God the Word incarnate. In saying <em>“incarnate”</em>,
    we mean the substance of the flesh, in accord with the teaching of blessed Cyril.
    Therefore the Word both became incarnate and did not lose His immateriality, and
    became incarnate in all things, and in all things <strong>remains uncircumscribed
    (unlimited). <u><mark>In the flesh He is diminished and limited, but in His Godhead
    He remains unlimited, for His flesh did not extend to the measure of the boundlessness
    of His Godhead</mark></u>.</strong></p><p>Christ <strong>wholly</strong> is perfect
    God, but not <strong>everything</strong> in Him is God; for He is not only God,
    but also man. Likewise He is perfect man, but not all in Him is man; for He is
    not only man, but also God. The word <strong><em>“everything”</em> designates
    the nature</strong>, and <strong>the word</strong> <strong><em>“wholly”</em> —
    the hypostasis</strong>, just as the word <em>other of another kind</em> points
    to the nature, and the word <em>other of the same kind</em> — to the hypostasis.</p><p>One
    must also know that <strong>although we say that <mark>the two natures of the
    Lord penetrate one another, yet we know that the penetration belongs properly
    to the divine nature, for it passes through all and penetrates as it wills, while
    nothing (passes through or penetrates) it</mark></strong>. It communicates its
    perfections to the flesh, itself remaining impassible and without part in the
    passions of the flesh. For if the sun, communicating to us its actions, itself
    does not become partaker of our properties, then much less the Creator and Lord
    of the sun.</p><p><strong>Chapter VIII. To those who inquire — to continuous or
    discrete quantity should the natures in the Lord be referred?</strong></p><p>If
    anyone asks about the natures of the Lord — to continuous or discrete quantity
    should they be referred? — we answer that <strong>the natures of the Lord are
    neither one body, nor one surface, nor one line, nor time, nor place, so that
    they could be brought under continuous quantity</strong>. For this is reckoned
    continuously. One must also know that reckoning applies only to things that differ
    from one another, and one cannot reckon things that do not differ from one another
    in any way. In whatever respect things differ from one another, in that respect
    they are reckoned. For example, Peter and Paul — since they constitute one — are
    not reckoned. Constituting one in respect of their essence, they cannot be called
    two natures; differing in respect of hypostasis, they are called two persons.
    Therefore reckoning relates to things that differ from one another; and in whatever
    respect different things differ from one another, in that respect they are reckoned.</p><p>So,
    <strong><mark>in respect of hypostasis the natures in the Lord are joined to one
    another unconfusedly</mark></strong>, while in the manner and mode of their distinction
    they are inseparably divided. And in whatever respect they are joined to one another,
    in that they are not reckoned, for it is not in respect of hypostasis that we
    say that in Christ there are two natures. But in whatever respect the natures
    are divided inseparably, in that they are reckoned, for in Christ there are two
    natures, according to the manner and mode of their distinction. <strong>Being
    joined hypostatically and having mutual penetration, they are joined unconfusedly,
    each preserving intact its natural distinction</strong>. Therefore, according
    to the mode of their distinction, and being reckoned in this one respect only,
    the natures in Christ can be brought under discrete quantity.</p><p>So, one is
    Christ, perfect God and perfect man. With the Father and the Spirit we venerate
    Him with one veneration, together with His most pure flesh. <strong>We do not
    say that the flesh is unworthy of veneration, for veneration is rendered to it
    in the one hypostasis of the Word, which became the hypostasis also for the flesh</strong>.
    We do not serve a creature, for <strong>we venerate the flesh of the Lord not
    as mere flesh, but as joined to the Godhead</strong>, and because <strong>His
    two natures are raised to one Person and one hypostasis of God the Word</strong>.
    I fear to touch a burning coal, because fire is joined to the wood. I venerate
    both natures together in Christ, because the Godhead is joined to His flesh. I
    do not add a fourth person to the Trinity — God forbid! — but I confess the one
    Person of God the Word and of His flesh. The Trinity remained the Trinity even
    after the incarnation of the Word.</p><p>&lt;…&gt; —</p><p>Indeed, after the Holy
    Virgin expressed her consent, at the word of the Lord announced by the Angel,
    the Holy Spirit came down upon her, purified her and gave her strength both to
    receive within herself the Godhead of the Word and to give birth. Then <strong><mark>overshadowed</mark>
    her, as it were with divine seed — the Son of God, the hypostatic Wisdom and Power
    of the Most High God, consubstantial with the Father — and from her immaculate
    and purest blood <mark>formed for Himself the first-fruits of our composition</mark>
    — flesh animated by a thinking and rational soul — not through impregnation by
    seed, but <mark>creatively, through the Holy Spirit</mark></strong>. The human
    form was not composed through gradual accretions, but was completed at once. <strong><mark>The
    Word of God Himself became the hypostasis for the flesh</mark></strong>. For the
    Word of God was joined not to such flesh as had previously existed personally
    by itself, but, <strong>dwelling in the womb of the Holy Virgin, it in its own
    hypostasis took to itself from the pure bloods of the Ever-virgin flesh</strong>
    animated by a thinking and rational soul. <strong><mark>Having taken to Himself
    the first-fruits of the human composition, the Word itself thus became the hypostasis
    for the flesh</mark></strong>. Consequently, <strong><mark>at the same time (as
    the flesh was formed) it was already the flesh of God the Word</mark></strong>,
    and together — flesh animated, thinking and rational. Therefore we speak not of
    a deified man, but of God made man. <strong>The Same who by nature is perfect
    God became by nature perfect man</strong>. He did not change in nature, nor did
    He become incarnate in appearance, but with the flesh taken from the Holy Virgin,
    animated by a thinking and rational soul and receiving its being in Himself, He
    <strong><mark>was joined hypostatically</mark> unconfusedly, immutably and indivisibly,
    without changing the nature of His Godhead into the substance of His flesh, nor
    the substance of His flesh into the nature of His Godhead, nor composing one compound
    nature out of His divine nature and the human nature which He took to Himself</strong>.</p><p>&lt;…&gt;</p><p>For
    <strong><mark>the very hypostasis of God the Word became the hypostasis for the
    flesh</mark></strong>, and <strong>in this sense the Word <em>became flesh</em></strong>
    (John 1:14) — understood without transformation; and the flesh became the Word
    — without change; and God (became) man, for the Word is God, and man — God, by
    reason of the hypostatic union. So it is one and the same thing to say “the [human]
    nature of the Word” and “the nature of the Word in the indivisible”. For this
    expression in its proper and exclusive sense denotes neither an individual, that
    is, a person, nor a collection of persons, but — the common nature, contemplated
    and known in one of the persons.</p><p>Indeed, one thing is union, and another
    — incarnation. Union properly denotes only a joining, but it does not yet show
    with what this joining took place. Incarnation, or — what is the same — the becoming
    man, denotes the joining with flesh or — with man, just as the glowing of iron
    denotes its union with fire.</p><p>&lt;…&gt;</p><p><em>And that God became man,
    and man — God, is said, for the Word, being God, became man without change.</em>
    <strong><mark>But that the Godhead became man, or was made flesh, or became man
    — we have never heard. But that the Godhead was joined to the manhood in one of
    its hypostases — we have been taught</mark></strong>; that God takes a form, that
    is, a substance alien to Himself, namely one corresponding to ours — (this) is
    (truly) said. For the name God is joined to each of the hypostases, but of the
    hypostasis we cannot say “Godhead”. For we have not heard that the Father alone,
    or the Son alone, or the Holy Spirit alone is the Godhead, for the word “Godhead”
    designates the nature, while the word “Father” (designates) the hypostasis — just
    as the word “manhood” (designates) the nature, and (the name) Peter — the hypostasis.
    The word “God”, however, denotes both the commonality of the nature, and is used
    equally in respect of each hypostasis — just like the word “man”. He who has the
    divine nature is God, and (he who has) the human — man.</p><p>Beyond all this,
    one must know that the Father and the Holy Spirit took no part in the incarnation
    of the Word in any other respect than in respect of the divine signs, and by good
    pleasure and will.</p><p>&lt;…&gt;</p><p>We say that God was born of her not in
    the sense that the Godhead of the Word received its beginning from her, but in
    the sense that the Word of God Himself, begotten of the Father before the ages,
    timelessly, without beginning and eternally abiding with the Father and the Spirit,
    <em>in</em> <em>the last days</em> (Heb. 1:2) for our salvation <strong>dwelt
    in the womb of the Holy Virgin and of her, without change, became incarnate and
    was born</strong>. For the Holy Virgin bore not a mere man, but the true God —
    not mere God, but God incarnate — not bringing a body from heaven and passing
    through her as through a channel, but <strong><mark>having taken from her flesh
    consubstantial with us and having received it into His own hypostasis</mark></strong>.</p><p>&lt;…&gt;</p><p>The
    Only-begotten Son of God and God is He who came forth from the Virgin as man,
    and it is precisely the One born of the Virgin who is the Son of God and God.
    He was born in a bodily manner, since He became man, not dwelling in a man previously
    created, as it were in a prophet, but <strong><mark>Himself substantially and
    truly becoming man, that is, giving being in His hypostasis to flesh</mark></strong>
    animated by a rational and understanding soul, and <strong><mark>Himself becoming
    its hypostasis</mark></strong>. For this is what the expression <em>born of a
    woman</em> means. How then would the Word of God itself have come under the law,
    if it had not become a man consubstantial with us?</p><p>&lt;…&gt;</p><p>If the
    One born of a woman is God, then, evidently, one and the same is He who is born
    of God the Father in respect of the divine and beginningless essence, and in the
    last times born of the Virgin in respect of that essence which received its beginning
    and is subject to time, that is, in respect of the [nature] human. This denotes
    the one hypostasis and the two natures, and the two births of our Lord Jesus Christ.</p><p>&lt;…&gt;</p><p>For
    <strong><mark>the Word itself became flesh, while it was carried in the womb by
    the Virgin</mark>, (and came forth from her) God together with the assumed human
    nature</strong>, since it too was <strong>deified by the Word simultaneously with
    its being brought into being, so that three events took place simultaneously:
    the assumption, the being, and the deification of the manhood by the Word</strong>.
    And thus the Holy Virgin is conceived of and called the Mother of God not only
    in respect of the [divine] nature of the Word, but also on account of the deification
    of the human nature, whose assumption and being alike were wrought marvelously
    at the same time: <strong>the assumption, of course, by the Word, and the being
    — of the flesh in the Word Himself</strong>.</p></blockquote><p>(An Exact Exposition
    of the Orthodox Faith)</p><blockquote><p>109. An essence has as many hypostases
    as participate in it. For as many lamps as can be lit from one, so many hypostases
    of fire will be created. Consequently, <strong>if, according to our opponents,
    the divine essence is accessible to participation (and it is accessible to all),
    then it is not Tri-hypostatic, but has an infinite multitude of hypostases</strong>.
    And who, brought up in the divine dogmas, does not know that this coincides with
    the Messalian nonsense? <strong>For according to the Messalians, those who have
    attained the summits of virtue become partakers of the divine essence</strong>.
    But <strong>the followers of Akindynos, seeking to surpass this blasphemy, assert
    that not only men outstanding in virtue, but all [existing things] whatsoever
    participate in the divine essence, using as a pretext the fact that it is present
    everywhere</strong>. Yet the mighty in theology <strong><mark>Gregory, long before
    this refuting the opinions both of these and of those [ancient heretics], says:
    “[The Lord is] ‘Christ’ in respect of His Godhead; for the anointing itself sanctifies
    His manhood not by its action, as in other anointed ones, but by the whole presence
    of the Anointer”</mark></strong>. And [all] the God-wise fathers expressed the
    common opinion that <strong>the Godhead indwells [only] in those [men] who have
    been purified as they ought</strong>, <strong><mark>but [it does not indwell simply]
    in virtue of [its] nature</mark></strong>. Therefore <strong>one does not become
    a partaker of God by essence or by hypostasis</strong>, for neither any essence
    nor any hypostasis is divided, nor are they in any way transmitted to anyone.
    Therefore <strong><mark>God is utterly incomprehensible to all, though He is present
    everywhere</mark></strong> in other respects. <strong><mark>The common power and
    energy of the Tri-hypostatic Godhead, divided in various ways and proportionately
    among those who participate, is capable of being contained in those who have been
    graced</mark></strong>. For <strong><mark>the Holy Spirit, according to Basil
    the Great, “is communicated not by one measure to the worthy, but divides the
    [divine] energy proportionately to faith. He is simple in essence, but manifold
    in powers”</mark></strong>.</p><p>110. <strong>When participation is spoken of,
    this [means that the partaker] has a part of that which is participated in</strong>,
    for if [he] participates not in a part but in the whole, then one would speak
    not of participation but of possession. But that which is participated in is divisible,
    and therefore the participant necessarily participates in a part. Yet <strong><mark>the
    divine essence is utterly indivisible, and therefore utterly inaccessible to participation</mark></strong>.
    <strong>On the contrary, that <mark>the divine energy is divided, the golden-mouthed
    Father said repeatedly in his writings. It is that of which those deemed worthy
    of the deifying grace are partakers</mark></strong>. Hear again the mouth of gold,
    clearly teaching concerning both — namely that <strong><mark>that which is participated
    in is not the essence but the energy</mark></strong> — and also that <strong>the
    [energy] undividedly divided is identical with the [energy] participated in, but
    <mark>is not identical with the essence, inaccessible to participation</mark>,
    from which the divine energy proceeds</strong>. In addition to the gospel words:
    “of <strong>His fullness</strong> have all we received” (John 1:16), he says:
    “For if we speak of fire, where the essence is divisible and is a body, and we
    divide this [body] and do not divide it, how much more <strong>[is this true of]
    the energy</strong>, and of an energy [proceeding] from an incorporal essence”.</p><p>111.
    Further, that which participates by essence must necessarily possess a common
    essence with that which is participated in, and be in some respect the same. But
    <strong>has anyone ever heard that there is anything one in essence between God
    and us</strong>? Of this <strong>Basil the Great speaks: “<mark>Though the operations
    of God descend to us, His essence remains inaccessible</mark>”</strong>. And the
    divine <strong>Maximus declares: “<mark>All that God is, by grace the deified
    [man] will be too, except identity in essence</mark>”</strong>. Therefore <strong><mark>it
    is impossible even for those deified by the grace of God to participate in the
    divine essence, but they can be partakers of the divine energy</mark></strong>.
    “For the tempered light of truth here serves me to behold and endure the brightness
    of God”, says Gregory the Theologian. And according to the prophet-psalmist, “the
    brightness of our God is upon us”. Also: <strong>“There is one energy of God and
    of the saints”, Maximus writes clearly</strong>, who [himself] was numbered among
    the [ranks of] the saints. [He says further] that these saints are “living icons
    of Christ and are <strong>one with Him by grace</strong> or by likeness”.</p><p>112.
    God is the Same in Himself, for the three divine Hypostases relate to one another
    naturally, wholly, eternally and inseparably, and also unconfusedly and without
    blending, penetrating one another, since They have one energy. For among kindred
    [beings there is much] likeness, but <strong>each hypostasis acts by itself, so
    that each has its own energy. Not so with those three divine and worshipped Hypostases.
    For here the energy is truly one and the same, and one is the movement of the
    divine will</strong>, beginning from the First Cause, [that is,] the Father, passing
    through the Son and made manifest in the Holy Spirit. This is evident from [Their]
    products, since in them every natural energy is made known. Thus, for example,
    swallows weave their nests in different ways, and pages written by different scribes
    differ one from another, though the letters in them are the same. In like manner
    [differ] the products of the Father, and of the Son, and of the Holy Spirit, when
    considered [as produced] by each Hypostasis, though all creation is the [common]
    work of the three [Hypostases]. And <strong>we have been taught by the [holy]
    fathers to understand the same divine energy as belonging to the three worshipped
    Persons, but not to conceive of it as something like and belonging to each [Person]</strong>.</p><p>&lt;…&gt;
    —-</p><p><strong><u><mark>Predicates, states, places, times and [all] suchlike
    are spoken of God not in the proper sense of the word, but metaphorically</mark></u></strong>.
    But creation and operation, in the most proper sense of the word, can be predicated
    only of the one God. For God alone creates, but <strong>He does not become nor
    undergo [anything], insofar as this concerns His <mark>essence</mark></strong>;
    He alone creates every [existing thing] in all ways, and He alone <strong><mark>creates
    [all things] from utter non-being, possessing almighty energy</mark>; in accordance
    with this energy [something is] predicated of Him in relation to creation [and
    in accordance with it] He has the capacity [to act]</strong>. For <strong><mark>in
    His nature [God] cannot undergo anything</mark></strong>, but He can add something
    to [His] creatures if He wills. For the capacity to undergo, to have and to attach
    something in essence is characteristic of weakness. But <strong>the capacity to
    create, to possess [His] creatures and to attach [something] to them when He wills
    is characteristic of the godlike and all-sovereign <mark>Power</mark></strong>.</p><p>134.
    Whereas all existing things (including those contemplated as following after essence)
    are reduced to ten categories: <strong>essence, quantity, quality, relation, <mark>“where”,
    “when”</mark>, action, passion, possession</strong> and <strong>position</strong>,
    God is the super-essential essence, in which [only] relation and operation are
    contemplated, and they <strong>produce in this [super-essential essence] no complexity
    and <mark>no change</mark></strong>. For God creates all things, Himself undergoing
    nothing in [His] essence. He is Creator, Origin and Master in relation to creation,
    since it began and begins [in Him] and serves [Him]. But He is also our Father,
    regenerating us by grace. At the same time He is <strong>Father</strong> in relation
    to the Son, who in no wise began [to be] in time, and the <strong>Son</strong>
    [is Son] in relation to the Father; and the <strong>Spirit</strong> is the One
    brought forth, He is coeternal with the Father and the Son, <strong><mark>belonging
    to the same essence</mark></strong>. And those who say that God is only an essence
    in which nothing else is observed represent God as not [possessing the capacity]
    to create, to act and to relate to anything. And if they consider that God has
    not [all] this, then He is not an agent, not a Maker, and does not possess energy.
    [In that case] He is also neither Origin, nor Maker, nor Master, nor our Father
    by grace. For how could He be [all] this if He did not have in Himself <strong>relation</strong>
    and <strong>operation</strong>, contemplated in His essence? And if no <strong>relation</strong>
    is observed in the essence of God, then the Tri-hypostaticness of the Godhead
    is thereby denied. And he who is not Tri-hypostatic is neither the Master of all,
    nor God. Therefore those who think in agreement with Barlaam and Akindynos [are
    in fact] ungodly men.</p><p>&lt;…&gt;</p><p>Can every one of the hypostatic properties,
    or each of the Hypostases, which are neither essence nor accident, be [on this
    ground] classed as altogether non-existent? By no means! In like manner the divine
    energy, being neither the essence of God nor an accident of God, does not belong
    to the non-existent.</p><p>&lt;…&gt;</p><p>Therefore <strong>God possesses both
    that which is essence and that which is not essence; this is the divine will and
    the divine energy</strong>, even if they could be called an accident as well.</p><p>136.
    If the essence does not possess an energy distinct from the essence itself, this
    means that such an essence will utterly have no independent hypostatic being and
    [is] only a mental conception. For the so-called “man in general” does not think,
    does not reason, does not see, does not smell, does not speak, does not hear,
    does not eat and, to put it simply, does not possess an energy distinct from the
    essence and manifesting that [this man] exists in hypostasis. Therefore “man in
    general” has no independent hypostatic being. But a man possessing an innate energy
    which differs from the essence — whether one [energy], or many [energies], or
    all of those [energies] in question — is known through these energies as existing
    in hypostasis and not deprived of independent hypostatic being. And since such
    energies are not one, not two and not three, but are contemplated in many [men],
    this makes manifest that man exists in innumerable hypostases.</p><p>137. God,
    according to the pious teaching of His Church, which [became] ours through His
    grace, possesses an innate energy manifesting Him and therefore distinct from
    His essence (for He has foreknowledge of the lower [beings] and provides for them,
    creates them, keeps them, rules over them and remakes them according to His will
    as He knows). Thereby He manifests that He is existing in hypostasis, and is not
    only an essence deprived of independent hypostatic being. And since <strong>all
    such energies are contemplated not in one but in three Persons, God is known by
    us as Him who is one essence in three Hypostases</strong>. But the followers of
    Akindynos, who say that God does not possess an innate energy manifesting Him
    and therefore distinct from His essence, [thereby] assert that He does not exist
    in hypostasis and make the Tri-hypostatic Lord deprived of independent hypostatic
    being.</p><p>138. <strong><mark>The one energy of the three divine Hypostases
    is one not only in the sense of likeness, as happens with us, but also in the
    sense of number</mark></strong>. Those who think in accord with Akindynos cannot
    assert this, since they do not admit that there is a common uncreated energy of
    the three [Hypostases], but, not admitting a common divine energy, say that the
    Hypostases are energies of one another. Therefore they cannot speak of one energy
    of the three [Hypostases], but, denying now one, now another, make the Tri-hypostatic
    God deprived of independent being.</p><p>139. Those sick in soul with the falsehood
    of Akindynos, who assert that the energy distinct from the divine essence is created,
    hold the opinion that God also possesses the capacity of creation in a created
    manner, that is, that He possesses a created creative power. For <strong><mark>to
    act and to create is impossible without energy, just as to exist is impossible
    without existence</mark></strong>. Therefore it is impossible for him who asserts
    that the existence of God is created to consider His being uncreated. In like
    manner it is impossible for him who asserts that the energy of God is created
    to suppose that He acts and creates in an uncreated manner.</p><p>140. Those who
    think piously [in the spirit of the ecclesiastical Tradition hold] that the energy
    of God neither is nor is called [like] the creatures of God, as the followers
    of Akindynos vainly prattle (far be such impiety!), but [hold] that <strong><mark>creatures
    are the products of the divine energy</mark></strong>. For if the energy [is related
    to] creatures, or these creatures [are] uncreated (what madness!), as created
    before or prior to [other] creatures (what impiety!), then [it follows that] God
    has no energy. But [it is known that He] is from eternity an agent and almighty;
    therefore <strong><mark>not the energy of God, but its products and actualizations,
    whatever they may be called, are creatures</mark></strong>. And <strong>the energy
    of God, according to [our] theologians, is uncreated and coeternal with God</strong>.</p><p>141.
    It is not the energy that is known from the essence, but the essence from the
    energy; moreover, only the being is known, not what it is. Therefore, according
    to [ecclesiastical] theologians, the being of God too is known not from [His]
    essence, but from the [divine] Providence. Accordingly the energy differs from
    the essence, because <strong><mark>the energy is that which makes known, while
    that whose being is made known by means of it is the essence</mark></strong>.
    But the defenders of the impiety of Akindynos, diligent in inspiring the conviction
    that the divine energy differs in nothing from the divine essence, strive also
    to persuade us (denying that which makes [God] known) that we do not know of the
    being of God, just as they themselves are utterly ignorant [of it].</p><p>143.
    Basil the Great, discoursing on God in his “Syllogistic Chapters”, says: “The
    energy is neither the agent nor that which is produced by the action; thus the
    energy is not [something] undistinct from the essence”. And the divine Cyril,
    also discoursing on God, theologizes: “<strong><mark>To create is proper to the
    energy, but to beget — to the nature; nature and energy are not the same thing</mark></strong>”.
    And the God-bearing Damascene [declares]: “<strong><mark>Generation is the work
    of the divine nature, but creation — the work of the divine will</mark></strong>”.
    And in another place he says clearly: “<strong>One thing is the operation and
    another — the agent. The operation is the essential movement of the nature, while
    the agent is the nature from which [this] operation proceeds</strong>”. Consequently
    the energy, according to the God-seeing fathers, differs in manifold ways from
    the divine essence.</p><p>144. <strong><mark>The essence of God</mark> is utterly
    without name, since it is <mark>wholly incomprehensible</mark></strong>. Therefore
    it is named from all its energies, and none of the names differs from another
    in meaning. For by each [of these names] and by all [of them together] nothing
    else is signified but “That Hidden One”, and <strong><mark>to know what it is
    is utterly impossible</mark></strong>. But in respect of each of the names of
    the energies a difference of meanings is observed. For who does not know that
    creation, dominion, judgment, providence and <strong>the adoption of us by God
    through His grace</strong> differ from one another? &lt;…&gt;</p><p>145. Since
    <strong><u><mark>the essence of God</mark></u></strong>, according to [our] theologians,
    is utterly without name, as surpassing every name, therefore, according to these
    same theologians, it <strong><u><mark>is also unparticipated, as surpassing [every]
    participation</mark></u></strong>. Therefore those who now do not submit to the
    teaching of the Spirit, [granted] through our holy fathers, rebuke us who are
    in agreement with these holy fathers, saying that if the divine energy differs
    from the divine essence, then either there will be many gods, or the one [God]
    will become compound (even if something is wholly contemplated in the divine essence).
    For they do not know that not operation and not energy, but undergoing and passion
    produce composition. <strong><mark>But God acts, Himself undergoing nothing and
    not changing</mark>, and because of this He will not be compound by reason of
    [His] energy</strong>. God [is also in a certain sense] relation, relating Himself
    to creation as its Origin and Master, but because of this He is by no means classed
    among creatures. And again — because of God’s possession of energy, why should
    there be many gods, if this energy belongs to the one God and, moreover, if the
    divine essence and the divine energy [both] are the Same God? It is clear that
    [such reproaches] are nonsense, [begotten] of their mental derangement.</p><p>&lt;…&gt;</p><p><strong>149</strong>.
    And on another occasion, scheming to conceal their evil opinion in this matter,
    they assert that the Light which shone on Tabor is uncreated, but that it is the
    essence of God. [In asserting this] they utter still more terrible blasphemies.
    For <strong>if that Light was visible to the Apostles, then, according to their
    evil opinion, the essence of God is likewise accessible to [bodily] vision</strong>.
    But let them hear Him who speaks: <strong>no one was in “the essence of ‘the Lord’”
    (Jer. 23:18), and no one has seen and told the nature of God — and not only no
    one of men, but no one of the Angels either</strong>. For even the six-winged
    Cherubim cover their faces because of the superabundance of the radiance sent
    forth from there. And since <strong>the superessentiality of God has never been
    seen by anyone</strong>, the Akindynians, who say that it is that Light, [contrary
    to themselves] bear witness to the utter inaccessibility of the vision of that
    Light. And even the chosen among the Apostles were not vouchsafed the vision of
    it on the mountain, and consequently the promise of the Lord concerning this is
    not true. Then it is falsely declared by him who says: “we beheld His glory… while
    we were with Him on the holy mount”; and “Peter and they that were with him…,
    waking, saw His glory” (John 1:14; 2 Pet. 1:18; Luke 9:32). And another [writer]
    says that John, especially beloved of Christ, “saw on the mountain the very naked
    Godhead of the Word”. Therefore [the chosen disciples of the Lord] saw, and saw
    verily, that uncreated and divine Radiance, while [God Himself] remained unseen
    in [His] superessential Hiddenness</p></blockquote><p>(150 Chapters)</p><h2>14th
    century</h2><h3>St Gregory Palamas, bishop (c. 1296–1357)</h3><blockquote><p>So
    <strong><mark>the deifying gift of the Spirit is not the super-essential divine
    essence, but the deifying energy of the super-essential divine essence</mark></strong>,
    and even <strong>not all of it, though it is in itself indivisible. For what of
    things created is able to contain <mark>all</mark> the boundless <mark>power of
    the Spirit</mark>, except the One conceived in a virginal womb</strong> at the
    descent of the Holy Spirit and under the overshadowing of the power of the Most
    High (Luke 1:35)? <strong>Therefore He contained “all the fullness of the Godhead”</strong>
    (Col. 2:9); “and of His fullness we all have received” (John 1:16). And so the
    essence of God is everywhere, for, as Scripture says, “the Spirit fills… all”
    (Wis. 1:7) in its essence; everywhere too is the deification, ineffably inherent
    in that essence and inseparable from it as its natural power. But as fire is invisible
    if there is no matter or sensible substrate to receive its light-bearing energy.</p><p>&lt;…&gt;</p><p>Indeed,
    if Macarius the Great, instructed by the action of grace, teaches us too that
    the mind and all the thoughts of the soul are enclosed in the heart as in its
    organ, while the Nyssan — that the mind, since it is bodiless, is not within the
    body — then we, bringing this apparent difference to unity and showing the absence
    of contradiction, say that although <strong><mark>the mind</mark>, in accord with
    Gregory of Nyssa, is <mark>not within the body in the sense that it is bodiless</mark></strong>,
    but at the same time, in accord with holy Macarius, <strong>it is <mark>in the
    body</mark>, and not outside the body, <mark>in the sense that it is bound to
    the body</mark></strong> and ineffably governs the first bodily organ, the heart.
    Since one saint places it outside the body not in the sense in which the other
    places it inside the body, there is no divergence between them: for <strong>he
    who says that <mark>the divine is not spatial, since it is bodiless</mark>, does
    not contradict him who says that <mark>the Word of God once entered within</mark>
    the virginal and all-immaculate womb</strong>, having, by ineffable love for mankind,
    inconceivably <strong><mark>joined Himself</mark> in it to our bodily composition</strong>.</p></blockquote><p>(The
    Triads in defence of the holy hesychasts)</p><blockquote><p>One should therefore
    fix [one’s attention] on the fact that He did not say [with the definite article]
    that “the words that I… speak, they are spirit and they are life”, but without
    the article, showing that <strong><mark>they are not the hypostasis of the Holy
    Spirit, but are filled with the energy of the divine Spirit, and the life-giving
    energy of the Spirit</mark><mark> </mark></strong><strong><mark>is imparted through
    them</mark></strong>.</p></blockquote><p>(On the Procession of the Holy Spirit)</p><blockquote><p>48.
    If the successors of this Barlaam again insist that only the Son or the Holy Spirit
    is the grace ever-existing from God, for the sake of which the wise in divine
    things Maximus called uncreated both those who, after Christ, had Him in themselves,
    according to Paul’s word, dwelling and abiding (Gal. 2:20), then how does the
    Son Himself in the Gospels promise to those who love Him and are loved by Him
    together with the Father that He will “<strong>come to them and make His abode
    with them</strong>” (John 14:23)? <strong>Nevertheless, <mark>even if we suppose
    that only the Son will dwell in us, yet since this indwelling is a participation</mark>
    — for <mark>He who fills all things by essence does not dwell in the saints in
    the same way as He is </mark><u><mark>everywhere</mark></u> — while <mark>the
    essence of the Son is unparticipated, it remains [to acknowledge] that </mark><u><mark>the
    grace will nevertheless be participated, that is, the deifying energy</mark></u></strong>.
    And this it was that the saint called divine and uncreated and ever-existing from
    the Ever-existing.</p><p>49. But what else can “the coming of Him who is everywhere”
    be, if not the manifestation of Him who mysteriously Reveals Himself to the worthy?
    For the omnipresent power does not come from somewhere, nor does it abide somewhere
    where it was not. But His coming to us and His indwelling (John 14:23) is our
    ascent to Him through revelation. <strong><mark>And what is it that reveals itself
    and appears? The essence of God? By no means</mark>. Therefore <mark>the grace</mark>
    is <mark>the energy of the Spirit</mark>, <mark>through which God appears and
    dwells in the worthy</mark></strong>. Therefore <strong>the grace of God can periphrastically
    be named the God worshipped in three hypostases</strong>, but not when it is added
    that its being is from God. And <strong>nothing hinders the grace of the Son from
    being periphrastically called the Son, and the grace of the Spirit — the Spirit</strong>.
    Since the most theological of the Gregories, in his letter to Evagrius, says that
    there has been sent to us from the Father “a certain double (διρρυτος) noetic
    grace of the Son and the Spirit”. For, as he himself says a little above, “this
    twofold (διδυμος) ray of the Father brings down to us also the light of truth,
    and remains joined with the Father”, for their gifts to us are common to Them.
    But to call the Son or the Holy Spirit a grace from God is not proper for those
    who worship Each of Them in a distinct hypostasis.</p></blockquote><p>(On the
    Divine energies and their participation)</p><h2>19th century</h2><h3>St Ignatius
    (Brianchaninov), bishop (1807–1867)</h3><blockquote><p><strong>The Pre-eternal
    Word — the Son of God — <mark>by the power</mark> of His creativity composed for
    Himself flesh in the womb of the Virgin: the God-man was conceived and the God-man
    was born</strong>. The Son by the divine nature became a son also by the human
    nature. Jesus Christ was born of the Virgin, <strong><mark>one Person</mark> in
    two undivided and unconfused natures — the divine and the human</strong>. The
    divine nature, despite its <strong>boundlessness</strong>, did not destroy the
    human nature, and the human nature, despite its unconfused existence, in no way
    <strong>constrained the boundlessness of the divine nature</strong>. Such a wondrous
    union, received by faith and the spiritual reason born of it, incomprehensible
    for the reason that is fleshly and soulish, was wrought by the omnipotence of
    the Godhead.</p><p>&lt;…&gt;</p><p>By the inseparability of the natures, in every
    case when the human nature was manifested as if acting exclusively, the divine
    nature assisted it indivisibly and inseparably, though unconfusedly, acting according
    to itself. Thus, although a man was conceived in the womb of the Virgin, he was
    already God at the very conception; although a man was born of the Virgin, God
    was born together with him; he grew, tasted food, was wearied by the way, was
    bound in the garden of Gethsemane, struck on the cheeks, struck on the head with
    a reed, crowned with thorns, crucified as man, but together as God. Thus the apostles
    were witnesses, disciples, envoys of God (Luke 1:2); Judas Iscariot betrayed God;
    the Jewish chief priests and Pilate are deicides; the Ever-virgin is the Mother
    of God. <strong>By the inseparability of the natures <mark>in one Person</mark>
    that which took place with respect to one nature inevitably pertained also to
    the other.</strong></p><p>&lt;…&gt;</p><p><strong>the Word of God for the reception
    of the manhood</strong> <strong><mark>replaced</mark></strong><mark> </mark><strong><mark>the
    action</mark> of the male seed with the creative <mark>power of God</mark></strong>.
    “The Son of God”, says St John of Damascus, “<strong>from the most pure and virginal
    bloods formed for Himself the first-fruits of our nature, flesh animated by a
    rational and understanding soul, but <mark>formed it not from seed, but creatively</mark></strong>”.
    For a worthy conception the Virgin was prepared too.</p></blockquote><p>(Ascetic
    Homilies, Exposition of the Orthodox Church’s teaching on the Mother of God)</p>'
