      <h2>Briefly About the Toll Houses</h2><p><a href="https://azbyka.ru/mytarstva">The toll houses</a> (in Russian) are the teaching of the Orthodox Church that after a person’s death the fallen angels try to take possession of his soul. Thus the soul undergoes terrible trials, in which the angels of God strive to protect righteous souls and lead them to God. This teaching is expressed symbolically, figuratively, as certain stations, at each of which the soul is tested for one or another passion. The angels in this case are instruments of the accomplishment of God’s justice.</p><h2>To Withstand the Spiritual Hosts of Wickedness in the Evil Day, Having Done All</h2><p>The devil is the prince of the power of the air:</p><blockquote><p>“And you He made alive, who were dead in trespasses and sins, in which you once walked according to the course of this world, according to <strong><mark>the prince of the power of the air</mark></strong>, the spirit who now works in the sons of disobedience” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L1-2">Eph. 2:1-2</a>)</p></blockquote><p>One must prepare in order to overcome everything in the evil day (the day of death):</p><blockquote><p>“<strong><mark>Put on the whole armor of God, that you may be able to stand against the wiles of the devil</mark></strong>. For we do not wrestle against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this age, <strong><mark>against spiritual hosts of wickedness in the heavenly places</mark></strong>. Therefore take up the whole armor of God, that you may be able <strong><mark>to withstand in the evil day</mark></strong>, and <strong><mark>having done all, to stand</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L11-13">Eph. 6:11-13</a>)</p></blockquote><h2>Without God’s Permission the Devil Cannot Touch the Righteous, and Seeks How to Obtain Permission to Take Possession of Them</h2><p>The devil seeks how to accuse or slander a person in order to take possession of him:</p><blockquote><p>“So Satan answered the LORD and said, ‘Skin for skin! Yes, all that a man has he will give for his life. But stretch out Your hand now, and touch his bone and his flesh, and he will surely curse You to Your face!’ And the LORD said to Satan, ‘<strong><mark>Behold, he is in your hand, but spare his life</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/iov/2/#L4-6">Job. 2:4-6</a>) <em>(Greek: μόνον τὴν ψυχὴν αὐτοῦ διαφύλαξον — “only guard his soul”; Hebrew: נַפְשׁוֹ — “his soul”)</em></p></blockquote><blockquote><p>“Yet Michael the archangel, in contending with the devil, when he <strong><mark>disputed about the body of Moses</mark></strong>, dared not bring against him a reviling accusation, but said, ‘The Lord rebuke you!’” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L9">Jude. 1:9</a>)</p></blockquote><h2>The Devil Always Seeks Whom to Devour</h2><blockquote><p>“Be sober, be vigilant; because <strong>your adversary the devil walks about like a roaring lion, seeking whom he may devour</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L8">1 Pet. 5:8</a>)</p></blockquote><h2>Angels Are Sent to Minister to Those Who Will Inherit Salvation</h2><blockquote><p>“But to which of the angels has He ever said: ‘Sit at My right hand…’ &lt;…&gt; <strong>Are they not all ministering spirits sent forth to minister for those who will inherit salvation?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13-14">Heb. 1:13-14</a>)</p></blockquote><h2>Angels “Carry” the Souls of the Righteous After Death</h2><p>Souls, after separation from the body, move. Souls have to traverse a path to the place of their future abode.</p><p>The angels took care of the soul of righteous Lazarus, but this is not said of the rich man:</p><blockquote><p>“There was a certain rich man who was clothed in purple and fine linen and fared sumptuously every day. But there was a certain beggar named Lazarus, full of sores, who was laid at his gate, desiring to be fed with the crumbs which fell from the rich man’s table. Moreover the dogs came and licked his sores. So it was that <strong><mark>the beggar died, and was carried by the angels</mark></strong> to Abraham’s bosom. <strong>The rich man also died and was buried</strong>. And <strong>being in torments in Hades</strong>, he lifted up his eyes and saw Abraham afar off, and Lazarus in his bosom. Then he cried and said, ‘Father Abraham, have mercy on me, and send Lazarus that he may dip the tip of his finger in water and cool my tongue; for I am tormented in this flame.’ But Abraham said, ‘Son, remember that <strong>in your lifetime you received your good things, and likewise Lazarus evil things; but now he is comforted and you are tormented</strong>. And besides all this, between us and you there is a great gulf fixed, so that those who want to pass from here to you cannot, nor can those from there pass to us’” (<a href="https://bibleox.com/en/eng-nkjv/lk/16/#L19-26">Luke. 16:19-26</a>)</p></blockquote><p>Sinful souls are taken suddenly:</p><blockquote><p>“And I will say to my soul, “Soul, you have many goods laid up for many years; take your ease; eat, drink, and be merry.”’ But God said to him, ‘<strong><mark>Fool! This night your soul will be required of you</mark></strong>; then whose will those things be which you have provided?’ <strong>So is he who lays up treasure for himself, and is not rich toward God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L19-21">Luke. 12:19-21</a>)</p></blockquote><h2>In the Hour of Death the Devil Comes to Christ, but Has Nothing to Accuse Christ Of</h2><p>The day before His death Christ speaks of the approach of the devil, who has nothing of his own in Christ, and cannot accuse Him of sins:</p><blockquote><p>“I will no longer talk much with you, for <strong><mark>the ruler of this world is coming, and he has nothing in Me</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L30">John. 14:30</a>)</p></blockquote><p>But with other people it is not so:</p><blockquote><p>“<strong><mark>He who sins is of the devil</mark></strong>, for the devil has sinned from the beginning” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L8">1 John. 3:8</a>)</p></blockquote><h2>Christ Ascended into Heaven Through the Air on a Cloud</h2><blockquote><p>“Now when He had spoken these things, <strong><mark>while they watched, He was taken up, and a cloud received Him out of their sight</mark></strong>. And while they looked steadfastly toward heaven <strong><mark>as He went up</mark></strong>, behold, two men stood by them in white apparel” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L9-10">Act. 1:9-10</a>)</p></blockquote><h2>In the Same Way Christ Will Come Again</h2><blockquote><p>“For our citizenship is in heaven, <strong><mark>from which we also eagerly wait for the Savior</mark></strong>, the Lord Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/fil/3/#L20">Phil. 3:20</a>)</p></blockquote><blockquote><p>“who also said, ‘Men of Galilee, why do you stand gazing up into heaven? This same Jesus, <strong><mark>who was taken up from you into heaven, will so come in like manner as you saw Him go into heaven</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L11">Act. 1:11</a>)</p></blockquote>

  - src: ад
    path: Hl3d_Hell
    title: Hell
    meta_desc: Hell, Gehenna, the Lake of Fire, Everlasting Fire, Outer Darkness, Prison. Most often these words in Scripture mean a place of torment. This place may be called by different words, but this does not change its essence; it remains a place of torment.
    menu: { parent: Man/Afterlife, title: Hell, priority: 3 }
    body: |-
      <h2>Definition</h2><p>Hell can be understood in different ways.</p><ol><li><p>Hell (Hades) — as the place where the souls of the dead abide until the general resurrection and the Last Judgment.</p></li><li><p>Hell — as the place where the resurrected condemned sinners (that is, their souls and bodies together) abide, after the glorious second coming of Christ, the General Resurrection and the Last Judgment. It will no longer be possible to change this lot after the Last Judgment. Both the sufferings of the condemned and the blessedness of the righteous will last equally forever.</p></li></ol><h2>Hell, Gehenna, the Lake of Fire, Everlasting Fire, Outer Darkness, Prison — a Place of Torment</h2><p>Most often hell in Scripture means a place of torment. This place may be called by different words, but this does not change its essence; it remains a place of torment. In hell people are tormented:</p><blockquote><p>“<strong>will be cast out into outer darkness</strong>. There will be weeping and gnashing of teeth” (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L12">Matt. 8:12</a>)</p></blockquote><blockquote><p>“Bind him hand and foot, <strong>take him away, and cast him into outer darkness; there will be weeping and gnashing of teeth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/22/#L13">Matt. 22:13</a>)</p></blockquote><blockquote><p>“And <strong>cast the unprofitable servant into the outer darkness. There will be weeping and gnashing of teeth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L30">Matt. 25:30</a>)</p></blockquote><p>Christ Himself, as the Judge, decides who goes where:</p><blockquote><p>“Then He will also say to those on the left hand, ‘<strong>Depart from Me, you cursed, into the everlasting fire prepared for the devil and his angels</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L41">Matt. 25:41</a>)</p></blockquote><blockquote><p>“But beware of men, for they will deliver you up to councils and scourge you in their synagogues... And do not fear those who kill the body but cannot kill the soul. But <strong>rather fear Him who is able to destroy both soul and body in hell</strong>... But whoever denies Me before men, <strong>him I will also deny</strong> before My Father who is in heaven. Do not think that I came to bring peace on earth. I did not come to bring peace but a sword. ... And <strong>he who does not take his cross and follow after Me is not worthy of Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L17,28,33-34,38">Matt. 10:17,28,33-34,38</a>)</p></blockquote><p>A person after death goes to a new home. And this event is worthy of weeping:</p><blockquote><p>“For man goes to <strong>his eternal home</strong>, and the mourners go about the streets” (<a href="https://bibleox.com/en/eng-nkjv/ekl/12/#L5">Eccl. 12:5</a>)</p></blockquote><p>After death judgment awaits a person:</p><blockquote><p>“And as it is appointed for men <strong>to die once, but after this the judgment</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/9/#L27">Heb. 9:27</a>)</p></blockquote><p>In hell there is a conscious existence of its inhabitants. The king of Babylon was met by all the inhabitants of hell:</p><blockquote><p>“you will take up this proverb against the king of Babylon, and say: ‘How the oppressor has ceased, the golden city ceased! ... <strong>Hell from beneath is excited about you, to meet you at your coming</strong>; it stirs up the dead for you, all the chief ones of the earth; it has raised up from their thrones all the kings of the nations. <strong>They all shall speak and say to you: “Have you also become as weak as we?</strong> Have you become like us?”’” (<a href="https://bibleox.com/en/eng-nkjv/is/14/#L4,9-10">Isa. 14:4,9-10</a>)</p></blockquote><p>The Lord, after the death of the body, descended into Hades to preach to those spirits who had been there since the worldwide flood:</p><blockquote><p>“For Christ also suffered once for sins, the just for the unjust, that He might bring us to God, <strong>being put to death in the flesh but made alive by the Spirit</strong>, by whom also <strong>He went and preached to the spirits in prison</strong>, who formerly were disobedient, when once the Divine longsuffering waited <strong>in the days of Noah, while the ark was being prepared</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L18-20">1 Pet. 3:18-20</a>)</p></blockquote><blockquote><p>“Therefore He says: ‘When He ascended on high, He led captivity captive, and gave gifts to men.’ (Now this, <strong>‘He ascended’ — what does it mean but that He also first descended into the lower parts of the earth?</strong>)” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L8-9">Eph. 4:8-9</a>)</p></blockquote><p>The soul of Christ was not left in Hades. It is not that the <u>body</u> was not left in the earth (in the tomb), but that the <u>soul</u> was not left in Hades:</p><blockquote><p>“he, foreseeing this, spoke concerning the resurrection of the Christ, that <strong>His soul was not left in Hades</strong>, nor did His flesh see corruption” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L31">Act. 2:31</a>)</p></blockquote><p>The dead are seen, the dead are judged, Hades gives up the dead:</p><blockquote><p>“And <strong>I saw the dead</strong>, small and great, standing before God, and books were opened. And another book was opened, which is the Book of Life. And <strong>the dead were judged</strong> according to their works, by the things which were written in the books. The sea gave up the dead who were in it, and <strong>Death and Hades delivered up the dead who were in them</strong>. And they were judged, each one according to his works” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L12-13">Rev. 20:12-13</a>)</p></blockquote>

  - src: ад-бесконечность-мучений
    path: Eh5t_Hell_the_Endlessness_of_Torment
    title: Hell — the Endlessness of Torment
    meta_desc: Bible quotes about the endlessness of the torments of hell
    menu: { parent: Man/Afterlife, title: The Endlessness of Torment, priority: 5 }
    body: |-
      <h2>Definition</h2><p>Hell — as the place where condemned sinners abide after the glorious second coming of Christ and the Last Judgment. It will no longer be possible to change this lot after the Last Judgment. Both the sufferings of the condemned and the blessedness of the righteous will last equally forever.</p><h2>The Torments of Hell Have No End</h2><blockquote><p>“And the smoke of their torment ascends <strong>forever and ever</strong>; and <strong>they have no rest day or night</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L11">Rev. 14:11</a>)</p></blockquote><blockquote><p>“rather than having two eyes, to be cast into hell fire — where <strong>‘Their worm does not die and the fire is not quenched’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L47-48">Mark. 9:47-48</a>)</p></blockquote><blockquote><p>“The devil, who deceived them, was cast into the lake of fire and brimstone where the beast and the false prophet are. And <strong>they will be tormented day and night forever and ever</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L10">Rev. 20:10</a>)</p></blockquote><blockquote><p>“And many of those who sleep in the dust of the earth shall awake, some to everlasting life, some to <strong>shame and everlasting contempt</strong>” (<a href="https://bibleox.com/en/eng-nkjv/dan/12/#L2">Dan. 12:2</a>)</p></blockquote><blockquote><p>“And <strong>these will go away into everlasting punishment</strong>, but the righteous into eternal life” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L46">Matt. 25:46</a>)</p></blockquote><blockquote><p>“but he who blasphemes against the Holy Spirit <strong>never has forgiveness</strong>, but <strong>is subject to eternal condemnation</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/3/#L29">Mark. 3:29</a>)</p></blockquote><blockquote><p>“on those who do not know God, and on those who do not obey the gospel of our Lord Jesus Christ. These <strong>shall be punished with everlasting destruction</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L8-9">2 Thess. 1:8-9</a>)</p></blockquote><blockquote><p>“These are wells without water, clouds carried by a tempest, for whom <strong>is reserved the blackness of darkness forever</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L17">2 Pet. 2:17</a>)</p></blockquote><blockquote><p>“of the <strong>doctrine</strong> of baptisms, of laying on of hands, of resurrection of the dead, and <strong>of eternal judgment</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/6/#L2">Heb. 6:2</a>)</p></blockquote><blockquote><p>“since it is a righteous thing with God to repay with tribulation those who trouble you, and to give you who are troubled rest with us when the Lord Jesus is revealed from heaven with His mighty angels, in flaming fire taking vengeance on those who do not know God, and on those who do not obey the gospel of our Lord Jesus Christ. These <strong>shall be punished with everlasting destruction</strong> from the presence of the Lord and from the glory of His power” (<a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L6-9">2 Thess. 1:6-9</a>)</p></blockquote><h2>Even Those Who Did Not Know God’s Will Are Punished</h2><blockquote><p>“And that servant who knew his master’s will, and did not prepare himself or do according to his will, shall be beaten with many stripes. But <strong>he who did not know, yet committed things deserving of stripes, shall be beaten with few</strong>. For everyone to whom much is given, from him much will be required; and to whom much has been committed, of him they will ask the more” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L47-48">Luke. 12:47-48</a>)</p></blockquote><h2>Criticism</h2><h3>Does the Teaching on the Endless Torments of Hell Turn People Away from Christ?</h3><p>This is not an argument. A sinner in general does not like to hear about punishment for sin. What then, should we promise him blessedness for sin? Likewise, a person who loves sin does not like to hear the teaching:</p><ul><li><p>about repentance,</p></li><li><p>about forsaking sins,</p></li><li><p>about amending one’s life,</p></li><li><p>that Christ is the only Savior, and other paths do not lead to salvation (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L12">Act. 4:12</a>),</p></li><li><p>about love for enemies, renouncing revenge, forgiving debts, doing good to those who hate us (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L44">Matt. 5:44</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L27">Luke. 6:27</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/6/#L35">Luke. 6:35</a>)</p></li><li><p>about renouncing the pursuit of wealth (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L24">Matt. 19:24</a>),</p></li><li><p>about monogamy (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L10">Matt. 19:10</a>).</p></li></ul><p>But this, of course, does not mean that all this should be given up. And why does it not mean that? Because it is the truth. If a person does not listen to these words, then the warning about punishment will indeed be fulfilled; they were not in vain. We warn him so that this does not happen to him. So too with eternal torments: if this is a true teaching, then why should the truth be corrected by removing what is inconvenient for a sinner to hear?</p><blockquote><p>“For the time will come when they will not endure sound doctrine, but according to their own desires, because they have itching ears, <strong>they will heap up for themselves teachers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L3">2 Tim. 4:3</a>)</p></blockquote><p>In teaching one should proceed from the truth, and not from what people like to hear:</p><blockquote><p>“I found it necessary to write to you exhorting you <strong>to contend earnestly for the faith which was once for all delivered to the saints</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude. 1:3</a>)</p></blockquote>
