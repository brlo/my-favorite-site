      <h3>Useful Information</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/20_1">https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/20_1</a> (in Russian)</p></li></ol>
    body: |-
      <h2>Body and Soul</h2><h3>Persecutors Cannot Kill the Soul</h3><p>The Lord Jesus Christ says not to fear persecutors, because they can kill only the body, but cannot kill the soul. They cannot harm the soul. People who deny the existence of the soul after death claim that the soul dies together with the body, which would mean, of course, that persecutors kill not only the body but also the soul — but this contradicts the words of Christ:</p><blockquote><p>“And <strong>do not fear those who kill the body <mark>but cannot kill the soul</mark></strong>. But rather fear Him who is able to destroy both soul and body in hell” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L28">Matt. 10:28</a>)</p></blockquote><blockquote><p>“And I say to you, My friends, <strong>do not be afraid of those who kill the body, and after that have no more that they can do</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L4">Luke. 12:4</a>)</p></blockquote><h3>The Appearance on Tabor of the Soul of the Departed Prophet Moses</h3><p>At the moment of the Savior’s Transfiguration on Mount Tabor, the apostles see the appearance of the prophet Moses, who had already died, conversing with Christ about the sufferings on the Cross that lie ahead of Him. That is, although the prophet died (<a href="https://bibleox.com/en/eng-nkjv/vtor/34/#L7">Deut. 34:7</a>; <a href="https://bibleox.com/en/eng-nkjv/nav/1/#L2">Josh. 1:2</a>) (see <a href="#HH-Did-God-Raise-the-Prophet-Moses">the comment</a>), he did not vanish and did not lose consciousness: he <strong>communicates</strong> with Christ:</p><blockquote><p>“And behold, <strong><mark>Moses</mark> and Elijah <mark>appeared to them, talking</mark> with Him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/17/#L3">Matt. 17:3</a>)</p></blockquote><blockquote><p>“As He prayed, the appearance of His face was altered, and His robe became white and glistening. And behold, <strong>two men talked with Him, who were Moses and Elijah</strong>, who appeared in glory and <strong>spoke</strong> of His decease which He was about to accomplish at Jerusalem” (<a href="https://bibleox.com/en/eng-nkjv/lk/9/#L29-31">Luke. 9:29-31</a>)</p></blockquote><h3>The Apostle on Life After Death</h3><p>The Apostle Paul says that when the earthly tent (the body) is destroyed, we have a dwelling in heaven:</p><blockquote><p>“For we know that <strong>if our earthly house, this tent, is destroyed</strong>, we <strong>have a building from God</strong>, a house not made with hands, <strong>eternal in the heavens</strong>... For we who are in this tent groan, being burdened, <strong>not because we want to be unclothed, but further clothed</strong>, that mortality may be swallowed up by life” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L1,4">2 Cor. 5:1,4</a>)</p></blockquote><hr><p>In another place, perhaps one of the most important, the apostle writes that he wishes to die as soon as possible in order to pass manifestly to life with God, calling death “gain”. But if the apostle vanishes or falls asleep after death, then he gains nothing, but only loses (consciousness). In that case there is no sense in hurrying to die and pass into inactivity. It would be more correct to live, preach, organize the Church, have communion with God, help the Church (<strong><mark>not abandon her as long as possible</mark></strong> — this is the main thought that opponents of the teaching on the immortal soul always ignore*), living in the earthly body. But the apostle, knowing that he will pass to life with God in heaven, wishes to be released as soon as possible from earthly life in the body:</p><blockquote><p>“For to me, to live is Christ, and <strong>to die is gain</strong>. But if I live on in the flesh, this will mean fruit from my labor; yet what I shall choose I cannot tell. For I am hard-pressed between the two, <strong>having a desire to depart and be with Christ, which is far better</strong>. Nevertheless to remain in the flesh is more needful for you” (<a href="https://bibleox.com/en/eng-nkjv/fil/1/#L21-24">Phil. 1:21-24</a>)</p></blockquote><p>*Those who deny the existence of the soul after death usually ignore the argument in the comment offered and say: “<em>the apostle will not notice how the time flies by for him in sleep, and will immediately wake up in the resurrection with Christ</em>”. However, if the apostle does not pass to life with Christ at once, but only passes into unconscious inactivity, then there is no sense in hurrying to <strong>abandon the Church</strong>, when the apostle writes right there that remaining in the body is more needful for the Church.</p><hr><p>Leaving the body, the apostle believes that he will be with the Lord, and so again he wishes rather to leave the body. He points out that it is important to be pleasing to God both while living in the body and while leaving it:</p><blockquote><p>“knowing that <strong>while we are at home in the body we are absent from the Lord</strong>. &lt;...&gt; We are confident, yes, <strong>well pleased rather to be absent from the body</strong> and to be present with the Lord. Therefore we make it our aim, whether present or absent, to be well pleasing to Him” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L6,8-9">2 Cor. 5:6,8-9</a>)</p></blockquote><p>The apostle is in the body as in a temple (<a href="https://bibleox.com/ru/q/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">man is the temple of God</a>), but soon he will have to leave the body, go out of it:</p><blockquote><p>“Yes, I think it is right, as long as <strong>I am in this tent</strong>, to stir you up by reminding you, knowing that shortly <strong>I must put off my tent</strong>, just as our Lord Jesus Christ showed me” (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L13-14">2 Pet. 1:13-14</a>)</p></blockquote><p>The apostle writes that he could consciously be in heaven either in the body or out of the body:</p><blockquote><p>“I know a man in Christ who fourteen years ago — <strong>whether in the body I do not know, or whether out of the body I do not know</strong>, God knows — such a one was caught up to the third heaven” (<a href="https://bibleox.com/en/eng-nkjv/2kor/12/#L2">2 Cor. 12:2</a>)</p></blockquote><p>The apostle points to the eternity of the soul:</p><blockquote><p>“Therefore we do not lose heart. Even though <strong>our outward man is perishing, yet the inward man is being renewed day by day</strong>. &lt;...&gt; For the things which are seen are temporary, but <strong>the things which are not seen are eternal</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/4/#L16,18">2 Cor. 4:16,18</a>)</p></blockquote><h3>Deeds Done During Life <strong>in the Body</strong>, Not Outside the Body, Are Subject to Judgment</h3><p>God will judge only the activity that was done during life in the body:</p><blockquote><p>“For we must all appear before the judgment seat of Christ, that each one may receive <strong>the things done in the body</strong>, according to what he has done, whether good or bad” (<a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10">2 Cor. 5:10</a>)</p></blockquote><h3>Old Testament Mentions</h3><p>Those who consider the death of a person to be the annihilation not only of the body but also of the soul think wrongly:</p><blockquote><p>“For <strong>they reasoned unsoundly, saying to themselves</strong>, ‘Short and sorrowful is our life, and there is no remedy when a life comes to its end, and no one has been known to return from Hades. For we were born by mere chance, and hereafter we shall be as though we had never been, for the breath in our nostrils is smoke, and reason is a spark kindled by the beating of our hearts; <strong>when it is extinguished, the body will turn to ashes, and the spirit will dissolve like empty air</strong>’” (<a href="https://bibleox.com/en/en-nrsv/prs/2/#L1-3">Wis. 2:1-3</a>)</p></blockquote><p>Moreover:</p><blockquote><p>“For <strong>perverse thoughts separate people from God</strong>, and when his power is tested, it exposes the foolish” (<a href="https://bibleox.com/en/en-nrsv/prs/1/#L3">Wis. 1:3</a>)</p></blockquote><blockquote><p>“But <strong>the souls of the righteous are in the hand of God</strong>, and no torment will ever touch them. <strong>In the eyes of the foolish they seemed to have died</strong>, and their departure was thought to be a disaster, and <strong>their going from us to be their destruction</strong>; <strong>but</strong> <strong>they are at peace</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/3/#L1-3">Wis. 3:1-3</a>)</p></blockquote><h2>The Rebuke of the Sadducees, Who Deny Life After Death</h2><p>Of all the Jewish parties (Pharisees, Sadducees, Essenes, etc.), only one believed in the disappearance of a person after death — the Sadducees (<a href="https://bibleox.com/en/eng-nkjv/act/23/#L8">Act. 23:8</a>). And the Lord sternly rebukes them, accusing them of error and of ignorance of the Scriptures:</p><blockquote><p>“Jesus answered and said to them, ‘<strong>You are mistaken,</strong> <strong>not knowing the Scriptures nor the power of God</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/22/#L29">Matt. 22:29</a>)</p></blockquote><blockquote><p>“<strong>He is not the God of the dead, but the God of the living</strong>. <strong>You are therefore greatly mistaken</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/12/#L27">Mark. 12:27</a>)</p></blockquote><h2>The Human Soul of Jesus Christ</h2><p>The Lord Jesus Christ, after the death of the body, descended in His soul into Hades:</p><blockquote><p>“For You <strong>will not leave my soul in Sheol</strong>, nor will You allow Your Holy One to see corruption” (<a href="https://bibleox.com/en/eng-nkjv/ps/16/#L10">Ps. 16:10</a>) (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L27">Act. 2:27</a>)</p></blockquote><blockquote><p>“he, foreseeing this, spoke concerning the resurrection of the Christ, that <strong>His soul was not left in Hades</strong>, nor did His flesh see corruption” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L31">Act. 2:31</a>)</p></blockquote><p>In Hades Christ preached to those spirits (souls) who had been there since the worldwide flood:</p><blockquote><p>“For Christ also suffered once for sins, the just for the unjust, that He might bring us to God, <strong>being put to death in the flesh but made alive by the Spirit</strong>, by whom also <strong>He went and preached to the spirits in prison</strong>, who formerly were disobedient, when once the Divine longsuffering waited <strong>in the days of Noah, while the ark was being prepared</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L18-20">1 Pet. 3:18-20</a>)</p><p>“They will give an account to Him who is ready to judge the living and the dead. For this reason <strong>the gospel was preached also to those who are dead</strong>, that they might be judged according to men in the flesh, but live according to God in the spirit” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L5-6">1 Pet. 4:5-6</a>)</p></blockquote><blockquote><p>“Therefore He says: ‘When He ascended on high, He led captivity captive, and gave gifts to men.’ (Now this, <strong>‘He ascended’ — what does it mean but that He also first descended into the lower parts of the earth?</strong>)” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L8-9">Eph. 4:8-9</a>)</p></blockquote><p>In the end, Christ is Lord over the dead and the living:</p><blockquote><p>“For to this end <strong><u>Christ</u> died and rose and lived again, that He might be Lord of both <u>the dead</u> and <u>the living</u></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L9">Rom. 14:9</a>)</p></blockquote><h2>The Life of the Righteous in Heaven After Death</h2><p>The souls of those slain for Christ live with Him in heaven and know what is happening on earth (they have not yet been avenged):</p><blockquote><p>“When He opened the fifth seal, I saw under the altar <strong>the souls of those who had been slain for the word of God</strong> and for the testimony which they held. And they cried with a loud voice, saying, <strong>‘How long, O Lord, holy and true, until You judge and avenge our blood on those who dwell on the earth?’</strong> Then <strong>a white robe was given to each of them</strong>; and it was said to them that they should rest a little while longer, until both the number of their fellow servants and <strong>their brethren, who would be killed as they were, was completed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>)</p></blockquote><h2>The Martyrs for Christ Dwell in Heaven</h2><blockquote><p>“And they overcame him by the blood of the Lamb and <strong>by the word of their testimony</strong>, and <strong>they did not love their lives to the death</strong>. Therefore rejoice, <strong>O heavens, and you who dwell in them</strong>! Woe to the inhabitants of the earth and the sea! For the devil has come down to you, having great wrath, because he knows that he has a short time” (<a href="https://bibleox.com/en/eng-nkjv/otkr/12/#L11-12">Rev. 12:11-12</a>)</p></blockquote><p>The righteous dwell in heaven, and we who live on earth already now come to the triumphant Church in heaven, to the spirits of the righteous:</p><blockquote><p>“But <strong>you have come</strong> to Mount Zion and to the city of the living God, <strong>the heavenly Jerusalem</strong>, to an innumerable company of angels, <strong>to the general assembly and church of the firstborn</strong> who are registered in heaven, to God the Judge of all, <strong>to the spirits of just men made perfect</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-23">Heb. 12:22-23</a>)</p></blockquote><p>People who have kept their virginity always follow Christ wherever He goes:</p><blockquote><p>“These are <strong>the ones who were not defiled with women</strong>, for they are <strong>virgins</strong>. These are the ones who <strong>follow the Lamb wherever He goes</strong>. These were redeemed from among men, being firstfruits to God and to the Lamb. And in their mouth was found no deceit, for they are without fault <strong>before the throne of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L4-5">Rev. 14:4-5</a>)</p></blockquote><p>The dead are judged; Hades gives up the dead who were in it:</p><blockquote><p>“And <strong>I saw the dead</strong>, small and great, standing before God, and books were opened. And another book was opened, which is the Book of Life. And <strong>the dead were judged</strong> according to their works, by the things which were written in the books. The sea gave up the dead who were in it, and <strong>Death and Hades delivered up the dead who were in them</strong>. And they were judged, each one according to his works” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L12-13">Rev. 20:12-13</a>)</p></blockquote><h2>Criticism</h2><h3>Did God Raise the Prophet Moses?</h3><p>The Orthodox, in defense of the conscious existence of the soul after death, cite the argument that although the prophet Moses died (<a href="https://bibleox.com/en/eng-nkjv/vtor/34/#L7">Deut. 34:7</a>; <a href="https://bibleox.com/en/eng-nkjv/nav/1/#L2">Josh. 1:2</a>), he appears and <strong>communicates</strong> with Christ:</p><blockquote><p>“And behold, <strong><mark>Moses</mark> and Elijah <mark>appeared to them, talking</mark> with Him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/17/#L3">Matt. 17:3</a>)</p></blockquote><p>Opponents of the Orthodox Church, in particular the Adventists, say in reply that this is supposedly because God took up and raised the prophet Moses. They refer not to Holy Scripture, but to the apocryphon “The Assumption of Moses” (being unable to refer directly to the words of Ellen White).</p><p>We (and they as well) do not recognize apocrypha as authoritative texts. But the point is that even in this apocryphon, at least in its surviving part, there are no words about the resurrection of the prophet Moses. On the contrary, Moses is credited there with words that he is departing to the “<em>sleep of his fathers</em>” (<a href="https://azbyka.ru/otechnik/Biblia2/apokrificheskie-apokalipsisy/15#sel=15:41,15:57;27:1,27:7">source</a>, in Russian).</p><p>Moreover, the resurrection of the prophet contradicts Scripture, since it is precisely Christ who is the firstborn from the dead:</p><blockquote><p>“But now Christ is risen from the dead, and has become <strong>the firstfruits of those who have fallen asleep</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L20">1 Cor. 15:20</a>)</p></blockquote><p>We also know that no one of people (the speech is addressed to people) has ascended to heaven, none of the prophets ascended to heaven:</p><blockquote><p>“<strong><mark>No one</mark> has ascended to heaven but He who came down from heaven, that is, the Son of Man</strong> who is in heaven” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L13">John. 3:13</a>)</p></blockquote><blockquote><p>“Men and brethren, let me speak freely to you of the patriarch David, that he is both dead and buried, and his tomb is with us to this day. &lt;...&gt; <strong>For David did not ascend into the heavens</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L29,34">Act. 2:29,34</a>)</p></blockquote><p>More on the fact that before Christ’s sacrifice on the Cross and His Resurrection all people after their death went down to Hades:</p><p><a href="https://bibleox.com/ru/ru/w/9VFT_%D0%94%D0%BE_%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BE%D0%B9_%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B0%D0%B2%D0%B5%D0%B4%D0%BD%D0%B8%D0%BA%D0%B8_%D1%81%D1%85%D0%BE%D0%B4%D0%B8%D0%BB%D0%B8_%D0%B2_%D0%B0%D0%B4">Before Christ’s sacrifice the Old Testament righteous went down to Hades</a></p><h3>Is the Teaching on the Life of the Soul a Belief in the Devil’s Words “You Will Not Surely Die”?</h3><p>Opponents of the teaching on the soul (Adventists) accuse the Orthodox as follows: God said “you will die”, and the devil said “you will not die”, and this supposedly means that belief in the life of the soul after death is belief in the devil’s words: “you will not die”. Accordingly, those who believe in the life of the soul after the death of the body are accused by them of believing the devil’s lie.</p><p>The accusation is loud, but this idea itself has serious contradictions and problems with the context. God said not only “you will die”, but that you will die on the day of eating the fruit of the forbidden tree:</p><blockquote><p>“And the LORD God commanded the man, saying, ‘Of every tree of the garden you may freely eat; but <strong>of the tree of the knowledge of good and evil you shall not eat, for <mark>in the day that you eat of it you shall surely die</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L16-17">Gen. 2:16-17</a>)</p></blockquote><p>Opponents of the teaching on the life of the soul understand the words “you will die” in the simplest and most direct way, as the death of the body and the end of all a person’s life processes, the cessation of his existence (at least, of his conscious existence).</p><p>Did such an understanding of death happen to the people on the day they ate the fruit? — No, Adam died much later, at 930 years (<a href="https://bibleox.com/en/eng-nkjv/gen/5/#L5">Gen. 5:5</a>). What does this mean? — It means that God spoke of another death. And the devil denied the other death.</p><p>And if it is not so, then one would have to admit that God lied when He said that people would die on the day they ate the fruit, while the devil supposedly told the truth that they would not die — for indeed, a crude bodily understanding of death did not happen that same day. But we can in no way admit that God (the Way, the Truth and the Life — <a href="https://bibleox.com/en/eng-nkjv/in/14/#L6">John. 14:6</a>) lied, and the devil (a liar and the father of lies — <a href="https://bibleox.com/en/eng-nkjv/in/8/#L44">John. 8:44</a>) told the truth. Yet it is precisely to this conclusion that the interpretation of the opponents of the teaching on the soul leads.</p><p>To get out of this dead end, they will necessarily have to reinterpret part of the phrase allegorically:</p><ul><li><p>to understand death itself literally,</p></li><li><p>but the day of death not literally.</p></li></ul><p>The Orthodox Church has no such shortcomings in its interpretation:</p><ul><li><p>the day of death is understood literally,</p></li><li><p>and death itself is understood literally, only with respect to the spiritual state of a person. However, changes also happened in the bodily state: at the very least, the people saw their nakedness.</p></li></ul><p>Our first parents really did die that same day, but this death is not disappearance, but a state of falling away from God, in which all sinful people abide. Christ God Himself calls the state of life without God death:</p><blockquote><p>“Then another of His disciples said to Him, ‘Lord, let me first go and bury my father.’ But Jesus said to him, ‘Follow Me, and <strong><mark>let the dead bury</mark> their own dead</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L21-22">Matt. 8:21-22</a>)</p></blockquote><blockquote><p>“Most assuredly, I say to you, he who hears My word and believes in Him who sent Me has everlasting life, and shall not come into judgment, but <strong><mark>has passed from death</mark> into life</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L24">John. 5:24</a>)</p></blockquote><blockquote><p>“And to the angel of the church in Sardis write, ‘These things says He who has the seven Spirits of God and the seven stars: “I know your works, that <strong><mark>you have a name that you are alive, but you are dead</mark></strong>”’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L1">Rev. 3:1</a>)</p></blockquote><p>The apostles say the same. People lived as dead:</p><blockquote><p>“And you He made alive, who were <strong><mark>dead in trespasses and sins</mark>, <mark>in which you</mark></strong> once <strong><mark>walked</mark></strong> according to the course of this world, according to the prince of the power of the air, the spirit who now works in the sons of disobedience” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L1-2">Eph. 2:1-2</a>)</p></blockquote><blockquote><p>“Now she who is really a widow, and left alone, trusts in God and continues in supplications and prayers night and day. But she who lives in pleasure <strong><mark>is dead while she lives</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L5-6">1 Tim. 5:5-6</a>)</p></blockquote><p>That is, the state of deadness came upon Adam and Eve immediately after the fall — this is the state of inner life without God. And in this sense the devil lied when he said that they would not die. They died as God said — on that same day.</p><p>Thus the accusations are not serious, being self-contradictory and detached from the context of Holy Scripture.</p>

