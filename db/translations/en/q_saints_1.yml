    <h2>2nd century</h2><h3>Polycarp of Smyrna, hieromartyr (69–155)</h3><blockquote><p>Wherefore it is right to abstain from all these things, <strong>submitting yourselves to the presbyters and deacons</strong> as to God and Christ. The virgins must walk in a blameless and pure conscience.</p>
    <p>&lt;…&gt;</p>
    <p>For every one who shall not confess that Jesus Christ is come in the flesh, is antichrist (1 John 4:3): and whosoever shall not confess the testimony of the Cross, is of the devil; and <strong><mark>whosoever shall pervert the oracles of the Lord to his own lusts</mark> and say that there is neither resurrection nor judgment, <mark>that man is the firstborn of Satan</mark></strong>. Wherefore let us forsake the vain doing of the many and their false teachings, and <strong><mark>turn unto the word which was delivered unto us from the beginning</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Plk_Ph">To the Philippians, 5–7</a>)</p><h2>3rd century</h2><h3>Clement of Alexandria, presbyter (150–215)</h3><blockquote><p>Indeed, <strong>those who hold to impious teachings and lead others to them <mark>turn the divine word not to the profit but to the harm of those who hear it</mark></strong>”; they shut for themselves the entrance into the Kingdom of Heaven, and do not allow those whom they deceive to comprehend the truth. (2) <strong><mark>Having no key of the entrance</mark>, they use a counterfeit key, or, as they say, a lockpick (ἀντικλεῖς), with which they enter not through the outer door, <mark>by which we enter by means of the Divine tradition</mark></strong>, but, breaking through the side gate, they creep in secretly behind the church walls, distorting the truth in every way and presenting themselves as teachers initiated into the mysteries (μυσταγωγοι) and bringing up the souls of the ungodly.</p></blockquote><p>(The Stromata, Book VII)</p><h2>4th century</h2><h3>St Athanasius the Great (c. 295–373)</h3><blockquote><p>For those who are thus disposed, and fashion themselves according to the Gospel, will be partakers of Christ, and imitators of <strong><mark>apostolic</mark></strong> conversation, on account of which <strong>they shall be deemed worthy of that praise from him</strong>, with which he praised the Corinthians, when he said, ‘I praise you that in everything ye are mindful of me (1 Cor. 11:2).’ Afterwards, because <strong><mark>there were men who used his words, but chose to hear them as suited their lusts</mark></strong>, and dared to pervert them (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L3">2 Tim. 4:3</a>), as the followers of Hymenæus and Alexander, and before them the Sadducees, who as he said, ‘having made shipwreck of faith,’ scoffed at the mystery of the resurrection, he immediately proceeded to say, ‘<strong><mark>And as I have delivered to you traditions, hold them fast</mark></strong> (1 Tim. 1:19; 2 Tim. 2:18; 1 Cor. 11:2).’ <strong><mark>That means, indeed, that we should think not otherwise than as the teacher has delivered</mark></strong>.</p>
    <p>6. <strong><mark>For not only in outward form did those wicked men dissemble</mark></strong>, putting on as the Lord says sheep’s clothing, and appearing like unto whited sepulchres; but <strong><mark>they took those divine words in their mouth, while they inwardly cherished evil intentions</mark>. And the first to put on this appearance was the serpent, the inventor of wickedness from the beginning—the devil,—who, in disguise, conversed with Eve, and forthwith deceived her</strong>. <strong><mark>But after him and with him are all inventors of unlawful heresies</mark>, <mark>who indeed refer to the Scriptures, but do not hold such opinions as the saints have handed down, and receiving them as the traditions of men, err, because they do not rightly know them nor their (Matt. 22:29) power</mark></strong>. Therefore Paul justly <strong><mark>praises the Corinthians (1 Cor. 11:2), because their opinions were in accordance with his </mark><u><mark>traditions</mark></u></strong>. And the Lord most righteously reproved the Jews, saying, ‘Wherefore do ye also transgress the commandments of God on account of your traditions (Matt. 15:3).’ For they changed the commandments they received from God after their own understanding, preferring to observe the traditions of men. And about these, a little after, the blessed Paul again gave directions to the Galatians who were in danger thereof, writing to them, ‘If any man preach to you aught else than that ye have received, let him be accursed (Gal. 1:9).’</p>
    <p>7. For <strong><mark>there is no fellowship whatever between the words of the saints and the fancies of human invention; for the saints are the ministers of the truth, preaching the kingdom of heaven</mark></strong>, but those who are borne in the opposite direction have nothing better than to eat, and think their end is that they shall cease to be, and they say, ‘Let us eat and drink, for to-morrow we die (Isa. 22:13).’ <strong><mark>Therefore blessed Luke reproves the inventions of men, and hands down the narrations of the saints</mark></strong>, saying in the beginning of the Gospel, ‘Since many have presumed to write narrations of those events of which we are assured, <strong><mark>as those who from the beginning were witnesses and ministers of the Word have delivered to us</mark></strong>; it hath seemed good to me also, who have adhered to them all from the first, to write correctly in order to thee, O excellent Theophilus, that thou mayest know the truth concerning the things in which thou hast been instructed (Luke 1:1).’ For <strong><mark>as each of the saints has received, that they impart without alteration</mark></strong>, for the confirmation of the doctrine of the mysteries. Of these the (divine) word would have us disciples, and these should of right be our teachers, and to them only is it necessary to give heed, for of them only is ‘the word faithful and worthy of all acceptation (1 Tim. 1:15);’ these not being disciples because they heard from others, but being eye-witnesses and ministers of the Word, that which they had heard from Him have they handed down.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-the-festal-letters-1">Second Festal Letter (330)</a>)</p><h3>St Epiphanius of Cyprus, bishop (c. 315–403)</h3><blockquote><p>“<strong><mark>Tradition also must be made use of: for not everything can be taken from the divine Scripture</mark></strong>. For this reason the holy Apostles handed down some things in writings, and others in traditions, as the holy Apostle says: as I delivered them to you (1 Cor. 11:2), and in another place: so teach I, and so I ordained in all the churches (1 Cor. 7:17), and: unless ye have believed in vain (1 Cor. 15:2).”</p></blockquote><p>(Panarion, or the Medicine Chest, against the eighty heresies: the Apostolics)</p><h3>Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p>We have need therefore of divine grace, and of a sober mind, and of eyes that see, lest from eating tares as wheat we suffer harm from ignorance, and lest from taking the wolf to be a sheep we become his prey, and from supposing the destroying Devil to be a beneficent Angel we be devoured: for, as the Scripture saith, he goeth about as a roaring lion, seeking whom he may devour (1 Pet. 5:8). <strong><mark>This is the cause of the Church’s admonitions</mark>, the cause of the present instructions, and of the lessons which are read.</strong></p>
    <p>2. For the method of godliness consists of these two things, pious doctrines, and virtuous practice: and neither are the doctrines acceptable to God apart from good works, nor does God accept the works which are not perfected with pious doctrines. For what profit is it, to know well the doctrines concerning God, and yet to be a vile fornicator? And again, what profit is it, to be nobly temperate, and an impious blasphemer? A most precious possession therefore is the knowledge of doctrines: also there is need of a wakeful soul, since there are many that make spoil through philosophy and vain deceit (Col. 2:8). The Greeks on the one hand draw men away by their smooth tongue, for honey droppeth from a harlot’s lips (Prov. 5:3): whereas <strong><mark>they of the Circumcision deceive those who come to them by means of the Divine Scriptures</mark>, which they miserably misinterpret though studying them from childhood to old age, and growing old in ignorance. But the children of heretics, by their good words and smooth tongue, deceive the hearts of the innocent, disguising with the name of Christ as it were with honey the poisoned arrows of their impious doctrines</strong>: concerning all of whom together the Lord saith, <strong><mark>Take heed lest any man mislead you (Matt. 24:4). This is the reason for the teaching of the Creed and for expositions upon it.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1">The Catechetical Lectures, Lecture IV</a>)</p><h2>5th century</h2><h3>Blessed Jerome of Stridon, monk (c. 347–420)</h3><blockquote><p><em>But as we have already had a long discussion and the protracted controversy has wearied out the attention of our audience, I will tell you my opinion briefly and without reserve. </em><strong><em><mark>We ought to remain in that Church which was founded by the Apostles and continues to this day</mark>. <mark>If ever you hear of any that are called Christians taking their name not from the Lord Jesus Christ, but from some other</mark>, for instance, Marcionites, Valentinians, Men of the mountain or the plain, you may be sure that you have there not the Church of Christ, but the synagogue of Antichrist. For the fact that <mark>they took their rise after the foundation of the Church</mark> is proof that they are those whose coming the Apostle foretold</em></strong><em>. </em><strong><em><mark>And let them not flatter themselves if they think they have Scripture authority for their assertions, since the devil himself quoted Scripture, and the essence of the Scriptures is not the letter, but the meaning. Otherwise, if we follow the letter, we too can concoct a new dogma</mark></em></strong><em> and assert that such persons as wear shoes and have two coats must not be received into the Church.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians">Dialogue Against the Luciferians</a>)</p><h2>7th century</h2><h3>The Sixth Œcumenical Council (691)</h3><blockquote><p>It behoves those who preside over the churches, every day but especially on Lord’s days, <strong>to teach all the clergy and people words of piety and of right religion, gathering out of holy Scripture meditations and determinations of the truth, and <mark>not going beyond the limits now fixed, nor varying from the tradition of the God-bearing fathers</mark></strong>. And if any controversy in regard to Scripture shall have been raised, <strong><mark>let them not interpret it otherwise than as the lights and doctors of the church in their writings have expounded it</mark>, and in those let them glory rather than in composing things out of their own heads,</strong> <strong><mark>lest</mark></strong> through their lack of skill <strong><mark>they may have departed from what was fitting</mark></strong>. For through the doctrine of the aforesaid fathers, the people coming to the knowledge of what is good and desirable, as well as what is useless and to be rejected, will remodel their life for the better, and not be led by ignorance, but applying their minds to the doctrine, they will take heed that no evil befall them and work out their salvation in fear of impending punishment.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-council-in-trullo-quinisext#HH-Canon-XIX">Canon 19 of the Sixth Œcumenical Council</a>)</p><h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo) (1651–1709)</h3><blockquote><p><em>The Holy Spirit acted both through the prophets and through the Apostles. </em><strong><em>Holy Scripture is the first and principal source of faith and religious knowledge — true and infallible, and binding for all.</em></strong><em> </em><strong><em><mark>A correct and error-free understanding of Scripture is possible only under the guidance of the holy universal Church, and in her alone can the truth be found</mark></em></strong><em>.</em></p>
    <p><strong><em><mark>Sacred Tradition has the same divine origin as Scripture; it therefore constitutes another source of faith and religious knowledge, likewise true and infallible and binding for all, as Holy Scripture is; and the universal Church alone, in the person of her heads, can be the only keeper of genuinely apostolic Tradition</mark></em></strong><em>. — “</em><strong><em>Whoever wishes to know the truth, — reasons St Irenaeus, — must turn to the Church, because the Apostles entrusted the divine truth to her alone and, like a rich man into a treasury, placed in her everything that pertains to the truth. The Church alone is the door of life</em></strong><em>.” And, in particular, according to the teaching of St Irenaeus, only the pastors of the Church lawfully ordained are the true teachers and keepers of the truth contained in the Church.</em></p></blockquote><p>(The Lives of the Saints: the suffering of St Irenaeus of Lyons)</p><h2>18th century</h2><h3>The Epistle of the Patriarchs (1723)</h3><p>This is a conciliar document of the Church of Jerusalem (1672), but by that time (1723) also approved by the 4 patriarchates (Constantinopolitan, Jerusalem, Antiochian, Alexandrian) and by the Synod of the Russian Church.</p><blockquote><p><strong>If the Divine Scriptures were plain to all Christians that read them, the Lord would not have commanded such as desired to obtain salvation to search the same</strong> (John 5.39); and <strong>Paul would have said without reason that God had placed the gift of teaching in the Church</strong> (1 Cor. 12.28); and <strong>Peter would not have said of the Epistles of Paul that they contained some things hard to understand</strong> (2 Pet. 3.16). <strong><mark>It is evident, therefore, that the Scriptures are very profound, and their sense lofty; and that they need learned and divine men to search out their true meaning, and a sense that is right, and agreeable to all Scripture, and to its author the Holy Spirit</mark></strong>. So that as to those that are regenerated [in Baptism], although they must know the faith concerning the Trinity, the incarnation of the Son of God, his passion, resurrection, and ascension into the heavens, what concerneth regeneration and judgment – for which many have not hesitated to die – it is not necessary, but rather impossible, that all should know <strong><mark>what the Holy Spirit manifesteth to those alone who are exercised in wisdom and holiness</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Q-2-Are-the-Scriptures-plain-to-all-Christians-that-read-them">The Eastern Orthodox Confession of Faith (1723), Question 2</a>)</p><h2>19th century</h2><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p><strong><mark>Do not dare to interpret the Gospel and the other books of Holy Scripture yourself. The Scripture was uttered by the holy Prophets and Apostles — uttered not arbitrarily, but by the inspiration of the Holy Spirit (2 Pet. 1:21). How mad it is, then, to interpret it arbitrarily!</mark></strong></p>
    <p><strong>The Holy Spirit, who uttered the Word of God through the Prophets and Apostles,<mark> has interpreted it through the holy Fathers</mark>. Both the Word of God and its interpretation are the gift of the Holy Spirit. <mark>Only this one interpretation does the holy Orthodox Church accept</mark>! Only this one interpretation <mark>do her true children accept</mark>!</strong></p>
    <p><strong><mark>Whoever explains the Gospel and all the Scripture arbitrarily thereby rejects its interpretation by the holy Fathers, by the Holy Spirit. Whoever rejects the interpretation of the Scripture by the Holy Spirit rejects, without any doubt, the Holy Scripture itself.</mark></strong></p>
    <p>And the word of God, the word of salvation, becomes for its presumptuous interpreters an odour of death, a two-edged sword with which they slaughter themselves unto eternal perdition (2 Pet. 3:16; 2 Cor. 2:15-16). Arius, Nestorius, Eutyches and the other heretics slew themselves for ever by their arbitrary and presumptuous interpretation of the Scripture, falling into blasphemy.</p></blockquote><p>(Ascetic Experiences, Volume 1: On the reading of the Gospel)</p><blockquote><p>The writings of the holy Fathers were all composed by the inspiration of, or under the influence of, the Holy Spirit. Wonderful is their agreement, wonderful their unction! Whoever is guided by them has, without any doubt, the Holy Spirit for his guide.</p>
    <p>All the waters of the earth flow together into the ocean, and perhaps the ocean serves as the source of all the waters of the earth. The writings of the Fathers all converge in the Gospel; they all tend to teach us the exact keeping of the commandments of our Lord Jesus Christ; of them all the source and the end is the holy Gospel.</p>
    <p>The holy Fathers teach how to approach the Gospel, how to read it, how to understand it aright, what helps and what hinders its comprehension. And therefore <strong><mark>occupy yourself first of all more with the reading of the holy Fathers. When they have taught you to read the Gospel, then read the Gospel chiefly</mark></strong>.</p>
    <p><strong><mark>Do not consider it enough for yourself to read the Gospel alone without the reading of the holy Fathers! That is a proud and dangerous thought. Better let the holy Fathers lead you to the Gospel, as to their beloved child, who has received a preliminary upbringing and education by means of their writings.</mark></strong></p>
    <p>Many — all who have insolently and proudly rejected the holy Fathers and approached the Gospel directly, with blind daring, with an impure mind and heart — have fallen into deadly delusion. The Gospel has rejected them: it admits only the humble.</p></blockquote><p>(Ascetic Experiences, Vol. 1)</p><blockquote><p>Abba Ammon asked: “If it happens that one must converse with a brother, from what is it better to borrow the conversation — from the Scripture or from the sayings of the Fathers?” The Elder answered: “If you cannot keep silence, it is better to speak from the sayings of the Fathers than from the Scripture. <strong><mark>The interpretation of the Scripture is attended with great danger for the soul</mark></strong>.”</p>
    <p><em>Many monks of those times, </em><strong><em><mark>because of the incorrect explanation which they gave to various passages of the holy Scripture, fell into heresies</mark></em></strong><em>. The interpretation of the Scripture is granted by Divine grace. A monk </em><strong><em>who does not possess this grace and strives to interpret the Scripture from his own self-opinion and ignorance inevitably becomes guilty before the Holy Spirit who uttered the Scripture: for his presumptuousness he is rejected by God and becomes the prey of the fallen spirits. From such interpretation of the prophetic and apostolic Scriptures have arisen all the heresies and schisms.</em></strong></p></blockquote><p>(The Fatherland // Abba Ammon)</p><h3>St Theophan the Recluse (1815–1894)</h3><blockquote><p>“And the reason there are so many extracts is that by our law <strong><mark>in Orthodoxy only that is firm which stands on the holy Fathers</mark></strong>. With the Protestants it is another matter… whatever comes into their head, all goes.”</p></blockquote><p>(Collection of Letters, Issue 5, Letter 776)</p><h3>St Nektarios of Aegina (Kefalas) (1846–1920)</h3><blockquote><p><em>It was the Lord Himself who raised up the visible altar of the Church. That is why, together with theory, He demands deed — a deed in agreement with the truth which He communicated to </em><strong><em>His holy Church, the only one that leads into Life</em></strong><em>, whose Head is Christ Himself. </em><strong><em>To her we must submit; precisely from her we must learn the Truth and receive salvation</em></strong><em>. </em><strong><em>She alone is the pillar and ground of the Truth, for the Spirit, the Paraclete, dwells in her eternally</em></strong><em>. The venerable Dositheos says the following about the Church: </em><strong><em><mark>We must believe unshakably in the Scripture, but in no other way than in accordance with the teaching of the Catholic Church</mark></em></strong><em>. </em><strong><em>The heretics, of course, accept Holy Scripture, but they distort it with metaphors, homonymy, and the sophisms of human reasoning, which confuses the uncomplicated and plays upon what cannot be played upon</em></strong><em>. If we were obliged to accept daily the opinions of one or another, the Catholic Church would not be what she, by the grace of Christ, has remained to this moment, </em><strong><em><mark>keeping a single point of view concerning the faith and believing unshakably in one and the same</mark></em></strong><em>. In that case she would be torn by a multitude of heresies and would no longer be the holy Church, the pillar and ground of the Truth, unspotted and pure. She would have become the church of the cunning, the church of heretics, who, having formed themselves within her, would afterwards, without any pangs of conscience, cast her aside. Therefore we believe that </em><strong><em><mark>the witness of the Catholic Church does not yield to the authority of Holy Scripture. Both are the work of one and the same Spirit</mark>. A man speaking from himself may sin, be deceived and err. The Catholic Church never speaks from herself, but speaks by the Spirit of God, the Teacher who enriches her eternally</em></strong><em>. She cannot sin, nor be deceived, nor err. </em><strong><em><mark>She is equal to Holy Scripture and possesses an immutable and constant authority</mark></em></strong><em>”.</em></p>
    <p><em>St Cyril of Jerusalem enjoins: “to love to learn and to find out from the Church which books of the Old and New Testaments are received by all; for why lose time on the books that are doubtful. One must read, by his word, the twenty-two books of the Old Testament translated by the Seventy teachers.”</em></p>
    <p><em>Behind the words of St Cyril stands the authority of the Church. At the Council of Constantinople in 1672 Patriarch Dionysius said </em><strong><em>concerning the infallibility of the Church: “We say that she is infallible, guided by her own Head, Christ, and enlightened by the Spirit of Truth. Therefore she cannot err; for this reason the Apostle has called her the Pillar and Ground of the Truth</em></strong><em>. She is visible and will never forsake the Orthodox until the end of the age.”</em></p></blockquote><p>(From the works of St Nektarios of Aegina)</p><h3>St Nicholas of Japan, equal-to-the-apostles (1836–1912)</h3><blockquote><p>Protestants sometimes come to me and <strong>ask me to explain some place of Holy Scripture.</strong> “But you have your own missionary teachers; ask them,” I say to them; and what do they answer?</p>
    <p>— We did ask them, <strong>they say — understand it as you know how</strong>; <strong><mark>but I need to know the true thought of God, not my personal opinion</mark></strong>. Such is the instability of Protestantism with the Holy Scripture alone. It is not so with us: all is light and reliable, clear and firm; because, <strong>besides Holy Scripture, we accept also Holy Tradition, and</strong> <strong><mark>Holy Tradition</mark> is the living unbroken voice of our Mother the Church from the times of Christ and His Apostles to this day, and which will be until the end of the world. Upon it the Holy Scripture rests whole and intact, and it <mark>helps us to understand the meaning of the holy Scripture without error</mark></strong>; for <strong><mark>if a child does not understand something in a letter of his father, the most reliable thing for him is to turn to his mother for an explanation; and our Mother is the Church, in which Christ Himself invisibly dwells, according to His promise.</mark></strong></p></blockquote><p>(Diaries. Volume III, January 3/15, 1897. Friday)</p><h2>20th century</h2><h3>Illarion (Troitsky), hieromartyr (1886–1929)</h3><blockquote><p>Is it not remarkable that all those who fall away from the Church constantly speak of their respect for Holy Scripture and, at the same time, very quickly proceed to distort even the very books of Scripture! <strong><mark>As soon as people leave the Church, they immediately begin to interpret the Scripture in their own way, and each interprets it differently</mark>. Christ prayed to God the Father for the unity of all who believe in Him; the Apostles exhorted to like-mindedness, spoke of the unity of the faith. It turns out that without the Church no unity is possible.</strong> The Babylonian “confusion of tongues” must come again. <strong><mark>In the Church the faith remains one and the same for millennia, always equal to itself. But among those who have fallen away from the Church it changes almost daily</mark>. New heretics and sectarians constantly appear, and each of their teachers preaches differently</strong>. It is clear that <strong><mark>without the Church the teaching of Christ is lost first of all and replaced by short-lived human speculations</mark></strong>.</p>
    <p><strong>No, the faith of Christ becomes clear and definite for a man only when he sincerely believes in the Church; only then is the pearl of this faith pure, only then is it not mixed with a heap of filthy refuse of all kinds of wilful opinions and judgments. Of all this the Apostle Paul spoke already when he called the Church of the living God “the pillar and ground of the truth” (1 Tim. 3:15).</strong></p>
    <p>Thus, in separation from the Church even the Christian teaching itself turns out to be something very indefinite, elusive, constantly changing at will.</p></blockquote><p>(There is no Christianity without the Church)</p><h3>St Serafim (Sobolev) (1881–1950)</h3><blockquote><p>St Barsanuphius the Great says: “Brother, if you wish to be saved, follow the holy Fathers.” <strong><mark>The teaching of the holy Fathers of the Church is</mark> for Orthodox people the source and <mark>criterion of truth</mark></strong>, for, by the witness of St John the Prophet, the fellow-struggler of the great Barsanuphius, “the Spirit of God does not err in them (the holy Fathers); in them… is fulfilled that which is said: Thy good Spirit shall lead me into the right land” (Ps. 143:10). According to the words of St John the Prophet cited above, we must say that <strong><mark>the Holy Spirit illuminated the patristic mind and helped it to interpret the Word of God concerning the truths of our faith infallibly</mark></strong>.</p></blockquote><p>(In defence of the Sophian heresy of protopresbyter S. Bulgakov)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
