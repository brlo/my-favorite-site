  body: '<h2>Epigraph</h2><blockquote><p>And let them not flatter themselves if they
    think they have Scripture authority for their assertions, since the devil himself
    quoted Scripture, and the essence of the Scriptures is not the letter, but the
    meaning. Otherwise, if we follow the letter, we too can concoct a new dogma.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians">Blessed
    Jerome of Stridon, monk (c. 347–420) / The Dialogue Against the Luciferians</a>)</p><h2>1st
    century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr (35–107)</h3><p>He
    speaks of people who argue and refuse to believe what cannot be proved to them
    from the Old Testament Scriptures, and when it is shown to them, they go on arguing
    about the meanings of the text. St Ignatius the God-bearer answers that although
    it is written, for him Jesus Christ and His faith are more ancient (more important)
    — the faith which St Ignatius received directly from the apostles and their successors:</p><blockquote><p><em>“I
    trust [as to you] in the grace of Jesus Christ, who shall free you from every
    bond. And I exhort you </em><strong><em><mark>to do nothing out of strife, but
    according to the doctrine of Christ</mark></em></strong><em>. When I </em><strong><em><mark>heard
    some saying</mark>, “<mark>If I do not find it in the ancient Scriptures, I will
    not believe</mark></em></strong><em> the Gospel”; </em><strong><em>on my saying
    to them, It is written, they answered me, That remains to be proved. <mark>But
    to me Jesus Christ is in the place of all that is ancient</mark></em></strong><em>:
    His cross, and death, and resurrection, </em><strong><em><mark>and the faith which
    is by Him</mark></em></strong><em>, are undefiled monuments of antiquity; by which
    I desire, through your prayers, to be justified.”</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Ph#HH-8">To the Philadelphians, 8</a>)</p><h2>2nd
    century</h2><h3><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon">St Irenaeus
    of Lyons, hieromartyr (c. 130–202)</a></h3><blockquote><p><strong><mark>It is
    not only from the writings of the evangelists and the apostles that they endeavour
    to derive proofs for their opinions</mark></strong> <strong><mark>by means of
    perverse interpretations and deceitful expositions</mark></strong>: they deal
    in the same way with the law and the prophets, which contain many parables and
    allegories that can frequently be drawn into various senses, according to the
    kind of exegesis to which they are subjected. And others of them, <strong>with
    great craftiness, adapted such parts of Scripture to their own figments, lead
    away captive from the truth those who do not retain a stedfast faith</strong>
    in one God, the Father Almighty, and in one Lord Jesus Christ, the Son of God.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-3">Against Heresies,
    Book I, ch. 3.6</a>)</p><blockquote><p>…and, to use a common proverb, they strive
    to weave ropes of sand, while they <strong><mark>endeavour to adapt</mark> with
    an air of probability to their own peculiar assertions <mark>the parables of the
    Lord, the sayings of the prophets, and the words of the apostles</mark>, <mark>in
    order that their scheme may not seem altogether without support</mark>.</strong>
    In doing so, however, they disregard the order and the connection of the Scriptures,
    and so far as in them lies, dismember and destroy the truth. By transferring passages,
    and dressing them up anew, and making one thing out of another, they succeed in
    deluding many through their wicked art in adapting the oracles of the Lord to
    their opinions. Their manner of acting is just as if one, when a beautiful image
    of a king has been constructed by some skilful artist out of precious jewels,
    should then take this likeness of the man all to pieces, should rearrange the
    gems, and so fit them together as to make them into the form of a dog or of a
    fox, and even that but poorly executed; and should then maintain and declare that
    this was the beautiful image of the king which the skilful artist constructed,
    pointing to the jewels which had been admirably fitted together by the first artist
    to form the image of the king, but have been <strong>with bad effect transferred
    by the latter one to the shape of a dog, and by thus exhibiting the jewels, should
    deceive the ignorant who had no conception what a king’s form was like, and persuade
    them that that miserable likeness of the fox was, in fact, the beautiful image
    of the king</strong>. In like manner do these persons patch together old wives’
    fables, and then endeavour, by violently drawing away from their proper connection,
    words, expressions, and parables whenever found, to adapt the oracles of God to
    their baseless fictions.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-8">Against
    Heresies, Book I, ch. 8.1</a>)</p><blockquote><p>1. You see, my friend, <strong><mark>the
    method which these men employ to deceive themselves, while they abuse the Scriptures
    by endeavouring to support their own system out of them</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-9">Against Heresies,
    Book I, ch. 9.1</a>)</p><blockquote><p>1. Let us now look at the inconsistent
    opinions of those heretics (for there are some two or three of them), how <strong><mark>they
    do not agree in treating the same points</mark>, but alike, in things and names</strong>,
    set forth opinions mutually discordant.</p><p>&lt;…&gt;</p><p><strong>Every one
    of them hands it down just as his own inclination prompts</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-11">Against
    Heresies, Book I, ch. 11.1</a>)</p><blockquote><p>4. They affirm that certain
    things still, besides these, were spoken from the Pleroma, but are confuted by
    those which are referred to in the Scriptures as beating on the advent of Christ.
    But what these are [that are spoken from the Pleroma] they are not agreed, but
    <strong>give different answers regarding them</strong>. <strong>For if any one,
    wishing to test them, do question one by one with regard to any passage those
    who are their leading men, he shall find</strong> one of them referring the passage
    in question to the Propator—that is, to Bythus; another attributing it to Arche—that
    is, to the Only-begotten; another to the Father of all—that is, to the Word; while
    another, again, will say that it was spoken of that one iron who was [formed from
    the joint contributions] of the Aeons in the Pleroma; others [will regard the
    passage] as referring to Christ, while another [will refer it] to the Saviour.
    One, again, more skilled than these, after a long protracted silence, declares
    that it was spoken of Horos; another that it signifies the Sophia which is within
    the Pleroma; another that it announces the mother outside the Pleroma; while another
    will mention the God who made the world (the Demiurge). Such are the <strong><mark>variations
    existing among them with regard to one [passage], holding discordant opinions
    as to the same Scriptures</mark></strong>;</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-35">Against
    Heresies, Book IV, ch. 35.4</a>)</p><h3>Clement of Alexandria, presbyter (150–215)</h3><blockquote><p><em>Those,
    then, </em><strong><em>that adhere to impious words, and dictate them to others,
    <mark>inasmuch as they do not make a right but a perverse use of the divine words</mark></em></strong><em>,
    neither themselves enter into the kingdom of heaven, nor permit those whom they
    have deluded to attain the truth. (2) But </em><strong><em><mark>not having the
    key of entrance</mark>, but a false (and as the common phrase expresses it), a
    counterfeit key (ἀντικλεῖς), by which they do not enter in as we enter in, <mark>through
    the tradition of the Lord</mark></em></strong><em>, by drawing aside the curtain;
    but bursting through the side-door, and digging clandestinely through the wall
    of the Church, and stepping over the truth, they constitute themselves the Mystagogues
    of the soul of the impious.</em></p></blockquote><p>(The Stromata, Book VII)</p><h2>4th
    century</h2><h3>St Athanasius the Great (c. 295–373)</h3><blockquote><p><em>For
    those who are thus disposed, and fashion themselves </em><strong><em>according
    to the Gospel, <mark>will be partakers of Christ, and imitators of apostolic conversation</mark></em></strong><em>,
    on account of which they </em><strong><em>shall be deemed worthy of that praise
    from him</em></strong><em>, with which he praised the Corinthians, when he said,
    “I praise you that in everything ye are mindful of me (1 Cor. 11:2).” </em><strong><em><mark>Afterwards,
    because there were men who used his words, but chose to hear them as suited their
    lusts</mark></em></strong><em> (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L3"><em>2
    Tim. 4:3</em></a><em>) and dared to pervert them, as the followers of Hymenæus
    and Alexander, and before them the Sadducees, who as he said, “having made shipwreck
    of faith,” scoffed at the mystery of the resurrection, he immediately proceeded
    to say, “</em><strong><em><mark>And as I have delivered to you traditions, hold
    them fast</mark></em></strong><em> (1 Tim. 1:19; 2 Tim. 2:18; 1 Cor. 11:2).” </em><strong><em><mark>That
    means, indeed, that we should think not otherwise than as the teacher has delivered</mark></em></strong><em>.</em></p><p><em>6.
    </em><strong><em><mark>For not only in outward form did those wicked men dissemble</mark></em></strong><em>,
    putting on as the Lord says sheep’s clothing, and appearing like unto whited sepulchres;
    but they </em><strong><em><mark>took those divine words in their mouth, while
    they inwardly cherished evil intentions</mark>. And the first to put on this appearance
    was the serpent, the inventor of wickedness from the beginning—the devil,—who,
    in disguise, conversed with Eve, and forthwith deceived her</em></strong><em>.
    But after him and with him </em><strong><em><mark>are all inventors of unlawful
    heresies</mark>, <mark>who indeed refer to the Scriptures, but do not hold such
    opinions as the saints have handed down, and receiving them as the traditions
    of men, err, because they do not rightly know them nor their (Matt. 22:29) power</mark></em></strong><em>.
    Therefore Paul justly </em><strong><em><mark>praises the Corinthians (1 Cor. 11:2),
    because their opinions were in accordance with his </mark><u><mark>traditions</mark></u></em></strong><em>.
    And the Lord most righteously reproved the Jews, saying, “Wherefore do ye also
    transgress the commandments of God on account of your traditions (Matt. 15:3).”
    For they changed the commandments they received from God after their own understanding,
    preferring to observe the traditions of men. And about these, a little after,
    the blessed Paul again gave directions to the Galatians who were in danger thereof,
    writing to them, “If any man preach to you aught else than that ye have received,
    let him be accursed (Gal. 1:9).”</em></p><p><em>7. For </em><strong><em><mark>there
    is no fellowship whatever between the words of the saints and the fancies of human
    invention; for the saints are the ministers of the truth, preaching the kingdom
    of heaven</mark></em></strong><em>, but those who are borne in the opposite direction
    have nothing better than to eat, and think their end is that they shall cease
    to be, and they say, “Let us eat and drink, for to-morrow we die (Isa. 22:13).”
    </em><strong><em><mark>Therefore blessed Luke reproves the inventions of men,
    and hands down the narrations of the saints</mark></em></strong><em>, saying in
    the beginning of the Gospel, “Since many have presumed to write narrations of
    those events of which we are assured, </em><strong><em><mark>as those who from
    the beginning were witnesses</mark></em></strong><em> and ministers of the Word
    have delivered to us; it hath seemed good to me also, who have adhered to them
    all from the first, to write correctly in order to thee, O excellent Theophilus,
    that thou mayest know the truth concerning the things in which thou hast been
    instructed (Luke 1:1).” For </em><strong><em><mark>as each of the saints has received,
    that they impart without alteration</mark></em></strong><em>, for the confirmation
    of the doctrine of the mysteries. Of these the (divine) word would have us disciples,
    and these should of right be our teachers, and to them only is it necessary to
    give heed, for of them only is “the word faithful and worthy of all acceptation
    (1 Tim. 1:15);” these not being disciples because they heard from others, but
    being eye-witnesses and ministers of the Word, that which they had heard from
    Him have they handed down.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-the-festal-letters-1">Second
    Festal Letter (330)</a>)</p><h2>5th century</h2><h3>Blessed Jerome of Stridon,
    monk (c. 347–420)</h3><blockquote><p><em>But as we have already had a long discussion
    and the protracted controversy has wearied out the attention of our audience,
    I will tell you my opinion briefly and without reserve. </em><strong><em><mark>We
    ought to remain in that Church which was founded by the Apostles and continues
    to this day</mark>. <mark>If ever you hear of any that are called Christians taking
    their name not from the Lord Jesus Christ, but from some other</mark>, for instance,
    Marcionites, Valentinians, Men of the mountain or the plain, you may be sure that
    you have there not the Church of Christ, but the synagogue of Antichrist. For
    the fact that <mark>they took their rise after</mark> the foundation of the Church
    is proof that they are those whose coming the Apostle foretold</em></strong><em>.
    </em><strong><em><mark>And let them not flatter themselves if they think they
    have Scripture authority for their assertions, since the devil himself quoted
    Scripture, and the essence of the Scriptures is not the letter, but the meaning.
    Otherwise, if we follow </mark><u><mark>the letter</mark></u><mark>, we too can
    concoct a new dogma</mark></em></strong><em> and assert that such persons as wear
    shoes and have two coats must not be received into the Church.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians">The
    Dialogue Against the Luciferians</a>)</p><h3>St Cyril of Alexandria, archbishop
    (376–444)</h3><blockquote><p>And as for the fact that certain of those who are
    wont to break what is right <strong><mark>turn my words as they please</mark></strong>,
    let not your Holiness be surprised at this, knowing that <strong><mark>the followers
    of any heresy find support for their errors even in the sacred Scripture, perverting
    by a corrupt understanding what is rightly said in it by the Holy Spirit</mark></strong>,
    and thus gathering upon their head unquenchable coal.</p></blockquote><p>(Letter
    to John of Antioch)</p><h3>St Vincent of Lérins, monk († before 450)</h3><blockquote><p>But
    when <strong><mark>they began to interpret in different senses the passages which
    both had agreed in appealing to</mark></strong>, then were discerned the guileless
    from the crafty, the genuine from the counterfeit, the straight from the crooked,
    then, in one word, the true apostles from the false apostles. And no wonder, he
    says, for <strong><mark>Satan himself transforms himself into an angel of light</mark></strong>.
    It is no marvel then if <strong><mark>his servants are transformed as the servants
    of righteousness</mark></strong> (2 Cor. 11:14–15). Therefore, according to the
    authority of the Apostle Paul, <strong>as often as either false apostles or false
    teachers cite passages from the Divine Law, by means of which, misinterpreted,
    they seek to prop up their own errors, there is no doubt that they are following
    the cunning devices of their father, which assuredly he would never have devised,
    but that he knew that where he could fraudulently and by stealth introduce error,
    there is no easier way of effecting his impious purpose than by <mark>pretending
    the authority of Holy Scripture</mark>.</strong></p><p>But some one will say,
    What proof have we that <strong>the Devil is wont to appeal to Holy Scripture</strong>?
    Let him read the Gospels wherein it is written, “Then the Devil took Him (the
    Lord the Saviour) and set Him upon a pinnacle of the Temple, and said to Him:
    If you be the Son of God, cast yourself down, for it is written, He shall give
    His angels charge concerning you, that they may keep you in all your ways: In
    their hands they shall bear you up, lest perchance you dash your foot against
    a stone” (Matt. 4:5–6; Luke 4:9–11). What sort of treatment must men, insignificant
    wretches that they are, look for at the hands of him who assailed even the Lord
    of Glory with quotations from Scripture? “If you be the Son of God,” says he,
    “cast yourself down.” Wherefore? “For,” says he, “it is written.” It behooves
    us to pay special attention to this passage and bear it in mind, that, warned
    by so important an instance of Evangelical authority, <strong>we may be assured
    beyond doubt, when we find people alleging passages from the Apostles or Prophets
    against the Catholic Faith, that the Devil speaks through their mouths. For <mark>as
    then the Head spoke to the Head, so now also the members speak to the members,
    the members of the Devil to the members of Christ</mark>, misbelievers to believers,
    sacrilegious to religious, <mark>in one word, Heretics to Catholics</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies#HH-25">The
    Commonitory of Vincent of Lérins, chapters 25–26</a>)</p><h2>7th century</h2><h3>The
    Sixth Œcumenical Council (691)</h3><blockquote><p><em>It behoves those who preside
    over the churches, every day but especially on Lord’s days, </em><strong><em>to
    teach all the clergy and people words of piety and of right religion, gathering
    out of holy Scripture meditations and determinations of the truth, and <mark>not
    going beyond the limits now fixed, nor varying from the tradition of the God-bearing
    fathers</mark>. And if any controversy in regard to Scripture shall have been
    raised, <mark>let them not interpret it otherwise than as the lights and doctors
    of the church in their writings have expounded it</mark>, and in those let them
    glory rather than in composing things out of their own heads,</em></strong><em>
    </em><strong><em><mark>lest</mark></em></strong><em> through their lack of skill
    </em><strong><em><mark>they may have departed from what was fitting</mark></em></strong><em>.
    </em><strong><em>For through the doctrine of the aforesaid fathers, the people
    coming to the knowledge</em></strong><em> of what is good and desirable, as well
    as what is useless and to be rejected, will remodel their life for the better,
    and not be led by ignorance, but applying their minds to the doctrine, they will
    take heed that no evil befall them and work out their salvation in fear of impending
    punishment.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-council-in-trullo-quinisext#HH-Canon-XIX">Canon
    19 of the Sixth Œcumenical Council</a>)</p><h2>8th century</h2><h3><a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787">The
    Seventh Ecumenical Council (787)</a></h3><blockquote><p>Let no one be surprised
    that <strong>some, striving to distort, according to their own judgement, the
    right teaching, make use of the words of Scripture for this purpose. Even the
    originators of heresies gather occasions for their error from the God-inspired
    Scripture; by their impious reasonings they distort what was rightly spoken by
    the Holy Spirit.</strong> This was proclaimed also by Peter, that highest trumpet
    of the apostles; he says: <strong>“which the unlearned and unstable pervert (2
    Pet. 3:16) according to their own desire”; for it is characteristic of heretics
    to distort, according to their own desire, the meaning of the true and divine
    dogmas.</strong> Thus the saying: “The Lord created me (possessed me) as the beginning
    of His ways for His works” (Prov. 8:22), the holy fathers ordinarily take as referring
    to the economy of the incarnation of Christ, while Arius, Eunomius and their followers
    took it as referring to the highest divine generation, and therefore departed
    from the true meaning. Likewise Apollinarius, having badly understood the meaning
    of the Gospel saying: “No one has ascended into heaven except He who came down
    from heaven, the Son of Man” (John 3:13), fell into indecency, saying that God
    came down from heaven with the flesh which He had also in heaven, as pre-eternal
    and consubstantial with Himself. He distorted also, according to his own judgement,
    the apostolic saying which declares: “The second Man is the Lord from heaven”
    (1 Cor. 15:47). <strong>There is nothing surprising if these heretics also, holding
    to their empty lie, bring us proofs from the divine Scripture; for they have learned
    to do this from their teachers.</strong></p></blockquote><p>(The Seventh Ecumenical
    Council, Act 6)</p><h2>Answers to criticism</h2><p>Quotes of St John Chrysostom:
    article.</p><p>Quotes of St Cyril of Jerusalem: article.</p><p>Quotes of St Basil
    the Great: article.</p><p>Quotes of St John of Damascus: article.</p>'
