    priority: 11
  body: '<h2>4th century</h2><h3>Eusebius of Caesarea (Pamphili) (c. 258–340)</h3><p>About
    the holy Ignatius the God-bearer:</p><blockquote><p>Ignatius, who was chosen bishop
    of Antioch, second in succession to Peter, and whose fame is still celebrated
    by a great many. 3. Report says that he was sent from Syria to Rome, and became
    food for wild beasts on account of his testimony to Christ. 4. And as he made
    the journey through Asia under the strictest military surveillance, he fortified
    the parishes in the various cities where he stopped by oral homilies and exhortations,
    and <strong>warned them above all to be especially on their guard against the
    heresies that were then beginning to prevail, and <mark>exhorted them to hold
    fast to the tradition of the apostles</mark></strong>. Moreover, he thought it
    necessary to attest that tradition in writing, and to give it a fixed form for
    the sake of greater security.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">Church
    History, Book III, ch. 36</a>)</p><h2>5th century</h2><h3>Vincent of Lérins, monk
    († before 450)</h3><blockquote><p>XXII. But it is worthwhile to expound the whole
    of that passage of the apostle more fully, O Timothy, keep the deposit, avoiding
    profane novelties of words. O! The exclamation implies fore-knowledge as well
    as charity. For he mourned in anticipation over the errors which he foresaw. Who
    is the Timothy of today, but either generally the Universal Church, or in particular,
    the whole body of The Prelacy, whom it behooves either themselves to possess or
    to communicate to others a complete knowledge of religion? What is Keep the deposit?
    Keep it, because of thieves, because of adversaries, lest, while men sleep, they
    sow tares over that good wheat which the Son of Man had sown in his field. <strong><mark>Keep
    the deposit. What is The deposit? That which has been entrusted to you, not that
    which you have yourself devised: a matter not of wit, but of learning; not of
    private adoption, but of public tradition; a matter brought to you, not put forth
    by you, wherein you are bound to be not an author but a keeper, not a teacher
    but a disciple, not a leader but a follower. Keep the deposit. Preserve the talent
    of Catholic Faith inviolate, unadulterate. That which has been entrusted to you,
    let it continue in your possession, let it be handed on by you.</mark></strong>
    You have received gold; give gold in turn. Do not substitute one thing for another.
    Do not for gold impudently substitute lead or brass. Give real gold, not counterfeit.
    O Timothy! O Priest! O Expositor! O Doctor! If the divine gift has qualified you
    by wit, by skill, by learning, be a Bazaleel of the spiritual tabernacle, engrave
    the precious gems of divine doctrine, fit them in accurately, adorn them skilfully,
    add splendor, grace, beauty. Let that which formerly was believed, though imperfectly
    apprehended, as expounded by you be clearly understood. Let posterity welcome,
    understood through your exposition, what antiquity venerated without understanding.
    Yet teach still the same truths which you have learned, so that though you speak
    after a new fashion, what you speak may not be new.</p><p>XXIII. But someone will
    say, perhaps, Shall there, then, be no progress in Christ’s Church? Certainly;
    all possible progress. For what being is there, so envious of men, so full of
    hatred to God, who would seek to forbid it? <strong>Yet on condition that it be
    real progress, not alteration of the faith. For progress requires that the subject
    be enlarged in itself, alteration, that it be transformed into something else.</strong>
    The intelligence, then, the knowledge, the wisdom, as well of individuals as of
    all, as well of one man as of the whole Church, ought, in the course of ages and
    centuries, to increase and make much and vigorous progress; but yet only in its
    own kind; that is to say, in the same doctrine, in the same sense, and in the
    same meaning.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies#HH-22">The
    Commonitory of Vincent of Lérins, chapters 22–23</a>)</p><h2>20th century</h2><h3>Archpriest
    Dmitry Vladykov (1863–1955)</h3><blockquote><p>“Do what you have learned, received,
    heard, and seen in me, and the God of peace will be with you” (Phil. 4:9). “O
    Timothy, guard what has been entrusted to you” (1 Tim. 6:20). “Do not diminish
    it,” St John Chrysostom explains, “for it is not yours; it is another’s deposit
    entrusted to you; do not subtract from it.”</p><p>“What is Guard what has been
    entrusted to you? It means, writes Vincent of Lérins, “keep watch, for there are
    thieves, there are enemies, lest while men sleep they sow tares over that good
    wheat which the Son of Man sowed in his field (Matt. 13:37–39). Keep the deposit,
    he says. What is the deposit? That which has been entrusted to you, not that which
    you have invented; what you have received, not what you have devised; a matter
    not of wit, but of teaching; not of private possession, but of public tradition
    — a matter that has come down to you, not discovered by you, in relation to which
    you must be not an inventor but a guardian, not a founder but a follower, not
    a leader but one led. Guard what has been entrusted to you, that is, preserve
    the talent of the universal faith whole and unimpaired. What has been entrusted
    to you, let it remain with you, that you hand it on. You have received gold; give
    gold in return.” — “Therefore, brethren, stand firm and hold the traditions which
    you have been taught, whether by word or by our epistle” (2 Thess. 2:15). “From
    this it is evident,” St John Chrysostom teaches, “that the apostles did not deliver
    everything through their Epistles, but much they communicated without writing;
    and both are equally trustworthy. Therefore we must also acknowledge church tradition
    as trustworthy. <strong>There is tradition — seek nothing more</strong>.”</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
- src: удаление_от_еретиков
  path: отход-от-еретиков
  title: Departing from heretics (the violators of the Tradition)
  meta_desc: Quotes of the holy Fathers of the 1st–20th centuries on departing from
    heretics and violators of the apostolic Tradition, from Ignatius the God-bearer
    and Justin to St Luke of Crimea and Joseph the Hesychast.
  menu:
    parent: Holy Scripture
    title: Departing from heretics
    priority: 13
  body: '<h3>Scripture</h3><blockquote><p>“Blessed is the man who walks not in the
    counsel of the ungodly, nor stands in the path of sinners, nor sits in the seat
    of the scornful; but his delight is in the law of the LORD, and in His law he
    meditates day and night!” (Ps. 1:1-2)</p></blockquote><blockquote><p>“Do not enter
    the path of the wicked, and do not walk in the way of evil. Avoid it, do not travel
    on it; turn away from it and pass on. For they do not sleep unless they have done
    evil; and their sleep is taken away unless they make someone fall.” (Prov. 4:14-16)</p></blockquote><blockquote><p>“A
    foolish woman is clamorous; she is simple, and knows nothing. For she sits at
    the door of her house, on a seat by the highest places of the city, to call to
    those who pass by, who go straight on their way: ‘Whoever is simple, let him turn
    in here’; and as for him who lacks understanding, she says to him, ‘Stolen water
    is sweet, and bread eaten in secret is pleasant.’ But he does not know that the
    dead are there, that her guests are in the depths of hell. But you listen to me,
    and do not hasten along the path by which evildoers go, that you may live long,
    and your years be added to your life.” (Prov. 9:13-18)</p></blockquote><blockquote><p>“Cease
    listening to instruction, my son, and you will stray from the words of knowledge.”
    (Prov. 19:27)</p></blockquote><blockquote><p>“Talk little with the senseless,
    and do not go to visit the fool; for you would be harmed by their contact, and
    be snared by their deeds. Beware of them, for they are evil; avoid their touch,
    and you will find peace, and not be harmed by their madness.” (Sir. 22:12-14)</p></blockquote><blockquote><p>“Moreover
    if your brother sins against you, go and tell him his fault between you and him
    alone. If he hears you, you have gained your brother. But if he will not hear,
    take with you one or two more, that by the mouth of two or three witnesses every
    word may be established. And if he refuses to hear them, tell it to the church.
    But if he refuses even to hear the church, let him be to you like a heathen and
    a tax collector.” (Matt. 18:15-17)</p></blockquote><blockquote><p>“But we command
    you, brethren, in the name of our Lord Jesus Christ, that you withdraw from every
    brother who walks disorderly and not according to the tradition which he received
    from us.” (2 Thess. 3:6)</p></blockquote><blockquote><p>“Reject a divisive man
    after the first and second admonition, knowing that such a person is warped and
    sinning, being self-condemned.” (Tit. 3:10-11)</p></blockquote><blockquote><p>“If
    anyone comes to you and does not bring this doctrine, do not receive him into
    your house nor greet him; for he who greets him shares in his evil deeds.” (2
    John 1:10-11)</p></blockquote><h2>1st century</h2><h3>St Ignatius the God-bearer,
    bishop of Antioch, hieromartyr (35–107)</h3><blockquote><p>“Nevertheless, <strong><mark>I
    have heard of some who have passed on from this to you, having false doctrine,
    whom ye did not suffer to sow among you, but stopped your ears</mark></strong>,
    that ye might not receive those things which were sown by them, as being stones
    of the temple of the Father, prepared for the building of God the Father… because
    with respect to your Christian life ye love nothing but God only.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-9">To the Ephesians, 9</a>)</p><blockquote><p>“I
    therefore, yet not I, but the love of Jesus Christ, entreat you that ye use Christian
    nourishment only, and <strong><mark>abstain from herbage of a different kind;
    I mean heresy. For those [that are given to this] mix up Jesus Christ with their
    own poison</mark></strong>, speaking things which are unworthy of credit, like
    those who administer a deadly drug in sweet wine, which he who is ignorant of
    does greedily take, with a fatal pleasure leading to his own death.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-6">To the Trallians, 6</a>)</p><blockquote><p>“It
    is therefore necessary that ye do nothing without the bishop… <strong>Flee, therefore,
    <mark>those evil offshoots</mark></strong> [of Satan], which produce death-bearing
    fruit, whereof if any one tastes, he instantly dies. For <strong><mark>these men
    are not the planting of the Father</mark></strong>. If they were, they would appear
    as branches of the cross, and their fruit would be incorruptible.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-11">To the Trallians, 11</a>)</p><blockquote><p>“I
    give you these instructions, beloved, assured that ye also hold the same opinions
    [as I do]. But <strong><mark>I guard you beforehand from those beasts in the shape
    of men, whom you must not only not receive, but, if it be possible, not even meet
    with</mark></strong>; only you must pray to God for them, if by any means they
    may be brought to repentance, which, however, will be very difficult. Yet Jesus
    Christ, who is our true life, has the power of [effecting] this.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-4">To the Smyrnaeans, 4</a>)</p><h2>2nd
    century</h2><h3>Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><strong><mark>“The
    fact that there are such men confessing themselves to be Christians, and admitting
    the crucified Jesus to be both Lord and Christ</mark></strong>, yet not teaching
    His doctrines, but those of the spirits of error, causes us who are disciples
    of the true and pure doctrine of Jesus Christ, to be more faithful and stedfast
    in the hope announced by Him.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho, 35</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>“If
    any one were to preach to these men the inventions of the heretics, speaking to
    them in their own language, they would at once <strong><mark>stop their ears,
    and flee as far off as possible, not enduring even to listen to the blasphemous
    address</mark></strong>. Thus, <strong>by means of that ancient tradition of the
    apostles, <mark>they do not suffer their mind to conceive anything of the portentous
    language of these teachers</mark></strong>, among whom neither Church nor doctrine
    has ever been established.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against
    Heresies, Book III, ch. 4</a>)</p><blockquote><p>Those, therefore, who desert
    the preaching of the Church, call in question the knowledge of the holy presbyters,
    not taking into consideration of how much greater consequence is a religious man,
    even in a private station, than a blasphemous and impudent sophist. <strong><mark>It
    behoves us, therefore, to avoid their doctrines, and to take careful heed lest
    we suffer any injury from them</mark></strong>; but to flee to the Church, and
    be brought up in her bosom, and be nourished with the Lord’s Scriptures.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against
    Heresies, Book V, ch. 20</a>)</p><h2>4th century</h2><h3>St Athanasius the Great
    (c. 295–373)</h3><blockquote><p>And he was altogether wonderful in faith and religious,
    for he never held communion with the Meletian schismatics, knowing their wickedness
    and apostacy from the beginning; nor had he friendly dealings with the Manichæans
    or any other heretics; or, if he had, only as far as advice that they should change
    to piety. For <strong>he thought and asserted that <mark>intercourse with these
    was harmful and destructive to the soul</mark></strong>. In the same manner also
    he loathed the heresy of the Arians, and exhorted all neither to approach them
    nor to hold their erroneous belief. And once when certain Arian madmen came to
    him, when he had questioned them and learned their impiety, he drove them from
    the mountain, saying <strong>that <mark>their words were worse than the poison
    of serpents</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/pOY3_Life_of_St_Anthony">Life
    of St. Anthony, ch. 68</a>)</p><h3>Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p>Woe
    to those who defile the holy faith with heresies and come into agreement with
    heretics!</p></blockquote><p>(Homily on the Second Coming of our Lord Jesus Christ)</p><h3>Cyril
    of Jerusalem, bishop (315–386)</h3><blockquote><p><strong><mark>We have need therefore
    of divine grace</mark></strong>, and of a sober mind, and <strong><mark>of eyes
    that see, lest from eating tares as wheat we suffer harm from ignorance</mark></strong>,
    and lest from taking the wolf to be a sheep we become his prey, and from supposing
    the destroying Devil to be a beneficent Angel we be devoured: for, as the Scripture
    saith, he goeth about as a roaring lion, seeking whom he may devour (1 Pet. 5:8).
    This is the cause of the Church’s admonitions, the cause of the present instructions,
    and of the lessons which are read. &lt;…&gt; Since <mark>there are many that make
    spoil</mark> through <mark>philosophy</mark> and vain deceit (Col. 2:8). <mark>The
    Greeks</mark> on the one hand draw men away by their smooth tongue, for honey
    droppeth from a harlot’s lips (Prov. 5:3): whereas <mark>they of the Circumcision</mark>
    deceive those who come to them by means of the Divine Scriptures, which they miserably
    misinterpret though studying them from childhood to old age, and growing old in
    ignorance. But <mark>the children of heretics</mark>, by their good words and
    smooth tongue, deceive the hearts of the innocent, disguising with the name of
    Christ as it were with honey the poisoned arrows of their impious doctrines: concerning
    all of whom together the Lord saith, Take heed lest any man mislead you (Matt.
    24:4). This is the reason for the teaching of the Creed and for expositions upon
    it.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1">The
    Catechetical Lectures, Lecture IV</a>)</p><h3>Isidore of Pelusium, monk (350–435)</h3><blockquote><p>As
    sea-traders conceal the bait under the appearance of food and unexpectedly catch
    the fish, so the cunning champions of heresies, covering their worthless thoughts
    with a fair word, draw the simple away to death as with a fish-hook.</p></blockquote><p>(Letters,
    To Timothy the Reader)</p><h3>Abba Isaiah of Scetis, monk and hermit (4th–5th
    c.)</h3><blockquote><p>Beware of conversing with heretics in your desire to defend
    the faith, lest the poison of their corrupt words should sting even yourself.</p></blockquote><p>(Ascetic
    Discourses, Discourse Three: On compunction)</p><h2>6th century</h2><h3>Barsanuphius
    the Great and John the Prophet, monks (6th c.)</h3><p>In their works is cited
    the saints’ saying:</p><blockquote><p>“When you see someone drowning in a river,
    do not give him your hand, lest he drag you down with him; but hold out your staff,
    and if you can save him by means of the staff, that is well; if not, let go of
    the staff, lest you perish together with the drowning man.”</p></blockquote><p>(Guidance
    Towards Spiritual Life: Answers to the Questions of Disciples)</p><h2>7th century</h2><h3>John
    Climacus, monk (c. 579–649)</h3><blockquote><p>78. The reading of the Holy Scriptures
    can greatly enlighten and gather the mind; for they are the words of the Holy
    Spirit, and instruct the readers in every way. Being a man of action, read the
    practical books of the Fathers; for when this is done in deed, the reading of
    the rest becomes superfluous. Seek to learn the understanding and the way of salvation
    more from labour than from books alone. Before you have received spiritual power,
    do not read books of a faith other than the Orthodox, for they are full of darkness,
    and darken the minds of the weak.</p></blockquote><p>(The Ladder of Divine Ascent)</p><h2>11th
    century</h2><h3>Theodosius of the Kiev Caves, monk (c. 1008–1074)</h3><blockquote><p>Beware,
    my child, of the perverters of the faith and of all their conversations, for our
    land too has been filled with them. If anyone saves his soul, it is only by living
    in the Orthodox faith, for there is no faith better than our pure, holy, Orthodox
    one. Living in this Faith you will not only be delivered from sins and eternal
    torment, but will become a partaker of eternal life and will rejoice without end
    with the Saints. But those who live in another faith will not see eternal life.
    Nor should you, my child, praise a foreign faith. He who praises a foreign faith
    is the same as one who blasphemes his own. If anyone praises his own and a foreign
    one, he is double-minded and close to heresy. Therefore, my child, beware of them
    and always stand firm for your Faith.</p></blockquote><p>(The Testament to the
    Kiev Prince Izyaslav on the Orthodox Christian faith)</p><h2>12th century</h2><h3>Peter
    of Damascus, monk († 12th c.)</h3><blockquote><p>When the Lord, says the great
    Basil, finds a heart pure from all worldly things and teachings, then He writes
    His teachings upon it as on a clean tablet. I say this in order that no one should
    read what does not serve to please God, and if he ever reads such things through
    ignorance, let him strive rather to blot out the memory of them with the spiritual
    reading of the Divine Scriptures, and with what serves most for the salvation
    of his soul, according to the state which he has reached. If he is still a man
    of action, let him read the lives and sayings of the holy Fathers; but if by grace
    he has been raised to spiritual knowledge, let him read all the Divine Scriptures,
    as one able, by the word of the Apostle, to “demolish every high thing that exalts
    itself against the knowledge of God” (2 Cor. 10:5) and to guard against every
    disobedience and transgression by the practice and true knowledge of the Divine
    commandments and the teachings of Christ. And apart from the Divine Scriptures
    let him read nothing at all. What need is there to receive an unclean spirit instead
    of the Holy Spirit? For in whatever word a man exercises himself, he appropriates
    the spirit of that word, even though this may not appear wrong to him, as those
    with experience can see.</p></blockquote><p>(The Philokalia, Book I: On discernment)</p><h2>14th
    century</h2><h3>Gregory (Palamas), bishop (c. 1296–1357)</h3><blockquote><p>Therefore
    their assertion is a blasphemy and consonant with the heresy of Eunomius, since
    they [like him] say that the essence of God becomes visible through creatures.
    And in this way the field of their ungodliness brings forth abundant fruit. Consequently,
    [every pious man] must avoid them and [altogether shun all] communion with them.
    One must flee from them as from a soul-destroying many-headed hydra and the manifold
    ruin of piety.</p></blockquote><p>(The One Hundred and Fifty Chapters, ch. 35)</p><h2>18th
    century</h2><h3>St Tikhon of Zadonsk (Sokolov) (1724–1783)</h3><blockquote><p>Q.
    What are the commandments of the Church? A. The Orthodox Confession of the Catholic
    and Apostolic Eastern Church points out nine of the most important commandments
    of the Church. &lt;…&gt; The fifth [commandment]: that those inexperienced in
    the knowledge of the holy Scriptures and the sciences should not read books written
    by heretics, should not listen to their blasphemous teaching and should have no
    contact with them.</p></blockquote><p>(On the truths of the Orthodox-Christian
    faith)</p><blockquote><p>Q. What counsels does St Tikhon give concerning the reading
    of books for the study of Christian truths? A. There is no profit, he says, in
    reading a book and not doing what the book teaches. Therefore the reader of a
    book must observe the following: 1) he must read above all the holy Scriptures,
    and after them other Christian Orthodox books — reading not many sheets and pages;
    for one who has read much cannot understand everything and keep it in memory.
    2) Read little and reason much on what is read. For in this way what is read is
    better understood and deepened in the memory, and thereby the mind is enlightened.</p></blockquote><p>(On
    the truths of the Orthodox-Christian faith and of the Church)</p><h2>19th century</h2><h3>St
    Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>“Keep your mind
    and heart from the teaching of falsehood. Do not speak about Christianity with
    people infected with false thoughts; do not read books about Christianity written
    by false teachers. The Holy Spirit accompanies Truth: He is the Spirit of Truth.
    The spirit of the devil accompanies falsehood and assists it, who is a lie and
    the father of lies. He who reads the books of false teachers partakes certainly
    of the wicked, dark spirit of falsehood. Let this not seem strange or incredible
    to you: so affirm the luminaries of the Church — the holy Fathers. (“Let no one
    read, said the hieromartyr Peter of Damascus, what does not serve to please God.
    If ever he does read such a thing through ignorance, let him strive rather to
    blot it out of his memory by the reading of the Divine Scriptures — and precisely
    those which serve most for the salvation of his soul, according to the state he
    has attained… And let him by no means read books opposed to this. What need is
    there to receive an unclean spirit instead of the Holy Spirit? In whatever word
    a man exercises himself, he acquires the character of that word, though the inexperienced
    do not see this, as those with spiritual experience do.”) The great servants of
    God, who knew the weakness common to all men, feared the poison of heresy and
    falsehood, and therefore avoided with all care conversations with people infected
    with false teaching. … Both I and you must guard against reading books composed
    by false teachers. To everyone who does not belong to the Eastern Church, the
    one holy Church, who writes about Christ, about the Christian faith and morals,
    belongs the name of a false teacher.”</p></blockquote><p>(Ascetic Experiences,
    Volume 1, ch. 7)</p><h3>Innocent (Veniaminov), Metropolitan of Moscow, saint (1797–1879)</h3><blockquote><p>There
    are many books in the world called useful and soul-saving; but only those are
    worthy of that name which are founded on Holy Scripture and agree with the teaching
    of our Orthodox Church; and therefore such books may and should be read, but one
    must be careful in choosing them, lest sometimes, under the appearance of a soul-saving
    book, you come upon one that can destroy your soul.</p></blockquote><p>(Works
    of Innocent Metropolitan of Moscow. Book One)</p><h3>St Theophan the Recluse (1815–1894)</h3><blockquote><p>By
    the thorns and briers that choke the word of divine truth — besides riches, pleasures
    and the cares of life — in our time we must also understand the various false
    teachings spread by learned men who have lost the truth and strayed from the path
    to it. Many such teachings are disseminated among us: some openly and publicly
    oppose the truth; others do so under conditional hints, comprehensible however
    to those at whom they are aimed. In essence they act like fumes: entering imperceptibly,
    they cloud the head and bring a loss of clear consciousness of everything around.
    Whoever takes in these fumes begins to rave like a sleeper, for everything appears
    to him not at all as it is and as it appears to one in a sound mind. Meeting such
    a person, you see that in him not only is all truth suppressed, but the very sense
    of truth is stifled, and falsehood has penetrated into all the members of his
    mind. What is to be done? Do not listen to and do not read such ravings; and when
    you have involuntarily heard or read something, cast it out of your mind; and
    when it will not be cast out, bring it to reason, and everything will fly away
    like smoke.</p></blockquote><p>(Thoughts for Each Day of the Year, according to
    the readings of the Word of God)</p><h2>20th century</h2><h3>St Luke (Voyno-Yasenetsky),
    archbishop (1877–1961)</h3><blockquote><p>What could be more terrible? I do not
    know. I can only beseech you, as the holy Apostle Paul besought you, to beware
    of these ravening beasts, to beware of those who cause divisions, never to go
    to their assemblies — otherwise you will be poisoned by their venom. Fear as fire
    communion with heretics, communion with sectarians. Hold to the faith which the
    holy Church teaches us — the faith of the Gospel, the faith of Christ, the apostolic
    faith. And the Lord Jesus Christ will save you. Amen.</p></blockquote><p>(The
    Triumph of Orthodoxy, 1945)</p><blockquote><p>The Baptists are especially cunning
    and flatter your hearing especially subtly. They pretend to be holy, captivate
    you with love and attention, entangle you in their nets — and in these nets you
    perish.</p></blockquote><p>(The Triumph of Orthodoxy, 1945)</p><blockquote><p>We
    Orthodox Christians all bless the Most Holy Virgin Mary according to the teaching
    of Holy Scripture, but we must say with pain that the enemies of Christ’s Church
    — Protestants, sectarians and other heretics — do not share in this praise of
    the Orthodox world. &lt;…&gt; May the Lord forbid it to them! And to all of us
    may He forbid any communion with the sectarians, lest they lead us onto the path
    of perdition. And may the Most Holy Mother of God, whose greatest feast we celebrate
    today, save us all from the devil and all his servants. Amen.</p></blockquote><p>(Bring
    to Thee our love. Sermons on the Annunciation of the Most Holy Mother of God,
    I)</p><h3>Nikolai Varzhansky, martyr (1881–1918)</h3><blockquote><p>“And surely
    many will fall into their [the sectarians’] nets. How can this be avoided? 1)
    Be within the bosom of Christ’s Church. 2) Study the Word of God yourself, so
    as to know what is said in this or that text. 3) If possible avoid meetings and
    debates with sectarians if you are not sure that you can convince the one in error.”</p></blockquote><p>(Good
    Confession, ch. 31)</p><h3>Joseph the Hesychast (Kottis), monk (1899–1959)</h3><blockquote><p>Be
    very careful with the heretics, my child. Where you are now — strange tribes and
    tongues. Do not speak with them at all, for your pure soul is defiled by their
    blasphemous words. They have been excommunicated by our Orthodox Church.</p></blockquote><p>(Letters,
    80)</p><h2>An example from Scripture</h2><p>The foremother Eve, at her meeting
    with the devil, entered into communion with him, was deceived and fell:</p><blockquote><p>“Now
    the serpent was more cunning than any beast of the field which the LORD God had
    made. And he said to the woman, ‘Has God indeed said, You shall not eat of every
    tree of the garden?’ And the woman said to the serpent, ‘We may eat the fruit
    of the trees of the garden; but of the fruit of the tree which is in the midst
    of the garden, God has said, You shall not eat it, nor shall you touch it, lest
    you die.’ And the serpent said to the woman, ‘You will not surely die.’” (Gen.
    3:1-4)</p></blockquote><p>Christ drives out the devil, giving an example:</p><blockquote><p>“And
    Jesus answered and said to him, ‘Get behind Me, Satan! For it is written, You
    shall worship the LORD your God, and Him only you shall serve.’” (<a href="https://bibleox.com/en/eng-nkjv/lk/4/#L8">Luke
    4:8</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/4/#L10">Matt. 4:10</a>)</p></blockquote><blockquote><p>“But
    He turned and said to Peter, ‘Get behind Me, Satan! You are an offense to Me,
    for you are not mindful of the things of God, but the things of men.’” (<a href="https://bibleox.com/ru/ru/mk/8#L33">Mark
    8:33</a>)</p></blockquote><h2>Priest Georgy Maximov in detail on reading literature
    by non-Orthodox authors</h2><p><a href="https://youtu.be/nRYa-IuSNIA">https://youtu.be/nRYa-IuSNIA</a></p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
- src: ZUXJhklM_Как_правильно_понимать_Библию
  path: ZUXJhklM_How_to_understand_Scripture
  title: How to understand the Scripture
  meta_desc: 'How to understand the Scripture: the Fathers on the interpretation of
    the Bible — Polycarp, Clement of Alexandria, Athanasius, Epiphanius, Cyril of
    Jerusalem, Jerome, the councils, and Russian saints.'
  menu:
    parent: Holy Scripture
    title: How to understand the Scripture
    priority: 3
  body: '<h2>2nd century</h2><h3>Polycarp of Smyrna, hieromartyr (69–155)</h3><blockquote><p>Wherefore
    it is right to abstain from all these things, submitting yourselves to the presbyters
    and deacons as to God and Christ. The virgins must walk in a blameless and pure
    conscience. &lt;…&gt; For every one who shall not confess that Jesus Christ is
    come in the flesh, is antichrist: and whosoever shall not confess thetestimony
    of the Cross, is of the devil; and whosoever shall pervert the oracles of the
    Lord to his own lusts and say that there isneither resurrection nor judgment,
    that man is the firstborn of Satan. Wherefore let us forsake the vain doing of
    the many and their false teachings, and turn unto the word which was delivered
    unto us from the beginning.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Plk_Ph">To
    the Philippians, 5–7</a>)</p><h2>3rd century</h2><h3>Clement of Alexandria, presbyter
    (150–215)</h3><blockquote><p>Indeed, those who hold to impious teachings and lead
    others to them turn the divine word not to the profit but to the harm of those
    who hear it”; they shut for themselves the entrance into the Kingdom of Heaven,
    and do not allow those whom they deceive to comprehend the truth. (2) Having no
    key of the entrance, they use a counterfeit key, or, as they say, a lockpick (ἀντικλῆις),
    with which they enter not through the outer door, by which we enter by means of
    the Divine tradition, but, breaking through the side gate, they creep in secretly
    behind the church walls, distorting the truth in every way and presenting themselves
    as teachers initiated into the mysteries (μυσταγωγοι) and bringing up the souls
    of the ungodly.</p></blockquote><p>(The Stromata, Book VII)</p><h2>4th century</h2><h3>St
    Athanasius the Great (c. 295–373)</h3><blockquote><p>For those who are thus disposed,
    and fashion themselves according to the Gospel, will be partakers of Christ, and
    imitators of apostolic conversation, on account of which they shall be deemed
    worthy of that praise from him, with which he praised the Corinthians, when he
    said, ‘I praise you that in everything ye are mindful of me (1 Cor. 11:2).’ Afterwards,
    because there were men who used his words, but chose to hear them as suited their
    lusts, and dared to pervert them, as the followers of Hymenæus and Alexander,
    and before them the Sadducees, who as he said, ‘having made shipwreck of faith,’
    scoffed at the mystery of the resurrection, he immediately proceeded to say, ‘And
    as I have delivered to you traditions, hold them fast (1 Tim. 1:19; 2 Tim. 2:18;
    1 Cor. 11:2).’ That means, indeed, that we should think not otherwise than as
    the teacher has delivered. 6. For not only in outward form did those wicked men
    dissemble, putting on as the Lord says sheep’s clothing, and appearing like unto
    whited sepulchres; but they took those divine words in their mouth, while they
    inwardly cherished evil intentions. And the first to put on this appearance was
    the serpent, the inventor of wickedness from the beginning—the devil,—who, in
    disguise, conversed with Eve, and forthwith deceived her. But after him and with
    him are all inventors of unlawful heresies, who indeed refer to the Scriptures,
    but do not hold such opinions as the saints have handed down, and receiving them
    as the traditions of men, err, because they do not rightly know them nor their
    (Matt. 22:29) power. Therefore Paul justly praises the Corinthians (1 Cor. 11:2),
    because their opinions were in accordance with his traditions. And the Lord most
    righteously reproved the Jews, saying, ‘Wherefore do ye also transgress the commandments
    of God on account of your traditions (Matt. 15:3).’ For they changed the commandments
    they received from God after their own understanding, preferring to observe the
    traditions of men. And about these, a little after, the blessed Paul again gave
    directions to the Galatians who were in danger thereof, writing to them, ‘If any
    man preach to you aught else than that ye have received, let him be accursed (Gal.
    1:9).’ 7. For there is no fellowship whatever between the words of the saints
    and the fancies of human invention; for the saints are the ministers of the truth,
    preaching the kingdom of heaven, but those who are borne in the opposite direction
    have nothing better than to eat, and think their end is that they shall cease
    to be, and they say, ‘Let us eat and drink, for to-morrow we die (Isa. 22:13).’
    Therefore blessed Luke reproves the inventions of men, and hands down the narrations
    of the saints, saying in the beginning of the Gospel, ‘Since many have presumed
    to write narrations of those events of which we are assured, as those who from
    the beginning were witnesses and ministers of the Word have delivered to us; it
    hath seemed good to me also, who have adhered to them all from the first, to write
    correctly in order to thee, O excellent Theophilus, that thou mayest know the
    truth concerning the things in which thou hast been instructed (Luke 1:1).’ For
    as each of the saints has received, that they impart without alteration, for the
    confirmation of the doctrine of the mysteries. Of these the (divine) word would
    have us disciples, and these should of right be our teachers, and to them only
    is it necessary to give heed, for of them only is ‘the word faithful and worthy
    of all acceptation (1 Tim. 1:15);’ these not being disciples because they heard
    from others, but being eye-witnesses and ministers of the Word, that which they
    had heard from Him have they handed down.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-the-festal-letters-1">Second
    Festal Letter (330)</a>)</p><blockquote><p>“<strong><mark>Tradition also must
    be made use of: for not everything can be taken from the divine Scripture. For
    this reason the holy Apostles handed down some things in writings, and others
    in traditions</mark></strong>, as the holy Apostle says: <em>as I delivered them
    to you</em> (1 Cor. 11:2), and in another place: <em>so teach I, and so I ordained
    in all the churches</em> (1 Cor. 7:17), and: <em>unless ye have believed in vain</em>
    (1 Cor. 15:2).”</p></blockquote><p>(Panarion, or the Medicine Chest, against the
    eighty heresies: the Apostolics)</p><h3>Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p><strong><mark>We
    have need therefore of divine grace</mark></strong>, and of a sober mind, and
    <strong><mark>of eyes that see, lest from eating tares as wheat we suffer harm
    from ignorance</mark></strong>, and lest from taking the wolf to be a sheep we
    become his prey, and from supposing the destroying Devil to be a beneficent Angel
    we be devoured: for, as the Scripture saith, he goeth about as a roaring lion,
    seeking whom he may devour (1 Pet. 5:8). This is the cause of the Church’s admonitions,
    the cause of the present instructions, and of the lessons which are read. &lt;…&gt;
    Since <mark>there are many that make spoil</mark> through <mark>philosophy</mark>
    and vain deceit (Col. 2:8). <mark>The Greeks</mark> on the one hand draw men away
    by their smooth tongue, for honey droppeth from a harlot’s lips (Prov. 5:3): whereas
    <mark>they of the Circumcision</mark> deceive those who come to them by means
    of the Divine Scriptures, which they miserably misinterpret though studying them
    from childhood to old age, and growing old in ignorance. But <mark>the children
    of heretics</mark>, by their good words and smooth tongue, deceive the hearts
    of the innocent, disguising with the name of Christ as it were with honey the
    poisoned arrows of their impious doctrines: concerning all of whom together the
    Lord saith, Take heed lest any man mislead you (Matt. 24:4). This is the reason
    for the teaching of the Creed and for expositions upon it.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1">The Catechetical
    Lectures, Lecture IV</a>)</p><h2>5th century</h2><h3>Blessed Jerome of Stridon,
    monk (c. 347–420)</h3><blockquote><p>But since we have spoken much already, and
    the length of the dispute has wearied the attention of the hearers, I will state
    to you my heartfelt view briefly and openly: one must hold firmly to that church
    which, being founded by the apostles, continues to exist to the present day. If
    you hear anywhere of such as call themselves Christ’s and take their name not
    from the Lord Jesus Christ but from some other — as the Marcionites, Valentinians,
    Montanists or Campites — know that that is not the church of Christ, but the synagogue
    of antichrist. For the very fact that they appeared later shows in them those
    of whom the apostle foretold for the future. And let them not flatter themselves
    if they seem to find confirmation of their words in the Scriptures: for the devil
    also spoke something from the Scriptures; and the essence of the Scriptures is
    not in the reading but in the understanding. Otherwise, if we followed only the
    letter, we might ourselves compose for ourselves some new dogma, asserting, say,
    that those who wear shoes and have two shirts must not be received into the church.</p></blockquote><p>(Dialogue
    Against the Luciferians)</p><h2>7th century</h2><h3>The Sixth Œcumenical Council
    (691)</h3><blockquote><p>The prelates of the churches must every day, and especially
    on Sundays, teach all the clergy and the people the words of piety, choosing out
    of the Divine Scripture the thoughts and judgments of truth, and not transgressing
    the already established limits or the traditions of the God-bearing fathers. And
    if the word of Scripture is examined, let them interpret it according to what
    the luminaries and teachers of the Church have set forth in their writings, and
    in no other way; and let them rather be glorified by their writings than by composing
    their own works, lest sometimes, from lack of skill in this, they swerve from
    what is right. Through the teaching of the aforesaid fathers men receive the knowledge
    both of things excellent and worthy of choice, and of things harmful and to be
    shunned; and therefore they change their life for the better and do not become
    the prey of the passion of ignorance, but, hearkening to the teaching, incite
    themselves to depart from evil, and out of the fear of the punishments threatening
    them work out their own salvation.</p></blockquote><p>(Canon 19 of the Sixth Œcumenical
    Council)</p><h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo) (1651–1709)</h3><blockquote><p>The
    Holy Spirit acted both through the prophets and through the Apostles. Holy Scripture
    is the first and principal source of faith and religious knowledge — true and
    infallible, and binding for all. A correct and error-free understanding of Scripture
    is possible only under the guidance of the holy universal Church, and in her alone
    can the truth be found. Sacred Tradition has the same divine origin as Scripture;
    it therefore constitutes another source of faith and religious knowledge, likewise
    true and infallible and binding for all, as Holy Scripture is; and the universal
    Church alone, in the person of her heads, can be the only keeper of genuinely
    apostolic Tradition. — “Whoever wishes to know the truth, — reasons St Irenaeus,
    — must turn to the Church, because the Apostles entrusted the divine truth to
    her alone and, like a rich man into a treasury, placed in her everything that
    pertains to the truth. The Church alone is the door of life.” And, in particular,
    according to the teaching of St Irenaeus, only the pastors of the Church lawfully
    ordained are the true teachers and keepers of the truth contained in the Church.</p></blockquote><p>(The
    Lives of the Saints: the suffering of St Irenaeus of Lyons)</p><h2>18th century</h2><h3>The
    Epistle of the Patriarchs (1723)</h3><p>This is a conciliar document of the Church
    of Jerusalem (1672), but by that time (1723) also approved by the 4 patriarchates
    (Constantinopolitan, Jerusalem, Antiochian, Alexandrian) and by the Synod of the
    Russian Church.</p><blockquote><p>Q. 2. Are the Scriptures plain to all Christians
    that read them? <strong>If the Divine Scriptures were plain to all Christians
    that read them, the Lord would not have commanded such as desired to obtain salvation
    to search the same</strong> (John 5.39); and <strong>Paul would have said without
    reason that God had placed the gift of teaching in the Church</strong> (1 Cor.
    13.28); and Peter would not have said of the Epistles of Paul that they contained
    some things hard to understand (2 Pet. 3.16). It is evident, therefore, that the
    Scriptures are very profound, and their sense lofty; and that they need learned
    and divine men to search out their true meaning, and a sense that is right, and
    agreeable to all Scripture, and to its author the Holy Spirit. So that as to those
    that are regenerated [in Baptism], although they must know the faith concerning
    the Trinity, the incarnation of the Son of God, his passion, resurrection, and
    ascension into the heavens, what concerneth regeneration and judgment – for which
    many have not hesitated to die – it is not necessary, but rather impossible, that
    all should know what the Holy Spirit manifesteth to those alone who are exercised
    in wisdom and holiness.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-1">The
    Eastern Orthodox Confession of Faith (1723), Question 2</a>)</p><h2>19th century</h2><h3>St
    Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>Do not dare to
    interpret the Gospel and the other books of Holy Scripture yourself. The Scripture
    was uttered by the holy Prophets and Apostles — uttered not arbitrarily, but by
    the inspiration of the Holy Spirit (2 Pet. 1:21). How mad it is, then, to interpret
    it arbitrarily! The Holy Spirit, who uttered the Word of God through the Prophets
    and Apostles, has interpreted it through the holy Fathers. Both the Word of God
    and its interpretation are the gift of the Holy Spirit. Only this one interpretation
    does the holy Orthodox Church accept! Only this one interpretation do her true
    children accept! Whoever explains the Gospel and all the Scripture arbitrarily
    thereby rejects its interpretation by the holy Fathers, by the Holy Spirit. Whoever
    rejects the interpretation of the Scripture by the Holy Spirit rejects, without
    any doubt, the Holy Scripture itself. And the word of God, the word of salvation,
    becomes for its presumptuous interpreters an odour of death, a two-edged sword
    with which they slaughter themselves unto eternal perdition (2 Pet. 3:16; 2 Cor.
    2:15-16). Arius, Nestorius, Eutyches and the other heretics slew themselves for
    ever by their arbitrary and presumptuous interpretation of the Scripture, falling
    into blasphemy.</p></blockquote><p>(Ascetic Experiences, Volume 1: On the reading
    of the Gospel)</p><blockquote><p>The writings of the holy Fathers were all composed
    by the inspiration of, or under the influence of, the Holy Spirit. Wonderful is
    their agreement, wonderful their unction! Whoever is guided by them has, without
    any doubt, the Holy Spirit for his guide. All the waters of the earth flow together
    into the ocean, and perhaps the ocean serves as the source of all the waters of
    the earth. The writings of the Fathers all converge in the Gospel; they all tend
    to teach us the exact keeping of the commandments of our Lord Jesus Christ; of
    them all the source and the end is the holy Gospel. The holy Fathers teach how
    to approach the Gospel, how to read it, how to understand it aright, what helps
    and what hinders its comprehension. And therefore occupy yourself first of all
    more with the reading of the holy Fathers. When they have taught you to read the
    Gospel, then read the Gospel chiefly. Do not consider it enough for yourself to
    read the Gospel alone without the reading of the holy Fathers! That is a proud
    and dangerous thought. Better let the holy Fathers lead you to the Gospel, as
    to their beloved child, who has received a preliminary upbringing and education
    by means of their writings. Many — all who have insolently and proudly rejected
    the holy Fathers and approached the Gospel directly, with blind daring, with an
    impure mind and heart — have fallen into deadly delusion. The Gospel has rejected
    them: it admits only the humble.</p></blockquote><p>(Ascetic Experiences, Vol.
    1)</p><blockquote><p>Abba Ammon asked: “If it happens that one must converse with
    a brother, from what is it better to borrow the conversation — from the Scripture
    or from the sayings of the Fathers?” The Elder answered: “If you cannot keep silence,
    it is better to speak from the sayings of the Fathers than from the Scripture.
    The interpretation of the Scripture is attended with great danger for the soul.”
    Many monks of those times, because of the incorrect explanation which they gave
    to various passages of the holy Scripture, fell into heresies. The interpretation
    of the Scripture is granted by Divine grace. A monk who does not possess this
    grace and strives to interpret the Scripture from his own self-opinion and ignorance
    inevitably becomes guilty before the Holy Spirit who uttered the Scripture: for
    his presumptuousness he is rejected by God and becomes the prey of the fallen
    spirits. From such interpretation of the prophetic and apostolic Scriptures have
    arisen all the heresies and schisms.</p></blockquote><p>(The Fatherland // Abba
    Ammon)</p><h3>St Theophan the Recluse (1815–1894)</h3><blockquote><p>“And the
    reason there are so many extracts is that by our law in Orthodoxy only that is
    firm which stands on the holy Fathers. With the Protestants it is another matter…
    whatever comes into their head, all goes.”</p></blockquote><p>(Collection of Letters,
    Issue 5, Letter 776)</p><h3>St Nektarios of Aegina (Kefalas) (1846–1920)</h3><blockquote><p>It
    was the Lord Himself who raised up the visible altar of the Church. That is why,
    together with theory, He demands deed — a deed in agreement with the truth which
    He communicated to His holy Church, the only one that leads into Life, whose Head
    is Christ Himself. To her we must submit; precisely from her we must learn the
    Truth and receive salvation. She alone is the pillar and ground of the Truth,
    for the Spirit, the Paraclete, dwells in her eternally. The venerable Dositheos
    says the following about the Church: We must believe unshakably in the Scripture,
    but in no other way than in accordance with the teaching of the Catholic Church.
    The heretics, of course, accept Holy Scripture, but they distort it with metaphors,
    homonymy, and the sophisms of human reasoning, which confuses the uncomplicated
    and plays upon what cannot be played upon. If we were obliged to accept daily
    the opinions of one or another, the Catholic Church would not be what she, by
    the grace of Christ, has remained to this moment, keeping a single point of view
    concerning the faith and believing unshakably in one and the same. In that case
    she would be torn by a multitude of heresies and would no longer be the holy Church,
    the pillar and ground of the Truth, unspotted and pure. She would have become
    the church of the cunning, the church of heretics, who, having formed themselves
    within her, would afterwards, without any pangs of conscience, cast her aside.
    Therefore we believe that the witness of the Catholic Church does not yield to
    the authority of Holy Scripture. Both are the work of one and the same Spirit.
    A man speaking from himself may sin, be deceived and err. The Catholic Church
    never speaks from herself, but speaks by the Spirit of God, the Teacher who enriches
    her eternally. She cannot sin, nor be deceived, nor err. She is equal to Holy
    Scripture and possesses an immutable and constant authority”. St Cyril of Jerusalem
    enjoins: “to love to learn and to find out from the Church which books of the
    Old and New Testaments are received by all; for why lose time on the books that
    are doubtful”. One must read, by his word, the twenty-two books of the Old Testament
    translated by the Seventy teachers. Behind the words of St Cyril stands the authority
    of the Church. At the Council of Constantinople in 1672 Patriarch Dionysius said
    concerning the infallibility of the Church: “We say that she is infallible, guided
    by her own Head, Christ, and enlightened by the Spirit of Truth. Therefore she
    cannot err; for this reason the Apostle has called her the Pillar and Ground of
    the Truth. She is visible and will never forsake the Orthodox until the end of
    the age.”</p></blockquote><p>(From the works of St Nektarios of Aegina)</p><h3>St
    Nicholas of Japan, equal-to-the-apostles (1836–1912)</h3><blockquote><p>Protestants
    sometimes come to me and ask me to explain some place of Holy Scripture. “But
    you have your own missionary teachers; ask them,” I say to them; and what do they
    answer? — We did ask them, they say — understand it as you know how; but I need
    to know the true thought of God, not my personal opinion. Such is the instability
    of Protestantism with the Holy Scripture alone. It is not so with us: all is light
    and reliable, clear and firm; because, besides Holy Scripture, we accept also
    Holy Tradition, and Holy Tradition is the living unbroken voice of our Mother
    the Church from the times of Christ and His Apostles to this day, and which will
    be until the end of the world. Upon it the Holy Scripture rests whole and intact,
    and it helps us to understand the meaning of the holy Scripture without error;
    for if a child does not understand something in a letter of his father, the most
    reliable thing for him is to turn to his mother for an explanation; and our Mother
    is the Church, in which Christ Himself invisibly dwells, according to His promise.</p></blockquote><p>(Diaries.
    Volume III, January 3/15, 1897. Friday)</p><h2>20th century</h2><h3>Illarion (Troitsky),
    hieromartyr (1886–1929)</h3><blockquote><p>Is it not remarkable that all those
    who fall away from the Church constantly speak of their respect for Holy Scripture
    and, at the same time, very quickly proceed to distort even the very books of
    Scripture! As soon as people leave the Church, they immediately begin to interpret
    the Scripture in their own way, and each interprets it differently. Christ prayed
    to God the Father for the unity of all who believe in Him; the Apostles exhorted
    to like-mindedness, spoke of the unity of the faith. It turns out that without
    the Church no unity is possible. The Babylonian “confusion of tongues” must come
    again. In the Church the faith remains one and the same for millennia, always
    equal to itself. But among those who have fallen away from the Church it changes
    almost daily. New heretics and sectarians constantly appear, and each of their
    teachers preaches differently. It is clear that without the Church the teaching
    of Christ is lost first of all and replaced by short-lived human speculations.
    No, the faith of Christ becomes clear and definite for a man only when he sincerely
    believes in the Church; only then is the pearl of this faith pure, only then is
    it not mixed with a heap of filthy refuse of all kinds of wilful opinions and
    judgments. Of all this the Apostle Paul spoke already when he called the Church
    of the living God “the pillar and ground of the truth” (1 Tim. 3:15). Thus, in
    separation from the Church even the Christian teaching itself turns out to be
    something very indefinite, elusive, constantly changing at will.</p></blockquote><p>(There
    is no Christianity without the Church)</p><h3>St Serafim (Sobolev) (1881–1950)</h3><blockquote><p>St
    Barsanuphius the Great says: “Brother, if you wish to be saved, follow the holy
    Fathers.” The teaching of the holy Fathers of the Church is for Orthodox people
    the source and criterion of truth, for, by the witness of St John the Prophet,
    the fellow-struggler of the great Barsanuphius, “the Spirit of God does not err
    in them (the holy Fathers); in them… is fulfilled that which is said: Thy good
    Spirit shall lead me into the right land” (Ps. 142:10). According to the words
    of St John the Prophet cited above, we must say that the Holy Spirit illuminated
    the patristic mind and helped it to interpret the Word of God concerning the truths
    of our faith infallibly.</p></blockquote><p>(In defence of the Sophian heresy
    of protopresbyter S. Bulgakov)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
