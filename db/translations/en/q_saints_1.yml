    priority: 11
  body: '<h2>4th century</h2><h3>Eusebius of Caesarea (Pamphili) (c. 258–340)</h3><p>About
    the holy Ignatius the God-bearer:</p><blockquote><p>Ignatius, who was chosen bishop
    of Antioch, second in succession to Peter, and whose fame is still celebrated
    by a great many. 3. Report says that he was sent from Syria to Rome, and became
    food for wild beasts on account of his testimony to Christ. 4. And as he made
    the journey through Asia under the strictest military surveillance, he fortified
    the parishes in the various cities where he stopped by oral homilies and exhortations,
    and <strong>warned them above all to be especially on their guard against the
    heresies that were then beginning to prevail, and <mark>exhorted them to hold
    fast to the tradition of the apostles</mark></strong>. Moreover, he thought it
    necessary to attest that tradition in writing, and to give it a fixed form for
    the sake of greater security.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">Church
    History, Book III, ch. 36</a>)</p><h2>5th century</h2><h3>Vincent of Lérins, monk
    († before 450)</h3><blockquote><p>XXII. But it is worthwhile to expound the whole
    of that passage of the apostle more fully, O Timothy, keep the deposit, avoiding
    profane novelties of words. O! The exclamation implies fore-knowledge as well
    as charity. For he mourned in anticipation over the errors which he foresaw. Who
    is the Timothy of today, but either generally the Universal Church, or in particular,
    the whole body of The Prelacy, whom it behooves either themselves to possess or
    to communicate to others a complete knowledge of religion? What is Keep the deposit?
    Keep it, because of thieves, because of adversaries, lest, while men sleep, they
    sow tares over that good wheat which the Son of Man had sown in his field. <strong><mark>Keep
    the deposit. What is The deposit? That which has been entrusted to you, not that
    which you have yourself devised: a matter not of wit, but of learning; not of
    private adoption, but of public tradition; a matter brought to you, not put forth
    by you, wherein you are bound to be not an author but a keeper, not a teacher
    but a disciple, not a leader but a follower. Keep the deposit. Preserve the talent
    of Catholic Faith inviolate, unadulterate. That which has been entrusted to you,
    let it continue in your possession, let it be handed on by you.</mark></strong>
    You have received gold; give gold in turn. Do not substitute one thing for another.
    Do not for gold impudently substitute lead or brass. Give real gold, not counterfeit.
    O Timothy! O Priest! O Expositor! O Doctor! If the divine gift has qualified you
    by wit, by skill, by learning, be a Bazaleel of the spiritual tabernacle, engrave
    the precious gems of divine doctrine, fit them in accurately, adorn them skilfully,
    add splendor, grace, beauty. Let that which formerly was believed, though imperfectly
    apprehended, as expounded by you be clearly understood. Let posterity welcome,
    understood through your exposition, what antiquity venerated without understanding.
    Yet teach still the same truths which you have learned, so that though you speak
    after a new fashion, what you speak may not be new.</p><p>XXIII. But someone will
    say, perhaps, Shall there, then, be no progress in Christ’s Church? Certainly;
    all possible progress. For what being is there, so envious of men, so full of
    hatred to God, who would seek to forbid it? <strong>Yet on condition that it be
    real progress, not alteration of the faith. For progress requires that the subject
    be enlarged in itself, alteration, that it be transformed into something else.</strong>
    The intelligence, then, the knowledge, the wisdom, as well of individuals as of
    all, as well of one man as of the whole Church, ought, in the course of ages and
    centuries, to increase and make much and vigorous progress; but yet only in its
    own kind; that is to say, in the same doctrine, in the same sense, and in the
    same meaning.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies#HH-22">The
    Commonitory of Vincent of Lérins, chapters 22–23</a>)</p><h2>20th century</h2><h3>Archpriest
    Dmitry Vladykov (1863–1955)</h3><blockquote><p>“Do what you have learned, received,
    heard, and seen in me, and the God of peace will be with you” (Phil. 4:9). “O
    Timothy, guard what has been entrusted to you” (1 Tim. 6:20). “Do not diminish
    it,” St John Chrysostom explains, “for it is not yours; it is another’s deposit
    entrusted to you; do not subtract from it.”</p><p>“What is Guard what has been
    entrusted to you? It means, writes Vincent of Lérins, “keep watch, for there are
    thieves, there are enemies, lest while men sleep they sow tares over that good
    wheat which the Son of Man sowed in his field (Matt. 13:37–39). Keep the deposit,
    he says. What is the deposit? That which has been entrusted to you, not that which
    you have invented; what you have received, not what you have devised; a matter
    not of wit, but of teaching; not of private possession, but of public tradition
    — a matter that has come down to you, not discovered by you, in relation to which
    you must be not an inventor but a guardian, not a founder but a follower, not
    a leader but one led. Guard what has been entrusted to you, that is, preserve
    the talent of the universal faith whole and unimpaired. What has been entrusted
    to you, let it remain with you, that you hand it on. You have received gold; give
    gold in return.” — “Therefore, brethren, stand firm and hold the traditions which
    you have been taught, whether by word or by our epistle” (2 Thess. 2:15). “From
    this it is evident,” St John Chrysostom teaches, “that the apostles did not deliver
    everything through their Epistles, but much they communicated without writing;
    and both are equally trustworthy. Therefore we must also acknowledge church tradition
    as trustworthy. <strong>There is tradition — seek nothing more</strong>.”</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
