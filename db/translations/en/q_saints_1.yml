  body: '<h2>2nd century</h2><h3>Clement of Alexandria (150–215)</h3><blockquote><p>If,
    then, the harvest is plenteous, but the labourers few, it is incumbent on us to
    pray that there may be as great abundance of labourers as possible. But <strong>the
    husbandry is twofold</strong>. It is <strong>carried on in two ways: one is by
    means of the word that is <mark>not committed to writing</mark>, the other by
    means of the written word</strong>. And <strong>in whatever way the Lord’s labourer
    sow the good wheat, and grow and reap the ears, he shall appear a truly divine
    husbandman</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/vz54_The_Stromata_1#HH-1">The
    Stromata, Book I</a>)</p><h2>4th century</h2><h3>St Epiphanius of Cyprus (c. 315–403)</h3><blockquote><p>“<strong><mark>Tradition
    also must be made use of: for not everything can be taken from the divine Scripture.
    For this reason the holy Apostles handed down some things in writings, and others
    in traditions</mark></strong>, as the holy Apostle says: <em>as I delivered them
    to you</em> (1 Cor. 11:2), and in another place: <em>so teach I, and so I ordained
    in all the churches</em> (1 Cor. 7:17), and: <em>unless ye have believed in vain</em>
    (1 Cor. 15:2).”</p></blockquote><p>(Panarion, or the Medicine Chest, against the
    eighty heresies: the Apostolics)</p><h3>Blessed Aurelius Augustine (354–430)</h3><blockquote><p>“And
    if any one seek for divine authority in this matter (the baptism of infants —
    note), though <strong><mark>what is held by the whole Church, and that not as
    instituted by Councils, but as a matter of invariable custom, is rightly held
    to have been handed down by apostolical authority</mark></strong>, still we can
    form a true conjecture of the value of the sacrament of baptism in the case of
    infants, from the parallel of circumcision, which was received by God’s earlier
    people.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/augustine-on-baptism-against-the-donatists-1#HH-24">On
    Baptism, Against the Donatists, Book IV, ch. 24</a>)</p><h3>Blessed Jerome of
    Stridon, monk (c. 347–419)</h3><blockquote><p>Concerning your questions — whether
    one ought to fast on the Sabbath, and whether one ought to receive the Eucharist
    daily, as is said to be the custom of the church of Rome and of Spain — the eloquent
    Hippolytus has treated of both these points, and several writers have collected
    passages from different authors bearing upon them. But the best advice that I
    can give you is this. <strong><mark>Church traditions — especially those that
    do not run counter to the faith — are to be observed in the form in which previous
    generations have handed them down; and the use of one church is not to be annulled
    because it is contrary to that of another</mark></strong>. And I wish that we
    could fast at all times, as the Apostle Paul did and the believers with him in
    the days of Pentecost and on the Lord’s day, as is related in the Acts of the
    Apostles (Acts 13:20–21)! And yet they cannot be accused of the Manichean heresy,
    since they did not prefer bodily food to spiritual. And <strong>the Eucharist
    may be received at all times without qualm of conscience or disapproval from me</strong>,
    hearkening to the psalmist’s words: <em>O taste and see that the Lord is good</em>
    (Ps. 33:9), and singing with him: <em>my heart poureth forth a good word</em>
    (Ps. 44:2). I do not say that one must fast on feast-days or in the days of Pentecost,
    but <strong><mark>let each province keep its own customs, and count the rules
    of its forefathers as apostolic ordinances</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/jerome-the-letters-of-st-jerome-3#HH-To-Lucinius">Letter
    71. To Lucinius</a>)</p><h2>19th century</h2><h3>St Philaret of Moscow (Drozdov)
    (1782–1867)</h3><blockquote><p>By the name Holy Tradition is understood what true
    believers and worshipers of God hand down by word and example to one another,
    forefathers to descendants: <strong><mark>the doctrine of the faith, the law of
    God, the sacraments and the sacred rites</mark></strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/TQdr_The_Longer_Catechism_of_The_Orthodox_Catholic_Eastern_Church#HH-On-Holy-Tradition-and-Holy-Scripture">The
    Longer Catechism of the Orthodox Catholic Eastern Church</a>)</p><h3>St Theophan
    the Recluse (1815–1894)</h3><blockquote><p>By the word tradition is not meant
    some indefinite rumor, started and spread none knows how; but <strong>it is understood
    to be <mark>the Apostolic teaching handed down orally, or the rules and ordinances
    introduced into the Church in deed</mark>. The Apostles fully organized Christ’s
    Church in every aspect of its spiritual and saving ecclesial life. But how they
    organized it is not fully set out in their writings; it was done in deed and brought
    into Christian life personally by the Apostles, introduced and rooted through
    their repeated visits to the Christian communities they had founded, and through
    their repeated corrections of what was defective — all by their own personal action
    and word</strong>. And the pattern of Christian knowledge, the rules of life,
    the mutual relations of Christians, the mystical sanctifying sacramental rites,
    and the rules for church assemblies — all was established personally by word and
    secured by personal oversight.</p><p>And so Christians came to think in this way,
    to live in this way, to act in their mutual relations, to be governed in this
    way, to be sanctified in this way, to serve God in this way, as the Apostles had
    established.</p></blockquote><p>(Letter 946. On Apostolic Tradition)</p><h2>20th
    century</h2><h3>Archpriest Dmitry Vladykov (1863–1955)</h3><blockquote><p><em>The
    source of Christian doctrine is the Word of God or <strong>Divine Revelation</strong>,
    proclaimed through the prophets and apostles and by them handed down to the Church
    <strong>partly in <mark>writing</mark>, partly <mark>orally</mark></strong> (2
    Thess. 2:15). Holy Tradition is that same Word of God, only written down not by
    the God-inspired men themselves but by their successors and disciples, and handed
    down by them orally to the Church (cf. Acts 13:5; 17:13; 20:31; 1 Thess. 2:13;
    2 Tim. 2:2, etc.), which has ever since preserved it continuously and without
    change.</em></p><p><em>“By the name Holy Tradition is understood what true believers
    and worshipers of God hand down by word and example to one another, forefathers
    to descendants: <strong><mark>the doctrine of the faith, the law of God, the sacraments
    and the sacred rites</mark></strong>” (Orthodox Catechism).</em></p><p><em>The
    sources in which Holy Tradition has come down to us:</em></p><p><em><strong><mark>the
    rules and ordinances of the holy Apostles, of the seven œcumenical and nine local
    councils, the ancient creeds, the liturgies, the acts of the martyrs, the ancient
    church histories, the works of the holy Fathers and teachers of the Church, and
    the liturgical practice of the Church</mark></strong></em>.</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
