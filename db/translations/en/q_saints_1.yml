    <h2>2nd century</h2><h3><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon">St Irenaeus of Lyons, hieromartyr (c. 130–202)</a></h3><blockquote><p>Now all these [heretics] are of much later date than the bishops to whom the apostles committed the Churches; which fact I have in the third book taken all pains to demonstrate. It follows, then, as a matter of course, that these heretics aforementioned, since they are blind to the truth, and deviate from the [right] way, will walk in various roads; and therefore the footsteps of their doctrine are scattered here and there without agreement or connection. <strong><mark>But the path of those belonging to the Church</mark></strong> circumscribes the whole world, <strong><mark>as possessing the sure tradition from the apostles, and gives unto us to see that the faith of all is one and the same</mark>, since all receive one and the same God the Father, and believe in the same dispensation regarding the incarnation of the Son of God, and are cognizant of the same gift of the Spirit, and are conversant with the same commandments, and <mark>preserve the same form of ecclesiastical constitution</mark>, and expect the same advent of the Lord, and await the same salvation of the complete man, that is, of the soul and body. And undoubtedly the preaching of the Church is true and stedfast, in which one and the same way of salvation is shown throughout the whole world. </strong>For to her is entrusted the light of God; and therefore the “wisdom” of God, by means of which she saves all men, “is declared in [its] going forth; it uttereth [its voice] faithfully in the streets, is preached on the tops of the walls, and speaks continually in the gates of the city” (Ps. 31:1-2). For the Church preaches the truth everywhere, and she is the seven-branched candlestick which bears the light of Christ.</p><p><strong><mark>Those, therefore, who desert the preaching of the Church, call in question the knowledge of the holy presbyters</mark></strong>, not taking into consideration of how much greater consequence is a religious man, even in a private station, than a blasphemous and impudent sophist. Now, <strong><mark>such are all the heretics</mark></strong>, and those who imagine that they have hit upon something more beyond the truth, so that by following those things already mentioned, proceeding on their way variously, in harmoniously, and foolishly, <strong><mark>not keeping always to the same opinions with regard to the same things</mark></strong>, as blind men are led by the blind, they shall deservedly fall into the ditch of ignorance lying in their path, ever seeking and never finding out the truth. It behoves us, therefore, to avoid their doctrines, and to take careful heed lest we suffer any injury from them; but <strong>to flee to the Church, and be brought up in her bosom, and be nourished with the Lord’s Scriptures</strong>. For the Church has been planted as a garden (paradisus) in this world; therefore says the Spirit of God, “Thou mayest freely eat from every tree of the garden” (Gen. 2:16), that is, Eat ye from every Scripture of the Lord; but ye shall not eat with an uplifted mind, nor <strong><mark>touch any heretical discord</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against Heresies, Book V, ch. 20.2</a>)</p>
    <h2>4th century</h2><h3>St Athanasius the Great (296–373)</h3><blockquote><p>For, what our Fathers have delivered, this is truly doctrine; and this is truly <strong><mark>the token of doctors, to confess the same thing with each other, and to vary neither from themselves nor from their fathers</mark></strong>; whereas they who have not this character are to be called not true doctors but evil. Thus the Greeks, as not witnessing to the same doctrines, but quarrelling one with another, have no truth of teaching; but <strong>the holy and veritable heralds of the truth agree together, and do not differ. For though they lived in different times, yet they one and all tend the same way</strong>, being prophets of the one God, and preaching the same Word harmoniously. And thus what Moses taught, that Abraham observed; and what Abraham observed, that Noah and Enoch acknowledged, discriminating pure from impure, and becoming acceptable to God. For Abel too in this way witnessed, knowing what he had learned from Adam, who himself had learned from that Lord</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-defence-of-the-nicene-definition-de-decretis">The Defence of the Nicene Definition</a>)</p>
    <h2>5th century</h2><h3>St Vincent of Lérins, monk († before 450)</h3><blockquote><p>Moreover, in the Catholic Church itself, <strong>all possible care must be taken, that we hold that faith which has been believed <mark>everywhere, always, by all</mark></strong>. For that is truly and in the strictest sense Catholic, which, as the name itself and the reason of the thing declare, comprehends all universally. This rule we shall observe if we follow universality, antiquity, consent. We shall follow universality if we confess that one faith to be true, which the whole Church throughout the world confesses; antiquity, if we in no wise depart from those interpretations which it is manifest were notoriously held by our holy ancestors and fathers; consent, in like manner, if in antiquity itself we adhere to the consentient definitions and determinations of all, or at the least of almost all priests and doctors.</p><p>&lt;…&gt;</p><p>But <strong>the opinions of those Fathers only are to be used for comparison, who living and teaching, holily, wisely, and with constancy, in the Catholic faith and communion, were counted worthy either to die in the faith of Christ, or to suffer death happily for Christ. Whom yet we are to believe in this condition, <mark>that that only is to be accounted indubitable, certain, established, which either all, or the more part, have supported and confirmed manifestly, frequently, persistently, in one and the same sense, forming, as it were, a consentient council of doctors, all receiving, holding, handing on the same doctrine. But whatsoever a teacher holds, other than all, or contrary to all, be he holy and learned, be he a bishop, be he a Confessor, be he a martyr, let that be regarded as a private fancy of his own</mark>, and be separated from the authority of common, public, general persuasion</strong>, lest, after the sacrilegious custom of heretics and schismatics, rejecting the ancient truth of the universal Creed, we follow, at the utmost peril of our eternal salvation, the newly devised error of one man.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies">The Commonitory of Vincent of Lérins</a>)</p>
    <h2>8th century</h2><h3><a href="https://bibleox.com/en/en/w/geHA_John_of_Damascus_7th8th_cent">St John of Damascus, monk (c. 675–754)</a></h3><blockquote><p>XXV. If, however, you say that the divine and admirable Epiphanius definitely forbade them [that is, the images], then [know that], in the first place, this book is perhaps wrongly inscribed [with his name] and is spurious: being the work of one man, it bears the name of another, as many have been accustomed to do. In the second place, we know that blessed Athanasius, having forbidden the remains of the saints to be placed in coffins—or rather, having ordered them to be hidden under the ground—wished to destroy the absurd custom of the Egyptians, who did not hide their dead under the ground, but laid them on couches and beds. Perhaps the great Epiphanius also (if, of course, we agree that this book belongs to him) prescribed that images should not be made, wishing to correct something of the same kind. For that his intention was not a contemptuous attitude towards them [that is, the images], the Church of the same divine Epiphanius bears witness, adorned all around with images to our own time. In the third place, <strong>that which <mark>happens rarely, does not become a law for the Church</mark>, and <mark>one swallow does not make a spring</mark>, as it seems also to Gregory the Theologian, and as is in reality. And <mark>one opinion is not able to refute the tradition of the whole Church</mark>, extending from [one] end of the earth to [the other] its ends.</strong></p></blockquote><p>(The First Defence Against Those Who Decry the Holy Images, 25)</p>
    <h2>15th century</h2><h3>St Mark Eugenicus, metropolitan of Ephesus (1392–1444)</h3><blockquote><p>There is a great difference between what is said in the canonical writings and the tradition of the Church, and that which <strong><mark>was written privately by one of the Teachers</mark></strong> or even his teaching; so—the first, as given by God, we must believe and reconcile one with another if something should appear not to agree; but the second <strong><mark>we must not believe unconditionally or accept without investigation</mark></strong>. For <strong><mark>it is possible that someone is even a Teacher, and yet does not speak quite correctly in everything. For what need would the Fathers have had of Ecumenical Councils, if each of them could not have departed from the truth in anything?</mark></strong></p><p>&lt;…&gt;</p><p>That only the canonical Scriptures possess infallibility is testified also by blessed Augustine in the words which he writes to Jerome: “Such honour and respect must be given only to the books of Scripture which are called ‘canonical’; for I absolutely believe that none of the authors who wrote them erred in anything... As for other writings, <strong><mark>however great the superiority of their authors in holiness and learning, when I read them I do not accept their teaching as true solely on the ground that it was they who so wrote and so thought</mark></strong>.” Then, in the letter to Fortunatus he writes the following: “Human reasoning, even if this man were Orthodox and had a high reputation, <strong>ought not to have for us the same authority as the canonical Scriptures, to such an extent that we should consider it impermissible, out of the respect due to such men, to disapprove and reject something in their writings, if it should happen that we discover that they thought otherwise than the Truth expresses, which, with God’s help, was grasped by others or by us. Such am I in regard to the writings of other men; and I desire that the reader should act thus also in regard to my own writings</strong>.”</p></blockquote><p>(On the Purifying Fire, second discourse, 15)</p>
    <h2>19th century</h2><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>The Holy Fathers command <strong>to choose a guide</strong> who is not deceived, whose freedom from deception must be recognized <strong>by the <mark>agreement of his teaching</mark> and manner of life with Holy Scripture and <mark>with the teaching of the God-bearing Fathers</mark></strong>. They <strong>warn</strong> <strong>against unskilled teachers, lest one be infected by their false teaching</strong>. They command <strong><mark>to compare the teaching of teachers with the teaching of Holy Scripture and the holy Fathers</mark>, <mark>to accept what agrees</mark>, and to reject what does not agree</strong>. They affirm that those who do not have a purified eye of the soul and cannot recognize the tree by its fruit regard the vainglorious, the empty and the hypocrites as teachers and spiritual men, while they pay no attention at all to the true saints, considering them to know nothing when they are silent, and proud and harsh when they speak.</p></blockquote><p>(Ascetic Experiences, vol. 1, On the Prayer of Jesus)</p><blockquote><p>And I began often, with tears, <strong>to entreat God that He would not deliver me over as a victim to delusion, that He would show me the right path</strong>, along which I could direct to Him the invisible procession of mind and heart. Suddenly a thought presents itself to me... and my heart goes out to it as into the embrace of a friend. This thought suggested that I should study the faith in the sources—in the <strong>writings of the holy Fathers</strong>. <strong><mark>“Their holiness,” it said to me, “is a pledge of their fidelity: choose them as your guides.” –</mark></strong><mark> </mark><strong><mark>I obey</mark></strong><mark>.</mark> I find a way to obtain the works of the holy saints of God; with thirst I begin to read them, to study them deeply. Having read some, I take up others, read, re-read, study. <strong>What <mark>struck me before all else in the writings of the Fathers of the Orthodox Church? – It was their agreement</mark>, an agreement wonderful and majestic. <mark>Eighteen centuries, in their mouths, testify with one voice to a single teaching, a Divine teaching</mark>!</strong> When on an autumn, clear night I look at the <strong>pure sky, strewn with countless stars</strong>, of such different sizes, emitting a <strong>single light</strong>, then I say to myself: <strong><mark>such are the writings of the Fathers</mark></strong>. When on a summer day I look at the <strong>vast sea</strong>, covered with a <strong>multitude of various ships</strong> with their spread sails, like white swan’s wings, ships <strong>running under one wind, toward one goal, to one harbour</strong>, then I say to myself: <strong><mark>such are the writings of the Fathers</mark></strong>. When I hear a <strong>harmonious, numerous choir</strong>, in which <strong>different voices in elegant harmony sing a single Divine song</strong>, then I say to myself: <strong><mark>such are the writings of the Fathers</mark></strong>. What teaching, among other things, do I find in them? – I find the teaching repeated by all the Fathers, the teaching that <strong><mark>the only path to salvation is the unwavering following of the instructions of the holy Fathers</mark></strong>. “Have you seen,” they say, “anyone deceived by false teaching, ruined by an incorrect choice of ascetic labours – know: he followed himself, his own reason, his own opinions, and not <strong>the teaching of the Fathers”, from which is composed the dogmatic and moral tradition of the Church</strong>. With it she, as with a priceless treasure, nourishes her children.</p></blockquote><p>(Ascetic Experiences, vol. 1, My Lament)</p><h3>St Macarius (Bulgakov), metropolitan (1816–1882)</h3><blockquote><p>The same importance was attributed to the agreed teaching of the Fathers by individual famous pastors of the Church, for example:</p><p>a) <strong>St Cyril of Alexandria: “all who have sound reason endeavour to follow the teaching of the Fathers</strong>: for they themselves were instructed by the Apostolic and Evangelical tradition, and explained the teaching of the faith from the holy Scriptures quite correctly, without error or mistake, having been lights in the world”;</p><p>b) <strong>Vincent of Lérins</strong>, the respected writer of the 5th century (c. 460), who lays down this rule concerning the use of the testimonies of the Fathers: “what all or many unanimously, openly and constantly, as though by some preliminary agreement of their teachers, receive, hold and hand down, must be considered fully trustworthy and undoubted.” Let us also remember that many holy Fathers had the custom of proving Christian truths by a series of testimonies from the writings of earlier holy Fathers, for example: St Athanasius the Great, when he wrote against the Arians on the consubstantiality of the Son of God with the Father; St Basil the Great in the book on the Holy Spirit against Macedonius; St Cyril of Alexandria in his work against Nestorius; blessed Theodoret in many of his works; St John of Damascus also in many, especially in the Exact Exposition of the Orthodox Faith and in the discourses on the holy images.</p><p>II. But, <strong><mark>ascribing in this way full authority to all the Fathers and teachers together, when they unanimously affirm something in the teaching concerning the subjects of Divine revelation, we must remember:</mark></strong></p><p>1) That <strong><mark>the same authority cannot at all be ascribed to each Father separately</mark></strong>. With all their holiness, with all the abundance of spiritual gifts, <strong>the holy Fathers were not divinely inspired, like the holy Prophets and Apostles</strong>, and therefore the writings of the Fathers must never be compared with the canonical books of Holy Scripture. The holy Fathers were not infallible each separately; on the contrary, they <strong>could err</strong> and <strong>some did in fact err</strong>, whereas the holy Prophets and Apostles were infallible each separately, and set forth for us in their divinely inspired writings only one pure truth. “We must by no means,” says blessed Augustine on this occasion, “regard the reasonings of certain men, even though they be Orthodox and praiseworthy, on a level with the canonical writings. Or think that it is not permitted to us, with the respect due to these persons, not to accept and even to reject something in their writings, if we learn with certainty that they thought otherwise than the truth commands, understood by others or by us with God’s help. So do I regard the writings of other men; so I wish that mine also should be regarded.”</p><p>2) That <strong>the same authority cannot at all be ascribed to the Fathers and teachers in those cases when they disagree among themselves</strong>; on the contrary, the voice of the Fathers themselves must then be verified by the voice of the Universal Church. This is sufficiently known to everyone from the practice of the Councils.</p><p>3) That <strong>the same authority cannot at all be ascribed to the holy Fathers and teachers when they reason not about the subjects of Divine revelation</strong>. It is known that many famous teachers of the Church, for example, blessed Augustine, St John of Damascus, wrote not infrequently about such truths as do not at all relate to the essence of the Christian faith and are not contained in revelation. Such are their writings on philosophy, history, grammar, astronomy and other natural sciences, music, poetry, etc. In all such writings, or even individual thoughts, the holy Fathers appear not as teachers of the Church but as ordinary scholars, and could err just as all men err. These subjects, as we noted earlier (§ 137), do not belong to the circle of those in relation to which the infallibility of the Universal Church herself is ascribed.</p><p>III. <strong>One should not be scandalized by the disagreement that is sometimes encountered between one or another ancient respected teacher of the Church concerning certain revealed truths and the unanimous teaching of all the other pastors, but should look upon this disagreement as a <mark>private opinion of a teacher</mark></strong>: “everything,” notes Vincent of Lérins, who reasoned in detail about this subject, “everything that a Saint or a scholar, a bishop, a confessor or a martyr, thought not in agreement with all, or even in contradiction to all—all such things must be referred to personal, private, hidden opinions, and distinguished from the authority of the common, open and universal belief.” <strong><mark>Those among Christians themselves who deliberately collect the various unintentional errors of the ancient famous pastors and Fathers of the Church are worthy of sincere regret, and thus become like Ham</mark></strong>, who, having seen the innocent nakedness of his father, not only did not cover it, but, in order to mock, even told his brothers about it. The same judicious writer <strong><mark>(Vincent of Lérins) notes that for the recognition of the agreed teaching of the Fathers there is no need to collect the testimonies of all of them to the last one, but it is enough to bring the testimonies of many</mark> of them. And in confirmation of his thought he points to the example of the Ecumenical Council of Ephesus, which recognized as the unanimous agreement of all the Fathers the testimonies of only ten of the most famous among them, as representatives of the whole Church.</strong> And one cannot but agree with such a remark. For not all the Fathers had occasion to write about every revealed truth, and many of their writings have not come down to us. Finally, one must remember that the rules of the holy Fathers, recognized and approved by the Ecumenical Councils, have for us an importance equal to that of the rules of the latter.</p></blockquote><p>(Introduction to Orthodox Theology, part II, section III, ch. II, §141, item 5)</p>
    <h2>Heretics contradict one another</h2><h2>2nd century</h2><h3><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon">St Irenaeus of Lyons, hieromartyr (c. 130–202)</a></h3><p>Heretics constantly contradict one another and invent new teachings:</p><blockquote><p>Let us now look at the inconsistent opinions of those heretics (for there are some two or three of them), how <strong><mark>they do not agree in treating the same points</mark></strong>, but alike, in things and names, set forth opinions mutually discordant.</p><p>&lt;…&gt;</p><p><strong>Every one of them hands it down just as his own inclination prompts</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-11">Against Heresies, Book I, ch. 11.1</a>)</p><blockquote><p>According to their idea, the truth properly resides <strong>at one time in Valentinus, at another in Marcion, at another in Cerinthus, then afterwards in Basilides, or has even been indifferently in any other opponent</strong>, who could speak nothing pertaining to salvation. For every one of these men, being altogether of a perverse disposition, depraving the system of truth, is not ashamed to preach himself.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-2">Against Heresies, Book III, ch. 2.1</a>)</p><blockquote><p>They affirm that certain things still, besides these, were spoken from the Pleroma, but are confuted by those which are referred to in the Scriptures as beating on the advent of Christ. But what these are [that are spoken from the Pleroma] they are not agreed, but <strong>give different answers regarding them</strong>. <strong>For if any one, wishing to test them, do question one by one with regard to any passage those who are their leading men, he shall find one of them</strong> referring the passage in question to the Propator—that is, to Bythus; another attributing it to Arche—that is, to the Only-begotten; another to the Father of all—that is, to the Word; while another, again, will say that it was spoken of that one iron who was [formed from the joint contributions] of the Aeons in the Pleroma; others [will regard the passage] as referring to Christ, while another [will refer it] to the Saviour. One, again, more skilled than these, after a long protracted silence, declares that it was spoken of Horos; another that it signifies the Sophia which is within the Pleroma; another that it announces the mother outside the Pleroma; while another will mention the God who made the world (the Demiurge). Such are the <strong><mark>variations existing among them with regard to one [passage], holding discordant opinions as to the same Scriptures</mark></strong>;</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-35">Against Heresies, Book IV, ch. 35.4</a>)</p><h3>Hegesippus (c. 100–180)</h3><blockquote><p><em>1. Hegesippus in the five books of Memoirs which have come down to us has left a most complete record of his own views. In them he states that on a journey to Rome he </em><strong><em><mark>met a great many bishops, and that he received the same doctrine from all</mark></em></strong><em>. It is fitting to hear what he says after making some remarks about the epistle of Clement to the Corinthians:</em></p><p><em>2. “</em><strong><em>The church of Corinth continued in the true faith until Primus was bishop in Corinth. I conversed with them on my way to Rome, and abode with the Corinthians many days, during which we were mutually refreshed in the true doctrine.</em></strong></p><p><strong><em>3. And when I had come to Rome I remained there until Anicetus, whose deacon was Eleutherus. And Anicetus was succeeded by Soter, and he by Eleutherus. In every succession, and in every city that is held which is preached by the law and the prophets and the Lord.</em></strong><em>”</em></p><p><em>4. The same author also describes the beginnings of the heresies which arose in his time, in the following words: “</em><strong><em>And after James the Just had suffered martyrdom, as the Lord had also on the same account, Symeon, the son of the Lord’s uncle, Clopas, was appointed the next bishop. All proposed him as second bishop because he was a cousin of the Lord. Therefore, they called the Church a virgin, for it was not yet corrupted by vain discourses.</em></strong></p><p><strong><em>5. <u>But Thebuthis, because he was not made bishop, began to corrupt it</u>. He also was sprung from the seven sects among the people, like <u>Simon</u>, from whom came the Simonians, and <u>Cleobius</u>, from whom came the Cleobians, and <u>Dositheus</u>, from whom came the Dositheans, and <u>Gorthæus</u>, from whom came the Goratheni, and Masbotheus, from whom came the Masbothæans. From them sprang <u>the Menandrianists, and Marcionists, and Carpocratians, and Valentinians, and Basilidians, and Saturnilians</u>. <mark>Each introduced privately and separately his own peculiar opinion</mark>.</em></strong></p><p><strong><em>6. From them came false Christs, false prophets, false apostles, who <mark>divided the unity of the Church</mark> by corrupt doctrines uttered against God and against his Christ.</em></strong><em>”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-4#HH-Hegesippus-and-the-Events-which-he-mentions">Eusebius of Caesarea, Church History, 4.22</a>)</p>
