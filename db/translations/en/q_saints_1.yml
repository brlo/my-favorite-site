    priority: 1
  body: '<h2>4th century</h2><h3>St John Chrysostom, Archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p><strong>It were indeed meet for us not at all
    to require the aid of the written Word, but to exhibit a life so pure, that the
    grace of the Spirit should be instead of books to our souls, and that as these
    are inscribed with ink, even so should our hearts be with the Spirit. But, since
    we have utterly put away from us this grace, come, let us at any rate embrace
    the second best course</strong>. For that the former was better, God has made
    manifest, both by His words, and by His doings. Since unto Noah, and unto Abraham,
    and unto his offspring, and unto Job, and unto Moses too, He discoursed not by
    writings, but Himself by Himself, finding their mind pure. But after the whole
    people of the Hebrews had fallen into the very pit of wickedness, then and thereafter
    was a written word, and tables, and the admonition which is given by these. And
    <strong>this one may perceive was the case, not of the saints in the Old Testament
    only, but also of those in the New. For neither to the apostles did God give anything
    in writing, but instead of written words He promised that He would give them the
    grace of the Spirit</strong>: for He, says our Lord, shall bring all things to
    your remembrance. And that you may learn <strong>that this was far better</strong>,
    hear what He says by the Prophet: I will make a new covenant with you, putting
    my laws into their mind, and in their heart I will write them, and, they shall
    be all taught of God. And Paul too, pointing out the same superiority, said, that
    they had received a law not in tables of stone, but in fleshy tables of the heart.
    But <strong><mark>since in process of time they made shipwreck, some with regard
    to doctrines, others as to life and manners, there was again need that they should
    be put in remembrance by the written word.</mark></strong> Reflect then how great
    an evil it is for us, who ought to live so purely as not even to need written
    words, but to yield up our hearts, as books, to the Spirit; now that we have lost
    that honor, and have come to have need of these, to fail again in duly employing
    even this second remedy. For if it be a blame to stand in need of written words,
    and not to have brought down on ourselves the grace of the Spirit; consider how
    heavy the charge of not choosing to profit even after this assistance, but rather
    treating what is written with neglect, as if it were cast forth without purpose,
    and at random, and so bringing down upon ourselves our punishment with increase.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/WNkc_Homilies_on_Matthew#HH-1">Homilies on Matthew,
    Homily 1</a>)</p><h3>Isidore of Pelusium, monk (c. 350–435)</h3><blockquote><p>Hence
    we ought to consider what our guilt is, when we, who were bound to live in such
    purity as to have no need of writings, and to entrust our souls to the Divine
    Spirit instead of books, have lost that honour and reduced ourselves to the need
    of writings — and yet do not make proper use even of this second remedy. For if
    it is already a fault to stand in need of writings and not to draw down the teaching
    of the Holy Spirit by a pure life, then justice demands that we consider how great
    is the evil of refusing to make use of so great a help (for it is written: <em>to
    the law and to the testimony</em>, Isaiah 8:20), while leaving the writings unheeded
    as though they were offered in vain and without purpose, and thereby bringing
    down upon ourselves a greater punishment.</p></blockquote><p>(Letters, Book II,
    196. To Isidore the Deacon)</p><h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo)
    (1651–1709)</h3><blockquote><p>Holy Scripture is the first and principal source
    of faith and religious knowledge — true and infallible, and binding for all. A
    correct and error-free understanding of Scripture is possible only under the guidance
    of the holy universal Church, and in her alone can the truth be found. Sacred
    Tradition has the same divine origin as Scripture; it therefore constitutes another
    source of faith and religious knowledge, likewise true and infallible and binding
    for all, as Holy Scripture is; and the universal Church alone, in the person of
    her heads, can be the only keeper of genuinely apostolic Tradition. — “Whoever
    wishes to know the truth, — reasons St Irenaeus, — must turn to the Church, because
    the Apostles entrusted the divine truth to her alone and, like a rich man into
    a treasury, placed in her everything that pertains to the truth. The Church alone
    is the door of life.”</p></blockquote><p>(The Suffering of the Holy Hieromartyr
    Irenaeus, Bishop of Lyons)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
