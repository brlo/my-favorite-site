  body: |
    <h2>Preface (introduction to the problem)</h2><p>From Scripture and Tradition we know that the Law of Moses (LM) has been abolished. At first glance, it is easy for people to understand the words about the abolition of the law. What does “abolished” mean? “Abolished” means that the observance of the commandments of the law no longer matters, that Christians must not follow the prescriptions of the LM. But when a person considers the commandments of the LM, a serious perplexity may arise in him. He sees commandments of two kinds: those which may be transgressed, and those which may not be transgressed. For example, the abolition of the offering of the tithe in the Jerusalem temple of course permits one not to bring it, but the abolition of the prohibition of blasphemy obviously cannot in any way permit blasphemy.</p><p>The first kind of commandments, the abolition of which allows one not to fulfil the requirement of the commandment:</p><ul><li><p>circumcision;</p></li><li><p>the Sabbath rest;</p></li><li><p>putting to death for blasphemy, for the violation of the Sabbath and for other mortal sins;</p></li><li><p>the prohibition against touching the dead;</p></li><li><p>animal sacrifices;</p></li><li><p>the offering of the tithe in the Jerusalem temple;</p></li><li><p>the celebration of the Old Testament feasts.</p></li></ul><p>The second kind of commandments, the abolition of which does not lead to the permission of the opposite actions:</p><ul><li><p>to love God;</p></li><li><p>to love one’s neighbour;</p></li><li><p>not to blaspheme;</p></li><li><p>not to commit idolatry;</p></li><li><p>not to bear false witness;</p></li><li><p>not to allow fornication, Sodomite sins, all kinds of perversions;</p></li><li><p>not to fornicate;</p></li><li><p>not to do to another what you do not wish for yourself.</p></li></ul><p>Seeing all this, a person cannot understand what then does the phrase “the Law of Moses has been abolished” mean? To help a person get out of this perplexity, some suggest dividing the LM into two parts: <strong>ceremonial</strong> commandments and <strong>moral</strong> commandments. And they explain: the ceremonial ones have been abolished, but the moral ones have not.</p><p>This approach has its problems:</p><ol><li><p>Neither the apostles nor the holy fathers divide the LM into parts: one in force and one not in force. Speaking of the abolition of the LM, they speak in general terms: we have died to the LM, we are no longer under the guidance of the LM.</p></li><li><p>If the Old Testament (OT) is finished and the LM (the conditions of remaining in the OT) has been abolished, then how can one explain the continued operation of a part of the LM for a Christian who never even entered into the OT?</p></li><li><p>There is no clear boundary between the moral and the ceremonial commandments. In the end, a person is troubled by the fact that he does not keep some commandment of the LM: “but what if I shall be condemned for not keeping something important”?</p></li><li><p>Heretics use the indistinctness of the boundary of division to catch people in their heresies. They move the implicit boundary between the ceremonial and the moral commandments, saying that one must observe the Sabbath rest, teaching people to bring the tithe into their pockets and threatening with a curse (although their pocket has no relation to the Jerusalem temple), accustoming people to observe the rejection of unclean food, and interpreting the 2nd commandment in such a way that it turns against the icons of God and His saints. Thus they accuse the Church of apostasy from God and suggest that one should rather go away into their sect, where supposedly all the necessary provisions of the LM are observed.</p></li></ol><p>Concerning the indistinctness of the boundary, more should be said:</p><ul><li><p>Is the Sabbath rest a ceremonial commandment or a moral one? Does it not urge a person to moral perfection on the seventh day?</p></li><li><p>Is bringing the tithe a ceremonial commandment? Does it not dispose the heart of a person to sacrifice, mercy and love? Is not sacrifice a help to the Church in preaching and in the performance of divine service?</p></li><li><p>Does the prohibition of images not guard against idolatry (a moral crime)?</p></li><li><p>Putting to death for mortal sins — is that a ceremonial commandment? Was this commandment not established for the preservation of morality among the people?</p></li><li><p>Are animal sacrifices not a thanksgiving to God (a moral act), which was accepted even before the LM, from the first people?</p></li></ul><p>In general, there is no division of the LM in Scripture, the holy fathers did not make it, the proposed boundary of division has no solid foundations and is indistinct, people are troubled, sectarians take advantage of this. What then should be done? To understand the abolition of the LM as the apostles and the holy fathers teach: <strong>the whole Law of Moses has been abolished, without division into parts</strong>. But what then is to be done with the commandments which obviously cannot be violated?</p><p>The answer is simple: <strong><mark>a Christian must follow Christ, and not the Law of Moses</mark></strong>. The Law of Moses has indeed been abolished whole. But since Christ is God and gave these commandments in the Old Testament, their moral part indeed often coincides with the way Christ taught us to live, <strong>but Christians learn about this by considering not the Law of Moses, but the image of Christ</strong>: His life and teaching, which are preserved in His Church. For example, Christ did not blaspheme, therefore Christians must not blaspheme either. <strong><mark>Following Christ is the very essence of the life of a Christian</mark></strong>. That is, a Christian fulfils a commandment not because the letter of the Law of Moses so commands, but because he is being made like the Lord and God Jesus Christ:</p><blockquote><p>“For as many of you as <strong>were baptized into Christ have put on Christ</strong>” (Gal. 3:27)</p></blockquote><blockquote><p>“It is no longer I who live, but <strong>Christ lives in me</strong>; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself for me” (<a href="https://bibleox.com/en/eng-nkjv/gal/2/#L20">Gal. 2:20</a>; <a href="https://bibleox.com/en/eng-nkjv/rim/8/#L10">Rom. 8:10</a>)</p></blockquote><blockquote><p>“My little children, for whom <strong>I labor in birth again until Christ is formed in you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L19">Gal. 4:19</a>)</p></blockquote><blockquote><p>“<strong>Let this mind be in you which was also in Christ Jesus</strong>” (Phil. 2:5)</p></blockquote><blockquote><p>“But he who is spiritual judges all things, yet he himself is rightly judged by no one. For ‘who has known the mind of the Lord that he may instruct Him?’ But <strong>we have the mind of Christ</strong>” (1 Cor. 2:15-16)</p></blockquote><blockquote><p><em>“Therefore I urge you, </em><strong><em>imitate me, just as I also imitate Christ</em></strong><em>” (1 Cor. 4:16; cf. 11:1)</em></p></blockquote><blockquote><p><em>“</em><strong><em>Brethren, join in following my example</em></strong><em>, and note those who so walk, </em><strong><em>as you have us for a pattern</em></strong><em>” (Phil. 3:17)</em></p></blockquote><p>Christ indicates the same manner of action: He sees the Father working and works likewise:</p><blockquote><p>“Then Jesus answered and said to them, ‘Most assuredly, I say to you, the Son can do nothing of Himself, <strong>but what <mark>He sees the Father do</mark>; for whatever He does, the Son <mark>also does</mark></strong> in like manner’” (John 5:19)</p></blockquote><p>So that we should not compare our life with the letter, but with the living God, God becomes like us, gives people Himself and His human life as a visible image, abolishing the law of commandments by His teaching:</p><blockquote><p>“<strong>having abolished</strong> in His flesh the enmity, that is, <strong>the law of commandments contained in ordinances</strong>, <strong>so as to create in Himself one new man</strong> from the two, thus making peace” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L15">Eph. 2:15</a>)</p></blockquote><blockquote><p>“But this is the covenant that I will make with the house of Israel after those days, says the Lord: <strong>I will put My law in their minds, and write it on their hearts</strong>; and I will be their God, and they shall be My people” (Jer. 31:33)</p></blockquote><blockquote><p>“clearly <strong>you are an epistle of Christ</strong>, ministered by us, <strong>written not with ink but by the Spirit of the living God, not on tablets of stone but on tablets of flesh, that is, of the heart</strong>” (2 Cor. 3:3)</p></blockquote><p>In the end, a Christian is judged not by the Law of Moses, but by the law of liberty:</p><blockquote><p>“So speak and so <strong>do</strong> <strong>as those who will be judged by the law of liberty</strong>” (Jas. 2:12)</p></blockquote><p>When a Christian tries to become like Christ, then although he does not look at the Law of Moses, the moral institutions of the LM may coincide with the manner of life of Christ. The cause of these coincidences is not the Law, but God Himself, who has become the cause both of the Law and of the holiness of the righteous man. It is not the Law that is the first cause, but God. God became the cause of the Law, and God also became the cause of the saints who became like God without needing the law (<a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L9">1 Tim. 1:9</a>).</p><p>St Irenaeus of Lyons, hieromartyr, writes about all this in greater detail in the 2nd century, the quotation is below. At the same time the martyr Justin also says briefly: “<em>An eternal and final law—namely, Christ—has been given to us, and the covenant is trustworthy, after which there shall be no law, no commandment, no ordinance</em>”.</p><p>It is worth making a reservation that the holy fathers, not living according to the Law of Moses, nevertheless composed commentaries on Scripture, including on the Law of Moses. Considering the Law of Moses through the prism of the Church’s teaching can be of use.</p><p>The law of liberty (the law of Christ) is more perfect: 1) it is built on the knowledge of Christ and 2) it requires a greater responsibility, of which the apostle speaks:</p><blockquote><p>“But beware lest somehow <strong>this liberty of yours become a stumbling block to those who are weak</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/8/#L9">1 Cor. 8:9</a>)</p></blockquote><blockquote><p>“For you, brethren, have been called to liberty; <strong>only do not use liberty as an opportunity for the flesh</strong>, but through love serve one another” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L13">Gal. 5:13</a>)</p></blockquote><p>Studying the Old Testament and the Law of Moses and drawing profit from it, one must understand that a Christian follows Christ and lives not according to the Law of Moses (not according to a fixed instruction), but out of love, being made like his Creator, depicting in himself His image, which is kept in His Church.</p><p>A life not according to the instruction of the Law, but along the path of assimilation to the image of Christ, brings to the fore questions connected with the correct image of Christ. For if a person follows another Jesus, whom the apostles did not preach (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L3-4">2 Cor. 11:3-4</a>), then he will also build his life according to the image of another Jesus: according to the image which was invented by an outside man, and not received from the Church of Christ, which personally knew, saw and heard Christ (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L1-3">1 John 1:1-3</a>), and preserved His image in herself throughout the millennia in an unbroken succession of saints who depicted Christ in themselves (<a href="https://bibleox.com/en/eng-nkjv/fil/3/#L17">Phil. 3:17</a>), from the beginning, in every century, and to the present day. However, this is already the next key question, with which the apostle John opens his epistle, bearing witness that the Church has received the true image of Christ (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L1-3">1 John 1:1-3</a>; cf. <a href="https://bibleox.com/en/eng-nkjv/gal/3/#L1">Gal. 3:1</a>) and closes the same epistle with a spontaneous warning about false images (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L21">1 John 5:21</a>).</p>
    <h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr (35–107)</h3><blockquote><p>“For <strong><mark>if we still live according to the Jewish law</mark></strong>, we acknowledge that <strong><mark>we have not received grace</mark></strong>” (<a href="https://bibleox.com/en/en/w/IgnAn_Mg#HH-8">To the Magnesians, 8</a>)</p></blockquote><blockquote><p>“<strong><mark>It is absurd to profess Christ Jesus, and to Judaize</mark></strong>. For Christianity did not embrace Judaism, but Judaism Christianity, that so every tongue which believeth might be gathered together to God” (<a href="https://bibleox.com/en/en/w/IgnAn_Mg#HH-10">To the Magnesians, 10</a>)</p></blockquote><h3>Apostle Barnabas (1st century)</h3><blockquote><p>Is there then not a command of God they should not eat [these things]? There is, but Moses spoke <strong><mark>with a spiritual reference</mark></strong>. For this reason he named the swine, as much as to say: “Thou shalt not join thyself to men who resemble swine” &lt;…&gt; “And thou shalt not eat,” he says, “the lamprey, or the polypus, or the cuttlefish.” He means: “Thou shalt not join thyself or be like to such men as are ungodly to the end, and are condemned to death.” In like manner as those fishes, above accursed, float in the deep, not swimming [on the surface] like the rest, but make their abode in the mud which lies at the bottom. Moreover, “Thou shalt not,” he says, “eat the hare.” Wherefore? “Thou shalt not be a corrupter of boys, nor like unto such.” Because the hare multiplies, year by year, the places of its conception; for as many years as it lives so many it has. Moreover, “Thou shalt not eat the hyena.” He means: “Thou shalt not be an adulterer, nor a corrupter, nor be like to them that are such.” Wherefore? Because that animal annually changes its sex, and is at one time male, and at another female. Moreover, he has rightly detested the weasel. For he means: “Thou shalt not be like to those whom we hear of as committing wickedness with the mouth, on account of their uncleanness; nor shalt thou be joined to those impure women who commit iniquity with the mouth.” &lt;…&gt; But what means the cloven-footed? That the righteous man also walks in this world, yet looks forward to the holy state [to come]. Behold how well Moses legislated. But how was it possible for them to understand or comprehend these things? We then, rightly understanding his commandments, explain them as the Lord intended. For this purpose He circumcised our ears and our hearts, that we might understand these things.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Epistle_of_Barnabas">Epistle of Barnabas, ch. 10</a>)</p>
    <h2>2nd century</h2><h3>Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><strong>The law promulgated on Horeb is now old, and belongs to yourselves alone; but this is for all universally. Now, law placed against law <mark>has abrogated that which is before it, and a covenant which comes after in like manner has put an end to the previous one</mark></strong>. An eternal and final law—namely, Christ—has been given to us, and <strong><mark>the covenant is trustworthy, after which there shall be no law, no commandment, no ordinance</mark></strong>. Have you not read this which Isaiah says: “Hearken unto Me, hearken unto Me, my people; and, ye kings, give ear unto Me: for <strong><mark>a law shall go forth from Me</mark></strong>, and My judgment shall be for a light to the nations. My righteousness approaches swiftly, and My salvation shall go forth, and nations shall trust in Mine arm?” And by Jeremiah, concerning this same new covenant, He thus speaks: “Behold, the days come, saith the Lord, that I will make a new covenant with the house of Israel and with the house of Judah; not according to the covenant which I made with their fathers, in the day that I took them by the hand, to bring them out of the land of Egypt”.</p><p>…</p><p>Moreover, that <strong>God</strong> <strong>enjoined you to keep the Sabbath</strong>, and imposed on you other precepts for a sign, as I have already said, <strong>on account of your unrighteousness, and that of your fathers</strong>.</p><p>…</p><p>And that you may learn that it was for the sins of your own nation, and for their idolatries and not because there was any necessity for such sacrifices, that they were likewise enjoined.</p><p>…</p><p>As, then, circumcision began with Abraham, and <strong>the Sabbath and sacrifices and offerings and feasts with Moses</strong>, and it has been proved <strong>they were enjoined on account of the hardness of your people’s heart</strong>, so it was necessary, in accordance with the Father’s will, that <strong><mark>they should have an end in Him who was born of a virgin, of the family of Abraham and tribe of Judah, and of David; in Christ the Son of God</mark></strong>, who was proclaimed as about to come to all the world, to be the everlasting law and the everlasting covenant, even as the forementioned prophecies show.</p><p>…</p><p>You perceive that <strong><mark>God by Moses laid all such ordinances upon you</mark></strong> on account of the hardness of your people’s hearts, in order that, by the large number of them, you might keep God continually, and in every action, before your eyes, and never begin to act unjustly or impiously.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue with Trypho</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>And that <strong><mark>not by the much-speaking of the law, but by the brevity of faith and love</mark></strong>, men were to be saved, Isaiah says thus: “A word brief and short in righteousness: for a short word will God make in the whole world.” And therefore the apostle Paul says: “Love is the fulfilling of the law”: <strong><mark>for he who loves God has fulfilled the law</mark></strong>. Moreover the Lord, when He was asked which is the first commandment, said: “Thou shalt love the Lord thy God with all thy heart and with all thy strength. And the second is like unto it: Thou shalt love thy neighbour as thyself. On these two commandments, He says, all the law hangeth and the prophets.” So then by our faith in Him He has made our love to God and our neighbour to grow, making us godly and righteous and good. And therefore a short word has God made on the earth in the world.</p><p>&lt;…&gt;</p><p>That <strong><mark>He would not send back the redeemed to the legislation of Moses—for the law was fulfilled in Christ—but would have them live in newness by the Word, through faith in the Son of God and love</mark></strong>, Isaiah declared, saying: “<strong>Remember not the former things, nor bring to mind the things that were in the beginning. Behold I make new things</strong>, which shall now spring up, and ye shall know them. And I will make in the wilderness a way, and in the waterless place streams, to give drink to my chosen race, and to my people whom I have purchased to declare my virtues.” Now a wilderness and a waterless place was at first the calling of the Gentiles: for the Word had not passed through them, nor given them the Holy Spirit to drink; who fashioned the new way of godliness and righteousness, and made copious streams to spring forth, disseminating over the earth the Holy Spirit; even as it had been promised through the prophets, that in the end of the days He should pour out the Spirit upon the face of the earth.</p><p>90. Therefore <strong><mark>by newness of the spirit is our calling, and not in the oldness of the letter</mark></strong>, even as Jeremiah prophesied</p><p>&lt;…&gt;</p><p>The first Synagogue had as husband the Law.</p><p>&lt;…&gt;</p><p>Since, then, by this calling life has been given us, and God has summed up again for Himself in us the faith of Abraham, <strong><mark>we ought not to turn back any more—I mean, to the first legislation.</mark> For we have received the Lord of the Law, the Son of God; and by faith in Him we learn to love God with all our heart, and our neighbour as ourselves</strong>. Now the love of God is far from all sin, and love to the neighbour worketh no ill to the neighbour.</p><p>96. Wherefore also <strong><mark>we need not the Law as a tutor</mark></strong>; behold, with the Father we speak, and in His presence we stand, being children in malice, and grown strong in all righteousness and soberness. For <strong>no longer shall the Law say, “Do not commit adultery,” to him who has no desire at all for another’s wife; and “Thou shalt not kill,” to him who has put away from himself all anger and enmity; and “Thou shalt not covet thy neighbour’s field or ox or ass,” to those who have no care at all for earthly things, but store up the heavenly fruits: nor “An eye for an eye, and a tooth for a tooth,” to him who counts no man his enemy, but all men his neighbours, and therefore cannot stretch out his hand at all for vengeance. It will not require tithes of him who consecrates all his possessions to God, leaving father and mother and all his kindred, and following the Word of God. And <mark>there will be no command to remain idle for one day of rest, to him who perpetually keeps sabbath, that is to say, who in the temple of God, which is man’s body, does service to God, and in every hour works righteousness</mark>. For “I desire mercy,” He saith, “and not sacrifice; and the knowledge of God more than burnt offerings”</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/YQKGC4v5_The_Proof_Demonstration_of_the_Apostolic_Preaching">The Proof (Demonstration) of the Apostolic Preaching</a>)</p>
    <h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr (c. 201–258)</h3><blockquote><p>CXIX. That heavy was <strong><mark>the yoke of the law, which is cast off by us</mark></strong>, and that the Lord’s yoke is easy, which is taken up by us.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-three-books-of-testimonies-against-the-jews">Three Books of Testimonies Against the Jews, III, 119</a>)</p>
    <h2>4th century</h2><h3>The Council of Laodicea (360)</h3><blockquote><p>“That <strong><mark>Christians must not Judaize</mark> and rest on the Sabbath, but must work on that day</strong>, and, giving preference to the Lord’s Day as Christians, must rest on it if they can. <strong>But if any shall be found Judaizing, let them be anathema from Christ</strong>.”</p></blockquote><p>(Canon 29)</p><h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3><blockquote><p><strong><mark>To the Jews was given a law written on tablets of stone; but to us are given spiritual laws, written on tablets of flesh, of the heart</mark></strong>. For it is said: “I will give My laws in their hearts, and I will write them on their minds” (Jer. 31:33). And <strong><mark>all that was being abolished and was temporary; but now truly all things are accomplished in the inner man</mark>; because the covenant is within, and in one word</strong>: “all these things happened unto them”, all that consisted in figures, “but they are written for our admonition” (1 Cor. 10:11). God foretold Abraham the future: “that your seed will be a stranger in a land that is not theirs, and they will afflict them, and they will enslave them four hundred years” (Gen. 15:13). And <strong>this also was a type and a shadow</strong>.</p><p>&lt;…&gt;</p><p>Under the law, dumb animals were offered in sacrifice; and if they were not slain, the offerings were not acceptable. And now, if sin is not slain, the offering is not pleasing to God, and is not true.</p></blockquote><p>(Spiritual Homilies, homily 47)</p><h3><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century">St John Chrysostom, archbishop of Constantinople (c. 347–407)</a></h3><blockquote><p>“Is the Law then against the promises of God?” For if the blessing is given in the seed of Abraham, but the Law brings in the curse, it must be contrary to the promises. This objection he meets, first, by a protest, in the words, “God forbid:” and next he brings his proof: “For if there had been a law given which could make alive verily righteousness would have been of the Law.”</p><p>His meaning is as follows: “If we had our hope of life in the Law, and our salvation depended on it, the objection might be valid. But <strong><mark>if it save you, by means of Faith, though it brings you under the curse, you suffer nothing from it, gain no harm, in that Faith comes and sets all right</mark></strong><mark>. </mark><strong><mark>Had the promise been by the Law, you had reasonably feared lest, separating from the Law, you should separate from righteousness</mark></strong>; but if it was given in order to shut up all, that is, to convince all and expose their individual sins, far from excluding you from the promises, it now aids you in obtaining them.” This is shown by the words, “Howbeit the scripture hath shut up all things under sin, that the promise by faith in Jesus Christ might be given to them that believe.”</p><p><strong><mark>As the Jews were not even conscious of their own sins, and in consequence did not even desire remission; the Law was given</mark></strong> to probe their wounds, <strong><mark>that they might long for a physician</mark></strong>. And the word “shut up” means “convinced” and conviction held them in fear. You see then it is not only not against, but was given for the promises. Had it arrogated to itself the work and the authority, the objection would stand; but if its drift is something else, and it acted for that, <strong>how is it against the promises of God? Had the Law not been given, <mark>all would have been wrecked upon wickedness, and there would have been no Jews to listen to Christ</mark></strong>; but now being given, it has effected two things; it has schooled its followers in a certain degree of virtue, and has pressed on them the knowledge of their own sins. And this especially made them more zealous to seek the Son, for those who disbelieved, disbelieved from having no sense of their own sins, as Paul shows; “For being ignorant of God’s righteousness, and seeking to establish their own righteousness, they did not subject themselves to the righteousness of God.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-commentary-on-galatians">Commentary on Galatians, ch. 3</a>)</p><blockquote><p>“For if I build up again those things which I destroyed, I prove myself a transgressor.” Observe the Apostle’s discernment; <strong>his opponents endeavored to show that he who kept not the Law was a transgressor, but he retorts the argument upon them, and shows that <mark>he who did keep the Law was a transgressor, not merely of faith, but of the Law itself</mark></strong>. “I build up again the things which I destroyed,” that is, the Law; he means as follows: <strong><mark>the Law has confessedly ceased, and we have abandoned it, and betaken ourselves to the salvation which comes of faith. But if we make a point of setting it up again, we become by that very act transgressors, striving to keep what God has annulled</mark></strong>. Next he shows how it has been annulled. “I through the Law died unto the Law.” This may be viewed in two ways; it is either the law of grace which he speaks of, for he is wont to call this a law, as in the words, “For the law of the Spirit of life made me free:” or it is the old Law, of which he says, that by the Law itself he has become dead to the Law. That is to say, <strong><mark>the Law itself has taught me no longer to obey itself</mark></strong><mark>, and therefore </mark><strong><mark>if I do so, I shall be transgressing even its teaching</mark></strong>. How, in what way has it so taught? Moses says, speaking of Christ, “The Lord God will raise up unto thee a Prophet from the midst of thee of thy brethren, like unto me; unto Him shall ye hearken.” Therefore they who do not obey Him, transgress the Law.</p><p>&lt;…&gt;</p><p>In these words, “I am crucified with Christ,” he alludes to Baptism, and in the words “nevertheless I live, yet not I,” our subsequent manner of life whereby our members are mortified. <strong><mark>By saying “Christ liveth in me,” he means nothing is done by me, which Christ disapproves</mark></strong>. For as by death he signifies not what is commonly understood, but a death to sin, so by life, he signifies a delivery from sin. <strong>For a man cannot live to God, otherwise than by dying to sin</strong>; and as Christ suffered bodily death, so does Paul a death to sin. “Mortify,” says he, “your members which are upon the earth; fornication, uncleanness, passion;” and again, “our old man was crucified,” which took place in the Bath. After which, <strong>if thou remainest dead to sin, thou livest to God</strong>, but if thou let it live again, thou art the ruin of thy new life. This however did not Paul, but continued wholly dead; if then, he says, <strong><mark>I live to God a life other than that in the Law, and am dead to the Law, I cannot possibly keep any part of the Law</mark></strong>.</p><p>Consider how perfect was his walk, and thou wilt be transported with admiration of this blessed soul. He says not, “I live,” but, “Christ liveth in me;” who is bold enough to utter such words? Paul indeed, who had harnessed himself to Christ’s yoke, and cast away all worldly things, and was paying universal obedience to His will, says not, “I live to Christ,” but what is far higher, “Christ liveth in me.” As sin, when it has the mastery, is itself the vital principle, and leads the soul whither it will, so, <strong>when <mark>it is slain and the will of Christ obeyed</mark>, this life is no longer earthly, but Christ liveth, that is, works, has mastery within us</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-commentary-on-galatians">Commentary on Galatians, ch. 2</a>)</p><blockquote><p>Here then he brings the hortatory part to a stop, and proceeds with the doctrines again, speaking on this wise. “Know ye not, brethren, for I speak to them that know the Law.” Since then he had said, we are “dead to sin,” he here shows that not sin only, but also <strong><mark>the Law hath no dominion over them</mark>.</strong> But if the Law hath none, much less hath sin: and <strong>to render his language palatable, he uses a human example to make this plain by</strong>. And he seems to be stating one point, but he sets down at once two arguments for his proposition. One, that <strong>when a husband is dead, the woman is no longer subject to her husband, and there is nothing to prevent her becoming the wife of another man: and the other, that in the present case it is not the husband only that is dead but the wife also. So that one may enjoy liberty in two ways.</strong> Now if when the husband is dead, she is freed from his power, when the woman is shown to be dead also, she is much more at liberty.</p><p>&lt;…&gt;</p><p>“For he that is dead,” he says, “is freed from sin.” <strong>The Law then is given for the living, but to the dead it ceaseth to give commands</strong>. Do you observe how he sets forth a twofold freedom?</p><p>&lt;…&gt;</p><p>Then he adds the conclusion in such way, that it does not tally with the premiss; for what the context would require would be, “<strong>and so, my brethren, the Law doth not rule over you, for it is dead.</strong>” But he does not say so, but only in the premiss hinted it, and in the inference, afterwards, to prevent what he says being distasteful, he brings the woman in as dead by saying, “Wherefore, my brethren, ye also are become dead to the Law.” As then the one or the other event gives rise to the same freedom, what is there to prevent his showing favor to the Law without any harm being done to the cause? “For the woman which hath an husband is bound by the Law to her husband as long as he liveth.” What is become now of those that speak evil of the Law? Let them hear, how even when forced upon it, he does not bereave it of its dignity, but speaks great things of its power; <strong>if while it is alive the Jew is bound, and they are to be called adulterers who transgress it, and leave it whiles it is alive</strong>. <strong>But if they let go of it after it has died, this is not to be wondered at. For in human affairs no one is found fault with for doing this</strong>: “but if the husband be dead, she is loosed from the law of her husband.”</p><p>You see how in the example <strong>he points out the Law as dead</strong>, but in the inference he does not do so. So then if it be while her husband liveth, the woman is called an adulteress. See how he dwells upon the accusations of those who transgress the Law, while it is yet living. But since <strong><mark>he had put an end to it, he afterwards favors it with perfect security, without doing any harm hereby to the faith</mark></strong>. “For if while her husband liveth, she be married to another man, she is called an adulteress.” Thus it would have been natural to say next, ye also, my brethren, now the Law is dead, will not be judged guilty of adultery, if ye become married to another husband. Yet he does not use these words, but what? “Ye are become dead to the Law;” <strong><mark>if ye have been made dead, ye are no longer under the Law</mark>.</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-epistle-to-the-romans-2">Homilies on the Epistle to the Romans, homily 12</a>)</p>
    <h3>Blessed Theodoret of Cyrrhus (c. 386–457)</h3><blockquote><p>“Strange doctrines” the Apostle called teachings contrary to the Gospel. Therefore he commands them to remain in the doctrine of grace and <strong>to abandon the observances of the law</strong>. For no one, he said, received any profit from it.</p></blockquote><p>(Commentary on the Epistle to the Hebrews)</p><p>1 Tim. 1:8 — The law is good if one uses it lawfully:</p><blockquote><p>I do not condemn the Law, but the bad teachers of the Law. For I know that <strong><mark>the Law is profitable</mark></strong> for those who intend to keep the purpose of the Law. This is what the words mean: “if one uses it lawfully,” that is, <strong><mark>if one follows its purpose</mark></strong>. <strong><mark>For the purpose of the Law is to lead us to the Master, Christ, and after His coming the Law no longer has force</mark></strong>. This the Apostle also said in the Epistle to the Galatians: “For I through the law died to the law that I might live to God” (Gal. 2:19). For, obeying the Law, says the Apostle, I do not keep the Law.</p></blockquote><p>(Commentary on the First Epistle to Timothy)</p><h3><a href="https://bibleox.com/en/en/w/reBD_Ephrem_the_Syrian_4th_century">St Ephrem the Syrian, monk (c. 306–373)</a></h3><p>1 Tim. 1:8 — The law is good if one uses it lawfully:</p><blockquote><p>But we <strong>know that the law is good if one uses it lawfully, that is, if one knows its time (which was appointed for it)</strong> and understands the true mysteries depicted in its types.</p></blockquote><p>(Commentary on the First Epistle to Timothy)</p>
    <h2>8th century</h2><h3>St John of Damascus, monk<strong> </strong>(2nd half of the 7th c. – before 754)</h3><blockquote><p>God, knowing the denseness of the Israelites and their carnal love and propensity towards matter in everything, made this law: first, in order that the servant and the cattle should rest as it is written, for the righteous man regardeth the life of his beast: next, in order that when they take their ease from the distraction of material things, they may gather together unto God, spending the whole of the seventh day in psalms and hymns and spiritual songs and the study of the divine Scriptures and resting in God. For <strong>when the law did not exist and there was no divinely-inspired Scripture, the Sabbath was not consecrated to God. But when the divinely-inspired Scripture was given by Moses, the Sabbath was consecrated to God in order that on it they, who do not dedicate their whole life to God, and who do not make their desire subservient to Him as though to a Father, but are like foolish servants,</strong> may on that day talk much concerning the exercise of it, and may abstract a small, truly a most insignificant, portion of their life for the service of God, and this from fear of the chastisements and punishments which threaten transgressors. For the law is not made for a righteous man but for the unrighteous. Moses, of a truth, was the first <strong>to abide fasting with God for forty days and again for another forty, and thus doubtless to afflict himself with hunger on the Sabbaths although the law forbade self-affliction on the Sabbath</strong>. But if they should object that this took place before the law, what will they say about <strong>Elias the Thesbite who accomplished a journey of forty days on one meal</strong>? For he, by thus afflicting himself on the Sabbaths not only with hunger but with the forty days’ journeying, broke the Sabbath: and yet God, Who gave the law, was not wroth with him but shewed Himself to him on Choreb as a reward for his virtue. And what will they say about <strong>Daniel? Did he not spend three weeks without food</strong>? And again, did not all Israel circumcise the child on the Sabbath, if it happened to be the eighth day after birth? And do they not hold the great fast which the law enjoins if it falls on the Sabbath? And further, do not the priests and the Levites profane the Sabbath in the works of the tabernacle and yet are held blameless? Yea, if an ox should fall into a pit on the Sabbath, he who draws it forth is blameless, while he who neglects to do so is condemned. And did not all the Israelites compass the walls of Jericho bearing the Ark of God for seven days, in which assuredly the Sabbath was included?</p><p>As I said, therefore, <strong><mark>for the purpose of securing leisure to worship God in order that they might, both servant and beast of burden, devote a very small share to Him and be at rest, the observance of the Sabbath was devised for the carnal that were still childish</mark></strong>, and in the bonds of the elements of the world, <strong><mark>and unable to conceive of anything beyond the body and the letter</mark></strong>. But when the fulness of the time was come, God sent forth His Only-begotten Son, made of a woman, made under the law, to redeem them that were under the law that we might receive the adoption of sons. For to as many of us as received Him, He gave power to become sons of God, even to them that believe on Him. So that we are no longer servants but sons: no longer under the law but <strong><mark>under grace: no longer do we serve God in part from fear, but we are bound to dedicate to Him the whole span of our life, and cause that servant, I mean wrath and desire, to cease from sin and bid it devote itself to the service of God, always directing our whole desire towards God and arming our wrath against the enemies of God: and likewise we hinder that beast of burden, that is the body, from the servitude of sin, and urge it forwards to assist to the uttermost the divine precepts</mark></strong>.</p><p>These are the things which the spiritual law of Christ enjoins on us and those who observe that become superior to the law of Moses. For <strong><mark>when that which is perfect is come, then that which is in part shall be done away</mark></strong>: and <strong><mark>when the covering of the law, that is, the veil, is rent asunder through the crucifixion of the Saviour, and the Spirit shines forth with tongues of fire, the letter shall be done away with, bodily things shall come to an end, </mark><u><mark>the law of servitude shall be fulfilled</mark></u><mark>, and the law of liberty be bestowed on us</mark></strong>. Yea we shall celebrate the perfect rest of human nature, I mean the day after the resurrection, on which the Lord Jesus, the Author of Life and our Saviour, shall lead us into the heritage promised to those who serve God in the spirit, a heritage into which He entered Himself as our forerunner after He rose from the dead, and whereon, the gates of Heaven being opened to Him, He took His seat in bodily form at the right hand of the Father, where those who keep the spiritual law shall also come.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/MIa1_An_Exact_Exposition_of_the_Orthodox_Faith__Book_4">An Exact Exposition of the Orthodox Faith, Book IV, ch. 23: Against the Jews, on the Sabbath</a>)</p><h3>The Seventh Ecumenical Council (787)</h3><blockquote><p>Since some, holding to the Jewish error, have decided to mock Christ our God: they pretend to become Christians, but <strong><mark>secretly reject Christ and covertly observe the Sabbaths and other Jewish customs</mark></strong>, we decree that such persons be received neither into communion, nor for prayer, nor into the Church, but let it be evident that they are Jews by their faith; and let not their children be baptized, and let no one buy or acquire a slave from them. But if any of them turns with sincere faith and confesses it from the whole heart, exposing their customs and deeds, so as to convict and correct other Jews as well, such a one is to be received, and his children baptized and strengthened in the renunciation of the Jewish manner of life; but if they do not turn in this way, they are in no case to be received.</p></blockquote><p>(Canon 8)</p>
    <h2>19th century</h2><h3>St Theophan the Recluse (1815–1894)</h3><blockquote><p>By this verse nothing is added to the expressed thought, but only an explanatory example of elemental service, of slavery to the elements is given.</p><p><em>Ye observe days</em> — <strong>ye observe religiously <em>days</em>, for example the Sabbath, <em>months</em> — the new moons, <em>seasons</em> — the many-day feasts, such as Pascha, the veneration of tabernacles, which also recall the seasons of the year, — <em>years</em>, the sabbatical year or the fifty-year jubilee</strong>.</p><p>Why did the Apostle touch only on the times which are religiously honored, and not on anything else? Either because by these times everything else is also determined; so that, having said this, the Apostle said as it were: <strong>ye observe days and of course everything connected with the honoring of them, that is, the whole law</strong>. Or because the Galatians, inclining toward Judaism, had begun for the time being to observe only the days, without touching the rest. By these words the measure of the seduction is determined, in what the seducers had already succeeded. Circumcision had not yet been accepted; the Galatians lacked the boldness to accept anything else either. The observance of times, however, presented no great difficulties. So it was accepted. Although the Galatians had perhaps succeeded in rendering religious honor in the Jewish manner only to the sabbaths and new moons or to some other feast that came along; yet the Apostle enumerates the whole circle of the religiously honored Jewish times.</p><p>Blessed Jerome asks at this point: but how is it that Christians too have their own days, which they honor — what then? Are they subject to the same reproach? And he answers: <strong><mark>with Christians everything is spiritual, and everything is done in the spirit of freedom</mark></strong>.</p><p>Let us add to this that Christians have not only religiously honored days, but also their own sacred rites, their own sacred persons and their own places of worship. And everything pertaining to this is determined by the rule. Is not this a bond, fetters, slavery? <strong>All this exists among Christians, because without the external we cannot be in the expressions of our reverent relations to God</strong>; whether one person pours out his soul before God, or many gather for this in one place — churches. And <strong><mark>the holy apostle Paul rejected all the external Jewish institutions</mark></strong> not because nothing external is any longer needed in Christianity, but because the Jewish externality no longer corresponded to the spirit of the new faith in Christ, wherefore it <strong>had also to be rejected</strong>. The holy Paul, like all the Apostles, rejecting the Jewish elemental worship, everywhere established his own Christian one — a verbal, rational, spiritual service. The outline of all our external order was given by the Apostles; the details were determined afterwards: time sanctified them. There is also the rule!</p><p>But all the same this is a bond; where then is Christian freedom? It is here. The rule, though it determines: act thus and so, does not say that, having fulfilled everything according to what is written, you have done the deed, and that is enough. On the contrary, <strong><mark>it prescribes entering into the spirit of what is established, so as to act out of the spirit, as it were of oneself, with one’s own mind, of one’s own will, and consequently freely</mark></strong>. The external action is one thing, truly a bond and fetters; but when that for which this action was established is received by the mind and heart, then the action ceases to bind — it develops freely out of the spirit. And all our Christian externality has come forth from the spirit. Judaism went from the external to the internal. Christianity comes from within and clothes itself in a comely externality, as a plant full of life is clothed with leaves and flowers. The fact that all this has been established in a definite form does not prevent it from being in every place and in every person living, proceeding from the spirit, free. One must only hold to one law: enter into the spirit of what is established, make it akin to the mind and heart, and, always fulfilling it, you will act from yourself freely, without feeling any bond of externality.</p><p>Thus the rule does not bind Christian freedom, obliging one to fulfil all that is established in the spirit. But it does not bind because in the Christian external rites there is nothing of which, as of the Jewish rites, it could be said: touch not, taste not, handle not, except the unchanging form of the seven Divine sacraments. <strong>We have the external, because without the external we cannot be, as people</strong>. We honor reverently the established external orders because they are sanctified by antiquity and have testified their dignity or expediency by having formed and escorted to the heavenly dwellings so many hosts of saints. But at the same time <strong><mark>the orders established among us are not of such a kind that the Church should be bound by them as by the bonds of slavery, and could change or abolish nothing in them. The Church, Christianity, in relation to them, is completely free, and, if it finds that something has ceased to be useful, it can either abolish it altogether, or replace it with something new, just as it can introduce anew what does not exist but what it recognizes as necessary</mark>. And whoever would assert that our orders are completely inviolable, except for the manner of performing the sacraments, would fall into Judaism</strong> with its: touch not. The Church of God has always used and does use such freedom; only not in such a way that today one thing, tomorrow another.</p><p>Every established action — reading, singing, movement — must be performed reverently, with fear and trembling, but not insofar as it is such an action — in its place there may be another — but insofar as it is directed to God. But he who does the work of God with negligence is cursed. Whoever would assert that fear and trembling should relate to the actions themselves, and perform them in this spirit, would have revealed in himself a Judaizing spirit.</p><p>Reverently performing the established orders, we believe that we draw down upon us God’s regard, God’s good will toward us; but not because we have performed precisely such an order: the power is not in the order, but in the filial, full of faith and devotion to God uplifting of the mind and heart. <strong><mark>Whoever would ascribe a special power to the orders themselves, insofar as they are such, apart from the Divine sacraments, would begin to Judaize</mark></strong>.</p><p><strong>Some desire (there are such sects) to strip Christianity of all externality; and they think to justify this desire by the teaching of the apostle Paul about the uselessness of the Jewish law for Christians</strong>. They have not paid due attention to the fact that the same holy Paul, who set aside all Jewish orders, <strong><mark>everywhere established his own Christian ones</mark></strong>. It seems to them that as soon as something is external, it is already Judaism, and they cry: Judaism, merit! But they do not want to understand that <strong><mark>Judaism is not in the fact that there is something external, but in the fact that this external is performed and honored in a Jewish manner</mark></strong>.</p><p>They themselves dream that they have stripped themselves of all externality and serve God in spirit, purely in a Christian way. Meanwhile, turning to God, <strong><mark>they assume a definite posture and conduct a special speech to God. What is this, if not an order? An order, only a self-willed one. Such wise men cannot have common assemblies: they do not recognize them as necessary and the concept of the Church of God as of one body</mark></strong> they cannot contain. It is remarkable that they never even cross their foreheads. Is it not evident that the spirit which teaches them and lives in them fears the cross, which has crushed all the power of the enemy.</p><p>Without external orders we, who are temporarily spatial, cannot be. <strong><mark>Even the Angels have their own orders. And in the age to come there will be their own</mark></strong>. And everything in them has its own time, place and order. Only in the spirit can and should the service of God be continuous, not limited by time, place or position.</p></blockquote><p>(Commentary on the Epistle of the Holy Apostle Paul to the Galatians)</p><p>Commentary on: 1 Tim. 1:8 — The law is good if one uses it lawfully.</p><blockquote><p>The Apostle seems to soften the preceding reproach to those who set forth the significance of the law, that they do not know what they are doing: I concede that <strong>the law is good</strong>. But he immediately adds a condition which strongly takes away all boldness from those who come forward with the teaching about the power of the law: <strong>if one uses it lawfully</strong>, χρῆται — uses it lawfully, that is, in the spirit of the law itself, according to its inner sense and meaning. I know, he says, that <strong>the law is good; but you teach about it badly</strong>. <strong><mark>You set forth its significance unconditionally, but it is subject to a condition: if. Analyze now this condition and you will find that the fulfilment of it must lead to the vision of the cessation of the law</mark></strong>. <strong><mark>The law is a tutor unto Christ — it is the shadow, but the body is Christ. Follow this tutor, walk in this shadow — and you will come to Christ</mark></strong>, the promised Deliverer. <strong><mark>While Christ had not come, you were all under the tutorship, walking in the shadow; but when Christ came, the tutorship is at an end, and the shadow must be left behind. But you keep repeating: the law, the law.</mark></strong> Consequently, you use it unlawfully, you employ it not according to its meaning and spirit; wherefore you do not know what you are saying.</p></blockquote><p>(Commentary on the First Epistle to Timothy)</p>
    <h2>20th century</h2><h3>St Hilarion (Troitsky), archbishop of Vereya, hieromartyr (1886–1929)</h3><blockquote><p>To the Jews alone was a law given (νόμος τῶν ἐντολῶν); this law was a subject of enmity between them and the Gentiles: it stood between the Gentiles and the Jews as a wall (τὸ μεσότοιχον τοῦ φραγμοῦ). So it was until the coming of Christ. But <strong><mark>Christ abolishes</mark> by His dogmas, His ideals, <mark>the Old Testament νόμος ἐντολῶν, the law</mark></strong>, which defined everything and punished everything, which revealed only human infirmity and <strong><mark>led the Old Testament people only to the consciousness of the necessity of another path of justification</mark>. <mark>In place of the law</mark>, whose commandments were inscribed on tablets of stone, <mark>is set the law written on the tablets of the heart (2 Cor. 3:3), the law of faith... the law of the spirit of life (Rom. 3:27, 8:2)</mark>. </strong>The death of Christ on the Cross opened a new path of salvation. On this path the distinction between Jews and Gentiles is abolished, and Jews and Gentiles become one — τὰ ἀμφότερα ἐν; out of Jews and Gentiles a new man is created (τοὺς δύο εἰς ἕνα καινὸν ἄνθρωπον), so that the Gentiles have become co-heirs of the Jews, partakers of the promises, and together with them constitute one Body</p><p>&lt;…&gt;</p><p><strong>Love is the new principle of the life of regenerate humanity</strong>, and all perfection, <strong>the growth of the church organism is conditioned by the partaking of individual members in <mark>the law of love</mark></strong>. All this process of growth is the work of God’s grace, but the reception of this grace (ἁφῆς τῆς ἐπιχορηγίας) is, of course, possible only with love. Without love the gifts received by a certain member would be useless for the life of the whole Body, for this member would shut itself up in itself, would not know the other members and would be isolated. Yes, without love the very reception of the gifts of the Holy Spirit would be impossible.</p><p>&lt;…&gt;</p><p>In the New Testament writings a quite definite view is established concerning the Church and its relation to Judaism. Of the New Testament sacred books, the Gospel of John and the Epistle to the Hebrews have a more vivid anti-Jewish coloring. Here we see a clearly expressed thought that <strong><mark>the Old Testament has its lawful and real significance until the foundation of the Church of Christ. But when the Church of Christ is founded, there is no need of the Old Testament with its sacrificial rites and all its laws whatsoever</mark></strong>.</p></blockquote><p>(<strong><u>Essays on the History of the Dogma of the Church</u></strong>)</p>
    <h2>Comments</h2><h3>1 Cor. 14:34 — let them be silent, as the Law also says</h3><p>St John Chrysostom says that the apostle himself establishes this law for the churches. At the same time, in order to stop the mouths of those who would want to argue, he refers “moreover” (that is, in addition) to the law, but not to the Law of Moses, but to the law which God gave in Gen. 3:16:</p><p><strong>St John Chrysostom, archbishop of Constantinople</strong></p><blockquote><p>Having abated the disturbance both from the tongues and from the prophesyings; and <strong>having made a law to prevent confusion</strong>, that they who speak with tongues should do this in turn, and that they who prophesy should be silent when another begins; he next in course proceeds to the disorder which arose from the women, cutting off their unseasonable boldness of speech: and that very opportunely. For if to them that have the gifts it is not permitted to speak inconsiderately, nor when they will, and this, though they be moved by the Spirit; much less to those women who prate idly and to no purpose. Therefore he represses their babbling with much authority, <strong>and taking the law along with him, thus he sews up their mouths</strong>; not simply exhorting here or giving counsel, but even laying his commands on them vehemently, by the recitation of an ancient law on that subject. For having said, “Let your women keep silence in the churches;” and “it is not permitted unto them to speak, but let them be in subjection;” he added, “as also saith the law.” <strong>And where doth the law say this? “Thy desire shall be to thy husband, and he shall rule over thee” (Gen. 3:16).</strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4">Homilies on the First Epistle to the Corinthians, homily 37</a>)</p><p>St John Chrysostom is followed by Sts Theodoret of Cyrrhus, Theophylact of Bulgaria, Theophan the Recluse.</p><h3>Rom. 13:10 — Love is the fulfillment of the Law</h3><p>Here the apostle speaks in reverse: it is not the one who fulfils the Law that is the one who loves, but the one who loves is the one who fulfils the Law. Thus love (even for those who do not know the Law) is the fulfillment of the Law. Because the Law of Moses is founded on this, it proceeds from love.</p><blockquote><p>“Owe no one anything except to love one another, for <strong>he who loves another has fulfilled the law</strong>. <strong>For the commandments</strong>: ‘You shall not commit adultery,’ ‘You shall not murder,’ ‘You shall not steal,’ ‘You shall not bear false witness,’ ‘You shall not covet,’ and if there is any other commandment, <strong>are all summed up in this saying, namely, ‘You shall love</strong> your neighbor as yourself.’ Love does no harm to a neighbor; therefore <strong>love is the fulfillment of the law</strong>” (Rom. 13:8-10)</p></blockquote><p>Such an understanding is offered by the hieromartyr Irenaeus of Lyons, explaining in detail that Christ Himself (the striving for His image in us) and faith in Him lead us to love. And he refers precisely to Rom. 13:10. He says that we have no need of the Law as a tutor and points out the uselessness for Christians even of the moral commandments: do not commit adultery, do not kill, do not envy, and so on, because a follower of Christ (a Christian) cannot do this, and such a thing should not even come into his head.</p><h3>Gal. 3:21 — The Law is not against the promises of God</h3><p>The holy fathers write that the promises to Abraham concerned blessings, while the Law of Moses promises curses on the contrary. Is the Law then against the promises to Abraham? No, because the Law was given as a means of seeking the promises. Sinful people had to understand through the Law that they were sinful and to seek deliverance from sin, that is, to seek the Savior. And if there had been no Law, they would not have begun to listen to Christ either. That is, again, the Law prepared them for Christ.</p><h3>Gal. 3:13 — redeemed from the curse of the Law</h3><p>Here precisely it is said why the promises to Abraham (blessings) are not contrary to the Law of Moses (which promises curses). The answer: because God redeemed from the curse.</p><h3>Gal. 2:21 — I do not set aside the grace of God. For if righteousness comes through the Law, then Christ died in vain</h3><p>Here the holy fathers say that the Law has lost its force. And further, St John Chrysostom shows that we look at Christ and follow Him, that is, the same thought as that of St Irenaeus of Lyons. See the quotations above.</p>
