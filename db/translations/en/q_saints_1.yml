- src: S9vzFOMh_Установление_канона_Священного_Писания
  path: S9vzFOMh_Biblical_canon
  title: The Biblical canon
  meta_desc: 'The biblical canon in the testimony of the Holy Fathers: Papias, Justin,
    Melito, the Muratorian Canon, Tertullian, Athanasius, Gregory the Theologian,
    Amphilochius of Iconium, the councils, John of Damascus and the Epistle of the
    Patriarchs.'
  menu:
    parent: Holy Scripture
    title: The Biblical canon
    priority: 2
  body: '<h2>Preface</h2><p><strong>The Biblical canon</strong> is the list of books
    whose content is recognized by the Church as God-revealed truth and united into
    the book known to many as the Bible.</p><p>The Old Testament part of the canon
    was formed gradually over the course of the fifteen centuries before the coming
    of the Lord Jesus Christ. Therefore the determination of the biblical canon in
    the Church of Christ concerned, in the main, the books written in the New Testament
    time — after the resurrection of the Lord Jesus Christ. The need for a canon arose
    from the fact that the sectarian groups of the gnostic movement produced a multitude
    of texts, attributing them to the apostles and using the authority of the apostles
    for the spreading of their teachings. Removing the deception of the gnostics,
    the apostolic Church placed marks on the texts, showing the faithful that the
    works indicated to it came from the apostles (that is, from within the Church
    herself), while all the rest of the multitude of works which the gnostic groups
    later manufactured have no relation to the apostles.</p><p>Today the question
    of the formation of the biblical canon is relevant because of the polemics of
    the Orthodox Church with Protestant societies, Muslims and atheists. It is characteristic
    of Protestants to assert that the historical Church, created once by Christ, later
    fell away from Him, and that various Protestant societies are gradually being
    created and offering themselves as an alternative to the “fallen Church”. It is
    claimed that their new society is the correct one, because it supposedly fully
    corresponds to the Scripture (in their interpretation, of course). Here they meet
    the question that Orthodoxy naturally poses: where do the Protestants have the
    Scripture from, and why did they decide that these particular books belong to
    the apostles and are God-revealed truth? And a problem for their idea of a “fallen
    Church” becomes the fact that it was precisely this “fallen Church” that in the
    fourth century determined that biblical New Testament canon which is recognized
    by all believers in Christ today. In answer to this, Protestants try to prove
    that the apostolic texts have always been known to everyone, or they assert that
    God established the canon through the “fallen Church” — which, in our view, is
    a weak position, capable of convincing very few sincere people.</p><p>So, was
    the canon obvious to the contemporaries of the apostles?</p><p><strong>The problem
    of false epistles in the times of the apostles</strong></p><p>In the first century
    there were no means of instant communication like the internet. The epistles were
    written by the apostles at different times, in different circumstances, to different
    communities. Besides, the apostles themselves make it clear that forged epistles,
    “as if sent by them,” were being sent to the communities (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L2">2
    Thess. 2:2</a>).</p><p>Some apostolic epistles were spread and became known to
    many communities in such a way that their authorship raised no questions. An epistle
    could be handed over personally or through the nearest companion. However, it
    happened otherwise too, when an apostle wrote from confinement, sitting there
    together with his companions.</p><p>Even when the authorship of an epistle for
    one community was indisputable, there remain many other communities. All of them,
    through various messengers, will have to pass the epistles along to one another
    in a chain, copying them again and again. And so every time, upon receiving an
    epistle, each community had first to make sure that it really belonged to the
    apostle.</p><p>A canon known to all was not composed by the apostles, so there
    is no possibility of simply checking against a trustworthy list. To protect the
    faith and the faithful, the apostles take measures against false epistles. For
    example, the apostle reports the distinguishing mark of his epistles:</p><blockquote><p>“The
    salutation of Paul <strong>with my own hand, which is a sign in every epistle.
    Thus I write</strong>: The grace of our Lord Jesus Christ be with you all. Amen.”
    (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L17-18">2 Thess. 3:17-18</a>)</p></blockquote><p>For
    this reason, by the way, for a long time there were disputes about the epistle
    of the Apostle Paul to the Hebrews, in which the author does not name himself
    and which does not contain the indicated conventional sign. But this is not all
    the means of guarding the faith. For the conventional phrase can be forged by
    anyone. As a more important rule the apostle establishes the comparison of the
    content of the epistles with the faith which the apostles handed down to the communities.
    When the apostle speaks of false epistles (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L2">2
    Thess. 2:2</a>), in the same chapter, summarizing what has been said, he establishes
    also the rule:</p><blockquote><p>“<strong>Therefore, brethren, stand fast and
    hold the traditions which you were taught, whether by word or our epistle</strong>.”
    (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L15">2 Thess. 2:15</a>)</p></blockquote><p>Indeed,
    the most reliable way to make sure of the genuineness of an epistle is to compare
    the content of the text with the content of “<em>the faith once delivered to the
    saints</em>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L3">Jude 1:3</a>).
    An epistle may be of unknown authorship, but the community is known, and it is
    known by whom its presbyter was taught for years (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L31">Acts
    20:31</a>). Therefore it was precisely the agreement of the text with the faith
    of the apostolic communities that was the criterion of a text’s belonging.</p><p>Having
    established the mark-phrase of his epistles, commanding to compare the teachings
    of those who come with the apostolic faith once planted in the Church, the apostle
    also speaks of where else his epistles may be found, calling for the exchange
    of his texts:</p><blockquote><p>“And when this epistle is read among you, cause
    that it be read also in the church of the Laodiceans; and that ye likewise read
    the epistle from Laodicea.” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L16">Col.
    4:16</a>)</p></blockquote><p>Despite this, there is no attempt by the apostle
    to fix a list of the Church’s texts rigidly. The apostles wrote epistles as the
    need arose, at the time and in the place where the need appeared. Therefore, without
    a fixed list, the question was not resolved unambiguously for all texts.</p><p>Polemizing
    with the Orthodox Church, many Protestants proceed from the idea that the apostolic
    texts were well known to everyone at once, as if the apostles themselves had composed
    a trustworthy list of their works. The Church’s decision, they imagine, was a
    mere formality, the confirmation of what was already obvious to all. In reality,
    however, this way of thinking is far from the true state of affairs. Even in the
    fourth century there was no unanimity concerning the books of the canon.</p><p>The
    canon of the New Testament which Protestants now accept was born of four centuries
    of the Church’s life. For example, even in the fourth century St John Chrysostom
    in his canon knew only 3 catholic epistles out of the 7, and does not name the
    Revelation of John the Theologian:</p><blockquote><p><em>There are also books
    of the New Testament, namely: fourteen epistles of Paul, four Gospels, two of
    the disciples of Christ — John and Matthew — and two of Luke and Mark, of whom
    one was a disciple of Peter and the other of Paul. Those saw Christ with their
    own eyes and conversed with Him, while these handed down to others what they had
    received from those. And the book of Acts, by the same Luke, telling of the events
    of those times, and </em><strong><em>three catholic epistles</em></strong><em>.</em></p></blockquote><p>(Survey
    of the Books of the Old Testament)</p><p>The same is written in the 4th century
    by St Amphilochius of Iconium:</p><blockquote><p><em>What remains? </em><strong><em>Some
    say that seven catholic epistles should be received, others only three</em></strong><em>:
    one of James, one of Peter and one of John; some accept three epistles of John,
    besides them two of Peter, and the seventh — of Jude. Likewise the </em><strong><em>Apocalypse
    of John is recognized by some, but the majority call it spurious</em></strong><em>.
    Let this, then, be the most trustworthy canon of the God-inspired Scriptures.</em></p></blockquote><p>(Canon
    1) (Letter to Seleucus)</p><p>So what all Christians today read and recognize
    as Holy Scripture is the result of at least four centuries of the life of the
    Church guided by the Holy Spirit.</p><p>Concerning the canon of the Old Testament,
    it can be said that it has been rejected by Protestants. The Church read the Old
    Testament <a href="https://bibleox.com/en/en/w/Lx6s_The_Evangelists_Refer_to_the_Septuagint">according
    to the Septuagint</a>, together with those books which Protestants now do not
    accept, having looked at the list of books found in the Hebrew presentation.</p><p>Further
    below are quotations which in one way or another have a bearing on the question
    of the canon of Scripture.</p><h2>2nd century</h2><h3>Papias of Hierapolis (c.
    70–155)</h3><blockquote><p>This is what the presbyter said: " <strong>Mark, having
    become the interpreter of Peter, wrote down accurately everything</strong> that
    he remembered of what was said and done by the Lord, though not in order, for
    he had not heard the Lord nor followed Him. Later <strong>he accompanied Peter,
    who taught as the needs required</strong> and did not intend to arrange the words
    of Christ in order. <strong>So Mark made no mistake in writing things down</strong>
    as he remembered them; he took care only of one thing: to omit nothing of what
    he had heard and to state nothing falsely ". 16. This is what Papias says about
    Mark; about Matthew he reports the following: " <strong>Matthew wrote down the
    discourses of Jesus in Hebrew</strong>, and each translated them as best he could</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Papias_of_Hierapolis">Papias of Hierapolis</a>)</p><h3>Justin
    the Philosopher and Martyr (c. 100–165)</h3><blockquote><p>…when He kept silence,
    and chose to return no answer to any one in the presence of Pilate; as has been
    declared <strong>in the <mark>memoirs of His apostles</mark></strong></p><p>…
    </p><p>We have perceived, moreover, that the expression, ''The day of the Lord
    is as a thousand years,'' is connected with this subject. And further, there was
    a certain man with us, whose name was <strong>John, one of the apostles of Christ,</strong>
    who prophesied, <strong>by a <mark>revelation</mark> that was made to him</strong>,
    that those who believed in our Christ</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><h3>Melito of Sardis, bishop (c. 100–180)</h3><blockquote><p><em>Melito
    to his brother Onesimus, greeting:— As you have often, prompted by your regard
    for the word of God, expressed a wish to have some extracts made from the Law
    and the Prophets concerning the Saviour, and concerning our faith in general,
    and have desired, moreover, to obtain an accurate account of the Ancient Books,
    as regards their number and their arrangement, I have striven to the best of my
    ability to perform this task: well knowing your zeal for the faith, and your eagerness
    to become acquainted with the Word, and especially because I am assured that,
    through your yearning after God, you esteem these things beyond all things else,
    engaged as you are in a struggle for eternal salvation. I accordingly proceeded
    to the East, and went to the very spot where the things in question were preached
    and took place; and, having made myself accurately acquainted with the books of
    the Old Testament, I have set them down below, and herewith send you the list.
    Their names are as follows:— </em></p><ul><li><p><em>The five books of Moses—</em></p><ul><li><p><em>Genesis,
    </em></p></li><li><p><em>Exodus, </em></p></li><li><p><em>Leviticus, </em></p></li><li><p><em>Numbers,
    </em></p></li><li><p><em>Deuteronomy; </em></p></li></ul></li><li><p><em>Joshua,
    </em></p></li><li><p><em>Judges, </em></p></li><li><p><em>Ruth, </em></p></li><li><p><em>the
    four books of Kings, </em></p></li><li><p><em>the two of Chronicles, </em></p></li><li><p><em>the
    book of the Psalms of David, </em></p></li><li><p><em>the Proverbs of Solomon,
    also called the Book of Wisdom, </em></p></li><li><p><em>Ecclesiastes, </em></p></li><li><p><em>the
    Song of Songs, </em></p></li><li><p><em>Job, </em></p></li><li><p><em>the books
    of the prophets Isaiah, Jeremiah, of the twelve contained in a single book, Daniel,
    Ezekiel, Esdras. From these I have made my extracts, dividing them into six books</em></p></li></ul></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/melito-fragments">Fragments (Extracts)</a>)</p><h3>Tatian
    (c. 120–175)</h3><p>On the fact that Tatian compiled a collection of texts from
    the four Gospels, named the Diatessaron:</p><blockquote><p>Clement of Alexandria
    (Strom. III, 12) ascribes to him a book “on perfection according to the Saviour’s
    teaching.” Eusebius (V, 13) mentions that he laboured on a “book of questions”
    (προβλημάτων), in which the obscure and difficult places of Holy Scripture were
    explained; and <strong>he also compiled a harmony of the gospels and gave it the
    name διατεσσάρων (through four)</strong>. The properties and composition of this
    last most remarkable work have to this day remained a subject of dispute among
    scholars, owing to the lack of precise and detailed testimony from the ancient
    ecclesiastical writers. Already in the time of Theodoret (†458) a considerable
    number of Tatian’s Diatessaron existed, and this is what Theodoret reports about
    it (haer. fab. I, 20): Tatian composed a gospel called the Diatessaron, omitting
    the genealogies of Christ and other passages showing that the Lord according to
    the flesh was descended from the seed of David. This gospel was used not only
    by the followers of Tatian but by Orthodox Christians as well, as a very convenient
    book, without knowing the craftiness of that harmony. Theodoret himself found
    more than 200 copies of it in the churches of his district (Cyrrhus), took them
    away and replaced them with the canonical gospels of the four evangelists.</p></blockquote><p>(P.
    Preobrazhensky, “On Tatian and his Apology”)</p><h3>The Canon from a text of an
    unknown author, discovered in 1700 by Muratori</h3><p>It is presumed that the
    text was written at the end of the 2nd century:</p><blockquote><p>…at which nevertheless
    he was present, and so he placed [them in his narrative]. (2) <strong>The third
    book of the Gospel</strong> is that <strong>according to Luke</strong>. (3) Luke,
    the well-known physician, after the ascension of Christ, (4-5) when Paul had taken
    him with him as one zealous for the law, (6) composed it in his own name, according
    to [the general] belief. Yet he himself had not (7) seen the Lord in the flesh;
    and therefore, as he was able to ascertain events, (8) so indeed he begins to
    tell the story from the birth of John. (9) <strong>The fourth of the Gospels is
    that of John</strong>, [one] of the disciples, (10) To his fellow disciples and
    bishops, who had been urging him [to write], (11) he said, "Fast with me from
    today for three days, and what (12) will be revealed to each one (13) let us tell
    it to one another." In the same night it was revealed (14) to Andrew, [one] of
    the apostles, (15-16) that John should write down all things in his own name while
    all of them should review it. And so, though various (17) elements may be taught
    in the individual books of the Gospels, (18) nevertheless this makes no difference
    to the faith of believers, since by the one sovereign Spirit all things (19) (20)
    have been declared in all [the Gospels]: concerning the (21) nativity, concerning
    the passion, concerning the resurrection, (22) concerning life with his disciples,
    (23) and concerning his twofold coming; (24) the first in lowliness when he was
    despised, which has taken place, (25) the second glorious in royal power, (26)
    which is still in the future. What (27) marvel is it, then, if John so consistently
    (28) mentions these particular points also in his Epistles, (29) saying about
    himself: "What we have seen with our eyes (30) and heard with our ears and our
    hands (31) have handled, these things we have written to you"? (32) For in this
    way he professes [himself] to be not only an eye-witness and hearer, (33) but
    also a writer of all the marvelous deeds of the Lord, in their order. (34) Moreover,
    <strong>the acts of all the apostles (35) were written in one book</strong>. For
    "most excellent Theophilus" Luke compiled (36) the individual events that took
    place in his presence - (37) as he plainly shows by omitting the martyrdom of
    Peter (38) as well as the departure of Paul from the city [of Rome] (39) when
    he journeyed to Spain. As for the Epistles of (40-1) Paul, they themselves make
    clear to those desiring to understand, which ones [they are], from what place,
    or for what reason they were sent. (42) First of all, <strong>to the Corinthians</strong>,
    prohibiting their heretical schisms; (43) next, <strong>to the Galatians</strong>,
    against circumcision; (44-6) then <strong>to the Romans</strong> he wrote at length,
    explaining the order (or, plan) of the Scriptures, and also that Christ is their
    principle (or, main theme). It is necessary (47) for us to discuss these one by
    one, since the blessed (48) apostle Paul himself, following the example of his
    predecessor (49-50) John, writes by name to only seven churches in the following
    sequence: <strong>to the Corinthians (51) first, to the Ephesians second, to the
    Philippians third, (52) to the Colossians fourth, to the Galatians fifth, (53)
    to the Thessalonians sixth, to the Romans (54-5) seventh</strong>. It is true
    that <strong>he writes once more to the Corinthians and to the Thessalonians</strong>
    for the sake of admonition, (56-7), yet it is clearly recognizable that there
    is one Church spread throughout the whole extent of the earth. For <strong>John
    also in the (58) Apocalypse</strong>, though he writes to seven churches, (59-60)
    nevertheless speaks to all. [Paul also wrote) out of affection and love <strong>one
    to Philemon, one to Titus, and two to Timothy</strong>; and <strong>these are
    held sacred</strong> (61) (62-3) in the esteem of the Church catholic for the
    regulation of ecclesiastical discipline. There is current also [an epistle] <strong><mark>to
    (64) the Laodiceans, [and] another to the Alexandrians, [both forged in Paul''s
    (65) name to [further] the heresy of Marcion, and several others (66) which cannot
    be received into the catholic church</mark></strong> (67) -for it is not fitting
    that gall be mixed with honey. (68) Moreover, <strong>the Epistle of Jude and
    two of the above-mentioned (or, bearing the name of) John</strong> are counted
    (or, used) in the catholic [Church); and [the book of] <strong>Wisdom, (69) (70)
    written by the friends of Solomon</strong> in his honour. (71) We receive only
    <strong>the apocalypses of John and Peter, (72) though some of us are not willing
    that the latter be read in church</strong>. (73) But Hermas wrote the Shepherd
    (74) very recently, in our times, in the city of Rome, (75) while bishop Pius,
    his brother, was occupying the [episcopal] chair (76) of the church of the city
    of Rome. (77) And therefore it ought indeed to be read; but (78) it cannot be
    read publicly to the people in church either among (79) the prophets, whose number
    is complete, or among (80) the apostles, for it is after [their] time. (81) But
    we accept nothing whatever of Arsinous or Valentinus or Miltiades, (82) who also
    composed (83) a new book of psalms for Marcion, (84-5) together with Basilides,
    the Asian founder of the Cataphrygians…</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/b8Un_Muratorian_Canon">The
    Muratorian Canon</a>)</p><h3>Tertullian (c. 155–240)</h3><blockquote><p>“Now this
    heresy of yours does not receive certain Scriptures; and whichever of them it
    does receive, it perverts by means of additions and diminutions, for the accomplishment
    of its own purpose; and such as it does receive, it receives not in their entirety.”
    (Gnosticism — <em>note</em>)</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-the-prescription-against-heretics">The
    Prescription Against Heretics</a>)</p><h2>4th century</h2><h3>St Athanasius the
    Great (c. 295–373)</h3><blockquote><p>There are, then, of the Old Testament, twenty-two
    books in number; for, as I have heard, it is handed down that this is the number
    of the letters among the Hebrews; their respective order and names being as follows.
    </p><p><strong>The first is Genesis, then Exodus, next Leviticus, after that Numbers,
    and then Deuteronomy. Following these there is Joshua, the son of Nun, then Judges,
    then Ruth. And again, after these four books of Kings, the first and second being
    reckoned as one book, and so likewise the third and fourth as one book. And again,
    the first and second of the Chronicles are reckoned as one book. Again Ezra, the
    first and second are similarly one book. After these there is the book of Psalms,
    then the Proverbs, next Ecclesiastes, and the Song of Songs. Job follows, then
    the Prophets, the twelve being reckoned as one book. Then Isaiah, one book, then
    Jeremiah with Baruch, Lamentations, and the epistle, one book; afterwards, Ezekiel
    and Daniel, each one book.</strong> Thus far constitutes the Old Testament. </p><p>5.
    Again it is not tedious to speak of the [books] of the New Testament. These are,
    <strong>the four Gospels, according to Matthew, Mark, Luke, and John. Afterwards,
    the Acts of the Apostles and Epistles (called Catholic), seven, viz. of James,
    one; of Peter, two; of John, three; after these, one of Jude. In addition, there
    are fourteen Epistles of Paul, written in this order. The first, to the Romans;
    then two to the Corinthians; after these, to the Galatians; next, to the Ephesians;
    then to the Philippians; then to the Colossians; after these, two to the Thessalonians,
    and that to the Hebrews; and again, two to Timothy; one to Titus; and lastly,
    that to Philemon. And besides, the Revelation of John.</strong> 6. These are fountains
    of salvation, that they who thirst may be satisfied with the living words they
    contain. In these alone is proclaimed the doctrine of godliness. Let no man add
    to these, neither let him take ought from these. For concerning these the Lord
    put to shame the Sadducees, and said, ‘Ye do err, not knowing the Scriptures.’
    And He reproved the Jews, saying, ‘Search the Scriptures, for these are they that
    testify of Me (Matt. 22:29; John 5:39).’ </p><p>7. But for greater exactness I
    add this also, writing of necessity; that there are other books besides these
    not indeed included in the Canon, but appointed by the Fathers to be read by those
    who newly join us, and who wish for instruction in the word of godliness. <strong>The
    Wisdom of Solomon, and the Wisdom of Sirach, and Esther, and Judith, and Tobit,
    and that which is called the Teaching of the Apostles, and the Shepherd</strong>.
    But the former, my brethren, are included in the Canon, the latter being [merely]
    read; nor is there in any place a mention of apocryphal writings. But they are
    an invention of heretics, who write them when they choose, bestowing upon them
    their approbation, and assigning to them a date, that so, using them as ancient
    writings, they may find occasion to lead astray the simple.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/athanasius-the-festal-letters-1">Festal Letter
    39, on the canon of Holy Scripture</a>)</p><h3>The Canons of the Holy Apostles</h3><blockquote><p>Let
    the following books be counted venerable and sacred by all of you, both clergy
    and Laity. <strong>Of the Old Testament</strong>, five books of Moses, Genesis,
    Exodus, Leviticus, Numbers, Deuteronomy; of Joshua the Son of Nun, one; of the
    Judges, one; of Ruth, one; of the Kings, four; of the Chronicles of the book of
    the days, two; of Ezra, two; of Esther, one; [some texts read “of Judith, one”;]
    of the Maccabees, three; of Job, one; of the Psalter, one; of Solomon, three,
    viz.: Proverbs, Ecclesiastes, and the Song of Songs; of the Prophets, twelve;
    of Isaiah, one; of Jeremiah, one; of Ezekiel, one; of Daniel, one. But besides
    these you are recommended to teach your young persons the Wisdom of the very learned
    Sirach. <strong>Our own books, that is, those of the New Testament</strong>, are:
    the four Gospels of Matthew, Mark, Luke, and John; fourteen Epistles of Paul;
    two Epistles of Peter; three of John; one of James, and one of Jude. Two Epistles
    of Clemens, and the Constitutions of me Clemens, addressed to you Bishops, in
    eight books, which are not to be published to all on account of the mystical things
    in them. And the Acts of us the Apostles.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-holy-apostles">Apostolic
    Canon 85</a>)</p><h3>The Council of Laodicea (360)</h3><blockquote><p>Of the books
    which are to be read. </p><p><strong>These are all the books of Old Testament
    appointed to be read</strong>: 1, Genesis of the world; 2, The Exodus from Egypt;
    3, Leviticus; 4, Numbers; 5, Deuteronomy; 6, Joshua, the son of Nun; 7, Judges,
    Ruth; 8, Esther; 9, Of the Kings, First and Second; 10, Of the Kings, Third and
    Fourth; 11, Chronicles, First and Second; 12, Esdras, First and Second; 13, The
    Book of Psalms; 14, The Proverbs of Solomon; 15, Ecclesiastes; 16, The Song of
    Songs; 17, Job; 18, The Twelve Prophets; 19, Isaiah; 20, Jeremiah, and Baruch,
    the Lamentations, and the Epistle; 21, Ezekiel; 22, Daniel. </p><p><strong>And
    these are the books of the New Testament</strong>: Four Gospels, according to
    Matthew, Mark, Luke and John; The Acts of the Apostles; Seven Catholic Epistles,
    to wit, one of James, two of Peter, three of John, one of Jude; Fourteen Epistles
    of Paul, one to the Romans, two to the Corinthians, one to the Galatians, one
    to the Ephesians, one to the Philippians, one to the Colossians, two to the Thessalonians,
    one to the Hebrews, two to Timothy, one to Titus, and one to Philemon.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-canons-of-the-councils-of-ancyra-neocaesarea-gangra-antioch-and-laodicea-5#HH-Canon-LX">Canon
    60 of the Council of Laodicea</a>)</p><h3>St Gregory the Theologian (325–389)</h3><blockquote><p>But
    that your mind be not led astray by foreign books — for spurious writings are
    many — accept from me, friend, this tried list. </p><p>There are, in all, <strong>twelve
    historical books of the ancient Hebrew wisdom</strong>: first Genesis, then Exodus,
    Leviticus, then Numbers, then Deuteronomy, then Joshua and Judges, Ruth as the
    eighth, and the ninth and tenth — the Acts of the Kings, then Chronicles, and
    Ezra as your last book. Of books in verse there are five: of them the first is
    Job, then David, then the 3 books of Solomon — Ecclesiastes, the Song of Songs
    and the Proverbs. Of the prophetic spirit there are likewise five books: 1 in
    the Scripture they compose twelve — Hosea, Amos and the third Micah, then Joel,
    then Jonah and Obadiah, Nahum, Habakkuk and Zephaniah, Haggai, then Zechariah
    and Malachi. This is one book, and the second is Isaiah, then Jeremiah called
    from his infancy, then Ezekiel and the grace of Daniel. </p><p>Here I have set
    out 22 books of the Old Testament, according to the number of the Hebrew letters;
    now reckon also <strong>the books of the new mystery</strong>. Matthew described
    the miracles of Christ for the Hebrews, Mark for Italy, Luke for Achaea, and John,
    the great heaven-walking preacher, for all. Then the Acts of the wise Apostles,
    14 epistles of Paul, 7 catholic, of which 1 is of James, 2 of Peter, 3 again of
    John, and the seventh of Jude. </p><p>Here you have all the books; and if there
    are any besides them, they are not among the genuine.</p></blockquote><p>(Canon
    1 of Gregory the Theologian)</p><h3>St Amphilochius of Iconium (c. 340 – after
    394)</h3><blockquote><p>But especially must you know this, that not every book
    is trustworthy, even if it bears the venerable name of Scripture. For there exist,
    there sometimes exist, falsely-titled books: some of them, one may say, are middling
    and near to the word of truth, while others are spurious and most dangerous, like
    counterfeit and false coins, which though bearing the royal inscription are counterfeited
    in their composition. Therefore I will name to you each of the God-inspired books,
    and that you may know all clearly, first I will name <strong>the books of the
    Old Testament</strong>. </p><p>The Pentateuch comprises the Creation, then Exodus,
    in the middle the book of Leviticus, after it Numbers, and then Deuteronomy. To
    them add the books of Joshua and Judges, then Ruth, the 4 books of Kings and the
    2 of Chronicles, after them Ezra the first and second. Next I will name the 5
    books in verse: the book of Job, crowned for his contests in manifold sufferings,
    the book of Psalms, the tuneful healing of the soul, the 3 books of the wise Solomon
    — Proverbs, Ecclesiastes and the Song of Songs. To them add the 12 prophets: the
    first Hosea, then the second Amos, Micah, Joel, Obadiah and Jonah, the type of
    the three-day Suffering; after them Nahum, Habakkuk, then the ninth Zephaniah,
    Haggai and Zechariah, and the glorious herald Malachi. After them come to know
    the 4 prophets: the great Isaiah who spoke with boldness, the compassionate Jeremiah
    and the mystical Ezekiel, and the last — Daniel, most wise both in word and deed.
    To these books some add Esther. </p><p>The time has come for me to name <strong>the
    books of the New Testament</strong>. Receive only the 4 Evangelists: Matthew,
    then Mark, with Luke added as the third; count John in time as the fourth, but
    in the height of his dogmas as the first, for worthily do I call him the son of
    thunder: he magnified the Word of God above all. Receive also the 2nd book of
    Luke — the book of the catholic Acts of the Apostles. And add the chosen vessel,
    the preacher and apostle of the nations — Paul, who wisely wrote to the Churches
    14 Epistles: the first to the Romans, to which must be added 2 to the Corinthians,
    to the Galatians, to the Ephesians, after it to those living in Philippi, then
    what was written to the Colossians, 2 to the Thessalonians and 2 to Timothy, and
    to Titus and Philemon 1 each, and to the Hebrews 1 (some call it spurious, but
    they speak wrongly, for in it is the genuine grace). What remains? Some say that
    7 catholic Epistles should be received, others only 3: 1 of James, of Peter 1
    and of John 1, while some accept 3 epistles of John, besides them 2 of Peter,
    and the seventh — of Jude. Likewise the Apocalypse of John is recognized by some,
    but the majority call it spurious. Let this, then, be the most trustworthy canon
    of the God-inspired Scriptures.</p></blockquote><p>(Canon 1) (Letter to Seleucus)</p><h2>5th
    century</h2><h3>The Council of Carthage (393–419)</h3><blockquote><p>Decreed:
    that nothing be read in the Church under the name of the Divine Scriptures except
    the canonical Scriptures. And the canonical Scriptures are these: Genesis, Exodus,
    Leviticus, Numbers, Deuteronomy, Joshua the son of Nun, Judges, 4 books of Kings,
    2 books of Chronicles, Job, the Psalter, 4 books of Solomon, 12 books of the prophets,
    Isaiah, Jeremiah, Ezekiel, Daniel, Tobit, Judith, Esther, 2 books of Ezra. <strong>Of
    the New Testament:</strong> 4 Gospels, 1 book of the Acts of the Apostles, 14
    epistles of Paul, 2 of the Apostle Peter, 3 of the Apostle John, 1 of the Apostle
    James, 1 of the Apostle Jude, the Apocalypse of John, 1 book.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-canons-of-the-synods-of-sardica-carthage-and-constantinople-2#HH-Canon-XXIV">Canon
    33</a>)</p><h2>7th century</h2><h3>The Sixth Œcumenical Council (691)</h3><p>Confirmation
    of the earlier canons of councils and holy fathers, in which the books of the
    biblical canon were listed:</p><blockquote><p>It has also seemed good to this
    holy Council, that <strong>the eighty-five canons, received and ratified by the
    holy and blessed Fathers before us, and also handed down to us in the name of
    the holy and glorious Apostles</strong> should from this time forth remain firm
    and unshaken for the cure of souls and the healing of disorders. And in these
    canons we are bidden to receive the Constitutions of the Holy Apostles [written]
    by Clement. But formerly through the agency of those who erred from the faith
    certain adulterous matter was introduced, clean contrary to piety, for the polluting
    of the Church, which obscures the elegance and beauty of the divine decrees in
    their present form. We therefore reject these Constitutions so as the better to
    make sure of the edification and security of the most Christian flock; by no means
    admitting the offspring of heretical error, and cleaving to the pure and perfect
    doctrine of the Apostles. But we set our seal likewise upon all the other holy
    canons set forth by our holy and blessed Fathers, that is, by the 318 holy God-bearing
    Fathers assembled at Nice, and those at Ancyra, further those at Neocæsarea and
    likewise those at Gangra, and besides, those at Antioch in Syria: those too at
    <strong>Laodicea in Phrygia</strong>: and likewise the 150 who assembled in this
    heaven-protected royal city: and the 200 who assembled the first time in the metropolis
    of the Ephesians, and the 630 holy and blessed Fathers at Chalcedon. In like manner
    those of Sardica, and those of <strong>Carthage</strong>: those also who again
    assembled in this heaven-protected royal city under its bishop Nectarius and Theophilus
    Archbishop of Alexandria. Likewise too the Canons [i.e. the decretal letters]
    of Dionysius, formerly Archbishop of the great city of Alexandria; and of Peter,
    Archbishop of Alexandria and Martyr; of Gregory the Wonder-worker, Bishop of Neocæsarea;
    of <strong>Athanasius, Archbishop of Alexandria</strong>; of Basil, Archbishop
    of Cæsarea in Cappadocia; of Gregory, Bishop of Nyssa; of <strong>Gregory Theologus;
    of Amphilochius of Iconium</strong>; of Timothy, Archbishop of Alexandria; of
    Theophilus, Archbishop of the same great city of Alexandria; of Cyril, Archbishop
    of the same Alexandria; of Gennadius, Patriarch of this heaven-protected royal
    city. Moreover the Canon set forth by Cyprian, Archbishop of the country of the
    Africans and Martyr, and by the Synod under him, which has been kept only in the
    country of the aforesaid Bishops, according to the custom delivered down to them.
    And that no one be allowed to transgress or disregard the aforesaid canons, or
    to receive others beside them, supposititiously set forth by certain who have
    attempted to make a traffic of the truth. But should any one be convicted of innovating
    upon, or attempting to overturn, any of the afore-mentioned canons, he shall be
    subject to receive the penalty which that canon imposes, and to be cured by it
    of his transgression.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-council-in-trullo-quinisext#HH-Canon-II">Canon
    2 of the Sixth Œcumenical Council</a>)</p><h2>8th century</h2><h3>St John of Damascus
    (2nd half of the 7th c. – before 754)</h3><blockquote><p>Observe, further, that
    there are two and twenty <strong>books of the Old Testament</strong>, one for
    each letter of the Hebrew tongue. For there are twenty-two letters of which five
    are double, and so they come to be twenty-seven. For the letters <em>Caph</em>,
    <em>Mere</em>, <em>Nun</em>, <em>Pe</em>, <em>Sade</em> are double. And thus the
    number of the books in this way is twenty-two, but is found to be twenty-seven
    because of the double character of five. For <em>Ruth</em> is joined on to <em>Judges</em>,
    and the Hebrews count them one book: <em>the first and second books of Kings</em>
    are counted one and so are the <em>third and fourth</em> books of <em>Kings</em>:
    and also <em>the first and second of Paraleipomenä</em> and <em>the first and
    second of Esdra</em>. In this way, then, the books are collected together in four
    Pentateuchs and two others remain over, to form thus the canonical books. Five
    of them are of the Law, viz. <em>Genesis, Exodus, Leviticus, Numbers, Deuteronomy</em>.
    This which is the code of the Law, constitutes the first Pentateuch. Then comes
    another Pentateuch, the so-called Grapheia, or as they are called by some, the
    Hagiographa, which are the following: <em>Jesus the Son of Nave</em>, <em>Judges</em>
    along with <em>Ruth</em>, <em>first</em> and <em>second Kings</em>, which are
    one book, <em>third</em> and <em>fourth</em> Kings, which are one book, and the
    <em>two</em> books of the <em>Paraleipomena</em> which are one book. This is the
    second Pentateuch. The third Pentateuch is the books in verse, viz. <em>Job, Psalms,
    Proverbs of Solomon, Ecclesiastes</em> of Solomon and the <em>Song of Songs</em>
    of Solomon. The fourth Pentateuch is the Prophetical books, viz <em>the twelve
    prophets</em> constituting one book, <em>Isaiah, Jeremiah, Ezekiel, Daniel</em>.
    Then come the <em>two</em> <em>books</em> <em>of Esdra</em> made into one, and
    <em>Esther</em>. There are also the Panaretus, that is the <em>Wisdom of Solomon</em>,
    and the <em>Wisdom of Jesus</em>, which was published in Hebrew by the father
    of Sirach, and afterwards translated into Greek by his grandson, Jesus, the Son
    of Sirach. These are virtuous and noble, but are not counted nor were they placed
    in the ark. </p><p><strong>The New Testament</strong> contains four gospels, <em>that
    according to Matthew, that according to Mark, that according to Luke, that according
    to John</em>: <em>the Acts of the Holy Apostles</em> by Luke the Evangelist: seven
    catholic epistles, viz. one of <em>James</em>, two of <em>Peter</em>, three of
    <em>John</em>, one of <em>Judë</em> fourteen <em>letters of the Apostle</em> <em>Paul</em>:
    <em>the Revelation of John the Evangelist</em>: <em>the Canons of the holy apostles</em>,
    by Clement.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/MIa1_An_Exact_Exposition_of_the_Orthodox_Faith__Book_4#HH-Chapter-XVII-Concerning-Scripture">An
    Exact Exposition of the Orthodox Faith, Book IV, ch. 17</a>)</p><h2>17th century</h2><h3>The
    Epistle of the Patriarchs (1723)</h3><p>This is a conciliar document of the Church
    of Jerusalem (1672), but by this time (1723) it had also been approved by the
    four patriarchates (Constantinople, Jerusalem, Antioch, and Alexandria) and by
    the Synod of the Russian Church.</p><blockquote><p>Following the rule of the Catholic
    Church, we call Sacred Scripture all those which Cyril [Lucar] collected from
    <a href="https://bibleox.com/en/en/w/S9vzFOMh_Biblical_canon#HH-The-Council-of-Laodicea-360">the
    Synod of Laodicea</a>, and enumerated, adding thereto those which he foolishly,
    and ignorantly, or rather maliciously called Apocrypha; to wit, <strong>The Wisdom
    of Solomon</strong>, <strong>Judith</strong>, <strong>Tobit</strong>, <strong>The
    History of the Dragon</strong>, <strong>The History of Susanna</strong>, <strong>The
    Maccabees</strong>, and <strong>The Wisdom of Sirach</strong>. </p><p><strong><em><mark>For
    we judge these also to be with the other genuine Books of Divine Scripture genuine
    parts of Scripture</mark></em></strong>. For ancient custom, or rather the Catholic
    Church, which hath delivered to us as genuine the Sacred Gospels and the other
    Books of Scripture, hath undoubtedly delivered these also as parts of Scripture,
    and the denial of these is the rejection of those. </p><p>And if, perhaps, it
    seemeth that not always have all been by all reckoned with the others, yet nevertheless
    these also have been counted and reckoned with the rest of Scripture, as well
    by Synods, as by how many of the most ancient and eminent theologians of the Catholic
    Church; <strong><mark>all of which we also judge to be Canonical Books, and confess
    them to be Sacred Scripture</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Q-3-What-books-do-you-call-Sacred-Scripture">The
    Eastern Orthodox Confession of Faith (1723), Question 3</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
