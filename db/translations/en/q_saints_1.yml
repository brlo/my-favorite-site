    title: Departing from heretics
    priority: 13
  body: |-
    <h2>Scripture</h2><blockquote><p>“<strong>Blessed is the man who walks not in the counsel of the ungodly, nor stands in the path of sinners, nor sits in the seat of the scornful</strong>; but his delight is in the law of the LORD, and in His law he meditates day and night!” (<a href="https://bibleox.com/en/eng-nkjv/ps/1/#L1-2">Ps. 1:1-2</a>)</p></blockquote><blockquote><p>“<strong>Do not enter the path of the wicked, and do not walk in the way of evil. Avoid it, do not travel on it; turn away from it and pass on. For they do not sleep unless they have done evil; and their sleep is taken away unless they make someone fall.</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/4/#L14-16">Prov. 4:14-16</a>)</p></blockquote><blockquote><p>“<strong>A foolish woman is clamorous; she is simple, and knows nothing. For she sits at the door of her house, on a seat by the highest places of the city, to call to those who pass by</strong>, who go straight on their way: ‘Whoever is simple, let him turn in here’; and as for him who lacks understanding, she says to him, ‘Stolen water is sweet, and bread eaten in secret is pleasant.’ <strong>But he does not know that the dead are there, that her guests are in the depths of hell. But you, turn away, do not linger in the place, do not fix your gaze on her; for thus you will pass through strange water. Avoid strange water, and do not drink from a stranger’s spring</strong>, that you may live long, and your years be added to your life.” (<a href="https://bibleox.com/en/eng-nkjv/pr/9/#L13-18">Prov. 9:13-18</a>; the second half of v. 18 follows the LXX and is absent from the NKJV)</p></blockquote><blockquote><p><em>“</em><strong><em>Cease listening to instruction, my son, and you will stray from the words of knowledge</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/pr/19/#L27"><em>Prov. 19:27</em></a><em>)</em></p></blockquote><blockquote><p>“Talk little with the senseless, and do not go to visit the fool; <strong>beware of them, that you have no trouble and do not defile yourself by contact with them; avoid them, and you will find peace</strong>, and not be harmed by their madness.” (<a href="https://bibleox.com/en/en-nrsv/prsir/22#L13">Sir. 22:12-14</a>; NRSV 22:13)</p></blockquote><blockquote><p><em>“Moreover if your brother sins against you, go and tell him his fault between you and him alone. If he hears you, you have gained your brother. But if he will not hear, take with you one or two more, that by the mouth of two or three witnesses every word may be established. And if he refuses to hear them, tell it to the church. But </em><strong><em>if he refuses even to hear the church, let him be to you like a heathen and a tax collector</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/18#L15-17"><em>Matt. 18:15-17</em></a><em>)</em></p></blockquote><blockquote><p>“But we command you, brethren, in the name of our Lord Jesus Christ, <strong>that you withdraw from every brother who walks disorderly and not according to the tradition</strong> which he received from us.” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L6">2 Thess. 3:6</a>)</p></blockquote><blockquote><p><em>“</em><strong><em>Reject a divisive man after the first and second admonition</em></strong><em>, knowing that such a person is warped and sinning, being self-condemned” (</em><a href="https://bibleox.com/en/eng-nkjv/tit/3#L10-11"><em>Tit. 3:10-11</em></a><em>)</em></p></blockquote><blockquote><p>“<strong>If anyone comes to you and does not bring this doctrine, do not receive him into your house nor greet him</strong>. For he who greets him shares in his evil deeds.” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L10-11">2 John 1:10-11</a>)</p></blockquote><h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr (35–107)</h3><blockquote><p>“Nevertheless, <strong><mark>I have heard of some who have passed on from this to you, having false doctrine, whom ye did not suffer to sow among you, but stopped your ears</mark></strong>, that ye might not receive those things which were sown by them, as being stones of the temple of the Father, prepared for the building of God the Father… because with respect to your Christian life ye love nothing but God only.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-9">To the Ephesians, 9</a>)</p><blockquote><p>“I therefore, yet not I, but the love of Jesus Christ, entreat you that ye use Christian nourishment only, and <strong><mark>abstain from herbage of a different kind; I mean heresy. For those [that are given to this] mix up Jesus Christ with their own poison, speaking things which are unworthy of credit, like those who administer a deadly drug in sweet wine, which he who is ignorant of does greedily take, with a fatal pleasure leading to his own death</mark></strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-6">To the Trallians, 6</a>)</p><blockquote><p>“<strong><mark>Flee, therefore, those evil offshoots</mark> [of Satan], which produce death-bearing fruit, whereof if any one tastes, he instantly dies. For <mark>these men are not the planting of the Father</mark></strong>. For if they were, they would appear as branches of the cross, and their fruit would be incorruptible.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-11">To the Trallians, 11</a>)</p><blockquote><p>“I give you these instructions, beloved, assured that ye also hold the same opinions [as I do]. But <strong><mark>I guard you beforehand from those beasts in the shape of men, whom you must not only not receive, but, if it be possible, not even meet with</mark></strong>; only you must pray to God for them, if by any means they may be brought to repentance, which, however, will be very difficult. Yet Jesus Christ, who is our true life, has the power of [effecting] this.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-4">To the Smyrnaeans, 4</a>)</p><h2>2nd century</h2><h3>Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><strong><mark>“There are such men, confessing themselves to be Christians, and admitting the crucified Jesus to be both Lord and Christ, yet not teaching His doctrines, but those of the spirits of error &lt;…&gt; with none of them do we hold communion</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-35">Dialogue with Trypho, 35</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>“If any one were to preach to these men the inventions of the heretics, speaking to them in their own language, they would at once <strong><mark>stop their ears, and flee as far off as possible, not enduring even to listen to the blasphemous address</mark></strong>. Thus, by means of that ancient tradition of the apostles, <strong><mark>they do not suffer their mind to conceive anything of the portentous language of these teachers</mark></strong>, among whom neither Church nor doctrine has ever been established.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against Heresies, Book III, ch. 4</a>)</p><blockquote><p>Those, therefore, who desert the preaching of the Church, call in question the knowledge of the holy presbyters, not taking into consideration of how much greater consequence is a religious man, even in a private station, than a blasphemous and impudent sophist. <strong>Now, such are all the heretics</strong>, and those who imagine that they have hit upon something more beyond the truth, so that by following those things already mentioned, proceeding on their way variously, in harmoniously, and foolishly, not keeping always to the same opinions with regard to the same things, as blind men are led by the blind, they shall deservedly fall into the ditch of ignorance lying in their path, ever seeking and never finding out the truth. <strong><mark>It behoves us, therefore, to avoid their doctrines, and to take careful heed lest we suffer any injury from them</mark>; but to flee to the Church, and be brought up in her bosom, and be nourished with the Lord’s Scriptures</strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against Heresies, Book V, ch. 20</a>)</p><h2>4th century</h2><h3>St Athanasius the Great (c. 295–373)</h3><blockquote><p><em>And he was altogether wonderful in faith and religious, for he never held communion with the Meletian schismatics, knowing their wickedness and apostacy from the beginning; nor had he friendly dealings with the Manichæans or any other heretics; or, if he had, only as far as advice that they should change to piety. For he thought and asserted that </em><strong><em><mark>intercourse with these was harmful and destructive to the soul</mark></em></strong><em>. In the same manner also he loathed the heresy of the Arians, and exhorted all neither to approach them nor to hold their erroneous belief. And once when certain Arian madmen came to him, when he had questioned them and learned their impiety, he drove them from the mountain, saying </em><strong><em><mark>that their words were worse than the poison of serpents</mark></em></strong><em>.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>strive to guard your soul from impure thoughts, to emulate the saints, </em><strong><em>not to associate with the Meletian schismatics</em></strong><em>, knowing their cunning and vile intent, </em><strong><em>to have no communion with the Arians</em></strong><em>, because their impiety is evident to all.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/pOY3_Life_of_St_Anthony">Life of St. Anthony</a>)</p><h3>Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p><strong>Woe to those</strong> who defile the holy faith with heresies and <strong>come into agreement with heretics</strong>!</p></blockquote><p>(Homily on the Second Coming of our Lord Jesus Christ)</p><h3>Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p><em>We have need therefore of </em><strong><em><mark>divine grace</mark></em></strong><em>, and of a sober mind, and of </em><strong><em><mark>eyes that see, lest from eating tares as wheat we suffer harm from ignorance</mark></em></strong><em>, and lest from taking the wolf to be a sheep we become his prey, and from supposing the destroying Devil to be a beneficent Angel we be devoured: for, as the Scripture saith, he goeth about as a roaring lion, seeking whom he may devour (1 Pet. 5:8). </em><strong><em>This is the cause of the Church’s admonitions, the cause of the present instructions, and of the lessons which are read. </em></strong>&lt;…&gt; <em>Since </em><strong><em><mark>there are many that make spoil</mark> through <mark>philosophy</mark> and vain deceit (Col. 2:8). <mark>The Greeks</mark> on the one hand draw men away by their smooth tongue, for honey droppeth from a harlot’s lips (Prov. 5:3): whereas <mark>they of the Circumcision</mark> deceive those who come to them by means of the Divine Scriptures, which they miserably misinterpret though studying them from childhood to old age, and growing old in ignorance. But <mark>the children of heretics</mark>, by their good words and smooth tongue, deceive the hearts of the innocent, disguising with the name of Christ as it were with honey the poisoned arrows of their impious doctrines: concerning all of whom together the Lord saith, Take heed lest any man mislead you (Matt. 24:4). This is the reason for the teaching of the Creed and for expositions upon it.</em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1">The Catechetical Lectures, Lecture IV, 2</a>)</p><h3>Isidore of Pelusium, monk (350–435)</h3><blockquote><p>As sea-traders conceal the bait under the appearance of food and unexpectedly catch the fish, so <strong><mark>the cunning champions of heresies, covering their worthless thoughts with a fair word, draw the simple away to death as with a fish-hook</mark></strong>.</p></blockquote><p>(Letters, To Timothy the Reader)</p><h3>Abba Isaiah of Scetis, monk and hermit (4th–5th c.)</h3><blockquote><p><strong>Beware of conversing with heretics in your desire to defend the faith; <mark>lest the poison of their corrupt words should sting even yourself</mark>.</strong></p></blockquote><p>(Chapters on Asceticism and Silence, Discourse Three: On the state of beginners and of those who live in cells)</p><h2>6th century</h2><h3>Barsanuphius the Great and John the Prophet, monks (6th c.)</h3><p>In their works is cited the saints’ saying:</p><blockquote><p>“When you see someone drowning in a river, do not give him your hand, lest he drag you down with him; but hold out your staff, and if you can save him by means of the staff, that is well; if not, let go of the staff, lest you perish together with the drowning man.”</p></blockquote><p>(Guidance Towards Spiritual Life: Answers to the Questions of Disciples, 660)</p><h2>7th century</h2><h3>John Climacus, monk (c. 579–649)</h3><blockquote><p>78. The reading of the Holy Scriptures can greatly enlighten and gather the mind; for they are the words of the Holy Spirit, and instruct the readers in every way. Being a man of action, read the practical books of the Fathers; for when this is done in deed, the reading of the rest becomes superfluous. Seek to learn the understanding and the way of salvation more from labour than from books alone. <strong>Before you have received spiritual power, do not read books of a faith other than the Orthodox, for they are full of darkness, and darken the minds of the weak.</strong></p></blockquote><p>(The Ladder of Divine Ascent)</p><h2>11th century</h2><h3>Theodosius of the Kiev Caves, monk (c. 1008–1074)</h3><blockquote><p><strong><em><mark>Beware, my child, of the perverters of the faith and of all their conversations, for our land too has been filled with them.</mark></em></strong></p>
    <p>If anyone saves his soul, it is only by living in the Orthodox faith, for there is no faith better than our pure, holy, Orthodox one. Living in this Faith you will not only be delivered from sins and eternal torment, but will become a partaker of eternal life and will rejoice without end with the Saints. But those who live in another faith will not see eternal life.</p>
    <p><em>Nor should you, my child, praise a foreign faith. He who praises a foreign faith is the same as one who blasphemes his own. If anyone praises his own and a foreign one, he is double-minded and close to heresy. Therefore, my child, beware of them and always stand firm for your Faith.</em></p></blockquote><p>(The Testament to the Kiev Prince Izyaslav on the Orthodox Christian faith)</p><p>(*According to a number of scholars, the epistle was written in the middle of the 12th century by Theodosius the Greek)</p><h2>12th century</h2><h3>Peter of Damascus, monk († 12th c.)</h3><blockquote><p>When the Lord, says the great Basil, finds a heart pure from all worldly things and teachings, then He writes His teachings upon it as on a clean tablet. I say this in order that no one should read what does not serve to please God, <strong>and if he ever reads such things through ignorance, let him strive rather to blot out the memory of them</strong> with the spiritual reading of the Divine Scriptures, and with what serves most for the salvation of his soul, according to the state which he has reached. If he is still a man of action, let him read the lives and sayings of the holy Fathers; but if by grace he has been raised to spiritual knowledge, let him read all the Divine Scriptures, as one able, by the word of the Apostle, to “demolish every high thing that exalts itself against the knowledge of God” (2 Cor. 10:5) and to guard against every disobedience and transgression by the practice and true knowledge of the Divine commandments and the teachings of Christ. And apart from the Divine Scriptures let him read nothing at all. What need is there to receive an unclean spirit instead of the Holy Spirit? <strong>For in whatever word a man exercises himself, he appropriates the spirit of that word, even though this may not appear wrong to him, as those with experience can see.</strong></p></blockquote><p>(The Philokalia, Book I: On discernment)</p><h2>14th century</h2><h3>Gregory (Palamas), bishop (c. 1296–1357)</h3><blockquote><p>Therefore their assertion is a blasphemy and consonant with the heresy of Eunomius, since they [like him] say that the essence of God becomes visible through creatures. And in this way the field of their ungodliness brings forth abundant fruit. <strong>Consequently, [every pious man] must avoid them and [altogether shun all] communion with them. One must flee from them as from a soul-destroying many-headed hydra and the manifold ruin of piety</strong>.</p></blockquote><p>(The One Hundred and Fifty Chapters)</p><h2>18th century</h2><h3>St Tikhon of Zadonsk (Sokolov) (1724–1783)</h3><blockquote><p><em>Q.</em> What are the commandments of the Church?</p>
    <p><em>A.</em> The Orthodox Confession of the Catholic and Apostolic Eastern Church points out nine of the most important commandments of the Church.</p>
    <p>&lt;…&gt;</p>
    <p>The fifth [commandment]: that those inexperienced in the knowledge of the holy Scriptures and the sciences <strong><mark>should not read books written by heretics, should not listen to their blasphemous teaching and should have no contact with them</mark></strong>.</p></blockquote><p>(On the truths of the Orthodox-Christian faith)</p><blockquote><p><em>Q.</em> <strong>What counsels does St Tikhon give concerning the reading of books for the study of Christian truths?</strong></p>
    <p><em>A.</em> There is no profit, he says, in reading a book and not doing what the book teaches. Therefore the reader of a book must observe the following: 1) he must read <strong>above all the holy Scriptures, and after them other Christian Orthodox books</strong> — reading not many sheets and pages; for one who has read much cannot understand everything and keep it in memory. 2) Read little and reason much on what is read. For in this way what is read is better understood and deepened in the memory, and thereby the mind is enlightened.</p></blockquote><p>(On the truths of the Orthodox-Christian faith and of the Church)</p><p><a href="https://bibleox.com/ru/ru/w/uvI5_%D0%A2%D0%B8%D1%85%D0%BE%D0%BD_%D0%97%D0%B0%D0%B4%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D0%BE_%D1%87%D1%82%D0%B5%D0%BD%D0%B8%D0%B8_%D0%90%D1%80%D0%BD%D0%B4%D1%82%D0%B0" lang="ru">*Important commentary (in Russian)</a></p><h2>19th century</h2><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p><em>“</em><strong><em>Keep your mind and heart from the teaching of falsehood. Do not speak about Christianity with people infected with false thoughts; do not read books about Christianity written by false teachers</em></strong><em>.</em></p>
    <p><em>The Holy Spirit accompanies Truth: He is the Spirit of Truth. The spirit of the devil accompanies falsehood and assists it, who is a lie and the father of lies.</em></p>
    <p><em>He who reads the books of false teachers partakes certainly of the wicked, dark spirit of falsehood. Let this not seem strange or incredible to you: so affirm the luminaries of the Church — the holy Fathers. (“Let no one read, said the hieromartyr Peter of Damascus, what does not serve to please God. If ever he does read such a thing through ignorance, let him strive rather to blot it out of his memory by the reading of the Divine Scriptures — and precisely those which serve most for the salvation of his soul, according to the state he has attained… </em><strong><em>And let him by no means read books opposed to this</em></strong><em>. What need is there to receive an unclean spirit instead of the Holy Spirit? In whatever word a man exercises himself, he acquires the character of that word, though the inexperienced do not see this, as those with spiritual experience do.”)</em></p>
    <p><em>The great servants of God, who knew the weakness common to all men, </em><strong><em><mark>feared the poison of heresy and falsehood, and therefore avoided with all care conversations with people infected with false teaching</mark></em></strong><em>.</em></p>
    <p><em>…</em></p>
    <p><strong><em>Both I and you must guard against reading books composed by false teachers</em></strong><em>. To everyone who does not belong to the Eastern Church, the one holy Church, who writes about Christ, about the Christian faith and morals, belongs the name of a false teacher.”</em></p></blockquote><p>(Ascetic Experiences, Volume 1, ch. 7)</p><h3>Innocent (Veniaminov), Metropolitan of Moscow, saint (1797–1879)</h3><blockquote><p>There are <strong>many books in the world</strong> called useful and soul-saving; <strong>but only those are worthy of that name</strong> which are founded on Holy Scripture and <strong>agree with the teaching of our Orthodox Church</strong>; and therefore such books may and should be read, but <strong><mark>one must be careful in choosing them, lest sometimes, under the appearance of a soul-saving book, you come upon one that can destroy your soul</mark></strong>.</p></blockquote><p>(Works of Innocent Metropolitan of Moscow. Book One)</p><h3>St Theophan the Recluse (1815–1894)</h3><blockquote><p>By the thorns and briers that choke the word of divine truth — besides riches, pleasures and the cares of life — in our time we must also understand the various false teachings spread by learned men who have lost the truth and strayed from the path to it. Many such teachings are disseminated among us: some openly and publicly oppose the truth; others do so under conditional hints, comprehensible however to those at whom they are aimed. In essence they act like fumes: entering imperceptibly, they cloud the head and bring a loss of clear consciousness of everything around. Whoever takes in these fumes begins to rave like a sleeper, for everything appears to him not at all as it is and as it appears to one in a sound mind. <strong>Meeting such a person, you see that in him not only is all truth suppressed, but the very sense of truth is stifled, and falsehood has penetrated into all the members of his mind. What is to be done? <mark>Do not listen to and do not read such ravings; and when you have involuntarily heard or read something, cast it out of your mind; and when it will not be cast out, bring it to reason, and everything will fly away like smoke</mark>.</strong></p></blockquote><p>(Thoughts for Each Day of the Year, according to the readings of the Word of God, day 283)</p><h2>20th century</h2><h3>St Luke (Voyno-Yasenetsky), archbishop (1877–1961)</h3><blockquote><p><em>What could be more terrible? I do not know. </em><strong><em>I can only beseech you, as the holy Apostle Paul besought you, <mark>to beware of these ravening beasts</mark>, to beware of those who cause divisions, never to go to their assemblies — <mark>otherwise you will be poisoned by their venom</mark>.</em></strong></p>
    <p><strong><em><mark>Fear as fire communion with heretics</mark></em></strong><em>, communion with sectarians. Hold to the faith which the holy Church teaches us — the faith of the Gospel, the faith of Christ, the apostolic faith. And the Lord Jesus Christ will save you. </em><em>Amen.</em></p></blockquote><p>(The Triumph of Orthodoxy, 1945)</p><blockquote><p><em>The Baptists are especially cunning and flatter your hearing especially subtly.</em> <strong><em>They pretend to be holy, captivate you with love and attention, <mark>entangle you in their nets — and in these nets you perish</mark>.</em></strong></p></blockquote><p>(The Triumph of Orthodoxy, 1945)</p><blockquote><p><em>We Orthodox Christians all bless the Most Holy Virgin Mary according to the teaching</em> of Holy Scripture, but we must say with pain that the enemies of Christ’s Church — Protestants, sectarians and other heretics — do not share <em>in this praise of the Orthodox world.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>May the Lord forbid it to them!</em> And <strong><em><mark>to all of us may He forbid any communion with the sectarians, lest they lead us onto the path of perdition</mark></em></strong>. <em>And may the Most Holy Mother of God, whose greatest feast we celebrate today, save us all from the devil and all his servants. Amen.</em></p></blockquote><p>(Bring to Thee our love. Sermons on the Annunciation of the Most Holy Mother of God, I. Our faith is not in vain, 1945)</p><h3>Nikolai Varzhansky, martyr (1881–1918)</h3><blockquote><p>“And surely many will fall into their [the sectarians’] nets. How can this be avoided?</p>
    <p>1) Be within the bosom of Christ’s Church.</p>
    <p>2) Study the Word of God yourself, so as to know what is said in this or that text.</p>
    <p>3) <strong>If possible <mark>avoid meetings and debates with sectarians</mark> if you are not sure that you can convince the one in error.”</strong></p></blockquote><p>(Good Confession, ch. 31)</p><h3>Joseph the Hesychast (Kottis), monk (1899–1959)</h3><blockquote><p><strong><mark>Be very careful with the heretics</mark></strong>, my child. Where you are now — strange tribes and tongues. <strong><mark>Do not speak with them at all</mark>, for your pure soul is defiled by their blasphemous words</strong>. They have been excommunicated by our Orthodox Church.</p></blockquote><p>(Letters, 80)</p><h2>An example from Scripture</h2><p>The foremother Eve, at her meeting with the devil, entered into communion with him, was deceived and fell:</p><blockquote><p>“Now the serpent was more cunning than any beast of the field which the LORD God had made. And <strong>the serpent said to the woman</strong>, ‘Has God indeed said, You shall not eat of every tree of the garden?’ And <strong>the woman said to the serpent</strong>, ‘We may eat the fruit of the trees of the garden; but of the fruit of the tree which is in the midst of the garden, God has said, You shall not eat it, nor shall you touch it, lest you die.’ And the serpent said to the woman, ‘You will not surely die.’” (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L1-4">Gen. 3:1-4</a>)</p></blockquote><p>Christ drives out the devil, giving an example:</p><blockquote><p>“And Jesus answered and said to him, ‘<strong>Get behind Me, Satan!</strong> For it is written, You shall worship the LORD your God, and Him only you shall serve.’” (<a href="https://bibleox.com/en/eng-nkjv/lk/4/#L8">Luke 4:8</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/4/#L10">Matt. 4:10</a>)</p></blockquote><blockquote><p>“But He turned and said to Peter, ‘<strong>Get behind Me, Satan!</strong> You are an offense to Me, for you are not mindful of the things of God, but the things of men.’” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L23">Matt. 16:23</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/8#L33">Mark 8:33</a>)</p></blockquote><h2>Priest Georgy Maximov in detail on reading literature by non-Orthodox authors</h2><p><a href="https://youtu.be/nRYa-IuSNIA">https://youtu.be/nRYa-IuSNIA</a></p>
