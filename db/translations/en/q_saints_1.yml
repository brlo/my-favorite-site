  title: Departing from heretics (the violators of the Tradition)
  meta_desc: Quotes of the holy Fathers of the 1st–20th centuries on departing from
    heretics and violators of the apostolic Tradition, from Ignatius the God-bearer
    and Justin to St Luke of Crimea and Joseph the Hesychast.
