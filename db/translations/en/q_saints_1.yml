- src: Jwi0SvrO_Священное_Предание_было_первоначальным_и_единственным_способом_распространения_Божественного_Откровения
  path: Jwi0SvrO_Tradition_came_first
  title: Holy Tradition was the original and the only way of spreading Divine Revelation
  menu:
    parent: Holy Scripture
    title: First Tradition, then Scripture
    priority: 9
  body: '<h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr († end of the 2nd
    c.)</h3><blockquote><p>With such proofs in hand, <strong>it is not necessary to
    seek the truth among others which it is easy to obtain from the Church; since
    the apostles, like a rich man [depositing his money] in a bank, lodged in her
    hands most copiously all things pertaining to the truth: so that every man, whosoever
    will, can draw from her the water of life</strong> (Rev. 22:17). For she is the
    entrance to life; all others are thieves and robbers. On this account are we bound
    to avoid them, but to make choice of the thing pertaining to the Church with the
    utmost diligence, and to <strong><mark>lay hold of the tradition of the truth</mark></strong>.
    For how stands the case? <strong>Suppose there arise a dispute relative to some
    important question among us, should we not have recourse to the most ancient Churches
    with which the apostles held constant intercourse, and learn from them what is
    certain and clear in regard to the present question? For how should it be if the
    apostles themselves had not left us writings? Would it not be necessary, [in that
    case,] to <mark>follow the course of the tradition</mark> which they handed down
    to those to whom they did commit the Churches?</strong></p><p><strong>To which
    course many nations of those barbarians who believe in Christ do assent, <mark>having
    salvation written in their hearts by the Spirit, without paper or ink, and, carefully
    preserving the ancient tradition</mark></strong>, believing in one God, the Creator
    of heaven and earth, and all things therein, by means of Christ Jesus, the Son
    of God; who, because of His surpassing love towards His creation, condescended
    to be born of the virgin, He Himself uniting man through Himself to God, and having
    suffered under Pontius Pilate, and rising again, and having been received up in
    splendour, shall come in glory, the Saviour of those who are saved, and the Judge
    of those who are judged, and sending into eternal fire those who transform the
    truth, and despise His Father and His advent. <strong><mark>Those who, in the
    absence of written documents, have believed this faith</mark>, are barbarians,
    so far as regards our language; but as regards doctrine, manner, and tenor of
    life, they are, because of faith, very wise indeed; and they do please God, ordering
    their conversation in all righteousness, chastity, and wisdom</strong>. If any
    one were to preach to these men the inventions of the heretics, speaking to them
    in their own language, they would at once stop their ears, and flee as far off
    as possible, not enduring even to listen to the blasphemous address. Thus, by
    means of that ancient tradition of the apostles, they do not suffer their mind
    to conceive anything of the [doctrines suggested by the] portentous language of
    these teachers, among whom neither Church nor doctrine has ever been established.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against Heresies,
    Book III, ch. 4</a>)</p><h2>8th century</h2><h3><a href="https://bibleox.com/en/en/w/geHA_John_of_Damascus_7th8th_cent">St
    John of Damascus, monk (c. 675–754)</a></h3><blockquote><p><strong><em>Now the
    Church is consecrated by the blood of Christ and of His saints, and is adorned
    with the icons of Christ and of His saints. Either reject the worship of all images
    (that is, of Christ, who is the image of the Father — note), or do not introduce
    the new: “Remove not the ancient landmark which thy fathers have set” (Prov. 22:28).
    I do not speak of what was handed down before the coming of Christ our God in
    the flesh, but of what came after His coming.</em></strong><em> For of </em><strong><em>the
    traditions of the Old Testament (τῇ παλαιᾷ παραδόσεων)</em></strong><em> God speaks
    with reproach: “He gave them statutes that were not good, and judgments” (Ezek.
    20:25) because of the hardness of their heart; so that with the change of the
    priesthood there must needs be also a </em><strong><em>change of the law</em></strong><em>.</em></p><p><em>XVI.
    </em><strong><em>Not only in writings did the eyewitnesses and ministers of the
    word hand down the Church’s ordinance, but also in certain unwritten traditions</em></strong><em>.
    &lt;…&gt; </em><strong><em>if we know from unwritten tradition &lt;…&gt; that
    much has been handed down to the Church without writing and preserved to this
    day, why do you dispute about icons to no purpose? &lt;…&gt; I am not persuaded
    that the Church is governed by imperial decrees — she is governed by patristic
    traditions, written and unwritten. For as <mark>throughout the whole world the
    Gospel was preached without writings, so throughout the whole world without writings
    it was handed down to depict Christ.</mark></em></strong></p></blockquote><p>(On
    the Holy Icons, Oration II, XIV–XVI)</p><h2>20th century</h2><h3>Archpriest Dmitry
    Vladykov (1863–1955)</h3><blockquote><p>Adam and <strong>the patriarchs after
    him received revelations directly from God and handed them on orally</strong>
    to their contemporaries. The divine truths were kept in memory and passed down
    from generation to generation. The prophet Moses was the first to lay the foundation
    of Holy Scripture, writing five books, of which the book of Genesis contains truths
    that he recorded on the basis of tradition. However, Moses brought into the sacred
    books only a part of the teaching revealed by God before him in the course of
    four thousand years; for example, he was silent about the prophecy of Enoch (Jude
    1:14–15), about the prefigurative meaning of the sacrifices, and other such things.
    The book of the law (the Pentateuch) Moses gave for safekeeping to the priests
    and the elders of Israel, commanding that it be placed “beside the ark of the
    covenant” (Deut. 31:26) and that every seven years the law be read “before all
    Israel in their hearing” (Deut. 31:11); <strong>only to the king did he make it
    a duty to have a copy of the book of the law for his guidance</strong> (Deut.
    17:18–20). In giving the written law of God, or Holy Scripture, Moses commanded
    the Jews <strong>to observe also the law of God preserved in tradition</strong>
    (Ex. 10:1–2; Deut. 4:9–10, 32–33, 6:6–9, 20–25; 32:6–7). From these commands of
    Moses it is evident that Holy Scripture could not and did not intend to deprive
    tradition of its significance as a guide, since their source was one and the same
    will of God. <strong>The high dignity of the orally transmitted revelation</strong>
    is attested by the writer of the book of Judges (Judg. 2:10–11), by the righteous
    Job (Job 8:8–10, 15:17–19), by David (Ps. 43:2–4, 77:3–7), by Solomon (Eccl. 12:11),
    and by Isaiah (Isa. 38:19).</p><p><strong><mark>The Lord Jesus Christ did not
    write a single book, but handed down His divine teaching to His disciples by word
    and example. Orally also did the apostles spread the faith and establish Christ’s
    Church, which for many years existed without the New Testament writings, and the
    faithful were guided in the work of their salvation by Holy Tradition alone</mark></strong>.
    Eight years after the Lord’s ascension the apostle Matthew wrote the first New
    Testament book — the Gospel. “Matthew,” testifies St Irenaeus, Bishop of Lyons
    († 202), “published the Gospel among the Hebrews in their own language at the
    time when Peter and Paul were preaching in Rome and establishing the Church. After
    their departure Mark, the disciple and interpreter of Peter, handed down to us
    in writing what had been preached by Peter. And Luke, the companion of Paul, set
    forth in a book the Gospel preached by him. Afterwards John, the disciple of the
    Lord, who leaned on His breast, also published the Gospel during his stay in Ephesus.”</p><p>In
    the subsequent period, on various occasions called forth by the life of the Church,
    the remaining New Testament books were written by the apostles (by eight of the
    “Twelve and the Seventy”; although all of them undoubtedly preached, Matt. 28:19).
    <strong><mark>Since the New Testament writings contain only a small part of the
    living preaching of Jesus Christ (John 20:20, 21:25; Acts 1:3) and of His apostles
    (1 Pet. 5:12; 1 Cor. 4:17, 11:34; Acts 20:31, cf. Eph. 1–6 and others), therefore
    even with the existence of the New Testament writings one must be guided by Holy
    Tradition</mark></strong><mark>.</mark></p></blockquote><p>(The Orthodox Church
    and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
