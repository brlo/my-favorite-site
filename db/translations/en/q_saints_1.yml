  meta_desc: 'The necessity of Sacred Tradition in the testimony of the holy Fathers:
    Papias, Irenaeus, Clement of Alexandria, Tertullian, Epiphanius, Athanasius, Chrysostom,
    Cyril of Jerusalem, Basil the Great, Jerome, Vincent of Lérins, John of Damascus,
    Theophylact of Ohrid and Russian saints.'
