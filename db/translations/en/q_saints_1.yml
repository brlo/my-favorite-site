  body: '<h2>2nd century</h2><h3>St Irenaeus of Lyons, hieromartyr († end of the 2nd
    c.)</h3><blockquote><p>With such proofs in hand, <strong>it is not necessary to
    seek the truth among others which it is easy to obtain from the Church; since
    the apostles, like a rich man [depositing his money] in a bank, lodged in her
    hands most copiously all things pertaining to the truth: so that every man, whosoever
    will, can draw from her the water of life</strong> (Rev. 22:17). For she is the
    entrance to life; all others are thieves and robbers. On this account are we bound
    to avoid them, but to make choice of the thing pertaining to the Church with the
    utmost diligence, and to <strong><mark>lay hold of the tradition of the truth</mark></strong>.
    For how stands the case? <strong>Suppose there arise a dispute relative to some
    important question among us, should we not have recourse to the most ancient Churches
    with which the apostles held constant intercourse, and learn from them what is
    certain and clear in regard to the present question? For how should it be if the
    apostles themselves had not left us writings? Would it not be necessary, [in that
    case,] to <mark>follow the course of the tradition</mark> which they handed down
    to those to whom they did commit the Churches?</strong></p><p><strong>To which
    course many nations of those barbarians who believe in Christ do assent, having
    salvation written in their hearts by the Spirit, without paper or ink, and, <mark>carefully
    preserving the ancient tradition</mark></strong>, believing in one God, the Creator
    of heaven and earth, and all things therein, by means of Christ Jesus, the Son
    of God; who, because of His surpassing love towards His creation, condescended
    to be born of the virgin, He Himself uniting man through Himself to God, and having
    suffered under Pontius Pilate, and rising again, and having been received up in
    splendour, shall come in glory, the Saviour of those who are saved, and the Judge
    of those who are judged, and sending into eternal fire those who transform the
    truth, and despise His Father and His advent. <strong><mark>Those who, in the
    absence of written documents, have believed this faith, are barbarians</mark>,
    so far as regards our language; but as regards doctrine, manner, and tenor of
    life, they are, because of faith, very wise indeed; and they do please God, ordering
    their conversation in all righteousness, chastity, and wisdom</strong>. If any
    one were to preach to these men the inventions of the heretics, speaking to them
    in their own language, they would at once stop their ears, and flee as far off
    as possible, not enduring even to listen to the blasphemous address. Thus, by
    means of that ancient tradition of the apostles, they do not suffer their mind
    to conceive anything of the [doctrines suggested by the] portentous language of
    these teachers, among whom neither Church nor doctrine has ever been established.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-4">Against Heresies,
    Book III, ch. 4</a>)</p><h2>8th century</h2><h3>St John of Damascus, monk (c.
    675–754)</h3><blockquote><p><strong><em>Now the Church is consecrated by the blood
    of Christ and of His saints, and is adorned with the icons of Christ and of His
    saints. Either reject the worship of all images (that is, of Christ, who is the
    image of the Father — note), or do not introduce the new: “Remove not the ancient
    landmark which thy fathers have set” (Prov. 22:28). I do not speak of what was
    handed down before the coming of Christ our God in the flesh, but of what came
    after His coming.</em></strong><em> For of </em><strong><em>the traditions of
    the Old Testament (τῇ παλαιᾷ παραδόσεων)</em></strong><em> God speaks with reproach:
    “He gave them statutes that were not good, and judgments” (Ezek. 20:25) because
    of the hardness of their heart; so that with the change of the priesthood there
    must needs be also a </em><strong><em>change of the law</em></strong><em>.</em></p><p><em>XVI.
    </em><strong><em>Not only in writings did the eyewitnesses and ministers of the
    word hand down the Church’s ordinance, but also in certain unwritten traditions</em></strong><em>.
    &lt;…&gt; <strong><em>if we know from unwritten tradition &lt;…&gt; that much
    has been handed down to the Church without writing and preserved to this day,
    why do you dispute about icons to no purpose? &lt;…&gt; I am not persuaded that
    the Church is governed by imperial decrees — she is governed by patristic traditions,
    written and unwritten. For as <mark>throughout the whole world the Gospel was
    preached without writings, so throughout the whole world without writings it was
    handed down to depict Christ.</mark></em></strong></em></p></blockquote><p>(On
    the Holy Icons, Orations I–III)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
