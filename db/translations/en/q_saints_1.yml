    priority: 8
  body: '<h2>19th century</h2><h3>St Philaret of Moscow (Drozdov) (1782–1867)</h3><blockquote><p><strong>17</strong>.
    What is meant by the name <em>holy tradition?</em></p><p>By the name holy tradition
    is meant <strong>the doctrine of the faith, the law of God, the sacraments, and
    the ritual</strong> as handed down by the true believers and worshipers of God
    by word and example from one to another, and from generation to generation.</p><p><strong>18</strong>.
    Is there any sure repository of holy tradition?</p><p><strong><mark>All true believers</mark>,
    united by the holy tradition of the faith, collectively and successively, by the
    will of God, compose the Church; and she is the sure repository of holy tradition</strong>,
    or, as St. Paul expresses it, <em>The Church of the living God, the pillar and
    ground of the truth.</em> 1Tim. iii. 15.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/TQdr_The_Longer_Catechism_of_The_Orthodox_Catholic_Eastern_Church#HH-On-Holy-Tradition-and-Holy-Scripture">The
    Longer Catechism of the Orthodox Catholic Eastern Church, §§17–18</a>)</p><h3>St
    Theophan the Recluse (1815–1894)</h3><blockquote><p><em>By the word tradition
    is not meant some indefinite rumor, started and spread none knows how; but <strong><mark>it
    is understood to be the Apostolic teaching handed down orally, or the rules and
    ordinances introduced into the Church in deed</mark></strong>. The Apostles fully
    organized Christ’s Church in every aspect of its spiritual and saving ecclesial
    life. But how they organized it is not fully set out in their writings; it was
    done in deed and brought into Christian life personally by the Apostles, introduced
    and rooted through their repeated visits to the Christian communities they had
    founded, and through their repeated corrections of what was defective — all by
    their own personal action and word. And <strong><mark>the pattern of Christian
    knowledge, the rules of life, the mutual relations of Christians, the mystical
    sanctifying sacramental rites, and the rules for church assemblies — all was established
    personally by word and secured by personal oversight</mark></strong>.</em></p><p><em>And
    so Christians came to think in this way, to live in this way, to act in their
    mutual relations, to be governed in this way, to be sanctified in this way, to
    serve God in this way, as the Apostles had established.</em></p></blockquote><p>(Letter
    946. On Apostolic Tradition)</p><h2>20th century</h2><h3>Archpriest Dmitry Vladykov
    (1863–1955)</h3><blockquote><p><em>The source of Christian doctrine is the Word
    of God or <strong>Divine Revelation</strong>, proclaimed through the prophets
    and apostles and by them handed down to the Church <strong>partly in <mark>writing</mark>,
    partly <mark>orally</mark></strong> (2 Thess. 2:15). Holy Tradition is that same
    Word of God, only written down not by the God-inspired men themselves but by their
    successors and disciples, and handed down by them orally to the Church (cf. Acts
    13:5; 17:13; 20:31; 1 Thess. 2:13; 2 Tim. 2:2, etc.), which has ever since preserved
    it continuously and without change.</em></p><p><em>“By the name Holy Tradition
    is understood what true believers and worshipers of God hand down by word and
    example to one another, forefathers to descendants: <strong><mark>the doctrine
    of the faith, the law of God, the sacraments and the sacred rites</mark></strong>”
    (Orthodox Catechism).</em></p><p><em>The sources in which Holy Tradition has come
    down to us:</em></p><p><em><strong><mark>the rules and ordinances of the holy
    Apostles, of the seven œcumenical and nine local councils, the ancient creeds,
    the liturgies, the acts of the martyrs, the ancient church histories, the works
    of the holy Fathers and teachers of the Church, and the liturgical practice of
    the Church</mark></strong></em>.</p></blockquote><p>(The Orthodox Church and the
    Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
