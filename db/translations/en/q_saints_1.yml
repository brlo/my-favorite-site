    priority: 11
  body: '<h2>4th century</h2><h3>Eusebius of Caesarea (Pamphili) (c. 258–340)</h3><p>About
    the holy Ignatius the God-bearer:</p><blockquote><p>Ignatius, who was chosen bishop
    of Antioch, second in succession to Peter, and whose fame is still celebrated
    by a great many. 3. Report says that he was sent from Syria to Rome, and became
    food for wild beasts on account of his testimony to Christ. 4. And as he made
    the journey through Asia under the strictest military surveillance, he fortified
    the parishes in the various cities where he stopped by oral homilies and exhortations,
    and <strong>warned them above all to be especially on their guard against the
    heresies that were then beginning to prevail, and <mark>exhorted them to hold
    fast to the tradition of the apostles</mark></strong>. Moreover, he thought it
    necessary to attest that tradition in writing, and to give it a fixed form for
    the sake of greater security.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">Church
    History, Book III, ch. 36</a>)</p><h2>5th century</h2><h3>Vincent of Lérins, monk
    († before 450)</h3><blockquote><p>XXII. But it is worthwhile to expound the whole
    of that passage of the apostle more fully, O Timothy, keep the deposit, avoiding
    profane novelties of words. O! The exclamation implies fore-knowledge as well
    as charity. For he mourned in anticipation over the errors which he foresaw. Who
    is the Timothy of today, but either generally the Universal Church, or in particular,
    the whole body of The Prelacy, whom it behooves either themselves to possess or
    to communicate to others a complete knowledge of religion? What is Keep the deposit?
    Keep it, because of thieves, because of adversaries, lest, while men sleep, they
    sow tares over that good wheat which the Son of Man had sown in his field. <strong><mark>Keep
    the deposit. What is The deposit? That which has been entrusted to you, not that
    which you have yourself devised: a matter not of wit, but of learning; not of
    private adoption, but of public tradition; a matter brought to you, not put forth
    by you, wherein you are bound to be not an author but a keeper, not a teacher
    but a disciple, not a leader but a follower. Keep the deposit. Preserve the talent
    of Catholic Faith inviolate, unadulterate. That which has been entrusted to you,
    let it continue in your possession, let it be handed on by you.</mark></strong>
    You have received gold; give gold in turn. Do not substitute one thing for another.
    Do not for gold impudently substitute lead or brass. Give real gold, not counterfeit.
    O Timothy! O Priest! O Expositor! O Doctor! If the divine gift has qualified you
    by wit, by skill, by learning, be a Bazaleel of the spiritual tabernacle, engrave
    the precious gems of divine doctrine, fit them in accurately, adorn them skilfully,
    add splendor, grace, beauty. Let that which formerly was believed, though imperfectly
    apprehended, as expounded by you be clearly understood. Let posterity welcome,
    understood through your exposition, what antiquity venerated without understanding.
    Yet teach still the same truths which you have learned, so that though you speak
    after a new fashion, what you speak may not be new.</p><p>XXIII. But someone will
    say, perhaps, Shall there, then, be no progress in Christ’s Church? Certainly;
    all possible progress. For what being is there, so envious of men, so full of
    hatred to God, who would seek to forbid it? <strong>Yet on condition that it be
    real progress, not alteration of the faith. For progress requires that the subject
    be enlarged in itself, alteration, that it be transformed into something else.</strong>
    The intelligence, then, the knowledge, the wisdom, as well of individuals as of
    all, as well of one man as of the whole Church, ought, in the course of ages and
    centuries, to increase and make much and vigorous progress; but yet only in its
    own kind; that is to say, in the same doctrine, in the same sense, and in the
    same meaning.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies#HH-22">The
    Commonitory of Vincent of Lérins, chapters 22–23</a>)</p><h2>20th century</h2><h3>Archpriest
    Dmitry Vladykov (1863–1955)</h3><blockquote><p>“Do what you have learned, received,
    heard, and seen in me, and the God of peace will be with you” (Phil. 4:9). “O
    Timothy, guard what has been entrusted to you” (1 Tim. 6:20). “Do not diminish
    it,” St John Chrysostom explains, “for it is not yours; it is another’s deposit
    entrusted to you; do not subtract from it.”</p><p>“What is Guard what has been
    entrusted to you? It means, writes Vincent of Lérins, “keep watch, for there are
    thieves, there are enemies, lest while men sleep they sow tares over that good
    wheat which the Son of Man sowed in his field (Matt. 13:37–39). Keep the deposit,
    he says. What is the deposit? That which has been entrusted to you, not that which
    you have invented; what you have received, not what you have devised; a matter
    not of wit, but of teaching; not of private possession, but of public tradition
    — a matter that has come down to you, not discovered by you, in relation to which
    you must be not an inventor but a guardian, not a founder but a follower, not
    a leader but one led. Guard what has been entrusted to you, that is, preserve
    the talent of the universal faith whole and unimpaired. What has been entrusted
    to you, let it remain with you, that you hand it on. You have received gold; give
    gold in return.” — “Therefore, brethren, stand firm and hold the traditions which
    you have been taught, whether by word or by our epistle” (2 Thess. 2:15). “From
    this it is evident,” St John Chrysostom teaches, “that the apostles did not deliver
    everything through their Epistles, but much they communicated without writing;
    and both are equally trustworthy. Therefore we must also acknowledge church tradition
    as trustworthy. <strong>There is tradition — seek nothing more</strong>.”</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
- src: S9vzFOMh_Установление_канона_Священного_Писания
  path: S9vzFOMh_Biblical_canon
  title: The Biblical canon
  meta_desc: 'The biblical canon in the testimony of the holy Fathers: Papias, Justin,
    Melito, the Muratorian Canon, Tertullian, Athanasius, Gregory the Theologian,
    Amphilochius of Iconium, the councils, John of Damascus and the Epistle of the
    Patriarchs.'
  menu:
    parent: Holy Scripture
    title: The Biblical canon
    priority: 2
  body: '<h3>Preface</h3><blockquote><p>“The salutation of Paul with my own hand,
    which is a sign in every epistle. Thus I write: The grace of our Lord Jesus Christ
    be with you all. Amen.” (2 Thess. 3:17-18)</p></blockquote><blockquote><p>“Therefore,
    brethren, stand fast and hold the traditions which you were taught, whether by
    word or our epistle.” (2 Thess. 2:15)</p></blockquote><blockquote><p>“And when
    this epistle is read among you, cause that it be read also in the church of the
    Laodiceans; and that ye likewise read the epistle from Laodicea.” (Col. 4:16)</p></blockquote><blockquote><p>There
    are also books of the New Testament, namely: fourteen epistles of Paul, four Gospels,
    two of the disciples of Christ — John and Matthew — and two of Luke and Mark,
    of whom one was a disciple of Peter and the other of Paul. Those saw Christ with
    their own eyes and conversed with Him, while these handed down to others what
    they had received from those. And the book of Acts, by the same Luke, telling
    of the events of those times, and three catholic epistles.</p></blockquote><p>(Survey
    of the Books of the Old Testament)</p><blockquote><p>What remains? Some say that
    seven catholic epistles should be received, others only three: one of James, one
    of Peter and one of John; some accept three epistles of John, besides them two
    of Peter, and the seventh — of Jude. Likewise the Apocalypse of John is recognized
    by some, but the majority call it spurious. Let this, then, be the most trustworthy
    canon of the God-inspired Scriptures.</p></blockquote><p>(Survey of the Books
    of the Old Testament)</p><h2>2nd century</h2><h3>Papias of Hierapolis (c. 70–155)</h3><blockquote><p>This
    is what the presbyter said: " Mark, having become the interpreter of Peter, wrote
    down accurately everything that he remembered of what was said and done by the
    Lord, though not in order, for he had not heard the Lord nor followed Him. Later
    he accompanied Peter, who taught as the needs required and did not intend to arrange
    the words of Christ in order. So Mark made no mistake in writing things down as
    he remembered them; he took care only of one thing: to omit nothing of what he
    had heard and to state nothing falsely ". 16. This is what Papias says about Mark;
    about Matthew he reports the following: " Matthew wrote down the discourses of
    Jesus in Hebrew, and each translated them as best he could ". 17. He also uses
    the First Epistle of John and that of Peter, and relates a story about a woman
    accused before the Lord of many sins. This story is found in the "Gospel according
    to the Hebrews". I considered it necessary to add all this to what has been said.
    ( Eusebius of Caesarea, Church History, Book III, ch. 39 )</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/papias-fragments-of-papias">Fragments of Papias</a>)</p><h3>Justin
    the Philosopher and Martyr (c. 100–165)</h3><blockquote><p>…when He kept silence,
    and chose to return no answer to any one in the presence of Pilate; as has been
    declared in the memoirs of His apostles, in order that what is recorded by Isaiah
    might have efficacious fruit, where it is written, ''The Lord gives me a tongue,
    that I may know when I ought to speak.'' Again, when He said, ''Thou art my God;
    be not far from me,'' He taught that all men ought to hope in God who created
    all things, and seek salvation and help from Him alone; and not suppose, as the
    rest of men do, that salvation can be obtained by birth, or wealth, or strength,
    or wisdom. And such have ever been your practices: at one time you made a calf,
    and always you have shown yourselves ungrateful, murderers of the righteous, and
    proud of your descent. For if the Son of God evidently states that He can be saved,
    [neither] because He is a son, nor because He is strong or wise, but that without
    God He cannot be saved, even though He be sinless, as Isaiah declares in words
    to the effect that even in regard to His very language He committed no sin (for
    He committed no iniquity or guile with His mouth), how do you or others who expect
    to be saved without this hope, suppose that you are not deceiving yourselves?
    103 "Then what is next said in the Psalm--''For trouble is near, for there is
    none to help me. Many calves have compassed me; fat bulls have beset me round.
    They opened their mouth upon me as a ravening and roaring lion. All my bones are
    poured out and dispersed like water,''--was likewise a prediction of the events
    which happened to Him. For on that night when some of your nation, who had been
    sent by the Pharisees and Scribes, and teachers, came upon Him from the Mount
    of Olives, those whom Scripture called butting and prematurely destructive calves
    surrounded Him. And the expression, ''Fat bulls have beset me round,'' He spoke
    beforehand of those who acted similarly to the calves, when He was led before
    your teachers. And the Scripture described them as bulls, since we know that bulls
    are authors of calves'' existence. As therefore the bulls are the begetters of
    the calves, so your teachers were the cause why their children went out to the
    Mount of Olives to take Him and bring Him to them. And the expression, ''For there
    is none to help,'' is also indicative of what took place. For there was not even
    a single man to assist Him as an innocent person. And the expression, ''They opened
    their mouth upon me like a roaring lion,'' designates him who was then king of
    the Jews, and was called Herod, a successor of the Herod who, when Christ was
    born, slew all the infants in Bethlehem born about the same time, because he imagined
    that amongst them He would assuredly be of whom the Magi from Arabia had spoken;
    for he was ignorant of the will of Him that is stronger than all, how He had commanded
    Joseph and Mary to take the Child and depart into Egypt, and there to remain until
    a revelation should again be made to them to return into their own country. And
    there they did remain until Herod, who slew the infants in Bethlehem, was dead,
    and Archelaus had succeeded him. And he died before Christ came to the dispensation
    on the cross which was given Him by His Father. And when Herod succeeded Archelaus,
    having received the authority which had been allotted to him, Pilate sent to him
    by way of compliment Jesus bound; and God foreknowing that this would happen,
    had thus spoken: ''And they brought Him to the Assyrian, a present to the king.''
    Or He meant the devil by the lion roaring against Him: whom Moses calls the serpent,
    but in Job and Zechariah he is called the devil, and by Jesus is addressed as
    Satan, showing that a compounded name was acquired by him from the deeds which
    he performed. For ''Sata'' in the Jewish and Syrian tongue means apostate; and
    ''Nas'' is the word from which he is called by interpretation the serpent, i.e.,
    according to the interpretation of the Hebrew term, from both of which there arises
    the single word Satanas. For this devil, when [Jesus] went up from the river Jordan,
    at the time when the voice spake to Him, ''Thou art my Son: this day have I begotten
    Thee,'' is recorded in the memoirs of the apostles to have come to Him and tempted
    Him, even so far as to say to Him, ''Worship me;'' and Christ answered him, ''Get
    thee behind me, Satan: thou shalt worship the Lord thy God, and Him only shalt
    thou serve.'' For as he had deceived Adam, so he hoped that he might contrive
    some mischief against Christ also. Moreover, the statement, ''All my bones are
    poured out and dispersed like water; my heart has become like wax, melting in
    the midst of my belly,'' was a prediction of that which happened to Him on that
    night when men came out against Him to the Mount of Olives to seize Him. For in
    the memoirs which I say were drawn up by His apostles and those who followed them,
    [it is recorded] that His sweat fell down like drops of blood while He was praying,
    and saying, ''If it be possible, let this cup pass:'' His heart and also His bones
    trembling; His heart being like wax melting in His belly: in order that we may
    perceive that the Father wished His Son really to undergo such sufferings for
    our sakes, and may not say that He, being the Son of God, did not feel what was
    happening to Him and inflicted on Him. Further, the expression, ''My strength
    is dried up like a potsherd, and my tongue has cleaved to my throat,'' was a prediction,
    as I previously remarked, of that silence, when He who convicted all your teachers
    of being unwise returned no answer at all. 104 "And the statement, ''Thou hast
    brought me into the dust of death; for many dogs have surrounded me: the assembly
    of the wicked have beset me round. They pierced my hands and my feet. They did
    tell all my bones. They did look and stare upon me. They parted my garments among
    them, and cast lots upon my vesture,''--was a prediction, as I said before, of
    the death to which the synagogue of the wicked would condemn Him, whom He calls
    both dogs and hunters, declaring that those who hunted Him were both gathered
    together and assiduously striving to condemn Him. And this is recorded to have
    happened in the memoirs of His apostles. And I have shown that, after His crucifixion,
    they who crucified Him parted His garments among them. 105 "And what follows of
    the Psalm,--''But Thou, Lord, do not remove Thine assistance from me; give heed
    to help me. Deliver my soul from the sword, and my only-begotten from the hand
    of the dog; save me from the lion''s mouth, and my humility from the horns of
    the unicorns,''--was also information and prediction of the events which should
    befall Him. For I have already proved that He was the only-begotten of the Father
    of all things, being begotten in a peculiar manner Word and Power by Him, and
    having afterwards become man through the Virgin, as we have learned from the memoirs.
    Moreover, it is similarly foretold that He would die by crucifixion. For the passage,
    ''Deliver my soul from the sword, and my only-begotten from the hand of the dog;
    save me from the lion''s mouth, and my humility from the horns of the unicorns,''
    is indicative of the suffering by which He should die, i.e., by crucifixion. For
    the ''horns of the, unicorns,'' I have already explained to you, are the figure
    of the cross only. And the prayer that His soul should be saved from the sword,
    and lion''s mouth, and hand of the dog, was a prayer that no one should take possession
    of His soul: so that, when we arrive at the end of life, we may ask the same petition
    from God, who is able to turn away every shameless evil angel from taking our
    souls. And that the souls survive, I have shown to you from the fact that the
    soul of Samuel was called up by the witch, as Saul demanded. And it appears also,
    that all the souls of similiar righteous men and prophets fell under the dominion
    of such powers, as is indeed to be inferred from the very facts in the case of
    that witch. Hence also God by His Son teaches us for whose sake these things seem
    to have been done, always to strive earnestly, and at death to pray that our souls
    may not fall into the hands of any such power. For when Christ was giving up His
    spirit on the cross, He said, ''Father, into Thy hands I commend my spirit,''
    as I have learned also from the memoirs. For He exhorted His disciples to surpass
    the pharisaic way of living, with the warning, that if they did not, they might
    be sure they could not be saved; and these words are recorded in the memoirs:
    ''Unless your righteousness exceed that of the Scribes and Pharisees, ye shall
    not enter into the kingdom of heaven.'' 106 "The remainder of the Psalm makes
    it manifest that He knew His Father would grant to Him all things which He asked,
    and would raise Him from the dead; and that He urged all who fear God to praise
    Him because He had compassion on all races of believing men, through the mystery
    of Him who was crucified; and that He stood in the midst of His brethren the apostles
    (who repented of their flight from Him when He was crucified, after He rose from
    the dead, and after they were persuaded by Himself that, before His passion He
    had mentioned to them that He must suffer these things, and that they were announced
    beforehand by the prophets), and when living with them sang praises to God, as
    is made evident in the memoirs of the apostles. The words are the following: ''I
    will declare Thy name to my brethren; in the midst of the Church will I praise
    Thee. Ye that fear the Lord, praise Him; all ye, the seed of Jacob, glorify Him.
    Let all the seed of Israel fear Him.'' And when it is said that He changed the
    name of one of the apostles to Peter; and when it is written in the memoirs of
    Him that this so happened, as well as that He changed the names of other two brothers,
    the sons of Zebedee, to Boanerges, which means sons of thunder; this was an announcement
    of the fact that it was He by whom Jacob was called Israel, and Oshea called Jesus
    (Joshua), under whose name the people who survived of those that came from Egypt
    were conducted into the land promised to the patriarchs. And that He should arise
    like a star from the seed of Abraham, Moses showed before hand when he thus said,
    ''A star shall arise from Jacob, and a leader from Israel;'' and another Scripture
    says, ''Behold a man; the East is His name.'' Accordingly, when a star rose in
    heaven at the time of His birth, as is recorded in the memoirs of His apostles,
    the Magi from Arabia, recognising the sign by this, came and worshipped Him. 107
    "And that He would rise again on the third day after the crucifixion, it is written
    in the memoirs that some of your nation, questioning Him, said, ''Show us a sign;''
    and He replied to them, ''An evil and adulterous generation seeketh after a sign;
    and no sign shall be given them, save the sign of Jonah.'' And since He spoke
    this obscurely, it was to be understood by the audience that after His crucifixion
    He should rise again on the third day. And He showed that your generation was
    more wicked and more adulterous than the city of Nineveh; for the latter, when
    Jonah preached to them, after he had been cast up on the third day from the belly
    of the great fish, that after three (in other versions, forty) days they should
    all perish, proclaimed a fast of all creatures, men and beasts, with sackcloth,
    and with earnest lamentation, with true repentance from the heart, and turning
    away from unrighteousness, in the belief that God is merciful and kind to all
    who turn from wickedness; so that the king of that city himself, with his nobles
    also, put on sackcloth and remained fasting and praying, and obtained their request
    that the city should not be overthrown. But when Jonah was grieved that on the
    (fortieth) third day, as he proclaimed, the city was not overthrown, by the dispensation
    of a gourd springing up from the earth for him, under which he sat and was shaded
    from the heat (now the gourd had sprung up suddenly, and Jonah had neither planted
    nor watered it, but it had come up all at once to afford him shade), and by the
    other dispensation of its withering away, for which Jonah grieved, [God] convicted
    him of being unjustly displeased because the city of Nineveh had not been overthrown,
    and said, ''Thou hast had pity on the gourd, for the which thou hast not laboured,
    neither madest it grow; which came up in a night, and perished in a night. And
    shall I not spare Nineveh, the great city, wherein dwell more than six score thousand
    persons that cannot discern between their right hand and their left hand; and
    also much cattle?'' 108 "And though all the men of your nation knew the incidents
    in the life of Jonah, and though Christ said amongst you that He would give the
    sign of Jonah, exhorting you to repent of your wicked deeds at least after He
    rose again from the dead, and to mourn before God as did the Ninevites, in order
    that your nation and city might not be taken and destroyed, as they have been
    destroyed; yet you not only have not repented, after you learned that He rose
    from the dead, but, as I said before you have sent chosen and ordained men throughout
    all the world to proclaim that a godless and lawless heresy had sprung from one
    Jesus, a Galilaean deceiver, whom we crucified, but his disciples stole him by
    night from the tomb, where he was laid when unfastened from the cross, and now
    deceive men by asserting that he has risen from the dead and ascended to heaven.
    Moreover, you accuse Him of having taught those godless, lawless, and unholy doctrines
    which you mention to the condemnation of those who confess Him to be Christ, and
    a Teacher from and Son of God. Besides this, even when your city is captured,
    and your land ravaged, you do not repent, but dare to utter imprecations on Him
    and all who believe in Him. Yet we do not hate you or those who, by your means,
    have conceived such prejudices against us; but we pray that even now all of you
    may repent and obtain mercy from God, the compassionate and long-suffering Father
    of all. 109 "But that the Gentiles would repent of the evil in which they led
    erring lives, when they heard the doctrine preached by His apostles from Jerusalem,
    and which they learned through them, suffer me to show you by quoting a short
    statement from the prophecy of Micah, one of the twelve [minor prophets]. This
    is as follows: ''And in the last days the mountain of the Lord shall be manifest,
    established on the top of the mountains; it shall be exalted above the hills,
    arid people shall flow unto it. And many nations shall go, and say, Come, let
    us go up to the mountain of the Lord, and to the house of the God of Jacob; and
    they shall enlighten us in His way, and we shall walk in His paths: for out of
    Zion shall go forth the law, and the word of the Lord from Jerusalem. And He shall
    judge among many peoples, and shall rebuke strong nations afar off; and they shall
    beat their swords into ploughshares, and their spears into sickles: nation shall
    not lift up a sword against nation, neither shall they learn war any more. And
    each man shall sit under his vine and under his fig tree; and there shall be none
    to terrify: for the mouth of the Lord of hosts hath spoken it. For all people
    will walk in the name of their gods; but we will walk in the name of the Lord
    our God for ever. And it shall come to pass in that day, that I will assemble
    her that is afflicted, and gather her that is driven out, and whom I had plagued;
    and I shall make her that is afflicted a remnant, and her that is oppressed a
    strong nation. And the Lord shall reign over them in Mount Zion from henceforth,
    and even for ever.'' " 110 And when I had finished these words, I continued: "Now
    I am aware that your teachers, sirs, admit the whole of the words of this passage
    to refer to Christ; and I am likewise aware that they maintain He has not yet
    come; or if they say that He has come, they assert that it is not known who He
    is; but when He shall become manifest and glorious, then it shall be known who
    He is. And then, they say, the events mentioned in this passage shall happen,
    just as if there was no fruit as yet from the words of the prophecy. O unreasoning
    men! understanding not what has been proved by all these passages, that two advents
    of Christ have been announced: the one, in which He is set forth as suffering,
    inglorious, dishonoured, and crucified; but the other, in which He shall come
    from heaven with glory, when the man of apostasy, who speaks strange things against
    the Most High, shall venture to do unlawful deeds on the earth against us the
    Christians, who, having learned the true worship of God from the law, and the
    word which went forth from Jerusalem by means of the apostles of Jesus, have fled
    for safety to the God of Jacob and God of Israel; and we who were filled with
    war, and mutual slaughter, and every wickedness, have each through the whole earth
    changed our warlike weapons,--our swords into ploughshares, and our spears into
    implements of tillage,--and we cultivate piety, righteousness, philanthropy, faith,
    and hope, which we have from the Father Himself through Him who was crucified;
    and sitting each under his vine, i.e., each man possessing his own married wife.
    For you are aware that the prophetic word says, ''And his wife shall be like a
    fruitful vine.'' Now it is evident that no one can terrify or subdue us who have
    believed in Jesus over all the world. For it is plain that, though beheaded, and
    crucified, and thrown to wild beasts, and chains, and fire, and all other kinds
    of torture, we do not give up our confession; but the more such things happen,
    the more do others and in larger numbers become faithful, and worshippers of God
    through the name of Jesus. For Just as if one should cut away the fruit-bearing
    parts of a vine, it grows up again, and yields other branches flourishing and
    fruitful; even so the same thing happens with us. For the vine planted by God
    and Christ the Saviour is His people. But the rest of the prophecy shall be fulfilled
    at His second coming. For the expression, ''He that is afflicted [and driven out],''
    i.e., from the world, [implies] that, so far as you and all other men have it
    in your power, each Christian has been driven out not only from his own property,
    but even from the whole world; for you permit no Christian to live. But you say
    that the same fate has befallen your own nation. Now, if you have been cast out
    after defeat in battle, you have suffered such treatment justly indeed, as all
    the Scriptures bear witness; but we, though we have done no such [evil acts] after
    we knew the truth of God, are testified to by God, that, together with the most
    righteous, and only spotless and sinless Christ, we are taken away out of the
    earth. For Isaiah cries, ''Behold how the righteous perishes, and no man lays
    it to heart; and righteous men are taken away, and no man considers it.'' 111
    "And that it was declared by symbol, even in the time of Moses, that there would
    be two advents of this Christ, as I have mentioned previously, [is manifest] from
    the symbol of the goats presented for sacrifice during the fast. And again, by
    what Moses and Joshua did, the same thing was symbolically announced and told
    beforehand. For the one of them, stretching out his hands, remained till evening
    on the hill, his hands being supported; and this reveals a type of no other thing
    than of the cross: and the other, whose name was altered to Jesus (Joshua), led
    the fight, and Israel conquered. Now this took place in the case of both those
    holy men and prophets of God, that you may perceive how one of them could not
    bear up both the mysteries: I mean, the type of the cross and the type of the
    name. For this is, was, and shall be the strength of Him alone, whose name every
    power dreads, being very much tormented because they shall be destroyed by Him.
    Therefore our suffering and crucified Christ was not cursed by the law, but made
    it manifest that He alone would save those who do not depart from His faith. And
    the blood of the passover, sprinkled on each man''s door-posts and lintel, delivered
    those who were saved in Egypt, when the first-born of the Egyptians were destroyed.
    For the passover was Christ, who was afterwards sacrificed, as also Isaiah said,
    ''He was led as a sheep to the slaughter.'' And it is written, that on the day
    of the passover you seized Him, and that also during the passover you crucified
    Him. And as the blood of the passover saved those who were in Egypt, so also the
    blood of Christ will deliver from death those who have believed. Would God, then,
    have been deceived if this sign had not been above the doors? I do not say that;
    but I affirm that He announced beforehand the future salvation for the human race
    through the blood of Christ. For the sign of the scarlet thread, which the spies,
    sent to Jericho by Joshua, son of Nave (Nun), gave to Rahab the harlot, telling
    her to bind it to the window through which she let them down to escape from their
    enemies, also manifested the symbol of the blood of Christ, by which those who
    were at one time harlots and unrighteous persons out of all nations are saved,
    receiving remission of sins, and continuing no longer in sin. 112 "But you, expounding
    these things in a low [and earthly] manner, impute much weakness to God, if you
    thus listen to them merely, and do not investigate the force of the words spoken.
    Since even Moses would in this way be considered a transgressor: for he enjoined
    that no likeness of anything in heaven, or on earth, or in the sea, be made; and
    then he himself made a brazen serpent and set it on a standard, and bade those
    who were bitten look at it: and they were saved when they looked at it. Will the
    serpent, then, which (I have already said) God had in the beginning cursed and
    cut off by the great sword, as Isaiah says, be understood as having preserved
    at that time the people? and shall we receive these things in the foolish acceptation
    of your teachers, and [regard] them not as signs? And shall we not rather refer
    the standard to the resemblance of the crucified Jesus, since also Moses by his
    outstretched hands, together with him who was named Jesus (Joshua), achieved a
    victory for your people? For in this way we shall cease to be at a loss about
    the things which the lawgiver did, when he, without forsaking God, persuaded the
    people to hope in a beast through which transgression and disobedience had their
    origin. And this was done and said by the blessed prophet with much intelligence
    and mystery; and there is nothing said or done by any one of the prophets, without
    exception, which one can justly reprehend, if he possess the knowledge which is
    in them. But if your teachers only expound to you why female cancels are spoken
    of in this passage, and are not in that; or why so many measures of fine flour
    and so many measures of oil [are used] in the offerings; and do so in a low and
    sordid manner, while they never venture either to speak of or to expound the points
    which are great and worthy of investigation, or command you to give no audience
    to us while we expound them, and to come not into conversation with us; will they
    not deserve to hear what our Lord Jesus Christ said to them: ''Whited sepulchres,
    which appear beautiful outward, and within are full of dead men''s bones; which
    pay tithe of mint, and swallow a camel: ye blind guides!'' If, then, you will
    not despise the doctrines of those who exalt themselves and wish to be called
    Rabbi, Rabbi, and come with such earnestness and intelligence to the words of
    prophecy as to suffer the same inflictions from your own people which the prophets
    themselves did, you cannot receive any advantage whatsoever from the prophetic
    writings. 113 "What I mean is this. Jesus (Joshua), as I have now frequently remarked,
    who was called Oshea, when he was sent to spy out the land of Canaan, was named
    by Moses Jesus (Joshua). Why he did this you neither ask, nor are at a loss about
    it, nor make strict inquiries. Therefore Christ has escaped your notice; and though
    you read, you understand not; and even now, though you hear that Jesus is our
    Christ, you consider not that the name was bestowed on Him not purposelessly nor
    by chance. But you make a theological discussion as to why one rho was added to
    Abraham''s first name; and as to why one ''p'' was added to Sarah''s name, you
    use similar high-sounding disputations. But why do you not similarly investigate
    the reason why the name of Oshea the son of Nave (Nun), which his father gave
    him, was changed to Jesus (Joshua)? But since not only was his name altered, but
    he was also appointed successor to Moses, being the only one of his contemporaries
    who came out from Egypt, he led the surviving people into the Holy Land; and as
    he, not Moses, led the people into the Holy Land, and as he distributed it by
    lot to those who entered along with him, so also Jesus the Christ will turn again
    the dispersion of the people, and will distribute the good land to each one, though
    not in the same manner. For the former gave them a temporary inheritance, seeing
    he was neither Christ who is God, nor the Son of God; but the latter, after the
    holy resurrection, shall give us the eternal possession. The former, after he
    had been named Jesus (Joshua), and after he had received strength from. His Spirit,
    caused the sun to stand still. For I have proved that it was Jesus who appeared
    to and conversed with Moses, and Abraham, and all the other patriarchs without
    exception, ministering to the will of the Father; who also, I say, came to be
    born man by the Virgin Mary, and I lives for ever. For the latter is He after
    whom and by whom the Father will renew both the heaven and the earth; this is
    He who shall shine an eternal light in Jerusalem; this is he who is the king of
    Salem after the order of Melchizedek, and the eternal Priest of the Most High.
    The former is said to have circumcised the people a second time with knives of
    stone (which was a sign of this circumcision with which Jesus Christ Himself has
    circumcised us from the idols made of stone and of other materials), and to have
    collected together those who were circumcised from the uncircumcision, i.e., from
    the error of the world, in every place by the knives of stone, to wit, the words
    of our Lord Jesus. For I have shown that Christ was proclaimed by the prophets
    in parables a Stone and a Rock. Accordingly the knives of stone we shall take
    to mean His words, by means of which so many who were in error have been circumcised
    from uncircumcision with the circumcision of the heart, with which God by Jesus
    commanded those from that time to be circumcised who derived their circumcision
    from Abraham, saying that Jesus (Joshua) would circumcise a second time with knives
    of stone those who entered into that holy land. 114 "For the Holy Spirit sometimes
    brought about that something, which was the type of the future, should be done
    clearly; sometimes He uttered words about what was to take place, as if it was
    then taking place, or had taken place. And unless those who read perceive this
    art, they will not be able to follow the words of the prophets as they ought.
    For example''s sake, I shall repeat some prophetic passages, that you may understand
    what I say. When He speaks by Isaiah, ''He was led as a sheep to the slaughter,
    and like a lamb before the shearer,'' He speaks as if the suffering had already
    taken place. And when He says again, ''I have stretched out my hands to a disobedient
    and gainsaying people;'' and when He says, ''Lord, who hath believed our report?''--the
    words are spoken as if announcing events which had already come to pass. For I
    have shown that Christ is oftentimes called a Stone in parable, and in figurative
    speech Jacob and Israel. And again, when He says, ''I shall behold the heavens,
    the works of Thy fingers,'' unless I understand His method of using words, I shall
    not understand intelligently, but just as your teachers suppose, fancying that
    the Father of all, the unbegotten God, has hands and feet, and fingers, and a
    soul, like a composite being; and they for this reason teach that it was the Father
    Himself who appeared to Abraham and to Jacob. Blessed therefore are we who have
    been circumcised the second time with knives of stone. For your first circumcision
    was and is performed by iron instruments, for you remain hard-hearted; but our
    circumcision, which is the second, having been instituted after yours, circumcises
    us from idolatry and from absolutely every kind of wickedness by sharp stones,
    i.e., by the words [preached] by the apostles of the corner-stone cut out without
    hands. And our hearts are thus circumcised from evil, so that we are happy to
    die for the name of the good Rock, which causes living water to burst forth for
    the hearts of those who by Him have loved the Father of all, and which gives those
    who are willing to drink of the water of life. But you do not comprehend me when
    I speak these things; for you have not understood what it has been prophesied
    that Christ would do, and you do not believe us who draw your attention to what
    has been written. For Jeremiah thus cries: ''Woe unto you! because you have forsaken
    the living fountain, and have digged for yourselves broken cisterns that can hold
    no water. Shall there be a wilderness where Mount Zion is, because I gave Jerusalem
    a bill of divorce in your sight?'' 115 "But you ought to believe Zechariah when
    he shows in parable the mystery of Christ, and announces it obscurely. The following
    are his words: ''Rejoice, and be glad, O daughter of Zion: for, lo, I come, and
    I shall dwell in the midst of thee, saith the Lord. And many nations shall be
    added to the Lord in that day. And they shall be my people, and I will dwell in
    the midst of thee; and they shall know that the Lord of hosts hath sent me unto
    thee. And the Lord shall inherit Judah his portion in the holy land, and He shall
    choose Jerusalem again. Let all flesh fear before the Lord, for He is raised up
    out of His holy clouds. And He showed me Jesus (Joshua) the high priest standing
    before the angel [of the Lord]; and the devil stood at his right hand to resist
    him. And the Lord said to the devil, The Lord who hath chosen Jerusalem rebuke
    thee. Behold, is not this a brand plucked out of the fire?'' " As Trypho was about
    to reply and contradict me, I said, "Wait and hear what I say first: for I am
    not to give the explanation which you suppose, as if there had been no priest
    of the name of Joshua (Jesus) in the land of Babylon, where your nation were prisoners.
    But even if I did, I have shown that if there was a priest named Joshua (Jesus)
    in your nation, yet the prophet had not seen him in his revelation, just as he
    had not seen either the devil or the angel of the Lord by eyesight, and in his
    waking condition, but in a trance, at the time when the revelation was made to
    him. But I now say, that as [Scripture] said that the Son of Nave (Nun) by the
    name Jesus (Joshua) wrought powerful works and exploits which proclaimed beforehand
    what would be performed by our Lord; so I proceed now to show that the revelation
    made among your people in Babylon in the days of Jesus (Joshua) the priest, was
    an announcement of the things to be accomplished by our Priest, who is God, and
    Christ the Son of God the Father of all. "Indeed, I wondered," continued I, "why
    a little ago you kept silence while I was speaking, and why you did not interrupt
    me when I said that the son of Nave (Nun) was the only one of contemporaries who
    came out of Egypt that entered the Holy Land along with the men described as younger
    than that generation. For you swarm and light on sores like flies. For though
    one should speak ten thousand words well, if there happen to be one little word
    displeasing to you, because not sufficiently intelligible or accurate, you make
    no account of the many good words, but lay hold of the little word, and are very
    zealous in setting it up as something impious and guilty; in order that, when
    you are judged with the very same judgment by God, you may have a much heavier
    account to render for your great audacities, whether evil actions, or bad interpretations
    which you obtain by falsifying the truth. For with what judgment you judge, it
    is righteous that you be judged withal. 116 "But to give you the account of the
    revelation of the holy Jesus Christ, I take up again my discourse, and I assert
    that even that revelation was made for us who believe on Christ the High Priest,
    namely this crucified One; and though we lived in fornication and all kinds of
    filthy conversation, we have by the grace of our Jesus, according to His Father''s
    will, stripped ourselves of all those filthy wickednesses with which we were imbued.
    And though the devil is ever at hand to resist us, and anxious to seduce all to
    himself, yet the Angel of God, i.e., the Power of God sent to us through Jesus
    Christ, rebukes him, and he departs from us. And we are just as if drawn out from
    the fire, when purified from our former sins, and [rescued] from the affliction
    and the fiery trial by which the devil and all his coadjutors try us; out of which
    Jesus the Son of God has promised again to deliver us, and invest us with prepared
    garments, if we do His commandments; and has undertaken to provide an eternal
    kingdom [for us]. For just as that Jesus (Joshua), called by the prophet a priest,
    evidently had on filthy garments because he is said to have taken a harlot for
    a wife, and is called a brand plucked out of the fire, because he had received
    remission of sins when the devil that resisted him was rebuked; even so we, who
    through the name of Jesus have believed as one man in God the Maker of all, have
    been stripped, through the name of His first-begotten Son, of the filthy garments,
    i.e., of our sins; and being vehemently inflamed by the word of His calling, we
    are the true high priestly race of God, as even God Himself bears witness, saying
    that in every place among the Gentiles sacrifices are presented to Him well-pleasing
    and pure. Now God receives sacrifices from no one, except through His priests.
    117 "Accordingly, God, anticipating all the sacrifices which we offer through
    this name, and which Jesus the Christ enjoined us to offer, i.e., in the Eucharist
    of the bread and the cup, and which are presented by Christians in all places
    throughout the world, bears witness that they are well-pleasing to Him. But He
    utterly rejects those presented by you and by those priests of yours, saying,
    ''And I will not accept your sacrifices at your hands; for from the rising of
    the sun to its setting my name is glorified among the Gentiles (He says); but
    ye profane it.'' Yet even now, in your love of contention, you assert that God
    does not accept the sacrifices of those who dwelt then in Jerusalem, and were
    called Israelites; but says that He is pleased with the prayers of the individuals
    of that nation then dispersed, and calls their prayers sacrifices. Now, that prayers
    and giving of thanks, when offered by worthy men, are the only perfect and well-pleasing
    sacrifices to God, I also admit. For such alone Christians have undertaken to
    offer, and in the remembrance effected by their solid and liquid food, whereby
    the suffering of the Son of God which He endured is brought to mind, whose name
    the high priests of your nation and your teachers have caused to be profaned and
    blasphemed over all the earth. But these filthy garments, which have been put
    by you on all who have become Christians by the name of Jesus, God shows shall
    be taken away from us, when He shall raise all men from the dead, and appoint
    some to be incorruptible, immortal, and free from sorrow in the everlasting and
    imperishable kingdom; but shall send others away to the everlasting punishment
    of fire. But as to you and your teachers deceiving yourselves when you interpret
    what the Scripture says as referring to those of your nation then in dispersion,
    and maintain that their prayers and sacrifices offered in every place are pure
    and well-pleasing, learn that you are speaking falsely, and trying by all means
    to cheat yourselves: for, first of all, not even now does your nation extend from
    the rising to the setting of the sun, but there are nations among which none of
    your race ever dwelt. For there is not one single race of men, whether barbarians,
    or Greeks, or whatever they may be called, nomads, or vagrants, or herdsmen living
    in tents, among whom prayers and giving of thanks are not offered through the
    name of the crucified Jesus. And then, as the Scriptures show, at the time when
    Malachi wrote this, your dispersion over all the earth, which now exists, had
    not taken place. 118 "So that you ought rather to desist from the love of strife,
    and repent before the great day of judgment come, wherein all those of your tribes
    who have pierced this Christ shall mourn as I have shown has been declared by
    the Scriptures. And I have explained that the Lord swore, ''after the order of
    Melchizedek,'' and what this prediction means; and the prophecy of Isaiah which
    says, ''His burial is taken away from the midst,'' I have already said, referred
    to the future burying and rising again of Christ; and I have frequently remarked
    that this very Christ is the Judge of all the living and the dead. And Nathan
    likewise, speaking to David about Him, thus continued: ''I will be His Father,
    and He shall be my Son; and my mercy shall I not take away from Him, as I did
    from them that went before Him; and I will establish Him in my house, and in His
    kingdom for ever.'' And Ezekiel says, ''There shall be no other prince in the
    house but He.'' For He is the chosen Priest and eternal King, the Christ, inasmuch
    as He is the Son of God; and do not suppose that Isaiah or the other prophets
    speak of sacrifices of blood or libations being presented at the altar on His
    second advent, but of true and spiritual praises and giving of thanks. And we
    have not in vain believed in Him, and have not been led astray by those who taught
    us such doctrines; but this has come to pass through the wonderful foreknowledge
    of God, in order that we, through the calling of the new and eternal covenant,
    that is, of Christ, might be found more intelligent and God-fearing than yourselves,
    who are considered to be lovers of God and men of understanding, but are not.
    Isaiah, filled with admiration of this, said: ''And kings shall shut their mouths:
    for those to whom no announcement has been made in regard to Him shall see; and
    those who heard not shall understand. Lord, who hath believed our report? and
    to whom is the arm of the Lord revealed?'' "And in repeating this, Trypho," I
    continued, "as far as is allowable, I endeavour to do so for the sake of those
    who came with you to-day, yet briefly and concisely." Then he replied, "You do
    well; and though you repeat the same things at considerable length, be assured
    that I and my companions listen with I pleasure." 119 Then I said again, "Would
    you suppose, sirs, that we could ever have understood these matters in the Scriptures,
    if we had not received grace to discern by the will of Him whose pleasure it was?
    in order that the saying of Moses might come to pass, ''They provoked me with
    strange [gods], they provoked me to anger with their abominations. They sacrificed
    to demons whom they knew not; new gods that came newly up, whom their fathers
    knew not. Thou hast forsaken God that begat thee, and forgotten God that brought
    thee up. And the Lord saw, and was jealous, and was provoked to anger by reason
    of the rage of His sons and daughters: and He said, I will turn My face away from
    them, and I will show what shall come on them at the last; for it is a very froward
    generation, children in whom is no faith. They have moved Me to jealousy with
    that which is not God, they have provoked Me to anger with their idols; and I
    will move them to jealousy with that which is not a nation, I will provoke them
    to anger with a foolish people. For a fire is kindled from Mine anger, and it
    shall burn to Hades. It shall consume the earth and her increase, and set on fire
    the foundations of the mountains; I will heap mischief on them.'' And after that
    Righteous One was put to death, we flourished as another people, and shot forth
    as new and prosperous corn; as the prophets said, ''And many nations shall betake
    themselves to the Lord in that day for a people: and they shall dwell in the midst
    of all the earth.'' But we are not only a people, but also a holy people, as we
    have shown already. ''And they shall call them the holy people, redeemed by the
    Lord.'' Therefore we are not a people to be despised, nor a barbarous race, nor
    such as the Carian and Phrygian nations; but God has even chosen us and He has
    become manifest to those who asked not after Him. ''Behold, I am God,'' He says,
    ''to the nation which called not on My name.'' For this is that nation which God
    of old promised to Abraham, when He declared that He would make him a father of
    many nations; not meaning, however, the Arabians, or Egyptians, or Idumaeans,
    since Ishmael became the father of a mighty nation, and so did Esau; and there
    is now a great multitude of Ammonites. Noah, moreover, was the father of Abraham,
    and in fact of all men; and others were the progenitors of others. What larger
    measure of grace, then, did Christ bestow on Abraham? This, namely, that He called
    him with His voice by the like calling, telling him to quit the land wherein he
    dwelt. And He has called all of us by that voice, and we have left already the
    way of living in which we used to spend our days, passing our time in evil after
    the fashions of the other inhabitants of the earth; and along with Abraham we
    shall inherit the holy land, when we shall receive the inheritance for an endless
    eternity, being children of Abraham through the like faith. For as he believed
    the voice of God, and it was imputed to him for righteousness, in like manner
    we having believed God''s voice spoken by the apostles of Christ, and promulgated
    to us by the prophets, have renounced even to death all the things of the world.
    Accordingly, He promises to him a nation of similar faith, God-fearing, righteous,
    and delighting the Father; but it is not you, ''in whom is no faith.'' 120 "Observe,
    too, how the same promises are made to Isaac and to Jacob. For thus He speaks
    to Isaac: ''And in thy seed shall all the nations of the earth be blessed.'' And
    to Jacob: ''And in thee and in thy seed shall all families of the earth be blessed.''
    He says that neither to Esau nor to Reuben, nor to any other; only to those of
    whom the Christ should arise, according to the dispensation, through the Virgin
    Mary. But if you would consider the blessing of Judah, you would perceive what
    I say. For the seed is divided from Jacob, and comes down through Judah, and Phares,
    and Jesse, and David. And this was a symbol of the fact that some of your nation
    would be found children of Abraham, and found, too, in the lot of Christ; but
    that others, who are indeed children of Abraham, would be like the sand on the
    sea-shore, barren and fruitless, much in quantity, and without number indeed,
    but bearing no fruit whatever, and only drinking the water of the sea. And a vast
    multitude in your nation are convicted of being of this kind, imbibing doctrines
    of bitterness and godlessness, but spurning the word of God. He speaks therefore
    in the passage relating to Judah: ''A prince shall not fail from Judah, nor a
    ruler from his thighs, till that which is laid up for him come; and He shall be
    the expectation of the nations.'' And it is plain that this was spoken not of
    Judah, but of Christ. For all we out of all nations do expect not Judah, but Jesus,
    who led your fathers out of Egypt. For the prophecy referred even to the advent
    of Christ: ''Till He come for whom this is laid up, and He shall be the expectation
    of nations.'' Jesus came, therefore, as we have shown at length, and is expected
    again to appear above the clouds; whose name you profane, and labour hard to get
    it profaned over all the earth. It were possible for me, sirs," I continued, "to
    contend against you about the reading which you so interpret, saying it is written,
    ''Till the things laid up for Him come;'' though the Seventy have not so explained
    it, but thus, ''Till He comes for whom this is laid up.'' But since what follows
    indicates that the reference is to Christ (for it is, ''and He shall be the expectation
    of nations''), I do not proceed to have a mere verbal controversy with you, as
    I have not attempted to establish proof about Christ from the passages of Scripture
    which are not admitted by you? which I quoted from the words of Jeremiah the prophet,
    and Esdras, and David; but from those which are even now admitted by you, which
    had your teachers comprehended, be well assured they would have deleted them,
    as they did those about the death of Isaiah, whom you sawed asunder with a wooden
    saw. And this was a mysterious type of Christ being about to cut your nation in
    two, and to raise those worthy of the honour to the everlasting kingdom along
    with the holy patriarchs and prophets; but He has said that He will send others
    to the condemnation of the unquenchable fire along with similar disobedient and
    impenitent men from all the nations. ''For they shall come,'' He said, ''from
    the west and from the east, and shall sit down with Abraham, and Isaac, and Jacob
    in the kingdom of heaven; but the children of the kingdom shall be cast out into
    outer darkness.'' And I have mentioned these things, taking nothing whatever into
    consideration, except the speaking of the truth, and refusing to be coerced by
    any one, even though I should be forthwith torn in pieces by you. For I gave no
    thought to any of my people, that is, the Samaritans, when I had a communication
    in writing with Caesar, but stated that they were wrong in trusting to the magician
    Simon of their own nation, who, they say, is God above all power, and authority,
    and might." 121 And as they kept silence, I went on: "[The Scripture], speaking
    by David about this Christ, my friends, said no longer that ''in His seed'' the
    nations should be blessed, but ''in Him.'' So it is here: ''His name shall rise
    up for ever above the sun; and in Him shall all nations be blessed.'' But if all
    nations are blessed in Christ, and we of all nations believe in Him, then He is
    indeed the Christ, and we are those blessed by Him. God formerly gave the sun
    as an object of worship, as it is written, but no one ever was seen to endure
    death on account of his faith in the sun; but for the name of Jesus you may see
    men of every nation who have endured and do endure all sufferings, rather than
    deny Him. For the word of His truth and wisdom is more ardent and more light-giving
    than the rays of the sun, and sinks down into the depths of heart and mind. Hence
    also the Scripture said, ''His name shall rise up above the sun.'' And again,
    Zechariah says, ''His name is the East.'' And speaking of the same, he says that
    ''each tribe shall mourn.'' But if He so shone forth and was so mighty in His
    first advent (which was without honour and comeliness, and very contemptible),
    that in no nation He is unknown, and everywhere men have repented of the old wickedness
    in each nation''s way of living, so that even demons were subject to His name,
    and all powers and kingdoms feared His name more than they feared all the dead,
    shall He not on His glorious advent destroy by all means all those who hated Him,
    and who unrighteously departed from Him, but give rest to His own, rewarding them
    with all they have looked for? To us, therefore, it has been granted to hear,
    and to understand, and to be saved by this Christ, and to recognise all the [truths
    revealed] by the Father. Wherefore He said to Him: ''It is a great thing for Thee
    to be called my servant, to raise up the tribes of Jacob, and turn again the dispersed
    of Israel. I have appointed Thee for a light to the Gentiles, that Thou mayest
    be their salvation unto the end of the earth.'' 122 "You think that these words
    refer to the stranger and the proselytes, but in fact they refer to us who have
    been illumined by Jesus. For Christ would have borne witness even to them; but
    now you are become twofold more the children of hell, as He said Himself. Therefore
    what was written by the prophets was spoken not of those persons, but of us, concerning
    whom the Scripture speaks: ''I will lead the blind by a way which they knew not;
    and they shall walk in paths which they have not known. And I am witness, saith
    the Lord God, and my servant whom I have chosen.'' To whom, then, does Christ
    bear witness? Manifestly to those who have believed. But the proselytes not only
    do not believe, but twofold more than yourselves blaspheme His name, and wish
    to torture and put to death us who believe in Him; for in all points they strive
    to be like you. And again in other words He cries: ''I the Lord have called Thee
    in righteousness, and will hold Thine hand, and will strengthen Thee, and will
    give Thee for a covenant of the people, for a light of the Gentiles, to open the
    eyes of the blind, to bring out the prisoners from their bonds.'' These words,
    indeed, sirs, refer also to Christ, and concern the enlightened nations; or will
    you say again, He speaks to them of the law and the proselytes?" Then some of
    those who had come on the second day cried out as if they had been in a theatre,
    "But what? does He not refer to the law, and to those illumined by it? Now these
    are proselytes." "No," I said, looking towards Trypho, "since, if the law were
    able to enlighten the nations and those who possess it, what need is there of
    a new covenant? But since God announced beforehand that He would send a new covenant,
    and an everlasting law and commandment, we will not understand this of the old
    law and its proselytes, but of Christ and His proselytes, namely us Gentiles,
    whom He has illumined, as He says somewhere: ''Thus saith the Lord, In an acceptable
    time have I heard Thee, and in a day of salvation have I helped Thee, and I have
    given Thee for a covenant of the people, to establish the earth, and to inherit
    the deserted.'' What, then, is Christ''s inheritance? Is it not the nations? What
    is the covenant of God? Is it not Christ? As He says in another place: ''Thou
    art my Son; this day have I begotten Thee. Ask of Me, and I shall give Thee the
    nations for Thine inheritance, and the uttermost parts of the earth for Thy possession.''
    123 "As, therefore, all these latter prophecies refer to Christ and the nations,
    you should believe that the former refer to Him and them in like manner. For the
    proselytes have no need of a covenant, if, since there is one and the same law
    imposed on all that are circumcised, the Scripture speaks about them thus: ''And
    the stranger shall also be joined with them, and shall be joined to the house
    of Jacob;'' and because the proselyte, who is circumcised that he may have access
    to the people, becomes like one of themselves, while we who have been deemed worthy
    to be called a people are yet Gentiles, because we have not been circumcised.
    Besides, it is ridiculous for you to imagine that the eyes of the proselytes are
    to be opened while your own are not, and that you be understood as blind and deaf
    while they are enlightened. And it will be still more ridiculous for you, if you
    say that the law has been given to the nations, but you have not known it. For
    you would have stood in awe of God''s wrath, and would not have been lawless,
    wandering sons; being much afraid of hearing God always say, ''Children in whom
    is no faith. And who are blind, but my servants? and deaf, but they that rule
    over them? And the servants of God have been made blind. You see often, but have
    not observed; your ears have been opened, and you have not heard.'' Is God''s
    commendation of you honourable? and is God''s testimony seemly for His servants?
    You are not ashamed though you often hear these words. You do not tremble at God''s
    threats, for you are a people foolish and hard-hearted. ''Therefore, behold, I
    will proceed to remove this people,'' saith the Lord;'' and I will remove them,
    and destroy the wisdom of the wise, and hide the understanding of the prudent.''
    Deservedly too: for you are neither wise nor prudent, but crafty and unscrupulous;
    wise only to do evil, but utterly incompetent to know the hidden counsel of God,
    or the faithful covenant of the Lord, or to find out the everlasting paths. ''Therefore,
    saith the Lord, I will raise up to Israel and to Judah the seed of men and the
    seed of beasts.'' And by Isaiah He speaks thus concerning another Israel: ''In
    that day shall there be a third Israel among the Assyrians and the Egyptians,
    blessed in the land which the Lord of Sabaoth hath blessed, saying, blessed shall
    my people in Egypt and in Assyria be, and Israel mine inheritance.'' Since then
    God blesses this people, and calls them Israel, and declares them to be His inheritance,
    how is it that you repent not of the deception you practise on yourselves, as
    if you alone were the Israel, and of execrating the people whom God has blessed?
    For when He speaks to Jerusalem and its environs, He thus added: ''And I will
    beget men upon you, even my people Israel; and they shall inherit you, and you
    shall be a possession for them; and you shall be no longer bereaved of them.''"
    "What, then?" says Trypho; "are you Israel? and speaks He such things of you?"
    "If, indeed," I replied to him, "we had not entered into a lengthy discussion
    on these topics, I might have doubted whether you ask this question in ignorance;
    but since we have brought the matter to a conclusion by demonstration and with
    your assent, I do not believe that you are ignorant of what I have just said,
    or desire again mere contention, but that you are urging me to exhibit the same
    proof to these men." And in compliance with the assent expressed in his eyes,
    I continued: "Again in Isaiah, if you have ears to hear it, God, speaking of Christ
    in parable, calls Him Jacob and Israel. He speaks thus: ''Jacob is my servant,
    I will uphold Him; Israel is mine elect, I will put my Spirit upon Him, and He
    shall bring forth judgment to the Gentiles. He shall not strive, nor cry, neither
    shall any one hear His voice in the street: a bruised reed He shall not break,
    and smoking flax He shall not quench; but He shall bring forth judgment to truth:
    He shall shine, and shall not be broken till He have set judgment on the earth.
    And in His name shall the Gentiles trust.'' As therefore from the one man Jacob,
    who was surnamed Israel, all your nation has been called Jacob and Israel; so
    we from Christ, who begat us unto God, like Jacob, and Israel, and Judah, and
    Joseph, and David, are called and are the true sons of God, and keep the commandments
    of Christ." 124 And when I saw that they were perturbed because I said that we
    are the sons of God, I anticipated their questioning, and said, "Listen, sirs,
    how the Holy Ghost speaks of this people, saying that they are all sons of the
    Highest; and how this very Christ will be present in their assembly, rendering
    judgment to all men. The words are spoken by David, and are, according to your
    version of them, thus: ''God standeth in the congregation of gods; He judgeth
    among the gods. How long do ye judge unjustly, and accept the persons of the wicked?
    Judge for the orphan and the poor, and do justice to the humble and needy. Deliver
    the needy, and save the poor out of the hand of the wicked. They know not, neither
    have they understood; they walk on in darkness: all the foundations of the earth
    shall be shaken. I said, Ye are gods, and are all children of the Most High. But
    ye die like men, and fall like one of the princes. Arise, O God! judge the earth,
    for Thou shalt inherit all nations.'' But in the version of the Seventy it is
    written, ''Behold, ye die like men, and fall like one of the princes, in order
    to manifest the disobedience of men,--I mean of Adam and Eve,--and the fall of
    one of the princes, i.e., of him who was called the serpent, who fell with a great
    overthrow, because he deceived Eve. But as my discourse is not intended to touch
    on this point, but to prove to you that the Holy Ghost reproaches men because
    they were made like God, free from suffering and death, provided that they kept
    His commandments, and were deemed deserving of the name of His sons, and yet they,
    becoming like Adam and Eve, work out death for themselves; let the interpretation
    of the Psalm be held just as you wish, yet thereby it is demonstrated that all
    men are deemed worthy of becoming "gods," and of having power to become sons of
    the Highest; and shall be each by himself judged and condemned like Adam and Eve.
    Now I have proved at length that Christ is called God. 125 "I wish, sirs," I said,
    "to learn from you what is the force of the name Israel." And as they were silent,
    I continued: "I shall tell you what I know: for I do not think it fight, when
    I know, not to speak; or, suspecting that you do know, and yet from envy or from
    voluntary ignorance deceive yourselves, to be continually solicitous; but I speak
    all things simply and candidly, as my Lord said: ''A sower went forth to sow the
    seed; and some fell by the wayside; and some among thorns, and some on stony ground,
    and some on good ground.'' I must speak, then, in the hope of finding good ground
    somewhere; since that Lord of mine, as One strong and powerful, comes to demand
    back His own from all, land will not condemn His steward if He recognises that
    he, by the knowledge that the Lord is powerful and has come to demand His own,
    has given it to every bank, and has not digged for any cause whatsoever. Accordingly
    the name Israel signifies this, A man who overcomes power; for Isra is a man overcoming,
    and El is power. And that Christ would act so when He became man was foretold
    by the mystery of Jacob''s wrestling with Him who appeared to him, in that He
    ministered to the will of the Father, yet nevertheless is God, in that He is the
    first-begotten of all creatures. For when He became man, as I previously remarked,
    the devil came to Him--i.e., that power which is called the serpent and Sa-tan--tempting
    Him, and striving to effect His downfall by asking Him to worship him. But He
    destroyed and overthrew the devil, having proved him to be wicked, in that he
    asked to be worshipper as God, contrary to the Scripture; who is an apostate from
    the will of God. For He answers him, ''It is written, Thou shalt worship the Lord
    thy God, and Him only shall thou serve.'' Then, overcome and convicted, the devil
    departed at that time. But since our Christ was to be numbed, i.e., by pain and
    experience of suffering, He made a previous intimation of this by touching Jacob''s
    thigh, and causing it to shrink. But Israel was His name from the beginning, to
    which He altered the name of the blessed Jacob when He blessed him with His own
    name, proclaiming thereby that all who through Him have fled for refuge to the
    Father, constitute the blessed Israel. But you, having understood none of this,
    and not being prepared to understand, since you are the children of Jacob after
    the fleshly seed, expect that you shall be assuredly saved. But that you deceive
    yourselves in such matters, I have proved by many words. 126 "But if you knew,
    Trypho," continued I, "who He is that is called at one time the Angel of great
    counsel, and a Man by Ezekiel, and like the Son of man by Daniel, and a Child
    by Isaiah, and Christ and God to be worshipped by David, and Christ and a Stone
    by many, and Wisdom by Solomon, and Joseph and Judah and a Star by Moses, and
    the East by Zechariah, and the Suffering One and Jacob and Israel by Isaiah again,
    and a Rod, and Flower, and Corner-Stone, and Son of God, you would not have blasphemer
    Him who has now come, and been born, and suffered, and ascended to heaven; who
    shall also come again, and then your twelve tribes shall mourn. For if you had
    understood what has been written by the prophets, you would not have denied that
    He was God, Son of the only, unbegotten, unutterable God. For Moses says somewhere
    in Exodus the following: ''The Lord spoke to Moses, and said to him, I am the
    Lord, and I appeared to Abraham, to Isaac, and to Jacob, being their God; and
    my name I revealed not to them, and I established my covenant with them.'' And
    thus again he says, ''A man wrestled with Jacob,'' and asserts it was God; narrating
    that Jacob said, ''I have seen God face to face, and my life is preserved.'' And
    it is recorded that he called the place where He wrestled with him, appeared to
    and blessed him, the Face of God (Peniel). And Moses says that God appeared also
    to Abraham near the oak in Mature, when he was sitting at the door of his tent
    at mid-day. Then he goes on to say: ''And he lifted up his eyes and looked, and,
    behold, three men stood before him; and when he saw them, he ran to meet them.''
    a After a little, one of them promises a son to Abraham: ''Wherefore did Sarah
    laugh, saying, Shall. I of a surety bear a child, and I am old? Is anything impossible
    with God? At the time appointed I will return, according to the time of life,
    and Sarah shall have a son. And they went away from Abraham.'' Again he speaks
    of them thus: ''And the men rose up from thence, and looked toward Sodom.'' Then
    to Abraham He who was and is again speaks: ''I will not hide from Abraham, my
    servant, what I intend to do.''" And what follows in the writings of Moses I quoted
    and explained; "from which I have demonstrated," I said, "that He who is described
    as God appeared to Abraham, to Isaac, and to Jacob, and the other patriarchs,
    was appointed under the authority of the Father and Lord, and ministers to His
    will." Then I went on to say what I had not said before: "And so, when the people
    desired to eat flesh, and Moses had lost faith in Him, who also there is called
    the Angel, and who promised that God would give them to satiety, He who is both
    God and the Angel, sent by the Father, is described as saying and doing these
    things. For thus the Scripture says: ''And the Lord said to Moses Will the Lord''s
    hand not be sufficient? thou shall know now whether my word shall conceal thee
    or not.'' And again, in other words, it thus says: ''But the Lord spoke unto me,
    Thou shalt not go over this Jordan: the Lord thy God, who goeth before thy face,
    He shall cut off the nations.'' 127 "These and other such sayings are recorded
    by the lawgiver and by the prophets; and I suppose that I have stated sufficiently,
    that wherever God says, ''God went up from Abraham,'' or, ''The Lord spake to
    Moses,'' and ''The Lord came down to behold the tower which the sons of men had
    built,'' or when ''God shut Noah into the ark,'' you must not imagine that the
    unbegotten God Himself came down or went up from any place. For the ineffable
    Father and Lord of all neither has come to any place, nor walks, nor sleeps, nor
    rises up, but remains in His own place, wherever that is, quick to behold and
    quick to hear, having neither eyes nor ears, but being of indescribable might;
    and He sees all things, and knows all things, and none of us escapes His observation;
    and He is not moved or confined to a spot in the whole world, for He existed before
    the world was made. How, then, could He talk with any one, or be seen by any one,
    or appear on the smallest portion of the earth, when the people at Sinai were
    not able to look even on the glory of Him who was sent from Him; and Moses himself
    could not enter into the tabernacle which he had erected, when it was filled with
    the glory of God; and the priest could not endure to stand before the temple when
    Solomon conveyed the ark into the house in Jerusalem which he had built for it?
    Therefore neither Abraham, nor Isaac, nor Jacob, nor any other man, saw the Father
    and ineffable Lord of all, and also of Christ, but [saw] Him who was according
    to His will His Son, being God, and the Angel because He ministered to His will;
    whom also it pleased Him to be born man by the Virgin; who also was fire when
    He conversed with Moses from the bush. Since, unless we thus comprehend the Scriptures,
    it must follow that the Father and Lord of all had not been in heaven when what
    Moses wrote took place: ''And the Lord rained upon Sodom fire and brimstone from
    the Lord out of heaven;'' and again, when it is thus said by David: ''Lift up
    your gates, ye rulers; and be ye lift up, ye everlasting gates; and the King of
    glory shall enter;'' and again, when He says: ''The Lord says to my Lord, Sit
    at My right hand, till I make Thine enemies Thy footstool.'' 128 "And that Christ
    being Lord, and God the Son of God, and appearing formerly in power as Man, and
    Angel, and in the glory of fire as at the bush, so also was manifested at the
    judgment executed on Sodom, has been demonstrated fully by what has been said."
    Then I repeated once more all that I had previously quoted from Exodus, about
    the vision in the bush, and the naming of Joshua (Jesus), and continued: "And
    do not suppose, sirs, that I am speaking superfluously when I repeat these words
    frequently: but it is because I know that some wish to anticipate these remarks,
    and to say that the power sent from the Father of all which appeared to Moses,
    or to Abraham, or to Jacob, is called an Angel because He came to men (for by
    Him the commands of the Father have been proclaimed to men); is called Glory,
    because He appears in a vision sometimes that cannot be borne; is called a Man,
    and a human being, because He appears strayed in such forms as the Father pleases;
    and they call Him the Word, because He carries tidings from the Father to men:
    but maintain that this power is indivisible and inseparable from the Father, just
    as they say that the light of the sun on earth is indivisible and inseparable
    from the sun in the heavens; as when it sinks, the light sinks along with it;
    so the Father, when He chooses, say they, causes His power to spring forth, and
    when He chooses, He makes it return to Himself. In this way, they teach, He made
    the angels. But it is proved that there are angels who always exist, and are never
    reduced to that form out of which they sprang. And that this power which the prophetic
    word calls God, as has been also amply demonstrated, and Angel, is not numbered
    [as different] in name only like the light of the sun but is indeed something
    numerically distinct, I have discussed briefly in what has gone before; when I
    asserted that this power was begotten from the Father, by His power and will,
    but not by abscission, as if the essence of the Father were divided; as all other
    things partitioned and divided are not the same after as before they were divided:
    and, for the sake of example, I took the case of fires kindled from a fire, which
    we see to be distinct from it, and yet that from which many can be kindled is
    by no means made less, but remains the same. 129 "And now I shall again recite
    the words which I have spoken in proof of this point. When Scripture says,'' The
    Lord rained fire from the Lord out of heaven,'' the prophetic word indicates that
    there were two in number: One upon the earth, who, it says, descended to behold
    the cry of Sodom; Another in heaven, who also is Lord of the Lord on earth, as
    He is Father and God; the cause of His power and of His being Lord and God. Again,
    when the Scripture records that God said in the beginning, ''Behold, Adam has
    become like one of Us,'' this phrase, ''like one of Us,'' is also indicative of
    number; and the words do not admit of a figurative meaning, as the sophists endeavour
    to affix on them, who are able neither to tell nor to understand the truth. And
    it is written in the book of Wisdom: ''If I should tell you daily events, I would
    be mindful to enumerate them from the beginning. The Lord created me the beginning
    of His ways for His works. From everlasting He established me in the beginning,
    before He formed the earth, and before He made the depths, and before the springs
    of waters came forth, before the mountains were settled; He begets me before all
    the hills.''" When I repeated these words, I added: "You perceive, my hearers,
    if you bestow attention, that the Scripture has declared that this Offspring was
    begotten by the Father before all things created; and that which is begotten is
    numerically distinct from that which begets, any one will admit." 130 And when
    all had given assent, I said: "I would now adduce some passages which I had not
    recounted before. They are recorded by the faithful servant Moses in parable,
    and are as follows: ''Rejoice, O ye heavens, with Him, and let all the angels
    of God worship Him;''" and I added what follows of the passage: "''Rejoice, O
    ye nations, with His people, and let all the angels of God be strengthened in
    Him: for the blood of His sons He avenges, and will avenge, and will recompense
    His enemies with vengeance, and will recompense those that hate Him; and the Lord
    will purify the land of His people.'' And by these words He declares that we,
    the nations, rejoice with His people,--to wit, Abraham, and Isaac, and Jacob,
    and the prophets, and, in short, all of that people who are well-pleasing to God,
    according to what has been already agreed on between us. But we will not receive
    it of all your nation; since we know from Isaiah that the members of those who
    have transgressed shall be consumed by the worm and unquenchable fire, remaining
    immortal; so that they become a spectacle to all flesh. But in addition to these,
    I wish, sin," said I, "to add some other passages from the very words of Moses,
    from which you may understand that God has from of old dispersed all men according
    to their kindreds and tongues; and out of all kindreds has taken to Himself your
    kindred, a useless, disobedient, and faithless generation; and has shown that
    those who were selected out of every nation have obeyed His will through Christ,--whom
    He calls also Jacob, and names Israel,--and these, then, as I mentioned fully
    previously, must be Jacob and Israel. For when He says, ''Rejoice, O ye nations,
    with His people,'' He allots the same inheritance to them, and does not call them
    by the same name; but when He says that they as Gentiles rejoice with His people,
    He calls them Gentiles to reproach you. For even as you provoked Him to anger
    by your idolatry, so also He has deemed those who were idolaters worthy of knowing
    His will, and of inheriting His inheritance. 131 "But I shall quote the passage
    by which it is made known that God divided all the nations. It is as follows:
    ''Ask thy father, and he will show thee; thine eiders, and they will tell thee;
    when the Most High divided the nations, as He dispersed the sons of Adam. He set
    the bounds of the nations according to the numbers of the children of Israel;
    and the Lord''s portion became His people Jacob, and Israel was the lot of His
    inheritance.''" And having said this, I added: "The Seventy have translated it,
    ''He set the bounds of the nations according to the number of the angels of God.''
    But because my argument is again in nowise weakened by this, I have adopted your
    exposition. And you yourselves, if you will confess the truth, must acknowledge
    that we, who have been called by God through the despised and shameful mystery
    of the cross (for the confession of which, and obedience to which, and for our
    piety, punishments even to death have been inflicted on us by demons, and by the
    host of the devil, through the aid ministered to them by you), and endure all
    torments rather than deny Christ even by word, through whom we are called to the
    salvation prepared beforehand by the Father, are more faithful to God than you,
    who were redeemed from Egypt with a high hand and a visitation of great glory,
    when the sea was parted for you, and a passage left dry, in which [God] slew those
    @ho pursued you with a very great equipment, and splendid chariots, bringing back
    upon them the sea which had been made a way for your sakes; on whom also a pillar
    of light shone, in order that you, more than any other nation in the world, might
    possess a peculiar light, never-failing and never-setting; for whom He rained
    manna as nourishment, fit for the heavenly angels, in order that you might have
    no need to prepare your food; and the water at Marah was made sweet; and a sign
    of Him that was to be crucified was made, both in the matter of the serpents which
    bit you, as I already mentioned (God anticipating before the proper times these
    mysteries, in order to confer grace upon you, to whom you are always convicted
    of being thankless), as well as in the type of the extending of the hands of Moses,
    and of Oshea being named Jesus (Joshua); when you fought against Amalek: concerning
    which God enjoined that the incident be recorded, and the name of Jesus laid up
    in your understandings; saying that this is He who would blot out the memorial
    of Amalek from under heaven. Now it is clear that the memorial of Amalek remained
    after the son of Nave (Nun): but He makes it manifest through Jesus, who was crucified,
    of whom also those symbols were fore-announcements of all that would happen to
    Him, the demons would be destroyed, and would dread His name, and that all principalities
    and kingdoms would fear Him; and that they who believe in Him out of all nations
    would be shown as God-fearing and peaceful men; and the facts already quoted by
    me, Trypho, indicate this. Again, when you desired flesh, so vast a quantity of
    quails was given you, that they could not be told; for whom also water gushed
    from the rock; and a cloud followed you for a shade from heat, and covering from
    cold, declaring the manner and signification of another and new heaven; the latchets
    of your shoes did not break, and your shoes waxed not old, and your garments wore
    not away, but even those of the children grew along with them. 132 "Yet after
    this you made a calf, and were very zealous in committing fornication with the
    daughters of strangers, and in serving idols. And again, when the land was given
    up to you with so great a display of power, that you witnessed the sun stand still
    in the heavens by the order of that man whose name was Jesus (Joshua), and not
    go down for thirty-six hours, as well as all the other miracles which were wrought
    for you as time served; and of these it seems good to me now to speak of another,
    for it conduces to your hereby knowing Jesus, whom we also know to have been Christ
    the Son of God, who was crucified, and rose again, and ascended to heaven, and
    will come again to judge all men, even up to Adam himself. You are aware, then,"
    I continued, "that when the ark of the testimony was seized by the enemies of
    Ashdod, and a terrible and incurable malady had broken out among them, they resolved
    to place it on a cart to which they yoked cows that had recently calved, for the
    purpose of ascertaining by trial whether or not they had been plagued by God''s
    power on account of the ark, and if God wished it to be taken back to the place
    from which it had been carried away. And when they had done this, the cows, led
    by no man, went not to the place whence the ark had been taken, but to the fields
    of a certain man whose name was Oshea, the same as his whose name was altered
    to Jesus (Joshua), as has been previously mentioned, who also led the people into
    the land and meted it out to them: and when the cows had come into these fields
    they remained there, showing to you thereby that they were guided by the name
    of power; just as formerly the people who survived of those that came out of Egypt,
    were guided into the land by him who had received the name Jesus (Joshua), who
    before was called Oshea. 133 "Now, although these and all other such unexpected
    and marvellous works were wrought amongst and seen by you at different times,
    yet you are convicted by the prophets of having gone to such a length as offering
    your own children to demons; and besides all this, of having dared to do such
    things against Christ; and you still dare to do them: for all which may it be
    granted to you to obtain mercy and salvation from God and His Christ. For God,
    knowing before that you would do such things, pronounced this curse upon you by
    the prophet Isaiah: ''Woe unto their soul! they have devised evil counsel against
    themselves, saying, Let us bind the righteous man, for he is distasteful to us.
    Therefore they shall eat the fruit of their own doings. Woe to the wicked! evil,
    according to the works of his hands, shall befall him. O my people, your exactors
    glean you, and those who extort from you shall rule over you. O my people, they
    who call you blessed cause you to err, and disorder the way of your paths. But
    now the Lord shall sist His people to judgment, and He shall enter into judgment
    with the elders of the people and the princes thereof. But why have you burnt
    up my vineyard? and why is the spoil of the poor found in your houses? Why do
    you wrong my people, and put to shame the countenance of the humble?'' Again,
    in other words, the same prophet spake to the same effect: ''Woe unto them that
    draw their iniquity as with a long cord, and their transgressions as with the
    harness of an heifer''s yoke: who say, Let His speed come near, and let the counsel
    of the Holy One of Israel come, that we may know it. Woe unto them that call evil
    good, and good evil! that put light for darkness, and darkness for light! that
    put bitter for sweet, and sweet for bitter! Woe unto them that are wise in their
    own eyes, and prudent in their own sight! Woe unto those that are mighty among
    you, who drink wine, who are men of strength, who mingle strong drink! who justify
    the wicked for a reward, and take away justice from the righteous! Therefore,
    as the stubble shall be burnt by the coal of fire, and utterly consumed by the
    burning flame, their root shall be as wool, and their flower shall go up like
    dust. For they would not have the law of the Lord of Sabaoth, but despised the
    word of the Lord, the Holy One of Israel. And the Lord of Sabaoth was very angry,
    and laid His hands upon them, and smote them; and He was provoked against the
    mountains, and their carcases were in the midst like dung on the road. And for
    all this they have not repented, but their hand is still high.'' For verily your
    hand is high to commit evil, because ye slew the Christ, and do not repent of
    it; but so far from that, ye hate and murder us who have believed through Him
    in the God and Father of all, as often as ye can; and ye curse Him without ceasing,
    as well as those who side with Him; while all of us pray for you, and for all
    men, as our Christ and Lord taught us to do, when He enjoined us to pray even
    for our enemies, and to love them that hate us, and to bless them that curse us.
    134 "If, then, the teaching of the prophets and of Himself moves you, it is better
    for you to follow God than your imprudent and blind masters, who even till this
    time permit each man to have four or five wives; and if any one see a beautiful
    woman and desire to have her, they quote the doings of Jacob [called] Israel,
    and of the other patriarchs, and maintain that it is not wrong to do such things;
    for they are miserably ignorant in this matter. For, as I before said, certain
    dispensations of weighty mysteries were accomplished in each act of this sort.
    For in the marriages of Jacob I shall mention what dispensation and prophecy were
    accomplished, in order that you may thereby know that your teachers never looked
    at the divine motive which prompted each act, but only at the grovelling and corrupting
    passions. Attend therefore to what I say. The marriages of Jacob were types of
    that which Christ was about to accomplish. For it was not lawful for Jacob to
    marry two sisters at once. And he serves Laban for [one of] the daughters; and
    being deceived in [the obtaining of] the younger, he again served seven years.
    Now Leah is your people and synagogue; but Rachel is our Church. And for these,
    and for the servants in both, Christ even now serves. For while Noah gave to the
    two sons the seed of the third as servants, now on the other hand Christ has come
    to restore both the free sons and the servants amongst them, conferring the same
    honour on all of them who keep His commandments; even as the children of the free
    women and the children of the bond women born to Jacob were all sons, and equal
    in dignity. And it was foretold what each should be according to rank and according
    to fore-knowledge. Jacob served Laban for speckled and many-spotted sheep; and
    Christ served, even to the slavery of the cross, for the various and many-formed
    races of mankind, acquiring them by the blood and mystery of the cross. Leah was
    weak-eyed; for the eyes of your souls are excessively weak. Rachel stole the gods
    of Laban, and has hid them to this day; and we have lost our paternal and material
    gods. Jacob was hated for all time by his brother; and we now, and our Lord Himself,
    are hated by you and by all men, though we are brothers by nature. Jacob was called
    Israel; and Israel has been demonstrated to be the Christ, who is, and is called,
    Jesus. 135 "And when Scripture says, ''I am the Lord God, the Holy One of Israel,
    who have made known Israel your King,'' will you not understand that truly Christ
    is the everlasting King? For you are aware that Jacob the son of Isaac was never
    a king. And therefore Scripture again, explaining to us, says what king is meant
    by Jacob and Israel: ''Jacob is my Servant, I will uphold Him; and Israel is mine
    Elect, my soul shall receive Him. I have given Him my Spirit; and He shall bring
    forth judgment to the Gentiles. He shall not cry, and His voice shall not be heard
    without. The bruised reed He shall not break, and the smoking flax He shall not
    quench, until He shall bring forth judgment to victory. He shall shine, and shall
    not be broken, until He set judgment on the earth. And in His name shall the Gentiles
    trust.'' Then is it Jacob the patriarch in whom the Gentiles and yourselves shall
    trust? or is it not Christ? As, therefore, Christ is the Israel and the Jacob,
    even so we, who have been quarried out from the bowels of Christ, are the true
    Israelitic race. But let us attend rather to the very word: ''And I will bring
    forth,'' He says, ''the seed out of Jacob, and out of Judah: and it shall inherit
    My holy mountain; and Mine Elect and My servants shall possess the inheritance,
    and shall dwell there; and there shall be folds of flocks in the thicket, and
    the valley of Achor shall be a resting-place of cattle for the people who have
    sought Me. But as for you, who forsake Me, and forget My holy mountain, and prepare
    a table for demons, and fill out drink for the demon, I shall give you to the
    sword. You shall all fall with a slaughter; for I called you, and you hearkened
    not, and did evil before me, and did choose that wherein I delighted not.'' Such
    are the words of Scripture; understand, therefore, that the seed of Jacob now
    referred to is something else, and not, as may be supposed, spoken of your people.
    For it is not possible for the seed of Jacob to leave an entrance for the descendants
    of Jacob, or for [God] to have accepted the very same persons whom He had reproached
    with unfitness for the inheritance, and promise it to them again; but as there
    the prophet says, ''And now, O house of Jacob, come and let us walk in the light
    of the Lord; for He has sent away His people, the house of Jacob, because their
    land was full, as at the first, of soothsayers and divinations;'' even so it is
    necessary for us here to observe that there are two seeds of Judah, and two races,
    as there are two houses of Jacob: the one begotten by blood and flesh, the other
    by faith and the Spirit. 136 "For you see how He now addresses the people, saying
    a little before: ''As the gape shah be found in the cluster, and they will say,
    Destroy it not, for a blessing is in it; so will I do for My servant''s sake:
    for His sake I will not destroy them all.'' And thereafter He adds: ''And I shall
    bring forth the seed out of Jacob, and out of Judah.'' It is plain then that if
    He thus be angry with them, and threaten to leave very few of them, He promises
    to bring forth certain others, who shall dwell in His mountain. But these are
    the persons whom He said He would sow and beget. For you neither suffer Him when
    He calls you, nor hear Him when He speaks to you, but have done evil in the presence
    of the Lord. But the highest pitch of your wickedness lies in this, that you hate
    the Righteous One, and slew Him; and so treat those who have received from Him
    all that they are and have, and who are pious, righteous, and humane. Therefore
    ''woe unto their soul,'' says'' the Lord, ''for they have devised an evil counsel
    against themselves, saying, Let us take away the righteous, for he is distasteful
    to us.'' For indeed you are not in the habit of sacrificing to Baal, as were your
    fathers, or of placing cakes in groves and on high places for the host of heaven:
    but you have not accepted God''s Christ. For he who knows not Him, knows not the
    will of God; and he who insults and hates Him, insults and hates Him that sent
    Him. And whoever believes not in Him, believes not the declarations of the prophets,
    who preached and proclaimed Him to all. 137 "Say no evil thing, my brothers, against
    Him that was crucified, and treat not scornfully the stripes wherewith all may
    be healed, even as we are healed. For it will be well if, persuaded by the Scriptures,
    you are circumcised from hard-heartedness: not that circumcision which you have
    from the tenets that are put into you; for that was given for a sign, and not
    for a work of righteousness, as the Scriptures compel you [to admit]. Assent,
    therefore, and pour no ridicule on the Son of God; obey not the Pharisaic teachers,
    and scoff not at the King of Israel, as the rulers of your synagogues teach you
    to do after your prayers: for if he that touches those who are not pleasing to
    God, is as one that touches the apple of God''s eye, how much more so is he that
    touches His beloved! And that this is He, has been sufficiently demonstrated."
    And as they kept silence, I continued: "My friends, I now refer to the Scriptures
    as the Seventy have interpreted them; for when I quoted them formerly as you possess
    them, I made proof of you [to ascertain] how you were disposed. For, mentioning
    the Scripture which says, ''Woe unto them! for they have devised evil counsel
    against themselves, saying (as the Seventy have translated, I continued): ''Let
    us take away the righteous, for he is distasteful to us;'' whereas at the commencement
    of the discussion I added what your version has: ''Let us bind the righteous,
    for he is distaste fill to us.'' But you had been busy about some other matter,
    and seem to have listened to the words without attending to them. But now, since
    the day is drawing to a close, for the sun is about to set, I shall add one remark
    to what I have said, and conclude. I have indeed made the very same remark already,
    but I think it would be right to bestow some consideration on it again. 138 "You
    know, then, sirs," I said, "that God has said in Isaiah to Jerusalem: ''I saved
    thee in the deluge of Noah.'' By this which God said was meant that the mystery
    of saved men appeared in the deluge. For righteous Noah, along with the other
    mortals at the deluge, i.e., with his own wife, his three sons and their wives,
    being eight in number, were a symbol of the eighth day, wherein Christ appeared
    when He rose from the dead, for ever the first in power. For Christ, being the
    first-born of every creature, became again the chief of another race regenerated
    by Himself through water, and faith, and wood, containing the mystery of the cross;
    even as Noah was saved by wood when he rode over the waters with his household.
    Accordingly, when the prophet says, ''I saved thee in the times of Noah,'' as
    I have already remarked, he addresses the people who are equally faithful to God,
    and possess the same signs. For when Moses had the rod in his hands, he led your
    nation through the sea. And you believe that this was spoken to your nation only,
    or to the land. But the whole earth, as the Scripture says, was inundated, and
    the water rose in height fifteen cubits above all the mountains: so that it is
    evident this was not spoken to the land, but to the people who obeyed Him: for
    whom also He had before prepared a resting-place in Jerusalem, as was previously
    demonstrated by all the symbols of the deluge; I mean, that by water, faith, and
    wood, those who are afore-prepared, and who repent of the sins which they have
    committed, shall escape from the impending judgment of God. 139 "For another mystery
    was accomplished and predicted in the days of Noah, of which you are not aware.
    It is this: in the blessings wherewith Noah blessed his two sons, and in the curse
    pronounced on his son''s son. For the Spirit of prophecy would not curse the son
    that had been by God blessed along with [his brothers]. But since the punishment
    of the sin would cleave to the whole descent of the son that mocked at his father''s
    nakedness, he made the curse originate with his son. Now, in what he said, he
    foretold that the descendants of Shem would keep in retention the property and
    dwellings of Canaan: and again that the descendants of Japheth would take possession
    of the property of which Shem''s descendants had dispossessed Canaan''s descendants;
    and spoil the descendants of Shem, even as they plundered the sons of Canaan.
    And listen to the way in which it has so come to pass. For you, who have derived
    your lineage from Shem, invaded the territory of the sons of Canaan by the will
    of God; and you possessed it. And it is manifest that the sons of Japheth, having
    invaded you in turn by the judgment of God, have taken your land from you, and
    have possessed it. Thus it is written: ''And Noah awoke from the wine, and knew
    what his younger son had done unto him; and he said, Cursed be Canaan, the servant;
    a servant shall he be unto his brethren. And he said, Blessed be the Lord God
    of Shem; and Canaan shall be his servant. May the Lord enlarge Japheth, and let
    him dwell in the houses of Shem; and let Canaan be his servant.'' Accordingly,
    as two peoples were blessed,--those from Shem, and those from Japheth,--and as
    the offspring of Shem were decreed first to possess the dwellings of Canaan, and
    the offspring of Japheth were predicted as in turn receiving the same possessions,
    and to the two peoples there was the one people of Canaan handed over for servants;
    so Christ has come according to the power given Him from the Almighty Father,
    and summoning men to friendship, and blessing, and repentance, and dwelling together,
    has promised, as has already been proved, that there shall be a future possession
    for all the saints in this same land. And hence all men everywhere, whether bond
    or free, who believe in Christ, and recognise the truth in His own words and those
    of His prophets, know that they shall be with Him in that land, and inherit everlasting
    and incorruptible good. 140 "Hence also Jacob, as I remarked before, being himself
    a type of Christ, had married the two handmaids of his two free wives, and of
    them begat sons, for the purpose of indicating beforehand that Christ would receive
    even all those who amongst Japheth''s race are descendants of Canaan, equally
    with the free, and would have the children fellow-heirs. And we are such; but
    you cannot comprehend this, because you cannot drink of the living fountain of
    God, but of broken cisterns which can hold no water, as the Scripture says. But
    they are cisterns broken, and holding no water, which your own teachers have digged,
    as the Scripture also expressly asserts, ''teaching for doctrines the commandments
    of men.'' And besides, they beguile themselves and you, supposing that the everlasting
    kingdom will be assuredly given to those of the dispersion who are of Abraham
    after the flesh, although they be sinners, and faithless, and disobedient towards
    God, which the Scriptures have proved is not the case. For if so, Isaiah would
    never have said this: ''And unless the Lord of Sabaoth had left us a seed, we
    would have been like Sodom and Gomorrah.'' And Ezekiel: ''Even if Noah, and Jacob,
    and Daniel were to pray for sons or daughters, their request should not be granted.''
    But neither shall the father perish for the son, nor the son for the father; but
    every one for his own sin, and each shall be saved for his own righteousness.
    And again Isaiah says: ''They shall look on the car; cases of them that have transgressed:
    their worm shall not cease, and their fire shall not be quenched; and they shall
    be a spectacle to all flesh.'' And our Lord, according to the will of Him that
    sent Him, who is the Father and Lord of all, would not have said, ''They shall
    come from the east, and from the west, and shall sit down with Abraham, and Isaac,
    and Jacob in the kingdom of heaven. But the children of the kingdom shall be cast
    out into outer darkness.'' Furthermore, I have proved in what has preceded," that
    those who were foreknown to be unrighteous, whether men or angels, are not made
    wicked by God''s fault, but each man by his own fault is what he will appear to
    be. 141 "But that you may not have a pretext for saying that Christ must have
    been crucified, and that those who transgressed must have been among your nation,
    and that the matter could not have been otherwise, I said briefly by anticipation,
    that God, wishing men and angels to follow His will, resolved to create them free
    to do righteousness; possessing reason, that they may know by whom they are created,
    and through whom they, not existing formerly, do now exist; and with a law that
    they should be judged by Him, if they do anything contrary to right reason: and
    of ourselves we, men and angels, shall be convicted of having acted sinfully,
    unless we repent beforehand. But if the word of God foretells that some angels
    and men shall be certainly punished, it did so because it foreknew that they would
    be unchangeably [wicked], but not because God had created them so. So that if
    they repent, all who wish for it can obtain mercy from God: and the Scripture
    foretells that they shall be blessed, saying, ''Blessed is the man to whom the
    Lord imputeth not sin;'' that is, having repented of his sins, that he may receive
    remission of them from God; and not as you deceive yourselves, and some others
    who resemble you in this, who say, that even though they be sinners, but know
    God, the Lord will not impute sin to them. We have as proof of this the one fall
    of David, which happened through his boasting, which was forgiven then when he
    so mourned and wept, as it is written. But if even to such a man no remission
    was granted before repentance, and only when this great king, and anointed one,
    and prophet, mourned and conducted himself so, how can the impure and utterly
    abandoned, if they weep not, and mourn not, and repent not, entertain the hope
    that the Lord will not impute to them sin? And this one fall of David, in the
    matter of Uriah''s wife, proves, sirs," I said, "that the patriarchs had many
    wives, not to commit fornication, but that a certain dispensation and all mysteries
    might be accomplished by them; since, if it were allowable to take any wife, or
    as many wives as one chooses, and how he chooses, which the men of your nation
    do over all the earth, wherever they sojourn, or wherever they have been sent,
    taking women under the name of marriage, much more would David have been permitted
    to do this." When I had said this, dearest Marcus Pompeius, I came to an end.
    142 Then Trypho, after a little delay, said, "You see that it was not intentionally
    that we came to discuss these points. And I confess that I have been particularly
    pleased with the conference; and I think that these are of quite the same opinion
    as myself. For we have found more than we expected, and more than it was possible
    to have expected. And if we could do this more frequently, we should be much helped
    in the searching of the Scriptures themselves. But since," he said, "you are on
    the eve of departure, and expect daily to set sail, do not hesitate to remember
    us as friends when you are gone." "For my part," I replied, "if I had remained,
    I would have wished to do the same thing daily. But now, since I expect, with
    God''s will and aid, to set sail, I exhort you to give all diligence in this very
    great struggle for your own salvation, and to be earnest in setting a higher value
    on the Christ of the Almighty God than on your own teachers." After this they
    left me, wishing me safety in my voyage, and from every misfortune. And I, praying
    for them, said, "I can wish no better thing for you, sirs, than this, that, recognising
    in this way that intelligence is given to every man, you may be of the same opinion
    as ourselves, and believe that Jesus is the Christ of God."… We have perceived,
    moreover, that the expression, ''The day of the Lord is as a thousand years,''
    leads to the same. And further, there was a certain man with us, whose name was
    John, one of the apostles of Christ, who prophesied, by a revelation that was
    made to him, that those who believed in our Christ would dwell a thousand years
    in Jerusalem; and that thereafter the general, and, in short, the eternal resurrection
    and judgment of all men would likewise take place. Just as our Lord also said,
    ''They shall neither marry nor be given in marriage, but shall be equal to the
    angels, the children of the God of the resurrection.'' 82 "For the prophetical
    gifts remain with us, even to the present time. And hence you ought to understand
    that[the gifts] formerly among your nation have been transferred to us. And just
    as there were false prophets contemporaneous with your holy prophets, so are there
    now many false teachers amongst us, of whom our Lord forewarned us to beware;
    so that in no respect are we deficient, since we know that He foreknew all that
    would happen to us after His resurrection from the dead and ascension to heaven.
    For He said we would be put to death, and hated for His name''s sake; and that
    many false prophets and false Christs would appear in His name, and deceive many:
    and so has it come about. For many have taught godless, blasphemous, and unholy
    doctrines, forging them in His name; have taught, too, and even yet are teaching,
    those things which proceed from the unclean spirit of the devil, and which were
    put into their hearts. Therefore we are most anxious that you be persuaded not
    to be misled by such persons, since we know that every one who can speak the truth,
    and yet speaks it not, shall be judged by God, as God testified by Ezekiel, when
    He said, ''I have made thee a watchman to the house of Judah. If the sinner sin,
    and thou warn him not, he himself shall die in his sin; but his blood will I require
    at thine hand. But if thou warn him, thou shalt be innocent.'' And on this account
    we are, through fear, very earnest in desiring to converse[with men] according
    to the Scriptures, but not from love of money, or of glory, or of pleasure. For
    no man can convict us of any of these[vices]. No more do we wish to live like
    the rulers of your people, whom God reproaches when He says, ''Your rulers are
    companions of thieves, lovers of bribes, followers of the rewards.'' Now, if you
    know certain amongst us to be of this sort, do not for their sakes blaspheme the
    Scriptures and Christ, and do not assiduously strive to give falsified interpretations.
    83 "For your teachers have ventured to refer the passage, ''The Lord says to my
    Lord, Sit at my right hand, till I make Thine enemies Thy footstool,'' to Hezekiah;
    as if he were requested to sit on the right side of the temple, when the king
    of Assyria sent to him and threatened him; and he was told by Isaiah not to be
    afraid. Now we know and admit that what Isaiah said took place; that the king
    of Assyria desisted from waging war against Jerusalem in Hezekiah''s days, and
    the angel of the Lord slew about 185,000 of the host of the Assyrians. But it
    is manifest that the Psalm does not refer to him. For thus it is written, ''The
    Lord says to my Lord, Sit at My right hand, till I make Thine enemies Thy footstool.
    He shall send forth a rod of power over Jerusalem, and it shall rule in the midst
    of Thine enemies. In the splendour of the saints before the morning star have
    I begotten Thee. The Lord hath sworn, and will not repent, Thou art a priest for
    ever after the order of Melchizedek.'' Who does not admit, then, that Hezekiah
    is no priest for ever after the order of Melchizedek? And who does not know that
    he is not the redeemer of Jerusalem? And who does not know that he neither sent
    a rod of power into Jerusalem, nor ruled in the midst of his enemies; but that
    it was God who averted from him the enemies, after he mourned and was afflicted?
    But our Jesus, who has not yet come in glory, has sent into Jerusalem a rod of
    power, namely, the word of calling and repentance[meant] for all nations over
    which demons held sway, as David says, ''The gods of the nations are demons.''
    And His strong word has prevailed on many to forsake the demons whom they used
    to serve, and by means of it to believe in the Almighty God because the gods of
    the nations are demons. And we mentioned formerly that the statement, ''In the
    splendour of the saints before the morning star have I begotten Thee from the
    womb,'' is made to Christ. 84 "Moreover, the prophecy, ''Behold, the virgin shall
    conceive, and bear a son,'' was uttered respecting Him. For if He to whom Isaiah
    referred was not to be begotten of a virgin, of whom did the Holy Spirit declare,
    ''Behold, the Lord Himself shall give us a sign: behold, the virgin shall conceive,
    and bear a son?'' For if He also were to be begotten of sexual intercourse, like
    all other first-born sons, why did God say that He would give a sign which is
    not common to all the first-born sons? But that which is truly a sign, and which
    was to be made trustworthy to mankind,--namely, that the first-begotten of all
    creation should become incarnate by the Virgin''s womb, and be a child,--this
    he anticipated by the Spirit of prophecy, and predicted it, as I have repeated
    to you, in various ways; in order that, when the event should take place, it might
    be known as the operation of the power and will of the Maker of all things; just
    as Eve was made from one of Adam''s ribs, and as all living beings were created
    in the beginning by the word of God. But you in these matters venture to pervert
    the expositions which your elders that were with Ptolemy king of Egypt gave forth,
    since you assert that the Scripture is not so as they have expounded it, but says,
    ''Behold, the young woman shall conceive,'' as if great events were to be inferred
    if a woman should beget from sexual intercourse: which indeed all young women,
    with the exception of the barren, do; but even these, God, if He wills, is able
    to cause[to bear]. For Samuel''s mother, who was barren, brought forth by l the
    will of God; and so also the wife of the holy patriarch Abraham; and Elisabeth,
    who bore John the Baptist, and other such. So that you must not suppose that it
    is impossible for God to do anything He wills. And especially when it was predicted
    that this would take place, do not venture to pervert or misinterpret the prophecies,
    since you will injure yourselves alone, and will not harm God. 85 "Moreover, some
    of you venture to expound the prophecy which runs, ''Lift up your gates, ye rulers;
    and be ye lift up, ye everlasting doors, that the King of glory may enter,'' as
    if it referred likewise to Hezekiah, and others of you[expound it] of Solomon;
    but neither to the latter nor to the former, nor, in short, to any of your kings,
    can it be proved to have reference, but to this our Christ alone, who appeared
    without comeliness, and inglorious, as Isaiah and David and all the Scriptures
    said; who is the Lord of hosts, by the will of the Father who conferred on Him[the
    dignity]; who also rose from the dead, and ascended to heaven, as the Psalm and
    the other Scriptures manifested when they announced Him to be Lord of hosts; and
    of this you may, if you will, easily be persuaded by the occurrences which take
    place before your eyes. For every demon, when exorcised in the name of this very
    Son of God--who is the First-born of every creature, who became man by the Virgin,
    who suffered, and was crucified under Pontius Pilate by your nation, who died,
    who rose from the dead, and ascended into heaven--is overcome and subdued. But
    though you exorcise any demon in the name of any of those who were amongst you--either
    kings, or righteous men, or prophets, or patriarchs--it will not be subject to
    you. But if any of you exorcise it in[the name of] the God of Abraham, and the
    God of Isaac, and the God of Jacob, it will perhaps be subject to you. Now assuredly
    your exorcists, I have said, make use of craft when they exorcise, even as the
    Gentiles do, and employ fumigations and incantations. But that they are angels
    and powers whom the word of prophecy by David[commands] to lift up the gates,
    that He who rose from the dead, Jesus Christ, the Lord of hosts, according to
    the will of the Father, might enter, the word of David has likewise showed; which
    I shall again recall to your attention for the sake of those who were not with
    us yesterday, for whose benefit, moreover, I sum up many things I said yesterday.
    And now, if I say this to you, although I have repeated it many times, I know
    that it is not absurd so to do. For it is a ridiculous thing to see the sun, and
    the moon, and the other stars, continually keeping the same course, and bringing
    round the different seasons; and to see the computer who may be asked how many
    are twice two, because he has frequently said that they are four, not ceasing
    to say again that they late four; and equally so other things, which are confidently
    admitted, to be continually mentioned and admitted in like manner; yet that he
    who founds his discourse on the prophetic Scriptures should leave them and abstain
    from constantly referring to the same Scriptures, because it is thought he can
    bring forth something better than Scripture. The passage, then, by which I proved
    that God reveals that there are both angels and hosts in heaven is this: ''Praise
    the Lord from the heavens: praise Him in the highest. Praise Him, all His angels:
    praise Him, all His hosts.'' " Then one of those who had come with them on the
    second day, whose name was Mnaseas, said, "We are greatly pleased that you undertake
    to repeat the same things on our account." And I said, "Listen, my friends, to
    the Scripture which induces me to act thus. Jesus commanded to love even[our]
    enemies, as was predicted by Isaiah in many passages, in which also is contained
    the mystery of our own regeneration, as well, in fact, as the regeneration of
    all who expect that Christ will appear in Jerusalem, and by their works endeavour
    earnestly to please Him. These are the words spoken by Isaiah: ''Hear the word
    of the Lord, ye that tremble at His word. Say, our brethren, to them that hate
    you and detest you, that the name of the Lord has been glorified. He has appeared
    to your joy, and they shall be ashamed. A voice of noise from the city, a voice
    from the temple, a voice of the Lord who rendereth recompense to the proud. Before
    she that travailed brought forth, and before the pains of labour came, she brought
    forth a male child. Who hath heard such a thing? and who hath seen such a thing?
    has the earth brought forth in one day? and has she produced a nation at once?
    for Zion has travailed and borne her children. But I haye given such an expectation
    even to her that does not bring forth, said the Lord. Behold, I have made her
    that begetteth, and her that is barren, saith the Lord. Rejoice, O Jerusalem,
    and hold a joyous assembly, all ye that love her. Be glad, all ye that mourn for
    her, that ye may suck and be filled with the breast of her consolation, that having
    suck ye may be delighted with the entrance of His glory.'' " 86 And when I had
    quoted this, I added, "Hear, then, how this Man, of whom the Scriptures declare
    that He will come again in glory after His crucifixion, was symbolized both by
    the tree of life, which was said to have been planted in paradise, and by those
    events which should happen to all the just. Moses was sent with a rod to effect
    the redemption of the people; and with this in his hands at the head of the people,
    he divided the sea. By this he saw the water gushing out of the rock; and when
    he cast a tree into the waters of Marah, which were bitter, he made them sweet.
    Jacob, by putting rods into the water-troughs, caused the sheep of his uncle to
    conceive, so that he should obtain their young. With his rod the same Jacob boasts
    that he had crossed the river. He said he had seen a ladder, and the Scripture
    has declared that God stood above it. But that this was not the Father, we have
    proved from the Scriptures. And Jacob, having poured oil on a stone in the same
    place, is testified to by the very God who appeared to him, that he had anointed
    a pillar to the God who appeared to him. And that the stone symbolically proclaimed
    Christ, we have also proved by many Scriptures; and that the unguent, whether
    it was of oil, or of stacte, or of any other compounded sweet balsams, had reference
    to Him, we have also proved, inasmuch as the word says: ''Therefore God, even
    Thy God, hath anointed Thee with the oil of gladness above Thy fellows.'' For
    indeed all kings and anointed persons obtained from Him their share in the names
    of kings and anointed: just as He Himself received from the Father the titles
    of King, and Christ, and Priest, and Angel, and such like other titles which He
    bears or did bear. Aaron''s rod, which blossomed, declared him to be the high
    priest. Isaiah prophesied that a rod would come forth from the root of Jesse,[and
    this was] Christ. And David says that the righteous man is ''like the tree that
    is planted by the channels of waters, which should yield its fruit in its season,
    and whose leaf should not fade.'' Again, the righteous is said to flourish like
    the palm-tree. God appeared from a tree to Abraham, as it is written, near the
    oak in Mature. The people found seventy willows and twelve springs after crossing
    the Jordan. David affirms that God comforted him with a rod and staff. Elisha,
    by casting a stick into the river Jordan, recovered the iron part of the axe with
    which the sons of the prophets had gone to cut down trees to build the house in
    which they wished to read and study the law and commandments of God; even as our
    Christ, by being crucified on the tree, and by purifying with water, has redeemed
    us, though plunged in the direst offences which we have committed, and has made
    a house of prayer and adoration. Moreover, it was a rod that pointed out Judah
    to be the father of Tamar''s sons by a great mystery." 87 Hereupon Trypho, after
    I had spoken these words, said, "Do not now suppose that I am endeavouring, by
    asking what I do ask, to overturn the statements you have made; but I wish to
    receive information respecting those very points about which I now inquire. Tell
    me, then, how, when the Scripture asserts by Isaiah, ''There shall come forth
    a rod from the root of Jesse; and a flower shall grow up from the root of Jesse;
    and the Spirit of God shall rest upon Him, the spirit of wisdom and understanding,
    the spirit of counsel and might, the spirit of knowledge and piety: and the spirit
    of the fear of the Lord shall fill Him:'' (now you admitted to me," continued
    he, "that this referred to Christ, and you maintain Him to be pre-existent God,
    and having become incarnate by God''s will, to be born man by the Virgin:) how
    He can be demonstrated to have been pre-existent, who is filled with the powers
    of the Holy Ghost, which the Scripture by Isaiah enumerates, as if He were in
    lack of them?" Then I replied, "You have inquired most discreetly and most prudently,
    for truly there does seem to be a difficulty; but listen to what I say, that you
    may perceive the reason of this also. The Scripture says that these enumerated
    powers of the Spirit have come on Him, not because He stood in need of them, but
    because they would rest in Him, i.e., would find their accomplishment in Him,
    so that there would be no more prophets in your nation after the ancient custom:
    and this fact you plainly perceive. For after Him no prophet has arisen among
    you. Now, that [you may know that] your prophets, each receiving some one or two
    powers from God, did and spoke the things which we have learned from the Scriptures,
    attend to the following remarks of mine. Solomon possessed the spirit of wisdom,
    Daniel that of understanding and counsel, Moses that of might and piety, Elijah
    that of fear, and Isaiah that of knowledge; and so with the others: each possessed
    one power, or one joined alternately with another; also Jeremiah, and the twelve
    [prophets], and David, and, in short, the rest who existed amongst you. Accordingly
    He rested, i.e., ceased, when He came, after whom, in the times of this dispensation
    wrought out by Him amongst men, it was requisite that such gifts should cease
    from you; and having received their rest in Him, should again, as had been predicted,
    become gifts which, from the grace of His Spirit''s power, He imparts to those
    who believe in Him, according as He deems each man worthy thereof. I have already
    said, and do again say, that it had been prophesied that this would be done by
    Him after His ascension to heaven. It is accordingly said, ''He ascended on high,
    He led captivity captive, He gave gifts unto the sons of men.'' And again, in
    another prophecy it is said: ''And it shall come to pass after this, I will pour
    out My Spirit on all flesh, and on My servants, and on My handmaids, and they
    shall prophesy.'' 88 "Now, it is possible to see amongst us women and men who
    possess gifts of the Spirit of God; so that it was prophesied that the powers
    enumerated by Isaiah would come upon Him, not because He needed power, but because
    these would not continue after Him. And let this be a proof to you, namely, what
    I told you was done by the Magi from Arabia, who as soon as the Child was born
    came to worship Him, for even at His birth He was in possession of His power;
    and as He grew up like all other men, by using the fitting means, He assigned
    its own [requirements] to each development, and was sustained by all kinds of
    nourishment, and waited for thirty years, more or less, until John appeared before
    Him as the herald of His approach, and preceded Him in the way of baptism, as
    I have already shown. And then, when Jesus had gone to the river Jordan, where
    John was baptizing, and when He had stepped into the water, a fire was kindled
    in the Jordan; and when He came out of the water, the Holy Ghost lighted on Him
    like a dove, the apostles of this very Christ of ours wrote. Now, we know that
    he did not go to the river because He stood in need of baptism, or of the descent
    of the Spirit like a dove; even as He submitted to be born and to be crucified,
    not because He needed such things, but because of the human race, which from Adam
    had fallen under the power of death and the guile of the serpent, and each one
    of which had committed personal transgression. For God, wishing both angels and
    men, who were endowed with freewill, and at their own disposal, to do whatever
    He had strengthened each to do, made them so, that if they chose the things acceptable
    to Himself, He would keep them free from death and from punishment; but that if
    they did evil, He would punish each as He sees fit. For it was not His entrance
    into Jerusalem sitting on an ass, which we have showed was prophesied, that empowered
    Him to be Christ, but it furnished men with a proof that He is the Christ; just
    as it was necessary in the time of John that men have proof, that they might know
    who is Christ. For when John remained by the Jordan, and preached the baptism
    of repentance, wearing only a leathern girdle and a vesture made of camels'' hair,
    eating nothing but locusts and wild honey, men supposed him to be Christ; but
    he cried to them, ''I am not the Christ, but the voice of one crying; for He that
    is stronger than I shall come, whose shoes I am not worthy to bear.'' And when
    Jesus came to the Jordan, He was considered to be the son of Joseph the carpenter;
    and He appeared without comeliness, as the Scriptures declared; and He was deemed
    a carpenter (for He was in the habit of working as a carpenter when among men,
    making ploughs and yokes; by which He taught the symbols of righteousness and
    an active life); but then the Holy Ghost, and for man''s sake, as I formerly stated,
    lighted on Him in the form of a dove, and there came at the same instant from
    the heavens a voice, which was uttered also by David when he spoke, personating
    Christ, what the Father would say to Him: ''Thou art My Son: this day have I begotten
    Thee;'' [the Father] saying that His generation would take place for men, at the
    time when they would become acquainted with Him: ''Thou art My Son; this day have
    I begotten thee.'' " 89 Then Trypho remarked, "Be assured that all our nation
    waits for Christ; and we admit that all the Scriptures which you have quoted refer
    to Him. Moreover, I do also admit that the name of Jesus, by which the the son
    of Nave (Nun) was called, has inclined me very strongly to adopt this view. But
    whether Christ should be so shamefully crucified, this we are in doubt about.
    For whosoever is crucified is said in the law to be accursed, so that I am exceedingly
    incredulous on this point. It is quite clear, indeed, that the Scriptures announce
    that Christ had to suffer; but we wish to learn if you can prove it to us whether
    it was by the suffering cursed in the law." I replied to him, "If Christ was not
    to suffer, and the prophets had not foretold that He would be led to death on
    account of the sins of the people, and be dishonoured and scourged, and reckoned
    among the transgressors, and as a sheep be led to the slaughter, whose generation,
    the prophet says, no man can declare, then you would have good cause to wonder.
    But if these are to be characteristic of Him and mark Him out to all, how is it
    possible for us to do anything else than believe in Him most confidently? And
    will not as many as have understood the writings of the prophets, whenever they
    hear merely that He was crucified, say that this is He and no other?" 90 "Bring
    us on, then," said [Trypho], "by the Scriptures, that we may also be persuaded
    by you; for we know that He should suffer and be led as a sheep. But prove to
    us whether He must be crucified and die so disgracefully and so dishonourably
    by the death cursed in the law. For we cannot bring ourselves even to think of
    this." "You know," said I, "that what the prophets said and did they veiled by
    parables and types, as you admitted to us; so that it was not easy for all to
    understand the most [of what they said], since they concealed the truth by these
    means, that those who are eager to find out and learn it might do so with much
    labour." They answered, "We admitted this." "Listen, therefore," say I, "to what
    follows; for Moses first exhibited this seeming curse of Christ''s by the signs
    which he made." "Of what [signs] do you speak?" said he. "When the people," replied
    I, "waged war with Amalek, and the son of Nave (Nun) by name Jesus (Joshua), led
    the fight, Moses himself prayed to God, stretching out both hands, and Hur with
    Aaron supported them during the whole day, so that they might not hang down when
    he got wearied. For if he gave up any part of this sign, which was an imitation
    of the cross, the people were beaten, as is recorded in the writings of Moses;
    but if he remained in this form, Amalek was proportionally defeated, and he who
    prevailed prevailed by the cross. For it was not because Moses so prayed that
    the people were stronger, but because, while one who bore the name of Jesus (Joshua)
    was in the forefront of the battle, he himself made the sign of the cross. For
    who of you knows not that the prayer of one who accompanies it with lamentation
    and tears, with the body prostrate, or with bended knees, propitiates God most
    of all? But in such a manner neither he nor any other one, while sitting on a
    stone, prayed. Nor even the stone symbolized Christ, as I have shown. 91 "And
    God by Moses shows in another way the force of the mystery of the cross, when
    He said in the blessing wherewith Joseph was blessed, ''From the blessing of the
    Lord is his land; for the seasons of heaven, and for the dews, and for the deep
    springs from beneath, and for the seasonable fruits of the sun, and for the coming
    together of the months, and for the heights of the everlasting mountains, and
    for the heights of the hills, and for the ever-flowing rivers, and for the fruits
    of the fatness of the earth; and let the things accepted by Him who appeared in
    the bush come on the head and crown of Joseph. Let him be glorified among his
    brethren; his beauty is [like] the firstling of a bullock; his horns the horns
    of an unicorn: with these shall he push the nations from one end of the earth
    to another.'' Now, no one could say or prove that the horns of an unicorn represent
    any other fact or figure than the type which portrays the cross. For the one beam
    is placed upright, from which the highest extremity is raised up into a horn,
    when the other beam is fitted on to it, and the ends appear on both sides as horns
    joined on to the one horn. And the part which is fixed in the centre, on which
    are suspended those who are crucified, also stands out like a horn; and it also
    looks like a horn conjoined and fixed with the other horns. And the expression,
    ''With these shall he push as with horns the nations from one end of the earth
    to another,'' is indicative of what is now the fact among all the nations. For
    some out of all the nations, through the power of this mystery, having been so
    pushed, that is, pricked in their hearts, have turned from vain idols and demons
    to serve God. But the same figure is revealed for the destruction and condemnation
    of the unbelievers; even as Amalek was defeated and Israel victorious when the
    people came out of Egypt, by means of the type of the stretching out of Moses''
    hands, and the name of Jesus (Joshua), by which the son of Nave (Nun) was called.
    And it seems that the type and sign, which was erected to counteract the serpents
    which bit Israel, was intended for the salvation of those who believe that death
    was declared to come thereafter on the serpent through Him that would be crucified,
    but salvation to those who had been bitten by him and had betaken themselves to
    Him that sent His Son into the world to be crucified. For the Spirit of prophecy
    by Moses did not teach us to believe in the serpent, since it shows us that he
    was cursed by God from the beginning; and in Isaiah tells us that he shall be
    put to death as an enemy by the mighty sword, which is Christ. 92 "Unless, therefore,
    a man by God''s great grace receives the power to understand what has been said
    and done by the prophets, the appearance of being able to repeat the words or
    the deeds will not profit him, if he cannot explain the argument of them. And
    will they not assuredly appear contemptible to many, since they are related by
    those who understood them not? For if one should wish to ask you why, since Enoch,
    Noah with his sons, and all others in similar circumstances, who neither were
    circumcised nor kept the Sabbath, pleased God, God demanded by other leaders,
    and by the giving of the law after the lapse of so many generations, that those
    who lived between the times of Abraham and of Moses be justified by circumcision,
    and that those who lived after Moses be justified by circumcision and the other
    ordinances--to wit, the Sabbath, and sacrifices, and libations, and offerings;
    [God will be slandered] unless you show, as I have already said, that God who
    foreknew was aware that your nation would deserve expulsion from Jerusalem, and
    that none would be permitted to enter into it.(For you are not distinguished in
    any other way than by the fleshly circumcision, as I remarked previously. For
    Abraham was declared by God to be righteous, not on account of circumcision, but
    on account of faith. For before he was circumcised the following statement was
    made regarding him: ''Abraham believed God, and it was accounted unto him for
    righteousness.'' And we, therefore, in the uncircumcision of our flesh, believing
    God through Christ, and having that circumcision which is of advantage to us who
    have acquired it--namely, that of the heart--we hope to appear righteous before
    and well-pleasing to God: since already we have received His testimony through
    the words of the prophets.) [And, further, God will be slandered unless you show]
    that you were commanded to observe the Sabbath, and to present offerings, and
    that the Lord submitted to have a place called by the name of God, in order that,
    as has been said, you might not become impious and godless by worshipping idols
    and forgetting God, as indeed you do always appear to have been. (Now, that God
    enjoined the ordinances of Sabbaths and offerings for these reasons, I have proved
    in what I previously remarked; but for the sake of those who came to-day, I wish
    to repeat nearly the whole.) For if this is not the case, God will be slandered,
    as having no foreknowledge, and as not teaching all men to know and to do the
    same acts of righteousness (for many. generations of men appear to have existed
    before Moses); and the Scripture is not true which affirms that ''God is true
    and righteous, and all His ways are judgments, and there is no unrighteousness
    in him.'' But since the Scripture is true, God is always willing that such even
    as you be neither foolish nor lovers of yourselves, in order that you may obtain
    the salvation of Christ, who pleased God, and received testimony from Him, as
    I have already said, by alleging proof from the holy words of prophecy. 93 "For
    [God] sets before every race of mankind that which is always and universally just,
    as well as all righteousness; and every race knows that adultery, and fornication,
    and homicide, and such like, are sinful; and though they all commit such practices,
    yet they do not escape from the knowledge that they act unrighteously whenever
    they so do, with the exception of those who are possessed with an unclean spirit,
    and who have been debased by education, by wicked customs, and by sinful institutions,
    and who have lost, or rather quenched and put under, their natural ideas. For
    we may see that such persons are unwilling to submit to the same things which
    they inflict upon others, and reproach each other with hostile consciences for
    the acts which they perpetrate. And hence I think that our Lord and Saviour Jesus
    Christ spoke well when He summed up all righteousness and piety in two commandments.
    They are these: ''Thou shalt love the Lord thy God with all thy heart, and with
    all thy strength, and thy neighbour as thyself.'' For the man who loves God with
    all the heart, and with all the strength, being filled with a God-fearing mind,
    will reverence no other god; and since God wishes it, he would reverence that
    angel who is beloved by the same Lord and God. And the man who loves his neighbour
    as himself will wish for him the same good things that he wishes for himself,
    and no man will wish evil things for himself. Accordingly, he who loves his neighbour
    would pray and labour that his neighbour may be possessed of the same benefits
    as himself. Now nothing else is neighbour to man than that similarly-affectioned
    and reasonable being--man. Therefore, since all righteousness is divided into
    two branches, namely, in so far as it regards God and men, whoever, says the Scripture,
    loves the Lord God with all the heart, and all the strength, and his neighbour
    as himself, would be truly a righteous man. But you were never shown to be possessed
    of friendship or love either towards God, or towards the prophets, or towards
    yourselves, but, as is evident, you are ever found to be idolaters and murderers
    of righteous men, so that you laid hands even on Christ Himself; and to this very
    day you abide in your wickedness, execrating those who prove that this man who
    was crucified by you is the Christ. Nay, more than this, you suppose that He was
    crucified as hostile to and cursed by God, which supposition is the product of
    your most irrational mind. For though you have the means of understanding that
    this man is Christ from the signs given by Moses, yet you will not; but, in addition,
    fancying that we can have no arguments, you put whatever question comes into your
    minds, while you yourselves are at a loss for arguments whenever you meet with
    some firmly established Christian. 94 "For tell me, was it not God who commanded
    by Moses that no image or likeness of anything which was in heaven above or which
    was on the earth should be made, and yet who caused the brazen serpent to be made
    by Moses in the wilderness, and set it up for a sign by which those bitten by
    serpents were saved? Yet is He free from unrighteousness. For by this, as I previously
    remarked, He proclaimed the mystery, by which He declared that He would break
    the power of the serpent which occasioned the transgression of Adam, and [would
    bring] to them that believe on Him [who was foreshadowed] by this sign, i.e.,
    Him who was to be crucified, salvation from the fangs of the serpent, which are
    wicked deeds, idolatries, and other unrighteous acts. Unless the matter be so
    understood, give me a reason why Moses set up the brazen serpent for a sign, and
    bade those that were bitten gaze at it, and the wounded were healed; and this,
    too, when he had himself commanded that no likeness of anything whatsoever should
    be made." On this, another of those who came on the second day said, "You have
    spoken truly: we cannot give a reason. For I have frequently interrogated the
    teachers about this matter, and none of them gave me a reason: therefore continue
    what you are speaking; for we are paying attention while you unfold the mystery,
    on account of which the doctrines of the prophets are falsely slandered." Then
    I replied, "Just as God commanded the sign to be made by the brazen serpent, and
    yet He is blameless; even so, though a curse lies in the law against persons who
    are crucified, yet no curse lies on the Christ of God, by whom all that have committed
    things worthy of a curse are saved. 95 "For the whole human race will be found
    to be under a curse. For it is written in the law of Moses, ''Cursed is every
    one that continueth not in all things that are written in the book of the law
    to do them.'' And no one has accurately done all, nor will you venture to deny
    this; but some more and some less than others have observed the ordinances enjoined.
    But if those who are under this law appear to be under a curse for not having
    observed all the requirements, how much more shall all the nations appear to be
    under a curse who practise idolatry, who seduce youths, and commit other crimes?
    If, then, the Father of all wished His Christ for the whole human family to take
    upon Him the curses of all, knowing that, after He had been crucified and was
    dead, He would raise Him up, why do you argue about Him, who submitted to suffer
    these things according to the Father''s will, as if He were accursed, and do not
    rather bewail yourselves? For although His Father caused Him to suffer these things
    in behalf of the human family, yet you did not commit the deed as in obedience
    to the will of God. For you did not practise piety when you slew the prophets.
    And let none of you say: If His Father wished Him to suffer this, in order that
    by His stripes the human race might be healed, we have done no wrong. If, indeed,
    you repent of your sins, and recognise Him to be Christ, and observe His commandments,
    then you may assert this; for, as I have said before, remission of sins shall
    be yours. But if you curse Him and them that believe on Him, and, when you have
    the power, put them to death, how is it possible that requisition shall not be
    made of you, as of unrighteous and sinful men, altogether hard-hearted and without
    understanding, because you laid your hands on Him? 96 "For the statement in the
    law, ''Cursed is every one that hangeth on a tree,'' confirms our hope which depends
    on the crucified Christ, not because He who has been crucified is cursed by God,
    but because God foretold that which would be done by you all, and by those like
    to your, who do not know that this is He who existed before all, who is the eternal
    Priest of God, and King, and Christ. And you clearly see that this has come to
    pass. For you curse in your synagogues all those who are called from Him Christians;
    and other nations effectively carry out the curse, putting to death those who
    simply confess themselves to be Christians; to all of whom we say, You are our
    brethren; rather recognise the truth of God. And while neither they nor you are
    persuaded by us, but strive earnestly to cause us to deny the name of Christ,
    we choose rather and submit to death, in the full assurance that all the good
    which God has promised through Christ He will reward us with. And in addition
    to all this we pray for you, that Christ may have mercy upon you. For He taught
    us to pray for our enemies also, saying, ''Love your enemies; be kind and merciful,
    as your heavenly Father is.'' For we see that the Almighty God is kind and merciful,
    causing His sun to rise on the un-thankful and on the righteous, and sending rain
    on the holy and on the wicked; all of whom He has taught us He will judge. 97
    "For it was not without design that the prophet Moses, when Hur and Aaron upheld
    his hands, remained in this form until evening. For indeed the Lord remained upon
    the tree almost until evening, and they buried Him at eventide; then on the third
    day He rose again. This was declared by David thus: ''With my voice I cried to
    the Lord, and He heard me out of His holy hill. I laid me down, and slept; I awaked,
    for the Lord sustained me.'' And Isaiah likewise mentions concerning Him the manner
    in which He would die, thus: ''I have spread out My hands unto a people disobedient,
    and gainsaying, that walk in a way which is not good.'' And that He would rise
    again, Isaiah himself said: ''His burial has been taken away from the midst, and
    I will give the rich for His death.'' And again, in other words, David in the
    twenty-first Psalm thus refers to the suffering and to the cross in a parable
    of mystery: ''They pierced my hands and my feet; they counted all my bones. They
    considered and gazed on me; they parted my garments among themselves, and cast
    lots upon my vesture.'' For when they crucified Him, driving in the nails, they
    pierced His hands and feet; and those who crucified Him parted His garments among
    themselves, each casting lots for what he chose to have, and receiving according
    to the decision of the lot. And this very Psalm you maintain does not refer to
    Christ; for you are in all respects blind, and do not understand that no one in
    your nation who has been called King or Christ has ever had his hands or feet
    pierced while alive, or has died in this mysterious fashion--to wit, by the cross--save
    this Jesus alone. 98 "I shall repeat the whole Psalm, in order that you may hear
    His reverence to the Father, and how He refers all things to Him, and prays to
    be delivered by Him from this death; at the same time declaring in the Psalm who
    they are that rise up against Him, and showing that He has truly become man capable
    of suffering. It is as follows: ''O God, my God, attend to me why hast Thou forsaken
    me? The words of my transgressions are far from my salvation. O my God, I will
    cry to Thee in the day-time, and Thou wilt not hear; and in the night-season,
    and it is not for want of understanding in me. But Thou, the Praise of Israel,
    inhabitest the holy place. Our fathers trusted in Thee; they trusted, and Thou
    didst deliver them. They cried unto Thee, and were delivered: they trusted in
    Thee, and were not confounded. But I am a worm, and no man; a reproach of men,
    and despised of the people. All they that see me laughed me to scorn; they spake
    with the lips, they shook the head: He trusted on the Lord: let Him deliver him,
    let Him save him, since he desires Him. For Thou art He that took me out of the
    womb; my hope from the breasts of my mother I was cast upon Thee from the womb.
    Thou art my God from my mother''s belly: be not far from me, for trouble is near;
    for there is none to help. Many calves have compassed me; fat bulls have beset
    me round. They opened their mouth upon me, as a ravening and roaring lion. All
    my bones are poured out and dispersed like water. My heart has become like wax
    melting in the midst of my belly. My strength is dried up like a potsherd; and
    my tongue has cleaved to my throat; and Thou hast brought me into the dust of
    death. For many dogs have surrounded me; the assembly of the wicked have beset
    me round. They pierced my hands and my feet, they did tell all my bones. They
    did look and stare upon me; they parted my garments among them, and cast lots
    upon my vesture. But do not Thou remove Thine assist-ante from me, O Lord: give
    heed to help me; deliver my soul from the sword, and my only-begotten from the
    hand of the dog. Save me from the lion''s mouth, and my humility from the horns
    of the unicorns. I will declare Thy name to my brethren; in the midst of the Church
    will I praise Thee. Ye that fear the Lord, praise Him: all ye the seed of Jacob,
    glorify Him. Let all the seed of Israel fear Him.'' " 99 And when I had said these
    words, I continued: "Now I will demonstrate to you that the whole Psalm refers
    thus to Christ, by the words which I shall again explain. What is said at first--''O
    God, my God, attend to me: why hast Thou forsaken me?''--announced from the beginning
    that which was to be said in the time of Christ. For when crucified, He spake:
    ''O God, my God, why hast Thou forsaken me?'' And what follows: ''The words of
    my transgressions are far from my salvation. O my God, I will cry to Thee in the
    day-time, and Thou wilt not hear; and in the night-season, and it is not for want
    of understanding in me.'' These, as well as the things which He was to do, were
    spoken. For on the day on which He was to be crucified, having taken three of
    His disciples to the hill called Olivet, situated opposite to the temple in Jerusalem,
    He prayed in these words: ''Father, if it be possible, let this cup pass from
    me.'' And again He prayed: "Not as I will, but as Thou wilt;'' showing by this
    that He had become truly a suffering man. But lest any one should say, He did
    not know then that He had to suffer, He adds immediately in the Psalm: ''And it
    is not for want of under standing in me.'' Even as there was no ignorance on God''s
    part when He asked Adam where he was, or asked Cain where Abel was; but [it was
    done] to convince each what kind of man he was, and in order that through the
    record [of Scripture] we might have a knowledge of all: so likewise Christ declared
    that ignorance was not on His side, but on theirs, who thought that He was not
    the Christ, but fancied they would put Him to death, and that He, like some common
    mortal, would remain in Hades. 100 "Then what follows--''But Thou, the praise
    of Israel, inhabitest the holy place''--declared that He is to do something worthy
    of praise and wonderment, being about to rise again from the dead on the third
    day after the crucifixion; and this He has obtained from the Father. For I have
    showed already that Christ is called both Jacob and Israel; and I have proved
    that it is not in the blessing of Joseph and Judah alone that what relates to
    Him was proclaimed mysteriously, but also in the Gospel it is written that He
    said: ''All things are delivered unto me by My Father;'' and, ''No man knoweth
    the Father but the Son; nor the Son but the Father, and they to whom the Son will
    reveal Him.'' Accordingly He revealed to us all that we have perceived by His
    grace out of the Scriptures, so that we know Him to be the first-begotten of God,
    and to be before all creatures; likewise to be the Son of the patriarchs, since
    He assumed flesh by the Virgin of their family, and submitted to become a man
    without comeliness, dishonoured, and subject to suffering. Hence, also, among
    His words He said, when He was discoursing about His future sufferings: "The Son
    of man must suffer many things, and be rejected by the Pharisees and Scribes,
    and be crucified, and on the third day rise again.'' He said then that He was
    the Son of man, either because of His birth by the Virgin, who was, as I said,
    of the family of David and Jacob, and Isaac, and Abraham; or because Adam was
    the father both of Himself and of those who have been first enumerated from whom
    Mary derives her descent. For we know that the fathers of women are the fathers
    likewise of those children whom their daughters bear. For [Christ] called one
    of His disciples--previously known by the name of Simon--Peter; since he recognised
    Him to be Christ the Son. of God, by the revelation of His Father: and since we
    find it recorded in the memoirs of His apostles that He is the Son of God, and
    since we call Him the Son, we have understood that He proceeded before all creatures
    from the Father by His power and will (for He is addressed in the writings of
    the prophets in one way or another as Wisdom, and the Day, and the East, and a
    Sword, and a Stone, and a Rod, and Jacob, and Israel); and that He became man
    by the Virgin, in order that the disobedience which proceeded from the serpent
    might receive its destruction in the same manner in which it derived its origin.
    For Eve, who was a virgin and undefiled, having conceived the word of the serpent,
    brought forth disobedience and death. But the Virgin Mary received faith and joy,
    when the angel Gabriel announced the good tidings to her that the Spirit of the
    Lord would come upon her, and the power of the Highest would overshadow her: wherefore
    also the Holy Thing begotten of her is the Son of God; and she replied, ''Be it
    unto me according to thy word.'' And by her has He been born, to whom we have
    proved so many Scriptures refer, and by whom God destroys both the serpent and
    those angels and men who are like him; but works deliverance from death to those
    who repent of their wickedness and believe upon Him. 101 "Then what follows of
    the Psalm is this, in which He says: ''Our fathers trusted in Thee; they trusted,
    and Thou didst deliver them. They cried unto Thee, and were not confounded. But
    I am a worm, and no man; a reproach of men, and despised of the people;'' which
    show that He admits them to be His fathers, who trusted in God and were saved
    by Him, who also were the fathers of the Virgin, by whom He was born and became
    man; and He foretells that He shall be saved by the same God, but boasts not in
    accomplishing anything through His own will or might. For when on earth He acted
    in the very same manner, and answered to one who addressed Him as'' Good Master:''
    Why callest thou me good? One is good, my Father who is in heaven.'' But when
    He says, I am a worm, and no man; a reproach of men, and despised of the people,''
    He prophesied the things which do exist, and which happen to Him. For we who believe
    on Him are everywhere a reproach, ''despised of the people;'' for, rejected and
    dishonoured by your nation, He suffered those indignities which you planned against
    Him. And the following: ''All they that see me laughed me to scorn; they spake
    with the lips, they shook the head: He trusted in the Lord; let Him deliver him,
    since he desires Him;'' this likewise He foretold should happen to Him. For they
    that saw Him crucified shook their heads each one of them, and distorted their
    lips, and twisting their noses to each other, they spake in mockery the words
    which are recorded in the memoirs of His apostles: ''He said he was the Son of
    God: let him come down; let God save him.'' 102 "And what follows--''My hope from
    the breasts of my mother. On Thee have I been cast from the womb; from my mother''s
    belly Thou art my God: for there is no helper. Many calves have compassed me;
    fat bulls have beset me round. They opened their mouth upon me, as a ravening
    and a roaring lion. All my bones are poured out and dispersed like water. My heart
    has become likes wax melting in the midst of my belly. My strength is become dry
    like a potsherd; and my tongue has cleaved to my throat''--foretold what would
    come to pass; for the statement, ''My hope from the breasts of my mother,'' [is
    thus explained]. As soon as He was born in Bethlehem, as I previously remarked,
    king Herod, having learned from the Arabian Magi about Him, made a plot to put
    Him to death and by God''s command Joseph took Him with Mary and departed into
    Egypt. For the Father had decreed that He whom He had begotten should be put to
    death, but not before He had grown to manhood, and proclaimed the word which proceeded
    from Him. But if any of you say to us, Could not God rather have put Herod to
    death? I return answer by anticipation: Could not God have cut off in the beginning
    the serpent, so that he exist not, rather than have said, ''And I will put enmity
    between him and the woman, and between his seed and her seed?'' Could He not have
    at once created a multitude of men? But yet, since He knew that it would be good,
    He created both angels and men free to do that which is righteous, and He appointed
    periods of time during which He knew it would be good for them to have the exercise
    of free-will; and because He likewise knew it would be good, He made general and
    particular judgments; each one''s freedom of will, however, being guarded. Hence
    Scripture says the following, at the destruction of the tower, and division and
    alteration of tongues: ''And the Lord said, Behold, the people is one, and they
    have all one language; and this they have begun to do: and now nothing will be
    restrained from them of all which they have attempted to do.'' And the statement,
    ''My strength is become dry like a potsherd, and my tongue has cleaved to my throat,''
    was also a prophecy of what would be done by Him according to the Father''s will.
    For the power of His strong word, by which He always confuted the Pharisees and
    Scribes, and, in short, all your nation''s teachers that questioned Him, had a
    cessation like a plentiful and strong spring, the waters of which have been turned
    off, when He kept silence, and chose to return no answer to any one in the presence
    of Pilate; as has been declared in the memoirs of His apostles, in order that
    what is recorded by Isaiah might have efficacious fruit, where it is written,
    ''The Lord gives me a tongue, that I may know when I ought to speak.'' Again,
    when He said, ''Thou art my God; be not far from me,'' He taught that all men
    ought to hope in God who created all things, and seek salvation and help from
    Him alone; and not suppose, as the rest of men do, that salvation can be obtained
    by birth, or wealth, or strength, or wisdom. And such have ever been your practices:
    at one time you made a calf, and always you have shown yourselves ungrateful,
    murderers of the righteous, and proud of your descent. For if the Son of God evidently
    states that He can be saved, [neither] because He is a son, nor because He is
    strong or wise, but that without God He cannot be saved, even though He be sinless,
    as Isaiah declares in words to the effect that even in regard to His very language
    He committed no sin (for He committed no iniquity or guile with His mouth), how
    do you or others who expect to be saved without this hope, suppose that you are
    not deceiving yourselves? 103 "Then what is next said in the Psalm--''For trouble
    is near, for there is none to help me. Many calves have compassed me; fat bulls
    have beset me round. They opened their mouth upon me as a ravening and roaring
    lion. All my bones are poured out and dispersed like water,''--was likewise a
    prediction of the events which happened to Him. For on that night when some of
    your nation, who had been sent by the Pharisees and Scribes, and teachers, came
    upon Him from the Mount of Olives, those whom Scripture called butting and prematurely
    destructive calves surrounded Him. And the expression, ''Fat bulls have beset
    me round,'' He spoke beforehand of those who acted similarly to the calves, when
    He was led before your teachers. And the Scripture described them as bulls, since
    we know that bulls are authors of calves'' existence. As therefore the bulls are
    the begetters of the calves, so your teachers were the cause why their children
    went out to the Mount of Olives to take Him and bring Him to them. And the expression,
    ''For there is none to help,'' is also indicative of what took place. For there
    was not even a single man to assist Him as an innocent person. And the expression,
    ''They opened their mouth upon me like a roaring lion,'' designates him who was
    then king of the Jews, and was called Herod, a successor of the Herod who, when
    Christ was born, slew all the infants in Bethlehem born about the same time, because
    he imagined that amongst them He would assuredly be of whom the Magi from Arabia
    had spoken; for he was ignorant of the will of Him that is stronger than all,
    how He had commanded Joseph and Mary to take the Child and depart into Egypt,
    and there to remain until a revelation should again be made to them to return
    into their own country. And there they did remain until Herod, who slew the infants
    in Bethlehem, was dead, and Archelaus had succeeded him. And he died before Christ
    came to the dispensation on the cross which was given Him by His Father. And when
    Herod succeeded Archelaus, having received the authority which had been allotted
    to him, Pilate sent to him by way of compliment Jesus bound; and God foreknowing
    that this would happen, had thus spoken: ''And they brought Him to the Assyrian,
    a present to the king.'' Or He meant the devil by the lion roaring against Him:
    whom Moses calls the serpent, but in Job and Zechariah he is called the devil,
    and by Jesus is addressed as Satan, showing that a compounded name was acquired
    by him from the deeds which he performed. For ''Sata'' in the Jewish and Syrian
    tongue means apostate; and ''Nas'' is the word from which he is called by interpretation
    the serpent, i.e., according to the interpretation of the Hebrew term, from both
    of which there arises the single word Satanas. For this devil, when [Jesus] went
    up from the river Jordan, at the time when the voice spake to Him, ''Thou art
    my Son: this day have I begotten Thee,'' is recorded in the memoirs of the apostles
    to have come to Him and tempted Him, even so far as to say to Him, ''Worship me;''
    and Christ answered him, ''Get thee behind me, Satan: thou shalt worship the Lord
    thy God, and Him only shalt thou serve.'' For as he had deceived Adam, so he hoped
    that he might contrive some mischief against Christ also. Moreover, the statement,
    ''All my bones are poured out and dispersed like water; my heart has become like
    wax, melting in the midst of my belly,'' was a prediction of that which happened
    to Him on that night when men came out against Him to the Mount of Olives to seize
    Him. For in the memoirs which I say were drawn up by His apostles and those who
    followed them, [it is recorded] that His sweat fell down like drops of blood while
    He was praying, and saying, ''If it be possible, let this cup pass:'' His heart
    and also His bones trembling; His heart being like wax melting in His belly: in
    order that we may perceive that the Father wished His Son really to undergo such
    sufferings for our sakes, and may not say that He, being the Son of God, did not
    feel what was happening to Him and inflicted on Him. Further, the expression,
    ''My strength is dried up like a potsherd, and my tongue has cleaved to my throat,''
    was a prediction, as I previously remarked, of that silence, when He who convicted
    all your teachers of being unwise returned no answer at all. 104 "And the statement,
    ''Thou hast brought me into the dust of death; for many dogs have surrounded me:
    the assembly of the wicked have beset me round. They pierced my hands and my feet.
    They did tell all my bones. They did look and stare upon me. They parted my garments
    among them, and cast lots upon my vesture,''--was a prediction, as I said before,
    of the death to which the synagogue of the wicked would condemn Him, whom He calls
    both dogs and hunters, declaring that those who hunted Him were both gathered
    together and assiduously striving to condemn Him. And this is recorded to have
    happened in the memoirs of His apostles. And I have shown that, after His crucifixion,
    they who crucified Him parted His garments among them. 105 "And what follows of
    the Psalm,--''But Thou, Lord, do not remove Thine assistance from me; give heed
    to help me. Deliver my soul from the sword, and my only-begotten from the hand
    of the dog; save me from the lion''s mouth, and my humility from the horns of
    the unicorns,''--was also information and prediction of the events which should
    befall Him. For I have already proved that He was the only-begotten of the Father
    of all things, being begotten in a peculiar manner Word and Power by Him, and
    having afterwards become man through the Virgin, as we have learned from the memoirs.
    Moreover, it is similarly foretold that He would die by crucifixion. For the passage,
    ''Deliver my soul from the sword, and my only-begotten from the hand of the dog;
    save me from the lion''s mouth, and my humility from the horns of the unicorns,''
    is indicative of the suffering by which He should die, i.e., by crucifixion. For
    the ''horns of the, unicorns,'' I have already explained to you, are the figure
    of the cross only. And the prayer that His soul should be saved from the sword,
    and lion''s mouth, and hand of the dog, was a prayer that no one should take possession
    of His soul: so that, when we arrive at the end of life, we may ask the same petition
    from God, who is able to turn away every shameless evil angel from taking our
    souls. And that the souls survive, I have shown to you from the fact that the
    soul of Samuel was called up by the witch, as Saul demanded. And it appears also,
    that all the souls of similiar righteous men and prophets fell under the dominion
    of such powers, as is indeed to be inferred from the very facts in the case of
    that witch. Hence also God by His Son teaches us for whose sake these things seem
    to have been done, always to strive earnestly, and at death to pray that our souls
    may not fall into the hands of any such power. For when Christ was giving up His
    spirit on the cross, He said, ''Father, into Thy hands I commend my spirit,''
    as I have learned also from the memoirs. For He exhorted His disciples to surpass
    the pharisaic way of living, with the warning, that if they did not, they might
    be sure they could not be saved; and these words are recorded in the memoirs:
    ''Unless your righteousness exceed that of the Scribes and Pharisees, ye shall
    not enter into the kingdom of heaven.'' 106 "The remainder of the Psalm makes
    it manifest that He knew His Father would grant to Him all things which He asked,
    and would raise Him from the dead; and that He urged all who fear God to praise
    Him because He had compassion on all races of believing men, through the mystery
    of Him who was crucified; and that He stood in the midst of His brethren the apostles
    (who repented of their flight from Him when He was crucified, after He rose from
    the dead, and after they were persuaded by Himself that, before His passion He
    had mentioned to them that He must suffer these things, and that they were announced
    beforehand by the prophets), and when living with them sang praises to God, as
    is made evident in the memoirs of the apostles. The words are the following: ''I
    will declare Thy name to my brethren; in the midst of the Church will I praise
    Thee. Ye that fear the Lord, praise Him; all ye, the seed of Jacob, glorify Him.
    Let all the seed of Israel fear Him.'' And when it is said that He changed the
    name of one of the apostles to Peter; and when it is written in the memoirs of
    Him that this so happened, as well as that He changed the names of other two brothers,
    the sons of Zebedee, to Boanerges, which means sons of thunder; this was an announcement
    of the fact that it was He by whom Jacob was called Israel, and Oshea called Jesus
    (Joshua), under whose name the people who survived of those that came from Egypt
    were conducted into the land promised to the patriarchs. And that He should arise
    like a star from the seed of Abraham, Moses showed before hand when he thus said,
    ''A star shall arise from Jacob, and a leader from Israel;'' and another Scripture
    says, ''Behold a man; the East is His name.'' Accordingly, when a star rose in
    heaven at the time of His birth, as is recorded in the memoirs of His apostles,
    the Magi from Arabia, recognising the sign by this, came and worshipped Him. 107
    "And that He would rise again on the third day after the crucifixion, it is written
    in the memoirs that some of your nation, questioning Him, said, ''Show us a sign;''
    and He replied to them, ''An evil and adulterous generation seeketh after a sign;
    and no sign shall be given them, save the sign of Jonah.'' And since He spoke
    this obscurely, it was to be understood by the audience that after His crucifixion
    He should rise again on the third day. And He showed that your generation was
    more wicked and more adulterous than the city of Nineveh; for the latter, when
    Jonah preached to them, after he had been cast up on the third day from the belly
    of the great fish, that after three (in other versions, forty) days they should
    all perish, proclaimed a fast of all creatures, men and beasts, with sackcloth,
    and with earnest lamentation, with true repentance from the heart, and turning
    away from unrighteousness, in the belief that God is merciful and kind to all
    who turn from wickedness; so that the king of that city himself, with his nobles
    also, put on sackcloth and remained fasting and praying, and obtained their request
    that the city should not be overthrown. But when Jonah was grieved that on the
    (fortieth) third day, as he proclaimed, the city was not overthrown, by the dispensation
    of a gourd springing up from the earth for him, under which he sat and was shaded
    from the heat (now the gourd had sprung up suddenly, and Jonah had neither planted
    nor watered it, but it had come up all at once to afford him shade), and by the
    other dispensation of its withering away, for which Jonah grieved, [God] convicted
    him of being unjustly displeased because the city of Nineveh had not been overthrown,
    and said, ''Thou hast had pity on the gourd, for the which thou hast not laboured,
    neither madest it grow; which came up in a night, and perished in a night. And
    shall I not spare Nineveh, the great city, wherein dwell more than six score thousand
    persons that cannot discern between their right hand and their left hand; and
    also much cattle?'' 108 "And though all the men of your nation knew the incidents
    in the life of Jonah, and though Christ said amongst you that He would give the
    sign of Jonah, exhorting you to repent of your wicked deeds at least after He
    rose again from the dead, and to mourn before God as did the Ninevites, in order
    that your nation and city might not be taken and destroyed, as they have been
    destroyed; yet you not only have not repented, after you learned that He rose
    from the dead, but, as I said before you have sent chosen and ordained men throughout
    all the world to proclaim that a godless and lawless heresy had sprung from one
    Jesus, a Galilaean deceiver, whom we crucified, but his disciples stole him by
    night from the tomb, where he was laid when unfastened from the cross, and now
    deceive men by asserting that he has risen from the dead and ascended to heaven.
    Moreover, you accuse Him of having taught those godless, lawless, and unholy doctrines
    which you mention to the condemnation of those who confess Him to be Christ, and
    a Teacher from and Son of God. Besides this, even when your city is captured,
    and your land ravaged, you do not repent, but dare to utter imprecations on Him
    and all who believe in Him. Yet we do not hate you or those who, by your means,
    have conceived such prejudices against us; but we pray that even now all of you
    may repent and obtain mercy from God, the compassionate and long-suffering Father
    of all. 109 "But that the Gentiles would repent of the evil in which they led
    erring lives, when they heard the doctrine preached by His apostles from Jerusalem,
    and which they learned through them, suffer me to show you by quoting a short
    statement from the prophecy of Micah, one of the twelve [minor prophets]. This
    is as follows: ''And in the last days the mountain of the Lord shall be manifest,
    established on the top of the mountains; it shall be exalted above the hills,
    arid people shall flow unto it. And many nations shall go, and say, Come, let
    us go up to the mountain of the Lord, and to the house of the God of Jacob; and
    they shall enlighten us in His way, and we shall walk in His paths: for out of
    Zion shall go forth the law, and the word of the Lord from Jerusalem. And He shall
    judge among many peoples, and shall rebuke strong nations afar off; and they shall
    beat their swords into ploughshares, and their spears into sickles: nation shall
    not lift up a sword against nation, neither shall they learn war any more. And
    each man shall sit under his vine and under his fig tree; and there shall be none
    to terrify: for the mouth of the Lord of hosts hath spoken it. For all people
    will walk in the name of their gods; but we will walk in the name of the Lord
    our God for ever. And it shall come to pass in that day, that I will assemble
    her that is afflicted, and gather her that is driven out, and whom I had plagued;
    and I shall make her that is afflicted a remnant, and her that is oppressed a
    strong nation. And the Lord shall reign over them in Mount Zion from henceforth,
    and even for ever.'' " 110 And when I had finished these words, I continued: "Now
    I am aware that your teachers, sirs, admit the whole of the words of this passage
    to refer to Christ; and I am likewise aware that they maintain He has not yet
    come; or if they say that He has come, they assert that it is not known who He
    is; but when He shall become manifest and glorious, then it shall be known who
    He is. And then, they say, the events mentioned in this passage shall happen,
    just as if there was no fruit as yet from the words of the prophecy. O unreasoning
    men! understanding not what has been proved by all these passages, that two advents
    of Christ have been announced: the one, in which He is set forth as suffering,
    inglorious, dishonoured, and crucified; but the other, in which He shall come
    from heaven with glory, when the man of apostasy, who speaks strange things against
    the Most High, shall venture to do unlawful deeds on the earth against us the
    Christians, who, having learned the true worship of God from the law, and the
    word which went forth from Jerusalem by means of the apostles of Jesus, have fled
    for safety to the God of Jacob and God of Israel; and we who were filled with
    war, and mutual slaughter, and every wickedness, have each through the whole earth
    changed our warlike weapons,--our swords into ploughshares, and our spears into
    implements of tillage,--and we cultivate piety, righteousness, philanthropy, faith,
    and hope, which we have from the Father Himself through Him who was crucified;
    and sitting each under his vine, i.e., each man possessing his own married wife.
    For you are aware that the prophetic word says, ''And his wife shall be like a
    fruitful vine.'' Now it is evident that no one can terrify or subdue us who have
    believed in Jesus over all the world. For it is plain that, though beheaded, and
    crucified, and thrown to wild beasts, and chains, and fire, and all other kinds
    of torture, we do not give up our confession; but the more such things happen,
    the more do others and in larger numbers become faithful, and worshippers of God
    through the name of Jesus. For Just as if one should cut away the fruit-bearing
    parts of a vine, it grows up again, and yields other branches flourishing and
    fruitful; even so the same thing happens with us. For the vine planted by God
    and Christ the Saviour is His people. But the rest of the prophecy shall be fulfilled
    at His second coming. For the expression, ''He that is afflicted [and driven out],''
    i.e., from the world, [implies] that, so far as you and all other men have it
    in your power, each Christian has been driven out not only from his own property,
    but even from the whole world; for you permit no Christian to live. But you say
    that the same fate has befallen your own nation. Now, if you have been cast out
    after defeat in battle, you have suffered such treatment justly indeed, as all
    the Scriptures bear witness; but we, though we have done no such [evil acts] after
    we knew the truth of God, are testified to by God, that, together with the most
    righteous, and only spotless and sinless Christ, we are taken away out of the
    earth. For Isaiah cries, ''Behold how the righteous perishes, and no man lays
    it to heart; and righteous men are taken away, and no man considers it.'' 111
    "And that it was declared by symbol, even in the time of Moses, that there would
    be two advents of this Christ, as I have mentioned previously, [is manifest] from
    the symbol of the goats presented for sacrifice during the fast. And again, by
    what Moses and Joshua did, the same thing was symbolically announced and told
    beforehand. For the one of them, stretching out his hands, remained till evening
    on the hill, his hands being supported; and this reveals a type of no other thing
    than of the cross: and the other, whose name was altered to Jesus (Joshua), led
    the fight, and Israel conquered. Now this took place in the case of both those
    holy men and prophets of God, that you may perceive how one of them could not
    bear up both the mysteries: I mean, the type of the cross and the type of the
    name. For this is, was, and shall be the strength of Him alone, whose name every
    power dreads, being very much tormented because they shall be destroyed by Him.
    Therefore our suffering and crucified Christ was not cursed by the law, but made
    it manifest that He alone would save those who do not depart from His faith. And
    the blood of the passover, sprinkled on each man''s door-posts and lintel, delivered
    those who were saved in Egypt, when the first-born of the Egyptians were destroyed.
    For the passover was Christ, who was afterwards sacrificed, as also Isaiah said,
    ''He was led as a sheep to the slaughter.'' And it is written, that on the day
    of the passover you seized Him, and that also during the passover you crucified
    Him. And as the blood of the passover saved those who were in Egypt, so also the
    blood of Christ will deliver from death those who have believed. Would God, then,
    have been deceived if this sign had not been above the doors? I do not say that;
    but I affirm that He announced beforehand the future salvation for the human race
    through the blood of Christ. For the sign of the scarlet thread, which the spies,
    sent to Jericho by Joshua, son of Nave (Nun), gave to Rahab the harlot, telling
    her to bind it to the window through which she let them down to escape from their
    enemies, also manifested the symbol of the blood of Christ, by which those who
    were at one time harlots and unrighteous persons out of all nations are saved,
    receiving remission of sins, and continuing no longer in sin. 112 "But you, expounding
    these things in a low [and earthly] manner, impute much weakness to God, if you
    thus listen to them merely, and do not investigate the force of the words spoken.
    Since even Moses would in this way be considered a transgressor: for he enjoined
    that no likeness of anything in heaven, or on earth, or in the sea, be made; and
    then he himself made a brazen serpent and set it on a standard, and bade those
    who were bitten look at it: and they were saved when they looked at it. Will the
    serpent, then, which (I have already said) God had in the beginning cursed and
    cut off by the great sword, as Isaiah says, be understood as having preserved
    at that time the people? and shall we receive these things in the foolish acceptation
    of your teachers, and [regard] them not as signs? And shall we not rather refer
    the standard to the resemblance of the crucified Jesus, since also Moses by his
    outstretched hands, together with him who was named Jesus (Joshua), achieved a
    victory for your people? For in this way we shall cease to be at a loss about
    the things which the lawgiver did, when he, without forsaking God, persuaded the
    people to hope in a beast through which transgression and disobedience had their
    origin. And this was done and said by the blessed prophet with much intelligence
    and mystery; and there is nothing said or done by any one of the prophets, without
    exception, which one can justly reprehend, if he possess the knowledge which is
    in them. But if your teachers only expound to you why female cancels are spoken
    of in this passage, and are not in that; or why so many measures of fine flour
    and so many measures of oil [are used] in the offerings; and do so in a low and
    sordid manner, while they never venture either to speak of or to expound the points
    which are great and worthy of investigation, or command you to give no audience
    to us while we expound them, and to come not into conversation with us; will they
    not deserve to hear what our Lord Jesus Christ said to them: ''Whited sepulchres,
    which appear beautiful outward, and within are full of dead men''s bones; which
    pay tithe of mint, and swallow a camel: ye blind guides!'' If, then, you will
    not despise the doctrines of those who exalt themselves and wish to be called
    Rabbi, Rabbi, and come with such earnestness and intelligence to the words of
    prophecy as to suffer the same inflictions from your own people which the prophets
    themselves did, you cannot receive any advantage whatsoever from the prophetic
    writings. 113 "What I mean is this. Jesus (Joshua), as I have now frequently remarked,
    who was called Oshea, when he was sent to spy out the land of Canaan, was named
    by Moses Jesus (Joshua). Why he did this you neither ask, nor are at a loss about
    it, nor make strict inquiries. Therefore Christ has escaped your notice; and though
    you read, you understand not; and even now, though you hear that Jesus is our
    Christ, you consider not that the name was bestowed on Him not purposelessly nor
    by chance. But you make a theological discussion as to why one rho was added to
    Abraham''s first name; and as to why one ''p'' was added to Sarah''s name, you
    use similar high-sounding disputations. But why do you not similarly investigate
    the reason why the name of Oshea the son of Nave (Nun), which his father gave
    him, was changed to Jesus (Joshua)? But since not only was his name altered, but
    he was also appointed successor to Moses, being the only one of his contemporaries
    who came out from Egypt, he led the surviving people into the Holy Land; and as
    he, not Moses, led the people into the Holy Land, and as he distributed it by
    lot to those who entered along with him, so also Jesus the Christ will turn again
    the dispersion of the people, and will distribute the good land to each one, though
    not in the same manner. For the former gave them a temporary inheritance, seeing
    he was neither Christ who is God, nor the Son of God; but the latter, after the
    holy resurrection, shall give us the eternal possession. The former, after he
    had been named Jesus (Joshua), and after he had received strength from. His Spirit,
    caused the sun to stand still. For I have proved that it was Jesus who appeared
    to and conversed with Moses, and Abraham, and all the other patriarchs without
    exception, ministering to the will of the Father; who also, I say, came to be
    born man by the Virgin Mary, and I lives for ever. For the latter is He after
    whom and by whom the Father will renew both the heaven and the earth; this is
    He who shall shine an eternal light in Jerusalem; this is he who is the king of
    Salem after the order of Melchizedek, and the eternal Priest of the Most High.
    The former is said to have circumcised the people a second time with knives of
    stone (which was a sign of this circumcision with which Jesus Christ Himself has
    circumcised us from the idols made of stone and of other materials), and to have
    collected together those who were circumcised from the uncircumcision, i.e., from
    the error of the world, in every place by the knives of stone, to wit, the words
    of our Lord Jesus. For I have shown that Christ was proclaimed by the prophets
    in parables a Stone and a Rock. Accordingly the knives of stone we shall take
    to mean His words, by means of which so many who were in error have been circumcised
    from uncircumcision with the circumcision of the heart, with which God by Jesus
    commanded those from that time to be circumcised who derived their circumcision
    from Abraham, saying that Jesus (Joshua) would circumcise a second time with knives
    of stone those who entered into that holy land. 114 "For the Holy Spirit sometimes
    brought about that something, which was the type of the future, should be done
    clearly; sometimes He uttered words about what was to take place, as if it was
    then taking place, or had taken place. And unless those who read perceive this
    art, they will not be able to follow the words of the prophets as they ought.
    For example''s sake, I shall repeat some prophetic passages, that you may understand
    what I say. When He speaks by Isaiah, ''He was led as a sheep to the slaughter,
    and like a lamb before the shearer,'' He speaks as if the suffering had already
    taken place. And when He says again, ''I have stretched out my hands to a disobedient
    and gainsaying people;'' and when He says, ''Lord, who hath believed our report?''--the
    words are spoken as if announcing events which had already come to pass. For I
    have shown that Christ is oftentimes called a Stone in parable, and in figurative
    speech Jacob and Israel. And again, when He says, ''I shall behold the heavens,
    the works of Thy fingers,'' unless I understand His method of using words, I shall
    not understand intelligently, but just as your teachers suppose, fancying that
    the Father of all, the unbegotten God, has hands and feet, and fingers, and a
    soul, like a composite being; and they for this reason teach that it was the Father
    Himself who appeared to Abraham and to Jacob. Blessed therefore are we who have
    been circumcised the second time with knives of stone. For your first circumcision
    was and is performed by iron instruments, for you remain hard-hearted; but our
    circumcision, which is the second, having been instituted after yours, circumcises
    us from idolatry and from absolutely every kind of wickedness by sharp stones,
    i.e., by the words [preached] by the apostles of the corner-stone cut out without
    hands. And our hearts are thus circumcised from evil, so that we are happy to
    die for the name of the good Rock, which causes living water to burst forth for
    the hearts of those who by Him have loved the Father of all, and which gives those
    who are willing to drink of the water of life. But you do not comprehend me when
    I speak these things; for you have not understood what it has been prophesied
    that Christ would do, and you do not believe us who draw your attention to what
    has been written. For Jeremiah thus cries: ''Woe unto you! because you have forsaken
    the living fountain, and have digged for yourselves broken cisterns that can hold
    no water. Shall there be a wilderness where Mount Zion is, because I gave Jerusalem
    a bill of divorce in your sight?'' 115 "But you ought to believe Zechariah when
    he shows in parable the mystery of Christ, and announces it obscurely. The following
    are his words: ''Rejoice, and be glad, O daughter of Zion: for, lo, I come, and
    I shall dwell in the midst of thee, saith the Lord. And many nations shall be
    added to the Lord in that day. And they shall be my people, and I will dwell in
    the midst of thee; and they shall know that the Lord of hosts hath sent me unto
    thee. And the Lord shall inherit Judah his portion in the holy land, and He shall
    choose Jerusalem again. Let all flesh fear before the Lord, for He is raised up
    out of His holy clouds. And He showed me Jesus (Joshua) the high priest standing
    before the angel [of the Lord]; and the devil stood at his right hand to resist
    him. And the Lord said to the devil, The Lord who hath chosen Jerusalem rebuke
    thee. Behold, is not this a brand plucked out of the fire?'' " As Trypho was about
    to reply and contradict me, I said, "Wait and hear what I say first: for I am
    not to give the explanation which you suppose, as if there had been no priest
    of the name of Joshua (Jesus) in the land of Babylon, where your nation were prisoners.
    But even if I did, I have shown that if there was a priest named Joshua (Jesus)
    in your nation, yet the prophet had not seen him in his revelation, just as he
    had not seen either the devil or the angel of the Lord by eyesight, and in his
    waking condition, but in a trance, at the time when the revelation was made to
    him. But I now say, that as [Scripture] said that the Son of Nave (Nun) by the
    name Jesus (Joshua) wrought powerful works and exploits which proclaimed beforehand
    what would be performed by our Lord; so I proceed now to show that the revelation
    made among your people in Babylon in the days of Jesus (Joshua) the priest, was
    an announcement of the things to be accomplished by our Priest, who is God, and
    Christ the Son of God the Father of all. "Indeed, I wondered," continued I, "why
    a little ago you kept silence while I was speaking, and why you did not interrupt
    me when I said that the son of Nave (Nun) was the only one of contemporaries who
    came out of Egypt that entered the Holy Land along with the men described as younger
    than that generation. For you swarm and light on sores like flies. For though
    one should speak ten thousand words well, if there happen to be one little word
    displeasing to you, because not sufficiently intelligible or accurate, you make
    no account of the many good words, but lay hold of the little word, and are very
    zealous in setting it up as something impious and guilty; in order that, when
    you are judged with the very same judgment by God, you may have a much heavier
    account to render for your great audacities, whether evil actions, or bad interpretations
    which you obtain by falsifying the truth. For with what judgment you judge, it
    is righteous that you be judged withal. 116 "But to give you the account of the
    revelation of the holy Jesus Christ, I take up again my discourse, and I assert
    that even that revelation was made for us who believe on Christ the High Priest,
    namely this crucified One; and though we lived in fornication and all kinds of
    filthy conversation, we have by the grace of our Jesus, according to His Father''s
    will, stripped ourselves of all those filthy wickednesses with which we were imbued.
    And though the devil is ever at hand to resist us, and anxious to seduce all to
    himself, yet the Angel of God, i.e., the Power of God sent to us through Jesus
    Christ, rebukes him, and he departs from us. And we are just as if drawn out from
    the fire, when purified from our former sins, and [rescued] from the affliction
    and the fiery trial by which the devil and all his coadjutors try us; out of which
    Jesus the Son of God has promised again to deliver us, and invest us with prepared
    garments, if we do His commandments; and has undertaken to provide an eternal
    kingdom [for us]. For just as that Jesus (Joshua), called by the prophet a priest,
    evidently had on filthy garments because he is said to have taken a harlot for
    a wife, and is called a brand plucked out of the fire, because he had received
    remission of sins when the devil that resisted him was rebuked; even so we, who
    through the name of Jesus have believed as one man in God the Maker of all, have
    been stripped, through the name of His first-begotten Son, of the filthy garments,
    i.e., of our sins; and being vehemently inflamed by the word of His calling, we
    are the true high priestly race of God, as even God Himself bears witness, saying
    that in every place among the Gentiles sacrifices are presented to Him well-pleasing
    and pure. Now God receives sacrifices from no one, except through His priests.
    117 "Accordingly, God, anticipating all the sacrifices which we offer through
    this name, and which Jesus the Christ enjoined us to offer, i.e., in the Eucharist
    of the bread and the cup, and which are presented by Christians in all places
    throughout the world, bears witness that they are well-pleasing to Him. But He
    utterly rejects those presented by you and by those priests of yours, saying,
    ''And I will not accept your sacrifices at your hands; for from the rising of
    the sun to its setting my name is glorified among the Gentiles (He says); but
    ye profane it.'' Yet even now, in your love of contention, you assert that God
    does not accept the sacrifices of those who dwelt then in Jerusalem, and were
    called Israelites; but says that He is pleased with the prayers of the individuals
    of that nation then dispersed, and calls their prayers sacrifices. Now, that prayers
    and giving of thanks, when offered by worthy men, are the only perfect and well-pleasing
    sacrifices to God, I also admit. For such alone Christians have undertaken to
    offer, and in the remembrance effected by their solid and liquid food, whereby
    the suffering of the Son of God which He endured is brought to mind, whose name
    the high priests of your nation and your teachers have caused to be profaned and
    blasphemed over all the earth. But these filthy garments, which have been put
    by you on all who have become Christians by the name of Jesus, God shows shall
    be taken away from us, when He shall raise all men from the dead, and appoint
    some to be incorruptible, immortal, and free from sorrow in the everlasting and
    imperishable kingdom; but shall send others away to the everlasting punishment
    of fire. But as to you and your teachers deceiving yourselves when you interpret
    what the Scripture says as referring to those of your nation then in dispersion,
    and maintain that their prayers and sacrifices offered in every place are pure
    and well-pleasing, learn that you are speaking falsely, and trying by all means
    to cheat yourselves: for, first of all, not even now does your nation extend from
    the rising to the setting of the sun, but there are nations among which none of
    your race ever dwelt. For there is not one single race of men, whether barbarians,
    or Greeks, or whatever they may be called, nomads, or vagrants, or herdsmen living
    in tents, among whom prayers and giving of thanks are not offered through the
    name of the crucified Jesus. And then, as the Scriptures show, at the time when
    Malachi wrote this, your dispersion over all the earth, which now exists, had
    not taken place. 118 "So that you ought rather to desist from the love of strife,
    and repent before the great day of judgment come, wherein all those of your tribes
    who have pierced this Christ shall mourn as I have shown has been declared by
    the Scriptures. And I have explained that the Lord swore, ''after the order of
    Melchizedek,'' and what this prediction means; and the prophecy of Isaiah which
    says, ''His burial is taken away from the midst,'' I have already said, referred
    to the future burying and rising again of Christ; and I have frequently remarked
    that this very Christ is the Judge of all the living and the dead. And Nathan
    likewise, speaking to David about Him, thus continued: ''I will be His Father,
    and He shall be my Son; and my mercy shall I not take away from Him, as I did
    from them that went before Him; and I will establish Him in my house, and in His
    kingdom for ever.'' And Ezekiel says, ''There shall be no other prince in the
    house but He.'' For He is the chosen Priest and eternal King, the Christ, inasmuch
    as He is the Son of God; and do not suppose that Isaiah or the other prophets
    speak of sacrifices of blood or libations being presented at the altar on His
    second advent, but of true and spiritual praises and giving of thanks. And we
    have not in vain believed in Him, and have not been led astray by those who taught
    us such doctrines; but this has come to pass through the wonderful foreknowledge
    of God, in order that we, through the calling of the new and eternal covenant,
    that is, of Christ, might be found more intelligent and God-fearing than yourselves,
    who are considered to be lovers of God and men of understanding, but are not.
    Isaiah, filled with admiration of this, said: ''And kings shall shut their mouths:
    for those to whom no announcement has been made in regard to Him shall see; and
    those who heard not shall understand. Lord, who hath believed our report? and
    to whom is the arm of the Lord revealed?'' "And in repeating this, Trypho," I
    continued, "as far as is allowable, I endeavour to do so for the sake of those
    who came with you to-day, yet briefly and concisely." Then he replied, "You do
    well; and though you repeat the same things at considerable length, be assured
    that I and my companions listen with I pleasure." 119 Then I said again, "Would
    you suppose, sirs, that we could ever have understood these matters in the Scriptures,
    if we had not received grace to discern by the will of Him whose pleasure it was?
    in order that the saying of Moses might come to pass, ''They provoked me with
    strange [gods], they provoked me to anger with their abominations. They sacrificed
    to demons whom they knew not; new gods that came newly up, whom their fathers
    knew not. Thou hast forsaken God that begat thee, and forgotten God that brought
    thee up. And the Lord saw, and was jealous, and was provoked to anger by reason
    of the rage of His sons and daughters: and He said, I will turn My face away from
    them, and I will show what shall come on them at the last; for it is a very froward
    generation, children in whom is no faith. They have moved Me to jealousy with
    that which is not God, they have provoked Me to anger with their idols; and I
    will move them to jealousy with that which is not a nation, I will provoke them
    to anger with a foolish people. For a fire is kindled from Mine anger, and it
    shall burn to Hades. It shall consume the earth and her increase, and set on fire
    the foundations of the mountains; I will heap mischief on them.'' And after that
    Righteous One was put to death, we flourished as another people, and shot forth
    as new and prosperous corn; as the prophets said, ''And many nations shall betake
    themselves to the Lord in that day for a people: and they shall dwell in the midst
    of all the earth.'' But we are not only a people, but also a holy people, as we
    have shown already. ''And they shall call them the holy people, redeemed by the
    Lord.'' Therefore we are not a people to be despised, nor a barbarous race, nor
    such as the Carian and Phrygian nations; but God has even chosen us and He has
    become manifest to those who asked not after Him. ''Behold, I am God,'' He says,
    ''to the nation which called not on My name.'' For this is that nation which God
    of old promised to Abraham, when He declared that He would make him a father of
    many nations; not meaning, however, the Arabians, or Egyptians, or Idumaeans,
    since Ishmael became the father of a mighty nation, and so did Esau; and there
    is now a great multitude of Ammonites. Noah, moreover, was the father of Abraham,
    and in fact of all men; and others were the progenitors of others. What larger
    measure of grace, then, did Christ bestow on Abraham? This, namely, that He called
    him with His voice by the like calling, telling him to quit the land wherein he
    dwelt. And He has called all of us by that voice, and we have left already the
    way of living in which we used to spend our days, passing our time in evil after
    the fashions of the other inhabitants of the earth; and along with Abraham we
    shall inherit the holy land, when we shall receive the inheritance for an endless
    eternity, being children of Abraham through the like faith. For as he believed
    the voice of God, and it was imputed to him for righteousness, in like manner
    we having believed God''s voice spoken by the apostles of Christ, and promulgated
    to us by the prophets, have renounced even to death all the things of the world.
    Accordingly, He promises to him a nation of similar faith, God-fearing, righteous,
    and delighting the Father; but it is not you, ''in whom is no faith.'' 120 "Observe,
    too, how the same promises are made to Isaac and to Jacob. For thus He speaks
    to Isaac: ''And in thy seed shall all the nations of the earth be blessed.'' And
    to Jacob: ''And in thee and in thy seed shall all families of the earth be blessed.''
    He says that neither to Esau nor to Reuben, nor to any other; only to those of
    whom the Christ should arise, according to the dispensation, through the Virgin
    Mary. But if you would consider the blessing of Judah, you would perceive what
    I say. For the seed is divided from Jacob, and comes down through Judah, and Phares,
    and Jesse, and David. And this was a symbol of the fact that some of your nation
    would be found children of Abraham, and found, too, in the lot of Christ; but
    that others, who are indeed children of Abraham, would be like the sand on the
    sea-shore, barren and fruitless, much in quantity, and without number indeed,
    but bearing no fruit whatever, and only drinking the water of the sea. And a vast
    multitude in your nation are convicted of being of this kind, imbibing doctrines
    of bitterness and godlessness, but spurning the word of God. He speaks therefore
    in the passage relating to Judah: ''A prince shall not fail from Judah, nor a
    ruler from his thighs, till that which is laid up for him come; and He shall be
    the expectation of the nations.'' And it is plain that this was spoken not of
    Judah, but of Christ. For all we out of all nations do expect not Judah, but Jesus,
    who led your fathers out of Egypt. For the prophecy referred even to the advent
    of Christ: ''Till He come for whom this is laid up, and He shall be the expectation
    of nations.'' Jesus came, therefore, as we have shown at length, and is expected
    again to appear above the clouds; whose name you profane, and labour hard to get
    it profaned over all the earth. It were possible for me, sirs," I continued, "to
    contend against you about the reading which you so interpret, saying it is written,
    ''Till the things laid up for Him come;'' though the Seventy have not so explained
    it, but thus, ''Till He comes for whom this is laid up.'' But since what follows
    indicates that the reference is to Christ (for it is, ''and He shall be the expectation
    of nations''), I do not proceed to have a mere verbal controversy with you, as
    I have not attempted to establish proof about Christ from the passages of Scripture
    which are not admitted by you? which I quoted from the words of Jeremiah the prophet,
    and Esdras, and David; but from those which are even now admitted by you, which
    had your teachers comprehended, be well assured they would have deleted them,
    as they did those about the death of Isaiah, whom you sawed asunder with a wooden
    saw. And this was a mysterious type of Christ being about to cut your nation in
    two, and to raise those worthy of the honour to the everlasting kingdom along
    with the holy patriarchs and prophets; but He has said that He will send others
    to the condemnation of the unquenchable fire along with similar disobedient and
    impenitent men from all the nations. ''For they shall come,'' He said, ''from
    the west and from the east, and shall sit down with Abraham, and Isaac, and Jacob
    in the kingdom of heaven; but the children of the kingdom shall be cast out into
    outer darkness.'' And I have mentioned these things, taking nothing whatever into
    consideration, except the speaking of the truth, and refusing to be coerced by
    any one, even though I should be forthwith torn in pieces by you. For I gave no
    thought to any of my people, that is, the Samaritans, when I had a communication
    in writing with Caesar, but stated that they were wrong in trusting to the magician
    Simon of their own nation, who, they say, is God above all power, and authority,
    and might." 121 And as they kept silence, I went on: "[The Scripture], speaking
    by David about this Christ, my friends, said no longer that ''in His seed'' the
    nations should be blessed, but ''in Him.'' So it is here: ''His name shall rise
    up for ever above the sun; and in Him shall all nations be blessed.'' But if all
    nations are blessed in Christ, and we of all nations believe in Him, then He is
    indeed the Christ, and we are those blessed by Him. God formerly gave the sun
    as an object of worship, as it is written, but no one ever was seen to endure
    death on account of his faith in the sun; but for the name of Jesus you may see
    men of every nation who have endured and do endure all sufferings, rather than
    deny Him. For the word of His truth and wisdom is more ardent and more light-giving
    than the rays of the sun, and sinks down into the depths of heart and mind. Hence
    also the Scripture said, ''His name shall rise up above the sun.'' And again,
    Zechariah says, ''His name is the East.'' And speaking of the same, he says that
    ''each tribe shall mourn.'' But if He so shone forth and was so mighty in His
    first advent (which was without honour and comeliness, and very contemptible),
    that in no nation He is unknown, and everywhere men have repented of the old wickedness
    in each nation''s way of living, so that even demons were subject to His name,
    and all powers and kingdoms feared His name more than they feared all the dead,
    shall He not on His glorious advent destroy by all means all those who hated Him,
    and who unrighteously departed from Him, but give rest to His own, rewarding them
    with all they have looked for? To us, therefore, it has been granted to hear,
    and to understand, and to be saved by this Christ, and to recognise all the [truths
    revealed] by the Father. Wherefore He said to Him: ''It is a great thing for Thee
    to be called my servant, to raise up the tribes of Jacob, and turn again the dispersed
    of Israel. I have appointed Thee for a light to the Gentiles, that Thou mayest
    be their salvation unto the end of the earth.'' 122 "You think that these words
    refer to the stranger and the proselytes, but in fact they refer to us who have
    been illumined by Jesus. For Christ would have borne witness even to them; but
    now you are become twofold more the children of hell, as He said Himself. Therefore
    what was written by the prophets was spoken not of those persons, but of us, concerning
    whom the Scripture speaks: ''I will lead the blind by a way which they knew not;
    and they shall walk in paths which they have not known. And I am witness, saith
    the Lord God, and my servant whom I have chosen.'' To whom, then, does Christ
    bear witness? Manifestly to those who have believed. But the proselytes not only
    do not believe, but twofold more than yourselves blaspheme His name, and wish
    to torture and put to death us who believe in Him; for in all points they strive
    to be like you. And again in other words He cries: ''I the Lord have called Thee
    in righteousness, and will hold Thine hand, and will strengthen Thee, and will
    give Thee for a covenant of the people, for a light of the Gentiles, to open the
    eyes of the blind, to bring out the prisoners from their bonds.'' These words,
    indeed, sirs, refer also to Christ, and concern the enlightened nations; or will
    you say again, He speaks to them of the law and the proselytes?" Then some of
    those who had come on the second day cried out as if they had been in a theatre,
    "But what? does He not refer to the law, and to those illumined by it? Now these
    are proselytes." "No," I said, looking towards Trypho, "since, if the law were
    able to enlighten the nations and those who possess it, what need is there of
    a new covenant? But since God announced beforehand that He would send a new covenant,
    and an everlasting law and commandment, we will not understand this of the old
    law and its proselytes, but of Christ and His proselytes, namely us Gentiles,
    whom He has illumined, as He says somewhere: ''Thus saith the Lord, In an acceptable
    time have I heard Thee, and in a day of salvation have I helped Thee, and I have
    given Thee for a covenant of the people, to establish the earth, and to inherit
    the deserted.'' What, then, is Christ''s inheritance? Is it not the nations? What
    is the covenant of God? Is it not Christ? As He says in another place: ''Thou
    art my Son; this day have I begotten Thee. Ask of Me, and I shall give Thee the
    nations for Thine inheritance, and the uttermost parts of the earth for Thy possession.''
    123 "As, therefore, all these latter prophecies refer to Christ and the nations,
    you should believe that the former refer to Him and them in like manner. For the
    proselytes have no need of a covenant, if, since there is one and the same law
    imposed on all that are circumcised, the Scripture speaks about them thus: ''And
    the stranger shall also be joined with them, and shall be joined to the house
    of Jacob;'' and because the proselyte, who is circumcised that he may have access
    to the people, becomes like one of themselves, while we who have been deemed worthy
    to be called a people are yet Gentiles, because we have not been circumcised.
    Besides, it is ridiculous for you to imagine that the eyes of the proselytes are
    to be opened while your own are not, and that you be understood as blind and deaf
    while they are enlightened. And it will be still more ridiculous for you, if you
    say that the law has been given to the nations, but you have not known it. For
    you would have stood in awe of God''s wrath, and would not have been lawless,
    wandering sons; being much afraid of hearing God always say, ''Children in whom
    is no faith. And who are blind, but my servants? and deaf, but they that rule
    over them? And the servants of God have been made blind. You see often, but have
    not observed; your ears have been opened, and you have not heard.'' Is God''s
    commendation of you honourable? and is God''s testimony seemly for His servants?
    You are not ashamed though you often hear these words. You do not tremble at God''s
    threats, for you are a people foolish and hard-hearted. ''Therefore, behold, I
    will proceed to remove this people,'' saith the Lord;'' and I will remove them,
    and destroy the wisdom of the wise, and hide the understanding of the prudent.''
    Deservedly too: for you are neither wise nor prudent, but crafty and unscrupulous;
    wise only to do evil, but utterly incompetent to know the hidden counsel of God,
    or the faithful covenant of the Lord, or to find out the everlasting paths. ''Therefore,
    saith the Lord, I will raise up to Israel and to Judah the seed of men and the
    seed of beasts.'' And by Isaiah He speaks thus concerning another Israel: ''In
    that day shall there be a third Israel among the Assyrians and the Egyptians,
    blessed in the land which the Lord of Sabaoth hath blessed, saying, blessed shall
    my people in Egypt and in Assyria be, and Israel mine inheritance.'' Since then
    God blesses this people, and calls them Israel, and declares them to be His inheritance,
    how is it that you repent not of the deception you practise on yourselves, as
    if you alone were the Israel, and of execrating the people whom God has blessed?
    For when He speaks to Jerusalem and its environs, He thus added: ''And I will
    beget men upon you, even my people Israel; and they shall inherit you, and you
    shall be a possession for them; and you shall be no longer bereaved of them.''"
    "What, then?" says Trypho; "are you Israel? and speaks He such things of you?"
    "If, indeed," I replied to him, "we had not entered into a lengthy discussion
    on these topics, I might have doubted whether you ask this question in ignorance;
    but since we have brought the matter to a conclusion by demonstration and with
    your assent, I do not believe that you are ignorant of what I have just said,
    or desire again mere contention, but that you are urging me to exhibit the same
    proof to these men." And in compliance with the assent expressed in his eyes,
    I continued: "Again in Isaiah, if you have ears to hear it, God, speaking of Christ
    in parable, calls Him Jacob and Israel. He speaks thus: ''Jacob is my servant,
    I will uphold Him; Israel is mine elect, I will put my Spirit upon Him, and He
    shall bring forth judgment to the Gentiles. He shall not strive, nor cry, neither
    shall any one hear His voice in the street: a bruised reed He shall not break,
    and smoking flax He shall not quench; but He shall bring forth judgment to truth:
    He shall shine, and shall not be broken till He have set judgment on the earth.
    And in His name shall the Gentiles trust.'' As therefore from the one man Jacob,
    who was surnamed Israel, all your nation has been called Jacob and Israel; so
    we from Christ, who begat us unto God, like Jacob, and Israel, and Judah, and
    Joseph, and David, are called and are the true sons of God, and keep the commandments
    of Christ." 124 And when I saw that they were perturbed because I said that we
    are the sons of God, I anticipated their questioning, and said, "Listen, sirs,
    how the Holy Ghost speaks of this people, saying that they are all sons of the
    Highest; and how this very Christ will be present in their assembly, rendering
    judgment to all men. The words are spoken by David, and are, according to your
    version of them, thus: ''God standeth in the congregation of gods; He judgeth
    among the gods. How long do ye judge unjustly, and accept the persons of the wicked?
    Judge for the orphan and the poor, and do justice to the humble and needy. Deliver
    the needy, and save the poor out of the hand of the wicked. They know not, neither
    have they understood; they walk on in darkness: all the foundations of the earth
    shall be shaken. I said, Ye are gods, and are all children of the Most High. But
    ye die like men, and fall like one of the princes. Arise, O God! judge the earth,
    for Thou shalt inherit all nations.'' But in the version of the Seventy it is
    written, ''Behold, ye die like men, and fall like one of the princes, in order
    to manifest the disobedience of men,--I mean of Adam and Eve,--and the fall of
    one of the princes, i.e., of him who was called the serpent, who fell with a great
    overthrow, because he deceived Eve. But as my discourse is not intended to touch
    on this point, but to prove to you that the Holy Ghost reproaches men because
    they were made like God, free from suffering and death, provided that they kept
    His commandments, and were deemed deserving of the name of His sons, and yet they,
    becoming like Adam and Eve, work out death for themselves; let the interpretation
    of the Psalm be held just as you wish, yet thereby it is demonstrated that all
    men are deemed worthy of becoming "gods," and of having power to become sons of
    the Highest; and shall be each by himself judged and condemned like Adam and Eve.
    Now I have proved at length that Christ is called God. 125 "I wish, sirs," I said,
    "to learn from you what is the force of the name Israel." And as they were silent,
    I continued: "I shall tell you what I know: for I do not think it fight, when
    I know, not to speak; or, suspecting that you do know, and yet from envy or from
    voluntary ignorance deceive yourselves, to be continually solicitous; but I speak
    all things simply and candidly, as my Lord said: ''A sower went forth to sow the
    seed; and some fell by the wayside; and some among thorns, and some on stony ground,
    and some on good ground.'' I must speak, then, in the hope of finding good ground
    somewhere; since that Lord of mine, as One strong and powerful, comes to demand
    back His own from all, land will not condemn His steward if He recognises that
    he, by the knowledge that the Lord is powerful and has come to demand His own,
    has given it to every bank, and has not digged for any cause whatsoever. Accordingly
    the name Israel signifies this, A man who overcomes power; for Isra is a man overcoming,
    and El is power. And that Christ would act so when He became man was foretold
    by the mystery of Jacob''s wrestling with Him who appeared to him, in that He
    ministered to the will of the Father, yet nevertheless is God, in that He is the
    first-begotten of all creatures. For when He became man, as I previously remarked,
    the devil came to Him--i.e., that power which is called the serpent and Sa-tan--tempting
    Him, and striving to effect His downfall by asking Him to worship him. But He
    destroyed and overthrew the devil, having proved him to be wicked, in that he
    asked to be worshipper as God, contrary to the Scripture; who is an apostate from
    the will of God. For He answers him, ''It is written, Thou shalt worship the Lord
    thy God, and Him only shall thou serve.'' Then, overcome and convicted, the devil
    departed at that time. But since our Christ was to be numbed, i.e., by pain and
    experience of suffering, He made a previous intimation of this by touching Jacob''s
    thigh, and causing it to shrink. But Israel was His name from the beginning, to
    which He altered the name of the blessed Jacob when He blessed him with His own
    name, proclaiming thereby that all who through Him have fled for refuge to the
    Father, constitute the blessed Israel. But you, having understood none of this,
    and not being prepared to understand, since you are the children of Jacob after
    the fleshly seed, expect that you shall be assuredly saved. But that you deceive
    yourselves in such matters, I have proved by many words. 126 "But if you knew,
    Trypho," continued I, "who He is that is called at one time the Angel of great
    counsel, and a Man by Ezekiel, and like the Son of man by Daniel, and a Child
    by Isaiah, and Christ and God to be worshipped by David, and Christ and a Stone
    by many, and Wisdom by Solomon, and Joseph and Judah and a Star by Moses, and
    the East by Zechariah, and the Suffering One and Jacob and Israel by Isaiah again,
    and a Rod, and Flower, and Corner-Stone, and Son of God, you would not have blasphemer
    Him who has now come, and been born, and suffered, and ascended to heaven; who
    shall also come again, and then your twelve tribes shall mourn. For if you had
    understood what has been written by the prophets, you would not have denied that
    He was God, Son of the only, unbegotten, unutterable God. For Moses says somewhere
    in Exodus the following: ''The Lord spoke to Moses, and said to him, I am the
    Lord, and I appeared to Abraham, to Isaac, and to Jacob, being their God; and
    my name I revealed not to them, and I established my covenant with them.'' And
    thus again he says, ''A man wrestled with Jacob,'' and asserts it was God; narrating
    that Jacob said, ''I have seen God face to face, and my life is preserved.'' And
    it is recorded that he called the place where He wrestled with him, appeared to
    and blessed him, the Face of God (Peniel). And Moses says that God appeared also
    to Abraham near the oak in Mature, when he was sitting at the door of his tent
    at mid-day. Then he goes on to say: ''And he lifted up his eyes and looked, and,
    behold, three men stood before him; and when he saw them, he ran to meet them.''
    a After a little, one of them promises a son to Abraham: ''Wherefore did Sarah
    laugh, saying, Shall. I of a surety bear a child, and I am old? Is anything impossible
    with God? At the time appointed I will return, according to the time of life,
    and Sarah shall have a son. And they went away from Abraham.'' Again he speaks
    of them thus: ''And the men rose up from thence, and looked toward Sodom.'' Then
    to Abraham He who was and is again speaks: ''I will not hide from Abraham, my
    servant, what I intend to do.''" And what follows in the writings of Moses I quoted
    and explained; "from which I have demonstrated," I said, "that He who is described
    as God appeared to Abraham, to Isaac, and to Jacob, and the other patriarchs,
    was appointed under the authority of the Father and Lord, and ministers to His
    will." Then I went on to say what I had not said before: "And so, when the people
    desired to eat flesh, and Moses had lost faith in Him, who also there is called
    the Angel, and who promised that God would give them to satiety, He who is both
    God and the Angel, sent by the Father, is described as saying and doing these
    things. For thus the Scripture says: ''And the Lord said to Moses Will the Lord''s
    hand not be sufficient? thou shall know now whether my word shall conceal thee
    or not.'' And again, in other words, it thus says: ''But the Lord spoke unto me,
    Thou shalt not go over this Jordan: the Lord thy God, who goeth before thy face,
    He shall cut off the nations.'' 127 "These and other such sayings are recorded
    by the lawgiver and by the prophets; and I suppose that I have stated sufficiently,
    that wherever God says, ''God went up from Abraham,'' or, ''The Lord spake to
    Moses,'' and ''The Lord came down to behold the tower which the sons of men had
    built,'' or when ''God shut Noah into the ark,'' you must not imagine that the
    unbegotten God Himself came down or went up from any place. For the ineffable
    Father and Lord of all neither has come to any place, nor walks, nor sleeps, nor
    rises up, but remains in His own place, wherever that is, quick to behold and
    quick to hear, having neither eyes nor ears, but being of indescribable might;
    and He sees all things, and knows all things, and none of us escapes His observation;
    and He is not moved or confined to a spot in the whole world, for He existed before
    the world was made. How, then, could He talk with any one, or be seen by any one,
    or appear on the smallest portion of the earth, when the people at Sinai were
    not able to look even on the glory of Him who was sent from Him; and Moses himself
    could not enter into the tabernacle which he had erected, when it was filled with
    the glory of God; and the priest could not endure to stand before the temple when
    Solomon conveyed the ark into the house in Jerusalem which he had built for it?
    Therefore neither Abraham, nor Isaac, nor Jacob, nor any other man, saw the Father
    and ineffable Lord of all, and also of Christ, but [saw] Him who was according
    to His will His Son, being God, and the Angel because He ministered to His will;
    whom also it pleased Him to be born man by the Virgin; who also was fire when
    He conversed with Moses from the bush. Since, unless we thus comprehend the Scriptures,
    it must follow that the Father and Lord of all had not been in heaven when what
    Moses wrote took place: ''And the Lord rained upon Sodom fire and brimstone from
    the Lord out of heaven;'' and again, when it is thus said by David: ''Lift up
    your gates, ye rulers; and be ye lift up, ye everlasting gates; and the King of
    glory shall enter;'' and again, when He says: ''The Lord says to my Lord, Sit
    at My right hand, till I make Thine enemies Thy footstool.'' 128 "And that Christ
    being Lord, and God the Son of God, and appearing formerly in power as Man, and
    Angel, and in the glory of fire as at the bush, so also was manifested at the
    judgment executed on Sodom, has been demonstrated fully by what has been said."
    Then I repeated once more all that I had previously quoted from Exodus, about
    the vision in the bush, and the naming of Joshua (Jesus), and continued: "And
    do not suppose, sirs, that I am speaking superfluously when I repeat these words
    frequently: but it is because I know that some wish to anticipate these remarks,
    and to say that the power sent from the Father of all which appeared to Moses,
    or to Abraham, or to Jacob, is called an Angel because He came to men (for by
    Him the commands of the Father have been proclaimed to men); is called Glory,
    because He appears in a vision sometimes that cannot be borne; is called a Man,
    and a human being, because He appears strayed in such forms as the Father pleases;
    and they call Him the Word, because He carries tidings from the Father to men:
    but maintain that this power is indivisible and inseparable from the Father, just
    as they say that the light of the sun on earth is indivisible and inseparable
    from the sun in the heavens; as when it sinks, the light sinks along with it;
    so the Father, when He chooses, say they, causes His power to spring forth, and
    when He chooses, He makes it return to Himself. In this way, they teach, He made
    the angels. But it is proved that there are angels who always exist, and are never
    reduced to that form out of which they sprang. And that this power which the prophetic
    word calls God, as has been also amply demonstrated, and Angel, is not numbered
    [as different] in name only like the light of the sun but is indeed something
    numerically distinct, I have discussed briefly in what has gone before; when I
    asserted that this power was begotten from the Father, by His power and will,
    but not by abscission, as if the essence of the Father were divided; as all other
    things partitioned and divided are not the same after as before they were divided:
    and, for the sake of example, I took the case of fires kindled from a fire, which
    we see to be distinct from it, and yet that from which many can be kindled is
    by no means made less, but remains the same. 129 "And now I shall again recite
    the words which I have spoken in proof of this point. When Scripture says,'' The
    Lord rained fire from the Lord out of heaven,'' the prophetic word indicates that
    there were two in number: One upon the earth, who, it says, descended to behold
    the cry of Sodom; Another in heaven, who also is Lord of the Lord on earth, as
    He is Father and God; the cause of His power and of His being Lord and God. Again,
    when the Scripture records that God said in the beginning, ''Behold, Adam has
    become like one of Us,'' this phrase, ''like one of Us,'' is also indicative of
    number; and the words do not admit of a figurative meaning, as the sophists endeavour
    to affix on them, who are able neither to tell nor to understand the truth. And
    it is written in the book of Wisdom: ''If I should tell you daily events, I would
    be mindful to enumerate them from the beginning. The Lord created me the beginning
    of His ways for His works. From everlasting He established me in the beginning,
    before He formed the earth, and before He made the depths, and before the springs
    of waters came forth, before the mountains were settled; He begets me before all
    the hills.''" When I repeated these words, I added: "You perceive, my hearers,
    if you bestow attention, that the Scripture has declared that this Offspring was
    begotten by the Father before all things created; and that which is begotten is
    numerically distinct from that which begets, any one will admit." 130 And when
    all had given assent, I said: "I would now adduce some passages which I had not
    recounted before. They are recorded by the faithful servant Moses in parable,
    and are as follows: ''Rejoice, O ye heavens, with Him, and let all the angels
    of God worship Him;''" and I added what follows of the passage: "''Rejoice, O
    ye nations, with His people, and let all the angels of God be strengthened in
    Him: for the blood of His sons He avenges, and will avenge, and will recompense
    His enemies with vengeance, and will recompense those that hate Him; and the Lord
    will purify the land of His people.'' And by these words He declares that we,
    the nations, rejoice with His people,--to wit, Abraham, and Isaac, and Jacob,
    and the prophets, and, in short, all of that people who are well-pleasing to God,
    according to what has been already agreed on between us. But we will not receive
    it of all your nation; since we know from Isaiah that the members of those who
    have transgressed shall be consumed by the worm and unquenchable fire, remaining
    immortal; so that they become a spectacle to all flesh. But in addition to these,
    I wish, sin," said I, "to add some other passages from the very words of Moses,
    from which you may understand that God has from of old dispersed all men according
    to their kindreds and tongues; and out of all kindreds has taken to Himself your
    kindred, a useless, disobedient, and faithless generation; and has shown that
    those who were selected out of every nation have obeyed His will through Christ,--whom
    He calls also Jacob, and names Israel,--and these, then, as I mentioned fully
    previously, must be Jacob and Israel. For when He says, ''Rejoice, O ye nations,
    with His people,'' He allots the same inheritance to them, and does not call them
    by the same name; but when He says that they as Gentiles rejoice with His people,
    He calls them Gentiles to reproach you. For even as you provoked Him to anger
    by your idolatry, so also He has deemed those who were idolaters worthy of knowing
    His will, and of inheriting His inheritance. 131 "But I shall quote the passage
    by which it is made known that God divided all the nations. It is as follows:
    ''Ask thy father, and he will show thee; thine eiders, and they will tell thee;
    when the Most High divided the nations, as He dispersed the sons of Adam. He set
    the bounds of the nations according to the numbers of the children of Israel;
    and the Lord''s portion became His people Jacob, and Israel was the lot of His
    inheritance.''" And having said this, I added: "The Seventy have translated it,
    ''He set the bounds of the nations according to the number of the angels of God.''
    But because my argument is again in nowise weakened by this, I have adopted your
    exposition. And you yourselves, if you will confess the truth, must acknowledge
    that we, who have been called by God through the despised and shameful mystery
    of the cross (for the confession of which, and obedience to which, and for our
    piety, punishments even to death have been inflicted on us by demons, and by the
    host of the devil, through the aid ministered to them by you), and endure all
    torments rather than deny Christ even by word, through whom we are called to the
    salvation prepared beforehand by the Father, are more faithful to God than you,
    who were redeemed from Egypt with a high hand and a visitation of great glory,
    when the sea was parted for you, and a passage left dry, in which [God] slew those
    @ho pursued you with a very great equipment, and splendid chariots, bringing back
    upon them the sea which had been made a way for your sakes; on whom also a pillar
    of light shone, in order that you, more than any other nation in the world, might
    possess a peculiar light, never-failing and never-setting; for whom He rained
    manna as nourishment, fit for the heavenly angels, in order that you might have
    no need to prepare your food; and the water at Marah was made sweet; and a sign
    of Him that was to be crucified was made, both in the matter of the serpents which
    bit you, as I already mentioned (God anticipating before the proper times these
    mysteries, in order to confer grace upon you, to whom you are always convicted
    of being thankless), as well as in the type of the extending of the hands of Moses,
    and of Oshea being named Jesus (Joshua); when you fought against Amalek: concerning
    which God enjoined that the incident be recorded, and the name of Jesus laid up
    in your understandings; saying that this is He who would blot out the memorial
    of Amalek from under heaven. Now it is clear that the memorial of Amalek remained
    after the son of Nave (Nun): but He makes it manifest through Jesus, who was crucified,
    of whom also those symbols were fore-announcements of all that would happen to
    Him, the demons would be destroyed, and would dread His name, and that all principalities
    and kingdoms would fear Him; and that they who believe in Him out of all nations
    would be shown as God-fearing and peaceful men; and the facts already quoted by
    me, Trypho, indicate this. Again, when you desired flesh, so vast a quantity of
    quails was given you, that they could not be told; for whom also water gushed
    from the rock; and a cloud followed you for a shade from heat, and covering from
    cold, declaring the manner and signification of another and new heaven; the latchets
    of your shoes did not break, and your shoes waxed not old, and your garments wore
    not away, but even those of the children grew along with them. 132 "Yet after
    this you made a calf, and were very zealous in committing fornication with the
    daughters of strangers, and in serving idols. And again, when the land was given
    up to you with so great a display of power, that you witnessed the sun stand still
    in the heavens by the order of that man whose name was Jesus (Joshua), and not
    go down for thirty-six hours, as well as all the other miracles which were wrought
    for you as time served; and of these it seems good to me now to speak of another,
    for it conduces to your hereby knowing Jesus, whom we also know to have been Christ
    the Son of God, who was crucified, and rose again, and ascended to heaven, and
    will come again to judge all men, even up to Adam himself. You are aware, then,"
    I continued, "that when the ark of the testimony was seized by the enemies of
    Ashdod, and a terrible and incurable malady had broken out among them, they resolved
    to place it on a cart to which they yoked cows that had recently calved, for the
    purpose of ascertaining by trial whether or not they had been plagued by God''s
    power on account of the ark, and if God wished it to be taken back to the place
    from which it had been carried away. And when they had done this, the cows, led
    by no man, went not to the place whence the ark had been taken, but to the fields
    of a certain man whose name was Oshea, the same as his whose name was altered
    to Jesus (Joshua), as has been previously mentioned, who also led the people into
    the land and meted it out to them: and when the cows had come into these fields
    they remained there, showing to you thereby that they were guided by the name
    of power; just as formerly the people who survived of those that came out of Egypt,
    were guided into the land by him who had received the name Jesus (Joshua), who
    before was called Oshea. 133 "Now, although these and all other such unexpected
    and marvellous works were wrought amongst and seen by you at different times,
    yet you are convicted by the prophets of having gone to such a length as offering
    your own children to demons; and besides all this, of having dared to do such
    things against Christ; and you still dare to do them: for all which may it be
    granted to you to obtain mercy and salvation from God and His Christ. For God,
    knowing before that you would do such things, pronounced this curse upon you by
    the prophet Isaiah: ''Woe unto their soul! they have devised evil counsel against
    themselves, saying, Let us bind the righteous man, for he is distasteful to us.
    Therefore they shall eat the fruit of their own doings. Woe to the wicked! evil,
    according to the works of his hands, shall befall him. O my people, your exactors
    glean you, and those who extort from you shall rule over you. O my people, they
    who call you blessed cause you to err, and disorder the way of your paths. But
    now the Lord shall sist His people to judgment, and He shall enter into judgment
    with the elders of the people and the princes thereof. But why have you burnt
    up my vineyard? and why is the spoil of the poor found in your houses? Why do
    you wrong my people, and put to shame the countenance of the humble?'' Again,
    in other words, the same prophet spake to the same effect: ''Woe unto them that
    draw their iniquity as with a long cord, and their transgressions as with the
    harness of an heifer''s yoke: who say, Let His speed come near, and let the counsel
    of the Holy One of Israel come, that we may know it. Woe unto them that call evil
    good, and good evil! that put light for darkness, and darkness for light! that
    put bitter for sweet, and sweet for bitter! Woe unto them that are wise in their
    own eyes, and prudent in their own sight! Woe unto those that are mighty among
    you, who drink wine, who are men of strength, who mingle strong drink! who justify
    the wicked for a reward, and take away justice from the righteous! Therefore,
    as the stubble shall be burnt by the coal of fire, and utterly consumed by the
    burning flame, their root shall be as wool, and their flower shall go up like
    dust. For they would not have the law of the Lord of Sabaoth, but despised the
    word of the Lord, the Holy One of Israel. And the Lord of Sabaoth was very angry,
    and laid His hands upon them, and smote them; and He was provoked against the
    mountains, and their carcases were in the midst like dung on the road. And for
    all this they have not repented, but their hand is still high.'' For verily your
    hand is high to commit evil, because ye slew the Christ, and do not repent of
    it; but so far from that, ye hate and murder us who have believed through Him
    in the God and Father of all, as often as ye can; and ye curse Him without ceasing,
    as well as those who side with Him; while all of us pray for you, and for all
    men, as our Christ and Lord taught us to do, when He enjoined us to pray even
    for our enemies, and to love them that hate us, and to bless them that curse us.
    134 "If, then, the teaching of the prophets and of Himself moves you, it is better
    for you to follow God than your imprudent and blind masters, who even till this
    time permit each man to have four or five wives; and if any one see a beautiful
    woman and desire to have her, they quote the doings of Jacob [called] Israel,
    and of the other patriarchs, and maintain that it is not wrong to do such things;
    for they are miserably ignorant in this matter. For, as I before said, certain
    dispensations of weighty mysteries were accomplished in each act of this sort.
    For in the marriages of Jacob I shall mention what dispensation and prophecy were
    accomplished, in order that you may thereby know that your teachers never looked
    at the divine motive which prompted each act, but only at the grovelling and corrupting
    passions. Attend therefore to what I say. The marriages of Jacob were types of
    that which Christ was about to accomplish. For it was not lawful for Jacob to
    marry two sisters at once. And he serves Laban for [one of] the daughters; and
    being deceived in [the obtaining of] the younger, he again served seven years.
    Now Leah is your people and synagogue; but Rachel is our Church. And for these,
    and for the servants in both, Christ even now serves. For while Noah gave to the
    two sons the seed of the third as servants, now on the other hand Christ has come
    to restore both the free sons and the servants amongst them, conferring the same
    honour on all of them who keep His commandments; even as the children of the free
    women and the children of the bond women born to Jacob were all sons, and equal
    in dignity. And it was foretold what each should be according to rank and according
    to fore-knowledge. Jacob served Laban for speckled and many-spotted sheep; and
    Christ served, even to the slavery of the cross, for the various and many-formed
    races of mankind, acquiring them by the blood and mystery of the cross. Leah was
    weak-eyed; for the eyes of your souls are excessively weak. Rachel stole the gods
    of Laban, and has hid them to this day; and we have lost our paternal and material
    gods. Jacob was hated for all time by his brother; and we now, and our Lord Himself,
    are hated by you and by all men, though we are brothers by nature. Jacob was called
    Israel; and Israel has been demonstrated to be the Christ, who is, and is called,
    Jesus. 135 "And when Scripture says, ''I am the Lord God, the Holy One of Israel,
    who have made known Israel your King,'' will you not understand that truly Christ
    is the everlasting King? For you are aware that Jacob the son of Isaac was never
    a king. And therefore Scripture again, explaining to us, says what king is meant
    by Jacob and Israel: ''Jacob is my Servant, I will uphold Him; and Israel is mine
    Elect, my soul shall receive Him. I have given Him my Spirit; and He shall bring
    forth judgment to the Gentiles. He shall not cry, and His voice shall not be heard
    without. The bruised reed He shall not break, and the smoking flax He shall not
    quench, until He shall bring forth judgment to victory. He shall shine, and shall
    not be broken, until He set judgment on the earth. And in His name shall the Gentiles
    trust.'' Then is it Jacob the patriarch in whom the Gentiles and yourselves shall
    trust? or is it not Christ? As, therefore, Christ is the Israel and the Jacob,
    even so we, who have been quarried out from the bowels of Christ, are the true
    Israelitic race. But let us attend rather to the very word: ''And I will bring
    forth,'' He says, ''the seed out of Jacob, and out of Judah: and it shall inherit
    My holy mountain; and Mine Elect and My servants shall possess the inheritance,
    and shall dwell there; and there shall be folds of flocks in the thicket, and
    the valley of Achor shall be a resting-place of cattle for the people who have
    sought Me. But as for you, who forsake Me, and forget My holy mountain, and prepare
    a table for demons, and fill out drink for the demon, I shall give you to the
    sword. You shall all fall with a slaughter; for I called you, and you hearkened
    not, and did evil before me, and did choose that wherein I delighted not.'' Such
    are the words of Scripture; understand, therefore, that the seed of Jacob now
    referred to is something else, and not, as may be supposed, spoken of your people.
    For it is not possible for the seed of Jacob to leave an entrance for the descendants
    of Jacob, or for [God] to have accepted the very same persons whom He had reproached
    with unfitness for the inheritance, and promise it to them again; but as there
    the prophet says, ''And now, O house of Jacob, come and let us walk in the light
    of the Lord; for He has sent away His people, the house of Jacob, because their
    land was full, as at the first, of soothsayers and divinations;'' even so it is
    necessary for us here to observe that there are two seeds of Judah, and two races,
    as there are two houses of Jacob: the one begotten by blood and flesh, the other
    by faith and the Spirit. 136 "For you see how He now addresses the people, saying
    a little before: ''As the gape shah be found in the cluster, and they will say,
    Destroy it not, for a blessing is in it; so will I do for My servant''s sake:
    for His sake I will not destroy them all.'' And thereafter He adds: ''And I shall
    bring forth the seed out of Jacob, and out of Judah.'' It is plain then that if
    He thus be angry with them, and threaten to leave very few of them, He promises
    to bring forth certain others, who shall dwell in His mountain. But these are
    the persons whom He said He would sow and beget. For you neither suffer Him when
    He calls you, nor hear Him when He speaks to you, but have done evil in the presence
    of the Lord. But the highest pitch of your wickedness lies in this, that you hate
    the Righteous One, and slew Him; and so treat those who have received from Him
    all that they are and have, and who are pious, righteous, and humane. Therefore
    ''woe unto their soul,'' says'' the Lord, ''for they have devised an evil counsel
    against themselves, saying, Let us take away the righteous, for he is distasteful
    to us.'' For indeed you are not in the habit of sacrificing to Baal, as were your
    fathers, or of placing cakes in groves and on high places for the host of heaven:
    but you have not accepted God''s Christ. For he who knows not Him, knows not the
    will of God; and he who insults and hates Him, insults and hates Him that sent
    Him. And whoever believes not in Him, believes not the declarations of the prophets,
    who preached and proclaimed Him to all. 137 "Say no evil thing, my brothers, against
    Him that was crucified, and treat not scornfully the stripes wherewith all may
    be healed, even as we are healed. For it will be well if, persuaded by the Scriptures,
    you are circumcised from hard-heartedness: not that circumcision which you have
    from the tenets that are put into you; for that was given for a sign, and not
    for a work of righteousness, as the Scriptures compel you [to admit]. Assent,
    therefore, and pour no ridicule on the Son of God; obey not the Pharisaic teachers,
    and scoff not at the King of Israel, as the rulers of your synagogues teach you
    to do after your prayers: for if he that touches those who are not pleasing to
    God, is as one that touches the apple of God''s eye, how much more so is he that
    touches His beloved! And that this is He, has been sufficiently demonstrated."
    And as they kept silence, I continued: "My friends, I now refer to the Scriptures
    as the Seventy have interpreted them; for when I quoted them formerly as you possess
    them, I made proof of you [to ascertain] how you were disposed. For, mentioning
    the Scripture which says, ''Woe unto them! for they have devised evil counsel
    against themselves, saying (as the Seventy have translated, I continued): ''Let
    us take away the righteous, for he is distasteful to us;'' whereas at the commencement
    of the discussion I added what your version has: ''Let us bind the righteous,
    for he is distaste fill to us.'' But you had been busy about some other matter,
    and seem to have listened to the words without attending to them. But now, since
    the day is drawing to a close, for the sun is about to set, I shall add one remark
    to what I have said, and conclude. I have indeed made the very same remark already,
    but I think it would be right to bestow some consideration on it again. 138 "You
    know, then, sirs," I said, "that God has said in Isaiah to Jerusalem: ''I saved
    thee in the deluge of Noah.'' By this which God said was meant that the mystery
    of saved men appeared in the deluge. For righteous Noah, along with the other
    mortals at the deluge, i.e., with his own wife, his three sons and their wives,
    being eight in number, were a symbol of the eighth day, wherein Christ appeared
    when He rose from the dead, for ever the first in power. For Christ, being the
    first-born of every creature, became again the chief of another race regenerated
    by Himself through water, and faith, and wood, containing the mystery of the cross;
    even as Noah was saved by wood when he rode over the waters with his household.
    Accordingly, when the prophet says, ''I saved thee in the times of Noah,'' as
    I have already remarked, he addresses the people who are equally faithful to God,
    and possess the same signs. For when Moses had the rod in his hands, he led your
    nation through the sea. And you believe that this was spoken to your nation only,
    or to the land. But the whole earth, as the Scripture says, was inundated, and
    the water rose in height fifteen cubits above all the mountains: so that it is
    evident this was not spoken to the land, but to the people who obeyed Him: for
    whom also He had before prepared a resting-place in Jerusalem, as was previously
    demonstrated by all the symbols of the deluge; I mean, that by water, faith, and
    wood, those who are afore-prepared, and who repent of the sins which they have
    committed, shall escape from the impending judgment of God. 139 "For another mystery
    was accomplished and predicted in the days of Noah, of which you are not aware.
    It is this: in the blessings wherewith Noah blessed his two sons, and in the curse
    pronounced on his son''s son. For the Spirit of prophecy would not curse the son
    that had been by God blessed along with [his brothers]. But since the punishment
    of the sin would cleave to the whole descent of the son that mocked at his father''s
    nakedness, he made the curse originate with his son. Now, in what he said, he
    foretold that the descendants of Shem would keep in retention the property and
    dwellings of Canaan: and again that the descendants of Japheth would take possession
    of the property of which Shem''s descendants had dispossessed Canaan''s descendants;
    and spoil the descendants of Shem, even as they plundered the sons of Canaan.
    And listen to the way in which it has so come to pass. For you, who have derived
    your lineage from Shem, invaded the territory of the sons of Canaan by the will
    of God; and you possessed it. And it is manifest that the sons of Japheth, having
    invaded you in turn by the judgment of God, have taken your land from you, and
    have possessed it. Thus it is written: ''And Noah awoke from the wine, and knew
    what his younger son had done unto him; and he said, Cursed be Canaan, the servant;
    a servant shall he be unto his brethren. And he said, Blessed be the Lord God
    of Shem; and Canaan shall be his servant. May the Lord enlarge Japheth, and let
    him dwell in the houses of Shem; and let Canaan be his servant.'' Accordingly,
    as two peoples were blessed,--those from Shem, and those from Japheth,--and as
    the offspring of Shem were decreed first to possess the dwellings of Canaan, and
    the offspring of Japheth were predicted as in turn receiving the same possessions,
    and to the two peoples there was the one people of Canaan handed over for servants;
    so Christ has come according to the power given Him from the Almighty Father,
    and summoning men to friendship, and blessing, and repentance, and dwelling together,
    has promised, as has already been proved, that there shall be a future possession
    for all the saints in this same land. And hence all men everywhere, whether bond
    or free, who believe in Christ, and recognise the truth in His own words and those
    of His prophets, know that they shall be with Him in that land, and inherit everlasting
    and incorruptible good. 140 "Hence also Jacob, as I remarked before, being himself
    a type of Christ, had married the two handmaids of his two free wives, and of
    them begat sons, for the purpose of indicating beforehand that Christ would receive
    even all those who amongst Japheth''s race are descendants of Canaan, equally
    with the free, and would have the children fellow-heirs. And we are such; but
    you cannot comprehend this, because you cannot drink of the living fountain of
    God, but of broken cisterns which can hold no water, as the Scripture says. But
    they are cisterns broken, and holding no water, which your own teachers have digged,
    as the Scripture also expressly asserts, ''teaching for doctrines the commandments
    of men.'' And besides, they beguile themselves and you, supposing that the everlasting
    kingdom will be assuredly given to those of the dispersion who are of Abraham
    after the flesh, although they be sinners, and faithless, and disobedient towards
    God, which the Scriptures have proved is not the case. For if so, Isaiah would
    never have said this: ''And unless the Lord of Sabaoth had left us a seed, we
    would have been like Sodom and Gomorrah.'' And Ezekiel: ''Even if Noah, and Jacob,
    and Daniel were to pray for sons or daughters, their request should not be granted.''
    But neither shall the father perish for the son, nor the son for the father; but
    every one for his own sin, and each shall be saved for his own righteousness.
    And again Isaiah says: ''They shall look on the car; cases of them that have transgressed:
    their worm shall not cease, and their fire shall not be quenched; and they shall
    be a spectacle to all flesh.'' And our Lord, according to the will of Him that
    sent Him, who is the Father and Lord of all, would not have said, ''They shall
    come from the east, and from the west, and shall sit down with Abraham, and Isaac,
    and Jacob in the kingdom of heaven. But the children of the kingdom shall be cast
    out into outer darkness.'' Furthermore, I have proved in what has preceded," that
    those who were foreknown to be unrighteous, whether men or angels, are not made
    wicked by God''s fault, but each man by his own fault is what he will appear to
    be. 141 "But that you may not have a pretext for saying that Christ must have
    been crucified, and that those who transgressed must have been among your nation,
    and that the matter could not have been otherwise, I said briefly by anticipation,
    that God, wishing men and angels to follow His will, resolved to create them free
    to do righteousness; possessing reason, that they may know by whom they are created,
    and through whom they, not existing formerly, do now exist; and with a law that
    they should be judged by Him, if they do anything contrary to right reason: and
    of ourselves we, men and angels, shall be convicted of having acted sinfully,
    unless we repent beforehand. But if the word of God foretells that some angels
    and men shall be certainly punished, it did so because it foreknew that they would
    be unchangeably [wicked], but not because God had created them so. So that if
    they repent, all who wish for it can obtain mercy from God: and the Scripture
    foretells that they shall be blessed, saying, ''Blessed is the man to whom the
    Lord imputeth not sin;'' that is, having repented of his sins, that he may receive
    remission of them from God; and not as you deceive yourselves, and some others
    who resemble you in this, who say, that even though they be sinners, but know
    God, the Lord will not impute sin to them. We have as proof of this the one fall
    of David, which happened through his boasting, which was forgiven then when he
    so mourned and wept, as it is written. But if even to such a man no remission
    was granted before repentance, and only when this great king, and anointed one,
    and prophet, mourned and conducted himself so, how can the impure and utterly
    abandoned, if they weep not, and mourn not, and repent not, entertain the hope
    that the Lord will not impute to them sin? And this one fall of David, in the
    matter of Uriah''s wife, proves, sirs," I said, "that the patriarchs had many
    wives, not to commit fornication, but that a certain dispensation and all mysteries
    might be accomplished by them; since, if it were allowable to take any wife, or
    as many wives as one chooses, and how he chooses, which the men of your nation
    do over all the earth, wherever they sojourn, or wherever they have been sent,
    taking women under the name of marriage, much more would David have been permitted
    to do this." When I had said this, dearest Marcus Pompeius, I came to an end.
    142 Then Trypho, after a little delay, said, "You see that it was not intentionally
    that we came to discuss these points. And I confess that I have been particularly
    pleased with the conference; and I think that these are of quite the same opinion
    as myself. For we have found more than we expected, and more than it was possible
    to have expected. And if we could do this more frequently, we should be much helped
    in the searching of the Scriptures themselves. But since," he said, "you are on
    the eve of departure, and expect daily to set sail, do not hesitate to remember
    us as friends when you are gone." "For my part," I replied, "if I had remained,
    I would have wished to do the same thing daily. But now, since I expect, with
    God''s will and aid, to set sail, I exhort you to give all diligence in this very
    great struggle for your own salvation, and to be earnest in setting a higher value
    on the Christ of the Almighty God than on your own teachers." After this they
    left me, wishing me safety in my voyage, and from every misfortune. And I, praying
    for them, said, "I can wish no better thing for you, sirs, than this, that, recognising
    in this way that intelligence is given to every man, you may be of the same opinion
    as ourselves, and believe that Jesus is the Christ of God."</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><h3>Melito of Sardis, bishop (c. 100–180)</h3><blockquote><p>Melito
    to his brother Onesimus, greeting:— As you have often, prompted by your regard
    for the word of God , expressed a wish to have some extracts made from the Law
    and the Prophets concerning the Saviour, and concerning our faith in general,
    and have desired, moreover, to obtain an accurate account of the Ancient Books,
    as regards their number and their arrangement, I have striven to the best of my
    ability to perform this task: well knowing your zeal for the faith, and your eagerness
    to become acquainted with the Word, and especially because I am assured that ,
    through your yearning after God, you esteem these things beyond all things else,
    engaged as you are in a struggle for eternal salvation. I accordingly proceeded
    to the East, and went to the very spot where the things in question were preached
    and took place; and, having made myself accurately acquainted with the books of
    the Old Testament, I have set them down below, and herewith send you the list.
    Their names are as follows:— The five books of Moses—Genesis, Exodus, Leviticus,
    Numbers, Deuteronomy; Joshua, Judges, Ruth, the four books of Kings, the two of
    Chronicles, the book of the Psalms of David, the Proverbs of Solomon, also called
    the Book of Wisdom, Ecclesiastes, the Song of Songs, Job, the books of the prophets
    Isaiah, Jeremiah, of the twelve contained in a single book, Daniel, Ezekiel, Esdras.
    From these I have made my extracts, dividing them into six books. From the Catena
    on Genesis. V. From the Catena on Genesis. In place of Isaac the just, a ram appeared
    for slaughter, in order that Isaac might be liberated from his bonds. The slaughter
    of this animal redeemed Isaac from death. In like manner, the Lord, being slain,
    saved us; being bound, He loosed us; being sacrificed, He redeemed us… For the
    Lord was a lamb, like the ram which Abraham saw caught in the bush Sabec. But
    this bush represented the cross, and that place Jerusalem, and the lamb the Lord
    bound for slaughter. For as a ram was He bound, says he concerning our Lord Jesus
    Christ, and as a lamb was He shorn, and as a sheep was He led to the slaughter,
    and as a lamb was He crucified; and He carried the cross on His shoulders when
    He was led up to the hill to be slain, as was Isaac by his father. But Christ
    suffered, and Isaac did not suffer: for he was but a type of Him who should suffer.
    Yet, even when serving only for a type of Christ, he smote men with astonishment
    and fear. For a new mystery was presented to view,—a son led by his father to
    a mountain to be slain, whose feet he bound together, and laid him on the wood
    of the sacrifice, preparing with care whatever was necessary to his immolation.
    Isaac on his part is silent, bound like a ram, not opening his mouth, nor uttering
    a sound with his voice. For, not fearing the knife, nor quailing before the fire,
    nor troubled by the prospect of suffering, he sustained bravely the character
    of the type of the Lord. Accordingly there lies Isaac before us, with his feet
    bound like a ram, his father standing by, with the knife all bare in his hand,
    not shrinking from shedding the blood of his son. Two Scholia on Genesis XXII.
    13. VI. Two Scholia on Gen. 22:13. The Syriac and the Hebrew use the word "suspended,"
    as more clearly typifying the cross. The word Sabek some have rendered remission
    , others upright , as if the meaning, agreeing with the popular belief, were—a
    goat walking erect up to a bush, and there standing erect caught by his horns,
    so as to be a plain type of the cross. For this reason it is not translated, because
    the single Hebrew word signifies in other languages many things. To those, however,
    who ask it is proper to give an answer, and to say that Sabek denotes lifted up.
    On the Nature of Christ. VII. On the Nature of Christ. For there is no need, to
    persons of intelligence, to attempt to prove, from the deeds of Christ subsequent
    to His baptism, that His soul and His body, His human nature like ours, were real,
    and no phantom of the imagination. For the deeds done by Christ after His baptism,
    and especially His miracles, gave indication and assurance to the world of the
    Deity hidden in His flesh. For, being at once both God and perfect man likewise,
    He gave us sure indications of His two natures: of His Deity, by His miracles
    during the three years that elapsed after His baptism; of His humanity, during
    the thirty similar periods which preceded His baptism, in which, by reason of
    His low estate as regards the flesh, He concealed the signs of His Deity, although
    He was the true God existing before all ages. From the Oration on Our Lord''s
    Passion. VIII. From the Oration on Our Lord’s Passion. God has suffered from the
    right hand of Israel. From ''The Key.'' IX. Head of the Lord — His simple Divinity;
    because He is the Beginning and Creator of all things: in Daniel. (Dan. 7:9; Dan.
    7:13; Dan. 7:22) The white hair of the Lord , because He is "the Ancient of Days:"
    as above. The eyes of the Lord —the Divine inspection: because He sees all things.
    Like that in the apostle: For all things are naked and open in His eyes." (Heb.
    4:13) The eyelids of the Lord —hidden spiritual mysteries in the Divine precepts.
    In the Psalm: "His eyelids question, that is prove, the children of men." (Ps.
    11:4) The smelling of the Lord —His delight in the prayers or works of the saints.
    In Genesis: "And the Lord smelled an odour of sweetness." (Gen. 8:21) The mouth
    of the Lord —His Son, or word addressed to men. In the prophet, "The mouth of
    the Lord hath spoken;" (Isa. 1:20) and elsewhere, "They provoked His mouth to
    anger." (Lam. 1:18) The tongue of the Lord —His Holy Spirit. In the Psalm: "My
    tongue is a pen." (Ps. 45:1) The face of the Lord —His manifestation. In Exodus,
    "My face shall go before thee;" (Exod. 33:14) and in the prophet, "The face of
    the Lord divided them." (Lam. 4:16) The word of the Lord — His Son. In the Psalm:
    "My heart hath uttered a good word." (Ps. 45:1) The arm of the Lord — His Son,
    by whom He hath wrought all His works. In the prophet Isaiah: "And to whom is
    the arm of the Lord revealed?" (Isa. 53:1) The right hand of the Lord —that is,
    His Son; as also above in the Psalm: "The right hand of the Lord hath done valiantly."
    (Ps. 118:16) The right hand of the Lord — electio omnis. As in Deuteronomy: "In
    His right hand is a fiery law." (Deut. 33:2) The wings of the Lord —Divine protection.
    In the Psalm: "In the shadow of Thy wings will I hope." (Ps. 57:1) The shoulder
    of the Lord —the Divine power, by which He condescends to carry the feeble. In
    Deuteronomy: "He took them up, and put them on His shoulders." (Deut. 33:12) The
    hand of the Lord —Divine operation. In the prophet: "Have not my hands made all
    these things?" (Isa. 66:2) The finger of the Lord —the Holy Spirit, by whose operation
    the tables of the law in Exodus are said to have been written; (Exod. 34:1) and
    in the Gospel: "If I by the finger of God cast out demons" (Luke 11:20) The fingers
    of the Lord —The lawgiver Moses, or the prophets. In the Psalm: "I will regard
    the heavens," that is, the books of the Law and the Prophets, "the works of Thy
    fingers." (Ps. 8:3) The wisdom of the Lord — His Son. In the apostle: "Christ
    the power of God, and the wisdom of God;" (1 Cor. 1:24) and in Solomon: "The wisdom
    of the Lord reacheth from one end to the other mightily." The womb of the Lord
    —the hidden recess of Deity out of which He brought forth His Son. In the Psalm:
    "Out of the womb, before Lucifer, have I borne Thee." (Ps. 110:3) The feet of
    the Lord —His immoveableness and eternity. In the Psalm: "And thick darkness was
    under His feet." (Ps. 18:9) The throne of the Lord —angels, or saints, or simply
    sovereign dominion. In the Psalm: "Thy throne, O God, is for ever and ever." (Ps.
    45:6; Ps. 5; Ps. 29) Seat —the same as above, angels or saints, because the Lord
    sits upon these. In the Psalm: "The Lord sat upon His holy seat." (Ps. 47:8) The
    descent of the Lord —His visitation of men. As in Micah: "Behold, the Lord shall
    come forth from His place; He shall come down trampling under foot the ends of
    the earth." (Mic. 1:3) Likewise in a bad sense. In Genesis: "The Lord came down
    to see the tower." (Gen. 11:3) The ascent of the Lord —the raising up of man,
    who is taken from earth to heaven. In the Psalm: "Who ascendeth above the heaven
    of heavens to the east." (Ps. 68:33) The standing of the Lord —the patience of
    the Deity, by which He bears with sinners that they may come to repentance. As
    in Habakkuk: "He stood and measured the earth; (Hab. 3:6) and in the Gospel: "Jesus
    stood, and bade him be called," (Mark 10:49) that is, the blind man. The transition
    of the Lord —His assumption of our flesh, through which by His birth, His death,
    His resurrection, His ascent into heaven, He made transitions, so to say. In the
    Song of Songs: "Behold, He cometh, leaping upon the mountains, bounding over the
    hills." (Song 2:8) The going of the Lord —His coming or visitation. In the Psalm.
    The way of the Lord —the operation of the Deity. As in Job, in speaking of the
    devil: "He is the beginning of the ways of the Lord." (Job 40:19) Again: The ways
    of the Lord —His precepts. In Hosea: "For the ways of the Lord are straight, and
    the just shall walk in them." (Hos. 14:10) The footsteps of the Lord —the signs
    of His secret operations. As in the Psalm: "And Thy footsteps shall not be known."
    (Ps. 77:19) The knowledge of the Lord —that which makes men to know Him. To Abraham
    He says: " Now I know that thou fearest the Lord;" (Gen. 22:12) that is, I have
    made thee to know. The ignorance of God is His disapproval. In the Gospel: "I
    know you not." (Luke 13:25) The remembrance of God —His mercy, by which He rejects
    and has mercy on whom He will. So in Genesis: "The Lord remembered Noah;" (Gen.
    8:1) and in another passage: "The Lord hath remembered His people." (Esth. 10:12)
    The repentance of the Lord — His change of procedure. As in the book of Kings:
    "It repented me that I have made Saul king." (1 Sam. 15:11) The anger and wrath
    of the Lord —the vengeance of the Deity upon sinners, when He bears with them
    with a view to punishment, does not at once judge them according to strict equity.
    As in the Psalm: "In His anger and in His wrath will He trouble them." (Ps. 2:5)
    The sleeping of the Lord —when, in the thoughts of some, His faithfulness is not
    sufficiently wakeful. In the Psalm: "Awake, why sleepest Thou, O Lord?" (Ps. 44:23)
    The watches of the Lord —in the guardianship of His elect He is always at hand
    by the presence of His Deity. In the Psalm: "Lo! He will not slumber nor sleep."
    (Ps. 121:4) The sitting of the Lord —His ruling. In the Psalm: "The Lord sitteth
    upon His holy seat." (Ps. 47:8) The footstool of the Lord —man assumed by the
    Word; or His saints, as some think. In the Psalm: "Worship ye His footstool, for
    it is holy." The walking of the Lord —the delight of the Deity in the walks of
    His elect. In the prophet: "I will walk in them, and will be their Lord." (Ezek.
    37:27) The trumpet of the Lord —His mighty voice. In the apostle: "At the command,
    and at the voice of the archangel, and at the trumpet of God, shall He descend
    from heaven." ————————————</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/melito-fragments">Fragments
    (Extracts)</a>)</p><h3>Tatian (c. 120–175)</h3><p>On the fact that Tatian compiled
    a collection of texts from the four Gospels, named the Diatessaron:</p><blockquote><p>Clement
    of Alexandria (Strom. III, 12) ascribes to him a book “on perfection according
    to the Saviour’s teaching.” Eusebius (V, 13) mentions that he laboured on a “book
    of questions” (προβλημάτων), in which the obscure and difficult places of Holy
    Scripture were explained; and he also compiled a harmony of the gospels and gave
    it the name διατεσσάρων (through four). The properties and composition of this
    last most remarkable work have to this day remained a subject of dispute among
    scholars, owing to the lack of precise and detailed testimony from the ancient
    ecclesiastical writers. Already in the time of Theodoret (†458) a considerable
    number of Tatian’s Diatessaron existed, and this is what Theodoret reports about
    it (haer. fab. I, 20): Tatian composed a gospel called the Diatessaron, omitting
    the genealogies of Christ and other passages showing that the Lord according to
    the flesh was descended from the seed of David. This gospel was used not only
    by the followers of Tatian but by Orthodox Christians as well, as a very convenient
    book, without knowing the craftiness of that harmony. Theodoret himself found
    more than 200 copies of it in the churches of his district (Cyrrhus), took them
    away and replaced them with the canonical gospels of the four evangelists.</p></blockquote><p>(P.
    Preobrazhensky, “On Tatian and his Apology”)</p><h3>The Canon from a text of an
    unknown author, discovered in 1700 by Muratori</h3><blockquote><p>…...at which
    nevertheless he was present, and so he placed [them in his narrative]. (2) The
    third book of the Gospel is that according to Luke. (3) Luke, the well-known physician,
    after the ascension of Christ, (4-5) when Paul had taken him with him as one zealous
    for the law, (6) composed it in his own name, according to [the general] belief.
    Yet he himself had not (7) seen the Lord in the flesh; and therefore, as he was
    able to ascertain events, (8) so indeed he begins to tell the story from the birth
    of John. (9) The fourth of the Gospels is that of John, [one] of the disciples,
    (10) To his fellow disciples and bishops, who had been urging him [to write],
    (11) he said, "Fast with me from today for three days, and what (12) will be revealed
    to each one (13) let us tell it to one another." In the same night it was revealed
    (14) to Andrew, [one] of the apostles, (15-16) that John should write down all
    things in his own name while all of them should review it. And so, though various
    (17) elements may be taught in the individual books of the Gospels, (18) nevertheless
    this makes no difference to the faith of believers, since by the one sovereign
    Spirit all things (19) (20) have been declared in all [the Gospels]: concerning
    the (21) nativity, concerning the passion, concerning the resurrection, (22) concerning
    life with his disciples, (23) and concerning his twofold coming; (24) the first
    in lowliness when he was despised, which has taken place, (25) the second glorious
    in royal power, (26) which is still in the future. What (27) marvel is it, then,
    if John so consistently (28) mentions these particular points also in his Epistles,
    (29) saying about himself: "What we have seen with our eyes (30) and heard with
    our ears and our hands (31) have handled, these things we have written to you"?
    (32) For in this way he professes [himself] to be not only an eye-witness and
    hearer, (33) but also a writer of all the marvelous deeds of the Lord, in their
    order. (34) Moreover, the acts of all the apostles (35) were written in one book.
    For "most excellent Theophilus" Luke compiled (36) the individual events that
    took place in his presence - (37) as he plainly shows by omitting the martyrdom
    of Peter (38) as well as the departure of Paul from the city [of Rome] (39) when
    he journeyed to Spain. As for the Epistles of (40-1) Paul, they themselves make
    clear to those desiring to understand, which ones [they are], from what place,
    or for what reason they were sent. (42) First of all, to the Corinthians, prohibiting
    their heretical schisms; (43) next, to the Galatians, against circumcision; (44-6)
    then to the Romans he wrote at length, explaining the order (or, plan) of the
    Scriptures, and also that Christ is their principle (or, main theme). It is necessary
    (47) for us to discuss these one by one, since the blessed (48) apostle Paul himself,
    following the example of his predecessor (49-50) John, writes by name to only
    seven churches in the following sequence: to the Corinthians (51) first, to the
    Ephesians second, to the Philippians third, (52) to the Colossians fourth, to
    the Galatians fifth, (53) to the Thessalonians sixth, to the Romans (54-5) seventh.
    It is true that he writes once more to the Corinthians and to the Thessalonians
    for the sake of admonition, (56-7), yet it is clearly recognizable that there
    is one Church spread throughout the whole extent of the earth. For John also in
    the (58) Apocalypse, though he writes to seven churches, (59-60) nevertheless
    speaks to all. [Paul also wrote) out of affection and love one to Philemon, one
    to Titus, and two to Timothy; and these are held sacred (61) (62-3) in the esteem
    of the Church catholic for the regulation of ecclesiastical discipline. There
    is current also [an epistle] to (64) the Laodiceans, [and] another to the Alexandrians,
    [both forged in Paul''s (65) name to [further] the heresy of Marcion, and several
    others (66) which cannot be received into the catholic church (67) -for it is
    not fitting that gall be mixed with honey. (68) Moreover, the Epistle of Jude
    and two of the above-mentioned (or, bearing the name of) John are counted (or,
    used) in the catholic [Church); and [the book of] Wisdom, (69) (70) written by
    the friends of Solomon in his honour. (71) We receive only the apocalypses of
    John and Peter, (72) though some of us are not willing that the latter be read
    in church. (73) But Hermas wrote the Shepherd (74) very recently, in our times,
    in the city of Rome, (75) while bishop Pius, his brother, was occupying the [episcopal]
    chair (76) of the church of the city of Rome. (77) And therefore it ought indeed
    to be read; but (78) it cannot be read publicly to the people in church either
    among (79) the prophets, whose number is complete, or among (80) the apostles,
    for it is after [their] time. (81) But we accept nothing whatever of Arsinous
    or Valentinus or Miltiades, (82) who also composed (83) a new book of psalms for
    Marcion, (84-5) together with Basilides, the Asian founder of the Cataphrygians....
    [ large version ] — Last page of the Canon Muratori, as published in 1868…</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/b8Un_Muratorian_Canon">The Muratorian Canon</a>)</p><h3>Tertullian
    (c. 155–240)</h3><blockquote><p>“Now this heresy of yours does not receive certain
    Scriptures; and whichever of them it does receive, it perverts by means of additions
    and diminutions, for the accomplishment of its own purpose; and such as it does
    receive, it receives not in their entirety; but even when it does receive any
    up to a certain point as entire, it nevertheless perverts even these by the contrivance
    of diverse interpretations. Truth is just as much opposed by an adulteration of
    its meaning as it is by a corruption of its text. Their vain presumptions must
    needs refuse to acknowledge the (writings) whereby they are refuted. They rely
    on those which they have falsely put together, and which they have selected, because
    of their ambiguity. Though most skilled in the Scriptures, you will make no progress,
    when everything which you maintain is denied on the other side, and whatever you
    deny is (by them) maintained. As for yourself, indeed, you will lose nothing but
    your breath, and gain nothing but vexation from their blasphemy. Great Evil Ensues
    to the Weak in Faith, from Any Discussion Out of the Scriptures. Conviction Never
    Comes to the Heretic from Such a Process. Chapter XVIII.—Great Evil Ensues to
    the Weak in Faith, from Any Discussion Out of the Scriptures. Conviction Never
    Comes to the Heretic from Such a Process. But with respect to the man for whose
    sake you enter on the discussion of the Scriptures, with the view of strengthening
    him when afflicted with doubts, (let me ask) will it be to the truth, or rather
    to heretical opinions that he will lean? Influenced by the very fact that he sees
    you have made no progress, whilst the other side is on an equal footing (with
    yourself) in denying and in defence, or at any rate on a like standing he will
    go away confirmed in his uncertainty by the discussion, not knowing which side
    to adjudge heretical. For, no doubt, they too are able to retort these things
    on us. It is indeed a necessary consequence that they should go so far as to say
    that adulterations of the Scriptures, and false expositions thereof, are rather
    introduced by ourselves, inasmuch as they, no less than we maintain that truth
    is on their side. Appeal, in Discussion of Heresy, Lies Not to the Scriptures.
    The Scriptures Belong Only to Those Who Have the Rule of Faith. Chapter XIX.—Appeal,
    in Discussion of Heresy, Lies Not to the Scriptures. The Scriptures Belong Only
    to Those Who Have the Rule of Faith. Our appeal, therefore, must not be made to
    the Scriptures; nor must controversy be admitted on points in which victory will
    either be impossible, or uncertain, or not certain enough. But even if a discussion
    from the Scriptures should not turn out in such a way as to place both sides on
    a par, (yet) the natural order of things would require that this point should
    be first proposed, which is now the only one which we must discuss: "With whom
    lies that very faith to which the Scriptures belong. From what and through whom,
    and when, and to whom, has been handed down that rule, by which men become Christians?"
    For wherever it shall be manifest that the true Christian rule and faith shall
    be, there will likewise be the true Scriptures and expositions thereof, and all
    the Christian traditions. Christ First Delivered the Faith. The Apostles Spread
    It; They Founded Churches as the Depositories Thereof. That Faith, Therefore,
    is Apostolic, Which Descended from the Apostles, Through Apostolic Churches. Chapter
    XX.—Christ First Delivered the Faith. The Apostles Spread It; They Founded Churches
    as the Depositories Thereof. That Faith, Therefore, is Apostolic, Which Descended
    from the Apostles, Through Apostolic Churches. Christ Jesus our Lord (may He bear
    with me a moment in thus expressing myself!), whosoever He is, of what God soever
    He is the Son, of what substance soever He is man and God, of what faith soever
    He is the teacher, of what reward soever He is the Promiser, did, whilst He lived
    on earth, Himself declare what He was, what He had been, what the Father’s will
    was which He was administering, what the duty of man was which He was prescribing;
    (and this declaration He made,) either openly to the people, or privately to His
    disciples, of whom He had chosen the twelve chief ones to be at His side, (Mark
    4:34) and whom He destined to be the teachers of the nations. Accordingly, after
    one of these had been struck off, He commanded the eleven others, on His departure
    to the Father, to "go and teach all nations, who were to be baptized into the
    Father, and into the Son, and into the Holy Ghost." (Matt. 28:19) Immediately,
    therefore, so did the apostles, whom this designation indicates as " the sent."
    Having, on the authority of a prophecy, which occurs in a psalm of David, chosen
    Matthias by lot as the twelfth, into the place of Judas, they obtained the promised
    power of the Holy Ghost for the gift of miracles and of utterance; and after first
    bearing witness to the faith in Jesus Christ throughout Judæa, and founding churches
    (there), they next went forth into the world and preached the same doctrine of
    the same faith to the nations. They then in like manner founded churches in every
    city, from which all the other churches, one after another, derived the tradition
    of the faith, and the seeds of doctrine, and are every day deriving them, that
    they may become churches. Indeed, it is on this account only that they will be
    able to deem themselves apostolic, as being the offspring of apostolic churches.
    Every sort of thing must necessarily revert to its original for its classification.
    Therefore the churches, although they are so many and so great, comprise but the
    one primitive church, (founded) by the apostles, from which they all (spring).
    In this way all are primitive, and all are apostolic, whilst they are all proved
    to be one, in (unbroken) unity, by their peaceful communion, and title of brotherhood,
    and bond of hospitality,—privileges which no other rule directs than the one tradition
    of the selfsame mystery. All Doctrine True Which Comes Through the Church from
    the Apostles, Who Were Taught by God Through Christ. All Opinion Which Has No
    Such Divine Origin and Apostolic Tradition to Show, is Ipso Facto False. Chapter
    XXI.—All Doctrine True Which Comes Through the Church from the Apostles, Who Were
    Taught by God Through Christ. All Opinion Which Has No Such Divine Origin and
    Apostolic Tradition to Show, is Ipso Facto False. From this, therefore, do we
    draw up our rule. Since the Lord Jesus Christ sent the apostles to preach, (our
    rule is) that no others ought to be received as preachers than those whom Christ
    appointed; for "no man knoweth the Father save the Son, and he to whomsoever the
    Son will reveal Him." (Matt. 11:27) Nor does the Son seem to have revealed Him
    to any other than the apostles, whom He sent forth to preach—that, of course,
    which He revealed to them. Now, what that was which they preached—in other words,
    what it was which Christ revealed to them—can, as I must here likewise prescribe,
    properly be proved in no other way than by those very churches which the apostles
    founded in person, by declaring the gospel to them directly themselves, both vivâ
    voce , as the phrase is, and subsequently by their epistles. If, then, these things
    are so, it is in the same degree manifest that all doctrine which agrees with
    the apostolic churches—those moulds and original sources of the faith must be
    reckoned for truth, as undoubtedly containing that which the (said) churches received
    from the apostles, the apostles from Christ, Christ from God. Whereas all doctrine
    must be prejudged as false which savours of contrariety to the truth of the churches
    and apostles of Christ and God. It remains, then, that we demonstrate whether
    this doctrine of ours, of which we have now given the rule, has its origin in
    the tradition of the apostles, and whether all other doctrines do not ipso facto
    proceed from falsehood. We hold communion with the apostolic churches because
    our doctrine is in no respect different from theirs. This is our witness of truth.
    Attempt to Invalidate This Rule of Faith Rebutted. The Apostles Safe Transmitters
    of the Truth. Sufficiently Taught at First, and Faithful in the Transmission.
    Chapter XXII.—Attempt to Invalidate This Rule of Faith Rebutted. The Apostles
    Safe Transmitters of the Truth. Sufficiently Taught at First, and Faithful in
    the Transmission. But inasmuch as the proof is so near at hand, that if it were
    at once produced there would be nothing left to be dealt with, let us give way
    for a while to the opposite side, if they think that they can find some means
    of invalidating this rule, just as if no proof were forthcoming from us. They
    usually tell us that the apostles did not know all things: (but herein) they are
    impelled by the same madness, whereby they turn round to the very opposite point,
    and declare that the apostles certainly knew all things, but did not deliver all
    things to all persons,—in either case exposing Christ to blame for having sent
    forth apostles who had either too much ignorance, or too little simplicity. What
    man, then, of sound mind can possibly suppose that they were ignorant of anything,
    whom the Lord ordained to be masters (or teachers), keeping them, as He did, inseparable
    (from Himself) in their attendance, in their discipleship, in their society, to
    whom, "when they were alone, He used to expound" all things (Mark 4:34) which
    were obscure, telling them that "to them it was given to know those mysteries,"
    (Matt. 13:11) which it was not permitted the people to understand? Was anything
    withheld from the knowledge of Peter, who is called "the rock on which the church
    should be built," who also obtained "the keys of the kingdom of heaven," (Matt.
    16:19) with the power of "loosing and binding in heaven and on earth?" (Matt.
    16:19) Was anything, again, concealed from John, the Lord’s most beloved disciple,
    who used to lean on His breast (John 21:20) to whom alone the Lord pointed Judas
    out as the traitor, whom He commended to Mary as a son in His own stead? (John
    19:26) Of what could He have meant those to be ignorant, to whom He even exhibited
    His own glory with Moses and Elias, and the Father’s voice moreover, from heaven?
    (Matt. 17:1–8) Not as if He thus disapproved of all the rest, but because "by
    three witnesses must every word be established." (Deut. 19:15; 2 Cor. 13:1) After
    the same fashion, too, (I suppose,) were they ignorant to whom, after His resurrection
    also, He vouchsafed, as they were journeying together, "to expound all the Scriptures."
    (Luke 24:27) No doubt He had once said, "I have yet many things to say unto you,
    but ye cannot hear them now;" but even then He added, "When He, the Spirit of
    truth, shall come, He will lead you into all truth." (John 16:12–13) He (thus)
    shows that there was nothing of which they were ignorant, to whom He had promised
    the future attainment of all truth by help of the Spirit of truth. And assuredly
    He fulfilled His promise, since it is proved in the Acts of the Apostles that
    the Holy Ghost did come down. Now they who reject that Scripture can neither belong
    to the Holy Spirit, seeing that they cannot acknowledge that the Holy Ghost has
    been sent as yet to the disciples, nor can they presume to claim to be a church
    themselves who positively have no means of proving when, and with what swaddling-clothes
    this body was established. Of so much importance is it to them not to have any
    proofs for the things which they maintain, lest along with them there be introduced
    damaging exposures of those things which they mendaciously devise. The Apostles
    Not Ignorant. The Heretical Pretence of St. Peter''s Imperfection Because He Was
    Rebuked by St. Paul. St. Peter Not Rebuked for Error in Teaching. Chapter XXIII.—The
    Apostles Not Ignorant. The Heretical Pretence of St. Peter’s Imperfection Because
    He Was Rebuked by St. Paul. St. Peter Not Rebuked for Error in Teaching. Now,
    with the view of branding the apostles with some mark of ignorance, they put forth
    the case of Peter and them that were with him having been rebuked by Paul. "Something
    therefore," they say, "was wanting in them." (This they allege,) in order that
    they may from this construct that other position of theirs, that a fuller knowledge
    may possibly have afterwards come over (the apostles,) such as fell to the share
    of Paul when he rebuked those who preceded him. I may here say to those who reject
    The Acts of the Apostles : "It is first necessary that you show us who this Paul
    was,—both what he was before he was an apostle, and how he became an apostle,"—so
    very great is the use which they make of him in respect of other questions also.
    It is true that he tells us himself that he was a persecutor before he became
    an apostle, (Gal. 1:13) still this is not enough for any man who examines before
    he believes, since even the Lord Himself did not bear witness of Himself. (John
    5:31) But let them believe without the Scriptures, if their object is to believe
    contrary to the Scriptures. Still they should show, from the circumstance which
    they allege of Peter’s being rebuked by Paul, that Paul added yet another form
    of the gospel besides that which Peter and the rest had previously set forth.
    But the fact is, having been converted from a persecutor to a preacher, he is
    introduced as one of the brethren to brethren, by brethren—to them, indeed, by
    men who had put on faith from the apostles’ hands. Afterwards, as he himself narrates,
    he "went up to Jerusalem for the purpose of seeing Peter," (Gal. 1:18) because
    of his office, no doubt, and by right of a common belief and preaching. Now they
    certainly would not have been surprised at his having become a preacher instead
    of a persecutor, if his preaching were of something contrary; nor, moreover, would
    they have "glorified the Lord," (Gal. 1:24) because Paul had presented himself
    as an adversary to Him. They accordingly even gave him "the right hand of fellowship,"
    (Gal. 2:9) as a sign of their agreement with him, and arranged amongst themselves
    a distribution of office, not a diversity of gospel, so that they should severally
    preach not a different gospel, but (the same), to different persons, Peter to
    the circumcision, Paul to the Gentiles. Forasmuch, then, as Peter was rebuked
    because, after he had lived with the Gentiles, he proceeded to separate himself
    from their company out of respect for persons, the fault surely was one of conversation,
    not of preaching. For it does not appear from this, that any other God than the
    Creator, or any other Christ than (the son) of Mary, or any other hope than the
    resurrection, was (by him) announced. St. Peter''s Further Vindication. St. Paul
    Not Superior to St. Peter in Teaching. Nothing Imparted to the Former in the Third
    Heaven Enabled Him to Add to the Faith. Heretics Boast as If Favoured with Some
    of the Secrets Imparted to Him. Chapter XXIV.—St. Peter’s Further Vindication.
    St. Paul Not Superior to St. Peter in Teaching. Nothing Imparted to the Former
    in the Third Heaven Enabled Him to Add to the Faith. Heretics Boast as If Favoured
    with Some of the Secrets Imparted to Him. I have not the good fortune, or, as
    I must rather say, I have not the unenviable task, of setting apostles by the
    ears. But, inasmuch as our very perverse cavillers obtrude the rebuke in question
    for the set purpose of bringing the earlier doctrine into suspicion, I will put
    in a defence, as it were, for Peter, to the effect that even Paul said that he
    was "made all things to all men—to the Jews a Jew," to those who were not Jews
    as one who was not a Jew—"that he might gain all." (1 Cor. 9:20; 1 Cor. 9:22)
    Therefore it was according to times and persons and causes that they used to censure
    certain practices, which they would not hesitate themselves to pursue, in like
    conformity to times and persons and causes. Just ( e.g. ) as if Peter too had
    censured Paul, because, whilst forbidding circumcision, he actually circumcised
    Timothy himself. Never mind those who pass sentence on apostles! It is a happy
    fact that Peter is on the same level with Paul in the very glory of martyrdom.
    Now, although Paul was carried away even to the third heaven, and was caught up
    to paradise, (2 Cor. 12:4) and heard certain revelations there, yet these cannot
    possibly seem to have qualified him for (teaching) another doctrine, seeing that
    their very nature was such as to render them communicable to no human being. If,
    however, that unspeakable mystery did leak out, and become known to any man, and
    if any heresy affirms that it does itself follow the same, (then) either Paul
    must be charged with having betrayed the secret, or some other man must actually
    be shown to have been afterwards "caught up into paradise," who had permission
    to speak out plainly what Paul was not allowed (even) to mutter. The Apostles
    Did Not Keep Back Any of the Deposit of Doctrine Which Christ Had Entrusted to
    Them. St. Paul Openly Committed His Whole Doctrine to Timothy. Chapter XXV.—The
    Apostles Did Not Keep Back Any of the Deposit of Doctrine Which Christ Had Entrusted
    to Them. St. Paul Openly Committed His Whole Doctrine to Timothy. But here is,
    as we have said, the same madness, in their allowing indeed that the apostles
    were ignorant of nothing, and preached not any (doctrines) which contradicted
    one another, but at the same time insisting that they did not reveal all to all
    men, for that they proclaimed some openly and to all the world, whilst they disclosed
    others (only) in secret and to a few, because Paul addressed even this expression
    to Timothy: "O Timothy, guard that which is entrusted to thee;" (1 Tim. 6:20)
    and again: "That good thing which was committed unto thee keep." (2 Tim. 1:14)
    What is this deposit? Is it so secret as to be supposed to characterize a new
    doctrine? or is it a part of that charge of which he says, "This charge I commit
    unto thee, son Timothy?" (1 Tim. 1:18) and also of that precept of which he says,
    "I charge thee in the sight of God, who quickeneth all things, and before Jesus
    Christ who witnessed a good confession under Pontius Pilate, that thou keep this
    commandment?" (1 Tim. 6:13) Now, what is (this) commandment and what is (this)
    charge? From the preceding and the succeeding contexts, it will be manifest that
    there is no mysterious hint darkly suggested in this expression about (some) far-fetched
    doctrine, but that a warning is rather given against receiving any other (doctrine)
    than that which Timothy had heard from himself, as I take it publicly: "Before
    many witnesses" is his phrase. (2 Tim. 2:2) Now, if they refuse to allow that
    the church is meant by these "many witnesses," it matters nothing, since nothing
    could have been secret which was produced "before many witnesses." Nor, again,
    must the circumstance of his having wished him to "commit these things to faithful
    men, who should be able to teach others also," (2 Tim. 2:2) be construed into
    a proof of there being some occult gospel. For, when he says "these things," he
    refers to the things of which he is writing at the moment. In reference, however,
    to occult subjects, he would have called them, as being absent, those things ,
    not these things , to one who had a joint knowledge of them with himself. The
    Apostles Did in All Cases Teach the Whole Truth to the Whole Church. No Reservation,
    Nor Partial Communication to Favourite Friends. Chapter XXVI.—The Apostles Did
    in All Cases Teach the Whole Truth to the Whole Church. No Reservation, Nor Partial
    Communication to Favourite Friends. Besides which, it must have followed, that,
    for the man to whom he committed the ministration of the gospel, he would add
    the injunction that it be not ministered in all places, and without respect to
    persons, in accordance with the Lord’s saying, "Not to cast one’s pearls before
    swine, nor that which is holy unto dogs." (Matt. 7:6) Openly did the Lord speak,
    (John 18:20) without any intimation of a hidden mystery. He had Himself commanded
    that, "whatsoever they had heard in darkness" and in secret, they should "declare
    in the light and on the house-tops." (Matt. 10:27) He had Himself foreshown, by
    means of a parable, that they should not keep back in secret, fruitless of interest,
    (Luke 19:20–24) a single pound, that is, one word of His. He used Himself to tell
    them that a candle was not usually "pushed away under a bushel, but placed on
    a candlestick," in order to "give light to all who are in the house." (Matt. 5:15)
    These things the apostles either neglected, or failed to understand, if they fulfilled
    them not, by concealing any portion of the light, that is, of the word of God
    and the mystery of Christ. Of no man, I am quite sure, were they afraid,—neither
    of Jews nor of Gentiles in their violence; with all the greater freedom, then,
    would they certainly preach in the church, who held not their tongue in synagogues
    and public places. Indeed they would have found it impossible either to convert
    Jews or to bring in Gentiles, unless they "set forth in order" (Luke 1:1) that
    which they would have them believe. Much less, when churches were advanced in
    the faith, would they have withdrawn from them anything for the purpose of committing
    it separately to some few others. Although, even supposing that among intimate
    friends, so to speak, they did hold certain discussions, yet it is incredible
    that these could have been such as to bring in some other rule of faith, differing
    from and contrary to that which they were proclaiming through the Catholic churches,—as
    if they spoke of one God in the Church, (and) another at home, and described one
    substance of Christ, publicly, (and) another secretly, and announced one hope
    of the resurrection before all men, (and) another before the few; although they
    themselves, in their epistles, besought men that they would all speak one and
    the same thing, and that there should be no divisions and dissensions in the church,
    (1 Cor. 1:10) seeing that they, whether Paul or others, preached the same things.
    Moreover, they remembered (the words): "Let your communication be yea, yea; nay,
    nay; for whatsoever is more than this cometh of evil;" (Matt. 5:37) so that they
    were not to handle the gospel in a diversity of treatment. Granted that the Apostles
    Transmitted the Whole Doctrine of Truth, May Not the Churches Have Been Unfaithful
    in Handing It On? Inconceivable that This Can Have Been the Case. Chapter XXVII.—Granted
    that the Apostles Transmitted the Whole Doctrine of Truth, May Not the Churches
    Have Been Unfaithful in Handing It On? Inconceivable that This Can Have Been the
    Case. Since, therefore, it is incredible that the apostles were either ignorant
    of the whole scope of the message which they had to declare, or failed to make
    known to all men the entire rule of faith, let us see whether, while the apostles
    proclaimed it, perhaps, simply and fully, the churches, through their own fault,
    set it forth otherwise than the apostles had done. All these suggestions of distrust
    you may find put forward by the heretics. They bear in mind how the churches were
    rebuked by the apostle: "O foolish Galatians, who hath bewitched you?" (Gal. 3:1)
    and, "Ye did run so well; who hath hindered you?" (Gal. 5:7) and how the epistle
    actually begins: "I marvel that ye are so soon removed from Him, who hath called
    you as His own in grace, to another gospel." (Gal. 1:6) That they likewise (remember),
    what was written to the Corinthians, that they "were yet carnal," who "required
    to be fed with milk," being as yet "unable to bear strong meat;" who also "thought
    that they knew somewhat, whereas they knew not yet anything, as they ought to
    know." (1 Cor. 8:2) When they raise the objection that the churches were rebuked,
    let them suppose that they were also corrected; let them also remember those (churches),
    concerning whose faith and knowledge and conversation the apostle "rejoices and
    gives thanks to God," which nevertheless even at this day, unite with those which
    were rebuked in the privileges of one and the same institution. The One Tradition
    of the Faith, Which is Substantially Alike in the Churches Everywhere, a Good
    Proof that the Transmission Has Been True and Honest in the Main. Chapter XXVIII.—The
    One Tradition of the Faith, Which is Substantially Alike in the Churches Everywhere,
    a Good Proof that the Transmission Has Been True and Honest in the Main. Grant,
    then, that all have erred; that the apostle was mistaken in giving his testimony;
    that the Holy Ghost had no such respect to any one (church) as to lead it into
    truth, although sent with this view by Christ, (John 14:26) and for this asked
    of the Father that He might be the teacher of truth; (John 15:26) grant, also,
    that He, the Steward of God, the Vicar of Christ, neglected His office, permitting
    the churches for a time to understand differently, (and) to believe differently,
    what He Himself was preaching by the apostles,—is it likely that so many churches,
    and they so great, should have gone astray into one and the same faith? No casualty
    distributed among many men issues in one and the same result. Error of doctrine
    in the churches must necessarily have produced various issues. When, however,
    that which is deposited among many is found to be one and the same, it is not
    the result of error, but of tradition. Can any one, then, be reckless enough to
    say that they were in error who handed on the tradition? The Truth Not Indebted
    to the Care of the Heretics; It Had Free Course Before They Appeared. Priority
    of the Church''s Doctrine a Mark of Its Truth. Chapter XXIX.—The Truth Not Indebted
    to the Care of the Heretics; It Had Free Course Before They Appeared. Priority
    of the Church’s Doctrine a Mark of Its Truth. In whatever manner error came, it
    reigned of course only as long as there was an absence of heresies? Truth had
    to wait for certain Marcionites and Valentinians to set it free. During the interval
    the gospel was wrongly preached; men wrongly believed; so many thousands were
    wrongly baptized; so many works of faith were wrongly wrought; so many miraculous
    gifts, so many spiritual endowments, were wrongly set in operation; so many priestly
    functions, so many ministries, were wrongly executed; and, to sum up the whole,
    so many martyrs wrongly received their crowns! Else, if not wrongly done, and
    to no purpose, how comes it to pass that the things of God were on their course
    before it was known to what God they belonged? that there were Christians before
    Christ was found? that there were heresies before true doctrine? Not so; for in
    all cases truth precedes its copy, the likeness succeeds the reality. Absurd enough,
    however, is it, that heresy should be deemed to have preceded its own prior doctrine,
    even on this account, because it is that (doctrine) itself which foretold that
    there should be heresies against which men would have to guard! To a church which
    possessed this doctrine, it was written—yea, the doctrine itself writes to its
    own church—"Though an angel from heaven preach any other gospel than that which
    we have preached, let him be accursed." Comparative Lateness of Heresies. Marcion''s
    Heresy. Some Personal Facts About Him. The Heresy of Apelles. Character of This
    Man; Philumene; Valentinus; Nigidius, and Hermogenes. Chapter XXX.—Comparative
    Lateness of Heresies. Marcion’s Heresy. Some Personal Facts About Him. The Heresy
    of Apelles. Character of This Man; Philumene; Valentinus; Nigidius, and Hermogenes.
    Where was Marcion then , that shipmaster of Pontus, the zealous student of Stoicism?
    Where was Valentinus then , the disciple of Platonism? For it is evident that
    those men lived not so long ago,—in the reign of Antoninus for the most part,—and
    that they at first were believers in the doctrine of the Catholic Church, in the
    church of Rome under the episcopate of the blessed Eleutherus, until on account
    of their ever restless curiosity, with which they even infected the brethren,
    they were more than once expelled. Marcion, indeed, [went] with the two hundred
    sesterces which he had brought into the church, and, when banished at last to
    a permanent excommunication, they scattered abroad the poisons of their doctrines.
    Afterwards, it is true, Marcion professed repentance, and agreed to the conditions
    granted to him—that he should receive reconciliation if he restored to the church
    all the others whom he had been training for perdition: he was prevented, however,
    by death. It was indeed necessary that there should be heresies; (1 Cor. 11:19)
    and yet it does not follow from that necessity, that heresies are a good thing.
    As if it has not been necessary also that there should be evil! It was even necessary
    that the Lord should be betrayed; but woe to the traitor! (Mark 14:21) So that
    no man may from this defend heresies. If we must likewise touch the descent of
    Apelles, he is far from being "one of the old school," like his instructor and
    moulder, Marcion; he rather forsook the continence of Marcion, by resorting to
    the company of a woman, and withdrew to Alexandria, out of sight of his most abstemious
    master. Returning therefrom, after some years, unimproved, except that he was
    no longer a Marcionite, he clave to another woman, the maiden Philumene (whom
    we have already mentioned), who herself afterwards became an enormous prostitute.
    Having been imposed on by her vigorous spirit, he committed to writing the revelations
    which he had learned of her. Persons are still living who remember them,—their
    own actual disciples and successors,—who cannot therefore deny the lateness of
    their date. But, in fact, by their own works they are convicted, even as the Lord
    said. (Matt. 7:16) For since Marcion separated the New Testament from the Old,
    he is (necessarily) subsequent to that which he separated, inasmuch as it was
    only in his power to separate what was (previously) united. Having then been united
    previous to its separation, the fact of its subsequent separation proves the subsequence
    also of the man who effected the separation. In like manner Valentinus, by his
    different expositions and acknowledged emendations, makes these changes on the
    express ground of previous faultiness, and therefore demonstrates the difference
    of the documents. These corrupters of the truth we mention as being more notorious
    and more public than others. There is, however, a certain man named Nigidius,
    and Hermogenes, and several others, who still pursue the course of perverting
    the ways of the Lord. Let them show me by what authority they come! If it be some
    other God they preach, how comes it that they employ the things and the writings
    and the names of that God against whom they preach? If it be the same God, why
    treat Him in some other way? Let them prove themselves to be new apostles! Let
    them maintain that Christ has come down a second time, taught in person a second
    time, has been twice crucified, twice dead, twice raised! For thus has the apostle
    described (the order of events in the life of Christ); for thus, too, is He accustomed
    to make His apostles—to give them, (that is), power besides of working the same
    miracles which He worked Himself. I would therefore have their mighty deeds also
    brought forward; except that I allow their mightiest deed to be that by which
    they perversely vie with the apostles. For whilst they used to raise men to life
    from the dead, these consign men to death from their living state. Truth First,
    Falsehood Afterwards, as Its Perversion. Christ''s Parable Puts the Sowing of
    the Good Seed Before the Useless Tares. Chapter XXXI.—Truth First, Falsehood Afterwards,
    as Its Perversion. Christ’s Parable Puts the Sowing of the Good Seed Before the
    Useless Tares. Let me return, however, from this digression to discuss the priority
    of truth, and the comparative lateness of falsehood, deriving support for my argument
    even from that parable which puts in the first place the sowing by the Lord of
    the good seed of the wheat, but introduces at a later stage the adulteration of
    the crop by its enemy the devil with the useless weed of the wild oats. For herein
    is figuratively described the difference of doctrines, since in other passages
    also the word of God is likened unto seed. From the actual order, therefore, it
    becomes clear, that that which was first delivered is of the Lord and is true,
    whilst that is strange and false which was afterwards introduced. This sentence
    will keep its ground in opposition to all later heresies, which have no consistent
    quality of kindred knowledge inherent in them—to claim the truth as on their side.
    None of the Heretics Claim Succession from the Apostles. New Churches Still Apostolic,
    Because Their Faith is that Which the Apostles Taught and Handed Down. The Heretics
    Challenged to Show Any Apostolic Credentials. Chapter XXXII.—None of the Heretics
    Claim Succession from the Apostles. New Churches Still Apostolic, Because Their
    Faith is that Which the Apostles Taught and Handed Down. The Heretics Challenged
    to Show Any Apostolic Credentials. But if there be any (heresies) which are bold
    enough to plant themselves in the midst of the apostolic age, that they may thereby
    seem to have been handed down by the apostles, because they existed in the time
    of the apostles, we can say: Let them produce the original records of their churches;
    let them unfold the roll of their bishops, running down in due succession from
    the beginning in such a manner that [that first bishop of theirs] bishop shall
    be able to show for his ordainer and predecessor some one of the apostles or of
    apostolic men,—a man, moreover, who continued stedfast with the apostles. For
    this is the manner in which the apostolic churches transmit their registers: as
    the church of Smyrna, which records that Polycarp was placed therein by John;
    as also the church of Rome, which makes Clement to have been ordained in like
    manner by Peter. In exactly the same way the other churches likewise exhibit (their
    several worthies), whom, as having been appointed to their episcopal places by
    apostles, they regard as transmitters of the apostolic seed. Let the heretics
    contrive something of the same kind. For after their blasphemy, what is there
    that is unlawful for them (to attempt)? But should they even effect the contrivance,
    they will not advance a step. For their very doctrine, after comparison with that
    of the apostles, will declare, by its own diversity and contrariety, that it had
    for its author neither an apostle nor an apostolic man; because, as the apostles
    would never have taught things which were self-contradictory, so the apostolic
    men would not have inculcated teaching different from the apostles, unless they
    who received their instruction from the apostles went and preached in a contrary
    manner. To this test, therefore will they be submitted for proof by those churches,
    who, although they derive not their founder from apostles or apostolic men (as
    being of much later date, for they are in fact being founded daily), yet, since
    they agree in the same faith, they are accounted as not less apostolic because
    they are akin in doctrine. Then let all the heresies, when challenged to these
    two tests by our apostolic church, offer their proof of how they deem themselves
    to be apostolic. But in truth they neither are so, nor are they able to prove
    themselves to be what they are not. Nor are they admitted to peaceful relations
    and communion by such churches as are in any way connected with apostles, inasmuch
    as they are in no sense themselves apostolic because of their diversity as to
    the mysteries of the faith. Present Heresies (Seedlings of the Tares Noted by
    the Sacred Writers) Already Condemned in Scripture. This Descent of Later Heresy
    from the Earlier Traced in Several Instances. Chapter XXXIII.—Present Heresies
    (Seedlings of the Tares Noted by the Sacred Writers) Already Condemned in Scripture.
    This Descent of Later Heresy from the Earlier Traced in Several Instances. Besides
    all this, I add a review of the doctrines themselves, which, existing as they
    did in the days of the apostles, were both exposed and denounced by the said apostles.
    For by this method they will be more easily reprobated, when they are detected
    to have been even then in existence, or at any rate to have been seedlings of
    the (tares) which then were. Paul, in his first epistle to the Corinthians, sets
    his mark on certain who denied and doubted the resurrection. (1 Cor. 15:12) This
    opinion was the especial property of the Sadducees. A part of it, however, is
    maintained by Marcion and Apelles and Valentinus, and all other impugners of the
    resurrection. Writing also to the Galatians, he inveighs against such men as observed
    and defend circumcision and the (Mosaic) law. (Gal. 5:2) Thus runs Hebion’s heresy.
    Such also as "forbid to marry" he reproaches in his instructions to Timothy. (1
    Tim. 4:3) Now, this is the teaching of Marcion and his follower Apelles. (The
    apostle) directs a similar blow against those who said that "the resurrection
    was past already." (2 Tim. 2:3) Such an opinion did the Valentinians assert of
    themselves. When again he mentions "endless genealogies," (1 Tim. 1:4) one also
    recognises Valentinus, in whose system a certain Æon, whosoever he be, of a new
    name, and that not one only, generates of his own grace Sense and Truth; and these
    in like manner produce of themselves Word and Life, while these again afterwards
    beget Man and the Church. From these primary eight ten other Æons after them spring,
    and then the twelve others arise with their wonderful names, to complete the mere
    story of the thirty Æons. The same apostle, when disapproving of those who are
    "in bondage to elements," (Gal. 4:9) points us to some dogma of Hermogenes, who
    introduces matter as having no beginning, and then compares it with God, who has
    no beginning. By thus making the mother of the elements a goddess, he has it in
    his power "to be in bondage" to a being which he puts on a par with God. John,
    however, in the Apocalypse is charged to chastise those "who eat things sacrificed
    to idols," and "who commit fornication." (Rev. 2:14) There are even now another
    sort of Nicolaitans. Theirs is called the Gaian heresy. But in his epistle he
    especially designates those as "Antichrists" who "denied that Christ was come
    in the flesh," (1 John 4:3) and who refused to think that Jesus was the Son of
    God. The one dogma Marcion maintained; the other, Hebion. The doctrine, however,
    of Simon’s sorcery, which inculcated the worship of angels, was itself actually
    reckoned amongst idolatries and condemned by the Apostle Peter in Simon’s own
    person. No Early Controversy Respecting the Divine Creator; No Second God Introduced
    at First. Heresies Condemned Alike by the Sentence and the Silence of Holy Scripture.
    Chapter XXXIV.—No Early Controversy Respecting the Divine Creator; No Second God
    Introduced at First. Heresies Condemned Alike by the Sentence and the Silence
    of Holy Scripture. These are, as I suppose, the different kinds of spurious doctrines,
    which (as we are informed by the apostles themselves) existed in their own day.
    And yet we find amongst so many various perversions of truth, not one school which
    raised any controversy concerning God as the Creator of all things. No man was
    bold enough to surmise a second god. More readily was doubt felt about the Son
    than about the Father, until Marcion introduced, in addition to the Creator, another
    god of goodness only. Apelles made the Creator of some nondescript glorious angel,
    who belonged to the superior God, the god (according to him,) of the law and of
    Israel, affirming that he was fire. Valentinus disseminated his Æons, and traced
    the sin of one Æon to the production of God the Creator. To none, forsooth, except
    these, nor prior to these, was revealed the truth of the Divine Nature; and they
    obtained this especial honour and fuller favour from the devil, we cannot doubt,
    because he wished even in this respect to rival God, that he might succeed, by
    the poison of his doctrines, in doing himself what the Lord said could not be
    done—making "the disciples above their Master." (Luke 6:40) Let the entire mass
    of heresies choose, therefore, for themselves the times when they should appear,
    provided that the when be an unimportant point; allowing, too, that they be not
    of the truth, and (as a matter of course) that such as had no existence in the
    time of the apostles could not possibly have had any connection with the apostles.
    If indeed they had then existed, their names would be extant, with a view to their
    own repression likewise. Those (heresies) indeed which did exist in the days of
    the apostles, are condemned in their very mention. If it be true, then, that those
    heresies, which in the apostolic times were in a rude form, are now found to be
    the same, only in a much more polished shape, they derive their condemnation from
    this very circumstance. Or if they were not the same, but arose afterwards in
    a different form, and merely assumed from them certain tenets, then, by sharing
    with them an agreement in their teaching, they must needs partake in their condemnation,
    by reason of the above-mentioned definition, of lateness of date, which meets
    us on the very threshold. Even if they were free from any participation in condemned
    doctrine, they would stand already judged on the mere ground of time, being all
    the more spurious because they were not even named by the apostles. Whence we
    have the firmer assurance, that these were (the heresies) which even then, were
    announced as about to arise. Let Heretics Maintain Their Claims by a Definite
    and Intelligible Evidence. This the Only Method of Solving Their Questions. Catholics
    Appeal Always to Evidence Traceable to Apostolic Sources. Chapter XXXV.—Let Heretics
    Maintain Their Claims by a Definite and Intelligible Evidence. This the Only Method
    of Solving Their Questions. Catholics Appeal Always to Evidence Traceable to Apostolic
    Sources. Challenged and refuted by us, according to these definitions, let all
    the heresies boldly on their part also advance similar rules to these against
    our doctrine, whether they be later than the apostles or contemporary with the
    apostles, provided they be different from them; provided also they were, by either
    a general or a specific censure, precondemned by them. For since they deny the
    truth of (our doctrine), they ought to prove that it also is heresy, refutable
    by the same rule as that by which they are themselves refuted; and at the same
    time to show us where we must seek the truth, which it is by this time evident
    has no existence amongst them. Our system is not behind any in date; on the contrary,
    it is earlier than all; and this fact will be the evidence of that truth which
    everywhere occupies the first place. The apostles, again, nowhere condemn it;
    they rather defend it,—a fact which will show that it comes from themselves. For
    that doctrine which they refrain from condemning, when they have condemned every
    strange opinion, they show to be their own, and on that ground too they defend
    it. The Apostolic Churches the Voice of the Apostles. Let the Heretics Examine
    Their Apostolic Claims, in Each Case, Indisputable. The Church of Rome Doubly
    Apostolic; Its Early Eminence and Excellence. Heresy, as Perverting the Truth,
    is Connected Therewith. Chapter XXXVI.—The Apostolic Churches the Voice of the
    Apostles. Let the Heretics Examine Their Apostolic Claims, in Each Case, Indisputable.
    The Church of Rome Doubly Apostolic; Its Early Eminence and Excellence. Heresy,
    as Perverting the Truth, is Connected Therewith. Come now, you who would indulge
    a better curiosity, if you would apply it to the business of your salvation, run
    over the apostolic churches, in which the very thrones of the apostles are still
    pre-eminent in their places, in which their own authentic writings are read, uttering
    the voice and representing the face of each of them severally. Achaia is very
    near you, (in which) you find Corinth. Since you are not far from Macedonia, you
    have Philippi; (and there too) you have the Thessalonians. Since you are able
    to cross to Asia, you get Ephesus. Since, moreover, you are close upon Italy,
    you have Rome, from which there comes even into our own hands the very authority
    (of apostles themselves). How happy is its church, on which apostles poured forth
    all their doctrine along with their blood! where Peter endures a passion like
    his Lord’s! where Paul wins his crown in a death like John’s where the Apostle
    John was first plunged, unhurt, into boiling oil, and thence remitted to his island-exile!
    See what she has learned, what taught, what fellowship has had with even (our)
    churches in Africa! One Lord God does she acknowledge, the Creator of the universe,
    and Christ Jesus (born) of the Virgin Mary, the Son of God the Creator; and the
    Resurrection of the flesh; the law and the prophets she unites in one volume with
    the writings of evangelists and apostles, from which she drinks in her faith.
    This she seals with the water (of baptism), arrays with the Holy Ghost, feeds
    with the Eucharist, cheers with martyrdom, and against such a discipline thus
    (maintained) she admits no gainsayer. This is the discipline which I no longer
    say foretold that heresies should come, but from which they proceeded. However,
    they were not of her, because they were opposed to her. Even the rough wild-olive
    arises from the germ of the fruitful, rich, and genuine olive; also from the seed
    of the mellowest and sweetest fig there springs the empty and useless wild-fig.
    In the same way heresies, too, come from our plant, although not of our kind;
    (they come) from the grain of truth, but, owing to their falsehood, they have
    only wild leaves to show. Heretics Not Being Christians, But Rather Perverters
    of Christ''s Teaching, May Not Claim the Christian Scriptures. These are a Deposit,
    Committed to and Carefully Kept by the Church. Chapter XXXVII.—Heretics Not Being
    Christians, But Rather Perverters of Christ’s Teaching, May Not Claim the Christian
    Scriptures. These are a Deposit, Committed to and Carefully Kept by the Church.
    Since this is the case, in order that the truth may be adjudged to belong to us,
    "as many as walk according to the rule," which the church has handed down from
    the apostles, the apostles from Christ, and Christ from God, the reason of our
    position is clear, when it determines that heretics ought not to be allowed to
    challenge an appeal to the Scriptures, since we, without the Scriptures, prove
    that they have nothing to do with the Scriptures. For as they are heretics, they
    cannot be true Christians, because it is not from Christ that they get that which
    they pursue of their own mere choice, and from the pursuit incur and admit the
    name of heretics. Thus, not being Christians, they have acquired no right to the
    Christian Scriptures; and it may be very fairly said to them, "Who are you? When
    and whence did you come? As you are none of mine, what have you to do with that
    which is mine? Indeed, Marcion, by what right do you hew my wood? By whose permission,
    Valentinus, are you diverting the streams of my fountain? By what power, Apelles,
    are you removing my landmarks? This is my property. Why are you, the rest, sowing
    and feeding here at your own pleasure? This (I say) is my property. I have long
    possessed it; I possessed it before you. I hold sure title-deeds from the original
    owners themselves, to whom the estate belonged. I am the heir of the apostles.
    Just as they carefully prepared their will and testament, and committed it to
    a trust, and adjured (the trustees to be faithful to their charge), (compare 1
    Tim. 5:21; 1 Tim. 6:13; 2 Tim. 2:14; 2 Tim. 4:1–4) even so do I hold it. As for
    you, they have, it is certain, always held you as disinherited, and rejected you
    as strangers—as enemies. But on what ground are heretics strangers and enemies
    to the apostles, if it be not from the difference of their teaching, which each
    individual of his own mere will has either advanced or received in opposition
    to the apostles?" Harmony of the Church and the Scriptures. Heretics Have Tampered
    with the Scriptures, and Mutilated, and Altered Them. Catholics Never Change the
    Scriptures, Which Always Testify for Them. Chapter XXXVIII.—Harmony of the Church
    and the Scriptures. Heretics Have Tampered with the Scriptures, and Mutilated,
    and Altered Them. Catholics Never Change the Scriptures, Which Always Testify
    for Them. Where diversity of doctrine is found, there , then, must the corruption
    both of the Scriptures and the expositions thereof be regarded as existing. On
    those whose purpose it was to teach differently, lay the necessity of differently
    arranging the instruments of doctrine. They could not possibly have effected their
    diversity of teaching in any other way than by having a difference in the means
    whereby they taught. As in their case, corruption in doctrine could not possibly
    have succeeded without a corruption also of its instruments, so to ourselves also
    integrity of doctrine could not have accrued, without integrity in those means
    by which doctrine is managed. Now, what is there in our Scriptures which is contrary
    to us? What of our own have we introduced, that we should have to take it away
    again, or else add to it, or alter it, in order to restore to its natural soundness
    anything which is contrary to it, and contained in the Scriptures? What we are
    ourselves, that also the Scriptures are (and have been) from the beginning. Of
    them we have our being, before there was any other way, before they were interpolated
    by you. Now, inasmuch as all interpolation must be believed to be a later process,
    for the express reason that it proceeds from rivalry which is never in any case
    previous to nor home-born with that which it emulates, it is as incredible to
    every man of sense that we should seem to have introduced any corrupt text into
    the Scriptures, existing, as we have been, from the very first, and being the
    first, as it is that they have not in fact introduced it who are both later in
    date and opposed (to the Scriptures). One man perverts the Scriptures with his
    hand, another their meaning by his exposition. For although Valentinus seems to
    use the entire volume, he has none the less laid violent hands on the truth only
    with a more cunning mind and skill than Marcion. Marcion expressly and openly
    used the knife, not the pen, since he made such an excision of the Scriptures
    as suited his own subject-matter. Valentinus, however, abstained from such excision,
    because he did not invent Scriptures to square with his own subject-matter, but
    adapted his matter to the Scriptures; and yet he took away more, and added more,
    by removing the proper meaning of every particular word, and adding fantastic
    arrangements of things which have no real existence. What St. Paul Calls Spiritual
    Wickednesses Displayed by Pagan Authors, and by Heretics, in No Dissimilar Manner.
    Holy Scripture Especially Liable to Heretical Manipulation. Affords Material for
    Heresies, Just as Virgil Has Been the Groundwork of Literary Plagiarisms, Different
    in Purport from the Original. Chapter XXXIX.—What St. Paul Calls Spiritual Wickednesses
    Displayed by Pagan Authors, and by Heretics, in No Dissimilar Manner. Holy Scripture
    Especially Liable to Heretical Manipulation. Affords Material for Heresies, Just
    as Virgil Has Been the Groundwork of Literary Plagiarisms, Different in Purport
    from the Original. These were the ingenious arts of "spiritual wickednesses,"
    (see Eph. 6:12; 1 Cor. 11:18) wherewith we also, my brethren, may fairly expect
    to have "to wrestle," as necessary for faith, that the elect may be made manifest,
    (and) that the reprobate may be discovered. And therefore they possess influence,
    and a facility in thinking out and fabricating errors, which ought not to be wondered
    at as if it were a difficult and inexplicable process, seeing that in profane
    writings also an example comes ready to hand of a similar facility. You see in
    our own day, composed out of Virgil, a story of a wholly different character,
    the subject-matter being arranged according to the verse, and the verse according
    to the subject-matter. In short, Hosidius Geta has most completely pilfered his
    tragedy of Medea from Virgil. A near relative of my own, among some leisure productions
    of his pen, has composed out of the same poet The Table of Cebes. On the same
    principle, those poetasters are commonly called Homerocentones , "collectors of
    Homeric odds and ends," who stitch into one piece, patchwork fashion, works of
    their own from the lines of Homer, out of many scraps put together from this passage
    and from that (in miscellaneous confusion). Now, unquestionably, the Divine Scriptures
    are more fruitful in resources of all kinds for this sort of facility. Nor do
    I risk contradiction in saying that the very Scriptures were even arranged by
    the will of God in such a manner as to furnish materials for heretics, inasmuch
    as I read that "there must be heresies," (1 Cor. 11:19) which there cannot be
    without the Scriptures. No Difference in the Spirit of Idolatry and of Heresy.
    In the Rites of Idolatry, Satan Imitated and Distorted the Divine Institutions
    of the Older Scriptures. The Christian Scriptures Corrupted by Him in the Perversions
    of the Various Heretics. Chapter XL.—No Difference in the Spirit of Idolatry and
    of Heresy. In the Rites of Idolatry, Satan Imitated and Distorted the Divine Institutions
    of the Older Scriptures. The Christian Scriptures Corrupted by Him in the Perversions
    of the Various Heretics. The question will arise, By whom is to be interpreted
    the sense of the passages which make for heresies? By the devil, of course, to
    whom pertain those wiles which pervert the truth, and who, by the mystic rites
    of his idols, vies even with the essential portions of the sacraments of God.
    He, too, baptizes some—that is, his own believers and faithful followers; he promises
    the putting away of sins by a laver (of his own); and if my memory still serves
    me, Mithra there, (in the kingdom of Satan,) sets his marks on the foreheads of
    his soldiers; celebrates also the oblation of bread, and introduces an image of
    a resurrection, and before a sword wreathes a crown. What also must we say to
    (Satan’s) limiting his chief priest to a single marriage? He, too, has his virgins;
    he, too, has his proficients in continence. Suppose now we revolve in our minds
    the superstitions of Numa Pompilius, and consider his priestly offices and badges
    and privileges, his sacrificial services, too, and the instruments and vessels
    of the sacrifices themselves, and the curious rites of his expiations and vows:
    is it not clear to us that the devil imitated the well-known moroseness of the
    Jewish law? Since, therefore he has shown such emulation in his great aim of expressing,
    in the concerns of his idolatry, those very things of which consists the administration
    of Christ’s sacraments, it follows, of course, that the same being, possessing
    still the same genius, both set his heart upon, and succeeded in, adapting to
    his profane and rival creed the very documents of divine things and of the Christian
    saints—his interpretation from their interpretations, his words from their words,
    his parables from their parables. For this reason, then, no one ought to doubt,
    either that "spiritual wickednesses," from which also heresies come, have been
    introduced by the devil, or that there is any real difference between heresies
    and idolatry, seeing that they appertain both to the same author and the same
    work that idolatry does. They either pretend that there is another god in opposition
    to the Creator, or, even if they acknowledge that the Creator is the one only
    God, they treat of Him as a different being from what He is in truth. The consequence
    is, that every lie which they speak of God is in a certain sense a sort of idolatry.
    The Conduct of Heretics: Its Frivolity, Worldliness, and Irregularity. The Notorious
    Wantonness of Their Women. Chapter XLI.—The Conduct of Heretics: Its Frivolity,
    Worldliness, and Irregularity. The Notorious Wantonness of Their Women. I must
    not omit an account of the conduct also of the heretics—how frivolous it is, how
    worldly, how merely human, without seriousness, without authority, without discipline,
    as suits their creed. To begin with, it is doubtful who is a catechumen, and who
    a believer; they have all access alike, they hear alike, they pray alike—even
    heathens, if any such happen to come among them. "That which is holy they will
    cast to the dogs, and their pearls," although (to be sure) they are not real ones,
    "they will fling to the swine." (see Matt. 7:6) Simplicity they will have to consist
    in the overthrow of discipline, attention to which on our part they call brothelry.
    Peace also they huddle up anyhow with all comers; for it matters not to them,
    however different be their treatment of subjects, provided only they can conspire
    together to storm the citadel of the one only Truth. All are puffed up, all offer
    you knowledge. Their catechumens are perfect before they are full-taught. The
    very women of these heretics, how wanton they are! For they are bold enough to
    teach, to dispute, to enact exorcisms, to undertake cures—it may be even to baptize.
    Their ordinations, are carelessly administered, capricious, changeable. At one
    time they put novices in office; at another time, men who are bound to some secular
    employment; at another, persons who have apostatized from us, to bind them by
    vainglory, since they cannot by the truth. Nowhere is promotion easier than in
    the camp of rebels, where the mere fact of being there is a foremost service.
    And so it comes to pass that to-day one man is their bishop, to-morrow another;
    to-day he is a deacon who to-morrow is a reader; to-day he is a presbyter who
    tomorrow is a layman. For even on laymen do they impose the functions of priesthood.
    Heretics Work to Pull Down and to Destroy, Not to Edify and Elevate. Heretics
    Do Not Adhere Even to Their Own Traditions, But Harbour Dissent Even from Their
    Own Founders. Chapter XLII.—Heretics Work to Pull Down and to Destroy, Not to
    Edify and Elevate. Heretics Do Not Adhere Even to Their Own Traditions, But Harbour
    Dissent Even from Their Own Founders. But what shall I say concerning the ministry
    of the word, since they make it their business not to convert the heathen, but
    to subvert our people? This is rather the glory which they catch at, to compass
    the fall of those who stand, not the raising of those who are down. Accordingly,
    since the very work which they purpose to themselves comes not from the building
    up of their own society, but from the demolition of the truth, they undermine
    our edifices, that they may erect their own. Only deprive them of the law of Moses,
    and the prophets, and the divinity of the Creator, and they have not another objection
    to talk about. The consequence is, that they more easily accomplish the ruin of
    standing houses than the erection of fallen ruins. It is only when they have such
    objects in view that they show themselves humble and bland and respectful. Otherwise
    they know no respect even for their own leaders. Hence it is [supposed] that schisms
    seldom happen among heretics, because, even when they exist, they are not obvious.
    Their very unity, however, is schism. I am greatly in error if they do not amongst
    themselves swerve even from their own regulations, forasmuch as every man, just
    as it suits his own temper, modifies the traditions he has received after the
    same fashion as the man who handed them down did, when he moulded them according
    to his own will. The progress of the matter is an acknowledgment at once of its
    character and of the manner of its birth. That was allowable to the Valentinians
    which had been allowed to Valentinus; that was also fair for the Marcionites which
    had been done by Marcion—even to innovate on the faith, as was agreeable to their
    own pleasure. In short, all heresies, when thoroughly looked into, are detected
    harbouring dissent in many particulars even from their own founders. The majority
    of them have not even churches. Motherless, houseless, creedless, outcasts, they
    wander about in their own essential worthlessness. Loose Company Preferred by
    Heretics. Ungodliness the Effect of Their Teaching the Very Opposite of Catholic
    Truth, Which Promotes the Fear of God, Both in Religious Ordinances and Practical
    Life. Chapter XLIII.—Loose Company Preferred by Heretics. Ungodliness the Effect
    of Their Teaching the Very Opposite of Catholic Truth, Which Promotes the Fear
    of God, Both in Religious Ordinances and Practical Life. It has also been a subject
    of remark, how extremely frequent is the intercourse which heretics hold with
    magicians, with mountebanks, with astrologers, with philosophers; and the reason
    is, that they are men who devote themselves to curious questions. "Seek, and ye
    shall find," is everywhere in their minds. Thus, from the very nature of their
    conduct, may be estimated the quality of their faith. In their discipline we have
    an index of their doctrine. They say that God is not to be feared; therefore all
    things are in their view free and unchecked. Where, however is God not feared,
    except where He is not? Where God is not, there truth also is not. Where there
    is no truth, then, naturally enough, there is also such a discipline as theirs.
    But where God is, there exists "the fear of God, which is the beginning of wisdom."
    (Ps. 111:10; Prov. 1:7) Where the fear of God is, there is seriousness, an honourable
    and yet thoughtful diligence, as well as an anxious carefulness and a well-considered
    admission (to the sacred ministry) and a safely-guarded communion, and promotion
    after good service, and a scrupulous submission (to authority), and a devout attendance,
    and a modest gait, and a united church, and God in all things. Heresy Lowers Respect
    for Christ, and Destroys All Fear of His Great Judgment. The Tendency of Heretical
    Teaching on This Solemn Article of the Faith. The Present Treatise an Introduction
    to Certain Other Anti-Heretical Works of Our Author. Chapter XLIV.—Heresy Lowers
    Respect for Christ, and Destroys All Fear of His Great Judgment. The Tendency
    of Heretical Teaching on This Solemn Article of the Faith. The Present Treatise
    an Introduction to Certain Other Anti-Heretical Works of Our Author. These evidences,
    then, of a stricter discipline existing among us, are an additional proof of truth,
    from which no man can safely turn aside, who bears in mind that future judgment,
    when "we must all stand before the judgment-seat of Christ," (2 Cor. 5:10) to
    render an account of our faith itself before all things. What, then, will they
    say who shall have defiled it, even the virgin which Christ committed to them
    with the adultery of heretics? I suppose they will allege that no injunction was
    ever addressed to them by Him or by His apostles concerning depraved and perverse
    doctrines assailing them, or about their avoiding and abhorring the same. (He
    and His apostles, perhaps,) will acknowledge that the blame rather lies with themselves
    and their disciples, in not having given us previous warning and instruction!
    They will, besides, add a good deal respecting the high authority of each doctor
    of heresy,—how that these mightily strengthened belief in their own doctrine;
    how that they raised the dead, restored the sick, foretold the future, that so
    they might deservedly be regarded as apostles. As if this caution were not also
    in the written record: that many should come who were to work even the greatest
    miracles, in defence of the deceit of their corrupt preaching. So, forsooth, they
    will deserve to be forgiven! If, however, any, being mindful of the writings and
    the denunciations of the Lord and the apostles, shall have stood firm in the integrity
    of the faith, I suppose they will run great risk of missing pardon, when the Lord
    answers: I plainly forewarned you that there should be teachers of false doctrine
    in my name, as well as that of the prophets and apostles also; and to my own disciples
    did I give a charge, that they should preach the same things to you. But as for
    you, it was not, of course, to be supposed that you would believe me! I once gave
    the gospel and the doctrine of the said rule (of life and faith) to my apostles;
    but afterwards it was my pleasure to make considerable changes in it! I had promised
    a resurrection, even of the flesh; but, on second thoughts, it struck me that
    I might not be able to keep my promise! I had shown myself to have been born of
    a virgin; but this seemed to me afterwards to be a discreditable thing. I had
    said that He was my Father, who is the Maker of the sun and the showers; but another
    and better father has adopted me! I had forbidden you to lend an ear to heretics;
    but in this I erred! Such (blasphemies), it is possible, do enter the minds of
    those who go out of the right path, and who do not defend the true faith from
    the danger which besets it. On the present occasion, indeed, our treatise has
    rather taken up a general position against heresies, (showing that they must)
    all be refuted on definite, equitable, and necessary rules, without any comparison
    with the Scriptures. For the rest, if God in His grace permit, we shall prepare
    answers to certain of these heresies in separate treatises. To those who may devote
    their leisure in reading through these (pages), in the belief of the truth, be
    peace, and the grace of our God Jesus Christ for ever..” (Gnosticism — note)</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-the-prescription-against-heretics">The
    Prescription Against Heretics</a>)</p><h2>4th century</h2><h3>St Athanasius the
    Great (c. 295–373)</h3><blockquote><p>There are, then, of the Old Testament, twenty-two
    books in number; for, as I have heard, it is handed down that this is the number
    of the letters among the Hebrews; their respective order and names being as follows.
    <strong>The first is Genesis, then Exodus, next Leviticus, after that Numbers,
    and then Deuteronomy.</strong> Following these there is Joshua, the son of Nun,
    then Judges, then Ruth. And again, after these four books of Kings, the first
    and second being reckoned as one book, and so likewise the third and fourth as
    one book. And again, the first and second of the Chronicles are reckoned as one
    book. Again Ezra, the first and second are similarly one book. After these there
    is the book of Psalms, then the Proverbs, next Ecclesiastes, and the Song of Songs.
    Job follows, then the Prophets, the twelve being reckoned as one book. Then Isaiah,
    one book, then Jeremiah with Baruch, Lamentations, and the epistle, one book;
    afterwards, Ezekiel and Daniel, each one book. Thus far constitutes the Old Testament.
    5. Again it is not tedious to speak of the [books] of the New Testament. These
    are, the four Gospels, according to Matthew, Mark, Luke, and John. Afterwards,
    the Acts of the Apostles and Epistles (called Catholic), seven, viz. of James,
    one; of Peter, two; of John, three; after these, one of Jude. In addition, there
    are fourteen Epistles of Paul, written in this order. The first, to the Romans;
    then two to the Corinthians; after these, to the Galatians; next, to the Ephesians;
    then to the Philippians; then to the Colossians; after these, two to the Thessalonians,
    and that to the Hebrews; and again, two to Timothy; one to Titus; and lastly,
    that to Philemon. And besides, the Revelation of John. 6. These are fountains
    of salvation, that they who thirst may be satisfied with the living words they
    contain. In these alone is proclaimed the doctrine of godliness. Let no man add
    to these, neither let him take ought from these. For concerning these the Lord
    put to shame the Sadducees, and said, ‘Ye do err, not knowing the Scriptures.’
    And He reproved the Jews, saying, ‘Search the Scriptures, for these are they that
    testify of Me (Matt. 22:29; John 5:39).’ 7. But for greater exactness I add this
    also, writing of necessity; that there are other books besides these not indeed
    included in the Canon, but appointed by the Fathers to be read by those who newly
    join us, and who wish for instruction in the word of godliness. The Wisdom of
    Solomon, and the Wisdom of Sirach, and Esther, and Judith, and Tobit, and that
    which is called the Teaching of the Apostles, and the Shepherd. But the former,
    my brethren, are included in the Canon, the latter being [merely] read; nor is
    there in any place a mention of apocryphal writings. But they are an invention
    of heretics, who write them when they choose, bestowing upon them their approbation,
    and assigning to them a date, that so, using them as ancient writings, they may
    find occasion to lead astray the simple. (For 368.) From Letter XL.— (For 368.)
    ‘Ye are they that have continued with Me in My temptations; and I appoint unto
    you a kingdom, as My Father hath appointed unto Me, that ye may eat and drink
    at My table in My kingdom (Luke 22:28–30).’ Being called, then, to the great and
    heavenly Supper, in that upper room which has been swept, let us ‘cleanse ourselves,’
    as the Apostle exhorted, ‘from all filthiness of the flesh and spirit, perfecting
    holiness in the fear of God (2 Cor. 7:1);’ that so, being spotless within and
    without,—without, clothing ourselves with temperance and justice; within, by the
    Spirit, rightly dividing the word of truth—we may hear, ‘Enter into the joy of
    thy Lord (Matt. 25:21).’ (For 370.) From Letter XLII.— (For 370.) For we have
    been called, brethren, and are now called together, by Wisdom, and according to
    the Evangelical parable, to that great and heavenly Supper, and sufficient for
    every creature; I mean, to the Passover,—to Christ, Who is sacrificed; for ‘Christ
    our Passover is sacrificed.’ ( And afterwards: ) They, therefore, that are thus
    prepared shall hear, ‘Enter into the joy of thy Lord (Matt. 25:21; 1 Cor. 5:7).’
    (For 371.) From Letter XLIII.— (For 371.) Of us, then, whose also is the Passover,
    the calling is from above, and ‘our conversation is in heaven,’ as Paul says;
    ‘For we have here no abiding city, but we seek that which is to come (Phil. 3:20;
    Heb. 13:14),’ whereto, also, looking forward, we properly keep the feast. ( And
    again, afterwards: ) Heaven truly is high, and its distance from us infinite;
    for ‘the heaven of heavens,’ says he, ‘is the Lord’s (Ps. 15:16).’ But not, on
    that account, are we to be negligent or fearful, as though the way thereto were
    impossible; but rather should we be zealous. Yet not, as in the case of those
    who formerly, removing from the east and finding a plain in Senaar, began [to
    build a tower], is there need for us to bake bricks with fire, and to seek slime
    for mortar; for their tongues were confounded, and their work was destroyed. But
    for us the Lord has consecrated a way through His blood, and has made it easy.
    ( And again: ) For not only has He afforded us consolation respecting the distance,
    but also in that He has come and opened the door for us which was once shut. For,
    indeed, it was shut from the time He cast out Adam from the delight of Paradise,
    and set the Cherubim and the flaming sword, that turned every way, to keep the
    way of the tree of life—now, however, opened wide. And He that sitteth upon the
    Cherubim having appeared with greater grace and loving-kindness, led into Paradise
    with himself the thief who confessed, and having entered heaven as our forerunner,
    opened the gates to all. ( And again: ) Paul also, ‘pressing toward the mark for
    the prize of the high calling (Phil. 3:14),’ by it was taken up to the third heaven,
    and having seen those things which are above, and then descended, he teaches us,
    announcing what is written to the Hebrews, and saying, ‘For ye are not come unto
    the mount that might be touched, and that burned with fire, and clouds, and darkness,
    and a tempest, and to the voice of words. But ye are come unto Mount Sion, and
    unto the city of the living God, the heavenly Jerusalem, and to an innumerable
    company of angels, and to the general assembly and Church of the first-born, which
    are written in heaven (Heb. 12:18–23).’ Who would not wish to enjoy the high companionship
    with these! Who not desire to be enrolled with these, that he may hear with them,
    ‘Come, ye blessed of My Father, inherit the kingdom prepared for you from the
    foundation of the world (Matt. 25:34).’ (For 372.) And again, from the forty-fourth
    Letter, of which the commencement is, ''All that our Lord and Saviour Jesus Christ
    did instead of us and for us.'' From Letter XLIV.— (For 372.) And again, from
    the forty-fourth Letter, of which the commencement is, ‘All that our Lord and
    Saviour Jesus Christ did instead of us and for us.’ When therefore the servants
    of the Chief Priests and the Scribes saw these things, and heard from Jesus, ‘Whosoever
    is athirst, let him come to Me and drink (John 7:37);’ they perceived that this
    was not a mere man like themselves, but that this was He Who gave water to the
    saints, and that it was He Who was announced by the prophet Isaiah. For He was
    truly the splendour of the light (cf. Heb. 1:3), and the Word of God. And thus
    as a river from the fountain he gave drink also of old to Paradise; but now to
    all men He gives the same gift of the Spirit, and says, ‘If any man thirst, let
    him come to Me and drink.’ Whosoever ‘believeth on Me, as saith the Scripture,
    rivers of living water shall flow out of his belly (John 7:37–38).’ This was not
    for man to say, but for the living God, Who truly vouchsafes life, and gives the
    Holy Spirit. (For 373.) From Letter XLV.— (For 373.) Let us all take up our sacrifices,
    observing distribution to the poor, and enter into the holy place, as it is written;
    ‘whither also our forerunner Jesus is entered for us, having obtained eternal
    redemption.’…( From the same: )…And this is a great proof that, whereas we were
    strangers, we are called friends; from being formerly aliens, we are become fellow-citizens
    with the saints, and are called children of the Jerusalem which is above, whereof
    that which Solomon built was a type. For if Moses made all things according to
    the pattern shewed him in the mount, it is clear that the service performed in
    the tabernacle was a type of the heavenly mysteries, whereto the Lord, desirous
    that we should enter, prepared for us the new and abiding way. And as all the
    old things were a type of the new, so the festival that now is, is a type of the
    joy which is above, to which coming with psalms and spiritual songs, let us begin
    the fasts.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-the-festal-letters-1">Festal
    Letter 39, on the canon of Holy Scripture</a>)</p><blockquote><p>Let the following
    books of the Old Testament be held venerable and holy by all of you, clergy and
    laity: <strong>5 books of Moses — Genesis, Exodus, Leviticus, Numbers, Deuteronomy</strong>;
    of Joshua the son of Nun 1, of Judges 1, of Ruth 1, of Kings 4, of Chronicles
    2 (that is, of the book of days omitted in the book), of Ezra 2, of Esther 1,
    of the Maccabees 3, of Job 1, of the Psalter 1, of Solomon 3 — Proverbs, Ecclesiastes
    and the Song of Songs; of the prophets 12 books, of Isaiah 1, of Jeremiah 1, of
    Ezekiel 1, of Daniel 1. In addition let there be given to you for your instruction
    the Wisdom of the much-learned Sirach. <strong>And our books, that is, of the
    New Testament:</strong> 4 Gospels — Matthew, Mark, Luke and John; 14 epistles
    of Paul, 2 epistles of Peter, 3 epistles of John, 1 of James, 1 of Jude, 2 epistles
    of Clement, and the constitutions in 8 books addressed by me, Clement, to you
    the bishops (which must not be published before all on account of the mystical
    things contained in them), and our Acts of the Apostles.</p></blockquote><p>(Apostolic
    Canon 85)</p><blockquote><p>Of the books which are to be read. <strong>Books of
    the Old Testament:</strong> 1) Genesis of the world; 2) Exodus from Egypt; 3)
    Leviticus; 4) Numbers; 5) Deuteronomy; 6) Joshua the son of Nun; 7) Judges, Ruth;
    8) Esther; 9) First and Second Kings; 10) Third and Fourth Kings; 11) First and
    Second Chronicles; 12) First and Second Ezra; 13) the book of the 150 Psalms;
    14) the Proverbs of Solomon; 15) Ecclesiastes; 16) the Song of Songs; 17) Job;
    18) the twelve prophets; 19) Isaiah; 20) Jeremiah, Baruch, Lamentations and the
    Epistle; 21) Ezekiel; 22) Daniel. <strong>Books of the New Testament:</strong>
    1) the 4 Gospels — Matthew, Mark, Luke, John; 2) the Acts of the Apostles; 3)
    the 7 catholic epistles — of James 1, of Peter 2, of John 3, of Jude 1; 4) the
    14 epistles of Paul — to the Romans 1, to the Corinthians 2, to the Galatians
    1, to the Ephesians 1, to the Philippians 1, to the Colossians 1, to the Thessalonians
    2, to the Hebrews 1, to Timothy 2, to Titus 1, to Philemon 1.</p></blockquote><p>(Canon
    60 of the Council of Laodicea)</p><h3>St Gregory the Theologian (325–389)</h3><blockquote><p>But
    that your mind be not led astray by foreign books — for spurious writings are
    many — accept from me, friend, this tried list. There are, in all, <strong>twelve
    historical books of the ancient Hebrew wisdom</strong>: first Genesis, then Exodus,
    Leviticus, then Numbers, then Deuteronomy, then Joshua and Judges, Ruth as the
    eighth, and the ninth and tenth — the Acts of the Kings, then Chronicles, and
    Ezra as your last book. Of books in verse there are five: of them the first is
    Job, then David, then the 3 books of Solomon — Ecclesiastes, the Song of Songs
    and the Proverbs. Of the prophetic spirit there are likewise five books: 1 in
    the Scripture they compose twelve — Hosea, Amos and the third Micah, then Joel,
    then Jonah and Obadiah, Nahum, Habakkuk and Zephaniah, Haggai, then Zechariah
    and Malachi. This is one book, and the second is Isaiah, then Jeremiah called
    from his infancy, then Ezekiel and the grace of Daniel. Here I have set out 22
    books of the Old Testament, according to the number of the Hebrew letters; now
    reckon also <strong>the books of the new mystery</strong>. Matthew described the
    miracles of Christ for the Hebrews, Mark for Italy, Luke for Achaea, and John,
    the great heaven-walking preacher, for all. Then the Acts of the wise Apostles,
    14 epistles of Paul, 7 catholic, of which 1 is of James, 2 of Peter, 3 again of
    John, and the seventh of Jude. Here you have all the books; and if there are any
    besides them, they are not among the genuine.</p></blockquote><p>(Canon 1 of Gregory
    the Theologian)</p><h3>St Amphilochius of Iconium (c. 340 – after 394)</h3><blockquote><p>But
    especially must you know this, that not every book is trustworthy, even if it
    bears the venerable name of Scripture. For there exist, there sometimes exist,
    falsely-titled books: some of them, one may say, are middling and near to the
    word of truth, while others are spurious and most dangerous, like counterfeit
    and false coins, which though bearing the royal inscription are counterfeited
    in their composition. Therefore I will name to you each of the God-inspired books,
    and that you may know all clearly, first I will name <strong>the books of the
    Old Testament</strong>. The Pentateuch comprises the Creation, then Exodus, in
    the middle the book of Leviticus, after it Numbers, and then Deuteronomy. To them
    add the books of Joshua and Judges, then Ruth, the 4 books of Kings and the 2
    of Chronicles, after them Ezra the first and second. Next I will name the 5 books
    in verse: the book of Job, crowned for his contests in manifold sufferings, the
    book of Psalms, the tuneful healing of the soul, the 3 books of the wise Solomon
    — Proverbs, Ecclesiastes and the Song of Songs. To them add the 12 prophets: the
    first Hosea, then the second Amos, Micah, Joel, Obadiah and Jonah, the type of
    the three-day Suffering; after them Nahum, Habakkuk, then the ninth Zephaniah,
    Haggai and Zechariah, and the glorious herald Malachi. After them come to know
    the 4 prophets: the great Isaiah who spoke with boldness, the compassionate Jeremiah
    and the mystical Ezekiel, and the last — Daniel, most wise both in word and deed.
    To these books some add Esther. The time has come for me to name <strong>the books
    of the New Testament</strong>. Receive only the 4 Evangelists: Matthew, then Mark,
    with Luke added as the third; count John in time as the fourth, but in the height
    of his dogmas as the first, for worthily do I call him the son of thunder: he
    magnified the Word of God above all. Receive also the 2nd book of Luke — the book
    of the catholic Acts of the Apostles. And add the chosen vessel, the preacher
    and apostle of the nations — Paul, who wisely wrote to the Churches 14 Epistles:
    the first to the Romans, to which must be added 2 to the Corinthians, to the Galatians,
    to the Ephesians, after it to those living in Philippi, then what was written
    to the Colossians, 2 to the Thessalonians and 2 to Timothy, and to Titus and Philemon
    1 each, and to the Hebrews 1 (some call it spurious, but they speak wrongly, for
    in it is the genuine grace). What remains? Some say that 7 catholic Epistles should
    be received, others only 3: 1 of James, of Peter 1 and of John 1, while some accept
    3 epistles of John, besides them 2 of Peter, and the seventh — of Jude. Likewise
    the Apocalypse of John is recognized by some, but the majority call it spurious.
    Let this, then, be the most trustworthy canon of the God-inspired Scriptures.</p></blockquote><h2>5th
    century</h2><h3>The Council of Carthage (393–419)</h3><blockquote><p>Decreed:
    that nothing be read in the Church under the name of the Divine Scriptures except
    the canonical Scriptures. And the canonical Scriptures are these: Genesis, Exodus,
    Leviticus, Numbers, Deuteronomy, Joshua the son of Nun, Judges, 4 books of Kings,
    2 books of Chronicles, Job, the Psalter, 4 books of Solomon, 12 books of the prophets,
    Isaiah, Jeremiah, Ezekiel, Daniel, Tobit, Judith, Esther, 2 books of Ezra. <strong>Of
    the New Testament:</strong> 4 Gospels, 1 book of the Acts of the Apostles, 14
    epistles of Paul, 2 of the Apostle Peter, 3 of the Apostle John, 1 of the Apostle
    James, 1 of the Apostle Jude, the Apocalypse of John, 1 book.</p></blockquote><p>(Canon
    33)</p><h2>7th century</h2><h3>The Sixth Œcumenical Council (691)</h3><blockquote><p>This
    holy Council recognized as most excellent and most important that, from now on,
    for the healing of souls and the curing of passions, there shall remain firm and
    unbroken <strong>the 85 canons</strong>, received and ratified by the holy and
    blessed fathers who were before us and handed down to us in the name of the holy
    and glorious apostles. But since in these canons it is enjoined on us to receive
    as the Constitutions of the same holy apostles, transmitted through Clement, those
    “Constitutions” into which heretics of old, to the harm of the Church, introduced
    something spurious, foreign to piety and darkening for us the splendid beauty
    of the divine dogmas, we have, for the edification and security of the Christian
    flock, rightly rejected these “Constitutions”, in no way admitting the seeds of
    heretical falsehood or mixing them with the genuine and unimpaired teaching of
    the apostles. We approve also all the other sacred canons set forth by our holy
    and blessed fathers, namely: the 318 God-bearing fathers who assembled in Nicaea,
    the fathers in Ancyra, and also in Neocaesarea, in Gangra, in Antioch in Syria
    and in <strong>Laodicea of Phrygia</strong>; further, the 150 fathers who assembled
    in this God-guarded royal city; the 200 fathers who earlier established the Council
    in the metropolis of Ephesus; the 630 holy and blessed fathers who assembled in
    Chalcedon; likewise the Council of fathers in Sardica, and in <strong>Carthage</strong>;
    further, the fathers who again assembled in this God-saved and royal city under
    Nectarius, the prelate of this royal city, and Theophilus, archbishop of Alexandria.
    We also ratify the canons of Dionysius, archbishop of the great city of Alexandria;
    of Peter, archbishop of Alexandria and martyr; of Gregory the Wonderworker, bishop
    of Neocaesarea; of <strong>Athanasius, archbishop of Alexandria</strong>; of Basil,
    archbishop of Caesarea in Cappadocia; of Gregory of Nyssa; of <strong>Gregory
    the Theologian; of Amphilochius of Iconium</strong>; of Timothy the First, archbishop
    of the great city of Alexandria; of Theophilus, archbishop of the great city of
    Alexandria; of Cyril, archbishop of Alexandria, and of Gennadius, patriarch of
    this God-guarded and royal city. And also the canon of Cyprian, archbishop of
    the African country and martyr, which was set forth by the Council assembled under
    him and has obtained force by the transmitted custom in the places of the prelates
    named before, and among them alone. And let no one be permitted to distort the
    above-mentioned canons, or to annul them, or to accept canons other than those
    established, with a false superscription, composed by those who dared to traffic
    with the truth. But if anyone be convicted of altering any one of the above canons
    or of attempting to reject it, he shall be guilty of trespass against that canon:
    he shall bear the penance which it prescribes, and through that in which he stumbled
    shall receive healing.</p></blockquote><p>(Canon 2 of the Sixth Œcumenical Council)</p><h2>8th
    century</h2><h3>St John of Damascus (2nd half of the 7th c. – before 754)</h3><blockquote><p>Observe,
    further, that there are two and twenty books of the Old Testament, one for each
    letter of the Hebrew tongue. For there are twenty-two letters of which five are
    double, and so they come to be twenty-seven. For the letters Caph, Mere, Nun,
    Pe, Sade are double. And thus the number of the books in this way is twenty-two,
    but is found to be twenty-seven because of the double character of five. For Ruth
    is joined on to Judges, and the Hebrews count them one book: the first and second
    books of Kings are counted one and so are the third and fourth books of Kings:
    and also the first and second of Paraleipomenä and the first and second of Esdra.
    In this way, then, the books are collected together in four Pentateuchs and two
    others remain over, to form thus the canonical books. Five of them are of the
    Law, viz. Genesis, Exodus, Leviticus, Numbers, Deuteronomy. This which is the
    code of the Law, constitutes the first Pentateuch. Then comes another Pentateuch,
    the so-called Grapheia, or as they are called by some, the Hagiographa, which
    are the following: Jesus the Son of Nave, Judges along with Ruth, first and second
    Kings, which are one book, third and fourth Kings, which are one book, and the
    two books of the Paraleipomena which are one book. This is the second Pentateuch.
    The third Pentateuch is the books in verse, viz. Job, Psalms, Proverbs of Solomon,
    Ecclesiastes of Solomon and the Song of Songs of Solomon. The fourth Pentateuch
    is the Prophetical books, viz the twelve prophets constituting one book, Isaiah,
    Jeremiah, Ezekiel, Daniel. Then come the two books of Esdra made into one, and
    Esther. There are also the Panaretus, that is the Wisdom of Solomon, and the Wisdom
    of Jesus, which was published in Hebrew by the father of Sirach, and afterwards
    translated into Greek by his grandson, Jesus, the Son of Sirach. These are virtuous
    and noble, but are not counted nor were they placed in the ark. The New Testament
    contains four gospels, that according to Matthew, that according to Mark, that
    according to Luke, that according to John: the Acts of the Holy Apostles by Luke
    the Evangelist: seven catholic epistles, viz. one of James, two of Peter, three
    of John, one of Judë fourteen letters of the Apostle Paul: the Revelation of John
    the Evangelist: the Canons of the holy apostles, by Clement. Chapter XVIII. Regarding
    the things said concerning Christ The things said concerning Christ fall into
    four generic modes. For some fit Him even before the incarnation, others in the
    union, others after the union, and others after the resurrection. Also of those
    that refer to the period before the incarnation there are six modes: for some
    of them declare the union of nature and the identity in essence with the Father,
    as this, I and My Father are onë also this, He that hath seen Me hath seen the
    Father: and this, Who being in the form of God, and so forth. Others declare the
    perfection of subsistence, as these, Son of God, and the Express Image of His
    person, and Messenger of great counsel, Wonderful Counsellor, and the like. Again,
    others declare the indwelling of the subsistences in one another, as, I am in
    the Father and the Father in Me; and the inseparable foundation, as, for instance,
    the Word, Wisdom, Power, Effulgence. For the word is inseparably established in
    the mind (and it is the essential mind that I mean), and so also is wisdom, and
    power in him that is powerful, and effulgence in the light, all springing forth
    from these. And others make known the fact of His origin from the Father as cause,
    for instance My Father is greater than I. For from Him He derives both His being
    and all that He has: His being was by generative and not by creative means, as,
    I came forth from the Father and am come, and I live by the Father. But all that
    He hath is not His by free gift or by teaching, but in a causal sense, as, The
    Son can do nothing of Himself but what He seeth the Father do. For if the Father
    is not, neither is the Son. For the Son is of the Father and in the Father and
    with the Father, and not after the Father. In like manner also what He doeth is
    of Him and with Him. For there is one and the same, not similar but the same,
    will and energy and power in the Father, Son and Holy Spirit. Moreover, other
    things are said as though the Father''''s good-will was fulfilled through His
    energy, and not as through an instrument or a servant, but as through His essential
    and hypostatic Word and Wisdom and Power, because but one action is observed in
    Father and Son, as for example, All things were made by Him(9a), and He sent His
    Word and healed them, and That they may believe that Than hast sent Me. Some,
    again, have a prophetic sense, and of these some are in the future tensë for instance,
    He shall come openly, and this from Zechariah, Behold, thy King cometh unto thee,
    and this from Micah, Behold, the Lord cometh out of His place and will came down
    and tread upon the high places of the earth. But others, though future, are put
    in the past tense, as, for instance, This is our God: Therefore He was seen upon
    the earth and dwell among men, and The Lord created me in the beginning of His
    ways for His works, and Wherefore God, thy God, anointed thee with the oil of
    gladness above thy fellows, and such like. The things said, then, that refer to
    the period before the union will be applicable to Him even after the union: but
    those that refer to the period after the union will not be applicable at all before
    the union, unless indeed in a prophetic sense, as we said. Those that refer to
    the time of the union have three modes. For when our discourse dears with the
    higher aspect, we speak of the deification of the flesh, and His assumption of
    the Word and exceeding exaltation, and so forth, making manifest the riches that
    are added to the flesh tram the union and natural conjunction with the most high
    God the Word. And when our discourse deals with the lower aspect, we speak of
    the incarnation of God the Word, His becoming man, His emptying of Himself, His
    poverty, His humility. For these and such like are imposed upon the Word and God
    through His admixture with humanity. When again we keep both sides in view at
    the same time, we speak of union, community, anointing, natural conjunction, conformation
    and the like. The former two modes, then, have their reason in this third mode.
    For through the union it is made clear what either has obtained from the intimate
    junction with and permeation through the other. For through the union in subsistence
    the flesh is said to be deified and to become God and to be equally God with the
    Word; and God the Word is said to be made flesh, and to become man, and is called
    creature and last: not in the sense that the two natures are converted into one
    compound nature (for it is not possible for the opposite natural qualities to
    exist at the same time in one nature), but in the sense that the two natures are
    united in subsistence and permeate one another without confusion or transmutation
    The permeation moreover did not come of the flesh but of the divinity: for it
    is impossible that the flesh should permeate through the divinity: but the divine
    nature once permeating through the flesh gave also to the flesh the same ineffable
    power of permeation; and this indeed is what we call union. Note, too, that in
    the case of the first and second modes of those that belong to the period of the
    union, reciprocation is observed. For when we speak about the flesh, we use the
    terms deification and assumption of the Word and exceeding exaltation and anointing.
    For these are derived from divinity, but are observed in connection with the flesh.
    And when we speak about the Word, we use the terms emptying, incarnation, becoming
    man, humility and the likë and these, as we said, are imposed on the Word and
    God through the flesh. For He endured these things in person of His own free-will.
    Of the things that refer to the period after the union there are three modes.
    The first declares His divine nature, as, I am in the Father and the Father in
    Me, and I and the Father are onë and all those things which are affirmed of Him
    before His assumption of humanity, these will be affirmed of Him even after His
    assumption of humanity, with this exception, that He did not assume the flesh
    and its natural properties. The second declares His human nature, as, Now ye seek
    to kill Me, a man that hath told you the truth, and Even so must the Son of Man
    be lifted up, and the like. Further, of the statements made and written about
    Christ the Saviour after the manner of men, whether they deal with sayings or
    actions, there are six modes. For some of them were done or said naturally in
    accordance with the incarnation; for instance, His birth from a virgin, His growth
    and progress with age, His hunger, thirst, weariness, fear, sleep, piercing with
    nails, death and all such like natural and innocent passions. For in all these
    there is a mixture of the divine and human, although they are held to belong in
    reality to the body, the divine suffering none of these, but procuring through
    them our salvation. Others are of the nature of ascription(9a), as Christ''''s
    question, Where have ye laid Lazarus? His running to the fig-tree, His shrinking,
    that is, His drawing back, His praying, and His making as though He would have
    gone He in need of these or similar things, but only because His form was that
    of a man as necessity and expediency demanded. For example, the praying was to
    shew that He is not opposed to God, for He gives honour to the Father as the cause
    of Himself: and the question was not put in ignorance but to shew that He is in
    truth man as well as God; and the drawing back is to teach us not to be impetuous
    nor to give ourselves up. Others again are said in the manner of association and
    relation(5a), as, My God, My God, why hast Thou forsaken Me? and He hath made
    Him to be sin for us, Who knew no sin, and being made a curse for us; also, Then
    shall the Son also Himself be subject unto Him that put all things under Him.
    For neither as God nor as man was He ever forsaken by the Father, nor did He become
    sin or a curse, nor did He require to be made subject to the Father. For as God
    He is equal to the Father and not opposed to Him nor subjected to Him; and as
    God, He was never at any time disobedient to His Begetter to make it necessary
    for Him to make Him subject. Appropriating, then, our person and ranking Himself
    with us, He used these words. For we are bound in the fetters of sin and the curse
    as faithless and disobedient, and therefore forsaken. Others are said by reason
    of distinction in thought. For if you divide in thought things that are inseparable
    in actual truth, to cut the flesh from the Word, the terms ''''servant'' and ''ignorant''
    are used of Him, for indeed He was of a subject and ignorant nature, and except
    that it was united with God the Word, His flesh was servile and ignorant. But
    because of the union in subsistence with God the Word it was neither servile nor
    ignorant. In this way, too, He called the Father His God. Others again are for
    the purpose of revealing Him to us and strengthening our faith, as, And now, O
    Father, glorify Thou Me with the glory which I had with Thee, before the world
    was. For He Himself was glorified and is glorified, but His glory was not manifested
    nor confirmed to us. Also that which the apostle said, Declared to be the Son
    of God with power, according to the spirit of holiness, by the resurrection from
    the dead. For by the miracles and the resurrection and the coming of the Holy
    Spirit it was manifested and confirmed to the world that He is the Son of God.
    And this too, The Child grew in wisdom and grace. Others again have reference
    to His appropriation of the personal life of the Jews, in numbering Himself among
    the Jews, as He saith to the Samaritan woman, Ye worship ye know not what: we
    know what we worship, far salvation is of the Jews. The third mode is one which
    declares the one subsistence and brings out the dual naturë for instance, And
    I live by the Father: so he that eateth Me, even he shall live by Me. And this:
    I go to My Father and ye see Me no more. And this: They would not have crucified
    the Lord of Glory. And this: And no man hath ascended up to heaven but He that
    came down from heaven, even the Son of Man which is in heaven, and such like.
    Again of the affirmations that refer to the period after the resurrection some
    are suitable to God, as, Baptizing them in the name of the Father, and of the
    Son, and of the Holy Ghost, for here ''Son'' is clearly used as God; also this,
    And lo, I am with you alway, even unto the end of the world, and other similar
    ones. For He is with us as God. Others are suitable to man, as, They held Him
    by the feet, and There they will see Me, and so forth. Further, of those referring
    to the period after the Resurrection that are suitable to man there are different
    modes. For some did actually take place, yet not according to nature, but according
    to dispensation, in order to confirm the fact that the very body, which suffered,
    rose again; such are the weals, the eating and the drinking after the resurrection.
    Others took place actually and naturally, as changing from place to place without
    trouble and passing in through closed gates. Others have the character of simulation,
    as, He made as though He would have gone further. Others are appropriate to the
    double nature, as, I ascend unto My Father and your Father, and My God and our
    God, and The King of Glory shall carte in, and He sat down on the right hand of
    the majesty on High. Finally others are to be understood as though He were ranking
    Himself with us, in the manner of separation in pure thought, as, My God and your
    God. Those then that are sublime must be assigned to the divine nature, which
    is superior to passion and body: and those that are humble must be ascribed to
    the human nature; and those that are common must be attributed to the compound,
    that is, the one Christ, Who is God and man. And it should be understood that
    both belong to one and the same Jesus Christ, our Lord. For if we know what is
    proper to each, and perceive that both are performed by one and the same, we shall
    have the true faith and shall not go astray. And from all these the difference
    between the united natures is recognised, and the fact that, as the most godly
    Cyril says, they are not identical in the natural quality of their divinity and
    humanity. But yet there is but one Son and Christ and Lord: and as He is one,
    He has also but one person, the unity in subsistence being in nowise broken up
    into parts by the recognition of the difference of the natures. Chapter XIX. That
    God is not the cause of evils It is to be observed that it is the custom in the
    Holy Scripture to speak of God''''s permission as His energy, as when the apostle
    says in the Epistle to the Romans, Hath not the potter power over the clay, of
    the same lump to make one vessel unto honour and another unto dishonour? And for
    this reason, that He Himself makes this or that. For He is Himself alone the Maker
    of all things; yet it is not He Himself that fashions noble or ignoble things,
    but the personal choice of each one. And this is manifest from what the same Apostle
    says in the Second Epistle to Timothy, In a great house there are not only vessels
    of gold and of silver, but also of wood and of earth: and some to honour and some
    to dishonour. If a man therefore purge himself from these, he shall be a vessel
    unto honour sanctified, and meet for the master''''s use, and prepared unto every
    good work. And it is evident that the purification must be voluntary: for if a
    man, he saith, purge himself. And the consequent antistrophe responds, "If a man
    purge not himself he will be a vessel to dishonour, unmeet for the master''''s
    use and fit only to be broken in pieces." Wherefore this passage that we have
    quoted and this, God hath concluded them all in unbelief, and this, God hath given
    them the spirit of slumber, eyes that they should not see, and ears that they
    should not hear, all these must be understood not as though God Himself were energising,
    but as though God were permitting, both because of free-will and because goodness
    knows no compulsion. His permission, therefore, is usually spoken of in the Holy
    Scripture as His energy and work. Nay, even when He says that God creates evil
    things, and that there is no evil in a city that the Lord hath not done, he does
    not mean by these words that the Lord is the cause of evil, but the word ''evil''
    is used in two ways, with two meanings. For sometimes it means what is evil by
    nature, and this is the opposite of virtue and the will of God: and sometimes
    it means that which is evil and oppressive to our sensation, that is to say, afflictions
    and calamities. Now these are seemingly evil because they are painful, but in
    reality are good. For to those who understand they became ambassadors of conversion
    and salvation. The Scripture says that of these God is the Author. It is, moreover,
    to be observed that of these, too, we are the causë for involuntary evils are
    the offspring of voluntary ones. This also should be recognised, that it is usual
    in the Scriptures for some things that ought to be considered as effects to be
    stated in a causal sense, as, Against Thee, Thee only, have I sinned and done
    this evil in Thy sight, that Than mightest be justified when Thou speakest, and
    prevail when Thou judgest. For the sinner did not sin in order that God might
    prevail, nor again did God require our sin in order that He might by it be revealed
    as victor. For above comparison He wins the victor''''s prize against all, even
    against those who are sinless, being Maker, incomprehensible, uncreated, and possessing
    natural and not adventitious glory. But it is because when we sin God is not unjust
    in His anger against us; and when He pardons the penitent He is shewn victor over
    our wickedness. But it is not for this that we sin, but because the thing so turns
    out. It is just as if one were sitting at work and a friend stood near by, and
    one said, My friend came in order that I might do no work that day. The friend,
    however, was not present in order that the man should do no work, but such was
    the result. For being occupied with receiving his friend he did not work. These
    things, too, are spoken of as effects because affairs so turned out. Moreover,
    God does not wish that He alone should be just, but that all should, so far as
    possible, be made like unto Him. Chapter XX. That there are not two Kingdoms That
    there are not two kingdoms, one good and one bad, we shall see from this. For
    good and evil are opposed to one another and mutually destructive, and cannot
    exist in one another or with one another. Each of them, therefore, in its own
    division will belong to the whole, and first they will he circumscribed, not by
    the whole alone but also each of them by part of the whole. Next I ask, who it
    is that assigns to each its place. For they will not affirm that they have come
    to a friendly agreement with, or been reconciled to, one another. For evil is
    not evil when it is at peace with, and reconciled to, goodness, nor is goodness
    good when it is on amicable terms with evil. But if He Who has marked off to each
    of these its own sphere of action is something different from them, He must the
    rather be God. One of two things indeed is necessary, either that they come in
    contact with and destroy one another, or that there exists some intermediate place
    where neither goodness nor evil exists, separating both from one another, like
    a partition. And so there will be no longer two but three kingdoms. Again, one
    of these alternatives is necessary, either that they are at peace, which is quite
    incompatible with evil (for that which is at peace is not evil), or they are at
    strife, which is incompatible with goodness (for that which is at strife is not
    perfectly good), or the evil is at strife and the good does not retaliate, but
    is destroyed by the evil, or they are ever in trouble and distress, which is not
    a mark of goodness. There is, therefore, but one kingdom, delivered from all evil.
    But if this is so, they say, whence comes evil? For it is quite impossible that
    evil should originate from goodness. We answer then, that evil is nothing else
    than absence of goodness and a lapsing from what is natural into what is unnatural:
    for nothing evil is natural. For all things, whatsoever God made, are very good,
    so far as they were madë if, therefore, they remain just as they were created,
    they are very good, but when they voluntarily depart from what is natural and
    turn to what is unnatural, they slip into evil. By nature, therefore, all things
    are servants of the Creator and obey Him. Whenever, then, any of His creatures
    voluntarily rebels and becomes disobedient to his Maker, he introduces evil into
    himself. For evil is not any essence nor a property of essence, but an accident,
    that is, a voluntary deviation from what is natural into what is unnatural, which
    is sin. Whence, then, comes sin? It is an invention of the free-will of the devil.
    Is the devil, then, evil? In so far as he was brought into existence he is not
    evil but good. For he was created by his Maker a bright and very brilliant angel,
    endowed with free-will as being rational. But he voluntarily departed from the
    virtue that is natural and came into the darkness of evil, being far removed from
    God, Who alone is good and can give life and light. For from Him every good thing
    derives its goodness, and so far as it is separated from Him in will (for it is
    not in place), it falls into evil. Chapter XXI. The purpose for which God in His
    foreknowledge created persons who would sin and not repent God in His goodness
    brought what exists into being out of nothing, and has foreknowledge of what will
    exist in the future. If, therefore, they were not to exist in the future, they
    would neither be evil in the future nor would they be foreknown. For knowledge
    is of what exists and foreknowledge is of what will surely exist in the future.
    For simple being comes first and then good or evil being. But if the very existence
    of those, who through the goodness of God are in the future to exist, were to
    be prevented by the fact that they were to become evil of their own choice, evil
    would have prevailed over the goodness of God. Wherefore God makes all His works
    good, but each becomes of its own choice good or evil. Although, then, the Lord
    said, Goad were it for that man that he had never been barn, He said it in condemnation
    not of His own creation but of the evil which His own creation had acquired by
    his own choice and through his own heedlessness. For the heedlessness that marks
    man''''s judgment made His Creator''''s beneficence of no profit to him. It is
    just as if any one, when he had obtained riches and dominion from a king, were
    to lord it over his benefactor, who, when he has worsted him, will punish him
    as he deserves, if he should see him keeping hold of the sovereignty to the end.
    Chapter XXII. Concerning the law of God and the law of sin The Deity is good and
    more than good, and so is His will. For that which God wishes is good. Moreover
    the precept, which teaches this, is law, that we, holding by it, may walk in light:
    and the transgression of this precept is sin, and this continues to exist on account
    of the assault of the devil and our unconstrained and voluntary reception of it.
    And this, too, is called law. And so the law of God, settling in our mind, draws
    it towards itself and pricks our conscience. And our conscience, too, is called
    a law of our mind. Further, the assault of the wicked one, that is the law of
    sin, settling in the members of our flesh, makes its assault upon us through it.
    For by once voluntarily transgressing the law of God and receiving the assault
    of the wicked one, we gave entrance to it, being sold by ourselves to sin. Wherefore
    our body is readily impelled to it. And so the savour and perception of sin that
    is stored up in our body, that is to say, lust and pleasure of the body, is law
    in the members of our flesh. Therefore the law of my mind, that is, the conscience,
    sympathises with the law of God, that is, the precept, and makes that its will.
    But the law of sin, that is to say, the assault made through the law that is in
    our members, or through the lust and inclination and movement of the body and
    of the irrational part of the soul, is in opposition to the law of my mind, that
    is to conscience, and takes me captive (even though I make the law of God my will
    and set my love on it, and make not sin my will), by reason of commixturë and
    through the softness of pleasure and the lust of the body and of the irrational
    part of the soul, as I said, it leads me astray and induces me to become the servant
    of sin. But what the law could not do, in that it was weak through the flesh,
    God, sending His own Son in the likeness of sinful flesh (for He assumed flesh
    but not sin) condemned sin in the flesh, that the righteousness of the law might
    be fulfilled in us who walk not after the flesh but in the Spirit. For the Spirit
    helpeth our infirmities and affordeth power to the law of our mind, against the
    law that is in our members. For the verse, we know not what we should pray for
    as we ought, but the Spirit itself maketh intercession with groanings that cannot
    be uttered, itself teacheth us what to pray for. Hence it is impossible to carry
    out the precepts of the Lord except by patience and prayer. Chapter XXIII. Against
    the Jews on the question Sabbath The seventh day is called the Sabbath and signifies
    rest. For in it God rested from all His works, as the divine Scripture says: and
    so the number of the days goes up to seven and then circles back again and begins
    at the first. This is the precious number with the Jews. God having ordained that
    it should be held in honour, and that in no chance fashion but with the imposition
    of most heavy penalties for the transgression. And it was not in a simple fashion
    that He ordained this, but for certain reasons understood mystically by the spiritual
    and clear-sighted. So far, indeed, as I in my ignorance know, to begin with inferior
    and more dense things, God, knowing the denseness of the Israelites and their
    carnal love and propensity towards matter in everything, made this law: first,
    in order that the servant and the cattle should rest as it is written, for the
    righteous man regardeth the life of his beast: next, in order that when they take
    their ease from the distraction of material things, they may gather together unto
    God, spending the whole of the seventh day in psalms and hymns and spiritual songs
    and the study of the divine Scriptures and resting in God. For when the law did
    not exist and there was no divinely-inspired Scripture, the Sabbath was not consecrated
    to God. But when the divinely-inspired Scripture was given by Moses, the Sabbath
    was consecrated to God in order that on it they, who do not dedicate their whole
    life to God, and who do not make their desire subservient to the as though to
    a Father, but are like foolish servants, may on that day talk much concerning
    the exercise of it, and may abstract a small, truly a most insignificant, portion
    of their life for the service of God, and this from fear of the chastisements
    and punishments which threaten transgressors. For the law is not made for a righteous
    man but for the unrighteous. Moses, of a truth, was the first to abide fasting
    with God for forty days and again for another forty, and thus doubtless to afflict
    himself with hunger on the Sabbaths although the law forbade self-affliction on
    the Sabbath. But if they should object that this took place before the law, what
    will they say about Elias the Thesbite who accomplished a journey of forty days
    on one meal? For he, by thus afflicting himself on the Sabbaths not only with
    hunger but with the forty days'' journeying, broke the Sabbath: and yet God, Who
    gave the law, was not wroth with him but shewed Himself to him on Choreb as a
    reward for his virtue. And what will they say about Daniel? Did he not spend three
    weeks without food? And again, did not all Israel circumcise the child on the
    Sabbath, if it happened to be the eighth day after birth? And do they not hold
    the great fast which the law enjoins if it falls on the Sabbath? And further,
    do not the priests and the Levites profane the Sabbath in the works of the tabernacle
    and yet are held blameless? Yea, if an ox should fall into a pit on the Sabbath,
    he who draws it forth is blameless, while he who neglects to do so is condemned.
    And did not all the Israelites compass the walls of Jericho bearing the Ark of
    God for seven days, in which assuredly the Sabbath was included. As I said, therefore,
    for the purpose of securing leisure to worship God in order that they might, both
    servant and beast of burden, devote a very small share to Him and be at rest,
    the observance of the Sabbath was devised for the carnal that were still childish
    and in the bonds of the elements of the world, and unable to conceive of anything
    beyond the body and the letter. But when the fulness of the time was come, God
    sent forth His Only-begotten Son, made of a woman, made under the law, to redeem
    them that were under the law that we might receive the adoption of sons. For to
    as many of us as received Him, He gave power to become sons of God, even to them
    that believe on Him. So that we are no longer servants but sons: no longer under
    the law but under gracë no longer do we serve God in part from fear, but we are
    bound to dedicate to Him the whole span of our life, and cause that servant, I
    mean wrath and desire, to cease from sin and bid it devote itself to the service
    of God, always directing our whole desire towards God and arming our wrath against
    the enemies of God: and likewise we hinder that beast of burden, that is the body,
    from the servitude of sin, and urge it forwards to assist to the uttermost the
    divine precepts. These are the things which the spiritual law of Christ enjoins
    on us and those who observe that become superior to the law of Moses. For when
    that which is perfect is come, then that which is in part shall be done away:
    and when the covering of the law, that is, the veil, is rent asunder through the
    crucifixion of the Saviour, and the Spirit shines forth with tongues of fire,
    the letter shall be done away with, bodily things shall come to an end, the law
    of servitude shall be fulfilled, and the law of liberty be bestowed on us. Yea
    we shall celebrate the perfect rest of bureau nature, I mean the day after the
    resurrection, on which the Lord Jesus, the Author of Life and our Saviour, shall
    lead us into the heritage promised to those who serve God in the spirit, a heritage
    into which He entered Himself as our forerunner after He rose from the dead, and
    whereon, the gates of Heaven being opened to Him, He took His seat in bodily form
    at the right hand of the Father, where those who keep the spiritual law shall
    also come. What belongs to us, therefore, who walk by the spirit and not by the
    letter, is the complete abandonment of carnal things, the spiritual service and
    communion with God. For circumcision is the abandonment of carnal pleasure and
    of whatever is superfluous and unnecessary. For the foreskin is nothing else than
    the skin which it superfluous to the organ of lust. And, indeed, every pleasure
    which does not arise from God nor is in God is superfluous to pleasurë and of
    that the foreskin is the type. The Sabbath, moreover, is the cessation from sin;
    so that both things happen to be one, and so both together, when observed by those
    who are spiritual, do not bring about any breach of the law at all. Further, observe
    that the number seven denotes all the present time, as the most wise Solomon says,
    to give a portion to seven and also to eight. And David, the divine singer when
    he composed the eighth psalm, sang of the future restoration after the resurrection
    from the dead. Since the Law, therefore, enjoined that the seventh day should
    be spent in rest from carnal things and devoted to spiritual things, it was a
    mystic indication to the true Israelite who had a mind to see God, that he should
    through all time offer himself to God and rise higher than carnal things. Chapter
    XXIV. Concerning Virginity Carnal men abuse virginity, and the pleasure-loving
    bring forward the following verse in proof, Cursed be every one that raiseth not
    up seed in Israel. But we, made confident by God the Word that was made flesh
    of the Virgin, answer that virginity was implanted in man''''s nature from above
    and in the beginning. For man was formed of virgin soil. From Adam alone was Eve
    created. In Paradise virginity held sway. Indeed, Divine Scripture tells that
    both Adam and Eve were naked and were not ashamed. But after their transgression
    they knew that they were naked, and in their shame they sewed aprons for themselves.
    And when, after the transgression, Adam heard, dust thou art and unto dust shalt
    thou return, when death entered into the world by reason of the transgression,
    then Adam knew Eve his wife, and she conceived and bare seed. So that to prevent
    the wearing out and destruction of the race by death, marriage was devised that
    the race of men may be preserved through the procreation of children. But they
    will perhaps ask, what then is the meaning of "male and female," and "Be fruitful
    and multiply?" In answer we shall say that "Be fruitful and multiply" does not
    altogether refer to the multiplying by the marriage connection. For God had power
    to multiply the race also in different ways, if they kept the precept unbroken
    to the end. But God, Who knoweth all things before they have existence, knowing
    in His foreknowledge that they would fall into transgression in the future and
    be condemned to death, anticipated this and made "male and female," and bade them
    "be fruitful and multiply." Let us, then, proceed on our way and see the glories
    of virginity: and this also includes chastity. Noah when he was commanded to enter
    the ark and was entrusted with the preservation of the seed of the world received
    this command, Go in, saith the Lord, thou and thy sons, and thy wife, and thy
    sons'' wives. He separated them from their wives in order that with purity they
    might escape the flood and that shipwreck of the whole world. After the cessation
    of the flood, however, He said, Go forth of the ark, thou and thy sons, and thy
    wife, and thy sons'' wives. Lo, again, marriage is granted for the sake of the
    multiplication of the race. Next, Elias, the fire-breathing charioteer and sojourner
    in heaven did not embrace celibacy, and yet was not his virtue attested by his
    super-human ascension? Who closed the heavens? Who raised the dead? Who divided
    Jordan? Was it not the virginal Elias? And did not Elisha, his disciple, after
    he had given proof of equal virtue, ask and obtain as an inheritance a double
    portion of the grace of the Spirit? What of the three youths? Did they not by
    practising virginity become mightier than fire, their bodies through virginity
    being made proof against the fire? And was it not Daniel''''s body that was so
    hardened by virginity that the wild beasts'' teeth could not fasten in it. Did
    not God, when He wished the Israelites to see Him, bid them purify the body? Did
    not the priests purify themselves and so approach the templé''s shrine and offer
    victims? And did not the law call chastity the great vow? The precept of the law,
    therefore, is to be taken in a more spiritual sense. For there is spiritual seed
    which is conceived through the love and fear of God in the spiritual womb, travailing
    and bringing forth the spirit of salvation. And in this sense must be understood
    this versë Blessed is he who hath seed in Zion and posterity in Jerusalem. For
    does it mean that, although he be a whoremonger and a drunkard and an idolater,
    he is still blessed if only he hath seed in Sion and posterity in Jerusalem? No
    one in his senses will say this. Virginity is the rule of life among the angels,
    the property of all incorporeal nature. This we say without speaking ill of marriagë
    God forbid! (for we know that the Lord blessed marriage by His presence, and we
    know him who said, Marriage is and the bed undefiled), but knowing that virginity
    is better than marriage, however good. For among the virtues, equally as among
    the vices, there are higher and lower grades. We know that all mortals after the
    first parents of the race are the offspring of marriage. For the first parents
    were the work of virginity and not of marriage. But celibacy is, as we said, an
    imitation of the angels. Wherefore virginity is as much more honourable than marriage,
    as the angel is higher than man. But why do I say angel? Christ Himself is the
    glory of virginity, who was not only-begotten of the Father without beginning
    or emission or connection, but also became man in our image, being made flesh
    for our sakes of the Virgin without connection, and manifesting in Himself the
    true and perfect virginity. Wherefore, although He did not enjoin that on us by
    law (for as He said, all men cannot receive this saying), yet in actual fact He
    taught us that and gave us strength for it. For it is surely clear to every one
    that virginity now is flourishing among men. Good indeed is the procreation of
    children enjoined by the law, and good is marriage on account of fornications,
    for it does away with these, and by lawful intercourse does not permit the madness
    of desire to he caromed into unlawful acts. Good is marriage for those who have
    no continencë but that virginity is better which increases the fruitfulness of
    the soul and offers to God the seasonable fruit of prayer. Marriage is honourable
    and the bed undefiled, but whoremongers and adulterers God will judge. Chapter
    XXV. Concerning the Circumcision The Circumcision was given to Abraham before
    the law, after the blessings, after the promise, as a sign separating him and
    his offspring and his household from the Gentiles with whom he lived. And this
    is evident, for when the Israelites passed forty years alone by themselves in
    the desert, having no intercourse with any other race, all that were horn in the
    desert were uncircumcised: but when Joshua led them across Jordan, they were circumcised,
    and a second law of circumcision was instituted. For in Abraham''''s time the
    law of circumcision was given, and for the forty years in the desert it fell into
    abeyance. And again for the second time God gave the law of Circumcision to Joshua,
    after the crossing of Jordan, according as it is written in the book of Joshua,
    the son of Nun: At that time the Lord said unto Joshua, Make thee knives of stone
    from the sharp rock, and assemble and circumcise the sons of Israel a second time;
    and a little later: For the children of Israel walked forty and two years in the
    wilderness of Battaris, till all the people that were men of war, which came out
    of Egypt, were uncircumcised, because they obeyed not the voice of the Lord: unto
    whom the Lord sware that He would not shew them the goad land, which the Lord
    swore unto their fathers that He would give them, a land that floweth with milk
    and honey. And their children, whom He raised up in their stead, them Joshua circumcised:
    for they were uncircumcised, because they had not circumcised them by the way.
    So that the circumcision was a sign, dividing Israel from the Gentiles with whom
    they dwelt. It was, moreover, a figure of baptism. For just as the circumcision
    does not cut off a useful member of the body but only a useless superfluity, so
    by the holy baptism we are circumcised from sin, and sin clearly is, so to speak,
    the superfluous part of desire and not useful desire. For it is quite impossible
    that any one should have no desire at all nor ever experience the taste of pleasure.
    But the useless part of pleasure, that is to say, useless desire and pleasure,
    it is this that is sin from which holy baptism circumcises us, giving us as a
    token the precious cross on the brow, not to divide us from the Gentiles (for
    all the nations received baptism and were sealed with the sign of the Cross),
    but to distinguish in each nation the faithful from the Faithless. Wherefore,
    when the truth is revealed, circumcision is a senseless figure and shade. So circumcision
    is now superfluous and contrary to holy baptism. For he who is circumcised is
    a debtor to do the whale law. Further, the Lord was circumcised that He might
    fulfil the law: and He fulfilled the whole law and observed the Sabbath that He
    might fulfil and establish the law. Moreover after He was baptized and the Holy
    Spirit had appeared to men, descending on Him in the form of a dove, from that
    time the spiritual service and conduct of life and the Kingdom of Heaven was preached.
    Chapter XXVI. It should be known that the Antichrist is hound to come First, therefore,
    it is necessary that the Gospel should be preached among all nations: And then
    shall that wicked one be revealed, even him whose coming is after the working
    of Satan with all power and signs and lying wonders, with all deceivableness of
    unrighteousness in them that perish, whom the Lord shall consume with the word
    of His mouth and shall destroy with the brightness of His coming. The devil himself,
    therefore does not become man in the way that the Lord was made man. God forbid!
    but he becomes man as the offspring of fornication and receiveth all the energy
    of Satan. For God, foreknowing the strangeness of the choice that he would make,
    allows the devil to take up his abode in him. He is, therefore, as we said, the
    offspring of fornication and is nurtured in secret, and on a sudden he rises up
    and rebels and assumes rule. And in the beginning of his rule, or rather tyranny,
    he assumes the role of sanctity. But when he becomes master he persecutes the
    Church of God and displays all his wickedness. But he will come with signs and
    lying wonders, fictitious and not real, and he will deceive and lead away from
    the living God those whose mind rests on an unsound and unstable foundation, so
    that even the elect shall, if it be possible, be made to stumble. But Enoch and
    Elias the Thesbite shall be sent and shall turn the hearts of the fathers to the
    children, that is, the synagogue to our Lord Jesus Christ and the preaching of
    the apostles: and they will be destroyed by him. And the Lord shall come out of
    heaven, just as the holy apostles beheld Him going into heaven perfect God and
    perfect man, with glory and power, and will destroy the man of lawlessness, the
    son of destruction, with the breath of His mouth. Let no one, therefore, look
    for the Lord to come from earth, but out of Heaven, as He himself has made sure.
    Chapter XXVII. Concerning the Resurrection We believe also in the resurrection
    of the dead. For there will be in truth, there will be, a resurrection of the
    dead, and by resurrection we mean resurrection of bodies. For resurrection is
    the second state of that which has fallen. For the souls are immortal, and hence
    how can they rise again? For if they define death as the separation of soul and
    body, resurrection surely is the re-union of soul and body, and the second state
    of the living creature that has suffered dissolution and downfall. It is, then,
    this very body, which is corruptible and liable to dissolution, that will rise
    again incorruptible. For He, who made it in the beginning of the sand of the earth,
    does not lack the power to raise it up again after it has been dissolved again
    and returned to the earth from which it was taken, in accordance with the reversal
    of the Creator''''s judgment. For if there is no resurrection, let us eat and
    drink: let us pursue a life of pleasure and enjoyment. If there is no resurrection,
    wherein do we differ from the irrational brutes? If there is no resurrection,
    let us hold the wild beasts of the field happy who have a life free from sorrow.
    If there is no resurrection, neither is there any God nor Providence, but all
    things are driven and borne along of themselves. For observe how we see most righteous
    men suffering hunger and injustice and receiving no help in the present life,
    while sinners and unrighteous men abound in riches and every delight. And who
    in his senses would take this for the work of a righteous judgment or a wise providence?
    There must be, therefore, there must be, a resurrection. For God is just and is
    the rewarder of those who submit patiently to Him. Wherefore if it is the soul
    alone that engages in the contests of virtue, it is also the soul alone that will
    receive the crown. And if it were the soul alone that revels in pleasures, it
    would also be the soul alone that would be justly punished. But since the soul
    does not pursue either virtue or vice separate from the body, both together will
    obtain that which is their just due. Nay, the divine Scripture bears witness that
    there will be a resurrection of the body. God in truth says to Moses after the
    flood, Even as the green herb have I given you all things. But flesh with the
    life thereof, which is the blood thereof, shall ye not eat. And surely your blood
    of your lives will I require; at the hand of every beast will I require it, and
    at the hand of every man''''s brother will I require the life of man. Whoso sheddeth
    man''''s blood, for his blood his own shall be shed, for in the image of God made
    I man. How will He require the blood of man at the hand of every beast, unless
    because the bodies of dead men will rise again? For not for man will the beasts
    die. And again to Moses, I am the God of Abraham, the God of Isaac and the God
    of Jacob: God is not the God of the dead (that is, those who are dead and will
    be no more), but of the living, whose souls indeed live in His hand, but whose
    bodies will again come to life through the resurrection. And David, sire of the
    Divine, says to God, Thou takest away their breath, they die and return to their
    dust. See how he speaks about bodies. Then he subjoins this, Thou sendest forth
    Thy Spirit, they are created: and Thou renewest the face of the earth. Further
    Isaiah says: The dead shall rise again, and they that are in the graves shall
    awake. And it is clear that the souls do not lie in the graves, but the bodies.
    And again, the blessed Ezekiel says: And it was as I prophesied, and behold a
    shaking and the bones came together, bone to his bone, each to its own joint:
    and when I beheld, lo, the sinews came up upon them and the flesh grew and rose
    up on them and the skin covered them above. And later he teaches how the spirits
    came back when they were bidden. And divine Daniel also says: And at that time
    shall Michael stand up, the great prince which standeth for the children of thy
    peoplë and there shall be a time of trouble, such trouble as never was since there
    was a nation on the earth even to that same time. And at that time thy people
    shall be delivered, every one that shall be found written in the book. And many
    of them that sleep in the dust of the earth shall awakë some to everlasting life
    and some to shame and everlasting contempt. And they that be wise shall shine
    as the brightness of the firmament, and out of the multitude of the just shall
    shine like stars into the ages and beyond. The words, many of them that sleep
    in the dust of the earth shall awake, clearly shew that there will be a resurrection
    of bodies. For no one surely would say that the souls sleep in the dust of the
    earth. Moreover, even the Lord in the holy Gospels clearly allows that there is
    a resurrection of the bodies. For they that are in the graves, He says, shall
    hear His voice and shall come forth: they that have done good unto the resurrection
    of life, and they that have done evil unto the resurrection of damnation. Now
    no one in his senses would ever say that the souls are in the graves. But it was
    not only by word, but also by deed, that the Lord revealed the resurrection of
    the bodies. First He raised up Lazarus, even after he had been dead four days,
    and was stinking. For He did not raise the soul without the body, but the body
    along with the soul: and not another body but the very one that was corrupt. For
    how could the resurrection of the dead man have been known or believed if it had
    not been established by his characteristic properties? But it was in fact to make
    the divinity of His own nature manifest and to confirm the belief in His own and
    our resurrection, that He raised up Lazarus who was destined once more to die.
    And the Lord became Himself the first-fruits of the perfect resurrection that
    is no longer subject to death Wherefore also the divine Apostle Paul said: If
    the dead rise not, then is not Christ raised. And if Christ be not raised, our
    faith is vain: we are jet in our sins. And, Now, is Christ risen from the dead
    and become the first-fruits of them that slept, and the first-born pyre the dead;
    and again, For if we believe that Jesus died and rose again, even so them also
    which sleep in Jesus will God bring with Him. Even so, he said, as Christ rose
    again. Moreover, that the resurrection of the Lord was the union of uncorrupted
    body and soul (for it was these that had been divided) is manifest: for He said,
    Destroy this temple, and in three days I will raise it up. And the holy Gospel
    is a trustworthy witness that He spoke of His own body. Handle Me and see, the
    Lord said to His own disciples when they were thinking that they saw a spirit,
    that it is I Myself, and that I am not changed: for a spirit hath not flesh or
    bones, as ye see Me have. And when He had said this He shewed them His hands and
    His side, and stretched them forward for Thomas to touch. Is not this sufficient
    to establish belief in the resurrection of bodies? Again the divine apostle says,
    For this corruptible must put on incorruption, and this mortal must put on immortality.
    And again: It is sown in corruption, it is raised in incorruption: it is sawn
    in weakness, it is raised in power: it is sown in dishonour, it is raised in glory:
    it is sown a natural body (that is to say, crass and mortal), it is raised a spiritual
    body, such as was our Lord''''s body after the resurrection which passed through
    closed doors, was unwearying, had no need of food, or sleep, or drink. For they
    will be, saith the Lord, as the angels of God: there will no longer be marriage
    nor procreation of children. The divine apostle, in truth, says, For our conversation
    is in heaven, from whence also we look for the Saviour, the Lord Jesus, Who shall
    change our vile body that it may be fashioned like unto His glorious body: not
    meaning change into another form (God forbid!), but rather the change from corruption
    into incorruption. But some one will say, How are the dead raised up? Oh, what
    disbelief! Oh, what folly! Will He, Who at His solitary will changed earth into
    body, Who commanded the little drop of seed to grow in the mother''''s womb and
    become in the end this varied and manifold organ of the body, not the rather raise
    up again at His solitary will that which was and is dissolved? And with what body
    do they come? Thou fool, if thy hardness will not permit you to believe the words
    of God, at least believe His works. For that which thou sowest is not quickened
    except it die. And that which thou sowest, thou sowest not that body that shall
    be, but bare grain, it may chance of wheat or of some other grain. But God giveth
    it a body as it hath pleased Him, and to every seed his own body. Behold, therefore,
    how the seed is buried in the furrows as in tombs. Who is it that giveth them
    roots and stalk and leaves and ears and the most delicate beards? Is it not the
    Maker of the universe? Is it not at the bidding of Him Who hath contrived all
    things? Believe, therefore, in this wise, even that the resurrection of the dead
    will come to pass at the divine will and sign. For He has power that is able to
    keep pace with His will. We shall therefore rise again, our souls being once more
    united with our bodies, now made incorruptible and having put off corruption,
    and we shall stand beside the awful judgment-seat of Christ: and the devil and
    his demons and the man that is his, that is the Antichrist and the impious and
    the sinful, will be given over to everlasting fire not material fire like our
    fire, but such fire as God would know. But those who have done good will shine
    forth as the sun with the angels into life eternal, with our Lord Jesus Christ,
    ever seeing Him and being in His sight and deriving unceasing joy from Him, praising
    Him with the Father and the Holy Spirit throughout the limitless ages of ages.
    Amen.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/MIa1_An_Exact_Exposition_of_the_Orthodox_Faith__Book_4#HH-Chapter-XVII-Concerning-Scripture">An
    Exact Exposition of the Orthodox Faith, Book IV, ch. 17</a>)</p><h2>17th century</h2><h3>The
    Epistle of the Patriarchs (1723)</h3><blockquote><p>Q. 3. What books do you call
    Sacred Scripture? Following the rule of the Catholic Church, we call Sacred Scripture
    all those which Cyril [Lucar] collected from the Synod of Laodicea, and enumerated,
    adding thereto those which he foolishly, and ignorantly, or rather maliciously
    called Apocrypha; to wit, The Wisdom of Solomon, Judith, Tobit, The History of
    the Dragon, The History of Susanna, The Maccabees, and The Wisdom of Sirach. For
    we judge these also to be with the other genuine Books of Divine Scripture genuine
    parts of Scripture. For ancient custom, or rather the Catholic Church, which hath
    delivered to us as genuine the Sacred Gospels and the other Books of Scripture,
    hath undoubtedly delivered these also as parts of Scripture, and the denial of
    these is the rejection of those. And if, perhaps, it seemeth that not always have
    all been by all reckoned with the others, yet nevertheless these also have been
    counted and reckoned with the rest of Scripture, as well by Synods, as by how
    many of the most ancient and eminent theologians of the Catholic Church; all of
    which we also judge to be Canonical Books, and confess them to be Sacred Scriptures.
    Q. 4. How ought we to think of the Holy Icons, and of the adoration of the Saints?
    The saints being, and acknowledged by the Catholic Church to be, intercessors,
    as hath been said in the Eighth Decree [above], it is time to say that we honour
    them as friends of God, and as praying for us to the God of all. And the honour
    we pay them is twofold; – according to one manner which we call hyperdoulia, we
    honour the Mother of God the Word. For though indeed the Theotokos be servant
    of the only God, yet is she also his Mother, as having borne in the flesh one
    of the Trinity; wherefore also is she hymned, as being beyond compare, above as
    well all Angels as Siants; wherefore, also, we pay her the adoration of hyperdoulia.
    But according to the other manner, which we call doulia, we adore, or rather honour,
    the holy Angels, Apostles, Prophets, Martyrs, and, in fine, all the Saints. Moreover,
    we adore and honour the wood of the precious and life-giving Cross, whereon our
    Saviour underwent this world-saving passion, and the sign of the life-giving Cross,
    the Manger at Bethlehem, through which we have been delivered from irrationality
    [in allusion to the manbger out of which the irrational animals eat their food],
    the place of the Skull [Calvary], the life-giving Sepulchre, and th eother holy
    objects of adoration; as well the holy Gospels, as the sacred vessels, wherewith
    the unbloody Sacrifice is performed. And by annual commemorations, and popular
    festivals, and sacred edifices and offerings; we do respect and honour the saints.
    And then we adore, and honour, and kiss the icons of our Lord Jesus Christ, and
    of the most holy Theotokos, and of all the saints, also of the holy Angels, as
    they appeared to some of the forefathers and prophets. We also represent the All-Holy
    Spirit, as he appeared, in the form of a dove. And if some say we commit idolatry
    in adoring the Saints, and the Icons of the Saints, and the other things, we regard
    it as foolish and frivolous. For we worship with latria the only God in Trinity,
    and none other; but the Saints we honour upon two accounts: firstly, for their
    relation to God, since we honour them for his sake; and for themselves, because
    they are living images of God. But that which is for themselves hath been defined
    as doulia. But the holy Icons we adore relatively since the honour paid to them
    is referred to their prototypes. For he that adoreth the Icon doth, through the
    Icon, adore the protoype; and the honour paid to the Icon is not at all divided,
    or at all separated from that of him that is portrayed, and is done unto the same,
    like that done unto a royal embassy. And what they adduse from Scripture in support
    of their novelties, doth not help them as they would, but rather appeareth agreeable
    to us. For we, when reading the Divine Scripture, examine the occasion and person,
    the example and cause. Wherefore, when we contemplate God himself saying at one
    time, "Thou shalt not make to thyself any idol, or likeness; neither shalt thou
    adore them, nor serve them" (Exod. 20.4–5; Deut. 5.8–9); and at another, commanding
    that Chrubim should be made (Exod. 25.18); and further, that oxen and lions (1
    Kings 7.29) were placed in the Temple, we do not rashly consider the import of
    these things. For faith is not in assurance; but, as hath been said, considering
    the occasion and other circumstances, we arrive at the right interpretation of
    the same; and we conclude that, "Thou shalt not make to thyself any idol, or likeness",
    is the same as saying, "Thou shalt not adore strange gods" (Exod. 20.4), or rather,
    "Thou shalt not commit idolatry".For so both the custom obtaining in the Church
    from Apostolic times of adoring the holy Icons relatively is maintained, and the
    worship of latria reserved for God alone; and God doth not appear to speak contrarily
    to himself. For if the Scripture saith [absolutely], "Thou shalt not make", "Thou
    shalt not adore", we fail to see how God afterwards permitted likenesses to be
    made, even though not for adoration. Wherefore, since the commandment concerneth
    idolatry only, we find serpents, and lions, and oxen, and Cherubim made, and figures
    and likenesses; among which Angels appear, as having been adored. And as to the
    Saints whom they bring forward as saying, that it is not lawful to adore Icons;
    we conclude that they rather help us; since they in their sharp disputations inveighed,
    as well against those that adore the holy Icons with latria, as against those
    that bring the icons of their deceased relatives into the Church, and subjected
    to anathema those that so do; but not against the right adoration, either of the
    Saints, or of the holy Icons, or of the precious Cross, or of the other things
    of which mention hath been made; especially since the holy Icons have been in
    the Church, and have been adored by the Faithful, even from the times of the Apostles,
    as is recorded and proclaimed by very many; with whom and after whom the Seventh
    Holy Ecumenical Synod putteth to shame all heretical impudence. Since it giveth
    us most plainly to understand that it behoveth to adore the Holy Icons, and what
    have been mentioned above. And it anathematises, and subjects to excommunication,
    as well those that adore the Icons with latria as those that say that the Orthodox
    commit idolatry in adoring the Icons. We also, therefore, do anathematise with
    them such as adore either Saint, or Angel, or Icon, or Cross, or Relic of Saints,
    or sacred Vessel, or Gospel, or aught else that is in heaven above, or aught on
    the earth, or in the sea, with latria; and we ascribe adoration with latria to
    the only God in Trinity. And we anathematise those that say that the adoration
    of Icons is the latria of Icons, and who adore them not, and honour not the Cross,
    and the Saints, as the Church hath delivered. Now we adore the Saints and the
    Holy Icons, in the manner declared; and portray them in adornment of our temples,
    and that they may be the books of the unlearned, and for them to imitate the virtues
    of the Saints; and for them to remember, and have an increase of love, and be
    vigilant in ever calling upon the Lord, as Sovereign and Father, but upon the
    Saints, as his servants, and our helpers and mediators. And so much as to the
    Chatpers and Questions of Cyril. But the heretics do find fault with even the
    prayer of the pious unto God, for we know not why they should calumniate those
    of the Monks only. Moreover, that prayer is a conversation with God, and a petitioning
    for such good things as be meet for us, from him of whom we hope to receive, an
    ascent too of the mind untoGod, and a pious expression of our purpose towards
    God, a seeking what is above, the support of a holy soul, a worship most acceptable
    to God, a token of repentance, and of steadfast hope, we do know; and prayer is
    made either with the mind alone, or with the mind and voice; thereby engaging
    in the contemplation of the goodness and mercy of God, of the unworthiness of
    the petitioner, and in thanksgiving, and in realising the promises attached to
    obedience to God. And it is accompanied by faith, and hope, and perseverance,
    and observance of the commandments; and, as already said, is a petitioning for
    heavenly things; and it hath many fruits, which it is needless to enumerate; and
    it is made continually, and is accomplished either in an upright posture, or by
    kneeling. And so great is its efficacy, that it is acknowledge to be both the
    nourishment and the life of the soul. And all this is gathered from Divine Scripture;
    so that if any ask for demonstration thereof, he is like a fool, or a blind man,
    who disputeth about the sun’s light at the hour of noon, and when the sky is clear.
    But the heretics, wishing to leave nothing unassailed that Christ hath enjoined,
    carp at this also. But being ashamed thus openly to impiously maintain as much
    concerning prayer, they do not forbid it to be made at all, but are distributed
    at the prayers of the Monks; and they act thus, that they may raise in the simple-minded
    a hatred towards the Monks; so tha tthey may not endure even the sight of them,
    as though they were profane and innovators, much less allow the dogmas of the
    pious and Orthodox faith to be taught by them. For the adversary is wise as to
    evil, and ingenious in inventing calumnies. Wherefore his followers also – such
    as these heretics especially – are not so much anxious about piety, as desirous
    of ever involving men in an abyss of evils, and of estranging them into places,
    which the Lord taketh not under his care (cf. Deut. 11.12). They should be asked
    therefore, what are the prayers of the Monks; and if they can show that the Monks
    do anything entirely different from themselves, and not in accordance with the
    Orthodox worship of Christians, we also will join with them, and say, not only
    that the Monks are no Monks, but also no Christians. But if the Monks set forth
    particularly the glory and wonders of God, and continually, and unremittingly,
    and at all times, as far as is possible for man, proclaim the Deity, with hymns
    and doxologies; now singing, forsooth, parts of Scripture, and now gathering hymns
    out of Scripture, or at least giving utternace to what is agreeable to the same;
    we must acknowledge that they perform a work apostolical and prophetical, or ratehr
    that of the Lord. Wherefore, we also, in singing the Paraklitiki, the Triodion,
    and the Menaion, perofrm a work in no wise unbecoming Christians. For all such
    books discourse of the Deity as one, and yet of more than one personality, and
    that even in the Hymns; now gathered out of the Divine Scriptures, and now according
    to the direction of the Spirit; and in order that in the melodies, the words may
    be paralleled by other words, we sing parts of Scripture; moreover, that it may
    be quite plain that we always sing parts of Scripture, to every one of our hymns,
    called a Troparion, we add a verse of Scripture. And if we sing, or read the Thecara
    [Threasury], or other prayers composed by the Fathers of old; let them say what
    there is in these which is blasphemous, or not pious, and we with them will prosecure
    these [monks]. But if they say this only, that to pray continually and unremittingly
    is wrong, what have they to do with us? Let them contend with Christ – as indeed
    they do contend – who spake the parable of the unjust judge (Luke 28.2), how that
    prayer should be made continually; and taught us to watch and pray (Mark 13.33),
    in order to escape trials, and to stand before the Son of man (Luke 21.36). Let
    them contend with Paul, [who] in the [5th] Chapter of the First Epislte to the
    Thessalonians, and elsewhere in many places [exhorteth to pray unremittingly].
    I forbear to mention the divine leaders of the Catholic Church, form Christ until
    us; for to put these [heretics] to shame sufficeth the accord of the Forefathers,
    Apostles, and Prophets concerning prayer. If, therefore, what the Monks do is
    what the Apostles and Prophets did; and, we may say, what the holy Fathers and
    Forefathers of Christ himself did; it is manifest that the prayers of the Monks
    are fruits of the Holy Spirit, the giver of graces. But the novelties where the
    Calvinists have blasphemously introduced concerning God and divine things, perverting,
    mutilating, and abusing the Divine Scriptures, are sophistries and inventions
    of the devil. Unavailing too is the assertion, the the Church cannot, without
    violence and tyranny, appoints fasts and abstinence from certain meats. For the
    Church for the mortification of the flesh and all the passions, and acting most
    rightly, carefully appointeth prayer and fasting, of which all the Saints have
    been lovers and examples; through which our adversary the devil (cf. 1 Pet. 5.8)
    being overthrown by the grace from on high, together with his armies and his hosts
    – the race (cf. 2 Tim. 4.7) that is set before the pious is the more easily accomplished.
    In making these provisions the undefiled (cf. Eph. 5.27) Church everywhere useth
    neither violence nor tyranny; but exhorteth, admonisheth, and teacheth, in accordance
    with Scripture, and persuadeth by the power of the Spirit. And to what hath been
    mentioned a certain fellow at Charenton – we mean the beforementioned Claud –
    addeth certain other ridiculous objections against us, and unworthy of any consideration;
    but what hath been said by him we regard as idle tales; and the man himself we
    consider as a trifler and altogether illiterate. For from [the time of] Photius
    what vast numbers have there been, and there are no, in the Eastern Church, eminent
    for wisdom, and theology, and holiness, by the power of the Spirit. And it is
    most absurd [to argue] that because certain of the Eastern Priests keep the Holy
    Bread in wooden vessels, within the Church, btu without the Bema, hung on one
    of the columns; that, therefore, they do not acknowledge the real and true transmutation
    of the bread into the Body of the Lord. For that certain of the poor Priests do
    keep the Lord’s Body in wooden vessels, we do not deny; for truly Christ is not
    honoured by stones and marbles; but asketh for a sound purpose and a clean heart.
    And this is what happened to Paul. "For we have" (2 Cor. 4.7), he says, "the treasure
    in earthern vessels." But where particular Churches able, as with us here in Jerusalem,
    the Lord’s Body is honourably kept within the Holy Bema of such Churches, and
    a seven-light lamp always kept burning before it. And I am tempted to wonder,
    if it may be that the heretics have seen the Lord’s Body hanging in some Churches
    without the Bema, because perhaps the walls of the Bema were unsafe on account
    of age, and so have arrived at these absurd conclusions; but they did not notice
    Christ portrayed on the apse of the Holy Bema as a babe [lying] in the Paten;
    so that they might have known, how that the Easterns do not represent that there
    is in the Paten a type, or grace, or aught else, but the Christ himself; and so
    believe that the Bread of the Eucharist is naught else, but becometh substantially
    the Body itself of the Lord, and so maintain the truth. But concerning all these
    things it has been treated at large and most lucidly in what is called The Confession
    of the Eastern Church, by George, of Chios, from Coresius in his [Treatises] concerning
    the Mysteries, and of predestination, and of grace, and of free-will, and of the
    intercession and adoration of Saints, and of the adoration of Icons, and in the
    Refutation composed by him of the illicit Synod of the heretics holden on a certain
    occasion in Flanders, and in many other [Treatises]; by Gabriel, of Peloponnesus,
    Metropolitan of Philadelphia; and by Gregory Protosyncellus of Chios in his [Treatises]
    concerning the Mysteries; by Jeremias, the Most Holy Patriarch of Constantinople,
    in three dogmatic and Synodical Letters to the Lutherans of Tubingen in German;
    by John, Priest and Economus of Constatninople, surnamed Nathaniel; by Meletius
    Syrigus, of Crete, in the Orthodox Refutation composed by him of the Chatpers
    and Questions of the said Cyril [Lucar]; by Theophanes, Patriarch of Jerusalem,
    in his dogmatic Epistle to the Lithuanians, and in innumerable other [Epistles].
    And before these hath it been spoken most excellently of these matters by Symeon,
    of Thessalonica, and before him by all the Fathers, and by the Ecumenical Synods,
    by ecclesiastical historians too; and even by writers of secular history under
    the Christian Autocrats of Rome, have these matters been mentioned incidently;
    by all of whom, without any controvery, the aforesaid were received from the Apostles;
    whose traditions, whether by writing, or by word, have through the Fathers desended
    until us. Further, the argument derived from the heretics also confirmeth the
    aforesaid. For the Nestorians after the year of salvation, 428, the Armenians
    too, and the Copts, and the Syrians, and further even the Ethiopians, who dwell
    at the Equator, and beyond this towards the tropics of Capricorn, whom those that
    are tehre commonly call Campesii, after the year … [No date in the text] of the
    Incarnation broke away from the Catholic Church; and each of these hath as peculiar
    only its heresy, as all know from the Acts of the Ecumenical Synods. Albeit, as
    concerning the purpose and number of the Sacred Mysteries, and all what hath been
    said above – except their own particular heresy, as hath been said – they entirely
    believe with the Catholic Church; as we see with our own eyes every hour, and
    learn by experience and conversation, here in the Holy City of Jerusalem, in which
    there either dwell, or are continualy sojourning, vast numbers of them all, as
    well learned, such as they have, as illiterate. Let, therefore, prating and innovating
    heretics keep silence, and not endeavour by stealing some sentences, [as] against
    us, from the Scriptures and the Fathers, to cunningly bolster up falsehood, as
    all apostates and heretics have ever done; and let them say this one thing only,
    that in contriving excuses (cf. Psalm 140.4) for sins they have chosen to speak
    wickedness against God (cf. Ps. 74.6), and blasphemies against the Saints. Epilogue
    Let us briefly suffice for the reputation of the falsehoods of the adversaries,
    which they have devised against the Eastern Church, alleging in support of their
    falsehoods the incoherent and impious Chapters of the said Cyril [Lucar]. And
    let it not be for a sign to be contradicted (cf. Luke 2.34) of those heretics
    that unjustly calumniate us, as though they spake truly; but for a sign to be
    believed, that is for reformation of their innovations, and for their return to
    the Catholic and Apostolic Church; in which their forefathers also were of old,
    and assisted at those Synods and contests against heretics, which these now reject
    and revile. For it was unreasonable on their part, especially as they considered
    themselves to be wise, to have listened to men that were lovers of self; and profane,
    and that spake not from the Holy Spirit, but from the prince of lies, and to have
    forsaken the Holy, Catholic, and Apostolic Church, which God hath purchased with
    the Blood of his own Son (cf. Acts 20.28); and to have abandoned her. For otherwise
    there will overtake those that have separated from the Church the pains that are
    reserved for heathens and publicans; but the Lord who hath ever protected her
    against all enemies, will not neglect the Catholic Church; to him be glory and
    dominion unto the ages of the ages. Amen. In the year of salvation 1672, on the
    16th of the Month of March, in the Holy City of Jerusalem: – I, Dositheus, by
    the mercy of God, Patriarch of the Holy City of Jerusalem and of all Palestine,
    declare and confess this to be the faith of the Eastern Church. I, Dorotheus,
    of Petra, defining, have signed. Parthenius, Metropolitan of Holy Nazareth. I,
    Joasaph, most humble Metropolitan of Ptolemais and Polisidon, and Proedrus of
    Caesaria in Palestine, have signed. I, Neophytus, humble Metropolitan of Holy
    Bethlehem, declare. I, Christodulus, humble Archbishop of Gaza, and locum tenens
    of Jannicus, the most God-beloved Archbishop of the Holy Grotto, defining, have
    signed. Antony, most humble Archbishop of Lydda. I, Christopher, sinful Archbishop
    of Neapolis, and Proedrus of Sebaste, have signed. I, Daniel, Hieromonk, Great
    Archimandrite of the Holy Sepulchre, agreeing with allt he above, have signed.
    I, Cyril, Hieromonk, and Great Protosyncellus of Jerusalem, and Prohegumen of
    the Monastery of the Holy Sepulchre at Trebizond, have signed. I, Meletius, unworthy
    Hieromonk, and Archimandrite, and Apocrisiarius of the Holy and Life-Giving Sepulchre
    to Pagratius the most pious King of the Iberi, and to the most illustrious Sovereigns
    of Colchis, and of Gruria, together with all the Local Synod of Upper Iberia,
    defining, have signed. I, Joseph, Hieromonk, of Emparatasielnes, Kathhegumen of
    the Monastery of the Iberi at Jerusalem, agree. I, Gregory, Hieromonk, Kathhegumen
    of Holy Bethlehem, have signed. I, Abernius, Hieromonk, and Kathhegumen of the
    venerable and royal Monastery of the Archangel, have signed. Daniel, Hieromonk,
    Kathhegumen of the Holy Lavra of Saint Sabbas. I, Dionysius, Hieromonk, and Hegumen
    of Saint Elias, agree. I, Arsenius, Hieromonk, and Kathhegumen of Saint George
    at Pezala, have signed. Neophytus, Hieromonko, Kathhegumen of Saint Thecla. Germanus,
    Hieromonk, and Ephemerius of the Holy Sepulchre. I, Callinicus, Hieromonk, Spiritual
    [Director] of the Nuns, have signed. I, Azarias, Great Archdeacon of Jersualem,
    with the other Hierodeacons, do agree. Macarius, Hieromonk, Kathhegumen of the
    Precursor. I, Abbakum, Skevophylax of the Holy Sepulchre, have signed. Daniel,
    Hieromonk, and Syncellus of Jerusalem. I, Timotheus, from Great Russia, do confess
    this to be our faith, and that of the Eastern Church. I, Michael, Priest, Great
    Economus, believe and confess this to be our faith, which the Apostolic and Orthodox
    Church commandeth, and enjoineth. [Signed in Arabic.] Isaac, Priest, Great Skevophylax.
    [Signed in Arabic.] Michael, Priest, Great Sacellarius. [Signed in Arabic.] Moses,
    Priest, Great Sacellarius. Sourour, Priest, Protopope. [Signed in Arabic.] Elias,
    Priest, Economus of Lydda. Suleyman, Priest, Economus of Ramplius. Abib (Agapius),
    Priest, Protopope of Lydda, with the Priests that are with me. [Signed in Arabic.]
    I, Germanus, Hieromonk, and Exarch of the Archbishop of Joppa, agree. George,
    Priest, Economus of Caesaria in Palestine. [Signed in Arabic.] Symeon, Priest,
    Ephemerius of St Elias on Carmel. [Signed in Arabic.] I, Gregory, Priest, Protosyncellus
    of Moldavia, confess this to be our Catholic faith, and that of the Eastern Church.
    I, Seraphim, Hierodeacon, from Miletus, do declare the same. I, Gennadius, Hieromonk,
    Syncellus of Jerusalem, have signed. Moses, Priest, Economus of Neapolis. [Signed
    in Arabic.] I, Philemon, Hieromonk, and Archimandrite, and Procurator of the Most
    Holy Metropolis of Bostra, defining, have signed. I, Macarius, Hieromonk, from
    Crete, and Preacher of the Holy and Sacred Gospel, and Legate of the Holy Sepulchre
    unto the Faithful in Macedonia, and Achaia, and Asia, have signed. Jesus, Priest,
    Economus of Holy Bethlehem. George, Priest, and Ephemerius of the Holy Grotto.
    Isas, Priest, and Ephemerius of the Holy Grotto. Jeremias, Priest, Economus of
    Pezala. Chores, [Priest] of Campempa, and Economus of Petra. I, Pascales, Priest,
    Ephemerius of the holy Mount Thabor, and Procurator of the Village thereof, and
    of the Village of Nain, and of the neighbourhood, have signed. Leontius, Exarch
    of Scythopolis. Germanus, Hieromonk, Exarch or Procurator of Gabao and Ramala.
    Agapius, Priest, Economus of Gaza, and the Priests and Deacons that are with me.
    I, George, Priest and Economus of Ptolemais, have signed. I, Gabriel, Hieromonk,
    Protosyncellus and Protopsaltes of Jerusalem, to this Apology against heretics,
    which we have unanimously composed for our Catholic faith, have signed. Justin,
    second of the Hierodeacons, and Domesticus of Jerusalem. Joseph, Hierodeacon,
    and third of the Deacons. Jacob, Hierodeacon. Athanasius, Hierodeacon. Joacheim,
    Great Ecclesiarch. Joacheim, Hieromonk, Legate unto the Faithful at Catochris.
    Lucian, Hieromonk, and Syncellus of Jerusalem. John, Great Logothetes [of the
    Church] of the Resurrection. [Signed in Arabic.] Chaleles, son of Peter, Great
    Protonotary. [Signed in Arabic.] Naser, Primmicerius. Antony, Lampadarius. Athiteles,
    Referendarius. Cyril, Hieromonk, Hegumen of Neochorius. I, Joasaph, Hieromonk,
    Archimandrite of the Holy Sepulchre, and Apocrisarius to Alexius, the most serene
    Autocrat of Moscovy, have signed. These present, as above, with the proper signatures,
    to wit, and all particulars, have been entered in this codex of our Apostolic
    Throne for perpetual memory and assurance thereofm the 20th [day] of March 1672.
    We, Dositheus, Patriarch of Jerusalem, have, with our own hand, written the same,
    and do make declaration thereof. I, Nectarius, formerly Patriarch of Jerusalem,
    declare and confess this to be our faith, and that of the Eastern Church. I, Nectarius,
    Monk, and Secretary [of the Church] of the Holy Resurrection of Christ our God,
    agreeing with the Holy Synod, have signed..</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-1">The
    Eastern Orthodox Confession of Faith (1723), Question 3</a>)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
