  body: '<h2>2nd century</h2><h3>Papias of Hierapolis, hieromartyr (c. 70–140)</h3><blockquote><p>…
    <strong>what I did not consider would bring me as much profit as the living voice
    remaining in the soul</strong>… If, then, any one who had attended on the elders
    came, I asked minutely after their sayings,—what Andrew or Peter said, or what
    was said by Philip, or by Thomas, or by James, or by John, or by Matthew, or by
    any other of the Lord’s disciples: which things[5] Aristion and the presbyter
    John, the disciples of the Lord, say. For I imagined that what was to be got from
    books was not so profitable to me as what came from the living and abiding voice.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/papias-fragments-of-papias">Exposition of the
    Sayings of the Lord</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>2.
    <strong><mark>But, again, when we refer them to that tradition which originates
    from the apostles</mark>, [and] which is preserved by means of the succession
    of presbyters in the Churches, they object to tradition, saying that they themselves
    are wiser not merely than the presbyters, but even than the apostles, because
    they have discovered the unadulterated truth. For [they maintain] that the apostles
    intermingled the things of the law with the words of the Saviour; and that not
    the apostles alone, but even the Lord Himself, spoke as at one time from the Demiurge,
    at another from the intermediate place, and yet again from the Pleroma, but that
    they themselves, indubitably, unsulliedly, and purely, have knowledge of the hidden
    mystery: this is, indeed, to blaspheme their Creator after a most impudent manner!
    It comes to this, therefore, that these men do now consent neither to Scripture
    nor to tradition. 3. Such are the adversaries with whom we have to deal, my very
    dear friend, endeavouring like slippery serpents to escape at all points. Where-fore
    they must be opposed at all points, if per-chance, by cutting off their retreat,
    we may succeed in turning them back to the truth. For, though it is not an easy
    thing for a soul under the influence of error to repent, yet, on the other hand,
    it is not altogether impossible to escape from error when the truth is brought
    alongside it. 3 A Refutation of the Heretics, from the Fact That, in the Various
    Churches, a Perpetual Succession of Bishops Was Kept Up. 1. It is within the power
    of all, therefore, in every Church, who may wish to see the truth, to contemplate
    clearly the tradition of the apostles manifested throughout the whole world; and
    we are in a position to reckon up those who were by the apostles instituted bishops
    in the Churches, and [to demonstrate] the succession of these men to our own times;
    those who neither taught nor knew of anything like what these [heretics] rave
    about. For if the apostles had known hidden mysteries, which they were in the
    habit of imparting to "the perfect" apart and privily from the rest, they would
    have delivered them especially to those to whom they were also committing the
    Churches themselves. For they were desirous that these men should be very perfect
    and blameless in all things, whom also they were leaving behind as their successors,
    delivering up their own place of government to these men; which men, if they discharged
    their functions honestly, would be a great boon [to the Church], but if they should
    fall away, the direst calamity. 2. Since, however, it would be very tedious, in
    such a volume as this, to reckon up the successions of all the Churches, we do
    put to confusion all those who, in whatever manner, whether by an evil self-pleasing,
    by vainglory, or by blindness and perverse opinion, assemble in unauthorized meetings;
    [we do this, I say, ] by indicating that tradition derived from the apostles,
    of the very great, the very ancient, and universally known Church founded and
    organized at Rome by the two most glorious apostles, Peter and Paul; as also [by
    pointing out] the faith preached to men, which comes down to our time by means
    of the successions of the bishops. For it is a matter of necessity that every
    Church should agree with this Church, on account of its pre- eminent authority,
    that is, the faithful everywhere, inasmuch as the apostolical tradition has been
    preserved continuously by those [faithful men] who exist everywhere. 3. The blessed
    apostles, then, having founded and built up the Church, committed into the hands
    of Linus the office of the episcopate. Of this Linus, Paul makes mention in the
    Epistles to Timothy. To him succeeded Anacletus; and after him, in the third place
    from the apostles, Clement was allotted the bishopric. This man, as he had seen
    the blessed apostles, and had been conversant with them, might be said to have
    the preaching of the apostles still echoing [in his ears], and their traditions
    before his eyes. Nor was he alone [in this], for there were many still remaining
    who had received instructions from the apostles. In the time of this Clement,
    no small dissension having occurred among the brethren at Corinth, the Church
    in Rome despatched a most powerful letter to the Corinthians, exhorting them to
    peace, renewing their faith, and declaring the tradition which it had lately received
    from the apostles, proclaiming the one God, omnipotent, the Maker of heaven and
    earth, the Creator of man, who brought on the deluge, and called Abraham, who
    led the people from the land of Egypt, spake with Moses, set forth the law, sent
    the prophets, and who has prepared fire for the devil and his angels. From this
    document, whosoever chooses to do so, may learn that He, the Father of our Lord
    Jesus Christ, was preached by the Churches, and may also understand the apostolical
    tradition of the Church, since this Epistle is of older date than these men who
    are now propagating falsehood, and who conjure into existence another god beyond
    the Creator and the Maker of all existing things. To this Clement there succeeded
    Evaristus. Alexander followed Evaristus; then, sixth from the apostles, Sixtus
    was appointed; after him, Telephorus, who was gloriously martyred; then Hyginus;
    after him, Pius; then after him, Anicetus. Sorer having succeeded Anicetus, Eleutherius
    does now, in the twelfth place from the apostles, hold the inheritance of the
    episcopate. In this order, and by this succession, the ecclesiastical tradition
    from the apostles, and the preaching of the truth, have come down to us. And this
    is most abundant proof that there is one and the same vivifying faith, which has
    been preserved in the Church from the apostles until now, and handed down in truth.
    4. But Polycarp also was not only instructed by apostles, and conversed with many
    who had seen Christ, but was also, by apostles in Asia, appointed bishop of the
    Church in Smyrna, whom I also saw in my early youth, for he tarried [on earth]
    a very long time, and, when a very old man, gloriously and most nobly suffering
    martyrdom, departed this life, having always taught the things which he had learned
    from the apostles, and which the Church has handed down, and which alone are true.
    To these things all the Asiatic Churches testify, as do also those men who have
    succeeded Polycarp down to the present time,-a man who was of much greater weight,
    and a more stedfast witness of truth, than Valentinus, and Marcion, and the rest
    of the heretics. He it was who, coming to Rome in the time of Anicetus caused
    many to turn away from the aforesaid heretics to the Church of God, proclaiming
    that he had received this one and sole truth from the apostles,-that, namely,
    which is handed down by the Church. There are also those who heard from him that
    John, the disciple of the Lord, going to bathe at Ephesus, and perceiving Cerinthus
    within, rushed out of the bath-house without bathing, exclaiming, "Let us fly,
    lest even the bath-house fall down, because Cerinthus, the enemy of the truth,
    is within." And Polycarp himself replied to Marcion, who met him on one occasion,
    and said, "Dost thou know me? ""I do know thee, the first-born of Satan." Such
    was the horror which the apostles and their disciples had against holding even
    verbal communication with any corrupters of the truth; as Paul also says, "A man
    that is an heretic, after the first and second admonition, reject; knowing that
    he that is such is subverted, and sinneth, being condemned of himself." There
    is also a very powerful Epistle of Polycarp written to the Philippians, from which
    those who choose to do so, and are anxious about their salvation, can learn the
    character of his faith, and the preaching of the truth. Then, again, the Church
    in Ephesus, founded by Paul, and having John remaining among them permanently
    until the times of Trajan, is a true witness of the tradition of the apostles.
    4 The Truth is to Be Found Nowhere Else But in the Catholic Church, the Sole Depository
    of Apostolical Doctrine. Heresies are of Recent Formation, and Cannot Trace Their
    Origin Up to the Apostles. 1. Since therefore we have such proofs, it is not necessary
    to seek the truth among others which it is easy to obtain from the Church; since
    the apostles, like a rich man [depositing his money] in a bank, lodged in her
    hands most copiously all things pertaining to the truth: <strong><mark>so that
    every man, whosoever will, can draw from her the water of life</mark></strong>..
    For she is the entrance to life; all others are thieves and robbers. On this account
    are we bound to avoid them, but to make choice of the thing pertaining to the
    Church with the utmost diligence, and to lay hold of the tradition of the truth.
    For how stands the case? Suppose there arise a dispute relative to some important
    question among us, should we not have recourse to the most ancient Churches with
    which the apostles held constant intercourse, and learn from them what is certain
    and clear in regard to the present question? For how should it be if the apostles
    themselves had not left us writings? Would it not be necessary, [in that case,]
    <mark>to follow the course of the tradition</mark> which they handed down to those
    to whom they did commit the Churches?</strong> 2. To which course many nations
    of those barbarians who believe in Christ do assent, having salvation written
    in their hearts by the Spirit, without paper or ink, and, <mark>carefully preserving
    the ancient tradition</mark>, believing in one God, the Creator of heaven and
    earth, and all things therein, by means of Christ Jesus, the Son of God; who,
    because of His surpassing love towards His creation, condescended to be born of
    the virgin, He Himself uniting man through Himself to God, and having suffered
    under Pontius Pilate, and rising again, and having been received up in splendour,
    shall come in glory, the Saviour of those who are saved, and the Judge of those
    who are judged, and sending into eternal fire those who transform the truth, and
    despise His Father and His advent. Those who, in the absence of written documents,
    have believed this faith, are barbarians, so far as regards our language; but
    as regards doctrine, manner, and tenor of life, they are, because of faith, very
    wise indeed; and they do please God, ordering their conversation in all righteousness,
    chastity, and wisdom. If any one were to preach to these men the inventions of
    the heretics, speaking to them in their own language, they would at once stop
    their ears, and flee as far off as possible, not enduring even to listen to the
    blasphemous address. Thus, by means of that ancient tradition of the apostles,
    they do not suffer their mind to conceive anything of the [doctrines suggested
    by the] portentous language of these teachers, among whom neither Church nor doctrine
    has ever been established. 3. For, prior to Valentinus, those who follow Valentinus
    had no existence; nor did those from Marcion exist before Marcion; nor, in short,
    had any of those malignant-minded people, whom I have above enumerated, any being
    previous to the initiators and inventors of their perversity. For Valentinus came
    to Rome in the time of Hyginus, flourished under Pius, and remained until Anicetus.
    Cerdon, too, Marcion''s predecessor, himself arrived in the time of Hyginus, who
    was the ninth bishop. Coming frequently into the Church, and making public confession,
    he thus remained, one time teaching in secret, and then again making public confession;
    but at last, having been denounced for corrupt teaching, he was excommunicated
    from the assembly of the brethren. Marcion, then, succeeding him, flourished under
    Anicetus, who held the tenth place of the episcopate. But the rest, who are called
    Gnostics, take rise from Menander, Simon''s disciple, as I have shown; and each
    one of them appeared to be both the father and the high priest of that doctrine
    into which he has been initiated. But all these (the Marcosians) broke out into
    their apostasy much later, even during the intermediate period of the Church.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-2">Against Heresies,
    Book III, ch. 2–4</a>)</p><blockquote><p>1. Now all these [heretics] <strong>are
    of much later date than the bishops to whom the apostles committed the Churches</strong>;
    which fact I have in the third book taken all pains to demonstrate. It follows,
    then, as a matter of course, that these heretics aforementioned, since they are
    blind to the truth, and deviate from the [right] way, will walk in various roads;
    and therefore the footsteps of their doctrine are scattered here and there without
    agreement or connection. But the path of those belonging to the Church circumscribes
    the whole world, as possessing the sure tradition from the apostles, and gives
    unto us to see that the faith of all is one and the same, since all receive one
    and the same God the Father, and believe in the same dispensation regarding the
    incarnation of the Son of God, and are cognizant of the same gift of the Spirit,
    and are conversant with the same commandments, and preserve the same form of ecclesiastical
    constitution, and expect the same advent of the Lord, and await the same salvation
    of the complete man, that is, of the soul and body. And undoubtedly the preaching
    of the Church is true and stedfast, in which one and the same way of salvation
    is shown throughout the whole world. For to her is entrusted the light of God;
    and therefore the "wisdom" of God, by means of which she saves all men, "is declared
    in [its] going forth; it uttereth [its voice] faithfully in the streets, is preached
    on the tops of the walls, and speaks continually in the gates of the city." For
    the Church preaches the truth everywhere, and she is the seven-branched candlestick
    which bears the light of Christ. 2. Those, therefore, who desert the preaching
    of the Church, call in question the knowledge of the holy presbyters, not taking
    into consideration of how much greater consequence is a religious man, even in
    a private station, than a blasphemous and impudent sophist. Now, such are all
    the heretics, and those who imagine that they have hit upon something more beyond
    the truth, so that by following those things already mentioned, proceeding on
    their way variously, in harmoniously, and foolishly, not keeping always to the
    same opinions with regard to the same things, as blind men are led by the blind,
    they shall deservedly fall into the ditch of ignorance lying in their path, ever
    seeking and never finding out the truth. It behoves us, therefore, <strong><mark>to
    avoid their doctrines, and to take careful heed lest we suffer any injury from
    them</mark></strong>; but to flee to the Church, and be brought up in her bosom,
    and be nourished with the Lord''s Scriptures. For the Church has been planted
    as a garden (paradisus) in this world; therefore says the Spirit of God, "Thou
    mayest freely eat from every tree of the garden," that is, Eat ye from every Scripture
    of the Lord; but ye shall not eat with an uplifted mind, nor touch any heretical
    discord.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against
    Heresies, Book V, ch. 20</a>)</p><h2>3rd century</h2><h3>Clement of Alexandria,
    presbyter (150–215)</h3><blockquote><p><strong>Tradition says</strong> that the
    apostle Matthew never ceased to repeat that “if the neighbour of one of the elect
    sins, the elect himself is to blame… The faculty of judgment is equally natural
    to all men, but some, following the instruction of the Logos, become believers,
    while others, giving themselves up to their passions, <strong>ravish the Scripture
    to suit themselves</strong>. (5) Therefore great strength of spirit must belong
    to the lover of truth, for he who undertakes great things is exposed to great
    temptations. He must correspond to <strong>that canon of true teaching which he
    once acknowledged as such</strong>… Unhappy are those who have left this straight
    path: they stumble at every step, and no wonder: <mark>they have no criterion
    for distinguishing falsehood from truth</mark>, which allows the essential to
    be singled out. If they had it, they would follow the Scripture in everything.
    Like those who have drunk Circe’s magic potion and at once turned into beasts,
    these people, <mark>opposing the Church’s tradition</mark> and following heretical
    views instead of it, cease to be men of God and lose the title of faithful servants
    of the Lord… I shall be objected to, that the heretics also cite the same apostolic
    traditions. We answer with the remark that they do not receive all the sacred
    books, and far from always do they quote the corresponding passages in full, as
    the sense and the composition of the place of the prophetic writing require. Deliberately
    choosing certain ambiguous places, <mark>they interpret them in their own way</mark>,
    plucking separate words out of the context instead of entering into the true sense
    and meaning of the sacred texts. (3) You will find that everywhere they pay attention
    only to separate phrases, often distorting their meaning, not understanding what
    is said, though they assert it, and not using the corresponding passages in their
    own sense… Not having comprehended the mysteries of the Church’s gnosis and not
    having managed to take in the grandeur of the truth, in their striving to reach
    the very depths but understanding everything astonishingly superficially, they
    finally and inevitably diverge from the Scripture… With us it is accepted that
    the knowledge of the truth develops gradually from what we have already believed
    to what we have yet to believe… Empty are called not only those almonds which
    are hollow within, but also those whose fruit is good for nothing. In the same
    way we call heretical teachings empty and void of content, since they do not contain
    the will of God, do not speak of the traditions that come from Christ, and are
    no less bitter than the wild almond. Everything in their teachings is arbitrary
    invention, except what could not be concealed or rejected because of the obviousness
    of the truth… To the divine traditions they oppose human thoughts and so create
    yet another heresy… Therefore only he may be called the true gnostic who has grown
    old in the study of the Scripture, keeps inviolate the purity of the apostolic
    and ecclesiastical teachings, leads a virtuous life in accordance with the Gospel,
    and finds proofs in what the Lord has opened, as well as in the law and the prophets.
    (2) Truly his life is the unity of deed and word, in agreement with the traditions
    that come from the Lord.</p></blockquote><p>(The Stromata, Book VII)</p><blockquote><p>Indeed,
    those who hold to impious teachings and lead others to them <strong><mark>turn
    the divine word not to the profit but to the harm</mark></strong> of those who
    hear it”; they shut for themselves the entrance into the Kingdom of Heaven, and
    do not allow those whom they deceive to comprehend the truth. (2) <strong><mark>Having
    no key of the entrance</mark></strong>, they use a counterfeit key, or, as they
    say, a lockpick (ἀντικλέις), with which they enter not through the outer door,
    <mark>by which we enter by means of the Divine tradition</mark>, but, breaking
    through the side gate, they creep in secretly behind the church walls, distorting
    the truth in every way and presenting themselves as teachers initiated into the
    mysteries (μυσταγωγοι) and bringing up the souls of the ungodly.</p></blockquote><p>(The
    Stromata, Book VII)</p><blockquote><p>Those who are to be initiated into the mysteries
    of the faith should first pass through certain purifying stages; and only then
    must <strong>the true traditions be planted in the place of the false ones</strong>.
    … We speak of Christ as the beginning of all and the end: for as the beginning
    of all, faith in Him, so the end of all, love for Him, cannot be the subject of
    teaching and instruction; while <strong><mark>knowledge, by the mercy of God,
    is communicated to us by tradition</mark></strong>.</p></blockquote><p>(The Stromata,
    Book VII)</p><h3>Tertullian (c. 160–240)</h3><blockquote><p><strong>If, for these
    and other such rules, you insist upon having positive Scripture injunction, you
    will find none</strong>. <strong><mark>Tradition will be held forth to you as
    the originator of them, custom as their strengthener, and faith as their observer</mark></strong>.
    That reason will support tradition, and custom, and faith, you will either yourself
    perceive, or learn from some one who has. Meanwhile you will believe <strong><mark>that
    there is some reason to which submission is due</mark></strong>. … <strong>These
    instances, therefore, will make it sufficiently plain that you can vindicate the
    keeping of even unwritten tradition</strong> established by custom; the proper
    witness for tradition when demonstrated by long-continued observance. … Earnestly
    now inquire of this teacher, keeping intact your regard for tradition, from whomsoever
    it originally sprang; nor have regard to the author, but to the authority, and
    especially that of custom itself, which on this very account we should revere,
    that we may not want an interpreter; so that if reason too is God’s gift, you
    may then learn, not whether custom has to be followed by you, but why.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-the-chaplet-or-de-corona">The Chaplet,
    or De Corona</a>)</p><h2>4th century</h2><h3>St Epiphanius of Cyprus, bishop (c.
    315–403)</h3><blockquote><p>“<strong><mark>Tradition also must be made use of:
    for not everything can be taken from the divine Scripture. For this reason the
    holy Apostles handed down some things in writings, and others in traditions</mark></strong>,
    as the holy Apostle says: <em>as I delivered them to you</em> (1 Cor. 11:2), and
    in another place: <em>so teach I, and so I ordained in all the churches</em> (1
    Cor. 7:17), and: <em>unless ye have believed in vain</em> (1 Cor. 15:2).”</p></blockquote><p>(Panarion,
    or the Medicine Chest, against the eighty heresies: the Apostolics)</p><h3>St
    Athanasius the Great (c. 295–373)</h3><blockquote><p>For not only in outward form
    did those wicked men dissemble, putting on as the Lord says sheep’s clothing,
    and appearing like unto whited sepulchres; but they took those divine words in
    their mouth, while they inwardly cherished evil intentions. And the first to put
    on this appearance was the serpent, the inventor of wickedness from the beginning—the
    devil,—who, in disguise, conversed with Eve, and forthwith deceived her. But after
    him and with him are all inventors of unlawful heresies, who indeed refer to the
    Scriptures, but do not hold such opinions as the saints have handed down, and
    receiving them as the traditions of men, err, because they do not rightly know
    them nor their (Matt. 22:29) power. Therefore Paul justly praises the Corinthians
    (1 Cor. 11:2), because their opinions were in accordance with his traditions.
    And the Lord most righteously reproved the Jews, saying, ‘Wherefore do ye also
    transgress the commandments of God on account of your traditions (Matt. 15:3).’
    For they changed the commandments they received from God after their own understanding,
    preferring to observe the traditions of men. And about these, a little after,
    the blessed Paul again gave directions to the Galatians who were in danger thereof,
    writing to them, ‘If any man preach to you aught else than that ye have received,
    let him be accursed (Gal. 1:9).’ 7. For there is no fellowship whatever between
    the words of the saints and the fancies of human invention; for the saints are
    the ministers of the truth, preaching the kingdom of heaven, but those who are
    borne in the opposite direction have nothing better than to eat, and think their
    end is that they shall cease to be, and they say, ‘Let us eat and drink, for to-morrow
    we die (Isa. 22:13).’ Therefore blessed Luke reproves the inventions of men, and
    hands down the narrations of the saints, saying in the beginning of the Gospel,
    ‘Since many have presumed to write narrations of those events of which we are
    assured, as those who from the beginning were witnesses and ministers of the Word
    have delivered to us; it hath seemed good to me also, who have adhered to them
    all from the first, to write correctly in order to thee, O excellent Theophilus,
    that thou mayest know the truth concerning the things in which thou hast been
    instructed (Luke 1:1).’ For as each of the saints has received, that they impart
    without alteration, for the confirmation of the doctrine of the mysteries. Of
    these the (divine) word would have us disciples, and these should of right be
    our teachers, and to them only is it necessary to give heed, for of them only
    is ‘the word faithful and worthy of all acceptation (1 Tim. 1:15);’ these not
    being disciples because they heard from others, but being eye-witnesses and ministers
    of the Word, that which they had heard from Him have they handed down.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/athanasius-the-festal-letters-1">Second Festal
    Letter, 330</a>)</p><h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p>“2
    Thess. 2:15. ‘So then, brethren, <strong><mark>stand fast, and hold the traditions
    which ye were taught, whether by word, or by Epistle of ours</mark></strong>.’
    Hence it is manifest, that they did not deliver all things by Epistle, but <strong><mark>many
    things also unwritten</mark></strong>, and in like manner <strong><mark>both the
    one and the other are worthy of credit</mark></strong>. Therefore let us think
    the tradition of the Church also worthy of credit. It is a tradition, seek no
    farther.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-second-thessalonians">Homilies
    on Second Thessalonians</a>)</p><blockquote><p>But should any say, Why did he
    not relate all, having continued with Paul to the end? I reply, that what he has
    related is sufficient even for the perfection of the faith; and if a man is disposed
    to be careless and unbelieving here, he would not be made faithful by the addition
    of even a hundred other circumstances; <strong><mark>for the chief care of the
    writers was not to write books</mark></strong>, but to show forth the things by
    which we might be saved. And <strong><mark>they communicated much also by unwritten
    tradition</mark></strong>, both what was to be done and what was to be believed.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-homilies-on-the-acts-of-the-apostles-1">Homilies
    on the Acts of the Apostles, Homily 1</a>)</p><blockquote><p>For the believer,
    as is meet, and firm in the faith, <strong><mark>requires neither proof nor reason</mark></strong>
    for what is said; <strong><mark>he is satisfied with one tradition</mark></strong>,
    the Church’s.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-1">Homilies
    on First Corinthians</a>)</p><h3>Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p>But
    as touching the faith which is taught and professed, <strong>acquire and keep
    that only</strong>, <mark>which is now delivered to thee by the Church</mark>,
    and which has been built up strongly out of all the Scriptures. For since all
    cannot read the Scriptures, some being hindered as to the knowledge of them by
    want of learning, and others by a want of leisure, in order that the soul may
    not perish from ignorance, we comprise the whole doctrine of the Faith in a few
    lines. This summary I wish you both to commit to memory when I recite it, and
    to rehearse it with all diligence among yourselves, not writing it out on paper,
    but engraving it by the memory upon your heart, taking care while you rehearse
    it that no Catechumen chance to overhear the things which have been delivered
    to you.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1">The
    Catechetical Lectures, Lecture V</a>)</p><blockquote><p>So, we have need therefore
    of divine grace, and of a sober mind, and of eyes that see, lest from eating tares
    as wheat we suffer harm from ignorance, and lest from taking the wolf to be a
    sheep we become his prey, and from supposing the destroying Devil to be a beneficent
    Angel we be devoured: for, as the Scripture saith, he goeth about as a roaring
    lion, seeking whom he may devour (1 Pet. 5:8). <strong><mark>This is the cause
    of the Church’s admonitions, the cause of the present instructions, and of the
    lessons which are read</mark></strong>. … <strong><mark>Therefore the knowledge
    of the doctrines and the wakefulness of the soul is the greatest acquisition</mark></strong>:
    the Greeks draw men away by their smooth tongue; <mark>they of the Circumcision
    deceive those who come to them by means of the Divine Scriptures, which they miserably
    misinterpret though studying them from childhood to old age</mark>, and growing
    old in ignorance.</p></blockquote><p>(<a href=\"https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1\">The
    Catechetical Lectures, Lecture IV, 1–2</a>)</p><blockquote><p>“<strong><mark>Keep
    these traditions</mark></strong> (of the mysteries — note), unspotted and blameless,
    and keep yourselves without offence. Depart from…</p></blockquote><p>(The Mystagogical
    Lectures)</p><h3>St Basil the Great (c. 329–379)</h3><blockquote><p>Of the beliefs
    and practices whether generally accepted or publicly enjoined which are preserved
    in the Church <strong><mark>some we possess derived from written teaching; others
    we have received delivered to us in a mystery by the tradition of the apostles</mark></strong>;
    and <strong><mark>both of these in relation to true religion have the same force</mark></strong>.
    And these no one will gainsay — no one, at all events, who is even moderately
    versed in the institutions of the Church. For were we to attempt to reject such
    customs as have no written authority, on the ground that the importance they possess
    is small, we should unintentionally injure the Gospel in its very vitals; or,
    rather, should make our public definition a mere phrase and nothing more. For
    instance, to take the first and most general example, who is thence who has taught
    us in writing to sign with the sign of the cross those who have trusted in the
    name of our Lord Jesus Christ? What writing has taught us to turn to the east
    at prayer? Who of the saints has left us in writing the words of the invocation
    at the display of the bread of the Eucharist and of the cup of blessing? For we
    are not content with those words which the Apostle or the Gospel has recorded,
    but both before and after them we say others, as having great force for the accomplishment
    of the mystery, having received them from the unwritten teaching. We bless also
    the water of baptism, and the oil of anointing, and even the baptizant himself,
    according to what written rules? Is it not after the tradition kept in silence
    and mystical? Whence also the threefold immersion of the baptizant? From what
    writing is the rest taken that belongs to baptism — to renounce Satan and his
    angels? Is it not from that unpublished and secret teaching which our fathers
    guarded in a silence out of the reach of curious meddling and inquisitive investigation?
    Well had they learned the lesson that the awful dignity of the mysteries is best
    preserved by silence.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/rwa9_De_Spiritu_Sancto">About
    the Holy Spirit, ch. 27</a>)</p><blockquote><p>A further powerful incentive to
    my undertaking was the warm fervour of your love unfeigned, and the seriousness
    and taciturnity of your disposition; a guarantee that you would not publish what
    I was about to say to all the world – not because it would not be worth making
    known, but to avoid casting pearls before swine. Matthew 7:6 My task is now done.
    If you find what I have said satisfactory, let this make an end to our discussion
    of these matters.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/rwa9_De_Spiritu_Sancto">About
    the Holy Spirit, to Amphilochius</a>)</p><blockquote><p>In answer to the objection
    that the doxology in the form with the Spirit has no written authority, we maintain
    that if there is no other instance of that which is unwritten, then this must
    not be received. But if the greater number of our mysteries are admitted into
    our constitution without written authority, then, in company with the many others,
    let us receive this one. For I hold it apostolic to abide also by the unwritten
    traditions. I praise you, it is said, that you remember me in all things, and
    keep the ordinances as I delivered them to you; 1Corinthians 11:2 and Hold fast
    the traditions which you have been taught whether by word, or our Epistle. 2 Thessalonians
    2:15 One of these traditions is the practice which is now before us, which they
    who ordained from the beginning, rooted firmly in the churches, delivering it
    to their successors, and its use through long custom advances pace by pace with
    time.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/rwa9_De_Spiritu_Sancto">About
    the Holy Spirit, ch. 71</a>)</p><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>Am.
    6:2-6: “<em>Ye drink strained wine, <mark>and anoint yourselves with the first
    ointments</mark></em>, and are not at all grieved for the breaking of Joseph”…
    The words that follow — <em>ye drink strained wine</em> — may be applied properly
    to the heretics, to those heretics who approve some of the Scriptures and reject
    others, wishing to drink strained wine, whereas in the Holy Scriptures there is
    nothing turbid or dirty, but all in them is like the top parts of the purest liquid.
    <strong><mark>Those anoint themselves with the first ointments who</mark></strong>,
    not possessing the art of using ointments, <strong>being strangers to the knowledge
    of the Scriptures, of the traditions and of the apostolic teaching</strong>, appropriate
    to themselves the dignity of the priesthood and call themselves the anointed of
    the Lord, polluting the purest oil with the dregs of their understanding. And,
    doing this to the destruction of those whom they have deceived, they do not grieve
    at all, but rejoice at another’s death and take pleasure in the blood of the wretched.</p></blockquote><p>(Commentary
    on the Prophet Amos, Am. 6:2-6)</p><blockquote><p>…rhetoricians, philosophers,
    geometers, dialecticians, musicians, astronomers, astrologers and physicians,
    whose knowledge is useful to mortals and is divided into three parts: into dogma,
    method and practice. I turn to the less significant arts, which are produced not
    so much by the ear as by the hand. Husbandmen, masons, craftsmen, sawyers, woodcutters,
    wool-beaters, felt-makers and <strong><mark>the other makers of household utensils
    and various cheap trinkets cannot do without a teacher</mark></strong>. “Healing
    is the work of physicians; and the creation of arts, only the artist makes” (Horace,
    Epistles II 1, 115–116). But <strong><mark>the knowledge of the Scriptures everyone
    everywhere appropriates to himself. “We, — learned, unlearned, it matters not,
    — all write poems”</mark></strong> (ibid., 117). And <strong><mark>the talkative
    old woman, and the garrulous old man, and the wordy sophist — in a word, all attribute
    to themselves the knowledge of the Scriptures</mark></strong>, torment them and
    teach others before learning themselves. Some, taking on an important air and
    thundering with choice words, philosophize among women about the sacred Scriptures.
    Others — shame! — learn from women what they pass on to men; and moreover, thanks
    to the lightness of their tongue and their boldness, teach others what they do
    not understand themselves. … Such attempts to teach what you do not know are natural
    to children and charlatans, and even, obeying their personal whims and tastes,
    not to know of their own ignorance.</p></blockquote><p>(Letter to Paulinus: On
    the study of Holy Scripture)</p><blockquote><p>Matt. 21:6–7: … after they had
    received the apostolic garments, they became fairer, so as to have the Lord sitting
    upon them. <strong><mark>The apostolic garment must be understood</mark></strong>
    either as the teaching of the virtues, or as <strong><mark>the interpretation
    of the Scriptures</mark></strong>, or as <strong><mark>the variety of the Church’s
    dogmas, by which the soul, unless it is instructed and adorned, does not deserve
    to have the Lord sitting upon it</mark></strong>.</p></blockquote><p>(Commentary
    on the Gospel of Matthew, Matt. 21:6-7)</p><blockquote><p>The Luciferian: … Do
    you not know even the custom of the churches, by which <strong>hands are laid
    on the baptized after baptism, and <mark>the Holy Spirit is thus called down upon
    them</mark></strong>? You will ask, where is it written? — In the Acts of the
    Apostles. But even if no testimony of the Scripture were preserved, <strong>the
    agreement of the whole world on this subject <mark>has the force of a positive
    command</mark></strong>. For <strong>much else, kept in the church by tradition,
    <mark>has the force of a written law</mark></strong>: such is the custom of dipping
    the head three times in the font, and after coming out tasting milk and honey
    joined together as a sign of (spiritual) infancy; likewise — on Sunday and throughout
    the whole of Pentecost to pray without bending the knees and to relax the fast.
    There is much else that is kept reasonably without the Scripture. From this you
    see that we follow the custom of the church, though before the invocation of the
    Holy Spirit it is known that someone has been baptized. The Orthodox: I do not
    deny that there is such a custom in the churches, by which the bishop comes to
    call down the Holy Spirit by the laying on of hands on those baptized by presbyters
    and deacons far from the great cities.</p></blockquote><p>(Dialogue Against the
    Luciferians)</p><blockquote><p>Mich. 1:16. “Make thy hair bald and clip thy head
    [in grief] for thy sons, for thy sweet consolation, make… thy baldness as the
    eagle, for they are carried away captives from thee.” The words given in the Seventy:
    “The glory of the daughter of Israel”, [that is] with the addition of daughter,
    the Jews place at the end of the preceding section (capituli). But as for <strong>us</strong>,
    — according to your wish and in keeping with what we have begun, — <strong><mark>we
    must interpret the Scripture as it is read by the church</mark></strong>, in no
    way at the same time departing from the Hebrew truth.</p></blockquote><p>(Commentary
    on the Prophet Micah, Mich. 1:1-16)</p><blockquote><p>It must be noticed also
    that the sour grapes are called vices and sins; from them comes the tooth-edge,
    and those who eat them cannot taste the sweetness of Him of whom it is said: <em>taste
    and see that the Lord is good</em> (Ps. 33:9). <strong><mark>Whoever understands
    the Scriptures contrary to the truth</mark></strong> eats sour grapes. Therefore
    all <strong>the heretics</strong>, believing perversely, cannot eat the bread
    that comes down from heaven, but the tooth-edge is on their teeth — not from the
    coarseness of the food, but from the vice of their teeth.</p></blockquote><p>(Commentary
    on the Prophet Jeremiah)</p><blockquote><p>Am. 4:4–6… But you, having left unnoticed,
    he says, the first and the second day, build for yourselves certain spiritual
    buildings without a foundation and set a roof over the walls. <strong><mark>The
    heretics</mark></strong>, of whom this is said and to whom it is directed, are
    not content even with such extreme impiety, but, <strong><mark>having withdrawn
    from the church, they read the law of God outside her, and tried to join to each
    of their teachings</mark></strong>, devised by their corrupt heart, a confession
    [of faith] and testimonies, or offered in sacrifice the leaven, of which the Gospel
    says: “beware of the leaven”, that is, the teaching “of the Pharisees” (Matt.
    16:6). And this they did not through error, but deliberately, not through a chance
    disposition, but through a very strong love of evil. Therefore the Lord threatens
    them with punishment, saying: I will give you a tooth-edge, which in Greek is
    called γομφιασμός. Since, according to Ezekiel (Ezek. 18), he who eats sour grapes
    will have the tooth-edge on his teeth, they, abusing the testimonies of Holy Scripture
    and eating it unripe and without its proper sweetness, will lose the firmness
    of their teeth and will not be able to chew the hard [food] and bring it into
    the stomach for the benefit of the whole body.</p></blockquote><p>(Commentary
    on the Prophet Amos, Am. 4:4-6)</p><blockquote><p>… <strong><mark>Church traditions</mark></strong>
    (especially those that do not harm the faith) <strong><mark>are to be observed</mark></strong>
    … as they have been handed down by the forefathers.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/jerome-the-letters-of-st-jerome-3#HH-To-Lucinius">Letter
    71. To Lucinius</a>)</p><blockquote><p>Such an interpretation we find among the
    Hebrews. And now let us <strong><mark>consider what is set forth in the interpretations
    of the men belonging to the Church</mark></strong>. The golden candlestick of
    purest gold they understand in the sense of the Church, which in the holy writings
    searches out the meaning and significance more than the words. And what is meant
    by the gold, the wings and feathers of the dove in the sixty-seventh psalm show:
    they shone with the gleam of gold (Ps. 67:14).</p></blockquote><p>(Commentary
    on the Prophet Zechariah)</p><h2>5th century</h2><h3>Vincent of Lérins, monk (†
    450)</h3><blockquote><p>This, I say, is what <strong>the Catholic Church, stirred
    by the novelties of heretics, has accomplished by the decrees of her Councils</strong>
    — this, and nothing else — she has thenceforward consigned to posterity in writing
    what she had received from those of olden times only by tradition, <strong><mark>comprising
    a great amount of matter in a few words</mark></strong>, and often, for the better
    understanding, designating an old article of the faith by the characteristic of
    a new name — <strong>the not-new sense of the Faith</strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies">The
    Commonitory of Vincent of Lérins</a>)</p><h2>8th century</h2><h3>St John of Damascus,
    monk (2nd half of the 7th c. – before 754)</h3><blockquote><p>II. So, having first
    laid down <em><strong><mark>the observance</mark></strong></em> <em>of the <strong><u><mark>church’s
    ordinance</mark></u></strong></em>, <em>through which salvation comes</em>, as
    a kind of beginning or foundation of reasoning, I opened a field for the word
    and let it out like a well-bridled horse. For truly I considered it terrible and
    more than terrible that <em><strong><mark>the church</mark></strong></em>, shining
    with such advantages and <strong><mark>long adorned with the traditions of the
    most pious men</mark></strong>, should be turned to base elements, “they feared
    a fear where no fear was” (Ps. 52:6); that as if not knowing the true God she
    fears to slip into idolatry and, in the least degree, to lose perfection; as if
    she wore in the middle of a very beautiful face some permanent brand, so utterly
    unsuited that it destroys all the beauty; for <em><strong><mark>not small is that
    which leads to greater — to overthrow the church tradition long observed</mark></strong></em>,
    as it were condemning our forefathers, “considering the end of their life, imitate
    their faith” (Heb. 13:7). … XVI. In ancient times God, bodiless and without form,
    was never depicted. Now, when God is seen in the flesh and lives among men, I
    depict the visible God. I do not worship matter, I worship the Creator of matter,
    who became matter for my sake, and vouchsafed to dwell in matter and through matter
    worked out my salvation, and I will not cease to honour the matter through which
    my salvation was accomplished. … I honour also and venerate the rest of the matter
    through which my salvation was accomplished, as full of divine power and grace.
    Is not the wood of the cross matter, happiest and most blessed? Is not the mountain
    matter, honourable and holy, Golgotha? Is not the matter the beneficent and life-giving
    rock, the holy tomb, the source of our resurrection? Is not the matter the ink
    and the all-holy book of the Gospels? Is not the matter the life-giving table,
    giving us the bread of life? Is not the matter the gold and silver, of which crosses
    and dishes and chalices are made? Is not the matter, above all this, the body
    and blood of our Lord? Either reject the honour and worship of all this, or admit,
    on the basis of church tradition, the worship of icons dedicated to the name of
    God and of the friends of God and through this overshadowed by the grace of the
    Divine Spirit. Do not blaspheme matter, for it is not contemptible, since there
    is nothing contemptible in what came from God… The shadow of the apostles, napkins
    and towels drove away diseases, put demons to flight — how shall we not glorify
    the shadow and the image of the saints? Either reject the worship of all matter,
    or do not introduce the new and do not destroy the eternal boundaries which your
    fathers have set. XXIII. <strong>Not only in writings did they hand down the church’s
    ordinance, but also in certain unwritten traditions.</strong> Therefore the divine
    Basil says in the 27th chapter of the work in 30 chapters <em>On the Holy Spirit</em>
    to Amphilochius, literally thus: “of the dogmas and preachings kept in the church
    some we have from written instruction; something handed down to us from the tradition
    of the apostles we have received in secret. Both have one and the same force for
    piety, and no one will contradict this, unless he is but little versed in the
    church’s institutions. For if we begin to reject the unwritten customs as of small
    importance, we shall imperceptibly injure the Gospel in what is most essential.”
    These are the words of the great Basil. For whence do we know the holy Golgotha?
    The tomb of life? Do not the children receive it from the father without writing?
    It is written that the Lord was crucified on Golgotha and buried in the tomb which
    Joseph hewed in the rock. But that this is the place which we now venerate, we
    know from unwritten tradition, and very much else like this. Whence the threefold
    immersion? Whence the prayer to the east? Whence the tradition of the mysteries?
    Wherefore also the divine Apostle Paul says: “Therefore, brethren, stand fast
    and hold the traditions which ye have been taught, whether by word or by our epistle”
    (2 Thess. 2:15). So, when much such has been handed down to the Church without
    writing and preserved to this day, why do you dispute about icons to no purpose?</p></blockquote><p>(Three
    Orations on the Holy Icons)</p><blockquote><p><em>So, <strong><mark>let us accept
    the church’s tradition</mark></strong> in the simplicity of the heart, and not
    with much reasoning</em>, for “God made man upright, and they have sought out
    many devices” (Eccl. 7:30). <em><strong><mark>Let us not consent to learn a new
    faith, since it condemns the tradition of the holy Fathers</mark></strong></em>,
    for the divine Apostle says: “whoever preaches to you other than what you have
    received, let him be anathema” (Gal. 1:9). <em>So we worship the icons</em>, offering
    worship not to matter, but through them to those depicted on them, for the honour
    given to the image passes to the prototype, as the divine Basil says. XLII. And
    you, most sacred flock of Christ, people named after Christ, holy people, body
    of the Church — may Christ fill you with the joy of His resurrection and vouchsafe
    you to follow in the footsteps of the saints, the pastors and teachers of the
    Church, and lead you to His glory in the bright ones of the saints, which may
    we attain by His grace, ever glorifying Him together with the unbegotten Father,
    to whom be glory for ever and ever. Amen.</p></blockquote><p>(Three Orations on
    the Holy Icons)</p><blockquote><p><em>For, as we have said, <strong>the honour
    shewn to the most thoughtful of fellow-servants is a proof of good feeling towards
    the common Master</strong></em>, and the honour given to the image passes to the
    prototype. And <strong><mark>this is an unwritten tradition</mark></strong>, as
    is also the tradition of praying to the east, of worshipping the cross, and of
    much else like this. … <em><strong><mark>That the Apostles handed down very much
    without writing, Paul the Apostle of the nations bears witness</mark></strong></em>:
    “Therefore, brethren, stand fast, and hold the <em><mark>traditions</mark></em>
    which ye have been taught, whether by word, or by our epistle” (2 Thess. 2:15).
    And to the Corinthians he writes: “I praise you, brethren, that in all things
    ye are mindful of me, and as I have delivered to you traditions, hold them fast”
    (1 Cor. 11:2).</p></blockquote><p>(An Exact Exposition of the Orthodox Faith,
    Book IV)</p><blockquote><p><em>Faith is certainly twofold: for there is faith
    from hearing (cf. Rom. 10:17). For, hearing the Divine Scriptures, we believe
    the teaching of the Holy Spirit. And this faith is perfected through all that
    Christ has ordained: believing in deed, living piously and fulfilling the commandments
    of Him who renewed us. For <strong><mark>he who does not believe according to
    the tradition of the Catholic Church</mark></strong> or who through shameful deeds
    has communion with the devil — <strong><mark>is unfaithful</mark></strong>.</em></p></blockquote><p>(An
    Exact Exposition of the Orthodox Faith, Book IV)</p><blockquote><p>XI. Where wilt
    thou find in the Old Testament or in the Gospel the clearly stated name of the
    Trinity, or of the consubstantial, or of the one nature of the Godhead, or literally:
    three Hypostases, or one Hypostasis of Christ, or literally: two natures? <em><strong><mark>But
    since</mark></strong> on the basis of equivalent expressions found in the Scripture
    <strong><mark>the holy Fathers have defined this</mark></strong>, <strong><mark>we
    accept it</mark></strong>, and those who do not accept it we anathematize.</p></blockquote><p>(Three
    Orations on the Holy Icons, XI)</p><blockquote><p><em><strong><mark>Now the church</mark></strong>
    is consecrated by the blood of Christ and of His saints, and <strong><mark>is
    adorned with the icons of Christ and of His saints</mark></strong>. Either reject
    the worship of all images (that is, of Christ, who is the image of the Father
    — note), or do not introduce the new, “Remove not the ancient landmark which thy
    fathers have set” (Prov. 22:28). I do not speak of what was handed down before
    the coming of Christ our God in the flesh, but of what came after His coming.
    For of <em><mark>the traditions of the Old Testament (τῇ παλαιᾷ παραδόσεων)</mark></em>
    God speaks with reproach: “He gave them statutes that were not good, and judgments”
    (Ezek. 20:25) because of the hardness of their heart, so that with the change
    of the priesthood there must needs be also <em>a change of the law</em>. XVI.
    Not only in writings did the eyewitnesses and ministers of the word hand down
    the church’s ordinance, but also in certain unwritten traditions. … if we know
    from unwritten tradition … that much has been handed down to the Church without
    writing and preserved to this day, why do you dispute about icons to no purpose?
    … I am not persuaded that the Church is governed by imperial decrees — she is
    governed by patristic traditions, written and unwritten. For as throughout the
    whole world the Gospel was preached without writings, so throughout the whole
    world without writings it was handed down to depict Christ.</p></blockquote><p>(Three
    Orations on the Holy Icons)</p><h2>11th century</h2><h3>Theophylact of Ohrid,
    archbishop, blessed (2nd half of the 11th c.)</h3><blockquote><p>From this it
    is clear that much also without letters, through the word, that is, by the living
    voice, and not only through the epistles, the apostles handed down. And <strong><mark>both
    the one and the other are equally worthy of credit</mark></strong>. Therefore
    we must acknowledge the church’s Tradition as trustworthy as well. <strong><mark>There
    is Tradition — seek nothing more</mark></strong>. Here the apostle shows also
    that many waver in the faith.</p></blockquote><p>(Commentary on the Second Epistle
    to the Thessalonians)</p><h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo)
    (1651–1709)</h3><blockquote><p>The Holy Spirit acted both through the prophets
    and through the Apostles. Holy Scripture is the first and principal source of
    faith and religious knowledge — true and infallible, and binding for all. <strong><mark>A
    correct and error-free understanding of Scripture is possible only under the guidance
    of the holy universal Church</mark></strong>, and in her alone can the truth be
    found. <strong><mark>Sacred Tradition has the same divine origin as Scripture</mark></strong>;
    it therefore constitutes another source of faith and religious knowledge, likewise
    true and infallible and binding for all, as Holy Scripture is; and the universal
    Church alone, in the person of her heads, can be the only keeper of genuinely
    apostolic Tradition. — “Whoever wishes to know the truth, — reasons St Irenaeus,
    — must turn to the Church, because the Apostles entrusted the divine truth to
    her alone and, like a rich man into a treasury, placed in her everything that
    pertains to the truth. The Church alone is the door of life.” And, in particular,
    according to the teaching of St Irenaeus, only the pastors of the Church lawfully
    ordained are the true teachers and keepers of the truth contained in the Church.</p></blockquote><p>(The
    Lives of the Saints: the suffering of St Irenaeus of Lyons)</p><h2>19th century</h2><h3>St
    Nektarios of Aegina (Kefalas) (1846–1920)</h3><blockquote><p>It was the Lord Himself
    who raised up the visible altar of the Church. That is why, together with theory,
    He demands deed — a deed in agreement with the truth which He communicated to
    <strong>His holy Church, the only one that leads into Life</strong>, whose Head
    is Christ Himself. <strong>To her we must submit; precisely from her we must learn
    the Truth and receive salvation. She alone is the pillar and ground of the Truth,
    for the Spirit, the Paraclete, dwells in her eternally.</strong> The venerable
    Dositheos says the following about the Church: <strong><mark>We must believe unshakably
    in the Scripture, but in no other way than in accordance with the teaching of
    the Catholic Church</mark></strong>. The heretics, of course, accept Holy Scripture,
    but they distort it with metaphors, homonymy, and the sophisms of human reasoning,
    which confuses the uncomplicated and plays upon what cannot be played upon. If
    we were obliged to accept daily the opinions of one or another, the Catholic Church
    would not be what she, by the grace of Christ, has remained to this moment, <strong><mark>keeping
    a single point of view concerning the faith and believing unshakably in one and
    the same</mark></strong>. In that case she would be torn by a multitude of heresies
    and would no longer be the holy Church, the pillar and ground of the Truth, unspotted
    and pure. She would have become the church of the cunning, the church of heretics,
    who, having formed themselves within her, would afterwards, without any pangs
    of conscience, cast her aside. Therefore we believe that <strong><mark>the witness
    of the Catholic Church does not yield to the authority of Holy Scripture. Both
    are the work of one and the same Spirit</mark></strong>. A man speaking from himself
    may sin, be deceived and err. The Catholic Church never speaks from herself, but
    speaks by the Spirit of God, the Teacher who enriches her eternally. She cannot
    sin, nor be deceived, nor err. She is equal to Holy Scripture and possesses an
    immutable and constant authority”. St Cyril of Jerusalem enjoins: “to love to
    learn and to find out from the Church which books of the Old and New Testaments
    are received by all; for why lose time on the books that are doubtful”. One must
    read, by his word, the twenty-two books of the Old Testament translated by the
    Seventy teachers. Behind the words of St Cyril stands the authority of the Church.
    At the Council of Constantinople in 1672 Patriarch Dionysius said concerning the
    infallibility of the Church: “We say that she is infallible, guided by her own
    Head, Christ, and enlightened by the Spirit of Truth. Therefore she cannot err;
    for this reason the Apostle has called her the Pillar and Ground of the Truth.
    She is visible and will never forsake the Orthodox until the end of the age.”</p></blockquote><p>(From
    the works of St Nektarios of Aegina)</p><h3>St Nicholas of Japan, equal-to-the-apostles
    (1836–1912)</h3><blockquote><p>Protestants sometimes come to me and ask me to
    explain some place of Holy Scripture. “But you have your own missionary teachers;
    ask them,” I say to them; and what do they answer? — We did ask them, they say
    — understand it as you know how; but to me <strong><mark>it is needful to know
    the true thought of God, not my personal opinion</mark></strong>. Such is the
    instability of Protestantism with the Holy Scripture alone. It is not so with
    us: all is light and reliable, clear and firm; because, besides Holy Scripture,
    we accept also Holy Tradition, and <strong><mark>Holy Tradition is the living
    unbroken voice of our Mother the Church from the times of Christ and His Apostles
    to this day</mark></strong>, and which will be until the end of the world. Upon
    it the Holy Scripture rests whole and intact, and it helps us to understand the
    meaning of the holy Scripture without error; for if a child does not understand
    something in a letter of his father, the most reliable thing for him is to turn
    to his mother for an explanation; and our Mother is the Church, in which Christ
    Himself invisibly dwells, according to His promise.</p></blockquote><p>(Diaries.
    Volume III, January 3/15, 1897. Friday)</p><h2>20th century</h2><h3>Archpriest
    Dmitry Vladykov (1863–1955)</h3><blockquote><p><strong><mark>Holy Tradition, even
    with the appearance of the Holy Gospels and the apostolic epistles, did not lose
    its former guiding significance</mark></strong>, is not excluded by Holy Scripture,
    but is highly necessary, first, for <strong><mark>the undoubted conviction of
    the genuineness and incorruptness of the Holy Scripture itself</mark></strong>.
    From Holy Scripture it is not evident who wrote the books, when, where, and how
    many there are; in what language they were originally written; when and under
    what circumstances they were translated first into Slavonic and then into Russian;
    whether they are genuine; who, for example, wrote the Gospels? For not one of
    the evangelists names himself; whence do we know the names? These perplexities,
    as well as the perplexities on the question of the genuineness and canonical dignity
    of the apostolic epistles and other sacred books, are removed solely by Holy Tradition,
    kept by the Orthodox Church. Holy Tradition is necessary, secondly, as a guide
    to the correct understanding of Holy Scripture. In Holy Scripture is set forth
    “the wisdom of God in a mystery, hid” (1 Cor. 2:4; cf. 1 Pet. 1:12); there are
    in it “some things hard to be understood, which the unlearned and unstable wrest,
    unto their own destruction” (2 Pet. 3:16); “no prophecy of the Scripture is of
    any private interpretation” (2 Pet. 1:20). The Apostles clarified what was written
    of Christ “in the law of Moses, and in the prophets, and in the psalms” only when
    He “opened their understanding, that they might understand the Scriptures” (Luke
    24:44–45). “The word of God is living and active, and sharper than any two-edged
    sword” (Heb. 4:12), that is, some, under the guidance of the Church, find in it
    the way to salvation, while others through arbitrary interpretations stumble,
    fall into heresies and perish. The Orthodox Church has preserved the explanation
    of Holy Scripture from the apostolic days through her fathers and teachers, who
    interpreted the word of God according to the teaching of the holy apostles. When
    false teachers appeared, the Church, in the persons of her pastors and teachers
    at the councils, refuted the distortions of the God-revealed truths by heretics
    on the basis of Holy Tradition and thus witnessed to the one true Orthodox faith
    handed down from the Lord through the apostles. “I shall not hesitate to say and
    shall always say,” writes the venerable Vincent of Lérins († 450), “that the universal
    Church, stirred by every kind of novelty from heretics, by the definitions of
    her councils did nothing else but only this: that what she had received before
    from the forefathers by one tradition she confirmed afterwards for posterity with
    her own written attestation, comprising in a few lines a great multitude of subjects
    and expressing, usually, for a clearer understanding, by this or that new name
    the not-new sense of the faith.” Holy Tradition is necessary, thirdly, for the
    correct performance of the sacraments and for the keeping of the sacred rites
    in the purity of their original institution. The Church of Christ by the time
    of the appearance of the New Testament Holy Scripture already had her structure
    in finished form; wherefore the apostles, who left their writings, had no task
    to present in them all the Christian institutions in full. Their writings appeared
    on occasion of various accidental circumstances, were short, and in them are not
    indicated the order of the services, the performance of the sacraments, the content
    of the prayers and hymns, the rules of church order. Thus in Holy Scripture is
    written the Lord’s command about Holy Baptism (Matt. 28:19); but how to perform
    it, what prayers are appointed, is not shown in the Scripture. Likewise the order
    of Holy Communion is not indicated; it is not said how to bless, to give thanks.
    These instructions and indications were given by the apostles orally, shown by
    deed itself (1 Cor. 11:34; Phil. 4:9) and preserved in the Church by tradition,
    through “faithful men” (2 Tim. 2:2).</p></blockquote><p>(The Orthodox Church and
    the Sectarians)</p><h2>Answers to criticism</h2><p>Quotes of St John Chrysostom:
