    body: |-
      <h2>Angels Are Bodiless Spirits</h2><blockquote><p>“But to which of the <strong><mark>angels</mark></strong> has He ever said: ‘Sit at My right hand, till I make Your enemies Your footstool’? <strong>Are <mark>they</mark> not <mark>all</mark> ministering <mark>spirits</mark></strong> sent forth to minister for those who will inherit salvation?” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13-14">Heb. 1:13-14</a>)</p></blockquote><blockquote><p>“Behold My hands and My feet, that it is I Myself. Handle Me and see, for <strong><mark>a spirit does not have flesh and bones</mark></strong> as you see I have” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L39">Luke. 24:39</a>)</p></blockquote><h2>Angels Are Sent to Minister to Those Being Saved</h2><blockquote><p>“But to which of the <strong><mark>angels</mark></strong> has He ever said: ‘Sit at My right hand, till I make Your enemies Your footstool’? Are they not all <strong><mark>ministering spirits sent forth to minister for those who will inherit salvation</mark></strong>?” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13-14">Heb. 1:13-14</a>)</p></blockquote><h2>Angels with Those Who Fear God</h2><blockquote><p>“<strong><mark>The angel of the LORD</mark> encamps all around those who fear Him, and <mark>delivers them</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/34/#L7">Ps. 34:7</a>)</p></blockquote><blockquote><p>“<strong>He who dwells in the secret place of the Most High</strong> shall abide under the shadow of the Almighty. I will say of the LORD, ‘He is my refuge and my fortress; my God, in Him I will trust.’ Surely He shall deliver you from the snare of the fowler and from the perilous pestilence. &lt;...&gt; Because <strong>you have made the LORD, who is my refuge, even the Most High, your dwelling place, no evil shall befall you</strong>, nor shall any plague come near your dwelling; <strong><mark>for He shall give His angels charge over you, to keep you</mark></strong> in all your ways” (<a href="https://bibleox.com/en/eng-nkjv/ps/91/#L1-3,9-11">Ps. 91:1-3,9-11</a>)</p></blockquote><h2>The Angels of Believers</h2><blockquote><p>“Take heed that you do not despise one of these little ones, for I say to you that in heaven <strong><mark>their angels</mark></strong> always see the face of My Father who is in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L10">Matt. 18:10</a>)</p></blockquote><h2>Angels Lead the Souls of the Righteous in the Afterlife</h2><blockquote><p>“So it was that the beggar died, and <strong><mark>was carried by the angels</mark></strong> to Abraham’s bosom. The rich man also died and was buried” (<a href="https://bibleox.com/en/eng-nkjv/lk/16/#L22">Luke. 16:22</a>)</p></blockquote><h2>The Faith of the Old Testament Righteous and of Christians in Angels</h2><blockquote><p>“Then, if there should be for one of them <strong>an angel, a mediator</strong>, one of a thousand, <strong>one who declares a person upright</strong>, and he is gracious to that person, and says, ‘<strong>Deliver him from going down into the Pit</strong>; I have found a ransom’” (<a href="https://bibleox.com/en/en-nrsv/iov/33/#L23-24">Job. 33:23-24</a>)</p></blockquote><blockquote><p>“When she recognized Peter’s voice, because of her gladness she did not open the gate, but ran in and announced that Peter stood before the gate. But they said to her, ‘You are beside yourself!’ Yet she kept insisting that it was so. So they said, ‘<strong>It is his angel</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/12/#L14-15">Act. 12:14-15</a>)</p></blockquote><h2>The Angels of the Lord and God Jesus Christ (as Man)</h2><h3>Jesus Christ, as Man, Was Strengthened by His Guardian Angel</h3><blockquote><p>“<strong>Then an angel appeared to Him from heaven, strengthening Him</strong>. And being in agony, He prayed more earnestly. Then His sweat became like great drops of blood falling down to the ground” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L43-44">Luke. 22:43-44</a>)</p></blockquote><h3>Christ’s Two Guardian Angels Bear Witness to Him</h3><h4>Two Angels at Once</h4><blockquote><p>“But Mary stood outside by the tomb weeping, and as she wept she stooped down and looked into the tomb. And she saw <strong>two angels in white sitting, one at the head and the other at the feet</strong>, where the body of Jesus had lain” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L11-12">John. 20:11-12</a>)</p></blockquote><blockquote><p>“Then they went in and did not find the body of the Lord Jesus. And it happened, as they were greatly perplexed about this, that behold, <strong>two men stood by them in shining garments</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L3-4">Luke. 24:3-4</a>)</p></blockquote><blockquote><p>“And while they looked steadfastly toward heaven as He went up, behold, <strong>two men stood by them in white apparel</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L10">Act. 1:10</a>)</p></blockquote><h4>One Angel Outside the Tomb</h4><blockquote><p>“And behold, there was a great earthquake; for <strong>an angel</strong> of the Lord descended from heaven, and came and <strong>rolled back the stone from the door, and sat on it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L2">Matt. 28:2</a>)</p></blockquote><h4>One Angel Inside the Tomb</h4><blockquote><p>“And <strong>entering the tomb, they saw a young man clothed in a long white robe</strong> sitting on the right side; and they were alarmed” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L5">Mark. 16:5</a>)</p></blockquote><h2>An Angel Frees the Apostle</h2><blockquote><p>“Now behold, <strong>an angel of the Lord stood by him, and a light shone in the prison; and he struck Peter on the side and raised him up, saying, ‘Arise quickly!’</strong> And his chains fell off his hands. Then the angel said to him, ‘Gird yourself and tie on your sandals’; and so he did. And he said to him, ‘Put on your garment and follow me.’ So he went out and followed him, and did not know that what was done by the angel was real, but thought he was seeing a vision. When they were past the first and the second guard posts, they came to the iron gate that leads to the city, which opened to them of its own accord; and they went out and went down one street, and immediately the angel departed from him. And when Peter had come to himself, he said, ‘Now I know for certain that the Lord has sent His angel, and has delivered me from the hand of Herod and from all the expectation of the Jewish people.’ So, when he had considered this, he came to the house of Mary, the mother of John whose surname was Mark, where many were gathered together praying. And as Peter knocked at the door of the gate, a girl named Rhoda came to answer. When she recognized Peter’s voice, because of her gladness she did not open the gate, but ran in and announced that Peter stood before the gate. But they said to her, ‘You are beside yourself!’ Yet she kept insisting that it was so. So they said, ‘<strong>It is his angel</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/12/#L7-15">Act. 12:7-15</a>)</p></blockquote>

  - src: диавол
    path: Dv1l_The_Devil
    title: The Devil (Satan)
    meta_desc: Satan is the adversary of God, a person, an angel (spirit) who of his own will fell away from serving God
    menu: { parent: Angels/Fallen, title: The Devil (Satan), priority: 1 }
    body: |-
      <h2>The Devil (Satan) Is a Fallen Angel</h2><p>The devil is one of the multitude of angels created by God, but who afterwards did not wish to serve God, that is, fell away from God, fell:</p><blockquote><p>“You were the seal of perfection, full of wisdom and perfect in beauty. You were in Eden, the garden of God; every precious stone was your covering: the sardius, topaz, and diamond, beryl, onyx, and jasper, sapphire, turquoise, and emerald with gold. The workmanship of your timbrels and pipes was prepared for you on the day you were created. <strong>You were the anointed cherub who covers; I established you; you were on the holy mountain of God; you walked back and forth in the midst of fiery stones. You were perfect in your ways from the day you were created, till iniquity was found in you</strong>. By the abundance of your trading you became filled with violence within, and <strong>you sinned; therefore I cast you as a profane thing out of the mountain of God</strong>; and I destroyed you, O covering cherub, from the midst of the fiery stones. <strong>Your heart was lifted up because of your beauty</strong>; you corrupted your wisdom for the sake of your splendor; <strong>I cast you to the ground</strong>, I laid you before kings, that they might gaze at you. You defiled your sanctuaries by the multitude of your iniquities, by the iniquity of your trading; <strong>therefore I brought fire from your midst; it devoured you</strong>, and I turned you to ashes upon the earth in the sight of all who saw you. All who knew you among the peoples are astonished at you; you have become a horror, and shall be no more forever” (<a href="https://bibleox.com/en/eng-nkjv/iez/28/#L12-19">Ezek. 28:12-19</a>)</p></blockquote><p>Such angels who have fallen away from God are called by various words: demon (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L31">Matt. 8:31</a>; <a href="https://bibleox.com/en/en-nrsv/tov/6/#L8">Tob. 6:8</a>), messenger (angel) of Satan (<a href="https://bibleox.com/en/eng-nkjv/2kor/12/#L7">2 Cor. 12:7</a>), unclean spirit (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L1">Matt. 10:1</a>), devil (in popular speech). Satan is also called the serpent (<a href="https://bibleox.com/en/eng-nkjv/gen/3/#L1">Gen. 3:1</a>; <a href="https://bibleox.com/en/eng-nkjv/is/27/#L1">Is. 27:1</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/12/#L9">Rev. 12:9</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L2">20:2</a>), the dragon (<a href="https://bibleox.com/en/eng-nkjv/otkr/12/#L9">Rev. 12:9</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L2">20:2</a>), Lucifer, son of the morning (<a href="https://bibleox.com/en/eng-nkjv/is/14/#L12">Is. 14:12</a>), Leviathan (<a href="https://bibleox.com/en/eng-nkjv/is/27/#L1">Is. 27:1</a>), the ruler of this world (<a href="https://bibleox.com/en/eng-nkjv/in/12/#L31">John. 12:31</a>), the wicked one (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L19">Matt. 13:19</a>), a lying spirit (<a href="https://bibleox.com/en/eng-nkjv/3ts/22/#L22">1 Kin. 22:22</a>). The devil is not an impersonal feeling, not an abstract impulse in man, not an allegory. He is a real being, a person. The devil is the first being that sinned:</p><blockquote><p>“He who sins is of the devil, for <strong>the devil has sinned from the beginning</strong>. For this purpose the Son of God was manifested, that He might destroy the works of the devil” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L8">1 John. 3:8</a>)</p></blockquote><h2>The Devil Has His Own Will</h2><blockquote><p>“and that they may come to their senses and escape the snare of the devil, having been taken captive by him <strong>to do his will</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L26">2 Tim. 2:26</a>)</p></blockquote><h2>The Devil Acts by Suggesting Evil Thoughts to a Person</h2><blockquote><p>“But Peter said, ‘Ananias, <strong>why has Satan filled your heart to lie</strong> to the Holy Spirit and keep back part of the price of the land for yourself?’” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L3">Act. 5:3</a>)</p></blockquote><blockquote><p>“And supper being ended, <strong>the devil having already put it into the heart of Judas Iscariot, Simon’s son, to betray Him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/13/#L2">John. 13:2</a>)</p></blockquote><h2>Satan Fell from Heaven</h2><blockquote><p>“I saw <strong>Satan fall</strong> like lightning <strong>from heaven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L18">Luke. 10:18</a>; <a href="https://bibleox.com/en/eng-nkjv/iez/28/#L12-19">Ezek. 28:12-19</a>)</p></blockquote><h2>He Drew Other Angels After Him</h2><blockquote><p>“For if <strong>God did not spare the angels who sinned</strong>, but cast them down to hell and delivered them into chains of darkness, to be reserved for judgment” (<a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L4">2 Pet. 2:4</a>)</p></blockquote><h2>Because of the Devil, Death Came into the World</h2><blockquote><p>“but <strong>through the devil’s envy death entered the world</strong>, and those who belong to his company experience it” (<a href="https://bibleox.com/en/en-nrsv/prs/2/#L24">Wis. 2:24</a>)</p></blockquote><h2>The Devil Is the Adversary of People. He Seeks Whom to Draw After Him into Perdition</h2><blockquote><p>“Be sober, be vigilant; because <strong>your adversary the devil</strong> walks about like a roaring lion, <strong>seeking whom he may devour</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L8">1 Pet. 5:8</a>)</p></blockquote><h2>The Devil Is the Adversary of Human Salvation</h2><blockquote><p>“Now the parable is this: The seed is the word of God. Those by the wayside are the ones who hear; then <strong>the devil comes and takes away the word out of their hearts</strong>, <strong>lest they should believe and be saved</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/8/#L11-12">Luke. 8:11-12</a>)</p></blockquote><blockquote><p>“Then he showed me Joshua the high priest standing before the Angel of the LORD, and <strong>Satan standing at his right hand to oppose him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/zah/3/#L1">Zech. 3:1</a>)</p></blockquote><h2>The Devil Disguises Himself as an Angel of God</h2><blockquote><p>“And no wonder! For <strong>Satan himself transforms himself into an angel of light</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L14">2 Cor. 11:14</a>)</p></blockquote><h2>The Devil Flees from Those Who Submit to God and Turn Away from the Devil</h2><blockquote><p>“Therefore <strong>submit to God. Resist the devil and he will flee from you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/4/#L7">James. 4:7</a>)</p></blockquote><h2>The Devil Knows Holy Scripture and Tempts with It, Distorting Its Meaning</h2><blockquote><p>“and said to Him, ‘If You are the Son of God, <strong>throw Yourself down from here. For it is written</strong>: “He shall give His angels charge over you, to keep you,” and, “In their hands they shall bear you up, lest you dash your foot against a stone.”’ And Jesus answered and said to him, ‘It has been said, “You shall not tempt the LORD your God”’” (<a href="https://bibleox.com/en/eng-nkjv/lk/4/#L9-12">Luke. 4:9-12</a>)</p></blockquote><h2>The Devil Is the Father of Lies</h2><blockquote><p>“He was a murderer from the beginning, and does not stand in the truth, because <strong>there is no truth in him</strong>. When he speaks a lie, he speaks from his own resources, for <strong>he is a liar and the father of it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/8/#L44">John. 8:44</a>)</p></blockquote><h2>The Devil Is Able to Work Wonders, to Bring Down Fire from Heaven</h2><blockquote><p>“And <strong>the LORD said to Satan, ‘Behold,</strong> <strong>all that he has is in your power</strong>; only do not lay a hand on his person.’ So Satan went out from the presence of the LORD. &lt;...&gt; another also came and said, ‘<strong>The fire of God fell from heaven and burned up the sheep and the servants, and consumed them</strong>; and I alone have escaped to tell you!’” (<a href="https://bibleox.com/en/eng-nkjv/iov/1/#L12,16">Job. 1:12,16</a>)</p></blockquote><blockquote><p>“The coming of the lawless one is <strong>according to the working of Satan, with all power, signs, and lying wonders</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L9">2 Thess. 2:9</a>)</p></blockquote><h2>The Devil Disputes with the Angels of God</h2><blockquote><p>“Yet Michael the archangel, in contending with the devil, when he disputed about the body of Moses, dared not bring against him a reviling accusation, but said, ‘The Lord rebuke you!’” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L9">Jude. 1:9</a>)</p></blockquote><h2>A Place of Eternal Torment Has Been Prepared for the Fallen Angels</h2><blockquote><p>“Then He will also say to those on the left hand, ‘Depart from Me, you cursed, into <strong>the everlasting fire prepared for the devil and his angels</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L41">Matt. 25:41</a>).</p></blockquote><blockquote><p>“<strong>The devil</strong>, who deceived them, <strong>was cast into the lake of fire and brimstone</strong> where the beast and the false prophet are. And they will be tormented day and night forever and ever” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L10">Rev. 20:10</a>)</p></blockquote><h3>The Demons Know This</h3><blockquote><p>“And suddenly they cried out, saying, ‘What have we to do with You, Jesus, You Son of God? Have You come here <strong>to torment us before the time</strong>?’” (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L29">Matt. 8:29</a>)</p></blockquote><h2>The Demons Do Not Seek God’s Will Freely (Voluntarily), but Cannot Disobey God’s Command</h2><blockquote><p>“Then they were all amazed, so that they questioned among themselves, saying, ‘What is this? What new doctrine is this? <strong>For with authority He commands even the unclean spirits, and they obey Him</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mk/1/#L27">Mark. 1:27</a>)</p></blockquote><blockquote><p>“So the demons begged Him, saying, ‘<strong>If You cast us out</strong>, permit us to go away into the herd of swine’” (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L31">Matt. 8:31</a>)</p></blockquote>
