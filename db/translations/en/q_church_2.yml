# Переводы статей раздела «Цитаты» (ru/q) на английский: раздел «Церковь» (статьи верхнего уровня), часть 2.
# Загрузка: bin/rails pages:import_translations FILE=db/translations/en/q_church_2.yml [PUBLISH=1] [DRY_RUN=1]
lang: en
