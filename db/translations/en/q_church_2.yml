    body: |-
      <p>The apostles and bishops are equal among themselves. The apostles often argued about which of them was the greatest. Christ told them not to seek power over one another:</p><blockquote><p>“<strong>Then a dispute arose among them</strong> [the apostles] <strong>as to which of them would be greatest</strong>. &lt;...&gt; and said to them, ‘&lt;...&gt; For he who is least among you all will be great’” (<a href="https://bibleox.com/en/eng-nkjv/lk/9/#L46,48">Luke. 9:46,48</a>)</p></blockquote><blockquote><p>“<strong>Now there was also a dispute among them</strong> [the apostles]<strong>, as to which of them should be considered the greatest</strong>. And He said to them, ‘The kings of the Gentiles exercise lordship over them, and those who exercise authority over them are called “benefactors.” <strong>But not so among you; on the contrary, he who is greatest among you, let him be as the younger</strong>, and he who governs as he who serves’” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L24-26">Luke. 22:24-26</a>)</p></blockquote><blockquote><p>“But they [the apostles] kept silent, for <strong>on the road they had disputed among themselves who would be the greatest</strong>. And He sat down, called the twelve, and said to them, ‘<strong>If anyone desires to be first, he shall be last of all and servant of all</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L34-35">Mark. 9:34-35</a>)</p></blockquote><p>When the apostles James and John asked Christ to sit at His right and at His left in His Kingdom, the other apostles were indignant at this. Christ told all of them not to seek power over one another:</p><blockquote><p>“But Jesus called them to Himself and said, ‘You know that the rulers of the Gentiles lord it over them, and those who are great exercise authority over them. <strong>Yet it shall not be so among you</strong>; but whoever desires to become great among you, let him be your servant. And whoever desires to be first among you, let him be your slave’” (<a href="https://bibleox.com/en/eng-nkjv/mf/20/#L25-27">Matt. 20:25-27</a>)</p></blockquote><p>Likewise here: <a href="https://bibleox.com/en/eng-nkjv/mk/10/#L41-44">Mark. 10:41-44</a>. The Roman Church, which fell away from all the other Orthodox Churches, refers to a special authority of the apostle Peter:</p><blockquote><p>“And I will give you [Peter] the keys of the kingdom of heaven, and <strong>whatever you bind on earth will be bound in heaven</strong>, and whatever you loose on earth will be loosed in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L19">Matt. 16:19</a>)</p></blockquote><p>But this authority is given to all the apostles:</p><blockquote><p>“Assuredly, I say to you [the apostles], <strong>whatever you bind on earth will be bound in heaven</strong>, and whatever you loose on earth will be loosed in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L18">Matt. 18:18</a>)</p></blockquote><blockquote><p>“And when He had said this, He breathed on them [the apostles], and said to them, ‘Receive the Holy Spirit. <strong>If you forgive the sins of any, they are forgiven them</strong>; if you retain the sins of any, they are retained’” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L22-23">John. 20:22-23</a>)</p></blockquote><p>It is telling that it was precisely the apostle Peter whose feet the Lord washed (and then those of the others), setting an example and warning against love of power:</p><blockquote><p>“If I then, your Lord and Teacher, have washed your feet, you also ought to wash one another’s feet. For <strong>I have given you an example, that you should do as I have done to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/13/#L14-15">John. 13:14-15</a>)</p></blockquote><p>Later, the apostle Paul rebukes the apostle Peter in an assembly (<a href="https://bibleox.com/en/eng-nkjv/gal/2/#L11">Gal. 2:11</a>), and at the first apostolic council in Jerusalem the apostle James presides (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L13,19">Act. 15:13,19</a>), while the apostle Peter himself appointed bishops not only in Rome, but also, for example, in Antioch.</p><p>The disciples of the apostles write that the bishops are the successors of the apostles. Everything that pertains to the apostles pertains also to the bishops. Quotes from the disciples of the apostles and the ancient Christians about this: <a href="https://bibleox.com/ru/ru/w/qeuY_%D0%95%D0%BF%D0%B8%D1%81%D0%BA%D0%BE%D0%BF%D1%8B__%D0%BF%D1%80%D0%B5%D0%B5%D0%BC%D0%BD%D0%B8%D0%BA%D0%B8_%D0%B0%D0%BF%D0%BE%D1%81%D1%82%D0%BE%D0%BB%D0%BE%D0%B2">https://bibleox.com/ru/ru/w/qeuY_Епископы__преемники_апостолов</a></p>

