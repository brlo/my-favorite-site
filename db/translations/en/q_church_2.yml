  - src: Церковь-видимое-единство
    path: Vu3d_The_Church_a_Visible_Unity
    title: The Church — a Visible Unity
    meta_desc: '“Yet none of the rest dared join them, but the people esteemed them highly” (Acts 5:13)'
    menu: { parent: Church, title: The Church — a Visible Unity, priority: 3 }
    body: |-
      <h2>Preface</h2><p>First of all, it is important to note that in the Bible there is not a single example and not a single basis for creating one’s own churches and proclaiming oneself their pastor. Christ created one visible Church and expressed His will for its unity.</p><h2>The Will of Christ and the Apostles for the Visible Unity of the Church</h2><blockquote><p>“I do not <strong><mark>pray</mark></strong> for these alone, but also for those who will believe in Me through their word; <strong><mark>that they all may be one</mark></strong>, as You, Father, are in Me, and I in You; that they also <strong>may be one in Us, <mark>that the world may believe that You sent</mark> Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>)</p></blockquote><blockquote><p>“Now I <strong><mark>plead</mark></strong> with you, brethren, by the name of our Lord Jesus Christ, <strong><mark>that you all speak the same thing</mark></strong>, <strong><mark>and that there be no divisions among you</mark></strong>, but that you <strong>be perfectly joined together <mark>in the same mind</mark> and <mark>in the same judgment</mark></strong>. For it has been declared to me concerning you, my brethren, by those of Chloe’s household, that <strong>there are contentions among you. Now I say this, that each of you says, ‘I am of Paul,’ or ‘I am of Apollos,’ or ‘I am of Cephas,’ or ‘I am of Christ.’ Is Christ divided?</strong> Was Paul crucified for you? Or were you baptized in the name of Paul?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10-13">1 Cor. 1:10-13</a>) “For when one says, ‘I am of Paul,’ and another, ‘I am of Apollos,’ <strong>are you not carnal?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L4">1 Cor. 3:4</a>)</p></blockquote><p>God arranged the members of the body (the Church) so that there would be no divisions, but that all would care for one another, suffer together and rejoice together:</p><blockquote><p>“For <strong>by one Spirit we were all baptized into one body</strong> — whether Jews or Greeks, whether slaves or free — and have all been made to drink into one Spirit. <strong>For in fact the body is not one member but many</strong>. &lt;...&gt; <strong><mark>And the eye cannot say to the hand, ‘I have no need of you’; nor again the head to the feet, ‘I have no need of you’</mark></strong>. No, much rather, those members of the body which seem to be weaker are necessary. And those members of the body which we think to be less honorable, on these we bestow greater honor; and our unpresentable parts have greater modesty, but our presentable parts have no need. But <strong><mark>God composed the body</mark></strong>, having given greater honor to that part which lacks it, <strong><mark>that there should be no schism in the body</mark></strong>, but that the members should have the same care for one another. And <strong>if one member suffers, all the members suffer with it; or if one member is honored, all the members rejoice with it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L13-14,21-26">1 Cor. 12:13-14,21-26</a>)</p></blockquote><p>What are these different members of the body? The different ministries and gifts in the Church:</p><blockquote><p>“For as <strong>the body is one and has many members, but all the members of that one body</strong>, being many, are one body, so also is Christ. &lt;...&gt; <strong>For in fact the body is not one member but many</strong>. &lt;...&gt; <strong>Now you are the body of Christ, and members individually</strong>. And <strong>God has appointed these in the church</strong>: first <strong>apostles</strong>, second <strong>prophets</strong>, third <strong>teachers</strong>, after that <strong>miracles</strong>, then <strong>gifts</strong> of healings, helps, administrations, varieties of tongues. <strong>Are all apostles? Are all prophets? Are all teachers? Are all workers of miracles? Do all have gifts</strong> of healings? <strong>Do all speak</strong> with tongues? <strong>Do all interpret?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L12,14,27-30">1 Cor. 12:12,14,27-30</a>)</p></blockquote><p>Thus God arranged all these ministries and gifts so that there would be no divisions in the body, which the apostle prevents at the beginning of the epistle (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10-13">1 Cor. 1:10-13</a>). That is, God not only wants unity (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John. 17:20-21</a>), but also takes care of it. Here the apostle, appointed to the ministry by God, takes care of visible unity and forbids the Corinthians to create visible divisions.</p><p>Since unity is the will of Christ, it is important to understand that the one who will be saved is the one who does the will of God (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L21">Matt. 7:21</a>).</p><h2>Antichrists Violate the Will of Christ and Openly Go Out of the Boundaries of the Church</h2><p>Antichrists go out of the apostolic communities:</p><blockquote><p>“Little children, it is the last hour; and as you have heard that the Antichrist is coming, <strong>even now <mark>many antichrists have come</mark></strong>, by which we know that it is the last hour. <strong><mark>They went out from us, but they were not of us; for if they had been of us, they would have continued with us</mark></strong>; but they went out that they might be made manifest, that none of them were of us” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18-19">1 John. 2:18-19</a>)</p></blockquote><p>They serve <u>not</u> Christ:</p><blockquote><p>“Now I urge you, brethren, <strong><mark>note those who cause divisions</mark> and offenses</strong>, contrary to the doctrine which you learned, and avoid them. For <strong><mark>those who are such do not serve our Lord Jesus Christ</mark></strong>, but their own belly, and by smooth words and flattering speech deceive the hearts of the simple” (<a href="https://bibleox.com/en/eng-nkjv/rim/16/#L17-18">Rom. 16:17-18</a>)</p></blockquote><h2>The Original Visible Unity of the Church</h2><h3>Outsiders Are Separate</h3><p>From the very beginning the Church had quite definite visible boundaries:</p><blockquote><p>“Yet none of <strong>the rest</strong> dared join them, but the people esteemed them highly” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L13">Act. 5:13</a>)</p></blockquote><h3>Common Goods</h3><p>The Church was a monolithic society:</p><blockquote><p>“Now the multitude of those who believed were of <strong>one heart and one soul</strong>; neither did anyone say that any of the things he possessed was his own, but <strong>they had all things in common</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L32">Act. 4:32</a>)</p></blockquote><h3>Common Resolution of Disputed Questions</h3><p>The Church has common problems and resolves them together, gathering at quite definite, visible councils:</p><blockquote><p>“Now <strong>the apostles and elders came together</strong> to consider this matter. &lt;...&gt; Then <strong>it pleased the apostles and elders, with the whole church</strong>, to send chosen men of their own company to Antioch with Paul and Barnabas, namely, Judas who was also named Barsabas, and Silas, leading men among the brethren” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L6,22">Act. 15:6,22</a>)</p></blockquote><h3>Common Rules</h3><p>The Church has definite rules, common to all:</p><blockquote><p>“And as they went <strong>through the cities</strong>, they <strong>delivered to them the decrees to keep, which were determined by the apostles and elders</strong> at Jerusalem. So the churches were strengthened in the faith, and increased in number daily” (<a href="https://bibleox.com/en/eng-nkjv/act/16/#L4-5">Act. 16:4-5</a>)</p></blockquote><h3>Prohibition of Dividing into Parties</h3><p>In the Church any attempts to divide are stopped:</p><blockquote><p>“Now I <strong><mark>plead</mark></strong> with you, brethren, by the name of our Lord Jesus Christ, <strong><mark>that you all speak the same thing</mark></strong>, <strong><mark>and that there be no divisions among you</mark></strong>, but that you <strong>be perfectly joined together <mark>in the same mind</mark> and <mark>in the same judgment</mark></strong>. For it has been declared to me concerning you, my brethren, by those of Chloe’s household, that <strong>there are contentions among you. Now I say this, that each of you says, ‘I am of Paul,’ or ‘I am of Apollos,’ or ‘I am of Cephas,’ or ‘I am of Christ.’ Is Christ divided?</strong> Was Paul crucified for you? Or were you baptized in the name of Paul?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10-13">1 Cor. 1:10-13</a>) “For when one says, ‘I am of Paul,’ and another, ‘I am of Apollos,’ <strong>are you not carnal?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L4">1 Cor. 3:4</a>)</p></blockquote><h3>One Faith and the Sacraments</h3><p>In the Church there is exactly one definite faith, common to all:</p><blockquote><p>“one Lord, <strong>one faith</strong>, one baptism” (<a href="https://bibleox.com/en/eng-nkjv/ef/4/#L5">Eph. 4:5</a>)</p></blockquote><blockquote><p>“Whoever <strong>transgresses and does not abide in the doctrine of Christ does not have God</strong>. He who abides in the doctrine of Christ has both the Father and the Son” (<a href="https://bibleox.com/en/eng-nkjv/2in/1/#L9">2 John. 1:9</a>)</p></blockquote><p>As the Savior says, the faith is according to the word of the apostles:</p><blockquote><p>“I do not pray for these alone, but also for those who will <strong>believe</strong> in Me <strong>through their word</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20">John. 17:20</a>)</p></blockquote><p>The Church knew that in the future there would appear people who would want to separate from the one faith. These people are not called the Church:</p><blockquote><p>“how they [the apostles] told you that there would be mockers in the last time who would walk according to their own ungodly lusts. These are sensual persons, <strong>who cause divisions</strong> <em>(Greek: ἀποδιορίζοντες — “those who separate”, i.e. who separate themselves from the unity of the faith)</em>, not having the Spirit” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L18-19">Jude. 1:18-19</a>)</p></blockquote><h3>One Priestly Hierarchy</h3><blockquote><p>“he sent to Ephesus and called for the elders of the church. And when they had come to him, he said to them: &lt;...&gt; take heed to yourselves and to all the flock, among which <strong>the Holy Spirit has made you overseers</strong> <em>(Greek: ἐπισκόπους — “bishops”)</em>, <strong>to shepherd the church of God</strong> which He purchased with His own blood” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L17-18,28">Act. 20:17-18,28</a>)</p></blockquote><p>More about the <a href="https://bibleox.com/ru/ru/w/%D0%A2%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%BE-%D0%A1%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">priesthood</a>.</p><hr><p>Thus the Church is a quite definite visible society (organism), with exactly one common apostolic faith, with rules common to all, under leaders appointed by the apostles who are united in everything, and whose members have no barriers between them.</p><h2>The Boundaries of the Church and the Eucharist</h2><p>The Old Testament church was not called the Body of Christ, unlike the New Testament one. The New Testament Church is a mystical divine-human organism, <a href="https://bibleox.com/en/en/w/Cw7a_The_Church/">the Body of Christ</a>. Therefore the boundaries of the Church are where the boundaries of the body are. Where are the boundaries of the human body? Where the blood circulates, there is the body. Where it does not circulate, there is no body. Without blood there is no life in the parts of a person. A severed hand is no longer part of the body. Rather soon, without blood, it will decay, receiving no flow of blood. Where there is true communion, there is the Body, that is, the Church:</p><blockquote><p>“The cup of blessing which we bless, is it not <strong>the communion of the blood of Christ</strong>? The bread which we break, is it not <strong>the communion of the body of Christ</strong>? For we, though many, <strong>are one bread and one body; for we all partake of that one bread</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L16-17">1 Cor. 10:16-17</a>)</p></blockquote><blockquote><p>“Now <strong>you are the body of Christ</strong>, and members individually” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L27">1 Cor. 12:27</a>)</p></blockquote><blockquote><p>“But now in Christ Jesus you who once were far off <strong>have been brought near by the blood of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L13">Eph. 2:13</a>)</p></blockquote><p>That is why people are saved only in the Church: because Christ is the Savior of <a href="https://bibleox.com/en/en/w/Cw7a_The_Church/">the Body, that is, the Church</a>:</p><blockquote><p>“For the husband is head of the wife, as also Christ is <strong>head of the church</strong>; and He is <strong>the Savior of the body</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L23">Eph. 5:23</a>)</p></blockquote><p>More about the <a href="https://bibleox.com/en/en/w/Eucharist/">Eucharist</a>.</p><h3>Hieromartyr Ignatius, Bishop of Antioch (1st century), <a href="https://bibleox.com/en/en/w/IgnAn_Sm/">Epistle to the Smyrnaeans</a>:</h3><blockquote><p>“Chapter 8. … Let no man do anything connected with the Church without the bishop. <strong>Let that be deemed a proper Eucharist, which is [administered] either by the bishop, or by one to whom he has entrusted it</strong>”</p></blockquote>

  - src: церковь-епископы-равны
    path: Be6q_The_Church_Bishops_Are_Equal
    title: The Church — Bishops Are Equal
    meta_desc: Bible quotes about the equality of bishops
