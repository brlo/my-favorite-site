      <h2>Christ Is the Root of the Church</h2><blockquote><p>“As you therefore have received <strong><mark>Christ Jesus</mark></strong> the Lord, so walk in Him, <strong><mark>rooted</mark></strong> (ἐρριζωμένοι) and built up <strong><mark>in Him</mark></strong> and established in the faith, as you have been taught, abounding in it with thanksgiving” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L6-7">Col. 2:6-7</a>)</p></blockquote><blockquote><p>“<strong><mark>I, Jesus</mark></strong>, have sent My angel to testify to you these things in the churches. <strong><mark>I am the Root</mark></strong> (ῥίζα) and the Offspring of David, the Bright and Morning Star” (<a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L16">Rev. 22:16</a>)</p></blockquote><h3>Christ Is Also the Vine That Nourishes the Branches</h3><blockquote><p>“<strong><mark>I am the true vine</mark></strong>, and My Father is the vinedresser. Every branch in Me that does not bear fruit He takes away; and every branch that bears fruit He prunes, that it may bear more fruit. You are already clean because of the word which I have spoken to you. <strong>Abide in Me</strong>, and I in you. As the branch cannot bear fruit of itself, unless it abides in the vine, neither can you, unless you abide in Me. <strong><mark>I am the vine, you are the branches</mark></strong>. He who abides in Me, and I in him, bears much fruit; for without Me you can do nothing. <strong>If anyone does not abide in Me, he is cast out as a branch and is withered</strong>; and they gather them and throw them into the fire, and they are burned” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L1-6">John. 15:1-6</a>)</p></blockquote><h3>Christ Is Also the Head of the Church</h3><blockquote><p>“And <strong>He is the <mark>head</mark> of the body, the church</strong>, who is the beginning, the firstborn from the dead, that in all things He may have the preeminence” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L18">Col. 1:18</a>)</p></blockquote><blockquote><p>“And He put all things under His feet, and gave Him to be <strong><mark>head</mark></strong> over all things to <strong>the church</strong>, which is <strong>His body</strong>, the fullness of Him who fills all in all” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L22-23">Eph. 1:22-23</a>)</p></blockquote><blockquote><p>“and not holding fast to <strong>the <mark>Head</mark>, from whom all the body</strong>, nourished and knit together by joints and ligaments, grows with the increase that is from God” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L19">Col. 2:19</a>)</p></blockquote><h2>Part of Israel (the Branches) Fell Away from Christ (the Root)</h2><p>Part of Israel fell away, and the pagan nations were grafted into the root (into Christ). The Jews who were cut off are called not a cut-off part of the root, but cut-off branches:</p><blockquote><p>“For if the firstfruit is holy, the lump is also holy; and if the root is holy, so are the branches. And if <strong><mark>some of the branches were broken off</mark></strong>, and you, <strong>being a wild olive tree, were grafted in among them, and with them</strong> <strong><mark>became a partaker of the root</mark></strong> and fatness of the olive tree, do not boast against the branches. But if you do boast, remember that you do not support the root, but the root supports you” (<a href="https://bibleox.com/en/eng-nkjv/rim/11/#L16-18">Rom. 11:16-18</a>)</p></blockquote><blockquote><p>“But Isaiah is very bold and says: ‘<strong>I was found by those who did not seek Me</strong>; I was made manifest to those who did not ask for Me.’ <strong><u><mark>But to Israel</mark></u></strong> <strong><mark>he says: “All day long I have stretched out My hands to a disobedient and contrary people”</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/10/#L20-21">Rom. 10:20-21</a>)</p></blockquote><blockquote><p>“I say then, <strong>has God cast away His people? Certainly not! For I also am an Israelite</strong>, of the seed of Abraham, of the tribe of Benjamin. &lt;...&gt; But what does the divine response say to him? ‘<strong>I have reserved for Myself seven thousand men who have not bowed the knee to Baal.’ Even so then, at this present time</strong> <strong><mark>there is a remnant</mark></strong> according to the election of grace. &lt;...&gt; What then? Israel has not obtained what it seeks; <strong><mark>but the elect have obtained it, and the rest were blinded</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/11/#L1,4-5,7">Rom. 11:1,4-5,7</a>)</p></blockquote><h2>In Place of the Fallen Branches (Part of Israel) a New Branch (All Other Nations) Is Grafted into the Root</h2><blockquote><p>“But Jeshurun grew fat and kicked; you grew fat, you grew thick, you are obese! Then <strong>he forsook God</strong> who made him, and scornfully esteemed the Rock of his salvation. They provoked Him to jealousy with foreign gods; with abominations they provoked Him to anger. They sacrificed to demons, not to God, to gods they did not know, to new gods, new arrivals that your fathers did not fear. <strong>Of the Rock who begot you, you are unmindful</strong>, and have forgotten the God who fathered you. And when the LORD saw it, He spurned them, because of the provocation of His sons and His daughters. And He said: ‘<strong><mark>I will hide My face from them, I will see what their end will be</mark>, for they are a perverse generation</strong>, children in whom is no faith. They have provoked Me to jealousy by what is not God; they have moved Me to anger by their foolish idols. But <strong><mark>I will provoke them to jealousy by those who are not a nation</mark></strong>; I will move them to anger by a foolish nation’” (<a href="https://bibleox.com/en/eng-nkjv/vtor/32/#L15-21">Deut. 32:15-21</a>)</p></blockquote><blockquote><p>“<strong>Behold, the days are coming</strong>, says the LORD, when I will make <strong>a <mark>new covenant</mark></strong> with the house of Israel and with the house of Judah — <strong><mark>not according to the covenant</mark> that I made with their fathers in the day that I took them by the hand to lead them out of the land of Egypt, My covenant which <mark>they broke</mark></strong>, though I was a husband to them, says the LORD. But this is the covenant that I will make with the house of Israel after those days, says the LORD: I will put My law <strong>in their minds, and write it on their hearts; and I will be their God, and <mark>they shall be My people</mark></strong>. No more shall every man teach his neighbor, and every man his brother, saying, ‘Know the LORD,’ for they all shall know Me, from the least of them to the greatest of them, says the LORD. For I will forgive their iniquity, and their sin I will remember no more. Thus says the LORD, who gives the sun for a light by day, the ordinances of the moon and the stars for a light by night, who disturbs the sea, and its waves roar (the LORD of hosts is His name): ‘If those ordinances depart from before Me, says the LORD, then the seed of Israel shall also cease from being a nation before Me forever.’ Thus says the LORD: ‘If heaven above can be measured, and the foundations of the earth searched out beneath, I will also cast off all the seed of Israel for all that they have done, says the LORD’” (<a href="https://bibleox.com/en/eng-nkjv/ier/31/#L31-37">Jer. 31:31-37</a>)</p></blockquote><blockquote><p>“For if the firstfruit is holy, the lump is also holy; and if the root is holy, so are the branches. And if some of the branches were broken off, and <strong><mark>you, being a wild olive tree, were grafted in among them</mark></strong>, and with them <strong><mark>became a partaker of the root</mark></strong> and fatness of the olive tree, do not boast against the branches. But if you do boast, remember that you do not support the root, but the root supports you” (<a href="https://bibleox.com/en/eng-nkjv/rim/11/#L16-18">Rom. 11:16-18</a>)</p></blockquote><blockquote><p>“I was sought by those who did not ask for Me; I was found by those who did not seek Me. <strong><mark>I said, ‘Here I am, here I am,’ to a nation that was not called by My name</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/65/#L1">Is. 65:1</a>)</p></blockquote><blockquote><p>“Then I will sow her for Myself in the earth, and <strong>I will have mercy on her who had not obtained mercy</strong>; then <strong><mark>I will say to those who were not My people, ‘You are My people!’</mark></strong> And they shall say, ‘You are my God!’” (<a href="https://bibleox.com/en/eng-nkjv/os/2/#L23">Hos. 2:23</a>)</p></blockquote><blockquote><p>“even us whom He <strong><mark>called, not of the Jews only, but also of the Gentiles</mark></strong>? <strong>As He says also in Hosea: ‘<mark>I will call them My people, who were not My people, and her beloved, who was not beloved</mark>.’</strong> ‘And it shall come to pass in the place where it was said to them, “You are not My people,” there <strong><mark>they shall be called sons of the living God</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/rim/9/#L24-26">Rom. 9:24-26</a>)</p></blockquote><h2>In the Church Nationality No Longer Matters</h2><p>The apostle in <a href="https://bibleox.com/en/eng-nkjv/rim/11/#L16-18">Rom. 11:16-18</a> destroys one of the extremes: contempt for the Jews and exalting oneself over them. The other extreme is bowing down before them. The middle way is the absence of nationality in the Church, where all are brothers to one another, and all who join the Church also become brothers, regardless of nationality and of where and as whom God determined them to be born:</p><blockquote><p>“where <strong><mark>there is neither Greek nor Jew</mark></strong>, circumcised nor uncircumcised, <strong><mark>barbarian</mark></strong>, <strong><mark>Scythian</mark></strong>, <strong>slave nor free</strong>, but Christ is all and in all” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L11">Col. 3:11</a>)</p></blockquote><h2>There Is <strong><u>No</u></strong> Difference Between Jew and Gentile in the Church</h2><blockquote><p>“And when there had been much dispute, Peter rose up and said to them: ‘Men and brethren, you know that a good while ago God chose among us, that by my mouth the Gentiles should hear the word of the gospel and believe. So God, who knows the heart, acknowledged them by giving them the Holy Spirit, just as He did to us, and <strong><mark>made <u>no</u> distinction</mark> between us and them</strong>, purifying their hearts by faith’” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L7-9">Act. 15:7-9</a>)</p></blockquote><blockquote><p>“But now in Christ Jesus you who once were far off have been brought near by the blood of Christ. For He Himself is our peace, who <strong><mark>has made both one</mark></strong>, and has broken down the middle wall of separation, <strong>having abolished in His flesh the enmity</strong>, that is, the law of commandments contained in ordinances, so as <strong><mark>to create in Himself one new man from the two</mark></strong>, thus making peace, and that He might <strong><mark>reconcile them both</mark></strong> <strong>to God</strong> <strong><mark>in one body</mark></strong> through the cross, thereby putting to death the enmity. &lt;...&gt; For <strong><mark>through Him [Christ] we both have access</mark></strong> by one Spirit <strong><mark>to the Father</mark></strong>. &lt;...&gt; having been built on the foundation of the apostles and prophets, <strong>Jesus Christ Himself being the chief cornerstone</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L13-16,18,20">Eph. 2:13-16,18,20</a>)</p></blockquote><h2>The People of Israel Was Chosen for the Coming of the Savior into the World. This Purpose Has Been Achieved.</h2><p><a href="https://bibleox.com/ru/ru/w/%D0%B2%D0%B5%D1%82%D1%85%D0%B8%D0%B9-%D0%B7%D0%B0%D0%B2%D0%B5%D1%82#HH-%D0%9E%D0%B1%D0%B5%D1%89%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BF%D1%80%D0%B8%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%B8%D1%8F-%D0%A1%D0%BF%D0%B0%D1%81%D0%B8%D1%82%D0%B5%D0%BB%D1%8F">https://bibleox.com/ru/ru/w/ветхий-завет#HH-Обещание-пришествия-Спасителя</a></p><h2>The Sons of Abraham Are Those Who Believe</h2><blockquote><p>“just as Abraham ‘believed God, and it was accounted to him for righteousness.’ Therefore know that <strong><mark>only those who are of faith are sons of Abraham</mark></strong>. And the Scripture, foreseeing that God would justify the Gentiles by faith, preached the gospel to Abraham beforehand, saying, ‘In you <strong>all the nations</strong> shall be blessed.’ So then <strong>those who are of faith are blessed with believing Abraham. For as many as are of the works of the law are under the curse</strong>; for it is written, ‘Cursed is everyone who does not continue in all things which are written in the book of the law, to do them’” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L6-10">Gal. 3:6-10</a>)</p></blockquote><h2>Jews Are Those Who Are Such Spiritually (Inwardly), Not Outwardly</h2><blockquote><p>“For <strong>he is not a Jew who is one outwardly</strong>, nor is circumcision that which is outward in the flesh; <strong>but he is a Jew who is one <mark>inwardly</mark></strong>; and circumcision is that of the heart, in the Spirit, not in the letter; whose praise is not from men but from God” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L28-29">Rom. 2:28-29</a>)</p></blockquote><blockquote><p>“For <strong><mark>in Christ Jesus</mark></strong> neither <strong><mark>circumcision</mark></strong> nor <strong><mark>uncircumcision</mark></strong> <strong><mark>avails anything</mark></strong>, but a new creation” (<a href="https://bibleox.com/en/eng-nkjv/gal/6/#L15">Gal. 6:15</a>)</p></blockquote><h2>A Prophecy About the New Testament Priesthood from <u>All</u> Nations</h2><p>In the Old Testament church, priests were appointed only from the Jewish people, from the tribe of Levi, from the line of Aaron. But in the New Testament Church priests will be appointed from all nations, and not only from the Jewish one (the line of Aaron):</p><blockquote><p>“It shall be that <strong>I will gather <u><mark>all</mark></u> <mark>nations and tongues</mark></strong>; and they shall come and see My glory. I will set a sign among them; and those among them who escape I will send to the nations: to Tarshish and Pul and Lud, who draw the bow, and Tubal and Javan, to the coastlands afar off <strong>who have not heard My fame nor seen My glory</strong>. And they shall declare My glory among the Gentiles. Then they shall bring all your brethren for an offering to the LORD out of all nations, on horses and in chariots and in litters, on mules and on camels, to My holy mountain Jerusalem, says the LORD, as the children of Israel bring an offering in a clean vessel into the house of the LORD. <strong><mark>And I will also take some of them for priests and Levites</mark>, says the LORD</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/66/#L18-21">Is. 66:18-21</a>)</p></blockquote>

  - src: Церковь-возвышение-над-миром
    path: Rw8m_The_Church_Rising_Above_the_World
    title: The Church — Rising Above the World
    meta_desc: The need for the Church, while preaching the Gospel, to keep from merging with the world
    menu: { parent: Church, title: The Church — Rising Above the World, priority: 13 }
    body: |-
      <blockquote><p>“<strong>Do not love the world or the things in the world</strong>. If anyone loves the world, the love of the Father is not in him. For all that is in the world — <strong>the lust of the flesh, the lust of the eyes, and the pride of life</strong> — is not of the Father but is of the world” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L15-16">1 John. 2:15-16</a>)</p></blockquote><blockquote><p>“as obedient children, <strong>not conforming yourselves to the former lusts</strong>, as in your ignorance” (<a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L14">1 Pet. 1:14</a>)</p></blockquote><p>The need to strive toward the image of God, and not toward the image of the present age:</p><blockquote><p>“And <strong>do not be conformed to this world</strong>, but be transformed by the renewing of your mind, that you may <strong>prove what is that</strong> good and acceptable and perfect <strong>will of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L2">Rom. 12:2</a>)</p></blockquote>

  - src: храм-образ-небесной-реальности
    path: Th4h_The_Temple_an_Image_of_the_Heavenly_Reality
    title: The Temple — an Image of the Heavenly Reality
    menu: { parent: Church, title: The Temple — an Image of the Heavenly Reality, priority: 15 }
    body: |-
      <h2>A Visible Image of the Invisible</h2><h3>The Universe</h3><p>God created the world so that the invisible would be known through the visible. So that man, by contemplating the visible creation, would come to know the invisible Creator:</p><blockquote><p>“because <strong>what may be known of God is manifest in them</strong>, for <strong>God has shown it to them</strong>. For since the creation of the world His <strong>invisible</strong> attributes are clearly seen, <strong>being understood by the things that are made</strong>, even His eternal power and Godhead, so that they are without excuse” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L19-20">Rom. 1:19-20</a>)</p></blockquote><h3>The Temple</h3><p>The visible earthly temple is an image of the invisible heavenly reality. The prophet is given the command to arrange the temple according to the pattern shown on the mountain:</p><blockquote><p>“And let them make Me <strong>a sanctuary</strong>, that I may dwell among them. <strong>According to all that I show you</strong>, that is, <strong>the pattern of the tabernacle</strong> and the pattern of all its furnishings, just so you shall <strong>make</strong> it. &lt;...&gt; And see to it that <strong>you make them according to the pattern which was shown you on the mountain</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L8-9,40">Ex. 25:8-9,40</a>)</p></blockquote><p>The apostle points out that the temple was arranged after the image of the true sanctuary:</p><blockquote><p>“For Christ has not entered <strong>the holy places made with hands, which are copies of the true</strong> <em>(Greek: ἀντίτυπα — “images, copies”)</em>, but into heaven itself, now to appear in the presence of God for us” (<a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24">Heb. 9:24</a>)</p></blockquote><blockquote><p>“Our fathers had <strong>the tabernacle</strong> of witness in the wilderness, as He appointed, instructing Moses to make it <strong>according to the pattern</strong> that he had seen” (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L44">Act. 7:44</a>)</p></blockquote><h2>The Old Testament: in the Temple Only God and the Angels</h2><h3>The Invisible God</h3><p>In the Old Testament temple, built at God’s command, in the most important place there stood only the ark (a chest) with the holy things, above whose lid, between the two cherubim, God revealed Himself and spoke:</p><blockquote><p>“And there <strong>I will meet with you, and I will speak with you from above the mercy seat, from between the two cherubim</strong> which are on the ark of the Testimony, about everything which I will give you in commandment to the children of Israel” (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L22">Ex. 25:22</a>)</p></blockquote><h3>The Holy Angels</h3><p>The temple was filled everywhere with images of angels (cherubim)</p><h4>Cherubim on the Lid of the Ark</h4><blockquote><p>“And <strong>you shall make two cherubim of gold</strong>; of hammered work you shall make them <strong>at the two ends of the mercy seat</strong>. Make one cherub at one end, and the other cherub at the other end; you shall make the cherubim at the two ends of it of one piece with the mercy seat. And the cherubim shall stretch out their wings above, covering the mercy seat with their wings, and they shall face one another; the faces of the cherubim shall be toward the mercy seat” (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L18-20">Ex. 25:18-20</a>)</p></blockquote><h4>Cherubim to the Left and Right of the Ark</h4><blockquote><p>“<strong>Inside the inner sanctuary he made two cherubim</strong> of olive wood, each ten cubits high. &lt;...&gt; Then <strong>he set the cherubim inside the inner room</strong>; and they stretched out the wings of the cherubim so that the wing of the one touched one wall, and the wing of the other cherub touched the other wall. And their wings touched each other in the middle of the room” (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L23,27">1 Kin. 6:23,27</a>)</p></blockquote><h4>Cherubim on the Veil</h4><blockquote><p>“And he made <strong>the veil</strong> of blue, purple, crimson, and fine linen, and <strong>wove cherubim into it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L14">2 Chr. 3:14</a>) (<a href="https://bibleox.com/en/en-nrsv/1mak/1/#L22">1 Macc. 1:22</a>)</p></blockquote><h4>Cherubim on the Walls of the Temple</h4><blockquote><p>“Then <strong>he carved all the walls of the temple all around</strong>, both the inner and outer sanctuaries, <strong>with carved figures of cherubim</strong>, palm trees, and open flowers” (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L29">1 Kin. 6:29</a>)</p></blockquote><p>In detail about the arrangement of the temple: <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">https://bibleox.com/ru/ru/w/иерусалимский-храм</a></p><h2>The New Testament: in the Temple God, the Angels and the Souls of the Righteous</h2><h3>The Heavenly Reality Has Changed</h3><p>God became incarnate, became visible, suffered, rose, ascended into heaven and <u>visibly</u> took His throne (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L19">Mark. 16:19</a>; <a href="https://bibleox.com/en/eng-nkjv/ef/1/#L20-21">Eph. 1:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L21">Rev. 3:21</a>).</p><h3>Christ God</h3><blockquote><p>“So then, after the Lord had spoken to them, He was received up into heaven, and <strong><mark>sat down at the right hand of God</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L19">Mark. 16:19</a>)</p></blockquote><blockquote><p>“which He worked in Christ when He raised Him from the dead and <strong><mark>seated Him at His right hand in the heavenly places</mark></strong>, far above all principality and power and might and dominion, and every name that is named, not only in this age but also in that which is to come” (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L20-21">Eph. 1:20-21</a>)</p></blockquote><blockquote><p>“To him who overcomes I will grant to sit with Me on <strong>My throne</strong>, as I also overcame and <strong><mark>sat down with My Father on His throne</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L21">Rev. 3:21</a>)</p></blockquote><h3>The Holy Angels</h3><blockquote><p>“Then another <strong>angel</strong>, having a golden censer, came and stood at the altar. He was given much incense, that he should offer it with the prayers of all the saints upon the golden altar which was before the throne” (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3">Rev. 8:3</a>)</p></blockquote><blockquote><p>“And out of the temple came the seven <strong>angels</strong> having the seven plagues, clothed in pure bright linen, and having their chests girded with golden bands” (<a href="https://bibleox.com/en/eng-nkjv/otkr/15/#L6">Rev. 15:6</a>)</p></blockquote><h3>The Souls of the Holy Righteous</h3><blockquote><p>“When He opened the fifth seal, I saw <strong>under the altar the souls of those who had been slain for the word of God and for the testimony which they held</strong>. And they cried with a loud voice, saying, ‘How long, O Lord, holy and true, until You judge and avenge our blood on those who dwell on the earth?’ Then <strong>a white robe</strong> was given to each of them; and it was said to them that they should rest a little while longer, until both the number of their fellow servants and <strong>their brethren, who would be killed as they were, was completed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>)</p></blockquote><blockquote><p>“Then I looked, and behold, <strong>a Lamb</strong> standing on Mount Zion, and <strong>with Him one hundred and forty-four thousand</strong>, having His Father’s name written on their foreheads. &lt;...&gt; They sang as it were a new song before the throne, before the four living creatures, and the elders; and no one could learn that song except the hundred and forty-four thousand <strong>who were redeemed from the earth</strong>. These are the ones <strong>who were not defiled with women</strong>, for they are virgins. These are the ones who <strong>follow the Lamb wherever He goes</strong>. These were redeemed from among men, being firstfruits to God and to the Lamb. And in their mouth was found no deceit, for they are without fault before the throne of God” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L1,3-5">Rev. 14:1,3-5</a>)</p></blockquote><h3>Singing</h3><blockquote><p>“And suddenly there was with the angel a multitude of the heavenly host praising God and saying: ‘Glory to God in the highest, and on earth peace, goodwill toward men!’” (<a href="https://bibleox.com/en/eng-nkjv/lk/2/#L13-14">Luke. 2:13-14</a>)</p></blockquote><blockquote><p>“Then I looked, and behold, <strong>a Lamb</strong> standing on Mount Zion, and <strong>with Him one hundred and forty-four thousand</strong>, having His Father’s name written on their foreheads. &lt;...&gt; They <strong>sang as it were a new song</strong> before the throne, before the four living creatures, and the elders” (<a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L1,3-5">Rev. 14:1,3-5</a>)</p></blockquote><h3>The Command to Measure the Heavenly Temple</h3><blockquote><p>“Then I was given a reed like a measuring rod. And the angel stood, saying, ‘Rise and <strong>measure <mark>the temple of God</mark></strong>, the altar, and those who worship there’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/11/#L1">Rev. 11:1</a>)</p></blockquote><h3>The Throne</h3><blockquote><p>“the twenty-four elders fall down before <strong>Him who sits on the throne</strong> and worship Him who lives forever and ever, and cast their crowns before the throne” (<a href="https://bibleox.com/en/eng-nkjv/otkr/4/#L10">Rev. 4:10</a>)</p></blockquote><blockquote><p>“And the twenty-four elders who sat before God on their thrones fell on their faces and worshiped God” (<a href="https://bibleox.com/en/eng-nkjv/otkr/11/#L16">Rev. 11:16</a>)</p></blockquote><h3>The Altar</h3><blockquote><p>“Then another angel, having a golden censer, came and stood at <strong>the altar</strong>. He was given much incense, that he should offer it with the prayers of all the saints upon the golden <strong>altar</strong> which was <strong>before the throne</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3">Rev. 8:3</a>)</p></blockquote><blockquote><p>“Then the angel took the censer, filled it with fire from <strong>the altar</strong>, and threw it to the earth. And there were noises, thunderings, lightnings, and an earthquake” (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L5">Rev. 8:5</a>)</p></blockquote><blockquote><p>“Then the sixth angel sounded: And I heard a voice from the four horns of the golden <strong>altar</strong> which is before God” (<a href="https://bibleox.com/en/eng-nkjv/otkr/9/#L13">Rev. 9:13</a>)</p></blockquote><h3>The Seven-Branched Lampstand</h3><blockquote><p>“And from the throne proceeded lightnings, thunderings, and voices. <strong>Seven lamps of fire</strong> were burning <strong>before the throne</strong>, which are the seven Spirits of God” (<a href="https://bibleox.com/en/eng-nkjv/otkr/4/#L5">Rev. 4:5</a>)</p></blockquote><h3>Censing</h3><blockquote><p>“Then another angel, having <strong>a golden censer</strong>, came and stood at the altar. He was given <strong>much incense</strong>, that he should offer it with the prayers of all the saints upon the golden altar which was before the throne. &lt;...&gt; Then <strong>the angel took the censer</strong>, filled it with fire from the altar, and threw it to the earth. And there were noises, thunderings, lightnings, and an earthquake” (<a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3,5">Rev. 8:3,5</a>)</p></blockquote><h3>Irenaeus of Lyons (2nd Century) on the Temple as an Image of the Heavenly Reality</h3><p>The arrangement of the temple after the image of the heavenly reality is confirmed by Saint Irenaeus of Lyons (2nd century). Irenaeus refers to the Revelation of John the Theologian, saying that it is fitting for earthly things to be images of the heavenly ones created by God:</p><blockquote><p><em>As, therefore, He does not stand in need of these [services], yet does desire that we should render them for our own benefit, lest we be unfruitful; so did the Word give to the people that very precept as to the making of oblations, although He stood in no need of them, that they might learn to serve God: thus is it, therefore, also His will that </em><strong><em>we, too, should offer a gift at the altar</em></strong><em>, frequently and without intermission.</em></p><p><strong><em><mark>The altar, then, is in heaven</mark></em></strong><em> (for towards that place are our prayers and oblations directed); </em><strong><em><mark>the temple likewise</mark></em></strong><em> [is there], as John says in the Apocalypse, “And the temple of God was opened” (</em>Rev. 11:19<em>), the tabernacle also: “For, behold,” He says, “the tabernacle of God, in which He will dwell with men” (</em>Rev. 21:3<em>). Now the gifts, oblations, and all the sacrifices, did the people receive in a figure, as was shown to Moses in the mount, from one and the same God, whose name is now glorified in the Church among all nations. But </em><strong><em><mark>it is congruous that those earthly things, indeed, which are spread all around us, should be types of the celestial</mark></em></strong><em>, being [both], however, created by the same God. </em><strong><em>For in no other way could He assimilate an image of spiritual things [to suit our comprehension]</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4/">Against Heresies, Book 4, ch. 18-19</a>)</p><h2>God Commanded That the Temple Be Revered</h2><p>The temple is <a href="https://bibleox.com/en/en/w/Th4h_The_Temple_an_Image_of_the_Heavenly_Reality/">an image of the heavenly reality</a>. God commanded that this image be revered:</p><blockquote><p>“You shall keep My Sabbaths and <strong>reverence My sanctuary</strong>: I am the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>)</p></blockquote><blockquote><p>“You shall keep My Sabbaths and <strong>reverence My sanctuary</strong>: I am the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">Lev. 26:2</a>)</p></blockquote><p>The New Testament temple is arranged after the image from the Revelation of John the Theologian.</p>
