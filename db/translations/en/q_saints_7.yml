  body: "<h2>The Seventh Ecumenical Council (787)</h2><blockquote><p>“Our Lord Jesus
    Christ has bestowed on us the relics of the saints as fountains of salvation,
    which in manifold ways pour out benefits upon the infirm. Therefore those who
    have dared to reject… the relics of the martyrs, of which they knew that they
    were authentic and true — if they are bishops or clerics, let them be deposed;
    but if monks or laymen, let them be deprived of communion.” (Decree of the Seventh
    Ecumenical Council)</p></blockquote><h2>20th century</h2><h3>Dmitry Vladykov,
    protopresbyter (1863–1955)</h3><blockquote><p><strong><mark>Holy relics are called
    the venerable remains of the holy saints of God, whether these be their bodies,
    more or less whole, or their bones alone</mark></strong>. The Orthodox Church
    has never recognised, and does not recognise, the mere incorruption of bodies
    without miracles as proof of the sanctity of the departed, and she considers the
    chief sign of their sanctity and of their glorification in heaven to be the miracles
    which are wrought at their graves or from their relics. The relics of the saints,
    if they are incorrupt, constitute a miracle, but only an additional one to those
    miracles which are wrought through their mediation.</p><p>&lt;…&gt;</p><p><strong>The
    preservation of the remains of the saints in incorruption and the working of miracles
    through their means serves the Orthodox Church as the ground and motive for venerating
    the relics of the holy saints of God, and at the same time as the assurance that
    such veneration is a work pleasing to God</strong>. This <strong><mark>veneration
    is expressed in the establishment of feasts on the days of the discovery and of
    the translation of the holy relics, in their reverent keeping, in their being
    placed in holy churches, in the erection of tombs, in the lighting of candles
    and lamps before them, in the burning of incense, in kissing and in bowing down</mark></strong>.</p></blockquote><p>(The
    Orthodox Church and Sectarians)</p>\n"
