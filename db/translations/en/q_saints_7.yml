    title: Veneration of the saints
    priority: 0
  body: '<h2>2nd century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><p>On
    the veneration of angels:</p><blockquote><p><em>But both </em><strong><em><mark>Him</mark></em></strong><em>,
    and </em><strong><em><mark>the Son</mark></em></strong><em> (who came forth from
    Him and taught us these things, and </em><strong><em><mark>the host of the other
    good angels who follow and are made like to Him</mark></em></strong><em>), and
    </em><strong><em><mark>the prophetic Spirit</mark></em></strong><em>, </em><strong><em><mark>we
    worship and adore</mark>, knowing them in reason and truth</em></strong><em>,
    and declaring without grudging to every one who wishes to learn, as we have been
    taught.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-6">Apology
    1</a>)</p><h3>The community of Polycarp of Smyrna (155–167)</h3><blockquote><p><em>“But
    when the pile was made ready, divesting himself of all his upper garments and
    loosing his belt, he endeavored also to take off his shoes, though not in the
    habit of doing this before, because </em><strong><em>all the faithful at all times
    vied eagerly who should soonest touch his flesh. For he had been treated with
    all honor for his holy life <mark>even before his gray hairs came</mark></em></strong><em>.”</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-13">Martyrdom of Polycarp,
    13</a>)</p><blockquote><p>“And so we afterwards took up <strong><mark>his bones
    which are more valuable than precious stones and finer than refined gold</mark>,
    and laid them in a suitable place; where the Lord will permit us to <mark>gather
    ourselves together, as we are able, in gladness and joy, and to celebrate the
    anniversary of his martyrdom</mark></strong> for the commemoration of those that
    have already fought in the contest, and for the training and preparation of those
    that shall do so hereafter.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-18">Martyrdom
    of Polycarp, 18</a>)</p><blockquote><p>“But the jealous and envious Evil One,
    the adversary of the family of the righteous, having seen the <strong><mark>greatness
    of his martyrdom</mark></strong> and his blameless life from the beginning, and
    how he was <strong><mark>crowned with the crown of immortality</mark></strong>
    and had won a reward which none could gainsay, managed that not even his poor
    body should be taken away by us, although many desired to do this and to touch
    his holy flesh. So he put forward Nicetes, the father of Herod and brother of
    Alce, to plead with the magistrate not to give up his body, ‘lest,’ so it was
    said, ‘they should abandon the crucified one and begin to worship this man’ —
    this being done at the instigation and urgent entreaty of the Jews, who also watched
    when we were about to take it from the fire, not knowing that <strong>it will
    be impossible for us either to forsake at any time the Christ who suffered for
    the salvation of the whole world of those that are saved — suffered though faultless
    for sinners — nor to worship any other. <mark>For Him, being the Son of God, we
    adore, but the martyrs as disciples and imitators of the Lord we cherish as they
    deserve for their matchless affection towards their own King and Teacher</mark>.
    May it be our lot also to be found partakers and fellow-disciples with them.</strong>”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-17">Martyrdom of Polycarp,
    17</a>)</p><blockquote><p>“So it befell the blessed Polycarp, who having with
    those from Philadelphia suffered martyrdom in Smyrna — twelve in all — <strong>is
    especially remembered more than the others by all men</strong>, so that he is
    talked of even by the heathen in every place: for he showed himself <strong>not
    only a notable teacher, but also a distinguished martyr, whose martyrdom <mark>all
    desire to imitate</mark></strong>, seeing that it was after the pattern of the
    Gospel of Christ. Having by his endurance overcome the unrighteous ruler in the
    conflict and so received the crown of immortality, <strong>he rejoices in company
    with the Apostles and all righteous men, and glorifies the Almighty God and Father</strong>,
    and blesses our Lord Jesus Christ.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-19">Martyrdom
    of Polycarp, 19</a>)</p><h3>Tertullian (c. 160–240)</h3><p>Here the author speaks
    of the day of martyrdom as a day of birth (into the Kingdom of God). This day
    was <a href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-18">so called</a>
    in the community of Polycarp of Smyrna. Cyprian of Carthage, bishop of the same
    region in which Tertullian wrote, calls these same assemblies “feasts of the passions
    and days of the martyrs”:</p><blockquote><p>Every year we make voluntary <strong>oblations
    for the dead on the day of their birth</strong>.</p></blockquote><p>(On the Chaplet,
    or De Corona)</p><blockquote><p>We offer, on one day every year, oblations for
    the dead as birth-day honours.</p></blockquote><p>(<a href="https://tertullian.org/lfc/LFC10-11_de_corona.htm">De
    corona, English translation</a>)</p><blockquote><p>Oblationes pro defunctis, pro
    nataliciis, annua die facimus.</p></blockquote><p>(<a href="https://tertullian.org/latin/de_corona.htm">De
    corona, Latin original</a>)</p><h2>3rd century</h2><h3>St Cyprian of Carthage,
    hieromartyr (c. 200–258)</h3><blockquote><p>“His grandmother, Celerina, was some
    time since <strong>crowned with martyrdom</strong>. Moreover, his paternal and
    maternal uncles, Laurentius and Egnatius, who themselves also were once warring
    in the camps of the world, but <strong>were true and spiritual soldiers of God,
    casting down the devil by the confession of Christ, merited palms and crowns from
    the Lord by their illustrious passion. <mark>We always offer sacrifices for them,
    as you remember, as often as we celebrate the passions and days of the martyrs
    in the annual commemoration</mark></strong>. Nor could he, therefore, be degenerate
    and inferior whom this family dignity and a generous nobility provoked, by domestic
    examples of virtue and faith.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-1#HH-To-the-Clergy-and-People-About-the-Ordination-of-Celerinus-as-Reader">To
    the Clergy and People, About the Ordination of Celerinus as Reader</a>)</p><h2>4th
    century</h2><h3>The Council of Gangra (340)</h3><blockquote><p>“If any one shall,
    from a presumptuous disposition, <strong>condemn and abhor the assemblies [in
    honour] of the martyrs, or the services performed there, and the commemoration
    of them</strong>, let him be anathema.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-councils-of-ancyra-neocaesarea-gangra-antioch-and-laodicea-3#HH-Canon-XX">Canon
    20</a>)</p><h3>The Council of Laodicea (360)</h3><blockquote><p>The members of
    the Church are not allowed to meet in the cemeteries, nor attend the so-called
    martyries of any of the heretics, for prayer or service; but such as so do, if
    they be communicants, shall be excommunicated for a time; but if they repent and
    confess that they have sinned they shall be received.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-councils-of-ancyra-neocaesarea-gangra-antioch-and-laodicea-5#HH-Canon-IX">Canon
    9</a>)</p><blockquote><p><strong>No Christian shall forsake the martyrs of Christ</strong>,
    and turn to false martyrs, that is, to those of the heretics, or those who formerly
    were heretics; for they are aliens from God. Let those, therefore, who go after
    them, be anathema.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-councils-of-ancyra-neocaesarea-gangra-antioch-and-laodicea-5#HH-Canon-XXXIV">Canon
    34</a>)</p><h3>St Athanasius the Great, bishop of Alexandria (295–373)</h3><blockquote><p>Let
    there be no communion at all between you and the schismatics, and especially with
    the Arian heretics. For you know how I too avoided them because of their Christ-opposing
    and heterodox heresy. Strive rather <strong>always to remain in unity among yourselves,
    and above all with the Lord, and then with the saints, that after death they may
    receive you also into the eternal habitations as friends and acquaintances</strong>.</p><p>&lt;…&gt;</p><p>to
    keep your soul from unclean thoughts, <strong>to emulate the saints</strong>,
    not to draw near to the Meletian schismatics, knowing their wicked and abominable
    intent, and to have no communion at all with the Arians, because their impiety
    is manifest to all.</p></blockquote><p>(Life of St Anthony the Great)</p><h3>St
    Gregory the Theologian, archbishop of Constantinople (c. 325–389)</h3><blockquote><p><em>You
    [the Roman emperor Julian the Apostate] were not ashamed of the victims slain
    for Christ! You did not fear the great ascetics — </em><strong><em><mark>John,
    Peter, Paul, James, Stephen, Luke, Andrew, Thecla and the others, who before and
    after them suffered for the truth</mark></em></strong><em>! They willingly struggled
    with fire, with iron, with wild beasts and with torturers, and went to meet present
    and threatened calamities, as if in other bodies or as if incorporeal. And why
    all this? That they might not betray piety even by a word. </em><strong><em><mark>They
    are glorified with great honours and festivals</mark></em></strong><em>, </em><strong><em>they
    drive out demons</em></strong><em>, </em><strong><em>they heal diseases</em></strong><em>,
    </em><strong><em>they appear</em></strong><em>, </em><strong><em>they prophesy</em></strong><em>;
    their very </em><strong><em>bodies, when they are touched and <mark>venerated</mark>,
    act as much as their holy souls</em></strong><em>; even </em><strong><em>drops
    of blood and all that bears the traces of their sufferings are as effective as
    their bodies</em></strong><em>.</em></p></blockquote><p>(Oration 4, First Invective
    against Julian)</p><h3>St Gregory of Nyssa, bishop (c. 331–394)</h3><p>An encomium
    on the great martyr Theodore the Recruit, delivered in the church with his holy
    relics and icon:</p><blockquote><p>When after many sufferings (the martyr) appeared
    as a man fully ripe in confession and piety, the sentence is pronounced over him
    and the order goes forth to deliver him to the fire; and so by a fair and blessed
    path he <strong>departed to God</strong>, and left us an edifying memory of his
    contest, <strong>gathering the nations, instructing the Church, driving out demons,
    bringing down peaceful angels, obtaining for us from God what is profitable, and
    making this place an infirmary for various diseases</strong>, a haven for those
    tossed by sorrows, an abundant treasury for the poor, a convenient guest-house
    for travellers, <strong>a constant place of festival for those who keep festival</strong>.
    For, <strong><mark>though we honour this day with yearly festivals, the zeal of
    the multitude flocking hither never ceases</mark></strong>, but the road leading
    here is like a path strewn with ants; some go forward, others yield place to those
    newly arriving.</p><p>We, O blessed one, having by the loving-kindness of the
    Creator completed the yearly cycle, <strong><mark>have gathered a sacred assembly
    of the lovers of martyrs to celebrate you</mark></strong>, worshipping the common
    Master and <strong><mark>keeping the victorious remembrance of your contests</mark></strong>.
    And you, the president of the feast (for we call upon you who have summoned us),
    draw near to us, <strong>wherever you may be, whether you dwell in the ethereal
    height, or traverse some heavenly vault, or stand before the Master together with
    the choirs of angels, or, as a faithful servant, worship Him together with the
    Powers and Authorities</strong> — leaving for a little while the things above,
    <strong>come as an invisible friend to those who <mark>honour you</mark></strong>;
    look upon what is happening here, so as to double your gratitude to God, who for
    one suffering and one pious confession has given you such rewards, and to rejoice
    over the blood (you shed) and the fiery torment; for as many as were then the
    spectators of your execution, <strong><mark>so many are now the servants of your
    honour</mark></strong>. We stand in need of many benefits; <strong>pray for our
    fatherland before the common King of all</strong>; for the fatherland of a martyr
    is the land where he suffered, and its fellow-citizens and kindred are those who
    buried him, who possess his body, who <strong><mark>honour him</mark></strong>.
    We foresee sorrows; we expect dangers; the terrible Scythians are not far off,
    plotting war against us; as a soldier <strong>fight for us, and as a martyr show
    (prayerful) boldness (before God) for those who serve Him together with you</strong>.
    Though you have passed from this life, yet <strong>you know the sufferings and
    needs of mankind</strong>; obtain for us peace, that these festivals may not cease,
    that the fierce and unbridled barbarian may not exult over the churches and altars,
    that the defiler may not trample upon holy things. For we also <strong>count it
    your benefaction that we have been preserved unharmed until now</strong>; we ask
    of you safety for the time to come as well. And if there should be need of greater
    intercession, <strong>gather the choir of your brother martyrs and pray together
    with them all: let the prayers of many righteous men remit the sins of peoples
    and tribes</strong>. <strong>Remind Peter of us, stir up Paul, and John the Theologian</strong>
    as well, the beloved disciple, <strong>that they may take care for the churches</strong>
    which they established, for which they bore bonds, for which they faced dangers
    and death.</p></blockquote><p>(Encomium on the Great Martyr Theodore the Recruit)</p><h2>5th
    century</h2><h3>The Council of Carthage (393–419)</h3><blockquote><p>The passions
    of the Martyrs may be read when their <strong>anniversary days are celebrated</strong>.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-canons-of-the-synods-of-sardica-carthage-and-constantinople-2#HH-Canon-XLVI">Canon
    XLVI; Russian numbering 56</a>)</p>

    '
