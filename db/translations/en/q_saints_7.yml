    <h2>2nd century</h2><h3>The community of Polycarp of Smyrna (2nd century)</h3><p>The text concerns the martyrdom of Bishop Polycarp, a disciple of the Apostle John the Theologian:</p><blockquote><p>“But when the pile was made ready, divesting himself of all his upper garments and loosing his belt, he endeavored also to take off his shoes, though not in the habit of doing this before, because <strong><mark>all the faithful</mark> at all times vied eagerly <mark>who should soonest touch his flesh</mark>. For he had been treated with all honor for his holy life <mark>even before his gray hairs came</mark></strong></p><p>&lt;…&gt;</p><p>But the jealous and envious Evil One, the adversary of the family of the righteous, having seen the greatness of his martyrdom and his blameless life from the beginning, and how he was crowned with the crown of immortality and had won a reward which none could gainsay, <strong><mark>managed that not even his poor body should be taken away by us, although many desired to do this and to touch his holy flesh</mark></strong>. So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to give up his body, <strong>‘lest,’ so it was said, ‘they should abandon the crucified one and begin to worship this man.’ — this being done at the instigation and urgent entreaty of the Jews, who also watched when we were about to take it from the fire, not knowing that <mark>it will be impossible for us either to forsake at any time the Christ who suffered for the salvation of the whole world of those that are saved — suffered though faultless for sinners — nor to worship any other. For Him, being the Son of God, we adore, but the martyrs as disciples and imitators of the Lord we cherish as they deserve for their matchless affection towards their own King and Teacher</mark>.</strong> May it be our lot also to be found partakers and fellow-disciples with them. The centurion therefore, seeing the opposition raised on the part of the Jews, <strong>set him in the midst and burnt him after their custom</strong>. And so <strong><mark>we afterwards took up his bones which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place; where the Lord will permit us to gather ourselves together, as we are able, in gladness and joy, and to celebrate the anniversary of his martyrdom</mark></strong> for the commemoration of those that have already fought in the contest, and for the training and preparation of those that shall do so hereafter. So it befell the blessed Polycarp, who having with those from Philadelphia <strong>suffered martyrdom in Smyrna — twelve in all —</strong> is especially remembered more than the others by all men, so that he is talked of even by the heathen in every place: for he showed himself not only a notable teacher, but also a distinguished martyr, <strong>whose martyrdom all desire to imitate, seeing that it was after the pattern of the Gospel of Christ</strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-13">Martyrdom of Polycarp, 13, 17–19</a>; the ANF translation reads “before his gray hairs came” for “even before his martyrdom”, and “twelve in all” for “the twelfth martyr in Smyrna”)</p><h2>4th century</h2><h3>Eusebius of Caesarea (Pamphilus), bishop (258–339)</h3><blockquote><p>41. Accordingly certain ones secretly suggested to Nicetes, the father of Herod and brother of Alce, that he should plead with the magistrate not to give up his body, “lest,” it was said, “they should abandon the crucified One and begin to worship this man.” They said these things at the suggestion and impulse of the Jews, who also watched as we were about to take it from the fire, not knowing that <strong><mark>we shall never be able either to forsake Christ, who suffered for the salvation of the whole world of those that are saved, or to worship any other</mark></strong>.</p><p><strong><mark>42. For we worship him who is the Son of God, but the martyrs, as disciples and imitators of the Lord, we love as they deserve on account of their matchless affection for their own king and teacher. May we also be made partakers and fellow-disciples with them.</mark></strong></p><p>43. The centurion, therefore, when he saw the contentiousness exhibited by the Jews, placed him in the midst and burned him, as was their custom. <strong>And so we afterwards gathered up his bones, which were more valuable than precious stones and more to be esteemed than gold, and laid them in a suitable place.</strong></p><p>44. <strong>There the Lord will permit us to come together as we are able, in gladness and joy to celebrate the birthday of his martyrdom</strong>, for the commemoration of those who have already fought and for the training and preparation of those who shall hereafter do the same.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-4#HH-Under-Verus-Polycarp-with-Others-suffered-Martyrdom-at-Smyrna">Eusebius, Church History, IV.15</a>)</p><h3>Serapion of Thmuis (early 4th c. – after 362)</h3><blockquote><p>But <strong><mark>as for the bodies of the saints, they have even attained to this, that they are honored (τιμηθῆναι) and are not abandoned by the workings (ἐνεργείας) and power of God</mark>. The dead body of Elisha lay, yet even lying dead it raised a dead man, cast out death, set the dead man free, sent the departed to the living, and granted awakening to the deceased (4 Kgs. 13:21).</strong> And if the Manichaeans, raging against the Scripture itself, blaspheme it, not even honoring the Law, let at least <strong>the shadow of Peter</strong> put them to shame. For the shadow was from the body, and, overshadowing the sick, it healed their bodies of diseases.</p></blockquote><p>(<u>Against the Manichaeans, ch. 11</u>)</p><h3>Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p>Behold, they sing psalms and, rejoicing, glorify God, who has crowned the heads of your manfulness, <strong><mark>and in great joy they surround the holy remains of your suffering, desiring to receive a blessing</mark></strong> and to take with them medicines for soul and body. Therefore bless all, as good disciples of the good Master. And I, the weak one, <strong>strengthened by you, have sung with love before your holy remains</strong>. Therefore do you also be intercessors for me, the feeble, before the throne of God, that through your prayers I too may be saved there, by the grace of the Lord and Savior our Jesus Christ.</p></blockquote><p>(Praise of the Martyrs)</p><blockquote><p>Therefore even after death they (the martyrs) act as living: they heal the sick, cast out demons, and by the power of the Lord repel every evil influence of their tormenting dominion. For <strong><mark>the holy relics are always endowed with the wonder-working (miracle-producing) grace of the Holy Spirit</mark></strong>. Since the martyrs courageously, with great patience, confessed Christ before men, He also proclaimed them before His Father and Angels, and promised them good things “which eye has not seen, nor ear heard, nor have entered into the heart” of mortal man (1 Cor. 2:9)</p></blockquote><p>(Praise of the Glorious Martyrs Who Suffered Throughout the World)</p><h3>St Basil the Great, archbishop of Caesarea (329–379)</h3><blockquote><p>“But if this busy man starts a lawsuit for exercise, that is, there are public courts and laws, then I beg you not to complain of this in the least; and whatever good you do, you are gathering treasure for yourself, and what repose you provide to those persecuted for the name of the Lord, the same you prepare for yourself on the day of recompense. <strong>You will do well if you send to your homeland also <mark>the remains of the martyrs</mark>, if only, as you wrote to me, the persecution there even now makes martyrs for the Lord</strong>”</p></blockquote><p>(Letter 150 (155), to Soranus, 373)</p><h3>St Gregory the Theologian, archbishop of Constantinople (c. 325–389)</h3><blockquote><p>You [the Roman emperor Julian the Apostate] were not ashamed of the sacrifices slain for Christ! You did not fear the great ascetics — John, Peter, Paul, James, Stephen, Luke, Andrew, Thecla and the others, who suffered for the truth after and before them! They willingly struggled with fire, iron, beasts and torturers, went to meet present and threatened calamities, as if in other bodies or as incorporeal. And why all this? So as not to change piety even by a word. <strong><mark>They are glorified with great honors and festivals</mark></strong>, <strong><mark>they drive out demons</mark></strong>, <strong><mark>they heal diseases</mark></strong>, <strong><mark>they appear</mark></strong>, <strong><mark>they foretell</mark></strong>; <strong><mark>their very bodies, when they are touched and venerated, act as much as their holy souls</mark></strong>; even <strong><mark>drops of blood and everything that bears the traces of their sufferings are as effective as their bodies</mark></strong>.</p></blockquote><p>(Oration 4, First Invective Against the Emperor Julian)</p><h3>St Gregory of Nyssa, bishop (c. 331–394)</h3><p>Bishop Gregory preaches in a church that holds the relics of the Great Martyr Theodore the Recruit († 306). Above the relics is an icon of Christ, and also one of Theodore the Recruit himself. The story of his martyrdom is depicted there. The walls of the church are painted. He speaks of prayer to the saint and of his intercession for us.</p><blockquote><p><em>let us consider </em><strong><em><mark>the present state of the saints</mark></em></strong><em>, how beautiful and majestic it is. For </em><strong><em>their soul, having departed on high, abides in the place proper to it and, having been released from the body, dwells together with those like it</em></strong><em>; and </em><strong><em><mark>the body, its honorable and undefiled organ</mark>, which by its passions did not in the least injure the incorruption of the soul that dwelt in it, <mark>is buried with great honor and reverence, is honorably laid in a sacred place, as some precious treasure kept until the time of regeneration</mark></em></strong><em>, in many things </em><strong><em>incomparable with any other bodies</em></strong><em>, which are destroyed by the death common to all and ordinary — and moreover in matter of the same nature. For most people loathe all other remains; no one passes a grave with pleasure, and when he unexpectedly sees an open grave, then, having looked at the ugliness of what lies there, full of unpleasant feeling and with a heavy sigh over the lot of mankind, he rather runs away. But whoever enters any place like this, </em><strong><em>where we have gathered today, where the memory of the righteous is celebrated and where <mark>his holy remains</mark> are</em></strong><em>, he will first comfort his soul with the splendor of what presents itself to his eyes, </em><strong><em>seeing this house as a temple of God</em></strong><em>, brightly adorned both by the grandeur of the building and by the beauty of the decorations, where the carver gave the wood the appearance of various animals, and the stonecutter brought the stone slabs to the smoothness of silver. And the painter adorned it with artificial flowers, </em><strong><em>depicting on the icon the valiant deeds of the martyr, his firm standing at the trial, the tortures, the beast-like faces of the tormentors, their violent actions, the furnace burning with flame, the most blessed end of the ascetic, the delineation of the human form of Christ, the author of the contest</em></strong><em>; having skillfully drawn all this for us in colors, as in a kind of explanatory book, he clearly </em><strong><em>told the deeds of the martyr and brightly adorned the church</em></strong><em>, as a flowering meadow (for painting also knows how to speak silently </em><strong><em>on the walls</em></strong><em> and to bring the greatest benefit). And the layer of variegated stones made the floor underfoot worthy of the event described.</em></p><p><em>Having comforted the eye with these sensuous works of art, (the visitor to the church) </em><strong><em><mark>[the believer] at last desires to approach the shrine as well, counting the very touching of it a sanctification and a blessing</mark></em></strong><em>. </em><strong><em>If anyone is permitted to take earth lying on the surface of the place of his repose, he <mark>receives the dust as a gift and gathers the earth as a treasure</mark></em></strong><em>. If </em><strong><em><mark>happiness grants anyone the opportunity to touch the very remains</mark></em></strong><em>, then how desirable this is and how great a gift of lofty prayer it is considered, those know who have experienced it and who themselves were animated by this desire. Those who gaze upon them </em><strong><em><mark>kiss them as the most living and flourishing body, bringing them to their eyes, mouths, ears, to all their senses</mark></em></strong><em>; then, shedding tears of reverence and heartfelt compunction, </em><strong><em>they offer prayer for intercession</em></strong><em>, as if to the </em><strong><em>martyr</em></strong><em> himself visibly present in his entirety, </em><strong><em>entreating him as a shield-bearer of God</em></strong><em>, calling upon him as one who receives the gifts (of prayer) whenever he pleases. From all this understand, pious people, that “precious in the sight of the Lord is the death of His saints” (Ps. 116:15). For </em><strong><em>one and the same <mark>body</mark> belongs to all men, being composed of one and the same substance; but one dies a simple death, is cast down as it happens; the other, graced by martyrdom, <mark>is so beloved and desirable to all</mark></em></strong><em>, as we have said above.</em></p><p><em>&lt;…&gt;</em></p><p>But when after many sufferings (the martyr) appeared as a man fully mature in confession and piety, the sentence is pronounced over him and the order goes forth to give him to the fire; so he, by a beautiful and blessed path, <strong>departed to God</strong>, and left us an edifying memory of his contest, <strong>gathering peoples, instructing the church, driving out demons, bringing down peaceful angels, asking for us from God what is profitable, making this place a hospital for various diseases</strong>, a harbor for those tossed by sorrows, an abundant treasury for the poor, a convenient inn for travelers, <strong>a permanent place of festival for those who celebrate</strong>. For, <strong>although we honor this day with annual festivals, <mark>the zeal of the multitude hastening here never ceases, but the road leading here is like a path strewn with ants; some go forward, others give place to those newly arriving</mark></strong>.</p><p>&lt;…&gt; <strong>so many now are the servants of your honor</strong>. We stand in need of many benefactions; <strong>pray for our fatherland before the common King of all</strong>; for the fatherland of a martyr is the country where he suffered, and his fellow citizens and kinsmen are <strong><mark>those who buried him, who have his body, who venerate him</mark></strong>.</p></blockquote><p>(Praise of the Great Martyr Theodore (the Recruit))</p>
    <h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p>Do you see how much stronger is the voice of the martyrs even when they are silent? That is why God has left us their bodies; that is why they, having conquered long ago, have not yet risen until now, but, although they have endured contests for so long a time, have not yet received the resurrection — they have not received it for your sake and for your benefit, so that you too, thinking of such an ascetic, may be stirred to a similar contest. There is no harm at all to them from this delay; but for you the greatest benefit comes from this circumstance. They will receive in due time what they do not receive now; but if God had taken them from here at once, He would have deprived us of great edification and consolation, since <strong>truly the greatest edification and consolation comes to all people from the tombs of these saints</strong>. You yourselves are witnesses of what has been said. Often we threatened, coaxed, terrified, exhorted you, but you did not show such zeal for prayer and were not stirred; yet when you came to the church of the martyrs, hearing counsel from no one, seeing only the tomb of the saints, you began to pour out abundant fountains of tears and became fervent in prayer. The martyr lies speechless, in complete silence: what is it then that touches the conscience and makes streams of tears pour forth as from a fountain? The very representation of the martyr and the remembrance of all that he accomplished. As the poor, when they see others rich, having attained high ranks, surrounded by bodyguards, enjoying great honor with the king, and from the prosperity of others come to know their own poverty more clearly, shed tears — so too we, when <strong>we remember the boldness of the martyrs, which they have before the King of all — God</strong>, and their brightness and glory, and remember also our own sins, then, having seen our own poverty more clearly from their riches, we grieve and sorrow, realizing how far we are from them; and this is what produces tears. <strong>For this reason God has left us their bodies here</strong>, so that, when a heap of occupations and a multitude of worldly cares bring thick darkness upon our soul from private or public affairs (and there are so many of them), then, leaving the house, going out of the city, taking leave of this noise, we might <strong>withdraw to the church of the martyrs</strong>, enjoy the spiritual breeze there, forget the multitude of affairs, be comforted by the calm, <strong>be with the saints</strong>, pray to the Disposer of their contests for our salvation, pour out many supplications, and, through all this having laid aside the burden from our conscience, return home again with great joy of soul.</p><p><strong>The tombs of the martyrs are nothing other than safe harbors, fountains of spiritual waters, treasures of wealth inexhaustible and never failing</strong>. As harbors, receiving ships overwhelmed by many waves, set them in safety, so too the tombs of the martyrs, having received our souls overwhelmed by worldly affairs, set them in great stillness and safety. And as fountains of cold water revive bodies exhausted by labor and heat, so too these tombs cool souls scorched by unseasonable passions, and quench at a single glance at them both unseasonable desire, and withering envy, and blazing anger, and everything else that might trouble us. And <strong>they are far better than treasures, because monetary treasures expose those who find them to many dangers, and, being divided into many parts, are diminished by this division; but here there is nothing of the sort, but, in contrast to sensible treasures, both the acquisition is safe, and <mark>division does not produce diminution. Those, as I have just said, being broken into parts, become smaller; but these, when they are divided among many, then show their wealth even more</mark></strong>. Such is the nature of spiritual things: they increase by being broken up, they are multiplied by division. Meadows presenting roses and violets to the eyes are not as pleasant as the graves of the martyrs, which bring to the souls of the beholders a certain unfading and unbroken delight.</p><p>3. Therefore with faith let us touch these tombs, let us be inflamed in soul, let us raise up lamentation.</p></blockquote><p>(Encomiums on the Saints. Homily on the Martyrs, on Compunction and Almsgiving)</p><blockquote><p>When, therefore, he [Ignatius the God-bearer, 1st century] made an end of life there, yea rather, when he ascended to heaven, he departed henceforward crowned. For this also happened through the dispensation of God, that <strong>he restored him again to us, and distributed the martyr to the cities. For that city received his blood as it dropped, but ye were honoured with his remains</strong>; ye enjoyed his episcopate, they enjoyed his martyrdom. They saw him in conflict, and victorious, and crowned, but ye have him continually. For a little time God removed him from you, and with greater glory granted him again to you. And as those who borrow money, return with interest what they receive, so also God, <strong>using this valued treasure of yours, for a little while, and having shown it to that city, with greater brilliancy gave it back to you</strong>. Ye sent forth a Bishop, and received a martyr; ye sent him forth with prayers, and ye received him with crowns; and not only ye, but all the cities which intervene. For how do ye think that they behaved when they saw his remains being brought back? <strong><mark>What pleasure was produced! how they rejoiced! with what applause on all sides they beset the crowned one!</mark></strong> For as with a noble athlete, who has wrestled down all his antagonists, and who comes forth with radiant glory from the arena, the spectators receive him, and do not suffer him to tread the earth, bringing him home on their shoulders, and besetting him with countless praises: <strong><mark>so also the cities in order receiving this saint then from Rome, and bearing him upon their shoulders as far as this city, escorted the crowned one with praises, celebrating the champion, in song</mark></strong>, laughing the Devil to scorn, because his artifice was turned against him, and what he thought to do against the martyr, this turned out for his behoof. Then, indeed, he profited, and encouraged all the cities; and from that time to this day he enriches this city, and as some perpetual treasure, drawn upon every day, yet not failing, makes all who partake of it more prosperous, so also this blessed Ignatius filleth those who come to him with blessings, with boldness, nobleness of spirit, and much courage, and so sendeth them home.</p><p><strong>Not only to-day, therefore, but every day let us go forth to him, plucking spiritual fruits from him</strong>. For it is, it is possible for him who comes hither with faith to gather the fruit of many good things. For <strong><mark>not the bodies only, but the very sepulchres of the saints have been filled with spiritual grace</mark></strong>. For if in the case of Elisha this happened, and a corpse when it touched the sepulchre, burst the bands of death and returned to life again (2 Kgs. 13:21), much rather now, when grace is more abundant, when the energy of the spirit is greater, is it possible that one touching a sepulchre, with faith, should win great power; thence on this account <strong>God allowed us the remains of the saints, wishing to lead by them us to the same emulation, and to afford us a kind of haven, and a secure consolation for the evils which are ever overtaking us.</strong> Wherefore I beseech you all, if any is in despondency, if in disease, if under insult, if in any other circumstance of this life, if in the depth of sins, let him come hither with faith, and he will lay aside all those things, and will return with much joy, having procured a lighter conscience from the sight alone. But more, it is not only necessary that those who are in affliction should come hither, but if any one be in cheerfulness, in glory, in power, in much assurance towards God, let not this man despise the benefit. For <strong>coming hither and beholding this saint</strong>, he will keep these noble possessions unmoved, persuading his own soul to be moderate by the recollection of this man’s mighty deeds, and not suffering his conscience by the mighty deeds to be lifted up to any self conceit. And it is no slight thing for those in prosperity not to be puffed up at their good fortune, but to know how to bear their prosperity with moderation, so that the treasure is serviceable to all, the resting place is suitable, for the fallen, in order that they may escape from their temptations, for the fortunate, that their success may remain secure, for those in weakness indeed, that they may return to health, and for the healthy, that they may not fall into weakness. Considering all which things, <strong>let us prefer this way of spending our time, to all delight, all pleasure, in order that rejoicing at once, and profiting, we may be able to become partakers with these saints</strong>, both of their dwelling and of their home, through the prayers of the saints themselves, through the grace and lovingkindness of our Lord Jesus Christ, with whom be glory to the Father with the Holy Spirit, now and always forever and ever amen.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-eulogy-of-st-ignatius">Eulogy of St. Ignatius</a>)</p><blockquote><p><strong>Precious are these bodies</strong>, for they have received wounds for their Lord, for they bear the marks of Christ. And just as a royal crown, adorned on all sides with various gems, produces a manifold radiance, so too <strong><mark>the bodies of the holy martyrs, covered with wounds for Christ as with precious stones, are more valuable and splendid than any royal diadem</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century#HH-Veneration-of-the-Relics-of-Saints">Homilies on the Holy Maccabees, First Homily</a>)</p><blockquote><p><strong>1</strong>. <strong>The <mark>God</mark> who loves mankind</strong>, showing His great and manifold Providence for the human race, not only created all creation, stretched out the heaven, spread out the sea, kindled the sun, commanded the moon to shine, gave the earth for dwelling and supplied everything from the earth for the nourishment and ordering of our bodies, but also <strong><mark>granted</mark> us <mark>the relics of the holy martyrs</mark></strong>. He Himself, having taken [their] souls — for <em>“the souls of the righteous are in the hand of God”</em> (Wis. 3:1) — <strong>has left us for now [their] bodies, as sufficient consolation and encouragement, <mark>so that</mark>, coming to the tombs of these saints, we may <mark>be moved to zeal and imitation</mark> and, contemplating them, <mark>make remembrance of their contests and of the rewards</mark> prepared for these contests.</strong></p><p>&lt;…&gt;</p><p><strong>3</strong>. Therefore, when you come here, beloved, and consider that <strong><mark>all this people with such zeal and haste throngs together to embrace the dust and to obtain a blessing from it</mark></strong>, how is it that you do not then take wing in your mind and hasten to show a zeal equal to the martyr’s, so as yourself to be counted worthy of the same rewards?</p><p>&lt;…&gt;</p><p><strong>4</strong>. Therefore, <strong>knowing their great boldness, <mark>let us always run to them and receive help from them</mark></strong>. For if people who have boldness before an earthly king can, when we run to them, bring us much great benefit, how much more <strong>will these saints, who have acquired boldness before the King of Heaven, be our greatest helpers through their sufferings</strong>, provided that we too contribute our [efforts]. For then especially <strong><mark>can their patronage bring us benefit</mark></strong>, if we are not negligent, but ourselves also strive, by earnest prayer and care for [our] life, to gain for ourselves the Master’s love for mankind.</p><p>&lt;…&gt;</p><p><strong>5</strong>. <strong><mark>Let us continually run to them as to spiritual physicians</mark></strong>. The good Master has left us their bodies so that, coming there and embracing them with the disposition of our soul, <strong><mark>we may receive from there the greatest healing of both spiritual and bodily diseases</mark></strong>.</p><p>&lt;…&gt;</p><p><strong>10</strong>. The Master grants us <strong><mark>the tombs of the holy martyrs as spiritual fountains</mark></strong>, able to pour out abundant streams.</p></blockquote><p>(Catechetical Homilies, 6)</p>
    <h3>St Ambrose of Milan, bishop († 397)</h3><p>In Russian translation:</p><blockquote><p><strong><mark>In the body of a martyr I venerate the wounds received for the name of Christ, I venerate him who lives by the immortality of virtue; I venerate the dust sanctified by the confession of the Lord; I venerate in this dust the seed of eternity; I venerate the body which teaches me to love the Lord and not to fear death for Him.</mark></strong></p></blockquote><p>In Latin (the author’s language):</p><blockquote><p>10. Beata anima, charissimi, cujus votum, cujus compunctionis incensum, cujus supplicationis holocaustum, nulla infidelitate fumidum, nullo carnalis illecebrae fetore pollutum, nulla saevitia cruentatum, nulla odii simultate maculatum: sed fide igneum, conscientia nitidum, sinceritate cordis odoriferum, concordia et charitate perfectum, usque ad Dei vultum per coelestium nuntiorum defertur obsequia. Quae cum ita sint, honoremus beatos martyres, principes fidei, intercessores mundi, praecones regni, cohaeredes Dei.</p><p>11. Quod si dicas mihi: Quid honoras in carne jam resoluta atque consumpta, de qua nulla jam Deo cura est? Et ubi est illud, charissimi, quod ipsa veritas loquitur per Prophetam: Pretiosa, inquit, in conspectu Domini mors sanctorum ejus (Psal. CXV, 15)? et iterum: Mihi autem valde honorificandi sunt amici tui, Deus (Psal. CXXXVIII, 15)? Honorare debemus servos Dei, quanto magis amicos Dei! de quibus alio loco dicitur: Dominus, inquit, custodit omnia ossa eorum, et unum ex his non conteretur (Psal. XXXIII, 21). <strong>Honoro ergo in carne martyris exceptas pro Christi nomine cicatrices, honoro viventis memoriam perennitate virtutis, honoro per confessionem Domini sacratos cineres, honoro in cineribus semina aeternitatis, honoro corpus, quod mihi Dominum meum ostendit diligere, quod me propter Dominum mortem docuit non timere</strong>. Cur autem non honorent corpus illud fideles, quod reverentur et daemones? quod et afflixerunt in supplicio, sed glorificant in sepulcro? Honoro itaque corpus, quod Christus honoravit in gladio, quod cum Christo regnabit in coelo.</p></blockquote><p><a href="https://books.google.com/books?id=aOEm_eS_ZOMC&amp;printsec=frontcover&amp;hl=ru#v=onepage&amp;q&amp;f=false">Patrologia Latina, vol. 16, Ambrose of Milan, Sermon 55, p. 11, col. 718–719</a>, alternative source: <a href="https://la.wikisource.org/wiki/Sermones_S._Ambrosio_hactenus_ascripti#:~:text=10.%20Beata%20anima,regnabit%20in%20coelo.">https://la.wikisource.org/wiki/Sermones_S._Ambrosio_hactenus_ascripti</a></p><p>The relics of the soldier-martyrs Victor, Nabor and Felix were discovered and translated at the beginning of the 4th century by Bishop Maternus of Laus Pompeia (modern Lodi), where they had suffered martyrdom (see: epist. 77. 7; exp. Luc. 7. 178). Their memory was celebrated on 14 May. A basilica on the cemetery at the Porta Vercellina was dedicated to two of them, Nabor and Felix. The relics of the martyr Victor rested in another basilica, which later received the name San Vittore in Ciel d’Oro; at the initiative of St Ambrose, after the discovery of the relics of the martyrs Protasius and Gervasius, the basilica martyrum was added to it and consecrated in 386. Here, to the left of the tomb of St Victor, St Ambrose buried the remains of his brother Satyrus (see epigram 49).</p><blockquote><p><strong>1</strong>. “As I do not wish anything which takes place here in your absence to escape the knowledge of your holiness, you must know that <strong><mark>we have found some bodies of holy martyrs</mark></strong>. For after I had dedicated the basilica, many, as it were, with one mouth began to address me, and said: Consecrate this as you did the Roman basilica. And I answered: ‘Certainly I will if I find any relics of martyrs.’ And <strong>at once a kind of prophetic ardour seemed to enter my heart</strong>.</p><p><strong>2</strong>. Why should I use many words? God favoured us, for even the clergy were afraid who were bidden to clear away the earth from the spot before the chancel screen of SS. Felix and Nabor. I found the fitting signs, and on bringing in some on whom hands were to be laid, the power of the holy martyrs became so manifest, that even whilst I was still silent, one was seized and thrown prostrate at the holy burial-place. <strong>We found two men of marvellous stature, such as those of ancient days</strong>. <strong>All the bones were perfect, and there was much blood</strong>. During the whole of those two days there was an enormous concourse of people. Briefly <strong><mark>we arranged the whole in order, and as evening was now coming on transferred them to the basilica of Fausta, where watch was kept during the night, and some received the laying on of hands. On the following day we translated the relics to the basilica called Ambrosian. During the translation a blind man was healed</mark></strong>.</p><p>&lt;…&gt;</p><p>You know — nay, you have yourselves seen — that <strong><mark>many are cleansed from evil spirits, that very many also, having touched with their hands the robe of the saints, are freed from those ailments which oppressed them; you see that the miracles of old time are renewed</mark></strong>, when through the coming of the Lord Jesus grace was more largely shed forth upon the earth, and that many bodies are healed as it were by the shadow of the holy bodies. How many napkins are passed about! how many garments, laid upon the holy relics and endowed with healing power, are claimed! <strong><mark>All are glad to touch even the outside thread, and whosoever touches will be made whole.</mark></strong></p><p>&lt;…&gt; Let all know what sort of champions I desire, who are able to defend, but desire not to attack. These have I gained for you, O holy people, such as may help all and injure none. Such defenders do I desire, such are the soldiers I have, that is, not soldiers of this world, but soldiers of Christ. I fear no ill-will on account of them, the more powerful their patronage is the greater safety is there in it. And I wish for their protection for those very persons who grudge them to me. <strong>Let them <mark>come, then, and see</mark> my attendants</strong>. I do not deny that I am surrounded by such arms.</p><p>12. The glorious relics are taken out of an ignoble burying-place, the trophies are displayed under heaven. The tomb is wet with blood. The marks of the bloody triumph are present, <strong><mark>the relics are found undisturbed</mark> in their order</strong>, the head separated from the body. Old men now repeat that they once heard the names of these martyrs and read their titles. The city which had carried off the martyrs of other places had lost her own. Though this be the gift of God, yet I cannot deny the favour which the Lord Jesus has granted to the time of my priesthood, and since I myself am not worthy to be a martyr, I have obtained these martyrs for you.</p><p><strong>13</strong>. Let these triumphant victims be brought to the place where Christ is the victim (he is speaking of the altar in the church — note). But <strong>He upon the altar, Who suffered for all; they beneath the altar, who were redeemed by His Passion</strong>. <strong><mark>I had destined this place for myself</mark></strong>, for it is fitting that the priest should rest there where he has been wont to offer, but <strong><mark>I yield the right hand portion to the sacred victims; that place was due to the martyrs. Let us, then, deposit the sacred relics, and lay them up in a worthy resting-place, and let us celebrate the whole day with faithful devotion</mark></strong>.”</p><p><strong>16</strong>. And they who usually do so have a grudge against this solemnity of yours; and since because of their envious disposition they cannot endure this solemnity, they hate the cause of it &lt;…&gt; And the Arians say: “These are not martyrs, and they cannot torment the devil, nor deliver any one,” while the torments of the devils are proved by their own words, and the benefits of the martyrs are declared by the restoring of the healed, and the proof of those that are loosed.</p><p><strong>17</strong>. They deny that the blind man received sight, but he denies not that he is healed. He says: I who could not see now see. He says: I ceased to be blind, and proves it by the fact. They deny the benefit, who are unable to deny the fact. The man is known: so long as he was well he was employed in the public service; his name is Severus, a butcher by trade. He had given up his occupation when this hindrance befel him. He calls for evidence those persons by whose kindness he was supported; he adduces those as able to affirm the truth of his visitation whom he had as witnesses of his blindness. He declares that when he touched the hem of the robe of the martyrs, wherewith the sacred relics were covered, his sight was restored.</p><p><strong>19</strong>. But I ask what it is that they do not believe; is it <strong><mark>whether any one can be aided by the martyrs</mark></strong>? This is the same thing as not to believe Christ, for He Himself said: “Ye shall do greater things than these.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/4Xye_Selected_Works_and_Letters_5#HH-Letter-XXII">Letter 77 (Maur. 22), to his sister</a>)</p><blockquote><p>I thank You, O Christ, for Your new gifts! Protasius and Gervasius, having found their relics, I sing! <strong><mark>The relics were hidden, but not the source of holiness</mark>: holy blood cannot be hidden</strong>, crying out to the Father. Shining from heaven, grace revealed their remains to us, and though we are not martyrs, we have found martyrs. Who will present witnesses for the triumphant faith? <strong><mark>The healing of the madman confesses their deed</mark></strong><mark>. </mark><strong><mark>The blind man who sees the light again will prove the holiness of their death</mark>. Severus is the name of that man, all know his labors! He touched the robe with his hand, wiped his clouded eyes — and suddenly saw the clear light, and <mark>the blindness was scattered</mark></strong>. The people are freed from chains, the service of serpents is ended, now they are free, and they can return home with joy. We have seen, <strong>as of old, the cloths flying up, and from their shadow alone health returned to the sick</strong> (note: he compares healing from relics with healing from the aprons and shadow of the apostle — <a href="https://bibleox.com/en/eng-nkjv/act/19/#L12">Acts 19:12</a>; <a href="https://bibleox.com/en/eng-nkjv/act/5/#L15">Acts 5:15</a>)</p></blockquote><p>(Hymn 13, On the Finding of the Relics of the Holy Martyrs Protasius and Gervasius)</p><blockquote><p>This church Ambrose raised and himself dedicated it to God, giving it the name of the apostles, <strong>placing the holy relics within</strong>.</p></blockquote><p>(Hymns. In the Church of the Holy Martyr Nazarius)</p><blockquote><p>Should we not take our example from the Lord Himself? When He willed it, He suffered, and when they sought Him, they found Him. But when the hour of suffering had not yet come, He passed through the midst of those who sought Him, and they, seeing Him, could not even hold Him. The Lord also clearly showed that each one will be found and taken when He gives His consent, and if the time has not yet come, then even if a servant of God should appear before the eyes of those seeking him, they will not hold him. And <strong>did I myself not go every day either to visit someone or <mark>to venerate the martyrs?</mark></strong></p></blockquote><p>(Letter 75a (Maur. 21a). Against Auxentius on the Handing Over of the Basilicas, 29 March 386)</p><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><p>The quotation does not speak directly of the veneration of relics, but is preserved here because it has an indirect bearing on the subject.</p><blockquote><p>When I was in Rome as a boy and was studying the liberal arts, I, together with my peers and companions, <strong>had the custom on Sundays of visiting the tombs of the apostles and martyrs</strong>, and of often going into the caves dug deep in the earth, in whose walls on both sides lie the bodies of the buried, and in which there is such darkness everywhere that this prophecy is almost fulfilled here: let them go down alive into hell (Ps. 55:15); now and then the light let in from above tempers the horror of the darkness, so that the opening through which it enters might rather be taken for a crack than for a window.</p></blockquote><p>(Commentary on the Prophet Ezekiel)</p><h3>Blessed Augustine Aurelius, bishop of Hippo (354–430)</h3><blockquote><p>The miracle which was wrought at Milan when I was there, and by which a blind man was restored to sight, could come to the knowledge of many; for not only is the city a large one, but also the emperor was there at the time, and <strong><mark>the occurrence was witnessed by an immense concourse of people that had gathered to the bodies of the martyrs Protasius and Gervasius, which had long lain concealed and unknown, but were now made known to the bishop Ambrose in a dream</mark></strong>, and discovered by him. By virtue of these remains the darkness of that blind man was scattered, and he saw the light of day.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/qutD_The_City_of_God_6#HH-Chapter-8-Of-Miracles-Which-Were-Wrought-that-the-World-Might-Believe-in-Christ-and-Which-Have-Not-Ceased-Since-the-World-Believed">The City of God, Book XXII, ch. 8</a>)</p><blockquote><p>Here perhaps our adversaries will say that their gods also have done some wonderful things, if now they begin to compare their gods to our dead men. Or will they also say that they have gods taken from among dead men, such as Hercules, Romulus, and many others whom they fancy to have been received into the number of the gods? But <strong>our martyrs are not our gods; for we know that the martyrs and we have both but one God, and that the same. Nor yet are the miracles which they maintain to have been done by means of their temples at all comparable to <mark>those which are done by the tombs of our martyrs</mark></strong>. If they seem similar, their gods have been defeated by our martyrs as Pharaoh’s magi were by Moses. <strong>In reality, the demons wrought these marvels with the same impure pride with which they aspired to be the gods of the nations; but the martyrs do these wonders, or rather God does them while they pray and assist</strong>, in order that an impulse may be given to the faith by which we believe that <strong><mark>they are not our gods, but have, together with ourselves, one God.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/qutD_The_City_of_God_6#HH-Chapter-10-That-the-Martyrs-Who-Obtain-Many-Miracles-in-Order-that-the-True-God-May-Be-Worshipped-are-Worthy-of-Much-Greater-Honor-Than-the-Demons-Who-Do-Some-Marvels-that-They-Themselves-May-Be-Supposed-to-Be-God">The City of God, Book XXII, ch. 10</a>)</p><h3>St Isidore of Pelusium, monk (c. 350–435)</h3><blockquote><p>If it offends you that <strong><mark>for the love of the martyrs for God and for their constancy we honor the dust of the martyrs’ bodies</mark></strong>, then ask those who have received healing from them, and learn in what sufferings they bestow cures. Then you will not only <strong>not laugh at what we do, but will certainly yourself strive after it</strong>. And if, as you wrote, you refuse to touch dead bones, then loathe the remains of wicked men who became famous for their vices, whom the Greeks buried in the temple of Artemis of Ephesus, honoring the most shameful things and deifying the tombs and corrupt dust of worthless men.</p></blockquote><p>(Letters, Book I, 55. To the Most Illustrious Hierax)</p><h2>7th Ecumenical Council (787)</h2><h3>Theodore, patriarch of Jerusalem</h3><blockquote><p>Yes — God is life and light, and the saints, being in the hand of God, abide in life and light, and therefore precious in the sight of the Lord is the death of His saints (Ps. 116:15). They intercede before God with boldness. <strong><mark>As saving fountains the Lord Christ has given us the remains of the saints, which pour forth manifold benefactions upon the weak, flow with fragrant myrrh and drive away demons</mark></strong>. This is what the great teacher Athanasius says — what “immortal” means: “<strong><mark>the bones of the martyrs drive away diseases, heal the weak, give sight to the blind, cleanse the lepers, scatter temptations and sorrows, and this they do through Christ who dwells in them</mark></strong>.” The psalmist also beautifully sang the same: “God is wonderful in His saints” (LXX 67:36; cf. Ps. 68:35). And again: “(to the saints) who are on His earth, the Lord has made wonderful all His desires in them” (Ps. 16:3).</p></blockquote><p>(Acts of the Seventh Ecumenical Council, copy of the synodal letter of Theodore, patriarch of Jerusalem)</p><h3>Basil, bishop of Ancyra</h3><p>Wishing to be united to the Church at the Council, he pronounces a confession of the Orthodox faith, among whose lines are these on the veneration of relics and icons:</p><blockquote><p>I ask for the intercessions (πρεσβείας) of our spotless Lady the Holy Mother of God, and those of the holy and heavenly powers, and those of all the Saints. <strong><mark>And receiving their holy and honourable reliques with all honour (τιμῆς), I salute and venerate these with honour (τιμητικῶς προσκυνέω), hoping to have a share in their holiness</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-Extracts-from-the-Acts--Session-I">Acts of the Seventh Ecumenical Council</a>)</p><h3>Theodosius, bishop of Amorium</h3><p>He joins the Church with a confession of faith:</p><blockquote><p><strong><mark>Likewise also I venerate and honour and salute the reliques of the Saints as of those who fought for Christ and who have received grace from him</mark></strong> for the healing of diseases and the curing of sicknesses and the casting out of devils, as the Christian Church has received from the holy Apostles and Fathers even down to us to-day.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-Extracts-from-the-Acts--Session-I">Acts of the Seventh Ecumenical Council</a>)</p><h3>Canon 7 of the Seventh Ecumenical Council of Nicaea</h3><blockquote><p>Paul the divine Apostle says: “The sins of some are open beforehand, and some they follow after” (1 Tim. 5:24). These are their primary sins, and other sins follow these. Accordingly upon the heels of the heresy of the traducers of the Christians, there followed close other ungodliness. For as they took out of the churches the presence of the venerable images, so likewise they cast aside other customs which we must now revive and maintain in accordance with the written and unwritten law. <strong><mark>We decree therefore that relics shall be placed with the accustomed service in as many of the sacred temples as have been consecrated without the relics of the Martyrs. And if any bishop from this time forward is found consecrating a temple without holy relics, he shall be deposed, as a transgressor of the ecclesiastical traditions</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-Canon-VII">Seventh Ecumenical Council, Canon 7</a>)</p><h2>14th century</h2><h3>St Gregory Palamas, archbishop of Thessalonica (c. 1296–1357)</h3><blockquote><p>Furthermore, we venerate the holy icon of the Son of God, who became describable, having become man for our sake, raising our veneration from the image to the Prototype; and the precious wood of the Cross, and all the symbols of His suffering, as being Divine trophies against the common enemy of our race; we also venerate the saving sign of the precious Cross and the Divine churches and places and sacred vessels and God-given words because of the God who dwells in them. We also venerate the icons of all the saints because of love for them and for God, whom they sincerely loved and served, raising our mind in their veneration to the persons represented on the icons. <strong><mark>We also venerate the very relics of the saints, because the sanctifying grace has not left their holy bones, just as the Godhead did not depart from the Master’s body in His three-day death</mark></strong>.</p></blockquote><p>(Confession of the Orthodox Faith, 1351)</p>
    <h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo), hierarch (1651–1709)</h3><h4>The Life of the Martyr Boniface (3rd c.), killed in 290</h4><blockquote><p>From one pious man I heard that if anyone has in his house the relics of the martyrs of Christ and venerates them, that man receives help for salvation, and sin does not multiply in his house, so that such a one can even attain that eternal blessedness of which the holy martyrs were counted worthy. Now, they say, many perform feats for Christ, and, giving their bodies over to torments, receive martyrs’ crowns. Do me a service: now the time has come to show you whether you truly have love for me. Rather <strong>go to those lands where persecution against Christians has been raised up, and <mark>try to bring me the relics of one of the holy martyrs, so that I may honorably place them in my house and build a church to that martyr and always have him as my guardian, defender and constant intercessor before God</mark></strong>.</p><p>Having listened to Aglaida, Boniface joyfully agreed to her proposal and expressed complete readiness to set out on the journey.</p><p>&lt;…&gt;</p><p>Taking with him also many slaves, helpers and horses, he prepared for the journey. As he was leaving the house, he said to his mistress, laughing:</p><p>— <strong>And what will happen, mistress, if I find no body of a martyr, and my body, tortured for Christ, is brought to you — will you then receive it with honor?</strong></p><p>Aglaida, laughing, called him a drunkard and a sinner and, reproaching him, said:</p><p>— <strong>Now is not the time, my brother, for mockery, but for reverence</strong>. You must during the journey carefully guard yourself from all disorder and mockery: a holy work must be done honestly and with good order, and on this journey you must remain in humility and abstinence; remember that you are going to serve the holy relics, which we are unworthy not only to touch but even to look upon.</p><p>&lt;…&gt;</p><p>Boniface took his mistress’s command to heart and set out on the journey, <strong>pondering in his mind what he would have to touch with his defiled, sinful hands</strong>. Boniface began to grieve over his former sins and <strong>decided to fast: not to eat meat, not to drink wine, but to pray earnestly and often, so as to come to the fear of God</strong>.</p><p>&lt;…&gt;</p><p>Blessed Boniface looked attentively at all this, now marveling at the courageous patience of the martyrs, now desiring the same crown for himself; then, filled with Divine zeal and standing in the middle of that place, <strong>he began to embrace all those who had shown themselves to be martyrs</strong>, of whom there were already about twenty, and, in the hearing of all, cried out loudly:</p><p>— Great is the God of the Christians! Great is He, for He helps His servants and strengthens them in such great torments!</p><p>Having said this, he <strong>again began to kiss the martyrs and with love to kiss their feet</strong>, and those who had no feet, the remaining parts of the body, embracing the martyrs, he pressed them to his breast, calling them blessed, because, having endured brief torments courageously, they would at once receive eternal rest, consolation and endless joy; at the same time Boniface prayed for himself, that he too might be a companion of the martyrs in such a contest and a partaker of the crown which they receive from the Author of the contest — Christ.</p><p>&lt;…&gt;</p><p>And at once ordering him to be seized and brought to him, he asked:</p><p>— Who are you?</p><p>— A Christian! — answered the saint.</p><p>But the judge wanted to know his name and origin. Answering this, the saint said:</p><p>— The first and most beloved name of mine is Christian; I have come here from Rome, and if you wish to know also the name given me by my parents, my name is Boniface.</p><p>&lt;…&gt;</p><p>— Lord God, <strong><mark>Jesus Christ</mark></strong>, who strengthened me in the sufferings I have endured, abide now also with me, lightening my sufferings. <strong><mark>You are my only consolation</mark></strong>: grant me a clear sign that You are helping me to overcome Satan and this unrighteous judge; for Your sake, as You Yourself know, I suffer.</p><p><strong>Having finished this prayer, Boniface <mark>turned also to the holy martyrs with a request that they, by their prayers, help him</mark> to endure the terrible torment</strong>.</p><p>&lt;…&gt;</p><p>Those present at the tortures, seeing such cruelty, shuddered and began to exclaim:</p><p>— Great is the God of the Christians! Great is the King — Christ! We all believe in You, Lord!</p><p>&lt;…&gt;</p><p>Having prayed thus, Boniface bowed his head under the sword and was beheaded; from his wound blood flowed out together with milk. The unbelievers, <strong><mark>seeing this miracle, turned at once to Christ — about 550 in number — and, leaving the vile idols, joined the faithful</mark></strong>. Such was the end of St Boniface, who, setting out from home on the journey, had laughing foretold to his mistress what he actually proved and accomplished in deed.</p><p>&lt;…&gt;</p><p>And conversing among themselves, they recalled Boniface’s former character, mocked him and said:</p><p>— Will a drunkard and a profligate suffer for Christ?!</p><p>But the brother of the commentariensis insisted on his own:</p><p>— By appearance, a man such as you describe was indeed tortured at the trial yesterday and the day before — he said — but what prevents you? Go and see for yourselves his body lying in the place where he was beheaded.</p><p>They went after that man, came to the place of execution, where a military guard stood so that the bodies of the martyrs would not be stolen by Christians. The man walking ahead pointed out to them the beheaded martyr lying there and said:</p><p>— Is this not the one you are looking for?</p><p><strong>When they saw the body of the martyr, they at once began to recognize their friend, and when his head, which lay apart, was placed to the torso, they became completely certain that this was Boniface</strong>, and they were greatly amazed, and at the same time began to feel shame.</p><p>&lt;…&gt;</p><p>Then they gave the wicked men 500 gold coins and <strong><mark>took the body and head of St Boniface, anointed them with fragrant ointments, wrapped them in clean shrouds and, placing them in a coffin, set off for home, carrying the body of the martyr to their mistress</mark></strong>. When they were approaching Rome, the Angel of God appeared in a dream to Aglaida and said:</p><p>— Prepare to receive him who was formerly your servant, but has now become our brother and fellow servant; receive him who was a slave to you, and will now be your master, and venerate him with reverence, because he is the guardian of your soul and the defender of your life.</p><p>She, waking up, was terrified, <strong><mark>and at once taking several respected church clerics, went out to meet the holy martyr</mark> Boniface, whom she had earlier sent on the journey as a slave, and on his return received into her house with reverence and tears as a master</strong>. And she remembered the prophecy which the saint had uttered when setting out on the journey, and thanked God, who had so arranged that St Boniface, for his own and her sins, became a sacrifice acceptable to God. On her estate, situated 50 stadia from Rome, <strong><mark>Aglaida built a wonderful church in the name of the holy martyr Boniface, and in it placed the holy relics</mark>, after many <mark>miracles had already begun to be performed through the prayers of the martyr</mark>, manifold healings flowed for the sick, demons were cast out of people, and many who prayed at the saint’s tomb received the fulfillment of their petitions</strong>.</p><p>Afterwards the blessed Aglaida herself, having distributed all her property to the poor and needy, renounced the world, and, having lived another 18 years in great repentance, <strong><mark>died in peace and was joined to the holy martyr Boniface, being laid next to his tomb</mark></strong></p></blockquote><p>(The Suffering of the Holy Martyr Boniface)</p><h4>The Life of the Martyr Minas (c. 285–304), Asia Minor</h4><blockquote><p>The soldiers took the holy martyr Minas and led him outside the city, where they cut off his head, and having kindled a great fire, they threw the much-suffering body of the holy martyr into it.</p><p><strong>Some of the faithful, however, when the fire had gone out, came to this place and <mark>collected the parts of the saint’s relics left over from the burning</mark>, and, wrapping them in a clean shroud, anointed them with aromas. After a little time they <mark>brought these holy remains</mark> to their native city of Alexandria, where they <mark>buried them in an honorable place. Later a church was built on this place</mark></strong> in the name of the holy martyr, and through prayers to the saint many miracles were performed in it.</p></blockquote><p>(The Suffering of the Holy Great Martyr Minas)</p>
    <h4>The Life of Adrian and Natalia (early 4th c.)</h4><blockquote><p>“Having heard of this command of the king, blessed Natalia secretly took <strong>the hand of her husband</strong> (which the executioner had just cut off — note) and hid it with herself, so that it would not be burned.</p><p>When the servants of the torturer had kindled the furnace and were carrying the bodies of the holy martyrs out of the prison for burning, St Natalia and the other pious women followed them and <strong>gathered the martyrs’ blood into their costly clothes and bands and, keeping it with themselves</strong>, anointed their bodies with it. Besides this, they <strong>bought from the servants with money even their clothes, stained with the blood of the martyrs</strong>.</p><p>&lt;…&gt;</p><p><strong>Give us the bodies of the holy martyrs</strong>, we will carry them to a ship, take them away from here with us, and keep them there until the death of the impious king Maximian; after his death, if we are alive, we will return and <strong>bring the bodies of the saints back here, <mark>so that they may be venerated by all</mark></strong>. But if they remain here now, <strong>the king will again order them to be burned, and you will be betrayers of the bodies which God preserved from burning by means of rain</strong>.</p><p>All agreed and carried the bodies of the martyrs to the ship, to send them to Byzantium;</p><p>&lt;…&gt;</p><p>Meanwhile St Natalia lived in her house, <strong>having with her the hand of her beloved husband, St Adrian, which she, having anointed it with precious myrrh and wrapped it in purple, placed at the head of her bed</strong>, of which none of her household knew.</p><p>&lt;…&gt;</p><p>Waking from sleep, St Natalia at once <strong>left everything and, taking only the hand of St Adrian</strong>, went out of the house</p><p>&lt;…&gt;</p><p>A favorable wind blew. The travelers arrived at Byzantium before dawn and put in at the shore, near which was <strong><mark>the church where the bodies of the holy martyrs had been placed</mark></strong>, and they disembarked with joy.</p><p>Coming into the church to the bodies of the holy martyrs, St Natalia with inexpressible joy fell upon them, kissing them and shedding tears of joy; <strong>having placed the hand of St Adrian to his body</strong>, she knelt and prayed for a long time.”</p></blockquote><p>(The Suffering of the Holy Martyrs Adrian and Natalia)</p><h4>The Life of the Martyr Uar (late 3rd – early 4th c.), Egypt</h4><blockquote><p>A certain pious widow named Cleopatra, a native of Palestine — whose husband had been a military commander in Egypt, and who had a son, still a little boy, named John — with sorrow <strong>looked from afar at the sufferings of Uar. When the body of the saint was thrown outside the city, she at night took with her several of her slaves and secretly carried away the much-suffering body of St Uar; having brought it to her house, she dug a grave for him in her bedroom, before her bed, and laid him there</strong>.</p><p>The next morning the governor brought the other sufferers out of prison and, after tormenting them for a long time, cut them down with the sword and <strong>threw them outside the city unburied; their bodies also, at night, some secret confessors of the Christian faith gave over to burial. Cleopatra, however, all the time burned candles over the grave of St Uar and offered incense, <mark>venerating him as her great intercessor and advocate before God</mark></strong>.</p><p>&lt;…&gt;</p><p>The governor, having accepted the gift, allowed her to take away the body of her husband, and she, taking instead of it the relics of St Uar, brought them as a precious treasure from Egypt to Palestine and in her village called Edra, which was near Tabor, laid them with her ancestors. <strong>Every day she went to the tomb of the saint, offered incense there and placed candles, and, following her example, other Christians living there also began to come with her to the tomb of the saint and to bring their sick there, who, through the prayers of St Uar, <mark>received healings at his tomb</mark></strong>. And the fame of St Uar spread through all the surrounding places, and all with faith flocked to his tomb.</p><p>Cleopatra, seeing that Christians gathered for prayer at the tomb of the saint, decided to build a church in his name and began to put her decision into effect.</p><p>&lt;…&gt;</p><p>When the building of the church was finished, Cleopatra summoned bishops, priests and monks and, <strong>taking the honorable relics of the holy martyr from the grave, laid them on a precious bier</strong>, and above the relics — the belt and military garment with which her son was to be clothed, so that they might be sanctified by contact with the relics of the saint; at the same time she earnestly besought the saint to be a helper to her son, whom all the assembled hierarchs and priests blessed. A countless multitude of Christians also gathered there, and <strong><mark>the bier with the relics was carried to the church</mark></strong> — Cleopatra with her son also carried the relics. <strong><mark>After the consecration of the church, the relics of the saint were placed beneath the altar, at which they began to celebrate the Divine Liturgy</mark></strong>. And Cleopatra, falling down before the relics of St Uar, prayed in these words:</p><p>— <strong><mark>I pray to you, passion-bearer of Christ, ask for me from God</mark> what will be pleasing to Him and profitable for me</strong>, and also for my only son; I have nothing more to ask than what the Lord Himself wills; He Himself knows what is profitable for us, and may His good and perfect will be done in us!</p><p>&lt;…&gt;</p><p>Having spent seven years in such labors, blessed Cleopatra departed, having pleased God. <strong><mark>Her body was laid in the church of St Uar, near the body of her son John</mark></strong>, and her holy soul together with St Uar and John stands in gladness before God in heaven, to whom be glory for ever and ever, amen.</p></blockquote><p>(The Suffering of the Holy Martyr Uar and with Him the Seven Christian Teachers, and the Commemoration of Blessed Cleopatra and Her Son John)</p><h4></h4>
