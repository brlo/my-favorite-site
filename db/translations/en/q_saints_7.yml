    <p>Besides the quotations, see also <a href="https://bibleox.com/en/en/w/Bu3i_Christian_Burials_and_Inscriptions">funerary inscriptions</a>.</p>
    <h2>2nd century</h2>
    <h3>St Hippolytus of Rome, hieromartyr (c. 170–235)</h3>
    <p>The “Commentary on the Book of the Prophet Daniel” was written by the hieromartyr Hippolytus of Rome in 203–205. It consists of 4 books. What is quoted here is not only an address to the martyrs but also a request for help:</p>
    <blockquote><p>XXX. <strong>Tell me, then, you <mark>three youths</mark></strong> — <strong><u><mark>I beseech you</mark></u><mark>, remember me</mark></strong>, <strong><mark>that I too with you may be counted worthy to obtain the same martyr’s lot</mark></strong> — who was this fourth who walked with you in the furnace and who, as it were, with one mouth together with you glorified God? Describe to us his form and beauty, that we too may recognize him when we see Him incarnate.</p></blockquote>
    <p>(Commentary on the Book of the Prophet Daniel, Book 2, XXX)</p>
    <p>In that historical period this was the most classical form of address to the saints. Ancient Christians used similar addresses at <a href="https://bibleox.com/en/en/w/Bu3i_Christian_Burials_and_Inscriptions">burial places</a> with prayerful appeals to departed Christians, with requests for their prayers and help. With a similar request the prudent thief turned to Christ (<a href="https://bibleox.com/en/eng-nkjv/lk/23/#L42">Luke 23:42</a>).</p>
    <p>Before this there is an address to the deceased king Nebuchadnezzar, but St Hippolytus asks him for no help and no intercession for himself: “<em>XXVII. &lt;…&gt; Tell me, Nebuchadnezzar, for what purpose, exactly, do you order them to be cast into the fire bound? Is it not so that they might not run away, or that with their bound feet they might not be able to quench the fire?</em>”.</p>
    <h2>3rd century</h2>
    <h3>Author of the papyrus with a prayer to the Mother of God (c. 250)</h3>
    <p>Some date the papyrus to the middle of the 3rd century, sometimes 250–300; others define the dating more broadly: the 3rd–4th centuries.</p>
    <blockquote><p><em>Under thy mercy we take refuge, O Mother of God. Do not despise our petitions in sorrows, but deliver us from troubles, O only pure (ἁγνή), only blessed (εὐλογημένη).</em></p></blockquote>
    <p>(The John Rylands Papyrus No. 470)</p>
    <h3>Origen (c. 185–254)</h3>
    <p>The souls of the departed saints pray for those who pray (with reference to <a href="https://bibleox.com/en/eng-nkjv/1tim/2/#L5">1 Tim. 2:5</a>):</p>
    <blockquote><p>But not only does Christ the High Priest pray with those who pray aright, but the angels also, who <em>rejoice in heaven over one sinner who repents more than over ninety-nine righteous people who need no repentance</em> (Luke 15:7). <strong><mark>The souls of the departed saints</mark> also <mark>pray for those who pray</mark></strong>.</p></blockquote>
    <p>(On Prayer, 11)</p>
    <h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3>
    <p>He addresses the martyrs and hopes for their intercession:</p>
    <blockquote><p><strong>O blessed ones!</strong> and such as truly have your sins remitted, if, however, you who are Christ’s peers ever have sinned! O blessed ones! whom the blood of the Lord has dyed from the beginning of the world, and whom such a brightness of snowy clothing has deservedly invested, and the whiteness of the enfolding robe has adorned! Finally, I myself seem to myself to behold already, and, as far as is possible to the mind of man, that divine and illustrious thing occurs to my eyes and view. I seem, I say to myself, already to behold, that that truly noble army accompanies the glory and the path of their Christ. The blessed band of victors will go before His face; and as the crowds become denser, the whole army, illuminated as it were by the rising of the sun, will ascribe to Him the power. And would that it might be the lot of such a poor creature as myself to see that sight! <strong>But the Lord can do what He is believed <mark>not to deny to your petitions</mark>.</strong></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-on-the-glory-of-martyrdom">On the Glory of Martyrdom</a>)</p>
    <p>The saints in heaven care for the salvation of those living on earth:</p>
    <blockquote><p>It is for him to wish to remain long in the world whom the world delights, whom this life, flattering and deceiving, invites by the enticements of earthly pleasure. Again, since the world hates the Christian, why do you love that which hates you? and why do you not rather follow Christ, who both redeemed you and loves you?</p><p>&lt;…&gt;</p><p>We should consider, dearly beloved brethren — we should ever and anon reflect that we have renounced the world, and are in the meantime living here as guests and strangers. Let us greet <strong>the day which assigns each of us to his own home, which snatches us hence, and sets us free from the snares of the world, and restores us to paradise and the kingdom</strong>. Who that has been placed in foreign lands would not hasten to return to his own country? Who that is hastening to return to his friends would not eagerly desire a prosperous gale, that he might the sooner embrace those dear to him? We regard paradise as our country — we already begin to consider the patriarchs as our parents: <strong>why do we not hasten and run, that we may behold our country, that we may greet our parents? There a great number of our dear ones is awaiting us, and a dense crowd of parents, brothers, children, is longing for us, already assured of their own safety, and still <mark>solicitous for our salvation</mark>.</strong> To attain to their presence and their embrace, what a gladness both for them and for us in common! What a pleasure is there in the heavenly kingdom, without fear of death; and how lofty and perpetual a happiness with eternity of living! There the glorious company of the <strong>apostles</strong> — there the host of the rejoicing <strong>prophets</strong> — there the innumerable multitude of <strong>martyrs</strong>, crowned for the victory of their struggle and passion — there the triumphant <strong>virgins</strong>, who subdued the lust of the flesh and of the body by the strength of their continency — there are <strong>merciful men</strong> rewarded, who by feeding and helping the poor have done the works of righteousness — who, keeping the Lord’s precepts, have transferred their earthly patrimonies to the heavenly treasuries. To these, beloved brethren, let us hasten with an eager desire; let us crave quickly to be with them, and quickly to come to Christ.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-on-the-mortality">On the Mortality</a>)</p>
    <p>The hieromartyr Cyprian points to the unity of the earthly and heavenly Church, calling Christians on both sides (from earth and from heaven) to continue praying for one another. Requests to the saints in heaven are the same as requests to Christians living on earth:</p>
    <blockquote><p>Let us remember one another in concord and unanimity. Let us <strong><mark>on both sides</mark> <mark>always pray for one another</mark></strong>. Let us relieve burdens and afflictions by mutual love, <strong><mark>that if any one of us, by the swiftness of divine condescension, shall go hence the first, our love may continue in the presence of the Lord, and our prayers</mark></strong> <strong><mark>for our brethren and sisters</mark></strong> not cease in the presence of the Father’s mercy.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Cornelius-in-Exile-Concerning-His-Confession">Epistle to Cornelius in Exile Concerning His Confession</a>)</p>
    <h3>St Alexander of Alexandria, patriarch (c. 250–326)</h3>
    <blockquote><p>So once, when they were celebrating the holy service <strong>in the church of the holy apostles Peter and Paul</strong> on the day of their memory, which is the fifth day of the month Epip, the most blessed woman stood <strong>before the sanctuary and gave herself to prayer</strong>, saying: “God Almighty, who grantest what we ask, Thou who didst hear Thy handmaid Anna and didst grant her the prophet Samuel, whom in her turn she gave to Thy holy temple — hearken also to my supplication; grant me fruit, and let it remain Thy servant for ever.” After this she came forward and partook of the Holy Mysteries, filled with the fear of God.</p><p>The following night she saw a dream, which she told her husband. “I saw,” she said, “before me two men in radiant garments, like the garments of our father the Patriarch. At the sight of them I was greatly afraid. They said to me: ‘<strong><mark>Fear not, we are those at whose place thou didst yesterday pray to God, we are Peter and Paul. We have brought thy prayers to God, the Lord has heard them and has had compassion on thee, O righteous woman. Therefore tomorrow rise early in the morning and go to the archbishop. Let him pray for thee</mark></strong>, and what thou askest shall soon be granted to thee.’ — And so I have told thy holiness what I saw in the dream. Therefore, if thou art so pleased, I will go to the archbishop, and I believe that, if he prays for me, God will fulfil my petition.” The priest answered her: “The Lord be with thee!”</p><p>So she rose early in the morning and went to the gates of the Patriarchate, from where she sent a subdeacon to the archbishop, saying to him: “Tell my father the archbishop that I would like to kiss his holy feet.” The subdeacon conveyed these words, and the archbishop ordered her to be brought in. She kissed his holy feet. The archbishop said to her: “What is the matter with thee, my daughter, and whence art thou?” — She answered: “I am the wife of thy servant Theodosius, a priest, though I am unworthy of it. The Lord has deprived me of the fruit of my womb because of my sins. Therefore I beseech thy holiness to pray for thy handmaid, and I believe that the Lord will grant me fruit which will be pleasing to the Lord.” Then the Patriarch answered her: “Let it be as thou believest! May the Lord fulfil thy petition, as He fulfilled the petition of Anna, the mother of the prophet Samuel.” Then he blessed her, and she departed in peace.</p><p>Soon after this she conceived and brought forth a son. This was reported to the archbishop, who said: “Give him the name of Peter, the chief of the apostles, for I believe that he will become a faithful bulwark of the Orthodox faith and an intercessor for all Christians.”</p><p>&lt;…&gt;</p><p>The grace of God rested upon St Peter. Therefore he was called to various degrees of service, up to the priesthood, by the archbishops of Alexandria, including St Theonas, whom he succeeded on the archiepiscopal throne. O how many healings the Lord granted through the prayers of St Peter for the purity of his body, his soul, and his mind.</p><p>&lt;…&gt;</p><p>I <strong>did not at all seek to exaggerate the glory of this saint</strong>, I sought only to bring benefit to us who speak and to you who listen, for <strong><mark>he himself has already received ineffable honours in heaven. May we too be deemed worthy, through his holy prayers</mark></strong>, to deserve the same honours, finishing our life in purity to the glory of the Father and of the Son and of the Holy Spirit, the Giver of life, now and ever, and unto the ages of ages! Amen.</p></blockquote>
    <p>(Encomium on St Peter)</p>
    <h3>St Methodius of Olympus, bishop of Patara, hieromartyr (c. 260–312)</h3>
    <blockquote><p>Hail to thee for ever, <strong><mark>thou virgin mother of God, our unceasing joy, for unto thee do I again return</mark></strong>. Thou art the beginning of our feast; thou art its middle and end; the pearl of great price that belongest unto the kingdom; the fat of every victim, the living altar of the bread of life. Hail, thou treasure of the love of God. Hail, thou fount of the Son’s love for man. Hail, thou overshadowing mount (Hab. 3:3) of the Holy Ghost. Thou gleamedst, sweet gift-bestowing mother, of the light of the sun; thou gleamedst with the insupportable fires of a most fervent charity, bringing forth in the end that which was conceived of thee before the beginning, making manifest the mystery hidden and unspeakable, the invisible Son of the Father — the Prince of Peace, who in a marvellous manner showed Himself as less than all littleness. Wherefore, <strong><mark>we pray thee</mark>, the most excellent among women, who boastest in the confidence of thy maternal honours, that thou wouldest unceasingly keep us in remembrance. O <mark>holy mother of God</mark></strong>, remember us, I say, who make our boast in thee, and who in hymns august <strong><mark>celebrate</mark></strong> the <strong><mark>memory</mark></strong>, which will ever live, and never fade away. And <strong>do thou also, O honoured and venerable <mark>Simeon</mark>, thou earliest host of our holy religion, and teacher of the resurrection of the faithful, <mark>be our patron and advocate</mark> with that Saviour God</strong>, whom thou wast deemed worthy to receive into thine arms. We, together with thee, sing our praises to Christ, who has the power of life and death, saying, Thou art the true Light, proceeding from the true Light; the true God, begotten of the true God; the one Lord, before Thine assumption of the humanity; that One nevertheless, after Thine assumption of it, which is ever to be adored; God of Thine own self and not by grace, but for our sakes also perfect man; in Thine own nature the King absolute and sovereign, but for us and for our salvation existing also in the form of a servant, yet immaculately and without defilement. For Thou who art incorruption hast come to set corruption free, that Thou mightest render all things uncorrupt. For Thine is the glory, and the power, and the greatness, and the majesty, with the Father and the Holy Spirit, for ever. Amen.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/methodius-oration-concerning-simeon-and-anna">Oration Concerning Simeon and Anna</a>) (Spuria)</p>
    <h2>4th century</h2>
    <h3>St Ephrem the Syrian, monk (c. 306–373)</h3>
    <blockquote><p>Victorious martyrs, who voluntarily endured sorrows out of love for God and the Saviour and <strong><mark>who have boldness before the Master Himself, intercede, O saints, for us, the weak and sinful</mark></strong>, and full of sloth — may the grace of Christ come upon us and enlighten the hearts of all the slothful, that we may love the Lord.</p><p>…</p><p>They accomplished their feat with boldness, and do thou accomplish thy hidden feat, so that on the day of reward thou too mayest receive a crown with them and become a co-heir with them in the Kingdom, rejoicing for ever and ever.</p><p><strong><mark>Pray now, O saints, also for the sinner who falls asleep during such a benefit of God toward him, that he too may be deemed worthy of mercy</mark></strong> at that hour when the secret things of men shall be revealed.</p><p>…</p><p>And I, the weak one, strengthened by you, sang with love before your holy remains. <strong><mark>Therefore do you also be intercessors for me, the weak one, before the throne of God, that through your prayers I too may be found saved</mark></strong>, by the grace of our Lord and Saviour Jesus Christ.</p></blockquote>
    <p>(Works, Encomium on the Martyrs)</p>
    <blockquote><p>Therefore even after death they act as living: they heal the sick, cast out demons, and by the power of the Lord repel every wicked influence of their tormenting dominion.</p></blockquote>
    <p>(Encomium on the Glorious Martyrs Who Suffered Throughout the Whole World)</p>
    <h3>St Cyril of Jerusalem, bishop (315–386)</h3>
    <blockquote><p>9. Then <strong><mark>we commemorate also those who have fallen asleep before us</mark></strong>, first <strong><mark>Patriarchs, Prophets, Apostles, Martyrs, that at their prayers and intercessions God would receive our petition</mark></strong>. Then on behalf also of the Holy Fathers and Bishops who have fallen asleep before us, and in a word of all who in past years have fallen asleep among us, believing that it will be a very great benefit to the souls, for whom the supplication is put up, while that holy and most awful sacrifice is set forth.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-3#HH-On-the-Mysteries-V--On-the-Sacred-Liturgy-and-Communion">The Catechetical Lectures, Mystagogical Catechesis 5</a>)</p>
    <h3>St Gregory of Nyssa, bishop (c. 331–394)</h3>
    <p>In a church with the relics of St Theodore the Recruit († 306), Bishop Gregory delivers a sermon. Here there is an icon of the Lord Jesus Christ and of Theodore the Recruit himself. Here lie the relics of the saint. He speaks of prayer to the saint and of his intercession for us.</p>
    <blockquote><p>But who will enter any place like this, <strong>where we have gathered today, where the memory of the righteous is celebrated and where his holy remains are</strong> — he will first comfort his soul with the splendour of what presents itself to his eyes, <strong>seeing this house as a temple of God</strong>, brightly adorned and with the grandeur of its building and the beauty of its ornaments, where the carver gave the wood the appearance of various animals, and the stonecutter brought the stone slabs to the smoothness of silver. And the painter adorned it with artificial flowers, <strong>depicting on the icon the valiant deeds of the martyr, his firm standing at the trial, his torments, the beast-like faces of the torturers, their violent actions, the furnace burning with flame, the most blessed end of the ascetic, the depiction of the human form of Christ, the Author of the contest</strong>; having skilfully drawn all this for us in colours, as in a kind of explanatory book, he clearly <strong>told of the deeds of the martyr and brightly adorned the church</strong>, as a flowering meadow (for painting too knows how to speak silently <strong>on the walls</strong> and to bring the greatest benefit). And the craftsman who laid the variegated stones made the floor trodden underfoot worthy of the event described.</p><p>Having comforted his eyes with these sensible works of art, (the visitor of the church) <strong>desires at last to draw near to the reliquary too, counting the very touch of it a sanctification and a blessing</strong>. <strong>If anyone is permitted to take earth lying on the surface of the place of his repose, he receives that dust as a gift and gathers the earth as a treasure</strong>. If <strong>fortune grants anyone the opportunity to touch the very remains</strong>, how desirable this is and of what lofty prayer it is accounted a gift, those know who have experienced it and who themselves were animated by this desire. Those who look upon them <strong>kiss them as a body most living and flourishing with life, bringing them to the eyes, the mouth, the ears, to all the senses</strong>; then, shedding tears of reverence and heartfelt compunction, <strong><mark>they offer prayer for intercession</mark></strong>, as to the <strong><mark>martyr</mark></strong> himself visibly present in his entirety, <strong><mark>imploring him as a warrior of God</mark></strong>, calling upon him as one who receives the gifts (of prayer) when he pleases. From all this understand, pious people, that “precious in the sight of the Lord is the death of His saints” (Ps. 115:6 LXX = 116:15). For <strong>the body is one and the same in all men, being composed of one and the same substance; but one dies a simple death, is cast down as it happens; the other, graced by martyrdom, is so beloved and desirable to all</strong>, as we have said above.</p><p>&lt;…&gt;</p><p>When, after many sufferings, (the martyr) appeared as a man fully ripe in confession and piety, a judicial sentence is pronounced over him and an order goes forth to deliver him to the fire; so by a fair and blessed path he <strong>departed to God</strong>, and left us an edifying memory of his feat, <strong>gathering the peoples, <mark>instructing the church, driving out demons, bringing down peaceful angels, obtaining for us from God what is profitable</mark>, making this place a hospital for various diseases</strong>, a haven for those tossed by sorrows, an abundant treasury for the poor, a convenient inn for travellers, <strong>a constant place of festival for those who celebrate</strong>. For, <strong>though we honour this day with yearly festivals, the zeal of the multitude hastening here never ceases</strong>, but the road leading here is like a path strewn with ants; some go forward, others give place to the newly arriving.</p><p>We, O blessed one, having completed the yearly cycle by the love of the Creator for man, <strong>have gathered for the celebration in thy honour a sacred assembly of lovers of martyrs</strong>, worshipping the common Master and <strong>performing the victorious remembrance of thy deeds</strong>. And thou, the president of the feast, (for we call upon thee who hast summoned us), draw near to us, <strong>wherever thou art, whether thou dwellest in the ethereal height or goest round some heavenly vault, whether thou standest before the Master together with the choirs of angels, or, as a faithful servant, worshippest Him together with the Powers and Authorities</strong> — leaving for a little while the things above, <strong>come, as an invisible friend, to those who honour thee</strong>; look upon what is happening here, that thou mayest double thy gratitude to God, who for one suffering and one pious confession has given thee such rewards, and mayest rejoice for the (shed) blood and the trial by fire; for as many spectators of thy execution as there were then, <strong>so many servants of thy honour are there now with thee</strong>. We stand in need of many benefits; <strong><mark>pray for the fatherland before the common King of all</mark></strong>; for the fatherland of a martyr is the country where he suffered, and his fellow-citizens and kinsmen are those who buried him, who have his body, who honour him. We foresee sorrows; we expect dangers; the terrible Scythians are not far off, who plotted war against us; as a warrior <strong><mark>fight for us, as a martyr show (prayerful) boldness (before God) for those who serve Him together with thee</mark></strong>. Though thou hast passed from this life, yet <strong>thou knowest the sufferings and needs of mankind</strong>; ask for us peace, that these festivals may not cease, that the fierce and unrestrained barbarian may not triumph over the churches and altars, that the defiler may not trample upon holy things. For we also <strong><mark>count it thy benefaction that we have been preserved unharmed until now</mark></strong>; we ask of thee safety for the future too. And if there should be need of greater prayerful intercession, <strong><mark>gather the choir of thy brother martyrs and pray with them all</mark>: <mark>let the prayers of many righteous men loose the sins of peoples and tribes</mark></strong>. <strong><mark>Remind Peter of us, stir up Paul, and John the Theologian</mark></strong> and the beloved disciple, <strong><mark>that they may take care for the churches</mark></strong> which they established, for which they bore bonds, for which they faced dangers and death.</p></blockquote>
    <p>(Encomium on the Great Martyr Theodore (the Recruit))</p>
    <h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3>
    <blockquote><p>Knowing these things, therefore, <strong><mark>let us neither despise the prayers of the Saints, nor throw everything upon them</mark></strong>: that we may not, on the one hand, be indolent and live carelessly; nor on the other deprive ourselves of a great advantage. But <strong><mark>let us both beseech them to pray and lift up the hand for us</mark></strong>, and let us adhere to virtue; that we may be able to obtain the blessings promised to those who love Him by the grace and loving-kindness of our Lord Jesus Christ, with whom, &amp;c.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-thessalonians#HH-1-Thessalonians-11-3">Homilies on First Thessalonians, 1</a>). Translator’s note: the English translation abbreviates the concluding doxology as “with whom, &amp;c.”; the Russian text reads: “with whom to the Father, together with the Holy Spirit, be glory, dominion, and honour, now and ever, and unto the ages of ages. Amen.”</p>
    <blockquote><p>How greatly Paul grieved for the Jews, who said: “Brethren! my heart’s desire and prayer to God for Israel is that they may be saved” (Rom. 10:1), and yet did his prayer help them? Not at all. But why do I speak of prayer, when he even desired to be cut off from Christ for their sake (Rom. 9:3)? So then, are <strong><mark>the prayers of the saints useless? No; on the contrary, they have great power, if thou too cooperatest with them</mark></strong>. Thus Peter raised Tabitha not only by his prayer, but also because she was distinguished by mercy (Acts 9:36). So too the saints helped others by their prayers. But this happens here, where labours and struggles still continue; there, however, there is nothing of the kind, and salvation depends only on deeds.</p></blockquote>
    <p>(Homily 17 on Psalm 48, 5)</p>
    <blockquote><p>Since on the coming day too the spiritual celebration must continue among us, let us show the same zeal again, so that, as today we see her, the Christ-loving one, together with the city, we may tomorrow contemplate the God-loving king coming with his army and offering to God the same sacrifice of reverence, zeal, and faith; and, <strong><mark>taking the holy martyrs as partakers of our prayers</mark></strong>, let us entreat them for long life, hoary old age, for children and children’s children, and before all this, for the continuation of this zeal, the increase of reverence, and such an end of the present life that we may reign with the Only-begotten Son of God through the endless ages.</p></blockquote>
    <p>(Eleven Homilies, Homily 2)</p>
    <blockquote><p>May God grant that <strong><mark>through the prayers of the saints</mark></strong> both those who have gone astray may turn to salvation, and you may have success in this fishing, and those very blasphemers (the Jews), leaving their impiety, may come to know Christ, crucified for them, that we all with one heart and one mouth may glorify the God and Father of our Lord Jesus Christ, to whom be glory and dominion together with the Holy Spirit unto the ages of ages. Amen.</p></blockquote>
    <p>(Against the Jews, Discourse 4)</p>
    <blockquote><p>For better it is that he should amend through being reproached here, than that he should be put to shame, and punished, in the presence of the whole assembled universe, on that Day, when our sins shall be revealed to the eyes of all men! But God forbid that any in this fair assembly should appear there suffering such things! but <strong><mark>by the prayers of the holy fathers</mark></strong>, correcting all our offences, and having shown forth the abundant fruit of virtue, may we depart hence with much confidence, through the grace and lovingkindness of our Lord Jesus Christ, through whom, and with whom, be glory to the Father together with the Holy Spirit, for ever and ever. Amen.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-the-homilies-on-the-statues-to-the-people-of-antioch-2#HH-Homily-VI">Homilies on the Statues, 6</a>)</p>
    <blockquote><p>And now God is not lacking a Deborah, God is not lacking a Jael. <strong><mark>We too have the Holy Virgin and Mother of God Mary, who intercedes for us</mark></strong>. If an ordinary woman conquered, how much more will the Mother of Christ put to shame the enemies of the truth? <strong>Having put on the whole armour, that enemy thought that this was a woman worthy of laughter, and yet he found (in her) a rival commander</strong>. He did not think that he was already standing near the grave, and yet the grave had already been found for him; he considered that woman, so to speak, dead, and yet by her he was then put to death. <strong><mark>We have our Lady — the Holy Mary, the Mother of God; but we also need the prayers of the apostles. Let us say to Paul, as his contemporaries said to him: “Come over to Macedonia and help us” (Acts 16:9). We have the apostles, then let us not be numb with fear! We have our Lady — the Theotokos, the Holy Ever-Virgin Mary, then let us not be afraid! We have a host of martyrs, then let us not be negligent! Let us not only entreat</mark></strong>, but, if we deem it necessary, also fast.</p><p>&lt;…&gt;</p><p>And I have already said, and I say again: <strong><mark>let us entreat the Holy and Glorious Virgin and Mother of God Mary; let us call upon the holy and glorious apostles; let us call upon the holy martyrs!</mark></strong> &lt;…&gt; let us be friends of the martyrs not out of necessity, but out of love.</p></blockquote>
    <p>(Homily on the Fact that There Is One Lawgiver of the Old and New Testaments, also on the Garment of the Priest, and on Repentance)</p>
    <h3>Blessed Augustine of Hippo, bishop (354–430)</h3>
    <blockquote><p>To what do these miracles witness, but to this faith which preaches Christ risen in the flesh, and ascended with the same into heaven? For the martyrs themselves were martyrs, that is to say, witnesses of this faith, drawing upon themselves by their testimony the hatred of the world, and conquering the world not by resisting it, but by dying. For this faith they died, and can now ask these benefits from the Lord in whose name they were slain. For this faith their marvellous constancy was exercised, so that in these miracles great power was manifested as the result. For if the resurrection of the flesh to eternal life had not taken place in Christ, and were not to be accomplished in His people, as predicted by Christ, or by the prophets who foretold that Christ was to come, why do the martyrs who were slain for this faith which proclaims the resurrection possess such power? For whether God Himself wrought these miracles by that wonderful manner of working by which, though Himself eternal, He produces effects in time; or whether He wrought them by servants, and if so, whether He made use of the spirits of martyrs as He uses men who are still in the body, or effects all these marvels by means of angels, over whom He exerts an invisible, immutable, incorporeal sway, <strong><mark>so that what is said to be done by the martyrs is done not by their operation, but only by their prayer and request</mark></strong>; or whether, finally, some things are done in one way, others in another, and so that man cannot at all comprehend them — nevertheless these miracles attest this faith which preaches the resurrection of the flesh to eternal life.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/qutD_The_City_of_God_6#HH-Chapter-9-That-All-the-Miracles-Which-are-Done-by-Means-of-the-Martyrs-in-the-Name-of-Christ-Testify-to-that-Faith-Which-the-Martyrs-Had-in-Christ">The City of God, Book XXII, ch. 9</a>)</p>
    <blockquote><p>Blessed are you all, sorrowless and joyful, <strong><mark>saints of God</mark></strong>, who have already crossed this dead sea and have been deemed worthy to enter the haven of eternal rest, safety, and tranquillity! <strong><em><mark>I beseech you by your love, be solicitous for us</mark>. By Him I beseech you, whose beauty you already enjoy, by whose immortality you have become immortal, whose most blessed vision you always rejoice in; remember us always, <mark>help us</mark>, the unhappy, who are still tossed on the sea of this life by the storms surrounding us on every side.</em></strong></p><p>You, beautiful gates, raised to the great height!<strong> </strong>Help us, cast down very low; <strong>give us your hands and raise up those who lie prostrate, so that, healed of our weakness, we may become strong in the struggle. Intercede and <mark>pray unceasingly for us</mark>, poor and negligent sinners. </strong>We are carried over the great and spacious sea of life, where there are creeping things without number, where there are small animals with great ones, where the most cruel dragon is, always ready to devour us, where there are dangerous places, the abyss and the deep, in which those who waver in faith perish.</p><p><strong><mark>Pray to the Lord, pray, all the multitude of the saints and the countless hosts of the blessed</mark>, that <mark>by the help of your prayers, with an undamaged ship and intact goods, we may be deemed worthy to enter the haven of eternal salvation</mark>, of rest and unceasing peace.</strong></p></blockquote>
    <p>(Prayers and Meditations, ch. 24) (Some scholars question the authorship of this work)</p>
    <blockquote><p><em>The holy and immaculate </em><strong><em>Virgin, Mother of God Mary, Mother of our Lord Jesus Christ!</em></strong><em> </em><strong><em><mark>Be pleased to intercede for me before Him whose temple Thou wast deemed worthy to be.</mark></em></strong></p><p>Holy Michael, holy Gabriel, holy Raphael, holy hosts of angels, archangels, patriarchs and prophets, apostles, evangelists, martyrs, confessors, priests, Levites, monks, virgins, and all the righteous, <strong><mark>I dare to ask you: entreat God for me, a sinner, that I may be delivered from the jaws of the devil and from eternal death.</mark></strong> Be pleased, O Lord, to grant me eternal life according to Thy mercy.</p></blockquote>
    <p>(Prayers and Meditations, ch. 39) (Some scholars question the authorship of this work)</p>
    <h2>7th century</h2>
    <h3>St Sophronius, patriarch of Jerusalem (c. 560–638)</h3>
    <blockquote><p>O divine and immaterial (incorporeal) armies of God! O Minds endowed with spirit and reason! Yet it will be better to proclaim and magnify you gradually and in order, and to call upon you in prayer. &lt;…&gt; I beseech you, cleanse the inner dispositions of my soul (successus) from the defilement of vices &lt;…&gt;</p><p>O you, Cherubim &lt;…&gt;</p><p>O Thrones &lt;…&gt;</p><p>O venerable Dominions &lt;…&gt;</p><p>O Authorities &lt;…&gt;</p><p>O steadfast and mighty Powers &lt;…&gt;</p><p>O Principalities that know no deviation or falling away &lt;…&gt;</p><p>O thrice-holy, most beloved and most honoured Prince of the sacred heavenly army and commander, Michael, leader of the Angels &lt;….&gt;</p><p>I beseech thee, then do not refuse to be my faithful patron in my condition. &lt;…&gt;</p><p>I ask and, as far as the powers of my soul allow, I entreat thee: that, when I depart from the circle of this life, thou wouldst appear to me gracious and soothing, and under the cover of thy honoured wings wouldst hide me and, snatching me from the grievous and dark places of hell, wouldst place me in the wondrous heavenly mansions, leading me “even to the house of God, with the voice of joy and confession, the sound of those who keep festival” (Ps. 41:5 LXX = 42:4).</p><p>And thou also, most divine and most pre-eminent among the Angels, Gabriel &lt;…&gt;</p><p>O you, all the remaining Angels and Archangels, the heavenly host, the invincible army, the most valiant regiment, the vast multitude, the innumerable army, the incomparable choir &lt;…&gt;</p><p>I ask and pray for your favourable disposition toward me, O good and all-blameless Angels and Archangels &lt;…&gt;</p><p>and again, O divine spirits, I desire that you pray and above all <strong>entreat God for me</strong> when, at the last breath of my life, I am compelled to go out from this my humble vessel (my body) &lt;…&gt;</p><p>I beseech you and will not cease to beseech until the end of my life &lt;…&gt;</p><p><strong>O Lord, Saviour, God</strong> and Word, Thou who dwellest in the heights, who hast no beginning and holdest all things in Thy power &lt;…&gt;</p><p>O Immortal Bridegroom, grant that we may hear the voice of Thy blessing! O Benefactor, number me among the righteous and make us partakers of Thy joy — <strong><mark>through the prayers of Thine all-immaculate Mother, and of the Holy Angels, and of the Apostles, and of the Prophets, and of the Martyrs, and of all the righteous who have been from the ages</mark></strong> — Thou who with Thy Father and the Holy Spirit art blessed now and ever, and unto the ages of ages. Amen.</p></blockquote>
    <p>(Encomium on the Holy Archangels, Angels, and the Other Heavenly Powers)</p>
    <blockquote><p>1. O thou who wast the voice (announcing) the Word, inspire us, give us what to say. O Lamp of the Light, grant us illumination. O Forerunner of the Word, grant that our speech may flow smoothly, so that, having been able <strong>to praise thee according to the worth of thy deeds</strong>, we may rejoice today. For out of a sense of duty <strong>we desire to sing thy praises, O Baptist</strong>, even more than those of thy fathers and contemporaries, since we have been made to abound more in gifts from thee than from all thy forebears. And, since, <strong>being unable to praise thee worthily, we again flee to thee, the good Giver of gifts, and <mark>entreat</mark> that thou thyself wilt be the guide in our praises of thee</strong>.</p><p>&lt;…&gt;</p><p>more and more <strong>we call thee to our aid and <mark>entreat</mark> thee</strong> to loose our tongue, bound by dumbness, as once at thy birth thou didst loose the tongue of thy father Zacharias too.</p><p>&lt;…&gt;</p><p>But if our speech has been briefer than thou wouldst have wished, and was above my strength and did not answer the encomium to thee, then, asking forgiveness for this, I entreat thee: <strong><mark>to be with us in spirit, even if in body thou departest from us into the wilderness</mark></strong>, and unceasingly to render thy help to us, who are continually in need of it; if thou art pleased to help, <strong><mark>no place (of thy dwelling) hinders this; dwelling in spirit in heaven, thou easily lookest upon us all</mark></strong>.</p></blockquote>
    <p>(Encomium on St John the Forerunner)</p>
    <h2>17th century</h2>
    <h3>Epistle of the Patriarchs of the Eastern Orthodox Church on the Orthodox Faith (1723)</h3>
    <p>This is a conciliar document of the Church of Jerusalem (1672), but by this time (1723) it had also been approved by 4 patriarchates (Constantinople, Jerusalem, Antioch, Alexandria) and by the Synod of the Russian Church.</p>
    <blockquote><p><strong><mark>We believe that our Lord Jesus Christ is the only Mediator</mark></strong>, who, having given Himself for the redemption of all, became by His own Blood a reconciliation between God and man, and that He Himself, having care for His [followers], is the Defender and propitiation for our sins.</p><p>Nevertheless, we say that <strong><mark>the saints are intercessors in [our] prayers and petitions to Him</mark></strong>, and most of all the immaculate Mother of the very God the Word; also the holy Angels (of whom we know that they are our guardians), Apostles, Prophets, Martyrs, the Righteous, and all whom He has glorified as His faithful servants. To them we also number the Hierarchs, Priests, as those who stand before the Holy Altar, and righteous men known for their virtue. <strong><mark>For we know from Divine Revelation that we should pray for one another</mark></strong>, that <strong><mark>the prayer of a righteous man avails much</mark></strong> (James 5:16), and that <strong><mark>God hearkens more to the Saints</mark></strong> than to those who remain in sins. The saints <strong><mark>are mediators and intercessors for us before God</mark></strong> not only here, during their sojourn with us, but <strong><mark>especially after their death, when, after the destruction of the mirror, they contemplate the Holy Trinity in all clarity, in whose boundless light they know all our needs</mark></strong>. Just as we do not doubt that the Prophets, while still in the body with sensible perception, knew heavenly things, and therefore foretold the future, so too, not only do we not doubt, but we firmly believe and confess that <strong><mark>the Angels and the Saints, who have become as it were Angels, see our needs in the boundless light of God</mark></strong>.</p></blockquote>
    <p>(Definition 8)</p>
    <h2>19th century</h2>
    <h3>St Theophan the Recluse, bishop (1815–1894)</h3>
    <blockquote><p>You had a question earlier: how is the Mother of God an intercessor, when there is one mediator, Christ the Lord? I think I wrote that <strong>Christ the Lord is a mediator</strong> in an inexact sense, as <strong>the reconciler of mankind with the Godhead</strong>. By His death He reconciled us with God and thereby opened access for us to all God’s mercies. <strong>He is the accomplisher of the incarnate dispensation of salvation</strong>. <strong><mark>The Mother of God is an intercessor of salvation, as a woman of prayer. And the Angels and the saints are intercessors in this respect, for they pray for us</mark></strong>. But <strong><mark>neither the Mother of God, nor the Angels, nor the saints, are producers, but bestowers of salvation. They only intercede, so that the way of salvation given by the Lord Saviour for all may be applied to us too, and we may thus be saved by its power</mark></strong>. <strong><mark>The Lord Saviour [is the giver], and all the others are helpers in granting us salvation.</mark></strong></p><p>The image of salvation accomplished by the Lord can be compared to a hospital established for all. The physician is the Lord, and His medicine: but the performers and appliers of the healing are the Angels and the saints and the servants of the Divine Mysteries.</p></blockquote>
    <p>(Letter 943)</p>
