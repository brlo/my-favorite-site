    title: Against the Filioque
    priority: 6
  body: '<h2>Preface</h2><p>“Filioque” (Lat. “Filioque”) is a short name for the teaching
    of the Catholic Church that the Holy Spirit proceeds not only from the Father,
    but “and from the Son”.</p><p>A detailed video refutation of the Filioque by Priest
    Georgy Maximov: <a href="https://rutube.ru/video/c1878056726d0e041ba83802090cf308/">Rutube</a>,
    <a href="https://youtu.be/xuOSiS8zCO4">YouTube</a>.</p><h2>2nd century</h2><h3>Athenagoras
    of Athens (c. 133–190)</h3><blockquote><p><em>We assert that this very </em><strong><em><mark>Holy
    Spirit</mark></em></strong><em>, which operates in the prophets, </em><strong><em><mark>is
    an effluence of God</mark></em></strong><em>, flowing from Him, and returning
    back again like a beam of the sun. Who, then, would not be astonished to hear
    men who </em><strong><em>speak of God the Father, and of God the Son, and of the
    Holy Spirit, and who declare both their power in union </em></strong><em>and their
    distinction in order, called atheists?</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athenagoras-a-plea-for-the-christians#HH-10-The-Christians-Worship-the-Father-Son-and-Holy-Ghost">A
    Plea for the Christians, 10</a>)</p><h2>4th century</h2><h3>St Gregory of Nyssa,
    bishop (331–394)</h3><blockquote><p>By what words, pray, will you honour <strong><mark>the
    Holy Spirit</mark></strong>, supposing you do wish to honour Him at all? By saying
    that He is absolutely immortal, without turning, or variableness, always beautiful,
    always independent of ascription from others, working as He wills all things in
    all, Holy, leading, direct, just, of true utterance, “searching the deep things
    of God,” “<strong><mark>proceeding from the Father</mark></strong>,” “receiving
    from the Son,” and all such-like things?</p><p>&lt;…&gt;</p><p>What then? Is that
    life-giving power in the water itself which is employed to convey the grace of
    Baptism? Or is it not rather clear to every one that this element is only employed
    as a means in the external ministry, and of itself contributes nothing towards
    the sanctification, unless it be first transformed itself by the sanctification;
    and that <strong><mark>what gives life to the baptized is the Spirit</mark></strong>;
    as our Lord Himself says in respect to Him with His own lips, <em>“It is the Spirit
    that giveth life”</em> (John 6:63); <strong>but for the completion of this grace
    He alone, received by faith, does not give life</strong>, but belief in our Lord
    must precede, <strong>in order that <mark>the lively gift</mark> may come upon
    the believer</strong>, as our Lord has spoken, <em>“He giveth life to whom He
    willeth”</em> (John 5:21). But further still, seeing that this grace administered
    through the Son is dependent on the Ungenerate Source of all, Scripture accordingly
    teaches us that <strong>belief in <mark>the Father Who engendereth all things
    is to come first</mark> (1 Tim. 6:13), as the Apostle says, so that <mark>this
    life-giving grace</mark></strong> should be completed, for those fit to receive
    it, after starting from that Source as from a spring pouring life abundantly,
    through the Only-begotten Who is the True life, by the operation of the Holy Spirit.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/gregory_nyssa-on-the-holy-spirit">On the Holy
    Spirit, against the Macedonians</a>)</p><blockquote><p>His most peculiar characteristic
    is that He is neither of those things which we contemplate in the Father and the
    Son respectively. He is simply, neither as ungenerate, nor as only-begotten: this
    it is that constitutes His chief peculiarity. Joined to the Father by His uncreatedness,
    He is disjoined from Him again by not being “Father.” United to the Son by the
    bond of uncreatedness, and of <strong><mark>deriving His existence from the Supreme</mark></strong>,
    He is parted again from Him by the characteristic of not being <strong><mark>the
    Only-begotten of the Father, and of having been manifested by means of the Son
    Himself</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_nyssa-against-eunomius-2">Against
    Eunomius, Book I</a>)</p><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><p>It is not the Spirit (who is everywhere present) who is sent,
    but the gift, or, in other words, the grace:</p><blockquote><p>The Son completes
    what belongs to the Father, and speaks not of Himself; the Spirit completes what
    belongs to the Son, and speaks not of Himself. But <strong>if you hear someone
    say: <mark>“I will send you the Holy Spirit,” do not understand the words with
    reference to the Godhead, because God is not sent</mark></strong>. And that you
    may understand that <strong><mark>it is the gift that is sent, and that the Spirit
    is not sent</mark></strong>, the Saviour says to the apostles: sit in the city
    of Jerusalem until you be endued with <strong>power</strong> from on high (Luke
    24:49), and receive the power of the Holy Spirit come upon you. <strong><mark>It
    is one thing — the power that is given, and another — the Spirit who gives</mark></strong>.
    But all these worketh that one and the selfsame Spirit, dividing to every man
    severally, as He will (1 Cor. 12:11).</p><p>So <strong><mark>you are not able
    to prove that the Holy Spirit is sent in His pure Godhead</mark></strong>. <strong>But
    if I prove to you that the Creator of heaven and earth is sent by the Holy Spirit,
    what will you do?</strong> Either reject Christ and abolish the Scriptures, or,
    being a slave of the Scriptures, submit to them. Hear what God says through the
    mouth of the prophet Isaiah, the herald of piety: “Hear,” He says, “Me, Jacob
    and Israel, whom I call: I am God the first (Isa. 48:12). I am after this, and
    besides Me there is no God.” Pay attention: behold how, under the image of the
    one principle, he secretly preaches the Trinity. I am God the first and I am after
    these, and besides Me there is no God. Who says this? The Creator — because He
    adds: and My hand founded the earth (Isa. 48:13). Behold how the Creator speaks:
    and My Spirit established the heaven; I gave My commandments to all the stars;
    I raised up a king according to righteousness, and all My ways are just. Having
    called Himself the Creator and Maker of heaven and earth, He then says the following:
    when they were, there was I, and now, the Lord hath sent Me, and His Spirit (Isa.
    48:16). Thee, who created heaven and earth, who said to the stars: the Lord hath
    sent Me, and His Spirit — God the Father begat according to His Godhead and sent
    after the flesh. <strong><mark>The Creator of heaven says: the Lord hath sent
    Me, and His Spirit. The Father sent Him, not departing from Him and not removing
    Him from Himself, and Himself not being divided from Him</mark></strong>. Therefore
    the Scripture says: God poured out His Spirit (cf. Joel 2:28), that is, the gift
    of the Holy Spirit. The Godhead is not poured out, but the gift. Therefore, that
    it may be proved that <strong><mark>what is poured out is not the Holy Spirit,
    but the grace of the Divine Spirit</mark></strong>, David says to Christ: grace
    is poured forth in Thy lips (Ps. 45:2). <strong><mark>Grace is poured out, not
    the giver of grace</mark></strong>. Venerate then the Holy Spirit whom thou hast
    received. Christ took from thee thy image, and Himself gave thee His Spirit. Amen.</p></blockquote><p>(Homily
    on the Holy Spirit) *In abbreviated form. See the Complete Works of St Chrysostom
    in the Russian translation, vol. III, pp. 876–896. In the Migne edition this homily
    belongs to the category of Spuria.</p><h3>St Ambrose of Milan, bishop (c. 339–397)</h3><p>That
    the sending into the world (in time) does not belong to the eternal divine properties.
    Not only is the Holy Spirit sent by the Father and the Son, but the Son Himself
    is sent by the Father and the Holy Spirit. The Son and the Spirit send each other:</p><blockquote><p>7.
    Who, then, can doubt that the Spirit sent the prophets and apostles, since the
    Son of God says: <em>The Spirit of the Lord is upon Me</em> (Isa. 61:1; Luke 4:18)
    — and elsewhere: <em>I am the First, and I am also for ever, and Mine hand hath
    founded the earth, and My right hand hath established the heaven; I will call
    them and they shall stand up together, and shall all be gathered together and
    shall hear. Who hath declared these things to them? Because I loved thee I performed
    thy pleasure against Babylon, that the seed of the Chaldæans might be taken away.
    I have spoken, and I have called, I have brought him and have made his way prosperous.
    Come unto Me and hear ye this. From the beginning I have not spoken in secret,
    I was there when those things were done; and now the Lord God hath sent Me and
    His Spirit</em> (Isa. 48:12-16). Who is it Who says: <strong><em>The Lord God
    hath sent Me and His Spirit</em>? He Who came from the Father that He might save
    sinners!</strong> <strong><mark>The Spirit sent Him, lest when you hear that the
    Son sends the Spirit, you should believe the Spirit to be of inferior power</mark></strong>.</p><p>8.
    So <strong><mark>both the Father and the Spirit sent the Son</mark></strong>;
    the Father sent Him, for it is written: <em>The Paraclete, the Holy Spirit, Whom
    the Father will send in My Name</em> (John 14:26). <strong><mark>The Son sent
    Him</mark></strong>, for He said: <em>But when</em> <em>the Paraclete is come,
    Whom I will send unto you from the Father, even the Spirit of Truth</em> (John
    15:26). If, then, <strong><mark>the Son and the Spirit send each other</mark></strong>,
    as the Father sends, there is no inferiority of subjection, but a community of
    power.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ambrose-on-the-holy-spirit-3">On
    the Holy Spirit, Book III</a>)</p><h2>5th century</h2><h3>The Third Ecumenical
    Council (431)</h3><p>Against changing the Creed and against the Filioque</p><blockquote><p><em>We
    </em><strong><em>utterly cannot tolerate that anyone should shake the faith or
    the creed once published by the holy fathers of Nicaea. And we absolutely will
    not permit either ourselves or anyone else to change a single word there set down,
    or to let a single syllable pass, remembering the words of him who said: Do not
    remove the everlasting landmarks which your fathers have set (Prov. 22:28)</em></strong><em>.
    For it was not they themselves who spoke, but the </em><strong><em><mark>Spirit
    of God and Father (Matt. 10:20), who proceeds from Him</mark></em></strong><em>,
    though He is not alien to the Son either — understood as concerns the essence;
    and this is confirmed by the words of the saints who handed down the mysteries.</em></p></blockquote><p>(Letter
    of Cyril, archbishop of Alexandria, to John, bishop of Antioch, sent with Paul,
    bishop of Emesa)</p><h3>St Cyril of Alexandria, bishop (376–444)</h3><blockquote><p>Just
    now, <strong><mark>having called </mark><em><mark>“the Paraclete, the Spirit of
    Truth”</mark></em></strong>, that is, Himself, He says that <strong><mark>He </mark><em><mark>“proceeds
    from the Father</mark></em></strong><em>”</em>. This is because He is both His
    own <strong>Spirit of the Son</strong>, naturally existing in Him and <strong>proceeding
    through Him</strong>, and also the Spirit of the Father. But let not some of those
    accustomed to impiously use their ignorant reasonings lead us into what it is
    not fitting to think, namely that the Son, fulfilling a kind of servant’s office,
    <strong><mark>imparts to the creature the Spirit who is from the Father</mark></strong>.
    For even this some senseless men did not fear to say. On the contrary, one must
    believe that as soon as He is His own Spirit, as He is, without doubt, the Spirit
    of God and of the Father, He sends Him to His holy disciples for sanctification.
    But if they wish to think and say something clever, presenting the Son here again
    as a servant to us and a deputy, should we not say to them: “Fools and blind”
    (Matt. 23:17), do you not perceive where you are again heading, and rising up
    against the glory of the Only-begotten, composing pitiful reasonings through the
    ignorance inherent in you? For if <strong><mark>the Son bestows the Spirit from
    the Father</mark></strong>, being counted wholly as a kind of servant, is it not
    necessary to recognize that He (the Spirit) is quite alien to His essence, and
    perhaps higher and far better than He, if this is so, as you assert in your ignorance?
    Indeed, if the Son, in your view, does not proceed from the Father, that is, from
    His essence, should not the Spirit be represented as higher in comparison with
    the Son? But in that case what shall we say when we hear the words of the Son
    about Him, that “He will glorify Me, for He will take of Mine and will declare
    it to you” (John 16:14)?</p><p>To what has been said must, as it were of necessity,
    be added the following. If you consider the Son as performing a servile activity
    in imparting to us the Spirit alien to Him, that is, from God and the Father,
    holy by nature, then the Son is holy not by nature but by participation, as we
    are, for according to the ignorance of the impious it is asserted that He is alien
    to <strong><mark>the essence of the Father, from which the Spirit proceeds</mark>,
    imparted through Him</strong>. In that case one must suppose that if the Spirit
    is not the Son’s own Spirit, and if He Himself has acquired holiness like a creature,
    then He may at some time fall away from that holiness inherent in Him. For what
    is acquired as an addition — does it not admit the possibility of being absent?
    But who would not flee from such dogmas? I consider the following speech more
    correct.</p><p>Therefore the truth and the dogmas of truth are dear to us. And
    we shall not follow those (false teachers), but, following in the footsteps of
    the faith of the holy fathers, we affirm that the Son’s own Spirit is the Paraclete,
    that is, the Holy Spirit, and that He does not enter from without or is acquired
    in Him, as in those who receive holiness, whose very being is from non-being,
    but that He is consubstantial with Him, as, without doubt, with the Father. Thus
    the meaning of the church dogmas must not pass away from us into polytheistic
    myth-making, but the Holy Trinity is gathered into one conception of the Godhead.
    At the same time, therefore, showing both the unity of essence — I mean His and
    of God and the Father — and <strong><mark>calling the Paraclete the Spirit of
    Truth and saying that He proceeds from the Father</mark></strong>, it thereby
    clearly and irrefutably convicts the Christ-fighter wholesale and God-fighter.
    For whoever wished to rage against the Son in every way must justly be thought
    to have offended against That One also from whom He is.</p><p>So <em>“when the
    Paraclete comes”</em>, He says, — <strong><em><mark>“the Spirit of Truth”</mark></em><mark>,
    that is, Mine, </mark><em><mark>“who proceeds from the Father</mark></em></strong><em>,
    He will testify of Me”</em>. And how will He testify? Precisely by performing
    in us and through us miracles, being a witness righteous and true of My divine
    power and omnipotence. For the Spirit acting in you is Mine. But as Mine, so also
    of God and the Father. Therefore one must think that together with Him those are
    also insulted who performed miracles through the one good Spirit for the assurance
    of the faith, as it were in the person of Christ, in whom there dwelt, according
    to Paul, not some part of the ineffable Godhead, but “all the fullness bodily”
    (Col. 2:9).</p></blockquote><p>(Commentary on the Gospel of John)</p><h3>Blessed
    Theodoret of Cyrus, bishop (c. 386–457)</h3><blockquote><p>Therefore we have learned
    that <strong><mark>the Holy Spirit has His being from God and the Father</mark></strong>;
    but in the mode of His procession He is unlike either the creature, because the
    All-Holy Spirit is not created, or the Only-begotten Son, because none of the
    God-bearing fathers has named the procession of the divine Spirit a generation.
    The sacred words teach us that <strong>the Holy Spirit is from God and divine</strong>.
    The Lord Christ says of Him: <em>“It is expedient for you that I go away. For
    if I do not go away, the Comforter will not come to you”</em> (John 16:7); and
    again: <em>“when the Comforter comes,... the Spirit of truth, who </em><strong><em>proceeds
    from the Father</em></strong><em>”</em> (John 15:26), <em>“He will guide you into
    all truth”</em> (John 16:13). <strong>Having said <em>“who proceeds from the Father,”</em>
    He showed that <mark>the Father is the source of the Spirit</mark></strong>; He
    does not say: will go forth, but: <em>“proceeds,”</em> showing the identity of
    nature, the indivisibility and sameness of essence, and the unity of Persons.
    For that which proceeds is never separated from that from which it proceeds.</p></blockquote><p>(Abridged
    Exposition of the Divine Dogmas)</p><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>Others
    understand <strong><mark>the Holy Spirit</mark></strong>, who in the beginning
    was moving over the waters and gave life to all things, <strong><mark>who proceeds
    from the Father</mark> and, because of the commonality of nature, is sent by the
    Son</strong>, who says: It is expedient for you that I go away. For if I do not
    go away, the Comforter will not come to you; but if I go, I will send Him to you
    (John 16:7). Of Him He says again: when the Comforter comes, whom <strong>I will
    send to you from the Father</strong>, the Spirit of truth, who proceeds from the
    Father (John 15:26). No one should be scandalized if <strong><mark>the Spirit
    is called proceeding from the Father</mark></strong>, since the Son also said
    of Himself: I came forth from the Father and have come; for I did not go forth
    from Myself, but He sent Me (John 16). Of this Spirit He said: I will pray the
    Father, and He will give you another Comforter, that He may be with you forever,
    the Spirit of truth (John 14:16). This is the spirit of which Moses also writes:
    Who will give that all the people of the Lord be prophets, and that the Lord give
    His Spirit upon them (Num. 11:29). And Joel in the person of God [says]: I will
    pour out of My Spirit upon all flesh, and your sons and your daughters shall prophesy
    (Joel 2:28), and Zechariah: but My words and My statutes they received, which
    I commanded by My Spirit through My servants the prophets (Zech. 1:6). And again:
    I will pour out in Jerusalem the spirit of grace and compassion (Zech. 12:10).</p></blockquote><p>(Commentary
    on the Book of the Prophet Isaiah, Book 16)</p><h2>8th century</h2><h3>St John
    of Damascus, monk (c. 675–754)</h3><blockquote><p>so also, when we have learnt
    about the Spirit of God, we contemplate it as the companion of the Word and the
    revealer of His energy, and <strong>not as mere breath without subsistence</strong>.
    For to conceive of the Spirit that dwells in God as after the likeness of our
    own spirit, would be to drag down the greatness of the divine nature to the lowest
    depths of degradation. <strong>But we must contemplate it as an essential power,
    existing in its own proper and peculiar subsistence, <mark>proceeding from the
    Father</mark>,</strong> resting in the Word, and shewing forth the Word, neither
    capable of disjunction from God in Whom it exists, and the Word Whose companion
    it is, nor poured forth to vanish into nothingness, but <strong>being in subsistence
    in the likeness of the Word, endowed with life, free volition, independent movement,
    energy, ever willing that which is good, and having power to keep pace with the
    will in all its decrees, having no beginning and no end. For never was the Father
    at any time lacking in the Word, nor the Word in the Spirit.</strong></p><p>&lt;…&gt;</p><p>The
    terms, “Word” and “effulgence,” then, are used because He is begotten of the Father
    without the union of two, or passion, or time, or flux, or separation: and the
    terms “Son” and “impress of the Father’s subsistence,” because He is perfect and
    has subsistence and is in all respects similar to the Father, save that the Father
    is not begotten: and the term “Only-begotten” because He alone was begotten alone
    of the Father alone. For no other generation is like to the generation of the
    Son of God, since no other is Son of God. For though <strong><mark>the Holy Spirit
    proceedeth from the Father, yet this is not generative in character but processional.
    This is a different mode of existence</mark></strong>, alike incomprehensible
    and unknown, just as is the generation of the Son.</p><p>&lt;…&gt;</p><p>So then
    in the first sense of the word the three absolutely divine subsistences of the
    Holy Godhead agree, for they exist as one in essence and uncreate. But with the
    second signification it is quite otherwise. For the Father alone is ingenerate,
    no other subsistence having given Him being. And the Son alone is generate, for
    He was begotten of the Father’s essence without beginning and without time. <strong>And
    <mark>only the Holy Spirit proceedeth from the Father’s essence, not having been
    generated but simply proceeding</mark> (see John 15:26). For this is the doctrine
    of Holy Scripture</strong>. But the nature of the generation and the procession
    is quite beyond comprehension.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VRJi_An_Exact_Exposition_of_the_Orthodox_Faith__book_1#HH-Chapter-VIII-Concerning-the-Holy-Trinity">An
    Exact Exposition of the Orthodox Faith, Book 1, ch. 8. On the Holy Trinity</a>)</p><h2>9th
    century</h2><h3>St Photius the Great, patriarch of Constantinople (820–896)</h3><blockquote><p>2.
    There is against them a sharp and unavoidable weapon, and the most important of
    all others: the Lord’s saying, which deafens and destroys every wild beast and
    every fox. What is it? That which declares that <strong><mark>the Spirit </mark><em><mark>“proceeds
    from the Father”</mark></em><mark> (John 15:26). The Son teaches that the Spirit
    proceeds from the Father, and do you seek another leader</mark>, through whom
    to introduce, or rather confirm, impiety, and do you mythologize that the Spirit
    proceeds from the Son?</strong></p></blockquote><p>(Mystagogy of the Holy Spirit)</p><h2>14th
    century</h2><h3>St Gregory Palamas, bishop (1296–1357)</h3><blockquote><p>For
    he says in the “Discourse on the knowledge of God,” after philosophizing at length
    about the Father and the Son: <strong><mark>“The Spirit, however, is shown to
    be proceeding from the paternal hypostasis, and for this reason David called Him
    “the Spirit of His mouth” (Ps. 33:6)</mark></strong>, to certify that the peculiar
    property of bringing forth belongs to the Father alone.” What, then, is clearer,
    or more certain, or more instructive, or more demonstrative than these words [to
    show] that <strong><mark>the Spirit proceeds not from the Son either</mark></strong>?</p><p>For
    if [the Spirit proceeded] from Him too, then each Person would not [proceed] in
    the nearest way from a single Person, and we could not dare to say that we venerate
    one Principle of the Godhead, and affirm that the three Persons are one God. If
    both that which is caused and the cause were in two Persons, as is seen in our
    case, then the peculiar property of bringing forth would not be inherent in the
    Father alone, if [that is] the Son also had [the power] to bring forth [the Spirit].
    <strong><mark>Gregory of Nyssa, however, proves that it is inherent in the Father
    alone</mark></strong>, and brings forward as witness the God-bearing David, or
    rather the Holy Spirit, who spoke through the prophets.</p><p>51. <strong>Do you
    see, you who plainly think contrary to the Spirit and teach against Him and fight
    rather than theologize about the Spirit, that you have become a wicked dijetos
    of the birth-giving divinity and a robber of the property of God the Father</strong>,
    shifting and transferring the immovable peculiar properties, while as for yourself
    — disturbing and violating the peace that surpasses every mind and truly [is such]?
    What then — do you not tremble hearing this, and will you not depart as quickly
    as possible from the terrible blasphemy, and will you not lament your former life
    as one who lived it impiously?</p></blockquote><p>(On the Procession of the Holy
    Spirit)</p><h2>15th century</h2><h3>The Council of Constantinople (1484)</h3><blockquote><p><em>“Therefore
    with soul and thought we believe, and with tongue we preach and confess, that
    the almighty and </em><strong><em><mark>Holy Spirit, by that ineffable and eternal
    passage (πρόοδον), according to the Lord’s word, proceeds (ἐκπορεύεται) from God
    and the Father, that is, solely from the paternal hypostasis according to His
    essence</mark></em></strong><em>, while the Son contributes absolutely nothing
    to the procession of the Holy Spirit and does not mediate in it, lest there be
    thought to exist in the Trinity two causes or two principles in the Uncreated
    Godhead, since to beget and to bring forth is a property not of the essence but
    of the hypostasis, and only of the paternal one. Thus we know that the single
    source and cause (αἰτία) of Those who are from Him is God the Father &lt;…&gt;
    And from </em><strong><em><mark>those who think otherwise</mark> about the procession
    of the Holy Spirit, or preach, or hold this opinion contrary to the truth and
    vainly proclaim it, we <mark>turn away as from heretics and anathematize</mark></em></strong><em>”.</em></p></blockquote><p>(Tomos
    of the Council of Constantinople of 1484)</p><h2>19th century</h2><h3>The Encyclical
    of the Eastern Patriarchs (1848)</h3><p>The general church position is set forth.
    The letter is signed by the patriarchs, synods and bishops of the Orthodox Churches
    (see the end of the letter):</p><blockquote><p><em>Therefore the One, Holy, Catholic
    and Apostolic Church, following the holy Fathers, both Eastern and Western, as
    of old it proclaimed in the days of our Fathers, so now proclaims anew in conciliar
    fashion, that </em><strong><em>this <mark>newly-introduced opinion that the Holy
    Spirit proceeds from the Father and the Son is real heresy</mark>, and <mark>its
    followers, whoever they may be, are heretics</mark></em></strong><em>, according
    to the aforesaid conciliar definition of the most holy pope Damasus; </em><strong><em>the
    societies composed of them are <mark>heretical societies</mark>, and every spiritual
    liturgical communion with them of the Orthodox children of the Catholic Church
    is lawless</em></strong><em>, especially by virtue of the seventh canon of the
    Third Ecumenical Council.</em></p><p><em>&lt;…&gt;</em></p><p><strong><em>It has
    been condemned by many holy Councils of the four Eastern Patriarchs</em></strong><em>;</em></p><p><em>11.
    </em><strong><em><mark>Anathematized, as an innovation and an augmentation of
    the Creed</mark></em></strong><em>, at the (so-called) Eighth Ecumenical Council,
    convoked in Constantinople for the reconciliation of the Churches of East and
    West;</em></p></blockquote><p>(Encyclical of the One, Holy, Catholic and Apostolic
    Church to all Orthodox Christians, 1848)</p><h2>20th century</h2><h3>St Nikolaj
    of Serbia (Velimirović), bishop (1880–1956)</h3><blockquote><p>There are people
    who assert that the Holy Spirit proceeds from the Father and the Son. Who revealed
    this to them, and when? We know that <strong><mark>the Holy Spirit proceeds from
    the Father, for the Son of God revealed this to us</mark></strong>, our Lord Jesus
    Christ. Therefore we reject those additions to the Orthodox faith which are not
    in accord with the words of the Lord Himself.</p></blockquote><p>(Homily on God
    the Holy Spirit, proceeding from the Father)</p>'
