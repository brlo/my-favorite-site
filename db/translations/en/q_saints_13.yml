    title: God the Trinity
    priority: 1
  body: '<h2>2nd century</h2><h3>St Justin Martyr, philosopher (c. 100–165)</h3><p><strong>God
    is consubstantial</strong></p><blockquote><p><em>… </em><strong><em>God begat
    before all creatures a Beginning, a certain rational power from Himself, who is
    called by the Holy Spirit, now the Glory of the Lord, now the Son, again Wisdom,
    again an Angel, then God, and then Lord and Logos</em></strong><em>; and on another
    occasion He calls Himself Captain, when He appeared in human form to Joshua the
    son of Nave (Nun). For He can be called by all those names, since He ministers
    to the Father’s will, and since He was </em><strong><em>begotten of the Father
    by an act of will</em></strong><em>; just as we see happening among ourselves:
    for when we give out some word, we </em><strong><em><mark>beget the word; yet
    not by abscission</mark></em></strong><em>, so as to lessen the word in us, when
    we give it out: and just as we see also happening in the case of a fire, which
    </em><strong><em>is not lessened when it has kindled another</em></strong><em>,
    but remains the same; and that which has been kindled by it likewise appears to
    exist by itself, not diminishing that from which it was kindled. The </em><strong><em>Word
    of Wisdom, who is Himself this God begotten of the Father of all things</em></strong><em>,
    and Word, and Wisdom, and Power, and the Glory of the Begetter, will bear evidence
    to me;</em></p><p><em>&lt;…&gt;</em></p><p><em>These are the words: “And God said,
    Behold, Adam has become as one of us, to know good and evil.” In saying, therefore,
    “as one of us,” Moses has </em><strong><em><mark>declared that there is a certain
    number of persons associated with one another, and that they are at least two</mark></em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>But
    this Offspring, which was truly brought forth from the Father, was </em><strong><em><mark>with
    the Father before all the creatures</mark></em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><p><strong>In God there is one will</strong></p><blockquote><p><em>He
    who is said to have appeared to Abraham, and to Jacob, and to Moses, and who is
    called God, is distinct from Him who made all things, — </em><strong><em><mark>numerically,
    I mean, not distinct in will</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><p><strong>God is triune</strong></p><blockquote><p><em>Our
    teacher of these things is Jesus Christ, who also was born for this purpose, and
    was crucified under Pontius Pilate, procurator of Judaea, in the times of Tiberius
    Caesar; and that we reasonably worship Him, having learned that </em><strong><em>He
    is the <mark>Son</mark> of the true God Himself, and holding Him in the <mark>second</mark>
    place, and the prophetic <mark>Spirit</mark> in the <mark>third</mark>.</em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1">First Apology</a>)</p><p><strong>The
    Son of God is not a God separate from the Father</strong></p><blockquote><p><em>this
    power was begotten from the Father, by His power and will, but </em><strong><em><mark>not
    by abscission, as if the essence of the Father were divided</mark></em></strong><em>;
    as all other things partitioned and divided are not the same after as before they
    were divided.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><h3>St Theophilus of Antioch, bishop (†183)</h3><blockquote><p>For
    the sun is a type of God, and the moon of man. And as the sun far surpasses the
    moon in power and glory, so far does God surpass man. And as the sun remains ever
    full, never becoming less, so does God always abide perfect, being full of all
    power, and understanding, and wisdom, and immortality, and all good. But the moon
    wanes monthly, and in a manner dies, being a type of man; then it is born again,
    and is crescent, for a pattern of the future resurrection. In like manner also
    <strong><mark>the three days which were before the luminaries, are types of the
    Trinity, of God, and His Word, and His wisdom</mark></strong>. And the fourth
    is the type of man, who needs light, that so there may be God, the Word, wisdom,
    man.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/theophilus-theophilus-to-autolycus#HH-Book-II">To
    Autolycus, Book II</a>)</p><h3>Athenagoras of Athens (c. 133–190)</h3><blockquote><p>The
    Holy Spirit Himself also, which operates in the prophets, we assert to be an effluence
    of God, flowing from Him, and returning back again like a beam of the sun. Who,
    then, would not be astonished to hear men <strong><mark>who speak of God the Father,
    and of God the Son, and of the Holy Spirit, and who declare both their power in
    union</mark> </strong>and their distinction in order, called atheists?</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/athenagoras-a-plea-for-the-christians#HH-10-The-Christians-Worship-the-Father-Son-and-Holy-Ghost">A
    Plea for the Christians, 10</a>)</p><h3>St Irenaeus of Lyons, hieromartyr († late
    2nd c.)</h3><blockquote><p>The Church, though dispersed through the whole world,
    even to the ends of the earth, has received from the apostles and their disciples
    this faith: <strong><mark>in one God, the Father Almighty</mark></strong>, Maker
    of heaven, and earth, and the sea, and all things that are in them; and <strong><mark>in
    one Christ Jesus, the Son of God</mark></strong>, who became incarnate for our
    salvation, <strong><mark>and in the Holy Spirit</mark></strong>, who proclaimed
    through the prophets the dispensations of God, and the advents, and the birth
    from a virgin, and the passion, and the resurrection from the dead, and the ascension
    into heaven in the flesh of the beloved Christ Jesus, our Lord, and His manifestation
    from heaven in the glory of the Father</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-10">Against
    Heresies, Book I</a>)</p><blockquote><p>The rule of truth which we hold, is, that
    there is <strong>one God Almighty</strong>, who made all things by His Word, and
    fashioned and formed, out of that which had no existence, all things which exist.
    Thus saith the Scripture, to that effect “By the <strong>Word</strong> of the
    Lord were the heavens established, and all the might of them, by the <strong>spirit</strong>
    of His mouth” (Ps. 33:6)… For God needs none of all these things, but is He who,
    <strong>by His Word and Spirit, makes</strong>, and disposes, and governs all
    things, and commands all things into existence</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1#HH-22">Against
    Heresies, Book I, 22.1</a>)</p><blockquote><p>For <strong><mark>God</mark></strong>
    did not stand in need of these beings, in order to the accomplishing of what He
    had Himself determined with Himself beforehand should be done, as if He did not
    possess His own hands. <strong><mark>For with Him were always present the Word
    and Wisdom, the Son and the Spirit</mark></strong>, by whom and in whom, freely
    and spontaneously, He made all things, <strong>to whom also He speaks, saying,
    “Let Us make man after Our image and likeness”</strong> (Gen. 1:26), He taking
    from Himself the substance of the creatures, and the pattern of things made, and
    the type of all the adornments in the world.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-20">Against
    Heresies, Book IV, 20.1</a>)</p><blockquote><p>But the path of those belonging
    to the Church circumscribes the whole world, as possessing the sure tradition
    from the apostles, and gives unto us to see that the faith of all is one and the
    same, since <strong>all receive one and the same God the Father</strong>, and
    believe in the same dispensation regarding the incarnation of <strong>the Son
    of God</strong>, and are cognizant of the same gift of <strong>the Spirit</strong>,
    and are conversant with the same commandments, and preserve the same form of ecclesiastical
    constitution</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-20">Against
    Heresies, Book V, 20.1</a>)</p><blockquote><p>The presbyters, the disciples of
    the apostles, affirm that this is the gradation and arrangement of those who are
    saved, and that they advance through steps of this nature; also that <strong>they
    ascend through the Spirit to the Son, and through the Son to the Father</strong>,
    and that in due time the Son will yield up His work to the Father</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b5#HH-36">Against
    Heresies, Book V, 36.2</a>)</p><h2>3rd century</h2><h3><a href="https://bibleox.com/en/en/w/6Frm_Tertullian_II_c">Tertullian
    (c. 155–220)</a></h3><blockquote><p>And especially in the case of this heresy,
    which supposes itself to possess the pure truth, in thinking that one cannot believe
    in One Only God in any other way than by saying that the Father, the Son, and
    the Holy Ghost are the very selfsame Person. As if in this way also one were not
    All, in that <strong>All are of One, by unity of substance</strong>; while the
    mystery of the dispensation is still guarded, which <strong><mark>distributes
    the Unity into a Trinity, placing in their order the three Persons—the Father,
    the Son, and the Holy Ghost</mark></strong>: three, however, not in condition,
    but in degree; not in substance, but in form; not in power, but in aspect. In
    fact, <strong><mark>they are of one substance, and of one condition, and of one
    power, inasmuch as He is one God</mark>, from whom these degrees and forms and
    aspects are reckoned, under the name of <mark>the Father, and of the Son, and
    of the Holy Ghost</mark></strong>. How they are susceptible of number without
    division, will be shown as our treatise proceeds.</p><p>&lt;…&gt;</p><p>At the
    same time, all the Scriptures attest the clear existence of, and distinction in
    the Trinity, and indeed furnish us with our Rule of faith, that <strong>He who
    speaks, and He of whom He speaks, and to whom He speaks, cannot possibly seem
    to be One and the Same</strong>.</p><p>&lt;…&gt;</p><p>And <strong>almost all
    the Psalms which prophesy of the person of Christ, represent <mark>the Son as
    conversing with the Father</mark>, that is, Christ with God</strong>. Observe
    also <strong><mark>the Spirit speaking of the Father and the Son, in the character
    of a third Person</mark></strong>: “The Lord said unto my Lord, Sit Thou on my
    right hand, until I make Thine enemies Thy footstool” (Ps. 110:1). Likewise in
    the words of Isaiah: “Thus saith the Lord to the Lord mine Anointed” (Isa. 45:1)</p><p>&lt;…&gt;</p><p>And
    since <strong><mark>He had already His Son close at His side, as a second Person,
    His own Word, and a third Person also, the Spirit in the Word</mark></strong>,
    He purposely adopted the plural phrase, “Let us make;” and, “in our image;” and,
    “become as one of us.”</p><p>&lt;…&gt;</p><p>And in general, <strong><mark>everywhere
    I must hold one only substance in three coherent and inseparable Persons</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-against-praxeas">Against Praxeas</a>)</p><h3>St
    Peter of Alexandria, hieromartyr (2nd c.–311)</h3><blockquote><p>Therefore, from
    the holy Prophets and from all who, as I have said, dwelt equally piously and
    justly in the law of the Lord, and kept the Passover with all the people according
    to the ordinance and with reverence, the Master of all visible and invisible creation,
    <strong><mark>the Only-begotten Son and Word, consubstantial with the Father and
    with the Holy Spirit in divinity,</mark> our Lord and <mark>God, Jesus Christ</mark></strong>
    in the fullness of time, born after the flesh from the Holy Glorious Lady, our
    Mother of God and Ever-virgin and truly Mother of God Mary, visible on earth and
    consubstantial with men in human nature, truly remaining as a man, He Himself
    with the people in the years before His preaching lawfully and reverently kept
    the Passover and ate according to the ordinance of the lamb. For He came not to
    abolish the Law or (to do away with the teaching of) the Prophets, but to fulfil
    them, as the Saviour Himself said in the Gospel (see Matt. 5:17).</p></blockquote><p>(On
    the Divinity) (PG 18, p. 518)</p><h2>4th century</h2><h3>The First Ecumenical
    Council, Nicaea (325)</h3><blockquote><p>The holy, great and ecumenical council
    of the holy fathers gathered in Nicaea, through the blessed and holy Hosius, bishop
    of the city of Corduba in Spain, said: “<strong>The Godhead is not one person,
    as the Jews think, but three persons, distinguished among themselves not in name
    only but in hypostasis</strong>; and this is confirmed by many testimonies from
    the Old and New Testaments. The Old, reasoning still in a fleshly manner, presented
    the Word as if speaking, but the New called the Word God directly: In the beginning
    was the Word, and the Word was with God, and the Word was God (John 1:1), and
    a person, perfect from the Perfect. <strong>The Son is God, not a part, but perfect,
    just as the Father, of the same essence as the Father who begat Him in an unspeakable
    manner</strong>. <strong>Together with the Father and the Son there exists the
    Holy Spirit, who has the same essence and power as the Father and the Son</strong>.
    Therefore we must confess one will, one kingdom, one power, one dominion over
    all created beings, visible and intelligible, <strong><mark>one Godhead and the
    same essence of the Father and the Son and the Holy Spirit</mark>. Not allowing
    confusion or division of the persons of the ineffable and blessed Trinity, we
    believe that <mark>the Father</mark> is always the true Father of the true Son,
    ever existing and abiding, and <mark>the Son</mark> — the true Son of the true
    Father, ever existing and abiding, and <mark>the Holy Spirit</mark> — the true
    Holy Spirit, ever existing and abiding, — <mark>a Trinity indivisible</mark>,
    ineffable; we believe that She truly cannot be comprehended by the mind or expressed
    in words, and has one Godhead and the same essence</strong>. Thus do we believe
    according to the true purity of the dogmas of the faith handed down to us from
    the beginning by the Lord Himself through His holy apostles and the ancient holy
    fathers of ours, who preserved this apostolic faith unchanged, and we are ready
    to confirm by numerous testimonies of the divine writings that thus one ought
    to believe”.</p></blockquote><p>(Acts of the First Ecumenical Council, On how
    one ought to understand the three Persons in the one Godhead of the Father and
    the Son and the Holy Spirit)</p><h3>St Athanasius the Great, bishop (c. 295–373)</h3><blockquote><p>“I
    am the door of the sheep.” The Lord fittingly called Himself a door, and not doors:
    because <strong>there is one Father, one Son, and one Holy Spirit: and not three
    Gods, but one, and one door of knowledge</strong>. And who bears witness to this?
    Paul, crying out thus: “one Lord, one faith, one baptism” (Eph. 4:5). So he (Paul)
    here does not say: two, three, four, five, but everywhere: one; since the one
    door — the one Lord — is the undivided Being;</p></blockquote><p>(Homily on the
    man born blind)</p><blockquote><p>Some, though they have departed from the Arians
    on account of their blasphemy against the Son of God, nevertheless think wrongly
    about the Holy Spirit, and assert that the Holy Spirit is not only a creature,
    but even one of the ministering spirits, and differs from the Angels only in degree.
    But this is only a feigned disagreement with the Arians, a real opposition to
    the pious faith. As the Arians, denying the Son, deny the Father also, so these,
    uttering blasphemy against the Holy Spirit, blaspheme the Son as well. Both have
    divided between themselves the lot of opposition to the truth, and for their wrong
    thinking — some about the Word, others about the Spirit — they are guilty of equal
    blasphemy against the Holy Trinity.</p><p>&lt;…&gt;</p><p>If, because of the unity
    of the Word with the Father, they do not agree to call the Son one of the created,
    but acknowledge Him (and rightly so) the Maker of creatures, then why do they
    call the Holy Spirit, who has the same unity with the Son as the Son has with
    the Father, a creature? Why did they not learn that, just as, not separating the
    Son from the Father, they preserve the unity of God, so, separating the Spirit
    from the Word, they no longer preserve the one Godhead in the Trinity, cutting
    it, mingling with it an alien and foreign nature, making it equal with creatures?
    This again shows that the Trinity is already not a unity, but a compound of two,
    and moreover (because of the other-essence of the Spirit which the heretics imagine)
    of different natures. And what kind of theology is this, compounded of the Creator
    and a creature? Or is the Godhead no longer triune but twofold, and moreover a
    creature? Or, if it is a Trinity (which it truly is), then why do they place the
    Spirit of the Trinity in one row with creatures, inferior to the Trinity? This
    again means dividing and decomposing the Trinity. Therefore those who think wrongly
    about the Holy Spirit do not think rightly about the Son either. And if they thought
    rightly about the Word, they would think healthily about the Spirit too, “who
    proceeds from the Father” (John 15:26)</p><p>&lt;…&gt;</p><p>Therefore it is madness
    to assert that the Spirit is a creature. If He were a creature, He would not be
    joined to the Trinity; because <strong>the whole Trinity is one God</strong>.
    And it is enough to know that the Spirit is not a creature and is not reckoned
    among creatures; because nothing alien is mingled with the Trinity; on the contrary,
    She is indivisible and like unto Herself… if God is triune (which He truly is),
    and it has been proved that He is an indivisible Trinity, unlike nothing in Himself;
    then it is necessary that the holiness of the Trinity be one, and Her eternity
    one, and Her nature immutable. For, as <strong>the faith in the Trinity handed
    down to us</strong> is one, and it unites us with God, whoever takes away anything
    from the Trinity, and is baptized in the one name of the Father, or in the one
    name of the Son, or in the Father and the Son without the Spirit, receives nothing,
    but both those being baptized, and he who thinks himself to be administering baptism,
    remain empty and unenlightened; because the initiation is performed in the name
    of the Trinity: so he who separates the Son from the Father, or brings down the
    Spirit to creatures, has neither the Son nor the Father, but is ungodly, worse
    than an unbeliever, and rather everything except a Christian. As there is one
    baptism administered in the Father and the Son and the Holy Spirit, and one faith
    in the Trinity, as the Apostle said (Eph. 4:5); so the Holy Trinity, identical
    with itself and abiding in unity, has nothing created in itself. Such is the indivisible
    unity of the Trinity, such is the one faith in Her.</p></blockquote><p>(Letters
    to Serapion, bishop of Thmuis, Against those who slander that the Holy Spirit
    is a creature)</p><h3>St Gregory the Theologian, bishop (c. 325–389)</h3><blockquote><p>I
    therefore write to your Reverence, what indeed you knew before, that I never have
    and never can honour anything above the Nicene Faith, that of the Holy Fathers
    who met there to destroy the Arian heresy; but am, and by God’s help ever will
    be, of that faith; completing in detail that which was incompletely said by them
    concerning the Holy Ghost; for that question had not then been mooted, namely,
    that we are to believe that <strong><mark>the Father, Son, and Holy Ghost are
    of one Godhead</mark>, thus confessing the Spirit also to be God</strong>. Receive
    then to communion those who think and teach thus, as I also do; but those who
    are otherwise minded refuse, and hold them as strangers to God and the Catholic
    Church.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-letters#HH-Against-Apollinarius-The-Second-Letter-to-Cledonius">Select
    Letters, To Cledonius the priest, against Apollinarius (Ep. 102)</a>)</p><h2>5th
    century</h2><h3>Blessed Augustine of Hippo (354–430)</h3><blockquote><p>It is
    enough for the Christian to believe that the only cause of all created things,
    whether heavenly or earthly, whether visible or invisible, is the goodness of
    the <strong>Creator, the <mark>one true God</mark>; and that nothing exists but
    Himself that does not derive its existence from Him; and that <mark>He is the
    Trinity—to wit, the Father, and the Son begotten of the Father, and the Holy Spirit
    proceeding from the same Father, but one and the same Spirit of Father and Son</mark></strong>.</p><p>By
    this Trinity, thus supremely and equally and unchangeably good, all things were
    created; and these are not supremely and equally and unchangeably good, but yet
    they are good, even taken separately. Taken as a whole, however, they are very
    good (Gen. 1:31), because their ensemble constitutes the universe in all its wonderful
    order and beauty.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/augustine-the-enchiridion">The
    Enchiridion on Faith, Hope, and Love</a>)</p><h2>19th century</h2><h3>St Theophan
    the Recluse, bishop (1815–1894)</h3><blockquote><p><strong><mark>“Believe in the
    Lord the Saviour”</mark> — one must contemplate Him thus, and hold Him thus in
    mind and heart, so that He stands <mark>in harmonious union with the mystery of
    the Most Holy Trinity</mark></strong>. Otherwise it may happen that, while listening
    and speaking all about salvation only in the Lord Jesus, you so drive this truth
    into your attention that the thought of the Most Holy Trinity falls out of it
    altogether, and the Most Holy Trinity is quite overshadowed by the countenance
    of Christ the Saviour. And this would mean distorting the saving order of thoughts,
    or, as I would say, wrongly planting Christian consciousness in oneself and darkening
    it.</p><p>This is what I want to remind you of by this — <strong><mark>that as
    the image of our salvation was fashioned by the Son of God, who became incarnate
    not without the Father and the Holy Spirit, so the salvation of each of us is
    wrought in the Lord Jesus Christ not without the participation of the Father and
    the Holy Spirit. And the salvation was wrought for us and each of us is saved
    by God, worshipped in the Trinity, the Father, the Son and the Holy Spirit. This
    must be planted in consciousness, and all who are being saved have it planted
    in their mind and heart.</mark></strong></p></blockquote><p>(Selected letters
    on sects and heresies. Letter 8)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
