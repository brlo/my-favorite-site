  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, hieromartyr (c. 35–107)</h3><blockquote><p><em>“For
    them there is only one Physician </em><strong><em>who is possessed both of flesh
    and spirit; both made and not made; <mark>God existing in flesh</mark>, true life
    in death, both of Mary and of God; first possible and then impossible, <mark>even
    Jesus Christ our Lord</mark></em></strong><em><mark>”</mark> (</em><a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-7"><em>To
    the Ephesians, ch. 7</em></a><em>)</em></p></blockquote><blockquote><p><em>“For
    </em><strong><em><mark>our God, Jesus Christ</mark></em></strong><em>, was, according
    to the appointment of God, conceived in the womb by Mary, of the seed of David,
    but by the Holy Ghost” (</em><a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-18"><em>To
    the Ephesians, ch. 18</em></a><em>)</em></p></blockquote><blockquote><p><em>“Hence
    every kind of magic was destroyed, and every bond of wickedness disappeared; ignorance
    was removed, and the old kingdom abolished, </em><strong><em><mark>God Himself
    being manifested in human form</mark></em></strong><em> for the renewal of eternal
    life” (</em><a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-19"><em>To the Ephesians,
    ch. 19</em></a><em>)</em></p></blockquote><blockquote><p>“(“For the things which
    are seen are temporary, … the things which are not seen are eternal” <a href="https://bibleox.com/en/eng-nkjv/2kor/4/#L18">(2
    Cor. 4:18)</a>.) <strong><mark>Our God Jesus Christ</mark></strong> appears in
    greater glory when He is in the Father” (To the Romans)</p></blockquote><blockquote><p>“I
    glorify <strong><mark>God, even Jesus Christ</mark></strong>, who has given you
    such wisdom. For I have observed that ye are perfected in an immoveable faith,
    as if ye were nailed to the cross of our Lord Jesus Christ, both in the flesh
    and in the spirit, and are established in love through the blood of Christ, being
    fully persuaded with respect to our Lord, that He was truly of the seed of David
    according to the flesh” (<a href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-1">To
    the Smyrnaeans, ch. 1</a>)</p></blockquote><blockquote><p>“I salute him who shall
    be deemed worthy to go into Syria. Grace shall be with him for ever, and with
    Polycarp that sends him. I pray for your happiness for ever in <strong><mark>our
    God, Jesus Christ</mark></strong>” (<a href="https://bibleox.com/en/en/w/IgnAn_Pol#HH-8">To
    Polycarp, ch. 8</a>)</p></blockquote><h2>2nd century</h2><h3>St Aristides of Athens
    (1st c.–134)</h3><blockquote><p>4. <strong><mark>No, the robber recognized in
    the Crucified One undoubtedly God,</mark></strong> and for his appeal of faith
    was called into paradise, and did not himself seize it from the Lord. <strong>Therefore
    depart now, you who recognize the Crucified as an ordinary man, poor, divided
    (divisum), and sinful. For if a pure man of mortal nature can by no means grant
    immortality to another man also mortal by nature, is it likely and plausible that
    he who, by his constitution, is born and created with a nature damaged and corrupted,
    could give incorruption to another being equally damaged and corrupted? Could
    a man likewise open paradise, which God closed to the very first of men</strong>,
    commanding the cherub with the flaming sword to guard its entrance (Gen. 3:24).</p><p>5.
    Therefore: what do you believe about Jesus Christ, who opens paradise, you, blind,
    looking with the eyes of the Jews upon the incarnation of Emmanuel? If Christ
    seems to you only the most excellent of men, then this very Christ, in your opinion
    only a man and moreover crucified, opens paradise, becomes higher than God Himself,
    who closed paradise — one and the same, and yet at the same time contrary to himself.
    Is this not a foolish fable and a false teaching, worthy of laughter and comic
    songs — or rather of weeping! <strong><mark>We, however, confess that the Crucified
    is the true God in the flesh, we worship Him, the Lord who opened paradise.</mark></strong></p></blockquote><p>(On
    the Prudent Thief / Dubia)</p><h3>St Justin Martyr, philosopher (c. 100–165)</h3><blockquote><p><strong><em><mark>He
    is witnessed to by Him who established these things, as deserving to be worshipped,
    as God and as Christ.</mark></em></strong></p><p><em>&lt;…&gt;</em></p><p><em>being
    </em><strong><em><mark>Christ, as God</mark></em></strong><em> strong and to be
    worshipped.</em></p><p><em>&lt;…&gt;</em></p><p><em>For the statement in the law,
    “Cursed is every one that hangeth on a tree,” confirms our hope which depends
    on the crucified Christ, not because He who has been crucified is cursed by God,
    but because God foretold that which would be done by you all, and by those like
    to you, who do not know that </em><strong><em>this is He who existed before all,
    who is the eternal Priest of God, and King, and Christ</em></strong></p><p><em>&lt;…&gt;</em></p><p><em>and
    since we call Him the Son, we have understood that </em><strong><em>He proceeded
    before all creatures from the Father</em></strong><em> by His power and will</em></p><p><em>&lt;…&gt;</em></p><p><em>Now
    I have proved at length that </em><strong><em><mark>Christ is called God</mark></em></strong></p><p><em>&lt;…&gt;</em></p><p><strong><em><mark>Christ</mark></em></strong><em>
    would act so when He became man was foretold by the mystery of Jacob’s wrestling
    with Him who appeared to him, in that He ministered to the will of the Father,
    yet nevertheless </em><strong><em><mark>is God, in that He is the first-begotten
    of all creatures</mark></em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>But
    if you knew, Trypho, who He is that is called at one time </em><strong><em>the
    Angel of great counsel,</em></strong><em> by Ezekiel — </em><strong><em>a Man</em></strong><em>,
    by Daniel — like </em><strong><em>the Son of man</em></strong><em>, by Isaiah
    — </em><strong><em>a Child</em></strong><em>, by David — </em><strong><em>Christ</em></strong><em>
    and </em><strong><em>God to be worshipped</em></strong><em>, by many </em><strong><em>Christ</em></strong><em>
    and </em><strong><em>a Stone</em></strong><em>, by Solomon — </em><strong><em>Wisdom</em></strong><em>,
    by Moses — </em><strong><em>Joseph</em></strong><em>, </em><strong><em>Judah</em></strong><em>
    and </em><strong><em>a Star</em></strong><em>, by Zechariah — </em><strong><em>the
    East</em></strong><em>, and again by Isaiah — </em><strong><em>the Suffering One</em></strong><em>,
    </em><strong><em>Jacob</em></strong><em>, </em><strong><em>Israel</em></strong><em>,
    </em><strong><em>a Rod</em></strong><em>, </em><strong><em>Flower</em></strong><em>,
    </em><strong><em>Corner-Stone</em></strong><em> and </em><strong><em>Son of God</em></strong><em>,
    you would not have blasphemed Him who has now come, and been born, and suffered,
    and ascended to heaven; who shall also come again, and then your twelve tribes
    shall mourn. For if you had understood what has been written by the prophets,
    you would not have denied that </em><strong><em><mark>He was God, Son of the only,
    unbegotten, unutterable God</mark></em></strong><em>.</em></p><p><em>&lt;…&gt;</em></p><p><em>saw
    Him who was according to His will His Son, </em><strong><em><mark>being God</mark></em></strong><em>,
    and the Angel because He ministered to His will; whom also it pleased Him to </em><strong><em>be
    born man by the Virgin</em></strong><em>; who also was fire when He conversed
    with Moses from the bush.</em></p><p><em>&lt;…&gt;</em></p><p><em>And that </em><strong><em><mark>Christ
    being Lord, and God the Son of God</mark></em></strong><em>, appearing formerly
    in power as Man, and Angel, and in the glory of fire as at the bush, so also was
    manifested at the judgment executed on Sodom, has been demonstrated fully by what
    has been said.</em></p><p><em>&lt;…&gt;</em></p><p><strong><em>Christ</em></strong><em>
    is called </em><strong><em>both God</em></strong><em> and Lord of hosts, and Jacob,
    in parable by the Holy Spirit</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho">Dialogue
    with Trypho</a>)</p><blockquote><p><em>the first power after God the Father and
    Lord of all is the Word, </em><strong><em><mark>who is also the Son; and of Him
    we will, in what follows, relate how He took flesh and became man</mark></em></strong></p><p><em>&lt;…&gt;</em></p><p><strong><em>the
    Father of the universe has a <mark>Son</mark>; who also, being the first-begotten
    <mark>Word of God</mark>, is even <mark>God</mark></em></strong><em>. And of old
    He appeared in the shape of fire and in the likeness of an angel to Moses and
    to the other prophets; but now in the times of your reign, as we before said,
    </em><strong><em><mark>become Man by a virgin</mark></em></strong><em>, according
    to the counsel of the Father, for the salvation of those who believe on Him, He
    endured both to be set at nought and to suffer, that by dying and rising again
    He might conquer death.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1">First
    Apology</a>)</p><h3>Melito of Sardis, bishop (c. 100–180)</h3><blockquote><p>For
    as a Son He was born,</p><p>as a lamb He was led,</p><p>and as a sheep He was
    slain,</p><p>and <strong>as a man He was buried,</strong></p><p><strong>He rose
    from the dead as God,</strong></p><p><strong><mark>being by nature God and Man</mark></strong>,</p></blockquote><p>(On
    the Passover, 8)</p><blockquote><p>He that hung up the earth was Himself hanged
    up;</p><p>He that fixed the heavens was fixed with nails;</p><p>He that bore up
    the earth was borne up on a tree;</p><p>the Lord of all was subjected to ignominy
    in a naked body —</p><p><strong>God put to death!</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/melito-fragments#HH-From-the-Discourse-on-the-Cross">Fragments,
    On the Passover, 96</a>)</p><h3><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon">St
    Irenaeus of Lyons, hieromartyr (c. 130–202)</a></h3><blockquote><p>This is the
    mystery which he says was made known to him by revelation, that <strong><mark>He
    who suffered under Pontius Pilate</mark>, the same is Lord of all, and King, and
    <mark>God</mark>, and Judge</strong>, receiving power from Him who is the God
    of all, because He became “obedient unto death, even the death of the cross” (Phil.
    2:8).</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-12">Against
    Heresies, Book III, 12.9</a>)</p><h2>3rd century</h2><h3>A church near the ancient
    city of Megiddo, in the settlement of <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a>
    (c. 230)</h3><p>In the Christian church of the early 3rd century, memorial plaques
    have survived on the floor: the names of donors and their loved ones, who were
    commemorated during the divine services together with the names of other Christians.
    One of these inscriptions contains the naming of Christ as God: “<em>Akeptous,
    the God-loving, offered the table to </em><strong><em>God Jesus Christ</em></strong><em>
    as a memorial</em>”.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">larger</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">larger</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">larger</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">add.
    photo 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">add.
    photo 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">larger</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">larger</a>]</p><p><strong>Inscriptions:</strong></p><p>All
    the inscriptions on the church floor are a kind of <strong>memorial notes</strong>.
    From the most ancient times to the present, in the churches of the Orthodox Church
    there has been a tradition, when divine services are celebrated in a church, always
    to add to the prayerful commemoration the names of those who built the church
    or donated something important. So here too, with the call to commemoration, are
    recorded the names of those who donated the mosaic floor (the centurion Gaius
    Porphyrius), who laid it (Broutus), who donated the altar table (Akeptous), as
    well as some other names, possibly relatives of the donors: Primilla, Cyriacus,
    Dorothea, Christa. In the same way, church vessels were donated in memory of the
    living and the departed: eucharistic chalices and censers (see <a href="https://bibleox.com/en/en/w/Ik1c_A_Collection_of_Ancient_Icons#HH-Eucharistic-chalices-and-censers-with-icons-Byzantium-Syria-Attarouthi">more</a>).</p><blockquote><p><em>RU:
    Акепта, боголюбивая, пожертвовала сей престол Богу Иисусу Христу в поминовение</em></p></blockquote><blockquote><p><em>EN:
    Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</em></p></blockquote><blockquote><p><em>Transcription:
    </em><strong><em>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u
    Ch(rist)ō mnēmosunon.</em></strong></p></blockquote><blockquote><p><em>Orig: </em><strong><em>ΠΡΟСΗΝΙΚΕΝ
    ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</em></strong></p></blockquote><blockquote><p><em>ΠΡΟϹΗΝΙΚΕΝ</em></p><p><em>ΑΚΕΠΤΟΥϹ,</em></p><p><em>Η
    ΦΙΛΟΘΕΟϹ,</em></p><p><em>ΤΗΝ ΤΡΑΠΕ-</em></p><p><em>ZΑΝ </em><strong><em>{ΘW} {ΙΥ}
    {ΧW}*</em></strong></p><p><em>ΜΝΗΜΟϹΥΝΟΝ</em></p></blockquote><p>*Nomina Sacra:
    <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = God Jesus Christ</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">larger</a>]</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
