    priority: 5
  body: <h2>3rd century</h2><h3>Dionysius of Alexandria, hieromartyr (late 2nd c.–264)</h3><blockquote><p>Let
    the man of Samosata also make ready his works for the departure; for the man who
    blasphemes the man-loving Holy Spirit will not depart without punishment. <strong><mark>And
    the Spirit is God</mark></strong>, as Christ the Truth has taught us, Who as God
    is over all, Who came on a light cloud into Egypt, the Lord God of Israel, Jesus
    Christ.</p></blockquote><p>(Paul of Samosata the heretic, ten questions with answers
    to them by St Dionysius, 6)</p><h3>Peter of Alexandria, hieromartyr (3rd c.–311)</h3><blockquote><p>Therefore,
    from the holy Prophets and from all who, as I have said, dwelt equally piously
    and justly in the law of the Lord, and kept the Passover with all the people according
    to the ordinance and with reverence, the Master of all visible and invisible creation,
    <strong>the Only-begotten Son and Word, <mark>consubstantial</mark> with the Father
    and <mark>with the Holy Spirit in divinity</mark>, our Lord and God, Jesus Christ</strong>
    in the fullness of time, born after the flesh from the Holy Glorious Lady, our
    Mother of God and Ever-virgin and truly Mother of God Mary, visible on earth and
    consubstantial with men in human nature, truly remaining as a man, He Himself
    with the people in the years before His preaching lawfully and reverently kept
    the Passover and ate according to the ordinance of the lamb. For He came not to
    abolish the Law or (to do away with the teaching of) the Prophets, but to fulfil
    them, as the Saviour Himself said in the Gospel (see Matt. 5:17).</p></blockquote><p>(On
    the Divinity)</p><h2>4th century</h2><h3>St Gregory the Theologian, bishop (c.
    325–389)</h3><blockquote><p>I therefore write to your Reverence, what indeed you
    knew before, that I never have and never can honour anything above the Nicene
    Faith, that of the Holy Fathers who met there to destroy the Arian heresy; but
    am, and by God’s help ever will be, of that faith; completing in detail that which
    was incompletely said by them concerning the Holy Ghost; for that question had
    not then been mooted, namely, that we are to believe that <strong>the Father,
    Son, and Holy Ghost are of one Godhead, <mark>thus confessing the Spirit also
    to be God</mark></strong>. Receive then to communion those who think and teach
    thus, as I also do; but those who are otherwise minded refuse, and hold them as
    strangers to God and the Catholic Church.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-letters#HH-Against-Apollinarius-The-Second-Letter-to-Cledonius">Select
    Letters, To Cledonius the priest, against Apollinarius (Ep. 102)</a>)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
