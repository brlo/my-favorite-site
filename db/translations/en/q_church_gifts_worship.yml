      <blockquote><p>“And some of the Pharisees called to Him from the crowd, ‘Teacher, rebuke Your disciples.’ But He answered and said to them, ‘I tell you that <strong>if these should keep silent, the stones would immediately cry out</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/19/#L39-40">Luke. 19:39-40</a>)</p></blockquote><blockquote><p>“You shall keep My Sabbaths and <strong>reverence My sanctuary</strong>: I am the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">Lev. 26:2</a>)</p></blockquote><h2>During the Earthly Life of Christ</h2><p>Christ gathers the disciples for the Eucharist in a large prepared room:</p><blockquote><p>“Then he will show you <strong>a large upper room,</strong> <strong>furnished</strong> and prepared; there make ready for us” (<a href="https://bibleox.com/en/eng-nkjv/mk/14/#L15">Mark. 14:15</a>)</p></blockquote><p>Christians, after the creation of the Church, gather in the temple:</p><blockquote><p>“So <strong><em><mark>continuing daily</mark></em></strong><em> with one accord </em><strong><em><mark>in the temple</mark></em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L46">Act. 2:46</a>)</p></blockquote><blockquote><p>“and <strong><em><mark>were continually in the temple</mark></em></strong><em> praising and blessing God</em>” (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L53">Luke. 24:53</a>)</p></blockquote><h2>After the Ascension of Christ into Heaven</h2><p>Christians constantly visited the temple:</p><blockquote><p><em>“and were continually </em><strong><em><mark>in the temple</mark></em></strong><em> praising and blessing God. Amen” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/24/#L53"><em>Luke. 24:53</em></a><em>)</em></p></blockquote><blockquote><p><em>“So continuing daily with one accord </em><strong><em><mark>in the temple</mark></em></strong><em>, and </em><strong><em>breaking bread from house to house</em></strong><em>, they ate their food with gladness and simplicity of heart” (</em><a href="https://bibleox.com/en/eng-nkjv/act/2/#L46"><em>Act. 2:46</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now Peter and John </em><strong><em>went up together <mark>to the temple</mark></em></strong><em> at the hour of prayer, the ninth hour” (</em><a href="https://bibleox.com/en/eng-nkjv/act/3/#L1"><em>Act. 3:1</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now it happened, when I returned to Jerusalem and</em><strong><em> was praying <mark>in the temple</mark></em></strong><em>, that I was in a trance” (</em><a href="https://bibleox.com/en/eng-nkjv/act/22/#L17"><em>Act. 22:17</em></a><em>)</em></p></blockquote><blockquote><p><em>“because you may ascertain that it is no more than twelve days since I </em><strong><em>went up to Jerusalem to worship</em></strong><em>. And they neither found me </em><strong><em><mark>in the temple</mark></em></strong><em> disputing with anyone nor inciting the crowd, either in the synagogues or in the city” (</em><a href="https://bibleox.com/en/eng-nkjv/act/24/#L11-12"><em>Act. 24:11-12</em></a><em>)</em></p></blockquote><p>Christians also gathered in their own special premises:</p><blockquote><p><em>“So it was that </em><strong><em>for a whole year they assembled <mark>with the church</mark></em></strong><em> and taught a great many people. And the disciples were first called Christians in Antioch” (</em><a href="https://bibleox.com/en/eng-nkjv/act/11/#L26"><em>Act. 11:26</em></a><em>)</em></p></blockquote><blockquote><p><em>“For first of all, when you </em><strong><em>come together as a church</em></strong><em>, I hear that there are divisions among you, and in part I believe it. &lt;...&gt; Therefore when you come together in one place, it is not to eat the Lord’s Supper. For in eating, each one takes his own supper ahead of others; and one is hungry and another is drunk. What! </em><strong><em>Do you not have houses to eat and drink in?</em></strong><em> Or </em><strong><em>do you despise <mark>the church of God</mark></em></strong><em> and shame those who have nothing?” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L18-22"><em>1 Cor. 11:18-22</em></a><em>)</em></p></blockquote><blockquote><p><em>“Let your women keep silent </em><strong><em><mark>in the churches</mark></em></strong><em>, for they are not permitted to speak; but they are to be submissive, as the law also says. And if they want to learn something, </em><strong><em>let them ask their own husbands at home</em></strong><em>; for </em><strong><em>it is shameful for women to speak <mark>in church</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/14/#L34-35"><em>1 Cor. 14:34–35</em></a><em>)</em></p></blockquote><h2>The Prophetic Depiction of the Heavenly Temple</h2><p>The depiction of the heavenly temple in Revelation</p><p><strong>The command to measure the heavenly temple</strong></p><blockquote><p><em>“Then I was given a reed like a measuring rod. And the angel stood, saying, ‘Rise and </em><strong><em>measure <mark>the temple of God</mark></em></strong><em>, the altar, and those who worship there’” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/11/#L1"><em>Rev. 11:1</em></a><em>)</em></p></blockquote><p><strong>The throne</strong></p><blockquote><p><em>“the twenty-four elders fall down before </em><strong><em>Him who sits <mark>on the throne</mark></em></strong><em> and worship Him who lives forever and ever, and cast their crowns before the throne” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/4/#L10"><em>Rev. 4:10</em></a><em>)</em></p></blockquote><blockquote><p><em>“And the twenty-four elders who sat before God on their thrones fell on their faces and worshiped God” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/11/#L16"><em>Rev. 11:16</em></a><em>)</em></p></blockquote><p><strong>The altar</strong></p><blockquote><p><em>“Then another angel, having a golden censer, came and stood at </em><strong><em><mark>the altar</mark></em></strong><em>. He was given much incense, that he should offer it with the prayers of all the saints upon the golden </em><strong><em><mark>altar</mark></em></strong><em> which was </em><strong><em>before the throne</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3"><em>Rev. 8:3</em></a><em>)</em></p></blockquote><blockquote><p><em>“Then the angel took the censer, filled it with fire from </em><strong><em><mark>the altar</mark></em></strong><em>, and threw it to the earth. And there were noises, thunderings, lightnings, and an earthquake” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L5"><em>Rev. 8:5</em></a><em>)</em></p></blockquote><blockquote><p><em>“Then the sixth angel sounded: And I heard a voice from the four horns of the golden </em><strong><em><mark>altar</mark></em></strong><em> which is before God” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/9/#L13"><em>Rev. 9:13</em></a><em>)</em></p></blockquote><p><strong>The seven-branched lampstand</strong></p><blockquote><p><em>“And from the throne proceeded lightnings, thunderings, and voices. </em><strong><em><mark>Seven lamps</mark> of fire </em></strong><em>were burning</em><strong><em> before the throne</em></strong><em>, which are the seven Spirits of God” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/4/#L5"><em>Rev. 4:5</em></a><em>)</em></p></blockquote><p><strong>Censing</strong></p><blockquote><p><em>“Then another angel, having </em><strong><em>a golden censer</em></strong><em>, came and stood at the altar. He was given </em><strong><em>much <mark>incense</mark></em></strong><em>, that he should offer it with the prayers of all the saints upon the golden altar which was before the throne. &lt;...&gt; Then </em><strong><em>the angel took the censer</em></strong><em>, filled it with fire from the altar, and threw it to the earth. And there were noises, thunderings, lightnings, and an earthquake” (</em><a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3,5"><em>Rev. 8:3,5</em></a><em>)</em></p></blockquote><h2>God Commanded the Temple to Be Revered</h2><p>The temple is an <a href="https://bibleox.com/ru/ru/w/%D1%85%D1%80%D0%B0%D0%BC-%D0%BE%D0%B1%D1%80%D0%B0%D0%B7-%D0%BD%D0%B5%D0%B1%D0%B5%D1%81%D0%BD%D0%BE%D0%B9-%D1%80%D0%B5%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8">image of the heavenly reality</a>. God commanded this image to be revered:</p><blockquote><p>“You shall keep My Sabbaths and <strong>reverence My sanctuary</strong>: I am the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>)</p></blockquote><blockquote><p>“You shall keep My Sabbaths and <strong>reverence My sanctuary</strong>: I am the LORD” (<a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">Lev. 26:2</a>)</p></blockquote><p>The New Testament temple is arranged after the image from the Revelation of John the Theologian.</p><h2>Criticism</h2><h3>Did the Apostles Visit the Temple Because They Did Not Understand?</h3><p>It happened that the Apostles did not understand everything well in questions of faith. For example, they thought that Christ was going to become king in Jerusalem (<a href="https://bibleox.com/en/eng-nkjv/mk/10/#L37-39">Mark 10:37-39</a>), and they did not understand Christ’s words about His suffering and resurrection, being afraid to ask (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L31-32">Mark 9:31-32</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/9/#L45">Luke 9:45</a>).</p><p>However, all this was only until the gifts of the Holy Spirit were sent to them on the day of Christ’s resurrection (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L21-23">John 20:21-23</a>), and also on the fiftieth day after the resurrection (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L1-4">Acts 2:1-4</a>). Moreover, after the resurrection Christ opened their understanding to comprehend the Scriptures (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L45">Luke 24:45</a>). Even before the resurrection Christ promised to give the apostles wisdom that could not be contradicted (<a href="https://bibleox.com/en/eng-nkjv/lk/21/#L15">Luke 21:15</a>), which the apostle later reports, that God made grace abound toward them in all wisdom and prudence (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L8">Eph. 1:8</a>). The Apostle Paul reports that he may be untrained in speech (expressing himself with difficulty), but not in knowledge (<a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L6">2 Cor. 11:6</a>).</p><p>When Protestants wish to show their “higher” enlightenment in questions of faith than that of the apostles, they refer to various cases before the descent of the Holy Spirit upon the apostles. However, this is incorrect, since the Church is created and arranged later, when the apostles no longer have cases of misunderstanding the faith.</p><p>So, after the sending of the Holy Spirit, the apostles understood questions of faith and had no lack of knowledge. Even if there had been some misunderstanding, the Lord had not disappeared; He instructed the apostles. Thus, for example, through a vision He showed the Apostle Peter that the centurion Cornelius, that is, a non-Jew, should be baptized, although this caused perplexity for some in the Church at that time.</p><h3>Must God Be Worshiped Not in a Temple, but in Spirit and Truth?</h3><p>If we follow Scripture, this conversation is not about temples, but about the place of worship.</p><blockquote><p>“The woman said to Him, ‘Sir, I perceive that You are a prophet. Our fathers worshiped on this mountain, and you Jews say that in Jerusalem is <strong><u>the place</u> where one ought to worship</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/4/#L19-20">John 4:19-20</a>)</p></blockquote><p>The Samaritan woman by her question puts Christ within limits: where to worship?</p><ul><li><p>on Mount Gerizim;</p></li><li><p>in the Jerusalem temple.</p></li></ul><p>But Christ says that the time is coming (and has now come) when people will worship neither on the mountain nor in Jerusalem, but in spirit and truth:</p><blockquote><p>“Jesus said to her, ‘Woman, believe Me, <strong><u>the hour is coming when you will neither on this mountain, nor in Jerusalem, worship</u></strong> the Father. You worship what you do not know; we know what we worship, for salvation is of the Jews. But <strong><u>the hour is coming, and now is, when the true worshipers will worship the Father in spirit and truth</u></strong>; for the Father is seeking such to worship Him’” (<a href="https://bibleox.com/en/eng-nkjv/in/4/#L21-23">John 4:21-23</a>)</p></blockquote><p>As one can see, there is no talk of temples here. And if someone considers that it is about temples, then let him also forbid praying on mountains, because Christ speaks of the mountain as well. And then those who forbid temples will forbid mountains too: do you live on a mountain? — do not pray. But this is not reasonable, of course.</p><p>One should also note that Christ says that the time for this worship has already come. And nevertheless, Christ comes to the Jerusalem temple, calling it the house of the Father and a house of prayer, showing care that nothing should hinder prayer there.</p><p>That is, although the time of worship in spirit and truth has already come, this did not abolish the temple. This house was left desolate by Christ only when, after the majority of Israel rejected their Savior, Christ takes the vineyard from the former hired workers (the Old Testament priesthood) and gives the vineyard to others — the apostles, saying to those whom He rejected that their house is left to them desolate, that is, the grace of God leaves it:</p><blockquote><p>“See! <strong><u>Your house is left to you desolate</u></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/23/#L38">Matt. 23:38</a>)</p></blockquote><p>The symbol of this became the split rocks and the torn veil after the death of Christ on the cross:</p><blockquote><p>“Then, behold, <strong><u>the veil of the temple was torn in two from top to bottom; and the earth quaked, and the rocks were split</u></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L51">Matt. 27:51</a>)</p></blockquote><p>From then on Christians prayed in any place in the universe, and everywhere offered the new sacrifice in the Eucharist: in buildings, and not in buildings.</p><h3>Why Are Temples Needed? After All, the Veil Was Torn (Matt. 27:51), So God Left the Temple?</h3><p>For salvation, temples (as buildings of stone) are not needed. Many saints of the Orthodox Church were saved in deserts. However, for salvation it is necessary to participate in the sacraments, which are performed at divine services, for which buildings are needed for natural reasons. However, when necessary, the Orthodox Church manages without buildings.</p><p>Since there is a building, the Church considers it a place dedicated to God, that is, a temple. In this place people call upon the name of God, here divine grace is manifested in the sacraments, here Christ Himself is present in the sacrament of the Eucharist. Therefore the Orthodox especially revere such places as places of God’s manifestation, as God Himself requires reverence for the places where He appears (<a href="https://bibleox.com/en/eng-nkjv/ish/3/#L5">Ex. 3:5</a>), including requiring the temple to be revered (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">Lev. 26:2</a>).</p><p>The torn veil of the Old Testament temple points to the abolition of the Old Testament church: it points to the fact that the temple in Jerusalem was abandoned by God as the meeting place of the Old Testament church (Israel) with God. The vineyard was taken from the Old Testament church (<a href="https://bibleox.com/en/eng-nkjv/mf/21/#L43">Matt. 21:43</a>) and given to the New Testament Church created by Christ, who changed the Covenant and the priesthood (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L12">Heb. 7:12</a>).</p><p>The New Testament Church does not use the abandoned temple of the Old Testament church, does not celebrate divine services there and does not expect God to appear to her there.</p><h3>There Was One Temple and It Was Destroyed, So Temples May Not Be Built?</h3><p>The temple was destroyed not for the first time. This was already the second temple. And before that there was a portable temple — the Tabernacle of Meeting, which the Israelites moved through the Sinai wilderness. When the temple was destroyed the first time by Nebuchadnezzar, did this mean that God rejected the possibility of worship in temples? If not, then why should it be so later, when the Romans did it again?</p><p>The Jews who rejected Christ thought that one could pray and worship God only in the Jerusalem temple. They summoned the first martyr Archdeacon Stephen to judgment before the Sanhedrin, accusing him of teaching that this place would be destroyed and the customs changed (<a href="https://bibleox.com/en/eng-nkjv/act/6/#L13-14">Acts 6:13-14</a>). The archdeacon’s speech of defense consisted in showing, by recounting in detail the history of the forefathers, that they prayed and offered sacrifices to God everywhere: wherever they were, God was with them (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L2-53">Acts 7:2-53</a>).</p><p>In conclusion he points out that this temple too was built by Solomon at the wish and prayer of the forefather David, although God made it clear that He had no need for a house to be built for Him:</p><blockquote><p>“who [<strong><u>David</u></strong>] found favor before God and <strong><u>asked to find a dwelling for the God</u></strong> of Jacob. But Solomon built Him a house. <strong><u>However, the Most High does not dwell in temples made with hands</u></strong>, as the prophet says: ‘Heaven is My throne, and earth is My footstool. <strong><u>What house will you build for Me? says the LORD, or what is the place of My rest?</u></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L46-49">Acts 7:46-49</a>)</p></blockquote><p>So even before the making of the Old Covenant the righteous prayed and offered sacrifices everywhere. Later, God established for Israel a centralized form of worship with one temple and one high priest, since geographically they were always close. Such a form of worship was meant to secure the unity desired by God.</p><p>But when the Lord, according to the prophecy (<a href="https://bibleox.com/en/eng-nkjv/is/66/#L18-21">Isa. 66:18-21</a>), calls all nations into the Church, He also creates the conditions for performing divine services among all nations everywhere. He Himself becomes the High Priest (present everywhere as God), sends grace and gives authority not to some one person only, but to many apostles (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L18">Matt. 18:18</a>), not tying the Eucharistic sacrifice to any locality (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L19">Luke 22:19</a>), sending the apostles throughout the world (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L15">Mark 16:15</a>).</p><p>It is precisely around the Eucharist that the divine service of Christians is built. A temple is not needed for this. Those who say of the Orthodox that we necessarily need a temple to celebrate divine services simply invent about us what we do not teach. Divine services, when necessary, are celebrated in any place: in a hospital, in the army, in prison, while traveling on a ship, a plane, a train, in a forest.</p><p>We do not teach that temples (as buildings of stone) are needed for salvation. Many saints of the Orthodox Church were saved in deserts. However, for salvation it is necessary to participate in the sacraments, which are performed at divine services, for which buildings are needed for natural reasons. When necessary, the Orthodox Church manages without buildings.</p><p>Since there is a building, the Church considers it a place dedicated to God, that is, a temple. In this place people call upon the name of God, here divine grace is manifested in the sacraments, here Christ Himself is present in the sacrament of the Eucharist. Therefore the Orthodox especially revere such places as places of God’s manifestation, as God Himself requires reverence for the places where He appears:</p><blockquote><p>“Then He said, ‘Do not draw near this place. Take your sandals off your feet, for <strong><u>the place where you stand is holy ground</u></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/ish/3/#L5">Ex. 3:5</a>)</p></blockquote><p>And He also requires His temple to be revered (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">Lev. 26:2</a>).</p><p>The New Testament Church of Christ does not teach that one may worship only in Jerusalem, only on the Samaritan mountain, or even only in a temple. One may worship God and pray to Him everywhere.</p><hr><p>The Orthodox do not build temples in order to enter the Old Covenant or to fulfill the Law of Moses. The Old Covenant is finished, and the Law of Moses has been abolished.</p><p>We build premises for common assemblies, in which we pray and offer the sacrifice. No one ever forbade building such premises.</p><p>The Old Testament temple is important as an idea. God commanded it to be built by analogy with the heavenly reality. That is, the temple by design was to be an icon of heaven.</p><p>In detail, with all the necessary references to Scripture: <a href="https://bibleox.com/ru/ru/w/%D1%85%D1%80%D0%B0%D0%BC-%D0%BE%D0%B1%D1%80%D0%B0%D0%B7-%D0%BD%D0%B5%D0%B1%D0%B5%D1%81%D0%BD%D0%BE%D0%B9-%D1%80%D0%B5%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8">https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности</a></p><p>In the times of the Old Testament God was invisible, and in heaven there were only angels.</p><p>In the New Testament Christ God visibly takes His throne in heaven, and besides angels people also appear there. Therefore, when Christians come to have premises for assemblies, they arrange them according to the same design of God as before — so that the temple depicts heaven.</p><p>Since heaven has changed, the temple has also changed. The temple now depicts God incarnate, and besides angels other inhabitants of heaven are also depicted — righteous people.</p><p>God never created empty and meaningless premises, as Protestants often demand. He arranged the world itself so that, looking at it, we should learn something about its Creator. That is, the world preaches to us. And the temple is arranged so as to preach about Christ and His Heavenly Kingdom, and not about empty white walls.</p><h3>Temples in Honor of Icons</h3><p>Orthodox temples are built only in the name of God. Inside, divine services are performed only to God. 95% of the prayers are offered to God, the rest to His saints: the angels and the righteous in heaven.</p><p>Every temple is associated with sacred commemorations. For example, there are temples in honor of the Transfiguration of Christ, or the Ascension of Christ. This does not mean that people pray there to the events of the Ascension and the Transfiguration. There are also temples in which it is commemorated how this or that icon was given (miraculously), or how the deliverance of a city from enemies was connected with an icon. These are sacred commemorations. When a temple is named in honor of a sacred commemoration, this does not mean that people pray there to the sacred commemoration. The divine services in all temples are the same.</p>

  - src: чин-порядок-обряд
    path: Or20d_Order_and_Rite
    title: Order, Rite, Ritual
    menu: { parent: Church/Worship, title: Order and Rite, priority: 20 }
    body: |-
      <h2>Definition</h2><p><strong>An order (rite)</strong> is an established order of some repeated action. Anything at all that is ordered can be called an order.</p><p><strong>An order of service</strong> is a sequential, detailed exposition of the content of some divine service.</p><p>The sacraments too are performed according to an established order, or in other words — an order of service.</p><h2>In the Church Everything Must Be Done in Order</h2><blockquote><p>“Let all things be done decently and <strong>in order</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/14/#L40">1 Cor. 14:40</a>) <em>(Greek: κατὰ τάξιν — “according to order”)</em></p></blockquote><blockquote><p>“But we command you, brethren, in the name of our Lord Jesus Christ, that you withdraw from every brother who walks <strong>disorderly</strong> and not according to the tradition which he received from us” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L6">2 Thess. 3:6</a>)</p></blockquote><blockquote><p>“For we hear that there are some who walk among you in a <strong>disorderly</strong> manner, not working at all, but are busybodies” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L11">2 Thess. 3:11</a>)</p></blockquote>
