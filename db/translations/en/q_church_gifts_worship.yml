      <ol><li><p>The “Phaenomena” of Aratus of Cilicia, and also Cleanthes, a disciple of Zeno (<a href="https://bible.optina.ru/new:act:17:28">see</a>, in Russian).</p></li><li><p>Epimenides (Crete) (<a href="https://bible.optina.ru/new:tit:01:12">see</a>, in Russian).</p></li></ol>
    body: |-
      <h2>God Confused the Languages at Babel</h2><p>The building of the tower of Babel is figuratively an attempt to reach heaven without God, by one’s own efforts. This led to the confusion of languages and the loss of understanding of one another’s languages:</p><blockquote><p>“And they said, ‘Come, let us build ourselves a city, and <strong>a tower whose top is <mark>in the heavens</mark></strong>; let us make a name for ourselves, lest we be scattered abroad over the face of the whole earth.’ But the LORD came down to see the city and the tower which the sons of men had built. And the LORD said, ‘Indeed <strong>the people are one and they all have one language</strong>, and this is what they begin to do; now nothing that they propose to do will be withheld from them. Come, let Us go down and there <strong><mark>confuse their language, that they may not understand one another’s speech</mark></strong>.’ So the LORD scattered them abroad from there over the face of all the earth, and they ceased building the city. Therefore its name is called Babel, because <strong>there the LORD confused the language of all the earth</strong>; and from there the LORD scattered them abroad over the face of all the earth” (<a href="https://bibleox.com/en/eng-nkjv/gen/11/#L4-9">Gen. 11:4-9</a>)</p></blockquote><h2>God Overcame the Confusion of Languages in the Church</h2><p>On the day of the Church’s formation and the descent of the Holy Spirit, God gives the apostles the gift of understanding foreign languages:</p><blockquote><p>“When the Day of Pentecost had fully come, they were all with one accord in one place. And suddenly there came a sound from heaven, as of a rushing mighty wind, and it filled the whole house where they were sitting. Then there appeared to them divided tongues, as of fire, and one sat upon each of them. And <strong>they were all filled with the Holy Spirit and <mark>began to speak with other tongues</mark></strong>, as the Spirit gave them utterance” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L1-4">Act. 2:1-4</a>)</p></blockquote><h2>Other Tongues Are Foreign Languages</h2><p>Those who had come from other lands marveled at how the Galileans (the apostles) could speak foreign languages:</p><blockquote><p>“And there were dwelling in Jerusalem Jews, devout men, from every nation under heaven. And when this sound occurred, the multitude came together, and were confused, because <strong><mark>everyone heard them speak in his own language</mark></strong>. Then they were all amazed and marveled, saying to one another, ‘Look, <strong>are not all these who speak Galileans?</strong> And how is it that we hear, each in our own language in which we were born? <strong><mark>Parthians</mark></strong> and <strong><mark>Medes</mark></strong> and <strong><mark>Elamites</mark></strong>, <strong><mark>those dwelling in Mesopotamia</mark></strong>, <strong><mark>Judea</mark></strong> and <strong><mark>Cappadocia</mark></strong>, <strong><mark>Pontus</mark></strong> and <strong><mark>Asia</mark></strong>, <strong><mark>Phrygia</mark></strong> and <strong><mark>Pamphylia</mark></strong>, <strong><mark>Egypt</mark></strong> and <strong><mark>the parts of Libya</mark></strong> adjoining Cyrene, visitors from <strong><mark>Rome</mark></strong>, both Jews and proselytes, <strong><mark>Cretans</mark></strong> and <strong><mark>Arabs</mark></strong> — <strong><u><mark>we hear them speaking in our own tongues</mark></u></strong> the wonderful works of God.’ So they were all amazed and perplexed, saying to one another, ‘Whatever could this mean?’” (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L5-12">Act. 2:5-12</a>)</p></blockquote><h2>Not Everyone Has the Gift of Tongues</h2><ol><li><p><strong>Not everyone</strong> receives the gift of knowing other languages.</p></li><li><p>Those who receive the gift of tongues know <strong>different</strong> languages.</p></li><li><p>All gifts, including the gift of tongues, are given <strong>for the profit</strong> of the work.</p></li></ol><blockquote><p>“<strong><mark>There are diversities of gifts</mark></strong>, but the same Spirit. There are <strong>differences of ministries</strong>, but the same Lord. And there are diversities of activities, but it is the same God who works all in all. But the manifestation of the Spirit <strong><mark>is given</mark></strong> to each one <strong><mark>for the profit</mark></strong> of all:</p><p><strong>for to one </strong>is given <strong>the word of wisdom</strong> through the Spirit,</p><p><strong>to another</strong> the word of knowledge through the same Spirit,</p><p><strong>to another</strong> faith by the same Spirit,</p><p><strong>to another</strong> gifts of healings by the same Spirit,</p><p><strong>to another</strong> the working of miracles,</p><p><strong>to another</strong> prophecy,</p><p><strong>to another</strong> discerning of spirits,</p><p><strong><mark>to another</mark></strong> <strong><u><mark>different kinds(!)</mark></u><mark> of tongues</mark></strong>,</p><p><strong>to another</strong> the interpretation of tongues” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L4-10">1 Cor. 12:4-10</a>)</p></blockquote><blockquote><p>“And God has appointed these in the church: first apostles, second prophets, third teachers, after that miracles, then gifts of healings, helps, administrations, <strong><u><mark>varieties</mark></u><mark> of tongues</mark></strong>.</p><p><strong>Are all</strong> apostles?</p><p><strong>Are all</strong> prophets?</p><p><strong>Are all</strong> teachers?</p><p><strong>Are all</strong> workers of miracles?</p><p><strong>Do all</strong> have gifts of healings?</p><p><strong><mark>Do all speak with tongues?</mark></strong></p><p><strong>Do all</strong> interpret?</p><p>But earnestly desire the best gifts. And yet I show you a more excellent way” (<a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L28-31">1 Cor. 12:28-31</a>)</p></blockquote><h2>Knowledge of the Greek Language Was Not Enough for the Apostle to Preach to All People</h2><p>A Roman commander is surprised that the apostle knows even the most widespread language — Greek. That is, although Greek was widespread (a lingua franca), this does not mean that everyone understood it.</p><p>The highly educated Apostle Paul, who studied under Gamaliel, a teacher of the law known and respected by all the people (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L3">Act. 22:3</a>), a Pharisee and member of the Sanhedrin (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L34">Act. 5:34</a>), who quotes Greek philosophers and writers (<a href="https://bibleox.com/en/eng-nkjv/act/17/#L28">Act. 17:28</a> [1]; <a href="https://bibleox.com/en/eng-nkjv/tit/1/#L12">Titus. 1:12</a> [2]), addresses the Roman commander in Greek. The commander is surprised that the Apostle Paul knows Greek:</p><blockquote><p>“Then the commander came near and took him, and commanded him to be bound with two chains; and he asked who he was and what he had done. &lt;...&gt; Then as Paul was about to be led into the barracks, he said to the commander, ‘May I speak to you?’ He replied, ‘<strong><mark>Can you speak Greek?</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/21/#L33,37">Act. 21:33,37</a>)</p></blockquote><p>The Roman commander is surprised that a Jew knows the most widespread language in the Roman Empire. This can be surprising only if it <strong>is a rarity</strong>. If knowledge of even the Greek language in such an educated man is surprising, then what is there to say about a natural knowledge of Greek among the other apostles, many of whom were ordinary fishermen, uneducated and simple people (<a href="https://bibleox.com/en/eng-nkjv/act/4/#L13">Act. 4:13</a>). But the problem is not only that for preaching everywhere the preacher (the apostle) must know the language; the hearer must also know Greek.</p><p>So knowledge of Greek alone is not enough, and therefore the apostles, as living witnesses of the life, resurrection and teaching of Jesus Christ, needed supernatural gifts, among them the knowledge of languages, so that this witness about Christ, together with their faith, could be passed on to all nations.</p><h2>There Is No Profit If No One Understands the One Who Speaks in Other Tongues</h2><blockquote><p>“But now, brethren, <strong>if</strong> I come to you <strong>speaking with tongues, <mark>what shall I profit you</mark> unless I speak to you</strong> either by revelation, by knowledge, by prophesying, or by teaching? &lt;...&gt; So likewise you, unless you utter by the tongue words easy to understand, how will it be known what is spoken? For you <strong>will be speaking into the air</strong>. There are, it may be, so many kinds of <strong>languages</strong> in the world, and <strong>none of them is without significance</strong>. Therefore, if I do not know the meaning of the language, I shall be a foreigner to him who speaks, and he who speaks will be a foreigner to me. Even so you, since you are zealous for spiritual gifts, <strong>let it be <mark>for the edification</mark> of the church that you seek to <mark>excel</mark></strong>. Therefore let him who speaks in a tongue pray that he may <strong>interpret</strong>. &lt;...&gt; Otherwise, if you bless with the spirit, how will he who occupies the place of the uninformed say ‘Amen’ at your giving of thanks, since he does not understand what you say? For you indeed give thanks well, but <strong><mark>the other is not edified</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/14/#L6,9-13,16-17">1 Cor. 14:6,9-13,16-17</a>)</p></blockquote><h2>Do Not Speak in Other Tongues in the Church Without an Interpreter</h2><blockquote><p>“If anyone speaks in a tongue, let there be two or at the most three, each in turn, and let one interpret. <strong><mark>But if there is no interpreter, let him keep silent in church</mark></strong>, and let him speak to himself and to God. &lt;...&gt; For God is not the author of confusion but of peace, as in all the churches of the saints” (<a href="https://bibleox.com/en/eng-nkjv/1kor/14/#L27-28,33">1 Cor. 14:27-28,33</a>)</p></blockquote><p>And the occupation of the prophets was preaching:</p><blockquote><p>“Now <strong>Judas and Silas, themselves being prophets also, exhorted</strong> and strengthened the brethren with many words” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L32">Act. 15:32</a>)</p></blockquote><h2>A Call to Strive More for the Gift of Prophecy (Preaching and Interpretation) Than for Other Tongues</h2><blockquote><p>“Pursue love, and <strong>desire spiritual gifts, <mark>but especially that you may prophesy</mark></strong>. For he who speaks in a tongue does not speak to men but to God, for no one understands him; however, in the spirit he speaks mysteries. But he who prophesies speaks <strong>edification</strong> and <strong>exhortation</strong> and <strong>comfort</strong> to men. He who speaks in a tongue edifies himself, but <strong><mark>he who prophesies edifies the church</mark></strong>. I wish you all spoke with tongues, but <strong><mark>even more that you prophesied</mark></strong>; for <strong><mark>he who prophesies is greater than he who speaks with tongues</mark></strong>, unless indeed he interprets, that the church may receive edification. &lt;...&gt; Therefore, brethren, <strong><mark>desire earnestly to prophesy</mark></strong>, and do not forbid to speak with tongues” (<a href="https://bibleox.com/en/eng-nkjv/1kor/14/#L1-5,39">1 Cor. 14:1-5,39</a>)</p></blockquote><h2>Tongues Will Cease</h2><blockquote><p>“Love never fails. But whether there are prophecies, they will fail; whether there are tongues, <strong>they will cease</strong>; whether there is knowledge, it will vanish away” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>)</p></blockquote><h2>Love Is the Greatest Gift, Toward Which One Must Strive</h2><blockquote><p>“<strong>Though I <mark>speak with the tongues</mark></strong> of men and of angels, <strong><mark>but have not love</mark></strong>, I have become sounding brass or a clanging cymbal. And though I have the gift of prophecy, and understand all mysteries and all knowledge, and though I have all faith, so that I could remove mountains, but have not love, <strong><mark>I am nothing</mark></strong>. &lt;...&gt; And now abide faith, hope, love, these three; but <strong>the greatest of these is love</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L1-2,13">1 Cor. 13:1-2,13</a>)</p></blockquote><h2>A Different Spirit, Which the Apostles Did Not Give</h2><blockquote><p><em>“For if he who comes preaches </em><strong><em>another Jesus</em></strong><em> whom we have not preached, or if you receive </em><strong><em><mark>a different spirit</mark></em></strong><em> </em><strong><em>which you have not received</em></strong><em>, or </em><strong><em>a different gospel</em></strong><em> which you have not accepted — you may well put up with it!” (</em><a href="https://bibleox.com/en/eng-nkjv/2kor/11/#L4"><em>2 Cor. 11:4</em></a><em>)</em></p></blockquote><h2>Missionaries Today Learn Languages</h2><p>In antiquity the apostles and the first Christians received gifts of knowing foreign languages out of extraordinary necessity, so that the still very small Church could spread widely and preach to all nations. But today missionaries have to learn languages, that is, to labor. And for this there are now all the means; only the desire may be lacking.</p><p>There are societies of people who believe in Christ (charismatics and Pentecostals) who may claim to have the gift of other tongues and of their interpretation, but when they find themselves in other countries, the foreigners do not understand them, and so such missionaries either keep speaking their native languages, or have to learn languages by ordinary means, with the help of textbooks and teachers.</p><p>In our time this gift is almost absent. In the Orthodox Church there is a saint of the 20th century — Venerable Paisios the Athonite — who never learned any languages other than his native one (Greek), and did not claim to have the gift of other tongues, but when foreigners came to him, they were able to talk with him without an interpreter in French, and another time in English.</p><h2>Criticism</h2><h3>Various Questions About the Texts of 1 Corinthians 14</h3><p>Many questions are raised about chapter 14 of the Epistle to the Corinthians, so it makes sense simply to go through the whole chapter. This is done in <a href="https://bibleox.com/ru/ru/w/K5Ou_%D0%98%D0%BD%D1%8B%D0%B5_%D1%8F%D0%B7%D1%8B%D0%BA%D0%B8_%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D1%85_%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD_%D0%B8_%D0%BF%D0%BE%D0%B7%D0%B4%D0%BD%D0%B5%D0%B9%D1%88%D0%B8%D0%B5_%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D0%B8">a separate article</a> (in Russian).</p><h3>Will Tongues Cease Only in the Age to Come?</h3><p>The Orthodox point out to Pentecostals and charismatics the words of the Apostle Paul that tongues will cease (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>), that is, this gift will stop. Of course, it will not disappear completely, for very rare contemporary saints in Orthodoxy are known to have had the gift of speaking foreign languages, but in general there will no longer be such a mass phenomenon as we see among the first Christians.</p><p>To this the neo-Protestant Pentecostals answer that tongues will cease only in the age to come, after the coming of Christ. Some of them consider the basis for this opinion to be the following words about the time “<em>when that which is perfect has come</em>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L10">1 Cor. 13:10</a>).</p><p>Let us look at this text in a wider context:</p><blockquote><p>“<strong>Love never fails</strong>. But whether there are <strong><mark>prophecies</mark>, they will fail; whether there are <mark>tongues</mark>, they will cease</strong>; whether there is <strong><mark>knowledge</mark>, it will vanish away. For <mark>we know in part</mark> and <mark>we prophesy in part</mark></strong>. <strong><mark>But when that which is perfect has come, then that which is in part will be done away</mark></strong>. When I was a child, I spoke as a child, I understood as a child, I thought as a child; but when I became a man, I put away childish things. For now <strong>we see in a mirror, dimly</strong>, but then face to face. <strong><mark>Now I know in part</mark></strong>, but then I shall know just as I also am known. And now abide faith, hope, love, these three; but the greatest of these is love” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8-13">1 Cor. 13:8-13</a>)</p></blockquote><p>The apostle said that when “that which is perfect has come”, then that which is “in part” will be done away. And what is in part? <strong>Knowledge</strong>. In this sentence he began to explain his difficult expression that “<strong><em>knowledge</em></strong><em> will vanish away</em>”. He now needs to convey the thought that it is not knowledge itself that will vanish away (that is, as if they will know nothing), but this partial knowledge that they have now will be done away, and there will be full knowledge. It is precisely this thought that he develops further.</p><ol><li><p>He says that now knowledge is already present <strong>in part</strong>, and other knowledge is revealed <strong>in part</strong> through prophecies.</p></li><li><p>A time will come when perfect knowledge will be given, and not “in part”.</p></li><li><p>Now knowledge is received as if looking through a dim glass, obscurely.</p></li></ol><p>He speaks here of knowledge, and not of the gift of tongues. Christians did not know foreign languages in part. Otherwise they could not have fully conveyed the Gospel to other tribes and nations. They possessed the gift of tongues perfectly; that is exactly what those who had come to Jerusalem for Pentecost marveled at, that they heard the apostles speaking in their own languages (<a href="https://bibleox.com/en/eng-nkjv/act/2/#L5-12">Act. 2:5-12</a>). This was not in part. What was in part was knowledge, and only it. It is precisely about knowledge that the apostle reasons further.</p><p>And when will the gift of tongues cease? Strictly speaking, it is not said here. It is only said that it will cease. And now, living 20 centuries after them, we can look back and see that these words were fulfilled quite soon, when the preaching had spread widely and Christians had become very numerous, so that there is now no such extraordinary need for the gift of tongues. There is an extraordinary need for love, but not for the gift of tongues. That is why since then languages have been learned.</p><p>The words that love is the one thing that will not cease in eternity do not indicate that what will end will end in eternity. Everything else can end at any time, but of eternity it is said only that love will not end there. That love is eternal and will not cease even in the age to come — about this there can be no dispute.</p><p>Did people understand these lines of Scripture the way Pentecostals understand them?</p><p>In the 4th century, for example, John Chrysostom believed that the cessation of the gift of tongues was spoken of in the present age, and not in the age to come.</p><p><strong>John Chrysostom, Saint (~347-407)</strong></p><blockquote><p>Now then after that in every way he had shown her to be very exceedingly great, again he doth so from another most important head, by a fresh comparison exalting her dignity, and saying thus; “but whether there be <strong>prophecies, they shall be done away; whether there be tongues, they shall cease.” <mark>For if both these were brought in in order to the faith; when that is every where sown abroad, the use of these is henceforth superfluous</mark>. But the loving one another shall not cease, rather it shall even advance further, both here and hereafter</strong>, and then more than now. For here there are many things that weaken our love; wealth, business, passions of the body, disorders of the soul; but there none of these. But although it be no marvel that prophecies and tongues should be done away, that knowledge should be done away, this is what may cause some perplexity. For this also he added, “Whether there be knowledge, it shall be done away.” What then? are we then to live in ignorance? Far from it. Nay, then specially it is probable that our knowledge is made intense. Wherefore also he said, “Then shall I know, even as also I am known.” For this reason, if you mark it, that you might not suppose this to be done away equally with the prophecy and the tongues, having said, “Whether there be knowledge, it shall be done away,” he was not silent, but added also the manner of its vanishing away, immediately subjoining the saying, “We know in part, and we prophesy in part. But when that which is perfect is come, then that which is in part shall be done away.” It is not therefore knowledge that is done away, but the circumstance that our knowledge is in part. For we shall not only know as much but even a great deal more.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXIV">Homily 34 on First Corinthians</a>)</p><p>More quotes: <a href="https://bibleox.com/ru/ru/w/ew9Dk6So_%D0%93%D0%BE%D0%B2%D0%BE%D1%80%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BD%D0%B0_%D1%8F%D0%B7%D1%8B%D0%BA%D0%B0%D1%85">quotes of the holy fathers on other tongues</a> (in Russian)</p><h3>The Tongues of Men and of Angels</h3><p>When neo-Protestants are shown quotes that other tongues are the foreign languages of other nations, they agree with this, but in reply show another quote, saying that there is supposedly also a gift of angelic tongues:</p><blockquote><p>“Though I <strong>speak with the tongues of men and <mark>of angels</mark></strong>, but have not love, I have become sounding brass or a clanging cymbal” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L1">1 Cor. 13:1</a>)</p></blockquote><p>But this opinion is mistaken, because angels are bodiless spirits. They have no speech apparatus, tongue, lungs or vocal cords; they do not need an atmosphere (air) in order to communicate by creating and catching vibrations of the air. Thus any human sounds produced by the vocal cords cannot be angelic tongues, because angels have no vocal cords, just as they have no body of flesh and bones (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L39">Luke. 24:39</a>).</p><p>What then does the apostle mean when he speaks of angelic tongues? This is simply a figure of speech, an extreme amplification of one part in order then to lower it by another. The apostle only shows that gifts without love are an empty sound. While the Corinthians thought that speaking the languages of other nations was already something special, the apostle decided to go even higher: even if they could speak in the tongues of angels, without love it would bring no profit.</p><p>This is only the apostle’s figure of speech. One can also read about this in Saint John Chrysostom.</p><p><strong>John Chrysostom, Saint (~347-407)</strong></p><blockquote><p>Now <strong>he here speaks of the “tongues of angels,” not investing angels with a body</strong>, but what he means is this: “should I even so speak as angels are wont to discourse unto each other, without this I am nothing, nay rather a burden and an annoyance.” Thus (to mention one other example) where he saith, “To Him every knee shall bow, of things in heaven and things on earth, and things under the earth,” (Phil. 2:10.) <strong>he doth not say these things as if he attributed to angels knees and bones</strong>, far from it, but it is their intense adoration which he intends to shadow out by the fashion amongst us: so also here he calls it “a tongue” not meaning an instrument of flesh, but intending to indicate their converse with each other by the manner which is known amongst us.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXII">Homily 32 on First Corinthians</a>)</p><p><strong>Blessed Theodoret of Cyrus (~386-457)</strong></p><blockquote><p><strong>By the tongues of angels he means not sensible ones, but certain spiritual ones</strong>, in which the Angels sing praises to the God of all and converse with one another. For Isaiah heard them singing, and Ezekiel, as well as Daniel, Zechariah and Micah heard them conversing. The divine Apostle <strong>expressed</strong> this <strong>hyperbolically, intending to show the superiority of love</strong>.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Feodorit_Kirskij/tolkovanie_na_pervoe_poslanie_k_korinfinam/13#sel=9:83,9:128">Commentary on the First Epistle to the Corinthians, ch. 13</a>, in Russian; translated from the Russian)</p><p>Christ Himself used a similar figure of speech: an extreme amplification of one part in order to lower it by another:</p><blockquote><p>“For what profit is it to a man if he <strong>gains the whole world, and loses his own soul</strong>? Or what will a man give in exchange for his soul?” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L26">Matt. 16:26</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/8/#L36">Mark. 8:36</a>)</p></blockquote><p>So there is no question of people having a gift of speaking an angelic language, because a person communicates by means of his flesh, while angels have no flesh. This mention of angelic tongues is only a figure of speech.</p><h3>The Testimony of a Former Pentecostal Pastor</h3><p>A former pastor of a Pentecostal community, Pavel, who later converted to Orthodoxy, describes in a short audio message (11 minutes) his feelings and experience of “other tongues” in Pentecostalism. He compares his former experience with the experience he gained in Orthodoxy:</p><p>Audio file (in Russian): <a href="https://disk.yandex.ru/d/hHzrMNPi_lVy2w">https://disk.yandex.ru/d/hHzrMNPi_lVy2w</a></p>

