  - src: смертные-грехи-в-вз
    path: Cs1o_Capital_Offenses_in_the_Old_Testament
    title: Capital Offenses in the Old Testament
    meta_desc: Old Testament capital offenses
    menu: { parent: Old Testament/Law, title: Capital Offenses in the Old Testament, priority: 1 }
    body: |-
      <p>Acts that were to be punished by death in the Old Testament:</p><ul><li><p>enticing others to serve false gods: <a href="https://bibleox.com/en/eng-nkjv/vtor/13/#L6-10">Deut. 13:6-10</a></p></li><li><p>sacrificing to a false god: <a href="https://bibleox.com/en/eng-nkjv/ish/22/#L20">Ex. 22:20</a></p></li><li><p>offering children in sacrifice to an idol: <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L2">Lev. 20:2</a></p></li><li><p>blasphemy: <a href="https://bibleox.com/en/eng-nkjv/lev/24/#L16">Lev. 24:16</a></p></li><li><p>sorcery: <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L27">Lev. 20:27</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/22/#L18">Ex. 22:18</a></p></li><li><p>false prophecy and turning people away from God: <a href="https://bibleox.com/en/eng-nkjv/vtor/13/#L5">Deut. 13:5</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/18/#L20">Deut. 18:20</a></p></li><li><p>breaking the Sabbath: <a href="https://bibleox.com/en/eng-nkjv/ish/31/#L14-15">Ex. 31:14-15</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/35/#L2">Ex. 35:2</a></p></li></ul><ul><li><p>murder: <a href="https://bibleox.com/en/eng-nkjv/ish/21/#L12">Ex. 21:12</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/24/#L17">Lev. 24:17</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/24/#L21">Lev. 24:21</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/35/#L16">Num. 35:16</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/35/#L17">Num. 35:17</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/35/#L18">Num. 35:18</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/35/#L21">Num. 35:21</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/35/#L31">Num. 35:31</a></p></li><li><p>cursing one’s father or mother: <a href="https://bibleox.com/en/eng-nkjv/ish/21/#L17">Ex. 21:17</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L9">Lev. 20:9</a></p></li></ul><ul><li><p>striking one’s father or mother: <a href="https://bibleox.com/en/eng-nkjv/ish/21/#L15">Ex. 21:15</a></p></li></ul><ul><li><p>kidnapping a person or selling him into slavery: <a href="https://bibleox.com/en/eng-nkjv/ish/21/#L16">Ex. 21:16</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/24/#L7">Deut. 24:7</a></p></li></ul><ul><li><p>failing to keep watch over a goring animal that has killed someone: <a href="https://bibleox.com/en/eng-nkjv/ish/21/#L29">Ex. 21:29</a></p></li></ul><ul><li><p>rape: <a href="https://bibleox.com/en/eng-nkjv/vtor/22/#L25">Deut. 22:25</a></p></li></ul><ul><li><p>adultery (both who committed the fornication are put to death): <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L10">Lev. 20:10</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L11">Lev. 20:11</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L12">Lev. 20:12</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/22/#L22">Deut. 22:22</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/22/#L25">Deut. 22:25</a></p></li><li><p>carnal relations between relatives: <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L11-21">Lev. 20:11-21</a></p></li></ul><ul><li><p>fornication of a priest’s daughter — the daughter is burned: <a href="https://bibleox.com/en/eng-nkjv/lev/21/#L9">Lev. 21:9</a></p></li></ul><ul><li><p>sodomy: <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L13">Lev. 20:13</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L15">Lev. 20:15</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/20/#L16">Lev. 20:16</a></p></li><li><p>bestiality: <a href="https://bibleox.com/en/eng-nkjv/ish/22/#L19">Ex. 22:19</a></p></li><li><p>disobedience to the priests and judges: <a href="https://bibleox.com/en/eng-nkjv/vtor/17/#L8-12">Deut. 17:8-12</a></p></li><li><p>an ordinary person (not a priest) entering the Tabernacle: <a href="https://bibleox.com/en/eng-nkjv/chis/3/#L10">Num. 3:10</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/3/#L38">Num. 3:38</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/18/#L7">Num. 18:7</a></p></li><li><p>an outsider daring to perform priestly service: <a href="https://bibleox.com/en/eng-nkjv/chis/3/#L10">Num. 3:10</a></p></li></ul><ul><li><p>an ordinary person (not a Levite) carrying the Tabernacle: <a href="https://bibleox.com/en/eng-nkjv/chis/1/#L51">Num. 1:51</a></p></li></ul><ul><li><p>going up the mountain (crossing the boundary): <a href="https://bibleox.com/en/eng-nkjv/ish/19/#L12">Ex. 19:12</a></p></li></ul><p>In addition:</p><ul><li><p>The command to kill the Midianite children and women who seduced the Israelites into the service of the idol of Peor: <a href="https://bibleox.com/en/eng-nkjv/chis/31/#L15-17">Num. 31:15-17</a></p></li></ul><ul><li><p>The command to kill the people of Amalek: men, women, children, nursing infants: <a href="https://bibleox.com/en/eng-nkjv/1ts/15/#L3">1 Sam. 15:3</a></p></li></ul>

  - src: прикосновение-к-мертвецу
    path: Td4d_Touching_the_Dead
    title: Touching the Dead
    meta_desc: Bible quotes on the prohibition in the Law of Moses against touching the dead
    menu: { parent: Old Testament/Law, title: Touching the Dead, priority: 4 }
    body: |-
      <h2>The Prohibition Against Touching the Dead in the Old Testament</h2><p>Touching a dead body made a person unclean (defiled). But relatives could touch their own deceased kin without being defiled:</p><blockquote><p>“And the LORD said to Moses, ‘Speak to the priests, the sons of Aaron, and say to them: “<strong>None shall defile himself for the dead</strong> among his people, <strong>except for his relatives who are nearest to him</strong>: his mother, his father, his son, his daughter, and his brother; also his virgin sister who is near to him, who has had no husband, <strong>for her he may defile himself</strong>. <strong>Otherwise he shall not defile himself</strong>, being a chief man among his people, to profane himself”’” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1-4">Lev. 21:1-4</a>)</p></blockquote><blockquote><p>“Now there were certain men who were <strong>defiled by a human corpse</strong>, so that they could not keep the Passover on that day” (<a href="https://bibleox.com/en/eng-nkjv/chis/9/#L6">Num. 9:6</a>)</p></blockquote><blockquote><p>“Whoever <strong>touches the body</strong> of anyone who has died, and does not purify himself, defiles the tabernacle of the LORD. That person shall be cut off from Israel. <strong>He shall be unclean</strong>, because the water of purification was not sprinkled on him; his uncleanness is still on him” (<a href="https://bibleox.com/en/eng-nkjv/chis/19/#L13">Num. 19:13</a>)</p></blockquote><blockquote><p>“<strong>They shall not defile themselves by coming near a dead person</strong>. Only for father or mother, for son or daughter, for brother or unmarried sister may they defile themselves” (<a href="https://bibleox.com/en/eng-nkjv/iez/44/#L25">Ezek. 44:25</a>)</p></blockquote><blockquote><p>“And Haggai said, ‘If one who is <strong>unclean because of a dead body</strong> touches any of these, will it be unclean?’ So the priests answered and said, ‘<strong>It shall be unclean</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/ag/2/#L13">Hag. 2:13</a>)</p></blockquote><h2>Touching the Remains of the Righteous</h2><p>In Old Testament times a dead man came to life from touching the relics of the prophet Elisha:</p><blockquote><p>“So it was, as they were burying a man, that suddenly they spied a band of raiders; and they put the man in the tomb of Elisha; and <strong>when the man was let down and touched the bones of Elisha, he revived</strong> and stood on his feet” (<a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21">2 Kin. 13:21</a>)</p></blockquote><h2>The Abolition of Jewish Ordinances</h2><blockquote><p>“For it seemed good to the Holy Spirit, and to us, <strong>to lay upon you no greater burden than these necessary things</strong>: that you abstain from things offered to idols, from blood, from things strangled, and from sexual immorality. If you keep yourselves from these, you will do well. Farewell” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L28-29">Act. 15:28-29</a>)</p></blockquote><blockquote><p>“But <strong>concerning the Gentiles who believe, we have written and decided that they should observe no such thing, except that they should keep themselves from things offered to idols, from blood, from things strangled, and from sexual immorality</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/21/#L25">Act. 21:25</a>)</p></blockquote><p>More: <a href="https://bibleox.com/en/en/w/Ab21l_Abolition_of_the_Law_of_Moses/">the abolition of Jewish ordinances</a></p><h2>Touching the Dead in the New Testament</h2><p>The Lord Jesus Christ touched the dead daughter of Jairus:</p><blockquote><p>“Then He <strong>took the child by the hand, and said to her</strong>, ‘Talitha, cumi,’ which is translated, ‘Little girl, I say to you, arise’” (<a href="https://bibleox.com/en/eng-nkjv/mk/5/#L41">Mark. 5:41</a>).</p></blockquote><p>According to the Law, when Christ died on the Cross, He could not be touched, as one already dead. Only the Mother of God could do this, as a relative (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1-4">Lev. 21:1-4</a>). Yet we not only do not condemn John the Theologian, Nicodemus and Joseph of Arimathea, but praise them for not being afraid of anything and for serving our Savior:</p><blockquote><p>“When <strong>Joseph</strong> had taken the body, he wrapped it in a clean linen cloth, and laid it in his new tomb which he had hewn out of the rock; and he rolled a large stone against the door of the tomb, and departed” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L59-60">Matt. 27:59-60</a>)</p></blockquote><blockquote><p>“When <strong>his disciples</strong> heard of it, they came and took away his corpse and laid it in a tomb” (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L29">Mark. 6:29</a>)</p></blockquote><blockquote><p>“So when he found out from the centurion, he granted the body to <strong>Joseph</strong>. Then he bought fine linen, took Him down, and wrapped Him in the linen. And he laid Him in a tomb which had been hewn out of the rock, and rolled a stone against the door of the tomb” (<a href="https://bibleox.com/en/eng-nkjv/mk/15/#L45-46">Mark. 15:45-46</a>)</p></blockquote><blockquote><p>“Now when they had fulfilled all that was written concerning Him, <strong>they took Him down from the tree and laid Him in a tomb</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L29">Act. 13:29</a>)</p></blockquote><p>The apostle touches a dead young man:</p><blockquote><p>“And in a window sat a certain young man named Eutychus, who was sinking into a deep sleep. He was overcome by sleep; and as Paul continued speaking, he fell down from the third story and was taken up <strong>dead</strong>. But Paul went down, <strong>fell on him, and embracing him</strong> said, ‘Do not trouble yourselves, for his life is in him’” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L9-10">Act. 20:9-10</a>)</p></blockquote>

  - src: закваска
    path: Lv15n_Leaven
    title: Leaven
    menu: { parent: Old Testament/Law, title: Leaven, priority: 15 }
    body: |-
      <h2>Leaven — a Small Thing That Affects Everything</h2><p>The image of leaven in the Scripture of the New Testament is used <u>not</u> as something bad or good in itself, but to show how a small part can affect all the rest. Little leaven is put into the flour, but in the end it leavens the whole lump.</p><p>Besides leaven, the Lord also often turns to the image of salt, which likewise affects everything else (preserves it from corruption):</p><blockquote><p>“<strong>You are the salt</strong> of the earth; but if the salt loses its flavor, how shall it be seasoned? It is then good for nothing but to be thrown out and trampled underfoot by men” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L13">Matt. 5:13</a>)</p></blockquote><blockquote><p>“Salt is good, but if the salt loses its flavor, how will you season it? <strong>Have salt in yourselves</strong>, and have peace with one another” (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L50">Mark. 9:50</a>)</p></blockquote><p>At the same time salt, like leaven, took part in the Old Testament sacrifices:</p><blockquote><p>“And <strong>every offering of your grain offering you shall season with salt</strong>; you shall not allow the salt of the covenant of your God to be lacking from your grain offering. With all your offerings <strong>you shall offer salt</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/2/#L13">Lev. 2:13</a>)</p></blockquote><h2>Positive Meanings of Leaven</h2><h3>Leaven — the Kingdom of Heaven</h3><p>The Lord Jesus Christ compares leaven with the Kingdom of Heaven. Again, something small is to affect everything:</p><blockquote><p>“Another parable He spoke to them: ‘<strong><mark>The kingdom of heaven is like leaven</mark></strong>, which a woman took and hid in three measures of meal till it was all leavened’” (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L33">Matt. 13:33</a>)</p></blockquote><blockquote><p>“And again He said, ‘<strong><mark>To what shall I liken the kingdom of God? It is like leaven</mark></strong>, which a woman took and hid in three measures of meal till it was all leavened’” (<a href="https://bibleox.com/en/eng-nkjv/lk/13/#L20-21">Luke. 13:20-21</a>)</p></blockquote><h2>Negative Meanings of Leaven</h2><h3>Leaven — Heretical Teaching</h3><p>The Lord Jesus Christ points out to the apostles the perniciousness of the teaching of the Pharisees and Sadducees. He uses the image of leaven to show how something small can affect everything:</p><blockquote><p>“Then Jesus said to them, ‘Take heed and <strong>beware of the <mark>leaven</mark> of the Pharisees and the Sadducees</strong>.’ &lt;...&gt; ‘How is it you do not understand that I did not speak to you concerning bread? — but to beware of the leaven of the Pharisees and Sadducees.’ Then they understood that He did not tell them to beware of the leaven of bread, but of the <strong><mark>doctrine</mark> of the Pharisees and Sadducees</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L6,11-12">Matt. 16:6,11-12</a>)</p></blockquote><h3>Leaven — Hypocrisy</h3><p>On another occasion, before thousands of people, Christ again uses the image of leaven to point out the perniciousness of the distinguishing trait of the Pharisees — hypocrisy. Again, hypocrisy turns out to be something small that affects everything:</p><blockquote><p>“In the meantime, when an innumerable multitude of people had gathered together, so that they trampled one another, He began to say to His disciples first of all, ‘<strong>Beware of the <mark>leaven</mark> of the Pharisees</strong>, which is <strong><mark>hypocrisy</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/12/#L1">Luke. 12:1</a>)</p></blockquote><h3>Leaven — an Unrepentant Fornicator in the Community</h3><p>The apostle Paul uses the image of leaven to reproach the Corinthian community for having an unrepentant fornicator among them. The fornicator is a small part of the community, but can influence the whole community:</p><blockquote><p>“It is actually reported that there is sexual immorality among you, and such sexual immorality as is not even named among the Gentiles — that a man has his father’s wife! &lt;...&gt; Your glorying is not good. Do you not know that <strong><mark>a little leaven leavens the whole lump</mark></strong>? Therefore <strong>purge out the old leaven, that you may be a new lump</strong>, since you truly are unleavened. For indeed Christ, our Passover, was sacrificed for us. Therefore let us keep the feast, not with old leaven, nor with <strong><mark>the leaven of malice and wickedness</mark></strong>, but with the unleavened bread of sincerity and truth” (<a href="https://bibleox.com/en/eng-nkjv/1kor/5/#L1,6-8">1 Cor. 5:1,6-8</a>)</p></blockquote><p>The apostle proposes getting rid not of leaven in general, but of the leaven of malice and wickedness: that is, expelling the unrepentant fornicator from the community (<a href="https://bibleox.com/en/eng-nkjv/1kor/5/#L9,11">1 Cor. 5:9,11</a>). Here the apostle reveals the Old Testament meanings, and is not speaking about bread:</p><blockquote><p>“Therefore purge out the old leaven, that <strong><mark>you</mark> may be a new lump</strong>, since you truly are unleavened. For indeed Christ, our Passover, was sacrificed for us. Therefore let us keep the feast, not with old leaven, nor with the leaven of malice and wickedness, but with the unleavened bread of sincerity and truth” (<a href="https://bibleox.com/en/eng-nkjv/1kor/5/#L7-8">1 Cor. 5:7-8</a>)</p></blockquote><blockquote><p>“How is it you do not understand that I did not speak to you concerning bread?” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L11">Matt. 16:11</a>)</p></blockquote><h3>Leaven — a Person Drawing the Community into Judaism</h3><p>The apostle Paul uses the image of leaven, warning the Galatian community of the danger of having among them certain people who teach that one must keep the Law of Moses in order to be saved:</p><blockquote><p>“You have become estranged from Christ, you who attempt to be justified by law; you have fallen from grace. For we through the Spirit eagerly wait for the hope of righteousness by faith. &lt;...&gt; <strong><mark>A little leaven leavens the whole lump</mark></strong>. I have confidence in you, in the Lord, that you will have no other mind; but <strong><mark>he who troubles you</mark></strong> shall bear his judgment, whoever he is. &lt;...&gt; <strong>I could wish that those who trouble you would even cut themselves off!</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L4-5,9-10,12">Gal. 5:4-5,9-10,12</a>)</p></blockquote>

  - src: Библия-Закон-Моисея-отмена
    path: Ab21l_Abolition_of_the_Law_of_Moses
    title: Abolition of the Law of Moses
    meta_desc: Bible quotes on the abolition of the Law of Moses
    menu: { parent: Old Testament/Law, title: Abolition of the Law of Moses, priority: 21 }
    body: |-
      <h2>A Detailed Explanation of the Abolition of the Law of Moses</h2><p>See the introduction to the quotes of the holy fathers: <a href="https://bibleox.com/ru/ru/w/%D0%9E%D1%82%D0%BC%D0%B5%D0%BD%D0%B0_%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%D0%B0_%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F/">on the abolition of the Law of Moses</a> (in Russian).</p><h2>The Law of Moses Is Abolished</h2><blockquote><p><em>“But now </em><strong><em>we <mark>have been delivered from the law</mark></em></strong><em>, </em><strong><em><mark>having died</mark> to what we were held by</em></strong><em>, so that we should serve in the newness of the Spirit and </em><strong><em>not in the oldness of the letter</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/7/#L6">Rom. 7:6</a><em>)</em></p></blockquote><h3>No Longer Under a Tutor (the Law)</h3><blockquote><p>“But the Scripture has confined all under sin, that the promise by faith in Jesus Christ might be given to those who believe. But <strong><mark>before faith came</mark>, we <mark>were</mark> kept under guard by the law</strong>, kept for the faith which would afterward be revealed. Therefore <strong>the law <mark>was our tutor to bring us to Christ</mark></strong>, that we might be justified by faith. But after faith has come, <strong><mark>we are no longer under a tutor</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L21-25">Gal. 3:21-25</a>)</p></blockquote><blockquote><p>“Now I say that <strong>the heir</strong>, <strong><mark>as long as</mark> he is a child,</strong> does not differ at all from a slave, though he is master of all, but is <strong>under</strong> guardians and stewards <strong>until the time appointed by the father</strong>. &lt;…&gt; But now after you have known God, or rather are known by God, how is it that you turn again to the weak and beggarly elements, <strong>to which you desire again to be in bondage? You observe days (HE SPEAKS OF THE SABBATHS, according to St. Theophan), and months and seasons and years.</strong> I am afraid for you, lest I have labored for you in vain. Tell me, <strong><mark>you who desire to be under the law</mark></strong>, do you not hear the law? &lt;…&gt; (he tells the story of Abraham’s sons by the bondwoman and by the wife — note) But, as <strong>he who was born according to the flesh (a comparison with the Law! — note) then persecuted him who was born according to the Spirit, even so it is now</strong>. Nevertheless what does the Scripture say? ‘Cast out the bondwoman and her son, for <strong>the son of the bondwoman shall not be heir with the son of the freewoman</strong>.’ So then, brethren, <strong><mark>we are not children of the bondwoman but of the free</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/4/#L1-2,9-11,21,29-31">Gal. 4:1-2,9-11,21,29-31</a>)</p></blockquote><h2>The Conciliar Decree on the Abolition of the Law</h2><p>The first Apostolic Council decreed that Christians have no need to keep the ordinances of the Jewish law:</p><blockquote><p>“But <strong>some <mark>of the sect of the Pharisees who believed</mark></strong><mark> </mark><strong><mark>rose up, saying, ‘It is necessary</mark></strong> to circumcise them, and to command them <strong><mark>to keep the law of Moses</mark></strong>.’ Now the apostles and elders came together to consider this matter” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L5-6">Act. 15:5-6</a>)</p><p>In the Greek: τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων — “some of the <strong>heresy</strong> (sect) of the Pharisees”.</p></blockquote><blockquote><p>“Since we have heard that <strong>some who went out from us have <mark>troubled</mark> you</strong> with words, unsettling your souls, <strong><mark>saying, ‘You must</mark></strong> be circumcised and <strong><mark>keep the law</mark>’ — <mark>to whom we gave no such commandment</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L24">Act. 15:24</a>)</p></blockquote><blockquote><p>“For <strong><mark>it seemed good to the Holy Spirit, and to us, to lay upon you no greater burden than these necessary things</mark>: that you abstain from things offered to idols, from blood, from things strangled, and from sexual immorality</strong>. If you keep yourselves from these, you will do well. Farewell” (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L28-29">Act. 15:28-29</a>)</p></blockquote><blockquote><p>“But <strong>concerning the Gentiles who believe, we have written and decided that they should observe no such thing, except that they should keep themselves from things offered to idols, from blood, from things strangled, and from sexual immorality</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/21/#L25">Act. 21:25</a>)</p></blockquote><blockquote><p>“And as they went through the cities, <strong>they delivered to them the decrees to keep, which were determined by the apostles and elders at Jerusalem</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/16/#L4">Act. 16:4</a>)</p></blockquote><h2>The Apostles and the First Christians Did Not Live by the Law of Moses</h2><h3>To Those Without Law He Became as Without Law (That Is, He Did Not Keep It)</h3><blockquote><p>“and to the Jews I became as a Jew, that I might win Jews; to those who are under the law, as under the law, that I might win those who are under the law; <strong><mark>to those who are without law, as without law</mark></strong> (not being without law toward God, but <strong><mark>under law toward Christ</mark></strong>), that I might win those who are without law” (<a href="https://bibleox.com/en/eng-nkjv/1kor/9/#L20-21">1 Cor. 9:20-21</a>)</p></blockquote><h3>The Deacon Stephen Was Accused of Teaching a Change of the Law</h3><blockquote><p>“They also set up false witnesses who said, ‘This man does not cease to <strong>speak blasphemous words</strong> against this holy place and <strong><mark>the law</mark></strong>; for we have heard him say that this Jesus of Nazareth will destroy this place and <strong><mark>change the customs which Moses delivered to us</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/6/#L13-14">Act. 6:13-14</a>)</p></blockquote><h3>The Apostle Paul Is Accused of Teaching to Worship God Not According to the Law</h3><blockquote><p>“saying, ‘This fellow <strong><mark>persuades men to worship God contrary to the law</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/18/#L13">Act. 18:13</a>)</p></blockquote><blockquote><p>“You see, brother, how many myriads of Jews there are who have believed, and they are all zealous for the law; but they have been informed about you that <strong><mark>you teach all the Jews who are among the Gentiles to forsake Moses</mark></strong>, saying that <strong><mark>they ought not to circumcise their children</mark></strong> nor <strong><mark>to walk according to the customs</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/21/#L20-21">Act. 21:20-21</a>)</p></blockquote><p>If the apostle Paul preaches Judaism, then why do the Jews persecute him? They persecute him because he has left the Law:</p><blockquote><p>“<strong>Stand fast therefore in the liberty by which Christ has made us free</strong>, and <strong><mark>do not be entangled again with a yoke of bondage.</mark></strong> &lt;…&gt; And I, brethren, <strong>if I still preach circumcision, <mark>why do I still suffer persecution</mark>? </strong>(he is persecuted precisely because he does not preach circumcision; if he preached circumcision, the offense of the cross would cease — note) Then the offense of the cross has ceased”<strong> </strong>(<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L1,11">Gal. 5:1,11</a>)</p></blockquote><p>Some Christians pretend to be under the law before the Jews so as not to be persecuted:</p><blockquote><p>“<strong>As many as desire to make a good showing in the flesh</strong>, these would compel you to be circumcised, <strong>only that they may not suffer persecution</strong> for the cross of Christ” (<a href="https://bibleox.com/en/eng-nkjv/gal/6/#L12">Gal. 6:12</a>)</p></blockquote><h3>Christians Are Not Circumcised</h3><blockquote><p>“Was anyone called <strong>while circumcised? Let him not become uncircumcised</strong>. Was anyone called <strong>while uncircumcised? Let him not be circumcised</strong>. <strong>Circumcision is nothing and uncircumcision is nothing</strong>, but keeping the commandments of God is what matters” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L18-19">1 Cor. 7:18-19</a>)</p></blockquote><blockquote><p>“For in Christ Jesus <strong>neither circumcision nor uncircumcision avails anything</strong>, but faith working through love” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L6">Gal. 5:6</a>)</p></blockquote><blockquote><p>“For in Christ Jesus <strong>neither circumcision nor uncircumcision avails anything</strong>, but a new creation” (<a href="https://bibleox.com/en/eng-nkjv/gal/6/#L15">Gal. 6:15</a>)</p></blockquote><blockquote><p>“where there is neither Greek nor Jew, <strong>circumcised nor uncircumcised</strong>, barbarian, Scythian, slave nor free, but Christ is all and in all” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L11">Col. 3:11</a>)</p></blockquote><h3>They Do Not Sacrifice Animals</h3><blockquote><p>“Previously saying, ‘<strong>Sacrifice and offering, burnt offerings, and offerings for sin You did not desire, nor had pleasure in them</strong>’ (which are offered according to the law), then He said, ‘Behold, I have come to do Your will, O God.’ <strong>He takes away the first that He may establish the second</strong>. &lt;…&gt; ‘This is the covenant that I will make with them after those days, says the LORD: I will put My laws into their hearts, and in their minds I will write them,’ then He adds, ‘Their sins and their lawless deeds I will remember no more.’ Now <strong>where there is remission of these, there is no longer an offering for sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L8-9,16-18">Heb. 10:8-9,16-18</a>)</p></blockquote><h3>They Do Not Keep the Sabbath Rest</h3><blockquote><p>“So <strong>let no one judge you</strong> in food or in drink, or regarding a festival or a new moon or <strong>sabbaths</strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L16">Col. 2:16</a>)</p></blockquote><blockquote><p>“At that time Jesus went through the grainfields <strong>on the Sabbath</strong>. And His disciples were hungry, and <strong>began to pluck heads of grain and to eat</strong>. And when the Pharisees saw it, they said to Him, ‘Look, Your disciples are doing what is not lawful to do on the Sabbath!’ &lt;…&gt; But if you had known what this means, ‘I desire mercy and not sacrifice,’ you <strong>would not have condemned the guiltless</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L1-2,7">Matt. 12:1-2,7</a>)</p></blockquote><h3>They Keep Company with Foreigners, and Are Foreigners Themselves</h3><blockquote><p>“And as he talked with him, he went in and found many who had come together. Then he said to them, ‘<strong>You know how unlawful it is for a Jewish man to keep company with or go to one of another nation</strong>. <strong>But God has shown me that I should not call any man common or unclean</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L27-28">Act. 10:27-28</a>)</p></blockquote><h3>They Touch the Dead</h3><p>The Lord Jesus Christ touched the dead daughter of Jairus:</p><blockquote><p>“Then He <strong>took the child by the hand, and said to her</strong>, ‘Talitha, cumi,’ which is translated, ‘Little girl, I say to you, arise’” (<a href="https://bibleox.com/en/eng-nkjv/mk/5/#L41">Mark. 5:41</a>)</p></blockquote><p>According to the Law, when Christ died on the Cross, He could not be touched, as one already dead. Only the Mother of God could do this, as a relative (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L1-4">Lev. 21:1-4</a>). Yet we not only do not condemn John the Theologian, Nicodemus and Joseph of Arimathea, but praise them for not being afraid of anything and for serving our Savior.</p><blockquote><p>“When <strong>Joseph</strong> had taken the body, he wrapped it in a clean linen cloth, and laid it in his new tomb which he had hewn out of the rock; and he rolled a large stone against the door of the tomb, and departed” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L59-60">Matt. 27:59-60</a>)</p></blockquote><blockquote><p>“When <strong>his disciples</strong> heard of it, they came and took away his corpse and laid it in a tomb” (<a href="https://bibleox.com/en/eng-nkjv/mk/6/#L29">Mark. 6:29</a>)</p></blockquote><blockquote><p>“So when he found out from the centurion, he granted the body to <strong>Joseph</strong>. Then he bought fine linen, took Him down, and wrapped Him in the linen. And he laid Him in a tomb which had been hewn out of the rock, and rolled a stone against the door of the tomb” (<a href="https://bibleox.com/en/eng-nkjv/mk/15/#L45-46">Mark. 15:45-46</a>)</p></blockquote><blockquote><p>“Now when they had fulfilled all that was written concerning Him, they took Him down from the tree and laid Him in a tomb” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L29">Act. 13:29</a>)</p></blockquote><h3>The Lord Releases the Woman Accused of Adultery</h3><p>The Law commands stoning for adultery (Lev. 20:10), but the Lord did not condemn the woman for adultery, and let her go:</p><blockquote><p>“She said, ‘No one, Lord.’ And Jesus said to her, ‘<strong><mark>Neither do I condemn you; go and sin no more</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/8/#L11">John. 8:11</a>)</p></blockquote><h3>The Lord Commands Us to Drink His Blood</h3><p>God forbids drinking blood (Gen. 9:4; Lev. 3:17; Lev. 7:26; Lev. 17:14; Deut. 12:16), yet at the Last Supper He gives the disciples the cup with the words: drink, this is My blood:</p><blockquote><p>“And as they were eating, Jesus took bread, blessed and broke it, and gave it to the disciples and said, ‘Take, eat; this is My body.’ Then He took the cup, and gave thanks, and gave it to them, saying, ‘<strong><mark>Drink from it, all of you. For this is My blood</mark></strong> of the new covenant, which is shed for many for the remission of sins’” (<a href="https://bibleox.com/en/eng-nkjv/mf/26/#L26-28">Matt. 26:26-28</a>)</p></blockquote><h3>The Lord Became High Priest from the Tribe of Judah</h3><p>The Law commands that priests be only from the tribe of Levi, of the house of Aaron:</p><blockquote><p><em>“And you shall gird them with sashes, </em><strong><em>Aaron and his sons</em></strong><em>, and put the hats on them. </em><strong><em>The priesthood shall be theirs</em></strong><em> for a perpetual statute. So you shall consecrate Aaron and his sons” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/29/#L9"><em>Ex. 29:9</em></a><em>)</em></p></blockquote><blockquote><p><em>“And </em><strong><em>the holy garments</em></strong><em> of Aaron </em><strong><em>shall be his sons’ after him</em></strong><em>, </em><strong><em>to be anointed in them and to be consecrated in them</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29"><em>Ex. 29:29</em></a><em>)</em></p></blockquote><p>But the Lord became High Priest, having been born in the tribe of Judah:</p><blockquote><p>“For it is evident that <strong><mark>our Lord arose from Judah</mark></strong>, of which tribe <strong>Moses spoke nothing concerning priesthood</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L14">Heb. 7:14</a>)</p></blockquote><h3>The True Paschal Sacrifice Is Offered Not in the Temple</h3><p>The Paschal sacrifice could be offered only in the Jerusalem Temple:</p><blockquote><p>“<strong>You may not sacrifice the Passover within any of your gates which the LORD your God gives you</strong>; but at the place where the LORD your God chooses to make His name abide, there you shall sacrifice the Passover at twilight, at the going down of the sun, at the time you came out of Egypt” (<a href="https://bibleox.com/en/eng-nkjv/vtor/16/#L5-6">Deut. 16:5-6</a>)</p></blockquote><blockquote><p>“Therefore Jesus also, that He might sanctify the people with His own blood, <strong><mark>suffered outside the gate</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L12">Heb. 13:12</a>)</p></blockquote><h2>Are the 10 Commandments Also the Law of Moses?</h2><h3>The Law of God Through Moses — All the Commands in the Book of Leviticus</h3><p>The Book of Leviticus, which lists many commands of God, including the <a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9">commandments of the stone tablets</a>, calls them <strong>laws of the Lord established through Moses</strong>:</p><blockquote><p>“<strong><mark>These are the statutes and judgments and laws which the LORD made</mark></strong> between Himself and the children of Israel on Mount Sinai <strong><mark>by the hand of Moses</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/26/#L46">Lev. 26:46</a>)</p></blockquote><h3>God Calls All His Commands the Law</h3><p>For example, the command to gather the manna is a Law of God:</p><blockquote><p>“Then the LORD said to Moses, ‘Behold, I will rain bread from heaven for you. And <strong><mark>the people shall go out and gather a certain quota every day</mark></strong>, that I may test them, whether they will walk in <strong><mark>My law</mark></strong> or not.’</p><p>…</p><p>And the LORD said to Moses, ‘How long do you refuse to keep <strong><mark>My commandments and My laws</mark></strong>?’” (<a href="https://bibleox.com/en/eng-nkjv/ish/16/#L4,28">Ex. 16:4,28</a>)</p></blockquote><p>Exodus chs. 16, 24, 31, 34, 35; Deut. chs. 4, 6, 10.</p><h3>The New Law Is Written No Longer on Stone Tablets, but on the Heart</h3><p>What was written on the stone tablets is called “the law”:</p><blockquote><p>“But this is the covenant that I will make with the house of Israel after those days, says the LORD: <strong>I will put My <mark>law</mark> in their minds, and <mark>write it on their hearts</mark></strong>; and I will be their God, and they shall be My people” (<a href="https://bibleox.com/en/eng-nkjv/ier/31/#L33">Jer. 31:33</a>)</p></blockquote><blockquote><p>“clearly <strong>you are an epistle of Christ</strong>, ministered by us, <strong>written</strong> not with ink but by the Spirit of the living God, <strong><mark>not on </mark><u><mark>tablets of stone</mark></u><mark> but on tablets of flesh, that is, of the heart</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/3/#L3">2 Cor. 3:3</a>)</p></blockquote><h3>Christ Speaks of the Commandments Without Singling Out the 10 Commandments</h3><blockquote><p>“You have heard that it was said to those of old, ‘<strong>You shall not murder</strong>, and whoever murders will be in danger of the judgment.’</p><p>You have heard that it was said to those of old, ‘<strong>You shall not commit adultery</strong>.’</p><p>Again you have heard that it was said to those of old, ‘<strong><mark>You shall not swear falsely</mark></strong>, but shall perform your oaths to the Lord.’</p><p>You have heard that it was said, ‘<strong><mark>An eye for an eye and a tooth for a tooth</mark></strong>’ (Ex. 21:24).</p><p>You have heard that it was said, ‘<strong><mark>You shall love your neighbor</mark></strong>’ (Lev. 19:18)<strong> and hate your enemy</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L21,27,33,38,43">Matt. 5:21,27,33,38,43</a>)</p></blockquote><h3>The Apostles Call the Decalogue Simply the Law</h3><p>The apostle James says that one who breaks the commandment “do not murder” is a transgressor of the law:</p><blockquote><p>“For whoever shall keep the whole law, and yet stumble in one point, he is guilty of all. For He who said, ‘Do not commit adultery,’ also said, ‘Do not murder.’ Now <strong>if you do not commit adultery, but you do <mark>murder</mark>, you have become <mark>a transgressor of the law</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L10-11">James. 2:10-11</a>)</p></blockquote><h2>The Law Does Not Save</h2><h3>The Law Is a Shadow of What Is to Come, a Reminder of Sin</h3><blockquote><p>“For <strong>the law, having a <mark>shadow</mark> of the good things to come, and not the very image of the things</strong>, can never with these same sacrifices, which they offer continually year by year, make those who approach perfect. For then would they not have ceased to be offered? For the worshipers, once purified, would have had no more consciousness of sins. But in those sacrifices <strong><mark>there is a reminder of sins</mark></strong> every year” (<a href="https://bibleox.com/en/eng-nkjv/evr/10/#L1-3">Heb. 10:1-3</a>)</p></blockquote><h3>The Law Cannot Save: Neither Knowledge of the Law, nor Works</h3><blockquote><p>“Is the law then against the promises of God? Certainly not! For <strong>if there had been a law given which could have given life, truly righteousness would have been by the law</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L21">Gal. 3:21</a>)</p></blockquote><h3>Fulfilling the Letter of the Law Does Not Save</h3><blockquote><p>“For I say to you, that unless your righteousness exceeds the righteousness of the scribes and Pharisees, you will by no means enter the kingdom of heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L20">Matt. 5:20</a>)</p></blockquote><blockquote><p>“<strong>Though</strong> I speak with the tongues of men and of angels, but <strong>have not love, I have become sounding brass or a clanging cymbal</strong>. And though I have the gift of prophecy, and understand all mysteries and all knowledge, and though I have all faith, so that I could remove mountains, but have not love, I am nothing. And <strong>though I bestow all my goods to feed the poor, and though I give my body to be burned, but have not love, it profits me nothing</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L1-3">1 Cor. 13:1-3</a>)</p></blockquote><h3>Breaking the Law Leads to Condemnation</h3><blockquote><p>“For as many as have sinned without law will also perish without law, and as many as have sinned in the law will be judged by the law (for not the hearers of the law are just in the sight of God, but the doers of the law will be justified” (<a href="https://bibleox.com/en/eng-nkjv/rim/2/#L12-13">Rom. 2:12-13</a>)</p></blockquote><h3>Whoever Does Not Fulfill the Whole Law Is Cursed</h3><blockquote><p>“For as many as are of the works of the law are under the curse; for it is written, ‘<strong><mark>Cursed is everyone who does not continue in all things which are written in the book of the law, to do them</mark></strong>.’ But that no one is justified by the law in the sight of God is evident, for ‘the just shall live by faith.’ Yet the law is not of faith, but ‘the man who does them shall live by them’” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L10-12">Gal. 3:10-12</a>)</p></blockquote><h3>The Law Brought No One to Perfection</h3><blockquote><p>“For on the one hand there is <strong>an annulling</strong> of the former commandment <strong>because of its weakness and unprofitableness, for <mark>the law made nothing perfect</mark></strong>; on the other hand, there is the bringing in of a better hope, through which we draw near to God” (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L18-19">Heb. 7:18-19</a>)</p></blockquote><h2>Why Then Is the Law of Moses Needed?</h2><h3>The Law Gives Knowledge of Sin</h3><blockquote><p>“Therefore by the deeds of the law no flesh will be justified in His sight, for <strong>by the law is <mark>the knowledge of sin</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L20">Rom. 3:20</a>)</p></blockquote><blockquote><p>“Moreover <strong>the law entered that <mark>the offense might abound</mark></strong>. But where sin abounded, grace abounded much more” (<a href="https://bibleox.com/en/eng-nkjv/rim/5/#L20">Rom. 5:20</a>)</p></blockquote><h3>The Law Restrains the Sinner (Is Needed by the Sinner)</h3><blockquote><p>“knowing this: that <strong>the law is not made</strong> for a righteous person, but <strong><mark>for the lawless</mark></strong> and insubordinate, for the ungodly and for sinners, for the unholy and profane, for murderers of fathers and murderers of mothers, for manslayers” (<a href="https://bibleox.com/en/eng-nkjv/1tim/1/#L9">1 Tim. 1:9</a>)</p></blockquote><h3>The Law Lets One See the Need for a Savior (the Expectation of the Savior)</h3><blockquote><p>“For I delight in the law of God according to the inward man. But I see another law in my members, warring against the law of my mind, and bringing me into captivity to the law of sin which is in my members. <strong>O wretched man that I am! <mark>Who</mark> will deliver me from this body of death?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/7/#L22-24">Rom. 7:22-24</a>)</p></blockquote><h2>The Law Is Not Eternal</h2><h3>The Law Lasts Until It Is Fulfilled</h3><blockquote><p>“For assuredly, I say to you, till heaven and earth pass away, one jot or one tittle will by no means pass from the law <strong><mark>till all is fulfilled</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L18">Matt. 5:18</a>)</p></blockquote><h3>Christ Fulfilled the Law and Thereby Abolished It</h3><blockquote><p>“Do not think that I came to destroy the Law or the Prophets. <strong><mark>I did not come</mark></strong> to destroy but <strong><mark>to fulfill</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L17">Matt. 5:17</a>)</p></blockquote><h2>Christ Ends the Era of the Law</h2><h3>The Prophecy of the Coming of a Prophet Like Moses</h3><p>As soon as the Law of Moses is established, it is said that in the future a prophet like Moses will come, that is, a <strong>lawgiver</strong>, to whom one must listen. This was said of Christ:</p><blockquote><p>“The LORD your God will raise up for you <strong><mark>a Prophet like me</mark></strong> from your midst, from your brethren. <strong><mark>Him you shall hear</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/vtor/18/#L15">Deut. 18:15</a>)</p></blockquote><blockquote><p>“For Moses truly said to the fathers, ‘The LORD your God will raise up for you <strong><mark>a Prophet like me from your brethren. Him you shall hear in all things, whatever He says to you</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/3/#L22">Act. 3:22</a>)</p></blockquote><blockquote><p>“This is that Moses who said to the children of Israel, ‘<strong><mark>The LORD your God will raise up for you a Prophet like me from your brethren. Him you shall hear</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/7/#L37">Act. 7:37</a>)</p></blockquote><p>And God Himself confirms this with the same words:</p><blockquote><p>“And a cloud came and overshadowed them; and a voice came out of the cloud, saying, ‘This is My beloved Son. <strong><mark>Hear Him!</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L7">Mark. 9:7</a>) (<a href="https://bibleox.com/en/eng-nkjv/mf/17/#L5">Matt. 17:5</a>) (<a href="https://bibleox.com/en/eng-nkjv/lk/9/#L35">Luke. 9:35</a>)</p></blockquote><h3>Christ Calls the Law “Your” Law</h3><blockquote><p>“It is also written in <strong><mark>your</mark></strong> <strong>law</strong> that the testimony of two men is true” (<a href="https://bibleox.com/en/eng-nkjv/in/8/#L17">John. 8:17</a>)</p></blockquote><blockquote><p>“Jesus answered them, ‘Is it not written in <strong><mark>your</mark> law</strong>, “I said, ‘You are gods’”?’” (<a href="https://bibleox.com/en/eng-nkjv/in/10/#L34">John. 10:34</a>)</p></blockquote><h3>The Law Lasted Until John the Baptist</h3><blockquote><p>“And from the days of John the Baptist until now the kingdom of heaven suffers violence, and the violent take it by force. For <strong>all the prophets and the law prophesied <mark>until</mark> John</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L12-13">Matt. 11:12-13</a>)</p></blockquote><h3>The Law Was Given Until the Time of the Coming</h3><blockquote><p>“What purpose then does <strong>the law</strong> serve? It <strong>was added (!) because of transgressions, <mark>till the Seed should come</mark></strong> to whom the promise was made” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L19">Gal. 3:19</a>)</p></blockquote><h3>The Law of Commandments Has Been Done Away by Teaching</h3><blockquote><p>“For He Himself is our peace, who has made both one, and has broken down the middle wall of separation, <strong><mark>having abolished</mark></strong> in His flesh the enmity, that is, <strong><mark>the law of commandments contained in ordinances</mark></strong>, so as to create in Himself one new man from the two, thus making peace, and that He might reconcile them both to God in one body through the cross, thereby putting to death the enmity” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L14-16">Eph. 2:14-16</a>)</p><p>In the Russian Synodal translation: “having abolished &lt;…&gt; the law of commandments <strong>by teaching</strong>” (ἐν δόγμασιν).</p></blockquote><h3>Arguing About the Law Is Now Useless</h3><blockquote><p>“But avoid foolish disputes, genealogies, <strong>contentions, and strivings about the law</strong>; for <strong>they are unprofitable and useless</strong>” (<a href="https://bibleox.com/en/eng-nkjv/tit/3/#L9">Titus. 3:9</a>)</p></blockquote><h3>The Yoke of Bondage — the Law of Moses</h3><blockquote><p>“Stand fast therefore in the liberty by which Christ has made us free, and <strong>do not be entangled again with <mark>a yoke of bondage</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L1">Gal. 5:1</a>)</p></blockquote><h3>The Yoke of Christ Is Different — Light</h3><blockquote><p>“Come to Me, all you who labor and are heavy laden, and I will give you rest. <strong>Take My yoke upon you and <mark>learn from Me</mark></strong>, for I am gentle and lowly in heart, and you will find rest for your souls. For <strong><mark>My yoke is easy and My burden is light</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L28-30">Matt. 11:28-30</a>)</p></blockquote><h3>The New Law — the Law of Christ — Is Love</h3><blockquote><p>“Love does no harm to a neighbor; therefore <strong><mark>love is the fulfillment of the law</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/13/#L10">Rom. 13:10</a>)</p></blockquote><blockquote><p>“For <strong>all the law is fulfilled in one word, even in this: ‘You shall <mark>love</mark></strong> your neighbor as yourself’” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L14">Gal. 5:14</a>)</p></blockquote><h3>After a Long Discourse on the Law — Faith and Love</h3><blockquote><p>“And whatever we ask we receive from Him, because we keep His commandments and do those things that are pleasing in His sight. And <strong>this is His commandment: that we should <mark>believe</mark> on the name of His Son Jesus Christ</strong> <strong>and <mark>love</mark> one another, <mark>as He gave us commandment</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L22-23">1 John. 3:22-23</a>)</p></blockquote><blockquote><p>“Bear one another’s burdens, and so <strong><mark>fulfill the law of Christ</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/6/#L2">Gal. 6:2</a>)</p></blockquote><blockquote><p>“And I testify again to every man who becomes circumcised that he is a debtor to keep the whole law. <strong><mark>You have become estranged from Christ, you who attempt to be justified by law</mark>; you have fallen from grace. For we through the Spirit <mark>eagerly wait for the hope of righteousness by faith</mark>.</strong> For in Christ Jesus neither circumcision nor uncircumcision avails anything, but <strong><mark>faith working through love</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L3-6">Gal. 5:3-6</a>)</p></blockquote><blockquote><p>“For <strong><mark>you, brethren, have been called to liberty</mark></strong>; only do not use liberty as an opportunity for the flesh, but <strong>through <mark>love</mark> serve one another</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L13">Gal. 5:13</a>)</p></blockquote><h3>Death Comes from the Absence of Faith, Not from Breaking the Law of Moses</h3><blockquote><p>“He who has the Son has life; he who does not have the Son of God does not have life” (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L12">1 John. 5:12</a>)</p></blockquote><h3>Salvation Came Independently of the Works of the Law of Moses</h3><blockquote><p>“But now <strong>the righteousness of God <mark>apart from the law</mark> is revealed</strong>, being witnessed by the Law and the Prophets, even the righteousness of God, through faith in Jesus Christ, to all and on all who believe. For there is no difference” (<a href="https://bibleox.com/en/eng-nkjv/rim/3/#L21-22">Rom. 3:21-22</a>)</p></blockquote><blockquote><p>“There is therefore <strong>now no condemnation to those who are <mark>in Christ Jesus, who do not walk according to the flesh, but according to the Spirit</mark></strong>. For <strong><mark>the law of the Spirit of life in Christ Jesus has made me free from the law</mark> of sin and death</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/8/#L1-2">Rom. 8:1-2</a>)</p></blockquote><h3>Life According to the Law Is Life According to the Flesh</h3><blockquote><p>“This only I want to learn from you: <strong><mark>Did you receive the Spirit by the works of the law</mark></strong>, or by the hearing of faith? Are you so foolish? <strong>Having begun in the Spirit, are you now <mark>being made perfect by the flesh</mark>?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L2-3">Gal. 3:2-3</a>)</p></blockquote><h3>Life According to the Spirit Is Higher than Life According to the Law</h3><blockquote><p>“I say then: <strong>Walk in the Spirit</strong>, and you shall not fulfill the lust of the flesh. &lt;…&gt; <strong>But if you are led by the Spirit, <mark>you are not under the law</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L16,18">Gal. 5:16,18</a>)</p></blockquote><blockquote><p>“But the fruit of the Spirit is love, joy, peace, longsuffering, kindness, goodness, faithfulness, gentleness, self-control. <strong><mark>Against such there is no law</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L22-23">Gal. 5:22-23</a>)</p></blockquote>

