    body: |-
      <h2>The Sabbath</h2><h3>God Sanctified the Sabbath</h3><p>After the creation of the world God sanctified the seventh day (the Sabbath), but did not establish a commandment:</p><blockquote><p>“Then <strong>God blessed the seventh day</strong> and <strong>sanctified it</strong>, because in it <strong>He rested from all His work</strong> which God had created and made” (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L3">Gen. 2:3</a>)</p></blockquote><p>Nearby there are many places where God gives other commands:</p><blockquote><p>“Then God blessed them, and <strong>God said to them</strong>, ‘Be fruitful and multiply…’” (<a href="https://bibleox.com/en/eng-nkjv/gen/1/#L28">Gen. 1:28</a>)</p></blockquote><blockquote><p>“And <strong>God said</strong>, ‘See, I have given you every herb … and every tree whose fruit yields seed; to you it shall be for food’” (<a href="https://bibleox.com/en/eng-nkjv/gen/1/#L29">Gen. 1:29</a>)</p></blockquote><blockquote><p>“And <strong>the LORD God commanded the man</strong>, saying, ‘Of every tree of the garden you may freely eat; but of the tree of the knowledge of good and evil you shall not eat’” (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L16-17">Gen. 2:16-17</a>)</p></blockquote><p>However, no commands are given about the Sabbath. After all the days of creation it is said that God rested, not people. People, however, God placed in the garden of Eden to work:</p><blockquote><p>“there was no man to till the ground &lt;...&gt; The LORD God planted a garden eastward in Eden, and there He put the man whom He had formed. &lt;...&gt; Then the LORD God took the man and put him in the garden of Eden <strong>to tend</strong> and keep it” (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L5,8,15">Gen. 2:5,8,15</a>)</p></blockquote><p>Into that eternal divine rest in which God abides (<a href="https://bibleox.com/en/eng-nkjv/gen/2/#L3">Gen. 2:3</a>), people will be able to enter only in the future. And even then, not all, but only those whom God Himself lets in:</p><blockquote><p>“For <strong>we who have believed do enter that rest</strong>, as He has said: ‘So I swore in My wrath, “<strong>They shall not enter My rest</strong>,”’ although the works were finished from the foundation of the world” (<a href="https://bibleox.com/en/eng-nkjv/evr/4/#L3">Heb. 4:3</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/95/#L11">Ps. 95:11</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/3/#L11">Heb. 3:11</a>)</p></blockquote><h3>The Appearance of the Commandment to Abstain from Work on the Sabbath</h3><p>The commandment of Sabbath rest was first established by God in the time of the prophet Moses, at the making of the covenant with the people of Israel:</p><blockquote><p>“Remember the Sabbath day, to keep it holy. <strong>Six days you shall labor and do all your work</strong>, but <strong>the seventh day</strong> is the Sabbath of the LORD your God. <strong>In it you shall do no work</strong>: you, nor your son, nor your daughter, nor your male servant, nor your female servant, nor your cattle, nor your stranger who is within your gates” <em>(</em><a href="https://bibleox.com/en/eng-nkjv/ish/20/#L8-10"><em>Ex. 20:8-10</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L12-15"><em>Deut. 5:12-15</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/lev/19/#L3"><em>Lev. 19:3</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30"><em>Lev. 19:30</em></a><em>)</em></p></blockquote><h3>The Reason for Establishing the Commandment of Sabbath Rest</h3><p>The reason for the commandment is given right after the words of the commandment. This reason is the exodus of the people of Israel from Egyptian captivity.</p><blockquote><p>“but the seventh day is the Sabbath of the LORD your God. In it you shall do no work &lt;…&gt; And remember that <strong><mark>you were a slave</mark></strong> in the land of Egypt, and the LORD your God <strong><mark>brought you out</mark></strong> from there by a mighty hand and by an outstretched arm; <strong><mark>therefore the LORD your God commanded you</mark></strong> to keep the Sabbath day” (<a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L14-15">Deut. 5:14-15</a>)</p></blockquote><p>He gave them “Sabbaths”, that is, He gave what had not existed before:</p><blockquote><p>“Therefore <strong><mark>I made them go out</mark> of the land of Egypt</strong> and brought them into the wilderness. <strong>And I gave them My statutes </strong>and showed them My judgments, ‘which, if a man does, he shall live by them.’ <strong>Moreover I also <mark>gave them</mark> My Sabbaths</strong>, to be a sign between them and Me, that they might know that I am the LORD who sanctifies them” (<a href="https://bibleox.com/en/eng-nkjv/iez/20/#L10-12">Ezek. 20:10-12</a>)</p></blockquote><blockquote><p>“The LORD <strong>our God made a covenant with us in Horeb. The LORD did not make this covenant with our fathers, but with us</strong>, those who are here today, all of us who are alive” (<a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L2-3">Deut. 5:2-3</a>)</p></blockquote><p>There is also another explanation, pointing to God’s blessing of the seventh day:</p><blockquote><p>“but the seventh day is the Sabbath of the LORD your God. In it you shall do no work &lt;…&gt; <strong>For</strong> in six days the LORD made the heavens and the earth, the sea, and all that is in them, and <strong><mark>rested the seventh day. Therefore the LORD blessed</mark></strong> the Sabbath day and hallowed it” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L10-11">Ex. 20:10-11</a>; <a href="https://bibleox.com/en/eng-nkjv/gen/2/#L3">Gen. 2:3</a>)</p></blockquote><p>However, although this explanation points to a connection, what is given here is precisely the reason for the blessing of the Sabbath: “<strong>therefore the LORD blessed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L10-11">Ex. 20:10-11</a>), not the reason for the command. In the other verse, however, the reason precisely for the command is given in the plainest way: “<strong>you were a slave &lt;…&gt; brought you out &lt;…&gt; therefore … commanded</strong>” (<a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L14-15">Deut. 5:14-15</a>).</p><p>Thus, the Sabbath rest is established because of the liberation of the people of Israel from Egyptian captivity, although a connection with the divine rest is indicated.</p><h3>The Law of Commandments Is Abolished</h3><p>The Law was given until the time of Christ’s coming:</p><blockquote><p><em>“What purpose then does </em><strong><em><mark>the law</mark></em></strong><em> serve? It </em><strong><em><mark>was added</mark> </em></strong><em>because of transgressions,</em><strong><em> <mark>till the Seed should come</mark></em></strong><em> to whom the promise was made” (</em><a href="https://bibleox.com/en/eng-nkjv/gal/3/#L19"><em>Gal. 3:19</em></a><em>)</em></p></blockquote><p>The law of commandments has been done away by the teaching of Christ:</p><blockquote><p><em>“For He Himself is our peace, who has made both one, and has broken down the middle wall of separation, </em><strong><em><mark>having abolished</mark></em></strong><em> in His flesh the enmity, that is, </em><strong><em><mark>the law of commandments contained in ordinances</mark></em></strong><em>, so as to create in Himself one new man from the two, thus making peace, and that He might reconcile them both to God in one body through the cross, thereby putting to death the enmity” (</em><a href="https://bibleox.com/en/eng-nkjv/ef/2/#L14-16"><em>Eph. 2:14-16</em></a><em>)</em></p></blockquote><p>Christians have been freed from the law:</p><blockquote><p><em>“But now </em><strong><em>we <mark>have been delivered from the law</mark></em></strong><em>, </em><strong><em><mark>having died</mark> to what we were held by</em></strong><em>, so that we should serve in the newness of the Spirit and </em><strong><em>not in the oldness of the letter</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/rim/7/#L6"><em>Rom. 7:6</em></a><em>)</em></p></blockquote><p>A detailed explanation of the abolition of the Law of Moses: <a href="https://bibleox.com/ru/ru/w/%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D1%8F-%D0%97%D0%B0%D0%BA%D0%BE%D0%BD-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F-%D0%BE%D1%82%D0%BC%D0%B5%D0%BD%D0%B0">Abolition of the Law of Moses</a></p><h3>Christ Defended the Apostles Against Accusations of Breaking the Sabbath Rest</h3><p>The Pharisees reproach the Lord and the apostles for breaking the Sabbath rest. Christ calls the apostles guiltless:</p><blockquote><p>“And when the Pharisees saw it, they said to Him, ‘<strong>Look, Your disciples are doing what is not lawful to do on the Sabbath!</strong>’ &lt;...&gt; ‘But <strong>if you had known</strong> what this means, “I desire mercy and not sacrifice,” <strong>you would not have condemned the <mark>guiltless</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L2,7">Matt. 12:2,7</a>)</p></blockquote><h3>The Apostle Forbids Condemning Christians for Not Keeping the Sabbath Rest</h3><blockquote><p>“So <strong>let no one <mark>judge you</mark> </strong>in food or in drink, or regarding a festival or a new moon or <strong><mark>sabbaths</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L16">Col. 2:16</a>)</p></blockquote><h2>Sunday</h2><h3>The Day of the Lord’s Appearing</h3><ol><li><p>The Lord Jesus Christ rose and appeared to the disciples, without Thomas, on the first day of the week — Sunday (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L19">John. 20:19</a>).</p></li><li><p>On Sunday He appeared to the myrrh-bearing women (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L1,9">Matt. 28:1, 9</a>), to Mary Magdalene (<a href="https://bibleox.com/en/eng-nkjv/mk/16/#L9">Mark. 16:9</a>), to the apostle Peter (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L34">Luke. 24:34</a>), to the apostles Cleopas and Luke (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L13-32">Luke. 24:13-32</a>).</p></li><li><p>For Thomas’s sake the Savior appears again exactly a week later, again on the Lord’s day (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L26">John. 20:26</a>).</p></li></ol><h3>The Day of Assembly and of Celebrating the Eucharist</h3><p>The apostles, staying in Troas for a week, out of all 7 days gather for divine service and the breaking of bread not on the Sabbath, but on Sunday:</p><blockquote><p>“But we sailed away from Philippi after the Days of Unleavened Bread, and in five days joined them at Troas, where we stayed seven days (<strong>THEY WERE IN TROAS ALL SEVEN DAYS — note</strong>). Now on the first day of the week, when the disciples came together to break bread (<strong>THEY WERE THERE 7 DAYS, BUT FOR THE BREAKING OF BREAD THEY GATHERED PRECISELY ON SUNDAY — note</strong>), Paul, ready to depart the next day, spoke to them and continued his message until midnight. There were many lamps in the upper room where they were gathered together (<strong>A SOLEMN ASSEMBLY — note</strong>). &lt;...&gt; Now when he had come up, had broken bread and eaten, and talked a long while, even till daybreak, he departed” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L6-11">Act. 20:6-11</a>).</p></blockquote><p>The apostle asks that on Sunday (the day of assembly) money be set aside little by little to help the needy:</p><blockquote><p>“<strong>On the first day of the week let each one of you lay something aside, storing up</strong> as he may prosper, that there be no collections when I come” (<a href="https://bibleox.com/en/eng-nkjv/1kor/16/#L2">1 Cor. 16:2</a>)</p></blockquote><h2>Objections</h2><p>Some communities separated from the Church (chiefly the sect of Seventh-day Adventists), contrary to the commandment (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L16">Col. 2:16</a>), accuse the Church not only of not keeping the Sabbath rest, but also of celebrating Sunday more solemnly, and say that it should not be celebrated.</p><p>In the Orthodox Church a person is called to good deeds on all the days of his life, while special days (Saturday and especially Sunday) are celebrated by performing not only a personal good deed, but also a <strong>common work</strong> (from Greek λειτουργία — leitourgia): Sunday is celebrated with a common assembly for divine service. Services are held on other days as well, but on Saturday and especially on Sunday special, more solemn services are celebrated.</p><p>For Christians the most important event is the Pascha of Christ — the Resurrection of the Lord Jesus Christ from the dead. This day is called the feast of feasts and the triumph of triumphs, because:</p><blockquote><p>“And if Christ is not risen, then our preaching is empty and your faith is also empty. &lt;...&gt; <strong>And if Christ is not risen, your faith is futile</strong>; you are still in your sins!” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L14,17">1 Cor. 15:14,17</a>)</p></blockquote><p>As already shown above, the apostles celebrated divine service precisely on Sunday. This day became a joyful day of meeting with the risen Lord. The first Christians did the same: <a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%8F_%D0%B2_%D0%B2%D0%BE%D1%81%D0%BA%D1%80%D0%B5%D1%81%D0%B5%D0%BD%D1%8C%D0%B5">the Eucharist on Sunday (in Russian)</a></p><p>They also accuse the emperor Constantine (4th century) of supposedly moving the day of rest from Saturday to Sunday (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L6-11">Act. 20:6-11</a>). However, the emperor Constantine established the very first day of rest in the week — Sunday — without giving any instructions about Saturday (<a href="https://bibleox.com/ru/ru/w/%D0%92%D0%BE%D1%81%D0%BA%D1%80%D0%B5%D1%81%D0%B5%D0%BD%D1%8C%D0%B5_%D0%B2%D1%8B%D1%85%D0%BE%D0%B4%D0%BD%D0%BE%D0%B9_%D0%A3%D0%BA%D0%B0%D0%B7_%D0%B8%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D0%BE%D1%80%D0%B0_%D0%9A%D0%BE%D0%BD%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%BD%D0%B0">more, in Russian</a>). Before this decree there were no general weekly days of rest in the Roman Empire.</p><p>Thus the criticism is, to put it mildly, unfounded.</p>

