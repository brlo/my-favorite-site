    body: |-
      <h2>The Lord Jesus Christ Drank Wine</h2><blockquote><p>“<strong>The Son of Man came eating and drinking</strong>, and they say, ‘Look, a glutton and <strong>a winebibber</strong>, a friend of tax collectors and sinners!’ But wisdom is justified by her children” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L19">Matt. 11:19</a>)</p></blockquote><blockquote><p>“Assuredly, I say to you, <strong>I will no longer drink of the fruit of the vine</strong> until that day when I drink it new in the kingdom of God” (<a href="https://bibleox.com/en/eng-nkjv/mk/14/#L25">Mark. 14:25</a>)</p></blockquote><h2>The Lord Made Wine from Water at the Wedding in Cana of Galilee</h2><blockquote><p>“When the master of the feast had <strong>tasted the water that was made wine</strong>, and did not know where it came from (but the servants who had drawn the water knew), the master of the feast called the bridegroom” (<a href="https://bibleox.com/en/eng-nkjv/in/2/#L9">John. 2:9</a>)</p></blockquote><h2>Because of Illness, Timothy Is Advised to Drink a Little Wine</h2><blockquote><p>“No longer drink only water, but <strong>use a little wine</strong> for your stomach’s sake and your frequent infirmities” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L23">1 Tim. 5:23</a>)</p></blockquote><h2>A Remark</h2><p>It is not eating food that is a sin, but gluttony and gourmandise. It is not drinking wine that is a sin, but drunkenness.</p>
