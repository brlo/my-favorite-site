    path: Ps6t_Prayer_Standing
    title: Prayer Standing
    menu: { parent: Church/Prayer, title: Prayer Standing, priority: 50 }
    body: |-
      <h2>God Calls the Old Testament Temple a House of Prayer</h2><blockquote><p>“Even them I will bring to My holy mountain, and make them joyful <strong>in My house of prayer</strong>. Their burnt offerings and their sacrifices will be accepted on My altar; for <strong>My house shall be called <mark>a house of prayer</mark> for all nations</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/56/#L7">Isa. 56:7</a>) (<a href="https://bibleox.com/en/eng-nkjv/mf/21/#L13">Matt. 21:13</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/11/#L17">Mark. 11:17</a>)</p></blockquote><p>The arrangement of the temple did not provide places for sitting. <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">The detailed arrangement of the temple</a>.</p><h2>In the Temple People Prayed Standing</h2><blockquote><p>“So Judah gathered together to ask help from the LORD; and from all the cities of Judah they came to seek the LORD. &lt;...&gt; Now <strong>all Judah, with their little ones, their wives, and their children, <mark>stood before the LORD</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2par/20/#L4,13">2 Chr. 20:4,13</a>)</p></blockquote><blockquote><p>“Then Moses said to Korah, ‘Hear now, you sons of Levi: Is it a small thing to you that the God of Israel has separated you from the congregation of Israel, to bring you near to Himself, <strong>to do the work of the tabernacle of the LORD, and <mark>to stand</mark></strong> before the congregation to serve them?’” (<a href="https://bibleox.com/en/eng-nkjv/chis/16/#L8-9">Num. 16:8-9</a>)</p></blockquote><h2>Beings Who Serve God Are Depicted Standing</h2><blockquote><p>“The wings of these <strong>cherubim</strong> spanned twenty cubits overall. <strong><mark>They stood on their feet</mark></strong>, and they faced inward” (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L13">2 Chr. 3:13</a>)</p></blockquote><h2>Christ Told the Apostles to Rise for Prayer</h2><blockquote><p>“Then an angel appeared to Him from heaven, strengthening Him. And being in agony, <strong>He prayed more earnestly. Then His sweat became like great drops of blood</strong> falling down to the ground. When He rose up from prayer, and had come to His disciples, He found them sleeping from sorrow. Then He said to them, ‘Why do you sleep? <strong><mark>Rise and pray</mark></strong>, lest you enter into temptation’” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L43-46">Luke. 22:43-46</a>)</p></blockquote><p>The word “rise” can also be understood in the sense of “wake up from sleep”. However, this passage is important also because it shows the prayer of Christ Himself with great labor and drops of sweat.</p><h2>Notes</h2><p>There are no biblical lines in which an assembly of believers prayed before God sitting in a hall filled with benches.</p>

