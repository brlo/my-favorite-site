      <h2>Bowing to the Temple</h2><p>Bowing to the <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">temple</a>, which was filled with sacred <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC#HH-%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F">images</a> of cherubim:</p><blockquote><p>“But as for me, I will come into Your house in the multitude of Your mercy; in fear of You <strong>I will worship toward Your holy temple</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>)</p></blockquote><blockquote><p>“<strong>I will worship toward Your holy temple</strong>, and praise Your name for Your lovingkindness and Your truth; for You have magnified Your word above all Your name” (<a href="https://bibleox.com/en/eng-nkjv/ps/138/#L2">Ps. 138:2</a>)</p></blockquote><h2>Bowing to God’s Footstool (the Temple)</h2><blockquote><p>“Exalt the LORD our God, and <strong>worship at His footstool</strong> (pedestal, a stand for the feet — note) <strong>— He is holy</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5">Ps. 99:5</a>) <em>(Greek: προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ — “bow down to the footstool of His feet”)</em></p></blockquote><blockquote><p>“Let us go into <strong>His tabernacle; let us worship at His footstool</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/132/#L7">Ps. 132:7</a>)</p></blockquote><h2>Bowing Before the Ark of the Covenant</h2><p>The prophet Joshua the son of Nun bows before the <a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0">Ark of the Covenant</a>, with images of cherubim on its cover and sacred objects inside:</p><blockquote><p>“Then Joshua tore his clothes, and <strong>fell to the earth on his face before the ark of the LORD</strong> until evening, he and the elders of Israel; and they put dust on their heads” (<a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6">Josh. 7:6</a>)</p></blockquote><h2>Bowing to the Image of God in the Form of Three Angels</h2><p>Abraham bows to God in the form of three men:</p><blockquote><p><em>“Then </em><strong><em>the LORD appeared to him [IN THE FORM OF AN IMAGE]</em></strong><em> (Greek: θεὸς — God; Hebrew: יְהוָ֔ה — Yahweh) by the terebinth trees of Mamre, as he was sitting in the tent door in the heat of the day. So he lifted his eyes and looked, and behold, </em><strong><em>three men</em></strong><em> were standing by him; and when he saw them, he ran from the tent door to meet them, and </em><strong><em>bowed himself to the ground</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/18/#L1-2"><em>Gen. 18:1-2</em></a><em>)</em></p></blockquote><p>Why did God appear in the form of an image? Because God is invisible by nature; no one has ever seen Him (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L16">1 Tim. 6:16</a>; <a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>). Nevertheless, Scripture reports that it was God who appeared (<em>Hebrew: יְהוָ֔ה — Yahweh</em>).</p><h2>Bowing to an Object</h2><blockquote><p>To a staff: “Then he said, ‘Swear to me.’ And he swore to him. So <strong>Israel bowed himself on the head of the bed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/47/#L31">Gen. 47:31</a>). In the LXX translation — <strong>to the staff</strong> (Greek: προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ — “Israel bowed down upon the top of his staff”; also <a href="https://bibleox.com/en/eng-nkjv/evr/11/#L21">Heb. 11:21</a>)</p></blockquote><h2>Bowing to an Angel</h2><p>It should be noted first that angels are spirits (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13-14">Heb. 1:13-14</a>), and spirits do not have flesh and bones (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L39">Luke. 24:39</a>), that is, angels too appear to people in the form of people. Accordingly, if someone bows to an angel, he <strong>bows to the visible image of an invisible spirit</strong> (an angel):</p><blockquote><p>“So He said, ‘No, but as Commander of the army of the LORD I have now come.’ And Joshua fell on his face to the earth and <strong>worshiped</strong>, and said to Him, ‘What does my Lord say to His servant?’” (<a href="https://bibleox.com/en/eng-nkjv/nav/5/#L14">Josh. 5:14</a>)</p></blockquote><blockquote><p>“Now the two angels came to Sodom in the evening, and Lot was sitting in the gate of Sodom. When Lot saw them, he rose to meet them, and he <strong>bowed himself</strong> with his face toward the ground” (<a href="https://bibleox.com/en/eng-nkjv/gen/19/#L1">Gen. 19:1</a>)</p></blockquote><blockquote><p>“it happened as the flame went up toward heaven from the altar — the Angel of the LORD ascended in the flame of the altar! When Manoah and his wife saw this, they <strong>fell on their faces to the ground</strong>” (<a href="https://bibleox.com/en/eng-nkjv/sud/13/#L20">Judg. 13:20</a>)</p></blockquote><blockquote><p>“Yet I heard the sound of his words; and while I heard the sound of his words I was in a deep sleep <strong>on my face, with my face to the ground</strong>” (<a href="https://bibleox.com/en/eng-nkjv/dan/10/#L9">Dan. 10:9</a>)</p></blockquote><blockquote><p>“When he had spoken such words to me, I <strong>turned my face toward the ground</strong> and became speechless” (<a href="https://bibleox.com/en/eng-nkjv/dan/10/#L15">Dan. 10:15</a>)</p></blockquote><h2>Bowing to a Prophet</h2><blockquote><p><strong>To Elisha</strong>: “Now when <strong>the sons of the prophets</strong> who were from Jericho saw him, they said, ‘The spirit of Elijah rests on Elisha.’ And they came to meet him, and <strong>bowed to the ground before him</strong>” (<a href="https://bibleox.com/en/eng-nkjv/4ts/2/#L15">2 Kin. 2:15</a>)</p></blockquote><blockquote><p>“Now as <strong>Obadiah</strong> was on his way, suddenly Elijah met him; and he <strong>recognized him, and fell on his face</strong>, and said, ‘Is that you, my lord Elijah?’” (<a href="https://bibleox.com/en/eng-nkjv/3ts/18/#L7">1 Kin. 18:7</a>)</p></blockquote><blockquote><p>To Daniel: “Then King <strong>Nebuchadnezzar</strong> <strong>fell on his face, prostrate before Daniel</strong>, and commanded that they should present an offering and incense to him” (<a href="https://bibleox.com/en/eng-nkjv/dan/2/#L46">Dan. 2:46</a>)</p></blockquote><blockquote><p>To Samuel: “So he said to her, ‘What is his form?’ And she said, ‘An old man is coming up, and he is covered with a mantle.’ And Saul perceived that it was Samuel, and he <strong>stooped with his face to the ground and bowed down</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1ts/28/#L14">1 Sam. 28:14</a>)</p></blockquote><blockquote><p>“Now when <strong>Abigail</strong> saw David, she dismounted quickly from the donkey, <strong>fell on her face before David, and bowed down to the ground</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1ts/25/#L23">1 Sam. 25:23</a>)</p></blockquote><h2>Bowing to a People</h2><blockquote><p>“Then Abraham <strong>bowed himself down</strong> before the people of the land” (<a href="https://bibleox.com/en/eng-nkjv/gen/23/#L12">Gen. 23:12</a>)</p></blockquote><h2>Bowing to a Brother</h2><blockquote><p>“Then he crossed over before them and <strong>bowed himself</strong> to the ground <strong>seven times</strong>, until he came near to his brother” (<a href="https://bibleox.com/en/eng-nkjv/gen/33/#L3">Gen. 33:3</a>)</p></blockquote><blockquote><p>“Now Joseph was governor over the land; and it was he who sold to all the people of the land. And <strong>Joseph’s brothers</strong> came and <strong>bowed down before him with their faces to the earth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/42/#L6">Gen. 42:6</a>)</p></blockquote><h2>Bowing to a Father-in-Law</h2><blockquote><p>“So Moses went out to meet his father-in-law, <strong>bowed down</strong>, and kissed him. And they asked each other about their well-being, and they went into the tent” (<a href="https://bibleox.com/en/eng-nkjv/ish/18/#L7">Ex. 18:7</a>)</p></blockquote>
