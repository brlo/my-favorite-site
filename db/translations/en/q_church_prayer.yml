    references: |-
      <p>Some see here a prayer of the Apostle Paul for the departed Onesiphorus, since they believe that by this moment Onesiphorus had already died:</p><blockquote><p>“The Lord grant mercy to the household of Onesiphorus, for he often refreshed me, and was not ashamed of my chain; but when he arrived in Rome, he sought me out very zealously and found me. <strong>The Lord grant to him that he may find mercy from the Lord in that Day</strong> — and you know very well how many ways he ministered to me at Ephesus” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L16-18">2 Tim. 1:16-18</a>)</p></blockquote><p>It may be so, but it seems there are as yet no serious grounds to think that Onesiphorus had already died by this moment.</p>
    body: |-
      <h2>Preface</h2><p>Asking some mercy for the departed is a movement of a loving heart, that is, of a person guided by love for God and neighbor. We do not know how the Lord will decide to act with regard to this or that petition for the departed, yet we have a reason for hope and a love that moves us to care. What is this reason? The reason is divine revelation, from which we learn that God is almighty, that He holds the “keys” of Hades and death, that there are sins which will not be forgiven even in the age to come (which allows us to understand that there are other sins too), and that God has called us to turn to Him with the most varied petitions. We also know that the measure of punishment of sinners is <a href="https://bibleox.com/ru/ru/w/bib_%D0%9D%D0%B5%D0%BE%D0%B4%D0%B8%D0%BD%D0%B0%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D0%BC%D0%B5%D1%80%D0%B0_%D0%B2%D0%BE%D0%B7%D0%B4%D0%B0%D1%8F%D0%BD%D0%B8%D1%8F:_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D1%8F_%D0%B8_%D0%B1%D0%BB%D0%B0%D0%B6%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">not the same</a>, and the degree of blessedness of the righteous is not the same, therefore even if a person is not saved, we hope for a softening of his lot. The departed were cared for in the Old Testament (see <a href="#HH-The-Old-Testament-Care-for-the-Forgiveness-of-the-Sins-of-the-Departed">below</a>), and the most ancient Christians cared for them too (<a href="https://bibleox.com/ru/ru/w/91USaqiJ_%D0%BC%D0%BE%D0%BB%D0%B8%D1%82%D0%B2%D1%8B_%D0%B7%D0%B0_%D1%83%D0%BC%D0%B5%D1%80%D1%88%D0%B8%D1%85">more</a>).</p><p>To all this we are moved by love, which “never fails” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>).</p><h2>God Is Almighty</h2><blockquote><p><em>“Behold, I am the LORD, the God of all flesh. </em><strong><em>Is there anything too hard for Me?</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ier/32/#L27"><em>Jer. 32:27</em></a><em>)</em></p></blockquote><p>Other quotes: <a href="https://bibleox.com/ru/ru/w/%D0%91%D0%BE%D0%B3-%D0%B2%D1%81%D0%B5%D0%BC%D0%BE%D0%B3%D1%83%D1%89%D0%B8%D0%B9">https://bibleox.com/ru/ru/w/Бог-всемогущий</a></p><h2>God Promised That Those Who Keep the Commandments Will Receive in Prayer Whatever They Ask with Faith</h2><blockquote><p>“And <strong>whatever we ask we receive from Him</strong>, because we keep His commandments and do those things that are pleasing in His sight” (<a href="https://bibleox.com/en/eng-nkjv/1in/3/#L22">1 John. 3:22</a>)</p></blockquote><blockquote><p>“And if we know that <strong>He hears us, whatever we ask</strong>, we know that we have the petitions that we have asked of Him” (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L15">1 John. 5:15</a>)</p></blockquote><blockquote><p>“And <strong>whatever things you ask in prayer, believing, you will receive</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/21/#L22">Matt. 21:22</a>)</p></blockquote><blockquote><p>“Again I say to you that if two of you agree on earth concerning anything that they ask, <strong>it will be done for them</strong> by My Father in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L19">Matt. 18:19</a>)</p></blockquote><blockquote><p>“You did not choose Me, but I chose you and appointed you that you should go and bear fruit, and that your fruit should remain, that <strong>whatever you ask the Father in My name He may give you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L16">John. 15:16</a>)</p></blockquote><p>These words are said in the context of prayer for the salvation of sinning brothers, whom God saves through the prayer of the righteous:</p><blockquote><p>“And if we know that <strong><mark>He hears us, whatever we ask</mark></strong>, we know that we have the petitions that we have asked of Him. If <strong><mark>anyone sees his brother sinning a sin which does not lead to death, he will ask, and He will give him life</mark> for those who commit sin not leading to death</strong>. There is sin leading to death. I do not say that he should pray about that” (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L15-16">1 John. 5:15-16</a>)</p></blockquote><h2>Sins Can Be Forgiven Through the Prayer of the Church</h2><p>This means that sins are forgiven not only when the person himself repents and asks for forgiveness, but also when others ask for the forgiveness of his sins:</p><blockquote><p>“Is anyone among you sick? <strong>Let him call for the elders of the church</strong>, and <strong>let them pray over him</strong>, anointing him with oil in the name of the Lord. And the prayer of faith will save the sick, and the Lord will raise him up. And <strong>if he has committed sins, he will be forgiven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15">James. 5:14-15</a>)</p></blockquote><p>The friends of a paralyzed companion labored hard to bring their friend to Christ. And by their faith the Lord forgave the paralytic his sins and healed him:</p><blockquote><p>“When <em>Jesus</em> <strong>saw their faith</strong><em>, He said to the paralytic, ‘Son, </em><strong><em>your sins are forgiven you</em></strong><em>’</em>” (<a href="https://bibleox.com/en/eng-nkjv/mk/2/#L5">Mark. 2:5</a>)</p></blockquote><h2>Sins Can Be Forgiven Even After Death</h2><p>It follows from the words of the Lord Jesus Christ that the forgiveness of sins is possible not only in this age, but also in the age to come. There are sins that will be forgiven neither now nor later:</p><blockquote><p>“Therefore I say to you, every sin and blasphemy will be forgiven men, but the blasphemy against the Spirit will not be forgiven men. Anyone who speaks a word against the Son of Man, it will be forgiven him; but whoever speaks against the Holy Spirit, <strong>it will not be forgiven him, either in this age or in the age to come</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L31-32">Matt. 12:31-32</a>).</p></blockquote><h2>Christ Holds the Keys of Hades and Death</h2><blockquote><p>“And when I saw Him, I fell at His feet as dead. But He laid His right hand on me, saying to me, ‘Do not be afraid; I am the First and the Last. I am He who lives, and was dead, and behold, I am alive forevermore. Amen. And <strong>I have the keys of Hades and of Death</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L17-18">Rev. 1:17-18</a>)</p></blockquote><h2>The Old Testament. Care for the Forgiveness of the Sins of the Departed</h2><h3>Fasting for the Departed</h3><p>The Israelites fasted for the dead King Saul, his sons and all the Israelites who fell in battle</p><blockquote><p>“So Saul, his three sons, his armorbearer, and all his men died together that same day” (<a href="https://bibleox.com/en/eng-nkjv/1ts/31/#L6">1 Sam. 31:6</a>)</p></blockquote><blockquote><p>“Then they took their bones and buried them under the tamarisk tree at Jabesh, and <strong>fasted seven days</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1ts/31/#L13">1 Sam. 31:13</a>)</p></blockquote><blockquote><p>“And they <strong>mourned and wept and fasted until evening</strong> for Saul and for Jonathan his son, for the people of the LORD and for the house of Israel, because they had fallen by the sword” (<a href="https://bibleox.com/en/eng-nkjv/2ts/1/#L12">2 Sam. 1:12</a>)</p></blockquote><h3>Prayer and Sacrifice for the Departed</h3><p>The Jews prayed for the fallen warriors, that their sin might be forgiven. They also sent money to the Temple in Jerusalem, so that a sacrifice of atonement might be offered for the dead, for their cleansing from sin:</p><blockquote><p>“Then Judas assembled his army and went to the city of Adullam. As the seventh day was coming on, they purified themselves according to the custom, and kept the sabbath there. On the next day, as had now become necessary, Judas and his men went to take up the bodies of the fallen and to bring them back to lie with their kindred in the sepulchres of their ancestors. Then under the tunic of each one of the dead they found sacred tokens of the idols of Jamnia, which the law forbids the Jews to wear. And it became clear to all that this was the reason these men had fallen. So they all blessed the ways of the Lord, the righteous judge, who reveals the things that are hidden; and <strong>they turned to supplication, praying that the sin that had been committed might be wholly blotted out</strong>. The noble Judas exhorted the people to keep themselves free from sin, for they had seen with their own eyes what had happened as the result of the sin of those who had fallen. <strong>He also took up a collection, man by man, to the amount of two thousand drachmas of silver, and sent it to Jerusalem to provide for a sin offering. In doing this he acted very well and honorably, taking account of the resurrection</strong>. For <strong>if he were not expecting that those who had fallen would rise again, it would have been superfluous and foolish to pray for the dead</strong>. But if he was looking to the splendid reward that is laid up for those who fall asleep in godliness, it was a holy and pious thought. <strong>Therefore he made atonement for the dead, so that they might be delivered from their sin</strong>” (<a href="https://bibleox.com/en/en-nrsv/2mak/12/#L38-45">2 Macc. 12:38-45</a>)</p></blockquote><h3>Almsgiving for the Departed</h3><p>The Jews gave alms for the sake of the departed:</p><blockquote><p>“Give graciously to all the living; <strong>do not withhold kindness even from the dead</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/7/#L33">Sir. 7:33</a>)</p></blockquote><blockquote><p>“<strong>Place your bread on the grave of the righteous</strong>, but give none to sinners” (<a href="https://bibleox.com/en/en-nrsv/tov/4/#L17">Tob. 4:17</a>)</p></blockquote><p>Alms for the dead were not given from the tithe:</p><blockquote><p>“<strong>When you have finished laying aside all the tithe of your increase</strong> in the third year — the year of tithing — and have given it to the Levite, the stranger, the fatherless, and the widow, so that they may eat within your gates and be filled, <strong>then you shall say before the LORD your God</strong>: ‘I have removed the holy tithe from my house, and also have given them to the Levite, the stranger, the fatherless, and the widow, according to all Your commandments which You have commanded me; I have not transgressed Your commandments, nor have I forgotten them. I have not eaten any of it when in mourning, nor have I removed any of it for an unclean use, <strong>nor given any of it for the dead</strong>. I have obeyed the voice of the LORD my God, and have done according to all that You have commanded me’” (<a href="https://bibleox.com/en/eng-nkjv/vtor/26/#L12-14">Deut. 26:12-14</a>)</p></blockquote><h2>With God All Are Alive</h2><p>The quotes given show the beliefs of the Jews and their concrete practices. They prayed for the forgiveness of the sins of the dead, fasted for the dead, offered sacrifices for the dead, gave alms for the dead and in general cared about their lot after death. Only the Sadducees rejected existence after death, and the Lord rebuked them for their errors and their ignorance of the Scriptures:</p><blockquote><p>“Jesus answered and said to them, ‘You are mistaken, <strong>not knowing the Scriptures nor the power of God</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/22/#L29">Matt. 22:29</a>)</p></blockquote><blockquote><p>“<strong>He is not the God of the dead, but the God of the living</strong>. <strong>You are therefore greatly mistaken</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/12/#L27">Mark. 12:27</a>)</p></blockquote><h2>Hope for Every Help for the Departed</h2><p>Even if some person could not be saved from hell, in any case his sufferings can be eased, some consolation can be given, now or in the future (after the general resurrection and the Judgment), because the measure of punishment is not the same:</p><blockquote><p><em>“And that servant </em><strong><em>who knew his master’s will</em></strong><em>, and did not prepare himself </em><strong><em>or do according to his will, <mark>shall be beaten with many stripes</mark>. But he who did not know</em></strong><em>, yet </em><strong><em>committed things deserving of stripes, <mark>shall be beaten with few</mark></em></strong><em>. For everyone to whom much is given, from him much will be required; and </em><strong><em>to whom much has been committed, of him they will ask the more</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/12/#L47-48"><em>Luke. 12:47-48</em></a><em>)</em></p></blockquote><p>More quotes on the difference in punishment:<em> </em><a href="https://bibleox.com/ru/ru/w/bib_%D0%9D%D0%B5%D0%BE%D0%B4%D0%B8%D0%BD%D0%B0%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D0%BC%D0%B5%D1%80%D0%B0_%D0%B2%D0%BE%D0%B7%D0%B4%D0%B0%D1%8F%D0%BD%D0%B8%D1%8F:_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D1%8F_%D0%B8_%D0%B1%D0%BB%D0%B0%D0%B6%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">the measure of punishment is not the same</a>.</p>

  - src: действие-Бога-по-вере-родителей-и-друзей
    path: Gf3o_Gods_Action_Through_the_Faith_and_Prayer_of_Others
    title: God’s Action Through the Faith and Prayer of Others
    meta_desc: Bible quotes about the action of divine grace in a person through the faith and prayer of other people
    menu: { parent: Church/Prayer, title: Through the Faith of Others, priority: 4 }
    body: |-
      <p>The action of divine grace does not always take place through a person’s own faith and own request. There are not a few cases when God acted through the faith of people close to someone, who labor for the one they love and ask (pray) for him.</p><h2>4 Friends and the Paralytic</h2><p>Healing and the forgiveness of sins take place through the faith of the friends of a paralyzed man, who labored hard to bring him to Christ:</p><blockquote><p>“When <em>Jesus</em> <strong>saw their faith</strong><em>, He said to the paralytic, ‘Son, </em><strong><em>your sins are forgiven you</em></strong><em>’</em>” (<a href="https://bibleox.com/en/eng-nkjv/mk/2/#L5">Mark. 2:5</a>)</p></blockquote><h2>The Centurion and His Servant</h2><p>The centurion believes and asks, but it is the centurion’s servant who is healed:</p><blockquote><p>“The centurion answered and said, ‘Lord, I am not worthy that You should come under my roof. But only speak a word, and my servant will be healed.’ ... When Jesus heard it, He marveled, and said to those who followed, ‘<strong>Assuredly, I say to you, I have not found such great faith, not even in Israel!</strong>’ ... Then Jesus said to the centurion, ‘Go your way; and as you have believed, so let it be done for you.’ And <strong>his servant was healed that same hour</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/8/#L8,10,13">Matt. 8:8,10,13</a>)</p></blockquote><h2>A Father and His Demon-Possessed Son</h2><p>The father believes and asks, but it is the son who is healed of demon possession:</p><blockquote><p>“Teacher, <strong>I brought You my son, who has a mute spirit</strong>... So He asked his father, ‘How long has this been happening to him?’ And he said, ‘From childhood... But if You can do anything, have compassion on us and help us.’ Jesus said to him, ‘<strong>If you can believe, all things are possible to him who believes</strong>.’ Immediately the father of the child cried out and said with tears, ‘Lord, I believe; help my unbelief!’” (<a href="https://bibleox.com/en/eng-nkjv/mk/9/#L17-27">Mark. 9:17-27</a>)</p></blockquote><h2>A Canaanite Mother and Her Demon-Possessed Daughter</h2><p>The mother believes and asks, but it is the daughter of the Canaanite woman (a Syro-Phoenician — <a href="https://bibleox.com/en/eng-nkjv/mk/7/#L26">Mark. 7:26</a>) who is healed of demon possession:</p><blockquote><p>“And behold, a woman of Canaan came from that region and cried out to Him, saying, ‘Have mercy on me, O Lord, Son of David! My daughter <strong>is severely demon-possessed</strong>.’... Then Jesus answered and said to her, ‘O woman, <strong>great is your faith</strong>! Let it be to you as you desire.’ And her daughter was healed from that very hour” (<a href="https://bibleox.com/en/eng-nkjv/mf/15/#L22-28">Matt. 15:22-28</a>)</p></blockquote><h2>Jairus and His 12-Year-Old Daughter</h2><p>The father (Jairus) believes and asks, but it is the daughter who is raised and healed:</p><blockquote><p>“there came a man named Jairus, and he was a ruler of the synagogue. And he fell down at Jesus’ feet and begged Him to come to his house, for he had <strong>an only daughter</strong> about twelve years of age, and she was dying... ‘<strong>Your daughter is dead</strong>. Do not trouble the Teacher.’ But when Jesus heard it, He answered him, saying, ‘<strong>Do not be afraid; only believe, and she will be made well</strong>.’... But He put them all outside, took her by the hand and called, saying, ‘Little girl, arise.’ Then her spirit returned, and she arose immediately” (<a href="https://bibleox.com/en/eng-nkjv/lk/8/#L41-42,49-55">Luke. 8:41-42,49-55</a>)</p></blockquote><h2>A Nobleman Father and His Son</h2><p>The nobleman believes and asks, but it is his son who is healed:</p><blockquote><p>“And there was a certain nobleman whose <strong>son was sick</strong> at Capernaum. When he heard that Jesus had come out of Judea into Galilee, he went to Him and implored Him to come down and heal his son, for he was at the point of death... Jesus said to him, ‘Go your way; your son lives.’ So the man <strong>believed</strong> the word that Jesus spoke to him, and he went his way” (<a href="https://bibleox.com/en/eng-nkjv/in/4/#L46-50">John. 4:46-50</a>)</p></blockquote><h2>Conclusions</h2><p>Thus the Savior expected faith from the parents in order to show the divine action toward their children. And through the request and faith of the parents, divine grace acted toward the children.</p>

  - src: молитва-не-своими-словами
    path: Pm4t_Prayer_Following_a_Pattern
    title: Prayer Following a Pattern
    title_sub: On whether prayer can be one’s own, but not in one’s own words
    menu: { parent: Church/Prayer, title: Prayer Following a Pattern, priority: 6 }
    body: |-
      <h2>Prayer Following a Pattern</h2><p>In the Old Testament there is a large God-inspired prayer book — the Psalter. It was written by the prophet and king David. It was used at the temple; the psalms were sung while going up the steps.</p><p>When the apostles ask the Lord to teach them to pray, they refer to the fact that the prophet John the Baptist had already taught his disciples to pray:</p><blockquote><p>“Now it came to pass, as He was praying in a certain place, when He ceased, that one of His disciples said to Him, ‘Lord, <strong>teach us to pray</strong>, as <strong>John also taught his disciples</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L1">Luke. 11:1</a>)</p></blockquote><p>After which Christ gave a pattern of prayer in His own words:</p><blockquote><p>“So He said to them, ‘When you pray, say: Our Father in heaven, hallowed be Your name. Your kingdom come. Your will be done on earth as it is in heaven. Give us day by day our daily bread. And forgive us our sins, for we also forgive everyone who is indebted to us. And do not lead us into temptation, but deliver us from the evil one’” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L2-4">Luke. 11:2-4</a>) (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L9-13">Matt. 6:9-13</a>)</p></blockquote><p>That is, to give prayers and to pray following a pattern (a rule) is completely normal and is a biblical practice.</p>

  - src: длинные-молитвы
    path: Lp5r_Long_Prayers
    title: Long Prayers
    meta_desc: Bible quotes about long prayers
    menu: { parent: Church/Prayer, title: Long Prayers, priority: 7 }
    body: |-
      <h2>Prayers Can Be Long</h2><h3>The Commandment to Pray Always</h3><blockquote><p>“Rejoice always, <strong>pray without ceasing</strong>, in everything give thanks; for this is the will of God in Christ Jesus for you” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L16-18">1 Thess. 5:16-18</a>)</p></blockquote><blockquote><p>“<strong>praying always</strong> with all prayer and supplication in the Spirit, being watchful to this end with all perseverance and supplication for all the saints” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L18">Eph. 6:18</a>)</p></blockquote><h3>The Lord Jesus Christ Prayed Extraordinarily Long</h3><p>He prayed all night:</p><blockquote><p>“Now it came to pass in those days that He went out to the mountain to pray, and continued <strong>all night in prayer</strong> to God” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L12">Luke. 6:12</a>)</p></blockquote><p>He prayed from evening almost until morning. The night is divided into 4 parts or watches. The 4th watch is the last part of the night, almost morning. Christ prayed almost all night:</p><blockquote><p>“And when He had sent the multitudes away, He went up on the mountain by Himself <strong>to pray</strong>. Now when <strong>evening</strong> came, He was alone there. &lt;...&gt; Now <strong>in the fourth watch of the night</strong> Jesus went to them, walking on the sea” (<a href="https://bibleox.com/en/eng-nkjv/mf/14/#L23,25">Matt. 14:23,25</a>)</p></blockquote><p>An hour after His prayer began, Christ came to wake the apostles, which was repeated two more times. One may suppose that He prayed for about 3 hours:</p><blockquote><p>“Then they came to a place which was named Gethsemane; and He said to His disciples, ‘Sit here while <strong>I pray</strong>.’ &lt;...&gt; He went a little farther, and <strong>fell on the ground, and prayed</strong> that if it were possible, the hour might pass from Him. &lt;...&gt; Then He came and found them sleeping, and said to Peter, ‘Simon, are you sleeping? Could you not watch <strong><mark>one hour</mark></strong>?’ &lt;...&gt; <strong><mark>Again</mark> He went away and prayed</strong>, and spoke the same words. And when He returned, He found them asleep again, for their eyes were heavy; and they did not know what to answer Him. Then He came <strong><mark>the third time</mark></strong> and said to them, ‘Are you still sleeping and resting?’” (<a href="https://bibleox.com/en/eng-nkjv/mk/14/#L32,35,37,39-41">Mark. 14:32,35,37,39-41</a>)</p></blockquote><h3>Parables</h3><p>Having given the pattern of prayer — the “Our Father”, the Lord immediately added a parable about persistence and patience in prayer:</p><blockquote><p>“And He said to them, ‘Which of you shall have a friend, and go to him at midnight and say to him, “Friend, lend me three loaves; for a friend of mine has come to me on his journey, and I have nothing to set before him”; and he will answer from within and say, “Do not trouble me; the door is now shut, and my children are with me in bed; I cannot rise and give to you”? I say to you, though he will not rise and give to him because he is his friend, yet <strong>because of his persistence he will rise and give</strong> him as many as he needs’” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L5-8">Luke. 11:5-8</a>)</p></blockquote><p>The parable of the widow and the judge:</p><blockquote><p>“Then He spoke a parable to them, that <strong>men always ought to pray and not lose heart</strong>, saying: ‘There was in a certain city a judge who did not fear God nor regard man. Now there was a widow in that city; and she came to him, saying, “Get justice for me from my adversary.” And he would not for a while; but afterward he said within himself, “Though I do not fear God nor regard man, yet because this widow troubles me I will avenge her, lest by her continual coming she weary me.”’ Then the Lord said, ‘Hear what the unjust judge said. And shall God not avenge His own elect <strong>who cry out day and night to Him</strong>, though He bears long with them?’” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L1-7">Luke. 18:1-7</a>)</p></blockquote><h2>Prayers Can Be Short</h2><p>After the parable of the widow and the judge about the need for constant and persistent prayer, the Lord tells a parable about the short prayer of the tax collector, which was pleasing to Him, although the parable itself, as the Evangelist explains, is about those who are vainly confident in their own righteousness. In the end, Christ directly points out how the tax collector pleased God: by his low opinion of himself and his own righteousness:</p><blockquote><p>“Also He spoke this parable to some <strong>who trusted in themselves that they were righteous, and despised others</strong>: ‘Two men went up to the temple to pray, one a Pharisee and the other a tax collector. The Pharisee stood and prayed thus with himself, “God, I thank You that I am not like other men — extortioners, unjust, adulterers, or even as this tax collector. I fast twice a week; I give tithes of all that I possess.” And the tax collector, standing afar off, would not so much as raise his eyes to heaven, but beat his breast, saying, <strong>“God, be merciful to me a sinner!”</strong> I tell you, this man went down to his house justified rather than the other; for <strong><mark>everyone who exalts himself will be humbled, and he who humbles himself will be exalted</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L9-14">Luke. 18:9-14</a>)</p></blockquote><h2>Criticism</h2><h3>Do Not Use Many Words</h3><p>In the Gospel of Matthew, before the “Our Father” prayer, the words of Christ are recorded that one should not say too much in prayer:</p><blockquote><p>“And when you pray, <strong>do not use vain repetitions</strong> as the heathen do. For they think that they will be heard <strong>for their many words</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L7">Matt. 6:7</a>)</p></blockquote><p>This speaks of the need not to say anything superfluous, not to ask in detail about earthly needs, which God already knows. The Lord Himself prayed long, and sometimes repeated His prayers:</p><blockquote><p><em>“</em><strong><em>Again</em></strong><em> He went away and prayed, </em><strong><em>and spoke the same words</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mk/14/#L39"><em>Mark. 14:39</em></a><em>)</em></p></blockquote><p>See also here: <a href="https://bibleox.com/en/en/w/Pr1y_Prayer/#HH-No-Empty-Wordiness">Prayer: no empty wordiness</a></p>

