    body: |-
      <h2>The Commandment to Pray</h2><h3>Prayer of Petition</h3><blockquote><p>“<strong><mark>Ask, and it will be given to you</mark></strong>; seek, and you will find; <strong>knock, and it will be opened to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L7">Matt. 7:7</a>) (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L9">Luke. 11:9</a>)</p></blockquote><h3>Prayer of Thanksgiving</h3><blockquote><p>“<strong>pray without ceasing, <mark>in everything give thanks</mark>; for this is the will of God</strong> in Christ Jesus for you” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L17-18">1 Thess. 5:17-18</a>)</p></blockquote><blockquote><p>“but in everything <strong>by prayer and supplication, with <mark>thanksgiving</mark></strong>, let your requests be made known to God” (<a href="https://bibleox.com/en/eng-nkjv/fil/4/#L6">Phil. 4:6</a>)</p></blockquote><blockquote><p>“but be filled with the Spirit, speaking to one another in psalms and hymns and spiritual songs, singing and making melody in your heart to the Lord, <strong><mark>giving thanks always for all things to God</mark></strong> the Father in the name of our Lord Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L18-20">Eph. 5:18-20</a>)</p></blockquote><blockquote><p>“And whatever you do in word or deed, do all in the name of the Lord Jesus, <strong><mark>giving thanks to God</mark></strong> the Father <strong><mark>through Him</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L17">Col. 3:17</a>)</p></blockquote><h3>Prayer Praising God (Doxology)</h3><blockquote><p>“Enter into His gates with <strong><mark>thanksgiving</mark></strong>, and into His courts with praise. <strong><mark>Be thankful to Him, and bless His name</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/100/#L4">Ps. 100:4</a>)</p></blockquote><blockquote><p>“<strong><mark>I will bless the LORD at all times; His praise shall continually be in my mouth</mark></strong>. My soul shall make its boast in the LORD; the humble shall hear of it and be glad” (<a href="https://bibleox.com/en/eng-nkjv/ps/34/#L1-2">Ps. 34:1-2</a>)</p></blockquote><blockquote><p>“Therefore by Him let us <strong>continually offer the sacrifice of <mark>praise</mark> to God</strong>, that is, the fruit of our lips, <strong><mark>giving thanks to His name</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L15">Heb. 13:15</a>)</p></blockquote><h2>Constant Prayer and Contemplation of God</h2><blockquote><p>“<strong><mark>praying always</mark></strong> with all prayer and supplication <strong>in the Spirit</strong>, being watchful to this end with all perseverance and supplication for all the saints” (<a href="https://bibleox.com/en/eng-nkjv/ef/6/#L18">Eph. 6:18</a>)</p></blockquote><blockquote><p>“<strong><mark>pray without ceasing</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L17">1 Thess. 5:17</a>)</p></blockquote><blockquote><p>“Then He spoke a parable to them, that <strong>men <mark>always ought to pray</mark> and not lose heart</strong>, saying: ‘There was in a certain city a judge who did not fear God nor regard man. Now there was a widow in that city; and she came to him, saying, “Get justice for me from my adversary.” And he would not for a while; but afterward he said within himself, “Though I do not fear God nor regard man, yet because this widow troubles me I will avenge her, lest by her continual coming she weary me.”’ Then the Lord said, ‘Hear what the unjust judge said. And shall God not <strong>avenge His own elect who cry out day and night to Him, though He bears long with them</strong>?’” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L1-7">Luke. 18:1-7</a>)</p></blockquote><h2>What Prayer Will Be Heard</h2><h3>Faith</h3><blockquote><p>“If any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him. But <strong><mark>let him ask in faith</mark>, with no doubting, for he who doubts is like a wave of the sea</strong> driven and tossed by the wind. <strong>For let not that man suppose that he will receive anything from the Lord</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/1/#L5-7">James. 1:5-7</a>)</p></blockquote><blockquote><p>“And whatever things <strong><mark>you ask in prayer, believing</mark></strong>, you will receive” (<a href="https://bibleox.com/en/eng-nkjv/mf/21/#L22">Matt. 21:22</a>) (<a href="https://bibleox.com/en/eng-nkjv/mk/11/#L24">Mark. 11:24</a>)</p></blockquote><h3>Righteousness (Life According to God’s Will, Turning Away from Sins)</h3><blockquote><p><em>“The sacrifice of the wicked is an abomination to the LORD, but </em><strong><em>the prayer of <mark>the upright</mark> is His delight</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/pr/15/#L8"><em>Prov. 15:8</em></a><em>)</em></p></blockquote><blockquote><p><em>“The LORD is far from the wicked, but </em><strong><em>He hears the prayer of <mark>the righteous</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/pr/15/#L29"><em>Prov. 15:29</em></a><em>)</em></p></blockquote><blockquote><p>“<strong><mark>If you abide in Me</mark>, and My words abide in you</strong>, you will ask what you desire, and it shall be done for you” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L7">John. 15:7</a>)</p></blockquote><blockquote><p>“these people draw near with their mouths and <strong>honor Me with their lips, but have removed their hearts far from Me</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/29/#L13">Isa. 29:13</a>)</p></blockquote><h3>A Humble and Contrite Heart</h3><blockquote><p>“The sacrifices of God are <strong><mark>a broken spirit, a broken and a contrite heart</mark> — these, O God, You will not despise</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/51/#L17">Ps. 51:17</a>)</p></blockquote><blockquote><p><em>“LORD, </em><strong><em><mark>You have heard the desire of the humble</mark></em></strong><em>; You will prepare their heart; You will cause Your ear to hear” (</em><a href="https://bibleox.com/en/eng-nkjv/ps/10/#L17"><em>Ps. 10:17</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em><mark>The prayer of the humble pierces the clouds</mark></em></strong><em>, and it will not rest until it reaches its goal” (</em><a href="https://bibleox.com/en/en-nrsv/prsir/35/#L21"><em>Sir. 35:21</em></a><em>)</em></p></blockquote><blockquote><p><em>“But </em><strong><em>on this one <mark>will I look: on him who is poor</mark></em></strong><em> and of a contrite spirit, and who trembles at My word” (</em><a href="https://bibleox.com/en/eng-nkjv/is/66/#L2"><em>Isa. 66:2</em></a><em>)</em></p></blockquote><blockquote><p><em>“But with a contrite soul and </em><strong><em><mark>a humble spirit</mark> may we <mark>be accepted</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/gr-lxx-byz/dan/3/#L39"><em>Dan. 3:39 LXX</em></a><em>; translated from the Greek: ἀλλ᾿ ἐν ψυχῇ συντετριμμένῃ καὶ πνεύματι τεταπεινωμένῳ προσδεχθείημεν)</em></p></blockquote><blockquote><p>“<strong>Also He spoke this parable to some who <mark>trusted in themselves that they were righteous, and despised others</mark></strong>: ‘Two men went up to the temple to pray, one a Pharisee and the other a tax collector. <strong>The Pharisee stood and prayed thus with himself</strong>, “God, I thank You that <strong><mark>I am not like other men</mark></strong> — extortioners, unjust, adulterers, or even as this tax collector. I fast twice a week; I give tithes of all that I possess.” <strong>And the tax collector, standing afar off, would not so much as raise his eyes to heaven</strong>, but beat his breast, saying, <strong>“God, be merciful to me a sinner!”</strong> I tell you, this man went down to his house justified rather than the other; for everyone who exalts himself will be humbled, and he who humbles himself will be exalted’” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L9-14">Luke. 18:9-14</a>)</p></blockquote><p>See also: <a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BC%D0%B8%D1%80%D0%B5%D0%BD%D0%B8%D0%B5">Humility</a>.</p><h3>Forgiving All Offenses</h3><blockquote><p>“And <strong>whenever you stand praying, if you have anything against anyone, <mark>forgive</mark> him</strong>, that your Father in heaven may also forgive you your trespasses. <strong>But if you do not forgive, neither will your Father in heaven forgive</strong> your trespasses” (<a href="https://bibleox.com/en/eng-nkjv/mk/11/#L25-26">Mark. 11:25-26</a>)</p></blockquote><blockquote><p>“For <strong><mark>if you forgive</mark> men their trespasses, your heavenly Father will also forgive you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L14">Matt. 6:14</a>)</p></blockquote><h3>Peace with One’s Neighbors</h3><blockquote><p>“Therefore if you bring your gift to the altar, and there remember that your brother has something against you, leave your gift there before the altar, and go your way. <strong><mark>First be reconciled to your brother</mark>, and then come and offer your gift</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L23-24">Matt. 5:23-24</a>)</p></blockquote><blockquote><p>“<strong>Husbands, likewise, dwell with them with understanding</strong>, <strong>giving honor to the wife</strong>, as to the weaker vessel, and as being heirs together of the grace of life, <strong>that your prayers may not be hindered</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L7">1 Pet. 3:7</a>)</p></blockquote><h3>Patience</h3><blockquote><p>“Then He spoke a parable to them, that <strong><mark>men always ought to pray and not lose heart</mark></strong>, saying: ‘There was in a certain city a judge who did not fear God nor regard man. Now there was a widow in that city; and she came to him, saying, “Get justice for me from my adversary.” And he would not for a while; but afterward he said within himself, “Though I do not fear God nor regard man, yet because this widow troubles me I will avenge her, lest by her continual coming she weary me.”’ Then the Lord said, ‘Hear what the unjust judge said. And shall God not <strong>avenge His own elect who cry out day and night to Him, though He bears long with them</strong>?’” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L1-7">Luke. 18:1-7</a>)</p></blockquote><blockquote><p>“And He said to them, ‘Which of you shall have a friend, and go to him at midnight and say to him, “Friend, lend me three loaves; for a friend of mine has come to me on his journey, and I have nothing to set before him”; and he will answer from within and say, “Do not trouble me; the door is now shut, and my children are with me in bed; I cannot rise and give to you”? I say to you, though he will not rise and give to him because he is his friend, yet <strong><mark>because of his persistence he will rise and give him as many as he needs</mark>. So I say to you, ask, and it will be given to you</strong>; seek, and you will find; knock, and it will be opened to you. For everyone who asks receives, and he who seeks finds, and to him who knocks it will be opened’” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L5-10">Luke. 11:5-10</a>)</p></blockquote><h3>Almsgiving (Active Help to Those in Need)</h3><blockquote><p>“<strong>Prayer with fasting is good, but better than both is <mark>almsgiving</mark> with righteousness</strong>. A little with righteousness is better than wealth with wrongdoing. It is better to give alms than to lay up gold” (<a href="https://bibleox.com/en/en-nrsv/tov/12/#L8">Tob. 12:8</a>)</p></blockquote><blockquote><p>“Blessed is he who <strong>considers the poor</strong>; the LORD will deliver him in time of trouble. The LORD will preserve him and keep him alive, and he will be blessed on the earth; You will not deliver him to the will of his enemies” (<a href="https://bibleox.com/en/eng-nkjv/ps/41/#L1-2">Ps. 41:1-2</a>)</p></blockquote><blockquote><p>“He who <strong>has pity on the poor</strong> lends to the LORD, and <strong>He will pay back</strong> what he has given” (<a href="https://bibleox.com/en/eng-nkjv/pr/19/#L17">Prov. 19:17</a>)</p></blockquote><blockquote><p>“<strong>When you spread out your hands, I will hide My eyes from you; even though you make many prayers, I will not hear</strong>. Your hands are full of blood. Wash yourselves, make yourselves clean; put away the evil of your doings from before My eyes. Cease to do evil, <strong>learn to do good; seek justice, <mark>rebuke the oppressor; defend the fatherless, plead for the widow</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/1/#L15-17">Isa. 1:15-17</a>)</p></blockquote><blockquote><p>“So he said to him, ‘<strong>Your prayers and <mark>your alms</mark> have come up for a memorial before God</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L4">Act. 10:4</a>)</p></blockquote><h3>Fasting</h3><blockquote><p>“‘Now, therefore,’ says the LORD, ‘<strong>Turn to Me with all your heart, <mark>with fasting</mark></strong>, with weeping, and with mourning’” (<a href="https://bibleox.com/en/eng-nkjv/iol/2/#L12">Joel. 2:12</a>)</p></blockquote><blockquote><p>“Then I set my face toward the Lord God to make request <strong>by prayer and supplications, <mark>with fasting</mark></strong>, sackcloth, and ashes” (<a href="https://bibleox.com/en/eng-nkjv/dan/9/#L3">Dan. 9:3</a>)</p></blockquote><blockquote><p>“Then, <strong>having fasted and prayed</strong>, and laid hands on them, they sent them away” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L3">Act. 13:3</a>)</p></blockquote><blockquote><p>“My knees are weak through <strong>fasting</strong>, and my flesh is feeble from lack of fatness. &lt;...&gt; Help me, O LORD my God! Oh, save me according to Your mercy” (<a href="https://bibleox.com/en/eng-nkjv/ps/109/#L24,26">Ps. 109:24,26</a>)</p></blockquote><h3>Absence of Hypocrisy</h3><blockquote><p>“And <strong><mark>when you pray, you shall not be like the hypocrites</mark>. For they love <mark>to pray</mark> standing in the synagogues and on the corners of the streets, <mark>that they may be seen by men</mark></strong>. Assuredly, I say to you, <strong>they have their reward</strong>. But you, when you pray, go into your room, and when you have shut your door, pray to your Father who is in the secret place; and your Father who sees in secret will reward you openly” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L5-6">Matt. 6:5-6</a>)</p></blockquote><h3>No Empty Wordiness</h3><p>It has already been said above that constant prayer, persistence and patience in prayer are required (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L1-7">Luke. 18:1-7</a>). But God is not appeased by how often words are repeated. Prayer must be combined with everything listed above: faith, righteousness, deeds pleasing to God, turning away from sin, purity of heart, forgiveness of offenses, peace with one’s neighbors and so on. The pagans, however, <u>without changing themselves</u> and their lives, hoped to shout loud enough to reach their gods, who seemed to be asleep, so that supposedly one had to shout louder and more often (see <a href="https://bibleox.com/en/eng-nkjv/3ts/18/#L26-28">1 Kin. 18:26-28</a>).</p><blockquote><p>“And <strong>when you pray, do not use vain repetitions as the heathen do. For they think that they will be heard for their many words</strong>. Therefore do not be like them. For your Father knows the things you have need of before you ask Him” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L7-8">Matt. 6:7-8</a>)</p></blockquote><p>The Lord Jesus Christ Himself often prayed all night, and sometimes repeated His prayers:</p><blockquote><p>“<strong>Again</strong> He went away and prayed, <strong>and spoke the same words</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/14/#L39">Mark. 14:39</a>)</p></blockquote><h2>God Grants What Is in Accordance with His Will</h2><blockquote><p>“<strong>You ask and do not receive, because you ask amiss</strong>, that you may spend it on your pleasures” (<a href="https://bibleox.com/en/eng-nkjv/iak/4/#L3">James. 4:3</a>)</p></blockquote><blockquote><p>“Now this is the confidence that we have in Him, that <strong>if we ask anything according to His will</strong>, He hears us” (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L14">1 John. 5:14</a>)</p></blockquote><blockquote><p>“<strong>If you abide in Me, and My words abide in you</strong>, you will ask what you desire, and it shall be done for you” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L7">John. 15:7</a>)</p></blockquote><blockquote><p>“Or what man is there among you who, if his son asks for bread, will give him a stone? Or if he asks for a fish, will he give him a serpent? If you then, being evil, know how to give good gifts to your children, how much more will your Father who is in heaven <strong>give good things</strong> to those who ask Him!” (<a href="https://bibleox.com/en/eng-nkjv/mf/7/#L9-11">Matt. 7:9-11</a>)</p></blockquote><h2>Private Prayer</h2><blockquote><p>“But you, <strong>when you pray, go into your room, and when you have shut your door, pray to your Father who is in the secret place</strong>; and your Father who sees in secret will reward you openly” (<a href="https://bibleox.com/en/eng-nkjv/mf/6/#L6">Matt. 6:6</a>)</p></blockquote><h2>Common Prayer</h2><blockquote><p>“Again I say to you that if <strong>two of you agree on earth concerning anything that they ask</strong>, it will be done for them by My Father in heaven. For <strong><mark>where two or three are gathered together in My name, I am there in the midst of them</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L19-20">Matt. 18:19-20</a>)</p></blockquote><h2>Prayers for Other People</h2><h3>Prayer for One’s Neighbors and the Church</h3><blockquote><p>“Confess your trespasses to one another, and <strong>pray for one another</strong>, that you may be healed. The effective, fervent prayer of a righteous man avails much” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L16">James. 5:16</a>)</p></blockquote><blockquote><p>“meanwhile <strong>praying also for us</strong>, that God would open to us a door for the word, to speak the mystery of Christ, for which I am also in chains” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L3">Col. 4:3</a>)</p></blockquote><blockquote><p>“Brethren, <strong>pray for us</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L25">1 Thess. 5:25</a>)</p></blockquote><blockquote><p>“Finally, <strong>brethren, pray for us</strong>, that the word of the Lord may run swiftly and be glorified, just as it is with you” (<a href="https://bibleox.com/en/eng-nkjv/2sol/3/#L1">2 Thess. 3:1</a>)</p></blockquote><blockquote><p>“<strong>Pray for us</strong>; for we are confident that we have a good conscience, in all things desiring to live honorably” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L18">Heb. 13:18</a>)</p></blockquote><blockquote><p>“For we are glad when we are weak and you are strong. And this also <strong>we pray, that you may be made complete</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/13/#L9">2 Cor. 13:9</a>)</p></blockquote><blockquote><p>“Therefore <strong>we also pray always for you</strong> that our God would count you worthy of this calling, and fulfill all the good pleasure of His goodness and the work of faith with power” (<a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L11">2 Thess. 1:11</a>)</p></blockquote><blockquote><p>“<strong>you also helping together in prayer for us</strong>, that thanks may be given by many persons on our behalf for the gift granted to us through many” (<a href="https://bibleox.com/en/eng-nkjv/2kor/1/#L11">2 Cor. 1:11</a>)</p></blockquote><h3>Prayer for Those Who Wrong Us</h3><blockquote><p>“But I say to you, love your enemies, bless those who curse you, do good to those who hate you, and <strong>pray for those who spitefully use you and persecute you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L44">Matt. 5:44</a>)</p></blockquote><blockquote><p>“bless those who curse you, and <strong>pray for those who spitefully use you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/6/#L28">Luke. 6:28</a>)</p></blockquote><h3>Prayer for Those Who Sin Not Mortally</h3><blockquote><p>“<strong>If anyone sees his brother sinning a sin which does not lead to death, he will ask, and He will give him life</strong> for those who commit sin not leading to death. There is sin leading to death. I do not say that he should pray about that. All unrighteousness is sin, and there is sin not leading to death” (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L16-17">1 John. 5:16-17</a>)</p></blockquote><h3>Through the Prayer of the Church People’s Sins Are Forgiven</h3><blockquote><p>“Is anyone among you sick? <strong>Let him call for the elders of the church</strong>, and let them pray over him, anointing him with oil in the name of the Lord. And the prayer of faith will save the sick, and the Lord will raise him up. And <strong>if he has committed sins, he will be forgiven</strong>. Confess your trespasses to one another, and pray for one another, that you may be healed. The effective, fervent prayer of a righteous man avails much” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-16">James. 5:14-16</a>)</p></blockquote>

