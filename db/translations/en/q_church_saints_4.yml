    path: Ic8v_Veneration_of_Icons
    title: Veneration of Icons
    meta_desc: Bible quotes about the veneration of icons
    menu: { parent: Church/Saints, title: Veneration of Icons, priority: 8 }
    references: |-
      <ol><li><p>For example, God commanded oxen to be depicted at the temple (<a href="https://bibleox.com/en/eng-nkjv/3ts/7/#L25">1 Kin. 7:25</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L3-4">2 Chr. 4:3-4</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/4/#L15">2 Chr. 4:15</a>), but to call an ox God is already idolatry (<a href="https://bibleox.com/en/eng-nkjv/ish/32/#L4">Ex. 32:4</a>; <a href="https://bibleox.com/en/eng-nkjv/3ts/12/#L28">1 Kin. 12:28</a>; <a href="https://bibleox.com/en/eng-nkjv/2par/13/#L8">2 Chr. 13:8</a>). The ancient people considered the very statue of the calf to be a god, but God is not material, and, all the more, God is not a calf. Thus here both the image is false and its meaning. Something similar is found in another case. God commanded a bronze serpent to be made (<a href="https://bibleox.com/en/eng-nkjv/chis/21/#L8-9">Num. 21:8-9</a>), and later Christ would point out that it was an image of His sufferings on the Cross (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L14">John. 3:14</a>). Nevertheless, when the image made at God’s command was filled with false meanings and began to be venerated as Nehushtan, this too was cut off as idolatry (<a href="https://bibleox.com/en/eng-nkjv/4ts/18/#L4">2 Kin. 18:4</a>). Thus in the first case people distorted the image (God is not a calf), and in the second — the meaning (the serpent was an image of the sufferings of Christ, and not Nehushtan, invented by some of those ancient people).</p></li><li><p>That is why an epistle that is not about idols ends with a sudden warning about idols (<a href="https://bibleox.com/en/eng-nkjv/1in/5/#L21">1 John. 5:21</a>), that is, in a general sense, with a call not to follow a lie. Venerable Justin (Popović) on this: “<em>The recognition, confession and preaching of any other god besides Christ is nothing other than idolatry. Yes, idolatry is the worship of any idol instead of the worship of the One true God, the Lord Jesus Christ. Idolatry includes everything, from the crudest, most vulgar and savage superstitious cult up to the loftiest symbolism. In idolatry not only stones, trees, animals, planets and sculptures are honored as gods, but also people, and heroes, and spirits (of good and evil), and discoveries, and ideas, and passions, and cultures, and politics, and science, and philosophies, and arts, and everything that idolaters, by their own will, set against the true God and Lord Jesus Christ (that is, put in His place). That is why Saint John the Theologian, the ‘son of thunder’ of New Testament truth, ends his wonderful good news with the words: </em><strong><em>Little children, keep yourselves from idols</em></strong><em>, keep yourselves from idolatry. Amen</em>” (<a href="https://azbyka.ru/otechnik/Iustin_Popovich/tolkovanie-na-pervoe-sobornoe-poslanie-ioanna-bogoslova/"><u>Commentary on the First Catholic Epistle of the Holy Apostle John the Theologian</u></a>, in Russian; translated from the Russian).</p></li></ol>
    body: |-
      <p>Orthodox Christians are accused of idolatry: icons are called idols, and the veneration of icons is called idolatry. This article examines these accusations, going through the subject of the veneration of icons according to Holy Scripture.</p><p>First we will offer a short answer, then we will look at the criticism in a little more detail, and in conclusion we will give the most detailed answer with an examination of Scripture.</p><h2>The Shortest Defense of the Veneration of Icons</h2><p>In the times before the Incarnation of God, when establishing the law for Old Testament Israel, God did not reveal images of Himself, and He also forbade making images of false gods (idols) and venerating them (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L4-5">Ex. 20:4-5</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L8-9">Deut. 5:8-9</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/4/#L15-19">Deut. 4:15-19</a>), but God commanded His holy servants to be depicted (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1">Ex. 25:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">26:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/25/#L18-20">25:18-20</a>), and the prophets bowed down before sacred objects bearing images (<a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6">Josh. 7:6</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>). The Orthodox have exactly the same attitude toward the veneration of sacred objects with images as the prophets had.</p><p>Moreover, by God’s design the temple itself is an icon of heaven (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L8-9,40">Ex. 25:8-9,40</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24">Heb. 9:24</a>; <a href="https://bibleox.com/en/eng-nkjv/act/7/#L44">Act. 7:44</a>). God commanded the temple to be revered (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">26:2</a>); the temple was revered, and people bowed down before it (<a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5">99:5</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/132/#L7">132:7</a>). This is precisely the Orthodox veneration: in venerating the image, we venerate the prototype.</p><p>Any justification that anyone may wish to apply to the prophets’ veneration of sacred objects with images is applicable to the Orthodox veneration as well (because it is one and the same), just as any condemnation that anyone may wish to turn against the Orthodox veneration is also turned against the prophets’ veneration.</p><p>The point here is not at all images and their veneration. Since an idol is any false notion of God, the point is how 1) the image itself and 2) the meaning with which the venerator invests it relate to the truth. If at least one of the two is fundamentally false, then it will be idolatry[1], which leads a person away from the truth. This is exactly the problem: an idol does not lead to God; a false notion of God does not lead to the true God, since a lie does not lead to the truth, but away from it[2].</p><p>Let us briefly test this statement in a dialogue with an opponent of the veneration of icons:</p><p><strong>Opponent of icons</strong>: Bowing before objects is idolatry.</p><p><strong>Orthodox</strong>: So the prophets of God, bowing before the temple and the ark with images, became idolaters?</p><p><strong>Opponent</strong>: God only said to depict, but He did not say to venerate or to bow down.</p><p><strong>Orthodox</strong>: So the prophets did what they should not have done, what was not written, not commanded — that is, they fell into idolatry?</p><p><strong>Opponent</strong>: The prophets did not bow to the temple or the ark themselves, but referred this bowing to God.</p><p><strong>Orthodox</strong>: Exactly. The Orthodox also bow not to wood and paint, but to the person depicted, which is what the teaching says: through the image we venerate the prototype, just as the prophets did. There is no difference.</p><p>And so on. This rule will always work, because there is no difference between the prophets’ veneration and the Orthodox veneration. Now let us examine the question in more detail.</p><h2>Opponents of Icons Say: “The Word of God Clearly Says: Do Not Make Images, but You Make Them”</h2><p><strong>Answer</strong>: this is an Old Testament prohibition from the Law of Moses on depicting God alone, as is clear from the context:</p><ul><li><p>the first 4 commandments are specifically <strong>about God</strong> (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L4-5">Ex. 20:4-5</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L8-9">Deut. 5:8-9</a>),</p></li><li><p>when establishing the prohibition, God gives its reason: at the time the Law was given, God did not reveal precisely <strong>His own image</strong> (<a href="https://bibleox.com/en/eng-nkjv/vtor/4/#L15-19">Deut. 4:15-19</a>): since you did not see God, do not depict Him.</p></li></ul><p>Thus the prohibition concerns images of God specifically, but as for His holy servants, God not only did not forbid depicting them, He even commanded it (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1">Ex. 25:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">26:1</a>), and the righteous bowed down to the temple and to the sacred objects with these images (<a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6">Josh. 7:6</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5">99:5</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/132/#L7">132:7</a>).</p><p>The Old Testament church had icons, and they were venerated. First of all, <strong>the Old Testament temple itself is an icon</strong>. As an earthly building, by God’s original design it was to become an image of what takes place in heaven. God commanded the prophet Moses to build the temple not because He needed a temple (God did not need it: <a href="https://bibleox.com/en/eng-nkjv/is/66/#L1">Isa. 66:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/50/#L13">Ps. 50:13</a>; <a href="https://bibleox.com/en/eng-nkjv/is/1/#L11">Isa. 1:11</a>), but He commanded the temple to be made precisely as an icon of heaven, as an image of the heavenly reality shown to the prophet (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L8-9,40">Ex. 25:8-9,40</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24">Heb. 9:24</a>; <a href="https://bibleox.com/en/eng-nkjv/act/7/#L44">Act. 7:44</a>). God commands this icon to be revered (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">26:2</a>). The prophet David bows down to it (<a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5">99:5</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/132/#L7">132:7</a>). When wicked kings set up pagan idols in the temple (<a href="https://bibleox.com/en/eng-nkjv/4ts/21/#L3-7">2 Kin. 21:3-7</a>), that is, damaged the image of the heavenly reality, God rejected the temple (<a href="https://bibleox.com/en/eng-nkjv/4ts/23/#L27">2 Kin. 23:27</a>).</p><p>It is precisely because the temple is an icon of heaven that in the New Testament it undergoes changes (in its internal arrangement and images), since the heavenly reality changes too. In the Old Testament <strong>only angels</strong> dwelt in the heavenly reality in a spiritually visible way. God was completely invisible and immaterial, and people did not yet attain life in heaven (<a href="https://bibleox.com/ru/ru/w/9VFT_%D0%94%D0%BE_%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BE%D0%B9_%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B0%D0%B2%D0%B5%D0%B4%D0%BD%D0%B8%D0%BA%D0%B8_%D1%81%D1%85%D0%BE%D0%B4%D0%B8%D0%BB%D0%B8_%D0%B2_%D0%B0%D0%B4">more</a>).</p><p>In the New Testament, or rather with the coming of the Lord Jesus Christ, great changes took place:</p><ol><li><p><strong>God became visible</strong> in His humanity (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>; <a href="https://bibleox.com/en/eng-nkjv/1in/1/#L1-2">1 John. 1:1-2</a>);</p></li><li><p><strong>God took His throne in heaven visibly</strong> (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L20-21">Eph. 1:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L21">Rev. 3:21</a>);</p></li><li><p><strong>People appeared in heaven,</strong> having received the possibility of attaining life with the Lord Jesus Christ (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L1,3-5">14:1,3-5</a>);</p></li><li><p><strong>God makes the New Covenant </strong>(<a href="https://bibleox.com/en/eng-nkjv/ier/31/#L31">Jer. 31:31</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/8/#L8">Heb. 8:8</a>; <a href="https://bibleox.com/en/eng-nkjv/lk/22/#L20">Luke. 22:20</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L25">1 Cor. 11:25</a>)<strong>. The Old Covenant ended together with the Law of Moses</strong> (<a href="https://bibleox.com/en/eng-nkjv/rim/7/#L6">Rom. 7:6</a>; <a href="https://bibleox.com/en/eng-nkjv/gal/3/#L21-25">Gal. 3:21-25</a>; <a href="https://bibleox.com/en/eng-nkjv/ef/2/#L14-16">Eph. 2:14-16</a>). The prohibition on depicting God loses its force, since it was part of the Law of Moses, which was abolished with the coming of Christ (<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D1%8F-%D0%97%D0%B0%D0%BA%D0%BE%D0%BD-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F-%D0%BE%D1%82%D0%BC%D0%B5%D0%BD%D0%B0">more</a>).</p></li></ol><p>So the Old Testament temple was an image of the Old Testament heavenly reality, which changed in the New Testament. The former one no longer exists. And since the temple by God’s original design was an image of the heavenly reality, after that reality changed there is no longer any sense in depicting the old one. Therefore Christians from the most ancient times have depicted the new heavenly reality, placing at the head of everything the image of Jesus Christ (God), who has manifestly taken His throne in heaven, and around Him — the images of His holy servants: now no longer only angels, but also people.</p><p>A symbolic event is the damage to the temple in Jerusalem after the sacrifice of Christ:</p><blockquote><p>“Then, behold, <strong>the veil of the temple was torn in two from top to bottom; and the earth quaked, and the rocks were split</strong>, and the graves were opened; and <strong>many bodies of the saints who had fallen asleep were raised; and coming out of the graves after His resurrection</strong>, they went into the holy city and appeared to many” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L51-53">Matt. 27:51-53</a>)</p></blockquote><p>And in the 70s the temple was destroyed altogether by the Romans, giving way for all the following millennia to a new image of the heavenly reality — the Orthodox church.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">larger</a>]</p><p>More ancient icons here: <a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B">https://bibleox.com/ru/ru/w/древние-иконы</a></p><p>Not only the Old Testament image of the heavenly reality became obsolete, but also the Old Covenant itself, an integral part of which was the Law of Moses, which has now lost its significance. Besides the prohibition on depicting God, there are many other provisions that no longer apply in the New Testament:</p><blockquote><p>“And <strong>whoever blasphemes the name of the LORD shall surely be put to death</strong>. All the congregation shall certainly stone him, the stranger as well as him who is born in the land. When he blasphemes the name of the LORD, <strong>he shall be put to death</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/24/#L16">Lev. 24:16</a>)</p></blockquote><p>Blasphemy against the name of God is a sin against the <strong>3rd commandment</strong>. The punishment under the Law of Moses is death (<a href="https://bibleox.com/en/eng-nkjv/lev/24/#L16">Lev. 24:16</a>). As far as is known, opponents of icons do not teach that people should be killed for blasphemy against God. They demand that the Old Testament prohibition on depicting God be kept, showing the quote with the words “this is the word of God”, but the commandment to put blasphemers to death is also the word of God, it is also written clearly, yet they do not do it. Why? Because the Law of Moses has been abolished.</p><p>The <strong>4th commandment</strong> establishes the Sabbath rest — abstaining from work (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L8-10">Ex. 20:8-10</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L12-15">Deut. 5:12-15</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L3">Lev. 19:3</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>). The punishment under the Law of Moses is death. This too is the word of God, it is also written clearly, but opponents of icons do not teach that people should be killed for breaking the Sabbath rest, and most of them do not even keep the Sabbath rest itself. Why? Because the Law of Moses has been abolished.</p><p>Thus, to forbid depicting God incarnate means:</p><ol><li><p><strong>to Judaize</strong>: to continue living according to the Law of Moses (incidentally, it is for the same reason that some collect the <a href="https://bibleox.com/ru/ru/w/ozcY_%D0%9E_%D0%B4%D0%B5%D1%81%D1%8F%D1%82%D0%B8%D0%BD%D0%B5">tithe</a>);</p></li><li><p><strong>to indirectly deny the Incarnation of God</strong>: either to deny that Christ is God, or to deny that He is visible.</p></li></ol><p>Now let us examine the question in even more detail.</p><h2>The 2nd Commandment of the Law of Moses</h2><p>Opponents of icons consider icons a violation of the second commandment of the <a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9">Law of Moses</a>:</p><blockquote><ol start="2"><li><p>“<strong>You shall not make for yourself a carved image — any likeness</strong> of anything that is in heaven above, or that is in the earth beneath, or that is in the water under the earth; <strong>you shall not bow down to them</strong> nor serve them” (<a href="https://bibleox.com/en/eng-nkjv/ish/20/#L4-5">Ex. 20:4-5</a>; <a href="https://bibleox.com/en/eng-nkjv/vtor/5/#L8-9">Deut. 5:8-9</a>);</p></li></ol></blockquote><p>The 10 commandments of Moses are divided into 2 parts (two tablets):</p><ul><li><p>Four commandments about love for God;</p></li><li><p>Six commandments about love for one’s neighbor.</p></li></ul><p>The 2nd commandment belongs to the expression of love for God and does not forbid any images and bows whatsoever, but forbids the making of objects to be venerated as gods instead of the only true God. In other words, <strong>this</strong> <strong>commandment forbids the worship of <u>false</u> <u>gods</u></strong>. That is precisely why we see in the Bible both images and bows that do not contradict this commandment. More on this below.</p><h3>“Do Not Make an Image”</h3><h4>God Commands Images to Be Made in His Temple</h4><p>Although images are forbidden by the 2nd commandment, the same God who gave this commandment now commands images of cherubim to be made in His temple (the Tabernacle) on the curtains of the Tabernacle, on the veil leading into the Holy of Holies, and golden sculptures of cherubim to be made on the cover of the Ark of the Covenant:</p><blockquote><p>“Then <strong>the LORD spoke</strong> to Moses, saying: &lt;…&gt; <strong>Moreover you shall make the tabernacle with <mark>ten curtains</mark></strong> of fine woven linen and blue, purple, and scarlet thread; <strong>with artistic designs of cherubim you shall weave them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1">Ex. 25:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">26:1</a>)</p></blockquote><blockquote><p>“<strong>You shall make <mark>a veil</mark></strong> woven of blue, purple, and scarlet thread, and fine woven linen. <strong>It shall be woven with an artistic design of cherubim</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/26/#L31">Ex. 26:31</a>)</p></blockquote><blockquote><p>“And <strong>you shall make two cherubim of gold</strong>; of hammered work you shall make them <strong>at the two <mark>ends of the mercy seat</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L18">Ex. 25:18</a>)</p></blockquote><p>In the later temple, which Solomon built, there were even more different images and sculptures:</p><blockquote><p>“And he made <strong><mark>the veil</mark></strong> of blue, purple, crimson, and fine linen, and <strong>wove cherubim into it</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L14">2 Chr. 3:14</a>)</p></blockquote><blockquote><p>“<strong><mark>In the Most Holy Place</mark></strong> he made <strong>two cherubim</strong>, fashioned by carving, and overlaid them with gold” (<a href="https://bibleox.com/en/eng-nkjv/2par/3/#L10">2 Chr. 3:10</a>)</p></blockquote><blockquote><p>“<strong>Inside <mark>the inner sanctuary</mark></strong> he made <strong>two cherubim</strong> of olive wood, each ten cubits high” (<a href="https://bibleox.com/en/eng-nkjv/3ts/6/#L23">1 Kin. 6:23</a>)</p></blockquote><p>The detailed arrangement of the temple: <a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">https://bibleox.com/ru/ru/w/иерусалимский-храм</a> (in Russian)</p><p>To make the temple objects, God gave the craftsmen the gift of the Holy Spirit:</p><blockquote><p>“Then the LORD spoke to Moses, saying: ‘See, I have called by name Bezalel the son of Uri, the son of Hur, of the tribe of Judah. And <strong>I have filled him with the Spirit of God, in wisdom, in understanding, in knowledge, and in all manner of workmanship</strong>, to design artistic works, to work in gold, in silver, in bronze, in cutting jewels for setting, in carving wood, and to work in all manner of workmanship’” (<a href="https://bibleox.com/en/eng-nkjv/ish/31/#L1-5">Ex. 31:1-5</a>)</p></blockquote><h4>God Commanded an Image of a Serpent to Be Made</h4><p>God also commands a bronze serpent to be made, so that people looking at it would be miraculously saved from snakebites:</p><blockquote><p>“Then the LORD said to Moses, ‘<strong>Make a fiery serpent</strong>, and set it on a pole; and it shall be that everyone who is bitten, when he looks at it, shall live’” (<a href="https://bibleox.com/en/eng-nkjv/chis/21/#L8">Num. 21:8</a>)</p></blockquote><p>It is very important that this serpent was an image of Jesus Christ and was to point to His future sufferings on the Cross:</p><blockquote><p>“And <strong>as Moses lifted up the serpent in the wilderness, even so must the Son of Man be lifted up</strong>, that whoever believes in Him should not perish but have eternal life” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L14-15">John. 3:14-15</a>)</p></blockquote><p>This serpent was later destroyed by King Hezekiah, when the Israelites began to consider the serpent itself a god, giving it its own false name (Nehushtan), which had nothing to do with the true God. They forsook the true God, breaking the second commandment:</p><blockquote><p>“and broke in pieces the bronze serpent that Moses had made; for until those days the children of Israel <strong>burned incense to it, and called it <mark>Nehushtan</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/4ts/18/#L4">2 Kin. 18:4</a>)</p></blockquote><h3>Do Not Bow Down to Images</h3><p>Although bowing down to images is forbidden, the righteous constantly bow to people, to various objects, to angels; other people bow to prophets. No one condemns them for idolatry, because these bows are not made to false gods (idols).</p><h4>Bowing to God in the Form of Angels</h4><p>Abraham bows to God in the form of three men:</p><blockquote><p><em>“Then </em><strong><em>the LORD appeared to him [IN THE FORM OF AN IMAGE]</em></strong><em> (Greek: θεὸς — God; Hebrew: יְהוָ֔ה — Yahweh) by the terebinth trees of Mamre, as he was sitting in the tent door in the heat of the day. So he lifted his eyes and looked, and behold, </em><strong><em>three men</em></strong><em> were standing by him; and when he saw them, he ran from the tent door to meet them, and </em><strong><em>bowed himself to the ground</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/18/#L1-2"><em>Gen. 18:1-2</em></a><em>)</em></p></blockquote><p>Why did God appear in the form of an image? Because God is invisible by nature; no one has ever seen Him (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L16">1 Tim. 6:16</a>; <a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>).</p><h4>Bowing to an Angel</h4><p>It should be noted first that angels are spirits (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L13-14">Heb. 1:13-14</a>), and spirits do not have flesh and bones (<a href="https://bibleox.com/en/eng-nkjv/lk/24/#L39">Luke. 24:39</a>), that is, angels too appear to people in the form of people. Accordingly, if someone bows to an angel, he <strong>bows to the visible image of an invisible spirit</strong> (an angel):</p><blockquote><p><em>“So He said, ‘No, but as Commander of the army of the LORD I have now come.’ And Joshua fell on his face to the earth and </em><strong><em>worshiped</em></strong><em>, and said to Him, ‘What does my Lord say to His servant?’” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/5/#L14"><em>Josh. 5:14</em></a><em>)</em></p></blockquote><h4>Bowing to a Prophet</h4><blockquote><p><em>“Now when the sons of the prophets who were from Jericho saw him, they said, ‘The spirit of Elijah rests on Elisha.’ And they came to meet him, and </em><strong><em>bowed to the ground before him</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/4ts/2/#L15"><em>2 Kin. 2:15</em></a><em>)</em></p></blockquote><h4>Bowing to the Temple</h4><p>David bowed to the temple, which in itself was an icon of heaven (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">26:2</a>), and was filled with images of the holy angels (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1">Ex. 25:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">26:1</a>):</p><blockquote><p>“But as for me, I will come into Your house in the multitude of Your mercy; in fear of You <strong>I will worship toward Your holy temple</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>) <em>(Greek: προσκυνήσω πρὸς ναὸν ἅγιόν σου — “I will bow down toward Your holy temple”)</em></p></blockquote><p>And God commanded the temple to be revered (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev. 19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">26:2</a>).</p><h4>Bowing to God’s Footstool (the Temple)</h4><blockquote><p>“Exalt the LORD our God, and <strong>worship at His footstool</strong> (pedestal, a stand for the feet, that is, the temple — note) <strong>— He is holy</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5">Ps. 99:5</a>) <em>(Greek: προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ — “bow down to the footstool of His feet”)</em></p></blockquote><blockquote><p>“Let us go into <strong>His tabernacle; let us worship at His footstool</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/132/#L7">Ps. 132:7</a>)</p></blockquote><h4>Bowing Before the Ark</h4><p>Joshua the son of Nun bowed before the Ark of the Covenant, on which there were sculptures of the holy cherubim:</p><blockquote><p><em>“Then Joshua tore his clothes, and </em><strong><em>fell to the earth on his face before the ark of the LORD</em></strong><em> until evening, he and the elders of Israel; and they put dust on their heads” (</em><a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6"><em>Josh. 7:6</em></a><em>)</em></p></blockquote><h4>Bowing to a Staff</h4><blockquote><p><em>To a staff: “Then he said, ‘Swear to me.’ And he swore to him. So </em><strong><em>Israel bowed himself on the head of the bed</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/47/#L31"><em>Gen. 47:31</em></a><em>). In the LXX translation — </em><strong><em>to the staff</em></strong><em> (Greek: προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ — “Israel bowed down upon the top of his staff”; also </em><a href="https://bibleox.com/en/eng-nkjv/evr/11/#L21"><em>Heb. 11:21</em></a><em>)</em></p></blockquote><p>More examples: <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D0%BA%D0%BB%D0%BE%D0%BD%D1%8B">https://bibleox.com/ru/ru/w/поклоны</a> (in Russian)</p><h3>Pagan Faith in an Idol Breaks the 2nd Commandment</h3><p>Pagan faith in an idol leads to the breaking of the 2nd commandment, since <u>in any case</u> it requires the worship of a <u>false</u> <u>god</u> who does not exist. Moloch, Baal, Zeus, Jupiter and Perun do not exist — they are false gods.</p><p>Pagan faith in an idol is of three kinds, beginning with the most widespread:</p><ol><li><p><strong>The idol is the god itself</strong>. The object made by the pagan (the idol) is itself the deity.</p></li><li><p><strong>The idol is an image of a false deity</strong>, as if located far away, but which supposedly ought to look like this.</p></li><li><p><strong>The idol is</strong> <strong>an invented image</strong> <strong>of a natural element </strong>(deified): the sea, the wind, rain, fire, the earth.</p></li></ol><p>In all three cases a <u>false</u> <u>god</u> who <u>does not exist</u> is venerated. This is faith in a lie.</p><p>It is the first kind that we meet in the Bible. The most widespread pagan faith, a description of which can be found on the pages of the Bible, is <u>the deification of the object itself</u> (matter). A pagan could make himself a god from material at hand, or deify an already existing natural object or phenomenon: animals, a tree, a stone, mountains, the Sun, stars, the wind, the sea, a thunderstorm and other matter. The prophets denounce idolatry, saying that from one part of a tree the pagan prepared his food, and the other part of the same tree he called his god:</p><blockquote><p><em>“He cuts down </em><strong><em>cedars for himself, and takes the cypress and the oak</em></strong><em>; he secures it for himself among the trees of the forest. He plants a pine, and the rain nourishes it. </em><strong><em>Then it shall be for a man to burn, for he will take some of it and warm himself; yes, he kindles it and bakes bread; indeed <mark>he makes a god</mark> and worships it; he makes it a carved image, and falls down to it</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/is/44/#L14-15"><em>Isa. 44:14-15</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now Laban had gone to shear his sheep, and </em><strong><em>Rachel had stolen the household idols</em></strong><em> that were her father’s. &lt;…&gt; And now you have surely gone because you greatly long for your father’s house, but </em><strong><em>why did <mark>you steal my gods</mark>?</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/31/#L19,30"><em>Gen. 31:19,30</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>calls upon a piece of wood &lt;…&gt; <mark>carved images were worshiped</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/en-nrsv/prs/14/#L1,16"><em>Wis. 14:1,16</em></a><em>)</em></p></blockquote><blockquote><p><em>“The king said: </em><strong><em>‘Do you not think that <mark>Bel is a living god? Do you not see how much he eats</mark> and drinks every day?’</em></strong><em>” (</em><a href="https://bibleox.com/en/ru/dan/14/#L6"><em>Bel and the Dragon (Dan. 14:6)</em></a><em>; translated from the Russian Synodal)</em></p></blockquote><blockquote><p><em>“Of what use to an idol is a sacrifice? </em><strong><em><mark>For it can neither eat nor smell</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/en-nrsv/prsir/30/#L19"><em>Sir. 30:19</em></a><em>)</em></p></blockquote><blockquote><p><em>“this Paul has persuaded and turned away many people, saying that </em><strong><em><mark>they are not gods which are made with hands</mark></em></strong><em>. So </em><strong><em>not only is this trade of ours in danger(!)</em></strong><em> of falling into disrepute” (</em><a href="https://bibleox.com/en/eng-nkjv/act/19/#L24-27"><em>Act. 19:24-27</em></a><em>)</em></p></blockquote><p>Other similar passages from the Bible: <a href="https://bibleox.com/ru/ru/w/%D1%8F%D0%B7%D1%8B%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F-%D0%B2%D0%B5%D1%80%D0%B0-%D0%B2-%D0%B8%D0%B4%D0%BE%D0%BB%D0%B0">https://bibleox.com/ru/ru/w/языческая-вера-в-идола</a> (in Russian)</p><p>Ancient philosophers, as thinking people, in defending their pagan faith came to realize that material worked by human hands cannot be a god. They could express other judgments, saying that it is only an image of a god or an invented image of an element. But the 2nd commandment is still broken, because they worship a <strong>false god</strong>, and not the true God.</p><p>A pagan god becomes false not only because of its name or image. The lie about god shows itself also in the number of gods, in their abilities, their essential properties, and most importantly — in God’s will for His creation, which is revealed in the commandments.</p><p>For clarity, let us compare point by point.</p><h4>Pagan Gods</h4><ul><li><p>a false name (Moloch, Baal, Zeus, Perun, etc.),</p></li><li><p>a false appearance (various human-like images),</p></li><li><p>false abilities (limited; many pagan gods have different abilities),</p></li><li><p>a false will (not the one the true God expressed in the commandments),</p></li><li><p>false essential properties (not eternity, not omnipresence, not omniscience, not boundlessness, not immortality, not holiness),</p></li><li><p>he calls to another place (a false one) and by another path (a false one).</p></li></ul><h4>The God in Whom the Orthodox Church Believes</h4><ul><li><p>the name of the true God from Holy Scripture (He Who Is, the Father, the Son, the Holy Spirit, Jesus Christ and <a href="https://bibleox.com/ru/ru/w/%D0%91%D0%BE%D0%B3-%D0%B8%D0%BC%D0%B5%D0%BD%D0%B0">others</a>);</p></li><li><p>images through which He Himself revealed Himself to the world (the three angels with Abraham — <a href="https://bibleox.com/en/eng-nkjv/gen/18/#L1-2"><em>Gen. 18:1-2</em></a>, the dove — <a href="https://bibleox.com/en/eng-nkjv/lk/3/#L22"><em>Luke. 3:22</em></a>, and finally, in the form of a man, which the Son of God truly became — Jesus Christ);</p></li><li><p>it depicts the almighty Creator of the universe;</p></li><li><p>who calls to the fulfillment of the divine commandments (Christ is depicted with an open book in which His commandments are written);</p></li><li><p>it depicts God calling to life with Him through the way of the Cross (Christ is depicted on the Cross with a cruciform halo).</p></li></ul><p>Thus the pagan considers the image to be a god, or an image of a (false) god, while the Orthodox Church depicts the true God, not considering the object itself (the icon) to be a god.</p><p>The Orthodox Church also depicts the friends of God: the Virgin Mary, the Theotokos, the angels, the apostles, the righteous. This is not a lie. They all really exist. And neither these holy people and angels themselves, nor their images, are considered gods.</p><p>All icons in the Orthodox Church are venerated on a par with the Gospel and the Cross as sacred objects. Their veneration refers to the true God and to His truly existing friends.</p><h3>The Reason for the 2nd Commandment</h3><p>So God not only did not forbid making images of the saints, but even commanded them to be made (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1">Ex. 25:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">26:1</a>), but He did forbid, by the second commandment, making images of Himself. He explains the reason for the prohibition: when God gave the law, He did not reveal any image of <strong>Himself</strong>, so that the Israelites would not try to depict <strong>Him</strong> and then begin to serve the images and sculptures (statues) themselves as gods, instead of the only true God:</p><blockquote><p>“Take careful heed to yourselves, for <strong><mark>you saw no form</mark> when the LORD spoke to you</strong> at Horeb out of the midst of the fire, <strong><mark>lest you act corruptly and make for yourselves a carved image</mark></strong> in the form of any figure: the likeness of male or female, the likeness of any animal that is on the earth or the likeness of any winged bird that flies in the air, the likeness of anything that creeps on the ground or the likeness of any fish that is in the water beneath the earth. And take heed, <strong><mark>lest</mark></strong> you lift your eyes to heaven, and when you see the sun, the moon, and the stars, all the host of heaven, <strong><mark>you feel driven to worship them and serve them</mark></strong>, which the LORD your God has given to all the peoples under the whole heaven as a heritage” (<a href="https://bibleox.com/en/eng-nkjv/vtor/4/#L15-19">Deut. 4:15-19</a>)</p></blockquote><p>This warning was very well founded, because at that time the whole planet Earth was pagan and worshiped such idols. Today one even has to explain that the pagan literally considered a product he had made with his own hands to be a god.</p><h2>With the Coming of Christ, Changes Take Place</h2><h3>1. The Old Covenant and the Law of Moses Come to an End</h3><blockquote><p>“But now we have been delivered from the law, <strong>having died to what we were held by</strong>, so that we should serve in the newness of the Spirit and not in the oldness of the letter” (<a href="https://bibleox.com/en/eng-nkjv/rim/7/#L6">Rom. 7:6</a>)</p></blockquote><blockquote><p>“Therefore <strong>the law was our tutor to bring us to Christ</strong>, that we might be justified by faith. But after faith has come, <strong>we are no longer under a tutor</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/3/#L24-25">Gal. 3:24-25</a>)</p></blockquote><blockquote><p>“For He Himself is our peace, who has made both one, and has broken down the middle wall of separation, <strong>having abolished</strong> in His flesh the enmity, that is, <strong>the law of commandments contained in ordinances</strong>, so as to create in Himself one new man from the two, thus making peace” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L14-15">Eph. 2:14-15</a>)</p></blockquote><p><strong>Christ makes the New Covenant, thereby bringing to an end the Old Covenant with the Law of Moses</strong> (<a href="https://bibleox.com/en/eng-nkjv/rim/7/#L6">Rom. 7:6</a>; <a href="https://bibleox.com/en/eng-nkjv/gal/3/#L21-25">Gal. 3:21-25</a>; <a href="https://bibleox.com/en/eng-nkjv/ef/2/#L14-16">Eph. 2:14-16</a>). The prohibition on depicting God was part of the Law of Moses, which was abolished with the coming of Christ (<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D1%8F-%D0%97%D0%B0%D0%BA%D0%BE%D0%BD-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F-%D0%BE%D1%82%D0%BC%D0%B5%D0%BD%D0%B0">more</a>). The commandments given by God through Moses lose their literal meaning: we do not keep the Sabbath rest (and do not kill those who break the Sabbath rest), we do not sacrifice animals, we are not circumcised, we do not celebrate the Jewish feasts, we do not give the tithe, and very many other commands of the Law of Moses we do not fulfill. The Old Covenant and the Law of Moses have been abolished as such, and New Testament believers are called to be ministers of the spirit, not of the letter (<a href="https://bibleox.com/en/eng-nkjv/2kor/3/#L6">2 Cor. 3:6</a>), that is, to understand the reasons for this or that divine institution, to penetrate into their meaning and to keep the essence of the commandment.</p><p>The literal meaning of the 2nd commandment forbade depicting only God, but not His holy servants (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1">Ex. 25:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">26:1</a>).</p><p>The essence of the 2nd commandment is <strong>not to worship <u>false</u> <u>gods</u></strong>.</p><p>Accordingly, the Orthodox Church depicts the saints because this was never forbidden, but was even commanded (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L1">Ex. 25:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ish/26/#L1">26:1</a>), and the righteous bowed before those images (<a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6">Josh. 7:6</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>). The depiction of God, on the other hand, was forbidden only in the Old Testament by the Law of Moses, because no one had seen God. And since the Law of Moses has been abolished, the prohibition on depicting God, as part of the Law of Moses, has also been abolished.</p><h3>2. God Became Visible, Having Taken Human Nature (Having Become Incarnate)</h3><p>In the Old Testament God forbids depicting Him, explaining that when the people received the Law, God did not reveal His image to them (<a href="https://bibleox.com/en/eng-nkjv/vtor/4/#L15-19">Deut. 4:15-19</a>). However, in making the New Covenant and giving a new teaching (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L15">Eph. 2:15</a>), God revealed Himself, becoming visible in His human nature and abolishing the Law of Moses, and therefore now not only the saints can be depicted, but also God Himself in the form in which He revealed Himself:</p><blockquote><p>“<strong><em>No one has seen God at any time</em></strong><em>. The only begotten </em><strong><em>Son</em></strong><em>, who is in the bosom of the Father, He has </em><strong><em>declared</em></strong><em> Him</em>” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>)</p></blockquote><blockquote><p>“<em>That which was from the beginning, which we have heard, </em><strong><em>which we have seen with our eyes, which we have looked upon</em></strong><em>, and our hands have handled, </em><strong><em>concerning the Word of life</em></strong><em> — the life was manifested, and we have seen, and bear witness, and declare to you that eternal life </em><strong><em>which was with the Father and was manifested to us</em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1in/1/#L1-2">1 John. 1:1-2</a>)</p></blockquote><h3>3. The Heavenly Reality Changes</h3><p>The temple, as an earthly building, was by God’s design from the beginning an image of the heavenly reality: God commanded the prophet Moses to build the temple not because God needed a temple (He did not need it: <a href="https://bibleox.com/en/eng-nkjv/is/66/#L1">Isa. 66:1</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/50/#L13">Ps. 50:13</a>; <a href="https://bibleox.com/en/eng-nkjv/is/1/#L11">Isa. 1:11</a>), but He commanded the temple to be made precisely as an icon of heaven, as an image of the heavenly reality shown to the prophet (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L8-9,40">Ex. 25:8-9,40</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24">Heb. 9:24</a>). In the Old Testament there was one heavenly reality, and in the New — another. Formerly <strong>only angels</strong> dwelt in the heavenly reality in a spiritually visible way, since God is completely immaterial and invisible (the Son of God had not yet taken on visible human nature), while people did not yet attain life in heaven, but after death went down to Hades (<a href="https://bibleox.com/ru/ru/w/9VFT_%D0%94%D0%BE_%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BE%D0%B9_%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B0%D0%B2%D0%B5%D0%B4%D0%BD%D0%B8%D0%BA%D0%B8_%D1%81%D1%85%D0%BE%D0%B4%D0%B8%D0%BB%D0%B8_%D0%B2_%D0%B0%D0%B4">more</a>).</p><p>However, after the coming of Christ changes take place:</p><ol><li><p><strong>Christ God took His throne in heaven visibly</strong> (<a href="https://bibleox.com/en/eng-nkjv/ef/1/#L20-21">Eph. 1:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L21">Rev. 3:21</a>);</p></li><li><p><strong>People appeared in heaven </strong>(besides Christ Himself), having gained access to life with Christ in heaven (<a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev. 6:9-11</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L1,3-5">Rev. 14:1,3-5</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/12/#L22-24">Heb. 12:22-24</a>);</p></li></ol><p>The heavenly reality has changed. The former one no longer exists. The temple in Jerusalem became an image of the past, not the present, heavenly reality. Therefore Christians from the most ancient times have depicted the new heavenly reality, placing at the head of everything the image of Jesus Christ (God), who has manifestly taken His throne in heaven, and around Him — His holy servants, now including people.</p><p>A symbolic event is the damage to the temple in Jerusalem after the sacrifice of Christ:</p><blockquote><p>“Then, behold, <strong>the veil of the temple was torn in two from top to bottom; and the earth quaked, and the rocks were split</strong>, and the graves were opened; and <strong>many bodies of the saints who had fallen asleep were raised; and coming out of the graves after His resurrection</strong>, they went into the holy city and appeared to many” (<a href="https://bibleox.com/en/eng-nkjv/mf/27/#L51-53">Matt. 27:51-53</a>)</p></blockquote><p>And in the 70s the temple was destroyed altogether by the Romans, giving way for all the following millennia to a new image of the heavenly reality — the Orthodox church.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">larger</a>]</p><p>More ancient icons here: <a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B">https://bibleox.com/ru/ru/w/древние-иконы</a></p><h2>God Made His Own Icons</h2><p>No one has ever seen God:</p><blockquote><p>“<strong><mark>No one has seen God at any time</mark></strong>. The only begotten Son, who is in the bosom of the Father, He has declared Him” (<a href="https://bibleox.com/en/eng-nkjv/in/1/#L18">John. 1:18</a>)</p></blockquote><p>And yet God appeared many times in the form of an image (an icon):</p><h3>God Appeared to Abraham in the Form of Three Angels</h3><p>The three angels are not God as He really is, not what He is even before the creation of the world. That is, this is an <strong>image</strong> (in Greek — εἰκόνα [icon]) of God, and Abraham bows before an icon of God:</p><blockquote><p>“Then <strong>the LORD appeared to him [IN THE FORM OF AN IMAGE]</strong> (Greek: θεὸς — God; Hebrew: יְהוָ֔ה — Yahweh) by the terebinth trees of Mamre, as he was sitting in the tent door in the heat of the day. So he lifted his eyes and looked, and behold, <strong>three men</strong> were standing by him; and when he saw them, he ran from the tent door to meet them, and <strong>bowed himself to the ground</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/18/#L1-2">Gen. 18:1-2</a>)</p></blockquote><p>When Abraham bowed to the image of God in the form of three angels, did he serve God or images of God? Obviously, God.</p><h3>God Visibly Wrestled with Jacob</h3><blockquote><p>“Then Jacob was left alone; and a Man wrestled with him until the breaking of day. &lt;...&gt; And He said, ‘Your name shall no longer be called Jacob, but Israel; for <strong>you have struggled with God</strong> and with men, and have prevailed.’ &lt;...&gt; So Jacob called the name of the place Peniel: ‘For <strong>I have seen God face to face, and my life is preserved</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/gen/32/#L24,28,30">Gen. 32:24,28,30</a>)</p></blockquote><h3>God Spoke with the Prophet Moses Through an Image</h3><blockquote><p>“Then He said, ‘Hear now My words: <strong>If there is a prophet among you, I, the LORD, make Myself known to him in a vision</strong>; I speak to him in a dream. <strong>Not so with My servant Moses</strong>; he is faithful in all My house. <strong>I speak with him face to face, even plainly, and not in dark sayings; and he sees the form of the LORD</strong>. Why then were you not afraid to speak against My servant Moses?’” (<a href="https://bibleox.com/en/eng-nkjv/chis/12/#L6-8">Num. 12:6-8</a>)</p></blockquote><h3>God Descended Like a Dove upon Jesus Christ</h3><blockquote><p>“And <strong>the Holy Spirit descended in bodily form like a dove upon Him</strong>, and a voice came from heaven which said, ‘You are My beloved Son; in You I am well pleased’” (<a href="https://bibleox.com/en/eng-nkjv/lk/3/#L22">Luke. 3:22</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/3/#L16">Matt. 3:16</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/1/#L10">Mark. 1:10</a>; <a href="https://bibleox.com/en/eng-nkjv/in/1/#L32">John. 1:32</a>)</p></blockquote><h3>Man Is an Icon of God</h3><blockquote><p>“So <strong>God created man in His own image (εἰκόνα — icon — image); in the image of God</strong> He created him; male and female He created them” (<a href="https://bibleox.com/en/eng-nkjv/gen/1/#L27">Gen. 1:27</a>)</p></blockquote><blockquote><p>“This is the book of the genealogy of Adam. In the day that God created man, <strong>He made him in the likeness (εἰκόνα — icon) of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/5/#L1">Gen. 5:1</a>)</p></blockquote><blockquote><p>“Whoever sheds man’s blood, by man his blood shall be shed; for <strong>in the image (εἰκόνι — icon) of God He made man</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gen/9/#L6">Gen. 9:6</a>)</p></blockquote><blockquote><p>“for God created us for incorruption, and <strong>made us in the image (εἰκόνα) of his own eternity</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/2/#L23">Wis. 2:23</a>)</p></blockquote><h2>Jesus Christ Is the Image (Icon) of God the Father</h2><blockquote><p>“Let this mind be in you which was also in <strong>Christ Jesus, who, being in the form of God</strong>, did not consider it robbery to be equal with God” (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L5-6">Phil. 2:5-6</a>)</p></blockquote><blockquote><p>“who being <strong>the brightness of His glory and the express image of His person</strong>, and upholding all things by the word of His power, when He had by Himself purged our sins, sat down at the right hand of the Majesty on high” (<a href="https://bibleox.com/en/eng-nkjv/evr/1/#L3">Heb. 1:3</a>)</p></blockquote><blockquote><p>“whose minds the god of this age has blinded, who do not believe, lest the light of the gospel of the glory of <strong>Christ, who is the image (εἰκὼν) of God</strong>, should shine on them” (<a href="https://bibleox.com/en/eng-nkjv/2kor/4/#L4">2 Cor. 4:4</a>)</p></blockquote><blockquote><p>“giving thanks to the Father &lt;...&gt; and conveyed us into the kingdom of <strong>the Son of His love</strong>, &lt;...&gt; <strong>He is the image (εἰκὼν) of the invisible God</strong>, the firstborn over all creation” (<a href="https://bibleox.com/en/eng-nkjv/kol/1/#L12-15">Col. 1:12-15</a>)</p></blockquote><blockquote><p>“Philip said to Him, ‘Lord, <strong>show us the Father</strong>, and it is sufficient for us.’ Jesus said to him, ‘Have I been with you so long, and yet you have not known Me, Philip? <strong>He who has seen Me has seen the Father</strong>; so how can you say, “Show us the Father”?’” (<a href="https://bibleox.com/en/eng-nkjv/in/14/#L8-9">John. 14:8-9</a>)</p></blockquote><h3>Whoever Does Not Honor the Image of the Father Does Not Honor the Father</h3><blockquote><p>“<strong>He who does not honor the Son does not honor the Father</strong> who sent Him” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L23">John. 5:23</a>)</p></blockquote><h3>Whoever Rejects the Image of the Father Does Not Have the Father</h3><blockquote><p>“<strong>Whoever denies the Son does not have the Father either</strong>; he who acknowledges the Son has the Father also” (<a href="https://bibleox.com/en/eng-nkjv/1in/2/#L23">1 John. 2:23</a>)</p></blockquote><h3>Whoever Hates the Image of the Father Hates the Father</h3><blockquote><p>“<strong>He who hates Me hates My Father also</strong>. &lt;…&gt; but now they have seen and also <strong>hated both Me and My Father</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/15/#L23-24">John. 15:23-24</a>)</p></blockquote><h3>All Creation Must Bow Before the Image of the Father</h3><blockquote><p>“that <strong>at the name of Jesus every knee should bow, of those in heaven, and of those on earth, and of those under the earth</strong>” (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L10">Phil. 2:10</a>)</p></blockquote><h2>God Heals Through the Image of the Saints</h2><p>God grants people healing not only through the clothing left by the holy apostles (<a href="https://bibleox.com/en/eng-nkjv/act/19/#L12">Act. 19:12</a>),<em> but</em> even through the image of an apostle (his shadow):</p><blockquote><p>“so that <strong>they brought the sick out</strong> into the streets and laid them on beds and couches, <strong>that at least the shadow of Peter passing by might fall on some of them</strong>. Also a multitude gathered from the surrounding cities to Jerusalem, bringing sick people and those who were tormented by unclean spirits, and <strong>they were all healed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15-16">Act. 5:15-16</a>)</p></blockquote><h2>God Does Not Give an Answer to Idolaters</h2><blockquote><p><em>“that I may seize the house of Israel by their heart, because </em><strong><em>they are all estranged from Me by their idols</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/iez/14/#L5"><em>Ezek. 14:5</em></a><em>)</em></p></blockquote><blockquote><p><em>“For when you offer your gifts and make your sons pass through the fire, </em><strong><em>you defile yourselves with all your idols</em></strong><em>, even to this day. So shall I be inquired of by you, O house of Israel? As I live,” says the Lord GOD, “</em><strong><em>I will not be inquired of by you</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/iez/20/#L31"><em>Ezek. 20:31</em></a><em>)</em></p></blockquote><p>However, opponents of icons usually admit that Orthodox venerators of icons can have communion with God. But it is written in Scripture that God does not answer idolaters.</p><h2>Can an Icon Save</h2><p>The Orthodox are accused because someone may use expressions such as “the icon saved” or “the icon healed”. It is God who saves and heals, and although we do not usually use expressions like “the icon saved”, they are permissible if what is meant is that not the material of the icon itself, but God through the material, healed and saved.</p><h3>An Apostle Saves</h3><blockquote><p>“if by any means I may provoke to jealousy those who are my flesh and <strong>save some of them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/11/#L14">Rom. 11:14</a>)</p></blockquote><blockquote><p>“<strong>I have become all things to all men, that I might by all means save</strong> some” (<a href="https://bibleox.com/en/eng-nkjv/1kor/9/#L22">1 Cor. 9:22</a>)</p></blockquote><h3>A Wife Saves</h3><blockquote><p>“For how do you know, <strong>O wife, whether you will save your husband?</strong> Or how do you know, <strong>O husband, whether you will save your wife?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/7/#L16">1 Cor. 7:16</a>)</p></blockquote><h3>The Apostolic Call to Save People</h3><blockquote><p>“And on some have compassion, making a distinction; but others <strong>save</strong> with fear, pulling them out of the fire, hating even the garment defiled by the flesh” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L22-23">Jude. 1:22-23</a>)</p></blockquote><blockquote><p>“Take heed to yourself and to the doctrine. Continue in them, for in doing this you will <strong>save</strong> both yourself and <strong>those who hear you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L16">1 Tim. 4:16</a>)</p></blockquote><h3>Can Anyone Besides Christ Really Save?</h3><p>Neither the apostle, nor wives and husbands, are saviors in the sense in which the Lord Jesus Christ is the Savior — the only Redeemer and Deliverer of mankind from death and hell, who grants resurrection and eternal life with God. However, the expressions “I will save”, as one can see, are allowed by the apostles. We understand the meaning of such expressions correctly — people can contribute to salvation: “<em>For we are God’s </em><strong><em>fellow workers</em></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L9">1 Cor. 3:9</a>).</p><p>So too with an icon: it is not the icon that saves, but God who saves; God sends grace through an object. In the Bible we find many such examples, which will be discussed below.</p><h2>On the Expression: An Icon Is a Window into the Spiritual World</h2><p>An icon is a kind of <strong>window into the spiritual world</strong>. This expression has no mysterious meanings and is a figurative expression. It means only that, looking at an icon, we seem to look into the invisible spiritual world, as through a window.</p><p>Spiritual things are invisible, but the iconographer depicts the invisible visibly on the icon, using symbols. Thus, for example, the presence of divine grace in the saints is depicted as a halo around their heads; the absence of shadows means abiding in the divine light (which is not ordinary light and casts no shadows); meanings are contained in the gestures shown by the hands, in the colors of the clothing, in special marks on the clothing (the three stars of the Theotokos), in the surrounding objects, buildings, and space in general. Looking at all this, we learn something about the invisible spiritual world. It is precisely because of this that the expression is sometimes used that an icon is, as it were, a window into the spiritual world (<a href="https://monastery.ru/propovedi/okno-v-dukhovnyy-mir/">more</a>, in Russian).</p><p>Why does this have to be explained specially? Because one repeatedly encounters how opponents of the Orthodox Church, searching for something to build their accusations on, simply invent accusations to instill them in their followers, cultivating in them hatred for the Orthodox Church. Thus, for example, wishing to portray the Orthodox as vile sorcerers, opponents of the Church invent the idea that the Orthodox supposedly establish a connection with God through icons, as through some kind of energy portal, and therefore need icons in order to communicate with God. All this is simply untrue.</p><p>The Orthodox Church calls believers to prayer everywhere, regardless of whether there are icons. An icon is only an auxiliary means for education and prayer. In prayer an icon helps to concentrate the thoughts: not to be scattered, not to be distracted. An icon is also a means of expressing respect for the person depicted on it. Various objects, including icons, can become a means through which God imparts His grace to people; more on this in the next section.</p><h2>Divine Action Through Objects and Images</h2><p>The Orthodox are accused of expecting some divine help not only directly from God, but also through objects and images. But this belief too does not contradict Scripture, in which God acted many times through objects and images.</p><h3>Relics</h3><p>Resurrection through remains (relics). We see here neither anyone’s faith, nor prayer, nothing except the accidental touching of the prophet’s remains by the dead man:</p><blockquote><p><em>“So it was, as </em><strong><em>they were burying a man</em></strong><em>, that suddenly they spied a band of raiders; and they put the man in the tomb of Elisha; and when the man was let down and </em><strong><em>touched <mark>the bones of Elisha</mark>, he revived and stood on his feet</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/4ts/13/#L21"><em>2 Kin. 13:21</em></a><em>)</em></p></blockquote><h3>Clothing</h3><blockquote><p><em>“so that </em><strong><em>even <mark>handkerchiefs or aprons</mark> were brought from his body to the sick, and the diseases left them</em></strong><em> and the evil spirits went out of them” (</em><a href="https://bibleox.com/en/eng-nkjv/act/19/#L12"><em>Act. 19:12</em></a><em>)</em></p></blockquote><h3>An Image</h3><blockquote><p>“so that <strong>they brought the sick out</strong> into the streets and laid them on beds and couches, <strong>that at least the shadow of Peter passing by might fall on some of them</strong>. Also a multitude gathered from the surrounding cities to Jerusalem, bringing sick people and those who were tormented by unclean spirits, and <strong>they were all healed</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15-16">Act. 5:15-16</a>)</p></blockquote><h3>Water</h3><blockquote><p><em>“For an angel went down at a certain time into the pool and </em><strong><em>stirred up <mark>the water</mark></em></strong><em>; then whoever </em><strong><em>stepped in first, after the stirring of the water, was made well</em></strong><em> of whatever disease he had” (</em><a href="https://bibleox.com/en/eng-nkjv/in/5/#L4"><em>John. 5:4</em></a><em>)</em></p></blockquote><h3>More</h3><p><a href="https://bibleox.com/ru/ru/w/%D0%98%D1%81%D1%86%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F">https://bibleox.com/ru/ru/w/Исцеления</a> (in Russian)</p><h2>The Teaching of the Orthodox Church on the Veneration of Icons</h2><h3>The Dogma on the Veneration of Icons of the 367 Holy Fathers of the Seventh Ecumenical Council, of Nicaea (787)</h3><blockquote><p>To make our confession short, we keep unchanged all the ecclesiastical traditions handed down to us, whether in writing or verbally, <strong>one of which is the making of pictorial representations, agreeable to the history of the preaching of the Gospel, a tradition useful in many respects, but especially in this, that so the incarnation of the Word of God is shown forth as real and not merely phantastic, for these have mutual indications and without doubt have also mutual significations</strong>. We, therefore, following the royal pathway and the divinely inspired authority of our Holy Fathers and the traditions of the Catholic Church (for, as we all know, the Holy Spirit indwells her), define with all certitude and accuracy that <strong><mark>just as the figure of the precious and life-giving Cross, so also the venerable and holy images</mark></strong>, as well in painting and mosaic as of other fit materials, should be set forth in the holy churches of God, and on the sacred vessels and on the vestments and on hangings and in pictures both in houses and by the wayside, to wit, <strong>the figure of our Lord God and Saviour Jesus Christ, of our spotless Lady, the Mother of God, of the honourable Angels, of all Saints and of all pious people</strong>. For by so much more frequently as they are seen in artistic representation, <strong><mark>by so much more readily are men lifted up to the memory of their prototypes, and to a longing after them; and to these should be given due salutation and honourable reverence (ἀσπασμὸν καὶ τιμητικὴν προσκύνησιν), not indeed that true worship of faith (λατρείαν) which pertains alone to the divine nature</mark></strong>; <strong>but to these, as to the figure of the precious and life-giving Cross and to the Book of the Gospels and to the other holy objects, incense and lights may be offered according to ancient pious custom</strong>. For <strong><mark>the honour which is paid to the image passes on to that which the image represents, and he who reveres the image reveres in it the subject represented</mark></strong>. For thus the teaching of our holy Fathers, that is the tradition of the Catholic Church, which from one end of the earth to the other hath received the Gospel, is strengthened.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787/">The Seventh Ecumenical Council: The Second Council of Nicaea (787)</a>)</p><h3>Jeremiah, Patriarch of Constantinople (1576)</h3><blockquote><p>To the twenty-first and last chapter of all, which speaks of the veneration of the saints and says that to keep the memory of the saints is useful for strengthening our faith, if we consider how they received divine grace and help through faith, we say that <strong>invocation is fitting chiefly in relation to God alone, and to Him it belongs pre-eminently and properly; while that which is made to the saints is not in the proper sense, and is addressed to them, so to speak, incidentally and by grace. For it is not Peter or Paul who hears those who call upon them, but the grace which they have</strong>, according to the word of the Lord: “I am with you always, even to the end of the age” (Matt. 28:20).</p><p>The divine Paul, writing to the Romans about calling upon God, says: “How then shall they call on Him in whom they have not believed?” (Rom. 10:14), showing by this that one must call only upon the One in whom we have believed, that is, God. And that <strong>we too address our invocations, properly speaking, to the One God is seen from the fact that in the divine mystagogy we cry out: “Our Father” and so on. And in another place: “O Lord of hosts, be with us, for we have no other helper in sorrows but Thee.” And again: “We know no other God but Thee.” But we make all the saints mediators, and pre-eminently the Mother of the Lord, and with her the host of Angels and saints, and we honor them with churches, dedications, invocations and holy icons, relatively and not as an act of worship. For <mark>we know that worship is due pre-eminently to the One God, and besides Him no one else must be acknowledged as God, nor must we bow down to “a foreign god” (Ps. 81:9)</mark></strong>. We would rather not wish to be saints ourselves than be afraid of falling, through relative veneration, into deification. May this not be: for <strong><mark>it is impious and foreign to the Church of Christ and her children not to bow down, relatively, to the holy icons, because the honor paid to them passes on to the prototype</mark></strong>, as Basil says. We acknowledge all the saints as our mediators and intercessors, and we say that not only in the present age, but also in the age to come there will be a certain mediation, because the Angels and the saints will entreat for some, and no less than they the Lady of the world; however not for all in general, and not for anyone who died in sins — not at all; for God has entirely closed His mercy to such, which is why He revealed about them the following: “Even if Noah, Daniel, and Job were in it, they would deliver neither sons nor daughters” (Ezek. 14:14,18). All will entreat God only for those for whom intercession is acceptable, that is, those who anticipated the end of their life with repentance, but could not yet wash away the defilements of sin, and only while the judgment still continues. When this spectacle is over and each has been led away to the appointed place of punishment, intercession is impossible and will not exist. This intercession takes place even now and is proclaimed in the Church: we call upon the saints, and upon our Lady, and upon the holy Angels. Upon our Lady thus: “Most holy Lady Theotokos, pray for us sinners”; upon the holy Angels: “All ye heavenly powers of the holy Angels and Archangels, pray for us sinners”; and likewise upon the prophet, Forerunner and Baptist of the Lord, the glorious Apostles, prophets, martyrs, venerable ones, shepherds, ecumenical teachers and all the other saints. We also ask the host of holy women to pray for us sinners; we ask God that He, by His grace and the invincible, incomprehensible, divine power of the Cross, be merciful to us who serve Him, who abide in confession and repentance, and who ask for the enlightenment of the eyes of our soul, that we may not sleep in sins unto death, and that the enemy may not prevail against us. Thus by the intercession of all those of whom we have spoken we pray to God that He have mercy on us and snatch us out of the snares of the evil one.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_25">First Answer to the Lutherans</a>, in Russian; translated from the Russian)</p><p>There is also a longer second answer to the Lutherans with a detailed examination of the veneration of icons: <a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_34">second answer</a> (in Russian).</p><p>And a short third answer: <a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_41">third answer</a> (in Russian).</p><h3>The Epistle of the Patriarchs of the Eastern-Catholic Church on the Orthodox Faith (1723)</h3><blockquote><p>How ought we to think of the Holy Icons, and of the adoration of the Saints?</p><p>The saints being, and acknowledged by the Catholic Church to be, intercessors, as hath been said in the Eighth Decree [above], it is time to say that we <strong><mark>honour them as friends of God, and as praying for us to the God of all</mark></strong>. And the honour we pay them is twofold; – according to one manner which we call hyperdoulia, we honour the Mother of God the Word. For though indeed the Theotokos be servant of the only God, yet is she also his Mother, as having borne in the flesh one of the Trinity; wherefore also is she hymned, as being beyond compare, above as well all Angels as Saints; wherefore, also, we pay her the adoration of hyperdoulia. But according to the other manner, which we call doulia, we adore, or rather honour, the holy Angels, Apostles, Prophets, Martyrs, and, in fine, all the Saints. Moreover, <strong>we adore and honour the wood of the precious and life-giving Cross, whereon our Saviour underwent this world-saving passion, and the sign of the life-giving Cross, the Manger at Bethlehem, through which we have been delivered from irrationality, the place of the Skull [Calvary], the life-giving Sepulchre, and the other holy objects of adoration; as well the holy Gospels, as the sacred vessels, wherewith the unbloody Sacrifice is performed. And by annual commemorations, and popular festivals, and sacred edifices and offerings; we do respect and honour the saints</strong>. <strong>And then we adore, and honour, and kiss the icons of our Lord Jesus Christ, and of the most holy Theotokos, and of all the saints, also of the holy Angels, as they appeared to some of the forefathers and prophets. We also represent the All-Holy Spirit</strong>, as he appeared, in the form of a dove.</p><p><strong>And if some say we commit idolatry in adoring the Saints, and the Icons of the Saints, and the other things, we regard it as foolish and frivolous. For we worship with latria the only God in Trinity, and none other</strong>; but the Saints we honour upon two accounts: firstly, for their relation to God, since we honour them for his sake; and for themselves, because they are living images of God. But that which is for themselves hath been defined as doulia. <strong><mark>But the holy Icons we adore relatively since the honour paid to them is referred to their prototypes. For he that adoreth the Icon doth, through the Icon, adore the prototype; and the honour paid to the Icon is not at all divided, or at all separated from that of him that is portrayed, and is done unto the same, like that done unto a royal embassy</mark></strong>.</p><p>And what they adduce from Scripture in support of their novelties, doth not help them as they would, but rather appeareth agreeable to us. For <strong>we, when reading the Divine Scripture, examine the occasion and person, the example and cause. Wherefore, when we contemplate God himself saying at one time, “Thou shalt not make to thyself any idol, or likeness; neither shalt thou adore them, nor serve them” (Exod. 20.4–5; Deut. 5.8–9); and at another, commanding that Cherubim should be made (Exod. 25.18)</strong>; and further, that oxen and lions (1 Kings 7.29) were placed in the Temple, we do not rashly consider the import of these things. For faith is not in assurance; but, as hath been said, considering the occasion and other circumstances, <strong><mark>we arrive at the right interpretation of the same; and we conclude that, “Thou shalt not make to thyself any idol, or likeness”, is the same as saying, “Thou shalt not adore strange gods” (Exod. 20.4), or rather, “Thou shalt not commit idolatry”</mark></strong>. For so both the custom obtaining in the Church from Apostolic times of adoring the holy Icons relatively is maintained, and the worship of latria reserved for God alone; and God doth not appear to speak contrarily to himself. &lt;...&gt; And as to the Saints whom they bring forward as saying, that it is not lawful to adore Icons; we conclude that they rather help us; since they in their sharp disputations inveighed, as well against those that adore the holy Icons with latria, as against those that bring the icons of their deceased relatives into the Church, and subjected to anathema those that so do; but not against the right adoration, either of the Saints, or of the holy Icons, or of the precious Cross, or of the other things of which mention hath been made; especially since the holy Icons have been in the Church, and have been adored by the Faithful, even from the times of the Apostles, as is recorded and proclaimed by very many; with whom and after whom the Seventh Holy Ecumenical Synod putteth to shame all heretical impudence.</p><p>Since it giveth us most plainly to understand that it behoveth to adore the Holy Icons, and what have been mentioned above. And <strong><mark>it anathematises, and subjects to excommunication, as well those that adore the Icons with latria as those that say that the Orthodox commit idolatry in adoring the Icons. We also, therefore, do anathematise with them such as adore either Saint, or Angel, or Icon, or Cross, or Relic of Saints, or sacred Vessel, or Gospel, or aught else that is in heaven above, or aught on the earth, or in the sea, with latria; and we ascribe adoration with latria to the only God in Trinity. And we anathematise those that say that the adoration of Icons is the latria of Icons, and who adore them not, and honour not the Cross, and the Saints, as the Church hath delivered</mark></strong>.</p><p>Now we adore the Saints and the Holy Icons, in the manner declared; and portray them in adornment of our temples, and that they may be the books of the unlearned, and for them to imitate the virtues of the Saints; and for them to remember, and have an increase of love, and be vigilant in ever calling upon the Lord, as Sovereign and Father, but upon the Saints, as his servants, and our helpers and mediators.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732/#HH-Q-4-How-ought-we-to-think-of-the-Holy-Icons-and-of-the-adoration-of-the-Saints">Epistle of the Patriarchs, Question 4</a>)</p><h2>Answers to Criticism</h2><h3>You Remove One of the Ten Commandments of God</h3><p>Do you keep the <a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9/#HH-4">4th</a> commandment about the Sabbath rest? Do you do no work on Saturday? Do you kill those of your brothers and sisters who work on Saturday? Do you kill them for blasphemy or idolatry? If you do not do this, then for what reason? Are you not removing the commandments of God? Why is it ignored that you demand the fulfillment of the 2nd commandment, when you yourselves do not fulfill the 4th?</p><p>The Law of Moses has been abolished. Christians follow Christ. The second commandment obviously did not forbid images and their veneration, because God commands images to be made in His temple, commanded the temple to be revered, and the prophets bowed before sacred objects with images. The commandment forbade depicting God, and also forbade idolatry (the veneration and service of false gods).</p><h3>You Burn Incense to Icons as the Israelites Burned Incense to Nehushtan</h3><p>The error of the Israelites was not that they burned incense (God Himself established the burning of incense), but that they invented a false deity, calling it Nehushtan, and instead of serving God began to serve the Nehushtan they had invented, obviously considering the object itself a deity, as always happened with the Israelites (<a href="https://bibleox.com/ru/ru/w/%D1%8F%D0%B7%D1%8B%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F-%D0%B2%D0%B5%D1%80%D0%B0-%D0%B2-%D0%B8%D0%B4%D0%BE%D0%BB%D0%B0/#HH-%D0%AF%D0%B7%D1%8B%D1%87%D0%BD%D0%B8%D0%BA%D0%B8-%D0%B8%D0%B7%D1%80%D0%B0%D0%B8%D0%BB%D1%8C%D1%82%D1%8F%D0%BD%D0%B5-%D1%81%D1%87%D0%B8%D1%82%D0%B0%D0%BB%D0%B8-%D0%B1%D0%BE%D0%B3%D0%BE%D0%BC-%D1%81%D0%B0%D0%BC%D0%BE-%D0%B8%D0%B7%D0%B4%D0%B5%D0%BB%D0%B8%D0%B5-%D0%B0-%D1%82%D0%B0%D0%BA%D0%B6%D0%B5-%D1%81%D1%82%D0%B8%D1%85%D0%B8%D0%B8">more</a>, in Russian). Not only the name was invented, but also ways of pleasing Nehushtan, followed by his invented will (commandments). This is idolatry, that is, the service of false gods. It leads away from God and from life according to His will, and leads to life according to the will of Nehushtan (that is, of his author).</p><p>The Orthodox depict the true God, calling Him by His own names, fulfilling His commandments, not considering the object (the icon) a god, making bows and burning incense not to the icon, but to God. This is not idolatry, since there are not even false gods here, nor service of false gods, unlike what happened with the servants of Nehushtan.</p><h3>God Said to Depict, but Did Not Say to Venerate</h3><p>This is not so. In Scripture one can see that God commanded both to make images and to venerate them. Scripture also has the practice of venerating images.</p><p>God said to revere the temple, which by the design of God Himself is an image (icon) of the heavenly reality. The prophet David bowed before the temple with images; the prophet Joshua the son of Nun bowed before the Ark of the Covenant with images. So God commanded the image to be venerated, and the prophets venerated sacred objects with images, bowing before them. Without doubt, the prophets referred this veneration to God: that is, in venerating the image, they venerated the prototype. Orthodox Christians do exactly the same.</p><h3>The Proposal to Give Up Icons Just in Case</h3><p>Having heard our explanations, opponents of the veneration of icons often agree that our veneration of icons is permissible, but say that not all of us know the teaching of the Church well enough and still treat the icon as an idol, so, they say, it is better to remove the icons in order to avoid temptation.</p><p>We do not agree with this, because icons are needed, and a wrong attitude toward them must be removed through enlightenment, through the explanation of the right faith.</p><p>Some people misunderstand the Bible, but this does not force us to give up the Bible in order to avoid temptation. It only leads us to the need for enlightenment and the right explanation of the words of the Bible.</p><h3>Answers to Criticism Regarding History and Patristic Tradition</h3><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D1%8E%D1%82#HH-%D0%9A%D1%80%D0%B8%D1%82%D0%B8%D0%BA%D0%B0">https://bibleox.com/ru/ru/w/иконы-почитают#HH-Критика</a> (in Russian)</p><h2>Conclusion</h2><p>Thus we believe that those who equate the veneration of icons with the worship of false gods (idols) are mistaken, and the accusation of the Orthodox of idolatry is an unjust accusation of believers and a distorted notion of the Orthodox faith.</p><p>An icon is only a right explanation and reminder of God, of people and of events, but it is venerated neither as God, nor instead of God. We show elementary respect for what is related to God, just as people respect the flag of their country not for the sake of the special cloth, but out of respect for the country itself; respect the portrait of the president not for the sake of the quality of the paper and paint, but for the sake of the president himself; respect the cross and the Gospel not for the sake of a rare kind of wood and the material of the book, but because on the cross God was crucified for our salvation, and in the book His saving words are written down.</p><p>An icon is meant to help people show respect for God, His Mother and His friends. An icon can help one concentrate during prayer and direct the mind to God.</p><p>Sometimes, not at all by our will, God Himself reveals miracles and healings through icons and other objects, which naturally leads us to the thought of a special veneration of that object, but not instead of God, but for God’s sake, just as God once told the prophet Moses about the need for reverence for the holy ground:</p><blockquote><p>“<strong><mark>Take your sandals off</mark> your feet, <mark>for the place</mark> where you stand is <mark>holy ground</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/3/#L5">Ex. 3:5</a>)</p></blockquote><p>The prophet David too had reverence before what is holy and bowed down to it:</p><blockquote><p>“Exalt the LORD our God, and <strong><mark>worship</mark></strong> <strong>at His footstool</strong> (pedestal, a stand for the feet — note) <strong>— <mark>He is holy</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/99/#L5">Ps. 99:5</a>)</p></blockquote><p>And to those who did not have such reverence, God sent a deadly punishment:</p><blockquote><p>“And you [King Belshazzar] have lifted yourself up against the Lord of heaven. <strong>They have brought the vessels of His house before you</strong>, and you and your lords, your wives and your concubines, <strong>have drunk wine from them</strong> &lt;…&gt; That very night Belshazzar, <strong>king of the Chaldeans, was slain</strong>” (<a href="https://bibleox.com/en/eng-nkjv/dan/5/#L23,30">Dan. 5:23,30</a>)</p></blockquote><p>So, to put it more simply, when a <strong>false </strong>god or a pointer to a <strong>false</strong> god is venerated, that will be idolatry, that is, veneration and worship of a <u>false</u> <u>god</u> (an idol). The Orthodox Church does not teach such religious veneration of people, objects and images, and condemns it.</p><p>The veneration of the true God leads to the veneration of everything connected with Him. God is venerated as God, and His friends and faithful servants — as His friends and faithful servants, and not as God. A king is respected as a king, and those close to him — as those close to him, and not as the king. In such veneration there is no <u>false</u> <u>god</u>. This is the faith the Orthodox Church teaches.</p><h2>Related Quotes</h2><ol><li><p><a href="https://bibleox.com/en/en/w/Vs4n_Veneration_of_the_Saints/">Veneration of the Saints</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Rl6c_Veneration_of_the_Relics_of_Saints/">Veneration of the Relics of Saints</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%92%D1%8B%D0%B1%D0%BE%D1%80_%D0%BC%D0%B5%D1%81%D1%82%D0%B0_%D0%BA%D0%B0%D0%BA_%D1%84%D0%BE%D1%80%D0%BC%D0%B0_%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D1%8F">https://bibleox.com/ru/ru/w/Выбор_места_как_форма_почитания</a></p></li><li><p><a href="https://bibleox.com/en/en/w/Ps5r_Prayers_to_the_Saints/">Prayers to the Saints</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">https://bibleox.com/ru/ru/w/человек-храм-Божий</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">https://bibleox.com/ru/ru/w/состав-человека</a></p></li></ol>
