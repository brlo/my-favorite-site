- src: Lb4nJQEY_Церковь_Христова__святая
  path: The-Church-of-Christ-is-holy
  title: The Church of Christ is holy
  menu:
    parent: The holiness of the Church
    title: The Church is holy
    priority: 2
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>The
    Church is called holy because the Author of our redemption and her Head is the
    holy Lord Jesus Christ</strong>, and the Ordainer of the salvation of the believers
    – <strong>the Holy Spirit</strong>, from whom <strong>the sanctifying power of
    God</strong> is poured out upon the whole Body (the Church).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
