- src: qr4ZoDIn_Церковь_свята_и_предназначена_приводить_верующих_к_святости
  path: The-Church-is-holy-and-leads-to-holiness
  title: The Church is holy and leads the faithful to holiness
  menu:
    parent: The holiness of the Church
    title: The Church is holy and leads to holiness
    priority: 5
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong><mark>Jesus
    Christ gave Himself over to death precisely in order</mark> “to present it (the
    Church) to Himself a glorious Church, not having spot, or wrinkle, or any such
    thing, but that it should be holy and without blemish” (Eph. 5:24–27). “<mark>To
    present you holy and unblameable</mark> and unreproveable in His sight” (Col.
    1:22). “<mark>To redeem us from all iniquity and purify unto Himself a people
    of His own</mark>, zealous of good works” (Tit. 2:14; cf. Eph. 4:11–13; 1 Tim.
    1:15).</strong> <strong>The task of the Church is accomplished by her members
    gradually, therefore <mark>in her the believers are not all alike in spiritual
    perfection</mark>: alongside virtuous people (though not sinless), in <mark>her
    there are manifest sinners, whom the Church calls to repentance</mark>, to correction
    and moral renewal</strong>. “In a great house there are not only vessels of gold
    and of silver, but also of wood and of clay” (2 Tim. 2:20). In the Church, as
    in a body, there are members “comely” and “less honourable”, – “less perfect”,
    “the weakest” (1 Cor. 12:22–24).</p></blockquote><p>(The Orthodox Church and the
    Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: lrJnvp6o_Церкви_состоящей_из_одних_совершенных_людей_никогда_не_было_на_земле
  path: The-Church-has-never-been-of-the-perfect-only
  title: There has never been on earth a Church consisting only of perfect people
  menu:
    parent: The holiness of the Church
    title: The Church has never consisted only of perfect people
    priority: 6
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>In
    the apostolic Church the Christians Ananias and Sapphira lied to the Holy Spirit
    and fell down dead (Acts 5:1, 10); murmuring arose among the believers (Acts 6:1);
    widows and the poor were despised (James 2:1–9); there were strifes and dissensions
    (1 Cor. 1:11), lawsuits (1 Cor. 6:7). “Some man had his father's wife” (1 Cor.
    5:1); others drank to the point of communion (1 Cor. 11:21). “Many... walk, of
    whom I have told you often... that they are the enemies of the cross of Christ...
    who mind earthly things” (Phil. 3:18–19). “All seek their own, not the things
    which are Jesus Christ's” (Phil. 2:21).</p><p>In the parables of the net and of
    the tares the Lord explained (Matt. 13:24–30; 37–43; 47–50) that in His Kingdom
    (the Church), until the end of the age, the sons of the kingdom, the righteous,
    and the sons of the wicked one, who work iniquity, will abide together; only then
    will follow the separation of the good from the wicked.</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
