    title: The all-holy Spirit always abides in the Church
    priority: 4
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“And
    I will pray the Father, and He shall give you another Comforter, that He may abide
    with you for ever... the Comforter, the Holy Spirit, whom the Father will send
    in My name” (John 14:16, 26; cf. 7:39). “And they were all filled with the Holy
    Spirit” (Acts 2:4).</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
