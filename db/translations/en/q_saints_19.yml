- src: y0lxEJzw_Иисус_Христос_есть_всесвятой_Господь
  path: Jesus-Christ-is-the-all-holy-Lord
  title: Jesus Christ is the all-holy Lord
  menu:
    parent: The holiness of the Church
    title: Jesus Christ — the all-holy Lord
    priority: 3
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“For
    Thou only art holy” (Rev. 15:4). “Which of you convinceth Me of sin?” (John 8:46).
    “He did no sin, neither was guile found in His mouth” (1 Pet. 2:22). “In Him there
    is no sin” (1 John 3:5). “Such an High Priest became us, who is holy, harmless,
    undefiled, separate from sinners, and made higher than the heavens” (Heb. 7:26).</p></blockquote><p>(The
    Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
