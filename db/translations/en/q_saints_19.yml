- src: 5ISAVToY_Значение_слова_святой__άγιος
  path: The-meaning-of-the-word-saint-hagios
  title: The meaning of the word “saint” — ἅγιος
  menu:
    parent: The holiness of the Church
    title: The concept of “saint”
    priority: 1
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>The
    meaning of the word “saint” – ἅγιος</strong></p><p>Ἅγιος means set apart, singled
    out, dedicated (to God, Luke 2:23), sacred, holy, pure, undefiled. <strong><mark>When
    spoken of God (John 14:26, 17:11 and elsewhere), the word holy (ἅγιος) denotes
    His most perfect moral purity, constant and unchangeable holiness (a property
    of the divine nature), absolute undefilement</mark></strong>. </p><p><strong><mark>The
    members of the heavenly Church (Heb. 12:22–23) are called “saints” (2 Thess. 1:10)
    because, aided by the grace of God, they strove during their earthly life with
    a good struggle, kept the faith (2 Tim. 4:7) and attained perfection</mark></strong>.
    </p><p><strong><mark>The members of the earthly Church of Christ are named “saints”
    (Acts 9:13, 32, 41; Rom. 1:7, 15:26; 1 Cor. 1:2 and elsewhere) not because they
    are sinless (1 John 1:8–10; Eccl. 7:20), but because they were singled out “out
    of darkness” (1 Pet. 2:9), sanctified by the Holy Spirit in the sacraments of
    baptism and chrismation, and called to attain holiness, undefilement (1 Pet. 1:15;
    1 Thess. 4:3, 7)</mark></strong>. </p><p><strong>The holiness of God is the ideal
    towards which the Christian gradually advances by the struggle against sin and
    by moral perfection.</strong> The whole Jewish people was called “holy”, since
    it was set apart by the Lord from among other nations and called to holiness:
    “be holy before Me, for I am holy, the Lord your God, and I have separated you
    from the peoples, that you should be Mine” (Lev. 20:26). In the sense of being
    set apart, dedicated to God, sanctified by manifestations of God, the word “holy”
    is applied to the temple (Ps. 64:5), to a part of the tabernacle (Heb. 9:3), to
    the sacrifice (Lev. 23:20), to the garments and vessels used in worship (Lev.
    16:4; 1 Kings 8:4), to the feasts (Lev. 23:7–8, 27), to the oil (Num. 35:25),
    to the water (Num. 5:17), to Jerusalem (Matt. 4:5, 27:53), to the land (Acts 7:33),
    to the mountain (2 Pet. 1:18), to the law and the commandment (Rom. 7:12) and
    so on.</p><p><strong>The teaching of the venerable John Cassian the Roman († 435)
    that “holy”, when applied to a man, does not mean sinless</strong></p><p><strong>“Between
    the holy and the sinless there is a great difference. For one thing is to be holy
    (that is, dedicated to the worship of God, since this name, as the Holy Scripture
    testifies, is common not only to men, but also to places, and to the vessels of
    the temple, and to the braziers), and another thing is to be without sin</strong>,
    which befits God. <strong><mark>The Holy Scripture clearly testifies that righteous
    and holy men are not free from guilt, saying: seven times a day the righteous
    man falls and rises up (Prov. 24:16). For what does it mean to fall, if not to
    sin?</mark></strong> Although it is said that he falls seven times, he is nevertheless
    called righteous, and his fall through human infirmity does not hinder his righteousness;
    therefore there is a great difference between the fall of a righteous man and
    that of a sinner... There are seven kinds of falls (through ignorance, forgetfulness,
    thoughts, idle words, sudden impulse, straitness of circumstances, infirmity of
    the flesh) which a saint, although he sometimes falls into them, does not cease
    on that account to be righteous. Although the falls seem light and small, they
    nonetheless make it impossible for him to be sinless. For he has something to
    repent of daily, and must ask forgiveness and pray constantly for his sins, saying:
    “forgive us our debts..”. (Matt. 6:12). So, if this prayer is uttered by the saints,
    who can be found so obstinate, so prejudiced, so puffed up with the pride of diabolical
    frenzy, as to claim that he is without sin, to count himself not only above the
    apostles, but to rebuke the Saviour Himself as it were of ignorance and vanity,
    as though He did not know that some could be free from sins, or taught in vain
    those of whom He knew that they had no need of the medicine of this prayer? Therefore
    the wise Ecclesiastes, surveying with his mind all the actions and occupations
    of men, pronounces without any exception: “There is no righteous man on earth
    that doeth good and sinneth not” (Eccl. 7:20); that is, on this earth there is
    no one so holy, so careful, so attentive, who could constantly cleave to the true
    and only Good (God), conscious that he does not sin even in his daily turning
    away from Him. Nevertheless, if anyone confesses that he cannot be free from sin,
    this does not prevent him from being righteous... His gaze is purer, and he notices
    more; an unblemished life gives rise to greater grief of self-reproach; the correction
    of morals and careful zeal for virtues multiply groanings and sighings. For no
    one can be satisfied with that degree of perfection to which he has advanced;
    and the purer he is in spirit, the more unclean he sees himself to be, the more
    he finds cause for humility than for exaltation; and the faster he strives towards
    the height, the more he sees that there is all the more for him to strive towards.
    That distinguished one among the apostles declared: “if we say that we have no
    sin, we deceive ourselves, and the truth is not in us” (1 John 1:8). So, if we
    say that we have no sin, by this very thing we prove that we are passing from
    being mere sinners to being lawless and impious. If we wish to test more surely
    whether it is possible for human nature to attain sinlessness, from whom can we
    learn it more clearly than from those who have crucified their flesh with its
    passions and lusts (Gal. 5:24) and who, although they have not only rooted out
    all the passions from their heart, but strive to remove even the memory of sins
    and of thoughts, nevertheless confess daily that they do not remain even for a
    single hour without sin?”</p></blockquote><p>(The Orthodox Church and the Sectarians)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
