    <h2>1st century</h2>
    <h3>St Clement of Rome, hieromartyr († c. 101)</h3>
    <p>There is an indirect indication of the three degrees of the priesthood, since he lists the ancient ministries, but by them points to the new ministries in the Church:</p>
    <blockquote><p>Those, therefore, who present their offerings at the appointed times, are accepted and blessed; for inasmuch as they follow the laws of the Lord, they sin not. For his own peculiar services are assigned to the <strong>high priest</strong>, and their own proper place is prescribed to the <strong>priests</strong>, and their own special ministrations devolve on the <strong>Levites</strong>. The layman is bound by the laws that pertain to laymen. <strong>Let every one of you, brethren, give thanks to God in his own order</strong>, living in all good conscience, with becoming gravity, and <strong>not going beyond the rule of the ministry prescribed to him</strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-40">The First Epistle of Clement to the Corinthians, 40–41</a>)</p>
    <h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr (c. 35–107)</h3>
    <blockquote><p><strong><em>In like manner, let all <mark>reverence</mark> the <mark>deacons</mark> as an appointment of Jesus Christ, and the <mark>bishop</mark> as Jesus Christ, who is the Son of the Father, and the <mark>presbyters</mark> as the sanhedrin of God, and assembly of the apostles. <mark>Apart from these, there is no Church</mark></em></strong><em>. Concerning all this, I am persuaded that ye are of the same opinion.</em></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/IgnAn_Tr#HH-3">To the Trallians, 3</a>)</p>
    <blockquote><p><em>See that ye all follow </em><strong><em><mark>the bishop</mark></em></strong><em>, even as Jesus Christ does the Father, and </em><strong><em><mark>the presbytery</mark></em></strong><em> as ye would the apostles; and </em>reverence <strong><em><mark>the deacons</mark></em></strong><em>, as being the institution of God</em>. Let no man do anything connected with the Church without the <strong>bishop</strong>. Let that be deemed a proper Eucharist, which is [administered] either by the bishop, or by one to whom he has entrusted it. Wherever the bishop shall appear, there let the multitude [of the people] also be; even as, wherever Jesus Christ is, there is the Catholic Church. It is not lawful without the bishop either to baptize or to celebrate a love-feast; but whatsoever he shall approve of, that is also pleasing to God, so that everything that is done may be secure and valid. &lt;…&gt; It is well to reverence both God and the <strong>bishop</strong>. He who honours the <strong>bishop</strong> has been honoured by God; he who does anything without the knowledge of the <strong>bishop</strong>, does [in reality] serve the devil.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/IgnAn_Sm#HH-8">To the Smyrnaeans, 8–9</a>)</p>
    <blockquote><p>Give ye heed to the bishop, that God also may give heed to you. My soul be for theirs that are submissive to<strong><em> <mark>the bishop, to the presbyters, and to the deacons</mark></em></strong><em>.</em></p>
    <p>And may my portion be along with them in God! <em>Labour together with one another; strive in company together; run together; suffer together,</em></p>
    <p><em>sleep together; and awake together, as the stewards, and associates, and servants of God.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>I pray that you may always be strengthened in our God Jesus Christ.</em> Through Him continue in unity with God and <strong><em>the bishop.</em></strong></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>If any one can continue in a state of purity, to the honour of Him who is Lord of the flesh, let him so remain without boasting.</em></p>
    <p>If he begins to boast, he is undone; and if he reckon himself greater than the <strong>bishop</strong>, he is ruined.</p></blockquote>
    <p>(To Polycarp, 6, 8, 5)</p>
    <blockquote><p>&lt;…&gt; which I salute in the blood of Jesus Christ, who is our eternal and enduring joy, especially if [men] are in unity with <strong><mark>the bishop, the presbyters, and the deacons</mark></strong>, who have been appointed according to the mind of Jesus Christ, whom He has established in security, after His own will, and by His Holy Spirit.</p>
    <p>Take ye heed, then, to have but one Eucharist. For there is one flesh of our Lord Jesus Christ, and one cup to [show forth] the unity of His blood; one altar; as there is one <strong><mark>bishop, along with the presbytery and deacons</mark></strong>, my fellow-servants: that so, whatsoever ye do, ye may do it according to [the will of] God.</p>
    <p>For, when I was among you, I cried, I spoke with a loud voice: Give heed to the <strong><mark>bishop, and to the presbytery and deacons</mark></strong>.</p>
    <p>Blessed is he in Jesus Christ, who shall be deemed worthy of such a ministry; and ye too shall be glorified. And if ye are willing, it is not beyond your power to do this, for the sake of God; as also the nearest Churches have sent, in some cases <strong><mark>bishops, and in others presbyters and deacons</mark></strong>.</p>
    <p>“&lt;…&gt; which I salute in the blood of Jesus Christ, who is our eternal and enduring joy, especially if [men] are in unity with <strong><mark>the bishop, the presbyters, and the deacons</mark></strong>, who have been appointed according to the mind of Jesus Christ, whom He has established in security, after His own will, and by His Holy Spirit. &lt;…&gt; Take ye heed, then, to have but one Eucharist. For there is one flesh of our Lord Jesus Christ, and one cup to [show forth] the unity of His blood; one altar; as there is one <strong><mark>bishop, along with the presbytery and deacons</mark></strong>, my fellow-servants: that so, whatsoever ye do, ye may do it according to [the will of] God. &lt;…&gt; For, when I was among you, I cried, I spoke with a loud voice: Give heed to the <strong><mark>bishop, and to the presbytery and deacons</mark></strong>. &lt;…&gt; And if ye are willing, it is not beyond your power to do this, for the sake of God; as also the nearest Churches have sent, in some cases <strong><mark>bishops</mark>, and in others <mark>presbyters and deacons</mark></strong>.”</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/IgnAn_Ph">To the Philadelphians</a>)</p>
    <h2>2nd century</h2>
    <h3>Clement of Alexandria, presbyter (c. 150–215)</h3>
    <blockquote><p>“And the chosen of the chosen are those who by reason of perfect knowledge are called [as the best] from the Church itself, and honoured with the most august glory — the judges and rulers — four-and-twenty (the grace being doubled) equally from Jews and Greeks. Since, according to my opinion, the <strong><mark>grades here in the Church</mark>, of <mark>bishops, presbyters, deacons</mark></strong>, are imitations of the angelic glory, and of that economy which, the Scriptures say, awaits those who, following the footsteps of the apostles, have lived in perfection of righteousness according to the Gospel.”</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/Iuhx_The_Stromata_6#HH-Chapter-13-Degrees-of-Glory-in-Heaven-Corresponding-with-the-Dignities-of-the-Church-Below">The Stromata, VI, 13</a>)</p>
    <blockquote><p>“Innumerable commands such as these are written in the holy Bible appertaining to chosen persons, some to <strong><mark>presbyters, some to bishops, some to deacons</mark></strong>, others to widows, of whom we shall have another opportunity of speaking.”</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/clement_alex-the-instructor-3#HH-12-Continuation-with-Texts-from-Scripture">The Instructor, Book III</a>)</p>
    <h3>Tertullian (c. 155–220)</h3>
    <blockquote><p>“For concluding our brief subject, it remains to put you in mind also of the due observance of giving and receiving baptism. <strong>Of giving it, the chief priest (who is the <mark>bishop</mark>) has the right: in the next place, the <mark>presbyters</mark> and <mark>deacons</mark></strong>, yet not without the bishop’s authority, on account of the honour of the Church, which being preserved, peace is preserved. Beside these, even laymen have the right; for what is equally received can be equally given. Unless <strong><mark>bishops, or priests, or deacons</mark></strong>, be on the spot, other disciples are called.”</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/tertullian-on-baptism#HH-Of-the-Power-of-Conferring-Baptism">On Baptism, 17</a>; the Russian text of this passage adds that the learners should not be called bishops, or presbyters, or deacons.)</p>
    <h2>3rd century</h2>
    <h3>St Hippolytus of Rome, hieromartyr (c. 170–235)</h3>
    <blockquote><p>When a <strong>deacon</strong> is ordained, let him be chosen, as was said above; in like manner, let only one <strong>bishop</strong> lay on the hand, as we have prescribed. At the ordination of a <strong>deacon</strong>, let only the <strong>bishop</strong> lay on the hand, because he is not ordained for the <strong>priesthood</strong>, but for the service of the <strong>bishop</strong>, that he may do what the latter commands him.</p>
    <p>Indeed, he does not participate in the council of the clergy, but cares for and reports to the <strong>bishop</strong> what must be done: he does not receive the spirit common to the <strong>presbyters</strong>, of which they are partakers, but receives the spirit which is entrusted to him under the authority of the <strong>bishop</strong>. This is why <strong><mark>the bishop</mark></strong><mark> alone ordains </mark><strong><mark>the deacon</mark></strong><mark>; over the </mark><strong><mark>presbyter</mark></strong><mark> the hands are laid</mark> also by the <strong>presbyters</strong>, because of the common and similar spirit of the clergy. But <strong><mark>the presbyter has the right only to receive it, and has no right to give it</mark></strong>. Therefore the clergy does not ordain; over the <strong>presbyter</strong> the ordination is sealed when the <strong>bishop</strong> ordains.</p></blockquote>
    <p>(The Apostolic Tradition; attributed to St Hippolytus of Rome or an unknown 3rd-century author)</p>
    <h3>Origen (c. 185–253)</h3>
    <blockquote><p>For not only fornication, but even a second marriage, does not allow one to occupy a position in the Church — he who has entered into a second marriage cannot be <strong><mark>either a bishop, or a presbyter, or a deacon</mark></strong>, nor a widow.</p></blockquote>
    <p>(Homilies on the Gospel of Luke)</p>
    <blockquote><p>For <strong><mark>neither a deacon, nor a presbyter, nor a bishop</mark></strong> washes the feet, taking a towel, whoever may come. But if you understand what is written — then how truly blessed are the bishops who serve the Church: they send down water from the Scriptures into the vessel of the soul, in accordance with the Scriptures, and touch the uncleanness of the disciples’ feet, to wash it away, cleanse it and cast it off. And so the <strong>bishops</strong> keep the commandment, imitating Jesus, and so do the <strong>presbyters</strong>.</p></blockquote>
    <p>(Homilies on the Book of the Prophet Isaiah)</p>
    <h3>St Cyprian of Carthage, <strong>hieromartyr</strong> (c. 200–258)</h3>
    <blockquote><p>And, moreover, if any <strong>bishops</strong> from foreign places, my colleagues, or <strong>presbyters</strong>, or <strong>deacons</strong>, should be present, or should arrive among you, let them hear all these matters from you; and if they wish to transcribe copies of the letters and to take them to their own people, let them have the opportunity of transcribing them.</p>
    <p>&lt;…&gt;</p>
    <p>To Cæcilius Cyprian, <strong>bishop</strong> of the church of the Carthaginians, Moyses and Maximus, <strong>presbyters</strong>, and Nicostratus and Rufinus, <strong>deacons</strong>, and the other confessors persevering in the faith of the truth</p>
    <p>&lt;…&gt;</p>
    <p>With the advice of all the <strong>bishops</strong>, <strong>presbyters</strong>, <strong>deacons</strong>, confessors, and even the laymen who abide fast, as in your letters you yourself also testify</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-1">The Epistles of Cyprian, 25 and 31</a>)</p>
    <blockquote><p>And this also I wrote very fully to Rome, to the clergy who were then still acting without a <strong>bishop</strong>, and to the confessors, Maximus the <strong>presbyter</strong>, and the rest who were then shut up in prison, but are now in the Church, joined with Cornelius. You may know that I wrote this from their reply, for in their letter they wrote thus: “However, what you have yourself also declared in so important a matter is satisfactory to us, that the peace of the Church must first be maintained; then, that an assembly for counsel being gathered together, with <strong>bishop</strong>, <strong>presbyters</strong>, <strong>deacons</strong>, and confessors, as well as with the laity who stand fast, we should deal with the case of the lapsed.”</p>
    <p>&lt;…&gt; However, what you have yourself also declared in so important a matter is satisfactory to us, that the peace of the Church must first be maintained; then, that an assembly for counsel being gathered together, with <strong>bishop</strong>, <strong>presbyters</strong>, <strong>deacons</strong>, and confessors, as well as with the laity who stand fast, we should deal with the case of the lapsed.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Antonianus-About-Cornelius-and-Novatian">To Antonianus, about Cornelius and Novatian</a>)</p>
    <blockquote><p>But repentance being done away with, and no confession of sin being made, the <strong>bishops</strong> being despised and trodden under foot, let peace be proclaimed by the <strong>presbyters</strong> in deceitful words</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Cornelius-Concerning-Fortunatus-and-Felicissimus-or-Against-the-Heretics">To Cornelius, concerning Fortunatus and Felicissimus, or against the heretics</a>)</p>
    <blockquote><p>We understand, dearest brother, and we perceive with the whole light of our heart, the salutary and holy plans of the divine majesty, whence the sudden persecution lately arose there — whence the secular power suddenly broke forth against the Church of Christ and the <strong>bishop</strong> Cornelius, the blessed martyr, and all of you; so that, for the confusion and beating down of heretics, the Lord might show which was the Church — which is its one <strong>bishop</strong> chosen by divine appointment — which <strong>presbyters</strong> are associated with the bishop in priestly honour.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Lucius-The-Bishop-of-Rome-Returned-from-Banishment">To Lucius, bishop of Rome, returned from banishment</a>)</p>
    <blockquote><p>Valerian had sent a rescript to the Senate, to the effect that <strong>bishops</strong> and <strong>presbyters</strong> and <strong>deacons</strong> should immediately be punished; but that senators, and men of importance, and Roman knights, should lose their dignity, and moreover be deprived of their property; and if, when their means were taken away, they should persist in being Christians, then they should also lose their heads.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Successus-on-the-Tidings-Brought-from-Rome-Telling-of-the-Persecution">To Successus, on the tidings brought from Rome</a>)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
