    title: The Church — a visible unity
    priority: 3
  body: '<h2>1st century</h2><h3>St Clement of Rome, hieromartyr († c. 101)</h3><blockquote><p><em>It
    is right, therefore, that we should not leave the post which His will has assigned
    us. </em><strong><em>Let us rather <mark>offend those men who are foolish, and
    inconsiderate, and lifted up, and who glory in the pride of their speech, than
    [offend] God</mark></em></strong><em>. Let us reverence the Lord Jesus Christ,
    whose blood was given for us; </em><strong><em><mark>let us esteem those who have
    the rule over us; let us honour the aged among us</mark></em></strong><em>; let
    us train up the young men in the fear of God</em></p><p>&lt;…&gt;</p><p><em>It
    is right and holy therefore, </em><strong><em><mark>men and brethren, rather to
    obey God than to follow those who, through pride and sedition, have become the
    leaders of a detestable emulation</mark></em></strong><em>. For </em><strong><em><mark>we
    shall incur no slight injury, but rather great danger, if we rashly yield ourselves
    to the inclinations of men who aim at exciting strife and tumults</mark></em></strong><em>,
    so as to draw us away from what is good</em></p><p>&lt;…&gt;</p><p>Let us therefore
    implore forgiveness for all those transgressions which through any [suggestion]
    of the adversary we have committed. And <strong>those who have been the leaders
    of sedition and disagreement ought to have respect to the common hope. For <mark>such
    as live in fear and love would rather that they themselves than their neighbours
    should be involved in suffering*</mark>. And <mark>they prefer to bear blame themselves,
    rather than that the concord which has been well and piously handed down to us
    should suffer</mark>. For it is better that a man should acknowledge his transgressions
    than that he should harden his heart, as the hearts of those were hardened who
    stirred up sedition against Moses the servant of God, and whose condemnation was
    made manifest [unto all]. For they went down alive into Hades, and death swallowed
    them up (Num. 16).</strong></p><p>&lt;…&gt;</p><p><strong><mark>Who then among
    you is noble-minded? who compassionate? who full of love? Let him declare, “If
    on my account sedition and disagreement and schisms have arisen, I will depart,
    I will go away whithersoever ye desire, and I will do whatever the majority commands;
    only let the flock of Christ live on terms of peace with the presbyters set over
    it.”</mark></strong> He that acts thus shall procure to himself great glory in
    the Lord; and every place will welcome him. For “the earth is the Lord’s, and
    the fulness thereof” (Ps. 24:1). These things they who live a godly life, that
    is never to be repented of, both have done and always will do.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-21">The First Epistle of Clement
    to the Corinthians, 21, 14, 51, 54</a>)</p><p>*Probably a reference to:</p><blockquote><p>“Now
    therefore, it is already an utter failure for you that you go to law against one
    another. <strong>Why do you not rather accept wrong? Why do you not rather let
    yourselves be cheated?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L7">1
    Cor. 6:7</a>)</p></blockquote><h3>St Ignatius of Antioch (Theophorus), hieromartyr
    (c. 35–107)</h3><blockquote><p>“<strong><mark>Have a regard to preserve unity,
    than which nothing is better</mark></strong>. Bear with all, even as the Lord
    does with thee.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Pol#HH-5">To
    Polycarp, 5</a>)</p><blockquote><p>“…which I salute in the blood of Jesus Christ,
    who is our eternal and enduring joy, especially if [men] are in <strong>unity
    with the bishop, the presbyters, and the deacons, who have been appointed according
    to the mind of Jesus Christ</strong>, &lt;…&gt; For <strong>there are many wolves
    that appear worthy of credit, who, by means of a pernicious pleasure, carry captives
    those that are running towards God; but in your unity they shall have no place</strong>.
    &lt;…&gt; For as many as are of God and of Jesus Christ are also with the bishop.
    And as many as <strong>shall, in the exercise of repentance, return into the unity
    of the Church, these, too, shall belong to God</strong>, that they may live according
    to Jesus Christ. Do not err, my brethren. <strong>If any man follows him that
    makes a schism in the Church, he shall not inherit the kingdom of God</strong>.
    &lt;…&gt; Now, <strong>some suspected me of having spoken thus, as knowing beforehand
    the division caused by some among you. But He is my witness, for whose sake I
    am in bonds, that I got no intelligence from any man. But the Spirit proclaimed
    these words</strong>: Do nothing without the bishop; keep your bodies as the temples
    of God; <strong><mark>love unity; avoid divisions</mark></strong>; be the followers
    of Jesus Christ, even as He is of His Father. <strong>I therefore did what belonged
    to me, as a man devoted to unity</strong>. <strong><mark>For where there is division
    and wrath, God doth not dwell</mark></strong>. <strong>To all them that repent,
    the Lord grants forgiveness, if they turn in penitence to the unity of God, and
    to communion with the bishop</strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Ph#HH-0">To
    Philadelphians, salutation, 2, 3, 7, 8</a>)</p><blockquote><p>“For as one who
    has been thought worthy of the most honourable of all names, in those bonds which
    I bear about, I commend the Churches, in which <strong>I pray for a union both
    of the flesh and spirit of Jesus Christ</strong>, the constant source of our life,
    and <strong>of faith and love</strong>, to which nothing is to be preferred, &lt;…&gt;
    <strong><mark>Let nothing exist among you that may divide you; but be ye united</mark>
    with your bishop</strong>, and those that preside over you, as a type and evidence
    of your immortality. As therefore <strong>the Lord did nothing without the Father,
    being united to Him, neither by Himself nor by the apostles, so neither do ye
    anything without the bishop and presbyters</strong>. &lt;…&gt; Be ye subject to
    the bishop, and to one another, as Jesus Christ to the Father, according to the
    flesh, and the apostles to Christ, and to the Father, and to the Spirit; <strong><mark>that
    so there may be a union both fleshly and spiritual</mark></strong>.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Mg#HH-1">To Magnesians, 1, 6, 7, 13</a>)</p><blockquote><p>“May
    I always have joy of you, if indeed I be worthy of it. It is therefore befitting
    that you should in every way glorify Jesus Christ, who hath glorified you, that
    by a unanimous obedience ‘<strong>ye may be perfectly joined together in the same
    mind, <mark>and in the same judgment, and may all speak the same thing</mark></strong>,’
    &lt;…&gt; Wherefore it is fitting that ye should run together in accordance with
    the will of your bishop, which thing also ye do. For your justly renowned presbytery,
    worthy of God, is fitted as exactly to the bishop as the strings are to the harp.
    Therefore in <strong>your concord and harmonious love, Jesus Christ is sung</strong>.
    <strong><mark>And do ye, man by man, become a choir</mark></strong>, that being
    harmonious in love, and taking up the song of God in unison, ye may with one voice
    sing to the Father through Jesus Christ, <strong><mark>so that He may both hear
    you, and perceive by your works that ye are indeed the members of His Son</mark></strong>.
    It is <strong><mark>profitable, therefore, that you should live in an unblameable
    unity, that thus ye may always enjoy communion with God</mark></strong>. For if
    I in this brief space of time, have enjoyed such fellowship with your bishop —
    I mean not of a mere human, but of a spiritual nature — how much more do I reckon
    you happy who are so joined to him as the Church is to Jesus Christ, and as Jesus
    Christ is to the Father, <strong><mark>that so all things may agree in unity</mark></strong>!
    Let no man deceive himself: <strong>if any one be not within the altar, he is
    deprived of the bread of God</strong>. For if the prayer of one or two possesses
    such power, how much more that of the bishop and the whole Church! <strong>He,
    therefore, that does not assemble with the Church, has even by this manifested
    his pride, and condemned himself</strong>. For it is written, “God resisteth the
    proud.” Let us be careful, then, not to set ourselves in opposition to the bishop,
    in order that we may be subject to God.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-2">To
    Ephesians, 2, 4, 5</a>)</p><h3>The author of the Didache (late 1st – early 2nd
    c.)</h3><blockquote><p>My child, remember night and day him who speaks the word
    of God to you, and honor him as you do the Lord. For wherever the lordly rule
    is uttered, there is the Lord. And seek out day by day the faces of the saints,
    in order that you may rest upon their words. <strong><mark>Do not long for division,
    but rather bring those who contend to peace</mark></strong>. Judge righteously,
    and do not respect persons in reproving for transgressions.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Didache#HH-4">The Didache, 4</a>)</p><h2>2nd
    century</h2><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>He
    shall also judge false prophets, who, without having received the gift of prophecy
    from God, and not possessed of the fear of God, but either for the sake of vainglory,
    or with a view to some personal advantage, or acting in some other way under the
    influence of a wicked spirit, pretend to utter prophecies, while all the time
    they lie against God.</p><p>7. He shall also judge <strong><mark>those who give
    rise to schisms, who are destitute of the love of God, and who look to their own
    special advantage rather than to the unity of the Church</mark></strong>; and
    who for trifling reasons, or any kind of reason which occurs to them, cut in pieces
    and <strong><mark>divide the great and glorious body of Christ</mark></strong>,
    and so far as in them lies, [positively] destroy it, — <strong><mark>men who prate
    of peace while they give rise to war</mark></strong>, and do in truth strain out
    a gnat, but swallow a camel (Matt. 23:24). For no reformation of so great importance
    can be effected by them, as will compensate for the <strong><mark>mischief arising
    from their schism</mark></strong>. He shall also judge all those who are beyond
    the pale of the truth, that is, who are outside the Church</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-33">Against
    Heresies, Book IV, ch. 33, 7</a>)</p><blockquote><p><em>Wherefore it is incumbent
    to obey the presbyters who are in the Church, those who, as I have shown, possess
    the succession from the apostles; those who, together with the succession of the
    episcopate, have received the certain gift of truth, according to the good pleasure
    of the Father. But [it is also incumbent] to hold in suspicion others</em><strong><em><mark>who
    depart from the primitive succession, and assemble themselves together in any
    place whatsoever, [looking upon them] either as heretics of perverse minds, or
    as schismatics</mark></em></strong><em> puffed up and self-pleasing, or again
    as hypocrites, acting thus for the sake of lucre and vainglory.</em><strong><em>
    </em></strong>For all these have fallen from the truth. And the heretics, indeed,
    who bring strange fire to the altar of God — namely, strange doctrines — shall
    be burned up by the fire from heaven, as were Nadab and Abiud (Lev. 10:1–2). But
    such as rise up in opposition to the truth, and exhort others against the Church
    of God, [shall] remain among those in hell (apud inferos), being swallowed up
    by an earthquake, even as those who were with Chore, Dathan, and Abiron (Num.
    16:33). <em>But </em><strong><em><mark>those who cleave asunder, and separate
    the unity of the Church, [shall] receive from God the same punishment</mark></em></strong><em>
    as Jeroboam did (1 Kings 14:10 ff.).</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-26">Against
    Heresies, Book IV, ch. 26, 2</a>)</p><h3>Clement of Alexandria, presbyter (c.
    150–215)</h3><blockquote><p>Yet it is not difficult to show that <strong>their
    worldly assemblies arose later than the Catholic Church</strong>. (4) The preaching
    of the Saviour after His coming to earth began under Augustus and ended about
    the middle of the reign of Tiberius. The preaching of the apostles, including
    the ministry of Paul, ended under Nero. The first heresiarchs appeared later,
    approximately in the times of the emperor Hadrian. The emergence of new heresies
    continued until the reign of Antoninus the Elder. It was then, for example, that
    Basilides lived, although he and his followers boastfully assert that he was a
    disciple of Glaucias, the interpreter of Peter. They also say that Valentinus
    had as his teacher a certain Theudas (Θευδα), a disciple of Paul. (107, 1) Marcion,
    who lived at almost the same time, was already old in comparison with the others,
    who were younger. And Simon alone could have listened to Peter for some time.
    (2) All this clearly proves that <strong>the sects were formed by separation from
    the ancient and true Church at a later time, and that some, in their turn, separated
    from these, branding themselves with the shame of apostasy. (3) From what has
    been said, I think it is clear that there is only one true Church — the one to
    which the primacy belongs by right. It is to her that all the righteous belong,
    by the will of God.</strong> (4) There is only one God, one Lord, and therefore
    it is supremely glorious and worthy of all respect that everything which manifests
    itself as unity, thereby imitating the <strong>unity of this first principle.
    <mark>In accordance with the nature of this One, the Church must by her very essence
    be one, and her division into a multitude of churches, to which the heretics strive,
    is violence done to her</mark></strong>. (5) <strong><mark>We affirm that in essence,
    in design, in origin and in pre-eminence the original and Catholic Church is one,
    which by the will of the one God, through the one Lord, unites all who are ready
    to accept the “unity of faith,” the one faith, established on special covenants,
    or rather, on one covenant for all times</mark></strong>. God predestined to this
    those of whom, from the beginning of the world, He knew that they would be righteous.
    (6) This pre-eminence of the Church, founded on the one first principle, which
    by reason of its uniqueness surpasses all else and cannot be compared with anything
    else, is a special subject, of which we shall speak separately.</p></blockquote><p>(Stromata,
    Book VII, ch. 17)</p><h3>Hegesippus (c. 100–180)</h3><blockquote><p><em>1. Hegesippus
    in the five books of Memoirs which have come down to us has left a most complete
    record of his own views. In them he states that on a journey to Rome he </em><strong><em><mark>met
    a great many bishops, and that he received the same doctrine from all</mark></em></strong><em>.
    It is fitting to hear what he says after making some remarks about the epistle
    of Clement to the Corinthians:</em></p><p><em>2. “</em><strong><em>And the church
    of Corinth continued in the true faith until Primus was bishop in Corinth. I conversed
    with them on my way to Rome, and abode with the Corinthians many days, during
    which we were mutually refreshed in the true doctrine.</em></strong></p><p><strong><em>3.
    And when I had come to Rome I remained there until Anicetus, whose deacon was
    Eleutherus. And Anicetus was succeeded by Soter, and he by Eleutherus. In every
    succession, and in every city that is held which is preached by the law and the
    prophets and the Lord</em></strong><em>.”</em></p><p><em>4. The same author also
    describes the beginnings of the heresies which arose in his time, in the following
    words: “</em><strong><em>And after James the Just had suffered martyrdom, as the
    Lord had also on the same account, Symeon, the son of the Lord’s uncle, Clopas,
    was appointed the next bishop. All proposed him as second bishop because he was
    a cousin of the Lord. Therefore, they called the Church a virgin, for it was not
    yet corrupted by vain discourses.</em></strong></p><p><strong><em>5. But <u>Thebuthis,
    because he was not made bishop, began to corrupt it</u>. He also was sprung from
    the seven sects among the people, like <u>Simon</u>, from whom came the Simonians,
    and <u>Cleobius</u>, from whom came the Cleobians, and <u>Dositheus</u>, from
    whom came the Dositheans, and <u>Gorthæus</u>, from whom came the Goratheni, and
    Masbotheus, from whom came the Masbothæans. From them sprang the <u>Menandrianists,
    and Marcionists, and Carpocratians, and Valentinians, and Basilidians, and Saturnilians</u>.
    <mark>Each introduced privately and separately his own peculiar opinion</mark>.</em></strong></p><p><strong><em>6.
    From them came false Christs, false prophets, false apostles, who <mark>divided
    the unity of the Church</mark> by corrupt doctrines uttered against God and against
    his Christ</em></strong><em>.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-4#HH-Hegesippus-and-the-Events-which-he-mentions">Eusebius
    of Caesarea, The Church History, 4.22</a>)</p><h2>3rd century</h2><h3>St Cyprian
    of Carthage, hieromartyr (c. 200–258)</h3><blockquote><p>And therefore, because
    there can be nothing common to falsehood and truth, to darkness and light, to
    death and immortality, to Antichrist and Christ, we ought by all means to <strong><mark>maintain
    the unity of the Catholic Church</mark></strong>, and not to give way to the enemies
    of faith and truth in any respect.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Quintus-Concerning-the-Baptism-of-Heretics">Epistle
    70, to Quintus, concerning the baptism of heretics</a>)</p><blockquote><p><em>And
    now a deserter and a fugitive from the Church, as if to have changed the clime
    were to change the man, he goes on to boast and announce himself a confessor,
    although he can no longer either be or be called a confessor of Christ who has
    denied Christ’s Church. For when the Apostle Paul says, “For this cause shall
    a man leave his father and mother, and shall cleave unto his wife; and they two
    shall be one flesh. This is a great mystery; but I speak concerning Christ and
    the Church;” (Eph. 5:31–32) — when, I say, the blessed apostle says this, and
    with his sacred voice testifies to the </em><strong><em><mark>unity of Christ
    with the Church</mark></em></strong><em>, cleaving to one another with indivisible
    links, </em><strong><em><mark>how can he be with Christ who is not with the spouse
    of Christ, and in His Church?</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-Cyprians-Answer-to-Cornelius-Concerning-the-Crimes-of-Novatus">Epistle
    48, to Cornelius, concerning the crimes of Novatus</a>)</p><blockquote><p><strong><em><mark>Whoever
    is separated from the Church and is joined to an adulteress, is separated from
    the promises of the Church; nor can he who forsakes the Church of Christ attain
    to the rewards of Christ</mark>. He is a stranger; he is profane; he is an enemy.
    </em>He can no longer have God for his Father, who has not the Church for his
    mother</strong>. If any one could escape who was outside the ark of Noah, then
    he also may escape who shall be outside of the Church<em>. The Lord warns, saying,
    “He who is not with me is against me, and he who gathereth not with me scattereth.”
    (Matt. 12:30) </em><strong><em><mark>He who breaks the peace and the concord of
    Christ, does so in opposition to Christ; he who gathereth elsewhere than in the
    Church, scatters the Church of Christ</mark></em></strong><em>. The Lord says,
    “I and the Father are one;” (John 10:30) and again it is written of the Father,
    and of the Son, and of the Holy Spirit, “And these three are one.” (1 John 5:7)
    And does any one believe that this unity which thus comes from the divine strength
    and coheres in celestial sacraments, can be divided in the Church, and can be
    separated by the parting asunder of opposing wills? </em><strong><em><mark>He
    who does not hold this unity does not hold God’s law, does not hold the faith
    of the Father and the Son, does not hold life and salvation</mark></em></strong><em>.</em></p><p><em>This
    sacrament of unity, this bond of a concord inseparably cohering, is set forth
    where in the Gospel the coat of the Lord Jesus Christ is not at all divided nor
    cut, but is received as an entire garment, and is possessed as an uninjured and
    undivided robe by those who cast lots concerning Christ’s garment.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-on-the-unity-of-the-church">On the Unity
    of the Church, 6–7</a>)</p><blockquote><p><em>But if the flock is one, </em><strong><em>how
    can he be numbered among the flock who is not in the number of the flock</em></strong><em>?
    Or </em><strong><em>how can he be esteemed a pastor, who, — while the true shepherd
    remains and presides over the Church of God by successive ordination, — <mark>succeeding
    to no one, and beginning from himself, becomes a stranger and a profane person,
    an enemy of the Lord’s peace and of the divine unity</mark>, not dwelling in the
    house of God, that is, in the Church of God, in which none dwell except they are
    of one heart and one mind</em></strong><em>, since the Holy Spirit speaks in the
    Psalms, and says, “It is God who maketh men to dwell of one mind in a house” (Ps.
    68:6).</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Magnus-on-Baptizing-the-Novatians-and-Those-Who-Obtain-Grace-on-a-Sick-Bed">Epistle
    75, to Magnus, on baptizing the Novatians and those who obtain grace on a sick-bed</a>)</p><h2>4th
    century</h2><h3><a href="https://bibleox.com/en/en/w/BsGu_John_Chrysostom_Saint_4th_century">St
    John Chrysostom, archbishop of Constantinople (c. 347–407)</a></h3><blockquote><p>If
    therefore <strong><mark>we desire to have the benefit of that Spirit which is
    from the Head, let us cleave one to another</mark></strong>. For there are <strong>two
    kinds of separation from the body of the Church; the one, when we wax cold in
    love, the other, when we dare commit things unworthy of our belonging to that
    body; for in either way we cut ourselves off from the “fullness of Christ.” But
    if we are appointed to build up others also, what shall not be done to them who
    are first to make division</strong>? Nothing will so avail to divide the Church
    as love of power. <strong><mark>Nothing so provokes God’s anger as the division
    of the Church</mark></strong>. <strong><mark>Yea, though we have achieved ten
    thousand glorious acts, yet shall we, if we cut to pieces the fullness of the
    Church, suffer punishment no less sore than they who mangled His body</mark></strong>.
    For that indeed was brought to pass for the benefit of the world, even though
    it was done with no such intention; whereas this produces no advantage in any
    case, but the injury is excessive. <strong><mark>These remarks I am addressing
    not to the governors only, but also to the governed</mark></strong>. Now a certain
    holy man said what might seem to be a bold thing; yet, nevertheless, he spoke
    it out. What then is this? He said, that <strong><mark>not even the blood of martyrdom
    can wash out this sin</mark></strong>. For tell me for what dost thou suffer as
    a martyr? Is it not for the glory of Christ? Thou then that yieldest up thy life
    for Christ’s sake, how dost thou lay waste the Church, for whose sake Christ yielded
    up His life? Hear what Paul saith, “I am not meet to be called an Apostle (1 Cor.
    15:9.), because I persecuted the Church of God and made havoc of it.” (Gal. 1:13.)
    <strong>This injury is not less than that received at the hands of enemies, nay,
    it is far greater</strong>. For that indeed renders her even more glorious, whereas
    this, when she is warred upon by her own children, disgraces her even before her
    enemies. Because it seems to them a great mark of hypocrisy, that those who have
    been born in her, and nurtured in her bosom, and have learned perfectly her secrets,
    that these should of a sudden change, and do her enemies’ work.</p><p><strong><em><mark>I
    mean these remarks for those who give themselves up indiscriminately to the men
    who are dividing the Church</mark></em></strong><em>. </em><strong><em><mark>For
    if on the one hand those men have doctrines also contrary to ours, then on that
    account further it is not right to mix with them: if, on the other hand, they
    hold the same opinions, the reason for not mixing with them is greater still.
    And why so?</mark></em></strong><em> Because then </em><strong><em>the disease
    is from lust of authority</em></strong><em>. </em><strong><em><mark>Know ye not
    what was the fate of Korah, Dathan, and Abiram? (Num. 16:1–35.) Of them only did
    I say? Was it not also of them that were with them? What wilt thou say? Shall
    it be said, “Their faith is the same, they are orthodox as well as we”? If so,
    why then are they not with us?</mark></em></strong><em> There is “one Lord, one
    faith, one baptism.” If their cause is right, then is ours wrong; if ours is right,
    then is theirs wrong. “Children,” saith he, “tossed to and fro, and carried about
    with every wind.” Tell me, dost thou think this is enough, to say that they are
    orthodox? </em><strong><em>Is then the ordination of clergy past and done away?
    And what is the advantage of other things, if this be not strictly observed?</em></strong><em>
    </em><strong><em>For as we must needs contend for the faith; so must we for this
    also.</em></strong><em> </em><strong><em>For if it is lawful for any one, according
    to the phrase of them of old, “to fill his hands,” and to become a priest, let
    all approach to minister. In vain has this altar been raised, in vain the fullness
    of the Church, in vain the number of the priests. Let us take them away and destroy
    them.</em></strong><em> “God forbid!” ye will say. You are doing these things,
    and do ye say, “God forbid”? How say ye, “God forbid,” when the very things are
    taking place? </em><strong><em><mark>I speak and testify, not looking to my own
    interest, but to your salvation</mark></em></strong>.</p><p>&lt;…&gt;</p><p>For
    this cause do we also say these things, these things do we assert, that it may
    not be in your power in that day to say, “No one told us, no one gave us commandment,
    we were ignorant, we thought it was no sin at all.” Therefore I assert and protest,
    that <strong><mark>to make a schism in the Church is no less an evil than to fall
    into heresy</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-ephesians-2#HH-Ephesians-44-7">Homilies
    on Ephesians, Homily 11</a>)</p><h2>Heretics from the very beginning visibly tore
    apart the unity of the Church</h2><h3>Hegesippus (c. 100–180)</h3><blockquote><p><em>1.
    Hegesippus in the five books of Memoirs which have come down to us has left a
    most complete record of his own views. In them he states that on a journey to
    Rome he </em><strong><em><mark>met a great many bishops, and that he received
    the same doctrine from all</mark></em></strong><em>. It is fitting to hear what
    he says after making some remarks about the epistle of Clement to the Corinthians:</em></p><p><em>2.
    “</em><strong><em>And the church of Corinth continued in the true faith until
    Primus was bishop in Corinth. I conversed with them on my way to Rome, and abode
    with the Corinthians many days, during which we were mutually refreshed in the
    true doctrine.</em></strong></p><p><strong><em>3. And when I had come to Rome
    I remained there until Anicetus, whose deacon was Eleutherus. And Anicetus was
    succeeded by Soter, and he by Eleutherus. In every succession, and in every city
    that is held which is preached by the law and the prophets and the Lord</em></strong><em>.”</em></p><p><em>4.
    The same author also describes the beginnings of the heresies which arose in his
    time, in the following words: “</em><strong><em>And after James the Just had suffered
    martyrdom, as the Lord had also on the same account, Symeon, the son of the Lord’s
    uncle, Clopas, was appointed the next bishop. All proposed him as second bishop
    because he was a cousin of the Lord. Therefore, they called the Church a virgin,
    for it was not yet corrupted by vain discourses.</em></strong></p><p><strong><em>5.
    But <u>Thebuthis, because he was not made bishop, began to corrupt it</u>. He
    also was sprung from the seven sects among the people, like <u>Simon</u>, from
    whom came the Simonians, and <u>Cleobius</u>, from whom came the Cleobians, and
    <u>Dositheus</u>, from whom came the Dositheans, and <u>Gorthæus</u>, from whom
    came the Goratheni, and Masbotheus, from whom came the Masbothæans. From them
    sprang the <u>Menandrianists, and Marcionists, and Carpocratians, and Valentinians,
    and Basilidians, and Saturnilians</u>. <mark>Each introduced privately and separately
    his own peculiar opinion</mark>.</em></strong></p><p><strong><em>6. From them
    came false Christs, false prophets, false apostles, who <mark>divided the unity
    of the Church</mark> by corrupt doctrines uttered against God and against his
    Christ</em></strong><em>.”</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-4#HH-Hegesippus-and-the-Events-which-he-mentions">Eusebius
    of Caesarea, The Church History, 4.22</a>)</p>'
