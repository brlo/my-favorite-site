    parent: The Church as mediator of salvation
    title: The necessity of works for salvation
    priority: 10
  body: |
    <h2>1st century</h2><h3>St Clement of Rome, hieromartyr († c. 101)</h3><p>In his First Epistle St Clement writes that we are justified by faith, and not by works. Yet further on he writes that for salvation not only faith but also works are necessary.</p><p>Opponents of the Church fasten here only on the phrase about justification by faith: “<strong><em>not justified by ourselves</em></strong><em>, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but </em><strong><em>by faith</em></strong>”. Yet further on it is clearly written that it is possible to partake of the promised gifts only by seeking the will of God and <strong>fulfilling it, having put away unrighteousness and iniquity and living without sin</strong> — “<em>this is the way, beloved, in which we find our salvation</em>”. That is, those who do not do the will of God, according to these words, will not be saved by faith alone:</p><blockquote><p>Let us clothe ourselves with concord and humility, ever exercising self-control, standing far off from all whispering and evil-speaking, <strong>being justified by our works</strong>, and not our words.</p>
    <p>&lt;…&gt;</p>
    <p><em>And we, too, being called by His will in Christ Jesus, </em><strong><em>are not justified</em></strong><em> by ourselves, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but </em><strong><em>by that faith</em></strong><em> through which, from the beginning, Almighty God has justified all men; to whom be glory for ever and ever. Amen.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><strong><em>What shall we do</em></strong><em>, then, brethren? Shall we become slothful in well-doing, and cease from the practice of love? </em><em>God forbid that any such course should be followed by us! But rather </em><strong><em>let us hasten with all energy and readiness of mind to perform every good work</em></strong><em>.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>We see, then, how </em><strong><em>all righteous men have been adorned with good works</em></strong><em>, and how the Lord Himself, adorning Himself with His works, rejoiced. Having therefore such an example, let us without delay accede to His will, and </em><strong><em>let us work the work of righteousness with our whole strength</em></strong><em>.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><strong><em>The good servant receives the bread of his labour</em></strong><em> with confidence; </em><strong><em>the lazy and slothful cannot look his employer in the face</em></strong><em>. It is requisite, therefore, that </em><strong><em>we be prompt in the practice of well-doing</em></strong><em>; for of Him are all things. And thus He forewarns us: “Behold, the Lord [cometh], and His reward is before His face, to </em><strong><em>render to every man according to his work</em></strong><em>.” (Isa. 40:10, 62:11; Rev. 22:12)</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>Let us therefore </em><strong><em><mark>earnestly strive</mark></em></strong><em> to be found in the number of those that wait for Him, </em><strong><em><mark>in order that we may share</mark></em></strong><em> in His promised gifts. </em><strong><em><mark>But how</mark></em></strong><em>, beloved, shall this be done?</em></p>
    <p><em>1) If our understanding be fixed by faith rewards God;</em></p>
    <p><em>2) if we earnestly seek the things which are pleasing and acceptable to Him;</em></p>
    <p><em>3) </em><strong><em><mark>if we do</mark></em></strong><em> the things which are in harmony with His blameless will; and </em><strong><em>if we follow the way of truth, casting away from us all unrighteousness and iniquity</em></strong><em>, along with all covetousness, strife, evil practices, deceit, whispering, and evil-speaking, all hatred of God, pride and haughtiness, vainglory and ambition. For </em><strong><em><mark>they that do</mark> such things are hateful to God,</em></strong><em> and not only they that do them, but also those that take pleasure in them that do them.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><strong><em><mark>This is the way, beloved, in which we find our Saviour</mark></em></strong></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>But who are His enemies? All the wicked, and those who set themselves to oppose the will of God.</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-30">The First Epistle of Clement to the Corinthians</a>). Translator’s note: in ch. 35 the English translation held in the library reads “fixed by faith rewards God”, evidently a corruption of “towards God” (the Greek has πιστῶς ἐν θεῷ, “faithfully in God”); at the end of ch. 36 the Greek has τὸ σωτήριον, “salvation”, where the translation reads “our Saviour”.</p>
    <blockquote><p><strong><em><mark>Let us, then, not only call Him Lord, for that will not save us.</mark></em></strong><em> For He saith, “Not every one that saith to me, Lord, Lord, shall be saved, but he that worketh righteousness.” (see </em>Matt. 7:21)<em>. </em><strong><em>Wherefore, brethren, <mark>let us confess Him by our works, </mark>by loving one another, by not committing adultery, or speaking evil of one another, or cherishing envy; but being continent, compassionate, and good. We ought also to sympathize with one another, and not be avaricious. By such works <mark>let us confess Him,</mark></em></strong> <em></em><strong><em>and not by those that are of an opposite kind. And it is not fitting that we should fear men, but rather God.</em></strong><em> For this reason, if we should do such [wicked] things, the Lord hath said, “Even though ye were gathered together to me in my very bosom, yet if ye were not to keep my commandments, I would cast you off, and say unto you: </em><em><u></u></em><em>Depart from me; I know you not whence ye are, ye workers of iniquity”.</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor2#HH-4">The Second Epistle of Clement to the Corinthians</a>)</p>
    <h3>Author of the “Epistle of Barnabas” (1st–2nd c.)</h3>
    <blockquote><p><strong><em><mark>The way of light</mark>, then, is as follows. If any one desires to travel to the appointed place</em></strong><em>, he must be </em><strong><em><mark>zealous in his works</mark></em></strong></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/Epistle_of_Barnabas#HH-19">Epistle of Barnabas, 19</a>)</p>
    <blockquote><p><em>It is well, therefore, that he who has learned </em><strong><em><mark>the judgments of the Lord</mark></em></strong><em>, as many as have been written, should walk in them. For </em><strong><em><mark>he who keepeth these shall be glorified</mark></em></strong><em> in the kingdom of God; </em><strong><em><mark>but he who chooseth other things shall be destroyed</mark></em></strong><em> with his works. On this account there will be a resurrection, on this account a retribution.</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/Epistle_of_Barnabas#HH-21">Epistle of Barnabas, 21</a>)</p>
    <h3>The Didache (late 1st – early 2nd c.)</h3>
    <p>In the Didache only two ways are given (of life and of death). First the works of the way of life are enumerated in detail, then the works of the way of death. At the end it is said that the whole time of faith will not profit a man if he is not found perfect at the end of his way. Evidently it is in works that one must be found perfect, because the whole span of human life under consideration is already called the time of faith (that is, the man has believed all that time):</p>
    <blockquote><p>“There are <strong>two ways, one of life and one of death</strong>, but a great difference between the two ways.<strong> The way of life, then, is this: (here the works of the way of life are enumerated in detail — note)</strong> First, you shall love God who made you; second, love your neighbor as yourself, and do not do to another what you would not want done to you. &lt;…&gt; <strong>And the way of death is this (here the works of the way of death are enumerated in detail — note).</strong> First of all it is evil and accursed: murders, adultery, lust, fornication, thefts, idolatries, magic arts, witchcrafts, rape, false witness, hypocrisy, double-heartedness, deceit, haughtiness, depravity, self-will, greediness, filthy talking, jealousy, over-confidence, loftiness, boastfulness; persecutors of the good, hating truth, loving a lie, <strong>not knowing a reward for righteousness</strong>, not cleaving to good nor to righteous judgment, watching not for that which is good, but for that which is evil; from whom meekness and endurance are far, loving vanities, pursuing revenge, not pitying a poor man, not laboring for the afflicted, not knowing Him Who made them, murderers of children, destroyers of the handiwork of God, turning away from him who is in want, afflicting him who is distressed, advocates of the rich, lawless judges of the poor, utter sinners. Be delivered, children, from all these. &lt;…&gt; But come together often, seeking the things which are befitting to your souls: for <strong><mark>the whole time of your faith will not profit you, if you are not made perfect in the last time</mark></strong>” (<a href="https://bibleox.com/en/en/w/Didache#HH-1">The Didache, 1–2, 16</a>)</p>
    </blockquote>
    <h2>2nd century</h2><h3><a href="https://bibleox.com/en/en/w/Polycarp-of-Smyrna">St Polycarp of Smyrna, hieromartyr (69–155)</a></h3>
    <p>Following the Apostle Paul (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L8-9">Eph. 2:8-9</a>), St Polycarp tells the Church that we are saved by grace, and not by works — that is, the possibility of salvation is opened to men freely through the sacrifice of the Cross and the resurrection of the Lord Jesus Christ, and is not earned by our works. Yet this freely opened way has to be walked — one must labour to accomplish the work. Therefore he is not saved who does not do the will of God and does not walk according to the commandments. Such will not attain to the resurrection of life, but will be condemned to eternal suffering:</p>
    <blockquote><p>“You, ‘not having seen Him, believe, and believing, rejoice with joy unspeakable and full of glory’ (1 Pet. 1:8), which many desire to attain, knowing that <strong>you are saved by grace, not by works</strong> (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L8-9">Eph. 2:8-9</a>), but by the will of God through Jesus Christ.”</p>
    </blockquote>
    <p>(The Epistle of Polycarp to the Philippians, 1)</p>
    <blockquote><p>“He who raised Him from the dead <strong><mark>will raise us also, </mark><u><mark>if</mark></u><mark> we do His will</mark></strong>, <strong><mark>walk according to His commandments</mark></strong> and <strong>love what He loves; <mark>if we keep ourselves from all unrighteousness</mark>, from covetousness, from the love of money, from evil speaking, from false witness, ‘not rendering evil for evil’, nor reviling for reviling (1 Pet. 3:9), nor blow for blow, nor curse for curse, and if we remember what the Lord taught, saying: ‘Judge not, that ye be not judged’ (Matt. 7:1). Forgive, and it shall be forgiven you (Luke 6:37; Matt. 6:12, 14). Be merciful, that ye may obtain mercy. ‘With what measure ye mete, it shall be measured to you again’ (Matt. 7:2; Luke 6:38). And blessed are the poor and they that are persecuted for righteousness’ sake, for theirs is the kingdom of God (Matt. 5:3, 10; Luke 6:20).”</strong></p>
    </blockquote>
    <p>(The Epistle of Polycarp to the Philippians, 2)</p>
    <blockquote><p>Thus, knowing that God is not mocked (Gal. 6:7), <strong>we must walk worthy of His commandment</strong> and glory. Likewise the deacons must be blameless before righteousness, as servants of God and Christ, and not of men; not slanderers, not double-tongued, not lovers of money, temperate in all things, compassionate, diligent; <strong><mark>they must walk according to the truth</mark></strong> of the Lord, who became the servant of all; from whom, <strong><mark>if we please Him in this present age, we shall receive also the age to come</mark></strong>, inasmuch as He promised that He will raise us from the dead, and that <strong><mark>if we live worthy of Him and believe in Him, we shall also reign with Him</mark></strong>. Likewise the young men <strong>must be blameless in all things</strong>, above all careful of chastity and <strong>keeping themselves from every vice</strong>.</p>
    </blockquote>
    <p>(The Epistle of Polycarp to the Philippians, 5)</p>
    <h3>St Justin the Philosopher, martyr (c. 100–165)</h3>
    <blockquote><p><em>We desire the eternal and pure life, we strive for the abode with God, the Father and Creator of all the world, and hasten to confess our faith, being persuaded and believing that such </em><strong><em><mark>a reward can be attained by those who have testified before God by their deeds</mark> to their faithfulness in serving Him and their love for the life with Him</em></strong><em>, which is inaccessible to evil.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>God, knowing beforehand the future deeds of all men, and determining in Himself that </em><strong><em>every man must receive a recompense <mark>according to the worth of his deeds</mark></em></strong><em>, foretells through the prophetic Spirit that </em><strong><em>they shall receive from Him in accordance <mark>with the worth of their deeds</mark></em></strong></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>we strive for the abode with God, the Father and Creator of all the world, and hasten to confess our faith, being persuaded and believing that </em><strong><em>such a reward can be attained by those who <mark>by their deeds</mark> have testified before God to their faithfulness</em></strong><em> in serving Him and their love for the life with Him, which is inaccessible to evil.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><strong><em>if <mark>by their own deeds</mark> they are found worthy of His purpose, they shall be deemed worthy to live with Him</em></strong><em> and to reign with Him, having been freed from corruption and suffering. For as He created us in the beginning, when we did not exist, so, we think, those who have chosen what is pleasing to Him He will deem worthy, for this choice, of incorruption and of dwelling with Himself</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>we hold the teaching that neither the evildoer, nor the covetous, nor the schemer, nor the virtuous man can hide from God, and that </em><strong><em>each one <mark>according to the quality of his deeds</mark> shall receive eternal torment or salvation</em></strong><em>.</em></p>
    <p><em>If all men knew this, no one would choose evil for the brief time of life, knowing that he goes to eternal condemnation by fire, but would by all means </em><strong><em><mark>restrain himself</mark> and <mark>adorn himself with virtue</mark>, <mark>in order to receive</mark> the good things of God and to escape the punishments</em></strong><em>.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><strong><em>If, then, there are any who do not live as Christ taught, it will be known that they are not Christians, although they profess with the tongue the teaching of Christ</em></strong><em>: for He taught that </em><strong><em><mark>those are not saved who only speak, but those who also do the deeds</mark></em></strong><em>. He said so: </em><strong><em>“not every one who says to Me, Lord, Lord</em></strong><em>, shall enter into the kingdom of heaven, but he who does the will of My Father who is in heaven. For he who hears Me and does what I say, hears Him who sent Me. </em><strong><em>Many will say to Me: Lord, Lord</em></strong><em>, have we not eaten and drunk in Thy name, and done wonders? And then I will say to them: Depart from Me, ye workers of iniquity. Then there shall be weeping and gnashing of teeth, when the righteous shall shine as the sun, and the unrighteous shall be sent into eternal fire. Many shall come in My name, outwardly clothed in sheepskins, but inwardly ravening wolves. But </em><strong><em><mark>ye shall know them by their deeds</mark></em></strong><em>. Every tree that does not bring forth good fruit is cut down and cast into the fire.” And we ask that those who </em><strong><em>do not live according to His teaching, but are only called Christians</em></strong><em>, be punished also by you.</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>we believe, or rather are fully persuaded, that </em><strong><em>each one <mark>according to his deeds</mark> will be punished</em></strong><em> with eternal fire, and according to the strength which each has received from God, </em><strong><em><mark>an account will be required of him</mark></em></strong><em>, as Christ said: “to whom God has given more, of him shall more be required.”</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>And we have been taught that </em><strong><em><mark>those only will attain to immortality who draw near to God in holiness of life and virtue</mark></em></strong><em>, while of those who live unrighteously and do not repent we believe that they will be tormented in eternal fire.</em></p>
    </blockquote>
    <p>(The First Apology)</p>
    <blockquote><p><em>And besides, they beguile themselves and you, </em><strong><em>supposing that the everlasting kingdom will be assuredly given to those of the dispersion who are of Abraham after the flesh, although they be sinners, and faithless, and disobedient towards God</em></strong><em>, which the Scriptures have proved is not the case. For if so, Isaiah would never have said this: ‘And unless the Lord of Sabaoth had left us a seed, we would have been like Sodom and Gomorrah.’ And Ezekiel: ‘Even if Noah, and Jacob, and Daniel were to pray for sons or daughters, their request should not be granted.’ But neither shall the father perish for the son, nor the son for the father; but </em><strong><em>every one for his own sin, and <u><mark>each shall be saved for his own righteousness</mark></u></em></strong><em>.’</em></p>
    <p><em>&lt;…&gt;</em></p>
    <p><em>God, wishing men and angels to follow His will, resolved to create them free to do righteousness; possessing reason, that they may know by whom they are created, and through whom they, not existing formerly, do now exist; and </em><strong><em>with a law that they should be <mark>judged by Him</mark>, if they do anything <mark>contrary to right reason</mark></em></strong><em>.</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-140">Dialogue with Trypho, 140–141</a>)</p>
    <h2>4th century</h2><h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3>
    <blockquote><p>God created all things visible, and gave them to men for rest and enjoyment, but He gave them also the law of righteousness. But since the coming of Christ God requires another fruit and another righteousness — purity of heart, a good conscience, profitable speech, honourable and good thoughts, and all that in which the Saints make progress. For the Lord says: “except your righteousness shall exceed the righteousness of the scribes and Pharisees, ye shall in no case enter into the kingdom of heaven” (Matt. 5:20). <strong>In the law it is written: thou shalt not commit adultery; but I say unto you: <mark>thou shalt not covet, thou shalt not be angry</mark></strong>. For <strong>he who intends to be a friend of God must <mark>keep himself from the defilement of sin</mark> and from the eternal fire that lurks within us. <mark>This makes us worthy of the kingdom</mark></strong>. Glory to His compassion, and to the good pleasure of the Father and of the Son and of the Holy Spirit which has been accomplished! Amen.</p>
    </blockquote>
    <p>(Spiritual Homilies, 13)</p>
    <blockquote><p><strong>the soul</strong> which the heavenly Bridegroom, Christ, betroths to Himself as a bride for mysterious and divine communion with Him, and which tastes the heavenly riches, <strong>must with great zeal sincerely please</strong> the Christ who has betrothed her to Himself, and <strong>perform the spiritual service entrusted to her in a due and fitting manner, so as to please</strong> God in all things, to grieve the Spirit in nothing, <strong>to keep in a proper manner</strong> perfect chastity and love for Christ, <strong>to conduct herself well</strong> in the house of the heavenly King, with all devotion to the grace that has been given. And behold, such a soul is set as mistress over all the good things of the Lord, and her very body receives glorification from the Divinity of Christ. But <strong><mark>if she sins in anything</mark>, and in her service acts contrary to duty, <mark>does not do what is pleasing</mark> to Christ, does not follow His will, does not co-operate with the grace of the Spirit present in her; then with mockery she is subjected to shameful dishonour and <mark>is cut off from life</mark>, as having become unfit and incapable of communion with the heavenly King</strong>. And for such a soul there is already sorrow, grief, and weeping among all the holy and rational spirits; the Angels, Powers, Apostles, Prophets, and Martyrs lament for her.</p>
    <p>3. As, according to the Lord’s saying, “there is joy in heaven over one sinner that repenteth” (Luke 15:7), so there is great sorrow and weeping in heaven over one soul that falls away from eternal life.</p>
    </blockquote>
    <p>(Spiritual Homilies, 15)</p>
    <blockquote><p>For <strong>we, while still on earth, have our dwelling in heaven</strong>, as inhabitants and citizens of one world in mind and in the inner man. As the visible eye, being pure, always sees the sun purely, so the mind, when perfectly purified, always sees the glory of the light — Christ — and abides with the Lord day and night, just as the body of the Lord, having been united with the Godhead, always abides together with the Holy Spirit. <strong><mark>But men do not reach this measure at once, and then only by labours, by sorrow, and by great struggle</mark></strong>. For <strong>there are also those within whom, although the grace that works and rests in them is present, vice also remains</strong>; and in one heart two kinds of life are active — the life of light and the life of darkness.</p>
    </blockquote>
    <p>(Spiritual Homilies, 17)</p>
    <h3>St Cyril of Jerusalem, bishop (315–386)</h3>
    <blockquote><p>2. <strong><mark>The pattern of piety consists in these two things: in the exact knowledge of the dogmas of piety, and in good works. Dogmas without good works are not acceptable to God; neither does He accept works if they are not founded on the dogmas of piety</mark>. For what is the profit of knowing well the teaching about God and shamefully committing fornication? On the other hand, what is the profit of being temperate as one ought and impiously blaspheming?</strong> Therefore the knowledge of the dogmas and the watchfulness of the soul is the greatest acquisition. Since many deceive by philosophy and vain falsehood: the pagans draw away those who turn to them by the sweetness of the tongue, honey drops from the lips of the harlot (see Prov. 5:3); <strong>the circumcised deceive by a perverse interpretation of the Divine Scripture, labouring at this from childhood to old age and growing old in ignorance; the followers of heretics by flattering and beautiful words deceive the hearts of simple people, under the name of Christ, as under honey, hiding the poison of ungodly opinions</strong> — of all these the Saviour says: take heed that no man deceive you (Matt. 24:4). For this there is instruction in the faith, for this its explanations are given.</p>
    </blockquote>
    <p>(Catechetical Lectures, 4.2)</p>
    <blockquote><p>Much could be said about faith, so that a whole day would not suffice us to discourse of it. Let us be content with one more Old Testament example, that of Abraham, since we too have become his sons through faith; he <strong>was justified not <mark>by works</mark> only, but also <mark>by faith</mark></strong>. Much, indeed, he also did, yet <strong>he was not called a friend of God before he believed, and every deed of his was accomplished by faith</strong>. By faith he left his parents. By faith he left his fatherland, and country, and house. Therefore, <strong><mark>as he</mark> was justified, so do thou also <u><mark>strive</mark></u><mark> to be justified</mark></strong>.</p>
    </blockquote>
    <p>(Catechetical Lectures, 5)</p>
    <h3>St Gregory of Nyssa, bishop (c. 331–394)</h3>
    <blockquote><p>Having woven righteousness together with faith, he prepares from them a breastplate for the armed man, excellently and safely guarding the warrior by both. But if faith and righteousness are separated one from the other, the weapon cannot become safe for him to whom it is given. And <strong><mark>faith without the works of righteousness is insufficient for salvation</mark>, and likewise the righteousness of life is not safe for salvation by itself, unless it is joined with faith</strong>. Therefore, as it were weaving certain substances in this weapon, faith and righteousness, the Apostle brings the receptacle of the heart into safety for the warrior; for by the breastplate the heart is meant.</p>
    </blockquote>
    <p>(Commentary on Ecclesiastes)</p>
    <p>And here St Gregory reasons that salvation is opened to mankind not for works — that is, not because men supposedly conducted themselves so well that God decided to be reconciled with them. No, on the contrary, men fell ever more and more into sin, and did not by good works deserve what the Saviour did for men. The possibility of salvation comes into the world as God’s gift to mankind, when men were still sinners:</p>
    <blockquote><p>“But if the assault of the enemies is heavy, yet by Thy assistance they shall be repelled; for salvation is given by Thee to men not for the works of righteousness, but by Thy grace alone. It is said: ‘in no wise’ shalt Thou save them (Ps. 56:7).”</p>
    </blockquote>
    <p>(On the Inscriptions of the Psalms, chapter 14)</p>
    <h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3>
    <blockquote><p>And what profit is it to us if we hear every day (of the commandments of God), yet do not care to fulfil them? Therefore <strong>I exhort all: <mark>let us hasten to good works, for otherwise it is impossible to be saved</mark>, let us cleanse our sins, and so be deemed worthy of mercy from the Master Himself</strong>, by the grace and love for mankind of our Lord Jesus Christ, with whom to the Father, together with the Holy and Life-giving Spirit, be glory now and ever, and unto the ages of ages. Amen.</p>
    </blockquote>
    <p>(Homilies on Genesis, 47.4)</p>
    <blockquote><p>“<strong>Let us then not permit ourselves</strong> by making this brief time a time of carelessness and remissness, to fall into everlasting punishment; but let us watch and be sober, <strong>let us do all things, and make it all our business to attain to that felicity, and to keep far from that river of fire</strong>, which rushes with a loud roaring before the terrible judgment seat. For he who has once been cast in there must remain for ever; there is no one to deliver him from his punishment, not father, not mother, not brother. And this the prophets themselves declared aloud; one saying, <em>Brother delivers not brother. Shall man deliver?</em> (Ps. 49:7). And Ezekiel has declared somewhat more than this, saying, <em>Though Noah, Daniel, and Job were in it, they shall deliver neither sons nor daughters</em> (Ezek. 14:16). <strong><mark>For one defense only, that through works, is there, and he who is deprived of that cannot be saved by any other means</mark></strong>. Revolving these things, then, and reflecting upon them continually, let us cleanse our life and make it lustrous, that we may see the Lord with boldness, and obtain the promised good things; through the grace and lovingkindness of our Lord Jesus Christ.”</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/9mEn_Homilies_on_the_Gospel_of_John#HH-12">Homilies on the Gospel of John, 12.3</a>)</p>
    <blockquote><p>“Let, for example, some simple man suffer countless evils from another, and let no one (for this) take revenge, but let them even do him good: what instruction will be stronger than this, what words, what exhortations? What fury will it not soften and quench? Knowing this, then, <strong><mark>let us love virtue, because it is impossible to be saved otherwise than by spending the present life in such good works as to be deemed worthy of the good things to come</mark></strong> — by the grace and love for mankind of our Lord Jesus Christ.”</p>
    </blockquote>
    <p>(Homilies on the Acts of the Apostles, 20.4)</p>
    <blockquote><p><strong>Wherefore I entreat and beseech, and lay hold of your very knees, that whilst we have this scant viaticum of life, you would be pricked in your hearts by what has been said, that you would be converted, that you would become better men; that we may not, like that rich man, lament to no purpose in that world after our departure, and continue thenceforth in incurable wailings</strong>. For though thou shouldest have father or son or friend or any soever who hath confidence towards God, <strong><mark>none of these shall ever deliver thee, thine own works having destroyed thee</mark>. For such is that tribunal: it <mark>judges by our actions alone, and in no other way is it possible there to be saved</mark></strong>. <strong><mark>And these things I say</mark></strong>, not to grieve you nor to throw you into despair, <strong><mark>but lest</mark></strong>, nourished by vain and cold hopes, and placing confidence in this person or that, <strong><mark>we should neglect our own proper goodness</mark></strong>.</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-5#HH-Homily-XLII">Homilies on First Corinthians, 42.3</a>)</p>
    <blockquote><p><em>“Many will say to Me in that day: Lord! Lord! have we not prophesied in Thy name”</em> (Matt. 7:22)? That is: not only is he <strong><mark>deprived of the kingdom of heaven who has faith but is negligent of his life</mark></strong>; but he will equally be shut out from its sacred gates who <strong>with faith has even worked many signs, but <mark>has done nothing good</mark></strong>. &lt;…&gt; In fact, He wishes here to show that <strong><mark>faith without works means nothing</mark></strong>; developing this thought further, He added the miracles too, showing thereby that not only faith, but <strong><mark>even miracles bring no profit to him who works them, if there is no virtue</mark></strong>.</p>
    </blockquote>
    <p>(Homilies on the Gospel of Matthew, 24)</p>
    <blockquote><p><strong><em>What then will be the good of his many austerities,</em></strong><em> when </em><strong><em>after such painful exercises</em></strong><em>, any one from the Priest’s great unskillfulness in argument </em><strong><em>fall into heresy, and be cut off from the body of the Church?</em></strong><em> A misfortune which I have myself seen many suffering. Of what profit then will his patience be to him? </em><strong><em>None</em></strong><em>; no more than there will be in </em><strong><em><mark>a sound faith if the life is corrupt</mark></em></strong><em>.</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-treatise-concerning-the-christian-priesthood#HH-Book-IV">Treatise Concerning the Christian Priesthood</a>)</p>
    <p>St John Chrysostom, although a believer, does not consider himself saved, but hopes to succeed in being saved. He says that it is impossible to be saved for one who does nothing for the salvation of his neighbour (that is, one cannot be saved without works):</p>
    <blockquote><p><strong>Chrysostom</strong>: I have indeed even now. For how is it possible for one who is a man, and who is living this toilsome life of ours, to be free from cares and conflict? But it is not quite the same thing for man to plunge into a boundless ocean and to cross a river, so great is the difference between these cares and those. For now, indeed, if I were able to become serviceable to others, I should wish it myself, and this would be a matter of prayer with me. But if it is not possible to help another, yet if it be practicable <strong>to <u>save</u> and rescue myself from the waves</strong>, I shall be contented.</p>
    <p><strong>Basil</strong>: Dost thou then think this to be a great thing? and dost thou fancy that <strong><mark>thou wilt be saved when thou art not profitable to any other?</mark></strong></p>
    <p><strong>Chrysostom</strong>: <strong>Thou hast spoken well and nobly, for I am not myself able to believe <mark>that it is possible for one who has </mark><u><mark>not labored</mark></u><mark> for the salvation of his fellow to be saved</mark></strong>, nor did it at all profit the wretched man in the Gospel <strong>that he had not diminished his talent; but he perished through not increasing it and bringing it doubled to his master</strong> (Matt. 25:24). Nevertheless, I think that <strong>my punishment will be milder when I am called to account, because I have not saved others, than it would be if I should destroy myself and others too by becoming far worse after so great an honor</strong>.</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-treatise-concerning-the-christian-priesthood#HH-Book-VI">Treatise Concerning the Christian Priesthood, 6.10</a>)</p>
    <blockquote><p>But if a servant placed under authority can improve his master, much more can the master his servants. Divide then with me, I beseech you, this ministry. I address all generally, do you each individual privately, and <strong><mark>let each charge himself with the salvation of his neighbors</mark></strong>.</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-second-thessalonians#HH-2-Thessalonians-33-5">Homilies on Second Thessalonians, 5.5</a>)</p>
    <blockquote><p>2 Thess. 3:3-5. But the Lord is faithful, who shall stablish you, and guard you from the evil one. And we have confidence in the Lord touching you that ye both do and will do the things which we command you. And the Lord direct your hearts into the love of God, and into the patience of Christ.</p>
    <p>1. <strong>We must not, on the one hand, committing everything to the prayers of the saints, ourselves remain in idleness and strive after vice and do nothing of what leads to virtue, nor, on the other hand, when doing good, must we despise this help. Great, truly great is the power of the prayer which is offered for us (to God), but only when we ourselves also struggle</strong>. Therefore Paul also, praying for them, again assures (them of success) by the fact that the promises had been given, and says: “But the Lord is faithful, who shall stablish you, and guard you from the evil one”. <strong>If He <mark>has chosen you for salvation</mark>, He will not lie and will not allow you to perish utterly. But so as not thereby to lead them to carelessness and <mark>lest they themselves, supposing that everything depends on God, give themselves over to sleep</mark> — see how (the apostle) <mark>also requires on their part </mark><u><mark>co-operation</mark></u></strong>, when he says: “We have confidence in the Lord touching you that ye both do and <strong><mark>will do</mark></strong> the things which we command you”. So, he says, <strong><mark>God is faithful and, having promised to save you, will undoubtedly save; but — as He promised. And how did He promise? If we ourselves </mark><u><mark>are willing</mark></u><mark>, if </mark><u><mark>we obey</mark></u><mark> Him, and not simply, not while we remain in </mark><u><mark>inaction</mark></u></strong> like trees and stones. Rightly did (the apostle) use this expression too: “we have confidence in the Lord”, that is, we trust in His love for mankind. Again he brings them down (from pride), showing that everything depends (on God). If he had said, We believe you, then although in this there would be great praise for them, yet he would not have shown that they place everything in dependence on God; on the contrary, if he had said, We have confidence in the Lord that He will preserve you, and had not added the expression — ‘touching you’, and (the other) — ‘that we command you’, and ‘ye do and will do’, then, having placed all (hope) on the power of God, he would have made them more given to sloth. <strong>Although we must refer everything to God, yet we must also <mark>ourselves be active</mark>, must take upon ourselves labours and struggles</strong>. Here (the apostle) shows also that although <strong><u><mark>virtue</mark></u><mark> alone is sufficient (that is, its presence is enough — note) to </mark><u><mark>save</mark></u><mark> us</mark>, yet it is necessary that it should reach the proper degree of perfection and <mark>abide with us until our last breath</mark></strong>. “The Lord direct your hearts into the love of God, and into the patience of Christ”. Again he praises them and prays for them, showing in this his care for them. Since he intends afterwards to proceed to reproof, he first softens their heart both by saying: I am confident of your obedience — and by asking prayers of them for himself — and by again praying himself (for the sending down to them) of countless blessings. “The Lord — he says — direct your hearts into the love of God”. There are many things that turn us away from love, and many paths that forcibly draw us away from it. And, first, the vice of covetousness, as it were seizing our soul with its shameless hands and holding it fast, draws and removes it from there even against our will. Then vainglory, and sorrows, and often also temptations, turn us aside. Therefore <strong>we <mark>need the help of God</mark>, as it were a certain wind, so that our sail, as by some strong breath, may be moved towards the love of God</strong>. Do not tell me, therefore, that you love God even more than yourself. These are mere words: <strong><mark>prove to me by deeds that you truly love Him</mark></strong> more than yourself.</p>
    </blockquote>
    <p>(Homilies on Second Thessalonians, 5.1)</p>
    <blockquote><p>If, then, miracles and signs could not deliver from punishment, much more, although a man should have received the sacred order, although he should have attained the highest honour, although grace should have acted at his ordination and in all else for the benefit of those who need leaders — such a one will hear: “I never knew” thee, even when grace was working in thee.</p>
    <p><strong>Oh, what <mark>purity of life</mark> is required there! How it alone is strong to bring us into the kingdom of heaven. How <mark>without it a man perishes, even though he could show countless signs and miracles!</mark> Nothing is so pleasing to God as a virtuous life: </strong>“If ye love Me” — says (the Lord) — He did not say: work miracles, but what? — “<strong>keep My commandments</strong>” (John 14:15); and again: “Ye are My friends” — not when ye cast out demons, but — “<strong>if ye keep My commandments</strong>” (John 15:10, 14). The first (grace — note) is the gift of God; and the last (purity of life — note) is both <strong><mark>the gift of God and together the work of our zeal</mark></strong>. <strong>Let us strive</strong> to become friends of God, and not to remain His enemies. Ceaselessly we say this, <strong>ceaselessly we urge</strong> it upon both <strong>ourselves and you — and yet there is no success</strong>. Therefore I am afraid, and would wish to be silent, so as not to increase the danger for you, since to hear often and not to act accordingly means to offend the Master. But I fear also another danger from silence for myself, if I, set for the ministry of the word, should keep silence. <strong><mark>What, then, you will say, must we do in order to </mark><u><mark>be saved</mark></u><mark>? Let us begin </mark><u><mark>to exercise ourselves in the virtues</mark></u><mark>, while there is time.</mark> Let us divide the virtues among ourselves, as farmers divide the work of farming; in one month let us overcome in ourselves the inclination to evil speaking, to insolence, to unjust anger, let us lay down a law for ourselves and say: today we will correct this; in another month let us learn patience; in a third — yet another virtue, and, having acquired a habit of it, let us pass on to a new one, just as in learning we acquire new things while keeping the former. After that let us pass on to contempt of wealth, and, first, let us keep our hands from covetousness, and then from giving alms; let us not mix everything together — with the same hands both plundering and giving alms. Then let us proceed to another virtue, and from it to yet another. “Also filthy speech — says (the apostle) — and vain talk and jesting are not fitting for you” (Eph. 5:4). Let us fulfil this too.</strong></p>
    <p>Here neither expense, nor labours, nor efforts are required. It is enough only to wish — and everything will be done. There is no need for this to undertake a long journey, or to cross a boundless sea, but only to make an effort, to show zeal and to put a bridle on the tongue against inappropriate insults. Let us tear out of our soul anger, vicious lusts, the inclination to sensual pleasures and luxury, the love of money, the habit of swearing and of perjury. <strong><mark>If we cultivate ourselves in this way</mark>, first tearing out the thorns and then planting the heavenly seed, <mark>we shall be able to obtain the promised good things</mark></strong>. The Husbandman will come, gather us into the barn, and then we shall receive all the good things, of which may we all be deemed worthy, by the grace and love for mankind of our Lord Jesus Christ, with whom to the Father and the Holy Spirit be glory, dominion, honour and worship, now and ever, and unto the ages of ages. Amen.</p>
    </blockquote>
    <p>(Homilies on the Epistle to the Hebrews, 24)</p>
    <h2>18th century</h2><h3>The Epistle of the Patriarchs of the Eastern Orthodox Catholic Church on the Orthodox Faith (1723)</h3>
    <p>An exposition of the Orthodox faith composed by Dositheus, Patriarch of Jerusalem. It was adopted by the Church of Jerusalem (1672), approved by four Orthodox patriarchs and by the Holy Synod of the Russian Church, and also sent to Great Britain in 1723.</p>
    <blockquote><p>We believe no one to be saved without faith. And by faith we mean <strong>the right notion that is in us concerning God</strong> and divine things, which, <strong>working by love, that is to say, by [observing] the Divine commandments, justifieth us with Christ</strong>; and without this [faith] it is impossible to please God.</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-9">The Eastern Orthodox Confession of Faith, Decree 9</a>)</p>
    <blockquote><p><strong><mark>We believe a man to be not simply justified through faith alone, but through faith which worketh through love, that is to say, through faith and works</mark></strong>. But [the notion] that faith fulfiling the function of a hand layeth hold on the righteousness which is in Christ, and applied it unto us for salvation, we know to be far from all Orthodoxy. For faith so understood would be possible in all, and so none could miss salvation, which is obviously false. But on the contrary, we rather believe that it is not the correlative of faith, but the faith which is in us, justifieth through works, with Christ. But <strong><mark>we regard works not as witnesses certifying our calling, but as being fruits themselves, through which faith becomes efficacious, and as in themselves meriting, through the Divine promises [cf. 2 Cor. 5:10] that each of the Faithful may received what is done through his own body, whether it be good or bad</mark></strong>.</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-13">The Eastern Orthodox Confession of Faith, Decree 13</a>)</p>
    <p>The prevenient divine grace is available to all men freely, without the requirement of preceding labours. This grace points out to man what he must <strong>do</strong> in order to attain salvation. If a man obeys this grace, then a particular (saving) grace is also given to him, which co-operates with him in the performance of the works necessary for salvation.</p>
    <p>Thus,</p>
    <ol><li><p>Prevenient grace is given freely and points to the necessary works.</p>
    </li>
    <li><p>Saving grace is given to the obedient and helps them to perform <strong>the works necessary for salvation</strong>.</p>
    </li>
    </ol><blockquote><p>The Divine and <strong>illuminating grace</strong>, and which we call preventing grace, being, as a light to those in darkness, <strong>by the Divine goodness imparted to all</strong>, to <strong>those</strong> <strong>that are willing to obey this</strong> — for it is of use only to the willing, not to the unwilling — and co-operate with it, in what it requireth as necessary to salvation, there is consequently <strong>granted particular grace</strong>; which, <strong>co-operating with us</strong>, and enabling us, and making us perseverant in the love of God, that is to say, <strong>in performing those good things</strong> that God would have us to do, and which his preventing grace admonisheth us that we should do, <strong>justifieth us</strong>, and maketh us predestinated.</p>
    <p>&lt;…&gt;</p>
    <p><strong>[Scripture] promiseth the believer <mark>salvation through works</mark></strong>, yet supposeth <strong>God to be its sole author, by His sole illuminating grace</strong>, which he <strong>bestoweth <mark>without preceding works</mark></strong>, <strong><mark>to shew</mark></strong> to men the truth of divine things, and <strong><mark>to teach him</mark></strong> how he may co-operate therewith, if he will, and <strong><mark>do</mark> what is good and acceptable, <mark>and so</mark> obtain <mark>salvation</mark></strong>.</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-3">The Eastern Orthodox Confession of Faith, Decree 3</a>)</p>
    <h3>St Paisius (Velichkovsky), monk (1722–1794)</h3>
    <blockquote><p>God, most merciful, accomplishes our <strong>salvation by the Orthodox faith, <mark>by good works</mark> and by His grace</strong>. The Orthodox faith is that which the one holy, Catholic and Apostolic Eastern Church holds; without this Orthodox faith no one can possibly be saved. <strong><mark>Good works are the Gospel commandments, without the fulfilment of which, as also without faith, it is likewise impossible for anyone to be saved</mark></strong>. <strong>The Orthodox faith without good works is dead, and good works without faith are also dead. He who desires salvation must have both together: <mark>both the Orthodox faith with good works, and good works with the Orthodox faith</mark></strong>, and then, with the help of the grace of God which assists his good works, he will be saved according to the word of Christ, who said: “without Me ye can do nothing”.</p>
    </blockquote>
    <p>(How a Layman Can Be Saved?)</p>
    <h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3>
    <blockquote><p>The sacraments were instituted by the Lord. And here we have no need to philosophize. <strong>Concerning the <mark>conditions of salvation</mark> you say: the Apostle Paul said, believe in the Lord and thou shalt be saved. What does it mean to believe in the Lord?</strong> Abandon idolatry, <strong><mark>accept the Christian faith</mark></strong>, and consequently <strong><mark>everything that Christianity contains: both faith, and the commandments, and the sacraments, and all the ordinances</mark></strong>.</p>
    <p>St Paul said so; <strong>but the Lord said to such a question: <mark>keep the commandments</mark>, if thou wilt enter into life. St Mark writes: he that believeth and is baptized shall be saved. And there are yet other places.</strong> <strong><mark>When we gather all together, it will be that both belief, and life according to the commandments, and sanctification by the sacraments, and the guidance of pastors instituted by God, and union with the true Church — are absolutely necessary for obtaining salvation</mark></strong>.</p>
    <p><strong>Take the trouble to notice</strong>, when you happen to read about the conditions of salvation, and <strong>to write down such places</strong>, and you will see what a <strong>complete system will come out; but certainly <mark>not faith alone</mark></strong>. Perhaps faith too — Christian faith, that is, <strong><mark>the whole Christian order</mark></strong>.</p>
    </blockquote>
    <p>(Guidance in the Spiritual Life)</p>
    <blockquote><p>Eph. 2:8. For by grace you have been saved through faith, and that not of yourselves; it is the gift of God.</p>
    <p>In verses 8–10 the holy Paul proves, or explains, why through the glorification of those who believe in the Lord Jesus there will be manifested nothing else but the riches of grace. Because it is <strong>grace alone that raises a man to such a state as makes him fit for such a high honour as co-seating with Christ. This state he here calls salvation</strong> and says: therefore the riches of grace will be manifested in our co-seating, because you are saved, placed in a state to enjoy this gift — grace. Further he explains that salvation is indeed wrought by grace. <strong><mark>For salvation faith and a holy virtuous life are necessary</mark></strong>. But both faith is from God (v. 8), and for good works we are built up by Him through regeneration and grace (v. 10). <strong><mark>Faith and virtue make Christians saved</mark></strong>, pure, holy, well-pleasing to God, and thereby fit for co-seating with Christ. Since they are built up in a Christian by grace, it is evident that through this co-seating the one riches of the grace of God will be manifested.</p>
    <p>Thus the whole ordering of salvation is accomplished by the grace of God; each one’s personal salvation is also wholly from grace; from man there is only agreement to faith and the desire to be saved in this way. And this is in keeping with the character of a free creature. Everything else is accomplished by grace, for agreement and desire, by themselves, will lead to nothing if the all-working grace does not come.</p>
    <p>&lt;…&gt;</p>
    <p>Thus faith, according to the Apostle’s teaching, is not our own possession, but the gift of God. <strong><mark>Faith is insufficient for salvation</mark></strong>, but, so as not to save us without any participation of ours, God requires it of us. He said that faith saves, but not by itself, but through God: God wills, and faith saves.</p>
    <p>&lt;…&gt;</p>
    <p>He confirms that such a manner of salvation through faith, and our calling to faith unto salvation, God was pleased to arrange according to His sole goodness, and not for any works of ours. <strong>What works brought down the Son of God to earth? — Not works, but our idleness brought Him down</strong>. What works did the Ephesians show that they were called to faith? God sent the Apostle, arming him with the gifts of grace. By the power of the word of grace and by miracles he turned them to faith and brought them into the fold of the saved, with all the advantages assigned to them here and prepared in the future. Nothing of their own did the Ephesians present for such mercy, except obedience to the faith, completed, however, by grace. And not the Ephesians only, but neither any other people, nor any private person <strong>is brought into the rank of the saved for any works, but by the grace</strong> of God alone. How did we (Russians) deserve to be in the saving Church of God? Each of us is born within the fold of faith, and immediately upon birth becomes a member of the body of the Church. Behold, this is the great grace of God! <strong><mark>What works do we present?! — None. Works are required after this. When a man has been called and has received grace, then it remains for him only to do</mark></strong>. Thus <strong><mark>it is one thing to arrange salvation and to call to it, and another thing to live after the calling and the reception of grace</mark>. <mark>In the first</mark> (the arrangement of salvation by Christ once for all men — note) <mark>works do not participate, while in the second</mark> (life after the calling to salvation — note) — <mark>works only are required: faith has already done its work, now do</mark> — and thou shalt be holy and blameless, for in this is the essence of Christianity.</strong></p>
    <p>The Apostle’s words, “not of works, lest any man should boast”, refer to the first moment, and the following words — that “we are created unto good works, that we should walk in them” (Eph. 2:10) — to the second.</p>
    <p>&lt;…&gt;</p>
    <p>Eph. 2:10. For we are His workmanship, created in Christ Jesus for good works, which God prepared beforehand that we should walk in them.</p>
    <p>He has just said: “not of works” — how then does he say here: “created unto works”? — <strong><mark>Salvation has been arranged for us and we have been called to receive it</mark> not for any works, but by grace alone. But we have been called not in order to do nothing on our part, but in order to work out our own salvation</strong>, being enriched in good works foreordained for us by God, or prospering in every virtue; <strong>although this too is not by our own power, but by the power of grace</strong>, by which we have been recreated unto such works, and have received the possibility, with its help, to perform them and to be perfected through them. Wherefore the Apostle also joins this statement with the preceding one through “for” — for — showing therein the reason why he regards the glorification of believers as a manifestation of the riches of grace. <strong><mark>For both faith and good works — the two conditions for acceptance into the Kingdom of glory — are both of grace</mark>.</strong></p>
    <p>Blessed Theodoret writes: “The Apostle said here: created, meaning regeneration, that is, God called us by His ineffable goodness, we obeyed and, having believed, received salvation. But as before baptism He did not require of us active virtue, so after baptism He commands us to take care of it. For this is what the words mean: ‘unto good works, that we should walk in them’.</p>
    </blockquote>
    <p>(Commentary on the Epistle to the Ephesians, chapter 3)</p>
    <p>On the Protestant doctrine of salvation “by faith alone”:</p>
    <blockquote><p>So for a Christian to be rich in good works is an essential matter. <strong>There are systems of doctrine (he is speaking of Protestantism — note) in which good works are kept in the background, and ascetic effort is quite excluded — all for fear of introducing some merit into the work of salvation</strong>. But supposedly one cannot strain all one’s effort upon both without the thought of merit, but only from the consciousness of obligation. <strong>How this doctrine relaxes the moral powers and virtue, and turns one from inner purity to outward good behaviour</strong>, is known by experience to those who have lived among such people. Decorous behaviour there replaces moral goodness; and all inner impurity, in their opinion, is supposedly covered by faith. What is to be done, they say? I see another law… and they refuse any resistance to it. One hears that their first leader (Luther) used often to utter his wise saying: sin more, but believe more, and do not doubt that thou shalt be saved. <strong>However, <mark>he did not explain how it is possible to have faith while serving the passions</mark>, <mark>when the beginning of faith requires: let us deny ourselves and take up the cross</mark></strong>.</p>
    </blockquote>
    <p>(Commentary on the Epistle to the Ephesians, chapter 3)</p>
