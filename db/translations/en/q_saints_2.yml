  title: The necessity of baptism for all people
  menu:
    parent: Sacraments of the Church/The sacrament of Baptism
    title: The necessity of baptism for all people
    priority: 8
  body: '<h2>2nd century</h2><h3><a href="https://bibleox.com/en/en/w/Justin-the-Philosopher-Martyr">St
    Justin the Philosopher, martyr (c. 100–165)</a></h3><blockquote><p>So that it
    becomes you to eradicate this hope from your souls, and hasten to know <strong>in
    what way forgiveness of sins, and a hope of inheriting the promised good things,
    shall be yours. But <mark>there is no other [way]</mark> than this — to become
    acquainted with this Christ, to be washed in the <mark>fountain spoken of by Isaiah
    for the remission of sins</mark></strong>; and for the rest, to live sinless lives.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-44">Dialogue
    with Trypho, ch. 44</a>). The Greek λουτρόν, rendered “fountain” in the library
    translation, is the laver of baptism.</p><h3><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon">St
    Irenaeus of Lyons, hieromartyr (c. 130–202)</a></h3><blockquote><p>As dry earth
    does not bring forth unless it receive moisture, in like manner we also, being
    originally a dry tree, could never have brought forth fruit unto life without
    the voluntary rain from above. For <strong><mark>our bodies have received unity
    among themselves by means of that layer which leads to incorruption, but our souls,
    by means of the Spirit. Wherefore both are necessary</mark></strong>, since both
    contribute towards the life of God</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-17">Against
    Heresies, Book III, ch. 17</a>). The “layer” is the laver, that is, the bath of
    baptism.</p><blockquote><p>Therefore Philip also, when he found that the eunuch
    of the queen of the Ethiopians was reading the words of Scripture: “He was led
    as a sheep to the slaughter, and as a lamb before its shearer is silent, so He
    did not open His mouth; in His humiliation His judgment was taken away” (Isa.
    53:7; Acts 8:27), and the rest that the prophet had said about His suffering and
    His coming in the flesh, and how He was dishonoured by the unbelievers — easily
    persuaded him to believe that this was Jesus Christ, crucified under Pontius Pilate
    and enduring what the prophet had foretold, and that He is the Son of God, who
    grants eternal life to men. And immediately, having baptized the eunuch, he departed
    from him. <strong>For nothing else (but baptism) was lacking to him, who had already
    been instructed beforehand by the prophets</strong>: he knew neither God the Father
    nor the rules of morality, but only the coming of the Son of God, and having soon
    come to know Him, he continued his journey with joy, in order to preach the coming
    of Christ in Ethiopia. Therefore Philip laboured but little over him, for he had
    already been prepared in the fear of God by the prophets. Therefore the apostles
    also, gathering the lost sheep of the house of Israel, spoke with them from the
    Scriptures and proved that the crucified Jesus is the Christ, the Son of the living
    God, and persuaded a great multitude, which however already had the fear of God,
    and in one day three thousand men were baptized, four and five thousand (Acts
    2:41; 4:4).</p></blockquote><p>(Against Heresies, Book III, ch. 12)</p><h2>3rd
    century</h2><h3><a href="https://bibleox.com/en/en/w/Cyprian_of_Carthage">St Cyprian
    of Carthage, hieromartyr (c. 200–258)</a></h3><blockquote><p>For as, in that baptism
    of the world in which its ancient iniquity was purged away, he who was not in
    the ark of Noah could not be saved by water, <strong><em>so neither can he appear
    to be <mark>saved by baptism</mark> who has not been <mark>baptized in the Church</mark>
    which is established in the unity of the Lord according to the sacrament of the
    one ark</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Jubaianus-Concerning-the-Baptism-of-Heretics">Epistle
    72, to Jubaianus, 11</a>)</p><h2>4th century</h2><h3>Cyril of Jerusalem, bishop
    (315–386)</h3><blockquote><p><strong>When going down, therefore, into the <mark>water</mark>,
    think not of the bare element, but look for salvation by <mark>the power of the
    Holy Ghost</mark>: <mark>for without both thou canst not possibly be made perfect</mark></strong><mark>.</mark>
    It is not I that say this, but the Lord Jesus Christ, who has the power in this
    matter: for He saith, <strong><em>Except a man be born anew</em> (and He adds
    the words) of water and of the Spirit, <em>he cannot enter into the kingdom of
    God</em></strong> (cf. John 3:3, 5). <strong><mark>Neither doth he that is baptized
    with water, but not found worthy of the Spirit, receive the grace in perfection;
    nor if a man be virtuous in his deeds, but receive not the seal by water, shall
    he enter into the kingdom of heaven</mark>. A bold saying, but not mine, for it
    is Jesus who hath declared it.</strong> And here is the proof of the statement
    from Holy Scripture. Cornelius was a just man, who was honoured with a vision
    of Angels, and had set up his prayers and alms-deeds as a good memorial before
    God in heaven. Peter came, and the Spirit was poured out upon them that believed,
    and they spake with other tongues, and prophesied: and after the grace of the
    Spirit the Scripture saith that Peter commanded them to be baptized in the name
    of Jesus Christ (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L48">Acts 10:48</a>);
    in order that, the soul having been born again by faith, the body also might by
    the water partake of the grace.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-1#HH-On-Baptism">The
    Catechetical Lectures, Lecture 3</a>)</p><h3>St John Chrysostom, archbishop of
    Constantinople (c. 347–407)</h3><blockquote><p>And why, not being sent to baptize,
    did he baptize? Not in contention with Him that sent him, but in this instance
    laboring beyond his task. For he saith not, “I was forbidden,” but, “I was not
    sent for this, but for that which was of the greatest necessity.” <strong>For
    preaching the Gospel is a work perhaps for one or two; but <mark>baptizing, for
    everyone endowed with the priesthood</mark></strong>. For a man being instructed
    and convinced, to take and baptize him is what any one whatever might do: for
    the rest, it is all effected by the will of the person drawing near, and the grace
    of God. But when unbelievers are to be instructed, there must be great labor,
    great wisdom. And at that time there was danger also annexed. In the former case
    the whole thing is done, and he is convinced, who is on the point of initiation:
    and it is no great thing when a man is convinced, to baptize him. But in the later
    case the labor is great, to change the deliberate will, to alter the turn of mind,
    and to tear up error by the roots, and to plant the truth in its place.</p><p>&lt;…&gt;</p><p>For
    even now, we commit this matter to the simpler sort of presbyters, but the word
    of doctrine unto the wiser: for there is the labor and the sweat. Wherefore he
    saith himself, (1 Tim. 5:17.) <em>“Let the Elders who rule well be counted worthy
    of double honor, especially they who labor in the word and in teaching.”</em>
    For as to teach the wrestlers in the games is the part of a spirited and skilful
    trainer, but to place the crown on the conquerors head may be that of one who
    cannot even wrestle, (although it be the crown which adds splendor to the conqueror,)
    <strong><mark>so also in Baptism</mark>. <mark>It is impossible to be saved without
    it</mark>, yet it is no great thing which the baptizer doth</strong>, finding
    the will ready prepared.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-1#HH-Homily-III">Homilies
    on First Corinthians, Homily 3</a>)</p><blockquote><p>The pagan who does not know
    God must weep, because as soon as he dies he goes straight to punishment. The
    Jew also must be crushed in spirit, who, not believing in Christ, has doomed his
    soul to perdition. <strong><mark>Our catechumens also are worthy of pity, if</mark></strong>
    they, either through their own unbelief or through the negligence of those near
    them, <strong><mark>die without the saving baptism</mark></strong>. But he who
    has been sanctified by grace, sealed by faith, honourable in his conduct or unwavering
    in innocence — such a one, when he departs from this world, should be blessed
    and not lamented, envied and not deeply mourned; though envy should be moderate,
    since we know that in due time we too shall follow them.</p></blockquote><p>(On
    Consolation at Death)</p><blockquote><p>What says He? Verily I say unto you, unless
    <strong>a man be born of water and of the Spirit</strong>, he cannot enter into
    the Kingdom of God. What He declares is this: You say that it is impossible, <strong>I
    say that it is so absolutely possible as to be necessary, and that <mark>it is
    not even possible otherwise to be saved</mark></strong>. For necessary things
    God has made exceedingly easy also. The earthly birth which is according to the
    flesh, is of the dust, and therefore heaven is walled against it, for what has
    earth in common with heaven? But that other, which is of the Spirit, easily unfolds
    to us the arches above.</p><p><strong>Hear, you as many as are unilluminated,
    shudder, groan, fearful is the threat, fearful the sentence. It is not (possible),
    He says, for one not born of water and the Spirit, to enter into the Kingdom of
    heaven; because he wears the raiment of death, of cursing, of perdition, he has
    not yet received his Lord’s token, he is a stranger and an alien, he has not the
    royal watchword. Except, He says, a man be born of water and of the Spirit, he
    cannot enter into the Kingdom of heaven.</strong></p><p>&lt;…&gt;</p><p>I formed
    (man) of earth and water; but that which was formed was unprofitable, the vessel
    was wrenched awry; I will no more form them of earth and water, but ‘of water’
    and ‘of the Spirit.’ And if any one asks, <strong>How of water?</strong> I also
    will ask, How of earth? How was the clay separated into different parts?</p><p>&lt;…&gt;</p><p>For
    as the earth, which is soulless and motionless, was empowered by the will of God,
    and such wonders were worked in it; much more <strong>when the Spirit is present
    with the water</strong>, do all those things so strange and transcending reason,
    easily take place.</p><p>&lt;…&gt;</p><p>Let us then give diligence that we may
    become citizens of the city which is above. How long do we tarry over the border,
    when we ought to reclaim our ancient country? We risk no common danger; for <strong><mark>if
    it should come to pass, (which God forbid!) that through the sudden arrival of
    death we depart hence uninitiated, though we have ten thousand virtues, our portion
    will be no other than hell</mark></strong>, and the venomous worm, and fire unquenchable,
    and bonds indissoluble. But God grant that none of those who hear these words
    experience that punishment! <strong>And this will be, if having been deemed worthy
    of the sacred mysteries</strong>, we build upon that foundation gold, and silver,
    and precious stones <a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L12">1 Cor.
    3:12</a>.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/sYTb_Homilies_on_the_Gospel_of_John_2039#HH-25">Homilies
    on the Gospel of John, Homily 25</a>, on <a href="https://bibleox.com/en/eng-nkjv/in/3/#L5">John
    3:5</a>: “Jesus answered, ‘Most assuredly, I say to you, unless one is born of
    water and the Spirit, he cannot enter the kingdom of God’”)</p><h2>18th century</h2><h3>Confession
    of the Orthodox Faith of the Eastern Church (1672, 1723)</h3><blockquote><p>We
    believe <strong><mark>Holy Baptism</mark></strong>, which was instituted by the
    Lord, and is conferred in the name of the Holy Trinity, <strong><mark>to be of
    the highest necessity</mark></strong>. For <strong><mark>without it none is able
    to be saved</mark></strong>, as the Lord saith, “Whosoever is not born of water
    and of the Spirit, shall in no wise enter into the Kingdom of the Heavens” (John
    3.5). And, therefore, it is necessary even for infants, since they also are subject
    to original sin, and without Baptism are not able to obtain its remission. Which
    the Lord showed when he said, not of some only, but simply and absolutely, “Whosoever
    is not born [again]”, which is the same as saying, “All that after the coming
    of Christ the Saviour would enter into the Kingdom of the Heavens <strong><mark>must
    be regenerated</mark></strong>.” And forasmuch as infants are men, and as such
    need salvation; <strong><mark>needing salvation, they need also Baptism.</mark></strong></p><p>And
    those that are not regenerated, since they have not received the remission of
    hereditary sin, are, of necessity, subject to eternal punishment, and consequently
    cannot without Baptism be saved; so that even infants ought, of necessity, to
    be baptised. Moreover, infants are saved, as is said in Matthew (Matt. 19.12);
    but he that is not baptised is not saved. And consequently even infants must of
    necessity be baptised.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-16">Decree
    16</a>)</p><h2>19th century</h2><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p><strong>Human
    nature has been renewed by the Redemption</strong>. The God-man renewed it by
    Himself and in Himself. Human nature thus renewed by the Lord is grafted, so to
    speak, onto the fallen nature through Baptism. Baptism, without destroying nature,
    destroys its state of fallenness; without making nature other, it changes its
    state, having brought human nature into communion with the divine nature (<a href="https://bibleox.com/en/eng-nkjv/2pet/1/#L4">2
    Pet. 1:4</a>).</p><p>Baptism is at once mortification and quickening — at once
    burial and birth. <strong>Into the font of Baptism is plunged, in it is buried
    and dies the sinful corruption of the fallen nature, and out of the font rises
    the renewed nature; into the font is plunged the son of the old Adam — out of
    the font comes forth the son of the New Adam</strong>. This is testified by the
    Lord, who said: “Unless one is born of water and the Spirit, he cannot enter the
    kingdom of God. That which is born of the flesh is flesh, and that which is born
    of the Spirit is spirit” (<a href="https://bibleox.com/en/eng-nkjv/in/3/#L5-6">John
    3:5-6</a>). From these words it is evident that <strong>the Holy Spirit, having
    received into the font of Baptism the carnal man, such as man became after the
    fall, brings out of the font the same man, but now spiritual, having put to death
    in him the sinful carnal state and brought forth the spiritual. <mark>In Baptism
    man is forgiven original sin, inherited from the forefathers, and his own sins
    committed before Baptism</mark>. In Baptism man is granted spiritual freedom:
    he is no longer compelled by sin</strong>, but by his own will he can choose good
    or evil. <strong><mark>In Baptism Satan, who dwells in every man of the fallen
    nature, is cast out of man</mark></strong>; and it is left to the will of the
    baptized man either to remain a temple of God and be free from Satan, or to remove
    God from himself and again become a dwelling-place of Satan (<a href="https://bibleox.com/en/eng-nkjv/mf/12/#L43-45">Matt.
    12:43-45</a>).</p><p>&lt;…&gt;</p><p>Having freedom of choice, the baptized man
    is invited by the Holy Spirit to maintain his union with the Redeemer, to maintain
    in himself the renewed nature, to maintain the spiritual state granted by baptism,
    to abstain from gratifying the desires of the flesh, that is, from turning aside
    after the impulses of the carnal, soul-centred way of thinking. The words of the
    Apostle have the same meaning: <strong>“The first man was of the earth, made of
    dust; the second Man is the Lord from heaven. As was the man of dust, so also
    are those who are made of dust; and as is the heavenly Man, so also are those
    who are heavenly. And as we have borne the image of the man of dust” — for <mark>we
    are all born in original sin and with all the infirmities that have become natural
    to us through the fall</mark>, infirmities which appeared in Adam after his fall
    — <mark>“let us also bear the image of the heavenly Man” through Baptism</mark>,
    which grants us this image</strong>, and through the careful keeping of the Gospel
    commandments, which preserve this image in us whole.</p></blockquote><p>(Ascetic
    Experiences, vol. 2, Homily on the Various States of Human Nature in Relation
    to Good and Evil)</p><h3>St Nektarios of Aegina (Kephalas), bishop<strong> </strong>(1846–1920)</h3><blockquote><p><strong><mark>The
    work of salvation is baptism. Faith alone without the work of baptism does not
    save</mark></strong>, but the first <strong><mark>work of faith is baptism, performed
    by the Church</mark></strong> in the name of the trihypostatic Godhead, as the
    Lord taught by His Holy Baptism. The Holy Spirit descends upon the one being baptized:
    <strong><mark>without this first work of salvation faith is dead</mark></strong>.
    The Holy Spirit is the life-giving and sanctifying Spirit, who justifies before
    God the one who has believed and been baptized; for this reason the Lord said:
    “He who believes and is baptized will be saved.” St Cyprian, in his book to Donatus,
    says: “But when the water of regeneration washed away the filth of my former life,
    a gentle and pure light came down from heaven into my heart. When through regeneration
    I was re-created into a new man, and my wavering and irascible spirit was wondrously
    strengthened, the mysteries were opened, the darkness was dispersed... I knew
    that what had lived in me according to the flesh because of sin had returned to
    the earth, and that after holy baptism the divine and living life had begun.”
    <strong>So faith and baptism save. Without baptism faith is dead</strong>.</p></blockquote><p>(On
    the Church)</p><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p>The
    assimilation of the redemption is ascribed to faith in the Lord Jesus Christ.
    That is not complete. The Lord redeemed us by His blood, that is, by His death
    on the Cross. <strong><mark>The saving power of the Lord’s death on the Cross
    is appropriated to us in holy baptism, as St Paul explains (<a href="https://bibleox.com/en/eng-nkjv/rim/6/#L3-4">Rom.
    6:3-4</a>). Here man is crucified together with Christ the Saviour, is washed
    with His blood and is cleansed. </mark></strong>Faith precedes this and accompanies
    it; but faith alone, without baptism, does not appropriate the saving power of
    the Lord’s death on the Cross. And in baptism it is not faith alone that serves
    as the receptacle of such power, but faith together with repentance and a firm
    resolve to live the rest of one’s life in holiness. When this is present, then
    the power of the redemption is truly received — <strong><mark>and at that very
    moment the one being baptized is taken out of the circle of those subject to eternal
    perdition and brought into the circle of the saved.</mark></strong></p></blockquote><p>(Selected
    Letters on Sects and Heresies, Letter 26)</p>

