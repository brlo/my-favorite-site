    <h2>Brief summary</h2><p><strong>Chiliasm</strong> — the name of an erroneous idea of the thousand-year Kingdom of Christ as:</p><ul><li><p>literally earthly,</p>
    </li>
    <li><p>with the Lord Jesus Christ having literally and manifestly come and reigned on earth,</p>
    </li>
    <li><p>lasting literally 1000 years,</p>
    </li>
    <li><p>literally in Jerusalem.</p>
    </li>
    </ul>
    <p>This idea is based on an erroneous understanding of the verses of the 20th chapter of the Revelation of John the Theologian (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L1-6">Rev. 20:1-6</a>). There are different versions of this idea, substantially differing from one another, but all of them are erroneous.</p>
    <p>Orthodox Christians, however, understand the coming of the Kingdom of Christ differently: 1) the first stage has already come — it is the kingdom of grace, which is figuratively designated by a thousand years, and 2) the second stage will come in the future, manifestly for all, after a series of events following closely one upon another: the Second Coming of Christ in glory with the angels, the universal resurrection of the dead, and the universal judgment over all people without exception, after which some people will be condemned to endless torments, while others will inherit eternal blessedness with Christ (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L46">Matt. 25:46</a>).</p>
    <p>In more detail:</p>
    <ol><li><p>From the moment of the creation of the New Testament Church, that very 1000 years (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L1-6">Rev. 20:1-6</a>) of the reign of the saints with Christ in the “heavenly Jerusalem” (that is, in heaven) has already begun. This period of the Kingdom of Christ can be described in various formulations, but the main thing is to grasp the essence. In heaven Christ already reigns with the souls of the saints. On the one hand, this kingdom is manifest to the inhabitants of heaven, but on the other hand, they still await their resurrection, for in heaven Christ is in the body, while the saints live with Him only in their souls, awaiting the resurrection of their bodies. Here, however, for those living on earth, this kingdom is not so manifest and is called the kingdom of grace, for the Church does battle by God’s power against the devil and against sin, being strengthened by the grace given from God through the Sacraments. This is precisely how the 1000 years are understood: not literally, but symbolically, as the whole period of the Church’s life from its creation to the Second Coming of Christ.</p>
    </li>
    <li><p>After the Second Coming of Christ, however, everything will be manifest to all: the universal resurrection of the righteous and the unrighteous will come (<a href="https://bibleox.com/en/eng-nkjv/act/24/#L15">Acts 24:15</a>) for the universal judgment (<a href="https://bibleox.com/en/en/w/Sv3a_Salvation#HH-Christ-Is-the-Universal-Judge">references to Scripture</a>), which will begin immediately after the resurrection. At this judgment people will be gathered by God’s angels, who will separate the righteous from the unrighteous (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L37-43">Matt. 13:37-43</a>; <a href="https://bibleox.com/en/eng-nkjv/mf/24/#L31">Matt. 24:31</a>), placing some on the left and others on the right of Christ (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-46">Matt. 25:31-46</a>), after which Christ will pronounce the sentence (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L34,41,46">Matt. 25:34,41,46</a>); some people will be condemned to endless torments, while others will inherit eternal blessedness with Christ (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L46">Matt. 25:46</a>), and the endless reign of Christ with the saints will begin (<a href="https://bibleox.com/en/eng-nkjv/1sol/4/#L15-17">1 Thess. 4:15-17</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/21/#L3-4">Rev. 21:3-4</a>).</p>
    </li>
    </ol>
    <hr><p>In the 1st century the idea of the earthly reign of Christ in Jerusalem was widespread among the Jewish people, but it proved to be erroneous. Having heard of the birth of Christ, King Herod feared that Christ would become king in Jerusalem in his place. Herod sends soldiers to kill the infants (<a href="https://bibleox.com/en/eng-nkjv/mf/2/#L8,13,16">Matt. 2:8,13,16</a>) in order to keep the royal place for himself. Christ’s disciples also think that He is going to reign in Jerusalem, and beforehand ask for places on the right and on the left of Him (<a href="https://bibleox.com/en/eng-nkjv/mf/20/#L21">Matt. 20:21</a>; <a href="https://bibleox.com/en/eng-nkjv/mk/10/#L37">Mark 10:37</a>). This proved to be a mistake.</p>
    <p>After this, in the 1st century there is no record of the opinion of the earthly reign of Christ in Jerusalem. The Orthodox faith that the manifest kingdom of the Lord Jesus Christ is not of this world (<a href="https://bibleox.com/en/eng-nkjv/in/18/#L36">John 18:36</a>) and will be not on earth but in heaven with the angels is confessed by the grandchildren of the Apostle Jude (the Lord’s brother) at an interrogation before the Emperor Domitian (81–96).</p>
    <p>The works of many authors of the 2nd century have not survived. For example, judging only by the Church History of <a href="https://bibleox.com/en/en/w/Eusebius_of_Caesarea">Eusebius of Caesarea (3rd–4th c.)</a>, the works of Quadratus, bishop of Athens, Hegesippus, Claudius Apollinaris, bishop of Hierapolis (in Asia), Agrippa Castor, Rhodon, Serapion of Antioch, Theophilus of Caesarea, and a number of other bishops have not survived.</p>
    <p>In the surviving works of Sts Justin the Philosopher and Irenaeus of Lyons, their expectation of the earthly 1000-year reign of Christ in Jerusalem is recorded. Tertullian writes the same. Eusebius also mentions that Papias of Hierapolis held this opinion, although his works have not survived. However, the same St Justin points out, without condemnation, that many Christians do not accept the opinion of the 1000-year earthly kingdom of Christ in Jerusalem, and the works of many authors, as already written above, have not survived.</p>
    <p>At the same time, in a small surviving fragment of the work of Hegesippus (2nd century) there is a testimony that the kingdom of Christ will be not on earth but in heaven with the angels after the universal judgment. It is characteristic that this was an answer to an earthly ruler, to whom it is clearly made known that this is not about earthly forms of government. Likewise, the community of St Polycarp of Smyrna (155–156) writes in the epistle about his martyrdom that the eternal Kingdom of Christ is already underway and Christians strive to enter it (in heaven). In the 3rd century the well-known saint Cyprian of Carthage directly interprets the words of the Revelation about the thousand-year Kingdom of Christ as the Kingdom of Christ already begun in heaven, into which the righteous pass immediately after death.</p>
    <p>Thus, the Orthodox teaching is already heard in the 1st century, while the erroneous opinion of the 1000-year earthly Kingdom of Christ on earth in Jerusalem arises among the authors of the 2nd century, existing in parallel with the Orthodox teaching, and disappears within the Church by the 4th century.</p>
    <hr><p>In the 2nd century Jerusalem was a pagan city from which, as a result of two Jewish revolts against the Roman Empire, the Jews had been expelled by the Romans (as Justin himself <a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-47">writes</a>), and in the place of the Jerusalem temple and Christian shrines stood pagan idols. After Jerusalem was restored in the 4th century as an ordinary city with Christian shrines, the opinion of a thousand-year kingdom in Jerusalem is no longer heard. That is, this opinion of certain authors of the 2nd century, having arisen, was never accepted by the whole Church, and subsequently was rejected as erroneous.</p>
    <p>Protestants like to speculate on this fact; their various societies hold their own invented versions of the 1000-year kingdom of Christ on earth, about which none of the holy fathers wrote. They add to this also the doctrine, invented by them, of the rapture of the Church to heaven before the beginning of the kingdom of Antichrist, so that Christians would in no case suffer from him for the name of Christ. This doctrine is in principle <a href="https://bibleox.com/en/en/w/Sf7x_Suffering_for_Christ">alien to the spirit of Christianity</a>. However, it is worth knowing that Justin and Irenaeus are Orthodox authors in everything, except for this opinion about the 1000-year kingdom, which for Justin was not a Church-dividing question. For example, Justin and Irenaeus acknowledge:</p>
    <ol><li><p><a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%8F-%D0%BD%D0%B0%D1%81%D1%82%D0%BE%D1%8F%D1%89%D0%B8%D0%B5-%D1%82%D0%B5%D0%BB%D0%BE-%D0%B8-%D0%BA%D1%80%D0%BE%D0%B2%D1%8C-%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0#HH-%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD-%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA-100-165" lang="ru">the reality of the body and blood of Christ in the Eucharist</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/caEeLGWP_%D0%96%D0%B5%D1%80%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D0%BE%D0%B5_%D0%B7%D0%BD%D0%B0%D1%87%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B5%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B8#HH-II-%D0%B2%D0%B5%D0%BA" lang="ru">the offering of sacrifice in the Eucharist</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/hHT1sVOS_%D0%9A%D1%80%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BC%D0%BB%D0%B0%D0%B4%D0%B5%D0%BD%D1%86%D0%B5%D0%B2#HH-%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD-%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA-100-165" lang="ru">the baptism of infants</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/f7Bz4RJ8_%D0%94%D0%BB%D1%8F_%D1%81%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D1%8F_%D0%BD%D1%83%D0%B6%D0%BD%D1%8B_%D0%B4%D0%B5%D0%BB%D0%B0#HH-%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD-%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B9-%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA-100-165" lang="ru">the necessity of works for salvation</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/en/en/w/Necessity-of-Tradition#HH-St-Irenaeus-of-Lyons-hieromartyr-c-130202">the necessity of Tradition</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/en/en/w/Abolition-of-the-Law-of-Moses#HH-Justin-the-Philosopher-martyr-c-100165">the abolition of the Law of Moses together with the Sabbath rest</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/9XTO618Z_%D0%90%D0%BF%D0%BE%D1%81%D1%82%D0%BE%D0%BB%D1%8B_%D1%87%D0%B5%D1%80%D0%B5%D0%B7_%D0%B2%D0%BE%D0%B7%D0%BB%D0%BE%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5_%D1%80%D1%83%D0%BA_%D0%BF%D0%BE%D1%81%D1%82%D0%B0%D0%B2%D0%B8%D0%BB%D0%B8_%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%BE#HH-%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9-%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D0%BD%D0%BE%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA--%D0%BA%D0%BE%D0%BD-II-%D0%B2" lang="ru">the apostolic succession of the priesthood, around which the Church is built</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%B5%D0%B4%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%BE#HH-%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9-%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D0%BD%D0%BE%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA-130-202" lang="ru">the necessity of preserving the visible unity of the Church</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/%D0%BC%D1%8B%D1%82%D0%B0%D1%80%D1%81%D1%82%D0%B2%D0%B0-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85-%D0%BE%D1%82%D1%86%D0%BE%D0%B2#HH-%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD-%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA-100-165" lang="ru">the posthumous toll-houses</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/L18uU36a_%D0%92%D0%B5%D1%87%D0%BD%D0%BE%D1%81%D1%82%D1%8C_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%B9_%D0%B3%D1%80%D0%B5%D1%88%D0%BD%D0%B8%D0%BA%D0%BE%D0%B2#HH-II-%D0%B2%D0%B5%D0%BA" lang="ru">eternal torments in hell</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA#HH-%D0%9F%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%B5%D1%82-%D0%BA%D1%80%D0%B5%D1%81%D1%82" lang="ru">the veneration of the cross</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85#HH-%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD-%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA-100-165" lang="ru">the veneration of the saints</a>,</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA#HH-%D0%9E%D1%82%D0%B4%D0%B0%D0%B2%D0%B0%D0%BB-%D0%BF%D1%80%D0%B5%D0%B4%D0%BF%D0%BE%D1%87%D1%82%D0%B5%D0%BD%D0%B8%D0%B5-%D0%A1%D0%B5%D0%BF%D1%82%D1%83%D0%B0%D0%B3%D0%B8%D0%BD%D1%82%D0%B5" lang="ru">Justin acknowledged the Septuagint</a> (that is, those Old Testament books of Scripture which the Orthodox acknowledge and the Protestants do not),</p>
    </li>
    <li><p><a href="https://bibleox.com/ru/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA#HH-%D0%9C%D0%BE%D0%BD%D0%B0%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%BE" lang="ru">Justin reports the early institution of monasticism</a>, which Protestants mock.</p>
    </li>
    </ol>
    <p>From the point of view of a Protestant, these are ordinary heretics, from whom they prefer to separate themselves, but for us they are great saints who made a mistake in one opinion, but did not consider it necessary because of it to destroy Church unity, but on the contrary, fought for the unity of the Church, as Christ and the apostles wanted (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L20-21">John 17:20-21</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>) and against which Protestants fight with all their might, inventing more and more new heresies, creating more and more new divisions.</p>
    <h2>1st century</h2>
    <h3>The grandchildren of the Apostle Jude, the Lord’s brother (until c. 98)</h3>
    <p>According to the testimony of the church writer Hegesippus (c. 110–180), the grandchildren of the Apostle Jude (the Lord’s brother, the son of Joseph the betrothed from his first marriage) believed in the reign of Christ in the Orthodox way, that it would be not on earth but in heaven with the angels after the end of times and the universal judgment over every man. This testimony is uttered before the Emperor Domitian, who ruled from 81 to 96. The grandchildren of Jude (the Lord’s brother) lived until the reign of Trajan, which began in 98.</p>
    <blockquote><p><em>1. “Of the family of the Lord there were still living </em><strong><em>the grandchildren of Jude, who is said to have been the Lord’s brother according to the flesh</em></strong><em>. 2. Information was given that they belonged to the family of David, and they were brought to the Emperor Domitian by the Evocatus. For Domitian feared the coming of Christ as Herod also had feared it.</em></p>
    <p><em>And he asked them if they were descendants of David, and they confessed that they were. Then he asked them how much property they had, or how much money they owned. And both of them answered that they had only nine thousand denarii, half of which belonged to each of them; 4. and this property did not consist of silver, but of a piece of land which contained only thirty-nine acres, and from which they raised their taxes and supported themselves by their own labor.</em></p>
    <p><em>5. Then they showed their hands, exhibiting the hardness of their bodies and the callousness produced upon their hands by continuous toil as evidence of their own labor.</em></p>
    <p><em>6. </em><strong><em>And when they were asked <mark>concerning Christ and his kingdom, of what sort it was and where and when it was to appear</mark>, they answered that <mark>it was not a temporal nor an earthly kingdom, but a heavenly and angelic one</mark>, which would appear at the end of the world, when he should come in glory to judge the quick and the dead, and to give unto every one according to his works</em></strong><em>.</em></p>
    <p><em>7. Upon hearing this, Domitian did not pass judgment against them, but, despising them as of no account, he let them go, and by a decree put a stop to the persecution of the Church.</em></p>
    <p><em>8. </em><strong><em>But when they were released they ruled the churches because they were witnesses and were also relatives of the Lord</em></strong><em>. And peace being established, they lived until the time of Trajan.”</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-3#HH-The-Relatives-of-our-Saviour">Eusebius of Caesarea, Church History, 3.20</a>)</p>
    <p>Thus, this is a testimony about the kingdom of Christ against Chiliasm:</p>
    <ol><li><p>The earliest and the only one in the 1st century;</p>
    </li>
    <li><p>It is uttered by the relatives of the Lord Jesus Christ according to the flesh, the grandchildren of the apostle;</p>
    </li>
    <li><p>They were honored in the Church of Jerusalem;</p>
    </li>
    <li><p>Their testimony about this is a testimony about Christ before kings and rulers, under the threat of death, of which Christ said that the Spirit of the Father would speak in them:</p>
    </li>
    </ol>
    <blockquote><p>“<strong><mark>You will be brought before governors and kings for My sake, as a testimony</mark></strong> to them and to the Gentiles. But when they deliver you up, do not worry about how or what you should speak. For <strong>it will be given to you in that hour what you should speak; for it is not you who speak, but <mark>the Spirit of your Father who speaks in you</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/10/#L18-20">Matt. 10:18-20</a>)</p>
    </blockquote>
    <h2>2nd century</h2>
    <h3>Hegesippus (c. 100–190)</h3>
    <p>Hegesippus cites the words of the grandchildren of the Apostle Jude (the Lord’s brother) that the Kingdom of Christ will be not on earth but in heaven. This allows us to consider that not only the grandchildren of the apostle believed so, but Hegesippus himself. For he both cites these words and does not object to what was said:</p>
    <blockquote><p><em>6. </em><strong><em>And when they were asked <mark>concerning Christ and his kingdom, of what sort it was and where and when it was to appear</mark>, they answered that <mark>it was not a temporal nor an earthly kingdom, but a heavenly and angelic one</mark>, which would appear at the end of the world, when he should come in glory to judge the quick and the dead, and to give unto every one according to his works</em></strong><em>.</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-3#HH-The-Relatives-of-our-Saviour">Eusebius of Caesarea, Church History, 3.20</a>)</p>
    <h3>The community of Polycarp of Smyrna, hieromartyr (2nd century)</h3>
    <p>The eternal Kingdom of Christ has already come; Christians strive to enter it:</p>
    <blockquote><p>When then you have informed yourselves of these things, send the letter likewise to the brethren which are farther off, that they also may glorify the Lord, who makes election from His own servants. Now unto Him that <strong>is able to bring us all by His grace and bounty <mark>unto His eternal kingdom</mark></strong>, through His only-begotten Son Jesus Christ, &lt;…&gt; <strong><mark>He was apprehended</mark></strong> by Herod, when Philip of Tralles was high priest, in the proconsulship of Statius Quadratus, <strong><mark>but in the reign of the Eternal King Jesus Christ</mark></strong>.</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/Martyrdom-of-Polycarp#HH-20">Martyrdom of Polycarp, 20–21</a>)</p>
    <h3>Sts Justin the Philosopher, Irenaeus of Lyons, and Papias of Hierapolis (2nd century)</h3>
    <p>At the same time, a number of other saints, such as Irenaeus of Lyons and Justin Martyr and Papias of Hierapolis (according to the <a href="https://bibleox.com/en/en/w/Papias_of_Hierapolis">testimony of Eusebius</a>), speak of the future thousand-year reign of Christ in Jerusalem. However, Justin directly says that many Christians deny such an opinion:</p>
    <blockquote><p>And Trypho to this replied, “I remarked to you sir, that you are very anxious to be safe in all respects, since you cling to the Scriptures. But tell me, do you really admit that <strong>this place, Jerusalem, shall be rebuilt</strong>; and do you expect <strong>your people to be gathered together, and made joyful with Christ</strong> and the patriarchs, and the prophets, both the men of our nation, and other proselytes who joined them before your Christ came? or have you given way, and admitted this in order to have the appearance of worsting us in the controversies?”</p>
    <p>Then I answered, “I am not so miserable a fellow, Trypho, as to say one thing and think another. I admitted to you formerly, that I and many others are of this opinion, and [believe] that such will take place, as you assuredly are aware; but, on the other hand, I signified to you that <strong>many who belong to the pure and pious faith, and are true Christians</strong>, <strong>think otherwise</strong>.”</p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-80">Justin the Philosopher, Dialogue with Trypho, 80</a>)</p>
    <p>The opinion about the thousand years did not divide the Church, it had no unambiguous resolution then, unlike the teaching about the resurrection. Justin immediately calls the Gnostics who deny the resurrection godless heretics and does not consider them Christians:</p>
    <blockquote><p>Moreover, I pointed out to you that some who are called Christians, but are <strong>godless, impious heretics</strong>, <strong>teach doctrines that are in every way blasphemous, atheistical, and foolish</strong>. But that you may know that I do not say this before you alone, I shall draw up a statement, so far as I can, of all the arguments which have passed between us; in which I shall record myself as admitting the very same things which I admit to you. For I choose to follow not men or men’s doctrines, but God and the doctrines [delivered] by Him. For if you have fallen in with some who are called Christians, but who do not admit this [truth], and venture to blaspheme the God of Abraham, and the God of Isaac, and the God of Jacob; <strong>who say there is no resurrection of the dead</strong>, and that their souls, when they die, are taken to heaven; <strong>do not imagine that they are Christians</strong>, even as one, if he would rightly consider it, would not admit that <strong>the Sadducees*, or similar sects</strong> of Genist, Meristae, Gelilaeans, Hellenists, Pharisees, Baptists, are Jews (do not hear me impatiently when I tell you what I think), but are [only] called Jews and children of Abraham, worshipping God with the lips, as God Himself declared, but the heart was far from Him.</p>
    </blockquote>
    <p>*The Sadducees denied the resurrection (<a href="https://bibleox.com/en/eng-nkjv/mk/12/#L18">Mark 12:18</a>) and spiritual reality in general (the existence of angels and spirits — <a href="https://bibleox.com/en/eng-nkjv/act/23/#L8">Acts 23:8</a>).</p>
    <h2>3rd century</h2>
    <h3>St Cyprian of Carthage, hieromartyr (c. 200–258)</h3>
    <p>After a righteous life on earth, people pass at once to joy, life, and reign with Christ in heaven. A direct reference is used to the words about the thousand-year kingdom (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L4">Rev. 20:4</a>), which here is understood as the reign with Christ in heaven that has already begun:</p>
    <blockquote><p><em>“In the Apocalypse also He says the same thing: ‘And I saw,’ saith he, </em><strong><em>‘the souls of them that were slain for the name of Jesus</em></strong><em> and the word of God.’ And when he had placed those who were slain in the first place, he added, saying: ‘And whosoever had not worshipped the image of the beast, neither had received his mark upon their forehead or in their hand;’ all these he joins together, as seen by him at one time in the same place, and says, ‘And they lived and reigned with Christ.’ </em><strong><em>(</em></strong><a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L4"><strong><em>Rev. 20:4</em></strong></a><strong><em>) (translator’s note: these are the verses about the thousand-year kingdom</em></strong><em>). </em><strong><em>He says that <mark>all live and reign with Christ</mark></em></strong><em>, not only who have been slain; but even whosoever, </em><strong><em>standing in firmness of the faith and in the fear of God, have not worshipped the image of the beast, and have not consented to his deadly and sacrilegious edicts.</em></strong>&lt;…&gt; Who, then, does not with all his powers labour to attain to such a glory that he may become the friend of God, <strong>that he may <mark>at once</mark> rejoice with Christ, that after earthly tortures and punishments</strong> he may receive divine rewards?<em>”</em></p>
    </blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/cyprian-exhortation-to-martyrdom-addressed-to-fortunatus#HH-What-hope-and-reward-remains-for-the-righteous-and-for-martyrs-after-the-conflicts-and-sufferings-of-this-present-time">Exhortation to Martyrdom, Addressed to Fortunatus, 12–13</a>)</p>
    <h2>4th century</h2>
    <h3>Ephrem the Syrian, monk (c. 306–373)</h3>
    <p>A thousand years — the immensity of eternal life:</p>
    <blockquote><p>But you demand from me an explanation of the thousand years. And I will demand from you an explanation of the lampstand (Rev. 2:1): “the white stone” (Rev. 2:17), the lukewarm drink and the spewing out (Rev. 3:16), everything that John represented figuratively when he wrote to the seven Churches. If you demand from me the first resurrection of the thousand years, then I too will demand from you the horse (Rev. 6:8), and the pale angel, and the living spiritual being called apsinthos (Rev. 8:11), bitter in nature, like wormwood. Give me the “seven bowls” (Rev. 16:1) and take from me the thousand years. Prove that the woman means the city (Rev. 21:9–10), and I will present you the proof concerning the thousand years. Explain to me that the woman, who is herself lifted up (Rev. 12:14), will become Jerusalem and is in fact not a woman, and I will give you an explanation of the thousand years. Does the city give birth? (Rev. 12:2). Does she who has given birth become Jerusalem? Is the “man of lawlessness” (2 Thess. 2:3) the beast? (Rev. 13:1). Are the ten heads joined in the beast so that they may reign? (Rev. 13:1). Is there an eighth of the seven, who however is not eighth in number, because the heads are seven, but three heads were destroyed? (Rev. 17:11). Is the name of the beast inexplicable and as unnameable as the name of God? God forbid! Did the one who said the “number” of the name not know the name of the beast? (Rev. 13:18). First the syllables became known to him, and then he divided the name into letters; first he pronounced the name within himself, and then, having put the letters together, he said the number, that is, that six hundred and sixty-six is made up of the letters. <strong><mark>So also by the thousand years he figuratively understood the immensity of eternal life.</mark></strong> For if “one day with the Lord is as a thousand years” (2 Pet. 3:8), who is able to calculate how many days there are in a thousand years and to determine the thousands of thousands and the myriads of myriads of such a number of days? Therefore, <strong>by the infinite number of years in these days and of days in these thousands of years, he defined the rest of the saints after the resurrection by a thousand years</strong>.</p>
    </blockquote>
    <p>(On Repentance)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
