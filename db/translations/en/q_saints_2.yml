    <p>See also: <a href="https://bibleox.com/ru/ru/w/eUGEupHc_%D0%9F%D1%80%D0%B5%D0%B4%D0%BE%D0%BF%D1%80%D0%B5%D0%B4%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5" lang="ru">quotes on predestination</a>.</p>
    <h2>1st century</h2>
    <h3>St Paul, apostle (c. 5–64)</h3>
    <blockquote><p>“For we are God’s <strong><mark>fellow workers (συνεργοί [synergoi])</mark></strong>; you are God’s field, you are God’s building.”</p></blockquote>
    <p>(<a href="https://bibleox.com/en/eng-nkjv/1kor/3/#L9">1 Cor. 3:9</a>)</p>
    <h2>4th century</h2>
    <h3>St Macarius the Great of Egypt, monk (c. 300–391)</h3>
    <blockquote><p><strong><mark>The soul</mark> that loves God, even if it <mark>does</mark> all good, is wont to <mark>ascribe</mark> every <mark>deed</mark> not to itself but to <mark>God</mark>. Therefore <mark>God also</mark>, on His part, <mark>seeing</mark> the sound and right <mark>understanding and knowledge of the soul</mark>, <mark>imputes every deed to it; and as though it had itself laboured</mark>, and <mark>itself</mark> of itself <mark>had produced all things</mark>, <mark>proportions the recompense</mark></strong>. But if it had pleased Him to enter into judgment with us, nothing would have been found that in truth belongs to man: for both possessions and all the supposed goods on earth, by which a man can do good, and the earth and all that is in it, the body itself, and the soul itself, belong to Him. And not only all the rest, but man has even his very being by mercy. Therefore what property remains to him, of which he could rightly boast or by which he could justify himself? However, God accepts what is brought by men as the greatest gift, and of all that is brought nothing is more pleasing to Him than that the soul, knowing well the relations of things — all that it does that is good, all in which it labours for God, all that it understands and knows — imputes it to Him and ascribes all to Him.</p></blockquote>
    <p>(Seven Homilies, On the Freedom of the Mind, §8)</p>
    <h3>St Gregory the Theologian, archbishop of Constantinople (c. 325–389)</h3>
    <blockquote><p>When you hear “To whom it is given,” add, “And it is given to those who are called and to those who incline that way.” For when you hear, “Not of him that willeth, nor of him that runneth, but of God that sheweth mercy” (<u>Rom. 9:16</u>), I counsel you to think the same. <strong>For since there are some who are so proud of their successes that they attribute all to themselves and nothing to Him that made them and gave them wisdom</strong> and supplied them with good; such are taught by this word that even to wish well needs help from God; or rather that even to choose what is right is divine and a gift of the mercy of God. <strong>For it is necessary <mark>both that we should be </mark><u><mark>our own masters</mark></u><mark> and also that our salvation should be </mark><u><mark>of God</mark></u>.</strong> This is why He saith not of him that willeth; that is, not of him that willeth only, nor of him that runneth only, but also of God. That sheweth mercy.</p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-orations-3#HH-On-the-Words-of-the-Gospel-When-Jesus-Had-Finished-These-Sayings-Etc--S-Matt-xix-1">Select Orations, Oration 37</a>)</p>
    <h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3>
    <blockquote><p><strong><em>For if He has chosen you to salvation, He does not deceive you, nor suffer you utterly to perish. But that he may not by these means lead them to sloth, and lest they thinking the whole to be of God should themselves sleep</em></strong><em>, see how he also </em><strong><em>demands <mark>coöperation</mark> from them</em></strong><em>, saying, “And we have confidence in the Lord touching you, that ye both do and will do the things which we command you.” “The Lord” indeed, he says, </em><strong><em>“is faithful,” and having promised to save <mark>will certainly save; but as He promised. And how did He promise? If we be willing</mark>, <mark>and hear Him</mark>; <mark>not simply (hearing), nor like stocks and stones, being inactive</mark></em></strong><em>. &lt;…&gt; For it becomes us indeed to cast everything upon Him, yet </em><strong><em><mark>working also ourselves</mark></em></strong><em>, </em><strong><em><mark>embarked in the labors and the conflicts</mark></em></strong><em>. And he shows that </em><strong><em>even if our virtue alone were sufficient to save, yet nevertheless it ought to be persevering, and to abide with us until we come to our latest breath</em></strong><em>. &lt;…&gt; For this reason we need, as a certain wind, </em><strong><em><mark>the assistance of God</mark></em></strong><em>, that our sail may be impelled, as by some strong wind, to the love of God. For tell me not, “I love Him, even more than myself.” These are words. Show it to me by thy works, if thou lovest Him </em><em>more than thyself.</em></p></blockquote>
    <p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-second-thessalonians#HH-2-Thessalonians-33-5">Homilies on Second Thessalonians, Homily 5</a>)</p>
    <h2>5th century</h2>
    <h3>St Cyril of Alexandria, archbishop (376–444)</h3>
    <blockquote><p>So then, it is necessary and fitting for us, I affirm, <strong>on the one hand, to endeavour to show our own strength</strong> of character and God-loving disposition, and to prove ourselves courageous in the work of accomplishing our salvation, <strong>and on the other hand, also to ask of God from on high His <mark>cooperation</mark></strong>, as a kind of invincible and indestructible panoply, since we have resolved to struggle courageously. And since God has once granted us this and has been well pleased to do so, it is already possible for us to overcome the power of the enemies and to conquer the authority of the devil, if we do not choose to obey him who calls us to sensual pleasure or to another kind of sin. For as soon as we surrender our will to him and, through our inclination to evil, find ourselves given over into his net, would it be just to accuse anyone else, and not rather to ascribe the guilt to our own folly? &lt;…&gt; Therefore, if it was impossible for the traitor, equally with the other disciples, to receive help from the Saviour, let someone prove it, and we will agree. But if he, having equally with the others the protection of divine grace around him, fell into the pit of perdition by his own desire, did Christ not preserve him, showing him His mercy and, as far as the giving of help to man was concerned, would He not have saved him, had he himself not wished by his own will to be subjected to evil? Thus <strong>grace shone in others, always saving those who made their will, as it were, its <mark>co-worker</mark> (a helper of grace), for <mark>so will the image of each one’s salvation be ordered</mark>.</strong></p></blockquote>
    <p>(Commentary on John 17:12–13)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
