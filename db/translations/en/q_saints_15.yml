  path: Eucharist-sacrificial-meaning
  title: The Sacrificial Meaning of the Eucharist
  menu:
    parent: Sacraments of the Church/Eucharist (Communion)
    title: The Sacrificial Meaning of the Eucharist
    priority: 5
  body: '<h2>1st century</h2><h3>Clement of Rome, hieromartyr (early 1st century –
    101)</h3><blockquote><p><em>Our apostles also knew through our Lord Jesus Christ
    that there would be strife about the dignity of the episcopate. For this very
    reason they, having received a perfect foreknowledge, appointed the above-mentioned
    ministers, and afterwards added the law that when they should fall asleep, other
    tried men should take upon them their ministry. So we consider it unjust to deprive
    of the ministry those who were appointed by the apostles themselves, or afterwards
    by other esteemed men, with the consent of the whole Church, and who have served
    the flock of Christ blamelessly, with humility, meekly and without reproach, and
    for a long time have received the approval of all. And </em><strong><em>no small
    sin will be on us, if we deprive of the episcopate those who blamelessly and holily
    <mark>offer the gifts</mark></em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/ClemRm_Kor1#HH-44">First
    Epistle to the Corinthians, ch. 44</a>; translated from the Russian: the Greek
    has τὰς προσφορὰς, “who offer the gifts”, which the library’s English translation
    renders as “fulfilled its duties”)</p><h3>St Ignatius the God-bearer, bishop of
    Antioch, hieromartyr (c. 35–107)</h3><blockquote><p><em>Take ye heed, then, to
    have but one Eucharist. For there is one flesh of our Lord Jesus Christ, and one
    cup to the unity of His blood; </em><strong><em>one <mark>altar</mark>; as there
    is one bishop, along with the presbytery and deacons</em></strong><em>, my fellow-servants:
    that so, whatsoever ye do, ye may do it according to God.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Ph#HH-4">To the Philadelphians, ch. 4</a>)</p><blockquote><p><em>Let
    no man deceive himself: </em><strong><em>if any one be not within the <mark>altar</mark>,
    he is deprived of the bread of God</em></strong><em>. For if the prayer of one
    or two possesses such power, how much more that of the bishop and the whole Church!
    He, therefore, that does not assemble with the Church, has even by this manifested
    his pride, and condemned himself. For it is written, “God resisteth the proud.”
    Let us be careful, then, not to set ourselves in opposition to the bishop, in
    order that we may be subject to God.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-5">To
    the Ephesians, ch. 5</a>)</p><h2>2nd century</h2><h3>St Justin the Philosopher,
    martyr (c. 100–165)</h3><blockquote><p>Accordingly, God, anticipating all <strong><mark>the
    sacrifices</mark></strong> which we offer through this name, and <strong><mark>which
    Jesus the Christ enjoined us to offer</mark></strong>, i.e., <strong><mark>in
    the Eucharist of the bread and the cup, and which are presented by Christians
    in all places throughout the world</mark></strong>, bears witness that they are
    well-pleasing to Him. But He utterly rejects those presented by you and by those
    priests of yours</p><p>&lt;…&gt;</p><p>Now, that prayers and giving of thanks,
    when offered by worthy men, are the only perfect and well-pleasing sacrifices
    to God, I also admit. <strong><mark>For such alone Christians have undertaken
    to offer, and in the remembrance effected by their solid and liquid food</mark>
    (that is, the Eucharist — tr.)</strong>, whereby the suffering of the Son of God
    which He endured is brought to mind</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-117">Dialogue
    with Trypho, ch. 117</a>)</p><h3>Apollonius of Rome, martyr († c. 183)</h3><blockquote><p>As
    to the change of my purpose and as to the oath, I have already given an answer;
    and <strong><mark>as to the sacrifices, we Christians offer a bloodless sacrifice
    to God</mark></strong>, the Lord of heaven and earth and sea and of all that is
    living in them, for the rational images endowed with a soul (that is, men), which
    are appointed by the providence of God to govern upon earth</p></blockquote><p>(Apology)</p><h3>St
    Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p><em>The </em><strong><em>oblation
    of the Church, therefore, which the Lord gave instructions to be offered throughout
    all the world, is accounted with God a pure sacrifice, and is acceptable to Him;
    not that He stands in need of a sacrifice from us, but that he who offers is himself
    glorified in what he does offer, if his gift be accepted. For by the gift both
    honour and affection are shown forth towards the King</em></strong><em>; and </em><strong><em>the
    Lord, wishing us <mark>to offer it</mark> in all simplicity and innocence</em></strong><em>,
    did express Himself thus: “Therefore, when thou offerest thy gift upon the altar,
    and shalt remember that thy brother hath ought against thee, leave thy gift before
    the altar, and go thy way; first be reconciled to thy brother, and then return
    and offer thy gift.” (Matt. 5:23-24) </em><strong><em><mark>We are bound, therefore,
    to offer to God the first-fruits of His creation</mark></em></strong><em>, as
    Moses also says, “Thou shalt not appear in the presence of the Lord thy God empty;”
    (Deut. 16:16) so that man, being accounted as grateful, by those things in which
    he has shown his gratitude, may receive that honour which flows from Him.</em></p><p><em>2.
    </em><strong><em><mark>And the class of oblations in general has not been set
    aside; for there were both oblations there (in the Old Testament), and there are
    oblations here (in the New); Sacrifices there were among the people (of the Jews);
    sacrifices there are, too, in the Church (of the Christians): but the species
    alone has been changed</mark></em></strong></p><p>&lt;…&gt;</p><p><em>At the beginning
    </em><strong><em>God had respect to the gifts of Abel, because he offered with
    single-mindedness and righteousness</em></strong><em>, but He had no respect unto
    the offering of Cain, because his heart was divided with envy and malice &lt;...&gt;
    If any one shall endeavour to offer a sacrifice merely to outward appearance,
    unexceptionably, in due order, and according to appointment, while in his soul
    he does not assign to his neighbour that fellowship with him which is right and
    proper, nor is under the fear of God; he who thus cherishes secret sin does not
    deceive God by that sacrifice which is offered correctly as to outward appearance;
    nor will such an oblation profit him anything.</em></p><p><em>&lt;...&gt;</em></p><p><em>Inasmuch,
    then, as the </em><strong><em>Church offers with single-mindedness, her gift is
    justly reckoned a pure sacrifice with God</em></strong><em>.</em></p><p><em>&lt;...&gt;</em></p><p><em>For
    </em><strong><em><mark>it behoves us to make an oblation to God</mark>, and in
    all things to be found grateful to God our Maker, in a pure mind, and in faith
    without hypocrisy, in well-grounded hope, in fervent love, <mark>offering the
    first-fruits of His own created things</mark></em></strong><em>. And the Church
    alone offers this pure oblation to the Creator, offering to Him, with giving of
    thanks, from His creation. But the Jews do not offer thus: for their hands are
    full of blood; for they have not received the Word, through whom it is offered
    to God. Nor, again, </em><strong><em>do any of the conventicles of the heretics
    offer this</em></strong><em>.</em></p><p><em>&lt;...&gt;</em></p><p><em>But how
    can they be consistent with themselves, when they say that the bread over which
    thanks have been given is the body of their Lord, and the cup His blood, if they
    do not call Himself the Son of the Creator of the world</em></p><p><em>&lt;...&gt;</em></p><p><em>Then,
    again, how can they say that the flesh, which is nourished with the body of the
    Lord and with His blood, goes to corruption, and does not partake of life? </em><strong><em>Let
    them, therefore, either alter their opinion, or cease from offering the things
    just mentioned (that is, the Eucharist — tr.). But our opinion is in accordance
    with the Eucharist, and the Eucharist in turn establishes our opinion.</em></strong><em>
    </em><strong><em>For <mark>we offer to Him His own</mark></em></strong><em>, announcing
    consistently the fellowship and union of the flesh and Spirit. For as the bread,
    which is produced from the earth, when it receives the invocation of God, is no
    longer common bread, but </em><strong><em>the Eucharist</em></strong><em>, consisting
    of two realities, earthly and heavenly; so also our bodies, when they receive
    </em><strong><em>the Eucharist</em></strong><em>, are no longer corruptible, having
    the hope of the resurrection to eternity.</em></p><p><em>6. </em><strong><em><mark>Now
    we make offering to Him, not as though He stood in need of it, but rendering thanks
    for His gift, and thus sanctifying what has been created.</mark></em></strong><em>
    &lt;...&gt; As, therefore, </em><strong><em><mark>He does not stand in need of
    these, yet does desire that we should render them for our own benefit</mark></em></strong><em>,
    lest we be unfruitful; so did the </em><strong><em>Word give to the people (the
    Jews) that very precept as to the making of oblations, although He stood in no
    need of them, that they might learn to serve God: thus is it, therefore, also
    <mark>His will that we, too, should offer a gift at the altar, frequently and
    without intermission</mark>.</em></strong></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-18"><u>Against
    Heresies, Book IV, ch. 18</u></a>)</p><h3>Tertullian (c. 155–220)</h3><blockquote><p><em>Similarly,
    too, touching the days of Stations, most think that they must not be present at
    </em><strong><em><mark>the sacrificial prayers</mark></em></strong><em>, on the
    ground that the Station must be dissolved by reception of the Lord’s Body. Does,
    then, </em><strong><em>the Eucharist</em></strong><em> cancel a service devoted
    to God, or bind it more to God? Will not your Station be more solemn if </em><strong><em>you
    have withal stood at God’s altar</em></strong><em>? When the Lord’s Body has been
    received and reserved each point is secured, both </em><strong><em><mark>the participation
    of the sacrifice</mark></em></strong><em> and the discharge of duty.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-on-prayer#HH-Of-Stations"><u>On Prayer,
    ch. 19</u></a><u>)</u></p><h2>3rd century</h2><h3>St Cyprian of Carthage, hieromartyr
    (c. 200–258)</h3><blockquote><p>Cyprian to Cæcilius his brother, greeting. Although
    I know, dearest brother, that very many of the bishops who are set over the churches
    of the Lord by divine condescension, throughout the whole world, maintain the
    plan of evangelical truth, and of the tradition of the Lord, and do not by human
    and novel institution depart from that which <strong>Christ our Master both prescribed
    and did</strong>; yet since some, either by ignorance or simplicity in sanctifying
    the cup of the Lord, and in ministering to the people, do not do that which <strong>Jesus
    Christ, our Lord and God, the founder and teacher of <mark>this sacrifice</mark></strong>,
    did and taught, I have thought it as well a religious as a necessary thing to
    write to you this letter &lt;…&gt; Know then that I have been admonished that,
    in <strong><mark>offering the cup</mark></strong>, the tradition of the Lord must
    be observed, and that nothing must be done by us but what the Lord first did on
    our behalf, as that the cup which is offered in remembrance of Him should be offered
    mingled with wine.</p><p>&lt;…&gt;</p><p>The cup which the Lord offered was mixed,
    and that that was wine which He called His blood. Whence it appears that the blood
    of Christ is not offered if there be no wine in the cup, nor the Lord’s <strong><mark>sacrifice</mark></strong>
    celebrated with a legitimate consecration unless our oblation and <strong><mark>sacrifice</mark></strong>
    respond to His passion. But how shall we drink the new wine of the fruit of the
    vine with Christ in the kingdom of His Father, if in the <strong><mark>sacrifice
    of God the Father and of Christ</mark></strong> we do not offer wine, nor mix
    the cup of the Lord by the Lord’s own tradition?</p><p>&lt;…&gt;</p><p>But how
    perverse and how contrary it is, that although the Lord at the marriage made wine
    of water, we should make water of wine, when even the sacrament of that thing
    ought to admonish and instruct us rather <strong>to offer wine in the <mark>sacrifices</mark>
    of the Lord.</strong></p><p>&lt;…&gt;</p><p>There is then no reason, dearest brother,
    for any one to think that the custom of certain persons is to be followed, who
    have thought in time past that water alone should be offered in the cup of the
    Lord. For we must inquire whom they themselves have followed. For if in the <strong><mark>sacrifice</mark></strong>
    which Christ offered none is to be followed but Christ, assuredly it behoves us
    to obey and do that which Christ did</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-Cæcilius-on-the-Sacrament-of-the-Cup-of-the-Lord">Letter
    63. To Cæcilius, on the Sacrament of the Cup of the Lord</a>)</p><blockquote><p>Basilides
    and Martial, being stained with the certificates of idolatry, and bound with the
    consciousness of wicked crimes, ought not to hold the episcopate and administer
    the priesthood of God; and you desired an answer to be written to you again concerning
    these things, and your solicitude, no less just than needful, to be relieved either
    by the comfort or by the help of our judgment. Nevertheless to this your desire
    not so much our counsels as the divine precepts reply, in which it is long since
    bidden by the voice of Heaven and prescribed by the law of God, who and what sort
    of persons ought to serve the altar and to <strong><mark>celebrate the divine
    sacrifices</mark></strong>. For in Exodus God speaks to Moses, and warns him,
    saying, “Let the priests which come near to the Lord God sanctify themselves,
    lest the Lord forsake them.” (Exod. 19:22) And again: “And when they come near
    to the altar of the Holy One to minister they shall not bring sin upon them, lest
    they die.” (Exod. 28:43) Also in Leviticus the Lord commands and says, “Whosoever
    hath any spot or blemish upon him, <strong>shall not approach to offer gifts to
    God</strong>.” (Lev. 21:17)</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-the-Clergy-and-People-Abiding-in-Spain-Concerning-Basilides-and-Martial">Letter
    to the clergy and people of Spain, concerning Basilides and Martial</a>)</p><blockquote><p>But
    I and my colleagues, and all the brotherhood, send this letter to you in the stead
    of us, dearest brother; and setting forth to you by our letter our joy, we express
    the faithful inclination of our love here also in <strong><mark>our sacrifices</mark>
    and our prayers</strong>, not ceasing to give thanks to God the Father, and to
    Christ His Son our Lord</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-Lucius-The-Bishop-of-Rome-Returned-from-Banishment">Letter
    to Lucius, bishop of Rome, on his return from banishment</a>)</p><h2>4th century</h2><h3>St
    Cyril of Jerusalem, bishop (315–386)</h3><blockquote><p>7. Then having sanctified
    ourselves by these spiritual Hymns, we beseech the merciful God to send forth
    His Holy Spirit upon <strong><mark>the gifts lying before Him</mark></strong>:
    that He may make <em>the Bread the Body of Christ, and the Wine the Blood of Christ</em>;
    for whatsoever the Holy Ghost has touched, is surely sanctified and changed.</p><p>8.
    Then, <strong><u><mark>after</mark></u><mark> the spiritual sacrifice</mark></strong>,
    <strong><mark>the bloodless service</mark></strong>, is completed, over that sacrifice
    of propitiation <strong>we entreat</strong> God for the common peace of the Churches,
    for the welfare of the world; for kings; for soldiers and allies; for the sick;
    for the afflicted; and, in a word, for all who stand in need of succour we all
    pray and offer this sacrifice.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyril_jer-the-catechetical-lectures-3#HH-On-the-Mysteries-V--On-the-Sacred-Liturgy-and-Communion">On
    the Mysteries, V</a>)</p><h3>Serapion of Thmuis, bishop (early 4th c. – after
    362)</h3><blockquote><p><em>Lord of hosts, fulfil also </em><strong><em><mark>this
    sacrifice</mark></em></strong><em> of Thy power and of Thy communion; for </em><strong><em><mark>we
    have offered to Thee this living sacrifice, the unbloody oblation</mark></em></strong><em>;
    </em><strong><em><mark>to Thee we have offered this bread</mark></em></strong><em>,
    the likeness of the body of the Only-begotten. This bread is the likeness of the
    holy body, because the Lord Jesus Christ, on the night on which He was betrayed,
    took bread, and broke it, and gave to His disciples, saying: Take and eat, this
    is My body, which is broken for you, for the remission of sins. Therefore we also,
    performing the likeness of the death, have offered the bread, and pray through
    </em><strong><em><mark>this sacrifice</mark></em></strong><em>: forgive us all,
    and have mercy, O God of truth. And as this bread was sown over the mountains,
    and when gathered together became one (whole), so gather Thy holy Church from
    every nation, and from every country, and from every city, and village and dwelling,
    and make it one living catholic Church. </em><strong><em><mark>We have offered
    also the cup</mark> </em></strong><em>, the likeness of the blood, because the
    Lord Jesus Christ, taking the cup after supper, said to His disciples: Take, drink,
    this (cup) is the new covenant, this is My blood, which is shed for you, for the
    remission of sins. Therefore </em><strong><em><mark>we have offered also the cup</mark>
    </em></strong><em>, the likeness of the blood, praying: </em><strong><em>May the
    God of truth come, and Thy holy Word descend upon this bread, that the bread may
    become the body of the Word, and upon this cup, that the cup may become the true
    blood</em></strong><em> of Christ, and grant that all who communicate may receive
    the medicine of life for the healing of every sickness, for the increase of all
    progress and virtue, not for condemnation, O God of truth, nor for rebuke and
    shame, because we have called upon Thee, the Unbegotten, through the Only-begotten,
    in the Holy Spirit; may this people obtain mercy, may it be granted progress,
    and may angels be sent to accompany the people, to withstand the evil one and
    to strengthen the Church.</em></p></blockquote><p>(Euchologion, the Prayer of
    Offering)</p><h2>5th century</h2><h3>Blessed Theodoret of Cyrrhus (c. 386–457)</h3><blockquote><p>We
    have an altar, whereof they have no right to eat which serve the tabernacle.</p><p>“<strong>We
    have an altar</strong>, whereof they have no right to eat which serve the tabernacle”,
    <strong>that is, an altar far more honourable than that of the Old Testament</strong>.
    For that was a shadow; it received irrational sacrifices, but <strong><mark>ours
    is a rational and Divine sacrifice</mark></strong>; wherefore not one of those
    priests partakes of this sacrifice unless he first receive faith in the Lord.</p></blockquote><p>(Commentary
    on the Epistle to the Hebrews)</p>'
