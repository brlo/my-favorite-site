      <h2>The Priesthood Established by God in the Old Testament</h2><p>The priests are only the descendants of Aaron:</p><blockquote><p>“And you shall gird them with sashes, <strong>Aaron and his sons</strong>, and put the hats on them. <strong>The priesthood shall be theirs</strong> for a perpetual statute. So you shall consecrate Aaron and his sons” (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L9">Ex. 29:9</a>)</p></blockquote><p>The priesthood is handed down together with the holy garments, by anointing:</p><blockquote><p>“And <strong>the holy garments</strong> of Aaron <strong>shall be his sons’ after him</strong>, <strong>to be anointed in them and to be consecrated in them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29">Ex. 29:29</a>)</p></blockquote><p>An outsider who approached the sacred service had to die. The task of the priesthood was to watch over this:</p><blockquote><p>“So you shall appoint Aaron and his sons, and they shall attend to their priesthood; <strong>but the outsider who comes near shall be put to death</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/3/#L10">Num. 3:10</a>)</p></blockquote><p>In detail:</p><blockquote><p>“Then <strong><mark>the LORD said to Aaron: ‘You and your sons</mark></strong> and your father’s house with you shall bear the iniquity related to the sanctuary, and <strong>you and your sons with you</strong> shall bear the iniquity associated with your priesthood. Also bring with you <strong>your brethren of the tribe of Levi</strong>, the tribe of your father, <strong>that they may be joined with you and serve you</strong> while <strong>you and your sons are with you before the tabernacle of witness</strong>. They [the Levites] shall attend to your needs and all the needs of the tabernacle; but they shall not come near the articles of the sanctuary and the altar, lest they die — they [the Levites] and you [Aaron and his sons] also. &lt;...&gt; Therefore <strong><mark>you and your sons with you shall attend to your priesthood</mark></strong> for everything at the altar and behind the veil; and you shall serve. <strong><mark>I give your priesthood to you as a gift for service, but the outsider who comes near shall be put to death</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/chis/18/#L1-3,7">Num. 18:1-3,7</a>)</p></blockquote><h2>The Change of the Priesthood in the New Testament</h2><p>The Lord Jesus Christ makes the New Covenant (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L20">Luke. 22:20</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/8/#L8">Heb. 8:8</a>), changes the law, changes the priesthood (changes, and does not abolish):</p><blockquote><p>“For <strong>the priesthood (ἱερωσύνης) being changed, of necessity there is also a change of the law</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L12">Heb. 7:12</a>)</p></blockquote><p>The Savior sends the Holy Spirit to the apostles, establishing the hierarchy of the priesthood according to the order of Melchizedek, and Himself becomes the High Priest:</p><blockquote><p>“even <strong>Jesus, having become High Priest forever according to the order of Melchizedek</strong>. For this Melchizedek, king of Salem, priest of the Most High God, who met Abraham returning from the slaughter of the kings and blessed him, to whom also Abraham gave a tenth part of all, first being translated <strong>‘king of righteousness,’</strong> and then also king of Salem, meaning <strong>‘king of peace,’</strong> without father, without mother, without genealogy, <strong>having neither beginning of days nor end of life, but made like the Son of God, remains a priest continually</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/6/#L20">Heb. 6:20</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/7/#L1-3">7:1-3</a>)</p></blockquote><blockquote><p>“Now this is the main point of the things we are saying: <strong>We have such a High Priest, who is seated at the right hand of the throne of the Majesty in the heavens</strong>” (<a href="https://bibleox.com/en/eng-nkjv/evr/8/#L1">Heb. 8:1</a>)</p></blockquote><h2>The Formation of the Church Hierarchy</h2><p>On the day of Pentecost the Holy Spirit is sent to the apostles and to the whole church assembly, to the whole Church. But even before this day the Savior appears to the apostles alone, and to them alone He sends the Holy Spirit, giving them, as priests, the authority to forgive sins, that is, establishing the hierarchy:</p><blockquote><p>“So Jesus said to them again, ‘Peace to you! As the Father has sent Me, I also send you.’ And when He had said this, <strong>He breathed</strong> on them, and said to them, ‘<strong>Receive the Holy Spirit.</strong> <strong>If you forgive the sins of any, they are forgiven them; if you retain the sins of any, they are retained</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L21-23">John. 20:21-23</a>)</p></blockquote><p>Likewise, in the Old Testament church the work of cleansing from sin lay precisely with the priesthood:</p><blockquote><p>“And it shall be, when he is guilty in any of these matters, that <strong>he shall confess that he has sinned in that thing</strong>; and he shall bring his trespass offering to the LORD for his sin which he has committed, a female from the flock, a lamb or a kid of the goats as a sin offering. <strong>So the priest shall make atonement for him concerning his sin</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lev/5/#L5-6">Lev. 5:5-6</a>)</p></blockquote><h2>The Authority of the New Hierarchy</h2><p>The Lord gives the apostles the keys of the Heavenly Kingdom and the authority to forbid and permit (to bind and loose):</p><blockquote><p>“And I will give you the keys of the kingdom of heaven, and <strong>whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L19">Matt. 16:19</a>)</p></blockquote><blockquote><p>“Assuredly, I say to you, <strong>whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L18">Matt. 18:18</a>)</p></blockquote><p>The apostles chose and ordained the priesthood, but Scripture says that it was the Holy Spirit who appointed the presbyters to oversee the Church:</p><blockquote><p>“he sent to Ephesus and <strong>called for the elders of the church</strong>. And when they had come to him, he said to them: &lt;...&gt; ‘Therefore take heed to yourselves and to all the flock, among which <strong>the Holy Spirit has made you overseers, to shepherd the church of God</strong> which He purchased with His own blood’” (<a href="https://bibleox.com/en/eng-nkjv/act/20/#L17-18,28">Act. 20:17-18,28</a>)</p></blockquote><p>All this is the fulfillment of an Old Testament prophecy, about which more follows.</p><h2>The Prophecy of the New Testament Priesthood</h2><p>In the Old Testament church priests were appointed only from the Jewish people, the tribe of Levi, the family of Aaron. But in the New Testament Church priests will be appointed from all nations, and not only from the Jewish people (the family of Aaron):</p><blockquote><p>“It shall be that <strong>I will gather all nations and tongues</strong>; and they shall come and see My glory. I will set a sign among them; and those among them who escape I will send to the nations: to Tarshish and Pul and Lud, who draw the bow, and Tubal and Javan, to the coastlands afar off <strong>who have not heard My fame nor seen My glory</strong>. And they shall declare My glory among the Gentiles. Then they shall bring all your brethren for an offering to the LORD out of all nations, on horses and in chariots and in litters, on mules and on camels, to My holy mountain Jerusalem,’ says the LORD, ‘as the children of Israel bring an offering in a clean vessel into the house of the LORD. <strong>And I will also take some of them for priests and Levites,’ says the LORD</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/66/#L18-21">Isa. 66:18-21</a>)</p></blockquote><h2>The Teaching on Apostolic Succession and Ordination</h2><h3>The Ordination of Bishops</h3><p>Bishop Timothy has a special gift through the laying on of the apostle’s hands, together with the laying on of the hands of other bishops already ordained before:</p><blockquote><p>“Therefore I remind you to stir up <strong><mark>the gift of God</mark> which is in you <u><mark>through</mark></u><mark> the laying on of my hands</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6">2 Tim. 1:6</a>)</p></blockquote><blockquote><p>“Do not neglect <strong>the <mark>gift</mark> that is in you, which was given to you by prophecy <mark>with the laying on of the hands of the eldership</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L14">1 Tim. 4:14</a>) <em>(Greek: τοῦ πρεσβυτερίου — “of the presbytery”)</em></p></blockquote><p>Simon the sorcerer saw that not every Christian is able to lay on hands for the giving of the Holy Spirit. Literally: not everyone has such authority. He brought a bribe to the apostles so that they would give him such authority too (the apostles cursed him):</p><blockquote><p>“And when Simon saw that <strong>through the laying on of the apostles’ hands the Holy Spirit was given</strong>, he offered them money, saying, <strong>‘Give me this power also</strong>, that <strong><mark>anyone on whom I lay hands</mark> may receive the Holy Spirit.’</strong> But Peter said to him, ‘Your money perish with you, because you thought that <strong><mark>the gift of God</mark></strong> could be purchased with money!’” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L18-20">Act. 8:18-20</a>)</p></blockquote><h3>The Ordination of the Apostle Paul</h3><blockquote><p>“As they ministered to the Lord and fasted, the Holy Spirit said, ‘Now separate to Me Barnabas and <strong><mark>Saul</mark></strong> for the work to which I have called them.’ Then, having fasted and prayed, and <strong><mark>laid hands on them</mark></strong>, they sent them away” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L2-3">Act. 13:2-3</a>)</p></blockquote><h3>The Ordination of Deacons</h3><blockquote><p>“whom they set before the apostles; and when they had prayed, they <strong>laid hands on them</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/6/#L6">Act. 6:6</a>; <a href="https://bibleox.com/en/eng-nkjv/act/21/#L8">21:8</a>)</p></blockquote><h3>The Teaching on Ordination</h3><p>The apostolic teaching on the laying on of hands:</p><blockquote><p>“of the <strong>doctrine</strong> of baptisms, <strong>of laying on of hands</strong>, of resurrection of the dead, and of eternal judgment” (<a href="https://bibleox.com/en/eng-nkjv/evr/6/#L2">Heb. 6:2</a>)</p></blockquote><p>A warning not to hurry to ordain (to the priesthood):</p><blockquote><p>“<strong>Do not lay hands on anyone hastily</strong>, nor share in other people’s sins; keep yourself pure” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L22">1 Tim. 5:22</a>)</p></blockquote><h2>Bishops and Presbyters — the Difference</h2><p>The terms bishop (Greek ἐπίσκοπος — “overseer”, “supervisor”) and presbyter (Greek πρεσβύτερος — “elder, head of a community”) have a mixed usage and are as it were interchangeable terms. However, the functions and authority of particular people are clearly visible, whatever they are called. Titus was to complete the apostle’s work and appoint presbyters in Crete:</p><blockquote><p>“For this reason I left you in Crete, that you should set in order the things that are lacking, and <strong>appoint elders in every city</strong> as I commanded you” (<a href="https://bibleox.com/en/eng-nkjv/tit/1/#L5">Titus. 1:5</a>)</p></blockquote><p>Timothy could judge his presbyters, rebuke and forbid believers:</p><blockquote><p>“Do not receive <strong>an accusation against an elder</strong> except from two or three witnesses” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L19">1 Tim. 5:19</a>)</p></blockquote><blockquote><p>“Preach the word! Be ready in season and out of season. <strong>Convince, rebuke</strong>, exhort, with all longsuffering and teaching” (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L2">2 Tim. 4:2</a>)</p></blockquote><p>Thus Titus and Timothy were bishops in today’s understanding, even if they were called presbyters.</p><h2>Are All Priests?</h2><h3>The Parallel with Old Testament Words</h3><p>The Apostle Peter repeats Old Testament words, calling all Christians a royal priesthood and a holy nation:</p><blockquote><p>“But <strong>you are a chosen generation, <u>a royal priesthood</u>, <u>a holy nation</u></strong>, His own special people, that you may proclaim the praises of Him who called you out of darkness into His marvelous light” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L9">1 Pet. 2:9</a>)</p></blockquote><p>The same words in the Old Testament are addressed to all Israel:</p><blockquote><p>“Now therefore, if you will indeed obey My voice and keep My covenant, then you shall be a special treasure to Me above all people; for all the earth is Mine. And <strong>you shall be to Me <u>a kingdom of priests</u> and <u>a holy nation</u></strong>.’ These are the words which you shall speak to the children of Israel” (<a href="https://bibleox.com/en/eng-nkjv/ish/19/#L5-6">Ex. 19:5-6</a>)</p></blockquote><p>Thus God already calls Old Testament Israel a kingdom of priests and a holy nation. However, in the liturgical sense not all Jews were priests. According to the Law, only the priesthood of Aaron could enter the Tabernacle, and the others would have had to pay with their own lives for entering the Tabernacle, that is, they would have had to die (<a href="https://bibleox.com/en/eng-nkjv/chis/3/#L10">Num. 3:10</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/3/#L38">3:38</a>; <a href="https://bibleox.com/en/eng-nkjv/chis/18/#L7">18:7</a>).</p><p>If in the Old Testament we separate the words “kingdom of priests” (not all) and “holy nation” (all), then the same separation will have to be admitted in the New Testament words of the apostle: royal priesthood (not all), holy nation (all) (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L9">1 Pet. 2:9</a>). The statements can be understood either literally or allegorically, but in any case both phrases will have to be connected and understood accordingly, in one key.</p><h3>An Attempt to Establish a Universal Priesthood in the Old Testament</h3><p>In the Old Testament God established an order according to which only the descendants of Aaron could be priests:</p><blockquote><p>“And the holy garments of Aaron shall be his sons’ after him, to be anointed in them and to be consecrated in them” (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L29">Ex. 29:29</a>)</p></blockquote><p>Even from the family of Aaron not all could become priests:</p><blockquote><p>“<strong>No man of the descendants of Aaron the priest, who has a defect, shall come near to offer the offerings made by fire to the LORD</strong>. He has a defect; he shall not come near to offer the bread of his God. &lt;...&gt; only he shall not go near the veil or approach the altar, because he has a defect, <strong>lest he profane My sanctuaries</strong>; for I the LORD sanctify them” (<a href="https://bibleox.com/en/eng-nkjv/lev/21/#L21,23">Lev. 21:21,23</a>)</p></blockquote><p>Against this divine order rose up <strong>Korah, Dathan, Abiram and On</strong>, demanding of the prophet Moses that priests be appointed from the whole people, and not only from the family of Aaron. They referred to that very phrase (<a href="https://bibleox.com/en/eng-nkjv/ish/19/#L5-6">Ex. 19:5-6</a>), saying that all are holy:</p><blockquote><p>“They gathered together against Moses and Aaron, and said to them, ‘You take too much upon yourselves, <strong>for all the congregation is holy, every one of them, and the LORD is among them</strong>. Why then do you exalt yourselves above the assembly of the LORD?’” (<a href="https://bibleox.com/en/eng-nkjv/chis/16/#L3">Num. 16:3</a>)</p></blockquote><blockquote><p>“and that He has brought you near to Himself, you and all your brethren, the sons of Levi, with you? <strong>And are you seeking the priesthood also?</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/16/#L10">Num. 16:10</a>)</p></blockquote><p>Later the glory of God appeared, and the earth swallowed the rebels:</p><blockquote><p>“And Korah gathered all the congregation against them at the door of the tabernacle of meeting. Then the glory of the LORD appeared to all the congregation. And the LORD spoke to Moses and Aaron, saying, ‘Separate yourselves from among this congregation, that <strong>I may consume them in a moment</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/chis/16/#L19-21">Num. 16:19-21</a>)</p></blockquote><p>God said that the offerings of the rebels should be thrown out of the censers, and that from the censers themselves a covering for the altar should be made as a reminder to future generations:</p><blockquote><p>“Tell Eleazar, the son of Aaron the priest, to pick up the censers out of the blaze, for they are holy, and <strong>scatter the fire some distance away</strong>. The censers of these men who sinned against their own souls, let them be made into hammered plates as a covering for the altar. Because they presented them before the LORD, therefore they are holy; and <strong>they shall be a sign to the children of Israel</strong>” (<a href="https://bibleox.com/en/eng-nkjv/chis/16/#L37-38">Num. 16:37-38</a>)</p></blockquote><blockquote><p>“<strong>Now all these things happened to them as examples, and they were written for our admonition</strong>, upon whom the ends of the ages have come” (<a href="https://bibleox.com/en/eng-nkjv/1kor/10/#L11">1 Cor. 10:11</a>)</p></blockquote><p>The Apostle Jude also recalls the ruinous stubbornness of Korah:</p><blockquote><p>“Woe to them! For they have gone in the way of Cain, have run greedily in the error of Balaam for profit, and <strong>perished in the rebellion of Korah</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L11">Jude. 1:11</a>)</p></blockquote><p>A prophecy is also given that in the last times such people will rise up:</p><blockquote><p>“For the time will come when they will not endure sound doctrine, but <strong>according to their own desires</strong>, because they have itching ears, <strong>they will heap up for themselves teachers</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L3">2 Tim. 4:3</a>)</p></blockquote><h3>The Prophecy of the Appointment of Priests in the New Testament</h3><p>Already in the Old Testament there was a prophecy that in the New Testament priests and ministers would still be appointed, but from all nations, and not only from the family of Aaron:</p><blockquote><p>“<strong>I will gather all nations and tongues &lt;...&gt; And I will also take some of them for priests and Levites,’ says the LORD</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/66/#L18-21">Isa. 66:18-21</a>)</p></blockquote><p>The New Testament indicates that no one can take the priesthood to himself:</p><blockquote><p>“For every high priest taken from among men <strong>is appointed for men in things pertaining to God</strong>, that he may offer both gifts and sacrifices for sins. He can have compassion on those who are ignorant and going astray, since he himself is also subject to weakness. Because of this he is required as for the people, so also for himself, to offer sacrifices for sins. And <strong>no man takes this honor to himself</strong>, but he who is called by God, <strong>just as Aaron was</strong>. So also <strong>Christ did not glorify Himself to become High Priest</strong>, but it was He who said to Him: ‘You are My Son, today I have begotten You’” (<a href="https://bibleox.com/en/eng-nkjv/evr/5/#L1-5">Heb. 5:1-5</a>)</p></blockquote><h3>Simon the Sorcerer, Who Believed and Was Baptized, Does Not Have the Gift of Imparting the Gifts of the Holy Spirit</h3><p>Simon the sorcerer, as it is written, believed and was baptized:</p><blockquote><p>“<strong>Then Simon himself also believed; and when he was baptized</strong> he continued with Philip, and was amazed, seeing the miracles and signs which were done” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L13">Act. 8:13</a>)</p></blockquote><p>But when he understood that not all Christians can impart the gifts of the Holy Spirit, he tried to buy this gift from the apostles. The apostles cursed him for this:</p><blockquote><p>“And when <strong><mark>Simon</mark> saw that through the laying on of the apostles’ hands the Holy Spirit was given, he offered them money</strong>, saying, <strong><mark>‘Give me this power also, that anyone on whom I lay hands may receive the Holy Spirit.’</mark></strong> <strong><mark>But Peter said</mark> to him, ‘Your money perish with you, because <mark>you thought that the gift of God could be purchased with money</mark>!</strong> You have neither part nor portion in this matter, for your heart is not right in the sight of God. Repent therefore of this your wickedness, and pray God if perhaps the thought of your heart may be forgiven you. For I see that you are poisoned by bitterness and bound by iniquity’” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L18-23">Act. 8:18-23</a>)</p></blockquote><p>From this it is clear that not all Christians were priests possessing the authority and the gift of God to impart the Holy Spirit. Even the deacon Philip, who baptized the Samaritans, did not possess such a gift (<a href="https://bibleox.com/en/eng-nkjv/act/21/#L8">Act. 21:8</a>). And those who possess this gift received it through the laying on of the hands of the apostles (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6">2 Tim. 1:6</a>) and of the priesthood (<a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L14">1 Tim. 4:14</a>).</p><p>So:</p><ul><li><p>Not all received the commission to teach and baptize: “<strong>Go</strong> therefore and <strong>make disciples</strong> of all the nations, <strong>baptizing</strong> them in the name of the Father and of the Son and of the Holy Spirit” (<a href="https://bibleox.com/en/eng-nkjv/mf/28/#L19">Matt. 28:19</a>)</p></li><li><p>Not all received the command: “<strong>do this</strong> in remembrance of Me” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L19">Luke. 22:19</a>; <a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L24">1 Cor. 11:24</a>)</p></li><li><p>Not all were given the authority to bind and loose: “whatever you <strong>bind</strong> on earth will be bound in heaven, and whatever you <strong>loose</strong> on earth will be loosed in heaven” (<a href="https://bibleox.com/en/eng-nkjv/mf/18/#L18">Matt. 18:18</a>)</p></li><li><p>Not all were given the authority to forgive and retain sins: “If you <strong>forgive the sins</strong> of any, they are forgiven them; if you <strong>retain</strong> the sins of any, they are retained” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L23">John. 20:23</a>)</p></li><li><p>Not all were given the authority to lay on hands to grant the Holy Spirit: “<strong>through the laying on of the apostles’ hands the Holy Spirit was given</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L18">Act. 8:18</a>)</p></li><li><p>It is precisely the presbyters whom the apostle commands to be called, through whose prayer and sacred action (they anointed with oil) the sins of the sick person may be forgiven: “<strong>Is anyone among you sick? Let him call for the elders of the church</strong>, and let them <strong>pray over him, anointing him with oil</strong> in the name of the Lord. And the prayer of faith will save the sick, and the Lord will raise him up. And <strong>if he has committed sins, he will be forgiven</strong>” (<a href="https://bibleox.com/en/eng-nkjv/iak/5/#L14-15">James. 5:14-15</a>)</p></li></ul><h2>The Royal Priesthood — How Should It Be Understood?</h2><p>Both in the Old Testament and in the New, every believer is called to be a priest in his own temple — in his body. <a href="https://bibleox.com/ru/q/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">Man is the temple of God</a>, and a priest is the one who offers sacrifice to God in this temple. It is precisely with this thought that the Apostle Peter begins before speaking of the royal priesthood:</p><blockquote><p>“you also, <strong>as living stones, are being built up <mark>a spiritual house</mark>, a holy priesthood</strong>, <strong>to offer up spiritual sacrifices</strong> acceptable to God through Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/1pet/2/#L5">1 Pet. 2:5</a>)</p></blockquote><p>Speaking of the royal priesthood, the Apostle Peter in the same epistle speaks of the shepherds and the need to obey them:</p><blockquote><p>“Likewise you younger people, <strong>submit yourselves to your elders</strong> <em>(Greek: πρεσβυτέροις — “to the presbyters”)</em>. Yes, all of you be submissive to one another, and be clothed with humility, for <strong>‘God resists the proud, but gives grace to the humble’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L5">1 Pet. 5:5</a>)</p></blockquote><p>There is one more statement about Christians as priests:</p><blockquote><p>“and from Jesus Christ, the faithful witness, the firstborn from the dead, and the ruler over the kings of the earth. To Him who loved us and washed us from our sins in His own blood, and <strong>has made us kings and priests to His God</strong> and Father, to Him be glory and dominion forever and ever. Amen” (<a href="https://bibleox.com/en/eng-nkjv/otkr/1/#L5-6">Rev. 1:5-6</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/5/#L9-10">Rev. 5:9-10</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L6">Rev. 20:6</a>)</p></blockquote><p>In whatever sense a Christian is a king, in the same sense he is also a priest. If he does not now rule over outside people, then neither is he a priest for outside people. Such an explanation is honest toward the context and agrees with common sense.</p><p>A Christian is called to reign in his own body, enthroning his mind over the desires of his body, and having cleansed this temple of God (his body and heart), he must offer there sacrifices pleasing to God: pure thoughts, words, deeds, prayers and praises.</p><h2>Respect for Priests</h2><blockquote><p>“Let the elders who rule well <strong>be counted worthy of double honor</strong>, especially those who labor in the word and doctrine” (<a href="https://bibleox.com/en/eng-nkjv/1tim/5/#L17">1 Tim. 5:17</a>)</p></blockquote><blockquote><p>“With all your soul fear the Lord, and <strong>revere his priests</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/7/#L29">Sir. 7:29</a>)</p></blockquote><blockquote><p>“Fear the Lord and <strong>honor the priest</strong>, and give him his portion, as you have been commanded” (<a href="https://bibleox.com/en/en-nrsv/prsir/7/#L31">Sir. 7:31</a>)</p></blockquote><h2>The Need to Obey the Priesthood</h2><blockquote><p>“<strong><mark>Obey those who rule over you</mark>, and be submissive, for they watch out for your souls</strong>, as those who must give account. Let them do so with joy and not with grief, for that would be unprofitable for you” (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L17">Heb. 13:17</a>)</p></blockquote><blockquote><p>“Likewise you younger people, <strong><mark>submit yourselves</mark> to your <mark>elders</mark></strong>. Yes, all of you be submissive to one another, and be clothed with humility, for <strong>‘God resists the proud, but gives grace to the humble’</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L5">1 Pet. 5:5</a>)</p></blockquote><p>In the Old Testament, disobedience to the priest-judge is a mortal sin:</p><blockquote><p>“Now the man who acts presumptuously and <strong>will not heed the priest</strong> who stands to minister there before the LORD your God, or the judge, that man <strong>shall die</strong>. So you shall put away the evil from Israel” (<a href="https://bibleox.com/en/eng-nkjv/vtor/17/#L12">Deut. 17:12</a>)</p></blockquote><h2>Criticism</h2><h3>Is the Descent of the Holy Spirit Through the Laying On of Hands Only Simon’s Perception?</h3><p>The Orthodox show quotes in Scripture about the special gift of imparting the Holy Spirit through the laying on of hands. Among such quotes is the case of the sorcerer (magician) Simon.</p><p>Simon the sorcerer saw that not every Christian is able to lay on hands for the giving of the Holy Spirit. Literally: not everyone has such authority. He brought a bribe to the apostles so that they would give him such authority too (the apostles cursed him):</p><blockquote><p>“And when Simon saw that <strong>through the laying on of the apostles’ hands the Holy Spirit was given</strong>, he offered them money, saying, <strong>‘Give me this power also</strong>, that <strong><mark>anyone on whom I lay hands</mark> may receive the Holy Spirit.’</strong> But Peter said to him, ‘Your money perish with you, because you thought that <strong><mark>the gift of God</mark></strong> could be purchased with money!’” (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L18-20">Act. 8:18-20</a>)</p></blockquote><p>Critics say that this is only the mistaken perception of Simon the sorcerer. He was a magician, they say, so he misunderstood everything.</p><p>Was the Apostle Paul also a magician?</p><blockquote><p>“Therefore I remind you to stir up <strong><mark>the gift of God</mark> which is in you <mark>through the laying on of my hands</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6">2 Tim. 1:6</a>)</p></blockquote><blockquote><p>“Do not neglect <strong>the <mark>gift</mark> that is in you, which was given to you by prophecy <mark>with the laying on of the hands of the eldership</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L14">1 Tim. 4:14</a>)</p></blockquote><p>The apostle says directly that the gift of God is through his laying on of hands.</p><p>But let us return to the case of Simon. This account from the Acts of the Apostles is written by the Evangelist Luke (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L3">Luke. 1:3</a>; <a href="https://bibleox.com/en/eng-nkjv/act/1/#L1">Act. 1:1</a>). He writes not about some supposedly mistaken understanding of events by Simon the sorcerer, but that Simon only saw this. And what did he see? The Evangelist Luke writes what: “<em>that through the laying on of the apostles’ hands the Holy Spirit was given</em>” — this is what he saw. It is not Simon who says this, but the Evangelist Luke. Further, from the words of the Apostle Peter it becomes clear that this is really so: the apostle can impart this gift of God, but he accuses Simon precisely of having wished to obtain <strong>the gift of God</strong> <strong><u>for money</u>.</strong></p><h3>Was the Apostle Paul Ordained Not Through People?</h3><p>The Orthodox show that the Apostle Paul was ordained to his ministry by the Church:</p><blockquote><p>“As they ministered to the Lord and fasted, the Holy Spirit said, ‘Now separate to Me Barnabas and <strong><mark>Saul</mark></strong> for the work to which I have called them.’ Then, having fasted and prayed, and <strong><mark>laid hands on them</mark></strong>, they sent them away” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L2-3">Act. 13:2-3</a>)</p></blockquote><p>Critics object that the Apostle Paul was not ordained by people, citing the verse:</p><blockquote><p>“<strong>Paul, an apostle (<mark>not from men nor through man</mark></strong>, but through Jesus Christ and God the Father who raised Him from the dead)” (<a href="https://bibleox.com/en/eng-nkjv/gal/1/#L1">Gal. 1:1</a>)</p></blockquote><p>But this claim is groundless, for here only the manner of election is spoken of, and not the imparting of the gift of God.</p><p>Before the laying on of hands on Saul, it is indeed the Holy Spirit Himself who chooses him and commands the Church to separate Saul for the ministry to which, as it is written, the Holy Spirit had called him. Why the critics cite this verse is unclear, since there is no contradiction. Saul was chosen not by people and not through people, but the Holy Spirit Himself chooses him, commanding the Church to separate him for the ministry, after which the Church ordains Saul:</p><blockquote><p>“As they ministered to the Lord and fasted, <strong><mark>the Holy Spirit said</mark>, ‘Now <mark>separate</mark> to Me</strong> Barnabas and <strong><mark>Saul</mark></strong> for the work <strong>to which <mark>I have called</mark> them.’ <mark>Then</mark></strong>, having fasted and prayed, <strong>and <mark>laid hands on them</mark></strong>, they sent them away” (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L2-3">Act. 13:2-3</a>)</p></blockquote><p>Thus the election is made by the Holy Spirit, and grace is sent not without the Church, but through her — through the laying on of the hands of her ministers.</p><p>The critics try to justify the absence in the communities they created of any direct connection with the first Christians, and the independent election of pastors and teachers among themselves. Obviously, people who themselves did not have authority from God to lead and teach the Church could give no one such authority. But it is important for them to show the probability that the Holy Spirit could have done so — could have appointed their pastors to the ministry without any connection with the Church that already existed before them.</p><p>However, although the Holy Spirit is free to do whatever He wishes, we do not see in Scripture a single case of God appointing people to ministry and saving them separately from the one and visible Church created by Christ.</p><p>God chose Saul, and although He undoubtedly could have appointed him to the ministry Himself, He did not do so without His Church. We see the same with the baptism of the first Gentiles — the Ethiopian eunuch (<a href="https://bibleox.com/en/eng-nkjv/act/8/#L27">Act. 8:27</a>) and the centurion Cornelius (<a href="https://bibleox.com/en/eng-nkjv/act/10/#L1">Act. 10:1</a>).</p><ol><li><p>The Ethiopian eunuch read Scripture but did not understand it. <strong>God could Himself</strong> have instructed the eunuch and imparted to him the saving grace of Baptism, <strong>but He does not do this separately from the Church</strong>. God sends the Church to the eunuch, which teaches him to understand Scripture and imparts grace in Baptism.</p></li><li><p>The centurion Cornelius prayed to God and did good works. <strong>God could Himself</strong> have imparted saving grace to Cornelius, <strong>but He does not do this separately from the Church</strong>. Instead, He sends an angel to him and commands him to find the Church (in the person of the Apostle Peter). Only when the apostle comes does the Holy Spirit come upon Cornelius, although He could just as well have come earlier without the apostle, but He did not do so.</p></li><li><p>Saul (the future Apostle Paul), a persecutor of Christians, goes to Damascus to persecute Christians. Christ appears to him as a blinding light, and Saul asks Him what he should do. Christ <strong>God could Himself</strong> have given grace to Saul, <strong>but He does not do this separately from the Church</strong>, but commands him to find the Church in Damascus (in the person of the apostle Ananias), and only there, through the Church, does the apostle receive healing (<a href="https://bibleox.com/en/eng-nkjv/act/9/#L17">Act. 9:17</a>), the grace of the Holy Spirit (<a href="https://bibleox.com/en/eng-nkjv/act/9/#L17">Act. 9:17</a>) and the saving grace of Baptism, which washed away his sins (<a href="https://bibleox.com/en/eng-nkjv/act/22/#L16">Act. 22:16</a>).</p></li></ol><p>It is the same in all cases, as also with the ordination of Saul to the special apostolic ministry: God Himself chooses Saul, and God could Himself have imparted His gift to him, but He does not do this separately from His Church. The Holy Spirit addresses the Church, and the Church ordains Saul (<a href="https://bibleox.com/en/eng-nkjv/act/13/#L2-3">Act. 13:2-3</a>).</p><p>So all the claims of societies separate from the Church to a special calling of their pastors separate from the Church have no basis in Scripture. There are simply no such cases in Scripture.</p><h3>The Laying On of Hands Was Borrowed from Paganism</h3><p>Those who created a church on their own must first of all prove the fall of the Church once created by Christ. For if the Church has not fallen, then their new community is not needed, and one should simply enter the Church of Christ. To prove the fall of the Church, the technique of “labeling”, with labels as frightening as possible, is often used. Thus the Church is often accused of falling away from God into paganism through borrowing pagan practices, among which are named:</p><ul><li><p>the existence of holy temples,</p></li><li><p>holy places,</p></li><li><p>holy objects,</p></li><li><p>holy images,</p></li><li><p>special sacred people (priests),</p></li><li><p>holy rites and sacraments (supposedly recipes for influencing God), among which is the laying on of hands.</p></li></ul><p>This is an extremely absurd accusation, for all this was established by God Himself, and all this is spoken of in Scripture in plain text. The pagans are dragged in here only in order to hang a label on the Church. All these sacred buildings, places, objects, actions and people are present in the Scripture of the Old and New Testaments, which one can learn about from a separate article:</p><ul><li><p><a href="https://bibleox.com/en/en/w/Sh2r_Sacred_Things/">Sacred Things</a></p></li></ul><h4>The Laying On of Hands in the Old Testament</h4><p>Jacob blessed his grandsons, laying his hands on them with prayer:</p><blockquote><p><em>“Then Israel </em><strong><em>stretched out his right <mark>hand</mark> and <mark>laid it on</mark></em></strong><em> </em><strong><em>Ephraim’s <mark>head</mark></em></strong><em>, who was the younger, </em><strong><em>and his left hand <mark>on</mark> Manasseh’s <mark>head</mark></em></strong><em>. &lt;…&gt; And he </em><strong><em><mark>blessed</mark></em></strong><em> Joseph, and said: ‘God, before whom my fathers Abraham and Isaac walked, the God who has fed me all my life long to this day, </em><strong><em><mark>the Angel</mark></em></strong><em> who has redeemed me from all evil, </em><strong><em><mark>bless the lads</mark></em></strong><em>; let my name be named upon them, and the name of my fathers Abraham and Isaac; and let them grow into a multitude in the midst of the earth’” (</em><a href="https://bibleox.com/en/eng-nkjv/gen/48/#L14-16"><em>Gen. 48:14-16</em></a><em>)</em></p></blockquote><p>God commanded the prophet Moses to appoint Joshua the son of Nun to service through the laying on of hands:</p><blockquote><p><em>“And </em><strong><em><mark>the LORD said</mark></em></strong><em> to Moses: ‘</em><strong><em><mark>Take Joshua the son of Nun</mark></em></strong><em> with you, a man in whom is the Spirit, and </em><strong><em><mark>lay your hand on him</mark></em></strong><em>’ &lt;...&gt; So Moses did as the LORD commanded him. He took Joshua and set him before Eleazar the priest and before all the congregation. </em><strong><em><mark>And he laid his hands on him</mark></em></strong><em> and inaugurated him, just as the LORD commanded by the hand of Moses” (</em><a href="https://bibleox.com/en/eng-nkjv/chis/27/#L18,22-23"><em>Num. 27:18,22-23</em></a><em>)</em></p></blockquote><blockquote><p>“Now <strong>Joshua the son of Nun <mark>was full of the spirit of wisdom, for Moses had laid his hands on him</mark></strong>; so the children of Israel heeded him, and did as the LORD had commanded Moses” (<a href="https://bibleox.com/en/eng-nkjv/vtor/34/#L9">Deut. 34:9</a>)</p></blockquote><p>God commanded that the Levites be appointed to service at the temple through the laying on of hands:</p><blockquote><p><em>“So you shall bring the Levites before the LORD, and the children of Israel </em><strong><em><mark>shall lay their hands on the Levites</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/chis/8/#L10"><em>Num. 8:10</em></a><em>)</em></p></blockquote><h4>The Laying On of Hands in the New Testament</h4><blockquote><p><em>“Therefore I remind you to stir up </em><strong><em><mark>the gift of God</mark> which is in you <u><mark>through</mark></u><mark> the laying on of my hands</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/1/#L6"><em>2 Tim. 1:6</em></a><em>)</em></p></blockquote><blockquote><p><em>“Do not neglect </em><strong><em>the <mark>gift</mark> that is in you, which was given to you by prophecy <mark>with the laying on of the hands of the eldership</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L14"><em>1 Tim. 4:14</em></a><em>)</em></p></blockquote><blockquote><p><em>“of the </em><strong><em><mark>doctrine</mark></em></strong><em> of baptisms, </em><strong><em><mark>of laying on of hands</mark></em></strong><em>, of resurrection of the dead, and of eternal judgment” (</em><a href="https://bibleox.com/en/eng-nkjv/evr/6/#L2"><em>Heb. 6:2</em></a><em>)</em></p></blockquote><p>After studying Scripture, the accusations against the Church are surprising, that she supposedly after the apostles took these practices and the attitude to them from the pagans, when the apostles themselves write about the gift of God given by them <u>through</u> the laying on of their hands, speaking of it as part of the teaching. All this is not an innovation (the manner itself), but something that had already existed for centuries in this same milieu before the apostles, having been established not by pagans, but by God Himself.</p><h3>Were They Not Called Priests in the New Testament?</h3><p>The word “priesthood” occurs in a New Testament context. Christ brought about a change of the priesthood, and not its abolition:</p><blockquote><p>“For <strong>the <mark>priesthood (ἱερωσύνης)</mark> being changed</strong>, of necessity there is also a change of the law” (<a href="https://bibleox.com/en/eng-nkjv/evr/7/#L12">Heb. 7:12</a>)</p></blockquote><p>Christ became the eternal High Priest, but priests were not abolished. Their choosing and appointment is spoken of in the prophecy:</p><blockquote><p>“<strong>I will gather <mark>all nations</mark> and tongues</strong> &lt;…&gt; <strong><mark>And I will also take some of them for priests</mark> (ἱερεῖς, כֹּהֲנִ֥ים) and Levites,’ says the LORD</strong>” (<a href="https://bibleox.com/en/eng-nkjv/is/66/#L18-21">Isa. 66:18-21</a>)</p></blockquote><p>Moreover, not just anyone, but precisely the apostles were in fact priests. In the Old Testament the duty of cleansing a person from sin lay upon the priest (<a href="https://bibleox.com/en/eng-nkjv/lev/5/#L5-6">Lev. 5:5-6</a>), and so in the New Testament, at the formation of the new church hierarchy, this authority is given to it — to forgive or retain sins:</p><blockquote><p>“So Jesus said to them again, ‘Peace to you! As the Father has sent Me, I also send you.’ And when He had said this, <strong>He breathed</strong> on them, and said to them, ‘<strong>Receive the Holy Spirit.</strong> <strong>If you forgive the sins of any, they are forgiven them; if you retain the sins of any, they are retained</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/20/#L21-23">John. 20:21-23</a>)</p></blockquote><p>The most ancient Christians confirm that presbyters were also priests: <a href="https://bibleox.com/ru/ru/w/gq8M_%D0%9D%D0%BE%D0%B2%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B5%D1%81%D0%B2%D0%B8%D1%82%D0%B5%D1%80%D1%8B__%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D0%BD%D0%B8%D0%BA%D0%B8">quotes</a>.</p>
