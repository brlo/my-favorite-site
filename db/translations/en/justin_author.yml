      <p>The quotations from the Apologies and from the Dialogue with Trypho are given from the English translations already published on this site (Ante-Nicene Fathers, ed. A. Roberts and J. Donaldson), verbatim save for the evident misprints of the electronic text, which are corrected here (for example “suflcr” for “suffer”, “by tire” for “by fire”, “hear yon” for “hear you”); the text of the works themselves is left unchanged. The testimonies of Tertullian, Methodius and Jerome are likewise quoted from their pages on this site; those of Epiphanius of Cyprus and Theodoret of Cyrus, whose English editions are not available on the site, are translated from the Russian. The 19th-century translations are sometimes less precise than the Greek: in Apology 2, 10, for example, ὁ λόγος is rendered “the whole rational being”, whereas the Russian page keeps “the Word”. The emphases of the Russian page are reproduced on the corresponding English words. The translator’s notes of the Russian page — for instance ἀπομνημονεύματα τῶν ἀποστόλων, “memoirs of the apostles”, the name Justin gives to the Gospels, or the Greek phrase πρὸς τὸν πατέρα καὶ βασιλέα τῶν οὐρανῶν in Apology 2, 2 — are omitted from the quotations; the explanations are given here.</p><p>Two divergences between the Russian page and the Greek should be noted. In the Acts of Justin (quoted in the biography) the 19th-century translation has “teacher of good disciples”, where the Greek reads διδάσκαλος καλῶν δογμάτων, “teacher of good doctrines”; the quotation follows the Greek. In Dialogue 67 the Russian page reads that Christ fulfilled the ordinances “in order to be justified by them”, while the Greek — and the 19th-century translation — has “not as if He were justified by them”; the quotation follows the Greek.</p><p>Translation: Rodion Vlasov, with the use of AI, from the <a href="https://bibleox.com/en/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA">Russian reference page</a>.</p>
