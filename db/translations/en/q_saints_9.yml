  body: '<h2>Epigraph</h2><blockquote><p>“<strong>One thing I have desired of the
    LORD</strong>, That will I seek: <strong>That I may dwell in the house of the
    LORD All the days of my life</strong>, To behold the beauty of the LORD, And <strong>to
    inquire in His temple</strong>.” (<a href="https://bibleox.com/en/eng-nkjv/ps/27/#L4">Ps
    27:4</a>)</p></blockquote><blockquote><p>“You shall keep My Sabbaths and <strong>reverence
    My sanctuary</strong>: I am the LORD.” (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L30">Lev
    19:30</a>; <a href="https://bibleox.com/en/eng-nkjv/lev/26/#L2">Lev 26:2</a>)</p></blockquote><h2>Definitions</h2><p><strong>Temple</strong>
    — a place specially arranged and dedicated to God for the celebration of divine
    services, the offering of sacrifice and the lifting up of prayers. The distinguishing
    features of a temple are the altar and various liturgical attributes, and an arrangement
    of space that disposes and helps one to pray rightly. From the beginning, by God’s
    command, the temple was an image (icon) of heavenly reality (<a href="https://bibleox.com/en/eng-nkjv/ish/25/#L8-9,40">Ex
    25:8-9,40</a>; <a href="https://bibleox.com/en/eng-nkjv/evr/9/#L24">Heb 9:24</a>;
    <a href="https://bibleox.com/en/eng-nkjv/act/7/#L44">Act 7:44</a>), and therefore
    its arrangement and its worship relate to the actual heavenly reality (<a href="https://bibleox.com/en/en/w/Th4h_The_Temple_an_Image_of_the_Heavenly_Reality">more</a>).</p><p><strong>Altar</strong>
    — an elevation intended for the offering of sacrifice. As a rule, an object of
    stone or wood, resembling a table.</p><p><strong>Sacrifice</strong> — an object
    brought as a gift to God on the altar. In Christian temples a bloodless sacrifice
    is performed: bread and wine in the <strong>Eucharist</strong> (<a href="https://bibleox.com/ru/ru/w/caEeLGWP_%D0%96%D0%B5%D1%80%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D0%BE%D0%B5_%D0%B7%D0%BD%D0%B0%D1%87%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B5%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B8"
    lang="ru">more</a>).</p><p>Monuments of history: <a href="https://bibleox.com/en/en/w/Ch2c_Ancient_Christian_Churches">the
    most ancient Christian churches</a>.</p><h2>1st century</h2><h3><a href="https://bibleox.com/en/en/w/Clement_of_Rome">St
    Clement of Rome, hieromartyr († c. 101)</a></h3><p>St Clement points to the fact
    that bishops offer <strong>sacrifice</strong>. This is indirect evidence of altars,
    because the sacrifice is offered on the altar. All bring prayers, but it is the
    priest who brings bread and wine to God in the Eucharist (<a href="https://bibleox.com/ru/ru/w/%D0%90%D0%9F%D0%9E%D0%9B%D0%9E%D0%93%D0%98%D0%AF%E2%80%94%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2-%D0%BF%D1%80%D0%BE%D1%82%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%B7%D0%BC%D0%B0-%D1%874#HH-%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%8F-%D0%BA%D0%B0%D0%BA-%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D0%B0"
    lang="ru">more</a>), that is, it is he who offers the gifts, the sacrifice, on
    behalf of those assembled:</p><blockquote><p><em>Our apostles also knew through
    our Lord Jesus Christ that there would be strife over the episcopal office. For
    this very reason, having obtained perfect foreknowledge, they appointed the ministers
    mentioned above, and afterwards added a rule, that when these should fall asleep,
    other tested men should take upon themselves their ministry. Therefore we consider
    it unjust to deprive of the ministry those who were appointed by the apostles
    themselves, or after them by other highly esteemed men, with the consent of the
    whole Church, and who served the flock of Christ blamelessly, with humility, meekly
    and spotlessly, and who moreover for a long time were approved by all. And it
    will not be a small sin for us if we </em><strong><em>shall deprive of <mark>the
    episcopate</mark></em></strong> <strong><em>those who blamelessly and holily <u><mark>offer</mark></u><mark>
    the gifts</mark></em></strong> (τοὺς ἀμέμπτως καὶ ὁσίως προσενεγκόντας τὰ δῶρα
    τῆς ἐπισκοπῆς — it is no small sin if we reject those who have blamelessly and
    holily offered the gifts of the episcopate).</p></blockquote><p>(The First Epistle
    of Clement to the Corinthians, ch. 44)</p><h3><a href="https://bibleox.com/en/en/w/Ignatius_of_Antioch_Theophorus">St
    Ignatius of Antioch, hieromartyr (c. 35–107)</a></h3><p>St Ignatius, a disciple
    of John the Theologian, mentions the Eucharist and the <strong>altar</strong>:</p><blockquote><p><em>Take
    ye heed, then, to have but </em><strong><em>one Eucharist</em></strong><em>. For
    there is one flesh of our Lord Jesus Christ, and one cup to [show forth] the unity
    of His blood; </em><strong><em><mark>one altar</mark>; as there is one bishop,
    along with the presbytery and deacons</em></strong><em>, my fellow-servants: that
    so, whatsoever ye do, ye may do it according to [the will of] God.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Ph#HH-4">To the Philadelphians, 4</a>)
    ; cf. To the Ephesians, 5)</p><h2>2nd century</h2><h3><a href="https://bibleox.com/en/en/w/Irenaeus_of_Lyon">St
    Irenaeus of Lyons, hieromartyr (c. 130–202)</a></h3><p>The arrangement of a Christian
    temple is like the arrangement of the heavenly temple (Rev. 11:1, 19):</p><ul><li><p>the
    throne <a href="https://bibleox.com/en/eng-nkjv/otkr/4/#L10">Rev 4:10</a></p></li><li><p>the
    altar <a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3">Rev 8:3-5</a></p></li><li><p>the
    seven-branched lampstand <a href="https://bibleox.com/en/eng-nkjv/otkr/4/#L5">Rev
    4:5</a></p></li><li><p>the incense <a href="https://bibleox.com/en/eng-nkjv/otkr/8/#L3,5">Rev
    8:3,5</a></p></li><li><p>the holy angels <a href="https://bibleox.com/en/eng-nkjv/otkr/8#L3">Rev
    8:3</a>; <a href="https://bibleox.com/en/eng-nkjv/otkr/15#L6">Rev 15:6</a></p></li><li><p>the
    holy people <a href="https://bibleox.com/en/eng-nkjv/otkr/6/#L9-11">Rev 6:9-11</a>;
    <a href="https://bibleox.com/en/eng-nkjv/otkr/14/#L4-5">Rev 14:4-5</a></p></li></ul><p>Irenaeus
    refers to the Revelation of John the Theologian, saying that earthly things are
    fittingly images of heavenly things created by God, that is, he speaks of the
    earthly temple as an icon of heavenly reality:</p><blockquote><p><em>As, therefore,
    He does not stand in need of these [services], yet does desire that we should
    render them for our own benefit, lest we be unfruitful; so did the Word give to
    the people that very precept as to the making of oblations, although He stood
    in no need of them, that they might learn to serve God: thus is it, therefore,
    also His will that </em><strong><em>we, too,</em></strong><em> </em><strong><em>should
    offer a gift <mark>at the altar</mark></em></strong><em>, frequently and without
    intermission.</em></p><p><em>The </em><strong><em><mark>altar, then, is in heaven</mark></em></strong><em>
    (for towards that place are our prayers and oblations directed); </em><strong><em><mark>the
    temple likewise</mark></em></strong><em> [is there], as John says in the Apocalypse,
    “And the temple of God was opened:” the tabernacle also: “For, behold,” He says,
    “the tabernacle of God, in which He will dwell with men.” Now the gifts, oblations,
    and all the sacrifices, did the people receive in a figure, as was shown to Moses
    in the mount, from one and the same God, whose name is now glorified in the Church
    among all nations. But it is congruous that </em><strong><em><mark>those earthly
    things, indeed, which are spread all around us, should be types of the celestial</mark></em></strong><em>,
    being [both], however, created by the same God. </em><strong><em>For in no other
    way could He assimilate an image of spiritual things [to suit our comprehension]</em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4#HH-18"><u>Against
    Heresies, Book IV, ch. 18–19</u></a>)</p><h3><a href="https://bibleox.com/en/en/w/6Frm_Tertullian_II_c">Tertullian
    (c. 155–220)</a></h3><p>Temple:</p><blockquote><p><em>A whole day the zeal of
    faith will direct its pleadings to this quarter: bewailing that a Christian should
    come from idols into the </em><strong><em><mark>Church</mark></em></strong><em>;
    should come from an adversary workshop into the </em><strong><em><mark>house of
    God</mark></em></strong><em>; should raise to God the Father hands which are the
    mothers of idols; should pray to God with the hands which, out of doors, are prayed
    to in opposition to God; should apply to the Lord’s body those hands which confer
    bodies on demons. Nor is this sufficient. Grant that it be a small matter, if
    from other hands they receive what they contaminate; but even those very hands
    deliver to others what they have contaminated. Idol-artificers are chosen even
    into the ecclesiastical order. Oh wickedness! Once did the Jews lay brands on
    Christ; these mangle His body daily.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-on-idolatry#HH-Grief-of-the-Faithful-at-the-Admission-of-Idol-Makers-into-the-Church-Nay-Even-into-the-Ministry"><u>On
    Idolatry, ch. 7</u></a>)</p><p>Altar, sacrifice:</p><blockquote><p><em>Similarly,
    too, touching the days of Stations, most think that they must not be present at
    the </em><strong><em>sacrificial prayers</em></strong><em>, on the ground that
    the Station (a fast day — translator’s note) must be dissolved by reception of
    the Lord’s Body. Does, then, </em><strong><em>the Eucharist</em></strong><em>
    cancel a service devoted to God, or bind it more to God? Will not your Station
    be more solemn if </em><strong><em>you <mark>have withal stood at God’s altar</mark></em></strong><em>?
    </em><strong><em>When the Lord’s Body has been received</em></strong><em> and
    reserved each point is secured, both the </em><strong><em>participation of the
    <mark>sacrifice</mark></em></strong><em> and the discharge of duty.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-on-prayer#HH-Of-Stations"><u>On Prayer,
    ch. 19. Of Stations</u></a>)</p><h2>3rd century</h2><h3><a href="https://bibleox.com/en/en/w/Cyprian_of_Carthage">St
    Cyprian of Carthage, hieromartyr (c. 200–258)</a></h3><p>In the 3rd century the
    priest, bishop of the Church of Carthage, the holy martyr Cyprian (c. 200–258)
    speaks of <strong>priests</strong>, <strong>churches</strong>, <strong>altars</strong>,
    saying that just as in the Old Testament no one was to distract the priests from
    serving at the temple and the altar, so now priests must not be distracted from
    the altars in God’s churches by worldly affairs:</p><blockquote><p><em>Which plan
    and rule is now maintained in respect of the clergy, that they who are promoted
    by clerical ordination in the </em><strong><em><mark>Church of the Lord</mark></em></strong><em>
    may be called off in no respect from the divine administration, nor be tied down
    by worldly anxieties and matters; but in the honour of the brethren who contribute,
    receiving as it were tenths of the fruits, </em><strong><em>they may not withdraw
    <mark>from the altars</mark> and sacrifices</em></strong><em>, but may serve day
    and night in heavenly and spiritual things.</em></p></blockquote><p>Cyprian of
    Carthage says that this order was established by the bishops who came before him
    (that is, it was so earlier as well, and he only accepted it). And whoever obliges
    priests with extraneous matters, for that man let no offering be made and no commemoration
    be made at God’s altar:</p><blockquote><p><em>The bishops our predecessors religiously
    considering this, and wholesomely providing for it, decided that no brother departing
    should name a cleric for executor or guardian; and if any one should do this,
    no offering should be made for him, nor any sacrifice be celebrated for his repose.
    For he does not deserve to be named at the </em><strong><em><mark>altar of God</mark></em></strong><em>
    in the prayer of the priests, who has wished to call away the priests and ministers
    from the </em><strong><em><mark>altar</mark></em></strong><em>. &lt;…&gt; and,
    at the same time, an example be given to the rest of the brethren, </em><strong><em>that
    no one should call away to secular anxieties the priests and ministers of God
    who are occupied with the service of His <mark>altar</mark> and Church.</em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2#HH-To-the-Clergy-and-People-Abiding-at-Furni-About-Victor-Who-Had-Made-the-Presbyter-Faustinus-a-Guardian"><u>To
    the Clergy and People Abiding at Furni, about Victor, who had made the Presbyter
    Faustinus a Guardian</u></a>)</p><p>He also writes that the oil for the sacrament
    must be consecrated on the altar where the Eucharist is celebrated:</p><blockquote><p><em>It
    is also necessary that he should be anointed who is baptized; so that, having
    received the chrism, that is, the anointing, he may be anointed of God, and have
    in him the grace of Christ. </em><strong><em>Further, it is <mark>the Eucharist
    whence the baptized are anointed with the oil sanctified on the altar</mark>.
    But <mark>he cannot sanctify the creature of oil, who has neither an altar nor
    a church</mark></em></strong><em>; whence also there can be no spiritual anointing
    among heretics, since it is manifest that the oil cannot be sanctified nor the
    Eucharist celebrated at all among them. But we ought to know and remember that
    it is written, “Let not the oil of a sinner anoint my head,” (</em><em>Ps. 141:5,
    LXX</em><em>).</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-3#HH-To-Januarius-and-Other-Numidian-Bishops-on-Baptizing-Heretics">To
    Januarius and Other Numidian Bishops, on Baptizing Heretics</a>)</p><p>At the
    same time the martyr Cyprian repeatedly mentions that it is we Christians who
    are to become the temple of God, adorned with virtues. That is, along with the
    highest meaning of the words “temple” and “altar”, there also exists the ordinary
    stone temple with an altar.</p><h3><a href="https://bibleox.com/en/en/w/Eusebius_of_Caesarea">St
    Eusebius of Caesarea (Pamphilus), bishop, church historian (c. 258–339)</a></h3><p>He
    writes about the construction of Christian churches in all cities in the times
    preceding the reign of the Roman emperor Diocletian (reigned 284–305). In 296
    Diocletian issued an edict on the destruction of Christian churches. Eusebius
    was 38 years old at the time of this edict, that is, he must have been an eyewitness
    both of the creation of these churches and of their destruction:</p><blockquote><p>5.
    And one could see the rulers in every church accorded the greatest favor by all
    officers and governors. But how can any one describe those <strong>vast assemblies</strong>,
    and the multitude that crowded together in every city, and the famous gatherings
    in the <strong>houses of prayer; on whose account not being satisfied with the
    ancient buildings <mark>they erected from the foundation</mark> <u><mark>large
    churches</mark></u><u><mark> in all the cities</mark></u> (εὐρείας εἰς πλάτος
    ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>)</strong>?</p><p>&lt;…&gt;</p><p>4.
    It was in the nineteenth year of the reign of Diocletian, in the month Dystrus,
    called March by the Romans, when the feast of the Saviour’s passion was near at
    hand, that <strong><u><mark>royal edicts</mark></u><mark> were published </mark><u><mark>everywhere</mark></u><mark>,
    commanding that the </mark><u><mark>churches</mark></u><mark> be leveled to the
    ground</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>,
    and the Scriptures be destroyed by fire, and ordering that those who held places
    of honor be degraded.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-8">The
    Church History, Book VIII, 1.5 and 2.4</a>)</p><h2>4th century</h2><h3><a href="https://bibleox.com/en/en/w/Eusebius_of_Caesarea">St
    Eusebius of Caesarea (Pamphilus), bishop, church historian (c. 258–339)</a></h3><p>He
    now turns to events of his own time: the solemn oration delivered to Paulinus,
    bishop of Tyre, on the building of churches:</p><blockquote><p>Thus this one also
    bearing in his own soul the image of the whole Christ, the Word, the Wisdom, the
    Light, has formed this magnificent temple of the highest God, corresponding to
    the pattern of the greater as a visible to an invisible, it is impossible to say
    with what greatness of soul, with what wealth and liberality of mind, and with
    what emulation on the part of all of you, shown in the magnanimity of the contributors
    who have ambitiously striven in no way to be left behind by him in the execution
    of the same purpose. &lt;…&gt;</p><p>33. This desert, this dry land, this widowed
    and deserted one, now by the wonderful power of Christ, when he wills it, has
    become like a lily. &lt;…&gt;</p><p>44. Why need I now describe the skillful architectural
    arrangement and the surpassing beauty of each part, when the testimony of the
    eye renders instruction through the ear superfluous? For <strong>when he had thus
    completed the <mark>temple</mark>, he provided it with lofty <mark>thrones</mark>
    in honor of those who preside, and in addition with seats arranged in proper order
    throughout the whole building, and finally placed in the middle the <mark>holy
    of holies</mark>, the <mark>altar</mark></strong>, and, that it might be inaccessible
    to the multitude, enclosed it with wooden lattice-work, accurately wrought with
    artistic carving, presenting a wonderful sight to the beholders.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/eusebius-the-church-history-11#HH-Panegyric-on-the-Splendor-of-Affairs">Eusebius
    of Caesarea, Church History, 10.4.26, 33, 44</a>)</p><blockquote><p>After this
    was seen the sight which had been desired and prayed for by us all; feasts of
    dedication in the cities and <strong><mark>consecrations</mark> of the newly built
    <mark>houses of prayer</mark> took place, bishops assembled</strong>, foreigners
    came together from abroad, mutual love was exhibited between people and people,
    the members of Christ’s body were united in complete harmony.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/eusebius-the-church-history-11#HH-The-Dedications-in-Every-Place">Eusebius
    of Caesarea, Church History, 10.3.1</a>)</p><blockquote><p>14. But when malignant
    envy and the evil-loving demon well-nigh burst with anger at such grace and kindness,
    and turned against us all his death-dealing forces, and when, at first, like a
    dog gone mad which gnashes his teeth at the stones thrown at him, and pours out
    his rage against his assailants upon the inanimate missiles, <strong>he leveled
    his ferocious madness at the stones of the sanctuaries and at the lifeless material
    of the <mark>houses</mark>, and desolated the churches — at least as he supposed.</strong></p><p>&lt;…&gt;</p><p>20.
    What king prevails to such an extent, and even after death leads on his soldiers,
    and sets up trophies over his enemies, and fills every place, country and city,
    Greek and barbarian, <strong>with his royal <mark>dwellings, even divine temples</mark>
    with their consecrated oblations, like this very temple with its superb adornments
    and votive offerings</strong>?</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-11#HH-Panegyric-on-the-Splendor-of-Affairs">Eusebius
    of Caesarea, Church History, 10.4.14, 20</a>)</p><h3><a href="https://bibleox.com/ru/ru/w/%D0%9A%D0%BE%D0%BD%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%BD_%D0%92%D0%B5%D0%BB%D0%B8%D0%BA%D0%B8%D0%B9_IV_%D0%B2%D0%B5%D0%BA"
    lang="ru">St Constantine the Great, equal-to-the-apostles (272–337)</a></h3><p>An
    order to return to the Christians the places of assembly that had been taken from
    them:</p><blockquote><p><em>And we decree still further in regard to the Christians,
    that </em><strong><em><mark>their places, in which they were formerly accustomed
    to assemble</mark>, and concerning which in the former letter sent to thy devotedness
    a different command was given, if it appear that any have bought them either from
    our treasury or from any other person, <mark>shall be restored to the said Christians,
    without demanding money or any other equivalent</mark>, with no delay or hesitation</em></strong><em>.
    If any happen to have received the said places as a gift, they shall restore them
    as quickly as possible to these same Christians: with the understanding that if
    those who have bought these places, or those who have received them as a gift,
    demand anything from our bounty, they may go to the judge of the district, that
    provision may be made for them by our clemency. All these things are to be granted
    to the society of Christians by your care immediately and without any delay. And
    since </em><strong><em>the said Christians are known to have possessed not only
    <mark>those places in which they were accustomed to assemble</mark>, but also
    other places, belonging not to individuals among them, but to the society as a
    whole, that is, to the society of Christians, you will command that all these,
    in virtue of the law which we have above stated, be restored, without any hesitation,
    to these same Christians</em></strong><em>; that is, to their society and congregation:
    the above-mentioned provision being of course observed, that those who restore
    them without price, as we have before said, may expect indemnification from our
    bounty.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-11#HH-Copies-of-Imperial-Laws"><u>Edict
    of Milan, 313 — Eusebius of Caesarea, Church History, 10.5.9–11</u></a>)</p><h3>St
    John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p><em>In
    very truth, like some fire or lightning rushing down from on high, it has fallen
    upon the very roof of the Church, and yet no one is moved by it! When our father’s
    house is burning, we sleep a deep and unbroken sleep. Whom has that flame not
    touched? </em><strong><em>What images standing <mark>in the Church</mark></em></strong><em>
    has it [the fire] not touched? And truly, </em><strong><em>the <mark>Church</mark>
    is nothing other than a house built for our souls</em></strong><em>.</em></p></blockquote><p>(Homilies
    on Ephesians, Homily 10)</p><h3>St Gregory of Nyssa, bishop (c. 331–394)</h3><p>Bishop
    Gregory delivers a homily in a church that holds the relics of the great martyr
    Theodore the Recruit († 306). Above the relics there is an icon of Christ, and
    also one of Theodore the Recruit himself. The story of his martyrdom is depicted.
    The walls of the church are painted. He speaks of prayer to the saint and of his
    intercession for us.</p><blockquote><p><em>let us consider </em><strong><em>the
    present state of the saints</em></strong><em>, how beautiful and majestic it is.
    For </em><strong><em>their soul, having gone up on high, abides in the place that
    is proper to it, and, set free from the body, dwells together with those who are
    like it</em></strong><em>; and </em><strong><em>the body, that honourable and
    undefiled organ of hers, which by its passions did no injury to the incorruption
    of the soul that dwelt in it, is buried with great honour and reverence, and is
    honourably laid <mark>in a sacred place</mark>, as a precious treasure kept until
    the time of the regeneration</em></strong><em>, in many respects </em><strong><em>incomparable
    with any other bodies</em></strong><em>, which are dissolved by the death that
    is common to all and ordinary, though their substance is by nature the same. For
    most people turn with loathing from all other remains; no one passes a grave with
    pleasure, and if he chance upon an open tomb, seeing the ugliness of what lies
    there, filled with distaste and with a heavy sigh over the lot of mankind, he
    hastens away. But whoever enters any place like this, </em><strong><em><mark>where
    we have gathered today</mark>, where the memory of the righteous man is celebrated
    and where his holy remains are</em></strong><em>, he will first comfort his soul
    with the magnificence of what is set before his eyes, </em><strong><em>seeing
    this <mark>house as a temple of God</mark></em></strong><em>, brightly adorned
    both by the grandeur of its construction and by the beauty of its ornaments, where
    the carver has given the wood the likeness of various animals, and the stonecutter
    has brought the stone slabs to the smoothness of silver. And the painter has adorned
    it with skilful colours, </em><strong><em>depicting on the icon the valiant contests
    of the martyr, his steadfast standing at the tribunal, his tortures, the beast-like
    faces of the tormentors, their violent acts, the furnace blazing with fire, the
    most blessed end of the athlete, and the tracing of the human form of Christ,
    the giver of the contest</em></strong><em>; all this he has skilfully drawn for
    us in colours, as in a kind of explanatory book, clearly </em><strong><em>recounting
    the contests of the martyr and brightly adorning the <mark>temple</mark></em></strong><em>,
    as a flowering meadow (for painting too knows how to speak in silence </em><strong><em>on
    the walls</em></strong><em> and to bring the greatest benefit). And the layer
    of many-coloured stones has made the floor that is trodden worthy of the event
    here described.</em></p><p><em>Having comforted his eyes with these sensible works
    of art, (the visitor to the church) </em><strong><em>[the believer] at last desires
    to draw near to the reliquary as well, counting the very touching of it a sanctification
    and a blessing</em></strong><em>.</em></p></blockquote><p>(Encomium on the Great
    Martyr Theodore the Recruit)</p><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>In
    your work I have respectfully acknowledged its usefulness for all the churches
    — so that the ignorant, admonished by the testimony of the Scriptures, might learn
    with what reverence <strong>they ought to venerate the sanctuary and to minister
    at the <mark>altar of Christ</mark></strong>, and might learn that <strong>the
    sacred vessels</strong> and <strong>the holy veils</strong> and <strong>the other
    things</strong> belonging to the service of the Lord’s Passion are not something
    devoid of sacred significance, as though empty and meaningless, but, by contact
    (consortio) with the body and blood of the Lord, must be venerated with the same
    majesty as His body and blood.</p></blockquote><p>(Letter 91, to Theophilus)</p><h2>5th
    century</h2><h3>St Asterius of Amasea, bishop († before 431)</h3><blockquote><p><em>Having
    gone out of my house, I walked for some time with acquaintances through the city
    square, and then </em><strong><em>went <mark>into the church of God</mark></em></strong><em>
    to pray. As I was entering it, </em><strong><em>I saw in one of the porticoes
    a picture, whose appearance struck me</em></strong><em>. One might have thought
    that it was painted by Euphranor or another ancient painter, who brought the art
    of painting to great perfection and made their pictures almost alive. If you are
    willing to listen to me, I will explain the picture, because my leisure allows
    me to occupy myself with this. Though nurslings of the Muses, </em><strong><em>we
    too have colours no worse than those of the painters (words — translator’s note)</em></strong><em>.</em></p><p><em>There
    was a certain chaste maiden who had dedicated her virginity to God. Her name was
    Euphemia. When a certain tormentor raised a persecution against the followers
    of piety, she most willingly gave herself up to death. Her fellow citizens and
    the followers of the same religion for which she was put to death, honouring her
    courage and her holy virginity, </em><strong><em>built her a tomb near the <mark>church</mark>,
    and having laid her there in the coffin, they pay her honour, celebrate the day
    of her death every year, and in her memory hold a public and universal festival</em></strong><em>.
    The sacred ministers of the mysteries of God then pronounce encomiums in her honour,
    and eloquently recount to the assembled people how she accomplished the contest
    of martyrdom. A certain </em><strong><em>pious painter with great skill and very
    vividly depicted on a picture the history of all her sufferings, and hung this
    picture near her tomb, so that all might look at it</em></strong><em>.</em></p></blockquote><p>(Discourse
    on the icon of St Euphemia the Martyr)</p><h3>St Nilus of Sinai, monk († before
    450)</h3><blockquote><p><em>You write to me that </em><strong><em>you are preparing
    to erect a <mark>magnificent church</mark> in honour of the holy martyrs and of
    Christ Himself, glorified by their martyric contests</em></strong><em>. You ask
    </em><strong><em>whether it will be fitting to place <mark>icons in the sanctuary</mark></em></strong><em>,
    and to paint the walls on both sides with scenes of the hunting of animals, so
    that nets stretched out on the ground may be seen, hares and gazelles and other
    animals fleeing for safety, pursued by hunters with dogs. And also nets cast into
    the sea, fish caught and drawn to land by the hands of fishermen. Besides these,
    various moulded images. </em><strong><em>In the place of the common assembly of
    the faithful</em></strong><em> you wish to depict a multitude of crosses, and
    also various birds, beasts, reptiles and plants.</em></p><p><em>In answer to your
    letter I will say that it is fitting only for children to beguile the faithful
    with such pictures. </em><strong><em>But for a mature and discerning man it is
    fitting to depict the <mark>cross on the eastern side of the church</mark>. For
    by the cross the human race was saved, and by it hope is proclaimed to all who
    despair. And <mark>let the hand of a skilled painter fill the holy church with
    the histories of the Old and New Testaments</mark>, so that the illiterate, who
    cannot read the Divine Scripture, looking at the painted images, may call to mind
    the contests of those who served the true God. This will stir up in them zeal
    for similar contests, by which earth is exchanged for heaven and the invisible
    is preferred to the visible. And in the place of the common assembly of the faithful,
    which is divided into many parts, it is necessary to <mark>provide each church
    with a cross</mark></em></strong><em>, and to leave aside all that is superfluous.</em></p></blockquote><p>(Letter
    58, to Olympiodorus the Prefect)</p><h2>7th century</h2><h3>St Sophronius, patriarch
    of Jerusalem (c. 560–638)</h3><p>On the arrangement of the church:</p><blockquote><p><em>The
    kosmites (κοσμήτης) corresponds to the sacred kosmion (κοσμίον) of the Old Testament,
    representing </em><strong><em><mark>the image of the crucified Christ adorned
    with a cross</mark></em></strong><em>; sometimes, however, the kosmites is fashioned
    in the form of a veil.</em></p></blockquote><p>(Excerpt from the Discourse on
    the Divine Ministration)</p><h2>20th century</h2><p>A church building (as walls)
    is not indispensable for worship. In times of persecution the services were celebrated
    according to the conditions that allowed it:</p><blockquote><p><em>In the Ural
    taiga </em><strong><em>the Divine Liturgy was served</em></strong><em> by the
    prisoners of the Vyatka</em><strong><em> corrective labour camps</em></strong><em>.
    There were in it </em><strong><em>two bishops, several archimandrites, abbots,
    hieromonks and simple monks</em></strong><em>. And how many believing women there
    were in the camp, all of whom were nicknamed “nuns”, lumping together illiterate
    peasant women and abbesses of various monasteries. In the words of Father Paul,
    “there was a whole diocese there!” When they managed to come to an agreement with
    the head of the second section, which was in charge of passes, the “camp diocese”
    would go out into the forest and begin </em><strong><em>the service in a forest
    clearing</em></strong><em>. </em><strong><em>For the communion cup they prepared
    juice from various berries — bilberries, wild strawberries, blackberries, cranberries
    — whatever God would send; the altar was a tree stump, a towel served as a sakkos,
    and a censer was made from a tin can</em></strong><em>. And the hierarch, clothed
    in prisoners’ rags &lt;…&gt; stood before the forest altar as before the Lord’s
    own throne, and all the worshippers helped him. “Receive the Body of Christ, taste
    of the immortal fountain,” sang the choir of prisoners in the forest clearing…
    How they all prayed, how they wept — not from grief, but from the joy of prayer…
    At the last service (something had happened in the camp section, someone was being
    transferred somewhere) lightning struck the stump that served as the altar, so
    that it should not be defiled afterwards. It disappeared, and in its place there
    appeared a hollow full of pure, clear water. The guard who saw it all with his
    own eyes turned pale with fear and said: “Well, you are all saints here!” There
    were cases when some of the guard-riflemen also received communion in the forest
    together with the prisoners.</em></p></blockquote><p>(The Life of Archimandrite
    Paul (Gruzdev))</p>

