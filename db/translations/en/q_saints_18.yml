  body: <h2>17th century</h2><h3>Epistle of the Patriarchs of the Eastern-Catholic
    Church on the Orthodox faith (1723)</h3><p>This is a conciliar document of the
    Church of Jerusalem (1672), but by that time (1723) also approved by the 4 patriarchates
    (Constantinopolitan, Jerusalem, Antiochian, Alexandrian) and by the Synod of the
    Russian Church.</p><blockquote><p><strong><mark>We believe our Lord Jesus Christ
    to be the only mediator</mark></strong>, who, having given Himself as a ransom
    for all, through His own blood made Himself the reconciliation between God and
    man, and that He Himself, having a care for His own, is Advocate and propitiation
    for our sins.</p><p>Despite this, in prayers and supplications to Him, we say
    <strong><mark>the Saints are intercessors</mark>, and, above all, the undefiled
    Mother of the very God the Word; likewise the holy Angels (of whom we know that
    they are set over us as guardians), the Apostles, Prophets, Martyrs, Righteous
    Ones, and all whom He has glorified as His faithful servants. To these we reckon
    also the High Priests and Priests, as standing about the Holy Altar, and righteous
    men eminent for virtue.</strong> <strong><mark>For we know from the divine Revelation
    that we should pray one for another</mark></strong>, that <strong><mark>the prayer
    of the righteous availeth much</mark></strong> (Jas 5.16), and that <strong><mark>God
    heareth the Saints</mark></strong> rather than those who remain in sins. The Saints
    are mediators and intercessors for us before God not only here, while they abide
    with us, but especially after their death, when, after the mirror of reflections
    is done away, they behold the Most Holy Trinity in all its clarity, in whose boundless
    light they know all our needs. For as we doubt not but that the Prophets, while
    they were in a body with the perceptions of the senses, knew what was done in
    heaven, and thereby foretold what was future; so also that the Angels, and the
    Saints become as Angels, know in the infinite light of God what concerneth us,
    we doubt not, but rather unhesitatingly believe and confess.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732#HH-Decree-8">Decree
    8</a>)</p>
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
