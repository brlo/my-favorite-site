- src: FHNRQk6S_Заповедь_о_молитве
  path: The-commandment-of-prayer
  title: The commandment of prayer
  menu:
    parent: The heavenly Church/Prayers for the departed
    title: The commandment of prayer
    priority: 6
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><em>“Pray
    one for another” (Jas 5:16). “I exhort that supplications, prayers, intercessions...
    be made for all men” (1 Tim. 2:2). “Praying always with all prayer and supplication
    in the Spirit, and watching thereunto with all perseverance and supplication for
    all saints” (Eph. 6:18). </em><strong><em>All men have need of prayer: the living
    and the departed. Death does not break the spiritual union between the living
    and the departed (Luke 20:38; Rom. 14:8–9), and therefore prayers for the departed
    are as effectual before God as prayers for the living.</em></strong><em> The Lord
    desires not the death (the spiritual, eternal perdition) of a sinner (cf. Ezek.
    18:23, 33:11; 2 Pet. 3:9), but desires his salvation, and therefore </em><strong><em>fervent
    prayer cannot be unfruitful for the departed. He Himself gave the promise to the
    believers: “and all things, whatsoever ye shall ask in prayer, believing, ye shall
    receive”</em></strong><em> (Matt. 21:22). “And whatsoever ye shall ask in My name,
    that will I do, that the Father may be glorified in the Son. If ye shall ask any
    thing in My name, I will do it” (John 14:13–14; cf. 15:7; 16:23). “And this is
    the confidence that we have in Him, that, if we ask any thing according to His
    will, He heareth us... in whatsoever we ask” (1 John 5:14–15). </em><strong><em>Calling
    Christians to mutual love (1 John 2:9–11, 3:14–15, 23; 1 John 4:11, 20–21, 5:2),
    the same apostle commands: “If any man see his brother sin a sin which is not
    unto death, he shall ask, and God shall give him life, that is, to him that sinneth
    not unto death” (1 John 5:16). A sin not unto death is a sin committed through
    infirmity, through ignorance, by chance (cf. Lev. 4:2; Num. 15:29), a sin cleansed
    by sincere contrition and repentance and therefore not subjecting the sinner to
    spiritual death (1 John 3:14)</em></strong><em>. “Life” consists in communion
    with God (1 John 1:6, 3:14; 5:11–13); “death” consists in alienation from God.
    </em><strong><em><mark>“A sin not unto death”, although it breaks the communion
    of the Christian with God, does not sever his union with Christ and the Church,
    and therefore prayerful intercession for such a sinner is successful: “God shall
    give him life”, that is, communion with God, weakened or broken by sin, is restored.</mark></em></strong><em>
    This prayer is a witness of Christian love “not in word, neither in tongue; but
    in deed and in truth” (1 John 3:18). “There is a sin unto death: I do not say
    that he shall pray for it.”</em></p><p><em>“A sin unto death” ceases the communion
    of man with God, tears him away from the Source of life (John 14:6) and leads
    to spiritual death, to perdition (cf. Num. 15:30–31). A sin unto death is a grievous
    sin, in committing which man becomes incapable of repentance. These are the sins
    – blasphemy against the Holy Spirit: obstinate unbelief in the Christian truth
    once known, obstinate apostasy from the faith that accepts no admonition, hardened
    obduracy in pernicious heretical delusions and in grievous unrepented sins. Although
    the apostle does not forbid prayer for a brother who sins a sin “unto death”,
    he gives no command about prayer, since we cannot be sure that our prayers for
    them will be heard by God; the success of prayers for such brothers is opposed
    by their unbelief, obstinacy, hardness. Christians who have died with true repentance
    and faith in Christ are free from mortal sin, and consequently one must pray for
    them, and prayer may be beneficial for them.</em></p></blockquote><p>(The Orthodox
    Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
