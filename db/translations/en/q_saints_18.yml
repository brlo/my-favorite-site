  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p><em>“Ye must be on your guard against them, inasmuch
    as they are men who can scarcely be cured. There is one Physician who is possessed
    both of flesh and spirit; both made and not made; God existing in flesh; true
    life in death; both of Mary and of God; first possible and then impossible, even
    Jesus Christ our Lord. “Where is the wise man? where the disputer?” Where is the
    boasting of those who are styled prudent? For our God, Jesus Christ, was, according
    to the appointment of God, conceived in the womb by Mary, of the seed of David,
    but by the Holy Ghost. But </em><strong><em><mark>from the prince of this world
    the virginity of Mary was hidden, as was also her offspring</mark></em></strong><em>,
    and the death of the Lord, </em><strong><em><mark>three mysteries of renown</mark></em></strong><em>”</em></p></blockquote><p><em>(</em><a
    href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-21"><em>To the Ephesians</em></a><em>)</em></p><h2>2nd
    century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p><em>The
    words: “behold, a virgin shall conceive in the womb” signify that </em><strong><em><mark>a
    virgin should conceive without intercourse. For if she had had intercourse with
    any one whatever, she was no longer a virgin</mark></em></strong><em>, – but the
    power of God, having come upon the virgin, overshadowed her, and caused her </em><strong><em><mark>while
    yet a virgin to conceive</mark></em></strong><em>.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1">Apology 1</a>)</p><h2>3rd
    century</h2><h3>Peter of Alexandria, hieromartyr (2nd c.–311)</h3><blockquote><p>Therefore,
    of the holy Prophets and of all who, as I have said, lived piously and righteously
    in the law of the Lord, and who together with all the people celebrated the Passover
    according to the statute and with reverence, the Master of all visible and invisible
    creation, <strong>the Only-begotten Son and Word</strong>, consubstantial with
    the Father and the Holy Spirit in divinity, our Lord and God, Jesus Christ, in
    the fulness of time, <strong>born in the flesh of our Holy Glorious Lady the Mother
    of God and <mark>Ever-virgin</mark> (always a virgin — tr.) and truly Mother of
    God Mary</strong>, visible on earth and consubstantial with men in human nature,
    truly abiding as a man, He Himself with the people in the years before His preaching
    lawfully and reverently celebrated the Passover and ate according to the statute
    the lamb. For He came not to abolish the Law or (to abolish the teaching) of the
    Prophets, but to fulfil them, as the Saviour Himself said in the Gospel (cf. Matt.
    5:17).</p></blockquote><p>(On the Divinity)</p><h2>4th century</h2><h3>Ephrem
    the Syrian, monk (c. 306–372)</h3><blockquote><p><strong>It was not a man who
    required the Virgin for childbearing, but God</strong>. Therefore He communicated
    to the nature what it did not have, in order to show that He came not to harm
    the nature, but to keep it unharmed. The One being born was a pearl; therefore,
    being born, He came forth without sicknesses and pangs. He was not coarse like
    anything earthly, nor fluid like anything moist; <strong>He was the Infant in
    whom, under the simple nature, the perfect God was hidden</strong>. Therefore
    <strong><mark>the Virgin</mark></strong>, by the power of Him Who abode in her,
    gave birth naturally, but <strong><mark>endured nothing. The seal of virginity
    was not broken either by the conception of Christ or by the birth</mark></strong>.</p></blockquote><p>(Works,
    42, a discourse against heretics)</p><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><blockquote><p>Therefore
    I must call upon the Holy Spirit to aid me, that He may defend by my mouth with
    His own mind the virginity of blessed Mary; I must call upon the Lord Jesus to
    <strong><mark>guard from all suspicion of sexual intercourse</mark> the sacred
    lodging of the womb in which He abode for nine months; and God the Father Himself
    must be entreated to show that <mark>the mother of His Son</mark>, <mark>who became
    a mother before marriage</mark>, <mark>remained a virgin after childbearing</mark></strong>.</p><p>&lt;…&gt;</p><p>But
    as we do not deny what is written, so we reject what is not written. That <strong>God
    was born of the Virgin</strong> – this we believe, because we read it; <strong><mark>that
    Mary was a wife after her childbearing – this we do not believe</mark></strong>,
    because we do not read it. And we say this not because we condemn marriage, –
    virginity itself is the fruit of marriage, – but because we must not affirm anything
    arbitrarily about holy men. For by such a supposition of possibility we might
    maintain that Joseph had many wives, since Abraham had many, and Jacob had many,
    and that the brothers of the Lord were from these wives, as many invent <strong>not
    so much with pious as with daring boldness</strong>. Thou sayest that Mary did
    not remain a virgin: I hold it safer for myself to think that Joseph himself became
    a virgin through Mary, so that a virgin son was born of the union of virgins.
    For, if a holy man cannot fall under the accusation of fornication, and it is
    not written that he had another wife, and <strong>for Mary, whose husband he was
    considered to be, he was more a protector than a husband</strong>: the conclusion
    remains that he, who was counted worthy to be called the father of the Lord, <strong>remained
    a virgin together with Mary</strong>.</p></blockquote><p>(On the Ever-virginity
    of Blessed Mary)</p><h3>St John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p><strong><mark>The
    Virgin gave birth as the One born Himself wished to be born. This did not take
    place according to the law of nature</mark>, but, as the Master of nature, <mark>He
    employed an extraordinary manner of birth</mark>, to show that even in becoming
    man He is not born as a man, but is born as God.</strong> Today, then, He came
    forth from the Virgin who had overcome nature, who had surpassed marriage<strong>.</strong>
    It behoved the Fountain of holiness to come forth from a pure and holy birth.
    He is the One who in ancient times formed Adam from virgin earth, and from Adam
    formed a wife without a wife. <strong>As Adam without a wife produced a wife,
    so today a Virgin without a man gave birth to a man</strong>. He is man, it is
    said in Scripture, but who shall know Him? Since the female sex is indebted to
    the male in that Adam without a wife produced a wife, therefore today the Virgin
    without a man gave birth to a man, paying to the men this debt for Eve. Lest Adam
    should be proud that without a wife he produced a wife, therefore the Virgin without
    a man gave birth to a man, to show by the equality of the wonder the equality
    of her nature. <strong>As from Adam God took a rib and by this in no way diminished
    Adam, so in the Virgin He formed the ensouled temple and <mark>did not deprive
    her of virginity</mark>. Adam remained whole even after the taking of the rib
    from him; <mark>the Virgin also remained unharmed after the Infant came forth
    from her</mark></strong>. Therefore He did not fashion for Himself a temple from
    something else, nor create another body and take it upon Himself, lest it seem
    that He despises the nature of Adam. Since the deceived man had become the weapon
    of the devil, He chose for Himself this very fallen man as an ensouled temple,
    that by the kinship with the Creator he might be turned away from communion with
    the devil. Yet even in becoming man, He is not born as a man, but is born as God.
    If He had come forth through an ordinary marriage, like me, to the majority it
    would have seemed a lie; <strong>but now He <mark>is born of a Virgin, and in
    being born preserves her womb unharmed and keeps her virginity whole, that the
    extraordinary manner of His birth may serve as the foundation of great faith for
    me.</mark></strong> Therefore, if a pagan or a Jew asks me, <strong><mark>whether
    Christ, God by nature, became man supernaturally, I shall say: yes, – and in confirmation
    of my word I shall point to the unbroken seal of virginity</mark></strong>. Thus
    He is God, who conquers the order of nature; thus He is the creator of the womb
    and the author of virginity, and therefore He was born by an unspotted manner
    of birth and ineffably fashioned for Himself a temple as He wished.</p></blockquote><p>(Discourse
    on the Nativity of our Saviour Jesus Christ)</p><h2>5th century</h2><h3>Blessed
    Augustine of Hippo (354–430)</h3><blockquote><p>To say all that should be said
    of this Mediator would require long discourse, although for man to search it out
    worthily is impossible. <strong>For who can express in fully fitting words this
    one thing alone, that “the Word was made flesh, and dwelt among us” (John 1:14),
    that we should believe in the only Son of God the Father Almighty, born of the
    Holy Spirit and the Virgin Mary? The Word was made flesh in such wise that the
    flesh was assumed by the Godhead, and the Godhead was not changed into flesh.
    </strong>By the flesh, further, we must here understand man, by the use in speech
    of the part for the whole, as it is said: “because by the deeds of the law there
    shall no flesh be justified...” (Rom. 3:20), that is, no man. For one cannot say
    that in that assumption of human nature anything was wanting, even though the
    nature be wholly free from all sin; He is not such a man as is born of the two
    sexes through carnal lust with its inevitable transgression, the responsibility
    for which is removed by regeneration, <strong>but such as <mark>must needs be
    born of a Virgin, conceived in the faith of the Mother and not in lust: had her
    purity been marred even in bringing Him forth, He would not have been born of
    a Virgin, and the whole church would falsely (God forbid!) confess Him born of
    the Virgin Mary</mark>, – the church which, imitating His Mother, daily brings
    forth her members, <mark>remaining a virgin.</mark></strong></p></blockquote><p>(The
    Enchiridion on faith, hope and love to Laurentius)</p><h3>St Cyril of Alexandria,
    archbishop (376–444)</h3><p>A discourse pronounced in the church named in honour
    of the Mother of God Mary</p><blockquote><p>I see the bright assembly of all the
    saints, hastily gathered together at the <strong>call of the holy Mother of God
    and <mark>ever-virgin Mary</mark></strong>. Therefore, although I was in great
    sorrow, this presence of the holy fathers changed my sorrow into joy. Now is fulfilled
    over us the sweet saying of the psalmist David: behold what is good, or what is
    beautiful, but to dwell together as brethren (Ps. 13:1). Therefore we bless thee,
    holy mystical Trinity, who hast gathered us all <strong>into this temple of Mary
    the Mother of God.</strong> <strong>We bless thee, <mark>Mary Mother of God</mark>,
    the precious treasure of the whole world, the inextinguishable lamp, the crown
    of virginity, the sceptre of orthodoxy, the indestructible temple, the container
    of the Uncontainable, <mark>mother and virgin</mark></strong>; through thee is
    called blessed in the holy gospels Him who comes in the name of the Lord. We bless
    thee, <strong>thou who didst contain the Uncontainable <mark>in thy holy virgin
    womb</mark></strong>; through thee the holy Trinity is honoured and glorified,
    through thee the precious cross is honoured and worshipped throughout the universe,
    through thee heaven rejoices, angels and archangels rejoice, demons are scattered,
    through thee the deceiver devil fell from heaven, through thee the fallen creation
    is raised to heaven, through thee all creation, given over to idolatry, is brought
    to the knowledge of the truth, through thee holy baptism is communicated to the
    faithful, through thee the oil of gladness, through thee throughout the whole
    universe the Churches are established, through thee the nations are brought to
    repentance. But why say much? Through thee shone forth the Only-begotten Son of
    God, the light of those sitting in darkness and the shadow of death, through thee
    the prophets prophesied, through thee the apostles preached salvation to the nations,
    through thee the dead rise, through thee kings reign, by the power of the holy
    Trinity. But who of men could worthily praise the most praiseworthy Mary? The
    virgin womb. A marvellous thing! This wonder fills me with astonishment. Who has
    ever heard that the builder who created his own house is forbidden to dwell in
    it? Who is subject to reproach for that he raised his own handmaid to the dignity
    of mother?</p><p>&lt;…&gt;</p><p>As for ourselves, let us reverently honour and
    humbly confess the union (that is, between the divinity and humanity in Christ),
    obey the most beloved emperor, submit to authorities and powers, and with fear
    and trembling honour and glorify the undivided Trinity, <strong>celebrating also
    <mark>the ever-virgin Mary</mark>, the holy temple (of the Godhead) and her Son</strong>
    and the undefiled bridegroom: for to Him is glory unto ages of ages.</p></blockquote><p>(Discourse
    against Nestorius pronounced after seven bishops joined the Holy Mary)</p><h2>19th
    century</h2><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>Once
    in the temple of Jerusalem the Lord Jesus Christ made reference to His beginninglessness
    in the Godhead; the Jews took up stones to slay the God-man, who had so openly
    declared Himself to them. But the Lord suddenly became invisible in their midst;
    and withdrew from the temple, passing through the midst of a multitude of His
    enemies. On another occasion the enraged inhabitants of the city of Nazareth seized
    the Lord, who was teaching in their synagogue, and led Him to the top of the mountain
    on which the city was built, to cast Him down from there and kill Him; but the
    Lord became invisible and, coming out from among them, departed (Luke 4:29–30).
    <strong><mark>In exactly the same way did the Lord act at His birth: He came forth
    from the womb of the Virgin without breaking the seals of her virginity, without
    opening the doors of this wondrous temple of His, as the prophet had foreseen,
    who proclaimed in the rapture of his vision: “these gates shall be shut, and shall
    not be opened, and no man shall enter in by them, and they shall be shut, and
    no man shall enter in by them: for the Lord God of Israel hath entered in by them,
    and they shall be shut” (Ezek. 44:2). </mark></strong>The holy Church sings of
    the Lord in her hymns: “The Creator, made manifest without seed from the Virgin,
    was incarnate; having burst the seals of the tomb, He rose; and through the doors
    shut fast He entered in with flesh unto the apostles”. “Having kept whole the
    signs (seals), O Christ, Thou didst rise from the tomb, not harming the keys of
    the Virgin in Thy birth”. “All things beyond understanding, all things glorious
    are thy mysteries, O Mother of God; sealed in purity and guarded in virginity,
    thou art known in truth to be the Mother who gave birth to the true God”. “Before
    thy birth a Virgin, in thy birth a Virgin, after thy birth thou remainest a Virgin”.
    <strong><mark>“To those who dare to say that the most pure Virgin Mary was not
    a virgin before her birth, in her birth, and after her birth: anathema”.</mark></strong></p></blockquote><p>(Ascetical
    homilies. Chapter 54)</p><h2>20th century</h2><h3>St Justin (Popović) of Ćelije,
    monk (1894–1979)</h3><blockquote><p><strong><mark>The Ever-virginity of the Most
    Holy Mother of God was foretold by the prophetic vision of the Old Testament</mark>
    and confirmed by the New Testament God-manly reality. By his God-inspired word
    the Old Testament evangelist foretold the great New Testament truth of the birth
    of God from the Virgin: ““Behold, a virgin shall conceive, and bear a son, and
    shall call his name Immanuel: which is interpreted, God with us”” (Isa. 7:14;
    Matt. 1:23). </strong>The God-seer Moses, to whom God revealed many New Testament
    truths, saw on Mount Horeb, in a mysterious appearance, the incombustible bush
    as the prototype of the person of the holy Virgin Mother of God, who, giving birth
    and having given birth to the incarnate Word of God as a Virgin, remains ever
    a Virgin, does not cease to be a Virgin (Exod. 3:1–8). In the wondrous vision
    the Lord announces to the holy prophet Ezekiel the unshakable truth of the gospel
    concerning the Most Holy Mother of God: her most pure virginity before the incarnation
    and after the incarnation of the Word of God. He reveals this to him in the symbolic
    vision of the holy gates, through which only the Lord our God passes, and they
    remain shut for ever (Ezek. 43:27, 44:3).</p><p><strong>The New Testament proclaims
    to us that the Most Holy Virgin Mary gave birth to the Saviour as a Virgin, without
    the participation of a man. Of this the very conversation between the holy evangelist,
    the Archistratege Gabriel, and the Most Holy Virgin Mary bears witness. He announces
    to her that she will give birth to the Saviour of the world; and she asks him
    in astonishment: “How shall this be, seeing I know not a man?” To her the heavenly
    evangelist answers: “The Holy Spirit shall come upon thee, and the power of the
    Highest shall overshadow thee. Therefore also that holy thing which shall be born
    of thee shall be called the Son of God” (Luke 1:31, 34, 35). </strong>Assurance
    of such a marriageless conception of the Saviour from the Holy Virgin is received
    by the righteous Joseph, who wished to put her away because of her pregnancy;
    <strong>an angel appears to him and reveals that that which is conceived in the
    Holy Virgin is of the Holy Spirit (Matt. 1:20). </strong>By God''s revelation,
    the holy evangelist Matthew bears witness: “When as his mother Mary was espoused
    to Joseph, before they came together, she was found with child of the Holy Spirit”
    (Matt. 1:18).</p></blockquote><p>(Dogmatics of the Orthodox Church. Volume II)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
