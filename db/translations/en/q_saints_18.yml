- src: Ku053iAD_Почитание_Божией_Матери
  path: The-veneration-of-the-Mother-of-God
  title: The veneration of the Mother of God
  title_sub: Quotes of the Holy Fathers on the veneration of the Virgin Mary, the
    Theotokos
  meta_desc: Quotes of the Holy Fathers on the veneration of the Virgin Mary, the
    Theotokos
  menu:
    parent: The heavenly Church/Veneration of the Mother of God
    title: The veneration of the Mother of God
    priority: 3
  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p>“Ye must be on your guard against them, inasmuch
    as they are men who can scarcely be cured. There is one Physician who is possessed
    both of flesh and spirit; both <strong><mark>made</mark></strong> and not made;
    God existing in flesh; true life in death; <strong><mark>both of Mary and of God</mark></strong>;
    first possible and then impossible, even Jesus Christ our Lord. “Where is the
    wise man? where the disputer?[32] Where is the boasting of those who are styled
    prudent? <strong><mark>For our God</mark> Jesus Christ, according to the appointment
    of God, was <mark>conceived in the womb by Mary</mark></strong>, of the seed of
    David, but <strong><mark>by the Holy Ghost</mark></strong>. Now the virginity
    of Mary was hidden from the prince of this world, as was also her offspring, and
    the death of the Lord, three mysteries of renown” (<a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-21">To
    the Ephesians</a>)</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-21">To
    the Ephesians</a>)</p><h2>2nd century</h2><h3>St Justin the Philosopher, martyr
    (c. 100–165)</h3><blockquote><p>“we <strong>know Him to be the first-begotten
    of God</strong>, and to be before all creatures; likewise to be the Son of the
    patriarchs, since <strong><mark>He assumed flesh by the Virgin</mark></strong>
    of their family, and submitted to become a man”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-100">Dialogue
    with Trypho, 100</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>God,
    then, <strong><mark>was made man</mark></strong>, and the Lord Himself did save
    us, giving us the token of <strong><mark>the Virgin</mark></strong> &lt;...&gt;
    so did He who is the Word, recapitulating Adam in Himself, rightly receive a birth,
    enabling Him to gather up Adam, <strong><mark>from Mary, who was as yet a virgin</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-21">Against
    Heresies, Book III, ch. 21</a>)</p><h2>3rd century</h2><h3>Peter of Alexandria,
    hieromartyr (2nd c.–311)</h3><blockquote><p>Therefore, of the holy Prophets and
    of all who, as I have said, lived piously and righteously in the law of the Lord,
    and who together with all the people celebrated the Passover according to the
    statute and with reverence, the Master of all visible and invisible creation,
    <strong>the Only-begotten Son and Word</strong>, consubstantial with the Father
    and the Holy Spirit in divinity, our Lord and God, Jesus Christ, in the fulness
    of time, <strong>born in the flesh of <mark>our Holy Glorious Lady the Mother
    of God</mark> and Ever-virgin and truly Mother of God Mary</strong>, visible on
    earth and consubstantial with men in human nature, truly abiding as a man, He
    Himself with the people in the years before His preaching lawfully and reverently
    celebrated the Passover and ate according to the statute the lamb. For He came
    not to abolish the Law or (to abolish the teaching) of the Prophets, but to fulfil
    them, as the Saviour Himself said in the Gospel (cf. Matt. 5:17).</p></blockquote><p>(On
    the Divinity)</p><h3>Methodius of Olympus, bishop of Patara, hieromartyr (c. 260–312)</h3><blockquote><p>Truly
    fearsome is the mystery accomplished in thee, <strong><mark>O Mother-Virgin, spiritual
    throne, most glorified and worthy of God</mark></strong>. Thou hast shown an astonishing
    wonder to things in heaven and on earth.</p><p>&lt;…&gt; For if such honour from
    God was rendered to the image of thy holiness, that none except the priests could
    approach or have access to the contemplation of it, since the veil separated and
    guarded the entrance there as to a queen; then what and <strong><mark>how great
    veneration from us most humble men must there be for Thee, the true Queen</mark>,
    the true living Ark of the Lawgiver God, who hast become in truth the spacious
    heaven of the uncontainable God</strong>? For when Thou, <strong><mark>Most Holy</mark></strong>,
    didst appear to the world like a light-bearing day, and didst reveal the Sun of
    righteousness, then the fearful darkness was scattered, the power of the tyrant
    was destroyed, death was demolished, hades was overthrown, and all enmity vanished
    before peace, and the destructive diseases withdrew from the salvation that appeared,
    and the whole universe was filled with the light of the pure truth.</p><p>&lt;…&gt;
    And so receive, most gracious one, the precious gifts that are fitting for thee
    alone, <strong><mark>highest of all generations and more honourable than all visible
    and invisible creation</mark></strong>.</p><p>&lt;…&gt; Having received the command
    to build the ark according to image and likeness, he carefully fulfilled the command,
    although something grievous had happened before his descent (Exod. 32:1); he built
    it in the dimensions of five and a half cubits, and covering it with Cherubim
    made it the receptacle of the law, very clearly prefiguring thee, <strong><mark>O
    Mother of God</mark>, who conceived without corruption and ineffably brought forth
    the incorrupt fruit</strong></p><p>&lt;...&gt; Blessed art thou, all-blessed and
    all-desired. With blessings of the Lord is filled thy name most rich in grace,
    <strong><mark>O Birth-giver of God</mark></strong> and enlightener of the faithful.
    Thou dost embrace, so to speak, the Uncontainable; thou art the root of the most
    beautiful flower (Isa. 11:1), <strong><mark>the mother of the Creator, the nurse
    of Him who feeds, who dost contain the Almighty</mark></strong></p><p>&lt;…&gt;
    Thou hast shone forth, O desired parent of the (spiritual) Light of the Sun, with
    the unapproachable rays of ardent love, <strong><mark>having given birth in the
    end (of times) to the One born from the beginning</mark></strong>, revealing the
    hidden and unspeakable mystery, <strong><mark>the Son of the invisible Father</mark></strong>,
    the giver of peace, who marvelously humbled Himself more than every humiliation.
    Therefore <strong><mark>we beseech thee</mark></strong>, most excellent of all,
    honoured with maternal privileges and boldness, to remember without ceasing, <strong><mark>O
    all-holy Mother of God</mark></strong>, us who boast in thee and with godly doxologies
    <strong><mark>venerate thy ever-living and unfading memory</mark></strong>.</p></blockquote><p>(Discourse
    on Simeon and Anna. On the day of the Meeting of the Lord) (Spuria)</p><h2>4th
    century</h2><h3>St Athanasius the Great, bishop of Alexandria (c. 295–373)</h3><blockquote><p>And
    the visible body was not the body of a man, but of God; in this body, even when
    crucified, He raised the dead. Therefore this bold thought of theirs is not good,
    that the Word of God was upon some holy man (as it was in each of the Prophets
    and other saints); let that thought also be rejected, that the Word is born each
    time and then dies. Of the Lord we must not think thus; God forbid! On the contrary,
    “once in the end of the ages, to put away sin” (Heb. 9:26), the Word became flesh<strong>,
    and from Mary the Virgin there came forth a man after our likeness</strong>, as
    the Lord said to the Jews: “yet ye seek to kill Me, a man that hath told you the
    truth” (John 8:40)? And we are made divine, not by partaking of the body of some
    man, but by receiving the body of the Word Himself.</p><p>3) <strong>I marvelled
    also at this, how they dared even to think that the Word became man by the natural
    order. If it were so, then vainly would <mark>the memory of Mary be honoured</mark></strong>.
    Nature knows no virgin who gives birth without a husband. Therefore He, the true
    God and the Word of the Father by nature and the Wisdom of the Father, by the
    good will of the Father became man bodily for our salvation, that He might have
    something to offer for us and save us all</p></blockquote><p>(Letter to Maximus
    the Philosopher)</p><h3>Ephrem the Syrian, monk (c. 306–372)</h3><blockquote><p><strong>It
    was not a man who required the Virgin for childbearing, but God</strong>. Therefore
    He communicated to the nature what it did not have, in order to show that He came
    not to harm the nature, but to keep it unharmed. The One being born was a pearl;
    therefore, being born, He came forth without sicknesses and pangs. He was not
    coarse like anything earthly, nor fluid like anything moist; <strong><mark>He
    was the Infant in whom, under the simple nature, the perfect God was hidden</mark></strong>.
    Therefore <strong>the Virgin</strong>, by the power of Him Who abode in her, gave
    birth naturally, but <strong>endured nothing. The seal of virginity was not broken
    either by the conception of Christ or by the birth</strong>.</p></blockquote><p>(Works,
    42, a discourse against heretics)</p><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p><em>And now God has no lack of a Deborah, no lack
    of a Jael. </em><strong><em><mark>We have also the holy Virgin and Mother of God
    Mary, interceding for us</mark></em></strong><em>. If an ordinary woman prevailed,
    then how many times more shall the Mother of Christ put to shame the enemies of
    the truth? </em><strong><em>Clad in the whole armour, that enemy thought that
    this was a woman worthy of laughter, and, however, he found (in her) a general
    to contend with him</em></strong><em>. He did not think that he stood already
    near the grave, and, however, a grave was already found for him; he considered
    that woman, so to speak, dead, and, however, by her he was afterwards put to death.
    </em><strong><em><mark>We have our Lady – the holy Mary Mother of God</mark></em></strong><em>;
    but we have need also of the apostolic prayers. Let us say to Paul, as his contemporaries
    said to him: “Come into Macedonia and help us” (Acts 16:9). We have the apostles,
    let us not then grow stiff with fear! </em><strong><em><mark>We have our Lady
    – the Mother of God, the holy Ever-virgin Mary, let us not fear!</mark> </em></strong><em>We
    have the host of martyrs, let us not be careless! Not only shall we beseech, but,
    if we deem it needful, also fast.</em></p><p><em>&lt;…&gt;</em></p><p><em>And
    I have already said, and say again: </em><strong><em><mark>let us beseech the
    holy and glorious Virgin and Mother of God Mary</mark></em></strong><em>; let
    us call upon the holy and glorious apostles; let us call upon the holy martyrs!
    &lt;…&gt; let us be friends of the martyrs not by necessity, but by love.</em></p></blockquote><p>(Discourse
    on the fact that there is one Lawgiver of the Old and the New Testaments, likewise
    on the vesture of the priest, and on repentance)</p><h2>5th century</h2><h3>St
    Cyril of Alexandria, archbishop (376–444)</h3><p>A discourse pronounced in the
    church named in honour of the Mother of God Mary</p><blockquote><p>I see the bright
    assembly of all the saints, hastily gathered together at the <strong>call of the
    holy <mark>Mother of God and ever-virgin Mary</mark></strong>. Therefore, although
    I was in great sorrow, this presence of the holy fathers changed my sorrow into
    joy. Now is fulfilled over us the sweet saying of the psalmist David: behold what
    is good, or what is beautiful, but to dwell together as brethren (Ps. 13:1). Therefore
    we bless thee, holy mystical Trinity, who hast gathered us all <strong>into this
    temple of Mary the Mother of God.</strong> <strong><mark>We bless thee, Mary Mother
    of God, the precious treasure</mark> of the whole world, the inextinguishable
    lamp, the crown of virginity, the sceptre of orthodoxy, the indestructible temple,
    the container of the Uncontainable, mother and virgin</strong>; through thee is
    called blessed in the holy gospels Him who comes in the name of the Lord. <strong><mark>We
    bless thee</mark>, thou who didst contain the Uncontainable in thy holy virgin
    womb; through thee the holy Trinity is honoured and glorified, through thee the
    precious cross is honoured and worshipped throughout the universe</strong>, through
    thee heaven rejoices, angels and archangels rejoice, demons are scattered, through
    thee the deceiver devil fell from heaven, through thee the fallen creation is
    raised to heaven, through thee all creation, given over to idolatry, is brought
    to the knowledge of the truth, through thee holy baptism is communicated to the
    faithful, through thee the oil of gladness, through thee throughout the whole
    universe the Churches are established, through thee the nations are brought to
    repentance. But why say much? <strong>Through thee shone forth the Only-begotten
    Son of God</strong>, the light of those sitting in darkness and the shadow of
    death, through thee the prophets prophesied, through thee the apostles preached
    salvation to the nations, through thee the dead rise, through thee kings reign,
    by the power of the holy Trinity. But <strong><mark>who of men could worthily
    praise the most praiseworthy Mary?</mark></strong> The virgin womb. A marvellous
    thing! This wonder fills me with astonishment. Who has ever heard that the builder
    who created his own house is forbidden to dwell in it? Who is subject to reproach
    for that <strong><mark>he raised his own handmaid to the dignity of mother</mark></strong>?</p><p>&lt;…&gt;</p><p>As
    for ourselves, let us reverently honour and humbly confess the union (that is,
    between the divinity and humanity in Christ), obey the most beloved emperor, submit
    to authorities and powers, and with fear and trembling honour and glorify the
    undivided Trinity, <strong><mark>celebrating also the ever-virgin Mary</mark>,
    the holy temple (of the Godhead) and her Son</strong> and the undefiled bridegroom:
    for to Him is glory unto ages of ages.</p></blockquote><p>(Discourse against Nestorius
    pronounced after seven bishops joined the Holy Mary)</p><h2>20th century</h2><h3>St
    Luke of Crimea (Vojno-Yasenetsky), archbishop (1877–1961)</h3><blockquote><p><em>We
    all, Orthodox Christians, </em><strong><em><mark>venerate the Most Holy Virgin
    Mary</mark></em></strong><em> in accordance with the teaching of the Holy Scripture,
    but </em>with grief we must say that the enemies of the Church of Christ – the
    Protestants, the sectarians and other heretics<em> – do not partake of this praise
    of the Orthodox world.</em></p><p><em>&lt;…&gt;</em></p><p><em>May the Lord rebuke
    them! And </em>may He rebuke in us all communion with the sectarians, lest they
    lead us onto the path of perdition.<em> And </em><strong><em><mark>may the Most
    Holy Mother of God, whose greatest feast we celebrate today</mark></em></strong><em>,
    save us all from the devil and all his servants. Amen.</em></p></blockquote><p>Discourses
    on the Annunciation of the Most Holy Mother of God, I. Not in vain is our faith,
    1945</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: QtYUoE3y_Чины_ангельские
  path: The-ranks-of-the-angels
  title: The ranks of the angels
  meta_desc: Quotes of the Holy Fathers on the ranks of the angels
  menu:
    parent: The heavenly Church/Veneration of the holy angels
    title: The ranks of the angels
    priority: 2
  body: "<h2>4th century</h2><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p>There are Angels and Archangels, Thrones and Dominions,
    Principalities and Powers; but not these choirs alone exist in the heavens, but
    endless hosts and innumerable tribes, which no word can depict. Whence is it known
    that besides these powers there are many others whose very names we do not know?
    Paul, having spoken of the first, mentions also the second, saying of Christ:
    He set Him <em>“far above all principality, and power, and might, and dominion,
    and every name that is named, not only in this world, but also in that which is
    to come”</em> (Eph. 1:21).</p></blockquote><p>(Against the Anomoeans, Homily 4)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: saints_Ангелхранитель
  path: The-guardian-angel
  title: The guardian angel
  menu:
    parent: The heavenly Church/Veneration of the holy angels
    title: The guardian angel
    priority: 3
  body: "<h2>4th century</h2><h3>St Basil the Great, archbishop of Caesarea (c. 329–379)</h3><blockquote><p>All
    <strong><mark>the Angels</mark></strong> have both one common name and, of course,
    the same nature common to all; yet <strong><mark>some of them are set to preside
    over nations, and others to be the companions of each of the faithful</mark></strong>.
    But in the measure that a whole people is to be preferred to one man, in that
    same measure, without doubt, the dignity of the angel who presides over a people
    is necessarily higher than the dignity of the angel entrusted with the care of
    one man. And that <strong><mark>with each of the faithful there is an angel who,
    as a leader and shepherd</mark></strong>, guides his life, no one will dispute,
    mindful of the word of the Lord who said: “despise not one of these little ones.
    For I say unto you, that their angels in heaven do always behold the face of My
    Father which is in heaven” (Matt. 18:10). And the Psalmist says: “The angel of
    the Lord encampeth round about them that fear Him, and delivereth them” (cf. Ps.
    90:11). And: “The angel that delivereth me from all evil” (Gen. 48:16), and the
    like. And that <strong><mark>certain angels are also chiefs of whole nations</mark></strong>,
    Moses teaches us in his song, saying: “When the Most High divided the lot of the
    nations and dispersed the sons of Adam, He set the bounds of the nations by the
    number of His angels” (Deut. 32:8). And the wise Daniel in a vision heard an angel
    say: “The prince of the kingdom of Persia withstood me one and twenty days; but
    lo, Michael, one of the chief princes, came to help me, and I remained there by
    the kings of Persia” (Dan. 10:13); and a little later he says: “the prince of
    Greece shall come.” But there is also spoken of a certain “Captain of the host
    of the Lord,” who appeared to Joshua the son of Nun at the Jordan (Josh. 5:14).
    And legions of angels are likewise mentioned, when the Lord says to the disciples:
    “or thinkest thou that I cannot beseech My Father, and He shall give Me forthwith
    more than twelve legions of angels” (Matt. 26:53). Therefore the Archistratege
    of the angels, who are set in legions, is of course a prince.</p></blockquote><p>(Against
    Eunomius, Book 3, 1)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: ed2tBCwU_Частный_суд_Божий
  path: The-particular-judgment
  title: The particular judgment
  menu:
    parent: The heavenly Church/Prayers for the departed
    title: The particular judgment
    priority: 1
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>God
    appoints to man, immediately after his death, one or another lot, in accordance
    with his definite spiritual and moral direction, whether towards good or towards
    evil. This judgment of God is called particular, in distinction from the universal
    judgment after the resurrection of bodies. The particular judgment of God takes
    place over each soul separately and has as its aim to determine its lot not for
    all eternity, but only for the time until the universal judgment, when all men
    will receive their full recompense</strong>: “these (the sinners) shall go away
    into everlasting punishment, but the righteous into life eternal” (Matt. 25:46;
    2 Thess. 1:5–10; 2 Cor. 5:10 and elsewhere). The Lord Jesus Christ Himself gave
    clear indications about the particular judgment (Luke 16:22–23). The blessed state
    of the soul of Lazarus and the torments of the rich man immediately after their
    death evidently presuppose a judgment of God deciding the fate of the dead beyond
    the grave.</p><p>&lt;…&gt;</p><p>According to the teaching of the Orthodox Church,
    <strong>the particular judgment of God over the soul</strong> of a man who has
    died is depicted under the form of his passing through the toll-houses.</p><p>The
    toll-houses are separate courts of judgment, guarded by evil angels and situated
    in the air on the way of the ascent of souls to heaven. At these toll-houses the
    soul, surrounded by good and evil angels, before the all-seeing Judge, is closely
    examined in all its deeds, evil and good; and after the examination the soul,
    justified at all the toll-houses, is raised, by the sentence of the Judge, to
    the mansions of paradise, while the soul detained at one or another toll-house,
    accused of ungodliness, is led away by the demons to hell.</p><p><strong>The teaching
    on the toll-houses is in agreement with Scripture</strong></p><p>1) In this teaching
    it is said that to men who are dying, at the separation of their soul from the
    body, there appear angels both good and evil; the first are ready to conduct it
    to heaven, while the latter strive to lead it away to the place of torments. And
    the Lord Himself said: “the beggar died, and was carried by the angels into Abraham's
    bosom” (Luke 16:22). “God said to him: Fool! this night thy soul shall be required
    of thee” (Luke 12:20).</p><p>&lt;…&gt;</p><p>2) The teaching on the toll-houses
    asserts further that the soul passes on its way to heaven and to God through the
    aerial spaces, where it meets evil spirits, from which it undergoes examinations.
    And in the Holy Scripture the devil is called the prince that ruleth in the air
    (Eph. 2:2), and the spirits subject to him – the spiritual hosts of wickedness
    in the heavenly places (Eph. 6:12). In the Epistle of the Apostle Jude there is
    mention of the dispute of the archangel Michael with the devil concerning the
    body of Moses. “Michael the Archangel, when speaking with the devil, disputing
    about the body of Moses, durst not bring in a railing judgment, but said: The
    Lord rebuke thee” (Jude 1:9) – to utter blasphemy and accusations against Moses.
    This mention gives grounds to conclude that for the human soul also, after its
    departure from the body, a contention between good and evil angels is possible:
    whether it is to be condemned to torments in the company of evil angels or justified
    for participation in the blessedness with the good angels. Moreover, the Holy
    Scripture represents the whole earthly life of man as passing under the one or
    the other influence of bodiless spirits. It teaches that the good angels are ministering
    spirits, sent forth to minister for those who inherit salvation (Heb. 1:14), that
    they have care for us during our life (Ps. 90:10–11), especially the guardian
    angel (Matt. 18:10; Ps. 33:8). All the activity of the evil spirits, on the contrary,
    is directed constantly to our perdition (Eph. 6:12; 2 Tim. 2:26; 1 Thess. 3:5);
    the devil walketh as a roaring lion, seeking whom he may devour (1 Pet. 5:8).
    With such participation of bodiless spirits in our life even in the conditions
    of earthly existence, it will be quite natural if the same participation of theirs
    continues and even increases after death.</p></blockquote><p>(The Orthodox Church
    and the Sectarians, part 2)</p>"
