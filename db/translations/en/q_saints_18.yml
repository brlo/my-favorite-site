- src: W8qp2HTD_Умершие_христиане__члены_Христовой_Церкви
  path: The-departed-members-of-Christ-Church
  title: Departed Christians — members of the Church of Christ
  menu:
    parent: The heavenly Church/Prayers for the departed
    title: The departed Christians — members of the Church
    priority: 2
  body: "<h2>19th century</h2><h3>St Theophan the Recluse, bishop (1815–1894)</h3><blockquote><p><strong><mark>The
    Church</mark> is the living union of all the faithful, who all, joined into one
    under one head – Christ the Lord, make up one body. <mark>It is made up of believers
    both living and dead.</mark></strong> The unbelieving – both living and dead –
    are outside it and outside the Lord Saviour, its head. The unbelievers here are
    called, and if they avail themselves of this here and enter into the Church, then
    there also they will be such, that is, children of the Church. The Saviour says:
    “he that believeth and is baptized shall be saved; but he that believeth not shall
    be condemned” (Mark 16:16). And again: “except a man be born of water and of the
    Spirit, he cannot enter into the kingdom of God” (John 3:5)! And this must be
    accomplished on earth.</p></blockquote><p>(Illness and death, letter 479)</p><h2>20th
    century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Only
    the body of man is subject to death, while his soul, as a being not material but
    spiritual, is immortal (Matt. 10:28; Acts 7:59; Heb. 12:22–23; Rev. 6:9–10 and
    elsewhere). After its separation from the body it continues to exist and, in accordance
    with its spiritual and moral state acquired during its earthly life, experiences
    blessedness or torment.</p><p>&lt;…&gt;</p><p><strong>Christians even after their
    death remain members of the Body of Christ – the Church</strong> (Rom. 14:9; 12:5;
    Eph. 1:10, 4:4 and elsewhere), unless for grievous sins they were cut off from
    it either by the visible judgment of the Church or by the invisible judgment of
    God. “What then is ‘one body?’” (Eph. 4:4). These are the faithful of all places
    in the universe, teaches St John Chrysostom, – those living, those who have lived,
    and those who will live in the future. Those who pleased God before the coming
    of Christ also make up one body. Why? Because they also knew Christ (cf. John
    8:56, 5:46). Between the living members of the Church and the departed, by reason
    of the unceasing love (1 Cor. 13:8), mutual communion does not cease, expressed
    in prayers for the dead. Until the time of the coming of the universal judgment
    the living faithful entreat God for the forgiveness of the sins of their imperfect
    fellow-members and for their deliverance from the torments of hell.</p></blockquote><p>(The
    Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: NmXgEba8_До_всеобщего_суда_участь_умерших_может_быть_изменена
  path: The-lot-of-the-departed-can-be-changed
  title: Before the universal judgment the lot of the departed can be changed
  menu:
    parent: The heavenly Church/Prayers for the departed
    title: Before the universal judgment the lot of the departed can be changed
    priority: 4
  body: "<h2>4th century</h2><h3>St John Chrysostom, archbishop of Constantinople
    (c. 347–407)</h3><blockquote><p><em>If </em><strong><em>he has departed</em></strong><em>
    even as a sinner, we must for this very reason rejoice, because his sins have
    been cut off and his wickedness has ceased to grow; and moreover, </em><strong><em>we
    must help him as far as possible, not with tears, but with prayers, supplications,
    alms and oblations</em></strong><em>. For not without cause was this devised,
    </em><strong><em>not in vain do we make memorial of the departed in the divine
    Mysteries</em></strong><em> and </em><strong><em>draw near with prayer on their
    behalf to the Lamb that lies before us</em></strong><em>, who takes away the sin
    of the world, but in order that </em><strong><em>some comfort may come to them
    from this</em></strong><em>; and not in general does he that stands by the altar,
    when the awesome Mysteries are being celebrated, </em><strong><em>exclaim: “For
    all those who have fallen asleep in Christ, and for those who make their memorials”</em></strong><em>.
    For if their memorials were not for them, this would not be said. For our ministry
    is not a spectacle, – God forbid, – but this takes place by the command of the
    Spirit. </em><strong><em>Let us help them and make memorial of them</em></strong><em>.
    If the sons of Job were purified by the sacrifice of their father, do you doubt
    that some comfort comes to the departed when we make oblations on their behalf?
    God is accustomed to have thanksgiving offered by some for others; Paul also pointed
    this out, saying: “that by the intercession of many, thanks may be given by many
    for us for the gift bestowed upon us” (2 Cor. 1:11). </em><strong><em>Let us not
    grow weary of helping the departed and of offering perfect prayers on their behalf</em></strong><em>.
    For there lies before us the universal purification of the universe. Therefore
    let us boldly pray then for the universe and call them together with the martyrs,
    the confessors, the priests, for we are all one body, though some members are
    more excellent than others, and it is possible in every way </em><strong><em>to
    bring down upon them forbearance – through the prayers, through the gifts</em></strong><em>
    offered for them, through those who are called together with them. Why then do
    you grieve, why do you weep, when it is possible to bring down such forbearance
    upon the departed?</em></p><p><em>&lt;…&gt;</em></p><p><em>Shall we not strive
    to rescue him from dangers? It is possible, </em><strong><em><mark>it is possible</mark></em></strong><em>,
    if only we wish, </em><strong><em><mark>to lighten his punishment</mark></em></strong><em>.</em></p><p><strong><em>Let
    us make constant prayers for him</em></strong><em>, </em><strong><em>let us give
    alms</em></strong><em> – and even if he were unworthy, God will be merciful through
    us. If Paul spared and showed mercy to one for the sake of others, then all the
    more must we do this. Whether from his money, or from your own, from whatever
    you will, but help, pour out oil – or rather, water.</em></p><p><em>&lt;…&gt;</em></p><p><em>set
    up widows, proclaim the name, command all to </em><strong><em><mark>offer prayers
    and supplications on his behalf; this will propitiate God</mark></em></strong><em>.
    Though it was not done by themselves, another has become the author of almsgiving
    for his sake, and that too is a work of divine philanthropy.</em></p><p><em>&lt;…&gt;</em></p><p><em>Knowing
    this, let us consider what consolations we might bring to the departed: instead
    of tears, instead of lamentations, instead of memorial meals – </em><strong><em>alms</em></strong><em>,
    </em><strong><em>prayers</em></strong><em>, </em><strong><em>oblations</em></strong><em>,
    </em><strong><em><mark>that both they and we may attain the promised blessings</mark></em></strong><em>,
    by the grace and philanthropy of the Only-begotten Son</em></p></blockquote><p>(Homily
    45. That we should not labour excessively over the mourning of the dead)</p><h2>11th
    century</h2><h3>Blessed Theophylact of Bulgaria, archbishop of Ohrid (2nd half
    of the 11th c. – early 12th c.)</h3><blockquote><p>But one must fear Him who punishes
    not only the body, but subjects the soul, an immortal being, to endless torments,
    and that in fire. Thus Christ teaches His friends spiritual courage, makes them
    witnesses, and drives human fear away from them. Men, He says, extend their malice
    only to the corruptible body, and the end of their wiles against us is the death
    of the flesh. But when God punishes, He does not stop at the flesh alone, but
    the very unhappy soul is subjected to torments. Mark from this that death brings
    sinners to punishment: they are punished here, being slain, and there are cast
    into gehenna. – Examining this saying, you will understand something else as well.
    See, <strong>the Lord did not say: fear him “<em>who</em>” after killing “<em>casts</em>”
    into gehenna, but: <em>“who is able”</em> to cast. For sinners who die are not
    necessarily cast into gehenna, but it lies in the power of God both to forgive,
    for example, for the sake of those oblations and almsgivings which are made for
    the departed and which bring no small benefit even to those who die in grievous
    sins</strong>. Thus God does not unconditionally cast into gehenna after killing,
    but has the power to cast.</p></blockquote><p>(Commentary on the Gospel according
    to Luke, 12)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“For
    for this cause was the gospel preached also to them that are dead, that they might
    be judged according to men in the flesh, but live according to God in the spirit”
    (1 Pet. 4:6; cf. 1 Pet. 3:19–20). “When the Lord visited those in hades”, remarks
    <strong>Blessed Theophylact</strong>, – “some, who had lived in this world according
    to the flesh, were condemned, while others, who had lived spiritually, either
    rose together with the Lord, for many bodies of the saints that slept arose (Matt.
    27:52), or came to life with good hope”. If the lot of the departed were unchangeable
    until the universal judgment, the Lord would not have preached the gospel to them.
    “Whosoever shall speak a word against the Son of Man (seeing His humiliation),
    it shall be forgiven him (for this is a sin of error, of weakness, washed away
    by repentance); but whosoever speaketh against the Holy Spirit, it shall not be
    forgiven him, neither in this world, neither in the world to come” (Matt. 12:32).
    “This He said, because they said: He hath an unclean spirit” (Mark 3:30). “What
    then do these words mean? This”, explains <strong>St John Chrysostom</strong>,
    – “that the sin against the Holy Spirit is above all unforgivable. Why? Because
    they did not know who Christ was; but they had already received sufficient knowledge
    about the Spirit. Thus the prophets spoke, speaking by the inspiration of the
    Spirit, and in the Old Testament all had a very clear concept of Him. Therefore
    the words of Christ have such a meaning: let you be offended at Me because of
    the flesh in which I am clothed; but can you say also of the Spirit that you do
    not know Him? That is why your blasphemy will be unforgivable, and here and there
    you will bear punishment for it... The Holy Spirit is known to you, yet you are
    not ashamed to reject the evident truth. If you say that you do not know Me, then
    you doubtless know that casting out devils and performing healings is the work
    of the Holy Spirit. Therefore you blaspheme not Me only, but the Holy Spirit also;
    therefore your punishment, both here and there, is inevitable”. The expression
    “neither in the world to come” points to the possibility of the forgiveness of
    sins in the world beyond the grave, and consequently to the change of the lot
    of the departed. It would have no meaning to say “neither in the world to come”
    if after death there were no forgiveness.</p></blockquote><p>(The Orthodox Church
    and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
