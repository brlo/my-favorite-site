    Onesiphorus, so he wishes him to receive the same from God. If Onesiphorus, who
    exposed himself to dangers, is saved by deeds of mercy, then all the more we.
    Awesome, truly awesome is the reckoning that awaits us, and much philanthropy
    must we show, lest we hear the awesome words”. (Matt. 7:23, 25:41; Luke 16:26;
    Matt. 22:13).</p></blockquote><p>(The Orthodox Church and the Sectarians, part
    2)</p>"
