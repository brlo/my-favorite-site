    for them, through those who are called together with them. Why then do you grieve,
    why do you weep, when it is possible to bring down such forbearance upon the departed?</em></p><p><em>&lt;…&gt;</em></p><p><em>Shall
    we not strive to rescue him from dangers? It is possible, </em><strong><em>it
    is possible</em></strong><em>, if only we wish, </em><strong><em>to lighten his
    punishment</em></strong><em>.</em></p><p><strong><em>Let us make constant prayers
    for him</em></strong><em>, </em><strong><em>let us give alms</em></strong><em>
    – and even if he were unworthy, God will be merciful through us. If Paul spared
    and showed mercy to one for the sake of others, then all the more must we do this.
    Whether from his money, or from your own, from whatever you will, but help, pour
    out oil – or rather, water.</em></p><p><em>&lt;…&gt;</em></p><p><em>set up widows,
    proclaim the name, command all to </em><strong><em>offer prayers and supplications
    on his behalf; this will propitiate God</em></strong><em>. Though it was not done
    by themselves, another has become the author of almsgiving for his sake, and that
    too is a work of divine philanthropy.</em></p><p><em>&lt;…&gt;</em></p><p><em>Knowing
    this, let us consider what consolations we might bring to the departed: instead
    of tears, instead of lamentations, instead of memorial meals – </em><strong><em>alms</em></strong><em>,
    </em><strong><em>prayers</em></strong><em>, </em><strong><em>oblations</em></strong><em>,
    </em><strong><em>that both they and we may attain the promised blessings</em></strong><em>,
    by the grace and philanthropy of the Only-begotten Son</em></p></blockquote><p>(Homily
    45. That we should not labour excessively over the mourning of the dead)</p><h2>20th
    century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>After
    the departed they broke bread (Jer. 16:7), at their tombs loaves were distributed
    (Tobit 4:17) and prayers were offered for the departed (2 Macc. 12:42–45; Baruch
    3:4–6). “May the Lord grant him (Onesiphorus) mercy. What? Nothing other than
