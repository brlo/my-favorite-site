    title: The Church's teaching on the veneration of saints
    priority: 1
  body: "<h2>8th century</h2><h3>The Seventh Ecumenical Council (787)</h3><blockquote><p>Let
    us then now all do everything with the fear of God, <strong><mark>asking the intercession
    of our undefiled Lady, the all-holy Mother of God and Ever-virgin Mary, of the
    holy angels, and of all the saints</mark></strong>; let us kiss their venerable
    remains, in order to receive from them sanctification. Thus we shall be made ready
    for every good work in Christ Jesus our Lord, to whom belongs glory, might, worship,
    together with the Father and the Holy Spirit, now and ever and unto ages of ages.
    Amen.</p></blockquote><p>(The Seventh Ecumenical Council, Act 6)</p><h2>18th century</h2><h3>Epistle
    of the Patriarchs of the Orthodox Church (1723)</h3><blockquote><p>We confess
    also that <strong>the saints intercede for us in prayers and supplications to
    Him (God), and above all the most undefiled Mother of the divine Word; likewise
    our holy guardian angels, the apostles, prophets, martyrs, righteous men, and
    all whom He has glorified as His faithful servants..</strong>. We confess also
    that <strong><mark>the saints are mediators and intercessors for us before God
    not only here, while they abide with us, but still more after their death</mark></strong>,
    when they, the mirror of reflections having been done away (of which the apostle
    speaks), behold the Most Holy Trinity and Her boundless light in all its clarity.
    For just as we do not doubt that the prophets, while still in their mortal body,
    beheld heavenly things, and therefore foretold the future, so likewise we not
    only do not doubt, but also <strong>unshakeably believe and confess that the angels
    and the saints, who have become as it were angels, behold our needs in the boundless
    light of God.</strong></p></blockquote><p>(Epistle of the Patriarchs of the Eastern-Catholic
    Church on the Orthodox faith)</p><blockquote><p>…since there are Saints, and the
    Catholic Church <strong>acknowledges them as intercessors for us, therefore we
    venerate them as the friends of God, who pray for us before God of all</strong>.
    But our veneration of the Saints is of two kinds: <strong><mark>one pertains to
    the Mother of the Word of God, whom we venerate more highly than a servant of
    God, since the Mother of God, while truly a servant of the One God, is also the
    Mother who gave fleshly birth to the One of the Trinity</mark></strong>. Therefore
    we magnify her above compare more highly than all the Angels and Saints, and render
    to her worship greater than is fitting for a servant of God. <strong><mark>The
    other kind of worship, fitting for the servants of God, pertains to the Holy Angels,
    the Apostles, the Prophets, the Martyrs, and in general to all the Saints.</mark></strong>
    Over and above this we honour with worship the wood of the precious and life-giving
    Cross, on which our Saviour suffered for the salvation of the world, the image
    of the life-giving Cross, the Bethlehem manger through which we were delivered
    from unreason, the place of Golgotha, the life-bearing Tomb and the other holy
    places, likewise the Holy Gospel, the sacred vessels in which the bloodless Sacrifice
    is performed, <strong>we honour and glorify the Saints with their annual commemorations,
    with national festivals, with the building of holy temples and with oblations.</strong></p></blockquote><p>(Epistle
    of the Patriarchs of the Eastern-Catholic Church on the Orthodox faith)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
