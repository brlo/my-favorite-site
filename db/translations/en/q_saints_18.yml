  title: The greatness of the saints
  menu:
    parent: The heavenly Church/Veneration of the saints
    title: The greatness of the saints
    priority: 2
  body: "<h2>4th century</h2><h3>Ephrem the Syrian, monk (c. 306–373)</h3><blockquote><p><strong>O
    faithful Basil, who pleased God as Abel, who was saved as Noah, who was named
    the friend of God as Abraham, who was offered to God in sacrifice as Isaac, who
    manfully endured temptation as Jacob, who was gloriously magnified as Joseph,
    who drowned the new pharaoh and clove the sea of passions with the rod of the
    cross! </strong>As Moses, consecrated high priest of the Lord; as Aaron, who put
    enemies to flight; as Jesus the son of Nun, who was zealous and found worthy of
    grace; as Phineas, cleansed by the spiritual fire; as Isaiah! Thou didst behold
    Him Who sits upon the Cherubim, as Ezekiel; thou didst stop the mouths of lions,
    as Daniel; <strong><mark>thou didst nobly tread down the flame of the adversaries</mark></strong>,
    as the three youths; <strong><mark>thou didst preach as Peter, teach as Paul,</mark></strong>
    confess the God who suffered, as Thomas, <strong><mark>theologize as Matthew and
    Mark and Luke and John, instruct the lawless, turn the impious, please God, as
    the apostles.</mark> Pray for me, utterly wretched, and by thy prayers give life
    to me, father; thou, courageous – me, infirm; thou, zealous – me, slothful; thou,
    diligent – me, careless; thou, wise – me, foolish; thou, who hast gathered for
    thyself the treasure of virtues – me, who have not a single merit.</strong> For
    thee the Father of mercies has magnified, thee the Son of God has blessed, <strong><mark>thee
    the Holy Spirit has renewed as a holy temple. </mark></strong>To Him belongs glory,
    might, majesty unto all ages!</p></blockquote><p>(Encomium on our holy father
    Basil the Great)</p><h3>St Gregory of Nyssa, bishop (c. 331–394)</h3><blockquote><p>If
    in this discourse we have attained anything worthy of thee, we acknowledge thy
    cooperation as the author of this success and thank thee; and if our praises fall
    below thy dignity, in this failure also we acknowledge thee its author, though
    the words be somewhat bold. For <strong>thou, desiring to avoid praises, both
    didst do so during thy life and after death, in thy love of humility didst hinder
    those who wished to glorify thee.</strong> But be it as it may, this or the other,
    as far as was possible we have fulfilled our holy duty, and we believe that thou
    wilt not turn away from us, the ardent venerators of our father, but wilt accept
    our praises as the childish prattle dear to a father. <strong><mark>Do thou, standing
    before the divine altar and together with the Angels serving the life-creating
    and all-holy Trinity, remember all of us, asking forgiveness of our sins and the
    obtaining of the eternal kingdom, in Christ Jesus our Lord, to whom belongs glory
    with the beginningless Father and the divine and life-creating Spirit, now and
    ever and unto ages of ages. Amen.</mark></strong></p></blockquote><p>(Encomium
    on our venerable father Ephrem)</p><blockquote><p>For where are we to conceive
    the place of rest of his soul? <strong><mark>Evidently in the heavenly mansions,
    where are the ranks of Angels, where are the choirs of Prophets, where are the
    thrones of Apostles, where is the joy of martyrs, the gladness of venerable fathers,
    where is the brightness of teachers, where is the triumph of the first-born and
    the pure choirs keeping festival there. </mark>Into these blessed mansions, whither
    even the Angels long to enter, into this sacred land has the much-blessed and
    holy soul of our blessed and most glorious father Ephrem made her dwelling.</strong>
    I think that at the ascent of his soul to heaven all the virtues of his life accompanied
    her, and each of them showed her those unspeakable and invisible beauties; and
    perhaps love, the highest of all the virtues, coming up to her, said: “behold,
    beloved soul, how beautiful is what I have prepared for thee” – and with these
    words pointed out to her the objects of delight; then humility, running up to
    her, said: “behold, O soul beloved of God, what place of rest I have prepared
    for thee,” and so all the other virtues in turn spoke to her and showed her those
    rewards which for love and the labours endured for them on earth they had at last
    procured for her.</p></blockquote><p>(Encomium on our venerable father Ephrem)</p><h3>St
    John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><blockquote><p>For
    example, robbers and grave-plunderers and deceivers endure blows, but the martyrs
    endure the same; <strong>the deeds are alike, but the disposition of spirit and
    the cause for which they happen are not alike, and therefore there is a great
    difference between the martyrs and those men</strong>. And as in this case we
    pay attention not to the tortures alone, but even before that to the disposition
    of the soul and to the cause for which the tortures are undergone, <strong><mark>therefore
    we love the martyrs not because they suffer, but because they suffer for Christ</mark></strong>,
    and we despise the robbers not because they are punished, but because they are
    punished for their crimes (…)</p></blockquote><p>(Against the Jews, Homily 4)</p><h3>St
    Gregory the Theologian, archbishop of Constantinople (c. 325–389)</h3><blockquote><p>Although
    many things guide us to the better life and instruct us in virtue – and reason,
    and the law, and the prophets, and the apostles, and the very sufferings of Christ,
    that first Martyr, who mounted the cross and raised me up with Himself, to nail
    my sin, to triumph over the serpent, to sanctify the wood, to overcome voluptuousness,
    to save Adam and restore the fallen image; yet with such many and such surpassing
    teachers <strong><mark>the martyrs are no less instructive for us – these rational
    burnt-offerings, perfect sacrifices, acceptable offerings; this preaching of the
    truth, the refutation of falsehood, the fulfilment of the spiritually understood
    law, the overthrow of error, the persecution of vice, the drowning of sin, the
    purification of the world.</mark></strong></p></blockquote><p>(Symphony of the
    works of St Gregory the Theologian)</p><blockquote><p>(Look upon the contests)
    of the great strugglers – John, Peter, Paul, James, Stephen, Luke, Andrew, Thecla,
    and the rest who suffered for the truth after and before them! They willingly
    contended with fire, with the sword, with beasts and with tormentors, went to
    present and threatened calamities as though in other bodies or as bodiless. And
    for what was all this? – That they might not change piety even by a word. <strong><mark>They
    are glorified with great honours and festivals; they cast out demons, heal sicknesses,
    appear, foretell; their very bodies, when one touches them and honours them, work
    as much as their holy souls; even the drops of blood and everything that bears
    the traces of their sufferings is as effectual as their bodies.</mark></strong></p></blockquote><p>(Symphony
    of the works of St Gregory the Theologian)</p><h3>Blessed Augustine of Hippo (354–430)</h3><blockquote><p><strong><em><mark>Blessed
    are you all, free from sorrow and full of joy, O saints of God, who have already
    crossed this dead sea and have been found worthy to enter the haven of eternal
    rest, safety and quietness! </mark>We beseech you by your love, be careful for
    us.</em></strong><em> In the same way we pray you, Him whose beauty you already
    enjoy, from whose immortality you have become immortal, in whose most blessed
    vision you rejoice always; </em><strong><em>remember us always, help us miserable
    ones, who are still tossed on the sea of this life by the storms that surround
    us on every side.</em></strong></p><p><strong><mark>You, beautiful gates, ascended
    to the great height!</mark> </strong>Help us who lie full low; <strong>stretch
    out your hands and raise up those who lie, that, healed of our infirmity, we may
    be made strong for the struggle. Defend us and pray without ceasing for us, poor
    and careless sinners. </strong>We are driven over the sea of life, great and broad,
    where are creeping things without number, where are small creatures with great,
    where is the fiercest dragon, always ready to swallow us, where are dangerous
    places, the abyss and the deep, in which those waver in the faith and perish.</p><p><strong>Pray
    to the Lord, pray, all the multitude of saints and the innumerable choirs of the
    blessed, that by the help of your prayers, with the ship unbroken and the goods
    whole, we may be found worthy to enter the haven of eternal salvation, rest and
    continual peace.</strong></p></blockquote><p>(Prayers and spiritual meditations,
    chapter 24)</p><blockquote><p><em>Holy and undefiled </em><strong><em>Virgin,
    the Mother of God Mary, Mother of our Lord Jesus Christ!</em></strong><em> </em><strong><em><mark>Vouchsafe
    to intercede for me before Him whose temple thou hast been counted worthy to be.</mark></em></strong></p><p>Holy
    Michael, holy Gabriel, holy Raphael, holy choirs of angels and archangels, patriarchs
    and prophets, apostles, evangelists, martyrs, confessors, priests, levites, monks,
    virgins and all the righteous, <strong><mark>you I make bold to entreat: pray
    to God for me a sinner, that I may be delivered from the jaws of the devil and
    from eternal death.</mark></strong> Vouchsafe, O Lord, to grant me eternal life
    according to Thy mercy.</p></blockquote><p>(Prayers and spiritual meditations,
    chapter 39)</p>"
