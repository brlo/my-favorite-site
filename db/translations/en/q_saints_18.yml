  body: '<h2>1st century</h2><h3>St Ignatius the God-bearer, bishop of Antioch, hieromartyr
    (c. 35–107)</h3><blockquote><p>“Ye must be on your guard against them, inasmuch
    as they are men who can scarcely be cured. There is one Physician who is possessed
    both of flesh and spirit; both <strong><mark>made</mark></strong> and not made;
    God existing in flesh; true life in death; <strong><mark>both of Mary and of God</mark></strong>;
    first possible and then impossible, even Jesus Christ our Lord. “Where is the
    wise man? where the disputer?” Where is the boasting of those who are styled prudent?
    For <strong><mark>our God, Jesus Christ, was, according to the appointment of
    God, conceived in the womb by Mary</mark></strong>, of the seed of David, but
    <strong><mark>by the Holy Ghost</mark></strong>. Now <strong><mark>the virginity
    of Mary</mark></strong> was hidden from the prince of this world, as was also
    her offspring, and the death of the Lord; three mysteries of renown”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/IgnAn_Eph#HH-21">To the Ephesians</a>)</p><h2>2nd
    century</h2><h3>St Justin the Philosopher, martyr (c. 100–165)</h3><blockquote><p>“we
    <strong>know Him to be the first-begotten of God</strong>, and to be before all
    creatures; likewise to be the Son of the patriarchs, since <strong><mark>He assumed
    flesh by the Virgin</mark></strong> of their family, and submitted to become a
    man”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho#HH-100">Dialogue
    with Trypho, 100</a>)</p><h3>St Irenaeus of Lyons, hieromartyr (c. 130–202)</h3><blockquote><p>God,
    then, <strong><mark>was made man</mark></strong>, and the Lord Himself did save
    us, giving us the token of <strong><mark>the Virgin</mark></strong> &lt;...&gt;
    so did He who is the Word, recapitulating Adam in Himself, rightly receive a birth,
    enabling Him to gather up Adam, <strong><mark>from Mary, who was as yet a virgin</mark></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b3#HH-21">Against
    Heresies, Book III, ch. 21</a>)</p><h3>Methodius of Olympus, bishop of Patara,
    hieromartyr (c. 260–312)</h3><blockquote><p>Truly fearsome is the mystery accomplished
    in thee, <strong><mark>O Mother-Virgin, spiritual throne, most glorified and worthy
    of God</mark></strong>. Thou hast shown an astonishing wonder to things in heaven
    and on earth.</p><p>&lt;…&gt; For if such honour from God was rendered to the
    image of thy holiness, that none except the priests could approach or have access
    to the contemplation of it, since the veil separated and guarded the entrance
    there as to a queen; then what and <strong>how great veneration from us most humble
    men must there be for <mark>Thee, the true Queen</mark>, the true living Ark of
    the Lawgiver God, who hast become in truth <mark>the spacious heaven of the uncontainable
    God</mark></strong>? For when Thou, <strong>Most Holy</strong>, didst appear to
    the world like a light-bearing day, and didst reveal the Sun of righteousness,
    then the fearful darkness was scattered, the power of the tyrant was destroyed,
    death was demolished, hades was overthrown, and all enmity vanished before peace,
    and the destructive diseases withdrew from the salvation that appeared, and the
    whole universe was filled with the light of the pure truth.</p><p>&lt;…&gt; And
    so receive, most gracious one, the precious gifts that are fitting for thee alone,
    <strong>highest of all generations and more honourable than all visible and invisible
    creation</strong>.</p><p>&lt;…&gt; Having received the command to build the ark
    according to image and likeness, he carefully fulfilled the command, although
    something grievous had happened before his descent (Exod. 32:1); he built it in
    the dimensions of five and a half cubits, and covering it with Cherubim made it
    the receptacle of the law, very clearly prefiguring thee, <strong><mark>O Mother
    of God</mark>, who conceived without corruption and ineffably brought forth the
    incorrupt fruit</strong></p><p>&lt;...&gt; Blessed art thou, all-blessed and all-desired.
    With blessings of the Lord is filled thy name most rich in grace, <strong><mark>O
    Birth-giver of God</mark></strong> and enlightener of the faithful. Thou dost
    embrace, so to speak, the Uncontainable; thou art the root of the most beautiful
    flower (Isa. 11:1), <strong><mark>the mother of the Creator, the nurse of Him
    who feeds, who dost contain the Almighty</mark></strong></p><p>&lt;…&gt; Thou
    hast shone forth, O desired parent of the (spiritual) Light of the Sun, with the
    unapproachable rays of ardent love, <strong><mark>having given birth in the end
    (of times) to the One born from the beginning</mark></strong>, revealing the hidden
    and unspeakable mystery, <strong><mark>the Son of the invisible Father</mark></strong>,
    the giver of peace, who marvelously humbled Himself more than every humiliation.
    Therefore <strong>we beseech thee</strong>, most excellent of all, honoured with
    maternal privileges and boldness, to remember without ceasing, <strong><mark>O
    all-holy Mother of God</mark></strong>, us who boast in thee and with godly doxologies
    <strong>venerate thy ever-living and unfading memory</strong>.</p></blockquote><p>(Discourse
    on Simeon and Anna. On the day of the Meeting of the Lord) (Spuria)</p><h2>3rd
    century</h2><h3>Tertullian (c. 155–220)</h3><p>God was born in the virgin Mary
    as a man — this is what the Orthodox understand by the word “Mother of God”:</p><blockquote><p>For
    <strong><mark>the Virgin</mark>, without doubt, conceived of the Holy Spirit,
    and <mark>that which she conceived, she brought forth</mark></strong>. Consequently,
    that had to be born which was conceived and was to be brought forth; that is to
    say, the Spirit, whose “name should be called Emmanuel which, being interpreted,
    is, God with us.” (Matt. 1:23) Besides, the flesh is not God, so that it could
    not have been said concerning it, “That Holy Thing shall be called the Son of
    God.” But <strong><mark>that Divine Being who was born in it is God</mark></strong></p><p>&lt;…&gt;</p><p>Therefore,
    the Word in flesh. Then this also must be examined, in what manner <strong>the
    Word became flesh: whether it was as if transfigured into flesh, or clothed Himself
    in it? Certainly He clothed Himself</strong>, for we must needs believe God to
    be unchangeable and not to change His form, as being eternal. But transfiguration
    is the destruction of that which previously existed, for whatsoever is transfigured
    into some other thing ceases to be that which it had been, and begins to be that
    which it previously was not. However, <strong>God does not cease to be [God]</strong>
    and cannot become any other thing.</p><p>&lt;…&gt;</p><p>But we find that He is
    expressly set forth as both God and Man, as the very psalm also confirms: For
    <strong><mark>God was born in her as a man</mark></strong> and established her
    by the will of the Father (Ps. 86:5). It is clear that He is in all respects the
    Son of God and the Son of Man, since without doubt He is God and Man according
    to His two substances, which differ according to their own especial properties,
    inasmuch as the Word is nothing else but God, and the flesh nothing else but Man.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-against-praxeas#HH-The-Force-of-Sundry-Passages-of-Scripture-Illustrated-in-Relation-to-the-Plurality-of-Persons-and-Unity-of-Substance-There-is-No-Polytheism-Here-Since-the-Unity-is-Insisted-on-as-a-Remedy-Against-Polytheism">Against
    Praxeas, 12</a>)</p><h3>Peter of Alexandria, hieromartyr (2nd c.–311)</h3><blockquote><p>Therefore,
    of the holy Prophets and of all who, as I have said, lived piously and righteously
    in the law of the Lord, and who together with all the people celebrated the Passover
    according to the statute and with reverence, the Master of all visible and invisible
    creation, <strong><mark>the Only-begotten Son and Word</mark>, consubstantial
    with the Father and the Holy Spirit in divinity</strong>, our Lord and God, Jesus
    Christ, in the fulness of time, <strong><mark>born in the flesh of our Holy Glorious
    Lady the Mother of God and Ever-virgin and truly Mother of God Mary</mark></strong>,
    visible on earth and consubstantial with men in human nature, truly abiding as
    a man, He Himself with the people in the years before His preaching lawfully and
    reverently celebrated the Passover and ate according to the statute the lamb.
    For He came not to abolish the Law or (to abolish the teaching) of the Prophets,
    but to fulfil them, as the Saviour Himself said in the Gospel (cf. Matt. 5:17).</p></blockquote><p>(On
    the Divinity)</p><h2>4th century</h2><h3>St Athanasius the Great, bishop of Alexandria
    (c. 295–373)</h3><blockquote><p>And <strong><mark>the visible body was not the
    body of a man, but of God</mark></strong>; in this body, even when crucified,
    He raised the dead. Therefore this bold thought of theirs is not good, that the
    Word of God was upon some holy man (as it was in each of the Prophets and other
    saints); let that thought also be rejected, that the Word is born each time and
    then dies. Of the Lord we must not think thus; God forbid! On the contrary, “once
    in the end of the ages, to put away sin” (Heb. 9:26), the Word became flesh<strong>,
    and <mark>from Mary the Virgin there came forth a man after our likeness</mark></strong>,
    as the Lord said to the Jews: “yet ye seek to kill Me, a man that hath told you
    the truth” (John 8:40)? And we are made divine, not by partaking of the body of
    some man, but by receiving the body of the Word Himself.</p><p>3) I marvelled
    also at this, how they dared even to think that the Word became man by the natural
    order. If it were so, then vainly would the memory of Mary be honoured. Nature
    knows no virgin who gives birth without a husband. Therefore He, <strong>the <mark>true
    God</mark> and the Word of the Father by nature and the Wisdom of the Father,
    by the good will of the Father <mark>became man bodily</mark></strong> for our
    salvation, that He might have something to offer for us and save us all</p></blockquote><p>(Letter
    to Maximus the Philosopher)</p><h3>Ephrem the Syrian, monk (c. 306–372)</h3><blockquote><p><strong><mark>It
    was not a man who required the Virgin for childbearing, but God</mark></strong>.
    Therefore He communicated to the nature what it did not have, in order to show
    that He came not to harm the nature, but to keep it unharmed. The One being born
    was a pearl; therefore, being born, He came forth without sicknesses and pangs.
    He was not coarse like anything earthly, nor fluid like anything moist; <strong><mark>He
    was the Infant in whom, under the simple nature, the perfect God was hidden</mark></strong>.
    Therefore the <strong>Virgin</strong>, by the power of Him Who abode in her, gave
    birth naturally, but <strong>endured nothing. The seal of virginity was not broken
    either by the conception of Christ or by the birth</strong>.</p></blockquote><p>(Works,
    42, a discourse against heretics)</p><h3>St Gregory the Theologian, archbishop
    of Constantinople (c. 325–389)</h3><blockquote><p>…that by One and the Same Person,
    Who was perfect Man and also God, the entire humanity fallen through sin might
    be created anew. If <strong><mark>anyone does not believe that Holy Mary is the
    Mother of God, he is severed from the Godhead</mark></strong>. If anyone should
    assert that He passed through the Virgin as through a channel, and was not at
    once divinely and humanly formed in her (divinely, because without the intervention
    of a man; humanly, because in accordance with the laws of gestation), he is in
    like manner godless. If any assert that the Manhood was formed and afterward was
    clothed with the Godhead, he too is to be condemned. For this were not a Generation
    of God, but a shirking of generation. If any introduce the notion of Two Sons,
    one of God the Father, the other of the Mother, and discredits the Unity and Identity,
    may he lose his part in the adoption promised to those who believe aright. For
    God and Man are two natures, as also soul and body are; but there are not two
    Sons or two Gods.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-letters#HH-To-Cledonius-the-Priest-Against-Apollinarius">Letter
    to Cledonius the priest, against Apollinarius (Ep. 101)</a>)</p><blockquote><p>Receive
    then to communion those who think and teach thus, as I also do; but those who
    are otherwise minded refuse, and hold them as strangers to God and the Catholic
    Church. And since a question has also been mooted concerning the Divine Assumption
    of humanity, or Incarnation, state this also clearly to all concerning me, that
    I join in One <strong><mark>the Son, who was begotten of the Father, and afterward
    of the Virgin Mary</mark></strong>, and that I do not call Him two Sons, but worship
    Him as One and the same in undivided Godhead and honour. But if anyone does not
    assent to this statement, either now or hereafter, he shall give account to God
    at the day of judgment.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/gregory_naz-select-letters#HH-Against-Apollinarius-The-Second-Letter-to-Cledonius">Select
    Letters, To Cledonius the priest, against Apollinarius (Ep. 102)</a>)</p><h2>5th
    century</h2><h3>St Cyril of Alexandria, archbishop (376–444)</h3><blockquote><p>Deceivers
    and seducers of the hearts of hearers are those who affirm that God the Word,
    having accepted (the flesh) of a man, passed through the Holy Virgin, and that
    this man was created by God the Word Himself. Such men do not understand the mystery
    of piety and degrade the price of the dispensation of the Only-begotten. But we,
    brethren, are not so taught. <strong>Him who was born of the Holy Virgin we acknowledge
    as perfect God and perfect man, endowed with a rational soul. <mark>Therefore
    we call the Holy Virgin the Mother of God and say that God the Word essentially
    – not in thought only, but in very truth – dwelt in her, and that He, when He
    was two or three months old, is the Son of God and together the Son of man.</mark></strong></p></blockquote><p>(On
    the incarnation of the Word of God)</p><p>A discourse pronounced in the church
    named in honour of the Mother of God Mary</p><blockquote><p>I see the bright assembly
    of all the saints, hastily gathered together at the <strong>call of the holy <mark>Mother
    of God and ever-virgin Mary</mark></strong>. Therefore, although I was in great
    sorrow, this presence of the holy fathers changed my sorrow into joy. Now is fulfilled
    over us the sweet saying of the psalmist David: behold what is good, or what is
    beautiful, but to dwell together as brethren (Ps. 13:1). Therefore we bless thee,
    holy mystical Trinity, who hast gathered us all <strong>into this temple of <mark>Mary
    the Mother of God</mark>.</strong> <strong>We bless thee, <mark>Mary Mother of
    God</mark>, the precious treasure of the whole world, the inextinguishable lamp,
    the crown of virginity, the sceptre of orthodoxy, the indestructible temple, the
    container of the Uncontainable, mother and virgin</strong>; through thee is called
    blessed in the holy gospels Him who comes in the name of the Lord. <strong>We
    bless thee, thou who didst contain the Uncontainable in thy holy virgin womb;
    through thee the holy Trinity is honoured and glorified, through thee the precious
    cross is honoured and worshipped throughout the universe</strong>, through thee
    heaven rejoices, angels and archangels rejoice, demons are scattered, through
    thee the deceiver devil fell from heaven, through thee the fallen creation is
    raised to heaven, through thee all creation, given over to idolatry, is brought
    to the knowledge of the truth, through thee holy baptism is communicated to the
    faithful, through thee the oil of gladness, through thee throughout the whole
    universe the Churches are established, through thee the nations are brought to
    repentance. But why say much? <strong>Through thee shone forth the Only-begotten
    Son of God</strong>, the light of those sitting in darkness and the shadow of
    death, through thee the prophets prophesied, through thee the apostles preached
    salvation to the nations, through thee the dead rise, through thee kings reign,
    by the power of the holy Trinity. But <strong>who of men could worthily praise
    the most praiseworthy Mary?</strong> The virgin womb. A marvellous thing! This
    wonder fills me with astonishment. Who has ever heard that the builder who created
    his own house is forbidden to dwell in it? Who is subject to reproach for that
    <strong>he raised his own handmaid to the dignity of mother</strong>?</p><p>&lt;…&gt;</p><p>As
    for ourselves, let us reverently honour and humbly confess the union (that is,
    between the divinity and humanity in Christ), obey the most beloved emperor, submit
    to authorities and powers, and with fear and trembling honour and glorify the
    undivided Trinity, <strong>celebrating also the ever-virgin Mary, the holy temple
    (of the Godhead) and her Son</strong> and the undefiled bridegroom: for to Him
    is glory unto ages of ages.</p></blockquote><p>(Discourse against Nestorius pronounced
    after seven bishops joined the Holy Mary)</p><h2>6th century</h2><h3>Blessed John
    Moschus of Jerusalem (c. 550–619)</h3><p>In these narratives, what is above all
    important for the article is the witness of the faith of the Christians of that
    ancient time.</p><blockquote><p><em>The brother, having received great benefit
    from these instructions, exclaimed: “Father, in my country I am in communion with
    the Nestorians (who did not allow the Virgin Mary to be called Mother of God,
    since they did not acknowledge Jesus Christ as God — tr.). If it were not for
    this – I would remain </em>with thee for ever”! Having heard the name of Nestorius,
    the elder grieved deeply over the perdition of the brother and began to persuade
    him and entreat him to leave this pernicious heresy and join himself to the holy
    catholic and apostolic Church.</p><p>– It is impossible to be saved if thou dost
    not think rightly and believe that <strong><em><mark>the Most Holy Virgin Mary
    is the true Mother of God</mark></em></strong><em>.</em></p><p><em>&lt;</em>…&gt;
    “This place is prepared for the heretics, and for those who impiously teach concerning
    <strong><mark>the Most Holy Mother of God</mark></strong>, and likewise for those
    who follow their teaching. If this place pleases thee, remain in thy teaching.
    But if thou dost not wish to taste such a punishment, turn to the holy catholic
    Church, to which belonged also the elder who instructed thee.</p></blockquote><p>(The
    Spiritual Meadow. The Lemonaire or “Sinai Patericon” // 26. The life of the brother
    Theophanes and his wondrous vision)</p><blockquote><p>– I belong to the followers
    of Severus and am not in communion with the Church.</p><p>Having heard that he
    did not belong to the holy catholic and apostolic Church, and at the same time
    seeing his fine conduct and virtue, I went with tears to my cell, shut the door
    and, falling on my face before God, prayed for three days with tears: “<strong><mark>Lord
    Christ our God, who didst bow down the heavens by the unspeakable and boundless
    philanthropy and didst come down for our salvation, having been made flesh of
    the Lady the Most Holy Mother of God and Ever-virgin Mary</mark></strong>, reveal
    to me: who truly and rightly believes – we, the children of the Church, or the
    followers of Severus?” On the third day Someone, unseen, said to me: “Go, Theodulus,
    and thou shalt see his faith.” Coming in the morning, I sat opposite him, hoping
    to see something, according to the word that had been spoken to me. I sat for
    about an hour, gazing at him. He stood and sang hymns in the Syrian tongue. And
    behold – God is my witness! – I see, my children, a dove flying above his head,
    darkened as it were with soot in a chimney, ragged and unsightly. Then I understood
    that the black and unsightly dove that appeared to me signifies their faith. This
    is what that truly blessed man told me, pouring out tears and sighing deeply.</p></blockquote><p>(The
    Spiritual Meadow. The Lemonaire or “Sinai Patericon” // 106. The story of abba
    Theodore about a monk who held the heresy of Severus)</p><h2>8th century</h2><h3>St
    John of Damascus, monk (2nd half of the 7th c. – before 754)</h3><blockquote><p><strong><mark>The
    holy Virgin we proclaim to be the Mother of God in the proper sense and in truth.</mark></strong>
    <strong><mark>For, inasmuch as the true God is He who was born of her, so the
    true Mother of God is she who gave birth to the true God incarnate from her; for
    we affirm that God was born of her,</mark></strong> – we affirm, not supposing
    that the divinity of the Word received from her the beginning of its being, but
    that the Word of God Himself, who was begotten timelessly of the Father before
    the ages, and was with the Father and the Spirit without beginning and eternally,
    in the last days for the sake of our salvation took up His abode in her womb and
    without change was made flesh and born of her. <strong>For the holy Virgin did
    not give birth to mere man, but to true God; not naked, but clothed in flesh;
    He did not bring down His body from heaven and pass through her as through a channel,
    but received from her flesh consubstantial with us and gave it hypostatic being
    in Himself [that is, “having received her flesh by His divinity into the unity
    of His divine hypostasis”]. </strong>For if the body had been brought down from
    heaven and not taken from our nature, of like essence with ours, what need would
    there have been of the incarnation? For the incarnation of the Word of God took
    place for this reason, that the very nature which had sinned and fallen and become
    corrupted should triumph over the tyrant who had deceived it, and that thus it
    should be freed from corruption, just as the divine apostle says: since by man
    came death, by man came also the resurrection of the dead (1 Cor. 15:21). If the
    first is true, the second is also true.</p></blockquote><p>(An Exact Exposition
    of the Orthodox Faith. Book 3, chapter 12 (56)</p><blockquote><p>For the Word
    Himself became flesh, having been conceived of the Virgin, but coming forth as
    God with the assumed flesh, since at once it too was deified by Him simultaneously
    with its being brought into being, so that three things took place together: the
    assumption, the being, and the deification of it by the Word. <strong>And thus
    the holy Virgin is thought of and called the Mother of God not only because of
    the nature of the Word, but also because of the deification of the human nature,
    whose conception and being were accomplished together in a marvellous manner:
    the conception, of course, of the Word, and the being of the flesh in the Word
    Himself; since <mark>the very Mother of God in some marvellous manner was the
    means of fashioning the Framer of all things and of bestowing manhood on the God
    and Creator of all, who deifies the nature He assumed, so that He became man,
    </mark>while the union preserved those things that were united just as they were
    united, that is to say, not only the divinity but also the humanity of Christ,
    that which is above us, and that which is like us.</strong></p></blockquote><p>(An
    Exact Exposition of the Orthodox Faith. Book 3, chapter 12 (56)</p><h2>19th century</h2><h3>St
    John of Kronstadt (Sergiev), righteous (1829–1908)</h3><blockquote><p><strong><mark>The
    Mother of God is one flesh and blood, one spirit with the Saviour as His Mother.
    What an immeasurable merit is hers by the grace of God, that she became the Mother
    of God Himself, giving Him her most pure and all-sanctified flesh, </mark></strong>nursing
    Him with milk, carrying Him in her arms, clothing Him, guarding His youth in every
    way, kissing Him many times, caressing Him. Lord! Who shall describe the greatness
    of the Virgin Mother of God? Every tongue fails to praise her worthily; the mind
    itself grows faint to sing of thee, O Mother of God!.. With one thought and a
    simple movement of the heart to call upon her... <strong><mark>She is one with
    God, as are the saints.</mark></strong></p></blockquote><p>(Symphony of the works
    of John of Kronstadt)</p><h3>St Ignatius (Brianchaninov), bishop (1807–1867)</h3><blockquote><p>The
    Mother of God, having conceived and given birth to the God-man, was made higher
    than all holy men and holy angels. According to the explanation of St Gregory
    of Sinai, <strong><mark>the Mother of God was that one rational vessel into which
    God entered with His very essence.</mark></strong> The other holy men, although
    they are made partakers of the divine nature by the action of the Holy Spirit
    in them (2 Pet. 1:4) and are temples of the Trihypostatic God (John 14:23), <strong><mark>yet
    in a manner wholly different from the Mother of God, who alone received into herself
    the Word of God for His incarnation. Such a reception of God into oneself is evidently
    unique, exclusive, without example, inaccessible either to holy men or to holy
    angels, belonging to the Mother of God alone</mark>. As the God-man for the tribe
    of the saved chosen ones replaced Adam and became their forefather, so the Mother
    of God replaced Eve for them, and became their mother. As the God-man is the Heavenly
    King, the King of all men and angels, so the Mother of God is the Queen of heaven,
    the Queen of men and angels.</strong></p></blockquote><p>(Ascetical homilies.
    Chapter 53)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
