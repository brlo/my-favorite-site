- src: kc9ne05i_Святые_иконы_имеют_божественное_происхождение
  path: Holy-icons-have-a-divine-origin
  title: Holy icons have a divine origin
  menu:
    parent: Holy icons
    title: Icons — a divine origin
    priority: 3
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Man,
    with his natural inclination to cling to what is sensual and earthly, always needs
    external reminders (cf. 2 Pet. 1:13, 3:1; Jude 1:5; 1 Cor. 4:17, 15:1; 2 Tim.
    1:6, 2:14; Tit. 3:1) and influences which would draw his thought and feeling from
    earth to heaven, from the animal life to the spiritual life, from the world with
    its goods to God, the Source of truth and good. Hence the need for worship: temples,
    sacred images, rites, prayers, hymns, and so on. The Jewish people likewise needed
    external means for maintaining a religious disposition. <strong>It was <mark>God</mark>
    himself, who gave the commandments of the Decalogue (Exod. 20:1–17), while establishing
    <mark>the tabernacle</mark> with its furnishings, the priesthood and the worship
    (Exod. chs. 25–31, 34:18–26; Lev. chs. 1–8 and elsewhere), <mark>commanded Moses
    to build after the pattern He had shown</mark> (Exod. 25:9, 40), the ark and on
    its mercy seat — <mark>two cherubim</mark>:</strong> “you shall make two cherubim
    of gold; of hammered work you shall make them at the two ends of the mercy seat…
    and there I will meet with you, and I will speak with you from above the mercy
    seat, from between the two cherubim which are on the ark of the Testimony” (Exod.
    25:18–22). The ark of the covenant, with the cherubim upon its mercy seat, <strong>was
    to serve the Jews as an image of the invisible God and to raise their thought
    and feeling to the Prototype</strong> (cf. Num. 10:35–36). <strong>Besides the
    images of the cherubim of gold, God commanded that they be made of thread as well</strong>:
    “you shall make the tabernacle with ten curtains of woven linen and of blue, purple,
    and scarlet thread, and you shall weave cherubim on them with artistic work… And
    you shall make a veil of blue, purple, and scarlet thread, and fine woven linen;
    with an artistic design of cherubim it shall be woven on it” (Exod. 26:1, 31).
    Besides the pattern shown for all the sacred objects, God “filled Bezalel with
    the Spirit (of God), with wisdom, understanding, knowledge and all manner of workmanship”,
    gave him Aholiab as a helper, and appointed that they make the tabernacle, the
    ark, the images, etc. (Exod. 31:1–11). When the tabernacle with all its furnishings
    had been set up, <strong><mark>Moses received the divine command</mark></strong>:
    “take the anointing oil and <strong><mark>anoint the tabernacle</mark> (which
    bore on its curtains and veil icons of cherubim) <mark>and all that is in it</mark>
    (the ark of the Testimony, on which were <mark>icons of the cherubim</mark> and
    other sacred objects)</strong>, and hallow it and all its utensils, and <strong><mark>it
    shall be holy</mark></strong>” (Exod. 40:9; cf. Exod. 30:22–29). After the consecration
    “the cloud covered the tabernacle of meeting, and the glory of the LORD filled
    the tabernacle” (Exod. 40:34), and by this, as equally by the miracles wrought
    through the sacred images (cf. Josh. 3:15–16, 6:19; Num. 21:9; 1 Sam. ch. 5),
    God bore witness that the latter were pleasing to Him and worthy of veneration
    from men, since they did not replace Him for them, but reminded them of Him, awakened
    and sustained in them a feeling of reverence and raised their thought to Him (Num.
    10:35–36; Josh. 6:5–7; 2 Sam. 6:14–21; Ps. 29:9). Since the Jewish people were
    inclined to idolatry, God did not deem them worthy to see images of His appearances
    (cf. Deut. 4:15–19), but appeared only to certain righteous men (Gen. 18:1–2,
    32:30; Num. 12:8; 1 Kings 22:19; Isa. 6:1; Dan. 7:9–13 and elsewhere). A reminder
    of God, besides the ark of the Testimony with its images of cherubim, was “the
    plate of pure gold” with the words “Holiness to the LORD” (Exod. 28:36), <strong>a
    prototype of the crucified <mark>Jesus Christ</mark> — the bronze serpent</strong>
    (Num. 21:9; Wis. 16:7; John 3:14), a prefiguring of the glorification of holy
    men after their redemption (Gal. 3:13, 4:4–5) and of the veneration of their images
    — the names of the sons of Israel engraved on the stones (Exod. 28:9–10).</p><p>The
    Lord Jesus Christ, “being in the form of God… took the form of a servant, being
    made in the likeness of men, and being found in appearance as a man” (Phil. 2:6–7;
    John 1:18, 14:8–9; 1 John 1:1). <strong><mark>After His coming in a visible human
    form, the need to remind men of God by means of the ark and the cherubim has passed
    away</mark></strong>. <strong>As it was shown (cf. Exod. 25:40), so God the Father
    is depicted in the form of an elder (Dan. 7:9); God the Son — in the form of an
    infant (Matt. 2:11), a child (Luke 2:43), a man (Luke 3:23); God the Holy Spirit
    — in the form of a dove (Luke 3:22; Matt. 3:16). The ancient mysterious depiction
    of the Crucified One through the image of the serpent has been replaced by the
    clear and perfect image of the Son of Man crucified on the cross. In place of
    the names of the sons of Israel — the icons of the holy saints of God shown before
    the throne of God (Rev. 4:4; 6:9, 7:9, 14:1–4; cf. Heb. 12:22–23). <mark>“The
    shadow of Peter” was an icon of him</mark>, and the miracles wrought through it
    (Acts 5:15)</strong> spoke to Christians of the God-pleasing and saving nature
    of the sacred images. Thus in the New Testament the hand-made sacred things that
    existed in the Old Testament time were not abolished, but only corrected (Heb.
    9:10), in accordance with what God Himself had shown — the shadow was replaced
    by the truth.</p></blockquote><p>(The Orthodox Church and the Sectarians, part
    2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
