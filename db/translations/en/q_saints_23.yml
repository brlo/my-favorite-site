- src: 8qRuGCE0_Почитание_священных_изображений_каждением
  path: Veneration-of-sacred-images-by-censing
  title: The veneration of sacred images by censing
  menu:
    parent: Holy icons
    title: Veneration of icons by censing
    priority: 4
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>By
    a special commandment God impressed upon men a reverent veneration for hand-made
    sacred things: “they (the Levites) shall not go in to watch the holy things (the
    Most Holy Place with the ark of the Testimony) while they are being covered, lest
    they die” (Num. 4:20); and <strong>He commanded that it be performed before the
    sacred images:</strong></p><p><strong>(a) censing</strong></p><p>“<strong>Make
    an altar to burn incense on… and put it before the veil that is before the ark
    of the Testimony</strong>… where I will meet with you. Aaron shall burn on it
    sweet incense… And the LORD said to Moses: Take sweet spices… and make of them
    an incense, a compound according to the art of the perfumer, salted, pure, and
    holy…; it shall be most holy” (Exod. 30:1, 6–7, 34–36).</p></blockquote><p>(The
    Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: XEUpH2Wj_Почитание_священных_изображений_возжиганием_светильников_и_лампад
  path: Veneration-of-sacred-images-by-lighting-candles-and-lamps
  title: The veneration of sacred images by lighting candles and lamps
  menu:
    parent: Holy icons
    title: Veneration of icons by lighting candles and lamps
    priority: 5
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>By
    a special commandment God impressed upon men a reverent veneration for hand-made
    sacred things: “they (the Levites) shall not go in to watch the holy things (the
    Most Holy Place with the ark of the Testimony) while they are being covered, lest
    they die” (Num. 4:20); and <strong>He commanded that it be performed before the
    sacred images:</strong></p><p>&lt;…&gt;</p><p>“<strong><em>Make a lampstand</em></strong><em>
    of pure gold</em>… and for it — seven lamps” (Exod. 25:31–37). “And you shall
    command the children of Israel that they bring you pure oil of pressed olives
    for the light, <strong>to cause the lamp to burn continually; in the tabernacle
    of meeting, outside the veil which is before the ark of the Testimony</strong>,
    Aaron shall kindle it… before the LORD” (Exod. 27:20–21; cf. Lev. 24:2; 1 Sam.
    3:3 — the “lamp of God”; 1 Kings 7:49; 2 Chron. 4:7, 20).</p></blockquote><p>(The
    Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
