- src: LcYCbw6U_Перед_священными_изображениями_поклонялись
  path: They-bowed-down-before-sacred-images
  title: They bowed down before sacred images
  menu:
    parent: Holy icons
    title: They bowed before icons
    priority: 6
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“<em>Joshua</em>…
    <strong>fell on his face to the earth before the ark of the LORD and lay there
    until evening, he and the elders of Israel</strong>” (Josh. 7:6). Their prayer
    was heard by the Lord. If “the LORD said to Joshua: <strong>Get up! Why do you
    lie thus on your face</strong>?” — then the “Get up” is not because worship before
    the sacred images is displeasing to Me, but because it is necessary to act at
    once: “Get up, sanctify the people, and say…” (v. 13). “<strong>So Moses and Aaron
    went from the presence of the assembly to the door of the tabernacle of meeting
    and fell on their faces</strong> (the curtains of the tabernacle bore icons of
    cherubim), and the glory of the LORD appeared to them” (Num. 20:6). “<strong>Oh
    come, let us worship and bow down; Let us kneel before the LORD</strong>” (Ps.
    95:6), i.e. before the ark of the Testimony (cf. Exod. 27:21; Lev. 16:12–13).
    “<strong>Hezekiah went up to the house of the LORD… and prayed before the LORD</strong>”
    (2 Kings 19:14–15). “Exalt the LORD our God and <strong>worship at His footstool:
    it is holy!</strong>” (Ps. 99:5; cf. Ps. 132:7). The ark is called His footstool
    (2 Sam. 6:2; 2 Kings 19:15; cf. Exod. 25:22).</p></blockquote><p>(The Orthodox
    Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: m3SLJiwd_Почитающих_священные_изображения_Бог_благословлял
  path: God-blessed-those-who-venerated-sacred-images
  title: God blessed those who venerated sacred images
  menu:
    parent: Holy icons
    title: God blessed those who venerated icons
    priority: 7
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“<em>And
    the ark of the LORD remained in the house of Obed-Edom the Gittite three months,
    and </em><strong><em>the LORD blessed Obed-Edom and all his household… because
    of the ark of God</em></strong>” (2 Sam. 6:11–12).</p></blockquote><p>(The Orthodox
    Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
