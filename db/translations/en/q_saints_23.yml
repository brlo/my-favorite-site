  body: '<h2>The Seventh Ecumenical Council (787)</h2><h3>Theodore, patriarch of Jerusalem</h3><p>This
    is the definition of the Council of Jerusalem that had taken place beforehand:</p><blockquote><p>Together
    with them <strong><mark>we venerate and embrace with love the holy and honourable
    icons</mark></strong>, that is, the icons of the Word of God, our Lord and Saviour
    Jesus Christ, incarnate for our sake, who took on the form of a servant. <strong>His
    icon and image represents the image not of His divinity, inseparably united with
    His incorruptible flesh, because the divine nature is invisible and indescribable,
    and has no form, for no man hath seen God at any time; the Only-Begotten Himself
    declared it (John 1:18), but we venerate the image of His human nature, because,
    being God and invisible, He appeared on earth, was seen, walked among men, grew
    weary, and felt hunger and thirst, according to the law of our nature which He
    assumed</strong>. Therefore, <strong><mark>we venerate the image of Christ, that
    is, of the Person who has become visible to men, though not separated from His
    invisible divinity</mark></strong> — God forbid — but united with it from His
    very conception. If He says to the Jews: “Why do you seek to kill Me, a Man who
    has told you the truth” (John 8:40); nevertheless He was not only man, but also
    God; and saying: “I and My Father are one” (John 10:30), He does not deny in Himself
    our nature. <strong>We venerate likewise and show honour to the icon of her who
    ineffably bore Him, His undefiled Mother, the holy Mother of God and our all-immaculate
    Lady.</strong> The icons of the holy <strong>apostles, prophets and valiant martyrs,
    saints and righteous, as friends of God</strong>, are also to be honoured. At
    the same time <strong><mark>we ascribe the honour not to the material and the
    colours, but, at the sight of the image, raise the eyes of our mind to the prototype
    and to him give the honour that is due, knowing by the teaching of Basil the Great
    that the honour rendered to the icon passes to the prototype</mark></strong>.
    And since some obstinately oppose and say that icons should not be venerated because
    they are made by hands, and madly, or rather impiously, call them idols; let them
    know that the cherubim, and the mercy-seat, and the ark, and the table, made by
    the divine Moses at the divine command, were also made by hands, and yet worship
    was rendered to them. The divine Scripture condemns those who worship graven images
    and sacrifice to demons. The sacrifices of the pagans were rejected, while the
    sacrifices of the righteous were accepted. <strong><mark>Therefore, even if the
    honourable icons should be the work of an unskilful brush, they are to be venerated
    for the sake of their prototypes.</mark></strong></p></blockquote><p>(Acts of
    the Seventh Ecumenical Council, copy of the synodal letter of Theodore, patriarch
    of Jerusalem)</p><h3>Basil, bishop of Ancyra</h3><p>Wishing to be united to the
    Church at the Council, he pronounces a confession of the Orthodox faith, among
    whose lines are these on the veneration of relics and icons (this is not a definition
    of the council, but simply the repentance of a former iconoclast with the confession
    of his faith):</p><blockquote><p>rejecting and anathematizing with my whole soul
    and mind the synod which was gathered together out of stubbornness and madness,
    and which styled itself the Seventh Synod, but which by those who think accurately
    was called lawfully and canonically a pseudo-synod, as being contrary to all truth
    and piety, and audaciously and temerariously against the divinely handed down
    ecclesiastical legislation, yea, even impiously having yelped at and scoffed at
    the holy and venerable images, and having ordered these to be taken away out of
    the holy churches of God; over which assembly presided Theodosius with the pseudonym
    of Ephesius, Sisinnius of Perga, with the surname Pastillas, Basilius of Pisidia,
    falsely called “tricaccabus;” with whom the wretched Constantine, the then Patriarch,
    was led (ἐματαιώθη) astray.</p><p>— These things thus I confess and to these I
    assent, and therefore in simplicity of heart and in uprightness of mind, in the
    presence of God, I have made the subjoined anathematisms. <strong>Anathema to
    the calumniators of the Christians, that is to the image breakers.</strong> <strong>Anathema
    to those who apply the words of Holy Scripture which were spoken against idols,
    to the venerable images. Anathema to those who do not salute the holy and venerable
    images. Anathema to those who say that Christians have recourse to the images
    as to gods. Anathema to those who call the sacred images idols. Anathema to those
    who knowingly communicate with those who revile and dishonour the venerable images.</strong>
    Anathema to those who say that another than Christ our Lord hath delivered us
    from idols. Anathema to those who spurn the teachings of the holy Fathers and
    the tradition of the Catholic Church, taking as a pretext and making their own
    the arguments of Arius, Nestorius, Eutyches, and Dioscorus, that unless we were
    evidently taught by the Old and New Testaments, we should not follow the teachings
    of the holy Fathers and of the holy Ecumenical Synods, and the tradition of the
    Catholic Church. <strong>Anathema to those who dare to say that the Catholic Church
    hath at any time sanctioned idols.</strong> <strong>Anathema to those who say
    that the making of images is a diabolical invention and not a tradition of our
    holy Fathers.</strong> This is my confession [of faith] and to these propositions
    I give my assent. And I pronounce this with my whole heart, and soul, and mind.
    And if at any time by the fraud of the devil (which may God forbid!) I voluntarily
    or involuntarily shall be opposed to what I have now professed, may I be anathema
    from the Father, the Son and the Holy Ghost, and from the Catholic Church and
    every hierarchical order a stranger. I will keep myself from every acceptance
    of a bribe and from filthy lucre in accordance with the divine canons of the holy
    Apostles and of the approved Fathers.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-Extracts-from-the-Acts--Session-I">Acts
    of the Seventh Ecumenical Council</a>)</p><h3>Theodosius, bishop of Amorium</h3><p>He
    joins the Church with a confession of faith (this is not a definition of the council,
    but simply the repentance of a former iconoclast with the confession of his faith):</p><blockquote><p>Moreover,
    I am well pleased that there should be images in the churches of the faithful,
    <strong>especially the image of our Lord Jesus Christ and of the holy Mother of
    God</strong>, of every kind of material, both gold and silver and of every colour,
    so that his incarnation may be set forth to all men. Likewise there may be painted
    <strong>the lives of the Saints and Prophets and Martyrs</strong>, so that their
    struggles and agonies may be set forth in brief, for the stirring up and teaching
    of the people, especially of the unlearned. <strong><mark>For if the people go
    forth with lights and incense to meet the “laurata” and images of the Emperors
    when they are sent to cities or rural districts, they honour surely not the tablet
    covered over with wax, but the Emperor himself. How much more is it necessary
    that in the churches of Christ our God, the image of God our Saviour and of his
    spotless Mother and of all the holy</mark></strong> and blessed fathers and ascetics
    should be painted? Even as also St. Basil says: “Writers and painters set forth
    the great deeds of war; the one by word, the other by their pencils; and each
    stirs many to courage.” And again the same author “How much pains have you ever
    taken that you might find one of the Saints who was willing to be your importunate
    intercessor to the Lord?” And Chrysostom says, “<strong>The charity of the Saints
    is not diminished by their death, nor does it come to an end with their exit from
    life, but after their death they are still more powerful than when they were alive</strong>,”
    and many other things without measure. Therefore I ask you, O ye Saints! I call
    out to you. I have sinned against heaven and in your sight. Receive me as God
    received the luxurious man, and the harlot, and the thief. Seek me out, as Christ
    sought out the sheep that was lost, which he carried on his shoulders; so that
    there may be joy in the presence of God and of his angels over my salvation and
    repentance, through your intervention, O all-holy lords! <strong>Let them who
    do not venerate the holy and venerable images be anathema! Anathema to those who
    blaspheme against the honourable and venerable images! To those who dare to attack
    and blaspheme the venerable images and call them idols, anathema! To the calumniators
    of Christianity, that is to say the Iconoclasts, anathema! To those who do not
    diligently teach all the Christ-loving people to venerate and salute the venerable
    and sacred and honourable images of all the Saints who pleased God in their several
    generations, anathema! To those who have a doubtful mind and do not confess with
    their whole hearts that they venerate the sacred images, anathema!</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-Extracts-from-the-Acts--Session-I">Acts
    of the Seventh Ecumenical Council</a>)</p><h3>The Definition of the Seventh Ecumenical
    Council on icon veneration</h3><p>This is the official definition (horos) of the
    council on icon veneration:</p><blockquote><p>We believe…life of the world to
    come. Amen. We detest and anathematize Arius and all the sharers of his absurd
    opinion; also Macedonius and those who following him are well styled “Foes of
    the Spirit” (Pneumatomachi). We confess that our Lady, St. Mary, is properly and
    truly the Mother of God, because she was the Mother after the flesh of One Person
    of the Holy Trinity, to wit, Christ our God, as the Council of Ephesus has already
    defined when it cast out of the Church the impious Nestorius with his colleagues,
    because he taught that there were two Persons [in Christ]. With the Fathers of
    this synod we confess that he who was incarnate of the immaculate Mother of God
    and Ever-Virgin Mary has two natures, recognizing him as perfect God and perfect
    man, as also the Council of Chalcedon hath promulgated, expelling from the divine
    Atrium [αὐλῆς] as blasphemers, Eutyches and Dioscorus; and placing in the same
    category Severus, Peter and a number of others, blaspheming in divers fashions.
    Moreover, with these we anathematize the fables of Origen, Evagrius, and Didymus,
    in accordance with the decision of the Fifth Council held at Constantinople. We
    affirm that in Christ there be two wills and two operations according to the reality
    of each nature, as also the Sixth Synod, held at Constantinople, taught, casting
    out Sergius, Honorius, Cyrus, Pyrrhus, Macarius, and those who agree with them,
    and all those who are unwilling to be reverent. <strong><mark>To make our confession
    short, we keep unchanged all the ecclesiastical traditions handed down to us,
    whether in writing or verbally, one of which is the making of pictorial representations,
    agreeable to the history of the preaching of the Gospel,</mark> a tradition useful
    in many respects, but especially in this, that so the incarnation of the Word
    of God is shown forth as real and not merely phantastic, for these have mutual
    indications and without doubt have also mutual significations.</strong> We, therefore,
    following the royal pathway and the divinely inspired authority of our Holy Fathers
    and the traditions of the Catholic Church (for, as we all know, the Holy Spirit
    indwells her), <strong><mark>define with all certitude and accuracy that just
    as the figure of the precious and life-giving Cross, so also the venerable and
    holy images,</mark></strong> as well in painting and mosaic as of other fit materials,
    should be set forth in the holy churches of God, and on the sacred vessels and
    on the vestments and on hangings and in pictures both in houses and by the wayside,
    <strong><mark>to wit, the figure of our Lord God and Saviour Jesus Christ, of
    our spotless Lady, the Mother of God, of the honourable Angels, of all Saints
    and of all pious people. For by so much more frequently as they are seen in artistic
    representation, by so much more readily are men lifted up to the memory of their
    prototypes, and to a longing after them; and to these should be given due salutation
    and honourable reverence (ἀσπασμὸν καὶ τιμητικὴν προσκύνησιν), not indeed that
    true worship of faith (λατρείαν) which pertains alone to the divine nature</mark></strong>;
    <strong>but to these, as to the figure of the precious and life-giving Cross and
    to the Book of the Gospels and to the other holy objects, incense and lights may
    be offered according to ancient pious custom. For the <mark>honour which is paid
    to the image passes on to that which the image represents, and he who reveres
    the image reveres in it the subject represented</mark></strong>. For thus the
    teaching of our holy Fathers, that is the tradition of the Catholic Church, which
    from one end of the earth to the other hath received the Gospel, is strengthened.
    Thus we follow Paul, who spake in Christ, and the whole divine Apostolic company
    and the holy Fathers, holding fast the traditions which we have received. So we
    sing prophetically the triumphal hymns of the Church, “Rejoice greatly, O daughter
    of Sion; Shout, O daughter of Jerusalem. Rejoice and be glad with all thy heart.
    The Lord hath taken away from thee the oppression of thy adversaries; thou art
    redeemed from the hand of thine enemies. The Lord is a King in the midst of thee;
    thou shalt not see evil any more, and peace be unto thee forever.” (Zeph. 3:14–15).</p><p>Those,
    therefore who dare to think or teach otherwise, or as wicked heretics to spurn
    the traditions of the Church and to invent some novelty, or else to reject some
    of those things which the Church hath received (<i>e.g.</i>, the Book of the Gospels,
    or the image of the cross, or the pictorial icons, or the holy reliques of a martyr),
    or evilly and sharply to devise anything subversive of the lawful traditions of
    the Catholic Church or to turn to common uses the sacred vessels or the venerable
    monasteries, if they be Bishops or Clerics, we command that they be deposed; if
    religious or laics, that they be cut off from communion.”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-The-Decree-of-the-Holy-Great-Ecumenical-Synod-the-Second-of-Nice">Acts
    of the Seventh Ecumenical Council, the Decree of the Synod</a>)</p><h2>Epistle
    of the Patriarchs of the Eastern-Catholic Church on the Orthodox faith (1723)</h2><blockquote><p><strong>Question
    3. — How should one think of the holy icons and of the veneration of the Saints?</strong></p><p><strong>Answer</strong>.
    — Since there are Saints, and the Catholic Church acknowledges them as intercessors,
    we therefore honour them as the friends of God, who pray for us before God of
    all. But our veneration of the Saints is of two kinds: one pertains to the Mother
    of the Word of God, whom we venerate more highly than a servant of God, since
    the Mother of God, while truly a servant of the One God, is also the Mother who
    gave fleshly birth to the One of the Trinity. Therefore we magnify her above compare
    more highly than all the Angels and Saints, and render to her worship greater
    than is fitting for a servant of God. The other kind of worship, fitting for the
    servants of God, pertains to the Holy Angels, the Apostles, the Prophets, the
    Martyrs, and in general to all the Saints. Over and above this we honour with
    worship the wood of the precious and life-giving Cross, on which our Saviour suffered
    for the salvation of the world, the image of the life-giving Cross, the Bethlehem
    manger through which we were delivered from unreason, the place of Golgotha, the
    life-bearing Tomb and the other holy places, likewise the Holy Gospel, the sacred
    vessels in which the bloodless Sacrifice is performed; we honour and glorify the
    Saints with their annual commemorations, with national festivals, with the building
    of holy temples and with oblations. Moreover <strong>we venerate the icons of
    our Lord Jesus Christ, of the Most-holy Mother of God and of all the Saints; we
    honour these icons and kiss them, and likewise the images of the holy Angels,
    as they appeared to certain Patriarchs and Prophets; and we depict also the Most-holy
    Spirit, as He appeared in the form of a dove</strong>.</p><p><strong>If some reproach
    us with idolatry for the veneration of the holy icons, we consider such a reproach
    empty and absurd; for we serve no one else, but only the one God in the Trinity</strong>.
    We venerate the Saints in a twofold manner. First, in relation to God, for His
    sake we bless the Saints; second, in relation to the Saints themselves, since
    they are living images of God. Moreover, in honouring the Saints as servants of
    God, <strong><mark>we honour the holy icons relatively — the honour paid to icons
    passes to their prototypes; for whoever venerates an icon venerates through the
    icon the prototype; so that in no way can the honouring of the icon be separated
    from the honouring of what is depicted on it; but both abide in unity, just as
    the honour given to the ambassador of a king is inseparable from the honour given
    to the King Himself.</mark></strong></p><p>The passages which the opponents take
    from Scripture to confirm their absurdity do not favour them so much as they think;
    on the contrary, they are entirely in accord with our opinion. For, reading the
    divine Scripture, we examine the time, the person, the examples and the causes.
    Therefore, if we find that one and the same God in one place says: “You shall
    not make for yourself a graven image, nor any likeness; do not bow down to them,
    nor serve them”, and in another commands Cherubim to be made; and if we see also
    in the temple the images of oxen and lions that were made, we accept none of this
    superstitiously (for superstition is not faith); but, as we have said, taking
    account of the time and other circumstances, we arrive at a correct understanding.
    <strong><mark>The words “You shall not make for yourself a graven image or any
    likeness”, in our understanding, mean the same as the words: bow not down to strange
    gods, do not practise idolatry.</mark></strong> — In this way both the custom,
    held by the Church from apostolic times, of venerating the holy icons, and the
    worship that is due to the one God, will remain inviolate, and God will not contradict
    His own words. And when our opponents refer to the holy Fathers who allegedly
    said that it is unseemly to venerate icons, these holy men defend us all the more;
    since in their contests they rise up chiefly against those who give divine worship
    to the holy icons, or bring into the temples the images of their deceased relatives;
    such worshippers they strike with anathema, but <strong>they do not condemn the
    proper veneration of the Saints and of the holy icons, of the precious Cross and
    of all that has been said above. And that from apostolic times the holy icons
    were used in the temples, and the faithful venerated them, very many testify,
    together with whom the holy Seventh Ecumenical Council puts to shame every heretical
    blasphemy.</strong></p><p>Since this Council makes most clearly known how the
    holy icons are to be venerated, when <strong><mark>it delivers to curse and excommunication
    those who give divine worship to icons, or call the Orthodox who venerate icons
    idolaters, we together with it deliver to anathema those who give to a Saint,
    or an Angel, or an icon, or the Cross, or the holy relics, or the sacred vessels,
    or the Gospel, or anything else, whatsoever in the heavens above or on the earth
    and in the sea, such honour as is fitting for the one God in the Trinity. Likewise
    we anathematize those who call the veneration of icons idolatry, and therefore
    do not venerate them, and do not honour the Cross and the Saints, as the Church
    has commanded.</mark></strong></p><p>The Saints and the holy icons we venerate
    as we have said, and we portray them for the adornment of the temples, that they
    may serve the unlearned in place of books and incite to the imitation of the virtues
    of the Saints and to the remembrance of them, and may further the increase of
    love, vigilance and the constant calling upon the Lord as Master and Father, and
    upon the Saints as His servants, our helpers and intercessors.</p></blockquote><p>(Epistle
    of the Patriarchs of the Eastern-Catholic Church on the Orthodox faith)</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
