- src: GHVaKqFy_Не_почитавших_священные_изображения_Бог_наказывал
  path: God-punished-those-who-did-not-venerate-sacred-images
  title: God punished those who did not venerate sacred images
  menu:
    parent: Holy icons
    title: God punished those who did not venerate icons
    priority: 8
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>The
    two sons of Aaron, “<strong><em>drew near before the LORD with strange fire, and
    died</em></strong><em>… tell</em> Aaron… not to come at just any time into the
    sanctuary, within the veil, before the cover (the mercy seat) that is on the ark
    (of the Testimony), lest he die” (Lev. 16:1–2). “And <strong>He struck the men
    of Beth Shemesh, because they had looked into the ark of the LORD, and killed
    of the people fifty thousand and seventy men</strong>” (1 Sam. 6:19). “<strong>Uzzah
    put out his hand to the ark of God (to steady it) and took hold of it, for the
    oxen stumbled. And the anger of the LORD was aroused against Uzzah, and God struck
    him there for his rashness, and he died there by the ark of God</strong>” (2 Sam.
    6:6–7).</p></blockquote><p>(The Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: M9iR61qn_В_храме_Соломоновом_были_святые_иконы
  path: There-were-holy-icons-in-Solomons-temple
  title: There were holy icons in Solomon's temple
  menu:
    parent: Holy icons
    title: There were icons in Solomon's temple
    priority: 9
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“Solomon
    <em>made</em> two cherubim of olive wood <em>in the inner sanctuary</em> (the
    Holy of Holies — 1 Kings 8:6)... and he overlaid the cherubim with gold. And on
    all the walls of the temple round about he made carved figures of cherubim...
    On the two leaves of the doors (for entering the inner sanctuary) of olive wood
    he carved figures of cherubim” (these doors correspond to the royal gates in Orthodox
    churches). On the doors (for entering the temple) “he carved on them cherubim”
    (1 Kings 6:23, 28–29, 32, 35). On the day of the consecration of the temple the
    Lord showed His good pleasure towards the temple with its holy things: “the cloud
    filled the house of the Lord; and the priests could not stand to minister because
    of the cloud, for the glory of the Lord filled the house of the Lord” (1 Kings
    8:10–11; cf. 1 Kings 9:2–3).</p></blockquote><p>(The Orthodox Church and the Sectarians,
    part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: 0DKeQo25_В_храме_построенном_Зоровавелем_1Ездр52_были_святые_иконы
  path: There-were-holy-icons-in-the-temple-built-by-Zerubbabel
  title: There were holy icons in the temple built by Zerubbabel (1 Ezra 5:2)
  menu:
    parent: Holy icons
    title: There were icons in Zerubbabel's temple
    priority: 10
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>“I
    will show you... all that you see, declare to the house of Israel” (Ezek. 40:4).
    “Both within the temple and without, and on all the wall round about, within and
    without, there were carved figures: cherubim were made..; each cherub had two
    faces. On the one side the face of a man was turned towards the palm, and on the
    other side towards the palm — the face of a lion; so it was made throughout the
    temple round about. From the floor to the top of the doors were made cherubim
    and palms, likewise also on the walls of the temple... On the doors of the temple
    there were cherubim... such as those made on the walls” (Ezek. 41:17–25).</p></blockquote><p>(The
    Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: NL5Jg1y7_Как_относились_к_святым_иконам_Иисус_Христос_и_апостолы
  path: How-did-Jesus-Christ-and-the-apostles-treat-holy-icons
  title: How did Jesus Christ and the apostles treat holy icons?
  menu:
    parent: Holy icons
    title: How did Jesus Christ and the apostles treat icons?
    priority: 11
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>The
    Lord Jesus Christ was often in the temple (before His sufferings — every day —
    Matt. 26:55), saw (“having looked round at all things” — Mark 11:11) the images
    in it, but did not say that they should be carried out as things displeasing to
    God (cf. John 2:14–16; Matt. 21:12–13; Luke 19:45–46); He did not condemn the
    Jews who had built the temple with sacred images and prayed before them, but was
    pleased to call the temple adorned with images His own house (Mark 11:17). The
    Lord undoubtedly prayed and offered worship in the temple, otherwise the Pharisees
    and the chief priests would have accused Him of it, but they made no such accusation.
    By honouring the temple and the sacred images in it, Jesus Christ gave an example
    to His followers to do likewise (cf. John 13:15; 1 Pet. 2:21). The apostles “were
    continually in the temple, praising and blessing God” (Luke 24:53; cf. Acts 3:1;
    22:17). The apostle Paul offered worship before the sacred images (Acts 24:11).
    We must also imitate the apostles, who prayed before icons and venerated them.
    Such is the bequest of the apostle Paul: “be imitators of me, as I also am of
    Christ” (1 Cor. 11:1; cf. 1 Cor. 4:16).</p></blockquote><p>(The Orthodox Church
    and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: B9a1fZHs_Святые_иконы_будут_у_христиан_до_конца_мира
  path: Holy-icons-will-remain-with-Christians-until-the-end-of-the-world
  title: Holy icons will remain with Christians until the end of the world
  menu:
    parent: Holy icons
    title: Icons will remain with Christians until the end of the world
    priority: 12
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>Because
    Orthodox Christians honour the holy icons, the false prophet of the antichrist,
    for the deception of those who dwell on the earth, commands, as the word of God
    testifies, that there be made “the image of the beast, which has the wound of
    the sword, and lives. And it was given him to put breath into the image of the
    beast, that the image of the beast should speak and act” (Rev. 13:11, 14–15).
    If Christians had no veneration of icons at the time of the appearance of the
    antichrist, then the image made by the false prophet and the demand for worship
    of the image (“as many as would not worship the image of the beast were to be
    killed”), as an innovation, could not have been means of deception.</p></blockquote><p>(The
    Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: JM1mt5ZS_Различие_между_святыми_иконами_и_идолами
  path: The-difference-between-holy-icons-and-idols
  title: The difference between holy icons and idols
  menu:
    parent: Holy icons
    title: The difference between icons and idols
    priority: 13
  body: "<h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo), hierarch (1651–1709)</h3><blockquote><p><strong>What
    difference is there between an idol and a holy icon?</strong></p><p>Though both
    — the idol, I say, and the holy icon — are the work of human hands, yet <strong>so
    great is the difference between them</strong>, as great as between a base thing
    and an honourable thing: as between mire and gold, between soot and snow, between
    darkness and light, and as between men that are base and men that are excellent,
    between malefactors and those honoured with the royal purple: malefactors we abhor,
    kings we honour; the former we plunder, the latter we venerate: such is the difference
    between the idols of defiled gods and the icons of holy persons: as Symeon Metaphrastes
    also declares, in the life of St Andrew of Crete, who suffered for the holy icons
    and is honoured on the 17th day of the month of October, writing thus: <strong><mark>where
    the thing is evil, soul-harming and forbidden, there also is the icon of that
    thing evil, soul-harming and forbidden: but where the thing is good, profitable
    and not forbidden, there also is the icon of that thing good</mark>, profitable
    and not forbidden</strong>[206]<strong>. Evil are the gods of the pagans, soul-harming,
    and it is forbidden to venerate them; and their icons are evil, soul-harming,
    and the law of God has forbidden to venerate them</strong>. <strong><mark>Good
    is the Lord our God Jesus Christ, and good are His servants, and they are most
    profitable to our souls: and not only is it not forbidden, but it is even commanded
    us to venerate the Lord and His saints, as David said: to me greatly honoured
    were Thy friends, O God</mark></strong>[207]. Therefore the icon of the Lord,
    and of His honoured friends, of whom the Lord said: you are My friends[208], is
    good and most profitable to our souls, and we are bound to venerate them, knowing
    that <strong><mark>the honour rendered to icons passes over to the very person
    depicted on the icon</mark></strong>.</p><p><strong><mark>Moreover</mark></strong>
    the difference between idols and icons is clearly shown also from the words of
    St John of Damascus, with which words he cries out menacingly against those in
    heresy, saying: <strong><mark>why, O most-lawless heretic, do you say that I serve
    idols? To what idol, then, do I bow down, tell me: to the perished Apollo, or
    to the image of our Lord Jesus Christ</mark></strong>, Who teaches me to know
    His dispensation in the flesh? Tell me, you that think as the Jews, to what idol
    do I bow down: to that of Artemis, or to the image of the most holy and pure Lady
    our Mother of God and Ever-virgin Mary, the Mother of our Lord Jesus Christ? Tell
    me, O heretic, to what idol do I bow down: to Zeus, or to the image of St John
    the Forerunner and Baptist? To what idols do I worship: to that of Zeus, or to
    the representations of the holy Apostles and martyrs, and of all the saints who
    from the beginning have pleased the Lord? And who would dare to call this painting
    idolatry, (depicted by the painter’s art,) and to dishonour the sufferings of
    Christ and of His saints, or the holy Church of God which has been handed down
    to us adorned? For thus have we received it adorned from the holy fathers[209].”
    Thus far Damascus. The image of Apollo, then, and of Artemis and of Zeus are defiled
    idols: <strong><mark>the image of Christ and of the most pure Virgin the Mother
    of God, and the images of the holy chosen ones of God are holy icons</mark></strong>.
    <strong><mark>The defiled idols are spitten upon by Christians, and the holy icons
    are honoured</mark></strong>.</p></blockquote><p>(The Search of the Schismatic
    Bryn Faith, part 2, ch. 12)</p><h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter
    (1863–1955)</h3><blockquote><p><strong>(a) in origin</strong></p><p>Holy icons
    are made by people who believe in the true God, in obedience to a clear command
    of God (cf. Exod. 25:18, 40; 26:1; Num. 21:8–9). Idols appeared as a result of
    human “delusion” (Jer. 10:15), “ignorance of God” (Wis. 13:1), “vanity” (Wis.
    14:14), “invention” (Wis. 14:12; Acts 17:29), the instigation of the devil (Wis.
    11:19–20).</p><p><strong>(b) in the persons and events depicted</strong></p><p>On
    holy icons are depicted existing holy persons and real sacred events: God — not
    in His essence, but as He manifested Himself to people; the holy Virgin Mary,
    the holy angels and holy men; the Nativity of Christ, Baptism, Transfiguration
    and others. From man comes only the depicting of these persons and events on icons
    and their adornment (cf. Exod. 25:18, 40; 26:1, 31; 31:1–11).</p><p>Idols are
    a lie, a human invention: “is falsehood... This is perfect emptiness, the work
    of delusion” (Jer. 10:14–15). Such are Dagon (1 Sam. 5:2), Baal (Jer. 19:5), Bel
    (Dan. 14:3), Astarte (2 Kings 23:7), Milcom, Chemosh, Moloch (1 Kings 11:5, 7).
    Idols contain nothing divine, nothing sacred, in the word of the apostle: an idol
    is nothing (1 Cor. 8:4) — since stones and other things were deified (Wis. 13:10;
    Isa. 44:17; Jer. 2:27; Hab. 2:18–19), animals (Wis. 15:18–19; Acts 7:41; Rom.
    1:23), the powers of nature and the heavenly bodies (Wis. 13:1–3; Acts 7:42–43),
    “mortal” man, sinful with his passions (Wis. 14:15–21; Rom. 1:23).</p><p><strong>(c)
    in their religious significance</strong></p><p>Holy icons are not gods; they are
    called not gods but “images” (1 Kings 6:23). The icon, for example, of the Lord
    Jesus Christ is not the Lord Himself, but only His image. Icons are, as it were,
    portraits of holy persons.</p><p>Idolaters not only called idols gods (Wis. 13:2,
    10), but believed that idols were living gods (Dan. 14:6, 24). For the pagans
    “idol” and “god” are one and the same (Isa. 44:17; Jer. 2:27).</p><p><strong>(d)
    in their moral influence</strong></p><p>Holy icons serve for us as a means of
    remembrance of God and of His saints; they are the word of God in images: the
    events and persons depicted teach holy and righteous living, awaken reverent feeling
    and a mood of prayer.334 (cf. Gal. 3:1)</p><p>“The serving of idols... is the
    beginning and cause and end of every evil... Trusting in soulless idols, they
    (the idolaters) expect not to be punished” (Wis. 14:27, 29). Idolatry was accompanied
    by human sacrifices and was joined to debauchery (Ps. 106:36–39; 2 Kings 17:16–18;
    23:6–7), it led to the forgetting of God and to the complete perversion of true
    religious concepts.</p><p><strong>(e) in relation to the will of God</strong></p><p>Holy
    icons are a divine institution (Exod. 25:18 and elsewhere), they are instruments
    of God’s power (Josh. 3:15–16; 4:18; 1 Sam. 5; 2 Sam. 6:6–7; Num. 21:9), and the
    honouring of icons is a God-pleasing deed (2 Sam. 6:11). Therefore the gold, wood
    and other things of the holy icons are holy (cf. Matt. 23:17; 2 Esd. 8:57; 1 Kings
    8:11; Exod. 30:29). Graven images, or idols, are forbidden by God (Exod. 20:4;
    Lev. 19:4 and elsewhere). The gold, wood etc. of idols and those who made them
    are cursed (Wis. 14:8). Idolaters draw upon themselves the wrath of God (Exod.
    32:7–10; 1 Kings 11:7–9; 2 Kings 17:18 and elsewhere). Idolatry is the serving
    of demons (1 Cor. 10:20; Rev. 9:20). Compare: Solomon built the temple of the
    Lord and in it images of cherubim (1 Kings 6–8), which God sanctified (1 Kings
    9:3), and then built a sanctuary for Chemosh, and “the Lord was angry with Solomon,
    because his heart had turned away from the Lord God of Israel” (1 Kings 11:5–10).</p></blockquote><p>(The
    Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
- src: L9SbyDei_Несущественные_внешние_черты_сходства_идолов_со_священными_изображениями
  path: Nonessential-external-similarities-of-idols-to-sacred-images
  title: The nonessential (external) features of the similarity of idols to sacred
    images
  menu:
    parent: Holy icons
    title: The nonessential (external) similarity of idols to icons
    priority: 14
  body: "<h2>20th century</h2><h3>Dmitry Vladykov, protopresbyter (1863–1955)</h3><blockquote><p><strong>(a)
    Both were made of material by men (they were made by hands):</strong></p><p>The
    calf — of gold (Exod. 32:3–4); “an idol is cast by the craftsman and the goldsmith”
    (Isa. 40:19–20), of wood prepares it the “carpenter” (Wis. 13:11–14; cf. Isa.
    44:13–19).</p><p>The cherubim — of gold (Exod. 37:7), of wood (1 Kings 6:27–29),
    of wool (Exod. 26:1); the serpent — of brass (Num. 21:9). The sacred images were
    made by Bezalel, Aholiab (Exod. 31:2–6), Huram-abi (2 Chron. 2:13–14).</p><p><strong>(b)
    They are devoid of their own power and life:</strong></p><p>“<em>Hung</em> on
    the wall, fastening it with iron..”. (Wis. 13:15–16); “they lift (the idol) onto
    the shoulders, they carry it and set it” (Isa. 46:7).</p><p>The ark of the covenant
    was carried about (Josh. 3:13; 1 Sam. 4:4; 5:1), and on it the cherubim were fastened
    (Exod. 37:7–9).</p><p><strong>(c) Censing was offered to them and lamps were kindled:</strong></p><p>“<em>They
    offer censing to</em> other gods” (Jer. 19:4). “Each had his own censer in his
    hand” (Ezek. 8:11). “A lamp is lighted for them” (Ep. Jer. 1:18).</p><p>Before
    the sacred images censing was performed (Exod. 30:1–7) and lamps were kindled
    (Exod. 27:20–21; 1 Sam. 3:3).</p><p>The nonessential features of the similarity
    of idols to holy icons do not degrade the latter and give no right to confuse
    them or to identify them with the former. The word of God commands: “to distinguish
    between the sacred and the unsacred, and between the unclean and the clean” (Lev.
    10:10; Ezek. 22:26; 44:23). The Bible also has certain external features of similarity
    with “unsacred”, “unclean” books, but despite this it remains a sacred book. Holy
    Scripture speaks of the “tabernacle of Moloch” (Acts 7:43) and of the “tabernacle
    of David” (Acts 15:16), of the “cup of the Lord” and the “cup of demons”, of the
    “table of the Lord” and the “table of demons” (1 Cor. 10:21), and therefore distinguishes,
    and does not identify, the “sacred” and the “unsacred”, the “clean” and the “unclean”.</p></blockquote><p>(The
    Orthodox Church and the Sectarians, part 2)</p>"
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
  update: true
