    title: The veneration of icons (iconodulia)
    priority: 1
  body: '<h2>Preface</h2><p>The ancient Christians had images, churches, and altars.
    This is proved both by the monuments of history (<a href="https://bibleox.com/en/en/w/Ik1c_A_Collection_of_Ancient_Icons">ancient
    icons</a>, <a href="https://bibleox.com/en/en/w/Ch2c_Ancient_Christian_Churches">ancient
    churches with altars</a>) and by the written testimonies of the ancient Christians
    (Tertullian, the hieromartyr Methodius, Eusebius of Caesarea). We will consider
    this in more detail below.</p><p>At the same time, however, a number of ancient
    Christian writers also have statements against representational art, as well as
    against the veneration of images (mostly statues). As a rule, all such statements
    are used in one way or another in a pagan context, that is, what is condemned
    is precisely the pagan attitude towards images: the depiction of falsehood with
    its subsequent veneration as a deity (it does not matter whether the veneration
    is only as an image of a false deity or of the false deity itself).</p><p>Statements
    against images (mostly statues) in a pagan context arise from the fact that the
    first centuries of Christianity were a time of active polemics with paganism.
    The pagans have not only images (statues of gods), but also churches with altars,
    and therefore an identical situation is observed in the question of the pagans
    having churches and altars. Christians condemn the pagans for churches, altars,
    and images, but at the same time write about churches and altars, and occasionally
    about images, among themselves (<a href="https://bibleox.com/en/en/w/Ancient-Christian-churches">more
    about churches and altars</a>). That is, in a pagan context, what is evidently
    condemned is precisely the pagan attitude towards these objects.</p><p>Thus, the
    polemics of the first centuries against images is addressed only to external societies.
    Inside the Church, despite the presence of images, there is no polemics.</p><p>Polemizing
    against paganism, the Christian authors note the difference between the false
    (pagan) and the true (Christian) attitude towards the making and veneration of
    images:</p><ol><li><p>St Justin the Philosopher (2nd century) writes that the
    pagan images are not like the true God, that is, the pagans depict and venerate
    falsehood.</p></li><li><p>Tertullian (2nd–3rd centuries) writes that not every
    image falls under the prohibition of idolatry, and that in every deed it is necessary
    to pay attention to the purpose for which a given act was performed. An act is
    accepted if it is performed for the sake of the true God. Tertullian notes that
    the images in the Old Testament Temple did not fall under the prohibition, because
    they did not have those properties for which they would have been prohibited.
    After falling into the heresy of Montanism, Tertullian polemizes with the Church
    and incidentally testifies that in it the shepherd is depicted on the Eucharistic
    chalices (this is precisely how Christ was depicted in antiquity). Earlier he
    accused the pagans of idolatry, having written a whole treatise, but now, even
    having fallen into the heresy of Montanism and having become an opponent of the
    Church, he does not condemn her for icons, although he had a convenient occasion
    for that. It is also important that Tertullian venerates the cross, since the
    cross is also an image.</p></li></ol><p>That is, from antiquity the Christians
    had icons of Christ and the apostles, but there is no internal church polemics
    against them, just as there is no internal polemics against churches and altars.
    To redirect the external polemics against the statues of the pagans and the Gnostics
    (yes, the Gnostics probably had precisely statues; this can be read about in more
    detail) onto the Church, when the Church herself has icons, is simply incorrect.</p><p>Some
    will say that inside the Church there is no polemics against icons because icons,
    although present, are not venerated. However, this remark is also incorrect, for
    the following reasons:</p><ul><li><p>Even in the Old Testament, sacred objects
    with depictions were venerated with bows (<a href="https://bibleox.com/en/eng-nkjv/nav/7/#L6">Josh.
    7:6</a>; <a href="https://bibleox.com/en/eng-nkjv/ps/5/#L7">Ps. 5:7</a>).</p></li><li><p>In
    the 1st century the believers sought that the shadow of the apostle might touch
    them, that they might be healed (<a href="https://bibleox.com/en/eng-nkjv/act/5/#L15-16">Acts
    5:15-16</a>), that is, they sought contact with at least an image, to which God
    responded with the gift of grace, and which the evangelist Luke, with the cooperation
    of the Holy Spirit, considered important to record. This is already, at the very
    least, not only an instructive meaning of the image, but a most sacred one.</p></li><li><p>In
    the 2nd century the Christian writers testify to the veneration of the cross.
    What kind of idol would that be for the opponents of icons, who love to compare
    them with the bronze serpent (the image of the cross), of which the people later
    made Nehushtan (<a href="https://bibleox.com/en/eng-nkjv/4ts/18/#L4">2 Kings 18:4</a>)?
    Yet there is no internal polemics against the veneration of the cross. On the
    contrary, the pagans mock the Christians as servants of the cross (see Tertullian),
    and draw caricatures of Christians praying with an outstretched hand before a
    cross (see the <a href="https://bibleox.com/ru/ru/w/Wweh_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B5_%D0%BF%D0%B0%D0%BC%D1%8F%D1%82%D0%BD%D0%B8%D0%BA%D0%B8_%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D0%B8/#HH-%D0%9A%D0%B0%D1%80%D0%B8%D0%BA%D0%B0%D1%82%D1%83%D1%80%D0%B0-%D0%BD%D0%B0-%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D0%B8%D0%BD%D0%B0-%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BC%D0%B5%D0%BD%D0%B0-I-III-%D0%B2%D0%B2"
    lang="ru">caricature of Alexamenos</a>).</p></li><li><p>In the 3rd century the
    hieromartyr Methodius of Olympus testifies to the veneration of icons. First he
    sets forth the Orthodox theology of the image (venerating the image, we venerate
    the prototype), connecting this with the making of icons of the angels, and affirming
    that to each person one must render what is due in everything. Who opposed him?
    There is no internal polemics.</p></li><li><p>The church historian Eusebius, bishop
    of Caesarea (3rd–4th centuries), testifies that within the Church herself icons
    of Christ and the apostles were preserved, made by the ancient (in his understanding)
    Christians, who thus venerated Christ and the apostles.</p></li><li><p>Only in
    the 4th century, when in parallel there are already many preserved icons and statements
    of the saints about them, will St Epiphanius of Cyprus speak out against icons
    inside the Church. But even here he speaks out not against veneration, but against
    the existence of icons: he asks that they be removed from the churches. He testifies
    that icons are everywhere in the Church, and his calls to remove the icons are
    not heeded.</p></li></ul><p>Thus, the ancient Christians have icons, there is
    veneration, and there is no polemics either against icons or against their veneration.</p><p>The
    question of icons is very scantily covered in the preserved works of the ancient
    authors. Here it is necessary to take into account that we all think, speak, and
    write about topical themes, and among them we begin with the most important ones,
    devoting more attention to them. In the first centuries the topical theme was
    the polemics with Judaism, paganism, and Gnosticism. The Christian authors had
    to convince the Jews that Jesus is the expected Christ, the pagans that God is
    one, and the Gnostics that the faith must be received from the Church of Christ,
    and not from late self-proclaimed teachers.</p><p>Thus, even those who write about
    icons write about them, as it were, in passing, since this was not the main theme
    of the polemics until the venerators of icons began to be killed for this in the
    8th century. And already before that there are enough testimonies, but whole treatises
    will begin to be written about icons only when the more urgent questions have
    already been discussed and the question of the attitude towards icons becomes
    literally a matter of life and death. We will write about this in more detail
    in the conclusion (the section <a href="#HH-Criticism">“Criticism”</a>), but for
    now let us consider the quotations.</p><h2>2nd century</h2><h3>St Justin the Philosopher,
    martyr (c. 100–165)</h3><p>This quotation does not confirm icon veneration directly,
    but relates to the theme indirectly. Here Justin the Martyr accuses the pagans
    that their idols <strong>do not resemble</strong> God, but at the same time even
    have other names and forms, pointing to the wicked demons:</p><blockquote><p><em>And
    neither do we honour with many sacrifices and garlands of flowers such deities
    as men have formed and set in shrines and </em><strong><em>called gods; since
    we see that these are soulless and dead, and <mark>have not the form of God</mark></em></strong><em>
    </em><strong><em><mark>(for we do not consider that God has such a form as some
    say that they imitate to His honour)</mark></em></strong><em>, but </em><strong><em>have
    the <mark>names</mark> and <mark>forms</mark> of those wicked demons</em></strong><em>
    which have appeared. For why need we tell you who already know, into what forms
    the craftsmen, carving and cutting, casting and hammering, fashion the materials?
    And often out of vessels of dishonour, </em><strong><em>by merely changing the
    form</em></strong><em>, and making an image of the requisite shape, they make
    what they call a god; which we consider not only senseless, but to be even insulting
    to God, who, having ineffable glory and form, thus gets His name attached to things
    that are corruptible, and require constant service.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-9">Apology 1</a>)</p><h3>Tertullian
    (c. 160–240)</h3><p>Christians “consecrate” the tree of the Cross; they are “priests
    of the Cross” — Tertullian does not deny this accusation:</p><blockquote><p>“<em>As
    for him who affirms that we are </em><strong><em>‘the priesthood of a cross,’</em></strong><em>[198]
    we shall claim him[199] as our co-religionist.[200] A cross is, in its material,
    a sign of wood; amongst yourselves also the object of worship is a wooden figure.
    Only, whilst with you the figure is a human one, with us the wood is its own figure.
    Never mind[201] for the present what is the shape, provided the material is the
    same: the form, too, is of no importance,[202] if so be it be the actual body
    of a god. If, however, there arises a question of difference on this point what,
    (let me ask,) is the difference between the Athenian Pallas, or the Pharian Ceres,
    and wood formed into a cross,[203] when each is represented by a rough stock,
    without form, and by the merest rudiment of a statue[204] of unformed wood? Every
    piece of timber[205] which is fixed in the ground in an erect position is a part
    of a cross, and indeed the greater portion of its mass. But an entire cross is
    attributed to us, with its transverse beam,[206] of course, and its projecting
    seat. Now you have the less to excuse you, for you dedicate to religion only a
    mutilated imperfect piece of wood, while others </em><strong><em>consecrate to
    the sacred purpose</em></strong><em> a complete structure</em>”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-ad-nationes#HH-The-Charge-of-Worshipping-a-Cross-The-Heathens-Themselves-Made-Much-of-Crosses-in-Sacred-Things-Nay-Their-Very-Idols-Were-Formed-on-a-Crucial-Frame"><em>Tertullianus.</em>
    Ad Nationes, I 11-12 // PL. 1. Col. 577-578</a>) (after 197)</p><p>Not every image
    falls under the definition of idolatry, and not every image is prohibited:</p><blockquote><p>“<em>Likewise,
    when forbidding the similitude to be made of all things which are in heaven, and
    in earth, and in the waters, He declared also the reasons, as being prohibitory
    of all material exhibition[217] of a latent[218] idolatry. For He adds: ‘Thou
    shalt not bow down to them, nor serve them.’ The form, however, of the brazen
    serpent which the Lord afterwards commanded Moses to make, </em><strong><em>afforded
    no pretext[219] for idolatry</em></strong><em>, but was meant for the cure of
    those who were plagued with the fiery serpents. (Num. 21:8–9) I say nothing of
    what was figured by this cure. (see John 3:14) Thus, too, the golden Cherubim
    and Seraphim were purely an ornament in the figured fashion[220] of the ark; adapted
    to ornamentation for reasons totally remote from all condition of idolatry, on
    account of which the making a likeness is prohibited; and they are evidently not
    at variance with[221] this law of prohibition, </em><strong><em>because they are
    not found in that form[222] of similitude, in reference to which the prohibition
    is given</em></strong>”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-the-five-books-against-marcion-2#HH-The-Brazen-Serpent-and-the-Golden-Cherubim-Were-Not-Violations-of-the-Second-Commandment--Their-Meaning"><em>Tertullian.
    </em>Against Marcion, II 22. St. Petersburg, 2010. P. 172</a>)</p><p>This line
    of thought is consonant with the way the veneration of icons was later defended
    as well (see below the quotations of <a href="#HH-St-John-of-Damascus-monk-2nd-half-of-the-7th-c--before-754">John
    of Damascus</a> and of <a href="#HH-Blessed-Jerome-of-Stridon-monk-c-347419">Jerome
    of Stridon</a>). In every deed the purpose is important — whether the deed is
    done for the sake of the truth or for the sake of falsehood:</p><blockquote><p>“<em>We
    have spoken[223] of the rational institution of the sacrifices, as calling off
    their homage from idols to God; and if He afterwards rejected this homage, saying,
    ‘To what purpose is the multitude of your sacrifices unto me?’ (Isa. 1:11)—He
    meant nothing else than this to be understood, that He had never really required
    such homage for Himself. For He says, ‘I will not eat the flesh of bulls;’ (Ps.
    50:13) and in another passage: ‘The everlasting God shall neither hunger nor thirst.’[224]
    Although He had respect to the offerings of Abel, and smelled a sweet savour from
    the holocaust of Noah, yet what pleasure could He receive from the flesh of sheep,
    or the odour of burning victims? And yet </em><strong><em>the simple and God-fearing
    mind </em></strong><em>of those who offered what they were receiving from God,
    both in the way of food and of a sweet smell, was favourably accepted before God,
    in the sense of </em><strong><em><mark>respectful homage[225] to God</mark>, who
    did not so much want what was offered, as <mark>that which prompted the offering</mark></em></strong><em>.
    Suppose now, that some dependant were to offer to a rich man or a king, who was
    in want of nothing, some very insignificant gift, will the amount and quality
    of the gift bring dishonour[226] to the rich man and the king; or </em><strong><em><mark>will
    the consideration[227] of the homage give them pleasure</mark></em></strong><em>?</em>”</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/tertullian-the-five-books-against-marcion-2#HH-The-Brazen-Serpent-and-the-Golden-Cherubim-Were-Not-Violations-of-the-Second-Commandment--Their-Meaning"><em>Tertullian.
    </em>Against Marcion, II 22. St. Petersburg, 2010. P. 172-173</a>)</p><p>The image
    must correspond to the truth:</p><blockquote><p>But if these things were figures
    of us (for we are temples of God, and altars, and lights, and sacred vessels),
    this too they in figure set forth, that the people of God ought not to be crowned.
    <strong>The reality must always correspond with the image</strong>.</p></blockquote><p>(On
    the Chaplet)</p><p>After falling away from the Church into Montanism, Tertullian
    criticizes the Church for accepting repentant adulterers. One of the arguments
    for their acceptance was evidently the book <a href="https://bibleox.com/en/en/w/The_Shepherd_of_Hermas">The
    Shepherd of Hermas</a>. And here it is important that, criticizing this work,
    Tertullian, who had left the Church, by his very accusations against the Church
    testifies that sacred images are present in the Church: the Church uses a chalice
    (for the Eucharist) with the depiction of the Good Shepherd (Christ):</p><blockquote><p>“<em>I
    would yield my ground to you, if the scripture of ‘the Shepherd,’[29] which is
    the only one which favours adulterers, had deserved to find a place in the Divine
    canon; if it had not been habitually judged by every council of Churches (even
    of your own) among apocryphal and false (writings); itself adulterous, and hence
    a patroness of its comrades; from which in other respects, too, you derive initiation;
    to which, perchance, that </em><strong><em><mark>‘Shepherd,’ will play the patron
    whom you depict upon your (sacramental) chalice</mark></em></strong><em>, (depict,
    I say, as) himself withal a prostitutor of the Christian sacrament, (and hence)
    worthily both the idol of drunkenness, and the brize of adultery by which the
    chalice will quickly be followed</em>”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/tertullian-on-modesty#HH-Repentance-More-Competent-to-Heathens-Than-to-Christians">On
    Modesty, 10</a>) (<a href="https://bibleox.com/it/la/w/lq9x_De_Pudicitia/#HH-10:~:text=patrocinabitur%20pastor%2C%20quem%20in%20calice%20depingis">Tertullianus.
    De Pudicitia, 10 // PL. 2. Col. 1000</a>)</p><p>In the 2nd–3rd centuries Christ
    was most often depicted precisely in the image of the Good Shepherd (<a href="https://bibleox.com/en/en/w/Ik1c_A_Collection_of_Ancient_Icons#HH-A-woman-prays-to-the-Good-Shepherd-Rome">examples</a>).</p><p>Eucharistic
    chalices with icons: <a href="https://bibleox.com/en/en/w/Ik1c_A_Collection_of_Ancient_Icons#HH-Eucharistic-chalices-and-censers-with-icons-Byzantium-Syria-Attarouthi">gallery</a>.</p><p>More
    (in Russian): <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis">https://vk.com/@aletheia-de-sacris-imaginibus-venerandis</a></p><h2>3rd
    century</h2><h3>Methodius of Olympus, bishop of Patara, hieromartyr (c. 260–312)</h3><p>The
    thought about the veneration of the images of kings is connected with the words
    about the making of the images of the angels. The hieromartyr Methodius sets forth
    the Orthodox veneration of the image: an image is venerated not for the sake of
    the material, but for the sake of the depiction upon it. He who blasphemes an
    image is punished as one blaspheming the person depicted. Thus both honour and
    blasphemy are transferred from the image to the prototype. To each person it is
    necessary to render what is due:</p><blockquote><p>Imagine that <strong>God made
    some of His images, as it were, of gold</strong>, of the purest spiritual essence,
    namely <strong>the angels</strong>, and others as it were <strong>of chalk, or
    of bronze, that is, us</strong>; for the soul, created in the image of God, He
    joined to the earth. And as <strong><mark>all the images</mark> of the earthly
    king <mark>ought to be venerated for the sake of the depiction on them</mark></strong>,
    so also about us, who bear in ourselves the image of God, we should not think
    that we are hastening to complete perdition, as if we were despicable. Therefore
    the Word came down into our universe and was incarnate with our body, so that,
    having fashioned this image, which had as it were decayed with time, into a most
    resplendent form, He might raise it up incorruptible. Thus, interpreting mystically
    the economy that took place with the prophet, we find the whole narrative (about
    him) clearly directed towards this.</p><p>For instance, then, <strong><mark>the
    images of our kings here, even though they be not formed of the more precious
    materials—gold or silver—are honoured by all</mark></strong>. For men do not,
    <strong>while they treat with respect those of the far more precious material</strong>,
    slight those of a less valuable, but <strong>honour</strong> every image in the
    world, even though it be of chalk or bronze. And one who speaks against either
    of them, is not acquitted as if he had only spoken against clay, nor condemned
    for having despised gold, but for having been disrespectful towards the King and
    Lord Himself. <strong><mark>The images of God’s angels, which are fashioned of
    gold, the principalities and powers, we make to His honour and glory</mark></strong>.</p><p><strong>To
    each person</strong> it is necessary in everything <strong>to render what is due</strong>.</p></blockquote><p>(On
    the Resurrection, against Origen)</p><h2>4th century</h2><p>From the Syriac Martyrdom
    of Sts Hyperichius (Hipparchus), Philotheus, James, Awiv (Habib), Julian (Lollian),
    Romanus and Paragor (Paragra) of Samosata († 307–308), compiled by an eyewitness
    of the events:</p><blockquote><p>In the house of Hipparchus they had <strong><mark>a
    room where a Cross was placed on the eastern wall. And every day, seven times,
    they sincerely bowed down before it to the Lord Jesus Christ, facing east</mark></strong>.</p><p>Meanwhile
    James, Paragor, Habib, Romanus and Lollian — younger in years than Hipparchus
    and Philotheus — came to the house of Hipparchus to visit them, for they were
    bound together by close friendship. They found Hipparchus and Philotheus praying
    at the ninth hour of the day before a beautifully adorned Cross in their upper
    room. And they asked them:</p><p><em>“Why, when the whole city has gathered in
    the temple of Fortune in obedience to the imperial decree, and all the gods of
    the city have been carried there for the great festival, and their priests have
    assembled together — do you, as if seized with grief, keep to this house and pray
    apart from the people, like strangers in your own city?”</em></p><p>Hipparchus
    and Philotheus answered: <strong><em>“We pray to Him who created heaven and earth
    by His wisdom.”</em></strong></p><p><strong>Then James asked: <em>“<mark>Do you
    think that this wooden Cross is the Creator of heaven and earth? Is it He whom
    you worship?</mark>”</em></strong></p><p><strong>Hipparchus and Philotheus answered:
    <em>“<mark>We worship Him who was crucified on the Cross</mark>”</em></strong><em>,
    for He is God, the Son of God, begotten and not created, of one essence with the
    Father (</em>coessentialem, ܒܪ ܐܝܬܘܬܗ ܕܐܒܐ<em>). By His wisdom everything in heaven
    and on earth was created and is held together.</em></p><p><em>“Three years have
    already passed since we received Baptism in the name of the Father, the Son and
    the Holy Spirit from James, the priest of the true faith, who to this day imparts
    to us the Body and Blood of Christ.”</em></p></blockquote><p>(Acta Martyrum Samosatae,
    in J. S. Assemani, Acta Sanctorum Martyrum Orientalium et Occidentalium, pt. 2,
    Rome, 1748, p. 125 (130))</p><p>The ancient text in Syriac[1], as well as the
    Latin text[2].</p><h3>Eusebius of Caesarea (Pamphilus), church historian and bishop
    (c. 258–339)</h3><p>Judging by his works, Eusebius was not an advocate of icon
    veneration. That is precisely why his statements about icons become especially
    valuable. To defend icons, and all the more to invent anything in their favour,
    made no sense for Eusebius. Nevertheless, he writes that in his time (3rd–4th
    c.) icons of Christ and of the apostles, painted by ancient Christians on wooden
    boards, were still preserved. “Ancient Christians” — not from our point of view,
    but from Eusebius’s point of view. Moreover, he is confident that those ancient
    Christians thereby <strong>honoured</strong> Christ himself and the apostles.
    That is, Eusebius, without being an advocate of icon veneration, records the most
    ancient origin of the veneration of God and of the saints by means of icons.</p><p>Eusebius
    compiled a very valuable work — a book on the history of the Church, into which
    excerpts from many ancient church works, now lost, found their way and were preserved
    in Eusebius’s work. It is precisely in this work that he records the existence
    and veneration of icons among the ancient Christians. Eusebius considers this
    a pagan custom. Eusebius himself, however, was an Arian, even after he renounced
    Arianism at the First Ecumenical Council. This is known from St Athanasius the
    Great (<a href="https://bibleox.com/ru/ru/w/%D0%90%D0%BF%D0%BE%D0%BB%D0%BE%D0%B3%D0%B8%D1%8F%E2%80%94%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2-%D0%BF%D1%80%D0%BE%D1%82%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%B7%D0%BC%D0%B0-%D1%875#HH-%D0%95%D0%B2%D1%81%D0%B5%D0%B2%D0%B8%D0%B9-%D0%9A%D0%B5%D1%81%D0%B0%D1%80%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9"
    lang="ru">for more detail</a>). Therefore Orthodox Christians claim Eusebius’s
    faith in no way. His personal attitude to icons is not authoritative for us, but
    his testimony as a historian is very valuable. It is worth noting the details
    of the text which show that Eusebius was certainly not an iconoclast. He treats
    the existence of icons calmly, sometimes with admiration, having no desire to
    get rid of them.</p><p>While the critics of icon veneration use this text against
    the Orthodox, we ourselves consider this testimony extremely important and useful,
    since any bias of the author in favour of icons is completely excluded. By the
    way, it is also evident from the text that icons were created not by outside societies,
    but within the Orthodox Church itself, which preserved them down to the times
    of Eusebius:</p><blockquote><p>Since I have mentioned this city <strong><mark>I
    do not think it proper to omit an account</mark> which is worthy of record for
    posterity</strong>. For they say that the woman with an issue of blood, who, as
    we learn from the sacred Gospel, (see Matt. 9:20 sq) received from our Saviour
    deliverance from her affliction, came from this place, and that her house is shown
    in the city, and <strong>that <mark>remarkable memorials of the kindness</mark>
    of the Saviour to her remain there</strong>.</p><p>For there stands upon an elevated
    stone, by the gates of her house, a <strong><mark>brazen image of a woman</mark></strong>
    kneeling, with her hands stretched out, as if she were praying. Opposite this
    is another <strong><mark>upright image of a man</mark></strong>, made of the same
    material, clothed decently in a double cloak, and extending his hand toward the
    woman. At his feet, beside the statue itself, is a certain strange plant, which
    climbs up to the hem of the brazen cloak, and is a remedy for all kinds of diseases.</p><p><strong><mark>They
    say that this statue is an image of Jesus</mark></strong>. It has remained to
    our day, so that we ourselves also saw it when we were staying in the city.</p><p>Nor
    is it strange that those of the Gentiles who, of old, were benefited by our Saviour,
    should have done such things, since we have learned also that <strong><mark>the
    likenesses of his apostles Paul and Peter, and of Christ himself, are preserved
    in paintings</mark></strong>, the ancients being accustomed, as it is likely,
    according to a habit of the Gentiles, to pay this kind of honor indiscriminately
    to those regarded by them as deliverers.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/eusebius-the-church-history-7#HH-The-Statue-which-the-Woman-with-an-Issue-of-Blood-erected">The
    Church History, Book VII, ch. 18</a>)</p><blockquote><p>On the other hand one
    might see the fountains in the midst of the market place graced with <strong>figures
    representing the good Shepherd, well known to those who study the sacred oracles,
    and that of Daniel also with the lions, forged in brass, and resplendent with
    plates of gold</strong>. Indeed, so large a measure of Divine love possessed the
    emperor’s soul, that in the principal apartment of the imperial palace itself,
    on a vast tablet displayed in the center of its gold-covered paneled ceiling,
    he caused <strong>the symbol of our Saviour’s Passion to be fixed, composed of
    a variety of precious stones richly inwrought with gold</strong>. This symbol
    he seemed to have intended to be as it were the safeguard of the empire itself.
    <strong>With such images Constantine adorned his city.</strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/eusebius-the-life-of-constantine-2#HH-Representation-of-the-Cross-in-the-Palace-and-of-Daniel-at-the-Public-Fountains">The
    Life of Constantine, Book III, ch. 49</a>; the closing sentence is translated
    from the Russian, since it has no counterpart in the library’s English translation)</p><h3>St
    Athanasius the Great, archbishop of Alexandria (c. 295–373)</h3><p>Following St
    Methodius of Patara, St Athanasius the Great records the idea that the material
    of an image is valued for the sake of the face depicted on it. Therefore, if the
    image of a face is spoiled, the material is not thrown away for the sake of that
    face, but the image is restored:</p><blockquote><p>For as, when <strong>the likeness
    painted on a panel has been effaced by stains from without</strong>, he whose
    likeness it is must needs come once more to enable the portrait to be renewed
    on the same wood: for, <strong><mark>for the sake of his picture, even the mere
    wood on which it is painted is not thrown away, but the outline is renewed upon
    it</mark></strong>; in the same way also the most holy Son of the Father, being
    the Image of the Father, came to our region to renew man once made in His likeness.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/KADO_On_the_Incarnation_of_the_Word">On the
    Incarnation of the Word, ch. 3</a>)</p><p>The following quotation is taken from
    a work some parts of which are considered <a href="https://bibleox.com/ru/ru/w/Lw5B_Spuria/"
    lang="ru">Spuria</a> (works of doubtful attribution). However, the idea in the
    fragment quoted here is identical to that of the previous authentic quotation:
    the value of an image lies not in the material, but in the face depicted on the
    material:</p><blockquote><p><em>Q. 39.</em> If God through the Prophets forbade
    bowing down to things made by hands, then why do we bow down to icons and to the
    cross, which are the works of artists, in exactly the same way as to idols?</p><p><em>A.</em>
    <strong><mark>We the faithful do not bow down to icons as to gods, as the pagans
    do: God forbid! We only express the inclination and the love of our soul towards
    the image depicted on the icon; hence often, if the depiction wears away, we burn
    as useless wood what was formerly an icon</mark>. And as Jacob, before his death,
    bowed down over the top of Joseph’s staff, honouring not the staff itself, but
    him who held it: so we the faithful <mark>venerate icons for no other reason than
    to express our love for those holy persons who are depicted on them</mark>, acting
    in the same way as towards our fathers and friends, and as the Jews of old bowed
    down before the tablets of the law and the two golden and graven Cherubim, honouring
    not the nature of stone or of gold, but the Lord, who commanded this to be done</strong>.
    But those who out of pride do not wish to bow down before the cross and icons
    — let them say, O fools, how often have holy icons streamed forth myrrh by the
    power of the Lord? how has soulless wood, struck by an arrow, miraculously streamed
    forth blood, like a living body? how often are demons put to flight with cries
    by means of shrines, relics and icons? But in order to put the fools to shame
    the more, hear the story of an icon told by our fathers. In Jerusalem an evil
    demon attacked and troubled one of the ascetics. One day the spirit appeared before
    his very eyes and said: if you wish me to stop attacking you, do not bow down
    before this icon, and I will depart from you; and the icon was that of the Most
    Holy Mother of God. What will those who forbid bowing down before the icons of
    the saints say to this, whose faces we depict only for remembrance, and for nothing
    else? Such is the brief word on icons. <strong>As for <mark>the cross</mark>,
    it is evident that <mark>we the faithful bow down to it and kiss it for the sake
    of the Lord crucified upon it</mark>.</strong></p></blockquote><p>(To Prince Antiochus
    on the Many and Necessary Obscure Passages in the Divine Scriptures, q. 39 — <a
    href="https://bibleox.com/ru/ru/w/Lw5B_Spuria/" lang="ru">Spuria</a>)</p><h3>St
    Basil the Great, archbishop of Caesarea (c. 329–379)</h3><p>The theology of the
    image:</p><blockquote><p>For the brightness is always thought of with the glory,
    <strong>the image with the archetype</strong>, and the Son always and everywhere
    together with the Father; nor does even the close connection of the names, much
    less the nature of the things, admit of separation.</p><p>&lt;…&gt;</p><p>How,
    then, if one and one, are there not two Gods? Because <strong>we speak of a king,
    and of the king’s image</strong>, and <strong><mark>not of two kings. The majesty
    is not cloven in two, nor the glory divided</mark></strong>. The sovereignty and
    authority over us is one, and so <strong><mark>the doxology ascribed by us is
    not plural but one</mark></strong>; because <strong>the <mark>honour paid to the
    image passes on to the prototype</mark></strong>. Now <strong><mark>what in the
    one case the image is by reason of imitation, that in the other case the Son is
    by nature</mark></strong>; and as <strong>in works of art the likeness is dependent
    on the form</strong>, so in the case of the divine and uncompounded nature the
    union consists in the communion of the Godhead.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/rwa9_De_Spiritu_Sancto#HH-Chapter-18">About
    the Holy Spirit</a>)</p><blockquote><p>The Son, begotten of the Father and naturally
    imprinting the Father in Himself as an image, is not distinct from the Father;
    and in His birth He preserves in Himself consubstantiality with Him. Whoever in
    the market-place <strong>looks upon the image of the emperor and says that what
    is depicted in the picture is the emperor, does not acknowledge two emperors,
    that is, the image and him whose image it is; and if, pointing to the one painted
    in the picture, he says: “This is the emperor,” he does not deprive the prototype
    of the imperial title; better still, <mark>by acknowledging the image he confirms
    the honour paid to the emperor</mark>. For if the image is emperor, then all the
    more must he be emperor who was the cause of the image</strong>. But here wood
    and wax, and the skill of the painter, produce a corruptible image — an imitation
    of the corruptible, and an artificial one — an imitation of the created. But there,
    when you hear the word “image,” understand “the brightness of glory.” What brightness?
    And what glory? The Apostle himself explained this shortly after, adding: “and
    the express image of His person” (Heb. 1:3).</p></blockquote><p>(Homily 24. Against
    Sabellians, Arius and the Anomoeans)</p><blockquote><p>Therefore <strong>what
    word could depict them (the martyrs — ed.) worthily?</strong> Even forty mouths
    would not suffice to extol the valour of so many men. If even one had been an
    object of wonder, that alone would have been enough to exceed the power of my
    word; how much more such a multitude, this warlike company, this unconquerable
    battalion, alike invincible in battles and inaccessible to praise. Nevertheless,
    <strong><mark>recalling their image in memory</mark></strong>, I will set before
    those present the common benefit received from them, <strong><mark>showing to
    all, as it were on a painting, the valiant exploits of these men</mark></strong>;
    <strong><mark>for the valiant deeds accomplished in battles have often been depicted
    both by historians and by painters, the one adorning them with words, the other
    tracing them on panels</mark>; and by this both the one and the other have roused
    many to courage</strong>. What <strong><mark>narrative word conveys through hearing,
    painting shows silently through imitation</mark></strong>. So I too will remind
    those present of the virtue of these men and, as it were bringing their deeds
    before the eyes, will stir up to imitation those who are more courageous and more
    akin to them in will.</p></blockquote><p>(Homily 19. On the Day of the Holy Forty
    Martyrs)</p><h3>St Gregory the Theologian, archbishop of Constantinople (c. 325–389)</h3><blockquote><p>And
    perhaps even your garment is not foreign to us; since <strong><mark>it belongs
    to the Angels also to be light-bearing and radiant when they are depicted in bodily
    form</mark></strong>, which I consider a symbol of their natural purity.</p></blockquote><p>(Oration
    25. In Praise of the Philosopher Heron, §2)</p><h3>St Gregory of Nyssa, bishop
    (c. 331–394)</h3><p>Bishop Gregory delivers a sermon in the church with the relics
    of the great martyr Theodore the Recruit († 306). Above the relics there is an
    icon of Christ, and also of Theodore the Recruit himself. The history of his martyrdom
    is depicted. The walls of the church are painted. He speaks of prayer to the saint
    and of his intercession for us.</p><blockquote><p>let us consider the present
    state of the saints, how beautiful and majestic it is. For <strong>their soul,
    departed on high, abides in the place proper to it and, having been released from
    the body, dwells together with those like it</strong>; and <strong>the body, its
    honourable and undefiled organ, which has in no wise damaged by its passions the
    incorruption of the soul that dwelt in it, is buried with great honour and reverence,
    is honourably laid in a sacred place, as a kind of most precious treasure kept
    until the time of the resurrection</strong>, in many ways <strong>incomparable
    with any other myriads</strong> dissolved by the death common to all and ordinary
    — and that in matter of the same nature. For of the remains of all others the
    greater part of men are disdainful; no one passes by a grave with pleasure, and
    when he unexpectedly sees an open grave, then, having looked upon the unsightliness
    of what lies there, full of unpleasant feeling and with a heavy sigh over the
    lot of mankind, he hastens rather to flee away. But whoever enters any place like
    this one, <strong>where today we have gathered, where the memory of the righteous
    is kept and where his holy remains lie</strong>, will first console his soul with
    the splendour of what presents itself to his eyes, <strong>seeing this house as
    the <mark>church of God</mark></strong>, brightly adorned, and with the majesty
    of its structure and the splendour of its ornaments, where the carver has given
    wood the form of various animals, and the stone-cutter has polished the stone
    slabs to the smoothness of silver. And the painter has adorned it with artful
    colours, <strong><mark>depicting on the icon the valiant exploits of the martyr</mark>,
    his firm standing at the trial, the tortures, the beast-like faces of the tormentors,
    their acts of violence, the furnace burning with flame, the most blessed end of
    the athlete, <mark>the portrayal of the human image of Christ, the giver of the
    contest</mark></strong>; having skilfully traced all this for us in colours, as
    in some explanatory book, he clearly <strong>told the exploits of the martyr and
    brightly <mark>adorned the church</mark></strong>, as it were a flowering meadow
    (for painting also knows how to speak silently <strong><mark>on the walls</mark></strong>
    and to afford the greatest benefit). And the setter of multicoloured stones has
    made the trodden floor worthy of the event described.</p><p>Having consoled his
    sight with these sensibly perceived works of art, (the visitor of the church)
    <strong>at last desires to draw near also to the shrine, esteeming the very touching
    of it as sanctification and blessing</strong>. <strong>If anyone is permitted
    to take earth lying on the surface of the place of his repose, he receives the
    dust as a gift and gathers the earth as a treasure</strong>. If anyone is <strong>fortunate
    enough to be able to touch the remains themselves</strong>, how desirable this
    is, and of how elevated a prayer it is esteemed a gift, they know who have experienced
    it and who were themselves animated by this desire. Those who look upon them <strong>kiss
    them as a most living and life-flourishing body, bringing them to their eyes,
    lips, ears, to all the senses</strong>; then, shedding tears of reverence and
    heartfelt tenderness, <strong><mark>they offer prayer for intercession</mark></strong>,
    as to the <strong><mark>martyr</mark></strong> himself seen whole before them,
    <strong><mark>beseeching him as the armour-bearer of God</mark></strong>, calling
    upon him as one who receives and conveys the gifts (of prayer) when he so wills.
    From all this know, pious people, that “precious in the sight of the Lord is the
    death of His saints” (Ps. 116:15). For <strong>one and the same body in all men,
    being composed of the same matter; but one dies an ordinary death, falls as it
    happens; another, graced with martyric suffering, is so highly honoured and desired
    by all</strong>, as we said above.</p></blockquote><p>(Encomium of the Great Martyr
    Theodore the Recruit)</p><h3>St Amphilochius of Iconium, bishop (c. 340–394)</h3><p>The
    hierarch calls iconoclasm a heresy:</p><blockquote><p>Why do you, sons of truth,
    present here in the Holy and Catholic Church, never cease to grieve? If there
    is any cause for this, tell me, disclose it to me, as beloved children to a father
    full of love, so that you may receive consolation from it. For it is unbecoming
    for those who have been clothed <strong>from their very birth</strong> through
    holy Baptism in Christ, our true God, to suffer and be tormented with sorrow.
    God forbid! The most blessed Paul commands to rejoice unceasingly, when he says:
    “Rejoice in the Lord always. Again I will say, rejoice! Let your gentleness be
    known to all men” (Phil. 4:4-5).</p><p>What, then, is the cause of this despondency?
    Explain it, though even before the explanation I have understood it clearly: God
    made it known to my unwisdom. I know, I know, that the envious devil assails your
    heart with impure and defiled thoughts and darkens the rational eye of the soul.
    To some he suggests ungodly blasphemies and other terrible and absurd thoughts.
    <strong>Into others he <mark>instils heresies</mark></strong>, dark imaginings,
    and, wicked one, perverts for them the mysteries of the faith. <strong>Some he
    inclines to vainglory, and others he <mark>arms against the holy icons, calling
    them useless and superfluous</mark></strong>. Some he incites to harlotry and
    sensuality and other most abominable vices; and especially in church, at the time
    of prayer, he pierces the hearts of fainthearted people who have no strength to
    resist. And some he brings to the point of not believing <strong>in the immortal
    and life-giving Eucharist and of being tormented with perplexity, as he explains
    to them that this is simple bread, simple wine, and nothing more.</strong></p></blockquote><p>(Homily
    on Repentance, or on the Fact That One Must Not Despair of Salvation)</p><h3>St
    John Chrysostom, archbishop of Constantinople (c. 347–407)</h3><p>A sermon on
    St Meletius, archbishop of Antioch:</p><blockquote><p>In truth, just as some wondrous
    root, hidden in the depths of the earth, though itself unseen, nevertheless reveals
    its good power through its fruits, so also <strong>blessed Meletius, hidden in
    this tomb</strong>, though himself invisible to us to the eyes of the body, nevertheless
    reveals through you his fruits, the power of his grace; and even if we were to
    keep silence, this festival itself and your fervent zeal would be sufficient to
    proclaim more loudly than trumpets the love of <strong>St Meletius</strong> for
    his children… At the very beginning, when he arrived in the city and you received
    him, each of you gave his child his name, thinking by this name to bring the saint
    into his house, and mothers, bypassing fathers, grandfathers and great-grandfathers,
    gave newborn children <strong>the name of blessed Meletius</strong>. &lt;…&gt;
    <strong><mark>Yet you cherished such attachment not to his name only, but also
    to his outward appearance. As you acted with his name, so you acted with his depiction.
    Many traced this </mark><u><mark>holy image</mark></u><mark> on rings in place
    of gems, and on seals, and on cups, and on the walls of rooms, everywhere, so
    as not only to hear his holy name, but also to see his bodily image everywhere</mark></strong>,
    and to have a double consolation in separation from him.</p></blockquote><p>(An
    Encomium on Our Holy Father Meletius, Archbishop of Great Antioch, and on the
    Zeal of Those Who Had Assembled)</p><blockquote><p>For like a conflagration indeed,
    or like a thunderbolt hurled from on high, have they lighted upon the roof of
    the Church, and yet they rouse up no one; but whilst our Father’s house is burning,
    we are sleeping, as it were, a deep and stupid sleep. And yet who is there whom
    this fire does not touch? <strong><mark>Which of the statues that stand in the
    Church?</mark></strong> for the Church is nothing else than a house built of the
    souls of us men.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-ephesians-1#HH-Ephesians-41-3">Homilies
    on the Epistle to the Ephesians, Homily X</a>)</p><blockquote><p>Let us beseech
    the Lord of the Angels, and He will send one Angel who will scatter all the army
    of the enemies. <strong><mark>I was pleased also with the picture made of wax
    and full of piety. I saw on the depiction the Angel</mark></strong> who drives
    away the hordes of the barbarians, I saw the barbarian tribes trampled underfoot,
    and David who truly cried out: “Lord, when You awake, You shall despise their
    image” (Ps. 73:20).</p></blockquote><p>(Homily on the Fact That There Is One Lawgiver
    of the Old and New Testaments, Also on the Vesture of the Priest, and on Repentance)</p><p>The
    theology of the image:</p><blockquote><p><strong>Hear God Himself saying, <em>“Let
    us make man in Our Image,</em></strong><em> after Our likeness.”</em> (Gen. 1:26)
    But if thou sayest that man is not of the same substance as God,—what matters
    that? For <strong>neither was the brazen statue of the same substance as the Emperor;
    yet nevertheless, they who defied it paid the penalty</strong>. Thus also with
    regard to mankind, if men are not of the same substance as God, (as indeed they
    are not), <strong>still they have been called His image; and it were fitting they
    should receive honour on account of the appellation</strong>. But thou for the
    sake of a little gold dost trample them under foot, dost throttle them, and drag
    them away; and hast not to this day in any wise paid the penalty!</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/chrysostom-the-homilies-on-the-statues-to-the-people-of-antioch-1#HH-Homily-III">The
    Homilies on the Statues to the People of Antioch, Homily III</a>)</p><blockquote><p><strong>The
    accusers of Christians, the so-called iconoclasts, have scandalized many</strong>,
    as have also the Paulicians, who share the heresy of the Manichaeans. They did
    not seek their foundation in the divine Scriptures, but take cover in a lie and
    establish themselves in it. But we speak, following the Gospel and holding to
    the Orthodox teaching, as the holy Catholic Church of God has received it</p></blockquote><p>(Conversations
    on the Psalms — <a href="https://bibleox.com/ru/ru/w/Lw5B_Spuria/" lang="ru">Spuria</a>)</p><blockquote><p>To
    the Church He has returned her own beauty and <strong>the splendour of the holy
    and precious icons, and to us who bow down before them and kiss them</strong>,
    and who keep His divine commandments, He grants firm peace and forgiveness of
    sins each day. To Him be glory and dominion and honour and worship, unto the ages
    of ages. Amen.</p></blockquote><p>(On the Precious Cross — <a href="https://bibleox.com/ru/ru/w/Lw5B_Spuria/"
    lang="ru">Spuria</a>)</p><h3>Blessed Jerome of Stridon, monk (c. 347–419)</h3><p>This
    discourse of St Jerome is not about icons, but about the lighting of candles as
    a <strong>form of veneration </strong>of God and the saints. This quotation is
    apt for several reasons:</p><p>1. Jerome answers the same primitive manner of
    accusing of idolatry which the iconoclasts use and which rests only on outward
    similarity to pagan customs: the pagans do so, therefore you are pagans. Jerome’s
    answer is constructed in the same way as the defence of icon veneration — attention
    is turned to the essence, not to the form. His main thought is that although God
    and the saints have no need of lamps, the good intention directed to the saints
    is accepted, since what is venerated is truth, not pagan fables (falsehoods).</p><p>2.
    The lighting of lamps as a form of the veneration of God and the saints is directly
    connected with the veneration of icons. The Orthodox light candles before icons
    as a sign of reverence for God and the saints. This was the practice before the
    Seventh Ecumenical Council (<a href="#HH-Blessed-John-Moschus-c-550619">quote</a>),
    and at the Council it was fixed dogmatically (<a href="#HH-The-Seventh-Ecumenical-Council-Nicaea-787">quote</a>).</p><blockquote><p><em>As
    to the question of tapers, however, </em><strong><em>we do not, as <mark>you in
    vain misrepresent us</mark>, light them in the daytime, but by their solace we
    would cheer the darkness of the night, and watch for the dawn, lest we should
    be blind like you and sleep in darkness</em></strong><em>. And if some persons,
    being ignorant and simple minded laymen, or, at all events, religious women—of
    whom we can truly say, (Rom. 10:2) “I allow that they have a zeal for God, but
    not according to knowledge”—</em><strong><em><mark>adopt the practice in honour
    of the martyrs</mark></em></strong><em>, what harm is thereby done to you? </em><strong><em>Once
    upon a time even the Apostles pleaded that the ointment was wasted, but they were
    rebuked by the voice of the Lord</em></strong><em> (Matt. 26:8; Mark 14:4). </em><strong><em>Christ
    did not need the ointment, nor do martyrs need the light of tapers; and yet that
    woman <mark>poured out the ointment in honour of Christ, and her heart’s devotion
    was accepted</mark>. All those who light these tapers have their reward according
    to their faith</em></strong><em>, as the Apostle says: “Let every one abound in
    his own meaning.” </em><strong><em><mark>Do you call men of this sort idolaters?</mark></em></strong><em>
    I do not deny, that all of us who believe in Christ have passed from the error
    of idolatry. For we are not born Christians, but become Christians by being born
    again. And </em><strong><em><mark>because we formerly worshipped idols, does it
    follow that we ought not now to worship God lest we seem to pay like honour to
    Him and to idols? In the one case respect was paid to idols, and therefore the
    ceremony is to be abhorred; in the other the martyrs are venerated, and the same
    ceremony is therefore to be allowed</mark>.</em></strong></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/jerome-against-vigilantius">Against Vigilantius</a>)</p><h2>5th
    century</h2><h3>St Asterius of Amasea, bishop († before 431)</h3><blockquote><p>Having
    gone out of my house, I walked with acquaintances for some time about the city
    square, and then <strong>went into the church of God</strong> to pray. Entering
    it, <strong><mark>I saw in one of the porticoes a painting the sight of which
    struck me</mark></strong>. One might have thought it was painted by Euphranor
    or another ancient painter, who brought the art of painting to great perfection
    and made their pictures almost living. If you wish to hear me, I shall explain
    the picture, for my free time allows me to occupy myself with this. Being pupils
    of the Muses, <strong>we too have at our disposal colours (words — ed.) no worse
    than those of painters</strong>.</p><p>There was a certain chaste maiden who dedicated
    her virginity to God. Her name was Euphemia. When a tormentor raised a persecution
    against the followers of piety, she very willingly gave herself over to death.
    Her fellow-citizens and followers of the same religion for which she was given
    over to death, honouring her courage and holy virginity, <strong>built for her
    a tomb near the church, and having laid her there in a coffin, pay her <mark>reverence</mark>,
    celebrate each year the day of her death, and in her memory hold a public and
    universal festival</strong>. The sacred ministers of the mysteries of God then
    pronounce words of praise in her honour, and eloquently recount to the assembled
    people how she accomplished the contest of martyrdom. A certain <strong><mark>pious
    painter</mark> with great skill and very vividly represented on a picture the
    history of all her sufferings, and <mark>hung this picture near her tomb</mark>,
    so that all might look upon it</strong>.</p></blockquote><p>(Homily on the Icon
    of the Holy Martyr Euphemia)</p><h3>St Nilus of Sinai, monk († before 450)</h3><blockquote><p>You
    write to me that <strong>you are preparing to erect a majestic church in honour
    of the holy martyrs and of Christ Himself, glorified by their martyr exploits</strong>.
    You ask whether <strong><mark>it will be fitting to place icons in the sanctuary</mark></strong>,
    and to paint the walls on both sides with depictions of the hunting of animals,
    showing nets stretched on the ground, hares and roe deer fleeing in flight and
    other animals pursued by hunters with dogs, and also nets cast into the sea, caught
    fish drawn ashore by the hands of the fishermen, and besides this various stucco
    reliefs. In the place of the common assembly of the faithful <strong>you wish
    to depict a multitude of crosses</strong>, as well as various birds, beasts, creeping
    things and plants.</p><p>In answer to your letter I say that it is fitting to
    beguile the faithful with such pictures only when they are children. <strong>For
    a mature and discerning man it is fitting to <mark>depict the cross on the eastern
    side of the church</mark>. For by the cross the human race was saved, and by it
    hope is preached to all who despair. <mark>Let the hand of a skilled painter fill
    the holy church with histories of the Old and New Testaments</mark>, so that the
    illiterate, unable to read the Divine Scripture, looking upon the painted depictions,
    may call to mind the exploits of those who served the true God. This will stir
    up in them zeal for like exploits, by which earth is exchanged for heaven and
    the visible is counted preferable to the invisible. In the place of the common
    assembly of the faithful, divided into many aisles, it is necessary <mark>to furnish
    every church with a cross</mark></strong>, and to leave out everything superfluous.</p></blockquote><p>(58.
    To the counts Olympiodorus)</p><blockquote><p>In every place and at different
    times the Lord works wonders, calling those of little faith and the unbelieving
    to firm faith and multiplying the faith and hope of the faithful. Of thousands
    of wonders I <strong>wish to tell you of a wonder of the martyr Plato (already
    departed — ed.)</strong>.</p><p><strong>On the mountain called Sinai, where Moses
    received from God the tablets of the Covenant</strong>, monks dwelt. Among them
    laboured also the elder the Galatian with his son, who loved the solitary life.
    Once barbarian pagans suddenly burst in — men utterly desperate. They took the
    monks captive without difficulty, and among them the son of the elder the Galatian;
    having bound their hands, they led them away into the desert, driving the hungry
    and naked and unshod through waterless and impassable places. <strong>The elder,
    having hidden himself in a cave, prayed tearfully to the Lord Christ for his son
    and <mark>called upon the martyr Plato for help</mark>.</strong> At the same time
    the elder’s son, being in captivity, <strong><mark>besought God, through the prayers
    of the martyr Plato</mark></strong>, to be merciful to him and to work a wonder.</p><p>Their
    prayers were heard. And behold, <strong>the martyr Plato suddenly appeared to
    the young man</strong>, sitting on a horse and leading another saddled horse.
    <strong>The young man recognized him at once, because <mark>he had often seen
    the depiction of the saint on icons</mark></strong>. The martyr commanded him
    to rise at once and, taking the horse, to mount it. And immediately, like a spider’s
    web, the bonds that bound him were torn asunder. Following the holy martyr on
    horseback, the young monk quickly reached the cave where the elder was praying
    and weeping. And the victorious martyr who had saved the young man became invisible.</p></blockquote><p>(59.
    To the Silentiary Heliodorus)</p><h3>Blessed Theodoret of Cyrrhus (c. 386–457)</h3><blockquote><p>from
    all sides the people streamed to Simeon, and the way to him became like a river;
    the very place of his exploits resembled a sea into which numerous streams pour.
    For to him hastened not only the inhabitants of our country, but also the Ishmaelites,
    the Persians, the Armenians subject to the Persians, the Iberians, and the Homerites;
    there came also men of the tribes neighbouring them. There came also many people
    living on the most distant borders of the west: Spaniards, Britons, Gauls and
    others dwelling between them. And of Italy there is no need to speak, for they
    relate that <strong>in great Rome <mark>this man enjoys such fame that small depictions
    of him are fastened on the gates of all the workshops</mark> in the hope of receiving
    through them protection and security.</strong></p></blockquote><p>(A History of
    the Monks of Syria, Symeon the Stylites)</p><h2>6th century</h2><h3>St Gregory
    the Great (the Dialogist), pope of Rome (c. 540–604)</h3><blockquote><p><strong><em><mark>I
    have sent to you</mark></em></strong><em> with the deacon Dulnidus those </em><strong><em><mark>icons</mark></em></strong><em>
    which you had asked for. This request of yours pleased me, for it proves that
    with all your heart and all your mind you strive toward Him whose image you wish
    to have, and that you wish by daily beholding His depiction to strengthen your
    love for Him. </em><strong><em>Led through the visible to the invisible, we do
    not depart from the truth. I am certain that you wish to have the icon of the
    Savior not so as to make a god of it, but so that, remembering the Son of God,
    you may be established in love for Him. For we, <mark>when we venerate an icon,
    we do not venerate the icon itself</mark>, but Him whose birth, or passion, or
    glorification is depicted on it.</em></strong><em> Therefore, remembering His
    resurrection and passion, we are quickened in spirit. And I have sent to you </em><strong><em>two
    panels with images of the Lord the Savior and of the Most Holy Mother of God Mary,
    as well as of the blessed Apostles Peter and Paul; and over and above this a Cross</em></strong><em>,
    so that the One crucified upon it may defend you and preserve you from the wiles
    of the evil one, and that you may be established in virtue and keep love for Him
    to the end, since out of love for Him you seek solitude (Book 9, Ep. 52).</em></p></blockquote><p>(Letter
    to Secundinus, Book 9, Epistle 52)</p><h3>Blessed John Moschus (c. 550–619)</h3><p>The
    “Spiritual Meadow” was compiled by John together with his disciple, Sophronius,
    patriarch of Jerusalem, from the sayings of the monks of various monasteries.</p><blockquote><p><strong>“Stop
    venerating this image,” the devil said to him</strong> — “and I will cease my
    warfare against you. <strong><mark>On the icon was the depiction of our Lady the
    Most Holy Mother of God Mary with the Pre-eternal Infant — our Lord Jesus Christ</mark></strong>.</p><p>“Let
    me think it over,” the elder answered.</p><p>The next day the elder told everything
    to Abba Theodore the laborer, who was then living in the Laura of Pharan. From
    him we learned of it.</p><p>“Truly, Abba, you were mocked, because you swore an
    oath,” Abba Theodore said to him — “but you did well in not keeping silence. <strong><mark>Know
    that there is no sin more destructive and more terrible than to renounce the veneration
    of our Lord Jesus Christ and of His Mother</mark></strong>.</p></blockquote><p>(The
    Spiritual Meadow, 45. The life of the monk who struggled on the Mount of Olives,
    and on the veneration of the image of the Most Holy Mother of God)</p><blockquote><p>This
    is what the fathers told us further. “Not long ago,” they said, “a God-loving
    woman from the region of Apamea was digging a well. She spent a great deal and
    dug down to a great depth, but found no water. Despondency came upon her: she
    was sorry both for the wasted toil and for the money. One day she sees an unknown
    man, who says to her: ‘<strong><mark>Send and bid them bring the image of Abba
    Theodosius</mark></strong> from the monastery of Skopelos, and <strong>God, at
    his prayer, will give you water</strong>’. The woman at once dispatched two men,
    and, <strong><mark>receiving the image of the saint from their hands</mark></strong>,
    lowered it into the well. And at once water appeared, filling the cistern to half.
    Those who <strong><mark>took the icon out of the water brought it also to us</mark></strong>,
    and we drank and with one accord glorified God.”</p></blockquote><p>(The Spiritual
    Meadow, 81. On the well in which water appeared through the wonderworking power
    of the image of St. Theodosius)</p><blockquote><p>In the cave <strong><mark>the
    elder had an image of the Most Holy Most Pure Lady our Mother of God and Ever-Virgin
    Mary, with the Pre-eternal Infant, our God, in her arms</mark></strong>. Wherever
    the elder decided to go away — whether into the depths of the desert, or to Jerusalem
    <strong><mark>to venerate the holy cross and the holy places, or to Mount Sinai
    for prayer, or to the martyrs at rest</mark></strong> in places far from Jerusalem
    — for the elder was a great venerator of martyrs, and he went now to St. John
    at Ephesus, now to St. Theodore at Euchaïta, now to Seleucia, to St. Thecla in
    the land of the Isaurians, now to St. Sergius at Saphas, now to one holy man,
    now to another — <strong><mark>on leaving he would set up a candle and light it
    according to his custom, and then, standing to pray and asking God to direct his
    path</mark></strong>, he would cry out, <strong><mark>gazing upon the icon of
    the Lady: “Most Holy Lady, Mother of God</mark></strong>, I am going on a long
    journey, for many days. Take care of Your candle and preserve it, that it may
    not go out before You until my return. And I go in hope of Your help during the
    journey.” Having uttered these words before the icon, he set out on his way. And,
    having completed the intended journey, which sometimes lasted a month, sometimes
    two or three, and at times as long as five or six months, he found the candle
    burning at home</p></blockquote><p>(The Spiritual Meadow, 180. The life of the
    hermit John, who dwelt in a cave near Socho)</p><h3>Paul the Silentiary, court
    poet (c. 520–575)</h3><p>The painted decoration of the Church of Holy Sophia in
    Constantinople from the time before Iconoclasm:</p><blockquote><p>…the discs of
    the sharp circle he hollowed out with the graver,</p><p>in the midst of which
    <strong>he carved the image of the deathless God,</strong></p><p><strong>of the
    Unbegotten, who had taken upon himself the likeness of mortal form</strong>,</p><p>where
    he carved the host of winged messengers,</p><p>&lt;…&gt;</p><p>In another place
    <strong>art depicted the Mother of Christ,</strong></p><p><strong>the vessel of
    eternal light</strong>, whose womb of old</p><p>with holy loins nourished the
    Maker of all.</p><p>&lt;…&gt;</p><p>One of them depicted the reverence before
    the countenance of Christ:</p><p>this one, with the skillful hand of her craft,
    implanted</p><p>not carving, not stitches drawn through the cloth,</p><p>but a
    weave interlacing many-colored threads,</p><p>threads of divers kinds, which the
    barbarian ant gathered.</p><p>The gold-shining gleam with the rays of the rose-fingered
    dawn</p><p>was simply mirrored upon the Godlike limbs,</p><p>and the Tyrian tunic,
    sea-hued with purple,</p><p>bending the right shoulder beneath the artful threads;</p><p>for
    there the cover of the garment had slipped,</p><p>flowing fair along the edge
    above the shoulder</p><p>and pouring over the left; <strong>but from its covering
    was bared</strong></p><p><strong>the hand and the edge of the palm. She seems
    to stretch forth the fingers</strong></p><p><strong>of the right hand, as if proclaiming
    a life-giving word</strong> (a rhetorical gesture — tr.)<strong>,</strong></p><p><strong>holding
    in her left the book that knows the sacred words,</strong></p><p><strong>the book</strong>
    (the Gospel — tr.), proclaiming that by the saving counsel</p><p>the Lord himself
    accomplished, having planted his foot upon the earth.</p><p>And all the golden
    garment gleams; for upon it</p><p>a fine translucent gold, twisted round the threads,</p><p>like
    now a pipe, now a flute,</p><p>is fastened over the cloth with a lovely binding,</p><p>bound
    with sharp stitches and with threads of silk.</p><p><strong>And standing on either
    side are two messengers of God,</strong></p><p><strong>Paul</strong>, the man
    filled with all God-receiving wisdom,</p><p>and the sturdy keeper of the keys
    of the gates above heaven,</p><p>commanding both the bonds of heaven and of earth;</p><p><strong>one
    unlooses</strong> the pure womb’s <strong>decrees</strong></p><p><strong>the book</strong>,
    <strong>while the other bears the image of the cross on a golden staff</strong>.</p><p>Both
    are clothed in garments beneath the silvery</p><p>of cunningly woven fabric; and
    upon their immortal heads</p><p>the golden vault of the temple is curved, threefold</p><p>awakening
    the beauty of the vault; it stands fixed</p><p>upon four golden columns.</p></blockquote><p>(Ekphrasis
    of the Church of Holy Sophia)</p><h2>7th century</h2><h3>St Sophronius of Jerusalem,
    patriarch (c. 560–638)</h3><p>On the arrangement of the church:</p><blockquote><p>The
    kosmites (κοσμήτης) corresponds to the Old Testament sacred kosmion (κοσμίον),
    representing <strong><mark>an image of the crucified Christ adorned with a cross</mark></strong>;
    at times, however, the kosmites is fashioned in the form of a veil.</p></blockquote><p>(A
    fragment from the discourse on the Divine Liturgy)</p><blockquote><p>The holy
    day of the Exaltation of the Cross had already come, and I was still running about,
    hunting after youths. At dawn I see everyone hurrying to <strong>church</strong>,
    and I too set off running with the rest. <strong>I came with them to the narthex
    of the temple</strong>. When the hour of the holy Exaltation arrived, I was pushing
    and being jostled in the crowd pressing toward the doors. Already at the very
    doors of the temple, through which there appeared to the people the Life-giving
    Wood…</p><p>&lt;…&gt;</p><p>I withdrew and stood in a corner of the narthex. And
    only then did I begin to understand the reason that forbade me to see the Life-giving
    Cross. The word of salvation touched the eyes of my heart, <strong>showing me
    that the uncleanness of my deeds barred my entrance</strong>. I began to weep
    and to grieve, striking my breast and groaning from the depths of my heart. <strong>I
    stand and weep, and <mark>I see above me an icon of the Most Holy Mother of God</mark>,
    and I say to her, never taking my eyes from her:</strong></p><p><strong>“O Virgin,
    Lady, who gave birth in the flesh to God the Word, I know that <mark>it is not
    fitting for me, defiled and debauched, to look upon your icon</mark>, O Ever-Virgin
    — yours, O Pure One, yours who have kept body and soul in purity and undefilement</strong>.
    I, a corrupt woman, justly must inspire hatred and loathing before your purity.
    But if, as I have heard, <strong>God, born of you</strong>, became man in order
    to call sinners to repentance, <strong>help me who am alone and have no help from
    anywhere</strong>. Command that the entrance into the church be opened to me;
    deprive me not of the possibility of looking upon that Wood on which in the flesh
    was nailed the God born of you, and who shed His own blood as a ransom for me.
    But command, O Lady, that the door of the sacred veneration of the Cross be opened
    for me also. And <strong><mark>you I summon as a sure guarantor before God, your
    Son</mark></strong>, that never again will I defile this body with shameful union,
    but as soon as I see the Wood of the Cross of your Son, I will at once renounce
    the world and all that is in the world, and go wherever you, the Guarantor of
    salvation, command and lead me.”</p><p>So I spoke, and as though having found
    a certain hope in ardent faith, encouraged by the mercy of the Mother of God,
    I left the place where I had stood at prayer.</p><p>&lt;…&gt;</p><p>Here I had
    not even water, burning terribly with thirst and growing faint. A mad craving
    for riotous songs would take hold of me, greatly troubling me and prompting me
    to sing the songs of demons which I had once learned. But at once, with tears,
    I would strike my breast and remind myself of the vow I had made on going into
    the desert. <strong>I would return in my mind to the <mark>icon of the Mother
    of God</mark> that had received me, and cry to her, entreating her to drive away
    the thoughts</strong> that assailed my wretched soul.</p></blockquote><p>(The
    Life of St Mary of Egypt)</p><blockquote><p>But after receiving communion, through
    the working of the enemy, he fell into despondency and, lying down upon his bed,
    soon fell asleep from grief. In a dream the martyrs appeared to him and comforted
    him. Several days later he saw in a dream the martyrs presenting themselves before
    him and bidding him follow them. “Having come,” he related, “to a certain temple
    that formed the summit of perfection, fearsome and majestic in appearance, and
    reaching with its height to the very heavens, and having entered within it, <strong>we
    saw a most great and marvelous <mark>icon</mark>, in the middle of which Christ
    was depicted in colors</strong>, while <strong>the Mother of Christ, our Lady
    the Mother of God and Ever-Virgin Mary</strong> stood at His left side, and on
    His right <strong>John the Baptist and Forerunner of the same Savior</strong>,
    who had foretold Him with his leaping in the womb; depicted there too were certain
    of the glorious company of the <strong>apostles</strong> and of the <strong>prophets</strong>,
    and from the choir of the <strong>martyrs</strong>; among them were found these
    same <strong><mark>martyrs, Cyrus and John</mark>. Standing before the Lord, they
    prayed to Him, bending their knees and bowing their heads to the floor, and <mark>made
    intercession</mark></strong> for the healing of the young man. But Christ gave
    them no answer. They prayed again, and again received no answer; at last, the
    third time, they prayed long and, lying prostrate, cried out only: “Lord, command
    it.” The Lord Christ, as one truly merciful, made a gesture and spoke from the
    icon: “Give it to him.” Then the martyrs rose from the ground, offering first
    thanksgiving to Christ our God that He had heard their prayer, and then said with
    joy and exultation: “Behold, for our sake the Lord has granted you grace. Go then
    to Alexandria, and remain there, fasting in the great Petropylon; then <strong>take
    a little oil in a vial from the <mark>lamp burning before the image of the Savior</mark></strong>,
    and again, without tasting food, come here, anoint your legs with it, and you
    will receive healing.</p></blockquote><p>(The Miracles of the Holy Martyrs Cyrus
    and John, miracle 36)</p><blockquote><p><strong>O, divine and incorporeal (bodiless)
    Hosts of God</strong>! O, Minds endowed with spirit and understanding! Yet it
    is better to proclaim and magnify you gradually and in order, and to <strong>call
    upon you in prayer</strong>. O you Seraphim, furnished with six wings and set
    in the first rank of the heavenly Hosts, with your fervor (zeal and love for God)
    you set all the other Angels aflame. You who, because of your unshaken steadfastness
    and your freedom from flesh and materiality — a property granted you from eternity
    — and by the power of knowledge and of burning, bear within yourselves a certain
    image of the Divine likeness;</p><p>&lt;…&gt;</p><p>Therefore, because of the
    power of setting aflame and purifying with which you are endowed, and by which
    you have learned to consume and to cleanse every evil and every impurity — being
    marked by the names of “burners” and “consumers” — <strong>I entreat you</strong>:
    purify the inward inclinations (excessus) of my soul from the filth of the passions
    and from the thorny matter bound up with them, and, having burned it away, implant
    the divine word in my breast; and after the darkness of my heart has been cast
    out and dispelled within me, enlighten the perceptions of my mind.</p><p>&lt;…&gt;</p><p><strong>O,
    holy Archistrategos</strong>, guide of those who go astray, restorer of the fallen,
    defender of souls, guardian of bodies, driver away of demons, and enlightener
    of all creation — then, <strong>I entreat you</strong>, then do not refuse me
    <strong>to be my faithful protector</strong> in my estate. O, most holy Michael,
    you who established in the promised land the people of Israel when by God’s command
    it had crossed the Red Sea, and armed Joshua against its enemies, and delivered
    the tabernacle of Moses from the fierce enemy, and moreover enlightened the souls
    of many other saints — enlighten also my inward senses and illumine the eye of
    my soul;</p><p>&lt;…&gt;</p><p>Therefore, since you are adorned with so great
    a glory and filled with such prerogatives, it is just that <strong>I ask and pray
    for your favorable regard toward me</strong>, O good and all-immaculate Angels
    and Archangels; your magnificence, O pure spirits, I implore: to keep my life
    unharmed, my hope unshaken, my conduct blameless, my love for God and for neighbor
    unchanged and free from every loss. I pray: lead me in all things and direct me
    upon every saving and God-pleasing path. Again, O divine spirits, <strong>I desire
    that you should pray, and above all pray to God for me</strong></p><p>&lt;…&gt;</p><p>And
    even more, instead of the good and honorable deeds on which one might place hope,
    bring forth into the midst the boundless mercy of God, praying the tender-hearted
    and merciful God — O you, most worthy of praise and most exalted Minds — that,
    <strong>through your intercession</strong>, all those sorrows, illnesses, afflictions,
    and calamities which I have ever endured in my life may be deemed worthy to be
    accepted in requital for my evil deeds; and that, instead of condemnation and
    those terrible torments which I have justly deserved, my sufferings may be allowed
    to procure for me relief and forbearance</p><p>&lt;…&gt;</p><p><strong>I entreat
    you, and I will not cease to entreat you to the end of my life</strong> — you
    who illumine all things and bear, by God’s commission, his common ministry, and
    therefore set forth to view your known royal dignity, in that with scepter and
    staff and spear, with these in your hands <strong><mark>you are depicted on icons</mark></strong>,
    you visibly display the power to subdue and to punish bestowed upon you — then,
    then, <strong>I entreat you</strong>, be merciful to me, wretched and miserable
    as I am, as the most kindly princes of that King, and spare me, and <strong>through
    your intercession with God</strong> deliver me from that sorrowful and wrathful
    sentence which sends into the everlasting fire.</p><p>&lt;…&gt;</p><p><strong>O,
    Lord, Savior, God and Word,</strong> you who dwell in the highest, who have no
    beginning and hold all things in your power, who possess great might and give
    life to all and strike with awe; &lt;…&gt; O, Immortal Bridegroom, grant us to
    hear the voice of your blessing! O, Benefactor, number me among the righteous
    and make us partakers of your joy — <strong>through the prayers of your all-immaculate
    Mother, and of the holy Angels, and the Apostles, and the Prophets, and the Martyrs,
    and all the righteous who have been from the ages</strong> — you who, with your
    Father and the Holy Spirit, are blessed now and ever, and unto the ages of ages.
    Amen</p></blockquote><p>(In Praise of the Holy Archangels, and the Angels, and
    All the Other Heavenly Powers)</p><h3>The Fifth–Sixth (Quinisext) Council — Constantinople,
    in Trullo (691)</h3><blockquote><p>In some pictures of the <strong><mark>venerable
    icons</mark></strong>, a lamb is painted to which the Precursor points his finger,
    which is received as a type of grace, indicating beforehand through the Law, our
    true Lamb, Christ our God. Embracing therefore the ancient types and shadows as
    symbols of the truth, and patterns given to the Church, we prefer “grace and truth,”
    receiving it as the fulfilment of the Law. In order therefore that “that which
    is perfect” may be delineated to the eyes of all, at least in coloured expression,
    <strong><mark>we decree that the figure in human form of the Lamb who taketh away
    the sin of the world, Christ our God, be henceforth exhibited in images, instead
    of the ancient lamb</mark></strong>, so that all may understand by means of it
    the depths of the humiliation of the Word of God, and that we may recall to our
    memory his conversation in the flesh, his passion and salutary death, and his
    redemption which was wrought for the whole world.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-council-in-trullo-quinisext#HH-Canon-LXXXII">The
    Canons of the Council in Trullo (Quinisext), Canon 82</a>)</p><p>What icons must
    not be:</p><blockquote><p><em>“Let thine eyes behold the thing which is right,”
    orders Wisdom, “and keep thine heart with all care” </em>(Prov. 4:25, 23), for
    the bodily senses easily bring their own impressions into the soul. Therefore
    <strong>we order that henceforth there shall in no way be made pictures, whether
    they are in paintings or in what way so ever, which attract the eye and corrupt
    the mind, and incite it to the enkindling of base pleasures</strong>. And if any
    one shall attempt to do this he is to be cut off.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-canons-of-the-council-in-trullo-quinisext#HH-Canon-C">The
    Canons of the Council in Trullo (Quinisext), Canon 100</a>)</p><h2>8th century</h2><h3>St
    Gregory II, pope of Rome (669–731)</h3><blockquote><p>But if you [emperor] walked
    rightly, who has captivated your hearing and bowed your heart like a bent bow
    (Ps. 78:57), so that you have turned round face backward? <strong>For ten years
    you, by the mercy of God, walked your path rightly; <mark>it never even entered
    your mind to persecute the holy icons</mark>: but now you say that they occupy
    the place of idols and that those who venerate them are idol-worshippers, and
    you have resolved to destroy them utterly</strong>. And you did not fear the judgment
    of God, bringing scandal into the hearts of men not only of the faithful but of
    the unfaithful. Christ commands you not to scandalize a single one of these little
    ones, for even for a small scandal one must go into the everlasting fire (Luke
    17:2). But you have scandalized the whole world! As though you do not expect to
    behold death and to give a wretched answer for this! <strong>You write that one
    must not venerate the work of hands, nor any likeness, of what things soever in
    heaven above and on earth beneath, as the Lord said (Exod. 20:4), and you say:
    show me who commanded us to honor the works of hands and to venerate them</strong>.
    — And I confess that this is the enactment of God. And <strong>why, as emperor
    and head of the Christians, did you not ask the believing learned men about this?
    From them you would have learned in full why God called idols the work of hands</strong>,
    and you would not have troubled and brought into doubt and confusion the inexperienced.
    <strong><mark>But you have renounced our holy fathers and teachers</mark>, although
    you gave your own written promise to obey and to follow them. Our writing, our
    light and our saving power, these are our holy and God-bearing Fathers and Teachers;</strong>
    of this the six councils that have been concerning Christ bore witness to us also,
    but you did not accept their testimony. We write to you without scholarly devices,
    out of necessity; for you are an unlearned man. In the words of God there truly
    is both divine power and justice; but we beseech you by God: lay aside the haughtiness
    and the pride that has seized you, and with sincere humility open your hearing
    to us. And may God instruct you in the truth of that of which He spoke. God spoke
    concerning the idol-worshippers who occupied the promised land. They worshipped
    animals of gold, silver, and wood; they venerated all creation and every bird
    and said: behold, these are our gods, and there is no other God. Consequently,
    God said that one must not venerate the devilish images made by hands, images
    that bring harm and are worthy of a curse. But <strong>there are images made by
    hands that are appointed for the service of God and for His glory</strong>. God
    wished to bring His own people, the sanctified people of the Jews, into the promised
    land, as He promised Abraham and Isaac and Jacob, saying that He would give them
    the promised land and make the Israelites possessors and heirs of the possessions
    of the idol-worshippers, and that He would crush and utterly destroy this race,
    since it had defiled both the land and the air with its criminal deeds. The Lord
    warned and fenced in His people, lest it fall into their idolatry. <strong>In
    the very people of Israel, however, God chose two men and blessed them and sanctified
    them for the making of images made by hands, but for the glory and service of
    God, and for a memorial to posterity</strong>. I mean Bezaleel and Aholiab, of
    the tribes of Judah and Dan (Exod. 31). God says to Moses: hew out two tables
    of stone (Exod. 34:2) and bring them to Me. And (Moses) hewed them out and brought
    them. And God wrote with His own finger the ten life-creating and immortal commandments
    (λογος). Further, God says: (Exod. 25:18 sqq.) make Cherubim and Seraphim, and
    make a table and gild it within and without; make an ark of incorruptible woods
    and, for a memorial to your generations, lay within it your testimonies, that
    is: the tables, the jar, the rod, and the manna. Are these the images made by
    hands and the likenesses of which God speaks, or are they not? No; these are images
    to the glory of God and for the service of God.</p><p>&lt;…&gt;</p><p><strong>Those
    who saw the Lord depicted him in their accounts as they saw him; those who saw
    James, the brother of the Lord, depicted him likewise in their accounts as they
    saw him; those who saw further the first martyr Stephen depicted him also in their
    accounts as they saw him</strong>; in one word, finally: those who saw face to
    face the martyrs who shed their blood (their own) for Christ depicted them also.
    Beholding these images at last, men everywhere began to abandon the worship of
    the devil and to accept this new worship, a worship not of mad slavery but of
    rational freedom. <strong><mark>What worship will seem to you just, O emperor?
    The worship of these icons, or the worship of the diabolical delusion?</mark></strong>
    While Christ was in Jerusalem, Abgar, at that time prince and lord of Edessa,
    having heard of the miracles of Christ, wrote a letter to Him, and Christ sent
    him an answer written with His own hand and the holy glorious image of His Face.
    Send for this Image Not Made by Hands, then, and look. Thither the peoples of
    the East stream together in multitudes and offer up prayers.</p><p>&lt;…&gt;</p><p><strong><mark>You
    say that we venerate stones</mark>, walls and boards. It is not so, O emperor,
    as you say: the icons serve us only as a means of remembrance; they awaken and
    lift up our sluggish, unskilled, and coarse mind to the higher world, to the objects
    of which we cannot but give names, appellations, and images. <mark>We honor the
    icons not as gods, as you say — far be it! — we place our hope not in them</mark>.</strong>
    If an icon of the Lord is before us, we say: Lord Jesus Christ, Son of God, help
    us and save us! And if an icon of His holy Mother is before us, we say: holy Mother
    of God, Mother of the Lord, be (our) intercessor before your Son, our true God,
    for the salvation of our souls! And if the icon is of a martyr, for example of
    Stephen, we say: holy Stephen, you who poured out your blood for Christ and have
    boldness before God as the first martyr, be our intercessor! Thus we address also
    every other holy martyr. It is to this that <strong><mark>we send up prayers by
    means of icons</mark>. It is not what you say, O emperor, namely, that we call
    the martyrs gods</strong>. I adjure you by the living God: turn your mind away
    from evil and free your soul from the scandals and curses that are poured upon
    you from every corner of the universe; even little children laugh at you. Go into
    the elementary schools and say: “I am the destroyer and persecutor of icons” —
    and at once (the pupils) will pelt your head with their tablets; and — what you
    did not learn from the wise, you will learn from the foolish.</p><p>&lt;…&gt;</p><p>You
    wrote that an Ecumenical Council should be convened; this seemed to us useless.
    <strong>You persecute the icons, mock them, and destroy them</strong>. Do us this
    favor — abandon the matter and <strong>hold your peace; then the world will grow
    quiet and the scandals will cease</strong>. Imagine that we heeded you, that the
    hierarchs gathered from all the universe, that the synclit and council are already
    seated; but where is the Christ-loving and pious emperor who, as is the custom,
    should sit in the council and honor those who speak well, and pursue those who
    depart from the truth — when you yourself, O emperor, prove to be a man inconstant
    and a barbarian? Do you not know that your assault upon the holy icons bears witness
    to your inconstancy, vanity, and pride? <strong><mark>While the churches of God
    were enjoying deep peace, you stirred up strife, enmity, and scandals</mark></strong>.
    Abandon your designs and be still; and there will be no need of a Council.</p><p>&lt;…&gt;</p><p><strong>You
    terrify us and say: “I will send an army to Rome and destroy the icon of St. Peter,
    and try to bring the hierarch there, Gregory, away in chains, as Constans did
    with Martin</strong>”.&lt;…&gt;</p><p>If you send warriors to destroy the image
    of St. Peter, then, look you, we warn you: we shall be guiltless of the blood
    they will shed, but it will fall upon your neck and upon your head.</p></blockquote><p>(First
    Letter of Pope Gregory II of Rome to Leo the Isaurian, Emperor of Byzantium)</p><h3>St
    John of Damascus, monk (2nd half of the 7th c. – before 754)</h3><blockquote><p>The
    angel, however, is not God, but a creature and servant of God and helper; [for
    which reason] <strong><mark>he bowed down to him not as to God, but as to the
    helper of God and his minister</mark></strong>. Shall I then not make images of
    the friends of Christ? And <strong><mark>shall I not venerate them, not as gods,
    but as images of the friends of God</mark></strong>? For <strong><mark>neither
    Jesus nor Daniel bowed down to the angels that appeared to them — as to gods;
    and I do not venerate the image — as God, but through the image of Christ, and
    of the holy Mother of God, and of the saints I render veneration and honor to
    God, for whose sake I honor and esteem also His friends</mark></strong>.</p></blockquote><p>(Three
    Apologetic Treatises against Those Who Calumniate the Holy Icons)</p><p>In every
    deed the end is what matters: the deed is done for the sake of truth or of falsehood:</p><blockquote><p>X.
    Do you see how the end of Scripture has been made plain to those who examine it
    with understanding? For <strong>we must know, beloved, that in every deed truth
    and falsehood are sought out, and the end of him who performs it, whether it be
    fair or evil</strong>. For although in the Gospel there are depicted God, and
    an angel, and man, and heaven, and earth, and water, and fire, and air, and the
    sun, and the moon, and stars, and light, and darkness, and Satan, and a demon,
    and serpents, and scorpions, and death, and hell, and virtues, and vices, and
    all things both fair and evil: yet, since all that is said of them is true, and
    has as its end the glory of God and of the saints glorified by Him, and likewise
    our salvation and the casting down and putting to shame of the devil and his demons,
    we venerate and embrace, and kiss, and greet them with eyes and lips, and heart:
    and in like manner [we render honor] to the whole Old and New Testament, and to
    the words of the holy and excellent Fathers. But the shameful and loathsome, and
    impure writing of the accursed — the Manicheans, and the Hellenes, and the rest
    of the heresies — as containing what is false and vain, and as devised for the
    glory of the devil and his demons and for their delight, we reject with contempt
    and cast far from us, even should it contain [within it] the name of God. Thus
    also, in the matter of images, one must seek out both the truth and the end of
    those who make them. And if it be true and right, and if <strong>the images are
    made for the glory of God and of His saints</strong>, and for the emulation of
    virtue and the avoidance of vice and the salvation of souls, then they must be
    received with joy and honored, as images and copies, and likenesses, and books
    for the illiterate, and venerated, and kissed, and greeted with eyes and lips,
    and heart, as the likeness of the incarnate God or of His Mother, or of the saints,
    the partakers of the sufferings and glory of Christ and the victors, and destroyers
    of the Devil and his demons, and of their error.</p></blockquote><p><em>(</em>Three
    Apologetic Treatises against Those Who Calumniate the Holy Icons, Second Treatise,
    X)</p><h3>The Seventh Ecumenical Council, Nicaea (787)</h3><p>The dogma on the
    veneration of icons of the 367 holy fathers of the Seventh Ecumenical Council,
    of Nicaea</p><blockquote><p><em>we keep unchanged all the ecclesiastical traditions
    handed down to us, whether in writing or verbally,</em> <strong><em>one of which
    is the making of pictorial representations, agreeable to the history of the preaching
    of the Gospel, a tradition useful in many respects, but especially in this, that
    so the incarnation of the Word of God is shown forth as real and not merely phantastic,
    for these have mutual indications and without doubt have also mutual significations</em></strong><em>.
    We, therefore, following the royal pathway and the divinely inspired authority
    of our Holy Fathers and the traditions of the Catholic Church (for, as we all
    know, the Holy Spirit indwells her), define with all certitude and accuracy that
    just as the figure of the precious and life-giving Cross, so also</em> <strong><em><mark>the
    venerable and holy images</mark></em></strong><em>, as well in painting and mosaic
    as of other fit materials, should be set forth in the holy churches of God, and
    on the sacred vessels and on the vestments and on hangings and in pictures both
    in houses and by the wayside,</em> <strong><em>to wit, the figure of our Lord
    God and Saviour Jesus Christ, of our spotless Lady, the Mother of God, of the
    honourable Angels, of all Saints and of all pious people</em></strong><em>. For
    by so much more frequently as they are seen in artistic representation, by so
    much more readily are men lifted up to</em> <strong><em><mark>the memory of their
    prototypes, and to a longing after them; and to these should be given due salutation
    and honourable reverence (ἀσπασμὸν καὶ τιμητικὴν προσκύνησιν), not indeed that
    true worship of faith (λατρείαν) which pertains alone to the divine nature</mark></em></strong><em>;
    but</em> <strong><em>to these, as to the figure of the precious and life-giving
    Cross and to the Book of the Gospels and to the other holy objects, incense and
    lights may be offered (“the offering of incense and lights”, Greek “</em>θυμιαμάτων
    καὶ φώτων προσαγωγὴν”<em> — tr.) according to ancient pious custom</em></strong><em>.
    For </em><strong><em><mark>the honour which is paid to the image passes on to
    that which the image represents, and he who reveres the image reveres in it the
    subject represented</mark></em></strong><em>. For thus the teaching of our holy
    Fathers, that is the tradition of the Catholic Church, which from one end of the
    earth to the other hath received the Gospel, is strengthened.</em></p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787#HH-The-Decree-of-the-Holy-Great-Ecumenical-Synod-the-Second-of-Nice">The
    Seventh Ecumenical Council, The Decree of the Holy, Great, Ecumenical Synod</a>)</p><h2>9th
    century</h2><h3>St Theodore the Studite, monk<strong> </strong>(c. 759–826)</h3><blockquote><p>So
    also Basil the Great says: “<strong><mark>Let Christ, the giver of the contests
    in the battles, be depicted on the picture</mark></strong>”. The painted icon
    must be honored, since on it Christ is honored with veneration. The golden Chrysostom
    cries out that he saw an Angel on an icon. If then an incorporeal being is depicted
    on an icon, how much more the Word made flesh? If he looked, then surely he also
    venerated the Angel on the icon, as also Christ. For to be deemed worthy to see
    on an icon is the same as to venerate, since “the honor of the image ascends to
    the prototype,” as the divine Basil says again. Therefore Christ is denied by
    those who insult His icon and, rejecting it, reject Him, although they say that
    they confess Christ; for the demons too confess God, as [Scripture] says (James
    2:19; Tit. 1:16), but deny Him by their deeds</p></blockquote><p>(Letter 64. To
    the brotherhood staying with the spiritual son Gregory (II, 156))</p><blockquote><p>No
    prudent man can say that, although the emperor is held in honor, veneration should
    not be rendered to him. And the preceding discourse, that none but the priest
    is permitted either to look upon or to touch the aforesaid sacred (objects), bears
    witness to their great preeminence in honor.</p><p>&lt;…&gt;</p><p>I will not
    speak further, lest the discourse prove tedious — since <strong><mark>there exists
    a great multitude of testimonies, both ancient and later, concerning the veneration
    of the venerable icons</mark></strong>, if only we wish to bring them forth</p></blockquote><p>(Second
    Refutation of the Iconoclasts)</p><blockquote><p>If you confess Christ in His
    divinity and His humanity and do not waver concerning this, then what hinders
    you from saying that He is, in one respect, circumscribable, and in another, uncircumscribable,
    being knowable in the proper character of each of the two natures? In respect
    of that (nature) in which He is God, He is not subject to circumscription, just
    as (He is not subject) to sight and to perception. <strong>In respect of that
    (nature), however, in which He is man, He falls under circumscription</strong>,
    just as under sight and qualitative definition — unless it is only in words that
    you acknowledge Him in divinity and humanity, and in reality consider Christ incorporeal,
    and therefore uncircumscribable.</p></blockquote><p>(Questions to the Iconoclasts,
    who assert that our Lord Jesus Christ is uncircumscribable in His bodily form)</p><h2>14th
    century</h2><h3>St Gregory Palamas, archbishop of Thessalonica (c. 1296–1357)</h3><blockquote><p>Moreover,
    we <strong><mark>venerate the holy icon of the Son of God</mark></strong>, Who
    became depictable as having been made flesh for our sake, raising our veneration
    from the image to the Prototype; and <strong>the precious tree of the Cross, and
    all the symbols of His sufferings, as being the divine trophies against the common
    adversary of our race; we venerate also the saving sign of the precious Cross,
    and the divine churches and places, and the sacred vessels, and the God-given
    words, because of the God Who dwells in them</strong>. <strong><mark>We venerate
    also the icons of all the saints because of our love for them and for God, Whom
    they sincerely loved and served, raising our mind in their veneration to the persons
    represented on the icons</mark></strong>. We venerate also the very relics of
    the saints, because the sanctifying grace has not forsaken their holy bones, just
    as the Godhead did not depart from the Master’s body in His three-day death.</p></blockquote><p>(Confession
    of the Orthodox Faith of 1351)</p><h2>16th century</h2><h3>Jeremiah II, patriarch
    of Constantinople (1576)</h3><blockquote><p><em>On the twenty-first chapter, the
    last of all, which reasons about the veneration of the saints and about the fact
    that keeping the memory of the saints is profitable for the strengthening of our
    faith, if at the same time we ponder how they received divine grace and help through
    faith — we say that </em><strong><em>invocation is fitting chiefly with regard
    to God alone, and to Him it belongs principally and properly; while that which
    is performed toward the saints is not in the proper sense, and is addressed to
    them, so to speak, incidentally and by grace. For it is not Peter or Paul who
    hears those who invoke them, but the grace which they have</em></strong><em>,
    according to what was said by the Lord: “lo, I am with you always, even to the
    end of the age” (Matt. 28:20).</em></p><p><em>The divine Paul, writing to the
    Romans concerning the invocation of God, says: “How then shall they call on Him
    in whom they have not believed?” (Rom. 10:14) — thereby showing that it is only
    the One in Whom we have believed, that is, God, Who ought to be invoked. And that
    </em><strong><em>we direct invocations properly to the One God is evident from
    the fact that in the divine mysteries we cry: “Our Father,” and so forth. And
    in another place: “Lord of hosts, be with us, for we have no other helper than
    Thee in tribulations.” And again: “we know no other God besides Thee.” But we
    make all the saints our mediators, and above all the Mother of the Lord, and with
    her the host of Angels and of saints, and we honour them with churches, dedications,
    invocations and sacred icons, relatively, and not with divine service. For <mark>we
    know that divine service must be rendered chiefly to the One God alone, and besides
    Him no one else must be acknowledged as God, nor must we bow down to a “foreign
    god” (Ps. 81:9)</mark></em></strong><em>. We would sooner not wish to be saints
    ourselves than fear falling, through relative veneration, into deification. God
    forbid: for </em><strong><em><mark>it is ungodly and foreign to Christ’s Church
    and her children not to venerate, relatively, the holy icons, because the honour
    paid to them passes over to the prototype</mark></em></strong><em>, as Basil says:
    we acknowledge all the saints as our mediators and intercessors, and we say that
    there will be some mediation not only in the present age but also in the age to
    come, because for some there will be intercession by Angels and saints, and no
    less by the Lady of the world, though not for all men in general, nor for anyone
    who died in sins — by no means; for God has utterly shut up His mercy regarding
    such, and therefore He revealed concerning them the following: “though Noah, Daniel,
    and Job were in it, they would deliver neither sons nor daughters” (Ezek. 14:14,
    18). Only for those alone will all entreat God, for whom intercession is readily
    acceptable — that is, those who preceded the end of their life with repentance,
    but could not yet wash away the pollutions of their sins — and only so long as
    the judgment is still going on. But after the end of this spectacle, when each
    will have been led away to his appointed place of punishment, intercession is
    impossible, and there will be none. This intercession takes place and is proclaimed
    even now in the Church: we call upon the saints, and upon our Lady, and upon the
    holy Angels. Upon our Lady thus: “Most holy Lady, Mother of God, pray for us sinners”;
    upon the holy Angels: “all the heavenly powers of the holy Angels and Archangels,
    pray for us sinners”; — and in like manner upon the prophet, the Forerunner and
    Baptist of the Lord, the glorious Apostles, the prophets, the martyrs, the monks,
    the pastors and the ecumenical teachers, and all the rest of the saints. We ask
    also the host of holy women to pray for us sinners; we ask God to be merciful
    to us who serve Him and abide in confession and repentance, asking for the enlightenment
    of the eyes of our soul, that we may not fall asleep in death in our sins, and
    that the enemy may not prevail against us — by His grace and by the unconquerable,
    incomprehensible, divine power of the Cross. Thus, through the intercession of
    all those of whom we have spoken, we pray to God, that He may have mercy on us
    and snatch us out of the snares of the wicked one.</em></p></blockquote><p>(Answer
    to the Lutherans, the first)</p><p>There is also a longer second answer to the
    Lutherans, with a detailed examination of icon veneration.</p><p>And a third,
    short answer.</p><h2>18th century</h2><h3>Epistle of the patriarchs of the Eastern
    Catholic Church on the Orthodox Faith (1723)</h3><blockquote><p><em>How are we
    to think of the holy icons and of the veneration of the Saints?</em></p><p><em>Answer.
    — Since there are Saints, and the Catholic Church acknowledges them as intercessors,
    therefore we </em><strong><em><mark>honour them as the friends of God, praying
    for us before the God of all</mark></em></strong><em>. But our veneration of the
    Saints is of two kinds: one pertains to the Mother of the Word of God, whom we
    honour more highly than a servant of God, since the Mother of God, although she
    is truly the handmaid of the One God, is also the Mother who gave birth in the
    flesh to the One of the Trinity. Therefore we magnify her higher than all the
    Angels and Saints, beyond compare, and render her a veneration greater than what
    befits a handmaid of God. The other kind of veneration, befitting the servants
    of God, pertains to the holy Angels, the Apostles, the Prophets, the Martyrs,
    and in general to all the Saints. Over and above this </em><strong><em>we honour
    with veneration the precious and life-giving Cross, on which our Saviour suffered
    for the salvation of the world, the depiction of the life-giving Cross, the manger
    of Bethlehem, through which we have been delivered from irrationality, the place
    of Golgotha, the life-giving Tomb and the other holy places, likewise the Holy
    Gospel and the sacred vessels in which the bloodless Sacrifice is performed; we
    honour and glorify the Saints with yearly commemorations of them, with public
    feasts, with the building of holy churches and with oblations</em></strong><em>
    </em><strong><em>Moreover</em></strong><em> </em><strong><em>we venerate the icons
    of our Lord Jesus Christ, of the Most Holy Mother of God and of all the Saints;
    we honour and kiss these icons, as well as the depictions of the holy Angels,
    as they appeared to certain Patriarchs and Prophets; and we depict the All-Holy
    Spirit</em></strong><em> as He appeared in the form of a dove.</em></p><p><strong><em>If
    some, because of the veneration of the holy icons, reproach us with idolatry,
    we consider such a reproach empty and absurd; for we serve no one else but the
    One God in the Trinity</em></strong><em>. The Saints, however, we venerate in
    a twofold manner: first, with respect to God, for on His account we bless the
    Saints; second, with respect to the Saints themselves, since they are living images
    of God. Moreover, while honouring the Saints as the servants of God, </em><strong><em><mark>we
    honour the holy icons relatively — the honour of the icons passes on to the prototypes;
    for he who venerates an icon venerates through the icon the prototype, so that
    in no wise can the honour of the icon be separated from the honour of that which
    is depicted on it; but both abide in unity, just as the honour rendered to a royal
    envoy is inseparable from the honour rendered to the King himself</mark></em></strong><em>.</em></p><p><em>The
    passages which the opponents take from Scripture to confirm their absurdity do
    not favour them so much as they think; on the contrary, they agree entirely with
    our opinion. For, </em><strong><em>when reading the Divine Scripture, we examine
    the time, the persons, the examples and the causes. Therefore, if we find that
    the same God in one place says: “You shall not make for yourself a carved image,
    nor any likeness; you shall not bow down to them, nor serve them,” and in another
    commands that Cherubim be made</em></strong><em>; and if at the same time we see
    in the Temple made images of oxen and lions — all this we do not receive superstitiously
    (for superstition is not faith), but, as was said, taking into account the time
    and the other circumstances, </em><strong><em><mark>we arrive at a right understanding.
    The words “You shall not make for yourself a carved image, or any likeness,” as
    we understand them, mean the same as the words: do not bow down to foreign gods,
    do not practise idolatry</mark></em></strong><em>. — Thus both the custom, held
    by the Church from apostolic times, of venerating the holy icons, and the service
    befitting the One God, will remain inviolate, and God will not contradict His
    words. And when our opponents appeal to the holy Fathers who supposedly say that
    it is unseemly to venerate icons, these holy men defend us all the more; since
    in their contests they rise up chiefly against those who offer the icons divine
    worship, or bring into the churches images of their deceased relatives; such venerators
    they strike with anathema, but they do not condemn the proper veneration of the
    Saints and of the holy icons, of the precious Cross and of all that has been said
    above. And that from apostolic times holy icons were used in the churches, and
    the faithful venerated them, is related by very many, together with whom the holy
    Seventh Ecumenical Council puts to shame every heretical blasphemy.</em></p><p><em>Since
    this Council makes most plainly clear how one ought to venerate the holy icons
    — when </em><strong><em><mark>it delivers to curse and excommunication those who
    offer the icons divine worship, or call the Orthodox, who venerate icons, idol-servers,
    we together with it anathematize those who offer to a Saint, or an Angel, or an
    icon, or the Cross, or the holy relics, or the sacred vessels, or the Gospel,
    or anything else that is in the heavens above and on the earth and in the sea,
    such honour as befits the One God in the Trinity. Likewise we anathematize those
    who call the veneration of icons idolatry, and therefore do not venerate them,
    and do not honour the Cross and the Saints, as the Church has commanded</mark></em></strong><em>.</em></p><p><em>We
    venerate the Saints and the holy icons as we have said, and depict them for the
    adornment of the churches, that they may serve the unlearned instead of books,
    and incite to the imitation of the virtues of the Saints and to the commemoration
    of them, and further the increase of love, of watchfulness and of the constant
    invocation of the Lord as Master and Father, and of the Saints as His servants,
    our helpers and mediators.</em></p></blockquote><p>(Epistle of the Eastern Patriarchs
    of the 18th century, Question 3)</p><h2>Criticism</h2><h3>Icons appeared only
    in the 4th century, and the ancient Christians had no icons</h3><p>Surviving icons
    exist from the 2nd century, not from the 4th. These are genuine icons: <a href="https://bibleox.com/en/en/w/Ik1c_A_Collection_of_Ancient_Icons">https://bibleox.com/en/en/w/Ik1c_A_Collection_of_Ancient_Icons</a></p><p>The
    historian of the 3rd–4th century Eusebius of Caesarea bears written witness to
    icons among the earliest Christians (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D1%8E%D1%82#HH-%D0%95%D0%B2%D1%81%D0%B5%D0%B2%D0%B8%D0%B9-%D0%9A%D0%B5%D1%81%D0%B0%D1%80%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D0%9F%D0%B0%D0%BC%D1%84%D0%B8%D0%BB-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D0%BD%D1%8B%D0%B9-%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D0%BA-%D0%B5%D0%BF%D0%B8%D1%81%D0%BA%D0%BE%D0%BF-258-339"
    lang="ru">quote</a>).</p><h3>Even so, icons did not exist in apostolic times</h3><p>From
    the 1st century we do not even possess the texts of the New Testament Holy Scripture,
    yet we accept what was written.</p><p>Manuscripts of Scripture survive only beginning
    from the 2nd century, and in the smallest measure (<a href="https://bibleox.com/en/en/w/Bm6s_Biblical_Manuscripts">samples
    of the manuscripts</a>), just as icons do (<a href="https://bibleox.com/en/en/w/Ik1c_A_Collection_of_Ancient_Icons">samples
    of ancient icons</a>). In the 3rd century there are more manuscripts of Scripture
    and more icons. From the 4th century there are codices (complete collections of
    texts) of Scripture and a great many icons. To be consistent, those who accept
    Scripture should acknowledge also the icons among the ancient Christians; otherwise
    both should be rejected. And to be fully honest, one should not close one’s eyes
    to the fact that icons, and likewise veneration before shrines with icons, existed
    already in the Old Testament (the prophet David and Joshua the son of Nun) and
    is recorded in Scripture. That is, icons and veneration before shrines with icons
    existed not only in the time of the apostles, but much earlier still.</p><h3>The
    ancient Christians did not venerate icons, and Scripture says nothing of this</h3><p>To
    assert what Christians did or did not do requires some grounds. The opponents
    of icons offer only their conjectures, while from the Orthodox side there are
    not conjectures, but testimony from the Scriptures. There are ample grounds to
    consider that reverence for shrines with images is not only the affair of Christians,
    but a far more ancient affair of the prophets: Joshua the son of Nun and David.
    Moreover, if people awaited healings from the image of an apostle (his shadow),
    where would they get the desire to reject or not to venerate images, especially
    since the prophets venerated shrines with images? The apostles not only did not
    forbid this, but even deemed it necessary to record it in the Gospel. Here it
    must also be taken into account that it was precisely in this period that the
    ban on depicting God was lifted, since the Law of Moses had been abolished.</p><h3>The
    Church first rejected icons at a council, and only in the 8th century, at the
    wish of a politician, agreed to accept icon veneration</h3><p>This is simply untrue
    and a biased presentation of historical events.</p><p>Icons have existed among
    the faithful since the Old Testament and the command of God. The righteous venerated
    these shrines with images and bowed down before them. In the New Testament people
    awaited healings from the image of an apostle (his shadow). The most ancient icons
    exist in the catacombs, beginning from the 2nd century. The church historian of
    the 3rd–4th century testifies that the Christians who were ancient even to him
    had icons of Christ and of the apostles, and that in this way they honoured Christ
    and the apostles. A holy author of the 3rd century writes of the making of icons,
    which serves as veneration of the angels.</p><p>Thus veneration of shrines with
    images and bows before them existed even before the apostles. There are ample
    grounds to consider that this was so also in the time of the apostles, and all
    the more among the earliest Christians.</p><p>Further, on icon veneration a great
    many saints write (the quotations are gathered above), and in 691 — that is, still
    before the beginning of the Iconoclast period in Byzantium — the Sixth Ecumenical
    Council takes place. It convenes against the heresy of Monothelitism, but<strong>
    </strong>in <a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%B8%D0%BB%D0%B0_%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85_%D0%92%D1%81%D0%B5%D0%BB%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D1%85_%D0%A1%D0%BE%D0%B1%D0%BE%D1%80%D0%BE%D0%B2#HH-82"
    lang="ru">the 82nd canonical rule</a> the fathers of the council quite calmly
    fix the veneration of icons existing in the Church. The whole Church affirms this.
    No disturbances take place.</p><p>The Iconoclast period in Byzantium (the 8th
    century) begins literally at the will of the emperor. There is an opinion that
    he thereby wished to weaken the pressure from the Muslims, making the religion
    of the empire more like Islam. It is precisely for this reason that the emperor
    sought the destruction of the icons, not allowing even their instructive character
    without veneration.</p><p>The Iconoclast council of 754 took place on the then
    small territory of Byzantium. This local council is at the very least inferior
    to an ecumenical council, because the Iconoclasts gathered on territory subject
    to the emperor and his army. It took place within the bounds of only one local
    Church — the Church of Constantinople. The council was convened under conditions
    of persecution, at a time when the emperors had for several decades been persecuting
    and killing the venerators of icons. Parallel to the persecutions in small Byzantium,
    all the other Churches beyond the borders of the empire declared themselves in
    favour of icon veneration at their councils (two councils: in Rome and in Jerusalem).</p><p>That
    is, the council of 754 is a political phenomenon, pushed through by the emperor
    with the help of the army, taking place only on the small lands subject to the
    Byzantine emperor. The other Churches at the very same time spoke out conciliarly
    and openly against this lawlessness of the emperor.</p><p>At the same time, the
    empress Irene, who facilitated the holding of the council of all the Churches
    (and not of one only), cannot by any means be accused in this, because the army
    was not on her side. When she attempted to hold the first session of the Seventh
    Ecumenical Council in Constantinople, the army disrupted that council, and therefore
    it was transferred to Nicaea. Thus the empress Irene could not by force have gathered
    even a council of the Church of Constantinople, to say nothing of the Ecumenical
    Council of all the Churches.</p><p>Attention should also be paid to the fact that
    the Iconoclasts destroyed icons, persecuted and killed the venerators of icons.
    But the venerators of icons did not, in response, persecute the Iconoclasts. That
    is, violence was needed precisely in order to force the Church to accept the new
    teaching that an icon is an idol. But the Orthodox attitude toward icons, the
    same as that of the prophets, was peacefully upheld even before Iconoclasm in
    Byzantium, defended at councils during Iconoclasm outside Byzantium, and after
    Iconoclasm, upon the cessation of the violence and the threats of death, it was
    confessed at once by all the Churches — not only without the help of the army,
    but even against the pressure of the army.</p><h3>After the 7th Ecumenical Council
    the venerators of icons also began to persecute the Iconoclasts</h3><p>— That
    is not true.</p><p>— It is true! They persecuted the Paulicians.</p><p>— And for
    what did the Iconoclasts persecute the Paulicians? This history is not connected
    with icons. The contemporaries considered the Paulicians a continuation of the
    <strong>Manichaean</strong> sect (which it in essence was), and Manichaeism, in
    its turn, was associated in the Roman empire with Persia (an adversary), and therefore
    it was persecuted almost continuously, beginning already with the pagan Roman
    emperors.</p><p>Manichaeism arose approximately at the end of the 3rd century
    on the territory of Persia. It was the syncretic teaching of Mani, who borrowed
    ideas from the various religions he encountered — above all, from Persian Zoroastrianism,
    the religion in whose midst the little boy Suraik (the son of prince Fatak) grew
    up, who in the future would call himself a prophet, taking for himself the name
    Mani (mind, spirit). It was precisely from Zoroastrianism that he borrowed the
    teaching about two principles (the good and the evil) — <strong>dualism</strong>.</p><p>In
    the 3rd century Manichaeism spreads from Persia onto the territory of the Roman
    empire. Persia at that moment is one of the chief adversaries of the Roman empire,
    and therefore the religion of Persia is here perceived as hostile. The Roman emperor
    Diocletian (a pagan) was already exterminating the Manichaeans in the 3rd century.
    In the period of the 4th–6th centuries the Manichaeans were persecuted by the
    Orthodox emperors. In the 7th century, on the former territory of Persia (Armenia,
    whence Mani’s mother came), where Manichaeism had earlier existed, there arises
    <strong>Paulicianism</strong>, with similar tenets of teaching (dualism). Here
    Manichaeism is clothed in a Christian form (texts), while retaining the characteristic
    tenets of the Manichaean teaching (dualism). Therefore the Paulicians, who rightly
    appeared to their contemporaries as already well-known Manichaeans, at once began
    to be persecuted, as the Manichaeans had been persecuted earlier.</p><p>The persecution
    of the Paulicians began at once upon their appearance, still before the Iconoclast
    controversies (the 7th century). It was the Iconoclasts who began actively to
    exterminate the Paulicians in the 8th century (Leo V the Armenian), which led
    to the formation of a hostile Paulician state, which began attacks on Byzantium,
    seized its inhabitants with their subsequent sale into slavery to the Arabs. Upon
    the coming to power of the venerators of icons, they — at the very least out of
    military-political necessity — had to struggle with the Paulician state. The regent
    Theodora waged active retaliatory military actions against this young state. Her
    successors continued this confrontation until the end of the 10th century.</p><p>In
    970 the Byzantine emperor John Tzimiskes resettled the remnants of the Paulicians
    on the border with the Bulgarians (still military adversaries at that time). There
    the Paulician teaching revived under the name of the <strong>Bogomils</strong>
    (followers of a certain teacher Bogomil), and in Europe the teaching of the Paulicians
    revived under the name of the <strong>Cathars</strong> and the <strong>Albigenses</strong>.
    The faith of all these communities also had at its core the Manichaean dualist
    idea.</p><p>How is the persecution of the Paulicians connected with icons, if
    they were persecuted by pagans, by Iconoclasts, and by icon-venerators alike?
    The Paulicians were simply regarded as Manichaeans — that is, a Persian pseudo-Christian
    sect, which was always persecuted in the Roman and Byzantine empires. Icons in
    this confrontation were the last question that could be discussed with Manichaeans
    or Paulicians.</p><p>If the venerators of icons had wished to persecute anyone
    for a wrong attitude toward icons, would it not have been more reasonable to begin
    with the persecution in return of those who had just been persecuting them — to
    begin with the persecution of the Iconoclasts inside the Church? After all, the
    Iconoclast conflict was not with the Paulicians but within the Church, between
    two sides, both of which considered themselves Orthodox. That is why a council
    was needed. Yet the venerators do not persecute their persecutors (the Iconoclasts)
    in return. There is only the deposition from their sees of those bishops who persisted
    even after the council, unwilling to bring repentance, and continued to hold to
    Iconoclasm.</p><hr><p>The Iconoclast controversies in Byzantium are a conflict
    within the Church on the territory of Byzantium. The Iconoclasts killed icon-venerators
    within the Church, but the icon-venerators did not do this. The Paulicians are
    a society external to the Church, a small Armenian sect that arose in the 7th
    century, which the Orthodox considered a continuation of the ancient Manichaeans.
    The <strong>mass persecution of the Paulicians was begun by an Iconoclast</strong>,
    Leo V the Armenian, in the 9th century. As one may guess, the Iconoclast began
    the persecutions of the Paulicians not because of their attitude toward icons,
    which here had no significance whatsoever.</p><p>Let us consider the question
    in more detail.</p><p>The Seventh Ecumenical Council took place in 787.</p><ol><li><p>The
    empress Irene ruled in 797–802, and under her the Paulicians preached and spread
    with particular activity. She could not have persecuted anyone at all, since the
    army was not on her side, having disrupted the first session of the council in
    Constantinople.</p></li><li><p>Then Nikephoros I became emperor and ruled in 802–811.
    He also did not persecute the Paulicians.</p></li><li><p>Then Staurakios ruled
    for two months, not persecuting the Paulicians.</p></li><li><p>After him Michael
    I Rangabe ruled for two years, from 811 to 813, and he declared the death penalty
    for the adherents of two sects: the <strong>Paulician</strong>, which was identified
    with the ancient Manichaean heresy, and also the <strong>Athinganian</strong>,
    which was considered a heresy of judaizers. However, the venerable Theodore the
    Studite (an icon-venerator who had earlier endured no few persecutions from the
    Iconoclasts) managed to dissuade the emperor not only from persecuting the Paulicians
    (he considered and called them Manichaeans), but dissuaded him altogether from
    engaging in the persecution of heretics (in <a href="https://bibleox.com/en/en/w/Attitude-towards-heretics#HH-9th-century">this
    epistle</a> he sets out the Gospel reasons).</p></li><li><p>And only Leo V the
    Armenian, who came to power after Michael, ruling in 813–820, an <strong>Iconoclast</strong>
    who renewed the persecution of the venerators of icons — it was precisely he who
    began the mass and systematic persecution of the Paulicians. These persecutions
    by the Iconoclast emperor against the Paulicians led to the separatism of the
    Paulicians, with the subsequent formation on the border of Byzantium of their
    own state, with an army and fortresses, which made incursions into the territory
    of Byzantium, killed the population of Byzantium, and those who did not agree
    to accept Paulicianism they sold to the Arabs into slavery. Against these attacks,
    killings and the selling of people into slavery the ideological leader of the
    Paulicians (Sergius) objected, but said that he could do nothing about it.</p></li></ol><p>Thus,
    while the Iconoclasts began in Byzantium intra-church persecutions of their brothers
    and sisters, persecuting, maiming and killing the venerators of icons for tens
    of years, the icon-venerators themselves did not persecute the Iconoclasts in
    return. They did not exterminate those who for tens of years had been exterminating
    them themselves, receiving the repentance of their persecutors at the Seventh
    Ecumenical Council.</p><p>The Paulicians, however, were a society external to
    the Church. Not only were they not persecuted under the empress Irene, but they
    entered the most active period of their development. And only after three emperors
    had passed did one of them begin to persecute the Paulicians as Manichaean sectarians
    — but an icon-venerator (!) dissuades him from the persecutions, obtains the rescinding
    of the edict, dissuades him altogether from persecuting heretics. And it is only
    the Iconoclasts who begin the mass persecution of the Paulicians.</p><p><strong>It
    goes without saying that the Iconoclasts persecuted the Paulicians not for their
    refusal to venerate icons</strong>. Afterwards, however, the icon-venerating emperors
    received as an inheritance from the Iconoclast emperors the problem with the Paulicians,
    who attacked the Byzantines, sold them into slavery, and killed the Byzantine
    population.</p><p>Thus the matter of the persecution of the Paulicians is not
    connected with icons in any way whatsoever, and it was chiefly the Iconoclasts
    themselves who persecuted them, giving rise to a great conflict with them.</p><h3>Why
    was it necessary to anathematize those who did not venerate icons? Why not leave
    this to a person’s own choice?</h3><p>Iconoclasm was called a heresy even before
    the council (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D1%8E%D1%82#HH-%D0%90%D0%BC%D1%84%D0%B8%D0%BB%D0%BE%D1%85%D0%B8%D0%B9-%D0%98%D0%BA%D0%BE%D0%BD%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D0%B2%D1%8F%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-340-394"
    lang="ru">for example</a>). The need for a dogma arises only after Christians
    began to be killed, icon veneration being called idolatry, and the Church being
    divided.</p><p>Until it pleased one Byzantine emperor of the 8th century (Leo
    the Isaurian) to kill his subjects for the veneration of icons, icon veneration
    was not exactly left to personal choice, but it was nevertheless permitted to
    hold a different opinion without falling under anathema. Thus, parallel to the
    existence of icons in the Church, Tertullian in the 2nd century could speak against
    representational art, and probably St Epiphanius of Cyprus was doing the same
    in the 4th century. Tertullian became a heretic only when he fell away from the
    Church into Montanism, while Epiphanius is even venerated by the Church as a saint.</p><p>But
    when the Church’s veneration of icons began to incite the opponents of icons to
    hatred and to the killing of Christians who venerate icons, began to incite to
    the loss of the unity desired by God, then those who held such an opinion were
    delivered over to anathema (excommunication) by the whole Church.</p><p>To consider
    icons idols, and the same attitude toward them as that of the Old Testament prophets
    (David and Joshua the son of Nun) — idolatry — is not the Orthodox faith but an
    error, which in its development leads to hatred, and at its height to bloodshed.
    If a believer does not consider the actions of the prophets idolatry, then where
    is the problem? Why not honour an image in exactly the same way as the prophets
    did? To be honest with oneself, there is only one reason — the person does in
    fact consider this idolatry, but simply does not say so openly, so as not to accuse
    the prophets and not to reveal himself an open adversary of their faith.</p><p>A
    similar situation occurred with certain other errors, which could be present among
    teachers within the Church as a private opinion, until heretical groups grew out
    of them, leading to the division of the Church and to hatred toward the Orthodox,
    which later led to the natural condemnation of these errors at church councils.
    Thus, even in the time of the apostles there were in Jerusalem believers of the
    sect of the Pharisees (<a href="https://bibleox.com/en/eng-nkjv/act/15/#L5">Acts
    15:5</a>), who taught that, as it were, keeping the Law of Moses was necessary
    for salvation; but when this question began to divide the Christians in Antioch,
    the apostles convened a council, after which the Law of Moses could no longer
    be considered necessary for salvation. Later, Origen taught universal salvation
    and the pre-existence of souls (having taken these teachings not from the Church
    but from the Gnostics), and St Gregory of Nyssa repeated Origen’s error about
    universal salvation. But this was condemned at the Fifth Ecumenical Council, after
    which these errors no longer had any place in the Church.</p>'
  references: "<p>Translation: Rodion Vlasov (with the use of AI tools). Quotations
    of the Holy Fathers are cited from the English translations held in this site’s
    library where available; otherwise they are translated from the Russian.</p>"
