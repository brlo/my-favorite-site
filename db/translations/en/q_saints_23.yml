  body: "<h2>17th century</h2><h3>St Dmitry of Rostov (Tuptalo), hierarch (1651–1709)</h3><blockquote><p><strong>What
    is an idol?</strong></p><p>An idol is the likeness of a man whose life is foul,
    impious, abominable to God, who spent his days in the sordidness of sins and perished
    in evil, and who is now held in hell together with the devils; or the likeness
    of some beast, hewn from wood, or carved out of stone, or moulded of copper, silver
    and gold, or painted on a board; and such a likeness, whether of a man or of a
    beast, is deified by the heathen although it is not God, and is honoured as God
    with worship and sacrifices: such a thing is called an idol, and it is the image
    or likeness of a false god.</p><p><strong>What is a holy icon?</strong></p><p>But
    a holy icon is the depiction of Christ our Saviour, the true God, who dwelt on
    earth among men in the likeness of a man; or of the most pure Virgin the Mother
    of God; or of some holy saint of God who passed his life righteously and reverently,
    was vouchsafed the kingdom of heaven, and now abides with the Angels.</p></blockquote><p>(The
    Search into the Schismatic Bryansk Faith, ch. 12)</p><h2>20th century</h2><h3>Dmitry
    Vladykov, protopresbyter (1863–1955)</h3><blockquote><p>The word “icon” is a Greek
    word (ἡ εἰκών), in Russian — “image”, “depiction”. Holy icons are depictions of
    those forms in which God appeared to men, to the Mother of God, to the holy angels
    and to the holy saints of God.</p></blockquote><p>(The Orthodox Church and the
    Sectarians, part 2)</p>"
