  - src: пророчества-о-Христе
    path: Pc1t_Prophecies_About_Christ
    title: Prophecies About Christ
    meta_desc: Biblical prophecies about Christ
    menu: { parent: Prophecies, title: Prophecies About Christ, priority: 1 }
    references: |-
      <ol><li><p>https://dssenglishbible.com/scroll4Q80.htm</p></li><li><p>https://dssenglishbible.com/scroll4Q88.htm see the footnote.</p></li></ol>
    body: |-
      <h2>Prophecies</h2><ol><li><p>The number of days until the coming of Christ (<a href="https://bibleox.com/en/eng-nkjv/dan/9/#L24-25">Dan. 9:24-25</a>);</p></li><li><p>Christ will come to the <strong>second</strong> Jerusalem Temple (which no longer exists, <a href="https://bibleox.com/en/eng-nkjv/ag/2/#L9">Hag. 2:9</a>);</p></li><li><p>Christ will come when the tribe of Judah loses its power (<a href="https://bibleox.com/en/eng-nkjv/gen/49/#L10">Gen. 49:10</a>). <a href="https://en.wikipedia.org/wiki/Herod_the_Great">Herod I the Great</a> was an <a href="https://en.wikipedia.org/wiki/Edom">Idumean</a>, that is, a descendant of Esau, not a Jew. He replaced the Jewish <a href="https://en.wikipedia.org/wiki/Hasmonean_dynasty">Hasmonean</a> dynasty, to which the Maccabees belonged.</p></li><li><p>Christ will be born in Bethlehem (<a href="https://bibleox.com/en/eng-nkjv/mih/5/#L2">Mic. 5:2</a>);</p></li><li><p>Christ will be a descendant of David (<a href="https://bibleox.com/en/eng-nkjv/ps/89/#L3-5,27-29,36">Ps. 89:3-5,27-29,36</a>);</p></li><li><p>Christ will make a New Covenant (<a href="https://bibleox.com/en/eng-nkjv/is/42/#L6">Is. 42:6</a>). All Covenants with God were made with blood, and in this case — with the blood of Jesus Christ Himself;</p></li><li><p>Christ will be betrayed for 30 pieces of silver (<a href="https://bibleox.com/en/eng-nkjv/zah/11/#L12-13">Zech. 11:12-13</a>);</p></li><li><p>Christ will be executed with robbers (<a href="https://bibleox.com/en/eng-nkjv/dan/9/#L26">Dan. 9:26</a>; <a href="https://bibleox.com/en/eng-nkjv/is/53/#L12">Is. 53:12</a>; <a href="https://bibleox.com/en/eng-nkjv/zah/12/#L10">Zech. 12:10</a>);</p></li><li><p>His hands and feet will be pierced (<a href="https://bibleox.com/en/eng-nkjv/ps/22/#L16">Ps. 22:16</a>); He will be pierced (with a spear) (<a href="https://bibleox.com/en/eng-nkjv/zah/12/#L10">Zech. 12:10</a>) (for the answer to criticism see below);</p></li><li><p>Those passing by will mock Christ, saying that if He trusted in God, let God deliver Him, if He delights in Him (<a href="https://bibleox.com/en/eng-nkjv/ps/22/#L7-8">Ps. 22:7-8</a>)</p></li><li><p>After the execution of Christ, Jerusalem and the Temple will be destroyed (<a href="https://bibleox.com/en/eng-nkjv/dan/9/#L26">Dan. 9:26</a>);</p></li><li><p>A whole chapter of the prophet Isaiah about the saving sufferings of Christ: <a href="https://bibleox.com/en/eng-nkjv/is/53/">Is. 53</a>: “But <strong>He was wounded for our transgressions</strong>, <strong>He was bruised for our iniquities; the chastisement for our peace was upon Him, and by His stripes we are healed</strong>. All we like sheep have gone astray; we have turned, every one, to his own way; and the LORD has laid on Him the iniquity of us all. <strong>He was oppressed and He was afflicted</strong>, yet He opened not His mouth; <strong>He was led as a lamb to the slaughter</strong>, and as a sheep before its shearers is silent, so He opened not His mouth. He was taken from prison and from judgment, and who will declare His generation? For He was cut off from the land of the living; for the transgressions of My people <strong>He was stricken</strong>. And <strong>they made His grave with the wicked — but with the rich at His death</strong>, because He had done no violence, nor was any deceit in His mouth. Yet it pleased the LORD to bruise Him; <strong>He has put Him to grief. When You make His soul an offering for sin</strong>, He shall see His seed, He shall prolong His days, and the pleasure of the LORD shall prosper in His hand. <strong>He shall see the labor of His soul, and be satisfied</strong>. By His knowledge <strong>My righteous Servant</strong> shall justify many, for He shall bear their iniquities. Therefore I will divide Him a portion with the great, and He shall divide the spoil with the strong, because <strong>He poured out His soul unto death, and He was numbered with the transgressors</strong>, and He bore the sin of many, and made intercession for the transgressors” (<a href="https://bibleox.com/en/eng-nkjv/is/53/#L5-12">Is. 53:5-12</a>)</p></li></ol><h2>Prototypes of Christ’s Sufferings</h2><ol><li><p>God established the rite of consecration of the high priest: the high priest and the priests lay their hands on the bull and then kill it at the door of the Tabernacle of Meeting (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L10-11">Ex. 29:10-11</a>). Likewise, the high priests and priests conspired to seize Christ by night (<a href="https://bibleox.com/en/eng-nkjv/mf/26/#L45-47">Matt. 26:45-47</a>), and then executed Him outside the gate of the city of Jerusalem (<a href="https://bibleox.com/en/eng-nkjv/evr/13/#L12">Heb. 13:12</a>).</p></li><li><p>Further, in the same place. The horns of the altar are smeared with the blood of the bull, and all the rest is poured out at the base of the altar (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L12">Ex. 29:12</a>). The altar on which Christ was sacrificed was the Cross. The Cross was smeared with the Blood of Christ, since the hands and feet of Christ were nailed, and then He was pierced with a spear, and the blood flowed down to the base of the Cross (the altar).</p></li><li><p>After the rite of consecration was completed, the altar became most holy: whatever touches it will be holy (<a href="https://bibleox.com/en/eng-nkjv/ish/29/#L37">Ex. 29:37</a>). In the same way the Cross (the altar) became a great holy thing for Christians, used to sanctify water, objects and people. It is used as an object in the blessing of water, and the sign of the cross is made with the hand over people and objects.</p></li></ol><h2>Prophecies of Christ’s Sufferings</h2><ol><li><p>Christ will call Himself the Son of God;</p></li><li><p>His words and deeds will expose His opponents;</p></li><li><p>He will call God His Father;</p></li><li><p>the opponents of Christ will insult and torture Him;</p></li><li><p>they will condemn Him to a shameful death.</p></li></ol><blockquote><p>“Let us lie in wait for the righteous man, because <strong>he is inconvenient to us</strong> and <strong>opposes our actions</strong>; <strong>he reproaches us for sins</strong> <strong>against the law</strong>, and <strong>accuses us of sins</strong> against our training. <strong>He professes to have knowledge of God</strong>, and <strong>calls himself a child of the Lord</strong>. He became to us <strong>a reproof of our thoughts</strong>; <strong>the very sight of him is a burden to us, because his manner of life is unlike that of others, and his ways are strange. We are considered by him as something base, and he avoids our ways</strong> as unclean; he calls the last end of the righteous happy, and <strong>boasts that God is his father</strong>. Let us see if his words are true, and let us test what will happen at the end of his life; for <strong>if the righteous man is God’s child, he will help him, and will deliver him from the hand of his adversaries</strong>. <strong>Let us test him with insult and torture</strong>, so that we may find out how gentle he is, and make trial of his forbearance. <strong>Let us condemn him to a shameful death</strong>, for, according to what he says, he will be protected.” Thus they reasoned, but they were led astray, for <strong>their wickedness blinded them</strong>” (<a href="https://bibleox.com/en/en-nrsv/prs/2/#L12-21">Wis. 2:12-21</a>)</p><p>In the Greek: παῖδα κυρίου ἑαυτὸν ὀνομάζει — he calls himself “the child (servant, son) of the Lord”; εἰ γάρ ἐστιν ὁ δίκαιος υἱὸς θεοῦ — “if the righteous man is <strong>the son of God</strong>”.</p></blockquote><h2>Objections</h2><h3>Were the Hands and Feet Pierced, or Is a Lion Tearing Them?</h3><p>The later Masoretic text (<a href="https://bibleox.com/en/heb-osm/ps/22/#L17">Ps. 22:17</a> in the Hebrew numbering) does not contain the words about piercing the hands and feet. Instead there is the word “lion” (כָּאֲרִי, “like a lion”). There is no verb “to tear” in the text at all, and it is unclear how the actions of a lion relate to the hands and feet. That is why English translations differ here: the NKJV has “they pierced My hands and My feet” (<a href="https://bibleox.com/en/eng-nkjv/ps/22/#L16">Ps. 22:16</a>), while the NRSV has “my hands and feet have shriveled” (<a href="https://bibleox.com/en/en-nrsv/ps/22/#L16">Ps. 22:16</a>).</p><p>However, “pierced” is nevertheless correct. The Septuagint has ὤρυξαν χεῖράς μου καὶ πόδας — “they pierced (dug through) my hands and feet” (<a href="https://bibleox.com/en/gr-lxx-byz/ps/21/#L16">Ps. 21:16, LXX</a>), and the ancient Qumran scroll 4Q88[2] confirms that the hands and feet were pierced.</p><p>Moreover, there is another prophecy that precisely speaks of piercing. It is mentioned here:</p><blockquote><p>“And again another Scripture says, ‘<strong>They shall look on Him whom they <mark>pierced</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/in/19/#L37">John. 19:37</a>)</p></blockquote><p>The reference is to this:</p><blockquote><p>“And I will pour on the house of David and on the inhabitants of Jerusalem the Spirit of grace and supplication; then they will look on Me whom they <strong><mark>pierced</mark></strong>. Yes, they will mourn for Him as one mourns for his only son, and grieve for Him as one grieves for a firstborn” (<a href="https://bibleox.com/en/eng-nkjv/zah/12/#L10">Zech. 12:10</a>)</p></blockquote><blockquote><p>“וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ <strong>דָּקָרוּ</strong> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃” (<a href="https://bibleox.com/en/heb-osm/zah/12/#L10">Zech. 12:10</a>)</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר — to pierce, to stab through; and to be stabbed, pierced.</p><p>The Qumran scroll 4Q80[1] confirms that He was pierced.</p>

  - src: семь-церквей-апокалипсиса
    path: Sc1a_The_Seven_Churches_of_the_Apocalypse
    title: The Seven Churches of the Apocalypse
    meta_desc: Bible quotes about the seven churches of the Apocalypse
    menu: { parent: Prophecies, title: The Seven Churches of the Apocalypse, priority: 1 }
    body: |-
      <h2>The Assessment of the Churches of the Apocalypse</h2><p>One can encounter attempts by opponents of the Church to build an argument that she has abandoned the true faith, referring to the content of chapters 2–3 of the Revelation of John the Theologian (<a href="https://bibleox.com/en/eng-nkjv/otkr/2/#L1">Rev. 2:1</a>). In them the Lord Jesus Christ addresses seven Churches, pointing out their merits and shortcomings. In fact, if one examines the text, it is the opposite: the Churches keep the faith of Christ, and if some of them are reproached, it is for their <strong><mark>works</mark></strong>.</p><h3>1. <strong>Ephesus</strong></h3><p>✅ Praised for works (avoiding depravity, exposing false apostles, hating the deeds of the Nicolaitans, patience, labor for the Lord’s sake).</p><p>❌ Reproached for having left its first love; it is urged to return to it and do “the first <strong><mark>works</mark></strong>”.</p><h3>2. <strong>Smyrna</strong></h3><p>✅ Praised for works (enduring tribulation, poverty and slander). It is called not to fear that it will suffer persecution in the future. The crown of life is promised. It is not reproached for anything.</p><h3>3. <strong>Pergamos</strong></h3><p>✅ Praised for works (it did not deny the faith of Christ under threat of persecution).</p><p>❌ Reproached for <strong>not having expelled</strong> the Nicolaitans, who ate things sacrificed to idols and committed sexual immorality. At the same time the Church of Pergamos did not deny the faith of Christ: “you did not deny <strong>My</strong> <strong>faith</strong>”.</p><h3>4. <strong>Thyatira</strong></h3><p>✅ Praised for <strong>faith</strong> and works (love, service, patience).</p><p>❌ Reproached for likewise not having expelled “Jezebel”, allowing her to seduce believers into sexual immorality and eating things sacrificed to idols (as with the Nicolaitans in Pergamos). Only those who committed adultery with Jezebel are punished. The rest are praised: “<em>hold fast what you have till I come</em>”.</p><h3>5. <strong>Sardis</strong></h3><p>✅ Only a few people who have not defiled their garments are praised.</p><p>❌ Because of the other people it is compared to a dead one by reason of the imperfection of its works: “<em>I have not found your </em><strong><mark>works</mark></strong><em> perfect</em>”. It is reproached for not watching.</p><h3>6. <strong>Philadelphia</strong></h3><p>✅ Praised for works (though it has little strength, it has not denied Christ), and for keeping <em>the command of Christ’s perseverance</em>. It is urged: “<em>hold fast what you have</em>”. It is not reproached for anything.</p><h3>7. <strong>Laodicea</strong></h3><p>Not praised.</p><p>❌ Reproached for its works: “I know your <strong><mark>works</mark></strong>, that you are neither cold nor hot”. It is urged to buy from Christ gold, garments and eye salve, and to zeal and repentance: “<em>be zealous and repent</em>”.</p><h2>Summary</h2><p>So,</p><ul><li><p>🟢 Smyrna (2) and Philadelphia (6) are not reproached at all.</p></li><li><p>🟡 Pergamos (3) and Thyatira (4) have kept the faith, but are reproached for not having expelled the seducers (the Nicolaitans and Jezebel). It is precisely those who belong to the false teachings who are punished. The Church itself is praised: “you did not deny <strong>My</strong> <strong>faith</strong>” (Pergamos), “<em>hold fast what you have till I come</em>” (Thyatira).</p></li><li><p>🟠 Ephesus (1) is praised for piety and guarding the faith, reproached for leaving its first love, and urged to do the first <strong>works</strong>.</p></li><li><p>🟠 Sardis (5) is praised for a few people who kept their garments, and reproached for the imperfection of its <strong>works</strong>.</p></li><li><p>🔴 Laodicea (7) is praised for nothing, reproached for lukewarmness in its <strong>works</strong>, and called to repentance.</p></li></ul><h2>Conclusion</h2><ul><li><p>No one is reproached for faith, but almost all are praised (1, 2, 3, 4, 6).</p></li></ul><ul><li><p>Some are reproached for a shortcoming in one work, but praised for keeping the faith (3, 4).</p></li></ul><ul><li><p>Others have a more serious shortcoming in works, but in them too the faith has been preserved (1, 5).</p></li></ul><ul><li><p>The last is reproached for indifference to works (lukewarmness) (7).</p></li></ul><p>One might think that “works” could also mean faith. However, those Churches which unambiguously kept the faith are reproached for a shortcoming in works (3, 4), which hardly leaves room for such an interpretation. Thus the Churches of the Apocalypse are reproached not for their faith (as doctrine), but for imperfection in works. And some Churches are not reproached at all.</p>

  - src: второе_пришествие_Христа-по_Библии
    path: Sc1m_The_Second_Coming_of_Christ
    title: The Second Coming of Christ
    title_sub: Events connected with the Second Coming
    menu: { parent: Prophecies, title: The Second Coming of Christ, priority: 1 }
    references: |-
      <h4>Materials used (in Russian):</h4><ul><li><p><a href="https://azbyka.ru/hiliazm">https://azbyka.ru/hiliazm</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Oleg_Davydenkov/dogmaticheskoe-bogoslovie/13_4_1">https://azbyka.ru/otechnik/Oleg_Davydenkov/dogmaticheskoe-bogoslovie/13_4_1</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Evgenij-Veselov/eshatologija-sekt-protestantskogo-proishozhdenija/#0_42">https://azbyka.ru/otechnik/Evgenij-Veselov/eshatologija-sekt-protestantskogo-proishozhdenija/#0_42</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Aleksandr_Belyaev/skolko-vremeni-prodolzhitsja-tsarstvovanie-antihrista/">https://azbyka.ru/otechnik/Aleksandr_Belyaev/skolko-vremeni-prodolzhitsja-tsarstvovanie-antihrista/</a></p></li></ul>
    body: |-
      <h2>Events Before the Second Coming of Christ</h2><h3>The Short-Lived Reign of the Antichrist on Earth</h3><blockquote><p>“and he (the Son of God — note) cast him (Satan — note) into the bottomless pit, and shut him up, and set a seal on him, so that he should deceive the nations no more till the thousand years were finished. But after these things he must be released for a little while. &lt;…&gt; Now when the thousand years have expired, Satan will be released from his prison and will go out to deceive the nations which are in the four corners of the earth, Gog and Magog, to gather them together to battle, whose number is as the sand of the sea” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L3,7-8">Rev. 20:3,7-8</a>)</p></blockquote><p><strong>Possibly three and a half years (but this need not be literal)</strong></p><p>The woman (the Church) hides from the Antichrist for 3.5 years:</p><blockquote><p>“But the woman was given two wings of a great eagle, that she might fly into the wilderness to her place, where she is nourished for <strong>a time and times and half a time</strong>, from the presence of the serpent” (<a href="https://bibleox.com/en/eng-nkjv/otkr/12/#L14">Rev. 12:14</a>)</p></blockquote><blockquote><p>“He shall speak pompous words against the Most High, shall persecute the saints of the Most High, and shall intend to change times and law. Then the saints shall be given into his hand for <strong>a time and times and half a time</strong>” (<a href="https://bibleox.com/en/eng-nkjv/dan/7/#L25">Dan. 7:25</a>)</p></blockquote><p>Authority is given to the Antichrist for 42 months (12+12+12+6):</p><blockquote><p>“And he was given a mouth speaking great things and blasphemies, and he was given authority to continue for <strong>forty-two months</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/13/#L5">Rev. 13:5</a>)</p></blockquote><p>The Gentiles will fight against the Church for 42 months (12+12+12+6):</p><blockquote><p>“But leave out the court which is outside the temple, and do not measure it, for it has been given to the Gentiles. And they will tread the holy city underfoot for <strong>forty-two months</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/11/#L2">Rev. 11:2</a>)</p></blockquote><p>1290 days (365+365+365+182, 13 days short):</p><blockquote><p>“And from the time that the daily sacrifice is taken away, and the abomination of desolation is set up, there shall be <strong>one thousand two hundred and ninety days</strong>” (<a href="https://bibleox.com/en/eng-nkjv/dan/12/#L11">Dan. 12:11</a>)</p></blockquote><p><strong>For the sake of the elect, the time of the Antichrist’s reign will be shortened</strong></p><blockquote><p>“Therefore when you see the ‘abomination of desolation,’ spoken of by Daniel the prophet, standing in the holy place (whoever reads, let him understand), &lt;…&gt; for then there will be great tribulation, such as has not been since the beginning of the world until this time, no, nor ever shall be. And <strong>unless those days were shortened, no flesh would be saved; but for the elect’s sake those days will be shortened</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L15,21-22">Matt. 24:15,21-22</a>)</p></blockquote><p><strong>The Antichrist will pass himself off as God</strong></p><blockquote><p>“Let no one deceive you by any means; for that Day will not come unless the falling away comes first, and the man of sin is revealed, the son of perdition, who opposes and <strong>exalts himself above all that is called God or that is worshiped, so that he sits as God in the temple of God, showing himself that he is God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/2/#L3-4">2 Thess. 2:3-4</a>)</p></blockquote><p><strong>The end of the Antichrist’s reign</strong></p><p>Immediately before the Second Coming God puts an end to the reign of the Antichrist, and strikes the Antichrist himself and Satan with eternal punishment:</p><blockquote><p>“And fire came down from God out of heaven and devoured them. <strong>The devil</strong>, who deceived them, was cast into the lake of fire and brimstone where <strong>the beast</strong> <strong>and</strong> <strong>the false prophet</strong> are. And they will be tormented day and night forever and ever” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L9-10">Rev. 20:9-10</a>)</p></blockquote><h2>The Events of the Second Coming of the Lord Jesus Christ</h2><h3>The Cross Will Appear in the Sky</h3><blockquote><p>“Then <strong>the sign of the Son of Man will appear in heaven</strong>, and then all the tribes of the earth will mourn, and they will see the Son of Man coming on the clouds of heaven with power and great glory” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L30">Matt. 24:30</a>)</p></blockquote><h3>Christ Will Come with All the Holy Angels</h3><p>The Second Coming of Christ will take place in the glory of the Father, with all the holy angels:</p><blockquote><p><em>“When </em><strong><em>the Son of Man comes</em></strong><em> in His glory, </em><strong><em>and <mark>all the holy</mark> angels with Him</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31"><em>Matt. 25:31</em></a><em>)</em></p></blockquote><blockquote><p><em>“For whoever is ashamed of Me and My words in this adulterous and sinful generation, of him the Son of Man also will be ashamed when </em><strong><em>He comes in the glory of His Father <mark>with the holy</mark> angels</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mk/8/#L38"><em>Mark. 8:38</em></a><em>)</em></p></blockquote><blockquote><p><em>“For </em><strong><em>the Son of Man will come in the glory of His Father <mark>with His angels</mark></em></strong><em>, and then He will reward each according to his works” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27"><em>Matt. 16:27</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now Enoch, the seventh from Adam, prophesied about these men also, saying, ‘Behold, </em><strong><em>the Lord comes <mark>with ten thousands of His saints</mark></em></strong><em>’” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L14"><em>Jude. 1:14</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>at the coming of our Lord Jesus Christ <mark>with all His saints</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1sol/3/#L13"><em>1 Thess. 3:13</em></a><em>)</em></p></blockquote><blockquote><p><em>“when </em><strong><em>the Lord Jesus is revealed from heaven <mark>with His mighty angels</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L7"><em>2 Thess. 1:7</em></a><em>)</em></p></blockquote><blockquote><p><em>“Thus </em><strong><em>the LORD</em></strong><em> my </em><strong><em>God will come, and <mark>all the saints</mark> with You</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/zah/14/#L5"><em>Zech. 14:5</em></a><em>)</em></p></blockquote><h3>He Will Bring About the General Resurrection of the Dead</h3><p>The general resurrection of all people who ever lived: the righteous and the unrighteous:</p><blockquote><p>“I have hope in God, which they themselves also accept, that <strong>there will be a resurrection of the dead, both of the just and the unjust</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/24/#L15">Act. 24:15</a>)</p></blockquote><p>The resurrection will take place in transfigured incorruptible bodies; the righteous will shine like the sun:</p><blockquote><p>“Then <strong>the righteous will shine forth as the sun</strong> in the kingdom of their Father. He who has ears to hear, let him hear!” (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L43">Matt. 13:43</a>)</p></blockquote><p>Those who by the time of Christ’s Second Coming have not yet seen death will also be changed in accordance with the resurrected:</p><blockquote><p>“So also is <strong>the resurrection of the dead</strong>. The body is sown in corruption, it is raised in incorruption. &lt;…&gt; It is sown a natural body, it is raised a spiritual body. There is a natural body, and there is a spiritual body. &lt;…&gt; Behold, I tell you a mystery: <strong><mark>We shall not all sleep, but we shall all be changed — in a moment, in the twinkling of an eye</mark></strong>, at the last trumpet. For the trumpet will sound, and <strong><mark>the dead will be raised incorruptible, and we shall be changed</mark></strong>. <strong>For this corruptible must put on incorruption</strong>, and this mortal must put on immortality” (<a href="https://bibleox.com/en/eng-nkjv/1kor/15/#L42,44,51-53">1 Cor. 15:42,44,51-53</a>)</p></blockquote><blockquote><p>“But I do not want you to be ignorant, brethren, concerning those who have fallen asleep, lest you sorrow as others who have no hope. For if we believe that Jesus died and rose again, even so God will bring with Him those who sleep in Jesus. For this we say to you by the word of the Lord, that <strong>we <mark>who are alive and remain until the coming of the Lord</mark> will by no means precede (go ahead of — note) those who are asleep</strong>. For <strong><mark>the Lord Himself will descend from heaven</mark></strong> with a shout, with the voice of an archangel, and with the trumpet of God. <strong><mark>And the dead in Christ will rise first</mark></strong>. <strong>Then we <mark>who are alive and remain</mark></strong> <strong>shall be caught up together with them in the clouds to meet the Lord</strong> in the air. And thus we shall always be with the Lord” (<a href="https://bibleox.com/en/eng-nkjv/1sol/4/#L13-17">1 Thess. 4:13-17</a>)</p></blockquote><h3>Christ Will Send Angels to Gather All the Resurrected</h3><p>The angels will gather the righteous and the unrighteous:</p><blockquote><p>“And then He will <strong>send His angels</strong>, and <strong>gather together His elect</strong> from the four winds, from the farthest part of earth to the farthest part of heaven” (<a href="https://bibleox.com/en/eng-nkjv/mk/13/#L27">Mark. 13:27</a>)</p></blockquote><blockquote><p>“<strong>The Son of Man will send out His angels, and they will gather</strong> out of His kingdom all things that offend, and <strong>those who practice lawlessness</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/13/#L41">Matt. 13:41</a>)</p></blockquote><h3>Christ Will Pronounce the Sentence</h3><blockquote><p>“When the Son of Man comes in His glory, and all the holy angels with Him, then <strong>He will sit on the throne of His glory</strong>. All the nations will be gathered before Him, and He will separate them one from another, as a shepherd divides his sheep from the goats. And He will set the sheep on His right hand, but the goats on the left. Then the King will say to those on His right hand, ‘<strong>Come, you blessed of My Father, inherit the kingdom</strong> prepared for you from the foundation of the world: for I was hungry and you gave Me food; I was thirsty and you gave Me drink; I was a stranger and you took Me in; I was naked and you clothed Me; I was sick and you visited Me; I was in prison and you came to Me.’ Then the righteous will answer Him, saying, ‘Lord, when did we see You hungry and feed You, or thirsty and give You drink? When did we see You a stranger and take You in, or naked and clothe You? Or when did we see You sick, or in prison, and come to You?’ And the King will answer and say to them, ‘Assuredly, I say to you, inasmuch as you did it to one of the least of these My brethren, you did it to Me.’ Then He will also say to those on the left hand, ‘<strong>Depart from Me, you cursed, into the everlasting fire</strong> prepared for the devil and his angels: for I was hungry and you gave Me no food; I was thirsty and you gave Me no drink; I was a stranger and you did not take Me in, naked and you did not clothe Me, sick and in prison and you did not visit Me.’ Then they also will answer Him, saying, ‘Lord, when did we see You hungry or thirsty or a stranger or naked or sick or in prison, and did not minister to You?’ Then He will answer them, saying, ‘Assuredly, I say to you, inasmuch as you did not do it to one of the least of these, you did not do it to Me.’ And these will go away into everlasting punishment, but the righteous into eternal life” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-46">Matt. 25:31-46</a>)</p></blockquote><h3>The Saved Will Be Taken to Eternal Life with Christ</h3><blockquote><p>“For the Lord Himself will descend from heaven with a shout, with the voice of an archangel, and with the trumpet of God. And the dead in Christ will rise first. Then we who are alive and remain <strong>shall be caught up together with them in the clouds to meet the Lord in the air. And thus we shall always be with the Lord</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1sol/4/#L16-17">1 Thess. 4:16-17</a>)</p></blockquote><h3>The Lost Will Be Sent into Eternal Punishment</h3><blockquote><p>“And <strong>these will go away into everlasting punishment</strong>, but the righteous into eternal life” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L46">Matt. 25:46</a>)</p></blockquote><p>Both salvation and punishment, as it is written, will be eternal.</p><h2>Important Details of the Second Coming</h2><h3>The Coming Will Be Like Lightning</h3><p>The Second Coming of Christ will instantly be known to everyone throughout the world, like a flash of lightning:</p><blockquote><p><em>“And </em><strong><em>they will say to you, ‘Look here!’</em></strong><em> or ‘Look there!’ </em><strong><em>Do not go after them or follow them</em></strong><em>. For </em><strong><em>as the lightning</em></strong><em> that flashes out of one part under heaven shines to the other part under heaven, </em><strong><em>so also the Son of Man will be in His day</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/lk/17/#L23-24"><em>Luke. 17:23-24</em></a><em>)</em></p></blockquote><blockquote><p><em>“Therefore if </em><strong><em>they say to you, ‘Look, He is in the desert!’</em></strong><em> do not go out; or ‘Look, He is in the inner rooms!’ do not believe it. For </em><strong><em>as the lightning comes from the east and flashes to the west, so also will the coming of the Son of Man be</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/24/#L26-27"><em>Matt. 24:26-27</em></a><em>)</em></p></blockquote><h3>Christ Will Come in the Same Adult Body</h3><p>Christ will not be born again of people, but will come in the body He already has, received by Him at His birth from the Virgin Mary, the Theotokos, in the 1st year of our era:</p><blockquote><p><em>“Now when He had spoken these things, while they watched, He was taken up, and a cloud received Him out of their sight. And while they looked steadfastly toward heaven as He went up, behold, two men stood by them in white apparel, who also said, ‘Men of Galilee, why do you stand gazing up into heaven? </em><strong><em>This same Jesus, who was taken up from you into heaven, will so come in like manner as you saw Him go into heaven</em></strong><em>’” (</em><a href="https://bibleox.com/en/eng-nkjv/act/1/#L9-11"><em>Act. 1:9-11</em></a><em>)</em></p></blockquote><h3>The Coming for Judgment</h3><p>The Lord will come not to teach, but to judge according to the word which He already gave when He came the first time:</p><blockquote><p><em>“He who rejects Me, and does not receive My words, has that which judges him — </em><strong><em>the word that I have spoken <mark>will judge</mark> him in the last day</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/in/12/#L48"><em>John. 12:48</em></a><em>)</em></p></blockquote><blockquote><p><em>“For the Son of Man will come in the glory of His Father with His angels, and then </em><strong><em>He will <mark>reward each</mark> according to his works</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27"><em>Matt. 16:27</em></a><em>)</em></p></blockquote><blockquote><p><em>“When </em><strong><em>the Son of Man comes in His glory</em></strong><em>, and all the holy angels with Him, then </em><strong><em>He will sit on the throne</em></strong><em> of His glory. </em><strong><em>All the nations will be gathered before Him</em></strong><em>, and </em><strong><em><mark>He will separate them one from another</mark></em></strong><em>, as a shepherd divides his sheep from the goats. And He will set the sheep on His right hand, but the goats on the left. &lt;…&gt; And </em><strong><em>these will go away into everlasting punishment, but the righteous into eternal life</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-33,46"><em>Matt. 25:31-33,46</em></a><em>)</em></p></blockquote><blockquote><p><em>“which is manifest evidence of </em><strong><em><mark>the righteous judgment of God</mark></em></strong><em>, that you may be counted worthy of the kingdom of God, for which you also suffer; since it is a righteous thing with God to repay with tribulation those who trouble you, and to give you who are troubled rest with us </em><strong><em>when the Lord Jesus is revealed from heaven with His mighty angels</em></strong><em>, </em><strong><em><mark>in flaming fire taking vengeance</mark></em></strong><em> on those who do not know God, and on those who do not obey the gospel of our Lord Jesus Christ” (</em><a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L5-8"><em>2 Thess. 1:5-8</em></a><em>)</em></p></blockquote><h3>The Second Coming and the Judgment Are Inseparably Connected</h3><p>At the Second Coming of Christ the judgment of all people in general takes place, and not only of sinners. Some the Lord will reward, and others He will punish:</p><blockquote><p><em>“When </em><strong><em><mark>the Son of Man comes</mark> in His glory, and <mark>all the holy angels with Him</mark></em></strong><em>, then </em><strong><em>He will sit on the throne</em></strong><em> of His glory. </em><strong><em>All the nations will be gathered before Him</em></strong><em>, and </em><strong><em><mark>He will separate them one from another</mark></em></strong><em>, as a shepherd divides his sheep from the goats. And He will set the sheep on His right hand, but the goats on the left. &lt;…&gt; And </em><strong><em><mark>these will go away into everlasting punishment, but the righteous into eternal life</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-33,46"><em>Matt. 25:31-33,46</em></a><em>)</em></p></blockquote><blockquote><p>“Then I saw a great white throne and Him who sat on it, from whose face the earth and the heaven fled away. And there was found no place for them. And I saw the dead, small and great, standing before God, and books were opened. And another book was opened, which is the Book of Life. And <strong><mark>the dead were judged according to their works, by the things which were written in the books</mark></strong>. The sea gave up the dead who were in it, and <strong>Death and Hades delivered up the dead who were in them. And they were judged, each one according to his works</strong>. Then Death and Hades were cast into the lake of fire. <strong>This is the second death</strong>. And anyone not found written in the Book of Life was cast into the lake of fire” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L11-15">Rev. 20:11-15</a>)</p></blockquote><blockquote><p><em>“For </em><strong><em><mark>the Son of Man will come</mark> in the glory of His Father <mark>with His angels</mark></em></strong><em>, and then </em><strong><em><mark>He will reward each according to his works</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27"><em>Matt. 16:27</em></a><em>)</em></p></blockquote><blockquote><p>“When <strong><mark>the Son of Man comes</mark> in His glory, and all the holy angels with Him, then He will sit on the throne</strong> of His glory. <strong><mark>All the nations</mark> will be gathered before Him</strong>, and <strong>He will <mark>separate</mark> them one from another</strong>, as a shepherd divides his sheep from the goats. &lt;…&gt; Then <strong><mark>the King will say to those on His right hand</mark></strong>, ‘Come, <strong><mark>you blessed</mark></strong> of My Father, inherit the kingdom prepared for you from the foundation of the world.’ &lt;…&gt; Then <strong><mark>He will also say to those on the left hand</mark></strong>, ‘Depart from Me, <strong><mark>you cursed</mark></strong>, into the everlasting fire prepared for the devil and his angels’” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32,34,41">Matt. 25:31-32,34,41</a>)</p></blockquote><blockquote><p>“which is manifest evidence of the righteous judgment of God, that you may be counted worthy of the kingdom of God, for which you also suffer; since it is a righteous thing with God <strong><mark>to repay with tribulation those who trouble you, and to give you who are troubled rest with us when the Lord Jesus is revealed from heaven with His mighty angels</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L5-7">2 Thess. 1:5-7</a>)</p></blockquote><blockquote><p>“And he said to me, ‘Do not seal the words of the prophecy of this book, for the time is at hand. <strong>He who is unjust, let him be unjust <mark>still</mark>; he who is filthy, let him be filthy <mark>still</mark>; he who is righteous, let him be righteous <mark>still</mark>; he who is holy, let him be holy still.’ ‘And behold, <mark>I am coming quickly</mark>, and My reward is with Me, <mark>to give to every one according to his work</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/22/#L10-12">Rev. 22:10-12</a>)</p></blockquote><h3>All Are Subject to Judgment</h3><blockquote><p><em>“For </em><strong><em><mark>we must all appear before the judgment seat of Christ</mark></em></strong><em>, that each one may receive the things done in the body, according to what he has </em><strong><em><mark>done</mark></em></strong><em>, whether </em><strong><em><mark>good</mark> or <mark>bad</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2kor/5/#L10"><em>2 Cor. 5:10</em></a><em>)</em></p></blockquote><blockquote><p><em>“For </em><strong><em>God will bring every work into judgment</em></strong><em>, including every secret thing, </em><strong><em>whether good or evil</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/ekl/12/#L14"><em>Eccl. 12:14</em></a><em>)</em></p></blockquote><blockquote><p>“For <strong>the time has come for judgment to begin at the house of God; and if it begins with us first</strong>, what will be the end of those who do not obey the gospel of God? Now ‘If the righteous one is scarcely saved, where will the ungodly and the sinner appear?’” (<a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18">1 Pet. 4:17-18</a>)</p></blockquote><blockquote><p>“But why do you judge your brother? Or why do you show contempt for your brother? For <strong>we shall all stand before the judgment seat of Christ</strong>” (<a href="https://bibleox.com/en/eng-nkjv/rim/14/#L10">Rom. 14:10</a>)</p></blockquote><blockquote><p>“So speak and so <strong>do as those who will be judged</strong> by the law of liberty” (<a href="https://bibleox.com/en/eng-nkjv/iak/2/#L12">James. 2:12</a>)</p></blockquote><blockquote><p>“When the Son of Man comes in His glory, and all the holy angels with Him, then He will sit on the throne of His glory. <strong>All the nations will be gathered before Him</strong>, and He will separate them one from another, as a shepherd divides his sheep from the goats” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-32">Matt. 25:31-32</a>)</p></blockquote><h3>The Judgment Will Begin with the Church</h3><blockquote><p><em>“For </em><strong><em><mark>the time has come for judgment to begin at the house of God</mark></em></strong><em>; and if </em><strong><em><mark>it begins with us first</mark></em></strong><em>, what will be the end of those who do not obey the gospel of God? Now ‘If </em><strong><em>the righteous one is scarcely saved</em></strong><em>, where will the ungodly and the sinner appear?’” (</em><a href="https://bibleox.com/en/eng-nkjv/1pet/4/#L17-18"><em>1 Pet. 4:17-18</em></a><em>)</em></p></blockquote><h3>The Saints Will Judge the World</h3><blockquote><p>“So Jesus said to them, ‘Assuredly I say to you, that in the regeneration, when the Son of Man sits on the throne of His glory, you who have followed Me <strong>will also sit on twelve thrones, judging</strong> the twelve tribes of Israel’” (<a href="https://bibleox.com/en/eng-nkjv/mf/19/#L28">Matt. 19:28</a>)</p></blockquote><blockquote><p>“And I bestow upon you a kingdom, just as My Father bestowed one upon Me, that you may eat and drink at My table in My kingdom, and <strong>sit on thrones judging</strong> the twelve tribes of Israel” (<a href="https://bibleox.com/en/eng-nkjv/lk/22/#L29-30">Luke. 22:29-30</a>)</p></blockquote><blockquote><p>“Do you not know that <strong>the saints will judge</strong> the world? And if the world will be judged by you, are you unworthy to judge the smallest matters?” (<a href="https://bibleox.com/en/eng-nkjv/1kor/6/#L2">1 Cor. 6:2</a>)</p></blockquote><h3>Many Will Be Surprised Not to Receive Salvation</h3><p>They thought they were saved:</p><blockquote><p><em>“</em><strong><em>Many</em></strong><em> will say to Me in that day, ‘Lord, Lord, have we not </em><strong><em>prophesied</em></strong><em> in Your name, </em><strong><em>cast out demons</em></strong><em> in Your name, and </em><strong><em>done many wonders</em></strong><em> in Your name?’ And then I will declare to them, ‘</em><strong><em>I never knew you; depart from Me,</em></strong><em> you who practice lawlessness!’” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23"><em>Matt. 7:22-23</em></a><em>)</em></p></blockquote><h3>The Transfiguration of the World</h3><blockquote><p>“Now I saw <strong>a new heaven and a new earth</strong>, for the first heaven and the first earth had passed away. Also there was no more sea. Then I, John, saw the holy city, New Jerusalem, coming down out of heaven from God, prepared as a bride adorned for her husband. And I heard a loud voice from heaven saying, ‘Behold, the tabernacle of God is with men, and He will dwell with them, and they shall be His people. God Himself will be with them and be their God. And God will wipe away every tear from their eyes; there shall be no more death, nor sorrow, nor crying. There shall be no more pain, for the former things have passed away.’ Then He who sat on the throne said, ‘<strong><mark>Behold, I make all things new</mark></strong>.’ And He said to me, ‘Write, for these words are true and faithful.’ And He said to me, ‘It is done! I am the Alpha and the Omega, the Beginning and the End. I will give of the fountain of the water of life freely to him who thirsts’” (<a href="https://bibleox.com/en/eng-nkjv/otkr/21/#L1-6">Rev. 21:1-6</a>)</p></blockquote><h2>On the Expression “1000 Years”</h2><h3>1000 Years Is a Figurative Name for the Period from the First to the Second Coming of Christ</h3><p>The first coming has already taken place. The Son of God became incarnate: without ceasing to be what He was before (God), He also became man. He taught, suffered, rose, sat down in the heavens, created the Church (one: earthly and heavenly) and sent her to preach. Those who respond to the preaching of Christ, enter His Church, attain salvation and life with Him in heaven, are spoken of as reigning with Him, although their bodies, as those of the dead, are still in the earth, while <a href="https://bibleox.com/ru/ru/w/%D0%B6%D0%B8%D0%B7%D0%BD%D1%8C-%D0%B4%D1%83%D1%88%D0%B8-%D0%BF%D0%BE%D1%81%D0%BB%D0%B5-%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%B8-%D1%82%D0%B5%D0%BB%D0%B0">their souls abide with Christ</a>. So it will be right up to the Second Coming of the Lord Jesus Christ, the time of which no one knows except God (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L7">Act. 1:7</a>). This whole period from the first to the Second Coming is figuratively called a thousand years:</p><blockquote><p>“Then I saw an angel (the Son of God — note) coming down from heaven, having the key to the bottomless pit and a great chain in his hand. He laid hold of the dragon, that serpent of old, who is the Devil and Satan, and bound him for <strong>a thousand years</strong>; and he cast him into the bottomless pit, and shut him up, and set a seal on him, so that he should deceive the nations no more till <strong>the thousand years</strong> were finished. &lt;…&gt; And they lived and reigned with Christ for a thousand years. But the rest of the dead did not live again <strong>until the thousand years were finished</strong>. This is the first resurrection. Blessed and holy is he who has part in the first resurrection. Over such the second death has no power, but they shall be priests of God and of Christ, and shall reign with Him <strong>a thousand years</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L1-6">Rev. 20:1-6</a>)</p></blockquote><h3>On the Heresy of Chiliasm (Millenarianism)</h3><p>Chiliasm (millenarianism), the teaching of an earthly kingdom of Christ lasting 1000 years, cannot be accepted by Orthodox Christians because of:</p><ol><li><p>the impossibility of acknowledging <strong>two</strong> <strong>bodily resurrections</strong> (the Lord taught of only one resurrection);</p></li><li><p>the impossibility of acknowledging <strong>two</strong> <strong>Dread Judgments</strong> (again, the Lord teaches of only one judgment);</p></li><li><p>the impossibility of acknowledging a <strong>special</strong> <strong>coming</strong> <strong>of Christ</strong> before the Dread Judgment for the sake of an earthly rule over the world;</p></li><li><p>the impossibility of acknowledging some <strong>special Thousand-Year Kingdom</strong> <strong>of Christ</strong> already in this world, distinct from the Kingdom of Heaven.</p></li></ol><p>More: <a href="https://bibleox.com/ru/ru/w/%D1%85%D0%B8%D0%BB%D0%B8%D0%B0%D0%B7%D0%BC/">chiliasm (in Russian)</a></p><h2>On the “Two Resurrections”</h2><blockquote><p>“Then I saw an angel (the Son of God — note) coming down from heaven, having the key to the bottomless pit and a great chain in his hand. He laid hold of the dragon, that serpent of old, who is the Devil and Satan, and bound him for a thousand years; and he cast him into the bottomless pit, and shut him up, and set a seal on him, so that he should deceive the nations no more till the thousand years were finished. &lt;…&gt; And they lived and reigned with Christ for a thousand years. But the rest of the dead did not live again until the thousand years were finished. <strong>This is the first resurrection</strong>. Blessed and holy is he who has part <strong>in the first resurrection</strong>. Over such the second death has no power, but they shall be priests of God and of Christ, and shall reign with Him a thousand years” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L1-6">Rev. 20:1-6</a>)</p></blockquote><h3>The First Resurrection — Turning to God Through Preaching and Baptism</h3><p>The Lord bound Satan. The pagan cults began to be overcome by Christianity and to disappear. People received the possibility of spiritually rising to eternal life with God through Baptism, the Eucharist and life in the Church. This spiritual resurrection to eternal life is called the first resurrection in the text:</p><blockquote><p>“This is <strong>the first resurrection</strong>. Blessed and holy is he who has part in the first resurrection. Over such the second death has no power” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L5-6">Rev. 20:5-6</a>)</p></blockquote><p>Turning to God is called a passing from death to life:</p><blockquote><p>“even <strong>when we were dead in trespasses, made us alive together with Christ</strong> (by grace you have been saved), and raised us up together, and made us sit together in the heavenly places in Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/ef/2/#L5-6">Eph. 2:5-6</a>)</p></blockquote><p>The believer has passed from death into life:</p><blockquote><p>“Most assuredly, I say to you, <strong>he who hears My word and believes in Him who sent Me has</strong> everlasting <strong>life</strong>, and shall not come into judgment, but <strong>has passed from death into life</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/5/#L24">John. 5:24</a>)</p></blockquote><p>Those who have not believed are called simply the dead:</p><blockquote><p>“Jesus said to him, ‘<strong>Let the dead bury their own dead</strong>, but you go and preach the kingdom of God’” (<a href="https://bibleox.com/en/eng-nkjv/lk/9/#L60">Luke. 9:60</a>)</p></blockquote><h3>The Second Resurrection — the Resurrection of All People in Their Bodies for the General Judgment</h3><p>The second resurrection will concern all people in general. It means the resurrection of all people who ever lived for the general judgment. All souls return to their restored bodies, so that all that strove toward God (soul and body) may receive a reward, and all that sinned (soul and body) may receive punishment.</p><blockquote><p>“I have hope in God, which they themselves also accept, that <strong>there will be a resurrection of the dead, both of the just and the unjust</strong>” (<a href="https://bibleox.com/en/eng-nkjv/act/24/#L15">Act. 24:15</a>)</p></blockquote><h3>More on the “Two Resurrections”</h3><blockquote><p>“<strong>But the rest of the dead did not live again until the thousand years were finished. This is the first resurrection</strong>” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L5">Rev. 20:5</a>).</p></blockquote><p>Everyone was given time to rise during the period of the first resurrection, and everything was given for this. But nevertheless some rose, and others did not rise, when the dead were to rise — that is, throughout the whole thousand years (until the thousand years allotted for this were finished).</p><p>The first rose while still living in the body, that is, they turned to Christ:</p><blockquote><p>“Blessed and holy is he who has part in the first resurrection. Over such the second death has no power, but they shall be priests of God and of Christ, and shall reign with Him a thousand years” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L6">Rev. 20:6</a>).</p></blockquote><p>Over them <strong>the second death</strong> will have no power.</p><p>Here is the resurrection of all people in general in their bodies for the general judgment:</p><blockquote><p>“The sea gave up the dead who were in it, and Death and Hades delivered up the dead who were in them. And they were judged, each one according to his works. Then Death and Hades were cast into the lake of fire. This is the second death. And anyone not found written in the Book of Life was cast into the lake of fire” (<a href="https://bibleox.com/en/eng-nkjv/otkr/20/#L13-15">Rev. 20:13-15</a>).</p></blockquote><p>Being cast into the lake of fire is <strong>the second death</strong>. Those who were written in the Book of Life were not cast there — that is, those of whom it was said in 20:6 that over them the second death has no power.</p>

  - src: пророчества-о-ложных-учениях
    path: Ph5r_Prophecies_About_Heresies
    title: Prophecies About Heresies
    title_sub: heresies, divisions, false prophets
    meta_desc: Bible quotes about the spread of false teachings
    menu: { parent: Prophecies, title: Prophecies About Heresies, priority: 5 }
    body: |-
      <h2>Many Heresies Will Arise in Christianity</h2><blockquote><p><em>“For </em><strong><em><mark>many</mark> will come in My name, </em></strong><em>saying, ‘I am He,’ and </em><strong><em>will deceive <mark>many</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mk/13/#L6"><em>Mark. 13:6</em></a><em>)</em></p></blockquote><blockquote><p><em>“Then </em><strong><em><mark>many</mark> false prophets will rise up and deceive <mark>many</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/24/#L11"><em>Matt. 24:11</em></a><em>)</em></p></blockquote><blockquote><p><em>“Beloved, do not believe every spirit, but test the spirits, whether they are of God; because </em><strong><em><mark>many</mark></em></strong><em> </em><strong><em>false prophets</em></strong><em> have gone out into the world” (</em><a href="https://bibleox.com/en/eng-nkjv/1in/4/#L1"><em>1 John. 4:1</em></a><em>)</em></p></blockquote><h2>Heresies Will Spread Very Widely</h2><blockquote><p><em>“And </em><strong><em><mark>their message will spread like cancer</mark></em></strong><em>. Hymenaeus and Philetus are of this sort, who </em><strong><em>have strayed concerning the truth</em></strong><em>, saying that the resurrection is already past; and they overthrow the faith of some” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/2/#L17-18"><em>2 Tim. 2:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>“But there were also false prophets among the people (of Israel — note), even as there will be false teachers among you (Christians — note), who will </em><strong><em>secretly bring in destructive heresies</em></strong><em>, even denying the Lord who bought them, and bring on themselves swift destruction. And </em><strong><em><mark>many</mark> will follow their destructive ways, because of whom the way of truth will be blasphemed</em></strong><em>. </em><strong><em>By covetousness</em></strong><em> they </em><strong><em>will exploit</em></strong><em> you with deceptive words; for a long time their judgment has not been idle, and their destruction does not slumber” (</em><a href="https://bibleox.com/en/eng-nkjv/2pet/2/#L1-3"><em>2 Pet. 2:1-3</em></a><em>).</em></p></blockquote><h2>Communities of Heretics Will Separate from the Church and Her Unity of Faith</h2><blockquote><p><em>“Little children, it is the last hour; and as you have heard that the Antichrist is coming, even now many antichrists have come, by which we know that it is the last hour. </em><strong><em>They went out from us, but they were not of us; for <mark>if they had been of us, they would have continued with us</mark></em></strong><em>; but they went out that they might be made manifest, that none of them were of us” (</em><a href="https://bibleox.com/en/eng-nkjv/1in/2/#L18-19"><em>1 John. 2:18-19</em></a><em>)</em></p></blockquote><blockquote><p><em>“how they told you that there would be mockers </em><strong><em>in the last time</em></strong><em> who would walk according to their own ungodly lusts. These are sensual persons, </em><strong><em><mark>who cause divisions (separate themselves from the unity of faith)</mark></em></strong><em>, not having the Spirit” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L18-19"><em>Jude. 1:18-19</em></a><em>)</em></p></blockquote><h2>The Aim of False Teachers Is to Steal the Believer Away from the Church and Lead Him After Them</h2><blockquote><p><em>“For I know this, that after my departure </em><strong><em>savage wolves will come in among you, not sparing the flock. Also from among yourselves men will rise up, <mark>speaking perverse things</mark>, <mark>to draw away</mark> the disciples <mark>after themselves</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/act/20/#L29-30"><em>Act. 20:29-30</em></a><em>)</em></p></blockquote><h2>The Methods of False Teachers</h2><h3>1. Pleasant Teachings</h3><p>False teachers will invent pleasant teachings precisely because their hearers will seek teaching pleasant to the ear, not enduring sound doctrine:</p><blockquote><p><em>“For the time will come when </em><strong><em>they will not endure sound doctrine</em></strong><em>, but </em><strong><em>according to their own desires, because they <mark>have itching ears</mark>, they will heap up for themselves <mark>teachers</mark></em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/4/#L3"><em>2 Tim. 4:3</em></a><em>)</em></p></blockquote><blockquote><p><em>“Now the Spirit expressly says that </em><strong><em>in latter times some will depart from the faith, <mark>giving heed to deceiving spirits</mark> and doctrines of demons</em></strong><em>, speaking lies in hypocrisy, having their own conscience seared with a hot iron” (</em><a href="https://bibleox.com/en/eng-nkjv/1tim/4/#L1-2"><em>1 Tim. 4:1-2</em></a><em>)</em></p></blockquote><h3>2. Feigned Piety</h3><blockquote><p><em>“But know this, that </em><strong><em>in the last days</em></strong><em> perilous times will come: For men will be lovers of themselves, lovers of money, boasters, proud, blasphemers, disobedient to parents, unthankful, unholy, &lt;…&gt; </em><strong><em><mark>having a form of godliness</mark></em></strong><em> but denying its power. And from such people turn away! &lt;…&gt; always learning and never able to come to the knowledge of the truth. Now as Jannes and Jambres resisted Moses, so do these also </em><strong><em>resist the truth: men of corrupt minds, disapproved concerning the faith</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L1-2,5,7-8"><em>2 Tim. 3:1-2,5,7-8</em></a><em>)</em></p></blockquote><blockquote><p><em>“Beware of </em><strong><em>false prophets</em></strong><em>, who </em><strong><em>come to you <mark>in sheep’s clothing</mark></em></strong><em>, but inwardly they are ravenous wolves” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/7/#L15"><em>Matt. 7:15</em></a><em>)</em></p></blockquote><h3>3. Showy Miracles</h3><p>Abundant powers of working miracles were given to the apostles and the early Christians not for show, but for benefit:</p><blockquote><p><em>“But the manifestation of the Spirit is given to each one </em><strong><em>for the profit of all</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/12/#L7"><em>1 Cor. 12:7</em></a><em>)</em></p></blockquote><p>A small group of fishermen needed great help so that in their short lives, as eyewitnesses, they could carry the preaching throughout the whole world. The apostles warned that these gifts would cease:</p><blockquote><p><em>“Love never fails. But whether there are </em><strong><em>prophecies, they will fail; whether there are tongues, they will cease</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8"><em>1 Cor. 13:8</em></a><em>)</em></p></blockquote><p>Christ Himself condemned the seeking of miracles:</p><blockquote><p><em>“</em><strong><em>An evil and adulterous generation seeks after a sign</em></strong><em>, and no sign will be given to it except the sign of the prophet Jonah” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/12/#L39"><em>Matt. 12:39</em></a><em>)</em></p></blockquote><p>In the last times false prophets will draw people away precisely by miracles:</p><blockquote><p><em>“For false christs and false prophets will rise and </em><strong><em>show great signs and wonders to deceive</em></strong><em>, if possible, even the elect” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/24/#L24"><em>Matt. 24:24</em></a><em>; </em><a href="https://bibleox.com/en/eng-nkjv/mk/13/#L22"><em>Mark. 13:22</em></a><em>)</em></p></blockquote><p>As a result, at the Judgment many believers will be convinced that they are saved precisely because they worked miracles in the name of Christ, prophesied and cast out demons. But they turned out to have been deceived, taught lawlessness; Christ does not know them and drives them away from Himself:</p><blockquote><p><em>“Many will say to Me in that day, ‘Lord, Lord, have we not prophesied in Your name, cast out demons in Your name, and </em><strong><em>done many wonders in Your name?</em></strong><em>’ And then I will declare to them, ‘</em><strong><em>I never knew you;</em></strong><em> </em><strong><em>depart from Me</em></strong><em>, you who practice lawlessness!’” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/7/#L22-23"><em>Matt. 7:22-23</em></a><em>)</em></p></blockquote><h2>How to Recognize a False Prophet</h2><p>His prophecies are not fulfilled:</p><blockquote><p>“when a prophet speaks in the name of the LORD, if the thing does not happen or <strong>come to pass</strong>, that is the thing which the LORD has not spoken; the prophet has spoken it presumptuously; you shall not be afraid of him” (<a href="https://bibleox.com/en/eng-nkjv/vtor/18/#L22">Deut. 18:22</a>)</p></blockquote><p>But if a prophet or a dreamer shows some sign, a miracle, or his dream comes true, but he calls one to serve another god, he should not be listened to:</p><blockquote><p>“If there arises among you a prophet or a dreamer of dreams, and <strong>he gives you a sign or a wonder, and the sign or the wonder comes to pass</strong>, of which he spoke to you, saying, <strong>‘Let us go after other gods’ — which you have not known — ‘and let us serve them,’</strong> <strong>you shall not listen to the words of that prophet</strong> or that dreamer of dreams, for the LORD your God is testing you to know whether you love the LORD your God with all your heart and with all your soul. You shall walk after the LORD your God and fear Him, and keep His commandments and obey His voice; you shall serve Him and hold fast to Him” (<a href="https://bibleox.com/en/eng-nkjv/vtor/13/#L1-4">Deut. 13:1-4</a>)</p></blockquote>

  - src: лжехристос
    path: Fc6t_False_Christs
    title: False Christs
    title_sub: On those people who pass themselves off as Christ
    menu: { parent: Prophecies, title: False Christs, priority: 6 }
    body: |-
      <h2>Preface</h2><p>The Lord Jesus Christ was born more than 2000 years ago of the most pure Virgin Mary (without a husband), in accordance with the <a href="https://bibleox.com/ru/ru/w/%D0%BF%D1%80%D0%BE%D1%80%D0%BE%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%B0-%D0%BE-%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B5">words of the ancient prophets</a>. He possessed great wisdom already in boyhood (at 12 years of age), amazing the teachers in the Jerusalem Temple. Until the age of 30 Jesus Christ was in obedience to Joseph and did ordinary work, and at 30 He went out to preach. More about this period: <a href="https://bibleox.com/ru/ru/w/%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%B6%D0%B8%D0%B7%D0%BD%D1%8C-%D0%B2-%D0%9F%D0%B0%D0%BB%D0%B5%D1%81%D1%82%D0%B8%D0%BD%D0%B5">Christ — Life in Palestine</a>.</p><p>Then the Lord Jesus Christ preached, instructed His disciples (the apostles), was betrayed, suffered on the Cross, rose on the third day, appeared to His followers for 40 days, teaching them about the Kingdom of Heaven, and then ascended into heaven, sat down at the right hand of God and promised to return a second time in the same way as He ascended, in order to judge the whole universe. And 10 days later (on the 50th day after the resurrection) He created His Church and sent the Holy Spirit to her forever.</p><h2>On False Christs</h2><h3>Deceivers</h3><p>The Lord Jesus Christ Himself warned that deceivers would come, passing themselves off as Him, and many people would believe these deceivers:</p><blockquote><p>“Now as He sat on the Mount of Olives, the disciples came to Him privately, saying, ‘Tell us, when will these things be? And what will be the sign of Your coming, and of the end of the age?’ And Jesus answered and said to them: ‘<strong>Take heed that no one deceives you. For many will come in My name, saying, “I am the Christ,” and will deceive many</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L3-5">Matt. 24:3-5</a>)</p></blockquote><h2>On the Coming of Christ</h2><h3>The Coming Will Be Like Lightning</h3><p>However, the Second Coming of Christ will instantly be known to everyone throughout the world, like a flash of lightning:</p><blockquote><p>“And <strong>they will say to you, ‘Look here!’</strong> or ‘Look there!’ <strong>Do not go after them or follow them</strong>. For <strong>as the lightning</strong> that flashes out of one part under heaven shines to the other part under heaven, <strong>so also the Son of Man will be in His day</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/17/#L23-24">Luke. 17:23-24</a>)</p></blockquote><blockquote><p>“Therefore if <strong>they say to you, ‘Look, He is in the desert!’</strong> do not go out; or ‘Look, He is in the inner rooms!’ do not believe it. For <strong>as the lightning comes from the east and flashes to the west, so also will the coming of the Son of Man be</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/24/#L26-27">Matt. 24:26-27</a>)</p></blockquote><h3>The Coming with All the Angels</h3><p>The Second Coming of Christ will take place in the glory of the Father, with all His saints:</p><blockquote><p><em>“Thus </em><strong><em>the LORD</em></strong><em> my </em><strong><em>God will come, and</em></strong><em> </em><strong><em>all the saints with You</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/zah/14/#L5"><em>Zech. 14:5</em></a><em>)</em></p></blockquote><blockquote><p><em>“When </em><strong><em>the Son of Man comes</em></strong><em> in His glory, </em><strong><em>and all the holy angels with Him</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31"><em>Matt. 25:31</em></a><em>)</em></p></blockquote><blockquote><p>“For whoever is ashamed of Me and My words in this adulterous and sinful generation, of him the Son of Man also will be ashamed when <strong>He comes in the glory of His Father with the holy angels</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mk/8/#L38">Mark. 8:38</a>)</p></blockquote><blockquote><p>“For <strong>the Son of Man will come in the glory of His Father with His angels</strong>, and then He will reward each according to his works” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27">Matt. 16:27</a>)</p></blockquote><blockquote><p><em>“Now Enoch, the seventh from Adam, prophesied about these men also, saying, ‘Behold, </em><strong><em>the Lord comes with ten thousands of His saints</em></strong><em>’” (</em><a href="https://bibleox.com/en/eng-nkjv/iud/1/#L14"><em>Jude. 1:14</em></a><em>)</em></p></blockquote><blockquote><p><em>“</em><strong><em>at the coming of our Lord Jesus Christ with all His saints</em></strong><em>” (</em><a href="https://bibleox.com/en/eng-nkjv/1sol/3/#L13"><em>1 Thess. 3:13</em></a><em>)</em></p></blockquote><blockquote><p>“when <strong>the Lord Jesus is revealed from heaven with His mighty angels</strong>” (<a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L7">2 Thess. 1:7</a>)</p></blockquote><h3>The Coming in the Same Adult Body</h3><p>Christ will not be born again of people, but will come in the body He already has, received by Him at His birth from the Virgin Mary, the Theotokos, in the 1st year of our era.</p><blockquote><p>“Now when He had spoken these things, while they watched, He was taken up, and a cloud received Him out of their sight. And while they looked steadfastly toward heaven as He went up, behold, two men stood by them in white apparel, who also said, ‘Men of Galilee, why do you stand gazing up into heaven? <strong>This same Jesus, who was taken up from you into heaven, will so come in like manner as you saw Him go into heaven</strong>’” (<a href="https://bibleox.com/en/eng-nkjv/act/1/#L9-11">Act. 1:9-11</a>)</p></blockquote><h3>The Coming for Judgment</h3><p>The Lord will come not to teach, but to judge according to the word which He already gave when He came the first time:</p><blockquote><p>“He who rejects Me, and does not receive My words, has that which judges him — <strong>the word that I have spoken will judge him in the last day</strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/12/#L48">John. 12:48</a>)</p></blockquote><blockquote><p>“For the Son of Man will come in the glory of His Father with His angels, and then <strong>He will reward each according to his works</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/16/#L27">Matt. 16:27</a>)</p></blockquote><blockquote><p>“When <strong>the Son of Man comes in His glory</strong>, and all the holy angels with Him, then <strong>He will sit on the throne</strong> of His glory. <strong>All the nations will be gathered before Him</strong>, and <strong>He will separate them one from another</strong>, as a shepherd divides his sheep from the goats. And He will set the sheep on His right hand, but the goats on the left. &lt;…&gt; And <strong>these will go away into everlasting punishment, but the righteous into eternal life</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/25/#L31-33,46">Matt. 25:31-33,46</a>)</p></blockquote><blockquote><p>“which is manifest evidence of <strong>the righteous judgment of God</strong>, that you may be counted worthy of the kingdom of God, for which you also suffer; since it is a righteous thing with God to repay with tribulation those who trouble you, and to give you who are troubled rest with us <strong>when the Lord Jesus is revealed from heaven with His mighty angels</strong>, <strong>in flaming fire taking vengeance</strong> on those who do not know God, and on those who do not obey the gospel of our Lord Jesus Christ” (<a href="https://bibleox.com/en/eng-nkjv/2sol/1/#L5-8">2 Thess. 1:5-8</a>)</p></blockquote>
