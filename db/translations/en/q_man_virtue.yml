    path: Lv1e_Love
    title: Love
    menu: { parent: Man/Virtue, title: Love, priority: 1 }
    body: |-
      <h2>Love for God and Neighbor Is the Greatest Commandment</h2><blockquote><p>“Jesus answered him, ‘The first of all the commandments is: “Hear, O Israel, the LORD our God, the LORD is one. And <strong><mark>you shall love the LORD your God with all your heart</mark></strong>, with all your soul, with all your mind, and with all your strength.” This is the first commandment. And the second, like it, is this: “<strong><mark>You shall love your neighbor as yourself</mark></strong>.” There is no other commandment greater than these’” (<a href="https://bibleox.com/en/eng-nkjv/mk/12/#L29-31">Mark. 12:29-31</a>) (<a href="https://bibleox.com/en/eng-nkjv/vtor/6/#L5">Deut. 6:5</a>) (<a href="https://bibleox.com/en/eng-nkjv/lev/19/#L18">Lev. 19:18</a>)</p></blockquote><blockquote><p>“And behold, a certain lawyer stood up and tested Him, saying, ‘Teacher, <strong>what shall I do to inherit eternal life?</strong>’ He said to him, ‘What is written in the law? What is your reading of it?’ So he answered and said, ‘“<strong><mark>You shall love the LORD your God with all your heart</mark></strong>, with all your soul, with all your strength, and with all your mind,” and “<strong><mark>your neighbor as yourself</mark></strong>.”’ And He said to him, ‘You have answered rightly; do this and you will live’” (<a href="https://bibleox.com/en/eng-nkjv/lk/10/#L25-28">Luke. 10:25-28</a>)</p></blockquote><h2>Love Above All</h2><blockquote><p>“<strong><mark>Though I</mark></strong> speak with the tongues of men and of angels, but <strong><mark>have not love</mark></strong>, I have become sounding brass or a clanging cymbal. And though I have the gift of prophecy, and understand all mysteries and all knowledge, and though I have all faith, so that I could remove mountains, but have not love, <strong><mark>I am nothing</mark></strong>. And though I bestow all my goods to feed the poor, and though I give my body to be burned, but have not love, it profits me nothing” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L1-3">1 Cor. 13:1-3</a>)</p></blockquote><blockquote><p>“<strong><mark>If a man would give for love all the wealth of his house, it would be utterly despised</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pp/8/#L7">Song. 8:7</a>)</p></blockquote><h2>Love Is Eternal</h2><blockquote><p>“<strong><mark>Love never fails</mark></strong>. But whether there are prophecies, they will fail; whether there are tongues, they will cease; whether there is knowledge, it will vanish away” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L8">1 Cor. 13:8</a>)</p></blockquote><blockquote><p>“Set me as a seal upon your heart, as a seal upon your arm; for love is as strong as death, jealousy as cruel as the grave; its flames are flames of fire, a most vehement flame. <strong><mark>Many waters cannot quench love, nor can the floods drown it</mark></strong>. If a man would give for love all the wealth of his house, it would be utterly despised” (<a href="https://bibleox.com/en/eng-nkjv/pp/8/#L6-7">Song. 8:6-7</a>)</p></blockquote><h2>What Love Can Be Like</h2><blockquote><p>“Love <strong>suffers long</strong> and <strong>is kind</strong>; love <strong>does not envy</strong>; love <strong>does not parade itself</strong>, <strong>is not puffed up</strong>; <strong>does not behave rudely</strong>, <strong>does not seek its own</strong>, <strong>is not provoked</strong>, <strong>thinks no evil</strong>; <strong>does not rejoice in iniquity</strong>, but <strong>rejoices in the truth</strong>; <strong>bears all things</strong>, <strong>believes all things</strong>, <strong>hopes all things</strong>, <strong>endures all things</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L4-7">1 Cor. 13:4-7</a>)</p></blockquote><blockquote><p>“<strong>My son, do not despise the chastening of the LORD, nor detest His correction; for <mark>whom the LORD loves He corrects</mark></strong>, just as a father the son in whom he delights” (<a href="https://bibleox.com/en/eng-nkjv/pr/3/#L11-12">Prov. 3:11-12</a>)</p></blockquote><blockquote><p>“For <strong><mark>whom the LORD loves He chastens</mark></strong>, and scourges every son whom He receives” (<a href="https://bibleox.com/en/eng-nkjv/evr/12/#L6">Heb. 12:6</a>)</p></blockquote><blockquote><p>“<strong><mark>As many as I love, I rebuke and chasten</mark></strong>. Therefore be zealous and repent” (<a href="https://bibleox.com/en/eng-nkjv/otkr/3/#L19">Rev. 3:19</a>)</p></blockquote><blockquote><p>“But when we are judged, <strong>we are chastened by the Lord, that we may not be condemned</strong> with the world” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L32">1 Cor. 11:32</a>)</p></blockquote><blockquote><p>“Behold, <strong>happy is the man whom God corrects</strong>; therefore do not despise the chastening of the Almighty. For He bruises, but He binds up; He wounds, but His hands make whole” (<a href="https://bibleox.com/en/eng-nkjv/iov/5/#L17-18">Job. 5:17-18</a>)</p></blockquote><blockquote><p>“Set me as a seal upon your heart, as a seal upon your arm; for <strong><mark>love</mark></strong> is as strong as death, <strong><mark>jealousy as cruel as the grave</mark></strong>; <strong><mark>its flames are flames of fire</mark></strong>, <strong><mark>a most vehement flame</mark></strong>. Many waters cannot quench love, nor can the floods drown it. If a man would give for love all the wealth of his house, it would be utterly despised” (<a href="https://bibleox.com/en/eng-nkjv/pp/8/#L6-7">Song. 8:6-7</a>)</p></blockquote>

  - src: смирение
    path: Hm2l_Humility
    title: Humility
    meta_desc: Bible quotes about humility
    menu: { parent: Man/Virtue, title: Humility, priority: 2 }
    body: |-
      <p><strong>Humility</strong> (lowliness of mind) is the virtue opposite to pride.</p><ul><li><p>Peaceful acceptance of <strong>God’s will</strong> for oneself as His creature.</p></li><li><p>Submission to God, to His ordinances and to His providence, both in small things and in great.</p></li><li><p>A modest opinion of oneself, trust in God and hope in Him.</p></li></ul><h2>The Lord Is the God of the Humble</h2><blockquote><p><em>“For your strength does not depend on numbers, nor your might on the powerful. But </em><strong><em><mark>you are the God of the lowly</mark></em></strong><em>, helper of the oppressed, upholder of the weak, protector of the forsaken, savior of those without hope” (</em><a href="https://bibleox.com/en/en-nrsv/iudf/9/#L11"><em>Jdt. 9:11</em></a><em>)</em></p></blockquote><h2>The Commandment of Humility</h2><p>The Lord Jesus Christ calls us to learn humility from Him:</p><blockquote><p>“<strong>Come</strong> to Me, all you who labor and are heavy laden, and I will give you rest. <strong>Take</strong> My yoke upon you and <strong><mark>learn</mark> from Me</strong>, for I am gentle and <strong><mark>lowly</mark> in heart</strong>, and you will find rest for your souls” (<a href="https://bibleox.com/en/eng-nkjv/mf/11/#L28-29">Matt. 11:28-29</a>)</p></blockquote><blockquote><p>“Be of the same mind toward one another. Do not set your mind on high things, but <strong><mark>associate with the humble</mark></strong>. Do not be wise in your own opinion” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L16">Rom. 12:16</a>)</p></blockquote><blockquote><p>“He has shown you, O man, what is good; and <strong>what does the LORD require of you</strong> but to do justly, to love mercy, and <strong><mark>to walk humbly with your God</mark></strong>?” (<a href="https://bibleox.com/en/eng-nkjv/mih/6/#L8">Mic. 6:8</a>)</p></blockquote><blockquote><p>“Therefore circumcise the foreskin of your heart, and <strong><mark>be stiff-necked no longer</mark></strong>*” (<a href="https://bibleox.com/en/eng-nkjv/vtor/10/#L16">Deut. 10:16</a>)</p><p>*A stiff-necked people is a people that does not bow its head before God, that does not humble itself.</p></blockquote><h2>The Theotokos Was Chosen by God for Her Humility</h2><blockquote><p>“For <strong>He has <mark>regarded the lowly state</mark></strong> of His maidservant; for behold, henceforth all generations will call me blessed” (<a href="https://bibleox.com/en/eng-nkjv/lk/1/#L48">Luke. 1:48</a>)</p><p>In the Greek: ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν — “He looked upon the <strong>humility</strong>” (lowliness) of His handmaid.</p></blockquote><h2>God Gives Grace to the Humble</h2><blockquote><p>“Likewise you younger people, submit yourselves to your elders. Yes, all of you be submissive to one another, and be clothed with humility, for <strong>‘God resists the proud, but <mark>gives grace to the humble</mark>.’</strong> Therefore <strong><mark>humble yourselves</mark> under the mighty hand of God, that He may exalt you in due time</strong>” (<a href="https://bibleox.com/en/eng-nkjv/1pet/5/#L5-6">1 Pet. 5:5-6</a>)</p></blockquote><blockquote><p>“But He gives more grace. Therefore He says: ‘God <strong>resists the proud, but <mark>gives grace to the humble</mark></strong>’” (<a href="https://bibleox.com/en/eng-nkjv/iak/4/#L6">James. 4:6</a>)</p></blockquote><blockquote><p>“<strong>Surely He scorns the scornful, but <mark>gives grace to the humble</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/3/#L34">Prov. 3:34</a>)</p></blockquote><blockquote><p>“My child, perform your tasks with humility; then you will be loved by those whom God accepts. <strong>The greater you are, the more you must <mark>humble yourself; so you will find favor</mark> in the sight of the Lord</strong>. &lt;…&gt; For great is the might of the Lord; but <strong><mark>by the humble he is glorified</mark></strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/3/#L17-20">Sir. 3:17-20</a>)</p></blockquote><blockquote><p>“When pride comes, then comes shame; but <strong>with the humble is wisdom</strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/11/#L2">Prov. 11:2</a>)</p></blockquote><h2>God Saves the Humble</h2><blockquote><p>“The LORD is near to those who have a broken heart, and <strong><mark>saves such as have a contrite spirit</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/34/#L18">Ps. 34:18</a>)</p><p>In the Septuagint (<a href="https://bibleox.com/en/gr-lxx-byz/ps/33/#L18">Ps. 33:18, LXX</a>): τοὺς ταπεινοὺς τῷ πνεύματι σώσει — “He will save the <strong>humble</strong> in spirit”.</p></blockquote><blockquote><p>“For the LORD takes pleasure in His people; <strong>He will <mark>beautify the humble with salvation</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/149/#L4">Ps. 149:4</a>)</p></blockquote><blockquote><p>“<strong><mark>By humility</mark></strong> and the fear of the LORD are riches and honor and <strong><mark>life</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/22/#L4">Prov. 22:4</a>)</p></blockquote><h2>God Exalts the Humble</h2><blockquote><p>“<strong><mark>The LORD lifts up the humble</mark></strong>; He casts the wicked down to the ground” (<a href="https://bibleox.com/en/eng-nkjv/ps/147/#L6">Ps. 147:6</a>)</p></blockquote><blockquote><p>“For the LORD takes pleasure in His people; <strong>He will <mark>beautify the humble</mark> with salvation</strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/149/#L4">Ps. 149:4</a>)</p></blockquote><blockquote><p>“The fear of the LORD is the instruction of wisdom, and <strong><mark>before honor is humility</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/15/#L33">Prov. 15:33</a>)</p></blockquote><blockquote><p>“Before destruction the heart of a man is haughty, and <strong><mark>before honor is humility</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/18/#L12">Prov. 18:12</a>)</p></blockquote><blockquote><p>“<strong><mark>By humility</mark></strong> and the fear of the LORD are riches and <strong><mark>honor</mark></strong> and life” (<a href="https://bibleox.com/en/eng-nkjv/pr/22/#L4">Prov. 22:4</a>)</p></blockquote><blockquote><p>“A man’s pride will bring him low, but <strong><mark>the humble in spirit will retain honor</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/pr/29/#L23">Prov. 29:23</a>)</p></blockquote><h2>God Hears the Prayer of the Humble</h2><blockquote><p>“LORD, <strong><mark>You have heard the desire of the humble</mark></strong>; You will prepare their heart; You will cause Your ear to hear” (<a href="https://bibleox.com/en/eng-nkjv/ps/10/#L17">Ps. 10:17</a>)</p></blockquote><blockquote><p>“<strong><mark>The prayer of the humble pierces the clouds</mark></strong>, and it will not rest until it reaches its goal; it will not desist until the Most High responds” (<a href="https://bibleox.com/en/en-nrsv/prsir/35/#L21">Sir. 35:21</a>)</p></blockquote><blockquote><p>“But <strong>this is the one to whom <mark>I will look, to the humble</mark></strong> and contrite in spirit, who trembles at my word” (<a href="https://bibleox.com/en/en-nrsv/is/66/#L2">Is. 66:2</a>)</p></blockquote><blockquote><p>“Yet with a contrite heart and <strong><mark>a humble spirit may we be accepted</mark></strong>” (<a href="https://bibleox.com/en/gr-lxx-byz/dan/3/#L39">Dan. 3:39, LXX</a>; the Prayer of Azariah; translated from the Greek: ἀλλ᾿ ἐν ψυχῇ συντετριμμένῃ καὶ πνεύματι τεταπεινωμένῳ προσδεχθείημεν)</p></blockquote><blockquote><p>“The sacrifices of God are a broken spirit, <strong>a broken and <mark>a contrite heart — these, O God, You will not despise</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/ps/51/#L17">Ps. 51:17</a>)</p><p>In the Septuagint (<a href="https://bibleox.com/en/gr-lxx-byz/ps/50/#L17">Ps. 50:17, LXX</a>) the heart is “contrite and <strong>humbled</strong>” (συντετριμμένην καὶ τεταπεινωμένην).</p></blockquote><h2>God Comforts the Humble</h2><blockquote><p>“Nevertheless <strong><mark>God, who comforts the downcast</mark></strong>, comforted us by the coming of Titus” (<a href="https://bibleox.com/en/eng-nkjv/2kor/7/#L6">2 Cor. 7:6</a>)</p><p>In the Greek: ὁ παρακαλῶν τοὺς ταπεινούς — “who comforts the <strong>humble</strong>”.</p></blockquote><blockquote><p>“Though the LORD is on high, yet <strong><mark>He regards the lowly</mark></strong>; but the proud He knows from afar” (<a href="https://bibleox.com/en/eng-nkjv/ps/138/#L6">Ps. 138:6</a>)</p></blockquote><h2>God Preserves the Humble</h2><blockquote><p>“Seek the LORD, all you <strong><mark>meek</mark> </strong>of the earth, who have upheld His justice. Seek righteousness, seek humility. It may be that you will be <strong><mark>hidden in the day of the LORD’s anger</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/sof/2/#L3">Zeph. 2:3</a>)</p></blockquote><blockquote><p>“<strong>The Lord plucks up the roots of the nations</strong>, and <strong><mark>plants the humble in their place</mark></strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/10/#L15">Sir. 10:15</a>)</p></blockquote><blockquote><p>“<strong><mark>I will leave in your midst a meek and humble people</mark></strong>, and they <strong>shall trust in the name of the LORD</strong>” (<a href="https://bibleox.com/en/eng-nkjv/sof/3/#L12">Zeph. 3:12</a>)</p></blockquote><h2>God Dwells with the Humble</h2><blockquote><p>“For thus says the High and Lofty One who inhabits eternity, whose name is Holy: ‘<strong><mark>I dwell</mark> </strong>in the high and holy place, <strong><mark>with him who has a contrite and humble spirit</mark></strong>, to revive the spirit of the humble, and to revive the heart of the contrite ones’” (<a href="https://bibleox.com/en/eng-nkjv/is/57/#L15">Is. 57:15</a>)</p></blockquote><h2>Parables About Humility</h2><h3>On Choosing a Place at a Wedding</h3><blockquote><p>“So He told a parable to those who were invited, when He noted how they chose the best places, saying to them: ‘When you are invited by anyone to a wedding feast, <strong><mark>do not sit down in the best place</mark></strong>, lest one more honorable than you be invited by him; and he who invited you and him come and say to you, “Give place to this man,” and then you begin with shame to take the lowest place. But when you are invited, go and <strong><mark>sit down in the lowest place</mark></strong>, so that when he who invited you comes he may say to you, “Friend, go up higher.” Then you will have glory in the presence of those who sit at the table with you’” (<a href="https://bibleox.com/en/eng-nkjv/lk/14/#L7-10">Luke. 14:7-10</a>)</p></blockquote><h3>The Publican and the Pharisee</h3><blockquote><p>“<strong>And the tax collector, <mark>standing afar off</mark>, <mark>would not so much as raise his eyes</mark> to heaven</strong>, but beat his breast, saying, ‘God, be merciful to me a <strong><mark>sinner</mark></strong>!’ I tell you, this man went down to his house justified rather than the other; for <strong>everyone who exalts himself will be humbled, and <mark>he who humbles himself will be exalted</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L13-14">Luke. 18:13-14</a>)</p></blockquote><blockquote><p>“Two men went up to the temple to pray, one a Pharisee and the other a tax collector. The Pharisee stood and prayed thus with himself, ‘God, I thank You that I am not like other men — extortioners, unjust, adulterers, or even as this tax collector. I fast twice a week; I give tithes of all that I possess.’ <strong>And the tax collector, <mark>standing afar off</mark>, <mark>would not so much as raise his eyes</mark></strong> to heaven, but beat his breast, saying, ‘God, be merciful to me a <strong><mark>sinner</mark></strong>!’ I tell you, this man went down to his house justified rather than the other; for everyone <strong>who exalts himself will be humbled</strong>, and <strong><mark>he who humbles himself will be exalted</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/18/#L10-14">Luke. 18:10-14</a>)</p></blockquote>

  - src: милостыня
    path: Al3m_Almsgiving
    title: Almsgiving
    meta_desc: Bible quotes on the necessity of giving alms
    menu: { parent: Man/Virtue, title: Almsgiving, priority: 3 }
    body: |-
      <h2>Almsgiving, Love for the Poor, Generosity</h2><blockquote><p>“If there is among you a <strong>poor man</strong> of your brethren, within any of the gates in your land which the LORD your God is giving you, you shall not harden your heart <strong>nor shut your hand from your poor brother</strong>, but <strong>you shall open your hand wide to him</strong> and willingly lend him sufficient for his need, whatever he needs. Beware lest there be a wicked thought in your heart, saying, ‘The seventh year, the year of release, is at hand,’ and <strong>your eye be evil against your poor brother</strong> and you give him nothing, and he cry out to the LORD against you, and it become sin among you. You shall surely give to him, and your heart should not be grieved when you give to him, because for this thing the LORD your God will bless you in all your works and in all to which you put your hand. For <strong>the poor will never cease from the land</strong>; therefore I command you, saying, ‘<strong>You shall open your hand wide</strong> to your brother, to your poor and your needy, in your land’” (<a href="https://bibleox.com/en/eng-nkjv/vtor/15/#L7-11">Deut. 15:7-11</a>)</p></blockquote><blockquote><p>“<strong>Do not withhold good from those to whom it is due</strong>, when it is in the power of your hand to do so. Do not say to your neighbor, ‘Go, and come back, and tomorrow I will give it,’ when you have it with you” (<a href="https://bibleox.com/en/eng-nkjv/pr/3/#L27-28">Prov. 3:27-28</a>)</p></blockquote><blockquote><p>“<strong>Stretch out your hand to the poor</strong>, so that your blessing may be complete. <strong>Give graciously to all the living</strong>; <strong>do not withhold kindness even from the dead</strong>” (<a href="https://bibleox.com/en/en-nrsv/prsir/7/#L32-33">Sir. 7:32-33</a>)</p></blockquote><blockquote><p>“Prayer with fasting is good, but better than both is almsgiving with righteousness. A little with righteousness is better than wealth with wrongdoing. It is better to give alms than to lay up gold. For <strong>almsgiving saves from death and purges away every sin</strong>. Those who give alms will enjoy a full life” (<a href="https://bibleox.com/en/en-nrsv/tov/12/#L8-9">Tob. 12:8-9</a>)</p></blockquote><blockquote><p>“But <strong>rather give alms</strong> of such things as you have; <strong>then indeed all things are clean to you</strong>” (<a href="https://bibleox.com/en/eng-nkjv/lk/11/#L41">Luke. 11:41</a>)</p></blockquote><blockquote><p>“<strong>Blessed are the merciful, for they shall obtain mercy</strong>” (<a href="https://bibleox.com/en/eng-nkjv/mf/5/#L7">Matt. 5:7</a>)</p></blockquote>

  - src: Единомыслие
    path: Lk4m_Like-Mindedness
    title: Like-Mindedness
    meta_desc: Bible quotes about like-mindedness
    menu: { parent: Man/Virtue, title: Like-Mindedness, priority: 4 }
    body: |-
      <h2>Wisdom Is Adorned with the Like-Mindedness and Concord of Brethren</h2><blockquote><p>“<strong>Wisdom</strong> praises herself, and tells of her glory in the midst of her people. In the assembly of the Most High she opens her mouth, and in the presence of his hosts she tells of her glory: ‘I came forth from the mouth of the Most High, and covered the earth like a mist &lt;…&gt;’” (<a href="https://bibleox.com/en/en-nrsv/prsir/24/#L1-3">Sir. 24:1-3</a>)</p><p>“<strong>In three things I was adorned</strong> and stood beautiful before the Lord and men: <strong><mark>concord</mark> of brethren</strong>, <strong><mark>friendship</mark> of neighbors</strong>, and <strong>a wife and husband who <mark>agree</mark></strong> with each other” (<a href="https://bibleox.com/en/gr-lxx-byz/prsir/25/#L1">Sir. 25:1, LXX</a>; translated from the Greek: Ἐν τρισὶν ὡραίσθην καὶ ἀνέστην ὡραία ἔναντι κυρίου καὶ ἀνθρώπων· ὁμόνοια ἀδελφῶν…). In the Greek text it is Wisdom that continues to speak of herself; the NRSV renders this verse as “I take pleasure in three things” (<a href="https://bibleox.com/en/en-nrsv/prsir/25/#L1">Sir. 25:1</a>).</p></blockquote><h2>Prayer That the Church Be Granted Unity and Like-Mindedness</h2><blockquote><p>“<strong><mark>that they all may be one</mark></strong>, as You, Father, are in Me, and I in You; that they also may be one in Us, <strong>that the world may believe</strong> that You sent Me. And the glory which You gave Me I have given them, <strong><mark>that they may be one just as We are one</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L21-22">John. 17:21-22</a>)</p></blockquote><blockquote><p>“Now may the God of patience and comfort grant you <strong>to be <mark>like-minded</mark></strong> toward one another, according to Christ Jesus” (<a href="https://bibleox.com/en/eng-nkjv/rim/15/#L5">Rom. 15:5</a>)</p></blockquote><h2>The Commandment to Be Like-Minded</h2><p>Gifts from God are not given to a person against his will. For example, love is a gift of God (<a href="https://bibleox.com/en/eng-nkjv/1in/4/#L7-8">1 John. 4:7-8</a>; <a href="https://bibleox.com/en/eng-nkjv/gal/5/#L22-23">Gal. 5:22-23</a>; <a href="https://bibleox.com/en/eng-nkjv/rim/5/#L5">Rom. 5:5</a>); nevertheless, it is not forced upon a person, and having come, it does not remain in him against his will. Every person must labor to acquire love (<a href="https://bibleox.com/en/eng-nkjv/1kor/13/#L1-2,13">1 Cor. 13:1-2,13</a>; <a href="https://bibleox.com/en/eng-nkjv/kol/3/#L14">Col. 3:14</a>) and incline his will to deeds of love (<a href="https://bibleox.com/en/eng-nkjv/in/13/#L34">John. 13:34</a>; <a href="https://bibleox.com/en/eng-nkjv/in/15/#L12">John. 15:12</a>; <a href="https://bibleox.com/en/eng-nkjv/in/15/#L17">John. 15:17</a>; <a href="https://bibleox.com/en/eng-nkjv/1pet/1/#L22">1 Pet. 1:22</a>), and God responds to these efforts by giving and preserving the gift (<a href="https://bibleox.com/en/eng-nkjv/pr/21/#L31">Prov. 21:31</a>).</p><p>Like-mindedness is also from God, for Christ and the apostles prayed to God for it (<a href="https://bibleox.com/en/eng-nkjv/in/17/#L21-22">John. 17:21-22</a>; <a href="https://bibleox.com/en/eng-nkjv/rim/15/#L5">Rom. 15:5</a>). Although the gift of love and like-mindedness has been given to the Church by the Holy Spirit, everyone in the Church must acquire and preserve this gift by labor. Each believer individually is able to sin both against love and against like-mindedness. Therefore each one is called to keep love and like-mindedness:</p><blockquote><p>“<strong>Be of the <mark>same mind</mark></strong> toward one another. Do not set your mind on high things, but <strong>associate with the humble</strong>. Do not be wise in your own opinion” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L16">Rom. 12:16</a>)</p></blockquote><blockquote><p>“Now I plead with you, brethren, by the name of our Lord Jesus Christ, that <strong>you all speak the same thing</strong>, and that there be no divisions among you, but that you be <strong>perfectly joined together <mark>in the same mind</mark></strong> and in the same judgment” (<a href="https://bibleox.com/en/eng-nkjv/1kor/1/#L10">1 Cor. 1:10</a>)</p></blockquote><blockquote><p>“Finally, brethren, farewell. Become complete. Be of good comfort, <strong>be of <mark>one mind</mark></strong>, live in peace; and the God of love and peace will be with you” (<a href="https://bibleox.com/en/eng-nkjv/2kor/13/#L11">2 Cor. 13:11</a>)</p></blockquote><blockquote><p>“fulfill my joy <strong>by being <mark>like-minded</mark></strong>, having the same love, <strong>being <mark>of one accord, of one mind</mark></strong>” (<a href="https://bibleox.com/en/eng-nkjv/fil/2/#L2">Phil. 2:2</a>)</p></blockquote><blockquote><p>“Finally, <strong>all of you be <mark>of one mind</mark></strong>, having compassion for one another; love as brothers, be tenderhearted, be courteous” (<a href="https://bibleox.com/en/eng-nkjv/1pet/3/#L8">1 Pet. 3:8</a>)</p></blockquote><h2>Objections</h2><h3>There Must Be Factions Among You</h3><blockquote><p>“For there must also be <strong>factions </strong>(αἱρέσεις) among you, that those who are approved may be recognized among you” (<a href="https://bibleox.com/en/eng-nkjv/1kor/11/#L19">1 Cor. 11:19</a>)</p></blockquote><p>In the original, instead of the word “factions” there stands the word “heresies” (Greek αἱρέσεις), that is: there must be heresies among you. This is simply a prophecy about the rise of heresies. Whoever breeds heresies, according to the word of the apostle, will not inherit the Kingdom of God:</p><blockquote><p>“Now the works of the flesh are evident, which are: &lt;…&gt; <strong>heresies</strong> &lt;…&gt;; of which I tell you beforehand, just as I also told you in time past, that those who practice such things <strong>will not inherit the kingdom of God</strong>” (<a href="https://bibleox.com/en/eng-nkjv/gal/5/#L19-21">Gal. 5:19-21</a>)</p></blockquote>

  - src: благодарение
    path: Th5g_Thanksgiving
    title: Thanksgiving
    meta_desc: Bible quotes about the virtue of thanksgiving
    menu: { parent: Man/Virtue, title: Thanksgiving, priority: 5 }
    body: |-
      <blockquote>“Rejoice always, pray without ceasing, <b>in everything give thanks; for this is the will of God</b> in Christ Jesus for you” (<a href="https://bibleox.com/en/eng-nkjv/1sol/5/#L16-18">1 Thess. 5:16-18</a>)</blockquote><blockquote>“while you are enriched in everything for all liberality, which <b>causes thanksgiving through us to God</b>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/9/#L11">2 Cor. 9:11</a>)</blockquote><blockquote>“For the administration of this service not only supplies the needs of the saints, but also <b>is abounding through many thanksgivings to God</b>” (<a href="https://bibleox.com/en/eng-nkjv/2kor/9/#L12">2 Cor. 9:12</a>)</blockquote><blockquote>“rooted and built up in Him and established in the faith, as you have been taught, abounding in it <b>with thanksgiving</b>” (<a href="https://bibleox.com/en/eng-nkjv/kol/2/#L7">Col. 2:7</a>)</blockquote><blockquote>“And whatever you do in word or deed, do all in the name of the Lord Jesus, <b>giving thanks</b> to God the Father through Him” (<a href="https://bibleox.com/en/eng-nkjv/kol/3/#L17">Col. 3:17</a>)</blockquote><blockquote>“Be anxious for nothing, but <b>in everything by prayer and supplication, with thanksgiving</b>, let your requests be made known to God” (<a href="https://bibleox.com/en/eng-nkjv/fil/4/#L6">Phil. 4:6</a>)</blockquote><blockquote>“neither filthiness, nor foolish talking, nor coarse jesting, which are not fitting, but rather <b>giving of thanks</b>” (<a href="https://bibleox.com/en/eng-nkjv/ef/5/#L4">Eph. 5:4</a>)</blockquote><blockquote>“<b>Continue earnestly in prayer</b>, being vigilant in it <b>with thanksgiving</b>” (<a href="https://bibleox.com/en/eng-nkjv/kol/4/#L2">Col. 4:2</a>)</blockquote><blockquote>“because, although they knew God, they did not glorify Him as God, <b>nor were thankful</b>, but became futile in their thoughts, and their foolish hearts were darkened” (<a href="https://bibleox.com/en/eng-nkjv/rim/1/#L21">Rom. 1:21</a>)</blockquote><blockquote>“For men will be lovers of themselves, lovers of money, boasters, proud, blasphemers, disobedient to parents, <b>unthankful</b>, unholy” (<a href="https://bibleox.com/en/eng-nkjv/2tim/3/#L2">2 Tim. 3:2</a>)</blockquote>Thanksgiving implies contentment with the good things one has now:<blockquote>“Now <b>godliness with contentment is great gain</b>. &lt;…&gt; <b>And having food and clothing, with these we shall be content</b>. But those who desire to be rich fall into temptation and a snare, and into many foolish and harmful lusts which drown men in destruction and perdition” (<a href="https://bibleox.com/en/eng-nkjv/1tim/6/#L6,8-9">1 Tim. 6:6,8-9</a>)</blockquote><blockquote>“Not that I speak in regard to need, for <b>I have learned in whatever state I am, to be content</b>: <b>I know how to be abased, and I know how to abound</b>. Everywhere and in all things I have learned both to be full and to be hungry, both to abound and to suffer need” (<a href="https://bibleox.com/en/eng-nkjv/fil/4/#L11-12">Phil. 4:11-12</a>)</blockquote><blockquote>“These are <b>grumblers, complainers</b>, walking according to their own lusts; and they mouth great swelling words, flattering people to gain advantage” (<a href="https://bibleox.com/en/eng-nkjv/iud/1/#L16">Jude. 1:16</a>)</blockquote>

  - src: Незлобие-милосердие-прощение
    path: Ml6c_Freedom_from_Malice
    title: Freedom from Malice (Mercy)
    menu: { parent: Man/Virtue, title: Freedom from Malice, priority: 6 }
    body: |-
      <blockquote><p>“<strong><mark>Beloved, do not avenge yourselves</mark>, but rather give place to wrath</strong>; for it is written, ‘Vengeance is Mine, I will repay,’ says the Lord” (<a href="https://bibleox.com/en/eng-nkjv/rim/12/#L19">Rom. 12:19</a>)</p></blockquote><blockquote><p>“<strong><mark>Do not say, ‘I will recompense evil’</mark>; wait for the LORD</strong>, and He will save you” (<a href="https://bibleox.com/en/eng-nkjv/pr/20/#L22">Prov. 20:22</a>)</p></blockquote>
