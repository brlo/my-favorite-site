  body: '<h2>1st century</h2><h3>The Didache (late 1st – early 2nd c.)</h3><blockquote><p>But
    every <strong><em><mark>Lord’s day</mark> gather yourselves together, and break
    bread, and give thanksgiving</em></strong><em> after having confessed your transgressions,
    that your sacrifice may be pure.</em></p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Didache#HH-14">The
    Didache, ch. 14</a>)</p><h3>The Epistle of Barnabas</h3><blockquote><p>Ye perceive
    how He speaks: Your present Sabbaths are not acceptable to Me, but that is which
    I have made, [namely this,] when, giving rest to all things, <strong>I shall make
    a beginning of the eighth day, that is, a beginning of another world. <mark>Wherefore,
    also, we keep the eighth day with joyfulness, the day also on which Jesus rose
    again from the dead</mark></strong>. And when He had manifested Himself, He ascended
    into the heavens.</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Epistle_of_Barnabas#HH-15">The
    Epistle of Barnabas, ch. 15</a>)</p><h2>2nd century</h2><h3>St Justin the Philosopher,
    martyr (c. 100–165)</h3><blockquote><p>And we afterwards continually remind each
    other of these things. And the wealthy among us help the needy; and we always
    keep together; and for all things wherewith we are supplied, we bless the Maker
    of all through His Son Jesus Christ, and through the Holy Ghost. <strong><mark>And
    on the day called Sunday</mark>, all who live in cities or in the country gather
    together to one place, and the memoirs of the apostles or the writings of the
    prophets are read, as long as time permits; then, when the reader has ceased,
    the president verbally instructs, and exhorts to the imitation of these good things.
    Then we all rise together and pray, and, as we before said, when our prayer is
    ended, bread and wine and water are brought, and the president in like manner
    offers prayers and thanksgivings, according to his ability, and the people assent,
    saying Amen; and there is a distribution to each, and a participation of that
    over which thanks have been given, and to those who are absent a portion is sent
    by the deacons. And they who are well to do, and willing, give what each thinks
    fit; and what is collected is deposited with the president, who succours the orphans
    and widows and those who, through sickness or any other cause, are in want, and
    those who are in bonds and the strangers sojourning among us, and in a word takes
    care of all who are in need.</strong> But Sunday is the day on which we all hold
    our common assembly, because it is the first day on which God, having wrought
    a change in the darkness and matter, made the world; and Jesus Christ our Saviour
    on the same day rose from the dead. For He was crucified on the day before that
    of Saturn (Saturday); and on the day after that of Saturn, which is the day of
    the Sun, having appeared to His apostles and disciples, He taught them these things,
    which we have submitted to you also for your consideration.</p></blockquote><p>(<a
    href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_1#HH-67">Apology
    I, 65–67</a>; the Russian text adds: that is, they celebrate the Eucharist)</p>'
