  path: QO17T_舊約耶路撒冷聖殿
  title: 舊約耶路撒冷聖殿
  copy_cover: true
  body: <h2>總體信息</h2><p>聖殿由所羅門建在摩利亞山上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L1">代下 3:1</a>），在耶布斯人阿珥楠的禾場（收集並簸揚麥子之處）上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L1">代下 3:1</a>）——所羅門的父親大衛在那裏看見了擊殺民衆的天使，先知迦得也指定了那裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/24/#L16-18">撒下 24:16-18</a>）。聖殿的建造開始於以色列人出埃及之後480年（按七十士譯本爲440年），即所羅門在位第四年、西弗月（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L37">王上 6:37</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L2">代下 3:2</a>）。建造在七年後完工，時爲所羅門在位第十一年、布勒月（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L38">王上 6:38</a>）。</p><h2>上帝建造聖殿的命令</h2><blockquote><p>“耶和華曉諭摩西說： 「<strong><mark>你告訴以色列人當爲我送禮物來</mark></strong>，凡甘心樂意的，你們就可以收下歸我。 &lt;…&gt; <strong><mark>又當爲我造聖所</mark></strong>，使我可以住在他們中間。 &lt;…&gt; 要謹慎作這些物件，<strong><mark>都要照著在山上指示你的樣式</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L1-2,8,40">出 25:1-2,8,40</a>)</p></blockquote><blockquote><p>“<strong><mark>我們的祖宗在曠野有法櫃的帳幕</mark></strong>，<strong><mark>是上帝吩咐摩西叫他照所看見的樣式作的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L44">徒 7:44</a>)</p></blockquote><p>地上的聖殿按天上現實的樣式建造：</p><blockquote><p>“因爲基督並不是進了<strong><mark>人手所造的聖所</mark></strong>（<strong><mark>這不過是真聖所的影像</mark></strong>），乃是進了天堂，如今爲我們顯在上帝面前；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>)</p></blockquote><h2>耶路撒冷聖殿的構造</h2><p>聖殿的牆用石頭建成。</p><p>*以下尺寸以肘爲單位。要把肘大致換算爲米，須將肘數除以2。</p><h3>聖殿的尺寸（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L2">王上 6:2</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L3">代下 3:3</a>）</h3><ul><li><p>長60肘（被一堵牆分爲20肘和40肘），</p></li><li><p>寬20肘，</p></li><li><p>高30肘。</p></li></ul><p>按米算：31.5×10.5×15.75。</p><p>聖殿被一堵石牆分爲兩部分（各20肘和40肘）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L16-17">王上 6:16-17</a>）：</p><ul><li><p>20肘的部分稱爲「至聖所」（或稱「內殿」，或「殿的內部」）；</p></li><li><p>40肘的部分稱爲「聖所」。</p></li></ul><p>聖殿有爲窗欞（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L4">王上 6:4</a>）。</p><h3>廊子</h3><p>殿前還建有廊子（不算作聖殿）。其尺寸（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L3">王上 6:3</a>）：</p><ul><li><p>長20肘；</p></li><li><p>寬10肘。</p></li><li><p>高120肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L4">代下 3:4</a>）？</p></li></ul><h3>旁屋</h3><p>殿的周圍建有三層旁屋（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L5">王上 6:5</a>），不觸及聖殿的牆（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L6">王上 6:6</a>）。各層的寬度，從下層起：5、6、7肘。</p><h3>廂房</h3><p>殿的四周還建有廂房，用香柏木的棟樑與殿相連（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L10">王上 6:10</a>）。廂房的高度：5肘。</p><h3>聖殿的牆</h3><p>牆用鑿成的石頭砌成。殿的內部牆和頂棚用香柏木板遮蔽（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L9,16">王上 6:9,16</a>）。殿的地板用松木板鋪地（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L15">王上 6:15</a>）。一切都用木頭遮蔽，殿裏一點石頭都不顯露（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L18">王上 6:18</a>）。殿的牆和地板也在某種程度上貼了金（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L22">王上 6:22</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L5">代下 3:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L7">代下 3:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L30">王上 6:30</a>）。通常是刻像上貼金（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L32">王上 6:32</a>）。在香柏木板上（牆和頂棚）刻著基路伯、棕樹和初開的花（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L29">王上 6:29</a>）、野瓜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L18">王上 6:18</a>）。刻於「內殿外殿」（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L29">王上 6:29</a>），即在至聖所（內殿）和聖所（外殿）。殿用寶石裝飾（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L6">代下 3:6</a>）。重要：基路伯的刻像先前就有——在會幕的幔子（壁）上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>）。</p><h2>至聖所</h2><p>尺寸：20×20×20肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L20">王上 6:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L8">代下 3:8</a>），貼上精金。掛著金鍊子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L21">王上 6:21</a>）。</p><h3>入口</h3><p>進入至聖所要經過<strong>橄欖木作的五邊形門</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L31">王上 6:31</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L22">代下 4:22</a>）。門（如同牆）裝飾著基路伯、棕樹和初開的花的刻像。刻像貼金（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L32">王上 6:32</a>）。這裏還有繡著基路伯的幔子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L14">代下 3:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1mak/1/#L22">加上 1:22</a>），用藍色、紫色、硃紅色線和細麻織成，如同會幕中那樣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L31">出 26:31</a>）。幔子前常燃著不滅的燈（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/24/#L1-4">利 24:1-4</a>）。</p><h3>兩個革魯賓</h3><p>安放了兩尊橄欖木作的大革魯賓像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L23">王上 6:23</a>）。用金子包裹（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L28">王上 6:28</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L10">代下 3:10</a>）。革魯賓的高和寬各爲10肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L23">王上 6:23</a>）；寬度從一個翅膀的邊到另一個翅膀的邊（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L24-27">王上 6:24-27</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L11">代下 3:11</a>）。一個革魯賓的一個翅膀挨着殿這邊的牆，另一個翅膀與相鄰革魯賓的翅膀相接（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L11-12">代下 3:11-12</a>）。他們的臉面向外殿（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L13">代下 3:13</a>）。</p><h3>約櫃</h3><p>在中央、革魯賓的翅膀底下，立著約櫃（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L19">王上 6:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/8/#L6">王上 8:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/5/#L7">代下 5:7</a>），連同抬櫃的槓（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/8/#L7">王上 8:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/5/#L9">代下 5:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L15">出 25:15</a>）。詳見<a href="https://bibleox.com/ru/ru/w/ковчег_завета">約櫃</a>。</p><h2>聖所</h2><h3>入口</h3><p>進入聖所要經過<strong>松木作的摺疊雙扇門</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L34">王上 6:34</a>），其門框用橄欖木（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L33">王上 6:33</a>）。這些門也裝飾著基路伯、棕樹和初開的花的刻像，並貼金（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L35">王上 6:35</a>）。</p><h3>壇</h3><p>在至聖所門前立著燒香的壇。用木頭製成並貼金（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L22">王上 6:22</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L48">王上 7:48</a>）。</p><h3>桌子</h3><p>旁邊是安放陳設餅的金桌（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L48">王上 7:48</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L8">代下 4:8</a>）。</p><h3>燈臺</h3><p>左右各有金燈臺：右邊五個，左邊五個（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L49">王上 7:49</a>）。它們連同燈盞、蠟剪、盤、鑷子、調羹、火鼎以及門樞——全部用純金製成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L50">王上 7:50</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L19-22">代下 4:19-22</a>）。</p><h2>廊子</h2><p>裏面貼上精金（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L4">代下 3:4</a>）。</p><h3>柱子：雅斤和波阿斯</h3><p>廊子入口前立著兩根相同的巨大銅柱，各有名字：右邊——雅斤，左邊——波阿斯（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L21">王上 7:21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L17">代下 3:17</a>）。柱高<strong>18肘</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L15">王上 7:15</a>）（35肘——<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L15">代下 3:15</a>）。柱圍12肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L15">王上 7:15</a>）。柱頂上有柱頭，各高5肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L16">王上 7:16</a>）。柱頭裝飾著網子和擰成的鍊索（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L16">王上 7:16</a>）：每個柱頭上七個（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L17">王上 7:17</a>）。柱頭上有兩行石榴（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L18">王上 7:18</a>）。也提到廊子的柱頭，刻著百合花，各徑4肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L19">王上 7:19</a>）。所有銅器都打磨光亮（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L45">王上 7:45</a>）。</p><h2>院子</h2><p>殿前有<strong>內院（祭司院）</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L36">王上 6:36</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L9">代下 4:9</a>）。它用三層鑿成的石頭和一層香柏木建成（圍成）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L36">王上 6:36</a>）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L12">王上 7:12</a>）。大的外院也圍了起來（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L12">王上 7:12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L9">代下 4:9</a>）。</p><h3>祭壇</h3><p>尺寸：20×20肘，高10肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L1">代下 4:1</a>）。</p><h3>銅海</h3><p>祭司沐浴用的圓形器具（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L6">代下 4:6</a>）。在第一（內）院中有鑄成的圓形「銅海」。尺寸：徑10肘，高5肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L23">王上 7:23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L2">代下 4:2</a>），厚約一掌（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L26">王上 7:26</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L5">代下 4:5</a>）。圍30肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L23">王上 7:23</a>）。邊緣裝飾著兩行野瓜：每肘十瓜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L24">王上 7:24</a>）。可容二千罷特（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L26">王上 7:26</a>）。安在殿的東南方（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L39">王上 7:39</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L10">代下 4:10</a>）。</p><h3>12隻銅牛</h3><p>銅海安在12隻銅牛上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L25">王上 7:25</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L3-4">代下 4:3-4</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L15">代下 4:15</a>）：三隻向北，其餘各方也各有三隻。</p><h3>10個銅盆</h3><p>獻燔祭前洗祭牲用的器具（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/4/#L6">代下 4:6</a>）。每個盆容40罷特。安在殿旁：左邊5個，右邊5個（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L39">王上 7:39</a>）。每個盆都有可移動的帶輪座的盆座。</p><h3>10個盆座</h3><p>10個可移動的方形銅盆座（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L27">王上 7:27</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L31">王上 7:31</a>）：4×4肘，高3肘。盆座的四面有獅子、牛和基路伯的像，其上有瓔珞（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L28-29">王上 7:28-29</a>）。盆座安在4個銅輪上移動（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L30">王上 7:30</a>）。輪高1.5肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L32">王上 7:32</a>）。它們全都是一樣的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L37">王上 7:37</a>）。</p><h3>歌唱者、吹號者</h3><p>奉獻聖殿時，利未人歌唱並彈奏樂器（鈸、瑟和琴），祭司吹號（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/5/#L12">代下 5:12</a>）。樂器是特爲聖殿製造的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/7/#L6">代下 7:6</a>）。</p><h2>刻像</h2><p>基路伯的刻像在殿的牆上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L32">王上 6:32</a>）、門上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L32">王上 6:32</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L35">王上 6:35</a>）、至聖所門前的幔子上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L14">代下 3:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1mak/1/#L22">加上 1:22</a>）。在至聖所立著兩尊包金的大木製革魯賓像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L23">王上 6:23</a>）。約櫃的施恩座上有兩個革魯賓像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L18-20">出 25:18-20</a>）。殿院中大的盆座上有獅子、牛和基路伯的像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L28-29">王上 7:28-29</a>）。</p><h2>祈禱</h2><p>所羅門王奉獻聖殿時的祈禱：<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/8/#L22-53">王上 8:22-53</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/6/#L14-42">代下 6:14-42</a></p><p>上帝對所羅門祈禱的回應：<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/7/#L12-22">代下 7:12-22</a></p>
