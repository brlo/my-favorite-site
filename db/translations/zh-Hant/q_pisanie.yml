  title: 聖經
  copy_cover: true
  body: <h2>上帝藉著聖經說話</h2><blockquote><p>“這福音是<strong><mark>上帝</mark></strong>從前<strong><mark>藉衆先知</mark></strong><strong><mark>在聖經上</mark></strong>所應許的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L2">羅 1:2</a>)</p></blockquote><blockquote><p>“「弟兄們，<strong><mark>聖靈藉大衛的口，在聖經上預言</mark></strong>領人捉拿耶穌的猶大，這話是必須應驗的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L16">徒 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>聖經都是上帝所默示的</mark></strong>，於教訓、督責、使人歸正、教導人學義都是有益的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L16">提後 3:16</a>)</p></blockquote><h2>使徒的宣講——上帝的道</h2><blockquote><p>“到了撒拉米，就在猶太人各會堂裏<strong><mark>傳講上帝的道</mark></strong>，也有約翰作他們的幫手。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L5">徒 13:5</a>)</p></blockquote><blockquote><p>“但帖撒羅尼迦的猶太人知道保羅又在庇哩亞<strong><mark>傳上帝的道</mark></strong>，也就往那裏去，聳動攪擾衆人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L13">徒 17:13</a>)</p></blockquote><blockquote><p>“爲此，我們也不住的感謝上帝，因你們聽見<strong><mark>我們所傳上帝的道</mark></strong>，就領受了；不以爲是人的道，<strong>乃以爲是上帝的道</strong>。<strong><mark>這道實在是上帝的</mark></strong>，並且運行在你們信主的人心中。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><h2>救主關於讀聖經的命令</h2><blockquote><p>“<strong><mark>你們查考聖經</mark></strong>，因你們以爲內中有永生；給我作見證的就是這經；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L39">約 5:39</a>)</p></blockquote><blockquote><p>“耶穌回答說：「<strong><mark>你們錯了，因爲不明白聖經，也不曉得上帝的大能</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/22/#L29">太 22:29</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L24">可 12:24</a>)</p></blockquote><h2>讀聖經對得救有益</h2><blockquote><p>“並且知道你是從小明白聖經；<strong>這聖經能使你因信基督耶穌有得救的智慧</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L15">提後 3:15</a>)</p></blockquote><h2>聖經不能廢掉</h2><blockquote><p>“<strong><mark>經上的話是不能廢的</mark></strong>；若那些承受上帝道的人，尚且稱爲神，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L35">約 10:35</a>)</p></blockquote><h3>聖經不是歷史陳蹟，而是爲今日的人寫的</h3><blockquote><p>“從前所寫的聖經，<strong><mark>都是爲教訓我們寫的</mark></strong>，叫我們因聖經所生的忍耐和安慰，可以得著盼望。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/15/#L4">羅 15:4</a>)</p></blockquote><h2>對聖經的理解</h2><blockquote><p>“第一要緊的，該知道<strong>經上所有的預言沒有可隨私意解說的</strong>； 因爲預言從來沒有出於人意的，<strong>乃是人被聖靈感動，說出上帝的話來</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L20-21">彼後 1:20-21</a>)</p></blockquote><h3>使徒們明白聖經，但仍需要救主的解釋</h3><blockquote><p>“於是從摩西和衆先知起，<strong>凡經上所指著自己的話都給他們講解明白了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L27">路 24:27</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L32">路 24:32</a>)</p></blockquote><h3>上帝賜使徒明白聖經的能力</h3><blockquote><p>“於是<strong>耶穌開他們的心竅，使他們能明白聖經</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L45">路 24:45</a>)</p></blockquote><h3>使徒在會堂裏教導猶太人正確理解聖經</h3><blockquote><p>“弟兄們隨即在夜間打發保羅和西拉往庇哩亞去。二人到了，就進入猶太人的會堂。 這地方的人賢於帖撒羅尼迦的人，甘心領受這道，<strong><mark>天天考查聖經，要曉得這道是與不是</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L10-11">徒 17:10-11</a>)</p></blockquote><h3>聖經中並非一切都容易明白。無知的人曲解聖經</h3><blockquote><p>“他一切的信上也都是講論這事。<strong>信中有些難明白的</strong>，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L16">彼後 3:16</a>)</p></blockquote><h3>亞波羅用聖經證明耶穌是基督</h3><blockquote><p>“在衆人面前極有能力，駁倒猶太人，<strong><mark>引聖經證明耶穌是基督</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/18/#L28">徒 18:28</a>)</p></blockquote>
