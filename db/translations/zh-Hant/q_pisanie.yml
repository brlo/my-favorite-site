  title: 聖經的解釋
  copy_cover: true
  body: <h2>讀聖經對得救有益</h2><p>使徒保羅說，研讀聖經能幫助人得救：</p><blockquote><p>“並且知道你是從小明白聖經；<strong>這聖經能使你因信基督耶穌有得救的智慧</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L15">提後 3:15</a>)</p></blockquote><p>但若沒有教會的教導，對聖經的錯誤解釋可能把人引向滅亡：</p><blockquote><p>“並且要以我主長久忍耐爲得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。 他一切的信上也都是講論這事。<strong>信中有些難明白的</strong>，<strong><mark>那無學問、不堅固的人強解</mark></strong>，如強解別的經書一樣，<strong><mark>就自取沉淪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L15-16">彼後 3:15-16</a>)</p></blockquote><h2>必須正確解釋聖經</h2><h3>聖靈所寫的，由有聖靈的人明白</h3><p>藉聖靈感動而寫下的，只有同樣被同一位聖靈感動的人才能正確明白：</p><blockquote><p>“<strong>我們並有先知更確的預言</strong>，如同燈照在暗處。<strong>你們在這預言上留意</strong>，直等到天發亮，晨星在你們心裏出現的時候，纔是好的。 第一要緊的，該知道<strong>經上所有的預言沒有可隨私意解說的</strong>； 因爲預言從來沒有出於人意的，<strong>乃是人被聖靈感動，說出上帝的話來</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L19-21">彼後 1:19-21</a>)</p></blockquote><h3>對聖經的錯誤解釋可能導致滅亡</h3><p>無學問、未被教會堅立的人曲解聖經，自取沉淪：</p><blockquote><p>“並且要以我主長久忍耐爲得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。 他一切的信上也都是講論這事。<strong>信中有些難明白的</strong>，<strong><mark>那無學問、不堅固的人強解</mark></strong>，如強解別的經書一樣，<strong><mark>就自取沉淪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L15-16">彼後 3:15-16</a>)</p></blockquote><p>同樣，使徒提出研讀聖經，只是作爲他已親自以宣講教導之事的補充：</p><blockquote><p>“<strong><mark>但你所學習的、所確信的，要存在心裏</mark></strong>，因爲你知道是跟誰學的。 並且知道<strong>你是從小明白聖經</strong>；這聖經能使你因信基督耶穌有得救的智慧。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L14-15">提後 3:14-15</a>)</p></blockquote><p><strong>況且</strong>——是在此基礎上再加上。就是說，聖經的知識作爲對根基的補充而有益——這根基是使徒的教導。下一節證實這一思想：</p><blockquote><p>“<strong><mark>聖經都是上帝所默示的</mark></strong>，<strong><mark>於教訓</mark></strong>、督責、使人歸正、教導人學義都是<strong><mark>有益</mark></strong>的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L16">提後 3:16</a>)</p></blockquote><p>就是說，聖經本身並不自足，而是對主教提摩太在教導、責備、使人歸正、教導人學義——即<strong>傳遞</strong>使徒信仰（聖傳）——之事上有用的工具：</p><blockquote><p>“<strong>堅守所教真實的道理</strong>，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。 因爲<strong>有許多人不服約束</strong>，說虛空話欺哄人，那奉割禮的更是這樣。 這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><h3>使徒們曾錯誤地理解基督</h3><blockquote><p>“門徒渡到那邊去，忘了帶餅。 耶穌對他們說：「你們要謹慎，防備法利賽人和撒都該人的酵。」 門徒彼此議論說：「這是因爲我們沒有帶餅吧！」 耶穌看出來，就說：「你們這小信的人，爲什麼因爲沒有餅彼此議論呢？ 你們<strong>還不明白嗎</strong>？不記得那五個餅分給五千人，又收拾了多少籃子的零碎嗎？ 也不記得那七個餅分給四千人，又收拾了多少筐子的零碎嗎？ 我對你們說：『要防備法利賽人和撒都該人的酵』，<strong>這話不是指著餅說的</strong>，你們怎麼不明白呢？」 門徒這才曉得他說的，不是叫他們防備餅的酵，乃是防備法利賽人和撒都該人的教訓。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L5-12">太 16:5-12</a>)</p></blockquote><h3>埃提阿伯的太監不能明白聖經</h3><blockquote><p>“聖靈對腓利說：「你去貼近那車走。」 腓利就跑到太監那裏，聽見他念先知以賽亞的書，便問他說：「你所念的，你明白嗎？」 他說：「<strong><mark>沒有人指教我，怎能明白呢</mark></strong>？」於是請腓利上車，與他同坐。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L29-31">徒 8:29-31</a>)</p></blockquote><h3>基督向使徒們講解聖經中的預言</h3><blockquote><p>“耶穌對他們說：「無知的人哪，先知所說的一切話，你們的心信得太遲鈍了。 基督這樣受害，又進入他的榮耀，豈不是應當的嗎？」 <strong>於是從摩西和衆先知起，凡經上所指著自己的話都給他們講解明白了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L25-27">路 24:25-27</a>)</p></blockquote><h2>舊約</h2><h3>解釋聖經的必要性</h3><p>在舊約裏不只是向民衆誦讀聖經：文士以斯拉與其他智慧人一同講解，使民衆明白：</p><blockquote><p>“文士以斯拉站在爲這事特備的木臺上。瑪他提雅、示瑪、亞奈雅、烏利亞、希勒家和瑪西雅站在他的右邊；毘大雅、米沙利、瑪基雅、哈順、哈拔大拿、撒迦利亞和米書蘭站在他的左邊。 &lt;…&gt; 他們清清楚楚的念上帝的律法書，<strong>講明意思</strong>，<strong>使百姓明白所念的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/neem/8/#L4,8">尼 8:4,8</a>)</p></blockquote>
