  title: 福音書作者引用七十士譯本
  copy_cover: true
  body: <h2>七十士譯本（LXX）——是什麼？</h2><p><strong>七十士譯本</strong>（拉丁文 Septuaginta——“七十”，簡稱 LXX）——舊約書卷的譯本，於公元前III-II世紀由七十位（72位）猶太釋經者從希伯來文譯成古希臘文。</p><p>除這個希臘文本外，還有希伯來文的文本——馬所拉文本。</p><p><strong>馬所拉文本</strong>——舊約聖經的希伯來文本，公元VII-X世紀在其上加上了元音符號。什麼是元音符號？簡單地說，就是詞上面的各種小點和勾勾，它們指出詞中缺失的元音和讀音的特點，使人能正確讀出這個詞。這些符號叫作區別符號。因爲希伯來文本只由輔音字母組成，所以只有知道誦讀傳統（聖傳）的人才能正確誦讀。加上元音符號，是爲了使文本的讀法成爲唯一的。</p><p>七十士譯本之所以重要，是因爲它是猶太人自己的文本，而且是在猶太民族拒絕耶穌爲基督、爲上帝<strong>之前</strong>就完成的。也就是說，那時還沒有必要把聖經解釋成讓主耶穌基督在其中越來越沒有位置。另外還要考慮到，任何翻譯都同時是一種解釋。在這裏，七十士譯本是由通曉語言和傳統的人所作的解釋-翻譯：從難以誦讀的希伯來文譯成許多人易懂的希臘文。</p><h2>童女還是少女</h2><p>福音史家馬太引用以賽亞關於基督由童女而生的預言：</p><blockquote><p>“說：『<strong><mark>必有童女懷孕生子</mark></strong>，人要稱他的名爲以馬內利。』（以馬內利繙出來就是『上帝與我們同在』。）” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/1/#L23">太 1:23</a>)</p></blockquote><p>這裏“童女”在希臘文裏是 παρθένος。</p><p>按七十士譯本，基督應當由童女而生：</p><blockquote><p>“因此，主自己要給你們一個兆頭，<strong><mark>必有童女懷孕生子</mark></strong>，給他起名叫以馬內利。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/7/#L14">賽 7:14</a>)</p></blockquote><p>而按馬所拉文本，基督由未出嫁的少女而生：希伯來文 עַלְמָ֗ה [al-maw']。</p><h2>杖還是牀的頭</h2><p>使徒保羅在致希伯來人書中(!)回憶，雅各敬拜自己杖的頂端：</p><blockquote><p>“雅各因著信，臨死的時候，給約瑟的兩個兒子各自祝福，<strong>扶著杖頭</strong>敬拜上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L21">希 11:21</a>)</p></blockquote><p>按七十士譯本，雅各敬拜杖的頂端：</p><blockquote><p>“εἶπεν δέ Ὄμοσόν μοι. καὶ ὤμοσεν αὐτῷ. καὶ προσεκύνησεν Ισραηλ <strong>ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ</strong>” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/gen/47/#L31">創 47:31</a>, 譯自希臘文)</p></blockquote><p>而按馬所拉文本，雅各敬拜牀的頭：希伯來文 מִּטָּֽה [mit-taw']。</p><h2>主耶穌基督族譜中的該南</h2><p>福音史家路加在救主的族譜中提到該南，在沙拉與亞法撒之間：</p><blockquote><p>“拿鶴是西鹿的兒子，西鹿是拉吳的兒子，拉吳是法勒的兒子，法勒是希伯的兒子，希伯是沙拉的兒子， 沙拉是<strong><mark>該南</mark></strong>的兒子，該南是亞法撒的兒子，亞法撒是閃的兒子，閃是挪亞的兒子，挪亞是拉麥的兒子， 拉麥是瑪土撒拉的兒子，瑪土撒拉是以諾的兒子，以諾是雅列的兒子，雅列是瑪勒列的兒子，瑪勒列是該南的兒子，該南是以挪士的兒子， 以挪士是塞特的兒子，塞特是亞當的兒子，亞當是上帝的兒子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L35-38">路 3:35-38</a>)</p></blockquote><p>在七十士譯本里有該南（130+330年）。他由亞法撒所生，又生了沙拉：</p><blockquote><p>“καὶ ἔζησεν Αρφαξαδ <strong>μετὰ τὸ γεννῆσαι αὐτὸν τὸν Καιναν</strong> ἔτη τετρακόσια τριάκοντα καὶ ἐγέννησεν υἱοὺς καὶ θυγατέρας καὶ ἀπέθανεν. <strong>Καὶ ἔζησεν Καιναν ἑκατὸν τριάκοντα ἔτη καὶ ἐγέννησεν τὸν Σαλα</strong>.” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/gen/11/#L13">創 11:13</a>, 譯自希臘文)</p></blockquote><p>在馬所拉文本里，亞法撒（35+403年）直接生了沙拉，該南完全不存在：</p><blockquote><p>“<strong>亞法撒活到三十五歲，生了沙拉</strong>。 亞法撒生沙拉之後，又活了四百零三年，並且生兒養女。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/11/#L12-13">創 11:12-13</a>)</p></blockquote><p>前一章也描述了類似的情況：<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/10/#L22,24">創 10:22,24</a>。</p><h2>“使瞎眼的得看見”還是“被囚的出監牢”</h2><p>福音史家路加引用先知以賽亞的預言，按七十士譯本引用：</p><blockquote><p>“『主的靈在我身上，因爲他用膏膏我，叫我傳福音給貧窮的人；差遣我報告被擄的得釋放，<strong><mark>瞎眼的得看見</mark></strong>，叫那受壓制的得自由， 報告上帝悅納人的禧年。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/4/#L18-19">路 4:18-19</a>)</p></blockquote><p>在七十士譯本里，此處有“使瞎眼的得看見”一語（希臘文 τυφλοῖς ἀνάβλεψιν）：</p><blockquote><p>“Πνεῦμα κυρίου ἐπ᾿ ἐμέ, οὗ εἵνεκεν ἔχρισέν με· εὐαγγελίσασθαι πτωχοῖς ἀπέσταλκέν με, ἰάσασθαι τοὺς συντετριμμένους τῇ καρδίᾳ, κηρύξαι αἰχμαλώτοις ἄφεσιν <strong>καὶ τυφλοῖς ἀνάβλεψιν</strong>, καλέσαι ἐνιαυτὸν κυρίου δεκτὸν καὶ ἡμέραν ἀνταποδόσεως, παρακαλέσαι πάντας τοὺς πενθοῦντας” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/is/61/#L1-2">賽 61:1-2</a>, 譯自希臘文)</p></blockquote><p>而在馬所拉文本里是“被囚的出監牢”：希伯來文 אֲסוּרִים פְּקַח־קוֹחַ [aw-sar' pek-akh-ko'-akh]：</p><blockquote><p>“主耶和華的靈在我身上，因爲耶和華用膏膏我，叫我傳好信息給謙卑的人，差遣我醫好傷心的人，報告被擄的得釋放，<strong><mark>被囚的出監牢</mark></strong>； 報告耶和華的恩年，和我們上帝報仇的日子，安慰一切悲哀的人；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/61/#L1-2">賽 61:1-2</a>)</p></blockquote><p>而且在馬所拉文本里，這句話以不同的措辭重複：“報告被擄的得釋放，和被囚的出監牢”。</p><h2>手腳被扎了，還是被獅子撕裂？</h2><p>七十士譯本里有關於基督的預言：</p><blockquote><p>“犬類圍著我，惡黨環繞我；<strong><mark>他們紮了我的手、我的腳</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/22/#L16">詩 22:16</a>)</p></blockquote><p>晚出的馬所拉文本在<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/22/#L16">詩 22:16</a>（詩 22:16）裏沒有關於扎手扎腳的話，那裏是“獅子”一詞。文本里根本沒有“撕裂”的動詞，而且獅子的動作與手腳有什麼關係也不清楚。</p><p>然而，正確的仍然是“扎了”。庫姆蘭古卷 4Q88 證實手腳被扎（詳見<a href="https://bibleox.com/ru/ru/w/пророчества-о-Христе">關於基督的預言</a>）。</p><p>此外，還有一個關於“扎”的預言。它在這裏被引用：</p><blockquote><p>“經上又有一句說：『<strong><mark>他們要仰望自己所扎的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L37">約 19:37</a>)</p></blockquote><p>所引的出處：</p><blockquote><p>“我必將那施恩叫人懇求的靈，澆灌大衛家和耶路撒冷的居民．他們必仰望我，就是<strong><mark>他們所扎的</mark></strong>；必爲我悲哀，如喪獨生子，又爲我愁苦，如喪長子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/12/#L10">亞 12:10</a>)</p></blockquote><p>希伯來原文：“וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר־<strong>דָּקָרוּ</strong>”（[希伯來文原典](https://bibleox.com/zh-Hans/heb-osm/zah/12/#L10)，亞 12:10）</p><p>דָּקָר——扎、刺穿；被刺穿、被扎透。</p><p>庫姆蘭卷 4Q80 也證實是“扎”。</p>
