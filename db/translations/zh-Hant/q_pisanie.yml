- src: FoSK_Причины_написания_посланий
  path: Qb5T_書信的寫作緣由
  title: 書信的寫作緣由
  copy_cover: true
  body: "<ol><li><p>[[rim 1|羅馬書]]——使徒以書信預備自己到羅馬來；</p></li><li><p>[[1kor 1|哥林多前書]]——責備犯淫亂的人、結黨、晚餐時的混亂、濫用方言的恩賜；</p></li><li><p>[[2kor 1|哥林多後書]]——使徒職分的證明，勸勉捐輸；</p></li><li><p>[[gal 1|加拉太書]]——責備“基督徒必須受割禮”的假教訓；</p></li><li><p>[[ef 1|以弗所書]]——講述對上帝奧祕的默觀，安慰憂傷的人；</p></li><li><p>[[fil 1|腓立比書]]——致最愛使徒的教會的問候書信；</p></li><li><p>[[kol 1|歌羅西書]]——反對假教訓以及諾斯替主義、哲學和猶太教的混合物；</p></li><li><p>[[1sol 1|帖撒羅尼迦前書]]——安慰關於已故者的命運，醫治道德上的問題；</p></li><li><p>[[2sol 1|帖撒羅尼迦後書]]——澄清關於基督再來的教導；</p></li><li><p>[[1tim 1|提摩太前書]]——在以弗所假教師增多時的扶持與教導；</p></li><li><p>[[2tim 1|提摩太後書]]——使徒的臨終囑託；</p></li><li><p>[[tit 1|提多書]]——使提多在克里特人中得著權柄；</p></li><li><p>[[fm 1|腓利門書]]——願意使腓利門與他的奴隸阿尼西母和好；</p></li><li><p>[[evr 1|希伯來書]]——基督徒墮入猶太教的危險，見證新約優於舊約，鼓勵基督徒忍受苦難。</p></li></ol>"
