  title: 聖傳
  copy_cover: true
  body: <h2>什麼是聖傳？</h2><p>聖傳——父上帝的啟示，他藉自己的獨生子傳給使徒們，使徒們又傳給教會的其餘部分；教會世世代代以言語（口頭的和書面的）和行爲傳下去：</p><blockquote><p>“因爲<strong>你所賜給我的道，我已經賜給他們，他們也領受了</strong>；又確實知道我是從你出來的，並且信你差了我來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L8">約 17:8</a>)</p></blockquote><blockquote><p>“我稱讚你們，因你們凡事記念我，<strong>又堅守我所傳給你們的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><h2>聖傳不只是文本，也是傳遞信仰的、聽見的言語</h2><blockquote><p>“爲此，我們也不住的感謝上帝，因你們聽見<strong><mark>我們所傳上帝的道</mark></strong>，就領受了；不以爲是人的道，乃以爲是上帝的道。這道實在是上帝的，並且運行在你們信主的人心中。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你從我聽的那純正話語的規模</mark></strong>，要用在基督耶穌裏的信心和愛心，常常守著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L13">提後 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><blockquote><p>“所以弟兄們，你們要<strong>站立得穩</strong>，<strong><mark>凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>)</p></blockquote><blockquote><p>“論到你們，<strong>務要將那從起初所聽見的常存在心裏</strong>。<strong>若將從起初所聽見的存在心裏，你們就必住在子裏面，也必住在父裏面</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L24">約壹 2:24</a>)</p></blockquote><blockquote><p>“我稱讚你們，因你們<strong>凡事記念我</strong>，又堅守我所傳給你們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“<strong>所以要回想你是怎樣領受、怎樣聽見的</strong>，<strong>又要遵守</strong>，並要悔改。若不儆醒，我必臨到你那裏，如同賊一樣；我幾時臨到，你也決不能知道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L3">啟 3:3</a>)</p></blockquote><h2>使徒們使用聖傳</h2><p>使徒說出兩個埃及術士的名字，聖經中沒有記載：</p><blockquote><p>“<strong>從前雅尼和佯庇怎樣敵擋摩西</strong>，這等人也怎樣敵擋真道。他們的心地壞了，在真道上是可廢棄的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L8">提後 3:8</a>)</p></blockquote><p>使徒猶大講到聖經中沒有記載的爭辯：</p><blockquote><p>“<strong>天使長米迦勒爲摩西的屍首與魔鬼爭辯的時候</strong>，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L9">猶 1:9</a>)</p></blockquote><p>關於以諾的話，聖經中沒有記載：</p><blockquote><p>“<strong>亞當的七世孫以諾曾預言這些人說</strong>：『<strong>看哪，主帶著他的千萬聖者降臨</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L14">猶 1:14</a>)</p></blockquote><p>使徒保羅講到先知以賽亞藏在樹洞裏而被鋸死的事：</p><blockquote><p>“被石頭打死，<strong>被鋸鋸死</strong>，受試探，被刀殺，披著綿羊，山羊的皮各處奔跑，受窮乏、患難、苦害，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L37">希 11:37</a>)</p></blockquote><p>福音史家路加根據從目擊者聽來的話寫下福音，即寫下聖傳：</p><blockquote><p>“提阿非羅大人哪，有好些人提筆作書，述說在我們中間所成就的事，是<strong>照傳道的人從起初親眼看見又傳給我們的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L1">路 1:1</a>) <em>(俄文原文引路加福音 1:2，和合本無第2節，其內容併入第1節)</em></p></blockquote><h3>傳達福音書中沒有的信息</h3><p>使徒保羅在對以弗所長老們的講話中指出基督救主的一個教導，福音書中沒有記載：</p><blockquote><p>“我凡事給你們作榜樣，叫你們知道應當這樣勞苦，扶助軟弱的人，又當記念主耶穌的話，說：『<strong><mark>施比受更爲有福</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L35">徒 20:35</a>)</p></blockquote><p>又講到復活基督向許多人顯現，這也是福音書中沒有記的：</p><blockquote><p>“後來<strong>一時顯給五百多弟兄看</strong>，其中一大半到如今還在，卻也有已經睡了的。 以後顯給雅各看，再顯給衆使徒看，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L6-7">林前 15:6-7</a>)</p></blockquote><h2>聖傳的重要性</h2><p>錯誤的教導不引人歸向上帝：</p><blockquote><p>“凡<strong>越過</strong><strong><mark>基督的教訓</mark></strong><strong>不常守著的，就沒有上帝</strong>；<strong>常守這教訓的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><p>異端（錯誤的教導）不能承受上帝的國：</p><blockquote><p>“<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L20-21">加 5:20-21</a>)</p></blockquote><h2>聖傳的必要性</h2><p>聖經並不是關於耶穌基督的全部信息的來源：</p><blockquote><p>“耶穌在門徒面前另外行了許多神蹟，<strong><mark>沒有記在這書上</mark></strong>。 但記這些事，要叫你們信耶穌是基督，是上帝的兒子，並且叫你們信了他，就可以因他的名得生命。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L30-31">約 20:30-31</a>)</p></blockquote><blockquote><p>“<strong><mark>耶穌所行的事還有許多</mark></strong>；若是一一的都寫出來，我想，所寫的書，就是世界也容不下了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/21/#L25">約 21:25</a>)</p></blockquote><p>任何一封書信裏都沒有關於如何施洗、如何按立輔祭、司祭、主教的教導：</p><blockquote><p>“所以，我們應當離開基督道理的開端，竭力進到完全的地步，<strong>不必再立根基</strong>，就如那懊悔死行、信靠上帝、 <strong><mark>各樣洗禮、按手之禮</mark></strong>、死人復活，以及永遠審判各等教訓。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L1-2">希 6:1-2</a>)</p></blockquote><p>如上所述，使徒們願意把某些信息以口傳的方式傳遞：</p><blockquote><p>“我還有許多事要寫給你們，<strong><mark>卻不願意用紙墨寫出來</mark></strong>，但盼望到你們那裏與你們當面談論，使你們的喜樂滿足。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L12">約贰 1:12</a>)</p></blockquote><blockquote><p>“我原有許多事要寫給你；<strong><mark>卻不願意用筆墨寫給你</mark></strong>， 但盼望快快的見你，我們就<strong>當面談論</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3in/1/#L13-14">約叁 1:13-14</a>)</p></blockquote><p>使徒保羅請求持守聖傳（使徒的教導），它們不只在書信裏、也在言語中領受：</p><blockquote><p>“所以弟兄們，你們要<strong>站立得穩</strong>，<strong><mark>凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><h3>使徒口傳宣講的時長</h3><p>使徒保羅教導亞西亞的長老們三年之久，晝夜不住：</p><blockquote><p>“所以你們應當儆醒，記念我<strong><mark>三年之久</mark></strong><strong>晝夜不住的流淚，勸戒你們各人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L31">徒 20:31</a>)</p></blockquote><p>在哥林多教導團體一年半：</p><blockquote><p>“這事以後，保羅離了雅典，來到哥林多。 &lt;…&gt; 保羅<strong><mark>在那裏住了一年零六個月</mark></strong>，<strong>將上帝的道教訓他們</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/18/#L1,11">徒 18:1,11</a>)</p></blockquote><p>在以弗所宣講：先在會堂裏三個月，然後與門徒在學房裏兩年：</p><blockquote><p>“保羅進會堂放膽講道，<strong>一連三個月</strong>，辯論上帝國的事，勸化衆人。 後來，有些人心裏剛硬不信，在衆人面前毀謗這道。保羅就離開他們，也叫門徒與他們分離，便在推喇奴的學房<strong>天天辯論</strong>。 <strong>這樣有兩年之久</strong>，叫一切住在亞西亞的，無論是猶太人，是希利尼人，都聽見主的道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L8-10">徒 19:8-10</a>)</p></blockquote><p>總計，僅使徒保羅一人就宣講了不少於30年：從他33-34年歸主，到64-67年去世。</p><h2>命令持守聖傳並按它教導</h2><blockquote><p>“我往馬其頓去的時候，曾勸你仍住在以弗所，好囑咐那幾個人<strong><mark>不可傳異教</mark></strong>， 也不可聽從荒渺無憑的話語和無窮的家譜。這等事只生辯論，並不發明上帝在信上所立的章程。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L3-4">提前 1:3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><blockquote><p>“所以弟兄們，你們要<strong>站立得穩</strong>，<strong><mark>凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>)</p></blockquote><blockquote><p>“我稱讚你們，因你們凡事記念我，<strong>又堅守我所傳給你們的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“弟兄們，我如今把先前所傳給你們的福音，告訴你們知道。這福音你們也領受了，又靠著站立得住； 並且你們若不是徒然相信，<strong><mark>能以持守我所傳給你們的</mark></strong>，就必因這福音得救。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要<strong>爲從前</strong><strong><mark>一次</mark></strong><strong>交付聖徒的真道竭力的爭辯</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote><blockquote><p>“弟兄們，我還有話說：我們靠著主耶穌求你們、勸你們，<strong><mark>你們既然受了我們的教訓</mark></strong>，知道該怎樣行，可以討上帝的喜悅，就要照你們現在所行的，<strong><mark>更加勉勵</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/4/#L1">帖前 4:1</a>)</p></blockquote><blockquote><p>“<strong>堅守所教真實的道理</strong>，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。 因爲<strong>有許多人不服約束</strong>，說虛空話欺哄人，那奉割禮的更是這樣。 這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“我只怕你們的心或偏於邪，失去那向基督所存純一清潔的心，就像蛇用詭詐誘惑了夏娃一樣。 假如有人來<strong>另傳一個耶穌</strong>，不是我們所傳過的，或者你們另受一個靈，不是你們所受過的；或者<strong>另得一個福音</strong>，不是你們所得過的，你們容讓他也就罷了。 &lt;…&gt; 那等人是假使徒，行事詭詐，裝作基督使徒的模樣。 這也不足爲怪，因爲連撒但也裝作光明的天使。 所以，他的差役若裝作仁義的差役，也不算希奇。他們的結局必然照著他們的行爲。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L3-4,13-15">林後 11:3-4,13-15</a>)</p></blockquote><h2>要遠離引入新教導的人</h2><blockquote><p>“<strong>分門結黨的人</strong>，警戒過一兩次，<strong>就要棄絕他</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L10">多 3:10</a>)</p></blockquote><blockquote><p>“<strong>若有人傳異教</strong>，不服從我們主耶穌基督純正的話與那合乎敬虔的道理， <strong>他是自高自大，一無所知</strong>，專好問難，爭辯言詞，從此就生出嫉妒、紛爭、毀謗、妄疑， 並那壞了心術、失喪真理之人的爭競。他們以敬虔爲得利的門路。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L3-5">提前 6:3-5</a>) <em>(俄文原文6:5末有“要遠離這樣的人”一句，和合本無)</em></p></blockquote><blockquote><p>“提摩太啊，你要<strong>保守所託付你的</strong>，<strong><mark>躲避世俗的虛談</mark></strong>和那敵真道、似是而非的學問。 已經有人自稱有這學問，就偏離了真道。願恩惠常與你們同在。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L20-21">提前 6:20-21</a>)</p></blockquote><blockquote><p>“弟兄們，我們奉主耶穌基督的名吩咐你們：凡有弟兄不按規矩而行，<strong>不遵守從我們所受的教訓</strong>，<strong>就當遠離他</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L6">帖後 3:6</a>)</p></blockquote><blockquote><p>“弟兄們，<strong>那些離間你們、叫你們跌倒</strong>、背乎所學之道的人，我勸你們要留意躲避他們。 因爲這樣的人不服事我們的主基督，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><blockquote><p>“若有人到你們那裏，不是傳這教訓，<strong><mark>不要接他到家裏</mark></strong>，也不要問他的安。 因爲問他安的就在他的惡行上有分。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L10-11">約贰 1:10-11</a>)</p></blockquote><blockquote><p>“但無論是我們，是天上來的使者，若傳福音給你們，<strong>與我們所傳給你們的不同，他就應當被咒詛</strong>。 我們已經說了，現在又說：若有人傳福音給你們，<strong>與你們所領受的不同，他就應當被咒詛</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L8-9">加 1:8-9</a>)</p></blockquote><p><strong>絕罰</strong>（希臘文 ἀνάθεμα）——逐出教會。</p><h2>責備對聖傳的歪曲（異端）</h2><blockquote><p>“<strong>至死要爲真理奮鬥</strong>，上主天主必要助你作戰。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/4/#L33">德 4:33</a>)</p></blockquote><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要<strong>爲從前</strong><strong><mark>一次</mark></strong><strong>交付聖徒的真道竭力的爭辯</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote><blockquote><p>“有些人你們要從火中搶出來、搭救他們；有些人你們要<strong>存懼怕的心憐憫他們</strong>；連那被情慾沾染的衣服也當厭惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L23">猶 1:23</a>) <em>(俄文原文有“要存懼怕的心責備”一詞，和合本無)</em></p></blockquote><blockquote><p>“那闇昧無益的事，不要與人同行，<strong>倒要責備</strong>行這事的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L11">弗 5:11</a>)</p></blockquote>
  meta_desc: 關於必須嚴格持守並遵行使徒信仰（聖傳）的引文
  menu:
    parent: 教會/聖經
