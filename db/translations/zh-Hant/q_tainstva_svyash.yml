  path: QT6T_司祭聖奧祕
  title: 司祭聖奧祕
  copy_cover: true
  body: <h2>舊約中司祭職的上帝設立</h2><p>司祭——只是亞倫的後裔：</p><blockquote><p>“<strong><mark>給亞倫和他兒子束上腰帶</mark></strong>，包上裹頭巾，<strong><mark>他們就憑永遠的定例得了祭司的職任</mark></strong>；又要將亞倫和他兒子分別爲聖。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L9">出 29:9</a>)</p></blockquote><p>司祭職與聖衣、膏抹一同傳遞：</p><blockquote><p>“<strong><mark>亞倫的聖衣要留給他的子孫</mark></strong>，<strong><mark>可以穿著受膏，又穿著承接聖職</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29">出 29:29</a>)</p></blockquote><p>外人若近前來行事奉的禮，必須治死。司祭職的職責就是看守這事：</p><blockquote><p>“<strong><mark>你要囑咐亞倫和他兒子，謹守自己祭司的職任</mark></strong>。<strong><mark>近前來的外人必被治死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/3/#L10">民 3:10</a>)</p></blockquote><p>詳細：</p><blockquote><p>“<strong><mark>耶和華對亞倫說</mark></strong>：「<strong><mark>你和你的兒子，並你本族的人</mark></strong>，要一同擔當干犯聖所的罪孽；你和你的兒子也要一同擔當干犯祭司職任的罪孽。 <strong><mark>你要帶你弟兄利未人</mark></strong>，就是你祖宗支派的人前來，<strong><mark>使他們與你聯合，服事你</mark></strong>，只是<strong><mark>你和你的兒子要一同在法櫃的帳幕前供職</mark></strong>。 他們要守所吩咐你的，並守全帳幕，<strong><mark>只是不可挨近聖所的器具和壇</mark></strong>，免得他們和你們都死亡。 &lt;…&gt; <strong><mark>你和你的兒子要爲一切屬壇，和幔子內的事，一同守祭司的職任</mark></strong>。你們要這樣供職，<strong><mark>我將祭司的職任給你們當作賞賜事奉我</mark></strong>。<strong><mark>凡挨近的外人必被治死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/18/#L1-3,7">民 18:1-3,7</a>)</p></blockquote><h2>新約中司祭職的更換</h2><p>主耶穌基督訂立新約（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L20">路 22:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/8/#L8">希 8:8</a>），改變律法，更換司祭職（是更換，而不是廢除）：</p><blockquote><p>“<strong><mark>祭司的職任既已更改，律法也必須更改</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L12">希 7:12</a>)</p></blockquote><p>救主把聖靈賜給使徒，按麥基洗德的等次設立司祭的等次；他自己成爲大祭司：</p><blockquote><p>“這麥基洗德就是撒冷王，<strong><mark>又是至高上帝的祭司</mark></strong>，本是長遠爲祭司的。他當亞伯拉罕殺敗諸王回來的時候，就迎接他，給他祝福。 亞伯拉罕也將自己所得來的，取十分之一給他。<strong><mark>他頭一個名繙出來就是仁義王</mark></strong>，他又名撒冷王，<strong><mark>就是平安王的意思</mark></strong>。 他<strong><mark>無父、無母、無族譜、無生之始、無命之終</mark></strong>，<strong><mark>乃是與上帝的兒子相似</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L1-3">希 7:1-3</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L20">希 6:20</a>)</p></blockquote><blockquote><p>“我們所講的事，其中第一要緊的，就是<strong><mark>我們有這樣的大祭司，已經坐在天上至大者寶座的右邊</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/8/#L1">希 8:1</a>)</p></blockquote><h2>教會等次的形成</h2><p>在五旬節那天，聖靈被賜給使徒和整個教會聚會——賜給整個教會。但在這天之前，救主只向使徒們顯現，並且只把聖靈賜給他們，把赦罪之權賜給他們如同司祭一樣——就是說，設立等次：</p><blockquote><p>“耶穌又對他們說：「願你們平安！<strong><mark>父怎樣差遣了我，我也照樣差遣你們</mark></strong>。」 說了這話，就向他們吹一口氣，說：「<strong><mark>你們受聖靈</mark></strong>。 <strong><mark>你們赦免誰的罪，誰的罪就赦免了</mark></strong>；<strong><mark>你們留下誰的罪，誰的罪就留下了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L21-23">約 20:21-23</a>)</p></blockquote><p>同樣，在舊約的教會裏，潔淨罪的事正是在司祭職上：</p><blockquote><p>“他有了罪的時候，<strong><mark>就要承認所犯的罪</mark></strong>， 並要因所犯的罪，把他的贖愆祭牲，就是羊羣中的母羊，或是一隻羊羔，或是一隻山羊，牽到耶和華面前爲贖罪祭。至於他的罪，<strong><mark>祭司要爲他贖了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/5/#L5-6">利 5:5-6</a>)</p></blockquote><h2>新等次的權柄</h2><p>主把天國的鑰匙、捆綁和釋放的權柄賜給使徒：</p><blockquote><p>“我要把天國的鑰匙給你，<strong><mark>凡你在地上所捆綁的，在天上也要捆綁</mark></strong>；<strong><mark>凡你在地上所釋放的，在天上也要釋放</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L19">太 16:19</a>)</p></blockquote><blockquote><p>“我實在告訴你們：<strong><mark>凡你們在地上所捆綁的，在天上也要捆綁</mark></strong>；<strong><mark>凡你們在地上所釋放的，在天上也要釋放</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L18">太 18:18</a>)</p></blockquote><p>司祭職由使徒們揀選並按立，但聖經宣告：立長老看守教會的正是聖靈：</p><blockquote><p>“保羅從米利都打發人往以弗所去，<strong><mark>請教會的長老來</mark></strong>。 他們來了，保羅就說：「你們知道，自從我到亞西亞的日子以來，在你們中間始終爲人如何， &lt;…&gt; <strong><mark>聖靈立你們作全羣的監督</mark></strong>，你們就當爲自己謹慎，也爲全羣謹慎，<strong><mark>牧養上帝的教會</mark></strong>，就是他用自己血所買來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><p>這一切——是舊約預言的應驗，見下文。</p><h2>關於新約司祭職的預言</h2><p>在舊約的教會裏，司祭只從猶太民族中立——利未支派、亞倫的家系。而在新約的教會裏，司祭將從一切民族中立，而不只是從猶太人（亞倫的家系）中：</p><blockquote><p>“「我知道他們的行爲和他們的意念。時候將到，<strong><mark>我必將萬民萬族</mark></strong>聚來，看見我的榮耀。 我要顯神跡在他們中間，逃脫的我要差到列國去，就是到他施、普勒、拉弓的路德和土巴、雅完，<strong><mark>並素來沒有聽見我名聲、沒有看見我榮耀遼遠的海島</mark></strong>，他們必將我的榮耀傳揚在列國中。 他們必將你們的弟兄從列國中送回，使他們或騎馬，或坐車，坐轎，騎騾子，騎獨峯駝，到我的聖山耶路撒冷，作爲供物獻給耶和華，好像以色列人用潔淨的器皿盛供物奉到耶和華的殿中。」這是耶和華說的。 耶和華說：「<strong><mark>我也必從他們中間取人爲祭司，爲利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L18-21">賽 66:18-21</a>)</p></blockquote><h2>使徒傳承與按立的教訓</h2><h3>主教的按立</h3><p>主教提摩太藉使徒的按手、並有先前已被按立的主教們的按手，領受了特別的恩賜：</p><blockquote><p>“爲此我提醒你，<strong><mark>使你將上帝藉我按手所給你的恩賜</mark></strong>，再如火挑旺起來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要輕忽所得的恩賜</mark></strong>，<strong><mark>就是從前藉着預言、在衆長老按手的時候賜給你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L14">提前 4:14</a>)</p></blockquote><p>行邪術的西門看見，不是每個基督徒都能按手以賜下聖靈。字面上說：不是人人都有這權柄。他拿錢給使徒，要他們也給他這權柄（使徒們爲此咒詛了他）：</p><blockquote><p>“<strong><mark>西門看見使徒按手，便有聖靈賜下</mark></strong>，就拿錢給使徒， 說：「<strong><mark>把這權柄也給我</mark></strong>，<strong><mark>叫我手按著誰，誰就可以受聖靈</mark></strong>。」 彼得說：「你的銀子和你一同滅亡吧！因<strong><mark>你想上帝的恩賜是可以用錢買的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L18-20">徒 8:18-20</a>)</p></blockquote><h3>使徒保羅的按立</h3><blockquote><p>“他們事奉主，禁食的時候，聖靈說：「<strong><mark>要爲我分派巴拿巴和掃羅</mark></strong>，去作我召他們所作的工。」 <strong><mark>於是禁食禱告，按手在他們頭上</mark></strong>，就打發他們去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><h3>輔祭的按立</h3><blockquote><p>“叫他們站在使徒面前。<strong><mark>使徒禱告了，就按手在他們頭上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/6/#L6">徒 6:6</a>)</p></blockquote><p>同樣見：<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/21/#L8">徒 21:8</a></p><h3>關於按立的教訓</h3><p>使徒關於按手的教訓：</p><blockquote><p>“<strong><mark>各樣洗禮、按手之禮</mark></strong>、死人復活，以及永遠審判各等教訓。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L2">希 6:2</a>)</p></blockquote><p>警告不要急於按立（立爲司祭）：</p><blockquote><p>“<strong><mark>給人行按手的禮，不可急促</mark></strong>；<strong><mark>不要在別人的罪上有分</mark></strong>，要保守自己清潔。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L22">提前 5:22</a>)</p></blockquote><h3>主教與長老——區別</h3><p>主教（希臘文 ἐπίσκοπος——監督）和長老（希臘文 πρεσβύτερος——年長者、團體之首）這兩個概念交叉使用，彷彿可以互換。然而，具體之人的職分和權柄看得清楚，無論他們如何被稱呼。提多應當完成使徒的事業，在克里特設立長老：</p><blockquote><p>“我從前留你在革哩底，是要你將那沒有辦完的事都辦整齊了，<strong><mark>又照我所吩咐你的，在各城設立長老</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L5">多 1:5</a>)</p></blockquote><p>提摩太可以審判自己的長老、責備和警戒信徒：</p><blockquote><p>“<strong><mark>控告長老的呈子，非有兩三個見證就不要收</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L19">提前 5:19</a>)</p></blockquote><blockquote><p>“<strong><mark>務要傳道</mark></strong>！無論得時不得時，總要專心，並用百般的忍耐，各樣的教訓，<strong><mark>責備人，警戒人，勸勉人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L2">提後 4:2</a>)</p></blockquote><p>這樣，提多和提摩太按今天的理解是主教，雖然被稱爲長老。</p><h3>人人都是司祭嗎？</h3><h4>與舊約話語的平行</h4><p>使徒彼得重複舊約的話，稱所有基督徒爲君尊的祭司和聖潔的國民：</p><blockquote><p>“<strong><mark>惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度</mark></strong>，是屬上帝的子民，要叫你們宣揚那召你們出黑暗、入奇妙光明者的美德。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L9">彼前 2:9</a>)</p></blockquote><p>這些話在舊約裏是對全以色列說的：</p><blockquote><p>“如今你們若實在聽從我的話，遵守我的約，就要在萬民中作屬我的子民；因爲全地都是我的。 <strong><mark>你們要歸我作祭司的國度，爲聖潔的國民</mark></strong>。』這些話你要告訴以色列人。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/19/#L5-6">出 19:5-6</a>)</p></blockquote><p>這樣，上帝稱舊約的以色列爲祭司的國度和聖潔的國民。然而，在事奉聖禮的意義上，並不是所有猶太人都是司祭。按律法，只有亞倫的司祭職可以進帳幕，其餘的人若進帳幕就須以自己的生命付出代價，即他們必須死（<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/3/#L10">民 3:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/3/#L38">民 3:38</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/18/#L7">民 18:7</a>）。</p><p>如果在舊約裏要把這些話分開——祭司的國度（不是所有人）和聖潔的國民（所有人），那麼對新約使徒的話也得同樣承認：君尊的祭司（不是所有人）、聖潔的國度（所有人）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L9">彼前 2:9</a>）。這些話可以按字面理解，也可以按寓意理解，但無論如何，都得把這兩句話聯繫在一起，在同一意義上理解它們。</p><h4>舊約中建立普遍祭司職的企圖</h4><p>在舊約裏，上帝設立的秩序是：只有亞倫的後裔可以作司祭：</p><blockquote><p>“<strong><mark>亞倫的聖衣要留給他的子孫</mark></strong>，可以穿著受膏，又穿著承接聖職。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29">出 29:29</a>)</p></blockquote><p>甚至亞倫的家系也不是人人都能作司祭：</p><blockquote><p>“<strong><mark>祭司亞倫的後裔，凡有殘疾的，都不可近前來將火祭獻給耶和華</mark></strong>。他有殘疾，不可近前來獻上帝的食物。 &lt;…&gt; 但不可進到幔子前，也不可就近壇前，因爲他有殘疾，<strong><mark>免得褻瀆我的聖所</mark></strong>。我是叫他成聖的耶和華。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L21,23">利 21:21,23</a>)</p></blockquote><p>反對這神聖秩序的，是<strong>可拉、大坍、亞比蘭和安</strong>，他們要求先知摩西從全民族中立司祭，而不只是從亞倫的家系。他們引用的正是那句話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/19/#L5-6">出 19:5-6</a>），說人人都聖潔：</p><blockquote><p>“聚集攻擊摩西、亞倫，說：「你們擅自專權！<strong><mark>全會衆個個既是聖潔，耶和華也在他們中間</mark></strong>，<strong><mark>你們爲什麼自高，超過耶和華的會衆呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/16/#L3">民 16:3</a>)</p></blockquote><blockquote><p>“耶和華又使你和你一切弟兄利未的子孫一同親近他，這豈爲小事？<strong><mark>你們還要求祭司的職任嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/16/#L10">民 16:10</a>)</p></blockquote><p>之後上帝的榮光顯現，地開了口，吞滅了叛亂者：</p><blockquote><p>“<strong><mark>可拉招聚全會衆到會幕門前</mark></strong>，要攻擊摩西、亞倫；耶和華的榮光就向全會衆顯現。 耶和華曉諭摩西、亞倫說： 「<strong><mark>你們離開這會衆，我好在轉眼之間把他們滅絕</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/16/#L19-21">民 16:19-21</a>)</p></blockquote><p>上帝吩咐把叛亂者的香爐中的火倒出，用那些香爐包祭壇，作後世的記念：</p><blockquote><p>“「你吩咐祭司亞倫的兒子以利亞撒，從火中撿起那些香爐來，把火撒在別處，因爲那些香爐是聖的。 <strong><mark>把那些犯罪自害己命之人的香爐，叫人錘成片子，用以包壇</mark></strong>，那些香爐本是他們在耶和華面前獻過的，所以是聖的，<strong><mark>並且可以給以色列人作記號</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/16/#L37-38">民 16:37-38</a>)</p></blockquote><blockquote><p>“<strong><mark>他們遭遇這些事都要作爲鑑戒</mark></strong>，並且寫在經上，正是警戒我們這末世的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L11">林前 10:11</a>)</p></blockquote><p>使徒猶大也記念可拉滅亡的頑梗：</p><blockquote><p>“他們有禍了！因爲走了該隱的道路，又爲利往巴蘭的錯謬裏直奔，<strong><mark>並在可拉的背叛中滅亡了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L11">猶 1:11</a>)</p></blockquote><p>還有預言說，在末後的日子這樣的人要起來：</p><blockquote><p>“因爲時候要到，人必厭煩純正的道理，<strong><mark>耳朵發癢，就隨從自己的情慾，增添好些師傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L3">提後 4:3</a>)</p></blockquote><h4>關於新約中立司祭的預言</h4><p>還在舊約裏就有預言：在新約裏仍要立司祭和僕人，但從一切民族中立，而不只是從亞倫的家系：</p><blockquote><p>“「我知道他們的行爲和他們的意念。時候將到，<strong><mark>我必將萬民萬族</mark></strong>聚來，看見我的榮耀。 我要顯神跡在他們中間，逃脫的我要差到列國去，就是到他施、普勒、拉弓的路德和土巴、雅完，並素來沒有聽見我名聲、沒有看見我榮耀遼遠的海島，他們必將我的榮耀傳揚在列國中。 他們必將你們的弟兄從列國中送回，使他們或騎馬，或坐車，坐轎，騎騾子，騎獨峯駝，到我的聖山耶路撒冷，作爲供物獻給耶和華，好像以色列人用潔淨的器皿盛供物奉到耶和華的殿中。」這是耶和華說的。 耶和華說：「<strong><mark>我也必從他們中間取人爲祭司，爲利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L18-21">賽 66:18-21</a>)</p></blockquote><p>新約裏指明，沒有人可以自己取得司祭職：</p><blockquote><p>“<strong><mark>凡從人間挑選的大祭司，是奉派替人辦理屬上帝的事</mark></strong>，爲要獻上禮物和贖罪祭。 他能體諒那愚蒙的和失迷的人，因爲他自己也是被軟弱所困。 故此，他理當爲百姓和自己獻祭贖罪。 <strong><mark>這大祭司的尊榮，沒有人自取</mark></strong>，<strong><mark>惟要蒙上帝所召，像亞倫一樣</mark></strong>。 <strong><mark>如此，基督也不是自取榮耀作大祭司</mark></strong>，乃是在乎向他說：『你是我的兒子，我今日生你』的那一位。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/5/#L1-5">希 5:1-5</a>)</p></blockquote><h4>信了並受了洗的行邪術的西門沒有傳遞聖靈恩賜的恩賜</h4><p>行邪術的西門，如經所記，信了並受了洗：</p><blockquote><p>“<strong><mark>西門自己也信了，既受了洗</mark></strong>，就常與腓利在一處，看見他所行的神跡和大異能，就甚驚奇。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L13">徒 8:13</a>)</p></blockquote><p>但當他明白不是所有基督徒都能傳遞聖靈的恩賜時，就試圖向使徒們買這恩賜。使徒們爲此咒詛了他：</p><blockquote><p>“<strong><mark>西門看見使徒按手，便有聖靈賜下</mark></strong>，就拿錢給使徒， 說：「<strong><mark>把這權柄也給我</mark></strong>，<strong><mark>叫我手按著誰，誰就可以受聖靈</mark></strong>。」 <strong><mark>彼得說</mark></strong>：「你的銀子和你一同滅亡吧！因<strong><mark>你想上帝的恩賜是可以用錢買的</mark></strong>。 <strong><mark>你在這道上無分無關</mark></strong>，因爲在上帝面前，你的心不正。 <strong><mark>你當懊悔你這罪惡</mark></strong>，祈求主，或者你心裏的意念可得赦免。 <strong><mark>我看出你正在苦膽之中</mark></strong>，被罪惡捆綁。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L18-23">徒 8:18-23</a>)</p></blockquote><p>由此可見，不是所有基督徒都是有職分和上帝恩賜的司祭，能傳遞聖靈。給撒瑪利亞人施洗的六品執事腓利也沒有這恩賜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/21/#L8">徒 21:8</a>）。而有這恩賜的人，是藉使徒的按手（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>）和司祭職的按手（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L14">提前 4:14</a>）領受的。</p><p>這樣：</p><ul><li><p>不是所有人都受了教導並施洗的託付：“所以，<strong>你們要去，使萬民作我的門徒，奉父，子、聖靈的名給他們施洗</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L19">太 28:19</a>）</p></li><li><p>不是所有人都受了命令：“<strong>你們應當如此行，爲的是記念我</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19">路 22:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L24">林前 11:24</a>）</p></li><li><p>不是所有人都得了捆綁和釋放的權柄：“凡你們<strong>在地上所捆綁</strong>的，在天上也要捆綁；凡你們<strong>在地上所釋放</strong>的，在天上也要釋放”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L18">太 18:18</a>）</p></li><li><p>不是所有人都得了赦罪和不赦罪的權柄：“<strong>你們赦免誰的罪</strong>，誰的罪就赦免了；<strong>你們留下誰的罪</strong>，誰的罪就留下了”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L23">約 20:23</a>）</p></li><li><p>不是所有人都得了按手賜聖靈的權柄：“<strong>西門看見使徒按手，便有聖靈賜下</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L18">徒 8:18</a>）</p></li><li><p>使徒吩咐請來的，正是長老，病人藉他們的祈禱和事奉（用油抹）可以得赦罪：“<strong>他就該請教會的長老來</strong>，他們可以<strong>奉主的名用油抹他</strong>，爲他禱告。……<strong>他若犯了罪，也必蒙赦免</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-15">雅 5:14-15</a>）</p></li></ul><h2>君尊的祭司——如何理解？</h2><p>無論在舊約還是新約，每個信徒都被召在自己的殿——自己的身體——裏作祭司。<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>，而祭司就是在這殿裏向上帝獻祭的人。使徒彼得正是從這個思想開始，然後纔講到君尊的祭司：</p><blockquote><p>“你們來到主面前，也就像活石，<strong><mark>被建造成爲靈宮</mark></strong>，<strong><mark>作聖潔的祭司</mark></strong>，藉着耶穌基督<strong><mark>奉獻上帝所悅納的靈祭</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L5">彼前 2:5</a>)</p></blockquote><p>講君尊的祭司時，使徒彼得在同一封書信裏也講到牧人和必須順服他們：</p><blockquote><p>“<strong><mark>你們年幼的也要順服年長的</mark></strong>。就是你們衆人也都要以謙卑束腰，彼此順服，『<strong><mark>因爲上帝阻擋驕傲的人，賜恩給謙卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L5">彼前 5:5</a>)</p></blockquote><p>還有一處關於基督徒爲祭司的話：</p><blockquote><p>“並那誠實作見證的、從死裏首先復活、爲世上君王元首的耶穌基督，有恩惠、平安歸與你們！他愛我們，用自己的血使我們脫離罪惡， <strong><mark>又使我們成爲國民，作他父上帝的祭司</mark></strong>。但願榮耀，權能歸給他，直到永永遠遠。阿們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L5-6">啟 1:5-6</a>)</p></blockquote><blockquote><p>“他們唱新歌，說：「你配拿書卷，配揭開七印。因爲你曾被殺，用自己的血從各族、各方、各民、各國中買了人來，叫他們歸於上帝， <strong><mark>又叫他們成爲國民，作祭司，歸於上帝，在地上執掌王權</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/5/#L9-10">啟 5:9-10</a>)</p></blockquote><blockquote><p>“在頭一次復活有分的有福了、聖潔了！第二次的死在他們身上沒有權柄。<strong><mark>他們必作上帝和基督的祭司</mark></strong>，並要與基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L6">啟 20:6</a>)</p></blockquote><p>基督徒怎樣是王，也就怎樣是祭司。如果他現在不掌管外在的人，也就不是外在之人的祭司。這樣的解釋對上下文是誠實的，也符合常識。</p><p>基督徒被召在自己的身體裏爲王——使自己的理智掌管身體的私慾；而潔淨了這上帝的殿（自己的身體和心）之後，應當在那裏獻上蒙上帝悅納的祭：純潔的思想、言語、行爲、祈禱和頌讚。</p><h2>尊敬司祭</h2><blockquote><p>“<strong><mark>那善於管理教會的長老，當以爲配受加倍的敬奉</mark></strong>。那勞苦傳道教導人的，更當如此。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L17">提前 5:17</a>)</p></blockquote><blockquote><p>“<strong>你當全心敬畏上主，並尊敬他的司祭。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/7/#L31">德 7:31</a>)</p></blockquote><blockquote><p>“<strong>你當全靈恭敬上主，尊敬司祭。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/7/#L33">德 7:33</a>)</p></blockquote><h2>必須順服司祭職</h2><blockquote><p>“<strong><mark>你們要依從那些引導你們的，且要順服</mark></strong>，<strong><mark>因他們爲你們的靈魂時刻儆醒</mark></strong>，好像那將來交賬的人。你們要使他們交的時候有快樂，不至憂愁；若憂愁就與你們無益了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L17">希 13:17</a>)</p></blockquote><blockquote><p>“<strong><mark>你們年幼的也要順服年長的</mark></strong>。就是你們衆人也都要以謙卑束腰，彼此順服，『<strong><mark>因爲上帝阻擋驕傲的人，賜恩給謙卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L5">彼前 5:5</a>)</p></blockquote><p>在舊約裏，不聽從司祭審判官——是致死的罪：</p><blockquote><p>“<strong><mark>若有人擅敢不聽從那侍立在耶和華你上帝面前的祭司</mark></strong>，或不聽從審判官，<strong><mark>那人就必治死</mark></strong>。這樣，便將那惡從以色列中除掉。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/17/#L12">申 17:12</a>)</p></blockquote><h2>對異議的回應</h2><h3>“藉按手賜下聖靈——這只是西門的誤解？”</h3><p>正教徒在聖經裏指出關於藉按手傳遞聖靈之特殊恩賜的引文。這些引文中有行邪術的（術士）西門的情形。</p><p>行邪術的西門看見，不是每個基督徒都能按手以賜下聖靈。字面上說：不是人人都有這權柄。他拿錢給使徒，要他們也給他這權柄（使徒們爲此咒詛了他）：</p><blockquote><p>“<strong><mark>西門看見使徒按手，便有聖靈賜下</mark></strong>，就拿錢給使徒， 說：「<strong><mark>把這權柄也給我</mark></strong>，<strong><mark>叫我手按著誰，誰就可以受聖靈</mark></strong>。」 彼得說：「你的銀子和你一同滅亡吧！因<strong><mark>你想上帝的恩賜是可以用錢買的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L18-20">徒 8:18-20</a>)</p></blockquote><p>批評者說，這只是行邪術的西門的錯誤理解：他畢竟是術士，所以一切都理解錯了。</p><p>那使徒保羅也是術士嗎？</p><blockquote><p>“爲此我提醒你，<strong><mark>使你將上帝藉我按手所給你的恩賜</mark></strong>，再如火挑旺起來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要輕忽所得的恩賜</mark></strong>，<strong><mark>就是從前藉着預言、在衆長老按手的時候賜給你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L14">提前 4:14</a>)</p></blockquote><p>使徒直接說：上帝的恩賜是藉他的按手賜下的。</p><p>回到西門的情形。使徒行傳中的這個故事是福音史家路加寫的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L3">路 1:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L1">徒 1:1</a>）。他寫的不是西門彷彿對事件有什麼錯誤的理解，而是西門只是<strong>看見</strong>了。他看見了什麼？福音史家路加寫道：“西門看見使徒按手，便有聖靈賜下”——這就是他所看見的。這不是西門在說，而是福音史家路加。接著從使徒彼得的話可以清楚：這確實如此——使徒能夠傳遞這上帝的恩賜，而他責備西門的，正是他想<strong>用錢</strong>得到<strong>上帝的恩賜</strong>。</p><h3>“使徒保羅的按立不是經過人？”</h3><p>正教徒表明，使徒保羅的職分是教會按立的：</p><blockquote><p>“他們事奉主，禁食的時候，聖靈說：「<strong><mark>要爲我分派巴拿巴和掃羅</mark></strong>，去作我召他們所作的工。」 <strong><mark>於是禁食禱告，按手在他們頭上</mark></strong>，就打發他們去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><p>批評者反駁說，使徒保羅不是被人按立的，並引用一節經文：</p><blockquote><p>“作使徒的保羅（<strong><mark>不是由於人，也不是藉着人</mark></strong>，乃是藉着耶穌基督，與叫他從死裏復活的父上帝），” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L1">加 1:1</a>)</p></blockquote><p>但這指控沒有根據，因爲這裏說的是揀選的方式，而不是上帝恩賜的傳遞。</p><p>在按手在掃羅身上之前，確實是聖靈自己揀選了他，並吩咐教會把掃羅分別出來，擔任經上所說聖靈召他去的事奉。批評者引用這節經文是爲了什麼——不明白，因爲並沒有矛盾：掃羅不是由人、也不是通過人揀選的，而是聖靈自己揀選了他，吩咐教會把他分別出來擔任事奉，之後教會給掃羅按手：</p><blockquote><p>“他們事奉主，禁食的時候，<strong><mark>聖靈說</mark></strong>：「<strong><mark>要爲我分派巴拿巴和掃羅</mark></strong>，<strong><mark>去作我召他們所作的工</mark></strong>。」 <strong><mark>於是禁食禱告，按手在他們頭上</mark></strong>，就打發他們去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><p>這樣，揀選是聖靈行的，而恩典的賜下不是不經教會，而是經由教會——經由她僕人們的按手。</p><p>批評者試圖以此論證他們所建立的團體與最早的基督徒沒有任何直接聯繫，論證他們自行選立牧師和教師。顯然，自己沒有從上帝來的權柄管理並教導教會的人，不能把這樣的權柄給任何人。但他們要緊的是表明一種可能性：彷彿聖靈可以這樣作——彷彿可以不經任何與他們之前已存在的教會的聯繫，立他們的牧師擔任事奉。</p><p>然而，雖然聖靈願意作什麼就作什麼，我們在聖經裏看不到一例：上帝脫離基督所建立的合一的、看得見的教會而立人擔任事奉並拯救人。</p><p>上帝揀選了掃羅；雖然他無疑可以親自立他擔任事奉，但沒有不經自己的教會這樣做。同樣我們在最初外邦人受洗的事上也看到：埃提阿伯的太監（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L27">徒 8:27</a>）和百夫長哥尼流（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L1">徒 10:1</a>）。</p><ol><li><p>埃提阿伯的太監在讀聖經，卻不明白。<strong>上帝本可以</strong>親自教導太監並賜下洗禮的救人恩典，<strong>但沒有脫離教會這樣做</strong>。上帝差教會到太監那裏，教會教導他明白聖經，並在洗禮中賜下恩典。</p></li><li><p>百夫長哥尼流祈禱上帝、行善事。<strong>上帝本可以</strong>親自把救人的恩典賜給哥尼流，<strong>但沒有脫離教會這樣做</strong>。他反而差天使到他那裏，吩咐他去找教會（以使徒彼得爲代表）。當使徒來到時，聖靈才降在哥尼流身上——雖然它同樣可以早些、不經使徒而降臨，但它沒有這樣做。</p></li><li><p>逼迫基督徒的掃羅（未來的使徒保羅）往大馬士革去逼迫基督徒。基督以耀眼的光向他顯現；掃羅問他該作什麼。基督上帝<strong>本可以</strong>親自把恩典賜給掃羅，<strong>但沒有脫離教會這樣做</strong>，而是吩咐他到大馬士革去找教會（以使徒亞拿尼亞爲代表）；只有在那裏，使徒才藉著教會使他復原（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/9/#L17">徒 9:17</a>），賜下聖靈的恩典（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/9/#L17">徒 9:17</a>），並在洗禮中賜下洗淨他罪的救人恩典（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L16">徒 22:16</a>）。</p></li></ol><p>同樣，在一切情形中，包括按立掃羅擔任特殊的使徒職分：上帝自己揀選掃羅，上帝本可以親自把他的恩賜賜給他，但沒有脫離自己的教會這樣做。聖靈向教會說話，教會給掃羅按手（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2-3">徒 13:2-3</a>）。</p><p>所以，那些與教會分離的團體宣稱他們的牧師有脫離教會的特殊蒙召，在聖經裏沒有任何依據。聖經里根本沒有這樣的例子。</p><h3>“按手是從異教借來的？”</h3><p>那些自行建立教會的人，首先必須證明基督一次所建立的教會已經墮落。因爲如果教會沒有墮落，那他們的新團體就不需要，只要進入基督的教會即可。爲證明教會的墮落，常用“貼標籤”的手法——貼上儘可能可怕的標籤。於是教會常被指控偏離上帝、因借用異教實踐而墮入異教，被點名的有：</p><ul><li><p>聖殿的存在；</p></li><li><p>聖地；</p></li><li><p>聖物；</p></li><li><p>聖像；</p></li><li><p>特別的神聖之人（司祭）；</p></li><li><p>聖規程和聖奧祕（彷彿是影響上帝的藥方），其中包括按手。</p></li></ul><p>這是極其荒唐的指控，因爲這一切都是上帝親自設立的，並且聖經裏都有直接的經文。把異教拉到這裏來，只是爲了給教會貼標籤。所有這些神聖的建築、地方、物件、行動和人，在新舊約聖經裏都有——詳見<a href="https://bibleox.com/ru/ru/w/святыня">聖物</a>一文。</p><h4>舊約中的按手</h4><p>雅各以祈禱按手祝福了自己的孫子：</p><blockquote><p>“<strong><mark>以色列伸出右手來</mark></strong>，<strong><mark>按在以法蓮的頭上</mark></strong>，以法蓮乃是次子；<strong><mark>又剪搭過左手來按在瑪拿西的頭上</mark></strong>，瑪拿西原是長子。 <strong><mark>他就給約瑟祝福說</mark></strong>：「願我祖亞伯拉罕和我父以撒所事奉的上帝，就是一生牧養我，直到今日的上帝， 救贖我脫離一切患難的那使者，<strong><mark>賜福與這兩個童子</mark></strong>。願他們歸在我的名下和我祖亞伯拉罕、我父以撒的名下，又願他們在世界中，生養衆多。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/48/#L14-16">創 48:14-16</a>)</p></blockquote><p>上帝命令先知摩西以按手立約書亞擔任事奉：</p><blockquote><p>“耶和華對摩西說：「<strong><mark>嫩的兒子約書亞是心中有聖靈的</mark></strong>，<strong><mark>你將他領來，按手在他頭上</mark></strong>， &lt;…&gt; 於是，摩西照耶和華所吩咐的，將約書亞領來，使他站在祭司以利亞撒和全會衆面前， <strong><mark>按手在他頭上，囑咐他</mark></strong>，是照耶和華藉摩西所說的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/27/#L18,22-23">民 27:18,22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>嫩的兒子約書亞，因爲摩西曾按手在他頭上，就被智慧的靈充滿</mark></strong>，以色列人便聽從他，照著耶和華吩咐摩西的行了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/34/#L9">申 34:9</a>)</p></blockquote><p>上帝命令以按手立利未人在聖殿供職：</p><blockquote><p>“<strong><mark>將利未人奉到耶和華面前，以色列人要按手在他們頭上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/8/#L10">民 8:10</a>)</p></blockquote><h4>新約中的按手</h4><blockquote><p>“爲此我提醒你，<strong><mark>使你將上帝藉我按手所給你的恩賜</mark></strong>，再如火挑旺起來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要輕忽所得的恩賜</mark></strong>，就是從前藉着預言、<strong><mark>在衆長老按手的時候賜給你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L14">提前 4:14</a>)</p></blockquote><blockquote><p>“<strong><mark>各樣洗禮、按手之禮</mark></strong>、死人復活，以及永遠審判各等教訓。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L2">希 6:2</a>)</p></blockquote><p>研讀聖經之後，那些指責教會彷彿在使徒之後從異教借來這些實踐及其態度的說法，就令人驚訝了——使徒們自己寫的正是上帝的恩賜<strong>藉著</strong>他們手的按手而賜下，並且把這作爲教導的一部分。這一切（這方式本身）不是新發明，而是在使徒之前的同一環境裏已存在了幾個世紀的東西——設立它的不是異教徒，而是上帝自己。</p><h3>“新約裏沒有稱祭司？”</h3><p>“祭司職”一詞在新約的語境中出現。基督更換了祭司職，而不是廢除它：</p><blockquote><p>“<strong><mark>祭司的職任既已更改</mark></strong>，律法也必須更改。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L12">希 7:12</a>)</p></blockquote><p>基督成爲永遠的大祭司，但司祭沒有被廢除。關於他們的揀選和設立，預言裏有話：</p><blockquote><p>“「我知道他們的行爲和他們的意念。時候將到，<strong><mark>我必將萬民萬族</mark></strong>聚來，看見我的榮耀。 我要顯神跡在他們中間，逃脫的我要差到列國去，就是到他施、普勒、拉弓的路德和土巴、雅完，並素來沒有聽見我名聲、沒有看見我榮耀遼遠的海島，他們必將我的榮耀傳揚在列國中。 他們必將你們的弟兄從列國中送回，使他們或騎馬，或坐車，坐轎，騎騾子，騎獨峯駝，到我的聖山耶路撒冷，作爲供物獻給耶和華，好像以色列人用潔淨的器皿盛供物奉到耶和華的殿中。」這是耶和華說的。 耶和華說：「<strong><mark>我也必從他們中間取人爲祭司，爲利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L18-21">賽 66:18-21</a>)</p></blockquote><p>此外，實際上正是使徒們是祭司——不是隨便什麼人。舊約裏司祭有潔淨人罪的職責（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/5/#L5-6">利 5:5-6</a>）；同樣在新約裏，新的教會等次建立時，這權柄被賜給它——赦罪或不赦罪：</p><blockquote><p>“耶穌又對他們說：「願你們平安！父怎樣差遣了我，我也照樣差遣你們。」 說了這話，就向他們吹一口氣，說：「<strong><mark>你們受聖靈</mark></strong>。 <strong><mark>你們赦免誰的罪，誰的罪就赦免了</mark></strong>；<strong><mark>你們留下誰的罪，誰的罪就留下了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L21-23">約 20:21-23</a>)</p></blockquote><p>最早的基督徒證實：長老們也是祭司——見<a href="https://bibleox.com/ru/ru/w/gq8M_Новозаветные_пресвитеры__священники">引文</a>。</p>
