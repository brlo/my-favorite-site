  path: QW7T_上帝之母
  title: 上帝之母
  copy_cover: true
  body: <h2>預備性的共通問題</h2><p>本文以上帝的教訓爲前提：<strong>基督是上帝</strong>（<a href="https://bibleox.com/ru/ru/w/Христос-Бог">引文</a>）。</p><p>童貞女馬利亞受敬禮，是根據敬禮聖人的教訓；所以首先要證明<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬禮聖人</a>和<a href="https://bibleox.com/ru/ru/w/молитвы-святым">爲聖人祈禱</a>。</p><p>然而，這裏將提出的依據，不只是把童貞女馬利亞作爲聖人之一來敬禮，而是<strong>特別</strong>敬禮她——作爲<strong>聖僕和上帝朋友中最大的一位</strong>，作爲耶穌基督的母親（即上帝之母，因爲耶穌基督是上帝）。</p><h2>特別敬禮上帝之母的緣由</h2><ol><li><p><strong>童貞女馬利亞對上帝話語特別的留意</strong>；</p></li><li><p><strong>完全謙卑地順服上帝</strong>；</p></li><li><p><strong>被上帝揀選</strong>。全宇宙中沒有別的受造物蒙上帝賜予按人性生他的榮耀。她的功績不在於生育，而在於上帝預先知道馬利亞的品質（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L29">羅 8:29</a>），因這些品質而揀選了她。上帝以這揀選指明她的偉大；</p></li><li><p><strong>上帝之子尊敬童貞女馬利亞爲自己的母親</strong>。再沒有別的受造物（全宇宙中）是上帝之子的母親；</p></li><li><p><strong>預言的應驗</strong>：“從今以後萬代要稱我有福”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L48">路 1:48</a>）——即所有世代的人。上帝爲童貞女馬利亞成就了大事：“那有權能的爲我成就了<strong>大事</strong>，他的名爲聖”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L49">路 1:49</a>）。</p></li></ol><h2>因謙卑被揀選</h2><blockquote><p>“馬利亞說：「我心尊主爲大； 我靈以上帝我的救主爲樂。 因爲<strong><mark>他顧念他使女的卑微</mark></strong>，<strong><mark>從今以後，萬代要稱我有福</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L46-48">路 1:46-48</a>)</p></blockquote><p>連最大的先知（施洗約翰）的父親撒迦利亞，也因不信——或說得更好：因不信任、疑惑——被天使責罰（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L20">路 1:20</a>）。而上帝之母謙卑地領受了對自己的定命，謙卑地回答：</p><blockquote><p>“馬利亞說：「我是主的使女，<strong><mark>情願照你的話成就在我身上</mark></strong>。」天使就離開她去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L38">路 1:38</a>)</p></blockquote><p>關於謙卑的重要引文：</p><blockquote><p>“你的力量，不在乎人多；你的威能，並不靠強力；但<strong>你卻是謙卑者的天主</strong>，弱小者的扶助，無力者的保護，無靠者的依賴，失望者的救主。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/iudf/9/#L11">友 9:11</a>)</p></blockquote><blockquote><p>“<strong>你越偉大，在一切事上越當謙下</strong>；這樣，你才能在上主面前，獲得恩寵。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/3/#L20">德 3:20</a>)</p></blockquote><p>關於謙卑的重要引文：<a href="https://bibleox.com/ru/ru/w/смирение">謙卑</a></p><h2>上帝話語最留心的聽者</h2><blockquote><p>“<strong><mark>我兒，要將你的心歸我</mark></strong>，<strong><mark>你的眼目也要喜悅我的道路</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/23/#L26">箴 23:26</a>)</p></blockquote><blockquote><p>“<strong><mark>馬利亞卻把這一切的事存在心裏，反覆思想</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L19">路 2:19</a>)</p></blockquote><blockquote><p>“他就同他們下去，回到拿撒勒．並且順從他們。<strong><mark>他母親把這一切的事都存在心裏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L51">路 2:51</a>)</p></blockquote><blockquote><p>“耶穌正說這話的時候，衆人中間有一個女人大聲說：「懷你胎的和乳養你的有福了！」 耶穌說：「<strong><mark>是，卻還不如聽上帝之道而遵守的人有福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L27-28">路 11:27-28</a>)</p></blockquote><p>正如聖伊格納提（布良恰尼諾夫）所說，她成了上帝教導的最留心、最恆常的聽者和實行者：</p><p>“童貞女高於所有聖徒，一方面因爲她成了神人的母親，另一方面因爲<strong>她是最恆常、最留心的聽者和實行神人所宣講教導的人</strong>。”</p><p>（[俄文](https://azbyka.ru/technik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54)《正教會論上帝之母的教導》）</p><h2>成爲基督上帝的母親</h2><p>特別敬禮上帝之母的緣由之一，是她——上帝之母（按人性）：因爲再沒有別的受造物是上帝的母親。上帝的誡命要求尊敬父母（<a href="https://bibleox.com/ru/ru/w/10-заповедей#HH-5">第五誡</a>），所以基督上帝親自尊敬上帝之母爲自己的母親，他信實的門徒們也跟隨他。</p><h3>童貞女馬利亞生了上帝之子</h3><p>正是上帝的獨生子真實地由女子所生：</p><blockquote><p>“及至時候滿足，<strong><mark>上帝就差遣他的兒子</mark></strong>，<strong><mark>爲女子所生</mark></strong>，且生在律法以下，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L4">加 4:4</a>)</p></blockquote><p>上帝的獨生子、上帝的道，真實地成了肉身：</p><blockquote><p>“<strong><mark>道成了肉身，住在我們中間</mark></strong>，充充滿滿的有恩典有真理。我們也見過他的榮光，正是父獨生子的榮光。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L14">約 1:14</a>)</p></blockquote><p>天使加百列直接稱童貞女馬利亞所生的孩子爲上帝之子：</p><blockquote><p>“天使回答說：「聖靈要臨到你身上，至高者的能力要廕庇你，因此<strong><mark>所要生的聖者必稱爲上帝的兒子</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L35">路 1:35</a>)</p></blockquote><h3>童貞女馬利亞——上帝之子的母親</h3><p>義人以利沙伯——先知施洗約翰的母親——直接稱童貞女馬利亞爲上帝之母：</p><blockquote><p>“<strong><mark>我主的母</mark></strong>到我這裏來，這是從那裏得的呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L43">路 1:43</a>)</p></blockquote><blockquote><p>“進了房子，<strong><mark>看見小孩子和他母親馬利亞</mark></strong>，就俯伏拜那小孩子，揭開寶盒，拿黃金、乳香、沒藥爲禮物獻給他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L11">太 2:11</a>)</p></blockquote><blockquote><p>“<strong><mark>耶穌見母親</mark></strong>和他所愛的那門徒站在旁邊，<strong><mark>就對他母親說</mark></strong>：「母親，看你的兒子。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L26">約 19:26</a>)</p></blockquote><blockquote><p>“<strong><mark>他母親對用人說</mark></strong>：「他告訴你們什麼，你們就作什麼。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L5">約 2:5</a>)</p></blockquote><blockquote><p>“第三日，在加利利的迦拿有娶親的筵席。<strong><mark>耶穌的母親在那裏</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L1">約 2:1</a>)</p></blockquote><p>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L14">太 2:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L20">太 2:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L21">太 2:21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L46">太 12:46</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/3/#L31">可 3:31</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L33">路 2:33</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L34">路 2:34</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L43">路 2:43</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L48">路 2:48</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L51">路 2:51</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/8/#L19">路 8:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L3">約 2:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L12">約 2:12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L25">約 19:25</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L26">約 19:26</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L14">徒 1:14</a>）</p><p>如果上帝之子永遠成了人（這是確實的），那麼童貞女馬利亞就永遠是上帝之子的母親。</p><h3>上帝之子——童貞女馬利亞之子</h3><blockquote><p>“只是沒有和她同房，<strong><mark>等她生了兒子</mark></strong>〔有古卷作『等他生了頭胎的兒子』〕，就給他起名叫耶穌。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/1/#L25">太 1:25</a>)</p></blockquote><h3>童貞女馬利亞——上帝之母</h3><p>童貞女馬利亞生了耶穌基督。</p><p>耶穌基督——上帝之子——是<a href="https://bibleox.com/ru/ru/w/Христос-Бог">我們的上帝</a>。</p><p>童貞女馬利亞所生的是<a href="https://bibleox.com/ru/ru/w/Христос-Бог">我們的上帝</a>。就是說，她是生了上帝的那位——上帝之母。</p><p>童貞女馬利亞生的不是永恆的上帝本性——它存在於時間和空間之外——而是上帝之子的人性；這人性有其開始，並且從它存在之初就完全屬於上帝之子（上帝）的位格。</p><p>簡言之，童貞女馬利亞按人性生了上帝。</p><p>然而，上帝之母的偉大恰恰在於她被揀選作上帝的母親。她的功績不在於生育——生育的人很多——而在於：上帝預先知道馬利亞的品質（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L29">羅 8:29</a>），從所有存在過的人中揀選的不是別人，而正是童貞女馬利亞。</p><h2>上帝之母曾經是、並且仍是童貞女</h2><h3>耶穌基督誕生之前馬利亞的童貞</h3><p>童貞女馬利亞與義人約瑟沒有夫妻關係。她雖已許配給約瑟（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L27">路 1:27</a>），卻不明白自己沒有夫妻關係怎麼能生子：</p><blockquote><p>“馬利亞對天使說：「<strong><mark>我沒有出嫁，怎麼有這事呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L34">路 1:34</a>)</p></blockquote><p>還應注意：這個問題只有在童貞女馬利亞曾向上帝許願保守童貞的情況下才有意義。否則，即使童貞女馬利亞至今沒有與義人約瑟有過夫妻關係，當上帝的天使宣告她將生子時，她顯然應當順服上帝、與丈夫有夫妻關係，好叫預言應驗。但如果童貞女馬利亞曾向上帝許願度貞潔的生活，那就立刻產生問題：“怎麼會生子呢？因爲向上帝所起的願是不可違揹的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/30/#L3">民 30:3</a>）？”</p><p>天使回答說，向馬利亞所預言的將不經丈夫、以上帝大能的奇妙運作成就：</p><blockquote><p>“天使回答說：「<strong><mark>聖靈要臨到你身上</mark></strong>，<strong><mark>至高者的能力要廕庇你</mark></strong>，因此所要生的聖者必稱爲上帝的兒子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L35">路 1:35</a>)</p></blockquote><p>耶穌基督只是按人們的看法是約瑟的兒子：</p><blockquote><p>“耶穌開頭傳道，年紀約有三十歲。<strong><mark>依人看來，他是約瑟的兒子</mark></strong>，約瑟是希裏的兒子，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L23">路 3:23</a>)</p></blockquote><p>實際上，基督不是由約瑟所生，而是由聖靈的大能。</p><h3>耶穌基督誕生之後馬利亞的童貞</h3><p>關於馬利亞終身童貞（至今仍是童貞女）的預言：從她生的只有一個孩子——進入我們世界的上帝、基督，正如藉著童貞女馬利亞、上帝之母這門一樣：</p><blockquote><p>“他又帶我回到聖地朝東的外門；那門關閉了。 耶和華對我說：「<strong><mark>這門必須關閉，不可敞開</mark></strong>，<strong><mark>誰也不可由其中進入，因爲耶和華以色列的上帝已經由其中進入，所以必須關閉</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/44/#L1-2">結 44:1-2</a>)</p></blockquote><p>這樣，童貞女馬利亞除了耶穌基督，沒有生任何別的孩子。同時，馬利亞的童貞沒有被破壞。</p><p>還應注意：在被釘十字架的那一天，基督把自己母親的關懷託付給所愛的門徒——神學家約翰（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L26-27">約 19:26-27</a>）。這表明：除了基督——童貞女馬利亞的獨子——之外，她再沒有丈夫，也沒有別的本應照顧她的兒女。</p><p>義人約瑟在基督誕生時已經年老，所以在基督被釘時早已去世。確實，在記述耶穌基督的童年之後，經上再也沒有提到約瑟。而馬利亞被託付給約翰，是因爲正是他將比其他使徒在地上活得更久。主自己指明，使徒彼得將爲基督受難，而使徒約翰將活得久得多（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/21/#L22">約 21:22</a>）。我們知道，約翰是使徒中最年輕的，在地上勞苦直到第一世紀末，而其餘使徒都領了殉道之死。這使使徒約翰能夠比所有其他人更久地照顧童貞女馬利亞。</p><p>這一事實也表明：童貞女馬利亞沒有別的能照顧她的兒女。</p><h2>萬代都要稱上帝之母有福</h2><p>上帝之母將被稱爲有福，上帝爲她成就了大事：</p><blockquote><p>“因爲他顧念他使女的卑微，<strong><mark>從今以後，萬代要稱我有福</mark></strong>。 <strong><mark>那有權能的，爲我成就了大事</mark></strong>，他的名爲聖。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L48-49">路 1:48-49</a>)</p></blockquote><p>類似的話也說及基督自己：</p><blockquote><p>“他的名要存到永遠，要留傳如日之久。<strong><mark>人要因他蒙福，萬國要稱他有福</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/72/#L17">詩 72:17</a>)</p></blockquote><h2>基督與母親的特殊關係</h2><h3>上帝之子尊敬童貞女馬利亞爲自己的母親</h3><p>上帝之子順服律法：</p><blockquote><p>“及至時候滿足，上帝就差遣他的兒子，爲女子所生，<strong><mark>且生在律法以下</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L4">加 4:4</a>)</p></blockquote><p>上帝命令尊敬父親和母親：</p><blockquote><p>“<strong><mark>當孝敬父母</mark></strong>，使你的日子在耶和華你上帝所賜你的地上得以長久。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L12">出 20:12</a>)</p></blockquote><blockquote><p>“<strong><mark>當照耶和華你上帝所吩咐的孝敬父母</mark></strong>，使你得福。並使你的日子，在耶和華你上帝所賜你的地上得以長久。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L16">申 5:16</a>)</p></blockquote><blockquote><p>“<strong><mark>咒罵父母的，必要把他治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/21/#L17">出 21:17</a>)</p></blockquote><blockquote><p>“<strong><mark>凡咒罵父母的，總要治死他</mark></strong>；他咒罵了父母，他的罪要歸到他身上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/20/#L9">利 20:9</a>)</p></blockquote><blockquote><p>“<strong><mark>打父母的，必要把他治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/21/#L15">出 21:15</a>)</p></blockquote><blockquote><p>“誡命你是曉得的：『不可姦淫，不可殺人，不可偷盜，不可作假見證，<strong><mark>當孝敬父母</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L20">路 18:20</a>)</p></blockquote><blockquote><p>“又說：「<strong><mark>你們誠然是廢棄上帝的誡命</mark></strong>，要守自己的遺傳。 &lt;…&gt; 你們倒說：『人若對父母說：我所當奉給你的，已經作了各耳板』， <strong><mark>以後你們就不容他再奉養父母</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/7/#L9,11-12">可 7:9,11-12</a>)</p></blockquote><p>全宇宙中除童貞女馬利亞外，沒有別的受造物是上帝之子的母親。在這層關係上，天使和世人中沒有誰高於童貞女馬利亞，因爲尊敬她爲自己母親的，正是上帝之子、上帝本身。</p><h3>基督聽自己母親的話</h3><p>基督指出，宣講和奇蹟（顯明他的榮耀）的時候還沒有到；但因母親所求，他行了第一個奇蹟：</p><blockquote><p>“酒用盡了，<strong><mark>耶穌的母親對他說</mark></strong>：「他們沒有酒了。」 耶穌說：「母親，<strong><mark>我與你有什麼相幹</mark></strong>？<strong><mark>我的時候還沒有到</mark></strong>。」 <strong><mark>他母親對用人說</mark></strong>：「他告訴你們什麼，你們就作什麼。」 &lt;…&gt; 耶穌對用人說：「把缸倒滿了水。」他們就倒滿了，直到缸口。 耶穌又說：「現在可以舀出來，送給管筵席的。」他們就送了去。 &lt;…&gt; <strong><mark>這是耶穌所行的頭一件神蹟</mark></strong>，是在加利利的迦拿行的，<strong><mark>顯出他的榮耀來</mark></strong>，他的門徒就信他了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L3-5,7-8,11">約 2:3-5,7-8,11</a>)</p></blockquote><h3>基督關懷自己的母親</h3><p>在十字架上殘酷受苦的時候，基督關懷自己的母親：</p><blockquote><p>“<strong><mark>耶穌見母親</mark></strong>和他所愛的那門徒站在旁邊，<strong><mark>就對他母親說</mark></strong>：「母親，看你的兒子。」 又對那門徒說：「<strong><mark>看你的母親</mark></strong>。」<strong><mark>從此那門徒就接她到自己家裏去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L26-27">約 19:26-27</a>)</p></blockquote><h3>基督與自己母親個人關係的性質</h3><p>在最可怕的時辰——在十字架上經受極重的身體痛苦、被出賣、門徒逃散、人之常情的被棄感（第九個小時：“我的上帝！我的上帝！<strong>爲什麼離棄我</strong>？”，<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/15/#L34">可 15:34</a>）——主關懷著自己的母親，她跟隨他直到最後一刻。</p><p>在這最艱難的時刻，他轉向自己的母親，對她顯出特別的關懷，把她託付給所愛的門徒——而且不是一般的“看顧她、照顧她”，而是“接她作你的母親”：</p><blockquote><p>“耶穌見母親和他所愛的那門徒站在旁邊，<strong><mark>就對他母親說</mark></strong>：「母親，看你的兒子。」 又對那門徒說：「<strong><mark>看你的母親</mark></strong>。」<strong><mark>從此那門徒就接她到自己家裏去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L26-27">約 19:26-27</a>)</p></blockquote><p>注意：所有基督指著說“看哪，我的母親，我的弟兄”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L48-50">太 12:48-50</a>）的人，都離開了他（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L32">約 16:32</a>）；而他的母親卻同他在一起直到末了。</p><blockquote><p>“看哪！時候將到，且是已經到了，你們要分散，各歸自己的地方去，<strong><mark>留下我獨自一人</mark></strong>；<strong><mark>其實我不是獨自一人，因爲有父與我同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L32">約 16:32</a>)</p></blockquote><blockquote><p>“那差我來的，是與我同在；<strong><mark>他沒有撇下我獨自在這裏</mark></strong>，<strong><mark>因爲我常作他所喜悅的事</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L29">約 8:29</a>)</p></blockquote><p>基督沒有撇下自己的母親獨自一人，也是出於同樣的原因。</p><h3>上帝之母與基督同到底，這重要嗎？</h3><p>使徒保羅在離世前也經歷了類似的被棄：</p><blockquote><p>“<strong><mark>凡在亞西亞的人都離棄我</mark></strong>，這是你知道的，其中有腓吉路和黑摩其尼。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L15">提後 1:15</a>)</p></blockquote><blockquote><p>“因爲<strong><mark>底馬貪愛現今的世界，就離棄我</mark></strong>往帖撒羅尼迦去了，革勒士往加拉太去，提多往撻馬太去，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L10">提後 4:10</a>)</p></blockquote><p>上帝之母從起初到末了在一切事上都留心、順服、忠於上帝。她一直是、並且仍是與上帝同在的。</p><h2>對異議的回應</h2><h3>“可是聖經裏沒有‘上帝之母’這個詞”</h3><p>聖經裏也沒有“三位一體”這個詞——那又怎樣呢？聖經裏所說的，正是“上帝之母”一詞所說的：童貞女馬利亞是耶穌基督的母親；耶穌基督是上帝；童貞女馬利亞生了耶穌基督，即生了上帝——當然，按人性。由她所生的，是上帝。童貞女馬利亞——生了上帝的，簡稱：上帝之母。</p><h3>“懷你胎的和乳養你的有福了”</h3><p>人們因親緣關係、因生養和乳養基督而讚美上帝之母；但基督親自更正了這一理解（重新立定重點），指明自己母親的偉大，在於她對上帝之道的特別留心和完全謙卑的順服：</p><blockquote><p>“耶穌正說這話的時候，衆人中間有一個女人大聲說：「<strong><mark>懷你胎的和乳養你的有福了</mark></strong>！」 耶穌說：「<strong><mark>是，卻還不如聽上帝之道而遵守的人有福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L27-28">路 11:27-28</a>)</p></blockquote><blockquote><p>“<strong><mark>馬利亞卻把這一切的事存在心裏，反覆思想</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L19">路 2:19</a>)</p></blockquote><blockquote><p>“他就同他們下去，回到拿撒勒．並且順從他們。<strong><mark>他母親把這一切的事都存在心裏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L51">路 2:51</a>)</p></blockquote><h3>“誰是我的母親？”</h3><p>這裏基督又一次強調：童貞女馬利亞的偉大不像人們所想的那樣在於親緣關係，而在於她毫無條件地遵行上帝的旨意：</p><blockquote><p>“他卻回答那人說：「<strong><mark>誰是我的母親</mark></strong>？誰是我的弟兄？」 就伸手指著門徒說：「看哪，我的母親，我的弟兄。 <strong><mark>凡遵行我天父旨意的人，就是我的弟兄、姐妹和母親了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L48-50">太 12:48-50</a>)</p></blockquote><h3>“只是沒有和她同房，等她生了兒子”（太 1:25）</h3><blockquote><p>“<strong><mark>只是沒有和她同房，等她生了兒子</mark></strong>〔有古卷作『等他生了頭胎的兒子』〕，就給他起名叫耶穌。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/1/#L25">太 1:25</a>)</p></blockquote><p>“沒有和她同房，等她生了兒子”這話，並不意味著基督生下之後“就同房了”。這是聖經中常見的表達方式，並不表示後來有了改變。</p><p>例如：</p><blockquote><p>“凡我所吩咐你們的，都教訓他們遵守，<strong><mark>我就常與你們同在，直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L20">太 28:20</a>)</p></blockquote><p>——而在世界終結之後，基督顯然仍將與信他的人同在。</p><blockquote><p>“耶穌對他們說：「光在你們中間還有不多的時候，應當趁著有光行走，免得黑暗臨到你們；那在黑暗裏行走的，不知道往何處去。 <strong><mark>你們應當趁著有光，信從這光</mark></strong>，使你們成爲光明之子。」耶穌說了這話，就離開他們，隱藏了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L35-36">約 12:35-36</a>)</p></blockquote><p>——而在基督昇天之後，也應當信光（信基督）；</p><blockquote><p>“<strong><mark>因爲基督必要作王，等上帝把一切仇敵都放在他的腳下</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L25">林前 15:25</a>)</p></blockquote><p>——而在仇敵被放在腳下之後，基督顯然仍要作王（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L33">路 1:33</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L11">彼後 1:11</a>）。</p><blockquote><p>“（大衛的詩。）耶和華對我主說：「<strong><mark>你坐在我的右邊</mark></strong>，<strong><mark>等我使你仇敵作你的腳凳</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/110/#L1">詩 110:1</a>)</p></blockquote><p>——而在仇敵被放在腳下之後，基督顯然仍坐在父的右邊，即仍要作王。</p><blockquote><p>“至於你們推雅推喇其餘的人，就是一切不從那教訓，不曉得他們素常所說撒但深奧之理的人，我告訴你們，我不將別的擔子放在你們身上。 <strong><mark>但你們已經有的，總要持守，直等到我來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L24-25">啟 2:24-25</a>)</p></blockquote><p>——而在基督再來之後，顯然仍須持守美德和信仰。</p><blockquote><p>“<strong><mark>掃羅的女兒米甲，直到死日，沒有生養兒女</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/6/#L23">撒下 6:23</a>)</p></blockquote><p>——而在她死後，米甲顯然也沒有生養兒女。</p><p>還應注意聖經中的這些地方：</p><blockquote><p>“『看哪，我的僕人，我所揀選、所親愛、心裏所喜悅的，我要將我的靈賜給他，他必將公理傳給外邦。 他不爭競，不宣嚷．街上也沒有人聽見他的聲音。 <strong><mark>壓傷的蘆葦，他不折斷</mark></strong>；將殘的燈火，他不吹滅。<strong><mark>等他施行公理，叫公理得勝</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L18-20">太 12:18-20</a>)</p></blockquote><h3>“生了頭胎的兒子——就是說還有別的孩子？”</h3><p>聖經稱上帝之母的兒子爲頭胎的：</p><blockquote><p>“只是沒有和她同房，<strong><mark>等她生了兒子〔有古卷作『等他生了頭胎的兒子』〕</mark></strong>，就給他起名叫耶穌。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/1/#L25">太 1:25</a>)</p></blockquote><blockquote><p>“<strong><mark>就生了頭胎的兒子</mark></strong>，用布包起來，放在馬槽裏，因爲客店裏沒有地方。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L7">路 2:7</a>)</p></blockquote><p>（*在西奈和梵蒂岡抄本中沒有“頭胎”一詞；不過這個詞在路 2:7 中有。*）</p><p>教會教訓的反對者認爲這是指童貞女馬利亞還有別的兒女，說：“既然有頭胎的，就是說還有別的孩子。”聖經自己表明這種想法是錯誤的。</p><p>上帝自己在聖經中給“頭胎的”一詞下了定義——<strong>凡開胎的</strong>：</p><blockquote><p>“他們所有奉給耶和華的，連人帶牲畜，<strong><mark>凡頭生的都要歸給你</mark></strong>；只是人頭生的，總要贖出來；不潔淨牲畜頭生的，也要贖出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/18/#L15">民 18:15</a>)</p></blockquote><blockquote><p>“<strong><mark>凡頭生的都是我的</mark></strong>；一切牲畜頭生的，無論是牛是羊，公的都是我的。 頭生的驢要用羊羔代贖，若不代贖，就要打折牠的頸項。<strong><mark>凡頭生的兒子都要贖出來</mark></strong>。誰也不可空手朝見我。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/34/#L19-20">出 34:19-20</a>)</p></blockquote><p>一切頭胎的都屬於上帝，因此：</p><ol><li><p>人的頭胎的必須被帶到聖殿，從司祭手中贖出來。</p></li><li><p>潔淨牲畜的頭胎的被帶到聖殿獻上，被殺，作爲祭物獻給上帝。</p></li><li><p>不潔淨牲畜的頭胎的不能作祭物，所以必須贖出來。</p></li></ol><p>人及牲畜一旦生下第一個孩子，就應獻給上帝或贖出來。顯而易見，就在這一時刻，這頭生的孩子是獨生的，然而上帝稱之爲頭胎的，因爲他開了胎。這意味著：<strong>凡獨生的都是頭胎的，但並非凡頭胎的都是獨生的</strong>。</p><p>而如果像反對教會教訓的人那樣想，認爲只有那些有弟兄姊妹的才叫頭胎的，那就得出：生了第一個孩子的人應當對司祭說：“等生了第二個，這個才能叫頭胎的；現在他不是頭胎的，而是獨生的，所以我不必把他獻給上帝、不必贖他。”然而連這種荒謬的想法也違揹聖經和常識，因爲獨生的救主正是按這關於頭胎的律法被帶進聖殿的：</p><blockquote><p>“<strong><mark>按摩西律法滿了潔淨的日子</mark></strong>，<strong><mark>他們帶著孩子上耶路撒冷去，要把他獻與主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L22">路 2:22</a>)</p></blockquote><p>顯然，主耶穌基督在這裏是<strong>獨生</strong>的，但他被作爲<strong>頭胎的</strong>帶進聖殿。這樣，這裏的“頭胎的”，按上帝的話，指的是凡開胎的，並不表明母親是否還有別的生育。詳見注[2]。</p><h3>耶穌基督的弟兄們</h3><p>聖經說基督有弟兄們：</p><blockquote><p>“這不是木匠的兒子嗎？他母親不是叫馬利亞嗎？<strong><mark>他弟兄們不是叫雅各</mark></strong>、約西〔有古卷作『約瑟』〕、西門，猶大嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L55">太 13:55</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲連他的弟兄說這話，是因爲不信他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L5">約 7:5</a>)</p></blockquote><blockquote><p>“當下，<strong><mark>耶穌的母親和弟兄來</mark></strong>，站在外邊，打發人去叫他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/3/#L31">可 3:31</a>)</p></blockquote><blockquote><p>“難道我們沒有權柄娶信主的姊妹爲妻，帶著一同往來，<strong><mark>彷彿其餘的使徒和主的弟兄，並磯法一樣</mark></strong>嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/9/#L5">林前 9:5</a>)</p></blockquote><p>這裏指的是約瑟前婚的兒女，或只是親屬。弟兄們——就是一般的親屬。例如，羅得是亞伯拉罕的侄子，但在聖經裏也稱爲弟兄：</p><blockquote><p>“<strong><mark>又把亞伯蘭的姪兒羅得</mark></strong>和羅得的財物擄掠去了。當時羅得正住在所多瑪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/14/#L12">創 14:12</a>)</p></blockquote><blockquote><p>“亞伯蘭就對羅得說：「你我不可相爭，你的牧人和我的牧人也不可相爭，<strong><mark>因爲我們是骨肉</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/13/#L8">創 13:8</a>)</p></blockquote><p>約瑟在馬利亞被許配給他作保護者時已經年老，因爲馬利亞不能沒有丈夫。如果基督由馬利亞所生、而她沒有已知的丈夫，那麼按律法她應當被石頭打死（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/22/#L20-21">申 22:20-21</a>），因爲所有的人都會以爲她行了淫亂（婚外）之事。所以主這樣安排：馬利亞有丈夫，但她以奇妙的方式、不由丈夫、由聖靈的感孕而懷孕（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/1/#L18-25">太 1:18-25</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L34-35">路 1:34-35</a>）。</p><p>在耶穌的童年之後，經上再也沒有提到約瑟；而童貞女馬利亞陪伴耶穌基督直到末了——直到十字架的苦難（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L25-26">約 19:25-26</a>），並且在復活之後、五旬節那天也被提到（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L14">徒 1:14</a>）。</p><p>基督把自己的母親託付給所愛的門徒——約翰（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L27">約 19:27</a>）。顯然，那時約瑟已經去世。</p><p>這樣，耶穌基督的“弟兄們”——只是一般的親屬，而完全不是童貞女馬利亞的別的兒女。</p><p>而預言清楚地說明，從童貞女馬利亞所生的只有主耶穌基督：</p><blockquote><p>“他又帶我回到聖地朝東的外門；那門關閉了。 耶和華對我說：「<strong><mark>這門必須關閉，不可敞開</mark></strong>，<strong><mark>誰也不可由其中進入，因爲耶和華以色列的上帝已經由其中進入，所以必須關閉</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/44/#L1-2">結 44:1-2</a>)</p></blockquote><h3>任何地方都沒有說童貞女馬利亞不信基督</h3><p>教會的批評者常常重複這樣的想法：彷彿童貞女馬利亞不信她的兒子是救主、是所應許的彌賽亞、是基督。但這不是真的。聖經裏沒有這樣的話。說的只是弟兄們（約瑟前婚的兒女）不信基督：</p><blockquote><p>“<strong><mark>因爲連他的弟兄說這話，是因爲不信他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L5">約 7:5</a>)</p></blockquote><p>這是相當可以預料的：他們是約瑟前婚的兒子，已經是成年人，見過少年耶穌長大。所以他們和基督的其他同鄉（加利利居民）一樣，難以相信（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L54-58">太 13:54-58</a>）。但後來弟兄們也信了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L14">徒 1:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L19">加 1:19</a>）。</p><h3>王的母親——王后</h3><p>批評者責備教會稱上帝之母爲王后。但王的母親正是王后。</p><blockquote><p>“<strong>列王的公主都成羣結隊前來歡迎你，王后佩帶敖非爾金飾，在你右邊侍立。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/ps/45/#L10">詩 45:10</a>) <em>(俄文本編號爲 Пс 44:10（聖詠編號相差一）。)</em></p></blockquote><p>使徒們曾被拒絕坐在基督國裏他的右邊和左邊：</p><blockquote><p>“<strong><mark>只是坐在我的左右</mark></strong>，不是我可以賜的，<strong><mark>乃是爲誰預備的，就賜給誰</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L40">可 10:40</a>)</p></blockquote><p>如果不是使徒們“坐”在那裏，那是誰？在正教的“最後審判”聖像中，寫在基督旁邊的正是上帝之母（在右邊）和先知施洗約翰（在左邊）——作爲婦人所生中最大的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L11">太 11:11</a>）。</p><h3>“上帝之母，拯救我們”這句話</h3><p>這裏需要正確理解意義。救主只有一位，而在拯救的事業中有許多同工者：</p><blockquote><p>“<strong><mark>因爲我們是與上帝同工的</mark></strong>；你們是上帝所耕種的田地，所建造的房屋。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L9">林前 3:9</a>)</p></blockquote><p>使徒打算拯救人：</p><blockquote><p>“向軟弱的人，我就作軟弱的人，爲要得軟弱的人；<strong><mark>向什麼樣的人，我就作什麼樣的人</mark></strong>。<strong><mark>無論如何總要救些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/9/#L22">林前 9:22</a>)</p></blockquote><blockquote><p>“<strong><mark>或者可以激動我骨肉之親發憤</mark></strong>，<strong><mark>好救他們一些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/11/#L14">羅 11:14</a>)</p></blockquote><p>妻子可以救丈夫，丈夫可以救妻子：</p><blockquote><p>“<strong><mark>你這作妻子的，怎麼知道不能救你的丈夫呢</mark></strong>？<strong><mark>你這作丈夫的，怎麼知道不能救你的妻子呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L16">林前 7:16</a>)</p></blockquote><p>使徒呼召拯救人：</p><blockquote><p>“有些人存疑心，你們要憐憫他們； <strong><mark>有些人你們要從火中搶出來</mark></strong>、<strong><mark>搭救他們</mark></strong>；有些人你們要存懼怕的心憐憫他們；連那被情慾沾染的衣服也當厭惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L22-23">猶 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>你要謹慎自己和自己的教訓</mark></strong>，要在這些事上恆心。因爲這樣行，<strong><mark>又能救自己，又能救聽你的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L16">提前 4:16</a>)</p></blockquote><h3>“上帝之母的僕人”這句話</h3><p>這與拯救的情形相同。必須正確理解意義。</p><p>我們不把上帝之母當作上帝來事奉，但我們事奉她。如果上帝之母求我們什麼事，我們會樂意爲她效勞。難道可以想像基督徒會作別樣的事嗎？</p><p>聖經裏有義人不但稱自己爲上帝的僕人——同時仍是獨一上帝的僕人——也稱自己爲人的僕人的地方。</p><p>使徒們——是基督徒們的僕人：</p><blockquote><p>“我們原不是傳自己，乃是傳基督耶穌爲主，<strong><mark>並且自己因耶穌作你們的僕人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/4/#L5">林後 4:5</a>)</p></blockquote><p>亞比該——敬畏上帝的人、庇護先知脫逃逼迫的人——稱自己爲先知以利亞的僕人，稱以利亞爲主人：</p><blockquote><p>“亞哈將他的家宰俄巴底召了來。俄巴底甚是敬畏耶和華。 耶洗別殺耶和華衆先知的時候，俄巴底將一百個先知藏了，每五十人藏在一個洞裏，拿餅和水供養他們。 &lt;…&gt; 俄巴底在路上恰與以利亞相遇，<strong><mark>俄巴底認出他來，就俯伏在地</mark></strong>，說：「<strong><mark>你是我主以利亞不是</mark></strong>？」 回答說：「是，你去告訴你主人說：『以利亞在這裏。』」 俄巴底說：「僕人有什麼罪，你竟要將我交在亞哈手裏，使他殺我呢？ &lt;…&gt; 恐怕我一離開你，耶和華的靈就提你到我所不知道的地方去。這樣，我去告訴亞哈，他若找不著你，就必殺我。<strong><mark>僕人卻是自幼敬畏耶和華的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/18/#L3-4,7-9,12">王上 18:3-4,7-9,12</a>)</p></blockquote><h3>上帝之母在安葬之後復活了</h3><p>敬禮上帝之母的人的反對者，反對正教會關於主耶穌基督使自己的母親復活的聖傳，彷彿這是不可能的，以爲只有基督復活了。然而從聖經的角度，這沒有任何困難：因爲基督復活之後，許多聖徒復活了（無論我們怎樣理解這復活的性質）：</p><blockquote><p>“忽然，殿裏的幔子從上到下裂爲兩半，地也震動，磐石也崩裂， <strong><mark>墳墓也開了</mark></strong>，<strong><mark>已睡聖徒的身體，多有起來的</mark></strong>。 <strong><mark>到耶穌復活以後，他們從墳墓裏出來</mark></strong>，<strong><mark>進了聖城，向許多人顯現</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L51-53">太 27:51-53</a>)</p></blockquote><p>如果主在自己的復活中使許多聖徒復活，那他更能使自己的親生母親復活——他爲道成肉身而揀選了她，行奇蹟時聽了她，並關懷她、把她託付給所愛的門徒。</p><p>爲證實上帝之母復活的聖傳，還應注意：既然教會從最古老的年代起就以這樣的敬畏對待聖人的聖髑（詳見<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">敬禮聖髑的引文</a>），那麼教會沒有上帝之母的聖髑，正如沒有主耶穌基督的聖髑（因爲他復活了）。</p>
