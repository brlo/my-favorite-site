  path: QR10T_世人皆有罪
  title: 世人皆有罪
  copy_cover: true
  body: <p><strong>原罪</strong>——</p><ol><li><p>亞當和夏娃的祖傳之罪。</p></li><li><p>人性所受的損傷；這損傷如今使人趨向罪惡的思想、言語和行爲（做壞事是樂於去做的，而行善卻需要意志的努力）。這狀態在出生時傳給後代：傳給所有的人，惟獨主耶穌基督除外。</p></li></ol><h2>所有的人都從受孕之初就從始祖（亞當和夏娃）承受了罪性</h2><blockquote><p>“<strong><mark>誰能使潔淨之物出於污穢之中呢</mark></strong>？<strong><mark>無論誰也不能</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/14/#L4">伯 14:4</a>)</p></blockquote><blockquote><p>“這卻怎麼樣呢？我們比他們強嗎？決不是的！因我們已經證明：猶太人和希利尼人<strong><mark>都在罪惡之下</mark></strong>。 就如經上所記：『<strong><mark>沒有義人，連一個也沒有</mark></strong>！ 沒有明白的，沒有尋求上帝的； 都是偏離正路，一同變爲無用。沒有行善的，連一個也沒有。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L9-12">羅 3:9-12</a>)</p></blockquote><blockquote><p>“因爲<strong><mark>世人都犯了罪</mark></strong>，虧缺了上帝的榮耀；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L23">羅 3:23</a>)</p></blockquote><blockquote><p>“這就如<strong><mark>罪是從一人入了世界</mark></strong>，死又是從罪來的，於是<strong><mark>死就臨到衆人，因爲衆人都犯了罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L12">羅 5:12</a>)</p></blockquote><blockquote><p>“<strong><mark>因一人的悖逆，衆人成爲罪人</mark></strong>；照樣，因一人的順從，衆人也成爲義了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L19">羅 5:19</a>)</p></blockquote><blockquote><p>“我們原曉得律法是屬乎靈的，<strong><mark>但我是屬乎肉體的，是已經賣給罪了</mark></strong>。 &lt;…&gt; 因爲按著我裏面的意思，我是喜歡上帝的律； 但我覺得<strong><mark>肢體中另有個律和我心中的律交戰</mark></strong>，把我擄去，<strong><mark>叫我附從那肢體中犯罪的律</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L14,22-23">羅 7:14,22-23</a>)</p></blockquote><blockquote><p>“我們從前也<strong>都</strong>在他們中間，放縱肉體的私慾，隨著肉體和心中所喜好的去行，<strong><mark>本爲可怒之子</mark></strong>，和別人一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L3">弗 2:3</a>)</p></blockquote><blockquote><p>“我是在罪孽裏生的，<strong><mark>在我母親懷胎的時候就有了罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/51/#L5">詩 51:5</a>)</p></blockquote><blockquote><p>“<strong><mark>人心比萬物都詭詐</mark></strong>，壞到極處，誰能識透呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/17/#L9">耶 17:9</a>)</p></blockquote><h2>長大成人後，所有人都又獲得了自己自身的罪性</h2><blockquote><p>“時常行善而<strong><mark>不犯罪</mark></strong>的<strong><mark>義人</mark></strong>，世上實在沒有。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/7/#L20">傳 7:20</a>)</p></blockquote><blockquote><p>“受生的人中，沒有一人未曾行不義；承認你的人中，也沒有一人未曾犯罪。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/8/#L35">厄四 8:35</a>, )</p></blockquote><blockquote><p>“<strong><mark>我們若說自己無罪，便是自欺</mark></strong>，真理不在我們心裏了；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L8">約壹 1:8</a>)</p></blockquote><blockquote><p>“你的民若得罪你（<strong><mark>世上沒有不犯罪的人</mark></strong>），你向他們發怒，將他們交給仇敵擄到或遠或近之地；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/6/#L36">代下 6:36</a>)</p></blockquote><blockquote><p>“斷乎不能！不如說，上帝是真實的，<strong><mark>人都是虛謊的</mark></strong>。如經上所記：『你責備人的時候，顯爲公義；被人議論的時候，可以得勝。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L4">羅 3:4</a>)</p></blockquote><blockquote><p>“就如經上所記：『<strong><mark>沒有義人，連一個也沒有</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L10">羅 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>但聖經把衆人都圈在罪裏</mark></strong>，使所應許的福因信耶穌基督歸給那信的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L22">加 3:22</a>)</p></blockquote><h2>上帝呼召人悔改和歸正</h2><blockquote><p>“世人蒙昧無知的時候，上帝並不監察，<strong><mark>如今卻吩咐各處的人都要悔改</mark></strong>。 因爲他已經定了日子，要藉着他所設立的人按公義審判天下，並且叫他從死裏復活，給萬人作可信的憑據。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L30-31">徒 17:30-31</a>)</p></blockquote><blockquote><p>“彼得說：「<strong><mark>你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦</mark></strong>，就必領受所賜的聖靈；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38">徒 2:38</a>)</p></blockquote><blockquote><p>“<strong><mark>信而受洗的，必然得救</mark></strong>；<strong><mark>不信的，必被定罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L16">可 16:16</a>)</p></blockquote><p>上帝呼召人經由他於2000年前所建立的<a href="https://bibleox.com/ru/ru/w/Церковь"><strong>東正教會</strong></a>而得救，人經由<a href="https://bibleox.com/ru/ru/w/крещение"><strong>洗禮</strong></a>進入教會。</p>
