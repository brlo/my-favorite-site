  title: 醫治
  copy_cover: true
  body: <h2>藉聖髑（遺骸）</h2><blockquote><p>“有人正葬死人，忽然看見一羣人，就把死人拋在以利沙的墳墓裏，一碰著<strong><mark>以利沙的骸骨</mark></strong>，死人就復活站起來了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h2>藉水</h2><blockquote><p>“因爲有天使按時下池子<strong><mark>攪動那水</mark></strong>，水動之後，誰先下去，無論害什麼病就痊瘉了” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L4">約 5:4</a>)</p></blockquote><h2>藉衣物</h2><blockquote><p>“甚至有人從保羅身上拿<strong><mark>手巾或圍裙</mark></strong>放在病人身上，病就退了，惡鬼也出去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L12">徒 19:12</a>)</p></blockquote><h2>借使徒的影子</h2><blockquote><p>“甚至有人<strong><mark>將病人抬到街上</mark></strong>，放在牀上或褥子上，<strong><mark>指望彼得過來的時候，或者得他的影兒照在什麼人身上</mark></strong>。 還有許多人帶著病人和被污鬼纏磨的，從耶路撒冷四圍的城邑來，<strong><mark>全都得了醫治</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h2>直接，以上帝的話語</h2><blockquote><p>“我也自以爲不配去見你，<strong><mark>只要你說一句話，我的僕人就必好了</mark></strong>。 &lt;…&gt; 那托來的人回到百夫長家裏，看見僕人已經好了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/7/#L7,10">路 7:7,10</a>)</p></blockquote><h2>恩典借物件運行</h2><blockquote><p>“你舉手向海伸<strong><mark>杖</mark></strong>，把水分開，以色列人要下海中走乾地。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/14/#L16">出 14:16</a>)</p></blockquote>
