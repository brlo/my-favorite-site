  path: QV5T_感恩
  title: 感恩
  copy_cover: true
  body: <blockquote><p>“要常常喜樂， 不住的禱告， <strong><mark>凡事謝恩，因爲這是上帝在基督耶穌裏向你們所定的旨意</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L16-18">帖前 5:16-18</a>)</p></blockquote><blockquote><p>“叫你們凡事富足，可以多多施捨，<strong><mark>就藉着我們使感謝歸於上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/9/#L11">林後 9:11</a>)</p></blockquote><blockquote><p>“因爲辦這供給的事，不但補聖徒的缺乏，<strong><mark>而且叫許多人越發感謝上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/9/#L12">林後 9:12</a>)</p></blockquote><blockquote><p>“在他裏面生根建造，信心堅固，正如你們所領的教訓，<strong><mark>感謝的心也更增長了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L7">西 2:7</a>)</p></blockquote><blockquote><p>“無論作什麼，或說話，或行事，都要奉主耶穌的名，<strong><mark>藉着他感謝父上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L17">西 3:17</a>)</p></blockquote><blockquote><p>“應當一無掛慮，<strong><mark>只要凡事藉着禱告、祈求和感謝，將你們所要的告訴上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/4/#L6">腓 4:6</a>)</p></blockquote><blockquote><p>“淫詞、妄語和戲笑的話都不相宜，<strong><mark>總要說感謝的話</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L4">弗 5:4</a>)</p></blockquote><blockquote><p>“<strong><mark>你們要恆切禱告，在此儆醒感恩</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/4/#L2">西 4:2</a>)</p></blockquote><blockquote><p>“因爲他們雖然知道上帝，卻不當作上帝榮耀他，<strong><mark>也不感謝他。他們的思念變爲虛妄，無知的心就昏暗了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L21">羅 1:21</a>)</p></blockquote><blockquote><p>“因爲那時人要專顧自己、貪愛錢財、自誇、狂傲、謗讟、違背父母、<strong><mark>忘恩負義</mark></strong>、心不聖潔、” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L2">提後 3:2</a>)</p></blockquote><p>感恩意味著以自己現在所有的美善爲滿足：</p><blockquote><p>“然而，<strong><mark>敬虔加上知足的心便是大利了</mark></strong>， &lt;…&gt; <strong><mark>只要有衣有食，就當知足</mark></strong>。 <strong><mark>但那些想要發財的人，就陷在迷惑</mark></strong>、落在網羅和許多無知有害的私慾裏，叫人沉在敗壞和滅亡中。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L6,8-9">提前 6:6,8-9</a>)</p></blockquote><blockquote><p>“我並不是因缺乏說這話，<strong><mark>我無論在什麼景況都可以知足</mark></strong>，這是我已經學會了。 <strong><mark>我知道怎樣處卑賤，也知道怎樣處豐富</mark></strong>，或飽足、或飢餓、或有餘、或缺乏，隨事隨在，我都得了祕訣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/4/#L11-12">腓 4:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>這些人是私下議論、常發怨言的</mark></strong>，隨從自己的情欲而行，口中說誇大的話，爲得便宜諂媚人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L16">猶 1:16</a>)</p></blockquote>
