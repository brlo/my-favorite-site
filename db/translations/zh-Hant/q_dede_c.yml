- src: Незлобие-милосердие-прощение
  path: QV6T_不懷惡意
  title: 不懷惡意（憐憫、饒恕）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>親愛的弟兄，不要自己伸冤</mark></strong>，<strong><mark>寧可讓步，聽憑主怒</mark></strong>。因爲經上記著：「主說：『伸冤在我，我必報應。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L19">羅 12:19</a>)</p></blockquote><blockquote><p>“<strong><mark>你不要說</mark></strong>：「<strong><mark>我要以惡報惡</mark></strong>；」<strong><mark>要等候耶和華，他必拯救你</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/20/#L22">箴 20:22</a>)</p></blockquote>
