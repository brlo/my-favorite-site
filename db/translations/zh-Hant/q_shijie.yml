  title: 有趣的動物
  copy_cover: true
  body: <p>會飛的蛇，下蛋：</p><blockquote><p>“論南方牲畜的默示：他們把財物馱在驢駒的脊背上，將寶物馱在駱駝的肉鞍上，經過艱難困苦之地，就是公獅、母獅、蝮蛇、<strong><mark>火焰的飛龍</mark></strong>之地，往那不利於他們的民那裏去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/30/#L6">賽 30:6</a>)</p></blockquote><blockquote><p>“<strong><mark>箭蛇要在那裏作窩、下蛋、菢蛋、生子，聚子在其影下</mark></strong>；鷂鷹各與伴偶聚集在那裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/34/#L15">賽 34:15</a>)</p></blockquote><blockquote><p>“非利士全地啊，不要因擊打你的杖折斷就喜樂。因爲<strong><mark>從蛇的根必生出毒蛇．牠所生的，是火焰的飛龍</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/14/#L29">賽 14:29</a>)</p></blockquote><p>在水裏有羽毛的動物：</p><blockquote><p>“水中可吃的乃是這些：<strong><mark>凡有翅有鱗的都可以吃</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/14/#L9">申 14:9</a>)</p></blockquote><p>有翅膀的爬蟲：</p><blockquote><p>“<strong><mark>凡有翅膀爬行的物，是與你們不潔淨，都不可吃</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/14/#L19">申 14:19</a>)</p></blockquote><p>河馬——按描述類似恐龍：</p><blockquote><p>“<strong><mark>你且觀看河馬</mark></strong>。我造你也造他，他吃草與牛一樣。 牠的氣力在腰間，能力在肚腹的筋上。 <strong><mark>牠搖動尾巴如香柏樹</mark></strong>，牠大腿的筋互相聯絡。 牠的骨頭好像銅管，牠的肢體彷彿鐵棍。 他在上帝所造的物中爲首，創造他的給他刀劍。 &lt;…&gt; 蓮葉的陰涼遮蔽他；溪旁的柳樹環繞牠。 河水氾濫，牠不發戰，就是約但河的水漲到他口邊，也是安然。 在牠防備的時候，誰能捉拿牠？誰能牢籠牠、穿牠的鼻子呢？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/40/#L15-19,22-24">伯 40:15-19,22-24</a>)</p></blockquote><p>利維坦——按描述類似恐龍：</p><blockquote><p>“<strong><mark>你能用魚鉤釣上鱷魚嗎</mark></strong>？能用繩子壓下牠的舌頭嗎？ 你能用繩索穿牠的鼻子嗎？能用鉤穿牠的腮骨嗎？ 牠豈向你連連懇求，說柔和的話嗎？ 豈肯與你立約，使你拿他永遠作奴僕嗎？ 你豈可拿他當雀鳥玩耍嗎？豈可爲你的幼女將他拴住嗎？ 搭夥的漁夫，豈可拿他當貨物嗎？能把他分給商人嗎？ <strong><mark>你能用倒鉤槍扎滿牠的皮，能用魚叉叉滿牠的頭嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/41/#L1-7">伯 41:1-7</a>) <em>(和合本作「鱷魚」，七十士譯本作「利維坦」（海中巨獸）。)</em></p></blockquote><blockquote><p>“<strong><mark>人指望捉拿牠是徒然的；一見牠，豈不喪膽嗎</mark></strong>？ 沒有那麼兇猛的人敢惹牠．這樣，誰能在我面前站立得住呢？ 誰先給我什麼，使我償還呢？天下萬物都是我的。 <strong><mark>論到鱷魚的肢體和其大力，並美好的骨格，我不能緘默不言</mark></strong>。 <strong><mark>誰能剝牠的外衣</mark></strong>？<strong><mark>誰能進牠上下牙骨之間呢</mark></strong>？ <strong><mark>誰能開牠的腮頰？牠牙齒四圍是可畏的</mark></strong>。 <strong><mark>牠以堅固的鱗甲爲可誇</mark></strong>，<strong><mark>緊緊合閉，封得嚴密</mark></strong>。 <strong><mark>這鱗甲一一相連，甚至氣不得透入其間</mark></strong>， <strong><mark>都是互相聯絡、膠結，不能分離</mark></strong>。 <strong><mark>牠打噴嚏，就發出光來</mark></strong>；<strong><mark>牠眼睛好像早晨的光線</mark></strong>。 <strong><mark>從牠口中發出燒著的火把，與飛迸的火星</mark></strong>； <strong><mark>從牠鼻孔冒出煙來</mark></strong>，如燒開的鍋和點著的蘆葦。 <strong><mark>牠的氣點著煤炭，有火焰從他口中發出</mark></strong>。 <strong><mark>牠頸項中存著勁力，在牠面前的都恐嚇蹦跳</mark></strong>。 牠的肉塊互相聯絡，緊貼其身，不能搖動。 <strong><mark>牠的心結實如石頭，如下磨石那樣結實</mark></strong>。 <strong><mark>牠一起來，勇士都驚恐</mark></strong>．心裏慌亂，便都昏迷。 <strong><mark>人若用刀，用槍，用標槍，用尖槍扎牠，都是無用</mark></strong>。 <strong><mark>牠以鐵爲乾草，以銅爲爛木</mark></strong>。 箭不能恐嚇牠使牠逃避；<strong><mark>彈石在牠看爲碎秸</mark></strong>， <strong><mark>棍棒算爲禾稭；牠嗤笑短槍颼的響聲</mark></strong>。 牠肚腹下如尖瓦片，牠如釘耙經過淤泥。 <strong><mark>牠使深淵開滾如鍋，使洋海如鍋中的膏油</mark></strong>。 <strong><mark>牠行的路隨後發光，令人想深淵如同白髮</mark></strong>。 <strong><mark>在地上沒有像他造的那樣，無所懼怕</mark></strong>。 <strong><mark>凡高大的，牠無不藐視</mark></strong>；<strong><mark>牠在驕傲的水族上作王</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/41/#L9-34">伯 41:9-34</a>) <em>(本段俄文本編號爲 Иов 41:1,4-26（編號相差八節）。)</em></p></blockquote>
