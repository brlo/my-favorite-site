  title: 施捨
  copy_cover: true
  body: <h2>施捨、憐貧、慷慨</h2><blockquote><p>“在耶和華你上帝所賜你的地上，無論那一座城裏，<strong><mark>你弟兄中若有一個窮人</mark></strong>，你<strong><mark>不可忍著心、揝著手</mark></strong>，不幫補你窮乏的弟兄； <strong><mark>總要向他鬆開手</mark></strong>，照他所缺乏的借給他，補他的不足。 你要謹慎，不可心裏起惡念說：『第七年的豁免年快到了』，<strong><mark>你便惡眼看你窮乏的弟兄</mark></strong>，什麼都不給他，以致他因你求告耶和華，罪便歸於你了。 你總要給他，給他的時候，<strong><mark>心裏不可愁煩</mark></strong>，因耶和華你的上帝必在你這一切所行的，並你手裏所辦的事上，賜福與你。 原來<strong><mark>那地上的窮人永不斷絕</mark></strong>，所以我吩咐你說：『<strong><mark>總要向你地上困苦窮乏的弟兄鬆開手</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/15/#L7-11">申 15:7-11</a>)</p></blockquote><blockquote><p>“<strong><mark>你手若有行善的力量，不可推辭</mark></strong>，就當向那應得的人施行。 你那裏若有現成的，<strong><mark>不可對鄰舍說</mark></strong>：「去吧！明天再來，我必給你。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/3/#L27-28">箴 3:27-28</a>)</p></blockquote><blockquote><p>“<strong>應向窮人伸手施惠</strong>，好使你的祝福和憐憫，完備無缺。<strong>對一切活人，要施與恩惠；對於死者，不要禁止哀悼</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/7/#L36-37">德 7:36-37</a>) <em>(俄文本爲 Сир 7:35-36。)</em></p></blockquote><blockquote><p>“祈禱與齋戒固然是善功，但<strong>秉義施捨卻超過前二者</strong>；秉義而少有，勝於不義而多有；施捨救濟，勝於儲蓄黃金，因爲<strong>施捨救人脫免死亡，且滌除一切罪惡</strong>。施捨行義的人必享高壽；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/tov/12/#L8-9">多 12:8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>只要把裏面的施捨給人，凡物於你們就都潔淨了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L41">路 11:41</a>)</p></blockquote><blockquote><p>“<strong><mark>憐恤人的人有福了</mark></strong>，<strong><mark>因爲他們必蒙憐恤</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L7">太 5:7</a>)</p></blockquote>
