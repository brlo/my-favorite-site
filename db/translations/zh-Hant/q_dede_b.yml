- src: Единомыслие
  path: QV4T_同心
  title: 同心
  copy_cover: true
  body: <h2>智慧以弟兄間的同心與和睦爲妝飾</h2><blockquote><p>“智慧要稱揚自己，因天主而受光榮，在她的民族中，要取得榮耀；在至高者的集會中，要開啟自己的口；在他的軍旅前，要誇耀自己；在他的百姓中，要受舉揚；在聖民間，要受景仰；……” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/24/#L1-3">德 24:1-3</a>)</p></blockquote><blockquote><p>“<strong>有三件事，我心中喜樂</strong>，這三件事也是上主與世人喜愛的，就是：<strong>兄弟和睦</strong>，<strong>鄰人友愛</strong>，<strong>夫婦同心</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/25/#L1-2">德 25:1-2</a>) <em>(俄文本爲 Сир 24:1-3；Сир 25:1-2。)</em></p></blockquote><h2>爲教會得合一與同心而作的祈禱</h2><blockquote><p>“<strong><mark>使他們都合而爲一</mark></strong>；正如你父在我裏面，我在你裏面，使他們也在我們裏面，叫世人可以信你差了我來。 你所賜給我的榮耀，我已賜給他們，<strong><mark>使他們合而爲一，像我們合而爲一</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L21-22">約 17:21-22</a>)</p></blockquote><blockquote><p>“但願賜忍耐、安慰的上帝，<strong><mark>叫你們彼此同心</mark></strong>，效法基督耶穌，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/15/#L5">羅 15:5</a>)</p></blockquote><h2>同心合意的誡命</h2><p>上帝的恩賜不是違揹人的意願強加給人的。比如，愛是上帝的恩賜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L7-8">約壹 4:7-8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L22-23">加 5:22-23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L5">羅 5:5</a>），然而它並不強加於人，來了之後，也不會違揹人的意願留在他裏面。每個人都應當努力獲得愛（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L1-2,13">林前 13:1-2,13</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L14">西 3:14</a>），並使自己的意志趨向愛的行爲（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/13/#L34">約 13:34</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L12">約 15:12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L17">約 15:17</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L22">彼前 1:22</a>），而上帝則回應這些努力，賜下並保守這恩賜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/21/#L31">箴 21:31</a>）。</p><p>同心也是從上帝來的，因爲基督和使徒們都曾爲此向上帝祈禱（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L21-22">約 17:21-22</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/15/#L5">羅 15:5</a>）。雖然愛與同心的恩賜已由聖靈賜給教會，但教會中的每個人都應當以努力去獲得並保守這一恩賜。每個信徒都可能單獨地犯罪得罪愛，也得罪同心。因此，每個人都蒙召持守愛與同心：</p><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，不要志氣高大，倒要俯就卑微的人。不要自以爲聰明。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L16">羅 12:16</a>)</p></blockquote><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，勸你們<strong><mark>都說一樣的話</mark></strong>。你們中間也不可分黨，<strong><mark>只要一心一意</mark></strong>，彼此相合。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>)</p></blockquote><blockquote><p>“還有末了的話：願弟兄們都喜樂！要作完全人，要受安慰，<strong><mark>要同心合意，要彼此和睦</mark></strong>。如此，仁愛和平的上帝必常與你們同在。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/13/#L11">林後 13:11</a>)</p></blockquote><blockquote><p>“<strong><mark>你們就要意念相同，愛心相同，有一樣的心思，有一樣的意念</mark></strong>，使我的喜樂可以滿足。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L2">腓 2:2</a>)</p></blockquote><blockquote><p>“總而言之，<strong><mark>你們都要同心，彼此體恤，相愛如弟兄</mark></strong>，存慈憐謙卑的心；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L8">彼前 3:8</a>)</p></blockquote><h2>批評</h2><h3>在你們中間不免有分門結黨的事</h3><blockquote><p>“<strong><mark>在你們中間不免有分門結黨的事，好叫那些有經驗的人顯明出來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L19">林前 11:19</a>)</p></blockquote><p>原文這裏用的不是「分門結黨」而是「異端」（希臘文 αἱρέσεις），也就是說，在你們中間免不了有異端。這只是關於異端產生的預言。按使徒的話，繁殖異端的人不能承受上帝的國：</p><blockquote><p>“情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote>
