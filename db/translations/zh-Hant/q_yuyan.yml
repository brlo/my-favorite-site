  path: QY1A_基督第二次降臨
  title: 基督的第二次降臨
  copy_cover: true
  body: <h2>基督第二次降臨之前的事件</h2><h3>敵基督在地上短暫的統治</h3><blockquote><p>“弟兄們，論到我們主耶穌基督降臨和我們到他那裏聚集， 我勸你們：無論有靈、有言語、有冒我名的書信，說主的日子現在到了，不要輕易動心，也不要驚慌。 人不拘用什麼法子，你們總不要被他誘惑！因爲<strong><mark>那日子以前，必有離道反教的事</mark></strong>，<strong><mark>並有那大罪人，就是沉淪之子，顯露出來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L1-3">帖後 2:1-3</a>)</p></blockquote><p>詳情見註釋[2]。</p><h2>主耶穌基督第二次降臨時的事件</h2><h3>天上要出現十字架</h3><blockquote><p>“<strong><mark>那時，人子的兆頭要顯在天上</mark></strong>，<strong><mark>地上的萬族都要哀哭</mark></strong>。他們要看見人子有能力，有大榮耀，<strong><mark>駕著天上的雲降臨</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L30">太 24:30</a>)</p></blockquote><h3>基督要與所有聖潔的天使一同來臨</h3><p>基督的第二次降臨將帶著父的榮耀，與所有聖潔的天使一同來臨：</p><blockquote><p>“當人子在他榮耀裏，<strong><mark>同著衆天使降臨的時候</mark></strong>，要坐在他榮耀的寶座上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31">太 25:31</a>)</p></blockquote><blockquote><p>“凡在這淫亂罪惡的世代，把我和我的道當作可恥的，人子在他父的榮耀裏，<strong><mark>同聖天使降臨的時候</mark></strong>，也要把那人當作可恥的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/8/#L38">可 8:38</a>)</p></blockquote><blockquote><p>“人子要在他父的榮耀裏，<strong><mark>同著衆使者降臨</mark></strong>；那時候，他要照各人的行爲報應各人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“亞當的七世孫以諾曾預言這些人說：『看哪，<strong><mark>主帶著他的千萬聖者降臨</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L14">猶 1:14</a>)</p></blockquote><blockquote><p>“好使你們<strong><mark>當我們主耶穌同他衆聖徒來的時候</mark></strong>，在我們父上帝面前心裏堅固，成爲聖潔，無可責備。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/3/#L13">帖前 3:13</a>)</p></blockquote><blockquote><p>“也必使你們這受患難的人與我們同得平安。那時，<strong><mark>主耶穌同他有能力的天使從天上在火焰中顯現</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L7">帖後 1:7</a>)</p></blockquote><blockquote><p>“你們要從我山的谷中逃跑，因爲山谷必延到亞薩。你們逃跑，必如猶大王烏西雅年間的人逃避大地震一樣。<strong><mark>耶和華我的上帝必降臨，有一切聖者同來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/14/#L5">亞 14:5</a>)</p></blockquote><h3>他將施行死人的普遍復活</h3><p>所有曾經活過的人——義人和不義的人——的普遍復活：</p><blockquote><p>“並且靠著上帝，盼望死人，<strong><mark>無論善惡，都要復活</mark></strong>，就是他們自己也有這個盼望。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/24/#L15">徒 24:15</a>)</p></blockquote><p>復活將在改變後的不朽身體中發生，義人要發光如同太陽：</p><blockquote><p>“<strong><mark>那時，義人在他們父的國裏，要發出光來，像太陽一樣</mark></strong>。有耳可聽的，就應當聽！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L43">太 13:43</a>)</p></blockquote><p>在第二次降臨之前死去的人，其靈魂停留在等候復活的居所。義人的靈魂與基督在天上一同喜樂（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-23">希 12:22-23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>），而罪人的靈魂則在另一處受苦（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/16/#L23">路 16:23</a>）。</p><p>那些到基督第二次降臨的時刻還沒有經歷死亡的人，他們的身體也將像從死裏復活之人的身體一樣改變：</p><blockquote><p>“<strong><mark>死人復活也是這樣：所種的是必朽壞的，復活的是不朽壞的</mark></strong>； &lt;…&gt; <strong><mark>所種的是血氣的身體，復活的是靈性的身體</mark></strong>。若有血氣的身體，也必有靈性的身體。 &lt;…&gt; 我如今把一件奧祕的事告訴你們：<strong><mark>我們不是都要睡覺，乃是都要改變</mark></strong>， <strong><mark>就在一霎時，眨眼之間，號筒末次吹響的時候</mark></strong>。因號筒要響，<strong><mark>死人要復活，成爲不朽壞的，我們也要改變</mark></strong>。 <strong><mark>這必朽壞的總要變成不朽壞的</mark></strong>，這必死的總要變成不死的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L42,44,51-53">林前 15:42,44,51-53</a>)</p></blockquote><blockquote><p>“<strong><mark>論到睡了的人</mark></strong>，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。 我們若信耶穌死而復活了，<strong><mark>那已經在耶穌裏睡了的人，上帝也必將他與耶穌一同帶來</mark></strong>。 我們現在照主的話告訴你們一件事：<strong><mark>我們這活著還存留到主降臨的人，斷不能在那已經睡了的人之先</mark></strong>， 因爲<strong><mark>主必親自從天降臨</mark></strong>，有呼叫的聲音和天使長的聲音，又有上帝的號吹響；<strong><mark>那在基督裏死了的人必先復活</mark></strong>。 <strong><mark>以後我們這活著還存留的人必和他們一同被提到雲裏</mark></strong>，在空中與主相遇。<strong><mark>這樣，我們就要和主永遠同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/4/#L13-17">帖前 4:13-17</a>)</p></blockquote><h3>基督將差遣天使聚集萬民受審</h3><p>天使將聚集義人和不義的人：</p><blockquote><p>“<strong><mark>他要差遣天使，把他的選民</mark></strong>，從四方，從地極直到天邊，都招聚了來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/13/#L27">可 13:27</a>)</p></blockquote><blockquote><p>“<strong><mark>人子要差遣使者，把一切叫人跌倒的和作惡的，從他國裏挑出來</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L41">太 13:41</a>)</p></blockquote><h3>基督將宣告判決</h3><blockquote><p>“<strong><mark>當人子在他榮耀裏</mark></strong>，同著衆天使降臨的時候，<strong><mark>要坐在他榮耀的寶座上</mark></strong>。 萬民都要聚集在他面前。他要把他們分別出來，<strong><mark>好像牧羊的分別綿羊山羊一般</mark></strong>； 把綿羊安置在右邊，山羊在左邊。 於是，王要向那右邊的說：『<strong><mark>你們這蒙我父賜福的，可來承受那創世以來爲你們所預備的國</mark></strong>。 因爲我餓了，你們給我吃；渴了，你們給我喝；我作客旅，你們留我住； 我赤身露體，你們給我穿；我病了，你們看顧我；我在監裏，你們來看我。』 義人就回答說：『主啊，我們什麼時候見你餓了，給你吃，渴了，給你喝？ 什麼時候見你作客旅，留你住，或是赤身露體，給你穿？ 又什麼時候見你病了，或是在監裏，來看你呢？』 王要回答說：『我實在告訴你們：這些事你們既作在我這弟兄中一個最小的身上，就是作在我身上了。』 王又要向那左邊的說：『<strong><mark>你們這被咒詛的人，離開我</mark></strong>，進入那爲魔鬼和他的使者所預備的永火裏去！ 因爲我餓了，你們不給我吃；渴了，你們不給我喝； 我作客旅，你們不留我住；我赤身露體，你們不給我穿；我病了，我在監裏，你們不來看顧我。』 他們也要回答說：『主啊，我們什麼時候見你餓了，或渴了，或作客旅，或赤身露體，或病了，或在監裏，不伺候你呢？』 王要回答說：『我實在告訴你們：這些事你們既不作在我這弟兄中一個最小的身上，就是不作在我身上了。』 <strong><mark>這些人，要往永刑裏去</mark></strong>；<strong><mark>那些義人，要往永生裏去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-46">太 25:31-46</a>)</p></blockquote><h3>得救的人將被接到與基督同在的永生裏</h3><p>在此之前，他們只是以靈魂與基督同在，等候身體的復活。如今，義人將在得了改變的身體（復活之後）後被接到與基督同在的永生裏：</p><blockquote><p>“因爲主必親自從天降臨，有呼叫的聲音和天使長的聲音，又有上帝的號吹響；<strong><mark>那在基督裏死了的人必先復活</mark></strong>。 <strong><mark>以後我們這活著還存留的人必和他們一同被提到雲裏，在空中與主相遇</mark></strong>。<strong><mark>這樣，我們就要和主永遠同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/4/#L16-17">帖前 4:16-17</a>)</p></blockquote><h3>滅亡的人將被送去受永遠的刑罰</h3><blockquote><p>“<strong><mark>這些人，要往永刑裏去</mark></strong>；<strong><mark>那些義人，要往永生裏去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L46">太 25:46</a>)</p></blockquote><p>救恩與刑罰，如經上所記，都將是永遠的。</p><h2>第二次降臨的重要細節</h2><h3>降臨——如同閃電</h3><p>基督的第二次降臨將立刻被全世界的人知道，如同閃過的閃電：</p><blockquote><p>“人將要對你們說：『看哪，在那裏！看哪，在這裏！』<strong><mark>你們不要出去，也不要跟隨他們</mark></strong>！ 因爲<strong><mark>人子在他降臨的日子</mark></strong>，<strong><mark>好像閃電從天這邊一閃直照到天那邊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/17/#L23-24">路 17:23-24</a>)</p></blockquote><blockquote><p>“若有人對你們說，『看哪，基督在曠野裏』，<strong><mark>你們不要出去</mark></strong>；或說，『看哪，基督在內屋中』，<strong><mark>你們不要信</mark></strong>。 <strong><mark>閃電從東邊發出，直照到西邊；人子降臨，也要這樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L26-27">太 24:26-27</a>)</p></blockquote><h3>基督將以他已有的成人身體來臨</h3><p>基督不會再次由人所生，而是帶著他已有的身體來臨——那身體是他在公元一世紀由童貞女馬利亞上帝之母所生時獲得的：</p><blockquote><p>“說了這話，他們正看的時候，<strong><mark>他就被取上升，有一朵雲彩把他接去</mark></strong>，便看不見他了。 當他往上去，他們定睛望天的時候，忽然有兩個人身穿白衣，站在旁邊，說： 「加利利人哪，你們爲什麼站著望天呢？<strong><mark>這離開你們被接昇天的耶穌，你們見他怎樣往天上去，他還要怎樣來</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L9-11">徒 1:9-11</a>)</p></blockquote><h3>降臨是爲了審判</h3><p>主來不是爲了教導，而是按他第一次來時所已經賜下的話語施行審判：</p><blockquote><p>“棄絕我不領受我話的人，有審判他的；<strong><mark>就是我所講的道，在末日要審判他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L48">約 12:48</a>)</p></blockquote><blockquote><p>“人子要在他父的榮耀裏，同著衆使者降臨；那時候，<strong><mark>他要照各人的行爲報應各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“<strong><mark>當人子在他榮耀裏</mark></strong>，同著衆天使降臨的時候，<strong><mark>要坐在他榮耀的寶座上</mark></strong>。 萬民都要聚集在他面前。他要把他們分別出來，<strong><mark>好像牧羊的分別綿羊山羊一般</mark></strong>； 把綿羊安置在右邊，山羊在左邊。 &lt;…&gt; <strong><mark>這些人，要往永刑裏去</mark></strong>；<strong><mark>那些義人，要往永生裏去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-33,46">太 25:31-33,46</a>)</p></blockquote><blockquote><p>“<strong><mark>這正是上帝公義判斷的明證</mark></strong>，叫你們可算配得上帝的國，你們就是爲這國受苦。 上帝既是公義的，就必將患難報應那加患難給你們的人； 也必使你們這受患難的人與我們同得平安。<strong><mark>那時，主耶穌同他有能力的天使從天上在火焰中顯現</mark></strong>， <strong><mark>要報應那不認識上帝和那不聽從我主耶穌福音的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L5-8">帖後 1:5-8</a>)</p></blockquote><h3>第二次降臨與審判密不可分</h3><p>在基督第二次降臨時，施行審判的對象是一切的人，而不只是罪人。主要賞賜一些人，刑罰另一些人：</p><blockquote><p>“<strong><mark>當人子在他榮耀裏</mark></strong>，<strong><mark>同著衆天使降臨的時候</mark></strong>，<strong><mark>要坐在他榮耀的寶座上</mark></strong>。 <strong><mark>萬民都要聚集在他面前</mark></strong>。他要把他們分別出來，<strong><mark>好像牧羊的分別綿羊山羊一般</mark></strong>； 把綿羊安置在右邊，山羊在左邊。 &lt;…&gt; <strong><mark>這些人，要往永刑裏去</mark></strong>；<strong><mark>那些義人，要往永生裏去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-33,46">太 25:31-33,46</a>)</p></blockquote><blockquote><p>“<strong><mark>我又看見一個白色的大寶座與坐在上面的</mark></strong>，從他面前天地都逃避，再無可見之處了。 我又看見死了的人，無論大小，都站在寶座前。案卷展開了，並且另有一卷展開，就是生命冊；<strong><mark>死了的人都憑著這些案卷所記載的，照他們所行的受審判</mark></strong>。 於是海交出其中的死人，<strong><mark>死亡和陰間也交出其中的死人</mark></strong>，他們都照各人所行的受審判。 死亡和陰間也被扔在火湖裏，<strong><mark>這火湖就是第二次的死</mark></strong>。 若有人名字沒記在生命冊上，他就被扔在火湖裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L11-15">啟 20:11-15</a>)</p></blockquote><blockquote><p>“<strong><mark>人子要在他父的榮耀裏</mark></strong>，<strong><mark>同著衆使者降臨</mark></strong>；那時候，<strong><mark>他要照各人的行爲報應各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“<strong><mark>當人子在他榮耀裏，同著衆天使降臨的時候</mark></strong>，<strong><mark>要坐在他榮耀的寶座上</mark></strong>。 <strong><mark>萬民都要聚集在他面前</mark></strong>。他要把他們分別出來，<strong><mark>好像牧羊的分別綿羊山羊一般</mark></strong>； &lt;…&gt; 於是，王要向那右邊的說：『<strong><mark>你們這蒙我父賜福的</mark></strong>，可來承受那創世以來爲你們所預備的國。 &lt;…&gt; 王又要向那左邊的說：『<strong><mark>你們這被咒詛的人</mark></strong>，離開我，進入那爲魔鬼和他的使者所預備的永火裏去！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-32,34,41">太 25:31-32,34,41</a>)</p></blockquote><blockquote><p>“<strong><mark>這正是上帝公義判斷的明證</mark></strong>，叫你們可算配得上帝的國，你們就是爲這國受苦。 上帝既是公義的，就必將患難報應那加患難給你們的人； 也必使你們這受患難的人與我們同得平安。<strong><mark>那時，主耶穌同他有能力的天使從天上在火焰中顯現</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L5-7">帖後 1:5-7</a>)</p></blockquote><blockquote><p>“他又對我說：「<strong><mark>不可封了這書上的預言，因爲日期近了</mark></strong>。 <strong><mark>不義的，叫他仍舊不義</mark></strong>；污穢的，叫他仍舊污穢；爲義的，叫他仍舊爲義；聖潔的，叫他仍舊聖潔。」 「<strong><mark>看哪，我必快來</mark></strong>！賞罰在我，<strong><mark>要照各人所行的報應他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L10-12">啟 22:10-12</a>)</p></blockquote><h3>衆人都要受審判</h3><blockquote><p>“<strong><mark>因爲我們衆人必要在基督臺前顯露出來</mark></strong>，叫各人<strong><mark>按著本身所行的</mark></strong>，<strong><mark>或善或惡受報</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲人所作的事，連一切隱藏的事，無論是善是惡，上帝都必審問</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/12/#L14">傳 12:14</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲時候到了，審判要從上帝的家起首</mark></strong>。若是先從我們起首，那不信從上帝福音的人將有何等的結局呢？ 『<strong><mark>若是義人僅僅得救</mark></strong>，那不虔敬和犯罪的人，將有何地可站呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><blockquote><p>“你這個人，爲什麼論斷弟兄呢？又爲什麼輕看弟兄呢？<strong><mark>因我們都要站在上帝的臺前</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L10">羅 14:10</a>)</p></blockquote><blockquote><p>“你們既然要按使人自由的律法受審判，<strong><mark>就該照這律法說話行事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L12">雅 2:12</a>)</p></blockquote><blockquote><p>“當人子在他榮耀裏，同著衆天使降臨的時候，要坐在他榮耀的寶座上。 <strong><mark>萬民都要聚集在他面前</mark></strong>。他要把他們分別出來，<strong><mark>好像牧羊的分別綿羊山羊一般</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h3>審判從教會開始</h3><blockquote><p>“因爲<strong><mark>時候到了，審判要從上帝的家起首</mark></strong>。<strong><mark>若是先從我們起首</mark></strong>，那不信從上帝福音的人將有何等的結局呢？ 『<strong><mark>若是義人僅僅得救</mark></strong>，那不虔敬和犯罪的人，將有何地可站呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><h3>聖徒要審判世界</h3><blockquote><p>“耶穌說：「我實在告訴你們：你們這跟從我的人，到復興的時候，人子坐在他榮耀的寶座上，<strong><mark>你們也要坐在十二個寶座上，審判以色列十二個支派</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L28">太 19:28</a>)</p></blockquote><blockquote><p>“我將國賜給你們，正如我父賜給我一樣， 叫你們在我國裏，坐在我的席上吃喝，並且<strong><mark>坐在寶座上，審判以色列十二個支派</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L29-30">路 22:29-30</a>)</p></blockquote><blockquote><p>“<strong><mark>豈不知聖徒要審判世界嗎</mark></strong>？若世界爲你們所審，難道你們不配審判這最小的事嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L2">林前 6:2</a>)</p></blockquote><h3>許多人將驚訝地發現自己並未得救</h3><p>他們以爲自己是得救的：</p><blockquote><p>“<strong><mark>當那日，必有許多人對我說</mark></strong>：『主阿，主阿，我們不是奉你的名傳道，奉你的名趕鬼，<strong><mark>奉你的名行許多異能嗎</mark></strong>？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h3>世界的更新</h3><blockquote><p>“<strong><mark>我又看見一個新天新地</mark></strong>。因爲先前的天地已經過去了，海也不再有了。 我又看見聖城新耶路撒冷由上帝那裏從天而降，預備好了，就如新婦妝飾整齊，等候丈夫。 我聽見有大聲音從寶座出來說：「看哪！上帝的帳幕在人間。他要與人同住，他們要作他的子民，上帝要親自與他們同在，作他們的上帝。 上帝要擦去他們一切的眼淚，不再有死亡，也不再有悲哀、哭號、疼痛，因爲以前的事都過去了。」 <strong><mark>坐寶座的說</mark></strong>：「<strong><mark>看哪！我將一切都更新了</mark></strong>。」又說：「你要寫上，因這些話是可信的，是真實的。」 他又對我說：「都成了！<strong><mark>我是阿拉法，我是俄梅戛</mark></strong>；我是初，我是終。<strong><mark>我要將生命泉的水白白賜給那口渴的人喝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/21/#L1-6">啟 21:1-6</a>)</p></blockquote><h2>關於「一千年」的說法</h2><h3>一千年——是從基督第一次降臨到第二次降臨這一時期的象徵性名稱</h3><p>第一次降臨已經發生過。上帝之子降生成人，並未停止他所是的（上帝），而又成爲了人。他教導人，受難，復活，昇天，建立了教會（唯一的：地上的和天上的），並差人去傳道。那些回應基督傳道、進入他的教會、達到救恩並與他在天上同活的人，經上說是與他一同掌王的，雖然他們的身體還死在土裏，而<a href="https://bibleox.com/ru/ru/w/жизнь-души-после-смерти-тела">他們的靈魂與基督同在</a>。這樣將持續到主耶穌基督的第二次降臨；那時候除了上帝沒有人知道（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L7">徒 1:7</a>）。從第一次降臨到第二次降臨的整個時期，被形象地稱爲一千年：</p><blockquote><p>“我又看見一位天使從天降下，手裏拿著無底坑的鑰匙和一條大鍊子。 <strong><mark>他捉住那龍，就是古蛇，又叫魔鬼，也叫撒但，把牠捆綁一千年</mark></strong>， 扔在無底坑裏，將無底坑關閉，用印封上，使牠不得再迷惑列國。<strong><mark>等到那一千年完了</mark></strong>，以後必須暫時釋放牠。 我又看見幾個寶座，也有坐在上面的，並有審判的權柄賜給他們。我又看見那些因爲給耶穌作見證，併爲上帝之道被斬者的靈魂，和那沒有拜過獸與獸像、也沒有在額上和手上受過他印記之人的靈魂，他們都復活了，<strong><mark>與基督一同作王一千年</mark></strong>。 <strong><mark>這是頭一次的復活</mark></strong>。<strong><mark>其餘的死人還沒有復活，直等那一千年完了</mark></strong>。 <strong><mark>在頭一次復活有分的有福了、聖潔了</mark></strong>！<strong><mark>第二次的死在他們身上沒有權柄</mark></strong>。他們必作上帝和基督的祭司，<strong><mark>並要與基督一同作王一千年</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L1-6">啟 20:1-6</a>)</p></blockquote><h3>論千禧年主義（千禧年說）的異端</h3><p>千禧年主義（千禧年說）——是關於基督在地上掌王一千年（1000年）的學說。東正教基督徒不能接受它，因爲：</p><ol><li><p>無法承認<strong>兩次身體的復活</strong>（主只教導一次身體的復活）；</p></li><li><p>無法承認<strong>兩個最後審判</strong>（主同樣只教導一次審判）；</p></li><li><p>無法承認在最後審判之前，爲在地上統治世界而有<strong>基督特殊的降臨</strong>；</p></li><li><p>無法承認在這個世界裏已經有<strong>某種特殊的基督千年王國</strong>，不同於天國。</p></li></ol><p>詳情：<a href="https://bibleox.com/ru/ru/w/хилиазм">千禧年主義</a>。</p><h2>論兩次死亡與兩次復活</h2><p>在神學家約翰使徒的啟示錄一書中提到（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L1-6">啟 20:1-6</a>）兩次死亡和兩次復活。</p><p>第一次死——在地上肉身的死亡[1]。</p><p>第二次死——在普遍最後審判時來自上帝的永恆定罪與刑罰。</p><p>第一次復活——屬靈的：歸向上帝、信仰、悔改、洗禮、改正生活。</p><p>第二次復活——身體的，在主耶穌基督第二次降臨時發生。</p><h3>第一次復活——經由傳道和洗禮歸向上帝</h3><p>主捆綁了撒但。異教的膜拜開始被基督教戰勝並消失。人們獲得了經由洗禮、聖餐禮和在教會中的生活而在屬靈上覆活、進入與上帝同在的永生的可能。這一進入永生的屬靈復活，在經文中被稱爲頭一次的復活：</p><blockquote><p>“<strong><mark>這是頭一次的復活</mark></strong>。其餘的死人還沒有復活，直等那一千年完了。 <strong><mark>在頭一次復活有分的有福了、聖潔了</mark></strong>！<strong><mark>第二次的死在他們身上沒有權柄</mark></strong>。他們必作上帝和基督的祭司，並要與基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L5-6">啟 20:5-6</a>)</p></blockquote><p>歸向上帝被稱爲從死亡進入生命：</p><blockquote><p>“<strong><mark>當我們死在過犯中的時候，便叫我們與基督一同活過來</mark></strong>（你們得救是本乎恩）。 他<strong><mark>又叫我們與基督耶穌一同復活，一同坐在天上</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L5-6">弗 2:5-6</a>)</p></blockquote><p>信的人已經出死入生：</p><blockquote><p>“我實實在在的告訴你們，<strong><mark>那聽我話又信差我來者的，就有永生</mark></strong>，不至於定罪，<strong><mark>是已經出死入生了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L24">約 5:24</a>)</p></blockquote><p>而不信的人則被直接稱爲死人：</p><blockquote><p>“耶穌說：「<strong><mark>任憑死人埋葬他們的死人</mark></strong>，你只管去傳揚上帝國的道。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L60">路 9:60</a>)</p></blockquote><h3>第二次復活——所有的人帶著身體復活，爲受普遍的審判</h3><p>第二次復活涉及所有的人。它指一切曾經活過的人爲受普遍審判而復活。所有的靈魂都回到他們復原的身體中，好叫一切趨向上帝的（靈魂與身體）得賞賜，而一切犯罪的（靈魂與身體）受刑罰。</p><blockquote><p>“並且靠著上帝，盼望死人，<strong><mark>無論善惡，都要復活</mark></strong>，就是他們自己也有這個盼望。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/24/#L15">徒 24:15</a>)</p></blockquote><h3>關於「兩次復活」的詳情</h3><blockquote><p>“我又看見一位天使從天降下，手裏拿著無底坑的鑰匙和一條大鍊子。 <strong><mark>他捉住那龍，就是古蛇，又叫魔鬼，也叫撒但，把牠捆綁一千年</mark></strong>， 扔在無底坑裏，將無底坑關閉，用印封上，使牠不得再迷惑列國。<strong><mark>等到那一千年完了</mark></strong>，以後必須暫時釋放牠。 我又看見幾個寶座，也有坐在上面的，並有審判的權柄賜給他們。我又看見那些因爲給耶穌作見證，併爲上帝之道被斬者的靈魂，和那沒有拜過獸與獸像、也沒有在額上和手上受過他印記之人的靈魂，他們都復活了，<strong><mark>與基督一同作王一千年</mark></strong>。 <strong><mark>這是頭一次的復活</mark></strong>。<strong><mark>其餘的死人還沒有復活，直等那一千年完了</mark></strong>。 <strong><mark>在頭一次復活有分的有福了、聖潔了</mark></strong>！<strong><mark>第二次的死在他們身上沒有權柄</mark></strong>。他們必作上帝和基督的祭司，並要與基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L1-6">啟 20:1-6</a>)</p></blockquote><p>對這經文的註釋：</p><blockquote><p>“<strong><mark>這是頭一次的復活</mark></strong>。<strong><mark>其餘的死人還沒有復活，直等那一千年完了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L5">啟 20:5</a>)</p></blockquote><p>上帝給所有人規定了時間，使他們可以在頭一次復活的時期內復活，並且爲此賜下了一切。然而，當死人應當復活的時候——即在整個一千年之內（在爲這一目的所規定的、那一千年未完結之前）——有人復活了，有人卻沒有復活。關於「直到……完了」一詞的詳情：<a href="https://bibleox.com/ru/ru/w/Богородица#HH-И-не-знал-Ее-как-наконец-она-родила-Мф-125">詳見</a>。</p><p>頭一部分的人在活於身體中時復活了，也就是歸向了基督：</p><blockquote><p>“<strong><mark>在頭一次復活有分的有福了、聖潔了</mark></strong>！<strong><mark>第二次的死在他們身上沒有權柄</mark></strong>。他們必作上帝和基督的祭司，並要與基督一同作王一千年。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L6">啟 20:6</a>)</p></blockquote><p>在他們身上，<strong>第二次的死</strong>將沒有權柄。</p><p>而所有的人帶著身體復活、爲受普遍的審判的復活是這樣的：</p><blockquote><p>“於是海交出其中的死人，<strong><mark>死亡和陰間也交出其中的死人</mark></strong>，<strong><mark>他們都照各人所行的受審判</mark></strong>。 死亡和陰間也被扔在火湖裏，<strong><mark>這火湖就是第二次的死</mark></strong>。 <strong><mark>若有人名字沒記在生命冊上，他就被扔在火湖裏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L13-15">啟 20:13-15</a>)</p></blockquote><p>被扔進火湖——這就是<strong>第二次的死</strong>。名字記在生命冊上的人，沒有被扔進去。也就是說，正是那些在20:6中說到的人——在他們身上第二次的死沒有權柄。</p>
