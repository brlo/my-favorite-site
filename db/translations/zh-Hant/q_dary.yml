  title: 說別國話的恩賜
  copy_cover: true
  body: <h2>上帝在巴別變亂了口音</h2><p>建造巴別塔形象地表達了不經上帝、靠自己達到天的企圖。這導致了口音的變亂和彼此語言的不通：</p><blockquote><p>“他們說：「來吧，我們要建造一座城和一座塔，<strong><mark>塔頂通天</mark></strong>，爲要傳揚我們的名，免得我們分散在全地上。」 耶和華降臨，要看看世人所建造的城和塔。 耶和華說：「看哪！他們成爲<strong><mark>一樣的人民，都是一樣的言語</mark></strong>，如今既做起這事來，以後他們所要做的事，就沒有不成就的了。 <strong><mark>我們下去，在那裏變亂他們的口音，使他們的言語彼此不通</mark></strong>。」 於是，耶和華使他們從那裏分散在全地上，他們就停工，不造那城了。 <strong><mark>因爲耶和華在那裏變亂天下人的言語</mark></strong>，使衆人分散在全地上，所以那城名叫巴別。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/11/#L4-9">創 11:4-9</a>)</p></blockquote><h2>上帝在教會裏勝過了口音的變亂</h2><p>在教會成立、聖靈降臨的那一天，上帝賜給使徒明白外國語言的恩賜：</p><blockquote><p>“五旬節到了，門徒都聚集在一處。 忽然，從天上有響聲下來，好像一陣大風吹過，充滿了他們所坐的屋子； 又有舌頭如火焰顯現出來，分開落在他們各人頭上。 <strong><mark>他們就都被聖靈充滿</mark></strong>，<strong><mark>按著聖靈所賜的口才說起別國的話來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L1-4">徒 2:1-4</a>)</p></blockquote><h2>別國的話——就是外國的語言</h2><p>從各地來的人驚訝：加利利人（使徒）怎麼能說外國語言：</p><blockquote><p>“那時，有虔誠的猶太人從天下各國來，住在耶路撒冷。 這聲音一響，衆人都來聚集。<strong><mark>各人聽見門徒用衆人的鄉談說話</mark></strong>，就甚納悶， 都驚訝希奇說：「看哪，<strong><mark>這說話的不都是加利利人嗎</mark></strong>？ 我們各人怎麼聽見他們說我們生來所用的鄉談呢？ 我們<strong><mark>帕提亞人</mark></strong>、<strong><mark>瑪代人</mark></strong>、<strong><mark>以攔人</mark></strong>，和<strong><mark>住在米所波大米</mark></strong>、<strong><mark>猶太</mark></strong>、<strong><mark>加帕多家</mark></strong>、<strong><mark>本都</mark></strong>、<strong><mark>亞西亞</mark></strong>、 <strong><mark>弗呂家</mark></strong>、<strong><mark>旁非利亞</mark></strong>、<strong><mark>埃及的人</mark></strong>，並<strong><mark>靠近古利奈的呂彼亞</mark></strong>一帶地方的人，<strong><mark>從羅馬來的客旅</mark></strong>中，或是猶太人，或是進猶太教的人， <strong><mark>革哩底和亞拉伯人</mark></strong>，<strong><mark>都聽見他們用我們的鄉談，講說上帝的大作爲</mark></strong>。」 衆人就都驚訝猜疑，彼此說：「這是什麼意思呢？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L5-12">徒 2:5-12</a>)</p></blockquote><h2>不是人人都有方言的恩賜</h2><ol><li><p><strong>不是</strong>人人都領受明白別國語言的恩賜。</p></li><li><p>領受方言恩賜的人，明白<strong>各種不同的</strong>語言。</p></li><li><p>一切恩賜，包括方言的恩賜，都是<strong>爲了造就</strong>而賜下的：</p></li></ol><blockquote><p>“<strong><mark>恩賜原有分別</mark></strong>，聖靈卻是一位。 <strong><mark>職事也有分別</mark></strong>，主卻是一位。 <strong><mark>功用也有分別</mark></strong>，上帝卻是一位，在衆人裏面運行一切的事。 聖靈顯在各人身上，<strong><mark>是叫人得益處</mark></strong>。 這人蒙聖靈賜他<strong><mark>智慧的言語</mark></strong>，那人也蒙這位聖靈賜他<strong><mark>知識的言語</mark></strong>， 又有一人蒙這位聖靈賜他<strong><mark>信心</mark></strong>，還有一人蒙這位聖靈賜他<strong><mark>醫病的恩賜</mark></strong>， 又叫一人<strong><mark>能行異能</mark></strong>，又叫一人<strong><mark>能作先知</mark></strong>，又叫一人<strong><mark>能辨別諸靈</mark></strong>，又叫一人<strong><mark>能說方言</mark></strong>，又叫一人<strong><mark>能繙方言</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L4-10">林前 12:4-10</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝在教會所設立的</mark></strong>：第一是<strong><mark>使徒</mark></strong>，第二是<strong><mark>先知</mark></strong>，第三是<strong><mark>教師</mark></strong>，其次是<strong><mark>行異能的</mark></strong>，再次是<strong><mark>得恩賜醫病的</mark></strong>，<strong><mark>幫助人的</mark></strong>，<strong><mark>治理事的</mark></strong>，<strong><mark>說方言的</mark></strong>。 <strong><mark>豈都是使徒嗎</mark></strong>？<strong><mark>豈都是先知嗎</mark></strong>？<strong><mark>豈都是教師嗎</mark></strong>？<strong><mark>豈都是行異能的嗎</mark></strong>？ <strong><mark>豈都是得恩賜醫病的嗎</mark></strong>？<strong><mark>豈都是說方言的嗎</mark></strong>？<strong><mark>豈都是繙方言的嗎</mark></strong>？ 你們要切切的求那更大的恩賜。我現今把最妙的道指示你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28-31">林前 12:28-31</a>)</p></blockquote><h2>對使徒而言，懂希臘語不足以向一切人宣講</h2><p>羅馬的軍官驚訝使徒竟然連最通用的語言——希臘語——都懂。也就是說，雖然希臘語流傳很廣（通用語），但這並不意味著人人都懂它。</p><p>受過高等教育的使徒保羅，曾受教於全民敬重的教法師迦瑪列（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L3">徒 22:3</a>）——法利賽人、公會成員（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L34">徒 5:34</a>）——引用希臘哲學家和作家（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L28">徒 17:28</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L12">多 1:12</a>），用希臘語向羅馬的千夫長講話。千夫長驚訝使徒保羅懂希臘語：</p><blockquote><p>“於是千夫長上前拿住他，吩咐用兩條鐵鍊捆鎖；又問他是什麼人，作的是什麼事。 &lt;…&gt; 將要帶他進營樓，保羅對千夫長說：「我對你說句話，可以不可以？」他說：「<strong><mark>你懂得希利尼話嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/21/#L33,37">徒 21:33,37</a>)</p></blockquote><p>羅馬的軍官驚訝一個猶太人懂羅馬帝國最通用的語言。只有在這種知識<strong>是罕見的</strong>時候，這纔會令人驚訝。如果連希臘語的知識在如此有學問的人身上都令人驚訝，那對其他使徒而言，懂希臘語就更談不上了——他們許多人是普通的漁夫，是沒有學問的小民（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L13">徒 4:13</a>）。但問題不在於宣講者（使徒）必須懂語言才能到處宣講；聽宣講的人也必須懂希臘語。</p><p>所以，只有希臘語的知識是不夠的，因此使徒們——作爲基督生活、復活和教導的活的見證人——需要超性的恩賜，其中有明白語言恩賜，好把關於基督的見證連同自己的信仰傳給萬民。</p><h2>如果沒有人明白說方言的人，就沒有益處</h2><blockquote><p>“弟兄們，我到你們那裏去，若只說方言，不用啓示、或知識、或預言、或教訓，給你們講解，<strong><mark>我與你們有什麼益處呢</mark></strong>？ &lt;…&gt; 你們也是如此，舌頭若不說容易明白的話，怎能知道所說的是什麼呢？<strong><mark>這就是向空說話了</mark></strong>。 世上的聲音或者甚多，<strong><mark>卻沒有一樣是無意思的</mark></strong>。 我若不明白那聲音的意思，這說話的人必以我爲化外之人，我也以他爲化外之人。 你們也是如此，既是切慕屬靈的恩賜，<strong><mark>就當求多得造就教會的恩賜</mark></strong>。 所以那說方言的，<strong><mark>就當求著能繙出來</mark></strong>。 &lt;…&gt; 不然，你用靈祝謝，那在座不通方言的人，既然不明白你的話，怎能在你感謝的時候說『阿們』呢？ 你感謝的固然是好，<strong><mark>無奈不能造就別人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/14/#L6,9-13,16-17">林前 14:6,9-13,16-17</a>)</p></blockquote><h2>在教會裏不可說無人翻譯的方言</h2><blockquote><p>“若有說方言的，只好兩個人，至多三個人，且要輪流著說，也要一個人繙出來。 <strong><mark>若沒有人繙，就當在會中閉口</mark></strong>，只對自己和上帝說就是了。 &lt;…&gt; 因爲<strong><mark>上帝不是叫人混亂，乃是叫人安靜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/14/#L27-28,33">林前 14:27-28,33</a>)</p></blockquote><p>同時，先知的事奉是宣講：</p><blockquote><p>“<strong><mark>猶大和西拉也是先知</mark></strong>，<strong><mark>就用許多話勸勉弟兄，堅固他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L32">徒 15:32</a>)</p></blockquote><h2>呼召人更追求作先知講道（宣講與解釋）的恩賜，而不是方言</h2><blockquote><p>“<strong><mark>你們要追求愛</mark></strong>，也要切慕屬靈的恩賜，其中<strong><mark>更要羨慕的，是作先知講道</mark></strong>。 那說方言的，原不是對人說，乃是對上帝說．因爲沒有人聽出來。然而他在心靈裏，卻是講說各樣的奧祕。 但<strong><mark>作先知講道的，是對人說，要造就、安慰、勸勉人</mark></strong>。 <strong><mark>說方言的，是造就自己</mark></strong>；<strong><mark>作先知講道的，乃是造就教會</mark></strong>。 我願意你們都說方言，<strong><mark>更願意你們作先知講道</mark></strong>，因爲說方言的，若不繙出來，使教會被造就，那作先知講道的，就比他強了。 &lt;…&gt; 所以我弟兄們，<strong><mark>你們要切慕作先知講道</mark></strong>，也不要禁止說方言。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/14/#L1-5,39">林前 14:1-5,39</a>)</p></blockquote><h2>方言終必停止</h2><blockquote><p>“愛是永不止息。先知講道之能，終必歸於無有；<strong><mark>說方言之能，終必停止</mark></strong>；知識也終必歸於無有。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>)</p></blockquote><h2>愛是最主要的恩賜，人應當追求它</h2><blockquote><p>“<strong><mark>我若能說萬人的方言，並天使的話語，卻沒有愛</mark></strong>，我就成了鳴的鑼、響的鈸一般。 我若有先知講道之能，也明白各樣的奧祕、各樣的知識，而且有全備的信，叫我能夠移山，卻沒有愛，<strong><mark>我就算不得什麼</mark></strong>。 &lt;…&gt; 如今常存的有信，有望，有愛；這三樣，<strong><mark>其中最大的是愛</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L1-2,13">林前 13:1-2,13</a>)</p></blockquote><h2>使徒們未曾賜下的別的靈</h2><blockquote><p>“假如有人來另傳一個耶穌，不是我們所傳過的，或者你們<strong><mark>另受一個靈</mark></strong>，不是你們所受過的；或者另得一個福音，不是你們所得過的，你們容讓他也就罷了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L4">林後 11:4</a>)</p></blockquote><h2>今天的宣教士學習語言</h2><p>在古代，使徒和最早的基督徒因非常的需要領受了明白外國語言的恩賜，好叫還很小的教會能夠廣泛傳播，向萬民宣講。但今天的宣教士不得不學習語言，也就是要勞苦。爲此現在一切手段都在，缺的可能只是心願。</p><p>有一些信基督的人的團體（靈恩派和五旬節派）可以宣稱自己有說別國話和解釋它們的恩賜；但當他們到了別的國家，外國人並不懂他們的話，於是這樣的宣教士要麼繼續說自己的母語，要麼不得不借助教科書和教師用普通的方法學習語言。</p><p>在我們這個時代，這恩賜幾乎沒有了。正教會有一位二十世紀的聖人——聖山修士帕伊西——他除了母語（希臘語）之外從未學過別的語言，也從未宣稱自己有說別國話的恩賜；但當外國人到他那裏去時，他們竟能不用翻譯就與他用法語、另一次用英語交談。</p><h2>對異議的回應</h2><h3>關於哥林多前書14章經文的各種問題</h3><p>關於哥林多前書第14章有很多問題，所以有意義把整章都分析一遍。這在<a href="https://bibleox.com/ru/ru/w/K5Ou_Иные_языки_древних_христиан_и_позднейшие_симуляции">單獨的一篇文章</a>裏作了。</p><h3>方言只是在未來的世代才停止嗎？</h3><p>正教徒向五旬節派和靈恩派指出使徒保羅關於方言必停止的話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>），即這恩賜將要終止。當然，它不會完全消失，因爲正教中極少數的現代聖人確實有過說外國語言的恩賜；但總體上，像最早基督徒那樣的大規模現象不會再有了。</p><p>對此新教五旬節派回答說，方言只是在未來的世代、基督再來之後才停止。持這種看法的一些人所依據的，是關於“等那完全的來到”之時代的話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L10">林前 13:10</a>）。</p><p>我們在更寬的語境裏看這段經文：</p><blockquote><p>“<strong><mark>愛是永不止息</mark></strong>。<strong><mark>先知講道之能，終必歸於無有</mark></strong>；<strong><mark>說方言之能，終必停止</mark></strong>；<strong><mark>知識也終必歸於無有</mark></strong>。 <strong><mark>我們現在所知道的有限</mark></strong>，<strong><mark>先知所講的也有限</mark></strong>， <strong><mark>等那完全的來到，這有限的必歸於無有了</mark></strong>。 我作孩子的時候，話語像孩子，心思像孩子，意念像孩子．既成了人，就把孩子的事丟棄了。 <strong><mark>我們如今彷彿對著鏡子觀看，模糊不清</mark></strong>，到那時，就要面對面了。<strong><mark>我如今所知道的有限</mark></strong>，到那時就全知道，如同主知道我一樣。 如今常存的有信，有望，有愛；這三樣，其中最大的是愛。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8-13">林前 13:8-13</a>)</p></blockquote><p>使徒說，當“那完全的來到”，那“有限的”就要歸於無有。什麼是有限的？<strong>知識</strong>。在這句話裏他開始解釋自己那句複雜的話——“知識也終必歸於無有”。他現在要表達的是：不是知識本身要歸於無有（彷彿他們那時將一無所知），而是他們現在所擁有的這有限的知識要歸於無有，並且將有完全的知識。他繼續發展的正是這一思想。</p><ol><li><p>他說，如今知識<strong>有限地</strong>已經有了，而別的知識<strong>有限地</strong>藉著先知講道顯明出來。</p></li><li><p>時候將到，那時賜下的將是完全的知識，而不是“有限的”。</p></li><li><p>如今知識是彷彿對著鏡子觀看，模糊不清地得著的。</p></li></ol><p>他這裏說的是知識，而不是說方言的恩賜。基督徒對外國語言的知識不是有限的。否則他們就不能把福音完整地傳給別的民族和萬民。他們擁有完全的方言恩賜——五旬節來到耶路撒冷的人之所以驚訝，正因爲他們聽見使徒用自己鄉談說話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L5-12">徒 2:5-12</a>）。那不是有限的。有限的是知識，而且只是知識。使徒接下去所推理的，正是知識。</p><p>那方言的恩賜什麼時候停止呢？嚴格地說，這裏沒有說。只說了它要停止。而我們生活在他們之後二十個世紀，可以回顧並看到：這些話相當快就應驗了——當宣講大大傳開、基督徒變得極多的時候；如今方言的恩賜已沒有那樣的非常需要。有非常需要的是愛，而方言的恩賜——沒有。所以從那時起人們學習語言。</p><p>“愛是永不止息”這話並不表明要止息的物在永恆裏止息。其餘的一切什麼時候止息都可以；關於永恆只說了一點：在那裏愛不會止息。愛是永恆的、即使在未來的世代也不止息——這是無可爭辯的。</p><p>教父們是否像五旬節派那樣理解這些經文？</p><p>例如在四世紀，金口約翰認爲，方言恩賜的止息說的是當今的世代，而不是未來的世代。</p><p><strong>聖金口約翰（約347-407）</strong></p><p>“他這樣從各方面、以全部力量顯明了愛的偉大之後，又從另一極重要的方面作同樣的事，用另一個比較高舉它的尊貴，說：‘先知講道之能終必歸於無有；說方言之能終必停止’。<strong>如果這兩個恩賜是爲信仰而賜下的，那麼隨著信仰在各處的傳佈，它們的使用已是多餘的。但彼此相愛不會止息，反而無論在這裏還是在未來的世代都要更加增長</strong>，那時更要勝過如今。在這裏有許多事削弱愛——錢財、（世間的事務）、肉身的情慾、靈魂的疾病；而在那裏這些都沒有。至於先知講道和方言的止息，並沒有什麼可奇怪的；而知識的止息卻似乎奇怪，所以他正是接著說：‘知識也終必歸於無有’。怎樣呢？難道我們那時將生活在無知中嗎？不，恰恰在那時知識更當增長，正如他說的：‘到那時就全知道，如同主知道我一樣’（林前 13:12）。所以，免得你以爲它也像先知講道和方言一樣要歸於無有，他在說了‘知識也終必歸於無有’之後沒有停住，而是顯明了止息的方式，隨即補充說：‘我們現在所知道的有限，先知所講的也有限；等那完全的來到，這有限的必歸於無有了’（林前 13:9-10）。可見，歸於無有的不是知識，而是知識的有限，因爲我們將知道的不僅是這些，還要多得多的東西。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ioann_Zlatoust/besedy-na-1-e-poslanie-k-korinfjanam/34)《哥林多前書講道集》第34篇）</p><p>更多引文：<a href="https://bibleox.com/ru/ru/w/ew9Dk6So_Говорение_на_языках">教父們論說別國話的引文</a></p><h3>人的語言和天使的語言</h3><p>當人們向新教五旬節派指出“別國的話就是別的民族的外國語言”的引文時，他們同意這一點，但作爲回應又拿出另一節經文，說彷彿還有一種“天使的語言”的恩賜：</p><blockquote><p>“我若能說萬人的方言，<strong><mark>並天使的話語</mark></strong>，卻沒有愛，我就成了鳴的鑼、響的鈸一般。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L1">林前 13:1</a>)</p></blockquote><p>但這種看法是錯誤的，因爲天使是無形體的靈。他們沒有說話的器官、沒有舌頭、沒有肺、沒有聲帶，也不需要空氣（大氣）來通過製造和接收空氣的振動來交流。這樣，由聲帶發出的任何人的聲音都不可能是“天使的語言”，因爲天使沒有聲帶，也沒有血肉的身體（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L39">路 24:39</a>）。</p><p>那使徒說“天使的語言”是什麼意思呢？這不過是修辭的手法：先極度抬高一部分，再用另一部分把它貶低。使徒只是表明：沒有愛的恩賜只是鳴的鑼。當哥林多人還以爲說別國的話已經是什麼特別的東西時，使徒決定舉得更高：即使能說天使的語言，若沒有愛，這也毫無益處。</p><p>這只是使徒的修辭手法。關於這一點在聖金口約翰那裏也可以讀到。</p><p><strong>聖金口約翰（約347-407）</strong></p><p>“論到天使的語言，（使徒）並沒有把語言歸於天使，而是表達這樣的意思：即使我能像天使彼此交談那樣說話，若沒有它（愛），我還是無有，甚至是累贅、令人難堪。同樣，在另一處他說‘天上、地上和地底下的一切都要屈膝拜他’（腓 2:10），他<strong>並沒有把膝蓋和骨頭歸於天使</strong>——絕無此事——而是藉著我們下拜的比喻來表達天使的熱心敬拜。這裏說語言也是一樣：他指的不是肉身的器官，而是以我們熟悉的方式表達他們彼此之間的交談。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ioann_Zlatoust/besedy-na-1-e-poslanie-k-korinfjanam/32)《哥林多前書講道集》第32篇）</p><p><strong>庫魯斯的真福狄奧多勒（約386-457）</strong></p><p>“所謂天使的語言，他指的不是感官的語言，而是某種屬靈的語言，天使們用它歌頌萬有的上帝並彼此交談。以賽亞聽見他們歌唱，以西結、但以理、撒迦利亞和彌迦聽見他們交談。神聖的使徒<strong>以誇張的方式表達</strong>這一點，爲要顯明愛的優越。”</p><p>（[俄文](https://azbyka.ru/otechnik/Feodorit_Kirskij/tolkovanie_na_pervoe_poslanie_k_korinfinam/13#sel=9:83,9:128)《哥林多前書註釋》第13章）</p><p>基督自己也用過類似的修辭手法：極度抬高一部分，好叫另一部分把它貶低：</p><blockquote><p>“<strong><mark>人若賺得全世界，賠上自己的生命，有什麼益處呢</mark></strong>？人還能拿什麼換生命呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L26">太 16:26</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/8/#L36">可 8:36</a>)</p></blockquote><p>所以，這裏講的不是人有說天使語言的恩賜，因爲人用血肉交流，而天使沒有血肉。提到天使的語言只是修辭的手法。</p><h3>前五旬節派牧師的見證</h3><p>曾爲五旬節團體牧師、後來轉入正教的保羅，在一小段音頻講話（11分鐘）裏講述了他對五旬節派中“別國的話”的感受和經驗。他把以往的經驗與在正教裏得著的經驗作了比較。</p><p>音頻文件：<a href="https://disk.yandex.ru/d/hHzrMNPi_lVy2w" lang="ru">Яндекс.Диск</a>（俄語）</p>
