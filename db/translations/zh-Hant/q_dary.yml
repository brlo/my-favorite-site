  title: 基督教聖殿
  copy_cover: true
  body: <blockquote><p>“衆人中有幾個法利賽人對耶穌說：「夫子，責備你的門徒吧！」 耶穌說：「我告訴你們，<strong><mark>若是他們閉口不說，這些石頭必要呼叫起來</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/19/#L39-40">路 19:39-40</a>)</p></blockquote><blockquote><p>“你們要守我的安息日，<strong><mark>敬我的聖所</mark></strong>。我是耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>)</p></blockquote><h2>基督在世生活的時期</h2><p>基督爲聖餐聚集門徒於一間大的、預備好的樓房：</p><blockquote><p>“他必指給你們<strong><mark>擺設整齊的一間大樓</mark></strong>，你們就在那裏爲我們預備。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L15">可 14:15</a>)</p></blockquote><p>教會建立之後，基督徒在聖殿裏聚集：</p><blockquote><p>“他們<strong><mark>天天</mark></strong><strong><mark>同心合意恆切的在殿裏</mark></strong>，且在家中擘餅，存著歡喜、誠實的心用飯，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L46">徒 2:46</a>)</p></blockquote><blockquote><p>“<strong><mark>常在殿裏稱頌上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L53">路 24:53</a>)</p></blockquote><h2>基督昇天之後</h2><p>基督徒常常到聖殿去：</p><blockquote><p>“<strong><mark>常在殿裏稱頌上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L53">路 24:53</a>)</p></blockquote><blockquote><p>“他們天天<strong><mark>同心合意恆切的在殿裏</mark></strong>，<strong><mark>且在家中擘餅</mark></strong>，存著歡喜、誠實的心用飯，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L46">徒 2:46</a>)</p></blockquote><blockquote><p>“申初禱告的時候，<strong><mark>彼得、約翰上聖殿去</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/3/#L1">徒 3:1</a>)</p></blockquote><blockquote><p>“後來，我回到耶路撒冷，<strong><mark>在殿裏禱告的時候</mark></strong>，魂遊象外，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L17">徒 22:17</a>)</p></blockquote><blockquote><p>“你查問就可以知道，<strong><mark>從我上耶路撒冷禮拜到今日</mark></strong>，不過有十二天。 他們並沒有看見我<strong><mark>在殿裏</mark></strong>，或是在會堂裏，或是在城裏，和人辯論，聳動衆人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/24/#L11-12">徒 24:11-12</a>)</p></blockquote><p>基督徒也在自己的專門場所聚集：</p><blockquote><p>“找著了，就帶他到安提阿去。<strong><mark>他們足有一年的工夫和教會一同聚集，教訓了許多人</mark></strong>。門徒稱爲基督徒是從安提阿起首。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/11/#L26">徒 11:26</a>)</p></blockquote><blockquote><p>“第一，我聽說<strong><mark>你們聚會的時候</mark></strong>，彼此分門別類，我也稍微的信這話。 在你們中間不免有分門結黨的事，好叫那些有經驗的人顯明出來。 你們聚會的時候，<strong><mark>算不得吃主的晚餐</mark></strong>； 因爲吃的時候，各人先吃自己的飯，甚至這個飢餓，那個酒醉。 你們要吃喝，<strong><mark>難道沒有家嗎</mark></strong>？<strong><mark>還是藐視上帝的教會</mark></strong>，叫那沒有的羞愧呢？我向你們可怎麼說呢？可因此稱讚你們嗎？我不稱讚！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L18-22">林前 11:18-22</a>)</p></blockquote><blockquote><p>“<strong><mark>婦女在會中要閉口不言</mark></strong>，像在聖徒的衆教會一樣，因爲不准他們說話。<strong><mark>她們總要順服</mark></strong>，正如律法所說的。 她們若要學什麼，<strong><mark>可以在家裏問自己的丈夫</mark></strong>．因爲<strong><mark>婦女在會中說話原是可恥的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/14/#L34-35">林前 14:34-35</a>)</p></blockquote><h2>天上聖殿的先知性描繪</h2><p>啟示錄中對天上聖殿的描繪</p><p><strong>量度天上聖殿的命令</strong></p><blockquote><p>“有一根葦子賜給我，當作量度的杖，且有話說：「<strong><mark>起來，將上帝的殿和祭壇，並在殿中禮拜的人都量一量</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/11/#L1">啟 11:1</a>)</p></blockquote><p><strong>寶座</strong></p><blockquote><p>“<strong><mark>那二十四位長老就俯伏在坐寶座的面前</mark></strong>，敬拜那活到永永遠遠的，又把他們的冠冕放在寶座前，說：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/4/#L10">啟 4:10</a>)</p></blockquote><blockquote><p>“<strong><mark>在上帝面前，坐在自己位上的二十四位長老，就面伏於地敬拜上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/11/#L16">啟 11:16</a>)</p></blockquote><p><strong>祭壇</strong></p><blockquote><p>“另有一位天使拿著金香爐，<strong><mark>來站在祭壇旁邊</mark></strong>。有許多香賜給他，要和衆聖徒的祈禱一同<strong><mark>獻在寶座前的金壇上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3">啟 8:3</a>)</p></blockquote><blockquote><p>“天使拿著香爐，<strong><mark>盛滿了壇上的火</mark></strong>，倒在地上，隨有雷轟、大聲、閃電、地震。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L5">啟 8:5</a>)</p></blockquote><blockquote><p>“第六位天使吹號，我就聽見有聲音<strong><mark>從上帝面前金壇的四角出來</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/9/#L13">啟 9:13</a>)</p></blockquote><p><strong>七燈</strong></p><blockquote><p>“有閃電、聲音、雷轟從寶座中發出。又<strong><mark>有七盞火燈在寶座前點著</mark></strong>，這七燈就是上帝的七靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/4/#L5">啟 4:5</a>)</p></blockquote><p><strong>上香</strong></p><blockquote><p>“另有一位天使<strong><mark>拿著金香爐</mark></strong>，來站在祭壇旁邊。<strong><mark>有許多香賜給他</mark></strong>，要和衆聖徒的祈禱一同獻在寶座前的金壇上。 &lt;…&gt; <strong><mark>天使拿著香爐</mark></strong>，盛滿了壇上的火，倒在地上，隨有雷轟、大聲、閃電、地震。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3,5">啟 8:3,5</a>)</p></blockquote><h2>上帝命令敬重聖殿</h2><p>聖殿——<a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">天上實體的像</a>。上帝命令敬重這像：</p><blockquote><p>“你們要守我的安息日，<strong><mark>敬我的聖所</mark></strong>。我是耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>)</p></blockquote><blockquote><p>“你們要守我的安息日，<strong><mark>敬我的聖所</mark></strong>。我是耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>)</p></blockquote><p>新約的聖殿，是按神學家約翰的啟示錄裏的像建造的。</p><h2>對異議的回應</h2><h3>“使徒們去聖殿，是因爲他們不明白？”</h3><p>使徒們在信仰的問題上並非一切都明白。例如，他們以爲基督要去做耶路撒冷的王（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L37-39">可 10:37-39</a>），而對基督關於受難和復活的話不明白，又不敢問（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L31-32">可 9:31-32</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L45">路 9:45</a>）。</p><p>但這一切只是在基督復活之日聖靈的恩賜被賜給他們之前（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L21-23">約 20:21-23</a>），以及復活後第五十天之前（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L1-4">徒 2:1-4</a>）。此外，復活之後基督開他們的心竅，使他們能明白聖經（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L45">路 24:45</a>）。基督在復活之前就應許賜使徒無人能駁倒的智慧（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/21/#L15">路 21:15</a>）；使徒後來也講到，上帝賜給他們各樣智慧和知識的恩典（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L8">弗 1:8</a>）。使徒保羅說，他在言語上（表達上）雖然是愚拙的，但在知識上卻不是（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L6">林後 11:6</a>）。</p><p>當新教徒想表明自己在信仰問題上比使徒“更有學識”時，他們引用的是聖靈降臨在使徒身上之前的種種情形。然而這不成立，因爲教會是在這之後建立和設立的，那時使徒們已不再有不明白信仰的情形。</p><p>這樣，在聖靈被差遣之後，使徒們明白信仰的問題，在知識上並不缺乏。即使有什麼不明白的，主也沒有消失——他教導使徒們。例如，他藉異象使徒彼得明白，要給百夫長哥尼流施洗——也就是給非猶太人施洗，儘管這在當時教會的一些人裏引起了疑惑。</p><h3>“應當用心靈和誠實敬拜上帝，而不是在聖殿裏？”</h3><p>如果依著聖經，這裏談的不是聖殿，而是敬拜的地方。</p><blockquote><p>“婦人說：「先生，我看出你是先知。 <strong><mark>我們的祖宗在這山上禮拜</mark></strong>；你們倒說，<strong><mark>應當禮拜的地方是在耶路撒冷</mark></strong>。」 耶穌說：「婦人，你當信我，<strong><mark>時候將到，你們拜父，也不在這山上，也不在耶路撒冷</mark></strong>。 你們所拜的，你們不知道；我們所拜的，我們知道，因爲救恩是從猶太人出來的。 時候將到，如今就是了。<strong><mark>那真正拜父的，要用心靈和誠實拜他</mark></strong>，因爲父要這樣的人拜他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/4/#L19-23">約 4:19-23</a>)</p></blockquote><p>撒瑪利亞婦人用她的問題把基督框起來：在哪裏敬拜？</p><ul><li><p>在基利心山上；</p></li><li><p>在耶路撒冷聖殿裏。</p></li></ul><p>但基督說，時候將到（並且已經到了），那時人們敬拜不在山上，也不在耶路撒冷，而是在心靈和誠實裏：</p><p>這裏談的並不是聖殿，可以看出。而如果有人認爲這裏談的是聖殿，那就請他禁止在山上祈禱，因爲基督說的也有山。那樣禁止聖殿的人，也要禁止山：住在山上嗎？——不要祈禱。當然，這是不合理的。</p><p>還要注意，基督說這種敬拜的時候已經到了。然而基督仍然來到耶路撒冷聖殿，稱它爲父的殿、祈禱的殿，關心在那裏祈禱不受任何攔阻。</p><p>就是說，雖然用心靈和誠實敬拜的時候已經到了，但這並沒有取消聖殿。這座殿被基督撇下成爲空的，只是在以色列多數人棄絕自己的救主之後：基督把葡萄園從先前的園戶（舊約的司祭職）那裏奪去，交給別人——使徒們，並對那些棄絕他的人說，他們的殿要成爲荒場，即上帝的恩典離開它：</p><blockquote><p>“<strong><mark>看哪，你們的家成爲荒場留給你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L38">太 23:38</a>)</p></blockquote><p>基督在十字架上死後，裂開的石頭和撕開的幔子成了這事的標記：</p><blockquote><p>“忽然，<strong><mark>殿裏的幔子從上到下裂爲兩半</mark></strong>，<strong><mark>地也震動，磐石也崩裂</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L51">太 27:51</a>)</p></blockquote><p>從那時起，基督徒在普天之下任何地方祈禱，隨處獻上聖餐禮的新祭：在有建築的地方，也在沒有建築的地方。</p><h3>“既然幔子裂開了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L51">太 27:51</a>），說明上帝離開了聖殿，那爲什麼還需要聖殿？”</h3><p>爲了得救，聖殿（石頭的建築）並不需要。正教會的許多聖人在曠野裏得救。然而，爲了得救必須參與聖奧祕，聖奧祕在事奉聖禮中舉行，而按自然的原因舉行它們需要建築。當然，必要時正教會沒有建築也可以。</p><p>既然有建築，教會就把這地方視爲奉獻給上帝的地方，即聖殿。在這地方人求告上帝的名，在這裏聖奧祕中顯出上帝的恩典，在這裏基督自己在聖餐聖奧祕中親臨。所以正教徒特別敬重這些地方，作爲上帝顯現的地方，正如上帝親自要求尊敬他顯現的地方（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L5">出 3:5</a>），其中包括要求敬重聖殿（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>）。</p><p>舊約聖殿被撕開的幔子表明舊約教會的廢止：表明耶路撒冷的聖殿作爲舊約教會（以色列）與上帝相會的地方已被上帝撇下。葡萄園從舊約教會被奪去（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L43">太 21:43</a>），賜給了基督所建立、改變了約和司祭職的新約教會（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L12">希 7:12</a>）。</p><p>新約教會不使用被撇下的舊約教會的聖殿，不在那裏行事奉聖禮，也不期待上帝在那裏向她顯現。</p><h3>“聖殿只有一個，而且已被毀，所以不能建聖殿？”</h3><p>聖殿被毀不是第一次。那已經是第二座聖殿。而在此之前有可移動的聖殿——會幕，以色列人抬著它在西奈曠野中遷徙。當第一次聖殿被尼布甲尼撒毀掉時，這是否意味著上帝拒絕了在聖殿中敬拜的可能？如果沒有，那爲什麼後來羅馬人再次毀掉它時就應該這樣？</p><p>棄絕基督的猶太人以爲，祈禱和敬拜上帝只能在耶路撒冷聖殿裏。他們把首位殉道者、六品執事司提反召到公會受審，指控他教導說這地方要被毀滅、規矩要改變（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/6/#L13-14">徒 6:13-14</a>）。六品執事的辯護詞在於，詳細列舉聖祖的歷史，表明他們在哪裏都祈禱、向上帝獻祭：他們無論在哪裏，上帝都與他們同在（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L2-53">徒 7:2-53</a>）。</p><p>最後他指出，這座聖殿是所羅門按聖祖大衛的意願和祈禱建造的，儘管上帝清楚地表明，他不需要爲他建造殿宇：</p><blockquote><p>“大衛在上帝面前蒙恩，祈求爲雅各的上帝預備居所； 卻是<strong><mark>所羅門爲上帝造成殿宇</mark></strong>。 <strong><mark>其實，至高者並不住人手所造的</mark></strong>，就如先知所言： 『主說：<strong><mark>天是我的座位，地是我的腳凳</mark></strong>，<strong><mark>你們要爲我造何等的殿宇</mark></strong>？那裏是我安息的地方呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L46-49">徒 7:46-49</a>)</p></blockquote><p>這樣，在舊約訂立之前，義人就在各處祈禱、向上帝獻祭。後來，上帝爲以色列設立了集中的敬拜形式：一座聖殿、一位大祭司，因爲他們在地理上總是彼此相近。這種敬拜形式應當保證上帝所願意的合一。</p><p>但當主按預言（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L18-21">賽 66:18-21</a>）召萬民進入教會時，他也創造了在萬民中、在各處舉行事奉聖禮的條件。他自己成爲大祭司（作爲上帝無所不在），差遣恩典，並把權柄賜給許多人——使徒們（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L18">太 18:18</a>），而不是隻給一個人，不把聖餐的祭綁在任何地方（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19">路 22:19</a>），差遣使徒往普天下去（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L15">可 16:15</a>）。</p><p>基督徒的事奉聖禮正是圍繞聖餐而建立的。爲此聖殿並不需要。那些說我們正教徒行事奉聖禮必須有聖殿的人，只是編造我們並不教導的東西。必要時，事奉聖禮在任何地方舉行：在醫院、在軍隊、在監獄、在乘船、飛機、火車的旅途中、在森林裏。</p><p>我們不教導說，爲了得救需要聖殿（石頭的建築）。正教會的許多聖人在曠野裏得救。然而，爲了得救必須參與聖奧祕，聖奧祕在事奉聖禮中舉行，而按自然的原因舉行它們需要建築。必要時，正教會沒有建築也可以。</p><p>既然有建築，教會就把這地方視爲奉獻給上帝的地方，即聖殿。在這地方人求告上帝的名，在這裏聖奧祕中顯出上帝的恩典，在這裏基督自己在聖餐聖奧祕中親臨。所以正教徒特別敬重這些地方，作爲上帝顯現的地方：</p><blockquote><p>“上帝說：「不要近前來，當把你腳上的鞋脫下來，因爲<strong><mark>你所站之地是聖地</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L5">出 3:5</a>)</p></blockquote><p>上帝也要求敬重他的聖殿（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>）。</p><p>基督的新約教會不教導說，敬拜只能在耶路撒冷，只能在撒瑪利亞山上，甚至只能在聖殿裏。隨處都可以敬拜上帝、向他祈禱。</p><p>---</p><p>正教徒建造聖殿，不是爲了進入舊約或遵守摩西的律法。舊約已經結束，摩西的律法已被廢除。</p><p>我們建造共同聚會的場所，在其中祈禱並獻上祭物。這樣的場所從來沒有人禁止建造。</p><p>舊約的聖殿作爲觀念是重要的。上帝指示按天上實體的樣式建造它。就是說，按上帝的構想，聖殿應當是天的像。</p><p>聖經的一切必要佐證詳見<a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">聖殿——天上實體的象徵</a>。</p><p>在舊約的時代，上帝是看不見的，而在天上的只有天使。</p><p>在新約裏，基督上帝在天上有形地登基，而在天上除了天使，還有人。因此，當基督徒有了聚會的場所時，他們就按上帝先前同樣的構想安排它們——使聖殿描繪天。</p><p>既然天改變了，聖殿也改變了。如今在聖殿裏描繪的是成了肉身的上帝，而除了天使，還描繪天的其他居民——義的衆人。</p><p>上帝從不建造空洞無意義的場所，儘管新教徒常常這樣要求。他安排世界本身，使我們觀看世界時能認識它的造物主。就是說，世界向我們宣講。而聖殿的安排，爲的是宣講基督和他的天國，而不是空洞的白牆。</p><h3>奉獻給聖像的聖殿</h3><p>正教聖殿只以上帝的名建造。在裏面只向上帝行事奉聖禮。百分之九十五的祈禱是向上帝獻上的，其餘的——向他的聖人：天使和天上的義人。</p><p>每一座聖殿都有固定的神聖紀念。例如，有奉獻給基督顯聖容或基督昇天的聖殿。這並不意味著在那裏向顯聖容和昇天的事件祈禱。也有這樣的聖殿，紀念某幅聖像（以奇妙的方式）被賜予，或紀念藉聖像使城市脫離敵人。這是神聖的紀念。當聖殿以神聖紀念之名被稱呼時，這不意味著向神聖紀念祈禱。所有聖殿裏的事奉聖禮都是一樣的。</p>
