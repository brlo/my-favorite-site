  title: 規程、次序、禮規
  copy_cover: true
  body: <h2>定義</h2><p><strong>規程</strong>（希臘文 τάξις）——某種重複性行爲的既定次序。任何有秩序的東西都可以稱爲規程。</p><p><strong>禮規</strong>——某一事奉聖禮之內容的逐項詳細陳述。</p><p>聖奧祕的舉行也按既定的規程進行，或者照另一說法——按禮規。</p><h2>在教會裏凡事都要按規程</h2><blockquote><p>“<strong><mark>凡事都要規規矩矩的按著次序行</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/14/#L40">林前 14:40</a>)</p></blockquote><blockquote><p>“弟兄們，我們奉主耶穌基督的名吩咐你們：<strong><mark>凡有弟兄不按規矩而行</mark></strong>，不遵守從我們所受的教訓，就當遠離他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L6">帖後 3:6</a>)</p></blockquote><blockquote><p>“因我們聽說，在你們中間<strong><mark>有人不按規矩而行，什麼工都不作</mark></strong>，反倒專管閒事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L11">帖後 3:11</a>)</p></blockquote>
