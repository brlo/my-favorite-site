  path: QR18T_基督復活前靈魂下陰間
  title: 在基督復活之前，所有人的靈魂都下到陰間
  copy_cover: true
  body: <h2>舊約的義人論他們死後下到陰間</h2><blockquote><p>“我的日子已經過了，我的謀算、我心所想望的已經斷絕。 他們以黑夜爲白晝說：『亮光近乎黑暗。』 <strong><mark>我若盼望陰間爲我的房屋，若下榻在黑暗中</mark></strong>， 若對朽壞說：『你是我的父』；對蟲說：『你是我的母親姐妹』， 這樣，<strong><mark>我的指望</mark></strong>在那裏呢？我所指望的誰能看見呢？ 等到安息在塵土中，<strong><mark>這指望必下到陰間的門閂那裏了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/17/#L11-16">伯 17:11-16</a>)</p></blockquote><blockquote><p>“他的兒女都起來安慰他，他卻不肯受安慰，說：「<strong><mark>我必悲哀著下陰間到我兒子那裏</mark></strong>。」約瑟的父親就爲他哀哭。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/37/#L35">創 37:35</a>)</p></blockquote><blockquote><p>“在日光之下所行的一切事上，有一件禍患，就是<strong><mark>衆人所遭遇的都是一樣</mark></strong>，並且世人的心充滿了惡。活著的時候心裏狂妄，<strong><mark>後來就歸死人那裏去了</mark></strong>。 <strong><mark>與一切活人相連的，那人還有指望，因爲活著的狗比死了的獅子更強</mark></strong>。 活著的人知道必死，死了的人毫無所知，也不再得賞賜，他們的名無人記念。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/9/#L3-5">傳 9:3-5</a>)</p></blockquote><blockquote><p>“求你想念我的時候是何等的短少。你創造世人，要使他們歸何等的虛空呢！ <strong><mark>誰能常活免死，救他的靈魂脫離陰間的權柄呢</mark></strong>？ <strong><mark>主啊，你從前憑你的信實向大衛立誓，要施行的慈愛在那裏呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/89/#L47-49">詩 89:47-49</a>) <em>(俄文本編號爲 Пс 88:48-50（聖詠編號相差一）。)</em></p></blockquote><h2>基督復活後天上現實的改變</h2><p>要確信在基督之前，死去的義人靈魂並未達到與上帝在天上同活的生命，可以把基督之前的天上現實與基督復活之後的天上現實作一比較。</p><p>在基督之前，天上的現實曾被指示給先知摩西看——在山上，爲要使先知按所看見的樣式在地上建造聖殿（會幕、聖所）：</p><blockquote><p>“<strong><mark>又當爲我造聖所</mark></strong>，使我可以住在他們中間。 製造帳幕和其中的一切器具，<strong><mark>都要照我所指示你的樣式</mark></strong>。 &lt;…&gt; 要謹慎作這些物件，<strong><mark>都要照著在山上指示你的樣式</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L8-9,40">出 25:8-9,40</a>)</p></blockquote><blockquote><p>“因爲基督並不是進了<strong><mark>人手所造的聖所</mark></strong>（<strong><mark>這不過是真聖所的影像</mark></strong>），乃是進了天堂，如今爲我們顯在上帝面前；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>)</p></blockquote><p>觀察舊約聖殿的<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">構造</a>和圖像，我們看到：在基督的祭獻之前，天上只有上帝（不可見地）臨在和聖潔的天使（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L29">王上 6:29</a>）。</p><p>在基督復活和昇天之後，按人性可見的上帝坐在於天上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L21">啟 3:21</a>），天使仍然臨在於那裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3">啟 8:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/15/#L6">啟 15:6</a>），同時義人的靈魂也出現了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1,3-5">啟 14:1,3-5</a>）。我們在神學家約翰的啟示錄中看到這一新的天上現實。</p><p>這樣，在新的天上現實中，除了上帝和天使之外，還出現了義人的靈魂；在基督復活之前，那裏並沒有他們。</p><h3>舊約——聖殿中只有上帝和天使</h3><p>在基督的祭獻之前，舊約中，上帝在山上把聖殿指示給先知摩西看，吩咐他在地上照所指示的樣式製造一切（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L8-9,40">出 25:8-9,40</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>）。最終，摩西建造了聖殿：其中上帝完全不被描繪，而在上帝顯現之處（約櫃的施恩座）周圍，安放著天使的像；同樣，所有的牆壁和幔子上都有天使的圖像。</p><h4>不可見的上帝</h4><p>在奉上帝之命建造的舊約聖殿中，沒有上帝的像，因爲上帝是不可見的。在最主要的地方隻立著約櫃（櫃子），裏面放著聖物；在櫃蓋上、兩個革魯賓之間，上帝顯現並說話：</p><blockquote><p>“<strong><mark>我要在那裏與你相會，又要從法櫃施恩座上，二基路伯中間</mark></strong>，和你說我所要吩咐你傳給以色列人的一切事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L22">出 25:22</a>)</p></blockquote><h4>聖潔的天使</h4><p>聖殿到處充滿了天使（革魯賓）的圖像：</p><blockquote><p>“<strong><mark>要用金子錘出兩個基路伯來，安在施恩座的兩頭</mark></strong>。 這頭作一個基路伯，那頭作一個基路伯。二基路伯要接連一塊，在施恩座的兩頭。 二基路伯要高張翅膀，遮掩施恩座。基路伯要臉對臉，朝著施恩座。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L18-20">出 25:18-20</a>)</p></blockquote><blockquote><p>“<strong><mark>他用橄欖木作兩個基路伯，各高十肘，安在內殿</mark></strong>。 &lt;…&gt; <strong><mark>他將兩個基路伯安在內殿裏</mark></strong>。基路伯的翅膀是張開的，這基路伯的一個翅膀挨着這邊的牆，那基路伯的一個翅膀挨着那邊的牆，裏邊的兩個翅膀，在殿中間彼此相接。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L23,27">王上 6:23,27</a>)</p></blockquote><blockquote><p>“又用藍色、紫色、硃紅色線和細麻織<strong><mark>幔子</mark></strong>，<strong><mark>在其上繡出基路伯來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L14">代下 3:14</a>)</p></blockquote><blockquote><p>“……供餅的供桌、奠酒器、杯盤、金香爐、<strong>帳幔</strong>和冠冕，連聖殿正面的金飾……” (<a href="https://bibleox.com/zh-Hant/cn-sbt/1mak/1/#L22">加上 1:22</a>)</p></blockquote><blockquote><p>“<strong><mark>內殿外殿周圍的牆上，都刻著基路伯、棕樹和初開的花</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L29">王上 6:29</a>)</p></blockquote><p>聖殿構造詳見：<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷聖殿</a>。</p><h3>新約——聖殿中有上帝、天使和義人的靈魂</h3><p>在上帝之子降生成人並戰勝死亡之後，我們看到另一種天上現實。神學家約翰在啟示錄一書中描述了它。首先，上帝成爲可見的，坐在寶座上。其次，在天上事奉他的不再只有天使，還有衆多聖義者的靈魂。</p><h4>基督</h4><blockquote><p>“主耶穌和他們說完了話，後來被接到天上，<strong><mark>坐在上帝的右邊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L19">可 16:19</a>)</p></blockquote><blockquote><p>“就是照他在基督身上所運行的大能大力，使他從死裏復活，<strong><mark>叫他在天上坐在自己的右邊</mark></strong>， 遠超過一切執政的、掌權的、有能的、主治的和一切有名的，不但是今世的，連來世的也都超過了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L20-21">弗 1:20-21</a>)</p></blockquote><blockquote><p>“得勝的，我要賜他<strong><mark>在我寶座上</mark></strong>與我同坐，就如我得了勝，<strong><mark>在我父的寶座上與他同坐</mark></strong>一般。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L21">啟 3:21</a>)</p></blockquote><h4>聖潔的天使</h4><blockquote><p>“<strong><mark>另有一位天使</mark></strong>拿著金香爐，來站在祭壇旁邊。有許多香賜給他，要和衆聖徒的祈禱一同獻在寶座前的金壇上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3">啟 8:3</a>)</p></blockquote><blockquote><p>“<strong><mark>那掌管七災的七位天使</mark></strong>從殿中出來，穿著潔白光明的細麻衣，胸間束著金帶。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/15/#L6">啟 15:6</a>)</p></blockquote><h4>聖義者的靈魂</h4><blockquote><p>“揭開第五印的時候，我看見在祭壇底下，<strong><mark>有爲上帝的道併爲作見證被殺之人的靈魂</mark></strong>， 大聲喊著說：「聖潔真實的主啊！你不審判住在地上的人，給我們伸流血的冤，要等到幾時呢？」 於是<strong><mark>有白衣賜給他們各人</mark></strong>，又有話對他們說：「還要安息片時，<strong><mark>等著一同作僕人的和他們的弟兄，也像他們被殺，滿足了數目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>)</p></blockquote><blockquote><p>“我又觀看，見<strong><mark>羔羊</mark></strong>站在錫安山，同他又有<strong><mark>十四萬四千人</mark></strong>，都有他的名和他父的名寫在額上。 &lt;…&gt; 他們在寶座前，並在四活物和衆長老前唱歌，彷彿是新歌；除了<strong><mark>從地上買來的</mark></strong>那十四萬四千人以外，沒有人能學這歌。 <strong><mark>這些人未曾沾染婦女</mark></strong>，他們原是童身。<strong><mark>羔羊無論往那裏去，他們都跟隨他</mark></strong>。他們是從人間買來的，作初熟的果子歸與上帝和羔羊。 在他們口中察不出謊言來，他們是沒有瑕疵的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1,3-5">啟 14:1,3-5</a>)</p></blockquote><h2>除了從天上降下的子之外，沒有人升過天</h2><blockquote><p>“<strong><mark>除了從天降下仍舊在天的人子，沒有人升過天</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L13">約 3:13</a>)</p></blockquote><blockquote><p>“<strong><mark>弟兄們，先祖大衛的事，我可以明明地對你們說，他死了，也葬埋了</mark></strong>，並且他的墳墓直到今日還在我們這裏。 &lt;…&gt; <strong><mark>大衛並沒有升到天上</mark></strong>，但自己說：『主對我主說：你坐在我的右邊，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L29,34">徒 2:29,34</a>)</p></blockquote><h2>「你必不將我的靈魂撇在陰間」——不是指大衛</h2><p>大衛王在聖詠中說的預言（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/16/#L10">詩 16:10</a>）——靈魂不被撇在陰間、肉身不見朽壞——不是指大衛，而是指基督。因此，大衛王的<strong>肉身</strong>見了朽壞，<strong>靈魂</strong>則被留在陰間，直到基督下到陰間。</p><blockquote><p>“<strong><mark>因你必不將我的靈魂撇在陰間</mark></strong>，也不叫你的聖者見朽壞。 &lt;…&gt; <strong><mark>弟兄們，先祖大衛的事，我可以明明地對你們說，他死了，也葬埋了</mark></strong>，並且他的墳墓直到今日還在我們這裏。 &lt;…&gt; 就預先看明這事，<strong><mark>講論基督復活說</mark></strong>：『<strong><mark>他的靈魂不撇在陰間；他的肉身也不見朽壞</mark></strong>。』 &lt;…&gt; <strong><mark>大衛並沒有升到天上</mark></strong>，但自己說：『主對我主說：你坐在我的右邊，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L27,29,31,34">徒 2:27,29,31,34</a>)</p></blockquote><h2>基督下到陰間，宣講，親自出來，並把義人從陰間領出</h2><p>在陰間，基督向那些從世界洪水時代起就在那裏的神魂（靈魂）宣講：</p><blockquote><p>“因基督也曾一次爲罪受苦，就是義的代替不義的，爲要引我們到上帝面前。<strong><mark>按著肉體說，他被治死；按著靈性說，他復活了</mark></strong>。 <strong><mark>他藉這靈曾去傳道給那些在監獄裏的靈聽</mark></strong>， 就是那從前在挪亞預備方舟、上帝容忍等待的時候，不信從的人。當時進入方舟，藉着水得救的不多，只有八個人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L18-20">彼前 3:18-20</a>)</p></blockquote><blockquote><p>“他們必在那將要審判活人死人的主面前交賬。 爲此，<strong><mark>就是死人也曾有福音傳給他們</mark></strong>，要叫他們的肉體按著人受審判，他們的靈性卻靠上帝活著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L5-6">彼前 4:5-6</a>)</p></blockquote><h2>義人曾被囚於陰間，但基督摧毀了這一囚禁</h2><blockquote><p>“所以經上說：『他升上高天的時候，<strong><mark>擄掠了仇敵</mark></strong>，將各樣的恩賜賞給人。』 （<strong><mark>既說升上，豈不是先降在地下嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L8-9">弗 4:8-9</a>)</p></blockquote><blockquote><p>“我一看見，就仆倒在他腳前，像死了一樣。他用右手按著我說：「不要懼怕！我是首先的，我是末後的， 又是那存活的。我曾死過，現在又活了，直活到永永遠遠，並且<strong><mark>拿著死亡和陰間的鑰匙</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L17-18">啟 1:17-18</a>)</p></blockquote><h2>所有舊約的義人都沒有得到所應許的；若沒有新約的人，他們就不能達到完全</h2><p>他們期待並追求天上的事，但沒有得到：</p><blockquote><p>“信就是<strong>所望之事的實底</strong>，是未見之事的確據。 古人在這信上得了美好的證據。 &lt;…&gt; 亞伯因著信，獻祭與上帝，比該隱所獻的更美，因此便得了稱義的見證，就是上帝指他禮物作的見證。他雖然死了，卻因這信，仍舊說話。 以諾因著信，被接去，不至於見死，人也找不著他，因爲上帝已經把他接去了。只是他被接去以先，已經得了上帝喜悅他的明證。 &lt;…&gt; 挪亞因著信，既蒙上帝指示他未見的事，動了敬畏的心，預備了一隻方舟，使他全家得救。因此就定了那世代的罪，自己也承受了那從信而來的義。 亞伯拉罕因著信，蒙召的時候，就遵命出去，往將來要得爲業的地方去；出去的時候，還不知往那裏去。 <strong><mark>他因著信，就在所應許之地作客，好像在異地居住帳棚</mark></strong>，與那同蒙一個應許的以撒、雅各一樣。 <strong><mark>因爲他等候那座有根基的城，就是上帝所經營、所建造的</mark></strong>。 因著信，連撒拉自己，雖然過了生育的歲數，還能懷孕，因他以爲那應許他的是可信的。 &lt;…&gt; <strong><mark>這些人都是存著信心死的，並沒有得著所應許的</mark></strong>，<strong><mark>卻從遠處望見，且歡喜迎接</mark></strong>，又承認自己在世上是客旅，是寄居的。 說這樣話的人，是表明自己要找一個家鄉。 他們若想念所離開的家鄉，還有可以回去的機會。 <strong><mark>他們卻羨慕一個更美的家鄉，就是在天上的</mark></strong>。所以上帝被稱爲他們的上帝，並不以爲恥，<strong><mark>因爲他已經給他們預備了一座城</mark></strong>。 亞伯拉罕因著信，被試驗的時候，就把以撒獻上；這便是那歡喜領受應許的，將自己獨生的兒子獻上。 &lt;…&gt; 以撒因著信，就指著將來的事給雅各、以掃祝福。 雅各因著信，臨死的時候，給約瑟的兩個兒子各自祝福，扶著杖頭敬拜上帝。 約瑟因著信，臨終的時候，提到以色列族將來要出埃及，併爲自己的骸骨留下遺命。 摩西生下來，他的父母見他是個俊美的孩子，就因著信，把他藏了三個月，並不怕王命。 &lt;…&gt; 我又何必再說呢？若要一一細說，基甸、巴拉、參孫、耶弗他、大衛，撒母耳和衆先知的事，時候就不夠了。 &lt;…&gt; <strong><mark>這些人都是因信得了美好的證據，卻仍未得著所應許的</mark></strong>。 因爲上帝給我們預備了更美的事，<strong><mark>叫他們若不與我們同得，就不能完全</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L1-2,4-5,7-11,13-17,20-23,32,39-40">希 11:1-2,4-5,7-11,13-17,20-23,32,39-40</a>)</p></blockquote><h2>基督的祭獻使信教的義人脫離先前所犯的罪</h2><blockquote><p>“我們曉得律法上的話，都是對律法以下之人說的，好塞住各人的口，叫普世的人都伏在上帝審判之下。 所以<strong><mark>凡有血氣的，沒有一個因行律法能在上帝面前稱義</mark></strong>，因爲律法本是叫人知罪。 <strong><mark>但如今，上帝的義在律法以外已經顯明出來</mark></strong>，有律法和先知爲證： 就是上帝的義，<strong><mark>因信耶穌基督加給一切相信的人</mark></strong>，<strong><mark>並沒有分別</mark></strong>。 <strong><mark>因爲世人都犯了罪，虧缺了上帝的榮耀</mark></strong>； 如今卻蒙上帝的恩典，<strong><mark>因基督耶穌的救贖</mark></strong>，<strong><mark>就白白的稱義</mark></strong>。 <strong><mark>上帝設立耶穌作挽回祭</mark></strong>，是憑著耶穌的血，藉着人的信，要顯明上帝的義。因爲他用忍耐的心，<strong><mark>寬容人先時所犯的罪</mark></strong>， <strong><mark>好在今時顯明他的義</mark></strong>，使人知道他自己爲義，也稱信耶穌的人爲義。 既是這樣，那裏能誇口呢？沒有可誇的了！用何法沒有的呢？是用立功之法嗎？不是，乃用信主之法。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L19-27">羅 3:19-27</a>)</p></blockquote>
