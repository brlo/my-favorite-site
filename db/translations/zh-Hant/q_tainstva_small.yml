- src: исповедь
  path: QT3A_告解（懺悔）
  title: 告解（懺悔）
  copy_cover: true
  body: <h2>舊約中的認罪</h2><p>在舊約的教會裏，上帝親自設立了在聖殿裏、在司祭面前的告解，並藉司祭潔淨罪：</p><blockquote><p>“他有了罪的時候，<strong><mark>就要承認所犯的罪</mark></strong>， 並要因所犯的罪，把他的贖愆祭牲，就是羊羣中的母羊，或是一隻羊羔，或是一隻山羊，牽到耶和華面前爲贖罪祭。至於他的罪，<strong><mark>祭司要爲他贖了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/5/#L5-6">利 5:5-6</a>)</p></blockquote><blockquote><p>“遮掩自己罪過的，必不亨通；<strong><mark>承認離棄罪過的，必蒙憐恤</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/28/#L13">箴 28:13</a>)</p></blockquote><h2>新約中的認罪</h2><h3>司祭職有權赦罪</h3><p>上帝更換了司祭職（詳見<a href="https://bibleox.com/ru/ru/w/Таинство-Священства">司祭聖奧祕</a>）：</p><blockquote><p>“<strong><mark>祭司的職任既已更改，律法也必須更改</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L12">希 7:12</a>)</p></blockquote><p>把赦罪之權賜給新的司祭職：</p><blockquote><p>“我要把天國的鑰匙給你，凡你在地上所捆綁的，在天上也要捆綁；<strong><mark>凡你在地上所釋放的，在天上也要釋放</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L19">太 16:19</a>)</p></blockquote><blockquote><p>“我實在告訴你們：凡你們在地上所捆綁的，在天上也要捆綁；<strong><mark>凡你們在地上所釋放的，在天上也要釋放</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L18">太 18:18</a>)</p></blockquote><blockquote><p>“說了這話，就向他們吹一口氣，說：「你們受聖靈。 <strong><mark>你們赦免誰的罪，誰的罪就赦免了</mark></strong>；<strong><mark>你們留下誰的罪，誰的罪就留下了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L22-23">約 20:22-23</a>)</p></blockquote><p>因司祭職的祈禱，罪得赦免：</p><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名<strong><mark>用油抹他</mark></strong>，爲他禱告。 出於信心的祈禱要救那病人，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><p>司祭職被立爲教會的守護者：</p><blockquote><p>“保羅從米利都打發人往以弗所去，<strong><mark>請教會的長老來</mark></strong>。 他們來了，保羅就說：「你們知道，自從我到亞西亞的日子以來，在你們中間始終爲人如何， &lt;…&gt; <strong><mark>聖靈立你們作全羣的監督</mark></strong>，你們就當爲自己謹慎，也爲全羣謹慎，<strong><mark>牧養上帝的教會</mark></strong>，就是他用自己血所買來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><h3>告解在教會裏得以保存</h3><p>在新舊約交界處，人們來到先知施洗約翰面前，也認自己的罪：</p><blockquote><p>“照這話，約翰來了，在曠野施洗，<strong><mark>傳悔改的洗禮，使罪得赦</mark></strong>。 猶太全地和耶路撒冷的人都出去到約翰那裏，<strong><mark>承認他們的罪</mark></strong>，在約但河裏受他的洗。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L4-5">可 1:4-5</a>)</p></blockquote><p>告解在教會裏得以保存：</p><blockquote><p>“那已經信的，多有人來<strong><mark>承認訴說自己所行的事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L18">徒 19:18</a>)</p></blockquote><h3>信徒在得著真信仰之後，後來仍需要新的罪的赦免</h3><p>真信徒能使鄰人從迷路上轉回，並以此遮蓋自己的許多罪：</p><blockquote><p>“我的弟兄們，你們中間若有失迷真道的，<strong><mark>有人使他迴轉</mark></strong>； 這人該知道<strong><mark>叫一個罪人從迷路上轉回</mark></strong>，便是救一個靈魂不死，並且<strong><mark>遮蓋許多的罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L19-20">雅 5:19-20</a>)</p></blockquote><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名<strong><mark>用油抹他</mark></strong>，爲他禱告。 出於信心的祈禱要救那病人，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><h2>主不拒絕悔改的人</h2><p>上帝總是預備接納罪人的悔改，無論他犯了多重的罪</p><blockquote><p>“上帝所要的祭，就是憂傷的靈；上帝阿！<strong><mark>憂傷痛悔的心，你必不輕看</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/51/#L17">詩 51:17</a>)</p></blockquote><blockquote><p>“凡父所賜給我的人，必到我這裏來；<strong><mark>到我這裏來的，我總不丟棄他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L37">約 6:37</a>)</p></blockquote>
