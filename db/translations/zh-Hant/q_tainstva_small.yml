- src: елеосвящение-соборование
  path: QT2A_病人傅油（終傅）
  title: 病人傅油（終傅）
  copy_cover: true
  body: <p><strong>病人傅油</strong>（終傅）——教會的聖奧祕，由司祭團（在極特殊情形下由一位司祭）在病人身上舉行，在於藉祈禱和以聖油膏抹病人，呼求醫治的、潔淨的恩典，醫治身體和心靈上的軟弱。</p><p><strong>聖經引文：</strong></p><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名<strong><mark>用油抹他</mark></strong>，爲他禱告。 <strong><mark>出於信心的祈禱要救那病人</mark></strong>，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><blockquote><p>“門徒就出去傳道，叫人悔改； 又趕出許多的鬼，<strong><mark>用油抹了許多病人，治好他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L12-13">可 6:12-13</a>)</p></blockquote><blockquote><p>“耶穌叫了十二個門徒來，<strong><mark>給他們權柄，能趕逐污鬼，並醫治各樣的病症</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L1">太 10:1</a>)</p></blockquote><blockquote><p>“<strong><mark>醫治病人</mark></strong>，叫死人復活，叫長大痲瘋的潔淨，把鬼趕出去。<strong><mark>你們白白的得來，也要白白的捨去</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L8">太 10:8</a>)</p></blockquote>
