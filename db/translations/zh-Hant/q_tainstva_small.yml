  title: 婚配（婚姻）
  copy_cover: true
  body: <h2>定義</h2><p><strong>婚姻</strong>——教會七個聖奧祕之一，在其中求上帝祝福自願的夫妻聯合——它建立在夫妻彼此相愛之上，按基督和他的教會之屬靈聯合的樣式。</p><h2>聖經引文</h2><p>在婚姻中舉行上帝所行做的聖奧祕：</p><blockquote><p>“耶和華上帝說：「<strong><mark>那人獨居不好</mark></strong>，我要爲他造一個配偶幫助他。」 &lt;…&gt; <strong><mark>耶和華上帝就用那人身上所取的肋骨造成一個女人</mark></strong>，領她到那人跟前。 &lt;…&gt; 因此，<strong><mark>人要離開父母，與妻子連合，二人成爲一體</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L18,22,24">創 2:18,22,24</a>)</p></blockquote><blockquote><p>“有法利賽人來問他說：「人休妻可以不可以？」意思要試探他。 耶穌回答說：「摩西吩咐你們的是什麼？」 他們說：「摩西許人寫了休書便可以休妻。」 耶穌說：「摩西因爲你們的心硬，所以寫這條例給你們。 但從起初創造的時候，上帝造人是造男造女。 因此，人要離開父母，與妻子連合，二人成爲一體。 <strong><mark>既然如此，夫妻不再是兩個人，乃是一體的了</mark></strong>。 所以<strong><mark>上帝配合的，人不可分開</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L2-9">可 10:2-9</a>)</p></blockquote><blockquote><p>“豈不知你們的身子是基督的肢體嗎？我可以將基督的肢體作爲娼妓的肢體嗎？斷乎不可！ 豈不知<strong><mark>與娼妓聯合的，便是與她成爲一體嗎</mark></strong>？因爲主說：『<strong><mark>二人要成爲一體</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L15-16">林前 6:15-16</a>)</p></blockquote><blockquote><p>“<strong><mark>丈夫也當照樣愛妻子</mark></strong>，如同愛自己的身子，愛妻子便是愛自己了。 &lt;…&gt; 爲這個緣故，人要離開父母，與妻子連合，二人成爲一體。 <strong><mark>這是極大的奧祕</mark></strong>，<strong><mark>但我是指著基督和教會說的</mark></strong>。 然而你們各人都當愛妻子，如同愛自己一樣；<strong><mark>妻子也當敬重他的丈夫</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L28,31-33">弗 5:28,31-33</a>)</p></blockquote><h2>一世紀教會婚姻祝福</h2><h3>聖伊格那提·懷上帝者（約37-107）</h3><p>“凡娶妻嫁人的，<strong>必須與主教的同意聯合</strong>，好叫婚姻在主裏面，而不是出於情慾”</p><p>（<a href="https://bibleox.com/ru/ru/w/ИгнАн_Пк">致波利卡普書</a> 第28節）</p>
