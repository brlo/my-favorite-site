  title: 分裂（分門別類）
  copy_cover: true
  body: <h2>基督和使徒對教會有形合一的旨意</h2><blockquote><p>“<strong><mark>我不但爲這些人祈求</mark></strong>，也爲那些因他們的話信我的人祈求， <strong><mark>使他們都合而爲一</mark></strong>；正如你父在我裏面，我在你裏面，使他們也在我們裏面，<strong><mark>叫世人可以信你差了我來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，<strong><mark>勸你們都說一樣的話</mark></strong>。<strong><mark>你們中間也不可分黨</mark></strong>，<strong><mark>只要一心一意</mark></strong>，彼此相合。 因爲革來氏家裏的人曾對我提起弟兄們來，說你們中間有紛爭。 我的意思就是你們各人說：『我是屬保羅的』，『我是屬亞波羅的』，『我是屬磯法的』，『我是屬基督的』。 <strong><mark>基督是分開的嗎</mark></strong>？保羅爲你們釘了十字架嗎？你們是奉保羅的名受了洗嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10-13">林前 1:10-13</a>)</p></blockquote><blockquote><p>“有說：「我是屬保羅的。」有說：「我是屬亞波羅的。」<strong><mark>這豈不是你們和世人一樣嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L4">林前 3:4</a>)</p></blockquote><p>上帝安排身體（教會）的肢體，使沒有分裂，衆人卻彼此相顧，一同受苦，一同快樂：</p><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong><mark>都從一位聖靈受洗，成了一個身體</mark></strong>，飲於一位聖靈。 <strong><mark>身子原不是一個肢體，乃是許多肢體</mark></strong>。 &lt;…&gt; <strong><mark>眼不能對手說</mark></strong>：「我用不著你。」頭也不能對腳說：「我用不著你。」 不但如此，身上肢體，人以爲軟弱的，更是不可少的。 身上肢體，我們看爲不體面的，越發給它加上體面；不俊美的，越發得著俊美。 我們俊美的肢體，自然用不著裝飾；<strong><mark>但上帝配搭這身子</mark></strong>，把加倍的體面給那有缺欠的肢體， <strong><mark>免得身上分門別類，總要肢體彼此相顧</mark></strong>。 <strong><mark>若一個肢體受苦，所有的肢體就一同受苦</mark></strong>；若一個肢體得榮耀，所有的肢體就一同快樂。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13-14,21-26">林前 12:13-14,21-26</a>)</p></blockquote><p>這些不同的肢體是什麼？——是教會中不同的職分和恩賜：</p><blockquote><p>“<strong><mark>就如身子是一個，卻有許多肢體</mark></strong>；而且肢體雖多，仍是一個身子。基督也是這樣。 &lt;…&gt; <strong><mark>身子原不是一個肢體，乃是許多肢體</mark></strong>。 &lt;…&gt; <strong><mark>你們就是基督的身子</mark></strong>，並且各自作肢體。 <strong><mark>上帝在教會所設立的：第一是使徒，第二是先知，第三是教師</mark></strong>，其次是行異能的，再次是得恩賜醫病的，幫助人的，治理事的，說方言的。 <strong><mark>豈都是使徒嗎</mark></strong>？豈都是先知嗎？豈都是教師嗎？豈都是行異能的嗎？ 豈都是得恩賜醫病的嗎？豈都是說方言的嗎？豈都是繙方言的嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L12,14,27-30">林前 12:12,14,27-30</a>)</p></blockquote><p>這樣，上帝安排這一切職分和恩賜，爲使身體中沒有分裂；使徒在書信開頭就防止了這種分裂（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10-13">林前 1:10-13</a>）。也就是說，上帝不但願意合一（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>），而且眷顧此事。看，使徒被上帝立爲僕人，眷顧有形的合一，禁止哥林多人制造有形的分裂。</p><h2>教會中的分裂——堵住人進入上帝之國之路的罪</h2><blockquote><p>“情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、<strong><mark>結黨</mark></strong>、紛爭、異端、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>) <em>(「結黨」（διχοστασίαι）——分裂、分爲兩部分。)</em></p></blockquote><blockquote><p>“弟兄們，<strong><mark>那些離間你們、叫你們跌倒、背乎所學之道的人</mark></strong>，我勸你們要留意躲避他們。 <strong><mark>因爲這樣的人不服事我們的主基督</mark></strong>，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><h2>關於分裂的預言</h2><blockquote><p>“他們曾對你們說過：『<strong><mark>末世必有好譏誚的人</mark></strong>隨從自己不敬虔的私欲而行。』 <strong><mark>這就是那些引人結黨、屬乎血氣、沒有聖靈的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L18-19">猶 1:18-19</a>)</p></blockquote><blockquote><p>“小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來，<strong><mark>現在已經有好些敵基督的出來了</mark></strong>，從此我們就知道如今是末時了。 <strong><mark>他們從我們中間出去，卻不是屬我們的</mark></strong>；若是屬我們的，就必仍舊與我們同在；他們出去顯明都不是屬我們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18-19">約壹 2:18-19</a>)</p></blockquote><h2>分裂的例子</h2><blockquote><p>“我曾略略的寫信給教會，<strong><mark>但那在教會中好爲首的丟特腓不接待我們</mark></strong>。 所以我若去，必要提說他所行的事，就是<strong><mark>他用惡言妄論我們</mark></strong>。還不以此爲足，他自己不接待弟兄，有人願意接待，他也禁止，<strong><mark>並且將接待弟兄的人趕出教會</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3in/1/#L9-10">約叁 1:9-10</a>)</p></blockquote><h2>使徒們阻止分裂的企圖</h2><blockquote><p>“因爲革來氏家裏的人曾對我提起弟兄們來，<strong><mark>說你們中間有紛爭</mark></strong>。 <strong><mark>我的意思就是你們各人說</mark></strong>：『我是屬保羅的』，『我是屬亞波羅的』，『我是屬磯法的』，『我是屬基督的』。 <strong><mark>基督是分開的嗎</mark></strong>？保羅爲你們釘了十字架嗎？你們是奉保羅的名受了洗嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L11-13">林前 1:11-13</a>)</p></blockquote><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，<strong><mark>勸你們都說一樣的話</mark></strong>。<strong><mark>你們中間也不可分黨</mark></strong>，只要一心一意，彼此相合。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>)</p></blockquote><blockquote><p>“<strong><mark>免得身上分門別類，總要肢體彼此相顧</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L25">林前 12:25</a>)</p></blockquote>
