  title: 關於基督的預言
  copy_cover: true
  body: <h2>預言</h2><ol><li><p>到基督來臨爲止的天數（<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/9/#L24-25">但 9:24-25</a>）；</p></li><li><p>基督將在<strong>第二座</strong>耶路撒冷聖殿來臨（那殿如今已不存在，<a href="https://bibleox.com/zh-Hant/cn-cuvt/ag/2/#L9">該 2:9</a>）；</p></li><li><p>基督來臨之時，猶大支派已失去權柄（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/49/#L10">創 49:10</a>）。大希律一世是以東人，即以掃的後裔，不是猶太人。他取代了馬加伯所屬的哈斯蒙尼猶太王朝。</p></li><li><p>基督將生在伯利恆（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mih/5/#L2">彌 5:2</a>）；</p></li><li><p>基督將是大衛的後裔（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/89/#L4-6,29-31,37">詩 89:4-6,29-31,37</a>）；</p></li><li><p>基督將締立新約（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/42/#L6">賽 42:6</a>）。與上帝立的一切約都以血爲憑，而這一次——是以耶穌基督自己的血；</p></li><li><p>基督將因三十塊錢被出賣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/11/#L12-13">亞 11:12-13</a>）；</p></li><li><p>基督將與強盜一同被處死（<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/9/#L26">但 9:26</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/53/#L12">賽 53:12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/12/#L10">亞 12:10</a>）；</p></li><li><p>他的手和腳要被扎透（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/22/#L16">詩 22:16</a>）；他要被扎透（用槍）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/12/#L10">亞 12:10</a>）（對批評的回答見下文）；</p></li><li><p>路過的人將譏誚基督，說：他既倚靠上帝，上帝若喜悅他，現在可以救他（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/22/#L7-8">詩 22:7-8</a>）</p></li><li><p>基督被處死之後，耶路撒冷和聖殿將被毀滅（<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/9/#L26">但 9:26</a>）；</p></li><li><p>先知以賽亞論及基督救贖性苦難的整章：<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/53/">賽 53</a>:</p></li></ol><blockquote><p>“哪知他<strong><mark>爲我們的過犯受害</mark></strong>，<strong><mark>爲我們的罪孽壓傷</mark></strong>。<strong><mark>因他受的刑罰，我們得平安</mark></strong>；<strong><mark>因他受的鞭傷，我們得醫治</mark></strong>。 <strong><mark>我們都如羊走迷，各人偏行己路</mark></strong>。<strong><mark>耶和華使我們衆人的罪孽都歸在他身上</mark></strong>。 他被欺壓，在受苦的時候卻不開口。<strong><mark>他像羊羔被牽到宰殺之地</mark></strong>，又像羊在剪毛的人手下無聲，他也是這樣不開口。 因受欺壓和審判，他被奪去，至於他同世的人，誰想他受鞭打、從活人之地被剪除，是因我百姓的罪過呢？ 他雖然未行強暴，口中也沒有詭詐，人還使他與惡人同埋；誰知死的時候<strong><mark>與財主同葬</mark></strong>。 <strong><mark>耶和華卻定意將他壓傷</mark></strong>，使他受痛苦；<strong><mark>耶和華以他爲贖罪祭</mark></strong>。<strong><mark>他必看見後裔</mark></strong>，並且延長年日，<strong><mark>耶和華所喜悅的事必在他手中亨通</mark></strong>。 <strong><mark>他必看見自己勞苦的功效，便心滿意足</mark></strong>。<strong><mark>有許多人因認識我的義僕得稱爲義</mark></strong>，並且<strong><mark>他要擔當他們的罪孽</mark></strong>。 所以，我要使他與位大的同分，與強盛的均分擄物。<strong><mark>因爲他將命傾倒，以致於死</mark></strong>。<strong><mark>他也被列在罪犯之中</mark></strong>。<strong><mark>他卻擔當多人的罪，又爲罪犯代求</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/53/#L5-12">賽 53:5-12</a>)</p></blockquote><h2>基督苦難的預像</h2><ol><li><p>上帝設立了受封爲大祭司的禮儀：大祭司和衆祭司把手按在公牛身上，然後在會幕門口宰殺它（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L10-11">出 29:10-11</a>）。同樣，大祭司和祭司們密謀在夜裏捉拿基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L45-47">太 26:45-47</a>），後來在耶路撒冷城門口處死了他（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L12">希 13:12</a>）。</p></li><li><p>再者，就在同一處。用公牛的血抹在壇的四角上，把血都倒在壇腳那裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L12">出 29:12</a>）。基督被獻爲祭的壇，就是十字架。基督的血抹在十字架上，因爲基督的手和腳被釘子釘穿，後來又被槍扎透，血流到十字架（壇）的根基處。</p></li><li><p>受封禮儀結束之後，壇就成爲大聖物：凡挨着壇的都成爲聖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L37">出 29:37</a>）。同樣，十字架（壇）在基督徒中成爲大聖物，用來祝聖水、物件、人。它作爲器物用於祝聖水的過程，人們也用手畫十字聖號在人和物件上。</p></li></ol><h2>關於基督苦難的預言</h2><ol><li><p>基督將自稱上帝之子；</p></li><li><p>他的話語和行爲將指摘他的反對者；</p></li><li><p>他將稱上帝爲自己的父；</p></li><li><p>基督的反對者將凌辱並折磨他；</p></li><li><p>他們將判他受可恥的死刑。</p></li></ol><blockquote><p>“我們要陷害義人，因爲他太令我們討厭，反對我們的作爲，<strong>指責我們違犯法律</strong>，控訴我們品行不檢，<strong>自誇認識天主</strong>，<strong>自稱是上主的僕人</strong>；他竟<strong>充作我們思想的裁判員</strong>，我們一見他，就感覺討厭；因爲他的生活與衆不同，他的行徑與人兩樣。他竟將我們視作雜種，遠避我們的行徑，像遠避不潔之物；聲言義人有幸福的結局，且<strong>自誇有天主爲父</strong>。我們且看他的話是否屬實，看他究有什麼結局。因爲，<strong>如果義人是天主的兒子，天主定要幫助他，拯救他脫離敵人的手</strong>。<strong>來罷！我們用恥辱和酷刑試驗他</strong>，查看他是否溫良，考驗他是否忍耐。<strong>我們判他受可恥的死刑</strong>，看他是否蒙受眷顧，如他所說的一樣。他們這樣思想真是荒謬，因爲邪惡使他們喪失了理智，” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/2/#L12-21">智 2:12-21</a>)</p></blockquote><h2>批評</h2><h3>手和腳是被扎透了，還是被獅子撕扯？</h3><p>晚期的馬所拉文本在<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/22/#L16">詩 22:16</a>中沒有關於手和腳被扎透的話。那裏用的詞是「獅子」（כָּאֲרִי）。「撕扯」（動詞）一詞在文本中根本沒有，而且獅子所作的事與手和腳有什麼關係也不清楚。</p><p>然而，正確的還是「扎透了」。在庫姆蘭古卷4Q88[2]中確認了手和腳被扎透。</p><p>此外，還有另一處預言說到正是被扎透。它在這裏被提及：</p><blockquote><p>“經上又有一句說：『<strong><mark>他們要仰望自己所扎的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L37">約 19:37</a>)</p></blockquote><p>這裏的出處：</p><blockquote><p>“我必將那施恩叫人懇求的靈，澆灌大衛家和耶路撒冷的居民．他們必仰望我，<strong><mark>就是他們所扎的</mark></strong>；必爲我悲哀，如喪獨生子，又爲我愁苦，如喪長子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/12/#L10">亞 12:10</a>)</p></blockquote><blockquote><p>“וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ <strong>דָּקָרוּ</strong> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃” (<a href="https://bibleox.com/zh-Hans/heb-osm/zah/12/#L10">撒迦利亞書 12:10（希伯來文）</a>)</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר——扎透、刺穿；以及：被刺穿、被扎透。</p><p>庫姆蘭卷軸4Q80確認：是被扎透了。</p>
