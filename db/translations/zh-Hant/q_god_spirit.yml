  path: Qg19A_聖靈是有位格的
  title: 聖靈是有位格的
  copy_cover: true
  body: <h2>聖靈用第一人稱講論自己</h2><blockquote><p>“彼得還思想那異象的時候，<strong>聖靈向他說</strong>：「有三個人來找你。 起來，下去，和他們同往，不要疑惑！因爲<strong><mark>是我差他們來的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L19-20">徒 10:19-20</a>) <em>(希臘文原文強調代詞 ἐγώ（我）)</em></p></blockquote><blockquote><p>“他們事奉主，禁食的時候，<strong>聖靈說</strong>：「<strong><mark>要爲我</mark></strong>分派巴拿巴和掃羅，去<strong>作我召他們所作的工</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2">徒 13:2</a>) <em>(希臘文原文強調代詞 μοι（爲我）)</em></p></blockquote><h2>聖靈說話</h2><blockquote><p>“<strong>聖靈對腓利說</strong>：「你去貼近那車走。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L29">徒 8:29</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L19-20">徒 10:19-20</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2">徒 13:2</a>)</p></blockquote><h2>聖靈思想並代求</h2><blockquote><p>“鑑察人心的，曉得<strong>聖靈的意思</strong>，因爲聖靈照著上帝的旨意<strong>替聖徒祈求</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L27">羅 8:27</a>)</p></blockquote><h2>聖靈隨自己的意思行事</h2><blockquote><p>“這一切都是這位<strong>聖靈</strong>所運行、<strong>隨己意</strong>分給各人的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L11">林前 12:11</a>)</p></blockquote><h2>聖靈藉先知說話</h2><blockquote><p>“他們彼此不合，就散了。未散以先，保羅說了一句話，說：「<strong>聖靈</strong><strong>藉先知以賽亞</strong>向你們祖宗所說的話是不錯的。 他說，『你去告訴這百姓說，你們聽是要聽見，卻不明白．看是要看見，卻不曉得。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/28/#L25-26">徒 28:25-26</a>)</p></blockquote><blockquote><p>“<strong>聖靈有話說</strong>，『你們今日若聽他的話，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/3/#L7">希 3:7</a>)</p></blockquote><h2>從人心裏呼叫父</h2><blockquote><p>“你們既爲兒子，上帝就<strong>差他兒子的靈</strong>進入你們的心，<strong>呼叫</strong>：「<strong>阿爸，父！</strong>」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L6">加 4:6</a>)</p></blockquote><h2>聽見</h2><blockquote><p>“只等真理的聖靈來了，他要引導你們明白一切的真理，因爲他不是憑自己說的，乃是<strong>把他所聽見的</strong>都說出來，並要把將來的事告訴你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L13">約 16:13</a>)</p></blockquote><h2>定意</h2><blockquote><p>“因爲<strong>聖靈和我們定意</strong>不將別的重擔放在你們身上，惟有幾件事是不可少的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L28">徒 15:28</a>)</p></blockquote><h2>住在</h2><blockquote><p>“豈不知你們是上帝的殿，<strong>上帝的靈住在你們裏頭</strong>嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L16">林前 3:16</a>)</p></blockquote><h2>指明</h2><blockquote><p>“<strong>聖靈用此指明</strong>，頭一層帳幕仍存的時候，進入至聖所的路還未顯明。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L8">希 9:8</a>)</p></blockquote><h2>作見證</h2><blockquote><p>“<strong>聖靈也對我們作見證</strong>，因爲他既已說過：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L15">希 10:15</a>)</p></blockquote><h2>受試探</h2><blockquote><p>“彼得說：「你們爲甚麼<strong>同心試探主的靈</strong>呢？埋葬你丈夫之人的腳已到門口，他們也要把你抬出去。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L9">徒 5:9</a>)</p></blockquote><h2>被褻慢</h2><blockquote><p>“何況人踐踏上帝的兒子，將那使他成聖之約的血當作平常，又<strong>褻慢施恩的聖靈</strong>，你們想，他要受的刑罰該怎樣加重呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L29">希 10:29</a>)</p></blockquote><h2>被褻瀆</h2><blockquote><p>“所以我告訴你們：人一切的罪和褻瀆的話，都可得赦免；惟獨<strong>褻瀆聖靈</strong>，總不得赦免。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L31">太 12:31</a>)</p></blockquote><h2>受欺哄</h2><blockquote><p>“彼得說：「亞拿尼亞，爲什麼撒但充滿了你的心，叫你<strong>欺哄聖靈</strong>，把田地的價銀私自留下幾分呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L3">徒 5:3</a>)</p></blockquote><h2>遭抗拒</h2><blockquote><p>“你們這硬著頸項、心與耳未受割禮的人，常時<strong>抗拒聖靈</strong>；你們的祖宗怎樣，你們也怎樣！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L51">徒 7:51</a>)</p></blockquote>
  meta_desc: 聖靈始終作爲位格行動：說話、聽見、定意、指明、受試探、被褻瀆、受欺哄、遭抗拒
