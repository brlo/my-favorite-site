  title: 聖靈是上帝
  copy_cover: true
  body: <h2>聖靈是上帝</h2><blockquote><p>“「靈就是上帝」（希臘文：πνεῦμα ὁ θεός）” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/in/4/#L24">約 4:24</a>, 譯自希臘文)</p></blockquote><h2>亞拿尼亞欺哄了聖靈——上帝</h2><blockquote><p>“彼得說：「亞拿尼亞，爲什麼撒但充滿了你的心，叫你<strong><mark>欺哄聖靈</mark></strong>，把田地的價銀私自留下幾分呢？ 田地還沒有賣，不是你自己的嗎？既賣了，價銀不是你作主嗎？你怎麼心裏起這意念呢？你不是欺哄人，是<strong><mark>欺哄上帝</mark></strong>了！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L3-4">徒 5:3-4</a>)</p></blockquote><h2>上帝藉先知說話</h2><blockquote><p>“<strong><mark>上帝</mark></strong>既在古時<strong><mark>藉着衆先知</mark></strong>多次多方的<strong>曉諭</strong>列祖，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L1">希 1:1</a>)</p></blockquote><blockquote><p>“這福音是<strong><mark>上帝</mark></strong>從前<strong><mark>藉衆先知</mark></strong>在聖經上所<strong>應許</strong>的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L2">羅 1:2</a>)</p></blockquote><blockquote><p>“但<strong><mark>上帝</mark></strong>曾<strong><mark>藉衆先知的口</mark></strong>，預言基督將要受害，就這樣應驗了。 &lt;…&gt; 天必留他，等到萬物復興的時候，就是<strong><mark>上帝從創世以來，藉着聖先知的口所說的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/3/#L18,21">徒 3:18,21</a>)</p></blockquote><h2>藉先知說話的是聖靈</h2><blockquote><p>“他們彼此不合，就散了。未散以先，保羅說了一句話，說：「<strong><mark>聖靈</mark></strong><strong><mark>藉先知以賽亞</mark></strong>向你們祖宗所說的話是不錯的。 他說，『你去告訴這百姓說，你們聽是要聽見，卻不明白．看是要看見，卻不曉得。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/28/#L25-26">徒 28:25-26</a>)</p></blockquote><blockquote><p>“<strong>聖靈有話說</strong>，『你們今日若聽他的話，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/3/#L7">希 3:7</a>)</p></blockquote><blockquote><p>“「弟兄們，<strong>聖靈藉大衛的口</strong>，在聖經上預言領人捉拿耶穌的猶大，這話是必須應驗的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L16">徒 1:16</a>)</p></blockquote>
