  path: Qg17A_聖父是上帝
  title: 聖父是上帝
  copy_cover: true
  body: <blockquote><p>“不要爲那必壞的食物勞力，要爲那存到永生的食物勞力，就是人子要賜給你們的，因爲人子是<strong>父上帝</strong>所印證的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L27">約 6:27</a>)</p></blockquote><blockquote><p>“耶穌回答說：「我若榮耀自己，我的榮耀就算不得什麼；榮耀我的乃是<strong>我的父</strong>，就是你們所說是<strong>你們的上帝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L54">約 8:54</a>)</p></blockquote><blockquote><p>“願頌讚歸與我們的主耶穌基督的<strong>父上帝</strong>，就是發慈悲的父，賜各樣安慰的上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/1/#L3">林後 1:3</a>)</p></blockquote><blockquote><p>“願頌讚歸與我們主耶穌基督的<strong>父上帝</strong>！他在基督裏曾賜給我們天上各樣屬靈的福氣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L3">弗 1:3</a>)</p></blockquote><blockquote><p>“就是照<strong>父上帝</strong>的先見被揀選，藉着聖靈得成聖潔，以致順服耶穌基督，又蒙他血所灑的人：願恩惠、平安多多的加給你們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L2">彼前 1:2</a>)</p></blockquote>
