- src: yD3R_Воровство
  path: QS14A_偷竊
  title: 偷竊
  copy_cover: true
  body: <blockquote><p>“你們豈不知<strong><mark>不義的人不能承受上帝的國</mark></strong>嗎？<strong><mark>不要自欺</mark></strong>！無論是淫亂的、拜偶像的、姦淫的、作孌童的、親男色的、 <strong><mark>偷竊的</mark></strong>、貪婪的、醉酒的、辱罵的、勒索的，<strong><mark>都不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L9-10">林前 6:9-10</a>)</p></blockquote><blockquote><p>“<strong><mark>從前偷竊的，不要再偷</mark></strong>；總要勞力，親手作正經事，就可有餘，分給那缺少的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L28">弗 4:28</a>)</p></blockquote><blockquote><p>“因爲<strong><mark>我耶和華喜愛公平，恨惡搶奪和罪孽</mark></strong>。我要憑誠實施行報應，並要與我的百姓立永約。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/61/#L8">賽 61:8</a>)</p></blockquote><blockquote><p>“他對我說：「這是發出行在遍地上的咒詛。<strong><mark>凡偷竊的，必按捲上這面的話除滅</mark></strong>；凡起假誓的，必按捲上那面的話除滅。 萬軍之耶和華說：『我必使這書卷出去，<strong><mark>進入偷竊人的家</mark></strong>和指我名起假誓人的家，必常在他家裏，連房屋帶木石都毀滅了。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/5/#L3-4">亞 5:3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>你們偷盜、殺害、姦淫、起假誓</mark></strong>、向巴力燒香並隨從素不認識的別神； <strong><mark>且來到這稱爲我名下的殿</mark></strong>，在我面前敬拜。又說：我們可以自由了！你們這樣的舉動是要行那些可憎的事嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/7/#L9-10">耶 7:9-10</a>)</p></blockquote><blockquote><p>“上帝吩咐這一切的話，說： &lt;…&gt; <strong><mark>不可偷盜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L1,15">出 20:1,15</a>)</p></blockquote><blockquote><p>“耶和華對摩西說： &lt;…&gt; <strong><mark>你們不可偷盜。不可欺騙。也不可彼此說謊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L1,11">利 19:1,11</a>)</p></blockquote><p><hr></p><blockquote><p>“再者，我對惡人說：『你必定死亡！』<strong><mark>他若轉離他的罪</mark></strong>，行正直與合理的事： <strong><mark>還人的當頭和所搶奪的，遵行生命的律例，不作罪孽，他必定存活</mark></strong>，不至死亡。 <strong><mark>他所犯的一切罪必不被記念</mark></strong>；他行了正直與合理的事，必定存活。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/33/#L14-16">結 33:14-16</a>)</p></blockquote><blockquote><p>“撒該站著對主說：「主啊，<strong><mark>我把所有的一半給窮人；我若訛詐了誰，就還他四倍</mark></strong>。」 耶穌說：「<strong><mark>今天救恩到了這家</mark></strong>，因爲他也是亞伯拉罕的子孫。 人子來，爲要尋找、拯救失喪的人。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/19/#L8-10">路 19:8-10</a>)</p></blockquote>
