- src: Татуировки
  path: QS13A_紋身
  title: 紋身、穿環
  copy_cover: true
  body: <p>上帝禁止在身體上刺紋、劃身：</p><blockquote><p>“你們是耶和華你們上帝的兒女。<strong><mark>不可爲死人用刀劃身</mark></strong>，也不可將額上剃光，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/14/#L1">申 14:1</a>)</p></blockquote><blockquote><p>“<strong><mark>頭的周圍不可剃</mark></strong>，鬍鬚的周圍也不可損壞。 不可爲死人用刀劃身、<strong><mark>也不可在身上刺花紋。我是耶和華</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L27-28">利 19:27-28</a>)</p></blockquote><blockquote><p>“所以弟兄們，我以上帝的慈悲勸你們，<strong><mark>將身體獻上，當作活祭，是聖潔的，是上帝所喜悅的</mark></strong>．你們如此事奉，乃是理所當然的。 <strong><mark>不要效法這個世界</mark></strong>，只要心意更新而變化，叫你們察驗何爲上帝的善良、純全、可喜悅的旨意。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L1-2">羅 12:1-2</a>)</p></blockquote><blockquote><p>“耶和華對摩西說：「<strong><mark>你告訴亞倫子孫作祭司的說</mark></strong>：『祭司不可爲民中的死人沾染自己。 &lt;…&gt; 不可使頭光禿，不可剃除鬍鬚的周圍，<strong><mark>也不可用刀劃身</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L1,5">利 21:1,5</a>)</p></blockquote>
