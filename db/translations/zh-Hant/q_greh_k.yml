  title: 異裝
  copy_cover: true
  body: <p><strong>異裝</strong>（拉丁文 *trans*——「越過、跨越」，*vestitus*——「穿著的」）——人強迫性地渴望穿傳統上與異性相關聯的服裝。</p><blockquote><p>“<strong><mark>婦女不可穿戴男子所穿戴的；男子也不可穿婦女的衣服</mark></strong>，因爲這樣行都是耶和華你上帝所憎惡的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/22/#L5">申 22:5</a>)</p></blockquote>
