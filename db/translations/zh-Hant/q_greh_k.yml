- src: родовые-грехи
  path: QS19T_祖先的罪
  title: 祖先的罪（沒有這樣的罪）
  copy_cover: true
  body: <p>祖先的罪並不存在。這個概念是捏造出來的，通常是所謂「民間療法師」、特異功能者和巫師使用的概念。教會有原罪的概念，但那是另一個概念（見<a href="https://bibleox.com/ru/ru/w/7XucD5kC_Всеобщность_первородного_греха">引文</a>）。使人完全脫離原罪的，只有教會的聖洗禮，而不是巫師和特異功能者——他們在主耶穌基督道成肉身之前就有，卻沒有行出基督所行的事。</p><p>上帝向每個人追討的是他自己的罪。然而，父母的義的生活或敗壞的生活，其後果都會落在兒女身上。這好比：如果父母毀壞自己的健康（酗酒、吸毒），也就損害了自己孩子的健康，儘管孩子對父母毀壞健康並無過錯。在上帝面前，孩子不爲父母的酗酒承擔責任。</p><p>這一思想可以從以下的聖經話語中詳細明白：</p><blockquote><p>“「<strong><mark>你們在以色列地怎麼用這俗語說</mark></strong>『父親喫了酸葡萄，兒子的牙酸倒了』呢？ 主耶和華說，我指著我的永生起誓，你們在以色列中，必不再有用這俗語的因由。 看哪！世人都是屬我的：爲父的怎樣屬我，爲子的也照樣屬我。<strong><mark>犯罪的他必死亡</mark></strong>。 <strong><mark>人若是公義，且行正直與合理的事</mark></strong>： 未曾在山上吃過祭偶像之物，未曾仰望以色列家的偶像；未曾玷污鄰舍的妻，未曾在婦人的經期內親近她； 未曾虧負人，乃將欠債之人的當頭還給他；未曾搶奪人的物件，卻將食物給飢餓的人吃，將衣服給赤身的人穿； 未曾向借錢的弟兄取利，也未曾向借糧的弟兄多要；縮手不作罪孽，在兩人之間，按至理判斷； <strong><mark>遵行我的律例，謹守我的典章，按誠實行事，這人是公義的，必定存活</mark></strong>。這是主耶和華說的。 <strong><mark>他若生一個兒子作強盜，是流人血的</mark></strong>，不行以上所說之善，反行其中之惡：『乃在山上吃過祭偶像之物，並玷污鄰舍的妻； &lt;…&gt; 虧負困苦和窮乏的人；搶奪人的物；未曾將當頭還給人；仰望偶像，並行可憎的事； 向借錢的弟兄取利，向借糧的弟兄多要。這人豈能存活呢？他必不能存活，<strong><mark>他行這一切可憎的事，必要死亡，他的罪</mark></strong>必歸到他身上。』 <strong><mark>他若生一個兒子，見父親所犯的一切罪，便懼怕</mark></strong>〔有古卷作『思量』〕，不照樣去做： 『未曾在山上吃過祭偶像之物，未曾仰望以色列家的偶像，未曾玷污鄰舍的妻， 未曾虧負人，未曾取人的當頭，未曾搶奪人的物件，卻將食物給飢餓的人吃，將衣服給赤身的人穿； 縮手不害貧窮人，未曾向借錢的弟兄取利，也未曾向借糧的弟兄多要，他順從我的典章，遵行我的律例，<strong><mark>就不因父親的罪孽死亡，定要存活</mark></strong>。 至於他父親，因爲欺人太甚，搶奪弟兄，在本國的民中行不善，<strong><mark>他必因自己的罪孽死亡</mark></strong>。』 你們還說：『兒子爲何不擔當父親的罪孽呢？』兒子行正直與合理的事，謹守遵行我的一切律例，他必定存活。 惟有犯罪的，他必死亡。<strong><mark>兒子必不擔當父親的罪孽，父親也不擔當兒子的罪孽</mark></strong>。義人的善果必歸自己，惡人的惡報也必歸自己。 惡人若回頭離開所作的一切罪惡，謹守我一切的律例，行正直與合理的事，<strong><mark>他必定存活，不至死亡</mark></strong>。 <strong><mark>他所犯的一切罪過都不被記念，因所行的義，他必存活</mark></strong>。 主耶和華說，惡人死亡，豈是我喜悅的嗎？不是喜悅他回頭離開所行的道存活嗎？ 義人若轉離義行而作罪孽，照著惡人所行一切可憎的事而行，他豈能存活嗎？<strong><mark>他所行的一切義都不被記念，他必因所犯的罪、所行的惡死亡</mark></strong>。 你們還說：『主的道不公平！』以色列家啊，你們當聽，我的道豈不公平嗎？你們的道豈不是不公平嗎？ 義人若轉離義行而作罪孽死亡，他是因所作的罪孽死亡。 再者，惡人若回頭離開所行的惡，行正直與合理的事，他必將性命救活了。 因爲他思量，回頭離開所犯的一切罪過，必定存活，不至死亡。 以色列家還說：『主的道不公平！』以色列家啊，我的道豈不公平嗎？你們的道豈不是不公平嗎？ 所以主耶和華說，以色列家阿，<strong><mark>我必按你們各人所行的審判你們。你們當回頭離開所犯的一切罪過</mark></strong>。這樣，罪孽必不使你們敗亡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/18/#L2-10,12-30">結 18:2-10,12-30</a>)</p></blockquote><p>但人們常常產生這樣的想法：父母的罪責似乎還是會傳給兒女。這想法是在讀到以下聖經經文後產生的：</p><blockquote><p>“不可跪拜那些像；也不可事奉它，因爲我耶和華你的上帝，是忌邪的上帝。<strong><mark>恨我的，我必追討他的罪，自父及子，直到三四代</mark></strong>； 愛我、守我誡命的，我必向他們發慈愛，直到千代。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L5-6">出 20:5-6</a>)</p></blockquote><p>這裏所說的是那些一代又一代持續恨上帝的人：「直到三四代——恨我的」。這樣的人要因他們對上帝的恨受罰。爲什麼？雖然主容忍了他父親、祖父、曾祖父的仇恨，但這仇恨既然延續到第三四代，容忍就到了盡頭，刑罰就臨到他們。</p><p>敘利亞的聖埃弗雷姆：</p><blockquote><p>第5-6節、13-14節、16-17節、22-26節。上帝在西奈山上賜下誡命，說：我是耶和華，必追討恨我之人的罪，自父及子，直到三四代。<strong>上帝按自己的寬容容忍一個惡人，也容忍他的兒子和孫子；但他們若不悔改，就把刑罰加在第四代的頭上，只要他在自己的惡行上與先祖相似。</strong></p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Efrem_Sirin/tolkovanie-na-knigu-iskhod/20">《出埃及記》第20章註釋</a>）</p>
