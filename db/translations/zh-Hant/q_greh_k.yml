- src: грех-гомосексуализм
  path: QS17A_同性戀
  title: 同性戀（男色）
  copy_cover: true
  body: <p>同性戀是罪，在上帝面前是可憎的：</p><blockquote><p>“<strong><mark>不可與男人苟合，像與女人一樣，這本是可憎惡的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/18/#L22">利 18:22</a>)</p></blockquote><blockquote><p>“<strong><mark>人若與男人苟合，像與女人一樣，他們二人行了可憎的事，總要把他們治死</mark></strong>，罪要歸到他們身上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/20/#L13">利 20:13</a>)</p></blockquote><p>同性戀是可羞恥的情欲，要承受報應：</p><blockquote><p>“因此，<strong><mark>上帝任憑他們放縱可羞恥的情欲</mark></strong>。<strong><mark>他們的女人把順性的用處變爲逆性的用處</mark></strong>； 男人也是如此，棄了女人順性的用處，<strong><mark>慾火攻心，彼此貪戀，男和男行可羞恥的事，就在自己身上受這妄爲當得的報應</mark></strong>。 他們既然故意不認識上帝，上帝就任憑他們存邪僻的心，<strong><mark>行那些不合理的事</mark></strong>； &lt;…&gt; <strong><mark>他們雖知道上帝判定行這樣事的人是當死的，然而他們不但自己去行，還喜歡別人去行</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L26-28,32">羅 1:26-28,32</a>)</p></blockquote><p>同性戀是致死的罪：</p><blockquote><p>“你們豈不知<strong><mark>不義的人不能承受上帝的國</mark></strong>嗎？<strong><mark>不要自欺</mark></strong>！無論是淫亂的、拜偶像的、姦淫的、作孌童的、<strong><mark>親男色的</mark></strong>、 偷竊的、貪婪的、醉酒的、辱罵的、勒索的，<strong><mark>都不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L9-10">林前 6:9-10</a>)</p></blockquote><p>同性戀是違揹誡命的不法行爲，與來自上帝的純正教導相悖：</p><blockquote><p>“因爲律法不是爲義人設立的，<strong><mark>乃是爲不法和不服的</mark></strong>，不虔誠和犯罪的，不聖潔和戀世俗的，弒父母和殺人的， <strong><mark>行淫和親男色的</mark></strong>，搶人口和說謊話的，並起假誓的，<strong><mark>或是爲別樣敵正道的事設立的</mark></strong>。 這是照著可稱頌之上帝交托我榮耀福音說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L9-11">提前 1:9-11</a>)</p></blockquote><p>所多瑪和蛾摩拉因同性戀之罪被毀滅：</p><blockquote><p>“他們還沒有躺下，<strong><mark>所多瑪城裏各處的人，連老帶少，都來圍住那房子</mark></strong>， 呼叫羅得說：「今日晚上到你這裏來的人在那裏呢？<strong><mark>把他們帶出來，任我們所爲</mark></strong>。」 羅得出來，把門關上，到衆人那裏， 說：「衆弟兄，<strong><mark>請你們不要作這惡事</mark></strong>。 &lt;…&gt; 只是那二人伸出手來，將羅得拉進屋去，把門關上。 並且使門外的人，無論老少，眼都昏迷；他們摸來摸去，總尋不著房門。 二人對羅得說：「你這裏還有什麼人嗎？無論是女婿，是兒女和這城中一切屬你的人，你都要將他們從這地方帶出去。 <strong><mark>我們要毀滅這地方，因爲城內罪惡的聲音，在耶和華面前甚大</mark></strong>，耶和華差我們來，要毀滅這地方。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/19/#L4-7,10-13">創 19:4-7,10-13</a>)</p></blockquote><blockquote><p>“<strong><mark>又如所多瑪、蛾摩拉，和周圍城邑的人，也照他們一味的行淫，隨從逆性的情欲，就受永火的刑罰，作爲鑑戒</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L7">猶 1:7</a>)</p></blockquote><p>各民族因同性戀之罪被從上帝應許給猶太人的土地上趕出：</p><blockquote><p>“我今天所吩咐你的，你要謹守，<strong><mark>我要從你面前攆出亞摩利人、迦南人、赫人、比利洗人、希未人、耶布斯人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/34/#L11">出 34:11</a>)</p></blockquote><blockquote><p>“<strong><mark>不可與男人苟合，像與女人一樣，這本是可憎惡的</mark></strong>。 &lt;…&gt; 在這一切的事上，你們都不可玷污自己，<strong><mark>因爲我在你們面前所逐出的列邦，在這一切的事上玷污了自己</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/18/#L22,24">利 18:22,24</a>)</p></blockquote><blockquote><p>“<strong><mark>人若與男人苟合，像與女人一樣，他們二人行了可憎的事</mark></strong>，總要把他們治死，罪要歸到他們身上。 &lt;…&gt; <strong><mark>我在你們面前所逐出的國民，你們不可隨從他們的風俗，因爲他們行了這一切的事，所以我厭惡他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/20/#L13,23">利 20:13,23</a>)</p></blockquote>
