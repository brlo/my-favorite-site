  title: 酵
  copy_cover: true
  body: <h2>酵——影響一切的小東西</h2><p>新約聖經中酵的比喻，不是把它用作本身好或壞的東西，而是用來表明小小的一分可以影響其餘的一切。放入麵粉中的酵很少，但最終會使全團都發起來。</p><p>除了酵，主也常常用鹽的比喻——鹽同樣影響其餘的一切（防腐）：</p><blockquote><p>“<strong><mark>你們是世上的鹽</mark></strong>。<strong><mark>鹽若失了味</mark></strong>，怎能叫他再鹹呢？以後無用，不過丟在外面，被人踐踏了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L13">太 5:13</a>)</p></blockquote><blockquote><p>“<strong><mark>鹽本是好的</mark></strong>，若失了味，可用什麼叫他再鹹呢？<strong><mark>你們裏頭應當有鹽，彼此和睦</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L50">可 9:50</a>)</p></blockquote><p>同時，鹽如同酵一樣，也參與舊約的祭獻：</p><blockquote><p>“<strong><mark>凡獻爲素祭的供物都要用鹽調和</mark></strong>，在素祭上不可缺了你上帝立約的鹽；<strong><mark>一切的供物都要配鹽而獻</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/2/#L13">利 2:13</a>)</p></blockquote><h2>酵的正面含義</h2><h3>酵——天國</h3><p>主耶穌基督把酵比作天國。又一次，小東西要影響一切：</p><blockquote><p>“他又對他們講個比喻說：「<strong><mark>天國好像面酵</mark></strong>，有婦人拿來，藏在三鬥面裏，<strong><mark>直等全團都發起來</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L33">太 13:33</a>)</p></blockquote><blockquote><p>“又說：「<strong><mark>我拿什麼來比上帝的國呢</mark></strong>？ <strong><mark>好比面酵</mark></strong>，有婦人拿來藏在三鬥面裏，<strong><mark>直等全團都發起來</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L20-21">路 13:20-21</a>)</p></blockquote><h2>酵的負面含義</h2><h3>酵——異端的教導</h3><p>主耶穌基督向使徒們指出法利賽人和撒都該人教導的危害。他用酵的比喻表明小東西可以影響一切：</p><blockquote><p>“耶穌對他們說：「<strong><mark>你們要謹慎，防備法利賽人和撒都該人的酵</mark></strong>。」 &lt;…&gt; 我對你們說：『要防備法利賽人和撒都該人的酵』，這話不是指著餅說的，你們怎麼不明白呢？」 門徒這才曉得他說的，不是叫他們防備餅的酵，<strong><mark>乃是防備法利賽人和撒都該人的教訓</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L6,11-12">太 16:6,11-12</a>)</p></blockquote><h3>酵——假冒爲善</h3><p>另一次，基督在數千人面前再次用酵的比喻，指出法利賽人的特點——假冒爲善的危害。又一次，假冒爲善成了影響一切的小東西：</p><blockquote><p>“這時，有幾萬人聚集，甚至彼此踐踏。耶穌開講，先對門徒說：「<strong><mark>你們要防備法利賽人的酵，就是假冒爲善</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L1">路 12:1</a>)</p></blockquote><h3>酵——團體中不悔改的淫亂之人</h3><p>使徒保羅用酵的比喻指摘哥林多團體中有不悔改的淫亂之人。淫亂之人是團體中的小部分，卻可以影響整個團體：</p><blockquote><p>“<strong><mark>風聞在你們中間有淫亂的事</mark></strong>。這樣的淫亂連外邦人中也沒有，<strong><mark>就是有人收了他的繼母</mark></strong>。 &lt;…&gt; 你們這自誇是不好的，<strong><mark>豈不知一點面酵能使全團發起來嗎</mark></strong>？ 你們既是無酵的面，<strong><mark>應當把舊酵除淨，好使你們成爲新團</mark></strong>；因爲我們逾越節的羔羊基督，已經被殺獻祭了。 所以我們守這節不可用舊酵，<strong><mark>也不可用惡毒、邪惡的酵</mark></strong>，<strong><mark>只用誠實真正的無酵餅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L1,6-8">林前 5:1,6-8</a>)</p></blockquote><p>使徒建議除淨的不是酵本身，而是惡毒邪惡的酵：也就是把不悔改的淫亂之人趕出團體（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L9,11">林前 5:9,11</a>）。這裏使徒揭示的是舊約的含義，而不是在說餅：</p><blockquote><p>“你們既是無酵的面，<strong><mark>應當把舊酵除淨，好使你們成爲新團</mark></strong>；因爲我們逾越節的羔羊基督，已經被殺獻祭了。 所以我們守這節不可用舊酵，<strong><mark>也不可用惡毒、邪惡的酵</mark></strong>，<strong><mark>只用誠實真正的無酵餅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L7-8">林前 5:7-8</a>)</p></blockquote><blockquote><p>“我對你們說：『要防備法利賽人和撒都該人的酵』，<strong><mark>這話不是指著餅說的</mark></strong>，你們怎麼不明白呢？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L11">太 16:11</a>)</p></blockquote><h3>酵——團體中引人走向猶太教的人</h3><p>使徒保羅用酵的比喻警告加拉太團體，他們中間有教導說爲得救必須遵守摩西律法的人，這是危險的：</p><blockquote><p>“<strong><mark>你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了</mark></strong>。 我們靠著聖靈，憑著信心，等候所盼望的義。 &lt;…&gt; <strong><mark>一點面酵能使全團都發起來</mark></strong>。 我在主裏很信你們必不懷別樣的心，<strong><mark>但攪擾你們的，無論是誰，必擔當他的罪名</mark></strong>！ &lt;…&gt; <strong><mark>恨不得那攪亂你們的人，把自己割絕了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L4-5,9-10,12">加 5:4-5,9-10,12</a>)</p></blockquote>
