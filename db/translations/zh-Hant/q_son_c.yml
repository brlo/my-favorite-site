- src: Христос-не-архангел-Михаил
  path: Qs13T_基督不是天使長米迦勒
  title: 基督不是天使長米迦勒
  copy_cover: true
  body: <h2>前言</h2><p>首先要說明：“基督就是天使長米迦勒”的說法存在於“耶和華見證人”這一極端教派中。耶和華見證人爲論證自己的教導，製造了自己歪曲甚多的聖經譯本（專家對該派《新世界》譯本的評述見 <a href="https://azbyka.ru/otechnik/sekty/rassuzhdaja-so-svideteljami-iegovy-pri-pomoshhi-pisanija/4_7">azbyka.ru</a>）。此外，基督復臨安息日會也有人認爲，舊約中以天使長米迦勒身份出現的那一位似乎就是上帝之子耶穌基督。</p><h2>“天使”一詞的兩個含義</h2><p>在聖經中，“天使”一詞有兩種理解：職能與本性。</p><p>天使的<strong>職能</strong>是奉差遣，因爲這個詞在古希臘文中字面上正是這個意思：ἄγγελος（天使羅思）——使者、報信者；希伯來文 מלאך——使者。</p><p>天使的<strong>本性</strong>是無形體的靈。天使是被上帝所造的靈體，沒有身體（無形的），換言之就是靈。這些靈在被造之先於人類，被賦予了自由與理性。他們中有一部分不願順服上帝，從他墮落了，但仍然被稱爲天使（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L41">太 25:41</a>）。也就是說，本性獨立於活動：無論是否奉差遣，都是天使。本性就是如此。因此，一個由人所生的、完全具體的人——先知施洗約翰——也被稱爲天使（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/3/#L1">瑪 3:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L10">太 11:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L2">可 1:2</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/7/#L27">路 7:27</a>）。同樣含義下，基督自己也被稱爲新約的使者（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/3/#L1">瑪 3:1</a>）。這個說清楚了。現在來看引文。</p><h2>所有天使都是服役的靈，而基督坐在寶座上</h2><p>使徒保羅稱上帝之子是遠比天使更尊貴的存在（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L4">希 1:4</a>），因爲上帝從不以對待自己兒子的方式對天使說話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L5">希 1:5</a>），上帝的兒子要受所有天使的敬拜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L6">希 1:6</a>）；他指出上帝論到天使和論到上帝之子的話語各不相同：前者是服役的靈，後者是坐在寶座上的主宰（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L7-8">希 1:7-8</a> 與 <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13">希 1:13</a>）；並指出一切受造之物的短暫，但創造了萬有的上帝之子自己永不廢去（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L10-12">希 1:10-12</a>）。最後，聖經直說：所有天使無一例外都是服役的靈，但子是與父同坐在寶座上的：</p><blockquote><p>“所有的天使，上帝從來對那一個說：『你<strong>坐在我的右邊</strong>，等我使你仇敵作你的腳凳？』 天使豈不都是<strong>服役的靈</strong>、奉差遣爲那將要承受救恩的人效力嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><p>兒子受服役，而子與父一同作王。</p><h2>上帝要受人敬拜，基督受一切受造物的敬拜</h2><p>上帝說，萬膝必向他跪拜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L11">羅 14:11</a>）；而基督受一切受造物的敬拜——不只是人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L10">腓 2:10</a>），包括天使（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L6">希 1:6</a>）。</p><h2>世界交給了基督，不是交給天使</h2><blockquote><p>“我們所說將來的世界，<strong>上帝原沒有交給天使管轄</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/2/#L5">希 2:5</a>)</p></blockquote><p>同時，世界交給了基督：</p><blockquote><p>“因爲經上說：『<strong>上帝叫萬物都服在他的腳下</strong>。』既說萬物都服了他，明顯那叫萬物服他的，不在其內了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L27">林前 15:27</a>)</p></blockquote><blockquote><p>“<strong>又將萬有服在他的腳下</strong>，使他爲教會作萬有之首。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L22">弗 1:22</a>)</p></blockquote><blockquote><p>“<strong>叫萬物都服在他的腳下</strong>。』既叫萬物都服他，就沒有剩下一樣不服他的。只是如今我們還不見萬物都服他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/2/#L8">希 2:8</a>)</p></blockquote><h2>全能者、萬王之王、萬主之主</h2><p>先知稱<strong>上帝</strong>爲萬主之主（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/136/#L2-3">詩 136:2-3</a>）。使徒稱<strong>上帝</strong>爲萬主之主、萬王之王（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L15-16">提前 6:15-16</a>）。使徒稱<strong>耶穌基督</strong>爲萬主之主、萬王之王（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/17/#L14">啟 17:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/19/#L16">啟 19:16</a>），爲全能者（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L8">啟 1:8</a>）。萬王之王之上沒有別的王。萬主之主之上沒有別的主。全能者之上沒有任何存在能托住全能者，因爲他自己以自己的能力托住萬有。天使長米迦勒是天使軍團的君長。基督卻是世上一切——包括天使和天使長米迦勒本身——的元首。</p><h2>上帝（耶和華）親自差遣先知，而基督說，正是他差遣了他們</h2><p>應當指出：基督指明，他就是那位向以色列差遣了許多先知的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L34">太 23:34</a>）。而聖經告訴我們，正是上帝親自（而非藉天使）向先知說話，並親自把他們差往以色列（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L12">出 3:12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/4/#L1">瑪 4:1</a>、<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/4/#L5">瑪 4:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/6/#L8">士 6:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/25/#L15">代下 25:15</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/15/#L1">撒上 15:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/12/#L1">撒下 12:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/12/#L7">撒下 12:7</a>）。也就是說，基督就是耶和華上帝。在上帝與先知的交往中，沒有中間人。</p><h2>上帝之子由父所生，他創造了天使</h2><p>基督是一切看得見與看不見之物的創造者，包括天使（<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L13-17">西 1:13-17</a>）。也就是說，他要成爲天使，就得先造出他自己。</p><h2>“米迦勒”之名的詞源</h2><p>米迦勒是希伯來名字，源自 מי כמו אלוהים（米·克莫·埃洛希姆，縮略爲“米·卡·埃爾”），字面意思是“誰能像上帝”。也就是說——沒有誰與上帝同等，沒有誰能與他相比。但基督並不認爲自己與上帝同等是強奪的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L6">腓 2:6</a>）。</p><h2>舊約藉天使賜下，新約由主親自宣講</h2><p>使徒保羅指出新約與舊約的區別：舊約藉天使傳的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/2/#L2">希 2:2</a>），而新約由主自己親自宣講（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/2/#L3">希 2:3</a>）。也就是說，至少不是藉天使。</p><h2>上帝成爲人，向天使顯現</h2><blockquote><p>“大哉，敬虔的奧祕！無人不以爲然，就是<strong>上帝在肉身顯現</strong>，被聖靈稱義，<strong>被天使看見</strong>，被傳於外邦，被世人信服，被接在榮耀裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L16">提前 3:16</a>)</p></blockquote><p>從來沒有人看見上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>），他住在人不能靠近的光裏，人不可能看見上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L16">提前 6:16</a>）；然而，上帝一旦真正成爲人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L14">約 1:14</a>），就在基督裏成爲人人可見的。人不能憑肉眼看見靈界（天使）的居民，但基督卻說自己看見了從天墜落的撒但（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L18">路 10:18</a>）。</p><h2>結語</h2><p>基督不是天使長米迦勒，而是上帝。他多次被直接稱爲上帝。聖經對此直言不諱：<a href="https://bibleox.com/ru/ru/w/Христос-Бог">基督是上帝</a></p><blockquote><p>“「<strong>我的民哪！你們當聽我的話</strong>；以色列啊！我要勸戒你：<strong>我是上帝，是你的上帝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/50/#L7">詩 50:7</a>)</p></blockquote>
