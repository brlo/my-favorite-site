  path: Qs12T_基督——人類唯一的救主
  title: 基督——人類唯一的救主
  copy_cover: true
  body: <p>本文不僅表明耶穌基督是救主，也表明他是怎樣的救主——他是萬人的救主。所有人都蒙召歸向基督，但並非所有人都得救。</p><h2>異教的神不是神</h2><p>沒有別的上帝：</p><blockquote><p>“論到吃祭偶像之物，我們知道偶像在世上算不得什麼，也知道<strong>上帝只有一位，再沒有別的上帝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/8/#L4">林前 8:4</a>)</p></blockquote><p>外邦人從前所事奉的，並不是神：</p><blockquote><p>“但從前你們不認識上帝的時候，是給那些<strong>本來不是神的</strong>作奴僕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L8">加 4:8</a>)</p></blockquote><p>假神：</p><blockquote><p>“「諸君，爲什麼作這事呢？我們也是人，性情和你們一樣！我們傳福音給你們，是叫你們離棄這些虛妄，<strong>歸向那創造天、地、海和其中萬物的永生上帝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/14/#L15">徒 14:15</a>)</p></blockquote><p>萬民在從前各行自己的道路，而不是上帝的道路：</p><blockquote><p>“他在從前的世代，<strong>任憑萬國各行其道</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/14/#L16">徒 14:16</a>)</p></blockquote><p>更多類似引文：<a href="https://bibleox.com/ru/ru/w/Бог-один">上帝是唯一的上帝</a></p><h2>拒絕基督就是拒絕上帝</h2><blockquote><p>“又對門徒說：「聽從你們的就是聽從我；棄絕你們的就是棄絕我；<strong>棄絕我的就是棄絕那差我來的</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L16">路 10:16</a>)</p></blockquote><blockquote><p>“<strong>恨我的，也恨我的父</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L23">約 15:23</a>)</p></blockquote><blockquote><p>“<strong>凡不認子的，就沒有父</strong>；認子的，連父也有了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L23">約壹 2:23</a>)</p></blockquote><blockquote><p>“<strong>凡越過基督的教訓不常守著的，就沒有上帝</strong>；常守這教訓的，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><blockquote><p>“信子的人有永生；<strong>不信子的人得不著永生</strong>，<strong>上帝的震怒常在他身上</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L36">約 3:36</a>)</p></blockquote><h2>沒有對基督的信心，就不能得救</h2><blockquote><p>“你們衆人和以色列百姓都當知道，站在你們面前的這人得痊癒，是因你們所釘十字架、上帝叫他從死裏復活的<strong>拿撒勒人耶穌基督的名</strong>。 他是你們『匠人所棄的石頭，已成了房角的頭塊石頭。』 <strong>除他以外，別無拯救</strong>；因爲在天下人間，<strong>沒有賜下別的名，我們可以靠著得救</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L10-12">徒 4:10-12</a>)</p></blockquote><blockquote><p>“<strong>人非有信，就不能得上帝的喜悅</strong>；因爲到上帝面前來的人，必須信有上帝，且信他賞賜那尋求他的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L6">希 11:6</a>)</p></blockquote><h2>異端和脫離教會使人失去救恩</h2><p>編造異端的人必不能承受上帝的國：</p><blockquote><p>“情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、<strong><mark>紛爭</mark></strong>、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>) <em>(和合本以「紛爭」譯 διχοστασίαι（分裂）)</em></p></blockquote><p>在教會中製造分裂的人——不是事奉主基督：</p><blockquote><p>“弟兄們，那些<strong>離間你們、叫你們跌倒</strong>、背乎所學之道的人，我勸你們要留意躲避他們。 因爲這樣的人<strong>不服事我們的主基督</strong>，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><p>那些引人結黨、屬乎血氣、沒有聖靈：</p><blockquote><p>“他們曾對你們說過：『末世必有好譏誚的人隨從自己不敬虔的私欲而行。』 這就是那些<strong>引人結黨</strong>、屬乎血氣、沒有聖靈的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L18-19">猶 1:18-19</a>)</p></blockquote><p>教會是基督的身體，基督是身體的救主：</p><blockquote><p>“讚美上帝，得衆民的喜愛。主將<strong>得救的人天天加給</strong>他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L47">徒 2:47</a>)</p></blockquote><blockquote><p>“現在我爲你們受苦，倒覺歡樂，並且爲<strong>基督的身體，就是爲教會</strong>，要在我肉身上補滿基督患難的缺欠。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L24">西 1:24</a>)</p></blockquote><blockquote><p>“因爲丈夫是妻子的頭，如同基督是教會的頭，他又是<strong>教會全體的救主</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>)</p></blockquote><h2>所有人都要受審判</h2><blockquote><p>“因爲<strong><mark>我們衆人</mark></strong>必要在基督臺前顯露出來，叫各人按著本身所行的，<strong><mark>或善或惡受報</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><blockquote><p>“因爲人所作的事，<strong><mark>連一切隱藏的事</mark></strong>，無論是<strong>善是惡</strong>，上帝都必審問。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/12/#L14">傳 12:14</a>)</p></blockquote><h3>審判要從上帝的家起首</h3><blockquote><p>“因爲時候到了，<strong><mark>審判要從上帝的家起首</mark></strong>。若是<strong><mark>先從我們起首</mark></strong>，那不信從上帝福音的人將有何等的結局呢？ 『若是<strong>義人僅僅得救</strong>，那不虔敬和犯罪的人，將有何地可站呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><h3>人人都犯了許多罪</h3><blockquote><p>“原來<strong>我們在許多事上都有過失</strong>；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/3/#L2">雅 3:2</a>)</p></blockquote><blockquote><p>“<strong>我們若說自己無罪，便是自欺</strong>，真理不在我們心裏了； &lt;…&gt; 我們若說自己沒有犯過罪，便是以上帝爲說謊的，他的道也不在我們心裏了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L8,10">約壹 1:8,10</a>)</p></blockquote><h3>許多人將驚訝地發現沒有得救</h3><p>他們以爲自己是得救的：</p><blockquote><p>“當那日，<strong>必有許多人</strong>對我說：『主阿，主阿，我們不是<strong>奉你的名傳道</strong>，<strong>奉你的名趕鬼</strong>，奉你的名<strong>行許多異能</strong>嗎？』 我就明明地告訴他們說：『<strong>我從來不認識你們，你們這些作惡的人，離開我去吧！</strong>』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>許多人不得救</h2><h3>得救的不是所有人</h3><blockquote><p>“耶穌對衆人說：「你們要努力進窄門。我告訴你們：將來有<strong>許多人</strong>想要進去，<strong>卻是不能</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L24">路 13:24</a>)</p></blockquote><blockquote><p>“你們要進窄門。因爲<strong>引到滅亡，那門是寬的，路是大的</strong>，<strong>進去的人也多</strong>； <strong>引到永生，那門是窄的，路是小的</strong>，<strong>找著的人也少</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>凡稱呼我『主阿，主阿』的人，不能都進天國</strong>；惟獨遵行我天父旨意的人，才能進去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L21">太 7:21</a>)</p></blockquote><blockquote><p>“農夫在地裏撒許多種子，栽許多植物，但並非一切所種的都能存留，也並非一切所栽的都生根；同樣，在這世代所撒的，也<strong>不會都得救</strong>。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/8/#L41">厄四 8:41</a>, )</p></blockquote><h3>得救的人少</h3><blockquote><p>“有一個人問他說：「主啊，<strong>得救的人少嗎</strong>？」 耶穌對衆人說：「你們要努力進窄門。我告訴你們：<strong>將來有許多人想要進去，卻是不能</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L23-24">路 13:23-24</a>)</p></blockquote><blockquote><p>“你們要進窄門。因爲<strong>引到滅亡，那門是寬的，路是大的</strong>，<strong>進去的人也多</strong>； <strong>引到永生，那門是窄的，路是小的</strong>，<strong>找著的人也少</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><blockquote><p>“當那日，<strong>必有許多人</strong>對我說：『主阿，主阿，我們不是奉你的名傳道，奉你的名趕鬼，奉你的名行許多異能嗎？』 我就明明地告訴他們說：『<strong>我從來不認識你們，你們這些作惡的人，離開我去吧！</strong>』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><blockquote><p>“你們這<strong>小羣</strong>，不要懼怕，因爲你們的父樂意把國賜給你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L32">路 12:32</a>)</p></blockquote><blockquote><p>“不義的，叫他仍舊不義；污穢的，叫他仍舊污穢；爲義的，叫他仍舊爲義；<strong>聖潔的，叫他仍舊聖潔</strong>。」 「看哪，我必快來！賞罰在我，<strong>要照各人所行的報應他</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L11-12">啟 22:11-12</a>)</p></blockquote>
