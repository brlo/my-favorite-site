  path: QO15T_香、乳香、香爐
  title: 香（乳香、香料）
  copy_cover: true
  body: <h2>定義</h2><p><strong>香</strong>——燃燒的乳香（樹脂）所發的煙。</p><p><strong>乳香</strong>（阿拉伯文 lādan——「芳香樹脂」）——某些樹木（起初是黎巴嫩雪松）的芳香樹脂。燃燒的乳香發出悅人的香氣。在舉行聖禮和調製芬芳聖香時使用（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/30/#L34-36">出 30:34-36</a>）。</p><p><strong>焚香</strong>——乳香燃燒、香上升的過程。</p><p><strong>香爐</strong>——焚燒芬芳配料（加乳香）的器具（盤）。</p><h2>聖經引文</h2><h3>芬芳配料（加乳香）——大聖物</h3><blockquote><p>“耶和華吩咐摩西說：「你要取馨香的香料，就是拿他弗、施喜列、喜利比拿。<strong><mark>這馨香的香料和淨乳香各樣要一般大的分量</mark></strong>。 你要用這些加上鹽，按作香之法，<strong><mark>作成清淨聖潔的香</mark></strong>。 這香要取點搗得極細，<strong><mark>放在會幕內法櫃前</mark></strong>，我要在那裏與你相會。<strong><mark>你們要以這香爲至聖</mark></strong>。 你們不可按這調和之法爲自己作香；<strong><mark>要以這香爲聖，歸耶和華</mark></strong>。 凡作香和這香一樣，爲要聞香味的，<strong><mark>這人要從民中剪除</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/30/#L34-38">出 30:34-38</a>)</p></blockquote><h3>乳香（樹脂）與油一同加在素祭上，然後祭物由祭司焚燒</h3><blockquote><p>“若有人獻素祭爲供物給耶和華，<strong><mark>要用細麵澆上油，加上乳香</mark></strong>， 帶到亞倫子孫作祭司的那裏。祭司就要從細麵中取出一把來，<strong><mark>並取些油和所有的乳香</mark></strong>，然後要把所取的這些作爲紀念，<strong><mark>燒在壇上</mark></strong>，是獻與耶和華爲馨香的火祭。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/2/#L1-2">利 2:1-2</a>)</p></blockquote><h3>祭物也有不加乳香的</h3><blockquote><p>“這人就要將妻送到祭司那裏，又爲她帶著大麥麵伊法十分之一作供物，<strong><mark>不可澆上油，也不可加上乳香</mark></strong>，<strong><mark>因爲這是疑恨的素祭</mark></strong>，是思念的素祭，使人思念罪孽。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/5/#L15">民 5:15</a>)</p></blockquote><h3>專隻爲香（乳香）而設的壇</h3><p>特別設立了燒香的壇，在其上不可焚燒任何別的東西。在其上焚香與祭獻無關，自成一體。每天早晨和每天黃昏整理燈臺時舉行：</p><blockquote><p>“<strong><mark>你要用皂莢木作一座燒香的壇</mark></strong>。 &lt;…&gt; <strong><mark>要把壇放在法櫃前的幔子外</mark></strong>，對著法櫃上的施恩座，就是我要與你相會的地方。 <strong><mark>亞倫在壇上要燒馨香料作的香</mark></strong>；<strong><mark>每早晨他收拾燈的時候，要燒這香</mark></strong>。 <strong><mark>黃昏點燈的時候</mark></strong>，他要在耶和華面前燒這香，<strong><mark>作爲世世代代常燒的香</mark></strong>。 在這壇上，<strong><mark>不可奉上異樣的香</mark></strong>；不可獻燔祭、素祭，<strong><mark>也不可澆上奠祭</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/30/#L1,6-9">出 30:1,6-9</a>)</p></blockquote><h3>香象徵祈禱</h3><blockquote><p>“<strong><mark>願我的禱告如香陳列在你面前</mark></strong>；願我舉手祈求，如獻晚祭。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/141/#L2">詩 141:2</a>) <em>(俄文本編號爲 Пс 140:2（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“他既拿了書卷，四活物和二十四位長老就俯伏在羔羊面前，<strong><mark>各拿著琴和盛滿了香的金爐</mark></strong>；<strong><mark>這香就是衆聖徒的祈禱</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/5/#L8">啟 5:8</a>)</p></blockquote><h3>香是獻給上帝的單獨祭物</h3><p>香自成一體地被提及，與其他聖禮並列爲列舉（不是什麼補充，不是隻與其他事物搭配出現的）：</p><blockquote><p>“在以色列衆支派中，<strong><mark>我不是揀選人作我的祭司，使他燒香</mark></strong>，在我壇上獻祭，在我面前穿以弗得，又將以色列人所獻的火祭都賜給你父家麼？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/2/#L28">撒上 2:28</a>)</p></blockquote><blockquote><p>“目前我們沒有元首，沒有先知，沒有領袖，沒有全燔祭，沒有祭祀，沒有供物，<strong>沒有馨香祭</strong>，沒有地方可以給你薦新，好蒙受你的仁愛。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/3/#L38">但 3:38</a>)</p></blockquote><blockquote><p>“萬軍之耶和華說：「從日出之地到日落之處，我的名在外邦中必尊爲大。<strong><mark>在各處，人必奉我的名燒香</mark></strong>，獻潔淨的供物。因爲我的名在外邦中必尊爲大。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/1/#L11">瑪 1:11</a>)</p></blockquote><blockquote><p>“又製造了新的聖器，將燈臺、<strong>香壇</strong>、供桌，搬進聖殿。<strong>在香壇上獻香</strong>，又點著了燈臺上的燈，在殿裏放光。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/1mak/4/#L49-50">加上 4:49-50</a>)</p></blockquote><blockquote><p>“<strong>吩咐他</strong>爲你的名建立城池，並在其中<strong>向你獻香</strong>和祭物。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/3/#L24">厄四 3:24</a>, )</p></blockquote><blockquote><p>“約史雅的紀念，<strong>就如精製香料的人，用各種香味配成的香料</strong>，在衆人口裏，甜如蜂蜜，又如酒會中的音樂。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/49/#L1-2">德 49:1-2</a>)</p></blockquote><blockquote><p>“當他從帳幕後的至聖所出來，民衆羣集他身邊時，<strong>他是多麼有光彩</strong>；……<strong>他如烈火和香爐上的香料</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/50/#L5,9">德 50:5,9</a>) <em>(俄文本爲 Сир 50:5,9（論大祭司息孟）。)</em></p></blockquote><blockquote><p>“<strong><mark>願我的禱告如香陳列在你面前</mark></strong>；願我舉手祈求，如獻晚祭。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/141/#L2">詩 141:2</a>) <em>(俄文本編號爲 Пс 140:2（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“他既強盛，就心高氣傲，以致行事邪僻，干犯耶和華他的上帝，<strong><mark>進耶和華的殿，要在香壇上燒香</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/26/#L16">代下 26:16</a>)</p></blockquote><blockquote><p>“那從曠野上來、形狀如煙柱、<strong><mark>以沒藥和乳香並商人各樣香粉薰的是誰呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pp/3/#L6">歌 3:6</a>)</p></blockquote><blockquote><p>“你沒有將你的羊帶來給我作燔祭，也沒有用祭物尊敬我；我沒有因供物使你服勞，<strong><mark>也沒有因乳香使你厭煩</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/43/#L23">賽 43:23</a>)</p></blockquote><blockquote><p>“另有一位天使拿著金香爐，來站在祭壇旁邊。<strong><mark>有許多香賜給他</mark></strong>，<strong><mark>要和衆聖徒的祈禱一同獻在寶座前的金壇上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3">啟 8:3</a>)</p></blockquote><blockquote><p>“<strong><mark>那香的煙和衆聖徒的祈禱，從天使的手中一同升到上帝面前</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L4">啟 8:4</a>)</p></blockquote><h3>以香敬奉假神是對上帝的凌辱</h3><blockquote><p>“至於這民的一切惡，就是離棄我，<strong><mark>向別神燒香，跪拜自己手所造的</mark></strong>，我要發出我的判語攻擊他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/1/#L16">耶 1:16</a>)</p></blockquote><blockquote><p>“這百姓時常當面惹我發怒：在園中獻祭，<strong><mark>在壇上燒香</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/65/#L3">賽 65:3</a>)</p></blockquote><blockquote><p>“看哪，這都寫在我面前，我必不靜默，必施行報應，必將你們的罪孽和你們列祖的罪孽，<strong><mark>就是在山上燒香、在岡上褻瀆我的罪孽</mark></strong>，一同報應在他們後人懷中。我先要把他們所行的量給他們。」這是耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/65/#L6">賽 65:6</a>) <em>(俄文本編號爲 Ис 65:7；和合本該句在 65:6。)</em></p></blockquote><p>以聖香敬假神者處以死刑：</p><blockquote><p>“<strong><mark>你們不可按這調和之法爲自己作香</mark></strong>；要以這香爲聖，歸耶和華。 凡作香和這香一樣，爲要聞香味的，<strong><mark>這人要從民中剪除</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/30/#L37-38">出 30:37-38</a>)</p></blockquote>
