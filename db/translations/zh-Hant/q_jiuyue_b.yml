- src: главное-в-законе
  path: QO8T_律法中主要的事
  title: 律法中主要的事
  copy_cover: true
  body: <h2>主要的</h2><ul><li><p>公義</p></li><li><p>憐憫</p></li><li><p>信實</p></li></ul><h2>主耶穌基督的指示</h2><blockquote><p>“你們這假冒爲善的文士和法利賽人有禍了！因爲你們將薄荷、茴香、芹菜獻上十分之一，<strong><mark>那律法上更重的事，就是公義、憐恤、信實，反倒不行了</mark></strong>。<strong><mark>這更重的是你們當行的，那也是不可不行的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L23">太 23:23</a>)</p></blockquote><blockquote><p>“「夫子，<strong><mark>律法上的誡命，那一條是最大的呢</mark></strong>？」 耶穌對他說：「<strong><mark>你要盡心、儘性、盡意，愛主你的上帝</mark></strong>。 <strong><mark>這是誡命中的第一，且是最大的</mark></strong>。 <strong><mark>其次也相倣，就是要愛人如己</mark></strong>。 <strong><mark>這兩條誡命是律法和先知一切道理的總綱</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/22/#L36-40">太 22:36-40</a>)</p></blockquote><h2>使徒的指示</h2><blockquote><p>“<strong><mark>因爲全律法都包在『愛人如己』這一句話之內了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L14">加 5:14</a>)</p></blockquote><h2>先知的指示</h2><blockquote><p>“世人哪，耶和華已指示你何爲善，他向你所要的是什麼呢？<strong><mark>只要你行公義，好憐憫，存謙卑的心，與你的上帝同行</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mih/6/#L8">彌 6:8</a>)</p></blockquote><blockquote><p>“<strong><mark>所以你當歸向你的上帝，謹守仁愛、公平，常常等候你的上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/os/12/#L6">何 12:6</a>)</p></blockquote><blockquote><p>“以色列人哪，你們當聽耶和華的話。耶和華與這地的居民爭辯，<strong><mark>因這地上無誠實，無良善，無人認識上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/os/4/#L1">何 4:1</a>)</p></blockquote><blockquote><p>“<strong><mark>我喜愛良善，不喜愛祭祀</mark></strong>；<strong><mark>喜愛認識上帝，勝於燔祭</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/os/6/#L6">何 6:6</a>)</p></blockquote><blockquote><p>“『萬軍之耶和華曾對你們的列祖如此說：『<strong><mark>要按至理判斷，各人以慈愛憐憫弟兄</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/7/#L9">亞 7:9</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲耶和華喜愛公平，不撇棄他的聖民</mark></strong>。他們永蒙保佑，但惡人的後裔必被剪除。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/37/#L28">詩 37:28</a>) <em>(俄文本編號爲 Пс 36:28（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“<strong><mark>他喜愛仁義公平；遍地滿了耶和華的慈愛</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/33/#L5">詩 33:5</a>) <em>(俄文本編號爲 Пс 32:5（聖詠編號相差一）。)</em></p></blockquote><h2>其餘</h2><blockquote><p>“<strong><mark>只要把裏面的施捨給人</mark></strong>，凡物於你們就都潔淨了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L41">路 11:41</a>)</p></blockquote><blockquote><p>“水可以消滅烈火，<strong>施捨可以補贖罪過</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/3/#L33">德 3:33</a>) <em>(俄文本爲 Сир 3:30。)</em></p></blockquote>
