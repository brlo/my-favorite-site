- src: 10-заповедей
  path: QO10A_十誡
  title: 十誡（十言）
  copy_cover: true
  body: <h2>上帝在石版上賜給先知摩西的十條誡命</h2><p>上帝的誡命並不限於這些，但正是這些誡命寫在了石版上。</p><h3>1</h3><blockquote><p>“「<strong><mark>我是耶和華你的上帝</mark></strong>，曾將你從埃及地爲奴之家領出來。 <strong><mark>除了我以外，你不可有別的神</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L2-3">出 20:2-3</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L6-7">申 5:6-7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L2">利 19:2</a>。)</em></p></blockquote><h3>2</h3><blockquote><p>“<strong><mark>不可爲自己雕刻偶像</mark></strong>；也不可作什麼形像彷彿上天、下地，和地底下、水中的百物。 <strong><mark>不可跪拜那些像；也不可事奉它</mark></strong>，因爲我耶和華你的上帝，是忌邪的上帝。恨我的，我必追討他的罪，自父及子，直到三四代；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L4-5">出 20:4-5</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L8-9">申 5:8-9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L4">利 19:4</a>。)</em></p></blockquote><h3>3</h3><blockquote><p>“<strong><mark>不可妄稱耶和華你上帝的名</mark></strong>；因爲妄稱耶和華名的，耶和華必不以他爲無罪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L7">出 20:7</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L11">申 5:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L12">利 19:12</a>。)</em></p></blockquote><h3>4</h3><blockquote><p>“<strong><mark>當記念安息日，守爲聖日</mark></strong>。 <strong><mark>六日要勞碌作你一切的工</mark></strong>， <strong><mark>但第七日是向耶和華你上帝當守的安息日</mark></strong>。這一日你和你的兒女、僕婢、牲畜，並你城裏寄居的客旅，無論何工都不可作。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L8-10">出 20:8-10</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L12-15">申 5:12-15</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L3">利 19:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/17/#L21">耶 17:21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/neem/13/#L15-18">尼 13:15-18</a>。)</em></p></blockquote><h3>5</h3><blockquote><p>“<strong><mark>當孝敬父母，使你的日子在耶和華你上帝所賜你的地上得以長久</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L12">出 20:12</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L16">申 5:16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L3">利 19:3</a>。)</em></p></blockquote><h3>6</h3><blockquote><p>“<strong><mark>不可殺人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L13">出 20:13</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L17">申 5:17</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L17-18">利 19:17-18</a>。)</em></p></blockquote><h3>7</h3><blockquote><p>“<strong><mark>不可姦淫</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L14">出 20:14</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L18">申 5:18</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L20">利 19:20</a>。)</em></p></blockquote><h3>8</h3><blockquote><p>“<strong><mark>不可偷盜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L15">出 20:15</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L19">申 5:19</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L11">利 19:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L13">利 19:13</a>。)</em></p></blockquote><h3>9</h3><blockquote><p>“<strong><mark>不可作假見證陷害人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L16">出 20:16</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L20">申 5:20</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L11">利 19:11</a>。)</em></p></blockquote><h3>10</h3><blockquote><p>“<strong><mark>不可貪戀人的房屋</mark></strong>，<strong><mark>也不可貪戀人的妻子、僕婢、牛驢，並他一切所有的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L17">出 20:17</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L21">申 5:21</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L17">利 19:17</a>。)</em></p></blockquote><h2>解釋</h2><p><a href="https://bibleox.com/ru/ru/w/Z1BU_Изъяснение_десяти_заповедей">十條誡命的解釋</a></p>
