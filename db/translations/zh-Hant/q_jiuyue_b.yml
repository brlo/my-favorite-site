- src: вино
  path: QO7T_酒
  title: 酒
  copy_cover: true
  body: <h2>主耶穌基督喝酒</h2><blockquote><p>“<strong><mark>人子來了，也吃也喝</mark></strong>，人又說他是<strong><mark>貪食好酒的人</mark></strong>，是稅吏和罪人的朋友。但智慧之子，總以智慧爲是〔有古卷作『但智慧在行爲上就顯爲是』〕。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L19">太 11:19</a>)</p></blockquote><blockquote><p>“我實在告訴你們：<strong><mark>我不再喝這葡萄汁</mark></strong>，<strong><mark>直到我在上帝的國裏喝新的那日子</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L25">可 14:25</a>)</p></blockquote><h2>主在加利利的迦拿婚宴上把水變成了酒</h2><blockquote><p>“<strong><mark>管筵席的嚐了那水變的酒</mark></strong>，並不知道是那裏來的，只有舀水的用人知道。管筵席的便叫新郎來，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L9">約 2:9</a>)</p></blockquote><h2>因阿尼西弗的病，建議他稍微喝點酒</h2><blockquote><p>“因你胃口不清，屢次患病，再不要照常喝水，<strong><mark>可以稍微用點酒</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L23">提前 5:23</a>)</p></blockquote><h2>說明</h2><p>飲食本身不是罪，罪是暴食、貪吃口腹。喝酒本身不是罪，罪是醉酒。</p>
