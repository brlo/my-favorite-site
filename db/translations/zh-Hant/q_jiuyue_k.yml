  title: 舊約的締立
  copy_cover: true
  body: <h2>與亞伯拉罕的約</h2><h3>應許</h3><blockquote><p>“耶和華對亞伯蘭說：「你要離開本地、本族、父家，往我所要指示你的地去。 <strong><mark>我必叫你成爲大國</mark></strong>。<strong><mark>我必賜福給你</mark></strong>，<strong><mark>叫你的名爲大</mark></strong>，<strong><mark>你也要叫別人得福</mark></strong>。 <strong><mark>爲你祝福的，我必賜福與他</mark></strong>；<strong><mark>那咒詛你的，我必咒詛他</mark></strong>。<strong><mark>地上的萬族都要因你得福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/12/#L1-3">創 12:1-3</a>)</p></blockquote><h3>約</h3><blockquote><p>“「我與你立約，<strong><mark>你要作多國的父</mark></strong>。 從此以後，你的名不再叫亞伯蘭，<strong><mark>要叫亞伯拉罕</mark></strong>，因爲我已立你作多國的父。 我必使你的後裔極其繁多，<strong><mark>國度從你而立，君王從你而出</mark></strong>。 <strong><mark>我要與你並你世世代代的後裔堅立我的約，作永遠的約</mark></strong>，<strong><mark>是要作你和你後裔的上帝</mark></strong>。 我要將你現在寄居的地，就是迦南全地，<strong><mark>賜給你和你的後裔，永遠爲業</mark></strong>。<strong><mark>我也必作他們的上帝</mark></strong>。」 上帝又對亞伯拉罕說：「你和你的後裔必世世代代遵守我的約。 <strong><mark>你們所有的男子都要受割禮</mark></strong>，<strong><mark>這就是我與你，並你的後裔所立的約</mark></strong>，是你們所當遵守的。 你們都要受割禮，這是我與你們立約的證據。 你們世世代代的男子，無論是家裏生的，是在你後裔之外用銀子從外人買的，<strong><mark>生下來第八日，都要受割禮</mark></strong>。 你家裏生的和你用銀子買的，都必須受割禮。這樣，我的約就立在你們肉體上，作永遠的約。 但不受割禮的男子，必從民中剪除，因他背了我的約。」 上帝又對亞伯拉罕說：「你的妻子撒萊，不可再叫撒萊，她的名要叫撒拉。 我必賜福給她，也要使你從她得一個兒子。我要賜福給她，她也要作多國之母；必有百姓的君王從她而出。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L4-16">創 17:4-16</a>)</p></blockquote><h3>西奈之約</h3><blockquote><p>“所以你要對以色列人說：『我是耶和華。我要用伸出來的膀臂，重重地刑罰埃及人，救贖你們脫離他們的重擔，不作他們的苦工。 <strong><mark>我要以你們爲我的百姓</mark></strong>，<strong><mark>我也要作你們的上帝</mark></strong>。你們要知道我是耶和華你們的上帝，是救你們脫離埃及人之重擔的。 我起誓應許給亞伯拉罕、以撒、雅各的那地，我要把你們領進去，<strong><mark>將那地賜給你們爲業</mark></strong>。我是耶和華。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/6/#L6-8">出 6:6-8</a>)</p></blockquote><h2>關於救主來臨的應許</h2><h3>對最早的人</h3><blockquote><p>“耶和華上帝對蛇說：「你既作了這事，就必受咒詛，比一切的牲畜野獸更甚！你必用肚子行走，終身吃土。 <strong><mark>我又要叫你和女人彼此爲仇</mark></strong>；你的後裔和女人的後裔也彼此爲仇。<strong><mark>女人的後裔要傷你的頭；你要傷他的腳跟</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L14-15">創 3:14-15</a>)</p></blockquote><h3>對亞伯拉罕</h3><blockquote><p>“「耶和華說：『你既行了這事，不留下你的兒子，就是你獨生的兒子，我便指著自己起誓說： <strong><mark>論福，我必賜大福給你</mark></strong>；<strong><mark>論子孫，我必叫你的子孫多起來</mark></strong>，如同天上的星，海邊的沙。你子孫必得著仇敵的城門。 <strong><mark>並且地上萬國，都必因你的後裔得福</mark></strong>，因爲你聽從了我的話。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/22/#L16-18">創 22:16-18</a>)</p></blockquote><h3>對以撒</h3><blockquote><p>“耶和華向以撒顯現說：「你不要下埃及去，要住在我所指示你的地。 你寄居在這地，<strong><mark>我必與你同在，賜福給你</mark></strong>，<strong><mark>因爲我要將這些地都賜給你和你的後裔</mark></strong>。我必堅定我向你父亞伯拉罕所起的誓。 <strong><mark>我要加增你的後裔，像天上的星那樣多</mark></strong>；又要將這些地都賜給你的後裔，並且<strong><mark>地上萬國必因你的後裔得福</mark></strong>； 都因亞伯拉罕聽從我的話、遵守我的吩咐和我的命令、律例、法度。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/26/#L2-5">創 26:2-5</a>)</p></blockquote><h3>對雅各</h3><blockquote><p>“耶和華站在梯子以上說：「我是耶和華，你祖亞伯拉罕的上帝，也是以撒的上帝；<strong><mark>我要將你現在所躺臥之地，賜給你和你的後裔</mark></strong>。 <strong><mark>你的後裔必像地上的塵沙那樣多</mark></strong>，必向東西南北開展，<strong><mark>地上萬族必因你和你的後裔得福</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/28/#L13-14">創 28:13-14</a>)</p></blockquote><h2>與以色列民的約</h2><blockquote><p>“『我向埃及人所行的事，你們都看見了，且看見我如鷹將你們背在翅膀上，帶來歸我。 <strong><mark>如今你們若實在聽從我的話，遵守我的約，就要在萬民中作屬我的子民</mark></strong>；因爲全地都是我的。 &lt;…&gt; 百姓都同聲回答說：「<strong><mark>凡耶和華所說的，我們都要遵行</mark></strong>。」摩西就將百姓的話回覆耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/19/#L4-5,8">出 19:4-5,8</a>)</p></blockquote><blockquote><p>“<strong><mark>你若實在聽從他的話，照著我一切所說的去行</mark></strong>，我就向你的仇敵作仇敵，向你的敵人作敵人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/23/#L22">出 23:22</a>)</p></blockquote><blockquote><p>“又將約書念給百姓聽，他們說：「耶和華所吩咐的，<strong><mark>我們都必遵行</mark></strong>。」 摩西將血灑在百姓身上，說：「<strong><mark>你看！這是立約的血</mark></strong>，是耶和華按這一切話與你們立約的憑據。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/24/#L7-8">出 24:7-8</a>)</p></blockquote><h2>以色列背離上帝</h2><blockquote><p>“耶和華吩咐摩西說：「下去吧！因爲你的百姓，就是你從埃及地領出來的，<strong><mark>已經敗壞了</mark></strong>。 <strong><mark>他們快快偏離了我所吩咐的道</mark></strong>，爲自己鑄了一隻牛犢，向牠下拜獻祭說：『以色列啊，這就是領你出埃及地的神。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/32/#L7-8">出 32:7-8</a>)</p></blockquote><blockquote><p>“「<strong><mark>因爲我的百姓作了兩件惡事</mark></strong>，就是離棄我這活水的泉源，爲自己鑿出池子，是破裂不能存水的池子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/2/#L13">耶 2:13</a>)</p></blockquote><blockquote><p>“我的民求問木偶，以爲木杖能指示他們，因爲他們的淫心使他們失迷，<strong><mark>他們就行淫離棄上帝，不守約束</mark></strong>。 <strong><mark>在各山頂，各高岡的橡樹、楊樹、栗樹之下獻祭燒香</mark></strong>，因爲樹影美好。所以，你們的女兒淫亂，你們的新婦行淫。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/os/4/#L12-13">何 4:12-13</a>)</p></blockquote><blockquote><p>“牛認識主人，驢認識主人的槽；<strong><mark>以色列卻不認識，我的民卻不留意</mark></strong>。 嗐！<strong><mark>犯罪的國民，擔著罪孽的百姓</mark></strong>；行惡的種類，敗壞的兒女！<strong><mark>他們離棄耶和華，藐視以色列的聖者</mark></strong>，與他生疏，往後退步。 你們爲什麼屢次悖逆，還要受責打麼。你們已經滿頭疼痛，全心發昏。 <strong><mark>從腳掌到頭頂，沒有一處完全的</mark></strong>，盡是傷口、青腫與新打的傷痕．都沒有收口，沒有纏裹，也沒有用膏滋潤。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/1/#L3-6">賽 1:3-6</a>)</p></blockquote><blockquote><p>“耶和華啊，你的眼目，不是看顧誠實嗎？你擊打他們，他們卻不傷慟；你毀滅他們，<strong><mark>他們仍不受懲治</mark></strong>。他們使臉剛硬過於磐石，<strong><mark>不肯回頭</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/5/#L3">耶 5:3</a>)</p></blockquote><blockquote><p>“「我傾覆你們中間的城邑，如同我從前傾覆所多瑪、蛾摩拉一樣，使你們好像從火中抽出來的一根柴，<strong><mark>你們仍不歸向我</mark></strong>。」這是耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/am/4/#L11">摩 4:11</a>)</p></blockquote><h3>上帝預先警告：他將因何把以色列從應許之地趕出</h3><h4>警告</h4><p>猶太民族曾受到警告：他們得到上帝所應許的地，不是因爲他們的義。先前的民族因罪惡滿盈而從上帝的地土上被趕出。以色列被上帝領進這地時則受到警告：若他們也照樣犯罪，上帝也必將他們從自己的地上趕出：</p><blockquote><p>“耶和華你上帝領你進入要得爲業之地，<strong><mark>從你面前趕出許多國民</mark></strong>，就是赫人，革迦撒人、亞摩利人、迦南人、比利洗人、希未人、耶布斯人，<strong><mark>共七國的民，都比你強大</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/7/#L1">申 7:1</a>)</p></blockquote><blockquote><p>“耶和華你的上帝將這些國民從你面前攆出以後，<strong><mark>你心裏不可說：『耶和華將我領進來得這地，是因我的義。』</mark></strong>其實，耶和華將他們從你面前趕出去，是因他們的惡。 你進去得他們的地，<strong><mark>並不是因你的義，也不是因你心裏正直</mark></strong>，<strong><mark>乃是因這些國民的惡</mark></strong>，耶和華你的上帝將他們從你面前趕出去；又因耶和華要堅定他向你列祖亞伯拉罕、以撒、雅各起誓所應許的話。 你當知道，耶和華你上帝將這美地賜你爲業，並不是因你的義，<strong><mark>你本是硬著頸項的百姓</mark></strong>。 <strong><mark>你當記念不忘，你在曠野怎樣惹耶和華你上帝發怒</mark></strong>。自從你出了埃及地的那日，直到你們來到這地方，你們時常悖逆耶和華。 你們在何烈山又惹耶和華髮怒；他惱怒你們，<strong><mark>要滅絕你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/9/#L4-8">申 9:4-8</a>)</p></blockquote><blockquote><p>“你們從前住的埃及地，<strong><mark>那裏人的行爲，你們不可效法</mark></strong>，我要領你們到的迦南地，那裏人的行爲，也不可效法，也不可照他們的惡俗行。 &lt;…&gt; <strong><mark>在這一切的事上，你們都不可玷污自己</mark></strong>，因爲我在你們面前所逐出的列邦，在這一切的事上玷污了自己。 連地也玷污了，所以我追討那地的罪孽，那地也吐出它的居民。 <strong><mark>故此你們要守我的律例、典章</mark></strong>。這一切可憎惡的事，無論是本地人，是寄居在你們中間的外人，都不可行。 （在你們以先居住那地的人，行了這一切可憎惡的事，地就玷污了）， <strong><mark>免得你們玷污那地的時候，地就把你們吐出</mark></strong>，像吐出在你們以先的國民一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/18/#L3,24-28">利 18:3,24-28</a>)</p></blockquote><blockquote><p>“你若不聽從耶和華你上帝的話，不謹守遵行他的一切誡命律例，就是我今日所吩咐你的，<strong><mark>這以下的咒詛都必追隨你</mark></strong>，臨到你身上： &lt;…&gt; 這書上所寫律法的一切話，是叫你敬畏耶和華你上帝可榮可畏的名。<strong><mark>你若不謹守遵行</mark></strong>，耶和華就必將奇災，就是至大至長的災，至重至久的病，加在你和你後裔的身上。 &lt;…&gt; 先前耶和華怎樣喜悅善待你們，使你們衆多，<strong><mark>也要照樣喜悅毀滅你們，使你們滅亡</mark></strong>；並且<strong><mark>你們從所要進去得的地上必被拔除</mark></strong>。 <strong><mark>耶和華必使你們分散在萬民中</mark></strong>，從地這邊到地那邊，你必在那裏事奉你和你列祖素不認識木頭、石頭的神。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/28/#L15,58,63-64">申 28:15,58,63-64</a>)</p></blockquote><h4>以色列民所作的，甚至比先前因罪被趕出的那些民族更壞，因此也被趕出</h4><blockquote><p>“他們卻不聽從。瑪拿西引誘他們行惡，<strong><mark>比耶和華在以色列人面前所滅的列國更甚</mark></strong>。 耶和華藉他僕人衆先知說： 「因猶大王瑪拿西行這些可憎的惡事，<strong><mark>比先前亞摩利人所行的更甚</mark></strong>，使猶大人拜他的偶像，陷在罪裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/21/#L9-11">王下 21:9-11</a>)</p></blockquote><blockquote><p>“<strong><mark>你行這一切惡事之後</mark></strong>，（主耶和華說，你有禍了！有禍了！） &lt;…&gt; 你行淫與別的婦女相反，因爲不是人從你行淫；你既贈送人，人並不贈送你，所以你與別的婦女相反。 <strong><mark>你這妓女啊，要聽耶和華的話</mark></strong>。 &lt;…&gt; 你正是你母親的女兒，厭棄丈夫和兒女；你正是你姐妹的姐妹，厭棄丈夫和兒女。<strong><mark>你母親是赫人，你父親是亞摩利人</mark></strong>。 <strong><mark>你的姐姐是撒瑪利亞</mark></strong>，她和她的衆女住在你左邊；<strong><mark>你的妹妹是所多瑪</mark></strong>，她和她的衆女住在你右邊。 你沒有效法他們的行爲，也沒有照他們可憎的事去作，你以那爲小事，<strong><mark>你一切所行的倒比他們更壞</mark></strong>。 主耶和華說，我指著我的永生起誓，<strong><mark>你妹妹所多瑪與他的衆女，尚未行你和你衆女所行的事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/16/#L23,34-35,45-48">結 16:23,34-35,45-48</a>)</p></blockquote><p>在耶穌基督被釘十字架之前，猶太民族所受的最大刑罰是約70年的期限——巴比倫之囚。而在棄絕並殺死基督之後，猶太民族被從自己的地土上趕出約2000年，聖殿至今沒有歸還。</p><h2>舊約的終結</h2><p><a href="https://bibleox.com/ru/ru/w/Ветхий-Завет-конец">舊約的終結</a></p>
