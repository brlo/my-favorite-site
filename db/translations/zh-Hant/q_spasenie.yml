  title: 不是所有人都得救
  copy_cover: true
  body: <h2>許多人都不會得救</h2><blockquote><p>“你們要努力進窄門。我告訴你們：將來有<strong><mark>許多人</mark></strong>想要進去，<strong>卻是不能</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L24">路 13:24</a>)</p></blockquote><blockquote><p>“你們要進窄門。因爲<strong>引到滅亡</strong>，<strong>那門是寬的</strong>，路是大的，<strong>進去的人也</strong><strong><mark>多</mark></strong>； <strong>引到永生</strong>，<strong>那門是窄的</strong>，路是小的，<strong>找著的人也少</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><h2>不是每個信徒都能得救</h2><blockquote><p>“<strong>凡稱呼我</strong>『主阿，主阿』的人，<strong><mark>不能都</mark></strong><strong>進天國</strong>；惟獨遵行我天父旨意的人，才能進去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L21">太 7:21</a>)</p></blockquote><blockquote><p>“當那日，必有<strong>許多</strong>人對我說：『主阿，主阿，我們不是奉你的名<strong>傳道</strong>，奉你的名<strong>趕鬼</strong>，奉你的名<strong>行許多異能</strong>嗎？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><blockquote><p>“農夫在地裏撒下許多種子，栽種許多植物，但所撒的並不都能保存到底，所栽的也並不都扎根；照樣，那些播在今世的，<strong>並不都能得救</strong>” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/8/#L41">厄四 8:41</a>, )</p></blockquote>
  meta_desc: "“那些播在今世的，並不都能得救”（厄四 8:41）"
