  path: Qz7T_救恩
  title: 救恩
  copy_cover: true
  body: <h2>救恩是什麼</h2><p><strong>救恩</strong>——與上帝同在的永生（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L5-8">羅 2:5-8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L17">太 19:17</a>），脫離死亡的救恩（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L19-20">雅 5:19-20</a>），更新的、得著榮耀的生命（<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L21">腓 3:21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L3-4">彼後 1:3-4</a>）。</p><h3>與上帝同在的永生</h3><blockquote><p>“倘若你一隻手或是一隻腳叫你跌倒，就砍下來丟掉。你缺一隻手或是一隻腳<strong>進入永生</strong>，強如有兩手兩腳被丟在永火裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L8">太 18:8</a>)</p></blockquote><blockquote><p>“耶穌對他說：「<strong>你爲什麼以善事問我呢</strong>？只有一位是善的〔有古卷作『你爲什麼稱我是良善的？除了上帝以外，沒有一個良善的』〕。<strong>你若要進入永生</strong>，就當遵守誡命。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L17">太 19:17</a>)</p></blockquote><h3>成神</h3><blockquote><p>“<strong><mark>上帝的神能已將一切關乎生命和虔敬的事賜給我們</mark></strong>，皆因我們認識那用自己榮耀和美德召我們的主。 因此，他已將<strong>又寶貴、又極大的應許</strong>賜給我們，叫我們既脫離世上從情慾來的敗壞，<strong><mark>就得與上帝的性情有分</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L3-4">彼後 1:3-4</a>)</p></blockquote><blockquote><p>“他要按著那能叫萬有歸服自己的大能，<strong>將我們這卑賤的身體改變形狀，和他自己榮耀的身體相似</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L21">腓 3:21</a>)</p></blockquote><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L21-23">約 17:21-23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L2">約壹 3:2</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/82/#L6">詩 82:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/2/#L20">加 2:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L14,16">羅 8:14,16</a></p><h2>得救的條件</h2><h3>對基督的正確信仰</h3><blockquote><p>“拿撒勒人<strong>耶穌基督的名</strong>。 他是你們『匠人所棄的石頭，已成了房角的頭塊石頭。』 除他以外，<strong>別無拯救</strong>；因爲在天下人間，<strong>沒有賜下別的名，我們可以靠著得救</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L10-12">徒 4:10-12</a>)</p></blockquote><blockquote><p>“<strong>人非有信，就不能得上帝的喜悅</strong>；因爲到上帝面前來的人，必須信有上帝，且信他賞賜那尋求他的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L6">希 11:6</a>)</p></blockquote><blockquote><p>“凡<strong>越過</strong><strong><mark>基督的教訓</mark></strong><strong>不常守著的，就沒有上帝</strong>；<strong>常守這教訓的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><blockquote><p>“<strong>情慾的事都是顯而易見的</strong>，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><h3>信心的行爲</h3><h4>遵守誡命</h4><blockquote><p>“你若要進入永生，就<strong><mark>當遵守誡命</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L17">太 19:17</a>)</p></blockquote><blockquote><p>“所以，凡<strong>聽見我這話就去行</strong>的，好比一個聰明人，把房子蓋在磐石上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L24">太 7:24</a>)</p></blockquote><blockquote><p>“凡到我這裏來，<strong>聽見我的話就去行的</strong>，我要告訴你們他像什麼人： 他像一個人蓋房子，深深地挖地，把根基安在磐石上；到發大水的時候，水衝那房子，房子總不能搖動，因爲根基立在磐石上〔有古卷作『因爲蓋造得好』〕。 <strong>惟有聽見不去行的</strong>，就像一個人在土地上蓋房子，沒有根基；水一衝，<strong>隨即倒塌了</strong>，並且那房子壞的很大。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L47-49">路 6:47-49</a>)</p></blockquote><blockquote><p>“只是你們要<strong><mark>行道</mark></strong>，不要單單聽道，自己欺哄自己。 因爲<strong>聽道而不行道的，就像人對著鏡子看自己本來的面目</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L22-23">雅 1:22-23</a>)</p></blockquote><h4>必須生活在<a href="https://bibleox.com/ru/ru/w/Церковь">教會</a>裏</h4><blockquote><p>“基督是教會的頭，他又是<strong><mark>教會全體的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>)</p></blockquote><blockquote><p>“<strong><mark>基督的身體</mark></strong>，<strong><mark>就是爲教會</mark></strong>，要在我肉身上補滿基督患難的缺欠。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L24">西 1:24</a>)</p></blockquote><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong>都從一位聖靈受洗，成了一個身體</strong>，飲於一位聖靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13">林前 12:13</a>)</p></blockquote><blockquote><p>“你們<strong>受洗歸入基督的，都是披戴基督了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L27">加 3:27</a>)</p></blockquote><blockquote><p>“主將<strong><mark>得救的人天天加給他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L47">徒 2:47</a>) <em>(和合本此處無“歸給教會”的字樣)</em></p></blockquote><h4>洗禮</h4><p>洗禮也稱爲“重生”：</p><blockquote><p>“人若不是<strong><mark>從水和聖靈生的</mark></strong>，就<strong>不能進上帝的國</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L5">約 3:5</a>)</p></blockquote><p>詳見：<a href="https://bibleox.com/ru/ru/w/крещение">洗禮</a></p><h4>領受基督的體血</h4><blockquote><p>“<strong>你們若不吃人子的肉，不喝人子的血，就沒有生命在你們裏面</strong>； 吃我肉、喝我血的人就有永生，<strong>在末日我要叫他復活</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L53-54">約 6:53-54</a>)</p></blockquote><p>詳見：<a href="https://bibleox.com/ru/ru/w/Евхаристия">聖餐禮</a></p><h2>不只信心，行爲也是得救所必需的</h2><h3>沒有行爲的信心不能救人</h3><blockquote><p>“信奉我們榮耀的主耶穌基督，便不可按著外貌待人。 &lt;…&gt; 我的弟兄們，若有人說自己有信心，卻<strong><mark>沒有行爲，有什麼益處呢？這信心能救他嗎</mark></strong>？ 若是弟兄或是姊妹，赤身露體，又缺了日用的飲食， 你們中間有人對他們說，『平平安安的去吧！願你們穿得暖吃得飽』，卻不給他們身體所需用的，這有什麼益處呢？ 這樣，<strong><mark>信心若沒有行爲就是死的</mark></strong>。 必有人說：『你有信心，我有行爲；你將你沒有行爲的信心指給我看，我便藉着我的行爲，將我的信心指給你看。』 你信上帝只有一位，你信的不錯；<strong>鬼魔也信</strong>，卻是戰驚。 虛浮的人哪，你願意知道<strong><mark>沒有行爲的信心是死的</mark></strong>嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L1,14-20">雅 2:1,14-20</a>)</p></blockquote><h3>許多人行不法之事而滅亡，他們不只信了，甚至還奉基督的名行過異能</h3><blockquote><p>“當那日，必有<strong>許多</strong>人對我說：『主阿，主阿，我們不是奉你的名<strong>傳道</strong>，奉你的名<strong>趕鬼</strong>，奉你的名<strong>行許多異能</strong>嗎？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h3>審判按行爲進行</h3><blockquote><p>“人子要在他父的榮耀裏，同著衆使者降臨；那時候，他要<strong><mark>照各人的行爲報應各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“因爲<strong><mark>我們衆人</mark></strong><strong>必要在基督臺前顯露出來</strong>，叫<strong><mark>各人</mark></strong>按著本身<strong><mark>所行的</mark></strong>，或善或惡受報。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><blockquote><p>“甘心事奉，好像服事主，不像服事人。 因爲<strong>曉得</strong><strong>各人所行的善事</strong>，不論是爲奴的、是自主的，都必<strong>按所行的</strong>，得主的賞賜。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L7-8">弗 6:7-8</a>)</p></blockquote><blockquote><p>“主啊，慈愛也是屬乎你，因爲你<strong><mark>照著各人所行的報應他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/62/#L12">詩 62:12</a>)</p></blockquote><blockquote><p>“他<strong><mark>必照各人的行爲報應各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L6">羅 2:6</a>)</p></blockquote><blockquote><p>“我是那察看人肺腑心腸的，並要<strong><mark>照你們的行爲報應你們各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L23">啟 2:23</a>)</p></blockquote><blockquote><p>“「看哪，我必快來！賞罰在我，要<strong><mark>照各人所行的報應他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L12">啟 22:12</a>)</p></blockquote><h3>因行爲稱義，而不是單因信心</h3><blockquote><p>“我們的祖宗亞伯拉罕把他兒子以撒獻在壇上，<strong>豈不是因行爲稱義嗎</strong>？ 可見信心是與他的行爲並行，而且信心因著行爲才得成全。 這就應驗經上所說：『亞伯拉罕信上帝，這就算爲他的義。』他又得稱爲上帝的朋友。 這樣看來，<strong><mark>人稱義是因著行爲，不是單因著信</mark></strong>。 <strong>妓女喇合</strong>接待使者，又放他們從別的路上出去，<strong>不也是一樣因行爲稱義嗎</strong>？ 身體沒有靈魂是死的，信心沒有行爲也是死的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L21-26">雅 2:21-26</a>)</p></blockquote><h3>恆心行善，得著永生</h3><blockquote><p>“你竟任著你剛硬不悔改的心，爲自己積蓄忿怒，以致上帝震怒，顯他公義審判的日子來到。 <strong>他必照各人的行爲報應各人</strong>。 凡<strong><mark>恆心行善</mark></strong>，尋求榮耀、尊貴和<strong><mark>不能朽壞</mark></strong>之福的，就以<strong><mark>永生</mark></strong>報應他們； 惟有結黨不順從真理，反順從不義的，就以忿怒、惱恨報應他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L5-8">羅 2:5-8</a>)</p></blockquote><h3>在善事上富足，得以持定永生</h3><blockquote><p>“又要囑咐他們行善，<strong><mark>在好事上富足</mark></strong>，甘心施捨，樂意供給人， 爲自己積成美好的根基，預備將來，<strong><mark>叫他們持定那真正的生命</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L18-19">提前 6:18-19</a>)</p></blockquote><h3>人受造是爲了行善</h3><p>沒有行爲，就是違揹上帝對自己的旨意。人若沒有善行，就不能成就他被造的目的，不能成就他受造所要作的事：</p><blockquote><p>“我們原是他的工作，<strong>在基督耶穌裏造成的</strong>，爲要叫我們<strong><mark>行善</mark></strong>，就是上帝所預備叫我們行的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L10">弗 2:10</a>)</p></blockquote><h3>上帝的國是藉著跟隨基督忍受苦難而承受的</h3><blockquote><p>“既是兒女，便是<strong><mark>後嗣</mark></strong>，就是上帝的後嗣，和基督同作後嗣。<strong><mark>如果</mark></strong>我們和他<strong><mark>一同受苦</mark></strong>，也必和他一同得榮耀。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L17">羅 8:17</a>)</p></blockquote><h3>使徒知道，傳福音（行爲）終必叫他得救</h3><blockquote><p>“因爲我知道，這事藉着你們的祈禱和耶穌基督之靈的幫助，<strong>終必叫我得救</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L19">腓 1:19</a>)</p></blockquote><h3>基督徒的義必須勝過文士和法利賽人的義</h3><blockquote><p>“我告訴你們：<strong><mark>你們的義若不勝於文士和法利賽人的義</mark></strong>，<strong><mark>斷不能進天國</mark></strong>。 &lt;…&gt; 只是我告訴你們：凡向弟兄動怒的，難免受審判〔有古卷在『凡』字下添『無緣無故的』五字』〕。凡罵弟兄是拉加的，難免公會的審斷；凡罵弟兄是魔利的，難免地獄的火。 &lt;…&gt; 只是我告訴你們：凡看見婦女就動淫念的，這人心裏已經與他犯奸淫了。 &lt;…&gt; 只是我告訴你們：什麼誓都不可起。不可指著天起誓，因爲天是上帝的座位； &lt;…&gt; 只是我告訴你們：不要與惡人作對。有人打你的右臉，連左臉也轉過來由他打； &lt;…&gt; 只是我告訴你們：要愛你們的仇敵，爲那逼迫你們的禱告。 &lt;…&gt; 所以你們要完全，像你們的天父完全一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L20,22,28,34,39,44,48">太 5:20,22,28,34,39,44,48</a>) <em>(俄文原文此處有編者注：“接下來馬上是關於行爲的教導”)</em></p></blockquote><p>而文士和法利賽人能說不能行：</p><blockquote><p>“<strong><mark>文士和法利賽人</mark></strong>坐在摩西的位上， 凡他們所吩咐你們的，你們都要謹守遵行；但不要效法他們的行爲，因爲他們<strong><mark>能說不能行</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L2-3">太 23:2-3</a>)</p></blockquote><p>*信心在有行爲時纔算爲義。人不僅因信稱義，也因行爲稱義（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L21-24">雅 2:21-24</a>）。</p><h3>行義的纔是義人</h3><blockquote><p>“小子們哪，不要被人誘惑。<strong><mark>行義的纔是義人</mark></strong>，正如主是義的一樣。 <strong>犯罪的是屬魔鬼</strong>，因爲魔鬼從起初就犯罪。上帝的兒子顯現出來，爲要除滅魔鬼的作爲。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L7-8">約壹 3:7-8</a>)</p></blockquote><h3>義人僅僅得救</h3><p>義人——遵行上帝公義的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/33/#L13-16">結 33:13-16</a>）。罪人——違揹上帝公義而行的人，即犯罪的人。就連義人也僅僅得救。照此推論，罪人就完全不能得救了：</p><blockquote><p>“『若是<strong><mark>義人僅僅得救</mark></strong>，那不虔敬和犯罪的人，將有何地可站呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L18">彼前 4:18</a>)</p></blockquote><h3>可以口稱認識上帝，行爲卻背棄他</h3><blockquote><p>“你們爲什麼稱呼我『主啊，主啊』<strong><mark>卻不遵我的話行呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L46">路 6:46</a>)</p></blockquote><blockquote><p>“他們<strong>說是認識上帝</strong>，<strong><mark>行事卻和他相背</mark></strong>；本是可憎惡的，是悖逆的，在各樣善事上是可廢棄的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L16">多 1:16</a>)</p></blockquote><p>上帝所不喜悅的行爲中，有異端（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L20">加 5:20</a>），也有在信徒中間製造分裂（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>）。</p><h3>使罪人從迷路上轉回的行爲，能遮蓋許多的罪</h3><p>若真實的信徒使鄰人離棄錯謬，這行爲就能遮蓋許多的罪。如果救恩單憑信心成就，那麼使鄰人離棄錯謬就只對鄰人有益，對使人迴轉的人卻毫無益處，也不會遮蓋他的罪（既然你已因信得救，還有什麼罪需要遮蓋呢？）：</p><blockquote><p>“我的弟兄們，你們中間若有失迷真道的，有人使他迴轉； 這人該知道叫一個罪人從迷路上<strong><mark>轉回</mark></strong>，便是<strong><mark>救一個靈魂不死</mark></strong>，並且<strong><mark>遮蓋許多的罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L19-20">雅 5:19-20</a>)</p></blockquote><h3>勸勉信徒務要竭力進入上帝的安息</h3><p>就是說，若不竭力，信徒也可能進不去：</p><blockquote><p>“所以，我們<strong><mark>務必竭力進入那安息</mark></strong>，免得有人學那不信從的樣子跌倒了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/4/#L11">希 4:11</a>)</p></blockquote><h3>品德與進入永遠的國</h3><p>信徒若有這些品德，就不會沒有成效。在這幾樣上不斷長進，必得著進入國的寬闊之路；沒有品德的，就是眼瞎：</p><blockquote><p>“正因這緣故，你們要分外的殷勤。<strong><mark>有了信心，又要加上德行</mark></strong>；有了德行，又要加上<strong>知識</strong>； 有了知識，又要加上<strong>節制</strong>；有了節制，又要加上<strong>忍耐</strong>；有了忍耐，又要加上<strong>虔敬</strong>； 有了虔敬，又要加上<strong>愛弟兄的心</strong>；有了愛弟兄的心，又要加上<strong>愛衆人的心</strong>。 <strong><mark>你們若充充足足的有這幾樣，就必使你們在認識我們的主耶穌基督上，不至於閒懶不結果子了</mark></strong>。 <strong>人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨</strong>。 所以弟兄們，<strong><mark>應當更加殷勤，使你們所蒙的恩召和揀選堅定不移</mark></strong>。你們若行這幾樣，就永不失腳。 <strong><mark>這樣，必叫你們豐豐富富的得以進入我們主救主耶穌基督永遠的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L5-11">彼後 1:5-11</a>)</p></blockquote><p>---</p><p>這樣，沒有行爲的信心不能救人，沒有信心的行爲同樣不能救人。</p><h2>受洗後的信徒仍會犯罪，必須與裏面的罪爭戰</h2><blockquote><p>“因爲我們<strong>得知真道以後，若故意犯罪</strong>，<strong>贖罪的祭就再沒有了</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L26">希 10:26</a>)</p></blockquote><blockquote><p>“<strong>我們若說自己無罪，便是自欺</strong>，真理不在我們心裏了； 我們若認自己的罪，上帝是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L8-9">約壹 1:8-9</a>)</p></blockquote><blockquote><p>“我小子們哪，我將這些話寫給你們，<strong><mark>是要叫你們不犯罪</mark></strong>。若有人犯罪，在父那裏我們有一位中保，就是那義者耶穌基督。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L1">約壹 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>你們中間的爭戰、鬥毆，是從那裏來的呢</mark></strong>？不是從你們百體中戰鬥之私慾來的嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L1">雅 4:1</a>)</p></blockquote><blockquote><p>“你們中間有病了的呢，他就<strong>該請教會的長老來</strong>，他們可以奉主的名用油抹他，爲他禱告。 <strong>出於信心的祈禱要救那病人</strong>，主必叫他起來；<strong>他若犯了罪，也必蒙赦免</strong>。 所以你們要彼此認罪，<strong>互相代求，使你們可以得醫治</strong>。<strong>義人祈禱所發的力量是大有功效的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>你們要醒悟爲善，不要犯罪</mark></strong>，因爲<strong>有人不認識上帝</strong>。我說這話是要叫你們羞愧。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L33-34">林前 15:33-34</a>)</p></blockquote><blockquote><p>“並要以恩慈相待，存憐憫的心，<strong><mark>彼此饒恕</mark></strong>，正如上帝在基督裏饒恕了你們一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L32">弗 4:32</a>)</p></blockquote><p>最後，主耶穌基督賜給門徒一篇祈禱，教導他們求赦免罪。這不是一生只念一次的祈禱。門徒求基督教導他們禱告，基督就賜給他們這個禱告的範本：</p><blockquote><p>“<strong><mark>你們禱告的時候，要說</mark></strong>：我們在天上的父〔有古卷只作『父阿』〕：願人都尊你的名爲聖。願你的國降臨，願你的旨意行在地上，如同行在天上〔有古卷沒有『願你的旨意云云』〕。 我們日用的飲食，天天賜給我們。 <strong><mark>赦免我們的罪</mark></strong>，因爲我們也赦免凡虧欠我們的人。不叫我們遇見試探；救我們脫離兇惡〔有古卷無末句〕。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L1-4">路 11:1-4</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L7-13">太 6:7-13</a>)</p></blockquote><h2>救恩不是一次性的事件，而是終生的過程</h2><p>必須去作成救恩（希臘文 κατεργάζεσθε——行出來、作成、達成、獲得、贏取）：</p><blockquote><p>“這樣看來，我親愛的弟兄，你們既是常順服的，不但我在你們那裏，就是我如今不在你們那裏，更是順服的，就當恐懼戰兢，<strong>作成你們得救的工夫</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L12">腓 2:12</a>)</p></blockquote><p>使徒如同在受生產之苦，直到基督在受洗的基督徒裏面成形。也就是說，基督並不是自動地、在一瞬間就在他們裏面成形的：</p><blockquote><p>“我小子啊，<strong>我爲你們再受生產之苦，直等到基督成形在你們心裏</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L19">加 4:19</a>)</p></blockquote><blockquote><p>“那美好的仗我已經打過了；<strong>當跑的路我已經跑盡了</strong>；所信的道我已經守住了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L7">提後 4:7</a>)</p></blockquote><p>救恩只是應許給人，而不是已經到手（是“必得救”，而不是“已得救”）：</p><blockquote><p>“並且你們要爲我的名被衆人恨惡，惟有<strong><mark>忍耐到底的</mark></strong>必然得救。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L22">太 10:22</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L13">太 24:13</a>)</p></blockquote><blockquote><p>“你將要受的苦你不用怕。魔鬼要把你們中間幾個人下在監裏，叫你們被試煉，你們必受患難十日。你<strong><mark>務要至死忠心，我就賜給你</mark></strong>那生命的冠冕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L10">啟 2:10</a>)</p></blockquote><p>使徒雖然自知沒有作過違揹上帝的事，卻不審判自己，也不以此自稱爲義，而是等候上帝的審判：</p><blockquote><p>“人應當以我們爲基督的<strong>執事</strong>，爲上帝奧祕事的<strong>管家</strong>。 <strong>所求於管家的，是要他有忠心</strong>。 我被你們論斷，或被別人論斷，我都以爲極小的事．<strong><mark>連我自己也不論斷自己</mark></strong>。 我雖不覺得自己有錯，卻也不能因此得以稱義；<strong><mark>但判斷我的乃是主</mark></strong>。 所以，<strong>時候未到，什麼都不要論斷</strong>，只等主來，他要照出暗中的隱情，顯明人心的意念。那時，各人要從上帝那裏得著稱讚。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L1-5">林前 4:1-5</a>)</p></blockquote><h3>論達到基督徒的完全</h3><p>使徒和所有基督徒一樣，爲要得著不能壞的冠冕而奔跑、勞苦，擔心自己被棄絕：</p><blockquote><p>“凡較力爭勝的，諸事都有節制，他們不過是<strong>要得能壞的冠冕</strong>；我們卻是<strong>要得不能壞的冠冕</strong>。 所以，<strong>我奔跑</strong>，不像無定向的；我鬥拳，不像打空氣的。 我是<strong>攻克己身，叫身服我</strong>，恐怕我傳福音給別人，<strong><mark>自己反被棄絕了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/9/#L25-27">林前 9:25-27</a>)</p></blockquote><blockquote><p>“<strong>這不是說我已經得著了，已經完全了</strong>，<strong>我乃是竭力追求</strong>，或者可以得著基督耶穌所以得著我的。 弟兄們，<strong>我不是以爲自己已經得著了</strong>，我只有一件事，就是忘記背後，努力面前的， <strong>向着標竿直跑</strong>，要得上帝在基督耶穌裏從上面召我來得的獎賞。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L12-14">腓 3:12-14</a>)</p></blockquote><h3>將要得救的人和滅亡的人</h3><p>正如將要得救的人還未得救，將要滅亡的人也還未滅亡。兩者都在路上，都可能改變方向：將得救的還可能走向滅亡，將滅亡的還可能走向救恩：</p><blockquote><p>“因爲我們在上帝面前，無論在<strong><mark>得救的人</mark></strong>身上，或<strong><mark>滅亡的人</mark></strong>身上，都有基督馨香之氣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/2/#L15">林後 2:15</a>)</p></blockquote><p>許多人想要進入天國，卻進不去：</p><blockquote><p>“你們要努力進窄門。我告訴你們：將來有<strong><mark>許多人想要進去，卻是不能</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L24">路 13:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L14">太 7:14</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L13">太 7:13</a>)</p></blockquote><p>不僅許多信徒，甚至連奉基督的名行異能的人，也進不了天國：</p><blockquote><p>“當那日，必有<strong>許多</strong>人對我說：『主阿，主阿，我們不是奉你的名<strong>傳道</strong>，奉你的名<strong>趕鬼</strong>，奉你的名<strong>行許多異能</strong>嗎？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>基督——普世的審判者</h2><h3>人人都要受審判</h3><blockquote><p>“因爲<strong><mark>我們衆人</mark></strong><strong>必要在基督臺前顯露出來</strong>，叫各人按著本身<strong>所行的</strong>，<strong>或善或惡</strong>受報。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><blockquote><p>“你這個人，爲什麼論斷弟兄呢？又爲什麼輕看弟兄呢？因<strong><mark>我們都要站在上帝的臺前</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L10">羅 14:10</a>)</p></blockquote><blockquote><p>“你們既然要<strong><mark>按使人自由的律法受審判</mark></strong>，就該照這律法說話行事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L12">雅 2:12</a>)</p></blockquote><blockquote><p>“因爲<strong><mark>人所作的事</mark></strong>，連一切隱藏的事，<strong>無論是善是惡</strong>，<strong>上帝都必審問</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/12/#L14">傳 12:14</a>)</p></blockquote><blockquote><p>“當<strong>人子</strong>在他榮耀裏，同著衆天使降臨的時候，要<strong>坐在他榮耀的寶座上</strong>。 <strong><mark>萬民</mark></strong>都要聚集在他面前。<strong><mark>他要把他們分別出來</mark></strong>，好像牧羊的分別<strong><mark>綿羊山羊</mark></strong>一般；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h3>審判要從教會起首</h3><blockquote><p>“因爲時候到了，<strong><mark>審判要從上帝的家起首</mark></strong>。若是<strong><mark>先從我們起首</mark></strong>，那不信從上帝福音的人將有何等的結局呢？ 『若是<strong>義人僅僅得救</strong>，那不虔敬和犯罪的人，將有何地可站呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><blockquote><p>“我被你們論斷，或被別人論斷，我都以爲極小的事．<strong><mark>連我自己也不論斷自己</mark></strong>。 我雖不覺得自己有錯，卻也不能因此得以稱義；<strong><mark>但判斷我的乃是主</mark></strong>。 所以，<strong>時候未到，什麼都不要論斷</strong>，只等主來，他要照出暗中的隱情，顯明人心的意念。那時，各人要從上帝那裏得著稱讚。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L3-5">林前 4:3-5</a>)</p></blockquote><h3>人人都多多地犯罪</h3><blockquote><p>“原來<strong>我們在許多事上都有過失</strong>；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/3/#L2">雅 3:2</a>)</p></blockquote><blockquote><p>“<strong>我們若說自己無罪，便是自欺</strong>，真理不在我們心裏了； &lt;…&gt; 我們若說自己沒有犯過罪，便是以上帝爲說謊的，他的道也不在我們心裏了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L8,10">約壹 1:8,10</a>)</p></blockquote><h3>許多人必要驚訝，因爲沒有得著救恩</h3><p>他們以爲已經得救了：</p><blockquote><p>“當那日，必有<strong>許多</strong>人對我說：『主阿，主阿，我們不是奉你的名<strong>傳道</strong>，奉你的名<strong>趕鬼</strong>，奉你的名<strong>行許多異能</strong>嗎？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>對異議的回應</h2><h3>“信徒不受審判”</h3><blockquote><p>“我實實在在的告訴你們，那聽我話又信差我來者的，就有永生，<strong>不至於定罪</strong>，是已經出死入生了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L24">約 5:24</a>)</p></blockquote><p>簡要地說：這裏所說的是，真實的信徒和遵行救主話語的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L47-49">路 6:47-49</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L17">約壹 2:17</a>）不會被判罪受刑罰；但誰是這些信徒和遵行的人，要由基督自己在審判時決定（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L3-5">林前 4:3-5</a>），因爲如上所示，普世的審判正是從教會開始（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L17-18">彼前 4:17-18</a>），而人人都要受審判。</p><p>我們更詳細地看這一點。</p><p>這節經文應當按照聖經全部的教導來理解。聖經裏既說到得救必須遵行誡命（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L47-49">路 6:47-49</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L17">約壹 2:17</a>），也說到必須受洗（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L5">約 3:5</a>）、領受聖餐（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L53-54">約 6:53-54</a>），以及許多別的。不能只看一些經文，而對其他經文視而不見。</p><p>既然不能排除得救所需的其他條件，那麼這裏所說的是指那些藉洗禮進入教會、藉參與聖餐活在教會（基督的身體）裏、遵行誡命、認識上帝的旨意並照著生活的信徒。如果這樣行，就不會來到審判臺前被判罪。但誰是這樣行的人？唯有審判者基督知道。所以，首先所有人都要來到審判臺前，這在其他經文裏有直接的說明。</p><p>人人都要受審判：</p><blockquote><p>“因爲<strong>我們衆人必要在基督臺前顯露出來</strong>，叫各人按著本身<strong>所行的</strong>，<strong>或善或惡</strong>受報。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><p>這裏所說的正是<strong>信徒</strong>：</p><blockquote><p>“你這個人，爲什麼<strong>論斷弟兄</strong>呢？又爲什麼<strong>輕看弟兄</strong>呢？因<strong>我們都要站在上帝的臺前</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L10">羅 14:10</a>)</p></blockquote><blockquote><p>“因爲<strong>人所作的事</strong>，連一切隱藏的事，<strong>無論是善是惡</strong>，<strong>上帝都必審問</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/12/#L14">傳 12:14</a>)</p></blockquote><p>但僅僅說人人都要受審判還不夠。而且，審判正是從教會開始，也就是從信徒開始：</p><blockquote><p>“因爲時候到了，<strong><mark>審判要從上帝的家起首</mark></strong>。若是<strong><mark>先從我們起首</mark></strong>，那不信從上帝福音的人將有何等的結局呢？ 『若是義人僅僅得救，那不虔敬和犯罪的人，將有何地可站呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><p>總之，信徒並且遵行的人（至於是誰——由基督作爲審判者決定）不會來到審判臺前被判罪。</p><p>這些<strong>許多信徒</strong>顯然以爲自己已經得救、不必受審判，然而他們雖然信了，卻要被定罪爲作惡的人：</p><blockquote><p>“當那日，必有<strong>許多</strong>人對我說：『主阿，主阿，我們不是<strong>奉你的名傳道</strong>，<strong>奉你的名趕鬼</strong>，<strong>奉你的名行許多異能</strong>嗎？』 我就明明地告訴他們說：『<strong>我從來不認識你們，你們這些作惡的人，離開我去吧</strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><p>總之，基督要審判所有人，在審判中把人彼此分開：</p><blockquote><p>“當人子在他榮耀裏，同著衆天使降臨的時候，要坐在他榮耀的寶座上。 <strong><mark>萬民</mark></strong>都要聚集在他面前。<strong><mark>他要把他們分別出來</mark></strong>，好像牧羊的分別<strong><mark>綿羊山羊</mark></strong>一般；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h3>“人稱義不是因行律法”</h3><blockquote><p>“既知道<strong>人稱義不是因行</strong><strong><mark>律法</mark></strong>，<strong>乃是因信耶穌基督</strong>，連我們也信了基督耶穌，使我們因信基督稱義，<strong>不因行</strong><strong><mark>律法</mark></strong><strong>稱義，因爲凡有血氣的，沒有一人因行</strong><strong><mark>律法</mark></strong><strong>稱義</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/2/#L16">加 2:16</a>)</p></blockquote><p>這裏所說的是摩西律法的行爲，人不能靠它稱義。在加拉太書中這是全書的主題，起因是關於外邦人是否需要受割禮的爭論。受割禮並不需要，因爲我們得救不是靠摩西律法的行爲，而是靠對基督的信心和這信心的行爲（參見上文“不只信心，行爲也是得救所必需的”一節）。</p><h3>“你們得救是本乎恩，也因著信”</h3><blockquote><p>“當我們死在過犯中的時候，便叫我們與基督一同活過來（<strong>你們得救是本乎恩</strong>）。 &lt;…&gt; <strong>你們得救是本乎恩，也因著信</strong>。這並不是出於自己，<strong>乃是上帝所賜的</strong>； <strong>也不是出於行爲</strong>，免得有人自誇。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L5,8-9">弗 2:5,8-9</a>)</p></blockquote><p>這裏所說的不是每個人個人的得救，而是得救的可能性臨到世界（即這可能性得以開啟）。</p><h4>1. 得救可能性的開啟——是恩賜</h4><p>在基督以前，人沒有得救的可能。基督以後，得救成爲可能，得救的途徑也被建立。人作了什麼，使得救成爲可能？什麼也沒有作，人類的罪反而越來越多。救恩之路的建立，是上帝賜給人的<strong>恩賜</strong>。這恩賜不是罪惡的人類掙來的：</p><blockquote><p>“<strong>因我們還軟弱的時候，基督就按所定的日期爲罪人死</strong>。 爲義人死，是少有的，爲仁人死，或者有敢作的； <strong><mark>惟有基督在我們還作罪人的時候爲我們死，上帝的愛就在此向我們顯明了</mark></strong>。 現在我們既靠著他的血稱義，就更要藉着他免去上帝的忿怒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L6-9">羅 5:6-9</a>)</p></blockquote><h4>2. 救恩的途徑——是恩賜</h4><p>同樣，要走上得救之路並獲得救恩的途徑，對具體的人來說，需要的正是信心。他被引入教會，在洗禮中重生，在聖膏中領受聖靈的恩賜，在聖餐禮中與基督聯合——這一切都是<strong>因信心而白白領受的恩賜</strong>。不要求人先掙得這個恩賜。</p><h4>3. 走過得救之路——一生之中，靠上帝的幫助（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L10">林前 15:10</a>）以人的行爲（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L5-8">羅 2:5-8</a>）來成就（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L10">啟 2:10</a>）</h4><p>接下來說到在基督裏受生的目的——就是善行：</p><blockquote><p>“我們原是他的工作，在基督耶穌裏造成的，爲要叫我們<strong><mark>行善</mark></strong>，就是上帝所預備叫我們行的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L10">弗 2:10</a>)</p></blockquote><p>若沒有這些善行，如聖經其他地方所說，人就不能得救，因爲沒有行爲的信心是死的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L20">雅 2:20</a>），人稱義是因著行爲，不是單因著信（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L24">雅 2:24</a>），人人都要受審判（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>），而審判必按行爲進行（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L7-8">弗 6:7-8</a>）。</p><p>因此，曾向人類開啟的救恩，不僅要以信心、也要以行爲去領受；而如上所示，這是一個過程，而且是艱難的過程，它的終點許多人達不到：</p><blockquote><p>“你們要努力進窄門。我告訴你們：將來有<strong><mark>許多人想要進去，卻是不能</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L24">路 13:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L14">太 7:14</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L13">太 7:13</a>)</p></blockquote><h3>悔改的強盜只來得及相信，沒有作過任何行爲嗎？</h3><p>悔改的強盜得救，是作爲舊約以色列的一部分，與上帝立有舊約，憑著對救主的信心，並且來得及作了一些事。</p><p>爲什麼說在舊約裏？因爲經上記著，基督要用聖靈施洗（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L16">路 3:16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L11">太 3:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L8">可 1:8</a>），而基督應許在昇天之後才差遣聖靈來（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L7">約 16:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L26">約 14:26</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L38-39">約 7:38-39</a>），也就是在五旬節。經上沒有寫強盜被傳講悔改和受洗，也沒有寫聖靈降在強盜身上（不同於後來其他古代基督徒的情形）。這樣，悔改的強盜還在舊約之內、教會建立之前得救，沒有經過洗禮和聖餐禮這兩個聖奧祕。</p><p>然而，強盜也作了一件事——謙卑地領受了所加給他的刑罰，承認這是自己應得的，結出了與悔改的心相稱的果子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L8">太 3:8</a>）。</p><blockquote><p>“<strong>我們是應該的，因我們所受的與我們所作的相稱</strong>，但這個人沒有作過一件不好的事。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/23/#L41">路 23:41</a>)</p></blockquote><p>謙卑地忍受苦難，不發怨言責怪上帝，不在別人身上尋找罪魁，也不定別人的罪——這是基督徒的行爲（<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/3/#L11">箴 3:11</a>）。我們的始祖墮落之後，不是責備自己，而是責備別人，甚至多少責怪上帝：</p><blockquote><p>“<strong>你所賜給我、與我同居的女人，她把那樹上的果子給我，我就喫了</strong>。」 耶和華上帝對女人說：「你做的是什麼事呢？」女人說：「<strong>那蛇引誘我，我就喫了</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L12-13">創 3:12-13</a>)</p></blockquote><p>而強盜責備的是自己，並且甘心領受刑罰。這是行爲，而且極配得上基督徒的心志。</p><p>他雖是強盜，並沒有被高舉爲偉人之一，也沒有得著救主右邊或左邊所預備的座位（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L40">可 10:40</a>）；但他是因信心得救的，並且還有他來得及作成的那件小行爲。所以，強盜到底還是有行爲，而不只有信心。</p><p>還要注意的是，並不是強盜自己宣稱得救，而是基督對他作出審判。強盜的話裏看不出任何對得救的確信；相反，他明白自己不會與上帝同享永生，所以只懷著對憐憫的謹慎盼望，求基督在他進入自己國的時候記念他（照強盜自己的想法，那時他不會在那個國裏）。</p><h3>“凡求告主名的，就必得救”</h3><blockquote><p>“因爲『<strong>凡求告主名的，就必得救</strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/10/#L13">羅 10:13</a>)</p></blockquote><blockquote><p>“到那時候，<strong>凡求告主名的，就必得救</strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L21">徒 2:21</a>)</p></blockquote><p>有人可能產生疑問：難道只要求告主，無論怎樣求告、無論行什麼，就都必得救？其實，這裏的“凡”是說，能得救的不僅是猶太人，而是任何民族的人。</p><p>這些話使徒只是引用。最初是舊約中對猶太人所說的預言。使徒在此提醒這些話，並指出它們應驗的時候已經到了。舊約中說這話的是先知約珥：</p><blockquote><p>“到那時候，<strong>凡求告耶和華名的就必得救</strong>；因爲照耶和華所說的，在錫安山，耶路撒冷必有逃脫的人，在剩下的人中，必有耶和華所召的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iol/2/#L32">珥 2:32</a>)</p></blockquote><p>先知的話是對以色列民說的，以色列民堅信上帝只拯救以色列人。於是給以色列民一個預言：時候將到，得救的不再只是以色列人，而是任何求告上帝的民族。</p><p>總之，這話出自舊約——上帝只與以色列民立舊約；新約則是與教會立的，教會召聚了萬民，因爲在教會裏民族已不再有意義（<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L11">西 3:11</a>）。這裏說的正是這一點，從上下文可以直接看出：民族對得救沒有意義：</p><blockquote><p>“經上說：『<strong>凡信他的人，必不至於羞愧</strong>。』 <strong><mark>猶太人和希利尼人並沒有分別</mark></strong>；因爲衆人同有一位主，他也厚待一切求告他的人。 因爲『<strong><mark>凡求告主名的，就必得救</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/10/#L11-13">羅 10:11-13</a>)</p></blockquote><p>聖經其餘的部分，並不因此失去必要性。</p><p>怎樣得救？遵守誡命——主說：</p><blockquote><p>“你若要進入永生，就<strong>當遵守誡命</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L17">太 19:17</a>)</p></blockquote><p>求告上帝的話把這廢除了嗎？當然沒有。</p><p>經上說，不從水和聖靈生的，就不能見上帝的國，也不能進上帝的國。這同樣沒有廢除：</p><blockquote><p>“耶穌回答說：「我實實在在的告訴你，人若不重生，就<strong>不能見上帝的國</strong>。」 &lt;…&gt; 耶穌說：「我實實在在的告訴你，人若不是從水和聖靈生的，就<strong>不能進上帝的國</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5">約 3:3,5</a>)</p></blockquote><p>關於聖餐禮的話也沒有廢除。沒有它，人就不能在自己裏面有生命，也不能在末日復活（爲與上帝同活）：</p><blockquote><p>“<strong>你們若不吃人子的肉，不喝人子的血，就沒有生命在你們裏面</strong>； 吃我肉、喝我血的人就有永生，<strong>在末日我要叫他復活</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L53-54">約 6:53-54</a>)</p></blockquote><p>尼哥拉一黨人和許多異端也求告上帝，然而他們作爲異端和分裂教會者，被判失去上帝的國：</p><blockquote><p>“<strong>情慾的事都是顯而易見的</strong>，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、<strong><mark>結黨、紛爭</mark></strong>、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>) <em>(*“結黨、紛爭”（διχοστασίαι）——分裂、分派。)</em></p></blockquote><p>總之，“凡”是指任何民族的人，而不只是猶太人。關於教會，使徒這樣說：</p><blockquote><p>“但現在你們要棄絕這一切的事，以及惱恨、忿怒、惡毒、毀謗，並口中污穢的言語。 &lt;…&gt; 穿上了新人。這新人在知識上漸漸更新，正如造他主的形像。 在此並不分<strong><mark>希利尼人、猶太人</mark></strong>、受割禮的、未受割禮的、<strong><mark>化外人、西古提人</mark></strong>、爲奴的、自主的，惟有基督是包括一切，又住在各人之內。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L8,10-11">西 3:8,10-11</a>)</p></blockquote><h3>“代贖的祭”</h3><p>有些主張救恩只憑信心（不憑行爲）的人，講到一種稱爲“代贖的祭”的救贖理論，其含義如下：正如以撒被獻爲祭時有羊羔代替，使以撒得以存活；同樣，基督代替罪人被獻爲祭，使罪人得以存活。這樣，既然上帝父把他的怒氣傾倒在兒子身上，他就不再向信主的罪人發怒。於是信主的罪人與上帝同活就不再有攔阻。</p><p>代贖之祭的理論看來並不符合真理。它出自一個錯誤的前提：問題在於上帝（他向罪人發怒）。爲了“糾正”上帝（這念頭本身就何等僭妄），兒子必須死。而人自己完全不必悔改，因爲上帝將向兒子發怒，於是（彷彿在上帝那邊的）問題就解決了。這樣的理論不能被當作真理，因爲它違揹常識。顯然，問題不在於上帝。與上帝同在的永生之中，任何不潔淨的都不能進入：</p><blockquote><p>“那城內又不用日月光照，因有上帝的榮耀光照，又有羔羊爲城的燈。 &lt;…&gt; <strong>凡不潔淨的，並那行可憎與虛謊之事的，總不得進那城</strong>；只有名字寫在羔羊生命冊上的才得進去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/21/#L23,27">啟 21:23,27</a>)</p></blockquote>
