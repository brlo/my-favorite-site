  path: QO21A_摩西律法的廢除
  title: 摩西律法的廢除
  copy_cover: true
  body: '<h2>摩西律法廢除的詳細解釋</h2><p>關於摩西律法的廢除，見聖教父引文前的序言：<a href="https://bibleox.com/ru/ru/w/Отмена_Закона_Моисея">論摩西律法的廢除</a>。</p><h2>摩西律法已被廢除</h2><blockquote><p>“但我們既然在捆我們的律法上死了，<strong><mark>現今就脫離了律法</mark></strong>，叫我們服事主，<strong><mark>要按著心靈的新樣，不按著儀文的舊樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L6">羅 7:6</a>)</p></blockquote><h3>不再在師傅（律法）的手下</h3><blockquote><p>“這樣，律法是與上帝的應許反對嗎？<strong><mark>斷乎不是</mark></strong>！若曾傳一個能叫人得生的律法，義就誠然本乎律法了。 但聖經把衆人都圈在罪裏，使所應許的福因信耶穌基督歸給那信的人。 <strong><mark>但這因信得救的理還未來以先，我們被看守在律法之下</mark></strong>，直圈到那將來的真道顯明出來。 這樣，<strong><mark>律法是我們訓蒙的師傅</mark></strong>，引我們到基督那裏，使我們因信稱義。 但這因信得救的理既然來到，<strong><mark>我們從此就不在師傅的手下了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L21-25">加 3:21-25</a>)</p></blockquote><blockquote><p>“我說那承受產業的，雖然是全業的主人，但爲孩童的時候，卻與奴僕毫無分別， <strong><mark>乃在師傅和管家的手下，直等他父親預定的時候來到</mark></strong>。 &lt;…&gt; 現在你們既然認識上帝，更可說是被上帝所認識的，怎麼還要歸回那懦弱無用的小學，<strong><mark>情願再給他作奴僕呢</mark></strong>？ <strong><mark>你們謹守日子、月分、節期、年分</mark></strong>， 我爲你們害怕，惟恐我在你們身上是枉費了工夫。 &lt;…&gt; 你們這願意在律法以下的人，請告訴我，你們豈沒有聽見律法嗎？ &lt;…&gt; 當時，那按著血氣生的，逼迫了那按著聖靈生的，現在也是這樣。 然而經上是怎麼說的呢？是說：『把使女和他兒子趕出去．因爲使女的兒子不可與自主婦人的兒子一同承受產業。』 弟兄們，這樣看來，我們不是使女的兒女，乃是自主婦人的兒女了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L1-2,9-11,21,29-31">加 4:1-2,9-11,21,29-31</a>) <em>(這裏說的正是安息日，按聖提奧凡的話。 :: !你們這願意在律法以下的人 :: !那按著血氣生的，逼迫了那按著聖靈生的，現在也是這樣 ~~ 這裏以血氣所生的與律法相比較。 :: !把使女和他兒子趕出去 :: !我們不是使女的兒女，乃是自主婦人的兒女了)</em></p></blockquote><h2>關於廢除律法的公會議定</h2><p>第一次使徒公會議決定：基督徒沒有必要遵守猶太律法的規條：</p><blockquote><p>“惟有幾個信徒是法利賽教門的人，起來說：「<strong><mark>必須給外邦人行割禮</mark></strong>，<strong><mark>吩咐他們遵守摩西的律法</mark></strong>。」 <strong><mark>使徒和長老，聚會商議這事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L5-6">徒 15:5-6</a>)</p></blockquote><blockquote><p>“我們聽說有幾個人從我們這裏出去，<strong><mark>用言語攪擾你們</mark></strong>，<strong><mark>惑亂你們的心</mark></strong>。〔有古卷在此有『你們必須受割禮，守摩西的律法。』〕<strong><mark>其實我們並沒有吩咐他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L24">徒 15:24</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲聖靈和我們定意不將別的重擔放在你們身上</mark></strong>，<strong><mark>惟有幾件事是不可少</mark></strong>的， 就是禁戒祭偶像的物和血，並勒死的牲畜和姦淫。這幾件你們若能自己禁戒不犯就好了。願你們平安！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L28-29">徒 15:28-29</a>)</p></blockquote><blockquote><p>“至於信主的外邦人，我們已經寫信擬定，<strong><mark>叫他們謹忌那祭偶像之物和血，並勒死的牲畜與姦淫</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/21/#L25">徒 21:25</a>)</p></blockquote><blockquote><p>“他們經過各城，<strong><mark>把耶路撒冷使徒和長老所定的條規交給門徒遵守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/16/#L4">徒 16:4</a>)</p></blockquote><h2>使徒們和最早的基督徒不按摩西律法生活</h2><h3>對律法以外的人，作律法以外的人（即不遵守它）</h3><blockquote><p>“向猶太人，我就作猶太人，爲要得猶太人；向律法以下的人，我雖不在律法以下，還是作律法以下的人，爲要得律法以下的人； <strong><mark>向沒有律法的人，我就作沒有律法的人</mark></strong>，爲要得沒有律法的人。<strong><mark>其實我在上帝面前，不是沒有律法</mark></strong>；<strong><mark>在基督面前，正在律法之下</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/9/#L20-21">林前 9:20-21</a>)</p></blockquote><h3>執事司提反被指控教導律法的改變</h3><blockquote><p>“設下假見證說：「<strong><mark>這個人說話不住的蹧踐聖所和律法</mark></strong>， 我們曾聽見他說，這拿撒勒人耶穌要毀壞此地，<strong><mark>也要改變摩西所交給我們的規條</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/6/#L13-14">徒 6:13-14</a>)</p></blockquote><h3>使徒保羅被指控教導人不按律法敬拜上帝</h3><blockquote><p>“說：「<strong><mark>這個人，勸人不按著律法敬拜上帝</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/18/#L13">徒 18:13</a>)</p></blockquote><blockquote><p>“他們聽見，就歸榮耀與上帝，對保羅說：「兄臺，你看猶太人中信主的有多少萬，並且<strong><mark>都爲律法熱心</mark></strong>。 他們聽見人說，<strong><mark>你教訓一切在外邦的猶太人離棄摩西</mark></strong>，對他們說，<strong><mark>不要給孩子行割禮</mark></strong>，<strong><mark>也不要遵行條規</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/21/#L20-21">徒 21:20-21</a>)</p></blockquote><p>如果使徒保羅在傳猶太教，那猶太人爲什麼還要逼迫他呢？他們逼迫他，是因爲他離棄了律法：</p><blockquote><p>“基督釋放了我們，叫我們得以自由，<strong><mark>所以要站立得穩，不要再被奴僕的軛挾制</mark></strong>。 &lt;…&gt; 弟兄們，<strong><mark>我若仍舊傳割禮，爲什麼還受逼迫呢</mark></strong>？若是這樣，那十字架討厭的地方就沒有了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L1,11">加 5:1,11</a>)</p></blockquote><p>一些基督徒在猶太人面前假裝守律法，爲的是不受逼迫：</p><blockquote><p>“<strong><mark>凡希圖外貌體面的人，都勉強你們受割禮，無非是怕自己爲基督的十字架受逼迫</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/6/#L12">加 6:12</a>)</p></blockquote><h3>基督徒不受割禮</h3><blockquote><p>“有人已受割禮蒙召呢，就不要廢割禮；<strong><mark>有人未受割禮蒙召呢，就不要受割禮</mark></strong>。 <strong><mark>受割禮算不得什麼，不受割禮也算不得什麼</mark></strong>，只要守上帝的誡命就是了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L18-19">林前 7:18-19</a>)</p></blockquote><blockquote><p>“原來在基督耶穌裏，<strong><mark>受割禮不受割禮全無功效</mark></strong>；惟獨使人生髮仁愛的信心纔有功效。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L6">加 5:6</a>)</p></blockquote><blockquote><p>“<strong><mark>受割禮不受割禮都無關緊要</mark></strong>，要緊的就是作新造的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/6/#L15">加 6:15</a>)</p></blockquote><blockquote><p>“在此並不分希利尼人、猶太人、<strong><mark>受割禮的、未受割禮的</mark></strong>、化外人、西古提人、爲奴的、自主的，惟有基督是包括一切，又住在各人之內。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L11">西 3:11</a>)</p></blockquote><h3>不獻牲畜爲祭</h3><blockquote><p>“以上說：『<strong><mark>祭物和禮物，燔祭和贖罪祭，是你不願意的</mark></strong>，也是你不喜歡的』（這都是按著律法獻的）。 後又說：『我來了爲要照你的旨意行』。<strong><mark>可見他是除去在先的，爲要立定在後的</mark></strong>。 &lt;…&gt; 『主說，那些日子以後，我與他們所立的約乃是這樣：<strong><mark>我要將我的律法寫在他們心上</mark></strong>，又要放在他們的裏面。』 以後就說：『<strong><mark>我不再記念他們的罪愆和他們的過犯</mark></strong>。』 <strong><mark>這些罪過既已赦免，就不用再爲罪獻祭了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L8-9,16-18">希 10:8-9,16-18</a>)</p></blockquote><h3>不守安息日</h3><blockquote><p>“<strong><mark>所以不拘在飲食上，或節期、月朔、安息日，都不可讓人論斷你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L16">西 2:16</a>)</p></blockquote><blockquote><p>“那時，<strong><mark>耶穌在安息日從麥地經過</mark></strong>。<strong><mark>他的門徒餓了，就掐起麥穗來吃</mark></strong>。 法利賽人看見，就對耶穌說：「看哪，你的門徒作安息日不可作的事了！」 &lt;…&gt; 『我喜愛憐恤，不喜愛祭祀。』你們若明白這話的意思，<strong><mark>就不將無罪的當作有罪的了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L1-2,7">太 12:1-2,7</a>)</p></blockquote><h3>與外邦人來往，自己成爲外邦人</h3><blockquote><p>“彼得和他說著話進去，見有好些人在那裏聚集， 就對他們說：「你們知道，<strong><mark>猶太人和別國的人親近來往，本是不合例的</mark></strong>，<strong><mark>但上帝已經指示我，無論什麼人都不可看作俗而不潔淨的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L27-28">徒 10:27-28</a>)</p></blockquote><h3>接觸死人</h3><p>主耶穌基督接觸了睚魯死去的女兒：</p><blockquote><p>“<strong><mark>就拉著孩子的手，對她說</mark></strong>：「大利大，古米！」繙出來就是說：「閨女，我吩咐你起來！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/5/#L41">可 5:41</a>)</p></blockquote><p>按律法，基督死在十字架上之後，不能像接觸已死之人那樣接觸他。只有上帝之母作爲親屬可以這樣作（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L1-4">利 21:1-4</a>）。然而，我們不但不定神學家約翰、尼哥底母、亞利馬太人約瑟的罪，反而稱讚他們毫無畏懼、服事我們的救主。</p><blockquote><p>“<strong><mark>約瑟取了身體，用乾淨細麻布裹好</mark></strong>， <strong><mark>安放在自己的新墳墓裏</mark></strong>，就是他鑿在磐石裏的。他又把大石頭滾到墓門口，就去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L59-60">太 27:59-60</a>)</p></blockquote><blockquote><p>“<strong><mark>約翰的門徒聽見了，就來把他的屍首領去，葬在墳墓裏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L29">可 6:29</a>)</p></blockquote><blockquote><p>“既從百夫長得知實情，<strong><mark>就把耶穌的屍首賜給約瑟</mark></strong>。 約瑟買了細麻布，把耶穌取下來，用細麻布裹好，<strong><mark>安放在磐石中鑿出來的墳墓裏</mark></strong>，又滾過一塊石頭來擋住墓門。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/15/#L45-46">可 15:45-46</a>)</p></blockquote><blockquote><p>“既成就了經上指著他所記的一切話，<strong><mark>就把他從木頭上取下來，放在墳墓裏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L29">徒 13:29</a>)</p></blockquote><h3>主釋放了被控姦淫的婦人</h3><p>律法命令用石頭打死犯奸淫的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/20/#L10">利 20:10</a>），但主沒有定那婦人的罪，而是釋放了她：</p><blockquote><p>“她說：「主啊，沒有。」耶穌說：「<strong><mark>我也不定你的罪，去吧！從此不要再犯罪了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L11">約 8:11</a>)</p></blockquote><h3>主命令喝他的血</h3><p>上帝禁止喝血（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/9/#L4">創 9:4</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/3/#L17">利 3:17</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/7/#L26">利 7:26</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/17/#L14">利 17:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/12/#L16">申 12:16</a>），但在最後的晚餐上，把杯遞給門徒說：你們都喝這個，這是我的血：</p><blockquote><p>“他們吃的時候，耶穌拿起餅來，祝福，就擘開遞給門徒，說：「<strong><mark>你們拿著吃，這是我的身體</mark></strong>。」 又拿起杯來，祝謝了，遞給他們，說：「<strong><mark>你們都喝這個</mark></strong>， <strong><mark>因爲這是我立約的血，爲多人流出來，使罪得赦</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><h3>主成了出自猶大支派的大祭司</h3><p>律法命令祭司只能出自利未支派、亞倫的家族：</p><blockquote><p>“給亞倫和他兒子束上腰帶，包上裹頭巾，<strong><mark>他們就憑永遠的定例得了祭司的職任</mark></strong>；又要將亞倫和他兒子分別爲聖。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L9">出 29:9</a>)</p></blockquote><blockquote><p>“<strong><mark>亞倫的聖衣要留給他的子孫</mark></strong>，可以穿著受膏，<strong><mark>又穿著承接聖職</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29">出 29:29</a>)</p></blockquote><p>但主成了大祭司，生在猶大支派：</p><blockquote><p>“<strong><mark>我們的主分明是從猶大出來的</mark></strong>，<strong><mark>但這支派，摩西並沒有提到祭司</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L14">希 7:14</a>)</p></blockquote><h3>真正的逾越節祭牲不是在聖殿裏獻的</h3><p>逾越節的祭牲只能在耶路撒冷聖殿裏獻：</p><blockquote><p>“<strong><mark>在耶和華你上帝所賜的各城中，你不可獻逾越節的祭</mark></strong>； <strong><mark>只當在耶和華你上帝所選擇要立爲他名的居所</mark></strong>，晚上日落的時候，乃是你出埃及的時候，獻逾越節的祭。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L5-6">申 16:5-6</a>)</p></blockquote><blockquote><p>“<strong><mark>所以耶穌要用自己的血叫百姓成聖，也就在城門外受苦</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L12">希 13:12</a>)</p></blockquote><h2>十誡也是摩西律法嗎？</h2><h3>上帝藉摩西所賜的律法——利未記中的一切誡命</h3><p>利未記中列舉了上帝的衆多誡命，包括<a href="https://bibleox.com/ru/ru/w/10-заповедей">石版上的誡命</a>，稱它們爲<strong>上帝藉摩西所立的律例</strong>：</p><blockquote><p>“<strong><mark>這些律例、典章和法度，是耶和華與以色列人在西乃山藉着摩西立的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L46">利 26:46</a>)</p></blockquote><h3>上帝稱他的一切誡命爲律法</h3><p>例如，收集嗎哪的命令就是上帝的律法：</p><blockquote><p>“耶和華對摩西說：「我要將糧食從天降給你們。百姓可以出去，每天收每天的分，<strong><mark>我好試驗他們遵不遵我的法度</mark></strong>。 &lt;…&gt; 耶和華對摩西說：「<strong><mark>你們不肯守我的誡命和律法要到幾時呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/16/#L4,28">出 16:4,28</a>)</p></blockquote><p>出埃及記第16、24、31、34、35章；申命記第4、6、10章。</p><h3>新的律法已不再寫在石版上，而是寫在心裏</h3><p>寫在石版上的，被稱爲「律法」：</p><blockquote><p>“耶和華說：「那些日子以後，我與以色列家所立的約乃是這樣：<strong><mark>我要將我的律法放在他們裏面，寫在他們心上</mark></strong>。我要作他們的上帝，他們要作我的子民。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/31/#L33">耶 31:33</a>)</p></blockquote><blockquote><p>“你們明顯是基督的信，藉着我們修成的。不是用墨寫的，乃是用永生上帝的靈寫的；<strong><mark>不是寫在石版上，乃是寫在心版上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/3/#L3">林後 3:3</a>)</p></blockquote><h3>基督講論誡命，並不特別突出十誡</h3><blockquote><p>“你們聽見有吩咐古人的話，說：『<strong><mark>不可殺人</mark></strong>』，又說，『凡殺人的，難免受審判。』 &lt;…&gt; 你們聽見有話說：『<strong><mark>不可姦淫</mark></strong>。』 &lt;…&gt; 你們又聽見有吩咐古人的話，說：『<strong><mark>不可背誓</mark></strong>，所起的誓，總要向主謹守。 &lt;…&gt; 你們聽見有話說：『<strong><mark>以眼還眼，以牙還牙</mark></strong>。』 &lt;…&gt; 你們聽見有話說：『<strong><mark>當愛你的鄰舍</mark></strong>，恨你的仇敵。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L21,27,33,38,43">太 5:21,27,33,38,43</a>) <em>(出 21:24；利 19:18。)</em></p></blockquote><h3>使徒們把十誡直接稱爲律法</h3><p>使徒雅各說，違犯「不可殺人」誡命的人，就是犯律法的：</p><blockquote><p>“因爲凡遵守全律法的，<strong><mark>只在一條上跌倒，他就是犯了衆條</mark></strong>。 原來那說『不可姦淫』的，也說『不可殺人』。<strong><mark>你就是不姦淫，卻殺人，仍是成了犯律法的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L10-11">雅 2:10-11</a>)</p></blockquote><h2>律法不能拯救</h2><h3>律法——將來美事的影兒、罪的提醒</h3><blockquote><p>“<strong><mark>律法既是將來美事的影兒，不是本物的真像</mark></strong>，總不能借著每年常獻一樣的祭物，叫那近前來的人得以完全。 若不然，獻祭的事豈不早已止住了嗎？因爲禮拜的人，良心既被潔淨，就不再覺得有罪了。 <strong><mark>但這些祭物是叫人每年想起罪來</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L1-3">希 10:1-3</a>)</p></blockquote><h3>律法不能拯救：無論律法的知識還是行爲</h3><blockquote><p>“這樣，律法是與上帝的應許反對嗎？斷乎不是！<strong><mark>若曾傳一個能叫人得生的律法，義就誠然本乎律法了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L21">加 3:21</a>)</p></blockquote><h3>遵行律法的字句不能拯救</h3><blockquote><p>“我告訴你們：<strong><mark>你們的義若不勝於文士和法利賽人的義，斷不能進天國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L20">太 5:20</a>)</p></blockquote><blockquote><p>“我若能說萬人的方言，並天使的話語，<strong><mark>卻沒有愛</mark></strong>，<strong><mark>我就成了鳴的鑼、響的鈸一般</mark></strong>。 我若有先知講道之能，也明白各樣的奧祕、各樣的知識，而且有全備的信，叫我能夠移山，卻沒有愛，<strong><mark>我就算不得什麼</mark></strong>。 我若將所有的賙濟窮人，又捨己身叫人焚燒，卻沒有愛，<strong><mark>仍然與我無益</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L1-3">林前 13:1-3</a>)</p></blockquote><h3>違犯律法導致定罪</h3><blockquote><p>“凡沒有律法犯了罪的，也必不按律法滅亡；<strong><mark>凡在律法以下犯了罪的，也必按律法受審判</mark></strong>。 （原來，在上帝面前不是聽律法的爲義，<strong><mark>乃是行律法的稱義</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L12-13">羅 2:12-13</a>)</p></blockquote><h3>誰不遵行全律法——誰就被咒詛</h3><blockquote><p>“凡以行律法爲本的，都是被咒詛的，因爲經上記著：『<strong><mark>凡不常照律法書上所記一切之事去行的，就被咒詛</mark></strong>。』 沒有一個人靠著律法在上帝面前稱義，這是明顯的．因爲經上說，『<strong><mark>義人必因信得生</mark></strong>。』 律法原不本乎信，只說：『<strong><mark>行這些事的，就必因此活著</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L10-12">加 3:10-12</a>)</p></blockquote><h3>律法沒有使任何人達到完全</h3><blockquote><p>“<strong><mark>先前的條例因軟弱無益，所以廢掉了</mark></strong>， （<strong><mark>律法原來一無所成</mark></strong>）就<strong><mark>引進了更美的指望</mark></strong>，靠這指望，我們便可以進到上帝面前。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L18-19">希 7:18-19</a>)</p></blockquote><h2>那麼摩西律法爲什麼是必要的？</h2><h3>律法使人知道罪</h3><blockquote><p>“所以凡有血氣的，沒有一個因行律法能在上帝面前稱義，<strong><mark>因爲律法本是叫人知罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L20">羅 3:20</a>)</p></blockquote><blockquote><p>“<strong><mark>律法本是外添的，叫過犯顯多</mark></strong>；<strong><mark>只是罪在那裏顯多，恩典就更顯多了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L20">羅 5:20</a>)</p></blockquote><h3>律法約束罪人（爲罪人而有）</h3><blockquote><p>“因爲<strong><mark>律法不是爲義人設立的</mark></strong>，<strong><mark>乃是爲不法和不服的</mark></strong>，不虔誠和犯罪的，不聖潔和戀世俗的，弒父母和殺人的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L9">提前 1:9</a>)</p></blockquote><h3>律法使人看見救主的必要（對救主的期待）</h3><blockquote><p>“因爲按著我裏面的意思，<strong><mark>我是喜歡上帝的律</mark></strong>； 但我覺得肢體中另有個律和我心中的律交戰，把我擄去，叫我附從那肢體中犯罪的律。 <strong><mark>我真是苦啊！誰能救我脫離這取死的身體呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L22-24">羅 7:22-24</a>)</p></blockquote><h2>律法不是永恆的</h2><h3>律法——直到它被成全</h3><blockquote><p>“我實在告訴你們：<strong><mark>就是到天地都廢去了</mark></strong>，<strong><mark>律法的一點一畫也不能廢去，都要成全</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L18">太 5:18</a>)</p></blockquote><h3>基督成全了律法，從而廢除了它</h3><blockquote><p>“<strong><mark>莫想我來要廢掉律法和先知</mark></strong>；<strong><mark>我來不是要廢掉，乃是要成全</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L17">太 5:17</a>)</p></blockquote><h2>基督終結了律法的時代</h2><h3>關於有一位像摩西的先知來臨的預言</h3><p>設立摩西律法時，立刻就說到將來要來一位像摩西的先知，即<strong>立法者</strong>，人應當聽他。這是指著基督說的：</p><blockquote><p>“<strong><mark>耶和華你的上帝要從你們弟兄中間給你興起一位先知像我</mark></strong>，<strong><mark>你們要聽從他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/18/#L15">申 18:15</a>)</p></blockquote><blockquote><p>“摩西曾說：『<strong><mark>主上帝要從你們弟兄中間給你們興起一位先知像我</mark></strong>，<strong><mark>凡他向你們所說的，你們都要聽從</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/3/#L22">徒 3:22</a>)</p></blockquote><blockquote><p>“那曾對以色列人說『<strong><mark>上帝要從你們弟兄中間給你們興起一位先知像我</mark></strong>』的，就是這位摩西。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L37">徒 7:37</a>)</p></blockquote><p>而上帝親自以同樣的話確認了這一點：</p><blockquote><p>“有一朵雲彩來遮蓋他們，也有聲音從雲彩裏出來，說：「<strong><mark>這是我的愛子，你們要聽他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L7">可 9:7</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/17/#L5">太 17:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L35">路 9:35</a>。)</em></p></blockquote><h3>基督稱律法爲「你們的」</h3><blockquote><p>“<strong><mark>你們的律法上也記著說</mark></strong>：『兩個人的見證是真的。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L17">約 8:17</a>)</p></blockquote><blockquote><p>“耶穌說：「<strong><mark>你們的律法上豈不是寫著</mark></strong>『我曾說你們是神』麼？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L34">約 10:34</a>)</p></blockquote><h3>律法——直到施洗約翰</h3><blockquote><p>“從施洗約翰的時候到如今，天國是努力進入的，努力的人就得著了。 <strong><mark>因爲衆先知和律法說預言，到約翰爲止</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L12-13">太 11:12-13</a>)</p></blockquote><h3>律法賜下，爲一段時期，直到來臨之時</h3><blockquote><p>“這樣說來，律法是爲什麼有的呢？<strong><mark>原是爲過犯添上的</mark></strong>，<strong><mark>等候那蒙應許的子孫來到</mark></strong>，並且是藉天使經中保之手設立的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L19">加 3:19</a>)</p></blockquote><h3>誡命之律已被教導廢除</h3><blockquote><p>“因他使我們和睦，將兩下合而爲一，<strong><mark>拆毀了中間隔斷的牆</mark></strong>， 而且<strong><mark>以自己的身體廢掉冤仇</mark></strong>，<strong><mark>就是那記在律法上的規條</mark></strong>，爲要將兩下藉着自己造成一個新人，如此便成就了和睦。 既在十字架上滅了冤仇，便藉這十字架使兩下歸爲一體，與上帝和好了，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><h3>關於律法的爭論已屬徒然</h3><blockquote><p>“要遠避無知的辯論和家譜的空談以及紛爭，<strong><mark>並因律法而起的爭競，因爲這都是虛妄無益的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L9">多 3:9</a>)</p></blockquote><h3>奴僕的軛——就是摩西律法</h3><blockquote><p>“基督釋放了我們，叫我們得以自由，所以要站立得穩，<strong><mark>不要再被奴僕的軛挾制</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L1">加 5:1</a>)</p></blockquote><h3>基督的軛——另一種，是容易的</h3><blockquote><p>“凡勞苦擔重擔的人，可以到我這裏來，我就使你們得安息。 我心裏柔和謙卑，<strong><mark>你們當負我的軛，學我的樣式</mark></strong>，這樣，你們心裏就必得享安息。 <strong><mark>因爲我的軛是容易的，我的擔子是輕省的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L28-30">太 11:28-30</a>)</p></blockquote><h3>新的律法——基督的律法——就是愛</h3><blockquote><p>“愛是不加害與人的，<strong><mark>所以愛就完全了律法</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/13/#L10">羅 13:10</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲全律法都包在『愛人如己』這一句話之內了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L14">加 5:14</a>)</p></blockquote><h3>在關於律法的長篇論述之後——信心與愛心</h3><blockquote><p>“並且我們一切所求的，就從他得著，因爲我們遵守他的命令，行他所喜悅的事。 <strong><mark>上帝的命令就是叫我們信他兒子耶穌基督的名</mark></strong>，<strong><mark>且照他所賜給我們的命令彼此相愛</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L22-23">約壹 3:22-23</a>)</p></blockquote><blockquote><p>“你們各人的重擔要互相擔當，<strong><mark>如此，就完全了基督的律法</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/6/#L2">加 6:2</a>)</p></blockquote><blockquote><p>“我再指著凡受割禮的人確實的說，<strong><mark>他是欠著行全律法的債</mark></strong>。 <strong><mark>你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了</mark></strong>。 <strong><mark>我們靠著聖靈，憑著信心，等候所盼望的義</mark></strong>。 原來在基督耶穌裏，受割禮不受割禮全無功效；<strong><mark>惟獨使人生髮仁愛的信心纔有功效</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L3-6">加 5:3-6</a>)</p></blockquote><blockquote><p>“基督釋放了我們，叫我們得以自由，所以要站立得穩，不要再被奴僕的軛挾制。 &lt;…&gt; 弟兄們，我若仍舊傳割禮，爲什麼還受逼迫呢？若是這樣，那十字架討厭的地方就沒有了。 &lt;…&gt; 弟兄們，<strong><mark>你們蒙召是要得自由</mark></strong>，只是不可將你們的自由當作放縱情欲的機會，<strong><mark>總要用愛心互相服事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L1,11,13">加 5:1,11,13</a>)</p></blockquote><h3>導致死亡的，是信心的缺乏，而不是違犯摩西律法</h3><blockquote><p>“<strong><mark>人有了上帝的兒子就有生命</mark></strong>；<strong><mark>沒有上帝的兒子就沒有生命</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L12">約壹 5:12</a>)</p></blockquote><h3>救恩來到，與律法的行爲無關</h3><blockquote><p>“<strong><mark>但如今，上帝的義在律法以外已經顯明出來</mark></strong>，有律法和先知爲證： <strong><mark>就是上帝的義，因信耶穌基督加給一切相信的人</mark></strong>，並沒有分別。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L21-22">羅 3:21-22</a>)</p></blockquote><blockquote><p>“<strong><mark>如今，那些在基督耶穌裏的就不定罪了</mark></strong>。 <strong><mark>因爲賜生命聖靈的律在基督耶穌裏釋放了我</mark></strong>，<strong><mark>使我脫離罪和死的律了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L1-2">羅 8:1-2</a>)</p></blockquote><h3>按律法而活——按血氣而活</h3><blockquote><p>“我只要問你們這一件：<strong><mark>你們受了聖靈，是因行律法呢</mark></strong>？是因聽信福音呢？ <strong><mark>你們既靠聖靈入門，如今還靠肉身成全嗎</mark></strong>？你們是這樣的無知嗎？ &lt;…&gt; 但這因信得救的理還未來以先，<strong><mark>我們被看守在律法之下</mark></strong>，直圈到那將來的真道顯明出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L2-3,23">加 3:2-3,23</a>)</p></blockquote><h3>按聖靈而活——高於按律法而活</h3><blockquote><p>“我說：<strong><mark>你們當順著聖靈而行</mark></strong>，就不放縱肉體的情慾了。 &lt;…&gt; <strong><mark>但你們若被聖靈引導，就不在律法以下</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L16,18">加 5:16,18</a>)</p></blockquote><blockquote><p>“<strong><mark>聖靈所結的果子</mark></strong>，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、 溫柔、節制。<strong><mark>這樣的事，沒有律法禁止</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L22-23">加 5:22-23</a>)</p></blockquote>'
