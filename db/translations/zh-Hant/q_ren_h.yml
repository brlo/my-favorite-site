  title: 地獄
  copy_cover: true
  body: <h2>定義</h2><p>地獄可以有幾種理解。</p><ol><li><p>地獄——死者靈魂在普遍復活和最後審判之前的居所。</p></li><li><p>地獄——在榮耀的第二次降臨、普遍復活和最後審判之後，被定罪的罪人復活後（即靈魂與身體一起）的居所。最後審判之後，這一命運已無法改變。被定罪者的痛苦與義人的真福將同樣永遠持續。</p></li></ol><h2>地獄、欣嫩谷、火湖、永火、外面的黑暗、監獄——受苦之處</h2><p>在聖經中，「地獄」最常指某種受苦之處。這地方可以用不同的詞來稱呼，但這並不改變其實質：它始終是受苦之處。在地獄裏受苦的有：</p><blockquote><p>“<strong><mark>惟有本國的子民，竟被趕到外邊黑暗裏去</mark></strong>，在那裏必要哀哭切齒了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L12">太 8:12</a>)</p></blockquote><blockquote><p>“於是王對使喚的人說：『捆起他的手腳來，<strong><mark>把他丟在外邊的黑暗裏</mark></strong>．在那裏必要哀哭切齒了。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/22/#L13">太 22:13</a>)</p></blockquote><blockquote><p>“<strong><mark>把這無用的僕人丟在外面黑暗裏</mark></strong>，在那裏必要哀哭切齒了。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L30">太 25:30</a>)</p></blockquote><p>是基督自己——作爲審判者——決定誰往哪裏去：</p><blockquote><p>“王又要向那左邊的說：『<strong><mark>你們這被咒詛的人，離開我，進入那爲魔鬼和他的使者所預備的永火裏去</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L41">太 25:41</a>)</p></blockquote><blockquote><p>“<strong><mark>你們要防備人</mark></strong>．因爲他們要把你們交給公會，也要在會堂裏鞭打你們； &lt;…&gt; 那殺身體不能殺靈魂的，不要怕他們；<strong><mark>惟有能把身體和靈魂都滅在地獄裏的，正要怕他</mark></strong>。 &lt;…&gt; 凡在人面前不認我的，<strong><mark>我在我天上的父面前也必不認他</mark></strong>。 你們不要想，我來是叫地上太平；我來並不是叫地上太平，<strong><mark>乃是叫地上動刀兵</mark></strong>。 &lt;…&gt; <strong><mark>不揹着他的十字架跟從我的，也不配作我的門徒</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L17,28,33-34,38">太 10:17,28,33-34,38</a>)</p></blockquote><p>人死後要進入新的居所。這一事件值得哀哭：</p><blockquote><p>“人怕高處，路上有驚慌；杏樹開花，蚱蜢成爲重擔；人所願的也都廢掉。<strong><mark>因爲人歸他永遠的家</mark></strong>，弔喪的在街上往來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/12/#L5">傳 12:5</a>)</p></blockquote><p>人死後有審判等待著他：</p><blockquote><p>“按著定命，<strong><mark>人人都有一死，死後且有審判</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L27">希 9:27</a>)</p></blockquote><p>地獄中，其中的居民有知覺地存在。巴比倫王受到地獄一切居民的迎接：</p><blockquote><p>“你必題這詩歌論巴比倫王說：欺壓人的何竟息滅？強暴的何竟止息？ &lt;…&gt; <strong><mark>你下到陰間，陰間就因你震動，來迎接你</mark></strong>。又因你驚動在世曾爲首領的陰魂，並使那曾爲列國君王的，都離位站起， 他們都要發言對你說：「<strong><mark>你也變爲軟弱像我們一樣嗎？你也成了我們的樣子嗎</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/14/#L4,9-10">賽 14:4,9-10</a>)</p></blockquote><p>主在身體死後下到陰間，向那些從世界洪水時代起就在那裏的神魂宣講：</p><blockquote><p>“因基督也曾一次爲罪受苦，就是義的代替不義的，爲要引我們到上帝面前。<strong><mark>按著肉體說，他被治死；按著靈性說，他復活了</mark></strong>。 <strong><mark>他藉這靈曾去傳道給那些在監獄裏的靈聽</mark></strong>， 就是那從前在<strong><mark>挪亞預備方舟、上帝容忍等待的時候</mark></strong>，不信從的人。當時進入方舟，藉着水得救的不多，只有八個人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L18-20">彼前 3:18-20</a>)</p></blockquote><blockquote><p>“所以經上說：『他升上高天的時候，擄掠了仇敵，將各樣的恩賜賞給人。』 （<strong><mark>既說升上，豈不是先降在地下嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L8-9">弗 4:8-9</a>)</p></blockquote><p>基督的靈魂沒有被撇在陰間。不是<strong>身體</strong>沒有被撇在墳墓（土）裏，而是<strong>靈魂</strong>沒有被撇在陰間：</p><blockquote><p>“就預先看明這事，講論基督復活說：『<strong><mark>他的靈魂不撇在陰間</mark></strong>；他的肉身也不見朽壞。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L31">徒 2:31</a>)</p></blockquote><p>死人被看見，死人受審判，陰間交出死人：</p><blockquote><p>“<strong><mark>我又看見死了的人</mark></strong>，無論大小，都站在寶座前。案卷展開了，並且另有一卷展開，就是生命冊；<strong><mark>死了的人都憑著這些案卷所記載的，照他們所行的受審判</mark></strong>。 於是海交出其中的死人，<strong><mark>死亡和陰間也交出其中的死人</mark></strong>，他們都照各人所行的受審判。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L12-13">啟 20:12-13</a>)</p></blockquote>
