  title: 齋戒
  copy_cover: true
  body: <p>論禁慾主義的一般原則：</p><blockquote><p>“<strong>凡較力爭勝的</strong>，諸事都有節制，他們不過是<strong>要得能壞的冠冕</strong>；我們卻是<strong>要得不能壞的冠冕</strong>。 所以，<strong>我奔跑</strong>，不像無定向的；我鬥拳，不像打空氣的。 我是<strong>攻克己身，叫身服我</strong>，恐怕我傳福音給別人，<strong><mark>自己反被棄絕了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/9/#L25-27">林前 9:25-27</a>)</p></blockquote><p>上帝呼召人在齋戒中歸向他：</p><blockquote><p>“<strong>耶和華說：「雖然如此，你們應當禁食，哭泣、悲哀，一心歸向我。」</strong>” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iol/2/#L12">珥 2:12</a>)</p></blockquote><p>主耶穌基督以齋戒開始宣講：</p><blockquote><p>“<strong><mark>他禁食四十晝夜</mark></strong>，後來就餓了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/4/#L2">太 4:2</a>)</p></blockquote><p>主教導如何正確齋戒：</p><blockquote><p>“<strong><mark>你們禁食的時候</mark></strong>，不可像那假冒爲善的人，臉上帶著愁容，因爲他們把臉弄得難看，故意叫人看出他們是禁食。我實在告訴你們：<strong><mark>他們已經得了他們的賞賜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L16">太 6:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你禁食的時候</mark></strong>，要梳頭洗臉，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L17">太 6:17</a>)</p></blockquote><p>施洗約翰的門徒齋戒：</p><blockquote><p>“那時，約翰的門徒來見耶穌，說：「<strong><mark>我們和法利賽人常常禁食</mark></strong>，你的門徒倒不禁食，這是爲什麼呢？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/9/#L14">太 9:14</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/2/#L18">可 2:18</a>)</p></blockquote><p>基督的門徒在基督受難之後將要齋戒：</p><blockquote><p>“耶穌對他們說：「新郎和陪伴之人同在的時候，陪伴之人豈能哀慟呢？但日子將到，新郎要離開他們，<strong><mark>那時候他們就要禁食</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/9/#L15">太 9:15</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/2/#L20">可 2:20</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/5/#L35">路 5:35</a>)</p></blockquote><p>有一些鬼，若不禁食就不能從人身上趕出去：</p><blockquote><p>“至於這一類的鬼，<strong><mark>若不禱告禁食</mark></strong>，他就不出來。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/17/#L21">太 17:21</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L29">可 9:29</a>)</p></blockquote><p>寡婦在上帝的聖殿裏以齋戒和祈禱晝夜事奉上帝：</p><blockquote><p>“現在已經八十四歲，並不離開聖殿，<strong><mark>禁食祈求，晝夜事奉上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L37">路 2:37</a>)</p></blockquote><p>齋戒期間有天使差到百夫長那裏：</p><blockquote><p>“哥尼流說：「<strong><mark>前四天這個時候，我在家中守著申初的禱告</mark></strong>，忽然有一個人穿著光明的衣裳，站在我面前，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L30">徒 10:30</a>) <em>(俄文原文此處有「禁食」一詞，和合本無。)</em></p></blockquote><p>聖靈在齋戒中與最早的基督徒相交：</p><blockquote><p>“<strong><mark>他們事奉主，禁食的時候</mark></strong>，聖靈說：「<strong><mark>要爲我分派巴拿巴和掃羅</mark></strong>，去作我召他們所作的工。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2">徒 13:2</a>)</p></blockquote><p>最早的基督徒在一切要事上以齋戒補充祈禱：</p><blockquote><p>“二人在各教會中選立了長老，<strong><mark>又禁食禱告</mark></strong>，就把他們交托所信的主。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/14/#L23">徒 14:23</a>)</p></blockquote><p>爲了齋戒，夫妻可以暫時分房：</p><blockquote><p>“夫妻不可彼此虧負，除非兩相情願，<strong><mark>暫時分房，爲要專心禱告方可</mark></strong>；以後仍要同房，免得撒但趁著你們情不自禁引誘你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L5">林前 7:5</a>) <em>(俄文原文作「爲禁食和禱告」，和合本無「禁食」一詞。)</em></p></blockquote><p>使徒們在齋戒中顯明自己是上帝的僕人：</p><blockquote><p>“反倒在各樣的事上表明自己是上帝的用人，就如在許多的忍耐、患難、窮乏、困苦、 鞭打、監禁、擾亂、勤勞、<strong><mark>儆醒、不食</mark></strong>、 廉潔、知識、恆忍、恩慈、聖靈的感化、無僞的愛心、” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/6/#L4-6">林後 6:4-6</a>)</p></blockquote><p>使徒在責備自己不得已的自誇（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L21">林後 11:21</a>）時，誇耀自己的齋戒：</p><blockquote><p>“受勞碌、受困苦。多次不得睡，又飢又渴；<strong><mark>多次不得食</mark></strong>，受寒冷，赤身露體。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L27">林後 11:27</a>)</p></blockquote><p>使徒允許主教提摩太因身體軟弱而放鬆齋戒：</p><blockquote><p>“<strong><mark>因你胃口不清，屢次患病</mark></strong>，再不要照常喝水，可以稍微用點酒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L23">提前 5:23</a>)</p></blockquote><p>善功=祈禱+齋戒+施捨+公義：</p><blockquote><p>“<strong>祈禱與齋戒固然是善功</strong>，但秉義施捨卻超過前二者；<strong>秉義而少有，勝於不義而多有；施捨救濟，勝於儲蓄黃金</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/tov/12/#L8">多 12:8</a>)</p></blockquote><p>君王兼先知大衛在患難中以齋戒在上帝面前謙卑己心：</p><blockquote><p>“至於我，當他們有病的時候，我便穿麻衣，<strong><mark>禁食刻苦己心</mark></strong>，我所求的都歸到自己的懷中；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/35/#L13">詩 35:13</a>)</p></blockquote>
