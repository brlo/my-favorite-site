- src: монашество
  path: Qx3A_隱修
  title: 隱修
  copy_cover: true
  body: <h2>聖經論隱修生活</h2><h3>選擇上帝所喜悅之事的太監</h3><p>上帝特別舉出那些不結婚、特別關心遵守上帝誡命的人。他們彷彿被高舉在其餘的“兒女”之上：</p><blockquote><p>“因爲耶和華如此說：「那些謹守我的安息日，揀選我所喜悅的事，<strong><mark>持守我約的太監</mark></strong>， <strong><mark>我必使他們在我殿中，在我牆內有記念、有名號，比有兒女的更美</mark></strong>。我必賜他們永遠的名，不能剪除。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/56/#L4-5">賽 56:4-5</a>)</p></blockquote><blockquote><p>“<strong>不生育的男人，手若不作非法的行爲，心不思念相反上主的惡事，是有福的；天主見他忠貞，必賜給他特賞，在上主的聖殿中，賜給他更稱心的一份。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/3/#L14">智 3:14</a>)</p></blockquote><h3>高於遵守誡命的成全之路</h3><p>尋求救恩之道的富少年從救主得到確認：爲此必須遵守誡命。然而，因爲少年問起更多的事，主就向他指出更高的：不僅要得救，還要成爲完全的。爲此主呼召少年變賣自己的一切所有，來跟從他：</p><blockquote><p>“耶穌說：「<strong><mark>你若願意作完全人</mark></strong>，<strong><mark>可去變賣你所有的，分給窮人</mark></strong>，就必有財寶在天上；<strong><mark>你還要來跟從我</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L21">太 19:21</a>)</p></blockquote><h3>爲天國的緣故自閹的人</h3><p>隱修士捨棄一切地上的財富和依戀，一生專心尋求上帝並事奉他。隱修士——爲天國的緣故自閹、甘受剝奪的人：</p><blockquote><p>“門徒對耶穌說：「人和妻子既是這樣，<strong><mark>倒不如不娶</mark></strong>。」 耶穌說：「<strong><mark>這話不是人都能領受的，惟獨賜給誰，誰才能領受</mark></strong>。 因爲有生來是閹人，也有被人閹的，並<strong><mark>有爲天國的緣故自閹的</mark></strong>。<strong><mark>這話誰能領受，就可以領受</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L10-12">太 19:10-12</a>)</p></blockquote><p>這些關於閹人的話，是基督在使徒們聽到他禁止休妻之後說的。使徒們以爲那樣倒不如不娶。主沒有與這個結論爭辯，只指出：不是人人都能選擇這條路。誰能，誰就選擇。就是說，這是苦修者的特殊道路。</p><h3>使徒的勸告</h3><p>使徒明確地重複關於獨身的思想：</p><blockquote><p>“論到你們信上所提的事，我說<strong><mark>男不近女倒好</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L1">林前 7:1</a>)</p></blockquote><p>使徒保羅沒有妻子，他勸告獨身者和寡婦（正是勸告）不要尋求新的丈夫，像他自己一樣：</p><blockquote><p>“我對著沒有嫁娶的和寡婦說，<strong><mark>若他們常像我就好</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L8">林前 7:8</a>)</p></blockquote><p>使徒解釋這樣勸告的原因：</p><blockquote><p>“你若娶妻，並不是犯罪；處女若出嫁，也不是犯罪。然而這等人肉身必受苦難，我卻願意你們免這苦難。 弟兄們，我對你們說，時候減少了。從此以後，那有妻子的，要像沒有妻子； 哀哭的，要像不哀哭；快樂的，要像不快樂；置買的，要像無有所得； 用世物的，要像不用世物；因爲這世界的樣子將要過去了。 <strong><mark>我願你們無所掛慮</mark></strong>。<strong><mark>沒有娶妻的，是爲主的事掛慮，想怎樣叫主喜悅</mark></strong>； <strong><mark>娶了妻的，是爲世上的事掛慮，想怎樣叫妻子喜悅</mark></strong>。 婦人和處女也有分別。<strong><mark>沒有出嫁的，是爲主的事掛慮，要身體、靈魂都聖潔</mark></strong>；<strong><mark>已經出嫁的，是爲世上的事掛慮，想怎樣叫丈夫喜悅</mark></strong>。 我說這話是爲你們的益處，不是要牢籠你們，乃是要叫你們行合宜的事，得以殷勤服事主，沒有分心的事。 若有人以爲自己待他的女兒不合宜，女兒也過了年歲，事又當行，他就可隨意辦理，不算有罪，叫二人成親就是了。 倘若人心裏堅定，沒有不得已的事，並且由得自己作主，心裏又決定了留下女兒不出嫁，如此行也好。 這樣看來，叫自己的女兒出嫁是好．不叫他出嫁更是好。 丈夫活著的時候，妻子是被約束的；丈夫若死了，妻子就可以自由，隨意再嫁，只是要嫁這在主裏面的人。 然而按我的意見，<strong><mark>若常守節更有福氣</mark></strong>。我也想自己是被上帝的靈感動了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L28-40">林前 7:28-40</a>)</p></blockquote><p>在自己的一生中度貞潔生活的基督徒，在天上無論羔羊往哪裏去都跟隨他：</p><blockquote><p>“我又觀看，見<strong>羔羊</strong>站在錫安山，同他又有<strong>十四萬四千人</strong>，都有他的名和他父的名寫在額上。 我聽見從天上有聲音，像衆水的聲音和大雷的聲音，並且我所聽見的好像彈琴的所彈的琴聲。 他們在寶座前，並在四活物和衆長老前唱歌，<strong>彷彿是新歌</strong>；<strong><mark>除了從地上買來的那十四萬四千人以外，沒有人能學這歌</mark></strong>。 <strong><mark>這些人未曾沾染婦女，他們原是童身</mark></strong>。<strong><mark>羔羊無論往那裏去，他們都跟隨他</mark></strong>。他們是從人間買來的，作初熟的果子歸與上帝和羔羊。 在他們口中察不出謊言來，他們是沒有瑕疵的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1-5">啟 14:1-5</a>)</p></blockquote><h3>最早的基督徒團體是一個共修的隱修院</h3><blockquote><p>“<strong><mark>信的人都在一處，凡物公用</mark></strong>； <strong><mark>並且賣了田產、家業，照各人所需用的分給各人</mark></strong>。 他們<strong><mark>天天</mark></strong><strong><mark>同心合意恆切的在殿裏</mark></strong>，且在家中擘餅，存著歡喜、誠實的心用飯，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L44-46">徒 2:44-46</a>)</p></blockquote><blockquote><p>“那許多信的人都是一心一意的，<strong><mark>沒有一人說他的東西有一樣是自己的</mark></strong>，<strong><mark>都是大家公用</mark></strong>。 &lt;…&gt; 內中也沒有一個缺乏的，因爲人人將田產房屋都賣了，把所賣的價銀拿來，放在使徒腳前， <strong><mark>照各人所需用的，分給各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L32,34-35">徒 4:32,34-35</a>)</p></blockquote><blockquote><p>“<strong><mark>其餘的人沒有一個敢貼近他們</mark></strong>，百姓卻尊重他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L13">徒 5:13</a>)</p></blockquote><h2>隱修生活的榜樣</h2><h3>主耶穌基督</h3><ul><li><p>沒有結婚；</p></li><li><p>沒有自己的房子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L20">太 8:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L58">路 9:58</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L21">太 19:21</a>）；</p></li><li><p>沒有個人的錢袋（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L15">可 12:15</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/17/#L24-27">太 17:24-27</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L21">太 19:21</a>）；</p></li><li><p>常常獨自整夜祈禱（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L12">路 6:12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L6">太 6:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/14/#L23,25">太 14:23,25</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L32,35,37,39-41">可 14:32,35,37,39-41</a>）；</p></li><li><p>有門徒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L13">路 6:13</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L1">路 10:1</a>）；</p></li><li><p>教導祈禱，給門徒祈禱的範本（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L9">太 6:9</a>）；</p></li><li><p>安慰、責備、教導、訓誨來到他面前的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L31">可 6:31</a>）。</p></li></ul><h3>童貞女馬利亞——上帝之母</h3><ul><li><p>立了獨身的願，形式上處於婚姻中，沒有夫妻關係（“我不認識丈夫”——詳見<a href="https://bibleox.com/ru/ru/w/Богородица#HH-Богородица-была-и-остаётся-девой">上帝之母</a>）；</p></li><li><p>沒有財產，自幼被送到聖殿撫養，後許配給約瑟，後被主交托給使徒約翰（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L27">約 19:27</a>）。</p></li></ul><h3>先知施洗約翰</h3><ul><li><p>沒有結婚；</p></li><li><p>住在曠野，沒有自己的房子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L80">路 1:80</a>）；</p></li><li><p>穿粗陋的自制衣服（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L4">太 3:4</a>）；</p></li><li><p>吃在曠野找到的極簡單的食物（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L4">太 3:4</a>）；</p></li><li><p>自制的衣服和找到的食物表明他沒有錢；</p></li><li><p>教導祈禱，給出祈禱的範本（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L1">路 11:1</a>）；</p></li><li><p>有門徒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L2">太 11:2</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L35">約 1:35</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L25">約 3:25</a>）；</p></li><li><p>安慰、責備、教導、訓誨來到他面前的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L18">路 3:18</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L10-20">路 3:10-20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L31">可 6:31</a>）。</p></li></ul><h3>先知以利亞</h3><ul><li><p>沒有結婚；</p></li><li><p>常常生活在荒野、曠野和洞穴裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/17/#L3-7">王上 17:3-7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/19/#L9">王上 19:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/19/#L4">王上 19:4</a>）；</p></li><li><p>穿動物毛織的簡樸衣服，束皮帶（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/1/#L8">王下 1:8</a>）；</p></li><li><p>吃烏鴉叼來的簡樸食物（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/17/#L6">王上 17:6</a>）；</p></li><li><p>有門徒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/19/#L19-21">王上 19:19-21</a>）；</p></li><li><p>奉上帝的命令責備人的不虔（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/18/#L17-40">王上 18:17-40</a>）。</p></li></ul><h3>先知但以理</h3><ul><li><p>沒有結婚；</p></li><li><p>吃簡樸的食物，拒絕王的膳食（<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/1/#L12">但 1:12</a>）；</p></li><li><p>常常祈禱（<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/6/#L10">但 6:10</a>）；</p></li><li><p>責備不虔（<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/5/#L17-28">但 5:17-28</a>）。</p></li></ul><h3>先知耶利米</h3><ul><li><p>奉上帝的命令沒有結婚（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/16/#L2">耶 16:2</a>）；</p></li><li><p>獨居，常被囚禁或流放（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/37/#L15-16">耶 37:15-16</a>）；</p></li><li><p>教導並責備萬民（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/1/#L9-10">耶 1:9-10</a>）。</p></li></ul>
