  title: 試探
  copy_cover: true
  body: <h2>信徒應當預備面對試探</h2><blockquote><p>“我兒，<strong>你前去服事上主時</strong>，應固守正義與敬畏，並應<strong>預備你的心承受試探</strong>。使你的心居正不偏，堅忍不拔；應側耳聽取明智的言語；在災難中，不要慌張。應靜心等待天主的照顧，與天主保持聯繫，總不要離棄他，好使你至死充滿幸福。<strong>凡降到你身上的，你都要接受</strong>；在痛苦中，你要忍受；在各種困苦中，你要多多忍耐；<strong>因爲金銀應在火裏鍛鍊，天主所喜悅的人，也應在謙卑的火爐中鍛鍊</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/2/#L1-5">德 2:1-5</a>)</p></blockquote><h2>試探（考驗）是有益的</h2><blockquote><p>“<strong><mark>必有許多人使自己清淨潔白，且被熬煉</mark></strong>，但惡人仍必行惡，一切惡人都不明白，惟獨智慧人能明白。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/12/#L10">但 12:10</a>)</p></blockquote><blockquote><p>“我兒，你前去服事上主時，應固守正義與敬畏，並應<strong>預備你的心承受試探</strong>。使你的心居正不偏，堅忍不拔；應側耳聽取明智的言語；在災難中，不要慌張。應靜心等待天主的照顧，與天主保持聯繫，總不要離棄他，<strong>好使你至死充滿幸福</strong>。<strong>凡降到你身上的，你都要接受</strong>；在痛苦中，你要忍受；在各種困苦中，你要多多忍耐；因爲金銀應在火裏鍛鍊，天主所喜悅的人，也應在謙卑的火爐中鍛鍊。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/2/#L1-5">德 2:1-5</a>)</p></blockquote><blockquote><p>“我的弟兄們，<strong><mark>你們落在百般試煉中，都要以爲大喜樂</mark></strong>； 因爲知道<strong><mark>你們的信心經過試驗，就生忍耐</mark></strong>。 <strong><mark>但忍耐也當成功，使你們成全完備，毫無缺欠</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L2-4">雅 1:2-4</a>)</p></blockquote><blockquote><p>“<strong><mark>忍受試探的人是有福的</mark></strong>，因爲他經過試驗以後，必得生命的冠冕，這是主應許給那些愛他之人的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L12">雅 1:12</a>)</p></blockquote><blockquote><p>“因此，<strong><mark>你們是大有喜樂，但如今在百般的試煉中暫時憂愁</mark></strong>， <strong><mark>叫你們的信心既被試驗，就比那被火試驗仍然能壞的金子更顯寶貴</mark></strong>，可以在耶穌基督顯現的時候，得著稱讚、榮耀、尊貴。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L6-7">彼前 1:6-7</a>)</p></blockquote><blockquote><p>“親愛的弟兄啊，<strong><mark>有火煉的試驗臨到你們，不要以爲奇怪</mark></strong>（似乎是遭遇非常的事）， <strong><mark>倒要歡喜</mark></strong>。因爲你們是與基督一同受苦，使你們在他榮耀顯現的時候，也可以歡喜快樂。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L12-13">彼前 4:12-13</a>)</p></blockquote><h2>上帝不容許試探超過人的力量，並賜扶助</h2><blockquote><p>“你們所遇見的試探，無非是人所能受的。上帝是信實的，<strong><mark>必不叫你們受試探過於所能受的</mark></strong>。在受試探的時候，<strong><mark>總要給你們開一條出路，叫你們能忍受得住</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L13">林前 10:13</a>)</p></blockquote><blockquote><p>“<strong><mark>主知道搭救敬虔的人脫離試探</mark></strong>，把不義的人留在刑罰之下，等候審判的日子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L9">彼後 2:9</a>)</p></blockquote><h2>如何勝過試探</h2><p>必須有屬靈的儆醒和祈禱：</p><blockquote><p>“<strong><mark>總要儆醒禱告，免得入了迷惑</mark></strong>。你們心靈固然願意，肉體卻軟弱了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L41">太 26:41</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L38">可 14:38</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L40">路 22:40</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L46">路 22:46</a>)</p></blockquote><h2>在試探中跌倒</h2><blockquote><p>“<strong><mark>但那些想要發財的人，就陷在迷惑、落在網羅和許多無知有害的私慾裏</mark></strong>，叫人沉在敗壞和滅亡中。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L9">提前 6:9</a>)</p></blockquote>
