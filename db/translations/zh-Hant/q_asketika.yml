  path: Qx4A_平靜的心靈
  title: 平靜的心靈
  copy_cover: true
  body: <h2>論上帝的安息</h2><blockquote><p>“上帝賜福給第七日，定爲聖日；因爲在這日上帝<strong><mark>歇了他一切創造的工，就安息了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L3">創 2:3</a>)</p></blockquote><blockquote><p>“耶穌就對他們說：「<strong><mark>我父作事直到如今，我也作事</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L17">約 5:17</a>)</p></blockquote><blockquote><p>“但我們已經相信的人<strong><mark>得以進入那安息</mark></strong>，正如上帝所說：「我在怒中起誓說，『<strong><mark>他們斷不可進入我的安息</mark></strong>！』」其實造物之工，從創世以來已經成全了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/4/#L3">希 4:3</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/95/#L11">詩 95:11</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/3/#L11">希 3:11</a>)</p></blockquote><h2>上帝的平安</h2><blockquote><p>“<strong><mark>我留下平安給你們</mark></strong>，<strong><mark>我將我的平安賜給你們</mark></strong>；<strong><mark>我所賜的，不像世人所賜的</mark></strong>。你們心裏不要憂愁，也不要膽怯。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L27">約 14:27</a>)</p></blockquote><blockquote><p>“我心裏柔和謙卑，<strong><mark>你們當負我的軛，學我的樣式</mark></strong>，這樣，<strong><mark>你們心裏就必得享安息</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L29">太 11:29</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所賜出人意外的平安</mark></strong>，必在基督耶穌裏，保守你們的心懷意念。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/4/#L7">腓 4:7</a>)</p></blockquote><blockquote><p>“因爲那進入安息的，<strong><mark>乃是歇了自己的工</mark></strong>，正如上帝歇了他的工一樣。 所以，<strong><mark>我們務必竭力進入那安息</mark></strong>，免得有人學那不信從的樣子跌倒了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/4/#L10-11">希 4:10-11</a>)</p></blockquote><blockquote><p>“耶和華必爲你們爭戰，<strong><mark>你們只管靜默，不要作聲</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/14/#L14">出 14:14</a>)</p></blockquote><blockquote><p>“耶和華說：「我必親自和你同去，<strong><mark>使你得安息</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/33/#L14">出 33:14</a>)</p></blockquote><blockquote><p>“我必爲我民以色列選定一個地方，栽培他們，<strong><mark>使他們住自己的地方，不再遷移</mark></strong>。兇惡之子也不像從前擾害他們，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/17/#L9">代上 17:9</a>)</p></blockquote><blockquote><p>“所以我在怒中起誓說：「<strong><mark>他們斷不可進入我的安息</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/95/#L11">詩 95:11</a>)</p></blockquote>
