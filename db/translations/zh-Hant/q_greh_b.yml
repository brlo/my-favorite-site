  title: 驕傲
  copy_cover: true
  body: <h2>對驕傲的定罪</h2><blockquote><p>“你們年幼的也要順服年長的。就是你們衆人也都要以謙卑束腰，彼此順服，『因爲<strong><mark>上帝阻擋驕傲的人，賜恩給謙卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L5">彼前 5:5</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L6">雅 4:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡心裏驕傲的，爲耶和華所憎惡</mark></strong>，雖然連手，他必不免受罰。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/16/#L5">箴 16:5</a>)</p></blockquote><blockquote><p>“<strong><mark>敬畏耶和華，在乎恨惡邪惡</mark></strong>。<strong><mark>那驕傲、狂妄並惡道</mark></strong>，以及乖謬的口，都爲我所恨惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/8/#L13">箴 8:13</a>)</p></blockquote><h2>驕傲的表現</h2><blockquote><p>“你們要小心，不可將善事行在人的面前，故意叫他們看見；若是這樣，就不能得你們天父的賞賜了。 所以，你施捨的時候，<strong><mark>不可在你前面吹號，像那假冒爲善的人</mark></strong>在會堂裏和街道上所行的，<strong><mark>故意要得人的榮耀</mark></strong>。我實在告訴你們：他們已經得了他們的賞賜。 你施捨的時候，不要叫左手知道右手所作的； 要叫你施捨的事行在暗中，你父在暗中察看，必然報答你〔有古卷作『必在明處報答你』〕。 你們禱告的時候，不可像那假冒爲善的人，愛站在會堂裏和十字路口上禱告，<strong><mark>故意叫人看見</mark></strong>。我實在告訴你們，他們已經得了他們的賞賜。 你禱告的時候，要進你的內屋，關上門，禱告你在暗中的父，你父在暗中察看，必然報答你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L1-6">太 6:1-6</a>)</p></blockquote><blockquote><p>“耶穌向那些<strong><mark>仗著自己是義人，藐視別人的</mark></strong>，設一個比喻， 說：「有兩個人上殿裏去禱告：一個是法利賽人，一個是稅吏。 法利賽人站著，自言自語的禱告說：『上帝啊，我感謝你，<strong><mark>我不像別人</mark></strong>勒索、不義、姦淫，也不像這個稅吏。 我一個禮拜禁食兩次，凡我所得的都捐上十分之一。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L9-12">路 18:9-12</a>)</p></blockquote><blockquote><p>“你們不要論斷人，就不被論斷；你們不要定人的罪，就不被定罪；你們要饒恕人，就必蒙饒恕；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L37">路 6:37</a>)</p></blockquote><blockquote><p>“你們這瞎眼領路的，蠓蟲你們就濾出來，駱駝你們倒吞下去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L24">太 23:24</a>)</p></blockquote><h2>驕傲是魔鬼的罪</h2><blockquote><p>“「人子啊，你爲推羅王作起哀歌說：『主耶和華如此說：你無所不備，智慧充足，全然美麗。 你曾在伊甸上帝的園中，佩戴各樣寶石，就是紅寶石、紅璧璽、金鋼石、水蒼玉、紅瑪瑙、碧玉、藍寶石、綠寶石、紅玉和黃金，又有精美的鼓笛在你那裏，都是在你受造之日預備齊全的。 <strong><mark>你是那受膏遮掩約櫃的基路伯</mark></strong>，我將你安置在上帝的聖山上，你在發光如火的寶石中間往來。 你從受造之日所行的都完全，<strong><mark>後來在你中間又察出不義</mark></strong>。 因你貿易很多，<strong><mark>就被強暴的事充滿，以致犯罪</mark></strong>，所以我因你褻瀆聖地，就從上帝的山驅逐你。遮掩約櫃的基路伯阿，我已將你從發光如火的寶石中除滅。 <strong><mark>你因美麗心中高傲</mark></strong>，<strong><mark>又因榮光敗壞智慧</mark></strong>，我已將你摔倒在地，使你倒在君王面前，好叫他們目睹眼見。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/28/#L12-17">結 28:12-17</a>)</p></blockquote><blockquote><p>“明亮之星，早晨之子啊！你何竟從天墜落？你這攻敗列國的，何竟被砍倒在地上？ <strong><mark>你心裏曾說</mark></strong>：「<strong><mark>我要升到天上！我要高舉我的寶座在上帝衆星以上</mark></strong>；我要坐在聚會的山上，在北方的極處； <strong><mark>我要升到高雲之上，我要與至上者同等</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/14/#L12-14">賽 14:12-14</a>)</p></blockquote>
