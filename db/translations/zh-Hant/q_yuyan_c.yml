  title: 啟示錄的七個教會
  copy_cover: true
  body: "<h2>啟示錄中各教會的評價</h2><p>可以見到教會反對者的一種嘗試：引用神學家約翰啟示錄第2-3章的內容（<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L1\">啟 2:1</a>），論證教會已離棄真信仰。在其中，主耶穌基督向七個教會說話，指出他們的長處與缺點。其實，仔細看經文，恰恰相反：教會持守著基督的信仰；即使個別教會受到指摘，也是因他們的<strong>行爲</strong>。</p><h3>1. 以弗所教會</h3><p>✅ 因行爲受稱讚（遠離淫亂、指摘假使徒、恨惡尼哥拉一黨人的行爲、忍耐、爲主勞苦）。</p><blockquote><p>“<strong><mark>我知道你的行爲、勞碌、忍耐</mark></strong>，也知道你不能容忍惡人，<strong><mark>你也曾試驗那自稱爲使徒卻不是使徒的</mark></strong>，看出他們是假的來。 <strong><mark>你也能忍耐，曾爲我的名勞苦，並不乏倦</mark></strong>。 &lt;…&gt; 然而你還有一件可取的事，就是<strong><mark>你恨惡尼哥拉一黨人的行爲</mark></strong>，這也是我所恨惡的。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L2-3,6\">啟 2:2-3,6</a>)</p></blockquote><p>❌ 受指摘，因爲他離棄了起初的愛心；並蒙召回到它，行「起初所行的<strong>事</strong>」。</p><blockquote><p>“然而，有一件事我要責備你，就是<strong><mark>你把起初的愛心離棄了</mark></strong>。 所以應當回想你是從那裏墜落的，<strong><mark>並要悔改，行起初所行的事</mark></strong>。你若不悔改，我就臨到你那裏，把你的燈臺從原處挪去。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L4-5\">啟 2:4-5</a>)</p></blockquote><h3>2. 士每拿教會</h3><p>✅ 因行爲受稱讚（忍耐患難、貧窮和毀謗）。蒙召不要懼怕將要受的逼迫。應許了生命的冠冕。完全未受指摘。</p><blockquote><p>“<strong><mark>我知道你的患難、你的貧窮</mark></strong>，（你卻是富足的！）也知道那自稱是猶太人所說的毀謗話；其實他們不是猶太人，乃是撒但一會的人。 <strong><mark>你將要受的苦你不用怕</mark></strong>。魔鬼要把你們中間幾個人下在監裏，叫你們被試煉，你們必受患難十日。<strong><mark>你務要至死忠心，我就賜給你那生命的冠冕</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L9-10\">啟 2:9-10</a>)</p></blockquote><h3>3. 別迦摩教會</h3><p>✅ 因行爲受稱讚（在逼迫的威脅下沒有棄絕基督的信仰）。</p><blockquote><p>“我知道你的居所，就是有撒但座位之處。當我忠心的見證人安提帕在你們中間，撒但所住的地方，被殺之時，<strong><mark>你還堅守我的名，沒有棄絕我的道</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L13\">啟 2:13</a>)</p></blockquote><p>❌ 受指摘，因爲他<strong>沒有趕出</strong>吃祭偶像之物、行姦淫之事的尼哥拉一黨人。同時，別迦摩教會並沒有棄絕基督的信仰：「沒有棄絕我的<strong>道</strong>」。</p><blockquote><p>“然而，有幾件事我要責備你，因爲在你那裏，<strong><mark>有人服從了巴蘭的教訓</mark></strong>；這巴蘭曾教導巴勒將絆腳石放在以色列人面前，<strong><mark>叫他們吃祭偶像之物，行姦淫的事</mark></strong>。 <strong><mark>你那裏也有人照樣服從了尼哥拉一黨人的教訓</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L14-15\">啟 2:14-15</a>)</p></blockquote><h3>4. 推雅推喇教會</h3><p>✅ 因<strong>信心</strong>和行爲（愛心、勤勉、忍耐）受稱讚。</p><blockquote><p>“<strong><mark>我知道你的行爲、愛心、信心、勤勞、忍耐</mark></strong>，又知道你末後所行的善事比起初所行的更多。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L19\">啟 2:19</a>)</p></blockquote><p>❌ 受指摘，因爲他也沒有趕出「耶洗別」，容讓她引誘信徒行姦淫、吃祭偶像之物（如同別迦摩的尼哥拉一黨人）。受刑罰的只有那些與耶洗別行淫的人。其餘的人則受稱讚：「但你們已經有的，總要持守，直等到我來」。</p><blockquote><p>“然而，有一件事我要責備你，<strong><mark>就是你容讓那自稱是先知的婦人耶洗別教導我的僕人，引誘他們行姦淫，吃祭偶像之物</mark></strong>。 我曾給她悔改的機會，她卻不肯悔改她的淫行。 看哪，我要叫她病臥在牀。<strong><mark>那些與她行淫的人，若不悔改所行的，我也要叫他們同受大患難</mark></strong>。 我又要殺死他的黨類，叫衆教會知道，我是那察看人肺腑心腸的，並要照你們的行爲報應你們各人。 至於你們推雅推喇其餘的人，就是一切不從那教訓，不曉得他們素常所說撒但深奧之理的人，我告訴你們，我不將別的擔子放在你們身上。 <strong><mark>但你們已經有的，總要持守，直等到我來</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L20-25\">啟 2:20-25</a>)</p></blockquote><h3>5. 撒狄教會</h3><p>✅ 只有幾個沒有玷污自己衣服的人受稱讚。</p><blockquote><p>“<strong><mark>然而在撒狄你還有幾名是未曾污穢自己衣服的</mark></strong>；他們要穿白衣與我同行，因爲他們是配得過的。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L4\">啟 3:4</a>)</p></blockquote><p>❌ 因其餘的人，他被比作死人，因爲行爲不完全：「因我見你的<strong>行爲</strong>在我上帝面前沒有一樣是完全的」。受指摘，因爲他不儆醒。</p><blockquote><p>“你要寫信給撒狄教會的使者說：『那有上帝的七靈和七星的說：我知道你的行爲，<strong><mark>按名你是活的，其實是死的</mark></strong>。 <strong><mark>你要儆醒</mark></strong>，堅固那剩下將要衰微的，<strong><mark>因我見你的行爲在我上帝面前沒有一樣是完全的</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L1-2\">啟 3:1-2</a>)</p></blockquote><h3>6. 非拉鐵非教會</h3><p>✅ 因行爲受稱讚（雖然力量略小，但沒有棄絕基督），因持守基督忍耐的道。蒙召：「你要持守你所有的」。完全未受指摘。</p><blockquote><p>“<strong><mark>我知道你的行爲，你略有一點力量</mark></strong>，也曾遵守我的道，<strong><mark>沒有棄絕我的名</mark></strong>。看哪，我在你面前給你一個敞開的門，是無人能關的。 &lt;…&gt; <strong><mark>你既遵守我忍耐的道</mark></strong>，我必在普天下人受試煉的時候，保守你免去你的試煉。 <strong><mark>我必快來，你要持守你所有的</mark></strong>，免得人奪去你的冠冕。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L8,10-11\">啟 3:8,10-11</a>)</p></blockquote><h3>7. 老底嘉教會</h3><p>不受稱讚。</p><p>❌ 因行爲受指摘：「我知道你的<strong>行爲</strong>，你也不冷也不熱」。蒙召向基督買金子、衣服和眼藥，並要發熱心、悔改：「所以你要發熱心，也要悔改」。</p><blockquote><p>“<strong><mark>我知道你的行爲，你也不冷也不熱</mark></strong>；我巴不得你或冷或熱。 你既如溫水，也不冷也不熱，<strong><mark>所以我必從我口中把你吐出去</mark></strong>。 你說：我是富足，已經發了財，一樣都不缺，卻不知道你是那困苦、可憐、貧窮、瞎眼、赤身的。 <strong><mark>我勸你向我買火煉的金子</mark></strong>，叫你富足；<strong><mark>又買白衣穿上</mark></strong>，叫你赤身的羞恥不露出來；<strong><mark>又買眼藥擦你的眼睛</mark></strong>，使你能看見。 凡我所疼愛的，我就責備管教他，<strong><mark>所以你要發熱心，也要悔改</mark></strong>。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L15-19\">啟 3:15-19</a>)</p></blockquote><h2>總結</h2><p>這樣：</p><ul><li><p>\U0001F7E2 士每拿教會（2）和非拉鐵非教會（6）完全未受指摘。</p></li><li><p>\U0001F7E1 別迦摩教會（3）和推雅推喇教會（4）持守了信仰，但受指摘沒有趕出引誘人的（尼哥拉一黨人和耶洗別）。受刑罰的正是那些屬於虛假教導的人。而教會本身則受稱讚：「沒有棄絕我的<strong>道</strong>」（別迦摩）、「但你們已經有的，總要持守，直等到我來」（推雅推喇）。</p></li><li><p>\U0001F7E0 以弗所教會（1）因敬虔和保守信仰受稱讚，因離棄起初的愛心受指摘，蒙召行起初所行的<strong>事</strong>。</p></li><li><p>\U0001F7E0 撒狄教會（5）因幾個保守了衣服的人受稱讚，因<strong>行爲</strong>的不完全受指摘。</p></li><li><p>\U0001F534 老底嘉教會（7）完全不受稱讚，因<strong>行爲</strong>上的不冷不熱受指摘，蒙召悔改。</p></li><li><p>因爲信仰，沒有人受指摘，但幾乎所有的都因信仰受稱讚（1, 2, 3, 4, 6）。</p></li><li><p>有些教會因一件事上的欠缺受指摘，但因持守信仰受稱讚（3, 4）。</p></li><li><p>另一些教會在行爲上有更嚴重的欠缺，但在其中信仰仍然保守著（1, 5）。</p></li><li><p>最後一個教會因對<strong>行爲</strong>的冷淡（不冷不熱）受指摘（7）。</p></li></ul><p>或許有人以爲「行爲」也包括信仰。然而，那些明確持守了信仰的教會，卻因行爲上的欠缺受指摘（3, 4）——這幾乎不給這種解釋留下餘地。這樣，啟示錄中的教會受指摘不是因爲信仰（作爲教導），而是因爲行爲上的不完全。而有些教會完全未受指摘。</p>"
