  title: 反對“唯獨聖經”
  copy_cover: true
  body: <h2>前言</h2><p>“唯獨聖經”是一種用來建立自己教會的伎倆。如同街頭猜杯戲法的把戲，用簡單而靈活的手法把聽衆繞暈，使他們覺察不到就在眼前進行的調包。他們傳授的並不是“只按聖經”的教訓，而是又一種對聖經的解釋——擯棄一切不符合新教師個人信仰（他的意見）的東西。教師的個人信仰被傳遞給聽衆，成爲又一個人的傳統。但這傳統不被稱爲傳統——伎倆就在這裏：聽衆產生一種錯覺，彷彿他們只按聖經相信。以前的異端團體就是這樣建立的：擯棄教會直接從使徒們與聖經一起領受的信仰，把教師們自己的意見高舉於一切之上，而這些意見彼此各不相同。無論出現多少教派，它們的教師們按聖經可以解釋出任何一種信仰。</p><p><strong>聖里昂的伊裏奈烏斯，聖殉道者（約130-202）</strong></p><p>“……<strong>藉著歪曲的解釋和不當的說明，他們試圖不僅從福音書和使徒的話、而且從律法和先知書中，爲自己拼湊出有利於己的證明</strong><…><strong>他們用極大的強暴和詭詐，把自己的虛構套在它們上面，從而俘虜並引離真理那些信心不堅固的人</strong><…>你看，親愛的，<strong>他們如此迷惑自己的頭腦的方式：強暴地對待聖經，試圖用聖經證實自己的虛構</strong>。<…>現在讓我們看看這些（異端教師們）意見的反覆無常：<strong>他們兩三個人對同一件事說的不是同一回事，而是彼此矛盾</strong>，無論在事情的本質上還是在名稱上。<…><strong>他們每一個人都按自己的喜好教導。</strong>”</p><p>（[俄文](https://bibleox.com/ru/ru/w/Ириней_Лионский-Против_ересей/#HH-3)《駁異端》第1卷）</p><p>“這就是<strong>他們之間對同一處經文的分歧、對同樣聖經的不同理解</strong>。”</p><p>（[俄文](https://bibleox.com/ru/ru/w/Ириней_Лионский-Против_ересей-4#HH-Глава-XXXV-Опровержение-тех-которые-одни-пророчества-производят-от-Всевышнего-Бога-другие--от-Демиурга)《駁異端》第4卷第35章第4節）</p><p><strong>聖耶羅姆·斯特里東斯基（約347-420）</strong></p><p>“既然我們已經說了很多，爭論的冗長已使聽衆疲倦，我就把心裏的話簡短而坦白地對你說：<strong>應當堅定地持守那由使徒們建立、一直存留到今日的教會。你若在什麼地方聽說有人自以爲是屬基督的，卻不從主耶穌基督、而從別人得了名——比如馬吉安派、瓦倫廷派、孟他努派或坎皮特派——要知道那不是基督的教會，而是敵基督的會堂。他們出現得較晚這一點本身，就指明他們正是使徒所預言將來要有的那些人。讓他們不要自欺，以爲在自己的話裏似乎找到了聖經的證實：因爲魔鬼也說過些出於聖經的話；聖經的實質不在於誦讀，而在於理解。否則，如果我們只隨從</strong>字面<strong>，我們自己也能編出一個新的教條來</strong>，比如說：不應當接納穿鞋並有兩件裏衣的人進教會。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ieronim_Stridonskij/razgovor-protiv-lyutsiferian/)《駁路西弗派對話錄》）</p><p><strong>勒林的聖文森特（卒於450年前）</strong></p><p>“我們還抨擊了涅斯托利罪愆的高傲：他<strong>自誇只有他一人明白聖經，彷彿在他以前解釋過上帝聖言的一切人都不知道它——他們擁有教師的恩賜，即所有的司祭、所有的宣信者和殉道者</strong>，其中一些人講解上帝的律法，另一些人贊同講解的人或相信他們；他最後<strong>斷言整個教會如今在迷誤、並且一直在迷誤</strong>——在他看來，教會一直跟隨、並將跟隨無知而迷誤的教師們。”</p><p>（[俄文](https://bibleox.com/ru/ru/w/IRu7_Памятные_записки_Перегрина/)《遊記備忘錄》）</p><p>其餘類似的言論見：<a href="https://bibleox.com/ru/ru/w/WxNK_Против_Sola_Scriptura">反對唯獨聖經的語錄</a></p><h2>“唯獨聖經”</h2><p><strong>“唯獨聖經”</strong>（拉丁文 Sola Scriptura，俄文——Только Писание）——十六世紀改革家們（<a href="https://bibleox.com/ru/ru/w/3SlQ_Протестантизм">新教</a>運動的創始者）提出的建立教義的方法：按照這一方法，建立教義的最高權威只是聖經（按讀者的主觀理解）。</p><p>雖然理論上如此，但在新教徒和新新教徒中間，廣泛地把“唯獨聖經”理解爲完全棄絕聖傳。願意在教父遺產領域論辯的新教徒並不多；而且最常見的是，在正教徒與新教徒的論辯中，只要提到聖教父的名字、更不必說他們的著作，就會遇到激烈的排斥和譏笑。“傳統”一詞在新教團體中被賦予負面的態度——把它與“古人的遺傳”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/15/#L2">太 15:2</a>）等同起來，同時完全無視使徒聖傳的存在——而使徒們自己曾命令保守這傳統（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>）：這信仰是主和使徒們以種種方式栽種在教會裏、並在教會中不斷保存、由祖先傳給後代的。</p><h2>爲“唯獨聖經”辯護的嘗試</h2><p>“唯獨聖經”的擁護者引用聖經的引文，擺出這樣的姿態，彷彿其中說的是必須把聖經當作信仰的最高或唯一權威。然而實際上，所引的引文中沒有一處說的是“唯獨聖經”，即彷彿<strong>只有</strong>聖經（除它之外什麼都沒有）在教義中擁有某種獨一的、最高的或唯一的角色。</p><p>爲“唯獨聖經”辯護所引用的引文有以下幾類。</p><h3>1. 上帝的道——是真理</h3><p>上帝以任何方式所宣告的（口頭的、書面的、異象中、經由使者：天使、先知或使徒）——都是真理：</p><blockquote><p>“求你用真理使他們成聖；<strong><mark>你的道就是真理</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L17">約 17:17</a>)</p></blockquote><p>對此我們不爭辯。上帝的每一句話都是真理，而不只是寫下的。口傳的聖傳也稱爲上帝的道：</p><blockquote><p>“爲此，我們也不住的感謝上帝，因你們聽見<strong><mark>我們所傳上帝的道</mark></strong>，就領受了；不以爲是人的道，<strong><mark>乃以爲是上帝的道</mark></strong>。這道實在是上帝的，並且運行在你們信主的人心中。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><blockquote><p>“你們蒙了重生，不是由於能壞的種子，乃是由於不能壞的種子，是藉着上帝活潑常存的道。 因爲：『凡有血氣的，盡都如草，他的美榮都像草上的花。草必枯乾，花必凋謝； <strong><mark>惟有主的道是永存的</mark></strong>。』<strong><mark>所傳給你們的福音就是這道</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L23-25">彼前 1:23-25</a>)</p></blockquote><p>對聖經都是上帝所默示的，我們也不爭辯：</p><blockquote><p>“<strong><mark>聖經都是上帝所默示的</mark></strong>，於教訓、督責、使人歸正、教導人學義都是有益的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L16">提後 3:16</a>)</p></blockquote><h3>2. 聖經對信徒是重要的</h3><p>聖經對信徒有很高的價值：</p><blockquote><p>“<strong><mark>聖經都是上帝所默示的</mark></strong>，<strong><mark>於教訓</mark></strong>、督責、使人歸正、教導人學義都是<strong><mark>有益</mark></strong>的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L16">提後 3:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你們查考聖經</mark></strong>，因你們以爲內中有永生；給我作見證的就是這經；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L39">約 5:39</a>)</p></blockquote><p>對此我們同樣不爭辯。</p><p>---</p><p>這一切都是對的。正教會不與其中任何一點爭辯，而是自己肯定這一切。</p><p>然而：</p><ul><li><p>這些引文並不表明真理<strong>只</strong>在聖經裏，而聖傳不是真理；關於聖傳的同樣的引文乾脆被忽略（見<a href="https://bibleox.com/ru/ru/w/Против_Сола_Скриптуры#HH-Указание-хранить-Предание-и-учить-согласно-с-ним">下文</a>），因爲“唯獨聖經”的擁護者沒有維護聖傳之必要性的目標。</p></li><li><p>這些引文並不表明<strong>一切</strong>上帝的啟示都寫在了聖經裏、因此彷彿聖傳可以被拋棄。拋棄聖傳——是違揹聖經的行爲（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>）。</p></li></ul><p>所引的一切引文對於“唯獨聖經”這一概念中的“唯獨”一詞完全沒有說什麼。它們只是指明上帝啟示的必要性和它的真實性，無論這啟示以什麼形式被領受：書面的、口頭的或以可見方式顯示的。我們相信這一點，這裏沒有任何“唯獨聖經”的成分。</p><h2>“唯獨聖經”宣講者的伎倆</h2><p>向聽衆表明聖經擁有很高的權威、聽聖經就是聽上帝之後，接下來在聽衆完全不覺察的情況下發生了調包：開始講話、按自己的意思解釋聖經的，不再是上帝和聖經，而是宣講者。於是現在被要求當作上帝的話來接受的——是宣講者的話，是幾千個在解釋聖經上彼此矛盾的團體之一的創立者的話。</p><p>當然，宣講者在自己的話語中繼續引用聖經，用一套引文支持自己的話；但這裏明顯的問題是：新教以這種方式生出了關於上帝、他的作爲和拯救方式的成千種隨便什麼樣的教訓。更有甚者，從基督教存在之初，教會之外的團體就力求歪曲信仰、恰恰藉著歪曲聖經把人引到自己那裏。連魔鬼也這樣做過——正是用聖經試探基督：</p><blockquote><p>“魔鬼就帶他進了聖城，叫他站在殿頂上， 對他說：「你若是上帝的兒子，<strong><mark>可以跳下去</mark></strong>，<strong><mark>因爲經上記著說</mark></strong>：『<strong><mark>主要爲你吩咐他的使者，用手托著你</mark></strong>，免得你的腳碰在石頭上。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/4/#L5-6">太 4:5-6</a>)</p></blockquote><p>魔鬼同樣藉著上帝的話語使最初的人墮落：</p><blockquote><p>“耶和華上帝所造的，惟有蛇比田野一切的活物更狡猾。蛇對女人說：「<strong><mark>上帝豈是真說不許你們吃園中所有樹上的果子嗎</mark></strong>？」 女人對蛇說：「園中樹上的果子，我們可以吃， 惟有園當中那棵樹上的果子，上帝曾說：『你們不可吃，也不可摸，免得你們死。』」 蛇對女人說：「<strong><mark>你們不一定死</mark></strong>， 因爲上帝知道，你們吃的日子眼睛就明亮了，你們便如上帝能知道善惡。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L1-5">創 3:1-5</a>)</p></blockquote><p>這樣，魔鬼和與教會爲敵的團體的創立者們，正是使用聖經來誘惑人。這是怎麼發生的？發生的原因在於：把聖經的權威賦予了它的私人的解釋。</p><h2>“唯獨聖經”的根本問題——主觀主義</h2><p>這一建立信仰之方式的根本問題在於：<strong>不存在對聖經的客觀理解</strong>。每個人都透過自己積累的經驗、世界觀、興趣和偏好來接受它，也就是<strong>主觀地</strong>接受。簡單地說，問題在於：<strong>誰來決定什麼符合聖經、什麼不符合？</strong>“唯獨聖經”不回答這個問題。恰恰是這一點使它成爲只在理論上存在、無法在實踐中實現的學說。這不是無根據的斷言。</p><p>“唯獨聖經”最早的使用者（改革家們）提出了以他們各自不同的、對聖經的理解爲基礎的不同教義。分歧涉及最重要的問題：</p><ul><li><p>得救；</p></li><li><p>人是否被預定得救，</p></li><li><p>人的罪性，</p></li><li><p>聖奧祕在信徒生活中的角色，</p></li><li><p>基督在聖餐中臨在的真實性，</p></li><li><p>能否給嬰兒施洗，</p></li><li><p>信徒生活中有沒有聖像。</p></li></ul><p>不同的教義立刻產生了不同的團體。而這只是開始。隨著時間推移，“唯獨聖經”使用者中間的分歧和分裂迅速增多；開始於路德、加爾文和英國國教的三個方向，後來發展出成千上萬個派別。</p><h2>“唯獨聖經”導致出現衆多聖傳</h2><p>按宗教改革家們所宣稱的設想，“唯獨聖經”應當濾去人的聖傳。而實際上，每一個新的新教社團的創立者，都成了又一個人之聖傳的創立者——只是把自己的信仰披上聖經引文的外衣；在宗教改革之前很久，自從出現有權威的言論和文本以來，各種異端創始者就已經在這樣作了（詳見<a href="https://bibleox.com/ru/ru/w/Предание">聖傳</a>）。</p><p>新的領袖周圍形成了一個社團，這社團所接受、保存並傳給自己後代的，不是別的，正是這位領袖的信仰。如果有人想加入這個社團，他就必須接受該社團領袖的信仰，並按該社團的理解去理解聖經。人到浸信會那裏來——就按浸信會的聖傳接受信仰；到五旬節派那裏——按五旬節派的聖傳；到復臨派那裏——按復臨派的聖傳，其餘的團體也是如此。不然他就會被排斥爲“異端”、被驅逐。</p><p>結果是，所有這些由“唯獨聖經”產生的社團都走到了這一步：要相信的根本不是“只按聖經”，而是嚴格按他們的聖傳——只按他們的領袖曾經說過的、而社團把它作爲聖傳保存下來的話，經由口頭的傳道和教師們的書籍，把知識從祖先傳給後代。只不過人們不把這稱爲聖傳，更不稱爲“人的聖傳”——這個詞作爲嚇人的東西，只會用來稱呼教會的聖傳。</p><h2>社團領袖——信仰的源頭</h2><p>如果聖經是某種自足的信仰源頭，那麼每個主張“只按聖經”建立信仰的人，本應與其他“唯獨聖經”的使用者有相同的信仰。然而他們所有人的信仰各不相同，也就是說信仰的源頭各不相同。這源頭就是<strong>人</strong>——社團的創立者。他發明了信仰，傳給自己的追隨者，而追隨者們則保存著自己領袖的信仰。</p><h2>實際上，在新教社團中居首位的是他們自己的聖傳，而不是聖經</h2><p>在所有這些社團中，居首位的正是他們的聖傳，聖經只被用作補充的工具，從中挑選有利於論證聖傳的引文。在這種團體中所接受的信仰實際上壓過了聖經，聖經文本只被用來在聽衆周圍製造肥皂泡——一種引人分心的幻覺，彷彿這裏信的只是“只有聖經”。</p><p>如果聖經與聖傳相牴觸，聖經很容易被忽略。例如，聖經中任何地方都沒有說嬰兒不能受洗；相反，洗禮的預像（割禮）恰恰行在嬰兒身上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L10-12">創 17:10-12</a>），然而許多新教徒堅持禁止嬰兒受洗，從聖經裏舉出間接的理由。聖經中沒有說嬰兒不受洗也能得救；相反，救主說，除非從水和聖靈生，就不能進上帝的國（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5">約 3:3,5</a>），又命令爲萬民施洗（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L19">太 28:19</a>），卻不設年齡的限制；而未受割禮的人要從民中剪除（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L14">創 17:14</a>）——預像清楚地表明了洗禮的必要。</p><p>他們在保守只存在於自己聖傳中的信仰的同時，指摘教會關於司祭職分之恩典經由按手傳遞的教導，卻輕率地拋棄了論及上帝的恩賜<strong>藉着</strong>按手傳遞的最直白的話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L18">徒 8:18</a>）。爲什麼？原因很簡單：他們的聖傳提供的是另一種信仰；既然聖傳壓過聖經，聖經的直白教導就被忽略了。</p><h2>不誠實的對立</h2><p>在“唯獨聖經”擁護者所建立的團體中，廣泛流傳著這樣的對立：教會拋棄了聖經、只按傳統相信；而每個新教團體相反——拋棄了傳統、只按聖經相信。</p><p>實際上：</p><ul><li><p>教會不是隻按傳統相信——她把聖經與傳統平等地使用；</p></li><li><p>新教團體也不是隻按聖經相信——他們只承認自己領袖的信仰爲正確，並把它作爲傳統保存。</p></li></ul><p>這樣，實踐中根本不存在任何“唯獨聖經”。它只存在於理論中。每個具體的人對這一概念的實現，必然帶來又一種新信仰、又一種對聖經的新理解、又一個團體，以及隨之而來的又一個傳統。</p><p>證明這一點並不難。做一個實驗就夠了。如果一個人進入這樣的團體之一，而這團體不向他傳遞自己的知識、只是把一本聖經放在他手裏，那麼只讀這一本聖經，這個人百分之百不會得出這個團體的信仰。他只有在一種情況下才會得出他們的信仰——如果這團體把自己的信仰傳給他。</p><p>正教會用聖經證實自己全部的教義。然而新教團體不同意教會性的聖經理解，提出以自己的理解和信仰來代替“唯獨聖經”（默不作聲）。</p><h2>“唯獨聖經”與聖經直接衝突</h2><p>正教會反對“唯獨聖經”的理由，不是針對“聖經”一詞，而是針對“唯獨”一詞。而理由正是建立在聖經上的：</p><ol><li><p>“唯獨聖經”在聖經裏沒有。聖經本身沒有建立“只按聖經”的信仰、或只偏愛聖經的要求。因此新教徒只能引用關於聖經之重要性的引文（對關於聖傳之重要性的引文避而不談），因爲聖經裏關於“唯獨聖經”的引文根本沒有。</p></li><li><p>相反，聖經說要保守口傳的聖傳。多次要求保守聖傳：不僅是使徒們書面的、還有口頭的宣講（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>）。而且使徒們把口頭宣講放在第一位（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>）。</p></li><li><p>聖經要求向教會的教師們學習。上帝在教會裏設立了司祭們和教師們（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28">林前 12:28</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L11">弗 4:11</a>），教會的羊羣（會衆）被託付給他們管理並教導。“唯獨聖經”的擁護者拒絕向教會學習。這些人不願在教會裏作學生，就宣佈自己爲教師（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L3">提後 4:3</a>）。</p></li><li><p>聖經可能被錯誤地解釋。聖經裏有話：未經教會堅立的人強解聖經，自取沉淪（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L15-16">彼後 3:15-16</a>）。“唯獨聖經”的擁護者甚至不打算向教會學習。他們自己擯棄教師、只拿了教科書，隨意解釋聖經，這使他們成爲衆多分離的團體——有著不同的信仰和不同的對教科書（聖經）的理解。而聖經裏說：不經教會的教導而自己解釋聖經，導致歪曲聖經和滅亡（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L15-16">彼後 3:15-16</a>）。</p></li></ol><p>這樣，“唯獨聖經”的擁護者在以下各點上行事違揹聖經：</p><ol><li><p>教導聖經裏沒有的東西。聖經裏沒有關於“唯獨聖經”的教訓；</p></li><li><p>擯棄使徒們口傳的聖傳。他們說只有聖經具有首要意義，卻與聖經裏所記使徒的話背道而馳——使徒們要求保守聖傳，把口頭宣講放在第一位，然後纔是書面的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>）；</p></li><li><p>擯棄教會的教導職分和上帝所立的教會教師們，直接違揹聖經（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28">林前 12:28</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L11">弗 4:11</a>）。</p></li><li><p>不經教會的堅立而解釋聖經。每個新教團體都有自己的聖經理解；團體的每個聚會點、乃至聚會點中的每個人，都可以隨己意理解聖經，因爲“唯獨聖經”催促人擯棄聖經（按讀者的理解）之外任何其他教義來源的最高權威。如果一個人喜歡另一種對聖經的理解，那它就被認爲是正確的——畢竟聖經比宣講者的話更大，哪怕那宣講者是新教的。</p></li></ol><h2>“唯獨聖經”觀念錯誤的最主要證明</h2><p>如果發明“唯獨聖經”的目的是儘可能地分裂基督教世界，那麼這一觀念極其有效。但如果發明它的目的是尋找使徒的信仰，那麼“唯獨聖經”就成了錯誤的觀念，它使人遠離目標，並生出了衆多的傳統和分裂。</p><p>“唯獨聖經”錯誤的最主要證明——就是“唯獨聖經”的使用者們自己：以“只按聖經”爲口號建立的、無數彼此矛盾的團體及其教義。沒有任何別的觀念像“唯獨聖經”那樣在信基督的人中製造了這麼多分裂。而這是直接違揹聖經作的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18-19">約壹 2:18-19</a>）。</p><blockquote><p>“我不但爲這些人祈求，也爲那些因他們的話信我的人祈求， <strong><mark>使他們都合而爲一</mark></strong>；正如你父在我裏面，我在你裏面，使他們也在我們裏面，<strong><mark>叫世人可以信你差了我來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，勸你們<strong><mark>都說一樣的話</mark></strong>。你們中間也<strong><mark>不可分黨</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>)</p></blockquote><blockquote><p>“小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來，<strong><mark>現在已經有好些敵基督的出來了</mark></strong>，從此我們就知道如今是末時了。 <strong><mark>他們從我們中間出去，卻不是屬我們的</mark></strong>；若是屬我們的，就必仍舊與我們同在；他們出去顯明都不是屬我們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18-19">約壹 2:18-19</a>)</p></blockquote><p>---</p><p>十六世紀，改革家路德提出了“唯獨聖經”的概念。後來每個改革家都開始建立信仰，如他們所宣稱的，把最高權威賦予“只按聖經”（即對聖經的自己理解）。原本以爲只按聖經建立信仰，應當使人們得出使徒的信仰。這樣就宣稱：正是這個方法、並且只有這個方法，使人得以達到使徒的信仰。但結果，所有改革家都與構想相違，得到了各不相同的信仰。</p><p>“唯獨聖經”的進路最初產生了三個對聖經理解不同的方向：信義宗、加爾文宗和英國國教。後來，這一概念使地球上的任何人都可以建立自己的團體和自己的教義——只要拿起一本聖經。於是就出現了成千上萬的所謂“宗派”，每個都有自己的信仰和自己的聖經理解。這一過程至今仍在繼續。因信仰的差異，按人的習俗（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L3">林前 3:3</a>），他們彼此分離，各有不同的信仰、不同的洗禮和不同的上帝觀。這一切都與教會中應有的樣子相違揹：</p><blockquote><p>“<strong><mark>身體只有一個</mark></strong>，聖靈只有一個，正如你們蒙召，同有一個指望。 <strong><mark>一主，一信，一洗</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L4-5">弗 4:4-5</a>)</p></blockquote><p>有人可能就信仰上帝的不同提出異議，說大家都信耶穌。然而並非人人都有使徒們對基督作爲上帝的信仰；有不少新教一位論者，否認對獨一上帝——父、子、聖靈三位一體——的信仰。此外，許多團體對上帝、對他的旨意和討他喜悅的方式有不同的觀念。比如五旬節派/靈恩派認爲，上帝喜悅他們無條理的喃喃、倒在地上，彷彿這一切都是聖靈——即上帝——的運作。而別的團體則拒絕五旬節派對上帝的這種觀念，提出自己另外的觀念。這樣，他們對上帝有不同的觀念，有時甚至有關於上帝的不同教訓。</p><p>無數手拿聖經、彼此矛盾、宣稱又建立了一種“只按聖經”之信仰的人，是反對“唯獨聖經”的最鮮明論據。人們曾應許說，藉著“唯獨聖經”會鋪就通向唯一使徒信仰的道路，把信仰從“人的附加物”中解放出來；但實際上，這一進路生出了無數人的附加物，沒有給基督教世界帶來任何東西，只有無數的分裂——違揹上帝關於信徒合一的旨意（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18-19">約壹 2:18-19</a>）。</p><h3>舊約中的平行</h3><p>類似的分裂在舊約中也發生過——在建造巴比倫城和塔的時候（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/11/#L1-9">創 11:1-9</a>）。人們想靠自己的力量建一座城和一座通天的塔（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/11/#L4">創 11:4</a>），但開始說不同的話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/11/#L7">創 11:7</a>），分裂並分散了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/11/#L8">創 11:8</a>）。如今也是這樣。</p><p>上帝建立了教會，永遠賜給她聖靈（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>），自己應許常與她同在（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L20">太 28:20</a>），口傳了教訓，立了司祭（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L17-18,28">徒 20:17-18,28</a>）和教師（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28">林前 12:28</a>）——他們口頭教導，但也進行書信往來。</p><p>十五個多世紀之後，來了些人，從教會裏只取了教會所保存的部分使徒的書信（並非全部），違揹這些書信，擯棄了不可戰勝的教會（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L18">太 16:18</a>）——上帝所立的根基；擯棄了從使徒領受、保存在教會裏的信仰——使徒們的聖傳（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>等）；擯棄了上帝所立的司祭（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L17-18,28">徒 20:17-18,28</a>）和教師（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28">林前 12:28</a>）；決意按自己的聰明和力量（歷史、考古、語言學等研究）獨立地、與上帝所建立的教會分離地，建造自己的城。別的建造者也加入了他們。結果，他們開始說不同的話，分裂並分散，開始建造自己的、各有自己交流語言的居住地，而不願住在那座“有根基的城——其設計者和建造者乃是上帝”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L10">希 11:10</a>）。</p><h2>“唯獨”聖經導致“唯獨”式思維</h2><p>新教的教訓包含許多帶“唯獨”一詞的論點，它常使擁護者陷入一種思維，可簡稱爲“唯獨”式思維。這使其中許多人只注意文本中自己喜歡的一些片段，在合適的地方想像出“唯獨”一詞，彷彿對自己說：“只有這些話我應當考慮”，並在這上面建立某種構造。當某文本的作者考察同一事物的不同方面——或依次、或在作品的不同地方描述它們——時，新教徒往往只選出一樣，把它絕對化。</p><ul><li><p>例如，使徒們寫道，得救既需要信心，也需要行爲。“唯獨”式思維使人只挑選關於信心的片段，並加上“唯獨”一詞。</p></li><li><p>使徒們既寫聖經，也寫聖傳的必要。“唯獨”式思維使人只挑選關於聖經之重要性的片段，並加上“唯獨”一詞。</p></li></ul><p>在研究古代作家的文本時，這種思維幾乎處處顯現。</p><ul><li><p>例如，作者們在解釋聖餐時給出兩種解釋（字面的和象徵的）；新教徒傾向於只看見象徵性的解釋，試圖把這些作者說成自己“唯獨”式教訓的擁護者。</p></li></ul><p>按這一原則產生了許多異端。耶穌基督是人這一事實，難道意味著他<strong>只是</strong>人？不，他也是上帝。而如果他是上帝，這是否意味著他<strong>只是</strong>上帝？不，他也是人。如果基督是父的像，這是否意味著他<strong>只是</strong>像（僅是畫像）？不，他還是真上帝、真人。多少人在這裏跌倒，至今仍在跌倒。這裏也是一樣：象徵性的解釋不否定字面的，字面的也不否定象徵的。</p><p>正教徒承認聖經和聖傳、信心和行爲的必要，承認聖餐的字面理解，也同時承認其象徵的意義——沒有任何東西妨礙這一點。許多新教徒到處堅持“唯獨”一詞，乾脆無視同一位作者的其他話語。</p><h2>耶路撒冷會議與聖經</h2><p>教會不是按“只按聖經”的原則生活的最鮮明證據之一，是使徒們主持的第一次教會會議——耶路撒冷會議的事件。</p><p>在耶路撒冷會議上，沒有聖經的指示，廢除了摩西的律法、割禮、不潔食物的禁令、安息日的安息、接觸死人的禁令、與外邦人交往的禁令等等。這一決定是教會聚集一起商議後作出的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L22">徒 15:22</a>）。這作成時沒有引用聖經，因爲聖經的作者——聖靈——住在教會裏；所以會議的決議不是用“因爲經上記著”這句話確立，而是指著聖靈和教會的旨意：“因爲聖靈和我們定意”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L28-29">徒 15:28-29</a>）。</p><p>這樣，廢除摩西的律法，是聖靈和教會的決定。另一方面，反對他們的是從法利賽教門信了主的基督徒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L5">徒 15:5</a>）。在後者一邊有聖經中一些可理解的經文（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L14">創 17:14</a>）。在使徒們一邊的，恰恰是教會的權威：如經所記，他們與全教會一同商議（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L22">徒 15:22</a>），然後宣佈了共同的決定。他們沒有用聖經，而只是憑自己的話，向那些按聖經要求守律法的人指明了律法的廢除。</p><p>聖經裏說必須受割禮，不割禮的人要從民中剪除（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L14">創 17:14</a>）。但使徒們並沒有吩咐教導這個：</p><blockquote><p>“我們聽說<strong><mark>有幾個人從我們這裏出去</mark></strong>，用言語攪擾你們，<strong><mark>惑亂你們的心</mark></strong>。〔有古卷在此有『你們必須受割禮，守摩西的律法。』〕<strong><mark>其實我們並沒有吩咐他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L24">徒 15:24</a>)</p></blockquote><p>但這可是聖經裏說的。根據什麼不需要教導這個？根據哪部聖經決定不需要受割禮？哪部聖經允許吃豬肉？——這不是按聖經作的，而是按全教會的、證實真理的會議決定（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L15">提前 3:15</a>）。</p><p>從那時起，耶路撒冷會議的決定成爲教會的聖傳：</p><blockquote><p>“他們經過各城，<strong><mark>把耶路撒冷使徒和長老所定的條規交給門徒遵守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/16/#L4">徒 16:4</a>)</p></blockquote><p>---</p><p>耶路撒冷使徒會議的主席、使徒雅各，在自己的講話中回憶先知阿摩司的話。這預言裏沒有受割禮的話：</p><blockquote><p>“到那日，<strong><mark>我必建立大衛倒塌的帳幕</mark></strong>，堵住其中的破口。把那破壞的建立起來，重新修造，像古時一樣， <strong><mark>使以色列人得以東所餘剩的和所有稱爲我名下的國</mark></strong>。」此乃行這事的耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/am/9/#L11-12">摩 9:11-12</a>)</p></blockquote><p>如果以此爲根據接受耶路撒冷會議所作的（某種對聖經的隱含引用和提及聖靈），那麼按理也應當接受正教會的所有大公會議，而不只是耶路撒冷會議，因爲聖靈被賜給教會，不是隻在耶路撒冷會議時，而是永遠：</p><blockquote><p>“我要求父，父就另外賜給你們一位保惠師，<strong><mark>叫他永遠與你們同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>)</p></blockquote><p>基督自己也應許常與教會同在：</p><blockquote><p>“凡我所吩咐你們的，都教訓他們遵守，<strong><mark>我就常與你們同在，直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L20">太 28:20</a>)</p></blockquote><p>在所有會議上——包括捍衛聖像敬禮的第七次會議——都有來自聖經的遠爲更有分量的依據。聖靈仍然在教會裏。按這樣的論據，所有會議都應當被接受。</p><h2>教會的教導職分</h2><h3>羊羣被託付給長老們——他們曾是它的守護者</h3><blockquote><p>“保羅從米利都打發人往以弗所去，<strong><mark>請教會的長老來</mark></strong>。 他們來了，保羅就說：「你們知道，自從我到亞西亞的日子以來，在你們中間始終爲人如何， &lt;…&gt; <strong><mark>聖靈立你們作全羣的監督</mark></strong>，你們就當爲自己謹慎，也爲全羣謹慎，<strong><mark>牧養上帝的教會</mark></strong>，就是他用自己血所買來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><h3>上帝在教會裏立了教師；不是人人都是教師</h3><blockquote><p>“<strong><mark>他所賜的有使徒，有先知，有傳福音的，有牧師和教師</mark></strong>。 <strong><mark>爲要成全聖徒，各盡其職，建立基督的身體</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L11-12">弗 4:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝在教會所設立的</mark></strong>：第一是使徒，第二是先知，第三是教師，其次是行異能的，再次是得恩賜醫病的，幫助人的，治理事的，說方言的。 <strong><mark>豈都是使徒嗎</mark></strong>？<strong><mark>豈都是先知嗎</mark></strong>？<strong><mark>豈都是教師嗎</mark></strong>？<strong><mark>豈都是行異能的嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28-29">林前 12:28-29</a>)</p></blockquote><h3>未經教會堅立的人強解聖經，自取沉淪</h3><blockquote><p>“並且要以我主長久忍耐爲得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。 他一切的信上也都是講論這事。<strong><mark>信中有些難明白的</mark></strong>，<strong><mark>那無學問、不堅固的人強解</mark></strong>，如強解別的經書一樣，<strong><mark>就自取沉淪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L15-16">彼後 3:15-16</a>)</p></blockquote><h2>聖經可以被錯誤地解釋</h2><blockquote><p>“並且要以我主長久忍耐爲得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。 他一切的信上也都是講論這事。<strong><mark>信中有些難明白的</mark></strong>，<strong><mark>那無學問、不堅固的人強解</mark></strong>，如強解別的經書一樣，<strong><mark>就自取沉淪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L15-16">彼後 3:15-16</a>)</p></blockquote><p>詳見：<a href="https://bibleox.com/ru/ru/w/толкование-писания">聖經的解釋</a></p><p>“使聖徒們知道：發明異端的魔鬼，因自己惡毒的臭氣，利用聖經的經文，把毒藏在它們的外衣之下，誘惑頭腦簡單的人。他就是這樣誘惑了夏娃。就這樣產生了別的異端。如今也這樣說服亞流僞裝起來、說些表面上反對異端的話，以便不知不覺地在人們頭腦裏播下自己的異端。<…>誰曾聽說過這樣的事？或者說，這些被收買、諂媚的異端辯護者，是從哪裏、從誰那裏聽到這些的？誰在講授教理時對他們說過類似的話？<…>如果他們自己承認是如今第一次聽到這些，那就讓他們不要否認：這異端與我們無乾、不是從教父們藉來的。不是從教父借來、而是如今才發明的，還能是什麼——不就是有福的保羅所預言的嗎：‘末世必有人離棄真道，聽從那引誘人的邪靈和鬼魔的道理……這等人的良心如同被熱鐵烙慣了一般’（提前 4:1-2），以及‘離棄真理’的（多 1:14）？”</p><p>（[俄文](https://azbyka.ru/otechnik/Atanasij_Velikij/poslanie_na_arian)《致亞流派書信》第1篇第8節——亞他那修，大聖）</p><h2>什麼是聖傳？</h2><p>聖傳——父上帝的啟示，他藉自己的獨生子傳給使徒們，使徒們傳給教會；教會把它作爲信仰世世代代以言語（口頭的和書面的）和行爲傳下去：</p><blockquote><p>“因爲<strong><mark>你所賜給我的道，我已經賜給他們，他們也領受了</mark></strong>；又確實知道我是從你出來的，並且信你差了我來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L8">約 17:8</a>)</p></blockquote><blockquote><p>“我稱讚你們，因你們凡事記念我，<strong><mark>又堅守我所傳給你們的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><h2>命令保守聖傳並按它教導</h2><blockquote><p>“所以弟兄們，你們要站立得穩，<strong><mark>凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>)</p></blockquote><blockquote><p>“我稱讚你們，因你們凡事記念我，<strong><mark>又堅守我所傳給你們的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“弟兄們，我如今把先前所傳給你們的福音，告訴你們知道。這福音你們也領受了，又靠著站立得住； 並且你們若不是徒然相信，<strong><mark>能以持守我所傳給你們的</mark></strong>，就必因這福音得救。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><blockquote><p>“弟兄們，我還有話說：我們靠著主耶穌求你們、勸你們，<strong><mark>你們既然受了我們的教訓</mark></strong>，知道該怎樣行，可以討上帝的喜悅，就要照你們現在所行的，<strong><mark>更加勉勵</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/4/#L1">帖前 4:1</a>)</p></blockquote><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要<strong><mark>爲從前</mark></strong><strong><mark>一次</mark></strong><strong>交付聖徒的真道竭力的爭辯</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote><blockquote><p>“<strong><mark>堅守所教真實的道理</mark></strong>，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。 因爲<strong><mark>有許多人不服約束</mark></strong>，說虛空話欺哄人，那奉割禮的更是這樣。 這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“我只怕你們的心或偏於邪，失去那向基督所存純一清潔的心，就像蛇用詭詐誘惑了夏娃一樣。 假如有人來<strong><mark>另傳一個耶穌</mark></strong>，不是我們所傳過的，或者你們另受一個靈，不是你們所受過的；或者<strong><mark>另得一個福音</mark></strong>，不是你們所得過的，你們容讓他也就罷了。 &lt;…&gt; 那等人是假使徒，行事詭詐，裝作基督使徒的模樣。 這也不足爲怪，因爲連撒但也裝作光明的天使。 所以，他的差役若裝作仁義的差役，也不算希奇。他們的結局必然照著他們的行爲。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L3-4,13-15">林後 11:3-4,13-15</a>)</p></blockquote><blockquote><p>“我往馬其頓去的時候，曾勸你仍住在以弗所，好囑咐那幾個人<strong><mark>不可傳異教</mark></strong>， 也不可聽從荒渺無憑的話語和無窮的家譜。這等事只生辯論，並不發明上帝在信上所立的章程。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L3-4">提前 1:3-4</a>)</p></blockquote><h2>聖傳不只是文本，也是聽見的言語</h2><blockquote><p>“爲此，我們也不住的感謝上帝，因你們聽見<strong><mark>我們所傳上帝的道</mark></strong>，就領受了；不以爲是人的道，乃以爲是上帝的道。這道實在是上帝的，並且運行在你們信主的人心中。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/2/#L13">帖前 2:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你從我聽的那純正話語的規模</mark></strong>，要用在基督耶穌裏的信心和愛心，常常守著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L13">提後 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><blockquote><p>“所以弟兄們，你們要站立得穩，<strong><mark>凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>)</p></blockquote><blockquote><p>“論到你們，<strong><mark>務要將那從起初所聽見的常存在心裏</mark></strong>。<strong><mark>若將從起初所聽見的存在心裏</mark></strong>，你們就必住在子裏面，也必住在父裏面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L24">約壹 2:24</a>)</p></blockquote><blockquote><p>“我稱讚你們，因你們<strong><mark>凡事記念我</mark></strong>，又堅守我所傳給你們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“<strong><mark>所以要回想你是怎樣領受、怎樣聽見的</mark></strong>，<strong><mark>又要遵守</mark></strong>，並要悔改。若不儆醒，我必臨到你那裏，如同賊一樣；我幾時臨到，你也決不能知道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L3">啟 3:3</a>)</p></blockquote><h2>聖傳的必要性</h2><h3>聖經並不是關於耶穌基督的全部信息的來源</h3><blockquote><p>“耶穌在門徒面前另外行了許多神蹟，<strong><mark>沒有記在這書上</mark></strong>。 但記這些事，要叫你們信耶穌是基督，是上帝的兒子，並且叫你們信了他，就可以因他的名得生命。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L30-31">約 20:30-31</a>)</p></blockquote><blockquote><p>“<strong><mark>耶穌所行的事還有許多</mark></strong>；若是一一的都寫出來，我想，所寫的書，就是世界也容不下了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/21/#L25">約 21:25</a>)</p></blockquote><h3>聖經裏沒有關於按手的教導</h3><p>任何一封書信裏都沒有關於如何施洗、如何按立輔祭、司祭、主教的教導：</p><blockquote><p>“所以，我們應當離開基督道理的開端，竭力進到完全的地步，不必再立根基，就如那懊悔死行、信靠上帝、 <strong><mark>各樣洗禮、按手之禮</mark></strong>、死人復活，以及永遠審判各等教訓。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L1-2">希 6:1-2</a>)</p></blockquote><h3>使徒們更看重口頭的相通</h3><blockquote><p>“我還有許多事要寫給你們，<strong><mark>卻不願意用紙墨寫出來</mark></strong>，但盼望到你們那裏與你們當面談論，使你們的喜樂滿足。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L12">約贰 1:12</a>)</p></blockquote><blockquote><p>“我原有許多事要寫給你；<strong><mark>卻不願意用筆墨寫給你</mark></strong>， 但盼望快快的見你，我們就當面談論。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3in/1/#L13-14">約叁 1:13-14</a>)</p></blockquote><h3>要保守的既有口頭的、也有書面的宣講</h3><p>使徒保羅請求保守聖傳（使徒的教導）——它們不只在書信裏、也在言語中領受：</p><blockquote><p>“所以弟兄們，你們要站立得穩，<strong><mark>凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><h3>使徒口頭宣講的長久</h3><h4>三年</h4><p>使徒保羅教導亞西亞的長老們三年之久，晝夜不住：</p><blockquote><p>“所以你們應當儆醒，記念我<strong><mark>三年之久晝夜不住的流淚，勸戒你們各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L31">徒 20:31</a>)</p></blockquote><h4>一年半</h4><p>在哥林多教導團體一年半：</p><blockquote><p>“這事以後，保羅離了雅典，來到哥林多。 &lt;…&gt; 保羅<strong><mark>在那裏住了一年零六個月</mark></strong>，<strong><mark>將上帝的道教訓他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/18/#L1,11">徒 18:1,11</a>)</p></blockquote><h4>兩年零兩個月</h4><p>在以弗所宣講：先在會堂裏三個月，然後與門徒在學房裏兩年：</p><blockquote><p>“保羅進會堂放膽講道，<strong><mark>一連三個月</mark></strong>，辯論上帝國的事，勸化衆人。 後來，有些人心裏剛硬不信，在衆人面前毀謗這道。保羅就離開他們，也叫門徒與他們分離，便在推喇奴的學房<strong><mark>天天辯論</mark></strong>。 <strong><mark>這樣有兩年之久</mark></strong>，叫一切住在亞西亞的，無論是猶太人，是希利尼人，都聽見主的道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L8-10">徒 19:8-10</a>)</p></blockquote><p>總計，僅使徒保羅一人就宣講了不少於30年：從他33-34年歸主，到64-67年去世。</p><h2>使徒們使用聖傳</h2><p>使徒說出兩個埃及術士的名字，聖經中沒有記載：</p><blockquote><p>“<strong><mark>從前雅尼和佯庇怎樣敵擋摩西</mark></strong>，這等人也怎樣敵擋真道。他們的心地壞了，在真道上是可廢棄的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L8">提後 3:8</a>)</p></blockquote><p>使徒猶大講到聖經中沒有記載的爭辯：</p><blockquote><p>“<strong><mark>天使長米迦勒爲摩西的屍首與魔鬼爭辯的時候</mark></strong>，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L9">猶 1:9</a>)</p></blockquote><p>關於以諾的話，聖經中沒有記載：</p><blockquote><p>“<strong><mark>亞當的七世孫以諾曾預言這些人說</mark></strong>：『<strong><mark>看哪，主帶著他的千萬聖者降臨</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L14">猶 1:14</a>)</p></blockquote><p>使徒保羅講到先知以賽亞藏在樹洞裏而被鋸死的事：</p><blockquote><p>“被石頭打死，<strong><mark>被鋸鋸死</mark></strong>，受試探，被刀殺，披著綿羊，山羊的皮各處奔跑，受窮乏、患難、苦害，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L37">希 11:37</a>)</p></blockquote><p>福音史家路加根據從目擊者聽來的話寫下福音，即寫下聖傳：</p><blockquote><p>“提阿非羅大人哪，有好些人提筆作書，述說在我們中間所成就的事，是<strong><mark>照傳道的人從起初親眼看見又傳給我們的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L1">路 1:1</a>) <em>(俄文原文引路加福音 1:2，和合本無第2節，其內容併入第1節)</em></p></blockquote><h3>傳達福音書中沒有的信息</h3><p>使徒保羅在對以弗所長老們的講話中指出基督救主的一個教導，福音書中沒有記載：</p><blockquote><p>“我凡事給你們作榜樣，叫你們知道應當這樣勞苦，扶助軟弱的人，又當記念主耶穌的話，說：『<strong><mark>施比受更爲有福</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L35">徒 20:35</a>)</p></blockquote><p>又講到復活基督向許多人顯現，這也是福音書中沒有記的：</p><blockquote><p>“後來<strong><mark>一時顯給五百多弟兄看</mark></strong>，其中一大半到如今還在，卻也有已經睡了的。 以後顯給雅各看，再顯給衆使徒看，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L6-7">林前 15:6-7</a>)</p></blockquote><h2>聖傳的重要性</h2><p>錯誤的教導不引人歸向上帝：</p><blockquote><p>“凡<strong><mark>越過基督的教訓不常守著的，就沒有上帝</mark></strong>；<strong><mark>常守這教訓的</mark></strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><p>異端（錯誤的教導）不能承受上帝的國：</p><blockquote><p>“拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L20-21">加 5:20-21</a>)</p></blockquote><h2>要遠離引入新教導的人</h2><blockquote><p>“<strong><mark>分門結黨的人</mark></strong>，警戒過一兩次，<strong><mark>就要棄絕他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L10">多 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>若有人傳異教</mark></strong>，不服從我們主耶穌基督純正的話與那合乎敬虔的道理， 他是自高自大，一無所知，<strong><mark>專好問難，爭辯言詞</mark></strong>，從此就生出嫉妒、紛爭、毀謗、妄疑， 並那壞了心術、失喪真理之人的爭競。他們以敬虔爲得利的門路。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L3-5">提前 6:3-5</a>) <em>(俄文原文6:5末有“要遠離這樣的人”一句，和合本無)</em></p></blockquote><blockquote><p>“提摩太啊，你要<strong><mark>保守所託付你的</mark></strong>，<strong><mark>躲避世俗的虛談</mark></strong>和那敵真道、似是而非的學問。 已經有人自稱有這學問，就偏離了真道。願恩惠常與你們同在。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L20-21">提前 6:20-21</a>)</p></blockquote><blockquote><p>“弟兄們，我們奉主耶穌基督的名吩咐你們：凡有弟兄不按規矩而行，<strong><mark>不遵守從我們所受的教訓</mark></strong>，<strong><mark>就當遠離他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L6">帖後 3:6</a>)</p></blockquote><blockquote><p>“若有人到你們那裏，不是傳這教訓，<strong><mark>不要接他到家裏</mark></strong>，也不要問他的安。 因爲問他安的就在他的惡行上有分。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L10-11">約贰 1:10-11</a>)</p></blockquote><blockquote><p>“弟兄們，<strong><mark>那些離間你們、叫你們跌倒</mark></strong>、背乎所學之道的人，我勸你們要留意躲避他們。 因爲這樣的人不服事我們的主基督，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><h2>必須敬禮聖人並跟隨他們</h2><blockquote><p>“<strong><mark>從前引導你們、傳上帝之道給你們的人，你們要想念他們</mark></strong>，<strong><mark>效法他們的信心</mark></strong>，留心看他們爲人的結局。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L7">希 13:7</a>)</p></blockquote><blockquote><p>“<strong><mark>所以，我求你們效法我</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L16">林前 4:16</a>)</p></blockquote><blockquote><p>“弟兄們，<strong><mark>你們要一同效法我</mark></strong>，<strong><mark>也當留意看那些照我們榜樣行的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L17">腓 3:17</a>)</p></blockquote><p>關於敬禮聖人的詳情：<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬禮聖人</a></p><h2>對批評的回應</h2><h3>“當求問律法和訓誨”（賽 8:20）</h3><p>爲“唯獨聖經”辯護的人引用舊約的這段引文：</p><blockquote><p>“有人對你們說：「<strong><mark>當求問那些交鬼的和行巫術的</mark></strong>，就是聲音綿蠻，言語微細的。」你們便回答說：「百姓不當求問自己的上帝嗎？豈可爲活人求問死人呢？」 <strong><mark>人當以訓誨和法度爲標準</mark></strong>，他們所說的若不與此相符，必不得見晨光。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/8/#L19-20">賽 8:19-20</a>)</p></blockquote><ol><li><p>這裏絲毫沒有說聖經高於聖傳。何況，在巫術與聖經之間當然要選擇聖經。這幾句話講的是把摩西五經（妥拉）和預言（先知們的話）與巫士和靈媒的話相比較——民中根本不應當有這樣的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/18/#L9-14">申 18:9-14</a>）。先知以賽亞建議把妥拉和先知的話作爲外在的工具，用以責備巫士，向民衆指明巫士所說的與上帝所說的之間的區別。</p></li><li><p>再者，在舊約時代，聖經原則上不可能與聖傳分離。沒有聖傳，不僅不可能正確理解它，甚至不可能正確誦讀它，因爲它只用輔音字母寫成（詳見<a href="https://bibleox.com/ru/ru/w/евангелисты-обращаются-к-Септуагинте">詳見</a>）。不知道讀音，同一個詞可以讀得不同。要正確誦讀這些話，就必須處於誦讀的傳統中；而這一傳統作爲聖傳由祖先傳給後代。所以一切關於聖經的話都與聖傳不可分。</p></li><li><p>應當提醒對手他們自己的論題——“唯獨聖經”堅持“唯獨”（Sola）一詞，即只有聖經是最高權威。然而在所引的引文裏，沒有聖經權威的這種獨一性，沒有“唯獨”一詞（或類似的話）——而這正是“唯獨聖經”擁護者想看見的。如果僅以沒有直接提到聖傳爲理由就把“唯獨”加在這裏，那就應當一貫地承認：在另一些類似的引文裏是在提議“只按聖傳”建立信仰，因爲那裏沒有提到聖經：</p></li></ol><blockquote><p>“<strong><mark>你從我聽的那純正話語的規模</mark></strong>，要用在基督耶穌裏的信心和愛心，常常守著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L13">提後 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><p>遵行所聽見的聖傳，不僅使人能分辨正確與錯誤，還能——無窮得多——使人住在上帝裏面：</p><blockquote><p>“論到你們，<strong><mark>務要將那從起初所聽見的常存在心裏</mark></strong>。<strong><mark>若將從起初所聽見的存在心裏，你們就必住在子裏面，也必住在父裏面</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L24">約壹 2:24</a>)</p></blockquote><p>甚至主耶穌基督自己也召呼人保守所聽見的——當時幾乎全部新約聖經都已寫成：</p><blockquote><p>“<strong><mark>所以要回想你是怎樣領受、怎樣聽見的</mark></strong>，<strong><mark>又要遵守</mark></strong>，並要悔改。若不儆醒，我必臨到你那裏，如同賊一樣；我幾時臨到，你也決不能知道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L3">啟 3:3</a>)</p></blockquote><p>這是否意味著主和使徒們教導“唯獨聖傳”？要知道，寫下了聖經的他們，在這裏甚至沒有提到聖經，而是要求遵行聖傳。</p><p>只拿這些經文，教會的反對者也可以用完全相同的方式發明相反的極端——論題“唯獨聖傳”。但他們沒有領受使徒的聖傳——他們在使徒之後十五個多世紀纔出現；因爲沒有維護聖傳的目標，他們也不引出關於聖傳的這類極端。而教會從使徒們領受了聖傳和聖經兩者，既不擯棄這一個，也不擯棄那一個，也不擯棄使徒們關於保守口傳聖傳的誡命，認爲聖經和聖傳同是真實的。</p><h3>“不可越過聖經所寫的”（林前 4:6）</h3><blockquote><p>“弟兄們，我爲你們的緣故，拿這些事轉比自己和亞波羅，叫你們效法我們不可過於聖經所記，<strong><mark>免得你們自高自大</mark></strong>，<strong><mark>貴重這個，輕看那個</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L6">林前 4:6</a>)</p></blockquote><p>這裏說的是某部寫下的文本，人應當據此明白：不可彼此自高。這裏說的是哪個文本？是同一封書信的前一章，其中講授了關於對自己看法要低的功課。使徒提議從他們學習不彼此自高、不越過剛寫下的內容去推想。</p><p>這封書信是因爲哥林多團體中產生的分裂而寫的。整個第2章使徒貶低自己和亞波羅的意義，高舉基督，爲要阻止哥林多教會分結成“屬保羅的”和“屬亞波羅的”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L4-7">林前 3:4-7</a>），阻止教會分成黨派。分裂的人不同的不是教訓（否則使徒就會說教訓），而是彼此的態度。他們按教會教師的名字分派系。彷彿教會中的每個人都應當只與在同一教師門下學習的人相通，而擯棄其他教會教師的學生。爲改正這種錯誤的思維，使徒貶低了那些結成派系的名字的意義——即貶低自己和亞波羅，高舉基督。</p><p>稍下一點，在總結所說的話時，使徒用別的話講同一件事，呼召人跟隨的已不是寫下的，而是他自己：</p><blockquote><p>“<strong><mark>所以，我求你們效法我</mark></strong>。 <strong><mark>因此我已打發提摩太到你們那裏去</mark></strong>；他在主裏面，是我所親愛、有忠心的兒子。他必提醒你們，記念我在基督裏怎樣行事，在各處各教會中怎樣教導人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L16-17">林前 4:16-17</a>)</p></blockquote><p>這樣，引文所說的是：基督徒不應當越過使徒所寫下的榜樣去推想自己，而應當聽從對自己看法要低的呼召，不彼此自高、不分裂。</p><p>在這封書信裏使徒誇獎哥林多人保守聖傳：</p><blockquote><p>“我稱讚你們，因你們凡事記念我，<strong><mark>又堅守我所傳給你們的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><p>並說哥林多人若持守所傳的，就得救：</p><blockquote><p>“弟兄們，我如今把先前所傳給你們的福音，告訴你們知道。這福音你們也領受了，又靠著站立得住； 並且你們若不是徒然相信，<strong><mark>能以持守我所傳給你們的</mark></strong>，就必因這福音得救。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><p>還有許多關於口傳聖傳的別的話，前文已提過。舉出其中一部分：</p><blockquote><p>“<strong><mark>你從我聽的那純正話語的規模</mark></strong>，要用在基督耶穌裏的信心和愛心，常常守著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L13">提後 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><blockquote><p>“論到你們，<strong><mark>務要將那從起初所聽見的常存在心裏</mark></strong>。<strong><mark>若將從起初所聽見的存在心裏</mark></strong>，你們就必住在子裏面，也必住在父裏面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L24">約壹 2:24</a>)</p></blockquote><h3>“連使徒和天使若傳別的，也不要聽？”</h3><p>從“唯獨聖經”的擁護者那裏可以聽到這樣的論據：使徒把自己的書信放在他自己、甚至上帝的天使之上。他們引用這行經文：</p><blockquote><p>“但無論是我們，是天上來的使者，若傳福音給你們，<strong><mark>與我們所傳給你們的不同，他就應當被咒詛</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L8">加 1:8</a>)</p></blockquote><p>使徒這裏說的不是自己，而是指那些彷彿以使徒們的名義寄給團體的假書信：</p><blockquote><p>“我勸你們：無論有靈、有言語、<strong><mark>有冒我名的書信</mark></strong>，<strong><mark>說主的日子現在到了</mark></strong>，<strong><mark>不要輕易動心</mark></strong>，<strong><mark>也不要驚慌</mark></strong>。 人不拘用什麼法子，你們總不要被他誘惑！因爲那日子以前，必有離道反教的事，<strong><mark>並有那大罪人</mark></strong>，就是沉淪之子，顯露出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L2-3">帖後 2:2-3</a>)</p></blockquote><p>他也教導不要聽那些人的“啟示”——他們虛假地宣稱自己說天使的語言、彷彿由天使說預言。</p><p>怎麼確定書信不是來自使徒、啟示不是來自天使？其中傳達的是另一種信仰——不是使徒們一次所傳的。當然，使徒並不試圖奪走上帝賜給使徒的權柄。前面的話，以及整封書信，都是針對起來教導人的教師們寫的——他們把加拉太人誘向猶太教。</p><blockquote><p>“<strong><mark>無知的加拉太人哪</mark></strong>，耶穌基督釘十字架，已經活畫在你們眼前，<strong><mark>誰又迷惑了你們呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L1">加 3:1</a>)</p></blockquote><blockquote><p>“<strong><mark>我爲你們害怕</mark></strong>，惟恐我在你們身上是枉費了工夫。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L11">加 4:11</a>)</p></blockquote><blockquote><p>“<strong><mark>你們向來跑得好</mark></strong>，<strong><mark>有誰攔阻你們</mark></strong>，叫你們不順從真理呢？ &lt;…&gt; <strong><mark>恨不得那攪亂你們的人</mark></strong>，把自己割絕了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L7,12">加 5:7,12</a>)</p></blockquote><p>使徒的意圖——是保護自己的羊羣脫離假教師，而不是脫離他自己，更不是脫離上帝的天使。聖天使不可能把上帝的教會——他們所事奉的上帝的教會——從真道路上誘離。使徒只是清楚地表明：應當持守那一次由他所傳的信仰；而誰不這樣教導，哪怕他裝作使徒、或裝扮成上帝的天使，也不應當接受。</p><p>---</p><p>在這一引文裏有三層意義：</p><ol><li><p>我（μετεσχημάτισα）把對自己和亞波羅的描繪成另一種樣子，爲了（ἵνα）；</p></li><li><p>你們從我們學習不越過剛寫下的〔前一章〕去推想（ἵνα）；</p></li><li><p>不彼此自高。</p></li></ol><p>使徒在哪裏把自己和亞波羅描繪成不高於其他弟兄的？前一章：</p><blockquote><p>“<strong><mark>有說：「我是屬保羅的。」</mark></strong>有說：「我是屬亞波羅的。」這豈不是你們和世人一樣嗎？ <strong><mark>亞波羅算什麼</mark></strong>？保羅算什麼？無非是執事，照主所賜給他們各人的，引導你們相信。 <strong><mark>我栽種了，亞波羅澆灌了</mark></strong>，<strong><mark>惟有上帝叫他生長</mark></strong>。 可見<strong><mark>栽種的算不得什麼，澆灌的也算不得什麼</mark></strong>，只在那叫他生長的上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L4-7">林前 3:4-7</a>)</p></blockquote><p>使徒在另一封書信裏也這樣說，呼召人同心：</p><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，<strong><mark>不要志氣高大</mark></strong>，倒要俯就卑微的人。<strong><mark>不要自以爲聰明</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L16">羅 12:16</a>)</p></blockquote><p>救主也教導這一點：</p><blockquote><p>“<strong><mark>凡自高的，必降爲卑</mark></strong>；<strong><mark>自卑的，必升爲高</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L12">太 23:12</a>)</p></blockquote><blockquote><p>“只是在你們中間，不是這樣。你們中間，<strong><mark>誰願爲大，就必作你們的用人</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L43">可 10:43</a>)</p></blockquote><p>這樣，使徒只是呼召人謙卑與合一，引用先前所寫的關於自己和亞波羅的話。</p><p>在這封書信裏使徒誇獎哥林多人保守聖傳：</p><blockquote><p>“我稱讚你們，因你們凡事記念我，<strong><mark>又堅守我所傳給你們的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><p>並說哥林多人若持守所傳的，就得救：</p><blockquote><p>“弟兄們，我如今把先前所傳給你們的福音，告訴你們知道。這福音你們也領受了，又靠著站立得住； 並且你們若不是徒然相信，<strong><mark>能以持守我所傳給你們的</mark></strong>，就必因這福音得救。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><p>還有許多別的關於口傳聖傳的話，前文已提過。舉出其中一部分：</p><blockquote><p>“<strong><mark>你從我聽的那純正話語的規模</mark></strong>，要用在基督耶穌裏的信心和愛心，常常守著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L13">提後 1:13</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><blockquote><p>“論到你們，<strong><mark>務要將那從起初所聽見的常存在心裏</mark></strong>。<strong><mark>若將從起初所聽見的存在心裏</mark></strong>，你們就必住在子裏面，也必住在父裏面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L24">約壹 2:24</a>)</p></blockquote><h2>結論</h2><p>爲維護“唯獨聖經”的論題使用這樣的手法：既然沒有關於“唯獨聖經”的明確引文，就展示關於聖經之重要性的引文，而對關於聖傳之重要性的引文忽略並緘默。這樣，聽衆應當覺得彷彿只有聖經纔有重要性。</p><p>新教徒常責備正教徒說：</p><p>——只要在聖經裏指出哪裏寫著要敬禮聖像、向聖人祈禱等等。</p><p>我們指出，但對他們說：</p><p>——聖傳也是重要的，這連聖經也證實。</p><p>於是他們說：</p><p>——不，只有聖經重要。</p><p>這時我們就請他們：</p><p>——那就請在聖經裏指出：只有聖經重要，或聖經比聖傳更重要。</p><p>他們無法指出這樣的話，因爲聖經裏沒有這樣的字句。要求我們出示關於聖像、關於向聖人祈禱的話，他們卻拿不出完全相同的一句話來證明一切都應當只在聖經裏。他們不能符合自己向別人提出的要求，表現出雙重標準。</p><p>這東西是他們自己發明的；他們自己要求我們把一切都指給他看，而自己卻不能在聖經裏指出自己的原則。</p><p>這樣，“唯獨聖經”的論題自相矛盾，並沒有使發明它的人達到使徒的信仰；相反，它使人遠離目標，而生出了衆多的傳統和分裂。</p>
