  title: 聖餐禮（領受聖體）
  copy_cover: true
  body: <h2>聖餐聖奧祕的設立</h2><p>主上帝耶穌基督在錫安的樓房裏設立聖餐聖奧祕，他只聚集了十二使徒在那裏：</p><blockquote><p>“他們吃的時候，耶穌拿起餅來，祝福，就擘開遞給門徒，說：「<strong><mark>你們拿著吃，這是我的身體</mark></strong>。」 又拿起杯來，祝謝了，遞給他們，說：「你們都喝這個， <strong><mark>因爲這是我立約的血，爲多人流出來，使罪得赦</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><p>同樣見：<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L22-24">可 14:22-24</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19-20">路 22:19-20</a></p><p>使徒保羅——他是在救主復活之後才成爲使徒的——是復活的主耶穌基督親自單獨教導他舉行聖餐的：</p><blockquote><p>“<strong><mark>我當日傳給你們的，原是從主領受的</mark></strong>，就是主耶穌被賣的那一夜，拿起餅來， 祝謝了，就擘開，說，「<strong><mark>這是我的身體，爲你們舍的</mark></strong>。你們應當如此行，爲的是記念我。」 飯後，也照樣拿起杯來，說：「<strong><mark>這杯是用我的血所立的新約</mark></strong>。你們每逢喝的時候，要如此行，爲的是記念我。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L23-25">林前 11:23-25</a>)</p></blockquote><h2>藉聖餐聯合於同一個身體</h2><blockquote><p>“耶穌說：「我實實在在的告訴你們，你們若不吃人子的肉，不喝人子的血，就沒有生命在你們裏面； 吃我肉、喝我血的人就有永生，在末日我要叫他復活。 我的肉真是可吃的，我的血真是可喝的。 <strong><mark>吃我肉、喝我血的人，常在我裏面，我也常在他裏面</mark></strong>。 永活的父怎樣差我來，我又因父活著；照樣，<strong><mark>吃我肉的人也要因我活著</mark></strong>。 這就是從天上降下來的糧。吃這糧的人，就永遠活著，不像你們的祖宗吃過嗎哪還是死了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L53-58">約 6:53-58</a>)</p></blockquote><p>參與聖餐聖奧祕的人真實地（實際上）在基督的身體裏與基督彼此聯合：</p><blockquote><p>“我們所祝福的杯，豈不是<strong><mark>同領基督的血</mark></strong>嗎？我們所擘開的餅，豈不是<strong><mark>同領基督的身體</mark></strong>嗎？ <strong><mark>我們雖多，仍是一個餅、一個身體，因爲我們都是分受這一個餅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><blockquote><p>“<strong><mark>你們就是基督的身子</mark></strong>，並且各自作肢體。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“你們從前遠離上帝的人，如今卻在基督耶穌裏，<strong><mark>靠著他的血，已經得親近了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L13">弗 2:13</a>)</p></blockquote><blockquote><p>“<strong><mark>因我們是他身上的肢體</mark></strong>〔有古卷在此有『就是他的骨、他的肉』〕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L30">弗 5:30</a>)</p></blockquote><p>詳見：<a href="https://bibleox.com/ru/ru/w/Церковь#HH-Определение-Церковь--Тело-Христово">與基督聯合，加入他的身體（教會）</a></p><h2>不參與聖餐就不能得救</h2><blockquote><p>“耶穌說：「我實實在在的告訴你們，<strong><mark>你們若不吃人子的肉，不喝人子的血，就沒有生命在你們裏面</mark></strong>； 吃我肉、喝我血的人就有永生，<strong><mark>在末日我要叫他復活</mark></strong>。 <strong><mark>我的肉真是可吃的，我的血真是可喝的</mark></strong>。 吃我肉、喝我血的人，常在我裏面，我也常在他裏面。 永活的父怎樣差我來，我又因父活著；照樣，吃我肉的人也要因我活著。 這就是從天上降下來的糧。吃這糧的人，就永遠活著，<strong><mark>不像你們的祖宗吃過嗎哪還是死了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L53-58">約 6:53-58</a>)</p></blockquote><p>藉聖餐人與基督聯合，而基督是身體的救主：</p><blockquote><p>“基督是教會的頭，他又是<strong><mark>教會全體的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>)</p></blockquote><h2>聖奧祕中是救主真實的體和血</h2><h3>餅——基督將爲世人的生命而捨去的肉</h3><p>在聖餐中，信徒領受耶穌基督真實的（真正的）體和真實的血——他爲世人的生命而捨棄它們，把自己作爲祭物獻在十字架上：</p><blockquote><p>“我就是生命的糧。 你們的祖宗在曠野吃過嗎哪，還是死了。 這是從天上降下來的糧，叫人喫了就不死。 我是從天上降下來生命的糧，人若吃這糧就必永遠活著；<strong><mark>我所要賜的糧就是我的肉，爲世人之生命所賜的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L48-51">約 6:48-51</a>)</p></blockquote><p>這裏主直接宣告：這從天降下的糧就是他的肉——這肉他<strong>現在</strong>就有，並且<strong>將來</strong>要爲世人的生命而捨去。這裏只是應許。此刻他還沒有舍這肉。教導他已經賜下，而在將來，他要交付於死刑的不是教導、不是象徵、不是紀念，而是他真實的肉。正是他的肉纔是那從天降下的糧——他在聖餐聖奧祕中以餅和酒的形式分給門徒吃。</p><h3>立約的血——至聖的聖物</h3><p>凡不把立約的血當作聖物的人，就要受極重的刑罰——他以此羞辱施恩的聖靈：</p><blockquote><p>“人干犯摩西的律法，憑兩三個見證人尚且不得憐恤而死； <strong><mark>何況人踐踏上帝的兒子</mark></strong>，<strong><mark>將那使他成聖之約的血當作平常，又褻慢施恩的聖靈</mark></strong>，你們想，他要受的刑罰該怎樣加重呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L28-29">希 10:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>凡褻瀆聖靈的，卻永不得赦免</mark></strong>，<strong><mark>乃要擔當永遠的罪</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/3/#L29">可 3:29</a>)</p></blockquote><h3>人子的肉</h3><p>講到聖餐時，基督特別強調他的人性：</p><blockquote><p>“耶穌說：「我實實在在的告訴你們，<strong><mark>你們若不吃人子的肉</mark></strong>，不喝人子的血，就沒有生命在你們裏面；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L53">約 6:53</a>)</p></blockquote><h3>不按理領受者的疾病與死亡</h3><p>領受之前必須省察。不按理領受的人有罪、生病、甚至死亡：</p><blockquote><p>“所以，無論何人不按理吃主的餅、喝主的杯，<strong><mark>就是干犯主的身、主的血了</mark></strong>。 人應當自己省察，然後吃這餅、喝這杯。 因爲人吃喝，若不分辨是主的身體，<strong><mark>就是吃喝自己的罪了</mark></strong>。 <strong><mark>因此，在你們中間有好些軟弱的與患病的，死的也不少</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L27-30">林前 11:27-30</a>)</p></blockquote><h2>領受聖奧祕必須預備</h2><blockquote><p>“<strong><mark>人應當自己省察，然後吃這餅、喝這杯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L28">林前 11:28</a>)</p></blockquote><h2>在教會裏，領聖體的聖奧祕將一直舉行到耶穌基督再來</h2><blockquote><p>“你們每逢吃這餅，喝這杯，是表明主的死，<strong><mark>直等到他來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L26">林前 11:26</a>)</p></blockquote><h2>聖餐的舊約預表</h2><h3>逾越節的羔羊</h3><p>無殘疾的（一歲的、沒有缺陷的）公羔羊應當真實地<strong>死</strong>，爲人的罪；然後真實地被<strong>吃掉</strong>，全部吃完。基督是羔羊，字面地應驗了這一預表的兩部分：</p><ul><li><p>他真實地（不是象徵地）爲人的罪而死；</p></li><li><p>他真實地（不是象徵地）被吃。</p></li></ul><blockquote><p>“你們吩咐以色列全會衆說，本月初十日，<strong><mark>各人要按著父家取羊羔</mark></strong>，一家一隻。 &lt;…&gt; <strong><mark>要無殘疾、一歲的公羊羔</mark></strong>，你們或從綿羊裏取，或從山羊裏取，都可以。 要留到本月十四日，在黃昏的時候，<strong><mark>以色列全會衆把羊羔宰了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L3,5-6">出 12:3,5-6</a>)</p></blockquote><blockquote><p>“於是，摩西召了以色列的衆長老來，對他們說：「你們要按著家口取出羊羔，<strong><mark>把這逾越節的羊羔宰了</mark></strong>。 拿一把牛膝草，蘸盆裏的血，<strong><mark>打在門楣上和左右的門框上</mark></strong>。你們誰也不可出自己的房門，直到早晨。 &lt;…&gt; 日後，你們到了耶和華按著所應許賜給你們的那地，<strong><mark>就要守這禮</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L21-22,25">出 12:21-22,25</a>)</p></blockquote><blockquote><p>“<strong><mark>哪知他爲我們的過犯受害</mark></strong>，爲我們的罪孽壓傷。<strong><mark>因他受的刑罰，我們得平安</mark></strong>；因他受的鞭傷，我們得醫治。 我們都如羊走迷，各人偏行己路。<strong><mark>耶和華使我們衆人的罪孽都歸在他身上</mark></strong>。 他被欺壓，在受苦的時候卻不開口。<strong><mark>他像羊羔被牽到宰殺之地</mark></strong>，又像羊在剪毛的人手下無聲，他也是這樣不開口。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/53/#L5-7">賽 53:5-7</a>)</p></blockquote><blockquote><p>“他所念的那段經，說：『<strong><mark>他像羊被牽到宰殺之地</mark></strong>，又像羊羔在剪毛的人手下無聲，他也是這樣不開口。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L32">徒 8:32</a>)</p></blockquote><blockquote><p>“<strong><mark>我卻像柔順的羊羔被牽到宰殺之地</mark></strong>。我並不知道他們設計謀害我說：「我們把樹連果子都滅了吧！將他從活人之地剪除，使他的名不再被記念。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/11/#L19">耶 11:19</a>)</p></blockquote><blockquote><p>“次日，約翰看見耶穌來到他那裏，就說：「<strong><mark>看哪！上帝的羔羊，除去世人罪孽的</mark></strong>。 &lt;…&gt; 他見耶穌行走，就說：「<strong><mark>看哪！這是上帝的羔羊</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L29,36">約 1:29,36</a>)</p></blockquote><blockquote><p>“知道你們得贖、脫去你們祖宗所傳流虛妄的行爲，不是憑著能壞的金銀等物， <strong><mark>乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L18-19">彼前 1:18-19</a>)</p></blockquote><blockquote><p>“大聲說：「<strong><mark>曾被殺的羔羊</mark></strong>，是配得權柄、豐富、智慧、能力、尊貴、榮耀、頌讚的！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/5/#L12">啟 5:12</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲寶座中的羔羊必牧養他們</mark></strong>，領他們到生命水的泉源；上帝也必擦去他們一切的眼淚。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/7/#L17">啟 7:17</a>)</p></blockquote><blockquote><p>“我又觀看，<strong><mark>見羔羊站在錫安山</mark></strong>，同他又有十四萬四千人，都有他的名和他父的名寫在額上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1">啟 14:1</a>)</p></blockquote><h3>嗎哪</h3><p>曠野中的嗎哪，它供養以色列民從埃及的奴役走向應許之地的路上的力量。嗎哪在曠野裏是真實地被吃的。它真實地保護人不至死亡、賜人生命（曠野裏沒有別的食物）：</p><blockquote><p>“耶和華對摩西說：「<strong><mark>我要將糧食從天降給你們</mark></strong>。百姓可以出去，<strong><mark>每天收每天的分</mark></strong>，我好試驗他們遵不遵我的法度。 &lt;…&gt; 這食物，<strong><mark>以色列家叫嗎哪</mark></strong>，樣子像芫荽子，顏色是白的，滋味如同攙蜜的薄餅。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/16/#L4,31">出 16:4,31</a>)</p></blockquote><blockquote><p>“夜間露水降在營中，<strong><mark>嗎哪也隨著降下</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/11/#L9">民 11:9</a>)</p></blockquote><p>因爲嗎哪隻是預像、是將來之事的影子，而不是實物本身，所以它沒有賜下永恆的生命，只是延長地上的生命、使人免於餓死；最終那些猶太人還是死了，正如人都死一樣。但基督說，吃他的必永遠活著：</p><blockquote><p>“<strong><mark>我們的祖宗在曠野吃過嗎哪</mark></strong>，如經上寫著說：『他從天上賜下糧來給他們吃。』」 耶穌說：「我實實在在的告訴你們，那從天上來的糧不是摩西賜給你們的，<strong><mark>乃是我父將天上來的真糧賜給你們</mark></strong>。 因爲，<strong><mark>上帝的糧就是那從天上降下來賜生命給世界的</mark></strong>。」 &lt;…&gt; 耶穌說：「<strong><mark>我就是生命的糧</mark></strong>。到我這裏來的，必定不餓；信我的，永遠不渴。 &lt;…&gt; 我就是生命的糧。 <strong><mark>你們的祖宗在曠野吃過嗎哪，還是死了</mark></strong>。 這是從天上降下來的糧，<strong><mark>叫人喫了就不死</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L31-33,35,48-50">約 6:31-33,35,48-50</a>)</p></blockquote><blockquote><p>“<strong><mark>吃我肉、喝我血的人就有永生</mark></strong>，在末日我要叫他復活。 我的肉真是可吃的，我的血真是可喝的。 &lt;…&gt; 永活的父怎樣差我來，我又因父活著；照樣，<strong><mark>吃我肉的人也要因我活著</mark></strong>。 這就是從天上降下來的糧。吃這糧的人，就永遠活著，<strong><mark>不像你們的祖宗吃過嗎哪還是死了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L54-55,57-58">約 6:54-55,57-58</a>)</p></blockquote><p>再者，如果把猶太人從埃及的奴役到應許之地的整個路程看作基督徒從罪的奴役到天國的路程，那麼嗎哪在這裏也字面地指向聖餐：</p><ul><li><p>真實的埃及奴役——真實的罪的奴役。</p></li><li><p>真實地走海牀脫離奴役——真實的洗禮（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L2">林前 10:2</a>）。</p></li><li><p>真實的四十年曠野漂泊——教會中真實的今生。</p></li><li><p>真實的嗎哪和水——上帝所賜救主真實的體和血。</p></li><li><p>真實地應許給猶太人的土地——真實的國，只是如今不是地上的，而是天上的。</p></li></ul><h3>米利巴的甜水</h3><blockquote><p>“摩西領以色列人從紅海往前行，到了書珥的曠野。在曠野走了三天，找不著水。 到了瑪拉，不能喝那裏的水，因爲水苦，所以那地名叫瑪拉。 百姓就向摩西發怨言，說：「我們喝什麼呢？」 摩西呼求耶和華，<strong><mark>耶和華指示他一棵樹</mark></strong>，他把樹丟在水裏，<strong><mark>水就變甜了</mark></strong>。耶和華在那裏爲他們定了律例、典章，在那裏試驗他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/15/#L22-25">出 15:22-25</a>)</p></blockquote><h3>用羔羊的血塗抹房屋的入口</h3><p>用血塗抹入口救人不死：</p><blockquote><p>“各家要取點血，<strong><mark>塗在吃羊羔的房屋左右的門框上和門楣上</mark></strong>。 &lt;…&gt; 拿一把牛膝草，蘸盆裏的血，<strong><mark>打在門楣上和左右的門框上</mark></strong>。你們誰也不可出自己的房門，直到早晨。 因爲耶和華要巡行擊殺埃及人，他看見血在門楣上，和左右的門框上，<strong><mark>就必越過那門</mark></strong>，不容滅命的進你們的房屋，擊殺你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L7,22-23">出 12:7,22-23</a>)</p></blockquote><h3>從祭壇上取下的、潔淨罪的炭</h3><p>先知以賽亞的罪，因燒著的炭觸到他的口而被潔淨——炭是用火剪從祭壇上取下來的：</p><blockquote><p>“那時我說：「禍哉！我滅亡了！因爲<strong><mark>我是嘴脣不潔的人</mark></strong>，又住在嘴脣不潔的民中；又因我眼見大君王萬軍之耶和華。」 有一撒拉弗飛到我跟前，<strong><mark>手裏拿著紅炭，是用火剪從壇上取下來的</mark></strong>， 將炭沾我的口說：「看哪，這炭沾了你的嘴，<strong><mark>你的罪孽便除掉，你的罪惡就赦免了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/6/#L5-7">賽 6:5-7</a>)</p></blockquote><h3>吃樹上的果子</h3><p>人類真實地喫了樹上的果子而遠離上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L6">創 3:6</a>）；人類也照樣藉吃十字架之樹的果子歸向上帝。人藉不順服之樹遠離上帝，又藉十字架順服之樹歸回（<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L8">腓 2:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L24">太 16:24</a>）。那樹上的果子奪去生命，而這樹上的果子使人歸回生命。人從哪扇門出去，就從哪扇門進來。那時主說：“不可吃”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L17">創 2:17</a>）——他們喫了。如今他說“拿著吃”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26">太 26:26</a>）——許多人犯著從前同樣的錯誤，只是反過來——不吃。雖然那時和現在，遵守這誡命都不難：</p><blockquote><p>“惟有園當中那棵樹上的果子，上帝曾說：『<strong><mark>你們不可吃，也不可摸，免得你們死</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L3">創 3:3</a>)</p></blockquote><blockquote><p>“只是分別善惡樹上的果子，<strong><mark>你不可吃，因爲你吃的日子必定死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L17">創 2:17</a>)</p></blockquote><blockquote><p>“他們吃的時候，耶穌拿起餅來，祝福，就擘開遞給門徒，說：「<strong><mark>你們拿著吃，這是我的身體</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26">太 26:26</a>)</p></blockquote><blockquote><p>“這就是從天上降下來的糧。<strong><mark>吃這糧的人，就永遠活著</mark></strong>，不像你們的祖宗吃過嗎哪還是死了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L58">約 6:58</a>)</p></blockquote><h3>感恩的平安祭</h3><p>舊約裏有兩類平安祭：</p><ul><li><p><strong>讚美</strong>祭（תודה，todah）；</p></li><li><p><strong>感恩</strong>祭（或救恩祭）（שלמים shelamim 或 נדר neder）。</p></li></ul><p>平安祭包括獻餅和牲祭。<strong>讚美</strong>的平安祭用無酵餅獻上，而若另外還獻<strong>感恩</strong>的平安祭，則用有酵餅獻上：</p><blockquote><p>“<strong><mark>要用有酵的餅和爲感謝獻的平安祭</mark></strong>，與供物一同獻上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/7/#L13">利 7:13</a>)</p></blockquote><p>在新約裏，向上帝獻餅的聖奧祕稱爲<strong>“聖餐禮”（感恩祭，希臘文——感恩）</strong>，因爲基督自己在分給門徒之前<strong>祝謝了</strong>上帝並祝福了餅（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19">路 22:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L23-24">林前 11:23-24</a>）。</p><p>就是說，在正教會的聖餐禮中，今天字面地行的正是這些：</p><ul><li><p>取有酵的餅；</p></li><li><p>獻上感恩；</p></li><li><p>只是不與它一同獻上祭牲，因爲祭物、羔羊、逾越節——是被釘死又復活的基督。</p></li></ul><p>要注意，無酵餅稱爲困苦餅（“ἄζυμα, ἄρτον κακώσεως”，<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L3">申 16:3</a>），而有酵餅的平安祭稱爲感恩祭或救恩祭（תֹּודַ֥ת——感恩，σωτηρίου——救恩，<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/7/#L13">利 7:13</a>）。</p><p>*注：* *祭牲的肉或者當天吃掉、不留到早晨（如逾越節），或者可以吃兩天，但嚴格禁止留到第三天。若沒有在第三天之前吃完，剩餘的就要用火焚燒，否則祭物就被上帝拒絕，成爲玷污和罪。這把我們引向救主的復活——第三天墳墓空了。就是說，在這裏有酵餅屬於新約——救主的復活。*</p><h2>物件本質的改變</h2><ul><li><p>杖變爲蛇，又變回杖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/4/#L3-4">出 4:3-4</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/7/#L9-10,15">出 7:9-10,15</a>）；</p></li><li><p>水變爲血（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/7/#L17,19-21">出 7:17,19-21</a>）；</p></li><li><p>水變爲酒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L7-10">約 2:7-10</a>）。</p></li></ul><h2>對餅和酒的祝福</h2><p>那位非物質的上帝——他從前從無中創造了宇宙，安排了普世的洪水，使太陽停住，在任何地方奇妙地賜下不同的食物和水，分開江河和海洋，多次改變物件的本質（杖、水），他自己成爲物質的（道成肉身），以自己的祝福使餅和魚增多（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/14/#L15-21">太 14:15-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/15/#L32-38">太 15:32-38</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L35-44">可 6:35-44</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/8/#L1-9">可 8:1-9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L12-17">路 9:12-17</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L5-13">約 6:5-13</a>），爲生來瞎眼的造了眼睛，使腐爛的肉身復原——在與門徒的逾越節晚餐上，不只是分了餅和酒，而是祈禱之後<strong>祝福了它們</strong>，稱它們爲自己的體和血：</p><blockquote><p>“他們吃的時候，耶穌拿起餅來，<strong><mark>祝福，就擘開遞給門徒</mark></strong>，說：「<strong><mark>你們拿著吃，這是我的身體</mark></strong>。」 <strong><mark>又拿起杯來，祝謝了</mark></strong>，遞給他們，說：「你們都喝這個， 因爲這是我立約的血，爲多人流出來，使罪得赦。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><p>不能把這祝福理解爲無足輕重的空話。</p><h2>舊約中關於聖餐的預言</h2><blockquote><p>“<strong><mark>智慧建造房屋</mark></strong>，鑿成七根柱子， <strong><mark>宰殺牲畜，調和旨酒，設擺筵席</mark></strong>。 打發使女出去，自己在城中至高處呼叫， 說：「誰是愚蒙人，可以轉到這裏來！」又對那無知的人說： 「<strong><mark>你們來，吃我的餅，喝我調和的酒</mark></strong>。 你們愚蒙人，要捨棄愚蒙，就得存活，並要走光明的道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/9/#L1-6">箴 9:1-6</a>)</p></blockquote><blockquote><p>“「<strong><mark>你們一切幹渴的都當就近水來</mark></strong>，沒有銀錢的也可以來。你們都來，<strong><mark>買了吃</mark></strong>，不用銀錢，不用價值，也來買酒和奶。 你們爲何花錢買那不足爲食物的，用勞碌得來的買那不使人飽足的呢？你們要留意聽我的話，就能吃那美物，得享肥甘，心中喜樂。 你們當就近我來，側耳而聽，就必得活。<strong><mark>我必與你們立永約</mark></strong>，就是應許大衛那可靠的恩典。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/55/#L1-3">賽 55:1-3</a>)</p></blockquote><blockquote><p>“<strong>智慧要稱揚自己</strong>，因天主而受光榮，在她的民族中，要取得榮耀。 <…> <strong>凡渴望我的，請到我這裏來，飽食我的果實。</strong> <…> <strong>凡食我的，還要飢餓；凡飲我的，還要飢渴。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/24/#L1,26,29">德 24:1,26,29</a>)</p></blockquote><h2>對異議的回應</h2><h3>“基督把自己比作門，是比喻？”</h3><p>與民衆交談時，基督把自己比作羊圈的門：</p><blockquote><p>“所以耶穌又對他們說：「我實實在在的告訴你們，<strong><mark>我就是羊的門</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L7">約 10:7</a>)</p></blockquote><p>既然基督在這裏比喻地稱自己爲門，那麼是否意味著聖餐中關於體和血的話也應當比喻地理解？完全不是。在與門比較之前，救主講了牧人從門進羊圈、而賊從別處爬進去的比喻。把自己比作門，救主只是結束這個比喻，向民衆解釋它。基督對民衆總是用比喻講話，而與門徒單獨在一起時則解釋一切：</p><blockquote><p>“門徒進前來，問耶穌說：「<strong><mark>對衆人講話爲什麼用比喻呢</mark></strong>？」 耶穌回答說：「<strong><mark>因爲天國的奧祕，只叫你們知道，不叫他們知道</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L10-11">太 13:10-11</a>)</p></blockquote><blockquote><p>“<strong><mark>所以我用比喻對他們講</mark></strong>，是因他們看也看不見，聽也聽不見，也不明白。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L13">太 13:13</a>)</p></blockquote><blockquote><p>“耶穌對他們說：「上帝國的奧祕，只叫你們知道，<strong><mark>若是對外人講，凡事就用比喻</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/4/#L11">可 4:11</a>)</p></blockquote><blockquote><p>“耶穌用許多這樣的比喻，照他們所能聽的，對他們講道。 <strong><mark>若不用比喻，就不對他們講</mark></strong>，<strong><mark>沒有人的時候，就把一切的道講給門徒聽</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/4/#L33-34">可 4:33-34</a>)</p></blockquote><p>在錫安的樓房裏<strong>與門徒單獨在一起</strong>講聖餐時，基督沒有附加任何比喻，更沒有關於體和血的比喻——就是說，基督是按字面講的，而不是比喻。與民衆交談時，基督在講聖餐的話上也沒有附加任何比喻。他從關於舊約嗎哪的談話出發。這不是比喻，而是現實。猶太人真實地喫了嗎哪，爲了真實地不死。爲了向聽衆指明嗎哪隻是預像，主才說：他們雖然喫了嗎哪，嗎哪隻救他們免於飢餓，最終他們還是死了（正如人人都死），而吃他的人必不死（因爲這已經不是預像，而是預像所指之物——賜永恒生命的真正從天降下的糧）：</p><blockquote><p>“永活的父怎樣差我來，我又因父活著；照樣，<strong><mark>吃我肉的人也要因我活著</mark></strong>。 這就是從天上降下來的糧。吃這糧的人，就永遠活著，<strong><mark>不像你們的祖宗吃過嗎哪還是死了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L57-58">約 6:57-58</a>)</p></blockquote><h3>“我不再喝葡萄汁”</h3><p>有人反對在聖餐中對體和血作實在的理解，引用基督在最後晚餐上關於葡萄汁的話。</p><p>三位福音史家——馬太、馬可和路加——都講到葡萄汁（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L29">太 26:29</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L25">可 14:25</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L18">路 22:18</a>）。路加福音史家與馬可和馬太不同，更詳細地描述了晚餐，提到喝過的幾杯：</p><h4>第一杯</h4><blockquote><p>“耶穌對他們說：「<strong><mark>我很願意在受害以先和你們吃這逾越節的筵席</mark></strong>。 我告訴你們：我不再吃這筵席，直到成就在上帝的國裏。」 <strong><mark>耶穌接過杯來，祝謝了</mark></strong>，說：「<strong><mark>你們拿這個，大家分著喝</mark></strong>。 我告訴你們，<strong><mark>從今以後，我不再喝這葡萄汁</mark></strong>，直等上帝的國來到。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L15-18">路 22:15-18</a>)</p></blockquote><p>基督吩咐把杯中的東西分給門徒。這杯被分了。到這裏還沒有聖餐，沒有關於體和血的話；有的只是逾越節的晚餐。在這杯酒之後，基督立刻說了那句關於他不再喝葡萄汁的話：</p><blockquote><p>“我告訴你們，<strong><mark>從今以後，我不再喝這葡萄汁</mark></strong>，直等上帝的國來到。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L18">路 22:18</a>)</p></blockquote><p>而只有<strong>飯後</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L20">路 22:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L25">林前 11:25</a>）基督才舉行聖餐：拿起餅，又拿起杯（這已是另一杯，因爲第一杯已經喝了），遞給門徒，只是現在才說到自己的體和血：</p><h4>第二杯</h4><blockquote><p>“又拿起餅來，祝謝了，就擘開，遞給他們，說：「<strong><mark>這是我的身體，爲你們舍的</mark></strong>，你們也應當如此行，爲的是記念我。」 <strong><mark>飯後也照樣拿起杯來</mark></strong>，說：「<strong><mark>這杯是用我血所立的新約</mark></strong>，是爲你們流出來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19-20">路 22:19-20</a>)</p></blockquote><p>這樣，在前一部分舉行的只是猶太人傳統的逾越節晚餐，按習俗必喝<strong>四杯酒</strong>（摻水的）並感謝上帝。聖經裏沒有喝這四杯酒的命令。這只是猶太人的習俗。猶太逾越節晚餐的習俗在猶太的米示拿中有詳細描述：</p><p>“米示拿第一篇</p><p>（ א ）在逾越節前夕，從晚祭之前起，人不可吃到天黑。即使在以色列中最窮的人也不可以不側身而食。並且<strong>不可少給他四杯酒</strong>，即使是從施濟處領的。”</p><p>（[俄文](https://toldot.com/articles/articles_30013.html)《米示拿·應戶約》第10篇）</p><p>第一次基督只是行了這習俗：拿起杯，祝謝，遞給自己的門徒，一句關於這是他的血的話也沒有說，只說叫他們彼此分著喝——他們顯然也這樣做了。杯喝了。第一次完全沒提餅。飯後才說到餅，又再說到杯，並且只是這時纔出現關於基督的體和血的話。所以關於葡萄汁的話屬於第一杯——葡萄的酒；而關於基督的血的話屬於第二杯——在其中奧祕地遞給門徒的已經不是酒，而是基督真實的血，這正是我們所信的。</p><h3>“叫人活著的乃是靈，肉體是無益的”（不帶來益處）</h3><p>教會聖餐教訓的反對者宣稱，基督只是象徵性地講到吃他的肉。他們引用下面的話：</p><blockquote><p>“叫人活著的乃是靈，<strong><mark>肉體是無益的</mark></strong>；我對你們所說的話就是靈，就是生命。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L63">約 6:63</a>)</p></blockquote><p>象徵論的擁護者這樣解釋這些話：彷彿吃基督的肉不帶來任何益處。</p><p>我們則表明，“肉體無益”的話說的是肉體式的思維——它不帶來益處。這是說那些只按地上的方式思想的人，粗糙地、按世俗的方式：只用他們在自己生活中習慣見到的方式，不能把思想提升到屬靈的奧祕。</p><p>在聖經裏我們可以遇到許多別的地方，這樣的話被用於只按地上方式思想的人：</p><blockquote><p>“耶穌對他說：「西門巴約拿，你是有福的！因爲<strong><mark>這不是屬血肉的指示你的</mark></strong>，乃是我在天上的父指示的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L17">太 16:17</a>)</p></blockquote><blockquote><p>“既然樂意將他兒子啓示在我心裏，叫我把他傳在外邦人中，<strong><mark>我就沒有與屬血氣的人商量</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L16">加 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你們既靠聖靈入門，如今還靠肉身成全嗎</mark></strong>？你們是這樣的無知嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L3">加 3:3</a>)</p></blockquote><blockquote><p>“耶和華如此說：「<strong><mark>倚靠人血肉的膀臂</mark></strong>，心中離棄耶和華的，那人有禍了！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/17/#L5">耶 17:5</a>)</p></blockquote><p>這些人以爲他們面前只是一個普通人、約瑟的兒子。一個普通人怎麼能把自己的肉給他們喫？——只能像所有人那樣：從自己身上撕下來給他們喫。這樣的思維沒有帶給他們任何益處。他們大大地憂愁，說：“<strong>這話甚難，誰能聽呢？</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L60">約 6:60</a>），就離開了。</p><p>然而基督不是普通人，而是全能的上帝。他設立聖奧祕：在其中他賜生命的體和血以奧祕的方式、藉上帝的能力、以餅和酒的形式被分予。爲此需要屬靈地思想，爲那理智並不總能明白的奧祕性舉行留下位置，爲基督話語的超越地上秩序的超性成就留下位置：</p><blockquote><p>“耶穌說：「我實實在在的告訴你們，<strong><mark>你們若不吃人子的肉，不喝人子的血，就沒有生命在你們裏面</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L53">約 6:53</a>)</p></blockquote><h3>爲什麼要“吃上帝”？</h3><p>這樣的問題多是穆斯林問的。新教徒也向教會提這個問題，只是形式稍有不同，實質相同。</p><p>對這個問題的回答可以很長，但這裏只給出總的想法：領聖體使人進入與上帝基督最親密的相通：不僅是屬靈的，也是身體的——因爲上帝造人不僅用靈魂，也用身體。</p><p>實際上，除了亞當和夏娃，每個人從出現在這個世界上的最初時刻起，就是以另一個人的身體——自己母親的身體——爲食的。如果他不是這樣，就不能有生命，不能成長髮育，必定滅亡——當胎兒（胚胎）不能著牀時，事情正是如此。</p><p>嬰兒出生時，他的身體是由母親的身體構成的。母親的身體交出自己，把生命給了嬰兒，這樣兩者（母親和嬰兒）處於身體的相通之中。即使出生之後，嬰兒還要長時間以母親的身體爲食，因爲嬰兒所喝的奶是在母親的身體裏由她的血造成的。所以，在這個意義上，奶——就是母親的血。</p><p>兩個過程（生育和聖餐）的設立都是上帝的。</p><p>認識了上帝所造的人性及其誕生和滋養的過程，在聖餐中承認類似的過程就不足爲奇了——在聖餐中我們喫的已不是母親的身體，而是基督上帝的身體；這樣我們與上帝進入的不僅是屬靈的，也是身體的相通——與基督完全的相通，靈與體：</p><blockquote><p>“<strong><mark>因我們是他身上的肢體</mark></strong>〔有古卷在此有『就是他的骨、他的肉』〕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L30">弗 5:30</a>)</p></blockquote>
