  title: 污言穢語（謾罵）
  copy_cover: true
  body: <h2>污言穢語（謾罵）是罪</h2><blockquote><p>“<strong><mark>污穢的言語，一句不可出口</mark></strong>，只要隨事說造就人的好話，叫聽見的人得益處。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L29">弗 4:29</a>)</p></blockquote><blockquote><p>“至於淫亂並一切污穢，或是貪婪，在你們中間連提都不可，方合聖徒的體統。 <strong><mark>淫詞、妄語和戲笑的話都不相宜</mark></strong>，總要說感謝的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L3-4">弗 5:3-4</a>)</p></blockquote><blockquote><p>“但現在你們要棄絕這一切的事，以及惱恨、忿怒、惡毒、毀謗，並<strong><mark>口中污穢的言語</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L8">西 3:8</a>)</p></blockquote><blockquote><p>“<strong><mark>不以惡報惡、以辱罵還辱罵，倒要祝福</mark></strong>；因你們是爲此蒙召，好叫你們承受福氣。 因爲經上說：『人若愛生命，願享美福，<strong><mark>須要禁止舌頭不出惡言</mark></strong>，嘴脣不說詭詐的話；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L9-10">彼前 3:9-10</a>)</p></blockquote><blockquote><p>“管住舌頭的人必享平安；恨惡倉促的人必不至有罪。” (<a href="https://bibleox.com/zh-Hant/ru/prsir/19/#L6">德 19:6</a>, ) <em>(俄文本爲 Сир 19:6（思高本無此節）。)</em></p></blockquote><blockquote><p>“<strong><mark>惟獨舌頭沒有人能制伏，是不止息的惡物，滿了害死人的毒氣</mark></strong>。 我們用舌頭頌讚那爲主、爲父的，又用舌頭咒詛那照著上帝形像被造的人。 <strong><mark>頌讚和咒詛從一個口裏出來，我的弟兄們，這是不應當的</mark></strong>。 泉源從一個眼裏能發出甜苦兩樣的水嗎？ &lt;…&gt; <strong><mark>你們中間誰是有智慧、有見識的呢？他就當在智慧的溫柔上顯出他的善行來</mark></strong>。 你們心裏若懷著苦毒的嫉妒和紛爭，就不可自誇，也不可說謊話抵擋真道。 這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的、屬鬼魔的。 在何處有嫉妒紛爭，就在何處有擾亂和各樣的壞事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/3/#L8-11,13-16">雅 3:8-11,13-16</a>)</p></blockquote><h2>罵人話的問題在哪裏</h2><p>罵人話（攻擊性詞彙）的問題在於：說話的人想顯得、並自以爲是惡的、有攻擊性的、危險的、厲害的。惡的詞彙只是達到這一目的的方式之一。人們還會加上惡的情緒、眼神、手勢、衣著、紋身、習慣和其他一切自我表達的方式。但讓我們回到話語本身。</p><p>話語由聲音構成。聲音的組合本身沒有任何意義：它既不壞也不好。比如說，我們造一個詞「阿木薩達爾」。「阿木薩達爾」暫時沒有任何意義，因此既不算壞也不算好。但當社會中給某個詞賦予了含義，人就會根據場合、根據他在這種場合想成爲什麼樣的人，來選擇帶有不同含義的詞。當人想顯得有禮貌、有教養時，他使用有禮貌的詞彙，即那些帶有令人愉快的含義、表明我們和平的心態、謙卑、殷勤或類似品質的詞。然而，當人想顯得厲害、危險、惡毒或有攻擊性時，他就轉而使用攻擊性的詞彙，即那些帶有攻擊性、粗俗和其他負面含義的詞，這些詞立刻會表明：這樣的人沒有任何教養，也沒有使他剋制惡行的情緒——他想讓周圍的人覺得他是個危險、惡毒、有攻擊性、狂躁、不安分的人，而這裏沒有任何好的東西。</p><p>此外，當人習慣於這種惡的狀態時，就會對它產生依賴，如同對吸菸、飲酒的依賴，也如同對任何罪的惡習的依賴。結果，他會採取種種行動使自己進入這種惡的狀態、在內心培養它：甚至獨處時也罵人，聽惡的音樂，用陰鬱的符號填充自己和周圍的空間。也就是說，這一切都是向惡的狀態的運動，是在自己心裏培養惡意的狀態、憤怒的情慾，而主耶穌基督卻教導我們：</p><blockquote><p>“只是我告訴你們：<strong><mark>凡向弟兄動怒的</mark></strong>，難免受審判〔有古卷在『凡』字下添『無緣無故的』五字』〕。<strong><mark>凡罵弟兄是拉加的</mark></strong>，難免公會的審斷；<strong><mark>凡罵弟兄是魔利的</mark></strong>，難免地獄的火。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L22">太 5:22</a>) <em>(「拉加」是侮辱人的稱呼。)</em></p></blockquote><blockquote><p>“<strong><mark>溫柔的人有福了，因爲他們必承受地土</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L5">太 5:5</a>)</p></blockquote><p>使徒也說：</p><blockquote><p>“<strong><mark>一切苦毒、惱恨、忿怒，嚷鬧、毀謗，並一切的惡毒，都當從你們中間除掉</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L31">弗 4:31</a>)</p></blockquote><p>先知也說：</p><blockquote><p>“<strong><mark>當止住怒氣，離棄忿怒</mark></strong>；不要心懷不平，以致作惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/37/#L8">詩 37:8</a>)</p></blockquote><p>這裏也應當說到愚蠢的玩笑：</p><blockquote><p>“淫詞、妄語和<strong><mark>戲笑的話都不相宜，總要說感謝的話</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L4">弗 5:4</a>)</p></blockquote><blockquote><p>“你們飽足的人有禍了，因爲你們將要飢餓！<strong><mark>你們喜笑的人有禍了，因爲你們將要哀慟哭泣</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L25">路 6:25</a>)</p></blockquote>
