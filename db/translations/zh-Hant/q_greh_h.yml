- src: Злословие
  path: QS12T_毀謗
  title: 毀謗（辱罵）
  copy_cover: true
  body: <h2>毀謗（辱罵）</h2><blockquote><p>“<strong><mark>你口任說惡言，你舌編造詭詐</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/50/#L19">詩 50:19</a>) <em>(俄文本編號爲 Пс 49:19（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“他們的喉嚨是敞開的墳墓；他們用舌頭弄詭詐。嘴脣裏有虺蛇的毒氣。 <strong><mark>滿口是咒罵苦毒</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L13-14">羅 3:13-14</a>)</p></blockquote><blockquote><p>“<strong><mark>不要毀謗</mark></strong>，不要爭競，總要和平，向衆人大顯溫柔。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L2">多 3:2</a>)</p></blockquote><blockquote><p>“<strong><mark>他被罵不還口</mark></strong>．受害不說威嚇的話，只將自己交託那按公義審判人的主。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L23">彼前 2:23</a>)</p></blockquote><blockquote><p>“所以，<strong><mark>你們既除去一切的惡毒、詭詐並假善、嫉妒和一切毀謗的話</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L1">彼前 2:1</a>)</p></blockquote><blockquote><p>“但現在你們要棄絕這一切的事，以及惱恨、忿怒、<strong><mark>惡毒、毀謗</mark></strong>，並口中污穢的言語。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L8">西 3:8</a>)</p></blockquote><h3>辱罵上帝</h3><blockquote><p>“這以色列婦人的兒子褻瀆了聖名，並且咒詛，就有人把他送到摩西那裏。（他母親名叫示羅密，是但支派底伯利的女兒。） &lt;…&gt; 你要曉諭以色列人說：『<strong><mark>凡咒詛上帝的，必擔當他的罪</mark></strong>。 <strong><mark>那褻瀆耶和華名的，必被治死</mark></strong>，全會衆總要用石頭打死他。不管是寄居的是本地人，他褻瀆耶和華名的時候，必被治死。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/24/#L11,15-16">利 24:11,15-16</a>)</p></blockquote><h3>辱罵父母</h3><blockquote><p>“<strong><mark>咒罵父母的，必要把他治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/21/#L17">出 21:17</a>)</p></blockquote><blockquote><p>“『<strong><mark>輕慢父母的，必受咒詛</mark></strong>。』百姓都要說：『阿們！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/27/#L16">申 27:16</a>)</p></blockquote><blockquote><p>“<strong><mark>咒罵父母的，他的燈必滅，變爲漆黑的黑暗</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/20/#L20">箴 20:20</a>)</p></blockquote><h3>辱罵近人</h3><blockquote><p>“<strong><mark>弟兄們，你們不可彼此批評</mark></strong>。人若批評弟兄，論斷弟兄，就是批評律法，論斷律法。你若論斷律法，就不是遵行律法，乃是判斷人的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L11">雅 4:11</a>)</p></blockquote><h3>辱罵政權和官長</h3><blockquote><p>“<strong><mark>不可毀謗上帝，也不可毀謗你百姓的官長</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/22/#L28">出 22:28</a>)</p></blockquote><blockquote><p>“這些作夢的人也像他們污穢身體，<strong><mark>輕慢主治的，毀謗在尊位的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L8">猶 1:8</a>)</p></blockquote><blockquote><p>“那些隨肉身縱污穢的情欲、輕慢主治之人的，更是如此。<strong><mark>他們膽大任性，毀謗在尊位的也不知懼怕</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L10">彼後 2:10</a>)</p></blockquote>
