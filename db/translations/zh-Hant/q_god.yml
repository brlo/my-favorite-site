- src: Бог-нелицеприятный
  path: Qg13T_上帝不偏待人
  title: 上帝不偏待人
  copy_cover: true
  body: <blockquote><p>“<strong>他待王子不徇情面</strong>，<strong>也不看重富足的過於貧窮的</strong>，<strong>因爲都是他手所造</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/34/#L19">伯 34:19</a>)</p></blockquote><blockquote><p>“現在你們應當敬畏耶和華，謹慎辦事，因爲耶和華我們的上帝沒有不義，<strong>不偏待人</strong>，也不受賄賂。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/19/#L7">代下 19:7</a>)</p></blockquote><blockquote><p>“你不要依靠不義的祭品，因爲上主是審判者，<strong>決不看情面</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/35/#L15">德 35:15</a>)</p></blockquote><blockquote><p>“他們來了，就對他說：「夫子，我們知道你是誠實的，<strong>什麼人你都不徇情面</strong>，因爲你<strong>不看人的外貌</strong>，乃是誠誠實實傳上帝的道。納稅給該撒可以不可以？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L14">可 12:14</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/20/#L21">路 20:21</a>)</p></blockquote><blockquote><p>“因爲上帝<strong>不偏待人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L11">羅 2:11</a>)</p></blockquote><blockquote><p>“你們作主人的待僕人也是一理，不要威嚇他們，因爲知道他們和你們同有一位主在天上，<strong>他並不偏待人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L9">弗 6:9</a>)</p></blockquote><blockquote><p>“那行不義的，必受不義的報應；主<strong>並不偏待人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L25">西 3:25</a>)</p></blockquote><blockquote><p>“你們既稱<strong>那不偏待人、按各人行爲審判人的主</strong>爲父，就當存敬畏的心，度你們在世寄居的日子，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L17">彼前 1:17</a>)</p></blockquote>
  meta_desc: 上帝不看人的財富和地位，對所有人一視同仁
