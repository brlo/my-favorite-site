  path: Qg2T_上帝是三位
  title: 上帝是三位
  copy_cover: true
  body: <h2>上帝是一位，但他並非在自己裏面是孤單的一位</h2><blockquote><p>“<strong>上帝說</strong>：「<strong><mark>我們要</mark></strong><strong>照著我們的形像，按著我們的樣式</strong>造人。使他們管理海里的魚、空中的鳥、地上的牲畜和全地，並地上所爬的一切昆蟲。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L26">創 1:26</a>)</p></blockquote><blockquote><p>“<strong>耶和華上帝說</strong>：「那人已經<strong><mark>與我們相似</mark></strong>，能知道善惡。現在恐怕他伸手又摘生命樹的果子吃，就永遠活著。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L22">創 3:22</a>)</p></blockquote><h2>獨一的上帝在位格上是三位：聖父、聖子和聖靈</h2><ul><li><p><a href="https://bibleox.com/ru/ru/w/Бог-один">上帝是唯一的上帝</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Отец-Бог">聖父是上帝</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Бог">上帝之子是上帝</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/СвятойДух-Бог">聖靈是上帝</a></p></li></ul><h2>上帝之子與父原爲一</h2><blockquote><p>“<strong>我與父原爲一</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L30">約 10:30</a>)</p></blockquote><blockquote><p>“<strong>凡父所有的都是我的</strong>，所以我說，他要將受於我的告訴你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L15">約 16:15</a>)</p></blockquote><h2>聖靈從父出來</h2><blockquote><p>“但我要從父那裏差保惠師來，就是<strong>從父出來真理的聖靈，他來了</strong>，就要爲我作見證。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L26">約 15:26</a>)</p></blockquote><p><strong>本文尚待補充</strong></p>
