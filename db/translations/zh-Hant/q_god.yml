  title: 上帝向尋求他的人顯現
  copy_cover: true
  body: <blockquote><p>“愛我的，我也愛他；<strong>懇切尋求我的，必尋得見</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/8/#L17">箴 8:17</a>)</p></blockquote><blockquote><p>“我兒所羅門哪，你當認識耶和華你父的上帝，誠心樂意地事奉他。因爲他鑑察衆人的心，知道一切心思意念。<strong>你若尋求他，他必使你尋見</strong>；你若離棄他，他必永遠丟棄你！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/28/#L9">代上 28:9</a>)</p></blockquote><blockquote><p>“耶和華啊！認識你名的人要倚靠你，<strong>因你沒有離棄尋求你的人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/9/#L10">詩 9:10</a>)</p></blockquote><blockquote><p>“耶和華從天上垂看世人，要看<strong>有明白的沒有，有尋求上帝的沒有</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/14/#L2">詩 14:2</a>)</p></blockquote><blockquote><p>“<strong>我曾尋求耶和華，他就應允我</strong>；救我脫離了一切的恐懼。 <strong>凡仰望他的，便有光榮</strong>；他們的臉，必不蒙羞。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L4-5">詩 34:4-5</a>)</p></blockquote><blockquote><p>“少壯獅子還缺食忍餓，但<strong>尋求耶和華的，什麼好處都不缺</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L10">詩 34:10</a>)</p></blockquote><blockquote><p>“「你們這追求公義、<strong>尋求耶和華的</strong>，當聽我言！你們要追想被鑿而出的磐石，被挖而出的巖穴。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/51/#L1">賽 51:1</a>)</p></blockquote><blockquote><p>“你們祈求，就給你們；<strong>尋找，就尋見</strong>；叩門，就給你們開門。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L7">太 7:7</a>)</p></blockquote><blockquote><p>“人非有信，就不能得上帝的喜悅；因爲到上帝面前來的人，必須信有上帝，<strong>且信他賞賜那尋求他的人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L6">希 11:6</a>)</p></blockquote><blockquote><p>“還是你藐視他豐富的恩慈、寬容、忍耐，不曉得他的恩慈是領你悔改呢？ 你竟任著你剛硬不悔改的心，爲自己積蓄忿怒，以致上帝震怒，顯他公義審判的日子來到。 他必<strong>照各人的行爲報應各人</strong>。 凡<strong>恆心行善，尋求榮耀、尊貴和不能朽壞之福的，就以永生報應他們</strong>； 惟有<strong>結黨不順從真理</strong>，反順從不義的，就以<strong>忿怒、惱恨</strong>報應他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L4-8">羅 2:4-8</a>)</p></blockquote><blockquote><p>“要以他的聖名誇耀，<strong>尋求耶和華的人，心中應當歡喜</strong>。 <strong>要尋求耶和華與他的能力</strong>，時常尋求他的面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/105/#L3-4">詩 105:3-4</a>)</p></blockquote>
  meta_desc: "「你若尋求他，他必使你尋見」"
