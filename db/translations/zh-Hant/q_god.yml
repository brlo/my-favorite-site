  body: <h2>上帝創造萬物</h2><blockquote><p>“太初有道，道與上帝同在，道就是上帝。 &lt;…&gt; 萬物是藉着他造的；<strong>凡被造的，沒有一樣不是藉着他造的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1,3">約 1:1,3</a>)</p></blockquote><blockquote><p>“<strong>起初上帝創造天地</strong>。 地是空虛混沌，淵面黑暗；上帝的靈運行在水面上。 上帝說：「要有<strong>光</strong>。」就有了光。 上帝看光是好的，就把光暗分開了。 上帝稱光爲晝，稱暗爲夜。有晚上，有早晨，這是頭一日。 上帝說：「諸水之間要有<strong>空氣</strong>，將水分爲上下。」 上帝就造出空氣，將空氣以下的水、空氣以上的水分開了。事就這樣成了。 上帝稱空氣爲天。有晚上，有早晨，是第二日。 上帝說：「天下的水要聚在一處，使<strong>旱地</strong>露出來。」事就這樣成了。 上帝稱旱地爲地，稱水的聚處爲海。上帝看著是好的。 上帝說：「地要發生<strong>青草</strong>和結種子的菜蔬，並結果子的樹木，各從其類，果子都包著核。」事就這樣成了。 於是地發生了青草和結種子的菜蔬，各從其類；並結果子的樹木，各從其類，果子都包著核。上帝看著是好的。 有晚上，有早晨，是第三日。 上帝說：「天上要有<strong>光體</strong>，可以分晝夜，作記號，定節令、日子、年歲， 並要發光在天空，普照在地上。」事就這樣成了。 於是上帝造了兩個大光，大的管晝，小的管夜，又造衆星， 就把這些光擺列在天空，普照在地上， 管理晝夜，分別明暗。上帝看著是好的。 有晚上，有早晨，是第四日。 上帝說：「水要多多滋生<strong>有生命的物</strong>，要有<strong>雀鳥</strong>飛在地面以上，天空之中。」 上帝就造出大魚和水中所滋生各樣有生命的動物，各從其類；又造出各樣飛鳥，各從其類。上帝看著是好的。 上帝就賜福給這一切，說：「滋生繁多，充滿海中的水；雀鳥也要多生在地上。」 有晚上，有早晨，是第五日。 上帝說：「地要生出活物來，各從其類；<strong>牲畜</strong>、<strong>昆蟲</strong>、野獸，各從其類。」事就這樣成了。 於是上帝造出野獸，各從其類；牲畜，各從其類；地上一切昆蟲，各從其類。上帝看著是好的。 上帝說：「我們要照著我們的形像，按著我們的樣式<strong>造人</strong>。使他們管理海里的魚、空中的鳥、地上的牲畜和全地，並地上所爬的一切昆蟲。」 上帝就照著自己的形像造人，乃是照著他的形像<strong>造男造女</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L1-27">創 1:1-27</a>)</p></blockquote><blockquote><p>“雅各的分不像這些，因他是<strong>造作萬有的主</strong>。以色列也是他產業的支派－萬軍之耶和華是他的名。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/10/#L16">耶 10:16</a>)</p></blockquote><blockquote><p>“<strong>創造宇宙和其中萬物的上帝</strong>，既是天地的主，就不住人手所造的殿，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L24">徒 17:24</a>)</p></blockquote><blockquote><p>“永生的天主，一舉而<strong>創造了萬物</strong>，惟有上主堪稱是正義的，永遠是常勝的君王。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/18/#L1">德 18:1</a>)</p></blockquote><blockquote><p>“<strong>上主造成了萬物</strong>，並賜給虔敬人智慧。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/43/#L37">德 43:37</a>)</p></blockquote><blockquote><p>“「從你出胎，造就你的救贖主耶和華如此說：我耶和華是<strong>創造萬物的</strong>，是獨自鋪張諸天、鋪開大地的。誰與我同在呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/44/#L24">賽 44:24</a>)</p></blockquote><blockquote><p>“「我們的主，我們的上帝，你是配得榮耀、尊貴、權柄的！因爲你<strong>創造了萬物</strong>，並且萬物是<strong>因你的旨意被創造</strong>而有的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/4/#L11">啟 4:11</a>)</p></blockquote><blockquote><p>“我兒，我懇求你仰視天，俯視地，觀察天地間形形色色的萬物！你該知道，<strong>這一切都是天主從無中造成</strong>的，人類也是如此造成的。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/2mak/7/#L28">加下 7:28</a>)</p></blockquote><blockquote><p>“以及全能上帝的氣息，他<strong>創造萬物</strong>，鑑察大地隱祕中的一切隱祕。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/16/#L63">厄四 16:63</a>, )</p></blockquote><blockquote><p>“<strong>諸天藉耶和華的命而造</strong>；<strong>萬象</strong>藉他口中的氣而成。 他<strong>聚集海水如壘</strong>，收藏深洋在庫房。 &lt;…&gt; 因爲他說有，就有；命立，就立。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/33/#L6-7,9">詩 33:6-7,9</a>)</p></blockquote><blockquote><p>“你，惟獨你是耶和華！你<strong>造了天和天上的天，並天上的萬象</strong>，<strong>地和地上的萬物，海和海中所有的</strong>，這一切都是你所保存的；天軍也都敬拜你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/neem/9/#L6">尼 9:6</a>)</p></blockquote><blockquote><p>“他們聽見了，就同心合意的高聲向上帝說：「主啊，你是<strong>造天、地、海和其中萬物的</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L24">徒 4:24</a>)</p></blockquote><blockquote><p>“「諸君，爲什麼作這事呢？我們也是人，性情和你們一樣！我們傳福音給你們，是叫你們離棄這些虛妄，歸向那<strong>創造天、地、海和其中萬物的</strong>永生上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/14/#L15">徒 14:15</a>)</p></blockquote><blockquote><p>“因爲六日之內，<strong>耶和華造天、地、海和其中的萬物</strong>，第七日便安息。所以耶和華賜福與安息日，定爲聖日。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L11">出 20:11</a>)</p></blockquote><blockquote><p>“萬有的主宰<strong>決不顧情面</strong>，也不畏懼權勢，因爲<strong>無論大小，都是他造的</strong>；他對一切，都一律加以照顧；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/6/#L8">智 6:8</a>)</p></blockquote><blockquote><p>“<strong>能聽的耳，能看的眼</strong>，都是耶和華所造的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/20/#L12">箴 20:12</a>)</p></blockquote><blockquote><p>“<strong>地的深處</strong>在他手中．<strong>山的高峯</strong>也屬他。 <strong>海洋</strong>屬他，是他造的；<strong>旱地</strong>也是他手造成的。 來啊，我們要屈身敬拜，在<strong>造我們的耶和華</strong>面前跪下。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/95/#L4-6">詩 95:4-6</a>)</p></blockquote><blockquote><p>“我<strong>造地</strong>，又<strong>造人在地上</strong>；我親手<strong>鋪張諸天</strong>，<strong>天上萬象也是我所命定的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L12">賽 45:12</a>)</p></blockquote><blockquote><p>“耶和華用能力<strong>創造大地</strong>，用智慧<strong>建立世界</strong>，用聰明<strong>鋪張穹蒼</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/10/#L12">耶 10:12</a>)</p></blockquote><blockquote><p>“我用大能和伸出來的膀臂，<strong>創造大地</strong>和地上的<strong>人民、牲畜</strong>，我看給誰相宜，就把地給誰。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/27/#L5">耶 27:5</a>)</p></blockquote><blockquote><p>“主耶和華啊，你曾用大能和伸出來的膀臂<strong>創造天地</strong>，在你沒有難成的事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/32/#L17">耶 32:17</a>)</p></blockquote><blockquote><p>“凡不認識天主的人，都是真正的愚人，因爲，他們未能從看得見的美物，去發現那自有者；注意了工程，卻不認識工程師；反而認<strong>火</strong>、<strong>風</strong>、流動的<strong>空氣</strong>、運轉的<strong>星辰</strong>、洪流的<strong>巨濤</strong>、天上的<strong>光體</strong>，爲統治世界的神。如果有人因這些東西的美麗而著迷，奉之爲神；那麼，他們就應知道：這些美物的主宰更是美麗，因爲，全是美麗的唯一根源<strong>所創造</strong>的。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/13/#L1-3">智 13:1-3</a>)</p></blockquote><h2>上帝<a href="https://bibleox.com/ru/ru/w/Бог-неизменен">永不改變</a>。他自創造世界以來也沒有改變</h2><blockquote><p>“上主並未允許聖者講論他的一切奇事，全能的上主建立了這些奇事，爲叫天地萬物愈發顯揚自己的光榮。&lt;…&gt; 他井然佈置了自己智慧的偉業，他從永遠直到永遠常常存在；對他，<strong>什麼也不能增加，什麼也不能減少</strong>；他不需要任何人的計謀。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/42/#L17,21-22">德 42:17,21-22</a>)</p></blockquote>
  meta_desc: 上帝創造萬物——聖經關於上帝是創造者的引文
