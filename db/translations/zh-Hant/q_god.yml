  title: 全能的上帝
  copy_cover: true
  body: <h2>全能的上帝</h2><blockquote><p>“亞伯蘭年九十九歲的時候，耶和華向他顯現，對他說：「<strong>我是全能的上帝</strong>，你當在我面前作完全人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L1">創 17:1</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/28/#L3">創 28:3</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/35/#L11">創 35:11</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/43/#L14">創 43:14</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/48/#L3">創 48:3</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/49/#L25">創 49:25</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/24/#L4">民 24:4</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/24/#L16">民 24:16</a>; <a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/46/#L8">德 46:8</a>; <a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/46/#L19">德 46:19</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/is/10/#L34">賽 10:34</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/is/13/#L6">賽 13:6</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/1/#L24">結 1:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/10/#L5">結 10:5</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/iol/1/#L15">珥 1:15</a>)</p></blockquote><blockquote><p>“我從前向亞伯拉罕、以撒、雅各顯現爲<strong>全能的上帝</strong>，至於我名耶和華，他們未曾知道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/6/#L3">出 6:3</a>)</p></blockquote><blockquote><p>“「我知道<strong>你萬事都能作</strong>，<strong>你的旨意不能攔阻</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/42/#L2">伯 42:2</a>)</p></blockquote><blockquote><p>“但是，你憐憫衆生，因爲你是<strong>無所不能的</strong>，你假裝看不見人罪，是爲叫罪人悔改。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/11/#L24">智 11:24</a>)</p></blockquote><blockquote><p>“住在至高者隱密處的，必住在<strong>全能者</strong>的蔭下。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/91/#L1">詩 91:1</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/68/#L14">詩 68:14</a>)</p></blockquote><blockquote><p>“爲此，如果有人不相信你具有<strong>絕對的權威</strong>，你就將你的權力顯示出來；如果他們知道而仍膽大妄爲，你就予以懲罰。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/12/#L17;">智 12:17;</a>)</p></blockquote><blockquote><p>“以及<strong>全能上帝</strong>的氣息，他創造萬物，鑑察大地隱祕中的一切隱祕。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/16/#L63">厄四 16:63</a>, )</p></blockquote><blockquote><p>“主耶和華啊，你曾用大能和伸出來的膀臂創造天地，<strong>在你沒有難成的事</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/32/#L17">耶 32:17</a>)</p></blockquote><blockquote><p>“「我是耶和華，是凡有血氣者的上帝，<strong>豈有我難成的事嗎？</strong>” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/32/#L27">耶 32:27</a>)</p></blockquote><blockquote><p>“耶穌說：「<strong>在人所不能的事，在上帝卻能</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L27">路 18:27</a>)</p></blockquote><blockquote><p>“耶穌看著他們，說：「在人是不能，在上帝卻不然，因爲<strong>上帝凡事都能</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L27">可 10:27</a>)</p></blockquote><h2>上帝怎樣思想，就必怎樣成就</h2><blockquote><p>“萬軍之耶和華起誓說：「<strong>我怎樣思想，必照樣成就；我怎樣定意，必照樣成立</strong>， &lt;…&gt; 這是向全地所定的旨意，這是向萬國所伸出的手。 <strong>萬軍之耶和華既然定意，誰能廢棄呢？他的手已經伸出，誰能轉回呢？</strong>” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/14/#L24,26-27">賽 14:24,26-27</a>)</p></blockquote>
  meta_desc: 對上帝來說沒有難成的事——聖經引文
