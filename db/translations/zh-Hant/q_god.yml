  path: Qg3T_上帝是善的根源
  title: 上帝是善的根源，不是惡的根源
  copy_cover: true
  body: <h2>上帝是善的根源，不是惡的根源</h2><blockquote><p>“人被試探，不可說：『我是被上帝試探』，因爲<strong><mark>上帝不能被惡試探，他也不試探人</mark></strong>。 &lt;…&gt; 各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從衆光之父那裏降下來的；在他並沒有改變，也沒有轉動的影兒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L13,17">雅 1:13,17</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝就是光，在他毫無黑暗</mark></strong>！這是我們從主所聽見、又報給你們的信息。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L5">約壹 1:5</a>)</p></blockquote><blockquote><p>“耶穌對他說：「你爲什麼以善事問我呢？只有一位是善的〔有古卷作『你爲什麼稱我是良善的？<strong><mark>除了上帝以外，沒有一個良善的</mark></strong>』〕。你若要進入永生，就當遵守誡命。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L17">太 19:17</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L18">可 10:18</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L19">路 18:19</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和華善待萬民</mark></strong>，他的慈悲覆庇他一切所造的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/145/#L9">詩 145:9</a>)</p></blockquote><h2>無罪的</h2><blockquote><p>“你們知道主曾顯現，是要除掉人的罪，<strong><mark>在他並沒有罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L5">約壹 3:5</a>)</p></blockquote><blockquote><p>“凡犯罪的，就是違背律法；違背律法，就是罪。 &lt;…&gt; <strong><mark>犯罪的是屬魔鬼</mark></strong>，因爲魔鬼從起初就犯罪。上帝的兒子顯現出來，爲要除滅魔鬼的作爲。 <strong>凡從上帝生的，就不犯罪</strong>，因上帝的道存在他心裏；他也不能犯罪，因爲他是由上帝生的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L4,8-9">約壹 3:4,8-9</a>)</p></blockquote><h2>上帝是愛</h2><blockquote><p>“沒有愛心的，就不認識上帝，因爲<strong><mark>上帝就是愛</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L8">約壹 4:8</a>)</p></blockquote><blockquote><p>“上帝愛我們的心，我們也知道、也信。<strong><mark>上帝就是愛！</mark></strong><strong>住在愛裏面的，就是住在上帝裏面</strong>，上帝也住在他裏面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L16">約壹 4:16</a>)</p></blockquote><h2>上帝願意萬人得救</h2><blockquote><p>“我勸你第一要爲萬人懇求、禱告、代求、祝謝， &lt;…&gt; 這是好的，在上帝我們救主面前可蒙悅納。 <strong><mark>他願意萬人得救</mark></strong>，明白真道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L1,3-4">提前 2:1,3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>主</mark></strong>所應許的尚未成就，有人以爲他是耽延，其實不是耽延，乃是寬容你們，<strong><mark>不願有一人沉淪，乃願人人都悔改</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L9">彼後 3:9</a>)</p></blockquote><blockquote><p>“你對他們說：『主耶和華說：我指著我的永生起誓，<strong><mark>我斷不喜悅惡人死亡，惟喜悅惡人轉離所行的道而活</mark></strong>。以色列家阿，你們轉回，轉回吧！離開惡道，何必死亡呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/33/#L11">結 33:11</a>)</p></blockquote><blockquote><p>“主耶和華說，<strong><mark>惡人死亡，豈是我喜悅的嗎？</mark></strong><strong>不是喜悅他回頭離開所行的道存活嗎？</strong>” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/18/#L23">結 18:23</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝愛世人</mark></strong>，<strong>甚至將他的獨生子賜給他們，叫一切信他的，不至滅亡，反得永生</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L16">約 3:16</a>)</p></blockquote><blockquote><p>“<strong>人子來</strong>，<strong><mark>爲要尋找、拯救失喪的人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/19/#L10">路 19:10</a>)</p></blockquote><p>不過，並非所有人都會得救：<a href="https://bibleox.com/ru/ru/w/спасутся-не-все">並非所有人都得救</a></p>
