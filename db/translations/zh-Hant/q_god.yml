- src: Бог-безначальный
  path: Qg8A_無始的上帝
  title: 無始的上帝
  copy_cover: true
  body: <blockquote><p>“父老啊，我曾寫信給你們，因爲你們認識<strong>那從起初原有的</strong>。少年人哪，我曾寫信給你們，因爲你們剛強，上帝的道常存在你們心裏，你們也勝了那惡者。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L14">約壹 2:14</a>)</p></blockquote><p>上帝是一切有開始之物的起始：</p><blockquote><p>“太初有道，道與上帝同在，道就是上帝。 &lt;…&gt; 萬物是藉着他造的；<strong>凡被造的，沒有一樣不是藉着他造的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1,3">約 1:1,3</a>)</p></blockquote><p>祭司麥基洗德是上帝之子的預表——無生之始、無命之終（無始的）：</p><blockquote><p>“他無父、無母、無族譜、<strong>無生之始、無命之終，乃是與上帝的兒子相似</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L3">希 7:3</a>)</p></blockquote>
  meta_desc: 上帝是一切有開始之物的起始
