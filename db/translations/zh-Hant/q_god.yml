- src: Бог-не-похож-на-человека-внешне
  path: Qg14T_上帝不像人的外貌
  title: 上帝不像人的外貌
  copy_cover: true
  body: <p>雖然上帝照著自己的形像造了人：</p><blockquote><p>“<strong>上帝就照著自己的形像造人</strong>，乃是照著他的形像造男造女。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L27">創 1:27</a>)</p></blockquote><p>但這並不是說，上帝在外形上像人。這並不是說，上帝有手、有腳、有眼睛、有耳朵等等：</p><blockquote><p>“<strong>你的眼豈是肉眼？你查看豈像人查看嗎？</strong> 你的日子豈像人的日子？你的年歲豈像人的年歲？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/10/#L4-5">伯 10:4-5</a>)</p></blockquote><blockquote><p>“耶和華說：「<strong>我的意念非同你們的意念，我的道路非同你們的道路</strong>。 天怎樣高過地，照樣，<strong>我的道路高過你們的道路，我的意念高過你們的意念</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/55/#L8-9">賽 55:8-9</a>)</p></blockquote><blockquote><p>“<strong>上帝非人</strong>，必不致說謊。也非人子，必不致後悔。他說話豈不照著行呢？他發言豈不要成就呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/23/#L19">民 23:19</a>)</p></blockquote><p>人<a href="https://bibleox.com/ru/ru/w/состав-человека">由靈、魂和身體組成</a>。但上帝不是由肉體組成的。上帝是個靈：</p><blockquote><p>“<strong>上帝是個靈</strong>，所以拜他的，必須用心靈和誠實拜他。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/4/#L24">約 4:24</a>)</p></blockquote><p>上帝根本不是由物質組成的，因爲在世界和物質被造之先，他已經存在：</p><blockquote><p>“太初有道，道與上帝同在，道就是上帝。 &lt;…&gt; 萬物是藉着他造的；<strong>凡被造的，沒有一樣不是藉着他造的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1,3">約 1:1,3</a>)</p></blockquote><p><hr></p><p><p><em>*這裏說的是上帝的本質。是的，上帝成了人（不是像人的人，而是真的人），從此我們也可以把他當作人來講論。然而，成爲人的上帝並沒有終止他先前所是的——上帝。這裏說的正是上帝的本質。</em></p></p>
  meta_desc: 上帝在外形上不像人——聖經引文
