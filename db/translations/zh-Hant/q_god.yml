- src: Бог-вечен
  path: Qg10A_永恆的上帝
  title: 永恆的上帝
  copy_cover: true
  body: <h2>永恆的上帝</h2><blockquote><p>“你豈不曾知道嗎？你豈不曾聽見嗎？<strong>永在的上帝耶和華</strong>，創造地極的主，並不疲乏，也不睏倦，他的智慧無法測度。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/40/#L28">賽 40:28</a>)</p></blockquote><blockquote><p>“亞伯拉罕在別是巴栽上一棵垂絲柳樹，又在那裏求告耶和華<strong>永生上帝</strong>的名。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/21/#L33">創 21:33</a>)</p></blockquote><blockquote><p>“你們當倚靠耶和華直到永遠，因爲<strong>耶和華是永久的磐石</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/26/#L4">賽 26:4</a>)</p></blockquote><blockquote><p>“因爲那至高至上、<strong>永遠長存</strong>、名爲聖者的如此說：「我住在至高至聖的所在，也與心靈痛悔、謙卑的人同居；要使謙卑人的靈甦醒，也使痛悔人的心甦醒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/57/#L15">賽 57:15</a>)</p></blockquote><blockquote><p>“惟耶和華<strong>坐著爲王，直到永遠</strong>；他已經爲審判設擺他的寶座。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/9/#L7">詩 9:7</a>)</p></blockquote><blockquote><p>“你們多峯多嶺的山哪，爲何斜看上帝所願居住的山？<strong>耶和華必住這山，直到永遠</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/68/#L16">詩 68:16</a>)</p></blockquote><blockquote><p>“你起初立了地的根基，天也是你手所造的。 <strong>天地都要滅沒，你卻要長存</strong>；天地都要如外衣漸漸舊了，你要將天地如裏衣更換，天地就都改變了。 <strong>惟有你永不改變，你的年數沒有窮盡</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/102/#L25-27">詩 102:25-27</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L10-12">希 1:10-12</a>)</p></blockquote><blockquote><p>“日頭不再作你白晝的光，月亮也不再發光照耀你；<strong>耶和華卻要作你永遠的光</strong>，你上帝要爲你的榮耀！ 你的日頭不再下落，你的月亮也不退縮；因爲耶和華必作你永遠的光，你悲哀的日子也完畢了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/60/#L19-20">賽 60:19-20</a>)</p></blockquote><blockquote><p>“我聽見那站在河水以上、穿細麻衣的，向天舉起左右手，指著<strong>活到永遠的主</strong>起誓說：「要到一載、二載、半載，打破聖民權力的時候，這一切事就都應驗了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/12/#L7">但 12:7</a>)</p></blockquote><h2>上帝直到永遠作王</h2><blockquote><p>“<strong>耶和華必作王，直到永永遠遠</strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/15/#L18">出 15:18</a>)</p></blockquote><blockquote><p>“惟耶和華是真上帝，是活上帝，是<strong>永遠的王</strong>！他一發怒，大地震動；他一惱恨，列國都擔當不起。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/10/#L10">耶 10:10</a>)</p></blockquote><blockquote><p>“我在夜間的異象中觀看，見<strong>有一位像人子的</strong>，駕著天雲而來，被領到亙古常在者面前； <strong>得了權柄、榮耀、國度</strong>，使各方、各國、各族的人都事奉他。<strong>他的權柄是永遠的，不能廢去，他的國必不敗壞</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/7/#L13-14">但 7:13-14</a>)</p></blockquote><blockquote><p>“上帝阿！<strong>你的寶座是永永遠遠的</strong>，你的國權是正直的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/45/#L6">詩 45:6</a>)</p></blockquote><blockquote><p>“他要<strong>作雅各家的王，直到永遠</strong>；<strong>他的國也沒有窮盡</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L33">路 1:33</a>)</p></blockquote><blockquote><p>“這樣，必叫你們豐豐富富的得以進入我們主救主耶穌基督<strong>永遠的國</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L11">彼後 1:11</a>)</p></blockquote><h2>上帝存在於時間之先，並貫穿全部時間（永恆的）</h2><blockquote><p>“上主並未允許聖者講論他的一切奇事，全能的上主建立了這些奇事，爲叫天地萬物愈發顯揚自己的光榮。&lt;…&gt; 他井然佈置了自己智慧的偉業，<strong>他從永遠直到永遠常常存在</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/42/#L17,21">德 42:17,21</a>)</p></blockquote><blockquote><p>“盼望那無謊言的上帝在<strong>萬古之先</strong>所應許的永生，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L2">多 1:2</a>)</p></blockquote>
  meta_desc: 上帝是永恆的：無始無終，直到永遠作王
