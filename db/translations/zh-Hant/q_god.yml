  path: Qg1T_上帝是唯一的上帝
  title: 上帝是唯一的上帝，沒有別的神
  copy_cover: true
  body: <h2>上帝是唯一的上帝，沒有別的神</h2><blockquote><p>“耶和華以色列的君，以色列的救贖主，萬軍之耶和華如此說：我是首先的，我是末後的，<strong>除我以外再沒有真神</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/44/#L6">賽 44:6</a>)</p></blockquote><blockquote><p>“我是耶和華，<strong>在我以外並沒有別神；除了我以外再沒有上帝</strong>。你雖不認識我，我必給你束腰。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L5">賽 45:5</a>)</p></blockquote><blockquote><p>“你們如今要知道：<strong>我，惟有我是上帝。在我以外並無別神</strong>。我使人死，我使人活；我損傷，我也醫治；並無人能從我手中救出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/32/#L39">申 32:39</a>)</p></blockquote><blockquote><p>“從日出之地到日落之處，使人都知道<strong>除了我以外，沒有別神。我是耶和華</strong>！在我以外並沒有別神。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L6">賽 45:6</a>)</p></blockquote><blockquote><p>“耶和華如此說，「埃及勞碌得來的和古實的貨物必歸你，身量高大的西巴人必投降你，也要屬你。他們必帶著鎖鍊過來隨從你，又向你下拜，祈求你說：『上帝真在你們中間，<strong>此外再沒有別神！再沒有別的上帝</strong>！』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L14">賽 45:14</a>)</p></blockquote><blockquote><p>“創造諸天的耶和華，製造成全大地的上帝，他創造堅定大地，並非使地荒涼，是要給人居住．他如此說：「<strong>我是耶和華，再沒有別神</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L18">賽 45:18</a>)</p></blockquote><blockquote><p>“你們要述說陳明你們的理，讓他們彼此商議。誰從古時指明？誰從上古述說？不是我耶和華嗎？<strong>除了我以外，再沒有上帝！我是公義的上帝，又是救主，除了我以外，再沒有別神</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L21">賽 45:21</a>)</p></blockquote><blockquote><p>“地極的人都當仰望我，就必得救。因爲<strong>我是上帝，再沒有別神</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L22">賽 45:22</a>)</p></blockquote><blockquote><p>“你們要追念上古的事，因爲<strong>我是上帝，並無別神；我是上帝，再沒有能比我的</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/46/#L9">賽 46:9</a>)</p></blockquote><blockquote><p>“君王遂大聲呼喊說：“上主，達尼爾的天主！你是偉大的，<strong>除你以外沒有別的神</strong>。”” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/14/#L41">但 14:41</a>)</p></blockquote><blockquote><p>“那文士對耶穌說：「夫子說，上帝是一位，實在不錯！<strong>除了他以外，再沒有別的上帝</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L32">可 12:32</a>)</p></blockquote><blockquote><p>“論到吃祭偶像之物，我們知道偶像在世上算不得什麼，也知道<strong>上帝只有一位，再沒有別的上帝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/8/#L4">林前 8:4</a>)</p></blockquote><h2>別的神不是神，而是鬼魔</h2><blockquote><p>“<strong>所祭祀的鬼魔</strong>，並非真神，乃是<strong>素不認識的神</strong>，<strong>是近來新興的</strong>，是你列祖所不畏懼的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/32/#L17">申 32:17</a>)</p></blockquote><blockquote><p>“把自己的兒女<strong>祭祀鬼魔</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/106/#L37">詩 106:37</a>)</p></blockquote><blockquote><p>“實在，你們觸怒了你們的造主，因爲你們<strong>給惡魔而不給天主獻祭</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/var/4/#L7">巴 4:7</a>)</p></blockquote><blockquote><p>“我乃是說：<strong>外邦人所獻的祭是祭鬼，不是祭上帝</strong>，我不願意你們與鬼相交。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L20">林前 10:20</a>)</p></blockquote><blockquote><p>“人豈可爲自己製造神呢？<strong>其實這不是神</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/16/#L20">耶 16:20</a>)</p></blockquote><blockquote><p>“「我怎能赦免你呢？你的兒女離棄我，又指著<strong>那不是神的</strong>起誓。我使他們飽足，他們就行姦淫，成羣的聚集在娼妓家裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/5/#L7">耶 5:7</a>)</p></blockquote><blockquote><p>“但從前你們不認識上帝的時候，是給那些<strong>本來不是神的</strong>作奴僕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L8">加 4:8</a>)</p></blockquote><blockquote><p>“<strong>外邦的神都屬虛無</strong>，惟獨耶和華創造諸天。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/96/#L5">詩 96:5</a>)</p></blockquote><blockquote><p>“「諸君，爲什麼作這事呢？我們也是人，性情和你們一樣！我們傳福音給你們，是叫你們<strong>離棄這些虛妄，歸向那創造天、地、海和其中萬物的永生上帝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/14/#L15">徒 14:15</a>)</p></blockquote><h3>它們不能救人</h3><blockquote><p>“你們從列國逃脫的人，要一同聚集前來。<strong>那些抬著雕刻木偶，禱告不能救人之神的，毫無知識</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L20">賽 45:20</a>)</p></blockquote>
