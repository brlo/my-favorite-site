- src: Бог-неизменен
  path: Qg7A_上帝永不改變
  title: 上帝永不改變
  copy_cover: true
  body: <p>在上帝沒有改變：</p><blockquote><p>“因我耶和華是<strong>不改變</strong>的，所以你們雅各之子沒有滅亡。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/3/#L6">瑪 3:6</a>)</p></blockquote><blockquote><p>“各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從衆光之父那裏降下來的；<strong>在他並沒有改變，也沒有轉動的影兒</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L17">雅 1:17</a>)</p></blockquote><blockquote><p>“<strong>上帝非人</strong>，必不致說謊。<strong>也非人子，必不致後悔</strong>。他說話豈不照著行呢？他發言豈不要成就呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/23/#L19">民 23:19</a>)</p></blockquote><blockquote><p>“你起初立了地的根基，天也是你手所造的。 天地都要滅沒，你卻要長存；天地都要如外衣漸漸舊了，你要將天地如裏衣更換，天地就都改變了。 <strong>惟有你永不改變，你的年數沒有窮盡</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/102/#L25-27">詩 102:25-27</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L10-12">希 1:10-12</a>)</p></blockquote><blockquote><p>“耶穌基督，<strong>昨日、今日、一直到永遠是一樣的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L8">希 13:8</a>)</p></blockquote><p>上帝自創造世界以來沒有改變：</p><blockquote><p>“上主並未允許聖者講論他的一切奇事，全能的上主建立了這些奇事，爲叫天地萬物愈發顯揚自己的光榮。&lt;…&gt; 他井然佈置了自己智慧的偉業，他從永遠直到永遠常常存在；對他，<strong>什麼也不能增加，什麼也不能減少</strong>；他不需要任何人的計謀。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/42/#L17,21-22">德 42:17,21-22</a>)</p></blockquote><p>上帝不廢棄自己的話：</p><blockquote><p>“盼望那<strong>無謊言的上帝</strong>在萬古之先所應許的永生，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L2">多 1:2</a>)</p></blockquote><blockquote><p>“我必不背棄我的約，<strong>也不改變我口中所出的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/89/#L34">詩 89:34</a>)</p></blockquote>
  meta_desc: 上帝永不改變——聖經引文
