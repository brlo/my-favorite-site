  copy_cover: true
  body: <ul><li><p>首先的，末後的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/44/#L6">賽 44:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/48/#L12">賽 48:12</a>）</p></li><li><p>你們祖宗的上帝，亞伯拉罕的上帝，以撒的上帝，雅各的上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L15">出 3:15</a>）</p></li><li><p>自有永有的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L14">出 3:14</a>）</p></li><li><p>愛（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L8">約壹 4:8</a>）</p></li><li><p>造他的主（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/149/#L2">詩 149:2</a>）</p></li><li><p>父（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/32/#L6">申 32:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/64/#L8">賽 64:8</a>）</p></li><li><p>救贖主（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/43/#L14">賽 43:14</a>）</p></li><li><p>醫治你的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/15/#L26">出 15:26</a>）</p></li><li><p>聖潔的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L8">利 21:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/11/#L44-45">利 11:44-45</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/40/#L25">賽 40:25</a>）</p></li><li><p>叫你們成爲聖的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/31/#L13">出 31:13</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/20/#L8">利 20:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L15,23">利 21:15,23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/22/#L9,16,32">利 22:9,16,32</a>）</p></li><li><p>自隱的上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L15">賽 45:15</a>）</p></li><li><p>公義、正直的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/32/#L4">申 32:4</a>）</p></li><li><p>誠實無僞的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/32/#L4">申 32:4</a>）</p></li><li><p>忌邪的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/34/#L14">出 34:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L5">出 20:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/4/#L24">申 4:24</a>、<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L9">申 5:9</a>）</p></li><li><p>擊打的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/7/#L9">結 7:9</a>）</p></li><li><p>光（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L46">約 12:46</a>）</p></li><li><p>烈火（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/4/#L24">申 4:24</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L29">希 12:29</a>）</p></li></ul><p>參見：<a href="https://bibleox.com/ru/ru/w/Христос-титулы">基督的名號</a></p><p>*本文尚待補充*</p>
