- src: Бог_бессмертен
  path: Qg11T_不朽的上帝
  title: 不朽的上帝
  copy_cover: true
  body: <blockquote><p>“我<strong>在叫萬物生活的上帝面前</strong>，並在向本丟彼拉多作過那美好見證的基督耶穌面前囑咐你： &lt;…&gt; 就是那<strong>獨一不死</strong>，住在人不能靠近的光裏，是人未曾看見，也是不能看見的，要將他顯明出來。但願尊貴和永遠的權能都歸給他。阿們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L13,16">提前 6:13,16</a>)</p></blockquote>
  meta_desc: 只有上帝是不朽的
