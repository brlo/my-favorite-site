- src: Бог_невидим
  path: Qg12A_不能看見的上帝
  title: 不能看見的上帝
  copy_cover: true
  body: <h2>上帝不能看見</h2><blockquote><p>“自從造天地以來，上帝的永能和神性是明明可知的，<strong>雖是眼不能見</strong>，但藉着所造之物就可以曉得，叫人無可推諉。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L20">羅 1:20</a>)</p></blockquote><blockquote><p>“此等不信之人，被這世界的神弄瞎了心眼，不叫基督榮耀福音的光照著他們。<strong>基督本是上帝的像</strong>。 &lt;…&gt; 我們這至暫至輕的苦楚，要爲我們成就極重無比、永遠的榮耀。 原來我們不是顧念所見的，乃是顧念所不見的；因爲所見的是暫時的，<strong>所不見的是永遠的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/4/#L4,17-18">林後 4:4,17-18</a>)</p></blockquote><blockquote><p>“愛子是<strong>那不能看見之上帝的像</strong>，是首生的，在一切被造的以先。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L15">西 1:15</a>)</p></blockquote><blockquote><p>“但願尊貴、榮耀歸與那不能朽壞、<strong>不能看見</strong>、永世的君王、<strong>獨一的上帝</strong>，直到永永遠遠。阿們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L17">提前 1:17</a>)</p></blockquote><blockquote><p>“就是那獨一不死，住在人不能靠近的光裏，是<strong>人未曾看見，也是不能看見的</strong>，要將他顯明出來。但願尊貴和永遠的權能都歸給他。阿們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L16">提前 6:16</a>)</p></blockquote><blockquote><p>“我們因著信，就知道諸世界是藉上帝話造成的，這樣，<strong>所看見的，並不是從顯然之物造出來的</strong>。 &lt;…&gt; 人非有信，就不能得上帝的喜悅；因爲到上帝面前來的人，必須信有上帝，且信他<strong>賞賜那尋求他的人</strong>。 &lt;…&gt; 他因著信，就離開埃及，不怕王怒；因爲他恆心忍耐，<strong>如同看見那不能看見的主</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L3,6,27">希 11:3,6,27</a>)</p></blockquote><blockquote><p>“<strong>從來沒有人見過上帝</strong>，我們若彼此相愛，上帝就住在我們裏面，愛他的心在我們裏面得以完全了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L12">約壹 4:12</a>)</p></blockquote><h2>基督道成肉身之後，上帝在人性中成爲可見的</h2><blockquote><p>“<strong>從來沒有人看見上帝</strong>，只有在父懷裏的獨生子將他表明出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>)</p></blockquote><p>詳見：<a href="https://bibleox.com/ru/ru/w/Сын-безначальный-начинается">無始的聖子降生了</a></p>
  meta_desc: 上帝不能看見，但藉着他所造的萬物可以知道
