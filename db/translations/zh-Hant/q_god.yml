- src: Бог-везде
  path: Qg9A_無所不在的上帝
  title: 無所不在的上帝
  copy_cover: true
  body: <blockquote><p>“這樣的知識奇妙，是我不能測的；至高，是我不能及的。 <strong>我往那裏去躲避你的靈？我往那裏逃躲避你的面？</strong> 我若<strong>升到天上，你在那裏</strong>；我若<strong>在陰間下榻，你也在那裏</strong>。 我若展開清晨的翅膀，飛到<strong>海極居住</strong>； 就是在那裏，你的手必引導我，你的右手也必扶持我。 我若說：「黑暗必定遮蔽我，我周圍的亮光必成爲黑夜，」 <strong>黑暗也不能遮蔽我使你不見</strong>，黑夜卻如白晝發亮。黑暗和光明，在你看都是一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/139/#L6-12">詩 139:6-12</a>)</p></blockquote><blockquote><p>“各人的功行，都在他面前，<strong>沒有什麼可瞞過他的眼目</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/39/#L24">德 39:24</a>)</p></blockquote>
  meta_desc: 上帝無處不在，沒有邊界
  menu:
    parent: 上帝
