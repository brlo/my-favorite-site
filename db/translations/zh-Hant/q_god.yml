  title: 全知的上帝
  copy_cover: true
  body: <h2>全知的上帝</h2><p>上帝是全知的（無所不知的、洞察一切的）：</p><blockquote><p>“並且被造的沒有一樣在他面前不顯然的；原來萬物在那與我們有關係的主眼前，<strong>都是赤露敞開的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/4/#L13">希 4:13</a>)</p></blockquote><blockquote><p>“我們的心若責備我們，<strong>上帝</strong>比我們的心大，<strong>一切事沒有不知道的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L20">約壹 3:20</a>)</p></blockquote><blockquote><p>“耶和華啊，<strong>你是知道的</strong>，求你記念我，眷顧我，向逼迫我的人爲我報仇，不要向他們忍怒取我的命，要知道我爲你的緣故受了凌辱。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/15/#L15">耶 15:15</a>)</p></blockquote><blockquote><p>“第三次對他說：「約翰的兒子西門，你愛我麼？」彼得因爲耶穌第三次對他說：『你愛我麼？』，就憂愁，對耶穌說：「主啊！<strong>你是無所不知的</strong>，你知道我愛你。」耶穌說：「你餵養我的羊。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/21/#L17">約 21:17</a>)</p></blockquote><blockquote><p>“「<strong>你知道萬事</strong>；你知道我這樣做，不是出於惡意，也不是出於驕傲，也不是出於虛榮……<strong>你明察萬事</strong>，知道我恨惡不義者的榮耀，憎惡未受割禮者和一切外邦人的牀榻。」” (<a href="https://bibleox.com/zh-Hant/ru/esf/4/#L17">斯 4:17</a>, )</p></blockquote><blockquote><p>“衆人都是從土來的，因爲，亞當就是用土造成的。<strong>上主以自己的絕大智慧，使衆人各有分別</strong>，使他們的道路各有不同。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/33/#L10-11">德 33:10-11</a>)</p></blockquote><blockquote><p>“以及全能上帝的氣息，他創造萬物，<strong>鑑察大地隱祕中的一切隱祕</strong>。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/16/#L63">厄四 16:63</a>, )</p></blockquote><blockquote><p>“各人的功行，都在他面前，<strong>沒有什麼可瞞過他的眼目</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/39/#L24">德 39:24</a>)</p></blockquote><blockquote><p>“實在，<strong>上主的神充滿了世界，包羅萬象，通曉一切語言</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/1/#L7">智 1:7</a>)</p></blockquote><h2>上帝知道未來</h2><blockquote><p>“<strong>全能者既定期罰惡</strong>，爲何不使認識他的人看見那日子呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/24/#L1">伯 24:1</a>)</p></blockquote><blockquote><p>“上主並未允許聖者講論他的一切奇事，全能的上主建立了這些奇事，爲叫天地萬物愈發顯揚自己的光榮。他窮究深淵和人心，看透衆人的詭計。因爲，<strong>至高者通達各種學問，明察時代的徵兆，陳述過去和未來的世事，揭露隱祕的事蹟</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/42/#L17-19">德 42:17-19</a>)</p></blockquote><h2>上帝知道人的心思、情感和願望</h2><blockquote><p>“<strong>耶和華見</strong>人在地上罪惡很大，<strong>終日所思想的盡都是惡</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/6/#L5">創 6:5</a>)</p></blockquote><blockquote><p>“主啊！<strong>我的心願都在你面前</strong>；我的嘆息不向你隱瞞。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/38/#L9">詩 38:9</a>)</p></blockquote><blockquote><p>“上帝豈不鑑察這事麼？因爲<strong>他曉得人心裏的隱祕</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/44/#L21">詩 44:21</a>)</p></blockquote><blockquote><p>“我兒所羅門哪，你當認識耶和華你父的上帝，誠心樂意地事奉他。因爲<strong>他鑑察衆人的心，知道一切心思意念</strong>。你若尋求他，他必使你尋見；你若離棄他，他必永遠丟棄你！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/28/#L9">代上 28:9</a>)</p></blockquote><blockquote><p>“求你從天上你的居所垂聽赦免。你是知道人心的，要照各人所行的待他們（<strong>惟有你知道世人的心</strong>），” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/6/#L30">代下 6:30</a>)</p></blockquote><blockquote><p>“主<strong>知道世人的一切行爲、圖謀、意念和心思</strong>。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/16/#L55">厄四 16:55</a>, )</p></blockquote><blockquote><p>“上主並未允許聖者講論他的一切奇事，全能的上主建立了這些奇事，爲叫天地萬物愈發顯揚自己的光榮。<strong>任何思想不能逃過他，連一句話也不能隱瞞他</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/42/#L17,20">德 42:17,20</a>)</p></blockquote><blockquote><p>“<strong>耶穌知道他們的心意</strong>，就說：「你們爲什麼<strong>心裏懷著惡念</strong>呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/9/#L4">太 9:4</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/5/#L22">路 5:22</a>)</p></blockquote><blockquote><p>“<strong>耶穌知道他們的意念</strong>，就對他們說：「凡一國自相紛爭，就成爲荒場；一城一家自相紛爭，必站立不住。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L25">太 12:25</a>)</p></blockquote><blockquote><p>“<strong>耶穌卻知道他們的意念</strong>，就對那枯乾一隻手的人說：「起來！站在當中。」那人就起來，站著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L8">路 6:8</a>)</p></blockquote><blockquote><p>“<strong>耶穌看出他們心中的議論</strong>，就領一個小孩子來，叫他站在自己旁邊，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L47">路 9:47</a>)</p></blockquote><blockquote><p>“<strong>他曉得他們的意念</strong>，便對他們說：「凡一國自相紛爭，就成爲荒場；凡一家自相紛爭，就必敗落。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L17">路 11:17</a>)</p></blockquote><blockquote><p>“衆人就禱告說：「主啊，<strong>你知道萬人的心</strong>。求你從這兩個人中，指明你所揀選的是誰，叫他得這使徒的位分。這位分猶大已經丟棄，往自己的地方去了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L24">徒 1:24</a>)</p></blockquote><blockquote><p>“<strong>知道人心的上帝</strong>也爲他們作了見證，賜聖靈給他們，正如給我們一樣；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L8">徒 15:8</a>)</p></blockquote><h2>上帝知道人的一切罪</h2><blockquote><p>“上帝啊，我的愚昧，你原知道；<strong>我的罪愆不能隱瞞</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/69/#L5">詩 69:5</a>)</p></blockquote>
  meta_desc: 上帝知道萬事：過去和未來、人的心思意念和罪
