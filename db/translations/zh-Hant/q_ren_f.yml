  path: QR14A_靈魂不朽
  title: 靈魂不朽
  copy_cover: true
  body: <h2>身體與靈魂</h2><h3>逼迫者不能殺死靈魂</h3><p>主耶穌基督說不要怕逼迫者，因爲他們只能殺死身體，卻不能殺死靈魂，不能傷害靈魂。否認靈魂死後存在的人聲稱，靈魂與身體一同死亡，如此則逼迫者殺死的不只是身體，也是靈魂——但這與基督的話相矛盾：</p><blockquote><p>“<strong>那殺身體</strong><strong><mark>不能殺靈魂的</mark></strong>，不要怕他們；惟有能把身體和靈魂都滅在地獄裏的，正要怕他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L28">太 10:28</a>)</p></blockquote><blockquote><p>“我的朋友，我對你們說：<strong><mark>那殺身體以後不能再作什麼的，不要怕他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L4">路 12:4</a>)</p></blockquote><h3>已死的先知摩西的靈魂在大博爾山顯現</h3><p>救主在大博爾山顯聖容的時刻，使徒們看見了已經死去的先知摩西顯現，正與基督談論他即將面臨的十字架苦難。也就是說，先知雖然死了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/34/#L7">申 34:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/1/#L2">書 1:2</a>）（見<a href="#HH-上帝复活了先知摩西">下文註釋</a>），卻沒有消失，也沒有失去知覺：他正<strong>與基督交談</strong>：</p><blockquote><p>“忽然，有<strong><mark>摩西</mark></strong>，以利亞向他們顯現，<strong><mark>同耶穌說話</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/17/#L3">太 17:3</a>)</p></blockquote><blockquote><p>“正禱告的時候，他的面貌就改變了，衣服潔白放光。 <strong><mark>忽然有摩西、以利亞兩個人同耶穌說話</mark></strong>； 他們在榮光裏顯現，<strong><mark>談論耶穌去世的事</mark></strong>，就是他在耶路撒冷將要成的事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L29-31">路 9:29-31</a>)</p></blockquote><h3>使徒論死後的生命</h3><p>使徒保羅說，當地上的帳幕（身體）拆毀時，我們有天上永存的房屋：</p><blockquote><p>“我們原知道，<strong><mark>我們這地上的帳棚若拆毀了</mark></strong>，<strong><mark>必得上帝所造，不是人手所造，在天上永存的房屋</mark></strong>。 &lt;…&gt; 我們在這帳棚裏嘆息勞苦，<strong><mark>並非願意脫下這個，乃是願意穿上那個</mark></strong>，好叫這必死的被生命吞滅了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L1,4">林後 5:1,4</a>)</p></blockquote><p><hr></p><p>在另一處——或許是最重要的一處——使徒寫道，他情願快些死去，以便明確地進入與上帝同在的生命，他稱死亡爲「益處」。如果使徒死後就消失或沉睡，那他什麼也沒有獲得，只是失去（知覺）。那樣的話，急忙去死、去進入無所作爲的狀態就沒有任何意義了。更合理的做法是：活著、傳道、建立教會、與上帝相通、幫助教會（<strong>儘可能長久地不撇下教會</strong>——這是靈魂不朽學說的反對者們一貫忽略的主要思想），住在地上的身體裏。但使徒知道自己將進入天上與上帝同在的生命，所以情願快些脫離身體中的地上生命：</p><blockquote><p>“因我活著就是基督，<strong><mark>我死了就有益處</mark></strong>。 但我在肉身活著，若成就我工夫的果子，我就不知道該挑選什麼。 我正在兩難之間，<strong><mark>情願離世與基督同在，因爲這是好得無比的</mark></strong>。 然而，我在肉身活著，爲你們更是要緊的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L21-24">腓 1:21-24</a>)</p></blockquote><p>*否認靈魂死後存在的人，通常忽略所提註釋中的論據，而說：「使徒不會察覺睡夢中飛逝的時間，會立刻在復活中與基督一同醒來」。然而，如果使徒並不是立刻進入與基督同在的生命，而只是進入無知覺的無所作爲，那麼，當使徒緊接著明明寫道住在肉身中更是要緊的時候，急忙<strong>撇下教會</strong>就沒有任何意義了。</p><p><hr></p><p>使徒出離身體時，相信他會到主那裏，因此再次表示寧願離開身體。他指出，無論是住在身內還是離開身外，重要的是蒙上帝喜悅：</p><blockquote><p>“所以，我們時常坦然無懼，並且曉得<strong><mark>我們住在身內，便與主相離</mark></strong>。 &lt;…&gt; 我們坦然無懼，是<strong><mark>更願意離開身體</mark></strong>與主同住。 所以，無論是住在身內，離開身外，我們立了志向，要得主的喜悅。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L6,8-9">林後 5:6,8-9</a>)</p></blockquote><p>使徒住在身體裏，如同住在聖殿中（<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>），但不久他必須離開身體：</p><blockquote><p>“我以爲應當<strong><mark>趁我還在這帳棚的時候</mark></strong>提醒你們，激發你們。 因爲知道<strong><mark>我脫離這帳棚的時候快到了</mark></strong>，正如我們主耶穌基督所指示我的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L13-14">彼後 1:13-14</a>)</p></blockquote><p>使徒寫道，他曾被提到天上——或是在身內，或是在身外：</p><blockquote><p>“我認得一個在基督裏的人，他前十四年被提到第三層天上去。<strong><mark>或在身內，我不知道，或在身外，我也不知道</mark></strong>，只有上帝知道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/12/#L2">林後 12:2</a>)</p></blockquote><p>使徒指出靈魂的永恆性：</p><blockquote><p>“所以，我們不喪膽。<strong><mark>外體雖然毀壞，內心卻一天新似一天</mark></strong>。 &lt;…&gt; 原來我們不是顧念所見的，乃是顧念所不見的；因爲所見的是暫時的，<strong><mark>所不見的是永遠的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/4/#L16,18">林後 4:16,18</a>)</p></blockquote><h3>受審判的是活<strong>在身體裏</strong>時所做的行爲，而不是身體之外的行爲</h3><p>上帝所要審判的，只是人在身體中活著時所做的事：</p><blockquote><p>“因爲我們衆人必要在基督臺前顯露出來，叫各人<strong><mark>按著本身所行的</mark></strong>，或善或惡受報。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><h3>舊約的記述</h3><p>認爲人的死不僅是身體的毀滅、也是靈魂的毀滅，這種想法是不正確的：</p><blockquote><p>“<strong>惡人們胡思亂想自語說</strong>：“我們的生命又短促，又多愁；人的死期一到，又沒有辦法補救，也從不見有人從陰府回來。我們原是偶然而生，過後我們又好像未曾生存過；我們鼻中的氣息只是一陣煙霧，思想亦不過是心動迸出的火花；<strong>火花一旦熄滅，身軀即變成灰土，魂魄即像輕風消散</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/2/#L1-3">智 2:1-3</a>)</p></blockquote><p>同時：</p><blockquote><p>“<strong>邪曲的思想，使人離開天主</strong>；愚人試探全能者，只有使自己蒙羞，” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/1/#L3">智 1:3</a>)</p></blockquote><blockquote><p>“<strong>義人的靈魂在天主手裏</strong>，痛苦不能傷害他們。<strong>在愚人看來，他們算是死了</strong>，認爲他們去世是受了懲罰，<strong>離我們而去，彷彿是歸於泯滅</strong>；其實，<strong>他們是處於安寧中</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/3/#L1-3">智 3:1-3</a>)</p></blockquote><h2>對否認死後生命的撒都該人的駁斥</h2><p>在所有猶太黨派（法利賽人、撒都該人、艾賽尼人等）中，只有一派——撒都該人——相信人死後歸於消失（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/23/#L8">徒 23:8</a>）。主嚴厲地駁斥他們，指責他們的謬誤和不明白聖經：</p><blockquote><p>“耶穌回答說：「<strong><mark>你們錯了，因爲不明白聖經，也不曉得上帝的大能</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/22/#L29">太 22:29</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝不是死人的上帝，乃是活人的上帝</mark></strong>。<strong><mark>你們是大錯了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L27">可 12:27</a>)</p></blockquote><h2>耶穌基督的人性靈魂</h2><p>主耶穌基督死後，他的靈魂下到了陰間：</p><blockquote><p>“因爲<strong><mark>你必不將我的靈魂撇在陰間</mark></strong>，也不叫你的聖者見朽壞。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/16/#L10">詩 16:10</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L27">徒 2:27</a>)</p></blockquote><blockquote><p>“就預先看明這事，講論基督復活說：『<strong><mark>他的靈魂不撇在陰間</mark></strong>；他的肉身也不見朽壞。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L31">徒 2:31</a>)</p></blockquote><p>在陰間，基督向那些從世界洪水時代起就在那裏的神魂（靈魂）宣講：</p><blockquote><p>“因基督也曾一次爲罪受苦，就是義的代替不義的，爲要引我們到上帝面前。<strong><mark>按著肉體說，他被治死；按著靈性說，他復活了</mark></strong>。 <strong><mark>他藉這靈曾去傳道給那些在監獄裏的靈聽</mark></strong>， 就是那從前在<strong><mark>挪亞預備方舟、上帝容忍等待的時候</mark></strong>，不信從的人。當時進入方舟，藉着水得救的不多，只有八個人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L18-20">彼前 3:18-20</a>)</p></blockquote><blockquote><p>“他們必在那將要審判活人死人的主面前交賬。 爲此，<strong><mark>就是死人也曾有福音傳給他們</mark></strong>，要叫他們的肉體按著人受審判，他們的靈性卻靠上帝活著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L5-6">彼前 4:5-6</a>)</p></blockquote><blockquote><p>“所以經上說：『他升上高天的時候，擄掠了仇敵，將各樣的恩賜賞給人。』 （<strong><mark>既說升上，豈不是先降在地下嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L8-9">弗 4:8-9</a>)</p></blockquote><p>最終，基督掌管死人，也掌管活人：</p><blockquote><p>“<strong><mark>因此基督死了，又活了，爲要作死人並活人的主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L9">羅 14:9</a>)</p></blockquote><h2>義人死後在天上的生命</h2><p>爲基督被殺的靈魂與他在天上同活，並且知道地上發生的事（他們的冤至今未伸）：</p><blockquote><p>“揭開第五印的時候，我看見在祭壇底下，<strong><mark>有爲上帝的道併爲作見證被殺之人的靈魂</mark></strong>， 大聲喊著說：「<strong><mark>聖潔真實的主啊！你不審判住在地上的人，給我們伸流血的冤，要等到幾時呢</mark></strong>？」 <strong><mark>於是有白衣賜給他們各人</mark></strong>，又有話對他們說：「還要安息片時，<strong><mark>等著一同作僕人的和他們的弟兄，也像他們被殺，滿足了數目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>)</p></blockquote><h2>爲基督殉道的人住在天上</h2><blockquote><p>“弟兄勝過牠，是因羔羊的血和<strong><mark>自己所見證的道</mark></strong>。<strong><mark>他們雖至於死，也不愛惜性命</mark></strong>。 所以<strong><mark>諸天和住在其中的</mark></strong>，你們都快樂吧！只是地與海有禍了，因爲魔鬼知道自己的時候不多，就氣忿忿的下到你們那裏去了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/12/#L11-12">啟 12:11-12</a>)</p></blockquote><p>義人住在天上，而我們這些住在地上的人，如今就已走近天上凱旋的教會——走近義人的神魂：</p><blockquote><p>“<strong><mark>你們乃是來到</mark></strong>錫安山，永生上帝的城邑，就是<strong><mark>天上的耶路撒冷</mark></strong>。那裏有千萬的天使， 有名錄在天上<strong><mark>諸長子之會所共聚的總會</mark></strong>，有審判衆人的上帝和<strong><mark>被成全之義人的靈魂</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote><p>常保童身的人無論基督往哪裏去都跟隨他：</p><blockquote><p>“<strong><mark>這些人未曾沾染婦女</mark></strong>，<strong><mark>他們原是童身</mark></strong>。<strong><mark>羔羊無論往那裏去，他們都跟隨他</mark></strong>。他們是從人間買來的，作初熟的果子歸與上帝和羔羊。 在他們口中察不出謊言來，他們是沒有瑕疵的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L4-5">啟 14:4-5</a>)</p></blockquote><p>死人受審判，陰間交出在它裏面的死人：</p><blockquote><p>“<strong><mark>我又看見死了的人</mark></strong>，無論大小，都站在寶座前。案卷展開了，並且另有一卷展開，就是生命冊；<strong><mark>死了的人都憑著這些案卷所記載的，照他們所行的受審判</mark></strong>。 於是海交出其中的死人，<strong><mark>死亡和陰間也交出其中的死人</mark></strong>，他們都照各人所行的受審判。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L12-13">啟 20:12-13</a>)</p></blockquote><h2>批評</h2><h3>上帝復活了先知摩西？</h3><p>東正教徒爲靈魂死後有知覺的存在辯護，提出這樣的論據：先知摩西雖然死了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/34/#L7">申 34:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/1/#L2">書 1:2</a>），卻顯現並<strong>與基督交談</strong>：</p><blockquote><p>“忽然，有<strong><mark>摩西</mark></strong>，以利亞向他們顯現，<strong><mark>同耶穌說話</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/17/#L3">太 17:3</a>)</p></blockquote><p>反對東正教會的人（特別是基督復臨安息日會信徒）回答說，這彷彿是因爲上帝接升並復活了先知摩西。他們所依據的不是聖經，而是僞經《摩西昇天記》（因爲他們無法直接引用懷愛倫的話）。</p><p>我們（他們也同樣）不認爲僞經是有權威的文本。但問題在於，即便在這部僞經中——至少在保存下來的部分裏——也沒有關於先知摩西復活的話。相反，書中將這樣的話歸於摩西：他要「歸到他列祖那裏」（<a href="https://azbyka.ru/otechnik/Biblia2/apokrificheskie-apokalipsisy/15#sel=15:41,15:57;27:1,27:7">來源</a>）。</p><p>此外，先知的復活與聖經相矛盾，因爲正是基督——死者中的初熟果子：</p><blockquote><p>“但基督已經從死裏復活，<strong><mark>成爲睡了之人初熟的果子</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L20">林前 15:20</a>)</p></blockquote><p>我們也知道，沒有一個人（這話是對人說的）升過天，沒有一個先知升過天：</p><blockquote><p>“<strong><mark>除了從天降下仍舊在天的人子，沒有人升過天</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L13">約 3:13</a>)</p></blockquote><blockquote><p>“弟兄們，先祖大衛的事，我可以明明地對你們說，他死了，也葬埋了，並且他的墳墓直到今日還在我們這裏。 &lt;…&gt; <strong><mark>大衛並沒有升到天上</mark></strong>，但自己說：『主對我主說：你坐在我的右邊，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L29,34">徒 2:29,34</a>)</p></blockquote><p>關於在基督十字架祭獻和他的復活之前，所有的人死後都下到陰間的詳情：</p><p><a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">在基督祭獻之前，舊約的義人們下到陰間</a></p><h3>靈魂不朽的學說就是相信魔鬼所說「不一定死」的話嗎？</h3><p>靈魂學說的反對者（復臨信徒）這樣控告東正教徒：上帝說「你們必定死」，而魔鬼說「你們不一定死」，彷彿這就意味著，相信靈魂死後存活的信仰就是相信魔鬼的話：「你們不一定死」。相應地，相信靈魂在身體死後存活的人，被他們控告爲相信魔鬼的謊言。</p><p>這控告聽起來響亮，但這一想法本身與上下文有嚴重的矛盾和問題。上帝說的不僅是「你們必定死」，而是說：你們喫的日子必定死——即在吃那禁樹果子的那一天：</p><blockquote><p>“耶和華上帝吩咐他說：「園中各樣樹上的果子，你可以隨意吃， 只是分別善惡樹上的果子，你不可吃，因爲<strong><mark>你吃的日子必定死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L16-17">創 2:16-17</a>)</p></blockquote><p>靈魂生命學說的反對者把「必定死」這句話理解爲最簡單直接的意思：身體的死亡、人一切生命活動的終止、人存在的終結（至少是有知覺的存在的終結）。</p><p>人在吃果子的那一天發生了這種被理解的死嗎？——沒有，亞當死得晚得多，活到九百三十歲（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/5/#L5">創 5:5</a>）。這意味著什麼？——意味著上帝所說的是另一種死。魔鬼所否認的也正是另一種死。</p><p>而如果不是這樣，那就不得不承認：上帝說人在吃果子的那天必死，是撒了謊，而魔鬼反倒說了實話——「你們不一定死」——因爲畢竟，那一天並沒有發生粗淺意義（身體意義）上的死亡。但我們無論如何不能承認：上帝（道路、真理、生命——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L6">約 14:6</a>）撒了謊，而魔鬼（說謊的、說謊之人的父——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L44">約 8:44</a>）說了實話。然而，靈魂學說反對者們的解釋恰恰把人引向這個結論。</p><p>爲了走出這個死衚衕，他們必定要把話語的一部分作比喻式的重新解釋：</p><ul><li><p>死亡本身按字面理解，</p></li><li><p>而死亡的日子卻不按字面理解。</p></li></ul><p>東正教會的解釋沒有這樣的缺陷：</p><ul><li><p>死亡的日子按字面理解，</p></li><li><p>死亡本身也按字面理解——只是針對人的屬靈狀態而言。不過，在身體狀態上確實也發生了變化：人至少看見了自己是赤身露體的。</p></li></ul><p>始祖確實在那天就死了，但這一死——不是消失，而是一種與上帝隔絕的狀態，一切罪人都處在這種狀態中。基督——上帝自己——也把沒有上帝的生命狀態稱爲死：</p><blockquote><p>“又有一個門徒對耶穌說：「主阿，容我先回去埋葬我的父親。」 耶穌說：「<strong><mark>任憑死人埋葬他們的死人</mark></strong>，你跟從我吧！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L21-22">太 8:21-22</a>)</p></blockquote><blockquote><p>“我實實在在的告訴你們，那聽我話又信差我來者的，就有永生，不至於定罪，<strong><mark>是已經出死入生了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L24">約 5:24</a>)</p></blockquote><blockquote><p>“你要寫信給撒狄教會的使者說：『那有上帝的七靈和七星的說：我知道你的行爲，<strong><mark>按名你是活的，其實是死的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L1">啟 3:1</a>)</p></blockquote><p>使徒們也這樣說。他們曾活在死的狀態中：</p><blockquote><p>“你們<strong><mark>死在過犯罪惡之中</mark></strong>，他叫你們活過來。 那時，你們在其中<strong><mark>行事爲人</mark></strong>，隨從今世的風俗，順服空中掌權者的首領，就是現今在悖逆之子心中運行的邪靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L1-2">弗 2:1-2</a>)</p></blockquote><blockquote><p>“那獨居無靠真爲寡婦的，是仰賴上帝，晝夜不住的祈求禱告。 但那好宴樂的寡婦，<strong><mark>正活著的時候也是死的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L5-6">提前 5:5-6</a>)</p></blockquote><p>也就是說，死的狀態在亞當和夏娃犯罪墮落之後立刻就來臨了——這是一種內在的、沒有上帝的生命狀態。在這個意義上，魔鬼說「你們不一定死」時撒了謊。他們正如上帝所說的那樣死了——就在那一天。</p><p>如此，這些控告並不嚴重——它們本身就帶有矛盾，並且脫離聖經的上下文。</p>
