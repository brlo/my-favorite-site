  title: 論斷
  copy_cover: true
  body: <p>主耶穌基督禁止論斷：</p><blockquote><p>“<strong><mark>你們不要論斷人</mark></strong>，免得你們被論斷。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L1">太 7:1</a>)</p></blockquote><blockquote><p>“<strong><mark>你們不要論斷人，就不被論斷</mark></strong>；<strong><mark>你們不要定人的罪，就不被定罪</mark></strong>；你們要饒恕人，就必蒙饒恕；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L37">路 6:37</a>)</p></blockquote><p>對那些自己滿身更大的罪、卻論斷別人的人，他說：</p><blockquote><p>“你自己眼中有梁木，怎能對你弟兄說『容我去掉你眼中的刺』呢？ <strong><mark>你這假冒爲善的人！先去掉自己眼中的梁木，然後才能看得清楚，去掉你弟兄眼中的刺</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L4-5">太 7:4-5</a>)</p></blockquote><p>同時，他教導要按公義的判斷來判斷：</p><blockquote><p>“不可按外貌斷定是非，<strong><mark>總要按公平斷定是非</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L24">約 7:24</a>)</p></blockquote><blockquote><p>“<strong><mark>不要作糊塗人，要明白主的旨意如何</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L17">弗 5:17</a>)</p></blockquote><blockquote><p>“<strong><mark>你們又爲何不自己審量什麼是合理的呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L57">路 12:57</a>)</p></blockquote><p>使徒們說到審判的必要：</p><blockquote><p>“因爲審判教外的人與我何干？<strong><mark>教內的人豈不是你們審判的嗎</mark></strong>？ 至於外人，有上帝審判他們。<strong><mark>你們應當把那惡人從你們中間趕出去</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L12-13">林前 5:12-13</a>)</p></blockquote><blockquote><p>“你們中間有彼此相爭的事，怎敢在不義的人面前求審，不在聖徒面前求審呢？ 豈不知聖徒要審判世界嗎？若世界爲你們所審，<strong><mark>難道你們不配審判這最小的事嗎</mark></strong>？ &lt;…&gt; 我說這話是要叫你們羞恥。<strong><mark>難道你們中間沒有一個智慧人能審斷弟兄們的事嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L1-2,5">林前 6:1-2,5</a>)</p></blockquote>
