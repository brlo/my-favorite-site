  title: 接觸死者
  copy_cover: true
  body: <h2>舊約中接觸死人的禁令</h2><p>接觸死人使人不潔（受玷污）。但親屬可以接觸自己死去的親人而不受玷污：</p><blockquote><p>“耶和華對摩西說：「你告訴亞倫子孫作祭司的說：『<strong><mark>祭司不可爲民中的死人沾染自己</mark></strong>。 <strong><mark>除非爲他骨肉之親的父母、兒女、弟兄</mark></strong>， <strong><mark>和未曾出嫁作處女的姊妹，纔可以沾染自己</mark></strong>。 祭司既在民中爲首，<strong><mark>就不可從俗沾染自己</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L1-4">利 21:1-4</a>)</p></blockquote><blockquote><p>“<strong><mark>有幾個人因死屍而不潔淨，不能在那日守逾越節</mark></strong>。當日他們到摩西、亞倫面前，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/9/#L6">民 9:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡摸了人死屍、不潔淨自己的</mark></strong>，就玷污了耶和華的帳幕，這人必從以色列中剪除；因爲那除污穢的水沒有灑在他身上，<strong><mark>他就爲不潔淨，污穢還在他身上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/19/#L13">民 19:13</a>)</p></blockquote><blockquote><p>“<strong><mark>他們不可挨近死屍沾染自己</mark></strong>，<strong><mark>只可爲父親、母親、兒子、女兒、弟兄和未嫁人的姐妹沾染自己</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/44/#L25">結 44:25</a>)</p></blockquote><blockquote><p>“哈該又說：「<strong><mark>若有人因摸死屍染了污穢</mark></strong>，然後挨着這些物的那一樣，這物算污穢嗎？」祭司說：「<strong><mark>必算污穢</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ag/2/#L13">該 2:13</a>)</p></blockquote><h2>接觸義人的遺骸</h2><p>舊約時代，有人因接觸先知以利沙的聖髑而復活：</p><blockquote><p>“有人正葬死人，忽然看見一羣人，就把死人拋在以利沙的墳墓裏，<strong><mark>一碰著以利沙的骸骨，死人就復活站起來了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h2>猶太規條的廢除</h2><blockquote><p>“因爲聖靈和我們定意<strong><mark>不將別的重擔放在你們身上</mark></strong>，<strong><mark>惟有幾件事是不可少</mark></strong>的， 就是禁戒祭偶像的物和血，並勒死的牲畜和姦淫。這幾件你們若能自己禁戒不犯就好了。願你們平安！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L28-29">徒 15:28-29</a>)</p></blockquote><blockquote><p>“至於信主的外邦人，我們已經寫信擬定，<strong><mark>叫他們謹忌那祭偶像之物和血，並勒死的牲畜與姦淫</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/21/#L25">徒 21:25</a>)</p></blockquote><p>詳情：<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">猶太規條的廢除</a>。</p><h2>新約中接觸死人</h2><p>主耶穌基督接觸了睚魯死去的女兒：</p><blockquote><p>“<strong><mark>就拉著孩子的手，對她說</mark></strong>：「大利大，古米！」繙出來就是說：「閨女，我吩咐你起來！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/5/#L41">可 5:41</a>)</p></blockquote><p>按律法，基督死在十字架上之後，不能像接觸已死之人那樣接觸他。只有上帝之母作爲親屬可以這樣作（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L1-4">利 21:1-4</a>）。然而，我們不但不定神學家約翰、尼哥底母、亞利馬太人約瑟的罪，反而稱讚他們毫無畏懼、服事我們的救主：</p><blockquote><p>“<strong><mark>約瑟取了身體，用乾淨細麻布裹好</mark></strong>， <strong><mark>安放在自己的新墳墓裏</mark></strong>，就是他鑿在磐石裏的。他又把大石頭滾到墓門口，就去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L59-60">太 27:59-60</a>)</p></blockquote><blockquote><p>“<strong><mark>約翰的門徒聽見了，就來把他的屍首領去，葬在墳墓裏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L29">可 6:29</a>)</p></blockquote><blockquote><p>“既從百夫長得知實情，<strong><mark>就把耶穌的屍首賜給約瑟</mark></strong>。 <strong><mark>約瑟買了細麻布，把耶穌取下來</mark></strong>，用細麻布裹好，<strong><mark>安放在磐石中鑿出來的墳墓裏</mark></strong>，又滾過一塊石頭來擋住墓門。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/15/#L45-46">可 15:45-46</a>)</p></blockquote><blockquote><p>“既成就了經上指著他所記的一切話，<strong><mark>就把他從木頭上取下來，放在墳墓裏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L29">徒 13:29</a>)</p></blockquote><p>使徒接觸死去的孩子：</p><blockquote><p>“有一個少年人，名叫猶推古，坐在窗臺上睏倦沉睡。保羅講了多時，少年人睡熟了，就從三層樓上掉下去；扶起他來，已經死了。 <strong><mark>保羅下去，伏在他身上，抱著他說</mark></strong>：「你們不要發慌，他的靈魂還在身上。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L9-10">徒 20:9-10</a>)</p></blockquote>
