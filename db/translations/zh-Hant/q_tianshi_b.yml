  title: 魔鬼（撒但）
  copy_cover: true
  body: <h2>魔鬼（撒但）——墮落的天使</h2><p>魔鬼是上帝所造衆多天使中的一位，但他不願日後事奉上帝，也就是從上帝面前墮落了、墮落了：</p><blockquote><p>“「人子啊，你爲推羅王作起哀歌說：『主耶和華如此說：你無所不備，智慧充足，全然美麗。 你曾在伊甸上帝的園中，佩戴各樣寶石，就是紅寶石、紅璧璽、金鋼石、水蒼玉、紅瑪瑙、碧玉、藍寶石、綠寶石、紅玉和黃金，又有精美的鼓笛在你那裏，都是在你受造之日預備齊全的。 <strong><mark>你是那受膏遮掩約櫃的基路伯</mark></strong>，我將你安置在上帝的聖山上，你在發光如火的寶石中間往來。 你從受造之日所行的都完全，<strong><mark>後來在你中間又察出不義</mark></strong>。 因你貿易很多，就被強暴的事充滿，<strong><mark>以致犯罪</mark></strong>，所以我因你褻瀆聖地，就從上帝的山驅逐你。遮掩約櫃的基路伯阿，我已將你從發光如火的寶石中除滅。 <strong><mark>你因美麗心中高傲</mark></strong>，<strong><mark>又因榮光敗壞智慧</mark></strong>，<strong><mark>我已將你摔倒在地</mark></strong>，使你倒在君王面前，好叫他們目睹眼見。 你因罪孽衆多，貿易不公，就褻瀆你那裏的聖所。故此，<strong><mark>我使火從你中間發出燒滅你</mark></strong>，使你在所有觀看的人眼前變爲地上的爐灰。 各國民中，凡認識你的都必爲你驚奇。你令人驚恐，不再存留於世，直到永遠。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/28/#L12-19">結 28:12-19</a>)</p></blockquote><p>這些從上帝面前墮落的天使，用不同的詞來稱呼：鬼（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L31">太 8:31</a>）、魔（<a href="https://bibleox.com/zh-Hant/cn-cuvt/tov/6/#L8">多 6:8</a>）、撒但的差役（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/12/#L7">林後 12:7</a>）、污鬼（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L1">太 10:1</a>）、「黑鬼」（民間的稱呼）。撒但還被稱爲蛇（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L1">創 3:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/27/#L1">賽 27:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/12/#L9">啟 12:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L2">啟 20:2</a>）、龍（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/12/#L9">啟 12:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L2">啟 20:2</a>）、明亮之星（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/14/#L12">賽 14:12</a>）、鱷魚（利維坦）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/27/#L1">賽 27:1</a>）、這世界的王（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L31">約 12:31</a>）、惡者（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L19">太 13:19</a>）、謊言的靈（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/22/#L22">王上 22:22</a>）。魔鬼不是一種沒有位格的感覺，不是人心中某種抽象的衝動，也不是寓意。他是真實的存有，是一個位格。魔鬼是最初犯罪的存有：</p><blockquote><p>“<strong><mark>犯罪的是屬魔鬼，因爲魔鬼從起初就犯罪</mark></strong>。上帝的兒子顯現出來，爲要除滅魔鬼的作爲。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L8">約壹 3:8</a>)</p></blockquote><h2>魔鬼有自己的意志</h2><blockquote><p>“叫他們這<strong><mark>已經被魔鬼任意擄去的</mark></strong>，可以醒悟，脫離他的網羅。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L26">提後 2:26</a>)</p></blockquote><h2>魔鬼藉着把惡念提供給人而行動</h2><blockquote><p>“彼得說：「亞拿尼亞，<strong><mark>爲什麼撒但充滿了你的心，叫你欺哄聖靈</mark></strong>，把田地的價銀私自留下幾分呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L3">徒 5:3</a>)</p></blockquote><blockquote><p>“吃晚飯的時候<strong>（魔鬼已將賣耶穌的意思，放在西門的兒子加略人猶大心裏）</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/13/#L2">約 13:2</a>)</p></blockquote><h2>撒但從天上墜落了</h2><blockquote><p>“耶穌對他們說：「<strong><mark>我曾看見撒但從天上墜落，像閃電一樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L18">路 10:18</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/28/#L12-19">結 28:12-19</a>)</p></blockquote><h2>他拉走了另一些天使</h2><blockquote><p>“<strong><mark>就是天使犯了罪，上帝也沒有寬容，曾把他們丟在地獄</mark></strong>，交在黑暗坑中，等候審判；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L4">彼後 2:4</a>)</p></blockquote><h2>因著魔鬼，死亡進入了世界</h2><blockquote><p>“但<strong>因魔鬼的嫉妒，死亡才進入了世界</strong>；只有與他結緣的人，才經歷死亡。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/2/#L24">智 2:24</a>)</p></blockquote><h2>魔鬼——人的仇敵。尋找可吞吃、可拉人一同滅亡的人</h2><blockquote><p>“務要謹守、儆醒，因爲<strong><mark>你們的仇敵魔鬼，如同吼叫的獅子</mark></strong>，遍地遊行，<strong><mark>尋找可吞吃的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L8">彼前 5:8</a>)</p></blockquote><h2>魔鬼——人得救恩的敵對者</h2><blockquote><p>“這比喻乃是這樣：種子就是上帝的道。 那些在路旁的，就是人聽了道，<strong><mark>隨後魔鬼來，從他們心裏把道奪去</mark></strong>，<strong><mark>恐怕他們信了得救</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/8/#L11-12">路 8:11-12</a>)</p></blockquote><blockquote><p>“天使又指給我看，大祭司約書亞站在耶和華的使者面前，<strong><mark>撒但也站在約書亞的右邊，與他作對</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/3/#L1">亞 3:1</a>)</p></blockquote><h2>魔鬼裝作上帝的天使</h2><blockquote><p>“這也不足爲怪，因爲<strong><mark>連撒但也裝作光明的天使</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L14">林後 11:14</a>)</p></blockquote><h2>魔鬼逃離順服上帝、抵擋魔鬼的人</h2><blockquote><p>“故此，<strong><mark>你們要順服上帝。務要抵擋魔鬼，魔鬼就必離開你們逃跑了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L7">雅 4:7</a>)</p></blockquote><h2>魔鬼通曉聖經，並用它試探人、改變其意義</h2><blockquote><p>“魔鬼又領他到耶路撒冷去，叫他站在殿頂上，對他說：「<strong><mark>你若是上帝的兒子，可以從這裏跳下去</mark></strong>； 因爲經上記著說：『主要爲你吩咐他的使者保護你。 他們要用手托著你，免得你的腳碰在石頭上。』」 耶穌對他說：「經上說：『<strong><mark>不可試探主你的上帝</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/4/#L9-12">路 4:9-12</a>)</p></blockquote><h2>魔鬼——謊言之父</h2><blockquote><p>“你們是出於你們的父魔鬼，你們父的私慾，你們偏要行。他從起初是殺人的，不守真理，<strong><mark>因他心裏沒有真理</mark></strong>。他說謊是出於自己，因<strong><mark>他本來是說謊的，也是說謊之人的父</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L44">約 8:44</a>)</p></blockquote><h2>魔鬼能行奇蹟，能從天上降下火來</h2><blockquote><p>“耶和華對撒但說：「<strong><mark>凡他所有的都在你手中</mark></strong>，只是不可伸手加害於他。」於是撒但從耶和華面前退去。 &lt;…&gt; 他還說話的時候，又有人來說：「<strong><mark>上帝從天上降下火來，將羣羊，和僕人都燒滅了</mark></strong>；惟有我一人逃脫，來報信給你。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/1/#L12,16">伯 1:12,16</a>)</p></blockquote><blockquote><p>“這不法的人來，<strong><mark>是照撒但的運動，行各樣的異能、神蹟和一切虛假的奇事</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L9">帖後 2:9</a>)</p></blockquote><h2>魔鬼與上帝的天使爭辯</h2><blockquote><p>“<strong><mark>天使長米迦勒爲摩西的屍首與魔鬼爭辯的時候</mark></strong>，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L9">猶 1:9</a>)</p></blockquote><h2>墮落的天使們，爲永恆的刑罰預備了地方</h2><blockquote><p>“王又要向那左邊的說：『<strong><mark>你們這被咒詛的人，離開我，進入那爲魔鬼和他的使者所預備的永火裏去</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L41">太 25:41</a>)</p></blockquote><blockquote><p>“<strong><mark>那迷惑他們的魔鬼被扔在硫磺的火湖裏</mark></strong>，就是獸和假先知所在的地方，<strong><mark>他們必晝夜受痛苦，直到永永遠遠</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L10">啟 20:10</a>)</p></blockquote><h3>鬼知道這一點</h3><blockquote><p>“他們喊著說：「上帝的兒子，我們與你有什麼相幹？<strong><mark>時候還沒有到，你就上這裏來叫我們受苦嗎</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L29">太 8:29</a>)</p></blockquote><h2>鬼不尋求（甘願）遵行上帝的旨意，卻不能不服從上帝的命令</h2><blockquote><p>“衆人都驚訝，以致彼此對問說：「這是什麼事？是個新道理啊！<strong><mark>他用權柄吩咐污鬼，連污鬼也聽從了他</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L27">可 1:27</a>)</p></blockquote><blockquote><p>“鬼就央求耶穌說：「<strong><mark>若把我們趕出去，就打發我們進入豬羣吧</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L31">太 8:31</a>)</p></blockquote>
