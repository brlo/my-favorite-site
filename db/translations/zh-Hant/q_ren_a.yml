- src: состав-человека
  path: QR1A_人的構成
  title: 人的構成
  copy_cover: true
  body: <p>人性構成：</p><ol><li><p>血肉之體；</p></li><li><p>靈魂；</p></li><li><p>靈（靈魂的力量）。</p></li></ol><h2>肉體</h2><blockquote><p>“我在母胎中形成了肉軀，十月之久，在母血中凝結，由男精與合夢的慾樂而形成。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/7/#L1-2">智 7:1-2</a>)</p></blockquote><h2>靈魂與靈</h2><blockquote><p>“願賜平安的上帝親自使你們<strong><mark>全然成聖</mark></strong>。又願你們的<strong><mark>靈</mark></strong>與<strong><mark>魂</mark></strong>與<strong><mark>身子</mark></strong>得蒙保守，在我主耶穌基督降臨的時候，完全無可指摘。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L23">帖前 5:23</a>)</p></blockquote><blockquote><p>“但知<strong><mark>身上疼痛</mark></strong>，<strong><mark>心中悲哀</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/14/#L22">伯 14:22</a>)</p></blockquote><blockquote><p>“上帝阿，你是我的上帝！我要切切的尋求你；在乾旱疲乏無水之地，我渴想你，<strong><mark>我的心切慕你</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/63/#L1">詩 63:1</a>)</p></blockquote><blockquote><p>“我羨慕渴想耶和華的院宇，<strong><mark>我的心腸、我的肉體向永生上帝呼籲</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/84/#L2">詩 84:2</a>)</p></blockquote><blockquote><p>“仁慈的人<strong><mark>善待自己</mark></strong>；殘忍的人<strong><mark>擾害己身</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/11/#L17">箴 11:17</a>)</p></blockquote><h2>人死的時候，靈魂與身體分離</h2><blockquote><p>“<strong><mark>那殺身體不能殺靈魂的</mark></strong>，不要怕他們；惟有<strong><mark>能把身體和靈魂都滅在地獄裏的</mark></strong>，正要怕他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L28">太 10:28</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L4">路 12:4</a>)</p></blockquote><blockquote><p>“有一個少年人，名叫猶推古，坐在窗臺上睏倦沉睡。保羅講了多時，少年人睡熟了，就<strong><mark>從三層樓上掉下去</mark></strong>；扶起他來，<strong><mark>已經死了</mark></strong>。 保羅下去，伏在他身上，抱著他說：「<strong><mark>你們不要發慌，他的靈魂還在身上</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L9-10">徒 20:9-10</a>)</p></blockquote><h2>人死後，肉體朽壞，但靈魂繼續存在</h2><blockquote><p>“就預先看明這事，講論基督復活說：『<strong><mark>他的靈魂不撇在陰間</mark></strong>；<strong><mark>他的肉身也不見朽壞</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L31">徒 2:31</a>)</p></blockquote><p>關於<a href="https://bibleox.com/ru/ru/w/жизнь-души-после-смерти-тела">靈魂不朽</a>的引文。</p><h2>復活時，人自己原來的肉體將復原，靈魂回來，與自己的肉體重新結合</h2><blockquote><p>“我知道我的救贖主活著，末了必站立在地上。 <strong><mark>我這皮肉滅絕之後</mark></strong>，<strong><mark>我必在肉體之外得見上帝</mark></strong>。 我自己要見他，親眼要看他，並不像外人。我的心腸在我裏面消滅了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/19/#L25-27">伯 19:25-27</a>) <em>(和合本作「在肉體之外」；七十士譯本（俄文譯本所據）作「在肉體之內」，指復活時以自己的肉體得見上帝。)</em></p></blockquote>
