- src: человек-образ-Бога
  path: QR2T_人——上帝的形像
  title: 人——上帝的形像
  copy_cover: true
  body: <h2>人受造原是要作上帝的形像和樣式：</h2><blockquote><p>“上帝說：「我們要照著<strong><mark>我們的形像</mark></strong>，按著<strong><mark>我們的樣式</mark></strong>造人。使他們管理海里的魚、空中的鳥、地上的牲畜和全地，並地上所爬的一切昆蟲。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L26">創 1:26</a>)</p></blockquote><p>然而，受造時只是按形像：</p><blockquote><p>“<strong><mark>上帝就照著自己的形像造人</mark></strong>，<strong><mark>乃是照著他的形像造男造女</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L27">創 1:27</a>)</p></blockquote><blockquote><p>“亞當的後代記在下面。當上帝造人的日子，是<strong><mark>照著自己的樣式造的</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/5/#L1">創 5:1</a>)</p></blockquote><blockquote><p>“凡流人血的，他的血也必被人所流，<strong><mark>因爲上帝造人，是照自己的形像造的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/9/#L6">創 9:6</a>)</p></blockquote><h3>人裏面的上帝形像</h3><p>永遠的存在：</p><blockquote><p>“其實天主造了人，原是不死不滅的，使他成爲<strong>自己本性的肖像</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/2/#L23">智 2:23</a>)</p></blockquote><h3>人裏面的上帝樣式</h3><p>人只是被召走向與上帝相似：</p><blockquote><p>“我心裏柔和謙卑，你們當負我的軛，<strong><mark>學我的樣式</mark></strong>，這樣，你們心裏就必<strong><mark>得享安息</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L29">太 11:29</a>)</p></blockquote><blockquote><p>“因爲他預先所知道的人，就預先定下<strong><mark>效法他兒子的模樣</mark></strong>，使他兒子在許多弟兄中作長子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L29">羅 8:29</a>)</p></blockquote>
