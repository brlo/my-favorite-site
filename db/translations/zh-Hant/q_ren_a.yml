- src: человек-храм-Божий
  path: QR3T_人——上帝的殿
  title: 人——上帝的殿
  copy_cover: true
  body: <blockquote><p>“豈不知<strong><mark>你們的身子就是聖靈的殿</mark></strong>嗎？這聖靈是從上帝而來，住在你們裏頭的；並且你們不是自己的人，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L19">林前 6:19</a>)</p></blockquote><blockquote><p>“若有人毀壞上帝的殿，上帝必要毀壞那人，因爲上帝的殿是聖的，<strong><mark>這殿就是你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L17">林前 3:17</a>)</p></blockquote><blockquote><p>“豈不知<strong><mark>你們是上帝的殿</mark></strong>，上帝的靈住在你們裏頭嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L16">林前 3:16</a>)</p></blockquote><blockquote><p>“上帝的殿和偶像有什麼相同呢？因爲<strong><mark>我們是永生上帝的殿</mark></strong>，就如上帝曾說：『<strong><mark>我要在他們中間居住，在他們中間來往</mark></strong>；我要作他們的上帝，他們要作我的子民。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/6/#L16">林後 6:16</a>)</p></blockquote><blockquote><p>“猶太人便說：「這殿是四十六年才造成的，你三日內就再建立起來麼？」 <strong><mark>但耶穌這話是以他的身體爲殿</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L20-21">約 2:20-21</a>)</p></blockquote><blockquote><p>“但基督爲兒子，治理上帝的家；我們若將可誇的盼望和膽量堅持到底，<strong><mark>便是他的家了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/3/#L6">希 3:6</a>)</p></blockquote><blockquote><p>“各房靠他聯絡得合式，漸漸成爲主的聖殿。 <strong><mark>你們也靠他同被建造，成爲上帝藉着聖靈居住的所在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L21-22">弗 2:21-22</a>)</p></blockquote>
