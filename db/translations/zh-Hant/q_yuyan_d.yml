  title: 假基督
  copy_cover: true
  body: <h2>前言</h2><p>主耶穌基督兩千多年前，按古代先知的<a href="https://bibleox.com/ru/ru/w/пророчества-о-Христе">話語</a>，由至潔的童貞女馬利亞所生（不經男子）。他在少年時（十二歲）就已具有大智慧，令耶路撒冷聖殿中的教師們驚奇。到三十歲之前，耶穌基督順服於約瑟，作尋常的勞動；三十歲時出來傳道。關於這一時期的詳情：<a href="https://bibleox.com/ru/ru/w/Христос-жизнь-в-Палестине">基督——在巴勒斯坦的生活</a>。</p><p>之後，主耶穌基督傳道，教導了門徒（使徒們），被出賣，在十字架上受難，第三天復活，四十天之久向自己的跟隨者顯現，教導他們天國的事，然後昇天，坐在上帝的右邊，並應許要第二次再來——正如他昇天那樣——爲要審判全宇宙。再過十天（從復活算起的第五十天），他建立了自己的教會，並永遠地把聖靈賜給了教會。</p><h2>關於假基督</h2><h3>欺騙者</h3><p>主耶穌基督親自警告說，將有人冒充他來臨，許多人會相信這些欺騙者：</p><blockquote><p>“耶穌在橄欖山上坐著，門徒暗暗地來說：「請告訴我們，什麼時候有這些事？你降臨和世界的末了，有什麼預兆呢？」 耶穌回答說：「<strong><mark>你們要謹慎，免得有人迷惑你們</mark></strong>。 <strong><mark>因爲將來有好些人冒我的名來，說：『我是基督』，並且要迷惑許多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L3-5">太 24:3-5</a>)</p></blockquote><h2>關於基督的降臨</h2><h3>降臨——如同閃電</h3><p>然而，基督的第二次降臨將立刻被全世界的人知道，如同閃過的閃電：</p><blockquote><p>“人將要對你們說：『看哪，在那裏！看哪，在這裏！』<strong><mark>你們不要出去，也不要跟隨他們</mark></strong>！ 因爲<strong><mark>人子在他降臨的日子</mark></strong>，<strong><mark>好像閃電從天這邊一閃直照到天那邊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/17/#L23-24">路 17:23-24</a>)</p></blockquote><blockquote><p>“若有人對你們說，『看哪，基督在曠野裏』，<strong><mark>你們不要出去</mark></strong>；或說，『看哪，基督在內屋中』，<strong><mark>你們不要信</mark></strong>。 <strong><mark>閃電從東邊發出，直照到西邊；人子降臨，也要這樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L26-27">太 24:26-27</a>)</p></blockquote><h3>與所有天使一同降臨</h3><p>基督的第二次降臨將帶著父的榮耀，與所有聖潔的天使一同來臨：</p><blockquote><p>“你們要從我山的谷中逃跑，因爲山谷必延到亞薩。你們逃跑，必如猶大王烏西雅年間的人逃避大地震一樣。<strong><mark>耶和華我的上帝必降臨，有一切聖者同來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/14/#L5">亞 14:5</a>)</p></blockquote><blockquote><p>“<strong><mark>當人子在他榮耀裏</mark></strong>，<strong><mark>同著衆天使降臨的時候</mark></strong>，要坐在他榮耀的寶座上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31">太 25:31</a>)</p></blockquote><blockquote><p>“凡在這淫亂罪惡的世代，把我和我的道當作可恥的，人子在他父的榮耀裏，<strong><mark>同聖天使降臨的時候</mark></strong>，也要把那人當作可恥的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/8/#L38">可 8:38</a>)</p></blockquote><blockquote><p>“人子要在他父的榮耀裏，<strong><mark>同著衆使者降臨</mark></strong>；那時候，他要照各人的行爲報應各人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“亞當的七世孫以諾曾預言這些人說：『看哪，<strong><mark>主帶著他的千萬聖者降臨</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L14">猶 1:14</a>)</p></blockquote><blockquote><p>“好使你們<strong><mark>當我們主耶穌同他衆聖徒來的時候</mark></strong>，在我們父上帝面前心裏堅固，成爲聖潔，無可責備。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/3/#L13">帖前 3:13</a>)</p></blockquote><blockquote><p>“也必使你們這受患難的人與我們同得平安。那時，<strong><mark>主耶穌同他有能力的天使從天上在火焰中顯現</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L7">帖後 1:7</a>)</p></blockquote><h3>以已有的成人身體降臨</h3><p>基督不會再次由人所生，而是帶著他已有的身體來臨——那身體是他在公元一世紀由童貞女馬利亞上帝之母所生時獲得的。</p><blockquote><p>“說了這話，他們正看的時候，<strong><mark>他就被取上升，有一朵雲彩把他接去</mark></strong>，便看不見他了。 當他往上去，他們定睛望天的時候，忽然有兩個人身穿白衣，站在旁邊，說： 「加利利人哪，你們爲什麼站著望天呢？<strong><mark>這離開你們被接昇天的耶穌，你們見他怎樣往天上去，他還要怎樣來</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L9-11">徒 1:9-11</a>)</p></blockquote><h3>降臨是爲了審判</h3><p>主來不是爲了教導，而是按他第一次來時所已經賜下的話語施行審判：</p><blockquote><p>“棄絕我不領受我話的人，有審判他的；<strong><mark>就是我所講的道，在末日要審判他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L48">約 12:48</a>)</p></blockquote><blockquote><p>“人子要在他父的榮耀裏，同著衆使者降臨；那時候，<strong><mark>他要照各人的行爲報應各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“<strong><mark>當人子在他榮耀裏</mark></strong>，同著衆天使降臨的時候，<strong><mark>要坐在他榮耀的寶座上</mark></strong>。 <strong><mark>萬民都要聚集在他面前</mark></strong>。他要把他們分別出來，<strong><mark>好像牧羊的分別綿羊山羊一般</mark></strong>； 把綿羊安置在右邊，山羊在左邊。 &lt;…&gt; <strong><mark>這些人，要往永刑裏去</mark></strong>；<strong><mark>那些義人，要往永生裏去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-33,46">太 25:31-33,46</a>)</p></blockquote><blockquote><p>“<strong><mark>這正是上帝公義判斷的明證</mark></strong>，叫你們可算配得上帝的國，你們就是爲這國受苦。 上帝既是公義的，就必將患難報應那加患難給你們的人； 也必使你們這受患難的人與我們同得平安。<strong><mark>那時，主耶穌同他有能力的天使從天上在火焰中顯現</mark></strong>， <strong><mark>要報應那不認識上帝和那不聽從我主耶穌福音的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L5-8">帖後 1:5-8</a>)</p></blockquote>
