  title: 關於異端產生的預言
  copy_cover: true
  body: <h2>基督教中將出現許多異端</h2><blockquote><p>“<strong><mark>將來有好些人冒我的名來</mark></strong>，說『我是基督』，<strong><mark>並且要迷惑許多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/13/#L6">可 13:6</a>)</p></blockquote><blockquote><p>“<strong><mark>且有好些假先知起來，迷惑多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L11">太 24:11</a>)</p></blockquote><blockquote><p>“親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於上帝的不是，因爲<strong><mark>世上有許多假先知已經出來了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L1">約壹 4:1</a>)</p></blockquote><h2>異端將非常廣泛地傳播</h2><blockquote><p>“<strong><mark>他們的話如同毒瘡，越爛越大</mark></strong>；其中有許米乃和腓理徒， <strong><mark>他們偏離了真道，說復活的事已過</mark></strong>，就敗壞好些人的信心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L17-18">提後 2:17-18</a>)</p></blockquote><blockquote><p>“從前在百姓中有假先知起來，<strong><mark>將來在你們中間也必有假師傅，私自引進陷害人的異端</mark></strong>，連買他們的主他們也不承認，自取速速地滅亡。 <strong><mark>將有許多人隨從他們邪淫的行爲</mark></strong>，便叫真道因他們的緣故被毀謗。 <strong><mark>他們因有貪心，要用捏造的言語在你們身上取利</mark></strong>。他們的刑罰，自古以來並不遲延；他們的滅亡，也必速速來到。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L1-3">彼後 2:1-3</a>)</p></blockquote><h2>異端的社羣將脫離教會及其信仰的合一</h2><blockquote><p>“小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來，<strong><mark>現在已經有好些敵基督的出來了</mark></strong>，從此我們就知道如今是末時了。 <strong><mark>他們從我們中間出去，卻不是屬我們的</mark></strong>；若是屬我們的，就必仍舊與我們同在；他們出去顯明都不是屬我們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18-19">約壹 2:18-19</a>)</p></blockquote><blockquote><p>“他們曾對你們說過：『<strong><mark>末世必有好譏誚的人</mark></strong>隨從自己不敬虔的私欲而行。』 <strong><mark>這就是那些引人結黨、屬乎血氣、沒有聖靈的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L18-19">猶 1:18-19</a>)</p></blockquote><h2>假師傅的任務——把信徒從教會中擄走並帶他們隨己而行</h2><blockquote><p>“我知道我去之後，<strong><mark>必有兇暴的豺狼進入你們中間</mark></strong>，不愛惜羊羣。 <strong><mark>就是你們中間，也必有人起來，說悖謬的話，要引誘門徒跟從他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L29-30">徒 20:29-30</a>)</p></blockquote><h2>假師傅的手法</h2><h3>1. 動聽的學說</h3><p>假師傅們將要編出動聽的學說，正是因爲他們的聽衆將尋求悅耳的學說，忍受不了純正的教導：</p><blockquote><p>“因爲時候要到，<strong><mark>人必厭煩純正的道理</mark></strong>，<strong><mark>耳朵發癢，就隨從自己的情慾，增添好些師傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L3">提後 4:3</a>)</p></blockquote><blockquote><p>“聖靈明說：在後來的時候，<strong><mark>必有人離棄真道，聽從那引誘人的邪靈和鬼魔的道理</mark></strong>。 這是因爲說謊之人的假冒，這等人的良心如同被熱鐵烙慣了一般。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L1-2">提前 4:1-2</a>)</p></blockquote><h3>2. 虛假的敬虔</h3><blockquote><p>“你該知道，<strong><mark>末世必有危險的日子來到</mark></strong>。 因爲那時人要專顧自己、貪愛錢財、自誇、狂傲、謗讟、違背父母、忘恩負義、心不聖潔、 &lt;…&gt; <strong><mark>有敬虔的外貌，卻背了敬虔的實意</mark></strong>，這等人你要躲開。 &lt;…&gt; 常常學習，終久不能明白真道。 從前雅尼和佯庇怎樣敵擋摩西，<strong><mark>這等人也怎樣敵擋真道</mark></strong>。他們的心地壞了，在真道上是可廢棄的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L1-2,5,7-8">提後 3:1-2,5,7-8</a>)</p></blockquote><blockquote><p>“<strong><mark>你們要防備假先知。他們到你們這裏來，外面披著羊皮，裏面卻是殘暴的狼</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L15">太 7:15</a>)</p></blockquote><h3>3. 展示性的奇蹟</h3><p>使徒們和古代基督徒被賜予豐富的行異能之力，不是爲了作秀，而是爲了益處：</p><blockquote><p>“<strong><mark>聖靈顯在各人身上，是叫人得益處</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L7">林前 12:7</a>)</p></blockquote><p>一小羣漁夫需要很大的幫助，才能作爲見證人，在短短一生中把傳道傳遍全世界。使徒們曾警告說，這些恩賜將要止息：</p><blockquote><p>“愛是永不止息。<strong><mark>先知講道之能，終必歸於無有；說方言之能，終必停止</mark></strong>；知識也終必歸於無有。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>)</p></blockquote><p>基督自己也斥責尋求奇蹟：</p><blockquote><p>“耶穌回答說：「<strong><mark>一個邪惡、淫亂的世代求看神蹟</mark></strong>，除了先知約拿的神蹟以外，再沒有神蹟給他們看。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L39">太 12:39</a>)</p></blockquote><p>在末後的時代，假先知將恰恰以奇蹟引誘人：</p><blockquote><p>“<strong><mark>因爲假基督、假先知將要起來，顯大神蹟、大奇事</mark></strong>。倘若能行，連選民也就迷惑了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L24">太 24:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/13/#L22">可 13:22</a>)</p></blockquote><p>結果，在審判時，許多信徒將確信自己得救正是因爲他們奉基督的名行異能、說預言、趕鬼。但他們受了欺騙，被教導行不法之事，基督不認識他們，把他們從自己面前趕走：</p><blockquote><p>“<strong><mark>當那日，必有許多人對我說</mark></strong>：『主阿，主阿，我們不是奉你的名傳道，奉你的名趕鬼，<strong><mark>奉你的名行許多異能嗎</mark></strong>？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>如何認出假先知</h2><p>他的預言不成就：</p><blockquote><p>“先知托耶和華的名說話，<strong><mark>所說的若不成就，也無效驗</mark></strong>，這就是耶和華所未曾吩咐的，是那先知擅自說的，你不要怕他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/18/#L22">申 18:22</a>)</p></blockquote><p>如果先知或作夢的向你顯個神蹟、奇蹟，或他的夢應驗了，但他召你去事奉別的神，那就不當聽他的話：</p><blockquote><p>“你們中間若有先知或是作夢的起來，<strong><mark>向你顯個神蹟奇事</mark></strong>， 對你說：『<strong><mark>我們去隨從你素來所不認識的別神</mark></strong>，事奉他吧！』<strong><mark>他所顯的神蹟奇事，雖有應驗</mark></strong>， <strong><mark>你也不可聽那先知或是那作夢之人的話</mark></strong>。因爲這是耶和華你們的上帝試驗你們，要知道你們是盡心、儘性愛耶和華你們的上帝不是。 <strong><mark>你們要順從耶和華你們的上帝</mark></strong>，敬畏他，謹守他的誡命，聽從他的話，事奉他，專靠他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/13/#L1-4">申 13:1-4</a>)</p></blockquote>
