  body: <p>這裏說的是那些想要孩子、卻因不育而不能有的人：</p><blockquote><p>“<strong>荒胎無罪，而又不知牀第罪惡的婦女，是有福的；到靈魂受眷顧的時候，她必富有果實。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/3/#L13">智 3:13</a>)</p></blockquote><blockquote><p>“更好是<strong>無子而有道德</strong>，因爲道德的記念，永存不朽，<strong>常爲天主和世人所賞識</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/4/#L1">智 4:1</a>)</p></blockquote>
