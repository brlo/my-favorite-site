  title: 預定（命運）
  copy_cover: true
  body: <h2>上帝願意人人得救</h2><blockquote><p>“這是好的，在上帝我們救主面前可蒙悅納。 <strong><mark>他願意萬人得救</mark></strong>，明白真道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L3-4">提前 2:3-4</a>)</p></blockquote><blockquote><p>“還是你藐視他豐富的恩慈、寬容、忍耐，不曉得<strong><mark>他的恩慈是領你悔改</mark></strong>呢？ <strong><mark>你竟任著你剛硬不悔改的心</mark></strong>，爲自己積蓄忿怒，以致上帝震怒，顯他公義審判的日子來到。 他必照各人的行爲報應各人。 凡<strong><mark>恆心行善</mark></strong>，尋求榮耀、尊貴和不能朽壞之福的，就以<strong><mark>永生</mark></strong>報應他們； 惟有結黨不順從真理，反順從不義的，就以忿怒、惱恨報應他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L4-8">羅 2:4-8</a>)</p></blockquote><h2>救恩不是強制發生的，而是向尋求的人敞開</h2><blockquote><p>“<strong><mark>人非有信，就不能得上帝的喜悅</mark></strong>；因爲到上帝面前來的人，必須信有上帝，<strong><mark>且信他賞賜那尋求他的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L6">希 11:6</a>)</p></blockquote><blockquote><p>“<strong><mark>我曾尋求耶和華，他就應允我</mark></strong>；救我脫離了一切的恐懼。 <strong><mark>凡仰望他的，便有光榮</mark></strong>；他們的臉，必不蒙羞。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L4-5">詩 34:4-5</a>)</p></blockquote><blockquote><p>“愛我的，我也愛他；<strong><mark>懇切尋求我的，必尋得見</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/8/#L17">箴 8:17</a>)</p></blockquote><blockquote><p>“我兒所羅門哪，你當認識耶和華你父的上帝，誠心樂意地事奉他。因爲他鑑察衆人的心，知道一切心思意念。<strong><mark>你若尋求他，他必使你尋見</mark></strong>；你若離棄他，他必永遠丟棄你！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/28/#L9">代上 28:9</a>)</p></blockquote><blockquote><p>“還是你藐視他豐富的恩慈、寬容、忍耐，不曉得<strong>他的恩慈是領你悔改</strong>呢？ <strong><mark>你竟任著你剛硬不悔改的心</mark></strong>，爲自己積蓄忿怒，以致上帝震怒，顯他公義審判的日子來到。 他必照各人的行爲報應各人。 凡<strong><mark>恆心行善</mark></strong>，尋求榮耀、尊貴和不能朽壞之福的，就以<strong><mark>永生</mark></strong>報應他們； 惟有結黨不順從真理，反順從不義的，就以忿怒、惱恨報應他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L4-8">羅 2:4-8</a>)</p></blockquote><h2>上帝憐惜罪人的滅亡，盡力拯救他們之中儘可能多的人</h2><blockquote><p>“主耶和華說，<strong><mark>惡人死亡，豈是我喜悅的嗎</mark></strong>？<strong><mark>不是喜悅他回頭離開所行的道存活嗎</mark></strong>？ &lt;…&gt; 你們還說：『主的道不公平！』以色列家啊，你們當聽，<strong><mark>我的道豈不公平嗎</mark></strong>？<strong><mark>你們的道豈不是不公平嗎</mark></strong>？ &lt;…&gt; 所以主耶和華說，以色列家阿，我必按你們各人所行的審判你們。<strong><mark>你們當回頭離開所犯的一切罪過</mark></strong>。這樣，罪孽必不使你們敗亡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/18/#L23,25,30">結 18:23,25,30</a>)</p></blockquote><blockquote><p>“你對他們說：『主耶和華說：我指著我的永生起誓，我斷不喜悅惡人死亡，<strong><mark>惟喜悅惡人轉離所行的道而活</mark></strong>。以色列家阿，<strong><mark>你們轉回，轉回吧</mark></strong>！<strong><mark>離開惡道，何必死亡呢</mark></strong>？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/33/#L11">結 33:11</a>)</p></blockquote><blockquote><p>“耶穌對他們說：「無病的人用不著醫生，<strong><mark>有病的人才用得著</mark></strong>； 我來本不是召義人悔改，<strong><mark>乃是召罪人悔改</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/5/#L31-32">路 5:31-32</a>)</p></blockquote><blockquote><p>“主所應許的尚未成就，有人以爲他是耽延，其實不是耽延，<strong><mark>乃是寬容你們</mark></strong>，<strong><mark>不願有一人沉淪，乃願人人都悔改</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L9">彼後 3:9</a>)</p></blockquote><h2>人滅亡，是由於自己不願意把自己的意志轉向上帝</h2><blockquote><p>“耶路撒冷啊，耶路撒冷啊！你常殺害先知，又用石頭打死那奉差遣到你這裏來的人。<strong><mark>我多次願意聚集你的兒女</mark></strong>，好像母雞把小雞聚集在翅膀底下，<strong><mark>只是你們不願意</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L37">太 23:37</a>)</p></blockquote><blockquote><p>“光來到世間，世人因自己的行爲是惡的，<strong><mark>不愛光倒愛黑暗</mark></strong>，定他們的罪就是在此。 <strong><mark>凡作惡的便恨光</mark></strong>，<strong><mark>並不來就光</mark></strong>，恐怕他的行爲受責備； <strong><mark>但行真理的必來就光</mark></strong>，要顯明他所行的是靠上帝而行。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L19-21">約 3:19-21</a>)</p></blockquote><blockquote><p>“還是你藐視他豐富的恩慈、寬容、忍耐，不曉得<strong>他的恩慈是領你悔改</strong>呢？ <strong><mark>你竟任著你剛硬不悔改的心</mark></strong>，爲自己積蓄忿怒，以致上帝震怒，顯他公義審判的日子來到。 他必照各人的行爲報應各人。 凡<strong><mark>恆心行善</mark></strong>，尋求榮耀、尊貴和不能朽壞之福的，就以<strong><mark>永生</mark></strong>報應他們； <strong><mark>惟有結黨不順從真理</mark></strong>，反順從不義的，就以忿怒、惱恨報應他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L4-8">羅 2:4-8</a>)</p></blockquote><h2>上帝預定得救的，是他<strong>預先知道</strong>的人（即預先知道他們會選擇）</h2><p>預定的發生並非不考慮人的行爲；上帝在時間之外預先知道這些行爲，並且正是基於這知識（預知）來預定。這是關鍵之處。預定不是隨機發生的，而恰恰是考慮到每個人在<strong>行出來之前</strong>上帝就已知道的行爲：</p><blockquote><p>“<strong><mark>因爲他預先所知道的人，就預先定下效法他兒子的模樣</mark></strong>，使他兒子在許多弟兄中作長子。 <strong><mark>預先所定下的人又召他們來</mark></strong>；所召來的人又稱他們爲義；所稱爲義的人又叫他們得榮耀。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L29-30">羅 8:29-30</a>)</p></blockquote><blockquote><p>“耶穌基督的使徒彼得，寫信給那分散在本都、加拉太、加帕多家、亞西亞、庇推尼寄居的， <strong><mark>就是照父上帝的先見被揀選</mark></strong>，藉着聖靈得成聖潔，以致順服耶穌基督，又蒙他血所灑的人：願恩惠、平安多多的加給你們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L1-2">彼前 1:1-2</a>)</p></blockquote><blockquote><p>“衆人都<strong>是從土來的</strong>，因爲亞當就是用土造成的。<strong>上主以自己的絕大智慧，使衆人各有分別</strong>，使他們的道路各有不同。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/33/#L10-11">德 33:10-11</a>)</p></blockquote><blockquote><p>“外邦人聽見這話，就歡喜了，讚美上帝的道；<strong><mark>凡預定得永生的人都信了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L48">徒 13:48</a>)</p></blockquote><h2>人的命運在上帝手中</h2><blockquote><p>“你的公義好像高山；<strong><mark>你的判斷如同深淵</mark></strong>。耶和華啊！人民、牲畜你都救護。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/36/#L6">詩 36:6</a>)</p></blockquote><blockquote><p>“<strong><mark>人的腳步爲耶和華所定</mark></strong>，人豈能明白自己的路呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/20/#L24">箴 20:24</a>)</p></blockquote><blockquote><p>“求王恩的人多，<strong><mark>定人事乃在耶和華</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/29/#L26">箴 29:26</a>)</p></blockquote><blockquote><p>“有如<strong>泥土在陶工手裏</strong>，可以任意捏造處置。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/33/#L13">德 33:13</a>)</p></blockquote><blockquote><p>“這也是出於萬軍之耶和華，<strong><mark>他的謀略奇妙</mark></strong>，他的智慧廣大。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/28/#L29">賽 28:29</a>)</p></blockquote><blockquote><p>“深哉，上帝豐富的智慧和知識！<strong><mark>他的判斷何其難測</mark></strong>！他的蹤跡何其難尋！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/11/#L33">羅 11:33</a>)</p></blockquote><h2>耶穌基督的十字架苦難是上帝所預定的</h2><blockquote><p>“希律和本丟彼拉多、外邦人和以色列民果然在這城裏聚集，要攻打你所膏的聖僕耶穌， <strong><mark>成就你手和你意旨所預定必有的事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L27-28">徒 4:27-28</a>)</p></blockquote><h2>上帝預先揀選了使徒保羅</h2><blockquote><p>“他又說：『<strong><mark>我們祖宗的上帝揀選了你</mark></strong>，叫你明白他的旨意，又得見那義者，聽他口中所出的聲音。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L14">徒 22:14</a>)</p></blockquote><h2>對異議的回應</h2><h3>“如果上帝願意人人得救，卻不是人人得救，那上帝就不是全能的”</h3><p>愛是自由的情感：強扭的瓜不甜。上帝願意他的受造物能夠愛上帝，因此賜給他們自由選擇上帝或不選擇上帝的可能：愛他，或者恨他。</p><p>上帝能拯救所有人嗎？能。上帝願意人人得救嗎？願意，但願他們以對上帝的愛這一品質得救。上帝不願意把恨上帝的人註定到與他同在的永生裏去，因此也不作他不願作的事。這使上帝不全能了嗎？——不，因爲上帝不願意強迫人愛。</p><p>愛人的上帝能賜給人自由地愛他或恨他的可能嗎？能。如果他不能賜選擇的自由，那還算是全能的嗎？</p>
