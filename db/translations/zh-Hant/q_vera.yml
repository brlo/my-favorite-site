  copy_cover: true
  body: <h2>萬民蒙召信基督——新約中的指示</h2><p>基督差遣使徒向萬民、萬族、說任何語言的人、普天下傳福音：</p><blockquote><p>“所以，<strong><mark>你們要去，使萬民作我的門徒，奉父，子、聖靈的名給他們施洗</mark></strong>。 <strong><mark>凡我所吩咐你們的，都教訓他們遵守</mark></strong>，我就常與你們同在，直到世界的末了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L19-20">太 28:19-20</a>)</p></blockquote><blockquote><p>“我們從他受了恩惠並使徒的職分，<strong><mark>在萬國之中叫人爲他的名信服真道</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L5">羅 1:5</a>)</p></blockquote><blockquote><p>“惟有上帝能照我所傳的福音，和所講的耶穌基督，並照永古隱藏不言的奧祕，<strong><mark>堅固你們的心</mark></strong>。 這奧祕如今顯明出來，而且按著永生上帝的命，藉衆先知的書<strong><mark>指示萬國的民，使他們信服真道</mark></strong>。 願榮耀，因耶穌基督，歸與獨一全智的上帝，直到永遠。阿們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L25-27">羅 16:25-27</a>) <em>(俄文譯本將這段頌讚置於 Рим 14:24-25；和合本（與希臘文文本）則在 羅 16:25-27。)</em></p></blockquote><blockquote><p>“<strong><mark>這天國的福音要傳遍天下，對萬民作見證</mark></strong>，然後末期纔來到。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L14">太 24:14</a>)</p></blockquote><blockquote><p>“我又看見另有一位天使飛在空中，<strong><mark>有永遠的福音要傳給住在地上的人，就是各國、各族、各方、各民</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L6">啟 14:6</a>)</p></blockquote><h2>萬民蒙召信基督——舊約中的指示</h2><p>上帝對亞伯拉罕的應許：地上的萬族都要因他的後裔（藉著他的一位後裔）得福：</p><blockquote><p>“並且<strong><mark>地上萬國，都必因你的後裔得福</mark></strong>，因爲你聽從了我的話。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/22/#L18">創 22:18</a>)</p></blockquote><p>萬民都歸向真上帝的預言：</p><blockquote><p>“主啊，<strong><mark>你所造的萬民都要來敬拜你</mark></strong>，他們也要榮耀你的名。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/86/#L9">詩 86:9</a>)</p></blockquote><blockquote><p>“<strong><mark>諸王都要叩拜他</mark></strong>；<strong><mark>萬國都要事奉他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/72/#L11">詩 72:11</a>)</p></blockquote><blockquote><p>“他的名要存到永遠，要留傳如日之久。<strong>人要因他蒙福，萬國要稱他有福</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/72/#L17">詩 72:17</a>)</p></blockquote><blockquote><p>“<strong><mark>萬國啊，你們都當讚美耶和華</mark></strong>！萬民哪，你們都當頌贊他！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/117/#L1">詩 117:1</a>)</p></blockquote><blockquote><p>“「我知道他們的行爲和他們的意念。時候將到，<strong><mark>我必將萬民萬族</mark></strong>聚來，看見我的榮耀。 我要顯神跡在他們中間，逃脫的我要差到列國去，就是到他施、普勒、拉弓的路德和土巴、雅完，並素來沒有聽見我名聲、沒有看見我榮耀遼遠的海島，他們必將我的榮耀傳揚在列國中。 他們必將你們的弟兄<strong><mark>從列國中送回</mark></strong>，使他們或騎馬，或坐車，坐轎，騎騾子，騎獨峯駝，到我的聖山耶路撒冷，作爲供物獻給耶和華，好像以色列人用潔淨的器皿盛供物奉到耶和華的殿中。」這是耶和華說的。 耶和華說：「我也必<strong>從他們中間取人爲祭司，爲利未人</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L18-21">賽 66:18-21</a>)</p></blockquote><blockquote><p>“<strong><mark>地極的人都當仰望我，就必得救</mark></strong>。因爲我是上帝，再沒有別神！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/45/#L22">賽 45:22</a>)</p></blockquote><blockquote><p>“現在他說：「你作我的僕人，使雅各衆支派復興，使以色列中得保全的歸回，尚爲小事；<strong><mark>我還要使你作外邦人的光，叫你施行我的救恩，直到地極</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/49/#L6">賽 49:6</a>)</p></blockquote><blockquote><p>“好叫世界得知你的道路，<strong><mark>萬國得知你的救恩</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/67/#L2">詩 67:2</a>)</p></blockquote><blockquote><p>“得了權柄、榮耀、國度，<strong><mark>使各方、各國、各族的人都事奉他</mark></strong>。他的權柄是永遠的，不能廢去，他的國必不敗壞。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/7/#L14">但 7:14</a>)</p></blockquote><blockquote><p>“<strong><mark>在列邦中述說他的榮耀，在萬民中述說他的奇事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/16/#L24">代上 16:24</a>)</p></blockquote><blockquote><p>“<strong><mark>使地上的萬民都知道惟獨耶和華是上帝</mark></strong>，並無別神。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/8/#L60">王上 8:60</a>)</p></blockquote><blockquote><p>“我必震動萬國。<strong><mark>萬國的珍寶必都運來</mark></strong>，我就使這殿滿了榮耀。』這是萬軍之耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ag/2/#L7">該 2:7</a>) <em>(希臘文原文（及俄文譯本）作「將要來的、萬國所仰慕的」，指彌賽亞本人；和合本作「萬國的珍寶」。)</em></p></blockquote><blockquote><p>“田地怎樣使百穀發芽，園子怎樣使所種的發生，主耶和華必照樣<strong><mark>使公義和贊美在萬民中發出</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/61/#L11">賽 61:11</a>)</p></blockquote><h2>別的民族的信仰不能救人</h2><p>使徒的耶穌基督的信仰是能救人的。別的民族的信仰不能救人：</p><blockquote><p>“他在從前的世代，<strong><mark>任憑萬國各行其道</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/14/#L16">徒 14:16</a>)</p></blockquote><p>詳見<a href="https://bibleox.com/ru/ru/w/Бог-один">別的民族的神——不是上帝</a></p><p>同時，使徒的耶穌基督的信仰和這信仰的救恩，向一切人毫無例外地敞開。</p>
