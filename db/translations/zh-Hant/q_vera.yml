  title: 使徒的信仰
  copy_cover: true
  body: <p>主耶穌基督講到那按使徒的話信他的人：</p><blockquote><p>“我爲他們的緣故自己分別爲聖，叫他們也因真理成聖。 我不但爲這些人祈求，也爲那些<strong><mark>因他們的話信我</mark></strong>的人祈求， <strong>使他們都合而爲一</strong>；正如你父在我裏面，我在你裏面，使他們也在我們裏面，<strong><mark>叫世人可以信你差了我來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L19-21">約 17:19-21</a>)</p></blockquote><p>使徒們多次指出必須持守那一次所傳的信仰（詳見<a href="https://bibleox.com/ru/ru/w/Предание">聖傳</a>）。*此頁尚待完善。</p>
