- src: Авраам-отец-верующих
  path: Qf6A_亞伯拉罕——信徒之父
  title: 亞伯拉罕——信徒之父
  copy_cover: true
  body: <p>亞伯拉罕沒有律法、並在受割禮之前就算爲義了：</p><blockquote><p>“正如大衛稱那在行爲以外蒙上帝算爲義的人是有福的。 他說：『得赦免其過，遮蓋其罪的，這人是有福的！ 主不算爲有罪的，這人是有福的！』 如此看來，這福是單加給那受割禮的人嗎？不也是加給那未受割禮的人嗎？因我們所說，<strong><mark>亞伯拉罕的信，就算爲他的義</mark></strong>。 是怎麼算的呢？是在他受割禮的時候呢？是在他未受割禮的時候呢？<strong><mark>不是在受割禮的時候，乃是在未受割禮的時候</mark></strong>。 並且他受了割禮的記號，作他未受割禮的時候因信稱義的印證，<strong><mark>叫他作一切未受割禮而信之人的父</mark></strong>，使他們也算爲義； 又作受割禮之人的父，就是那些不但受割禮，並且按我們的祖宗亞伯拉罕，未受割禮而信之蹤跡去行的人。 因爲上帝應許亞伯拉罕和他後裔必得承受世界，<strong><mark>不是因律法，乃是因信而得的義</mark></strong>。 若是屬乎律法的人才得爲後嗣，信就歸於虛空，應許也就廢棄了。 因爲律法是惹動忿怒的，那裏沒有律法，那裏就沒有過犯。 所以人得爲後嗣是本乎信．因此就屬乎恩，叫應許定然歸給一切後裔，不但歸給那屬乎律法的，也歸給那效法亞伯拉罕之信的。 亞伯拉罕所信的，是那叫死人復活、使無變爲有的上帝，他在主面前作我們世人的父。如經上所記：『<strong><mark>我已經立你作多國的父</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/4/#L6-17">羅 4:6-17</a>)</p></blockquote><blockquote><p>“亞伯蘭年九十九歲的時候，耶和華向他顯現，對他說：「我是全能的上帝，你當在我面前作完全人。 &lt;…&gt; 「我與你立約，<strong><mark>你要作多國的父</mark></strong>。 從此以後，你的名不再叫亞伯蘭，要叫亞伯拉罕，因爲<strong>我已立你作多國的父</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L1,4-5">創 17:1,4-5</a>)</p></blockquote><p>信徒是亞伯拉罕的子孫：</p><blockquote><p>“正如『亞伯拉罕信上帝，這就算爲他的義』。 所以你們要知道，<strong><mark>那以信爲本的人，就是亞伯拉罕的子孫</mark></strong>。 並且聖經既然預先看明，上帝要叫外邦人因信稱義，就早已傳福音給亞伯拉罕，說，『<strong><mark>萬國都必因你得福</mark></strong>。』 <strong><mark>可見那以信爲本的人和有信心的亞伯拉罕一同得福</mark></strong>。 凡以行律法爲本的，都是被咒詛的，因爲經上記著：『凡不常照律法書上所記一切之事去行的，就被咒詛。』 沒有一個人靠著律法在上帝面前稱義，這是明顯的．因爲經上說，『義人必因信得生。』 律法原不本乎信，只說：『行這些事的，就必因此活著。』 基督既爲我們受了咒詛，就贖出我們脫離律法的咒詛，因爲經上記著：『凡掛在木頭上都是被咒詛的。』 這便叫亞伯拉罕的福，因基督耶穌可以臨到外邦人，使我們因信得著所應許的聖靈。 弟兄們，我且照著人的常話說：雖然是人的文約，若已經立定了，就沒有能廢棄或加增的。 所應許的原是向亞伯拉罕和他子孫說的；上帝並不是說『衆子孫』，指著許多人，<strong><mark>乃是說『你那一個子孫』，指著一個人，就是基督</mark></strong>。 &lt;…&gt; 你們<strong><mark>受洗歸入基督的，都是披戴基督了</mark></strong>。 &lt;…&gt; 你們既屬乎基督，<strong><mark>就是亞伯拉罕的後裔</mark></strong>，是照著應許承受產業的了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L6-16,27,29">加 3:6-16,27,29</a>)</p></blockquote><blockquote><p>“爲你祝福的，我必賜福與他；那咒詛你的，我必咒詛他。<strong><mark>地上的萬族都要因你得福</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/12/#L3">創 12:3</a>)</p></blockquote><blockquote><p>“<strong><mark>這便叫亞伯拉罕的福，因基督耶穌可以臨到外邦人</mark></strong>，<strong>使我們因信得著所應許的聖靈</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L14">加 3:14</a>)</p></blockquote><h2>耶穌基督論亞伯拉罕的子孫</h2><blockquote><p>“不要自己心裏說：『有亞伯拉罕爲我們的祖宗。』我告訴你們：<strong><mark>上帝能從這些石頭中給亞伯拉罕興起子孫來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L9">太 3:9</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L8">路 3:8</a>)</p></blockquote><h2>教會——新的以色列</h2><blockquote><p>“<strong><mark>惟有你們是被揀選的族類，是有君尊的祭司</mark></strong>，是聖潔的國度，是屬上帝的子民，要叫你們宣揚那召你們出黑暗、入奇妙光明者的美德。 你們<strong><mark>從前算不得子民，現在卻作了上帝的子民</mark></strong>；從前未曾蒙憐恤，現在卻蒙了憐恤。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L9-10">彼前 2:9-10</a>)</p></blockquote>
