  path: QS3A_不饒恕
  title: 不饒恕
  copy_cover: true
  body: <blockquote><p>“<strong><mark>憐恤人的人有福了</mark></strong>，<strong><mark>因爲他們必蒙憐恤</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L7">太 5:7</a>)</p></blockquote><blockquote><p>“所以，你們禱告要這樣說：『我們在天上的父：願人都尊你的名爲聖。 &lt;…&gt; <strong><mark>免我們的債，如同我們免了人的債</mark></strong>。 &lt;…&gt; <strong><mark>你們饒恕人的過犯，你們的天父也必饒恕你們的過犯</mark></strong>； <strong><mark>你們不饒恕人的過犯，你們的天父也必不饒恕你們的過犯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L9,12,14-15">太 6:9,12,14-15</a>)</p></blockquote><blockquote><p>“你們不要論斷人，就不被論斷；你們不要定人的罪，就不被定罪；<strong><mark>你們要饒恕人，就必蒙饒恕</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L37">路 6:37</a>)</p></blockquote><blockquote><p>“那時，彼得進前來，對耶穌說：「主啊，<strong><mark>我弟兄得罪我，我當饒恕他幾次呢</mark></strong>？到七次可以嗎？」 耶穌說：「我對你說：不是到七次，乃是到七十個七次。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L21-22">太 18:21-22</a>)</p></blockquote><blockquote><p>“並要以恩慈相待，存憐憫的心，<strong><mark>彼此饒恕</mark></strong>，<strong><mark>正如上帝在基督裏饒恕了你們一樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L32">弗 4:32</a>)</p></blockquote><blockquote><p>“<strong>我們從前也是</strong>無知，悖逆，受迷惑，服事各樣私慾和宴樂，<strong><mark>常存惡毒</mark></strong>、嫉妒的心，是可恨的，又是<strong><mark>彼此相恨</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L3">多 3:3</a>)</p></blockquote><blockquote><p>“所以，你在祭壇上獻禮物的時候，<strong><mark>若想起弟兄向你懷怨</mark></strong>， <strong><mark>就把禮物留在壇前，先去同弟兄和好，然後來獻禮物</mark></strong>。 <strong><mark>你同告你的對頭還在路上，就趕緊與他和息</mark></strong>，恐怕他把你送給審判官，審判官交付衙役，你就下在監裏了。 我實在告訴你：若有一文錢沒有還清，你斷不能從那裏出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L23-26">太 5:23-26</a>)</p></blockquote><blockquote><p>“弟兄們，<strong><mark>你們不要彼此埋怨，免得受審判</mark></strong>。看哪，審判的主站在門前了！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L9">雅 5:9</a>)</p></blockquote><blockquote><p>“裝滿了各樣不義、邪惡、貪婪、惡毒，滿心是嫉妒、兇殺、<strong><mark>爭競</mark></strong>、詭詐、毒恨， 又是讒毀的、背後說人的、怨恨上帝的、<strong><mark>侮慢人的</mark></strong>、<strong><mark>狂傲的</mark></strong>、自誇的、捏造惡事的、違背父母的、 無知的、背約的、無親情的、<strong><mark>不憐憫人的</mark></strong>。 他們雖知道上帝判定<strong><mark>行這樣事的人是當死的</mark></strong>，然而他們不但自己去行，還喜歡別人去行。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L29-32">羅 1:29-32</a>)</p></blockquote><blockquote><p>“情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、 拜偶像、邪術、<strong><mark>仇恨</mark></strong>、爭競、忌恨、<strong><mark>惱怒</mark></strong>、結黨、<strong><mark>紛爭</mark></strong>、異端、 <strong><mark>嫉妒</mark></strong>〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><blockquote><p>“於是，主人叫了他來，對他說：『<strong><mark>你這惡奴才！你央求我，我就把你所欠的都免了</mark></strong>。 <strong><mark>你不應當憐恤你的同伴，像我憐恤你嗎</mark></strong>？』 主人就大怒，把他交給掌刑的，等他還清了所欠的債。 <strong><mark>你們各人若不從心裏饒恕你的弟兄，我天父也要這樣待你們了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L32-35">太 18:32-35</a>)</p></blockquote>
