- src: cICd_Ложь_обман
  path: QS4A_謊言（欺騙）
  title: 謊言（欺騙）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>你們是出於你們的父魔鬼</mark></strong>，你們父的私慾，你們偏要行。他從起初是殺人的，不守真理，因他心裏沒有真理。他說謊是出於自己，因<strong><mark>他本來是說謊的，也是說謊之人的父</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L44">約 8:44</a>)</p></blockquote><blockquote><p>“作假見證的，必不免受罰；<strong><mark>吐出謊言的，終不能逃脫</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/19/#L5">箴 19:5</a>)</p></blockquote><blockquote><p>“<strong><mark>不可作假見證陷害人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L16">出 20:16</a>)</p></blockquote><blockquote><p>“你們不可偷盜。<strong><mark>不可欺騙。也不可彼此說謊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L11">利 19:11</a>)</p></blockquote><blockquote><p>“但現在你們要棄絕這一切的事，以及惱恨、忿怒、惡毒、毀謗，並口中污穢的言語。 <strong><mark>不要彼此說謊</mark></strong>，因你們已經脫去舊人和舊人的行爲，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L8-9">西 3:8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>所以你們要棄絕謊言，各人與鄰舍說實話</mark></strong>，因爲我們是互相爲肢體。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L25">弗 4:25</a>)</p></blockquote><blockquote><p>“<strong><mark>凡不義的事都是罪</mark></strong>，也有不至於死的罪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L17">約壹 5:17</a>)</p></blockquote><blockquote><p>“<strong><mark>說謊言的嘴，爲耶和華所憎惡</mark></strong>；行事誠實的，爲他所喜悅。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/12/#L22">箴 12:22</a>)</p></blockquote><blockquote><p>“狂傲人不能站在你眼前；凡作孽的，都是你所恨惡的。 <strong><mark>說謊言的，你必滅絕</mark></strong>；好流人血弄詭詐的，都爲耶和華所憎惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L5-6">詩 5:5-6</a>)</p></blockquote><blockquote><p>“「<strong><mark>行詭詐的在羣中有公羊，他許願卻用有殘疾的獻給主，這人是可咒詛的</mark></strong>，因爲我是大君王，我的名在外邦中是可畏的。」這是萬軍之耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/1/#L14">瑪 1:14</a>)</p></blockquote>
