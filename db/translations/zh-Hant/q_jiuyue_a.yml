  path: QO2T_十字架——摩西
  title: 十字架——摩西
  copy_cover: true
  body: <h2>與亞瑪力人的爭戰</h2><p>耶穌基督在十字架上救贖性祭獻的預像，是舊約中的一件事：以色列民與亞瑪力人的爭戰。先知摩西在山上祈禱，他舉手時以色列人就得勝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/17/#L11">出 17:11</a>）；他因疲乏垂手時，民衆就開始敗退。以色列民與亞瑪力人爭戰時在山上的先知摩西。亞倫與戶珥扶著他的手（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/17/#L11-12">出 17:11-12</a>）。爭戰持續了一整天，摩西不能一直舉著手，所以亞倫與戶珥幫助摩西，搬石頭來放在他以下讓他坐下，從兩邊扶著他的手：亞倫扶一隻手，戶珥扶另一隻（可以說，如同釘子固定著基督的手）。摩西就以這樣的姿勢在山上（如同基督的十字架在山上）直到日落（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/17/#L12">出 17:12</a>）（如同基督一樣）。情形如下：</p><ul><li><p>約書亞（以色列民的統帥）的軍隊［如同基督軍隊——教會的元首］</p></li><li><p>藉着十字架戰勝了亞瑪力人［如同基督藉十字架得了勝利（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L16">弗 2:16</a>）］，</p></li><li><p>十字架由摩西在山上擺出［如同基督的十字架在各各他山上］，</p></li><li><p>摩西被人在這樣的姿勢中扶持著［如同基督在十字架上被固定著］</p></li><li><p>直到一天結束［如同基督一樣］。</p></li></ul>
  meta_desc: 關於摩西在山上呈十字形狀的預像意義的引文
