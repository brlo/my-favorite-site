  body: "<p><strong>在先知以西結的異象中，書記員要在一些人的額上畫上記號</strong>「\U00010915」（腓尼基字母Tau）。</p><p>先知以西結見到關於猶太人可憎之事的異象，爲此上帝差遣刑罰者前來，由書記員帶領。書記員把記號畫在那些人的額上——那些人對這些可憎之事同樣憎惡，如同上帝一樣。按上帝的指示，有這記號的人不會受刑罰觸及。</p><blockquote><p>“耶和華對他說：「你去走遍耶路撒冷全城，<strong><mark>那些因城中所行可憎之事嘆息哀哭的人，畫記號在額上</mark></strong>。」 我耳中聽見他對其餘的人說：「要跟隨他走遍全城，以行擊殺。你們的眼不要顧惜，也不要可憐他們． 要將年老的、年少的，並處女、嬰孩和婦女從聖所起全都殺盡，<strong><mark>只是凡有記號的人不要挨近他</mark></strong>。」於是，他們從殿前的長老殺起。” (<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/iez/9/#L4-6\">結 9:4-6</a>) <em>(俄文本引用處誤作 Иез 1:4-6；經文實爲 Иез 9:4-6。)</em></p></blockquote><p>在希伯來文中「畫記號」寫作「הִתְוִיתָ <strong>תָּו</strong>」[taw-vaw' tawv]。</p><p>直譯可以譯作「畫上<strong>תָּו</strong>」（Tau字母），但先知以西結出生之時，猶太人還在使用腓尼基文字或源自腓尼基文字的古希伯來文字；按那種文字，Tau字母寫作「\U00010915」。這樣，按字面寫的是：「<strong>畫上</strong>\U00010915」。</p><p>古代基督徒也同樣在自己額上畫十字：<a href=\"https://bibleox.com/ru/ru/w/крестное-знамение\">十字聖號</a></p><p><hr></p><p>猶太人從基督降生前約十世紀到七世紀使用腓尼基字母（源自腓尼基字母的古希伯來字母）。也就是說，它使用到巴比倫之囚爲止。猶太人在16年中分幾個階段被擄往巴比倫（<a href=\"https://ru.wikipedia.org/wiki/Вавилонский_плен\">公元前598—582年</a>）。</p><p>先知以西結生活的年代約爲<a href=\"https://ru.wikipedia.org/wiki/Иезекииль\">公元前約622年——約公元前570年</a>（共52年）。</p><p><a href=\"https://azbyka.ru/days/sv-iezekiil\">25歲</a>時，他與自己的民族一同被擄。</p><p>也就是說，他出生並受教育時還在使用腓尼基文字。</p><p><a href=\"https://ru.wikipedia.org/wiki/Иезекииль\">30歲</a>時，他的先知事奉開始（<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/iez/1/#L1\">結 1:1</a>）。</p><p>此時以西結寫他的先知書。</p><p>我們所關注的事件記載於第8-9章，發生在再過一年零兩個月之後（<a href=\"https://bibleox.com/zh-Hant/cn-cuvt/iez/8/#L1\">結 8:1</a>）。</p><p>無論如何，我們來到公元前七至六世紀之交、巴比倫之囚的最開始，此時猶太人的新文字纔開始逐漸形成。字母並不是一下子改變的，這在被擄期間經歷了很長時間。</p><p>最可能的是，先知還在使用猶太民族所能明白的腓尼基文字，相應地，把Tau寫作「\U00010915」。如果這是正確的，那麼書記員要在人的額上畫上「\U00010915」這個符號，使他們免受刑罰——這也把我們引向主的十字架的救贖意義。</p>"
