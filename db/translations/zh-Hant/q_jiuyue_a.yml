  title: 基督十字架祭獻的預像——亞伯拉罕與以撒
  copy_cover: true
  body: <p>舊約中基督十字架祭獻的預像——以撒的被獻。亞伯拉罕（父親）獻以撒（自己的獨生子）爲祭：</p><blockquote><p>“上帝說：<strong><mark>你帶著你的兒子，就是你獨生的兒子，你所愛的以撒</mark></strong>，往摩利亞地去，在我所要指示你的山上，<strong><mark>把他獻爲燔祭</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/22/#L2">創 22:2</a>)</p></blockquote><blockquote><p>“上帝愛世人，<strong><mark>甚至將他的獨生子賜給</mark></strong>他們，叫一切信他的，不至滅亡，反得永生。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L16">約 3:16</a>)</p></blockquote><p>以撒揹着將被獻祭之物上山：</p><blockquote><p>“<strong><mark>亞伯拉罕把燔祭的柴放在他兒子以撒身上</mark></strong>，自己手裏拿著火與刀，於是二人同行。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/22/#L6">創 22:6</a>)</p></blockquote><blockquote><p>“於是彼拉多將耶穌交給他們去釘十字架。 他們就把耶穌帶了去。<strong><mark>耶穌揹着自己的十字架出來</mark></strong>，到了一個地方，名叫髑髏地（希伯來話叫各各他）。 <strong><mark>他們就在那裏釘他在十字架上</mark></strong>，還有兩個人和他一同釘著，一邊一個，耶穌在中間。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L16-18">約 19:16-18</a>)</p></blockquote><p>亞伯拉罕將以撒放在壇上：</p><blockquote><p>“<strong><mark>我們的祖宗亞伯拉罕把他兒子以撒獻在壇上</mark></strong>，豈不是因行爲稱義嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L21">雅 2:21</a>)</p></blockquote><blockquote><p>“他既按著上帝的定旨、先見被交與人，<strong><mark>你們就藉着無法之人的手，把他釘在十字架上殺了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L23">徒 2:23</a>)</p></blockquote><p>在十字架上——如同在壇上——人類的救恩得以成就：</p><blockquote><p>“<strong><mark>既在十字架上滅了冤仇，便藉這十字架使兩下歸爲一體，與上帝和好了</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L16">弗 2:16</a>)</p></blockquote>
