- src: крест-Иаков
  path: QO5T_十字架——雅各的祝福
  title: 十字架——雅各的祝福
  copy_cover: true
  body: <p>雅各給孫子的十字形祝福。約瑟領著自己的兒子們，把每一個正對著父親相應的手，但雅各交叉了雙手，把他們調換了位置：</p><blockquote><p>“隨後約瑟又拉著他們兩個，<strong><mark>以法蓮在他的右手裏，對著以色列的左手</mark></strong>；瑪拿西在他的左手裏，對著以色列的右手，領他們到以色列的跟前。 以色列伸出右手來，按在以法蓮的頭上，以法蓮乃是次子；<strong><mark>又剪搭過左手來按在瑪拿西的頭上</mark></strong>，<strong><mark>瑪拿西原是長子</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/48/#L13-14">創 48:13-14</a>)</p></blockquote>
