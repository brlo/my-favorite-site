- src: крест-и-крещение-переход-через-море
  path: QO4T_十字架與洗禮——過紅海
  title: 十字架與洗禮——過紅海
  copy_cover: true
  body: <p>以色列民從埃及的奴役中走過紅海底——是洗禮的預像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L2">林前 10:2</a>），是脫離罪的奴役的出走。先知摩西命令紅海的水回到原處（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/14/#L26-27">出 14:26-27</a>）。上帝指示先知摩西舉杖把水分開（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/14/#L16,21">出 14:16,21</a>），而當民衆走到對岸之後，摩西要用手命令水回到原處（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/14/#L26-27">出 14:26-27</a>）。按情理，這是橫向的動作，與先前分開水流的縱向動作相對。這樣就得到一個十字：</p><ul><li><p>「之前」分開的縱向動作「|」。</p></li><li><p>「之後」連接的橫向動作「—」。</p></li></ul><p>這樣就成了一個十字（「|」與「—」相加即「＋」）。以色列民藉十字架脫離了奴役。正如我們藉著基督的十字架脫離罪的奴役，受浸入洗禮之水中。</p>
  meta_desc: 關於過紅海之預像意義的引文
