- src: еврейский-стан-крест
  path: QO3T_十字架——以色列人的營陣
  title: 十字架——以色列人的營陣
  copy_cover: true
  body: <p>上帝規定了以色列各支派營陣的排布。他們要這樣安營，也要這樣行進。以色列的營陣構成一個十字。</p><ul><li><p>營的中心是會幕：</p></li></ul><blockquote><p>“「以色列人要各歸自己的纛下，在本族的旗號那裏，<strong><mark>對著會幕的四圍安營</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L2">民 2:2</a>)</p></blockquote><p>同時，營的中心是利未支派：</p><blockquote><p>“隨後會幕要往前行，<strong><mark>有利未營在諸營中間</mark></strong>。<strong><mark>他們怎樣安營，就怎樣往前行</mark></strong>，各按本位，各歸本纛。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L17">民 2:17</a>)</p></blockquote><ul><li><p>東邊：猶大支派，然後以薩迦，然後西布倫：</p></li></ul><blockquote><p>“在東邊向日出之地，照著軍隊安營的，<strong><mark>是猶大營的纛</mark></strong>；有亞米拿達的兒子拿順作猶大人的首領。 &lt;…&gt; 挨着他安營的，<strong><mark>是以薩迦支派</mark></strong>；有蘇押的兒子拿坦業作以薩迦人的首領。 &lt;…&gt; <strong><mark>又有西布倫支派</mark></strong>；希倫的兒子以利押作西布倫人的首領。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L3,5,7">民 2:3,5,7</a>)</p></blockquote><ul><li><p>南邊：流便支派，然後西緬，然後迦得：</p></li></ul><blockquote><p>“在南邊按著軍隊，<strong><mark>是流便營的纛</mark></strong>；有示丟珥的兒子以利蓿作流便人的首領。 &lt;…&gt; 挨着他安營的<strong><mark>是西緬支派</mark></strong>；蘇利沙代的兒子示路蔑作西緬人的首領。 &lt;…&gt; <strong><mark>又有迦得支派</mark></strong>；丟珥的兒子以利雅薩作迦得人的首領。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L10,12,14">民 2:10,12,14</a>)</p></blockquote><ul><li><p>西邊：以法蓮支派（約瑟的），然後瑪拿西（約瑟的），然後便雅憫：</p></li></ul><blockquote><p>“在西邊按著軍隊，<strong><mark>是以法蓮營的纛</mark></strong>；亞米忽的兒子以利沙瑪作以法蓮人的首領。 &lt;…&gt; 挨着他的<strong><mark>是瑪拿西支派</mark></strong>；比大蓿的兒子迦瑪列作瑪拿西人的首領。 &lt;…&gt; <strong><mark>又有便雅憫支派</mark></strong>；基多尼的兒子亞比但作便雅憫人的首領。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L18,20,22">民 2:18,20,22</a>)</p></blockquote><ul><li><p>北邊：但支派，然後亞設，然後拿弗他利：</p></li></ul><blockquote><p>“在北邊按著軍隊<strong><mark>是但營的纛</mark></strong>；亞米沙代的兒子亞希以謝作但人的首領。 &lt;…&gt; 挨着他安營的<strong><mark>是亞設支派</mark></strong>；俄蘭的兒子帕結作亞設人的首領。 &lt;…&gt; <strong><mark>又有拿弗他利支派</mark></strong>；以南的兒子亞希拉作拿弗他利人的首領。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L25,27,29">民 2:25,27,29</a>)</p></blockquote><p><strong>*注</strong>：這樣的排布需要13個營（1+3+3+3+3），而雅各的兒子只有12個。這裏列舉了所有的支派，但約瑟的一個支派由他兩個兒子的支派代替：瑪拿西和以法蓮。</p><h2>十字的每一邊都按最靠近中心的支派之名計數</h2><p>先列舉猶大營的數目：</p><blockquote><p>“在東邊向日出之地，照著軍隊安營的，是猶大營的纛；有亞米拿達的兒子拿順作猶大人的首領。 他軍隊被數的，<strong><mark>共有七萬四千六百名</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L3-4">民 2:3-4</a>)</p></blockquote><p>然後列舉猶大之後各支派的人數：</p><blockquote><p>“他軍隊被數的，<strong><mark>共有五萬四千四百名</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L6">民 2:6</a>)</p></blockquote><blockquote><p>“他軍隊被數的，<strong><mark>共有五萬七千四百名</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L8">民 2:8</a>)</p></blockquote><p>然後全部加在一起，以猶大（最靠近中心的支派）之營命名，其數目已包括所有三個營：</p><blockquote><p>“<strong><mark>凡屬猶大營按著軍隊被數的，共有十八萬六千四百名</mark></strong>；<strong><mark>要作第一隊往前行</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L9">民 2:9</a>)</p></blockquote><p>其餘各邊也都這樣重複。</p><h2>營以十字形安營，也同樣以十字形行進</h2><blockquote><p>“隨後會幕要往前行，有利未營在諸營中間。<strong><mark>他們怎樣安營，就怎樣往前行</mark></strong>，各按本位，各歸本纛。 &lt;…&gt; 以色列人就這樣行，各人照他們的家室、宗族歸於本纛，<strong><mark>安營起行</mark></strong>，<strong><mark>都是照耶和華所吩咐摩西的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/2/#L17,34">民 2:17,34</a>)</p></blockquote>
