- src: Христос-Бог
  path: Qs15T_基督是上帝
  title: 基督是上帝
  copy_cover: true
  body: <h2>題詞</h2><blockquote><p>“「<strong>我的民哪！你們當聽我的話</strong>；以色列啊！我要勸戒你：<strong>我是上帝，是你的上帝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/50/#L7">詩 50:7</a>)</p></blockquote><h2>使徒在衆人面前稱基督爲上帝，基督認可了他的信仰（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L28-29">約 20:28-29</a>）</h2><p>這是最無可爭辯的一段。這裏具備一切必要的條件，使人確信使徒是把他當作真上帝來信的：在場沒有一個使徒反駁他，連基督自己也認可了這信仰。這裏的“θεὸς”（上帝）一詞甚至帶有冠詞“ὁ”——這就排除了反對方的一切異議。這節經文讓人看到，基督所被稱爲的，正是最高意義上的那同一位上帝：</p><blockquote><p>“多馬說：「<strong>我的主！我的上帝！</strong>」 耶穌對他說：「<strong>你因看見了我纔信</strong>，那沒有看見就信的有福了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L28-29">約 20:28-29</a>)</p></blockquote><blockquote><p>“Ὁ κύριός μου καὶ <strong><u>ὁ</u> θεός</strong> μου. λέγει αὐτῷ ὁ Ἰησοῦς, Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/in/20/#L28-29">約 20:28-29</a>, 譯自希臘文)</p></blockquote><p>對此，基督神性教導的反對者只會用一句缺乏說服力的話來搪塞，說：“使徒不過是太激動，因驚訝而喊叫”。但這與經文相矛盾，因爲經文直說，多馬是對著基督本人說的：“<strong>對他說</strong>”，也就是說，“我的主！我的上帝！”這句話按文本正是對基督的稱呼。</p><p>使徒這樣稱呼基督，沒有一個人糾正他，而基督自己也認可了他的信仰，說：“你因看見了我纔信”。顯然，他所信的是基督的復活；但得了這信仰，他隨即表明他所信的是什麼：信基督是上帝。這裏滿足批評者的一切語法要求：話是使徒說的，是在基督與衆使徒面前說的，無人反對，基督還加以認可。如果這都不能說服不信的人，那還有什麼能說服他們呢？</p><h2>基督是在萬有之上、永遠可稱頌的上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/9/#L3-5">羅 9:3-5</a>）</h2><p>使徒在最高意義上稱基督爲上帝：</p><blockquote><p>“爲我弟兄、我骨肉之親，就是自己被咒詛，與<strong>基督</strong>分離，我也願意。 他們是以色列人，那兒子的名分、榮耀、諸約、律法、禮儀、應許，都是他們的。 列祖就是他們的祖宗，按肉體說，基督也是從他們出來的，他是<strong>在萬有之上，永遠可稱頌的上帝</strong>。阿們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/9/#L3-5">羅 9:3-5</a>)</p></blockquote><blockquote><p>“<strong>ὁ Χριστὸς</strong> τὸ κατὰ σάρκα· <strong><u>ὁ</u> ὢν ἐπὶ πάντων θεὸς</strong> εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/rim/9/#L5">羅 9:5</a>, 譯自希臘文)</p></blockquote><p>基督神性教導的反對者會反駁說，這裏“θεὸς”（上帝）一詞缺少冠詞，所以基督在這裏似乎不是在最高意義上被稱爲上帝（彷彿這不是他自己的屬性），或者說“上帝”一詞根本不屬於基督。</p><p>對此有不同見解。有理由認爲，冠在這一切描述同一位人物的定語之前的共同指涉冠詞已經足夠：“ὁ ὢν ἐπὶ πάντων θεὸς”（在萬有之上、永遠可稱頌的上帝）。何況“上帝”一詞帶冠詞而屬於基督的例子，我們一開始已經舉過（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L28-29">約 20:28-29</a>）。如果這裏缺少冠詞，那麼那裏還缺少什麼，才能叫人相信呢？</p><h2>基督是真上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L20">約壹 5:20</a>）</h2><blockquote><p>“我們也知道上帝的兒子已經來到，且將智慧賜給我們，使我們認識那位真實的，我們也在那位真實的裏面，就是在他兒子<strong>耶穌基督裏面。這是真神</strong>，也是永生。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L20">約壹 5:20</a>)</p></blockquote><blockquote><p>“καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ <strong>Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς</strong> καὶ ζωὴ αἰώνιος” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/1in/5/#L20">約壹 5:20</a>, 譯自希臘文)</p></blockquote><p>使徒約翰寫“這是”（οὗτός ἐστιν）的時候，這個代詞所指的是緊接在前面一句中的“耶穌基督”（Ἰησοῦ Χριστῷ）之名。這是最近的先行詞。“θεὸς”前的冠詞“ὁ”強調，這是剛剛所談論之人的確定的屬性，即耶穌基督的屬性。語法上和邏輯上，這裏說的是：“這位【耶穌基督】是真上帝，是永生。”</p><h2>上帝用自己的血買來了教會（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L28">徒 20:28</a>）</h2><p>這節經文指明基督的神性，因爲這裏被稱爲上帝的，正是用自己的血買來教會的那一位。神性沒有血；血只有成了肉身的兒子纔有。這裏被稱爲上帝、用自己的血買來教會的，正是兒子：</p><blockquote><p>“聖靈立你們作全羣的監督，你們就當爲自己謹慎，也爲全羣謹慎，牧養<strong>上帝的教會</strong>，就是他<strong>用自己血所買來的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L28">徒 20:28</a>)</p></blockquote><blockquote><p>“ποιμαίνειν <strong>τὴν ἐκκλησίαν τοῦ θεοῦ</strong>, ἣν περιεποιήσατο διὰ <strong>τοῦ αἵματος τοῦ <u>ἰδίου</u></strong>” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/act/20/#L28">徒 20:28</a>, 譯自希臘文)</p></blockquote><h2>從前無人看見的上帝，在肉身顯現，將自己表明出來（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L15-16">提前 3:15-16</a>）</h2><p>“上帝在肉身顯現”這句話是俄文公會譯本如此譯的，但希臘文原文這裏沒有“上帝”一詞，代替它的是一個代詞“那一位”。然而這個代詞指的是上帝，因爲緊接著前面說的是上帝：“在上帝的家中當怎樣行；這家就是永生上帝的教會”。隨後又清楚表明，在這裏被稱爲上帝的正是耶穌基督：因爲不是父，而是兒子——即耶穌基督——“在肉身顯現”，從而“被天使看見”（父作爲上帝仍然不能看見），兒子也在榮耀裏被接昇天：</p><blockquote><p>“倘若我耽延日久，你也可以知道<strong>在上帝的家中</strong>當怎樣行；這家就是<strong>永生上帝的教會</strong>，真理的柱石和根基。 大哉，敬虔的奧祕！無人不以爲然，就是<strong>上帝在肉身顯現</strong>，被聖靈稱義，<strong>被天使看見</strong>，被傳於外邦，被世人信服，<strong>被接在榮耀裏</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L15-16">提前 3:15-16</a>)</p></blockquote><blockquote><p>“<strong>Ὃς ἐφανερώθη ἐν σαρκί</strong>, ἐδικαιώθη ἐν πνεύματι, <strong>ὤφθη ἀγγέλοις</strong>, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/1tim/3/#L16">提前 3:16</a>, 譯自希臘文)</p></blockquote><h2>上帝與主耶穌基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L1">提後 4:1</a>、<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L1">彼後 1:1</a>）</h2><p>在這節經文裏，耶穌被稱爲上帝，又被稱爲基督（“基督”一詞譯自希臘文，意爲“受膏者”，這是對世人所等候的救主的稱號，<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L36">徒 2:36</a>）。俄文公會譯本作：“在上帝和我們的主耶穌基督面前”，但希臘文寫法略有不同，直譯是：“在上帝和基督耶穌面前”（τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ）。</p><p>有人會反駁說，這裏說的是兩位：上帝，以及耶穌基督。這種反駁不能成立，因爲兩個詞共用一個冠詞“τοῦ”（屬格的指涉冠詞），也就是說，兩個詞都指同一個被描述的人物——耶穌。此外，下文的“τοῦ μέλλοντος”（將要審判的）是單數，這進一步表明前文所說的是一個人物：</p><blockquote><p>“我在<strong>上帝面前，並在將來審判活人死人的基督耶穌面前</strong>，憑著他的顯現和他的國度囑咐你：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L1">提後 4:1</a>)</p></blockquote><blockquote><p>“Διαμαρτύρομαι ἐνώπιον <strong><u>τοῦ</u> θεοῦ καὶ Χριστοῦ Ἰησοῦ</strong>, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/2tim/4/#L1">提後 4:1</a>, 譯自希臘文)</p></blockquote><p>下面是一個使用同一共同冠詞的類似語法結構：</p><blockquote><p>“願頌讚歸與我們主耶穌基督的<strong>父上帝</strong>。他曾照自己的大憐憫，藉耶穌基督從死裏復活，重生了我們，叫我們有活潑的盼望，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L3">彼前 1:3</a>)</p></blockquote><blockquote><p>“Εὐλογητὸς <strong><u>ὁ</u> θεὸς καὶ πατήρ</strong> τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/1pet/1/#L3">彼前 1:3</a>, 譯自希臘文)</p></blockquote><p>這裏“上帝與父”兩個詞共用一個冠詞“ὁ”（主格的指涉冠詞），因此兩個詞描述的是同一位，而不是兩位。</p><p>以下這處稱基督爲上帝的結構，也服從同一條規則：</p><blockquote><p>“作耶穌基督僕人和使徒的西門彼得，寫信給那因我們的<strong>上帝和救主耶穌基督</strong>之義，與我們同得一樣寶貴信心的人：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L1">彼後 1:1</a>)</p></blockquote><blockquote><p>“ἐν δικαιοσύνῃ <strong><u>τοῦ</u> θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ</strong>” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/2pet/1/#L1">彼後 1:1</a>, 譯自希臘文)</p></blockquote><h2>福音書作者路加稱基督爲上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/8/#L39">路 8:39</a>）</h2><p>來看福音書作者路加所記的一節。引文的前半是耶穌基督的話，後半是敘述者——福音書作者路加——自己的話。基督吩咐痊癒的人去傳講上帝爲他所作的事，而福音書作者路加記下，痊癒的人傳揚的是耶穌爲他所作的事。也就是說，在福音書作者路加的理解中，耶穌與上帝在這裏是一回事：</p><blockquote><p>“說：「你回家去，傳說<strong>上帝爲你作了何等大的事</strong>。」他就去，滿城裏傳揚<strong>耶穌爲他作了何等大的事</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/8/#L39">路 8:39</a>)</p></blockquote><blockquote><p>“διηγοῦ ὅσα σοι <strong>ἐποίησεν ὁ θεός</strong> … κηρύσσων ὅσα <strong>ἐποίησεν αὐτῷ ὁ Ἰησοῦς</strong>” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/lk/8/#L39">路 8:39</a>, 譯自希臘文)</p></blockquote><p>如果基督神性的反對者反駁說，福音書作者只是描述了痊癒者的行爲，說耶穌吩咐他傳講上帝所作的事，而痊癒者誤解了，沒有傳講上帝所作的事，反倒傳講耶穌所作的事——那麼要明白：反對基督神性的人也認爲福音書作者路加是否認基督神性的，彷彿路加也不認爲基督是上帝。那樣的話，福音書作者必定會以某種方式指出痊癒者的錯誤——他做的完全不是耶穌吩咐他做的事。這至少會表現爲用“但是”“然而”之類的轉折詞：“耶穌說，要回去傳講上帝所作的事，<strong>但是</strong>他卻去傳揚耶穌所作的事”；更有可能的是，他會直說痊癒者誤把耶穌當作上帝，所以傳講的不是上帝，而是耶穌。這不是小事，而是信仰的根基。</p><p>但福音書作者沒有作任何對比。他使用的是同一結構的重複：“上帝爲你作了……耶穌爲他作了……”。這是福音書作者相信基督神性的有力明證。</p><h2>一切的豐盛都有形有體地居住在基督裏面（<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L6,9">西 2:6,9</a>）</h2><p>這節經文顯然可以有不同解釋，但作爲其餘引文的補充，值得注意：</p><blockquote><p>“你們既然接受了主基督耶穌，就當遵他而行； &lt;…&gt; 因爲上帝本性<strong>一切的豐盛，都有形有體</strong>的居住在基督裏面，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L6,9">西 2:6,9</a>)</p></blockquote><blockquote><p>“ἐν αὐτῷ κατοικεῖ πᾶν <strong>τὸ πλήρωμα τῆς θεότητος σωματικῶς</strong>” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/kol/2/#L9">西 2:9</a>, 譯自希臘文)</p></blockquote><h2>使徒向人們傳講基督是上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L3,23">徒 17:3,23</a>）</h2><blockquote><p>“講解陳明基督必須受害，從死裏復活；又說：「<strong><mark>我所傳與你們的這位耶穌，就是基督</mark></strong>。」 &lt;…&gt; 我遊行的時候，觀看你們所敬拜的，遇見一座壇，上面寫著『<strong>未識之神</strong>』；你們所不認識而敬拜的，<strong><mark>我現在告訴你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L3,23">徒 17:3,23</a>)</p></blockquote><h2>上帝道成肉身（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1-18">約 1:1-18</a>）</h2><p>使徒約翰稱道爲上帝，隨後指出道成了肉身。施洗約翰所指向的正是這道成了肉身的道，而他指的是耶穌基督：</p><blockquote><p>“太初有道，道與上帝同在，<strong>道就是上帝</strong>。 這道太初與上帝同在。 萬物是藉着他造的；凡被造的，沒有一樣不是藉着他造的。 生命在他裏頭，這生命就是人的光。 光照在黑暗裏，黑暗卻不接受光。 有一個人是從上帝那裏差來的，名叫約翰。 這人來，爲要作見證；就是爲光作見證，叫衆人因他可以信。 他不是那光，乃是要爲光作見證。 那光是真光，照亮一切生在世上的人。 他在世界，世界也是藉着他造的，世界卻不認識他。 他到自己的地方來，自己的人倒不接待他。 凡接待他的，就是信他名的人，他就賜他們權柄，作上帝的兒女。 這等人不是從血氣生的，不是從情慾生的，也不是從人意生的，乃是從上帝生的。 <strong>道成了肉身</strong>，住在我們中間，充充滿滿的有恩典有真理。我們也見過他的榮光，正是父獨生子的榮光。 約翰爲他作見證，喊著說：「這就是我曾說：『那在我以後來的反成了在我以前的；因他本來在我以前。』」 從他豐滿的恩典裏，我們都領受了，而且恩上加恩。 律法本是藉着摩西傳的；恩典和真理都是由耶穌基督來的。 從來沒有人看見上帝，只有在父懷裏的獨生子將他表明出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1-18">約 1:1-18</a>)</p></blockquote><p>使徒在這裏稱基督不僅是父的兒子，而是獨生子，意思是：再沒有誰像基督那樣是父的兒子。他不是長子（最先出生的），而是獨生子（獨一的兒子）。沒有別的兒子。</p><p>基督神性教導的反對者會反駁說，在另外兩處，基督也被稱爲長子：</p><blockquote><p>“因爲他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子<strong>在許多弟兄中作長子</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L29">羅 8:29</a>)</p></blockquote><blockquote><p>“再者，上帝使<strong>長子</strong>到世上來的時候，就說：『上帝的使者都要拜他。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L6">希 1:6</a>)</p></blockquote><p>對此應當說：他被稱爲長子，是因爲他首先從死裏復活：他的復活不是復活之後又要死（先知們從前的復活是那樣），而是以勝過死亡的改變形象的復活（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/6/#L9">羅 6:9</a>），要活到永遠，並在榮耀裏昇天，要作王直到永遠——在他以前沒有人這樣復活過。他首先這樣復活，也就是成爲長子，或者說從死裏的首生者：</p><blockquote><p>“他也是教會全體之首，他是元始，是<strong>從死裏首先復生的</strong>，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“並那誠實作見證的、<strong>從死裏首先復活</strong>、爲世上君王元首的耶穌基督，有恩惠、平安歸與你們！他愛我們，用自己的血使我們脫離罪惡，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L5">啟 1:5</a>)</p></blockquote><blockquote><p>“就是基督必須受害，並且<strong>因從死裏復活</strong>，要首先把光明的道傳給百姓和外邦人。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/26/#L23">徒 26:23</a>)</p></blockquote><p>其餘引文：<a href="https://bibleox.com/ru/ru/w/Христос-Единородный-Сын-Божий">基督是上帝的獨生子</a></p><h2>詩篇論及上帝的話，是論及子說的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L8-12">希 1:8-12</a>）</h2><p>使徒保羅把先知的詩篇用在基督身上。他說，那些話是論及子說的：</p><ol><li><p>子是上帝。</p></li><li><p>子立了地的根基，造了天。</p></li><li><p>子——上帝——受了上帝的膏（希臘文 Χριστός 意爲“受膏者”）。</p></li></ol><blockquote><p>“<strong><mark>論到子</mark></strong>卻說：『<strong>上帝啊，你的寶座是永永遠遠的</strong>，你的國權是正直的。 你喜愛公義，恨惡罪惡，所以<strong>上帝，就是你的上帝，用喜樂油膏你</strong>，勝過膏你的同伴。』 又說：『主啊，<strong><mark>你起初立了地的根基，天也是你手所造的</mark></strong>。 天地都要滅沒，你卻要長存；天地都要像衣服漸漸舊了， 你要將天地捲起來，像一件外衣，天地就都改變了。惟有你永不改變，你的年數沒有窮盡。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L8-12">希 1:8-12</a>) <em>(引自詩 45:6-7)</em></p></blockquote><p>基督神性教導的反對者會反駁說，這裏稱上帝用的只是猶太人通用的詞 Elohim，這個詞既用於真上帝，也用於假神。他們將期待上帝被冠以四字聖名——四個希伯來字母 <strong>יְהוָֽה（YHWH，音“雅威”）</strong>。而使徒所引的詩篇（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/102/#L25-27">詩 102:25-27</a>）恰好滿足他們的要求。整篇詩——是向<strong>上帝（יְהוָֽה，YHWH）</strong>的禱告，他在 <a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/102/#L20">詩 102:20</a> 和 <a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/102/#L23">詩 102:23</a> 被稱爲 <strong>יְהוָֽה</strong>。詩篇的標題是：“困苦人的禱告，他消沉地在<strong>耶和華（יְהוָֽה，YHWH）</strong>面前傾吐苦情”。也就是說，整篇詩——包括使徒所引用的詩句——都是向上帝的禱告，而上帝在其中的稱呼正如他們所期待的——耶和華。使徒卻說，這是論子說的，也就是說，耶和華——就是子，耶穌基督。</p><h2>上帝是救主，耶穌基督也是救主（<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L3-4">多 1:3-4</a>、<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/2/#L13">多 2:13</a>）</h2><blockquote><p>“到了日期，藉着傳揚的工夫，把他的道顯明了；這傳揚的責任是按著<strong>上帝我們救主</strong>的命令交託了我。 現在寫信給提多，就是照著我們共信之道作我真兒子的：願恩惠、平安從父上帝和<strong>我們的救主基督耶穌</strong>歸與你！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L3-4">多 1:3-4</a>)</p></blockquote><blockquote><p>“等候所盼望的福，並等候<strong>至大的上帝和我們救主耶穌基督</strong>的榮耀顯現。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/2/#L13">多 2:13</a>)</p></blockquote><h2>耶穌就是舊約裏的那同一位上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L34">太 23:34</a>、<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/7/#L21,25">耶 7:21,25</a>）</h2><p>當人向基督神性的反對者指出，使徒們直呼基督爲上帝時，他們反駁說：“僅被稱爲上帝還不夠”——瞧，先知摩西也曾被稱爲神：</p><blockquote><p>“耶和華對摩西說：「<strong>我使你在法老面前代替上帝</strong>，你的哥哥亞倫是替你說話的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/7/#L1">出 7:1</a>)</p></blockquote><blockquote><p>“Ἰδοὺ δέδωκά σε <strong>θεὸν Φαραω</strong>, καὶ Ααρων ὁ ἀδελφός σου ἔσται σου προφήτης” (<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/ish/7/#L1">出 7:1</a>, 譯自希臘文)</p></blockquote><p>首先，這裏沒有滿足批評者自己先前提出的要求：上帝一詞要帶冠詞。這裏沒有冠詞。而且從文本可以清楚看到，先知摩西得到的只是相對於法老的一種授予的職能。這裏沒有任何地方表明摩西按本性就是神，擁有神性作爲自己固有的恆常屬性。此外，批評者對我們的論證所要求的第二條，在這裏也沒有滿足：希伯來文原文中用的也是通用的“אֱלֹהִ֖ים”（Elohim），而不是四字聖名 YHWH，也就是說，這裏說的不是最高意義上的真上帝。</p><p>其次，可以完全確信：耶穌基督就是那位真上帝——創造者、耶和華、祖宗的上帝（亞伯拉罕、以撒、雅各的上帝）。例如，基督自己說他曾向以色列差遣先知，而舊約說，向以色列差遣衆先知的是上帝耶和華。由此也直接可見：基督就是道成肉身的上帝耶和華。後面還有別的例子。</p><h3>只有上帝差遣先知，而差遣先知的是基督</h3><p>基督自己說，他就是那位向以色列差遣先知的：</p><blockquote><p>“所以<strong>我差遣先知</strong>和智慧人並文士到你們這裏來，有的你們要殺害，要釘十字架；有的你們要在會堂裏鞭打，從這城追逼到那城。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L34">太 23:34</a>)</p></blockquote><p>上帝親自（不借中間人）向先知說話，並差遣他們：</p><blockquote><p>“萬軍之耶和華以色列的上帝如此說：你們將燔祭加在平安祭上，吃肉吧！ &lt;…&gt; 自從你們列祖出埃及地的那日，直到今日，<strong>我差遣我的僕人衆先知到你們那裏去</strong>，每日從早起來差遣他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/7/#L21,25">耶 7:21,25</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/35/#L15">耶 35:15</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/44/#L4">耶 44:4</a>)</p></blockquote><blockquote><p>“上帝說：「我必與你同在。你將百姓從埃及領出來之後，你們必在這山上事奉我，<strong>這就是我打發你去的證據</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L12">出 3:12</a>)</p></blockquote><blockquote><p>“萬軍之耶和華說：「那日臨近，勢如燒著的火爐，凡狂傲的和行惡的必如碎秸，在那日必被燒盡，根本枝條一無存留。 &lt;…&gt; 看哪！耶和華大而可畏之日未到以前，<strong>我必差遣先知以利亞到你們那裏去</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/4/#L1,5">瑪 4:1,5</a>)</p></blockquote><blockquote><p>“<strong>耶和華就差遣先知</strong>到以色列人那裏，對他們說：「耶和華以色列的上帝，如此說：『我曾領你們從埃及上來，出了爲奴之家。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/6/#L8">士 6:8</a>)</p></blockquote><blockquote><p>“因此，耶和華的怒氣向亞瑪謝發作，就<strong>差一個先知</strong>去見他說：「這些神不能救他的民脫離你的手，你爲何尋求他呢？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/25/#L15">代下 25:15</a>)</p></blockquote><blockquote><p>“撒母耳對掃羅說：「<strong>耶和華差遣我</strong>膏你爲王，治理他的百姓以色列；所以你當聽從耶和華的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/15/#L1">撒上 15:1</a>)</p></blockquote><blockquote><p>“<strong>耶和華差遣拿單</strong>去見大衛。拿單到了大衛那裏，對他說：「在一座城裏有兩個人：一個是富戶，一個是窮人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/12/#L1">撒下 12:1</a>)</p></blockquote><blockquote><p>“大衛安慰他的妻拔示巴，與她同寢。她就生了兒子，給他起名叫所羅門。耶和華也喜愛他； 就<strong>藉先知拿單</strong>賜他一個名字叫耶底底亞，因爲耶和華愛他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/12/#L24-25">撒下 12:24-25</a>)</p></blockquote><blockquote><p>“我差遣我的僕人衆先知到你們那裏去；你們卻捉住他們，殺害他們，殘害他們的身體。他們的血我必追討，這是主說的。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/1/#L32">厄四 1:32</a>, )</p></blockquote><h2>以色列人在曠野試探的是基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L9">林前 10:9</a>、<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/95/#L6-9">詩 95:6-9</a>）</h2><blockquote><p>“<strong>也不要試探主</strong>，像他們有人試探的，就被蛇所滅；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L9">林前 10:9</a>) <em>(和合本此處作「主」，希臘文 τὸν Χριστόν，即「基督」)</em></p></blockquote><p>在曠野，以色列人試探的正是上帝、創造者；這就是說，基督就是他們所試探的那同一位上帝：</p><blockquote><p>“來啊，我們要屈身敬拜，在<strong>造我們的耶和華</strong>面前跪下。 因爲<strong>他是我們的上帝</strong>，我們是他草場的羊，是他手下的民。惟願你們今天聽他的話。 你們不可硬著心，像當日在米利巴，就是在曠野的瑪撒。 那時，你們的祖宗<strong>試我探我</strong>，並且觀看我的作爲。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/95/#L6-9">詩 95:6-9</a>)</p></blockquote><h2>古代抄本</h2><ol><li><p>現今的 <strong><a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L5">猶 1:5</a></strong> 作：“我想提醒你們，你們雖然知道這事，主救了他的百姓出埃及地，其後就把不信的滅絕了。”但在保存猶大書信的最古老的蒲草抄本 [[https://en.wikipedia.org/wiki/Papyrus_72|p72]]（三世紀）中，這段文字是這樣：“我想提醒你們，你們雖然萬事都知道，<strong>上帝基督</strong>（Theos Christos）曾一次救了他的百姓出埃及地，其後就把不信的滅絕了。”</p></li><li><p>現今文本的 <strong><a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L2">西 2:2</a></strong> 結尾作：“得以知道上帝和基督的奧祕”。而在保存保羅書信的最古老蒲草抄本 [[https://en.wikipedia.org/wiki/Papyrus_46|p46]]（二世紀末）中，寫的是：“得以知道<strong>上帝基督</strong>的奧祕”（tou Theou Hristou）。</p></li><li><p>在我們手頭的文本中，<strong><a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L2">彼後 1:2</a></strong> 作：“願恩惠、平安因你們認識上帝和我們主耶穌多多地加給你們”。而該書信最古老的抄本作：“願恩惠、平安因你們認識<strong>上帝耶穌</strong>（tou Theou Iesou），我們的主，多多地加給你們”。</p></li><li><p>現今的 <strong><a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a></strong> 作：“父懷裏的獨生子”。而在約翰福音最早的書冊——蒲草抄本 [[https://en.wikipedia.org/wiki/Papyrus_75|p75]]（三世紀中葉）和 [[https://en.wikipedia.org/wiki/Papyrus_66|p66]]（二世紀末）中，讀到的是：“父懷裏的<strong>獨一上帝</strong>”。里昂的愛任紐引用這處時，也是這樣。</p></li></ol><h2>基督——兩個世界的居住者：上帝與人</h2><p>沒有能把一隻手放在上帝身上、另一隻手放在人身上的中保，因爲這兩個世界互不相觸，沒有任何東西、任何存在把它們連在一起：</p><blockquote><p>“<strong>我們中間沒有聽訟的人</strong>，可以向我們兩造按手。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/9/#L33">伯 9:33</a>)</p></blockquote><p>而耶穌基督（非受造的上帝與受造的人）自己就聯結了這兩個世界：</p><blockquote><p>“因爲只有一位上帝，<strong>在上帝和人中間，只有一位中保</strong>，乃是降世爲人的基督耶穌。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L5">提前 2:5</a>)</p></blockquote><h2>舊約的平行經文</h2><h3>基督如同上帝：萬王之王、萬主之主</h3><p>先知稱上帝爲萬主之主：</p><blockquote><p>“你們要稱謝萬神之神，因他的慈愛永遠長存！ 你們要稱謝<strong>萬主之主</strong>，因他的慈愛永遠長存！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/136/#L2-3">詩 136:2-3</a>)</p></blockquote><p>使徒稱上帝爲萬王之王、萬主之主：</p><blockquote><p>“到了日期，那可稱頌、獨有權能的<strong>萬王之王、萬主之主</strong>， 就是那獨一不死，住在人不能靠近的光裏，是人未曾看見，也是不能看見的，要將他顯明出來。但願尊貴和永遠的權能都歸給他。阿們！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L15-16">提前 6:15-16</a>)</p></blockquote><p>使徒稱耶穌基督爲萬主之主、萬王之王：</p><blockquote><p>“他們與羔羊爭戰，羔羊必勝過他們，因爲羔羊是<strong>萬主之主、萬王之王</strong>。同著羔羊的，就是蒙召、被選、有忠心的，也必得勝。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/17/#L14">啟 17:14</a>)</p></blockquote><blockquote><p>“在他衣服和大腿上有名寫著說：『<strong>萬王之王、萬主之主</strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/19/#L16">啟 19:16</a>)</p></blockquote><h3>基督如同上帝：全能者</h3><p>上帝是全能者：</p><blockquote><p>“上帝所懲治的人是有福的！所以你不可輕看<strong>全能者</strong>的管教。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/5/#L17">伯 5:17</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/15/#L3">啟 15:3</a>)</p></blockquote><p>基督是全能者：</p><blockquote><p>“主上帝說：「我是阿拉法，我是俄梅戛，是昔在、今在、以後永在的<strong>全能者</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L8">啟 1:8</a>)</p></blockquote><blockquote><p>“他是上帝榮耀所發的光輝，是上帝本體的真像，常用他權能的命令<strong>托住萬有</strong>，他洗淨了人的罪，就坐在高天至大者的右邊．” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L3">希 1:3</a>)</p></blockquote><p>在同一卷書中，上帝也被稱爲全能者：</p><blockquote><p>“唱上帝僕人摩西的歌和羔羊的歌，說：「<strong>主上帝，全能者啊</strong>，你的作爲大哉，奇哉！萬世之王啊，你的道途義哉，誠哉！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/15/#L3">啟 15:3</a>)</p></blockquote><h3>基督是“自有的”（希伯來文：耶和華）</h3><p>基督對自己的稱呼，與舊約中上帝的稱呼相同（耶和華、自有的）：</p><blockquote><p>“他們就問他說：「你是誰？」耶穌對他們說：「就是我<strong>從起初</strong>所告訴你們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L25">約 8:25</a>)</p></blockquote><h3>上帝將與衆聖徒一同降臨，基督也是</h3><p>上帝（希伯來文 יהוה）將與衆聖徒一同降臨：</p><blockquote><p>“你們要從我山的谷中逃跑，因爲山谷必延到亞薩。你們逃跑，必如猶大王烏西雅年間的人逃避大地震一樣。<strong>耶和華我的上帝必降臨，有一切聖者同來</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/14/#L5">亞 14:5</a>)</p></blockquote><blockquote><p>“亞當的七世孫以諾曾預言這些人說：『看哪，<strong>主帶著他的千萬聖者降臨</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L14">猶 1:14</a>)</p></blockquote><p>基督將與衆聖徒一同降臨：</p><blockquote><p>“好使你們當<strong>我們主耶穌同他衆聖徒來</strong>的時候，在我們父上帝面前心裏堅固，成爲聖潔，無可責備。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/3/#L13">帖前 3:13</a>)</p></blockquote><blockquote><p>“當<strong>人子</strong>在他榮耀裏，<strong>同著衆天使</strong>降臨的時候，要坐在他榮耀的寶座上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31">太 25:31</a>)</p></blockquote><h2>創造者與審判者——是上帝</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Творец-мира">基督——創造者</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-судья">基督——審判者</a></p></li><li><p>創造者與審判者——是上帝</p></li></ol><blockquote><p>“他大聲說：「<strong>應當敬畏上帝</strong>，將榮耀歸給他，因他<strong>施行審判的時候已經到了</strong>！應當<strong>敬拜那創造天、地、海和衆水泉源的</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L7">啟 14:7</a>)</p></blockquote><h2>對穆斯林有益的認識</h2><blockquote><p>“因<strong>有一嬰孩爲我們而生</strong>，有一子賜給我們，政權必擔在他的肩頭上。他名稱爲『奇妙策士』、『<strong>全能的上帝</strong>』、『<strong>永在的父</strong>』、『<strong>和平的君</strong>』！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/9/#L6">賽 9:6</a>)</p></blockquote><blockquote><p>“「伯利恆、以法他阿，你在猶大諸城中爲小，將來必有一位從你那裏出來，在以色列中爲我作掌權的；<strong>他的根源從亙古、從太初就有</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mih/5/#L2">彌 5:2</a>)</p></blockquote><blockquote><p>“你們的祖宗亞伯拉罕歡歡喜喜的仰望我的日子；既看見了，就快樂。」 猶太人說：「<strong>你還沒有五十歲，豈見過亞伯拉罕呢</strong>？」 耶穌說：「我實實在在的告訴你們，<strong>還沒有亞伯拉罕就有了我</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L56-58">約 8:56-58</a>)</p></blockquote><blockquote><p>“耶穌對他們說：「<strong>我曾看見撒但從天上墜落</strong>，像閃電一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L18">路 10:18</a>)</p></blockquote><blockquote><p>“在船上的人都<strong>拜他</strong>，說：「<strong>你真是上帝的兒子了</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/14/#L33">太 14:33</a>)</p></blockquote><blockquote><p>“耶穌見他們的信心，就對癱子說：「小子，<strong>你的罪赦了</strong>。」 有幾個文士坐在那裏，心裏議論，說： 「這個人爲什麼這樣說呢？他說僭妄的話了！<strong>除了上帝以外，誰能赦罪呢</strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/2/#L5-7">可 2:5-7</a>)</p></blockquote><blockquote><p>“所以猶太人越發想要殺他，因他不但犯了安息日，並且<strong>稱上帝爲他的父，將自己和上帝當作平等</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L18">約 5:18</a>)</p></blockquote><blockquote><p>“<strong><mark>父怎樣叫死人起來</mark></strong>，使他們活著，<strong><mark>子也照樣隨自己的意思使人活著</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L21">約 5:21</a>)</p></blockquote><blockquote><p>“因爲無論在那裏，有兩三個人奉我的名聚會，那裏就<strong>有我在他們中間</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L20">太 18:20</a>)</p></blockquote>
