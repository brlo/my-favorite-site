  path: QW9A_聖像（敬禮聖像）
  title: 聖像（敬禮聖像）
  copy_cover: true
  body: <p>正教基督徒被指控拜偶像：聖像被稱爲偶像，敬禮聖像被稱爲拜偶像。本文按聖經考察聖像敬禮的問題，回應這些指控。</p><p>先給出簡短的回答，然後較詳細地考察批評，最後給出最詳細的、逐句依據聖經的回答。</p><h2>敬禮聖像最簡短的辯護</h2><p>在上帝道成肉身之前的時代，上帝爲舊約的以色列設立律法時，沒有顯明自己的像，並禁止製造假神（偶像）的像、禁止敬拜它們（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L8-9">申 5:8-9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/4/#L15-19">申 4:15-19</a>）；但他命令描繪自己的聖潔僕人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L18-20">出 25:18-20</a>），而先知們在有像的聖物前叩拜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>）。正教徒對帶有像的聖物的敬禮，與先知的做法完全一樣。</p><p>此外，按上帝的構想，聖殿本身就是天的聖像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L8-9,40">出 25:8-9,40</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L44">徒 7:44</a>）。上帝命令敬重聖殿（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>）；聖殿受敬禮，人們在它面前叩拜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>）。這正是正教的敬禮：敬禮像，就是敬禮原型。</p><p>任何人想用來爲先知對帶有像的聖物的敬禮辯護的理由，都適用於正教的敬禮（因爲這是同一件事）；任何人想用來指責正教敬禮的定罪，也同樣落在先知的敬禮上。</p><p>問題完全不在像及其敬禮。既然偶像是對上帝的任何虛假觀念，那麼問題在於：1）像本身、2）敬禮者賦予它的意義內容，與真理是什麼關係。如果兩者中哪怕一個在原則上虛假，那就是拜偶像——它把人從真理引開。這纔是問題所在：偶像不引人歸向上帝，對上帝的虛假觀念不引人歸向真上帝，因爲謊言不引向真理，而使人離開真理。</p><p>在與反對聖像者的對話中簡要檢驗這一論斷：</p><p><strong>反聖像者</strong>：向物件叩拜——是拜偶像。</p><p><strong>正教徒</strong>：那麼上帝的先知們在聖殿和有像的約櫃前叩拜，就成了拜偶像的了？</p><p><strong>反對者</strong>：上帝只說了描繪，沒有說敬禮或叩拜。</p><p><strong>正教徒</strong>：那麼先知們作了不該作的、沒有記載的、沒有被命令的事，就是說陷入了拜偶像？</p><p><strong>反對者</strong>：先知叩拜的不是聖殿或約櫃本身，而是把這敬禮歸於上帝。</p><p><strong>正教徒</strong>：正是如此。正教徒叩拜的也不是木頭和顏料，而是像中所描繪的位格——教導中正是這樣說：藉著像敬禮原型，如同先知。沒有任何差別。</p><p>如此等等。這條規則永遠有效，因爲先知的敬禮與正教的敬禮之間沒有任何差別。現在更詳細地考察這一問題。</p><h2>反聖像者說：“上帝的話明明說：不可作像，你們卻作”</h2><p><strong>回答</strong>：這是摩西律法中只針對描繪上帝的舊約禁令，從上下文可見：</p><ul><li><p>前四條誡命正是<strong>關於上帝</strong>的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L8-9">申 5:8-9</a>）；</p></li><li><p>設立禁令時，上帝指出它的緣由：在律法設立時上帝沒有顯明自己的<strong>像</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/4/#L15-19">申 4:15-19</a>）：既然沒有見過上帝，就不要描繪。</p></li></ul><p>這樣，禁令針對的正是描繪上帝；而對自己的聖潔僕人，上帝不但沒有禁止，反而命令描繪（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>），義人們向聖殿和帶這些像的聖物叩拜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>）。</p><p>舊約的教會裏有聖像，它們受敬禮。首先，<strong>舊約的聖殿本身就是聖像</strong>。作爲地上的場所，它按上帝起初的構想應當成爲天上所發生之事的描繪。上帝命令先知摩西建造聖殿，不是因爲他需要殿（上帝不需要，<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L1">賽 66:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/49/#L13">詩 49:13</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/1/#L11">賽 1:11</a>），而是命令把殿造爲天的聖像、造爲向先知所顯示的天上實體之像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L8-9,40">出 25:8-9,40</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L44">徒 7:44</a>）。上帝命令敬禮這一聖像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>）。先知大衛向它叩拜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>）。當不虔的王在聖殿裏設立異教偶像時（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/21/#L3-7">王下 21:3-7</a>）——即損壞了天上實體的像——上帝就棄絕了聖殿（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/23/#L27">王下 23:27</a>）。</p><p>正因爲聖殿是天的聖像，在新約裏它經歷了改變（內部構造、像），因爲天上實體也改變了。在舊約裏，天上實體中以屬靈-可見方式存在的<strong>只有天使</strong>。而上帝完全不可見、非物質，人也還沒有達到天上的生命（詳見<a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">詳見</a>）。</p><p>在新約裏——更準確地說，隨著主耶穌基督的來臨——發生了巨大的變化：</p><ol><li><p><strong>上帝按人性成爲可見的</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L1-2">約壹 1:1-2</a>）；</p></li><li><p><strong>上帝有形地在天上登基</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L21">啟 3:21</a>）；</p></li><li><p><strong>天上出現了人</strong>——他們獲得了與主耶穌基督同活的可能（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1,3-5">啟 14:1,3-5</a>）；</p></li><li><p><strong>上帝訂立新約</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/31/#L31">耶 31:31</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/8/#L8">希 8:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L20">路 22:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L25">林前 11:25</a>）。<strong>舊約與摩西的律法一同終結</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L6">羅 7:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L21-25">加 3:21-25</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L14-16">弗 2:14-16</a>）。描繪上帝的禁令失效，因爲它曾是摩西律法的一部分，而摩西律法已隨基督的來臨被廢除（詳見<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">詳見</a>）。</p></li></ol><p>這樣，舊約的聖殿是舊約天上實體的像，而這實體在新約裏改變了。先前的已不存在。既然聖殿按上帝起初的構想就是天上實體的像，那麼在這實體改變之後，描繪舊的就已沒有意義。因此基督徒從最古老的年代起描繪新的天上實體，把在天空明顯登基的耶穌基督（上帝）的像立在最前面，周圍——描繪他聖潔的僕人們：如今已不只是天使，還有人。</p><p>標誌性的事件是基督的祭獻之後耶路撒冷聖殿的損壞：</p><blockquote><p>“忽然，<strong><mark>殿裏的幔子從上到下裂爲兩半</mark></strong>，<strong><mark>地也震動，磐石也崩裂</mark></strong>， <strong><mark>墳墓也開了</mark></strong>，已睡聖徒的身體，多有起來的。 <strong><mark>到耶穌復活以後</mark></strong>，他們從墳墓裏出來，<strong><mark>進了聖城，向許多人顯現</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L51-53">太 27:51-53</a>)</p></blockquote><p>而在70年代，聖殿被羅馬人完全毀滅，在隨後的一切千百年裏，把位置讓給了新的天上實體之像——正教聖殿。</p><p>更多古聖像見：<a href="https://bibleox.com/ru/ru/w/древние-иконы">古聖像</a></p><p>過時的不只是舊約天上實體的像，還有舊約本身——摩西的律法是它不可分的部分，如今律法已失去意義。除描繪上帝的禁令外，還有許多規定在新約裏已不再有效：</p><blockquote><p>“<strong><mark>那褻瀆耶和華名的，必被治死</mark></strong>，全會衆總要用石頭打死他。不管是寄居的是本地人，<strong><mark>他褻瀆耶和華名的時候，必被治死</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/24/#L16">利 24:16</a>)</p></blockquote><p>褻瀆上帝的名——是違揹<strong>第三誡</strong>的罪。按摩西律法的刑罰——死（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/24/#L16">利 24:16</a>）。據我們所知，反對聖像的人並不教導爲褻瀆上帝而殺人。他們要求遵守舊約關於不可描繪上帝的禁令，引用帶有“這是上帝的話”字樣的引文；但關於處死褻瀆者的誡命也是上帝的話，也寫得同樣明白，但他們並不這樣行。爲什麼？因爲摩西律法被廢除了。</p><p><strong>第四誡</strong>設立安息日的安息——停止作工（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L8-10">出 20:8-10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L12-15">申 5:12-15</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L3">利 19:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>）。按摩西律法的刑罰——死。這也是上帝的話，也寫得同樣明白；但反對聖像的人不教導爲破壞安息日的安息而殺人，他們大多數連安息日的安息自己也不守。爲什麼？因爲摩西律法被廢除了。</p><p>這樣，禁止描繪道成肉身的上帝意味著：</p><ol><li><p><strong>猶太化</strong>：繼續按摩西律法生活（順便說，什一奉獻也是按同樣的理由收取的，見<a href="https://bibleox.com/ru/ru/w/ozcY_О_десятине">什一奉獻</a>）；</p></li><li><p><strong>間接否認上帝道成肉身</strong>：或者否認基督是上帝，或者否認他是可見的。</p></li></ol><p>現在我們把問題考察得更詳細。</p><h2>摩西律法的第二誡</h2><p>反對聖像的人認爲聖像違反了<a href="https://bibleox.com/ru/ru/w/10-заповедей">摩西律法</a>的第二誡：</p><ol><li><p>“<strong>不可爲自己雕刻偶像；也不可作什麼形像</strong>彷彿上天、下地，和地底下、水中的百物。<strong>不可跪拜那些像</strong>；也不可事奉它”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L8-9">申 5:8-9</a>）；</p></li></ol><p>摩西的十誡分爲兩部分（兩塊法版）：</p><ul><li><p>四條關於愛上帝的誡命；</p></li><li><p>六條關於愛鄰人的誡命。</p></li></ul><p>第二誡屬於愛上帝的表現，它並不禁止一切的像和叩拜，而是禁止製造物件、把它們當作神來敬拜以代替獨一的真上帝。換言之，<strong>這條誡命禁止敬拜假神</strong>。正因爲如此，我們在聖經裏既看到像、也看到不違反這條誡命的叩拜。詳見下文。</p><h3>“不可作像”</h3><h4>上帝命令在他自己的聖殿裏製作像</h4><p>雖然第二誡禁止作像，但賜下這條誡命的同一上帝，如今命令在他的殿（會幕）裏製作像：在會幕的板壁上、在通入至聖所的幔子上描繪基路伯的像，並在約櫃的施恩座上製作基路伯的金像：</p><blockquote><p>“<strong><mark>你要用十幅幔子作帳幕</mark></strong>。這些幔子要用撚的細麻和藍色、紫色、硃紅色線製造，<strong><mark>並用巧匠的手工繡上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>)</p></blockquote><blockquote><p>“他們中間，凡心裏有智慧作工的，用十幅幔子作帳幕。這幔子是比撒列用撚的細麻和藍色、紫色、硃紅色線製造的，<strong><mark>並用巧匠的手工繡上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/36/#L8">出 36:8</a>)</p></blockquote><blockquote><p>“<strong><mark>要用金子錘出兩個基路伯來</mark></strong>，<strong><mark>安在施恩座的兩頭</mark></strong>。 這頭作一個基路伯，那頭作一個基路伯。二基路伯要接連一塊，在施恩座的兩頭。 二基路伯要高張翅膀，遮掩施恩座。基路伯要臉對臉，朝著施恩座。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L18-20">出 25:18-20</a>)</p></blockquote><p>在較晚的、所羅門建造的聖殿裏，有更多的各種像和雕像：</p><blockquote><p>“又用藍色、紫色、硃紅色線和細麻<strong><mark>織幔子</mark></strong>，<strong><mark>在其上繡出基路伯來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L14">代下 3:14</a>)</p></blockquote><blockquote><p>“<strong><mark>在至聖所按造像的法子造兩個基路伯</mark></strong>，用金子包裹。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L10">代下 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>他用橄欖木作兩個基路伯</mark></strong>，各高十肘，安在內殿。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L23">王上 6:23</a>)</p></blockquote><p>聖殿構造的詳情：<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷聖殿</a></p><p>爲製作殿內的器皿，上帝把聖靈的恩賜賜給了工匠們：</p><blockquote><p>“耶和華曉諭摩西說： 看哪！猶大支派中戶珥的孫子，烏利的兒子比撒列，<strong><mark>我已經提他的名召他</mark></strong>。 <strong><mark>我也以我的靈充滿了他</mark></strong>，使他有智慧，有聰明，有知識，能作各樣的工， <strong><mark>能想出巧工，用金、銀、銅製造各物</mark></strong>， 又能刻寶石，可以鑲嵌，能雕刻木頭，能作各樣的工。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/31/#L1-5">出 31:1-5</a>)</p></blockquote><h4>上帝命令製作蛇的像</h4><p>上帝還命令製作銅蛇，使望它的人奇妙地脫離蛇咬的死亡：</p><blockquote><p>“耶和華對摩西說：「<strong><mark>你製造一條火蛇</mark></strong>，掛在杆子上，<strong><mark>凡被咬的，一望這蛇，就必得活</mark></strong>。」 <strong><mark>摩西便製造一條銅蛇</mark></strong>，掛在杆子上，<strong><mark>凡被蛇咬的，一望這銅蛇，就活了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/21/#L8-9">民 21:8-9</a>)</p></blockquote><p>非常重要的是：這蛇是耶穌基督的像，應當指向他在十字架上將來的苦難：</p><blockquote><p>“<strong><mark>摩西在曠野怎樣舉蛇</mark></strong>，<strong><mark>人子也必照樣被舉起來</mark></strong>， <strong><mark>叫一切信他的都得永生</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L14-15">約 3:14-15</a>)</p></blockquote><p>這蛇後來被希西家王毀掉，因爲以色列人開始把蛇本身當作神，給它起了自己虛假的名字（尼忽士但）——這名字與真上帝沒有任何關係。他們離棄了真上帝，違反了第二誡：</p><blockquote><p>“他廢去邱壇，毀壞柱像，砍下木偶，<strong><mark>打碎摩西所造的銅蛇</mark></strong>，因爲到那時<strong><mark>以色列人仍向銅蛇燒香</mark></strong>。<strong><mark>希西家叫銅蛇爲銅塊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/18/#L4">王下 18:4</a>)</p></blockquote><h3>“不可跪拜那些像”</h3><p>雖然禁止敬拜像（聖像），但義人們經常向人、向各種物件、向天使下拜；別人也向先知下拜。沒有人因拜偶像而定他們的罪，因爲這些叩拜不是向假神（偶像）行的。</p><h4>向以天使形像顯現的上帝叩拜</h4><p>亞伯拉罕向以三個男人形像顯現的上帝叩拜：</p><blockquote><p>“耶和華在幔利橡樹那裏，<strong><mark>向亞伯拉罕顯現出來</mark></strong>。那時正熱，亞伯拉罕坐在帳棚門口， 舉目觀看，<strong><mark>見有三個人在對面站著</mark></strong>。他一見，就從帳棚門口跑去迎接他們，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L1-2">創 18:1-2</a>)</p></blockquote><p>爲什麼上帝以像顯現？——因爲上帝在本性上不可見，從來沒有人見過他（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L16">提前 6:16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>）。</p><h4>向天使叩拜</h4><p>先要指出：天使是靈（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13-14">希 1:13-14</a>），而靈沒有骨和肉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L39">路 24:39</a>）；就是說，天使也是以人的形像向人顯現的。所以，向天使叩拜，就是向看不見的靈（天使）的看得見之像叩拜：</p><blockquote><p>“他回答說：「不是的，我來是要作耶和華軍隊的元帥。」<strong><mark>約書亞就俯伏在地下拜</mark></strong>，說：「我主有什麼話吩咐僕人？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/5/#L14">書 5:14</a>)</p></blockquote><h4>向先知叩拜</h4><blockquote><p>“住耶利哥的先知門徒從對面看見他，就說：「感動以利亞的靈感動以利沙了。」他們就來迎接他，<strong><mark>在他面前俯伏於地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/2/#L15">王下 2:15</a>)</p></blockquote><h4>向聖殿叩拜</h4><p>大衛向聖殿叩拜——這殿本身就是天的聖像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>），並且殿中佈滿聖天使的像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>）：</p><blockquote><p>“至於我，我必憑你豐盛的慈愛，進入你的居所；我必存敬畏你的心，<strong><mark>向你的聖殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>)</p></blockquote><p>同時，上帝命令敬重聖殿（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>）。</p><h4>向上帝的腳凳（聖殿）叩拜</h4><blockquote><p>“你們當尊崇耶和華我們的上帝，<strong><mark>在他腳凳前下拜</mark></strong>；他本爲聖！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我們要進他的居所，在他腳凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>)</p></blockquote><h4>向約櫃叩拜</h4><blockquote><p>“約書亞便撕裂衣服；他和以色列的長老把灰撒在頭上，在耶和華的約櫃前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>)</p></blockquote><h4>向杖叩拜</h4><p>經上記著“以色列在牀頭上敬拜”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/47/#L31">創 47:31</a>），而在七十士譯本里是“在杖頭上”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L21">希 11:21</a>）。</p><p>更多例子：<a href="https://bibleox.com/ru/ru/w/поклоны">叩拜</a></p><h3>異教對偶像的信仰違反第二誡</h3><p>對偶像的異教信仰之所以違反第二誡，是因爲它<strong>在任何情形下</strong>都要求叩拜<strong>虛假的</strong>、<strong>並不存在的神</strong>。摩洛、巴力、宙斯、朱庇特和佩倫並不存在——他們是虛假的神。</p><p>對偶像的異教信仰有三種，從最普遍的一種開始：</p><ol><li><p><strong>偶像——就是神本身</strong>。異教徒親手製造的物件（偶像）本身就是神。</p></li><li><p><strong>偶像——虛假之神的形像</strong>，無論那神多麼遙遠，據說就應當長成這樣。</p></li><li><p><strong>偶像——</strong>（被神化的）<strong>自然元素的虛構形像</strong>：海、風、雨、火、土。</p></li></ol><p>在所有三種情形中，受敬禮的都是<strong>虛假的</strong>、<strong>並不存在的神</strong>。這是對謊言的信仰。</p><p>我們在聖經中遇到的正是第一種。聖經中所描述的最普遍的異教信仰，是<strong>對物件本身（物質）的神化</strong>。異教徒可以用手邊的材料爲自己造一個神，或者把已有的物件神化：</p><blockquote><p>“<strong><mark>他砍伐香柏樹</mark></strong>，又取柞樹和橡樹，在樹林中選定了一棵。他栽種松樹，得雨長養。 <strong><mark>這樹，人可用以燒火</mark></strong>。他自己取些烤火，又燒著烤餅，<strong><mark>而且作神像跪拜</mark></strong>，<strong><mark>作雕刻的偶像向它叩拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/44/#L14-15">賽 44:14-15</a>)</p></blockquote><blockquote><p>“當時拉班剪羊毛去了。<strong><mark>拉結偷了她父親家中的神像</mark></strong>。 &lt;…&gt; 現在你雖然想你父家，不得不去，<strong><mark>爲什麼又偷了我的神像呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/31/#L19,30">創 31:19,30</a>)</p></blockquote><blockquote><p>“再如：有個準備航海的人，行將在怒濤中航行之際，<strong>竟向一塊比自己乘的船還易壞的木頭呼求</strong>。……這種不虔敬的事，相沿日久，便成了習俗，以致守如法律；再加上君王的命令，<strong>彫像遂受崇拜</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/14/#L1,16">智 14:1,16</a>)</p></blockquote><blockquote><p>“君王對他說：「<strong>你不以爲貝耳是生活的神嗎？你不見貝耳每天吃喝那麼多嗎？</strong>」” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/14/#L6">但 14:6</a>) <em>(此段經文不在和合本中，引文按思高本。)</em></p></blockquote><blockquote><p>“祭祀對偶像有什麼用處？<strong>既不能吃，又不能聞</strong>：” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/30/#L19">德 30:19</a>) <em>(俄文本爲 Сир 30:19。)</em></p></blockquote><blockquote><p>“有一個銀匠，名叫底米丟，<strong><mark>是製造亞底米神銀龕的</mark></strong>，他使這樣手藝人生意發達。 他聚集他們和同行的工人，說：「衆位，你們知道我們是倚靠這生意發財。 <strong><mark>這保羅不但在以弗所</mark></strong>，也幾乎在亞西亞全地，引誘迷惑許多人，說：『<strong><mark>人手所作的，不是神</mark></strong>。』這是你們所看見、所聽見的。 這樣，<strong><mark>不獨我們這事業被人藐視</mark></strong>，就是大女神亞底米的廟也要被人輕忽，連亞西亞全地和普天下所敬拜的大女神之威榮也要銷滅了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L24-27">徒 19:24-27</a>)</p></blockquote><p>聖經中其他類似的地方：<a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола">異教徒對偶像的信仰</a></p><p>古代的哲學家作爲有思想的人，在維護自己異教信仰時，已經意識到：經人手加工的材料不可能是神。他們也可能說出別的判斷，說這不過是神的形像，或某個元素的虛構形像。但第二誡仍然被違反了。</p><p>虛假的異教之神，不僅因其名字或形像而是假的。關於神的謊言，也表現在神的數目、他們的能力、本質屬性上，而最主要的——表現在上帝關於自己受造物的旨意中，這旨意啟示在誡命裏。</p><p>爲清楚起見，逐項加以比較。</p><h4>異教的神</h4><ul><li><p>名字是虛假的（摩洛、巴力、宙斯、佩倫等等），</p></li><li><p>形像是虛假的（各種人形的像），</p></li><li><p>能力是虛假的（有限的，許多異教神各有不同的能力），</p></li><li><p>意志是虛假的（不是真上帝在誡命中所表達的旨意），</p></li><li><p>本質屬性是虛假的（不是永恆，不是無所不在，不是全知，不是無限，不是不朽，不是聖潔），</p></li><li><p>他召人去的是另一個（虛假的）地方，走另一條（虛假的）路。</p></li></ul><h4>正教會所信的上帝</h4><ul><li><p>聖經中真上帝的名字（自有者、父、子、聖靈、耶穌基督以及<a href="https://bibleox.com/ru/ru/w/Бог-имена">其他</a>）；</p></li><li><p>上帝親自藉此向世界顯現自己的那些形像（亞伯拉罕面前的三位天使——<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L1-2">創 18:1-2</a>，鴿子——<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L22">路 3:22</a>，以及最後，上帝之子真實所取的人的形像）；</p></li><li><p>描繪的是全能的宇宙創造者；</p></li><li><p>呼召人遵行神聖誡命的上帝（基督被描繪爲手中拿著打開的書，其中寫著他的誡命）；</p></li><li><p>描繪的是召人經由十字架之路與他同活的上帝（基督被描繪在十字架上，有十字形光環）。</p></li></ul><p>這樣，異教徒把像本身當作神，或當作（虛假之）神的形像，而正教會描繪的是真上帝，並不把製品（聖像）本身當作神。</p><p>此外，正教會也描繪上帝的朋友們：童貞女馬利亞上帝之母、天使、使徒、義人們。這不是謊言。他們都真實存在。同時，無論這些聖人和天使本身，還是他們的像，都不被視爲神。</p><p>正教會中的一切聖像都與福音書和十字架一樣作爲聖物受敬禮。對它們的敬禮歸向真上帝和他真實存在的朋友們。</p><h3>設立第二誡的緣由</h3><blockquote><p>“所以你們要分外謹慎，因爲耶和華在何烈山從火中對你們說話的那日，<strong><mark>你們沒有看見什麼形像</mark></strong>。 <strong><mark>惟恐你們敗壞自己，雕刻偶像</mark></strong>，彷彿什麼男像、女像， 或地上走獸的像，或空中飛鳥的像， 或地上爬物的像，或地底下水中魚的像。 <strong><mark>又恐怕你向天舉目觀看</mark></strong>，見耶和華你的上帝爲天下萬民所擺列的日、月、星，就是天上的萬象，<strong><mark>自己便被勾引敬拜事奉它</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/4/#L15-19">申 4:15-19</a>)</p></blockquote><h2>隨著基督的來臨，發生了改變</h2><h3>1. 舊約與摩西的律法終結了</h3><blockquote><p>“<strong><mark>但我們既然在捆我們的律法上死了</mark></strong>，現今就脫離了律法，<strong><mark>叫我們服事主</mark></strong>，<strong><mark>要按著心靈的新樣，不按著儀文的舊樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L6">羅 7:6</a>)</p></blockquote><blockquote><p>“<strong><mark>這樣，律法是與上帝的應許反對嗎</mark></strong>？斷乎不是！若曾傳一個能叫人得生的律法，義就誠然本乎律法了。 但聖經把衆人都圈在罪裏，使所應許的福因信耶穌基督歸給那信的人。 但這因信得救的理還未來以先，我們被看守在律法之下，直圈到那將來的真道顯明出來。 這樣，<strong><mark>律法是我們訓蒙的師傅，引我們到基督那裏</mark></strong>，使我們因信稱義。 <strong><mark>但這因信得救的理既然來到，我們從此就不在師傅的手下了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L21-25">加 3:21-25</a>)</p></blockquote><blockquote><p>“因他使我們和睦，將兩下合而爲一，<strong><mark>拆毀了中間隔斷的牆</mark></strong>， <strong><mark>而且以自己的身體廢掉冤仇</mark></strong>，就是那記在律法上的規條，爲要將兩下藉着自己造成一個新人，如此便成就了和睦。 既在十字架上滅了冤仇，<strong><mark>便藉這十字架使兩下歸爲一體</mark></strong>，與上帝和好了，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><p>基督訂立新約，以此終結舊約和摩西的律法（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L6">羅 7:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L21-25">加 3:21-25</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L14-16">弗 2:14-16</a>）。描繪上帝的禁令曾是摩西律法的一部分，摩西律法已隨基督的來臨被廢除（詳見<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">詳見</a>）。上帝藉摩西所賜的誡命失去其字面的意義：我們不守安息日的安息（也不殺安息日作工的人），不獻牲畜爲祭，不受割禮，不過猶太的節日，不獻什一奉獻；摩西律法的許多別的命令我們也不遵守。舊約和摩西的律法作爲整體被廢除了，而新約的信徒被召作執事的，不是按儀文的舊樣，而是按心靈的新樣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/3/#L6">林後 3:6</a>）——即理解上帝各種設立的緣由，領會其意義，遵守誡命的實質。</p><p>第二誡的字面意義禁止描繪的只是上帝，而不是他的聖潔僕人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>）。</p><p>第二誡的實質——不可敬拜假神。</p><p>相應地，正教會描繪聖人們，因爲這從來沒有被禁止，反而命令描繪他們（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L1">出 25:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>），而義人們在像前叩拜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>）。至於描繪上帝，則只在舊約裏被摩西律法所禁止，因爲那時沒有人見過上帝。而既然摩西律法被廢除，那麼描繪上帝的禁令作爲摩西律法的一部分也被廢除了。</p><h3>2. 上帝成爲可見的，取了人性（道成肉身）</h3><blockquote><p>“<strong><mark>從來沒有人看見上帝</mark></strong>，<strong><mark>只有在父懷裏的獨生子將他表明出來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>)</p></blockquote><blockquote><p>“論到從起初原有的生命之道，<strong><mark>就是我們所聽見、所看見、親眼看過、親手摸過的</mark></strong>。 （這生命已經顯現出來，我們也看見過，現在又作見證，將原與父同在，且顯現與我們那永遠的生命傳給你們。）” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L1-2">約壹 1:1-2</a>)</p></blockquote><h3>3. 天上實體改變了</h3><p>聖殿作爲地上的建築物，按上帝的定意起初就是天上實體的像：上帝命令先知摩西建造聖殿，不是因爲上帝需要聖殿——上帝不需要它（<a href="https://bibleox.com/zh-Hans/cn-cuv/is/66/#L1">賽 66:1</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/ps/50/#L13">詩 50:13</a>；<a href="https://bibleox.com/zh-Hans/cn-cuv/is/1/#L11">賽 1:11</a>）。</p><p>然而，隨著基督的來臨，發生了改變：</p><ol><li><p><strong>基督——上帝——以看得見的方式在天上登基</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L21">啟 3:21</a>）；</p></li><li><p><strong>天上出現了人</strong>（除基督本身之外），他們獲准與基督在天上同活（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1,3-5">啟 14:1,3-5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-24">希 12:22-24</a>）。</p></li></ol><p>天上實體改變了。先前的已不存在。耶路撒冷的聖殿成了過去的天上實體之像，而不是現在的。因此基督徒從最古老的年代起描繪新的天上實體，把在天空明顯登基的耶穌基督（上帝）的像立在最前面，周圍——描繪他聖潔的僕人們，如今已不只是天使，還有人。</p><p>標誌性的事件是基督的祭獻之後耶路撒冷聖殿的損壞：</p><blockquote><p>“忽然，<strong><mark>殿裏的幔子從上到下裂爲兩半</mark></strong>，地也震動，磐石也崩裂， 墳墓也開了，已睡聖徒的身體，多有起來的。 <strong><mark>到耶穌復活以後</mark></strong>，他們從墳墓裏出來，<strong><mark>進了聖城，向許多人顯現</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L51-53">太 27:51-53</a>)</p></blockquote><p>而在70年代，聖殿被羅馬人完全毀滅，在隨後的一切千百年裏，把位置讓給了新的天上實體之像——正教聖殿。</p><h2>上帝親自制作自己的聖像</h2><p>從來沒有人見過上帝：</p><blockquote><p>“<strong><mark>從來沒有人看見上帝</mark></strong>，只有在父懷裏的獨生子將他表明出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>)</p></blockquote><p>但上帝多次以像（聖像）的樣式顯現：</p><h3>上帝以三位天使的樣式向亞伯拉罕顯現</h3><p>三位天使不是上帝的本相、不是他在創世之前所是的；就是說，這是上帝的像（希臘文 εἰκόνα——聖像），而亞伯拉罕拜的是上帝的聖像：</p><blockquote><p>“耶和華在幔利橡樹那裏，<strong><mark>向亞伯拉罕顯現出來</mark></strong>。那時正熱，亞伯拉罕坐在帳棚門口， 舉目觀看，<strong><mark>見有三個人在對面站著</mark></strong>。他一見，就從帳棚門口跑去迎接他們，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L1-2">創 18:1-2</a>)</p></blockquote><p>亞伯拉罕拜了三位天使樣式的上帝之像之後，他事奉的是上帝，還是上帝的像？顯然，是上帝。</p><h3>上帝明顯與雅各較力</h3><blockquote><p>“<strong><mark>只剩下雅各一人</mark></strong>。有一個人來和他摔跤，直到黎明。 &lt;…&gt; 那人說：「你的名不要再叫雅各，要叫以色列，<strong><mark>因爲你與上帝與人較力，都得了勝</mark></strong>。」 &lt;…&gt; 雅各便給那地方起名叫毘努伊勒，意思說：「<strong><mark>我面對面見了上帝，我的性命仍得保全</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/32/#L24,28,30">創 32:24,28,30</a>)</p></blockquote><h3>上帝經由像與先知摩西交談</h3><blockquote><p>“耶和華說：「你們且聽我的話：你們中間若有先知，<strong><mark>我耶和華必在異象中向他顯現</mark></strong>，在夢中與他說話。 <strong><mark>我的僕人摩西不是這樣</mark></strong>；他是在我全家盡忠的。 <strong><mark>我要與他面對面說話</mark></strong>，乃是明說，不用謎語，<strong><mark>並且他必見我的形像</mark></strong>。你們毀謗我的僕人摩西，爲何不懼怕呢？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/12/#L6-8">民 12:6-8</a>)</p></blockquote><h3>上帝以鴿子的樣式降在耶穌基督身上</h3><blockquote><p>“<strong><mark>聖靈降臨在他身上，形狀彷彿鴿子</mark></strong>．<strong><mark>又有聲音從天上來</mark></strong>，說：「你是我的愛子，我喜悅你。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L22">路 3:22</a>)</p></blockquote><p>同樣見：<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L16">太 3:16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L10">可 1:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L32">約 1:32</a></p><h3>人——是上帝的聖像</h3><blockquote><p>“<strong><mark>上帝就照著自己的形像造人</mark></strong>，<strong><mark>乃是照著他的形像造男造女</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L27">創 1:27</a>)</p></blockquote><blockquote><p>“亞當的後代記在下面。<strong><mark>當上帝造人的日子，是照著自己的樣式造的</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/5/#L1">創 5:1</a>)</p></blockquote><blockquote><p>“凡流人血的，他的血也必被人所流，<strong><mark>因爲上帝造人，是照自己的形像造的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/9/#L6">創 9:6</a>)</p></blockquote><blockquote><p>“其實天主造了人，原是不死不滅的，<strong>使他成爲自己本性的肖像</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/2/#L23">智 2:23</a>)</p></blockquote><h2>耶穌基督——父上帝的像（聖像）</h2><blockquote><p>“你們當以基督耶穌的心爲心。 <strong><mark>他本有上帝的形像</mark></strong>，不以自己與上帝同等爲強奪的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L5-6">腓 2:5-6</a>)</p></blockquote><blockquote><p>“他<strong><mark>是上帝榮耀所發的光輝，是上帝本體的真像</mark></strong>，常用他權能的命令托住萬有，他洗淨了人的罪，就坐在高天至大者的右邊．” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L3">希 1:3</a>)</p></blockquote><blockquote><p>“此等不信之人，被這世界的神弄瞎了心眼，不叫基督榮耀福音的光照著他們。<strong><mark>基督本是上帝的像</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/4/#L4">林後 4:4</a>)</p></blockquote><blockquote><p>“又感謝父，叫我們能與衆聖徒在光明中同得基業。 他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裏； 我們在愛子裏得蒙救贖，罪過得以赦免。 <strong><mark>愛子是那不能看見之上帝的像</mark></strong>，<strong><mark>是首生的，在一切被造的以先</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L12-15">西 1:12-15</a>)</p></blockquote><blockquote><p>“腓力對他說：「<strong><mark>求主將父顯給我們看</mark></strong>，我們就知足了。」 耶穌對他說：「腓力，我與你們同在這樣長久，你還不認識我麼？<strong><mark>人看見了我，就是看見了父</mark></strong>。你怎麼說『將父顯給我們看』呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L8-9">約 14:8-9</a>)</p></blockquote><h3>不尊敬父之像的，就是不尊敬父</h3><blockquote><p>“叫人都尊敬子如同尊敬父一樣。<strong><mark>不尊敬子的，就是不尊敬差子來的父</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L23">約 5:23</a>)</p></blockquote><h3>拒絕父之像的，就沒有父</h3><blockquote><p>“<strong><mark>凡不認子的，就沒有父</mark></strong>；<strong><mark>認子的，連父也有了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L23">約壹 2:23</a>)</p></blockquote><h3>恨父之像的，就是恨父</h3><blockquote><p>“<strong><mark>恨我的，也恨我的父</mark></strong>。 我若沒有在他們中間行過別人未曾行的事，他們就沒有罪；<strong><mark>但如今連我與我的父，他們也看見也恨惡了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L23-24">約 15:23-24</a>)</p></blockquote><h3>一切受造之物都當向父之像叩拜</h3><blockquote><p>“<strong><mark>叫一切在天上的、地上的和地底下的</mark></strong>，<strong><mark>因耶穌的名無不屈膝</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L10">腓 2:10</a>)</p></blockquote><h2>上帝藉聖人的像施行醫治</h2><p>上帝賜人醫治，不但經由聖使徒遺下的衣物（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L12">徒 19:12</a>），甚至經由使徒的像（影子）：</p><blockquote><p>“甚至有人將病人抬到街上，放在牀上或褥子上，<strong><mark>指望彼得過來的時候，或者得他的影兒照在什麼人身上</mark></strong>。 還有許多人帶著病人和被污鬼纏磨的，從耶路撒冷四圍的城邑來，<strong><mark>全都得了醫治</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h2>上帝不回答拜偶像的人</h2><blockquote><p>“所以你要告訴他們：『主耶和華如此說：<strong><mark>以色列家的人中，凡將他的假神接到心裏</mark></strong>，<strong><mark>把陷於罪的絆腳石放在面前</mark></strong>，又就了先知來的，<strong><mark>我耶和華在他所求的事上，必按他衆多的假神回答他</mark></strong>， 好在以色列家的心事上捉住他們，因爲<strong><mark>他們都藉着假神與我生疏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/14/#L4-5">結 14:4-5</a>)</p></blockquote><blockquote><p>“<strong><mark>你們奉上供物使你們兒子經火的時候</mark></strong>，<strong><mark>仍將一切偶像玷污自己</mark></strong>，直到今日嗎？<strong><mark>以色列家啊，我豈被你們求問嗎</mark></strong>？主耶和華說，我指著我的永生起誓，<strong><mark>我必不被你們求問</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/20/#L31">結 20:31</a>)</p></blockquote><p>然而，反對聖像的人通常承認，正教的敬禮聖像者可以與上帝有相通。但聖經裏寫著：上帝不回答拜偶像的人。</p><h2>聖像能救人嗎</h2><p>正教徒被指責，說有人會使用“聖像拯救了”或“聖像醫治了”的說法。施行拯救和醫治的是上帝；雖然我們通常不用“聖像拯救了”這樣的說法，但它們是允許的——如果所指的是：不是聖像的材料本身，而是上帝藉著這材料施行了醫治和拯救。</p><h4>使徒救人</h4><blockquote><p>“<strong><mark>或者可以激動我骨肉之親發憤</mark></strong>，<strong><mark>好救他們一些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/11/#L14">羅 11:14</a>)</p></blockquote><blockquote><p>“向軟弱的人，我就作軟弱的人，爲要得軟弱的人；向什麼樣的人，我就作什麼樣的人。<strong><mark>無論如何總要救些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/9/#L22">林前 9:22</a>)</p></blockquote><h4>妻子救人</h4><blockquote><p>“<strong><mark>你這作妻子的，怎麼知道不能救你的丈夫呢</mark></strong>？<strong><mark>你這作丈夫的，怎麼知道不能救你的妻子呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L16">林前 7:16</a>)</p></blockquote><h4>使徒呼召拯救人</h4><blockquote><p>“有些人存疑心，你們要憐憫他們； <strong><mark>有些人你們要從火中搶出來</mark></strong>、<strong><mark>搭救他們</mark></strong>；有些人你們要存懼怕的心憐憫他們；連那被情慾沾染的衣服也當厭惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L22-23">猶 1:22-23</a>)</p></blockquote><blockquote><p>“你要謹慎自己和自己的教訓，要在這些事上恆心。因爲這樣行，<strong><mark>又能救自己，又能救聽你的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L16">提前 4:16</a>)</p></blockquote><h4>難道除了基督還有誰能救人嗎？</h4><p>無論使徒還是夫妻，都不是主耶穌基督意義上的救主——他是唯一的救贖者，把人類從死亡和陰間中救出、賜復活和與上帝同在的永生。但如上所見，“我要救”這樣的說法是使徒們所用的。我們正確地理解這些話的意義——人可以促進得救：“因爲我們是與上帝同工的”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L9">林前 3:9</a>）。</p><p>聖像也是這樣：拯救的不是聖像，而是上帝；上帝經由物件賜下恩典。在聖經裏我們可以找到許多這樣的例子，詳見下文。</p><h2>關於“聖像——通向屬靈世界的窗戶”的說法</h2><p>聖像是一種通向屬靈世界的窗戶。這一說法沒有任何神祕的意義，是形象化的表達。它只是說：觀看聖像時，我們彷彿透過窗戶看向看不見的屬靈世界。</p><p>屬靈的事物是不可見的，而聖像畫家把不可見的以可見的方式、藉著象徵描繪在聖像上。例如，上帝的恩典住在聖人裏面，以他們頭上的光環描繪；沒有影子意味著住在上帝的光中（這光不是尋常的光，不投下影子）；意義包含在手上所示的姿勢、衣著的顏色、衣服上的特別標記（上帝之母衣服上的三顆星）、周圍的物件、建築、空間之中。觀看這一切，我們認識到關於看不見的屬靈世界的某些事。正因爲如此，有時才使用這樣的說法：聖像彷彿是通向屬靈世界的窗戶（詳見<a href="https://monastery.ru/propovedi/okno-v-dukhovnyy-mir/" lang="ru">俄語</a>）。</p><p>爲什麼這需要特別說明？因爲經常不得不遇到：反對正教會的人爲了編造自己的指控，乾脆憑空捏造指控，灌輸給自己的追隨者，在他們心裏培植對正教會的仇恨。例如，爲把正教徒描繪成可憎的巫師，教會的反對者捏造說：正教徒彷彿經由聖像與上帝建立聯繫，如同經由某種能量門戶，因此需要聖像來與上帝相交。這一切純屬虛構。</p><p>正教會召呼信徒隨處祈禱，無論有沒有聖像。聖像只是幫助教育和祈禱的輔助手段。祈禱時，聖像幫助集中思想：不渙散、不分心。聖像也是表達對像中所描繪之位格的敬意的手段。各種物件，包括聖像，可以成爲上帝向人賜下自己恩典的途徑——詳見下一節。</p><h2>上帝經由物件和像的運作</h2><p>正教徒被指責說，他們不但期待直接從上帝來的幫助，也期待經由物件和像而來的幫助。但這信仰不違揹聖經——聖經中上帝多次經由物件和像行事。</p><h3>聖髑</h3><p>藉遺骸（聖髑）的復活。這裏我們既看不見任何人的信心，也看不見祈禱；除了死人偶然觸到先知的骸骨，什麼也沒有：</p><blockquote><p>“有人正葬死人，忽然看見一羣人，就把死人拋在以利沙的墳墓裏，<strong><mark>一碰著以利沙的骸骨，死人就復活站起來了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h3>衣物</h3><blockquote><p>“<strong><mark>甚至有人從保羅身上拿手巾或圍裙放在病人身上，病就退了，惡鬼也出去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L12">徒 19:12</a>)</p></blockquote><h3>像</h3><blockquote><p>“甚至有人將病人抬到街上，放在牀上或褥子上，<strong><mark>指望彼得過來的時候，或者得他的影兒照在什麼人身上</mark></strong>。 還有許多人帶著病人和被污鬼纏磨的，從耶路撒冷四圍的城邑來，<strong><mark>全都得了醫治</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h3>水</h3><blockquote><p>“<strong><mark>因爲有天使按時下池子攪動那水</mark></strong>，水動之後，<strong><mark>誰先下去，無論害什麼病就痊瘉了</mark></strong>。』〕” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L4">約 5:4</a>)</p></blockquote><h3>更多</h3><p><a href="https://bibleox.com/ru/ru/w/Исцеления">醫治</a></p><h2>正教會關於敬禮聖像的教訓</h2><h3>367位聖教父關於敬禮聖像的信經——第七次大公會議，尼西亞（787年）</h3><p>“我們完整地保守教會的一切傳統，無論是書面的還是非書面的。其中一個傳統命令製作聖像彩繪；因爲它與福音宣講的歷史相合，證實上帝的道真實地、而非虛幻地成了肉身，並且對我們有益：因爲彼此互相說明的事物，無疑也彼此互相證實。我們循著王道、追隨我們聖教父的聖訓和公教會的聖傳行進——因爲我們知道，聖靈住在她裏面——以一切的謹慎和明察確定：可敬的聖像應被陳設（供敬禮），如同生命給予者的十字架之像一樣，無論它們由顏色、或由（馬賽克）小塊、或由任何別的材料製成，只要是以合宜的方式製成；無論它們在上帝的聖堂裏、在神聖的器皿和衣袍上、在牆壁和木板上，或在家裏和路旁；無論這是我們的主上帝救主耶穌基督的像，或我們至潔的聖母、上帝之母的像，或可敬的天使及一切聖人和義人的像。——藉聖像他們越常被我們默觀，觀看這些像的人就越被激勵記念原型，對他們獲得更多的愛，並受到更多的激勵向他們獻上親吻、敬意和叩拜；但這絕不是那按我們的信仰只歸於上帝本性的真正事奉。他們被激勵向聖像獻香、爲它們點燈，如同爲主基督之像、爲聖天使們那樣，如同古時按虔誠的心意習慣所行的那樣：因爲向聖像所獻的敬意歸於它的原型；敬拜聖像的人，敬拜的是像中所描繪者的位格。這樣的教導保存在我們的聖教父們那裏，即在公教會的傳統中，在其中福音代代相傳。”</p><p>（[俄文](https://azbyka.ru/otechnik/7_Vselenskij_Sobor)第七次大公會議，決議7）</p><h3>君士坦丁堡牧首耶利米（1576年）</h3><p>“至於第二十一篇——也是論及敬禮聖人、並說紀念聖徒有益於堅固我們的信仰——的最後一章，如果我們想到他們如何藉信心領受了上帝的恩典和幫助，我們說：呼求主要地只與上帝一位相宜，並且首先和本然地歸於他；而對聖人們所行的呼求，不是在本然的意義上，彷彿偶然地、按恩典而歸於他們。因爲聽那些呼求他們的，不是彼得或保羅，而是他們所具有的恩典——照主的話：‘我就常與你們同在，直到世界的末了’（太 28:20）。</p><p>神聖的使徒保羅寫信給羅馬人，論呼求上帝說：‘人未曾信他，怎能求他呢？’（羅 10:14）——由此表明：只應當呼求我們所信的那獨一者，即上帝。而我們把呼求本然地歸於獨一的上帝，由我們在神聖的奧蹟中呼求‘我們在天上的父’等，可以看見。在另一處：‘萬軍之主啊，求你與我們同在；除你以外，我們沒有別的患難中的幫助者。’又說：‘除你以外，我們沒有認識別的上帝。’我們使一切聖徒作中保，而首先是主之母，與她一起的還有天使和聖人的團契；我們以聖殿、奉獻、呼求、神聖的聖像相對地（而非事奉地）尊敬他們。因爲我們知道，事奉只應首先獻給獨一的上帝，除他以外不應承認別人爲上帝，不可敬拜‘別神’（詩 80:10）。我們寧可自己不願成爲聖人，也不願因相對的敬禮而陷入把聖人們神化。斷乎不可：因爲不相對地敬拜聖像，是不虔的、與基督的教會和她的兒女相違的，因爲對它們的尊敬歸於原型，如瓦西里所說：我們承認一切聖徒都是我們的中保和代求者，並且說，不但在今世，且在未來的世代裏都會有某種代求：因爲天使和聖人們將爲某些人懇求，而世界的主母也不少於他們；但絕不是爲一切人，也絕不爲人任何死在罪中的——斷然不；因爲上帝對這樣的人完全關閉了自己的憐憫，爲此他啟示了以下的事：‘他們中間雖有挪亞、但以理、約伯，也不能因他們的義救自己的兒女’（結 14:14,18）。只有爲那些——他們的懇求易於蒙垂聽的——人，即以悔改先於自己生命之終、卻還未能洗淨罪之污穢的人，教會才向上帝懇求；並且只是在審判還在進行的時候。這景象結束後，當每個人被帶到指定的刑罰之地，代求就不可能，也就沒有代求了。這代求如今也在教會中宣告：我們向聖徒們呼求，也向我們的主母，向聖天使們呼求。向我們的主母——如此：‘至聖聖母上帝之母，爲我們罪人祈禱’；向聖天使們如此：‘天上諸品聖天使總領天使們，爲我們罪人祈禱’——同樣向主的先驅施洗者先知、向光榮的使徒、先知、殉道者、修士、牧者們、普世的教師們和其餘一切聖人。我們也求聖婦們的團契爲我們罪人祈禱；我們求上帝，願他按自己的恩典和十字架不可戰勝、不可測度的神聖能力，憐憫我們這些事奉他、居於宣信和懺悔之中、求我們心靈之眼得蒙光照的人，好叫我們不至於在罪中睡著而死亡，叫仇敵不能在我們身上得逞。這樣，藉我們所說的這一切人的代求，我們求上帝憐憫我們，把我們從惡者的網羅中救出。”</p><p>（[俄文](https://azbyka.ru/otechnik/Ieremij_II_Konstantinopolskij/Otvety_liuteranam)《答路德宗徒書，第一書》）</p><p>還有更詳細的《答路德宗徒第二書》，其中詳細考察了敬禮聖像：[第二書]。</p><p>還有簡短的第三書：[第三書]。</p><h2>對批評的回應</h2><h3>“你們刪去了上帝十誡中的一誡”</h3><p>你們守<strong>第四</strong>條關於安息日安息的誡命嗎？安息日里你們什麼工都不作嗎？你們把安息日作工的弟兄姊妹殺了嗎？你們爲褻瀆或拜偶像殺人嗎？如果你們不作這些，那是爲什麼？難道你們沒有刪去上帝的誡命？爲什麼忽略了這一點：你們自己不守第四誡，卻要求遵守第二誡？</p><p>摩西的律法被廢除了。基督徒跟隨基督。第二誡顯然不禁止像及其敬禮，因爲上帝命令在自己的殿裏製作像，命令敬重聖殿，而先知們在帶像的聖物前叩拜。誡命禁止的是描繪上帝，以及禁止拜偶像（敬禮並事奉假神）。</p><h3>“你們向聖像獻香，如以色列人向尼忽士但獻香”</h3><p>以色列人的錯誤不在於獻香（獻香是上帝自己設立的），而在於他們虛構了一個假神，稱它爲尼忽士但，並且不再事奉上帝，而是事奉他們所虛構的尼忽士但——顯然是把物件本身當作神明，以色列人中一向如此（詳見<a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола#HH-Язычники-израильтяне-считали-богом-само-изделие-а-также-стихии">詳見</a>）。被虛構的不只是名字，還有討尼忽士但喜悅的方式，隨之而來的是它的虛構意志（誡命）。這就是拜偶像，即事奉假神。它使人離開上帝和按他旨意的生活，把人引向按尼忽士但（其作者）意志的生活。</p><p>正教徒描繪的是真上帝，稱他的本名，遵守他的誡命，不把物件（聖像）當作神；他們叩拜和獻香不是向聖像，而是向上帝。這不是拜偶像，因爲這裏連假神都沒有，也沒有對假神的事奉——不像尼忽士但的僕役們那樣。</p><h3>“上帝說了描繪，但沒有說敬禮”</h3><p>不是這樣。在聖經裏可以看到：上帝既命令製作像，也命令敬禮它們。聖經裏有敬禮像的實踐。</p><p>上帝命令敬禮聖殿——而聖殿按上帝自己的構想，就是天上實體的像（聖像）。先知大衛向帶像的聖殿叩拜；先知約書亞向帶像的約櫃叩拜。這樣，敬禮像是上帝命令的，先知們也敬禮了帶像的聖物，在它們面前叩拜。毫無疑問，先知們把這敬禮歸於上帝：就是說，敬禮像，就是敬禮原型。正教基督徒所作的正是同樣的事。</p><h3>“以防萬一，還是把聖像撤掉吧”</h3><p>聽了我們的解釋之後，反對敬禮聖像的人常會同意我們的聖像敬禮是允許的；但他們說，不是我們所有人都足夠好地認識教會的教訓，仍有人把聖像當偶像對待；所以——他們說——最好把聖像撤掉，以免絆倒。</p><p>我們不同意，因爲聖像是需要的，而對它們的錯誤態度應當藉教育、藉解釋正確的信仰來消除。</p><p>有些人錯誤地理解聖經；然而這並不迫使我們爲了避免絆倒而拒絕聖經。這隻會使我們必須進行教育、正確地解釋聖經的話語。</p><h3>對歷史和教父傳統部分批評的回應</h3><p><a href="https://bibleox.com/ru/ru/w/иконы-почитают#HH-Критика">詳見</a></p><h2>結論</h2><p>這樣，我們認爲，那些把敬禮聖像與敬拜假神（偶像）混爲一談的人是錯誤的；指控正教徒拜偶像，是對信徒的不公正的指控，是對正教信仰的歪曲觀念。</p><p>聖像只是關於上帝、人、事件的正確的解釋和提醒；它既不被當作上帝敬禮，也不被當作代替上帝的東西敬禮。我們對與上帝相關之物表現出基本的敬意：如同人們尊敬國旗，不是爲那特別的布料，而是爲尊敬國家本身；尊敬總統的畫像，不是爲紙張和顏料的質量，而是爲總統本人；尊敬十字架和福音書，不是爲名貴的木料和書的材料，而是因爲上帝在十字架上爲我們的得救被釘，而書裏寫著他救恩的話語。</p><p>聖像被召幫助人對上帝、他的母親和他的朋友們表達敬意。聖像可以幫助人在祈禱中集中注意力，把思想引向上帝。</p><p>有時，完全不是出於我們的意願，上帝親自藉聖像和其他物件顯明奇蹟和醫治；這自然使我們想到對這物件特別的敬意——但不是代替上帝，而是爲了上帝：如同上帝有一次對先知摩西說到必須敬重聖地那樣：</p><blockquote><p>“上帝說：「不要近前來，當把你腳上的鞋脫下來，因爲<strong><mark>你所站之地是聖地</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L5">出 3:5</a>)</p></blockquote><p>先知大衛也對聖物心存敬畏，向聖物叩拜：</p><blockquote><p>“你們當尊崇耶和華我們的上帝，<strong><mark>在他腳凳前下拜</mark></strong>；他本爲聖！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>)</p></blockquote><p>而對那些沒有這種敬畏的人，上帝賜下致死的刑罰：</p><blockquote><p>“反而<strong>自高自大，抵抗上天的大主，命人將他殿宇的器皿給你拿來</strong>，供你和你的大臣並你的妻妾用來飲酒，並且你讚美那些不能看，不能聽，不能知的金、銀、銅、鐵、木、石制的神像，卻不知尊崇那掌握你的氣息，註定你一切命途的天主。<strong>當夜加色丁王貝耳沙匝即爲人所殺。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/5/#L23,30">但 5:23,30</a>)</p></blockquote><p>這樣，簡單地說：當敬禮的是假神或指向假神之物時，這就是拜偶像，即敬禮並叩拜假神（偶像）。對這樣的人、物件和像的宗教性敬禮，正教會不教導，並且譴責。</p><p>對真上帝的敬禮引向對一切與他相關之物的敬禮。上帝被當作上帝敬禮，而他的朋友們和忠心的僕人們——被當作他的朋友和忠心僕人敬禮，而不是被當作上帝。王被尊敬爲王，而他的近臣——被尊敬爲近臣，而不是王。在這樣的敬禮裏沒有假神。正教會教導的正是這樣的信仰。</p><h2>相關引文</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬禮聖人</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">敬禮聖髑</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Выбор_места_как_форма_почитания">地方的選擇作爲敬禮的形式</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">爲聖人祈禱</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">人的構成</a></p></li></ol>
