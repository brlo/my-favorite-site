  path: QS7A_墮胎
  title: 墮胎
  copy_cover: true
  body: <h2>殺人是罪</h2><blockquote><p>“<strong><mark>不可殺人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L13">出 20:13</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L17">申 5:17</a>)</p></blockquote><blockquote><p>“他說：「什麼誡命？」耶穌說：「就是『<strong><mark>不可殺人</mark></strong>，不可姦淫，不可偷盜，不可作假見證，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L18">太 19:18</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L21">太 5:21</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L19">可 10:19</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L20">路 18:20</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/13/#L9">羅 13:9</a>)</p></blockquote><p>無論是尚在母腹中、還是已經出生的嬰兒，都是人。殺人是罪。</p><p>在古老的基督教文獻（《十二宗徒訓言》）中直截了當地說到這一點：</p><blockquote><p>「<strong>不可墮殺胎中的嬰兒</strong>，也不可在出生後殺死他。」</p></blockquote>（<a href="https://azbyka.ru/otechnik/pravila/didahe_rus/">《十二宗徒訓言》</a>）<h2>嬰兒也是人。無論在母腹內，還是在母腹外</h2><p>聖經把遠早於預產期（懷孕三四個月）出生的人也稱爲嬰孩：</p><blockquote><p>“甫滿週歲的嬰孩要用聲音說話；懷孕的婦人要在三四個月時生下不足月的嬰孩，他們要存活，並且健壯。” (<a href="https://bibleox.com/zh-Hant/ru/3ezd/6/#L21">厄四 6:21</a>, )</p></blockquote><p>讚美那些拒絕殺死剛出生嬰兒的收生婆：</p><blockquote><p>“但是<strong><mark>收生婆敬畏上帝</mark></strong>，不照埃及王的吩咐行，<strong><mark>竟存留男孩的性命</mark></strong>。 &lt;…&gt; 上帝厚待收生婆。以色列人多起來，極其強盛。 收生婆因爲敬畏上帝，上帝便叫她們成立家室。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/1/#L17,20-21">出 1:17,20-21</a>)</p></blockquote><p>先知施洗約翰在母腹中、在出生之前，就已被聖靈充滿。也就是說，並不是什麼「將來會成爲人的東西」，而是先知約翰自己，還在母腹中時，就成了上帝之靈的殿：</p><blockquote><p>“他在主面前將要爲大，淡酒濃酒都不喝，<strong><mark>從母腹裏就被聖靈充滿了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L15">路 1:15</a>)</p></blockquote><p>上帝在母腹中所造的，不是什麼「後來才成爲人」的東西，而是人本身；這個人後來只是從母腹中出來，也就是出生。上帝在人出生之前就使他成聖：</p><blockquote><p>“「<strong><mark>我未將你造在腹中</mark></strong>，我已曉得你；<strong><mark>你未出母胎，我已分別你爲聖</mark></strong>；我已派你作列國的先知。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/1/#L5">耶 1:5</a>)</p></blockquote><p>忍受苦難的先知約伯也這樣說。上帝在母腹中造的是我們，而不是什麼「後來會成爲人」的東西：</p><blockquote><p>“<strong><mark>造我在腹中的</mark></strong>，不也是造他嗎？<strong><mark>將他與我摶在腹中的豈不是一位嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/31/#L15">伯 31:15</a>)</p></blockquote><p>人在母腹中的發育過程被描述爲上帝自己的創造行動。這被描述爲：人已經存在，卻像穿衣服一樣穿上肉體，爲要出來到世界上。約伯所說的不是某種後來才成爲約伯的質料；他直接把這胚胎說成是他自己：難道不是你給我穿上肉體的嗎？</p><blockquote><p>“你的手創造我，造就我的四肢百體；你還要毀滅我。 求你記念，製造我如摶泥一般；你還要使我歸於塵土嗎？ <strong><mark>你不是倒出我來好像奶，使我凝結如同奶餅嗎？ 你以皮和肉爲衣給我穿上，用骨與筋把我全體聯絡</mark></strong>。 你將生命和慈愛賜給我，你也眷顧保全我的心靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/10/#L8-12">伯 10:8-12</a>)</p></blockquote><p>先知大衛也描述說：</p><blockquote><p>“我的肺腑是你所造的。<strong><mark>我在母腹中，你已覆庇我</mark></strong>。 &lt;…&gt; <strong><mark>我在暗中受造，在地的深處被聯絡</mark></strong>，那時，我的形體並不向你隱藏。 <strong><mark>我未成形的體質，你的眼早已看見了</mark></strong>。你所定的日子，我尚未度一日，你都寫在你的冊上了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/139/#L13,15-16">詩 139:13,15-16</a>) <em>(俄文本編號爲 Пс 138:13,15-16（聖詠編號相差一）。)</em></p></blockquote>
