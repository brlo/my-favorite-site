- src: колдовство
  path: QS8A_行邪術
  title: 行邪術
  copy_cover: true
  body: <h2>罪</h2><p>「行邪術」一節還包括其餘的一切：</p><ul><li><p>占卜（任何形式的），</p></li><li><p>招魂、通靈，</p></li><li><p>相信法術（任何法術，黑法術、白法術），</p></li><li><p>相信護身符的能力（包括紅繩），</p></li><li><p>被咒語加持過的物件，</p></li><li><p>星座運勢（占星術），</p></li><li><p>求問特異功能者，</p></li><li><p>巫師、</p></li><li><p>法師、</p></li><li><p>女巫、</p></li><li><p>占卜者、</p></li><li><p>行邪術的、</p></li><li><p>替人「解眼」、「解咒」、「解祖咒」的老太婆，</p></li><li><p>等等：</p></li></ul><blockquote><p>“你到了耶和華你上帝所賜之地，那些國民所行可憎惡的事你不可學著行。 你們中間不可有人使兒女經火，也不可有<strong><mark>占卜的、觀兆的、用法術的、行邪術的</mark></strong>、 <strong><mark>用迷術的、交鬼的、行巫術的、過陰的</mark></strong>。 <strong><mark>凡行這些事的，都爲耶和華所憎惡</mark></strong>；因那些國民行這可憎惡的事，所以耶和華你的上帝將他們從你面前趕出。 你要在耶和華你的上帝面前作完全人。 因你所要趕出的那些國民都<strong><mark>聽信觀兆的和占卜的</mark></strong>；至於你，耶和華你的上帝從來不許你這樣行。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/18/#L9-14">申 18:9-14</a>)</p></blockquote><blockquote><p>“又使他們的兒女經火，<strong><mark>用占卜、行法術賣了自己</mark></strong>，行耶和華眼中看爲惡的事，惹動他的怒氣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/17/#L17">王下 17:17</a>)</p></blockquote><blockquote><p>“<strong><mark>並在欣嫩子谷使他的兒女經火</mark></strong>；<strong><mark>又觀兆、用法術、行邪術、立交鬼的和行巫術的</mark></strong>，<strong><mark>多行耶和華眼中看爲惡的事</mark></strong>，惹動他的怒氣； <strong><mark>又在上帝殿內立雕刻的偶像</mark></strong>。上帝曾對大衛和他兒子所羅門說：「我在以色列各支派中所選擇的耶路撒冷和這殿，必立我的名直到永遠。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/33/#L6-7">代下 33:6-7</a>)</p></blockquote><blockquote><p>“有人對你們說：「當求問那些<strong>交鬼的和行巫術的</strong>，就是聲音綿蠻，言語微細的。」你們便回答說：「<strong>百姓不當求問自己的上帝嗎？豈可爲活人求問死人呢</strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/8/#L19">賽 8:19</a>)</p></blockquote><blockquote><p>“至於你們，<strong><mark>不可聽從你們的先知和占卜的、圓夢的、觀兆的以及行邪術的</mark></strong>。他們告訴你們說：你們不至服事巴比倫王。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/27/#L9">耶 27:9</a>)</p></blockquote><blockquote><p>“萬軍之耶和華以色列的上帝如此說：「<strong><mark>不要被你們中間的先知和占卜的誘惑</mark></strong>，<strong><mark>也不要聽信自己所作的夢</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/29/#L8">耶 29:8</a>)</p></blockquote><blockquote><p>“說：『主耶和華如此說：這些婦女有禍了！<strong><mark>她們爲衆人的膀臂縫靠枕，給高矮之人作下垂的頭巾</mark></strong>，爲要獵取人的性命。難道你們要獵取我百姓的性命，爲利己將人救活嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/13/#L18">結 13:18</a>)</p></blockquote><blockquote><p>“所以主耶和華如此說：看哪！<strong><mark>我與你們的靠枕反對</mark></strong>，就是你們用以獵取人、使人的性命如鳥飛的。我要將靠枕從你們的膀臂上扯去，釋放你們獵取如鳥飛的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/13/#L20">結 13:20</a>)</p></blockquote><blockquote><p>“「從你出胎，造就你的救贖主耶和華如此說：我耶和華是創造萬物的，是獨自鋪張諸天、鋪開大地的。誰與我同在呢？ <strong><mark>使說假話的兆頭失效，使占卜的癲狂，使智慧人退後，使他的知識變爲愚拙</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/44/#L24-25">賽 44:24-25</a>)</p></blockquote><blockquote><p>“<strong><mark>又必除掉你手中的邪術，你那裏也不再有佔卜的</mark></strong>。 <strong><mark>我必從你中間除滅雕刻的偶像和柱像</mark></strong>，你就不再跪拜自己手所造的。 <strong><mark>我必從你中間拔出木偶</mark></strong>，又毀滅你的城邑。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mih/5/#L12-14">彌 5:12-14</a>)</p></blockquote><blockquote><p>“又不悔改他們那些兇殺、<strong><mark>邪術</mark></strong>、姦淫、偷竊的事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/9/#L21">啟 9:21</a>)</p></blockquote><blockquote><p>“得勝的必承受這些爲業。我要作他的上帝，他要作我的兒子。 惟有膽怯的、不信的、可憎的、殺人的、淫亂的、<strong><mark>行邪術的</mark></strong>、<strong><mark>拜偶像的</mark></strong>和一切說謊話的，他們的分就在燒著硫磺的火湖裏，這是第二次的死。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/21/#L7-8">啟 21:7-8</a>)</p></blockquote><blockquote><p>“<strong><mark>城外有那些犬類、行邪術的、淫亂的、殺人的、拜偶像的，並一切喜好說謊言編造虛謊的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L15">啟 22:15</a>)</p></blockquote><h2>巫師和法師在上帝面前算不得什麼。不能救人脫離他的刑罰</h2><blockquote><p>“哪知，喪子、寡居這兩件事在一日轉眼之間必臨到你，正在你<strong><mark>多行邪術、廣施符咒</mark></strong>的時候，這兩件事必全然臨到你身上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/47/#L9">賽 47:9</a>)</p></blockquote><blockquote><p>“「站起來吧！<strong><mark>用你從幼年勞神施行的符咒和你許多的邪術</mark></strong>，或者可得益處，或者可得強勝。 你籌劃太多，以至疲倦。<strong><mark>讓那些觀天象的、看星宿的、在月朔說預言的，都站起來，救你脫離所要臨到你的事</mark></strong>。 <strong><mark>他們要像碎秸被火焚燒</mark></strong>，不能救自己脫離火焰之力，這火併非可烤的炭火，也不是可以坐在其前的火。 你所勞神的事都要這樣與你無益。從幼年與你貿易的，也都各奔各鄉，<strong><mark>無人救你</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/47/#L12-15">賽 47:12-15</a>)</p></blockquote><h2>求問黑暗的權勢——是對上帝不忠（姦淫）</h2><blockquote><p>“「<strong><mark>你們這些巫婆的兒子，姦夫和妓女的種子</mark></strong>，都要前來！ 你們向誰戲笑、向誰張口吐舌呢？<strong><mark>你們豈不是悖逆的兒女、虛謊的種類呢</mark></strong>？ 你們在橡樹中間，在各青翠樹下慾火攻心；在山谷間，在石穴下殺了兒女；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/57/#L3-5">賽 57:3-5</a>)</p></blockquote><blockquote><p>“都因那美貌的妓女多有淫行，<strong><mark>慣行邪術</mark></strong>，<strong><mark>藉淫行誘惑列國，用邪術誘惑多族</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/naum/3/#L4">鴻 3:4</a>)</p></blockquote><blockquote><p>“萬軍之耶和華說：「我必臨近你們，施行審判。我必速速作見證，<strong><mark>警戒行邪術的、犯奸淫的</mark></strong>，起假誓的、虧負人之工價的、欺壓寡婦孤兒的、屈枉寄居的和不敬畏我的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/3/#L5">瑪 3:5</a>)</p></blockquote><h2>人歸向基督教時，棄絕了行邪術</h2><blockquote><p>“那已經信的，多有人來承認訴說自己所行的事。 <strong><mark>平素行邪術的，也有許多人把書拿來，堆積在衆人面前焚燒</mark></strong>。他們算計書價，便知道共合五萬塊錢。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L18-19">徒 19:18-19</a>)</p></blockquote>
