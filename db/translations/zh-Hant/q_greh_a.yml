  title: 致死的罪
  copy_cover: true
  body: <p>聖經中所列的一些致死的罪：</p><blockquote><p>“裝滿了各樣不義、邪惡、貪婪、惡毒，滿心是嫉妒、兇殺、爭競、詭詐、毒恨， 又是讒毀的、背後說人的、怨恨上帝的、侮慢人的、狂傲的、自誇的、捏造惡事的、違背父母的、 無知的、背約的、無親情的、不憐憫人的。 他們雖知道上帝判定<strong><mark>行這樣事的人是當死的</mark></strong>，然而他們不但自己去行，還喜歡別人去行。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L29-32">羅 1:29-32</a>)</p></blockquote><blockquote><p>“情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、異端、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><blockquote><p>“你們豈不知<strong><mark>不義的人不能承受上帝的國</mark></strong>嗎？不要自欺！無論是淫亂的、拜偶像的、姦淫的、作孌童的、親男色的、” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L9">林前 6:9</a>)</p></blockquote><blockquote><p>“因爲你們確實的知道，無論是淫亂的，是污穢的，是有貪心的，<strong><mark>在基督和上帝的國裏都是無分的</mark></strong>。有貪心的，就與拜偶像的一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L5">弗 5:5</a>)</p></blockquote><blockquote><p>“惟有膽怯的、不信的、可憎的、殺人的、淫亂的、行邪術的、拜偶像的和一切說謊話的，<strong><mark>他們的分就在燒著硫磺的火湖裏，這是第二次的死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/21/#L8">啟 21:8</a>)</p></blockquote><blockquote><p>“那些洗淨自己衣服的有福了！可得權柄能到生命樹那裏，也能從門進城。 <strong><mark>城外有那些犬類、行邪術的、淫亂的、殺人的、拜偶像的，並一切喜好說謊言編造虛謊的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L14-15">啟 22:14-15</a>)</p></blockquote><blockquote><p>“作假見證的，必不免受罰；<strong><mark>吐出謊言的，終不能逃脫</mark></strong>。 &lt;…&gt; 作假見證的，不免受罰；<strong><mark>吐出謊言的，也必滅亡</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/19/#L5,9">箴 19:5,9</a>)</p></blockquote><p>只要人還活著、還能進入基督的教會而悔改，一切罪都可以得到赦免。人將要受審判的，是他在身體中活著時所做的事：</p><blockquote><p>“因爲我們衆人必要在基督臺前顯露出來，叫各人<strong><mark>按著本身所行的</mark></strong>，或善或惡受報。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote>
