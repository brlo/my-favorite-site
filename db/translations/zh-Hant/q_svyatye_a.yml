  path: QW1A_聖潔
  title: 聖潔
  copy_cover: true
  body: <ol><li><p><strong>聖潔</strong>——將一物全然分別出來，歸於一個目的。</p></li><li><p><strong>聖潔</strong>——獻給上帝的生活方式。</p></li><li><p><strong>聖徒</strong>——不犯罪、按上帝旨意而生活的人。</p></li></ol><blockquote><p>“<strong><mark>他死是向罪死了，只有一次</mark></strong>；<strong><mark>他活是向上帝活著</mark></strong>。 這樣，你們<strong><mark>向罪也當看自己是死的</mark></strong>；<strong><mark>向上帝在基督耶穌裏，卻當看自己是活的</mark></strong>。 所以，<strong><mark>不要容罪在你們必死的身上作王</mark></strong>，使你們順從身子的私欲。 <strong><mark>也不要將你們的肢體獻給罪作不義的器具</mark></strong>；倒要像從死裏復活的人，<strong><mark>將自己獻給上帝</mark></strong>，並將肢體作義的器具獻給上帝。 &lt;…&gt; 你們既從罪裏得了釋放，就作了義的奴僕。 &lt;…&gt; 但現今你們既從罪裏得了釋放，作了上帝的奴僕，<strong><mark>就有成聖的果子</mark></strong>，<strong><mark>那結局就是永生</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/6/#L10-13,18,22">羅 6:10-13,18,22</a>)</p></blockquote><blockquote><p>“凡從上帝生的，就不犯罪，因上帝的道存在他心裏；<strong><mark>他也不能犯罪</mark></strong>，因爲他是由上帝生的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L9">約壹 3:9</a>)</p></blockquote><blockquote><p>“<strong><mark>我們知道凡從上帝生的，必不犯罪</mark></strong>，從上帝生的，必保守自己，那惡者也就無法害他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L18">約壹 5:18</a>)</p></blockquote><blockquote><p>“你們要追求與衆人和睦，<strong><mark>並要追求聖潔</mark></strong>；<strong><mark>非聖潔沒有人能見主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L14">希 12:14</a>)</p></blockquote><blockquote><p>“那城內又不用日月光照，因有上帝的榮耀光照，又有羔羊爲城的燈。 &lt;…&gt; 城門白晝總不關閉，在那裏原沒有黑夜。 &lt;…&gt; <strong><mark>凡不潔淨的，並那行可憎與虛謊之事的，總不得進那城</mark></strong>；只有名字寫在羔羊生命冊上的才得進去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/21/#L23,25,27">啟 21:23,25,27</a>)</p></blockquote>
