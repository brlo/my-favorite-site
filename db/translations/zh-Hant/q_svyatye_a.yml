- src: почитание-святых-в-Библии
  path: QW4A_敬禮聖人
  title: 敬禮聖人
  copy_cover: true
  body: <h2>前言</h2><p>聖義者和天使受敬禮，不是作爲神，而是作爲上帝的朋友。受敬禮的不是他們本身，而是因爲他們分有上帝、因爲他們裏面存有上帝的恩典（見<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>一文）。按聖經，受敬禮的不只是上帝；叩拜不只是向上帝行；上帝親自呼召人尋求從上帝來的榮耀；上帝應許榮耀義人，並且榮耀了他們；教會追隨上帝，榮耀上帝聖潔的朋友們。</p><p>上帝在聖徒生前、也藉著他們<strong>死後肉身</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>）、<strong>遺物</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L12">徒 19:12</a>）和<strong>像</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L15-16">徒 5:15-16</a>）賜下自己的恩典，所以這一切也都受敬禮。詳見相應條目：</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">敬禮聖髑</a>；</p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">敬禮聖像</a>。</p></li></ul><h2>可以受敬禮的不只是上帝</h2><h3>對上帝的敬意</h3><blockquote><p>“藐視我名的祭司啊，萬軍之耶和華對你們說：<strong><mark>兒子尊敬父親，僕人敬畏主人</mark></strong>；<strong><mark>我既爲父親，尊敬我的在那裏呢</mark></strong>？<strong><mark>我既爲主人，敬畏我的在那裏呢</mark></strong>？你們卻說：『我們在何事上藐視你的名呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/1/#L6">瑪 1:6</a>)</p></blockquote><h3>對司祭</h3><blockquote><p>“<strong>你當全靈恭敬上主，尊敬司祭。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/7/#L33">德 7:33</a>)</p></blockquote><h3>對虔誠的基督徒</h3><blockquote><p>“司提反和福徒拿都並亞該古到這裏來，我很喜歡，因爲你們待我有不及之處，他們補上了。 他們叫我和你們心裏都快活。<strong><mark>這樣的人，你們務要敬重</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/16/#L17-18">林前 16:17-18</a>)</p></blockquote><h3>對妻子</h3><blockquote><p>“你們作丈夫的也要按情理和妻子同住，因她比你軟弱，與你一同承受生命之恩的，<strong><mark>所以要敬重她</mark></strong>。這樣，便叫你們的禱告沒有阻礙。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L7">彼前 3:7</a>)</p></blockquote><h3>對父親和母親</h3><blockquote><p>“<strong><mark>當孝敬父母</mark></strong>，使你的日子在耶和華你上帝所賜你的地上得以長久。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L12">出 20:12</a>)</p></blockquote><h3>對老人</h3><blockquote><p>“在白髮的人面前，你要站起來；<strong><mark>也要尊敬老人</mark></strong>，又要敬畏你的上帝。我是耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L32">利 19:32</a>)</p></blockquote><h3>對寡婦</h3><blockquote><p>“<strong><mark>要尊敬那真爲寡婦的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L3">提前 5:3</a>)</p></blockquote><h3>對國家掌權者</h3><blockquote><p>“務要尊敬衆人，親愛教中的弟兄，<strong><mark>敬畏上帝，尊敬君王</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L17">彼前 2:17</a>)</p></blockquote><blockquote><p>“<strong><mark>在上有權柄的，人人當順服他</mark></strong>，因爲沒有權柄不是出於上帝的，凡掌權的都是上帝所命的。 &lt;…&gt; 凡人所當得的，就給他；當得糧的，給他納糧；當得稅的，給他上稅；當懼怕的，懼怕他；<strong><mark>當恭敬的，恭敬他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/13/#L1,7">羅 13:1,7</a>)</p></blockquote><h3>對一切人</h3><blockquote><p>“<strong><mark>務要尊敬衆人</mark></strong>，親愛教中的弟兄，敬畏上帝，尊敬君王。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L17">彼前 2:17</a>)</p></blockquote><blockquote><p>“愛弟兄，要彼此親熱；<strong><mark>恭敬人，要彼此推讓</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L10">羅 12:10</a>)</p></blockquote><h2>向聖人叩拜</h2><p>十誡的第二誡（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L4-5">出 20:4-5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L8-9">申 5:8-9</a>）禁止敬拜假神（偶像）。假神實際上不是神：他們的神性是虛構的，是幻想、謊言。</p><p>聖人是真實存在的，他們是上帝的朋友；向他們叩拜，不是把他們當神。向聖人叩拜，是表達對他們的敬意——作爲上帝的朋友、作爲上帝的僕人（天使）、作爲上帝之母。這樣的向天使、向人、向物件的叩拜在聖經中有，而且不是拜偶像，因爲拜偶像——是敬拜<strong>假</strong>神，敬拜謊言。義人們經常向人如向人、向天使如向天使、向先知如向先知、向物件如向物件下拜。在一切情形中，他們都不是把他們當作神來拜。</p><h3>向以天使形像顯現的上帝叩拜</h3><p>顯現的是上帝，但那三位天使不是上帝的本相、不是他在創世之前所是的；就是說，這是上帝的<strong>像</strong>（希臘文 εἰκόνα——聖像），而亞伯拉罕拜的是上帝的聖像：</p><blockquote><p>“耶和華在幔利橡樹那裏，<strong><mark>向亞伯拉罕顯現出來</mark></strong>。那時正熱，亞伯拉罕坐在帳棚門口， 舉目觀看，<strong><mark>見有三個人在對面站著</mark></strong>。他一見，就從帳棚門口跑去迎接他們，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L1-2">創 18:1-2</a>)</p></blockquote><h3>向天使叩拜</h3><blockquote><p>“他回答說：「不是的，我來是要作耶和華軍隊的元帥。」<strong><mark>約書亞就俯伏在地下拜</mark></strong>，說：「我主有什麼話吩咐僕人？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/5/#L14">書 5:14</a>)</p></blockquote><h3>向先知叩拜</h3><blockquote><p>“住耶利哥的先知門徒從對面看見他，就說：「感動以利亞的靈感動以利沙了。」他們就來迎接他，<strong><mark>在他面前俯伏於地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/2/#L15">王下 2:15</a>)</p></blockquote><h3>向聖殿叩拜</h3><blockquote><p>“至於我，我必憑你豐盛的慈愛，進入你的居所；我必存敬畏你的心，<strong><mark>向你的聖殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>)</p></blockquote><h3>向上帝的腳凳（聖殿）叩拜</h3><blockquote><p>“你們當尊崇耶和華我們的上帝，<strong><mark>在他腳凳前下拜</mark></strong>；他本爲聖！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我們要進他的居所，在他腳凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>)</p></blockquote><h3>向約櫃叩拜</h3><blockquote><p>“約書亞便撕裂衣服；他和以色列的長老把灰撒在頭上，在耶和華的約櫃前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>)</p></blockquote><h3>向杖叩拜</h3><p>經上記著“以色列在牀頭上敬拜”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/47/#L31">創 47:31</a>），而在七十士譯本里是“在杖頭上”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L21">希 11:21</a>）。</p><p>更多例子：<a href="https://bibleox.com/ru/ru/w/поклоны">叩拜</a></p><h3>爲什麼啟示錄裏天使吩咐拜的不是自己，而是上帝</h3><p>在使徒約翰的異象中，上帝顯然就在旁邊；在這樣的情形裏，把敬意給天使、彷彿天使是這裏最主要的，就奇怪了。所以天使吩咐拜上帝：</p><blockquote><p>“我就俯伏在他腳前要拜他。他說：「<strong><mark>千萬不可</mark></strong>！我和你，並你那些爲耶穌作見證的弟兄同是作僕人的；<strong><mark>你要敬拜上帝</mark></strong>。因爲預言中的靈意乃是爲耶穌作見證。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/19/#L10">啟 19:10</a>)</p></blockquote><blockquote><p>“他對我說：「<strong><mark>千萬不可</mark></strong>！我與你和你的弟兄衆先知，並那些守這書上言語的人，同是作僕人的。<strong><mark>你要敬拜上帝</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L9">啟 22:9</a>)</p></blockquote><p>另一次，天使接受了先知約書亞的叩拜：</p><blockquote><p>“他回答說：「不是的，我來是要作耶和華軍隊的元帥。」<strong><mark>約書亞就俯伏在地下拜</mark></strong>，說：「我主有什麼話吩咐僕人？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/5/#L14">書 5:14</a>)</p></blockquote><h2>聖人將受尊敬</h2><blockquote><p>“在大戶人家，不但有金器銀器，也有木器瓦器；有作爲貴重的，有作爲卑賤的。 <strong><mark>人若自潔，脫離卑賤的事</mark></strong>，<strong><mark>就必作貴重的器皿</mark></strong>，成爲聖潔，合乎主用，預備行各樣的善事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L20-21">提後 2:20-21</a>)</p></blockquote><blockquote><p>“<strong><mark>卻將榮耀、尊貴、平安加給一切行善的人</mark></strong>，先是猶太人，後是希利尼人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L10">羅 2:10</a>)</p></blockquote><h2>主應許榮耀義人</h2><blockquote><p>“因此，耶和華以色列的上帝說：『我曾說，你和你父家必永遠行在我面前；現在我卻說，決不容你們這樣行。因爲<strong><mark>尊重我的，我必重看他</mark></strong>；藐視我的，他必被輕視。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/2/#L30">撒上 2:30</a>)</p></blockquote><blockquote><p>“若有人服事我，就當跟從我；我在那裏，服事我的人也要在那裏。<strong><mark>若有人服事我，我父必尊重他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L26">約 12:26</a>)</p></blockquote><blockquote><p>“我不但爲這些人祈求，也爲那些因他們的話信我的人祈求， &lt;…&gt; <strong><mark>你所賜給我的榮耀，我已賜給他們</mark></strong>，使他們合而爲一，像我們合而爲一。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20,22">約 17:20,22</a>)</p></blockquote><blockquote><p>“因爲他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子在許多弟兄中作長子。 預先所定下的人又召他們來；所召來的人又稱他們爲義；<strong><mark>所稱爲義的人又叫他們得榮耀</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L29-30">羅 8:29-30</a>)</p></blockquote><p>榮耀的賜下，其中也藉著應允祈禱和作爲：</p><blockquote><p>“<strong><mark>你們奉我的名無論求什麼，我必成就</mark></strong>，<strong><mark>叫父因兒子得榮耀</mark></strong>。 你們若奉我的名求什麼，我必成就。 你們若愛我，就必遵守我的命令。 我要求父，父就另外賜給你們一位保惠師，叫他永遠與你們同在；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L13-16">約 14:13-16</a>)</p></blockquote><p>而且，最終得榮耀的仍是父——雖是在子裏；就是說，子也得榮耀。</p><h2>尋求從上帝來的榮耀</h2><blockquote><p>“你們互相受榮耀，卻<strong><mark>不求從獨一之上帝來的榮耀</mark></strong>，怎能信我呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L44">約 5:44</a>)</p></blockquote><blockquote><p>“你竟任著你剛硬不悔改的心，爲自己積蓄忿怒，以致上帝震怒，顯他公義審判的日子來到。 他必照各人的行爲報應各人。 凡<strong><mark>恆心行善</mark></strong>，<strong><mark>尋求榮耀、尊貴</mark></strong>和不能朽壞之福的，就以<strong><mark>永生</mark></strong>報應他們； 惟有結黨不順從真理，反順從不義的，就以忿怒、惱恨報應他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L5-8">羅 2:5-8</a>)</p></blockquote><h2>聖徒的榮耀</h2><blockquote><p>“原來那爲萬物所屬、爲萬物所本的，<strong><mark>要領許多的兒子進榮耀裏去</mark></strong>，使救他們的元帥因受苦難得以完全，本是合宜的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/2/#L10">希 2:10</a>)</p></blockquote><blockquote><p>“我們衆人既然敞著臉得以看見主的榮光，好像從鏡子裏返照，<strong><mark>就變成主的形狀</mark></strong>，<strong><mark>榮上加榮</mark></strong>，如同從主的靈變成的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/3/#L18">林後 3:18</a>)</p></blockquote><blockquote><p>“將患難、困苦加給一切作惡的人，先是猶太人，後是希利尼人； <strong><mark>卻將榮耀、尊貴、平安加給一切行善的人</mark></strong>，先是猶太人，後是希利尼人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L9-10">羅 2:9-10</a>)</p></blockquote><blockquote><p>“<strong><mark>他將他百姓的角高舉</mark></strong>，因此<strong><mark>他一切聖民以色列人</mark></strong>，就是與他相近的百姓，都讚美他。你們要讚美耶和華！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/148/#L14">詩 148:14</a>)</p></blockquote><h2>教會將榮耀義人</h2><blockquote><p>“<strong>現在讓我們來讚揚那些著名的偉人</strong>，和我們歷代的祖先：<strong>上主在他們身上，作出許多光耀的事</strong>，自太古就對他們，顯示了自己的偉大。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/44/#L1-2">德 44:1-2</a>)</p></blockquote><blockquote><p>“但我所要稱揚的人，都是寬大爲懷的人，<strong>他們的義舉，不會被人遺忘</strong>；他們的善行與子孫同存，他們的後裔，保有這善行的產業；他們的子孫履行盟約，他們的子女，因了他們，也是如此：子子孫孫，永世常存；<strong>他們的光榮，決不會泯滅</strong>；他們的遺體必被人安葬，名譽必留於永世；<strong>民衆必稱述他們的智慧，集會必傳揚他們的美德</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/44/#L10-15">德 44:10-15</a>) <em>(俄文本編號爲 Сир 44:9-14。)</em></p></blockquote><h2>必須不忘前人的功績和信仰，並效法他們</h2><blockquote><p>“<strong><mark>從前引導你們、傳上帝之道給你們的人，你們要想念他們</mark></strong>，<strong><mark>效法他們的信心</mark></strong>，留心看他們爲人的結局。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L7">希 13:7</a>)</p></blockquote><blockquote><p>“<strong><mark>所以，我求你們效法我</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L16">林前 4:16</a>)</p></blockquote><blockquote><p>“弟兄們，<strong><mark>你們要一同效法我</mark></strong>，<strong><mark>也當留意看那些照我們榜樣行的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L17">腓 3:17</a>)</p></blockquote><h2>渴望與聖徒同在</h2><blockquote><p>“我的心哪！你曾對耶和華說：「你是我的主；我的好處不在你以外。」 <strong><mark>論到世上的聖民，他們又美又善</mark></strong>，<strong><mark>是我最喜悅的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/16/#L2-3">詩 16:2-3</a>)</p></blockquote><h2>末日之獸將褻瀆聖人</h2><h3>獸將褻瀆住在天上的</h3><blockquote><p>“獸就開口向上帝說褻瀆的話，褻瀆上帝的名，<strong><mark>並他的帳幕，以及那些住在天上的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/13/#L6">啟 13:6</a>)</p></blockquote><h3>在天上的，是義人的靈魂和天使</h3><blockquote><p>“你們乃是來到錫安山，<strong><mark>永生上帝的城邑</mark></strong>，<strong><mark>就是天上的耶路撒冷</mark></strong>。那裏有<strong><mark>千萬的天使</mark></strong>， 有名錄在天上諸長子之會所共聚的總會，有審判衆人的上帝和<strong><mark>被成全之義人的靈魂</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote><h2>對異議的回應</h2><h3>教會怎麼知道誰是聖人？難道是人替上帝作決定嗎？</h3><p>回答見「<a href="https://bibleox.com/ru/ru/w/молитвы-святым#HH-Как-Церковь-узнаёт-кто-является-святым-Не-решают-ли-люди-за-Бога">爲聖人祈禱</a>」一節。</p><h3>“上帝不把自己的榮耀給別的”</h3><blockquote><p>“我是耶和華，這是我的名。<strong><mark>我必不將我的榮耀歸給假神</mark></strong>，<strong><mark>也不將我的稱讚歸給雕刻的偶像</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/42/#L8">賽 42:8</a>)</p></blockquote><p>這裏說的是偶像，即假神。關於上帝自己榮耀衆人的許多引文，見上文。</p><h2>相關引文</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">敬禮聖髑</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">敬禮聖像</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">爲聖人祈禱</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">人的構成</a></p></li></ol>
