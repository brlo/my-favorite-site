  path: QW2A_爲基督受苦
  title: 爲基督受苦
  copy_cover: true
  body: <h2>基督徒不但蒙召相信，也蒙召爲基督受苦</h2><blockquote><p>“只要你們<strong><mark>行事爲人與基督的福音相稱</mark></strong>，叫我或來見你們，或不在你們那裏，可以聽見你們的景況，知道你們同有一個心志，站立得穩，<strong><mark>爲所信的福音齊心努力</mark></strong>。 凡事不怕敵人的驚嚇，<strong><mark>這是證明他們沉淪，你們得救</mark></strong>，都是出於上帝。 因爲你們蒙恩，不但得以信服基督，<strong><mark>並要爲他受苦</mark></strong>。 你們的爭戰，就與你們在我身上從前所看見，現在所聽見的一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L27-30">腓 1:27-30</a>)</p></blockquote><h2>關於爲基督受逼迫的預言</h2><blockquote><p>“你們要記念我從前對你們所說的話：『僕人不能大於主人。』<strong><mark>他們若逼迫了我，也要逼迫你們</mark></strong>；若遵守了我的話，也要遵守你們的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L20">約 15:20</a>)</p></blockquote><blockquote><p>“<strong><mark>爲義受逼迫的人有福了</mark></strong>，因爲天國是他們的。 <strong><mark>人若因我辱罵你們，逼迫你們，捏造各樣壞話毀謗你們</mark></strong>，你們就有福了。 應當歡喜快樂，因爲<strong><mark>你們在天上的賞賜是大的</mark></strong>。在你們以前的先知，人也是這樣逼迫他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L10-12">太 5:10-12</a>)</p></blockquote><blockquote><p>“<strong><mark>人爲人子恨惡你們，拒絕你們，辱罵你們，棄掉你們的名</mark></strong>，以爲是惡，<strong><mark>你們就有福了</mark></strong>。 當那日，你們要歡喜跳躍，因爲<strong><mark>你們在天上的賞賜是大的</mark></strong>！他們的祖宗待先知也是這樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L22-23">路 6:22-23</a>)</p></blockquote><h2>預言的應驗</h2><p>使徒們爲基督受苦而歡喜：</p><blockquote><p>“他們離開公會，<strong><mark>心裏歡喜</mark></strong>，<strong><mark>因被算是配爲這名受辱</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L41">徒 5:41</a>)</p></blockquote><blockquote><p>“<strong><mark>我們爲基督的緣故算是愚拙的</mark></strong>，你們在基督裏倒是聰明的；我們軟弱，你們倒強壯；你們有榮耀，我們倒被藐視。 直到如今，我們還是<strong><mark>又飢、又渴、又赤身露體、又挨打</mark></strong>、又沒有一定的住處， 並且勞苦，親手作工。<strong><mark>被人咒罵，我們就祝福</mark></strong>；<strong><mark>被人逼迫，我們就忍受</mark></strong>； <strong><mark>被人毀謗，我們就善勸</mark></strong>。直到如今，人還把我們看作<strong><mark>世界上的污穢</mark></strong>，<strong><mark>萬物中的渣滓</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L10-13">林前 4:10-13</a>)</p></blockquote><h2>呼召不要懼怕爲基督受苦</h2><blockquote><p>“親愛的弟兄啊，<strong><mark>有火煉的試驗臨到你們，不要以爲奇怪</mark></strong>（似乎是遭遇非常的事）， 倒要歡喜。因爲<strong><mark>你們是與基督一同受苦</mark></strong>，使你們在他榮耀顯現的時候，也可以歡喜快樂。 <strong><mark>你們若爲基督的名受辱罵，便是有福的</mark></strong>，因爲上帝榮耀的靈常住在你們身上。 你們中間卻不可有人因爲殺人、偷竊、作惡、好管閒事而受苦； <strong><mark>若爲作基督徒受苦，卻不要羞恥</mark></strong>，<strong><mark>倒要因這名歸榮耀給上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L12-16">彼前 4:12-16</a>)</p></blockquote><blockquote><p>“你們若是熱心行善，有誰害你們呢？ <strong><mark>你們就是爲義受苦，也是有福的</mark></strong>。<strong><mark>不要怕人的威嚇，也不要驚慌</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L13-14">彼前 3:13-14</a>)</p></blockquote><h2>忍受爲基督受逼迫的賞賜之應許</h2><p>爲基督受苦——是得救的憑據：</p><blockquote><p>“只要你們行事爲人與基督的福音相稱，叫我或來見你們，或不在你們那裏，可以聽見你們的景況，知道你們同有一個心志，站立得穩，爲所信的福音齊心努力。 凡事不怕敵人的驚嚇，<strong><mark>這是證明他們沉淪，你們得救</mark></strong>，都是出於上帝。 因爲你們蒙恩，不但得以信服基督，<strong><mark>並要爲他受苦</mark></strong>。 你們的爭戰，就與你們在我身上從前所看見，現在所聽見的一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L27-30">腓 1:27-30</a>)</p></blockquote><p>與基督一同受苦的，也必與他一同得榮耀：</p><blockquote><p>“既是兒女，便是後嗣，就是上帝的後嗣，和基督同作後嗣。<strong><mark>如果我們和他一同受苦，也必和他一同得榮耀</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L17">羅 8:17</a>)</p></blockquote><p>與基督一同死的，與他一同復活、一同作王。而離棄他的，他也要離棄：</p><blockquote><p>“你要記念耶穌基督乃是大衛的後裔，他從死裏復活，正合乎我所傳的福音。 <strong><mark>我爲這福音受苦難，甚至被捆綁</mark></strong>，像犯人一樣；然而，上帝的道卻不被捆綁。 所以我爲選民凡事忍耐，叫他們也可以得著那在基督耶穌裏的救恩和永遠的榮耀。 有可信的話說：「<strong><mark>我們若與基督同死，也必與他同活</mark></strong>； <strong><mark>我們若能忍耐，也必和他一同作王</mark></strong>；<strong><mark>我們若不認他，他也必不認我們</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L8-12">提後 2:8-12</a>)</p></blockquote><p>在主裏死的人是有福的：</p><blockquote><p>“我聽見從天上有聲音說：「你要寫下：從今以後，<strong><mark>在主裏面而死的人有福了</mark></strong>！」聖靈說：「是的，<strong><mark>他們息了自己的勞苦，作工的果效也隨著他們</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L13">啟 14:13</a>)</p></blockquote><p>爲基督被殺的靈魂與他在天上同活：</p><blockquote><p>“揭開第五印的時候，我看見在祭壇底下，<strong><mark>有爲上帝的道併爲作見證被殺之人的靈魂</mark></strong>， 大聲喊著說：「聖潔真實的主啊！<strong><mark>你不審判住在地上的人，給我們伸流血的冤，要等到幾時呢</mark></strong>？」 <strong><mark>於是有白衣賜給他們各人</mark></strong>，又有話對他們說：「還要安息片時，等著一同作僕人的和他們的弟兄，也像他們被殺，<strong><mark>滿足了數目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>)</p></blockquote>
