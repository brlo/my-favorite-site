- src: Благодать
  path: QW3T_恩典
  title: 恩典
  copy_cover: true
  body: <h2>定義</h2><p><strong>恩典</strong>（古希臘文 χάρις，希伯來文 חֵ֣ן）——按主要意義，指爲拯救人而運行在人身上的上帝的能力。</p><ol><li><p><strong>上帝的能力，上帝的作爲</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L10">林前 15:10</a>——我今日成了何等人，是蒙上帝的<strong>恩</strong>才成的；並且他的<strong>恩</strong>在我裏面不是徒然的；我比衆使徒格外勞苦——這不是我，乃是<strong>與我同在的上帝的恩</strong>）；</p></li><li><p><strong>恩惠、憐憫、饋贈、恩寵、對某人的愛</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L3">創 18:3</a>——我若在你眼前蒙<strong>恩</strong>）；（<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/sud/6/#L17">士 6:17</a>——我若在你眼前蒙<strong>恩</strong>）；（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/16/#L22">撒上 16:22</a>——他在我眼中蒙了<strong>恩</strong>）；（<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/3ts/11/#L19">王上 11:19</a>——哈達在法老面前大蒙<strong>恩惠</strong>）；（<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/act/2/#L47">徒 2:47</a>——<strong>得</strong>衆民的<strong>喜愛</strong>）；（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L46">徒 7:46</a>——這位在大衛<strong>蒙</strong>上帝<strong>恩</strong>）；（<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/1kor/16/#L3">林前 16:3</a>——把你們的<strong>捐資</strong>送到耶路撒冷）；</p></li><li><p><strong>感謝上帝、討上帝喜悅</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/9/#L15">林後 9:15</a>——<strong>感謝</strong>上帝，因他有說不盡的恩賜）；（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L19">彼前 2:19</a>——倘若人爲叫良心對得住上帝，就忍受冤屈的苦楚，這是<strong>可喜愛的</strong>）；</p></li><li><p><strong>美麗</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/5/#L19">箴 5:19</a>——<strong>可愛</strong>的母鹿）；（<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/pr/3/#L22">箴 3:22</a>——作你頸項的<strong>美飾</strong>）；</p></li><li><p><strong>珍貴</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/17/#L8">箴 17:8</a>——<strong>珍寶</strong>石頭）；（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/10/#L12">傳 10:12</a>——智慧人的口中說出了<strong>恩言</strong>）；（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/45/#L2">詩 45:2</a>——你嘴裏滿有<strong>恩惠</strong>）；</p></li><li><p><strong>恩寵、尊榮、榮耀</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iudf/8/#L23">友 8:23</a>——奴役不會成爲我們的<strong>榮耀</strong>）。</p></li></ol><h2>恩典的召喚運作</h2><blockquote><p>“我希奇你們這麼快離開<strong><mark>那借著基督之恩召你們的</mark></strong>，去從別的福音。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L6">加 1:6</a>)</p></blockquote><blockquote><p>“然而那把我從母腹裏分別出來、<strong><mark>又施恩召我的上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L15">加 1:15</a>)</p></blockquote><h2>恩典作爲上帝的恩賜</h2><blockquote><p>“<strong><mark>願主耶穌基督的恩</mark></strong>常與你們衆人同在！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/16/#L23">林前 16:23</a>)</p></blockquote><blockquote><p>“<strong><mark>願恩惠、平安從上帝我們的父和主耶穌基督歸與你們</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/1/#L2">林後 1:2</a>)</p></blockquote><blockquote><p>“<strong><mark>但聖靈降臨在你們身上，你們就必得著能力</mark></strong>；並要在耶路撒冷、猶太全地和撒瑪利亞，直到地極，作我的見證。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L8">徒 1:8</a>)</p></blockquote><blockquote><p>“<strong><mark>我感謝那給我力量的我們主基督耶穌</mark></strong>，因他以我有忠心，派我服事他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L12">提前 1:12</a>)</p></blockquote><blockquote><p>“我作了這福音的執事，<strong><mark>是照上帝的恩賜，這恩賜是照他運行的大能賜給我的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/3/#L7">弗 3:7</a>)</p></blockquote><blockquote><p>“<strong><mark>我們各人蒙恩，都是照基督所量給各人的恩賜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L7">弗 4:7</a>)</p></blockquote><blockquote><p>“他們也因<strong><mark>上帝極大的恩賜顯在你們心裏</mark></strong>，就切切的想念你們，爲你們祈禱。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/9/#L14">林後 9:14</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝能將各樣的恩惠多多的加給你們</mark></strong>，使你們凡事常常充足，能多行各樣善事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/9/#L8">林後 9:8</a>)</p></blockquote><blockquote><p>“又恐怕我因所得的啓示甚大，就過於自高，所以<strong><mark>有一根刺加在我肉體上</mark></strong>，就是撒但的差役要攻擊我，免得我過於自高。 爲這事，我三次求過主，叫這刺離開我。 他對我說：「<strong><mark>我的恩典夠你用的</mark></strong>，<strong><mark>因爲我的能力是在人的軟弱上顯得完全</mark></strong>。」所以，我更喜歡誇自己的軟弱，<strong><mark>好叫基督的能力覆庇我</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/12/#L7-9">林後 12:7-9</a>)</p></blockquote><blockquote><p>“我們與上帝同工的也勸你們，<strong><mark>不可徒受他的恩典</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/6/#L1">林後 6:1</a>)</p></blockquote><blockquote><p>“然而我今日成了何等人，<strong><mark>是蒙上帝的恩才成的</mark></strong>；並且<strong><mark>他所賜我的恩不是徒然的</mark></strong>。我比衆使徒格外勞苦，這原不是我，<strong><mark>乃是上帝的恩與我同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L10">林前 15:10</a>)</p></blockquote><blockquote><p>“彼得說：「你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦，<strong><mark>就必領受所賜的聖靈</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38">徒 2:38</a>)</p></blockquote><blockquote><p>“那在基督裏堅固我們和你們，並且膏我們的就是上帝。 <strong><mark>他又用印印了我們，並賜聖靈在我們心裏作憑據</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/1/#L21-22">林後 1:21-22</a>)</p></blockquote><blockquote><p>“<strong><mark>如果上帝的靈住在你們心裏</mark></strong>，你們就不屬肉體，乃屬聖靈了。<strong><mark>人若沒有基督的靈，就不是屬基督的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L9">羅 8:9</a>)</p></blockquote><blockquote><p>“<strong><mark>豈不知你們是上帝的殿，上帝的靈住在你們裏頭嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L16">林前 3:16</a>)</p></blockquote><blockquote><p>“你們所受的不是奴僕的心，仍舊害怕；<strong><mark>所受的乃是兒子的心</mark></strong>，<strong><mark>因此我們呼叫</mark></strong>：「阿爸，父！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L15">羅 8:15</a>)</p></blockquote><blockquote><p>“你們既爲兒子，<strong><mark>上帝就差他兒子的靈進入你們的心，呼叫</mark></strong>：「阿爸，父！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L6">加 4:6</a>)</p></blockquote><blockquote><p>“<strong><mark>你們從主所受的恩膏常存在你們心裏</mark></strong>，並不用人教訓你們，<strong><mark>自有主的恩膏在凡事上教訓你們</mark></strong>。這恩膏是真的，不是假的，你們要按這恩膏的教訓住在主裏面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L27">約壹 2:27</a>)</p></blockquote><blockquote><p>“上帝的殿和偶像有什麼相同呢？因爲我們是永生上帝的殿，就如上帝曾說：『<strong><mark>我要在他們中間居住，在他們中間來往</mark></strong>；我要作他們的上帝，他們要作我的子民。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/6/#L16">林後 6:16</a>)</p></blockquote><blockquote><p>“耶穌回答說：「人若愛我，就必遵守我的道；<strong><mark>我父也必愛他，並且我們要到他那裏去，與他同住</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L23">約 14:23</a>)</p></blockquote><blockquote><p>“你們不要被那諸般怪異的教訓勾引了去。<strong><mark>因爲人心靠恩得堅固纔是好的</mark></strong>，並不是靠飲食；那在飲食上專心的，從來沒有得著益處。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L9">希 13:9</a>)</p></blockquote><blockquote><p>“所以，我們既得了不能震動的國，<strong><mark>就當感恩</mark></strong>，照上帝所喜悅的，<strong><mark>用虔誠、敬畏的心事奉上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L28">希 12:28</a>)</p></blockquote><blockquote><p>“有人帶著小孩子來見耶穌，要耶穌摸他們，門徒便責備那些人。 耶穌看見就惱怒，對門徒說：「讓小孩子到我這裏來，不要禁止他們，因爲在上帝國的，正是這樣的人。 我實在告訴你們：凡要承受上帝國的，若不像小孩子，斷不能進去。」 <strong><mark>於是抱著小孩子，給他們按手，爲他們祝福</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L13-16">可 10:13-16</a>)</p></blockquote><blockquote><p>“耶穌領他們到伯大尼的對面，<strong><mark>就舉手給他們祝福</mark></strong>。 <strong><mark>正祝福的時候</mark></strong>，他就離開他們，被帶到天上去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L50-51">路 24:50-51</a>)</p></blockquote><h2>恩典藉著人運作</h2><blockquote><p>“所以論到上帝的事，我在基督耶穌裏有可誇的。 <strong><mark>除了基督藉我作的那些事，我什麼都不敢提</mark></strong>，只提他藉我言語作爲，<strong><mark>用神跡奇事的能力</mark></strong>，<strong><mark>並聖靈的能力</mark></strong>，使外邦人順服。 甚至我從耶路撒冷直轉到以利哩古，<strong><mark>到處傳了基督的福音</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/15/#L17-19">羅 15:17-19</a>)</p></blockquote><blockquote><p>“爲此我提醒你，使你將<strong><mark>上帝藉我按手所給你的恩賜</mark></strong>，再如火挑旺起來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>)</p></blockquote><p>領受恩典，爲叫萬民信服：</p><blockquote><p>“<strong><mark>我們從他受了恩惠並使徒的職分</mark></strong>，<strong><mark>在萬國之中叫人爲他的名信服真道</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L5">羅 1:5</a>)</p></blockquote><blockquote><p>“污穢的言語，一句不可出口，<strong><mark>只要隨事說造就人的好話，叫聽見的人得益處</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L29">弗 4:29</a>)</p></blockquote><blockquote><p>“<strong><mark>你們的言語要常常帶著和氣</mark></strong>，好像用鹽調和，就可知道該怎樣回答各人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/4/#L6">西 4:6</a>)</p></blockquote><h2>恩典賜給謙卑的人</h2><blockquote><p>“他譏誚那好譏誚的人，<strong><mark>賜恩給謙卑的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/3/#L34">箴 3:34</a>)</p></blockquote><blockquote><p>“但他賜更多的恩典，所以經上說，『<strong><mark>上帝阻擋驕傲的人，賜恩給謙卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L6">雅 4:6</a>)</p></blockquote><blockquote><p>“你們年幼的也要順服年長的。就是你們衆人也都要以謙卑束腰，彼此順服，『<strong><mark>因爲上帝阻擋驕傲的人，賜恩給謙卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L5">彼前 5:5</a>)</p></blockquote><h2>必須挑旺恩典</h2><blockquote><p>“爲此我提醒你，<strong><mark>使你將上帝藉我按手所給你的恩賜，再如火挑旺起來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>)</p></blockquote>
