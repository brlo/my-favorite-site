  path: QS9T_異端
  title: 異端（對信仰的歪曲）
  copy_cover: true
  body: <h2>異端的定義</h2><p><strong>異端</strong>（古希臘文 <a href="https://bibleox.com/ru/words/%CE%B1%CE%B9%CF%81%CE%B5%CF%83%CE%B9%CF%82">αἵρεσις</a> ——派別、學說、學派、選擇）——是後來產生的、在先前學說之觀念上形成的獨立學說，通常與之相對立。異端的追隨者認爲他們所由分出的那個學說是錯誤的，也同樣遭到對方的回敬。</p><p>在聖經的語境中，任何對信理的重大歪曲都被稱爲異端：</p><ul><li><p><strong>法利賽人</strong>——關於救恩的錯誤學說。在很大程度上，他們把救恩僅僅歸結爲嚴格遵守外在的規條；</p></li><li><p><strong>撒都該人</strong>——關於屬靈現實的錯誤學說。他們否認屬靈的現實：靈魂在身體死後的生命、神靈和天使的存在、死人的復活；</p></li><li><p><strong>許米乃和腓理徒的學說</strong>——關於復活的錯誤學說。他們教導說復活已經在過去完成了；</p></li><li><p><strong>尼哥拉一黨人</strong>——關於道德生活的錯誤學說。他們容許肉體的淫亂。</p></li></ul><p>這些異端都不直接涉及關於上帝的教義，而是涉及信理的某些其他方面，然而它們仍然是異端。</p><h2>異端是使人失去救恩的罪</h2><blockquote><p>“情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>)</p></blockquote><blockquote><p>“弟兄們，<strong><mark>那些離間你們、叫你們跌倒、背乎所學之道的人</mark></strong>，我勸你們要留意躲避他們。 <strong><mark>因爲這樣的人不服事我們的主基督</mark></strong>，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><p>錯誤的教導並不把人引向上帝：</p><blockquote><p>“<strong><mark>凡越過基督的教訓不常守著的，就沒有上帝</mark></strong>；常守這教訓的，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><blockquote><p>“<strong>邪曲的思想，使人離開天主</strong>；愚人試探全能者，只有使自己蒙羞，” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/1/#L3">智 1:3</a>)</p></blockquote><h2>反對耶穌基督的人曾把他的教導視爲異端之一</h2><p>控告基督使徒的人稱基督的教導爲拿撒勒異端（基督在拿撒勒長大——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L45-46">約 1:45-46</a>）：</p><blockquote><p>“我們看這個人，如同瘟疫一般，是鼓動普天下衆猶太人生亂的，又是<strong><mark>拿撒勒教黨</mark></strong>裏的一個頭目，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/24/#L5">徒 24:5</a>)</p></blockquote><p>使徒們確認，法利賽人和撒都該人把他們的教導視爲異端：</p><blockquote><p>“但有一件事，我向你承認，就是<strong><mark>他們所稱爲異端的道</mark></strong>，我正按著那道事奉我祖宗的上帝，又信合乎律法的和先知書上一切所記載的，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/24/#L14">徒 24:14</a>)</p></blockquote><p>在公會中，基督的教導被視爲衆多派別之一。法利賽人迦瑪列列舉了新派別的例子：</p><blockquote><p>“但有一個法利賽人，名叫迦瑪列，是衆百姓所敬重的教法師，在公會中站起來，吩咐人把使徒暫且帶到外面去， 就對衆人說：「以色列人哪，論到這些人，你們應當小心怎樣辦理。 <strong><mark>從前丟大起來</mark></strong>，自誇爲大，附從他的人約有四百；他被殺後，附從他的全都散了，歸於無有。 此後，報名上冊的時候，<strong><mark>又有加利利的猶大起來</mark></strong>，引誘些百姓跟從他；他也滅亡，附從他的人也都四散了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L34-37">徒 5:34-37</a>)</p></blockquote><p>另見：<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/23/#L2">路 23:2</a>、<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L12">約 7:12</a>。</p><h3>爲什麼基督的教導不是異端？</h3><p>簡言之，因爲他是上帝（<a href="https://bibleox.com/ru/ru/w/Христос-Бог">引文</a>）、是真理（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L6">約 14:6</a>）、是立法者（「你們聽見有吩咐古人的話說：&lt;…&gt;只是我告訴你們」——<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L21-22">太 5:21-22</a>）。</p><p>只有那些不承認耶穌是基督、是上帝，不相信他就是那位與亞伯拉罕、以撒和雅各說話的上帝和立法者（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L15">出 3:15</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L25">約 8:25</a>）、就是那位賜給以色列律法（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L19">加 3:19</a>）、差遣先知到以色列的上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L34">太 23:34</a>）的人，才把基督的教導視爲虛假的、獨立的。由於耶穌基督是上帝，作爲立法者，他來更改了他自己所立的秩序，把他自己的葡萄園轉給別人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/20/#L16">路 20:16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L9">可 12:9</a>）。</p><p>因此，只有不信基督的人才把基督的教導稱爲異端；信基督的人則認爲他的教導是唯一真實的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L36">約 3:36</a>）。然而，基督和使徒們曾警告說，在他們之後會出現虛假的教導，但必須持守那一次傳給教會的：</p><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，<strong><mark>要爲從前一次交付聖徒的真道竭力的爭辯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote><h3>凡講到耶穌基督的教導，都因爲它講到基督而是真實的嗎？</h3><p>使徒們警告說，別人可能傳講另一個耶穌、另一個福音，並給人另一個靈：</p><blockquote><p>“我只怕你們的心或偏於邪，失去那向基督所存純一清潔的心，就像蛇用詭詐誘惑了夏娃一樣。 <strong><mark>假如有人來另傳一個耶穌，不是我們所傳過的</mark></strong>，<strong><mark>或者你們另受一個靈，不是你們所受過的</mark></strong>；<strong><mark>或者另得一個福音，不是你們所得過的</mark></strong>，你們容讓他也就罷了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L3-4">林後 11:3-4</a>)</p></blockquote><h2>關於異端的預言</h2><h3>基督教中將出現許多異端</h3><blockquote><p>“<strong><mark>將來有好些人冒我的名來</mark></strong>，說『我是基督』，<strong><mark>並且要迷惑許多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/13/#L6">可 13:6</a>)</p></blockquote><blockquote><p>“<strong><mark>且有好些假先知起來，迷惑多人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L11">太 24:11</a>)</p></blockquote><blockquote><p>“親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於上帝的不是，因爲<strong><mark>世上有許多假先知已經出來了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L1">約壹 4:1</a>)</p></blockquote><p>《十二宗徒訓言》（一至二世紀）中也有指示：</p><blockquote><p>「因爲<strong>在末後的日子裏，假先知和敗壞者將要增多</strong>，羊要變成狼，愛要變成恨。」</p></blockquote>（<a href="https://bibleox.com/ru/ru/w/Дидахе#L94">《十二宗徒訓言》94</a>）<h3>異端將非常廣泛地傳播</h3><blockquote><p>“<strong><mark>他們的話如同毒瘡，越爛越大</mark></strong>；其中有許米乃和腓理徒， <strong><mark>他們偏離了真道，說復活的事已過</mark></strong>，就敗壞好些人的信心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L17-18">提後 2:17-18</a>)</p></blockquote><blockquote><p>“從前在百姓中有假先知起來，<strong><mark>將來在你們中間也必有假師傅，私自引進陷害人的異端</mark></strong>，連買他們的主他們也不承認，自取速速地滅亡。 <strong><mark>將有許多人隨從他們邪淫的行爲</mark></strong>，便叫真道因他們的緣故被毀謗。 <strong><mark>他們因有貪心，要用捏造的言語在你們身上取利</mark></strong>。他們的刑罰，自古以來並不遲延；他們的滅亡，也必速速來到。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L1-3">彼後 2:1-3</a>)</p></blockquote><h3>異端的社羣將脫離教會及其信仰的合一</h3><blockquote><p>“小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來，<strong><mark>現在已經有好些敵基督的出來了</mark></strong>，從此我們就知道如今是末時了。 <strong><mark>他們從我們中間出去，卻不是屬我們的</mark></strong>；若是屬我們的，就必仍舊與我們同在；他們出去顯明都不是屬我們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18-19">約壹 2:18-19</a>)</p></blockquote><blockquote><p>“他們曾對你們說過：『<strong><mark>末世必有好譏誚的人</mark></strong>隨從自己不敬虔的私欲而行。』 <strong><mark>這就是那些引人結黨、屬乎血氣、沒有聖靈的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L18-19">猶 1:18-19</a>)</p></blockquote><h3>假師傅的任務——把信徒從教會中擄走並帶他們隨己而行</h3><blockquote><p>“我知道我去之後，<strong><mark>必有兇暴的豺狼進入你們中間</mark></strong>，不愛惜羊羣。 <strong><mark>就是你們中間，也必有人起來，說悖謬的話，要引誘門徒跟從他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L29-30">徒 20:29-30</a>)</p></blockquote><h3>假師傅的手法</h3><h4>動聽的學說</h4><p>假師傅們將要編出動聽的學說，正是因爲他們的聽衆將尋求悅耳的學說，忍受不了純正的教導：</p><blockquote><p>“因爲時候要到，人必厭煩純正的道理，<strong><mark>耳朵發癢，就隨從自己的情慾，增添好些師傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L3">提後 4:3</a>)</p></blockquote><blockquote><p>“聖靈明說：在後來的時候，<strong><mark>必有人離棄真道，聽從那引誘人的邪靈和鬼魔的道理</mark></strong>。 這是因爲說謊之人的假冒，這等人的良心如同被熱鐵烙慣了一般。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L1-2">提前 4:1-2</a>)</p></blockquote><h4>虛假的敬虔</h4><blockquote><p>“你該知道，<strong><mark>末世必有危險的日子來到</mark></strong>。 因爲那時人要專顧自己、貪愛錢財、自誇、狂傲、謗讟、違背父母、忘恩負義、心不聖潔、 &lt;…&gt; <strong><mark>有敬虔的外貌，卻背了敬虔的實意</mark></strong>，這等人你要躲開。 &lt;…&gt; 常常學習，終久不能明白真道。 從前雅尼和佯庇怎樣敵擋摩西，<strong><mark>這等人也怎樣敵擋真道</mark></strong>。他們的心地壞了，在真道上是可廢棄的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L1-2,5,7-8">提後 3:1-2,5,7-8</a>)</p></blockquote><blockquote><p>“<strong><mark>你們要防備假先知。他們到你們這裏來，外面披著羊皮，裏面卻是殘暴的狼</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L15">太 7:15</a>)</p></blockquote><h4>奇蹟</h4><p>使徒們和古代基督徒被賜予豐富的行異能之力，不是爲了作秀，而是爲了益處：</p><blockquote><p>“<strong><mark>聖靈顯在各人身上，是叫人得益處</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L7">林前 12:7</a>)</p></blockquote><p>一小羣漁夫需要很大的幫助，才能在短短一生中把傳道傳遍全世界。使徒們曾警告說，這些恩賜將要止息：</p><blockquote><p>“愛是永不止息。<strong><mark>先知講道之能，終必歸於無有；說方言之能，終必停止</mark></strong>；知識也終必歸於無有。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>)</p></blockquote><p>基督自己也斥責尋求奇蹟：</p><blockquote><p>“耶穌回答說：「<strong><mark>一個邪惡、淫亂的世代求看神蹟</mark></strong>，除了先知約拿的神蹟以外，再沒有神蹟給他們看。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L39">太 12:39</a>)</p></blockquote><p>在末後的時代，假先知將恰恰以奇蹟引誘人：</p><blockquote><p>“<strong><mark>因爲假基督、假先知將要起來，顯大神蹟、大奇事</mark></strong>。倘若能行，連選民也就迷惑了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L24">太 24:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/13/#L22">可 13:22</a>)</p></blockquote><p>結果，在審判時，許多信徒將確信自己得救正是因爲他們奉基督的名行異能、說預言、趕鬼。但他們受了欺騙，被教導行不法之事，基督不認識他們，把他們從自己面前趕走：</p><blockquote><p>“當那日，必有許多人對我說：『主阿，主阿，我們不是奉你的名傳道，奉你的名趕鬼，<strong><mark>奉你的名行許多異能嗎</mark></strong>？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h2>一世紀異端的例子</h2><h3>法利賽人</h3><p>使徒們稱法利賽人的教導爲異端（獨立的、錯誤的學說）：</p><blockquote><p>“<strong><mark>惟有幾個信徒是法利賽教門的人</mark></strong>，起來說：「必須給外邦人行割禮，吩咐他們遵守摩西的律法。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L5">徒 15:5</a>)</p></blockquote><p>從法利賽人中出來的信徒認爲，外邦人要得救，必須受割禮並遵守摩西的律法。</p><p>傳道者馬太也指出法利賽人和撒都該人教導的危險：</p><blockquote><p>“耶穌對他們說：「你們要謹慎，<strong><mark>防備法利賽人和撒都該人的酵</mark></strong>。」 &lt;…&gt; 我對你們說：『要防備法利賽人和撒都該人的酵』，這話不是指著餅說的，你們怎麼不明白呢？」 門徒這才曉得他說的，不是叫他們防備餅的酵，<strong><mark>乃是防備法利賽人和撒都該人的教訓</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L6,11-12">太 16:6,11-12</a>)</p></blockquote><h3>撒都該人</h3><p>使徒們稱撒都該人的教導爲異端（獨立的、錯誤的學說）：</p><blockquote><p>“大祭司和他的一切同人，就是<strong><mark>撒都該教門的人</mark></strong>，都起來，滿心忌恨，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L17">徒 5:17</a>)</p></blockquote><p>撒都該人的教導否認死人復活、靈魂的死後生命、天使和神靈的存在：</p><blockquote><p>“<strong><mark>撒都該人常說沒有復活的事</mark></strong>。他們來問耶穌說： &lt;…&gt; 耶穌說：「<strong><mark>你們所以錯了，豈不是因爲不明白聖經，不曉得上帝的大能嗎</mark></strong>？ &lt;…&gt; <strong><mark>論到死人復活，你們沒有念過摩西的書</mark></strong>荊棘篇上所載的嗎？上帝對摩西說：『我是亞伯拉罕的上帝，以撒的上帝，雅各的上帝。』 <strong><mark>上帝不是死人的上帝，乃是活人的上帝</mark></strong>。你們是大錯了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L18,24,26-27">可 12:18,24,26-27</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲撒都該人說沒有復活，也沒有天使和鬼魂</mark></strong>；法利賽人卻說兩樣都有，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/23/#L8">徒 23:8</a>)</p></blockquote><p>法利賽人與撒都該人相爭：</p><blockquote><p>“<strong><mark>保羅看出大衆一半是撒都該人，一半是法利賽人</mark></strong>，就在公會中大聲說：「弟兄們，我是法利賽人，也是法利賽人的子孫。我現在受審問，是爲盼望死人復活。」 說了這話，<strong><mark>法利賽人和撒都該人就爭論起來，會衆分爲兩黨</mark></strong>。 因爲撒都該人說沒有復活，也沒有天使和鬼魂；法利賽人卻說兩樣都有，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/23/#L6-8">徒 23:6-8</a>)</p></blockquote><h3>許米乃和腓理徒的學說</h3><p>背離真理的許米乃和腓理徒的學說。他們既然背離了真理，就是說他們以前曾是基督徒。如今他們錯誤地教導復活，這顯然是即將傳播的異端，必須遠離：</p><blockquote><p>“但要遠避世俗的虛談，因爲這等人必進到更不敬虔的地步。 <strong><mark>他們的話如同毒瘡，越爛越大</mark></strong>；<strong><mark>其中有許米乃和腓理徒</mark></strong>， <strong><mark>他們偏離了真道，說復活的事已過</mark></strong>，就敗壞好些人的信心。 然而，上帝堅固的根基立住了。上面有這印記說：「主認識誰是他的人。」又說：「<strong><mark>凡稱呼主名的人總要離開不義</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L16-19">提後 2:16-19</a>)</p></blockquote><h3>尼哥拉一黨人</h3><p>主耶穌基督憎惡尼哥拉一黨人的教導，也就是說，他們的教導顯然是異端：</p><blockquote><p>“<strong><mark>你那裏也有人照樣服從了尼哥拉一黨人的教訓</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L15">啟 2:15</a>)</p></blockquote><blockquote><p>“然而你還有一件可取的事，就是<strong><mark>你恨惡尼哥拉一黨人的行爲，這也是我所恨惡的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L6">啟 2:6</a>)</p></blockquote><h2>二世紀異端的例子</h2><p>聖殉道者護教者查士丁（約100-165）寫道，有些人雖然自稱基督徒、承認被釘十字架的耶穌是主和基督，卻傳講謊言之靈的教導，即獨立的虛假學說（異端）：</p><blockquote><p>有些人<strong>自稱是基督徒，承認被釘十字架的耶穌是主和基督，卻傳講謊言之靈的教導，而不是他的教導</strong>……我們不與他們中的任何一位相通。</p></blockquote><p>（<a href="https://bibleox.com/ru/ru/w/Иустин_Философ-разговор_с_Трифоном_иудеем">《與特來弗對話錄》</a>）</p><p>里昂的聖依勒內（約130-202）也寫到無數的基督教異端。例如，他寫到護教者查士丁的門徒塔提安：在查士丁殉道之前，塔提安未曾說過異端，而在那之後卻編造了自己的學說：</p><blockquote><p>1. 從上述的（假師傅們）已經分出了許多異端的許多支派，因爲<strong>許多人，甚至所有人，都願意自己做師傅，離開他們原先所持守的異端。他們從另一套意見體系編造出學說，然後又由此編出另一種，力圖教導新的東西，把自己當作所編學說的發明者</strong>。例如：所謂的克己派（Encratites），出自撒土尼努和馬吉安，<strong>宣講獨身</strong>，拒絕上帝起初的創造，間接指摘那位爲人的生育造了男性和女性的那一位；他們又<strong>戒絕食用動物</strong>，對造萬物的上帝忘恩負義。他們<strong>還否認太初之人得救</strong>；不過這意見是他們中間很晚才發明的。首先提出這一褻瀆的是塔提安：他作查士丁的門徒時，與他在一起，從未說過這樣的話；但在查士丁殉道之後，他離開了教會，因想作高人一等的師傅而受此思想激動，編造了自己獨特的學說體系。他像華倫提努派一樣杜撰某些不可見的艾翁，又像馬吉安和撒土尼努一樣宣稱婚姻是玷污和姦淫，並且憑自己否認亞當得救。</p><p>2. 另一些人相反，追隨巴西理德和卡波克拉特，引入了不法同居、多妻制和對祭偶像之物的隨意取用，聲稱上帝並不怎麼在意這些。但何必再往下說呢？<strong>無法一一列舉那些以這種或那種方式脫離真理的人</strong>。</p></blockquote><p>（<a href="https://bibleox.com/ru/ru/w/Ириней_Лионский-Против_ересей#HH-Глава-XXVIII-Учение-Татиана-энкратитов-и-других">《駁異端》第28章</a>）</p><h2>教會——唯一的信仰，合一與同心</h2><h3>教會裏有唯一的信仰</h3><blockquote><p>“<strong><mark>身體只有一個</mark></strong>，聖靈只有一個，正如你們蒙召，同有一個指望。 <strong><mark>一主，一信，一洗</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L4-5">弗 4:4-5</a>)</p></blockquote><h3>同心的誡命</h3><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，不要志氣高大，倒要俯就卑微的人。不要自以爲聰明。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L16">羅 12:16</a>)</p></blockquote><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，勸你們<strong><mark>都說一樣的話</mark></strong>。你們中間也不可分黨，<strong><mark>只要一心一意</mark></strong>，彼此相合。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>)</p></blockquote><p>更多關於同心的引文：<a href="https://bibleox.com/ru/ru/w/Единомыслие">同心</a>。</p><h3>上帝對合一的旨意</h3><p>主按使徒的話，願信他的人合而爲一</p><blockquote><p>“我不但爲這些人祈求，也爲那些因他們的話信我的人祈求， <strong><mark>使他們都合而爲一</mark></strong>；正如你父在我裏面，我在你裏面，使他們也在我們裏面，叫世人可以信你差了我來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>)</p></blockquote><h2>抵擋異端的必要</h2><blockquote><p>“至死要爲真理奮鬥，上主天主必要助你作戰。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/4/#L33">德 4:33</a>) <em>(俄文本爲 Сир 4:32。)</em></p></blockquote><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，<strong><mark>要爲從前一次交付聖徒的真道竭力的爭辯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote><blockquote><p>“那闇昧無益的事，不要與人同行，<strong><mark>倒要責備行這事的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L11">弗 5:11</a>)</p></blockquote><blockquote><p>“<strong><mark>有些人你們要從火中搶出來、搭救他們</mark></strong>；有些人你們要存懼怕的心憐憫他們；<strong><mark>連那被情慾沾染的衣服也當厭惡</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L23">猶 1:23</a>)</p></blockquote><h2>魔鬼將始終與教會爭戰</h2><blockquote><p>“耶和華上帝對蛇說：「你既作了這事，就必受咒詛，比一切的牲畜野獸更甚！你必用肚子行走，終身吃土。 <strong><mark>我又要叫你和女人彼此爲仇</mark></strong>；你的後裔和女人的後裔也彼此爲仇。<strong><mark>女人的後裔要傷你的頭；你要傷他的腳跟</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L14-15">創 3:14-15</a>)</p></blockquote><blockquote><p>“<strong><mark>龍見自己被摔在地上，就逼迫那生男孩子的婦人</mark></strong>。 &lt;…&gt; <strong><mark>龍向婦人發怒，去與她其餘的兒女爭戰</mark></strong>，這兒女就是那守上帝誡命，爲耶穌作見證的。那時龍就站在海邊的沙上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/12/#L13,17">啟 12:13,17</a>)</p></blockquote><h2>批評</h2><h3>你們不羨慕奇蹟嗎</h3><p>異端的擁護者常常試圖用奇蹟、醫治和趕鬼把自己的團體拉人。爲此他們引用這樣的話：</p><blockquote><p>“<strong><mark>你們要追求愛，也要切慕屬靈的恩賜</mark></strong>，其中更要羨慕的，是作先知講道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/14/#L1">林前 14:1</a>)</p></blockquote><p>他們也用這節經文指摘教會不羨慕，因此教會裏沒有大規模的奇蹟展示。</p><p>然而，使徒們和古代基督徒被賜予豐富的行異能之力，不是爲了作秀，而是爲了益處：</p><blockquote><p>“<strong><mark>聖靈顯在各人身上，是叫人得益處</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L7">林前 12:7</a>)</p></blockquote><p>一小羣漁夫需要很大的幫助，才能在短短一生中把傳道傳遍全世界。使徒們曾警告說，這些恩賜將要止息：</p><blockquote><p>“愛是永不止息。<strong><mark>先知講道之能，終必歸於無有；說方言之能，終必停止</mark></strong>；知識也終必歸於無有。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>)</p></blockquote><p>基督自己也斥責尋求奇蹟：</p><blockquote><p>“耶穌回答說：「<strong><mark>一個邪惡、淫亂的世代求看神蹟</mark></strong>，除了先知約拿的神蹟以外，再沒有神蹟給他們看。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L39">太 12:39</a>)</p></blockquote><p>在末後的時代，假先知將恰恰以奇蹟引誘人：</p><blockquote><p>“<strong><mark>因爲假基督、假先知將要起來，顯大神蹟、大奇事</mark></strong>。倘若能行，連選民也就迷惑了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L24">太 24:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/13/#L22">可 13:22</a>)</p></blockquote><p>結果，在審判時，許多信徒將確信自己得救正是因爲他們奉基督的名行異能、說預言、趕鬼。但他們受了欺騙，被教導行不法之事，基督不認識他們，把他們從自己面前趕走：</p><blockquote><p>“當那日，必有許多人對我說：『主阿，主阿，我們不是奉你的名傳道，奉你的名趕鬼，<strong><mark>奉你的名行許多異能嗎</mark></strong>？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們，你們這些作惡的人，離開我去吧</mark></strong>！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><h3>你們沒有愛心</h3><p>在與脫離教會的團體擁護者交談時，常常出現這樣的防衛反應：避開所討論的話題，試圖轉到討論對方的爲人及其品質。這通常發生在出現難以回答的問題之後。無論你多麼有分寸、有禮貌，你仍然可能被指控：</p><ul><li><p>論斷人；</p></li><li><p>驕傲；</p></li><li><p>沒有愛心。</p></li></ul><p><strong>說論斷人</strong>——因爲你說在異端中不能得救。然而，說這話的是使徒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L20">加 5:20</a>）和從一世紀起的聖教父（<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_Спасение_возможно_только_в_Церкви">引文</a>）。主賜了不要定人罪的誡命（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L37">路 6:37</a>），但另一方面也說要按公義判斷（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L24">約 7:24</a>）。</p><p><strong>說驕傲</strong>——因爲你說<a href="https://bibleox.com/ru/ru/w/X7l9DcTY_Спасение_возможно_только_в_Церкви">只有基督的教會才能得救</a>，教會是唯一的、有形的、合一的（<a href="https://bibleox.com/ru/ru/w/Церковь">引文</a>）。然而聖經中也這樣說：基督是身體的（教會的）救主（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>），離了基督沒有人能得救（<a href="https://bibleox.com/ru/ru/w/Иисус_Христос-единственный-спаситель-человечества">引文</a>）。聖教父們說的也是同樣的話（<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_Спасение_возможно_только_в_Церкви">引文</a>）。</p><p>至於<strong>愛心</strong>。毫無疑問，基督徒應當溫良、謙卑、始終出於愛心行事。但愛可以而且應當是什麼樣的呢？我們不能指摘主耶穌基督和使徒們缺乏愛心。同時，我們在聖經中遇到這樣的教導：</p><blockquote><p>“我兒，你不可輕看耶和華的管教，也不可厭煩他的責備。 <strong><mark>因爲耶和華所愛的，他必責備</mark></strong>，正如父親責備所喜愛的兒子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/3/#L11-12">箴 3:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲主所愛的，他必管教</mark></strong>，又鞭打凡所收納的兒子。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L6">希 12:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡我所疼愛的，我就責備管教他</mark></strong>，所以你要發熱心，也要悔改。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L19">啟 3:19</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所懲治的人是有福的</mark></strong>！所以你不可輕看全能者的管教。 因爲<strong><mark>他打破，又纏裹</mark></strong>；他擊傷，用手醫治。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/5/#L17-18">伯 5:17-18</a>)</p></blockquote><p>因此必須記得：如果我們把一切指摘都當作仇恨的表現，那就等於指摘上帝和使徒們有仇恨——他們不僅自己指摘謊言，還召人這樣做：</p><blockquote><p>“那闇昧無益的事，不要與人同行，<strong><mark>倒要責備行這事的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L11">弗 5:11</a>)</p></blockquote><p>指出某種學說的虛假，可能不只是仇恨的表現（有些人確實出於驕傲和仇恨這樣做），也可以是愛心的表現、對近人的關懷、願他得救的意願：</p><blockquote><p>“我的弟兄們，<strong><mark>你們中間若有失迷真道的</mark></strong>，有人使他迴轉； 這人該知道叫一個罪人從迷路上轉回，<strong><mark>便是救一個靈魂不死，並且遮蓋許多的罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L19-20">雅 5:19-20</a>)</p></blockquote><p>應當努力永不羞辱任何人，也不要讓談話轉入對個人的討論——在那裏往往開始彼此定罪。應當談學說，而不是談人的品質。</p>
