  title: 地獄——無盡的刑罰
  copy_cover: true
  body: <h2>定義</h2><p>地獄——是在榮耀的第二次降臨和最後審判之後被定罪的罪人的居所。最後審判之後，這一命運已無法改變。被定罪者的痛苦與義人的真福將同樣永遠持續。</p><h2>地獄的刑罰沒有終點</h2><blockquote><p>“<strong><mark>他受痛苦的煙往上冒，直到永永遠遠</mark></strong>。那些拜獸和獸像，受牠名之印記的，<strong><mark>晝夜不得安寧</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L11">啟 14:11</a>)</p></blockquote><blockquote><p>“倘若你一隻眼叫你跌倒，就去掉它！你只有一隻眼進入上帝的國，強如有兩隻眼被丟在地獄裏。 在那裏，『<strong><mark>蟲是不死的，火是不滅的</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L47-48">可 9:47-48</a>)</p></blockquote><blockquote><p>“那迷惑他們的魔鬼被扔在硫磺的火湖裏，就是獸和假先知所在的地方，<strong><mark>他們必晝夜受痛苦，直到永永遠遠</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/20/#L10">啟 20:10</a>)</p></blockquote><blockquote><p>“睡在塵埃中的，必有多人復醒，其中有得永生的，<strong><mark>有受羞辱、永遠被憎惡的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/12/#L2">但 12:2</a>)</p></blockquote><blockquote><p>“<strong><mark>這些人，要往永刑裏去</mark></strong>；那些義人，要往永生裏去。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L46">太 25:46</a>)</p></blockquote><blockquote><p>“<strong><mark>凡褻瀆聖靈的，卻永不得赦免，乃要擔當永遠的罪</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/3/#L29">可 3:29</a>)</p></blockquote><blockquote><p>“要報應那不認識上帝和那不聽從我主耶穌福音的人。 <strong><mark>他們要受刑罰，就是永遠沉淪</mark></strong>，離開主的面和他權能的榮光。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L8-9">帖後 1:8-9</a>)</p></blockquote><blockquote><p>“這些人是無水的井，是狂風催逼的霧氣，<strong><mark>有墨黑的幽暗爲他們存留</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L17">彼後 2:17</a>)</p></blockquote><blockquote><p>“各樣洗禮、按手之禮、死人復活，以及<strong><mark>永遠審判</mark></strong>各等教訓。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L2">希 6:2</a>)</p></blockquote><blockquote><p>“上帝既是公義的，就必將患難報應那加患難給你們的人； 也必使你們這受患難的人與我們同得平安。那時，主耶穌同他有能力的天使從天上在火焰中顯現， 要報應那不認識上帝和那不聽從我主耶穌福音的人。 <strong><mark>他們要受刑罰，就是永遠沉淪</mark></strong>，離開主的面和他權能的榮光。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L6-9">帖後 1:6-9</a>)</p></blockquote><h2>不知道上帝旨意的人也要受刑罰</h2><blockquote><p>“僕人知道主人的意思，卻不預備，又不順他的意思行，<strong><mark>那僕人必多受責打</mark></strong>； 惟有那不知道的，作了當受責打的事，<strong><mark>必少受責打</mark></strong>。因爲多給誰，就向誰多取；多托誰，就向誰多要。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L47-48">路 12:47-48</a>)</p></blockquote><h2>批評</h2><h3>地獄無盡刑罰的教導會使人遠離基督嗎？</h3><p>這不是論據。罪人聽到關於罪的刑罰的話，本來就是不舒服的。難道因此就該向他應許：犯罪會有真福？同樣，對愛罪的人來說，這樣的教導是不舒服的：</p><ul><li><p>論悔改，</p></li><li><p>論離棄罪，</p></li><li><p>論改正生活，</p></li><li><p>論基督是唯一的救主，別的路不通向救恩（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L12">徒 4:12</a>），</p></li><li><p>論愛仇敵、放棄報復、饒恕人的虧欠、善待恨我們的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L44">太 5:44</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L27">路 6:27</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L35">路 6:35</a>），</p></li><li><p>論放棄求財的意向（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L24">太 19:24</a>），</p></li><li><p>論一夫一妻（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L10">太 19:10</a>）。</p></li></ul><p>但這當然並不意味著要放棄這一切。而爲什麼不意味著呢？因爲這是真理。如果人不聽從這些話，那麼關於刑罰的警告就真會應驗——這些話並不是徒然的。我們警告他，是爲了這些事不至於臨到他身上。永遠的刑罰也是如此：如果這是真實的教導，那爲什麼要修改真理、刪除罪人不便聽到的東西呢？</p><blockquote><p>“因爲時候要到，人必厭煩純正的道理，<strong><mark>耳朵發癢，就隨從自己的情慾，增添好些師傅</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L3">提後 4:3</a>)</p></blockquote><p>在教導中應當以真理爲出發點，而不是以人們喜歡聽什麼爲出發點：</p><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，<strong><mark>要爲從前一次交付聖徒的真道竭力的爭辯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote>
