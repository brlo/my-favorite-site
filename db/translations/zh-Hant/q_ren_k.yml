  title: 賞報的尺度不一樣：刑罰與真福
  copy_cover: true
  body: <h2>陰間刑罰的不同</h2><h3>知道而違揹的人，比不知道而違揹的人受更重的刑罰</h3><blockquote><p>“僕人知道主人的意思，卻不預備，又不順他的意思行，<strong><mark>那僕人必多受責打</mark></strong>； 惟有那不知道的，作了當受責打的事，<strong><mark>必少受責打</mark></strong>。因爲多給誰，就向誰多取；<strong><mark>多托誰，就向誰多要</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L47-48">路 12:47-48</a>)</p></blockquote><h3>假善的人要受更重的定罪</h3><blockquote><p>“<strong><mark>你們這假冒爲善的文士和法利賽人有禍了</mark></strong>！因爲你們侵吞寡婦的家產，假意作很長的禱告，所以要受更重的刑罰” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L14">太 23:14</a>)</p></blockquote><blockquote><p>“「你們要防備文士。他們好穿長衣遊行，喜愛人在街市上問他們安，又喜愛會堂裏的高位，筵席上的首座； <strong><mark>他們侵吞寡婦的家產，假意作很長的禱告。這些人要受更重的刑罰</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/20/#L46-47">路 20:46-47</a>)</p></blockquote><h3>犯罪的師傅要受更重的定罪</h3><blockquote><p>“我的弟兄們，<strong><mark>不要多人作師傅，因爲曉得我們要受更重的判斷</mark></strong>。 原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/3/#L1-2">雅 3:1-2</a>)</p></blockquote><h3>在基督之前犯罪的城市，與基督行過明顯異能卻被拒絕的城市相比，在審判的日子還要容易受些</h3><blockquote><p>“但我告訴你們，<strong><mark>當審判的日子，推羅、西頓所受的比你們還容易受呢</mark></strong>！ 迦百農啊，你已經升到天上將來必墜落陰間，因爲在你那裏所行的異能，若行在所多瑪，他還可以存到今日。 但我告訴你們：<strong><mark>當審判的日子，所多瑪所受的，比你還容易受呢</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L22-24">太 11:22-24</a>)</p></blockquote><blockquote><p>“凡不接待你們、不聽你們話的人，你們離開那家或是那城的時候，就把腳上的塵土跺下去。 我實在告訴你們：當審判的日子，<strong><mark>所多瑪和蛾摩拉所受的，比那城還容易受呢</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L14-15">太 10:14-15</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L11">可 6:11</a>)</p></blockquote><blockquote><p>“哥拉汛哪，你有禍了！伯賽大啊，你有禍了！因爲在你們中間所行的異能若行在推羅、西頓，他們早已披麻蒙灰，坐在地上悔改了。 <strong><mark>當審判的日子，推羅、西頓所受的，比你們還容易受呢</mark></strong>！ 迦百農啊！你已經升到天上，將來必推下陰間。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L13-15">路 10:13-15</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L20-22">太 11:20-22</a>)</p></blockquote><h3>藉他們而來誘惑的人有禍了</h3><blockquote><p>“耶穌又對門徒說：「絆倒人的事是免不了的，<strong><mark>但那絆倒人的有禍了</mark></strong>。 <strong><mark>就是把磨石拴在這人的頸項上，丟在海里，還強如他把這小子裏的一個絆倒了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/17/#L1-2">路 17:1-2</a>)</p></blockquote><h3>使信徒跌倒的人有禍了</h3><blockquote><p>“凡爲我的名接待一個像這小孩子的，就是接待我。 <strong><mark>凡使這信我的一個小子跌倒的，倒不如把大磨石拴在這人的頸項上，沉在深海里</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L5-6">太 18:5-6</a>)</p></blockquote><h3>出賣基督的人有禍了；那人不生在世上倒好</h3><blockquote><p>“人子必要去世，正如經上指著他所寫的，<strong><mark>但賣人子的人有禍了，那人不生在世上倒好</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L24">太 26:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L21">可 14:21</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L22">路 22:22</a>)</p></blockquote><h2>天國裏真福的不同</h2><h3>賞報按善行的多少</h3><blockquote><p>“甘心事奉，好像服事主，不像服事人。 <strong><mark>因爲曉得各人所行的善事</mark></strong>，不論是爲奴的、是自主的，<strong><mark>都必按所行的，得主的賞賜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L7-8">弗 6:7-8</a>)</p></blockquote><blockquote><p>“我栽種了，亞波羅澆灌了，惟有上帝叫他生長。 可見栽種的算不得什麼，澆灌的也算不得什麼，只在那叫他生長的上帝。 栽種的和澆灌的，都是一樣。<strong><mark>但將來各人要照自己的工夫得自己的賞賜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L6-8">林前 3:6-8</a>)</p></blockquote><blockquote><p>“『<strong><mark>少種的少收，多種的多收</mark></strong>』，這話是真的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/9/#L6">林後 9:6</a>)</p></blockquote><blockquote><p>“人子要在他父的榮耀裏，同著衆使者降臨；那時候，<strong><mark>他要照各人的行爲報應各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L5-6">羅 2:5-6</a>)</p></blockquote><blockquote><p>“你們要給人，就必有給你們的，並且<strong><mark>用十足的升斗</mark></strong>，連搖帶按，上尖下流地倒在你們懷裏；<strong><mark>因爲你們用什麼量器量給人，也必用什麼量器量給你們</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L38">路 6:38</a>)</p></blockquote><h3>使徒追求更大的</h3><blockquote><p>“<strong><mark>這不是說我已經得著了</mark></strong>，已經完全了，<strong><mark>我乃是竭力追求</mark></strong>，或者可以得著基督耶穌所以得著我的。 弟兄們，<strong><mark>我不是以爲自己已經得著了</mark></strong>，我只有一件事，就是忘記背後，努力面前的， <strong><mark>向着標竿直跑，要得上帝在基督耶穌裏從上面召我來得的獎賞</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L12-14">腓 3:12-14</a>)</p></blockquote><h3>誰遵行誡命又教訓人遵行——要稱爲大</h3><blockquote><p>“所以，無論何人廢掉這誡命中最小的一條，又教訓人這樣作，他在天國要稱爲最小的；<strong><mark>但無論何人遵行這誡命，又教訓人遵行，他在天國要稱爲大的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L19">太 5:19</a>)</p></blockquote><h3>天國裏有許多住處</h3><blockquote><p>“<strong><mark>在我父的家裏，有許多住處</mark></strong>；若是沒有，我就早已告訴你們了。我去原是爲你們預備地方去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L2">約 14:2</a>)</p></blockquote><h3>先知的賞賜和義人的賞賜</h3><blockquote><p>“人接待你們，就是接待我；接待我，就是接待那差我來的。 人因爲先知的名接待先知，<strong><mark>必得先知所得的賞賜</mark></strong>；人因爲義人的名接待義人，<strong><mark>必得義人所得的賞賜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L40-41">太 10:40-41</a>)</p></blockquote><h3>僕人們得的賞賜不同</h3><blockquote><p>“他既得國回來，就吩咐叫那領銀子的僕人來，要知道他們作生意賺了多少。 頭一個上來，說：『主啊，你的一錠銀子已經賺了十錠。』 主人說：『好！良善的僕人，你既在最小的事上有忠心，<strong><mark>可以有權柄管十座城</mark></strong>。』 第二個來，說：『主啊，你的一錠銀子已經賺了五錠。』 主人說：『<strong><mark>你也可以管五座城</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/19/#L15-19">路 19:15-19</a>)</p></blockquote><blockquote><p>“天國又好比一個人要往外國去，就叫了僕人來，<strong><mark>把他的家業交給他們</mark></strong>， <strong><mark>按著各人的才幹，給他們銀子，一個給了五千，一個給了二千，一個給了一千</mark></strong>，就往外國去了。 &lt;…&gt; <strong><mark>那領五千銀子的又帶著那另外的五千來</mark></strong>，說：『主啊，你交給我五千銀子。請看，我又賺了五千。』 主人說：『好！你這又良善又忠心的僕人，你在不多的事上有忠心，我要把許多事派你管理；可以進來享受你主人的快樂。』 那領二千的也來，說：『主啊，你交給我二千銀子，請看，我又賺了二千。』 主人說：『好！你這又良善又忠心的僕人，你在不多的事上有忠心，我要把許多事派你管理；可以進來享受你主人的快樂。』 那領一千的也來，說：『主啊，我知道你是忍心的人，沒有種的地方要收割，沒有散的地方要聚斂， 我就害怕，去把你的一千銀子埋藏在地裏。請看，你的原銀子在這裏。』 主人回答說：『你這又惡又懶的僕人！你既知道我沒有種的地方要收割，沒有散的地方要聚斂， 就當把我的銀子放給兌換銀錢的人，到我來的時候，可以連本帶利收回。 <strong><mark>奪過他這一千來，給那有一萬的</mark></strong>！ 因爲凡有的，還要加給他，叫他有餘；沒有的，連他所有的也要奪過來。 把這無用的僕人丟在外面黑暗裏，在那裏必要哀哭切齒了。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L14-15,20-30">太 25:14-15,20-30</a>)</p></blockquote><p>*葡萄園僱工的比喻（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/20/#L1-16">太 20:1-16</a>）中，所有人得的報酬一樣；這比喻是在法利賽人面前講的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/19/#L3">太 19:3</a>），講它是爲了叫人不至於彼此自高：來得早、勞苦更多的，不要自高於來得晚、勞苦較少的人——因爲在較短的晚來的時間裏，也可以獲得必要的東西，所以不應灰心。</p><h3>童身者與基督有特別的親近</h3><blockquote><p>“<strong><mark>這些人未曾沾染婦女，他們原是童身</mark></strong>。<strong><mark>羔羊無論往那裏去，他們都跟隨他</mark></strong>。他們是從人間買來的，作初熟的果子歸與上帝和羔羊。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L4">啟 14:4</a>)</p></blockquote>
