  title: 教育
  copy_cover: true
  body: <blockquote><p>“我兒，從你幼年時起，<strong>就應接受教訓</strong>；如此，直到老年，<strong>必能尋得智慧</strong>。你要親近她，就如耕田和播種的人，等待她的美果；因爲，你用智慧去工作，用功不久，很快就可吃她的出產。<strong>智慧爲不肯受教的人，是酸苦的</strong>；愚昧的人，不會與智慧常久相處，因爲，智慧有如放在愚昧人身上的重石，他決不會遲延拋棄她。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/6/#L18-22">德 6:18-22</a>)</p></blockquote><blockquote><p>“說：「<strong><mark>你們愚昧人喜愛愚昧，褻慢人喜歡褻慢，愚頑人恨惡知識，要到幾時呢</mark></strong>？ &lt;…&gt; <strong><mark>愚昧人背道，必殺己身；愚頑人安逸，必害己命</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/1/#L22,32">箴 1:22,32</a>)</p></blockquote><blockquote><p>“行爲純正的貧窮人，勝過乖謬<strong>愚妄</strong>的富足人。 心無知識的，乃爲不善；腳步急快的，難免犯罪。 <strong><mark>人的愚昧傾敗他的道</mark></strong>，他的心也抱怨耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/19/#L1-3">箴 19:1-3</a>)</p></blockquote><blockquote><p>“<strong><mark>得著智慧的，愛惜生命</mark></strong>；保守聰明的，必得好處。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/19/#L8">箴 19:8</a>)</p></blockquote><blockquote><p>“我經過懶惰人的田地、<strong><mark>無知人</mark></strong>的葡萄園， <strong><mark>荊棘長滿了地皮</mark></strong>，刺草遮蓋了田面，石牆也坍塌了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/24/#L30-31">箴 24:30-31</a>)</p></blockquote><blockquote><p>“<strong><mark>你要謹慎自己和自己的教訓，要在這些事上恆心</mark></strong>。因爲這樣行，又能救自己，又能救聽你的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L16">提前 4:16</a>)</p></blockquote><blockquote><p>“<strong><mark>你們民間的畜類人當思想</mark></strong>；<strong><mark>你們愚頑人</mark></strong>到幾時纔有智慧呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/94/#L8">詩 94:8</a>)</p></blockquote><blockquote><p>“喜愛管教的，就是喜愛知識；<strong><mark>恨惡責備的，卻是畜類</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/12/#L1">箴 12:1</a>)</p></blockquote><blockquote><p>“<strong><mark>愚昧人背道，必殺己身；愚頑人安逸，必害己命</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/1/#L32">箴 1:32</a>)</p></blockquote><blockquote><p>“<strong><mark>愚蒙人得愚昧爲產業</mark></strong>；通達人得知識爲冠冕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/14/#L18">箴 14:18</a>)</p></blockquote><blockquote><p>“智慧人的財，爲自己的冠冕；<strong><mark>愚妄人的愚昧，終是愚昧</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/14/#L24">箴 14:24</a>)</p></blockquote><blockquote><p>“<strong>謊言</strong>爲人是一種可惡的污點，<strong>然而常在無知人的口裏</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/20/#L26">德 20:26</a>) <em>(俄文本爲 Сир 20:24。)</em></p></blockquote><blockquote><p>“<strong>智慧的真起點，是切願受教</strong>；<strong>切願受教就是愛</strong>；愛即在於遵守法律；遵守法律，便是不朽的保證；不朽使人親近天主；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/6/#L18-20">智 6:18-20</a>)</p></blockquote><blockquote><p>“從前雅尼和佯庇怎樣敵擋摩西，<strong><mark>這等人也怎樣敵擋真道</mark></strong>。他們的心地壞了，<strong><mark>在真道上是可廢棄的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/3/#L8">提後 3:8</a>)</p></blockquote><blockquote><p>“他一切的信上也都是講論這事。信中有些難明白的，<strong><mark>那無學問、不堅固的人強解</mark></strong>，如強解別的經書一樣，<strong><mark>就自取沉淪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L16">彼後 3:16</a>)</p></blockquote>
