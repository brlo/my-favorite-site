- src: расы-и-народы
  path: QR4T_種族與民族
  title: 種族與民族
  copy_cover: true
  body: <p>起初，上帝造了亞當：</p><blockquote><p>“<strong><mark>耶和華上帝用地上的塵土造人</mark></strong>，將生氣吹在他鼻孔裏，他就成了有靈的活人，名叫亞當。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L7">創 2:7</a>) <em>(希伯來文：אָדָם（亞當）。)</em></p></blockquote><p>後來，上帝從亞當的肋骨造了夏娃：</p><blockquote><p>“<strong><mark>只是那人沒有遇見配偶幫助他</mark></strong>。 耶和華上帝使他沉睡，他就睡了；於是取下他的一條肋骨，又把肉合起來。 <strong><mark>耶和華上帝就用那人身上所取的肋骨造成一個女人，領她到那人跟前</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L20-22">創 2:20-22</a>)</p></blockquote><p>亞當生了許多兒女：</p><blockquote><p>“<strong><mark>亞當生塞特之後</mark></strong>，又在世八百年，<strong><mark>並且生兒養女</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/5/#L4">創 5:4</a>)</p></blockquote><p>塞特出生之後（即已生了三個兒子：<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/4/#L1">創 4:1</a>該隱、<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/4/#L2">創 4:2</a>亞伯和<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/4/#L25">創 4:25</a>塞特），又生了別的兒子和女兒。創世記的作者對他們不再加以注意，因爲作者的視線只投向他認爲對讀者重要的歷史細節。此後只按父系（按猶太傳統）列舉該隱和塞特的某些世系。由該隱所出的世系中，提到樂器的發明者（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/4/#L21">創 4:21</a>）、兵器的製造者（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/4/#L22">創 4:22</a>）和多妻制的起源（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/4/#L19">創 4:19</a>）。列舉了從塞特到挪亞的某些先祖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/5/#L6-29">創 5:6-29</a>）。塞特生了許多兒女（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/5/#L7">創 5:7</a>），但其中只提到一個：以挪士（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/4/#L26">創 4:26</a>）。其餘的人也是這樣。後來人漸漸增多，忘記上帝，先沉溺於罪中，後又被洪水的波濤淹沒。除挪亞一家外，所有的人都死了。而如今，全人類的一切族類都是從挪亞一家而出（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/9/#L19">創 9:19</a>）。挪亞生了閃、含、雅弗：</p><blockquote><p>“挪亞五百歲生了閃、含、雅弗。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/5/#L32">創 5:32</a>)</p></blockquote><blockquote><p>“挪亞生了三個兒子，就是閃、含、雅弗。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/6/#L10">創 6:10</a>)</p></blockquote><blockquote><p>“正當那日，挪亞和他三個兒子閃、含、雅弗，並挪亞的妻子和三個兒婦，都進入方舟。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/7/#L13">創 7:13</a>)</p></blockquote><blockquote><p>“出方舟挪亞的兒子就是閃、含、雅弗。含是迦南的父親。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/9/#L18">創 9:18</a>)</p></blockquote><p>含的後裔：</p><blockquote><p>“含的兒子是：古實、麥西、弗、迦南。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/10/#L6">創 10:6</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/1/#L8">代上 1:8</a>)</p></blockquote><p><strong>古實</strong>——埃塞俄比亞（黑色人種）；<strong>麥西</strong>——埃及（淺黑色人種）；<strong>弗</strong>——利比亞（白色人種）；<strong>迦南</strong>——肥沃新月地帶的西部（非黑色人種），挪亞所咒詛的正是他（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/9/#L25,27">創 9:25,27</a>）。此外，蘇美爾人（非黑色人種）也是出於古實的後裔（寧錄——<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/10/#L8">創 10:8</a>）。<a href="https://www.youtube.com/watch?v=JPGyRZqSZkY">詳細解析</a></p><p><strong>注</strong>：亞當的兒子們娶了自己的姊妹爲妻。要遵行上帝生養衆多的誡命，此外別無他路。而且，挪亞的孫輩也處在類似的處境中：洪水之後，地上所有的人都是至近的親屬。近親通婚要到很久之後，在先知摩西的時代才被禁止。猶太民族正是出自一對兄妹——亞伯拉罕和撒拉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/20/#L12">創 20:12</a>）。此外，本文尚需完善：需要描述聖經中關於各族與各民族先祖的資料。</p>
