- src: человек-труд
  path: QR6T_勞動
  title: 勞動
  copy_cover: true
  body: <blockquote><p>“<strong><mark>你必汗流滿面才得餬口</mark></strong>，直到你歸了土，因爲你是從土而出的。你本是塵土，仍要歸於塵土。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L19">創 3:19</a>)</p></blockquote><blockquote><p>“<strong><mark>又要立志作安靜人，辦自己的事，親手作工，正如我們從前所吩咐你們的</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/4/#L11">帖前 4:11</a>)</p></blockquote><blockquote><p>“這事以後，<strong>保羅</strong>離了雅典，來到哥林多。 &lt;…&gt; <strong><mark>他們本是製造帳棚爲業</mark></strong>。保羅因<strong>與他們同業</strong>，就和他們同住作工。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/18/#L1,3">徒 18:1,3</a>)</p></blockquote><blockquote><p>“直到如今，我們還是又飢、又渴、又赤身露體、又挨打、又沒有一定的住處， <strong><mark>並且勞苦，親手作工</mark></strong>。被人咒罵，我們就祝福；被人逼迫，我們就忍受；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L11-12">林前 4:11-12</a>)</p></blockquote><blockquote><p>“從前偷竊的，不要再偷；<strong><mark>總要勞力，親手作正經事</mark></strong>，就可有餘，分給那缺少的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L28">弗 4:28</a>)</p></blockquote><blockquote><p>“<strong>我未曾貪圖一個人的金、銀、衣服</strong>。 <strong><mark>我這兩隻手常供給我和同人的需用</mark></strong>，這是你們自己知道的。 我凡事給你們作榜樣，叫你們知道應當這樣勞苦，扶助軟弱的人，又當記念主耶穌的話，說：『施比受更爲有福。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L33-35">徒 20:33-35</a>)</p></blockquote><blockquote><p>“我們的勸勉，不是出於錯誤，不是出於污穢，也不是用詭詐。 &lt;…&gt; 因爲<strong><mark>我們從來沒有用過諂媚的話</mark></strong>，這是你們知道的；<strong><mark>也沒有藏著貪心</mark></strong>，這是上帝可以作見證的。 &lt;…&gt; 弟兄們，你們記念我們的辛苦勞碌，<strong><mark>晝夜作工</mark></strong>，傳上帝的福音給你們，<strong><mark>免得叫你們一人受累</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/2/#L3,5,9">帖前 2:3,5,9</a>)</p></blockquote><blockquote><p>“<strong><mark>也未嘗白吃人的飯</mark></strong>，倒是<strong><mark>辛苦勞碌，晝夜作工</mark></strong>，免得叫你們一人受累。 這並不是因我們沒有權柄，乃是要給你們作榜樣，叫你們效法我們。 我們在你們那裏的時候，曾吩咐你們說：「<strong><mark>若有人不肯作工，就不可吃飯</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L8-10">帖後 3:8-10</a>)</p></blockquote><blockquote><p>“不要厭惡勞力的工作，和至高者制定的農業。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/7/#L16">德 7:16</a>) <em>(俄文本爲 Сир 7:15。)</em></p></blockquote><blockquote><p>“勞而致富的人，勝於自大，而無以果腹的人。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/10/#L30">德 10:30</a>)</p></blockquote><blockquote><p>“對待惡僕只有鞭打和刑罰；要使他們操作，不得空閒。因爲，空閒教給人許多壞事。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/33/#L28-29">德 33:28-29</a>)</p></blockquote><blockquote><p>“我經過<strong><mark>懶惰人</mark></strong>的田地、<strong><mark>無知人</mark></strong>的葡萄園， 荊棘長滿了地皮，刺草遮蓋了田面，石牆也坍塌了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/24/#L30-31">箴 24:30-31</a>)</p></blockquote>
