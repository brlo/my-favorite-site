  title: 基督徒——上帝的僕人
  copy_cover: true
  body: <p>基督徒稱自己爲上帝的僕人，因爲他們力求遵行基督——上帝——的旨意。基督徒事奉基督，是他的僕人，把自己的意志服從於他，而且這是自願做的。基督是這樣的主：作他的僕人並不可恥。作世界創造者的僕人同樣並不可恥。而在基督徒所追求的基督的國裏，作萬王之王的順命僕人更是光榮的：</p><blockquote><p>“<strong><mark>主人來了，看見僕人儆醒，那僕人就有福了</mark></strong>。我實在告訴你們：主人必叫他們坐席，自己束上帶，<strong>進前伺候他們</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L37">路 12:37</a>)</p></blockquote><h2>基督吩咐人稱自己爲他的僕人</h2><blockquote><p>“這樣，你們作完了一切所吩咐的，只當說：『<strong><mark>我們是無用的僕人</mark></strong>，所作的本是我們應分作的。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/17/#L10">路 17:10</a>)</p></blockquote><blockquote><p>“<strong>你們稱呼我</strong>夫子，<strong><mark>稱呼我主</mark></strong>，<strong><mark>你們說的不錯，我本來是</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/13/#L13">約 13:13</a>)</p></blockquote><blockquote><p>“你們要記念我從前對你們所說的話：『<strong><mark>僕人不能大於主人</mark></strong>。』他們若逼迫了我，也要逼迫你們；若遵守了我的話，也要遵守你們的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L20">約 15:20</a>)</p></blockquote><h2>使徒們吩咐作基督的僕人</h2><blockquote><p>“不要只在眼前事奉，像是討人喜歡的，<strong><mark>要像基督的僕人</mark></strong>，<strong><mark>從心裏遵行上帝的旨意</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L6">弗 6:6</a>)</p></blockquote><blockquote><p>“因爲<strong><mark>作奴僕蒙召於主的</mark></strong>，就是主所釋放的人；作自由之人蒙召的，就是<strong><mark>基督的奴僕</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L22">林前 7:22</a>)</p></blockquote><blockquote><p>“你們雖是自由的，卻不可藉着自由遮蓋惡毒，<strong><mark>總要作上帝的僕人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L16">彼前 2:16</a>)</p></blockquote><h2>使徒們稱自己爲基督的僕人</h2><blockquote><p>“我現在是要得人的心呢？還是要得上帝的心呢？我豈是討人的喜歡嗎？若仍舊討人的喜歡，<strong><mark>我就不是基督的僕人了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L10">加 1:10</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝的僕人、耶穌基督的使徒保羅</mark></strong>，憑著上帝選民的信心與敬虔真理的知識，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L1">多 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>耶穌基督的僕人，雅各的弟兄猶大</mark></strong>，寫信給那被召，在父上帝裏蒙愛、爲耶穌基督保守的人：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L1">猶 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>作上帝和主耶穌基督僕人的雅各</mark></strong>，請散住十二個支派之人的安。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L1">雅 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>作耶穌基督僕人和使徒的西門彼得</mark></strong>，寫信給那因我們的上帝和救主耶穌基督之義，與我們同得一樣寶貴信心的人：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L1">彼後 1:1</a>)</p></blockquote><blockquote><p>“<strong><mark>耶穌基督的僕人保羅</mark></strong>，奉召爲使徒，特派傳上帝的福音。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L1">羅 1:1</a>)</p></blockquote><blockquote><p>“有你們那裏的人，<strong><mark>作基督耶穌僕人的以巴弗</mark></strong>問你們安。他在禱告之間，常爲你們竭力的祈求，願你們在上帝一切的旨意上得以完全，信心充足，能站立得穩。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/4/#L12">西 4:12</a>)</p></blockquote><h2>上帝之母稱自己爲上帝的婢女</h2><blockquote><p>“馬利亞說：「<strong><mark>我是主的使女</mark></strong>，情願照你的話成就在我身上。」天使就離開她去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L38">路 1:38</a>)</p></blockquote><h2>在舊約裏，上帝稱信徒爲僕人</h2><blockquote><p>“<strong><mark>我的僕人</mark></strong>因心中高興歡呼，你們卻因心中憂愁哀哭，又因心裏憂傷哀號。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/65/#L14">賽 65:14</a>)</p></blockquote><blockquote><p>“我必從雅各中領出後裔，從猶大中領出承受我衆山的。我的選民必承受；<strong><mark>我的僕人要在那裏居住</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/65/#L9">賽 65:9</a>)</p></blockquote><h2>先知和信徒稱自己爲上帝的僕人</h2><blockquote><p>“因爲，<strong>我是你的僕人</strong>，是<strong>你婢女的兒子</strong>，是病弱短命，對正義與法律絕少認識的人。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/9/#L5">智 9:5</a>)</p></blockquote><blockquote><p>“我回答他們說：「天上的上帝必使我們亨通。<strong><mark>我們作他僕人的</mark></strong>，要起來建造；你們卻在耶路撒冷無分、無權、無記念。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/neem/2/#L20">尼 2:20</a>)</p></blockquote><blockquote><p>“<strong><mark>這都是你的僕人、你的百姓</mark></strong>，就是你用大力和大能的手所救贖的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/neem/1/#L10">尼 1:10</a>)</p></blockquote><blockquote><p>“許願說：「萬軍之耶和華啊，你若垂顧<strong><mark>婢女的苦情</mark></strong>，<strong><mark>眷念不忘婢女</mark></strong>，賜我一個兒子，我必使他終身歸與耶和華，不用剃頭刀剃他的頭。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/1/#L11">撒上 1:11</a>)</p></blockquote><blockquote><p>“<strong>上主的衆僕人</strong>，請讚美上主，歌頌稱揚他，直到永遠！” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/3/#L85">但 3:85</a>)</p></blockquote><blockquote><p>“他們回答說：「我們是那創造天地的上主的僕人。」” (<a href="https://bibleox.com/zh-Hant/ru/2ezd/6/#L13">厄三 6:13</a>, )</p></blockquote><h2>也曾有愛自己的主人的奴僕</h2><blockquote><p>“你任他自由的時候，不可使他空手而去。 &lt;…&gt; 他若對你說：『<strong><mark>我不願意離開你</mark></strong>』，<strong><mark>是因他愛你和你的家</mark></strong>，且因在你那裏很好。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/15/#L13,16">申 15:13,16</a>)</p></blockquote>
