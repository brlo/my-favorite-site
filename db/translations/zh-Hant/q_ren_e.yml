- src: 3QXG_Одежда
  path: QR13A_服裝
  title: 服裝
  copy_cover: true
  body: <p>關於衣服，舊約中有這樣的禁令：</p><blockquote><p>“<strong><mark>婦女不可穿戴男子所穿戴的；男子也不可穿婦女的衣服</mark></strong>，因爲這樣行都是耶和華你上帝所憎惡的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/22/#L5">申 22:5</a>)</p></blockquote><p>顯然，這一禁令是針對<a href="https://bibleox.com/ru/ru/w/XBGN_Трансвестизм">性倒錯</a>而設的——即人刻意追求使自己看起來像異性、處於某種不正常狀態的情形。</p><p><hr></p><p>新約中有關於蒙頭的話：</p><blockquote><p>“<strong><mark>凡女人禱告或是講道，若不蒙著頭</mark></strong>，就羞辱自己的頭．因爲這就如同剃了頭髮一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L5">林前 11:5</a>) <em>(原文希臘文 γυνή 既可指「妻子」，也可指「女人」。)</em></p></blockquote><p>在現代社會，爲婦女設計了各式各樣的服裝，包括女式褲子，但教會傳統中形成了關於信友外表的既定規則（外表應當樸實端莊）：建議婦女穿裙子、蒙頭來聖殿，儘量少用化妝品；對男子則建議穿適度遮蔽的服裝（短褲和背心不適合在聖殿裏穿）。這樣做，是爲了在上帝面前顯得整潔（內心的秩序並不排除外表的秩序），也是爲了不以刺眼的裝束分散來到聖殿祈禱的近人的注意力。</p><p>婦女若在生活中遵守這一傳統有困難，有時會隨身帶一條頭巾或類似的東西，在進入聖殿前把它蒙在頭發上。</p><p>有時，某些信友對破壞這一傳統的人反應不當——這些人並非蓄意違規，只是不知道這一傳統，進聖殿來想了解或祈禱。對這樣的信友應當解釋，請他們不要嚇著、趕走這樣的人，更不要對他們無禮。</p>
