  path: QO22T_異教徒對偶像的信仰
  title: 異教徒對偶像的信仰
  copy_cover: true
  body: <h2>異教徒信仰偶像的種類</h2><p>異教徒對偶像的信仰有三種，從古代最普遍的一種開始：</p><ol><li><p><strong>偶像——就是神本身</strong>。異教徒所製造的物件本身就是神。</p></li><li><p><strong>偶像——是</strong>遙遠之神的<strong>形像</strong>，據說那神就應當是這樣。</p></li><li><p><strong>偶像——是</strong>被神化的自然元素——海、風、雨、火、土——的<strong>虛構形像</strong>。</p></li></ol><p>在所有三種情形中，受敬禮的都是<strong>虛假的神</strong>，是<strong>不存在的</strong>。這是對謊言的信仰。</p><p>聖經中遇到的正是第一種：最普遍的異教信仰是<strong>對物件本身（物質）的神化</strong>。</p><h2>異教徒把製品本身當作神</h2><blockquote><p>“所以我從古時將這事給你說明，在未成以先指示你，免得你說：『<strong><mark>這些事是我的偶像所行的</mark></strong>，<strong><mark>是我雕刻的偶像和我鑄造的偶像所命定的</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/48/#L5">賽 48:5</a>)</p></blockquote><blockquote><p>“他們的口舌是匠人雕琢的，包金裹銀，但<strong>它們是虛假的，不能說話</strong>。人們彷彿爲喜愛裝飾的少女那樣取金子，爲他們諸神制冠冕。有時<strong>司祭偷取他們諸神上的金銀</strong>，供自己享用；分一些給殿宇中的娼妓；給金銀木製諸神<strong>穿上衣服裝飾它們</strong>，如同裝飾人。但<strong>它們雖身穿紫袍，卻免不了鏽蝕和蟲蛀</strong>。人們在殿宇中拭去它們臉上的灰塵——那灰塵在它們身上非常多。它手中拿著權杖，如同人間的判官，卻<strong>不能處死在它面前的惡人</strong>。它右手拿著刀劍和斧子，卻<strong>不能保護自己免受軍隊和強盜的侵害</strong>：由此可知，<strong>它們不是神</strong>；所以不要怕它們。如同打碎的器皿對人無用，它們的神也是如此。它們被安放在殿宇中之後，眼睛裏滿是進來之人的腳所揚起的塵土。如同得罪君王的人被帶去處死時其居所緊閉門戶，它們的殿宇也<strong>由司祭用門、鎖和閂守護著，免得被盜賊搶掠</strong>；人們爲它們點燈，比爲自身點的還多，而它們一盞也看不見。它們如同房中的木柱；<strong>據說地裏的蟲蛀蝕它們的心，把它們和它們的衣服一起吃掉，它們卻毫無感覺</strong>。它們的面孔被殿宇中的煙氣燻得發黑。<strong>蝙蝠、燕子和別的飛鳥落在它們的身上和頭上，貓也在它們身上攀爬。由此你們可以明白：它們不是神</strong>；所以不要怕它們。若不除去包在其上作裝飾的金子上的鏽，它們便不發光；<strong>澆鑄它們時，它們沒有感覺</strong>。它們被高價買來，裏面卻沒有神魂。它們沒有腳，<strong>卻被人扛在肩上</strong>，向人顯明自己的無能；事奉它們的人也蒙羞辱；因爲<strong>它們跌倒在地上時，不能自己起來</strong>；即使有人把它們立直，<strong>它們也不能自己移動</strong>；若有人把它們推歪，<strong>它們不能自己站直</strong>；人們卻如同對死人一樣在它們面前擺上供物。它們的祭物被司祭賣掉並濫用；他們的妻子也把其中一些醃起來，分文不施給窮人或病人。不潔的婦女和產婦也觸摸它們的祭物。由此知道它們不是神，就不要怕它們。怎能稱它們爲神呢？婦女竟向這些金銀木製的神獻祭。在它們的殿宇中坐著司祭，身穿破爛衣服，剃去頭發和鬍鬚，也不蒙頭：這些包金裹銀的木製神如同山中的石頭——事奉它們的人必蒙羞辱。怎能以爲或說它們是神呢？它們那裏所行的一切都是虛假的。這樣，怎能以爲或說它們是神呢？<strong>它們是匠人和金匠製造的；它們無非成了匠人想要造的樣子</strong>。製造它們的人自己也不長久；他們所造的怎能是神呢？他們給自己後代留下了謊言和恥辱。那些<strong>連自己都不能從戰爭和災禍中拯救</strong>的，怎能不明白它們不是神呢？既然它們是包金裹銀的木頭，就可以認出它們是謊言；萬民和君王都將明白：<strong>這不是神，而是人手的作品，其中沒有任何神性的作爲</strong>。此後誰還不明白它們不是神呢？它們不能爲國家立王，不能降雨給人；不能審判，不能保護受欺壓者，無力如同懸於天地之間的烏鴉。即便<strong>金銀木製諸神的殿宇失火，它們的司祭也會逃走得救——而它們自己如同中間的木頭一樣燒掉</strong>。它們不能對抗君王，也不能對抗仇敵。怎能接受或以爲它們是神呢？<strong>這些包金裹銀的木製神既不能保護自己免受盜賊和強盜的侵害</strong>：強盜勝過它們，剝下它們身上的金銀和衣服就走，而這些東西連自己都幫不了。因此，表露勇氣的君王，或主人在家中使用的有用器皿，都比虛假的神更好；或家中看守財產的門，都比虛假的神更好；或王宮中的木柱，都比虛假的神更好。這樣，知道它們不是神，就不要怕它們。走獸比它們更好：它們逃到庇護之下還能自救。這樣，<strong>我們無論從哪方面都看不出它們是神</strong>；所以不要怕它們。<strong>菜園中的稻草人</strong>守護不了什麼，它們那包金裹銀的木製神也是如此。同樣，它們那包金裹銀的木製神如同園中的荊棘叢，各樣的鳥落在上面，又如被拋在黑暗中的屍體。從那在它們身上朽壞的紫袍與硃紅線，你們可以明白它們不是神；它們自己終將被吃掉，成爲那地方的恥辱。這樣，沒有偶像的義人更好，因爲他遠離恥辱。” (<a href="https://bibleox.com/zh-Hant/ru/pos/1/#L7-30,38-39,44-47,49-58,64,67-72">耶函 1:7-30,38-39,44-47,49-58,64,67-72</a>, ) <em>(俄文原文無中文經文（耶利米書信不在中文譯本中），此處自譯。)</em></p></blockquote><h2>以色列的異教徒把製品本身、也把元素當作神</h2><blockquote><p>“<strong><mark>製造雕刻偶像的盡都虛空</mark></strong>；<strong><mark>他們所喜悅的都無益處</mark></strong>。他們的見證無所看見，無所知曉，他們便覺羞愧。 誰製造神像，鑄造無益的偶像？ 看哪，他的同伴都必羞愧！工匠也不過是人，任他們聚會，任他們站立，都必懼怕，一同羞愧。 鐵匠把鐵在火炭中燒熱，用錘打鐵器，用他有力的膀臂錘成；他飢餓而無力，不喝水而發倦。 <strong><mark>木匠拉線，用筆劃出樣子</mark></strong>，用鉋子鉋成形狀，用圓尺劃了模樣，仿照人的體態，作成人形，好住在房屋中。 <strong><mark>他砍伐香柏樹</mark></strong>，又取柞樹和橡樹，在樹林中選定了一棵。他栽種松樹，得雨長養。 <strong><mark>這樹，人可用以燒火</mark></strong>。他自己取些烤火，又燒著烤餅，<strong><mark>而且作神像跪拜</mark></strong>，作雕刻的偶像向它叩拜。 <strong><mark>他把一分燒在火中</mark></strong>，把一分烤肉吃飽。自己烤火說：「阿哈！我暖和了！我見火了！」 <strong><mark>他用剩下的作了一神</mark></strong>，就是雕刻的偶像。他向這偶像俯伏叩拜，禱告他說：「<strong><mark>求你拯救我，因你是我的神</mark></strong>。」 <strong><mark>他們不知道，也不思想</mark></strong>，因爲<strong><mark>耶和華閉住他們的眼</mark></strong>，不能看見；塞住他們的心，不能明白。 誰心裏也不醒悟，也沒有知識，沒有聰明，能說：「<strong><mark>我曾拿一分在火中燒了</mark></strong>，在炭火上烤過餅，我也烤過肉吃。<strong><mark>這剩下的我豈要作可憎的物嗎</mark></strong>？<strong><mark>我豈可向木不子叩拜呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/44/#L9-19">賽 44:9-19</a>)</p></blockquote><blockquote><p>“凡不認識天主的人，都是真正的愚人，因爲，他們未能從看得見的美物，去發現那自有者；注意了工程，卻不認識工程師；……<strong>他們敬奉火、風、流動的空氣、星辰、洪流或天上的衆星，奉爲掌管世界的神明</strong>。若有人因這些事物的美麗而著迷，奉之爲神，那麼他就應認出：那位造它們的美的創造主是多麼遠勝它們。……但他們中間那些更可憐的，他們把希望寄託在無靈之物上，<strong>稱人手的作品——金銀、工藝製品、動物的形像——爲神</strong>，或稱無用的石頭、遠古的手工爲神。又如一個工匠，砍下一塊合用的木頭，熟練地剝去全部樹皮，巧妙地加工，<strong>做成生活中有用的器皿，而把刨花用來做飯，吃飽了肚子；其中一塊無用的碎木，彎曲多節，他拿起來在閒暇時精心削圓，以行家的手藝加工，把它</strong>做<strong>成人（不是神）的形像</strong>，或做成<strong>某個卑賤獸類的模樣</strong>，塗上丹砂，漆成紅色，遮住一切疤痕，爲它安排相稱的地方，掛在牆上，<strong>用鐵釘固定。爲使他所作的不致墜落，他預先操心，</strong>知道它自己幫不了自己<strong>：因爲這是偶像，需要幫助。他在它面前爲自己的產業、婚姻和兒女祈禱時，竟不羞於向無靈之物說話；求健康時呼喚無力者；向</strong>死物<strong>求生命；向</strong>完全無能者<strong>求援助；求旅途平安時，呼求</strong>不能邁步者<strong>；求收穫、技藝和手工的成就時，呼求</strong>完全不能動手者**；向最無力者求力量。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/13/#L1-19">智 13:1-19</a>)</p></blockquote><blockquote><p>“再如：有個準備航海的人，行將在怒濤中航行之際，<strong>竟向一塊比自己乘的船還易壞的木頭呼求</strong>。這<strong>手造之物</strong>本身和造它的人，都因造了它而可詛咒；這<strong>腐朽之物竟被稱爲神</strong>。……父親因兒子早逝而悲痛，<strong>就爲他造了像，如同已死之人的像，隨後竟敬奉這</strong>像<strong>，如同敬奉神</strong>，並把奧祕和祭祀傳給屬下。此後，這邪惡的習俗因時間而鞏固，被當作法律來遵守，執政者又下令，<strong>雕像竟被當作神明來敬禮</strong>。人們因居住遙遠而不能面對面敬禮的，就把遠方的面容畫成圖像：爲受敬禮的君王造出可見的像，以此殷勤討好在位者的歡心，如同他親自在場一樣。工匠的手藝也爲不知情者加添敬禮的熱忱：他願討君王的歡心，<strong>便以技藝把像修飾得更美觀；民衆被工藝之美所吸引，不久前還把那像當作人來敬禮</strong>［從前敬禮的是偉人的雕像］<strong>，如今竟奉爲神明</strong>。這成了人們的陷阱：他們或屈服於災難，或屈服於強權，<strong>把不可言傳的名加在石頭和木頭上</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/14/#L1,8,14-21">智 14:1,8,14-21</a>)</p></blockquote><p>在何烈山腳下，以色列民簡直是在要求給他們造神：</p><blockquote><p>“百姓見摩西遲延不下山，就大家聚集到亞倫那裏，對他說：「<strong><mark>起來！爲我們作神像</mark></strong>，可以在我們前面引路；因爲領我們出埃及地的那個摩西，我們不知道他遭了什麼事。」 亞倫對他們說：「你們去摘下你們妻子、兒女，耳上的金環，拿來給我。」 &lt;…&gt; <strong><mark>亞倫從他們手裏接過來，鑄了一隻牛犢，用雕刻的器具作成</mark></strong>。他們就說：「<strong><mark>以色列啊，這是領你出埃及地的上帝</mark></strong>！」 &lt;…&gt; 他們對我說：『<strong><mark>你爲我們做神像</mark></strong>，可以在我們前面引路，因爲領我們出埃及地的那個摩西，我們不知道他遭了什麼事。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/32/#L1-2,4,23">出 32:1-2,4,23</a>)</p></blockquote><blockquote><p>“摩西回到耶和華那裏說：「唉！<strong><mark>這百姓犯了大罪，爲自己作了金像</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/32/#L31">出 32:31</a>)</p></blockquote><p>他們向蛇焚香——不是向上帝，給蛇起了名字，也就是捏造了神：</p><blockquote><p>“他廢去邱壇，毀壞柱像，砍下木偶，<strong><mark>打碎摩西所造的銅蛇</mark></strong>，因爲到那時<strong><mark>以色列人仍向銅蛇燒香</mark></strong>。<strong><mark>希西家叫銅蛇爲銅塊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/18/#L4">王下 18:4</a>)</p></blockquote><p>他們偷走了諸神（雖然偷走的只是製品）——也就是說，製品本身被稱爲神：</p><blockquote><p>“現在你雖然想你父家，不得不去，<strong><mark>爲什麼又偷了我的神像呢</mark></strong>？」 雅各回答拉班說：「恐怕你把你的女兒從我奪去，所以我逃跑。 <strong><mark>至於你的神像，你在誰那裏搜出來，就不容誰存活</mark></strong>。當著我們的衆弟兄你認一認，在我這裏有什麼東西是你的，就拿去。」<strong><mark>原來雅各不知道拉結偷了那些神像</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/31/#L30-32">創 31:30-32</a>)</p></blockquote><p>禁止製造他們所敬拜的手造之神：</p><blockquote><p>“<strong><mark>你們不可偏向虛無的神，也不可爲自己鑄造神像</mark></strong>。我是耶和華你們的上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L4">利 19:4</a>)</p></blockquote><blockquote><p>“<strong><mark>他們的地滿了偶像，他們跪拜自己手所造的</mark></strong>，就是自己指頭所作的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/2/#L8">賽 2:8</a>)</p></blockquote><h2>以色列中製造偶像的原因</h2><blockquote><p>“雅洛貝罕心中思量：「<strong>這王國遲早要歸於達味王室</strong>」［這是製造偶像的原因］；如果這人民上耶路撒冷，在上主殿內獻祭，他們的心難免不歸向他們的主上猶大王勒哈貝罕，把我打死，再歸屬於猶大王勒哈貝罕。因此，雅洛貝罕王拿定了主意，<strong>製造了兩隻金牛犢</strong>，對人民說：你們不需要再上耶路撒冷去了；以色列！<strong>看，這就是領你們由埃及地上來的天主</strong>！［兩隻牛犢——兩個神，而不是同一位神的兩個形像］他將一隻供在貝特耳，一隻供在丹。……親自上壇獻祭。他也如此在貝特耳<strong>向他製造的牛犢獻了祭</strong>［祭物是獻給牛犢本身的］，並在貝特耳爲他建造的高丘神壇，委派了司祭。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/3ts/12/#L26-29,32">王上 12:26-29,32</a>)</p></blockquote><h2>在巴比倫，人們把銅製品本身、也把牲畜當作神</h2><blockquote><p>“巴比倫有一個偶像名叫<strong>貝耳</strong>，每天爲這偶像耗費十二袋細麵，四十隻綿羊和六桶酒。<strong>君王也恭敬這偶像</strong>，每天都去禮拜；但是達尼爾卻崇拜自己的天主。君王曾對他說：「<strong>爲什麼你不崇拜貝爾？</strong>」達尼爾回答說：「我不敬拜人手製造的偶像，我只敬拜創造天地，主宰全人類的生活的天主。」君王對他說：「你不以爲貝耳是生活的神嗎？你不見貝耳每天吃喝那麼多嗎？」達尼爾笑著說：「大王，不要受欺騙！<strong>它裏面是泥土，外面是黃銅</strong>，決不會吃，也不會喝。」……&lt;…&gt; <strong>貝耳的司祭共有七十人</strong>，此外還有他們的妻子和兒女。……&lt;…&gt; 達尼爾命自己的僕役拿灰來，只當著君王面前，<strong>將灰撒遍整個廟宇</strong>，然後出去，將門關好，蓋上君王的御印，就走了。……&lt;…&gt; 及至開了門，君王一看見供桌，即刻大聲喊叫說：「貝耳！你是偉大的！你毫無虛假！」達尼爾笑了，並請君王留步，不要進去，說：「<strong>請看看砌石的地面上</strong>；仔細查看這些腳印是誰的腳印？」君王說：「<strong>我看是男人、女人和孩子的腳印。</strong>」於是君王大怒，令人逮捕了司祭和他們的妻子兒女，這時他們纔給君王指出他們是由暗門進來，喫盡供桌上的食物。<strong>君王遂將他們殺掉，將貝耳交由達尼爾處理</strong>；達尼爾便推翻了貝耳和他的廟宇。<strong>在那地方有一條巴比倫人所敬拜的大龍。</strong>君王對達尼爾說：「<strong>現在你卻不能說這不是生活的神了罷</strong>，那麼你就應該崇拜牠。」達尼爾回答說：「我崇拜的是上主，我的天主，因爲只有他是永生的天主；這條龍不是永生的神。大王！請給我全權！我不用刀，也不用棍，就可殺死這條龍。」君王說：「我給你全權！」<strong>達尼爾取了瀝青、脂油和頭發</strong>，攙和在一起煎熬，作成丸子送到龍口裏；<strong>龍吃下以後，就爆裂了。</strong>於是達尼爾說：「請看，你們所敬拜的神！」” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/14/#L3-28">但 14:3-28</a>) <em>(俄文本編號爲 Дан 14:3-28（思高本同編號）；此段經文不在和合本中，引文按思高本。)</em></p></blockquote><h2>偶像什麼也不能作，它自己還需要照料</h2><p>經文不斷強調：偶像什麼也不能作：</p><blockquote><p>“祭祀對偶像有什麼用處？<strong>既不能吃，又不能聞</strong>：” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/30/#L19">德 30:19</a>) <em>(俄文本爲 Сир 30:19。)</em></p></blockquote><blockquote><p>“其餘未曾被這些災所殺的人仍舊不悔改自己手所作的，<strong><mark>還是去拜鬼魔和那些不能看、不能聽、不能走，金、銀、銅、木、石的偶像</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/9/#L20">啟 9:20</a>)</p></blockquote><p>但若偶像只是形像，那就不必說它什麼也不能作了。異教徒自己會譏笑說：當然不能，這不過是形像罷了。</p><h2>沒有偶像，對偶像的事奉就無法進行</h2><blockquote><p>“以色列家啊，至於你們，主耶和華如此說：從此以後若不聽從我，<strong><mark>就任憑你們去事奉偶像</mark></strong>，<strong><mark>只是不可再因你們的供物和偶像褻瀆我的聖名</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/20/#L39">結 20:39</a>)</p></blockquote><h2>新約中論偶像</h2><p>偶像本身被視爲神：</p><blockquote><p>“有一個銀匠，名叫底米丟，<strong><mark>是製造亞底米神銀龕的</mark></strong>，他使這樣手藝人生意發達。 他聚集他們和同行的工人，說：「衆位，你們知道我們是倚靠這生意發財。 <strong><mark>這保羅不但在以弗所</mark></strong>，也幾乎在亞西亞全地，引誘迷惑許多人，說：『<strong><mark>人手所作的，不是神</mark></strong>。』這是你們所看見、所聽見的。 這樣，<strong><mark>不獨我們這事業被人藐視</mark></strong>，就是大女神亞底米的廟也要被人輕忽，<strong><mark>連亞西亞全地和普天下所敬拜的大女神之威榮也要銷滅了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L24-27">徒 19:24-27</a>)</p></blockquote><h2>真上帝不回應敬拜偶像的人</h2><blockquote><p>“所以你要告訴他們：『主耶和華如此說：以色列家的人中，<strong><mark>凡將他的假神接到心裏</mark></strong>，把陷於罪的絆腳石放在面前，又就了先知來的，<strong><mark>我耶和華在他所求的事上，必按他衆多的假神回答他</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/14/#L4">結 14:4</a>)</p></blockquote><blockquote><p>“好在以色列家的心事上捉住他們，<strong><mark>因爲他們都藉着假神與我生疏</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/14/#L5">結 14:5</a>)</p></blockquote><blockquote><p>“你們奉上供物使你們兒子經火的時候，<strong><mark>仍將一切偶像玷污自己</mark></strong>，直到今日嗎？以色列家啊，<strong><mark>我豈被你們求問嗎</mark></strong>？主耶和華說，我指著我的永生起誓，<strong><mark>我必不被你們求問</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/20/#L31">結 20:31</a>)</p></blockquote><h2>其餘</h2><blockquote><p>“發明偶像，是淫亂的開端；創造偶像，是人生的腐敗。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/14/#L12">智 14:12</a>)</p></blockquote><blockquote><p>“崇拜虛無的偶像，實是萬惡的起源、由來和結局。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/14/#L27">智 14:27</a>)</p></blockquote><blockquote><p>“因爲他們信賴無生命的偶像，自以爲妄發虛誓，不會受罰。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/14/#L29">智 14:29</a>)</p></blockquote><blockquote><p>“我出去，迎著敵人來罵陣，他就以他的偶像咒詛我。” (<a href="https://bibleox.com/zh-Hant/ru/ps/151/#L6">詩 151:6</a>, ) <em>(聖詠151不在和合本中；俄文原文無中文經文，此處自譯。)</em></p></blockquote>
