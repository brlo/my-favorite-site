  path: QT7A_洗禮
  title: 洗禮
  copy_cover: true
  body: <h2>洗禮聖奧祕的實質</h2><p><strong>洗禮</strong>（“重生”、“屬靈的誕生”）——在教會中舉行的聖奧祕，人在其中：</p><ol><li><p>洗淨罪（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38">徒 2:38</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L11">林前 6:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L16">徒 22:16</a>）；</p></li><li><p>屬靈地重生（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L44">林前 15:44</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L47-50">林前 15:47-50</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L53">林前 15:53</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L27">加 3:27</a>）；</p></li><li><p>領受救人的恩典（<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/6/#L1">林後 6:1</a>）；</p></li><li><p>加入教會（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13">林前 12:13</a>）。</p></li></ol><h3>赦罪</h3><blockquote><p>“現在你爲什麼耽延呢？<strong><mark>起來，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L16">徒 22:16</a>)</p></blockquote><blockquote><p>“你們中間也有人從前是這樣；但如今你們奉主耶穌基督的名，並藉着我們上帝的靈，<strong><mark>已經洗淨、成聖、稱義了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L11">林前 6:11</a>)</p></blockquote><blockquote><p>“彼得說：「你們各人要悔改，奉耶穌基督的名受洗，<strong><mark>叫你們的罪得赦</mark></strong>，就必領受所賜的聖靈；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38">徒 2:38</a>)</p></blockquote><h3>從水和聖靈而生</h3><blockquote><p>“耶穌回答說：「我實實在在的告訴你，<strong><mark>人若不重生</mark></strong>，就不能見上帝的國。」 &lt;…&gt; 耶穌說：「我實實在在的告訴你，人若不是<strong><mark>從水和聖靈生的</mark></strong>，就不能進上帝的國。 <strong><mark>從肉身生的就是肉身</mark></strong>；<strong><mark>從靈生的就是靈</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>)</p></blockquote><p>其餘引文見下文“<a href="https://bibleox.com/ru/ru/w/крещение#HH-Крещение-младенцев">嬰兒洗禮</a>”。</p><h3>加入基督的身體</h3><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong><mark>都從一位聖靈受洗，成了一個身體</mark></strong>，飲於一位聖靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13">林前 12:13</a>)</p></blockquote><h3>得進上帝的國的可能</h3><blockquote><p>“耶穌說：「我實實在在的告訴你，人若不是從水和聖靈生的，<strong><mark>就不能進上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L5">約 3:5</a>)</p></blockquote><h3>得救的可能</h3><blockquote><p>“<strong><mark>這水所表明的洗禮，現在藉着耶穌基督復活，也拯救你們</mark></strong>；這洗禮本不在乎除掉肉體的污穢，只求在上帝面前有無虧的良心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><blockquote><p>“他便救了我們，並不是因我們自己所行的義，乃是照他的憐憫，<strong><mark>藉着重生的洗和聖靈的更新</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L5">多 3:5</a>)</p></blockquote><h2>洗禮聖奧祕的設立</h2><blockquote><p>“耶穌進前來，對他們說：「<strong><mark>天上地下所有的權柄都賜給我了</mark></strong>。 所以，<strong><mark>你們要去，使萬民作我的門徒，奉父，子、聖靈的名給他們施洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L18-19">太 28:18-19</a>)</p></blockquote><h2>洗禮聖奧祕的材料——水</h2><p>用水施洗，在水裏施洗：</p><blockquote><p>“二人正往前走，<strong><mark>到了有水的地方</mark></strong>，太監說：「看哪，這裏有水，<strong><mark>我受洗有什麼妨礙呢</mark></strong>？」 〔有古卷在此有腓利說：「你若是一心相信，就可以。」他回答說：「我信耶穌基督是上帝的兒子。」〕 於是吩咐車站住，<strong><mark>腓利和太監二人同下水裏去</mark></strong>，<strong><mark>腓利就給他施洗</mark></strong>。 <strong><mark>從水裏上來</mark></strong>，主的靈把腓利提了去。太監也不再見他了，就歡歡喜喜的走路。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L36-39">徒 8:36-39</a>)</p></blockquote><blockquote><p>“於是彼得說：「這些人既受了聖靈，與我們一樣，<strong><mark>誰能禁止用水給他們施洗呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L47">徒 10:47</a>)</p></blockquote><h2>舊約中關於洗禮的預言</h2><blockquote><p>“<strong><mark>我必用清水灑在你們身上</mark></strong>，你們就潔淨了。我要潔淨你們，使你們脫離一切的污穢，棄掉一切的偶像。 <strong><mark>我也要賜給你們一個新心，將新靈放在你們裏面</mark></strong>。又從你們的肉體中除掉石心，賜給你們肉心。 我必將我的靈放在你們裏面，使你們順從我的律例，謹守遵行我的典章。 你們必住在我所賜給你們列祖之地。你們要作我的子民，我要作你們的上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/36/#L25-28">結 36:25-28</a>)</p></blockquote><blockquote><p>“必再憐憫我們，<strong><mark>將我們的罪孽踏在腳下，又將我們的一切罪投於深海</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mih/7/#L19">彌 7:19</a>)</p></blockquote><blockquote><p>“那日，必給大衛家和耶路撒冷的居民<strong><mark>開一個泉源，洗除罪惡與污穢</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/13/#L1">亞 13:1</a>)</p></blockquote><h2>洗禮的條件</h2><h3>信心</h3><p>需要有對上帝——父、子、聖靈——的信心（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L19">太 28:19</a>）：</p><blockquote><p>“二人正往前走，到了有水的地方，太監說：「看哪，這裏有水，<strong><mark>我受洗有什麼妨礙呢</mark></strong>？」 〔有古卷在此有腓利說：「<strong><mark>你若是一心相信，就可以</mark></strong>。」他回答說：「<strong><mark>我信耶穌基督是上帝的兒子</mark></strong>。」〕 於是吩咐車站住，腓利和太監二人同下水裏去，<strong><mark>腓利就給他施洗</mark></strong>。 從水裏上來，主的靈把腓利提了去。太監也不再見他了，就歡歡喜喜的走路。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L36-39">徒 8:36-39</a>)</p></blockquote><h3>悔改</h3><p>需要爲罪悔改：</p><blockquote><p>“彼得說：「<strong><mark>你們各人要悔改</mark></strong>，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38">徒 2:38</a>)</p></blockquote><h2>嬰兒洗禮</h2><h3>人人都必須屬靈地重生</h3><p>一切人都需要屬靈的重生，爲與上帝同享永恆的生命：</p><blockquote><p>“<strong><mark>有天上的形體，也有地上的形體</mark></strong>。但天上形體的榮光是一樣，地上形體的榮光又是一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L40">林前 15:40</a>)</p></blockquote><blockquote><p>“<strong><mark>所種的是血氣的身體，復活的是靈性的身體</mark></strong>。若有血氣的身體，也必有靈性的身體。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L44">林前 15:44</a>)</p></blockquote><blockquote><p>“<strong><mark>從肉身生的就是肉身</mark></strong>；<strong><mark>從靈生的就是靈</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L6">約 3:6</a>)</p></blockquote><p>亞當朽壞身體的繼承者不能進上帝的國：</p><blockquote><p>“<strong><mark>頭一個人是出於地</mark></strong>，乃屬土；第二個人是出於天。 那屬土的怎樣，凡屬土的也就怎樣；屬天的怎樣，凡屬天的也就怎樣。 我們既有屬土的形狀，將來也必有屬天的形狀。 弟兄們，我告訴你們說，<strong><mark>血肉之體不能承受上帝的國</mark></strong>，<strong><mark>必朽壞的不能承受不朽壞的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L47-50">林前 15:47-50</a>)</p></blockquote><p>因此，凡從亞當承受必朽性的人都要死；而在洗禮中與基督聯合的人都要復活。</p><blockquote><p>“<strong><mark>在亞當裏衆人都死了</mark></strong>；<strong><mark>照樣，在基督裏衆人也都要復活</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L22">林前 15:22</a>)</p></blockquote><blockquote><p>“豈不知<strong><mark>我們這受洗歸入基督耶穌的人，是受洗歸入他的死</mark></strong>嗎？ &lt;…&gt; 我們若在他死的形狀上與他聯合，<strong><mark>也要在他復活的形狀上與他聯合</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/6/#L3,5">羅 6:3,5</a>)</p></blockquote><p>一切必死的都須穿上不朽壞的：</p><blockquote><p>“<strong><mark>這必朽壞的總要變成不朽壞的，這必死的總要變成不死的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L53">林前 15:53</a>)</p></blockquote><p>就是說，在洗禮中穿上基督：</p><blockquote><p>“你們<strong><mark>受洗歸入基督的，都是披戴基督了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L27">加 3:27</a>)</p></blockquote><h3>人人都必須洗去原罪</h3><p>還有，一切人都從始祖繼承了罪性。就是說，<a href="https://bibleox.com/ru/ru/w/все-люди-грешны">嬰兒也有</a>：</p><blockquote><p>“<strong><mark>誰能使潔淨之物出於污穢之中呢</mark></strong>？無論誰也不能！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/14/#L4">伯 14:4</a>)</p></blockquote><blockquote><p>“<strong><mark>我是在罪孽裏生的</mark></strong>，在我母親懷胎的時候就有了罪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/51/#L5">詩 51:5</a>)</p></blockquote><blockquote><p>“這就如<strong><mark>罪是從一人入了世界</mark></strong>，死又是從罪來的，於是<strong><mark>死就臨到衆人</mark></strong>，因爲衆人都犯了罪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L12">羅 5:12</a>)</p></blockquote><blockquote><p>“<strong><mark>因一人的悖逆，衆人成爲罪人</mark></strong>；照樣，<strong><mark>因一人的順從，衆人也成爲義了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L19">羅 5:19</a>)</p></blockquote><blockquote><p>“故此，<strong><mark>我所願意的善，我反不作</mark></strong>；我所不願意的惡，我倒去作。 若我去作所不願意作的，就不是我作的，<strong><mark>乃是住在我裏頭的罪作的</mark></strong>。 我覺得有個律，就是我願意爲善的時候，便有惡與我同在。 因爲按著我裏面的意思，我是喜歡上帝的律； <strong><mark>但我覺得肢體中另有個律和我心中的律交戰</mark></strong>，把我擄去，叫我附從那肢體中犯罪的律。 我真是苦啊！<strong><mark>誰能救我脫離這取死的身體呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L19-24">羅 7:19-24</a>)</p></blockquote><blockquote><p>“我們原曉得律法是屬乎靈的，<strong><mark>但我是屬乎肉體的，是已經賣給罪了</mark></strong>。 &lt;…&gt; 因爲按著我裏面的意思，我是喜歡上帝的律； 但我覺得肢體中另有個律和我心中的律交戰，<strong><mark>把我擄去，叫我附從那肢體中犯罪的律</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L14,22-23">羅 7:14,22-23</a>)</p></blockquote><blockquote><p>“我們從前也都在他們中間，放縱肉體的私慾，隨著肉體和心中所喜好的去行，<strong><mark>本爲可怒之子</mark></strong>，和別人一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L3">弗 2:3</a>)</p></blockquote><h3>使徒給整個家庭（全家）施洗</h3><blockquote><p>“<strong><mark>我也給司提反家施過洗</mark></strong>，此外給別人施洗沒有，我卻記不清。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L16">林前 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>她和她一家既領了洗</mark></strong>，便求我們說：「你們若以爲我是真信主的，請到我家裏來住。」於是強留我們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/16/#L15">徒 16:15</a>)</p></blockquote><blockquote><p>“又領他們出來，說：「二位先生，我當怎樣行纔可以得救？」 他們說：「<strong><mark>當信主耶穌，你和你一家都必得救</mark></strong>。」 他們就把主的道講給他和他全家的人聽。 當夜，就在那時候，禁卒把他們帶去，洗他們的傷；<strong><mark>他和屬乎他的人立時都受了洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/16/#L30-33">徒 16:30-33</a>)</p></blockquote><p>使徒呼召一切人受洗，說應許不但屬於他們（成人），也屬於他們的兒女：</p><blockquote><p>“彼得說：「<strong><mark>你們各人要悔改</mark></strong>，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈； 因爲<strong><mark>這應許是給你們和你們的兒女</mark></strong>，並一切在遠方的人，就是主我們上帝所召來的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38-39">徒 2:38-39</a>)</p></blockquote><p>這裏字面地說的正是嬰兒。必須深入上下文，弄清這裏所說的<strong>應許</strong>（應許之事）是什麼。這一章講的是五旬節那天聖靈降在教會聚會上。解釋這事件時，使徒彼得指著藉先知約珥所賜的應許：</p><blockquote><p>“<strong><mark>他們就都被聖靈充滿</mark></strong>，按著聖靈所賜的口才說起別國的話來。 &lt;…&gt; <strong><mark>彼得和十一個使徒站起</mark></strong>，高聲說：「猶太人和一切住在耶路撒冷的人哪，這件事你們當知道，也當側耳聽我的話。 你們想這些人是醉了？其實不是醉了，因爲時候剛到巳初。 <strong><mark>這正是先知約珥所說的</mark></strong>： 『上帝說：在末後的日子，<strong><mark>我要將我的靈澆灌凡有血氣的</mark></strong>。你們的兒女要說預言；你們的少年人要見異象；老年人要作異夢。 &lt;…&gt; <strong><mark>衆人聽見這話，覺得扎心</mark></strong>，就對彼得和其餘的使徒說：「弟兄們，我們當怎樣行？」 彼得說：「<strong><mark>你們各人要悔改</mark></strong>，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈； 因爲<strong><mark>這應許是給你們和你們的兒女</mark></strong>，並一切在遠方的人，就是主我們上帝所召來的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L4,14-17,37-39">徒 2:4,14-17,37-39</a>)</p></blockquote><p>這樣，使徒彼得引用的是先知約珥。我們就到先知約珥自己那裏看這一應許：</p><blockquote><p>“<strong><mark>你們要在錫安吹角</mark></strong>，在我聖山吹出大聲。國中的居民都要發顫；因爲耶和華的日子將到，已經臨近。 &lt;…&gt; 你們要在錫安吹角，<strong><mark>分定禁食的日子，宣告嚴肅會</mark></strong>。 <strong><mark>聚集衆民</mark></strong>，使會衆自潔；招聚老者，<strong><mark>聚集孩童和吃奶的</mark></strong>；使新郎出離洞房，新婦出離內室。 事奉耶和華的祭司，要在廊子和祭壇中間哭泣說：「耶和華啊，求你顧惜你的百姓，不要使你的產業受羞辱，列邦管轄他們。爲何容列國的人說：『他們的上帝在那裏呢。』」 <strong><mark>耶和華就爲自己的地發熱心</mark></strong>，憐恤他的百姓。 &lt;…&gt; 以後，<strong><mark>我要將我的靈澆灌凡有血氣的</mark></strong>。你們的兒女要說預言，你們的老年人要作異夢，少年人要見異象。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iol/2/#L1,15-18,28">珥 2:1,15-18,28</a>)</p></blockquote><p>這就是那應許。全民族——從老人到吃奶的嬰孩——都被召參加這嚴肅的聚會。上帝應許把聖靈澆灌在聚集的全民族身上，如經所記：澆灌凡有血氣的。這樣，當使徒說應許不但屬於聽的人、也屬於他們的兒女和一切遠方的人時，按上下文，他所說的兒女，字面地指的就是嬰孩。</p><h3>上帝的恩典按他人的信心運作</h3><p>嬰兒受洗的時刻，可以有代父母信心的運作。聖經裏有許多情形：上帝的恩典因別人的信心而在一些人身上運作。</p><h4>救主因父母的信心醫治兒女</h4><p>上帝按父母的信心在兒女身上行事：</p><ul><li><p>要求的是父親的信心，而從鬼附中得醫治的是兒子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L17-24">可 9:17-24</a>）；</p></li><li><p>要求的是父親的信心，復活的是睚魯被醫治的女兒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/8/#L41-42,49-55">路 8:41-42,49-55</a>）；</p></li><li><p>相信的是母親，從鬼附中得醫治的是迦南婦人的女兒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/15/#L22-28">太 15:22-28</a>）；</p></li><li><p>相信的是父親，得醫治的是大臣的兒子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/4/#L46-50">約 4:46-50</a>）。</p></li></ul><h4>因親人信心而醫治（恩典運作）的情形</h4><ul><li><p>相信的是百夫長，得醫治的是他的僕人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L10,13">太 8:10,13</a>）</p></li><li><p>相信的是朋友們，得醫治的是癱瘓的同伴（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/2/#L5">可 2:5</a>）。這裏重要的是：因別人的信心，這人的<strong>罪也得了赦免</strong>。</p></li></ul><p>詳見<a href="https://bibleox.com/ru/ru/w/действие-Бога-по-вере-родителей-и-друзей">上帝按父母和朋友的信心行事</a></p><h3>把未來的兒子獻給上帝的許願</h3><p>父母獻給上帝的，不只是已出生的嬰兒（在第八天），甚至還有隻是向上帝求來的。先知撒母耳就是這樣出生的：</p><blockquote><p>“許願說：「萬軍之耶和華啊，你若垂顧婢女的苦情，眷念不忘婢女，賜我一個兒子，<strong><mark>我必使他終身歸與耶和華</mark></strong>，不用剃頭刀剃他的頭。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/1/#L11">撒上 1:11</a>)</p></blockquote><h2>洗禮的舊約預表</h2><h3>割禮</h3><p>舊約的割禮是新約洗禮的預表：</p><blockquote><p>“<strong><mark>你們在他裏面，也受了不是人手所行的割禮</mark></strong>，乃是基督使你們脫去肉體情慾的割禮。 <strong><mark>你們既受洗與他一同埋葬</mark></strong>，也就在此與他一同復活，都因信那叫他從死裏復活上帝的功用。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L11-12">西 2:11-12</a>)</p></blockquote><p>舊約割禮的設立——它是進入與上帝所立之約的入口，嬰孩從八天起進入：</p><blockquote><p>“你們所有的男子都要受割禮，這就是我與你，並你的後裔所立的約，是你們所當遵守的。 你們都要受割禮，<strong><mark>這是我與你們立約的證據</mark></strong>。 你們世世代代的男子，無論是家裏生的，是在你後裔之外用銀子從外人買的，<strong><mark>生下來第八日，都要受割禮</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L10-12">創 17:10-12</a>)</p></blockquote><h3>走海牀脫離奴役</h3><p>猶太人走紅海海牀脫離埃及的奴役，是新約洗禮的預表。全民族脫離奴役，全民族——包括嬰兒——都在雲裏、海里受洗歸了摩西：</p><blockquote><p>“弟兄們，我不願意你們不曉得，<strong><mark>我們的祖宗從前都在雲下，都從海中經過</mark></strong>， <strong><mark>都在雲裏、海里受洗歸了摩西</mark></strong>， 並且<strong><mark>都喫了一樣的靈食</mark></strong>． 也都喝了一樣的靈水；<strong><mark>所喝的，是出於隨著他們的靈磐石</mark></strong>，那磐石就是基督。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L1-4">林前 10:1-4</a>)</p></blockquote><p>這些預像有直接的意義：</p><blockquote><p>“<strong><mark>他們遭遇這些事都要作爲鑑戒</mark></strong>，並且寫在經上，正是警戒我們這末世的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L11">林前 10:11</a>)</p></blockquote><h2>血的洗禮</h2><p>血的洗禮——爲基督殉道的死。這裏指的不是聖戰或神風式的行爲。殉道者想活下去，不威脅任何人的生命；只是因爲他對基督的信仰，人奪去他的生命。這樣的人不經水的洗禮，不但達到得救，還在天上與基督同享特別的榮耀。</p><h3>基督把將臨的苦難和死稱爲洗禮</h3><blockquote><p>“耶穌回答說：「你們不知道所求的是什麼。<strong><mark>我將要喝的杯，你們能喝嗎</mark></strong>？」他們說：「我們能。」 耶穌說：「<strong><mark>我所喝的杯，你們必要喝</mark></strong>；只是坐在我的左右，不是我可以賜的，乃是我父爲誰預備的，就賜給誰。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/20/#L22-23">太 20:22-23</a>)</p></blockquote><h3>爲基督被殺的人在天堂得著白衣</h3><blockquote><p>“揭開第五印的時候，我看見在祭壇底下，<strong><mark>有爲上帝的道併爲作見證被殺之人的靈魂</mark></strong>， 大聲喊著說：「聖潔真實的主啊！你不審判住在地上的人，給我們伸流血的冤，要等到幾時呢？」 <strong><mark>於是有白衣賜給他們各人</mark></strong>，又有話對他們說：「還要安息片時，等著一同作僕人的和他們的弟兄，也像他們被殺，滿足了數目。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>)</p></blockquote><p>*在希臘文裏，殉道者稱爲 μάρτῠρος（見證人）。殉道者以自己的行爲見證對基督和復活的堅定信仰，這常常成爲別人接受基督信仰的契機。*</p><h3>基督論殉道者和逼迫</h3><blockquote><p>“<strong><mark>凡在人面前認我的</mark></strong>，我在我天上的父面前也必認他； <strong><mark>凡在人面前不認我的</mark></strong>，我在我天上的父面前也必不認他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L32-33">太 10:32-33</a>)</p></blockquote><blockquote><p>“我又告訴你們，<strong><mark>凡在人面前認我的</mark></strong>，人子在上帝的使者面前也必認他；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L8">路 12:8</a>)</p></blockquote><blockquote><p>“<strong><mark>爲義受逼迫的人有福了</mark></strong>，因爲天國是他們的。 <strong><mark>人若因我辱罵你們，逼迫你們，捏造各樣壞話毀謗你們</mark></strong>，你們就有福了。 應當歡喜快樂，因爲<strong><mark>你們在天上的賞賜是大的</mark></strong>。在你們以前的先知，人也是這樣逼迫他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L10-12">太 5:10-12</a>)</p></blockquote><h2>受洗之後信徒仍會犯罪，必須與裏面的罪爭戰</h2><blockquote><p>“因爲我們得知真道以後，<strong><mark>若故意犯罪</mark></strong>，<strong><mark>贖罪的祭就再沒有了</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L26">希 10:26</a>)</p></blockquote><blockquote><p>“<strong><mark>我們若說自己無罪，便是自欺</mark></strong>，真理不在我們心裏了； 我們若認自己的罪，上帝是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/1/#L8-9">約壹 1:8-9</a>)</p></blockquote><blockquote><p>“我小子們哪，我將這些話寫給你們，<strong><mark>是要叫你們不犯罪</mark></strong>。若有人犯罪，在父那裏我們有一位中保，就是那義者耶穌基督。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L1">約壹 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>你們中間的爭戰、鬥毆，是從那裏來的呢</mark></strong>？不是從你們百體中戰鬥之私慾來的嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L1">雅 4:1</a>)</p></blockquote><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名用油抹他，爲他禱告。 <strong><mark>出於信心的祈禱要救那病人</mark></strong>，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你們要彼此認罪，<strong><mark>互相代求，使你們可以得醫治</mark></strong>。義人祈禱所發的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>你們要醒悟爲善，不要犯罪</mark></strong>，因爲<strong><mark>有人不認識上帝</mark></strong>。我說這話是要叫你們羞愧。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L33-34">林前 15:33-34</a>)</p></blockquote><blockquote><p>“並要以恩慈相待，存憐憫的心，<strong><mark>彼此饒恕</mark></strong>，正如上帝在基督裏饒恕了你們一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L32">弗 4:32</a>)</p></blockquote><p>最後，主耶穌基督賜給門徒一篇祈禱，在其中教導求赦免罪。這不是一生只念一次的祈禱。門徒求基督教導他們祈禱，基督就賜給他們這個範本：</p><blockquote><p>“耶穌在一個地方禱告。禱告完了，有個門徒對他說：「求主教導我們禱告，像約翰教導他的門徒。」 耶穌說：「<strong><mark>你們禱告的時候，要說</mark></strong>：我們在天上的父〔有古卷只作『父阿』〕：願人都尊你的名爲聖。願你的國降臨，願你的旨意行在地上，如同行在天上〔有古卷沒有『願你的旨意云云』〕。 我們日用的飲食，天天賜給我們。 <strong><mark>赦免我們的罪</mark></strong>，因爲我們也赦免凡虧欠我們的人。不叫我們遇見試探；救我們脫離兇惡〔有古卷無末句〕。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L1-4">路 11:1-4</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L7-13">太 6:7-13</a>)</p></blockquote><h2>對異議的回應</h2><h3>在關於從水和聖靈而生的話裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L5">約 3:5</a>），水是指聖靈嗎？</h3><p>新教徒把救主關於得救必須從水和聖靈而生的話作寓意解釋，說水指的是聖靈。他們把接下去的兩節聯繫起來：</p><blockquote><p>“耶穌說：「我實實在在的告訴你，人若不是<strong><mark>從水和聖靈生的</mark></strong>，就不能進上帝的國。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L5">約 3:5</a>)</p></blockquote><blockquote><p>“信我的人，就如經上所說，<strong><mark>從他腹中要流出活水的江河來</mark></strong>。」 <strong><mark>耶穌這話是指著信他之人要受聖靈說的</mark></strong>；那時還沒有賜下聖靈來，因爲耶穌尚未得著榮耀。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L38-39">約 7:38-39</a>)</p></blockquote><p>但如果把水理解爲聖靈，那就成了同義反復（同一事物多餘的重複）。那樣基督說的就是：要從聖靈和聖靈生。如果在這段話裏直接說聖靈是合適的，那爲什麼還要用寓意呢？而且即使按寓意，也得說“從水的聖靈”或“從水<strong>或</strong>聖靈”（這纔等值），而按經文，卻是要從聖靈<strong>和</strong>別的什麼生——也就是從水。</p><p>此外，我們很好知道——包括從聖經——使徒們是真實地在水裏施行重生的。就是說，洗禮中的水從來都是真實的，而“從腹中流出江河”（字面地）卻從來沒有人流過。</p><p>所以，既然使徒們是在水裏施洗、洗禮是由聖靈成就的，我們就把救主關於從水和聖靈而生的話理解爲使徒們所行的那樣：從水和聖靈——這一理解客觀地繫於使徒在水裏施洗的實踐。古代的教會從不把洗禮與水分開、理解爲純然頭腦中的東西，而是理解爲奉父、子、聖靈之名在祝聖的水中三次浸沒。</p><h3>“受洗必須悔改，可嬰兒不能悔改，所以也不能受洗？”</h3><p>一些與教會分離的團體指責教會允許嬰兒受洗。他們引用使徒勸勉聽的人先悔改、後受洗的經文：</p><blockquote><p>“彼得說：「<strong><mark>你們各人要悔改</mark></strong>，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈； 因爲<strong><mark>這應許是給你們和你們的兒女</mark></strong>，並一切在遠方的人，就是主我們上帝所召來的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38-39">徒 2:38-39</a>)</p></blockquote><p>悔改的要求是對成人的；嬰兒沒有個人的罪，因此難以把悔改的要求加在他們身上。就是說，嬰兒需要受洗，但因爲他們沒有個人的罪，也就不必爲他們所沒有的東西悔改。</p><p>總的來說，這指責聽起來很奇怪。由它得出的是：嬰兒爲了穿上基督（受洗——<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L27">加 3:27</a>），必須先犯罪；而他們還沒有犯罪，就不能悔改，那麼也就永遠不能受洗。這成了某種荒謬：爲獲得與基督聯合的可能，必須先得罪基督。當然，這是大錯。受洗是人人需要的，悔改只是犯了罪的人需要的。</p><p>先知約翰的悔改的洗禮雖然不同於基督裏的洗禮（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L4">徒 19:4</a>），但可以檢驗這些推理是否正確。先知約翰施悔改的洗，但當基督來到他那裏時，他沒有悔改就立刻下到水裏。基督沒有罪，因此他沒有悔改就受了悔改的洗。嬰兒也是這樣。基督不需要先獲得罪，才能獲得受悔改之洗的可能。嬰兒也是這樣。受洗是人人被召的，悔改的只是有可悔之事的人。</p><h3>“受洗需要信心，可嬰兒不能宣認信仰，所以也不能受洗？”</h3><p>與教會分離的團體還引用另一節經文，其中主說要信而受洗：</p><blockquote><p>“<strong><mark>信而受洗的，必然得救</mark></strong>；<strong><mark>不信的，必被定罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L16">可 16:16</a>)</p></blockquote><p>這樣，得救的必要條件之一是獲得<strong>信心</strong>、領受<strong>洗禮</strong>。不履行這些條件，人不能得救。然而，難以把信心的要求加在嬰兒身上；所以他們按代父母的信心受洗——對此也有聖經的依據（詳見<a href="https://bibleox.com/ru/ru/w/крещение#HH-Действие-благодати-Божьей-по-вере-других-людей">上帝的恩典按他人的信心運作</a>）。</p><p>還要特別注意接下去的話：不信的必被定罪。那麼是不是說嬰兒也要被定罪，因爲他們不能信呢？</p><blockquote><p>“信而受洗的，必然得救；<strong><mark>不信的，必被定罪</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L16">可 16:16</a>)</p></blockquote><p>問題在於：這一節裏信心的要求只對成人。而洗禮本身，如救主在別處所說（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>），是人人需要的，包括嬰兒。嬰兒將帶著洗禮中所穿的基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L27">加 3:27</a>）長大——按代父母的信心（詳見<a href="https://bibleox.com/ru/ru/w/крещение#HH-Действие-благодати-Божьей-по-вере-других-людей">上帝的恩典按他人的信心運作</a>）。隨著嬰兒能力的增長，代父母使他在信心裏堅固。如果不幸發生，嬰兒因悲慘的情形死去，那麼，作爲受過洗的，他達到天國、與基督同享永生。</p><p>至於救主話語的次序（信而受洗），也有相反的次序：</p><blockquote><p>“照這話，約翰來了，在曠野施洗，<strong><mark>傳悔改的洗禮</mark></strong>，使罪得赦。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L4">可 1:4</a>)</p></blockquote><p>那麼就請他們也承認這裏是先施行悔改的洗、然後纔有宣講。</p><h3>“可是基督只在三十歲受洗？”</h3><p>先知施洗約翰的洗禮不是基督裏的洗禮。已經受過約翰之洗的人，使徒保羅重新給他們施基督的洗：</p><blockquote><p>“問他們說：「你們信的時候，受了聖靈沒有？」他們回答說：「沒有，也未曾聽見有聖靈賜下來。」 保羅說：「這樣，<strong><mark>你們受的是什麼洗呢</mark></strong>？」他們說：「<strong><mark>是約翰的洗</mark></strong>。」 保羅說：「<strong><mark>約翰所行的是悔改的洗</mark></strong>，告訴百姓當信那在他以後要來的，就是耶穌。」 <strong><mark>他們聽見這話，就奉主耶穌的名受洗</mark></strong>。 <strong><mark>保羅按手在他們頭上，聖靈便降在他們身上</mark></strong>，他們就說方言，又說預言。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L2-6">徒 19:2-6</a>)</p></blockquote><p>此外，從那些在這事上不效法基督的人——不在三十歲受洗、雖然不在嬰兒期、但也不等到三十歲而是在八到十二歲給自己的孩子施洗——聽到這樣的指責，是很奇怪的。如果教會的指控者認爲受洗的年齡應當效法基督（他受約翰的洗），那麼要領洗，他看來也得等到三十歲。然而這不對，因爲先知約翰悔改的洗不是基督裏的洗（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L2-6">徒 19:2-6</a>）。基督等候三十歲不是爲了受洗，而是爲了出來任職事奉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/4/#L3">民 4:3</a>）、出來宣講、顯明自己的榮耀。他的宣講以先知約翰的見證開始——約翰指著來到他那裏受洗的耶穌，指明他就是基督。約翰是先知。他什麼時候指明救主來臨之預言的應驗？什麼時候指著救主？當救主預備好出來任職的時候——三十歲（<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/4/#L3">民 4:3</a>）。</p><h3>“可是那悔改的強盜沒來得及受洗，卻得救了？”</h3><p>那是在主還沒有設立洗禮聖奧祕的時候。信了並悔改的強盜，不經水的洗禮得了救——如同舊約的義人在新約教會建立之前的得救；這教會要在基督被釘之後52天（2+40+10）纔出現。</p><p><strong>洗禮——從水和聖靈而生</strong></p><blockquote><p>“耶穌說：「我實實在在的告訴你，<strong><mark>人若不是從水和聖靈生的</mark></strong>，<strong><mark>就不能進上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L5">約 3:5</a>)</p></blockquote><p><strong>基督將用聖靈施洗</strong></p><blockquote><p>“約翰說：「我是用水給你們施洗，但有一位能力比我更大的要來，我就是給他解鞋帶也不配。<strong><mark>他要用聖靈與火給你們施洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L16">路 3:16</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L11">太 3:11</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L8">可 1:8</a>)</p></blockquote><p><strong>基督不去，聖靈不來</strong></p><blockquote><p>“然而我將真情告訴你們：我去是與你們有益的。<strong><mark>我若不去，保惠師就不到你們這裏來</mark></strong>；我若去，就差他來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L7">約 16:7</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L26">約 14:26</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L38-39">約 7:38-39</a>)</p></blockquote><blockquote><p>“但我要<strong><mark>從父那裏差保惠師來</mark></strong>，就是從父出來真理的聖靈，他來了，<strong><mark>就要爲我作見證</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L26">約 15:26</a>)</p></blockquote><blockquote><p>“我要將我父所應許的降在你們身上，<strong><mark>你們要在城裏等候，直到你們領受從上頭來的能力</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L49">路 24:49</a>)</p></blockquote><p><strong>基督復活之後還未升到父那裏去</strong></p><blockquote><p>“耶穌說：「不要摸我，因<strong><mark>我還沒有升上去見我的父</mark></strong>。你往我弟兄那裏去，告訴他們說，我要升上去見我的父，也是你們的父；見我的上帝，也是你們的上帝。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L17">約 20:17</a>)</p></blockquote><p><strong>所應許的聖靈的洗禮，在基督復活50天后首次成就</strong></p><blockquote><p>“提阿非羅啊，我已經作了前書，論到耶穌開頭一切所行所教訓的， 直到他藉着聖靈吩咐所揀選的使徒，以後被接上升的日子爲止。 他受害之後，用許多的憑據將自己活活的顯給使徒看，<strong><mark>四十天之久向他們顯現</mark></strong>，講說上帝國的事。 耶穌和他們聚集的時候，囑咐他們說：「不要離開耶路撒冷，要等候父所應許的，就是你們聽見我說過的。 <strong><mark>約翰是用水施洗</mark></strong>，但不多幾日，<strong><mark>你們要受聖靈的洗</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L1-5">徒 1:1-5</a>)</p></blockquote><blockquote><p>“提阿非羅啊，我已經作了前書，論到耶穌開頭一切所行所教訓的， 直到他藉着聖靈吩咐所揀選的使徒，以後被接上升的日子爲止。 他受害之後，用許多的憑據將自己活活的顯給使徒看，<strong><mark>四十天之久向他們顯現</mark></strong>，講說上帝國的事。 耶穌和他們聚集的時候，囑咐他們說：「不要離開耶路撒冷，要等候父所應許的，就是你們聽見我說過的。 <strong><mark>約翰是用水施洗</mark></strong>，但不多幾日，<strong><mark>你們要受聖靈的洗</mark></strong>。」 &lt;…&gt; <strong><mark>但聖靈降臨在你們身上，你們就必得著能力</mark></strong>；並要在耶路撒冷、猶太全地和撒瑪利亞，直到地極，作我的見證。」 說了這話，他們正看的時候，他就被取上升，<strong><mark>有一朵雲彩把他接去</mark></strong>，便看不見他了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L1-5,8-9">徒 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>五旬節到了</mark></strong>，門徒都聚集在一處。 &lt;…&gt; <strong><mark>又有舌頭如火焰顯現出來，分開落在他們各人頭上</mark></strong>。 <strong><mark>他們就都被聖靈充滿</mark></strong>，按著聖靈所賜的口才說起別國的話來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L1,3-4">徒 2:1,3-4</a>)</p></blockquote><p>不過，在基督復活的當天也講到差遣聖靈，但沒有講到洗禮。這是司祭等次的設立，同時賜下赦罪和不赦罪的權柄：</p><blockquote><p>“七日的第一日清早，天還黑的時候，抹大拉的馬利亞來到墳墓那裏，看見石頭從墳墓挪開了， &lt;…&gt; 那日（就是七日的第一日）晚上，門徒所在的地方，因怕猶太人，門都關了。<strong><mark>耶穌來站在當中</mark></strong>，對他們說：「願你們平安！」 &lt;…&gt; 說了這話，<strong><mark>就向他們吹一口氣，說</mark></strong>：「你們受聖靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L1,19,22">約 20:1,19,22</a>)</p></blockquote><h3>“不要禁止小孩子到基督這裏來”</h3><p>與教會分離的團體指責教會：教會關於不經洗禮不能得救的教訓（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>）彷彿妨礙嬰兒得救。教會彷彿不讓嬰兒到基督那裏去。他們引用下面這節經文：</p><blockquote><p>“<strong><mark>有人抱著自己的嬰孩來見耶穌</mark></strong>，要他摸他們；門徒看見就責備那些人。 耶穌卻叫他們來，說：「<strong><mark>讓小孩子到我這裏來，不要禁止他們</mark></strong>，因爲在上帝國的正是這樣的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L15-16">路 18:15-16</a>)</p></blockquote><p>實際上，這節經文所責備的，恰恰是嬰兒洗禮的反對者。</p><p>聖經的這一情形裏字面地發生了什麼？</p><ol><li><p><strong>母親們把嬰孩帶到基督那裏</strong>，求主祝福他們；</p></li><li><p><strong>門徒攔在路上</strong>，禁止他們把嬰孩帶到基督那裏；</p></li><li><p><strong>主爲母親們開了路</strong>，指示門徒不要攔阻把嬰孩帶到他那裏，並祝福了嬰孩（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L16">可 10:16</a>）。</p></li></ol><p>教會的反對者在做什麼？</p><ol><li><p>母親們願意讓嬰孩從出生就歸向基督（這是我們親自從脫離教派的母親們那裏知道的）；</p></li><li><p>教會的反對者攔在母親們的路上，字面地禁止她們給孩子施洗——聖經稱洗禮爲穿上基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L27">加 3:27</a>）。</p></li></ol><p>教會在做什麼？</p><ol><li><p>召母親們帶著自己的嬰孩到基督那裏；</p></li><li><p>當母親們把嬰孩帶來時，教會藉洗禮、聖餐禮和聖物使嬰孩歸向基督，賜給他們祝福。</p></li></ol><p>教會的反對者把一切顛倒了。教會召母親們和嬰孩到基督那裏，他們說這是與基督聯合的障礙；而他們禁止母親們給孩子施洗，倒說是“不阻礙”孩子到基督那裏去。</p><p>教會的教訓絲毫不妨礙基督拯救嬰孩——如果嬰孩不經洗禮就能得救的話。而教派禁止給嬰兒施洗，倒是非常妨礙嬰孩的得救——考慮到基督說過，不經洗禮沒有人能進上帝的國（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>）。</p><h3>“罪的赦免發生在獲得信心的時候，而不是浸在水裏？”</h3><p>許多新教徒稱水的洗禮只是見證（某種記號），而人的重生和罪的赦免——他們認爲——發生得更早：只要人信了、爲自己的罪向上帝認罪就發生了。然而，我們在聖經裏看到：正是在水的洗禮中人重生、罪被洗淨，正是它對人是救人的。</p><p>掃羅（未來的使徒保羅）被基督弄瞎了眼，並且立刻<strong>信了</strong>他；但這沒有使他的罪得赦。掃羅被打發到大馬士革去，爲要藉領受水的洗禮洗去他的罪：</p><blockquote><p>“我回答說：『<strong><mark>主啊，你是誰</mark></strong>？』他說：『我就是你所逼迫的拿撒勒人耶穌。』 &lt;…&gt; 我說：『<strong><mark>主啊，我當作什麼</mark></strong>？』主說：『起來！進大馬色去，在那裏，要將所派你作的一切事告訴你。』 我因那光的榮耀不能看見，同行的人就拉著我手進了大馬色。 那裏有一個人，名叫亞拿尼亞，按著律法是虔誠人，爲一切住在那裏的猶太人所稱讚。 他來見我，站在旁邊對我說：『<strong><mark>兄弟掃羅，你可以看見</mark></strong>。』我當時往上一看，就看見了他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L8,10-13">徒 22:8,10-13</a>)</p></blockquote><p>信了的掃羅需要藉洗禮洗去罪：</p><blockquote><p>“現在你爲什麼耽延呢？<strong><mark>起來，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L16">徒 22:16</a>)</p></blockquote><p>另一處直接說，洗禮救人（而不是見證）：</p><blockquote><p>“<strong><mark>這水所表明的洗禮，現在藉着耶穌基督復活，也拯救你們</mark></strong>；這洗禮本不在乎除掉肉體的污穢，只求在上帝面前有無虧的良心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><blockquote><p>“他便救了我們，並不是因我們自己所行的義，乃是照他的憐憫，<strong><mark>藉着重生的洗和聖靈的更新</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L5">多 3:5</a>)</p></blockquote><h3>“人是因傳講基督的道而屬靈地重生？”</h3><p>否認上帝在聖奧祕中運作的新教徒，也否認人在洗禮的水中屬靈地重生。否認這一點，他們教導人說，“從水和聖靈”的生（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5">約 3:3,5</a>）彷彿只在宣講的時刻發生，其餘的一切——隆重的象徵性活動。爲論證這一觀念，他們引用這些經文：</p><blockquote><p>“<strong><mark>他按自己的旨意，用真道生了我們</mark></strong>，叫我們在他所造的萬物中，好像初熟的果子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L18">雅 1:18</a>)</p></blockquote><blockquote><p>“<strong><mark>你們蒙了重生</mark></strong>，不是由於能壞的種子，<strong><mark>乃是由於不能壞的種子，是藉着上帝活潑常存的道</mark></strong>。 因爲：『凡有血氣的，盡都如草，他的美榮都像草上的花。草必枯乾，花必凋謝； 惟有主的道是永存的。』<strong><mark>所傳給你們的福音就是這道</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L23-25">彼前 1:23-25</a>)</p></blockquote><p>教會宣講福音有上帝的協助，他在聽道人的靈魂上動工。這宣講可以在人裏面產生轉變，呼召他悔改、指引他生命的道路。上帝的道是喚醒人脫離罪的沉睡、在人裏面激起悔改、生髮信心的手段。然而，這宣講還沒有潔淨人的罪，還不是在重生的水洗中（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L25-26">弗 5:25-26</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L5">多 3:5</a>）從水和聖靈而生（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5">約 3:3,5</a>）。</p><p>在別處清楚地說：爲使罪得赦，必須領受在水中舉行的洗禮聖奧祕：</p><blockquote><p>“現在你爲什麼耽延呢？<strong><mark>起來，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L16">徒 22:16</a>)</p></blockquote><p>沒有信心和悔改的人不被允許受洗。所以首先他必須聽上帝的道，然後由聽道而來的信心（<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/10/#L17">羅 10:17</a>），然後纔是從水和聖靈而生、罪的洗淨、以及在洗禮和聖膏中受聖靈的印記。</p><p>使徒先宣講上帝的道；當聽衆<strong>覺得扎心</strong>時，他就呼召他們受洗使罪得赦：</p><blockquote><p>“<strong><mark>衆人聽見這話，覺得扎心</mark></strong>，就對彼得和其餘的使徒說：「弟兄們，<strong><mark>我們當怎樣行</mark></strong>？」 彼得說：「<strong><mark>你們各人要悔改</mark></strong>，<strong><mark>奉耶穌基督的名受洗</mark></strong>，<strong><mark>叫你們的罪得赦</mark></strong>，就必領受所賜的聖靈；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L37-38">徒 2:37-38</a>)</p></blockquote><h3>“洗禮不在乎除掉肉體的污穢，只求……”</h3><blockquote><p>“<strong><mark>這水所表明的洗禮</mark></strong>，現在藉着耶穌基督復活，也拯救你們；這洗禮本不在乎除掉肉體的污穢，<strong><mark>只求在上帝面前有無虧的良心</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><p>這一處在俄文裏譯得不正確。差別是根本性的：在“許諾”裏沒有任何聖奧祕，不從上帝領受什麼；相反，是人向他許諾。而當人向上帝祈求時，從上帝那邊期待的是行動（聖奧祕）：藉著罪的赦免（從上帝那邊）獲得無虧的、清潔的良心（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L14">希 9:14</a>），不被先前的罪所累。而如果浸入水裏時如新教徒所想的那樣什麼也不舉行，那還向上帝求什麼呢——如果他在這裏什麼也不賜。</p><p>使徒彼得的書信是用希臘文寫的。聖兄弟基里爾和梅福季——通曉斯拉夫語的希臘人——把 ἐπερώτημα 譯作“祈求”（вопрошание），而不是“許諾”：向上帝祈求無虧的良心。</p><p>同樣，古代基督徒之一——希臘人、教會的主教神學家格列高利（四世紀）——寫道，這裏說的是上帝的作爲：按祈求賜給人無虧的良心（[俄文](https://azbyka.ru/otechnik/Grigorij_Bogoslov/slova-izd-2007-g/40)《講道集》第40篇·論聖洗禮）。</p><p>而且，總的來說，在新約文本中這個詞一次也沒有被譯作“許諾”，總是譯作“祈求、問”。</p><ul><li><p>ἐπερωτῆσαι——問（太 22:46）</p></li><li><p>ἐπερωτῶσιν——問（可 7:5）</p></li><li><p>ἐπερωτῆσαι——問（可 9:32）</p></li><li><p>Ἐπερωτήσω——我要問（可 11:29）</p></li><li><p>ἐπερωτῆσαι——問（可 12:34）</p></li><li><p>ἐπερωτῶντα——問的（路 2:46）</p></li><li><p>Ἐπερωτῶ——我要問（路 6:9）</p></li><li><p>Ἐπερωτηθεὶς——被問（路 17:20）</p></li><li><p>ἐπερωτᾶν——問（路 20:40）</p></li><li><p>ἐπερωτήσατε——你們問（約 9:23）</p></li><li><p>ἐπερωτήσας——問了（徒 23:34）</p></li><li><p>ἐπερωτῶσιν——問過的（羅 10:20）</p></li><li><p>ἐπερωτάτωσαν——問（林前 14:35）</p></li><li><p>ἐπερώτημα——祈求（教會斯拉夫語譯法）（彼前 3:21）</p></li></ul><p>就是說，不是人給上帝什麼——如果那是“許諾”的話。人只是祈求，而賜下的是上帝（直接寫著：“<strong>洗淨你們的心</strong>”，<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L14">希 9:14</a>）。</p><p>使徒指明：洗禮洗去的不是身體上的污穢（不在乎除掉肉體的污穢），而是內在地洗淨罪。就是說，這是聖奧祕——重要的、肉眼看不見的、不能完全領會和說明的事。</p><p>這一切都在聖靈對水的運作中發生；所以主耶穌基督說，人從水和聖靈而生，而不只是從聖靈：</p><blockquote><p>“耶穌回答說：「我實實在在的告訴你，<strong><mark>人若不重生</mark></strong>，就不能見上帝的國。」 &lt;…&gt; 耶穌說：「我實實在在的告訴你，人若不是<strong><mark>從水和聖靈生的</mark></strong>，就不能進上帝的國。 <strong><mark>從肉身生的就是肉身</mark></strong>；<strong><mark>從靈生的就是靈</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>)</p></blockquote><p>況且，使徒最終說的話是：洗禮——<strong>拯救</strong>：</p><blockquote><p>“<strong><mark>這水所表明的洗禮，現在藉着耶穌基督復活，也拯救你們</mark></strong>；這洗禮本不在乎除掉肉體的污穢，只求在上帝面前有無虧的良心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L21">彼前 3:21</a>)</p></blockquote><p>而新教徒（浸信會）根本不同意這一點。在他們的教導裏，洗禮只是隆重的許諾，是形式，不救人。而使徒說，洗禮正是<strong>拯救</strong>的。</p><p>他們認爲，在獲得信心和悔改的時刻罪就得赦免了；而使徒保羅雖然信了，後來卻被吩咐受洗以洗去罪：</p><blockquote><p>“現在你爲什麼耽延呢？<strong><mark>起來，求告他的名受洗，洗去你的罪</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L16">徒 22:16</a>)</p></blockquote><p>這裏也如此說：</p><blockquote><p>“彼得說：「<strong><mark>你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦</mark></strong>，就必領受所賜的聖靈；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L38">徒 2:38</a>)</p></blockquote><h3>“洗淨罪的不是洗禮，而是上帝的道？”</h3><blockquote><p>“你們作丈夫的，要愛你們的妻子，正如基督愛教會，爲教會捨己。 <strong><mark>要用水藉着道把教會洗淨</mark></strong>，成爲聖潔，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L25-26">弗 5:25-26</a>)</p></blockquote><p>基督爲教會舍了自己，爲要使她成爲聖潔。怎樣潔淨？——“用水藉着道”，即聖洗禮：在三次浸入水中時，唸誦奉父、子、聖靈之名的話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L19">太 28:19</a>）。這裏說的正是這話。而且無論哪一樣（水）、哪一樣（關於父、子和聖靈的話）都不能排除。作別的解釋，就是斷章取義。這裏說的是在<strong>水的洗</strong>中唸誦的道。</p><h3>關於百夫長哥尼流：聖靈不經洗禮賜下嗎？</h3><p>靈恩派教派的擁護者爲他們關於自己彷彿只憑祈禱就領受聖靈的教訓辯護。他們引用聖靈唯一一次在洗禮之前降臨的情形：</p><blockquote><p>“彼得還說這話的時候，<strong><mark>聖靈降在一切聽道的人身上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L44">徒 10:44</a>)</p></blockquote><p>這裏講的是百夫長哥尼流，他是外邦人。當時不清楚：能不能給他們施洗，能不能接納外邦人進入教會。</p><p>所以上帝賜下特別的啟示，表明外邦人可以進入教會。</p><ol><li><p>上帝差到外邦人哥尼流那裏的不是聖靈，而是天使，叫他去找教會、請使徒來聽，好得救。</p></li><li><p>使徒彼得三次看見同一個異象：不潔的食物降到他面前，有聲音吩咐他宰了吃；因爲這聲音解釋說：“上帝所潔淨的，你不可當作俗物”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L15">徒 10:15</a>）</p></li><li><p>當使徒來到並開始宣講時，聖靈降在聽道的外邦人身上。</p></li></ol><p>之後，猶太血統的基督徒對所發生的事驚訝。怎麼這樣——聖靈降在外邦人身上？</p><blockquote><p>“那些奉割禮和彼得同來的信徒，<strong><mark>見聖靈的恩賜也澆在外邦人身上，就都希奇</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L45">徒 10:45</a>)</p></blockquote><p>然後一切以外邦人受洗結束——如今他們無疑可以受洗了，因爲上帝親自指明了這一點：</p><blockquote><p>“於是彼得說：「這些人既受了聖靈，與我們一樣，<strong><mark>誰能禁止用水給他們施洗呢</mark></strong>？」 <strong><mark>就吩咐奉耶穌基督的名給他們施洗</mark></strong>。他們又請彼得住了幾天。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L47-48">徒 10:47-48</a>)</p></blockquote><p>這樣，這是聖靈在洗禮之前降臨的唯一一例。不是代替洗禮，而是在它之前——因爲洗禮還是舉行了。而這一特殊的聖靈降臨有一個例外性的緣由——上帝以聖靈表明：可以接納外邦人進入教會。</p><p>聖靈降臨在人身上本身，是與洗禮分開的聖奧祕（詳見<a href="https://bibleox.com/ru/ru/w/миропомазание">聖膏</a>）。</p><h3>“太監不經使徒就領受了聖靈？”</h3><p>這個問題屬於聖膏的主題（見<a href="https://bibleox.com/ru/ru/w/миропомазание#HH-Если-сообщать-дары-Святого-Духа-могут-только-апостолы-то-почему-Святой-Дух-сходит-на-эфиопского-евнуха-после-крещения-от-диакона-Филиппа">聖膏</a>）。在腓利與太監的情形中（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L39">徒 8:39</a>）有一個非常重要的細節。</p><p>絕大多數釋經者——包括最古老的，包括聖金口約翰——引用這段經文時都沒有關於聖靈降臨的話（αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε）。經上只是說：</p><p>主<s>靈降在太監身上，而天使</s>把腓利提了去。</p><p>西奈抄本沒有這些話（四世紀）：</p><p>“καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</p><p>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</p><p>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</p><p>καὶ ἐβάπτισεν αὐτόν.</p><p>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</p><p><strong>πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>,</p><p>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</p><p>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</p><p>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</p><p>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</p><p>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν.”（使徒行傳 8:39-40）</p><p>梵蒂岡抄本沒有這些話（四世紀）：</p><p>“και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων”</p><p>聖金口約翰也是這樣引用的（沒有聖靈降臨的話）：</p><p>“Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.”</p><p>（[俄文](https://bibleox.com/el/grc/w/dNiR_Ὁμιλίαι_εἰς_τὰς_Πράξεις_τῶν_Ἀποστόλων#HH-ΟΜΙΛΙΑ-ΙΘ΄)《使徒行傳講道集》第9篇）</p><p>主教米哈伊爾（盧濟恩）的註釋：</p><p>“‘聖靈降在太監身上，主的使者卻把腓利提了去’：這一處只有少數古代希臘抄本和譯本（教會斯拉夫語和俄語譯本依從它們）以及少數古代釋經者如此讀；在大部分抄本和譯本以及釋經者中（其中如聖金口約翰和提奧菲拉克特）讀作：主的靈把腓利提了去。這究竟是一些抄本中的增添，還是另一些抄本中的省略——難以斷定；但前一種更可信，此處可以解釋爲：聖史緘默不言太監領受聖靈的事。”</p><p>（[俄文](https://azbyka.ru/biblia/in/?Act.8:39&r)來源）</p><h2>若干補充</h2><h3>嬰兒能夠信</h3><p>完全有理由認爲，嬰兒也能夠信、並被聖靈充滿，雖然他們還不能回答問題、以宣認自己的信仰。</p><p>先知大衛從嬰孩時期就仰賴上帝：</p><blockquote><p>“但你是叫我出母腹的；<strong><mark>我在母懷裏，你就使我有倚靠的心</mark></strong>。 我自出母胎就被交在你手裏；<strong><mark>從我母親生我，你就是我的上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/22/#L9-10">詩 22:9-10</a>)</p></blockquote><p>先知約翰在出生之前就感到與救主相遇，併爲之歡喜：</p><blockquote><p>“那時候馬利亞起身，急忙往山地裏去，來到猶大的一座城。 進了撒迦利亞的家，問以利沙伯安。 以利沙伯一聽馬利亞問安，<strong><mark>所懷的胎就在腹裏跳動</mark></strong>。<strong><mark>以利沙伯且被聖靈充滿</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L39-41">路 1:39-41</a>)</p></blockquote><p>基督把一個孩子放在自己面前，講到那些<strong>信他的</strong>“小子”：</p><blockquote><p>“<strong><mark>耶穌便叫一個小孩子來</mark></strong>，使他站在他們當中， 說：「我實在告訴你們：<strong><mark>你們若不迴轉，變成小孩子的樣式</mark></strong>，斷不得進天國。 所以，凡自己謙卑像這小孩子的，他在天國裏就是最大的。 凡爲我的名接待一個像這小孩子的，就是接待我。 <strong><mark>凡使這信我的一個小子跌倒的</mark></strong>，倒不如把大磨石拴在這人的頸項上，沉在深海里。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L2-6">太 18:2-6</a>)</p></blockquote><p>孩子們在基督進入耶路撒冷時讚美他：</p><blockquote><p>“祭司長和文士看見耶穌所行的奇事，又見<strong><mark>小孩子在殿裏喊著說</mark></strong>：「和散那歸於大衛的子孫！」就甚惱怒， 對他說：「這些人所說的，你聽見了嗎？」耶穌說：「是的。經上說：『<strong><mark>你從嬰孩和吃奶的口中完全了讚美的話</mark></strong>。』你們沒有念過嗎？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L15-16">太 21:15-16</a>)</p></blockquote><h3>沒有說誰可以不經洗禮而得救</h3><p>聖經裏沒有說誰可以不經洗禮而得救的話。倒是說了：不經洗禮沒有人能進上帝的國（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>）。</p>
