  title: 私審判（靈魂死後的試煉）
  copy_cover: true
  body: <h2>私審判簡介</h2><p><a href="https://azbyka.ru/mytarstva">私審判</a>是東正教會的一項教導：在人死後，墮落的天使企圖奪取人的靈魂。這樣，靈魂要經受可怕的試煉；在試煉中，上帝的天使盡力保護義人的靈魂，把他們帶到上帝面前。這一教導以象徵性、形象性的方式表達爲若干「關卡」，靈魂在每一關上都要就某些情慾受審問。在這裏，天使是施行上帝公義的工具。</p><h2>在邪惡的日子抵擋天空屬靈氣的惡魔，勝過一切</h2><p>魔鬼是空中掌權者的首領：</p><blockquote><p>“你們死在過犯罪惡之中，他叫你們活過來。 那時，你們在其中行事爲人，隨從今世的風俗，<strong><mark>順服空中掌權者的首領</mark></strong>，就是現今在悖逆之子心中運行的邪靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L1-2">弗 2:1-2</a>)</p></blockquote><p>需要有所準備，以便在邪惡的日子（死亡之日）勝過一切：</p><blockquote><p>“<strong><mark>要穿戴上帝所賜的全副軍裝，就能抵擋魔鬼的詭計</mark></strong>。 因我們並不是與屬血氣的爭戰，乃是與那些執政的、掌權的、管轄這幽暗世界的，以及<strong><mark>天空屬靈氣的惡魔</mark></strong>爭戰。 所以，要拿起上帝所賜的全副軍裝，<strong><mark>好在磨難的日子抵擋</mark></strong>仇敵，<strong><mark>並且成就了一切，還能站立得住</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L11-13">弗 6:11-13</a>)</p></blockquote><h2>若無上帝的許可，魔鬼不能觸及義人；他尋求獲得許可來轄制他們</h2><p>魔鬼尋求如何控告或誣告人，以便轄制他：</p><blockquote><p>“撒但回答耶和華說：「人以皮代皮，情願捨去一切所有的，保全性命。 你且伸手傷他的骨頭，和他的肉，他必當面棄掉你。」 耶和華對撒但說：「<strong><mark>他在你手中，只要存留他的性命</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/2/#L4-6">伯 2:4-6</a>)</p></blockquote><blockquote><p>“天使長米迦勒<strong><mark>爲摩西的屍首與魔鬼爭辯的時候</mark></strong>，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L9">猶 1:9</a>)</p></blockquote><h2>魔鬼時刻尋找可吞吃的人</h2><blockquote><p>“務要謹守、儆醒，因爲<strong><mark>你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L8">彼前 5:8</a>)</p></blockquote><h2>天使被差遣服事那將承受救恩的人</h2><blockquote><p>“所有的天使，上帝從來對那一個說：『你坐在我的右邊，等我使你仇敵作你的腳凳？』 <strong><mark>天使豈不都是服役的靈、奉差遣爲那將要承受救恩的人效力嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><h2>天使在死後「接去」義人的靈魂</h2><p>靈魂在與身體分離之後是會移動的。靈魂必須走完通往它將來居所的路程。</p><p>天使照管了義人拉撒路的靈魂，但對財主卻沒有這樣的記載：</p><blockquote><p>“有一個財主，穿著紫色袍和細麻布衣服，天天奢華宴樂。 又有一個討飯的，名叫拉撒路，渾身生瘡，被人放在財主門口， 要得財主桌子上掉下來的零碎充飢，並且狗來餂他的瘡。 <strong><mark>後來那討飯的死了，被天使帶去放在亞伯拉罕的懷裏</mark></strong>。<strong>財主也死了，並且埋葬了</strong>。 <strong><mark>他在陰間受痛苦</mark></strong>，舉目遠遠的望見亞伯拉罕，又望見拉撒路在他懷裏， 就喊著說：『我祖亞伯拉罕哪，可憐我吧！打發拉撒路來，用指頭尖蘸點水，涼涼我的舌頭，因爲我在這火焰裏，極其痛苦。』 亞伯拉罕說：『兒啊，<strong><mark>你該回想你生前享過福，拉撒路也受過苦；如今他在這裏得安慰，你倒受痛苦</mark></strong>。 不但這樣，並且在你我之間，有深淵限定，以致人要從這邊過到你們那邊是不能的；要從那邊過到我們這邊也是不能的。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/16/#L19-26">路 16:19-26</a>)</p></blockquote><p>罪人的靈魂會在不知不覺中被取去：</p><blockquote><p>“然後要對我的靈魂說：靈魂哪，你有許多財物積存，可作多年的費用，只管安安逸逸的吃喝快樂吧！』 上帝卻對他說：『<strong><mark>無知的人哪，今夜必要你的靈魂</mark></strong>，你所預備的要歸誰呢？』 <strong><mark>凡爲自己積財，在上帝面前卻不富足的，也是這樣</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L19-21">路 12:19-21</a>)</p></blockquote><h2>在死亡的時辰魔鬼來到基督面前，但他無物可指責基督</h2><p>在受難的前一天，基督說到魔鬼的臨近；魔鬼在基督裏面毫無所有，不能以罪指責他：</p><blockquote><p>“以後我不再和你們多說話，因爲<strong><mark>這世界的王將到，他在我裏面是毫無所有</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L30">約 14:30</a>)</p></blockquote><p>但對其他的人就不是這樣：</p><blockquote><p>“<strong><mark>犯罪的是屬魔鬼</mark></strong>，因爲魔鬼從起初就犯罪。上帝的兒子顯現出來，爲要除滅魔鬼的作爲。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L8">約壹 3:8</a>)</p></blockquote><h2>基督是藉着云彩、經由空中昇天的</h2><blockquote><p>“說了這話，他們正看的時候，<strong><mark>他就被取上升，有一朵雲彩把他接去</mark></strong>，便看不見他了。 <strong><mark>當他往上去</mark></strong>，他們定睛望天的時候，忽然有兩個人身穿白衣，站在旁邊，說：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L9-10">徒 1:9-10</a>)</p></blockquote><h2>基督也將同樣再來</h2><blockquote><p>“我們卻是天上的國民，<strong><mark>並且等候救主</mark></strong>，就是主耶穌基督從天上降臨。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L20">腓 3:20</a>)</p></blockquote><blockquote><p>“「加利利人哪，你們爲什麼站著望天呢？這離開你們被接昇天的耶穌，<strong><mark>你們見他怎樣往天上去，他還要怎樣來</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L11">徒 1:11</a>)</p></blockquote>
