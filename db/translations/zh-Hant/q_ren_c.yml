  path: QR8T_疾病
  title: 疾病
  copy_cover: true
  body: <h2>起初的基督徒們也患病</h2><p>提摩太（以弗所主教）患胃病，使徒保羅因他的病吩咐他稍微放鬆齋戒：</p><blockquote><p>“<strong><mark>因你胃口不清，屢次患病</mark></strong>，<strong><mark>再不要照常喝水</mark></strong>，可以稍微用點酒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L23">提前 5:23</a>)</p></blockquote><p>使徒保羅自己也得了一種病，免得他自高：</p><blockquote><p>“又恐怕我因所得的啓示甚大，就過於自高，所以<strong><mark>有一根刺加在我肉體上</mark></strong>，就是撒但的差役要攻擊我，<strong><mark>免得我過於自高</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/12/#L7">林後 12:7</a>)</p></blockquote><p>以巴弗提（使徒保羅的同工）患病，幾乎要死：</p><blockquote><p>“然而，我想必須打發<strong><mark>以巴弗提</mark></strong>到你們那裏去。他是我的兄弟，與我一同作工、一同當兵，是你們所差遣的，也是供給我需用的。 他很想念你們衆人，並且極其難過，<strong><mark>因爲你們聽見他病了</mark></strong>。 <strong><mark>他實在是病了，幾乎要死</mark></strong>，然而，上帝憐恤他，不但憐恤他，也憐恤我，免得我憂上加憂。 &lt;…&gt; 因他爲作基督的工夫，<strong><mark>幾乎至死</mark></strong>，不顧性命，要補足你們供給我的不及之處。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L25-27,30">腓 2:25-27,30</a>)</p></blockquote><p>使徒保羅把一個犯罪的基督徒交給撒但，讓他受疾病的打擊：</p><blockquote><p>“我身子雖不在你們那裏，心卻在你們那裏，好像我親自與你們同在，已經判斷了行這事的人。 &lt;…&gt; <strong>要把這樣的人交給撒但，敗壞他的肉體，使他的靈魂在主耶穌的日子可以得救</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L3,5">林前 5:3,5</a>)</p></blockquote><p>不配地參與聖餐禮曾使許多基督徒患病、軟弱、甚至死亡：</p><blockquote><p>“因此，<strong><mark>在你們中間有好些軟弱的與患病的</mark></strong>，死的也不少。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L30">林前 11:30</a>)</p></blockquote><p>舊約的義人也患病</p><blockquote><p>“<strong><mark>以撒年老，眼睛昏花，不能看見</mark></strong>，就叫了他大兒子以掃來，說：「我兒。」以掃說：「我在這裏。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/27/#L1">創 27:1</a>)</p></blockquote><h2>身體受苦的益處</h2><h3>有助於離棄罪</h3><blockquote><p>“基督既在肉身受苦，你們也當將這樣的心志作爲兵器，因爲<strong><mark>在肉身受過苦的，就已經與罪斷絕了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L1">彼前 4:1</a>)</p></blockquote><h3>免於驕傲</h3><blockquote><p>“又恐怕我因所得的啓示甚大，就過於自高，<strong><mark>所以有一根刺加在我肉體上，就是撒但的差役要攻擊我，免得我過於自高</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/12/#L7">林後 12:7</a>)</p></blockquote><h3>管教</h3><blockquote><p>“這樣，因痛苦纏身，<strong>他的狂傲，方開始止息</strong>；因天主的懲罰，<strong>痛苦逐漸增加，他也逐漸覺悟</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/2mak/9/#L11">加下 9:11</a>)</p></blockquote><h2>上帝能以疾病施行懲罰</h2><p>上帝能因罪孽和罪惡施行懲罰：</p><blockquote><p>“你爲何因損傷哀號呢？<strong><mark>你的痛苦無法醫治</mark></strong>，<strong><mark>我因你的罪孽甚大，罪惡衆多，曾將這些加在你身上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/30/#L15">耶 30:15</a>)</p></blockquote><p>上帝因米利暗（亞倫和摩西的姊妹）毀謗摩西而以癩病懲罰她：</p><blockquote><p>“你們毀謗我的僕人摩西，爲何不懼怕呢？」 <strong><mark>耶和華就向他們二人發怒而去</mark></strong>。 雲彩從會幕上挪開了，不料，<strong><mark>米利暗長了大痲瘋，有雪那樣白</mark></strong>。亞倫一看米利暗長了大痲瘋，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/12/#L8-10">民 12:8-10</a>)</p></blockquote><p>因以色列民偏離對上帝的敬拜，瘟疫臨到以色列民：</p><blockquote><p>“以色列人與巴力毘珥連合，<strong><mark>耶和華的怒氣就向以色列人發作</mark></strong>。 &lt;…&gt; <strong><mark>那時遭瘟疫死的，有二萬四千人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/25/#L3,9">民 25:3,9</a>)</p></blockquote><p>救主指出罪是疾病的原因：</p><blockquote><p>“後來耶穌在殿裏遇見他，對他說：「<strong><mark>你已經痊癒了，不要再犯罪，恐怕你遭遇的更加利害</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L14">約 5:14</a>)</p></blockquote><p>上帝也能施憐憫，護佑人免於疾病</p><blockquote><p>“又說：「<strong><mark>你若留意聽耶和華你上帝的話</mark></strong>，又行我眼中看爲正的事，留心聽我的誡命，守我一切的律例，<strong><mark>我就不將所加與埃及人的疾病加在你身上，因爲我耶和華是醫治你的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/15/#L26">出 15:26</a>)</p></blockquote><h2>並非一切疾病都出於罪</h2><blockquote><p>“耶穌過去的時候，看見一個人生來是瞎眼的。 門徒問耶穌說：「拉比，這人生來是瞎眼的，是誰犯了罪？是這人呢？是他父母呢？」 耶穌回答說：「<strong><mark>也不是這人犯了罪，也不是他父母犯了罪，是要在他身上顯出上帝的作爲來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/9/#L1-3">約 9:1-3</a>)</p></blockquote><p>另見：<a href="https://bibleox.com/ru/ru/w/медицина">醫學</a>。</p><h2>《十二宗徒訓言》——一至二世紀的基督教文獻</h2><blockquote><p>「凡臨到你身上的逆境，<strong>你都要當作益處來接受</strong>，因爲知道：若沒有上帝，就什麼也不會發生。」</p></blockquote><p>（<a href="https://bibleox.com/ru/ru/w/Дидахе/#HH-3">《十二宗徒訓言》第3章</a>）</p>
