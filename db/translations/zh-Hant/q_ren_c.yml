- src: о_жизни_в_долг
  path: QR7A_借貸生活
  title: 借貸生活
  copy_cover: true
  body: <blockquote><p>“富戶管轄窮人，<strong><mark>欠債的是債主的僕人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/22/#L7">箴 22:7</a>)</p></blockquote><blockquote><p>“不要與人擊掌，不要爲欠債的作保。 <strong><mark>你若沒有什麼償還，何必使人奪去你睡臥的牀呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/22/#L26-27">箴 22:26-27</a>)</p></blockquote><blockquote><p>“然而，<strong>敬虔加上知足的心便是大利了</strong>， 因爲我們沒有帶什麼到世上來，也不能帶什麼去， <strong><mark>只要有衣有食，就當知足</mark></strong>。 但那些想要發財的人，就陷在迷惑、落在網羅和許多無知有害的私慾裏，叫人沉在敗壞和滅亡中。 <strong><mark>貪財是萬惡之根</mark></strong>！有人貪戀錢財，就被引誘離了真道，用許多愁苦把自己刺透了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L6-10">提前 6:6-10</a>)</p></blockquote><blockquote><p>“你們存心不可貪愛錢財，<strong><mark>要以自己所有的爲足</mark></strong>。因爲主曾說：『我總不撇下你，也不丟棄你。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L5">希 13:5</a>)</p></blockquote>
