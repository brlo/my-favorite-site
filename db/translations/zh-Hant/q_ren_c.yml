- src: медицина
  path: QR9A_醫學
  title: 醫學
  copy_cover: true
  body: <p>先知以賽亞容許用藥治療：</p><blockquote><p>“以賽亞說：「<strong><mark>當取一塊無花果餅來</mark></strong>。」<strong><mark>人就取了來，貼在瘡上</mark></strong>，王便痊癒了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/20/#L7">王下 20:7</a>)</p></blockquote><p>上帝造植物時，使其中一些具有藥性：</p><blockquote><p>“應尊敬醫生，因爲他是非有不可的，也是上主造的。治療原是來自至高者；君王對醫生也應送禮。醫生的學識使他抬頭，在偉人面前，備受讚揚。<strong>上主使大地生長藥材</strong>，明智人決不輕視它們。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/38/#L1-4">德 38:1-4</a>)</p></blockquote><p>求醫時仰望上帝：</p><blockquote><p>“我兒，<strong>你患病時，不要失望，但要祈求上主，他要賜你病癒</strong>。你應遠離過犯，管治你的手，洗淨你心中的一切罪惡；你應奉獻馨香和上等麵粉的記念祭品，照你能備辦的，應奉獻肥美的祭品。<strong>但是也要請醫生來診治</strong>，因爲他是上主造的，<strong>不要讓他離開你，因爲你需要他</strong>。有時他們妙手回春；故此他們也應該祈求上主，爲使他們能給人安樂與健康，藉此維持自己的生活。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/38/#L9-14">德 38:9-14</a>)</p></blockquote><p>把全部希望只寄託在醫生身上，是錯誤的：</p><blockquote><p>“亞撒作王三十九年，他腳上有病，而且甚重。<strong><mark>病的時候沒有求耶和華，只求醫生</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/16/#L12">代下 16:12</a>)</p></blockquote><p>使徒傳道者路加是醫生：</p><blockquote><p>“<strong><mark>所親愛的醫生路加</mark></strong>和底馬問你們安。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/4/#L14">西 4:14</a>)</p></blockquote>
