- src: Христос-Единородный-Сын-Божий
  path: Qs1T_基督是上帝的獨生子
  title: 基督是上帝的獨生子
  copy_cover: true
  body: <h2>獨生子——父的獨子</h2><p>長子是最先出生的。也就是說，像上帝的兒子那樣出生的，再沒有別人：</p><blockquote><p>“<strong>道成了肉身</strong>，住在我們中間，充充滿滿的有恩典有真理。我們也見過他的榮光，正是<strong>父獨生子的榮光</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L14">約 1:14</a>)</p></blockquote><blockquote><p>“從來沒有人看見上帝，只有在父懷裏的<strong>獨生子</strong>將他表明出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>)</p></blockquote><blockquote><p>“<strong>上帝</strong>愛世人，<strong>甚至將他的獨生子賜給</strong>他們，叫一切信他的，不至滅亡，反得永生。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L16">約 3:16</a>)</p></blockquote><blockquote><p>“信他的人，不被定罪；不信的人，罪已經定了，因爲他不信<strong>上帝獨生子的名</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L18">約 3:18</a>)</p></blockquote><blockquote><p>“及至時候滿足，<strong>上帝就差遣他的兒子</strong>，爲女子所生，且生在律法以下，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L4">加 4:4</a>)</p></blockquote><blockquote><p>“上帝差他<strong>獨生子</strong>到世間來，使我們藉着他得生，上帝愛我們的心在此就顯明了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L9">約壹 4:9</a>)</p></blockquote><p>亞伯拉罕獻獨生子以撒——是上帝的獨生子在十字架上被獻爲祭的預表：</p><blockquote><p>“亞伯拉罕因著信，被試驗的時候，就把以撒獻上；這便是那歡喜領受應許的，將自己<strong>獨生的兒子</strong>獻上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L17">希 11:17</a>)</p></blockquote><h2>耶穌基督是長子（首生者）</h2><p>基督兩次被稱爲長子：</p><blockquote><p>“因爲他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子<strong>在許多弟兄中作長子</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L29">羅 8:29</a>)</p></blockquote><blockquote><p>“再者，上帝使<strong>長子</strong>到世上來的時候，就說：『上帝的使者都要拜他。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L6">希 1:6</a>)</p></blockquote><p>爲什麼基督是長子？因爲他是首先從死裏復活的：</p><blockquote><p>“他也是教會全體之首，他是元始，是<strong>從死裏首先復生的</strong>，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“並那誠實作見證的、<strong>從死裏首先復活</strong>、爲世上君王元首的耶穌基督，有恩惠、平安歸與你們！他愛我們，用自己的血使我們脫離罪惡，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L5">啟 1:5</a>)</p></blockquote><blockquote><p>“就是基督必須受害，並且<strong>因從死裏復活</strong>，要首先把光明的道傳給百姓和外邦人。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/26/#L23">徒 26:23</a>)</p></blockquote><h2>順帶一說</h2><p>按伊斯蘭教的教義，安拉不生育，也不被生育：“他不生育，也不被生育”（《古蘭經》112:3）。</p>
