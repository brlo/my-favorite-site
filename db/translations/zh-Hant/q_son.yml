  title: 基督無罪
  copy_cover: true
  body: <blockquote><p>“上帝使那<strong>無罪的</strong>，替我們成爲罪，好叫我們在他裏面成爲上帝的義。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L21">林後 5:21</a>)</p></blockquote><blockquote><p>“因我們的大祭司並非不能體恤我們的軟弱，他也曾凡事受過試探，與我們一樣；<strong>只是他沒有犯罪</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/4/#L15">希 4:15</a>)</p></blockquote><blockquote><p>“像這樣聖潔、<strong>無邪惡、無玷污、遠離罪人</strong>、高過諸天的大祭司，原是與我們合宜的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L26">希 7:26</a>)</p></blockquote><blockquote><p>“何況基督藉着永遠的靈，將自己<strong>無瑕無疵</strong>獻給上帝，他的血豈不更能洗淨你們的心，除去你們的死行，使你們事奉那永生上帝嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L14">希 9:14</a>)</p></blockquote><blockquote><p>“你們知道主曾顯現，是要除掉人的罪，<strong>在他並沒有罪</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L5">約壹 3:5</a>)</p></blockquote><blockquote><p>“以後我不再和你們多說話，因爲<strong>這世界的王</strong>將到，他<strong>在我裏面是毫無所有</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L30">約 14:30</a>)</p></blockquote><blockquote><p>“你們中間<strong>誰能指證我有罪呢</strong>？我既然將真理告訴你們，爲什麼不信我呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L46">約 8:46</a>)</p></blockquote><blockquote><p>“他雖然<strong>未行強暴，口中也沒有詭詐</strong>，人還使他與惡人同埋；誰知死的時候與財主同葬。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/53/#L9">賽 53:9</a>)</p></blockquote>
  meta_desc: 聖經關於基督無罪的引文
