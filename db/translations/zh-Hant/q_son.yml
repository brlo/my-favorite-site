- src: отвержение-Христа-отвержение-Бога
  path: Qs6T_拒絕基督就是拒絕上帝
  title: 拒絕基督就是拒絕上帝
  copy_cover: true
  body: <blockquote><p>“又對門徒說：「聽從你們的就是聽從我；棄絕你們的就是棄絕我；<strong>棄絕我的就是棄絕那差我來的</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L16">路 10:16</a>)</p></blockquote><blockquote><p>“<strong>恨我的，也恨我的父</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L23">約 15:23</a>)</p></blockquote><blockquote><p>“<strong>凡不認子的，就沒有父</strong>；認子的，連父也有了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L23">約壹 2:23</a>)</p></blockquote><blockquote><p>“<strong>凡越過基督的教訓不常守著的，就沒有上帝</strong>；常守這教訓的，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><blockquote><p>“信子的人有永生；<strong>不信子的人得不著永生</strong>，<strong>上帝的震怒常在他身上</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L36">約 3:36</a>)</p></blockquote>
