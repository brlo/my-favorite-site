- src: Христос-Творец-мира
  path: Qs4T_基督——世界的創造者
  title: 基督——世界的創造者
  copy_cover: true
  body: <p>耶穌基督，上帝之子——世界的創造者：</p><blockquote><p>“<strong><mark>論到子</mark></strong>卻說：『上帝啊，你的寶座是永永遠遠的，你的國權是正直的。 你喜愛公義，恨惡罪惡，所以上帝，就是你的上帝，用喜樂油膏你，勝過膏你的同伴。』 又說：『主啊，<strong><mark>你起初立了地的根基，天也是你手所造的</mark></strong>。 天地都要滅沒，你卻要長存；天地都要像衣服漸漸舊了， 你要將天地捲起來，像一件外衣，天地就都改變了。惟有你永不改變，你的年數沒有窮盡。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L8-12">希 1:8-12</a>)</p></blockquote><blockquote><p>“他救了我們脫離黑暗的權勢，把我們遷到他<strong><mark>愛子</mark></strong>的國裏； 我們在愛子裏得蒙救贖，罪過得以赦免。 愛子是那不能看見之上帝的像，是首生的，<strong>在一切被造的以先</strong>。 因爲<strong><mark>萬有都是靠他造的，無論是天上的、地上的、能看見的、不能看見的</mark></strong>、或是有位的、主治的、執政的、掌權的，<strong>一概都是藉着他造的，又是爲他造的</strong>。 他在萬有之先，萬有也靠他而立。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L13-17">西 1:13-17</a>)</p></blockquote><blockquote><p>“他在世界，<strong>世界也是藉着他造的</strong>，世界卻不認識他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L10">約 1:10</a>)</p></blockquote><blockquote><p>“上帝既在古時藉着衆先知多次多方的曉諭列祖， 就在這末世，<strong>藉着他兒子</strong>曉諭我們，又早已立他爲承受萬有的，也曾<strong>藉着他創造諸世界</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L1-2">希 1:1-2</a>)</p></blockquote><blockquote><p>“我們因著信，就知道<strong>諸世界是藉上帝話造成的</strong>，這樣，所看見的，並不是從顯然之物造出來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L3">希 11:3</a>)</p></blockquote>
  meta_desc: 耶穌基督就是創造世界和其中萬物的那一位
