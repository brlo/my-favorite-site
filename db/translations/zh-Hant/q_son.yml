- src: Сын-безначальный-начинается
  path: Qs2T_無始的聖子降生了
  title: 無始的聖子降生了
  copy_cover: true
  body: <h2>上帝之子沒有開始，但賜開始給一切有開始的</h2><blockquote><p>“太初有道，道與上帝同在，道就是上帝。 &lt;…&gt; 萬物是藉着他造的；<strong>凡被造的，沒有一樣不是藉着他造的</strong>。 &lt;…&gt; 道成了肉身，住在我們中間，充充滿滿的有恩典有真理。我們也見過他的榮光，正是父獨生子的榮光。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1,3,14">約 1:1,3,14</a>)</p></blockquote><h2>麥基洗德的祭司職分——無生之始的上帝之子的預表</h2><blockquote><p>“他無父、無母、無族譜、<strong>無生之始、無命之終，乃是與上帝的兒子相似</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L3">希 7:3</a>)</p></blockquote><h2>無始者降生了</h2><p>無始的<a href="https://bibleox.com/ru/ru/w/Христос-Бог">上帝</a>降生了：他照預言（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/7/#L14">賽 7:14</a>）由童女所生，成爲人：</p><blockquote><p>“及至時候滿足，上帝就<strong>差遣</strong>他的兒子，<strong>爲女子所生</strong>，且生在律法以下，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L4">加 4:4</a>)</p></blockquote><blockquote><p>“他本有上帝的形像，不以自己與上帝同等爲強奪的， 反倒虛己，<strong>取了奴僕的形像，成爲人的樣式</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/2/#L6-7">腓 2:6-7</a>)</p></blockquote><blockquote><p>“太初有道，道與上帝同在，<strong>道就是上帝</strong>。 &lt;…&gt; 萬物是藉着他造的；凡被造的，沒有一樣不是藉着他造的。 &lt;…&gt; <strong>道成了肉身</strong>，住在我們中間，充充滿滿的有恩典有真理。我們也見過他的榮光，正是父獨生子的榮光。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1,3,14">約 1:1,3,14</a>)</p></blockquote>
  meta_desc: 聖經關於無始的上帝之子由童貞女馬利亞所生的引文
