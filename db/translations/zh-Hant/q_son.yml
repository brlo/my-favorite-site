- src: Христос-на-небе
  path: Qs3T_基督在天上
  title: 基督在天上
  copy_cover: true
  body: <blockquote><p>“主耶穌和他們說完了話，後來<strong>被接到天上，坐在上帝的右邊</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L19">可 16:19</a>)</p></blockquote><blockquote><p>“他是上帝榮耀所發的光輝，是上帝本體的真像，常用他權能的命令托住萬有，他洗淨了人的罪，就<strong>坐在高天至大者的右邊</strong>．” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L3">希 1:3</a>)</p></blockquote><blockquote><p>“我們所講的事，其中第一要緊的，就是我們有這樣的大祭司，<strong>已經坐在天上至大者寶座的右邊</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/8/#L1">希 8:1</a>)</p></blockquote><blockquote><p>“但基督獻了一次永遠的贖罪祭，<strong>就在上帝的右邊坐下了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L12">希 10:12</a>)</p></blockquote><blockquote><p>“仰望爲我們信心創始成終的耶穌。他因那擺在前面的喜樂，就輕看羞辱，忍受了十字架的苦難，<strong>便坐在上帝寶座的右邊</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L2">希 12:2</a>)</p></blockquote><blockquote><p>“因爲<strong>基督</strong>並不是進了人手所造的聖所（這不過是真聖所的影像），<strong>乃是進了天堂，如今爲我們顯在上帝面前</strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>)</p></blockquote><blockquote><p>“但司提反被聖靈充滿，定睛望天，看見上帝的榮耀，又看見<strong>耶穌站在上帝的右邊</strong>， 就說：「<strong>我看見天開了，人子站在上帝的右邊</strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L55-56">徒 7:55-56</a>)</p></blockquote>
  meta_desc: 聖經關於基督與父同在天上的引文
