  path: Qs5T_基督——救贖者
  title: 基督——救贖者
  copy_cover: true
  body: <p>因亞當的過犯，全人類被定罪：</p><blockquote><p>“如此說來，<strong>因一次的過犯，衆人都被定罪</strong>；照樣，因一次的義行，衆人也就被稱義得生命了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L18">羅 5:18</a>)</p></blockquote><p>基督擔當了人類的咒詛：</p><blockquote><p>“基督既爲我們受了咒詛，就贖出我們脫離律法的咒詛，因爲經上記著：『凡掛在木頭上都是被咒詛的。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L13">加 3:13</a>)</p></blockquote><p>基督用自己的血救贖了人：</p><blockquote><p>“知道你們<strong>得贖</strong>、<strong>脫去你們祖宗所傳流虛妄的行爲</strong>，不是憑著能壞的金銀等物， 乃是憑著<strong>基督的寶血</strong>，如同無瑕疵、無玷污的羔羊之血。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L18-19">彼前 1:18-19</a>)</p></blockquote><blockquote><p>“他們唱新歌，說：「你配拿書卷，配揭開七印。因爲你曾被殺，<strong>用自己的血從各族、各方、各民、各國中買了人來</strong>，叫他們歸於上帝，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/5/#L9">啟 5:9</a>)</p></blockquote>
  meta_desc: "“你曾被殺，用自己的血從各族、各方、各民、各國中買了人來，叫他們歸於上帝”（啟 5:9）"
