- src: молитва-Иисусу-Христу
  path: Qs8T_向耶穌基督的祈禱
  title: 向耶穌基督的祈禱
  copy_cover: true
  body: <h2>可以向耶穌基督禱告嗎？</h2><p>當然可以。但這誡命我們不是從聖經，而是從聖傳領受的。</p><h2>只憑聖經能否斷言應當向耶穌基督禱告？</h2><p>聖經中沒有向耶穌基督禱告的誡命。不過，<a href="https://bibleox.com/zh-Hant/gr-lxx-byz/in/14/#L14">約 14:14</a>有一些蹟象（參見希臘文文本）。</p><p>耶穌基督曾向父禱告（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L36">可 14:36</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L42">路 22:42</a>），賜下了“我們在天上的父”的禱告（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L9">太 6:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L2">路 11:2</a>），也就是說，他教導人向父禱告。</p><p>主張只靠聖經（當然是按他們對聖經的理解）建立信仰的人，不敢否認向耶穌基督的禱告。因此他們說：向耶穌基督禱告的實踐既然存在，就是可以向他禱告。然而，他們常常連這種實踐都難以指出，因爲它十分罕見——當然，它是有的。例如：</p><blockquote><p>“他們正用石頭打的時候，司提反<strong>呼籲</strong>主說：「<strong>求主耶穌</strong>接收我的靈魂！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L59">徒 7:59</a>) <em>(希臘文 ἐπικαλούμενον（呼籲、祈求）)</em></p></blockquote><h2>反對意見</h2><h3>“奉我的名求”</h3><p>新教徒反對說，誡命就在這節經文裏：</p><blockquote><p>“你們若<strong>奉我的名</strong>求什麼，我必成就。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L14">約 14:14</a>)</p></blockquote><p>然而，只要引用上下文就能看到，主耶穌基督在這裏教導的也是向父求：</p><blockquote><p>“你們奉我的名無論求什麼，我必成就，<strong><mark>叫父因兒子得榮耀</mark></strong>。 你們若奉我的名求什麼，我必成就。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L13-14">約 14:13-14</a>) <em>(和合本此處無“向父求”的字樣)</em></p></blockquote>
