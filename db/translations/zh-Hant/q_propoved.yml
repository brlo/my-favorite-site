  title: 羞於認自己是信徒
  copy_cover: true
  body: <h2>羞於稱自己是屬基督的</h2><blockquote><p>“凡在這淫亂罪惡的世代，<strong><mark>把我和我的道當作可恥的</mark></strong>，人子在他父的榮耀裏，同聖天使降臨的時候，<strong><mark>也要把那人當作可恥的</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/8/#L38">可 8:38</a>)</p></blockquote><blockquote><p>“<strong><mark>凡把我和我的道當作可恥的</mark></strong>，人子在自己的榮耀裏，並天父與聖天使的榮耀裏降臨的時候，<strong><mark>也要把那人當作可恥的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L26">路 9:26</a>)</p></blockquote><blockquote><p>“<strong>你們的靈魂，要喜樂於天主的仁慈，你們決不會因讚美他而蒙羞受辱。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/51/#L37">德 51:37</a>)</p></blockquote><blockquote><p>“<strong><mark>惟有膽怯的、不信的</mark></strong>、可憎的、殺人的、淫亂的、行邪術的、拜偶像的和一切說謊話的，他們的分就在燒著硫磺的火湖裏，這是第二次的死。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/21/#L8">啟 21:8</a>)</p></blockquote><h2>關於爲基督受苦</h2><p><a href="https://bibleox.com/ru/ru/w/страдание-за-Христа">爲基督受苦</a></p>
