  path: Qp2T_爭論
  title: 爭論
  copy_cover: true
  body: <h2>爭論的性質</h2><h3>像羊羔一樣</h3><blockquote><p>“你們去吧！<strong><mark>我差你們出去，如同羊羔進入狼羣</mark></strong>。 &lt;…&gt; 無論進那一城，人若不接待你們，你們就到街上去， 說：『就是你們城裏的塵土粘在我們的腳上，我們也當著你們擦去。雖然如此，你們該知道上帝的國臨近了。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L3,10-11">路 10:3,10-11</a>)</p></blockquote><blockquote><p>“<strong><mark>我差你們去，如同羊進入狼羣</mark></strong>，所以你們要<strong><mark>靈巧像蛇</mark></strong>，<strong><mark>馴良像鴿子</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L16">太 10:16</a>)</p></blockquote><h3>溫柔與愛</h3><blockquote><p>“只要心裏尊主基督爲聖。有人問你們心中盼望的緣由，就要常作準備，<strong><mark>以溫柔，敬畏的心回答各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L15">彼前 3:15</a>)</p></blockquote><blockquote><p>“你要提醒衆人，叫他們順服作官的、掌權的，遵他的命，預備行各樣的善事。 不要毀謗，不要爭競，<strong><mark>總要和平，向衆人大顯溫柔</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L1-2">多 3:1-2</a>)</p></blockquote><blockquote><p>“你要逃避少年的私慾，同那清心禱告主的人追求公義、信德、仁愛、和平。 惟有那愚拙無學問的辯論，總要棄絕，因爲知道這等事是起爭競的。 然而主的僕人不可爭競；只要溫溫和和的待衆人，善於教導，<strong><mark>存心忍耐</mark></strong>， <strong><mark>用溫柔勸戒那抵擋的人</mark></strong>，或者上帝給他們悔改的心，可以明白真道，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L22-25">提後 2:22-25</a>)</p></blockquote><blockquote><p>“你們中間誰是有智慧、有見識的呢？<strong><mark>他就當在智慧的溫柔上顯出他的善行來</mark></strong>。 你們心裏若懷著苦毒的嫉妒和紛爭，<strong><mark>就不可自誇，也不可說謊話抵擋真道</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/3/#L13-14">雅 3:13-14</a>)</p></blockquote><blockquote><p>“我保羅，就是與你們見面的時候是謙卑的，不在你們那裏的時候向你們是勇敢的，<strong><mark>如今親自藉着基督的溫柔、和平勸你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/10/#L1">林後 10:1</a>)</p></blockquote><blockquote><p>“我爲主被囚的勸你們：既然蒙召，<strong><mark>行事爲人就當與蒙召的恩相稱</mark></strong>。 <strong><mark>凡事謙虛、溫柔、忍耐</mark></strong>，用愛心互相寬容，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L1-2">弗 4:1-2</a>)</p></blockquote><blockquote><p>“<strong><mark>但命令的總歸就是愛</mark></strong>，這愛是從清潔的心和無虧的良心、無僞的信心生出來的。 <strong><mark>有人偏離這些，反去講虛浮的話</mark></strong>， 想要作教法師，卻不明白自己所講說的、所論定的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L5-7">提前 1:5-7</a>)</p></blockquote><blockquote><p>“我若能說萬人的方言，並天使的話語，<strong><mark>卻沒有愛，我就成了鳴的鑼、響的鈸一般</mark></strong>。 我若有先知講道之能，也明白各樣的奧祕、各樣的知識，而且有全備的信，叫我能夠移山，<strong><mark>卻沒有愛，我就算不得什麼</mark></strong>。 我若將所有的賙濟窮人，又捨己身叫人焚燒，<strong><mark>卻沒有愛，仍然與我無益</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L1-3">林前 13:1-3</a>)</p></blockquote><blockquote><p>“<strong><mark>惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒</mark></strong>。 並且使人和平的，是用和平所栽種的義果。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/3/#L17-18">雅 3:17-18</a>)</p></blockquote><h2>避免愚拙的爭辯</h2><blockquote><p>“你要逃避少年的私慾，同那清心禱告主的人追求公義、信德、仁愛、和平。 惟有那愚拙無學問的辯論，<strong><mark>總要棄絕</mark></strong>，因爲知道這等事是起爭競的。 然而<strong><mark>主的僕人不可爭競</mark></strong>；只要溫溫和和的待衆人，善於教導，存心忍耐， <strong><mark>用溫柔勸戒那抵擋的人</mark></strong>，或者上帝給他們悔改的心，可以明白真道，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L22-25">提後 2:22-25</a>)</p></blockquote><blockquote><p>“若有人傳異教，不服從我們主耶穌基督純正的話與那合乎敬虔的道理， 他是自高自大，一無所知，<strong><mark>專好問難，爭辯言詞</mark></strong>，<strong><mark>從此就生出嫉妒、紛爭、毀謗、妄疑</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L3-4">提前 6:3-4</a>)</p></blockquote><blockquote><p>“你要使衆人回想這些事，在主面前囑咐他們：<strong><mark>不可爲言語爭辯</mark></strong>，這是沒有益處的，<strong><mark>只能敗壞聽見的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L14">提後 2:14</a>)</p></blockquote><blockquote><p>“<strong><mark>要遠避無知的辯論</mark></strong>和家譜的空談以及紛爭，並因律法而起的爭競，<strong><mark>因爲這都是虛妄無益的</mark></strong>。 <strong><mark>分門結黨的人</mark></strong>，警戒過一兩次，<strong><mark>就要棄絕他</mark></strong>。 因爲知道這等人已經背道，犯了罪，自己明知不是，還是去作。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L9-11">多 3:9-11</a>)</p></blockquote>
