  path: Qp3T_教導
  title: 教導
  copy_cover: true
  body: <blockquote><p>“當用各樣的智慧，把基督的道理豐豐富富的存在心裏，用詩章、頌詞，靈歌，<strong><mark>彼此教導，互相勸戒</mark></strong>，心被恩感，歌頌上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L16">西 3:16</a>)</p></blockquote><blockquote><p>“所以，<strong><mark>你們該彼此勸慰，互相建立</mark></strong>，正如你們素常所行的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L11">帖前 5:11</a>)</p></blockquote><blockquote><p>“總要趁著還有今日，<strong><mark>天天彼此相勸</mark></strong>，免得你們中間有人被罪迷惑，心裏就剛硬了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/3/#L13">希 3:13</a>)</p></blockquote><blockquote><p>“<strong><mark>又要彼此相顧，激發愛心，勉勵行善</mark></strong>。 你們不可停止聚會，好像那些停止慣了的人，<strong><mark>倒要彼此勸勉</mark></strong>。既知道那日子臨近，就更當如此。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L24-25">希 10:24-25</a>)</p></blockquote><blockquote><p>“<strong><mark>然而主的僕人不可爭競</mark></strong>；只要溫溫和和的待衆人，<strong><mark>善於教導</mark></strong>，存心忍耐， <strong><mark>用溫柔勸戒那抵擋的人</mark></strong>，或者上帝給他們悔改的心，可以明白真道，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L24-25">提後 2:24-25</a>)</p></blockquote>
