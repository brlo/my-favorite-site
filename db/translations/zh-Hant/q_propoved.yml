- src: апостолы-долго-учили-общины
  path: Qp4T_使徒長久地教導團體
  title: 使徒長久地教導團體
  copy_cover: true
  body: <p>使徒保羅教導亞西亞的長老們三年之久：</p><blockquote><p>“所以你們應當儆醒，記念我<strong><mark>三年之久晝夜不住的流淚，勸戒你們各人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L31">徒 20:31</a>)</p></blockquote><p>使徒保羅在以弗所教導基督徒兩年零三個月：</p><blockquote><p>“保羅進會堂放膽講道，<strong><mark>一連三個月</mark></strong>，辯論上帝國的事，勸化衆人。 後來，有些人心裏剛硬不信，在衆人面前毀謗這道。保羅就離開他們，也叫門徒與他們分離，便在推喇奴的學房天天辯論。 <strong><mark>這樣有兩年之久</mark></strong>，叫一切住在亞西亞的，無論是猶太人，是希利尼人，都聽見主的道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L8-10">徒 19:8-10</a>)</p></blockquote>
