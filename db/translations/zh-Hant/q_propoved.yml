- src: мало-проповедников
  path: Qp5T_工人少
  title: 工人少
  copy_cover: true
  body: <blockquote><p>“你們若遵行我的律例，謹守我的誡命， &lt;…&gt; 你們要追趕仇敵，他們必倒在你們刀下。 <strong><mark>你們五個人要追趕一百人，一百人要追趕一萬人</mark></strong>，仇敵必倒在你們刀下。 我要眷顧你們，使你們生養衆多，也要與你們堅定所立的約。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L3,7-9">利 26:3,7-9</a>)</p></blockquote><blockquote><p>“就對他們說：「<strong><mark>要收的莊稼多，作工的人少</mark></strong>。所以，<strong><mark>你們當求莊稼的主打發工人出去收他的莊稼</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L2">路 10:2</a>)</p></blockquote><blockquote><p>“於是對門徒說：「<strong><mark>要收的莊稼多，作工的人少</mark></strong>； 所以，<strong><mark>你們當求莊稼的主，打發工人出去收他的莊稼</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/9/#L37-38">太 9:37-38</a>)</p></blockquote>
