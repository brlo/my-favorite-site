  title: 安息日與主日
  copy_cover: true
  body: '<h2>安息日</h2><h3>上帝祝聖了安息日</h3><p>創造世界之後，上帝祝聖了第七日（安息日），但沒有設立誡命：</p><blockquote><p>“<strong><mark>上帝賜福給第七日，定爲聖日</mark></strong>；<strong><mark>因爲在這日上帝歇了他一切創造的工，就安息了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L3">創 2:3</a>)</p></blockquote><p>旁邊有許多上帝賜下其他命令的地方：</p><blockquote><p>“上帝就賜福給他們，<strong><mark>又對他們說</mark></strong>：「要生養衆多，遍滿地面，治理這地；也要管理海里的魚、空中的鳥和地上各樣行動的活物。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L28">創 1:28</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝說</mark></strong>：「看哪！我將遍地上一切結種子的菜蔬，和一切樹上所結有核的果子，全賜給你們作食物。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/1/#L29">創 1:29</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和華上帝吩咐他說</mark></strong>：「園中各樣樹上的果子，你可以隨意吃， 只是分別善惡樹上的果子，你不可吃，因爲你吃的日子必定死。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L16-17">創 2:16-17</a>)</p></blockquote><p>然而，關於安息日沒有賜下任何命令。創造諸日之後說到安息的是上帝，而不是人。上帝把人安置在伊甸園中是爲了勞動：</p><blockquote><p>“野地還沒有草木，田間的菜蔬還沒有長起來，因爲耶和華上帝還沒有降雨在地上，<strong><mark>也沒有人耕地</mark></strong>， &lt;…&gt; 耶和華上帝在東方的伊甸立了一個園子，<strong><mark>把所造的人安置在那裏</mark></strong>。 &lt;…&gt; 耶和華上帝將那人安置在伊甸園，<strong><mark>使他修理看守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L5,8,15">創 2:5,8,15</a>)</p></blockquote><p>在那永恆的神聖安息中——上帝如今所處其中（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L3">創 2:3</a>）——人們將來才能進入。而且並非所有人，只有上帝親自放進去的人：</p><blockquote><p>“<strong><mark>但我們已經相信的人得以進入那安息</mark></strong>，正如上帝所說：「我在怒中起誓說，『<strong><mark>他們斷不可進入我的安息</mark></strong>！』」其實造物之工，從創世以來已經成全了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/4/#L3">希 4:3</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/95/#L11">詩 95:11</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/3/#L11">希 3:11</a>)</p></blockquote><h3>安息日停止勞作之誡命的出現</h3><p>安息日停止勞作的誡命，是上帝在先知摩西的時代、與以色列民立約的時候首次設立的：</p><blockquote><p>“<strong><mark>當記念安息日，守爲聖日</mark></strong>。 <strong><mark>六日要勞碌作你一切的工</mark></strong>， <strong><mark>但第七日</mark></strong>是向耶和華你上帝當守的安息日。這一日你和你的兒女、僕婢、牲畜，並你城裏寄居的客旅，<strong><mark>無論何工都不可作</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L8-10">出 20:8-10</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L12-15">申 5:12-15</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L3">利 19:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>。)</em></p></blockquote><h3>設立安息日誡命的原因</h3><p>誡命的原因就在誡命的話語之後說明了。這一原因：以色列民出埃及的出走。</p><blockquote><p>“但第七日是向耶和華你上帝當守的安息日。這一日，你和你的兒女、僕婢、牛、驢、牲畜，並在你城裏寄居的客旅，無論何工都不可作，使你的僕婢可以和你一樣安息。 <strong><mark>你也要記念你在埃及地作過奴僕</mark></strong>；耶和華你上帝用大能的手和伸出來的膀臂<strong><mark>將你從那裏領出來</mark></strong>。<strong><mark>因此，耶和華你的上帝吩咐你守安息日</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L14-15">申 5:14-15</a>)</p></blockquote><p>賜給他們「安息日」，即賜給他們先前沒有的東西：</p><blockquote><p>“這樣，<strong><mark>我就使他們出埃及地</mark></strong>，領他們到曠野， <strong><mark>將我的律例賜給他們</mark></strong>，將我的典章指示他們；人若遵行，就必因此活著。 <strong><mark>又將我的安息日賜給他們</mark></strong>，好在我與他們中間爲證據，使他們知道我耶和華是叫他們成爲聖的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/20/#L10-12">結 20:10-12</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和華我們的上帝在何烈山與我們立約</mark></strong>。 這約不是與我們列祖立的，<strong><mark>乃是與我們今日在這裏存活之人立的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L2-3">申 5:2-3</a>)</p></blockquote><p>也有另一種解釋，指出上帝對第七日的祝聖：</p><blockquote><p>“<strong><mark>因爲六日之內，耶和華造天、地、海和其中的萬物</mark></strong>，第七日便安息。<strong><mark>所以耶和華賜福與安息日，定爲聖日</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L11">出 20:11</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/2/#L3">創 2:3</a>)</p></blockquote><p>然而，這一解釋雖指出了聯繫，但這裏說明的是祝聖安息日的原因：「所以耶和華賜福」（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L11">出 20:11</a>），而不是誡命的原因。而在另一節經文中，則最明確地給出了誡命本身的原因：「你也要記念你在埃及地作過奴僕……將你從那裏領出來……因此，耶和華你的上帝吩咐你守安息日」（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L14-15">申 5:14-15</a>）。</p><p>這樣，安息日的停止勞作是因以色列民脫離埃及奴役的出走而設立的，雖然也指出了它與神聖安息的聯繫。</p><h3>誡命之律已被廢除</h3><p>律法是在基督來臨之前、爲一段時期而賜下的：</p><blockquote><p>“這樣說來，律法是爲什麼有的呢？<strong><mark>原是爲過犯添上的</mark></strong>，<strong><mark>等候那蒙應許的子孫來到</mark></strong>，並且是藉天使經中保之手設立的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L19">加 3:19</a>)</p></blockquote><p>誡命之律已被基督的教導廢除：</p><blockquote><p>“因他使我們和睦，將兩下合而爲一，<strong><mark>拆毀了中間隔斷的牆</mark></strong>， 而且<strong><mark>以自己的身體廢掉冤仇</mark></strong>，<strong><mark>就是那記在律法上的規條</mark></strong>，爲要將兩下藉着自己造成一個新人，如此便成就了和睦。 既在十字架上滅了冤仇，便藉這十字架使兩下歸爲一體，與上帝和好了，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><p>基督徒已從律法中釋放：</p><blockquote><p>“但我們既然在捆我們的律法上死了，<strong><mark>現今就脫離了律法</mark></strong>，叫我們服事主，<strong><mark>要按著心靈的新樣，不按著儀文的舊樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L6">羅 7:6</a>)</p></blockquote><p>摩西律法廢除的詳細解釋：<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">摩西律法的廢除</a>。</p><h3>基督保護使徒免受干犯安息日的指控</h3><p>法利賽人指摘主和使徒們干犯安息日。基督稱使徒們無罪：</p><blockquote><p>“法利賽人看見，就對耶穌說：「<strong><mark>看哪，你的門徒作安息日不可作的事了</mark></strong>！」 &lt;…&gt; 『我喜愛憐恤，不喜愛祭祀。』你們若明白這話的意思，<strong><mark>就不將無罪的當作有罪的了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L2,7">太 12:2,7</a>)</p></blockquote><h3>使徒禁止因不守安息日而論斷基督徒</h3><blockquote><p>“<strong><mark>所以不拘在飲食上，或節期、月朔、安息日，都不可讓人論斷你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L16">西 2:16</a>)</p></blockquote><h2>主日</h2><h3>主顯現的日子</h3><ol><li><p>主耶穌基督在七日的第一日——主日——復活了，並向沒有多馬的門徒們顯現（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L19">約 20:19</a>）。</p></li><li><p>在主日，他向持香的婦女們顯現（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L1,9">太 28:1,9</a>）、向抹大拉的馬利亞顯現（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L9">可 16:9</a>）、向使徒彼得顯現（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L34">路 24:34</a>）、向使徒革流巴和路加顯現（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L13-32">路 24:13-32</a>）。</p></li><li><p>爲多馬的緣故，救主恰好過了一週再次顯現，又是在主日（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L26">約 20:26</a>）。</p></li></ol><h3>聚會與舉行聖餐禮的日子</h3><p>使徒們在特羅亞住了七天，而在七天之中，他們不是在安息日、而是在主日聚會舉行事奉聖禮並擘餅：</p><blockquote><p>“過了除酵的日子，我們從腓立比開船，五天到了特羅亞，和他們相會，<strong><mark>在那裏住了七天</mark></strong>。 七日的第一日，我們聚會擘餅的時候，保羅因爲要次日起行，就與他們講論，直講到半夜。 我們聚會的那座樓上，有好些燈燭。 有一個少年人，名叫猶推古，坐在窗臺上睏倦沉睡。保羅講了多時，少年人睡熟了，就從三層樓上掉下去；扶起他來，已經死了。 保羅下去，伏在他身上，抱著他說：「你們不要發慌，他的靈魂還在身上。」 保羅又上去，擘餅，喫了，談論許久，直到天亮，這才走了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L6-11">徒 20:6-11</a>) <em>(在特羅亞住了整整七天。 :: !七日的第一日，我們聚會擘餅的時候 ~~ 有七天，但擘餅聚會正是在主日。 :: !我們聚會的那座樓上，有好些燈燭 ~~ 隆重的聚會。)</em></p></blockquote><p>使徒請求在主日（聚會之日）抽出錢來，幫助有缺乏的人：</p><blockquote><p>“<strong><mark>每逢七日的第一日，各人要照自己的進項抽出來留著</mark></strong>，免得我來的時候現湊。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/16/#L2">林前 16:2</a>)</p></blockquote><h2>批評</h2><p>某些脫離教會的團體（主要是基督復臨安息日會教派），違揹誡命（<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L16">西 2:16</a>），不但指摘教會不守安息日，還指摘教會更隆重地慶祝主日，說主日不應當慶祝。</p><p>在東正教會中，人在一生所有的日子都蒙召行善，而在特別的日子（安息日，尤其是主日），不但以個人的善行、更以<strong>共同的事業</strong>（源自希臘文 λειτουργία——事奉聖禮）來慶祝，也就是以共同的聚會舉行事奉聖禮來慶祝主日。其餘的日子也舉行事奉聖禮，但在安息日、尤其是在主日舉行特別的、更隆重的事奉聖禮。</p><p>對基督徒來說，最重要的事件是基督的復活——主耶穌基督從死人中復活。這一日被稱爲諸慶節之慶節、諸凱旋之凱旋，因爲：</p><blockquote><p>“<strong><mark>若基督沒有復活，我們所傳的便是枉然</mark></strong>，你們所信的也是枉然！ &lt;…&gt; 基督若沒有復活，<strong><mark>你們的信便是徒然，你們仍在罪裏</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L14,17">林前 15:14,17</a>)</p></blockquote><p>如上所示，使徒們正是在主日舉行事奉聖禮。這一日成了與復活之主相會的喜樂之日。最早的基督徒也是如此：<a href="https://bibleox.com/ru/ru/w/Евхаристия_в_воскресенье">主日的聖餐禮</a></p><p>還有人指摘君士坦丁皇帝（四世紀），說他似乎把休息日從安息日改到了主日（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L6-11">徒 20:6-11</a>）。然而，君士坦丁皇帝設立了每週第一個休息日——主日，沒有對安息日作任何指示（<a href="https://bibleox.com/ru/ru/w/Воскресенье_выходной_Указ_императора_Константина">詳見</a>）。在這一敕令之前，羅馬帝國沒有普遍的每週休息日。</p><p>這樣，這種批評至少可以說是不成立的。</p>'
