  path: Qc8T_教會——新的以色列
  title: 教會——新的以色列
  copy_cover: true
  body: <h2>基督是教會的根</h2><blockquote><p>“你們既然接受了<strong><mark>主基督耶穌</mark></strong>，就當遵他而行； <strong><mark>在他裏面</mark></strong><strong><mark>生根建造</mark></strong>，信心堅固，正如你們所領的教訓，感謝的心也更增長了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L6-7">西 2:6-7</a>)</p></blockquote><blockquote><p>“<strong><mark>我耶穌</mark></strong>差遣我的使者爲衆教會將這些事向你們證明。<strong><mark>我是大衛的根</mark></strong>，又是他的後裔。我是明亮的晨星。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L16">啟 22:16</a>)</p></blockquote><h3>基督也是餵養枝子的葡萄樹</h3><blockquote><p>“<strong><mark>我是真葡萄樹</mark></strong>，我父是栽培的人。 凡屬我不結果子的枝子，他就剪去；凡結果子的，他就修理幹淨，使枝子結果子更多。 現在你們因我講給你們的道，已經乾淨了。 <strong>你們要常在我裏面</strong>，我也常在你們裏面。枝子若不常在葡萄樹上，自己就不能結果子；你們若不常在我裏面，也是這樣。 <strong><mark>我是葡萄樹，你們是枝子</mark></strong>，常在我裏面的，我也常在他裏面，這人就多結果子；因爲離了我，你們就不能作什麼。 <strong>人若不常在我裏面，就像枝子丟在外面枯乾</strong>，人拾起來，扔在火裏燒了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L1-6">約 15:1-6</a>)</p></blockquote><h3>基督也是教會的頭</h3><blockquote><p>“<strong><mark>他也是教會全體之首</mark></strong>，他是元始，是從死裏首先復生的，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“又將萬有服在他的腳下，使他<strong><mark>爲教會作萬有之首</mark></strong>。 <strong>教會是他的身體</strong>，是那充滿萬有者所充滿的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>不持定元首</mark></strong>。全身既然靠著他，筋節得以相助聯絡，就因上帝大得長進。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L19">西 2:19</a>)</p></blockquote><h2>以色列的一部分（枝子）從基督（根）上折斷了</h2><p>以色列的一部分折斷了，而外邦各族被接在根（基督）上。被折下的猶太人不被稱爲根上折下的部分，而被稱爲折下的枝子：</p><blockquote><p>“所獻的新面若是聖潔，全團也就聖潔了；樹根若是聖潔，樹枝也就聖潔了。 若<strong><mark>有幾根枝子被折下來</mark></strong>，<strong>你這野橄欖得接在其中</strong>，<strong><mark>一同得著橄欖根的肥汁</mark></strong>， 你就不可向舊枝子誇口；若是誇口，當知道不是你托著根，乃是根托著你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/11/#L16-18">羅 11:16-18</a>)</p></blockquote><blockquote><p>“又有以賽亞放膽說：『<strong><mark>沒有尋找我的，我叫他們遇見</mark></strong>；沒有訪問我的，我向他們顯現。』 <strong><mark>至於以色列人</mark></strong>，他說：『<strong><mark>我整天伸手招呼那悖逆頂嘴的百姓</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/10/#L20-21">羅 10:20-21</a>)</p></blockquote><blockquote><p>“我且說，上帝棄絕了他的百姓嗎？<strong>斷乎沒有</strong>！<strong>因爲我也是以色列人</strong>，亞伯拉罕的後裔，屬便雅憫支派的。 &lt;…&gt; 上帝的回話是怎麼說的呢？他說：『<strong>我爲自己留下七千人，是未曾向巴力屈膝的</strong>。』 如今也是這樣，照著揀選的恩典，<strong><mark>還有所留的餘數</mark></strong>。 &lt;…&gt; 這是怎麼樣呢？以色列人所求的，他們沒有得著，<strong><mark>惟有蒙揀選的人得著了，其餘的就成了頑梗不化的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/11/#L1,4-5,7">羅 11:1,4-5,7</a>)</p></blockquote><h2>在折下的枝子（以色列的一部分）的位置上，新的枝子（其餘的萬民）接在根上</h2><blockquote><p>“但耶書侖漸漸肥胖、粗壯，光潤，踢跳奔跑，<strong>便離棄造他的上帝</strong>，輕看救他的磐石。 敬拜別神，觸動上帝的憤恨，行可憎惡的事，惹了他的怒氣。 所祭祀的鬼魔，並非真神，乃是素不認識的神，是近來新興的，是你列祖所不畏懼的。 <strong>你輕忽生你的磐石</strong>；忘記產你的上帝。 耶和華看見他的兒女惹動他，就厭惡他們； 說：「<strong><mark>我要向他們掩面</mark></strong>，看他們的結局如何；他們本是極乖僻的族類，心中無誠實的兒女。 他們以那不算爲神的觸動我的憤恨；以虛無的神惹了我的怒氣。<strong><mark>我也要以那不成子民的</mark></strong>觸動他們的憤恨；以愚昧的國民惹了他們的怒氣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/32/#L15-21">申 32:15-21</a>)</p></blockquote><blockquote><p>“耶和華說：「<strong>日子將到</strong>，我要與以色列家和猶大家<strong><mark>另立新約</mark></strong>。 <strong><mark>不像我拉著他們祖宗的手</mark></strong>，領他們出埃及地的時候，與他們所立的約。我雖作他們的丈夫，<strong><mark>他們卻背了我的約</mark></strong>。」這是耶和華說的。 耶和華說：「那些日子以後，我與以色列家所立的約乃是這樣：<strong>我要將我的律法放在他們裏面，寫在他們心上</strong>。<strong>我要作他們的上帝，他們要作我的子民</strong>。 他們各人不再教導自己的鄰舍和自己的弟兄說：『你該認識耶和華。』因爲他們從最小的到至大的，都必認識我。我要赦免他們的罪孽，不再記念他們的罪惡。」這是耶和華說的。 那使太陽白日發光，使星月有定例，黑夜發亮，又攪動大海，使海中波浪匉訇的－萬軍之耶和華是他的名。他如此說： 「這些定例若能在我面前廢掉，以色列的後裔也就在我面前斷絕，永遠不再成國。」這是耶和華說的。 耶和華如此說：「若能量度上天，尋察下地的根基，我就因以色列後裔一切所行的棄絕他們。」這是耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/31/#L31-37">耶 31:31-37</a>)</p></blockquote><blockquote><p>“所獻的新面若是聖潔，全團也就聖潔了；樹根若是聖潔，樹枝也就聖潔了。 若有幾根枝子被折下來，<strong><mark>你這野橄欖得接在其中</mark></strong>，<strong><mark>一同得著橄欖根的肥汁</mark></strong>， 你就不可向舊枝子誇口；若是誇口，當知道不是你托著根，乃是根托著你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/11/#L16-18">羅 11:16-18</a>)</p></blockquote><blockquote><p>“「素來沒有訪問我的，現在求問我沒有尋找我的，我叫他們遇見；<strong><mark>沒有稱爲我名下的，我對他們說</mark></strong>：『<strong><mark>我在這裏！我在這裏！</mark></strong>』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/65/#L1">賽 65:1</a>)</p></blockquote><blockquote><p>“我必將他種在這地。<strong>素不蒙憐憫的，我必憐憫</strong>；<strong><mark>本非我民的</mark></strong>，我必對他說：『你是我的民。』他必說：『你是我的上帝。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/os/2/#L23">何 2:23</a>)</p></blockquote><blockquote><p>“這器皿就是我們被上帝所召的，<strong><mark>不但是從猶太人中，也是從外邦人中</mark></strong>。這有什麼不可呢？ <strong>就像上帝在何西阿書上說</strong>：『<strong><mark>那本來不是我子民的</mark></strong>，我要稱爲『我的子民』；<strong><mark>本來不是蒙愛的</mark></strong>，我要稱爲『蒙愛的』。 從前在什麼地方對他們說，『你們不是我的子民』，將來就在那裏稱他們爲『<strong><mark>永生上帝的兒子</mark></strong>』。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/9/#L24-26">羅 9:24-26</a>)</p></blockquote><h2>在教會裏，民族已不再有意義</h2><p>使徒在羅馬書 11:16-18 消除了一種極端：對猶太人的輕視和自高。另一種極端則是在他們面前屈膝。中間的道路是：在教會裏沒有民族之分，在那裏人人彼此都是弟兄；凡加入教會的人，無論民族、無論上帝安排他在哪裏由誰出生，也都成爲弟兄：</p><blockquote><p>“在此並不分<strong><mark>希利尼人、猶太人</mark></strong>、受割禮的、未受割禮的、<strong><mark>化外人</mark></strong>、<strong><mark>西古提人</mark></strong>、<strong>爲奴的、自主的</strong>，惟有基督是包括一切，又住在各人之內。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L11">西 3:11</a>)</p></blockquote><h2>在教會裏，猶太人和外邦人之間<strong>毫無</strong>分別</h2><blockquote><p>“辯論已經多了，彼得就起來說：「諸位弟兄，你們知道上帝早已在你們中間揀選了我，叫外邦人從我口中得聽福音之道，而且相信。 知道人心的上帝也爲他們作了見證，賜聖靈給他們，正如給我們一樣； 又藉着信潔淨了他們的心，並<strong><mark>不分他們、我們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L7-9">徒 15:7-9</a>)</p></blockquote><blockquote><p>“你們從前遠離上帝的人，如今卻在基督耶穌裏，靠著他的血，已經得親近了。 因他使我們和睦，<strong><mark>將兩下合而爲一</mark></strong>，拆毀了中間隔斷的牆， <strong>而且以自己的身體廢掉冤仇</strong>，就是那記在律法上的規條，<strong><mark>爲要將兩下藉着自己造成一個新人</mark></strong>，如此便成就了和睦。 既在十字架上滅了冤仇，便藉這十字架<strong><mark>使兩下歸爲一體</mark></strong>，與上帝和好了， &lt;…&gt; 因爲我們兩下藉着他被一個聖靈所感，<strong><mark>得以進到父面前</mark></strong>。 &lt;…&gt; 並且被建造在使徒和先知的根基上，<strong>有基督耶穌自己爲房角石</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L13-16,18,20">弗 2:13-16,18,20</a>)</p></blockquote><h2>以色列民被揀選，是爲了救主臨到世界。這一目的已經達成。</h2><p><a href="https://bibleox.com/ru/ru/w/ветхий-завет#HH-Обещание-пришествия-Спасителя">舊約——救主來臨的應許</a></p><h2>亞伯拉罕的子孫——就是信徒</h2><blockquote><p>“正如『亞伯拉罕信上帝，這就算爲他的義』。 所以你們要知道，<strong><mark>那以信爲本的人，就是亞伯拉罕的子孫</mark></strong>。 並且聖經既然預先看明，上帝要叫外邦人因信稱義，就早已傳福音給亞伯拉罕，說，『<strong>萬國</strong>都必因你得福。』 <strong>可見那以信爲本的人和有信心的亞伯拉罕一同得福</strong>。 <strong>凡以行律法爲本的，都是被咒詛的</strong>，因爲經上記著：『凡不常照律法書上所記一切之事去行的，就被咒詛。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L6-10">加 3:6-10</a>)</p></blockquote><h2>猶太人——是在裏面（屬靈上）是猶太人，而不是在外面</h2><blockquote><p>“因爲<strong>外面作猶太人的，不是真猶太人</strong>；外面肉身的割禮，也不是真割禮。 <strong><mark>惟有裏面作的，纔是真猶太人</mark></strong>；真割禮也是心裏的，在乎靈，不在乎儀文。這人的稱讚不是從人來的，乃是從上帝來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/2/#L28-29">羅 2:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>受割禮</mark></strong><strong><mark>不受割禮</mark></strong>都無關緊要，要緊的就是作新造的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/6/#L15">加 6:15</a>)</p></blockquote><h2>關於新約司祭職的預言：從<strong>一切</strong>民族中</h2><p>在舊約的教會裏，司祭只從猶太民族中立，從利未支派、亞倫的家系中立。但在新約的教會裏，司祭將從一切民族中立，而不只是從猶太人（亞倫的家系）中：</p><blockquote><p>“「我知道他們的行爲和他們的意念。時候將到，<strong><mark>我必將萬民萬族</mark></strong>聚來，看見我的榮耀。 我要顯神跡在他們中間，逃脫的我要差到列國去，就是到他施、普勒、拉弓的路德和土巴、雅完，並<strong>素來沒有聽見我名聲</strong>、沒有看見我榮耀遼遠的海島，他們必將我的榮耀傳揚在列國中。 他們必將你們的弟兄從列國中送回，使他們或騎馬，或坐車，坐轎，騎騾子，騎獨峯駝，到我的聖山耶路撒冷，作爲供物獻給耶和華，好像以色列人用潔淨的器皿盛供物奉到耶和華的殿中。」這是耶和華說的。 耶和華說：「<strong><mark>我也必從他們中間取人爲祭司，爲利未人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L18-21">賽 66:18-21</a>)</p></blockquote>
