  title: 教會起初就領受了真理的充實
  copy_cover: true
  body: <h2>真信仰已經一次交付給教會</h2><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要<strong>爲從前</strong><strong><mark>一次</mark></strong><strong>交付聖徒的真道竭力的爭辯</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote><blockquote><p>“論到你們，<strong><mark>務要將那從起初所聽見的常存在心裏</mark></strong>。<strong><mark>若將從起初所聽見的存在心裏</mark></strong>，你們就必住在子裏面，也必住在父裏面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L24">約壹 2:24</a>)</p></blockquote><p>所以教會被稱爲豐盛（充實）：</p><blockquote><p>“又將萬有服在他的腳下，使他爲<strong>教會</strong>作萬有之首。 教會是他的身體，是那<strong><mark>充滿萬有者所充滿的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><p>教會維護這真理：</p><blockquote><p>“永生上帝的教會，<strong><mark>真理的柱石和根基</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L15">提前 3:15</a>)</p></blockquote><h2>真信仰是基督上帝親自、明明地賜下的</h2><p>這信仰是基督從父領受並傳下來的：</p><blockquote><p>“因爲<strong><mark>你所賜給我的道，我已經賜給他們</mark></strong>，他們也領受了；又確實知道我是從你出來的，並且信你差了我來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L8">約 17:8</a>)</p></blockquote><p>應當常在的，正是基督所教導的信仰：</p><blockquote><p>“凡越過基督的教訓不常守著的，就沒有上帝；<strong>常守這教訓的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><h2>不可教導別的</h2><blockquote><p>“我往馬其頓去的時候，曾勸你仍住在以弗所，好囑咐那幾個人<strong><mark>不可傳異教</mark></strong>， 也不可聽從荒渺無憑的話語和無窮的家譜。這等事只生辯論，並不發明上帝在信上所立的章程。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L3-4">提前 1:3-4</a>)</p></blockquote><blockquote><p>“<strong><mark>你在許多見證人面前聽見我所教訓的</mark></strong>，<strong><mark>也要交托那忠心能教導別人的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/2/#L2">提後 2:2</a>)</p></blockquote><blockquote><p>“我稱讚你們，因你們凡事記念我，又<strong><mark>堅守我所傳給你們的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L2">林前 11:2</a>)</p></blockquote><blockquote><p>“弟兄們，我如今把先前所傳給你們的福音，告訴你們知道。這福音你們也領受了，又靠著站立得住； 並且你們若不是徒然相信，<strong><mark>能以持守我所傳給你們的</mark></strong>，就必因這福音得救。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/15/#L1-2">林前 15:1-2</a>)</p></blockquote><blockquote><p>“弟兄們，我還有話說：我們靠著主耶穌求你們、勸你們，<strong><mark>你們既然受了我們的教訓</mark></strong>，知道該怎樣行，可以討上帝的喜悅，就要照你們現在所行的，<strong><mark>更加勉勵</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/4/#L1">帖前 4:1</a>)</p></blockquote><blockquote><p>“所以弟兄們，你們要站立得穩，<strong><mark>凡所領受的教訓，不拘是我們口傳的，是信上寫的，都要堅守</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L15">帖後 2:15</a>)</p></blockquote><h2>會有人試圖歪曲一次所賜的信仰</h2><blockquote><p>“堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。 因爲<strong><mark>有許多人不服約束</mark></strong>，說虛空話欺哄人，那奉割禮的更是這樣。 這些人的口總要堵住。他們因貪不義之財，將不該教導的教導人，敗壞人的全家。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“我只怕你們的心或偏於邪，失去那向基督所存純一清潔的心，就像蛇用詭詐誘惑了夏娃一樣。 假如有人來<strong><mark>另傳一個耶穌</mark></strong>，不是我們所傳過的，或者你們另受一個靈，不是你們所受過的；或者<strong><mark>另得一個福音</mark></strong>，不是你們所得過的，你們容讓他也就罷了。 &lt;…&gt; 那等人是假使徒，行事詭詐，裝作基督使徒的模樣。 這也不足爲怪，因爲連撒但也裝作光明的天使。 所以，他的差役若裝作仁義的差役，也不算希奇。他們的結局必然照著他們的行爲。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L3-4,13-15">林後 11:3-4,13-15</a>)</p></blockquote><h2>要遠離教導新信仰的人，不可接受基督所留下的信仰以外的教導</h2><blockquote><p>“<strong>若有人傳異教</strong>，不服從我們主耶穌基督純正的話與那合乎敬虔的道理， <strong>他是自高自大，一無所知</strong>，專好問難，爭辯言詞，從此就生出嫉妒、紛爭、毀謗、妄疑， 並那壞了心術、失喪真理之人的爭競。他們以敬虔爲得利的門路。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L3-5">提前 6:3-5</a>) <em>(俄文原文6:5末有“要遠離這樣的人”一句，和合本無)</em></p></blockquote><blockquote><p>“提摩太啊，你要<strong>保守所託付你的</strong>，<strong><mark>躲避世俗的虛談</mark></strong>和那敵真道、似是而非的學問。 已經有人自稱有這學問，就偏離了真道。願恩惠常與你們同在。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L20-21">提前 6:20-21</a>)</p></blockquote><blockquote><p>“弟兄們，我們奉主耶穌基督的名吩咐你們：凡有弟兄不按規矩而行，不遵守從我們所受的教訓，<strong><mark>就當遠離他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L6">帖後 3:6</a>)</p></blockquote><blockquote><p>“弟兄們，那些離間你們、叫你們跌倒、背乎所學之道的人，我勸你們要<strong><mark>留意躲避他們</mark></strong>。 <strong>因爲這樣的人不服事我們的主基督</strong>，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><blockquote><p>“若有人到你們那裏，不是傳這教訓，<strong><mark>不要接他到家裏</mark></strong>，也不要問他的安。 因爲問他安的就在他的惡行上有分。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L10-11">約贰 1:10-11</a>)</p></blockquote><blockquote><p>“但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，<strong><mark>他就應當被咒詛</mark></strong>。 我們已經說了，現在又說：若有人傳福音給你們，與你們所領受的不同，<strong><mark>他就應當被咒詛</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/1/#L8-9">加 1:8-9</a>)</p></blockquote><p><strong>絕罰</strong>（希臘文 ἀνάθεμα）——逐出教會。</p><h2>責備對聖傳的歪曲（異端）</h2><blockquote><p>“有些人你們要從火中搶出來、搭救他們；有些人你們要存懼怕的心憐憫他們；連那被情慾沾染的衣服也當厭惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L23">猶 1:23</a>) <em>(俄文原文此節有“要責備”一詞，和合本無)</em></p></blockquote><blockquote><p>“那闇昧無益的事，不要與人同行，<strong>倒要責備</strong>行這事的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L11">弗 5:11</a>)</p></blockquote><blockquote><p>“堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人<strong><mark>駁倒</mark></strong>了。 因爲有許多人不服約束，說虛空話欺哄人，那奉割禮的更是這樣。 這些人的口總要<strong>堵住</strong>。他們因貪不義之財，將不該教導的教導人，敗壞人的全家。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L9-11">多 1:9-11</a>)</p></blockquote><blockquote><p>“<strong>至死要爲真理奮鬥</strong>，上主天主必要助你作戰。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/4/#L33">德 4:33</a>)</p></blockquote><blockquote><p>“親愛的弟兄啊，我想盡心寫信給你們，論我們同得救恩的時候，就不得不寫信勸你們，要<strong>爲從前</strong><strong><mark>一次</mark></strong><strong>交付聖徒的真道竭力的爭辯</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L3">猶 1:3</a>)</p></blockquote><h2>真理的聖靈要引導明白的</h2><p>在差遣聖靈之前、聖靈降在使徒身上之前，基督應許說：當聖靈被差到使徒那裏時，他要幫助他們記起並明白基督對他們說過的一切：</p><blockquote><p>“但保惠師，就是父因我的名所要差來的聖靈，他要將一切的事指教你們，並且要<strong><mark>叫你們想起我對你們所說的一切話</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L26">約 14:26</a>)</p></blockquote><blockquote><p>“我還有好些事要告訴你們，<strong><mark>但你們現在擔當不了</mark></strong>。 只等真理的聖靈來了，<strong><mark>他要引導你們明白</mark></strong><strong><mark>一切的真理</mark></strong>，因爲他不是憑自己說的，乃是把他所聽見的都說出來，並要把將來的事告訴你們。 他要榮耀我，因爲<strong><mark>他要將受於我的告訴你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L12-14">約 16:12-14</a>)</p></blockquote>
  meta_desc: 教會起初就被給予了真理的充實
