  title: 教會——看得見的合一
  copy_cover: true
  body: <h2>前言</h2><p>首先要指出的是：聖經裏沒有任何一個建立自己“教會”、自立爲牧人的例子，也沒有任何這樣的依據。基督建立了一個看得見的教會，並表達了關於她合一的旨意。</p><h2>基督和使徒關於教會看得見之合一的旨意</h2><blockquote><p>“我不但爲這些人<strong><mark>祈求</mark></strong>，也爲那些因他們的話信我的人祈求， <strong><mark>使他們都合而爲一</mark></strong>；正如你父在我裏面，我在你裏面，<strong><mark>使他們也在我們裏面</mark></strong>，<strong><mark>叫世人可以信你差了我來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，<strong><mark>勸你們</mark></strong><strong><mark>都說一樣的話</mark></strong>。你們中間也<strong><mark>不可分黨</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。 因爲革來氏家裏的人曾對我提起弟兄們來，說<strong>你們中間有紛爭</strong>。 我的意思就是你們各人說：『我是屬保羅的』，『我是屬亞波羅的』，『我是屬磯法的』，『我是屬基督的』。 <strong>基督是分開的嗎</strong>？保羅爲你們釘了十字架嗎？你們是奉保羅的名受了洗嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10-13">林前 1:10-13</a>)</p></blockquote><blockquote><p>“有說：「我是屬保羅的。」有說：「我是屬亞波羅的。」<strong><mark>這豈不是你們和世人一樣嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L4">林前 3:4</a>)</p></blockquote><p>上帝安置身體（教會）的肢體，爲使身體沒有分裂，而是彼此相顧，同受苦，同快樂：</p><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong>都從一位聖靈受洗，成了一個身體</strong>，飲於一位聖靈。 <strong><mark>身子原不是一個肢體，乃是許多肢體</mark></strong>。 &lt;…&gt; <strong><mark>眼不能對手說</mark></strong>：「我用不著你。」頭也不能對腳說：「我用不著你。」 不但如此，身上肢體，人以爲軟弱的，更是不可少的。 身上肢體，我們看爲不體面的，越發給它加上體面；不俊美的，越發得著俊美。 我們俊美的肢體，自然用不著裝飾；但<strong><mark>上帝配搭這身子</mark></strong>，把加倍的體面給那有缺欠的肢體， <strong><mark>免得身上分門別類</mark></strong>，<strong><mark>總要肢體彼此相顧</mark></strong>。 <strong><mark>若一個肢體受苦，所有的肢體就一同受苦</mark></strong>；若一個肢體得榮耀，所有的肢體就一同快樂。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13-14,21-26">林前 12:13-14,21-26</a>)</p></blockquote><p>這些不同的肢體是什麼？——就是教會裏各種不同的事奉和恩賜：</p><blockquote><p>“<strong>就如身子是一個，卻有許多肢體</strong>；而且肢體雖多，仍是一個身子。基督也是這樣。 &lt;…&gt; <strong><mark>身子原不是一個肢體，乃是許多肢體</mark></strong>。 &lt;…&gt; <strong><mark>你們就是基督的身子</mark></strong>，並且各自作肢體。 <strong><mark>上帝在教會所設立的</mark></strong>：第一是<strong>使徒</strong>，第二是<strong>先知</strong>，第三是<strong>教師</strong>，其次是<strong>行異能的</strong>，再次是得恩賜<strong>醫病的</strong>，幫助人的，治理事的，<strong>說方言的</strong>。 豈都是使徒嗎？豈都是先知嗎？豈都是教師嗎？豈都是行異能的嗎？ 豈都是得恩賜醫病的嗎？豈都是說方言的嗎？豈都是<strong>繙方言的</strong>嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L12,14,27-30">林前 12:12,14,27-30</a>)</p></blockquote><p>這樣，上帝安置這一切的事奉和恩賜，爲使身體沒有分裂；使徒在書信開頭就防止了分裂（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10-13">林前 1:10-13</a>）。也就是說，上帝不但願意合一（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>），而且親自照顧這合一。看，使徒被上帝立爲僕人，維護看得見的合一，禁止哥林多人制造看得見的分裂。</p><p>既然合一是基督的旨意，就要明白：得救的是遵行上帝旨意的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L21">太 7:21</a>）。</p><h2>敵基督的違揹基督的旨意，明顯走出教會的邊界</h2><p>敵基督的從使徒的團體中出去：</p><blockquote><p>“小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來，<strong><mark>現在已經有好些敵基督的出來了</mark></strong>，從此我們就知道如今是末時了。 <strong><mark>他們從我們中間出去，卻不是屬我們的</mark></strong>；若是屬我們的，就必仍舊與我們同在；他們出去顯明都不是屬我們的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18-19">約壹 2:18-19</a>)</p></blockquote><p>他們服事的<strong>不是</strong>基督：</p><blockquote><p>“弟兄們，那些<strong><mark>離間你們、叫你們跌倒</mark></strong>、背乎所學之道的人，我勸你們要留意躲避他們。 因爲這樣的人<strong><mark>不服事我們的主基督</mark></strong>，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><h2>教會起初看得見的合一</h2><h3>外人——另立一旁</h3><p>教會在起初就有完全確定的看得見的邊界：</p><blockquote><p>“<strong>其餘的人</strong>沒有一個敢貼近他們，百姓卻尊重他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L13">徒 5:13</a>)</p></blockquote><h3>共同的財物</h3><p>教會當時是一個一體的團體：</p><blockquote><p>“那許多信的人都是<strong>一心一意</strong>的，沒有一人說他的東西有一樣是自己的，<strong>都是大家公用</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L32">徒 4:32</a>)</p></blockquote><h3>共同解決有爭議的問題</h3><p>教會有共同的問題，並且一同解決，聚集在完全確定的、看得見的會議上：</p><blockquote><p>“<strong>使徒和長老，聚會商議這事</strong>。 &lt;…&gt; 那時，<strong>使徒和長老並全教會定意</strong>從他們中間揀選人，差他們和保羅、巴拿巴同往安提阿去。所揀選的就是稱呼巴撒巴的猶大和西拉；這兩個人在弟兄中是作首領的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L6,22">徒 15:6,22</a>)</p></blockquote><h3>共同的規矩</h3><p>教會有確定的、大家共同的規矩：</p><blockquote><p>“他們<strong>經過各城</strong>，<strong>把耶路撒冷使徒和長老所定的條規交給門徒遵守</strong>。 於是衆教會信心越發堅固，人數天天加增。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/16/#L4-5">徒 16:4-5</a>)</p></blockquote><h3>禁止分門別類</h3><p>在教會裏，任何分裂的企圖都被制止：</p><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，<strong><mark>勸你們</mark></strong><strong><mark>都說一樣的話</mark></strong>。你們中間也<strong><mark>不可分黨</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。 因爲革來氏家裏的人曾對我提起弟兄們來，說你們中間有紛爭。 我的意思就是你們各人說：『我是屬保羅的』，『我是屬亞波羅的』，『我是屬磯法的』，『我是屬基督的』。 基督是分開的嗎？保羅爲你們釘了十字架嗎？你們是奉保羅的名受了洗嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10-13">林前 1:10-13</a>)</p></blockquote><h3>一個信仰和聖奧祕</h3><p>在教會裏只有一個確定的、大家共同的信仰：</p><blockquote><p>“一主，<strong>一信</strong>，一洗，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L5">弗 4:5</a>)</p></blockquote><blockquote><p>“凡<strong>越過</strong><strong><mark>基督的教訓</mark></strong><strong>不常守著的，就沒有上帝</strong>；<strong>常守這教訓的</strong>，就有父又有子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L9">約贰 1:9</a>)</p></blockquote><p>如救主所說：這信仰是按使徒的話：</p><blockquote><p>“我不但爲這些人祈求，也爲那些<strong>因他們的話</strong>信我的人祈求，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20">約 17:20</a>)</p></blockquote><p>教會知道，將來會出現想離開這唯一信仰的人。這些人不能被稱爲教會：</p><blockquote><p>“他們曾對你們說過：『末世必有好譏誚的人隨從自己不敬虔的私欲而行。』 這就是那些<strong>引人結黨</strong>、屬乎血氣、沒有聖靈的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L18-19">猶 1:18-19</a>)</p></blockquote><h3>一個司祭的等次</h3><blockquote><p>“請教會的長老來。 他們來了，保羅就說：「你們知道，自從我到亞西亞的日子以來，在你們中間始終爲人如何， &lt;…&gt; <strong><mark>聖靈立你們作全羣的監督</mark></strong>，你們就當爲自己謹慎，也爲全羣謹慎，<strong>牧養上帝的教會</strong>，就是他用自己血所買來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L17-18,28">徒 20:17-18,28</a>)</p></blockquote><p>關於司祭職，詳見<a href="https://bibleox.com/ru/ru/w/Таинство-Священства">司祭聖奧祕</a>。</p><p>---</p><p>這樣，教會是一個完全確定的看得見的團體（機體），有唯一一個共同的使徒信仰，有大家共同的規矩，有使徒所立的、在一切事上合一的帶領者；教會的肢體之間沒有任何阻隔。</p><h2>教會的邊界與聖餐禮</h2><p>舊約的教會不像新約的教會那樣被稱爲基督的身體。新約的教會是一個奧祕的神人機體，是<a href="https://bibleox.com/ru/ru/w/Церковь">基督的身體</a>。所以，教會的邊界就在身體的邊界。人的身體的邊界在哪裏？血液流通的地方就是身體；不流通的地方就不是身體。人身體的部分沒有血就沒有生命。被切下來的手已經不是身體的一部分。很快，得不到血的供應，它就會腐爛。哪裏有真實的領受聖體，哪裏就有身體，也就是教會：</p><blockquote><p>“我們所祝福的杯，豈不是<strong>同領基督的血</strong>嗎？我們所擘開的餅，豈不是<strong>同領基督的身體</strong>嗎？ <strong>我們雖多，仍是一個餅、一個身體，因爲我們都是分受這一個餅</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><blockquote><p>“<strong>你們就是基督的身子</strong>，並且各自作肢體。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“你們從前遠離上帝的人，如今卻在基督耶穌裏，<strong><mark>靠著他的血，已經得親近了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L13">弗 2:13</a>)</p></blockquote><p>所以，救恩只在教會裏，因爲基督是<a href="https://bibleox.com/ru/ru/w/Церковь">身體的救主，也就是教會的救主</a>：</p><blockquote><p>“因爲丈夫是妻子的頭，如同<strong>基督是教會的頭</strong>，他又是<strong>教會全體的救主</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>)</p></blockquote><p>關於聖餐禮，詳見<a href="https://bibleox.com/ru/ru/w/Евхаристия">聖餐禮</a>。</p><p><strong>聖殉道者、安提阿主教伊格那丟（一世紀）</strong>，《致士每拿人書》（[俄文](https://azbyka.ru/otechnik/Ignatij_Antiohijskij/poslanie-k-smirnjanam/)）：</p><p>“第八章。凡屬於教會的事，一概不要不經主教而行。……<strong>只有主教所舉行的聖餐，或他所准許的人所舉行的，才當視爲確實有效</strong>。”</p>
