  path: Qc9T_十字架
  title: 十字架
  copy_cover: true
  body: <h2>十字架在舊約中的預表</h2><ol><li><p>基督十字架的祭獻的預表——亞伯拉罕與以撒：<a href="https://bibleox.com/ru/ru/w/прообраз-крестной-жертвы-Авраам-и-Исаак">詳見</a></p></li><li><p>十字架——摩西：<a href="https://bibleox.com/ru/ru/w/крест-Моисей">詳見</a></p></li><li><p>十字架——以色列的營陣：<a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">詳見</a></p></li><li><p>十字架與洗禮——過海：<a href="https://bibleox.com/ru/ru/w/крест-и-крещение-переход-через-море">詳見</a></p></li><li><p>十字架——雅各的祝福：<a href="https://bibleox.com/ru/ru/w/крест-Иаков">詳見</a></p></li><li><p>十字架——預言異象中信者額上的 Tau 字母：<a href="https://bibleox.com/ru/ru/w/EMRx_Крест__буква_тау">詳見</a></p></li></ol><h2>十字架——得勝與和好的工具</h2><blockquote><p>“你們從前在過犯和未受割禮的肉體中死了，上帝赦免了你們一切過犯，便叫你們與基督一同活過來； 又塗抹了在律例上所寫攻擊我們、有礙於我們的字據，把他撤去，<strong>釘在十字架上</strong>。 既將一切執政的、掌權的擄來，明顯給衆人看，就<strong>仗著十字架誇勝</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L13-15">西 2:13-15</a>)</p></blockquote><blockquote><p>“<strong>既在十字架上滅了冤仇</strong>，便藉這十字架<strong>使兩下歸爲一體</strong>，與上帝和好了，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L16">弗 2:16</a>)</p></blockquote><blockquote><p>“既然<strong>藉着他在十字架上所流的血成就了和平</strong>，便藉着他叫萬有，無論是地上的、天上的，都與自己和好了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L20">西 1:20</a>)</p></blockquote><h2>十字架——祭壇，至聖的聖物</h2><p>主耶穌基督把自己作爲祭物獻在十字架——這祭壇——上：</p><blockquote><p>“<strong>基督既然一次被獻</strong>，擔當了多人的罪，將來要向那等候他的人第二次顯現，並與罪無關，乃是爲拯救他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L28">希 9:28</a>)</p></blockquote><p>舊約中基督十字架祭獻的預表——獻以撒——證實了這一點。亞伯拉罕（父）把以撒（他的獨子）獻爲祭：</p><blockquote><p>“上帝說：你帶著<strong>你的兒子，就是你獨生的兒子</strong>，你所愛的以撒，往摩利亞地去，在我所要指示你的山上，<strong>把他獻爲燔祭</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/22/#L2">創 22:2</a>)</p></blockquote><blockquote><p>“上帝愛世人，甚至<strong>將他的獨生子賜給</strong>他們，叫一切信他的，不至滅亡，反得永生。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L16">約 3:16</a>)</p></blockquote><p>以撒把祭獻要在其上進行的物件背到山上：</p><blockquote><p>“亞伯拉罕<strong>把燔祭的柴放在他兒子以撒身上</strong>，自己手裏拿著火與刀，於是二人同行。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/22/#L6">創 22:6</a>)</p></blockquote><blockquote><p>“於是彼拉多將耶穌交給他們去釘十字架。 他們就把耶穌帶了去。<strong>耶穌揹着自己的十字架出來</strong>，到了一個地方，名叫髑髏地（希伯來話叫各各他）。 他們就在那裏釘他在十字架上，還有兩個人和他一同釘著，一邊一個，耶穌在中間。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L16-18">約 19:16-18</a>)</p></blockquote><h3>亞伯拉罕把以撒放在祭壇上</h3><blockquote><p>“我們的祖宗亞伯拉罕<strong>把他兒子以撒獻在壇上</strong>，豈不是因行爲稱義嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L21">雅 2:21</a>)</p></blockquote><blockquote><p>“他既按著上帝的定旨、先見被交與人，你們就藉着無法之人的手，<strong>把他釘在十字架上殺了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L23">徒 2:23</a>)</p></blockquote><p>在十字架——這祭壇上——成就了人類的救恩：</p><blockquote><p>“<strong>既在十字架上滅了冤仇</strong>，便藉這十字架<strong>使兩下歸爲一體</strong>，與上帝和好了，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L16">弗 2:16</a>)</p></blockquote><h3>祭壇——至聖的聖物</h3><blockquote><p>“<strong>壇就成爲至聖，凡挨着壇的都成爲聖</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L37">出 29:37</a>)</p></blockquote><h2>福音</h2><blockquote><p>“耶穌看著他，就愛他，對他說：「你還缺少一件，去變賣你所有的，分給窮人，就必有財寶在天上；<strong>你還要來跟從我</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L21">可 10:21</a>) <em>(俄文原文有“背起十字架來跟從我”，和合本無)</em></p></blockquote><blockquote><p>“於是叫衆人和門徒來，對他們說：「若有人要跟從我，就當捨己，<strong>背起他的十字架來跟從我</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/8/#L34">可 8:34</a>)</p></blockquote><blockquote><p>“<strong>不揹着他的十字架跟從我的</strong>，也不配作我的門徒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L38">太 10:38</a>)</p></blockquote><blockquote><p>“於是，耶穌對門徒說：「若有人要跟從我，就當捨己，<strong>背起他的十字架來跟從我</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L24">太 16:24</a>)</p></blockquote><blockquote><p>“耶穌又對衆人說：「若有人要跟從我，就當捨己，<strong>天天背起他的十字架來跟從我</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L23">路 9:23</a>)</p></blockquote><blockquote><p>“<strong>凡不揹着自己十字架跟從我的</strong>，也不能作我的門徒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/14/#L27">路 14:27</a>)</p></blockquote><blockquote><p>“「你這拆毀聖殿，三日又建造起來的，可以救自己吧！你如果是上帝的兒子，<strong>就從十字架上下來吧</strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L40">太 27:40</a>)</p></blockquote><blockquote><p>“「他救了別人，不能救自己。他是以色列的王，<strong>現在可以從十字架上下來</strong>，我們就信他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L42">太 27:42</a>)</p></blockquote><blockquote><p>“可以救自己，<strong>從十字架上下來吧</strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/15/#L30">可 15:30</a>)</p></blockquote><blockquote><p>“以色列的王基督，<strong>現在可以從十字架上下來</strong>，叫我們看見，就信了！」那和他同釘的人也是譏誚他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/15/#L32">可 15:32</a>)</p></blockquote><h2>使徒</h2><blockquote><p>“仰望爲我們信心創始成終的耶穌。他因那擺在前面的喜樂，就輕看羞辱，<strong>忍受了十字架</strong>的苦難，便坐在上帝寶座的右邊。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L2">希 12:2</a>)</p></blockquote><blockquote><p>“但我斷不以別的誇口，<strong>只誇我們主耶穌基督的十字架</strong>。因這十字架，就我而論，世界已經釘在十字架上；就世界而論，我已經釘在十字架上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/6/#L14">加 6:14</a>)</p></blockquote><blockquote><p>“基督差遣我，原不是爲施洗，乃是爲傳福音，並不用智慧的言語，<strong>免得基督的十字架落了空</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L17">林前 1:17</a>)</p></blockquote><blockquote><p>“<strong>因爲十字架的道理，在那滅亡的人爲愚拙</strong>；在我們得救的人卻爲上帝的大能。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L18">林前 1:18</a>)</p></blockquote><blockquote><p>“凡希圖外貌體面的人，都勉強你們受割禮，無非是<strong>怕自己爲基督的十字架受逼迫</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/6/#L12">加 6:12</a>)</p></blockquote><blockquote><p>“弟兄們，我若仍舊傳割禮，爲什麼還受逼迫呢？若是這樣，<strong>那十字架討厭的地方就沒有了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L11">加 5:11</a>)</p></blockquote><blockquote><p>“<strong>既在十字架上滅了冤仇</strong>，便藉這十字架<strong>使兩下歸爲一體</strong>，與上帝和好了，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L16">弗 2:16</a>)</p></blockquote><blockquote><p>“因爲有許多人<strong>行事是基督十字架的仇敵</strong>。我屢次告訴你們，現在又流淚的告訴你們：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L18">腓 3:18</a>)</p></blockquote><blockquote><p>“既然<strong>藉着他在十字架上所流的血成就了和平</strong>，便藉着他叫萬有，無論是地上的、天上的，都與自己和好了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L20">西 1:20</a>)</p></blockquote><blockquote><p>“又塗抹了在律例上所寫攻擊我們、有礙於我們的字據，把他撤去，<strong>釘在十字架上</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L14">西 2:14</a>)</p></blockquote>
