  path: QW8A_爲聖人祈禱
  title: 爲聖人祈禱
  copy_cover: true
  body: <h2>正教會的理解</h2><p>正教會教導：主耶穌基督是唯一的中保。是怎樣的中保？是那舍自己作萬人<strong>贖價</strong>的中保（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L5">提前 2:5</a>）。其餘的聖人不是救贖者。同禱者卻有許多：</p><blockquote><p>“他曾救我們脫離那極大的死亡，<strong><mark>現在仍要救我們</mark></strong>，<strong><mark>並且我們指望他將來還要救我們</mark></strong>。 <strong><mark>你們以祈禱幫助我們</mark></strong>，好叫許多人爲我們謝恩，<strong><mark>就是爲我們因許多人所得的恩</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/1/#L10-11">林後 1:10-11</a>)</p></blockquote><p>他們是聖潔的義人、上帝的朋友：上帝之母、天使、先知、使徒、殉道者和其餘的聖人。如同使徒在這裏被人請求代禱，在天上也有人求他代禱。以爲每個人都應當隻爲自己的利益向上帝祈禱的想法，與聖經格格不入。相反，聖經中多次召呼全教會彼此代禱（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L16">雅 5:16</a>）。所有的人——甚至最偉大的義人和上帝的特選者——不放棄向上帝的祈禱，也請求信徒們爲他們祈禱，自己不住地爲信徒祈禱，並吩咐將來也要守這規矩。這也稱爲彼此代求。</p><p>我們從教會知道、並以聖經證實：義人在與身體分離之後進入與上帝同在的生活，並繼續向他獻上自己的祈禱。因此，如同這些義人活著、身體還在地上時我們曾求他們的祈禱，同樣在他們與身體分離、進入天上與基督明顯的同在後，我們也求他們的祈禱（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-23">希 12:22-23</a>）；因爲他們不是進入更壞的境地，而是更好的境地（<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L23">腓 1:23</a>）。我們相信愛永不止息（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>），因此整個教會——地上爭戰的和天上得勝的——是一個合一的、完整的、相通的教會，共同地彼此祈禱，並被愛催促關懷自己所有的肢體。我們也信、並從教會知道、且在聖經中表明：我們的護守天使與上帝有相通（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L10">太 18:10</a>），被差遣事奉那將要承受救恩的人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L14">希 1:14</a>）；而聖潔的義人住在上帝聖光之中，也知道地上發生的事，併爲教會向上帝獻上祈禱（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>）；永恆的愛催促衆人在基督的一個身體裏彼此相通、彼此關懷：在天上，也在地上。</p><h2>天使的祈禱</h2><h3>人有護守天使</h3><blockquote><p>“你們要小心，不可輕看這小子裏的一個。我告訴你們：<strong><mark>他們的使者在天上，常見我天父的面</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L10">太 18:10</a>)</p></blockquote><h3>天使被差遣關懷得救的人</h3><blockquote><p>“所有的天使，上帝從來對那一個說：『你坐在我的右邊，等我使你仇敵作你的腳凳？』 <strong><mark>天使豈不都是服役的靈</mark></strong>、<strong><mark>奉差遣爲那將要承受救恩的人效力嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><h3>天使在天上爲人悔改而歡喜</h3><blockquote><p>“我告訴你們：<strong><mark>一個罪人悔改，在天上也要這樣爲他歡喜</mark></strong>，較比爲九十九個不用悔改的義人歡喜更大。 &lt;…&gt; 我告訴你們：一個罪人悔改，<strong><mark>在上帝的使者面前也是這樣爲他歡喜</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/15/#L7,10">路 15:7,10</a>)</p></blockquote><h3>天使在上帝面前爲人代求</h3><p>天使爲猶大各城的居民求恩惠：</p><blockquote><p>“於是，耶和華的使者說：「<strong><mark>萬軍之耶和華啊，你惱恨耶路撒冷和猶大的城邑已經七十年，你不施憐憫要到幾時呢</mark></strong>？」 <strong><mark>耶和華就用美善的安慰話回答那與我說話的天使</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/zah/1/#L12-13">亞 1:12-13</a>)</p></blockquote><h3>與天使的交往</h3><blockquote><p>“天明了，<strong><mark>天使催逼羅得說</mark></strong>：「起來！帶著你的妻子和你在這裏的兩個女兒出去，免得你因這城裏的罪惡同被剿滅。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/19/#L15">創 19:15</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和華的使者到了俄弗拉</mark></strong>，坐在亞比以謝族人約阿施的橡樹下。約阿施的兒子基甸正在酒醡那裏打麥子，爲要防備米甸人。 <strong><mark>耶和華的使者向基甸顯現</mark></strong>，對他說：「<strong><mark>大能的勇士啊！耶和華與你同在</mark></strong>。」 <strong><mark>基甸說</mark></strong>：「主啊！耶和華若與我們同在，我們何至遭遇這一切事呢？我們的列祖不是向我們說『耶和華領我們從埃及上來』麼？他那樣奇妙的作爲在那裏呢？現在他卻丟棄我們，將我們交在米甸人手裏。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/6/#L11-13">士 6:11-13</a>)</p></blockquote><blockquote><p>“那時有一個瑣拉人，是屬但族的，名叫瑪挪亞；<strong><mark>他的妻不懷孕，不生育</mark></strong>。 <strong><mark>耶和華的使者向那婦人顯現，對她說</mark></strong>：「向來你不懷孕，不生育，<strong><mark>如今你必懷孕生一個兒子</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/13/#L2-3">士 13:2-3</a>)</p></blockquote><blockquote><p>“<strong><mark>有一位天使從天上顯現，加添他的力量</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L43">路 22:43</a>)</p></blockquote><blockquote><p>“當猶太王希律的時候，亞比雅班裏有一個祭司，名叫撒迦利亞。他妻子是亞倫的後人，名叫以利沙伯。 &lt;…&gt; <strong><mark>有主的使者站在香壇的右邊向他顯現</mark></strong>。 &lt;…&gt; <strong><mark>天使對他說</mark></strong>：「撒迦利亞，不要害怕，<strong><mark>因爲你的祈禱已經被聽見了</mark></strong>。你的妻子以利沙伯要給你生一個兒子，你要給他起名叫約翰。 &lt;…&gt; <strong><mark>撒迦利亞對天使說</mark></strong>：「我憑著什麼可知道這事呢？我已經老了，我的妻子也年紀老邁了。」 <strong><mark>天使回答說</mark></strong>：「<strong><mark>我是站在上帝面前的加百列</mark></strong>，奉差而來對你說話，將這好信息報給你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L5,11,13,18-19">路 1:5,11,13,18-19</a>)</p></blockquote><blockquote><p>“到了第六個月，<strong><mark>天使加百列奉上帝的差遣</mark></strong>往加利利的一座城去，這城名叫拿撒勒， <strong><mark>到一個童女那裏</mark></strong>，是已經許配大衛家的一個人，名叫約瑟，童女的名字叫馬利亞。 <strong><mark>天使進去，對她說</mark></strong>：「<strong><mark>蒙大恩的女子</mark></strong>，我問你安，主和你同在了！」 &lt;…&gt; <strong><mark>天使對他說</mark></strong>：「馬利亞，不要怕！你在上帝面前已經蒙恩了。 你要懷孕生子，可以給他起名叫耶穌。 &lt;…&gt; <strong><mark>馬利亞對天使說</mark></strong>：「我沒有出嫁，怎麼有這事呢？」 <strong><mark>天使回答說</mark></strong>：「聖靈要臨到你身上，至高者的能力要廕庇你，因此所要生的聖者必稱爲上帝的兒子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L26-28,30-31,34-35">路 1:26-28,30-31,34-35</a>)</p></blockquote><blockquote><p>“在夜間有異象現與保羅：<strong><mark>有一個馬其頓人站著求他說</mark></strong>：「<strong><mark>請你過到馬其頓來幫助我們</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/16/#L9">徒 16:9</a>)</p></blockquote><blockquote><p>“<strong><mark>忽然有主的一個使者站在旁邊</mark></strong>，屋裏有光照耀。<strong><mark>天使拍彼得的肋旁，拍醒了他</mark></strong>，說：「快快起來！」那鐵鍊就從他手上脫落下來。 <strong><mark>天使對他說</mark></strong>：「束上帶子，穿上鞋！」他就那樣作。天使又說：「披上外衣，跟著我來。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/12/#L7-8">徒 12:7-8</a>)</p></blockquote><blockquote><p>“耶穌基督的啓示，就是上帝賜給他，叫他將必要快成的事指示他的衆僕人。<strong><mark>他就差遣使者曉諭他的僕人約翰</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L1">啟 1:1</a>)</p></blockquote><h2>亡者的祈禱</h2><p>先知巴錄求上帝垂聽安息之義人的祈禱：</p><blockquote><p>“全能的上主，以色列的天主！憂傷的靈魂和苦惱的心靈正在向你呼號：上主！求你俯聽垂憐，因爲你是仁慈的天主；求你垂憐，因我們得罪了你。你永居王位，而我們卻要永遠喪亡。全能的上主，以色列的天主！<strong>求你俯聽垂死的以色列人，和犯罪得罪了你的人的子孫的祈禱</strong>：他們沒有聽從你，他們天主的聲音，因此災禍便纏繞我們。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/var/3/#L1-4">巴 3:1-4</a>)</p></blockquote><p>安息的拉結——族長雅各的妻子——爲自己兒女在巴比倫爲奴之地的死亡和苦難憂傷。而主回答她，安慰她，並應許釋放他們——這事也成就了：</p><blockquote><p>“耶和華如此說：「在拉瑪聽見號咷痛哭的聲音，<strong><mark>是拉結哭他兒女，不肯受安慰</mark></strong>，因爲他們都不在了。」 耶和華如此說：「<strong><mark>你禁止聲音不要哀哭</mark></strong>，禁止眼目不要流淚，因你所作之工必有賞賜，他們必從敵國歸回。」這是耶和華說的。 耶和華說：「<strong><mark>你末後必有指望</mark></strong>，你的兒女必回到自己的境界。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/31/#L15-17">耶 31:15-17</a>)</p></blockquote><p>這段引文可以按寓意理解，也可以按字面理解。</p><h2>義人的祈禱</h2><h3>上帝更喜悅義人的祈禱</h3><blockquote><p>“惡人獻祭，爲耶和華所憎惡；<strong><mark>正直人祈禱，爲他所喜悅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/15/#L8">箴 15:8</a>)</p></blockquote><blockquote><p>“耶和華遠離惡人，<strong><mark>卻聽義人的禱告</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/15/#L29">箴 15:29</a>)</p></blockquote><blockquote><p>“所以你們要彼此認罪，互相代求，使你們可以得醫治。<strong><mark>義人祈禱所發的力量是大有功效的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L16">雅 5:16</a>)</p></blockquote><h3>上帝要求爲赦罪必須有義人祈禱</h3><h4>約伯</h4><blockquote><p>“現在你們要取七隻公牛，七隻公羊，到我僕人約伯那裏去，爲自己獻上燔祭，<strong><mark>我的僕人約伯就爲你們祈禱</mark></strong>。<strong><mark>我因悅納他，就不按你們的愚妄辦你們</mark></strong>。你們議論我，不如我的僕人約伯說的是。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/42/#L8">伯 42:8</a>)</p></blockquote><blockquote><p>“上帝在夢中對他說：「我知道你作這事是心中正直，我也攔阻了你，免得你得罪我，所以我不容你沾著她。 現在你把這人的妻子歸還他，<strong><mark>因爲他是先知</mark></strong>，<strong><mark>他要爲你禱告，使你存活</mark></strong>。你若不歸還他，你當知道，你和你所有的人都必要死。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/20/#L6-7">創 20:6-7</a>)</p></blockquote><h4>先知摩西</h4><p>先知摩西是上帝與整個民族之間的中保：</p><blockquote><p>“現在你要聽我的話，我爲你出個主意，願上帝與你同在。<strong><mark>你要替百姓到上帝面前</mark></strong>，<strong><mark>將案件奏告上帝</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/18/#L19">出 18:19</a>)</p></blockquote><p>因摩西所求，上帝赦免了民的罪：</p><blockquote><p>“<strong><mark>求你照你的大慈愛赦免這百姓的罪孽</mark></strong>，好像你從埃及到如今常赦免他們一樣。」 耶和華說：「<strong><mark>我照著你的話赦免了他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/14/#L19-20">民 14:19-20</a>)</p></blockquote><p>另一次，上帝指出：即使按摩西的話他也不赦免：</p><blockquote><p>“耶和華對我說：「<strong><mark>雖有摩西和撒母耳站在我面前</mark></strong>代求，<strong><mark>我的心也不顧惜這百姓</mark></strong>。你將他們從我眼前趕出，叫他們去吧！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/15/#L1">耶 15:1</a>)</p></blockquote><p>他求上帝改變決定：</p><blockquote><p>“<strong><mark>你且由著我</mark></strong>，我要向他們發烈怒，將他們滅絕，使你的後裔成爲大國。」 <strong><mark>摩西便懇求耶和華他的上帝，說</mark></strong>：「耶和華啊，你爲什麼向你的百姓發烈怒呢？這百姓是你用大力和大能的手從埃及地領出來的。 爲什麼使埃及人議論說『他領他們出去，是要降禍與他們，把他們殺在山中，將他們從地上除滅』？<strong><mark>求你轉意，不發你的烈怒</mark></strong>；<strong><mark>後悔，不降禍與你的百姓</mark></strong>。 求你記念你的僕人亞伯拉罕、以撒、以色列，你曾指著自己起誓說：『我必使你們的後裔像天上的星那樣多，並且我所應許的這全地，必給你們的後裔，他們要永遠承受爲業。』」 <strong><mark>於是耶和華後悔，不把所說的禍降與他的百姓</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/32/#L10-14">出 32:10-14</a>)</p></blockquote><p>之後又去爲百姓代求：</p><blockquote><p>“到了第二天，摩西對百姓說：「<strong><mark>你們犯了大罪</mark></strong>，<strong><mark>我如今要上耶和華那裏去</mark></strong>，<strong><mark>或者可以爲你們贖罪</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/32/#L30">出 32:30</a>)</p></blockquote><p>上帝又改變了決定：</p><blockquote><p>“<strong><mark>耶和華與摩西面對面說話</mark></strong>，好像人與朋友說話一般。摩西轉到營裏去，惟有他的幫手一個少年人嫩的兒子約書亞，不離開會幕。 <strong><mark>摩西對耶和華說</mark></strong>：「你吩咐我說：『將這百姓領上去』，卻沒有叫我知道你要打發誰與我同去。只說：『我按你的名認識你，你在我眼前也蒙了恩。』 &lt;…&gt; 摩西說：「<strong><mark>你若不親自和我同去</mark></strong>，<strong><mark>就不要把我們從這裏領上去</mark></strong>。 &lt;…&gt; 耶和華對摩西說：「<strong><mark>你這所求的我也要行</mark></strong>，<strong><mark>因爲你在我眼前蒙了恩</mark></strong>，<strong><mark>並且我按你的名認識你</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/33/#L11-12,15,17">出 33:11-12,15,17</a>)</p></blockquote><h4>神人</h4><blockquote><p>“王對神人說：「<strong><mark>請你爲我禱告</mark></strong>，<strong><mark>求耶和華你上帝的恩典</mark></strong>，使我的手復原。」<strong><mark>於是神人祈禱耶和華</mark></strong>，王的手就復了原，仍如尋常一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/13/#L6">王上 13:6</a>)</p></blockquote><h2>司祭職爲他人祈禱</h2><p>因司祭們爲另一個人的祈禱（這裏有代求），罪可以得赦：</p><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名用油抹他，<strong><mark>爲他禱告</mark></strong>。 出於信心的祈禱要救那病人，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你們要彼此認罪，互相代求，使你們可以得醫治。<strong><mark>義人祈禱所發的力量是大有功效的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><h2>教會肢體彼此祈禱</h2><p>向上帝的個人祈禱足夠嗎？</p><h3>使徒們需要爲他們做的祈禱</h3><blockquote><p>“<strong><mark>也要爲我們禱告</mark></strong>，求上帝給我們開傳道的門，能以講基督的奧祕（我爲此被捆鎖），” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/4/#L3">西 4:3</a>)</p></blockquote><blockquote><p>“<strong><mark>請弟兄們爲我們禱告</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L25">帖前 5:25</a>)</p></blockquote><blockquote><p>“弟兄們，我還有話說：<strong><mark>請你們爲我們禱告</mark></strong>，好叫主的道理快快行開，得著榮耀，正如在你們中間一樣；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L1">帖後 3:1</a>)</p></blockquote><blockquote><p>“<strong><mark>請你們爲我們禱告</mark></strong>，因我們自覺良心無虧，願意凡事按正道而行。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L18">希 13:18</a>)</p></blockquote><blockquote><p>“弟兄們，我藉着我們主耶穌基督，又藉着聖靈的愛，<strong><mark>勸你們與我一同竭力</mark></strong>，<strong><mark>爲我祈求上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/15/#L30">羅 15:30</a>)</p></blockquote><blockquote><p>“他曾救我們脫離那極大的死亡，現在仍要救我們，並且我們指望他將來還要救我們。 <strong><mark>你們以祈禱幫助我們</mark></strong>，好叫許多人爲我們謝恩，<strong><mark>就是爲我們因許多人所得的恩</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/1/#L10-11">林後 1:10-11</a>)</p></blockquote><blockquote><p>“因爲我知道，這事<strong><mark>藉着你們的祈禱</mark></strong>和耶穌基督之靈的幫助，<strong><mark>終必叫我得救</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L19">腓 1:19</a>)</p></blockquote><blockquote><p>“此外，你還要給我預備住處，<strong><mark>因爲我盼望藉着你們的禱告</mark></strong>，必蒙恩到你們那裏去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fm/1/#L22">門 1:22</a>)</p></blockquote><h3>使徒們不住地爲基督徒祈禱</h3><blockquote><p>“<strong><mark>就爲你們不住的感謝上帝</mark></strong>，<strong><mark>禱告的時候，常提到你們</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L16">弗 1:16</a>)</p></blockquote><blockquote><p>“<strong><mark>每逢爲你們衆人祈求的時候，常是歡歡喜喜的祈求</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L4">腓 1:4</a>)</p></blockquote><blockquote><p>“<strong><mark>我們爲你們衆人常常感謝上帝</mark></strong>，<strong><mark>禱告的時候提到你們</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/1/#L2">帖前 1:2</a>)</p></blockquote><blockquote><p>“有你們那裏的人，作基督耶穌僕人的以巴弗問你們安。<strong><mark>他在禱告之間，常爲你們竭力的祈求</mark></strong>，願你們在上帝一切的旨意上得以完全，信心充足，能站立得穩。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/4/#L12">西 4:12</a>)</p></blockquote><blockquote><p>“我感謝上帝，就是我接續祖先用清潔的良心所事奉的上帝。<strong><mark>祈禱的時候，不住的想念你</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L3">提後 1:3</a>)</p></blockquote><blockquote><p>“<strong><mark>我禱告的時候提到你常爲你感謝我的上帝</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fm/1/#L4">門 1:4</a>)</p></blockquote><h3>使徒們呼召基督徒彼此祈禱</h3><blockquote><p>“所以你們要彼此認罪，<strong><mark>互相代求</mark></strong>，使你們可以得醫治。義人祈禱所發的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L16">雅 5:16</a>)</p></blockquote><blockquote><p>“靠著聖靈，<strong><mark>隨時多方禱告祈求</mark></strong>，<strong><mark>並要在此儆醒不倦</mark></strong>，<strong><mark>爲衆聖徒祈求</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L18">弗 6:18</a>)</p></blockquote><blockquote><p>“我勸你<strong><mark>第一要爲萬人懇求</mark></strong>、禱告、代求、祝謝，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L1">提前 2:1</a>)</p></blockquote><h2>整個教會是基督的同一個合一的身體——相通、彼此關懷</h2><h3>教會是基督的身體</h3><blockquote><p>“<strong><mark>你們就是基督的身子</mark></strong>，並且各自作肢體。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“豈不知<strong><mark>你們的身子是基督的肢體</mark></strong>嗎？我可以將基督的肢體作爲娼妓的肢體嗎？斷乎不可！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L15">林前 6:15</a>)</p></blockquote><h3>教會的肢體分有上帝</h3><blockquote><p>“上帝的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。 因此，他已將又寶貴、又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，<strong><mark>就得與上帝的性情有分</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L3-4">彼後 1:3-4</a>)</p></blockquote><h3>身體的所有肢體彼此關懷</h3><blockquote><p>“免得身上分門別類，<strong><mark>總要肢體彼此相顧</mark></strong>。 <strong><mark>若一個肢體受苦，所有的肢體就一同受苦</mark></strong>；<strong><mark>若一個肢體得榮耀，所有的肢體就一同快樂</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L25-26">林前 12:25-26</a>)</p></blockquote><h3>使徒們常爲教會祈禱</h3><blockquote><p>“因此，我們自從聽見的日子，也就爲你們<strong><mark>不住的禱告祈求</mark></strong>，<strong><mark>願你們在一切屬靈的智慧悟性上，滿心知道上帝的旨意</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L9">西 1:9</a>)</p></blockquote><h2>地上教會與天上教會的合一</h2><h3>我們已經來到天上的教會</h3><p>就在現在，而不是在將來復活之後：</p><blockquote><p>“<strong><mark>你們乃是來到錫安山</mark></strong>，永生上帝的城邑，<strong><mark>就是天上的耶路撒冷</mark></strong>。那裏有<strong><mark>千萬的天使</mark></strong>， 有名錄在天上諸長子之會所共聚的總會，有審判衆人的上帝和<strong><mark>被成全之義人的靈魂</mark></strong>， <strong><mark>並新約的中保耶穌</mark></strong>，<strong><mark>以及所灑的血</mark></strong>。這血所說的比亞伯的血所說的更美。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-24">希 12:22-24</a>)</p></blockquote><h3>沒有分裂；衆肢體彼此關懷、彼此感同身受</h3><blockquote><p>“但如今肢體是多的，<strong><mark>身子卻是一個</mark></strong>。 &lt;…&gt; 我們俊美的肢體，自然用不著裝飾；<strong><mark>但上帝配搭這身子</mark></strong>，把加倍的體面給那有缺欠的肢體， 免得身上分門別類，<strong><mark>總要肢體彼此相顧</mark></strong>。 <strong><mark>若一個肢體受苦</mark></strong>，所有的肢體就一同受苦；<strong><mark>若一個肢體得榮耀</mark></strong>，所有的肢體就一同快樂。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L20,24-26">林前 12:20,24-26</a>)</p></blockquote><blockquote><p>“我告訴你們：<strong><mark>一個罪人悔改，在天上也要這樣爲他歡喜</mark></strong>，較比爲九十九個不用悔改的義人歡喜更大。 &lt;…&gt; 我告訴你們：一個罪人悔改，<strong><mark>在上帝的使者面前也是這樣爲他歡喜</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/15/#L7,10">路 15:7,10</a>)</p></blockquote><h3>天上的與地上的在基督裏聯合</h3><blockquote><p>“願頌讚歸與我們主耶穌基督的父上帝！他在基督裏曾賜給我們天上各樣屬靈的福氣。 &lt;…&gt; 都是照他自己所預定的美意，叫我們知道他旨意的奧祕， 要照所安排的，在日期滿足的時候，<strong><mark>使天上地上一切所有的，都在基督裏面同歸於一</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L3,9-10">弗 1:3,9-10</a>)</p></blockquote><blockquote><p>“因此，我在父面前屈膝， （<strong><mark>天上地上的各家</mark></strong>，都是從他得名。）” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/3/#L14-15">弗 3:14-15</a>)</p></blockquote><blockquote><p>“他也是教會全體之首，他是元始，是從死裏首先復生的，使他可以在凡事上居首位。 因爲父喜歡叫一切的豐盛在他裏面居住。 既然藉着他在十字架上所流的血成就了和平，便藉着他叫萬有，<strong><mark>無論是地上的、天上的</mark></strong>，都與自己和好了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L18-20">西 1:18-20</a>)</p></blockquote><blockquote><p>“因此基督死了，又活了，<strong><mark>爲要作死人並活人的主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L9">羅 14:9</a>)</p></blockquote><p>參見：<a href="https://bibleox.com/ru/ru/w/Церковь#HH-Единство-земной-и-небесной-Церкви-единое-Тело-Христа">教會——天上地下教會的合一，基督的一個身體</a></p><h2>聖徒在天上向上帝祈禱</h2><h3>聖徒的祈禱蒙上帝喜悅</h3><blockquote><p>“他既拿了書卷，四活物和二十四位長老就俯伏在羔羊面前，各拿著琴和<strong><mark>盛滿了香的金爐</mark></strong>；<strong><mark>這香就是衆聖徒的祈禱</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/5/#L8">啟 5:8</a>)</p></blockquote><blockquote><p>“另有一位天使拿著金香爐，來站在祭壇旁邊。有許多香賜給他，<strong><mark>要和衆聖徒的祈禱一同獻在寶座前的金壇上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3">啟 8:3</a>)</p></blockquote><blockquote><p>“此後，我聽見<strong><mark>好像羣衆在天上大聲說</mark></strong>：「哈利路亞！<strong><mark>救恩、榮耀、權能都屬乎我們的上帝</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/19/#L1">啟 19:1</a>)</p></blockquote><p>他們知道地上發生的事：</p><blockquote><p>“揭開第五印的時候，我看見在祭壇底下，<strong><mark>有爲上帝的道併爲作見證被殺之人的靈魂</mark></strong>， 大聲喊著說：「<strong><mark>聖潔真實的主啊</mark></strong>！<strong><mark>你不審判住在地上的人，給我們伸流血的冤，要等到幾時呢</mark></strong>？」 <strong><mark>於是有白衣賜給他們各人</mark></strong>，又有話對他們說：「還要安息片時，等著一同作僕人的和他們的弟兄，也像他們被殺，<strong><mark>滿足了數目</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>)</p></blockquote><h3>聖徒進入的是更好的境地，而不是更壞的</h3><blockquote><p>“我正在兩難之間，<strong><mark>情願離世與基督同在</mark></strong>，<strong><mark>因爲這是好得無比的</mark></strong>。 <strong><mark>然而，我在肉身活著，爲你們更是要緊的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L23-24">腓 1:23-24</a>)</p></blockquote><h3>聖徒在與身體分離之後仍保持相通的能力</h3><p>在救主於他泊山顯聖容的時刻，使徒們看見已死的先知摩西顯現，與基督談論他將要受的十字架苦難。就是說，先知雖然死了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/34/#L7">申 34:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/1/#L2">書 1:2</a>），卻沒有消失，也沒有失去意識：他與基督<strong>相交</strong>：</p><blockquote><p>“忽然，<strong><mark>有摩西，以利亞向他們顯現</mark></strong>，<strong><mark>同耶穌說話</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/17/#L3">太 17:3</a>)</p></blockquote><blockquote><p>“正禱告的時候，他的面貌就改變了，衣服潔白放光。 <strong><mark>忽然有摩西、以利亞兩個人同耶穌說話</mark></strong>； <strong><mark>他們在榮光裏顯現，談論耶穌去世的事</mark></strong>，就是他在耶路撒冷將要成的事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L29-31">路 9:29-31</a>)</p></blockquote><h3>愛永遠催促人關懷別人</h3><blockquote><p>“<strong><mark>愛是永不止息</mark></strong>。先知講道之能，終必歸於無有；說方言之能，終必停止；知識也終必歸於無有。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>)</p></blockquote><h2>對異議的回應</h2><h3>一位中保</h3><h4>簡答</h4><p>正教徒因向聖人祈禱而受指責，說只有基督纔是唯一的中保。回答是：基督是唯一的、救贖了世人的中保，如同一節經文接著說的：</p><blockquote><p>“因爲只有一位上帝，在上帝和人中間，<strong><mark>只有一位中保</mark></strong>，<strong><mark>乃是降世爲人的基督耶穌</mark></strong>。 <strong><mark>他舍自己作萬人的贖價</mark></strong>，到了時候，這事必證明出來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L5-6">提前 2:5-6</a>)</p></blockquote><p>聖徒們不是救贖者，而是同禱者（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L16">雅 5:16</a>）。一切在於意義。我們的反對者（通常是新教徒）彼此爲對方的所需祈禱。如果他們彼此是中保，那聖人也是我們的中保。如果他們彼此是同禱者，那聖人也是我們的同禱者：因爲我們只是求他們爲我們祈禱、加入我們向上帝的祈禱。我們不把他們當作神，也不把他們當作神來祈禱——同樣，新教徒請人代禱時，也不把自己的夥伴當作神。</p><p>可以有代禱的中保嗎？——從聖經顯然可見：可以。例如，因教會司祭的祈禱，另一個人的罪可以得赦。</p><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名用油抹他，<strong><mark>爲他禱告</mark></strong>。 出於信心的祈禱要救那病人，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><p>無可爭議的代求。這樣，反對向聖人祈禱的人對基督作爲唯一中保之言（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L5-6">提前 2:5-6</a>）的理解是不正確的。所引的經文並不反對祈禱中的代求者。</p><h4>更詳細地論“中保”一詞</h4><p>還有翻譯上的特點。“中保”一詞譯自希臘文 μεσίτης。它可以譯作“和平的締造者”——促成雙方和好的人。也就是說，換言之，基督是上帝與人之間唯一的<strong>和好者</strong>（締造和平者）。使徒們在別處說得更明白：</p><blockquote><p>“一切都是出於上帝，<strong><mark>他藉着基督使我們與他和好</mark></strong>，<strong><mark>又將勸人與他和好的職分賜給我們</mark></strong>。 <strong><mark>這就是上帝在基督裏叫世人與自己和好</mark></strong>，不將他們的過犯歸到他們身上，<strong><mark>並且將這和好的道理託付了我們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L18-19">林後 5:18-19</a>)</p></blockquote><blockquote><p>“我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。<strong><mark>若有人犯罪</mark></strong>，<strong><mark>在父那裏我們有一位中保</mark></strong>，<strong><mark>就是那義者耶穌基督</mark></strong>。 <strong><mark>他爲我們的罪作了挽回祭</mark></strong>，不是單爲我們的罪，也是爲普天下人的罪。 &lt;…&gt; <strong><mark>小子們哪，我寫信給你們，因爲你們的罪藉着主名得了赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L1-2,12">約壹 2:1-2,12</a>)</p></blockquote><p>把“中保”譯作<strong>和好者</strong>或締造和平者，也與句子的結尾相合，如前所指：“他舍自己作萬人的贖價”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L5-6">提前 2:5-6</a>）。這樣一位締造和平者，藉把自己作爲祭物獻上，贖了人類在上帝面前的罪。所以這節經文不是反對向聖人祈禱，而是講到基督作爲人類與上帝的<strong>和好者</strong>。基督也是人與人之間的<strong>和好者</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L14">弗 2:14</a>）。</p><h3>關於“拯救我們”的說法</h3><p>正教徒因允許在向聖人的祈禱中用“拯救我們”的話而受指責。這裏又是在於意義。拯救是基督一次成就的。在這一意義上再沒有別的救主。但許多人可以促進具體個人的得救。這樣的說法在聖經中也常見：</p><h4>使徒救人</h4><blockquote><p>“<strong><mark>或者可以激動我骨肉之親發憤</mark></strong>，<strong><mark>好救他們一些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/11/#L14">羅 11:14</a>)</p></blockquote><blockquote><p>“向軟弱的人，我就作軟弱的人，爲要得軟弱的人；向什麼樣的人，我就作什麼樣的人。<strong><mark>無論如何總要救些人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/9/#L22">林前 9:22</a>)</p></blockquote><h4>妻子救人</h4><blockquote><p>“<strong><mark>你這作妻子的，怎麼知道不能救你的丈夫呢</mark></strong>？<strong><mark>你這作丈夫的，怎麼知道不能救你的妻子呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L16">林前 7:16</a>)</p></blockquote><h4>使徒呼召拯救別人</h4><blockquote><p>“有些人存疑心，你們要憐憫他們； <strong><mark>有些人你們要從火中搶出來</mark></strong>、<strong><mark>搭救他們</mark></strong>；有些人你們要存懼怕的心憐憫他們；連那被情慾沾染的衣服也當厭惡。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L22-23">猶 1:22-23</a>)</p></blockquote><blockquote><p>“你要謹慎自己和自己的教訓，要在這些事上恆心。因爲這樣行，<strong><mark>又能救自己，又能救聽你的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L16">提前 4:16</a>)</p></blockquote><h3>難道除了基督還有誰能救人嗎？</h3><p>無論使徒還是夫妻，都不是主耶穌基督意義上的救主——他是唯一的救贖者，把人類從死亡和陰間中救出、賜復活和與上帝同在的永生。但如上所見，“我要救”這樣的說法是使徒們所用的。我們正確地理解這些話的意義——人可以促進得救：</p><blockquote><p>“<strong><mark>因爲我們是與上帝同工的</mark></strong>；你們是上帝所耕種的田地，所建造的房屋。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L9">林前 3:9</a>)</p></blockquote><h3>關於“憐憫我們”的說法</h3><p>這裏情形與“拯救”相同（見上）。這樣的說法不只向聖徒，也向普通人發出。憐憫，就是施以恩惠。例如，義人約伯對自己的朋友們說：</p><blockquote><p>“<strong><mark>我朋友啊，可憐我！可憐我</mark></strong>！因爲上帝的手攻擊我。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/19/#L21">伯 19:21</a>)</p></blockquote><h3>聖徒怎麼能聽見來自全世界的祈禱？</h3><p>反對向聖人祈禱的人說：“上帝是無所不在、全能的；而聖人如果不具備這些屬性，那他們怎麼能聽見地球上不同地方衆多人的祈禱？”</p><h4>聖徒們說預言、行奇蹟，不是靠自己的力量，而是靠上帝的力量</h4><p>聖徒們不是離開上帝單獨被考察的。就是在地上身體活著的時候，上帝的能力也住在他們裏面；更何況在遷往天上、與基督同活之後，他們更不會失去這一點。先知亞迦布雖不是無所不知的，卻宣告了將臨到天下的大饑荒（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/11/#L28">徒 11:28</a>）。使徒彼得不是全能的，卻復活了多加（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/9/#L40">徒 9:40</a>）。他們作這些不是靠自己的力量，而是靠上帝的力量。</p><p>聖徒們如使徒所言，進入的不是更壞的，而是好得無比的境地（<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L23-24">腓 1:23-24</a>）：不是失去，而是獲得（<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/1/#L21">腓 1:21</a>）。他們與上帝聯合，在他的光和恩典中。他們的存在不能與我們的相比。他們知道地上發生的事（<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L10">啟 6:10</a>）。甚至還在身體裏的時候，使徒們就寫道，他們靈裏與基督徒同在：</p><h4>使徒不在身體裏，而在靈裏知道基督徒團體的情況</h4><blockquote><p>“<strong><mark>我身子雖與你們相離，心卻與你們同在</mark></strong>，見你們循規蹈矩，信基督的心也堅固，我就歡喜了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L5">西 2:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我身子雖不在你們那裏，心卻在你們那裏</mark></strong>，好像我親自與你們同在，已經判斷了行這事的人。 <strong><mark>就是你們聚會的時候，我的心也同在</mark></strong>。奉我們主耶穌的名，並用我們主耶穌的權能， 要把這樣的人交給撒但，敗壞他的肉體，<strong><mark>使他的靈魂在主耶穌的日子可以得救</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L3-5">林前 5:3-5</a>)</p></blockquote><blockquote><p>“<strong><mark>若有人愛上帝，這人乃是上帝所知道的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/8/#L3">林前 8:3</a>)</p></blockquote><h4>得救的人有護守天使</h4><p>如經所記，天使被差遣事奉得救的人：</p><blockquote><p>“<strong><mark>天使豈不都是服役的靈</mark></strong>、<strong><mark>奉差遣爲那將要承受救恩的人效力嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L14">希 1:14</a>)</p></blockquote><p>同時，天使常常見上帝的面（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L10">太 18:10</a>）。甚至他們就可以轉達我們的祈禱。我們不只向聖人們祈禱，也向聖天使祈禱：求他們爲我們代禱，爲他們的勞苦和關懷感謝他們。</p><p>反對地上教會與天上教會相通的人，甚至不允許感謝被差來事奉我們的護守天使——而這天使並不需要無所不在、無所不能才能聽見我們。</p><p>這樣，教會相信：聖徒們因住在上帝的光和恩典中而能聽見我們的祈禱。與上帝的合一賜給他們這樣的可能。是上帝自己賜給他們這樣的可能。所以，用最簡單的話說：聖徒們能聽見祈禱，不是由於自己的能力，而是由於上帝和他的能力。</p><h3>教會怎麼知道誰是聖人？難道是人替上帝作決定嗎？</h3><p>人不是替上帝作決定。上帝按自己的應許（<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии#HH-Святые-будут-в-чести">引文</a>），自己榮耀自己的聖人，顯明奇蹟，垂聽他們的祈禱。教會只是爲此作見證，並把民間對聖人的敬禮理出秩序，免得混亂——正如使徒所吩咐的：</p><blockquote><p>“<strong><mark>凡事都要規規矩矩的按著次序行</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/14/#L40">林前 14:40</a>)</p></blockquote><p>*規矩——即次序</p><blockquote><p>“因我們聽說，在你們中間<strong><mark>有人不按規矩而行，什麼工都不作</mark></strong>，反倒專管閒事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L11">帖後 3:11</a>)</p></blockquote><p>教會關於義人之聖潔的見證和敬禮秩序的設立（封聖），通常遠在義人去世之後，那時對這一問題的研究，不但可以依據義人地上的生活，還可以依據上帝在義人遷往天上、與上帝同活之後所顯明的事。</p><p>從教會的肢體們收集關於奇蹟、醫治——在義人墳墓旁發生的——以及義人祈禱之助的見證。仔細考察他生活和信仰的純潔。之後教會共同地研究所收集的信息，可以批准把義人作爲聖人敬禮，併爲此撰寫教會文本和聖像，設立紀念日。這某種意義上是把教會民間已經在發生的敬禮理出秩序，確認這敬禮的正確性，把敬禮納入事奉聖禮。</p><p>不過，許多義人的聖潔無需作見證，因爲這由聖經和教會的聖傳可知。著名的聖人無疑包括童貞女馬利亞上帝之母（上帝爲她成就了大事，<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L49">路 1:49</a>）、聖祖、先知、使徒、他們所立的主教、司祭和輔祭（例如首位殉道的六品執事司提反，<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L55-60">徒 7:55-60</a>）、衆多的殉道者。此外，教會不只向聖人們祈禱，也向聖天使祈禱：總領天使米迦勒、加百列，以及<a href="https://bibleox.com/ru/ru/w/ангел-хранитель">護守天使</a>等。爲天使的聖潔作見證是多餘的，因爲這是人所共知的上帝的僕人。</p><h2>重要的說明</h2><p>在爲向聖人祈禱辯護之前，必須堅定地領會一個關鍵點：反對者沒有對禁止向聖人祈禱作出正面的解釋。反對者言論的基礎只有一句話：“聖經裏沒有說”。這是他們解釋的否定部分，他們會堅持它。而正面的部分——即對這一禁止的明確理解——他們沒有。</p><p>基督復臨安息日會的人部分地可以提出解釋，因爲他們不相信人死後靈魂的生活。不過，安息日會的人也無法解釋爲什麼不能向天使祈禱——因爲天使的存在他們目前並不否認。按聖經，天使被派給得救的人，關懷人的得救（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L14">希 1:14</a>）；爲什麼對他們什麼都不可以說？他們無法解釋。</p><p>至於其餘的（新）新教徒，他們大多數相信人在與身體分離後靈魂的生活，所以他們完全無法解釋：爲什麼不能與天上的教會相通——而我們現在已經來到她面前（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-23">希 12:22-23</a>）；爲什麼不能與聖祖們、使徒們、殉道者們、天使們交談。當然，他們會試圖說些什麼，但那總是不能令人信服。例如會說，聖徒們進入了上帝的安息，所以彷彿不再掛念地上的事了。但那樣就得出上帝也不掛念地上的事，因爲他也在同一個安息裏。他們其餘的辯解也同樣荒謬。</p><p>向聖人祈禱的必要性是從聖經隱含地（逐步地）推論出來的，就是說，這一必要性沒有直接指明，而是被蘊含的。這是正常的，因爲聖經裏不是一切都說得直白。關於上帝是三位一體這一最主要的教訓，就是從聖經隱含地推論出來的。我們的反對者自己也從聖經隱含地推論許多東西。例如，任何地方都沒有說不能給嬰兒施洗，然而他們不合理地斷言不能給嬰兒施洗，並且不因聖經裏沒有說而困擾。他們試圖從聖經的別的論斷隱含地推出這一禁止。所以極重要的是把他們引到這個領域，請他們對禁止向聖人祈禱給出一個有意義的理解。</p><p>還有，親愛的朋友，也要記住：反對向聖人祈禱的人，所反對的根本不是代求性的祈禱（因爲很容易證明：他們彼此祈禱時自己就是彼此的代求者，無論他們怎樣爭辯）。他們最反對的，是<strong>地上教會與天上教會的相通</strong>——反對與聖潔的靈——聖天使和聖人們、上帝的朋友們——的任何相通。彷彿地上的教會對天上的教會生了氣，不願意與她交談；彷彿基督身體的一部分不願與同一身體的另一部分相通。他們連一句話都不允許，甚至不允許向護守天使爲他的關懷感謝一句。因爲一旦承認與屬靈世界中的聖人們哪怕最小的相通可能，很快留給他們的，就只剩下一步一步地承認與地上教會和天上教會的相通相關的一切了。所以，作爲問題之一，值得考察與天使相通的可能——聖經中這一點展現得非常廣泛。</p>
