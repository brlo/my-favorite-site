  title: 護守天使
  copy_cover: true
  body: <h2>天使——無形體的神靈</h2><blockquote><p>“<strong><mark>所有的天使</mark></strong>，上帝從來對那一個說：『你坐在我的右邊，等我使你仇敵作你的腳凳？』 <strong><mark>天使豈不都是服役的靈</mark></strong>、奉差遣爲那將要承受救恩的人效力嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><blockquote><p>“你們看我的手，我的腳，就知道實在是我了。摸我看看！<strong><mark>魂無骨無肉</mark></strong>，你們看，我是有的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L39">路 24:39</a>)</p></blockquote><h2>天使被差遣服事得救的人</h2><blockquote><p>“<strong><mark>所有的天使</mark></strong>，上帝從來對那一個說：『你坐在我的右邊，等我使你仇敵作你的腳凳？』 <strong><mark>天使豈不都是服役的靈、奉差遣爲那將要承受救恩的人效力嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13-14">希 1:13-14</a>)</p></blockquote><h2>敬畏上帝之人的天使</h2><blockquote><p>“<strong><mark>耶和華的使者，在敬畏他的人四圍安營搭救他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L7">詩 34:7</a>) <em>(俄文本編號爲 Пс 33:7（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“<strong><mark>住在至高者隱密處的</mark></strong>，必住在全能者的蔭下。 我要論到耶和華說：「<strong><mark>他是我的避難所，是我的山寨，是我的上帝，是我所倚靠的</mark></strong>。」 &lt;…&gt; 耶和華是我的避難所；你已將至高者當你的居所， <strong><mark>禍患必不臨到你</mark></strong>，災害也不挨近你的帳棚。 <strong><mark>因他要爲你吩咐他的使者，在你行的一切道路上保護你</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/91/#L1-2,9-11">詩 91:1-2,9-11</a>) <em>(俄文本編號爲 Пс 90:1-3,9-11（聖詠編號相差一）。)</em></p></blockquote><h2>信徒的天使</h2><blockquote><p>“你們要小心，不可輕看這小子裏的一個。我告訴你們：<strong><mark>他們的使者在天上</mark></strong>，常見我天父的面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L10">太 18:10</a>)</p></blockquote><h2>天使在來世接義人的靈魂</h2><blockquote><p>“<strong><mark>後來那討飯的死了，被天使帶去放在亞伯拉罕的懷裏</mark></strong>。財主也死了，並且埋葬了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/16/#L22">路 16:22</a>)</p></blockquote><h2>舊約的義人和基督徒對天使的信仰</h2><blockquote><p>“<strong><mark>一千天使中，若有一個作傳話的與上帝同在，指示人所當行的事</mark></strong>， 上帝就給他開恩說：『<strong><mark>救贖他免得下坑</mark></strong>，我已經得了贖價。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/33/#L23-24">伯 33:23-24</a>)</p></blockquote><blockquote><p>“聽得是彼得的聲音，就歡喜的顧不得開門，跑進去告訴衆人說：「彼得站在門外！」 他們說：「你是瘋了！」使女極力的說：「真是他！」他們說：「<strong><mark>必是他的天使</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/12/#L14-15">徒 12:14-15</a>)</p></blockquote><h2>主耶穌基督——作爲人——的衆天使</h2><h3>護守天使堅固作爲人的耶穌基督</h3><blockquote><p>“<strong><mark>有一位天使從天上顯現，加添他的力量</mark></strong>。 耶穌極其傷痛，禱告更加懇切，汗珠如大血點滴在地上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L43-44">路 22:43-44</a>)</p></blockquote><h3>兩個天使爲主基督作見證</h3><h4>兩個天使一同</h4><blockquote><p>“馬利亞卻站在墳墓外面哭，哭的時候，低頭往墳墓裏看， <strong><mark>就見兩個天使，穿著白衣，在安放耶穌身體的地方坐著，一個在頭，一個在腳</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L11-12">約 20:11-12</a>)</p></blockquote><blockquote><p>“她們就進去，只是不見主耶穌的身體。 正在猜疑之間，<strong><mark>忽然有兩個人站在旁邊，衣服放光</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L3-4">路 24:3-4</a>)</p></blockquote><blockquote><p>“當他往上去，他們定睛望天的時候，<strong><mark>忽然有兩個人身穿白衣</mark></strong>，站在旁邊，說：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L10">徒 1:10</a>)</p></blockquote><h4>一個天使在墳墓外面</h4><blockquote><p>“忽然，地大震動，<strong><mark>因爲有主的使者從天上下來，把石頭滾開，坐在上面</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L2">太 28:2</a>)</p></blockquote><h4>一個天使在墳墓裏面</h4><blockquote><p>“她們進了墳墓，<strong><mark>看見一個少年人坐在右邊，穿著白袍</mark></strong>，就甚驚恐。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L5">可 16:5</a>)</p></blockquote><h2>天使解救使徒</h2><blockquote><p>“<strong><mark>忽然有主的一個使者站在旁邊，屋裏有光照耀</mark></strong>。天使拍彼得的肋旁，拍醒了他，說：「<strong><mark>快快起來</mark></strong>！」<strong><mark>那鐵鍊就從他手上脫落下來</mark></strong>。 天使對他說：「束上帶子，穿上鞋！」他就那樣作。天使又說：「披上外衣，跟著我來。」 彼得就出來跟著他，<strong><mark>不知道天使所作是真的</mark></strong>，只當見了異象。 過了第一層、第二層監牢，就來到臨街的鐵門，那門自己開了。他們出來，走過一條街，<strong><mark>天使便離開他去了</mark></strong>。 彼得醒悟過來，說：「<strong><mark>我現在真知道主差遣他的使者，救我脫離希律的手</mark></strong>和猶太百姓一切所盼望的。」 想了一想，就往那稱呼馬可的約翰他母親馬利亞家去，在那裏有好些人聚集禱告。 彼得敲外門，有一個使女名叫羅大出來探聽， 聽得是彼得的聲音，就歡喜的顧不得開門，跑進去告訴衆人說：「彼得站在門外！」 他們說：「你是瘋了！」使女極力的說：「真是他！」他們說：「<strong><mark>必是他的天使</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/12/#L7-15">徒 12:7-15</a>)</p></blockquote>
