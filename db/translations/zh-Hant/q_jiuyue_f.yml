  title: 舊約的終結
  copy_cover: true
  body: <h2>將有新約</h2><p>舊約的預言：與猶太民族（他們違背了這約）的約將終結，將與新的民族另立新約：</p><blockquote><p>“<strong><mark>但耶書侖漸漸肥胖、粗壯</mark></strong>，光潤，踢跳奔跑，<strong><mark>便離棄造他的上帝</mark></strong>，輕看救他的磐石。 <strong><mark>敬拜別神，觸動上帝的憤恨</mark></strong>，行可憎惡的事，惹了他的怒氣。 <strong><mark>所祭祀的鬼魔，並非真神</mark></strong>，乃是素不認識的神，是近來新興的，是你列祖所不畏懼的。 你輕忽生你的磐石；忘記產你的上帝。 耶和華看見他的兒女惹動他，就厭惡他們； 說：「我要向他們掩面，看他們的結局如何；他們本是極乖僻的族類，心中無誠實的兒女。 他們以那不算爲神的觸動我的憤恨；以虛無的神惹了我的怒氣。<strong><mark>我也要以那不成子民的觸動他們的憤恨</mark></strong>；以愚昧的國民惹了他們的怒氣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/32/#L15-21">申 32:15-21</a>)</p></blockquote><blockquote><p>“耶和華說：「日子將到，<strong><mark>我要與以色列家和猶大家另立新約</mark></strong>。 不像我拉著他們祖宗的手，領他們出埃及地的時候，與他們所立的約。我雖作他們的丈夫，<strong><mark>他們卻背了我的約</mark></strong>。」這是耶和華說的。 耶和華說：「那些日子以後，我與以色列家所立的約乃是這樣：<strong><mark>我要將我的律法放在他們裏面，寫在他們心上</mark></strong>。<strong><mark>我要作他們的上帝，他們要作我的子民</mark></strong>。 &lt;…&gt; 「這些定例若能在我面前廢掉，<strong><mark>以色列的後裔也就在我面前斷絕</mark></strong>，永遠不再成國。」這是耶和華說的。 耶和華如此說：「若能量度上天，尋察下地的根基，<strong><mark>我就因以色列後裔一切所行的棄絕他們</mark></strong>。」這是耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/31/#L31-33,36-37">耶 31:31-33,36-37</a>)</p></blockquote><blockquote><p>“「素來沒有訪問我的，現在求問我沒有尋找我的，我叫他們遇見；<strong><mark>沒有稱爲我名下的</mark></strong>，我對他們說：『<strong><mark>我在這裏！我在這裏！</mark></strong>』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/65/#L1">賽 65:1</a>)</p></blockquote><blockquote><p>“我必將他種在這地。素不蒙憐憫的，我必憐憫；<strong><mark>本非我民的，我必對他說</mark></strong>：『<strong><mark>你是我的民</mark></strong>。』他必說：『<strong><mark>你是我的上帝</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/os/2/#L23">何 2:23</a>)</p></blockquote><h2>論舊約的終結</h2><blockquote><p>“所以主指責他的百姓說：『日子將到，<strong><mark>我要與以色列家和猶大家另立新約</mark></strong>， &lt;…&gt; 既說新約，<strong><mark>就以前約爲舊了</mark></strong>；<strong><mark>但那漸舊漸衰的，就必快歸無有了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/8/#L8,13">希 8:8,13</a>)</p></blockquote><blockquote><p>“但他們的心地剛硬，直到今日<strong><mark>誦讀舊約的時候，這帕子還沒有揭去</mark></strong>；<strong><mark>這帕子在基督裏已經廢去了</mark></strong>。 然而直到今日，每逢誦讀摩西書的時候，帕子還在他們心上。 <strong><mark>但他們的心幾時歸向主，帕子就幾時除去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/3/#L14-16">林後 3:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>他叫我們能承當這新約的執事，不是憑著字句，乃是憑著精意</mark></strong>。<strong><mark>因爲那字句是叫人死，精意是叫人活</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/3/#L6">林後 3:6</a>)</p></blockquote><blockquote><p>“但我們既然在捆我們的律法上死了，<strong><mark>現今就脫離了律法</mark></strong>，叫我們服事主，<strong><mark>要按著心靈的新樣，不按著儀文的舊樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/7/#L6">羅 7:6</a>)</p></blockquote><blockquote><p>“但這因信得救的理還未來以先，<strong><mark>我們被看守在律法之下</mark></strong>，直圈到那將來的真道顯明出來。 這樣，<strong><mark>律法是我們訓蒙的師傅</mark></strong>，引我們到基督那裏，使我們因信稱義。 但這因信得救的理既然來到，<strong><mark>我們從此就不在師傅的手下了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L23-25">加 3:23-25</a>)</p></blockquote><h3>警告：不要濫用基督徒的自由</h3><blockquote><p>“弟兄們，<strong><mark>你們蒙召是要得自由</mark></strong>，<strong><mark>只是不可將你們的自由當作放縱情欲的機會</mark></strong>，<strong><mark>總要用愛心互相服事</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L13">加 5:13</a>)</p></blockquote>
