- src: X7l9DcTY_Спасение_возможно_только_в_Церкви
  path: Qc2A_救恩只在教會
  title: 救恩只在教會
  copy_cover: true
  body: <h2>祈禱、預言和神蹟不是得救的標誌</h2><blockquote><p>“<strong>凡稱呼我</strong>『主阿，主阿』的人，<strong><mark>不能都進天國</mark></strong>；惟獨遵行我天父旨意的人，才能進去。 當那日，必有許多人對我說：『主阿，主阿，我們不是奉你的名<strong><mark>傳道</mark></strong>，奉你的名<strong><mark>趕鬼</mark></strong>，奉你的名<strong><mark>行許多異能</mark></strong>嗎？』 我就明明地告訴他們說：『<strong><mark>我從來不認識你們</mark></strong>，你們這些作惡的人，離開我去吧！』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L21-23">太 7:21-23</a>)</p></blockquote><blockquote><p>“耶穌說：「你們要謹慎，<strong><mark>不要受迷惑</mark></strong>．因爲將來<strong><mark>有好些人冒我的名來</mark></strong>，說：『我是基督』，又說：『<strong><mark>時候近了</mark></strong>』，<strong><mark>你們不要跟從他們</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/21/#L8">路 21:8</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L5">太 24:5</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/13/#L6">可 13:6</a>)</p></blockquote><h2>得救必須在基督的身體（<a href="https://bibleox.com/ru/ru/w/Церковь">教會</a>）裏</h2><p>教會是基督的身體：</p><blockquote><p>“<strong><mark>基督的身體</mark></strong>，<strong><mark>就是爲教會</mark></strong>，要在我肉身上補滿基督患難的缺欠。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L24">西 1:24</a>)</p></blockquote><p>基督是身體的救主，也就是教會的救主：</p><blockquote><p>“基督是教會的頭，他又是<strong><mark>教會全體的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>)</p></blockquote><p>得救的門是基督：</p><blockquote><p>“<strong><mark>我就是門，凡從我進來的，必然得救</mark></strong>，並且出入得草吃。 盜賊來，無非要偷竊、殺害、毀壞；我來了，是要叫羊得生命，並且得的更豐盛。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L9-10">約 10:9-10</a>)</p></blockquote><p>主將得救的人加給教會：</p><blockquote><p>“讚美上帝，得衆民的喜愛。<strong><mark>主</mark></strong>將<strong><mark>得救的人天天加給他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L47">徒 2:47</a>) <em>(和合本此處無“歸給教會”的字樣)</em></p></blockquote><p>誰不在身體裏，就不能結果子，要被剪除，扔在火裏：</p><blockquote><p>“<strong><mark>你們要常在我裏面</mark></strong>，我也常在你們裏面。<strong><mark>枝子若不常在葡萄樹上，自己就不能結果子</mark></strong>；你們若不常在我裏面，也是這樣。 我是葡萄樹，你們是枝子，常在我裏面的，我也常在他裏面，這人就多結果子；<strong>因爲離了我，你們就不能作什麼</strong>。 <strong><mark>人若不常在我裏面，就像枝子丟在外面枯乾</mark></strong>，人拾起來，<strong>扔在火裏燒了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L4-6">約 15:4-6</a>)</p></blockquote><blockquote><p>“他是你們『匠人所棄的石頭，已成了房角的頭塊石頭。』 除他以外，<strong><mark>別無拯救</mark></strong>；因爲在天下人間，沒有賜下別的名，我們可以靠著得救。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L11-12">徒 4:11-12</a>)</p></blockquote><p>誰不與基督相合，就是敵他的：</p><blockquote><p>“<strong><mark>不與我相合的，就是敵我的</mark></strong>；不同我收聚的，就是分散的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L23">路 11:23</a>)</p></blockquote><h2>加入基督的身體（教會）</h2><h3>洗禮</h3><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong>都從一位聖靈</strong><strong><mark>受洗，成了一個身體</mark></strong>，飲於一位聖靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13">林前 12:13</a>)</p></blockquote><h3>領受聖體</h3><blockquote><p>“我們所祝福的杯，豈不是同領基督的血嗎？我們所擘開的<strong>餅</strong>，豈不是<strong>同領基督的身體</strong>嗎？ <strong>我們雖多，仍是一個餅</strong>、<strong><mark>一個身體</mark></strong>，因爲我們都是<strong><mark>分受這一個餅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><h2>方舟——舊約救恩的預表</h2><blockquote><p>“耶和華說：「<strong><mark>我要將所造的人和走獸，並昆蟲，以及空中的飛鳥，都從地上除滅</mark></strong>，因爲我造他們後悔了。」 &lt;…&gt; 世界在上帝面前敗壞，地上滿了強暴。 上帝觀看世界，見是敗壞了；凡有血氣的人，在地上都敗壞了行爲。 上帝就對挪亞說：「凡有血氣的人，他的盡頭已經來到我面前，因爲地上滿了他們的強暴，<strong><mark>我要把他們，和地一併毀滅</mark></strong>。 <strong><mark>你要用歌斐木造一隻方舟</mark></strong>，分一間一間地造，裏外抹上松香。 &lt;…&gt; 看哪，<strong><mark>我要使洪水氾濫在地上，毀滅天下</mark></strong>；<strong><mark>凡地上有血肉、有氣息的活物，無一不死</mark></strong>。 我卻要與你立約；<strong>你同你的妻，與兒子、兒婦，都要進入方舟</strong>。 凡有血肉的活物，每樣兩個，一公一母，你要帶進方舟，好在你那裏保全生命。 飛鳥各從其類，牲畜各從其類，地上的昆蟲各從其類，每樣兩個，要到你那裏，好保全生命。 你要拿各樣食物積蓄起來，好作你和牠們的食物。」 挪亞就這樣行。凡上帝所吩咐的，他都照樣行了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/6/#L7,11-14,17-22">創 6:7,11-14,17-22</a>)</p></blockquote><blockquote><p>“<strong>凡在地上有血肉的動物</strong>，就是飛鳥、牲畜、走獸和爬在地上的昆蟲，以及所有的人都死了。 <strong>凡在旱地上，鼻孔有氣息的生靈都死了</strong>； <strong>凡地上各類的活物</strong>，連人帶牲畜、昆蟲，以及空中的飛鳥，都從地上除滅了，<strong><mark>只留下挪亞和那些與他同在方舟裏的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/7/#L21-23">創 7:21-23</a>)</p></blockquote><blockquote><p>“就是那從前在挪亞預備方舟、上帝容忍等待的時候，不信從的人。當時<strong><mark>進入方舟，藉着水得救的不多，只有八個人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L20">彼前 3:20</a>)</p></blockquote><h3>舊約的預像，寫下來是爲了教導我們</h3><blockquote><p>“<strong><mark>他們遭遇這些事都要作爲鑑戒，並且寫在經上</mark></strong>，正是警戒我們這末世的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L11">林前 10:11</a>)</p></blockquote><h2>對異議的回應</h2><h3>“你們這樣說是因爲驕傲：‘只有我們得救，別人不得救’”</h3><p>上帝曾藉先知摩西建立了舊約的教會，並在其中設立了上帝所喜悅的規矩。後來，旁邊興起了撒瑪利亞民族，它由許多被遷移來的民族組成：這些人根據先知摩西的五卷書（妥拉），不接受當時的作者們（先知們）的書卷，自己建立了一個有自己規矩的、獨立的宗教團體，按自己的方式信上帝，並等候基督。基督回答撒瑪利亞婦人說：</p><blockquote><p>“<strong><mark>你們所拜的，你們不知道</mark></strong>；我們所拜的，我們知道，因爲<strong><mark>救恩是從猶太人出來的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/4/#L22">約 4:22</a>)</p></blockquote><p>基督這樣說，是因爲驕傲，還是因爲：在擅自建立的團體裏、在按書本擅自想出來的信仰裏，人確實不能得救？</p><p>當使徒說，順著情慾行事的人——其中有異端和分裂教會之事——不能承受上帝的國，他這樣說是因爲驕傲，還是因爲：帶著這樣的罪，人確實不能承受上帝的國？</p><blockquote><p>“<strong>情慾的事都是顯而易見的</strong>，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、<strong><mark>結黨</mark></strong>、<strong><mark>紛爭</mark></strong>、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>) <em>(*“紛爭”（διχοστασίαι）——分裂、分派；“結黨”（ἐριθεῖαι）——結派營私。)</em></p></blockquote><p>新教徒在這裏看到驕傲，是因爲他們憑空虛構了“只要認基督爲個人的救主就已經得救”的教義，即現在立刻得救、單憑信心得救。正教徒不持守這種教義，因此對得救有著完全不同的理解（詳見<a href="https://bibleox.com/ru/ru/w/спасение#HH-Условия-спасения">得救的條件</a>）。</p><p>來到<a href="https://bibleox.com/ru/ru/w/Православная-Церковь">正教會</a>，我們還不是得救了，而是正在得救。來到教會的人不是都能得救，只有那些利用救恩的途徑、勤懇地對付自己、根除罪的私慾、培養福音品德的人才能得救。身在正教會，只是得救的條件之一。凡尋求救恩的人都需要救恩的途徑：病人需要藥物，在大海中央溺水的人需要船。同樣，凡被罪的私慾所纏累的人，要渡過今世的海，不在罪的深淵裏沉沒，並與上帝同活，就需要<strong>救恩的途徑：正確的信仰和有恩典的聖奧祕</strong>。這些救恩的途徑，上帝把它們放在他救恩的方舟——<a href="https://bibleox.com/ru/ru/w/Православная-Церковь">正教會</a>——裏面；而這方舟是主耶穌基督上帝親自在2000年前來建立的。</p><p>近來由普通人擅自建立的團體，直接違揹上帝關於信徒合一的旨意，不但沒有救恩的途徑，反而以其分離的存在本身，把人帶進嚴重的罪的狀態——異端和分裂教會這些致死的罪（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>）。</p><p>建立自己的“教會”、分裂信徒，直接違揹基督和使徒關於信徒合一的旨意——這一切正是驕傲的表現：</p><blockquote><p>“我不但爲這些人<strong><mark>祈求</mark></strong>，也爲那些因他們的話信我的人祈求， <strong><mark>使他們都合而爲一</mark></strong>；正如你父在我裏面，我在你裏面，<strong><mark>使他們也在我們裏面</mark></strong>，<strong><mark>叫世人可以信你差了我來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L20-21">約 17:20-21</a>)</p></blockquote><blockquote><p>“弟兄們，我藉我們主耶穌基督的名，<strong><mark>勸你們</mark></strong><strong><mark>都說一樣的話</mark></strong>。你們中間也<strong><mark>不可分黨</mark></strong>，只要<strong><mark>一心一意</mark></strong>，<strong><mark>彼此相合</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/1/#L10">林前 1:10</a>)</p></blockquote><p>與基督爲敵、建立自己的“教會”，當然不能得救。使徒說，順著情慾行事、陷入異端和分裂的人，不能承受天國：</p><blockquote><p>“<strong>情慾的事都是顯而易見的</strong>，就如姦淫、污穢、邪蕩、 拜偶像、邪術、仇恨、爭競、忌恨、惱怒、<strong><mark>結黨</mark></strong>、<strong><mark>紛爭</mark></strong>、<strong><mark>異端</mark></strong>、 嫉妒〔有古卷在此有『兇殺』二字〕、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，<strong><mark>行這樣事的人必不能承受上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/5/#L19-21">加 5:19-21</a>) <em>(*“紛爭”（διχοστασίαι）——分裂、分派；“結黨”（ἐριθεῖαι）——結派營私。)</em></p></blockquote><p>使徒直說，製造分裂的人不是服事主耶穌基督：</p><blockquote><p>“弟兄們，那些<strong><mark>離間你們、叫你們跌倒</mark></strong>、背乎所學之道的人，我勸你們要留意躲避他們。 因爲這樣的人<strong><mark>不服事我們的主基督</mark></strong>，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/16/#L17-18">羅 16:17-18</a>)</p></blockquote><p>跟隨與基督爲敵的人走，怎麼能得救呢？</p><p>此外，異端和分裂教會並不是僅有的罪，還有許多別的<a href="https://bibleox.com/ru/ru/w/смертный-грех">致死的罪</a>。警告酒鬼說，他處在酗酒這個致死的罪裏，按聖經所說不能承受上帝的國（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L9">林前 6:9</a>），這是驕傲的行爲嗎？或者對殺人犯、賊、行邪術的、淫亂的人說同樣的話，也是驕傲嗎？如果這不是驕傲，而且我們應當警告這些致死的罪（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L11">弗 5:11</a>），那麼老實說，也應當警告異端者和分裂教會者，因爲異端和分裂與酗酒、殺人等等在同一條致死之罪的名單上——處在其中的人不能承受上帝的國。</p><p>那人怎樣脫離這種罪的狀態呢？離開那個由普通人近來建立的團體，放棄那個由同一個人近來想出來的信仰。然後進入主耶穌基督所建立的<a href="https://bibleox.com/ru/ru/w/Православная-Церковь">正教會</a>，領受正教的信仰——基督把這信仰教導了使徒們，使徒們把它放進正教會裏，聖靈把它永遠保存在基督的教會裏，因爲聖靈被永遠地差給了教會：</p><blockquote><p>“我要求父，父就另外賜給你們一位保惠師，叫他<strong><mark>永遠與你們同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>)</p></blockquote><blockquote><p>“凡我所吩咐你們的，都教訓他們遵守，<strong><mark>我就常與你們同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L20">太 28:20</a>)</p></blockquote>
