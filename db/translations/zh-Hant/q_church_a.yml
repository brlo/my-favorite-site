- src: Церковь-возвышение-над-миром
  path: Qc7A_教會——超越世界
  title: 教會——超越世界
  copy_cover: true
  body: <blockquote><p>“<strong><mark>不要愛世界和世界上的事</mark></strong>。人若愛世界，愛父的心就不在他裏面了。 因爲凡世界上的事，就像<strong><mark>肉體的情慾，眼目的情慾，並今生的驕傲</mark></strong>，都不是從父來的，乃是從世界來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L15-16">約壹 2:15-16</a>)</p></blockquote><blockquote><p>“你們既作順命的兒女，就<strong><mark>不要效法從前蒙昧無知的時候那放縱私慾的樣子</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L14">彼前 1:14</a>)</p></blockquote><p>必須追求上帝的樣式，而不是這個時代的樣式：</p><blockquote><p>“<strong><mark>不要效法這個世界</mark></strong>，只要心意更新而變化，叫你們<strong><mark>察驗何爲上帝的善良、純全、可喜悅的旨意</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L2">羅 12:2</a>)</p></blockquote>
  meta_desc: 教會在傳福音的同時，必須保持與世界分別爲聖
