- src: церковь-вечность
  path: Qc4A_教會——永存不斷
  title: 教會——永存不斷
  copy_cover: true
  body: <h2>上帝始終與教會同在</h2><p>聖靈被賜給教會，是直到永遠：</p><blockquote><p>“我要求父，父就另外賜給你們一位保惠師，叫他<strong><mark>永遠與你們同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>)</p></blockquote><p>主耶穌基督應許常與教會同在：</p><blockquote><p>“凡我所吩咐你們的，都教訓他們遵守，<strong><mark>我就常與你們同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L20">太 28:20</a>)</p></blockquote><h2>教會必不會被打敗</h2><p>主預言教會不可戰勝：</p><blockquote><p>“我要把我的教會建造在這磐石上，<strong>陰間的權柄不能勝過他</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L18">太 16:18</a>)</p></blockquote><h2>真理永遠在教會裏</h2><p>真理將與教會同在，直到永遠：</p><blockquote><p>“作長老的，寫信給蒙揀選的太太和她的兒女，就是我誠心所愛的；不但我愛，也是一切知道真理之人所愛的。 愛你們是爲<strong>真理的緣故</strong>，<strong><mark>這真理存在我們裏面，也必永遠與我們同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L1-2">約贰 1:1-2</a>)</p></blockquote><h2>教會永遠榮耀上帝</h2><p>在教會裏，萬代都要榮耀上帝：</p><blockquote><p>“但願他<strong><mark>在教會中</mark></strong>，並在基督耶穌裏，得著榮耀，<strong><mark>直到世世代代</mark></strong>，<strong><mark>永永遠遠</mark></strong>。阿們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/3/#L21">弗 3:21</a>)</p></blockquote><h2>直到基督再來，教會都將舉行聖餐禮</h2><blockquote><p>“你們每逢吃這<strong>餅</strong>，喝這<strong>杯</strong>，是表明主的死，<strong><mark>直等到他來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L26">林前 11:26</a>)</p></blockquote>
  meta_desc: 關於教會之不可戰勝（永存）的聖經引文
