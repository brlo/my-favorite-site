  title: 教會——主教們是平等的
  copy_cover: true
  body: <p>使徒和主教們彼此平等。使徒們常常爭論誰爲大。基督指示他們不要尋求彼此轄管的權柄：</p><blockquote><p>“<strong>門徒中間起了議論，誰將爲大</strong>。 &lt;…&gt; 對他們說：「凡爲我名接待這小孩子的，就是接待我；凡接待我的，就是接待那差我來的。<strong><mark>你們中間最小的，他便爲大</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/9/#L46,48">路 9:46,48</a>)</p></blockquote><blockquote><p>“<strong>門徒起了爭論</strong>，他們中間那一個可算爲大。 耶穌說：「外邦人有君王爲主治理他們，那掌權管他們的稱爲恩主。 <strong><mark>但你們不可這樣</mark></strong>。<strong><mark>你們裏頭爲大的，倒要像年幼的</mark></strong>；<strong><mark>爲首領的，倒要像服事人的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L24-26">路 22:24-26</a>)</p></blockquote><blockquote><p>“門徒不作聲，因爲他們<strong><mark>在路上彼此爭論誰爲大</mark></strong>。 耶穌坐下，叫十二個門徒來，說：「<strong><mark>若有人願意作首先的，他必作衆人末後的，作衆人的用人</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L34-35">可 9:34-35</a>)</p></blockquote><p>當使徒雅各和約翰求基督在他的國裏坐在他左右的時候，其餘的使徒就惱怒他們。基督指示他們所有的人，不要尋求彼此轄管的權柄：</p><blockquote><p>“耶穌叫了他們來，說：「你們知道外邦人有君王爲主治理他們，有大臣操權管束他們。 <strong><mark>只是在你們中間不可這樣</mark></strong>。你們中間誰願爲大，就必作你們的用人； 誰願爲首，就必作你們的僕人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/20/#L25-27">太 20:25-27</a>)</p></blockquote><p>這裏也是一樣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L41-44">可 10:41-44</a>）。與所有其他正教會分離的羅馬教會，引用使徒彼得的特殊權柄：</p><blockquote><p>“我要把天國的鑰匙給你，<strong><mark>凡你在地上所捆綁的，在天上也要捆綁</mark></strong>；凡你在地上所釋放的，在天上也要釋放。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L19">太 16:19</a>)</p></blockquote><p>但這權柄賜給了所有使徒：</p><blockquote><p>“我實在告訴你們：<strong><mark>凡你們在地上所捆綁的，在天上也要捆綁</mark></strong>；凡你們在地上所釋放的，在天上也要釋放。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L18">太 18:18</a>)</p></blockquote><blockquote><p>“就向他們吹一口氣，說：「你們受聖靈。 <strong><mark>你們赦免誰的罪，誰的罪就赦免了</mark></strong>；你們留下誰的罪，誰的罪就留下了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L22-23">約 20:22-23</a>)</p></blockquote><p>值得注意的是，主恰恰是給使徒彼得洗腳（隨後也給其餘的人洗），以身作則，警戒他們不要貪戀權柄：</p><blockquote><p>“<strong>我是你們的主，你們的夫子，尚且洗你們的腳</strong>，你們也當彼此洗腳。 <strong><mark>我給你們作了榜樣，叫你們照著我向你們所作的去做</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/13/#L14-15">約 13:14-15</a>)</p></blockquote><p>後來，使徒保羅當衆責備使徒彼得（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/2/#L11">加 2:11</a>）；在耶路撒冷第一次使徒會議上主持的是使徒雅各（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/15/#L13,19">徒 15:13,19</a>）；而使徒彼得設立主教，不僅是在羅馬，也在例如安提阿。</p><p>使徒們的門徒寫道，主教們是使徒的繼任者。凡屬於使徒的，也屬於主教。使徒門徒和古代基督徒論此的引文：<a href="https://bibleox.com/ru/ru/w/qeuY_Епископы__преемники_апостолов">主教——使徒的繼任者</a></p>
  meta_desc: 關於主教們彼此平等的聖經引文
