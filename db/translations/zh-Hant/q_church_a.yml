  path: Qc1A_教會
  title: 教會
  copy_cover: true
  body: <h2>定義：教會——基督的身體</h2><blockquote><p>“又將萬有服在他的腳下，使他<strong>爲教會作萬有之首</strong>。 <strong><mark>教會是他的身體</mark></strong>，是那充滿萬有者所充滿的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>你們就是基督的身子</mark></strong>，並且各自作肢體。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L27">林前 12:27</a>)</p></blockquote><blockquote><p>“<strong>豈不知你們的身子是基督的肢體嗎</strong>？我可以將基督的肢體作爲娼妓的肢體嗎？斷乎不可！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/6/#L15">林前 6:15</a>)</p></blockquote><blockquote><p>“正如我們一個身子上有好些肢體，肢體也不都是一樣的用處。 <strong>我們這許多人，在基督裏</strong><strong><mark>成爲一身</mark></strong>，互相聯絡作肢體，也是如此。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L4-5">羅 12:4-5</a>)</p></blockquote><blockquote><p>“現在我爲你們受苦，倒覺歡樂，並且爲<strong><mark>基督的身體</mark></strong>，<strong><mark>就是爲教會</mark></strong>，要在我肉身上補滿<strong>基督患難的缺欠</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L24">西 1:24</a>)</p></blockquote><blockquote><p>“從來沒有人恨惡自己的身子，總是保養顧惜，正像<strong>基督待教會</strong>一樣， <strong><mark>因我們是他身上的肢體</mark></strong>〔有古卷在此有『就是他的骨、他的肉』〕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L29-30">弗 5:29-30</a>)</p></blockquote><blockquote><p>“又要叫基督的平安在你們心裏作主，<strong>你們也爲此蒙召</strong>，<strong><mark>歸爲一體</mark></strong>．且要存感謝的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L15">西 3:15</a>)</p></blockquote><h2>加入身體（教會）</h2><h3>洗禮</h3><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong>都從一位聖靈</strong><strong><mark>受洗，成了一個身體</mark></strong>，飲於一位聖靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13">林前 12:13</a>)</p></blockquote><h3>領受聖體</h3><blockquote><p>“我們所祝福的杯，豈不是同領基督的血嗎？我們所擘開的<strong>餅</strong>，豈不是<strong><mark>同領基督的身體</mark></strong>嗎？ <strong>我們雖多，仍是一個餅、一個身體，因爲我們都是分受這一個餅</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><h2>基督——身體（教會）的救主</h2><blockquote><p>“因爲丈夫是妻子的頭，如同<strong>基督是教會的頭</strong>，他又是<strong><mark>教會全體的救主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>)</p></blockquote><blockquote><p>“<strong><mark>你們要常在我裏面</mark></strong>，我也常在你們裏面。<strong>枝子若不常在葡萄樹上，自己就不能結果子</strong>；<strong>你們若不常在我裏面，也是這樣</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L4">約 15:4</a>)</p></blockquote><h3>基督把得救的人帶進教會</h3><blockquote><p>“讚美上帝，得衆民的喜愛。<strong><mark>主</mark></strong>將<strong><mark>得救的人天天加給他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L47">徒 2:47</a>) <em>(和合本此處無“歸給教會”的字樣)</em></p></blockquote><p>好撒瑪利亞人的比喻中，那憐憫人的撒瑪利亞人是基督救人的預像。他爲傷者包裹傷口，把他帶到客店（教會），並把照應他痊癒（得救）的事託付給客店：</p><blockquote><p>“有一個人從耶路撒冷下耶利哥去，落在強盜手中。他們剝去他的衣裳，把他打個半死，就丟下他走了。 &lt;…&gt; 惟有一個<strong><mark>撒瑪利亞人</mark></strong>行路來到那裏，看見他就動了慈心， <strong><mark>上前用油和酒倒在他的傷處，包裹好了</mark></strong>，<strong>扶他騎上自己的牲口，帶到店裏去照應他</strong>。 第二天拿出二錢銀子來，交給店主，說：『你且<strong>照應他</strong>．此外所費用的，我回來必還你。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L30,33-35">路 10:30,33-35</a>)</p></blockquote><h2>教會的構成</h2><h3>身體的頭——基督</h3><blockquote><p>“<strong>他也是教會全體之首</strong>，他是元始，是從死裏首先復生的，使他可以在凡事上居首位。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L18">西 1:18</a>)</p></blockquote><blockquote><p>“又將萬有服在他的腳下，使他<strong>爲教會作萬有之首</strong>。 <strong>教會是他的身體</strong>，是那充滿萬有者所充滿的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L22-23">弗 1:22-23</a>)</p></blockquote><blockquote><p>“<strong>不持定元首</strong>。全身既然靠著他，筋節得以相助聯絡，就因上帝大得長進。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L19">西 2:19</a>)</p></blockquote><h3>身體裏沒有別的頭，只有基督</h3><p>使徒和主教們彼此平等。使徒們常常爭論誰爲大。基督指示他們不要尋求彼此轄管的權柄（詳見<a href="https://bibleox.com/ru/ru/w/церковь-епископы-равны">教會——主教們是平等的</a>）：</p><blockquote><p>“<strong>門徒起了爭論</strong>，他們中間那一個可算爲大。 耶穌說：「外邦人有君王爲主治理他們，那掌權管他們的稱爲恩主。 <strong><mark>但你們不可這樣</mark></strong>。<strong><mark>你們裏頭爲大的，倒要像年幼的</mark></strong>；<strong><mark>爲首領的，倒要像服事人的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L24-26">路 22:24-26</a>)</p></blockquote><h3>身體的肢體各不相同</h3><blockquote><p>“上帝在教會所設立的：第一是<strong>使徒</strong>，第二是<strong>先知</strong>，第三是<strong>教師</strong>，其次是<strong>行異能的</strong>，再次是得恩賜<strong>醫病的</strong>，幫助人的，治理事的，<strong>說方言的</strong>。 豈都是使徒嗎？豈都是先知嗎？豈都是教師嗎？豈都是行異能的嗎？ 豈都是得恩賜醫病的嗎？豈都是說方言的嗎？豈都是<strong>繙方言的</strong>嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28-30">林前 12:28-30</a>)</p></blockquote><blockquote><p>“<strong><mark>身子原不是一個肢體，乃是許多肢體</mark></strong>。 設若腳說：「我不是手，所以不屬乎身子。」它不能因此就不屬乎身子。 設若耳說：「我不是眼，所以不屬乎身子。」它也不能因此就不屬乎身子。 若全身是眼，從哪裏聽聲呢？若全身是耳，從哪裏聞味呢？ 但如今上帝隨自己的意思把肢體俱各安排在身上了。 若都是一個肢體，身子在那裏呢？ <strong>但如今肢體是多的，身子卻是一個</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L14-20">林前 12:14-20</a>)</p></blockquote><h2>地上教會與天上教會的合一（基督的一個身體）</h2><h3>天上的與地上的在基督裏聯合</h3><blockquote><p>“願頌讚歸與我們主耶穌基督的父上帝！他在基督裏曾賜給我們天上各樣屬靈的福氣。 &lt;…&gt; 都是照他自己所預定的美意，叫我們知道他旨意的奧祕， 要照所安排的，在日期滿足的時候，<strong><mark>使天上地上一切所有的，都在基督裏面同歸於一</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L3,9-10">弗 1:3,9-10</a>)</p></blockquote><blockquote><p>“因此，我在父面前屈膝， （<strong><mark>天上地上的各家</mark></strong>，都是<strong>從他得名</strong>。）” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/3/#L14-15">弗 3:14-15</a>)</p></blockquote><blockquote><p>“他也是教會全體之首，他是元始，是從死裏首先復生的，使他可以在凡事上居首位。 因爲父喜歡叫<strong>一切的豐盛在他裏面居住</strong>。 既然藉着他在十字架上所流的血成就了和平，便藉着他叫萬有，<strong><mark>無論是地上的、天上的</mark></strong>，都與自己和好了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L18-20">西 1:18-20</a>)</p></blockquote><blockquote><p>“因此<strong><mark>基督</mark></strong>死了，又活了，<strong><mark>爲要作死人並活人的主</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L9">羅 14:9</a>)</p></blockquote><h3>所有肢體彼此聯絡、彼此相顧</h3><p>整個身體以種種聯絡互相結合：</p><blockquote><p>“惟用愛心說誠實話，凡事長進，連於元首基督。 <strong>全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助</strong>，便叫身體漸漸增長，在愛中建立自己。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L15-16">弗 4:15-16</a>)</p></blockquote><blockquote><p>“不持定元首。<strong><mark>全身既然靠著他，筋節得以相助聯絡</mark></strong>，就因上帝大得長進。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L18-19">西 2:18-19</a>)</p></blockquote><p>它的所有肢體彼此認識、彼此相顧：</p><blockquote><p>“但如今上帝隨自己的意思把<strong>肢體俱各安排在身上</strong>了。 若都是一個肢體，身子在那裏呢？ 但如今<strong>肢體是多的，身子卻是一個</strong>。 眼不能對手說：「我用不著你。」頭也不能對腳說：「我用不著你。」 不但如此，身上肢體，人以爲軟弱的，更是不可少的。 身上肢體，我們看爲不體面的，越發給它加上體面；不俊美的，越發得著俊美。 我們俊美的肢體，自然用不著裝飾；但上帝配搭這身子，把加倍的體面給那有缺欠的肢體， <strong><mark>免得身上分門別類</mark></strong>，<strong><mark>總要肢體彼此相顧</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L18-25">林前 12:18-25</a>)</p></blockquote><h3>在地上，教會是爭戰的</h3><blockquote><p>“<strong><mark>務要謹守、儆醒</mark></strong>，因爲<strong><mark>你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L8">彼前 5:8</a>)</p></blockquote><blockquote><p>“要穿戴上帝所賜的全副軍裝，<strong>就能抵擋魔鬼的詭計</strong>。 因我們並不是與屬血氣的爭戰，乃是與那些執政的、掌權的、管轄這幽暗世界的，以及<strong><mark>天空屬靈氣的惡魔</mark></strong>爭戰。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L11-12">弗 6:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>我們在這裏本沒有常存的城</mark></strong>，乃是尋求那將來的城。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L14">希 13:14</a>)</p></blockquote><h3>在天上，教會是得勝的</h3><blockquote><p>“你們乃是來到錫安山，永生上帝的城邑，就是<strong>天上的耶路撒冷</strong>。那裏有千萬的天使， 有名錄在天上<strong><mark>諸長子之會所共聚的總會</mark></strong>，有審判衆人的上帝和<strong>被成全之義人的靈魂</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote><h2>教會是看得見的</h2><p>她不能向人隱藏</p><blockquote><p>“你們是世上的光。<strong><mark>城造在山上，是不能隱藏的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L14">太 5:14</a>)</p></blockquote><p>上帝安置身體（教會）的肢體，爲使身體沒有分裂，而是彼此相顧，同受苦，同快樂：</p><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong>都從一位聖靈受洗，成了一個身體</strong>，飲於一位聖靈。 <strong><mark>身子原不是一個肢體，乃是許多肢體</mark></strong>。 &lt;…&gt; <strong><mark>眼不能對手說</mark></strong>：「我用不著你。」頭也不能對腳說：「我用不著你。」 不但如此，身上肢體，人以爲軟弱的，更是不可少的。 身上肢體，我們看爲不體面的，越發給它加上體面；不俊美的，越發得著俊美。 我們俊美的肢體，自然用不著裝飾；但<strong><mark>上帝配搭這身子</mark></strong>，把加倍的體面給那有缺欠的肢體， <strong><mark>免得身上分門別類</mark></strong>，<strong><mark>總要肢體彼此相顧</mark></strong>。 <strong><mark>若一個肢體受苦，所有的肢體就一同受苦</mark></strong>；若一個肢體得榮耀，所有的肢體就一同快樂。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13-14,21-26">林前 12:13-14,21-26</a>)</p></blockquote><p>整個身體以種種聯絡互相結合：</p><blockquote><p>“惟用愛心說誠實話，凡事長進，連於元首基督。 <strong>全身都靠他聯絡得合式，百節各按各職，照著各體的功用彼此相助</strong>，便叫身體漸漸增長，在愛中建立自己。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L15-16">弗 4:15-16</a>)</p></blockquote><blockquote><p>“不持定元首。<strong><mark>全身既然靠著他，筋節得以相助聯絡</mark></strong>，就因上帝大得長進。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/2/#L18-19">西 2:18-19</a>)</p></blockquote><p>可以向教會請求審判：</p><blockquote><p>“倘若你的弟兄得罪你，你就去趁著只有他和你在一處的時候，指出他的錯來。他若聽你，你便得了你的弟兄； &lt;…&gt; 若是不聽他們，就<strong><mark>告訴教會</mark></strong>；<strong><mark>若是不聽教會，就看他像外邦人和稅吏一樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L15,17">太 18:15,17</a>)</p></blockquote><p>關於教會的邊界，詳見<a href="https://bibleox.com/ru/ru/w/Церковь-видимое-единство">教會——看得見的合一</a>。</p><h2>教會是不可戰勝的</h2><h3>教會不能被戰勝</h3><blockquote><p>“我要把我的教會建造在這磐石上，<strong>陰間的權柄</strong><strong><mark>不能勝過他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L18">太 16:18</a>)</p></blockquote><h3>上帝始終與教會同在</h3><blockquote><p>“我要求父，父就另外賜給你們一位保惠師，叫他<strong><mark>永遠與你們同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>)</p></blockquote><blockquote><p>“凡我所吩咐你們的，都教訓他們遵守，<strong><mark>我就常與你們同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L20">太 28:20</a>)</p></blockquote><h3>教會永遠榮耀上帝</h3><blockquote><p>“但願他<strong><mark>在教會中</mark></strong>，並在基督耶穌裏，得著榮耀，<strong><mark>直到世世代代</mark></strong>，<strong><mark>永永遠遠</mark></strong>。阿們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/3/#L21">弗 3:21</a>)</p></blockquote><h3>真理永遠在教會裏</h3><blockquote><p>“作長老的，寫信給蒙揀選的太太和她的兒女，就是我誠心所愛的；不但我愛，也是一切知道真理之人所愛的。 愛你們是爲<strong><mark>真理的緣故</mark></strong>，<strong><mark>這真理存在我們裏面，也必永遠與我們同在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2in/1/#L1-2">約贰 1:1-2</a>)</p></blockquote><h2>教會的旗幟——十字架</h2><p>在舊約裏，以色列人在前往應許之地的路上，行軍的隊形是十字形：詳見<a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">以色列的營陣——十字形</a>。古代的以色列是基督教會的預像——<a href="https://bibleox.com/ru/ru/w/церковь-новый-израиль">新的以色列</a>。這樣，十字架就成了教會主要的旗幟、得勝的象徵、和好的象徵、祭壇（即偉大的聖物）：詳見<a href="https://bibleox.com/ru/ru/w/крест#HH-Крест--орудие-победы-и-примирения">關於十字架的詳情</a>。</p><p>古代基督徒畫十字聖號的做法：<a href="https://bibleox.com/ru/ru/w/крестное-знамение">十字聖號</a></p><h2>教會建立之日——基督復活後的第50天</h2><ol><li><p>人藉洗禮進入教會（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13">林前 12:13</a>）。</p></li><li><p>洗禮是用水和聖靈施行的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L3,5-6">約 3:3,5-6</a>）。</p></li><li><p>聖靈的洗禮首次施行於基督復活後的第50天（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L1-5,8-9">徒 1:1-5,8-9</a>）。</p></li></ol><h3>人藉洗禮進入教會</h3><blockquote><p>“我們不拘是猶太人，是希利尼人，是爲奴的，是自主的，<strong>都從一位聖靈</strong><strong><mark>受洗，成了一個身體</mark></strong>，飲於一位聖靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L13">林前 12:13</a>)</p></blockquote><blockquote><p>“你們<strong>受洗歸入基督的，都是披戴基督了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L27">加 3:27</a>)</p></blockquote><h3>洗禮——從水和聖靈而生</h3><blockquote><p>“人若不是<strong><mark>從水和聖靈生的</mark></strong>，就<strong>不能進上帝的國</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L5">約 3:5</a>)</p></blockquote><h3>基督將用聖靈施洗</h3><blockquote><p>“約翰說：「我是用水給你們施洗，但<strong>有一位能力比我更大的要來</strong>，我就是給他解鞋帶也不配。<strong><mark>他要用聖靈與火給你們施洗</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L16">路 3:16</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L11">太 3:11</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/1/#L8">可 1:8</a>)</p></blockquote><h3>基督不去，聖靈不來</h3><blockquote><p>“然而我將真情告訴你們：我去是與你們有益的。<strong>我若不去，保惠師就不到你們這裏來</strong>；我若去，就差他來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/16/#L7">約 16:7</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L26">約 14:26</a>)</p></blockquote><blockquote><p>“但我要<strong><mark>從父那裏差保惠師來</mark></strong>，就是從父出來真理的聖靈，他來了，就要爲我作見證。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L26">約 15:26</a>)</p></blockquote><blockquote><p>“我要將我父所應許的降在你們身上，<strong><mark>你們要在城裏等候，直到你們領受從上頭來的能力</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L49">路 24:49</a>)</p></blockquote><h3>基督復活之後還未升到父那裏去</h3><blockquote><p>“耶穌說：「不要摸我，因<strong><mark>我還沒有升上去見我的父</mark></strong>。你往我弟兄那裏去，告訴他們說，我要升上去見我的父，也是你們的父；見我的上帝，也是你們的上帝。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L17">約 20:17</a>)</p></blockquote><h3>基督所應許的，在復活後的第50天成就</h3><p>所應許的聖靈的洗禮，在基督復活50天后首次成就：</p><blockquote><p>“提阿非羅啊，我已經作了前書，論到耶穌開頭一切所行所教訓的， 直到他藉着聖靈吩咐所揀選的使徒，以後被接上升的日子爲止。 他受害之後，用許多的憑據將自己活活的顯給使徒看，<strong><mark>四十天之久向他們顯現</mark></strong>，講說上帝國的事。 <strong>耶穌和他們聚集的時候，囑咐他們說</strong>：「<strong><mark>不要離開耶路撒冷，要等候父所應許的</mark></strong>，就是你們聽見我說過的。 <strong><mark>約翰是用水施洗</mark></strong>，但不多幾日，<strong><mark>你們要受聖靈的洗</mark></strong>。」 &lt;…&gt; <strong>但聖靈降臨在你們身上，你們就必得著能力</strong>；並要在耶路撒冷、猶太全地和撒瑪利亞，直到地極，作我的見證。」 說了這話，他們正看的時候，他就被取上升，<strong>有一朵雲彩把他接去</strong>，便看不見他了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/1/#L1-5,8-9">徒 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>五旬節到了</mark></strong>，門徒都聚集在一處。 &lt;…&gt; <strong><mark>又有舌頭如火焰顯現出來，分開落在他們各人頭上</mark></strong>。 <strong><mark>他們就都被聖靈充滿</mark></strong>，按著聖靈所賜的口才說起別國的話來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L1,3-4">徒 2:1,3-4</a>)</p></blockquote><h3>不過，在基督復活的當天也講到差遣聖靈，只是沒有講到洗禮</h3><p>這裏使徒們領受了教會的權柄，建立了司祭的等次：</p><blockquote><p>“<strong>七日的第一日</strong>清早，天還黑的時候，抹大拉的馬利亞來到墳墓那裏，看見石頭從墳墓挪開了， &lt;…&gt; 那日（就是七日的第一日）晚上，門徒所在的地方，因怕猶太人，門都關了。<strong><mark>耶穌來站在當中</mark></strong>，對他們說：「願你們平安！」 &lt;…&gt; 說了這話，<strong><mark>就向他們吹一口氣，說</mark></strong>：「<strong><mark>你們受聖靈</mark></strong>。 你們赦免誰的罪，誰的罪就赦免了；你們留下誰的罪，誰的罪就留下了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L1,19,22-23">約 20:1,19,22-23</a>)</p></blockquote><h2>對異議的回應</h2><h3>“歷史教會墮落了”</h3><p>那些與教會分離的社團的創立者們，把自己運動的生存模式建立在這樣一個論斷上：歷史上基督的教會背棄了上帝而墮落，所以才需要他們那個分離的社團。可是，如果不證明教會已經墮落，那他們的分離社團就沒有必要，人應該加入歷史上基督的教會。</p><p>爲了證明教會墮落的觀念，常引用類似下面關於豺狼的經文：</p><blockquote><p>“<strong><mark>我知道我去之後</mark></strong>，<strong><mark>必有兇暴的豺狼進入你們中間，不愛惜羊羣</mark></strong>。 就是你們中間，<strong><mark>也必有人起來，說悖謬的話</mark></strong>，<strong><mark>要引誘門徒跟從他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L29-30">徒 20:29-30</a>)</p></blockquote><p>然而必須承認，這些經文只是預言會出現假教師，想把人從教會裏引到自己那邊去，而<strong>不是</strong>預言教會墮落。</p><p>在此之上，使徒勸勉長老們謹慎看顧自己和羊羣：</p><blockquote><p>“<strong>保羅從米利都打發人往以弗所去</strong>，<strong><mark>請教會的長老來</mark></strong>。 &lt;…&gt; <strong><mark>聖靈立你們作全羣的監督</mark></strong>，<strong><mark>你們就當爲自己謹慎，也爲全羣謹慎</mark></strong>，<strong><mark>牧養上帝的教會</mark></strong>，就是他用自己血所買來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L17,28">徒 20:17,28</a>)</p></blockquote><p>使徒爲什麼勸勉牧養羊羣？他隨即給出回答：因爲將出現假教師，他們要像豺狼一樣想把教會的羊羣擄去（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L29-30">徒 20:29-30</a>）。但聖靈所立的長老們不應容許這事發生。</p><p>長老們能護住教會的羊羣嗎？能。因爲聖經沒有教會墮落的預言，倒有教會不可戰勝的預言：</p><blockquote><p>“我要把<strong>我的教會</strong>建造在這磐石上，<strong>陰間的權柄</strong><strong><mark>不能勝過他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L18">太 16:18</a>)</p></blockquote><blockquote><p>“但願他<strong><mark>在教會中</mark></strong>，並在基督耶穌裏，得著榮耀，<strong>直到世世代代</strong>，<strong><mark>永永遠遠</mark></strong>。阿們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/3/#L21">弗 3:21</a>)</p></blockquote><blockquote><p>“凡我所吩咐你們的，都教訓他們遵守，<strong><mark>我就常與你們同在</mark></strong>，<strong><mark>直到世界的末了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L20">太 28:20</a>)</p></blockquote><blockquote><p>“我要求父，父就另外賜給你們一位保惠師，叫他<strong><mark>永遠與你們同在</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L16">約 14:16</a>)</p></blockquote><h3>“教會就是兩三個人奉主名聚集祈禱”</h3><p>基督已經建立了自己的教會之後，後來那些基督教社團的創立者首先要做的，是向人解釋他們這個與基督的教會分離的新社團的出現。這樣的社團由普通人不久前發起，與古代基督徒沒有直接的歷史聯繫，因此總要證明自己以某種方式屬於2000年前基督所建立的教會。爲此常引用聖經中關於共同祈禱之重要性的經文。他們提出：既然基督在兩三個祈禱的人中間，那這些祈禱的人自己就已經是教會了：</p><blockquote><p>“我又告訴你們：若是你們中間有兩個人在地上同心合意的求什麼事，我在天上的父必爲他們成全。 因爲無論在那裏，<strong><mark>有兩三個人奉我的名聚會，那裏就有我在他們中間</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L19-20">太 18:19-20</a>)</p></blockquote><p>然而這些經文字面上說的只是共同祈禱的能力，而不是教會。這裏沒有教會一詞。而在幾節之前，卻有教會的話：</p><blockquote><p>“<strong>倘若你的弟兄得罪你</strong>，<strong><mark>你就去趁著只有他和你在一處的時候</mark></strong>，指出他的錯來。他若聽你，你便得了你的弟兄； 他若不聽，你就<strong><mark>另外帶一兩個人同去</mark></strong>，要憑兩三個人的口作見證，句句都可定準。 若是不聽他們，就<strong><mark>告訴教會</mark></strong>；<strong><mark>若是不聽教會</mark></strong>，就看他像外邦人和稅吏一樣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L15-17">太 18:15-17</a>)</p></blockquote><p>這裏聚集的人是：</p><ul><li><p>我；</p></li><li><p>得罪的弟兄；</p></li><li><p>另外一位或兩位見證人。</p></li></ul><p>一共是1+1+2=4。或者至少3人。</p><p>這聚在一起的三個人仍不是教會，可以看出來：因爲他們要尋求審判，不是找他們自己，而是找教會。這樣，教會不是兩三個爲祈禱而聚集的人，而是某種持續存在的、看得見的實體，可以向它尋求審判，可以聽見它的回答，並且遵行或不遵行。不聽教會回答的人，在教會的肢體面前就成爲“像外邦人和稅吏一樣”。</p><p>那麼誰能審判呢？使徒和他們的繼任者主教（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L18">太 18:18</a>）。例如主教提摩太：</p><blockquote><p>“<strong><mark>控告長老的呈子，非有兩三個見證就不要收</mark></strong>。 犯罪的人，當在衆人面前責備他，叫其餘的人也可以懼怕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L19-20">提前 5:19-20</a>)</p></blockquote><p>所以，說兩三個祈禱的人就是教會的解釋是不成立的——他們沒有審判別人的權柄。那個與教會分離的社團的創立者自己，不聽教會，就在教會面前成爲“像外邦人和稅吏一樣”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L17">太 18:17</a>）。他在自己的社團裏要審判誰呢？他自己從來沒有領受過的權柄，他怎麼能給出呢？答案顯而易見。</p>
  meta_desc: 教會是基督的身體：定義、加入、構成、合一、可見、不可戰勝
