    attendant angels who will take it to heaven. The apostles, led by Saints Paul
    and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a
