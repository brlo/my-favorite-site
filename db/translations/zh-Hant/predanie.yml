    × 10.5 釐米</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">放大</a>]</p><h2>10世紀</h2><h3>基督、誕神女、洗者若翰（拜占庭）</h3><p>10世紀。<a
    href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">大英博物館</a>。材料：象牙。高：15.5
    釐米。</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary
    and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img
    src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a
