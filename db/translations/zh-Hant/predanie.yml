    2</a>]</p><p>馬賽克保存得不好。基督像只剩下光環的一部分、一隻手和十字架。周圍天使的面容清晰可見。</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">放大</a>]</p><h3>聖主教、軍人、醫生（塞薩洛尼基，拜占庭）</h3><p>4世紀末。[17][18]
