    href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">艾爾米塔什博物館（俄羅斯）</a>。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">放大</a>]</p><h3>塞薩洛尼基的聖狄米特里（拜占庭）</h3><p><a
    href="tel:950-1000">950—1000</a>年。<a href="https://www.metmuseum.org/art/collection/search/465946">大都會藝術博物館（第五大道，美國）</a>。材料：象牙。19.7
    × 12.1 × 1 釐米。</p><p>Standing erect, a spear in his hand and a shield at his side,
    Saint Demetrios is shown ready to protect the Christian faithful. The name of
    the popular Byzantine military saint is inscribed in two parts in Greek. Martyred
    in Thessalonike, the second most important city of the empire in the early centuries
    of the church, he has long been the patron saint of that metropolis. Images of
    saints in military dress are rare in Early Byzantine art (they appear on the chalices
    of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img
    src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">放大</a>]</p><h2>11世紀</h2><h3>遊行十字架：基督、誕神女、總領天使彌額爾和加俾額爾（拜占庭）</h3><p>1000—1050年。<a
