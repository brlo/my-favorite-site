    <p><strong>鏈接：</strong></p><ul>
    <li><p><a href="https://www.museumofthebible.org/newsroom/museum-of-the-bible-to-premiere-megiddo-mosaic">https://www.museumofthebible.org/newsroom/museum-of-the-bible-to-premiere-megiddo-mosaic</a></p></li>
    <li><p><a href="https://en.wikipedia.org/wiki/Legio">https://en.wikipedia.org/wiki/Legio</a></p></li>
    <li><p><a href="https://en.wikipedia.org/wiki/Megiddo_church_(Israel)">https://en.wikipedia.org/wiki/Megiddo_church_(Israel)</a></p></li>
    </ul><p>譯自俄語：羅季翁·弗拉索夫（藉助人工智能）。聖經引文據思高本。</p>
