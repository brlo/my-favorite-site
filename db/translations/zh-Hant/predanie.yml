    title: "\U0001F5BC️ 古代聖像集"
    priority: 3
  body: <h2>約公元前15世紀</h2><h3>會幕</h3><p>在聖所中間的帳幔上（聖所與至聖所之間）繡有革魯賓（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L31">出
    26:31</a>），四周的幔子（牆）上也有（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出
    26:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/36/#L8">出 36:8</a>），但這幅圖的作者沒有畫出來。會幕是天上實在的像（聖像）（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L8-9,40">出 25:8-9,40</a>；<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L44">徒
    7:44</a>）。天主命人敬重聖所（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利
    19:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>）。</p><img
    src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">外觀</a>]</p><h3>約櫃</h3><p>約櫃上有兩個革魯賓天使的像（<a
    href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">經文出處</a>（俄語））。先知若蘇厄在約櫃前俯伏（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">放大</a>]</p><h3>以色列的營地</h3><p>以色列以十字形移動（<a
    href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">經文出處</a>（俄語））。</p><img
    src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">放大</a>]</p><h2>約公元前10世紀</h2><h3>撒羅滿在耶路撒冷建造的聖殿</h3><p>雕刻的革魯賓像在聖殿的牆上（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L32">王上 6:32</a>）、入口的門上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L32">王上
    6:32</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L35">王上 6:35</a>）和至聖所入口前的帳幔上（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L14">代下 3:14</a>；<a href="https://bibleox.com/zh-Hant/cn-sbt/1mak/1/#L22">加上
    1:22</a>）。至聖所裏立著兩座鍍金的大木質革魯賓像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L23">王上
    6:23</a>）。約櫃的蓋上做了兩座革魯賓像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L18-20">出
    25:18-20</a>）。在聖殿的院子裏，洗濯盆的大座架上刻有獅子、牛和革魯賓（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/7/#L28-29">王上
    7:28-29</a>）。（<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">詳見</a>（俄語））</p><p>先知達味向著聖殿俯伏（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L8">詩 5:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩
    99:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>），藉著這個像向天主表示敬意。</p><img
    src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">放大</a>]</p><h2>2世紀</h2><h3>抱著嬰孩耶穌的誕神女，一位先知指著星（羅馬）</h3><p>2世紀至3世紀初。普里西拉地下墓穴[6]。這是最古老的誕神女像。誕神女身旁的人似乎左手拿著書，右手的手指指著一顆星。</p><img
    src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">版本
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">版本
    3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">版本
    4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">版本
    5</a>]</p><p>誕神女身旁的人可能是說過這預言的先知依撒意亞：</p><blockquote><p>“因此，主自己要給你們一個兆頭，<strong>必有童女懷孕生子</strong>，給他起名叫以馬內利”（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/is/7/#L14">賽 7:14</a>）</p></blockquote><p>或者是巴郎：</p><blockquote><p>“我看見他，卻不是在現在；我望見他，卻不是在近處：<strong>由雅各伯將出現一顆星</strong>，由以色列將興起一權杖，擊碎摩阿布的額角，粉碎舍特一切子民的腦蓋”（<a
    href="https://bibleox.com/zh-Hant/cn-sbt/chis/24/#L17">民 24:17</a>）</p></blockquote><p>或者畫家只是用這種手法代替說明文字。他邀請我們拿起書來，讀關於升起之星的預言，明白他畫的是這預言所說的那一位的誕生，也就是救主由貞女誕生。</p><h3>善牧基督</h3><p>2世紀末。羅馬。加里斯都地下墓穴（<a
    href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus
    Catacomb, Crypt of Lucina</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">放大</a>]</p><h2>3世紀</h2><h3>誕神女“奧蘭塔”（祈禱者）（羅馬）</h3><p>Catacomba
    Maggiore，羅馬[26][27]。前景畫的是童貞馬利亞和嬰孩基督。</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">版本
    2</a>]</p><h3>基督、宗徒、殉道者戈爾戈尼、彼得、瑪策林和提布爾齊（羅馬）</h3><p>瑪策林和彼得地下墓穴</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">版本
    2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">放大</a>]</p><h3>一位婦女向善牧祈禱（羅馬）</h3><p>3世紀。普里西拉地下墓穴[6]。</p><p>這些畫構成一個整體。畫家這樣安排：四周畫的祈禱者都望向房間頂部並舉起雙手，那裏畫的是作爲<strong>善牧</strong>的基督（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L11">約 10:11</a>）。善牧周圍的所有場景都有一個共同的主題：<strong>從死亡中得救</strong>。</p><img
    src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">版本
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">版本
    3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">版本
    4</a>]</p><p>善牧就是基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/15/#L6-7">路
    15:6-7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L1-21">約 10:1-21</a>；<a
    href="https://bibleox.com/zh-Hant/cn-sbt/ps/23/">詠 23</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">版本
    2</a>]</p><p>一位蒙頭的婦女舉起雙手祈禱（可能是撒辣：<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L1-15">創
    18:1-15</a> 和 <a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/21/#L1-7">創 21:1-7</a>）。</p><img
    src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">放大</a>]</p><p>右邊是舊約場景：三位青年（<a
    href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">沙得辣客、默舍客和阿貝得訥哥</a>）舉起雙手祈禱（<a
    href="https://bibleox.com/zh-Hant/cn-sbt/dan/3/">達 3</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">版本
    2</a>]</p><p>左邊是舊約場景：亞巴郎和依撒格帶著獻祭用的木柴（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/22/#L1-19">創
    22:1-19</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">放大</a>]</p><p>入口上方畫著被海中巨獸吞下的先知約納（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/ion/2/#L1">拿 2:1</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">放大</a>]</p><p>房間正面所畫的祈禱婦女生平的場景值得更詳細地描述。</p><img
    src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">放大</a>]</p><p><strong>正面場景中的事件</strong></p><p>房間構圖的每一部分都畫一個場景，所有場景都是基督教主題的重要組成部分。上面是善牧，左邊是亞巴郎，右邊是三位青年，通道上是先知約納。因此可以推測，畫家在難以確定解釋的房間正面也遵守了這個規則（一部分一個重要場景）。以下只是一個推測。由於除中央外各面都畫著舊約場景，正面可能畫的是哈加爾的故事（<a
    href="https://bibleox.com/zh-Hant/cn-sbt/gen/16/">創 16</a>、<a href="https://bibleox.com/zh-Hant/cn-sbt/gen/21/">創
    21</a>）。若是這樣，先畫的是亞巴郎和帶著兒子依市瑪耳被趕走的哈加爾（1），然後是撒辣的祈禱（2），再後是哺育孩子的哈加爾（3）。</p><p>我們來更仔細地看看這個解釋：</p><p><strong>1.
    哈加爾被趕走</strong>。幾乎可以肯定，坐著的是亞巴郎（他的頭發和鬍鬚與對面亞巴郎壁畫中的一樣）。穿黃衣的大概是哈加爾（黃色可能表示奴婢的身份）。她手裏似乎拿著水皮囊（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/gen/21/#L14">創 21:14</a>）。她身後可能是她的兒子依市瑪耳，被趕走時他應已超過15歲（<em>依市瑪耳生時亞巴郎86歲</em><a
    href="https://bibleox.com/zh-Hant/cn-cuvt/gen/16/#L16">創 16:16</a><em>，依撒格生時亞巴郎100歲</em><a
    href="https://bibleox.com/zh-Hant/cn-cuvt/gen/21/#L5">創 21:5</a><em>，哈加爾在依撒格長大斷奶時被趕走</em><a
    href="https://bibleox.com/zh-Hant/cn-cuvt/gen/21/#L8-13">創 21:8-13</a>）。這人看起來像繫著圍裙的女子，但若是如此，那只能是哈加爾本人（未婚女子不蒙頭），而拿著水皮囊的就是依市瑪耳。無論如何，剩下的兩人最可能是哈加爾和依市瑪耳。也可能這個構圖不是分開的幾部分，而是一幅完整的畫，因爲抱著孩子的婦女正望著舉起雙手的婦女。</p><img
    src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">放大</a>]</p><p><strong>2.
    撒辣的祈禱</strong>。穿紅衣、蒙著頭的撒辣在向天主祈禱。紅衣表示身份高貴，蒙頭表示已婚。</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">放大</a>]</p><p><strong>3.
    哈加爾哺育孩子</strong>。支持哈加爾這個解釋的是：她沒有蒙頭（即未婚），髮型與第一幕中穿黃衣的人相同。她那特別的目光也透露了她的身份：她望著與她關係緊張的撒辣。有趣的是，畫家把她畫得和左邊坐著的亞巴郎一模一樣：坐在椅子上，衣服完全相同（豎條紋、袖子上兩道條紋、斗篷）。</p><img
    src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">版本
    2</a>]</p><p><strong>整個房間的思想：從死亡中得救</strong></p><p>這個墓室（cubiculum）的構圖有一個共同而美好的思想：從死亡中得救。整個故事由下而上逐層升高：</p><ul><li><p>最下層：埋葬在這裏的基督徒，他們相信戰勝死亡的基督。</p></li><li><p>中層：關於從死亡中得救的聖經故事：</p><ul><li><p>巴比倫火窯中的三位青年得救，免於被火燒死；</p></li><li><p>先知約納在海中巨獸腹中得救，免於死亡；</p></li><li><p>依撒格得救，免於被獻爲祭品，代替他獻上的是一隻公綿羊；</p></li><li><p>哈加爾和兒子依市瑪耳在曠野中得救，免於死亡。</p></li></ul></li><li><p>倒數第二層：基督教的象徵，孔雀（復活、不朽、永生）和鷓鴣（靈魂）。一隻鷓鴣站在活的植物旁（象徵生命），另一隻站在枯萎的植物旁（象徵死亡）。孔雀也是這樣站著。</p></li><li><p>天花板中央：拯救信徒脫離死亡的善牧。值得注意的是，這裏還有一個關於從死亡中得救的小暗示：善牧的左右分別是諾厄從方舟放出的烏鴉和銜著橄欖枝的鴿子。這樣，在方舟中免於死亡的人們，由這些鳥引到拯救人脫離死亡的那一位——基督那裏。</p></li></ul><h3>杜拉歐羅普斯的教堂（敘利亞）</h3><p>244年。杜拉歐羅普斯的教堂除了舊約事件外，還有新約場景的壁畫：將要沉沒的宗徒彼得得救，在羊池旁治好癱子。另見<a
    href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">文章</a>。</p><p><strong>善牧基督（洗禮室的主要景觀）</strong></p><img
    src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">放大</a>]</p><p><strong>將要沉沒的宗徒彼得得救</strong></p><img
    src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">版本
    2</a>]</p><p><strong>在羊池旁治好癱子</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">另一版本</a>]</p><h3>善牧基督，先知約納</h3><p>3世紀末至4世紀初。羅馬。瑪策林和彼得地下墓穴。</p><p>中央是善牧基督。中央兩側畫著約納。左邊的壁畫中約納被從船上扔下，右邊鯨魚吞下了他。</p><img
    src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">放大</a>]</p><p>先知約納</p><img
    src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">放大</a>]</p><h3>善牧基督</h3><p>3世紀。羅馬。加里斯都地下墓穴（<a
    href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus
    Catacomb, Crypt of Lucina</a>）。可以推測桶裏裝的是奶，象徵聖體聖血（參見亞歷山大的克萊孟）。</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">放大</a>]</p><h3>善牧，希薩爾泰佩墓地，尼西亞（伊茲尼克）</h3><p>約3世紀。這是最近的發現，年代是推測的（<a
    href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">詳見</a>）。這片墓地從2世紀用到5世紀。</p><p>座標：40.78204218462122,
    29.928491677648932。土耳其語地名：Hasartep Nekropolü。</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a
