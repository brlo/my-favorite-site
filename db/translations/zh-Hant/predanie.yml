    × 27.5 釐米。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">艾爾米塔什博物館（俄羅斯）</a>。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">放大</a>]</p><h3>“全能者基督”聖像的一部分（拜占庭，克里米亞）</h3><p>1050—1100年。<a
