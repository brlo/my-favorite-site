    2</a>]</p><h3>有誕神女和聖嬰基督聖像的戒指（拜占庭）</h3><p>6—7世紀。<a href="https://www.metmuseum.org/art/collection/search/464059">大都會藝術博物館（第五大道，美國）</a>。</p><img
