    href="https://www.pravenc.ru/text/164537.html">革辣撒</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">放大</a>]</p><h3>基督，圓形飾章（安提約基雅）</h3><p>500—625年。材料：銀，鍍金。14.9
    × 14.1 × 1.1 釐米。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">盧浮宮（法國）</a>。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">放大</a>]</p><hr><p>500—625年。<a
    href="https://collections.louvre.fr/en/ark:/53355/cl010256495">盧浮宮（法國）</a>。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">放大</a>]</p><h3>有聖像的掛毯：基督、誕神女、總領天使彌額爾和加俾額爾、宗徒（埃及，拜占庭）</h3><p>500年。<a
    href="https://www.clevelandart.org/art/1967.144">克利夫蘭藝術博物館（美國）</a>。羊毛，178.7 ×
    110.5 釐米。</p><p>博物館的說明：</p><blockquote><p>這件罕見的掛毯用二十多種顏色的羊毛線織成，當時比一幅畫還貴。它的歷史價格反映出當時的人對織工所達到的精湛混色技藝評價之高。掛在牆上的<strong>這幅織成的聖像，使信徒能在正教會的教堂裏敬禮誕神女和嬰孩基督</strong>。他們被天使和宗徒圍繞，旁邊用希臘文寫著他們的名字。爲了在靈性上有效，聖像（神聖的圖像）必須儘可能準確地遵循其形象的既定圖像傳統。</p><p>建築框架橫樑上的銘文譯自希臘文爲“<strong>聖彌額爾、聖馬利亞、聖加俾額爾</strong>”。寬闊的葉紋邊框飾有水果和花卉，下部飾有宗徒半身像的圓形飾章，旁邊用希臘文寫的名字譯爲“<strong>安德肋、馬太、宗徒保羅、路加、雅各、腓力、馬可、多馬、約翰、馬提亞、彼得和巴多羅買</strong>”。</p></blockquote><img
    src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">放大</a>]</p><h3>有聖像的掛毯。三位青年？、基督名號組合字（埃及，拜占庭）</h3><p>500年代。<a
    href="https://www.clevelandart.org/art/1982.73">克利夫蘭藝術博物館（美國）</a>。羊毛，亞麻。110.5
    × 76.8 釐米。</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">放大</a>]</p><h3>有聖像的掛毯。誕神女、賢士、先知約納（埃及，拜占庭）</h3><p>500—550年。<a
    href="https://www.clevelandart.org/art/1951.400">克利夫蘭藝術博物館（美國）</a>。亞麻。99.7 × 104.8
    釐米。</p><p>博物館的說明：</p><blockquote><p>……上層左邊畫的是坐在十字形腿凳子上的<strong>抱著嬰孩基督的童貞馬利亞</strong>。正如科普特文銘文所說，<strong>三位君王帶著禮物從右邊走來</strong>。中層左邊畫的可能是<strong>基督受洗</strong>，被柱子隔開的另外三個人物似乎表現基督只用五個餅和兩條魚使一大羣人吃飽的新約奇蹟。下層仍可辨認出<strong>先知約納被鯨魚吞下的舊約場景</strong>。</p><p>希臘文銘文標明了舊約和新約的各個場景。上層第一位賢士上方可以認出表示黃金的希臘詞（<em>χρυσός，chrysós</em>）的兩個字母<strong>“XP”</strong>。中層左邊畫著兩個人物：第一個幾乎完全毀壞，第二個由銘文<strong>“EIΩANNHC”（約翰）</strong>標明。下層畫著被吐到岸上的約納，旁邊有一條大魚，並有銘文<strong>“EIΩNAC”（約納）</strong>。幾乎完全失去的摩西只能憑銘文<strong>“MWCHC”（摩西）</strong>辨認。</p></blockquote><img
    src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">放大</a>]</p><h3>有聖像的聖爵和香爐（拜占庭，敘利亞，阿塔魯提）</h3><p>500—650年。<a
    href="https://www.metmuseum.org/art/collection/search/474390">大都會藝術博物館（第五大道，美國）</a>。銀，鍍金。聖爵上有主和聖人的聖像，以及誰獻給誰的銘文。</p><p>這些精工製作的禮儀器物——聖爵、香爐、濾器和聖神鴿子像——屬於敘利亞富裕的商業城鎮阿塔魯提的一座基督教教堂，敘利亞當時是拜占庭帝國最富裕的地區之一。聖爵、香爐和濾器用於事奉聖禮（聖體聖血禮儀），在這聖事中基督徒爲紀念最後晚餐和基督的死，領受祝聖過的酒和餅。</p><p>根據這些器物上的希臘文銘文（有幾處拼寫差異），其中許多是當地居民獻給城裏奉獻於聖斯德望的主教堂和奉獻於聖約翰（可能是前驅施洗者若翰［洗者若翰］）的一座小教堂的。</p><p>7世紀初，敘利亞先落入薩珊波斯人之手，後又落入伊斯蘭軍隊之手。這些作品可能是在拜占庭軍隊面對進攻者從該地區撤退時，被匆忙裝進保護容器埋起來的。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">版本
    2</a>]</p><hr><p>長髮的前驅若翰、作奧蘭斯姿勢（舉起雙手）的誕神女、作奧蘭斯姿勢的聖人、拿著手杖和盾牌的軍人聖人、有十字光環的年輕基督，以及另一位穿盔甲刺殺惡龍的軍人聖人（聖喬治？），都在拱廊下。<a
    href="https://www.metmuseum.org/art/collection/search/466137">大都會藝術博物館（第五大道，美國）</a>。21.3
    × 16 釐米。</p><p>希臘文銘文：“<strong>爲了自己的得救，歐多西婭將［此物］獻給阿塔爾［魯提］村的聖斯德望</strong>”。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">版本
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">版本
    3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">版本
    4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">版本
    5</a>]</p><hr><p>有聖前驅若翰、一位聖輔祭（可能是斯德望）、聖主教們和十字架聖像的聖爵。<a href="https://www.metmuseum.org/art/collection/search/466130">大都會藝術博物館（第五大道，美國）</a>。20.5
    × 15.1 釐米，369 克，1100 毫升</p><p>希臘文銘文：“<strong>獻給阿塔魯提村的聖約翰</strong>”。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">放大</a>]</p><hr><p>有基督、誕神女、前驅若翰、勝利者喬治聖像的聖爵。<a
    href="https://www.metmuseum.org/art/collection/search/466129">大都會藝術博物館（第五大道，美國）</a>。24.3
    × 16.8 釐米。</p><p>希臘文銘文：“<strong>阿塔魯提村的聖斯德望</strong>”。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">版本
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">版本
    3</a>]</p><hr><p>畫有帶十字光環的年輕基督、拿著香爐的聖輔祭（可能是聖斯德望）、祈禱姿勢的童貞馬利亞和拿著手杖的年輕聖人的聖爵。尺寸：23.9
    × 17 釐米，356 克。<a href="https://www.metmuseum.org/art/collection/search/466141">大都會藝術博物館（第五大道，美國）。</a></p><p>希臘文銘文：“<strong>爲還願，併爲主知其名者的得救</strong>”。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">版本
