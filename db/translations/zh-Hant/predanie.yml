    </ol><h3>未收入主要合集的各種古代圖像</h3><p><a href="https://bibleox.com/zh-Hant/zh-Hant/w/Ik5v_%E6%9C%AA%E6%94%B6%E5%85%A5%E4%B8%BB%E8%A6%81%E5%90%88%E9%9B%86%E7%9A%84%E5%90%84%E7%A8%AE%E5%8F%A4%E4%BB%A3%E5%9C%96%E5%83%8F">https://bibleox.com/ru/ru/w/bdRJ_Разные_древние_образы_не_вошедшие_в_основную_коллекцию</a></p><p>譯自俄語：羅季翁·弗拉索夫（藉助人工智能）。聖經引文據思高本。</p>
