    × 5.5 × 1.6 釐米。玉髓：1 1/2 × 1 1/4 英寸（3.8 × 3.2 釐米）</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a
