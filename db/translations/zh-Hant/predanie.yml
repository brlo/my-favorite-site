    4</a>]</p><hr><p>畫有帶十字光環的年輕基督、聖前驅若翰、祈禱姿勢的童貞馬利亞、聖輔祭（可能是聖斯德望）和十字架的香爐。銀和鍍金銀，銅襯裏。尺寸：41.5
    × 13.2 × 12.6 釐米。<a href="https://www.metmuseum.org/art/collection/search/466132">大都會藝術博物館（第五大道，美國）</a>。</p><p>希臘文銘文：“<strong>爲基里亞科斯的子女埃爾塔和斯德望的靈魂安息</strong>”</p><img
    src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">版本
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">版本
    3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">版本
    4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">版本
    5</a>]</p><hr><p>畫有帶十字光環的年輕基督、兩位總領天使和十字架的香爐。8.2 × 13.2 釐米。<a href="https://www.metmuseum.org/art/collection/search/466131">大都會藝術博物館（第五大道，美國）</a>。</p><p>希臘文銘文：“<strong>獻給阿塔魯提村的聖約翰</strong>”。</p><img
    src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">版本
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">版本
    3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">版本
    4</a>]</p><h3>有基督和聖人像的聖爵、有十字架的聖盤（敘利亞，拜占庭）</h3><p>500—700年。克利夫蘭藝術博物館（美國）：<a href="https://www.clevelandart.org/art/1950.378">1</a>、<a
    href="https://www.clevelandart.org/art/1950.379">2</a>、<a href="https://www.clevelandart.org/art/1950.380">3</a>、<a
    href="https://www.clevelandart.org/art/1950.381">4</a>。</p><p>這四件銀製禮儀器皿——一個聖盤和三個聖爵（藏品號1950.378–81）——組成了今天所稱的“貝特米索納寶藏”，得名於製作這些器物的敘利亞北部村莊。</p><p>雖然寶藏發現的確切地點和情況不詳，但貝特米索納村的居民和敘利亞、巴勒斯坦的其他基督徒團體一樣，可能被迫把教堂的銀器埋起來，以躲避7世紀上半葉征服他們土地的波斯人或阿拉伯人。</p><p>聖盤在禮儀中盛放聖體的分份，上面刻著一個拉丁十字，周圍是獻詞。獻詞寫著聖盤的奉獻者多姆諾斯和它原來所在的地方——貝特米索納的聖塞爾吉教堂。</p><p>聖爵的杯口寬闊，飾有基督、誕神女和宗徒彼得、保羅的半身像。其中一個聖爵上有獻詞，寫著奉獻者——多姆諾斯的兒子基里亞科斯——和接受這份虔誠奉獻的教堂司祭——澤農的名字。</p><p>希臘文銘文：“<strong>+
    多姆諾斯之子司祭基里亞科斯，在司祭澤農的時期（將此聖爵獻給）聖塞爾吉</strong>”</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">基督</a>]
