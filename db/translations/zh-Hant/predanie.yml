    href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">再放大</a>]</p><h3>聖狄米特里的聖像（拜占庭）</h3><p>1040—1060年。<a
    href="https://collections.louvre.fr/en/ark:/53355/cl010115478">盧浮宮（法國）</a>。9.4
