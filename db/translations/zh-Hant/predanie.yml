    href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">放大</a>]</p><h3>舉行聖體聖血禮儀</h3><p>3世紀。羅馬。加里斯都地下墓穴（<a
    href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus
    Catacomb, Crypt of Lucina</a>）。畫的可能是一位司祭和與他共祭的輔祭。今天正教會的教堂中也是這樣舉行聖體聖血禮儀：司祭舉起雙手，輔祭指向聖禮物。</p><img
