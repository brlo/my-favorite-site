    href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">大英博物館</a>。108
    × 95 毫米。</p><p>Relief icon; rectangular bronze plaque cast in low relief with
    full-length Hodegetria flanked by the Archangel Michael and St Theodore, each
    wearing a girdled tunic beneath a chlamys with decorated tablion; the figures
    are identified by intaglio inscriptions; the whole is surrounded by a raised border
