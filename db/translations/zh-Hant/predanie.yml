    href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">大英博物館</a>。直徑：3.5
    釐米。</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding
    the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a
