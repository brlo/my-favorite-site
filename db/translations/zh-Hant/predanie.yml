- src: Ch2c_古代基督教教堂
  path: Ch2t_古代基督教教堂
  title: 古代基督教教堂
  update: true
  menu:
    parent: 圖書館
    title: "\U0001FAA8 古代基督教教堂"
    priority: 4
  body: '<h2>題記</h2><blockquote><p>“衆人中有幾個法利賽人對耶穌說：‘夫子，責備你的門徒吧！’耶穌說：‘我告訴你們，<strong>若是他們閉口不說，這些石頭必要呼叫起來。</strong>’”（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/lk/19/#L39-40">路 19:39-40</a>）</p></blockquote><h2>3世紀</h2><h3>古城默基多附近，<a
    href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">萊吉奧</a>聚落的教堂（約230年）</h3><p>古代基督教教堂的祭臺常常設在中央。這座教堂就是一個明顯的例子。</p><p>在默基多城附近（古時那裏駐有羅馬軍團，因此有一個叫<a
    href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">萊吉奧</a>的聚落）。聚落的高處有一座建築，根據錢幣、陶器和字體，被斷定爲230年的建築。建築中的一個房間是基督教教堂。地上有幾幅帶銘文的大型馬賽克（其中一幅稱基督爲天主），中央是祭臺。旁邊還有一段銘文，記載這張桌子是誰奉獻的。</p><img
    src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">補充照片
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">補充照片
    3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">放大</a>]</p><p><strong>銘文：</strong></p><p>教堂地面上的所有銘文都是一種<strong>追念名單</strong>。從最古老的時候直到今天，正教會的教堂裏一直有這樣的傳統：每逢舉行禮儀，總要在祈禱中追念建造教堂或奉獻重要物品的人的名字。這裏也是如此，帶著請求追念的話，記下了奉獻馬賽克地面的人（百夫長蓋亞諾斯·波菲利奧斯）、鋪設地面的人（布魯提奧斯）、奉獻祭臺的人（阿克普圖斯），以及其他一些名字，可能是奉獻者的親屬：普麗米拉、基里亞卡、多羅特亞、克蕾絲特。同樣，人們也爲追念生者和亡者而奉獻教會器皿：聖體聖血禮儀的聖爵和香爐（<a
    href="https://bibleox.com/zh-Hant/zh-Hant/w/Ik1c_%E5%8F%A4%E4%BB%A3%E8%81%96%E5%83%8F%E9%9B%86">詳見</a>）。</p><blockquote><p>中文譯文：愛慕天主的阿克普圖斯將這張桌子獻給天主耶穌基督，以作紀念。</p></blockquote><blockquote><p>EN:
    Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription:
    <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō
    mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС,
    Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η
    ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*聖名縮寫（Nomina
    sacra）：<strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = 天主耶穌基督</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">放大</a>]</p><hr><blockquote><p>ΕΝ:
    Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>中文譯文：請追念普麗米拉、基里亞卡、多羅特亞，還有克蕾絲特。</p></blockquote><blockquote><p>Orig:
    <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed:
    <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img
    src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">放大</a>]</p><hr><blockquote><p>中文譯文：蓋亞諾斯，又名波菲利奧斯，百夫長，我們的弟兄，自己出資，慷慨地鋪設了這地面。布魯提奧斯完成了這項工作。</p></blockquote><blockquote><p>EN:
    Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement
    at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig:
    <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ
    ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed:
    <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ
    ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches
    — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">放大</a>]</p><h3>杜拉歐羅普斯的教堂（敘利亞）</h3><p>244年，杜拉歐羅普斯的基督教教堂</p><img
    src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">放大</a>]</p><p>教堂裏有描繪新約事件的壁畫：將要沉沒的宗徒彼得得救，在羊池旁治好癱子（基督奇蹟系列壁畫中只保存下這兩幅），還有善牧。</p><p><strong>將要沉沒的宗徒彼得得救</strong></p><img
    src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">版本
    2</a>]</p><p><strong>在羊池旁治好癱子</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">另一版本</a>]</p><p><strong>洗禮池旁的畫（6號房間）：善牧把迷失的羊帶回羊羣</strong></p><img
    src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">放大</a>]</p><h3>凱撒勒雅的優西比烏（潘菲洛之友），主教，教會史家（約258—339年）</h3><p>他記述了羅馬皇帝戴克里先統治（284—305年）以前，各城都建造了基督教教堂。303年，戴克里先頒佈拆毀基督教教堂的敕令。當時優西比烏約45歲，因此他應當親眼見過這些教堂的建造和拆毀：</p><blockquote><p>5.
    總督和官長們對教會的首領是何等友善！怎能描述<strong>每座城中成千上萬人的聚會</strong>，那些<strong>湧向祈禱之家的驚人人羣！舊的建築已不夠用，<mark>各城都從地基起建造新的寬敞教堂</mark>（εὐρείας
    εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>）。</strong></p><p>&lt;…&gt;</p><p>4.
    那是戴克里先在位第十九年，迪斯特羅斯月（羅馬人的三月），主受難的節日臨近時，各處都張貼了<strong><mark>皇帝的詔書，命令把教堂夷爲平地</mark>（βασιλικὰ
    γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν）</strong>，焚燒聖經，並宣佈堅持基督信仰的人被剝奪榮譽職位；</p></blockquote><p>（<a
    href="https://bibleox.com/zh-Hant/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">《教會史》第8卷
    1.5、2.4</a>，譯自希臘文）</p><h2>有爭議的發現</h2><h3><strong>赫庫蘭尼姆的房屋（</strong>1世紀<strong>）</strong></h3><img
    src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">版本
    2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">版本
    3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">版本
    4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">版本
    5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">版本
    6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">放大</a>]</p><p>79年維蘇威火山噴發，把龐貝、斯塔比伊、赫庫蘭尼姆等城市埋在火山灰下。在赫庫蘭尼姆發現了一座<a
    href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">房屋</a>（俄語）（爲紀念發掘二百週年，稱爲“二百週年之家”），其二樓一個房間的牆上，正對木櫃上方的中央，有一個<a
    href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">十字形凹槽</a>（俄語）。有人推測那裏掛過祈禱用的木十字架，這個房間用於基督教禮儀或家庭祈禱。但這種推測有很有力的反駁。在同一城市發現了一個擱板，它可能在牆上留下類似的痕跡。</p><img
    src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">放大</a>]</p><img
    src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">放大</a>]
    [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">版本
    2</a>]</p><p>那個擱板並不完全一樣：左右突出得相當多，向下突出得少一些。此外，二百週年之家牆上的這個位置可能還有兩扇可以關上的門。儘管如此，二百週年之家那裏很可能真的只是一個普通的擱板，而不是十字架。讀者應自己判斷對各種結論信到什麼程度。這裏只是收集了關於這一發現的已知資料。</p>'
