    href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">放大</a>]</p><h3>有基督和宗徒像的板（意大利）</h3><p>9世紀。<a
