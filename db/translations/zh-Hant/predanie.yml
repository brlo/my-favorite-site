    parent: 圖書館
    title: 基督徒的墓葬與銘文
    priority: 5
  body: '<h2>最初幾個世紀基督徒墓旁的銘文</h2><p>亞壁古道上所謂“宗徒紀念所”（Memoria Apostolorum）的聚餐廳（triclia）裏的銘文。這座聖所建於3世紀中葉，238年至260年之間。同在3世紀，聚餐廳裏開始出現基督徒的祈禱銘文，如“<em>Paule
    ed Petre petite pro Victore</em>”等（見下文）。人們一直寫到君士坦丁大帝的時代。[1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a
    href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">放大</a>]</p><h3><strong>請在心中、在你們的祈禱中記念
    </strong>(in mente habete, in orationibus vestris)：</h3><p>12912: [Petre et] Paul[e]
    | in m[ente] abete in | ora[tion]ibus vestris/ — <strong>“彼得和保羅，請在心中、在你們的祈禱中記念……”</strong></p><h3><strong>請代求
    </strong>(petite)（或“請祈禱”“請祈求”）</h3><p>12918: [Paul]e et Petre petite | [pro] nobis
    omnibus/ — <strong>“保羅和彼得，請爲我們衆人代求！”</strong></p><p>12931: Petr[e] et Pau[l]e
    petite | pro [Le]ontium / — <strong>“彼得和保羅，請爲萊昂提烏斯代求！”</strong></p><p>12933: Pa[ul]e
    et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>“保羅和彼得，請永遠爲達提烏斯代求！”</strong></p><p>12989:
    Paule ed Petre petite | pro Victore/ — <strong>“保羅和彼得，請爲維克多代求！”</strong></p><p>12946:
    [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>“彼得和保羅，願你們聖潔的靈爲［-
    - -］代求！”</strong></p><h3><strong>conservate</strong> — <strong>請保護</strong>（或“請保守”）</h3><p>12991:
    Petre et Paule cons[ervate - - -]/ — <strong>“彼得和保羅，請保護［- - -］！”</strong></p><p>12996:
    sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino
    - - -]/ — <strong>“保羅和彼得啊，請拯救［- - -］和瑪爾提里烏斯，並在主內保護他們［- - -］！”</strong></p><p>13026:
    [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>“［- - -］我們懇求，請保護我們衆人！”</strong></p><h3><strong>簡單的呼求</strong></h3><p>12909:
    Petr[e et Paule]/ — <strong>“彼得和保羅啊！”</strong></p><h3><strong>爲罪人求助</strong></h3><p>12967:
    Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>“彼得和保羅，請來幫助罪人普里慕斯！”</strong></p><h3><strong>許多呼求是用希臘文寫的，或用希臘字母寫的拉丁文</strong></h3><p>12927:
    Παῦλε {μ} καί | μου πατ|ρός/ — <strong>“保羅，也（幫助）我的父親！”</strong></p><p>12997: [Παυλ]ε
    ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>“保羅和彼得，請在心中、在你們的祈禱中記念……”</strong></p><p>13045:
    [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>“保羅和彼得，請記念我的兒子奧菲迪烏斯！”</strong></p><p>13069:
    Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++
    [- - -]/ — <strong>“彼得，彼得，請記念提摩克拉特斯和歐提基婭，以及（……）++［- - -］！”</strong></p><p>13045:
    [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>“我們託付［- - -］。”</strong></p><p>13049:
    Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>“保羅和彼得，請記念［- - -］！”</strong></p><p>13055:
    [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>“保羅和彼得，請記念依蓮娜所愛的人。”</strong></p><p>13070:
    Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>“保羅和彼得，我勞魯斯（勞魯西烏斯？）把卡爾克多尼烏斯的靈魂託付給你們！”</strong></p><p>13071:
    &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια
    συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>“保羅和彼得，請保守天主的僕人！聖潔的靈啊，請保守我們，使我們長壽！”</strong></p><p>13073:
    [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>—
    <strong>“保羅和彼得，請永遠記念我們……”</strong></p><h3><strong>promisit / votum fecit</strong>
    — <strong>許了願</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/
    — <strong>“［- - -］在月望日（idus）的［- - -］日，歐羅吉烏斯許了願［- - -］。”</strong></p><h3><strong>提到
    refrigerium</strong>（追思餐）：</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/
    — <strong>“費利齊西穆斯和家人一起舉行了追思餐。”</strong></p><p>12981: Petro et Paulo | Tomius Coelius
    | refri`ger´&lt;i&gt;um feci/ — <strong>“我托米烏斯·科埃利烏斯爲彼得和保羅舉行了追思餐。”</strong></p><p>13003:
    [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>“我在保羅和彼得那裏舉行了追思餐。”</strong></p><p>來源：<a
    href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>向天主的呼求</h3><ul><li><p>DEVS
    TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – “<strong>主啊，我求你，願他得見樂園的光</strong>”。</p></li><li><p>DOMINE
    NE QVANDO ADVMBRETVR SPIRITVS VENERES – “<strong>主啊，願維納斯的靈魂永不被遮暗</strong>”。</p></li></ul><h3>請求亡者代求</h3><ul><li><p>ET
    IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – “<strong>在你的祈禱中爲我們祈求，因爲我們知道你在基督內</strong>”。</p></li><li><p>ORO
    SCIO NAMQVE BEATAM – “<strong>我求你，因爲我知道你在福樂中</strong>”。</p></li><li><p>ORA PRO
    PARENTI BVS TVIS – “<strong>爲你的親人祈禱</strong>”。</p></li><li><p>PETE PRO NOS VТ
    SALVI SIMVS – “<strong>爲我們祈禱，使我們得救</strong>”。</p></li><li><p>IN ORATIONIS TVIS
    ROGES PRO NOBIS – “<strong>在你的祈禱中爲我們祈求</strong>”。</p></li><li><p>ATTICE SPIRITVS
    TVS IN BONV ORA PRO PARENTIBVS TVIS – “<strong>阿提庫斯，你的靈魂在福樂中，爲你的親人祈禱</strong>”。</p></li></ul><p>這裏只列出了一部分。其餘材料可以在鏈接中閱讀。</p><h3><strong>銘文與象徵性圖像</strong></h3><ul><li><p>墓上也非常常見的
    VIVAS 一詞，即“<strong>願你活著</strong>”，表達對亡者永生和福樂的願望；</p></li><li><p>VIVAS IN DEO –
    “<strong>願你在天主內活著</strong>”。</p></li><li><p>VIBAS IN SANCTIS – “<strong>願你在聖人中間活著</strong>”。</p></li></ul><h3>亡者已得救</h3><p>有時說得更肯定，指出被埋葬者在蒙揀選的人中間：</p><ul><li><p>ACCEPIT
    REQVI EM IN DEO – “<strong>他在天主內得了安息</strong>”。</p></li><li><p>SCIMVS ТЕ IN –
    “<strong>我們知道你在基督內</strong>”。</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS –
    “<strong>弗魯克圖奧蘇斯，你的靈魂與義人同在</strong>”。</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE
    NOSTRO ET CHRISTO EIVS – “<strong>他在我們的父天主和他的基督內得了安息</strong>”。</p></li><li><p>ACCEPTA
    APVD DEVM – “<strong>被天主接納（指女性）</strong>”。</p></li><li><p>RECEPTVS AD DEVM – “<strong>被接到天主那裏</strong>”。</p></li><li><p>ТЕСVМ
    PAX CHRISTI – “<strong>基督的平安與你同在</strong>”。</p></li><li><p>SEMPER VIVE IN РАСЕ
    – “<strong>願你永遠活在平安中</strong>”。</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI
    – “<strong>在平安中，在天主永恆的家中</strong>”。</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE
    DOMINI NOSTRI ☧ – “<strong>你活在天主的光榮和我們主基督的平安中</strong>”——這裏救主的名字以其花押字 ☧ 表示；</p></li><li><p>ELATVS
    EST 也是一種歡呼，只出現過一兩次，可以譯爲：“<strong>他已升到天主那裏</strong>”。</p></li></ul><h3>樂園——光明之所</h3><p>在最初基督徒的墓誌銘中，樂園被稱爲光明和光輝之所；這裏舉幾個例子：</p><ul><li><p>CVIVS
    SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – “<strong>他的靈魂被接入主的光中</strong>”。</p></li><li><p>IN
    CHRISTVM CREDENS PREMIA LVCIS АВЕТ – “<strong>他信基督，以光爲賞報</strong>”。</p></li><li><p>AETERNA
    TIBI LUX TIMOTHEA IN ☧– “<strong>提摩泰婭，願永恆的光在（基督）內照耀你</strong>”。</p></li></ul><h3></h3><p>書（俄語）：<strong>A.馮·弗里肯，《羅馬地下墓穴與早期基督教藝術遺蹟》，莫斯科：K.
    T. 索爾達琴科夫出版，1872—1885年。</strong>[2]</p>'
  references: |-
    <ol>
    <li><p><a href="https://vk.com/@aletheia-de-sanctis-venerandis">https://vk.com/@aletheia-de-sanctis-venerandis</a></p></li>
    <li><p><a href="https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2">https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2</a></p></li>
    </ol><p>譯自俄語：羅季翁·弗拉索夫（藉助人工智能）。聖經引文據思高本。</p>
