  path: Lc4k_守齋飲食
  title: 守齋飲食
  update: true
  menu:
    parent: 圖書館
    title: "\U0001F35E 守齋飲食"
    priority: 9
  body: <p>本文只簡要介紹守齋期間飲食的大致樣貌，幫助以前沒有守過齋、不習慣做齋食、不知道齋期可以做些什麼的人找到方向。</p><blockquote><p>“耶穌回答說：‘馬大！馬大！你爲許多的事思慮煩擾，但是不可少的只有一件；馬利亞已經選擇那上好的福分，是不能奪去的。’”（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L41-42">路 10:41-42</a>）</p></blockquote><blockquote><p>“你們要謹慎，恐怕因貪食、醉酒，並今生的思慮累住你們的心，那日子就如同網羅忽然臨到你們”（<a
    href="https://bibleox.com/zh-Hant/cn-cuvt/lk/21/#L34">路 21:34</a>）</p></blockquote><h2>湯</h2><h3>蔬菜高湯（加炒洋蔥和胡蘿蔔）</h3><p>幾乎每一種都適合加土豆：</p><ul><li><p><strong>穀物湯</strong>（蕎麥、米、珍珠麥、小扁豆、豌豆），</p></li><li><p><strong>意麵湯</strong>，</p></li><li><p><strong>蔬菜湯</strong>，</p></li><li><p><strong>羅宋湯</strong>（甜菜湯），</p></li><li><p><strong>醃黃瓜湯</strong>（拉索利尼克），</p></li><li><p><strong>菜湯</strong>（希）（捲心菜湯），</p></li><li><p><strong>魚湯</strong>（烏哈，在規定允許吃魚時）。</p></li></ul><h2>配菜</h2><ul><li><p><strong>燕麥粥</strong>（燕麥片），</p></li><li><p><strong>煮</strong>米、蕎麥、小扁豆、古斯米、布格麥、藜麥、玉米糊（玉米粉粥）等穀物。可加炒洋蔥和胡蘿蔔。</p></li><li><p><strong>手抓飯</strong>（爲了更飽，可以加鷹嘴豆），</p></li><li><p><strong>米飯什錦</strong>：夏威夷式、墨西哥式等，</p></li><li><p><strong>意麵</strong>：煮的、先炒後煮的、蘑菇意麵、加魚罐頭（金槍魚、沙丁魚等，在規定允許時）的，</p></li><li><p><strong>土豆</strong>：炸、烤、煮、土豆泥，</p></li><li><p><strong>燉捲心菜</strong>，</p></li><li><p><strong>蔬菜燉菜</strong>：土豆、胡蘿蔔、洋蔥、西葫蘆、甜椒、蘑菇、番茄醬或番茄、茄子，</p></li><li><p><strong>水煮蔬菜</strong>（菜花、西蘭花、青豌豆、玉米），</p></li><li><p><strong>俄式餃子</strong>（瓦列尼基）：土豆、蘑菇、櫻桃餡，</p></li><li><p><strong>豆腐</strong>，</p></li><li><p><strong>鷹嘴豆炒蔬菜</strong>，</p></li><li><p>炒<strong>蘑菇</strong>，</p></li><li><p>煎<strong>西葫蘆</strong>，</p></li><li><p><strong>土豆餅</strong>（德拉尼基：擦絲的土豆或西葫蘆、米粉或麵粉、鹽），</p></li><li><p><strong>普羅旺斯雜燴</strong>，</p></li><li><p><strong>烤南瓜</strong>，</p></li><li><p><strong>烤蔬菜</strong>，</p></li><li><p><strong>素肉餅</strong>（用芸豆做）。</p></li></ul><h2>沙拉</h2><ul><li><p><strong>生蔬菜沙拉</strong>：黃瓜、番茄、嫩捲心菜、紅洋蔥、生菜、甜椒、香草、香料，</p></li><li><p><strong>熟蔬菜沙拉</strong>：俄式甜菜沙拉（土豆、甜菜、胡蘿蔔、芸豆、罐頭豌豆、醃黃瓜、洋蔥、酸菜），</p></li><li><p><strong>大白菜沙拉</strong>：大白菜、玉米、齋期蛋黃醬[1]，</p></li><li><p><strong>煮甜菜</strong>拌齋期蛋黃醬[1]，</p></li><li><p><strong>水果沙拉</strong>，</p></li><li><p><strong>牛油果沙拉</strong>，</p></li></ul><h2>醃菜</h2><ul><li><p><strong>酸菜</strong>，</p></li><li><p><strong>黃瓜</strong>：醃的、淡醃的、拍黃瓜，</p></li><li><p>朝鮮族風味的涼拌<strong>胡蘿蔔</strong>，</p></li><li><p>醋醃<strong>洋蔥</strong>，</p></li><li><p>等等。</p></li></ul><h2>麵食</h2><ul><li><p><strong>麵包</strong>，</p></li><li><p><strong>齋期小麵包</strong>：可以用烤箱或平底鍋烤，也可以在商店買，</p></li><li><p><strong>餡餅（皮羅什基）</strong>：櫻桃餡、燉捲心菜餡、土豆洋蔥餡，</p></li><li><p><strong>齋期薄餅</strong>（用水代替牛奶，用香蕉代替雞蛋），</p></li></ul><h2>罐頭和儲存食品</h2><ul><li><p><strong>西葫蘆</strong><strong>醬</strong>，</p></li><li><p><strong>茄子</strong><strong>醬</strong>，</p></li><li><p><strong>鷹嘴豆泥</strong>，</p></li><li><p><strong>玉米</strong>，</p></li><li><p><strong>蘑菇</strong>，</p></li><li><p><strong>芸豆</strong>，</p></li><li><p><strong>青豌豆</strong>，</p></li><li><p><strong>番茄乾</strong>，</p></li><li><p>不加奶酪的<strong>牛油果醬</strong>，</p></li></ul><h2>乾果</h2><ul><li><p><strong>堅果</strong>，</p></li><li><p>乾的或凍乾的<strong>漿果和水果</strong>，</p></li><li><p><strong>哈爾瓦（芝麻糖）</strong>，</p></li></ul><h2>三明治和小吃</h2><ul><li><p>蜂蜜麵包片，</p></li><li><p>番茄、羅勒加鹽的麵包片。</p></li></ul><h2>飲品</h2><ul><li><p>格瓦斯（麵包發酵飲料）</p></li><li><p>基塞爾（用澱粉勾芡的果汁飲料）</p></li><li><p>果汁甜湯（用新鮮漿果或乾果煮）</p></li><li><p>莫爾斯（漿果果汁飲料）</p></li><li><p>果昔</p></li><li><p>檸檬水</p></li><li><p>茶</p></li><li><p>不加奶的咖啡</p></li><li><p>水</p></li></ul>
  references: "<ol><li><p><strong>齋期蛋黃醬</strong>：罐頭豌豆的湯汁、植物油、芥末、鹽、糖、醋，用攪拌機打勻。</p></li></ol><p>譯自俄語：羅季翁·弗拉索夫（藉助人工智能）。聖經引文據思高本。</p>"
