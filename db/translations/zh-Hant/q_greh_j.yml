- src: человекоугодие
  path: QS16A_討人喜歡（偏心待人）
  title: 討人喜歡（偏心待人）
  copy_cover: true
  body: <blockquote><p>“我的弟兄們，你們信奉我們榮耀的主耶穌基督，<strong><mark>便不可按著外貌待人</mark></strong>。 若有一個人帶著金戒指，穿著華美衣服，進你們的會堂去，又有一個窮人，穿著骯髒衣服也進去； <strong><mark>你們就重看那穿華美衣服的人</mark></strong>，說：『請坐在這好位上』，又對那窮人說：『你站在那裏』，或『坐在我腳凳下邊』， <strong><mark>這豈不是你們偏心待人，用惡意斷定人嗎</mark></strong>？ &lt;…&gt; 經上記著說，『要愛人如己。』你們若全守這至尊的律法，纔是好的； <strong><mark>但你們若按外貌待人，便是犯罪</mark></strong>，被律法定爲犯法的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L1-4,8-9">雅 2:1-4,8-9</a>)</p></blockquote><blockquote><p>“你們作僕人的，要凡事聽從你們肉身的主人，<strong><mark>不要只在眼前事奉，像是討人喜歡的</mark></strong>，總要存心誠實敬畏主。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L22">西 3:22</a>)</p></blockquote><blockquote><p>“你們作僕人的，要懼怕戰兢，用誠實的心聽從你們肉身的主人，好像聽從基督一般。 <strong><mark>不要只在眼前事奉，像是討人喜歡的</mark></strong>，<strong><mark>要像基督的僕人，從心裏遵行上帝的旨意</mark></strong>， <strong><mark>甘心事奉，好像服事主，不像服事人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L5-7">弗 6:5-7</a>)</p></blockquote><blockquote><p>“<strong>上帝打散討好人的骨頭</strong>：他們必蒙羞，因爲上帝棄絕了他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/52/#L5">詩 52:5</a>) <em>(俄文本引用教會斯拉夫語（Пс 52:5）。)</em></p></blockquote><blockquote><p>“說：「<strong><mark>你們審判不秉公義，徇惡人的情面，要到幾時呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/82/#L2">詩 82:2</a>) <em>(俄文本編號爲 Пс 81:2（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“你們施行審判，不可行不義；<strong><mark>不可偏護窮人，也不可重看有勢力的人</mark></strong>。只要按著公義審判你的鄰舍。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L15">利 19:15</a>)</p></blockquote><blockquote><p>“以下也是智慧人的箴言：<strong><mark>審判時看人情面是不好的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/24/#L23">箴 24:23</a>)</p></blockquote><blockquote><p>“<strong><mark>看人的情面，乃爲不好</mark></strong>；人因一塊餅枉法，也爲不好。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/28/#L21">箴 28:21</a>)</p></blockquote><blockquote><p>“<strong>必披上正義，當作胸甲：戴上了正直的判斷，當作鋼盔</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prs/5/#L19">智 5:19</a>) <em>(俄文本爲 Прем 5:18。)</em></p></blockquote><blockquote><p>“……你若真有羞惡之心，就必能受到衆人的愛戴。對於下列的事，你不應該羞愧：<strong>不該因顧情面而犯罪過</strong>；對於至高者的法律和盟約；對於不虔敬者所下的判斷；……” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/42/#L1-2">德 42:1-2</a>)</p></blockquote><blockquote><p>“「所以我使你們被衆人藐視，看爲下賤，<strong><mark>因你們不守我的道，竟在律法上瞻徇情面</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mal/2/#L9">瑪 2:9</a>)</p></blockquote><blockquote><p>“這些人是私下議論、常發怨言的，隨從自己的情欲而行，口中說誇大的話，<strong><mark>爲得便宜諂媚人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L16">猶 1:16</a>)</p></blockquote>
