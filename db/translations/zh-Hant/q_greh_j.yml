  path: QS15A_賄賂
  title: 賄賂（罪）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>不可受賄賂</mark></strong>，因爲賄賂能叫明眼人變瞎了，又能顛倒義人的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/23/#L8">出 23:8</a>)</p></blockquote><blockquote><p>“不可屈枉正直，不可看人的外貌，<strong><mark>也不可受賄賂，因爲賄賂能叫智慧人的眼變瞎了</mark></strong>，又能顛倒義人的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L19">申 16:19</a>)</p></blockquote><blockquote><p>“勒索使智慧人變爲愚妄，<strong><mark>賄賂能敗壞人的慧心</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/7/#L7">傳 7:7</a>)</p></blockquote><blockquote><p>“<strong><mark>惡人暗中受賄賂，爲要顛倒判斷</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/17/#L23">箴 17:23</a>)</p></blockquote><blockquote><p>“王藉公平，使國堅定．<strong><mark>索要賄賂，使國傾敗</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/29/#L4">箴 29:4</a>)</p></blockquote><blockquote><p>“撒母耳年紀老邁，就立他兒子作以色列的士師。 &lt;…&gt; 他兒子不行他的道，<strong><mark>貪圖財利，收受賄賂，屈枉正直</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/8/#L1,3">撒上 8:1,3</a>)</p></blockquote><blockquote><p>“原來不敬虔之輩必無生育；<strong><mark>受賄賂之人的帳棚必被火燒</mark></strong>。 他們所懷的是毒害，所生的是罪孽，心裏所預備的是詭詐。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/15/#L34-35">伯 15:34-35</a>)</p></blockquote><blockquote><p>“<strong><mark>不要把我的靈魂和罪人一同除掉</mark></strong>，不要把我的性命和流人血的一同除掉， <strong><mark>他們的手中有奸惡，右手滿有賄賂</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/26/#L9-10">詩 26:9-10</a>) <em>(俄文本編號爲 Пс 25:9-10（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“<strong><mark>他們因有貪心，要用捏造的言語在你們身上取利</mark></strong>。他們的刑罰，自古以來並不遲延；他們的滅亡，也必速速來到。 &lt;…&gt; 行的不義，就得了不義的工價。這些人喜愛白晝宴樂，他們已被玷污，又有瑕疵，正與你們一同坐席，就以自己的詭詐爲快樂。 他們滿眼是淫色，止不住犯罪，引誘那心不堅固的人，<strong><mark>心中習慣了貪婪</mark></strong>，正是被咒詛的種類。 他們離棄正路，就走差了，<strong><mark>隨從比珥之子巴蘭的路</mark></strong>。<strong><mark>巴蘭就是那貪愛不義之工價的先知</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L3,13-15">彼後 2:3,13-15</a>)</p></blockquote>
