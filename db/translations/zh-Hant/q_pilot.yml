  title: 得救的人少
  copy_cover: true
  body: <h2>得救的人少</h2><blockquote><p>“有一個人問他說：「主啊，<strong>得救的人少嗎</strong>？」 耶穌對衆人說：「你們要努力進窄門。我告訴你們：<strong>將來有許多人想要進去，卻是不能</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L23-24">路 13:23-24</a>)</p></blockquote><blockquote><p>“你們要進窄門。因爲<strong>引到滅亡，那門是寬的，路是大的</strong>，<strong>進去的人也多</strong>； <strong>引到永生，那門是窄的，路是小的</strong>，<strong>找著的人也少</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L13-14">太 7:13-14</a>)</p></blockquote><blockquote><p>“當那日，<strong>必有許多人</strong>對我說：『主阿，主阿，我們不是奉你的名傳道，奉你的名趕鬼，奉你的名行許多異能嗎？』 我就明明地告訴他們說：『<strong>我從來不認識你們，你們這些作惡的人，離開我去吧！</strong>』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L22-23">太 7:22-23</a>)</p></blockquote><blockquote><p>“你們這<strong>小羣</strong>，不要懼怕，因爲你們的父樂意把國賜給你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L32">路 12:32</a>)</p></blockquote><blockquote><p>“我的東西難道不可隨我的意思用嗎？因爲我作好人，你就紅了眼嗎？』 這樣，那在後的將要在前；在前的將要在後了〔有古卷在此有『因爲被召的人多，<strong>選上的人少</strong>』〕” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/20/#L15-16">太 20:15-16</a>)</p></blockquote><blockquote><p>“於是王對使喚的人說：『捆起他的手腳來，把他丟在外邊的黑暗裏．在那裏必要哀哭切齒了。』 因爲被召的人多，<strong>選上的人少</strong>” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/22/#L13-14">太 22:13-14</a>)</p></blockquote><blockquote><p>“我告訴你們，<strong>先前所請的人沒有一個得嘗我的筵席</strong>” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/14/#L24">路 14:24</a>)</p></blockquote><h2>舊約中得救者寥寥的先例</h2><blockquote><p>“就是天使犯了罪，上帝也沒有寬容，曾把他們丟在地獄，交在黑暗坑中，等候審判； <strong>上帝也沒有寬容上古的世代</strong>，曾叫洪水臨到那不敬虔的世代，卻保護了傳義道的<strong><mark>挪亞一家八口</mark></strong>； 又判定<strong>所多瑪、蛾摩拉，將二城傾覆，焚燒成灰</strong>，作爲後世不敬虔人的鑑戒； <strong>只搭救</strong>了那常爲惡人淫行憂傷的<strong>義人羅得</strong>。 因爲那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。 主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L4-9">彼後 2:4-9</a>)</p></blockquote><blockquote><p>“<strong>他們遭遇這些事都要作爲鑑戒</strong>，並且<strong>寫在經上，正是警戒我們這末世的人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L11">林前 10:11</a>)</p></blockquote>
