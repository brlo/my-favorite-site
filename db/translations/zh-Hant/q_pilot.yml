- src: Писание-не-под-диктовку
  path: Qz6B_聖經不是上帝的口述筆錄
  title: 聖經不是上帝的口述筆錄
  copy_cover: true
  body: <p>聖經的經文雖然是在上帝之靈的感動下寫成的（即上帝所默示的），卻不是上帝口述的筆錄，書寫者也不是上帝手中鉛筆那樣沒有個性的工具。牧人出身的先知用樸素的語言寫作，宮廷出身的先知則以飽學之士的筆法寫作；兩人都採用與自己生活方式相稱的比喻。例如，論到使徒保羅，別的使徒寫道，他的書信中有難以理解的地方：</p><blockquote><p>“他一切的信上也都是講論這事。信中<strong>有些難明白的</strong>” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L16">彼後 3:16</a>)</p></blockquote><p>而使徒保羅自己也說，他在言語上是粗俗的，在知識上卻不是：</p><blockquote><p>“<strong>我的言語雖然粗俗</strong>，我的知識卻不粗俗” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/11/#L6">林後 11:6</a>)</p></blockquote><p>也就是說，他盡力而寫，但在知識上並無虧損。事實上，使徒保羅作爲受過教育的法利賽人，確實運用了複雜的意義結構。更進一步，使徒們有時明確宣告，所寫的是自己的意見：</p><blockquote><p>“論到童身的人，<strong>我沒有主的命令</strong>，但我既蒙主憐恤能作忠心的人，就把<strong>自己的意見告訴</strong>你們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L25">林前 7:25</a>)</p></blockquote><p>更準確地說，聖經乃是上帝與人的共同工作（協作，συνεργία）：</p><blockquote><p>“因爲我們是<strong>與上帝同工的</strong>；你們是上帝所耕種的田地，所建造的房屋。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/3/#L9">林前 3:9</a>) <em>(συνεργοί，直譯爲「與上帝同工者」)</em></p></blockquote>
  meta_desc: 聖經是上帝默示寫成的，卻不是上帝口述的筆錄
