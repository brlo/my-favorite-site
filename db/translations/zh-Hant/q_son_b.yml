  path: Qs9T_基督——祭品
  title: 基督——祭品
  copy_cover: true
  body: <h2>上帝之子在創世以前就已被定爲祭品</h2><blockquote><p>“乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血。 基督<strong>在創世以前是預先被上帝知道</strong>的，卻在這末世纔爲你們顯現。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L19-20">彼前 1:19-20</a>)</p></blockquote><h2>亞伯拉罕的福分</h2><blockquote><p>“基督既爲我們受了咒詛，就贖出我們脫離律法的咒詛，因爲經上記著：『凡掛在木頭上都是被咒詛的。』 這便<strong>叫亞伯拉罕的福，因基督耶穌可以臨到外邦人</strong>，使我們因信得著所應許的聖靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L13-14">加 3:13-14</a>)</p></blockquote><h2>救贖</h2><blockquote><p>“知道你們<strong>得贖</strong>、脫去你們祖宗所傳流虛妄的行爲，不是憑著能壞的金銀等物， 乃是憑著<strong>基督的寶血，如同無瑕疵、無玷污的羔羊之血</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/1/#L18-19">彼前 1:18-19</a>)</p></blockquote><blockquote><p>“基督既爲我們受了咒詛，就<strong>贖出我們脫離律法的咒詛</strong>，因爲經上記著：『凡掛在木頭上都是被咒詛的。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L13">加 3:13</a>)</p></blockquote><blockquote><p>“像這樣，<strong>基督既然一次被獻，擔當了多人的罪</strong>，將來要向那等候他的人第二次顯現，並與罪無關，乃是爲拯救他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L28">希 9:28</a>)</p></blockquote><h2>和好</h2><blockquote><p>“<strong>因他使我們和睦，將兩下合而爲一</strong>，拆毀了中間隔斷的牆， 而且<strong>以自己的身體廢掉冤仇</strong>，就是那記在律法上的規條，爲要將兩下藉着自己造成一個新人，如此便成就了和睦。 既在十字架上滅了冤仇，便<strong>藉這十字架使兩下歸爲一體，與上帝和好了</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/2/#L14-16">弗 2:14-16</a>)</p></blockquote><blockquote><p>“因爲我們作仇敵的時候，且<strong>藉着上帝兒子的死得與上帝和好</strong>；既已和好，就更要因他的生得救了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/5/#L10">羅 5:10</a>)</p></blockquote><blockquote><p>“一切都是出於上帝，他<strong>藉着基督使我們與他和好</strong>，又將勸人與他和好的職分賜給我們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L18">林後 5:18</a>)</p></blockquote><blockquote><p>“這就是<strong>上帝在基督裏叫世人與自己和好</strong>，不將他們的過犯歸到他們身上，並且將這和好的道理託付了我們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L19">林後 5:19</a>)</p></blockquote><blockquote><p>“既然藉着他在十字架上所流的血成就了和平，<strong>便藉着他叫萬有，無論是地上的、天上的，都與自己和好了</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L20">西 1:20</a>)</p></blockquote><blockquote><p>“但如今他<strong>藉着基督的肉身受死，叫你們與自己和好，都成了聖潔</strong>，沒有瑕疵，<strong>無可責備</strong>，把你們引到自己面前。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L22">西 1:22</a>)</p></blockquote><h2>與上帝聯合</h2><blockquote><p>“因<strong>基督也曾一次爲罪受苦</strong>，就是義的代替不義的，<strong>爲要引我們到上帝面前</strong>。按著肉體說，他被治死；按著靈性說，他復活了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L18">彼前 3:18</a>)</p></blockquote><h2>聖體血（領受基督的體血）</h2><blockquote><p>“我們有一祭壇，上面的祭物是那些在帳幕中供職的人不可同吃的。 原來牲畜的血被大祭司帶入聖所作贖罪祭，牲畜的身子被燒在營外。 所以<strong>耶穌要用自己的血叫百姓成聖，也就在城門外受苦</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L10-12">希 13:10-12</a>)</p></blockquote><blockquote><p>“他們吃的時候，耶穌拿起餅來，祝福，就擘開遞給門徒，說：「你們拿著吃，這是我的身體。」 又拿起杯來，祝謝了，遞給他們，說：「<strong>你們都喝這個， 因爲這是我立約的血，爲多人流出來，使罪得赦</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><blockquote><p>“祝謝了，就擘開，說，「這是<strong>我的身體，爲你們舍的</strong>。你們應當如此行，爲的是記念我。」 飯後，也照樣拿起杯來，說：「這杯是用我的血所立的新約。你們每逢喝的時候，要如此行，爲的是記念我。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L24-25">林前 11:24-25</a>)</p></blockquote><h2>新約</h2><blockquote><p>“祝謝了，就擘開，說，「這是我的身體，爲你們舍的。你們應當如此行，爲的是記念我。」 飯後，也照樣拿起杯來，說：「這杯<strong>是用我的血所立的新約</strong>。你們每逢喝的時候，要如此行，爲的是記念我。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L24-25">林前 11:24-25</a>)</p></blockquote><h2>國度</h2><blockquote><p>“因此<strong>基督死了，又活了，爲要作死人並活人的主</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L9">羅 14:9</a>)</p></blockquote><p>成全父的旨意、預言和應許</p><blockquote><p>“我說，基督是<strong>爲上帝真理</strong>作了受割禮人的執事，<strong>要證實所應許列祖的話</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/15/#L8">羅 15:8</a>)</p></blockquote><h2>榜樣</h2><blockquote><p>“你們蒙召原是爲此，因<strong>基督也爲你們受過苦，給你們留下榜樣</strong>，<strong>叫你們跟隨他的腳蹤行</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L21">彼前 2:21</a>)</p></blockquote><blockquote><p>“並且<strong>他替衆人死，是叫那些活著的人不再爲自己活，乃爲替他們死而復活的主活</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L15">林後 5:15</a>)</p></blockquote><h2>來自穆斯林的問題</h2><h3>爲什麼需要祭品？憐憫的上帝難道不能白白赦免嗎？</h3><p>基督徒所信的上帝稱爲愛：</p><blockquote><p>“沒有愛心的，就不認識上帝，因爲<strong>上帝就是愛</strong>。 &lt;…&gt; 上帝愛我們的心，我們也知道、也信。<strong>上帝就是愛！</strong>住在愛裏面的，就是住在上帝裏面，上帝也住在他裏面。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L8,16">約壹 4:8,16</a>)</p></blockquote><p>上帝藉着把自己獻爲祭、以拯救受造者，正是顯明他對受造物的愛——因爲他自己也說過：</p><blockquote><p>“<strong><mark>人爲朋友捨命，人的愛心沒有比這個大的</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L13">約 15:13</a>)</p></blockquote><p>這樣，他以祭品之愛吸引他所願意拯救的人：</p><blockquote><p>“<strong>我若從地上被舉起來，就要吸引萬人來歸我</strong>。」 耶穌這話原是<strong>指著自己將要怎樣死說的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L32-33">約 12:32-33</a>)</p></blockquote><p>但智慧的上帝始終以智慧安排救恩。除了愛之外，我們還可以說到神聖公義的滿足：上帝不僅憐憫，而且公義。他善於把智慧、憐憫、公義和愛結合在一起。</p>
