  title: 基督的名號
  copy_cover: true
  body: <p>對穆斯林而言，重要的是：聖經把許多名號歸於基督，而伊斯蘭教只允許把這些名號歸於上帝——<strong>創造者</strong>、<strong>聖者</strong>、<strong>萬王之王</strong>、<strong>首先的</strong>、<strong>永不改變的</strong>、<strong>大能者</strong>：</p><ul><li><p><strong>創造者</strong>（al-Khaliq，ٱلْخَـٰلِقُ）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L3,10">約 1:3,10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L1-2">希 1:1-2</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L3">希 11:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L8-12">希 1:8-12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/1/#L13-17">西 1:13-17</a></p></li><li><p><strong>萬王之王</strong>（مالك الملك，Malik al-Mulk）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/17/#L14">啟 17:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/19/#L16">啟 19:16</a></p></li><li><p>統治萬有者（ٱلْقَهَّـٰرُ，al-Qahhar）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/17/#L14">啟 17:14</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/19/#L16">啟 19:16</a></p></li><li><p><strong>聖者</strong>（ٱلْقُدُّوسُ，al-Quddus）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L7">啟 3:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L10">啟 6:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L26">希 7:26</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/3/#L14">徒 3:14</a></p></li><li><p>溫柔者（ٱلْحَلِيمُ，al-Halim）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/11/#L19">耶 11:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L29">太 11:29</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L5">太 21:5</a></p></li><li><p>太初、<strong>首先的</strong>（الأول，al-Awwal）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L1-3">約 1:1-3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L10">啟 1:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L17">啟 1:17</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L8">啟 2:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L13">啟 22:13</a></p></li><li><p>末後的（الأخر，al-Akhir）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L10">啟 1:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L17">啟 1:17</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/2/#L8">啟 2:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/22/#L13">啟 22:13</a></p></li><li><p><strong>永不改變的</strong>（الصمد，as-Samad）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L8">希 13:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L10-12">希 1:10-12</a></p></li><li><p>永活的（الحي，al-Hayy）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L17">啟 1:17</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/3/#L15">徒 3:15</a></p></li><li><p>救主（ٱلْمُهَيْمِنُ，al-Muhaymin）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/4/#L42">約 4:42</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L47">路 1:47</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L11">路 2:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L31">徒 5:31</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L23">徒 13:23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L23">弗 5:23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/3/#L20">腓 3:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/1/#L1">提前 1:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L10">提後 1:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L4">多 1:4</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/2/#L13">多 2:13</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L6">多 3:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L1">彼後 1:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L11">彼後 1:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/2/#L20">彼後 2:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/3/#L18">彼後 3:18</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/4/#L14">約壹 4:14</a></p></li><li><p>光（النور，an-Nur）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L9">約 1:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L46">約 12:46</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L35-36">約 12:35-36</a></p></li><li><p>後嗣（الوارث，al-Warith）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L2">希 1:2</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L38">太 21:38</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L1">提後 4:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2pet/1/#L11">彼後 1:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/8/#L17">羅 8:17</a></p></li><li><p>真理（الحق，al-Haqq）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/14/#L6">約 14:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L7">啟 3:7</a></p></li><li><p>開啟者（ٱلْفَتَّاحُ，al-Fattah）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L7-8">啟 3:7-8</a></p></li><li><p>使人復活的（ٱلْبَاعِثُ，al-Ba'ith）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L21">約 5:21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L54">約 6:54</a></p></li><li><p><strong>大能者</strong>（ٱلْجَبَّارُ，al-Jabbar）——<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L3">希 1:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L8">啟 1:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L18">太 28:18</a></p></li></ul>
