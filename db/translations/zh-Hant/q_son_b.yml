  body: <h2>耶穌基督將在末日審判所有人</h2><blockquote><p>“<strong>人子</strong>要在他父的榮耀裏，同著衆使者降臨；那時候，他要<strong>照各人的行爲報應各人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/16/#L27">太 16:27</a>)</p></blockquote><blockquote><p>“當<strong>人子</strong>在他榮耀裏，同著衆天使降臨的時候，要坐在他榮耀的寶座上。 萬民都要聚集在他面前。<strong>他要把他們分別出來</strong>，好像牧羊的分別綿羊山羊一般；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><blockquote><p>“父不審判什麼人，<strong>乃將審判的事全交與子</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L22">約 5:22</a>)</p></blockquote><blockquote><p>“上帝怎樣以聖靈和能力膏<strong>拿撒勒人耶穌</strong>，這都是你們知道的。他周流四方，行善事，醫好凡被魔鬼壓制的人，因爲上帝與他同在。 &lt;…&gt; 他吩咐我們傳道給衆人，證明他是<strong>上帝所立定的，要作審判活人死人的主</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L38,42">徒 10:38,42</a>)</p></blockquote><blockquote><p>“因爲他已經定了日子，要<strong>藉着他所設立的人按公義審判天下</strong>，並且<strong>叫他從死裏復活</strong>，給萬人作可信的憑據。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/17/#L31">徒 17:31</a>)</p></blockquote><blockquote><p>“因爲我們衆人必要在<strong>基督臺前</strong>顯露出來，叫各人按著本身所行的，或善或惡受報。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><blockquote><p>“我在<strong>上帝面前，並在將來審判活人死人的基督耶穌面前</strong>，憑著他的顯現和他的國度囑咐你：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/4/#L1">提後 4:1</a>)</p></blockquote><h2>所有人都要受審判</h2><blockquote><p>“因爲<strong><mark>我們衆人</mark></strong>必要在基督臺前顯露出來，叫各人按著本身所行的，<strong><mark>或善或惡受報</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><blockquote><p>“你這個人，爲什麼論斷弟兄呢？又爲什麼輕看弟兄呢？因<strong><mark>我們</mark></strong>都<strong>要站在上帝的臺前</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/14/#L10">羅 14:10</a>) <em>(希臘文此處爲「基督的臺前」（τοῦ Χριστοῦ）；和合本作「上帝的臺前」)</em></p></blockquote><blockquote><p>“你們既然要<strong><mark>按使人自由的律法受審判</mark></strong>，就該照這律法說話行事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/2/#L12">雅 2:12</a>)</p></blockquote><blockquote><p>“因爲<strong><mark>人所作的事</mark></strong>，連一切隱藏的事，無論是<strong>善是惡</strong>，<strong>上帝都必審問</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ekl/12/#L14">傳 12:14</a>)</p></blockquote><blockquote><p>“當<strong>人子</strong>在他榮耀裏，同著衆天使降臨的時候，要<strong>坐在他榮耀的寶座上</strong>。 <strong><mark>萬民都要聚集在他面前</mark></strong>。<strong><mark>他要把他們分別出來</mark></strong>，好像牧羊的分別<strong><mark>綿羊山羊</mark></strong>一般；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-32">太 25:31-32</a>)</p></blockquote><h2>審判要從上帝的家起首</h2><blockquote><p>“因爲時候到了，<strong><mark>審判要從上帝的家起首</mark></strong>。若是<strong><mark>先從我們起首</mark></strong>，那不信從上帝福音的人將有何等的結局呢？ 『若是<strong>義人僅僅得救</strong>，那不虔敬和犯罪的人，將有何地可站呢？』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/4/#L17-18">彼前 4:17-18</a>)</p></blockquote><blockquote><p>“我被你們論斷，或被別人論斷，我都以爲極小的事．<strong><mark>連我自己也不論斷自己</mark></strong>。 我雖不覺得自己有錯，卻也不能因此得以稱義；但<strong><mark>判斷我的乃是主</mark></strong>。 所以，時候未到，<strong>什麼都不要論斷</strong>，只等主來，他要照出暗中的隱情，顯明人心的意念。那時，各人要從上帝那裏得著稱讚。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L3-5">林前 4:3-5</a>)</p></blockquote><h2>基督要按人在肉身活著時所行的事審判他</h2><blockquote><p>“因爲我們衆人必要在基督臺前顯露出來，叫各人<strong>按著本身所行的</strong>，或善或惡受報。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/5/#L10">林後 5:10</a>)</p></blockquote><p>審判按人在地上活著時所行的事施行：</p><blockquote><p>“王又要向那左邊的說：『<strong>你們這被咒詛的人，離開我，進入那爲魔鬼和他的使者所預備的永火裏去</strong>！ 因爲我餓了，你們不給我吃；渴了，你們不給我喝； 我作客旅，你們不留我住；我赤身露體，你們不給我穿；我病了，我在監裏，你們不來看顧我。』 他們也要回答說：『主啊，我們什麼時候見你餓了，或渴了，或作客旅，或赤身露體，或病了，或在監裏，不伺候你呢？』 王要回答說：『我實在告訴你們：<strong>這些事你們既不作在我這弟兄中一個最小的身上，就是不作在我身上了</strong>。』 <strong>這些人，要往永刑裏去；那些義人，要往永生裏去</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L41-46">太 25:41-46</a>)</p></blockquote>
  meta_desc: "“我們衆人必要在基督臺前顯露出來，叫各人按著本身所行的，或善或惡受報”（林後 5:10）"
