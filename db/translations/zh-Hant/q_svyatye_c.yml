  path: QW6A_敬禮聖髑
  title: 敬禮聖髑
  copy_cover: true
  body: <h2>爲什麼敬禮聖義者的聖髑</h2><p>敬禮聖義者的聖髑，理由與敬禮聖義者本身相同（詳見下一篇<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬禮聖人</a>）；敬禮他們，是因爲他們分有上帝、因爲上帝的恩典在他們裏面運作（<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a>）。敬禮的對象是義人的整體，而不是他的某一部分（<a href="https://bibleox.com/ru/ru/w/состав-человека">人性構成</a>）。受敬禮的不只是<strong>靈魂</strong>，還有<strong>身體</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>），甚至<strong>遺物</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L12">徒 19:12</a>）和<strong>像</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L15">徒 5:15</a>）——上帝藉它們施行奇蹟和醫治，賜下自己的恩典。</p><p>因爲聖人<strong>受敬禮是由於他們分有上帝、由於上帝的恩典在他們裏面運作</strong>，而上帝賜下自己的恩典，不但經由聖徒活著的身體，也經由他們死後的身體（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>），所以聖徒的身體不只在生前、在死後（身體與靈魂分離之後）也因恩典而受敬禮。</p><p>上帝不厭惡自己朋友們的遺體。上帝看顧義人的遺骸（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L19-20">詩 34:19-20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L33,36">約 19:33,36</a>），並繼續藉它們行事（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>）。持香的婦女們對遺骸也沒有厭惡——她們在救主死後第三天去開他的墳墓，要用香膏膏抹基督死去的身體（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L1-3">可 16:1-3</a>），儘管摩西的律法禁止除親屬之外的任何人接觸死者的身體（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L1-4">利 21:1-4</a>）。</p><h2>常見的問題</h2><h3>爲什麼聖髑在聖殿裏，而不在土裏</h3><p><strong>聖殿就是</strong>義人遺骸的<strong>墳墓</strong>。聖髑保存在聖殿的石棺（聖髑匣、聖髑櫃）裏。上帝說人是土、所以要歸回土（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/3/#L19">創 3:19</a>），這話的意思是：人用土造成的身體[1]會重新變爲土，即朽壞分解，重新成爲它起初所是的——土。</p><p>許多義人並不是字面地被埋進土裏。相反，義人們力求以某種特別的方式安葬義人，常常爲安葬挑選專門的場所。</p><ol><li><p><strong>亞伯拉罕把自己親人的遺體安葬在專門購買的洞穴裏</strong>。他向當地的居民求葬地，而他們向他提出<strong>最好的</strong>葬地（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/23/#L2-6">創 23:2-6</a>）。最後，亞伯拉罕請求並買下他們所指的洞穴爲業（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/23/#L7-13,17-20">創 23:7-13,17-20</a>），好在那裏安葬自己的親人。就在同一個洞穴裏，後來安葬了亞伯拉罕本人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/25/#L9-10">創 25:9-10</a>）、他的妻子撒拉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/23/#L19">創 23:19</a>）、以撒和他的妻子利百加（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/49/#L1,29-33">創 49:1,29-33</a>）、雅各和他的妻子利亞（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/49/#L1,29-33">創 49:1,29-33</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/50/#L12-13">創 50:12-13</a>）；</p></li><li><p><strong>主耶穌基督被安葬在岩石中鑿出的專門墓穴裏</strong>——那是財主約瑟（亞利馬太人）爲自己鑿的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/27/#L57,60">太 27:57,60</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/15/#L46">可 15:46</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/23/#L50-53">路 23:50-53</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L41">約 19:41</a>）。這正是上帝起初藉先知以賽亞預言所定的：“人還使他與惡人同埋；誰知死的時候<strong>與財主同葬</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/53/#L9">賽 53:9</a>）；</p></li><li><p><strong>最早的基督徒常常把義人安葬在地下墓穴的專門墓室裏</strong>，並在聖髑旁舉行事奉聖禮（<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых#HH-Община-Поликарпа-Смирнского-II-век">例子</a>）；</p></li><li><p>三百年後、四世紀基督教安全的時代來臨，聖人的遺骸開始被安葬在聖殿裏：或如義人約瑟那樣安放在石棺中（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/50/#L26">創 50:26</a>；<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых#HH-Григорий-Нисский-святитель-331-394">例子</a>），或安置在聖殿主要部分（祭壇）下方專門的墓室（地窟）裏，或建造專門的單獨建築（殉道者紀念堂）（<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых#HH-Амвросий-Медиоланский-святитель-397">例子</a>）。</p></li></ol><p>這樣，<strong>從最古老的年代起，義人就把義人安葬在專門的場所，而不是土裏</strong>。教會在今天也是這樣：義人的遺骸安放在專門場所——舉行事奉聖禮的聖殿——裏的石棺中。</p><p>無論我們怎麼做，實質是同一個：</p><ul><li><p>或者建一座殉道者紀念堂來安放聖髑石棺，教會聚集在其中舉行事奉聖禮；</p></li><li><p>或者反過來，建一座舉行事奉聖禮的聖殿，把聖髑石棺安放在那裏。</p></li></ul><p>教會從最古老的時代起就建造安放聖人棺柩的建築，並在那裏舉行事奉聖禮。</p><h3>遷移聖髑</h3><p>聖經中多次發生義人遺骸的遷移，沒有任何責難。例如，族長約瑟被安葬在埃及的石棺（聖髑匣）裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/50/#L26">創 50:26</a>），後來先知摩西與民衆四十多年抬著約瑟的遺骸走曠野，爲要在約瑟自己指定的地方安葬他。詳見<a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых#HH-Эпизоды-об-останках-из-Библии">下文</a>。</p><h3>聖髑的分割</h3><p>從最古老的年代起，聖義者的遺骸是在最殘酷的酷刑（砍碎、焚燒）之後到達教會的——不是完整的，也不是一下子全部（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/14/#L11">太 14:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L28">可 6:28</a>）。而上帝后來照樣經由義人的遺骸行事，無論它們是否被收攏在一起。教會本身若保存了義人完整的遺骸，就把它們整體保存在安放於聖殿中的專門棺柩（石棺、聖髑匣）裏。分割可能出於不得已的原因：在自然災害和敵人襲擊時搶救聖髑。有時爲了在別處敬禮義人，只取聖髑極小的一粒碎屑。</p><h2>上帝對人遺骸的態度</h2><h3>上帝保全義人的遺骸</h3><blockquote><p>“<strong><mark>義人多有苦難</mark></strong>，但耶和華救他脫離這一切； <strong><mark>又保全他一身的骨頭，連一根也不折斷</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L19-20">詩 34:19-20</a>)</p></blockquote><blockquote><p>“只是來到耶穌那裏，見他已經死了，<strong><mark>就不打斷他的腿</mark></strong>。 &lt;…&gt; 這些事成了，爲要應驗經上的話說：『<strong><mark>他的骨頭一根也不可折斷</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L33,36">約 19:33,36</a>)</p></blockquote><p>由此可見上帝自己對聖人遺骸的態度。儘管如此，上帝有時容許（而不是願意）義人受折磨，甚至被斬首，如先知施洗約翰（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/14/#L11">太 14:11</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L28">可 6:28</a>）。但上帝也藉被分割的聖人遺骸賜下恩典。</p><h3>上帝使罪人的遺骸蒙羞</h3><blockquote><p>“<strong>上帝打散討好人的骨頭</strong>：他們必蒙羞，因爲上帝棄絕了他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/52/#L5">詩 52:5</a>) <em>(此處俄文原文引教會斯拉夫語譯本（Пс 52:5）；和合本相應經文（詩 53:5）行文不同。)</em></p></blockquote><h2>上帝繼續經由義人死去的身體行事</h2><p>觸摸先知以利沙的骸骨，死人復活了——旁邊甚至看不見祈禱的舉行：</p><blockquote><p>“有人正葬死人，忽然看見一羣人，就把死人拋在以利沙的墳墓裏，<strong><mark>一碰著以利沙的骸骨，死人就復活站起來了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h2>上帝繼續經由義人用過的物品行事</h2><p>因使徒的衣物得醫治：</p><blockquote><p>“<strong><mark>甚至有人從保羅身上拿手巾或圍裙放在病人身上，病就退了，惡鬼也出去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L12">徒 19:12</a>)</p></blockquote><h2>上帝經由義人的像行事</h2><p>因使徒的像得醫治：</p><blockquote><p>“甚至有人將病人抬到街上，放在牀上或褥子上，<strong><mark>指望彼得過來的時候，或者得他的影兒照在什麼人身上</mark></strong>。 還有許多人帶著病人和被污鬼纏磨的，從耶路撒冷四圍的城邑來，<strong><mark>全都得了醫治</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h2>向聖人叩拜</h2><p>十誡的第一誡（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L2-3">出 20:2-3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L6-7">申 5:6-7</a>）禁止敬拜假神（偶像）。假神不但虛假，而且根本不存在。</p><p>聖人則真實存在，他們是上帝的朋友；向他們叩拜，不是把他們當神。向聖人和他們的聖髑叩拜，是表達對他們的敬意——作爲上帝的朋友。這樣的向天使、向人、向物件的叩拜在聖經中有，而且不是拜偶像，因爲拜偶像——是敬拜<strong>假</strong>神。義人們經常向人、向各種物件、向天使下拜；別人也向先知下拜。</p><h4>向以天使形像顯現的上帝叩拜</h4><blockquote><p>“舉目觀看，<strong><mark>見有三個人在對面站著</mark></strong>。他一見，就從帳棚門口跑去迎接他們，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L2">創 18:2</a>)</p></blockquote><h4>向天使叩拜</h4><blockquote><p>“他回答說：「不是的，我來是要作耶和華軍隊的元帥。」<strong><mark>約書亞就俯伏在地下拜</mark></strong>，說：「我主有什麼話吩咐僕人？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/5/#L14">書 5:14</a>)</p></blockquote><h4>向先知叩拜</h4><blockquote><p>“住耶利哥的先知門徒從對面看見他，就說：「感動以利亞的靈感動以利沙了。」他們就來迎接他，<strong><mark>在他面前俯伏於地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/2/#L15">王下 2:15</a>)</p></blockquote><h4>向聖殿叩拜</h4><blockquote><p>“至於我，我必憑你豐盛的慈愛，進入你的居所；我必存敬畏你的心，<strong><mark>向你的聖殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>)</p></blockquote><h4>向上帝的腳凳叩拜</h4><blockquote><p>“你們當尊崇耶和華我們的上帝，<strong><mark>在他腳凳前下拜</mark></strong>；他本爲聖！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我們要進他的居所，在他腳凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>)</p></blockquote><h4>向約櫃叩拜</h4><blockquote><p>“約書亞便撕裂衣服；他和以色列的長老把灰撒在頭上，在耶和華的約櫃前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>)</p></blockquote><h4>向杖叩拜</h4><p>經上記著“以色列在牀頭上敬拜”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/47/#L31">創 47:31</a>），而在七十士譯本里是“在杖頭上”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L21">希 11:21</a>）。</p><p>更多例子：<a href="https://bibleox.com/ru/ru/w/поклоны">叩拜</a></p><h2>聖經中關於遺骸的事例</h2><h3>持香的婦女們在安葬後的第三天去開墳墓、接觸主耶穌基督的聖潔身體</h3><blockquote><p>“過了安息日，抹大拉的馬利亞和雅各的母親馬利亞並撒羅米，<strong><mark>買了香膏要去膏耶穌的身體</mark></strong>。 七日的第一日清早，出太陽的時候，她們來到墳墓那裏， 彼此說：「<strong><mark>誰給我們把石頭從墓門滾開呢</mark></strong>？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L1-3">可 16:1-3</a>)</p></blockquote><blockquote><p>“七日的頭一日，黎明的時候，那些婦女<strong><mark>帶著所預備的香料</mark></strong><strong><mark>來到墳墓</mark></strong>前，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L1">路 24:1</a>)</p></blockquote><blockquote><p>“安息日將盡，七日的頭一日，天快亮的時候，抹大拉的馬利亞和那個馬利亞<strong><mark>來看墳墓</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/28/#L1">太 28:1</a>)</p></blockquote><blockquote><p>“七日的第一日清早，天還黑的時候，抹大拉的馬利亞<strong><mark>來到墳墓那裏</mark></strong>，看見石頭從墳墓挪開了，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L1">約 20:1</a>)</p></blockquote><h3>遷移遺骸</h3><h4>約瑟</h4><p>約瑟（雅各的兒子）請求日後把他的遺骸從埃及遷到上帝應許給他的那地：</p><blockquote><p>“約瑟對他弟兄們說：「我要死了，但上帝必定看顧你們，領你們從這地上去，到他起誓所應許給亞伯拉罕、以撒、雅各之地。」 約瑟叫以色列的子孫起誓，說：「上帝必定看顧你們，<strong><mark>你們要把我的骸骨從這裏搬上去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/50/#L24-25">創 50:24-25</a>)</p></blockquote><p>約瑟死了，人們把他安葬在埃及，收殮在棺材（聖髑匣）裏：</p><blockquote><p>“約瑟死了，正一百一十歲。人用香料將他薰了，把他收殮在棺材裏，停在埃及。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/50/#L26">創 50:26</a>)</p></blockquote><p>先知摩西履行了約瑟的請求：</p><blockquote><p>“所以上帝領百姓繞道而行，走紅海曠野的路。以色列人出埃及地，都帶著兵器上去。 <strong><mark>摩西把約瑟的骸骨一同帶去</mark></strong>，因爲約瑟曾叫以色列人嚴嚴地起誓，對他們說：「上帝必眷顧你們，<strong><mark>你們要把我的骸骨從這裏一同帶上去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/13/#L18-19">出 13:18-19</a>)</p></blockquote><p>先知摩西和以色列民<strong>四十多年</strong>抬著約瑟的遺骸在西奈半島上漂泊。後來，約書亞把約瑟的遺骸安葬在示劍（<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/24/#L32">書 24:32</a>）。</p><p>考慮到四十年的西奈曠野漂泊——即以色列從埃及的奴役到應許之地的路程——是新約教會生活的預像：教會把人從罪的奴役中領出、引領人進入上帝所應許的天國；那麼在這教會的整個生命時期，上帝的民始終帶著義人的聖髑。舊約教會的預像，在到達自己的國之前，始終帶著義人的聖髑。</p><h4>掃羅</h4><p>掃羅被非利士人殺死；雅比的居民燒了他們的身體，把骨頭葬在自己城的柳樹下：</p><blockquote><p>“又將掃羅的軍裝放在亞斯他錄廟裏，<strong><mark>將他的屍身釘在伯珊的城牆上</mark></strong>。 基列雅比的居民聽見非利士人向掃羅所行的事， 他們中間所有的勇士就起身，走了一夜，<strong><mark>將掃羅和他兒子的屍身從伯珊城牆上取下來</mark></strong>，送到雅比那裏<strong><mark>用火燒了</mark></strong>。 <strong><mark>將他們骸骨葬在雅比的垂絲柳樹下</mark></strong>，<strong><mark>就禁食七日</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/31/#L10-13">撒上 31:10-13</a>)</p></blockquote><blockquote><p>“他們中間所有的勇士就起身前去，將掃羅和他兒子的屍身送到雅比，<strong><mark>將他們的屍骨葬在雅比的橡樹下</mark></strong>，就禁食七日。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/10/#L12">代上 10:12</a>)</p></blockquote><p>大衛把掃羅的遺骸遷到便雅憫地，與掃羅父親的遺骸一同安葬：</p><blockquote><p>“大衛就去，從基列雅比人那裏<strong><mark>將掃羅和他兒子約拿單的骸骨搬了來</mark></strong>。是因非利士人從前在基利波殺掃羅，將屍身懸掛在伯珊的街市上，基列雅比人把屍身偷了去。 <strong><mark>大衛將掃羅和他兒子約拿單的骸骨從那裏搬了來</mark></strong>，又收殮被懸掛七人的骸骨。 <strong><mark>將掃羅和他兒子約拿單的骸骨葬在便雅憫的洗拉</mark></strong>，<strong><mark>在掃羅父親基士的墳墓裏</mark></strong>。衆人行了王所吩咐的。<strong><mark>此後上帝垂聽國民所求的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/21/#L12-14">撒下 21:12-14</a>)</p></blockquote><h3>延遲安葬的情形</h3><p>雅各的安葬是在77天多之後舉行的：</p><blockquote><p>“約瑟伏在他父親的面上哀哭，與他親嘴。約瑟吩咐伺候他的醫生用香料薰他父親，醫生就用香料薰了以色列。薰屍的常例是<strong>四十天</strong>；那四十天滿了，埃及人爲他<strong>哀哭了七十天</strong>。我父親曾叫我起誓說：<strong>你要將我葬在迦南地，在我爲自己所掘的墳墓裏</strong>。現在求你讓我上去葬我父親，以後我必回來。法老說：你可以上去，照著你父親所說的去葬他。於是約瑟上去葬他父親。<strong>與他一同上去的，有法老的一切臣僕</strong>……” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/50/#L1-3,5-13">創 50:1-3,5-13</a>)</p></blockquote><h3>先知請求與另一位先知的聖髑同葬</h3><blockquote><p>“老先知就把神人的屍身馱在驢上，帶回自己的城裏，要哀哭他，葬埋他。 <strong><mark>就把他的屍身葬在自己的墳墓裏</mark></strong>，哀哭他，說：「哀哉！我兄啊！」 安葬之後，老先知對他兒子們說：「<strong><mark>我死了，你們要葬我在神人的墳墓裏</mark></strong>；<strong><mark>使我的屍骨靠近他的屍骨</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/13/#L29-31">王上 13:29-31</a>)</p></blockquote><h2>雅各敬禮妻子的遺骸</h2><blockquote><p>“拉結死了，葬在以法他的路旁。以法他就是伯利恆。 <strong><mark>雅各在她的墳上立了一統碑</mark></strong>，<strong><mark>就是拉結的墓碑，到今日還在</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/35/#L19-20">創 35:19-20</a>)</p></blockquote><h2>約西亞王敬禮先知的聖髑</h2><p>論到約西亞說：在他以前沒有王像他、在他以後也沒有興起王像他，因爲他盡心、儘性、盡力歸向上帝（<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/23/#L25">王下 23:25</a>）。猶大王約西亞自幼順服上帝，成年後開始潔淨自己的國家脫離異教：他摧毀異教的像、祭壇、燒香的異教邱壇、異教的神聖樹叢，禁止祭司的事奉，消滅了行邪術的和交鬼的，潔淨並修理了耶路撒冷上帝的聖殿，找到了聖經的書卷，向民衆宣讀，民衆被帶入與上帝所立的約。約西亞不但摧毀異教的邱壇，還力求玷污它們——把人的骨頭撒在那裏：</p><blockquote><p>“從前以色列王所羅門在耶路撒冷前，邪僻山右邊，爲西頓人可憎的神亞斯他錄、摩押人可憎的神基抹、亞捫人可憎的神米勒公所築的邱壇，<strong><mark>王都污穢了</mark></strong>， 又打碎柱像，砍下木偶，<strong><mark>將人的骨頭充滿了那地方</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/23/#L13-14">王下 23:13-14</a>)</p></blockquote><p>約西亞毀滅了耶羅波安的舊偶像，玷污了那裏的墳冢：</p><blockquote><p>“他將伯特利的壇，就是叫以色列人陷在罪裏，尼八的兒子耶羅波安所築的那壇，都拆毀焚燒，打碎成灰，並焚燒了亞舍拉。 約西亞回頭，看見山上的墳墓，就打發人<strong><mark>將墳墓裏的骸骨取出來，燒在壇上，污穢了壇</mark></strong>，正如從前神人宣傳耶和華的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/23/#L15-16">王下 23:15-16</a>)</p></blockquote><p>然而，當他遇到一座紀念碑，查明那是預言了這些事件的先知的墳墓時，他就恭敬地對待他的聖髑。此外，紀念碑本身的存在，表明先前對先知的敬禮：</p><blockquote><p>“約西亞問說：「<strong><mark>我所看見的是什麼碑</mark></strong>？」那城裏的人回答說：「先前有神人從猶大來，預先說王現在向伯特利壇所行的事，<strong><mark>這就是他的墓碑</mark></strong>。」 約西亞說：「<strong><mark>由他吧！不要挪移他的骸骨</mark></strong>。」<strong><mark>他們就不動他的骸骨</mark></strong>，也不動從撒瑪利亞來那先知的骸骨。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/23/#L17-18">王下 23:17-18</a>)</p></blockquote><p>這同一位神人先前就預言了這件事將要發生：</p><blockquote><p>“神人奉耶和華的命向壇呼叫說：「<strong><mark>壇哪！壇哪</mark></strong>！耶和華如此說：『<strong><mark>大衛家裏必生一個兒子，名叫約西亞</mark></strong>。他必將邱壇的祭司，就是在你上面燒香的，殺在你上面，<strong><mark>人的骨頭也必燒在你上面</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/13/#L2">王上 13:2</a>)</p></blockquote><h2>西門敬禮親人的遺骸</h2><p>大祭司約拿單（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1mak/10/#L20">加上 10:20</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1mak/11/#L57">加上 11:57</a>）被安葬在巴斯加瑪。後來，他的兄弟、大祭司西門（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1mak/13/#L36,42">加上 13:36,42</a>）把他的遺骸遷到祖城摩丁——此前猶大也被安葬在那裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1mak/9/#L19">加上 9:19</a>）。西門修建了一座高大的建築，以此敬禮親人的遺骸：</p><blockquote><p>“當他臨近巴斯加瑪時，將約納堂殺死，就埋葬在那裏。<strong>息孟遣人去運回他兄弟的骨骸，將他埋葬在他祖先的摩丁城裏。</strong>全以色列都舉哀痛吊他，哀哭多日。之後，息孟在他父親與他兄弟們的墳墓上，用前後光澤的石頭，修了一座相當高大的紀念碑，從遠處可以望見。他爲父母和四個兄弟，還立了七座金字塔，彼此相對；且爲塔作了一些裝飾品，就是在四周，立了一些大石柱，石柱上刻了武器，<strong>作爲永久的記念</strong>；又在武器旁，彫刻了船像，使航海的人都可以看到。息孟在摩丁修建的<strong>這座墳墓</strong>，至今猶存。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/1mak/13/#L23,25-30">加上 13:23,25-30</a>)</p></blockquote><h2>相關引文</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">敬禮聖人</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">敬禮聖像</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">爲聖人祈禱</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">人——上帝的殿</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">人的構成</a></p></li></ol>
