  title: 聖物
  copy_cover: true
  body: <h2>新約中的聖物</h2><h3>聖潔的聖殿</h3><p>耶路撒冷聖殿是真聖所的像：</p><blockquote><p>“因爲<strong><mark>基督並不是進了人手所造的聖所（這不過是真聖所的影像）</mark></strong>，乃是進了天堂，如今爲我們顯在上帝面前；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>)</p></blockquote><blockquote><p>“猶太人的逾越節近了，耶穌就上耶路撒冷去。 <strong><mark>看見殿裏有賣牛、羊、鴿子的</mark></strong>，並有兌換銀錢的人坐在那裏。 耶穌就拿繩子作成鞭子，<strong><mark>把牛羊都趕出殿去</mark></strong>；倒出兌換銀錢之人的銀錢，推翻他們的桌子。 又對賣鴿子的說：「把這些東西拿去！<strong><mark>不要將我父的殿當作買賣的地方</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L13-16">約 2:13-16</a>)</p></blockquote><blockquote><p>“<strong><mark>常在殿裏稱頌上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L53">路 24:53</a>)</p></blockquote><blockquote><p>“<strong><mark>他們天天同心合意恆切的在殿裏</mark></strong>，且在家中擘餅，存著歡喜、誠實的心用飯，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L46">徒 2:46</a>)</p></blockquote><p>使徒在聖殿裏祈禱，基督在那裏於異象中向他顯現：</p><blockquote><p>“後來，我回到耶路撒冷，<strong><mark>在殿裏禱告的時候</mark></strong>，<strong><mark>魂遊象外</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/22/#L17">徒 22:17</a>)</p></blockquote><p>敵基督（大罪人）要坐在上帝的殿裏（顯然，要坐在上帝的殿裏，那殿必須是：不是宙斯的殿、不是雷神的殿，而是上帝的殿）：</p><blockquote><p>“人不拘用什麼法子，你們總不要被他誘惑！因爲那日子以前，必有離道反教的事，<strong><mark>並有那大罪人</mark></strong>，就是沉淪之子，顯露出來。 他是<strong><mark>抵擋主，高抬自己</mark></strong>，超過一切稱爲神的和一切受人敬拜的．<strong><mark>甚至坐在上帝的殿裏自稱是上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L3-4">帖後 2:3-4</a>)</p></blockquote><h3>聖地</h3><p>在聖地，聽的人必須看見什麼：</p><blockquote><p>“你們看見先知但以理所說的『<strong><mark>那行毀壞可憎的</mark></strong>』<strong><mark>站在聖地</mark></strong>（讀這經的人須要會意）。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L15">太 24:15</a>)</p></blockquote><h3>聖物</h3><h4>聖殿和祭壇仍舊是聖的，並使人成聖</h4><blockquote><p>“你們這無知瞎眼的人哪！什麼是大的？是金子呢，<strong><mark>還是叫金子成聖的殿呢</mark></strong>？ &lt;…&gt; 你們這瞎眼的人哪！什麼是大的？是禮物呢，<strong><mark>還是叫禮物成聖的壇呢</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L17,19">太 23:17,19</a>)</p></blockquote><h4>天使藉水賜下醫治</h4><blockquote><p>“<strong><mark>因爲有天使按時下池子攪動那水</mark></strong>，水動之後，<strong><mark>誰先下去，無論害什麼病就痊瘉了</mark></strong>。』〕” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/5/#L4">約 5:4</a>)</p></blockquote><h4>使徒們以抹油醫治人</h4><blockquote><p>“耶穌叫了十二個門徒來，差遣他們兩個兩個地出去，也賜給他們權柄，制伏污鬼， &lt;…&gt; 門徒就出去傳道，叫人悔改； 又趕出許多的鬼，<strong><mark>用油抹了許多病人，治好他們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L7,12-13">可 6:7,12-13</a>)</p></blockquote><blockquote><p>“你們中間有病了的呢，他就該請教會的長老來，他們可以奉主的名<strong><mark>用油抹他</mark></strong>，爲他禱告。 出於信心的祈禱要救那病人，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你們要彼此認罪，互相代求，使你們可以得醫治。義人祈禱所發的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote><h4>基督的血——是聖物</h4><blockquote><p>“人干犯摩西的律法，憑兩三個見證人尚且不得憐恤而死； 何況人踐踏上帝的兒子，<strong><mark>將那使他成聖之約的血當作平常</mark></strong>，<strong><mark>又褻慢施恩的聖靈</mark></strong>，你們想，他要受的刑罰該怎樣加重呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/10/#L28-29">希 10:28-29</a>)</p></blockquote><h4>人因觸摸使徒遺下的衣物而得醫治</h4><blockquote><p>“<strong><mark>甚至有人從保羅身上拿手巾或圍裙放在病人身上，病就退了，惡鬼也出去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/19/#L12">徒 19:12</a>)</p></blockquote><h4>敵基督將高抬自己超過聖物</h4><p>顯然，要高抬自己超過聖物，聖物必須存在：</p><blockquote><p>“人不拘用什麼法子，你們總不要被他誘惑！因爲那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來。 他是<strong><mark>抵擋主，高抬自己</mark></strong>，<strong><mark>超過一切稱爲神的和一切受人敬拜的</mark></strong>．<strong><mark>甚至坐在上帝的殿裏自稱是上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L3-4">帖後 2:3-4</a>)</p></blockquote><h3>聖像</h3><h4>人們指望從使徒的影子得醫治</h4><blockquote><p>“甚至有人將病人抬到街上，放在牀上或褥子上，<strong><mark>指望彼得過來的時候，或者得他的影兒照在什麼人身上</mark></strong>。 還有許多人帶著病人和被污鬼纏磨的，從耶路撒冷四圍的城邑來，<strong><mark>全都得了醫治</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L15-16">徒 5:15-16</a>)</p></blockquote><h3>聖潔的人（司祭）</h3><h4>基督只向使徒們顯現。基督只把權柄賜給他們</h4><blockquote><p>“耶穌又對他們說：「願你們平安！父怎樣差遣了我，我也照樣差遣你們。」 說了這話，就向他們吹一口氣，說：「<strong><mark>你們受聖靈</mark></strong>。 <strong><mark>你們赦免誰的罪，誰的罪就赦免了</mark></strong>；你們留下誰的罪，誰的罪就留下了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/20/#L21-23">約 20:21-23</a>)</p></blockquote><blockquote><p>“我實在告訴你們：<strong><mark>凡你們在地上所捆綁的，在天上也要捆綁</mark></strong>；凡你們在地上所釋放的，在天上也要釋放。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L18">太 18:18</a>)</p></blockquote><h3>聖潔的規程和聖奧祕</h3><p>聖餐的祭（新約的）。主教只教導使徒們舉行的方式：</p><blockquote><p>“他們吃的時候，耶穌<strong><mark>拿起餅來，祝福，就擘開遞給門徒</mark></strong>，說：「你們拿著吃，這是我的身體。」 <strong><mark>又拿起杯來，祝謝了</mark></strong>，遞給他們，說：「你們都喝這個， 因爲這是我立約的血，爲多人流出來，使罪得赦。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26-28">太 26:26-28</a>)</p></blockquote><p>同樣見：<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L22-24">可 14:22-24</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19-20">路 22:19-20</a></p><p>然後又單獨教導後來歸依的使徒保羅同樣的規程（禮規）：</p><blockquote><p>“又拿起餅來，祝謝了，就擘開，遞給他們，說：「這是我的身體，爲你們舍的，<strong><mark>你們也應當如此行，爲的是記念我</mark></strong>。」 <strong><mark>飯後也照樣拿起杯來</mark></strong>，說：「這杯是用我血所立的新約，是爲你們流出來的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19-20">路 22:19-20</a>)</p></blockquote><blockquote><p>“<strong><mark>我當日傳給你們的，原是從主領受的</mark></strong>，就是主耶穌被賣的那一夜，拿起餅來， 祝謝了，就擘開，說，「這是我的身體，爲你們舍的。<strong><mark>你們應當如此行，爲的是記念我</mark></strong>。」 飯後，也照樣拿起杯來，說：「<strong><mark>這杯是用我的血所立的新約</mark></strong>。你們每逢喝的時候，要如此行，爲的是記念我。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L23-25">林前 11:23-25</a>)</p></blockquote><h4>按手與祈禱</h4><blockquote><p>“爲此我提醒你，使你將<strong><mark>上帝藉我按手所給你的恩賜</mark></strong>，再如火挑旺起來。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L6">提後 1:6</a>)</p></blockquote><blockquote><p>“你不要輕忽所得的恩賜，就是從前藉着預言、<strong><mark>在衆長老按手的時候賜給你的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/4/#L14">提前 4:14</a>)</p></blockquote><blockquote><p>“他們事奉主，禁食的時候，聖靈說：「要爲我分派巴拿巴和掃羅，去作我召他們所作的工。」 於是禁食禱告，<strong><mark>按手在他們頭上</mark></strong>，就打發他們去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L2-3">徒 13:2-3</a>)</p></blockquote><blockquote><p>“叫他們站在使徒面前。<strong><mark>使徒禱告了，就按手在他們頭上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/6/#L6">徒 6:6</a>)</p></blockquote><p>同樣見：<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/21/#L8">徒 21:8</a></p><blockquote><p>“<strong><mark>各樣洗禮、按手之禮</mark></strong>、死人復活，以及永遠審判各等教訓。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L2">希 6:2</a>)</p></blockquote><blockquote><p>“<strong><mark>西門看見使徒按手，便有聖靈賜下</mark></strong>，就拿錢給使徒， 說：「把這權柄也給我，叫我手按著誰，誰就可以受聖靈。」 彼得說：「你的銀子和你一同滅亡吧！因<strong><mark>你想上帝的恩賜是可以用錢買的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L18-20">徒 8:18-20</a>)</p></blockquote><blockquote><p>“因爲聖靈還沒有降在他們一個人身上，他們只奉主耶穌的名受了洗。 <strong><mark>於是使徒按手在他們頭上，他們就受了聖靈</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/8/#L16-17">徒 8:16-17</a>)</p></blockquote><h4>上帝賜下傳遞恩典的恩賜</h4><blockquote><p>“彼得說：「金銀我都沒有，只把我所有的給你，<strong><mark>我奉拿撒勒人耶穌基督的名，叫你起來行走</mark></strong>！」 於是拉著他的右手，扶他起來。<strong><mark>他的腳和踝子骨立刻健壯了</mark></strong>， 就跳起來，站著，又行走；同他們進了殿，走著，跳著，讚美上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/3/#L6-8">徒 3:6-8</a>)</p></blockquote><h2>舊約中的聖物</h2><h3>聖潔的聖殿</h3><blockquote><p>“耶和華曉諭摩西說： 「<strong><mark>你告訴以色列人當爲我送禮物來</mark></strong>，凡甘心樂意的，你們就可以收下歸我。 &lt;…&gt; <strong><mark>又當爲我造聖所</mark></strong>，使我可以住在他們中間。 製造帳幕和其中的一切器具，<strong><mark>都要照我所指示你的樣式</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L1-2,8-9">出 25:1-2,8-9</a>)</p></blockquote><blockquote><p>“<strong><mark>他必爲我的名建造殿宇</mark></strong>。他要作我的子，我要作他的父．他作以色列王，我必堅定他的國位，直到永遠。』 我兒啊，現今願耶和華與你同在，使你亨通，照他指著你說的話，建造耶和華你上帝的殿。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/22/#L9-10">代上 22:9-10</a>)</p></blockquote><blockquote><p>“至於我，我必憑你豐盛的慈愛，進入你的居所；我必存敬畏你的心，<strong><mark>向你的聖殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>)</p></blockquote><h3>聖地</h3><blockquote><p>“上帝說：「不要近前來，當把你腳上的鞋脫下來，因爲<strong><mark>你所站之地是聖地</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/3/#L5">出 3:5</a>)</p></blockquote><blockquote><p>“耶和華軍隊的元帥對約書亞說：「<strong><mark>把你腳上的鞋脫下來，因爲你所站的地方是聖的</mark></strong>。」約書亞就照著行了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/5/#L15">書 5:15</a>)</p></blockquote><blockquote><p>“你要將承接聖職所獻公羊的肉，<strong><mark>煮在聖處</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L31">出 29:31</a>)</p></blockquote><h3>聖物</h3><p>聖膏——是聖物。聖殿和一切以聖膏膏抹的殿內器皿——是聖物。在人中間，只有亞倫的後裔可以用它膏抹，使他們成爲司祭：</p><blockquote><p>“「你要取上品的香料，就是流質的沒藥五百舍客勒，香肉桂一半，就是二百五十舍客勒，菖蒲二百五十舍客勒， 桂皮五百舍客勒，都按著聖所的平，又取橄欖油一欣， <strong><mark>按作香之法，調和作成聖膏油</mark></strong>。 <strong><mark>要用這膏油抹會幕和法櫃</mark></strong>， 桌子與桌子的一切器具，燈臺和燈臺的器具，並香壇、 燔祭壇和壇的一切器具，洗濯盆和盆座。 <strong><mark>要使這些物成爲聖，好成爲至聖，凡挨着的都成爲聖</mark></strong>。 <strong><mark>要膏亞倫和他的兒子</mark></strong>，使他們成爲聖，可以給我供祭司的職分。 你要對以色列人說：『這油，我要世世代代以爲聖膏油， 不可倒在別人的身上，也不可按這調和之法作與此相似的。<strong><mark>這膏油是聖的，你們也要以爲聖</mark></strong>。 凡調和與此相似的，或將這膏膏在別人身上的，<strong><mark>這人要從民中剪除</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/30/#L23-33">出 30:23-33</a>)</p></blockquote><p>祭壇——至聖的聖物：</p><blockquote><p>“用膏油把帳幕和其中所有的都抹上，使帳幕和一切器具成聖，就都成聖， 又要抹燔祭壇和一切器具，<strong><mark>使壇成聖，就都成爲至聖</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/40/#L9-10">出 40:9-10</a>)</p></blockquote><blockquote><p>“要潔淨壇七天，使壇成聖。<strong><mark>壇就成爲至聖，凡挨着壇的都成爲聖</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L37">出 29:37</a>)</p></blockquote><p>香的配方（在祭壇上焚燒的香料）——至聖的聖物：</p><blockquote><p>“耶和華吩咐摩西說：「你要取馨香的香料，就是拿他弗、施喜列、喜利比拿。這馨香的香料和淨乳香各樣要一般大的分量。 你要用這些加上鹽，按作香之法，<strong><mark>作成清淨聖潔的香</mark></strong>。 這香要取點搗得極細，放在會幕內法櫃前，我要在那裏與你相會。<strong><mark>你們要以這香爲至聖</mark></strong>。 你們不可按這調和之法爲自己作香；<strong><mark>要以這香爲聖，歸耶和華</mark></strong>。 凡作香和這香一樣，爲要聞香味的，<strong><mark>這人要從民中剪除</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/30/#L34-38">出 30:34-38</a>)</p></blockquote><h3>聖像</h3><blockquote><p>“你要用十幅幔子作帳幕。這些幔子要用撚的細麻和藍色、紫色、硃紅色線製造，<strong><mark>並用巧匠的手工繡上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/26/#L1">出 26:1</a>)</p></blockquote><blockquote><p>“他們中間，凡心裏有智慧作工的，用十幅幔子作帳幕。這幔子是比撒列用撚的細麻和藍色、紫色、硃紅色線製造的，<strong><mark>並用巧匠的手工繡上基路伯</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/36/#L8">出 36:8</a>)</p></blockquote><blockquote><p>“<strong><mark>用膏油把帳幕和其中所有的都抹上</mark></strong>，使帳幕和一切器具成聖，就都成聖，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/40/#L9">出 40:9</a>)</p></blockquote><h3>聖潔的人（司祭）</h3><p><a href="https://bibleox.com/ru/ru/w/Таинство-Священства">司祭</a>——只是亞倫的後裔：</p><blockquote><p>“給亞倫和他兒子束上腰帶，包上裹頭巾，<strong><mark>他們就憑永遠的定例得了祭司的職任</mark></strong>；又要將亞倫和他兒子分別爲聖。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L9">出 29:9</a>)</p></blockquote><p>司祭職與聖衣、膏抹一同傳遞：</p><blockquote><p>“<strong><mark>亞倫的聖衣要留給他的子孫</mark></strong>，可以穿著受膏，又穿著承接聖職。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29">出 29:29</a>)</p></blockquote><p>外人若近前來行事奉的禮，必須治死。司祭職的職責就是看守這事：</p><blockquote><p>“你要囑咐亞倫和他兒子，謹守自己祭司的職任。<strong><mark>近前來的外人必被治死</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/3/#L10">民 3:10</a>)</p></blockquote><h4>觸摸先知以利沙的身體使人得醫治</h4><blockquote><p>“有人正葬死人，忽然看見一羣人，就把死人拋在以利沙的墳墓裏，<strong><mark>一碰著以利沙的骸骨，死人就復活站起來了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/13/#L21">王下 13:21</a>)</p></blockquote><h3>聖潔的規程和聖奧祕</h3><p>舊約裏規程非常多。可以從利未記認識它們。例如立大祭司的規程：<a href="https://bibleox.com/ru/ru/w/ветхозаветный-священник#HH-Обряд">詳見</a></p><p>聖餐的祭（舊約的）：</p><p><a href="https://bibleox.com/ru/ru/w/Евхаристия#HH-Мирная-жертва-благодарения">詳見</a></p><h4>按手與祈禱</h4><p>#### 雅各祝福孫子</p><p>雅各以祈禱按手祝福了自己的孫子：</p><blockquote><p>“<strong><mark>以色列伸出右手來</mark></strong>，<strong><mark>按在以法蓮的頭上</mark></strong>，以法蓮乃是次子；<strong><mark>又剪搭過左手來按在瑪拿西的頭上</mark></strong>，瑪拿西原是長子。 <strong><mark>他就給約瑟祝福說</mark></strong>：「願我祖亞伯拉罕和我父以撒所事奉的上帝，就是一生牧養我，直到今日的上帝， 救贖我脫離一切患難的那使者，<strong><mark>賜福與這兩個童子</mark></strong>。願他們歸在我的名下和我祖亞伯拉罕、我父以撒的名下，又願他們在世界中，生養衆多。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/48/#L14-16">創 48:14-16</a>)</p></blockquote><p>#### 摩西立約書亞擔任事奉</p><p>上帝命令先知摩西以按手立約書亞擔任事奉：</p><blockquote><p>“耶和華對摩西說：「嫩的兒子約書亞是心中有聖靈的，<strong><mark>你將他領來，按手在他頭上</mark></strong>， &lt;…&gt; 於是，摩西照耶和華所吩咐的，將約書亞領來，使他站在祭司以利亞撒和全會衆面前， <strong><mark>按手在他頭上，囑咐他</mark></strong>，是照耶和華藉摩西所說的話。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/27/#L18,22-23">民 27:18,22-23</a>)</p></blockquote><p>#### 立利未人擔任事奉的方式</p><p>上帝命令以按手立利未人在聖殿供職：</p><blockquote><p>“將利未人奉到耶和華面前，<strong><mark>以色列人要按手在他們頭上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/8/#L10">民 8:10</a>)</p></blockquote><h2>對異議的回應</h2><h3>“上帝不住人手所造的殿”</h3><p>反對聖殿的教會批評者引用一節經文：</p><blockquote><p>“大衛在上帝面前蒙恩，祈求爲雅各的上帝預備居所； 卻是所羅門爲上帝造成殿宇。 <strong><mark>其實，至高者並不住人手所造的</mark></strong>，就如先知所言： 『主說：天是我的座位，地是我的腳凳，<strong><mark>你們要爲我造何等的殿宇</mark></strong>？那裏是我安息的地方呢？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L46-49">徒 7:46-49</a>)</p></blockquote><p>然而這絲毫不能證明反對聖殿，因爲當大衛想爲上帝建造殿宇時，上帝早已命令先知摩西建造會幕、祝聖它、在其中設立司祭、遵守規程、擁有聖物（約櫃）、並設立了違反上帝所立秩序的死刑。這節經文只是說明：上帝無處不在，而不只在聖殿裏。同時，聖殿——是上帝自己的設立，而不是人的設立，更不是彷彿從異教借來的東西。</p><h2>補充</h2><h3>反對並高抬自己超過聖物——敵基督的標誌之一</h3><blockquote><p>“人不拘用什麼法子，你們總不要被他誘惑！因爲那日子以前，必有離道反教的事，並有那大罪人，就是沉淪之子，顯露出來。 他是<strong><mark>抵擋主，高抬自己</mark></strong>，<strong><mark>超過一切稱爲神的和一切受人敬拜的</mark></strong>．甚至坐在上帝的殿裏自稱是上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/2/#L3-4">帖後 2:3-4</a>)</p></blockquote><blockquote><p>“小子們哪，如今是末時了。你們曾聽見說，那敵基督的要來，<strong><mark>現在已經有好些敵基督的出來了</mark></strong>，從此我們就知道如今是末時了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L18">約壹 2:18</a>)</p></blockquote><h3>獸將褻瀆住在天上的</h3><blockquote><p>“獸就開口向上帝說褻瀆的話，褻瀆上帝的名，<strong><mark>並他的帳幕，以及那些住在天上的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/13/#L6">啟 13:6</a>)</p></blockquote><h3>在天上的，是義人的靈魂和天使</h3><blockquote><p>“你們乃是來到錫安山，永生上帝的城邑，<strong><mark>就是天上的耶路撒冷</mark></strong>。那裏有<strong><mark>千萬的天使</mark></strong>， 有名錄在天上諸長子之會所共聚的總會，有審判衆人的上帝和<strong><mark>被成全之義人的靈魂</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L22-23">希 12:22-23</a>)</p></blockquote>
