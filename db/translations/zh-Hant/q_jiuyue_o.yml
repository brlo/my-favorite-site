  path: QO23A_餅與無酵餅
  title: 餅與無酵餅（ἄρτος 與 ἄζυμα）
  copy_cover: true
  body: <h2>本文論什麼</h2><p>本文以新舊約聖經文本爲例，分析希臘詞「ἄρτος」與「ἄζυμα」在聖餐禮問題上的用法。</p><p><strong>Ἄρτος</strong>——只是餅，不指明其性質。</p><p><strong>Ἄζυμα</strong>——無酵餅。</p><p><strong>Ἄρτος ἄζυμος</strong>——無酵的餅。「ἄρτος」一詞的加添，通常發生在列舉不同種類的無酵餅時（無酵的餅、無酵的薄餅）。</p><p>對這些希臘詞的引用，在歷史爭論中被用作論據。</p><h2>爭論的對象</h2><p>在關於<a href="https://bibleox.com/ru/ru/w/Евхаристия">聖餐禮</a>（東正教會的主要聖奧祕）的歷史討論中，一直有爭論：主耶穌基督遞給使徒們、稱之爲自己身體時，所用的<strong>餅</strong>是什麼。</p><p>爭論分爲兩種意見：</p><ul><li><p><strong>有酵的餅</strong>（發麵的）——東正教會；</p></li><li><p><strong>無酵的餅</strong>（無酵餅）——天主教（起初也用有酵的餅）和新教（有不同做法）。</p></li></ul><p>東正教會——羅馬教會直到十一世紀也屬於其中——從一開始就在各地使用有酵的餅。當羅馬教會脫離正教時，在羅馬的諸多新做法中，也考慮到羅馬放棄以有酵之餅行聖禮、轉用無酵之餅的問題。後來這一問題在與新教各派別的論戰中再次成爲焦點。</p><p>支持在聖餐禮上使用有酵之餅的論據有一系列，其一是「ἄρτος」一詞。四位傳道者（馬太、馬可、路加、約翰）都用希臘詞「<strong>ἄρτος</strong>」稱呼聖餐的餅，這有理由認爲餅是有酵的，因爲逾越節晚餐的無酵餅在聖經中總是（無一例外）用希臘詞「<strong>ἄζυμος</strong>」稱呼。而且凡說到無酵餅，幾乎總是直接指明它是無酵的。</p><h3>傳道者馬太</h3><blockquote><p>“他們吃的時候，<strong><mark>耶穌拿起餅來</mark></strong>，祝福，就擘開遞給門徒，說：「你們拿著吃，這是我的身體。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L26">太 26:26</a>)</p></blockquote><h3>傳道者馬可</h3><blockquote><p>“他們吃的時候，<strong><mark>耶穌拿起餅來</mark></strong>，祝了福，就擘開遞給他們，說：「你們拿著吃，這是我的身體。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L22">可 14:22</a>)</p></blockquote><h3>傳道者路加</h3><blockquote><p>“<strong><mark>又拿起餅來</mark></strong>，祝謝了，就擘開，遞給他們，說：「這是我的身體，爲你們舍的，你們也應當如此行，爲的是記念我。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19">路 22:19</a>)</p></blockquote><h3>傳道者約翰</h3><blockquote><p>“我這話不是指著你們衆人說的，我知道我所揀選的是誰。現在要應驗經上的話，說：『<strong><mark>同我吃飯的人</mark></strong>，用腳踢我。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/13/#L18">約 13:18</a>)</p></blockquote><h3>使徒保羅</h3><blockquote><p>“我當日傳給你們的，原是從主領受的，<strong><mark>就是主耶穌被賣的那一夜，拿起餅來</mark></strong>， 祝謝了，就擘開，說，「<strong><mark>這是我的身體，爲你們舍的</mark></strong>。你們應當如此行，爲的是記念我。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L23-24">林前 11:23-24</a>)</p></blockquote><h2>聖經中的「ἄζυμος」或「ἄρτος ἄζυμος」</h2><p>在聖經中，「ἄρτος」通常指有酵的餅，而「ἄζυμος」指無酵餅。凡說到逾越節的無酵餅，聖經總是直接說明：或只說<strong>ἄζυμος</strong>（無酵餅），或說<strong>ἄρτος ἄζυμος</strong>（無酵的餅）（通常在列舉不同種類無酵餅時）。這對遵行律法是重要的：要指明餅是無酵的。</p><p>比如，我們今天稱白麵包爲「麵包」，而稱黑麵包爲「黑麵包」——這區別對我們未必重要，但對猶太人在律法方面卻原則性地重要：餅是不是無酵的。</p><p>這樣，可以只說「ἄζυμος」（無酵的），也可以說「ἄρτος ἄζυμος」（無酵的餅），但無酵餅從不被只稱爲「ἄρτος」而不提及這餅的無酵性。最常見的是用一個詞「ἄζυμος」稱呼無酵餅。</p><p>「ἄρτος ἄζυμος」（無酵的餅）這一表達出現得少得多。加添其他詞是在說到不同種類的無酵餅的時候——形狀和做法不同的無酵餅。於是，加 油 做成的餅狀無酵餅被稱爲「ἄρτος ἄζυμος」（無酵的餅），而薄餅狀、抹了油的無酵餅被稱爲「λάγανον ἄζυμον」（無酵的薄餅）。因此在少數情形下會出現這樣的組合：</p><ul><li><p>無酵的餅；</p></li><li><p>無酵的薄餅。</p></li></ul><p>如果沒有列舉不同種類的無酵餅，那麼幾乎總是用一個詞稱呼：<strong>ἄζυμος</strong>。</p><h2>總的畫面</h2><h3>舊約</h3><p>逾越節的餅總是被稱爲無酵的。使用的是：「ἄζυμα」或「ἄρτος ἄζυμα」。</p><h3>新約</h3><p>聖餐的餅從不被稱爲無酵的。傳道者們總是用「ἄρτος」一詞，完全不提及晚餐上有「ἄζυμα」。</p><h2>那麼，ἄρτος 或許也可以是無酵餅？</h2><p>東正教會的反對者想證明聖經中任何餅——包括無酵餅——都可稱爲 ἄρτος，舉出極罕見的情形（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L2">出 29:2</a>和<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L23">出 29:23</a>）：那裏說的是無酵餅，卻只稱爲「ἄρτος」。這正是說到兩種不同無酵餅的情形：餅（ἄρτος）和薄餅（λάγανον）。</p><p>在詳細考察這幾節之前，可以先指出：即便在這裏，也毫不含糊地指明所說的是無酵的餅：</p><ol><li><p>在<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L2">出 29:2</a>一章的開頭，這些餅（餅和薄餅）被稱爲：無酵的餅和無酵的薄餅。</p></li><li><p>在<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L23">出 29:23</a>一章的中部，較簡短地重複：一個餅和一個薄餅，並立刻指明：「從裝無酵餅的筐子中」，即無酵的。</p></li></ol><p>現在詳細考察。這些詞是希臘文的，因此直接查考七十士譯本（LXX）的希臘文本——它是在耶穌基督誕生前兩個世紀由七十二位猶太譯者譯成的。取 LXX 的希臘文文本（附翻譯）：</p><blockquote><p>καὶ［而］<strong>ἄρτους</strong>［餅］<strong>ἀζύμους</strong>［無酵的］πεφυραμένους［調合了］ἐν［用］ἐλαίῳ［油］καὶ［和］<strong>λάγανα</strong>［薄餅］<strong>ἄζυμα</strong>［無酵的］κεχρισμένα［抹了］ἐν - ἐλαίῳ［油］；σεμίδαλιν［細麵］ἐκ［用］πυρῶν［小麥］ποιήσεις［你要作］αὐτά［它們］。（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L2">出 29:2</a>）</p></blockquote><p>這裏出現的是：1）<strong>無酵的餅</strong>（ἄρτους ἀζύμους）用油調合（πεφυραμένους ἐν ἐλαίῳ）；2）<strong>無酵的薄餅</strong>（λάγανα ἄζυμα）抹了油（κεχρισμένα ἐν ἐλαίῳ）。七十士譯本只提到這兩種無酵餅（馬所拉文本——三種無酵餅）。隨後上帝吩咐要用小麥的細麵作成。再看下一節：</p><blockquote><p>καὶ［和］<strong>ἄρτον</strong>［餅］ἕνα［一個］ἐξ［從］ἐλαίου［油的］καὶ［和］<strong>λάγανον</strong>［薄餅］ἓν［一個］ἀπὸ［從］τοῦ - κανοῦ［筐子］τῶν - <strong>ἀζύμων</strong>［無酵的］τῶν - προτεθειμένων［擺著的］ἔναντι［在］κυρίου［主］面前。</p></blockquote><p>這裏提到的仍是第二節中那兩個餅：</p><ul><li><p>「一個調油的餅」；</p></li><li><p>「一個薄餅」。</p></li></ul><p>並且立刻說明：它們是從裝有無酵餅的筐子中取的。況且，在這一章（第2節）已經說過這餅是無酵的。</p><p>也就是說，即便在「ἄρτος」與「ἄζυμος」連用的情形中，每次也都指明餅是無酵的。但此處給「ἄζυμος」加添其他詞也有原因：這裏描述的是不同的無酵餅（餅和薄餅）。如果不用附加的詞來描述做法，就成了「取一個無酵餅和無酵餅」，看起來相當奇怪。</p><p>由於餅彼此不同，就需要附加的詞：</p><ul><li><p>ἄρτους ἀζύμους（無酵的餅）；</p></li><li><p>λάγανα ἄζυμα（無酵的薄餅）。</p></li></ul><p>第二次：</p><ul><li><p>ἄρτον（餅）；</p></li><li><p>λάγανον（薄餅）；</p></li><li><p>從裝無酵餅的筐子中（ἀζύμων）。</p></li></ul><h2>無酵餅提及的彙編</h2><h3>舊約</h3><ul><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/19/#L3">創 19:3</a>：無酵餅——ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L8">出 12:8</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L15">出 12:15</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L18">出 12:18</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L20">出 12:20</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/12/#L39">出 12:39</a>：無酵餅——ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/13/#L6">出 13:6</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/13/#L7">出 13:7</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/23/#L15">出 23:15</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/23/#L15">出 23:15</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L2">出 29:2</a>：無酵的餅——ἄρτους ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L2">出 29:2</a>：無酵的薄餅——λάγανα ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L23">出 29:23</a>：從裝無酵餅的筐子中——ἀπὸ τοῦ κανοῦ τῶν ἀζύμων（列舉餅的種類，描述受聖職禮儀）</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/34/#L18">出 34:18</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/34/#L18">出 34:18</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/2/#L4">利 2:4</a>：無酵的餅——ἄρτους ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/2/#L4">利 2:4</a>：無酵的薄餅——λάγανα ἄζυμα（列舉餅的種類）</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/2/#L5">利 2:5</a>：無酵的——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/6/#L16">利 6:16</a>：無酵的——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/7/#L12">利 7:12</a>：無酵的薄餅——λάγανα ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/8/#L2">利 8:2</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/8/#L26">利 8:26</a>：一個無酵餅——ἄρτον ἕνα ἄζυμον（列舉餅的種類，描述受聖職禮儀）</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/10/#L12">利 10:12</a>：無酵的——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/23/#L6">利 23:6</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/23/#L6">利 23:6</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/6/#L15">民 6:15</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/6/#L15">民 6:15</a>：無酵的薄餅——λάγανα ἄζυμα（列舉餅的種類）</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/6/#L17">民 6:17</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/6/#L19">民 6:19</a>：無酵的餅——ἄρτον ἕνα ἄζυμον</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/6/#L19">民 6:19</a>：無酵的薄餅——λάγανον ἄζυμον（列舉餅的種類）</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/9/#L11">民 9:11</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/28/#L17">民 28:17</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L3">申 16:3</a>：無酵餅、困苦餅——「ἄζυμα, ἄρτον κακώσεως」</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L16">申 16:16</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/5/#L11">書 5:11</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/6/#L19">士 6:19</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/6/#L20">士 6:20</a>：無酵餅——ἄρτους τοὺς ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/6/#L21">士 6:21</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/6/#L21">士 6:21</a>：無酵餅——ἀζύμους</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/28/#L24">撒上 28:24</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/23/#L9">王下 23:9</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/1par/23/#L29">代上 23:29</a>：無酵的薄餅——λάγανα τὰ ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/8/#L13">代下 8:13</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/30/#L13">代下 30:13</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/30/#L21">代下 30:21</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/30/#L22">代下 30:22</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/35/#L17">代下 35:17</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/ezd/6/#L22">拉 6:22</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2ezd/1/#L10">厄三 1:10</a>：無酵餅——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2ezd/1/#L17">厄三 1:17</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/2ezd/7/#L14">厄三 7:14</a>：無酵餅——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/45/#L21">結 45:21</a>：無酵餅——ἄζυμα</p></li></ul><h3>新約</h3><ul><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L17">太 26:17</a>：除酵的——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L1">可 14:1</a>：除酵節——ἄζυμα</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L12">可 14:12</a>：除酵節——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L1">路 22:1</a>：除酵節——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L7">路 22:7</a>：除酵節——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/act/12/#L3">徒 12:3</a>：除酵的日子——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L6">徒 20:6</a>：除酵的日子——ἀζύμων</p></li><li><p><a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L8">林前 5:8</a>：無酵餅——ἀζύμοις</p></li></ul><p>可以確信：最常見的是隻說「ἄζυμος」，但有時也說「ἄρτος ἄζυμος」。沒有找到任何一處把逾越節的無酵餅只稱爲「ἄρτος」。說到逾越節晚餐時，總是簡單地說：無酵餅（ἀζύμους），不加任何附加詞。當舊約中出現指向新約、教會和聖餐禮的地方時，說的則是 ἄρτος（普通的餅），或者甚至是有酵的 ἄρτος（即直接指明有酵）。我們來看這些指向新約的地方。</p><h2>麥基洗德——聖餐禮的預像</h2><p>先知和使徒們稱上帝之子爲按麥基洗德等次的祭司：</p><blockquote><p>“並蒙上帝<strong><mark>照著麥基洗德的等次</mark></strong>稱他爲大祭司。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/5/#L10">希 5:10</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/5/#L6">希 5:6</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/6/#L20">希 6:20</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L11">希 7:11</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L17">希 7:17</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/7/#L21">希 7:21</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/110/#L4">詩 110:4</a>（俄文本編號爲 Пс 109:4）。)</em></p></blockquote><p>回憶麥基洗德。族長亞伯拉罕遇見了至高上帝的神祕祭司（那時祭司職分還未設立）——撒冷王麥基洗德。麥基洗德拿普通的餅（ἄρτος）和酒出來迎接亞伯拉罕，而亞伯拉罕把十分之一獻給他（那時什一奉獻還未設立）：</p><blockquote><p>“又有撒冷王麥基洗德<strong><mark>帶著餅和酒</mark></strong>，出來迎接；他是至高上帝的祭司。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/14/#L18">創 14:18</a>)</p></blockquote><p>麥基洗德用的只是 ἄρτος。</p><h2>嗎哪——聖餐禮的預像</h2><p>舊約中在曠野裏賜給猶太人以維持生命的嗎哪，是聖餐禮的預像，主耶穌基督親自指明了這一點。在舊約中，上帝稱嗎哪爲從天降下的餅（ἄρτος）：</p><blockquote><p>“耶和華對摩西說：「<strong><mark>我要將糧食從天降給你們</mark></strong>。百姓可以出去，每天收每天的分，我好試驗他們遵不遵我的法度。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/16/#L4">出 16:4</a>)</p></blockquote><p>餅在這一章中提到7次，7次都稱爲 ἄρτος：</p><blockquote><p>“以色列人看見，不知道是什麼，就彼此對問說：「這是什麼呢？」摩西對他們說：「<strong><mark>這就是耶和華給你們吃的食物</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/16/#L15">出 16:15</a>)</p></blockquote><p>天上的餅（嗎哪）被稱爲 ἄρτος。</p><h2>上帝在幔利橡樹旁向亞伯拉罕顯現——聖餐禮的預像</h2><p>亞伯拉罕爲上帝（以三位天使的形像顯現）預備了普通餅（ἄρτος）和宰殺的「又嫩又好」的牛犢（基督祭獻的預像）的筵席：</p><blockquote><p>“<strong><mark>我再拿一點餅來，你們可以加添心力</mark></strong>、然後往前去。你們既到僕人這裏來，理當如此。」他們說：「就照你說的行吧！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L5">創 18:5</a>)</p></blockquote><p>亞伯拉罕在預像聖餐禮的筵席上用的只是 ἄρτος。</p><h2>關於聖餐禮的預言</h2><p>在箴言書中，說到聖餐禮時，講的是普通的餅（ἄρτος）：</p><blockquote><p>“<strong><mark>智慧建造房屋，鑿成七根柱子</mark></strong>， 宰殺牲畜，調和旨酒，設擺筵席。 打發使女出去，自己在城中至高處呼叫， 說：「誰是愚蒙人，可以轉到這裏來！」又對那無知的人說： 「<strong><mark>你們來，吃我的餅，喝我調和的酒</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/9/#L1-5">箴 9:1-5</a>)</p></blockquote><p>在關於聖餐禮的預言文本中，指明的是 ἄρτος。</p><h2>五旬節——教會的誕生日</h2><p>在舊約的五旬節（在新約中，五旬節是教會的誕生日），主直接命令給他獻上<strong>新的</strong>祭——<strong>有酵的（ἐζυμωμένοι）餅（ἄρτοι）</strong>和七隻無殘疾的羊羔：</p><blockquote><p>“到第七個安息日的次日，共計五十天，<strong><mark>又要將新素祭獻給耶和華</mark></strong>。 要從你們的住處取出細麵伊法十分之二，<strong><mark>加酵，烤成兩個搖祭的餅</mark></strong>，<strong><mark>當作初熟之物獻給耶和華</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/23/#L16-17">利 23:16-17</a>)</p></blockquote><p>舊約的五旬節明確地使用有酵的 ἄρτος。</p><h2>感恩的平安祭</h2><p>舊約中有兩種平安祭：</p><ul><li><p>讚美的祭（希伯來文 תודה）；</p></li><li><p>感恩的祭（或救恩的祭）（希伯來文 שלמים 或 נדר）。</p></li></ul><p>平安祭包含餅的供物和牲畜的祭獻。<strong>讚美</strong>的平安祭用無酵的餅獻上，而若在其之外還獻<strong>感恩</strong>的平安祭，則用有酵的餅獻上：</p><blockquote><p>“<strong><mark>要用有酵的餅和爲感謝獻的平安祭</mark></strong>，與供物一同獻上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/7/#L13">利 7:13</a>)</p></blockquote><p>這樣，在舊約中，感恩（救恩）的祭用有酵的餅獻上。在新約中，向上帝獻上餅的聖奧祕被稱爲<strong>「感恩禮」（源自希臘文——感恩）</strong>，因爲基督自己在把餅遞給門徒之前，先<strong>祝謝了</strong>上帝並祝福了餅（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L19">路 22:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L23-24">林前 11:23-24</a>）。</p><p>也就是說，在東正教會的感恩禮中，今天所做的正是：</p><ul><li><p>取有酵的餅；</p></li><li><p>只是不與之同獻祭牲，因爲祭物、羔羊、逾越節——就是被釘十字架並復活的基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L7">林前 5:7</a>）。</p></li></ul><p>應當注意：無酵餅被稱爲困苦餅（「ἄζυμα, ἄρτον κακώσεως」，<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L3">申 16:3</a>），而用有酵之餅的平安祭稱爲感恩的祭，或救恩的祭（תֹּודַ֥ת——感恩，σωτηρίου——救恩，<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/7/#L13">利 7:13</a>）。</p><p>*注：祭肉的肉允許在當天吃掉、不留到早晨（如同逾越節），或吃兩天，但嚴格禁止留到第三天。若沒有在第三天之前吃完，剩下的就應當燒掉，否則祭物被上帝拒絕，發生玷污和罪。這把我們引向救主的復活——第三天墳墓就空了。也就是說，在這裏，有酵的餅同樣指向新約——救主的復活。</p><h2>新約中關於聖餐禮的話</h2><p>舉行感恩禮時總是提到 ἄρτος；引文已在上面給出。這裏再看其他直接和間接的引文。它們都指向 ἄρτος：</p><blockquote><p>“<strong><mark>我是從天上降下來生命的糧</mark></strong>，人若吃這糧就必永遠活著；<strong><mark>我所要賜的糧就是我的肉</mark></strong>，爲世人之生命所賜的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L51">約 6:51</a>)</p></blockquote><blockquote><p>“<strong><mark>我就是生命的糧</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/6/#L48">約 6:48</a>)</p></blockquote><blockquote><p>“<strong><mark>我們日用的飲食，天天賜給我們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L3">路 11:3</a>)</p></blockquote><blockquote><p>“他醒悟過來，就說：『<strong><mark>我父親有多少的僱工，口糧有餘</mark></strong>，我倒在這裏餓死嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/15/#L17">路 15:17</a>)</p></blockquote><blockquote><p>“兩個人就把路上所遇見，和<strong><mark>擘餅的時候怎麼被他們認出來</mark></strong>的事，都述說了一遍。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L35">路 24:35</a>)</p></blockquote><blockquote><p>“都恆心遵守使徒的教訓，彼此交接，<strong><mark>擘餅，祈禱</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L42">徒 2:42</a>)</p></blockquote><blockquote><p>“他們天天同心合意恆切的在殿裏，<strong><mark>且在家中擘餅</mark></strong>，存著歡喜、誠實的心用飯，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/2/#L46">徒 2:46</a>)</p></blockquote><blockquote><p>“<strong><mark>七日的第一日，我們聚會擘餅的時候</mark></strong>，保羅因爲要次日起行，就與他們講論，直講到半夜。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L7">徒 20:7</a>)</p></blockquote><blockquote><p>“<strong><mark>保羅又上去，擘餅</mark></strong>，喫了，談論許久，直到天亮，這才走了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/20/#L11">徒 20:11</a>)</p></blockquote><blockquote><p>“我們所祝福的杯，豈不是同領基督的血嗎？<strong><mark>我們所擘開的餅，豈不是同領基督的身體嗎</mark></strong>？ <strong><mark>我們雖多，仍是一個餅、一個身體</mark></strong>，<strong><mark>因爲我們都是分受這一個餅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/10/#L16-17">林前 10:16-17</a>)</p></blockquote><h2>酵——罪的預像？</h2><p>有時會遇到把舊酵的比喻用作邪惡和詭詐之酵的說法。使徒保羅正是使用<strong>舊</strong>酵的比喻，指出必須除掉它：</p><blockquote><p>“你們既是無酵的面，<strong><mark>應當把舊酵除淨</mark></strong>，好使你們成爲新團；因爲我們逾越節的羔羊基督，已經被殺獻祭了。 所以我們守這節不可用舊酵，<strong><mark>也不可用惡毒、邪惡的酵</mark></strong>，<strong><mark>只用誠實真正的無酵餅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/5/#L7-8">林前 5:7-8</a>)</p></blockquote><p>然而，基督自己以另一種方式使用酵的比喻，把它比作天國：</p><blockquote><p>“他又對他們講個比喻說：「<strong><mark>天國好像面酵</mark></strong>，有婦人拿來，藏在三鬥面裏，<strong><mark>直等全團都發起來</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L33">太 13:33</a>) <em>(並見 <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/13/#L21">路 13:21</a>。)</em></p></blockquote><p>也就是說，酵是不同的。它表明小小的東西可以影響巨大的東西：酵使<strong>全</strong>團發起來。類似地，救主也用鹽的比喻：鹽很少，卻影響整個環境。可以注意，舊約中既獻無酵的餅爲祭，也獻有酵的餅爲祭。有酵之餅所獻上的，是把我們引向新約的東西——感恩的平安祭（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/7/#L13">利 7:13</a>）和五旬節的祭（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/23/#L16-17">利 23:16-17</a>）。而無酵餅則被稱爲困苦餅（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L3">申 16:3</a>），是對埃及奴役的記念。無酵的、無味的、堅硬的、配苦菜的餅，應當提醒猶太民族那些主救他們脫離的苦難。而有酵的餅則相反——應當把心思轉向蒙福的時光、脫離苦難的解脫、上帝祝福的時光。</p><h2>關於 LXX 與馬所拉文本的說明</h2><p>俄文正教譯本（司祭宗教譯本）按馬所拉文本譯成（該文本在基督被釘十字架之後編成），而 LXX（在基督前兩個世紀編成）只在教義上有意義的地方加以參照。東正教會誦讀按 LXX 編成的教會斯拉夫語文本。這一切都很重要，因爲希伯來文的馬所拉文本在本主題所關注的地方與同樣是猶太人所編、但以希臘文寫成的 LXX 略有不同。例如在（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L2">出 29:2</a>）：馬所拉文本提到三種不同的餅（雖然都是無酵的），LXX 只提到兩種餅（也都是無酵的）。往後也是如此。</p>
