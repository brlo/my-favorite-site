- src: притча_о_выборе_места_на_свадьбе
  path: QPr8T_挑選婚宴座位的比喻
  title: 挑選婚宴座位的比喻
  copy_cover: true
  body: <blockquote><p>“「你被人請去赴婚姻的筵席，<strong><mark>不要坐在首位上</mark></strong>，恐怕有比你尊貴的客被他請來； 那請你們的人前來對你說：『讓座給這一位吧！』你就羞羞慚慚的退到末位上去了。 你被請的時候，<strong><mark>就去坐在末位上</mark></strong>，好叫那請你的人來對你說：『朋友，請上坐。』<strong><mark>那時，你在同席的人面前就有光彩了</mark></strong>。 因爲，<strong><mark>凡自高的，必降爲卑；自卑的，必升爲高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/14/#L8-11">路 14:8-11</a>)</p></blockquote>
