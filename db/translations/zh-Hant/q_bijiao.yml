- src: притча-о-двух-рабах-_благоразумном-и-злом
  path: QPr10T_兩個僕人的比喻
  title: 兩個僕人的比喻（忠心的和惡的）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>誰是忠心有見識的僕人</mark></strong>，爲主人所派，管理家裏的人，按時分糧給他們呢？ 主人來到，看見他這樣行，那僕人就有福了。 我實在告訴你們：<strong><mark>主人要派他管理一切所有的</mark></strong>。 <strong><mark>倘若那惡僕心裏說</mark></strong>：『我的主人必來得遲』， 就動手打他的同伴，又和酒醉的人一同吃喝。 在想不到的日子，不知道的時辰，那僕人的主人要來， <strong><mark>重重的處治他</mark></strong>，定他和假冒爲善的人同罪。<strong><mark>在那裏必要哀哭切齒了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/24/#L45-51">太 24:45-51</a>)</p></blockquote><blockquote><p>“主說：「<strong><mark>誰是那忠心有見識的管家</mark></strong>，主人派他管理家裏的人，按時分糧給他們呢？ 主人來到，看見僕人這樣行，那僕人就有福了。 我實在告訴你們：<strong><mark>主人要派他管理一切所有的</mark></strong>。 那僕人若心裏說『我的主人必來得遲』，就動手打僕人和使女，並且吃喝醉酒． 在他想不到的日子，不知道的時辰，那僕人的主人要來，<strong><mark>重重的處治他</mark></strong>，定他和不忠心的人同罪。 僕人知道主人的意思，卻不預備，又不順他的意思行，<strong><mark>那僕人必多受責打</mark></strong>； 惟有那不知道的，作了當受責打的事，<strong><mark>必少受責打</mark></strong>。因爲多給誰，就向誰多取；多托誰，就向誰多要。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L42-48">路 12:42-48</a>)</p></blockquote>
