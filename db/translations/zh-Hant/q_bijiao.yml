- src: о-мытаре-и-фарисее
  path: QPr3T_稅吏和法利賽人的比喻
  title: 稅吏和法利賽人的比喻
  copy_cover: true
  body: <blockquote><p>“說：「有兩個人上殿裏去禱告：<strong><mark>一個是法利賽人，一個是稅吏</mark></strong>。 法利賽人站著，自言自語的禱告說：『上帝啊，我感謝你，我不像別人勒索、不義、姦淫，也不像這個稅吏。 我一個禮拜禁食兩次，凡我所得的都捐上十分之一。』 <strong><mark>那稅吏遠遠的站著，連舉目望天也不敢</mark></strong>，只捶著胸說：『<strong><mark>上帝啊，開恩可憐我這個罪人</mark></strong>！』 我告訴你們：這人回家去比那人倒算爲義了。因爲<strong><mark>凡自高的，必降爲卑；自卑的，必升爲高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L10-14">路 18:10-14</a>)</p></blockquote>
