- src: притча-о-двух-сынах
  path: QPr5T_兩個兒子的比喻
  title: 兩個兒子的比喻
  copy_cover: true
  body: <blockquote><p>“又說：「<strong><mark>一個人有兩個兒子</mark></strong>，他來對大兒子說：『我兒，你今天到葡萄園裏去作工。』 他回答說：『<strong><mark>我不去』，以後自己懊悔，就去了</mark></strong>。 又來對小兒子也是這樣說。他回答說：『父阿，我去』，他卻不去。 你們想這兩個兒子，是那一個遵行父命呢？」他們說：「大兒子。」耶穌說：「<strong><mark>我實在告訴你們：稅吏和娼妓倒比你們先進上帝的國</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L28-31">太 21:28-31</a>)</p></blockquote>
