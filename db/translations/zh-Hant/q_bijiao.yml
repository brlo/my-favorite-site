- src: притча-о-званных-на-пир
  path: QPr7T_婚宴的比喻
  title: 婚宴的比喻
  copy_cover: true
  body: <blockquote><p>“「<strong><mark>天國好比一個王爲他兒子擺設娶親的筵席</mark></strong>， 就打發僕人去，請那些被召的人來赴席；<strong><mark>他們卻不肯來</mark></strong>。 王又打發別的僕人，說：『你們告訴那被召的人，我的筵席已經預備好了，牛和肥畜已經宰了，各樣都齊備．請你們來赴席。』 那些人不理就走了：一個到自己田裏去，一個作買賣去， 其餘的拿住僕人，凌辱他們，把他們殺了。 王就大怒，發兵除滅那些兇手，燒燬他們的城。 於是對僕人說：『喜筵已經齊備，只是<strong><mark>所召的人不配</mark></strong>。 所以你們要往岔路口上去，<strong><mark>凡遇見的，都召來赴席</mark></strong>。』 那些僕人就出去到大路上，凡遇見的，不論善惡都召聚了來，筵席上就坐滿了客。 王進來觀看賓客，見那裏有一個沒有穿禮服的， 就對他說：『朋友，你到這裏來，<strong><mark>怎麼不穿禮服呢</mark></strong>？』那人無言可答。 於是王對使喚的人說：『捆起他的手腳來，<strong><mark>把他丟在外邊的黑暗裏</mark></strong>．在那裏必要哀哭切齒了。』 <strong><mark>因爲被召的人多，選上的人少</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/22/#L2-14">太 22:2-14</a>)</p></blockquote>
