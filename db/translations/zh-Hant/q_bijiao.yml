- src: притча-о-работниках-в-винограднике
  path: QPr2T_葡萄園僱工的比喻
  title: 葡萄園僱工的比喻
  copy_cover: true
  body: <p>耶穌基督關於葡萄園中不同僱工得同樣工價的比喻：</p><blockquote><p>“因爲天國好像家主清早去僱人進他的葡萄園作工， <strong><mark>和工人講定一天一錢銀子</mark></strong>，就打發他們進葡萄園去。 約在巳初出去，看見市上還有閒站的人， 就對他們說：『你們也進葡萄園去，所當給的，我必給你們。』他們也進去了。 約在午正和申初又出去，也是這樣行。 約在酉初出去，看見還有人站在那裏，就問他們說：『你們爲什麼整天在這裏閒站呢？』 他們說：『因爲沒有人僱我們。』他說：『你們也進葡萄園去。』 到了晚上，園主對管事的說：『叫工人都來，給他們工錢，<strong><mark>從後來的起，到先來的爲止</mark></strong>。』 約在酉初僱的人來了，各人得了一錢銀子。 <strong><mark>及至那先僱的來了，他們以爲必要多得，誰知也是各得一錢</mark></strong>。 他們得了，就埋怨家主說： 『我們整天勞苦受熱，那後來的只做了一小時，你竟叫他們和我們一樣嗎？』 家主回答其中的一人說：『朋友，<strong><mark>我不虧負你</mark></strong>，你與我講定的不是一錢銀子嗎？ 拿你的走吧！我給那後來的和給你一樣，這是我願意的。 <strong><mark>我的東西難道不可隨我的意思用嗎？因爲我作好人，你就紅了眼嗎</mark></strong>？』 <strong><mark>這樣，那在後的將要在前；在前的將要在後了</mark></strong>〔有古卷在此有『因爲被召的人多，選上的人少』〕。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/20/#L1-16">太 20:1-16</a>)</p></blockquote>
