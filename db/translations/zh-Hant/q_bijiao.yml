- src: Притча_о_блудном_сына
  path: QPr6T_浪子的比喻
  title: 浪子的比喻
  copy_cover: true
  body: <blockquote><p>“耶穌又說：「<strong><mark>一個人有兩個兒子</mark></strong>。 小兒子對父親說：『父親，請你把我應得的家業分給我。』他父親就把產業分給他們。 過了不多幾日，小兒子就把他一切所有的都收拾起來，往遠方去了。在那裏<strong><mark>任意放蕩，浪費資財</mark></strong>。 既耗盡了一切所有的，又遇著那地方大遭饑荒，就窮苦起來。 於是去投靠那地方的一個人，那人打發他到田裏去放豬。 他恨不得拿豬所吃的豆莢充飢，也沒有人給他。 <strong><mark>他醒悟過來</mark></strong>，就說：『我父親有多少的僱工，口糧有餘，我倒在這裏餓死嗎？ 我要起來，到我父親那裏去，向他說：<strong><mark>父親！我得罪了天，又得罪了你</mark></strong>； 從今以後，我不配稱爲你的兒子，把我當作一個僱工吧！』 於是起來，往他父親那裏去。<strong><mark>相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項</mark></strong>，連連與他親嘴。 兒子說：『父親！我得罪了天，又得罪了你；從今以後，我不配稱爲你的兒子。』 父親卻吩咐僕人說：『把那上好的袍子快拿出來給他穿，把戒指戴在他指頭上，把鞋穿在他腳上， 把那肥牛犢牽來宰了，我們可以吃喝快樂。 <strong><mark>因爲我這個兒子是死而復活，失而又得的</mark></strong>。』他們就快樂起來。 那時，大兒子正在田裏。他回來，離家不遠，聽見作樂跳舞的聲音， 便叫過一個僕人來，問是什麼事。 僕人說：『你兄弟來了。你父親因爲得他無災無病的回來，把肥牛犢宰了！』 大兒子卻生氣，不肯進去。他父親就出來勸他。 他對父親說：『我服事你這多年，從來沒有違背過你的命，你並沒有給我一隻山羊羔，叫我和朋友一同快樂。 但你這個兒子和娼妓吞盡了你的產業，他一來了，你倒爲他宰了肥牛犢。』 父親對他說：『兒啊！你常和我同在，我一切所有的都是你的； <strong><mark>只是你這個兄弟是死而復活、失而又得的，所以我們理當歡喜快樂</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/15/#L11-32">路 15:11-32</a>)</p></blockquote>
  menu:
