- src: притча-об-овцах-и-козлах-по-разную-сторону-от-Господа
  path: QPr13T_綿羊和山羊的比喻
  title: 綿羊和山羊的比喻（分列在主左右）
  copy_cover: true
  body: <blockquote><p>“<strong><mark>當人子在他榮耀裏</mark></strong>，同著衆天使降臨的時候，<strong><mark>要坐在他榮耀的寶座上</mark></strong>。 <strong><mark>萬民都要聚集在他面前</mark></strong>。他要把他們分別出來，<strong><mark>好像牧羊的分別綿羊山羊一般</mark></strong>； 把綿羊安置在右邊，山羊在左邊。 於是，王要向那右邊的說：『<strong><mark>你們這蒙我父賜福的，可來承受那創世以來爲你們所預備的國</mark></strong>。 因爲<strong><mark>我餓了，你們給我吃</mark></strong>；渴了，你們給我喝；我作客旅，你們留我住； 我赤身露體，你們給我穿；我病了，你們看顧我；我在監裏，你們來看我。』 義人就回答說：『主啊，我們什麼時候見你餓了，給你吃，渴了，給你喝？ 什麼時候見你作客旅，留你住，或是赤身露體，給你穿？ 又什麼時候見你病了，或是在監裏，來看你呢？』 王要回答說：『我實在告訴你們：<strong><mark>這些事你們既作在我這弟兄中一個最小的身上，就是作在我身上了</mark></strong>。』 王又要向那左邊的說：『<strong><mark>你們這被咒詛的人，離開我</mark></strong>，進入那爲魔鬼和他的使者所預備的永火裏去！ 因爲我餓了，你們不給我吃；渴了，你們不給我喝； 我作客旅，你們不留我住；我赤身露體，你們不給我穿；我病了，我在監裏，你們不來看顧我。』 他們也要回答說：『主啊，我們什麼時候見你餓了，或渴了，或作客旅，或赤身露體，或病了，或在監裏，不伺候你呢？』 王要回答說：『我實在告訴你們：這些事你們既不作在我這弟兄中一個最小的身上，就是不作在我身上了。』 <strong><mark>這些人，要往永刑裏去</mark></strong>；<strong><mark>那些義人，要往永生裏去</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L31-46">太 25:31-46</a>)</p></blockquote>
