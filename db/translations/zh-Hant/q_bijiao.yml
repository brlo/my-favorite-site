  path: QPr1T_惡園戶的比喻
  title: 惡園戶的比喻
  copy_cover: true
  body: <p>耶穌基督關於惡園戶的比喻：</p><blockquote><p>“你們再聽一個比喻：<strong><mark>有個家主，栽了一個葡萄園</mark></strong>，周圍圈上籬笆，裏面挖了一個壓酒池，蓋了一座樓，租給園戶，就往外國去了。 收果子的時候近了，就打發僕人到園那戶裏去收果子。 <strong><mark>園戶拿住僕人，打了一個，殺了一個，用石頭打死一個</mark></strong>。 主人又打發別的僕人去，比先前更多，園戶還是照樣待他們。 後來打發他的兒子到他們那裏去，意思說：『他們必尊敬我的兒子。』 不料，園戶看見他兒子，就彼此說：『<strong><mark>這是承受產業的。來吧！我們殺他</mark></strong>，佔他的產業！』 他們就拿住他，推出葡萄園外殺了。 園主來的時候，要怎樣處治這些園戶呢？」 他們說：「<strong><mark>要下毒手除滅那些惡人</mark></strong>，將葡萄園另租給那按著時候交果子的園戶。」 &lt;…&gt; <strong><mark>祭司長和法利賽人聽見他的比喻，就看出他是指著他們說的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L33-41,45">太 21:33-41,45</a>)</p></blockquote>
