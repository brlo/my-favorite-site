- src: притча-о-трёх-рабах-и-талантах-5-2-1
  path: QPr12T_才幹的比喻
  title: 才幹的比喻（三個僕人與五千、二千、一千）
  copy_cover: true
  body: <blockquote><p>“天國又好比一個人要往外國去，就叫了僕人來，把他的家業交給他們， <strong><mark>按著各人的才幹，給他們銀子，一個給了五千，一個給了二千，一個給了一千</mark></strong>，就往外國去了。 那領五千的隨即拿去做買賣，另外賺了五千； 那領二千的也照樣另賺了二千； 但那領一千的去掘開地，把主人的銀子埋藏了。 過了許久，那些僕人的主人來了，和他們算賬。 <strong><mark>那領五千銀子的又帶著那另外的五千來</mark></strong>，說：『主啊，你交給我五千銀子。請看，我又賺了五千。』 主人說：『好！你這又良善又忠心的僕人，你在不多的事上有忠心，我要把許多事派你管理；可以進來享受你主人的快樂。』 <strong><mark>那領二千的也來</mark></strong>，說：『主啊，你交給我二千銀子，請看，我又賺了二千。』 主人說：『好！你這又良善又忠心的僕人，你在不多的事上有忠心，我要把許多事派你管理；可以進來享受你主人的快樂。』 那領一千的也來，說：『主啊，我知道你是忍心的人，沒有種的地方要收割，沒有散的地方要聚斂， 我就害怕，去把你的一千銀子埋藏在地裏。請看，你的原銀子在這裏。』 主人回答說：『<strong><mark>你這又惡又懶的僕人</mark></strong>！你既知道我沒有種的地方要收割，沒有散的地方要聚斂， 就當把我的銀子放給兌換銀錢的人，到我來的時候，可以連本帶利收回。 <strong><mark>奪過他這一千來，給那有一萬的</mark></strong>！ 因爲凡有的，還要加給他，叫他有餘；沒有的，連他所有的也要奪過來。 <strong><mark>把這無用的僕人丟在外面黑暗裏</mark></strong>，在那裏必要哀哭切齒了。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L14-30">太 25:14-30</a>)</p></blockquote>
