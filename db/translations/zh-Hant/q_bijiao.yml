- src: притча-о-десяти-девах-мудрых-и-неразумных
  path: QPr11T_十個童女的比喻
  title: 十個童女的比喻（聰明的和愚拙的）
  copy_cover: true
  body: <blockquote><p>“那時，天國好比十個童女拿著燈出去迎接新郎。 <strong><mark>其中有五個是愚拙的，五個是聰明的</mark></strong>。 <strong><mark>愚拙的拿著燈，卻不預備油</mark></strong>； <strong><mark>聰明的拿著燈，又預備油在器皿裏</mark></strong>。 新郎遲延的時候，她們都打盹睡著了。 半夜有人喊著說：『新郎來了，你們出來迎接他！』 那些童女就都起來收拾燈。 愚拙的對聰明的說：『請分點油給我們，因爲我們的燈要滅了。』 聰明的回答說：『恐怕不夠你我用的，不如你們自己到賣油的那裏去買吧！』 她們去買的時候，新郎到了．<strong><mark>那預備好了的，同他進去坐席，門就關了</mark></strong>。 其餘的童女隨後也來了，說：『主啊，主阿，給我們開門！』 他卻回答說：『我實在告訴你們：<strong><mark>我不認識你們</mark></strong>。』 所以，<strong><mark>你們要儆醒，因爲那日子、那時辰，你們不知道</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/25/#L1-13">太 25:1-13</a>)</p></blockquote>
