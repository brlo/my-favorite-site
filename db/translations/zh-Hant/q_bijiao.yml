- src: притча_о_богаче_и_Лазаре
  path: QPr9T_財主和拉撒路的比喻
  title: 財主和拉撒路的比喻
  copy_cover: true
  body: <blockquote><p>“<strong><mark>有一個財主，穿著紫色袍和細麻布衣服，天天奢華宴樂</mark></strong>。 <strong><mark>又有一個討飯的，名叫拉撒路</mark></strong>，渾身生瘡，被人放在財主門口， 要得財主桌子上掉下來的零碎充飢，並且狗來餂他的瘡。 <strong><mark>後來那討飯的死了，被天使帶去放在亞伯拉罕的懷裏</mark></strong>。財主也死了，並且埋葬了。 <strong><mark>他在陰間受痛苦</mark></strong>，舉目遠遠的望見亞伯拉罕，又望見拉撒路在他懷裏， 就喊著說：『我祖亞伯拉罕哪，可憐我吧！打發拉撒路來，用指頭尖蘸點水，涼涼我的舌頭，因爲我在這火焰裏，極其痛苦。』 亞伯拉罕說：『<strong><mark>兒啊，你該回想你生前享過福，拉撒路也受過苦</mark></strong>；如今他在這裏得安慰，你倒受痛苦。 不但這樣，並且<strong><mark>在你我之間，有深淵限定</mark></strong>，以致人要從這邊過到你們那邊是不能的；要從那邊過到我們這邊也是不能的。』 財主說：『我祖啊！既是這樣，求你打發拉撒路到我父家去， 因爲我還有五個弟兄，他可以對他們作見證，免得他們也來到這痛苦的地方。』 亞伯拉罕說：『他們有摩西和先知的話可以聽從。』 他說：『我祖亞伯拉罕哪，不是的．若有一個從死裏復活的，到他們那裏去的，他們必要悔改。』 亞伯拉罕說：『<strong><mark>若不聽從摩西和先知的話</mark></strong>，就是有一個從死裏復活的，他們也是不聽勸。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/16/#L19-31">路 16:19-31</a>)</p></blockquote>
