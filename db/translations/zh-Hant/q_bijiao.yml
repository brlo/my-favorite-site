- src: о_милосердном_самарянине
  path: QPr4T_好撒瑪利亞人的比喻
  title: 好撒瑪利亞人的比喻
  copy_cover: true
  body: <blockquote><p>“那人要顯明自己有理，就對耶穌說：「<strong><mark>誰是我的鄰舍呢</mark></strong>？」 耶穌回答說：「有一個人從耶路撒冷下耶利哥去，落在強盜手中。他們剝去他的衣裳，把他打個半死，就丟下他走了。 偶然有一個祭司從這條路下來，看見他就從那邊過去了。 又有一個利未人來到這地方，看見他，也照樣從那邊過去了。 <strong><mark>惟有一個撒瑪利亞人行路來到那裏，看見他就動了慈心</mark></strong>， 上前用油和酒倒在他的傷處，包裹好了，扶他騎上自己的牲口，帶到店裏去照應他。 第二天拿出二錢銀子來，交給店主，說：『你且照應他．此外所費用的，我回來必還你。』 <strong><mark>你想，這三個人哪一個是落在強盜手中的鄰舍呢</mark></strong>？」 他說：「<strong><mark>是憐憫他的</mark></strong>。」耶穌說：「<strong><mark>你去照樣行吧</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L29-37">路 10:29-37</a>)</p></blockquote>
  menu:
