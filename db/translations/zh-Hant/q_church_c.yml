  references: "<p>翻譯：羅季翁·弗拉索夫（借助人工智能工具）。底本：俄文原文。參考：英文、日文翻譯。聖經鏈接指向本站的和合本（上帝版）；次經書卷引文按思高譯本，無中文經文處自俄文譯出。</p>"
- src: отцами_и_учителями_не_называться
  path: Qc13A_不可稱呼人爲師、爲父
  title: 不可稱呼人爲師、爲父
  copy_cover: true
  body: <h2>基督命令不要稱呼人爲師、爲父</h2><blockquote><p>“說：「文士和法利賽人坐在摩西的位上， &lt;…&gt; 他們一切所作的事都是要叫人看見，所以將佩戴的經文做寬了，衣裳的繸子做長了； <strong>喜愛筵席上的首座，會堂裏的高位</strong>； 又喜愛人在街市上問他安，<strong>稱呼他拉比</strong>。 <strong><mark>但你們不要受拉比的稱呼</mark></strong>，因爲只有一位是你們的夫子，你們都是弟兄； <strong><mark>也不要稱呼地上的人爲父</mark></strong>．因爲只有一位是你們的父，就是在天上的父；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L2,5-9">太 23:2,5-9</a>)</p></blockquote><p>這話不能按字面理解，正如關於截去肢體的話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L29-30">太 5:29-30</a>），以及基督說他來不是叫地上太平、乃是叫地上動刀兵的話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L34-35">太 10:34-35</a>）不能按字面理解一樣。這裏教導的是謙卑：使信徒不去追求被人稱呼“拉比、拉比”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/23/#L7">太 23:7</a>），得到這些稱呼之後也不驕傲自高，而要明白：至高的權柄、真正的父和師傅——是上帝。</p><p>重要的是從上下文出發正確理解這話的意思，否則就會得出連孩子也不能稱呼自己的父親爲父的結論，儘管上帝在誡命里正是這樣稱呼他們的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L16">申 5:16</a>）。同樣，也不能說任何教師都不可以稱爲教師，儘管教會裏毫無疑問有教師。從聖經我們看到，使徒們並沒有迴避這些稱呼。</p><h2>教師</h2><h3>基督稱法利賽人尼哥底母爲以色列人的先生</h3><blockquote><p>“耶穌回答說：「<strong><mark>你是以色列人的先生</mark></strong>，還不明白這事麼？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/3/#L10">約 3:10</a>)</p></blockquote><h3>使徒說自己被立爲教師</h3><blockquote><p>“<strong><mark>我爲這福音奉派作傳道的，作使徒，作師傅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2tim/1/#L11">提後 1:11</a>)</p></blockquote><blockquote><p>“他舍自己作萬人的贖價，到了時候，這事必證明出來。 <strong><mark>我</mark></strong>爲此奉派作傳道的，作使徒，<strong><mark>作外邦人的師傅</mark></strong>，教導他們相信，學習真道。我說的是真話，並不是謊言。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L6-7">提前 2:6-7</a>)</p></blockquote><h3>上帝在教會裏立了教師</h3><blockquote><p>“<strong><mark>上帝在教會</mark></strong>所設立的：第一是使徒，第二是先知，第三是<strong><mark>教師</mark></strong>，其次是行異能的，再次是得恩賜醫病的，幫助人的，治理事的，說方言的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/12/#L28">林前 12:28</a>)</p></blockquote><blockquote><p>“<strong><mark>他</mark></strong><strong><mark>所賜的有</mark></strong>使徒，有先知，有傳福音的，有牧師和<strong><mark>教師</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/4/#L11">弗 4:11</a>)</p></blockquote><blockquote><p>“或作執事，就當專一執事；<strong><mark>或作教導的，就當專一教導</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L7">羅 12:7</a>)</p></blockquote><blockquote><p>“看你們學習的工夫，<strong><mark>本該作師傅</mark></strong>，誰知還得有人將上帝聖言小學的開端另教導你們，並且成了那必須吃奶、不能吃乾糧的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/5/#L12">希 5:12</a>)</p></blockquote><h3>對教師之責任的警告</h3><blockquote><p>“我的弟兄們，<strong><mark>不要多人作師傅，因爲曉得我們要受更重的判斷</mark></strong>。 原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/3/#L1-2">雅 3:1-2</a>)</p></blockquote><h2>父</h2><h3>基督應許有父</h3><blockquote><p>“耶穌說：「我實在告訴你們：<strong>人爲我和福音撇下房屋，或是弟兄、姊妹、父母、兒女、田地</strong>， <strong>沒有不在今世得百倍的</strong>，就是房屋、弟兄、姊妹、母親、兒女、田地，並且要受逼迫；在來世必得永生。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L29-30">可 10:29-30</a>) <em>(和合本百倍的賞賜清單中無「父親」一詞。)</em></p></blockquote><h3>使徒稱自己爲父，稱信徒爲兒女</h3><blockquote><p>“我寫這話，不是叫你們羞愧，乃是警戒你們，好像<strong><mark>我所親愛的兒女</mark></strong>一樣。 你們學基督的，師傅雖有一萬，<strong><mark>爲父的卻是不多</mark></strong>，<strong><mark>因我在基督耶穌裏用福音生了你們</mark></strong>。 &lt;…&gt; 因此我已打發提摩太到你們那裏去；他在主裏面，是<strong><mark>我所親愛</mark></strong>、<strong><mark>有忠心的兒子</mark></strong>。他必提醒你們，記念我在基督裏怎樣行事，在各處各教會中怎樣教導人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/4/#L14-15,17">林前 4:14-15,17</a>)</p></blockquote><blockquote><p>“<strong><mark>我小子啊</mark></strong>，<strong>我爲你們再受生產之苦</strong>，直等到基督成形在你們心裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L19">加 4:19</a>)</p></blockquote><blockquote><p>“<strong><mark>我小子們哪</mark></strong>，我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裏我們有一位中保，就是那義者耶穌基督。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L1">約壹 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>小子們哪</mark></strong>，我們相愛，不要只在言語和舌頭上，總要在行爲和誠實上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L18">約壹 3:18</a>)</p></blockquote><blockquote><p>“我聽見<strong><mark>我的兒女們</mark></strong>按真理而行，我的喜樂就沒有比這個大的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3in/1/#L4">約叁 1:4</a>)</p></blockquote><blockquote><p>“就是爲我<strong>在捆鎖中所生的</strong><strong><mark>兒子</mark></strong>阿尼西母求你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fm/1/#L10">門 1:10</a>)</p></blockquote><h3>亞伯拉罕——信徒的父</h3><blockquote><p>“所以人得爲後嗣是本乎信．因此就屬乎恩，叫應許定然歸給一切後裔，不但歸給那屬乎律法的，也歸給那效法亞伯拉罕之信的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/4/#L16">羅 4:16</a>) <em>(俄文原文此節有“亞伯拉罕——我們衆人的父”，和合本無)</em></p></blockquote><blockquote><p>“所以你們要知道，<strong>那以信爲本的人，就是亞伯拉罕的子孫</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/3/#L7">加 3:7</a>)</p></blockquote><blockquote><p>“亞伯蘭年九十九歲的時候，耶和華向他顯現，對他說：「我是全能的上帝，你當在我面前作完全人。 &lt;…&gt; 「我與你立約，<strong><mark>你要作多國的父</mark></strong>。 從此以後，你的名不再叫亞伯蘭，要叫亞伯拉罕，因爲<strong>我已立你作多國的父</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/17/#L1,4-5">創 17:1,4-5</a>)</p></blockquote><blockquote><p>“並且他受了割禮的記號，作他未受割禮的時候因信稱義的印證，<strong><mark>叫他作一切未受割禮而信之人的父</mark></strong>，使他們也算爲義； 又作受割禮之人的父，就是那些不但受割禮，並且<strong>按我們的祖宗亞伯拉罕</strong>，未受割禮而信之蹤跡去行的人。 &lt;…&gt; 亞伯拉罕所信的，是那叫死人復活、使無變爲有的上帝，他在主面前作我們世人的父。如經上所記：『<strong><mark>我已經立你作多國的父</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/4/#L11-12,17">羅 4:11-12,17</a>)</p></blockquote><h3>上帝賜下關於父親的誡命</h3><blockquote><p>“<strong><mark>當孝敬父母</mark></strong>，使你的日子在耶和華你上帝所賜你的地上得以長久。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/20/#L12">出 20:12</a>)</p></blockquote><blockquote><p>“<strong><mark>當照耶和華你上帝所吩咐的孝敬父母</mark></strong>，<strong>使你得福</strong>。並使你的日子，在耶和華你上帝所賜你的地上得以長久。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/5/#L16">申 5:16</a>)</p></blockquote><blockquote><p>“誡命你是曉得的：不可殺人，不可姦淫，不可偷盜，不可作假見證，不可虧負人，<strong><mark>當孝敬父母</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/10/#L19">可 10:19</a>)</p></blockquote><blockquote><p>“<strong><mark>要孝敬父母</mark></strong>，使你得福，在世長壽。這是第一條帶應許的誡命。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L2">弗 6:2</a>)</p></blockquote><h3>使徒稱呼父老們</h3><blockquote><p>“<strong><mark>你們作父親的</mark></strong>，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L4">弗 6:4</a>)</p></blockquote><blockquote><p>“<strong><mark>你們作父親的</mark></strong>，不要惹兒女的氣，恐怕他們失了志氣。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L21">西 3:21</a>)</p></blockquote><blockquote><p>“<strong><mark>父老啊，我寫信給你們</mark></strong>，因爲你們認識那從起初原有的。少年人哪，我寫信給你們，因爲你們勝了那惡者。小子們哪，我曾寫信給你們，因爲你們認識父。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/2/#L13">約壹 2:13</a>)</p></blockquote><h2>上帝甚至允許人在正確的意義上被稱爲神（不是按本性，而是按恩典）</h2><blockquote><p>“我曾說：『<strong>你們是神</strong>，都是至高者的兒子。』 然而你們要死，與世人一樣；要仆倒，像王子中的一位。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/82/#L6-7">詩 82:6-7</a>)</p></blockquote><blockquote><p>“耶穌說：「你們的律法上豈不是寫著『我曾說<strong>你們是神</strong>』麼？ 經上的話是不能廢的；若那些承受上帝道的人，尚且稱爲神，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/10/#L34-35">約 10:34-35</a>)</p></blockquote><p>然而，基督命令稱自己爲無用的僕人（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/17/#L10">路 17:10</a>）。</p><h2>相似的主題</h2><p>關於反駁稱基督徒爲上帝之奴僕的說法：<a href="https://bibleox.com/ru/ru/w/христианин-раб-Бога">基督徒——上帝的僕人</a></p>
