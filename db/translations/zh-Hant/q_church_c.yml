- src: анания-и-сапфира
  path: Qc14A_亞拿尼亞與撒非喇
  title: 亞拿尼亞與撒非喇
  copy_cover: true
  body: <p>在教會生活的初期，主特別嚴格地看顧教會中生活的純潔。比如，因爲企圖向教會說謊，一對夫妻（亞拿尼亞與撒非喇）因使徒的一句話當場倒斃：</p><blockquote><p>“有一個人，名叫<strong>亞拿尼亞</strong>，同他的妻子<strong>撒非喇</strong>賣了田產， <strong><mark>把價銀私自留下幾分</mark></strong>，他的妻子也知道，其餘的幾分拿來放在使徒腳前。 彼得說：「亞拿尼亞，<strong><mark>爲什麼撒但充滿了你的心，叫你欺哄聖靈，把田地的價銀私自留下幾分呢</mark></strong>？ 田地還沒有賣，不是你自己的嗎？既賣了，價銀不是你作主嗎？你怎麼心裏起這意念呢？<strong><mark>你不是欺哄人，是欺哄上帝了</mark></strong>！」 <strong><mark>亞拿尼亞聽見這話，就仆倒，斷了氣</mark></strong>。聽見的人都甚懼怕。 有些少年人起來，把他包裹，抬出去埋葬了。 約過了三小時，他的妻子進來，還不知道這事。 彼得對她說：「你告訴我，你們賣田地的價銀就是這些嗎？」她說：「就是這些。」 彼得說：「你們爲甚麼同心試探主的靈呢？埋葬你丈夫之人的腳已到門口，他們也要把你抬出去。」 <strong><mark>婦人立刻仆倒在彼得腳前，斷了氣</mark></strong>。<strong><mark>那些少年人進來，見他已經死了，就抬出去，埋在她丈夫旁邊</mark></strong>。 全教會和聽見這事的人都甚懼怕。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L1-11">徒 5:1-11</a>)</p></blockquote><p>舊約的教會也是這樣。在這個教會生活的初期，有人因干犯安息日的安息而被處死：</p><blockquote><p>“以色列人在曠野的時候，<strong><mark>遇見一個人在安息日撿柴</mark></strong>。 遇見他撿柴的人。就把他帶到摩西、亞倫並全會衆那裏， 將他收在監內，因爲當怎樣辦他，還沒有指明。 耶和華吩咐摩西說：「<strong><mark>總要把那人治死</mark></strong>，全會衆要在營外用石頭把他打死。」 於是全會衆將他帶到營外，用石頭打死他，是照耶和華所吩咐摩西的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/15/#L32-36">民 15:32-36</a>)</p></blockquote><p>後來猶太人雖然屢次干犯安息日（<a href="https://bibleox.com/zh-Hant/cn-cuvt/neem/13/#L15-16,18">尼 13:15-16,18</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/20/#L13,16,21,24">結 20:13,16,21,24</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/22/#L8">結 22:8</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/23/#L38">結 23:38</a>），連祭司也一樣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/iez/22/#L26">結 22:26</a>），但代替立即處死的，卻是制止干犯安息日的嘗試：</p><blockquote><p>“在安息日的前一日，耶路撒冷城門有黑影的時候，<strong>我就吩咐人將門關鎖，不過安息日不準開放</strong>。我又派我幾個僕人管理城門，<strong><mark>免得有人在安息日擔什麼擔子進城</mark></strong>。 於是商人和販賣各樣貨物的，一兩次住宿在耶路撒冷城外。 我就警戒他們說：「你們爲何在城外住宿呢？若再這樣，我必下手拿辦你們。」從此以後，他們在安息日不再來了。 <strong>我吩咐利未人潔淨自己，來守城門，使安息日爲聖</strong>。我的上帝啊，求你因這事記念我，照你的大慈愛憐恤我。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/neem/13/#L19-22">尼 13:19-22</a>)</p></blockquote><blockquote><p>“耶和華對我如此說：「<strong><mark>你去站在平民的門口</mark></strong>，就是猶大君王出入的門，又站在耶路撒冷的各門口， 對他們說：『你們這猶大君王和猶大衆人，並耶路撒冷的一切居民，凡從這些門進入的，<strong>都當聽耶和華的話</strong>。 耶和華如此說：<strong><mark>你們要謹慎，不要在安息日擔什麼擔子進入耶路撒冷的各門</mark></strong>； <strong><mark>也不要在安息日從家中擔出擔子去</mark></strong>。無論何工都不可作，只要以安息日爲聖日，正如我所吩咐你們列祖的。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/17/#L19-22">耶 17:19-22</a>)</p></blockquote>
  meta_desc: 關於對亞拿尼亞與撒非喇之刑罰的理解的聖經引文
