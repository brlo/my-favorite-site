  path: Qc17T_再婚
  title: 再婚
  copy_cover: true
  body: <h2>基督徒的理想</h2><p>基督徒的理想——一生只有一個婚姻。</p><h2>對平信徒的寬免</h2><p>如果妻子或丈夫死了，雖然新的婚姻不受鼓勵（因爲基督徒相信來生和死人普遍的復活），但作爲寬免的措施是允許的——使徒說過這一點，爲的是不叫人陷入某種致死的重罪而徹底滅亡：</p><blockquote><p>“我對著沒有嫁娶的和<strong>寡婦</strong>說，若他們常像我就好。 倘若自己禁止不住，就可以嫁娶。<strong><mark>與其慾火攻心，倒不如嫁娶爲妙</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/7/#L8-9">林前 7:8-9</a>)</p></blockquote><blockquote><p>“所以<strong>我願意年輕的寡婦嫁人</strong>，生養兒女，治理家務，不給敵人辱罵的把柄，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/5/#L14">提前 5:14</a>)</p></blockquote><p>同樣，救主在論到不可離婚時，也爲了淫亂（變心）的情形開了例外：</p><blockquote><p>“又有話說：『人若休妻，就當給他休書。』 只是我告訴你們：凡休妻的，<strong>若不是爲淫亂的緣故</strong>，就是叫他作淫婦了；人若娶這被休的婦人，也是犯奸淫了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L31-32">太 5:31-32</a>)</p></blockquote><p>這樣，如果配偶死了或變了心，新的婚姻是可能的。但仍然不是無限制的，而只是作爲寬免的措施，總共只可以有兩次。</p><p>循著類似的推理，教會又爲此加上了一些別的原因，例如配偶有生命危險等等（[俄文](https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/#0_10_3)）。</p><h2>司祭應當從只結過一次婚的男士中揀選</h2><p>值得講一講這一點，爲要看到：守住一個婚姻，確實被認爲更是配得的生活方式：</p><blockquote><p>“<strong>作監督的，必須無可指責，只作一個婦人的丈夫</strong>，有節制，自守，端正，樂意接待遠人，善於教導；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L2">提前 3:2</a>)</p></blockquote><blockquote><p>“<strong>執事只要作一個婦人的丈夫</strong>，好好管理兒女和自己的家。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L12">提前 3:12</a>)</p></blockquote><blockquote><p>“我從前留你在革哩底，是要你將那沒有辦完的事都辦整齊了，又照我所吩咐你的，<strong>在各城設立長老</strong>。 <strong>若有無可指責的人，只作一個婦人的丈夫</strong>，兒女也是信主的，沒有人告他們是放蕩不服約束的，就可以設立。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L5-6">多 1:5-6</a>)</p></blockquote>
