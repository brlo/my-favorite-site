  body: <h2>主耶穌基督在登山寶訓中賜下的九條真福</h2><ol><li><p>“<strong>虛心的人</strong>有福了，因爲天國是他們的。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L3">太 5:3</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L20">路 6:20</a>）</p></li><li><p>“<strong>哀慟的人</strong>有福了，因爲他們必得安慰。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L4">太 5:4</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L21">路 6:21</a>）</p></li><li><p>“<strong>溫柔的人</strong>有福了，因爲他們必承受地土。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L5">太 5:5</a>）</p></li><li><p>“<strong>飢渴慕義的人</strong>有福了，因爲他們必得飽足。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L6">太 5:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L21">路 6:21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L25">路 6:25</a>）</p></li><li><p>“<strong>憐恤人的人</strong>有福了，因爲他們必蒙憐恤。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L7">太 5:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L24">路 6:24</a>）</p></li><li><p>“<strong>清心的人</strong>有福了，因爲他們必得見上帝。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L8">太 5:8</a>）</p></li><li><p>“<strong>使人和睦的人</strong>有福了，因爲他們必稱爲上帝的兒子。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L9">太 5:9</a>）</p></li><li><p>“<strong>爲義受逼迫的人</strong>有福了，因爲天國是他們的。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L10">太 5:10</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L22">路 6:22</a>）</p></li><li><p>“<strong>人若因我辱罵你們，逼迫你們，捏造各樣壞話毀謗你們</strong>，你們就有福了。應當歡喜快樂，因爲你們在天上的賞賜是大的。在你們以前的先知，人也是這樣逼迫他們。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L11-12">太 5:11-12</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L22-23">路 6:22-23</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L26">路 6:26</a>）</p></li></ol><h2>附帶的誡命</h2><ol><li><p>“<strong>你們的仇敵，要愛他</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L27">路 6:27</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>恨你們的，要待他好</strong>！”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L27">路 6:27</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>咒詛你們的，要爲他祝福</strong>！”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L28">路 6:28</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>凌辱你們的，要爲他禱告</strong>！”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L28">路 6:28</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L44">太 5:44</a>）</p></li><li><p>“<strong>有人打你這邊的臉，連那邊的臉也由他打</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L29">路 6:29</a>）</p></li><li><p>“<strong>有人奪你的外衣，連裏衣也由他拿去</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L29">路 6:29</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L40">太 5:40</a>）</p></li><li><p>“<strong>凡求你的，就給他</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L30">路 6:30</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L38">路 6:38</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L42">太 5:42</a>）</p></li><li><p>“<strong>有人奪你的東西去，不用再要回來</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L30">路 6:30</a>）</p></li><li><p>“<strong>你們願意人怎樣待你們，你們也要怎樣待人</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L31">路 6:31</a>）</p></li><li><p>“<strong>你們要慈悲，像你們的父慈悲一樣</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L36">路 6:36</a>）</p></li><li><p>“<strong>你們不要論斷人，就不被論斷</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L37">路 6:37</a>）</p></li><li><p>“<strong>你們不要定人的罪，就不被定罪</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L37">路 6:37</a>）</p></li><li><p>“<strong>你們要饒恕人，就必蒙饒恕</strong>”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L37">路 6:37</a>）</p></li><li><p>“<strong>你們要給人，就必有給你們的</strong>，並且用十足的升斗，連搖帶按，上尖下流地倒在你們懷裏；因爲你們用什麼量器量給人，也必用什麼量器量給你們。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L38">路 6:38</a>）</p></li><li><p>“爲什麼看見你弟兄眼中有刺，卻不想自己眼中有梁木呢？你不見自己眼中有梁木，怎能對你弟兄說‘容我去掉你眼中的刺’呢？你這假冒爲善的人！<strong>先去掉自己眼中的梁木</strong>，然後才能看得清楚，去掉你弟兄眼中的刺。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L41-42">路 6:41-42</a>）</p></li><li><p>“你們聽見有吩咐古人的話，說：『不可殺人』，又說，『凡殺人的，難免受審判。』只是我告訴你們：<strong>凡向弟兄動怒的，難免受審判</strong>〔有古卷在『凡』字下添『無緣無故的』五字〕。凡罵弟兄是拉加的，難免公會的審斷；凡罵弟兄是魔利的，難免地獄的火。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L21-22">太 5:21-22</a>）</p></li><li><p>“所以，你在祭壇上獻禮物的時候，若想起弟兄向你懷怨，就把禮物留在壇前，<strong>先去同弟兄和好</strong>，然後來獻禮物。<strong>就趕緊與他和息</strong>，恐怕他把你送給審判官，審判官交付衙役，你就下在監裏了。我實在告訴你：若有一文錢沒有還清，你斷不能從那裏出來。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L23-26">太 5:23-26</a>）</p></li><li><p>“你們聽見有話說：『不可姦淫。』只是我告訴你們：<strong>凡看見婦女就動淫念的，這人心裏已經與他犯奸淫了</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L27-28">太 5:27-28</a>）</p></li><li><p>“又有話說：『人若休妻，就當給他休書。』只是我告訴你們：<strong>凡休妻的，若不是爲淫亂的緣故，就是叫他作淫婦了</strong>；<strong>人若娶這被休的婦人，也是犯奸淫了</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L31-32">太 5:31-32</a>）</p></li><li><p>“你們又聽見有吩咐古人的話，說：『不可背誓，所起的誓，總要向主謹守。』只是我告訴你們：<strong>什麼誓都不可起</strong>。不可指著天起誓，因爲天是上帝的座位；不可指著地起誓，因爲地是他的腳凳；也不可指著耶路撒冷起誓，因爲耶路撒冷是大君的京城；又不可指著你的頭起誓，因爲你不能使一根頭發變黑變白了。你們的話，是，就說是；不是，就說不是；若再多說，就是出於那惡者。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L33-37">太 5:33-37</a>）</p></li><li><p>“你們聽見有話說：『以眼還眼，以牙還牙。』只是我告訴你們：<strong>不要與惡人作對</strong>。有人打你的右臉，連左臉也轉過來由他打；有人想要告你，要拿你的裏衣，連外衣也由他拿去；有人強逼你走一里路，你就同他走二里；有求你的，就給他；有向你借貸的，不可推辭。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L38-42">太 5:38-42</a>）</p></li><li><p>“<strong>所以你們要完全，像你們的天父完全一樣</strong>。”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L48">太 5:48</a>）</p></li></ol>
