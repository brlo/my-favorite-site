- src: отношение-Церкви-к-государству
  path: Qc12A_教會與國家（掌權者）的關係
  title: 教會與國家（掌權者）的關係
  copy_cover: true
  body: <h2>爲掌權者祈禱</h2><blockquote><p>“我勸你第一要爲萬人懇求、<strong><mark>禱告</mark></strong>、代求、祝謝， <strong><mark>爲君王和一切在位的</mark></strong>，也該如此，使我們可以敬虔、端正，平安無事的度日。 這是好的，在上帝我們救主面前可蒙悅納。 他願意萬人得救，明白真道。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/2/#L1-4">提前 2:1-4</a>)</p></blockquote><h2>順服國家的掌權者</h2><blockquote><p>“你要提醒衆人，叫他們<strong><mark>順服作官的、掌權的</mark></strong>，遵他的命，預備行各樣的善事。 不要毀謗，不要爭競，總要和平，<strong>向衆人大顯溫柔</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/3/#L1-2">多 3:1-2</a>)</p></blockquote><blockquote><p>“你們<strong><mark>爲主的緣故</mark></strong>，要<strong><mark>順服人的一切制度</mark></strong>，或是<strong><mark>在上的</mark></strong><strong><mark>君王</mark></strong>， 或是君王所派罰惡賞善的<strong><mark>臣宰</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L13-14">彼前 2:13-14</a>)</p></blockquote><blockquote><p>“務要尊敬衆人，親愛教中的弟兄，敬畏上帝，<strong><mark>尊敬君王</mark></strong>。 你們作僕人的，<strong>凡事要存敬畏的心順服主人</strong>；<strong>不但順服那善良溫和的，就是那乖僻的也要順服</strong>。 倘若人爲叫良心對得住上帝，就忍受冤屈的苦楚，<strong>這是可喜愛的</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/2/#L17-19">彼前 2:17-19</a>)</p></blockquote><blockquote><p>“保羅說：「弟兄們，我不曉得他是大祭司。經上記著說：『<strong><mark>不可毀謗你百姓的官長</mark></strong>。』」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/23/#L5">徒 23:5</a>)</p></blockquote><blockquote><p>“又如所多瑪、蛾摩拉，和周圍城邑的人，也照他們一味的行淫，隨從逆性的情欲，就受永火的刑罰，作爲鑑戒。 這些作夢的人也像他們污穢身體，<strong><mark>輕慢主治的，毀謗在尊位的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iud/1/#L7-8">猶 1:7-8</a>)</p></blockquote><p>沒有權柄不是出於上帝的，現有的權柄是上帝所立的——<strong>使徒這樣說時，正身處異教崇拜盛行的羅馬帝國</strong>：</p><blockquote><p>“<strong>在上有權柄的，人人當順服他</strong>，<strong>因爲沒有權柄不是出於上帝的</strong>，<strong><mark>凡掌權的都是上帝所命的</mark></strong>。 所以抗拒掌權的，就是抗拒上帝的命；抗拒的必自取刑罰。 作官的原不是叫行善的懼怕，乃是叫作惡的懼怕。你願意不懼怕掌權的嗎？你只要行善，就可得他的稱讚． 因爲他是<strong>上帝的用人</strong>，是與你有益的。你若作惡，卻當懼怕，因爲他不是空空的佩劍。他是上帝的用人，是伸冤的，刑罰那作惡的。 <strong>所以你們必須順服</strong>，不但是因爲刑罰，也是因爲良心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/13/#L1-5">羅 13:1-5</a>)</p></blockquote><p>基督指出，彼拉的權柄是從上頭來的：</p><blockquote><p>“耶穌回答說：「<strong><mark>若不是從上頭賜給你的，你就毫無權柄辦我</mark></strong>，所以把我交給你的那人，罪更重了。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/19/#L11">約 19:11</a>)</p></blockquote><h2>順服國家掌權者的界限</h2><blockquote><p>“彼得、約翰說：「<strong><mark>聽從你們，不聽從上帝，這在上帝面前合理不合理</mark></strong>，你們自己酌量吧！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/4/#L19">徒 4:19</a>)</p></blockquote><blockquote><p>“彼得和衆使徒回答說：「<strong><mark>順從上帝，不順從人，是應當的</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/5/#L29">徒 5:29</a>)</p></blockquote><h2>納稅</h2><blockquote><p>“你們<strong>納糧</strong>也爲這個緣故，因他們是上帝的差役，常常特管這事。 <strong>凡人所當得的，就給他</strong>；當得糧的，給他納糧；當得稅的，給他上稅；當懼怕的，懼怕他；當恭敬的，恭敬他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/13/#L6-7">羅 13:6-7</a>)</p></blockquote><h2>舊約</h2><blockquote><p>“<strong>我兒，你要敬畏耶和華與君王</strong>，不要與反覆無常的人結交，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/24/#L21">箴 24:21</a>)</p></blockquote><h3>上帝“僱用”外邦的王來施行懲罰</h3><blockquote><p>“<strong>耶和華必使亞述王</strong>攻擊你的日子臨到你和你的百姓並你的父家。自從以法蓮離開猶大以來，未曾有這樣的日子。 &lt;…&gt; 那時，<strong><mark>主必用大河外賃的剃頭刀</mark></strong>，就是亞述王，剃去頭髮和腳上的毛，並要剃淨鬍鬚。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/7/#L17,20">賽 7:17,20</a>)</p></blockquote><h3>上帝命令猶太民族順服巴比倫王尼布甲尼撒</h3><blockquote><p>“現在我將這些地都交給<strong><mark>我僕人巴比倫王尼布甲尼撒</mark></strong>的手，我也將田野的走獸給他使用。 列國都必服事他和他的兒孫，直到他本國遭報的日期來到。那時，多國和大君王要使他作他們的奴僕。 無論哪一邦哪一國，不肯服事這巴比倫王尼布甲尼撒，也不把頸項放在巴比倫王的軛下，<strong>我必用刀劍、饑荒、瘟疫刑罰那邦</strong>，直到我<strong><mark>藉巴比倫王的手將他們毀滅</mark></strong>。這是耶和華說的。 至於你們，不可聽從你們的先知和占卜的、圓夢的、觀兆的以及行邪術的。他們告訴你們說：你們不至服事巴比倫王。 他們向你們說假預言，要叫你們遷移，遠離本地，以致我將你們趕出去，使你們滅亡。 但哪一邦肯把頸項放在巴比倫王的軛下服事他，<strong>我必使那邦仍在本地存留</strong>，得以耕種居住。這是耶和華說的。』」 我就照這一切的話，對猶大王西底家說：「<strong><mark>要把你們的頸項放在巴比倫王的軛下，服事他和他的百姓，便得存活</mark></strong>。 你和你的百姓爲何要因刀劍、饑荒、瘟疫死亡，正如耶和華論到不服事巴比倫王的那國說的話呢？ 不可聽那些先知對你們所說的話。他們說『你們不至服事巴比倫王』，其實他們向你們說假預言。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/27/#L6-14">耶 27:6-14</a>)</p></blockquote><p>而巴比倫王尼布甲尼撒當然是拜偶像的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/3/#L1-6">但 3:1-6</a>）。順服他，意味著承認他在外在的、世界的事物——土地、財富等等——之上的世俗權柄。當尼布甲尼撒開始強迫猶太人拜偶像時，被拒絕的恰恰是他這個違揹上帝的命令：</p><blockquote><p>“尼布甲尼撒問他們說：「沙得拉、米煞、亞伯尼歌，<strong>你們不事奉我的神，也不敬拜我所立的金像</strong>，是故意的嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/3/#L14">但 3:14</a>)</p></blockquote><p>他們承認他是王，但拒絕服從：</p><blockquote><p>“沙得拉、米煞、亞伯尼歌對王說：「<strong>尼布甲尼撒啊</strong>，這件事我們不必回答你。 即便如此，我們所事奉的上帝，能將我們從烈火的窯中救出來。<strong><mark>王</mark></strong>啊，他也必救我們脫離你的手； 即或不然，<strong><mark>王</mark></strong>啊，你當知道<strong><mark>我們決不事奉你的神，也不敬拜你所立的金像</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/3/#L16-18">但 3:16-18</a>)</p></blockquote><p>爲此他們被扔進窯裏：</p><blockquote><p>“這三人穿著褲子、內袍、外衣和別的衣服，被捆起來扔在烈火的窯中。 因爲王命緊急，窯又甚熱，那抬沙得拉、米煞、亞伯尼歌的人都被火焰燒死。 沙得拉、米煞、亞伯尼歌這三個人都<strong>被捆著落在烈火的窯中</strong>。 那時，尼布甲尼撒王驚奇，急忙起來，對謀士說：「我捆起來扔在火裏的不是三個人嗎？」他們回答王說：「王啊，是。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/3/#L21-24">但 3:21-24</a>) <em>(俄文原文3:24（七十士譯本）有“他們在火中游行，歌頌上帝、稱頌上主”一句，和合本無)</em></p></blockquote><p>而上帝的天使保守他們毫髮無損：</p><blockquote><p>“<strong>但是上主的天使降到窯中，來到阿匝黎雅及他同伴身旁，把窯中的火焰推出，使窯中彷彿吹起清涼的微風，火焰不但不能接近他們，且也不能給他們招來什麼痛苦或煩惱。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/3/#L49-50">但 3:49-50</a>)</p></blockquote><p>這三個少年人不聽的，只是君王那條事奉別神的命令：</p><blockquote><p>“那時拿步高王十分驚慌，急忙站起，問他的臣僕說：“我們不是把他們三個人全捆起來拋入烈火窯中了嗎？”僕人回答君王說：“大王，實在是！” <…> 於是拿步高說道：“沙得辣客、默沙客和阿貝得乃哥的上主，是可讚美的！他打發了自己的天使來，救護那些信賴自己的僕人，他們<strong>敢違揹王命</strong>，寧願捐軀，<strong>除自己的上主以外，不願事奉叩拜其他任何神祇</strong>。” <…> 爲此我今頒發詔書：無論那一個民族，那一邦國，那一個異語人民，凡對沙得辣客、默沙客和阿貝得乃哥的上主敢出言不恭的，必被萬剮凌遲，他們的住宅必成爲廢墟，因爲沒有其他的神能像他這樣施行拯救。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/3/#L91,95-96">但 3:91,95-96</a>)</p></blockquote><h3>上帝拯救人脫離外邦的王</h3><blockquote><p>“所以耶和華論亞述王如此說：『他必不得來到這城，也不在這裏射箭，不得拿盾牌到城前，也不築壘攻城。 他從那條路來，必從那條路回去，必不得來到這城。』這是耶和華說的。 因我爲自己的緣故，又爲我僕人大衛的緣故，<strong>必保護拯救這城</strong>。」 當夜，<strong>耶和華的使者出去，在亞述營中殺了十八萬五千人</strong>。清早有人起來一看，都是死屍了。 亞述王西拿基立就拔營回去，住在尼尼微。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/19/#L32-36">王下 19:32-36</a>)</p></blockquote><h3>刑罰和拯救取決於人民的虔敬</h3><blockquote><p>“說，「你們各人當回頭，離開惡道和所作的惡，便可居住耶和華古時所賜給你們和你們列祖之地，直到永遠。 <strong><mark>不可隨從別神事奉敬拜</mark></strong>，<strong><mark>以你們手所作的惹我發怒</mark></strong>，這樣，我就不加害與你們。 <strong><mark>然而，你們沒有聽從我</mark></strong>，竟以手所作的惹我發怒，陷害自己。」這是耶和華說的。 所以萬軍之耶和華如此說：「<strong><mark>因爲你們沒有聽從我的話</mark></strong>， 我必召北方的衆族和我僕人巴比倫王尼布甲尼撒來攻擊這地，和這地的居民，並四圍一切的國民。<strong>我要將他們盡行滅絕</strong>，以致他們令人驚駭、嗤笑，並且永久荒涼。」這是耶和華說的。 「我又要使歡喜和快樂的聲音，新郎和新婦的聲音，推磨的聲音和燈的亮光，從他們中間止息。 這全地必然荒涼，令人驚駭，<strong>這些國民要服事巴比倫王七十年</strong>。 <strong>七十年滿了以後，我必刑罰巴比倫王和那國民</strong>，並迦勒底人之地，因他們的罪孽使那地永遠荒涼。」這是耶和華說的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/25/#L5-12">耶 25:5-12</a>)</p></blockquote><blockquote><p>“<strong>將你心所願的賜給你</strong>，成就你的一切籌算。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/20/#L4">詩 20:4</a>)</p></blockquote>
  meta_desc: 關於教會與世俗（國家）政權之關係的聖經引文
