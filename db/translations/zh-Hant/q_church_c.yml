  path: Qc10A_聖殿——天上實體的象徵
  title: 聖殿——天上實體的象徵
  copy_cover: true
  body: <h2>看不見者的看得見之像</h2><h3>宇宙</h3><p>上帝創造世界，爲要叫人由看得見的認識看不見的：人通過觀看看得見的受造物，認識那看不見的造物主：</p><blockquote><p>“<strong>上帝的事情，人所能知道的，原顯明在人心裏</strong>，因爲<strong>上帝已經給他們顯明</strong>。 自從造天地以來，上帝的永能和神性是明明可知的，雖是<strong>眼不能見</strong>，但<strong>藉着所造之物就可以曉得</strong>，叫人無可推諉。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/1/#L19-20">羅 1:19-20</a>)</p></blockquote><h3>聖殿</h3><p>看得見的地上的聖殿，是看不見的天上實體的像。先知得到命令：要照在山上所指示的樣式建造聖殿：</p><blockquote><p>“又當爲我<strong>造聖所</strong>，使我可以住在他們中間。 製造帳幕和其中的一切器具，<strong>都要照我所指示你的樣式</strong>。 &lt;…&gt; 要謹慎作這些物件，都<strong>要照著在山上指示你的樣式</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L8-9,40">出 25:8-9,40</a>)</p></blockquote><p>使徒指出，聖殿是按真聖所的像建造的：</p><blockquote><p>“因爲基督並不是進了<strong><mark>人手所造的聖所（這不過是真聖所的影像）</mark></strong>，乃是進了天堂，如今爲我們顯在上帝面前；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/9/#L24">希 9:24</a>)</p></blockquote><blockquote><p>“我們的祖宗在曠野有<strong>法櫃的帳幕</strong>，是上帝吩咐摩西叫他<strong>照所看見的樣式</strong>作的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/7/#L44">徒 7:44</a>)</p></blockquote><h2>舊約——聖殿裏只有上帝和天使</h2><h3>看不見的上帝</h3><p>在按上帝命令建造的舊約聖殿裏，最首要的地方隻立著約櫃（櫃子），櫃裏放著聖物；在櫃的施恩座上、二基路伯中間，上帝顯現並說話：</p><blockquote><p>“我要在那裏與你相會，又要<strong><mark>從法櫃施恩座上，二基路伯中間</mark></strong>，和你說我所要吩咐你傳給以色列人的一切事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L22">出 25:22</a>)</p></blockquote><h3>聖潔的天使</h3><p>聖殿裏到處佈滿天使（基路伯）的像</p><h4>約櫃施恩座上的基路伯</h4><blockquote><p>“要<strong>用金子錘出兩個基路伯</strong>來，<strong>安在施恩座的兩頭</strong>。 這頭作一個基路伯，那頭作一個基路伯。二基路伯要接連一塊，在施恩座的兩頭。 二基路伯要高張翅膀，遮掩施恩座。基路伯要臉對臉，朝著施恩座。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L18-20">出 25:18-20</a>)</p></blockquote><h4>約櫃左右的基路伯</h4><blockquote><p>“他<strong>用橄欖木作兩個基路伯</strong>，各高十肘，安在內殿。 &lt;…&gt; 他將兩個基路伯<strong>安在內殿裏</strong>。基路伯的翅膀是張開的，這基路伯的一個翅膀挨着這邊的牆，那基路伯的一個翅膀挨着那邊的牆，裏邊的兩個翅膀，在殿中間彼此相接。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L23,27">王上 6:23,27</a>)</p></blockquote><h4>幔子上的基路伯</h4><blockquote><p>“又用藍色、紫色、硃紅色線和細麻<strong>織幔子</strong>，在其上<strong>繡出基路伯來</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L14">代下 3:14</a>; <a href="https://bibleox.com/zh-Hant/cn-sbt/1mak/1/#L22">加上 1:22</a>)</p></blockquote><h4>聖殿牆上的基路伯</h4><blockquote><p>“內殿外殿周圍的牆上，<strong>都刻著基路伯</strong>、棕樹和初開的花。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L29">王上 6:29</a>)</p></blockquote><p>關於聖殿構造的詳情：<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷聖殿</a></p><h2>新約——聖殿裏有上帝、天使和義人的靈魂</h2><h3>天上的實體改變了</h3><p>上帝成了肉身，成爲看得見的，受苦，復活，昇天，並<strong>以看得見的</strong>方式登基（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L19">可 16:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L20-21">弗 1:20-21</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L21">啟 3:21</a>）。</p><h3>基督上帝</h3><blockquote><p>“主耶穌和他們說完了話，後來被接到天上，<strong><mark>坐在上帝的右邊</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/16/#L19">可 16:19</a>)</p></blockquote><blockquote><p>“就是照他在基督身上所運行的大能大力，使他從死裏復活，<strong><mark>叫他在天上坐在自己的右邊</mark></strong>， 遠超過一切執政的、掌權的、有能的、主治的和一切有名的，不但是今世的，連來世的也都超過了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/1/#L20-21">弗 1:20-21</a>)</p></blockquote><blockquote><p>“得勝的，我要賜他<strong>在我寶座上</strong>與我同坐，就如我得了勝，<strong><mark>在我父的寶座上與他同坐</mark></strong>一般。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L21">啟 3:21</a>)</p></blockquote><h3>聖潔的天使</h3><blockquote><p>“另有一位<strong>天使</strong>拿著金香爐，來站在祭壇旁邊。有許多香賜給他，要和衆聖徒的祈禱一同獻在寶座前的金壇上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3">啟 8:3</a>)</p></blockquote><blockquote><p>“那掌管七災的<strong>七位天使</strong>從殿中出來，穿著潔白光明的細麻衣，胸間束著金帶。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/15/#L6">啟 15:6</a>)</p></blockquote><h3>聖潔義人的靈魂</h3><blockquote><p>“揭開第五印的時候，我看見<strong>在祭壇底下，有爲上帝的道併爲作見證被殺之人的靈魂</strong>， 大聲喊著說：「聖潔真實的主啊！你不審判住在地上的人，給我們伸流血的冤，要等到幾時呢？」 於是有<strong>白衣</strong>賜給他們各人，又有話對他們說：「還要安息片時，等著一同作僕人的和他們的弟兄，<strong>也像他們被殺，滿足了數目</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/6/#L9-11">啟 6:9-11</a>)</p></blockquote><blockquote><p>“我又觀看，見<strong>羔羊</strong>站在錫安山，同他又有<strong>十四萬四千人</strong>，都有他的名和他父的名寫在額上。 &lt;…&gt; 他們在寶座前，並在四活物和衆長老前唱歌，彷彿是新歌；除了<strong>從地上買來的</strong>那十四萬四千人以外，沒有人能學這歌。 這些人<strong>未曾沾染婦女</strong>，他們原是童身。<strong>羔羊無論往那裏去，他們都跟隨他</strong>。他們是從人間買來的，作初熟的果子歸與上帝和羔羊。 在他們口中察不出謊言來，他們是沒有瑕疵的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1,3-5">啟 14:1,3-5</a>)</p></blockquote><h3>唱詩</h3><blockquote><p>“忽然，有一大隊天兵同那天使讚美上帝說： 「在至高之處榮耀歸與上帝！在地上平安歸與他所喜悅的人〔有古卷作『喜悅歸與人』〕！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L13-14">路 2:13-14</a>)</p></blockquote><blockquote><p>“我又觀看，見<strong>羔羊</strong>站在錫安山，同他又有<strong>十四萬四千人</strong>，都有他的名和他父的名寫在額上。 &lt;…&gt; 他們在寶座前，並在四活物和衆長老前唱歌，<strong>彷彿是新歌</strong>；除了從地上買來的那十四萬四千人以外，沒有人能學這歌。 這些人未曾沾染婦女，他們原是童身。羔羊無論往那裏去，他們都跟隨他。他們是從人間買來的，作初熟的果子歸與上帝和羔羊。 在他們口中察不出謊言來，他們是沒有瑕疵的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/14/#L1,3-5">啟 14:1,3-5</a>)</p></blockquote><h3>量度天上聖殿的命令</h3><blockquote><p>“起來，將<strong><mark>上帝的殿</mark></strong>和祭壇，並在殿中禮拜的人都量一量。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/11/#L1">啟 11:1</a>)</p></blockquote><h3>寶座</h3><blockquote><p>“那二十四位長老就俯伏在<strong>坐寶座的面前</strong>，敬拜那活到永永遠遠的，又把他們的冠冕放在寶座前，說：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/4/#L10">啟 4:10</a>)</p></blockquote><blockquote><p>“在上帝面前，坐在自己位上的二十四位長老，就面伏於地敬拜上帝，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/11/#L16">啟 11:16</a>)</p></blockquote><h3>祭壇</h3><blockquote><p>“另有一位天使拿著金香爐，來站在<strong>祭壇旁邊</strong>。有許多香賜給他，要和衆聖徒的祈禱一同獻在<strong>寶座前</strong>的<strong>金壇</strong>上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3">啟 8:3</a>)</p></blockquote><blockquote><p>“天使拿著香爐，盛滿了<strong>壇上的火</strong>，倒在地上，隨有雷轟、大聲、閃電、地震。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L5">啟 8:5</a>)</p></blockquote><blockquote><p>“第六位天使吹號，我就聽見有聲音從上帝面前<strong>金壇</strong>的四角出來，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/9/#L13">啟 9:13</a>)</p></blockquote><h3>七燈</h3><blockquote><p>“有閃電、聲音、雷轟從寶座中發出。又有<strong>七盞火燈</strong>在<strong>寶座前</strong>點著，這七燈就是上帝的七靈。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/4/#L5">啟 4:5</a>)</p></blockquote><h3>上香</h3><blockquote><p>“另有一位天使拿著<strong>金香爐</strong>，來站在祭壇旁邊。<strong>有許多香</strong>賜給他，要和衆聖徒的祈禱一同獻在寶座前的金壇上。 &lt;…&gt; <strong>天使拿著香爐</strong>，盛滿了壇上的火，倒在地上，隨有雷轟、大聲、閃電、地震。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/8/#L3,5">啟 8:3,5</a>)</p></blockquote><h3>里昂的愛任紐（二世紀）論聖殿是天上的實體的象徵</h3><p>聖殿按天上實體之像的建造，由聖里昂的愛任紐（二世紀）所證實。愛任紐引用神學家約翰的啟示錄，說地上的事物作天上事物的像是合宜的——這些天上的事物也是由同一位上帝所造：</p><p>“所以，正如他[上帝]在這些事[祭物]上並無所缺，卻願意我們爲自己而行這些事，免得我們不結果子；同樣，聖言也把關於祭物的誡命賜給了（猶太）民族，雖然他並不需要它們，爲要叫他們學習事奉上帝；基於同樣的原因，他願意<strong>我們也常常、按時地把禮物帶到祭壇前</strong>。</p><p>這樣，<strong>在天上有祭壇</strong>，因爲我們的祈禱和獻禮是朝那裏去的；也有<strong>聖殿</strong>，正如約翰在啟示錄裏所說：‘天上上帝的殿開了’（啟 11:19），還有帳幕：‘看哪，上帝的帳幕在人中間，他要與人同住’（啟 21:3）。祭物、獻禮和一切祭品，（猶太）民族是按預像領受的，正如摩西在山上所受的指示——是來自同一位上帝，他的名如今在教會裏、在萬民中被稱頌。但是，<strong>在我們周圍所安排的地上的事物，作天上事物的像是合宜的</strong>——這些天上的事物也是由同一位上帝所造。<strong>否則，他就無法把屬靈事物的相似之物拉近到我們的悟性面前</strong>。”</p><p>（[俄文](https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4)《駁異端》卷四，第18-19章）</p><h2>上帝命令敬重聖殿</h2><p>聖殿——<a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">天上實體的像</a>。上帝命令敬重這像：</p><blockquote><p>“你們要守我的安息日，<strong>敬我的聖所</strong>。我是耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L30">利 19:30</a>)</p></blockquote><blockquote><p>“你們要守我的安息日，<strong>敬我的聖所</strong>。我是耶和華。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/26/#L2">利 26:2</a>)</p></blockquote><p>新約的聖殿，是按神學家約翰的啟示錄裏的像建造的。</p>
