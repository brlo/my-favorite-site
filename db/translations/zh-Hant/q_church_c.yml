  path: Qc15A_恩典借著不配的人做工
  title: 恩典借著不配的人做工
  copy_cover: true
  body: <h2>大祭司該亞法</h2><p>上帝藉著一個想要殺基督的人說出預言——不是因爲別的，只是因爲他在那一年是大祭司：</p><blockquote><p>“內中有一個人，名叫<strong><mark>該亞法</mark></strong>，本年作大祭司，對他們說：「你們不知道什麼！ <strong>獨不想一個人替百姓死，免得通國滅亡，就是你們的益處</strong>。」 <strong><mark>他這話不是出於自己</mark></strong>，是因他本年作大祭司，所以預言耶穌將要替這一國死。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/11/#L49-51">約 11:49-51</a>)</p></blockquote><h2>加略人猶大</h2><blockquote><p>“<strong>耶穌叫了十二個門徒來</strong>，<strong><mark>給他們權柄，能趕逐污鬼，並醫治各樣的病症</mark></strong>。 這十二使徒的名：頭一個叫西門，又稱彼得，還有他兄弟安得烈，西庇太的兒子雅各和雅各的兄弟約翰， 腓力和巴多羅買，多馬和稅吏馬太，亞勒腓的兒子雅各，和達太， 奮銳黨的西門，還有賣耶穌的<strong><mark>加略人猶大</mark></strong>。 耶穌差這十二個人去，吩咐他們說：「外邦人的路，你們不要走；撒瑪利亞人的城，你們不要進； &lt;…&gt; <strong>醫治病人，叫死人復活，叫長大痲瘋的潔淨，把鬼趕出去</strong>。你們白白的得來，也要白白的捨去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/10/#L1-5,8">太 10:1-5,8</a>)</p></blockquote><blockquote><p>“有一個門徒，就是<strong><mark>那將要賣耶穌的加略人猶大</mark></strong>， &lt;…&gt; 他說這話，並不是掛念窮人，乃因<strong><mark>他是個賊</mark></strong>，又帶著錢囊，常取其中所存的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/12/#L4,6">約 12:4,6</a>)</p></blockquote><h2>上帝的信實高於人的不忠</h2><blockquote><p>“即便有不信的，這有何妨呢？<strong>難道他們的不信，就廢掉上帝的信嗎</strong>？ <strong>斷乎不能</strong>！不如說，上帝是真實的，人都是虛謊的。如經上所記：『你責備人的時候，顯爲公義；被人議論的時候，可以得勝。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/3/#L3-4">羅 3:3-4</a>)</p></blockquote><h2>司祭的責任</h2><blockquote><p>“惟有那不知道的，作了當受責打的事，必少受責打。因爲多給誰，就向誰多取；<strong>多托誰，就向誰多要</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L48">路 12:48</a>)</p></blockquote>
  meta_desc: 恩典借著不配的人做工
