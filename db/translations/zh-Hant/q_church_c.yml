  path: Qc16A_對主教、司祭、輔祭候任者的要求
  title: 對主教、司祭、輔祭候任者的要求
  copy_cover: true
  body: <h2>對比總表</h2><table><tbody><tr><td><strong>提多</strong>（克里特島，多 1:5）<br>(<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L5-9">多 1:5-9</a>)</td><td><strong>提摩太</strong>（以弗所城，提前 1:3）<br>(<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L1-13">提前 3:1-13</a>)</td></tr><tr><td>無可指責</td><td>無可指責；作爲上帝的管家，必須無可指責</td></tr><tr><td>只作一個婦人的丈夫</td><td>只作一個婦人的丈夫</td></tr><tr><td>有節制</td><td>自持</td></tr><tr><td>自守</td><td>莊重</td></tr><tr><td>端正</td><td>聖潔</td></tr><tr><td>端莊</td><td>公平</td></tr><tr><td>樂意接待遠人</td><td>樂意接待遠人</td></tr><tr><td>善於教導</td><td>堅守所教真實的道理，能將純正的教訓勸化人，又能把爭辯的人駁倒</td></tr><tr><td>不因酒滋事</td><td>不因酒滋事</td></tr><tr><td>不打人</td><td>不打人</td></tr><tr><td>不爭競</td><td>不任性</td></tr><tr><td>不貪財，只要</td><td>不貪無義之財</td></tr><tr><td>溫和</td><td>不暴躁</td></tr><tr><td>和睦</td><td></td></tr><tr><td>不貪不義之財</td><td></td></tr><tr><td>好好管理自己的家</td><td></td></tr><tr><td>使兒女凡事端莊、順服。人若不知道管理自己的家，焉能照管上帝的教會呢？</td><td>兒女也是信主的，沒有人告他們是放蕩不服約束的</td></tr><tr><td>初入教的不可作監督，恐怕他自高自大，就落在魔鬼所受的刑罰裏。</td><td></td></tr><tr><td>監督也必須在教外有好名聲，恐怕被人毀謗，落在魔鬼的網羅裏。</td><td>好善</td></tr></tbody></table><h2>引文</h2><blockquote><p>“『人若想要得<strong><mark>監督</mark></strong>的職分，就是羨慕善工。』這話是可信的。 作監督的，必須無可指責，只作一個婦人的丈夫，有節制，自守，端正，樂意接待遠人，善於教導；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L1-2">提前 3:1-2</a>)</p></blockquote><p>“作監督的，必須”：</p><ul><li><p>無可指責，</p></li><li><p>只作一個婦人的丈夫，</p></li><li><p>有節制，</p></li><li><p>自守，</p></li><li><p>端正，</p></li><li><p>樂意接待遠人，</p></li><li><p>善於教導；</p></li><li><p>不因酒滋事，不打人，只要溫和，不爭競、不貪財；</p></li><li><p>好好管理自己的家，使兒女凡事端莊、順服。人若不知道管理自己的家，焉能照管上帝的教會呢？</p></li><li><p>初入教的不可作監督，恐怕他自高自大，就落在魔鬼所受的刑罰裏。</p></li><li><p>監督也必須在教外有好名聲，恐怕被人毀謗，落在魔鬼的網羅裏。（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L2-7">提前 3:2-7</a>）</p></li></ul><blockquote><p>“<strong><mark>作執事的也是如此</mark></strong>：必須端莊，不一口兩舌，不好喝酒，不貪不義之財； 要存清潔的良心，固守真道的奧祕。 這等人也要先受試驗，若沒有可責之處，然後叫他們作執事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L8-10">提前 3:8-10</a>)</p></blockquote><blockquote><p>“<strong><mark>女執事也是如此</mark></strong>：必須端莊，不說讒言，有節制，凡事忠心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L11">提前 3:11</a>)</p></blockquote><blockquote><p>“<strong><mark>執事只要作一個婦人的丈夫</mark></strong>，好好管理兒女和自己的家。 因爲善作執事的，自己就得到美好的地步，並且在基督耶穌裏的真道上大有膽量。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/3/#L12-13">提前 3:12-13</a>)</p></blockquote><blockquote><p>“我從前留你在革哩底，是要你將那沒有辦完的事都辦整齊了，又照我所吩咐你的，<strong><mark>在各城設立長老</mark></strong>。 若有無可指責的人，只作一個婦人的丈夫，兒女也是信主的，沒有人告他們是放蕩不服約束的，就可以設立。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L5-6">多 1:5-6</a>)</p></blockquote><ul><li><p>兒女也是信主的，沒有人告他們是放蕩不服約束的。</p></li></ul><blockquote><p>“<strong><mark>監督既是上帝的管家</mark></strong>，必須無可指責，不任性、不暴躁、不因酒滋事、不打人、不貪無義之財； 樂意接待遠人，好善、莊重、公平、聖潔、自持； 堅守所教真實的道理，就能將純正的教訓勸化人，又能把爭辯的人駁倒了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/tit/1/#L7-9">多 1:7-9</a>)</p></blockquote>
  meta_desc: 對主教、司祭、輔祭候任者的要求
