  path: Qs14T_基督在巴勒斯坦的生活
  title: 基督在巴勒斯坦的生活
  copy_cover: true
  body: <h2>耶穌基督降生在伯利恆</h2><blockquote><p>“當希律王的時候，耶穌<strong>生在猶太的伯利恆</strong>。有幾個博士從東方來到耶路撒冷，說：” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L1">太 2:1</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L4-7">路 2:4-7</a>)</p></blockquote><p><em>這應驗了預言：<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L5">太 2:5</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L42">約 7:42</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/mih/5/#L2">彌 5:2</a>。</em></p><h2>逃往埃及</h2><p>降生以後，約瑟和童貞女馬利亞爲躲避希律王的追殺，把嬰孩耶穌帶到埃及去了幾年（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L16">太 2:16</a>）：</p><blockquote><p>“約瑟就起來，夜間帶著小孩子和他母親<strong>往埃及去</strong>， <strong>住在那裏，直到希律死了</strong>。這是要應驗主藉先知所說的話，說：『我從埃及召出我的兒子來。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L14-15">太 2:14-15</a>)</p></blockquote><p><em>這應驗了主藉先知所說的話：<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L15">太 2:15</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/os/11/#L1">何 11:1</a>。</em></p><h2>返回拿撒勒</h2><p>然後他們回到約瑟在拿撒勒的家（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L4">路 2:4</a>）：</p><blockquote><p>“「起來！帶著小孩子和他母親往以色列地去，因爲要害小孩子性命的人已經死了。」 約瑟就起來，<strong>把小孩子和他母親帶到以色列地去</strong>， 只因聽見亞基老接著他父親希律作了猶太王，就怕往那裏去，又在夢中被主指示，便往<strong>加利利境內</strong>去了。 到了一座城，名叫<strong>拿撒勒</strong>，就住在那裏．這是要應驗先知所說，他將稱爲拿撒勒人的話了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L20-23">太 2:20-23</a>)</p></blockquote><p><em>這應驗了預言：<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/2/#L23">太 2:23</a>；可能還有 <a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/13/#L5">士 13:5</a>。</em></p><h2>每年上耶路撒冷</h2><p>每年，耶穌基督都與父母、親屬和熟人一起上耶路撒冷的聖殿守節（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L43-44">路 2:43-44</a>）：</p><blockquote><p>“<strong>每年到逾越節，他父母就上耶路撒冷去</strong>。 當他十二歲的時候，他們<strong>按著節期的規矩上去</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L41-42">路 2:41-42</a>)</p></blockquote><p>到十二歲時，孩童耶穌已具有令耶路撒冷聖殿中的教師驚訝的智慧：</p><blockquote><p>“每年到逾越節，他父母就上耶路撒冷去。 <strong>當他十二歲的時候</strong>，他們按著節期的規矩上去。 &lt;…&gt; 過了三天，就遇見他<strong>在殿裏，坐在教師中間</strong>，一面聽，一面問。 <strong>凡聽見他的，都希奇他的聰明和他的應對</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L41-42,46-47">路 2:41-42,46-47</a>)</p></blockquote><p>十二歲以後，基督也住在拿撒勒，順從父母：</p><blockquote><p>“他就同他們下去，<strong>回到拿撒勒．並且順從他們</strong>。他母親把這一切的事都存在心裏。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/2/#L51">路 2:51</a>)</p></blockquote><h2>從拿撒勒遷往迦百農：傳道的開始</h2><p>滿了三十歲、在先知約翰那裏受洗之後，基督才離開拿撒勒，遷往迦百農，開始宣講：</p><blockquote><p>“耶穌聽見約翰下了監，就退到加利利去； <strong>後又離開拿撒勒，往迦百農去，就住在那裏</strong>。那地方靠海，在西布倫和拿弗他利的邊界上。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/4/#L12-13">太 4:12-13</a>)</p></blockquote><p><em>這應驗了預言：<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/4/#L14-16">太 4:14-16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/9/#L1-2">賽 9:1-2</a>。</em></p><h2>若干細節</h2><h3>加利利人都熟悉耶穌是木匠的兒子</h3><p>在加利利傳道時，人們都熟悉耶穌基督，知道他是普通的木匠、木匠的兒子：</p><blockquote><p>“<strong>這不是那木匠嗎</strong>？不是馬利亞的兒子雅各、約西、猶大、西門的長兄嗎？他妹妹們不也是在我們這裏嗎？」他們就厭棄他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/6/#L3">可 6:3</a>)</p></blockquote><blockquote><p>“<strong>這不是木匠的兒子嗎</strong>？他母親不是叫馬利亞嗎？他弟兄們不是叫雅各、約西〔有古卷作『約瑟』〕、西門，猶大嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/13/#L55">太 13:55</a>)</p></blockquote><h3>爲守律法而常上聖殿</h3><p>爲遵守律法，基督每年要三次上耶路撒冷的聖殿：</p><blockquote><p>“<strong>一切的男丁，要一年三次朝見主耶和華</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/23/#L17">出 23:17</a>)</p></blockquote><blockquote><p>“你們<strong>一切男丁，要一年三次</strong>朝見主耶和華以色列的上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/34/#L23">出 34:23</a>)</p></blockquote><blockquote><p>“你<strong>一切的男丁</strong>要在<strong>除酵節、七七節、住棚節，一年三次</strong>，在耶和華你上帝所選擇的地方朝見他，卻不可空手朝見。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/16/#L16">申 16:16</a>)</p></blockquote><h3>基督遵行了律法</h3><blockquote><p>“莫想我來要廢掉<strong>律法</strong>和先知；我來<strong>不是要廢掉，乃是要成全</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L17">太 5:17</a>)</p></blockquote><blockquote><p>“耶穌回答說：「你暫且許我．因爲<strong>我們理當這樣盡諸般的義</strong>。」於是約翰許了他。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/3/#L15">太 3:15</a>)</p></blockquote><blockquote><p>“<strong>人子必要去世，正如經上指著他所寫的</strong>，但賣人子的人有禍了，那人不生在世上倒好。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/26/#L24">太 26:24</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L21">可 14:21</a>)</p></blockquote><blockquote><p>“耶穌對他們說：「這就是我從前與你們同在之時所告訴你們的話說：<strong>摩西的律法</strong>、<strong>先知的書</strong>和<strong>詩篇</strong>上所記的，<strong>凡指著我的話都必須應驗</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L44">路 24:44</a>)</p></blockquote><blockquote><p>“及至時候滿足，上帝就差遣他的兒子，<strong>爲女子所生</strong>，且<strong>生在律法以下</strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gal/4/#L4">加 4:4</a>)</p></blockquote><h3>等候滿齡纔開始傳道</h3><p>基督直到三十歲才傳道行神蹟，因爲按上帝的定規和既成的傳統，公共事奉從三十歲開始（<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/4/#L3">民 4:3</a>）。因此，來不是要廢掉律法、乃是要成全的基督（<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L17">太 5:17</a>），等候到三十歲纔出來傳道：</p><blockquote><p>“耶穌<strong>開頭傳道，年紀約有三十歲</strong>。依人看來，他是約瑟的兒子，約瑟是希裏的兒子，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/3/#L23">路 3:23</a>)</p></blockquote><p>基督等候他的時刻來到：</p><blockquote><p>“耶穌說：「母親，我與你有什麼相幹？<strong>我的時候還沒有到</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/2/#L4">約 2:4</a>)</p></blockquote><blockquote><p>“他們就想要捉拿耶穌，只是沒有人下手，因爲<strong>他的時候還沒有到</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L30">約 7:30</a>)</p></blockquote><blockquote><p>“這些話是耶穌在殿裏的庫房教訓人時所說的，也沒有人拿他，<strong>因爲他的時候還沒有到</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/8/#L20">約 8:20</a>)</p></blockquote><blockquote><p>“耶穌就對他們說：「<strong>我的時候還沒有到</strong>；你們的時候常是方便的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L6">約 7:6</a>)</p></blockquote><blockquote><p>“你們上去過節吧！我現在不上去過這節；<strong>因爲我的時候還沒有滿</strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/7/#L8">約 7:8</a>)</p></blockquote><blockquote><p>“我有當受的洗還沒有成就，<strong>我是何等的迫切呢</strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L50">路 12:50</a>)</p></blockquote><blockquote><p>“耶穌說了這話，就舉目望天說：「<strong>父啊！時候到了</strong>，願你榮耀你的兒子，使兒子也榮耀你；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/17/#L1">約 17:1</a>)</p></blockquote>
