- src: действие-Бога-по-вере-родителей-и-друзей
  path: QM3T_上帝按親友的信心和祈禱行事
  title: 上帝按親友的信心和祈禱行事
  copy_cover: true
  body: <p>上帝恩典的運作並不總是按人個人的信心和個人的祈求。有不少情形，上帝是按著爲親人勞苦、爲他祈求（禱告）之人的信心行事的。</p><h2>四個朋友與癱瘓者</h2><p>醫治和赦罪是因癱瘓者朋友的信心而發生的——他們費了很大的力氣才把他帶到基督面前：</p><blockquote><p>“<strong><mark>耶穌見他們的信心</mark></strong>，就對癱子說：「<strong><mark>小子，你的罪赦了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/2/#L5">可 2:5</a>)</p></blockquote><h2>百夫長與他的僕人</h2><p>相信並祈求的是百夫長，得醫治的是百夫長的僕人：</p><blockquote><p>“百夫長回答說：「主啊，你到我舍下，我不敢當；只要你說一句話，我的僕人就必好了。 &lt;…&gt; 耶穌聽見就希奇，對跟從的人說：「我實在告訴你們：<strong><mark>這麼大的信心，就是在以色列中，我也沒有遇見過</mark></strong>。 &lt;…&gt; 耶穌對百夫長說：「你回去吧！<strong><mark>照你的信心，給你成全了</mark></strong>。」那時，他的僕人就好了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/8/#L8,10,13">太 8:8,10,13</a>)</p></blockquote><h2>父親與被鬼附的兒子</h2><p>相信並祈求的是父親，從鬼附中得醫治的是兒子：</p><blockquote><p>“衆人中間有一個人回答說：「夫子，我帶了我的兒子到你這裏來，他被啞巴鬼附著。 無論在那裏，鬼捉弄他，把他摔倒，他就口中流沫，咬牙切齒，身體枯乾。我請過你的門徒把鬼趕出去，他們卻是不能。」 耶穌說：「噯，不信的世代啊！我在你們這裏要到幾時呢？我忍耐你們要到幾時呢？把他帶到我這裏來吧。」 他們就帶了他來。他一見耶穌，鬼便叫他重重的抽瘋，倒在地上，翻來覆去，口中流沫。 耶穌問他父親說：「他得這病有多少日子呢？」回答說：「從小的時候。 鬼屢次把他扔在火裏、水裏，要滅他。你若能作什麼，求你憐憫我們，幫助我們！」 耶穌對他說：「你<strong><mark>若能信，在信的人，凡事都能</mark></strong>。」 孩子的父親立時喊著說〔有古卷作『立時流淚的喊著說』〕：「我信，但我信不足，求主幫助！」 耶穌看見衆人都跑上來，就斥責那污鬼說：「你這聾啞的鬼，我吩咐你從他裏頭出來，再不要進去！」 那鬼喊叫，使孩子大大的抽了一陣瘋，就出來了。孩子好像死了一般，以致衆人多半說：「他是死了。」 但耶穌拉著他的手，扶他起來，他就站起來了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/9/#L17-27">可 9:17-27</a>)</p></blockquote><h2>迦南婦人與被鬼附的女兒</h2><p>相信並祈求的是母親，從鬼附中得醫治的是迦南婦人（敘利腓尼基婦人——<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/7/#L26">可 7:26</a>）的女兒：</p><blockquote><p>“有一個迦南<strong><mark>婦人</mark></strong>從那地方出來，喊著說：「主啊，大衛的子孫，可憐我！我女兒被鬼附得甚苦。」 耶穌卻一言不答。門徒進前來，求他說：「這婦人在我們後頭喊叫，請打發他走吧！」 耶穌說：「我奉差遣，不過是到以色列家迷失的羊那裏去。」 那婦人來拜他，說：「主啊，幫助我！」 他回答說：「不好拿兒女的餅丟給狗吃。」 婦人說：「主阿，不錯！但是狗也吃牠主人桌子上掉下來的碎渣兒。」 耶穌說：「婦人，<strong><mark>你的信心是大的</mark></strong>．照你所要的，給你成全了吧！」從那時候，她女兒就好了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/15/#L22-28">太 15:22-28</a>)</p></blockquote><blockquote><p>“當下，<strong><mark>有一個婦人，她的小女兒被污鬼附著</mark></strong>，聽見耶穌的事，就來俯伏在他腳前。 這婦人是希利尼人，屬敘利非尼基族。她求耶穌趕出那鬼離開她的女兒。 耶穌對她說：「讓兒女們先吃飽，不好拿兒女的餅丟給狗吃。」 婦人回答說：「主啊，不錯！但是狗在桌子底下也吃孩子們的碎渣兒。」 耶穌對她說：「<strong><mark>因這句話，你回去吧</mark></strong>！鬼已經離開你的女兒了。」 她就回家去，見小孩子躺在牀上，<strong><mark>鬼已經出去了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/7/#L25-30">可 7:25-30</a>)</p></blockquote><h2>睚魯與十二歲的女兒</h2><p>相信並祈求的是父親（睚魯），復活的是被醫治的女兒：</p><blockquote><p>“有一個管會堂的，名叫睚魯，來<strong><mark>俯伏在耶穌腳前</mark></strong>，求耶穌到他家裏去。 因他有一個獨生女兒，約有十二歲，快要死了。耶穌去的時候，衆人擁擠他。 &lt;…&gt; 還說話的時候，有人從管會堂的家裏來，說：「<strong><mark>你的女兒死了</mark></strong>，不要勞動夫子。」 耶穌聽見就對他說：「<strong><mark>不要怕，只要信</mark></strong>！你的女兒就必得救。」 耶穌到了他的家，除了彼得、約翰、雅各和女兒的父母，不許別人同他進去。 衆人都爲這女兒哀哭捶胸。耶穌說：「不要哭！她不是死了，是睡著了。」 他們曉得女兒已經死了，就嗤笑耶穌。 耶穌拉著她的手，呼叫說：「<strong><mark>女兒，起來吧</mark></strong>！」 她的靈魂便回來，她就立刻起來了。耶穌吩咐給他東西吃。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/8/#L41-42,49-55">路 8:41-42,49-55</a>)</p></blockquote><h2>大臣與他的兒子</h2><p>相信並祈求的是大臣，得醫治的是他的兒子：</p><blockquote><p>“耶穌又到了加利利的迦拿，就是他從前變水爲酒的地方。有一個大臣，他的兒子在迦百農患病。 他聽見耶穌從猶太到了加利利，就來見他，求他下去醫治他的兒子，因爲他兒子快要死了。 耶穌就對他說：「<strong><mark>若不看見神跡奇事，你們總是不信</mark></strong>。」 那大臣說：「先生，求你趁著我的孩子還沒有死，就下去。」 耶穌對他說：「回去吧！你的兒子活了。」那人信耶穌所說的話，就回去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/4/#L46-50">約 4:46-50</a>)</p></blockquote><h2>結論</h2><p>這樣，救主等候父母的信心，爲要在他們的兒女身上顯出上帝的作爲。並且因著父母的祈求和信心，上帝的恩典在兒女身上運行。</p>
  meta_desc: 上帝按親友的信心和祈禱行事
