  path: QM1T_祈禱
  title: 祈禱
  copy_cover: true
  body: <h2>關於祈禱的命令</h2><h3>祈求的祈禱</h3><blockquote><p>“<strong><mark>你們祈求，就給你們</mark></strong>；<strong><mark>尋找，就尋見</mark></strong>；<strong><mark>叩門，就給你們開門</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L7">太 7:7</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L9">路 11:9</a>)</p></blockquote><h3>感恩的祈禱</h3><blockquote><p>“<strong><mark>不住的禱告</mark></strong>， <strong><mark>凡事謝恩</mark></strong>，<strong><mark>因爲這是上帝在基督耶穌裏向你們所定的旨意</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L17-18">帖前 5:17-18</a>)</p></blockquote><blockquote><p>“應當一無掛慮，只要<strong><mark>凡事藉着禱告、祈求和感謝</mark></strong>，將你們所要的告訴上帝。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/fil/4/#L6">腓 4:6</a>)</p></blockquote><blockquote><p>“不要醉酒，酒能使人放蕩，乃要被聖靈充滿。 當用詩章、頌詞、靈歌彼此對說，口唱心和的讚美主。 凡事要奉我們主耶穌基督的名，<strong><mark>常常感謝父上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/5/#L18-20">弗 5:18-20</a>)</p></blockquote><blockquote><p>“無論作什麼，或說話，或行事，都要奉主耶穌的名，<strong><mark>藉着他感謝父上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/3/#L17">西 3:17</a>)</p></blockquote><h3>讚美上帝的祈禱（頌讚）</h3><blockquote><p>“<strong><mark>當稱謝進入他的門</mark></strong>，當讚美進入他的院；<strong><mark>當感謝他，稱頌他的名</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/100/#L4">詩 100:4</a>)</p></blockquote><blockquote><p>“（大衛在亞比米勒面前裝瘋，被他趕出去，就作這詩。）<strong><mark>我要時時稱頌耶和華</mark></strong>；<strong><mark>讚美他的話必常在我口中</mark></strong>。 我的心必因耶和華誇耀；謙卑人聽見，就要喜樂。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L1-2">詩 34:1-2</a>)</p></blockquote><blockquote><p>“我們應當靠著耶穌，<strong><mark>常常以頌讚爲祭獻給上帝</mark></strong>，<strong><mark>這就是那承認主名之人嘴脣的果子</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L15">希 13:15</a>)</p></blockquote><h2>恆常的祈禱與思念上帝</h2><blockquote><p>“靠著聖靈，<strong><mark>隨時多方禱告祈求</mark></strong>，並要在此儆醒不倦，<strong><mark>爲衆聖徒祈求</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L18">弗 6:18</a>)</p></blockquote><blockquote><p>“<strong><mark>不住的禱告</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L17">帖前 5:17</a>)</p></blockquote><blockquote><p>“耶穌設一個比喻，是<strong><mark>要人常常禱告，不可灰心</mark></strong>。 說：「某城裏有一個官，不懼怕上帝，也不尊重世人。 那城裏有個寡婦，常到他那裏，說：『我有一個對頭，求你給我伸冤。』 他多日不準。後來心裏說：『我雖不懼怕上帝，也不尊重世人， 只因這寡婦煩擾我，我就給他伸冤吧．免得她常來纏磨我！』」 主說：「你們聽這不義之官所說的話。 <strong><mark>上帝的選民晝夜呼籲他</mark></strong>，他縱然爲他們忍了多時，豈不終久給他們伸冤嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L1-7">路 18:1-7</a>)</p></blockquote><h2>什麼樣的祈禱蒙垂聽</h2><h3>信心</h3><blockquote><p>“你們中間若有缺少智慧的，應當求那厚賜與衆人、也不斥責人的上帝，主就必賜給他。 <strong><mark>只要憑著信心求，一點不疑惑</mark></strong>；因爲那疑惑的人，就像海中的波浪，被風吹動翻騰。 <strong><mark>這樣的人不要想從主那裏得什麼</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/1/#L5-7">雅 1:5-7</a>)</p></blockquote><blockquote><p>“你們禱告，無論求什麼，<strong><mark>只要信，就必得著</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L22">太 21:22</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/11/#L24">可 11:24</a>)</p></blockquote><h3>公義（按上帝旨意生活，遠離罪惡）</h3><blockquote><p>“惡人獻祭，爲耶和華所憎惡；<strong><mark>正直人祈禱，爲他所喜悅</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/15/#L8">箴 15:8</a>)</p></blockquote><blockquote><p>“耶和華遠離惡人，<strong><mark>卻聽義人的禱告</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/15/#L29">箴 15:29</a>)</p></blockquote><blockquote><p>“<strong><mark>你們若常在我裏面</mark></strong>，<strong><mark>我的話也常在你們裏面</mark></strong>，凡你們所願意的，祈求就給你們成就。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L7">約 15:7</a>)</p></blockquote><blockquote><p>“主說：「因爲這百姓親近我，<strong><mark>用嘴脣尊敬我，心卻遠離我</mark></strong>；他們敬畏我，不過是領受人的吩咐。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/29/#L13">賽 29:13</a>)</p></blockquote><h3>謙卑痛悔的心</h3><blockquote><p>“上帝所要的祭，就是憂傷的靈；上帝阿！<strong><mark>憂傷痛悔的心，你必不輕看</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/51/#L17">詩 51:17</a>)</p></blockquote><blockquote><p>“耶和華啊！<strong><mark>謙卑人的心願你早已知道</mark></strong>；<strong><mark>你必預備他們的心，也必側耳聽他們的祈求</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/10/#L17">詩 10:17</a>) <em>(俄文本編號爲 Пс 9:37（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“<strong>謙卑人的祈禱，穿雲而上</strong>，不達到目的，決不甘休；不等至高者見了，爲義人伸冤，執行正義，決不離開。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/35/#L21">德 35:21</a>)</p></blockquote><blockquote><p>“耶和華說：「這一切都是我手所造的，所以就都有了。但<strong><mark>我所看顧的，就是虛心痛悔、因我話而戰兢的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L2">賽 66:2</a>)</p></blockquote><blockquote><p>“<strong><mark>或者他們在耶和華面前懇求</mark></strong>，各人回頭，離開惡道，因爲耶和華向這百姓所說要發的怒氣和忿怒是大的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/36/#L7">耶 36:7</a>)</p></blockquote><blockquote><p>“但願我們能<strong>藉着懺悔的心和謙虛的精神</strong>蒙你悅納，就如獻上公羊和公牛的全燔祭，又如獻上了萬隻肥羊；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/3/#L39">但 3:39</a>)</p></blockquote><blockquote><p>“耶穌向那些<strong><mark>仗著自己是義人，藐視別人的</mark></strong>，設一個比喻， 說：「有兩個人上殿裏去禱告：一個是法利賽人，一個是稅吏。 <strong><mark>法利賽人站著，自言自語的禱告說</mark></strong>：『上帝啊，我感謝你，<strong><mark>我不像別人</mark></strong>勒索、不義、姦淫，也不像這個稅吏。 我一個禮拜禁食兩次，凡我所得的都捐上十分之一。』 <strong><mark>那稅吏遠遠的站著，連舉目望天也不敢</mark></strong>，只捶著胸說：『<strong><mark>上帝啊，開恩可憐我這個罪人</mark></strong>！』 我告訴你們：這人回家去比那人倒算爲義了。因爲<strong><mark>凡自高的，必降爲卑；自卑的，必升爲高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L9-14">路 18:9-14</a>)</p></blockquote><p>參見：<a href="https://bibleox.com/ru/ru/w/смирение">謙卑</a></p><h3>饒恕一切所受的委屈</h3><blockquote><p>“你們站著禱告的時候，若想起有人得罪你們，<strong><mark>就當饒恕他</mark></strong>，好叫你們在天上的父也饒恕你們的過犯。 <strong><mark>你們若不饒恕人，你們在天上的父也不饒恕你們的過犯</mark></strong>〔有古卷無此節〕。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/11/#L25-26">可 11:25-26</a>)</p></blockquote><blockquote><p>“<strong><mark>你們饒恕人的過犯，你們的天父也必饒恕你們的過犯</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L14">太 6:14</a>)</p></blockquote><h3>與鄰人和睦</h3><blockquote><p>“所以，你在祭壇上獻禮物的時候，若想起弟兄向你懷怨， 就把禮物留在壇前，<strong><mark>先去同弟兄和好</mark></strong>，<strong><mark>然後來獻禮物</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L23-24">太 5:23-24</a>)</p></blockquote><blockquote><p>“你們作丈夫的也要按情理和妻子同住，因她比你軟弱，與你一同承受生命之恩的，所以要敬重她。<strong><mark>這樣，便叫你們的禱告沒有阻礙</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/3/#L7">彼前 3:7</a>)</p></blockquote><h3>忍耐</h3><blockquote><p>“耶穌設一個比喻，是<strong><mark>要人常常禱告，不可灰心</mark></strong>。 說：「某城裏有一個官，不懼怕上帝，也不尊重世人。 那城裏有個寡婦，常到他那裏，說：『我有一個對頭，求你給我伸冤。』 他多日不準。後來心裏說：『我雖不懼怕上帝，也不尊重世人， 只因這寡婦煩擾我，我就給他伸冤吧．免得她常來纏磨我！』」 主說：「你們聽這不義之官所說的話。 <strong><mark>上帝的選民晝夜呼籲他</mark></strong>，他縱然爲他們忍了多時，豈不終久給他們伸冤嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L1-7">路 18:1-7</a>)</p></blockquote><blockquote><p>“耶穌又說：「你們中間誰有一個朋友半夜到他那裏去，說：『朋友！請借給我三個餅； 因爲我有一個朋友行路，來到我這裏，我沒有什麼給他擺上。』 那人在裏面回答說：『不要攪擾我，門已經關閉，孩子們也同我在牀上了，我不能起來給你。』 我告訴你們，雖不因他是朋友起來給他，<strong><mark>但因他情詞迫切的直求，就必起來照他所需用的給他</mark></strong>。 我又告訴你們：<strong><mark>你們祈求，就給你們</mark></strong>；尋找，就尋見；叩門，就給你們開門。 因爲，凡祈求的，就得著；尋找的，就尋見；叩門的，就給他開門。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L5-10">路 11:5-10</a>)</p></blockquote><h3>施捨（對有需要之人的實際幫助）</h3><blockquote><p>“<strong>祈禱與齋戒固然是善功</strong>，但秉義施捨卻超過前二者；秉義而少有，勝於不義而多有；<strong>施捨救濟，勝於儲蓄黃金</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/tov/12/#L8">多 12:8</a>)</p></blockquote><blockquote><p>“（大衛的詩，交與伶長。）<strong><mark>眷顧貧窮的有福了</mark></strong>；他遭難的日子，耶和華必搭救他。 <strong><mark>耶和華必保全他，使他存活</mark></strong>；他必在地上享福，求你不要把他交給仇敵，遂其所願。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/41/#L1-2">詩 41:1-2</a>)</p></blockquote><blockquote><p>“<strong><mark>憐憫貧窮的，就是借給耶和華</mark></strong>，他的善行，耶和華必償還。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/19/#L17">箴 19:17</a>)</p></blockquote><blockquote><p>“<strong><mark>你們舉手禱告，我必遮眼不看</mark></strong>；就是你們多多的祈禱，我也不聽。你們的手都滿了殺人的血。 你們要洗濯、自潔，從我眼前除掉你們的惡行；要止住作惡， <strong><mark>學習行善，尋求公平，解救受欺壓的，給孤兒伸冤，爲寡婦辨屈</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/1/#L15-17">賽 1:15-17</a>)</p></blockquote><blockquote><p>“哥尼流定睛看他，驚怕說：「主啊，什麼事呢？」天使說：「<strong><mark>你的禱告和你的賙濟達到上帝面前已，蒙記念了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/10/#L4">徒 10:4</a>)</p></blockquote><h3>齋戒</h3><blockquote><p>“耶和華說：「雖然如此，<strong><mark>你們應當禁食，哭泣、悲哀，一心歸向我</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iol/2/#L12">珥 2:12</a>)</p></blockquote><blockquote><p>“<strong><mark>我便禁食，披麻蒙灰，定意向主上帝祈禱懇求</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/9/#L3">但 9:3</a>)</p></blockquote><blockquote><p>“<strong><mark>於是禁食禱告</mark></strong>，按手在他們頭上，就打發他們去了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/act/13/#L3">徒 13:3</a>)</p></blockquote><blockquote><p>“<strong><mark>我因禁食，膝骨軟弱</mark></strong>；我身上的肉也漸漸瘦了。 &lt;…&gt; 耶和華我的上帝阿，求你幫助我，照你的慈愛拯救我。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/109/#L24,26">詩 109:24,26</a>)</p></blockquote><h3>沒有虛僞</h3><blockquote><p>“你們禱告的時候，<strong><mark>不可像那假冒爲善的人</mark></strong>，愛站在會堂裏和十字路口上禱告，<strong><mark>故意叫人看見</mark></strong>。我實在告訴你們，<strong><mark>他們已經得了他們的賞賜</mark></strong>。 你禱告的時候，要進你的內屋，關上門，<strong><mark>禱告你在暗中的父</mark></strong>，你父在暗中察看，必然報答你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L5-6">太 6:5-6</a>)</p></blockquote><h3>沒有空虛的多言</h3><p>上面已經說到，需要恆常的祈禱、在祈禱中的堅持和忍耐（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L1-7">路 18:1-7</a>）。但上帝不是被話語重複的頻度安撫的。祈禱必須與上面列舉的一切結合：信心、公義、蒙上帝喜悅的行爲、遠離罪惡、清潔的心、饒恕委屈、與鄰人和睦等等。而外邦人<strong>不改變自己</strong>和自己的生活，指望喊叫到他們的神那裏；那些神彷彿在睡覺，所以彷彿需要更大聲、更頻繁地喊叫（見<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/18/#L26-28">王上 18:26-28</a>）。</p><blockquote><p>“你們禱告，不可像外邦人，<strong><mark>用許多重複話</mark></strong>，他們以爲話多了必蒙垂聽。 <strong><mark>你們不可效法他們</mark></strong>，因爲你們沒有祈求以先，你們所需用的，你們的父早已知道了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L7-8">太 6:7-8</a>)</p></blockquote><p>主耶穌基督自己常常整夜祈禱，有時也重複自己的祈禱：</p><blockquote><p>“耶穌又去禱告，<strong><mark>說的話還是與先前一樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L39">可 14:39</a>)</p></blockquote><h2>上帝按自己的旨意賜下</h2><blockquote><p>“你們求也得不著，<strong><mark>是因爲你們妄求</mark></strong>，要浪費在你們的宴樂中。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L3">雅 4:3</a>)</p></blockquote><blockquote><p>“<strong><mark>我們若照他的旨意求什麼，他就聽我們</mark></strong>，這是我們向他所存坦然無懼的心。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L14">約壹 5:14</a>)</p></blockquote><blockquote><p>“<strong><mark>你們若常在我裏面</mark></strong>，<strong><mark>我的話也常在你們裏面</mark></strong>，凡你們所願意的，祈求就給你們成就。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L7">約 15:7</a>)</p></blockquote><blockquote><p>“你們中間誰有兒子求餅，反給他石頭呢？ 求魚，反給他蛇呢？ 你們雖然不好，尚且知道拿好東西給兒女，<strong><mark>何況你們在天上的父，豈不更把好東西給求他的人嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/7/#L9-11">太 7:9-11</a>)</p></blockquote><h2>私下的祈禱</h2><blockquote><p>“你禱告的時候，<strong><mark>要進你的內屋，關上門</mark></strong>，<strong><mark>禱告你在暗中的父</mark></strong>，你父在暗中察看，必然報答你。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L6">太 6:6</a>)</p></blockquote><h2>共同的祈禱</h2><blockquote><p>“我又告訴你們：<strong><mark>若是你們中間有兩個人在地上同心合意的求什麼事</mark></strong>，我在天上的父必爲他們成全。 因爲無論在那裏，<strong><mark>有兩三個人奉我的名聚會，那裏就有我在他們中間</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L19-20">太 18:19-20</a>)</p></blockquote><h2>爲他人的祈禱</h2><h3>爲鄰人和教會祈禱</h3><blockquote><p>“所以你們要彼此認罪，<strong><mark>互相代求</mark></strong>，使你們可以得醫治。<strong><mark>義人祈禱所發的力量是大有功效的</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L16">雅 5:16</a>)</p></blockquote><blockquote><p>“<strong><mark>也要爲我們禱告</mark></strong>，求上帝給我們開傳道的門，能以講基督的奧祕（我爲此被捆鎖），” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/kol/4/#L3">西 4:3</a>)</p></blockquote><blockquote><p>“<strong><mark>請弟兄們爲我們禱告</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L25">帖前 5:25</a>)</p></blockquote><blockquote><p>“弟兄們，我還有話說：<strong><mark>請你們爲我們禱告</mark></strong>，好叫主的道理快快行開，得著榮耀，正如在你們中間一樣；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/3/#L1">帖後 3:1</a>)</p></blockquote><blockquote><p>“<strong><mark>請你們爲我們禱告</mark></strong>，因我們自覺良心無虧，願意凡事按正道而行。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/13/#L18">希 13:18</a>)</p></blockquote><blockquote><p>“即使我們軟弱，你們剛強，我們也歡喜，並且<strong><mark>我們所求的，就是你們作完全人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/13/#L9">林後 13:9</a>)</p></blockquote><blockquote><p>“因此，<strong><mark>我們常爲你們禱告</mark></strong>，願我們的上帝看你們配得過所蒙的召，又用大能成就你們一切所羨慕的良善和一切因信心所作的工夫；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2sol/1/#L11">帖後 1:11</a>)</p></blockquote><blockquote><p>“<strong><mark>你們以祈禱幫助我們</mark></strong>，好叫許多人爲我們謝恩，就是爲我們因許多人所得的恩。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/1/#L11">林後 1:11</a>)</p></blockquote><h3>爲委屈我們的人祈禱</h3><blockquote><p>“只是我告訴你們：<strong><mark>要愛你們的仇敵，爲那逼迫你們的禱告</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/5/#L44">太 5:44</a>)</p></blockquote><blockquote><p>“<strong><mark>咒詛你們的，要爲他祝福</mark></strong>！<strong><mark>凌辱你們的，要爲他禱告</mark></strong>！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L28">路 6:28</a>)</p></blockquote><h3>爲犯非致死之罪的人祈禱</h3><blockquote><p>“<strong><mark>人若看見弟兄犯了不至於死的罪，就當爲他祈求</mark></strong>，上帝必將生命賜給他；<strong><mark>有至於死的罪，我不說當爲這罪祈求</mark></strong>。 凡不義的事都是罪，也有不至於死的罪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L16-17">約壹 5:16-17</a>)</p></blockquote><h3>教會的祈禱赦免人的罪</h3><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名用油抹他，爲他禱告。 出於信心的祈禱要救那病人，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。 所以你們要彼此認罪，<strong><mark>互相代求，使你們可以得醫治</mark></strong>。義人祈禱所發的力量是大有功效的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-16">雅 5:14-16</a>)</p></blockquote>
