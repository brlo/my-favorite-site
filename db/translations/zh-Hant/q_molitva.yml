  title: 叩拜
  copy_cover: true
  body: <h2>向聖殿叩拜</h2><p>向<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">聖殿</a>叩拜——殿中佈滿基路伯的聖潔<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм#HH-Изображения">像</a>：</p><blockquote><p>“至於我，我必憑你豐盛的慈愛，進入你的居所；我必存敬畏你的心，<strong><mark>向你的聖殿下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/5/#L7">詩 5:7</a>)</p></blockquote><blockquote><p>“<strong><mark>我要向你的聖殿下拜</mark></strong>，爲你的慈愛和誠實稱讚你的名；因你使你的話顯爲大，過於你所應許的。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/138/#L2">詩 138:2</a>)</p></blockquote><h2>向上帝的腳凳（聖殿）叩拜</h2><blockquote><p>“你們當尊崇耶和華我們的上帝，<strong><mark>在他腳凳前下拜</mark></strong>；他本爲聖！” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/99/#L5">詩 99:5</a>)</p></blockquote><blockquote><p>“<strong><mark>我們要進他的居所，在他腳凳前下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/132/#L7">詩 132:7</a>)</p></blockquote><h2>向約櫃叩拜</h2><p>先知約書亞在約櫃前叩拜——櫃的施恩座上有基路伯的像，櫃內有聖物：</p><blockquote><p>“約書亞便撕裂衣服；他和以色列的長老把灰撒在頭上，在耶和華的約櫃前，<strong><mark>俯伏在地，直到晚上</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/7/#L6">書 7:6</a>)</p></blockquote><h2>向以三人形像顯現的上帝叩拜</h2><p>亞伯拉罕向以三個人形像顯現的上帝叩拜：</p><blockquote><p>“耶和華在幔利橡樹那裏，<strong><mark>向亞伯拉罕顯現出來</mark></strong>。那時正熱，亞伯拉罕坐在帳棚門口， 舉目觀看，<strong><mark>見有三個人在對面站著</mark></strong>。他一見，就從帳棚門口跑去迎接他們，<strong><mark>俯伏在地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/18/#L1-2">創 18:1-2</a>)</p></blockquote><p>上帝爲什麼以形像顯現？——因爲上帝在本性上是看不見的，從來沒有人見過他（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1tim/6/#L16">提前 6:16</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/1/#L18">約 1:18</a>）。然而聖經說的是上帝顯現（希伯來文 יְהוָ֔ה——雅威）。</p><h2>向物件叩拜</h2><p>向杖：經上記著“以色列在牀頭上敬拜”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/47/#L31">創 47:31</a>），而在七十士譯本里是“在杖頭上”（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/11/#L21">希 11:21</a>）。</p><h2>向天使叩拜</h2><p>先要指出：天使是靈（<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/1/#L13-14">希 1:13-14</a>），而靈沒有骨和肉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/24/#L39">路 24:39</a>），也就是說，天使也是以人的形像向人顯現的。所以，向天使叩拜，就是<strong>向看不見的靈（天使）的看得見之像叩拜</strong>：</p><blockquote><p>“他回答說：「不是的，我來是要作耶和華軍隊的元帥。」<strong><mark>約書亞就俯伏在地下拜</mark></strong>，說：「我主有什麼話吩咐僕人？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/nav/5/#L14">書 5:14</a>)</p></blockquote><blockquote><p>“那兩個天使晚上到了所多瑪。<strong><mark>羅得正坐在所多瑪城門口</mark></strong>，看見他們，就起來迎接，<strong><mark>臉伏於地下拜</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/19/#L1">創 19:1</a>)</p></blockquote><blockquote><p>“見火焰從壇上往上升，耶和華的使者在壇上的火焰中也升上去了。<strong><mark>瑪挪亞和他的妻看見，就俯伏於地</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/sud/13/#L20">士 13:20</a>)</p></blockquote><blockquote><p>“我卻聽見他說話的聲音，一聽見就<strong><mark>面伏在地沉睡</mark></strong>了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/10/#L9">但 10:9</a>)</p></blockquote><blockquote><p>“他向我這樣說，<strong><mark>我就臉面朝地，啞口無聲</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/10/#L15">但 10:15</a>)</p></blockquote><h2>向先知叩拜</h2><p><strong>向以利沙</strong>：</p><blockquote><p>“住耶利哥的<strong><mark>先知門徒</mark></strong>從對面看見他，就說：「感動以利亞的靈感動以利沙了。」他們就來迎接他，<strong><mark>在他面前俯伏於地</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/4ts/2/#L15">王下 2:15</a>)</p></blockquote><p><strong>向以利亞</strong>：</p><blockquote><p>“俄巴底在路上恰與以利亞相遇，<strong><mark>俄巴底認出他來，就俯伏在地</mark></strong>，說：「你是我主以利亞不是？」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/18/#L7">王上 18:7</a>)</p></blockquote><p><strong>向但以理</strong>：</p><blockquote><p>“當時，<strong><mark>尼布甲尼撒王俯伏在地，向但以理下拜</mark></strong>，並且吩咐人給他奉上供物和香品。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/dan/2/#L46">但 2:46</a>)</p></blockquote><p><strong>向撒母耳</strong>：</p><blockquote><p>“掃羅說：「他是怎樣的形狀？」婦人說：「有一個老人上來，身穿長衣。」<strong><mark>掃羅知道是撒母耳，就屈身，臉伏於地下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/28/#L14">撒上 28:14</a>)</p></blockquote><p><strong>向亞比該</strong>（原文如此：叩拜的是亞比該，向大衛）：</p><blockquote><p>“亞比該見大衛，便急忙下驢，<strong><mark>在大衛面前臉伏於地叩拜</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/25/#L23">撒上 25:23</a>)</p></blockquote><h2>向民衆叩拜</h2><blockquote><p>“<strong><mark>亞伯拉罕就在那地的人民面前下拜</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/23/#L12">創 23:12</a>)</p></blockquote><h2>向弟兄叩拜</h2><blockquote><p>“他自己在他們前頭過去，<strong><mark>一連七次俯伏在地</mark></strong>，才就近他哥哥。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/33/#L3">創 33:3</a>)</p></blockquote><blockquote><p>“當時治理埃及地的是約瑟，糶糧給那地衆民的就是他。<strong><mark>約瑟的哥哥們來了，臉伏於地，向他下拜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/gen/42/#L6">創 42:6</a>)</p></blockquote><h2>向岳父叩拜</h2><blockquote><p>“<strong><mark>摩西迎接他的岳父，向他下拜</mark></strong>，與他親嘴，彼此問安，都進了帳棚。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/18/#L7">出 18:7</a>)</p></blockquote>
