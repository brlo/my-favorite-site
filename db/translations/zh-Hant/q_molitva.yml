  title: 站著祈禱
  copy_cover: true
  body: <h2>上帝稱舊約的聖殿爲祈禱的殿</h2><blockquote><p>“我必領他們到我的聖山，使他們在禱告我的殿中喜樂。他們的燔祭和平安祭，在我壇上必蒙悅納。因<strong><mark>我的殿必稱爲萬民禱告的殿</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/56/#L7">賽 56:7</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L13">太 21:13</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/11/#L17">可 11:17</a>)</p></blockquote><p>聖殿的構造沒有設座位。<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">聖殿的詳細構造</a>。</p><h2>在聖殿裏是站著祈禱的</h2><blockquote><p>“於是猶大人聚會，求耶和華幫助，猶大各城都有人出來尋求耶和華。 &lt;…&gt; <strong><mark>猶大衆人和他們的嬰孩、妻子、兒女，都站在耶和華面前</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/20/#L4,13">代下 20:4,13</a>)</p></blockquote><blockquote><p>“摩西又對可拉說：「利未的子孫哪，你們聽我說！ 以色列的上帝從以色列會中將你們分別出來，使你們親近他，辦耶和華帳幕的事，<strong><mark>並站在會衆面前替他們當差</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/16/#L8-9">民 16:8-9</a>)</p></blockquote><h2>事奉上帝的被造物被描繪爲站立的</h2><blockquote><p>“<strong><mark>兩個基路伯張開翅膀，共長二十肘，面向外殿而立</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/3/#L13">代下 3:13</a>)</p></blockquote><h2>命令使徒站起來祈禱</h2><blockquote><p>“有一位天使從天上顯現，加添他的力量。 耶穌極其傷痛，禱告更加懇切，汗珠如大血點滴在地上。 禱告完了，就起來，到門徒那裏，見他們因爲憂愁都睡著了， 就對他們說：「你們爲什麼睡覺呢？<strong><mark>起來禱告，免得入了迷惑</mark></strong>！」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/22/#L43-46">路 22:43-46</a>)</p></blockquote><p>“起來”一詞也可以理解爲“從睡夢中醒來”。然而，這一處之所以重要，還在於它顯明基督自己帶著極大的勞苦和如血滴般的汗珠祈禱。</p>
