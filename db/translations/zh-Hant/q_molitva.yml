- src: молитвы-за-умерших
  path: QM2T_爲亡者祈禱
  title: 爲亡者祈禱
  copy_cover: true
  body: <h2>前言</h2><p>爲亡者祈求某種憐憫，這是愛心之舉，即被對上帝和對鄰人的愛所引導之人的舉動。我們不知道主對於某一個爲亡者所發的祈求會怎樣決定，然而我們有盼望的依據，也有促使我們關懷的愛。這依據是什麼？依據——是上帝的啟示，我們從其中得知：上帝是全能的，他掌握著死亡和陰間的「鑰匙」；有些罪甚至在未來的世代也不會被赦免（由此可以明白，還有別的罪）；上帝曾呼召我們以各種不同的祈求來到他面前。我們也知道，罪人所受的刑罰不是<a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">一樣的尺度</a>，義人的福樂也不是一樣的程度；所以即使一個人不能得救，我們也盼望他的命運得到減輕。在舊約里人們就關懷亡者（見<a href="https://bibleox.com/ru/ru/w/молитвы-за-умерших#HH-Ветхий-Завет-Забота-о-прощении-грехов-умерших">下文</a>），最早的基督徒也關懷他們（詳見<a href="https://bibleox.com/ru/ru/w/91USaqiJ_молитвы_за_умерших">爲亡者的祈禱</a>）。</p><p>促使這一切的，是那“永不止息”的愛（<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>）。</p><h2>上帝是全能的</h2><blockquote><p>“「我是耶和華，是凡有血氣者的上帝，<strong><mark>豈有我難成的事嗎</mark></strong>？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/32/#L27">耶 32:27</a>)</p></blockquote><p>其他引文：<a href="https://bibleox.com/ru/ru/w/Бог-всемогущий">全能的上帝</a></p><h2>上帝應許：遵守誡命的人，凡憑信心所求的都必得著</h2><blockquote><p>“<strong><mark>並且我們一切所求的，就從他得著</mark></strong>，因爲我們遵守他的命令，行他所喜悅的事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/3/#L22">約壹 3:22</a>)</p></blockquote><blockquote><p>“<strong><mark>既然知道他聽我們一切所求的</mark></strong>，就知道我們所求於他的，無不得著。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L15">約壹 5:15</a>)</p></blockquote><blockquote><p>“你們禱告，無論求什麼，<strong><mark>只要信，就必得著</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/21/#L22">太 21:22</a>)</p></blockquote><blockquote><p>“我又告訴你們：若是你們中間有兩個人在地上同心合意的求什麼事，<strong><mark>我在天上的父必爲他們成全</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/18/#L19">太 18:19</a>)</p></blockquote><blockquote><p>“不是你們揀選了我，是我揀選了你們；並且分派你們去結果子，叫你們的果子常存；<strong><mark>使你們奉我的名，無論向父求什麼，他就賜給你們</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/in/15/#L16">約 15:16</a>)</p></blockquote><p>這些話是在爲犯了罪的弟兄得救而祈禱的語境裏說的——上帝因義人的祈禱拯救他們：</p><blockquote><p>“既然知道<strong><mark>他聽我們一切所求的</mark></strong>，就知道我們所求於他的，無不得著。 人若看見弟兄犯了不至於死的罪，<strong><mark>就當爲他祈求</mark></strong>，<strong><mark>上帝必將生命賜給他</mark></strong>；有至於死的罪，我不說當爲這罪祈求。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1in/5/#L15-16">約壹 5:15-16</a>)</p></blockquote><h2>罪可以藉教會的祈禱得赦免</h2><p>這就是說，罪得到赦免不僅是在人自己悔改、自己求赦免的時候，也是在別人爲人求赦免的時候：</p><blockquote><p>“你們中間有病了的呢，他就<strong><mark>該請教會的長老來</mark></strong>，他們可以奉主的名用油抹他，爲他禱告。 出於信心的祈禱要救那病人，主必叫他起來；<strong><mark>他若犯了罪，也必蒙赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/5/#L14-15">雅 5:14-15</a>)</p></blockquote><p>癱瘓者的朋友們費了很大的力氣才把朋友帶到基督面前。主因他們的信心赦免了癱瘓者的罪，並醫治了他：</p><blockquote><p>“<strong><mark>耶穌見他們的信心</mark></strong>，就對癱子說：「<strong><mark>小子，你的罪赦了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/2/#L5">可 2:5</a>)</p></blockquote><h2>罪甚至在死後也可以得到赦免</h2><p>從主耶穌基督的話可以得出：罪的赦免不僅在這一世，也在未來的世代是可能的。有這樣的罪，它們現在和將來都不會被赦免：</p><blockquote><p>“所以我告訴你們：人一切的罪和褻瀆的話，都可得赦免；惟獨褻瀆聖靈，總不得赦免。 凡說話干犯人子的，還可得赦免；<strong><mark>惟獨說話干犯聖靈的，今世、來世總不得赦免</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/12/#L31-32">太 12:31-32</a>)</p></blockquote><h2>基督掌握著死亡和陰間的鑰匙</h2><blockquote><p>“我一看見，就仆倒在他腳前，像死了一樣。他用右手按著我說：「不要懼怕！我是首先的，我是末後的， 又是那存活的。我曾死過，現在又活了，直活到永永遠遠，<strong><mark>並且拿著死亡和陰間的鑰匙</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/1/#L17-18">啟 1:17-18</a>)</p></blockquote><h2>舊約：關懷亡者罪的赦免</h2><h3>爲亡者齋戒</h3><p>以色列人爲已故的王掃羅、他的兒子們和陣亡的以色列人齋戒：</p><blockquote><p>“<strong><mark>這樣掃羅和他三個兒子，與拿他兵器的人，以及跟隨他的人，都一同死亡</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/31/#L6">撒上 31:6</a>)</p></blockquote><blockquote><p>“將他們骸骨葬在雅比的垂絲柳樹下，<strong><mark>就禁食七日</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1ts/31/#L13">撒上 31:13</a>)</p></blockquote><blockquote><p>“<strong><mark>而且悲哀、哭號、禁食到晚上</mark></strong>，是因掃羅和他兒子約拿單，並耶和華的民以色列家的人，倒在刀下。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2ts/1/#L12">撒下 1:12</a>)</p></blockquote><h3>爲亡者祈禱和獻祭</h3><p>猶太人爲陣亡的戰士祈禱，求他們的罪得赦免。又送銀子到耶路撒冷聖殿，爲亡者獻上贖罪祭，使他們從罪中得潔淨：</p><blockquote><p>“事後，猶大率領兵馬，到了阿杜藍城；因爲已到第七日，他們就在那裏照例自潔，過了安息日。第二天，由於事不宜遲，猶大的部隊便出去收殮陣亡的屍體，好把他們安葬在祖墳裏，與親族在一起。當時在每個死者的內衣下，發現都有雅木尼雅偶像的符籙，這原是法律禁止佩帶的；衆人便都明白這正是他們陣亡的原因。於是衆人稱讚秉公審判及揭示隱密的上主，同心哀禱，<strong>求使所犯過惡，得以完全赦免</strong>。隨後，英勇的猶大勸勉民衆避免犯罪，因爲人都親眼看見這些陣亡者因罪所受的罰。於是大衆募集了二千銀“達瑪”，送到耶路撒冷作贖罪祭的獻儀：<strong>他作的是一件很美妙高超的事，因爲他想念著復活</strong>；如果他不希望那些死過的人還要復活，<strong>爲亡者祈禱，便是一種多餘而糊塗的事</strong>。何況，他還想到爲那些善終的人保留下的超等報酬：這實在是一個聖善而虔誠的思想。<strong>爲此，他爲亡者獻贖罪祭，是爲叫他們獲得罪赦</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/2mak/12/#L38-45">加下 12:38-45</a>)</p></blockquote><h3>爲亡者施捨</h3><p>猶太人爲亡者的緣故行施捨：</p><blockquote><p>“你當全靈恭敬上主，尊敬司祭，並依照定例，給他所應得的一分：即首批成熟的出產，贖罪的祭品，平安犧牲的右腿，聖潔的祭物，和高尚的獻儀。你要用少許祭品，洗淨你無心的過犯。你應將平安犧牲的一切胳臂，聖潔的祭品，與貴重的獻儀，都獻給上主。應向窮人伸手施惠，好使你的祝福和憐憫，完備無缺。<strong>對一切活人，要施與恩惠；對於死者，不要禁止哀悼</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/7/#L37">德 7:37</a>)</p></blockquote><blockquote><p>“<strong>把你的酒和食物倒在義人的墳墓上</strong>，也不可施與惡人。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/tov/4/#L17">多 4:17</a>)</p></blockquote><p>爲亡者的施捨不是從什一之物中拿的：</p><blockquote><p>“每逢三年，就是十分取一之年，你取完了一切土產的十分之一，要分給利未人和寄居的與孤兒寡婦，使他們在你城中可以吃得飽足。 你又要在耶和華你上帝面前說：『我已將聖物從我家裏拿出來，給了利未人和寄居的與孤兒寡婦，是照你所吩咐我的一切命令。你的命令我都沒有違背，也沒有忘記。 我守喪的時候，沒有吃這聖物；不潔淨的時候，也沒有拿出來；<strong><mark>又沒有爲死人送去</mark></strong>。我聽從了耶和華我上帝的話，都照你所吩咐的行了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/26/#L12-14">申 26:12-14</a>)</p></blockquote><h2>在上帝那裏，人人都是活著的</h2><p>以上引文表明猶太人的信仰和他們具體的實踐。他們爲亡者罪的赦免祈禱，爲亡者齋戒，爲亡者獻祭，爲亡者施捨，總的來說關懷他們的身後之事。只有撒都該人否認死後的存在——主責備他們的謬誤和對聖經的無知：</p><blockquote><p>“耶穌回答說：「<strong><mark>你們錯了，因爲不明白聖經，也不曉得上帝的大能</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/22/#L29">太 22:29</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝不是死人的上帝，乃是活人的上帝</mark></strong>。<strong><mark>你們是大錯了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L27">可 12:27</a>)</p></blockquote><h2>盼望亡者得到各種幫助</h2><p>即使某個人已經不能從陰間得救，也仍然可以減輕他的痛苦，在現在或將來（在普遍的復活和審判之後）給予某種安慰，因爲刑罰的尺度不是一樣的：</p><blockquote><p>“僕人知道主人的意思，卻不預備，又不順他的意思行，<strong><mark>那僕人必多受責打</mark></strong>； 惟有那不知道的，作了當受責打的事，<strong><mark>必少受責打</mark></strong>。因爲多給誰，就向誰多取；<strong><mark>多托誰，就向誰多要</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/12/#L47-48">路 12:47-48</a>)</p></blockquote><p>關於刑罰之差異的更多引文：<a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">刑罰的尺度不是一樣的</a></p>
