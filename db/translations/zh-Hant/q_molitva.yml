- src: молитва-не-своими-словами
  path: QM4T_按範本祈禱
  title: 按範本祈禱
  copy_cover: true
  body: <h2>按範本祈禱</h2><p>舊約裏有一部偉大的、受上帝默感的祈禱書——詩篇。它由先知兼君王大衛寫成。它曾在聖殿中使用，詩篇是人們在登上臺階時唱的。</p><p>當使徒們求主教他們祈禱時，他們所依據的是：先知施洗約翰已經教導過自己的門徒祈禱：</p><blockquote><p>“耶穌在一個地方禱告。禱告完了，有個門徒對他說：「<strong><mark>求主教導我們禱告</mark></strong>，<strong><mark>像約翰教導他的門徒</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L1">路 11:1</a>)</p></blockquote><p>之後基督賜下祈禱的範本——用他自己的話：</p><blockquote><p>“耶穌說：「<strong><mark>你們禱告的時候，要說</mark></strong>：我們在天上的父〔有古卷只作『父阿』〕：願人都尊你的名爲聖。願你的國降臨，願你的旨意行在地上，如同行在天上〔有古卷沒有『願你的旨意云云』〕。 我們日用的飲食，天天賜給我們。 <strong><mark>赦免我們的罪</mark></strong>，因爲我們也赦免凡虧欠我們的人。不叫我們遇見試探；救我們脫離兇惡〔有古卷無末句〕。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L2-4">路 11:2-4</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L9-13">太 6:9-13</a>)</p></blockquote><p>就是說，給出祈禱文、按範本（規矩）祈禱——這是完全正常的，是聖經的實踐。</p>
  meta_desc: 按範本祈禱
