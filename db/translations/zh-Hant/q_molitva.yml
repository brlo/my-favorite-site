  path: QM5T_祈禱可長可短
  title: 祈禱可長可短
  copy_cover: true
  body: <h2>祈禱可以是長的</h2><h3>常常祈禱的命令</h3><blockquote><p>“要常常喜樂， <strong><mark>不住的禱告</mark></strong>， <strong><mark>凡事謝恩</mark></strong>，因爲這是上帝在基督耶穌裏向你們所定的旨意。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1sol/5/#L16-18">帖前 5:16-18</a>)</p></blockquote><blockquote><p>“靠著聖靈，<strong><mark>隨時多方禱告祈求</mark></strong>，並要在此儆醒不倦，爲衆聖徒祈求，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ef/6/#L18">弗 6:18</a>)</p></blockquote><h3>主耶穌基督的祈禱極其長久</h3><p>他整夜祈禱：</p><blockquote><p>“那時，耶穌出去，上山禱告，<strong><mark>整夜禱告上帝</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/6/#L12">路 6:12</a>)</p></blockquote><p>他從傍晚祈禱到幾乎清晨。夜分爲四更；第四更是夜的最後一段，幾乎已是早晨。基督祈禱了幾乎整夜：</p><blockquote><p>“散了衆人以後，<strong><mark>他就獨自上山去禱告</mark></strong>。<strong><mark>到了晚上，只有他一人在那裏</mark></strong>。 &lt;…&gt; <strong><mark>夜裏四更天</mark></strong>，耶穌在海面上走，往門徒那裏去。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/14/#L23,25">太 14:23,25</a>)</p></blockquote><p>基督在自己的祈禱過一個小時之後來叫醒使徒們，這樣重複了兩次。可以推測，他祈禱了約三個小時：</p><blockquote><p>“他們來到一個地方，名叫客西馬尼。耶穌對門徒說：「你們坐在這裏，<strong><mark>等我禱告</mark></strong>。」 &lt;…&gt; 他就稍往前走，<strong><mark>俯伏在地，禱告說</mark></strong>：「倘若可行，便叫那時候過去。」 &lt;…&gt; 耶穌回來，見他們睡著了，就對彼得說：「西門，你睡覺嗎？<strong><mark>不能儆醒片時嗎</mark></strong>？ &lt;…&gt; <strong><mark>耶穌又去禱告</mark></strong>，說的話還是與先前一樣。 又來見他們睡著了，因爲他們的眼睛甚是睏倦；他們也不知道怎麼回答。 <strong><mark>第三次來</mark></strong>，對他們說：「現在你們仍然睡覺安歇吧！夠了，時候到了。看哪，人子被賣在罪人手裏了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L32,35,37,39-41">可 14:32,35,37,39-41</a>)</p></blockquote><h3>比喻</h3><p>在賜下祈禱的範本——“我們在天上的父”——之後，主隨即講了關於在祈禱中堅持和忍耐的比喻：</p><blockquote><p>“耶穌又說：「你們中間誰有一個朋友半夜到他那裏去，說：『朋友！請借給我三個餅； 因爲我有一個朋友行路，來到我這裏，我沒有什麼給他擺上。』 那人在裏面回答說：『不要攪擾我，門已經關閉，孩子們也同我在牀上了，我不能起來給你。』 我告訴你們，雖不因他是朋友起來給他，<strong><mark>但因他情詞迫切的直求，就必起來照他所需用的給他</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/11/#L5-8">路 11:5-8</a>)</p></blockquote><p>寡婦和法官的比喻：</p><blockquote><p>“耶穌設一個比喻，是<strong><mark>要人常常禱告，不可灰心</mark></strong>。 說：「某城裏有一個官，不懼怕上帝，也不尊重世人。 那城裏有個寡婦，常到他那裏，說：『我有一個對頭，求你給我伸冤。』 他多日不準。後來心裏說：『我雖不懼怕上帝，也不尊重世人， 只因這寡婦煩擾我，我就給他伸冤吧．免得她常來纏磨我！』」 主說：「你們聽這不義之官所說的話。 <strong><mark>上帝的選民晝夜呼籲他</mark></strong>，他縱然爲他們忍了多時，豈不終久給他們伸冤嗎？” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L1-7">路 18:1-7</a>)</p></blockquote><h2>祈禱可以是短的</h2><p>在講了關於恆常和堅持祈禱的比喻之後，主又講了那個稅吏的短禱蒙他喜悅的比喻；不過如福音史家所說明，這個比喻講的是那些自以爲義的人。最終，基督直接指出稅吏蒙上帝喜悅之處：對自己和自己的義看得很低：</p><blockquote><p>“耶穌向那些<strong><mark>仗著自己是義人，藐視別人的</mark></strong>，設一個比喻， 說：「有兩個人上殿裏去禱告：一個是法利賽人，一個是稅吏。 法利賽人站著，自言自語的禱告說：『上帝啊，我感謝你，我不像別人勒索、不義、姦淫，也不像這個稅吏。 我一個禮拜禁食兩次，凡我所得的都捐上十分之一。』 <strong><mark>那稅吏遠遠的站著，連舉目望天也不敢</mark></strong>，只捶著胸說：『<strong><mark>上帝啊，開恩可憐我這個罪人</mark></strong>！』 我告訴你們：這人回家去比那人倒算爲義了。因爲<strong><mark>凡自高的，必降爲卑；自卑的，必升爲高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L9-14">路 18:9-14</a>)</p></blockquote><h2>對異議的回應</h2><h3>不可用許多重複話</h3><p>在馬太福音裏，“我們在天上的父”祈禱之前記著基督的話：祈禱中不必說多餘的話：</p><blockquote><p>“你們禱告，不可像外邦人，<strong><mark>用許多重複話</mark></strong>，他們以爲話多了必蒙垂聽。 <strong><mark>你們不可效法他們</mark></strong>，因爲你們沒有祈求以先，你們所需用的，你們的父早已知道了。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/6/#L7-8">太 6:7-8</a>)</p></blockquote><p>主耶穌基督自己常常整夜祈禱，有時也重複自己的話：</p><blockquote><p>“耶穌又去禱告，<strong><mark>說的話還是與先前一樣</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/14/#L39">可 14:39</a>)</p></blockquote>
