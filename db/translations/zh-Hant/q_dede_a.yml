  title: 愛
  copy_cover: true
  body: <h2>愛上帝與愛近人——最大的誡命</h2><blockquote><p>“耶穌回答說：「第一要緊的就是說：『以色列啊，你要聽！主我們上帝是獨一的主。 <strong><mark>你要盡心、儘性、盡意、盡力愛主你的上帝</mark></strong>。』 其次就是說：『<strong><mark>要愛人如己</mark></strong>。』<strong><mark>再沒有比這兩條誡命更大的了</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mk/12/#L29-31">可 12:29-31</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/6/#L5">申 6:5</a>; <a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/19/#L18">利 19:18</a>)</p></blockquote><blockquote><p>“有一個律法師起來試探耶穌，說：「夫子，<strong><mark>我該作什麼纔可以承受永生</mark></strong>？」 耶穌對他說：「律法上寫的是什麼？你念的是怎樣呢？」 他回答說：「<strong><mark>你要盡心、儘性、盡力、盡意愛主你的上帝</mark></strong>；<strong><mark>又要愛鄰舍如同自己</mark></strong>。」 耶穌說：「<strong><mark>你回答的是。你這樣行，就必得永生</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/10/#L25-28">路 10:25-28</a>)</p></blockquote><h2>愛高過一切</h2><blockquote><p>“<strong><mark>我若</mark></strong>能說萬人的方言，並天使的話語，<strong><mark>卻沒有愛</mark></strong>，我就成了鳴的鑼、響的鈸一般。 我若有先知講道之能，也明白各樣的奧祕、各樣的知識，而且有全備的信，叫我能夠移山，卻沒有愛，<strong><mark>我就算不得什麼</mark></strong>。 我若將所有的賙濟窮人，又捨己身叫人焚燒，卻沒有愛，仍然與我無益。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L1-3">林前 13:1-3</a>)</p></blockquote><blockquote><p>“愛情，衆水不能息滅，大水也不能淹沒，<strong><mark>若有人拿家中所有的財寶要換愛情，就全被藐視</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pp/8/#L7">歌 8:7</a>)</p></blockquote><h2>愛是永恆的</h2><blockquote><p>“<strong><mark>愛是永不止息</mark></strong>。先知講道之能，終必歸於無有；說方言之能，終必停止；知識也終必歸於無有。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L8">林前 13:8</a>)</p></blockquote><blockquote><p>“求你將我放在心上如印記，帶在你臂上如戳記；因爲<strong><mark>愛情如死之堅強</mark></strong>，嫉恨如陰間之殘忍。<strong><mark>所發的電光，是火焰的電光，是耶和華的烈焰</mark></strong>。 愛情，<strong><mark>衆水不能息滅，大水也不能淹沒</mark></strong>，<strong><mark>若有人拿家中所有的財寶要換愛情，就全被藐視</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pp/8/#L6-7">歌 8:6-7</a>)</p></blockquote><h2>愛可以是怎樣的</h2><blockquote><p>“<strong><mark>愛是恆久忍耐</mark></strong>，<strong><mark>又有恩慈</mark></strong>；<strong><mark>愛是不嫉妒</mark></strong>，<strong><mark>愛是不自誇，不張狂</mark></strong>， <strong><mark>不作害羞的事</mark></strong>，<strong><mark>不求自己的益處</mark></strong>，<strong><mark>不輕易發怒</mark></strong>，<strong><mark>不計算人的惡</mark></strong>， <strong><mark>不喜歡不義，只喜歡真理</mark></strong>； <strong><mark>凡事包容，凡事相信，凡事盼望，凡事忍耐</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/13/#L4-7">林前 13:4-7</a>)</p></blockquote><blockquote><p>“我兒，你不可輕看耶和華的管教，也不可厭煩他的責備。 <strong><mark>因爲耶和華所愛的，他必責備</mark></strong>，正如父親責備所喜愛的兒子。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/3/#L11-12">箴 3:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>因爲主所愛的，他必管教</mark></strong>，又鞭打凡所收納的兒子。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/evr/12/#L6">希 12:6</a>)</p></blockquote><blockquote><p>“<strong><mark>凡我所疼愛的，我就責備管教他</mark></strong>，所以你要發熱心，也要悔改。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/otkr/3/#L19">啟 3:19</a>)</p></blockquote><blockquote><p>“<strong><mark>我們受審的時候，乃是被主懲治</mark></strong>，免得我們和世人一同定罪。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1kor/11/#L32">林前 11:32</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所懲治的人是有福的</mark></strong>！所以你不可輕看全能者的管教。 因爲<strong><mark>他打破，又纏裹</mark></strong>；他擊傷，用手醫治。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iov/5/#L17-18">伯 5:17-18</a>)</p></blockquote><blockquote><p>“求你將我放在心上如印記，帶在你臂上如戳記；因爲<strong><mark>愛情如死之堅強</mark></strong>，<strong><mark>嫉恨如陰間之殘忍</mark></strong>。<strong><mark>所發的電光，是火焰的電光，是耶和華的烈焰</mark></strong>。 愛情，衆水不能息滅，大水也不能淹沒，若有人拿家中所有的財寶要換愛情，就全被藐視。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pp/8/#L6-7">歌 8:6-7</a>)</p></blockquote>
