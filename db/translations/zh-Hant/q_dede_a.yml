- src: смирение
  path: QV2A_謙卑
  title: 謙卑
  copy_cover: true
  body: <p><strong>謙卑</strong>（謙卑的心志）——與驕傲相反的德行。</p><ul><li><p>和平地接受上帝關於自己這個受造物的<strong>旨意</strong>；</p></li><li><p>在小事上也在大事上順服上帝、他的設立和他的安排；</p></li><li><p>對自己不高看，信賴上帝並仰望他。</p></li></ul><h2>主是謙卑人的上帝</h2><blockquote><p>“你的力量，不在乎人多；你的威能，並不靠強力；但<strong>你卻是謙卑者的天主</strong>，弱小者的扶助，無力者的保護，無靠者的依賴，失望者的救主。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/iudf/9/#L11">友 9:11</a>)</p></blockquote><h2>關於謙卑的誡命</h2><p>主耶穌基督召人向他學習謙卑：</p><blockquote><p>“<strong><mark>凡勞苦擔重擔的人，可以到我這裏來</mark></strong>，我就使你們得安息。 <strong><mark>我心裏柔和謙卑</mark></strong>，你們當負我的軛，<strong><mark>學我的樣式</mark></strong>，這樣，你們心裏就必<strong><mark>得享安息</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mf/11/#L28-29">太 11:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>要彼此同心</mark></strong>，不要志氣高大，<strong><mark>倒要俯就卑微的人</mark></strong>。不要自以爲聰明。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/rim/12/#L16">羅 12:16</a>)</p></blockquote><blockquote><p>“世人哪，耶和華已指示你何爲善，他向你所要的是什麼呢？<strong><mark>只要你行公義，好憐憫，存謙卑的心，與你的上帝同行</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/mih/6/#L8">彌 6:8</a>)</p></blockquote><blockquote><p>“<strong><mark>所以你們要將心裏的污穢除掉。不可再硬著頸項</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/vtor/10/#L16">申 10:16</a>) <em>(「硬著頸項」——指不在上帝面前低頭、不肯謙卑的百姓。)</em></p></blockquote><h2>上帝之母因謙卑被上帝揀選</h2><blockquote><p>“<strong><mark>因爲他顧念他使女的卑微</mark></strong>，從今以後，萬代要稱我有福。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/1/#L48">路 1:48</a>)</p></blockquote><h2>上帝賜恩給謙卑的人</h2><blockquote><p>“你們年幼的也要順服年長的。就是你們衆人也都要以謙卑束腰，彼此順服，『因爲<strong><mark>上帝阻擋驕傲的人，賜恩給謙卑的人</mark></strong>。』 <strong><mark>所以你們要自卑，服在上帝大能的手下，到了時候，他必叫你們升高</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/1pet/5/#L5-6">彼前 5:5-6</a>)</p></blockquote><blockquote><p>“但他賜更多的恩典，所以經上說，『<strong><mark>上帝阻擋驕傲的人，賜恩給謙卑的人</mark></strong>。』” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/iak/4/#L6">雅 4:6</a>)</p></blockquote><blockquote><p>“他譏誚那好譏誚的人，<strong><mark>賜恩給謙卑的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/3/#L34">箴 3:34</a>)</p></blockquote><blockquote><p>“我兒，執行你的工作時，應當謙和；這樣，你會比施惠的人更受人愛戴。<strong>你越偉大，在一切事上越當謙下</strong>；這樣，你才能在上主面前，獲得恩寵。<strong>只有上主的權能是偉大的，爲謙遜人所尊崇。</strong>” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/3/#L19-21">德 3:19-21</a>) <em>(俄文本爲 Сир 3:17-20。)</em></p></blockquote><blockquote><p>“驕傲來，羞恥也來；<strong><mark>謙遜人卻有智慧</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/11/#L2">箴 11:2</a>)</p></blockquote><h2>上帝拯救謙卑的人</h2><blockquote><p>“<strong><mark>耶和華靠近傷心的人，拯救靈性痛悔的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/34/#L18">詩 34:18</a>)</p></blockquote><blockquote><p>“因爲耶和華喜愛他的百姓，<strong><mark>他要用救恩當作謙卑人的妝飾</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/149/#L4">詩 149:4</a>)</p></blockquote><blockquote><p>“<strong><mark>敬畏耶和華心存謙卑，就得富有、尊榮、生命爲賞賜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/22/#L4">箴 22:4</a>)</p></blockquote><h2>上帝高舉謙卑的人</h2><blockquote><p>“<strong><mark>耶和華扶持謙卑人，將惡人傾覆於地</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/147/#L6">詩 147:6</a>)</p></blockquote><blockquote><p>“因爲耶和華喜愛他的百姓，<strong><mark>他要用救恩當作謙卑人的妝飾</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/149/#L4">詩 149:4</a>)</p></blockquote><blockquote><p>“敬畏耶和華，是智慧的訓誨；<strong><mark>尊榮以前，必有謙卑</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/15/#L33">箴 15:33</a>)</p></blockquote><blockquote><p>“敗壞之先，人心驕傲；<strong><mark>尊榮以前，必有謙卑</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/18/#L12">箴 18:12</a>)</p></blockquote><blockquote><p>“<strong><mark>敬畏耶和華心存謙卑，就得富有、尊榮、生命爲賞賜</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/22/#L4">箴 22:4</a>)</p></blockquote><blockquote><p>“人的高傲，必使他卑下；<strong><mark>心裏謙遜的，必得尊榮</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/pr/29/#L23">箴 29:23</a>)</p></blockquote><h2>上帝垂聽謙卑人的祈禱</h2><blockquote><p>“耶和華啊！<strong><mark>謙卑人的心願你早已知道</mark></strong>；<strong><mark>你必預備他們的心，也必側耳聽他們的祈求</mark></strong>；” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/10/#L17">詩 10:17</a>) <em>(俄文本編號爲 Пс 9:37（聖詠編號相差一）。)</em></p></blockquote><blockquote><p>“<strong>謙卑人的祈禱，穿雲而上</strong>，不達到目的，決不甘休；不等至高者見了，爲義人伸冤，執行正義，決不離開。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/35/#L21">德 35:21</a>) <em>(俄文本爲 Сир 35:17。)</em></p></blockquote><blockquote><p>“耶和華說：「這一切都是我手所造的，所以就都有了。<strong><mark>但我所看顧的，就是虛心</mark></strong><strong><mark>痛悔、因我話而戰兢的人</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/66/#L2">賽 66:2</a>)</p></blockquote><blockquote><p>“<strong><mark>或者他們在耶和華面前懇求</mark></strong>，各人回頭，離開惡道，因爲耶和華向這百姓所說要發的怒氣和忿怒是大的。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ier/36/#L7">耶 36:7</a>)</p></blockquote><blockquote><p>“但願我們能借著懺悔的心和<strong>謙虛的精神</strong>蒙你悅納，就如獻上公羊和公牛的全燔祭，又如獻上了萬隻肥羊；” (<a href="https://bibleox.com/zh-Hant/cn-sbt/dan/3/#L39">但 3:39</a>)</p></blockquote><blockquote><p>“<strong><mark>上帝所要的祭，就是憂傷的靈</mark></strong>；上帝阿！<strong><mark>憂傷痛悔的心，你必不輕看</mark></strong>，” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/51/#L17">詩 51:17</a>)</p></blockquote><h2>上帝安慰謙卑的人</h2><blockquote><p>“<strong><mark>但那安慰喪氣之人的上帝</mark></strong>，藉着提多來安慰了我們。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/2kor/7/#L6">林後 7:6</a>)</p></blockquote><blockquote><p>“<strong><mark>耶和華雖高，仍看顧低微的人</mark></strong>；他卻從遠處看出驕傲的人。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ps/138/#L6">詩 138:6</a>)</p></blockquote><h2>上帝保存謙卑的人</h2><blockquote><p>“<strong><mark>世上遵守耶和華典章的謙卑人哪，你們都當尋求耶和華</mark></strong>；當尋求公義謙卑，<strong><mark>或者在耶和華髮怒的日子可以隱藏起來</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/sof/2/#L3">番 2:3</a>)</p></blockquote><blockquote><p>“上主拔除傲慢民族的根苗，在他們的地方，卻<strong>培植謙虛的人</strong>。” (<a href="https://bibleox.com/zh-Hant/cn-sbt/prsir/10/#L18">德 10:18</a>)</p></blockquote><blockquote><p>“<strong><mark>我卻要在你中間留下困苦貧寒的民，他們必投靠我耶和華的名</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/sof/3/#L12">番 3:12</a>)</p></blockquote><h2>上帝與謙卑人同住</h2><blockquote><p>“因爲那至高至上、永遠長存、名爲聖者的如此說：「<strong><mark>我住在至高至聖的所在</mark></strong>，<strong><mark>也與心靈痛悔、謙卑的人同居</mark></strong>；<strong><mark>要使謙卑人的靈甦醒</mark></strong>，也使痛悔人的心甦醒。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/is/57/#L15">賽 57:15</a>)</p></blockquote><h2>謙卑的比喻</h2><h3>論婚宴上座位的挑選</h3><blockquote><p>“耶穌見所請的客揀擇首位，就用比喻對他們說： 「你被人請去赴婚姻的筵席，<strong><mark>不要坐在首位上</mark></strong>，恐怕有比你尊貴的客被他請來； 那請你們的人前來對你說：『讓座給這一位吧！』你就羞羞慚慚的退到末位上去了。 你被請的時候，<strong><mark>就去坐在末位上</mark></strong>，好叫那請你的人來對你說：『朋友，請上坐。』<strong><mark>那時，你在同席的人面前就有光彩了</mark></strong>。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/14/#L7-10">路 14:7-10</a>)</p></blockquote><h3>論稅吏和法利賽人</h3><blockquote><p>“<strong><mark>那稅吏遠遠的站著，連舉目望天也不敢</mark></strong>，只捶著胸說：『<strong><mark>上帝啊，開恩可憐我這個罪人</mark></strong>！』 我告訴你們：這人回家去比那人倒算爲義了。因爲<strong><mark>凡自高的，必降爲卑；自卑的，必升爲高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L13-14">路 18:13-14</a>)</p></blockquote><blockquote><p>“說：「有兩個人上殿裏去禱告：一個是法利賽人，一個是稅吏。 法利賽人站著，自言自語的禱告說：『上帝啊，我感謝你，我不像別人勒索、不義、姦淫，也不像這個稅吏。 我一個禮拜禁食兩次，凡我所得的都捐上十分之一。』 <strong><mark>那稅吏遠遠的站著，連舉目望天也不敢</mark></strong>，只捶著胸說：『<strong><mark>上帝啊，開恩可憐我這個罪人</mark></strong>！』 我告訴你們：這人回家去比那人倒算爲義了。因爲<strong><mark>凡自高的，必降爲卑；自卑的，必升爲高</mark></strong>。」” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/lk/18/#L10-14">路 18:10-14</a>)</p></blockquote>
