  title: 約櫃
  copy_cover: true
  body: <h2>約櫃（見證櫃）</h2><p>在<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм#HH-Святая-Святых">至聖所</a>——<a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">耶路撒冷聖殿</a>——的中央，在革魯賓的翅膀底下，立著約櫃（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/6/#L19">王上 6:19</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/8/#L6">王上 8:6</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/5/#L7">代下 5:7</a>），連同抬櫃的槓（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/8/#L7">王上 8:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/5/#L9">代下 5:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L15">出 25:15</a>）。</p><h3>櫃身</h3><p>尺寸爲2.5×1.5肘，高1.5肘（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L10">出 25:10</a>）。用皂莢木製成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L10">出 25:10</a>）。裏外包上精金，上有金牙邊（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L11">出 25:11</a>）。</p><h3>金環</h3><p>櫃的下角各安一個抬櫃用的金環（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L14">出 25:14</a>），共4個環（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L12">出 25:12</a>）。</p><h3>槓</h3><p>環中插入兩根皂莢木槓（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L13">出 25:13</a>）。槓用金包裹（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L13">出 25:13</a>）。槓要常在櫃的環內，不可抽出來（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L15">出 25:15</a>）。</p><h3>施恩座（蓋）</h3><p>尺寸爲2.5×1.5肘（與櫃相同），用精金製成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L17">出 25:17</a>）。</p><h3>革魯賓</h3><p>在櫃的施恩座上有兩個金革魯賓像（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L18">出 25:18</a>）。一個革魯賓在施恩座的一頭，另一個在另一頭（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L19">出 25:19</a>），臉對著臉，朝著施恩座（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L20">出 25:20</a>）。他們的翅膀高張，遮掩施恩座（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L20">出 25:20</a>）。</p><h3>內容</h3><p>約櫃裏放著兩塊約版——先知摩西所放的（<a href="https://bibleox.com/zh-Hant/cn-cuvt/3ts/8/#L9">王上 8:9</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/2par/5/#L10">代下 5:10</a>）、一滿俄梅珥嗎哪（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/16/#L32-34">出 16:32-34</a>）和亞倫發芽開花的杏杖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/17/#L8-11">民 17:8-11</a>）。</p><h2>上帝在櫃上說話</h2><p>上帝明確地在櫃的施恩座上、兩個革魯賓之間顯現並說話（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L22">出 25:22</a>）：</p><blockquote><p>“<strong><mark>我要在那裏與你相會，又要從法櫃施恩座上，二基路伯中間</mark></strong>，和你說我所要吩咐你傳給以色列人的一切事。” (<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/25/#L22">出 25:22</a>)</p></blockquote>
