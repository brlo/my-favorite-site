  title: 舊約的祭司
  copy_cover: true
  body: <h2>得任祭司職</h2><h3>祭司——只有亞倫的後裔</h3><p>只有亞倫（先知摩西的弟兄）和他的後裔可以作祭司（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L1">出 28:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L4">出 28:4</a>）。</p><h3>大祭司職分的傳承</h3><p>只有亞倫（先知摩西的弟兄）和他的後裔可以作祭司（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L1">出 28:1</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L4">出 28:4</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L9">出 29:9</a>）。大祭司的繼任者要穿上聖衣，受膏七日（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29-30">出 29:29-30</a>）。聖衣隨職分一起傳承（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29">出 29:29</a>）。若外人擅自行祭司的事奉，要被治死（<a href="https://bibleox.com/zh-Hant/cn-cuvt/chis/3/#L10">民 3:10</a>）。</p><h3>對候選人的要求</h3><p>不可有身體的殘疾（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L17-21">利 21:17-21</a>）：</p><ul><li><p>瞎眼，</p></li><li><p>瘸腿，</p></li><li><p>塌鼻子，</p></li><li><p>肢體有餘（折斷或癱瘓的肢體），</p></li><li><p>駝背，</p></li><li><p>眼睛有毛病，</p></li><li><p>長癬的、長疥的，或損壞腎子的。</p></li></ul><h3>對祭司的要求</h3><ul><li><p>不可使頭光禿，不可剃除鬍鬚的周圍（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L1,5">利 21:1,5</a>）；</p></li><li><p>不可娶妓女或被污的女人爲妻，也不可娶被休的婦人爲妻（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L7">利 21:7</a>）；大祭司只能娶處女爲妻（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L13-14">利 21:13-14</a>）；</p></li><li><p>不可挨近死屍（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L1-4">利 21:1-4</a>）；大祭司甚至不可爲死去的親屬沾染自己（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L10-11">利 21:10-11</a>）；</p></li><li><p>大祭司要蓬頭散發——頭上倒了膏油、承接聖職、穿了聖衣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/21/#L10">利 21:10</a>）。</p></li></ul><h2>禮儀</h2><h3>簡述</h3><p>經由獻祭、洗身、膏油（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L41">出 28:41</a>）、彈牲畜之血、筵席而完成。受聖職需要聖衣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L2-3">出 28:2-3</a>），聖衣隨職分傳承（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29">出 29:29</a>）。</p><h3>舊約大祭司的受聖職</h3><h4>祭物</h4><p>受聖職要獻無殘疾的牲畜（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L1">出 29:1</a>）和細麥麵作的無酵餅（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L2">出 29:2</a>）：</p><ul><li><p><strong>一隻公牛犢</strong>；</p></li><li><p><strong>兩隻公綿羊</strong>；</p></li><li><p>調油的<strong>無酵餅</strong>；</p></li><li><p>細麥麵作的<strong>無酵薄餅</strong>。</p></li></ul><p>大祭司和祭司們把手按在公牛頭上，然後在會幕門口宰殺它（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L10-11">出 29:10-11</a>）（基督被殺的預像）。</p><p>用公牛的血抹在壇的四角上，把血都倒在壇腳那裏（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L12">出 29:12</a>）（基督在十字架——壇——上苦難的預像）。公牛的脂油（蓋髒的脂油、肝上的網子、腰子等）燒在壇上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L13">出 29:13</a>）。公牛的皮、肉等用火燒在營外——這是贖罪祭（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L14">出 29:14</a>）。</p><p>同樣，大祭司和祭司們把手按在一隻公綿羊頭上，宰殺它（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L16">出 29:16</a>），把血灑在壇的周圍（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L15">出 29:15</a>）。把羊切成塊子，洗淨五臟，燒在壇上——這是獻給耶和華的燔祭（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L17-18">出 29:17-18</a>）。</p><p>對最後一隻公綿羊也是這樣：大祭司和祭司們把手按在羊頭上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L19">出 29:19</a>），宰殺它（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L20">出 29:20</a>），把血抹在亞倫和他兒子的右耳垂上、右手的大拇指和右腳的大拇指上，並把血灑在壇的四圍（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L20">出 29:20</a>）。</p><p>然後取壇上的血和膏油，彈在亞倫和他的衣服上，並他兒子和他兒子的衣服上，他們和他們的衣服就一同成聖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L21">出 29:21</a>）。</p><p>再取這羊的脂油（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L22">出 29:22</a>）、筐子中的一個餅、一個調油的餅和一個薄餅（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L23">出 29:23</a>），放在亞倫和他兒子的手上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L24">出 29:24</a>），然後從他們手中接過來，燒在壇上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L25">出 29:25</a>）。公羊的胸也作爲搖祭獻上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L26-28">出 29:26-28</a>）。</p><h4>洗身</h4><p>受聖職之前先用水洗身（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L4">出 29:4</a>）。</p><h4>穿上聖衣</h4><p>洗身之後，給他穿上聖衣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L5-6">出 29:5-6</a>）。祭司們也穿上聖衣（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L8-9">出 29:8-9</a>）。</p><h4>把膏油倒在頭上</h4><p>穿衣之後，把膏油倒在他頭上膏他（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L7">出 29:7</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L41">出 28:41</a>）。</p><h4>筵席</h4><p>公羊的肉煮在聖處（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L31">出 29:31</a>），然後大祭司和祭司們要在會幕門口吃這羊的肉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L32">出 29:32</a>）。外人不可參與這筵席（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L33">出 29:33</a>）。若肉或餅留到早晨，就要用火燒了（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L34">出 29:34</a>）。</p><h4>七天中重複</h4><p>整個獻祭與成聖的禮儀重複七天（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L35">出 29:35</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/lev/8/#L33-34">利 8:33-34</a>）。結果，壇就成爲至聖：凡挨着壇的都成爲聖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L37">出 29:37</a>）（成爲聖物的基督十字架的預像）。</p><h2>聖衣</h2><h3>用途</h3><p>爲榮耀、爲華美、爲成聖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L2-3">出 28:2-3</a>）；爲傳承大祭司的職分（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L29">出 29:29</a>）。</p><h3>全套</h3><p>大祭司聖衣的全套包括（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L4">出 28:4</a>）：</p><ul><li><p><strong>胸牌</strong>，</p></li><li><p><strong>以弗得</strong>（外衣），</p></li><li><p><strong>外袍</strong>（以弗得的外袍），</p></li><li><p><strong>雜色的內袍</strong>（貼身衣物），</p></li><li><p><strong>冠冕</strong>（頭飾），</p></li><li><p><strong>腰帶</strong>。</p></li></ul><h3>以弗得（無袖外衣）</h3><p>用金線和藍色、紫色、硃紅色線，並捻的細麻製成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L5-6">出 28:5-6</a>）。</p><h4>肩帶</h4><p>以弗得不是一整塊，而是由前後兩部分構成，因此在肩上以「肩帶」相連（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L7">出 28:7</a>）。</p><p>爲兩條肩帶制了兩塊寶石（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L12">出 28:12</a>）：金槽中的紅瑪瑙（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L10">出 28:10</a>）。在這些寶石上刻著以色列十二支派的名字（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L9">出 28:9</a>）：一塊寶石上六個名字，另一塊上六個名字，按出生的次序（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L10">出 28:10</a>）。寶石安在金槽中，並有金鍊子裝飾（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L13-14">出 28:13-14</a>）。</p><p>以弗得的邊上（大概在腰帶附近）有兩個環，用來固定胸牌（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L28">出 28:28</a>）。</p><h3>腰帶</h3><p>腰帶穿在以弗得外面，用與以弗得同樣的材料製成：金線和藍色、紫色、硃紅色線，並捻的細麻（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L8">出 28:8</a>）。腰帶用繡花的手工製成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L39">出 28:39</a>）。</p><h3>胸牌（護胸）</h3><p>疊爲兩層的方形布片（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L16">出 28:16</a>）。尺寸：23×23釐米（一虎口見方）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L16">出 28:16</a>）。虎口——大拇指與食指張開的距離，約23釐米。用與以弗得相同的材料製成（金線、細麻與線）（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L15">出 28:15</a>）。</p><p>在這塊布片上鑲著12塊寶石。每行3塊列舉（共4行，<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L17">出 28:17</a>）：</p><ul><li><p>紅寶石、紅璧璽、紅玉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L17">出 28:17</a>）；</p></li><li><p>綠寶石、藍寶石、金鋼石（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L18">出 28:18</a>）；</p></li><li><p>紫瑪瑙、白瑪瑙、紫晶（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L19">出 28:19</a>）；</p></li><li><p>綠瑪瑙、紅瑪瑙、碧玉（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L19">出 28:19</a>）。</p></li></ul><p>寶石上刻著以色列十二個支派的名字，每塊一個名字（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L21">出 28:21</a>）。</p><p>胸牌固定在肩帶上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L23">出 28:23</a>）。爲此，胸牌的上兩角有兩個金環（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L23">出 28:23</a>），環中穿過金鍊子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L24">出 28:24</a>）——精金擰成如繩的鍊子（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L22">出 28:22</a>），鍊子的另一頭接在以弗得前面肩帶的槽上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L22">出 28:22</a>；<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L25">出 28:25</a>）。</p><p>胸牌的下兩角有4個金環：兩個在以弗得裏面的邊上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L26">出 28:26</a>），兩個在以弗得前面肩帶的下邊（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L27">出 28:27</a>）。胸牌用藍細帶子繫在這幾個環上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L28">出 28:28</a>）——繫在以弗得的環子上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L28">出 28:28</a>），使它不從以弗得上滑落，保持在腰帶以上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L28">出 28:28</a>）。</p><p>每次進聖所（聖殿）時都要戴上胸牌（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L29">出 28:29</a>）。</p><h4>烏陵和土明</h4><p>胸牌裏面（因爲它由疊爲兩層的布片構成），如同<a href="https://bibleox.com/ru/ru/w/ковчег_завета">約櫃</a>一樣，放著神祕的物件：<strong>烏陵和土明</strong>[1][2]，教會斯拉夫語譯本作<strong>顯現與真理</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L30">出 28:30</a>（教會斯拉夫語本））。大祭司要把它們帶在胸前（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L30">出 28:30</a>）。</p><h3>外袍</h3><p>用全藍的布料製成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L31">出 28:31</a>）。袍上要爲頭留一領口（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L32">出 28:32</a>）。領口周圍織出領邊，免得破裂（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L32">出 28:32</a>）。</p><p>袍子周圍底邊上，用藍色、紫色、硃紅色線作石榴，在石榴中間要有金鈴鐺（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L33">出 28:33</a>）：一個金鈴鐺一個石榴，在袍子周圍的底邊上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L34">出 28:34</a>）。</p><h3>冠冕（頭飾）</h3><p>頭飾用細麻布作成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L39">出 28:39</a>）。</p><h4>金牌</h4><p>冠冕上繫着精金作的牌，上面按刻圖書之法刻著「歸耶和華爲聖」（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L36">出 28:36</a>）。牌用一條藍細帶子繫在冠冕的前面（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L37">出 28:37</a>），並在額上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L38">出 28:38</a>）。</p><h3>內袍</h3><p>內袍用雜色細麻線織成（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L39">出 28:39</a>）。遮掩下體，從腰達到大腿（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L42">出 28:42</a>）。</p><h2>平常的祭司</h2><p>平常祭司的衣服沒有詳細記述。衣服爲他們而作，爲榮耀，爲華美（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L40">出 28:40</a>）。</p><p>祭司要有內袍（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L40">出 28:40</a>）、繡花的手工腰帶（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L39-40">出 28:39-40</a>）、裹頭巾（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L40">出 28:40</a>）。</p><p>這衣服要在進會幕或就近壇、在聖所供職時穿上（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/28/#L43">出 28:43</a>）。</p><h2>祭獻</h2><p>每天在會幕門口（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L42">出 29:42</a>）要獻<strong>兩隻一歲的羊羔</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L38">出 29:38</a>）：早晨獻一隻，黃昏的時候獻那一隻（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L39">出 29:39</a>）。</p><p>與羊羔同獻的，有<strong>細麵</strong>、<strong>油</strong>和<strong>酒</strong>（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L40">出 29:40</a>）。</p><p>獻祭之地要因上帝的榮耀成爲聖（<a href="https://bibleox.com/zh-Hant/cn-cuvt/ish/29/#L43">出 29:43</a>）。</p>
