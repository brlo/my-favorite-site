  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Προκαταρκτικά γενικά ζητήματα</h2><p>Το παρόν άρθρο στηρίζεται στο ότι <strong>ο Χριστός είναι Θεός</strong> (<a href="https://bibleox.com/el/el/w/%CE%9F_%CE%A7%CF%81%CE%B9%CF%83%CF%84%CF%8C%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%98%CE%B5%CF%8C%CF%82">χωρία</a>).</p><p>Η Παρθένος Μαρία τιμάται με βάση τη διδασκαλία περί της τιμής των αγίων, γι’ αυτό πρωτίστως πρέπει να αποδειχθεί η <a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%B1%CE%B3%CE%AF%CF%89%CE%BD">Τιμή των αγίων</a> και οι Προσευχές προς τους αγίους.</p><p>Ωστόσο, εδώ θα παρατεθούν οι λόγοι όχι απλώς της τιμής της Παρθένου Μαρίας ως μιας από τους αγίους, αλλά της ιδιαίτερης τιμής προς αυτήν ως <strong>της μεγαλύτερης από τους αγίους υπηρέτες και φίλους του Θεού</strong>, ως Μητέρας του Ιησού Χριστού (δηλαδή Μητέρας του Θεού, αφού ο Ιησούς Χριστός είναι Θεός).</p><h2>Οι λόγοι της ιδιαίτερης τιμής της Θεοτόκου</h2><ol><li><p><strong>Η ιδιαίτερη προσοχή της Παρθένου Μαρίας στα λόγια του Θεού,</strong></p></li><li><p><strong>Η τέλεια και ταπεινή υπακοή στον Θεό,</strong></p></li><li><p><strong>Εκλέχθηκε από τον Θεό</strong>. Κανένας στο σύμπαν δεν αξιώθηκε από τον Θεό την τιμή να Τον γεννήσει κατά την ανθρωπότητα. Το κατόρθωμα δεν είναι ότι γέννησε, αλλά ότι ο Θεός, γνωρίζοντας εκ των προτέρων τις αρετές της Μαρίας (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L29">Ρωμ 8:29</a>), την επιλέγει εξαιτίας αυτών των αρετών. Με αυτή την εκλογή ο Θεός δείχνει το μεγαλείο της.</p></li><li><p><strong>Ο Υιός του Θεού τιμά την Παρθένο Μαρία ως Μητέρα Του.</strong> Καμία άλλη δεν είναι Μητέρα του Υιού του Θεού (κανένα άλλο ον στο σύμπαν).</p></li><li><p><strong>Εκπλήρωση της προφητείας</strong>: «από του νυν μακαριούσίν με πάσαι αι γενεαί» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L48">Λκ 1:48</a>), — δηλαδή όλες οι γενεές των ανθρώπων (γενεαί). Ο Θεός έκανε μεγάλα στην Παρθένο Μαρία: <em>«ότι </em><strong><em>εποίησέν μοι <mark>μεγάλα</mark></em></strong><em> ο δυνατός, και άγιον το όνομα αυτού»</em><strong> </strong>(<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L49">Λκ 1:49</a>).</p></li></ol><h2>Εκλέχθηκε για την ταπείνωσή της</h2><blockquote><p>«Καὶ εἶπεν Μαριάμ, Μεγαλύνει ἡ ψυχή μου τὸν κύριον, καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου, ὅτι <strong><mark>ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν</mark> τῆς δούλης αὐτοῦ</strong>. ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L46-48">Λκ 1:46-48</a>)</p></blockquote><p>Ακόμη και ο πατέρας του μεγαλύτερου από τους προφήτες (Ζαχαρίας) τιμωρήθηκε από τον αρχάγγελο (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L20">Λκ 1:20</a>) για την απιστία ή, καλύτερα, για τη δυσπιστία και την αμφιβολία. Η Μητέρα του Θεού όμως δέχθηκε με υπακοή τον ορισμό γι’ αυτήν, απαντώντας ταπεινά:</p><blockquote><p>«Ἰδοὺ ἡ δούλη κυρίου· <strong><mark>γένοιτό μοι κατὰ τὸ ῥῆμά σου</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L38">Λκ 1:38</a>)</p></blockquote><p>Για τη σημασία της ταπείνωσης:</p><blockquote><p><em>«οὐ γὰρ ἐν πλήθει τὸ κράτος σου, οὐδὲ ἡ δυναστεία σου ἐν ἰσχύουσιν, ἀλλὰ </em><strong><em><mark>ταπεινῶν εἶ θεός</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iudf/9/#L11"><em>Ιουδιθ 9:11</em></a><em>)</em></p></blockquote><blockquote><p>«<strong>ὅσῳ μέγας εἶ, τοσούτῳ ταπείνου σεαυτόν</strong>, καὶ ἔναντι κυρίου εὑρήσεις χάριν· &lt;…&gt; ὅτι μεγάλη ἡ δυναστεία τοῦ κυρίου καὶ ὑπὸ τῶν ταπεινῶν δοξάζεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/3/#L18,20">Σ.Σειρ 3:18,20</a>)</p></blockquote><p>Σημαντικά χωρία περί ταπείνωσης: <a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B1%CF%80%CE%B5%CE%AF%CE%BD%CF%89%CF%83%CE%B7">Η ταπείνωση</a></p><h2>Η πιο προσεκτική ακροάτρια του λόγου του Θεού</h2><blockquote><p>«δός μοι, υἱέ, <strong><mark>σὴν καρδίαν, οἱ δὲ σοὶ ὀφθαλμοὶ ἐμὰς ὁδοὺς τηρείτωσαν</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/23/#L26">Πρμ 23:26</a>)</p></blockquote><blockquote><p>«ἡ δὲ <strong>Μαριὰμ <mark>πάντα</mark> συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα <mark>ἐν τῇ καρδίᾳ</mark></strong> αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L19">Λκ 2:19</a>)</p></blockquote><blockquote><p>«<strong>ἡ μήτηρ αὐτοῦ διετήρει <mark>πάντα τὰ ῥήματα</mark> <mark>ἐν τῇ καρδίᾳ</mark> αὐτῆς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L51">Λκ 2:51</a>)</p></blockquote><blockquote><p><em>«αὐτὸς δὲ εἶπεν, Μενοῦν </em><strong><em>μακάριοι οἱ ἀκούοντες</em></strong><em> τὸν λόγον τοῦ θεοῦ καὶ </em><strong><em>φυλάσσοντες</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L27-28"><em>Λκ 11:27-28</em></a><em>)</em></p></blockquote><p>Όπως λέει ο άγιος Ιγνάτιος (Μπριαντσανίνοφ), ήταν η πιο προσεκτική και σταθερή ακροάτρια και εκτελέστρια της διδασκαλίας του Θεού:</p><blockquote><p>Η Αειπάρθενος είναι πάνω από όλους τους αγίους ανθρώπους, και για τον λόγο ότι έγινε Μητέρα του Θεανθρώπου, και για τον λόγο ότι <strong>ήταν η πιο σταθερή, η πιο προσεκτική ακροάτρια και εκτελέστρια της διδασκαλίας που κήρυξε ο Θεάνθρωπος</strong>.</p></blockquote><p>(Έκθεση της διδασκαλίας της Ορθόδοξης Εκκλησίας για τη Μητέρα του Θεού)</p><h2>Έγινε Μητέρα του Χριστού Θεού</h2><p>Ένας από τους λόγους της ιδιαίτερης τιμής της Μητέρας του Θεού είναι το γεγονός ότι είναι Μητέρα του Θεού (κατά την ανθρωπότητα), γιατί κανένας άλλος δεν είναι Μητέρα του Θεού, κανένα ον στο σύμπαν. Η θεία εντολή υποχρεώνει να τιμούμε τους γονείς (<a href="https://bibleox.com/el/el/w/%CE%9F%CE%B9_%CE%94%CE%AD%CE%BA%CE%B1_%CE%95%CE%BD%CF%84%CE%BF%CE%BB%CE%AD%CF%82">5η εντολή</a>), γι’ αυτό η Θεοτόκος τιμάται ως Μητέρα Του από τον Ίδιο τον Χριστό Θεό, και μετά από Αυτόν και από τους πιστούς μαθητές Του.</p><h3>Η Παρθένος Μαρία γέννησε τον Υιό του Θεού</h3><p>Ο ίδιος ο μονογενής Υιός του Θεού γεννήθηκε αληθινά από γυναίκα:</p><blockquote><p>«ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, <strong>ἐξαπέστειλεν ὁ θεὸς τὸν <mark>υἱὸν αὐτοῦ</mark>, <mark>γενόμενον ἐκ γυναικός</mark></strong>, γενόμενον ὑπὸ νόμον» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L4">Γαλ 4:4</a>)</p></blockquote><p>Ο μονογενής Υιός, ο Λόγος του Θεού, πράγματι σαρκώθηκε:</p><blockquote><p>«Καὶ <strong><mark>ὁ λόγος σὰρξ ἐγένετο</mark></strong> καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς <strong>μονογενοῦς παρὰ πατρός</strong>, πλήρης χάριτος καὶ ἀληθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L14">Ιω 1:14</a>)</p></blockquote><p>Ο αρχάγγελος Γαβριήλ ονομάζει ευθέως το παιδί της Παρθένου Μαρίας Υιό του Θεού:</p><blockquote><p>«καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ, Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, <strong><mark>υἱὸς θεοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L35">Λκ 1:35</a>)</p></blockquote><h3>Η Παρθένος Μαρία είναι Μητέρα του Υιού του Θεού</h3><p>Η δίκαιη Ελισάβετ, μητέρα του προφήτη Ιωάννη του Προδρόμου, ονομάζει ευθέως την Παρθένο Μαρία Μητέρα του Θεού:</p><blockquote><p>«καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ <strong><mark>ἡ μήτηρ τοῦ κυρίου</mark></strong> μου πρὸς ἐμέ;» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L43">Λκ 1:43</a>)</p></blockquote><blockquote><p>«καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας <strong><mark>τῆς μητρὸς αὐτοῦ</mark></strong>, καὶ πεσόντες προσεκύνησαν αὐτῷ» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L11">Μτ 2:11</a>)</p></blockquote><blockquote><p>«<strong><mark>Ἰησοῦς οὖν ἰδὼν τὴν μητέρα</mark></strong> καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα, λέγει <strong><mark>τῇ μητρί</mark></strong>, Γύναι, ἴδε ὁ υἱός σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L26">Ιω 19:26</a>)</p></blockquote><blockquote><p>«λέγει <strong><mark>ἡ μήτηρ αὐτοῦ</mark></strong> τοῖς διακόνοις, Ὅ τι ἂν λέγῃ ὑμῖν ποιήσατε.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L5">Ιω 2:5</a>)</p></blockquote><blockquote><p>«Καὶ τῇ ἡμέρᾳ τῇ τρίτῃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν <strong><mark>ἡ μήτηρ τοῦ Ἰησοῦ</mark></strong> ἐκεῖ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L1">Ιω 2:1</a>)</p></blockquote><p>(<a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L14">Μτ 2:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L20">Μτ 2:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L21">Μτ 2:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L46">Μτ 12:46</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/3/#L31">Μκ 3:31</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L33">Λκ 2:33</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L34">Λκ 2:34</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L43">Λκ 2:43</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L48">Λκ 2:48</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L51">Λκ 2:51</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/8/#L19">Λκ 8:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L3">Ιω 2:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L12">Ιω 2:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L25">Ιω 19:25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L26">Ιω 19:26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L14">Πραξ 1:14</a>)</p><p>Αν ο Υιός του Θεού έγινε για πάντα άνθρωπος (και αυτό είναι αληθές), τότε η Παρθένος Μαρία έγινε για πάντα Μητέρα του Υιού του Θεού.</p><h3>Ο Υιός του Θεού είναι Υιός της Παρθένου Μαρίας</h3><blockquote><p>«<strong><mark>ἔτεκεν υἱόν</mark></strong>· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/1/#L25">Μτ 1:25</a>)</p></blockquote><h3>Η Παρθένος Μαρία είναι Θεοτόκος</h3><p>Η Παρθένος Μαρία γέννησε τον Ιησού Χριστό.</p><p>Ο Ιησούς Χριστός — ο Υιός του Θεού — είναι <a href="https://bibleox.com/el/el/w/%CE%9F_%CE%A7%CF%81%CE%B9%CF%83%CF%84%CF%8C%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%98%CE%B5%CF%8C%CF%82">ο Θεός μας</a>.</p><p>Αυτός που γέννησε η Παρθένος Μαρία είναι <a href="https://bibleox.com/el/el/w/%CE%9F_%CE%A7%CF%81%CE%B9%CF%83%CF%84%CF%8C%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%98%CE%B5%CF%8C%CF%82">ο Θεός μας</a>. Άρα εκείνη είναι αυτή που γέννησε τον Θεό — η Θεοτόκος.</p><p>Η Παρθένος Μαρία δεν γέννησε την αιώνια θεία φύση, που υπάρχει έξω από τον χρόνο και τον χώρο, αλλά την ανθρώπινη φύση του Υιού του Θεού, η οποία <a href="https://bibleox.com/el/el/w/%CE%9F_%CE%A5%CE%B9%CF%8C%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%AC%CE%BD%CE%B1%CF%81%CF%87%CE%BF%CF%82">έχει αρχή</a> και η οποία από την πρώτη στιγμή της ύπαρξής της ανήκε εξ ολοκλήρου στο πρόσωπο του Υιού του Θεού (του Θεού).</p><p>Με λίγα λόγια, η Παρθένος Μαρία γέννησε τον Θεό κατά την ανθρωπότητα.</p><p>Ωστόσο, το μεγαλείο της Θεοτόκου έγκειται ακριβώς στο ότι εκλέχθηκε να είναι Μητέρα του Θεού. Το κατόρθωμα δεν είναι ότι γέννησε, γιατί πολλές γεννούν, αλλά ότι ο Θεός, γνωρίζοντας εκ των προτέρων τις αρετές της Μαρίας (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L29">Ρωμ 8:29</a>), διάλεξε από όλους τους ανθρώπους που υπήρξαν ποτέ όχι κάποια άλλη, αλλά ακριβώς την Παρθένο Μαρία.</p><h2>Η Θεοτόκος ήταν και παραμένει παρθένος</h2><h3>Η παρθενία της Μαρίας πριν από τη γέννηση του Ιησού Χριστού</h3><p>Η Παρθένος Μαρία δεν είχε σαρκικές σχέσεις με τον δίκαιο Ιωσήφ. Αν και ήταν μνηστευμένη με τον Ιωσήφ (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L27">Λκ 1:27</a>), δεν καταλάβαινε πώς θα μπορούσε να γεννηθεί γιος, αφού δεν είχε σαρκικές σχέσεις:</p><blockquote><p>«εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον, Πῶς ἔσται τοῦτο, ἐπεὶ <strong><mark>ἄνδρα οὐ γινώσκω</mark></strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L34">Λκ 1:34</a>)</p></blockquote><p>Αξίζει να προσέξουμε επίσης ότι αυτό το ερώτημα έχει νόημα μόνο αν η Παρθένος Μαρία είχε δώσει υπόσχεση στον Θεό να φυλάξει την παρθενία. Αλλιώς, ακόμη και αν η Παρθένος Μαρία δεν είχε μέχρι τότε σαρκικές σχέσεις με τον δίκαιο Ιωσήφ, όταν ο άγγελος του Θεού αναγγέλλει ότι θα γεννηθεί γιος, προφανώς θα έπρεπε να υπακούσει στον Θεό και να έχει σαρκικές σχέσεις με τον σύζυγό της, για να εκπληρωθεί η πρόρρηση. Αν όμως η Παρθένος Μαρία είχε δώσει υπόσχεση στον Θεό να ζήσει παρθενική ζωή, τότε αμέσως προκύπτει το ερώτημα: «πώς μπορεί να γεννηθεί γιος, αφού οι όρκοι που δίνονται στον Θεό δεν επιτρέπεται να παραβιάζονται (<a href="https://bibleox.com/el/gr-lxx-byz/chis/30/#L3">Αρ 30:3</a>);».</p><p>Ο άγγελος απάντησε ότι αυτό που προαναγγέλθηκε στη Μαρία θα γίνει χωρίς άνδρα, με θαυματουργική ενέργεια της δύναμης του Θεού:</p><blockquote><p>«καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ, <strong>Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις ὑψίστου ἐπισκιάσει σοι</strong>· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L35">Λκ 1:35</a>)</p></blockquote><p>Ο Ιησούς Χριστός ήταν γιος του Ιωσήφ μόνο κατά τη γνώμη των ανθρώπων:</p><blockquote><p>«Καὶ αὐτὸς ἦν Ἰησοῦς ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα, <strong>ὢν υἱός, <mark>ὡς ἐνομίζετο</mark>, Ἰωσὴφ</strong> τοῦ Ἠλὶ» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L23">Λκ 3:23</a>)</p></blockquote><p>Στην πραγματικότητα, ο Χριστός δεν συνελήφθη από τον Ιωσήφ, αλλά με τη δύναμη του Αγίου Πνεύματος.</p><h3>Η παρθενία της Μαρίας μετά τη γέννηση του Ιησού Χριστού</h3><p>Η προφητεία περί της αειπαρθενίας (ότι παραμένει παρθένος) της Μαρίας, ότι από αυτήν θα γεννηθεί μόνο ένα παιδί: ο Ιησούς Χριστός — ο Θεός που εισήλθε στον κόσμο μας σαν από πύλη, μέσω της Παρθένου Μαρίας, της Θεοτόκου:</p><blockquote><p>«Καὶ ἐπέστρεψέν με κατὰ τὴν ὁδὸν τῆς πύλης τῶν ἁγίων τῆς ἐξωτέρας τῆς βλεπούσης κατ᾿ ἀνατολάς, καὶ αὕτη ἦν κεκλεισμένη. καὶ εἶπεν κύριος πρός με <strong><mark>Ἡ πύλη αὕτη κεκλεισμένη ἔσται</mark>, οὐκ ἀνοιχθήσεται, καὶ <mark>οὐδεὶς μὴ διέλθῃ δι᾿ αὐτῆς, ὅτι κύριος ὁ θεὸς τοῦ Ισραηλ εἰσελεύσεται δι᾿ αὐτῆς, καὶ ἔσται κεκλεισμένη</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/44/#L1-2">Ιεζ 44:1-2</a>)</p></blockquote><p>Έτσι, η Παρθένος Μαρία δεν γέννησε κανένα άλλο παιδί εκτός από τον Ιησού Χριστό. Και ταυτόχρονα, η παρθενία της Μαρίας δεν παραβιάστηκε.</p><p>Αξίζει επίσης να προσέξουμε ότι την ημέρα της σταύρωσης ο Χριστός αναθέτει τη φροντίδα της Μητέρας Του στον αγαπημένο μαθητή — τον Ιωάννη τον Θεολόγο (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L26-27">Ιω 19:26-27</a>). Αυτό δείχνει ότι εκτός από τον Χριστό, τον μοναδικό Υιό της Παρθένου Μαρίας, δεν είχε πια ούτε σύζυγο ούτε άλλα παιδιά που θα έπρεπε να φροντίσουν γι’ αυτήν.</p><p>Ο δίκαιος Ιωσήφ ήταν ήδη ηλικιωμένος ακόμη και κατά τη γέννηση του Χριστού, και γι’ αυτό μέχρι τη σταύρωση του Χριστού είχε από καιρό πεθάνει. Πράγματι, μετά την περιγραφή των παιδικών χρόνων του Ιησού Χριστού, ο Ιωσήφ δεν αναφέρεται πια στη Γραφή.</p><p>Στον Ιωάννη ανατίθεται η Παρθένος Μαρία για τον λόγο ότι ακριβώς αυτός θα ζήσει στη γη περισσότερο από τους άλλους αποστόλους. Ο Ίδιος ο Κύριος δείχνει ότι ο απόστολος Πέτρος θα πάθει για τον Χριστό, αλλά ο απόστολος Ιωάννης θα ζήσει σημαντικά περισσότερο (<a href="https://bibleox.com/el/gr-lxx-byz/in/21/#L22">Ιω 21:22</a>). Όπως γνωρίζουμε, ο Ιωάννης ήταν ο νεότερος από τους αποστόλους και εργάστηκε στη γη μέχρι το τέλος του πρώτου αιώνα, ενώ οι υπόλοιποι απόστολοι δέχθηκαν μαρτυρικό θάνατο. Αυτό επέτρεπε στον απόστολο Ιωάννη να φροντίζει την Παρθένο Μαρία περισσότερο από όλους τους άλλους.</p><p>Αυτό το γεγονός δείχνει επίσης ότι η Παρθένος Μαρία δεν είχε άλλα παιδιά που θα μπορούσαν να φροντίσουν γι’ αυτήν.</p><h2>Η Θεοτόκος θα μακαρίζεται από όλες τις γενεές</h2><p>Η Θεοτόκος θα μακαρίζεται, ο Θεός έκανε μεγάλα σ’ αυτήν:</p><blockquote><p>«ὅτι ἐπέβλεψεν ἐπὶ τὴν <strong>ταπείνωσιν</strong> τῆς δούλης αὐτοῦ. ἰδοὺ γὰρ ἀπὸ τοῦ νῦν <strong><mark>μακαριοῦσίν με πᾶσαι αἱ γενεαί</mark></strong>· ὅτι <strong><mark>ἐποίησέν</mark> μοι <mark>μεγάλα</mark> ὁ δυνατός</strong>, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L48-49">Λκ 1:48-49</a>)</p></blockquote><p>Παρόμοια ρήση απαντά και για τον Ίδιο τον Χριστό:</p><blockquote><p>«ἔστω τὸ ὄνομα αὐτοῦ εὐλογημένον εἰς τοὺς αἰῶνας, πρὸ τοῦ ἡλίου διαμενεῖ τὸ ὄνομα αὐτοῦ· καὶ εὐλογηθήσονται ἐν αὐτῷ πᾶσαι αἱ φυλαὶ τῆς γῆς, <strong>πάντα τὰ ἔθνη μακαριοῦσιν αὐτόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/71/#L17">Ψλ 71:17</a>)</p></blockquote><h2>Οι ιδιαίτερες σχέσεις του Χριστού με τη Μητέρα Του</h2><h3>Ο Υιός του Θεού τιμά την Παρθένο Μαρία ως Μητέρα Του</h3><p>Ο Υιός του Θεού υποτάχθηκε στον νόμο:</p><blockquote><p>«ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, <strong><mark>γενόμενον ὑπὸ νόμον</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L4">Γαλ 4:4</a>)</p></blockquote><p>Ο Θεός προστάζει να τιμάμε τον πατέρα και τη μητέρα:</p><blockquote><p>«<strong><mark>τίμα</mark> τὸν πατέρα σου καὶ <mark>τὴν μητέρα</mark></strong>, ἵνα εὖ σοι γένηται, καὶ ἵνα μακροχρόνιος γένῃ ἐπὶ τῆς γῆς τῆς ἀγαθῆς, ἧς κύριος ὁ θεός σου δίδωσίν σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L12">Έξ 20:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L16">Δτ 5:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L17">Έξ 21:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L9">Λευ 20:9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L15">Έξ 21:15</a>)</p></blockquote><blockquote><p>«τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, <strong><mark>Τίμα</mark> τὸν πατέρα σου καὶ <mark>τὴν μητέρα</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L20">Λκ 18:20</a>)</p></blockquote><blockquote><p>«Καὶ ἔλεγεν αὐτοῖς, Καλῶς ἀθετεῖτε <strong>τὴν ἐντολὴν τοῦ θεοῦ</strong>, ἵνα τὴν παράδοσιν ὑμῶν στήσητε. &lt;…&gt; ὑμεῖς δὲ λέγετε, Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί, Κορβᾶν, ὅ ἐστιν, Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς, <strong><mark>οὐκέτι ἀφίετε αὐτὸν οὐδὲν ποιῆσαι</mark> τῷ πατρὶ ἢ <mark>τῇ μητρί</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/7/#L9,11-12">Μκ 7:9,11-12</a>)</p></blockquote><p>Κανένα ον στο σύμπαν, εκτός από την Παρθένο Μαρία, δεν είναι Μητέρα του Υιού του Θεού. Από αυτή την άποψη, κανένας ανάμεσα σε αγγέλους και ανθρώπους δεν είναι ανώτερος από την Παρθένο Μαρία, γιατί την τιμά ως Μητέρα Του ο ίδιος ο Υιός του Θεού, ο Θεός.</p><h3>Ο Χριστός ακούει τη Μητέρα Του</h3><p>Ο Χριστός δείχνει ότι δεν έχει έρθει ακόμη ο καιρός του κηρύγματος, των θαυμάτων (της φανέρωσης της δόξας Του), ωστόσο για χάρη της παράκλησης της Μητέρας Του επιτελεί το πρώτο θαύμα:</p><blockquote><p>«καὶ ὑστερήσαντος οἴνου <strong>λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν, Οἶνον οὐκ ἔχουσιν</strong>. [καὶ] λέγει αὐτῇ ὁ Ἰησοῦς, <strong><mark>Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου</mark></strong>. λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις, Ὅ τι ἂν λέγῃ ὑμῖν ποιήσατε. &lt;…&gt; <strong>λέγει αὐτοῖς ὁ Ἰησοῦς, Γεμίσατε τὰς ὑδρίας ὕδατος. καὶ ἐγέμισαν αὐτὰς ἕως ἄνω. καὶ λέγει αὐτοῖς, Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ</strong>· οἱ δὲ ἤνεγκαν. &lt;…&gt; <strong><mark>Ταύτην ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς</mark></strong> ἐν Κανὰ τῆς Γαλιλαίας καὶ <strong><mark>ἐφανέρωσεν τὴν δόξαν αὐτοῦ</mark></strong>, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L3-5,7-8,11">Ιω 2:3-5,7-8,11</a>)</p></blockquote><h3>Ο Χριστός φροντίζει για τη Μητέρα Του</h3><p>Κατά τη διάρκεια των φρικτών βασανιστηρίων στον σταυρό, ο Χριστός δείχνει τη φροντίδα Του για τη Μητέρα Του:</p><blockquote><p><em>«Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα, </em><strong><em>λέγει τῇ μητρί, Γύναι, ἴδε ὁ υἱός σου. εἶτα λέγει τῷ μαθητῇ, Ἴδε ἡ μήτηρ σου. καὶ ἀπ᾿ ἐκείνης τῆς ὥρας <mark>ἔλαβεν αὐτὴν ὁ μαθητὴς εἰς τὰ ἴδια</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L26-27"><em>Ιω 19:26-27</em></a><em>)</em></p></blockquote><h3>Ο χαρακτήρας των προσωπικών σχέσεων του Χριστού με τη Μητέρα Του</h3><p>Την πιο φρικτή ώρα, υποφέροντας φρικτούς σωματικούς πόνους στον σταυρό, την προδοσία, τη φυγή των μαθητών, το ανθρώπινο αίσθημα της εγκατάλειψης (9η ώρα: «<em>Ελωί, Ελωί, λεμά σαβαχθανί; που σημαίνει: ο Θεός μου, ο Θεός μου, </em><strong><em>εις τι εγκατέλιπές με</em></strong><em>;</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/15/#L34">Μκ 15:34</a>)), ο Κύριος φροντίζει για τη Μητέρα Του, που Τον ακολούθησε μέχρι το τέλος.</p><p>Σε αυτή την πιο δύσκολη ώρα στρέφει την προσοχή Του στη Μητέρα Του, δείχνει ιδιαίτερη φροντίδα γι’ αυτήν, την εμπιστεύεται στον αγαπημένο μαθητή, και όχι απλώς «πρόσεξέ την, φρόντισέ την», αλλά δέξου την ως «Μητέρα σου».</p><blockquote><p>«Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα, λέγει τῇ μητρί, Γύναι, ἴδε ὁ υἱός σου. εἶτα λέγει τῷ μαθητῇ, <strong>Ἴδε ἡ μήτηρ σου</strong>. καὶ ἀπ᾿ ἐκείνης τῆς ὥρας ἔλαβεν αὐτὴν ὁ μαθητὴς εἰς τὰ ἴδια.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L26-27">Ιω 19:26-27</a>)</p></blockquote><p>Ας προσέξουμε ότι όλοι αυτοί οι άνθρωποι, στους οποίους έδειξε ο Χριστός, λέγοντας «ιδού η μήτηρ μου και οι αδελφοί μου» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L48-50">Μτ 12:48-50</a>), Τον άφησαν μόνο (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L32">Ιω 16:32</a>), ενώ η Μητέρα Του ήταν μαζί Του μέχρι το τέλος.</p><blockquote><p>«ἰδοὺ ἔρχεται ὥρα καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια <strong>κἀμὲ μόνον ἀφῆτε</strong>· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ᾿ ἐμοῦ ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L32">Ιω 16:32</a>)</p></blockquote><blockquote><p>«καὶ ὁ πέμψας με μετ᾿ ἐμοῦ ἐστιν· <strong>οὐκ ἀφῆκέν με μόνον</strong>, <strong>ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L29">Ιω 8:29</a>)</p></blockquote><p>Και ο Χριστός δεν άφησε τη Μητέρα Του μόνη για τον ίδιο λόγο.</p><h3>Έχει σημασία ότι η Μητέρα του Θεού ήταν με τον Χριστό μέχρι το τέλος;</h3><p>Ο απόστολος Παύλος πριν από το τέλος του πέρασε επίσης μια παρόμοια εμπειρία εγκατάλειψης:</p><blockquote><p>«Οἶδας τοῦτο, ὅτι <strong>ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ</strong>, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L15">Β Τιμ 1:15</a>)</p></blockquote><blockquote><p>«Δημᾶς γάρ <strong>με ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα</strong>, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν· <strong>Λουκᾶς ἐστιν μόνος μετ᾿ ἐμοῦ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L10-11">Β Τιμ 4:10-11</a>)</p></blockquote><p>Η Μητέρα του Θεού ήταν σε όλα προσεκτική, υπάκουη και πιστή στον Θεό από την αρχή μέχρι το τέλος. Πάντα ήταν και παραμένει με τον Θεό.</p><h2>Κριτική</h2><h3>Μα η λέξη «Θεοτόκος» δεν υπάρχει στη Γραφή</h3><p>Η λέξη «Τριάδα» επίσης δεν υπάρχει στη Γραφή, και λοιπόν; Στη Γραφή λέγεται το ίδιο πράγμα που σημαίνει η λέξη «Θεοτόκος». Η Παρθένος Μαρία είναι Μητέρα του Ιησού Χριστού. Ο Ιησούς Χριστός είναι Θεός. Η Παρθένος Μαρία γέννησε τον Ιησού Χριστό, δηλαδή γέννησε τον Θεό· είναι φανερό ότι αυτό έγινε κατά την ανθρωπότητα. Αυτός που γεννήθηκε από αυτήν είναι Θεός. Η Παρθένος Μαρία είναι η γεννήσασα τον Θεό, ή με μια λέξη Θεοτόκος.</p><h3>«Μακαρία η κοιλία που Σε βάσταξε»</h3><p>Οι άνθρωποι δοξολογούσαν τη Θεοτόκο για τους συγγενικούς δεσμούς, για τη γέννηση και τον θηλασμό του Χριστού, αλλά ο Ίδιος ο Χριστός διόρθωνε αυτή την αντίληψη (έθετε τις προτεραιότητες), δείχνοντας το μεγαλείο της Μητέρας Του χάρη στην ιδιαίτερη προσοχή της στον λόγο του Θεού και στην τέλεια ταπεινή υποταγή της στον Θεό:</p><blockquote><p>«Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις φωνὴν γυνὴ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ, <strong>Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας</strong>. αὐτὸς δὲ εἶπεν, <strong><mark>Μενοῦν μακάριοι οἱ ἀκούοντες</mark></strong> τὸν λόγον τοῦ θεοῦ καὶ <strong><mark>φυλάσσοντες</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L27-28">Λκ 11:27-28</a>)</p></blockquote><blockquote><p>«ἡ δὲ <strong>Μαριὰμ <mark>πάντα</mark> συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ</strong> αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L19">Λκ 2:19</a>)</p></blockquote><blockquote><p>«καὶ κατέβη μετ᾿ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ <strong>ἡ μήτηρ αὐτοῦ <mark>διετήρει πάντα τὰ ῥήματα</mark></strong> ἐν τῇ καρδίᾳ αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L51">Λκ 2:51</a>)</p></blockquote><h3>«Ποια είναι η Μητέρα Μου και ποιοι είναι οι αδελφοί Μου;»</h3><p>Εδώ ο Χριστός πάλι δίνει έμφαση: το μεγαλείο της Παρθένου Μαρίας δεν έγκειται τόσο στους συγγενικούς δεσμούς, όπως νόμιζαν οι άνθρωποι, όσο στην απόλυτη εκπλήρωση του θελήματος του Θεού από αυτήν:</p><blockquote><p>«[εἶπεν δέ τις αὐτῷ, Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν ζητοῦντές σοι λαλῆσαι.] ὁ δὲ ἀποκριθεὶς εἶπεν τῷ λέγοντι αὐτῷ, <strong>Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου</strong>; καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν, Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου· <strong><mark>ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ</mark></strong> ἐστίν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L47-50">Μτ 12:47-50</a>)</p></blockquote><h3>«Και δεν τη γνώριζε, έως ότου γέννησε» (Μτ 1:25)</h3><blockquote><p>«καὶ <strong>οὐκ ἐγίνωσκεν αὐτὴν <mark>ἕως οὗ</mark> ἔτεκεν</strong> υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/1/#L25">Μτ 1:25</a>)</p></blockquote><p>Η έκφραση «δεν τη γνώριζε, έως ότου γέννησε» δεν σημαίνει ότι μετά τη γέννηση του Χριστού «τη γνώριζε». Είναι μια διαδεδομένη έκφραση στη Βίβλο, που δεν σημαίνει ότι κάτι άλλαξε έπειτα.</p><p>Για παράδειγμα:</p><blockquote><p>«διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ <strong>ἰδοὺ ἐγὼ μεθ᾿ ὑμῶν εἰμι πάσας τὰς ἡμέρας <mark>ἕως</mark> τῆς συντελείας τοῦ αἰῶνος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L20">Μτ 28:20</a>)</p></blockquote><p>— αλλά και μετά τη συντέλεια του αιώνα, προφανώς, ο Χριστός θα είναι με όσους πιστεύουν σ’ Αυτόν.</p><blockquote><p>«εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς, <strong>Ἔτι μικρὸν χρόνον τὸ φῶς ἐν ὑμῖν ἐστιν</strong>. περιπατεῖτε ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ· καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει. <strong><mark>ὡς</mark> τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς</strong>, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ᾿ αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L35-36">Ιω 12:35-36</a>)</p></blockquote><p>— αλλά και μετά την ανάληψη του Χριστού στον ουρανό, πρέπει να πιστεύουμε στο Φως (στον Χριστό)·</p><blockquote><p>«δεῖ γὰρ αὐτὸν <strong>βασιλεύειν <mark>ἄχρι οὗ</mark> θῇ πάντας τοὺς ἐχθροὺς</strong> ὑπὸ τοὺς πόδας αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L25">Α Κορ 15:25</a>)</p></blockquote><p>— αλλά και μετά την υποταγή των εχθρών, προφανώς, θα βασιλεύει ο Χριστός (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L33">Λκ 1:33</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L11">Β Πε 1:11</a>).</p><blockquote><p>«Εἶπεν ὁ κύριος τῷ κυρίῳ μου <strong>Κάθου ἐκ δεξιῶν μου, <mark>ἕως ἂν</mark> θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν</strong> σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/109/#L1">Ψλ 109:1</a>)</p></blockquote><p>— αλλά και μετά την υποταγή των εχθρών κάτω από τα πόδια, προφανώς, θα κάθεται στα δεξιά του Πατρός, ο Χριστός, δηλαδή θα βασιλεύει.</p><blockquote><p>«ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατίροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ᾿ ὑμᾶς ἄλλο βάρος· πλὴν <strong>ὃ ἔχετε</strong> <strong>κρατήσατε <mark>ἄχρις οὗ ἂν</mark> ἥξω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L24-25">Απ 2:24-25</a>)</p></blockquote><p>— αλλά και μετά την έλευση του Χριστού, προφανώς, πρέπει να κρατάμε τις αρετές και την πίστη.</p><blockquote><p>«καὶ τῇ Μελχολ θυγατρὶ Σαουλ <strong>οὐκ ἐγένετο παιδίον <mark>ἕως</mark> τῆς ἡμέρας τοῦ ἀποθανεῖν αὐτήν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2ts/6/#L23">Β Βασ 6:23</a>)</p></blockquote><p>— αλλά και μετά τον θάνατο, προφανώς, η Μελχόλ δεν είχε παιδιά.</p><p>Αξίζει να προσέξουμε και τα εξής χωρία της Γραφής:</p><blockquote><p>«Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου εἰς ὃν εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ᾿ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ. οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ. <strong>κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, <mark>ἕως ἂν</mark> ἐκβάλῃ εἰς νῖκος τὴν κρίσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L18-20">Μτ 12:18-20</a>)</p></blockquote><h3>Γέννησε πρωτότοκο — άρα είχε και άλλα παιδιά;</h3><p>Στη Γραφή ο Υιός της Θεοτόκου ονομάζεται πρωτότοκος:</p><blockquote><p>«καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ <strong>ἔτεκεν <mark>υἱόν</mark></strong>· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/1/#L25">Μτ 1:25</a>)</p></blockquote><p>* Στη Σιναϊτική και τη Βατικανή χειρόγραφη παράδοση απουσιάζει η λέξη «πρωτότοκος», ωστόσο η λέξη αυτή υπάρχει στο Λκ 2:7.</p><blockquote><p>«καὶ <strong>ἔτεκεν τὸν υἱὸν αὐτῆς τὸν <mark>πρωτότοκον</mark></strong>· καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L7">Λκ 2:7</a>)</p></blockquote><p>Οι αντίπαλοι της διδασκαλίας της Ορθόδοξης Εκκλησίας θεωρούν ότι αυτό δείχνει πως η Παρθένος Μαρία είχε και άλλα παιδιά, λέγοντας: «<em>αφού υπάρχει πρωτότοκος, υπάρχουν και άλλα παιδιά</em>». Ότι αυτή η σκέψη είναι εσφαλμένη, το δείχνει η ίδια η Γραφή.</p><p>Ο ίδιος ο Θεός στη Γραφή δίνει τον ορισμό της λέξης <strong>«πρωτότοκος» — αυτός που ανοίγει τη μήτρα κάθε σάρκας</strong>:</p><blockquote><p>«καὶ πᾶν <strong><mark>διανοῖγον μήτραν ἀπὸ πάσης σαρκός</mark></strong>, ἃ προσφέρουσιν κυρίῳ ἀπὸ ἀνθρώπου ἕως κτήνους, σοὶ ἔσται· ἀλλ᾿ ἢ λύτροις λυτρωθήσεται τὰ <strong><mark>πρωτότοκα</mark></strong> τῶν ἀνθρώπων, καὶ τὰ <strong><mark>πρωτότοκα</mark></strong> τῶν κτηνῶν τῶν ἀκαθάρτων λυτρώσῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/18/#L15">Αρ 18:15</a>)</p></blockquote><blockquote><p>«πᾶν <strong><mark>διανοῖγον μήτραν</mark></strong> ἐμοί, τὰ ἀρσενικά, <strong><mark>πρωτότοκον μόσχου καὶ πρωτότοκον προβάτου</mark></strong>. καὶ πρωτότοκον ὑποζυγίου λυτρώσῃ προβάτῳ· ἐὰν δὲ μὴ λυτρώσῃ αὐτό, τιμὴν δώσεις. <strong><mark>πᾶν πρωτότοκον τῶν υἱῶν σου</mark></strong> λυτρώσῃ. οὐκ ὀφθήσῃ ἐνώπιόν μου κενός.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/34/#L19-20">Έξ 34:19-20</a>)</p></blockquote><p>Όλοι οι πρωτότοκοι ανήκουν στον Θεό, γι’ αυτό:</p><ol><li><p>Τον πρωτότοκο άνθρωπο έπρεπε οπωσδήποτε να τον φέρνουν στον ναό και να τον εξαγοράζουν από τους ιερείς.</p></li><li><p>Τα πρωτότοκα των καθαρών ζώων τα έφερναν στον ναό και τα έδιναν, τα έσφαζαν προσφέροντάς τα θυσία στον Θεό.</p></li><li><p>Τα πρωτότοκα των ακάθαρτων ζώων δεν μπορούσαν να προσφερθούν θυσία, γι’ αυτό έπρεπε οπωσδήποτε να εξαγοράζονται.</p></li></ol><p>Μόλις προέκυπτε από άνθρωπο ή ζώο το πρώτο που γεννούσε, έπρεπε να προσφέρεται δώρο στον Θεό ή να εξαγοράζεται. Και είναι απολύτως φανερό ότι εκείνη ακριβώς τη στιγμή αυτός ο γεννημένος άνθρωπος είναι μονογενής, ωστόσο ονομάζεται από τον Θεό πρωτότοκος, επειδή άνοιξε τη μήτρα. Αυτό σημαίνει ότι <strong>κάθε μονογενής είναι πρωτότοκος</strong>, αλλά δεν είναι κάθε πρωτότοκος μονογενής[2].</p><p>Και αν σκεφτεί κανείς όπως οι επαναστάτες κατά της διδασκαλίας της Εκκλησίας, ότι πρωτότοκος ονομάζεται μόνο εκείνος που έχει αδέλφια, τότε προκύπτει ότι όσοι γεννούν το πρώτο τους παιδί θα πρέπει να λένε στον ιερέα: «Περίμενε να γεννηθεί το δεύτερο, για να μπορεί το πρώτο να ονομάζεται πρωτότοκος, και στο μεταξύ αυτό δεν είναι πρωτότοκος αλλά μονογενής, άρα δεν πρέπει να το φέρω στον Θεό και να το εξαγοράσω». Ωστόσο και αυτή η παράλογη σκέψη αντιφάσκει με τη Γραφή και την κοινή λογική, γιατί τον μονογενή Σωτήρα τον φέρνουν στον ναό σύμφωνα με αυτόν ακριβώς τον νόμο περί των πρωτοτόκων:</p><blockquote><p>«Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν <strong>κατὰ τὸν νόμον Μωϋσέως</strong>, <strong>ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L22">Λκ 2:22</a>)</p></blockquote><p>Είναι φανερό ότι ο Κύριος Ιησούς Χριστός εδώ είναι <strong>μονογενής</strong>, αλλά ταυτόχρονα Τον φέρνουν στον ναό ως <strong>πρωτότοκο</strong>. Άρα πρωτότοκος στην περίπτωση αυτή, κατά τον λόγο του Θεού, σημαίνει εκείνον που ανοίγει τη μήτρα κάθε σάρκας και δεν δείχνει αν η μητέρα είχε άλλα παιδιά που γεννήθηκαν. Περισσότερα[2].</p><h3>Τα αδέλφια του Ιησού Χριστού</h3><p>Στη Γραφή λέγεται ότι ο Χριστός είχε αδέλφια:</p><blockquote><p>«οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ <strong>οἱ ἀδελφοὶ αὐτοῦ</strong> Ἰάκωβος καὶ Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L55">Μτ 13:55</a>)</p></blockquote><blockquote><p>«οὐδὲ γὰρ <strong>οἱ ἀδελφοὶ αὐτοῦ</strong> ἐπίστευον εἰς αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L5">Ιω 7:5</a>)</p></blockquote><blockquote><p>«Καὶ ἔρχεται ἡ μήτηρ αὐτοῦ καὶ <strong>οἱ ἀδελφοὶ αὐτοῦ</strong> καὶ ἔξω στήκοντες ἀπέστειλαν πρὸς αὐτὸν καλοῦντες αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/3/#L31">Μκ 3:31</a>)</p></blockquote><blockquote><p>«μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ <strong>οἱ ἀδελφοὶ τοῦ κυρίου</strong> καὶ Κηφᾶς;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/9/#L5">Α Κορ 9:5</a>)</p></blockquote><p>Εδώ εννοούνται αδέλφια από τον πρώτο γάμο του Ιωσήφ ή απλώς συγγενείς. Αδέλφια ονομάζονται απλώς κάποιοι συγγενείς. Για παράδειγμα, ο Λωτ ήταν ανιψιός του Αβραάμ, αλλά στη Γραφή ονομάζεται και αδελφός:</p><blockquote><p>«ἔλαβον δὲ καὶ <strong>τὸν Λωτ <mark>υἱὸν τοῦ ἀδελφοῦ</mark> Αβραμ</strong> καὶ τὴν ἀποσκευὴν αὐτοῦ καὶ ἀπῴχοντο· ἦν γὰρ κατοικῶν ἐν Σοδομοις.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/14/#L12">Γεν 14:12</a>)</p></blockquote><blockquote><p>«εἶπεν δὲ Αβραμ τῷ Λωτ Μὴ ἔστω μάχη ἀνὰ μέσον ἐμοῦ καὶ σοῦ καὶ ἀνὰ μέσον τῶν ποιμένων μου καὶ ἀνὰ μέσον τῶν ποιμένων σου. ὅτι <strong>ἄνθρωποι <mark>ἀδελφοὶ</mark> ἡμεῖς ἐσμεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/13/#L8">Γεν 13:8</a>)</p></blockquote><p>Ο Ιωσήφ ήταν ήδη ηλικιωμένος όταν μνηστεύθηκε τη Μαρία ως φύλακάς της, γιατί η Μαρία δεν μπορούσε να είναι χωρίς σύζυγο. Αν από τη Μαρία είχε γεννηθεί ο Χριστός όταν δεν είχε γνωστό σύζυγο, τότε κατά τον Νόμο θα έπρεπε να λιθοβοληθεί (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/22/#L20-21">Δτ 22:20-21</a>), γιατί όλοι οι άνθρωποι θα νόμιζαν ότι είχε πορνικές (εξώγαμες) σχέσεις. Γι’ αυτό ο Κύριος κανονίζει να έχει η Μαρία σύζυγο, αλλά συλλαμβάνει θαυματουργικά, χωρίς άνδρα, με την επισκίαση του Αγίου Πνεύματος (<a href="https://bibleox.com/el/gr-lxx-byz/mf/1/#L18-25">Μτ 1:18-25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L34-35">Λκ 1:34-35</a>).</p><p>Μετά τα παιδικά χρόνια του Ιησού, ο Ιωσήφ ο Μνήστωρ δεν αναφέρεται πια στη Γραφή, και η Παρθένος Μαρία συνόδευε τον Ιησού Χριστό μέχρι το τέλος — μέχρι τα πάθη του σταυρού (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L25-26">Ιω 19:25-26</a>), και αναφέρεται επίσης και μετά την Ανάσταση, την ημέρα της Πεντηκοστής (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L14">Πραξ 1:14</a>).</p><p>Ο Χριστός αναθέτει τη Μητέρα Του στον αγαπημένο μαθητή — τον Ιωάννη (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L27">Ιω 19:27</a>). Είναι φανερό ότι ο Ιωσήφ είχε ήδη πεθάνει μέχρι τότε.</p><p>Άρα, τα αδέλφια του Ιησού Χριστού είναι απλώς συγγενείς, και καθόλου άλλα παιδιά της Παρθένου Μαρίας.</p><p>Και η προφητεία λέει καθαρά ότι από την Παρθένο Μαρία θα γεννηθεί μόνο ο Κύριος Ιησούς Χριστός:</p><blockquote><p><em>«Καὶ ἐπέστρεψέν με κατὰ τὴν ὁδὸν τῆς πύλης τῶν ἁγίων τῆς ἐξωτέρας τῆς βλεπούσης κατ᾿ ἀνατολάς, καὶ αὕτη ἦν κεκλεισμένη. καὶ εἶπεν κύριος πρός με </em><strong><em><mark>Ἡ πύλη αὕτη κεκλεισμένη ἔσται</mark>, οὐκ ἀνοιχθήσεται, καὶ <mark>οὐδεὶς μὴ διέλθῃ δι᾿ αὐτῆς, ὅτι κύριος ὁ θεὸς τοῦ Ισραηλ εἰσελεύσεται δι᾿ αὐτῆς, καὶ ἔσται κεκλεισμένη</mark></em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iez/44/#L1-2"><em>Ιεζ 44:1-2</em></a><em>)</em></p></blockquote><h3>Πουθενά δεν λέγεται ότι η Παρθένος Μαρία δεν πίστευε στον Χριστό</h3><p>Οι κριτικοί της Εκκλησίας επαναλαμβάνουν συχνά την ιδέα ότι δήθεν η Παρθένος Μαρία δεν πίστευε ότι ο Υιός της είναι ο Σωτήρας των ανθρώπων, ο υποσχεμένος Μεσσίας, ο Χριστός. Αλλά αυτό είναι απλώς αναληθές. Τέτοια λόγια δεν υπάρχουν στη Γραφή. Λέγεται μόνο ότι τα αδέλφια (ετεροθαλή, οι γιοι του Ιωσήφ από τον πρώτο γάμο) δεν πίστευαν στον Χριστό:</p><blockquote><p>«οὐδὲ γὰρ <strong>οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον</strong> εἰς αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L5">Ιω 7:5</a>)</p></blockquote><p>Αυτό ήταν αρκετά αναμενόμενο, γιατί ήταν παιδιά από τον πρώτο γάμο του Ιωσήφ. Ήταν ήδη ενήλικοι, είδαν πώς μεγάλωσε ο έφηβος Ιησούς. Γι’ αυτό τους ήταν δύσκολο να πιστέψουν, όπως και σε άλλους συμπατριώτες του Χριστού (τους κατοίκους της Γαλιλαίας) (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L54-58">Μτ 13:54-58</a>). Αλλά αργότερα πίστεψαν και τα αδέλφια (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L14">Πραξ 1:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L19">Γαλ 1:19</a>).</p><h3>Η Μητέρα του Βασιλιά — βασίλισσα</h3><p>Οι κριτικοί κατηγορούν την Εκκλησία ότι η Θεοτόκος ονομάζεται βασίλισσα. Αλλά η Μητέρα του Βασιλιά είναι ακριβώς βασίλισσα.</p><blockquote><p>«<strong><mark>παρέστη ἡ βασίλισσα ἐκ δεξιῶν σου</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/44/#L9">Ψλ 44:9</a>)</p></blockquote><p>Στους αποστόλους δεν δόθηκε το δικαίωμα να καθίσουν στα δεξιά και στα αριστερά του Χριστού στη Βασιλεία Του:</p><blockquote><p>«τὸ δὲ <strong><mark>καθίσαι ἐκ δεξιῶν μου</mark></strong> ἢ ἐξ εὐωνύμων <strong>οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ᾿ οἷς ἡτοίμασται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L40">Μκ 10:40</a>)</p></blockquote><p>Αν δεν «κάθισαν» εκεί οι απόστολοι, τότε ποιοι; Στην Ορθοδοξία, στην εικόνα της «Δευτέρας Παρουσίας» ζωγραφίζουν δίπλα στον Χριστό ακριβώς τη Θεοτόκο (στα δεξιά Του) και τον προφήτη Ιωάννη τον Πρόδρομο (στα αριστερά Του), ως τον μεγαλύτερο από τους άνδρες που γεννήθηκαν από γυναίκες (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L11">Μτ 11:11</a>).</p><h3>Η φράση «Θεοτόκε, σώσον ημάς»</h3><p>Εδώ πρέπει να κατανοήσουμε σωστά το νόημα. Ο Σωτήρας είναι ένας, αλλά οι συνεργοί στο έργο της σωτηρίας είναι πολλοί:</p><blockquote><p>«θεοῦ γάρ ἐσμεν <strong><mark>συνεργοί</mark></strong>· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L9">Α Κορ 3:9</a>)</p></blockquote><p>Ο απόστολος σκοπεύει να σώσει ανθρώπους:</p><blockquote><p><em>«τοῖς πᾶσιν </em><strong><em>γέγονα πάντα, ἵνα πάντως τινὰς <mark>σώσω</mark></em></strong><em>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/9/#L22">Α Κορ 9:22</a>)</em></p></blockquote><blockquote><p><em>«εἴ πως παραζηλώσω μου τὴν σάρκα καὶ </em><strong><em><mark>σώσω</mark> τινὰς ἐξ αὐτῶν</em></strong><em>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L14">Ρωμ 11:14</a>)</em></p></blockquote><p>Η γυναίκα μπορεί να σώσει τον άνδρα, και ο άνδρας — τη γυναίκα:</p><blockquote><p><em>«τί γὰρ οἶδας, </em><strong><em>γύναι, εἰ τὸν ἄνδρα <mark>σώσεις</mark></em></strong><em>; ἢ τί οἶδας, </em><strong><em>ἄνερ</em></strong><em>, </em><strong><em>εἰ τὴν γυναῖκα <mark>σώσεις</mark></em></strong><em>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L16">Α Κορ 7:16</a>)</em></p></blockquote><p>Το αποστολικό κάλεσμα να σώζουμε ανθρώπους:</p><blockquote><p><em>«καὶ οὓς μὲν ἐλεᾶτε διακρινομένους, οὓς δὲ </em><strong><em><mark>σῴζετε</mark></em></strong><em> ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L22-23">Ιούδα 1:22-23</a>)</em></p></blockquote><blockquote><p>«ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν <strong><mark>σώσεις</mark></strong> καὶ <strong>τοὺς ἀκούοντάς σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L16">Α Τιμ 4:16</a>)</p></blockquote><h3>Η φράση «δούλοι της Θεοτόκου»</h3><p>Εδώ συμβαίνει το ίδιο όπως με τη σωτηρία. Πρέπει να κατανοήσουμε σωστά το νόημα.</p><p>Δεν λατρεύουμε τη Θεοτόκο ως Θεό, αλλά την υπηρετούμε και την τιμάμε. Αν η Μητέρα του Θεού μάς ζητούσε κάτι, θα την υπηρετούσαμε με χαρά. Και είναι δυνατόν να φανταστεί κανείς ότι οι χριστιανοί θα έπρατταν διαφορετικά;</p><p>Στη Βίβλο υπάρχουν χωρία όπου δίκαιοι άνθρωποι ονομάζουν τον εαυτό τους δούλο όχι μόνο του Θεού, παραμένοντας δούλοι του ενός Θεού.</p><p>Οι απόστολοι — δούλοι των χριστιανών:</p><blockquote><p>«οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ Ἰησοῦν Χριστὸν κύριον, <strong><mark>ἑαυτοὺς δὲ δούλους ὑμῶν</mark></strong> διὰ Ἰησοῦν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/4/#L5">Β Κορ 4:5</a>)</p></blockquote><p>Ο Αβδιού, άνθρωπος που φοβόταν τον Θεό, που έκρυβε τους προφήτες από τους διωγμούς, ονομάζει τον εαυτό του δούλο του προφήτη Ηλία, και τον Ηλία — κύριό του:</p><blockquote><p><em>«καὶ ἐκάλεσεν Αχααβ τὸν Αβδιου τὸν οἰκονόμον· [καὶ Αβδιου ἦν φοβούμενος τὸν κύριον σφόδρα, καὶ ἐγένετο ἐν τῷ τύπτειν τὴν Ιεζαβελ τοὺς προφήτας κυρίου καὶ ἔλαβεν Αβδιου ἑκατὸν ἄνδρας προφήτας καὶ ἔκρυψεν αὐτοὺς κατὰ πεντήκοντα ἐν σπηλαίῳ καὶ διέτρεφεν αὐτοὺς ἐν ἄρτῳ καὶ ὕδατι·] &lt;…&gt; καὶ ἦν Αβδιου ἐν τῇ ὁδῷ μόνος, καὶ ἦλθεν Ηλιου εἰς συνάντησιν αὐτοῦ μόνος· καὶ Αβδιου ἔσπευσεν καὶ ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ καὶ εἶπεν Εἰ σὺ εἶ αὐτός, </em><strong><em>κύριέ μου Ηλιου</em></strong><em>; καὶ εἶπεν Ηλιου αὐτῷ Ἐγώ· πορεύου λέγε τῷ κυρίῳ σου Ἰδοὺ Ηλιου. καὶ εἶπεν Αβδιου Τί ἡμάρτηκα, ὅτι δίδως τὸν δοῦλόν σου εἰς χεῖρα Αχααβ τοῦ θανατῶσαί με; &lt;…&gt; καὶ ἔσται ἐὰν ἐγὼ ἀπέλθω ἀπὸ σοῦ, καὶ πνεῦμα κυρίου ἀρεῖ σε εἰς γῆν, ἣν οὐκ οἶδα, καὶ εἰσελεύσομαι ἀπαγγεῖλαι τῷ Αχααβ, καὶ ἀποκτενεῖ με· καὶ </em><strong><em><mark>ὁ δοῦλός σού</mark></em></strong><em> ἐστιν φοβούμενος τὸν κύριον ἐκ νεότητος αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/18/#L3-4,7-9,12">Γ Βασ 18:3-4,7-9,12</a>)</em></p></blockquote><h3>Η Θεοτόκος αναστήθηκε μετά την ταφή της</h3><p>Οι αντίπαλοι της τιμής της Θεοτόκου αντιτίθενται στην Παράδοση της Ορθόδοξης Εκκλησίας περί της αναστάσεως από τον Κύριο Ιησού Χριστό της Μητέρας Του, σαν να είναι κάτι αδύνατο, θεωρώντας ότι αναστήθηκε μόνο ο Χριστός. Ωστόσο, από την πλευρά της Γραφής δεν υπάρχει κανένα πρόβλημα γι’ αυτό, γιατί μετά την ανάσταση του Χριστού πολλοί άγιοι αναστήθηκαν (όπως κι αν αποφασίσουμε να κατανοήσουμε την ποιότητα αυτής της ανάστασης):</p><blockquote><p>«Καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ἀπ᾿ ἄνωθεν ἕως κάτω εἰς δύο, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν, καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ <strong><mark>πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ἠγέρθησαν</mark>, καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ</strong> εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L51-53">Μτ 27:51-53</a>)</p></blockquote><p>Αν μετά την ανάστασή Του ο Κύριος ανέστησε στη ζωή πολλούς αγίους, τότε πολύ περισσότερο μπορούσε να επαναφέρει στη ζωή την κατά σάρκα Μητέρα Του, την οποία εξέλεξε για τη σάρκωσή Του, την οποία άκουσε κάνοντας θαύματα, και για την οποία φρόντισε αναθέτοντάς την στον αγαπημένο μαθητή.</p><p>Προς επιβεβαίωση της Παραδόσεως περί της αναστάσεως της Θεοτόκου αξίζει επίσης να προσέξουμε το γεγονός ότι, με τόσο ευλαβική στάση της Εκκλησίας προς τα λείψανα των αγίων από τη βαθύτατη αρχαιότητα (<a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%BB%CE%B5%CE%B9%CF%88%CE%AC%CE%BD%CF%89%CE%BD">περισσότερα</a>), η Εκκλησία δεν έχει λείψανα της Θεοτόκου, όπως δεν έχει και λείψανα του Κυρίου Ιησού Χριστού (γιατί Αυτός αναστήθηκε).</p>'
