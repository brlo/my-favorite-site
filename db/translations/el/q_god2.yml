  title: Ο Θεός είναι αναλλοίωτος
  meta_desc: 'Βιβλικές ρήσεις που δείχνουν ότι ο Θεός δεν αλλάζει: δεν υπάρχει σε Αυτόν μεταβολή, ούτε σκιά τροπής.'
  copy_cover: true
  menu:
    parent: Θεός
    title: Ο Θεός είναι αναλλοίωτος
    priority: 6
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Στον Θεό δεν υπάρχουν αλλαγές:</p><blockquote><p>«Διότι ἐγὼ κύριος ὁ θεὸς ὑμῶν, καὶ <strong>οὐκ ἠλλοίωμαι</strong>· καὶ ὑμεῖς, υἱοὶ Ιακωβ, οὐκ ἀπέχεσθε» (<a href="https://bibleox.com/el/gr-lxx-byz/mal/3/#L6">Μαλ 3:6</a>)</p></blockquote><blockquote><p>«πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ᾿ ᾧ <strong>οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L17">Ιακ 1:17</a>)</p></blockquote><blockquote><p>«οὐχ ὡς ἄνθρωπος <strong>ὁ θεὸς</strong> διαρτηθῆναι <strong>οὐδὲ ὡς υἱὸς ἀνθρώπου ἀπειληθῆναι</strong>· αὐτὸς εἴπας οὐχὶ ποιήσει; λαλήσει, καὶ οὐχὶ ἐμμενεῖ;» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/23/#L19">Αρ 23:19</a>)</p></blockquote><blockquote><p>«κατ᾿ ἀρχὰς σύ, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί· αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμενεῖς, καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται, καὶ ὡσεὶ περιβόλαιον ἀλλάξεις αὐτούς, καὶ ἀλλαγήσονται· <strong>σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/101/#L25-27">Ψλ 101:25-27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L10-12">Εβρ 1:10-12</a>)</p></blockquote><blockquote><p>«<strong>Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L8">Εβρ 13:8</a>)</p></blockquote><p>Ο Θεός δεν άλλαξε από τη δημιουργία του κόσμου:</p><blockquote><p>«τὰ μεγαλεῖα τῆς σοφίας αὐτοῦ ἐκόσμησεν, ὡς ἔστιν πρὸ τοῦ αἰῶνος καὶ εἰς τὸν αἰῶνα· <strong>οὔτε προσετέθη οὔτε ἠλαττώθη</strong>, καὶ οὐ προσεδεήθη οὐδενὸς συμβούλου. ὡς πάντα τὰ ἔργα αὐτοῦ ἐπιθυμητὰ καὶ ὡς σπινθῆρός ἐστιν θεωρῆσαι·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/42/#L21-22">Σ.Σειρ 42:21-22</a>)</p></blockquote><p>Ο Θεός δεν αθετεί τα λόγια Του:</p><blockquote><p>«ἐπ᾿ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ <strong>ἀψευδὴς</strong> <strong>θεὸς</strong> πρὸ χρόνων αἰωνίων,» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L2">Τιτ 1:2</a>)</p></blockquote><blockquote><p>«οὐδὲ μὴ βεβηλώσω τὴν διαθήκην μου καὶ τὰ ἐκπορευόμενα διὰ τῶν χειλέων μου <strong>οὐ μὴ ἀθετήσω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/88/#L34">Ψλ 88:34</a>)</p></blockquote>
