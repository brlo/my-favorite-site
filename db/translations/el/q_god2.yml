  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«ὃς <b>οὐκ ἐπῃσχύνθη πρόσωπον ἐντίμου</b> <b>οὐδὲ οἶδεν τιμὴν θέσθαι ἁδροῖς</b> θαυμασθῆναι πρόσωπα αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/34/#L19">Ιωβ 34:19</a>)</blockquote><blockquote>«καὶ νῦν γενέσθω φόβος κυρίου ἐφ᾿ ὑμᾶς, καὶ φυλάσσετε καὶ ποιήσετε, ὅτι οὐκ ἔστιν μετὰ κυρίου θεοῦ ἡμῶν ἀδικία <b>οὐδὲ θαυμάσαι πρόσωπον</b> οὐδὲ λαβεῖν δῶρα.» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/19/#L7">Β Παρ 19:7</a>)</blockquote><blockquote>«ὅτι κύριος κριτής ἐστιν, καὶ <b>οὐκ ἔστιν παρ᾿ αὐτῷ δόξα προσώπου</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/35/#L12">Σ.Σειρ 35:12</a>)</blockquote><blockquote>«καὶ ἐλθόντες λέγουσιν αὐτῷ, Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ <b>οὐ μέλει σοι περὶ οὐδενός</b>, <b>οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων</b>, ἀλλ᾿ ἐπ᾿ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L14">Μκ 12:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/20/#L21">Λκ 20:21</a>)</blockquote><blockquote>«<b>οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L11">Ρωμ 2:11</a>)</blockquote><blockquote>«Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ αὐτῶν καὶ ὑμῶν ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ <b>προσωπολημψία οὐκ ἔστιν παρ᾿ αὐτῷ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L9">Εφ 6:9</a>)</blockquote><blockquote>«ὁ γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ <b>οὐκ ἔστιν προσωπολημψία</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L25">Κολ 3:25</a>)</blockquote><blockquote>«Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν <b>ἀπροσωπολήμπτως κρίνοντα</b> κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L17">Α Πε 1:17</a>)</blockquote>
