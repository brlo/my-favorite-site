  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Ο Θεός έδωσε αρχή σε ό,τι έχει αρχή:</p><blockquote><p>«ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα. ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν <strong>ἀπ᾿ ἀρχῆς</strong>. ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L14">Α Ιω 2:14</a>)</p></blockquote><blockquote><p>«Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος. &lt;…&gt; πάντα δι᾿ αὐτοῦ ἐγένετο, καὶ <strong>χωρὶς αὐτοῦ ἐγέν</strong>ετο οὐδὲ ἕν. ὃ γέγονεν» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1,3">Ιω 1:1,3</a>)</p></blockquote><p>Ο ιερέας Μελχισεδέκ — τύπος του Υιού του Θεού, που δεν έχει αρχή ημερών (άναρχος):</p><blockquote><p>«ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, <strong>μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ</strong>, μένει ἱερεὺς εἰς τὸ διηνεκές.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L3">Εβρ 7:3</a>)</p></blockquote>
