  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός είναι αόρατος</h2><blockquote><p>«<strong>τὰ γὰρ ἀόρατα αὐτοῦ</strong> ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L20">Ρωμ 1:20</a>)</p></blockquote><blockquote><p>«ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν <strong>εἰκὼν τοῦ θεοῦ</strong>. &lt;…&gt; τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ἡμῶν καθ᾿ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν, μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα· τὰ γὰρ βλεπόμενα πρόσκαιρα, <strong>τὰ δὲ μὴ βλεπόμενα αἰώνια</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/4/#L4,17-18">Β Κορ 4:4,17-18</a>)</p></blockquote><blockquote><p>«ὅς ἐστιν <strong>εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου</strong>, πρωτότοκος πάσης κτίσεως,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L15">Κολ 1:15</a>)</p></blockquote><blockquote><p>«τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, <strong>ἀοράτῳ</strong>, μόνῳ <strong>θεῷ</strong>, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L17">Α Τιμ 1:17</a>)</p></blockquote><blockquote><p>«ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, <strong>ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται</strong>· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L16">Α Τιμ 6:16</a>)</p></blockquote><blockquote><p>«Πίστει νοοῦμεν κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ, <strong>εἰς τὸ μὴ ἐκ φαινομένων τὸ βλεπόμενον</strong> γεγονέναι. &lt;…&gt; χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον <strong>τῷ θεῷ</strong> ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται. &lt;…&gt; Πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, <strong>τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L3,6,27">Εβρ 11:3,6,27</a>)</p></blockquote><blockquote><p>«<strong>θεὸν οὐδεὶς πώποτε τεθέαται</strong>· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ τετελειωμένη ἐν ἡμῖν ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L12">Α Ιω 4:12</a>)</p></blockquote><h2>Ο Θεός έγινε ορατός κατά την ανθρωπότητα μετά την ενανθρώπηση</h2><blockquote><p>«<strong>θεὸν οὐδεὶς ἑώρακεν πώποτε</strong>· μονογενὴς θεὸς ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>)</p></blockquote><p>Περισσότερα για τον άναρχο Υιό.</p>
