  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Αν και ο Θεός δημιούργησε τον άνθρωπο κατ' εικόνα Του:</p><blockquote><p>«καὶ <strong>ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, κατ᾿ εἰκόνα θεοῦ</strong> ἐποίησεν αὐτόν, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L27">Γεν 1:27</a>)</p></blockquote><p>Ωστόσο, αυτό δεν σημαίνει ότι ο Θεός μοιάζει εξωτερικά με τον άνθρωπο. Δεν σημαίνει ότι ο Θεός έχει χέρια, πόδια, μάτια, αυτιά και τα λοιπά:</p><blockquote><p>«<strong>ἦ ὥσπερ βροτὸς ὁρᾷ καθορᾷς ἢ καθὼς ὁρᾷ ἄνθρωπος βλέψῃ</strong>; ἦ ὁ βίος σου ἀνθρώπινός ἐστιν ἢ τὰ ἔτη σου ἀνδρός;» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/10/#L4-5">Ιωβ 10:4-5</a>)</p></blockquote><blockquote><p>«<strong>οὐ γάρ εἰσιν αἱ βουλαί μου ὥσπερ αἱ βουλαὶ ὑμῶν οὐδὲ ὥσπερ αἱ ὁδοὶ ὑμῶν αἱ ὁδοί μου, λέγει κύριος</strong>· <strong>ἀλλ᾿ ὡς ἀπέχει ὁ οὐρανὸς ἀπὸ τῆς γῆς, οὕτως ἀπέχει ἡ ὁδός μου ἀπὸ τῶν ὁδῶν ὑμῶν</strong> καὶ <strong>τὰ διανοήματα ὑμῶν ἀπὸ τῆς διανοίας μου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/55/#L8-9">Ησ 55:8-9</a>)</p></blockquote><blockquote><p>«<strong>οὐχ ὡς ἄνθρωπος ὁ θεὸς</strong> διαρτηθῆναι οὐδὲ ὡς υἱὸς ἀνθρώπου ἀπειληθῆναι· αὐτὸς εἴπας οὐχὶ ποιήσει; λαλήσει, καὶ οὐχὶ ἐμμενεῖ;» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/23/#L19">Αρ 23:19</a>)</p></blockquote><p>Ο άνθρωπος αποτελείται από σάρκα, ψυχή και πνεύμα. Αλλά ο Θεός δεν αποτελείται από σάρκα. Ο Θεός είναι πνεύμα:</p><blockquote><p>«<strong>πνεῦμα ὁ θεός</strong>, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L24">Ιω 4:24</a>)</p></blockquote><p>Ο Θεός γενικά δεν αποτελείται από ύλη, γιατί υπάρχει ήδη πριν από τη δημιουργία του κόσμου και της ύλης:</p><blockquote><p>«Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος. &lt;…&gt; <strong>πάντα δι᾿ αὐτοῦ ἐγέν</strong>ετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1,3">Ιω 1:1,3</a>)</p></blockquote><hr><p><em>*Εδώ μιλάμε για τη φύση του Θεού. Ναι, ο Θεός έγινε άνθρωπος (όχι απλώς κάποιος που μοιάζει με άνθρωπο, αλλά πραγματικός άνθρωπος) και από τότε μπορούμε να μιλάμε γι' Αυτόν και ως άνθρωπο. Ωστόσο, όταν έγινε άνθρωπος, ο Θεός δεν έπαψε να είναι αυτό που ήταν πριν — Θεός. Εδώ μιλάμε για τη φύση του Θεού.*</em></p>
