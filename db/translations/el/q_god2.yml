  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«ἐθαυμαστώθη ἡ γνῶσίς σου ἐξ ἐμοῦ· ἐκραταιώθη, οὐ μὴ δύνωμαι πρὸς αὐτήν. <b>ποῦ πορευθῶ ἀπὸ τοῦ πνεύματός σου καὶ ἀπὸ τοῦ προσώπου σου ποῦ φύγω</b>; <b>ἐὰν ἀναβῶ εἰς τὸν οὐρανόν, σὺ εἶ ἐκεῖ</b>· <b>ἐὰν καταβῶ εἰς τὸν ᾅδην, πάρει</b>· ἐὰν ἀναλάβοιμι τὰς πτέρυγάς μου κατ᾿ ὄρθρον καὶ κατασκηνώσω <b>εἰς τὰ ἔσχατα τῆς θαλάσσης</b>, καὶ γὰρ ἐκεῖ ἡ χείρ σου ὁδηγήσει με, καὶ καθέξει με ἡ δεξιά σου. καὶ εἶπα Ἄρα σκότος καταπατήσει με, καὶ νὺξ φωτισμὸς ἐν τῇ τρυφῇ μου· ὅτι <b>σκότος οὐ σκοτισθήσεται ἀπὸ σοῦ</b>, καὶ νὺξ ὡς ἡμέρα φωτισθήσεται· ὡς τὸ σκότος αὐτῆς, οὕτως καὶ τὸ φῶς αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/138/#L6-12">Ψλ 138:6-12</a>)</blockquote><blockquote>«ἔργα πάσης σαρκὸς ἐνώπιον αὐτοῦ, καὶ <b>οὐκ ἔστιν κρυβῆναι ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ</b>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/39/#L19">Σ.Σειρ 39:19</a>)</blockquote>
