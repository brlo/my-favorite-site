  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο Θεός είναι ένας, αλλά δεν είναι μονάδα εν εαυτώ</h2><blockquote><p>«καὶ <strong>εἶπεν ὁ θεός</strong> <strong><mark>Ποιήσωμεν</mark></strong> ἄνθρωπον <strong>κατ᾿ εἰκόνα <mark>ἡμετέραν</mark></strong> καὶ <strong>καθ᾿ <mark>ὁμοίωσιν</mark></strong>, καὶ ἀρχέτωσαν τῶν ἰχθύων τῆς θαλάσσης καὶ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ τῶν κτηνῶν καὶ πάσης τῆς γῆς καὶ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L26">Γεν 1:26</a>)</p></blockquote><blockquote><p>«καὶ <strong>εἶπεν ὁ θεός</strong> Ἰδοὺ <strong>Αδαμ γέγονεν ὡς <mark>εἷς ἐξ ἡμῶν</mark></strong> τοῦ γινώσκειν καλὸν καὶ πονηρόν, καὶ νῦν μήποτε ἐκτείνῃ τὴν χεῖρα καὶ λάβῃ τοῦ ξύλου τῆς ζωῆς καὶ φάγῃ καὶ ζήσεται εἰς τὸν αἰῶνα.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L22">Γεν 3:22</a>)</p></blockquote><h2>Ο ένας Θεός είναι Τριάδα στα πρόσωπα: Πατέρας, Υιός και Άγιο Πνεύμα</h2><ul><li><p>Ο Θεός είναι ένας</p></li><li><p><a href="https://bibleox.com/el/el/w/Ο_Πατέρας_είναι_Θεός">Ο Πατέρας — Θεός</a></p></li><li><p>Ο Υιός του Θεού — Θεός</p></li><li><p><a href="https://bibleox.com/el/el/w/Το_Άγιο_Πνεύμα_είναι_Θεός">Το Άγιο Πνεύμα — Θεός</a></p></li></ul><h2>Ο Υιός του Θεού είναι ένα με τον Πατέρα</h2><blockquote><p>«<strong>ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L30">Ιω 10:30</a>)</p></blockquote><blockquote><p>«<strong>πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν</strong>· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L15">Ιω 16:15</a>)</p></blockquote><h2>Από τον Πατέρα εκπορεύεται το Άγιο Πνεύμα</h2><blockquote><p>«Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, <strong>τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος</strong> μαρτυρήσει περὶ ἐμοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L26">Ιω 15:26</a>)</p></blockquote><p><strong><mark>Το άρθρο αναμένει επεξεργασία</mark></strong></p>'
