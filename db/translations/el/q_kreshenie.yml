  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η ουσία του μυστηρίου του Βαπτίσματος</h2><p><strong>Το Βάπτισμα</strong> («γέννηση άνωθεν», «πνευματική γέννηση») — μυστήριο που τελείται στην Εκκλησία, στο οποίο ο άνθρωπος:</p><ol><li><p>ξεπλένεται από τις αμαρτίες (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38">Πραξ 2:38</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L11">Α Κορ 6:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L16">Πραξ 22:16</a>),</p></li><li><p>γεννιέται πνευματικά (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L44">Α Κορ 15:44</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L47-50">Α Κορ 15:47-50</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L53">Α Κορ 15:53</a> · <a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>),</p></li><li><p>λαμβάνει τη σωτήρια χάρη (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/6/#L1">Β Κορ 6:1</a>),</p></li><li><p>εντάσσεται στην Εκκλησία (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13">Α Κορ 12:13</a>).</p></li></ol><h3>Η άφεση των αμαρτιών</h3><blockquote><p>«καὶ νῦν τί μέλλεις; <strong>ἀναστὰς βάπτισαι καὶ <mark>ἀπόλουσαι τὰς ἁμαρτίας σου</mark></strong> ἐπικαλεσάμενος τὸ ὄνομα αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L16">Πραξ 22:16</a>)</p></blockquote><blockquote><p>«καὶ ταῦτά τινες ἦτε· ἀλλὰ <strong><mark>ἀπελούσασθε</mark></strong>, ἀλλὰ <strong>ἡγιάσθητε</strong>, ἀλλὰ <strong>ἐδικαιώθητε</strong> ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L11">Α Κορ 6:11</a>)</p></blockquote><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, Μετανοήσατε, καὶ <strong>βαπτισθήτω</strong> ἕκαστος ὑμῶν ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ <strong><mark>εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν</mark></strong>, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38">Πραξ 2:38</a>)</p></blockquote><h3>Η γέννηση από το νερό και το Πνεύμα</h3><blockquote><p>«ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ, Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις <strong>γεννηθῇ ἄνωθεν</strong>, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ. &lt;…&gt; ἀπεκρίθη Ἰησοῦς, Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις <strong><mark>γεννηθῇ</mark> ἐξ ὕδατος καὶ πνεύματος</strong>, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ. <strong>τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν</strong>, καὶ <strong><mark>τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>)</p></blockquote><p><em>Οι υπόλοιπες παραθέσεις βρίσκονται πιο κάτω, στο «</em><em>βάπτισμα των νηπίων</em><em>».</em></p><h3>Η ένταξη στο σώμα του Χριστού</h3><blockquote><p>«καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες <strong><mark>εἰς ἓν σῶμα ἐβαπτίσθημεν</mark></strong>, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ πάντες ἓν πνεῦμα ἐποτίσθημεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13">Α Κορ 12:13</a>)</p></blockquote><h3>Η δυνατότητα να εισέλθει κανείς στη Βασιλεία του Θεού</h3><blockquote><p>«ἀπεκρίθη Ἰησοῦς, Ἀμὴν ἀμὴν λέγω σοι, <strong>ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται <mark>εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L5">Ιω 3:5</a>)</p></blockquote><h3>Η δυνατότητα να σωθεί</h3><blockquote><p>«ὃ καὶ ὑμᾶς ἀντίτυπον νῦν <strong><mark>σῴζει</mark></strong> <strong><mark>βάπτισμα</mark></strong>, οὐ σαρκὸς <strong>ἀπόθεσις ῥύπου</strong> ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L21">Α Πε 3:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L5">Τιτ 3:5</a>)</p></blockquote><h2>Η καθιέρωση του μυστηρίου του Βαπτίσματος</h2><blockquote><p><em>«Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ γῆς. </em><strong><em>πορευθέντες</em></strong><em> οὖν μαθητεύσατε πάντα τὰ ἔθνη, </em><strong><em>βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος</em></strong><em>»</em> (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L18-19">Μτ 28:18-19</a>)</p></blockquote><h2>Η ύλη του μυστηρίου του Βαπτίσματος — το νερό</h2><p>Το Βάπτισμα γίνεται με νερό, μέσα στο νερό. Στο ελληνικό κείμενο που παραθέτουμε (όπως και στα αρχαιότερα χειρόγραφα) λείπει ο στίχος 8:37 με την ομολογία του ευνούχου, γι’ αυτό η παράθεση είναι συντομότερη· για το χωρίο αυτό βλ. το τμήμα «Ο ευνούχος έλαβε το Άγιο Πνεύμα χωρίς τους αποστόλους;».</p><blockquote><p>«ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, <strong>ἦλθον ἐπί τι ὕδωρ</strong>, καί φησιν ὁ εὐνοῦχος, <strong>Ἰδοὺ ὕδωρ· τί κωλύει με βαπτισθῆναι</strong>; &lt;…&gt; καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ <strong>κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ</strong> ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ <strong>ἐβάπτισεν αὐτόν</strong>. ὅτε δὲ <strong>ἀνέβησαν ἐκ τοῦ ὕδατος</strong>, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος· ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L36,38-39">Πραξ 8:36,38-39</a>)</p></blockquote><blockquote><p>«Μήτι τὸ ὕδωρ δύναται κωλῦσαί τις <strong>τοῦ μὴ βαπτισθῆναι</strong> τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ὡς καὶ ἡμεῖς;» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L47">Πραξ 10:47</a>)</p></blockquote><h2>Οι προφητείες της Παλαιάς Διαθήκης για το Βάπτισμα</h2><blockquote><p><em>«καὶ </em><strong><em>ῥανῶ ἐφ᾿ ὑμᾶς ὕδωρ καθαρόν, καὶ καθαρισθήσεσθε ἀπὸ πασῶν τῶν ἀκαθαρσιῶν ὑμῶν</em></strong><em> καὶ ἀπὸ πάντων τῶν εἰδώλων ὑμῶν, καὶ καθαριῶ ὑμᾶς. καὶ δώσω ὑμῖν καρδίαν καινὴν καὶ πνεῦμα καινὸν»</em> (<a href="https://bibleox.com/el/gr-lxx-byz/iez/36/#L25-28">Ιεζ 36:25-28</a>)</p></blockquote><blockquote><p><em>«αὐτὸς ἐπιστρέψει καὶ οἰκτιρήσει ἡμᾶς, καταδύσει τὰς ἀδικίας ἡμῶν καὶ </em><strong><em>ἀπορριφήσονται εἰς τὰ βάθη τῆς θαλάσσης, πάσας τὰς ἁμαρτίας ἡμῶν.</em></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mih/7/#L19">Μιχ 7:19</a>)</p></blockquote><blockquote><p><em>«Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἔσται πᾶς τόπος </em><strong><em>διανοιγόμενος</em></strong><em> </em><strong><em>ἐν τῷ οἴκῳ Δαυιδ.</em></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/zah/13/#L1">Ζαχ 13:1</a>) Στην έκδοση των Εβδομήκοντα ο στίχος δίνεται συντομότερα, χωρίς το “για τον καθαρισμό από την αμαρτία και την ακαθαρσία”· η σλαβονική και η ρωσική μετάφραση ακολουθούν το εβραϊκό κείμενο.</p></blockquote><h2>Οι προϋποθέσεις του Βαπτίσματος</h2><h3>Η πίστη</h3><p>Χρειάζεται πίστη στον Θεό: στον Πατέρα, στον Υιό και στο Άγιο Πνεύμα (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L19">Μτ 28:19</a>). Στο ελληνικό κείμενο δεν σώζεται ο στίχος 8:37 με την ομολογία της πίστεως του ευνούχου («πιστεύω ότι ο Ιησούς Χριστός είναι ο Υιός του Θεού»), γι’ αυτό στο απόσπασμα δεν ακούγεται η ομολογία του· βλ. το τμήμα «Ο ευνούχος έλαβε το Άγιο Πνεύμα χωρίς τους αποστόλους;».</p><blockquote><p>«ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, <strong>ἦλθον ἐπί τι ὕδωρ</strong>, καί φησιν ὁ εὐνοῦχος, <strong>Ἰδοὺ ὕδωρ· τί κωλύει με βαπτισθῆναι</strong>; &lt;…&gt; καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ <strong>κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ</strong> ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ <strong>ἐβάπτισεν αὐτόν</strong>. ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος· ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L36,38-39">Πραξ 8:36,38-39</a>)</p></blockquote><h3>Η μετάνοια</h3><p>Χρειάζεται μετάνοια για τις αμαρτίες:</p><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, <strong>Μετανοήσατε</strong>, καὶ βαπτισθήτω ἕκαστος ὑμῶν ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38">Πραξ 2:38</a>)</p></blockquote><h2>Το Βάπτισμα των νηπίων</h2><h3>Όλοι πρέπει να γεννηθούν πνευματικά</h3><p>Όλοι ανεξαιρέτως οι άνθρωποι έχουν ανάγκη από πνευματική γέννηση για την αιώνια ζωή με τον Θεό:</p><blockquote><p>«καὶ <strong>σώματα ἐπουράνια, καὶ σώματα ἐπίγεια</strong>· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L40">Α Κορ 15:40</a>)</p></blockquote><blockquote><p>«<strong>εἰ ἔστιν σῶμα ψυχικόν, ἔστιν καὶ πνευματικόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L44">Α Κορ 15:44</a>)</p></blockquote><blockquote><p>«<strong>τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν</strong>, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L6">Ιω 3:6</a>)</p></blockquote><p>Οι κληρονόμοι του φθαρτού σώματος του Αδάμ δεν μπορούν να εισέλθουν στη Βασιλεία του Θεού:</p><blockquote><p>«<strong>ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός</strong>, ὁ δεύτερος ἄνθρωπος ἐξ οὐρανοῦ. <strong>οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί</strong>, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι· καὶ καθὼς <strong>ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ</strong>, φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου. Τοῦτο δέ φημι, ἀδελφοί, ὅτι <strong>σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ δύναται</strong>, οὐδὲ <strong>ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L47-50">Α Κορ 15:47-50</a>)</p></blockquote><p>Γι’ αυτό όλοι όσοι έχουν τη φθορά από τον Αδάμ πεθαίνουν, ενώ όσοι ενώθηκαν με τον Χριστό στο Βάπτισμα θα ζήσουν.</p><blockquote><p>«ὥσπερ γὰρ <strong>ἐν τῷ Ἀδὰμ</strong> <strong>πάντες ἀποθνῄσκουσιν</strong>, οὕτως καὶ <strong>ἐν τῷ Χριστῷ πάντες ζῳοποιηθήσονται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L22">Α Κορ 15:22</a>)</p></blockquote><blockquote><p>«ἢ ἀγνοεῖτε ὅτι <strong>ὅσοι</strong> <strong>ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν</strong> εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν; &lt;…&gt; εἰ γὰρ <strong>σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ</strong>, ἀλλὰ καὶ <strong>τῆς ἀναστάσεως</strong> ἐσόμεθα·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/6/#L3,5">Ρωμ 6:3,5</a>)</p></blockquote><p>Κάθε θνητό πρέπει να ενδυθεί την αθανασία:</p><blockquote><p>«δεῖ γὰρ <strong>τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν</strong> καὶ <strong>τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L53">Α Κορ 15:53</a>)</p></blockquote><p>Δηλαδή να ενδυθούμε τον Χριστό στο Βάπτισμα:</p><blockquote><p>«ὅσοι γὰρ <strong>εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>)</p></blockquote><h3>Όλοι πρέπει να καθαριστούν από το προπατορικό αμάρτημα</h3><p>Επίσης, όλοι ανεξαιρέτως οι άνθρωποι κληρονομούν την αμαρτωλότητα από τους προπάτορες. Δηλαδή <a href="https://bibleox.com/el/el/w/%CE%8C%CE%BB%CE%BF%CE%B9_%CE%BF%CE%B9_%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CE%B9_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%B1%CE%BC%CE%B1%CF%81%CF%84%CF%89%CE%BB%CE%BF%CE%AF">την έχουν και τα νήπια</a>:</p><blockquote><p>«τίς γὰρ καθαρὸς ἔσται ἀπὸ ῥύπου; ἀλλ᾿ <strong>οὐθείς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/14/#L4">Ιωβ 14:4</a>)</p></blockquote><blockquote><p>«ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ <strong>ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/50/#L5">Ψλ 50:5</a>)</p></blockquote><blockquote><p>«Διὰ τοῦτο ὥσπερ <strong>δι᾿ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν</strong> καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους <strong>ὁ θάνατος διῆλθεν, ἐφ᾿ ᾧ πάντες ἥμαρτον</strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L12">Ρωμ 5:12</a>)</p></blockquote><blockquote><p><em>«ὥσπερ γὰρ </em><strong><em>διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί</em></strong><em>, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L19"><em>Ρωμ 5:19</em></a><em>)</em></p></blockquote><blockquote><p>«<strong>οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω</strong>. εἰ δὲ ὃ οὐ θέλω [ἐγὼ] τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ <strong>ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία</strong>. Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται· συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον, <strong>βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου</strong>. ταλαίπωρος ἐγὼ ἄνθρωπος· <strong>τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L19-24">Ρωμ 7:19-24</a>)</p></blockquote><blockquote><p><em>«οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· </em><strong><em>ἐγὼ δὲ σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν</em></strong><em>. &lt;…&gt; συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον, </em><strong><em>βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον</em></strong><em> τῷ νόμῳ τοῦ νοός μου καὶ </em><strong><em>αἰχμαλωτίζοντά με ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L14,22-23"><em>Ρωμ 7:14,22-23</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐν οἷς καὶ ἡμεῖς </em><strong><em>πάντες</em></strong><em> ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ </em><strong><em>ἤμεθα</em></strong><em> </em><strong><em>τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L3"><em>Εφ 2:3</em></a><em>)</em></p></blockquote><h3>Οι απόστολοι βάπτιζαν ολόκληρες οικογένειες (οίκους)</h3><blockquote><p>«<strong>ἐβάπτισα δὲ καὶ τὸν Στεφανᾶ οἶκον</strong>· λοιπὸν οὐκ οἶδα εἴ τινα ἄλλον ἐβάπτισα.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L16">Α Κορ 1:16</a>)</p></blockquote><blockquote><p>«<strong>ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/16/#L15">Πραξ 16:15</a>)</p></blockquote><blockquote><p>«τί με δεῖ ποιεῖν ἵνα σωθῶ; οἱ δὲ εἶπαν, Πίστευσον ἐπὶ τὸν κύριον Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου. καὶ ἐλάλησαν αὐτῷ τὸν λόγον τοῦ κυρίου σὺν πᾶσιν τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ. καὶ παραλαβὼν αὐτοὺς ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτὸς ἔλουσεν ἀπὸ τῶν πληγῶν, καὶ <strong>ἐβαπτίσθη αὐτὸς καὶ οἱ αὐτοῦ πάντες</strong> παραχρῆμα» (<a href="https://bibleox.com/el/gr-lxx-byz/act/16/#L30-33">Πραξ 16:30-33</a>)</p></blockquote><p>Ο απόστολος καλεί όλους να βαπτιστούν, λέγοντας ότι η επαγγελία ανήκει όχι μόνο σε αυτούς (τους ενήλικες), αλλά και στα παιδιά τους:</p><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, <strong>Μετανοήσατε</strong>, καὶ <strong>βαπτισθήτω ἕκαστος ὑμῶν</strong> ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος· <strong>ὑμῖν γάρ ἐστιν ἡ <u>ἐπαγγελία</u> καὶ τοῖς <u>τέκνοις ὑμῶν</u></strong> καὶ πᾶσιν τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38-39">Πραξ 2:38-39</a>)</p></blockquote><p>Εδώ γίνεται λόγος κυριολεκτικά για νήπια. Πρέπει να εμβαθύνουμε στο πλαίσιο για να καταλάβουμε ποια είναι αυτή η αναφερόμενη <strong>επαγγελία</strong> (υπόσχεση). Σε αυτό το κεφάλαιο διηγείται η κάθοδος του Αγίου Πνεύματος στη σύναξη της Εκκλησίας την ημέρα της Πεντηκοστής. Εξηγώντας αυτό το γεγονός, ο απόστολος Πέτρος παραπέμπει στην επαγγελία που δόθηκε μέσω του προφήτη Ιωήλ:</p><blockquote><p>«καὶ <strong>ἐπλήσθησαν πάντες πνεύματος ἁγίου</strong>, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ἀποφθέγγεσθαι αὐτοῖς. &lt;…&gt; Σταθεὶς δὲ <strong>ὁ Πέτρος</strong> σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς, Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου. οὐ γὰρ ὡς ὑμεῖς ὑπολαμβάνετε οὗτοι μεθύουσιν, ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας, ἀλλὰ <strong>τοῦτό ἐστιν τὸ εἰρημένον διὰ τοῦ προφήτου <u>Ἰωήλ</u></strong>, Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, <strong>ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα</strong>, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ἐνυπνίοις ἐνυπνιασθή σονται· &lt;…&gt; Ἀκούσαντες δὲ κατενύγησαν τὴν καρδίαν, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους, Τί ποιήσωμεν, ἄνδρες ἀδελφοί; Πέτρος δὲ πρὸς αὐτούς, <strong>Μετανοήσατε, καὶ βαπτισθήτω ἕκαστος ὑμῶν</strong> ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος· <strong><u>ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν</u> καὶ πᾶσιν τοῖς εἰς μακρὰν</strong> ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L4,14-17,37-39">Πραξ 2:4,14-17,37-39</a>)</p></blockquote><p>Λοιπόν, ο απόστολος Πέτρος παραθέτει τον προφήτη Ιωήλ. Ας δούμε όμως αυτή την επαγγελία στον ίδιο τον προφήτη Ιωήλ:</p><blockquote><p>«Σαλπίσατε σάλπιγγι ἐν Σιων, κηρύξατε ἐν ὄρει ἁγίῳ μου, καὶ συγχυθήτωσαν πάντες οἱ κατοικοῦντες τὴν γῆν, διότι πάρεστιν ἡμέρα κυρίου, ὅτι ἐγγύς, &lt;…&gt; σαλπίσατε σάλπιγγι ἐν Σιων, ἁγιάσατε νηστείαν, κηρύξατε θεραπείαν, <strong>συναγάγετε λαόν, ἁγιάσατε ἐκκλησίαν, ἐκλέξασθε πρεσβυτέρους, συναγάγετε <u>νήπια θηλάζοντα μαστούς</u></strong>, ἐξελθάτω νυμφίος ἐκ τοῦ κοιτῶνος αὐτοῦ καὶ νύμφη ἐκ τοῦ παστοῦ αὐτῆς. ἀνὰ μέσον τῆς κρηπῖδος τοῦ θυσιαστηρίου κλαύσονται οἱ ἱερεῖς οἱ λειτουργοῦντες κυρίῳ καὶ ἐροῦσιν Φεῖσαι, κύριε, τοῦ λαοῦ σου καὶ μὴ δῷς τὴν κληρονομίαν σου εἰς ὄνειδος τοῦ κατάρξαι αὐτῶν ἔθνη, ὅπως μὴ εἴπωσιν ἐν τοῖς ἔθνεσιν Ποῦ ἐστιν ὁ θεὸς αὐτῶν; <strong><u>Καὶ ἐζήλωσεν κύριος τὴν γῆν αὐτοῦ καὶ ἐφείσατο τοῦ λαοῦ αὐτοῦ</u></strong>.&lt;…&gt;Καὶ ἔσται μετὰ ταῦτα καὶ <strong><u>ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα</u></strong>, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ πρεσβύτεροι ὑμῶν ἐνύπνια ἐνυπνιασθήσονται, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται·» (<a href="https://bibleox.com/el/gr-lxx-byz/iol/2/#L1,15-18">Ιλ 2:1,15-18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/iol/3/#L1">Ιλ 3:1</a>)</p></blockquote><p>Να η επαγγελία. Όλος ο λαός καλείται σε αυτή την πανηγυρική σύναξη: από τους γέροντες έως τα βρέφη που θηλάζουν. Και σε όλο αυτόν τον συναγμένο λαό ο Θεός υποσχέθηκε να εκχύσει το Άγιο Πνεύμα, όπως είναι γραμμένο: σε κάθε σάρκα. Έτσι, όταν ο απόστολος λέει ότι η επαγγελία ανήκει όχι μόνο σε όσους ακούνε, αλλά και στα παιδιά τους και στους μακρινούς, τότε με τα «παιδιά» εννοεί κυριολεκτικά τα νήπια, αν ακολουθήσουμε το πλαίσιο.</p><h3>Η ενέργεια της χάριτος του Θεού με την πίστη άλλων ανθρώπων</h3><p>Τη στιγμή που τα νήπια δέχονται το Βάπτισμα μπορεί να ενεργεί η πίστη των αναδόχων τους. Στη Γραφή υπάρχουν πολλές περιπτώσεις όπου η θεία χάρη ενεργούσε σε κάποιους ανθρώπους με την πίστη άλλων:</p><h4>Ο Σωτήρας θεραπεύει τα παιδιά με την πίστη των γονέων</h4><p>Ο Θεός ενεργεί στα παιδιά με την πίστη των γονέων:</p><ul><li><p>Η πίστη ζητείται από τον πατέρα, και θεραπεύεται από το δαιμόνιο ο γιος (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L17-24">Μκ 9:17-24</a>);</p></li><li><p>Η πίστη ζητείται από τον πατέρα, και ανασταίνεται η θεραπευμένη κόρη του Ιαείρου (<a href="https://bibleox.com/el/gr-lxx-byz/lk/8/#L41-42,49-55">Λκ 8:41-42,49-55</a>);</p></li><li><p>Πιστεύει η μητέρα, και θεραπεύεται από το δαιμόνιο η κόρη της Χαναναίας (<a href="https://bibleox.com/el/gr-lxx-byz/mf/15/#L22-28">Μτ 15:22-28</a>);</p></li><li><p>Πιστεύει ο πατέρας, και θεραπεύεται ο γιος του βασιλικού (<a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L46-50">Ιω 4:46-50</a>).</p></li></ul><h4>Περιπτώσεις θεραπείας (ενέργειας της χάριτος) με την πίστη των οικείων</h4><ul><li><p>Πιστεύει ο εκατόνταρχος, και θεραπεύεται ο δούλος του (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L10,13">Μτ 8:10,13</a>)</p></li><li><p>Πιστεύουν οι φίλοι, και θεραπεύεται ο παραλυτικός σύντροφος (<a href="https://bibleox.com/el/gr-lxx-byz/mk/2/#L5">Μκ 2:5</a>). Εδώ είναι σημαντικό ότι με την πίστη άλλων, στον άνθρωπο συγχωρέθηκαν επιπλέον και οι <strong>αμαρτίες</strong>.</p></li></ul><p>Περισσότερα: η ενέργεια του Θεού με την πίστη γονέων και φίλων</p><h3>Η υπόσχεση αφιέρωσης στον Θεό του μελλοντικού γιου</h3><p>Οι γονείς αφιέρωναν στον Θεό όχι μόνο τα ήδη γεννημένα νήπια (την 8η ημέρα), αλλά ακόμη και εκείνα που ακόμη ζητούσαν από τον Θεό. Έτσι γεννήθηκε ο προφήτης Σαμουήλ:</p><blockquote><p>«καὶ ηὔξατο εὐχὴν κυρίῳ λέγουσα Αδωναι κύριε ελωαι σαβαωθ, ἐὰν ἐπιβλέπων ἐπιβλέψῃς ἐπὶ τὴν ταπείνωσιν τῆς δούλης σου καὶ μνησθῇς μου καὶ δῷς τῇ δούλῃ σου σπέρμα ἀνδρῶν, καὶ <strong>δώσω αὐτὸν ἐνώπιόν σου δοτὸν ἕως ἡμέρας θανάτου αὐτοῦ, καὶ οἶνον καὶ μέθυσμα οὐ πίεται, καὶ σίδηρος οὐκ ἀναβήσεται ἐπὶ τὴν κεφαλὴν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/1/#L11">Α Βασ 1:11</a>)</p></blockquote><h2>Οι προτυπώσεις του Βαπτίσματος στην Παλαιά Διαθήκη</h2><h3>Η περιτομή</h3><p>Η περιτομή της Παλαιάς Διαθήκης είναι προτύπωση του Βαπτίσματος της Καινής Διαθήκης:</p><blockquote><p>«ἐν ᾧ καὶ <strong>περιετμήθητε περιτομῇ ἀχειροποιήτῳ</strong> ἐν τῇ ἀπεκδύσει τοῦ σώματος τῆς σαρκός, <strong>ἐν τῇ περιτομῇ τοῦ Χριστοῦ, συνταφέντες αὐτῷ ἐν τῷ βαπτισμῷ</strong>, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L11-12">Κολ 2:11-12</a>)</p></blockquote><p>Η καθιέρωση της παλαιοδιαθηκικής περιτομής, που ήταν η είσοδος στη διαθήκη με τον Θεό, στην οποία εισέρχονταν τα νήπια από την 8η ημέρα:</p><blockquote><p>«καὶ αὕτη ἡ διαθήκη, ἣν διατηρήσεις, ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν καὶ ἀνὰ μέσον τοῦ σπέρματός σου μετὰ σὲ εἰς τὰς γενεὰς αὐτῶν· περιτμηθήσεται ὑμῶν πᾶν ἀρσενικόν, καὶ περιτμηθήσεσθε τὴν σάρκα τῆς ἀκροβυστίας ὑμῶν, καὶ <strong>ἔσται ἐν σημείῳ διαθήκης ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν</strong>. καὶ <strong>παιδίον ὀκτὼ ἡμερῶν περιτμηθήσεται ὑμῖν πᾶν ἀρσενικὸν εἰς τὰς γενεὰς ὑμῶν</strong>, ὁ οἰκογενὴς τῆς οἰκίας σου καὶ ὁ ἀργυρώνητος ἀπὸ παντὸς υἱοῦ ἀλλοτρίου, ὃς οὐκ ἔστιν ἐκ τοῦ σπέρματός σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L10-12">Γεν 17:10-12</a>)</p></blockquote><h3>Η έξοδος από τη δουλεία περνώντας από τον βυθό της θάλασσας</h3><p>Η έξοδος των Εβραίων από τη δουλεία της Αιγύπτου περνώντας από τον βυθό της Ερυθράς θάλασσας είναι προτύπωση του Βαπτίσματος της Καινής Διαθήκης. Όλος ο λαός βγήκε από τη δουλεία και όλος ο λαός βαπτίστηκε στον Μωυσή, μαζί με τα νήπια:</p><blockquote><p>«Οὐ θέλω γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν <strong>πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον, καὶ πάντες εἰς τὸν Μωϋσῆν ἐβαπτίσαντο ἐν τῇ νεφέλῃ καὶ ἐν τῇ θαλάσσῃ</strong>, καὶ πάντες τὸ αὐτὸ πνευματικὸν βρῶμα ἔφαγον, καὶ πάντες τὸ αὐτὸ πνευματικὸν ἔπιον πόμα· ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας· ἡ πέτρα δὲ ἦν ὁ Χριστός.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L1-4">Α Κορ 10:1-4</a>)</p></blockquote><p>Αυτοί οι τύποι έχουν άμεση σημασία:</p><blockquote><p><em>«ταῦτα δὲ τυπικῶς συνέβαινεν ἐκείνοις, </em><strong><em>ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν</em></strong><em>, εἰς οὓς τὰ τέλη τῶν αἰώνων κατήντηκεν.</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L11">Α Κορ 10:11</a>)</p></blockquote><h2>Το βάπτισμα του αίματος</h2><p>Το βάπτισμα του αίματος είναι ο μαρτυρικός θάνατος για τον Χριστό. Εδώ δεν εννοείται ο τζιχάντ ή η πράξη του καμικάζι. Ο μάρτυρας θέλει να ζήσει και δεν απειλεί τη ζωή κανενός. Αλλά μόνο εξαιτίας της πίστης του στον Χριστό του αφαιρούν τη ζωή. Τέτοιοι άνθρωποι, χωρίς βάπτισμα στο νερό, φτάνουν όχι μόνο στη σωτηρία, αλλά και σε ιδιαίτερη δόξα στον ουρανό με τον Χριστό.</p><h3>Ο Χριστός μιλά για τα επερχόμενα πάθη και τον θάνατό Του ως βάπτισμα</h3><blockquote><p>«ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν, Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω πίνειν; λέγουσιν αὐτῷ, Δυνάμεθα. λέγει αὐτοῖς, Τὸ μὲν ποτήριόν μου πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν τοῦτο δοῦναι, ἀλλ᾿ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/20/#L22-23">Μτ 20:22-23</a>)</p></blockquote><h3>Στους φονευμένους για τον Χριστό δίνονται στον ουρανό λευκά ενδύματα</h3><blockquote><p><em>«Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον </em><strong><em>ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν μαρτυρίαν ἣν εἶχον</em></strong><em>. καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες, Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς; καὶ </em><strong><em>ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή</em></strong><em>, καὶ ἐρρέθη αὐτοῖς ἵνα ἀναπαύσονται ἔτι χρόνον μικρόν, ἕως πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ αὐτῶν οἱ μέλλοντες ἀποκτέννεσθαι ὡς καὶ αὐτοί.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11"><em>Απ 6:9-11</em></a><em>)</em></p></blockquote><p>*Στην ελληνική γλώσσα οι μάρτυρες ονομάζονται με τη λέξη μάρτυς, που σημαίνει «αυτόπτης μάρτυρας». Με την πράξη τους οι μάρτυρες μαρτυρούν τη σταθερή πίστη στον Χριστό και στην ανάσταση, γεγονός που συχνά γινόταν για τους άλλους αφορμή να δεχτούν την πίστη στον Χριστό.</p><h3>Ο Χριστός για τους μάρτυρες και τους διωγμούς</h3><blockquote><p>«<strong>Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν [τοῖς] οὐρανοῖς</strong>· ὅστις δ᾿ ἂν ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι κἀγὼ αὐτὸν ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν [τοῖς] οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L32-33">Μτ 10:32-33</a>)</p></blockquote><blockquote><p>«Λέγω δὲ ὑμῖν, <strong>πᾶς ὃς ἂν ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L8">Λκ 12:8</a>)</p></blockquote><blockquote><p>«μακάριοι <strong>οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν</strong>. μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ <strong>διώξωσιν καὶ εἴπωσιν πᾶν πονηρὸν καθ᾿ ὑμῶν [ψευδόμενοι] ἕνεκεν ἐμοῦ</strong>· χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι <strong>ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς</strong>· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L10-12">Μτ 5:10-12</a>)</p></blockquote><h2>Μετά το βάπτισμα οι πιστοί μπορούν ακόμη να αμαρτάνουν και πρέπει να αγωνίζονται κατά της αμαρτίας μέσα τους</h2><blockquote><p>«<strong>Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας</strong>, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L26">Εβρ 10:26</a>)</p></blockquote><blockquote><p>«<strong>ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν</strong>. ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L8-9">Α Ιω 1:8-9</a>)</p></blockquote><blockquote><p>«Τεκνία μου, ταῦτα <strong><mark>γράφω ὑμῖν ἵνα μὴ ἁμάρτητε</mark></strong>. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα, Ἰησοῦν Χριστὸν δίκαιον·» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L1">Α Ιω 2:1</a>)</p></blockquote><blockquote><p>«<strong><mark>Πόθεν πόλεμοι καὶ πόθεν μάχαι ἐν ὑμῖν</mark></strong>; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L1">Ιακ 4:1</a>)</p></blockquote><blockquote><p><em>«ἀσθενεῖ τις ἐν ὑμῖν; </em><strong><em>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</em></strong><em>, καὶ προσευξάσθωσαν ἐπ᾿ αὐτὸν ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ </em><strong><em>ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα</em></strong><em>, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· </em><strong><em>κἂν <mark>ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</mark></em></strong><em>. ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ </em><strong><em>εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-16"><em>Ιακ 5:14-16</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἐκνήψατε δικαίως καὶ <mark>μὴ ἁμαρτάνετε</mark></em></strong><em>, </em><strong><em>ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν</em></strong><em>· πρὸς ἐντροπὴν ὑμῖν λαλῶ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L33-34"><em>Α Κορ 15:33-34</em></a><em>)</em></p></blockquote><blockquote><p>«γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, <strong><mark>χαριζόμενοι ἑαυτοῖς</mark></strong> καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L32">Εφ 4:32</a>)</p></blockquote><p>Τέλος, ο Κύριος Ιησούς Χριστός δίνει στους μαθητές Του μια προσευχή, με την οποία τους διδάσκει να ζητούν τη συγχώρηση των αμαρτιών. Δεν είναι μια προσευχή που πρέπει να ειπωθεί μια φορά στη ζωή. Οι μαθητές ζήτησαν από τον Χριστό να τους διδάξει να προσεύχονται, και ο Χριστός ως απάντηση τους έδωσε αυτό το υπόδειγμα:</p><blockquote><p>«εἶπεν δὲ αὐτοῖς, <strong><mark>Ὅταν προσεύχησθε, λέγετε</mark></strong>, Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία σου τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δίδου ἡμῖν τὸ καθ᾿ ἡμέραν· καὶ <strong><mark>ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν</mark></strong>, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L1-4">Λκ 11:1-4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L7-13">Μτ 6:7-13</a>)</p></blockquote><h2>Κριτική</h2><h3>Στα λόγια για τη γέννηση από το νερό και το Πνεύμα (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L5">Ιω 3:5</a>), το νερό σημαίνει το Πνεύμα;</h3><p>Οι νεοπροτεστάντες ερμηνεύουν αλληγορικά τα λόγια του Σωτήρα για την ανάγκη να γεννηθεί κανείς από το νερό και το Πνεύμα για τη σωτηρία, λέγοντας ότι με το νερό εννοείται το Πνεύμα. Συνδέουν τα δύο επόμενα χωρία:</p><blockquote><p>«ἀπεκρίθη Ἰησοῦς, Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις <strong>γεννηθῇ ἐξ <mark>ὕδατος</mark> καὶ πνεύματος</strong>, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L5">Ιω 3:5</a>)</p></blockquote><blockquote><p>«ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, <strong>ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ <mark>ῥεύσουσιν ὕδατος</mark> ζῶντος. τοῦτο δὲ <mark>εἶπεν</mark> <mark>περὶ τοῦ πνεύματος</mark></strong> ὃ ἔμελλον λαμβάνειν οἱ πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν πνεῦμα, ὅτι Ἰησοῦς οὐδέπω ἐδοξάσθη.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L38-39">Ιω 7:38-39</a>)</p></blockquote><p>Αλλά αν το νερό το καταλάβουμε ως Πνεύμα, τότε προκύπτει ταυτολογία (περιττή επανάληψη του ίδιου). Τότε ο Χριστός θα έλεγε ότι πρέπει να γεννηθεί κανείς από το Πνεύμα και το Πνεύμα. Αν σε αυτόν τον λόγο ήταν κατάλληλο να μιλήσει για το Πνεύμα ευθέως, γιατί να καταφύγει σε αλληγορία; Και στην περίπτωση της αλληγορίας θα έπρεπε να πει: «<em>από το νερό του Πνεύματος</em>» ή «<em>από το νερό </em><strong><em><u>ή</u></em></strong><em> το Πνεύμα</em>» (που θα ήταν το ίδιο), ενώ έτσι προκύπτει ότι πρέπει να γεννηθεί κανείς από το Πνεύμα <strong><u>και</u></strong> από κάτι άλλο, δηλαδή από το νερό.</p><p>Εξάλλου, όπως γνωρίζουμε καλά και από τη Γραφή, οι απόστολοι τελούσαν την αναγέννηση κυριολεκτικά μέσα στο νερό. Δηλαδή το νερό στο Βάπτισμα ήταν πάντοτε πραγματικό, ενώ ποτάμια από την κοιλιά (κυριολεκτικά) δεν έτρεξαν ποτέ σε κανέναν.</p><p>Γι’ αυτό, εφόσον οι απόστολοι βάπτιζαν μέσα στο νερό, και το βάπτισμα ενεργούνταν από το Άγιο Πνεύμα, καταλαβαίνουμε τα λόγια του Σωτήρα για τη γέννηση από το νερό και το Πνεύμα σε σχέση με τον τρόπο που το τελούσαν οι απόστολοι: από το νερό και το Πνεύμα, δηλαδή αυτή η κατανόηση είναι αντικειμενικά συνδεδεμένη με την αποστολική πρακτική του βαπτίσματος μέσα στο νερό. Η Εκκλησία στην αρχαιότητα δεν καταλάβαινε ποτέ το Βάπτισμα χωριστά από το νερό, καθαρά νοητά, αλλά ως τριπλή κατάδυση σε αγιασμένα νερά, με επίκληση του ονόματος του Πατέρα, του Υιού και του Αγίου Πνεύματος.</p><h3>Για το Βάπτισμα χρειάζεται μετάνοια, αλλά τα νήπια δεν μπορούν να μετανοήσουν, άρα δεν μπορούν να βαπτιστούν;</h3><p>Κάποιες κοινότητες που χωρίστηκαν από την Εκκλησία την κατηγορούν ότι δέχεται τα νήπια στο Βάπτισμα. Δείχνουν το βιβλικό χωρίο στο οποίο ο απόστολος καλεί τους ακροατές πρώτα να μετανοήσουν και μετά να βαπτιστούν:</p><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, <strong>Μετανοήσατε</strong>, καὶ <strong>βαπτισθήτω ἕκαστος ὑμῶν</strong> ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος· ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσιν τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38-39">Πραξ 2:38-39</a>)</p></blockquote><p>Η απαίτηση της μετάνοιας αφορά τους ενήλικες, ενώ τα νήπια δεν έχουν προσωπικές αμαρτίες, γι’ αυτό είναι δύσκολο να τους αποδοθεί η απαίτηση της μετάνοιας. Δηλαδή τα νήπια πρέπει να βαπτιστούν, αλλά αφού δεν έχουν προσωπικές αμαρτίες, δεν χρειάζεται να μετανοήσουν για κάτι που δεν υπάρχει.</p><p>Γενικά, η κατηγορία ακούγεται πολύ παράξενη. Από αυτήν συνάγεται ότι τα νήπια, για να ενδυθούν τον Χριστό (να βαπτιστούν — <a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>), πρέπει πρώτα να αμαρτήσουν, και όσο δεν αμαρτάνουν δεν μπορούν να μετανοήσουν, άρα δεν θα μπορέσουν ποτέ να βαπτιστούν. Βγαίνει κάποιο παράλογο: για να αποκτήσει κανείς τη δυνατότητα ένωσης με τον Χριστό πρέπει πρώτα να αμαρτήσει κατά του Χριστού. Φυσικά, αυτό είναι μεγάλο λάθος. Όλοι πρέπει να βαπτιστούν, και να μετανοήσουν πρέπει μόνο όσοι έχουν αμαρτήσει.</p><p>Το βάπτισμα της μετάνοιας από τον προφήτη Ιωάννη, αν και δεν είναι το ίδιο με το βάπτισμα στον Χριστό (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L4">Πραξ 19:4</a>), μας επιτρέπει να βεβαιωθούμε για την ορθότητα των συλλογισμών. Ο προφήτης Ιωάννης βάπτιζε σε μετάνοια, αλλά όταν έρχεται σε αυτόν ο Χριστός, χωρίς μετάνοια βυθίζεται αμέσως στα νερά. Ο Χριστός δεν έχει αμαρτίες, γι’ αυτό δέχεται το βάπτισμα της μετάνοιας χωρίς μετάνοια. Το ίδιο και με τα νήπια. Ο Χριστός δεν χρειαζόταν να αποκτήσει αμαρτίες για να μπορέσει να δεχτεί το βάπτισμα της μετάνοιας. Το ίδιο και με τα νήπια. Στο βάπτισμα καλούνται όλοι, και μετανοούν μόνο όσοι έχουν για τι να μετανοήσουν.</p><h3>Για το Βάπτισμα χρειάζεται πίστη, αλλά τα νήπια δεν μπορούν να ομολογήσουν την πίστη, άρα δεν μπορούν να βαπτιστούν;</h3><p>Οι κοινότητες που χωρίστηκαν από την Εκκλησία δείχνουν και ένα άλλο βιβλικό χωρίο, στο οποίο ο Κύριος λέει να πιστέψουν οι άνθρωποι και να βαπτιστούν:</p><blockquote><p>«ὁ <strong>πιστεύσας καὶ βαπτισθεὶς</strong> σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L16">Μκ 16:16</a>)</p></blockquote><p>Λοιπόν, μία από τις αναγκαίες προϋποθέσεις της σωτηρίας είναι η απόκτηση <strong>πίστης</strong> και η αποδοχή του <strong>βαπτίσματος</strong>. Χωρίς την εκπλήρωση αυτών των προϋποθέσεων ο άνθρωπος δεν μπορεί να σωθεί. Ωστόσο, στα νήπια είναι δύσκολο να αποδοθεί η απαίτηση της πίστης, γι’ αυτό βαπτίζονται με την πίστη των αναδόχων, για το οποίο υπάρχουν επίσης βιβλικές βάσεις (περισσότερα).</p><p>Αξίζει επίσης να προσέξουμε ιδιαίτερα τα επόμενα λόγια: όποιος δεν πιστέψει — θα καταδικαστεί. Αλλά τι προκύπτει τότε, ότι τα νήπια θα καταδικαστούν, αφού δεν μπορούν να πιστέψουν;</p><blockquote><p>«ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, <strong>ὁ δὲ ἀπιστήσας κατακριθήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L16">Μκ 16:16</a>)</p></blockquote><p>Το θέμα είναι ότι η απαίτηση της πίστης σε αυτό το χωρίο αφορά μόνο τους ενήλικες. Το ίδιο το βάπτισμα, όπως είπε ο Σωτήρας αλλού (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>), είναι αναγκαίο για όλους, μαζί και για τα νήπια. Το νήπιο θα μεγαλώνει ήδη ενδεδυμένο τον Χριστό στο Βάπτισμα (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>) με την πίστη των αναδόχων (περισσότερα). Καθώς αυξάνονται οι ικανότητες του νηπίου, θα ενισχύεται στην πίστη από τους αναδόχους. Αν όμως συμβεί κακό και το νήπιο πεθάνει από τραγικές συνθήκες, τότε, ως βαπτισμένο, φτάνει στη Βασιλεία των Ουρανών και στην αιώνια ζωή με τον Χριστό.</p><p>Όσο για τη σειρά των λόγων του Σωτήρα (να πιστέψει και να βαπτιστεί), υπάρχει και η αντίστροφη σειρά:</p><blockquote><p>«ἐγένετο Ἰωάννης <strong>βαπτίζων ἐν τῇ ἐρήμῳ καὶ κηρύσσων</strong> βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L4">Μκ 1:4</a>)</p></blockquote><p>Ας παραδεχτούν λοιπόν και εδώ ότι πρώτα χορηγούνταν το βάπτισμα της μετάνοιας και μετά ακουγόταν το κήρυγμα.</p><h3>Μα ο Χριστός βαπτίστηκε μόνο στα 30 Του χρόνια;</h3><p>Το βάπτισμα του προφήτη Ιωάννη του Βαπτιστή δεν είναι βάπτισμα στον Χριστό. Εκείνους που είχαν ήδη το βάπτισμα του Ιωάννη, ο απόστολος Παύλος τους βάπτισε πάλι στον Χριστό:</p><blockquote><p>«εἶπέν τε πρὸς αὐτούς, Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ δὲ πρὸς αὐτόν, Ἀλλ᾿ οὐδ᾿ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν. ὁ δὲ εἶπεν, <strong>Εἰς τί οὖν ἐβαπτίσθητε</strong>; οἱ δὲ εἶπαν, <strong>Εἰς τὸ Ἰωάννου βάπτισμα</strong>. εἶπεν δὲ Παῦλος, <strong>Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας</strong>, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ᾿ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ᾿ ἔστιν εἰς τὸν Ἰησοῦν. ἀκούσαντες δὲ <strong>ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ· καὶ ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ᾿ αὐτούς</strong>, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L2-6">Πραξ 19:2-6</a>)</p></blockquote><p>Εξάλλου, είναι παράξενο να ακούει κανείς μια τέτοια κατηγορία από εκείνους που δεν μιμούνται τον Χριστό σ’ αυτό, δεν βαπτίζονται στα 30 τους χρόνια και βαπτίζουν τα παιδιά τους, αν και όχι σε βρεφική ηλικία, ωστόσο δεν περιμένουν τα 30 χρόνια, βαπτίζοντάς τα στα 8-12 τους χρόνια. Αν ο κατήγορος της Εκκλησίας θεωρεί ότι στην ηλικία του βαπτίσματος πρέπει να μιμούμαστε τον Χριστό (το βάπτισμά Του από τον Ιωάννη), τότε για να βαπτιστεί θα πρέπει, προφανώς, να περιμένει και αυτός τα 30 χρόνια. Ωστόσο, αυτό δεν είναι σωστό, γιατί το βάπτισμα σε μετάνοια από τον προφήτη Ιωάννη δεν είναι βάπτισμα στον Χριστό (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L2-6">Πραξ 19:2-6</a>). Ο Χριστός περίμενε 30 χρόνια όχι για να βαπτιστεί, αλλά για να βγει στη διακονία (<a href="https://bibleox.com/el/gr-lxx-byz/chis/4/#L3">Αρ 4:3</a>), στο κήρυγμα, να φανερώσει τη δόξα Του. Το κήρυγμά Του άρχισε με τη μαρτυρία του προφήτη Ιωάννη, ο οποίος δείχνει ως τον Χριστό τον Ιησού που ήρθε σε αυτόν για να βαπτιστεί. Ο Ιωάννης — προφήτης. Πότε θα δείξει την εκπλήρωση της προφητείας για τον ερχομό του Σωτήρα; Πότε θα δείξει τον Σωτήρα; Όταν ο Σωτήρας θα είναι έτοιμος να βγει στη διακονία Του — στα 30 χρόνια (<a href="https://bibleox.com/el/gr-lxx-byz/chis/4/#L3">Αρ 4:3</a>).</p><h3>Μα ο ληστής που μετανόησε δεν πρόλαβε να βαπτιστεί και όμως σώθηκε;</h3><p>Αυτό έγινε τότε που ο Κύριος δεν είχε ακόμη καθιερώσει το μυστήριο του βαπτίσματος. Ο ληστής, που πίστεψε και μετανόησε, σώθηκε χωρίς βάπτισμα στο νερό, όπως σώζονταν οι παλαιοδιαθηκικοί δίκαιοι πριν από τη σύσταση της Εκκλησίας της Καινής Διαθήκης, η οποία θα εμφανιστεί μόλις 52 ημέρες (2+40+10) μετά τη σταύρωση του Χριστού.</p><p><strong>Το Βάπτισμα — γέννηση από το νερό και το Πνεύμα</strong></p><blockquote><p>«ἀπεκρίθη Ἰησοῦς, Ἀμὴν ἀμὴν λέγω σοι, <strong>ἐὰν μή τις <mark>γεννηθῇ ἐξ ὕδατος καὶ πνεύματος</mark>, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L5">Ιω 3:5</a>)</p></blockquote><p><strong>Ο Χριστός θα βαπτίζει με το Άγιο Πνεύμα</strong></p><blockquote><p>«ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης, Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· <strong><mark>αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ</mark></strong> καὶ πυρί·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L16">Λκ 3:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L11">Μτ 3:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L8">Μκ 1:8</a>)</p></blockquote><p><strong>Όσο ο Χριστός δεν φύγει, το Άγιο Πνεύμα δεν θα έρθει</strong></p><blockquote><p>«ἀλλ᾿ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. <strong><mark>ἐὰν γὰρ μὴ ἀπέλθω, ὁ παράκλητος οὐκ ἐλεύσεται</mark></strong> πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L7">Ιω 16:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16">Ιω 14:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L26">Ιω 14:26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L38-39">Ιω 7:38-39</a>)</p></blockquote><blockquote><p>«<strong><mark>Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν</mark></strong> παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L26">Ιω 15:26</a>)</p></blockquote><blockquote><p>«καὶ [ἰδοὺ] ἐγὼ ἀποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ᾿ ὑμᾶς· ὑμεῖς δὲ <strong>καθίσατε ἐν τῇ πόλει ἕως οὗ ἐνδύσησθε ἐξ ὕψους δύναμιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L49">Λκ 24:49</a>)</p></blockquote><p><strong>Ο Χριστός μετά την ανάσταση δεν είχε ακόμη αναληφθεί προς τον Πατέρα</strong></p><blockquote><p>«λέγει αὐτῇ Ἰησοῦς, Μή μου ἅπτου, <strong><mark>οὔπω γὰρ ἀναβέβηκα πρὸς τὸν πατέρα</mark></strong>· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς, Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L17">Ιω 20:17</a>)</p></blockquote><p><strong>Το υποσχεμένο βάπτισμα με το Άγιο Πνεύμα τελέστηκε για πρώτη φορά 50 ημέρες μετά την Ανάσταση του Χριστού</strong></p><blockquote><p>«Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη· οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, <strong>δι᾿ ἡμερῶν τεσσαράκοντα ὀπτανόμενος αὐτοῖς</strong> καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ. καὶ <strong>συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου· ὅτι <mark>Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ἐν πνεύματι βαπτισθήσεσθε ἁγίῳ</mark> οὐ μετὰ πολλὰς ταύτας ἡμέρας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L1-5">Πραξ 1:1-5</a>)</p></blockquote><blockquote><p>«Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη· οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, <strong><mark>δι᾿ ἡμερῶν τεσσαράκοντα ὀπτανόμενος αὐτοῖς</mark></strong> καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ. καὶ <strong>συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου· ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ <mark>ἐν πνεύματι βαπτισθήσεσθε ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας</mark></strong>. &lt;…&gt; ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ᾿ ὑμᾶς, καὶ ἔσεσθέ μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς. καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη, καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L1-5,8-9">Πραξ 1:1-5,8-9</a>)</p></blockquote><blockquote><p>«Καὶ <strong>ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς</strong> ἦσαν πάντες ὁμοῦ ἐπὶ τὸ αὐτό. &lt;…&gt; καὶ <strong><mark>ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, καὶ ἐκάθισεν ἐφ᾿ ἕνα ἕκαστον αὐτῶν, καὶ ἐπλήσθησαν πάντες πνεύματος ἁγίου</mark></strong>, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ἀποφθέγγεσθαι αὐτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L1,3-4">Πραξ 2:1,3-4</a>)</p></blockquote><p>Παρεμπιπτόντως, για την αποστολή του Αγίου Πνεύματος γίνεται λόγος την ίδια ημέρα της Ανάστασης του Χριστού, αλλά δεν γίνεται λόγος για το Βάπτισμα. Ήταν η καθιέρωση της ιερατικής ιεραρχίας, μαζί με τη μεταβίβαση της εξουσίας να συγχωρούνται ή να μη συγχωρούνται οι αμαρτίες:</p><blockquote><p>«<strong>Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον</strong>, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου. &lt;…&gt; Οὔσης οὖν ὀψίας <strong>τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων</strong>, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, <strong>ἦλθεν ὁ Ἰησοῦς</strong> καὶ ἔστη εἰς τὸ μέσον καὶ λέγει αὐτοῖς, Εἰρήνη ὑμῖν. &lt;…&gt; <strong>καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς, Λάβετε πνεῦμα ἅγιον</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L1,19,22">Ιω 20:1,19,22</a>)</p></blockquote><h3>«Μην εμποδίζετε τα νήπια να έρχονται στον Χριστό»</h3><p>Οι κοινότητες που χωρίστηκαν από την Εκκλησία κατηγορούν την Εκκλησία ότι η διδασκαλία της ότι χωρίς το Βάπτισμα η σωτηρία είναι αδύνατη (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>) δήθεν εμποδίζει τη σωτηρία των νηπίων. Με αυτό η Εκκλησία υποτίθεται ότι δεν αφήνει τα νήπια να έρθουν στον Χριστό. Αναφέρονται στο επόμενο χωρίο:</p><blockquote><p>«<strong>Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη</strong> ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ἐπετίμων αὐτοῖς. ὁ δὲ Ἰησοῦς προσεκαλέσατο αὐτὰ λέγων, <strong>Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά</strong>, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L15-16">Λκ 18:15-16</a>)</p></blockquote><p>Στην πραγματικότητα, αυτό το χωρίο ελέγχει ακριβώς τους αντιπάλους του βαπτίσματος των νηπίων.</p><p>Τι γίνεται κυριολεκτικά σε αυτή τη βιβλική κατάσταση;</p><ol><li><p><strong>Οι μητέρες φέρνουν στον Χριστό τα νήπια</strong>, για να τα ευλογήσει ο Κύριος;</p></li><li><p><strong>Στον δρόμο των μητέρων στέκονται οι μαθητές</strong>, απαγορεύοντάς τους να φέρνουν τα νήπια στον Χριστό;</p></li><li><p><strong>Ο Κύριος ανοίγει τον δρόμο στις μητέρες</strong>, δείχνοντας στους μαθητές να μην εμποδίζουν να φέρνουν σε Αυτόν τα νήπια, και ευλογεί τα νήπια (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L16">Μκ 10:16</a>).</p></li></ol><p>Τι κάνουν οι αντίπαλοι της Εκκλησίας;</p><ol><li><p>Οι μητέρες θέλουν να φέρουν τα νήπια στον Χριστό από τη γέννηση (αυτό το γνωρίζουμε προσωπικά από μητέρες που βγήκαν από τις σέκτες);</p></li><li><p>Οι αντίπαλοι της Εκκλησίας στέκονται στον δρόμο των μητέρων, απαγορεύοντάς τους κυριολεκτικά το βάπτισμα, το οποίο ονομάζεται στη Γραφή ένδυση του Χριστού (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>).</p></li></ol><p>Τι κάνει η Εκκλησία;</p><ol><li><p>Καλεί τις μητέρες στον Χριστό μαζί με τα νήπια τους;</p></li><li><p>Όταν οι μητέρες φέρνουν τα νήπια, η Εκκλησία τα ενώνει με τον Χριστό μέσω του Βαπτίσματος, της Θείας Ευχαριστίας και των ιερών, και τους δίνει την ευλογία.</p></li></ol><p>Οι αντίπαλοι της Εκκλησίας τα αναποδογυρίζουν όλα. Το κάλεσμα της Εκκλησίας στις μητέρες και στα νήπια να έρθουν στον Χριστό το ονομάζουν εμπόδιο στην ένωση με τον Χριστό, ενώ τις δικές τους απαγορεύσεις στις μητέρες να βαπτίσουν τα νήπια τις ονομάζουν «μη εμπόδιο» για τα παιδιά να έρχονται στον Χριστό.</p><p>Η διδασκαλία της Εκκλησίας δεν εμποδίζει καθόλου τον Χριστό να σώσει τα νήπια, αν αυτά σώζονταν χωρίς Βάπτισμα. Αλλά η απαγόρευση από τις σέκτες του βαπτίσματος των νηπίων εμποδίζει πολύ τη σωτηρία τους, δεδομένου ότι ο Χριστός είπε ότι χωρίς το Βάπτισμα κανείς δεν μπορεί να εισέλθει στη Βασιλεία του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>).</p><h3>Η άφεση των αμαρτιών γίνεται με την απόκτηση της πίστης και όχι με την κατάδυση στο νερό;</h3><p>Πολλοί νεοπροτεστάντες ονομάζουν το βάπτισμα στο νερό απλώς μαρτυρία (κάποιο σημείο), ενώ η αναγέννηση του ανθρώπου και η άφεση των αμαρτιών, όπως νομίζουν, γίνεται νωρίτερα, μόλις ο άνθρωπος πιστέψει και ζητήσει συγγνώμη από τον Θεό για τις αμαρτίες του. Ωστόσο, στη Γραφή βλέπουμε ότι ακριβώς μέσα στο βάπτισμα στο νερό αναγεννιέται ο άνθρωπος και ξεπλένονται οι αμαρτίες, ακριβώς αυτό είναι σωτήριο για τον άνθρωπο.</p><p>Ο Σαούλ (ο μελλοντικός απόστολος Παύλος) τυφλώνεται από τον Χριστό και αμέσως <strong>πιστεύει</strong> σε Αυτόν, ωστόσο αυτό δεν οδήγησε στη συγχώρηση των αμαρτιών του. Ο Σαούλ στέλνεται στη Δαμασκό για να ξεπλυθεί από τις αμαρτίες μέσω της αποδοχής του βαπτίσματος στο νερό:</p><blockquote><p>«ἐγὼ δὲ ἀπεκρίθην, Τίς εἶ, κύριε; εἶπέν τε πρός με, Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις. &lt;…&gt; εἶπον δέ, <strong><mark>Τί ποιήσω, κύριε</mark></strong>; ὁ δὲ κύριος εἶπεν πρός με, <strong>Ἀναστὰς πορεύου εἰς Δαμασκόν</strong>, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι. ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν. Ἁνανίας δέ τις, ἀνὴρ εὐλαβὴς κατὰ τὸν νόμον, μαρτυρούμενος ὑπὸ πάντων τῶν κατοικούντων Ἰουδαίων, ἐλθὼν πρός με καὶ ἐπιστὰς εἶπέν μοι, Σαοὺλ ἀδελφέ, ἀνάβλεψον· κἀγὼ αὐτῇ τῇ ὥρᾳ ἀνέβλεψα εἰς αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L8,10-13">Πραξ 22:8,10-13</a>)</p></blockquote><p>Ο Σαούλ, που πίστεψε, έχει ανάγκη από το ξέπλυμα από τις αμαρτίες μέσω του Βαπτίσματος:</p><blockquote><p>«καὶ νῦν τί μέλλεις; ἀναστὰς <strong><mark>βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου</mark></strong> ἐπικαλεσάμενος τὸ ὄνομα αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L16">Πραξ 22:16</a>)</p></blockquote><p>Σε άλλο σημείο λέγεται ευθέως ότι το Βάπτισμα σώζει (και δεν μαρτυρεί):</p><blockquote><p>«ὃ καὶ ὑμᾶς ἀντίτυπον νῦν <strong><mark>σῴζει</mark></strong> <strong><mark>βάπτισμα</mark></strong>, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L21">Α Πε 3:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L5">Τιτ 3:5</a>)</p></blockquote><h3>Ο άνθρωπος γεννιέται πνευματικά από το κήρυγμα για τον Χριστό;</h3><p>Οι νεοπροτεστάντες, που απορρίπτουν την ενέργεια του Θεού στα μυστήρια, αρνούνται και την πνευματική γέννηση του ανθρώπου στα νερά του βαπτίσματος. Αρνούμενοι αυτήν, διδάσκουν να πιστεύουμε ότι αυτή η ίδια η γέννηση «από το νερό και το Πνεύμα» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5">Ιω 3:3,5</a>) δήθεν γίνεται μόνο τη στιγμή του κηρύγματος, και όλα τα άλλα είναι πανηγυρικές συμβολικές εκδηλώσεις. Για να στηρίξουν αυτή την ιδέα παραθέτουν τέτοια χωρία:</p><blockquote><p>«βουληθεὶς <strong>ἀπεκύησεν</strong> ἡμᾶς <strong>λόγῳ ἀληθείας</strong>, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L18">Ιακ 1:18</a>)</p></blockquote><blockquote><p>«<strong>ἀναγεγεννημένοι</strong> οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, <strong>διὰ λόγου ζῶντος θεοῦ</strong> καὶ μένοντος· διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ἄνθος ἐξέπεσεν· τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. <strong>τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L23-25">Α Πε 1:23-25</a>)</p></blockquote><p>Στο κήρυγμα του Ευαγγελίου από την Εκκλησία συνεργεί ο Θεός, ενεργώντας στην ψυχή του ακροατή. Αυτό το κήρυγμα μπορεί να προκαλέσει ανατροπή στον άνθρωπο, καλώντας τον σε μετάνοια και οδηγώντας τον στον δρόμο της ζωής. Ο λόγος του Θεού είναι μέσο για να ξυπνήσει ο άνθρωπος από τον αμαρτωλό ύπνο, να γεννηθεί μέσα του μετάνοια, να γεννηθεί η πίστη[1]. Ωστόσο, αυτό το κήρυγμα δεν καθαρίζει ακόμη τον άνθρωπο από την αμαρτία, δεν τον γεννά πνευματικά από το νερό και το Πνεύμα (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5">Ιω 3:3,5</a>) στο λουτρό της αναγέννησης (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L25-26">Εφ 5:25-26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L5">Τιτ 3:5</a>).</p><p>Σε άλλα σημεία λέγεται καθαρά ότι για την άφεση των αμαρτιών είναι αναγκαίο να δεχτεί κανείς το μυστήριο του Βαπτίσματος, που τελείται στο νερό:</p><blockquote><p>«καὶ νῦν τί μέλλεις; <strong>ἀναστὰς <mark>βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου</mark></strong> ἐπικαλεσάμενος τὸ ὄνομα αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L16">Πραξ 22:16</a>)</p></blockquote><p>Κανείς δεν γίνεται δεκτός στο βάπτισμα χωρίς πίστη και μετάνοια. Γι’ αυτό πρώτα του χρειάζεται η ακρόαση του λόγου του Θεού, μετά η πίστη από την ακοή (<a href="https://bibleox.com/el/gr-lxx-byz/rim/10/#L17">Ρωμ 10:17</a>), και μόνο μετά η γέννηση από το νερό και το Πνεύμα, ο καθαρισμός από τις αμαρτίες και η σφράγιση με το Άγιο Πνεύμα στο βάπτισμα και στο χρίσμα.</p><p>Πρώτα ο απόστολος κηρύττει τον λόγο του Θεού, και όταν οι ακροατές του κηρύγματος <em>κατενύγησαν την καρδιά</em>, τους καλεί να δεχτούν το βάπτισμα για την άφεση των αμαρτιών:</p><blockquote><p>«<strong><mark>Ἀκούσαντες</mark></strong> δὲ <strong><mark>κατενύγησαν τὴν καρδίαν</mark></strong>, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους, <strong>Τί ποιήσωμεν, ἄνδρες ἀδελφοί</strong>; Πέτρος δὲ πρὸς αὐτούς, <strong>Μετανοήσατε, καὶ <mark>βαπτισθήτω ἕκαστος</mark></strong> ὑμῶν ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ <strong><mark>εἰς ἄφεσιν τῶν ἁμαρτιῶν</mark></strong> ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L37-38">Πραξ 2:37-38</a>)</p></blockquote><h3>«Το Βάπτισμα — όχι απόθεση σωματικής ακαθαρσίας, αλλά “υπόσχεση”»</h3><blockquote><p>«ὃ καὶ ὑμᾶς ἀντίτυπον νῦν <strong>σῴζει</strong> βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς <strong>ἐπερώτημα</strong> εἰς θεόν, δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L21">Α Πε 3:21</a>)</p></blockquote><p>Αυτό το χωρίο στα ρωσικά δεν έχει μεταφραστεί σωστά. Η διαφορά είναι ουσιαστική: στην «υπόσχεση» δεν υπάρχει κανένα μυστήριο, τίποτε δεν λαμβάνεται από τον Θεό, αλλά αντίθετα, μια υπόσχεση δίνεται σε Αυτόν. Όταν όμως ζητάμε από τον Θεό, τότε από την πλευρά του Θεού αναμένεται ενέργεια (μυστήριο): μέσω της άφεσης των αμαρτιών (από την πλευρά του Θεού) αποκτάται αγαθή και καθαρή συνείδηση (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L14">Εβρ 9:14</a>), μη βεβαρημένη από περασμένες αμαρτίες. Και αν κατά την κατάδυση στο νερό δεν γίνεται τίποτε τέτοιο, όπως νομίζουν οι προτεστάντες, τότε γιατί να ζητάμε από τον Θεό, αν Αυτός εδώ δεν δίνει τίποτε;</p><p>Η επιστολή του αποστόλου Πέτρου είναι γραμμένη στα ελληνικά. Οι άγιοι αδελφοί Κύριλλος και Μεθόδιος, Έλληνες που γνώριζαν και τη σλαβική γλώσσα, μετέφρασαν το ἐπερώτημα όχι ως υπόσχεση, αλλά ως ερώτηση (αίτημα): αίτημα προς τον Θεό για αγαθή συνείδηση.</p><p>Επίσης, ένας από τους αρχαίους χριστιανούς, Έλληνας, επίσκοπος της Εκκλησίας Γρηγόριος ο Θεολόγος (IV αιώνας) γράφει ότι πρόκειται για θεία ενέργεια — τη δωρεά στον άνθρωπο αγαθής συνείδησης μετά από αίτημα (Λόγος 40. Περί του Αγίου Βαπτίσματος).</p><p>Και γενικά στα κείμενα της Καινής Διαθήκης αυτή η λέξη δεν μεταφράζεται ποτέ ως υπόσχεση, αλλά μεταφράζεται ως ερώτηση, ως ερώτημα.</p><ul><li><p>ἐπερωτῆσαι — «να ρωτήσω» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L46">Μτ 22:46</a>)</p></li><li><p>ἐπερωτῶσιν — «ρωτούν» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/7/#L5">Μκ 7:5</a>)</p></li><li><p>ἐπερωτῆσαι — «να ρωτήσω» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L32">Μκ 9:32</a>)</p></li><li><p>Ἐπερωτήσω — «θα ρωτήσω» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/11/#L29">Μκ 11:29</a>)</p></li><li><p>ἐπερωτῆσαι — «να ρωτήσω» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L34">Μκ 12:34</a>)</p></li><li><p>ἐπερωτῶντα — «αυτόν που ρωτά» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L46">Λκ 2:46</a>)</p></li><li><p>Ἐπερωτῶ — «θα ρωτήσω» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L9">Λκ 6:9</a>)</p></li><li><p>Ἐπερωτηθεὶς — «ερωτηθείς» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/17/#L20">Λκ 17:20</a>)</p></li><li><p>ἐπερωτᾶν — «να ρωτώ» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/20/#L40">Λκ 20:40</a>)</p></li><li><p>ἐπερωτήσατε — «ρωτήστε» (<a href="https://bibleox.com/el/gr-lxx-byz/in/9/#L23">Ιω 9:23</a>)</p></li><li><p>ἐπερωτήσας — «αφού ρώτησε» (<a href="https://bibleox.com/el/gr-lxx-byz/act/23/#L34">Πραξ 23:34</a>)</p></li><li><p>ἐπερωτῶσιν — «σε αυτούς που ρωτούσαν» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/10/#L20">Ρωμ 10:20</a>)</p></li><li><p>ἐπερωτάτωσαν — «ας ρωτούν» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L35">Α Κορ 14:35</a>)</p></li><li><p>ἐπερώτημα — «ερώτημα» (εκκλησιαστική σλαβονική μετάφραση) (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L21">Α Πε 3:21</a>)</p></li></ul><p>Δηλαδή δεν είναι ο άνθρωπος που δίνει κάτι στον Θεό, όπως θα συνέβαινε στην περίπτωση της υπόσχεσης. Ο άνθρωπος μόνο ζητά, ενώ δίνει ο Θεός (είναι γραμμένο ευθέως: «<strong><mark>θα καθαρίσει τη συνείδησή μας</mark></strong>» <a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L14">Εβρ 9:14</a>).</p><p>Ο απόστολος δείχνει ότι το Βάπτισμα δεν ξεπλένει τη βρωμιά από το σώμα (όχι απόθεση σωματικής ακαθαρσίας), αλλά καθαρίζει εσωτερικά από την αμαρτία. Δηλαδή είναι μυστήριο, κάτι σημαντικό, κρυμμένο από τα μάτια, που δεν κατανοείται πλήρως και δεν εξηγείται.</p><p>Όλα αυτά γίνονται με την ενέργεια του Πνεύματος στο νερό, γι’ αυτό ο Κύριος Ιησούς Χριστός είπε ότι γεννιούνται από το νερό και το Πνεύμα, και όχι μόνο από το Πνεύμα:</p><blockquote><p>«ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ, Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ. &lt;…&gt; ἀπεκρίθη Ἰησοῦς, Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις <strong>γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ</strong>. τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>)</p></blockquote><p>Εξάλλου, ο απόστολος στο τέλος λέει λόγια που δείχνουν ότι το Βάπτισμα σώζει:</p><blockquote><p>«ὃ καὶ ὑμᾶς ἀντίτυπον νῦν <strong><mark>σῴζει</mark></strong> <strong><mark>βάπτισμα</mark></strong>, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L21">Α Πε 3:21</a>)</p></blockquote><p>Με αυτό οι νεοπροτεστάντες (βαπτιστές) κατ’ αρχήν δεν συμφωνούν. Το Βάπτισμα σε αυτούς είναι απλώς μια πανηγυρική υπόσχεση, μια τυπική διαδικασία που δεν σώζει. Και ο απόστολος λέει ότι το Βάπτισμα είναι αυτό που ακριβώς <strong>σώζει</strong>.</p><p>Πιστεύουν ότι τη στιγμή της απόκτησης της πίστης και της μετάνοιας λαμβάνουν άφεση αμαρτιών, και στον απόστολο Παύλο, αν και πίστεψε, δόθηκε αργότερα εντολή να δεχτεί το Βάπτισμα για το ξέπλυμα των αμαρτιών:</p><blockquote><p>«καὶ νῦν τί μέλλεις; <strong>ἀναστὰς <mark>βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου</mark></strong> ἐπικαλεσάμενος τὸ ὄνομα αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L16">Πραξ 22:16</a>)</p></blockquote><p>Παρόμοια λέγεται και εδώ:</p><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, Μετανοήσατε, καὶ <strong><mark>βαπτισθήτω ἕκαστος ὑμῶν</mark></strong> ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ <strong><mark>εἰς ἄφεσιν τῶν ἁμαρτιῶν</mark></strong> ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38">Πραξ 2:38</a>)</p></blockquote><h3>Καθαρίζει από τις αμαρτίες όχι το βάπτισμα, αλλά ο λόγος του Θεού;</h3><blockquote><p>«Οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς, ἵνα αὐτὴν ἁγιάσῃ <strong>καθαρίσας τῷ λουτρῷ τοῦ ὕδατος ἐν ῥήματι</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L25-26">Εφ 5:25-26</a>)</p></blockquote><p>Ο Χριστός παρέδωσε τον εαυτό Του για την Εκκλησία, για να την αγιάσει. Πώς να την καθαρίσει; — <em>«με το λουτρό του νερού»,</em> δηλαδή με το άγιο βάπτισμα, στο οποίο με τριπλή κατάδυση στο νερό λέγονται τα λόγια: στο όνομα του Πατέρα και του Υιού και του Αγίου Πνεύματος (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L19">Μτ 28:19</a>). Γι’ αυτή τη λέξη γίνεται εδώ λόγος. Και δεν μπορεί να αποκλειστεί ούτε το ένα (το νερό) ούτε το άλλο (τα λόγια για τον Πατέρα, τον Υιό και το Άγιο Πνεύμα). Αλλιώς, το να ερμηνεύσει κανείς διαφορετικά θα σήμαινε να το αποσπάσει από το πλαίσιο. Πρόκειται για τον λόγο που λέγεται κατά το <em>λουτρό του νερού</em>.</p><h3>Για τον εκατόνταρχο Κορνήλιο. Το Άγιο Πνεύμα δίνεται χωρίς Βάπτισμα;</h3><p>Οι υποστηρικτές των χαρισματικών σεκτών υπερασπίζονται τη διδασκαλία τους για τη δήθεν λήψη του Αγίου Πνεύματος απλώς με προσευχή. Προς υπεράσπισή τους φέρνουν την περίπτωση όπου το Άγιο Πνεύμα κατέβηκε για μοναδική φορά πριν από το Βάπτισμα:</p><blockquote><p>«Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L44">Πραξ 10:44</a>)</p></blockquote><p>Εδώ διηγείται η ιστορία του εκατόνταρχου Κορνήλιου, που ήταν ειδωλολάτρης. Δεν ήταν σαφές αν μπορούσαν να βαπτιστούν, αν μπορούσαν να δεχτούν ειδωλολάτρες στην Εκκλησία.</p><p>Γι’ αυτό ο Κύριος δίνει ειδικές αποκαλύψεις, για να δείξει ότι οι ειδωλολάτρες μπορούν να εισέρχονται στην Εκκλησία.</p><ol><li><p>Ο Θεός στέλνει στον ειδωλολάτρη Κορνήλιο όχι το Άγιο Πνεύμα, αλλά έναν άγγελο με μήνυμα, για να στραφεί στην Εκκλησία, να καλέσει και να ακούσει τον απόστολο για να σωθεί.</p></li><li><p>Στον απόστολο Πέτρο δείχνεται τρεις φορές το ίδιο όραμα: κατεβαίνει σε αυτόν τροφή τελετουργικά ακάθαρτη, και μια φωνή διατάζει να σφάξει και να φάει, γιατί, εξηγεί η φωνή: «ό,τι ο Θεός καθάρισε, μη το θεωρείς ακάθαρτο» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L15">Πραξ 10:15</a>)</p></li><li><p>Όταν ο απόστολος έρχεται και αρχίζει το κήρυγμα, το Άγιο Πνεύμα κατεβαίνει στους ακροατές ειδωλολάτρες.</p></li></ol><p>Μετά από όλα αυτά, οι χριστιανοί από τους Ιουδαίους απορούν με το γεγονός. Πώς έτσι, το Άγιο Πνεύμα κατεβαίνει στους ειδωλολάτρες;</p><blockquote><p>«καὶ <strong>ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ πνεύματος τοῦ ἁγίου ἐκκέχυται</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L45">Πραξ 10:45</a>)</p></blockquote><p>Και μετά όλα τελειώνουν με το βάπτισμα των ειδωλολατρών, τους οποίους τώρα πια χωρίς αμφιβολία μπορούν να βαπτίσουν, γιατί ο Ίδιος ο Θεός το έδειξε:</p><blockquote><p>«Μήτι τὸ ὕδωρ δύναται <strong>κωλῦσαί τις τοῦ μὴ βαπτισθῆναι τούτους</strong> οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ὡς καὶ ἡμεῖς; <strong>προσέταξεν δὲ αὐτοὺς ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι</strong>. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L47-48">Πραξ 10:47-48</a>)</p></blockquote><p>Έτσι, αυτή είναι η μόνη περίπτωση όπου το Άγιο Πνεύμα κατεβαίνει πριν από το Βάπτισμα. Όχι αντί για το Βάπτισμα, αλλά πριν από αυτό, γιατί το Βάπτισμα τελείται παρ’ όλα αυτά. Και για αυτή την ειδική κάθοδο του Αγίου Πνεύματος υπάρχει εξαιρετική αιτία — ο Θεός το Άγιο Πνεύμα δείχνει ότι μπορούν να δεχτούν στην Εκκλησία τους ειδωλολάτρες.</p><p>Η ίδια η κάθοδος του Αγίου Πνεύματος στον άνθρωπο είναι μυστήριο ξεχωριστό από το Βάπτισμα (περισσότερα).</p><h3>Ο ευνούχος έλαβε το Άγιο Πνεύμα χωρίς τους αποστόλους;</h3><p>Αυτό το ερώτημα ανήκει στο θέμα του Χρίσματος. Στην περίπτωση του Φιλίππου και του ευνούχου (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L39">Πραξ 8:39</a>) υπάρχει μια πολύ σημαντική λεπτομέρεια.</p><p>Οι περισσότεροι ερμηνευτές, μαζί με τους αρχαιότερους, μεταξύ των οποίων και ο ιερός Ιωάννης ο Χρυσόστομος, παραθέτουν αυτό το κείμενο χωρίς τη φράση για την κάθοδο του Αγίου Πνεύματος (ἅγιον ἐπέπεσεν ἐπὶ τὸν εὐνοῦχον, ἄγγελος δέ). Αλλά λέγεται απλώς:</p><blockquote><p><em>Τὸ Πνεῦμα <s>τὸ Ἅγιον ἐπέπεσεν ἐπὶ τὸν εὐνοῦχον, ὁ δὲ ἄγγελος</s> Κυρίου ἥρπασεν τὸν Φίλιππον.</em></p></blockquote><p>Ο Σιναϊτικός κώδικας χωρίς αυτά τα λόγια (IV αιώνας):</p><blockquote><p><em>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</em></p><p><em>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</em></p><p><em>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</em></p><p><em>καὶ ἐβάπτισεν αὐτόν.</em></p><p><em>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</em></p><p><strong><em>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</em></strong><em>,</em></p><p><em>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</em></p><p><em>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</em></p><p><em>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</em></p><p><em>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</em></p><p><em>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν. (Πράξεις 8:39-40)</em></p></blockquote><p>Ο Βατικανός κώδικας χωρίς αυτά τα λόγια (IV αιώνας):</p><blockquote><p><em>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</em></p><p><em>οτε δε ανεβηϲαν εκ του υδατοϲ </em><strong><em>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</em></strong><em> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</em></p></blockquote><p>Έτσι παραθέτει ο ιερός Ιωάννης ο Χρυσόστομος (χωρίς τα λόγια για την κάθοδο του Αγίου Πνεύματος):</p><blockquote><p><em>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, </em><strong><em>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</em></strong><em>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</em></p></blockquote><p>(In acta apostolorum, ΟΜΙΛΙΑ ΙΘʹ)</p><p>Σχόλιο του επισκόπου Μιχαήλ (Λουζίν):</p><blockquote><p><strong>Το Άγιο Πνεύμα κατέβη στον ευνούχο, ο δε άγγελος Κυρίου άρπαξε τον Φίλιππο</strong>: έτσι διαβάζεται αυτός ο τόπος μόνο σε λίγα αρχαία χειρόγραφα ελληνικά και σε μεταφράσεις (τις οποίες ακολουθούν και οι δικές μας μεταφράσεις, η σλαβονική και η ρωσική) και σε λίγους αρχαίους ερμηνευτές· στην πλειονότητα όμως των χειρογράφων και των μεταφράσεων και στους ερμηνευτές (μεταξύ τους ο άγιος Χρυσόστομος και ο Θεοφύλακτος) διαβάζεται έτσι: το Άγιο Πνεύμα άρπαξε τον Φίλιππο. Είναι προσθήκη σε κάποιους κώδικες ή παράλειψη σε άλλους — δύσκολο να αποφασιστεί, αλλά το πρώτο είναι πιθανότερο, και εξηγείται σε αυτή την περίπτωση με τη σιωπή του συγγραφέα των Πράξεων για τη λήψη του Αγίου Πνεύματος από τον ευνούχο.</p></blockquote><p>(πηγή)</p><h2>Ορισμένες παρατηρήσεις</h2><h3>Τα νήπια μπορούν να πιστεύουν</h3><p>Υπάρχουν όλοι οι λόγοι να θεωρούμε ότι και τα νήπια είναι ικανά να πιστεύουν και να πληρούνται από το Άγιο Πνεύμα, αν και δεν μπορούν να δώσουν απάντηση, μαρτυρώντας την πίστη τους.</p><p>Ο προφήτης Δαυίδ ήλπιζε στον Θεό από βρεφική ηλικία:</p><blockquote><p>«ὅτι σὺ εἶ ὁ ἐκσπάσας με ἐκ γαστρός, <strong>ἡ ἐλπίς μου ἀπὸ μαστῶν τῆς μητρός μου</strong>· ἐπὶ σὲ ἐπερρίφην ἐκ μήτρας, ἐκ κοιλίας μητρός μου θεός μου εἶ σύ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/21/#L9-10">Ψλ 21:9-10</a>)</p></blockquote><p>Ο προφήτης Ιωάννης ακόμη πριν τη γέννηση αισθάνεται τη συνάντηση με τον Σωτήρα και χαίρεται γι’ αυτήν:</p><blockquote><p>«<strong>Ἀναστᾶσα δὲ Μαριὰμ</strong> ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα, καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ. καὶ ἐγένετο ὡς ἤκουσεν τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ, <strong>ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς</strong>, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L39-41">Λκ 1:39-41</a>)</p></blockquote><p>Ο Χριστός, έχοντας βάλει μπροστά Του ένα παιδί, μιλά για «τους μικρούς αυτούς» που πιστεύουν σε Αυτόν.</p><blockquote><p>«καὶ <strong>προσκαλεσάμενος <mark>παιδίον</mark></strong> ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ εἶπεν, Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν. <strong>ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο</strong>, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν. καὶ <strong>ὃς ἐὰν δέξηται ἓν παιδίον τοιοῦτο</strong> ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται. <strong>Ὃς δ᾿ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν <mark>πιστευόντων εἰς ἐμέ</mark></strong>, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς περὶ τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L2-6">Μτ 18:2-6</a>)</p></blockquote><p>Τα παιδιά δόξαζαν τον Χριστό κατά την είσοδο στα Ιεροσόλυμα:</p><blockquote><p>«ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ <strong>τοὺς παῖδας τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας, Ὡσαννὰ τῷ υἱῷ Δαυίδ</strong>, ἠγανάκτησαν καὶ εἶπαν αὐτῷ, Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς, Ναί· οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L15-16">Μτ 21:15-16</a>)</p></blockquote><h3>Δεν λέγεται πουθενά ότι κάποιος μπορεί να σωθεί χωρίς το Βάπτισμα</h3><p>Στη Γραφή δεν υπάρχουν ενδείξεις ότι κάποιος μπορεί να σωθεί χωρίς το Βάπτισμα. Αντίθετα, λέγεται ότι κανείς δεν μπορεί να εισέλθει στη Βασιλεία του Θεού χωρίς το Βάπτισμα (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>).</p>'
