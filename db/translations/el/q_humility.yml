  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p><strong>Ταπείνωση</strong> (ταπεινοφροσύνη) — αρετή αντίθετη προς την υπερηφάνεια.</p><ul><li><p>Ειρηνική αποδοχή του <strong>θελήματος του Θεού</strong> για τον εαυτό μας, ως δημιούργημά Του.</p></li><li><p>Υποταγή στον Θεό, στις διατάξεις Του και στην πρόνοιά Του, τόσο στα μικρά όσο και στα μεγάλα.</p></li><li><p>Χαμηλή γνώμη για τον εαυτό μας, εμπιστοσύνη στον Θεό και ελπίδα σ’ Αυτόν.</p></li></ul><h2>Ο Κύριος — Θεός των ταπεινών</h2><blockquote><p><em>«οὐ γὰρ ἐν πλήθει τὸ κράτος σου, οὐδὲ ἡ δυναστεία σου ἐν ἰσχύουσιν, ἀλλὰ </em><strong><em><mark>ταπεινῶν εἶ θεός</mark></em></strong><em>, ἐλαττόνων εἶ βοηθός, ἀντιλήμπτωρ ἀσθενούντων, ἀπεγνωσμένων σκεπαστής, ἀπηλπισμένων σωτήρ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iudf/9/#L11"><em>Ιουδιθ 9:11</em></a><em>)</em></p></blockquote><h2>Η εντολή για την ταπείνωση</h2><p>Ο Κύριος Ιησούς Χριστός μας καλεί να μάθουμε από Αυτόν την ταπείνωση:</p><blockquote><p>«<strong>Δεῦτε</strong> πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς. <strong>ἄρατε τὸν ζυγόν</strong> μου ἐφ᾿ ὑμᾶς καὶ <strong><mark>μάθετε</mark> ἀπ᾿ ἐμοῦ</strong>, ὅτι πραΰς εἰμι καὶ <strong><mark>ταπεινὸς</mark> τῇ καρδίᾳ</strong>, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L28-29">Μτ 11:28-29</a>)</p></blockquote><blockquote><p>«τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ <strong><mark>τοῖς ταπεινοῖς συναπαγόμενοι</mark></strong>. μὴ γίνεσθε φρόνιμοι παρ᾿ ἑαυτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L16">Ρωμ 12:16</a>)</p></blockquote><blockquote><p>«εἰ ἀνηγγέλη σοι, ἄνθρωπε, τί καλόν; ἢ <strong>τί κύριος ἐκζητεῖ παρὰ σοῦ</strong> ἀλλ᾿ ἢ τοῦ ποιεῖν κρίμα καὶ ἀγαπᾶν ἔλεον καὶ ἕτοιμον εἶναι τοῦ <strong><mark>πορεύεσθαι μετὰ κυρίου</mark> θεοῦ σου</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/mih/6/#L8">Μιχ 6:8</a>)</p></blockquote><blockquote><p>«καὶ περιτεμεῖσθε τὴν σκληροκαρδίαν ὑμῶν καὶ <strong><mark>τὸν τράχηλον ὑμῶν οὐ σκληρυνεῖτε ἔτι</mark></strong>.»* (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/10/#L16">Δτ 10:16</a>)</p><p>*τράχηλος — ο λαιμός. Δηλαδή λαός σκληροτράχηλος — λαός που δεν υποκλίνει το κεφάλι μπροστά στον Θεό, δεν ταπεινώνεται.</p></blockquote><h2>Η Θεοτόκος εκλέχτηκε από τον Θεό για την ταπείνωσή της</h2><blockquote><p>«ὅτι <strong><mark>ἐπέβλεψεν</mark> ἐπὶ <mark>τὴν ταπείνωσιν</mark></strong> τῆς δούλης αὐτοῦ. ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L48">Λκ 1:48</a>)</p></blockquote><h2>Ο Θεός δίνει χάρη στους ταπεινούς</h2><blockquote><p>«Ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι <strong>Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται, <mark>ταπεινοῖς δὲ δίδωσιν χάριν</mark></strong>. <strong><mark>Ταπεινώθητε</mark> οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L5-6">Α Πε 5:5-6</a>)</p></blockquote><blockquote><p>«μείζονα δὲ δίδωσιν χάριν· διὸ λέγει, Ὁ θεὸς <strong>ὑπερηφάνοις ἀντιτάσσεται, <mark>ταπεινοῖς δὲ δίδωσιν χάριν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L6">Ιακ 4:6</a>)</p></blockquote><blockquote><p>«<strong>κύριος ὑπερηφάνοις ἀντιτάσσεται, <mark>ταπεινοῖς δὲ δίδωσιν χάριν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/3/#L34">Πρμ 3:34</a>)</p></blockquote><blockquote><p>«Τέκνον, ἐν πραύτητι τὰ ἔργα σου διέξαγε, καὶ ὑπὸ ἀνθρώπου δεκτοῦ ἀγαπηθήσῃ. <strong>ὅσῳ μέγας εἶ, τοσούτῳ <mark>ταπείνου σεαυτόν, καὶ ἔναντι κυρίου εὑρήσεις χάριν</mark></strong>· &lt;…&gt; ὅτι <strong>μεγάλη ἡ δυναστεία τοῦ κυρίου</strong> <strong>καὶ <mark>ὑπὸ τῶν ταπεινῶν δοξάζεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/3/#L17-18,20">Σ.Σειρ 3:17-18,20</a>)</p></blockquote><blockquote><p>«οὗ ἐὰν εἰσέλθῃ ὕβρις, ἐκεῖ καὶ ἀτιμία· <strong>στόμα δὲ ταπεινῶν μελετᾷ σοφίαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/11/#L2">Πρμ 11:2</a>)</p></blockquote><h2>Ο Θεός σώζει τους ταπεινούς</h2><blockquote><p>«ἐγγὺς κύριος τοῖς συντετριμμένοις τὴν καρδίαν καὶ <strong><mark>τοὺς ταπεινοὺς τῷ πνεύματι σώσει</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L18">Ψλ 33:18</a>)</p></blockquote><blockquote><p>«ὅτι εὐδοκεῖ κύριος ἐν λαῷ αὐτοῦ καὶ <strong>ὑψώσει <mark>πραεῖς ἐν σωτηρίᾳ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/149/#L4">Ψλ 149:4</a>)</p></blockquote><blockquote><p>«<strong><mark>γενεὰ σοφίας</mark></strong> φόβος κυρίου καὶ πλοῦτος καὶ δόξα <strong><mark>καὶ ζωή</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/22/#L4">Πρμ 22:4</a>)</p></blockquote><h2>Ο Θεός δοξάζει τους ταπεινούς</h2><blockquote><p>«<strong><mark>ἀναλαμβάνων πραεῖς</mark></strong> ὁ κύριος, ταπεινῶν δὲ ἁμαρτωλοὺς ἕως τῆς γῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/146/#L6">Ψλ 146:6</a>)</p></blockquote><blockquote><p>«ὅτι εὐδοκεῖ κύριος ἐν λαῷ αὐτοῦ καὶ <strong><mark>ὑψώσει πραεῖς</mark> ἐν σωτηρίᾳ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/149/#L4">Ψλ 149:4</a>)</p></blockquote><blockquote><p>«φόβος θεοῦ παιδεία καὶ σοφία, <strong><mark>καὶ ἀρχὴ δόξης</mark></strong> ἀποκριθήσεται αὐτῇ.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/15/#L33">Πρμ 15:33</a>)</p></blockquote><blockquote><p>«πρὸ συντριβῆς ὑψοῦται καρδία ἀνδρός, καὶ <strong><mark>πρὸ δόξης ταπεινοῦται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/18/#L12">Πρμ 18:12</a>)</p></blockquote><blockquote><p>«<strong><mark>γενεὰ σοφίας</mark></strong> φόβος κυρίου καὶ πλοῦτος <strong><mark>καὶ δόξα</mark></strong> καὶ ζωή.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/22/#L4">Πρμ 22:4</a>)</p></blockquote><blockquote><p>«ὕβρις ἄνδρα ταπεινοῖ, τοὺς δὲ <strong><mark>ταπεινόφρονας ἐρείδει δόξῃ κύριος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/29/#L23">Πρμ 29:23</a>)</p></blockquote><h2>Ο Θεός ακούει την προσευχή των ταπεινών</h2><blockquote><p>«<strong><mark>θέλημα τῶν φοβουμένων αὐτὸν ποιήσει καὶ τῆς δεήσεως αὐτῶν ἐπακούσεται</mark></strong> καὶ σώσει αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/144/#L19">Ψλ 144:19</a>)</p></blockquote><blockquote><p>«<strong><mark>προσευχὴ ταπεινοῦ νεφέλας διῆλθεν</mark></strong>, καὶ ἕως συνεγγίσῃ, οὐ μὴ παρακληθῇ·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/35/#L17">Σ.Σειρ 35:17</a>)</p></blockquote><blockquote><p>«πάντα γὰρ ταῦτα ἐποίησεν ἡ χείρ μου, καὶ ἔστιν ἐμὰ πάντα ταῦτα, λέγει κύριος· καὶ ἐπὶ τίνα <strong>ἐπιβλέψω ἀλλ᾿ ἢ <mark>ἐπὶ τὸν ταπεινὸν</mark></strong> καὶ ἡσύχιον καὶ τρέμοντα τοὺς λόγους μου;» (<a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L2">Ησ 66:2</a>)</p></blockquote><blockquote><p>«καὶ ζητήσατε εἰς εἰρήνην τῆς γῆς, εἰς ἣν ἀπῴκισα ὑμᾶς ἐκεῖ, καὶ <strong><mark>προσεύξασθε περὶ αὐτῶν πρὸς κύριον</mark></strong>, ὅτι ἐν εἰρήνῃ αὐτῆς ἔσται εἰρήνη ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/36/#L7">Ιερ 36:7</a>)</p></blockquote><blockquote><p>«ἀλλ᾿ ἐν ψυχῇ συντετριμμένῃ καὶ <strong><mark>πνεύματι τεταπεινωμένῳ</mark> <mark>προσδεχθείημεν</mark></strong> ὡς ἐν ὁλοκαυτώμασι κριῶν καὶ ταύρων καὶ ὡς ἐν μυριάσιν ἀρνῶν πιόνων·» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L39">Δν 3:39</a>)</p></blockquote><blockquote><p>«θυσία τῷ θεῷ πνεῦμα συντετριμμένον, <strong><mark>καρδίαν</mark> συντετριμμένην καὶ <mark>τεταπεινωμένην ὁ θεὸς οὐκ ἐξ ουθενώσει</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/50/#L17">Ψλ 50:17</a>)</p></blockquote><h2>Ο Θεός παρηγορεί τους ταπεινούς</h2><blockquote><p>«ἀλλ᾿ <strong><mark>ὁ παρακαλῶν τοὺς ταπεινοὺς</mark></strong> παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/7/#L6">Β Κορ 7:6</a>)</p></blockquote><blockquote><p>«ὅτι ὑψηλὸς κύριος καὶ <strong><mark>τὰ ταπεινὰ ἐφορᾷ</mark></strong> καὶ τὰ ὑψηλὰ ἀπὸ μακρόθεν γινώσκει.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/137/#L6">Ψλ 137:6</a>)</p></blockquote><h2>Ο Θεός φυλάσσει τους ταπεινούς</h2><blockquote><p>«ζητήσατε τὸν κύριον, πάντες <strong><mark>ταπεινοὶ γῆς</mark></strong>· κρίμα ἐργάζεσθε καὶ δικαιοσύνην ζητήσατε καὶ ἀποκρίνεσθε αὐτά, ὅπως <strong><mark>σκεπασθῆτε ἐν ἡμέρᾳ ὀργῆς κυρίου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/sof/2/#L3">Σφν 2:3</a>)</p></blockquote><blockquote><p>«<strong>ῥίζας ἐθνῶν ἐξέτιλεν ὁ κύριος</strong> καὶ <strong><mark>ἐφύτευσεν ταπεινοὺς ἀντ αὐτῶν</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/10/#L15">Σ.Σειρ 10:15</a>)</p></blockquote><blockquote><p>«καὶ <strong><mark>ὑπολείψομαι ἐν σοὶ λαὸν πραὺν καὶ ταπεινόν</mark></strong>, καὶ <strong>εὐλαβηθήσονται ἀπὸ τοῦ ὀνόματος κυρίου</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/sof/3/#L12">Σφν 3:12</a>)</p></blockquote><h2>Ο Θεός κατοικεί μαζί με τους ταπεινούς</h2><blockquote><p>«Τάδε λέγει κύριος ὁ ὕψιστος <strong><mark>ὁ ἐν ὑψηλοῖς κατοικῶν τὸν αἰῶνα</mark></strong>, ἅγιος ἐν ἁγίοις ὄνομα αὐτῷ, κύριος ὕψιστος ἐν ἁγίοις ἀναπαυόμενος καὶ <strong><mark>ὀλιγοψύχοις διδοὺς μακροθυμίαν καὶ διδοὺς ζωὴν τοῖς συντετριμμένοις τὴν καρδίαν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/57/#L15">Ησ 57:15</a>)</p></blockquote><h2>Παραβολές για την ταπείνωση</h2><h3>Για την επιλογή θέσης στον γάμο</h3><blockquote><p>«Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς, Ὅταν κληθῇς ὑπό τινος εἰς γάμους, <strong><mark>μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν</mark></strong>, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ᾿ αὐτοῦ, καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι, Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν. ἀλλ᾿ ὅταν κληθῇς πορευθεὶς <strong><mark>ἀνάπεσε εἰς τὸν ἔσχατον τόπον</mark></strong>, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ἐρεῖ σοι, Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον πάντων τῶν συνανακειμένων σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/14/#L7-10">Λκ 14:7-10</a>)</p></blockquote><h3>Για τον τελώνη και τον Φαρισαίο</h3><blockquote><p>«<strong>ὁ δὲ τελώνης <mark>μακρόθεν ἑστὼς</mark> <mark>οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ἐπᾶραι</mark> εἰς τὸν οὐρανόν</strong>, ἀλλ᾿ ἔτυπτεν τὸ στῆθος αὐτοῦ λέγων, Ὁ θεός, ἱλάσθητί μοι <strong><mark>τῷ ἁμαρτωλῷ</mark></strong>. λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ παρ᾿ ἐκεῖνον· ὅτι <strong>πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ <mark>ταπεινῶν ἑαυτὸν ὑψωθήσεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L13-14">Λκ 18:13-14</a>)</p></blockquote><blockquote><p>«Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης. ὁ Φαρισαῖος σταθεὶς πρὸς ἑαυτὸν ταῦτα προσηύχετο, Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης· νηστεύω δὶς τοῦ σαββάτου, ἀποδεκατῶ πάντα ὅσα κτῶμαι. <strong>ὁ δὲ τελώνης <mark>μακρόθεν ἑστὼς</mark> <mark>οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ἐπᾶραι</mark> εἰς τὸν οὐρανόν</strong>, ἀλλ᾿ ἔτυπτεν τὸ στῆθος αὐτοῦ λέγων, Ὁ θεός, ἱλάσθητί μοι <strong><mark>τῷ ἁμαρτωλῷ</mark></strong>. λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ παρ᾿ ἐκεῖνον· ὅτι <strong>πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται</strong>, ὁ δὲ <strong><mark>ταπεινῶν ἑαυτὸν ὑψωθήσεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L10-14">Λκ 18:10-14</a>)</p></blockquote>
