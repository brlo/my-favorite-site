  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Εννέα μακαρισμοί που έδωσε ο Κύριος Ιησούς Χριστός στην Επί του Όρους Ομιλία</h2><ol><li><p>«Μακάριοι <strong>οἱ πτωχοὶ τῷ πνεύματι</strong>, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L3">Μτ 5:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L20">Λκ 6:20</a>)</p></li><li><p>«μακάριοι <strong>οἱ πενθοῦντες</strong>, ὅτι αὐτοὶ παρακληθήσονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L4">Μτ 5:4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L21">Λκ 6:21</a>)</p></li><li><p>«μακάριοι <strong>οἱ πραεῖς</strong>, ὅτι αὐτοὶ κληρονομήσουσιν τὴν γῆν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L5">Μτ 5:5</a>)</p></li><li><p>«μακάριοι <strong>οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην</strong>, ὅτι αὐτοὶ χορτασθήσονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L6">Μτ 5:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L21">Λκ 6:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L25">Λκ 6:25</a>)</p></li><li><p>«μακάριοι <strong>οἱ ἐλεήμονες</strong>, ὅτι αὐτοὶ ἐλεηθήσονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L7">Μτ 5:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L24">Λκ 6:24</a>)</p></li><li><p>«μακάριοι <strong>οἱ καθαροὶ τῇ καρδίᾳ</strong>, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L8">Μτ 5:8</a>)</p></li><li><p>«μακάριοι <strong>οἱ εἰρηνοποιοί</strong>, ὅτι [αὐτοὶ] υἱοὶ θεοῦ κληθήσονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L9">Μτ 5:9</a>)</p></li><li><p>«μακάριοι <strong>οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης</strong>, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L10">Μτ 5:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L22">Λκ 6:22</a>)</p></li><li><p>«μακάριοί ἐστε <strong>ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν πονηρὸν καθ᾿ ὑμῶν [ψευδόμενοι] ἕνεκεν ἐμοῦ</strong>· χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L11-12">Μτ 5:11-12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L22-23">Λκ 6:22-23</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L26">Λκ 6:26</a>)</p></li></ol><h2>Οι συμπληρωματικές εντολές</h2><ol><li><p>«<strong>ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L27">Λκ 6:27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L44">Μτ 5:44</a>)</p></li><li><p>«<strong>καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L27">Λκ 6:27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L44">Μτ 5:44</a>)</p></li><li><p>«<strong>εὐλογεῖτε τοὺς καταρωμένους ὑμᾶς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L28">Λκ 6:28</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L44">Μτ 5:44</a>)</p></li><li><p>«<strong>προσεύχεσθε περὶ τῶν ἐπηρεαζόντων</strong> ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L28">Λκ 6:28</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L44">Μτ 5:44</a>)</p></li><li><p>«<strong>τῷ τύπτοντί</strong> <strong>σε</strong> ἐπὶ τὴν σιαγόνα <strong>πάρεχε</strong> καὶ τὴν ἄλλην,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L29">Λκ 6:29</a>)</p></li><li><p>«ἀπὸ τοῦ <strong>αἴροντός</strong> <strong>σου</strong> τὸ ἱμάτιον καὶ τὸν χιτῶνα <strong>μὴ κωλύσῃς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L29">Λκ 6:29</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L40">Μτ 5:40</a>)</p></li><li><p>«παντὶ <strong>αἰτοῦντί</strong> σε <strong>δίδου</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L30">Λκ 6:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L38">Λκ 6:38</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L42">Μτ 5:42</a>)</p></li><li><p>«<strong>ἀπὸ</strong> τοῦ <strong>αἴροντος</strong> τὰ σὰ <strong>μὴ ἀπαίτει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L30">Λκ 6:30</a>)</p></li><li><p>«<strong>καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L31">Λκ 6:31</a>)</p></li><li><p>«Γίνεσθε <strong>οἰκτίρμονες</strong> καθὼς [καὶ] ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L36">Λκ 6:36</a>)</p></li><li><p>«<strong>μὴ κρίνετε</strong>, καὶ οὐ μὴ κριθῆτε·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L37">Λκ 6:37</a>)</p></li><li><p>«<strong>μὴ καταδικάζετε</strong>, καὶ οὐ μὴ καταδικασθῆτε.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L37">Λκ 6:37</a>)</p></li><li><p>«<strong>ἀπολύετε</strong>, καὶ ἀπολυθήσεσθε·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L37">Λκ 6:37</a>)</p></li><li><p>«<strong>δίδοτε</strong>, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ᾧ γὰρ μέτρῳ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L38">Λκ 6:38</a>)</p></li><li><p>«Τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς; πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου, Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, <strong>ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ</strong>, καὶ τότε διαβλέψεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L41-42">Λκ 6:41-42</a>)</p></li><li><p>«Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις, Οὐ φονεύσεις· ὃς δ᾿ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει. ἐγὼ δὲ λέγω ὑμῖν ὅτι <strong>πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ αὐτοῦ ἔνοχος ἔσται τῇ κρίσει</strong>· ὃς δ᾿ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ, Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ᾿ ἂν εἴπῃ, Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L21-22">Μτ 5:21-22</a>)</p></li><li><p>«ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ, ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου, καὶ <strong>ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου</strong>, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου. <strong>ἴσθι εὐνοῶν</strong> τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ μετ᾿ αὐτοῦ ἐν τῇ ὁδῷ, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ· ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L23-26">Μτ 5:23-26</a>)</p></li><li><p>«Ἠκούσατε ὅτι ἐρρέθη, Οὐ μοιχεύσεις. ἐγὼ δὲ λέγω ὑμῖν ὅτι <strong>πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν</strong> αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L27-28">Μτ 5:27-28</a>)</p></li><li><p>«Ἐρρέθη δέ, Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον. ἐγὼ δὲ λέγω ὑμῖν ὅτι <strong>πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν μοιχευθῆναι</strong>, καὶ <strong>ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L31-32">Μτ 5:31-32</a>)</p></li><li><p>«Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις, Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου. ἐγὼ δὲ λέγω ὑμῖν <strong>μὴ ὀμόσαι</strong> ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ· μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως· μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ποιῆσαι ἢ μέλαιναν. ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L33-37">Μτ 5:33-37</a>)</p></li><li><p>«Ἠκούσατε ὅτι ἐρρέθη, Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος. ἐγὼ δὲ λέγω ὑμῖν <strong>μὴ ἀντιστῆναι τῷ πονηρῷ</strong>· ἀλλ᾿ ὅστις σε ῥαπίζει εἰς τὴν δεξιὰν σιαγόνα [σου], στρέψον αὐτῷ καὶ τὴν ἄλλην· καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον· καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ᾿ αὐτοῦ δύο. τῷ αἰτοῦντί σε δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L38-42">Μτ 5:38-42</a>)</p></li><li><p>«<strong>Ἔσεσθε οὖν ὑμεῖς τέλειοι ὡς ὁ πατὴρ</strong> ὑμῶν ὁ οὐράνιος τέλειός ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L48">Μτ 5:48</a>)</p></li></ol>
