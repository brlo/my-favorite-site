  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Οι παλαιοδιαθηκικοί δίκαιοι για την κάθοδό τους στον Άδη μετά τον θάνατο</h2><blockquote><p>«αἱ ἡμέραι μου παρῆλθον ἐν βρόμῳ, ἐρράγη δὲ τὰ ἄρθρα τῆς καρδίας μου. νύκτα εἰς ἡμέραν ἔθηκαν, φῶς ἐγγὺς ἀπὸ προσώπου σκότους. ἐὰν γὰρ ὑπομείνω, <strong><mark>ᾅδης μου ὁ οἶκος, ἐν δὲ γνόφῳ ἔστρωταί μου ἡ στρωμνή</mark></strong>. θάνατον ἐπεκαλεσάμην πατέρα μου εἶναι, μητέρα δέ μου καὶ ἀδελφὴν σαπρίαν. ποῦ οὖν μου ἔτι ἐστὶν <strong>ἡ ἐλπίς</strong>; ἦ τὰ ἀγαθά μου ὄψομαι; ἦ μετ᾿ ἐμοῦ <strong><mark>εἰς ᾅδην καταβήσονται, ἢ ὁμοθυμαδὸν ἐπὶ χώματος καταβησόμεθα</mark></strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/17/#L11-16">Ιωβ 17:11-16</a>).</p></blockquote><blockquote><p>«συνήχθησαν δὲ πάντες οἱ υἱοὶ αὐτοῦ καὶ αἱ θυγατέρες καὶ ἦλθον παρακαλέσαι αὐτόν, καὶ οὐκ ἤθελεν παρακαλεῖσθαι λέγων ὅτι <strong><mark>Καταβήσομαι πρὸς τὸν υἱόν μου πενθῶν εἰς ᾅδου</mark></strong>. καὶ ἔκλαυσεν αὐτὸν ὁ πατὴρ αὐτοῦ. —» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/37/#L35">Γεν 37:35</a>).</p></blockquote><blockquote><p>«τοῦτο πονηρὸν ἐν παντὶ πεποιημένῳ ὑπὸ τὸν ἥλιον, ὅτι <strong><mark>συνάντημα ἓν τοῖς πᾶσιν</mark></strong>· καί γε καρδία υἱῶν τοῦ ἀνθρώπου ἐπληρώθη πονηροῦ, καὶ περιφέρεια ἐν καρδίᾳ αὐτῶν ἐν ζωῇ αὐτῶν, καὶ <strong><mark>ὀπίσω αὐτῶν πρὸς τοὺς νεκρούς</mark>. ὅτι τίς ὃς κοινωνεῖ πρὸς πάντας τοὺς ζῶντας; ἔστιν ἐλπίς, ὅτι ὁ κύων ὁ ζῶν, αὐτὸς ἀγαθὸς ὑπὲρ τὸν λέοντα τὸν νεκρόν</strong>. ὅτι οἱ ζῶντες γνώσονται ὅτι ἀποθανοῦνται, καὶ οἱ νεκροὶ οὔκ εἰσιν γινώσκοντες οὐδέν· καὶ οὐκ ἔστιν αὐτοῖς ἔτι μισθός, ὅτι ἐπελήσθη ἡ μνήμη αὐτῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/ekl/9/#L3-5">Εκ 9:3-5</a>).</p></blockquote><blockquote><p>«μνήσθητι τίς μου ἡ ὑπόστασις· μὴ γὰρ ματαίως ἔκτισας πάντας τοὺς υἱοὺς τῶν ἀνθρώπων; <strong><mark>τίς ἐστιν ἄνθρωπος, ὃς ζήσεται καὶ οὐκ ὄψεται θάνατον, ῥύσεται τὴν ψυχὴν αὐτοῦ ἐκ χειρὸς ᾅδου</mark></strong>; διάψαλμα. ποῦ εἰσιν τὰ ἐλέη σου τὰ ἀρχαῖα, κύριε, ἃ ὤμοσας τῷ Δαυιδ ἐν τῇ ἀληθείᾳ σου;» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/88/#L47-49">Ψλ 88:47-49</a>).</p></blockquote><h2>Η αλλαγή της ουράνιας πραγματικότητας μετά την ανάσταση του Χριστού</h2><p>Για να πειστούμε ότι πριν από τον Χριστό οι ψυχές των κεκοιμημένων δικαίων δεν έφταναν στη ζωή με τον Θεό στον ουρανό, μπορούμε να συγκρίνουμε την περιγραφή της ουράνιας πραγματικότητας πριν από τον Χριστό και μετά την ανάσταση του Χριστού.</p><p>Πριν από τον Χριστό, η ουράνια πραγματικότητα δείχνεται στον προφήτη Μωυσή στο όρος, ώστε ο προφήτης, σύμφωνα με την εικόνα που είδε, να κατασκευάσει τον επίγειο ναό (τη σκηνή, το αγιαστήριο):</p><blockquote><p><em>«καὶ </em><strong><em><mark>ποιήσεις</mark></em></strong><em> μοι </em><strong><em>ἁγίασμα</em></strong><em>, καὶ ὀφθήσομαι ἐν ὑμῖν· καὶ ποιήσεις μοι </em><strong><em><mark>κατὰ πάντα, ὅσα ἐγώ σοι δεικνύω ἐν τῷ ὄρει</mark></em></strong><em>, </em><strong><em>τὸ παράδειγμα τῆς σκηνῆς</em></strong><em> καὶ τὸ παράδειγμα πάντων τῶν σκευῶν αὐτῆς· </em><strong><em>οὕτω ποιήσεις</em></strong><em>. &lt;…&gt; ὅρα </em><strong><em>ποιήσεις κατὰ τὸν τύπον τὸν δεδειγμένον σοι ἐν τῷ ὄρει</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L8-9,40"><em>Έξ 25:8-9,40</em></a><em>)</em></p></blockquote><blockquote><p><em>«οὐ γὰρ εἰς </em><strong><em>χειροποίητα εἰσῆλθεν ἅγια Χριστός, <mark>ἀντίτυπα τῶν ἀληθινῶν</mark></em></strong><em>, ἀλλ᾿ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24"><em>Εβρ 9:24</em></a><em>)</em></p></blockquote><p>Εξετάζοντας <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ">την κατασκευή</a> και τις παραστάσεις του παλαιοδιαθηκικού ναού, βλέπουμε ότι πριν από τη θυσία του Χριστού στον ουρανό βρίσκονται μόνο ο Θεός (αόρατος) και οι άγιοι άγγελοι (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L29">Γ Βασ 6:29</a>).</p><p>Μετά την ανάσταση και την ανάληψη του Χριστού, ο Θεός, ορατός κατά την ανθρώπινη φύση, κάθεται στον ουρανό (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L20-21">Εφ 1:20-21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L21">Απ 3:21</a>), όπου ακόμη βρίσκονται οι άγγελοι (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3">Απ 8:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/15/#L6">Απ 15:6</a>), και εμφανίζονται επίσης οι ψυχές των δικαίων (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1,3-5">Απ 14:1,3-5</a>). Αυτή τη νέα ουράνια πραγματικότητα τη βλέπουμε στην Αποκάλυψη του Ιωάννη του Θεολόγου.</p><p>Έτσι, στη νέα ουράνια πραγματικότητα, εκτός από τον Θεό και τους αγγέλους, εμφανίζονται και οι ψυχές των δικαίων, οι οποίες πριν από την ανάσταση του Χριστού δεν ήταν εκεί.</p><h3>Η Παλαιά Διαθήκη — στον ναό μόνο ο Θεός και οι άγγελοι</h3><p>Πριν από τη θυσία του Χριστού, στην Παλαιά Διαθήκη ο Θεός δείχνει στον προφήτη Μωυσή στο όρος τον ναό, διατάζοντας να γίνουν στη γη όλα σύμφωνα με την εικόνα που του δείχτηκε (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L8-9,40">Έξ 25:8-9,40</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a>). Ως αποτέλεσμα, ο Μωυσής κατασκευάζει τον ναό, στον οποίο ο Θεός δεν απεικονίζεται καθόλου, ενώ γύρω από τον τόπο της εμφάνισης του Θεού (το κάλυμμα της κιβωτού) τοποθετούνται αγάλματα αγγέλων· επίσης και όλοι οι τοίχοι και το καταπέτασμα περιέχουν παραστάσεις αγγέλων.</p><h4>Ο αόρατος Θεός</h4><p>Στον παλαιοδιαθηκικό ναό, που χτίστηκε με εντολή του Θεού, δεν υπήρχε παράσταση του Θεού, γιατί ο Θεός δεν ήταν ορατός. Στο ιερότερο σημείο βρισκόταν μόνο η κιβωτός (το σεντούκι) με τα άγια, πάνω από το κάλυμμα της οποίας, ανάμεσα στα δύο χερουβίμ, ο Θεός αποκαλυπτόταν και μιλούσε:</p><blockquote><p><em>«καὶ </em><strong><em>γνωσθήσομαί σοι ἐκεῖθεν καὶ λαλήσω σοι ἄνωθεν τοῦ ἱλαστηρίου ἀνὰ μέσον τῶν δύο χερουβιμ</em></strong><em> τῶν ὄντων ἐπὶ τῆς κιβωτοῦ τοῦ μαρτυρίου καὶ κατὰ πάντα, ὅσα ἂν ἐντείλωμαί σοι πρὸς τοὺς υἱοὺς Ισραηλ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L22"><em>Έξ 25:22</em></a><em>)</em></p></blockquote><h4>Οι άγιοι άγγελοι</h4><p>Ο ναός ήταν παντού γεμάτος παραστάσεις αγγέλων (χερουβίμ):</p><blockquote><p><em>«καὶ </em><strong><em>ποιήσεις δύο χερουβιμ χρυσᾶ</em></strong><em> τορευτὰ καὶ ἐπιθήσεις αὐτὰ </em><strong><em>ἐξ ἀμφοτέρων τῶν κλιτῶν τοῦ ἱλαστηρίου</em></strong><em>· ποιηθήσονται χερουβ εἷς ἐκ τοῦ κλίτους τούτου καὶ χερουβ εἷς ἐκ τοῦ κλίτους τοῦ δευτέρου τοῦ ἱλαστηρίου· καὶ ποιήσεις τοὺς δύο χερουβιμ ἐπὶ τὰ δύο κλίτη. ἔσονται οἱ χερουβιμ ἐκτείνοντες τὰς πτέρυγας ἐπάνωθεν, συσκιάζοντες ταῖς πτέρυξιν αὐτῶν ἐπὶ τοῦ ἱλαστηρίου, καὶ τὰ πρόσωπα αὐτῶν εἰς ἄλληλα· εἰς τὸ ἱλαστήριον ἔσονται τὰ πρόσωπα τῶν χερουβιμ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18-20"><em>Έξ 25:18-20</em></a><em>)</em></p></blockquote><blockquote><p><em>«Καὶ </em><strong><em>ἐποίησεν ἐν τῷ δαβιρ δύο χερουβιν</em></strong><em> δέκα πήχεων μέγεθος ἐσταθμωμένον. &lt;…&gt; καὶ </em><strong><em>ἀμφότερα τὰ χερουβιν ἐν μέσῳ τοῦ οἴκου τοῦ ἐσωτάτου</em></strong><em>· καὶ διεπέτασεν τὰς πτέρυγας αὐτῶν, καὶ ἥπτετο πτέρυξ μία τοῦ τοίχου, καὶ πτέρυξ ἥπτετο τοῦ τοίχου τοῦ δευτέρου, καὶ αἱ πτέρυγες αὐτῶν αἱ ἐν μέσῳ τοῦ οἴκου ἥπτοντο πτέρυξ πτέρυγος.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L23,27"><em>Γ Βασ 6:23,27</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἐποίησεν τὸ </em><strong><em>καταπέτασμα</em></strong><em> ἐξ ὑακίνθου καὶ πορφύρας καὶ κοκκίνου καὶ βύσσου καὶ </em><strong><em>ὕφανεν ἐν αὐτῷ χερουβιν</em></strong><em>. —» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L14"><em>Β Παρ 3:14</em></a><em>) (</em><a href="https://bibleox.com/el/gr-lxx-byz/1mak/1/#L22"><em>I Μακ 1:22</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ </em><strong><em>πάντας τοὺς τοίχους τοῦ οἴκου κύκλῳ ἐγκολαπτὰ ἔγραψεν γραφίδι χερουβιν</em></strong><em>, καὶ φοίνικες τῷ ἐσωτέρῳ καὶ τῷ ἐξωτέρῳ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L29"><em>Γ Βασ 6:29</em></a><em>)</em></p></blockquote><p>Λεπτομέρειες για τη διάταξη του ναού: <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ">Ο ναός της Ιερουσαλήμ</a>.</p><h3>Η Καινή Διαθήκη — στον ναό ο Θεός, οι άγγελοι και οι ψυχές των δικαίων</h3><p>Μετά τη σάρκωση του Υιού του Θεού και τη νίκη Του πάνω στον θάνατο, βλέπουμε μια άλλη ουράνια πραγματικότητα. Την περιγράφει ο Ιωάννης ο Θεολόγος στο βιβλίο της Αποκάλυψης. Πρώτον, ο Θεός γίνεται ορατός και κάθεται στον θρόνο. Δεύτερον, στον ουρανό Τον υπηρετούν πλέον όχι μόνο οι άγγελοι, αλλά και πλήθος ψυχών αγίων δικαίων.</p><h4>Ο Χριστός</h4><blockquote><p>«Ὁ μὲν οὖν κύριος [Ἰησοῦς] μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ <strong><mark>ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L19">Μκ 16:19</a>)</p></blockquote><blockquote><p>«ἣν ἐνήργησεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ἐκ νεκρῶν, καὶ <strong><mark>καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις</mark></strong> ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L20-21">Εφ 1:20-21</a>)</p></blockquote><blockquote><p>«ὁ νικῶν δώσω αὐτῷ καθίσαι μετ᾿ ἐμοῦ <strong>ἐν τῷ θρόνῳ μου</strong>, ὡς κἀγὼ ἐνίκησα καὶ <strong><mark>ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ</mark></strong> αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L21">Απ 3:21</a>)</p></blockquote><h4>Οι άγιοι άγγελοι</h4><blockquote><p><em>«Καὶ ἄλλος </em><strong><em>ἄγγελος</em></strong><em> ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3"><em>Απ 8:3</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἐξῆλθον οἱ ἑπτὰ </em><strong><em>ἄγγελοι</em></strong><em> [οἱ] ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ἐνδεδυμένοι λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/15/#L6"><em>Απ 15:6</em></a><em>)</em></p></blockquote><h4>Οι ψυχές των αγίων δικαίων</h4><blockquote><p><em>«Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον </em><strong><em>ὑποκάτω τοῦ θυσιαστηρίου τὰς <mark>ψυχὰς</mark> τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν μαρτυρίαν ἣν εἶχον</em></strong><em>. καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες, Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς; καὶ ἐδόθη αὐτοῖς ἑκάστῳ </em><strong><em>στολὴ λευκή</em></strong><em>, καὶ ἐρρέθη αὐτοῖς ἵνα ἀναπαύσονται ἔτι χρόνον μικρόν, ἕως πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ </em><strong><em>οἱ ἀδελφοὶ αὐτῶν οἱ μέλλοντες ἀποκτέννεσθαι ὡς καὶ αὐτοί</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11"><em>Απ 6:9-11</em></a><em>)</em></p></blockquote><blockquote><p><em>«Καὶ εἶδον, καὶ ἰδοὺ τὸ </em><strong><em>ἀρνίον</em></strong><em> ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ </em><strong><em>μετ᾿ αὐτοῦ <mark>ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες</mark></em></strong><em> ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν. &lt;…&gt; καὶ ᾄδουσιν [ὡς] ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες, </em><strong><em><mark>οἱ ἠγορασμένοι ἀπὸ τῆς γῆς</mark></em></strong><em>. οὗτοί εἰσιν οἳ </em><strong><em>μετὰ γυναικῶν οὐκ ἐμολύνθησαν</em></strong><em>, παρθένοι γάρ εἰσιν. οὗτοι </em><strong><em>οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ὑπάγῃ</em></strong><em>. οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ, καὶ ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη ψεῦδος· ἄμωμοί εἰσιν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1,3-5"><em>Απ 14:1,3-5</em></a><em>)</em></p></blockquote><h2>Κανείς δεν ανέβηκε στους ουρανούς, παρά μόνο ο Υιός που κατέβηκε από τους ουρανούς</h2><blockquote><p>«καὶ <strong><mark>οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ἀνθρώπου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L13">Ιω 3:13</a>)</p></blockquote><blockquote><p>«Ἄνδρες ἀδελφοί, <strong>ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη</strong> καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης· &lt;…&gt; <strong>οὐ γὰρ <mark>Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς</mark></strong>, λέγει δὲ αὐτός, Εἶπεν κύριος τῷ κυρίῳ μου, Κάθου ἐκ δεξιῶν μου» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L29,34">Πραξ 2:29,34</a>)</p></blockquote><h2>«Δεν θα εγκαταλείψεις την ψυχή μου στον Άδη» — δεν ειπώθηκε για τον Δαβίδ</h2><p>Η προφητεία που είπε ο βασιλιάς Δαβίδ στον ψαλμό (<a href="https://bibleox.com/el/gr-lxx-byz/ps/15/#L10">Ψλ 15:10</a>), ότι η ψυχή δεν εγκαταλείπεται στον Άδη και η σάρκα δεν θα δει φθορά, δεν αναφέρεται στον Δαβίδ, αλλά στον Χριστό. Επομένως, και η <strong>σάρκα</strong> του βασιλιά Δαβίδ είδε φθορά, και η <strong>ψυχή</strong> εγκαταλείφθηκε στον Άδη μέχρι την κάθοδο του Χριστού στον Άδη.</p><blockquote><p>«ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν. &lt;…&gt; Ἄνδρες ἀδελφοί, <strong>ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη</strong> καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης· &lt;…&gt; προϊδὼν <strong><mark>ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ Χριστοῦ ὅτι οὔτε ἐγκατελείφθη εἰς ᾅδην οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν</mark></strong>. &lt;…&gt; <strong>οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς</strong>, λέγει δὲ αὐτός, Εἶπεν κύριος τῷ κυρίῳ μου, Κάθου ἐκ δεξιῶν μου» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L27,29,31,34">Πραξ 2:27,29,31,34</a>)</p></blockquote><h2>Ο Χριστός κατέβηκε στον Άδη, κήρυξε, βγήκε ο ίδιος και έβγαλε τους δικαίους από τον Άδη</h2><p>Στον Άδη ο Χριστός κήρυξε στα πνεύματα (ψυχές) που ήταν εκεί ακόμη από τον καιρό του κατακλυσμού:</p><blockquote><p>«ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν [ὑπὲρ ὑμῶν] ἀπέθανεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ, <strong>θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι</strong>· ἐν ᾧ καὶ <strong><mark>τοῖς ἐν φυλακῇ πνεύμασιν πορευθεὶς ἐκήρυξεν</mark></strong>, ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ, εἰς ἣν ὀλίγοι, τοῦτ᾿ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι᾿ ὕδατος.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L18-20">Α Πε 3:18-20</a>)</p><p>«οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ἔχοντι κρῖναι ζῶντας καὶ νεκρούς. εἰς τοῦτο γὰρ καὶ <strong><mark>νεκροῖς εὐηγγελίσθη</mark></strong> ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L5-6">Α Πε 4:5-6</a>)</p></blockquote><h2>Οι δίκαιοι βρίσκονταν στην αιχμαλωσία του Άδη, αλλά ο Χριστός κατέλυσε αυτή την αιχμαλωσία</h2><blockquote><p>«διὸ λέγει, Ἀναβὰς εἰς ὕψος <strong><mark>ᾐχμαλώτευσεν αἰχμαλωσίαν</mark></strong>, ἔδωκεν δόματα τοῖς ἀνθρώποις. [ <strong>τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ κατέβη εἰς τὰ κατώτερα [μέρη] τῆς γῆς</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L8-9">Εφ 4:8-9</a>)</p></blockquote><blockquote><p>«Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ᾿ ἐμὲ λέγων, Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος, καὶ ὁ ζῶν, καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ <strong><mark>ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L17-18">Απ 1:17-18</a>)</p></blockquote><h2>Κανείς από τους παλαιοδιαθηκικούς δικαίους δεν έλαβε το επαγγελμένο και δεν έφτασε στην τελείωση χωρίς τους νεοδιαθηκικούς</h2><p>Περίμεναν και επιθυμούσαν τα ουράνια, αλλά δεν τα έλαβαν:</p><blockquote><p>«Ἔστιν δὲ πίστις <strong>ἐλπιζομένων</strong> <strong>ὑπόστασις</strong>, πραγμάτων ἔλεγχος οὐ βλεπομένων. ἐν ταύτῃ γὰρ ἐμαρτυρήθησαν οἱ πρεσβύτεροι. &lt;…&gt; Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι᾿ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ, καὶ δι᾿ αὐτῆς ἀποθανὼν ἔτι λαλεῖ. Πίστει Ἑνὼχ μετετέθη τοῦ μὴ ἰδεῖν θάνατον, καὶ οὐχ ηὑρίσκετο διότι μετέθηκεν αὐτὸν ὁ θεός· πρὸ γὰρ τῆς μεταθέσεως μεμαρτύρηται εὐαρεστηκέναι τῷ θεῷ, &lt;…&gt; Πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι᾿ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος. Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται. Πίστει <strong>παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν</strong>, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς· <strong><mark>ἐξεδέχετο</mark> γὰρ τὴν <u><mark>τοὺς θεμελίους ἔχουσαν</mark></u> <mark>πόλιν</mark>, <u><mark>ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός</mark></u></strong>. Πίστει — καὶ αὐτὴ Σάρρα στεῖρα — δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον· &lt;…&gt; <strong><mark>Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ κομισάμενοι τὰς ἐπαγγελίας</mark></strong>, <strong><mark>ἀλλὰ</mark> <u><mark>πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι</mark></u></strong>, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς· οἱ γὰρ τοιαῦτα λέγοντες ἐμφανίζουσιν ὅτι πατρίδα ἐπιζητοῦσιν. καὶ εἰ μὲν ἐκείνης μνημονεύουσιν ἀφ᾿ ἧς ἐξέβησαν, εἶχον ἂν καιρὸν ἀνακάμψαι· νῦν δὲ <strong><mark>κρείττονος ὀρέγονται, τοῦτ᾿ ἔστιν</mark> <u><mark>ἐπουρανίου</mark></u></strong>. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, <strong><mark>ἡτοίμασεν γὰρ αὐτοῖς πόλιν</mark></strong>. Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ τὸν μονογενῆ προσέφερεν ὁ τὰς ἐπαγγελίας ἀναδεξάμενος, &lt;…&gt; Πίστει καὶ περὶ μελλόντων εὐλόγησεν Ἰσαὰκ τὸν Ἰακὼβ καὶ τὸν Ἠσαῦ. Πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ. Πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο. Πίστει Μωϋσῆς γεννηθεὶς ἐκρύβη τρίμηνον ὑπὸ τῶν πατέρων αὐτοῦ, διότι εἶδον ἀστεῖον τὸ παιδίον, καὶ οὐκ ἐφοβήθησαν τὸ διάταγμα τοῦ βασιλέως. &lt;…&gt; Καὶ τί ἔτι λέγω; ἐπιλείψει με γὰρ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν, &lt;…&gt; Καὶ <strong><em><u><mark>οὗτοι πάντες</mark></u> μαρτυρηθέντες διὰ τῆς πίστεως <u><mark>οὐκ ἐκομίσαντο τὴν ἐπαγγελίαν</mark></u></em></strong>, τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα <strong><mark>μὴ χωρὶς ἡμῶν τελειωθῶσιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L1-2,4-5,7-11,13-17,20-23,32,39-40">Εβρ 11:1-2,4-5,7-11,13-17,20-23,32,39-40</a>)</p></blockquote><h2>Η θυσία του Χριστού ελευθερώνει τους πιστούς δικαίους από τις αμαρτίες που διαπράχθηκαν πριν</h2><blockquote><p>«Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ· διότι <strong><mark>ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ</mark></strong>, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας. <strong><mark>Νυνὶ δὲ χωρὶς νόμου</mark></strong> <strong>δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν, <mark>δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ</mark>, <mark>εἰς πάντας τοὺς πιστεύοντας</mark></strong>· <strong><mark>οὐ γάρ ἐστιν διαστολή</mark></strong>· <strong><mark>πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ</mark>, <mark>δικαιούμενοι</mark> δωρεὰν τῇ αὐτοῦ χάριτι <mark>διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ</mark>· <mark>ὃν προέθετο ὁ θεὸς ἱλαστήριον</mark></strong> διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ <strong><mark>διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων</mark></strong> ἐν τῇ ἀνοχῇ τοῦ θεοῦ, <strong><mark>πρὸς τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ</mark></strong> <strong><mark>ἐν τῷ νῦν καιρῷ</mark></strong>, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ. Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L19-27">Ρωμ 3:19-27</a>).</p></blockquote>'
