  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Για τι πραγματεύεται το άρθρο</h2><p>Στο άρθρο αυτό αναλύεται η χρήση των ελληνικών λέξεων «άρτος» και «άζυμα» σε σχέση με το ζήτημα της Ευχαριστίας, με βάση βιβλικά κείμενα της Παλαιάς και της Καινής Διαθήκης.</p><p><strong>Άρτος</strong> — απλώς ψωμί, χωρίς ένδειξη για τις ιδιότητές του.</p><p><strong>Άζυμα</strong> — άζυμος άρτος (είδος άρτου χωρίς προζύμι).</p><p><strong>Άρτος άζυμος</strong> — άζυμο ψωμί. Η προσθήκη της λέξης «άρτος» γίνεται, κατά κανόνα, όταν απαριθμούνται διάφορα είδη αζύμων (άζυμη πίτα, άζυμη λαγάνα).</p><p>Η αναφορά σε αυτές τις ελληνικές λέξεις χρησιμοποιήθηκε ως επιχείρημα σε ιστορικές διαμάχες.</p><h2>Για το αντικείμενο της διαφωνίας</h2><p>Κατά τη διάρκεια της ιστορίας, στη συζήτηση για την <a href="https://bibleox.com/el/el/w/Η_Θεία_Ευχαριστία">Ευχαριστία</a> (το κύριο μυστήριο της Ορθόδοξης Εκκλησίας) προέκυπταν διαφωνίες για το ποιο <strong>ψωμί</strong> χρησιμοποίησε ο Κύριος Ιησούς Χριστός, όταν το έδωσε στους αποστόλους και το ονόμασε Σώμα Του.</p><p>Οι πλευρές διχάζονται σε δύο απόψεις:</p><ul><li><p><strong>ένζυμος άρτος</strong> (με προζύμι) — η Ορθόδοξη Εκκλησία·</p></li><li><p><strong>άζυμος άρτος</strong> (άζυμα) — ο Ρωμαιοκαθολικισμός (στην αρχή χρησιμοποιούσαν ένζυμο άρτο) και ο Προτεσταντισμός (απαντώνται διάφορες πρακτικές).</p></li></ul><p>Η Ορθόδοξη Εκκλησία, στην οποία μέχρι τον 11ο αιώνα ανήκε και η Ρωμαϊκή Εκκλησία, από την αρχή χρησιμοποιούσε παντού ένζυμο άρτο. Με την αποστασία της Ρωμαϊκής Εκκλησίας από την Ορθοδοξία, μεταξύ άλλων καινοτομιών της Ρώμης εξετάζεται και το ζήτημα της εγκατάλειψης από τη Ρώμη της τέλεσης με ένζυμο άρτο και της μετάβασης στη χρήση άζυμου άρτου. Αργότερα το ζήτημα αυτό γίνεται επίκαιρο στη διαμάχη με διάφορες κατευθύνσεις του Προτεσταντισμού.</p><p>Υπέρ της χρήσης ένζυμου άρτου στην Ευχαριστία υπάρχει σειρά επιχειρημάτων· ένα από αυτά είναι η λέξη άρτος. Και οι τέσσερις ευαγγελιστές (Ματθαίος, Μάρκος, Λουκάς, Ιωάννης) ονόμασαν τον ευχαριστιακό άρτο με την ελληνική λέξη «<strong>άρτος</strong>», γεγονός που δίνει βάση να θεωρούμε τον άρτο ένζυμο, διότι ο άζυμος άρτος του πασχαλινού δείπνου (σεδέρ) στην Αγία Γραφή ονομάζεται πάντοτε (χωρίς εξαίρεση) με την ελληνική λέξη «<strong>άζυμος</strong>». Εξάλλου, και γενικά όταν γίνεται λόγος για άζυμο άρτο, σχεδόν πάντοτε δηλώνεται ρητά ότι είναι άζυμος.</p><h4>Ο ευαγγελιστής Ματθαίος</h4><blockquote><p>«Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς <strong>ἄρτον</strong> καὶ εὐλογήσας ἔκλασεν καὶ δοὺς τοῖς μαθηταῖς εἶπεν, Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26">Μτ 26:26</a>)</p></blockquote><h4>Ο ευαγγελιστής Μάρκος</h4><blockquote><p>«Καὶ ἐσθιόντων αὐτῶν λαβὼν <strong>ἄρτον</strong> εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν, Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L22">Μκ 14:22</a>)</p></blockquote><h4>Ο ευαγγελιστής Λουκάς</h4><blockquote><p>«καὶ λαβὼν <strong>ἄρτον</strong> εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων, Τοῦτό ἐστιν τὸ σῶμά μου [τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19">Λκ 22:19</a>)</p></blockquote><h4>Ο ευαγγελιστής Ιωάννης</h4><blockquote><p>«οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα τίνας ἐξελεξάμην· ἀλλ᾿ ἵνα ἡ γραφὴ πληρωθῇ, Ὁ τρώγων μου τὸν <strong>ἄρτον</strong> ἐπῆρεν ἐπ᾿ ἐμὲ τὴν πτέρναν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/13/#L18">Ιω 13:18</a>)</p></blockquote><h4>Ο απόστολος Παύλος</h4><blockquote><p>«Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ παρεδίδετο ἔλαβεν <strong>ἄρτον</strong> καὶ εὐχαριστήσας ἔκλασεν καὶ εἶπεν, Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L23-24">Α Κορ 11:23-24</a>)</p></blockquote><h2>Η Αγία Γραφή: άζυμος ή άρτος άζυμος</h2><p>Στην Αγία Γραφή με τη λέξη «άρτος», κατά κανόνα, ονομάζεται ο ένζυμος άρτος, ενώ με τη λέξη «άζυμος» ονομάζονται τα άζυμα. Αν πρόκειται για τα πασχαλινά άζυμα, τότε στην Αγία Γραφή λέγεται πάντοτε ρητά: είτε απλώς <strong>άζυμος</strong> (άζυμα), είτε <strong>άρτος άζυμος</strong> (άζυμο ψωμί) (κατά κανόνα, όταν απαριθμούνται διάφορα είδη αζύμων). Αυτό είναι σημαντικό για την τήρηση του Νόμου: να δηλωθεί ότι ο άρτος είναι άζυμος.</p><p>Για παράδειγμα, σήμερα ονομάζουμε το λευκό ψωμί απλώς «ψωμί», ενώ το μαύρο ψωμί το ονομάζουμε «μαύρο ψωμί», μολονότι για μας η διαφορά αυτή δεν είναι πάντοτε σημαντική, ενώ για τους Ιουδαίους, όσον αφορά τον Νόμο, είναι ουσιώδης: αν ο άρτος είναι άζυμος ή όχι.</p><p>Έτσι, μπορεί κανείς να πει απλώς «άζυμος» ή «άρτος άζυμος» (άζυμο ψωμί), αλλά τα άζυμα δεν ονομάζονται μόνο «άρτος» χωρίς αναφορά στο ότι ο άρτος αυτός είναι άζυμος. Τις περισσότερες φορές τα άζυμα ονομάζονται με μία λέξη: «άζυμος».</p><p>Η έκφραση «άρτος άζυμος» (άζυμο ψωμί) απαντά πολύ σπανιότερα. Η προσθήκη γίνεται όταν πρόκειται για διάφορα άζυμα, διαφορετικά ως προς το σχήμα και τον τρόπο παρασκευής. Έτσι, το άζυμο σε σχήμα πίτας με προσθήκη λαδιού στο ζυμάρι θα ονομαστεί «άρτος άζυμος» (άζυμη πίτα), ενώ το άζυμο σε σχήμα λαγάνας και αλειμμένο με λάδι θα ονομαστεί «λαγάνα άζυμη» (άζυμη λαγάνα). Εξαιτίας αυτού, σε σπάνιες περιπτώσεις προκύπτουν οι εξής συνδυασμοί λέξεων:</p><ul><li><p>πίτα άζυμη·</p></li><li><p>λαγάνα άζυμη.</p></li></ul><p>Αν δεν υπάρχει απαρίθμηση διαφόρων ειδών άζυμου άρτου, τότε σχεδόν πάντοτε τα άζυμα ονομάζονται με μία λέξη: <strong>άζυμος</strong>.</p><h2>Γενική εικόνα</h2><h3>Παλαιά Διαθήκη</h3><p>Ο πασχαλινός άρτος ονομάζεται πάντοτε άζυμος. Χρησιμοποιούνται οι λέξεις: «άζυμα» ή «άρτος άζυμος».</p><h3>Καινή Διαθήκη</h3><p>Ο ευχαριστιακός άρτος ουδέποτε ονομάζεται άζυμος. Οι ευαγγελιστές χρησιμοποιούν πάντοτε τη λέξη «άρτος», χωρίς καθόλου να αναφέρουν την παρουσία «αζύμων» στον δείπνο.</p><h2>Μήπως όμως ο άρτος σημαίνει και άζυμο ψωμί;</h2><p>Οι αντίπαλοι της Ορθόδοξης Εκκλησίας, θέλοντας να αποδείξουν ότι στην Αγία Γραφή με τη λέξη άρτος μπορεί να ονομάζεται κάθε άρτος, μεταξύ αυτών και ο άζυμος, φέρνουν σπανιότατες περιπτώσεις (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L2">Έξ 29:2</a> και <a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L23">Έξ 29:23</a>) όπου γίνεται λόγος για άζυμα, αλλά αυτά ονομάζονται απλώς «άρτος». Είναι ακριβώς η περίπτωση όπου γίνεται λόγος για δύο διαφορετικά άζυμα: την πίτα (άρτος) και τη λαγάνα.</p><p>Πριν προχωρήσουμε στη λεπτομερή εξέταση των στίχων αυτών, μπορούμε εκ των προτέρων να σημειώσουμε ότι και στην περίπτωση αυτή δηλώνεται σαφώς ότι πρόκειται για άζυμο άρτο:</p><ol><li><p>Στην αρχή του κεφαλαίου <a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L2">Έξ 29:2</a> οι άρτοι αυτοί (πίτα και λαγάνα) ονομάζονται: πίτα άζυμη και λαγάνα άζυμη.</p></li><li><p>Στο μέσο του κεφαλαίου <a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L23">Έξ 29:23</a> επαναλαμβάνεται συντομότερα: πίτα και λαγάνα, και αμέσως δηλώνεται: «από το κανούν των αζύμων», δηλαδή άζυμα.</p></li></ol><p>Τώρα ας εξετάσουμε λεπτομερέστερα. Οι λέξεις είναι ελληνικές, γι’ αυτό ας προσφύγουμε απευθείας στο ελληνικό κείμενο των Ο΄, που συντάχθηκε από 72 Ιουδαίους μεταφραστές δύο αιώνες πριν από τη γέννηση του Ιησού Χριστού. Παίρνουμε λοιπόν το ελληνικό κείμενο από τους Ο΄:</p><blockquote><p>«καὶ <strong>ἄρτους</strong> <strong>ἀζύμους</strong> πεφυραμένους ἐν ἐλαίῳ καὶ <strong>λάγανα</strong> <strong>ἄζυμα</strong> κεχρισμένα ἐν ἐλαίῳ· σεμίδαλιν ἐκ πυρῶν ποιήσεις αὐτά.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L2">Έξ 29:2</a>)</p></blockquote><p>Εδώ εμφανίζονται: 1) <strong>άζυμος άρτος</strong> (άρτους αζύμους), ζυμωμένος με λάδι (πεφυραμένους εν ελαίω)· 2) <strong>άζυμη λαγάνα</strong> (λάγανα άζυμα), αλειμμένη με λάδι (κεχρισμένα εν ελαίω). Οι Ο΄ αναφέρουν μόνο αυτά τα δύο άζυμα (το μασοριτικό κείμενο — τρία άζυμα). Έπειτα ο Θεός λέει να γίνουν από σιτάλευρο. Τώρα ας προσφύγουμε και στον επόμενο στίχο:</p><blockquote><p>«καὶ <strong>ἄρτον</strong> ἕνα ἐξ ἐλαίου καὶ <strong>λάγανον</strong> ἓν ἀπὸ τοῦ κανοῦ τῶν <strong>ἀζύμων</strong> τῶν προτεθειμένων ἔναντι κυρίου» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L23">Έξ 29:23</a>)</p></blockquote><p>Εδώ αναφέρονται οι ίδιοι δύο άρτοι του δευτέρου στίχου:</p><ul><li><p>«και ένας άρτος από λάδι»·</p></li><li><p>«και μία λαγάνα».</p></li></ul><p>Και αμέσως δηλώνεται ότι είναι από το κανούν, στο οποίο βρίσκεται άζυμος άρτος. Εξάλλου, στο κεφάλαιο αυτό (στίχος 2) έχει ήδη δηλωθεί ότι ο άρτος αυτός είναι άζυμος.</p><p>Δηλαδή και στην περίπτωση αυτή, όταν η λέξη «άρτος» συνδυάζεται με τη λέξη «άζυμος», και πάλι κάθε φορά δηλώνεται ότι ο άρτος είναι άζυμος. Αλλά εδώ υπάρχει και λόγος για την προσθήκη στη λέξη «άζυμος» επιπλέον λέξεων: περιγράφονται διαφορετικά άζυμα (πίτα και λαγάνα). Αν δεν χρησιμοποιήσουμε επιπλέον λέξεις για να περιγράψουμε την παρασκευή, θα προκύψει απλώς: «πάρτε άζυμο και άζυμα», που φαίνεται αρκετά παράξενο.</p><p>Επειδή οι άρτοι διαφέρουν, προκύπτει η ανάγκη επιπλέον λέξεων:</p><ul><li><p>άρτους αζύμους (πίτα άζυμη)·</p></li><li><p>λάγανα άζυμα (λαγάνα άζυμη).</p></li></ul><p>Και για δεύτερη φορά:</p><ul><li><p>άρτον (πίτα)·</p></li><li><p>λάγανον (λαγάνα)·</p></li><li><p>από το κανούν των αζύμων.</p></li></ul><h2>Συλλογή των αναφορών για τα άζυμα</h2><h3><strong>Παλαιά Διαθήκη</strong></h3><ul><li><p><a href="https://bibleox.com/el/gr-lxx-byz/gen/19/#L3">Γεν 19:3</a>: αζύμους</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L8">Έξ 12:8</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L15">Έξ 12:15</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L18">Έξ 12:18</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L20">Έξ 12:20</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L39">Έξ 12:39</a>: αζύμους</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/13/#L6">Έξ 13:6</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/13/#L7">Έξ 13:7</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/23/#L15">Έξ 23:15</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/23/#L15">Έξ 23:15</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L2">Έξ 29:2</a>: άρτους αζύμους</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L2">Έξ 29:2</a>: λάγανα άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L23">Έξ 29:23</a>: από το κανούν των αζύμων (απαριθμούνται είδη άρτων, περιγράφεται η τελετή καθιέρωσης των ιερέων)</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/34/#L18">Έξ 34:18</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ish/34/#L18">Έξ 34:18</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/2/#L4">Λευ 2:4</a>: άρτους αζύμους</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/2/#L4">Λευ 2:4</a>: λάγανα άζυμα (απαριθμούνται είδη άρτων)</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/2/#L5">Λευ 2:5</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/6/#L16">Λευ 6:16</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/7/#L12">Λευ 7:12</a>: λάγανα άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/8/#L2">Λευ 8:2</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/8/#L26">Λευ 8:26</a>: άρτον ένα άζυμον (απαριθμούνται είδη άρτων, περιγράφεται η τελετή καθιέρωσης των ιερέων)</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/10/#L12">Λευ 10:12</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/23/#L6">Λευ 23:6</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lev/23/#L6">Λευ 23:6</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/chis/6/#L15">Αρ 6:15</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/chis/6/#L15">Αρ 6:15</a>: λάγανα άζυμα (απαριθμούνται είδη άρτων)</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/chis/6/#L17">Αρ 6:17</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/chis/6/#L19">Αρ 6:19</a>: άρτον ένα άζυμον</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/chis/6/#L19">Αρ 6:19</a>: λάγανον άζυμον (απαριθμούνται είδη άρτων)</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/chis/9/#L11">Αρ 9:11</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/chis/28/#L17">Αρ 28:17</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L3">Δτ 16:3</a>: άζυμα, άρτον κακώσεως</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L16">Δτ 16:16</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/nav/5/#L11">Ιησ 5:11</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L19">Κρ 6:19</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L20">Κρ 6:20</a>: άρτους τους αζύμους</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L21">Κρ 6:21</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L21">Κρ 6:21</a>: αζύμους</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/1ts/28/#L24">Α Βασ 28:24</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/4ts/23/#L9">Δ Βασ 23:9</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/1par/23/#L29">Α Παρ 23:29</a>: λάγανα τα άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2par/8/#L13">Β Παρ 8:13</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2par/30/#L13">Β Παρ 30:13</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2par/30/#L21">Β Παρ 30:21</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2par/30/#L22">Β Παρ 30:22</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2par/35/#L17">Β Παρ 35:17</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/ezd/6/#L22">Εσδ 6:22</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2ezd/1/#L10">II Εσδρ 1:10</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2ezd/1/#L17">II Εσδρ 1:17</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/2ezd/7/#L14">II Εσδρ 7:14</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/iez/45/#L21">Ιεζ 45:21</a>: άζυμα</p></li></ul><h3><strong>Καινή Διαθήκη</strong></h3><ul><li><p><a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L17">Μτ 26:17</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L1">Μκ 14:1</a>: άζυμα</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L12">Μκ 14:12</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L1">Λκ 22:1</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L7">Λκ 22:7</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/act/12/#L3">Πραξ 12:3</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L6">Πραξ 20:6</a>: αζύμων</p></li><li><p><a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L8">Α Κορ 5:8</a>: αζύμοις</p></li></ul><p>Μπορεί να διαπιστώσει κανείς ότι τις περισσότερες φορές λέγεται απλώς «άζυμος», αλλά μερικές φορές λέγεται «άρτος άζυμος». Για να ονομάζονται τα πασχαλινά άζυμα απλώς «άρτος», δεν βρέθηκε ούτε ένα χωρίο. Μιλώντας για τον πασχαλινό δείπνο, λέγεται πάντοτε απλώς: άζυμα, χωρίς προσθήκες. Όταν στην Παλαιά Διαθήκη απαντούν αναφορές στην Καινή Διαθήκη, στην Εκκλησία και στην Ευχαριστία, τότε γίνεται λόγος για κοινό άρτο (ψωμί) ή για ένζυμο άρτο (δηλαδή δηλώνεται ρητά η παρουσία προζυμιού). Ας εξετάσουμε αυτές τις αναφορές στην Καινή Διαθήκη.</p><h2>Ο Μελχισεδέκ — προτύπωση της Ευχαριστίας</h2><p>Οι προφήτες και οι απόστολοι ονομάζουν τον Υιό του Θεού ιερέα κατά την τάξη του Μελχισεδέκ:</p><blockquote><p>«προσαγορευθεὶς ὑπὸ τοῦ θεοῦ ἀρχιερεὺς κατὰ τὴν τάξιν Μελχισέδεκ.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/5/#L10">Εβρ 5:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/5/#L6">Εβρ 5:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L20">Εβρ 6:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L11">Εβρ 7:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L17">Εβρ 7:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L21">Εβρ 7:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/109/#L4">Ψλ 109:4</a>)</p></blockquote><p>Ας θυμηθούμε τον Μελχισεδέκ. Ο πατριάρχης Αβραάμ συναντά τον μυστηριώδη ιερέα του Θεού του Υψίστου (η ιεροσύνη δεν έχει ακόμη καθιερωθεί) — τον βασιλιά της Σαλήμ, που ονομάζεται Μελχισεδέκ. Ο Μελχισεδέκ προσφέρει στον Αβραάμ κοινό άρτο και κρασί, και ο Αβραάμ δίνει στον Μελχισεδέκ τη δεκάτη (που επίσης δεν έχει ακόμη καθιερωθεί):</p><blockquote><p>«καὶ Μελχισεδεκ βασιλεὺς Σαλημ ἐξήνεγκεν <strong>ἄρτους</strong> καὶ οἶνον· ἦν δὲ ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/14/#L18">Γεν 14:18</a>)</p></blockquote><p>Ο Μελχισεδέκ χρησιμοποιεί απλώς άρτο.</p><h2>Το μάννα — προτύπωση της Ευχαριστίας</h2><p>Το μάννα της Παλαιάς Διαθήκης, που δινόταν στους Ιουδαίους στην έρημο για τη συντήρηση της ζωής, είναι προτύπωση της Ευχαριστίας, όπως δηλώνει ο ίδιος ο Κύριος Ιησούς Χριστός. Στην Παλαιά Διαθήκη ο Θεός ονόμασε το μάννα άρτο (άρτους) από τον ουρανό:</p><blockquote><p>«εἶπεν δὲ κύριος πρὸς Μωυσῆν Ἰδοὺ ἐγὼ ὕω ὑμῖν <strong>ἄρτους</strong> ἐκ τοῦ οὐρανοῦ, καὶ ἐξελεύσεται ὁ λαὸς καὶ συλλέξουσιν τὸ τῆς ἡμέρας εἰς ἡμέραν, ὅπως πειράσω αὐτοὺς εἰ πορεύσονται τῷ νόμῳ μου ἢ οὔ·» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/16/#L4">Έξ 16:4</a>)</p></blockquote><p>Ο άρτος αναφέρεται στο κεφάλαιο αυτό 7 φορές, και τις 7 φορές ονομάζεται άρτος:</p><blockquote><p>«ἰδόντες δὲ αὐτὸ οἱ υἱοὶ Ισραηλ εἶπαν ἕτερος τῷ ἑτέρῳ Τί ἐστιν τοῦτο; οὐ γὰρ ᾔδεισαν, τί ἦν. εἶπεν δὲ Μωϋσῆς πρὸς αὐτούς Οὗτος ὁ <strong>ἄρτος</strong>, ὃν ἔδωκεν κύριος ὑμῖν φαγεῖν·» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/16/#L15">Έξ 16:15</a>)</p></blockquote><p>Ο ουράνιος άρτος (το μάννα) ονομάζεται άρτος.</p><h2>Η εμφάνιση του Θεού στον Αβραάμ στη βελανιδιά του Μαμβρή — προτύπωση της Ευχαριστίας</h2><p>Ο Αβραάμ ετοίμασε για τον Θεό (που εμφανίστηκε με τη μορφή τριών αγγέλων) τράπεζα από κοινό άρτο και σφαγμένο μοσχάρι «τρυφερό και καλό» (εικόνα της θυσίας του Χριστού):</p><blockquote><p>«καὶ λήμψομαι <strong>ἄρτον</strong>, καὶ φάγεσθε, καὶ μετὰ τοῦτο παρελεύσεσθε εἰς τὴν ὁδὸν ὑμῶν, οὗ εἵνεκεν ἐξεκλίνατε πρὸς τὸν παῖδα ὑμῶν. καὶ εἶπαν Οὕτως ποίησον, καθὼς εἴρηκας.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L5">Γεν 18:5</a>)</p></blockquote><p>Ο Αβραάμ, στην τράπεζα που προτυπώνει την Ευχαριστία, χρησιμοποιεί απλώς άρτο.</p><h2>Προφητεία για την Ευχαριστία</h2><p>Στο βιβλίο των Παροιμιών, όταν γίνεται λόγος για την Ευχαριστία, γίνεται λόγος για κοινό άρτο:</p><blockquote><p>«Ἡ σοφία ᾠκοδόμησεν ἑαυτῇ οἶκον καὶ ὑπήρεισεν στύλους ἑπτά· ἔσφαξεν τὰ ἑαυτῆς θύματα, ἐκέρασεν εἰς κρατῆρα τὸν ἑαυτῆς οἶνον καὶ ἡτοιμάσατο τὴν ἑαυτῆς τράπεζαν· ἀπέστειλεν τοὺς ἑαυτῆς δούλους συγκαλούσα μετὰ ὑψηλοῦ κηρύγματος ἐπὶ κρατῆρα λέγουσα Ὅς ἐστιν ἄφρων, ἐκκλινάτω πρός με· καὶ τοῖς ἐνδεέσι φρενῶν εἶπεν Ἔλθατε φάγετε τῶν ἐμῶν <strong>ἄρτων</strong> καὶ πίετε οἶνον, ὃν ἐκέρασα ὑμῖν·» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/9/#L1-5">Πρμ 9:1-5</a>)</p></blockquote><p>Στο προφητικό κείμενο για την Ευχαριστία γίνεται αναφορά στον άρτο.</p><h2>Η Πεντηκοστή — η ημέρα της γεννήσεως της Εκκλησίας</h2><p>Κατά την Πεντηκοστή της Παλαιάς Διαθήκης (στην Καινή Διαθήκη η Πεντηκοστή είναι η ημέρα της γεννήσεως της Εκκλησίας) ο Κύριος προστάζει ρητά να Του προσφέρουν <strong>νέα</strong> θυσία — <strong>ένζυμους άρτους</strong> και επτά άμωμα αρνιά:</p><blockquote><p>«ἕως τῆς ἐπαύριον τῆς ἐσχάτης ἑβδομάδος ἀριθμήσετε πεντήκοντα ἡμέρας καὶ προσοίσετε θυσίαν νέαν τῷ κυρίῳ. ἀπὸ τῆς κατοικίας ὑμῶν προσοίσετε ἄρτους ἐπίθεμα, δύο <strong>ἄρτους</strong>· ἐκ δύο δεκάτων σεμιδάλεως ἔσονται, <strong>ἐζυμωμένοι</strong> πεφθήσονται πρωτογενημάτων τῷ κυρίῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/23/#L16-17">Λευ 23:16-17</a>)</p></blockquote><p>Για την Πεντηκοστή της Παλαιάς Διαθήκης χρησιμοποιείται σαφώς ένζυμος άρτος.</p><h2>Η ειρηνική θυσία της ευχαριστίας</h2><p>Στην Παλαιά Διαθήκη υπάρχουν δύο είδη ειρηνικών θυσιών:</p><ul><li><p>θυσία αινέσεως (תודה, τοδά)·</p></li><li><p>θυσία ευχαριστίας (ή σωτηρίας) (σελαμίμ ή נדר νέντερ).</p></li></ul><p>Η ειρηνική θυσία προϋπέθετε προσφορά άρτου και ζωικής θυσίας. Η ειρηνική θυσία της <strong>αινέσεως</strong> προσφερόταν με άζυμο άρτο, ενώ αν επιπλέον προσφέρεται και ειρηνική θυσία της <strong>ευχαριστίας</strong>, τότε αυτή προσφέρεται με ένζυμο άρτο:</p><blockquote><p>«ἐπ᾿ <strong>ἄρτοις ζυμίταις</strong> προσοίσει τὰ δῶρα αὐτοῦ ἐπὶ θυσίᾳ αἰνέσεως σωτηρίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/7/#L13">Λευ 7:13</a>)</p></blockquote><p>Έτσι, στην Παλαιά Διαθήκη η θυσία της ευχαριστίας (της σωτηρίας) προσφερόταν με ένζυμο άρτο. Στην Καινή Διαθήκη το μυστήριο στο οποίο προσφέρεται άρτος στον Θεό ονομάζεται <strong>«Ευχαριστία»</strong>, διότι ο ίδιος ο Χριστός, πριν το δώσει στους μαθητές, <strong>ευχαρίστησε</strong> τον Θεό και <strong>ευλόγησε</strong> τον άρτο (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19">Λκ 22:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L23-24">Α Κορ 11:23-24</a>).</p><p>Δηλαδή στην Ευχαριστία της Ορθόδοξης Εκκλησίας αυτό ακριβώς γίνεται σήμερα κυριολεκτικά:</p><ul><li><p>λαμβάνεται ένζυμος άρτος,</p></li><li><p>μόνο που δεν προσφέρεται μαζί του ζωικό θύμα, διότι η θυσία, ο Αμνός, το Πάσχα — ο Χριστός (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L7">Α Κορ 5:7</a>) ο σταυρωμένος και αναστημένος.</p></li></ul><p>Αξίζει να προσέξουμε ότι οι άζυμοι άρτοι ονομάζονται άρτοι θλίψεως («άζυμα, άρτον κακώσεως», <a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L3">Δτ 16:3</a>), ενώ η ειρηνική θυσία με ένζυμο άρτο ονομάζεται θυσία ευχαριστίας, ή θυσία σωτηρίας (תֹּודַ֥ת — ευχαριστία, σωτηρίου — σωτηρία <a href="https://bibleox.com/el/gr-lxx-byz/lev/7/#L13">Λευ 7:13</a>).</p><p><em><mark>Σημείωση</mark>:</em> <em>το κρέας της θυσίας επιτρεπόταν να φαγωθεί είτε την ίδια ημέρα, χωρίς να μείνει μέχρι το πρωί (όπως το Πάσχα), είτε δύο ημέρες, αλλά απαγορευόταν κατηγορηματικά να μείνει την τρίτη ημέρα. Αν δεν το έτρωγαν μέχρι την τρίτη ημέρα, το υπόλοιπο έπρεπε να καεί, αλλιώς η θυσία απορρίπτεται από τον Θεό, γίνεται μόλυνση και αμαρτία. Αυτό μας παραπέμπει στην ανάσταση του Σωτήρα — την τρίτη ημέρα ο τάφος ήταν κενός. Δηλαδή και στην περίπτωση αυτή οι ένζυμοι άρτοι αναφέρονται στην Καινή Διαθήκη — στην Ανάσταση του Σωτήρα.</em></p><h2>Λόγια της Καινής Διαθήκης για την Ευχαριστία</h2><p>Κατά την τέλεση της Ευχαριστίας μνημονεύεται πάντοτε ο άρτος· τα χωρία έχουν ήδη παρατεθεί πιο πάνω. Εδώ θα εξετάσουμε και άλλα άμεσα και έμμεσα χωρία. Όλα τους δείχνουν τον άρτο:</p><blockquote><p>«ἐγώ εἰμι ὁ <strong>ἄρτος</strong> ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ <strong>ἄρτου</strong> ζήσει εἰς τὸν αἰῶνα· καὶ ὁ <strong>ἄρτος</strong> δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L51">Ιω 6:51</a>)</p></blockquote><blockquote><p>«ἐγώ εἰμι ὁ <strong>ἄρτος</strong> τῆς ζωῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L48">Ιω 6:48</a>)</p></blockquote><blockquote><p>«τὸν <strong>ἄρτον</strong> ἡμῶν τὸν ἐπιούσιον δίδου ἡμῖν τὸ καθ᾿ ἡμέραν·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L3">Λκ 11:3</a>)</p></blockquote><blockquote><p>«εἰς ἑαυτὸν δὲ ἐλθὼν ἔφη, Πόσοι μίσθιοι τοῦ πατρός μου περισσεύονται <strong>ἄρτων</strong>, ἐγὼ δὲ λιμῷ ὧδε ἀπόλλυμαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/15/#L17">Λκ 15:17</a>)</p></blockquote><blockquote><p>«καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ <strong>ἄρτου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L35">Λκ 24:35</a>)</p></blockquote><blockquote><p>«ἦσαν δὲ προσκαρτεροῦντες τῇ διδαχῇ τῶν ἀποστόλων καὶ τῇ κοινωνίᾳ, τῇ κλάσει τοῦ <strong>ἄρτου</strong> καὶ ταῖς προσευχαῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L42">Πραξ 2:42</a>)</p></blockquote><blockquote><p>«καθ᾿ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ᾿ οἶκον <strong>ἄρτον</strong>, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L46">Πραξ 2:46</a>)</p></blockquote><blockquote><p>«Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ἡμῶν κλάσαι <strong>ἄρτον</strong> ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L7">Πραξ 20:7</a>)</p></blockquote><blockquote><p>«ἀναβὰς δὲ καὶ κλάσας τὸν <strong>ἄρτον</strong> καὶ γευσάμενος ἐφ᾿ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς οὕτως ἐξῆλθεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L11">Πραξ 20:11</a>)</p></blockquote><blockquote><p>«τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ; τὸν <strong>ἄρτον</strong> ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν; ὅτι εἷς <strong>ἄρτος</strong>, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς <strong>ἄρτου</strong> μετέχομεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L16-17">Α Κορ 10:16-17</a>)</p></blockquote><h2>Η ζύμη — εικόνα της αμαρτίας;</h2><p>Μερικές φορές απαντά η αναφορά στην εικόνα της παλαιάς ζύμης, ως ζύμης της κακίας και της πονηρίας. Έτσι ο απόστολος Παύλος χρησιμοποιεί την εικόνα της <strong>παλαιάς</strong> ζύμης, δηλώνοντας ότι πρέπει να την αποβάλουμε:</p><blockquote><p>«ἐκκαθάρατε τὴν <strong>παλαιὰν ζύμην</strong>, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ἡμῶν ἐτύθη Χριστός· ὥστε ἑορτάζωμεν, μὴ ἐν <strong>ζύμῃ παλαιᾷ</strong> μηδὲ ἐν <strong>ζύμῃ κακίας καὶ πονηρίας</strong>, ἀλλ᾿ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L7-8">Α Κορ 5:7-8</a>)</p></blockquote><p>Ωστόσο, ο ίδιος ο Χριστός χρησιμοποιεί την εικόνα της ζύμης διαφορετικά, παρομοιάζοντάς την με τη Βασιλεία των Ουρανών:</p><blockquote><p>«Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· <strong>Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ</strong>, ἣν λαβοῦσα γυνὴ ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία <strong>ἕως οὗ ἐζυμώθη ὅλον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L33">Μτ 13:33</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L21">Λκ 13:21</a>)</p></blockquote><p>Δηλαδή η ζύμη μπορεί να είναι διαφορετική. Δείχνει πώς κάτι μικρό μπορεί να επηρεάσει κάτι μεγάλο: η ζύμη κάνει <strong>όλο</strong> το ζυμάρι να ζυμωθεί. Παρόμοια ο Σωτήρας καταφεύγει στην εικόνα του αλατιού: είναι λίγο, αλλά επηρεάζει όλο το περιβάλλον. Μπορεί να παρατηρήσει κανείς ότι και στην Παλαιά Διαθήκη προσφέρονταν θυσίες και από άζυμο άρτο και από ένζυμο. Από ένζυμο άρτο προσφερόταν εκείνο που μας παραπέμπει στην Καινή Διαθήκη — η ειρηνική θυσία της ευχαριστίας (<a href="https://bibleox.com/el/gr-lxx-byz/lev/7/#L13">Λευ 7:13</a>) και η θυσία της Πεντηκοστής (<a href="https://bibleox.com/el/gr-lxx-byz/lev/23/#L16-17">Λευ 23:16-17</a>). Τα άζυμα δε ονομάζονται άρτοι θλίψεως (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L3">Δτ 16:3</a>), υπενθύμιση της αιγυπτιακής δουλείας. Ο άζυμος, άνοστος, σκληρός άρτος με πικρά χόρτα έπρεπε να υπενθυμίζει στον λαό των Ιουδαίων τις θλίψεις εκείνες, από τις οποίες τους ελευθέρωσε ο Κύριος. Και ο ένζυμος άρτος, αντιστοίχως, αντίθετα — έπρεπε να στρέφει τον νου στον καιρό της ευημερίας, της απαλλαγής από τις θλίψεις, στον καιρό των ευλογιών του Θεού.</p><h2>Σημείωση για τους Ο΄ και τους μασορίτες</h2><p>Η ρωσική συνοδική μετάφραση έγινε από το μασοριτικό κείμενο (που ετοιμάστηκε μετά τη σταύρωση του Χριστού), ενώ στους Ο΄ (που ετοιμάστηκαν δύο αιώνες πριν από τον Χριστό) κατέφευγαν μόνο σε δογματικά σημαντικά σημεία. Στην Ορθόδοξη Εκκλησία διαβάζεται το εκκλησιαστικό σλαβονικό κείμενο, που ετοιμάστηκε κατά τους Ο΄. Όλα αυτά έχουν σημασία, διότι το μασοριτικό κείμενο στα εβραϊκά στα σημεία που μας ενδιαφέρουν στο θέμα αυτό διαφέρει λίγο από το κείμενο που συνέταξαν οι ίδιοι οι Ιουδαίοι, αλλά στα ελληνικά των Ο΄. Για παράδειγμα, στο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L2">Έξ 29:2</a>): — το μασοριτικό κείμενο μνημονεύει τρεις διαφορετικούς άρτους (μολονότι όλοι τους είναι άζυμοι), — οι Ο΄ μνημονεύουν μόνο δύο άρτους (και αυτούς άζυμους). Το ίδιο και παρακάτω.</p>'
