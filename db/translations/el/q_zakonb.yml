  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Το Σάββατο</h2><h3>Ο Θεός αγίασε το Σάββατο</h3><p>Μετά τη δημιουργία του κόσμου ο Θεός αγίασε την έβδομη ημέρα (το Σάββατο), αλλά δεν καθιέρωσε εντολή:</p><blockquote><p>«καὶ <strong>ηὐλόγησεν ὁ θεὸς τὴν ἡμέραν τὴν ἑβδόμην</strong> καὶ <strong>ἡγίασεν αὐτήν</strong>, ὅτι ἐν αὐτῇ <strong>κατέπαυσεν ἀπὸ πάντων τῶν ἔργων αὐτοῦ</strong>, ὧν ἤρξατο ὁ θεὸς ποιῆσαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L3">Γεν 2:3</a>)</p></blockquote><p>Δίπλα υπάρχουν πολλά χωρία όπου ο Θεός δίνει άλλες εντολές:</p><blockquote><p>«καὶ ηὐλόγησεν αὐτοὺς ὁ θεὸς <strong>λέγων</strong> Αὐξάνεσθε καὶ πληθύνεσθε καὶ πληρώσατε τὴν γῆν καὶ κατακυριεύσατε αὐτῆς καὶ ἄρχετε τῶν ἰχθύων τῆς θαλάσσης καὶ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ πάντων τῶν κτηνῶν καὶ πάσης τῆς γῆς καὶ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L28">Γεν 1:28</a>)</p></blockquote><blockquote><p>«καὶ <strong>εἶπεν ὁ θεός</strong> Ἰδοὺ δέδωκα ὑμῖν πᾶν χόρτον σπόριμον σπεῖρον σπέρμα, ὅ ἐστιν ἐπάνω πάσης τῆς γῆς, καὶ πᾶν ξύλον, ὃ ἔχει ἐν ἑαυτῷ καρπὸν σπέρματος σπορίμου — ὑμῖν ἔσται εἰς βρῶσιν —» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L29">Γεν 1:29</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἐνετείλατο κύριος ὁ θεὸς τῷ Αδαμ</strong> λέγων Ἀπὸ παντὸς ξύλου τοῦ ἐν τῷ παραδείσῳ βρώσει φάγῃ, ἀπὸ δὲ τοῦ ξύλου τοῦ γινώσκειν καλὸν καὶ πονηρόν, οὐ φάγεσθε ἀπ᾿ αὐτοῦ· ᾗ δ᾿ ἂν ἡμέρᾳ φάγητε ἀπ᾿ αὐτοῦ, θανάτῳ ἀποθανεῖσθε.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L16-17">Γεν 2:16-17</a>)</p></blockquote><p>Ωστόσο, για το Σάββατο δεν δίνεται καμία εντολή. Μετά από όλες τις ημέρες της δημιουργίας λέγεται ότι αναπαύθηκε ο Θεός, και όχι οι άνθρωποι. Τους ανθρώπους δε ο Θεός τους έθεσε στον κήπο της Εδέμ για εργασία:</p><blockquote><p>«καὶ πᾶν χλωρὸν ἀγροῦ πρὸ τοῦ γενέσθαι ἐπὶ τῆς γῆς καὶ πάντα χόρτον ἀγροῦ πρὸ τοῦ ἀνατεῖλαι· οὐ γὰρ ἔβρεξεν ὁ θεὸς ἐπὶ τὴν γῆν, καὶ ἄνθρωπος οὐκ ἦν ἐργάζεσθαι τὴν γῆν, &lt;…&gt; Καὶ ἐφύτευσεν κύριος ὁ θεὸς παράδεισον ἐν Εδεμ κατὰ ἀνατολὰς καὶ ἔθετο ἐκεῖ τὸν ἄνθρωπον, ὃν ἔπλασεν. &lt;…&gt; Καὶ ἔλαβεν κύριος ὁ θεὸς τὸν ἄνθρωπον, ὃν ἔπλασεν, καὶ ἔθετο αὐτὸν ἐν τῷ παραδείσῳ <strong>ἐργάζεσθαι</strong> αὐτὸν καὶ φυλάσσειν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L5,8,15">Γεν 2:5,8,15</a>)</p></blockquote><p>Σε εκείνη την αιώνια θεϊκή ανάπαυση, στην οποία βρίσκεται ο Θεός (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L3">Γεν 2:3</a>), οι άνθρωποι θα μπορέσουν να εισέλθουν μόνο στο μέλλον. Και μάλιστα, όχι όλοι, αλλά μόνο εκείνοι που θα αφήσει ο ίδιος ο Θεός να μπουν:</p><blockquote><p>«<strong>εἰσερχόμεθα γὰρ εἰς [τὴν] κατάπαυσιν οἱ πιστεύσαντες</strong>, καθὼς εἴρηκεν, Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, <strong>Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου</strong>, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/4/#L3">Εβρ 4:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/94/#L11">Ψλ 94:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/3/#L11">Εβρ 3:11</a>)</p></blockquote><h3>Η εμφάνιση της εντολής για την αποχή από τα έργα το Σάββατο</h3><p>Η εντολή για τη σαββατική ανάπαυση καθιερώθηκε για πρώτη φορά από τον Θεό στις ημέρες του προφήτη Μωυσή, κατά τη σύναψη της διαθήκης με τον λαό του Ισραήλ:</p><blockquote><p>«μνήσθητι τὴν ἡμέραν τῶν σαββάτων ἁγιάζειν αὐτήν. <strong>ἓξ ἡμέρας ἐργᾷ καὶ ποιήσεις πάντα τὰ ἔργα σου</strong>· <strong>τῇ δὲ ἡμέρᾳ τῇ ἑβδόμῃ</strong> σάββατα κυρίῳ τῷ θεῷ σου· <strong>οὐ ποιήσεις ἐν αὐτῇ πᾶν ἔργον</strong>, σὺ καὶ ὁ υἱός σου καὶ ἡ θυγάτηρ σου, ὁ παῖς σου καὶ ἡ παιδίσκη σου, ὁ βοῦς σου καὶ τὸ ὑποζύγιόν σου καὶ πᾶν κτῆνός σου καὶ ὁ προσήλυτος ὁ παροικῶν ἐν σοί.» <em>(</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L8-10"><em>Έξ 20:8-10</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L12-15"><em>Δτ 5:12-15</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L3"><em>Λευ 19:3</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30"><em>Λευ 19:30</em></a><em>)</em></p></blockquote><h3>Η αιτία της καθιέρωσης της εντολής για τη σαββατική ανάπαυση</h3><p>Η αιτία της εντολής δηλώνεται αμέσως μετά τα λόγια της εντολής. Η αιτία αυτή είναι: η έξοδος του λαού του Ισραήλ από την αιγυπτιακή αιχμαλωσία.</p><blockquote><p>«τῇ δὲ ἡμέρᾳ τῇ ἑβδόμῃ σάββατα κυρίῳ τῷ θεῷ σου, οὐ ποιήσεις ἐν αὐτῇ πᾶν ἔργον, σὺ καὶ οἱ υἱοί σου καὶ ἡ θυγάτηρ σου, ὁ παῖς σου καὶ ἡ παιδίσκη σου, ὁ βοῦς σου καὶ τὸ ὑποζύγιόν σου καὶ πᾶν κτῆνός σου καὶ ὁ προσήλυτος ὁ παροικῶν ἐν σοί, ἵνα ἀναπαύσηται ὁ παῖς σου καὶ ἡ παιδίσκη σου ὥσπερ καὶ σύ· καὶ μνησθήσῃ ὅτι <strong><mark>οἰκέτης ἦσθα</mark></strong> ἐν γῇ Αἰγύπτῳ καὶ <strong><mark>ἐξήγαγέν σε</mark></strong> κύριος ὁ θεός σου ἐκεῖθεν ἐν χειρὶ κραταιᾷ καὶ ἐν βραχίονι ὑψηλῷ, <strong><mark>διὰ τοῦτο συνέταξέν σοι</mark></strong> κύριος ὁ θεός σου ὥστε φυλάσσεσθαι τὴν ἡμέραν τῶν σαββάτων καὶ ἁγιάζειν αὐτήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L14-15">Δτ 5:14-15</a>)</p></blockquote><p>Τους έδωσε «σάββατα», δηλαδή έδωσε αυτό που πριν δεν υπήρχε:</p><blockquote><p>«καὶ <strong><mark>ἐξήγαγον αὐτοὺς</mark> ἐκ γῆς Αἰγύπτου</strong> καὶ ἤγαγον αὐτοὺς εἰς τὴν ἔρημον <strong>καὶ ἔδωκα αὐτοῖς τὰ προστάγματά</strong> μου καὶ τὰ δικαιώματά μου ἐγνώρισα αὐτοῖς, ὅσα ποιήσει αὐτὰ ἄνθρωπος καὶ ζήσεται ἐν αὐτοῖς. καὶ <strong><mark>τὰ σάββατά μου</mark> ἔδωκα αὐτοῖς</strong> τοῦ εἶναι εἰς σημεῖον ἀνὰ μέσον ἐμοῦ καὶ ἀνὰ μέσον αὐτῶν τοῦ γνῶναι αὐτοὺς διότι ἐγὼ κύριος ὁ ἁγιάζων αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/20/#L10-12">Ιεζ 20:10-12</a>)</p></blockquote><blockquote><p>«κύριος <strong>ὁ θεὸς ὑμῶν διέθετο πρὸς ὑμᾶς διαθήκην ἐν Χωρηβ. οὐχὶ τοῖς πατράσιν ὑμῶν διέθετο κύριος τὴν διαθήκην ταύτην, ἀλλ᾿ ἢ πρὸς ὑμᾶς</strong>, ὑμεῖς ὧδε πάντες ζῶντες σήμερον.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L2-3">Δτ 5:2-3</a>)</p></blockquote><p>Υπάρχει επίσης και άλλη εξήγηση, που δείχνει την ευλογία του Θεού στην έβδομη ημέρα:</p><blockquote><p>«τῇ δὲ ἡμέρᾳ τῇ ἑβδόμῃ σάββατα κυρίῳ τῷ θεῷ σου· οὐ ποιήσεις ἐν αὐτῇ πᾶν ἔργον, σὺ καὶ ὁ υἱός σου καὶ ἡ θυγάτηρ σου, ὁ παῖς σου καὶ ἡ παιδίσκη σου, ὁ βοῦς σου καὶ τὸ ὑποζύγιόν σου καὶ πᾶν κτῆνός σου καὶ ὁ προσήλυτος ὁ παροικῶν ἐν σοί. ἐν <strong>γὰρ</strong> ἓξ ἡμέραις ἐποίησεν κύριος τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς καὶ <strong>κατέπαυσεν τῇ ἡμέρᾳ τῇ ἑβδόμῃ· διὰ τοῦτο <mark>εὐλόγησεν</mark></strong> κύριος τὴν ἡμέραν τὴν ἑβδόμην καὶ ἡγίασεν αὐτήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L10-11">Έξ 20:10-11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L3">Γεν 2:3</a>)</p></blockquote><p>Ωστόσο, η εξήγηση αυτή, μολονότι δείχνει τη σχέση, εδώ παρουσιάζει την αιτία της ευλογίας του Σαββάτου: «<strong>γι’ αυτό ευλόγησε</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L10-11">Έξ 20:10-11</a>), και όχι την αιτία της εντολής. Σε άλλο δε στίχο με τον πιο σαφή τρόπο παρουσιάζεται η αιτία της εντολής: «<strong>ήσουν δούλος … σε έβγαλε … γι’ αυτό και πρόσταξε</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L14-15">Δτ 5:14-15</a>).</p><p>Έτσι, η σαββατική ανάπαυση καθιερώνεται εξαιτίας της απελευθέρωσης του λαού του Ισραήλ από την αιγυπτιακή αιχμαλωσία, μολονότι δηλώνεται και η σχέση με τη θεϊκή ανάπαυση.</p><h3>Ο νόμος των εντολών καταργήθηκε</h3><p>Ο νόμος δόθηκε μέχρι τον καιρό της έλευσης του Χριστού:</p><blockquote><p><em>«Τί οὖν ὁ </em><strong><em><mark>νόμος</mark></em></strong><em>; τῶν παραβάσεων χάριν </em><strong><em><mark>προσετέθη</mark></em></strong><em>, </em><strong><em><mark>ἄχρις οὗ ἔλθῃ</mark> τὸ σπέρμα</em></strong><em> ᾧ ἐπήγγελται, διαταγεὶς δι᾿ ἀγγέλων ἐν χειρὶ μεσίτου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L19"><em>Γαλ 3:19</em></a><em>)</em></p></blockquote><p>Ο νόμος των εντολών καταργήθηκε με τη διδασκαλία του Χριστού:</p><blockquote><p><em>«Αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν, ἐν τῇ σαρκὶ αὐτοῦ, </em><strong><em><mark>τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν</mark></em></strong><em> </em><strong><em><mark>καταργήσας</mark></em></strong><em>, ἵνα τοὺς δύο κτίσῃ ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην, καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ, ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L14-16"><em>Εφ 2:14-16</em></a><em>)</em></p></blockquote><p>Οι χριστιανοί ελευθερώθηκαν από τον νόμο:</p><blockquote><p><em>«νυνὶ δὲ </em><strong><em><mark>κατηργήθημεν ἀπὸ τοῦ νόμου</mark></em></strong><em>, </em><strong><em><mark>ἀποθανόντες ἐν ᾧ</mark> κατειχόμεθα</em></strong><em>, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ </em><strong><em>οὐ παλαιότητι γράμματος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L6"><em>Ρωμ 7:6</em></a><em>)</em></p></blockquote><p>Λεπτομερής εξήγηση για την κατάργηση του Νόμου του Μωυσή: <a href="https://bibleox.com/el/el/w/Η_κατάργηση_του_Νόμου_του_Μωυσή">https://bibleox.com/el/el/w/Η_κατάργηση_του_Νόμου_του_Μωυσή</a></p><h3>Ο Χριστός υπεράσπισε τους αποστόλους από τις κατηγορίες για παράβαση της σαββατικής ανάπαυσης</h3><p>Οι Φαρισαίοι κατηγορούν τον Κύριο και τους αποστόλους για παράβαση της σαββατικής ανάπαυσης. Ο Χριστός ονομάζει τους αποστόλους αθώους:</p><blockquote><p>«οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ, <strong>Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ</strong>. &lt;…&gt; <strong>εἰ δὲ ἐγνώκειτε</strong> τί ἐστιν, Ἔλεος θέλω καὶ οὐ θυσίαν, <strong>οὐκ ἂν κατεδικάσατε τοὺς <mark>ἀναιτίους</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L2,7">Μτ 12:2,7</a>)</p></blockquote><h3>Ο απόστολος απαγορεύει να κατακρίνονται οι χριστιανοί για τη μη τήρηση της σαββατικής ανάπαυσης</h3><blockquote><p>«<strong>Μὴ οὖν τις <mark>ὑμᾶς κρινέτω</mark></strong> ἐν βρώσει καὶ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νεομηνίας ἢ <strong><mark>σαββάτων</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L16">Κολ 2:16</a>)</p></blockquote><h2>Η Κυριακή</h2><h3>Η ημέρα της εμφάνισης του Κυρίου</h3><ol><li><p>Ο Κύριος Ιησούς Χριστός αναστήθηκε και εμφανίστηκε στους μαθητές χωρίς τον Θωμά την πρώτη ημέρα της εβδομάδας — την Κυριακή (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L19">Ιω 20:19</a>).</p></li><li><p>Την Κυριακή εμφανίστηκε στις μυροφόρες (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L1,9">Μτ 28:1,9</a>), στη Μαρία τη Μαγδαληνή (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L9">Μκ 16:9</a>), στον απόστολο Πέτρο (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L34">Λκ 24:34</a>), στους αποστόλους Κλεόπα και Λουκά (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L13-32">Λκ 24:13-32</a>).</p></li><li><p>Για χάρη του Θωμά ο Σωτήρας εμφανίζεται πάλι ακριβώς μετά από μία εβδομάδα, και πάλι την Κυριακή (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L26">Ιω 20:26</a>).</p></li></ol><h3>Η ημέρα της σύναξης και της τέλεσης της Ευχαριστίας</h3><p>Οι απόστολοι, βρισκόμενοι στην Τρωάδα για μία εβδομάδα, από τις επτά ημέρες συνέρχονται για λατρεία και κλάση του άρτου όχι το Σάββατο, αλλά την Κυριακή:</p><blockquote><p>«ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, οὗ <strong>διετρίψαμεν ἡμέρας ἑπτά</strong>. Ἐν δὲ <strong>τῇ μιᾷ τῶν σαββάτων</strong> συνηγμένων ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου. ἦσαν δὲ <strong>λαμπάδες ἱκαναὶ</strong> ἐν τῷ ὑπερῴῳ οὗ ἦμεν συνηγμένοι· καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός. καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν, Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν. ἀναβὰς δὲ καὶ κλάσας τὸν ἄρτον καὶ γευσάμενος ἐφ᾿ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς οὕτως ἐξῆλθεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L6-11">Πραξ 20:6-11</a>)</p></blockquote><p>Ο απόστολος ζητά την Κυριακή (ημέρα σύναξης) να αποταμιεύει κανείς λίγα χρήματα για βοήθεια σε όσους έχουν ανάγκη:</p><blockquote><p>«<strong>κατὰ μίαν σαββάτου ἕκαστος ὑμῶν παρ᾿ ἑαυτῷ τιθέτω θησαυρίζων</strong> ὅ τι ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/16/#L2">Α Κορ 16:2</a>)</p></blockquote><h2>Κριτική</h2><p>Ορισμένες κοινότητες, αποκομμένες από την Εκκλησία (κυρίως η αίρεση των Αντβεντιστών της Εβδόμης Ημέρας), παρά την εντολή (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L16">Κολ 2:16</a>), κατηγορούν την Εκκλησία όχι μόνο για τη μη τήρηση της σαββατικής ανάπαυσης, αλλά και για την πιο πανηγυρική γιορτή της Κυριακής, λέγοντας ότι δεν πρέπει να τη γιορτάζουν.</p><p>Στην Ορθόδοξη Εκκλησία ο άνθρωπος καλείται στα καλά έργα όλες τις ημέρες της ζωής του, ενώ οι ξεχωριστές ημέρες (Σάββατο και ιδιαίτερα Κυριακή) γιορτάζονται με την τέλεση όχι μόνο προσωπικού καλού έργου, αλλά και <strong>κοινού έργου</strong>, δηλαδή η Κυριακή γιορτάζεται με κοινή σύναξη για λατρεία. Ακολουθίες τελούνται και τις άλλες ημέρες, αλλά το Σάββατο και ιδιαίτερα την Κυριακή τελούνται ειδικές, πιο πανηγυρικές ακολουθίες.</p><p>Για τους χριστιανούς το σημαντικότερο γεγονός είναι το Πάσχα του Χριστού — η Ανάσταση του Κυρίου Ιησού Χριστού από τους νεκρούς. Η ημέρα αυτή ονομάζεται γιορτή των γιορτών και πανήγυρις πανηγύρεων, διότι:</p><blockquote><p>«εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ἄρα [καὶ] τὸ κήρυγμα ἡμῶν, κενὴ καὶ ἡ πίστις ὑμῶν, &lt;…&gt; <strong>εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ὑμῶν</strong>, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L14,17">Α Κορ 15:14,17</a>)</p></blockquote><p>Όπως έχει ήδη δειχθεί πιο πάνω, οι απόστολοι τελούσαν τη λατρεία ακριβώς την Κυριακή. Η ημέρα αυτή έγινε χαρούμενη ημέρα συνάντησης με τον αναστημένο Κύριο. Το ίδιο έκαναν και οι πρώτοι χριστιανοί.</p><p>Επίσης, κατηγορούν τον αυτοκράτορα Κωνσταντίνο (4ος αιώνας) ότι δήθεν μετέφερε την ημέρα αργίας από το Σάββατο στην Κυριακή (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L6-11">Πραξ 20:6-11</a>). Ωστόσο, ο αυτοκράτορας Κωνσταντίνος καθιέρωσε την πρώτη ημέρα αργίας στην εβδομάδα — την Κυριακή, χωρίς να δώσει καμία οδηγία για το Σάββατο (βλ. την αντίστοιχη ρωσική σελίδα). Πριν από το διάταγμα αυτό στη Ρωμαϊκή Αυτοκρατορία δεν υπήρχαν γενικές εβδομαδιαίες ημέρες αργίας.</p><p>Έτσι, η κριτική είναι, για να το πούμε ήπια, αβάσιμη.</p>'
