  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Όλα τα έθνη καλούνται στην πίστη στον Χριστό — μαρτυρίες της Καινής Διαθήκης</h2><p>Ο Χριστός στέλνει τους αποστόλους να κηρύξουν το Ευαγγέλιο σε όλα τα έθνη, σε κάθε φυλή και γλώσσα, σε όλη την οικουμένη:</p><blockquote><p>«<strong>πορευθέντες οὖν μαθητεύσατε πάντα τὰ ἔθνη, βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος, διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν</strong>· καὶ ἰδοὺ ἐγὼ μεθ᾿ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ αἰῶνος.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L19-20">Μτ 28:19-20</a>)</p></blockquote><blockquote><p>«δι᾿ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν <strong>εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L5">Ρωμ 1:5</a>)</p></blockquote><blockquote><p>«Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ <strong>εὐαγγέλιόν</strong> μου καὶ τὸ <strong>κήρυγμα</strong> Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου φανερωθέντος δὲ νῦν διά τε γραφῶν προφητικῶν κατ᾿ ἐπιταγὴν τοῦ αἰωνίου θεοῦ <strong>εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L25-26">Ρωμ 16:25-26</a>)</p></blockquote><blockquote><p>«καὶ <strong>κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν</strong>, καὶ τότε ἥξει τὸ τέλος.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L14">Μτ 24:14</a>)</p></blockquote><blockquote><p>«Καὶ εἶδον ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον <strong>εὐαγγελίσαι ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L6">Απ 14:6</a>)</p></blockquote><h2>Όλα τα έθνη καλούνται στην πίστη στον Χριστό — μαρτυρίες της Παλαιάς Διαθήκης</h2><p>Η υπόσχεση στον Αβραάμ ότι στο σπέρμα του (μέσω ενός από τους απογόνους του) θα ευλογηθούν όλα τα έθνη:</p><blockquote><p>«καὶ ἐνευλογηθήσονται ἐν τῷ σπέρματί σου <strong>πάντα τὰ ἔθνη</strong> τῆς γῆς, ἀνθ᾿ ὧν ὑπήκουσας τῆς ἐμῆς φωνῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/22/#L18">Γεν 22:18</a>)</p></blockquote><p>Προφητείες ότι όλα τα έθνη θα στραφούν στον αληθινό Θεό:</p><blockquote><p>«<strong>πάντα τὰ ἔθνη</strong>, ὅσα ἐποίησας, ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, κύριε, καὶ δοξάσουσιν τὸ ὄνομά σου» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/85/#L9">Ψλ 85:9</a>)</p></blockquote><blockquote><p>«καὶ προσκυνήσουσιν αὐτῷ πάντες οἱ βασιλεῖς, <strong>πάντα τὰ ἔθνη</strong> δουλεύσουσιν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/71/#L11">Ψλ 71:11</a>)</p></blockquote><blockquote><p>«ἔστω τὸ ὄνομα αὐτοῦ <em>εὐλογημένον</em> εἰς τοὺς αἰῶνας, πρὸ τοῦ ἡλίου διαμενεῖ τὸ ὄνομα αὐτοῦ· καὶ εὐλογηθήσονται ἐν αὐτῷ <strong><em>πᾶσαι αἱ φυλαὶ τῆς γῆς</em>, πάντα τὰ ἔθνη</strong> μακαριοῦσιν αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/71/#L17">Ψλ 71:17</a>)</p></blockquote><blockquote><p>«Αἰνεῖτε τὸν κύριον, <strong>πάντα τὰ ἔθνη</strong>, ἐπαινέσατε αὐτόν, πάντες οἱ λαοί» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/116/#L1">Ψλ 116:1</a>)</p></blockquote><blockquote><p>«ἔρχομαι συναγαγεῖν <strong>πάντα τὰ ἔθνη καὶ τὰς γλώσσας</strong>, καὶ ἥξουσιν καὶ ὄψονται τὴν δόξαν μου. καὶ καταλείψω ἐπ᾿ αὐτῶν σημεῖα καὶ ἐξαποστελῶ ἐξ αὐτῶν σεσῳσμένους εἰς τὰ ἔθνη, εἰς Θαρσις καὶ Φουδ καὶ Λουδ καὶ Μοσοχ καὶ Θοβελ καὶ εἰς τὴν Ἑλλάδα καὶ εἰς τὰς νήσους τὰς πόρρω, οἳ οὐκ ἀκηκόασίν μου τὸ ὄνομα οὐδὲ ἑωράκασιν τὴν δόξαν μου, καὶ ἀναγγελοῦσίν μου τὴν δόξαν ἐν τοῖς ἔθνεσιν. καὶ ἄξουσιν τοὺς ἀδελφοὺς ὑμῶν <strong>ἐκ πάντων τῶν ἐθνῶν</strong> δῶρον κυρίῳ μεθ᾿ ἵππων καὶ ἁρμάτων ἐν λαμπήναις ἡμιόνων μετὰ σκιαδίων εἰς τὴν ἁγίαν πόλιν Ιερουσαλημ, εἶπεν κύριος, ὡς ἂν ἐνέγκαισαν οἱ υἱοὶ Ισραηλ ἐμοὶ τὰς θυσίας αὐτῶν μετὰ ψαλμῶν εἰς τὸν οἶκον κυρίου. <strong>καὶ ἀπ᾿ αὐτῶν λήμψομαι ἐμοὶ ἱερεῖς</strong> καὶ Λευίτας, εἶπεν κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L18-21">Ησ 66:18-21</a>)</p></blockquote><blockquote><p>«ἐπιστράφητε πρός με καὶ <strong>σωθήσεσθε, οἱ ἀπ᾿ ἐσχάτου τῆς γῆς</strong>· ἐγώ εἰμι ὁ θεός, καὶ οὐκ ἔστιν ἄλλος.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L22">Ησ 45:22</a>)</p></blockquote><blockquote><p>«ἰδοὺ τέθεικά σε εἰς διαθήκην γένους εἰς φῶς ἐθνῶν τοῦ εἶναί σε <strong>εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/49/#L6">Ησ 49:6</a>)</p></blockquote><blockquote><p>«τοῦ γνῶναι ἐν τῇ γῇ τὴν ὁδόν σου, <strong>ἐν πᾶσιν ἔθνεσιν τὸ σωτήριόν σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/66/#L2">Ψλ 66:2</a>)</p></blockquote><blockquote><p>«καὶ ἐδόθη αὐτῷ ἐξουσία, καὶ <strong>πάντα τὰ ἔθνη τῆς γῆς κατὰ γένη</strong> καὶ πᾶσα δόξα αὐτῷ λατρεύουσα· καὶ ἡ ἐξουσία αὐτοῦ ἐξουσία αἰώνιος, ἥτις οὐ μὴ ἀρθῇ, καὶ ἡ βασιλεία αὐτοῦ, ἥτις οὐ μὴ φθαρῇ. —» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/7/#L14">Δν 7:14</a>)</p></blockquote><blockquote><p>«ἀναγγείλατε ἐν τοῖς ἔθνεσιν τὴν δόξαν αὐτοῦ, <strong>ἐν πᾶσι τοῖς λαοῖς</strong> τὰ θαυμάσια αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/95/#L3">Ψλ 95:3</a>)</p></blockquote><blockquote><p>«ὅπως γνῶσιν <strong>πάντες οἱ λαοὶ</strong> τῆς γῆς ὅτι κύριος ὁ θεός, αὐτὸς θεὸς καὶ οὐκ ἔστιν ἔτι.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L60">Γ Βασ 8:60</a>)</p></blockquote><blockquote><p>«καὶ συσσείσω πάντα τὰ ἔθνη, καὶ <strong>ἥξει τὰ ἐκλεκτὰ πάντων τῶν ἐθνῶν</strong>, καὶ πλήσω τὸν οἶκον τοῦτον δόξης, λέγει κύριος παντοκράτωρ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ag/2/#L7">Αγγ 2:7</a>)</p></blockquote><blockquote><p>«καὶ ὡς γῆν αὔξουσαν τὸ ἄνθος αὐτῆς καὶ ὡς κῆπος τὰ σπέρματα αὐτοῦ, οὕτως <strong>ἀνατελεῖ κύριος δικαιοσύνην καὶ ἀγαλλίαμα ἐναντίον πάντων τῶν ἐθνῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/61/#L11">Ησ 61:11</a>)</p></blockquote><h2>Οι πίστεις των άλλων εθνών δεν είναι σωτήριες</h2><p>Η αποστολική πίστη στον Ιησού Χριστό είναι σωτήρια. Οι πίστεις των άλλων εθνών δεν είναι σωτήριες:</p><blockquote><p>«ὃς ἐν ταῖς παρῳχημέναις γενεαῖς <strong>εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/14/#L16">Πραξ 14:16</a>)</p></blockquote><p>Περισσότερα: <a href="https://bibleox.com/el/el/w/Ο_Θεός_είναι_ένας">οι θεοί των άλλων εθνών δεν είναι θεοί</a></p><p>Παράλληλα, η αποστολική πίστη στον Ιησού Χριστό και η σωτηρία μέσω αυτής της πίστης είναι ανοιχτή σε όλους τους ανθρώπους χωρίς εξαίρεση.</p>'
