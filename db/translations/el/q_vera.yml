  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Γίνεται λόγος για εκείνους που θέλουν αλλά δεν μπορούν να αποκτήσουν παιδιά εξαιτίας της στειρότητας:</p><blockquote><p>«ὅτι <strong>μακαρία στεῖρα</strong> ἡ ἀμίαντος, ἥτις οὐκ ἔγνω κοίτην ἐν παραπτώματι, <strong>ἕξει καρπὸν ἐν ἐπισκοπῇ ψυχῶν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/3/#L13">Σ.Σολ 3:13</a>)</p></blockquote><blockquote><p>«κρείσσων <strong>ἀτεκνία μετὰ ἀρετῆς</strong>· <strong>ἀθανασία γάρ ἐστιν ἐν μνήμῃ αὐτῆς, ὅτι καὶ παρὰ θεῷ γινώσκεται</strong> καὶ παρὰ ἀνθρώποις.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/4/#L1">Σ.Σολ 4:1</a>)</p></blockquote>
- src: предопределение
  path: Ο_προορισμός_η_μοίρα
  title: Ο προορισμός (η μοίρα)
  title_sub:
  meta_desc: Βιβλικές ρήσεις για τον προορισμό ή αλλιώς τη μοίρα.
  copy_cover: true
  menu:
    parent: Εκκλησία/Πίστη
    title: Ο προορισμός (η μοίρα)
    priority: 8
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο Θεός θέλει να σωθούν όλοι οι άνθρωποι</h2><blockquote><p>«τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν <strong><mark>θεοῦ, ὃς</mark> πάντας ἀνθρώπους <u><mark>θέλει</mark></u> <mark>σωθῆναι</mark></strong> καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L3-4">Α Τιμ 2:3-4</a>)</p></blockquote><blockquote><p>«ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι <strong><u><mark>τὸ χρηστὸν τοῦ θεοῦ</mark></u> <mark>εἰς μετάνοιάν</mark> <u><mark>σε ἄγει</mark></u></strong>; <strong><mark>κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν</mark> <u><mark>θησαυρίζεις σεαυτῷ ὀργὴν</mark></u> <mark>ἐν ἡμέρᾳ ὀργῆς</mark></strong> καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ, ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ, τοῖς μὲν καθ᾿ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν, ζωὴν αἰώνιον· τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ, ὀργὴ καὶ θυμός —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L4-8">Ρωμ 2:4-8</a>)</p></blockquote><h2>Η σωτηρία δεν επιβάλλεται, αλλά αποκαλύπτεται σ’ εκείνους που Τον ζητούν</h2><blockquote><p>«χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ <strong><mark>τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L6">Εβρ 11:6</a>)</p></blockquote><blockquote><p><em>«</em><strong><em>ἐξεζήτησα τὸν κύριον, καὶ ἐπήκουσέν μου</em></strong><em> καὶ ἐκ πασῶν τῶν παροικιῶν μου ἐρρύσατό με. </em><strong><em><mark>προσέλθατε πρὸς αὐτὸν καὶ φωτίσθητε</mark></em></strong><em>, καὶ τὰ πρόσωπα ὑμῶν οὐ μὴ καταισχυνθῇ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L4-5"><em>Ψλ 33:4-5</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐγὼ τοὺς ἐμὲ φιλοῦντας ἀγαπῶ, </em><strong><em><mark>οἱ δὲ ἐμὲ ζητοῦντες εὑρήσουσιν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/pr/8/#L17"><em>Πρμ 8:17</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ νῦν, Σαλωμων υἱέ μου, γνῶθι τὸν θεὸν τῶν πατέρων σου καὶ δούλευε αὐτῷ ἐν καρδίᾳ τελείᾳ καὶ ψυχῇ θελούσῃ, ὅτι πάσας καρδίας ἐτάζει κύριος καὶ πᾶν ἐνθύμημα γιγνώσκει· </em><strong><em><mark>ἐὰν ζητήσῃς αὐτόν, εὑρεθήσεταί σοι</mark></em></strong><em>, καὶ ἐὰν καταλείψῃς αὐτόν, καταλείψει σε εἰς τέλος.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1par/28/#L9"><em>Α Παρ 28:9</em></a><em>)</em></p></blockquote><blockquote><p>«ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει; κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας <strong><mark>τοῦ θεοῦ, ὃς ἀποδώσει</mark></strong> ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ, <strong><u><mark>τοῖς μὲν</mark></u> <mark>καθ᾿ ὑπομονὴν ἔργου ἀγαθοῦ</mark> <u><mark>δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν</mark></u> <mark>ζητοῦσιν</mark>, <u><mark>ζωὴν αἰώνιον</mark></u>· τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσι τῇ ἀληθείᾳ</strong> πειθομένοις δὲ τῇ ἀδικίᾳ, <strong>ὀργὴ καὶ θυμός</strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L4-8">Ρωμ 2:4-8</a>)</p></blockquote><h2>Ο Θεός λυπάται για την απώλεια των αμαρτωλών και προσπαθεί να σώσει όσο το δυνατόν περισσότερους</h2><blockquote><p>«<strong><u><mark>μὴ θελήσει θελήσω</mark></u> <mark>τὸν θάνατον τοῦ ἀνόμου</mark></strong>, λέγει κύριος, <strong><mark>ὡς τὸ ἀποστρέψαι αὐτὸν ἐκ τῆς ὁδοῦ τῆς πονηρᾶς καὶ ζῆν αὐτόν</mark></strong>; &lt;…&gt; καὶ εἴπατε Οὐ κατευθύνει ἡ ὁδὸς κυρίου. ἀκούσατε δή, πᾶς οἶκος Ισραηλ· <strong>μὴ ἡ ὁδός μου οὐ κατευθύνει; οὐχὶ ἡ ὁδὸς ὑμῶν οὐ κατευθύνει</strong>; &lt;…&gt; ἕκαστον κατὰ τὴν ὁδὸν αὐτοῦ κρινῶ ὑμᾶς, οἶκος Ισραηλ, λέγει κύριος· <strong><mark>ἐπιστράφητε καὶ ἀποστρέψατε ἐκ πασῶν τῶν ἀσεβειῶν ὑμῶν, καὶ οὐκ ἔσονται ὑμῖν εἰς κόλασιν ἀδικίας</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/18/#L23,25,30">Ιεζ 18:23,25,30</a>)</p></blockquote><blockquote><p>«εἰπὸν αὐτοῖς Ζῶ ἐγώ, τάδε λέγει κύριος <strong><u><mark>Οὐ βούλομαι</mark></u> <mark>τὸν θάνατον τοῦ ἀσεβοῦς ὡς τὸ ἀποστρέψαι τὸν ἀσεβῆ ἀπὸ τῆς ὁδοῦ αὐτοῦ καὶ ζῆν αὐτόν</mark></strong>. ἀποστροφῇ ἀποστρέψατε ἀπὸ τῆς ὁδοῦ ὑμῶν· καὶ <strong><mark>ἵνα τί ἀποθνῄσκετε</mark></strong>, οἶκος Ισραηλ;» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/33/#L11">Ιεζ 33:11</a>)</p></blockquote><blockquote><p>«καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς, <strong>Οὐ <mark>χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ</mark> ἀλλὰ <mark>οἱ κακῶς ἔχοντες</mark>· οὐκ <mark>ἐλήλυθα καλέσαι</mark> δικαίους ἀλλὰ <mark>ἁμαρτωλοὺς εἰς μετάνοιαν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/5/#L31-32">Λκ 5:31-32</a>)</p></blockquote><blockquote><p>«<strong><mark>οὐ βραδύνει κύριος</mark></strong> τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, <strong><mark>ἀλλὰ μακροθυμεῖ εἰς ὑμᾶς</mark>, <u><mark>μὴ βουλόμενός</mark></u> <mark>τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L9">Β Πε 3:9</a>)</p></blockquote><h2>Ο άνθρωπος χάνεται από τη δική του απροθυμία να στρέψει τη θέλησή του στον Θεό</h2><blockquote><p>«Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν, <strong><mark>ποσάκις</mark> <u><mark>ἠθέλησα</mark></u> <mark>ἐπισυναγαγεῖν</mark></strong> τὰ τέκνα σου, ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας, <strong><mark>καὶ</mark> <u><mark>οὐκ ἠθελήσατε</mark></u><mark>.</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L37">Μτ 23:37</a>)</p></blockquote><blockquote><p>«αὕτη δέ ἐστιν ἡ κρίσις, ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ <strong><mark>ἠγάπησαν</mark> <u><mark>οἱ ἄνθρωποι μᾶλλον</mark></u> <mark>τὸ σκότος ἢ τὸ φῶς</mark></strong>, ἦν γὰρ αὐτῶν πονηρὰ τὰ ἔργα. <strong><mark>πᾶς γὰρ ὁ φαῦλα πράσσων</mark> <u><mark>μισεῖ</mark></u> <mark>τὸ φῶς καὶ</mark> <u><mark>οὐκ ἔρχεται</mark></u> <mark>πρὸς τὸ φῶς</mark></strong>, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ· ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L19-21">Ιω 3:19-21</a>)</p></blockquote><blockquote><p>«ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι <strong><mark>τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει</mark></strong>; <strong><mark>κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς</mark> καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ</strong>, ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ, τοῖς μὲν καθ᾿ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν, ζωὴν αἰώνιον· τοῖς δὲ <strong><mark>ἐξ ἐριθείας καὶ ἀπειθοῦσι τῇ ἀληθείᾳ</mark></strong> πειθομένοις δὲ τῇ ἀδικίᾳ, ὀργὴ καὶ θυμός —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L4-8">Ρωμ 2:4-8</a>)</p></blockquote><h2>Ο Θεός προόρισε για σωτηρία εκείνους που <strong>προγνώρισε</strong> (δηλαδή γνώριζε εκ των προτέρων ότι θα Τον επιλέξουν)</h2><p>Ο προορισμός δεν γίνεται χωρίς να λαμβάνονται υπόψη τα έργα του ανθρώπου, τα οποία ο Θεός, όντας έξω από τον χρόνο, γνωρίζει εκ των προτέρων, και ακριβώς με βάση αυτή τη γνώση (την πρόγνωση) προορίζει. Αυτό είναι το κρίσιμο σημείο. Ο προορισμός δεν γίνεται τυχαία, αλλά ακριβώς με βάση τις πράξεις κάθε ανθρώπου, τις οποίες ο Θεός γνωρίζει <strong>πριν</strong> από την τέλεσή τους, όντας έξω από τον χρόνο:</p><blockquote><p>«ὅτι <strong>οὓς <mark>προέγνω</mark>, καὶ <mark>προώρισεν</mark></strong> συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς· <strong>οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν</strong>· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L29-30">Ρωμ 8:29-30</a>)</p></blockquote><blockquote><p>«Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας, <strong><mark>κατὰ πρόγνωσιν</mark> θεοῦ πατρός</strong>, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L1-2">Α Πε 1:1-2</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἄνθρωποι πάντες ἀπὸ ἐδάφους</strong>, καὶ ἐκ γῆς ἐκτίσθη Αδαμ· <strong>ἐν <mark>πλήθει ἐπιστήμης</mark> κύριος</strong> διεχώρισεν αὐτοὺς καὶ <strong><mark>ἠλλοίωσεν</mark> τὰς ὁδοὺς αὐτῶν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/33/#L10-11">Σ.Σειρ 33:10-11</a>)</p></blockquote><blockquote><p>«ἀκούοντα δὲ τὰ ἔθνη ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ κυρίου, καὶ <strong>ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L48">Πραξ 13:48</a>)</p></blockquote><h2>Η μοίρα του ανθρώπου βρίσκεται στα χέρια του Θεού</h2><blockquote><p>«ἡ δικαιοσύνη σου ὡσεὶ ὄρη θεοῦ, <strong><mark>τὰ κρίματά σου</mark> ἄβυσσος πολλή</strong>· ἀνθρώπους καὶ κτήνη σώσεις, κύριε.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/35/#L6">Ψλ 35:6</a>)</p></blockquote><blockquote><p>«<strong>παρὰ κυρίου εὐθύνεται <mark>τὰ διαβήματα ἀνδρί</mark></strong>· θνητὸς δὲ πῶς ἂν νοήσαι τὰς ὁδοὺς αὐτοῦ;» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/20/#L24">Πρμ 20:24</a>)</p></blockquote><blockquote><p>«πολλοὶ θεραπεύουσιν πρόσωπα ἡγουμένων, <strong><mark>παρὰ δὲ κυρίου</mark> γίνεται τὸ δίκαιον ἀνδρί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/29/#L26">Πρμ 29:26</a>)</p></blockquote><blockquote><p>«ὡς πηλὸς κεραμέως ἐν χειρὶ αὐτοῦ — <strong>πᾶσαι <mark>αἱ ὁδοὶ αὐτοῦ</mark> κατὰ τὴν εὐδοκίαν αὐτοῦ</strong> — , οὕτως <strong>ἄνθρωποι ἐν χειρὶ τοῦ ποιήσαντος</strong> αὐτοὺς ἀποδοῦναι αὐτοῖς κατὰ τὴν κρίσιν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/33/#L13">Σ.Σειρ 33:13</a>)</p></blockquote><blockquote><p>«καὶ ταῦτα παρὰ κυρίου σαβαωθ <strong>ἐξῆλθεν <mark>τὰ τέρατα</mark></strong>· βουλεύσασθε, ὑψώσατε ματαίαν παράκλησιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/28/#L29">Ησ 28:29</a>)</p></blockquote><blockquote><p>«Ὢ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· <strong>ὡς ἀνεξεραύνητα <mark>τὰ κρίματα</mark> αὐτοῦ</strong> καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L33">Ρωμ 11:33</a>)</p></blockquote><h2>Τα πάθη του σταυρού του Ιησού Χριστού τα προόρισε ο Θεός</h2><blockquote><p>«συνήχθησαν γὰρ ἐπ᾿ ἀληθείας ἐν τῇ πόλει ταύτῃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ, ποιῆσαι <strong>ὅσα</strong> <strong><mark>ἡ χείρ σου</mark> καὶ ἡ βουλή σου προώρισεν</strong> γενέσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L27-28">Πραξ 4:27-28</a>)</p></blockquote><h2>Ο Θεός προεξέλεξε τον απόστολο Παύλο</h2><blockquote><p>«ὁ δὲ εἶπεν, Ὁ θεὸς τῶν πατέρων ἡμῶν <strong><mark>προεχειρίσατό</mark></strong> σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L14">Πραξ 22:14</a>)</p></blockquote><h2>Κριτική</h2><h3>Ο Θεός δεν είναι παντοδύναμος, αν θέλει να σωθούν όλοι, αλλά δεν σώζονται όλοι</h3><p>Η αγάπη είναι ελεύθερο συναίσθημα: με το ζόρι δεν αγαπιέσαι. Ο Θεός θέλει τα δημιουργήματά Του να μπορούν να αγαπήσουν τον Θεό, γι’ αυτό τους δίνει τη δυνατότητα να επιλέξουν ελεύθερα ή να μην επιλέξουν τον Θεό: να Τον αγαπήσουν ή να Τον μισήσουν.</p><p>Μπορεί ο Θεός να σώσει όλους; Μπορεί. Θέλει ο Θεός να σωθούν όλοι; Θέλει, αλλά με συγκεκριμένη ποιότητα, έχοντας αγάπη προς τον Θεό. Ο Θεός δεν θέλει να καταδικάσει σε αιώνια ζωή μαζί Του εκείνους που μισούν τον Θεό. Γι’ αυτό και δεν κάνει αυτό που δεν θέλει. Κάνει αυτό τον Θεό μη παντοδύναμο; — όχι, γιατί ο Θεός δεν θέλει να εξαναγκάσει κανέναν να αγαπήσει.</p><p>Μπορεί ο Θεός της αγάπης να δώσει στους ανθρώπους τη δυνατότητα να αγαπήσουν ή να μισήσουν ελεύθερα Αυτόν; Μπορεί. Και αν δεν μπορούσε να δώσει ελευθερία επιλογής, θα ήταν παντοδύναμος;</p>'
