  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Ο Αβραάμ έγινε δίκαιος χωρίς τον Νόμο και πριν ακόμη από την περιτομή:</p><blockquote>«καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων, Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· μακάριος ἀνὴρ οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν. ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν γάρ, Ἐλογίσθη τῷ <b>Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην. πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ᾿ ἐν ἀκροβυστίᾳ</b>· καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν <b>πατέρα πάντων τῶν πιστευόντων δι᾿ ἀκροβυστίας</b>, εἰς τὸ λογισθῆναι αὐτοῖς [τὴν] δικαιοσύνην, καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ἐν ἀκροβυστίᾳ πίστεως τοῦ πατρὸς ἡμῶν Ἀβραάμ. <b>Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως</b>· εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία· ὁ γὰρ νόμος ὀργὴν κατεργάζεται· οὗ δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις. διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, <b>εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ [ὅς ἐστιν πατὴρ πάντων ἡμῶν, καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε] κατέναντι οὗ ἐπίστευσεν θεοῦ</b> τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/4/#L6-17">Ρωμ 4:6-17</a>)</blockquote><blockquote>«Ἐγένετο δὲ Αβραμ ἐτῶν ἐνενήκοντα ἐννέα, καὶ ὤφθη κύριος τῷ Αβραμ καὶ εἶπεν αὐτῷ Ἐγώ εἰμι ὁ θεός σου· εὐαρέστει ἐναντίον ἐμοῦ καὶ γίνου ἄμεμπτος, &lt;…&gt; Καὶ ἐγὼ ἰδοὺ ἡ διαθήκη μου μετὰ σοῦ, καὶ <b>ἔσῃ πατὴρ πλήθους ἐθνῶν</b>. καὶ οὐ κληθήσεται ἔτι τὸ ὄνομά σου Αβραμ, ἀλλ᾿ ἔσται τὸ ὄνομά σου Αβρααμ, ὅτι <b>πατέρα πολλῶν ἐθνῶν τέθεικά σε</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L1,4-5">Γεν 17:1,4-5</a>)</blockquote>Οι πιστοί είναι γιοι του Αβραάμ:<blockquote>«καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην. Γινώσκετε ἄρα ὅτι <b>οἱ ἐκ πίστεως, οὗτοι υἱοί εἰσιν Ἀβραάμ</b>. προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο <b>τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη</b>. ὥστε <b>οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ</b>. ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν· γέγραπται γὰρ ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά. ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται· ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ᾿ Ὁ ποιήσας αὐτὰ ζήσεται ἐν αὐτοῖς. Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ὅτι γέγραπται, Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου, ἵνα <b>εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν Χριστῷ Ἰησοῦ</b>, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως. Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται. τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ. <b>οὐ λέγει, Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ᾿ ὡς ἐφ᾿ ἑνός, Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός</b>. &lt;…&gt; ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε· &lt;…&gt; <b>εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ</b>, κατ᾿ ἐπαγγελίαν κληρονόμοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L6-16,27,29">Γαλ 3:6-16,27,29</a>)</blockquote><blockquote>«καὶ εὐλογήσω τοὺς εὐλογοῦντάς σε, καὶ τοὺς καταρωμένους σε καταράσομαι· καὶ <b>ἐνευλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/12/#L3">Γεν 12:3</a>)</blockquote><blockquote>«ἵνα <b>εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν Χριστῷ Ἰησοῦ</b>, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν <b>διὰ τῆς πίστεως</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L14">Γαλ 3:14</a>)</blockquote><h2>Ο Ιησούς Χριστός για τα τέκνα του Αβραάμ:</h2><blockquote>«καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς, Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι <b>δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L9">Μτ 3:9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L8">Λκ 3:8</a>)</blockquote><h2>Η Εκκλησία — ο νέος Ισραήλ</h2><blockquote>«Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς· <b>οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L9-10">Α Πε 2:9-10</a>)</blockquote>
