  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2><strong>Ο Ιησούς Χριστός θα κρίνει όλους τους ανθρώπους στη Φοβερή Κρίση</strong></h2><blockquote><p><em>«μέλλει γὰρ </em><strong><em>ὁ υἱὸς τοῦ ἀνθρώπου</em></strong><em> ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε </em><strong><em>ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27"><em>Μτ 16:27</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ὅταν δὲ ἔλθῃ </em><strong><em>ὁ υἱὸς τοῦ ἀνθρώπου</em></strong><em> ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ· καὶ συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ </em><strong><em>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</em></strong><em>, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32"><em>Μτ 25:31-32</em></a><em>)</em></p></blockquote><blockquote><p><em>«οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ </em><strong><em>τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L22"><em>Ιω 5:22</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>Ἰησοῦν τὸν ἀπὸ Ναζαρέθ</em></strong><em>, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ᾿ αὐτοῦ. &lt;…&gt; καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι </em><strong><em>οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L38,42"><em>Πραξ 10:38,42</em></a><em>)</em></p></blockquote><blockquote><p><em>«καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει </em><strong><em>κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν</em></strong><em>, πίστιν παρασχὼν πᾶσιν </em><strong><em>ἀναστήσας αὐτὸν ἐκ νεκρῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L31"><em>Πραξ 17:31</em></a><em>)</em></p></blockquote><blockquote><p><em>«τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ </em><strong><em>βήματος τοῦ Χριστοῦ</em></strong><em>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε φαῦλον.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10"><em>Β Κορ 5:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«Διαμαρτύρομαι </em><strong><em>ἐνώπιον τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς</em></strong><em>, καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L1"><em>Β Τιμ 4:1</em></a><em>)</em></p></blockquote><h2><strong>Όλοι υπόκεινται σε κρίση</strong></h2><blockquote><p><em>«τοὺς γὰρ </em><strong><em><mark>πάντας ἡμᾶς</mark> φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ</em></strong><em>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ </em><strong><em>ἔπραξεν</em></strong><em>, εἴτε </em><strong><em>ἀγαθὸν εἴτε φαῦλον</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10"><em>Β Κορ 5:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; </em><strong><em><mark>πάντες</mark> γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L10"><em>Ρωμ 14:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«οὕτως λαλεῖτε καὶ οὕτως </em><strong><em><mark>ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L12"><em>Ιακ 2:12</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅτι σὺν </em><strong><em><mark>πᾶν τὸ ποίημα</mark> ὁ θεὸς ἄξει ἐν κρίσει</em></strong><em> ἐν παντὶ παρεωραμένῳ, </em><strong><em>ἐὰν ἀγαθὸν καὶ ἐὰν πονηρόν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ekl/12/#L14"><em>Εκ 12:14</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ὅταν δὲ ἔλθῃ </em><strong><em>ὁ υἱὸς τοῦ ἀνθρώπου</em></strong><em> ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε </em><strong><em>καθίσει ἐπὶ θρόνου</em></strong><em> δόξης αὐτοῦ· καὶ </em><strong><em>συναχθήσονται ἔμπροσθεν αὐτοῦ <mark>πάντα τὰ ἔθνη</mark></em></strong><em>, καὶ </em><strong><em><mark>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</mark></em></strong><em>, ὥσπερ ὁ ποιμὴν ἀφορίζει </em><strong><em><mark>τὰ πρόβατα ἀπὸ τῶν ἐρίφων</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32"><em>Μτ 25:31-32</em></a><em>)</em></p></blockquote><h2><strong>Η κρίση θα αρχίσει από την Εκκλησία</strong></h2><blockquote><p><em>«ὅτι </em><strong><em>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα <mark>ἀπὸ τοῦ οἴκου τοῦ θεοῦ</mark></em></strong><em>· εἰ δὲ πρῶτον </em><strong><em><mark>ἀφ᾿ ἡμῶν</mark></em></strong><em>, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ; καὶ εἰ </em><strong><em>ὁ δίκαιος μόλις σῴζεται</em></strong><em>, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18"><em>Α Πε 4:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐμοὶ δὲ </em><strong><em>εἰς ἐλάχιστόν ἐστιν ἵνα ὑφ᾿ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· <mark>ἀλλ᾿ οὐδὲ ἐμαυτὸν ἀνακρίνω</mark></em></strong><em>· οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, </em><strong><em>ἀλλ᾿ οὐκ ἐν τούτῳ δεδικαίωμαι, <mark>ὁ δὲ ἀνακρίνων με κύριός ἐστιν</mark></em></strong><em>. </em><strong><em>ὥστε μὴ πρὸ καιροῦ τι κρίνετε</em></strong><em>, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν· καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L3-5"><em>Α Κορ 4:3-5</em></a><em>)</em></p></blockquote><h2>Ο Χριστός θα κρίνει στον άνθρωπο αυτό που έγινε κατά την επίγεια ζωή στο σώμα</h2><blockquote><p>«τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα <strong>κομίσηται ἕκαστος <mark>τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν</mark></strong>, εἴτε ἀγαθὸν εἴτε φαῦλον.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a>)</p></blockquote><p>Η κρίση γίνεται με βάση τα έργα που τελέστηκαν κατά την επίγεια ζωή μέσα στο σώμα:</p><blockquote><p>«Τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων, <strong>Πορεύεσθε ἀπ᾿ ἐμοῦ [οἱ] κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ· ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν</strong>, ἐδίψησα καὶ οὐκ ἐποτίσατέ με, ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με. τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες, Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι; τότε ἀποκριθήσεται αὐτοῖς λέγων, Ἀμὴν λέγω ὑμῖν, <strong>ἐφ᾿ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε. καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L41-46">Μτ 25:41-46</a>)</p></blockquote>
