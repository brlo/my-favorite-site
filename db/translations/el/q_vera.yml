  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Ο Κύριος Ιησούς Χριστός μιλά για την πίστη σ’ Αυτόν, κατά τον λόγο των αποστόλων:</p><blockquote><p>«καὶ ὑπὲρ αὐτῶν [ἐγὼ] ἁγιάζω ἐμαυτόν, ἵνα ὦσιν καὶ αὐτοὶ ἡγιασμένοι ἐν ἀληθείᾳ. Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ <strong>περὶ τῶν πιστευόντων <mark>διὰ τοῦ λόγου αὐτῶν</mark> εἰς ἐμέ, ἵνα πάντες ἓν ὦσιν</strong>, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, ἵνα ὁ κόσμος πιστεύῃ ὅτι σύ με ἀπέστειλας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L19-21">Ιω 17:19-21</a>)</p></blockquote><p>Οι απόστολοι επισήμαναν επανειλημμένα την ανάγκη να διαφυλαχθεί η πίστη που παραδόθηκε μια φορά για πάντα: [<a href="https://bibleox.com/el/el/w/Η_Ιερά_Παράδοση">Ιερά Παράδοση</a>] *Η σελίδα αναμένει ολοκλήρωση</p>'
