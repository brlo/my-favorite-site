  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ορισμός: Η Εκκλησία — Σώμα Χριστού</h2><blockquote><p>«καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν <strong>ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ, ἥτις ἐστὶν <mark>τὸ σῶμα αὐτοῦ</mark></strong>, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L22-23">Εφ 1:22-23</a>)</p></blockquote><blockquote><p>«<strong>Ὑμεῖς δέ ἐστε <mark>σῶμα Χριστοῦ</mark></strong> καὶ μέλη ἐκ μέρους.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L27">Α Κορ 12:27</a>)</p></blockquote><blockquote><p>«οὐκ οἴδατε ὅτι <strong>τὰ σώματα ὑμῶν <mark>μέλη Χριστοῦ</mark> ἐστιν</strong>; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L15">Α Κορ 6:15</a>)</p></blockquote><blockquote><p>«καθάπερ γὰρ ἐν ἑνὶ σώματι πολλὰ μέλη ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν, <strong>οὕτως οἱ πολλοὶ <mark>ἓν σῶμά ἐσμεν ἐν Χριστῷ</mark></strong>, τὸ δὲ καθ᾿ εἷς ἀλλήλων μέλη.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L4-5">Ρωμ 12:4-5</a>)</p></blockquote><blockquote><p>«Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων <strong>τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ <mark>τοῦ σώματος αὐτοῦ</mark>, ὅ ἐστιν <mark>ἡ ἐκκλησία</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L24">Κολ 1:24</a>)</p></blockquote><blockquote><p>«οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, <strong>καθὼς καὶ ὁ Χριστὸς <mark>τὴν ἐκκλησίαν</mark></strong>, ὅτι <strong><mark>μέλη ἐσμὲν τοῦ σώματος αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L29-30">Εφ 5:29-30</a>)</p></blockquote><blockquote><p>«καὶ ἡ εἰρήνη τοῦ Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, <strong>εἰς ἣν καὶ ἐκλήθητε <mark>ἐν ἑνὶ σώματι</mark></strong>· καὶ εὐχάριστοι γίνεσθε.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L15">Κολ 3:15</a>)</p></blockquote><h2>Η ένταξη στο Σώμα (στην Εκκλησία)</h2><h3>Το Βάπτισμα</h3><blockquote><p>«καὶ γὰρ <strong>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες <mark>εἰς ἓν σῶμα ἐβαπτίσθημεν</mark></strong>, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ πάντες ἓν πνεῦμα ἐποτίσθημεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13">Α Κορ 12:13</a>)</p></blockquote><h3>Η Θεία Κοινωνία</h3><blockquote><p>«τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ; <strong>τὸν ἄρτον</strong> ὃν κλῶμεν, οὐχὶ <strong><mark>κοινωνία τοῦ σώματος τοῦ Χριστοῦ</mark> ἐστιν</strong>; <strong>ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L16-17">Α Κορ 10:16-17</a>)</p></blockquote><h2>Ο Χριστός — Σωτήρας του Σώματος (της Εκκλησίας)</h2><blockquote><p>«ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ <strong>ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, αὐτὸς <mark>σωτὴρ τοῦ σώματος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23">Εφ 5:23</a>)</p></blockquote><blockquote><p>«<strong><mark>μείνατε ἐν ἐμοί</mark></strong>, κἀγὼ ἐν ὑμῖν. καθὼς <strong><mark>τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ᾿ ἑαυτοῦ</mark> ἐὰν μὴ μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ μένητε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L4">Ιω 15:4</a>)</p></blockquote><h3>Ο Χριστός οδηγεί στην Εκκλησία όσους σώζονται</h3><blockquote><p><em>«ὁ δὲ </em><strong><em><mark>κύριος</mark></em></strong><em> </em><strong><em><mark>προσετίθει τοὺς σῳζομένους καθ᾿ ἡμέραν ἐπὶ τὸ αὐτό</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L47"><em>Πραξ 2:47</em></a><em>)</em></p></blockquote><p>Ο ελεήμων Σαμαρείτης της παραβολής είναι εικόνα του Χριστού που σώζει τον άνθρωπο. Δένει τις πληγές του ανθρώπου και τον φέρνει στο πανδοχείο (την Εκκλησία), στο οποίο αναθέτει τη φροντίδα για τη θεραπεία (τη σωτηρία):</p><blockquote><p>«ὑπολαβὼν ὁ Ἰησοῦς εἶπεν, Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ἡμιθανῆ. &lt;…&gt; <strong><mark>Σαμαρίτης</mark></strong> δέ τις ὁδεύων ἦλθεν κατ᾿ αὐτὸν καὶ ἰδὼν ἐσπλαγχνίσθη, καὶ προσελθὼν <strong><mark>κατέδησεν τὰ τραύματα αὐτοῦ</mark></strong> ἐπιχέων ἔλαιον καὶ οἶνον, <strong>ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος <mark>ἤγαγεν αὐτὸν εἰς πανδοχεῖον</mark></strong> <strong>καὶ ἐπεμελήθη αὐτοῦ</strong>. καὶ ἐπὶ τὴν αὔριον ἐκβαλὼν ἔδωκεν δύο δηνάρια τῷ πανδοχεῖ καὶ εἶπεν, Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L30,33-35">Λκ 10:30,33-35</a>)</p></blockquote><h2>Η σύνθεση της Εκκλησίας</h2><h3>Κεφαλή του Σώματος — ο Χριστός</h3><blockquote><p>«καὶ <strong>αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος, τῆς ἐκκλησίας</strong>· ὅς ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L18">Κολ 1:18</a>)</p></blockquote><blockquote><p>«καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν <strong>ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ</strong>, ἥτις ἐστὶν <strong>τὸ σῶμα αὐτοῦ</strong>, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L22-23">Εφ 1:22-23</a>)</p></blockquote><blockquote><p>«καὶ οὐ κρατῶν <strong>τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα</strong> διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L19">Κολ 2:19</a>)</p></blockquote><h3>Στο Σώμα δεν υπάρχει άλλη κεφαλή εκτός από τον Χριστό</h3><p>Οι απόστολοι και οι επίσκοποι είναι μεταξύ τους ίσοι. Οι απόστολοι συχνά φιλονικούσαν για το ποιος από αυτούς είναι μεγαλύτερος. Ο Χριστός τούς υπέδειξε να μην αναζητούν εξουσία ο ένας πάνω στον άλλον:</p><blockquote><p>«<strong>Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς</strong>, <strong>τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων</strong>. ὁ δὲ εἶπεν αὐτοῖς, Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται. <strong>ὑμεῖς δὲ οὐχ οὕτως, ἀλλ᾿ ὁ μείζων ἐν ὑμῖν γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L24-26">Λκ 22:24-26</a>)</p></blockquote><h3>Τα μέλη του Σώματος είναι διαφορετικά</h3><blockquote><p>«καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.»</p><p>«μὴ πάντες <strong>ἀπόστολοι</strong>;»</p><p>«μὴ πάντες <strong>προφῆται</strong>;»</p><p>«μὴ πάντες <strong>διδάσκαλοι</strong>;»</p><p>«μὴ πάντες <strong>δυνάμεις</strong>;»</p><p>«μὴ πάντες χαρίσματα ἔχουσιν <strong>ἰαμάτων</strong>;»</p><p>«μὴ πάντες γλώσσαις <strong>λαλοῦσιν</strong>;»</p><p>«μὴ πάντες <strong>διερμηνεύουσιν</strong>;»</p><p>(<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28-30">Α Κορ 12:28-30</a>)</p></blockquote><blockquote><p>«καὶ γὰρ <strong>τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά</strong>. ἐὰν εἴπῃ ὁ πούς, Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος· καὶ ἐὰν εἴπῃ τὸ οὖς, Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος· εἰ ὅλον τὸ σῶμα ὀφθαλμός, ποῦ ἡ ἀκοή; εἰ ὅλον ἀκοή, ποῦ ἡ ὄσφρησις; νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν. εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα; νῦν δὲ <strong>πολλὰ μὲν μέλη, ἓν δὲ σῶμα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L14-20">Α Κορ 12:14-20</a>)</p></blockquote><h2>Η ενότητα της επίγειας και της ουράνιας Εκκλησίας (ένα Σώμα Χριστού)</h2><h3>Το ουράνιο και το επίγειο ενώνονται στον Χριστό</h3><blockquote><p>«Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ, &lt;…&gt; γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ <strong>εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν</strong>, <strong><mark>ἀνακεφαλαιώσασθαι τὰ πάντα</mark> <mark>ἐν τῷ Χριστῷ</mark>, <u><mark>τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς</mark></u></strong>· ἐν αὐτῷ,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L3,9-10">Εφ 1:3,9-10</a>)</p></blockquote><blockquote><p>«Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν πατέρα, ἐξ οὗ πᾶσα <strong>πατριὰ</strong> <strong><mark>ἐν οὐρανοῖς καὶ ἐπὶ γῆς</mark></strong> ὀνομάζεται,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/3/#L14-15">Εφ 3:14-15</a>)</p></blockquote><blockquote><p>«καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος, τῆς ἐκκλησίας· ὅς ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων, ὅτι <strong>ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι καὶ δι᾿ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν</strong>, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, [δι᾿ αὐτοῦ] εἴτε <strong><mark>τὰ ἐπὶ τῆς γῆς εἴτε τὰ ἐν τοῖς οὐρανοῖς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L18-20">Κολ 1:18-20</a>)</p></blockquote><blockquote><p>«εἰς τοῦτο γὰρ <strong><mark>Χριστὸς</mark></strong> ἀπέθανεν καὶ ἔζησεν ἵνα <strong><mark>καὶ νεκρῶν καὶ ζώντων κυριεύσῃ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L9">Ρωμ 14:9</a>)</p></blockquote><h3>Η σύνδεση όλων των μελών και η φροντίδα του ενός για το άλλο</h3><p>Όλο το Σώμα συγκρατείται από διάφορους συνδέσμους:</p><blockquote><p><em>«ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, Χριστός, ἐξ οὗ </em><strong><em><mark>πᾶν τὸ σῶμα</mark> συναρμολογούμενον καὶ <mark>συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας</mark></em></strong><em> κατ᾿ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L15-16"><em>Εφ 4:15-16</em></a><em>)</em></p></blockquote><blockquote><p><em>«μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ, καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ </em><strong><em><mark>πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον</mark> αὔξει</em></strong><em> τὴν αὔξησιν τοῦ θεοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L18-19"><em>Κολ 2:18-19</em></a><em>)</em></p></blockquote><p>Όλα τα μέλη του γνωρίζονται μεταξύ τους και φροντίζουν το ένα το άλλο:</p><blockquote><p><em>«νυνὶ δὲ ὁ θεὸς ἔθετο </em><strong><em>τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι</em></strong><em> καθὼς ἠθέλησεν. εἰ δὲ ἦν τὰ πάντα ἓν μέλος, ποῦ τὸ σῶμα; νῦν δὲ </em><strong><em>πολλὰ μὲν μέλη, ἓν δὲ σῶμα</em></strong><em>. οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί, Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν, Χρείαν ὑμῶν οὐκ ἔχω· ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν, καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει, τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ὑστερουμένῳ περισσοτέραν δοὺς τιμήν, </em><strong><em>ἵνα μὴ ᾖ σχίσμα ἐν τῷ σώματι</em></strong><em>, ἀλλὰ </em><strong><em><mark>τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσιν τὰ μέλη</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L18-25"><em>Α Κορ 12:18-25</em></a><em>)</em></p></blockquote><h3>Στη γη η Εκκλησία στρατεύεται</h3><blockquote><p>«<strong>Νήψατε</strong>, γρηγορήσατε. <strong>ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν [τινα] καταπιεῖν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L8">Α Πε 5:8</a>)</p></blockquote><blockquote><p>«ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς <strong>στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου· ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη</strong> πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ σκότους τούτου, <strong>πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L11-12">Εφ 6:11-12</a>)</p></blockquote><blockquote><p>«<strong>οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν</strong>, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L14">Εβρ 13:14</a>)</p></blockquote><h3>Στον ουρανό η Εκκλησία θριαμβεύει</h3><blockquote><p>«ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, <strong>Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων</strong>, <strong><mark>πανηγύρει</mark></strong> καὶ <strong><mark>ἐκκλησίᾳ πρωτοτόκων</mark></strong> ἀπογεγραμμένων ἐν οὐρανοῖς, καὶ κριτῇ θεῷ πάντων, καὶ <strong>πνεύμασι δικαίων τετελειωμένων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-23">Εβρ 12:22-23</a>)</p></blockquote><h2>Η Εκκλησία είναι ορατή</h2><p>Δεν μπορεί να κρυφτεί από τους ανθρώπους</p><blockquote><p>«Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. <strong><mark>οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L14">Μτ 5:14</a>)</p></blockquote><p>Ο Θεός τοποθέτησε τα μέλη του Σώματος (της Εκκλησίας) έτσι ώστε να μην υπάρχουν διαιρέσεις, αλλά όλα να φροντίζουν το ένα το άλλο, να συμπάσχουν και να συγχαίρουν μαζί:</p><blockquote><p><em>«καὶ γὰρ </em><strong><em>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν</em></strong><em>, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ πάντες ἓν πνεῦμα ἐποτίσθημεν. καὶ γὰρ </em><strong><em>τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά</em></strong><em>. &lt;…&gt; </em><strong><em><mark>οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί, Χρείαν σου οὐκ ἔχω</mark></em></strong><em>, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν, Χρείαν ὑμῶν οὐκ ἔχω· ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν, καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει, τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ἔχει. ἀλλὰ </em><strong><em><mark>ὁ θεὸς συνεκέρασεν τὸ σῶμα</mark></em></strong><em>, τῷ ὑστερουμένῳ περισσοτέραν δοὺς τιμήν, </em><strong><em><mark>ἵνα μὴ ᾖ σχίσμα ἐν τῷ σώματι</mark></em></strong><em>, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσιν τὰ μέλη. </em><strong><em>καὶ εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη</em></strong><em>· εἴτε δοξάζεται ἓν μέλος, συγχαίρει πάντα τὰ μέλη.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13-14,21-26"><em>Α Κορ 12:13-14,21-26</em></a><em>)</em></p></blockquote><p>Όλο το Σώμα συγκρατείται από διάφορους συνδέσμους:</p><blockquote><p>«ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, Χριστός, ἐξ οὗ <strong><mark>πᾶν τὸ σῶμα</mark> συναρμολογούμενον καὶ <mark>συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας</mark></strong> κατ᾿ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L15-16">Εφ 4:15-16</a>)</p></blockquote><blockquote><p>«μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ, καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ <strong><mark>πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον</mark> αὔξει</strong> τὴν αὔξησιν τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L18-19">Κολ 2:18-19</a>)</p></blockquote><p>Στην Εκκλησία μπορεί κανείς να προσφύγει για κρίση:</p><blockquote><p>«<strong>Ἐὰν δὲ ἁμαρτήσῃ [εἰς σὲ] ὁ ἀδελφός σου</strong>, ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου· &lt;…&gt; ἐὰν δὲ παρακούσῃ αὐτῶν, <strong><mark>εἰπὲ τῇ ἐκκλησίᾳ</mark>· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L15,17">Μτ 18:15,17</a>)</p></blockquote><p>Λεπτομέρειες για τα όρια της Εκκλησίας: <a href="https://bibleox.com/el/el/w/%CE%97_%CE%BF%CF%81%CE%B1%CF%84%CE%AE_%CE%B5%CE%BD%CF%8C%CF%84%CE%B7%CF%84%CE%B1_%CF%84%CE%B7%CF%82_%CE%95%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%CE%AF%CE%B1%CF%82">Η ορατή ενότητα της Εκκλησίας</a>.</p><h2>Η Εκκλησία είναι ακατανίκητη</h2><h3>Η Εκκλησία δεν θα νικηθεί</h3><blockquote><p><em>«οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου </em><strong><em><mark>οὐ κατισχύσουσιν αὐτῆς</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L18"><em>Μτ 16:18</em></a><em>)</em></p></blockquote><h3>Ο Θεός μένει πάντοτε με την Εκκλησία</h3><blockquote><p><em>«κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα </em><strong><em>μεθ᾿ ὑμῶν <mark>εἰς τὸν αἰῶνα</mark> ᾖ</em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16"><em>Ιω 14:16</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐγὼ μεθ᾿ ὑμῶν εἰμι </em><strong><em><mark>πάσας τὰς ἡμέρας</mark> ἕως τῆς συντελείας τοῦ αἰῶνος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L20"><em>Μτ 28:20</em></a><em>)</em></p></blockquote><h3>Η Εκκλησία δοξάζει πάντοτε τον Θεό</h3><blockquote><p><em>«αὐτῷ </em><strong><em>ἡ δόξα ἐν τῇ ἐκκλησίᾳ</em></strong><em> καὶ ἐν Χριστῷ Ἰησοῦ </em><strong><em><mark>εἰς πάσας τὰς γενεὰς</mark></em></strong><em><mark> </mark></em><strong><em><mark>τοῦ αἰῶνος τῶν αἰώνων</mark></em></strong><em>· ἀμήν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/3/#L21"><em>Εφ 3:21</em></a><em>)</em></p></blockquote><h3>Η αλήθεια θα είναι πάντοτε στην Εκκλησία</h3><blockquote><p>«Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες <strong><mark>τὴν ἀλήθειαν</mark></strong>, διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ <strong><mark>μεθ᾿ ἡμῶν ἔσται εἰς τὸν αἰῶνα</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L1-2">Β Ιω 1:1-2</a>)</p></blockquote><h2>Το λάβαρο της Εκκλησίας — ο σταυρός</h2><p>Στην Παλαιά Διαθήκη ο Ισραήλ, πορευόμενος προς τη βασιλεία που του είχε υποσχεθεί, κινούνταν σε σχήμα σταυρού. Ο αρχαίος Ισραήλ ήταν προτύπωση της Εκκλησίας του Χριστού — του νέου Ισραήλ. Έτσι, ο σταυρός είναι το κύριο λάβαρο της Εκκλησίας, σύμβολο νίκης, συμφιλίωσης, θυσιαστήριο (δηλαδή μεγάλη ιερή πραγματικότητα).</p><p>Η χρήση του σημείου του σταυρού από τους αρχαίους χριστιανούς.</p><h2>Η ημέρα ίδρυσης της Εκκλησίας — η 50ή ημέρα μετά την Ανάσταση του Χριστού</h2><ol><li><p>Στην Εκκλησία μπαίνει κανείς με το Βάπτισμα (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13">Α Κορ 12:13</a>).</p></li><li><p>Το Βάπτισμα τελείται με νερό και Πνεύμα (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>).</p></li><li><p>Το βάπτισμα με το Άγιο Πνεύμα τελείται για πρώτη φορά την 50ή ημέρα μετά την ανάσταση του Χριστού (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L1-5,8-9">Πραξ 1:1-5,8-9</a>).</p></li></ol><h3>Στην Εκκλησία μπαίνει κανείς με το Βάπτισμα</h3><blockquote><p><em>«καὶ γὰρ </em><strong><em>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες <mark>εἰς ἓν σῶμα ἐβαπτίσθημεν</mark></em></strong><em>, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ πάντες ἓν πνεῦμα ἐποτίσθημεν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13"><em>Α Κορ 12:13</em></a><em>)</em></p></blockquote><blockquote><p>«ὅσοι γὰρ εἰς Χριστὸν <strong><mark>ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>)</p></blockquote><h3>Το Βάπτισμα είναι γέννηση από νερό και Πνεύμα</h3><blockquote><p>«ἀπεκρίθη Ἰησοῦς, Ἀμὴν ἀμὴν λέγω σοι, <strong>ἐὰν μή τις <mark>γεννηθῇ ἐξ ὕδατος καὶ πνεύματος</mark>, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L5">Ιω 3:5</a>)</p></blockquote><h3>Ο Χριστός θα βαπτίσει με το Άγιο Πνεύμα</h3><blockquote><p>«ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης, Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· <strong><mark>αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ</mark></strong> καὶ πυρί·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L16">Λκ 3:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L11">Μτ 3:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L8">Μκ 1:8</a>)</p></blockquote><h3>Μέχρι να φύγει ο Χριστός, το Άγιο Πνεύμα δεν θα έρθει</h3><blockquote><p>«ἀλλ᾿ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. <strong><mark>ἐὰν γὰρ μὴ ἀπέλθω, ὁ παράκλητος οὐκ ἐλεύσεται πρὸς ὑμᾶς</mark></strong>· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L7">Ιω 16:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16">Ιω 14:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L26">Ιω 14:26</a>)</p></blockquote><blockquote><p>«<strong><mark>Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν</mark></strong> παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L26">Ιω 15:26</a>)</p></blockquote><blockquote><p>«καὶ [ἰδοὺ] ἐγὼ ἀποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ᾿ ὑμᾶς· ὑμεῖς δὲ <strong>καθίσατε ἐν τῇ πόλει ἕως οὗ ἐνδύσησθε ἐξ ὕψους δύναμιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L49">Λκ 24:49</a>)</p></blockquote><h3>Ο Χριστός μετά την ανάσταση δεν είχε ακόμη ανέβει στον Πατέρα</h3><blockquote><p>«λέγει αὐτῇ Ἰησοῦς, Μή μου ἅπτου, <strong><mark>οὔπω γὰρ ἀναβέβηκα πρὸς τὸν πατέρα</mark></strong>· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς, Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L17">Ιω 20:17</a>)</p></blockquote><h3>Αυτό που υποσχέθηκε ο Χριστός θα εκπληρωθεί την 50ή ημέρα μετά την ανάσταση</h3><p>Το υποσχεμένο βάπτισμα με το Άγιο Πνεύμα τελέστηκε για πρώτη φορά 50 ημέρες μετά την Ανάσταση του Χριστού:</p><blockquote><p>«Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν ἄχρι ἧς ἡμέρας ἐντειλάμενος τοῖς ἀποστόλοις διὰ πνεύματος ἁγίου οὓς ἐξελέξατο ἀνελήμφθη· οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, <strong><mark>δι᾿ ἡμερῶν τεσσαράκοντα ὀπτανόμενος αὐτοῖς</mark></strong> καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ. καὶ <strong>συναλιζόμενος παρήγγειλεν αὐτοῖς <mark>ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου</mark>· <mark>ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι</mark>, <mark>ὑμεῖς δὲ ἐν πνεύματι βαπτισθήσεσθε ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας</mark></strong>. &lt;…&gt; ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ᾿ ὑμᾶς, καὶ ἔσεσθέ μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς. καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη, καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L1-5,8-9">Πραξ 1:1-5,8-9</a>)</p></blockquote><blockquote><p>«Καὶ <strong>ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς</strong> ἦσαν πάντες ὁμοῦ ἐπὶ τὸ αὐτό. &lt;…&gt; καὶ <strong><mark>ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, καὶ ἐκάθισεν ἐφ᾿ ἕνα ἕκαστον αὐτῶν, καὶ ἐπλήσθησαν πάντες πνεύματος ἁγίου</mark></strong>, καὶ ἤρξαντο λαλεῖν ἑτέραις γλώσσαις καθὼς τὸ πνεῦμα ἐδίδου ἀποφθέγγεσθαι αὐτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L1,3-4">Πραξ 2:1,3-4</a>)</p></blockquote><h3>Εντούτοις, για την αποστολή του Αγίου Πνεύματος γίνεται λόγος την ίδια ημέρα της ανάστασης του Χριστού, αλλά όχι για το Βάπτισμα</h3><p>Εδώ δίνεται στους αποστόλους εκκλησιαστική εξουσία, δημιουργείται η ιερατική ιεραρχία:</p><blockquote><p>«<strong>Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον</strong>, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου. &lt;…&gt; <strong>Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων</strong>, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, <strong>ἦλθεν ὁ Ἰησοῦς</strong> καὶ ἔστη εἰς τὸ μέσον καὶ λέγει αὐτοῖς, Εἰρήνη ὑμῖν. &lt;…&gt; <strong>καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς, Λάβετε πνεῦμα ἅγιον</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L1,19,22">Ιω 20:1,19,22</a>)</p></blockquote><h2>Κριτική</h2><h3>Η ιστορική Εκκλησία έπεσε</h3><p>Οι ιδρυτές κοινοτήτων που αποσχίστηκαν από την Εκκλησία θέτουν ως βάση του μοντέλου ύπαρξης των κινημάτων τους τον ισχυρισμό ότι η ιστορική Εκκλησία του Χριστού αποστάτησε από τον Θεό και έπεσε, γι’ αυτό και χρειάστηκε η δική τους ξεχωριστή κοινότητα. Αν όμως δεν αποδειχθεί ότι η Εκκλησία έπεσε, τότε ούτε η δική τους κοινότητα χρειάζεται, αλλά χρειάζεται να μπει κανείς στην ιστορική Εκκλησία του Χριστού.</p><p>Για να στηρίξουν την ιδέα της πτώσης της Εκκλησίας, συχνά παραθέτουν παρόμοια χωρία για λύκους:</p><blockquote><p>«ἐγὼ οἶδα ὅτι εἰσελεύσονται <strong>μετὰ τὴν ἄφιξίν μου <mark>λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου</mark>, καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα <mark>τοῦ ἀποσπᾶν</mark> τοὺς μαθητὰς <mark>ὀπίσω αὐτῶν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L29-30">Πραξ 20:29-30</a>)</p></blockquote><p>Ωστόσο, πρέπει να αναγνωρίσουμε ότι αυτά τα χωρία είναι προφητεία μόνο για την εμφάνιση ψευδοδιδασκάλων που θέλουν να παρασύρουν τους ανθρώπους έξω από την Εκκλησία, <strong>ώστε να τους ακολουθήσουν</strong>, και όχι προφητεία για την πτώση της Εκκλησίας.</p><p>Λίγο πιο πάνω ο απόστολος καλούσε τους πρεσβυτέρους να προσέχουν τον εαυτό τους και το ποίμνιο:</p><blockquote><p>«Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον <strong>μετεκαλέσατο</strong> <strong>τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>. &lt;…&gt; <strong><mark>προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ</mark>, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ θεοῦ</strong>, ἣν περιεποιήσατο διὰ τοῦ αἵματος τοῦ ἰδίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L17,28">Πραξ 20:17,28</a>)</p></blockquote><p>Γιατί ο απόστολος καλεί να φροντίζουν για το ποίμνιο; Δίνει αμέσως την απάντηση: γιατί θα εμφανιστούν ψευδοδιδάσκαλοι και, σαν λύκοι, θα θέλουν να διαρπάξουν το ποίμνιο της Εκκλησίας (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L29-30">Πραξ 20:29-30</a>). Αλλά οι πρεσβύτεροι, που έχουν τεθεί από το Άγιο Πνεύμα, δεν πρέπει να το επιτρέψουν.</p><p>Θα τα καταφέρουν οι πρεσβύτεροι να προστατεύσουν το ποίμνιο; Ναι, θα τα καταφέρουν. Γιατί δεν υπάρχουν προφητείες για την πτώση της Εκκλησίας, ενώ για το ότι είναι ακατανίκητη υπάρχουν:</p><blockquote><p>«κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου <strong>τὴν ἐκκλησίαν</strong>, καὶ <strong>πύλαι ᾅδου <mark>οὐ κατισχύσουσιν</mark></strong> αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L18">Μτ 16:18</a>)</p></blockquote><blockquote><p><em>«αὐτῷ </em><strong><em>ἡ δόξα ἐν τῇ ἐκκλησίᾳ</em></strong><em> καὶ ἐν Χριστῷ Ἰησοῦ </em><strong><em>εἰς πάσας τὰς γενεὰς</em></strong><em> </em><strong><em><mark>τοῦ αἰῶνος τῶν αἰώνων</mark></em></strong><em>· ἀμήν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/3/#L21"><em>Εφ 3:21</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐγὼ μεθ᾿ ὑμῶν εἰμι </em><strong><em><mark>πάσας τὰς ἡμέρας</mark> ἕως τῆς συντελείας τοῦ αἰῶνος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L20"><em>Μτ 28:20</em></a><em>)</em></p></blockquote><blockquote><p><em>«κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα </em><strong><em>μεθ᾿ ὑμῶν <mark>εἰς τὸν αἰῶνα</mark> ᾖ</em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16"><em>Ιω 14:16</em></a><em>)</em></p></blockquote><h3>Η Εκκλησία είναι δύο ή τρεις συγκεντρωμένοι για προσευχή</h3><p>Αφού ο Χριστός δημιούργησε μια φορά την Εκκλησία Του, οι μεταγενέστεροι δημιουργοί χριστιανικών κοινοτήτων αντιμετωπίζουν πρώτα απ’ όλα την ανάγκη να εξηγήσουν στους ανθρώπους την εμφάνιση της νέας τους κοινότητας, χωριστής από την Εκκλησία του Χριστού. Επειδή προέκυψε πρόσφατα με πρωτοβουλία ενός συνηθισμένου ανθρώπου, μια τέτοια κοινότητα δεν έχει άμεση ιστορική σύνδεση με τους αρχαίους χριστιανούς, γι’ αυτό και είναι πάντα αναγκασμένη να αποδεικνύει ότι είναι κατά κάποιον τρόπο μέρος της Εκκλησίας του Χριστού που δημιουργήθηκε πριν από 2000 χρόνια. Για τον σκοπό αυτό χρησιμοποιείται συχνά το βιβλικό χωρίο για τη σημασία της κοινής προσευχής. Προτείνεται να θεωρείται ότι, εφόσον ο Χριστός βρίσκεται ανάμεσα σε δύο ή τρεις που προσεύχονται, όλοι αυτοί οι προσευχόμενοι αποτελούν δήθεν από μόνοι τους εκκλησία:</p><blockquote><p><em>«Πάλιν λέγω ὑμῖν ὅτι ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς. </em><strong><em>οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L19-20"><em>Μτ 18:19-20</em></a><em>)</em></p></blockquote><p>Ωστόσο, αυτά τα χωρία μιλούν κυριολεκτικά μόνο για τη δύναμη της κοινής προσευχής, και όχι για την Εκκλησία. Εδώ δεν γίνεται λόγος για την Εκκλησία. Όμως λίγες γραμμές πιο πάνω γίνεται λόγος για την Εκκλησία:</p><blockquote><p><em>«Ἐὰν δὲ ἁμαρτήσῃ [εἰς σὲ] ὁ ἀδελφός σου, ὕπαγε ἔλεγξον αὐτὸν μεταξὺ </em><strong><em>σοῦ</em></strong><em> καὶ </em><strong><em>αὐτοῦ μόνου</em></strong><em>. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου· ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ </em><strong><em>ἔτι ἕνα ἢ δύο</em></strong><em>, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα· </em><strong><em>ἐὰν δὲ παρακούσῃ αὐτῶν, <mark>εἰπὲ τῇ ἐκκλησίᾳ</mark>· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ</em></strong><em>, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.» (Μτ 18:15-17)</em></p></blockquote><p>Εδώ συναντήθηκαν άνθρωποι:</p><ul><li><p>εγώ·</p></li><li><p>ο αδελφός που αμάρτησε·</p></li><li><p>ακόμη ένας ή δύο μάρτυρες.</p></li></ul><p>Σύνολο 1+1+2=4. Ή τουλάχιστον 3.</p><p>Αυτοί οι τρεις άνθρωποι που συναντήθηκαν δεν είναι ακόμη Εκκλησία, όπως φαίνεται, γιατί όλοι τους πρέπει να απευθυνθούν για την κρίση όχι στους εαυτούς τους, αλλά στην Εκκλησία. Έτσι, η Εκκλησία δεν είναι δύο ή τρεις συγκεντρωμένοι για προσευχή, αλλά κάτι που υπάρχει μόνιμα με ορατό τρόπο, στο οποίο μπορεί κανείς να απευθυνθεί για κρίση, και του οποίου την απάντηση μπορεί να ακούσει, να εκτελέσει ή να μην εκτελέσει. Και εκείνος που δεν ακούει αυτή την απάντηση της Εκκλησίας γίνεται για τα μέλη της Εκκλησίας «σαν εθνικός και τελώνης».</p><p>Και ποιος μπορεί να κρίνει; Οι απόστολοι και οι διάδοχοί τους, οι επίσκοποι (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L18">Μτ 18:18</a>). Για παράδειγμα, ο επίσκοπος Τιμόθεος:</p><blockquote><p>«<strong>κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων</strong>. τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L19-20">Α Τιμ 5:19-20</a>)</p></blockquote><p>Έτσι, η ερμηνεία για τους δύο-τρεις που προσεύχονται και δεν έχουν δικαίωμα να κρίνουν άλλους δεν αφορά την Εκκλησία. Και ο ίδιος ο δημιουργός της κοινότητας που χωρίστηκε από την Εκκλησία, μη ακούγοντας την Εκκλησία, γίνεται γι’ αυτήν «σαν εθνικός και τελώνης» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L17">Μτ 18:17</a>). Ποιους θα κρίνει στην κοινότητά του; Πώς μπορεί να δώσει εξουσία να κρίνει, αν ο ίδιος δεν την είχε ποτέ; Η απάντηση είναι προφανής.</p>'
