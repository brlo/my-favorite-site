  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Πρόλογος</h2><p>Οι άγιοι δίκαιοι και οι άγγελοι τιμώνται όχι ως θεοί, αλλά ως φίλοι του Θεού. Δεν τιμώνται καθ’ εαυτούς, αλλά λόγω της μέθεξης του Θεού, εξαιτίας της χάρης του Θεού που κατοικεί μέσα τους (άρθρο: <a href="https://bibleox.com/el/el/w/%CE%9F_%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%BD%CE%B1%CF%8C%CF%82_%CF%84%CE%BF%CF%85_%CE%98%CE%B5%CE%BF%CF%8D">ο άνθρωπος — ναός του Θεού</a>). Σύμφωνα με την Αγία Γραφή, πρέπει να τιμούμε όχι μόνο τον Θεό· υποκλίσεις δεν κάνουμε μόνο στον Θεό· ο ίδιος ο Θεός καλούσε να ζητάμε δόξα από τον Θεό· ο Θεός υποσχέθηκε να δοξάσει τους δικαίους και τους δοξάζει· η Εκκλησία, ακολουθώντας τον Θεό, δοξάζει τους αγίους φίλους του Θεού.</p><p>Ο Θεός στέλνει τη χάρη Του μέσω των αγίων τόσο κατά τη ζωή τους όσο και μέσω των <strong>νεκρών σωμάτων</strong> τους (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21">Δ Βασ 13:21</a>), των <strong>προσωπικών τους αντικειμένων</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L12">Πραξ 19:12</a>) και των <strong>εικόνων</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L15-16">Πραξ 5:15-16</a>), γι’ αυτό και όλα αυτά τιμώνται επίσης. Περισσότερα στα σχετικά άρθρα:</p><ul><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%BB%CE%B5%CE%B9%CF%88%CE%AC%CE%BD%CF%89%CE%BD">η τιμή των λειψάνων των αγίων</a>·</p></li><li><p>η τιμή των εικόνων των αγίων.</p></li></ul><h2>Δεν τιμούμε μόνο τον Θεό</h2><h3>Η τιμή προς τον Θεό</h3><blockquote><p>«Υἱὸς δοξάζει πατέρα καὶ δοῦλος τὸν κύριον αὐτοῦ. καὶ εἰ πατήρ εἰμι ἐγώ, <strong><mark>ποῦ ἐστιν ἡ δόξα μου</mark></strong>; καὶ εἰ κύριός εἰμι ἐγώ, <strong>ποῦ ἐστιν ὁ φόβος μου</strong>; λέγει κύριος παντοκράτωρ. ὑμεῖς οἱ ἱερεῖς οἱ φαυλίζοντες τὸ ὄνομά μου· καὶ εἴπατε Ἐν τίνι ἐφαυλίσαμεν τὸ ὄνομά σου;» (<a href="https://bibleox.com/el/gr-lxx-byz/mal/1/#L6">Μαλ 1:6</a>)</p></blockquote><h3>Στον ιερέα</h3><blockquote><p>«φοβοῦ τὸν κύριον καὶ <strong><mark>δόξασον ἱερέα</mark></strong> καὶ δὸς τὴν μερίδα αὐτῷ, καθὼς ἐντέταλταί σοι, ἀπαρχὴν καὶ περὶ πλημμελείας καὶ δόσιν βραχιόνων καὶ θυσίαν ἁγιασμοῦ καὶ ἀπαρχὴν ἁγίων.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/7/#L31">Σ.Σειρ 7:31</a>)</p></blockquote><h3>Στους ευσεβείς χριστιανούς</h3><blockquote><p>«χαίρω δὲ ἐπὶ τῇ παρουσίᾳ Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ, ὅτι τὸ ὑμέτερον ὑστέρημα οὗτοι ἀνεπλήρωσαν, ἀνέπαυσαν γὰρ τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν. <strong><mark>ἐπιγινώσκετε οὖν τοὺς τοιούτους</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/16/#L17-18">Α Κορ 16:17-18</a>)</p></blockquote><h3>Στις συζύγους</h3><blockquote><p>«Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ <strong><mark>γυναικείῳ</mark></strong> <strong><mark>ἀπονέμοντες τιμήν</mark></strong>, ὡς καὶ συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L7">Α Πε 3:7</a>)</p></blockquote><h3>Στον πατέρα και στη μητέρα</h3><blockquote><p>«<strong><mark>τίμα τὸν πατέρα</mark></strong> σου <strong><mark>καὶ τὴν μητέρα</mark></strong>, ἵνα εὖ σοι γένηται, καὶ ἵνα μακροχρόνιος γένῃ ἐπὶ τῆς γῆς τῆς ἀγαθῆς, ἧς κύριος ὁ θεός σου δίδωσίν σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L12">Έξ 20:12</a>)</p></blockquote><h3>Στους γέροντες</h3><blockquote><p>«ἀπὸ προσώπου πολιοῦ ἐξαναστήσῃ καὶ <strong><mark>τιμήσεις πρόσωπον πρεσβυτέρου</mark></strong> καὶ φοβηθήσῃ τὸν θεόν σου· ἐγώ εἰμι κύριος ὁ θεὸς ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L32">Λευ 19:32</a>)</p></blockquote><h3>Στις χήρες</h3><blockquote><p>«<strong><mark>Χήρας τίμα</mark></strong> τὰς ὄντως χήρας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L3">Α Τιμ 5:3</a>)</p></blockquote><h3>Στις κρατικές αρχές</h3><blockquote><p>«πάντας τιμήσατε, τὴν ἀδελφότητα ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, <strong><mark>τὸν βασιλέα τιμᾶτε</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L17">Α Πε 2:17</a>)</p></blockquote><blockquote><p>«Πᾶσα ψυχὴ <strong><mark>ἐξουσίαις ὑπερεχούσαις</mark></strong> ὑποτασσέσθω. οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ οὖσαι ὑπὸ θεοῦ τεταγμέναι εἰσίν· &lt;…&gt; ἀπόδοτε πᾶσιν τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, <strong><mark>τῷ τὴν τιμὴν</mark></strong> τὴν τιμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/13/#L1,7">Ρωμ 13:1,7</a>)</p></blockquote><h3>Σε όλους</h3><blockquote><p>«<strong><mark>πάντας τιμήσατε</mark></strong>, τὴν ἀδελφότητα ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L17">Α Πε 2:17</a>)</p></blockquote><blockquote><p>«τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, <strong><mark>τῇ τιμῇ</mark></strong> ἀλλήλους προηγούμενοι,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L10">Ρωμ 12:10</a>)</p></blockquote><h2>Οι προσκυνήσεις στους αγίους</h2><p>Η δεύτερη εντολή του δεκαλόγου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L4-5">Έξ 20:4-5</a>· <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L8-9">Δτ 5:8-9</a>) απαγορεύει τη λατρεία ψεύτικων θεών (ειδώλων). Οι ψεύτικοι θεοί στην πραγματικότητα δεν είναι θεοί· η θεότητά τους είναι πλασματική, είναι φαντασίες, ψέμα.</p><p>Οι άγιοι υπάρχουν πραγματικά, είναι φίλοι του Θεού και δεν λατρεύονται ως θεοί. Οι προσκυνήσεις στους αγίους είναι έκφραση σεβασμού προς αυτούς ως φίλους του Θεού, ως λειτουργούς του Θεού (αγγέλους), ως μητέρα του Θεού. Τέτοιες προσκυνήσεις σε αγγέλους, σε ανθρώπους και σε αντικείμενα συναντώνται στην Αγία Γραφή και δεν είναι ειδωλολατρία, γιατί ειδωλολατρία είναι η λατρεία <u>ψεύτικων</u> <u>θεών</u>, η λατρεία του ψέματος. Οι δίκαιοι διαρκώς προσκυνούν ανθρώπους ως ανθρώπους, αγγέλους ως αγγέλους, προφήτες ως προφήτες, αντικείμενα ως αντικείμενα. Σε όλες τις περιπτώσεις προσκυνούν αυτούς όχι ως θεούς.</p><h3>Η προσκύνηση στον Θεό, που φανερώθηκε με μορφή αγγέλων</h3><p>Ο Θεός φανερώθηκε, αλλά οι τρεις άγγελοι δεν είναι ο Θεός όπως είναι στην πραγματικότητα, δεν είναι αυτό που είναι ακόμη και πριν από τη δημιουργία του κόσμου. Δηλαδή αυτό είναι η <strong>εικόνα</strong> του Θεού, και ο Αβραάμ προσκυνά την εικόνα του Θεού:</p><blockquote><p><em>«</em><strong><em>Ὤφθη δὲ αὐτῷ ὁ θεὸς</em></strong><em> πρὸς τῇ δρυὶ τῇ Μαμβρη καθημένου αὐτοῦ ἐπὶ τῆς θύρας τῆς σκηνῆς αὐτοῦ μεσημβρίας. ἀναβλέψας δὲ τοῖς ὀφθαλμοῖς αὐτοῦ εἶδεν, καὶ ἰδοὺ </em><strong><em>τρεῖς ἄνδρες</em></strong><em> εἱστήκεισαν ἐπάνω αὐτοῦ· καὶ ἰδὼν προσέδραμεν εἰς συνάντησιν αὐτοῖς ἀπὸ τῆς θύρας τῆς σκηνῆς αὐτοῦ καὶ </em><strong><em>προσεκύνησεν ἐπὶ τὴν γῆν</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L1-2"><em>Γεν 18:1-2</em></a><em>)</em></p></blockquote><h3>Η προσκύνηση στον άγγελο</h3><blockquote><p><em>«ὁ δὲ εἶπεν αὐτῷ Ἐγὼ ἀρχιστράτηγος δυνάμεως κυρίου νυνὶ παραγέγονα. καὶ Ἰησοῦς </em><strong><em>ἔπεσεν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν</em></strong><em> καὶ εἶπεν αὐτῷ Δέσποτα, τί προστάσσεις τῷ σῷ οἰκέτῃ;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/5/#L14"><em>Ιησ 5:14</em></a><em>)</em></p></blockquote><h3>Η προσκύνηση στον προφήτη</h3><blockquote><p><em>«καὶ εἶδον αὐτὸν οἱ υἱοὶ τῶν προφητῶν οἱ ἐν Ιεριχω ἐξ ἐναντίας καὶ εἶπον Ἐπαναπέπαυται τὸ πνεῦμα Ηλιου ἐπὶ Ελισαιε· καὶ ἦλθον εἰς συναντὴν αὐτοῦ καὶ </em><strong><em>προσεκύνησαν αὐτῷ</em></strong><em> ἐπὶ τὴν γῆν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/4ts/2/#L15"><em>Δ Βασ 2:15</em></a><em>)</em></p></blockquote><h3>Η προσκύνηση στον ναό</h3><blockquote><p><em>«ἐγὼ δὲ ἐν τῷ πλήθει τοῦ ἐλέους σου εἰσελεύσομαι εἰς τὸν οἶκόν σου, </em><strong><em>προσκυνήσω πρὸς ναὸν ἅγιόν σου</em></strong><em> ἐν φόβῳ σου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7"><em>Ψλ 5:7</em></a><em>)</em></p></blockquote><h3>Η προσκύνηση στο υποπόδιο του Θεού (στον ναό)</h3><blockquote><p><em>«ὑψοῦτε κύριον τὸν θεὸν ἡμῶν καὶ </em><strong><em>προσκυνεῖτε</em></strong><em> </em><strong><em>τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ, ὅτι ἅγιός ἐστιν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5"><em>Ψλ 98:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«εἰσελευσόμεθα εἰς τὰ </em><strong><em>σκηνώματα αὐτοῦ, προσκυνήσομεν εἰς τὸν τόπον, οὗ ἔστησαν οἱ πόδες αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7"><em>Ψλ 131:7</em></a><em>)</em></p></blockquote><h3>Η προσκύνηση μπροστά στην Κιβωτό της Διαθήκης</h3><blockquote><p><em>«καὶ διέρρηξεν Ἰησοῦς τὰ ἱμάτια αὐτοῦ, καὶ </em><strong><em>ἔπεσεν Ἰησοῦς ἐπὶ τὴν γῆν ἐπὶ πρόσωπον ἐναντίον κυρίου</em></strong><em> ἕως ἑσπέρας, αὐτὸς καὶ οἱ πρεσβύτεροι Ισραηλ, καὶ ἐπεβάλοντο χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6"><em>Ιησ 7:6</em></a><em>)</em></p></blockquote><h3>Η προσκύνηση στο ραβδί</h3><blockquote><p><em>Για το ραβδί: «εἶπεν δέ Ὄμοσόν μοι. καὶ ὤμοσεν αὐτῷ. καὶ </em><strong><em>προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/47/#L31"><em>Γεν 47:31</em></a><em>) Οι Ο΄ (όπως και στην </em><a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21"><em>Εβρ </em></a><a class="foot-ref" href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21"><em>11</em></a><a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21"><em>:21</em></a><em>) εδώ χρησιμοποιούν τη λέξη </em><strong><em>ῥάβδος</em></strong><em>, δηλαδή μιλούν για το ραβδί του.</em></p></blockquote><p>Κι άλλα παραδείγματα προσκυνήσεων.</p><h3>Γιατί στην Αποκάλυψη ο άγγελος προστάζει να προσκυνήσουμε όχι αυτόν, αλλά τον Θεό</h3><p>Στο όραμα του αποστόλου Ιωάννη ο Θεός είναι ορατά παρών δίπλα· γι’ αυτό θα ήταν παράξενο σε μια τέτοια κατάσταση να αποδίδουμε τιμή στον άγγελο, σαν να είναι αυτός εδώ ο πιο σημαντικός. Σε αυτή την περίπτωση ο άγγελος καλεί να προσκυνήσουμε τον Θεό:</p><blockquote><p>«καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι, <strong>Ὅρα μή· σύνδουλός σού εἰμι</strong> καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· <strong><mark>τῷ θεῷ προσκύνησον</mark></strong>. ἡ γὰρ μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/19/#L10">Απ 19:10</a>)</p></blockquote><blockquote><p>«καὶ λέγει μοι, <strong>Ὅρα μή· σύνδουλός σού εἰμι</strong> καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· <strong><mark>τῷ θεῷ προσκύνησον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L9">Απ 22:9</a>)</p></blockquote><p>Σε άλλη περίπτωση, ο άγγελος δέχεται την προσκύνηση από τον προφήτη Ιησού του Ναυή:</p><blockquote><p><em>«ὁ δὲ εἶπεν αὐτῷ Ἐγὼ ἀρχιστράτηγος δυνάμεως κυρίου νυνὶ παραγέγονα. καὶ Ἰησοῦς </em><strong><em>ἔπεσεν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν</em></strong><em> καὶ εἶπεν αὐτῷ Δέσποτα, τί προστάσσεις τῷ σῷ οἰκέτῃ;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/5/#L14"><em>Ιησ 5:14</em></a><em>)</em></p></blockquote><h2>Οι άγιοι θα τιμηθούν</h2><blockquote><p>«Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον <strong>σκεύη</strong> χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν <strong>εἰς τιμὴν</strong> ἃ δὲ <strong>εἰς ἀτιμίαν</strong>· <strong><mark>ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν</mark></strong> ἀπὸ τούτων, <strong><mark>ἔσται σκεῦος εἰς τιμήν</mark></strong>, ἡγιασμένον, εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L20-21">Β Τιμ 2:20-21</a>)</p></blockquote><blockquote><p>«<strong><mark>δόξα δὲ καὶ τιμὴ</mark> καὶ εἰρήνη παντὶ τῷ <mark>ἐργαζομένῳ τὸ ἀγαθόν</mark></strong>, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L10">Ρωμ 2:10</a>)</p></blockquote><h2>Ο Κύριος υποσχέθηκε να δοξάσει τους δικαίους</h2><blockquote><p><em>«</em>τοὺς δοξάζοντάς με <strong><mark>δοξάσω</mark></strong>, καὶ ὁ ἐξουθενῶν με ἀτιμωθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/2/#L30">Α Βασ 2:30</a>)</p></blockquote><blockquote><p>«ἐὰν ἐμοί τις διακονῇ, ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· <strong>ἐάν τις ἐμοὶ διακονῇ <mark>τιμήσει αὐτὸν ὁ πατήρ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L26">Ιω 12:26</a>)</p></blockquote><blockquote><p>«Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, &lt;…&gt; κἀγὼ <strong><mark>τὴν δόξαν</mark> ἣν δέδωκάς μοι <mark>δέδωκα αὐτοῖς</mark></strong>, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ἕν,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20,22">Ιω 17:20,22</a>)</p></blockquote><blockquote><p>«ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς· οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· <strong>οὓς δὲ ἐδικαίωσεν, <mark>τούτους καὶ ἐδόξασεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L29-30">Ρωμ 8:29-30</a>)</p></blockquote><p>Το να δοξάζεται ο Θεός γίνεται, μεταξύ άλλων, με την εκπλήρωση των προσευχών και με έργα:</p><blockquote><p>«καὶ ὅ τι ἂν <strong>αἰτήσητε</strong> ἐν τῷ ὀνόματί μου <strong><mark>τοῦτο ποιήσω</mark></strong>, <strong><mark>ἵνα δοξασθῇ ὁ πατὴρ</mark></strong> ἐν τῷ <strong>υἱῷ</strong>· ἐάν τι αἰτήσητέ με ἐν τῷ ὀνόματί μου <strong><mark>ἐγὼ ποιήσω</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L13-16">Ιω 14:13-16</a>)</p></blockquote><p>Σε τελική ανάλυση, πάντως, δοξάζεται ο Πατέρας, αν και στον Υιό, δηλαδή δοξάζεται και ο Υιός.</p><h2>Η αναζήτηση της δόξας από τον Θεό</h2><blockquote><p>«πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρὰ ἀλλήλων λαμβάνοντες καὶ <strong><mark>τὴν δόξαν</mark> τὴν <mark>παρὰ τοῦ μόνου θεοῦ</mark> οὐ ζητεῖτε</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L44">Ιω 5:44</a>)</p></blockquote><blockquote><p>«κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας <strong><mark>τοῦ θεοῦ</mark></strong>, <strong>ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ</strong>, τοῖς μὲν <strong><mark>καθ᾿ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν</mark> καὶ ἀφθαρσίαν ζητοῦσιν, ζωὴν αἰώνιον</strong>· τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ, ὀργὴ καὶ θυμός —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L5-8">Ρωμ 2:5-8</a>)</p></blockquote><h2>Η δόξα των αγίων</h2><blockquote><p>«Ἔπρεπεν γὰρ αὐτῷ, δι᾿ ὃν τὰ πάντα καὶ δι᾿ οὗ τὰ πάντα, πολλοὺς υἱοὺς <strong><mark>εἰς δόξαν</mark> <mark>ἀγαγόντα</mark></strong> τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/2/#L10">Εβρ 2:10</a>)</p></blockquote><blockquote><p>«ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ <strong>τὴν δόξαν κυρίου κατοπτριζόμενοι</strong> τὴν αὐτὴν εἰκόνα <strong><mark>μεταμορφούμεθα</mark></strong> <strong><mark>ἀπὸ δόξης εἰς δόξαν</mark></strong>, καθάπερ ἀπὸ κυρίου πνεύματος.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/3/#L18">Β Κορ 3:18</a>)</p></blockquote><blockquote><p>«θλῖψις καὶ στενοχωρία ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος· <strong><mark>δόξα</mark> δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ <mark>ἐργαζομένῳ τὸ ἀγαθόν</mark></strong>, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L9-10">Ρωμ 2:9-10</a>)</p></blockquote><blockquote><p>«καὶ ὑψώσει κέρας λαοῦ αὐτοῦ· <strong><mark>ὕμνος</mark> πᾶσι τοῖς ὁσίοις αὐτοῦ</strong>, τοῖς υἱοῖς Ισραηλ, λαῷ ἐγγίζοντι αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/148/#L14">Ψλ 148:14</a>)</p></blockquote><h2>Η Εκκλησία θα δοξάζει τους δικαίους</h2><blockquote><p>«<strong>Αἰνέσωμεν δὴ ἄνδρας ἐνδόξους</strong> καὶ τοὺς πατέρας ἡμῶν τῇ γενέσει· <strong><mark>πολλὴν δόξαν ἔκτισεν ὁ κύριος</mark></strong>, τὴν μεγαλωσύνην <strong>αὐτοῦ</strong> ἀπ᾿ αἰῶνος.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/44/#L1-2">Σ.Σειρ 44:1-2</a>)</p></blockquote><blockquote><p>«ἀλλ᾿ ἢ οὗτοι ἄνδρες ἐλέους, ὧν αἱ δικαιοσύναι οὐκ ἐπελήσθησαν· μετὰ τοῦ σπέρματος αὐτῶν διαμενεῖ, ἀγαθὴ κληρονομία ἔκγονα αὐτῶν· ἐν ταῖς διαθήκαις ἔστη τὸ σπέρμα αὐτῶν καὶ τὰ τέκνα αὐτῶν δι᾿ αὐτούς· ἕως αἰῶνος μενεῖ σπέρμα αὐτῶν, καὶ <strong><mark>ἡ δόξα αὐτῶν οὐκ ἐξαλειφθήσεται</mark></strong>· <strong>τὰ σώματα αὐτῶν ἐν εἰρήνῃ ἐτάφη, καὶ τὸ ὄνομα αὐτῶν ζῇ εἰς γενεάς</strong>· <strong>σοφίαν αὐτῶν διηγήσονται λαοί</strong>, καὶ <strong><mark>τὸν ἔπαινον ἐξαγγέλλει ἐκκλησία</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/44/#L10-15">Σ.Σειρ 44:10-15</a>)</p></blockquote><h2>Η ανάγκη να μη λησμονούμε τους αγώνες και την πίστη των προκατόχων και να τους μιμούμαστε</h2><blockquote><p>«<strong><mark>Μνημονεύετε</mark> τῶν ἡγουμένων ὑμῶν</strong>, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς <strong><mark>μιμεῖσθε τὴν πίστιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L7">Εβρ 13:7</a>)</p></blockquote><blockquote><p>«παρακαλῶ οὖν ὑμᾶς, <strong><mark>μιμηταί μου γίνεσθε</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L16">Α Κορ 4:16</a>)</p></blockquote><blockquote><p>«<strong><mark>Συμμιμηταί μου γίνεσθε, ἀδελφοί</mark>, καὶ <mark>σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L17">Φιλ 3:17</a>)</p></blockquote><h2>Η επιθυμία για ζωή ανάμεσα στους αγίους</h2><blockquote><p>«εἶπα τῷ κυρίῳ Κύριός μου εἶ σύ, ὅτι τῶν ἀγαθῶν μου οὐ χρείαν ἔχεις. <strong>τοῖς ἁγίοις τοῖς ἐν τῇ γῇ αὐτοῦ ἐθαυμάστωσεν πάντα τὰ θελήματα αὐτοῦ ἐν αὐτοῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/15/#L2-3">Ψλ 15:2-3</a>)</p></blockquote><h2>Το θηρίο της Αποκαλύψεως θα βλασφημήσει τους αγίους</h2><h3>Το θηρίο θα βλασφημήσει όσους κατοικούν στον ουρανό</h3><blockquote><p><em>«καὶ ἤνοιξεν τὸ στόμα αὐτοῦ εἰς βλασφημίας πρὸς τὸν θεόν, </em><strong><em><mark>βλασφημῆσαι</mark></em></strong><em> τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, </em><strong><em><mark>τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/13/#L6"><em>Απ 13:6</em></a><em>)</em></p></blockquote><h3>Στον ουρανό ζουν οι ψυχές των δικαίων και οι άγγελοι</h3><blockquote><p><em>«ἀλλὰ </em><strong><em><mark>προσεληλύθατε</mark></em></strong><em> Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, </em><strong><em><mark>Ἰερουσαλὴμ ἐπουρανίῳ</mark>, καὶ μυριάσιν <mark>ἀγγέλων</mark></em></strong><em>, πανηγύρει καὶ </em><strong><em>ἐκκλησίᾳ πρωτοτόκων ἀπογεγραμμένων ἐν οὐρανοῖς</em></strong><em>, καὶ κριτῇ θεῷ πάντων, καὶ </em><strong><em><mark>πνεύμασι δικαίων</mark> τετελειωμένων</em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-23"><em>Εβρ 12:22-23</em></a><em>)</em></p></blockquote><h2>Κριτική</h2><h3>Πώς γνωρίζει η Εκκλησία ποιος είναι άγιος; Μήπως αποφασίζουν οι άνθρωποι αντί για τον Θεό;</h3><p>Βλ. την απάντηση στην ενότητα «Προσευχή στους αγίους».</p><h3>Ο Θεός δεν θα δώσει τη δόξα Του σε κανέναν</h3><blockquote><p>«ἐγὼ κύριος ὁ θεός, τοῦτό μού ἐστιν τὸ ὄνομα· <strong>τὴν δόξαν μου ἑτέρῳ οὐ δώσω</strong> οὐδὲ τὰς ἀρετάς μου <strong>τοῖς γλυπτοῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/42/#L8">Ησ 42:8</a>)</p></blockquote><p>Πρόκειται για τα είδωλα, δηλαδή για τους ψεύτικους θεούς. Οι πολλές ρήσεις που δείχνουν ότι ο Θεός ο ίδιος δοξάζει τους ανθρώπους αναφέρονται παραπάνω.</p><h2>Σχετικές ρήσεις</h2><ol><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%BB%CE%B5%CE%B9%CF%88%CE%AC%CE%BD%CF%89%CE%BD">η τιμή των λειψάνων των αγίων</a></p></li><li><p>η τιμή των εικόνων (εικονολατρία — εικονομαχία)</p></li><li><p>η προσευχή στους αγίους</p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%9F_%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%BD%CE%B1%CF%8C%CF%82_%CF%84%CE%BF%CF%85_%CE%98%CE%B5%CE%BF%CF%8D">ο άνθρωπος — ναός του Θεού</a></p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%83%CF%8D%CF%83%CF%84%CE%B1%CF%83%CE%B7_%CF%84%CE%BF%CF%85_%CE%B1%CE%BD%CE%B8%CF%81%CF%8E%CF%80%CE%BF%CF%85">η σύσταση του ανθρώπου</a></p></li></ol>'
