  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Στους χριστιανούς δόθηκε όχι μόνο να πιστεύουν, αλλά και να πάσχουν για τον Χριστό</h2><blockquote><p>«στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου, καὶ <strong>μὴ πτυρόμενοι</strong> ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων, ἥτις ἐστὶν αὐτοῖς <strong>ἔνδειξις</strong> ἀπωλείας, ὑμῶν δὲ <strong>σωτηρίας</strong>, καὶ τοῦτο ἀπὸ θεοῦ· ὅτι <strong><mark>ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν, τὸν αὐτὸν ἀγῶνα ἔχοντες</mark></strong> οἷον εἴδετε ἐν ἐμοὶ καὶ νῦν ἀκούετε ἐν ἐμοί.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L27-30">Φιλ 1:27-30</a>)</p></blockquote><h2>Προφητείες για τους διωγμούς εξαιτίας του Χριστού</h2><blockquote><p>«μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν, Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ. <strong>εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς <mark>διώξουσιν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L20">Ιω 15:20</a>)</p></blockquote><blockquote><p>«μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν. <strong>μακάριοί ἐστε ὅταν <mark>ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν</mark> καὶ εἴπωσιν πᾶν πονηρὸν καθ᾿ ὑμῶν [ψευδόμενοι] ἕνεκεν ἐμοῦ</strong>· χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι <strong>ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς</strong>· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L10-12">Μτ 5:10-12</a>)</p></blockquote><blockquote><p>«<strong>μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ <mark>ὀνειδίσωσιν</mark> καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου</strong>· χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ <strong>ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ</strong>· κατὰ τὰ αὐτὰ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L22-23">Λκ 6:22-23</a>)</p></blockquote><h2>Η εκπλήρωση των προφητειών</h2><p>Οι απόστολοι χαίρονταν που έπαθαν για τον Χριστό:</p><blockquote><p>«Οἱ μὲν οὖν ἐπορεύοντο <strong><mark>χαίροντες</mark> ἀπὸ προσώπου τοῦ συνεδρίου ὅτι <mark>κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος ἀτιμασθῆναι</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L41">Πραξ 5:41</a>)</p></blockquote><blockquote><p>«ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι. <strong>ἄχρι τῆς ἄρτι ὥρας</strong> καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· <strong><mark>λοιδορούμενοι</mark></strong> εὐλογοῦμεν, <strong><mark>διωκόμενοι</mark></strong> ἀνεχόμεθα, <strong><mark>δυσφημούμενοι</mark></strong> παρακαλοῦμεν· ὡς περικαθάρματα τοῦ κόσμου ἐγενήθημεν, πάντων περίψημα, ἕως ἄρτι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L10-13">Α Κορ 4:10-13</a>)</p></blockquote><h2>Κάλεσμα να μη φοβόμαστε τα παθήματα για τον Χριστό</h2><blockquote><p>«Ἀγαπητοί, <strong>μὴ ξενίζεσθε</strong> <strong>τῇ ἐν ὑμῖν πυρώσει</strong> πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος, ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι. <strong><mark>εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι</mark></strong>, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ᾿ ὑμᾶς ἀναπαύεται. μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος· <strong><mark>εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω</mark>, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ὀνόματι τούτῳ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L12-16">Α Πε 4:12-16</a>)</p></blockquote><blockquote><p>«Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ζηλωταὶ γένησθε; ἀλλ᾿ <strong>εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι</strong>. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L13-14">Α Πε 3:13-14</a>)</p></blockquote><h2>Η υπόσχεση της ανταμοιβής για την υπομονή στους διωγμούς εξαιτίας του Χριστού</h2><p>Τα παθήματα για τον Χριστό είναι προμήνυμα σωτηρίας:</p><blockquote><p>«στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου, καὶ <strong>μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων</strong>, ἥτις ἐστὶν αὐτοῖς <strong>ἔνδειξις</strong> ἀπωλείας, ὑμῶν δὲ <strong>σωτηρίας</strong>, καὶ τοῦτο ἀπὸ θεοῦ· ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ <strong>τὸ ὑπὲρ αὐτοῦ πάσχειν, τὸν αὐτὸν ἀγῶνα ἔχοντες</strong> οἷον εἴδετε ἐν ἐμοὶ καὶ νῦν ἀκούετε ἐν ἐμοί.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L27-30">Φιλ 1:27-30</a>)</p></blockquote><p>Όποιος πάσχει μαζί με τον Χριστό, θα δοξαστεί μαζί Του:</p><blockquote><p>«εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ <strong>συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L17">Ρωμ 8:17</a>)</p></blockquote><p>Όποιος πεθαίνει μαζί με τον Χριστό, ζει και βασιλεύει μαζί Του. Και όποιος Τον αρνείται, τον αρνείται και ο Χριστός:</p><blockquote><p>«Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ <strong>εὐαγγέλιόν</strong> μου· <strong>ἐν ᾧ</strong> <strong>κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος</strong>, ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται. &lt;…&gt; πιστὸς ὁ λόγος· <strong>εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν· εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L8-12">Β Τιμ 2:8-12</a>)</p></blockquote><p>Μακάριοι όσοι πεθαίνουν εν Κυρίω:</p><blockquote><p>«Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης, Γράψον· <strong>Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες</strong> ἀπ᾿ ἄρτι. ναί, λέγει τὸ πνεῦμα, ἵνα ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν· τὰ γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ᾿ αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L13">Απ 14:13</a>)</p></blockquote><p>Οι ψυχές των σκοτωμένων για τον Χριστό ζουν μαζί Του στον ουρανό:</p><blockquote><p>«Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου <strong>τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ</strong> καὶ διὰ τὴν μαρτυρίαν ἣν εἶχον. καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες, <strong>Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς</strong>; καὶ <strong>ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή</strong>, καὶ ἐρρέθη αὐτοῖς ἵνα ἀναπαύσονται ἔτι χρόνον μικρόν, ἕως <strong>πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ αὐτῶν οἱ μέλλοντες ἀποκτέννεσθαι ὡς καὶ αὐτοί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a>)</p></blockquote>
