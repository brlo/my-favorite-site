  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<blockquote><p>«καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν, Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου. καὶ ἀποκριθεὶς εἶπεν, Λέγω ὑμῖν, <strong>ἐὰν οὗτοι σιωπήσουσιν, οἱ λίθοι κράξουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/19/#L39-40">Λκ 19:39-40</a>)</p></blockquote><blockquote><p>«Τὰ σάββατά μου φυλάξεσθε καὶ <strong>ἀπὸ τῶν ἁγίων μου φοβηθήσεσθε</strong>· ἐγώ εἰμι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>)</p></blockquote><h2>Κατά τη διάρκεια της επίγειας ζωής του Χριστού</h2><p>Ο Χριστός συγκεντρώνει τους μαθητές για την Ευχαριστία σε ένα μεγάλο ανώγειο που έχει ετοιμαστεί:</p><blockquote><p>«καὶ αὐτὸς ὑμῖν δείξει <strong>ἀνάγαιον μέγα</strong> <strong>ἐστρωμένον</strong> ἕτοιμον· καὶ ἐκεῖ ἑτοιμάσατε ἡμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L15">Μκ 14:15</a>)</p></blockquote><p>Οι χριστιανοί, μετά τη σύσταση της Εκκλησίας, συγκεντρώνονται στον ναό:</p><blockquote><p>«<strong><em><mark>καθ᾿ ἡμέραν</mark></em></strong><em> τε προσκαρτεροῦντες </em><strong><em><mark>ὁμοθυμαδὸν ἐν τῷ ἱερῷ</mark></em></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L46">Πραξ 2:46</a>)</p></blockquote><blockquote><p>«<strong><em><mark>διὰ παντὸς ἐν τῷ ἱερῷ</mark></em></strong><em> εὐλογοῦντες τὸν θεόν</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L53">Λκ 24:53</a>)</p></blockquote><h2>Μετά την ανάληψη του Χριστού στον ουρανό</h2><p>Οι χριστιανοί επισκέπτονταν συνεχώς τον ναό:</p><blockquote><p><em>«καὶ ἦσαν διὰ παντὸς </em><strong><em><mark>ἐν τῷ ἱερῷ</mark></em></strong><em> εὐλογοῦντες τὸν θεόν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L53"><em>Λκ 24:53</em></a><em>)</em></p></blockquote><blockquote><p><em>«καθ᾿ ἡμέραν τε </em><strong><em>προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ <mark>ἱερῷ</mark></em></strong><em>, </em><strong><em>κλῶντές τε κατ᾿ οἶκον ἄρτον</em></strong><em>, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L46"><em>Πραξ 2:46</em></a><em>)</em></p></blockquote><blockquote><p><em>«Πέτρος δὲ καὶ Ἰωάννης </em><strong><em>ἀνέβαινον εἰς τὸ <mark>ἱερὸν</mark></em></strong><em> ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/3/#L1"><em>Πραξ 3:1</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ</em><strong><em> προσευχομένου μου ἐν τῷ <mark>ἱερῷ</mark></em></strong><em> γενέσθαι με ἐν ἐκστάσει» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L17"><em>Πραξ 22:17</em></a><em>)</em></p></blockquote><blockquote><p><em>«δυναμένου σου ἐπιγνῶναι ὅτι οὐ πλείους εἰσίν μοι ἡμέραι δώδεκα ἀφ᾿ ἧς ἀνέβην </em><strong><em>προσκυνήσων εἰς Ἰερουσαλήμ</em></strong><em>, καὶ οὔτε </em><strong><em><mark>ἐν</mark></em></strong><em><mark> τῷ </mark></em><strong><em><mark>ἱερῷ</mark></em></strong><em> εὗρόν με πρός τινα διαλεγόμενον ἢ ἐπίστασιν ποιοῦντα ὄχλου οὔτε ἐν ταῖς συναγωγαῖς οὔτε κατὰ τὴν πόλιν» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/24/#L11-12"><em>Πραξ 24:11-12</em></a><em>)</em></p></blockquote><p>Οι χριστιανοί συγκεντρώνονταν επίσης και σε δικούς τους ειδικούς χώρους:</p><blockquote><p><em>«</em><strong><em>ἐνιαυτὸν ὅλον συναχθῆναι ἐν τῇ <mark>ἐκκλησίᾳ</mark></em></strong><em> καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/11/#L26"><em>Πραξ 11:26</em></a><em>)</em></p></blockquote><blockquote><p><em>«πρῶτον μὲν γὰρ </em><strong><em>συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ</em></strong><em> ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω. &lt;…&gt; Συνερχομένων οὖν ὑμῶν ἐπὶ τὸ αὐτὸ οὐκ ἔστιν κυριακὸν δεῖπνον φαγεῖν, ἕκαστος γὰρ τὸ ἴδιον δεῖπνον προλαμβάνει ἐν τῷ φαγεῖν, καὶ ὃς μὲν πεινᾷ, ὃς δὲ μεθύει. </em><strong><em>μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν;</em></strong><em> ἢ </em><strong><em>τῆς <mark>ἐκκλησίας</mark> τοῦ θεοῦ καταφρονεῖτε</em></strong><em>, καὶ καταισχύνετε τοὺς μὴ ἔχοντας;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L18-22"><em>Α Κορ 11:18-22</em></a><em>)</em></p></blockquote><blockquote><p><em>«αἱ γυναῖκες </em><strong><em>ἐν ταῖς <mark>ἐκκλησίαις</mark></em></strong><em> σιγάτωσαν, οὐ γὰρ ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει. εἰ δέ τι μαθεῖν θέλουσιν, </em><strong><em>ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν</em></strong><em>, </em><strong><em>αἰσχρὸν γάρ ἐστιν γυναικὶ λαλεῖν ἐν <mark>ἐκκλησίᾳ</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L34-35"><em>Α Κορ 14:34-35</em></a><em>)</em></p></blockquote><h2>Η προφητική εικόνα του ουράνιου ναού</h2><p>Η απεικόνιση του ουράνιου ναού στην Αποκάλυψη</p><p><strong>Η εντολή να μετρηθεί ο ουράνιος ναός</strong></p><blockquote><p><em>«Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων, Ἔγειρε καὶ </em><strong><em>μέτρησον τὸν <mark>ναὸν τοῦ θεοῦ</mark></em></strong><em> καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/11/#L1"><em>Απ 11:1</em></a><em>)</em></p></blockquote><p><strong>Ο θρόνος</strong></p><blockquote><p><em>«πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον </em><strong><em>τοῦ καθημένου ἐπὶ τοῦ <mark>θρόνου</mark></em></strong><em> καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/4/#L10"><em>Απ 4:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἳ ἐνώπιον τοῦ θεοῦ κάθηνται ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/11/#L16"><em>Απ 11:16</em></a><em>)</em></p></blockquote><p><strong>Το θυσιαστήριο</strong></p><blockquote><p><em>«Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ </em><strong><em>τοῦ <mark>θυσιαστηρίου</mark></em></strong><em> ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ </em><strong><em><mark>θυσιαστήριον</mark> τὸ χρυσοῦν</em></strong><em> τὸ </em><strong><em>ἐνώπιον τοῦ θρόνου</em></strong>.<em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3"><em>Απ 8:3</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν </em><strong><em>ἐκ τοῦ πυρὸς τοῦ <mark>θυσιαστηρίου</mark></em></strong><em> καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L5"><em>Απ 8:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ τῶν κεράτων </em><strong><em>τοῦ <mark>θυσιαστηρίου</mark> τοῦ χρυσοῦ</em></strong><em> τοῦ ἐνώπιον τοῦ θεοῦ» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/9/#L13"><em>Απ 9:13</em></a><em>)</em></p></blockquote><p><strong>Η επτάφωτη λυχνία</strong></p><blockquote><p><em>«καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ </em><strong><em><mark>ἑπτὰ λαμπάδες</mark> πυρὸς </em></strong><em>καιόμεναι</em><strong><em> ἐνώπιον τοῦ θρόνου</em></strong><em>, ἅ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/4/#L5"><em>Απ 4:5</em></a><em>)</em></p></blockquote><p><strong>Το θυμίαμα</strong></p><blockquote><p><em>«Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων </em><strong><em>λιβανωτὸν χρυσοῦν</em></strong><em>, καὶ ἐδόθη αὐτῷ </em><strong><em><mark>θυμιάματα</mark> πολλὰ</em></strong><em> ἵνα δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου. &lt;…&gt; καὶ </em><strong><em>εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν</em></strong><em>, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3,5"><em>Απ 8:3,5</em></a><em>)</em></p></blockquote><h2>Ο Θεός πρόσταξε να τιμούμε τον ναό</h2><p>Ο ναός είναι <a href="https://bibleox.com/el/el/w/Ο_ναός_είναι_εικόνα_της_ουράνιας_πραγματικότητας">εικόνα της ουράνιας πραγματικότητας</a>. Ο Θεός πρόσταξε να τιμούμε αυτή την εικόνα:</p><blockquote><p>«Τὰ σάββατά μου φυλάξεσθε καὶ <strong>ἀπὸ τῶν ἁγίων μου φοβηθήσεσθε</strong>· ἐγώ εἰμι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a>)</p></blockquote><blockquote><p>«τὰ σάββατά μου φυλάξεσθε καὶ <strong>ἀπὸ τῶν ἁγίων μου φοβηθήσεσθε</strong>· ἐγώ εἰμι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>)</p></blockquote><p>Ο ναός της Καινής Διαθήκης είναι κατασκευασμένος σύμφωνα με το πρότυπο που δίνεται στην Αποκάλυψη του Ιωάννη του Θεολόγου.</p><h2>Κριτική</h2><h3>Οι απόστολοι επισκέπτονταν τον ναό επειδή δεν καταλάβαιναν;</h3><p>Συνέβαινε οι απόστολοι να μην καταλαβαίνουν καλά όλα τα ζητήματα της πίστης. Για παράδειγμα, νόμιζαν ότι ο Χριστός πηγαίνει να γίνει βασιλιάς στα Ιεροσόλυμα (Μκ 10:37-39), ενώ τα λόγια του Χριστού για τα πάθη και την ανάσταση δεν τα καταλάβαιναν, επειδή φοβόνταν να ρωτήσουν (Μκ 9:31-32 · Λκ 9:45).</p><p>Ωστόσο όλα αυτά συνέβησαν μόνο πριν από την αποστολή σε αυτούς των δωρεών του Αγίου Πνεύματος την ημέρα της ανάστασης του Χριστού (Ιω 20:21-23), καθώς και την πεντηκοστή ημέρα μετά την ανάσταση (Πραξ 2:1-4). Επιπλέον, μετά την ανάσταση, ο Χριστός άνοιξε τον νου τους για να κατανοήσουν τις Γραφές (Λκ 24:45). Ο Χριστός, ακόμη και πριν από την ανάσταση, υποσχέθηκε να δώσει στους αποστόλους σοφία την οποία δεν θα μπορούν να αντικρούσουν (Λκ 21:15), για την οποία ο απόστολος αργότερα αναφέρει ότι ο Θεός τους έδωσε τη χάρη με κάθε σοφία και γνώση (Εφ 1:8). Ο απόστολος Παύλος αναφέρει ότι μπορεί να είναι αμαθής στον λόγο (δυσκολεύεται να εκφραστεί), αλλά όχι στη γνώση (Β Κορ 11:6).</p><p>Όταν οι προτεστάντες θέλουν να δείξουν την «ανώτερη» φώτισή τους στα ζητήματα της πίστης από εκείνη των αποστόλων, τότε αναφέρονται σε διάφορες περιπτώσεις πριν από την κάθοδο του Αγίου Πνεύματος στους αποστόλους. Ωστόσο, αυτό δεν είναι σωστό, διότι η Εκκλησία δημιουργείται και οργανώνεται αργότερα, όταν οι απόστολοι δεν έχουν πλέον περιπτώσεις παρανόησης της πίστης.</p><p>Επομένως, μετά την αποστολή του Αγίου Πνεύματος, οι απόστολοι καταλάβαιναν τα ζητήματα της πίστης και δεν είχαν έλλειψη γνώσης. Ακόμη και αν υπήρχε κάποια παρανόηση, ο Κύριος δεν εξαφανίστηκε· καθοδηγούσε τους αποστόλους. Έτσι, για παράδειγμα, μέσω οράματος έδειξε στον απόστολο Πέτρο ότι έπρεπε να βαπτίσει τον εκατόνταρχο Κορνήλιο — δηλαδή έναν μη Ιουδαίο, αν και τότε αυτό προκαλούσε απορία σε μερικούς στην Εκκλησία.</p><h3>Πρέπει να λατρεύουμε τον Θεό όχι στον ναό, αλλά εν πνεύματι και αληθεία;</h3><p>Αν ακολουθήσουμε τη Γραφή, αυτή η συζήτηση δεν αφορά τους ναούς, αλλά τον τόπο της λατρείας.</p><blockquote><p>«λέγει αὐτῷ ἡ γυνή, Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ. οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν <strong><u>ὁ τόπος</u> ὅπου προσκυνεῖν δεῖ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L19-20">Ιω 4:19-20</a>)</p></blockquote><p>Η Σαμαρείτισσα με την ερώτησή της θέτει στον Χριστό ένα δίλημμα: πού πρέπει να λατρεύουμε;</p><ul><li><p>στο όρος Γαριζίν·</p></li><li><p>στον ναό των Ιεροσολύμων.</p></li></ul><p>Αλλά ο Χριστός λέει ότι έρχεται καιρός (και έχει ήδη έρθει) κατά τον οποίο δεν θα λατρεύουν ούτε στο όρος ούτε στα Ιεροσόλυμα, αλλά εν πνεύματι και αληθεία:</p><blockquote><p>«λέγει αὐτῇ ὁ Ἰησοῦς, Πίστευέ μοι, γύναι, ὅτι <strong><u>ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε</u></strong> τῷ πατρί. ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε· ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν. ἀλλὰ <strong><u>ἔρχεται ὥρα, καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ</u></strong>· καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L21-23">Ιω 4:21-23</a>)</p></blockquote><p>Εδώ, όπως μπορεί να παρατηρήσει κανείς, δεν γίνεται λόγος για ναούς. Και αν κάποιος θεωρήσει ότι γίνεται λόγος για ναούς, τότε ας απαγορεύσει να προσεύχονται και στα βουνά, επειδή ο Χριστός μιλάει και για το όρος. Και τότε εκείνοι που απαγορεύουν τους ναούς θα απαγορεύσουν και τα βουνά: ζεις στο βουνό; — μην προσεύχεσαι. Αλλά αυτό, φυσικά, δεν είναι λογικό.</p><p>Αξίζει να προσέξουμε και το ότι ο Χριστός λέει πως ο καιρός αυτής της λατρείας έχει ήδη φτάσει. Και παρ’ όλα αυτά, ο Χριστός έρχεται στον ναό των Ιεροσολύμων, τον αποκαλεί οίκο του Πατέρα και οίκο προσευχής, δείχνοντας φροντίδα ώστε τίποτα να μην εμποδίζει εκεί την προσευχή.</p><p>Δηλαδή, αν και ο καιρός της λατρείας εν πνεύματι και αληθεία έχει ήδη φτάσει, αυτό δεν κατάργησε τον ναό. Ωστόσο, ο Χριστός εγκατέλειψε αυτόν τον οίκο κενό μόνο τότε, όταν, μετά την απόρριψη του Σωτήρα από την πλειονότητα του Ισραήλ, αφαίρεσε τον αμπελώνα από τους παλαιούς μισθωτούς (την ιερωσύνη της Παλαιάς Διαθήκης) και τον έδωσε σε άλλους — στους αποστόλους, λέγοντας σε εκείνους που απέρριψε ότι ο οίκος τους αφήνεται έρημος, δηλαδή η χάρη του Θεού τον εγκαταλείπει:</p><blockquote><p>«ἰδοὺ <strong><u>ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ἔρημος</u></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L38">Μτ 23:38</a>)</p></blockquote><p>Σύμβολο αυτού έγιναν οι ραγισμένες πέτρες και το σχισμένο καταπέτασμα, μετά τον θάνατο του Χριστού στον σταυρό:</p><blockquote><p>«Καὶ ἰδοὺ <strong><u>τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ἀπ᾿ ἄνωθεν ἕως κάτω εἰς δύο, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν</u></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L51">Μτ 27:51</a>)</p></blockquote><p>Από τότε οι χριστιανοί προσεύχονταν σε οποιοδήποτε μέρος του σύμπαντος και παντού πρόσφεραν νέες θυσίες στην Ευχαριστία: σε κτίρια και έξω από κτίρια.</p><h3>Γιατί χρειάζονται οι ναοί; Αφού το καταπέτασμα σχίστηκε (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L51">Μτ 27:51</a>), μήπως ο Θεός έφυγε από τον ναό;</h3><p>Για τη σωτηρία οι ναοί (ως κτίρια από πέτρες) δεν χρειάζονται. Πλήθος αγίων της Ορθόδοξης Εκκλησίας σώζονταν στις ερήμους. Ωστόσο, για τη σωτηρία είναι απαραίτητη η συμμετοχή στα μυστήρια, τα οποία τελούνται στις ακολουθίες, και για την τέλεσή τους, για φυσικούς λόγους, χρειάζονται κτίρια. Εξάλλου, όταν είναι αναγκαίο, η Ορθόδοξη Εκκλησία τα καταφέρνει και χωρίς κτίρια.</p><p>Εφόσον υπάρχει το κτίριο, η Εκκλησία το θεωρεί τόπο αφιερωμένο στον Θεό, δηλαδή ναό. Σε αυτόν τον τόπο οι άνθρωποι επικαλούνται το όνομα του Θεού, εδώ στα μυστήρια φανερώνεται η θεία χάρη, εδώ είναι ο ίδιος ο Χριστός στο μυστήριο της Ευχαριστίας. Γι’ αυτό οι Ορθόδοξοι τιμούν ιδιαίτερα τέτοιους τόπους, ως τόπο φανέρωσης του Θεού, καθώς ο ίδιος ο Θεός απαιτεί να αντιμετωπίζουμε με σεβασμό τους τόπους όπου Αυτός φανερώνεται (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L5">Έξ 3:5</a>), μεταξύ άλλων απαιτεί να τιμούμε τον ναό (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>).</p><p>Το σχισμένο καταπέτασμα του ναού της Παλαιάς Διαθήκης δείχνει την κατάργηση της Εκκλησίας της Παλαιάς Διαθήκης: δείχνει ότι ο ναός στα Ιεροσόλυμα εγκαταλείφθηκε από τον Θεό ως τόπος συνάντησης της Εκκλησίας της Παλαιάς Διαθήκης (του Ισραήλ) με τον Θεό. Από την Εκκλησία της Παλαιάς Διαθήκης αφαιρέθηκε ο αμπελώνας (<a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L43">Μτ 21:43</a>) και δόθηκε στην Εκκλησία της Καινής Διαθήκης, που τη σύστησε ο Χριστός, αλλάζοντας τη Διαθήκη και την ιερωσύνη (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L12">Εβρ 7:12</a>).</p><p>Η Εκκλησία της Καινής Διαθήκης δεν χρησιμοποιεί τον εγκαταλειμμένο ναό της Εκκλησίας της Παλαιάς Διαθήκης, δεν τελεί εκεί λατρεία και δεν περιμένει ότι ο Θεός θα της φανερωθεί εκεί.</p><h3>Ο ναός ήταν ένας και καταστράφηκε, άρα δεν επιτρέπεται να χτίζουμε ναούς;</h3><p>Ο ναός δεν καταστράφηκε για πρώτη φορά. Ήταν ήδη ο δεύτερος ναός. Και πριν από αυτόν υπήρχε φορητός ναός — η Σκηνή του Μαρτυρίου, την οποία οι Ισραηλίτες μετακινούσαν στην έρημο του Σινά. Όταν ο Ναβουχοδονόσορ κατέστρεψε τον ναό για πρώτη φορά, μήπως αυτό σημαίνει ότι ο Θεός απέρριψε τη δυνατότητα λατρείας στους ναούς; Αν όχι, τότε γιατί θα έπρεπε να ισχύει αυτό αργότερα, όταν το έπραξαν ξανά οι Ρωμαίοι;</p><p>Οι Ιουδαίοι που απέρριψαν τον Χριστό νόμιζαν ότι μπορούμε να προσευχόμαστε και να λατρεύουμε τον Θεό μόνο στον ναό των Ιεροσολύμων. Κάλεσαν σε δίκη στο συνέδριο τον πρωτομάρτυρα αρχιδιάκονο Στέφανο, κατηγορώντας τον ότι διδάσκει πως αυτός ο τόπος θα καταστραφεί και τα έθιμα θα αλλάξουν (Πραξ 6:13-14). Η απολογητική ομιλία του αρχιδιακόνου συνίστατο στο να δείξει, απαριθμώντας λεπτομερώς την ιστορία των προπατόρων, ότι προσεύχονταν και πρόσφεραν θυσίες στον Θεό παντού: όπου κι αν βρίσκονταν, ο Θεός ήταν μαζί τους (Πραξ 7:2-53).</p><p>Στο τέλος επισημαίνει ότι και αυτόν τον ναό τον έκτισε ο Σολομών, σύμφωνα με την επιθυμία και την προσευχή του προπάτορα Δαβίδ, αν και ο Θεός είχε δείξει καθαρά ότι δεν έχει ανάγκη από την οικοδόμηση οίκου γι’ Αυτόν:</p><blockquote><p>«<strong><u>ὃς</u> εὗρεν χάριν ἐνώπιον τοῦ θεοῦ</strong> καὶ <strong><u>ᾐτήσατο εὑρεῖν σκήνωμα τῷ οἴκῳ Ἰακώβ</u></strong>. Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον. <strong><u>ἀλλ᾿ οὐχ ὁ ὕψιστος ἐν χειροποιήτοις κατοικεῖ</u></strong>· καθὼς ὁ προφήτης λέγει, Ὁ οὐρανός μοι θρόνος, ἡ δὲ γῆ ὑποπόδιον τῶν ποδῶν μου· <strong><u>ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;</u></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L46-49">Πραξ 7:46-49</a>)</p></blockquote><p>Επομένως, και πριν από τη σύναψη της Παλαιάς Διαθήκης οι δίκαιοι προσεύχονταν και πρόσφεραν θυσίες παντού. Αργότερα, ο Θεός καθιέρωσε για τον Ισραήλ μια κεντρική μορφή λατρείας με έναν ναό και έναν αρχιερέα, επειδή γεωγραφικά ήταν πάντοτε κοντά. Αυτή η μορφή λατρείας έπρεπε να εξασφαλίζει την ενότητα που επιθυμούσε ο Θεός.</p><p>Αλλά όταν ο Κύριος, σύμφωνα με την προφητεία (Ησ 66:18-21), καλεί στην Εκκλησία όλα τα έθνη, δημιουργεί και τις συνθήκες για την τέλεση της λατρείας ανάμεσα σε όλα τα έθνη παντού. Ο ίδιος γίνεται αρχιερέας (παντού παρών ως Θεός), στέλνει τη χάρη και δίνει εξουσία όχι σε έναν μόνο, αλλά σε πολλούς αποστόλους (Μτ 18:18), χωρίς να δεσμεύει την Ευχαριστιακή θυσία σε κάποια τοποθεσία (Λκ 22:19), στέλνοντας τους αποστόλους σε όλο τον κόσμο (Μκ 16:15).</p><p>Γύρω από την Ευχαριστία οικοδομείται η λατρεία των χριστιανών. Ο ναός δεν χρειάζεται γι’ αυτό. Όσοι λένε για τους Ορθοδόξους ότι για την τέλεση της λατρείας χρειαζόμαστε οπωσδήποτε ναό, επινοούν για εμάς πράγματα που δεν διδάσκουμε. Η λατρεία, όταν είναι ανάγκη, τελείται σε οποιονδήποτε τόπο: στο νοσοκομείο, στον στρατό, στη φυλακή, σε ταξίδι με πλοίο, αεροπλάνο, τρένο, στο δάσος.</p><p>Δεν διδάσκουμε ότι οι ναοί (ως κτίρια από πέτρες) χρειάζονται για τη σωτηρία. Πλήθος αγίων της Ορθόδοξης Εκκλησίας σώζονταν στις ερήμους. Ωστόσο, για τη σωτηρία είναι απαραίτητη η συμμετοχή στα μυστήρια, τα οποία τελούνται στις ακολουθίες, και για την τέλεσή τους, για φυσικούς λόγους, χρειάζονται κτίρια. Όταν είναι ανάγκη, η Ορθόδοξη Εκκλησία τα καταφέρνει και χωρίς κτίρια.</p><p>Εφόσον υπάρχει το κτίριο, η Εκκλησία το θεωρεί τόπο αφιερωμένο στον Θεό, δηλαδή ναό. Σε αυτόν τον τόπο οι άνθρωποι επικαλούνται το όνομα του Θεού, εδώ στα μυστήρια φανερώνεται η θεία χάρη, εδώ είναι ο ίδιος ο Χριστός στο μυστήριο της Ευχαριστίας. Γι’ αυτό οι Ορθόδοξοι τιμούν ιδιαίτερα τέτοιους τόπους, ως τόπο φανέρωσης του Θεού, καθώς ο ίδιος ο Θεός απαιτεί να αντιμετωπίζουμε με σεβασμό τους τόπους όπου Αυτός φανερώνεται:</p><blockquote><p>«καὶ εἶπεν Μὴ ἐγγίσῃς ὧδε· λῦσαι τὸ ὑπόδημα ἐκ τῶν ποδῶν σου· ὁ γὰρ <strong><u>τόπος, ἐν ᾧ σὺ ἕστηκας, γῆ ἁγία ἐστίν</u></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L5">Έξ 3:5</a>)</p></blockquote><p>Απαιτεί επίσης να τιμούμε και τον ναό Του (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>).</p><p>Η Εκκλησία του Χριστού της Καινής Διαθήκης δεν διδάσκει ότι μπορεί κανείς να λατρεύει μόνο στα Ιεροσόλυμα, μόνο στο όρος των Σαμαρειτών ή ακόμη και μόνο στον ναό. Παντού μπορεί κανείς να λατρεύει τον Θεό και να προσεύχεται σε Αυτόν.</p><hr><p>Οι Ορθόδοξοι δεν χτίζουν ναούς για να εισέλθουν στην Παλαιά Διαθήκη ή για να εκπληρώσουν τον Νόμο του Μωυσή. Η Παλαιά Διαθήκη έχει τελειώσει και ο Νόμος του Μωυσή έχει καταργηθεί.</p><p>Χτίζουμε χώρους για κοινές συνάξεις, στους οποίους προσευχόμαστε και προσφέρουμε θυσία. Την οικοδόμηση τέτοιων χώρων κανείς ποτέ δεν την απαγόρευσε.</p><p>Ο ναός της Παλαιάς Διαθήκης είναι σημαντικός ως ιδέα. Ο Θεός πρόσταξε να τον οικοδομήσουν κατ’ αναλογία με την ουράνια πραγματικότητα. Δηλαδή ο ναός, κατά τον σχεδιασμό, έπρεπε να είναι εικόνα του ουρανού.</p><p>Λεπτομερώς, με όλες τις απαραίτητες αναφορές στη Γραφή: <a href="https://bibleox.com/el/el/w/Ο_ναός_είναι_εικόνα_της_ουράνιας_πραγματικότητας">https://bibleox.com/el/el/w/Ο_ναός_είναι_εικόνα_της_ουράνιας_πραγματικότητας</a></p><p>Στους χρόνους της Παλαιάς Διαθήκης ο Θεός ήταν αόρατος και στον ουρανό υπήρχαν μόνο οι άγγελοι.</p><p>Στην Καινή Διαθήκη ο Χριστός Θεός βασιλεύει ορατά στον ουρανό και, εκτός από τους αγγέλους, εκεί βρίσκονται πλέον και άνθρωποι. Γι’ αυτό, όταν οι χριστιανοί αποκτούν χώρους για συνάξεις, τους διαμορφώνουν σύμφωνα με το ίδιο σχέδιο του Θεού όπως και πριν — ώστε ο ναός να απεικονίζει τον ουρανό.</p><p>Εφόσον ο ουρανός άλλαξε, άλλαξε και ο ναός. Στον ναό τώρα απεικονίζεται ο ενσαρκωμένος Θεός και, εκτός από τους αγγέλους, απεικονίζονται και άλλοι κάτοικοι του ουρανού — οι δίκαιοι άνθρωποι.</p><p>Ο Θεός δεν δημιούργησε ποτέ κενούς και χωρίς νόημα χώρους, όπως συχνά απαιτούν οι προτεστάντες. Τον ίδιο τον κόσμο τον έφτιαξε έτσι ώστε, κοιτάζοντάς τον, να μάθουμε κάτι για τον Δημιουργό του. Δηλαδή ο κόσμος μάς κηρύττει. Και ο ναός είναι διαμορφωμένος έτσι ώστε να κηρύττει για τον Χριστό και τη Βασιλεία Του των Ουρανών, και όχι για άδειους λευκούς τοίχους.</p><h3>Ναοί προς τιμήν εικόνων</h3><p>Οι ορθόδοξοι ναοί χτίζονται μόνο στο όνομα του Θεού. Στο εσωτερικό τους τελείται λατρεία μόνο προς τον Θεό. Το 95% των προσευχών αναπέμπεται στον Θεό, οι υπόλοιπες — στους αγίους Του: στους αγγέλους και στους δικαίους στον ουρανό.</p><p>Κάθε ναός συνδέεται με ιερές αναμνήσεις. Για παράδειγμα, υπάρχουν ναοί προς τιμήν της Μεταμόρφωσης του Χριστού ή της Ανάληψης του Χριστού. Αυτό δεν σημαίνει ότι εκεί προσεύχονται στα γεγονότα της Ανάληψης και της Μεταμόρφωσης. Υπάρχουν επίσης ναοί στους οποίους μνημονεύουν πώς δόθηκε η μία ή η άλλη εικόνα (με θαυματουργικό τρόπο) ή πώς συνδέθηκε με μια εικόνα η απελευθέρωση μιας πόλης από τους εχθρούς. Αυτές είναι ιερές αναμνήσεις. Όταν ένας ναός ονομάζεται προς τιμήν μιας ιερής ανάμνησης, αυτό δεν σημαίνει ότι εκεί προσεύχονται στην ιερή ανάμνηση. Η λατρεία σε όλους τους ναούς είναι η ίδια.</p>'
