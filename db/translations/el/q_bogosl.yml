  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ορισμός</h2><p><strong>Τάξη</strong> είναι η καθιερωμένη διάταξη μιας επαναλαμβανόμενης πράξης. Κάθε τι που είναι τακτοποιημένο μπορεί να ονομαστεί τάξη.</p><p><strong>Ακολουθία</strong> – η διαδοχική και λεπτομερής έκθεση του περιεχομένου μιας λατρείας.</p><p>Η τέλεση των μυστηρίων γίνεται επίσης σύμφωνα με την καθιερωμένη τάξη ή, αλλιώς, την ακολουθία.</p><h2>Στην Εκκλησία όλα πρέπει να γίνονται με τάξη</h2><blockquote><p>«πάντα δὲ εὐσχημόνως καὶ <strong>κατὰ τάξιν</strong> γινέσθω.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L40">Α Κορ 14:40</a>)</p></blockquote><blockquote><p>«Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου Ἰησοῦ Χριστοῦ, στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ <strong>ἀτάκτως</strong> περιπατοῦντος καὶ μὴ κατὰ τὴν παράδοσιν ἣν παρελάβοσαν παρ᾿ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L6">Β Θεσ 3:6</a>)</p></blockquote><blockquote><p>«ἀκούομεν γάρ τινας περιπατοῦντας ἐν ὑμῖν <strong>ἀτάκτως</strong>, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L11">Β Θεσ 3:11</a>)</p></blockquote>
